  ## 内容搜索 Web 部件


  `内容搜索 Web 部件`是 SharePoint 2013 中新增的另一个得力工具。当页面上放置了`内容搜索 Web 部件`时，用户加载页面时它会自动发出搜索查询。根据
  Web 部件的配置方式，用户很可能甚至不知道正在进行搜索。这使得`内容搜索 Web 部件`成为基于搜索创建自定义解决方案的强大方式。这是一个易于使用和配置的 Web
  部件，如您在前一节中所见，为您的需求设置特定的搜索查询也非常容易。


  **注意**


  `内容搜索 Web 部件`作为`搜索 Web 部件`功能的一部分提供。此功能仅适用于 SharePoint Online E3 和 E4 计划，以及本地企业许可版本。如果您没有这些计划或许可证，您会发现`内容搜索
  Web 部件`无法用于向页面添加新 Web 部件。有关 SharePoint Online 计划可用功能的更多信息，请访问 `http://technet.microsoft.com/en-us/library/sharepoint-online-service-description.aspx`。


