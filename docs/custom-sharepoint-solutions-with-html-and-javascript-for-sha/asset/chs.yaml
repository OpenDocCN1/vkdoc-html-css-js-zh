  \ 旁边的 + 图标，你可以展开它查看其属性。继续单击 + 图标，直到你看到结果，如图 4-40 所示。\n\n![A978-1-4842-0544-0_4_Fig40_HTML.jpg](img/A978-1-4842-0544-0_4_Fig40_HTML.jpg)\n\
