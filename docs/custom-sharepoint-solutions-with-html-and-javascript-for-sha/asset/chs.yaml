  图 6-27. 下载现有显示模板的副本


  下载副本后，您可以在 Visual Studio 中打开它。查看此文档，您会发现它有点复杂。它有一个 `HEAD` 部分、一个 `TITLE` 和一个 `BODY`——正如您对
  HTML 文档的预期一样——以及大量的渲染代码。实际的渲染发生在 `BODY` 中。您会注意到 `BODY` 内部有几个包含所有逻辑的 `DIV`。Visual
  Studio 中的文件如图 6-28 所示。


  ![A978-1-4842-0544-0_6_Fig28_HTML.jpg](img/A978-1-4842-0544-0_6_Fig28_HTML.jpg)


