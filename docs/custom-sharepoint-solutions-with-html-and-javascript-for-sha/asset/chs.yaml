  \n图 9-17. 通过 REST 删除文件\n\n## 使用网站\n\n在 SharePoint 中创建新网站是一项常见任务。在本节中，我们将了解如何使用 REST\
  \ API 创建和删除网站。前面的示例已经充分展示了 REST API 的强大功能，而本节将进一步强调它在开发工作中为您提供的巨大潜力。\n\n### 创建网站\n\
  \n在本示例中，我们将创建一个新网站并设置其多个属性。\n\n#### HTML\n\n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为\
  \ `RESTCreateSite.html`。此页面的标记包含一个文本框，供用户输入新网站的名称，以及一个用于输入网站描述的文本框。它包含以下代码行：\n\n\
  ```\n<script type=\"text/javascript\" src=\"/apress/Webparts/chapter 9/RESTCreateSite.js\"\
  ></script>\n```\n\n```\n<div id=\"DeleteFile\">\n    <div>\n        <strong>输入网站名称：</strong>\n\
  \        <br />\n        <input type=\"text\" id=\"txtSiteTitle\" />\n    </div>\n\
  \    <br />\n    <div>\n        <strong>输入网站描述：</strong>\n        <br />\n     \
  \   <textarea cols=\"20\" id=\"txtSiteDescription\"></textarea>\n    </div>\n  \
  \  <br />\n    <input type=\"button\" id=\"btnSubmit\" value=\"提交\" />\n</div>\n\
  ```\n\n```\n<div id=\"divResults\"></div>\n```\n\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您的所有注意事项，将给定的英文文本翻译成高质量的中文。\n\
  \n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript 文件，命名为 `RESTCreateSite.js`。包含以下代码：\n\
  \n```javascript\n$(function () {\n    bindButtonClick();\n});\n\nfunction bindButtonClick()\
  \ {\n    $(\"#btnSubmit\").on(\"click\", function () {\n        createSite();\n\
  \    });\n}\n\nfunction createSite() {\n    var newSiteTitle = $(\"#txtSiteTitle\"\
  ).val();\n    var newSiteDesc = $(\"#txtSiteDescription\").val();\n    var newSiteUrl\
  \ = newSiteTitle.replace(/\\s/g, \"\");\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \    var fullUrl = siteUrl + \"/_api/web/webinfos/add\";\n    $.ajax({\n       \
  \ url: fullUrl,\n        type: \"POST\",\n        data: JSON.stringify({\n     \
  \       'parameters': {\n                '__metadata':  {'type': 'SP.WebInfoCreationInformation'\
  \ },\n                'Url': newSiteUrl,\n                'Title': newSiteTitle,\n\
  \                'Description': newSiteDesc,\n                'Language':1033,\n\
  \                'WebTemplate':'sts#0',\n                'UseUniquePermissions':\
  \ false\n            }\n        }),\n        headers: {\n            \"accept\"\
  : \"application/json;odata=verbose\",\n            \"content-type\": \"application/json;odata=verbose\"\
  ,\n            \"X-RequestDigest\": $(\"#__REQUESTDIGEST\").val()\n        },\n\
  \        success: onQuerySucceeded,\n        error: onQueryFailed\n    });\n}\n\n\
  function onQuerySucceeded() {\n    $(\"#divResults\").html(\"Site successfully created!\"\
  );\n}\n\nfunction onQueryFailed(sender, args) {\n    alert('Error!');\n}\n```\n\n\
  创建一个新站点需要更多的代码，但到如今这些代码对于您来说应该已经很熟悉了。首先，我们获取用户提交的标题和描述。这通过以下几行代码完成：\n\n```javascript\n\
  var newSiteTitle = $(\"#txtSiteTitle\").val();\nvar newSiteDesc = $(\"#txtSiteDescription\"\
  ).val();\nvar newSiteUrl = newSiteTitle.replace(/\\s/g, \"\");\n```\n\n创建站点时，除了标题以外，还必须为站点提供\
  \ URL。在本例中，我们只需使用用户为标题输入的文本，并移除所有空格以构成 URL。这是通过 JavaScript 中的 `replace()` 方法完成的，第一个参数是我们要搜索的内容，第二个参数是要替换成的文本。`/\\\
  s/g` 表示一个空格，必须使用此表达式才能使此函数正常工作。\n\n获取站点创建所需的变量后，我们创建 REST URL，但这次我们针对站点的 `Webinfos`\
  \ 集合：\n\n```javascript\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\nvar fullUrl\
  \ = siteUrl + \"/_api/web/webinfos/add\";\n```\n\n与创建新文件夹时类似，我们针对的是与站点最终所在位置不同的位置。我们还在\
  \ URL 中包含了 `add` 命令；这与之前其他的创建脚本不同。接下来，我们在 jQuery 中创建 AJAX 调用：\n\n```javascript\n\
  $.ajax({\n    url: fullUrl,\n    type: \"POST\",\n    data: JSON.stringify({\n \
  \       'parameters': {\n            '__metadata':  {'type': 'SP.WebInfoCreationInformation'\
  \ },\n            'Url': newSiteUrl,\n            'Title': newSiteTitle,\n     \
  \       'Description': newSiteDesc,\n            'Language':1033,\n            'WebTemplate':'sts#0',\n\
  \            'UseUniquePermissions': false\n        }\n    })\n})\n```\n\n此示例与之前使用\
  \ `JSON.stringify()` 方法传递数据的示例不同。您会注意到我们必须创建一个 `parameters` 对象，该对象包含创建新站点的所有信息。而其他示例则不需要这样做。这个对象没有什么特别之处，它只是作为内部数据的包装；但是，SharePoint\
  \ 期望这种结构，否则它不会创建一个站点。\n\n首先，我们指定 `type`，在本例中为 `SP.WebInfoCreationInformation` 类型。如果您处理过上一章中的\
  \ JSOM 示例，您会认出这是用于使用 JSOM 创建站点的同一个对象。其余的属性相当直接：我们传入之前创建的站点标题、URL 和描述变量。我们还传入了一个语言设置（`1033`\
  \ 代表英语），以及 `WebTemplate`（`sts#0`，这是一个团队网站模板）。`success` 函数将在站点创建成功后显示一条成功消息。\n\n\
  **注意**：同样，这些示例中的代码在当前用户的权限级别下运行。由于这些示例中有许多执行创建和删除 SharePoint 对象等高级功能，因此用户需要具有适当的权限才能执行这些功能。再次指出这一点是值得的，因为创建站点要求用户对正在创建新网站的父站点具有完全控制权限。\n\
  \n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为 HTML 文件，然后保存页面。页面将显示文本框供用户输入新站点的标题和描述，并显示结果消息，如图\
