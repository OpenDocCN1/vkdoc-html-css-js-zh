  \ 0 开始。你还可以进一步展开这些项目并查看它们的属性。单击索引为 0 的项目旁边的 + 图标。你可以看到 SharePoint 返回了大量关于列表项的数据。这不仅限于列表项——你在\
  \ SharePoint 中请求数据的几乎所有内容都会附带大量信息。向下滚动以探索项目中的所有属性，你会发现我们在脚本中显示的 `Title` 和 `Description`\
  \ 属性，如图 4-41 所示。\n\n![A978-1-4842-0544-0_4_Fig41_HTML.jpg](img/A978-1-4842-0544-0_4_Fig41_HTML.jpg)\n\
  \n*图 4-41. 展开第一个列表项以检查其属性*\n\n在开发自定义解决方案时，调试会证明对你极其有用，因为你可以检查所有返回的数据，确保它正是你所需要的。它也非常方便，因为有时数据并不在你认为的地方。由于脚本在此处已停止，你有几种方法可以重新启动它。按下键盘上的`F10`键将使脚本逐行向前移动。这非常有帮助，因为你可以看到每一行执行时会发生什么。某些代码块会一起执行；例如，如果你使用`F10`单步执行代码，`$.each`\
  \ 循环内的所有代码将作为一个单步执行。你也可以轻松地在循环内部放置另一个断点，以在那里停止。\n\n另一个选项是使用箭头图标，如图 4-42 所示。\n\n\
  ![A978-1-4842-0544-0_4_Fig42_HTML.jpg](img/A978-1-4842-0544-0_4_Fig42_HTML.jpg)\n\
