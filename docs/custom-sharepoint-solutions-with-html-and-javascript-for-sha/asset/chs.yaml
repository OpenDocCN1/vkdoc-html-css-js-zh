  ## 总结


  在本章中，我们探讨了如何使用内容搜索 Web 部件、自定义结果源和自定义显示模板来构建自定义搜索解决方案。你了解了结果源，并学习了如何构建一个新的结果源以及如何将其与内容搜索
  Web 部件一起使用。我们快速探索了显示模板，并创建了一个如何应用自定义渲染的简单示例。搜索在 SharePoint 中始终扮演着重要角色，现在你掌握了一些工具，可以根据业务需求构建自定义搜索解决方案。


  在下一章中，我们将继续探索 SharePoint 在构建自定义解决方案时所提供的内容。我们将研究一些在编写代码时唾手可得的内置 JavaScript 功能。我们已经见过其中的一些功能，并且将更深入地探讨其可能性。


