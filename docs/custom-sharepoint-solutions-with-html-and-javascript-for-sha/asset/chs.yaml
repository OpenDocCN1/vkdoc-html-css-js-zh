  \n```\n$(function () {\n    bindButtonClick();\n});\n\nfunction bindButtonClick()\
  \ {\n    $(\"#btnSubmit\").on(\"click\", function () {\n        createDocument();\n\
  \    });\n}\n\nfunction createDocument() {\n    var docTitle = $(\"#txtDocumentTitle\"\
