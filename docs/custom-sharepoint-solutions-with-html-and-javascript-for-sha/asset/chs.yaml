  该属性限制将搜索结果限定在`文档`库中，仅返回了七个文档。现在，我们可以使用`FileType`属性再次进行限制：


  `FileType:pdf`


  该属性指示查询仅返回扩展名为`.pdf`的文件。将此属性添加到查询中并点击`测试查询`按钮将进一步限制结果，如图 6-14 所示。


  ![A978-1-4842-0544-0_6_Fig14_HTML.jpg](img/A978-1-4842-0544-0_6_Fig14_HTML.jpg)


