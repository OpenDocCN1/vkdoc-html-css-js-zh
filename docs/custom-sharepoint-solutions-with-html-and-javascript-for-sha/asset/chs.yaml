  ## 显示模板


  SharePoint 允许您完全控制搜索结果，甚至可以精确到它们在页面上的显示方式。这是通过显示模板实现的。您可以使用显示模板，通过 HTML 以任何您喜欢的方式设置搜索结果的样式。您可以创建两种类型的显示模板：


  -   **控件** - 这些模板处理搜索结果展示的整体结构，可以包含页眉和页脚等内容。此模板在每个 Web 部件中仅渲染一次。

  -   **项目** - 这些模板处理每个搜索结果项的显示方式。此模板将为返回的每个搜索结果渲染一次。


  您可以通过将内容搜索 Web 部件置于编辑模式来查看这些显示模板，在工具窗格的“属性”折叠项下，您会找到“显示模板”标题，如图 6-23 所示。


  ![A978-1-4842-0544-0_6_Fig23_HTML.jpg](img/A978-1-4842-0544-0_6_Fig23_HTML.jpg)


  图 6-23. 内容搜索 Web 部件工具窗格中的控件和项目显示模板


  有许多现成的显示模板可供使用，您可以通过点击每种类型的下拉列表来查看它们。例如，控件模板包括列表、带分页的列表和幻灯片。项目模板则有更多选项可供选择。要开始创建新的显示模板，最简单的起点是基于现有模板。要查看所有当前的搜索显示模板，请导航到“母版页库”，该库位于“网站设置”和“Web
  设计器库”下。点击“母版页和页面布局”链接，如图 6-24 所示。


  ![A978-1-4842-0544-0_6_Fig24_HTML.jpg](img/A978-1-4842-0544-0_6_Fig24_HTML.jpg)


