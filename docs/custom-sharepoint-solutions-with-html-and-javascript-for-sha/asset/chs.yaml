  \ Web 部件，但这应该已经展示了使用 HTML 和 JavaScript 开始处理 SharePoint 数据是多么容易。接下来，让我们继续了解 Etherson\
  \ 方法的一些优点。\n\n## 使用版本控制回滚更改\n\n在本章前面，当您创建用于存放自定义代码的文档库时，您启用了版本控制。在开发过程中，您在编写代码时难免会犯错误，并且这些错误可能会逃过测试。这种情况我们都会遇到，而且无法避免。幸运的是，如果开启了版本控制，您可以在发生这种情况时快速回滚更改。您可能会发现，仅仅因为用户对最新版本的代码不满意，就需要进行回滚。无论原因如何，操作起来都既快又简单。\n\
  \n当您上传新版本的`SimpleExample.js`文件时，系统会询问您是否要替换现有版本。通过单击“确定”（OK），您在库中创建了该文件的一个新版本。由于版本控制已开启，您只需点击几下即可恢复之前的版本。导航到“Simple\
  \ Example”文件夹，单击`SimpleExample.js`文件的菜单，如图 4-32 所示。\n\n![A978-1-4842-0544-0_4_Fig32_HTML.jpg](img/A978-1-4842-0544-0_4_Fig32_HTML.jpg)\n\
  \n**图 4-32.** 访问文件的版本历史记录\n\n打开菜单后，您需要访问次级菜单，在其中可以找到“版本历史记录”（Version History）选项。单击此选项，将出现一个对话框，显示该文件的所有版本。此处显示的版本数量取决于您如何设置库。例如，如果您将版本数量限制为五个，那么这里只会显示五个以前的版本。选择您想要的版本；在本例中，它将是列表中的第二个版本。版本按上传日期升序排列。使用菜单选项，选择菜单中的“还原”（Restore），如图\
  \ 4-33 所示。\n\n![A978-1-4842-0544-0_4_Fig33_HTML.jpg](img/A978-1-4842-0544-0_4_Fig33_HTML.jpg)\n\
