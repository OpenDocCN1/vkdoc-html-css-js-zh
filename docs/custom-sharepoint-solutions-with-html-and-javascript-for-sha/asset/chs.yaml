  \ 对象：\n\n```\nvar folderCreateInfo = new SP.ListItemCreationInformation();\n```\n\
  \n乍一看，这似乎有点奇怪，因为我们创建的是一个新文件夹，而非列表项。在 SharePoint 中，文件夹就是列表项，尽管它们的外观和行为与你对文件夹的预期完全一致。因此，我们使用了相同的\
  \ `SP.ListItemCreationInformation` 对象。创建对象后，我们需要使用以下代码设置一些属性：\n\n```\nfolderCreateInfo.set_underlyingObjectType(SP.FileSystemObjectType.folder);\n\
