  \ Web 部件本身产生任何影响！\n\n\n\n## 使用 Firebug（开发者工具）进行调试\n\n无论你使用何种工具、语言或环境编写代码，都需要具备调试能力。简单来说，就是让代码暂停运行，然后逐行检查，看看传入的数据是什么，以及代码如何处理这些数据。由于\
  \ Etherson 方法使用了 HTML 和 JavaScript，你可以轻松地通过浏览器中的 Firebug 或开发者工具进行调试。正如第 1 章所述，我们将使用\
  \ Firebug，它是 Firefox 的一个插件。你也可以使用任何浏览器自带的开发者工具。要启动这些工具，只需按下键盘上的`F12`键，工具就会在屏幕底部打开，如图\
