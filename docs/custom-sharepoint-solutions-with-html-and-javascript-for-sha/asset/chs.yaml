  \ `.txt` 扩展名。接下来，按照之前所有示例的方式构建 REST URL：\n\n```\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  var webRelUrl = _spPageContextInfo.webServerRelativeUrl;\nvar fullUrl = siteUrl\
