- "# 7. 使用 SharePoint 内置的 JavaScript 函数和属性\n\n在使用 JavaScript 构建自定义解决方案时，通常需要其他库的帮助才能完成工作。我们已经看到了\
  \ jQuery 库的强大功能，以及它如何帮助我们定位页面上的 HTML 元素、更新它们的值，甚至进行 AJAX 调用以获取数据。在使用 SharePoint\
  \ 时，你经常需要构建 URL、向用户显示通知等操作。幸运的是，微软提供了大量的 JavaScript 来帮助你完成这些任务。我不仅仅是在谈论 JavaScript\
  \ 对象模型或 REST API。在本章中，我们将探索一些随时可用的内置 JavaScript 函数和属性，以帮助你构建自定义解决方案。\n\n\n\n## 探索\
  \ JavaScript\n\nSharePoint 附带一长串内置的 JavaScript 方法和属性，你可以在代码中使用它们。事实上，这个列表非常长，一旦深入其中，会让人感到不知所措。不过，在日常的编码工作中，你会很快熟悉其中的一小部分，并且可以放心，因为知道在需要时还有更多帮助。首先，让我们使用\
  \ Internet Explorer 11 的开发人员工具来探索一些文件。正如本书前面提到的，每个浏览器都有自己的一套开发工具，且每个工具都略有不同。你完全可以在每个浏览器中执行相同的任务，但\
  \ IE11（和 Chrome）在 JavaScript 控制台中输入时会显示一个便捷的可用函数列表，如图 7-1 所示。\n\n![A978-1-4842-0544-0_7_Fig1_HTML.jpg](img/A978-1-4842-0544-0_7_Fig1_HTML.jpg)\n\
  \n图 7-1. IE11 中的开发人员工具。在控制台窗口中输入下划线将显示可用 JavaScript 函数的列表\n\n按键盘上的 `F12` 键打开 IE11\
  \ 中的开发人员工具。你也可以通过浏览器中的设置按钮访问它们。单击“控制台”选项卡，然后在底部的文本框中输入一个下划线。将会打开一个列表，显示所有以下划线开头的\
  \ JavaScript 函数。你可以使用箭头键在列表中上下移动。\n\n花几分钟浏览一下你在这里看到的所有内容。这应该会让你很好地了解使用 JavaScript\
  \ 操作 SharePoint 的可能性。你已经看到其中一些函数的实际应用；例如，在使用 JSLink 时，我们利用了 `SPClientTemplates`\
  \ 功能来覆盖 Web 部件的呈现。\n\n**注意**\n\n可用的 JavaScript 方法和属性非常广泛。以至于无法在一章中充分涵盖；这需要整本书的篇幅。我们将学习一些功能并在示例代码中使用它们。你应该花些时间在开发人员工具中充分探索这些函数，并使用\
  \ Google 或 Bing 查找更多信息。\n\n### `_spBodyOnLoadFunctions`\n\n`_spBodyOnLoadFunctions`\
  \ 是一个数组，其中包含一组应在页面加载时触发的 JavaScript 函数。我们在第 5 章中看到过它，当时需要连接一个函数以在页面加载时触发。该数组包含一个名为\
  \ `push` 的方法，你可以在其中传入一个应触发的函数名称：\n\n```\n_spBodyOnLoadFunctions.push(<FUNCTION_NAME>);\n\
  ```\n\n当你无法访问 jQuery 的 `Document.ready()` 函数时，这是一个非常有用的函数。还有一个等效函数叫做 `ExecuteOrDelayUntilBodyLoaded`，它执行相同的任务，甚至具有相同的签名：\n\
  \n```\nExecuteOrDelayUntilBodyLoaded(<FUNCTION_NAME>);\n```\n\n### `_spPageContextInfo`\n\
  \n在编写任何类型的代码时（无论是 JavaScript 还是 C# 之类的语言），总会有时候需要了解有关页面、位置或其他环境变量的信息。`_spPageContextInfo`\
  \ 对象可以轻松提供大量有用的信息。在本书的大多数示例中，它用于提供位置信息，以构建请求数据的 URL。起初，这可能看起来不是特别重要的信息，但在进行 REST\
  \ API 调用或通过 JavaScript 对象模型定位其他网站时，它变得极其重要。\n\n**注意**\n\n`_spPageContextInfo` 对象上的所有属性都可以在\
  \ Firebug 或开发人员工具中轻松访问。只需打开 JavaScript 控制台窗口，输入每个属性即可查看你环境的结果。\n\n#### `_spPageContextInfo.siteAbsoluteUrl`\n\
  \n此属性提供用户当前所在网站集的绝对 URL。绝对 URL 是完全限定的 URL，包含协议（`http://` 或 `https://`）和域（`www.yoursite.com`）。由于\
  \ SharePoint 可以利用备用访问映射，允许你为相同内容使用不同的域，因此此函数提供了一种非常有用的方式来构建 URL，而无需担心用户从何处访问页面。\n\
  \n由于这是指向网站集的路径，因此生成的 URL 可能类似于以下任意一种：\n\n*   `http://www.<DOMAIN>.com`\n*   `http://www.<DOMAIN>.com/sites/<SITE_NAME>`\n\
  \n#### `_spPageContextInfo.siteServerRelativeUrl`\n\n此属性提供用户当前所在网站集的服务器相对 URL。相对\
  \ URL 只是省略了 URL 中的协议和域。这是一个方便的工具，因为很多时候你需要网站集的相对 URL。如前所述，由于 SharePoint 内容可以在许多不同的域上访问，因此定位相对\
  \ URL 允许你在多个域上发布相同的代码，而无需担心代码将在何处运行。\n\n例如，如果你在根网站集中调用此属性，则生成的 URL 将简化为 `/`。\n\n\
  #### `_spPageContextInfo.webAbsoluteUrl`\n\n此属性提供用户当前所在 Web 或网站的绝对 URL。这是完全限定的 URL，包含协议和域。生成的\
  \ URL 代码如下所示：\n\n*   `http://www.<DOMAIN>.com`\n*   `http://www.<DOMAIN>.com/<SUBSITE>`\n\
  *   `http://www.<DOMAIN>.com/sites/<SITE_COLLECTION>/<SUBSITE>`\n\n#### `_spPageContextInfo.webServerRelativeUrl`\n\
  \n此属性提供用户当前所在 Web 或网站的服务器相对 URL。与网站相对 URL 一样，它省略了 URL 中的协议和域。生成的 URL 代码如下所示：\n\n\
  *   `/`\n*   `/<SUBSITE>`\n*   `/sites/<SITE_COLLECTION>/<SUBSITE>`\n\n### `ExecuteOrDelayUntilScriptLoaded`\n\
  \n此函数允许你指定一个 JavaScript 函数，使其延迟到另一个脚本完全加载后再执行。本质上，我们是在告诉 SharePoint：“我想运行这个特定函数，但我需要等到另一个脚本加载完毕。”它具有以下签名：\n\
  \n```\nExecuteOrDelayUntilScriptLoaded(<FUNCTION_NAME>, <SCRIPT_FILE>);\n```\n\n\
  SharePoint 首先检查指定的 JavaScript 文件是否已加载；如果已加载，则立即执行指定的函数。如果文件尚未加载，它会将该函数调用放入队列中，稍后再执行。在下一章中，当使用\
  \ JavaScript 对象模型查询用户数据时，我们将使用此函数：\n\n```\n$(function () {\n    ExecuteOrDelayUntilScriptLoaded(getUserProfileProperties,\
  \ \"sp.userprofiles.js\");\n});\n\nfunction getUserProfileProperties() {\n    var\
  \ clientContext = new SP.ClientContext();\n    ...\n```\n\n正如你在此代码片段中所见，我们有一个 jQuery\
  \ `Document.ready()` 函数，其中放置了 `ExecuteOrDelayUntilScriptLoaded` 函数。我们传入了函数 `getUserProfileProperties`\
  \ 和 JavaScript 文件 `sp.userprofiles.js`。我们需要在此处实现此函数，因为只有加载了 `sp.userprofiles.js`\
  \ 文件，我们函数中包含的代码才能运行。SharePoint 提供了一种简单的方法来确保你代码中的功能正常运行！\n\n**注意**\n\n`ExecuteOrDelayUntilScriptLoaded`\
  \ 功能是 SharePoint 2010 的遗留功能，当时它位于 `SP.SOD` 对象下。在 SharePoint 2013 中，某些情况下（通常是在发布门户页面上）较新的版本可能无法正常工作。如果你发现此函数不起作用，可以回退到\
  \ 2010 年的实现。更多信息请参见 [`http://msdn.microsoft.com/en-us/library/office/ff408081%28v=office.14%29.aspx`](http://msdn.microsoft.com/en-us/library/office/ff408081%28v=office.14%29.aspx)。\n\
  \n\n\n### SP.UI.Notify\n\n`SP.UI.Notify`对象提供了多种方式来通知用户正在发生的事情。此功能允许您利用现成的 SharePoint\
  \ 通知，使您的自定义解决方案能够无缝融入环境。尽管本书中的示例未使用此通知框架，但可以轻松重构以在创建或删除操作发生时包含通知。在可能的情况下，通知用户正在发生的事件始终是一个好习惯。\n\
  \n#### SP.UI.Notify.showLoadingNotification\n\n`SP.UI.Notify.showLoadingNotification`函数是一种快速简便的方法，用于显示熟悉的“正在处理...”通知。如果您使用过\
  \ SharePoint 一段时间，一定见过这些从屏幕右侧弹出的消息之一。它包含一个“旋转”图标，如图 7-2 所示。\n\n![A978-1-4842-0544-0_7_Fig2_HTML.jpg](img/A978-1-4842-0544-0_7_Fig2_HTML.jpg)\n\
  \n图 7-2.\n\n通过 Firebug 启动的加载通知\n\n您可以随时在代码中使用以下行启动此通知：\n\n`SP.UI.Notify.showLoadingNotification();`\n\
  \n实际上，您也可以启动 Firebug 或开发者工具，直接在浏览器中调用它。图 7-2 显示通过 Firebug 控制台触发的通知。\n\n这是一种快速方便的方法，用于通知用户您的代码正在执行某些操作。虽然这种通用通知在某些情况下可能足够，但您可能需要提供更多关于正在发生什么的解释。为此，您可以使用`SP.UI.Notify.addNotification`方法。\n\
  \n#### SP.UI.Notify.addNotification\n\n与之前的函数类似，`SP.UI.Notify.addNotification`用于在同一位置向用户显示通知，但带有自定义消息。当您需要通知用户正在发生的操作，但需要比简单的“正在处理...”消息更具描述性时，这非常完美。图\
  \ 7-3 显示了一条自定义消息。\n\n![A978-1-4842-0544-0_7_Fig3_HTML.jpg](img/A978-1-4842-0544-0_7_Fig3_HTML.jpg)\n\
  \n图 7-3.\n\n显示自定义消息以通知用户\n\n您可以使用以下行启动此通知：\n\n`SP.UI.Notify.addNotification(\"Your\
  \ Custom Message\");`\n\n如您所见，通过 JavaScript 添加自定义通知非常简单。您显示的消息没有最大长度限制。然而，随着消息变长，最终会碰到屏幕的另一侧，文本开始换行。这有时可能布局不正确，因此最好保持消息简短。图\
  \ 7-4 显示了一条较长的消息。\n\n![A978-1-4842-0544-0_7_Fig4_HTML.jpg](img/A978-1-4842-0544-0_7_Fig4_HTML.jpg)\n\
  \n图 7-4.\n\n可以通过通知显示较长的消息\n\n通知仅在页面上停留约 6 秒。如果您只需要通知用户某个操作已发生，但不需要等待响应，这完全没问题。然而，有时您需要启动一个操作并等待结果。在这种情况下，您可能需要通知停留更长时间。您可以通过使用以下行包含一个`Boolean`值来指示通知应保留：\n\
  \n`SP.UI.Notify.addNotification(\"Your Custom Message\", true);`\n\n通过使用上述行，通知将一直保留，直到手动关闭。您可以通过调用`SP.UI.Notify.removeNotification`函数并传入`addNotification`函数调用返回的通知\
  \ ID 来实现。当您调用`addNotification`函数时，您将获得刚创建的通知的 ID，如图 7-5 所示。\n\n![A978-1-4842-0544-0_7_Fig5_HTML.jpg](img/A978-1-4842-0544-0_7_Fig5_HTML.jpg)\n\
  \n图 7-5.\n\n创建新通知时返回的通知 ID\n\n如果我们在代码中使用它，该行将如下所示：\n\n`var notifyId = SP.UI.Notify.addNotification(\"\
  Hello World\", true);`\n\n当我们执行这一行时，`notifyId`变量现在包含新创建的通知的 ID。我们稍后可以使用以下行关闭通知：\n\
  \n`SP.UI.Notify.removeNotification(notifyId);`\n\n`SP.UI.Notify.removeNotification`只需接受通知的\
  \ ID 并将其从屏幕上移除。您也可以在调用`showLoadingNotification`函数时使用`Boolean`标志：\n\n`SP.UI.Notify.showLoadingNotification(true);`\n\
  \n传入`Boolean`会触发相同的通知 ID 返回，如图 7-6 所示。\n\n![A978-1-4842-0544-0_7_Fig6_HTML.jpg](img/A978-1-4842-0544-0_7_Fig6_HTML.jpg)\n\
  \n图 7-6.\n\n使用 Boolean 标志时返回的通知 ID\n\n这些函数提供了一种通过 JavaScript 轻松通知用户正在发生的事情的方法。例如，如果您需要执行长时间运行的\
  \ AJAX 调用，您可以告知用户正在发生此操作，这样他们就不会对您的 Web 部件失去耐心。\n\n## 摘要\n\n微软不仅为开发者提供了通过 JavaScript\
  \ 访问数据的方法，还让他们能够利用核心 SharePoint 功能。在本章中，我们探讨了可用的内置 JavaScript 函数和属性的一小部分。我们学习了如何访问位置数据以更轻松地为\
  \ REST API 调用和超链接构建 URL。我们了解了如何在 SharePoint 中向 body 的 onload 事件加载函数调用，以及如何确保在代码执行之前功能可用。最后，我们探讨了一些通知用户您的代码正在执行操作的不同方式，以提供更好的用户体验。\n\
  \n"
- "# 8. 使用 JavaScript 对象模型\n\n到目前为止，您已经了解了使用 HTML 和 JavaScript 在 SharePoint 中创建自定义解决方案的几种不同方法。在本章中，我们将继续探索使用\
  \ Etherson 方法创建自定义 Web 部件以及 JavaScript 对象模型。我们在第 2 章中简要介绍了 JavaScript 对象模型（JSOM）。在本章中，我们将学习如何使用\
  \ JSOM 处理列表、库、文件、网站和社交数据。您将了解各种处理 SharePoint 数据的方法，并开始充分领略这项技术的强大之处。\n\nJSOM 能够为您的开发需求提供广泛的选择。您可以创建新的列表和网站；您可以读取文件并与社交数据交互。到本章结束时，您将扎实掌握如何编写\
  \ JSOM 代码，并了解其能力范围。\n\n注意\n\n利用 JavaScript 对象模型的代码在登录用户的上下文中运行。这意味着代码只能执行用户权限级别允许的操作。例如，如果您的代码要在网站集中创建新的子网站，但登录用户没有该权限，代码将运行但会产生错误。在构建解决方案时请记住这一点，确保不要向用户显示他们无法使用的选项。\n\
  \n\n\n## 准备工作\n\n在开始之前，我们需要为本书一直在使用的演示列表添加一些额外数据。添加更多数据可以让我们查询更多信息并应用筛选条件。导航至演示列表，添加若干不同状态的新列表项。更新后的列表如图\
  \ 8-1 所示。\n\n![A978-1-4842-0544-0_8_Fig1_HTML.jpg](img/A978-1-4842-0544-0_8_Fig1_HTML.jpg)\n\
  \n图 8-1. 添加了更多列表项的演示列表\n\n现在列表中有更多数据了，我们开始研究如何使用 JSOM 查询数据。本章的示例将运用第 4 章中介绍的 Etherson\
  \ 方法。导航至网站中的 `Webparts` 文件夹，新建一个名为 `Chapter 8` 的文件夹，如图 8-2 所示。\n\n![A978-1-4842-0544-0_8_Fig2_HTML.jpg](img/A978-1-4842-0544-0_8_Fig2_HTML.jpg)\n\
  \n图 8-2. Webparts 文档库中的 Chapter 8 文件夹\n\n本章所有示例均遵循相同模式：我们将依次查看内容编辑器 Web 部件中渲染的 HTML\
  \ 文件、用于检索和渲染数据的 JavaScript 文件，以及最终结果。在此过程中，我们会深入分析每个文件并解释其工作原理。\n\n## 处理列表\n\n列表在\
  \ SharePoint 中无处不在！用户在 SharePoint 中交互的大部分内容都是列表。以下示例将演示通过代码与列表交互的多种方式。\n\n### 获取列表数据\n\
  \n本示例将简单检索一些列表数据并展示给用户。\n\n#### HTML\n\n在 Visual Studio 中新建一个 HTML 文件，命名为 `JSOMGetListData.html`。本例的\
  \ HTML 代码非常简洁，仅包含以下几行：\n\n```html\n<script type=\"text/javascript\" src=\"/_layouts/15/sp.runtime.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"/_layouts/15/sp.js\"></script>\n\
  <script type=\"text/javascript\" src=\"/apress/webparts/chapter 8/JSOMGetListData.js\"\
  ></script>\n<div id=\"divGetListData\"></div>\n```\n\n首先，请注意我们需要加载两个 SharePoint\
  \ JavaScript 文件：`sp.runtime.js` 和 `sp.js`。这两个文件至关重要，因为它们提供了正确运行 JSOM 代码所需的必要支持。在\
  \ SharePoint 2010 中，所有必需的 JavaScript 都会自动加载到每个页面。这使得 JavaScript 开发更为简单，开发者无需担心核心\
  \ SharePoint 脚本是否已加载。而在 SharePoint 2013 中，页面只加载满足需求的最简代码。这有助于提高页面加载速度，但也意味着如果需要特定库，必须确保其已加载。就本例而言，我们需要这两个文件。\n\
  \n接下来，我们加载自定义 JavaScript 文件 `JSOMGetListData`。该文件包含将数据加载到页面中 ID 为 `divGetListData`\
  \ 的 DIV 元素所需的所有代码。总的来说，这个页面的内容并不多。\n\n#### JavaScript\n\n在 Visual Studio 中新建一个 JavaScript\
  \ 文件，命名为 `JSOMGetListData.js`。相比之下，这个 JavaScript 文件更为复杂，包含以下代码：\n\n```javascript\n\
  $(function () {\n    getListData();\n});\n\nfunction getListData() {\n    var clientContext\
  \ = new SP.ClientContext();\n    var oWebsite = clientContext.get_web();\n    this.collList\
  \ = oWebsite.get_lists();\n    clientContext.load(collList);\n    clientContext.executeQueryAsync(\n\
  \        Function.createDelegate(this, this.onQuerySucceeded),\n        Function.createDelegate(this,\
  \ this.onQueryFailed)\n    );\n}\n\nfunction onQuerySucceeded() {\n    var listInfo\
  \ = '';\n    var listEnumerator = collList.getEnumerator();\n    while (listEnumerator.moveNext())\
  \ {\n        var oList = listEnumerator.get_current();\n        listInfo += 'Title:\
  \ ' + oList.get_title() + ' - Created: ' +\n            oList.get_created().toString()\
  \ + '<br />';\n    }\n    $(\"#divGetListData\").html(listInfo);\n}\n\nfunction\
  \ onQueryFailed(sender, args) {\n    alert('Request failed. ' + args.get_message()\
  \ +\n        '\\n' + args.get_stackTrace());\n}\n```\n\n本书中大部分 JSOM 示例都遵循与本例相同的模式。下面我们逐行详细分析，以全面理解其工作原理。脚本从\
  \ jQuery 的 `Document.ready` 方法开始，该方法仅调用一个名为 `getListData` 的自定义函数，该函数执行 JSOM 调用，是核心代码所在。\n\
  \n首先，我们创建一个名为 `clientContext` 的新变量，并通过以下代码进行赋值：\n\n```javascript\nvar clientContext\
  \ = new SP.ClientContext();\n```\n\n客户端上下文是一个 SharePoint 对象，实际上是所有 JSOM 调用的入口点。它包含当前站点、用户、Web\
  \ 等上下文的大量信息。在本例中，我们直接请求返回上下文，未传递任何参数，这样将自动返回当前站点的上下文。你也可以通过传入 URL 来请求其他站点的上下文，例如：`SP.ClientContext('http://www.site.com/')`。\n\
  \n接下来，我们创建另一个名为 `oWebsite` 的变量，并通过以下代码赋值：\n\n```javascript\nvar oWebsite = clientContext.get_web();\n\
  ```\n\n这将返回用户执行代码所在的网站集内的当前网站（即 Web）。我们需要这个 Web 对象来获取所有列表。随后，通过以下代码创建名为 `collList`\
  \ 的变量：\n\n```javascript\nthis.collList = oWebsite.get_lists();\n```\n\n该变量用于存储从\
  \ `oWebsite` 变量中获取的所有列表。`collList` 的声明方式与其他变量略有不同，此处未使用 `var` 关键字，而是使用了 `this`。这样做的原因是，`this`\
  \ 关键字会使该变量成为全局变量，以便后续处理数据的函数能够访问它。\n\n接下来这一行代码，在初次使用 JSOM 时常常令人困惑：\n\n```javascript\n\
  clientContext.load(collList);\n```\n\n这一行代码将查询“加载”到客户端上下文中，准备发送给 SharePoint。这意味着此时你实际上尚未向\
  \ SharePoint 发送任何数据请求。在大多数 JavaScript 开发中，你可能会认为像 `this.collList = oWebsite.get_lists();`\
  \ 这样的代码会立即返回所有列表，然后就可以开始使用它们。但在 JSOM 中，情况并非如此。你必须先加载所有要发出的请求，然后通过以下代码提交：\n\n```javascript\n\
  clientContext.executeQueryAsync(\n    Function.createDelegate(this, this.onQuerySucceeded),\n\
  \    Function.createDelegate(this, this.onQueryFailed)\n);\n```\n\n\n\n只有在调用 `executeQueryAsync`\
  \ 函数后，对 SharePoint 的请求才会实际发生。这一点在使用 JSOM 时至关重要，但很多开发者在刚开始接触时都会因此出错。之所以必须在提交请求前加载所有请求，是因为一项名为**批处理**的功能。简单来说，SharePoint\
  \ 允许你加载多个数据请求，然后只需一次执行调用即可获取所有需要的数据。这有助于提升实际处理 JSOM 调用的服务器性能。本书中的示例虽未实际使用批处理，但了解这一概念依然很重要。\n\
  \n`executeQueryAsync` 方法允许你指定一个 `success` 函数和一个 `failure` 函数，这两个函数会在 SharePoint\
  \ 返回查询结果后被调用。如前所述，这些函数是通过 `Function.createDelegate` 方法声明的。指定这些函数后，你需要创建实际的函数来处理结果。\n\
  \n```\nfunction onQuerySucceeded() {\n    var listInfo = '';\n    var listEnumerator\
  \ = collList.getEnumerator();\n    while (listEnumerator.moveNext()) {\n       \
  \ var oList = listEnumerator.get_current();\n        listInfo += '标题: ' + oList.get_title()\
  \ + ' - 创建日期: ' + \n            oList.get_created().toString() + '<br />';\n   \
  \ }\n    $(\"#divGetListData\").html(listInfo);\n}\n```\n\n此函数首先声明了一个名为 `listInfo`\
  \ 的新变量，用于在页面显示之前保存所有查询结果。接着，我们通过 `collList.getEnumerator()` 方法从变量 `collList` 中获取一个枚举器，并将其存入名为\
  \ `listEnumerator` 的变量中。我们需要遍历返回的所有结果，而枚举器正好可以实现这一点。使用 `while` 循环，我们通过 `listEnumerator.get_current()`\
  \ 方法遍历每个返回的条目。在每次循环中，我们从当前条目中获取标题和创建日期。我们还会添加更多 HTML 内容，并通过 `+=` 将内容追加到 `listInfo`\
  \ 变量中。这样我们可以不断向 `listInfo` 变量添加内容，而不是每次都覆盖它。\n\n最后，我们通过 `$(\"#divGetListData\").html(listInfo);`\
  \ 将 `listInfo` 变量的内容输出到 HTML 页面中的 DIV 元素里。\n\n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为该\
  \ HTML 文件，并保存页面。结果将显示当前网站中的所有列表，如图 8-3 所示。\n\n![A978-1-4842-0544-0_8_Fig3_HTML.jpg](img/A978-1-4842-0544-0_8_Fig3_HTML.jpg)\n\
  \n图 8-3. 内容编辑器 Web 部件中的“获取列表数据”结果\n\n### 创建新列表\n\n在本示例中，我们将创建一个新列表。我们不做任何复杂操作，只是创建一个新列表并设置其标题。\n\
  \n#### HTML\n\n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为 `JSOMCreateList.html`。此示例的\
  \ HTML 比上一个示例稍微复杂一些，包含以下代码行：\n\n```\n<script type=\"text/javascript\" src=\"/_layouts/15/sp.runtime.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"/_layouts/15/sp.js\"></script>\n\
  <script type=\"text/javascript\" src=\"/apress/webparts/chapter 8/JSOMCreateList.js\"\
  ></script>\n<div>\n    <strong>输入列表名称:</strong>\n    <input type=\"text\" id=\"\
  txtListName\" />\n    <input type=\"button\" id=\"btnSubmitListName\" value=\"提交\"\
  \ />\n</div>\n<div id=\"divCreateListResults\"></div>\n```\n\n和之前一样，我们需要加载 `sp.runtime.js`\
  \ 和 `sp.js` 文件，以及自定义 JavaScript 文件的引用。HTML 稍微复杂一些，页面上包含多个元素。首先，有一段简单的文本被包裹在 `<strong>`\
  \ 标签中，使其在页面上显示为粗体。接下来，是一个类型为文本的 INPUT 元素，它是一个简单的文本框，供用户输入想要创建的列表名称。还有一个按钮，供用户提交新列表请求。最后，有一个\
  \ DIV 元素，用于输出列表创建的结果。每个元素都有一个 ID，以便我们可以通过 jQuery 轻松定位。\n\n**注意：** 要通过 JSOM 创建新列表，执行代码的用户必须在\
  \ SharePoint 中至少拥有“管理列表”权限。无论权限级别如何，页面都会被呈现；但如果用户权限不足，SharePoint 将会抛出错误。\n\n\n```markdown\n\
  \n#### JavaScript\n\nCreate a new JavaScript file in Visual Studio and name it `JSOMCreateList.js`.\
  \ In comparison, the JavaScript file is more complex and contains the following\
  \ lines of code:\n\n```javascript\n$(function () {\n\n    bindButtonClick();\n\n\
  });\n\nfunction bindButtonClick() {\n\n    $(\"#btnSubmitListName\").on(\"click\"\
  , function () {\n\n        var listName = $(\"#txtListName\").val();\n\n       \
  \ createList(listName);\n\n    });\n\n}\n\nfunction createList(listName) {\n\n \
  \   var clientContext = new SP.ClientContext();\n\n    var oWebsite = clientContext.get_web();\n\
  \n    var listCreationInfo = new SP.ListCreationInformation();\n\n    listCreationInfo.set_title(listName);\n\
  \n    listCreationInfo.set_templateType(SP.ListTemplateType.genericList);\n\n  \
  \  this.oList = oWebsite.get_lists().add(listCreationInfo);\n\n    clientContext.load(oList);\n\
  \n    clientContext.executeQueryAsync(\n\n        Function.createDelegate(this,\
  \ this.onQuerySucceeded),\n\n        Function.createDelegate(this, this.onQueryFailed)\n\
  \n    );\n\n}\n\nfunction onQuerySucceeded() {\n\n    var results = oList.get_title()\
  \ + ' successfully created!';\n\n    $(\"#divCreateListResults\").html(results);\n\
  \n}\n\nfunction onQueryFailed(sender, args) {\n\n    alert('Request failed. ' +\
  \ args.get_message() +\n\n    '\\n' + args.get_stackTrace());\n\n}\n```\n\nIn this\
  \ example, we don’t need to trigger any action when the page loads, but we do need\
  \ to bind the button's click event when the page loads. In the `Document.ready`\
  \ function, we called the `bindButtonClick` function. In this function, we use jQuery's\
  \ `on` operator to bind a click event to the `btnSubmitListName` button in the HTML.\
  \ When the user clicks the button, we get the text from the text box on the page\
  \ and pass it to the `createList()` function, as shown in the following code:\n\n\
  ```javascript\nfunction bindButtonClick() {\n\n    $(\"#btnSubmitListName\").on(\"\
  click\", function () {\n\n        var listName = $(\"#txtListName\").val();\n\n\
  \        createList(listName);\n\n    });\n\n}\n```\n\nThe `createList()` function\
  \ receives a variable named `listName`, which is the text the user entered on the\
  \ page. Next, we get a reference to the current client context and get the current\
  \ website. Then, we create the list using the following code:\n\n```javascript\n\
  var listCreationInfo = new SP.ListCreationInformation();\n\nlistCreationInfo.set_title(listName);\n\
  \nlistCreationInfo.set_templateType(SP.ListTemplateType.genericList);\n\nthis.oList\
  \ = oWebsite.get_lists().add(listCreationInfo);\n\nclientContext.load(oList);\n\
  ```\n\nTo create a new list, we use the `SP.ListCreationInformation()` object. We\
  \ can instantiate a new `ListCreationInformation` object with the following code:\n\
  \n```javascript\nvar listCreationInfo = new SP.ListCreationInformation();\n```\n\
  \nThis line of code simply creates a new object and assigns it to a new variable\
  \ named `listCreationInfo`. Next, we set the title and template using the following\
  \ code:\n\n```javascript\nlistCreationInfo.set_title(listName);\n\nlistCreationInfo.set_templateType(SP.ListTemplateType.genericList);\n\
  ```\n\nThe `set_title` method receives the `listName` passed into the function.\
  \ The `set_templateType` method receives a built-in `SP.ListTemplateType` value;\
  \ in this case, we pass `genericList`. The available values here are the same as\
  \ those expected when creating a list using the SharePoint UI in the browser, such\
  \ as Announcements, Calendar, Tasks, etc. Next, we add the list to the website using\
  \ the following code:\n\n```javascript\nthis.oList = oWebsite.get_lists().add(listCreationInfo);\n\
  \nclientContext.load(oList);\n```\n\nAs in the previous example, after adding the\
  \ list to the website, we need to \"load\" the list into the client context. Finally,\
  \ we call the `executeQueryAsync` function, which will actually make a call to SharePoint\
  \ to create the list. After the call completes, we handle the results with the following\
  \ function:\n\n```javascript\nfunction onQuerySucceeded() {\n\n    var results =\
  \ oList.get_title() + ' successfully created!';\n\n    $(\"#divCreateListResults\"\
  ).html(results);\n\n}\n```\n\nIn this function, we use the `oList.get_title()` method\
  \ to get the title of the list we just created. This is a good way to verify that\
  \ the list was indeed created because we are getting the title from the list itself,\
  \ rather than using the text the user input. After getting the list title, we use\
  \ jQuery to add a success message to the `divCreateListResults` DIV element on the\
  \ page.\n\n### Results\n\nSet the content link property of the Content Editor Web\
  \ Part to this HTML file, and then save the page. The page will now display a text\
  \ box and a button for the user to enter a new list name. Enter \"My Custom List\"\
  , then click the \"Submit\" button. The result will display a success message, as\
  \ shown in Figure 8-4.\n\n![A978-1-4842-0544-0_8_Fig4_HTML.jpg](img/A978-1-4842-0544-0_8_Fig4_HTML.jpg)\n\
  \n**Figure 8-4.** Result after running the code to create a new list\n\nSince all\
  \ this is done via JavaScript and AJAX, the list will be created, and the user will\
  \ be notified as expected. However, the left navigation on the page will not be\
  \ updated because the page is not refreshed. You could modify the code to refresh\
  \ the page upon success, but in this example, we will simply manually refresh the\
  \ browser page. Figure 8-5 shows the result of refreshing the page, displaying the\
  \ new list in the left navigation.\n\n![A978-1-4842-0544-0_8_Fig5_HTML.jpg](img/A978-1-4842-0544-0_8_Fig5_HTML.jpg)\n\
  \n**Figure 8-5.** The new list displayed in the left navigation pane\n\n### Deleting\
  \ a List\n\nIn this example, we will delete the list we just created in the previous\
  \ section.\n\n#### HTML\n\nCreate a new HTML file in Visual Studio and name it `JSOMDeleteList.html`.\
  \ The HTML for this example is almost identical to the previous example and contains\
  \ the following lines of code:\n\n```html\n<script type=\"text/javascript\" src=\"\
  /_layouts/15/sp.runtime.js\"></script>\n<script type=\"text/javascript\" src=\"\
  /_layouts/15/sp.js\"></script>\n<script type=\"text/javascript\" src=\"/apress/webparts/chapter\
  \ 8/JSOMDeleteList.js\"></script>\n\n<div>\n    <strong>输入要删除的列表名称：</strong>\n \
  \   <input type=\"text\" id=\"txtListName\" />\n    <input type=\"button\" id=\"\
  btnSubmitListName\" value=\"提交\" />\n</div>\n\n<div id=\"divDeleteListResults\"\
  ></div>\n```\n\nThe only difference is that we updated the text on the page to indicate\
  \ this Web Part will be used to delete a list, and changed the ID of the results\
  \ DIV to `divDeleteListResults`.\n\n```\n\n\n#### JavaScript\n\nIn Visual Studio,\
  \ create a new JavaScript file and name it `JSOMDeleteList.js`. This JavaScript\
  \ file contains the following lines of code:\n\n```javascript\n$(function () {\n\
  \    bindButtonClick();\n});\n\nfunction bindButtonClick() {\n    $(\"#btnSubmitListName\"\
  ).on(\"click\", function () {\n        var listName = $(\"#txtListName\").val();\n\
  \        deleteList(listName);\n    });\n}\n\nfunction deleteList(listName) {\n\
  \    var clientContext = new SP.ClientContext();\n    var oWebsite = clientContext.get_web();\n\
  \    this.oList = oWebsite.get_lists().getByTitle(listName);\n    oList.deleteObject();\n\
  \    clientContext.executeQueryAsync(\n        Function.createDelegate(this, this.onQuerySucceeded),\n\
  \        Function.createDelegate(this, this.onQueryFailed)\n    );\n}\n\nfunction\
  \ onQuerySucceeded() {\n    $(\"#divDeleteListResults\").html(\"List successfully\
  \ deleted!\");\n}\n\nfunction onQueryFailed(sender, args) {\n    alert('Request\
  \ failed. ' + args.get_message() +\n        '\\n' + args.get_stackTrace());\n}\n\
  ```\n\nThe script begins with the familiar jQuery `Document.ready` function, which\
  \ binds a button click to a function:\n\n```javascript\nfunction bindButtonClick()\
  \ {\n    $(\"#btnSubmitListName\").on(\"click\", function () {\n        var listName\
  \ = $(\"#txtListName\").val();\n        deleteList(listName);\n    });\n}\n```\n\
  \nThis function is almost identical to the previous example—the only difference\
  \ is the use of the new function name `deleteList` to delete the list. This function\
  \ is more concise and straightforward, containing only a few relevant lines of code:\n\
  \n```javascript\nthis.oList = oWebsite.get_lists().getByTitle(listName);\noList.deleteObject();\n\
  ```\n\nAfter obtaining the client context and the current website, we use the website\
  \ object's `getByTitle()` method to locate the list to delete and assign it to the\
  \ variable `oList`. Next, we call the `oList.deleteObject()` method to actually\
  \ perform the deletion. You will notice that the \"load\" method of the client context\
  \ object is not called here. This step is not necessary when deleting a list. After\
  \ the `deleteObject()` line, simply call the `executeQueryAsync()` method to execute\
  \ the deletion.\n\n### Result\n\nSet the \"Content Link\" property of the Content\
  \ Editor Web Part to this HTML file and save the page. The page will display a text\
  \ box and a button for the user to input the name of the list to delete. Enter \"\
  My Custom List\" and click the \"Submit\" button. The result will show a success\
  \ message, as shown in Figure 8-6.\n\n![A978-1-4842-0544-0_8_Fig6_HTML.jpg](img/A978-1-4842-0544-0_8_Fig6_HTML.jpg)\n\
  \n**Figure 8-6.** Result after the delete list code runs successfully\n\nSince all\
  \ of this is done using JavaScript and AJAX, the list will be deleted, and the user\
  \ will be notified as expected. However, the navigation on the left side of the\
  \ page will not update because the page has not been refreshed. As before, we could\
  \ modify the code to refresh the page on success, but in this example, we will simply\
  \ manually refresh the page in the browser. Figure 8-7 shows the page after refreshing,\
  \ where the list is no longer displayed in the left navigation.\n\n![A978-1-4842-0544-0_8_Fig7_HTML.jpg](img/A978-1-4842-0544-0_8_Fig7_HTML.jpg)\n\
  \n**Figure 8-7.** The deleted list has been removed from the left navigation\n\n\
  ## Working with List Items\n\nIn SharePoint, the only thing more common than lists\
  \ is list items. You will find that many of your interactions in SharePoint involve\
  \ list items, and therefore, a lot of your code will too. In this section, we will\
  \ explore some ways to handle list items through code.\n\n### Getting List Items\n\
  \nIn this example, we will simply retrieve some list items and display them to the\
  \ user.\n\n#### HTML\n\nIn Visual Studio, create a new HTML file and name it `JSOMGetListItems.html`.\
  \ The HTML for this example continues the minimalist style of the previous examples\
  \ and contains the following lines of code:\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"/_layouts/15/sp.runtime.js\"></script>\n<script type=\"text/javascript\"\
  \ src=\"/_layouts/15/sp.js\"></script>\n<script type=\"text/javascript\" src=\"\
  /apress/webparts/chapter 8/JSOMGetListItems.js\"></script>\n<div id=\"divListItems\"\
  ></div>\n```\n\nFor this example, we will retrieve all list items from the \"Demo\
  \ List\" and display them in the `divListItems` DIV on the page.\n\n\n\n#### JavaScript\n\
  \n在 Visual Studio 中创建一个新的 JavaScript 文件，并将其命名为`JSOMGetListItems.js`。用于检索列表项的脚本与我们已经见过的其他脚本非常相似，它包含以下代码行：\n\
  \n```\n$(function () {\n    retrieveListItems();\n});\n\nfunction retrieveListItems()\
  \ {\n    var clientContext = new SP.ClientContext();\n    var oList = clientContext.get_web().get_lists().getByTitle('Demo\
  \ List');\n    var camlQuery = new SP.CamlQuery();\n    this.collListItem = oList.getItems(camlQuery);\n\
  \    clientContext.load(collListItem);\n    clientContext.executeQueryAsync(\n \
  \       Function.createDelegate(this, this.onQuerySucceeded),\n        Function.createDelegate(this,\
  \ this.onQueryFailed)\n    );\n}\n\nfunction onQuerySucceeded(sender, args) {\n\
  \    var listItemInfo = '';\n    var listItemEnumerator = collListItem.getEnumerator();\n\
  \    while (listItemEnumerator.moveNext()) {\n        var oListItem = listItemEnumerator.get_current();\n\
  \        listItemInfo += '<strong>ID: </strong> ' + oListItem.get_id() +\n     \
  \       ' <strong>Title:</strong> ' + oListItem.get_item('Title') +\n          \
  \  '<br />';\n    }\n    $(\"#divListItems\").html(listItemInfo);\n}\n\nfunction\
  \ onQueryFailed(sender, args) {\n    alert('Request failed. ' + args.get_message()\
  \ +\n        '\\n' + args.get_stackTrace());\n}\n```\n\n对于这个示例，由于我们只是要从列表中获取所有项，因此我们将使用\
  \ jQuery 的`Document.ready`函数调用`retrieveListItems()`函数。在获取到客户端上下文的引用后，我们通过以下代码行获取对“Demo\
  \ List”的引用：\n\n```\nvar oList = clientContext.get_web().get_lists().getByTitle('Demo\
  \ List');\n```\n\n这一行乍一看可能令人生畏，因为它相当长。然而，它实际上非常容易理解。首先，我们获取当前网站，然后获取该网站中的所有列表，最后通过标题获取列表。`JSOM`和`REST`在查询对象时都遵循这种模式，使得代码易于理解。接下来，我们需要创建一个\
  \ CAML 查询，以告知 SharePoint 我们要查找哪些项：\n\n```\nvar camlQuery = new SP.CamlQuery();\n\
  this.collListItem = oList.getItems(camlQuery);\n```\n\nCAML（协作应用程序标记语言）查询是 SharePoint\
  \ 中用于定义列表项查询的一种查询语言。你可以像 SQL 查询一样根据条件指定要返回哪些项，尽管它们看起来完全不同。在本例中，我们仅使用新的`SP.CamlQuery()`方法创建了一个空查询。当你查询列表时，即使没有定义任何参数，也必须提供一个\
  \ CAML 查询。如果像本例一样传递一个空查询，实际上你是在请求返回所有项。在实际应用中，这不是一个好主意，因为许多列表包含成百上千个项。创建查询后，我们将其传递给`oList.getItems()`方法来执行查询。与其他示例一样，我们使用`this`关键字定义了一个名为`collListItems`的全局变量。最后，我们“加载”查询并执行它。\n\
  \n> **注意：**  \n> CAML 查询是一个非常复杂且深入的课题。本书仅能触及 CAML 的皮毛，因为它确实很庞大。我们将在下一节中对 CAML 进行更深入的探讨，但你可以通过访问[`http://msdn.microsoft.com/en-us/library/ms467521(v=office.15).aspx`](http://msdn.microsoft.com/en-us/library/ms467521(v=office.15).aspx)了解更多关于如何构建这些查询的信息。\n\
  \n一旦我们检索到列表项，就在`onQuerySucceeded`函数中处理它们：\n\n```\nfunction onQuerySucceeded(sender,\
  \ args) {\n    var listItemInfo = '';\n    var listItemEnumerator = collListItem.getEnumerator();\n\
  \    while (listItemEnumerator.moveNext()) {\n        var oListItem = listItemEnumerator.get_current();\n\
  \        listItemInfo += '<strong>ID: </strong> ' + oListItem.get_id() +\n     \
  \       ' <strong>Title:</strong> ' + oListItem.get_item('Title') +\n          \
  \  '<br />';\n    }\n    $(\"#divListItems\").html(listItemInfo);\n}\n```\n\n该函数首先声明一个名为`listItemInfo`的空变量。该变量将保存要显示在页面上的整个\
  \ HTML。接下来，我们获取`collListItem`变量的枚举器，你可能还记得，这个变量在从 SharePoint 返回的任何项集合中都是可用的。我们使用`listItemEnumerator.moveNext()`方法遍历这些项。在循环内部，我们使用`listItemEnumerator.get_current()`方法获取每个项。然后，我们为结果集中的每一项构建一些\
  \ HTML，显示其 ID 和标题，并将其存入`listItemInfo`变量。最后，我们使用 jQuery 将 HTML 设置到页面上的`divListItems`\
  \ DIV 中。\n\n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为该 HTML 文件，然后保存页面。该页面现在将显示“Demo List”中的所有项，如图\
  \ 8-8 所示。\n\n![A978-1-4842-0544-0_8_Fig8_HTML.jpg](img/A978-1-4842-0544-0_8_Fig8_HTML.jpg)\n\
  \n**图 8-8.** 内容编辑器 Web 部件中显示的 Demo List 列表项\n\n### 使用 CAML 查询限制结果\n\n正如我提到的，查询列表中的所有项通常不是一个好主意。当然，在某些情况下确实需要这样做或有意义；例如，你可能有一个项非常少的列表，或者你有一个需要查看所有项的管理员任务。如果你过去使用过\
  \ SharePoint，你肯定知道 SharePoint 会自动限制列表结果，默认查询结果限制为 2000 项。无论是哪种情况，大多数用户永远不需要查看列表中的所有项，查询应被限制为仅显示用户需要看到的项。\n\
  \nCAML 允许你基于各种参数限制结果，从而完全控制向用户显示的内容。在之前的示例中，我们通过创建一个新的`SP.CamlQuery`对象传递了一个空的 CAML\
  \ 查询，该查询返回了所有列表项。你可以通过对`CamlQuery`对象使用`set_viewXml()`方法来传入一个 CAML 查询，如下面“JavaScript”部分所示。\n\
  \n#### JavaScript\n\n更新上一个示例中的`JSOMGetListItems.js`，并使用以下代码行替换声明`SP.CamlQuery()`对象的部分：\n\
  \n```\nvar camlQuery = new SP.CamlQuery();\n    camlQuery.set_viewXml(\n       \
  \ '<View><Query><Where><Geq><FieldRef Name=\\'ID\\'/>' +\n        '<Value Type=\\\
  'Number\\'>5</Value></Geq></Where></Query>' +\n        '<RowLimit>10</RowLimit></View>'\n\
  \    );\n    this.collListItem = oList.getItems(camlQuery);\n```\n\n在此示例中，我们通过指定仅返回\
  \ ID 大于或等于 5 的项来限制结果。这是通过使用`GEQ`元素（代表“大于或等于”）实现的。在`GEQ`元素之前，我们使用了一个`Where`元素，并指定了\
  \ ID 的`FieldRef`，即列表项的 ID。如果这一切看起来像天书，别担心，有一些可以下载的工具来帮助你编写 CAML。我们不会深入探讨编写 CAML\
  \ 查询的细节；在本节中，你应该了解到你可以非常精细地调整查询。\n\n> **注意：**  \n> 初看之下，CAML 可能会显得非常令人困惑且过于复杂。当你与\
  \ CAML 打交道一段时间后，你可能仍然会有同样的想法！幸运的是，有几个很棒的免费工具可以帮助你编制 CAML 语句。我个人喜欢 SharePoint CAML\
  \ Query Helper，它是免费的，并可以在 CodePlex 上下载。请访问[`https://spcamlqueryhelper.codeplex.com`](https://spcamlqueryhelper.codeplex.com/)\
  \ 下载一份副本。\n\n\n\n### 结果\n\n更新 JavaScript 文件并上传，覆盖之前的版本。用内容编辑器 Web 部件刷新页面，你会看到结果现在只显示\
  \ ID 大于或等于 5 的项，如图 8-9 所示。\n\n![A978-1-4842-0544-0_8_Fig9_HTML.jpg](img/A978-1-4842-0544-0_8_Fig9_HTML.jpg)\n\
  \n图 8-9. 通过 CAML 查询限制的示例列表查询结果\n\n## 添加列表项\n\n在这个例子中，我们将向示例列表中添加一个新项。\n\n#### HTML\n\
  \n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为`JSOMAddListItems.html`。此页面的标记将允许用户向示例列表中添加项，提供标题和描述。它包含以下代码行：\n\
  \n```\n<script type=\"text/javascript\" src=\"/_layouts/15/sp.runtime.js\"></script>\n\
  <script type=\"text/javascript\" src=\"/_layouts/15/sp.js\"></script>\n<script type=\"\
  text/javascript\" src=\"/apress/Webparts/chapter 8/JSOMAddListItems.js\"></script>\n\
  <div id=\"AddListData\">\n    <div>\n        标题:\n        <br />\n        <input\
  \ type=\"text\" id=\"txtTitle\" />\n    </div>\n    <div>\n        描述:\n       \
  \ <br />\n        <textarea cols=\"20\" id=\"txtDesc\"></textarea>\n    </div>\n\
  \    <br />\n    <div>\n        <input id=\"btnSubmit\" type=\"button\" value=\"\
  提交\" />\n    </div>\n</div>\n<div id=\"divResult\"></div>\n```\n\n我们为列表项标题提供了一个`TEXT`类型的`INPUT`，为描述提供了一个`TEXTAREA`。页面上的每个元素都有一个\
  \ ID，这样我们就可以用 jQuery 轻松定位它。\n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript\
  \ 文件，并将其命名为`JSOMADDListItems.js`。添加列表项的脚本与创建新列表的脚本类似。它包含以下代码行：\n\n```\n$(function\
  \ () {\n    bindButtonClick();\n});\nfunction bindButtonClick() {\n    $(\"#btnSubmit\"\
  ).on(\"click\", function () {\n        addListItem();\n    });\n}\nfunction addListItem()\
  \ {\n    var title = $(\"#txtTitle\").val();\n    var desc = $(\"#txtDesc\").val();\n\
  \    var clientContext = new SP.ClientContext();\n    var oList = clientContext.get_web().get_lists().getByTitle('Demo\
  \ List');\n    var itemCreateInfo = new SP.ListItemCreationInformation();\n    this.oListItem\
  \ = oList.addItem(itemCreateInfo);\n    oListItem.set_item('Title', title);\n  \
  \  oListItem.set_item('Description', desc);\n    oListItem.set_item('Status', 'On-time');\n\
  \    oListItem.update();\n    clientContext.load(oListItem);\n    clientContext.executeQueryAsync(\n\
  \        Function.createDelegate(this, this.onAddSucceeded),\n        Function.createDelegate(this,\
  \ this.onAddFailed)\n    );\n}\nfunction onAddSucceeded(sender, args) {\n    $(\"\
  #divResult\").html(\"项添加成功！\");\n}\nfunction onAddFailed(sender, args) {\n    alert('请求失败。'\
  \ + args.get_message() +\n        '\\n' + args.get_stackTrace());\n}\n```\n\n用 jQuery\
  \ 附加按钮点击事件后，我们在点击事件中做的第一件事就是获取用户提供的值，代码如下：\n\n```\nvar title = $(\"#txtTitle\").val();\n\
  var desc = $(\"#txtDesc\").val();\n```\n\n接下来，我们获取当前客户端上下文的引用，以及`Demo List`的引用。然后，为了创建一个新的列表项，我们必须实例化一个`SP.ListItemCreationInformation`对象。该对象允许你为列表创建新的列表项并设置其属性。这是通过以下代码完成的：\n\
  \n```\nvar itemCreateInfo = new SP.ListItemCreationInformation();\nthis.oListItem\
  \ = oList.addItem(itemCreateInfo);\noListItem.set_item('Title', title);\noListItem.set_item('Description',\
  \ desc);\noListItem.set_item('Status', 'On-time');\noListItem.update();\n```\n\n\
  创建新的`SP.ListItemCreationInformation`对象后，我们使用列表对象上的`addItem()`方法将其添加到列表中。接着，我们使用列表项对象上的`set_item()`方法设置各个属性。这个方法接受两个参数。第一个参数是你想要设置值的字段或列，第二个参数是值本身。对于`Title`（标题）和`Description`（描述），我们直接传入之前检索到的值。对于`Status`（状态）列，我们只硬编码一个值为`On-time`（准时）。最后，我们使用`update()`方法更新该项，然后将其加载到客户端上下文中并执行查询。在`success`（成功）函数中，我们只需在屏幕上输出列表项创建成功的信息。\n\
  \n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为 HTML 文件并保存页面。页面将显示供用户输入详细信息的文本框，并在添加项目时显示成功消息，如图\
  \ 8-10 所示。\n\n![A978-1-4842-0544-0_8_Fig10_HTML.jpg](img/A978-1-4842-0544-0_8_Fig10_HTML.jpg)\n\
  \n图 8-10. 向示例列表添加新项\n\n然后我们可以导航到示例列表以确认新项已添加。图 8-11 显示了示例列表，其中添加了一个新的列表项，并包含了由 HTML\
  \ 页面提供的值。\n\n![A978-1-4842-0544-0_8_Fig11_HTML.jpg](img/A978-1-4842-0544-0_8_Fig11_HTML.jpg)\n\
  \n图 8-11. 向示例列表添加的新列表项\n\n### 删除列表项\n\n本示例将向你展示如何删除列表项，这里我们将删除上一个示例中添加的项。\n\n####\
  \ HTML\n\n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为`JSOMDeleteListItems.html`。这个文件的\
  \ HTML 要精简得多，因为我们只需要从用户那里获取一个 ID，对应他们想要删除的列表项。这通过以下代码行实现：\n\n```\n<script type=\"\
  text/javascript\" src=\"/_layouts/15/sp.runtime.js\"></script>\n<script type=\"\
  text/javascript\" src=\"/_layouts/15/sp.js\"></script>\n<script type=\"text/javascript\"\
  \ src=\"/apress/Webparts/chapter 8/JSOMDeleteListItems.js\"></script>\n<div>\n \
  \   输入要删除的 ID: <input type=\"text\" id=\"txtId\" />\n</div>\n<div>\n    <input id=\"\
  btnSubmit\" type=\"button\" value=\"提交\" />\n</div>\n<div id=\"divResult\"></div>\n\
  ```\n\n这个示例过于简化了，因为用户很可能不知道要删除的某个列表项的 ID。更真实的示例很可能会向用户显示一个项目列表，并允许他们单击某个项目来删除它。在这种场景下，页面上会事先拥有列表项\
  \ ID，并且可以轻松访问。我们保留一个简单的文本框以保持示例的流畅性。\n\n\n\n#### JavaScript\n\n在 Visual Studio 中新建一个\
  \ JavaScript 文件，将其命名为 `JSOMDeleteListItems.js`，并包含以下代码：\n\n```\n$(function () {\n\
  \    bindButtonClick();\n});\n\nfunction bindButtonClick() {\n    $(\"#btnSubmit\"\
  ).on(\"click\", function () {\n        deleteListItem();\n    });\n}\n\nfunction\
  \ deleteListItem() {\n    var id = $(\"#txtId\").val();\n    var clientContext =\
  \ new SP.ClientContext();\n    var oList = clientContext.get_web().get_lists().getByTitle('Demo\
  \ List');\n    this.oListItem = oList.getItemById(id);\n    oListItem.deleteObject();\n\
  \    clientContext.executeQueryAsync(\n        Function.createDelegate(this, this.onQuerySucceeded),\n\
  \        Function.createDelegate(this, this.onQueryFailed)\n    );\n}\n\nfunction\
  \ onQuerySucceeded(sender, args) {\n    $(\"#divResult\").html(\"项目已成功删除！\");\n\
  }\n\nfunction onQueryFailed(sender, args) {\n    alert('请求失败。' + args.get_message()\
  \ +\n        '\\n' + args.get_stackTrace());\n}\n```\n\n`deleteListItem()` 函数将在页面的按钮点击事件中被调用。首先，我们通过以下代码获取用户在页面上输入的\
  \ ID：\n\n```\nvar id = $(\"#txtId\").val();\n```\n\n接着，我们获取当前的客户端上下文和对 `Demo List`\
  \ 的引用。删除项目的操作通过以下代码完成：\n\n```\nthis.oListItem = oList.getItemById(id);\noListItem.deleteObject();\n\
  ```\n\n我们在列表对象上使用 `getItemById()` 方法，传入用户提交的 ID。然后，调用 `deleteObject()` 方法实际执行删除。与本章前面删除列表类似，这就是删除列表项所需的全部操作。我们无需将删除调用加载到客户端上下文中，只需执行查询即可。`success`\
  \ 函数会通知用户删除操作已成功。\n\n### 结果\n\n将 **内容编辑器 Web 部件** 的 `内容链接` 属性设置为该 HTML 文件，然后保存页面。页面将显示一个文本框供用户输入\
  \ ID，并在删除项目时显示一条成功消息，如图 8-12 所示。\n\n![A978-1-4842-0544-0_8_Fig12_HTML.jpg](img/A978-1-4842-0544-0_8_Fig12_HTML.jpg)\n\
  \n**图 8-12** 使用 JSOM 删除列表项\n\n## 使用文档库\n\n由于 SharePoint 的优势之一在于文档管理，因此你需要了解如何通过代码操作文档库。由于文档库实际上就是\
  \ SharePoint 中的列表，因此你已经具备了一定的经验！\n\n### 创建新文件夹\n\n在本示例中，我们将演示如何在现有文档库中创建新文件夹。\n\n\
