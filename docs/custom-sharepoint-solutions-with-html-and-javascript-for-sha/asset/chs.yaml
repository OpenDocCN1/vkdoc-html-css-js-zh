  \n图 5-24. 来自第二个 JavaScript 文件的更新后的点击事件\n\n在警告框中，你可以看到状态并附带了额外的“STATUS:”文本。这确认了两个\
  \ JavaScript 文件已通过 JSLink 加载。虽然这是一个非常简单的示例，但它应该能够说明加载多个文件的强大功能。随着脚本越来越大，你现在可以灵活地将代码拆分为多个文件，并通过\
  \ JSLink 引用它们。\n\n## 总结\n\n在本章中，我们探讨了 JSLink 作为在 SharePoint 中构建自定义解决方案的一种方式的强大功能。我们看到了如何使用这种方法覆盖列表视图\
  \ Web 部件的默认渲染。你可以使用“Item”模板完全自定义整体渲染，或者使用“Fields”模板覆盖列表中的单个或多个字段。我们还了解了如何将代码拆分为多个文件。希望本章展示了\
  \ JSLink 的可能性。在下一章中，我们将继续研究 SharePoint 中的新功能，使用显示模板和结果源来创建自定义搜索解决方案。\n\n"
- '# 内容搜索 Web 部件与显示模板


  自 SharePoint 诞生以来，搜索一直在其使用中扮演着重要角色。无论是网站搜索、企业搜索还是自定义解决方案，SharePoint 的关键优势之一就是能够轻松找到内容。在
  SharePoint 中促进搜索的一种方式是通过内容搜索 Web 部件。它可以轻松地放置在页面上，并配置为向用户返回特定结果。这是一个经过验证且存在已久的 Web
  部件。在最新版本的 SharePoint 中，内容搜索 Web 部件利用了结果源和显示模板等新功能。


  结果源允许你制定特定的搜索条件，以快速定位你正在寻找的内容。显示模板允许你根据业务需求设置搜索结果的样式并呈现它们。这个新功能为开发者在 SharePoint
  中创建丰富、自定义的解决方案提供了另一条途径。在本章中，我们将探讨这些领域，并创建一些自定义搜索解决方案。


  ## 添加文档


  在你开始使用 SharePoint 中的搜索构建解决方案之前，你需要一些实际的文档用于搜索。如果你使用的是现有的 SharePoint 环境，你可能已经有了一些可以搜索的文档。如果你为本书设置了环境，则需要上传一些文档来执行搜索。在本示例中，你将拥有多种文档类型用于搜索，包括
  Word、Excel 和 PDF。图 6-1 显示了文档库中的一些示例文件。


  ![A978-1-4842-0544-0_6_Fig1_HTML.jpg](img/A978-1-4842-0544-0_6_Fig1_HTML.jpg)


  图 6-1. 文档库中的 Excel、PDF 和 Word 文档


  本示例中使用的文档可以从 Apress 下载。请访问 Apress（[www.apress.com](http://www.apress.com/)）并搜索本书标题以查找文档和源代码。


  我使用了现成的“文档”文档库，该库是在我创建名为 Apress 的团队网站时创建的。无论你将文档存储在哪里，这里的要点只是将一些文件上传到 SharePoint
  中，以便你可以搜索它们。现在，一些文件已上传并最终将被索引，你可以创建一个自定义结果源来方便搜索。




  ## 结果源


  在 SharePoint 2010 中，您有自定义搜索范围的概念。它们允许您将搜索结果限制在特定的内容上，从而为最终用户提供更有针对性的搜索，而无需他们知道如何构造复杂的搜索查询。在
  SharePoint 2013 中，您可以通过自定义结果源实现完全相同的目的。


  在 SharePoint 2013 中执行搜索时，系统会将该查询与结果源进行匹配以提供结果。结果源是一种定义，用于指定以下内容：


  - **协议（Protocol）** - 可以是本地搜索服务索引、远程 SharePoint 安装、Exchange，甚至是使用 `OpenSearch` 协议的其他搜索引擎。

  - **源 URL（Source URL）** - 如果您使用的是 `Local SharePoint` 以外的协议，则需要为返回搜索结果的服务器提供一个 URL。

  - **类型（Type）** - 使用 `Local` 或 `Remote SharePoint` 时，您可以指定 `SharePoint Search` 或
  `People Search`。

  - **查询转换（Query transform）** - 使用查询转换，您可以通过 `KQL` 属性限制来缩小给定搜索的结果范围。

  - **凭据（Credentials）** - 您可以指定用于搜索的凭据。


  SharePoint 附带了许多预配置的结果源供您使用，包括 `Conversations`、`Documents` 和 `Pictures` 等。此外，还可以在
  SharePoint 的各个级别创建自定义结果源，而创建结果源的位置决定了您所需的权限级别。以下列出了可以创建结果源的级别以及创建它们所需的权限：


  - **网站集（Site Collection）** - 您必须是网站集管理员，并且结果源可供网站集中的任何网站使用。

  - **网站（Site）** - 您必须是网站的 `Owners` 组成员，并且结果源只能由该网站使用。


  您还可以在 `Search Service Application` 级别或 Office 365 的 `SharePoint Admin Center` 指定结果源，该结果源可供任何使用
  `Search Service Application` 的网站集使用。本书不会介绍此级别，但是，在此级别创建结果源的步骤也是完全相同的。


  创建自定义结果源时，您需要做出的第一个决定是在哪个级别创建它。这取决于您打算如何使用该源；例如，如果要突出显示特定网站中的项目，则 `Site` 级别是合理的。但如果您想要一个范围更广的结果源，您可能希望在
  `Site Collection` 级别创建它。两者的步骤完全相同。如果您计划在 `Site Collection` 或 `Site` 级别创建新的结果源，只需导航到
  `Site Settings` 页面，然后在 `Site` 级别选择 `Search` 标题下的 `Result Sources`，或者在 `Site Collection`
