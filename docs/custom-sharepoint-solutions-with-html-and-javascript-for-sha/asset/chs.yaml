  \ = siteTitle.replace(/\\s/g, \"\");\n```\n\n获取标题并移除空格后，我们需要构造指向该站点的 REST URL：\n\
  \n```javascript\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\nvar fullUrl =\
  \ siteUrl + \"/\" + siteTitleNoSpaces + \"/_api/web\";\n```\n\n删除站点与到目前为止执行的其他删除操作并无不同。我们需要做的就是包含\
  \ `\"X-HTTP-Method\": \"DELETE\"` 和 `\"IF-MATCH\": \"*\"` 标头。`success` 函数将向用户显示一条消息，告知他们删除操作已完成。\n\
  \n\n\n### 结果\n\n将内容编辑器 Web 部件的 `Content Link` 属性设置为 HTML 文件并保存页面。页面将显示一个文本框，供用户输入网站标题，并显示一条结果消息，如图\
  \ 9-20 所示。\n\n![A978-1-4842-0544-0_9_Fig20_HTML.jpg](img/A978-1-4842-0544-0_9_Fig20_HTML.jpg)\n\
  \n图 9-20.\n\n通过 REST 删除子网站\n\n在本示例中，我们将删除刚刚创建的网站。导航回到“网站内容”页面后，将显示子网站已被成功删除，如图 9-21\
  \ 所示。\n\n![A978-1-4842-0544-0_9_Fig21_HTML.jpg](img/A978-1-4842-0544-0_9_Fig21_HTML.jpg)\n\
  \n图 9-21.\n\n网站已从根网站中移除\n\n## 使用社交数据\n\n社交数据是 SharePoint 2013 中的一个热门话题，随着您开始创建自定义解决方案，您应该对其有所了解。在本节中，我们将了解如何检索一些社交数据并将其显示给当前登录的用户。\n\
  \n#### HTML\n\n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为 `RESTGetSocialData.html`。此页面的标记将包含几个\
  \ `DIV` 和一个用于输出数据的 `SPAN`。它包含以下代码行：\n\n```\n<script type=\"text/javascript\" src=\"\
  /apress/Webparts/chapter 9/RESTGetSocialData.js\"></script>\n<link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"/apress/Webparts/chapter 9/RESTGetSocialData.css\" />\n\
  <div id=\"WelcomeMessage\">\n    欢迎回来 <span id=\"WelcomeMessageUserName\"></span>\n\
  </div>\n<div id=\"UserFollows\" />\n```\n\n我们将包含一个名为 `RESTGetSocialData.css` 的自定义\
  \ CSS 文件。它将用于样式化脚本的输出。其他所有示例本可以轻松地包含用于样式化的 CSS。您会在自定义开发工作中发现，样式化将在您的许多 Web 部件中扮演重要角色，因此本示例将向您展示包含样式化是多么简单。\n\
  \n#### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript 文件，并将其命名为 `RESTGetSocialData.js`。包含以下代码：\n\
  \n```\n$(function () {\n    getUserProfileInfo();\n    getUserFollows();\n});\n\n\
  function getUserProfileInfo() {\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \    var fullUrl = siteUrl + \"/_api/social.feed/my\";\n    $.ajax({\n        url:\
  \ fullUrl,\n        type: \"GET\",\n        headers: {\n            \"accept\":\
  \ \"application/json;odata=verbose\",\n            \"content-type\": \"application/json;odata=verbose\"\
  ,\n        },\n        success: onUserInfoQuerySucceeded,\n        error: onQueryFailed\n\
  \    });\n}\n\nfunction getUserFollows() {\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \    var fullUrl = siteUrl + \"/_api/social.following/my/followed(types=15)\";\n\
  \    $.ajax({\n        url: fullUrl,\n        type: \"GET\",\n        headers: {\n\
  \            \"accept\": \"application/json;odata=verbose\",\n            \"content-type\"\
  : \"application/json;odata=verbose\",\n        },\n        success: onFollowQuerySucceeded,\n\
  \        error: onQueryFailed\n    });\n}\n\nfunction onUserInfoQuerySucceeded(data)\
  \ {\n    $(\"#WelcomeMessageUserName\").text(data.d.Me.Name);\n}\n\nfunction onFollowQuerySucceeded(data)\
  \ {\n    var following = data.d.Followed.results;\n    var followedItems = \"您正在关注的项目：<br\
  \ />\";\n    $.each(following, function (index, value) {\n        followedItems\
  \ += \"<a href='\" + value.Uri + \"'>\" + value.Name + \"</a><br />\";\n    });\n\
  \    $(\"#UserFollows\").append(followedItems);\n}\n\nfunction onQueryFailed(sender,\
  \ args) {\n    alert(\"错误\");\n}\n```\n\n关于此示例，首先应该引起您注意的是引入了第二个函数来检索数据。我们有一个函数用于检索用户配置文件信息，另一个用于检索“关注”信息。这是因为这些数据的\
  \ REST 端点不同，因此需要两次调用才能检索我们希望在页面上显示的所有内容。\n\n**注意**\n\n在上一章中，我们讨论了如何使用批处理来“批量处理”JSOM\
  \ 请求。这允许您将对数据的所有不同请求合并到一次调用中，从而提高性能。SharePoint Online 和 Office 365 支持在使用 REST API\
  \ 时通过 `$batch` 查询运算符进行批处理。使用它，您可以优化此示例的性能。但是，使用 REST API 进行批处理是一个深入的话题，超出了本书的范围。重要的是您知道有这种可能性。您可以在\
  \ [`http://msdn.microsoft.com/EN-US/library/office/dn903506%28v=office.15%29.aspx`](http://msdn.microsoft.com/EN-US/library/office/dn903506%28v=office.15%29.aspx)\
  \ 上阅读更多相关信息。\n\n第一个函数 `getUserProfileInfo` 用于检索用户的显示名称。要获取此信息，我们将使用社交源 REST API：\n\
  \n```\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\nvar fullUrl = siteUrl +\
  \ \"/_api/social.feed/my\";\n```\n\n此 URL 看起来与 REST API 中的所有其他端点有些不同，因为其 URL 中包含\
  \ `social.feed`。社交源包含两个组件：Feed（源）和 Following（关注），这种格式正是我们定位每个组件的方式。用户信息可以在 `my`\
  \ 端点下找到，并且您可以为每个用户找到其他信息，例如新闻、赞等。\n\n**注意**\n\n社交源公开了大量关于用户的数据。在此示例中，我们只显示用户的显示名称，但您可以访问更多信息。您可以在\
  \ [`http://msdn.microsoft.com/EN-US/library/office/dn155789%28v=office.15%29.aspx`](http://msdn.microsoft.com/EN-US/library/office/dn155789%28v=office.15%29.aspx)\
  \ 上找到关于可用信息的更多信息。\n\n`success` 函数从结果中提取显示名称：\n\n```\n$(\"#WelcomeMessageUserName\"\
  ).text(data.d.Me.Name);\n```\n\n社交源返回的结果也与之前的示例略有不同。正如您所见，我们仍然有熟悉的 `data.d` 对象，但用户数据进一步嵌套在一个名为\
  \ `Me` 的对象下，我们可以从中获取 `Name` 属性。\n\n\n\n第二个函数 `getUserFollows()` 用于检索用户关注的所有项目。要获取此信息，我们将使用\
  \ `social.following` 内容源：\n\n```\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  ```\n```\nvar fullUrl = siteUrl + \"/_api/social.following/my/followed(types=15)\"\
  ;\n```\n\n然后，我们可以使用 `followed` 端点获取用户关注的所有目标（actor）。目标实际上就是用户关注的任何内容，可以是用户、文档、网站或标签。调用\
  \ `followed` 端点时，需要传入一个数字，该数字对应你想要返回的目标类型。在此示例中，我们使用 15，这表示所有目标。\n\n你可以在 [`http://msdn.microsoft.com/en-us/library/microsoft.sharepoint.client.social.socialactortypes(v=office.15).aspx`](http://msdn.microsoft.com/en-us/library/microsoft.sharepoint.client.social.socialactortypes(v=office.15).aspx)\
  \ 查看完整的数值列表。\n\n注意\n\n以下内容源还会公开大量关于用户的数据。你可以在 [`http://msdn.microsoft.com/EN-US/library/office/dn194080%28v=office.15%29.aspx`](http://msdn.microsoft.com/EN-US/library/office/dn194080%28v=office.15%29.aspx)\
  \ 找到更多信息。\n\n`success` 函数包含一个 jQuery 循环，用于构建 HTML 以显示用户关注的所有项目：\n\n```\nvar following\
  \ = data.d.Followed.results;\n```\n```\nvar followedItems = \"Items you are following:<br\
  \ />\";\n```\n```\n$.each(following, function (index, value) {\n    followedItems\
  \ += \"<a href='\" + value.Uri + \"'>\" + value.Name + \"</a><br />\";\n});\n```\n\
  ```\n$(\"#UserFollows\").append(followedItems);\n```\n\n与用户信息类似，关注数据嵌套在 `data.d`\
  \ 对象中一个名为 `Followed` 的对象内。该对象包含熟悉的 `results` 对象，其中保存了所有项目。我们创建一个新变量来保存所有关注的项目。接着，使用\
  \ jQuery `each` 循环遍历每个项目。对于每个项目，我们获取 `Uri`（项目的 URL）和 `Name`（名称），以构造一个链接，方便用户从页面直接跳转到该项目。最后，使用以下代码将所有\
  \ HTML 追加到页面：\n\n```\n$(\"#UserFollows\").append(followedItems);\n```\n\n#### CSS\n\
  \n在 Visual Studio 中创建一个新的 CSS 文件，并将其命名为 `RESTGetSocialData.css`。包含以下代码：\n\n```\n\
  #WelcomeMessage {\n    margin-bottom: 20px;\n}\n#WelcomeMessageUserName {\n    font-weight:\
  \ bold;\n}\n#UserFollows {\n    border:dashed 1px #C0C0C0;\n    width:240px;\n \
  \   padding: 6px;\n}\n```\n\n这段 CSS 非常基础，仅用于简单演示样式。我们为欢迎用户的提示信息设置底部外边距，并将用户名设为粗体。关注的项目将用虚线边框包裹以突出显示。\n\
  \n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为指向该 HTML 文件，然后保存页面。页面将向用户显示一条“欢迎回来”的消息，用户名以粗体显示。正下方是一个列表，包含他们关注的所有项目，以超链接形式显示，如图\
  \ 9-22 所示。\n\n![A978-1-4842-0544-0_9_Fig22_HTML.jpg](img/A978-1-4842-0544-0_9_Fig22_HTML.jpg)\n\
  \n图 9-22. 通过 REST 检索到的社交数据\n\n## 总结\n\n在本章中，我们深入探讨了 REST API，并研究了如何使用 Etherson 方法通过它创建自定义\
  \ Web 部件。我们查看了各种示例：查询列表数据、创建新列表和网站，以及查询关于用户的社交数据。尽管与本书其他章节相比，本章篇幅较长，但它仅触及了 SharePoint\
  \ 中 REST 可能实现的表层。然而，通过完成此处给出的所有示例，你应已牢固掌握如何使用 REST API，以及 HTML、JavaScript 和 CSS\
  \ 如何在自定义 Web 部件中协同工作。现在，你应该可以自如地开始使用 REST 构建自己的自定义解决方案了。\n\n\n\n"
