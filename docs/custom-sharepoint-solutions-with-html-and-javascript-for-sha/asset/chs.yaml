  \ 部件”文档库中的“Simple Example”文件夹。系统将弹出一个对话框询问您是否要替换当前文档；单击“确定”（OK）。Etherson 方法的优点依然有效；由于您在文档库中启用了版本控制，您可以毫无压力地替换文件。如果出现错误，您可以恢复之前的版本！导航回您的页面，您将看到更新后的代码正在获取列表项并显示它们，如图\
