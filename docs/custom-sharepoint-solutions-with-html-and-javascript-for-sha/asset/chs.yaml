- "# 1. 设置你的开发环境\n\n正确设置开发环境将为你提供构建自定义解决方案所需的所有工具。许多你需要的功能已内置在 SharePoint 中，可直接使用。不过，你可能还需要下载并安装一些额外的工具来简化工作流程，这些工具包括：\n\
  \n*   SharePoint Online 开发人员网站\n*   SharePoint Designer\n*   Visual Studio Express\n\
  *   各类浏览器及开发者工具\n*   jQuery\n*   在 SharePoint 环境中部署 jQuery\n\n如果这份清单让你感到棘手，不必担心。本章将详细探讨每一项内容，帮助你熟悉它们及其用途。此外，我们还会介绍如何创建自己的\
  \ SharePoint Online 环境作为开发区域，并演示如何在该环境中部署 jQuery。\n\n如果你已经在开发 SharePoint 解决方案，甚至只是从事\
  \ Web 开发工作，那么这些工具很可能已经安装好了。本章将更侧重于面向业务用户或前端开发新手。如果你是一名经验丰富的开发者，可以快速浏览本章，确认是否已具备所需工具。无论你是谁，本章结束时你都将做好充分准备，开启在\
  \ SharePoint 中构建自定义解决方案的旅程！\n\n### SharePoint Online 开发人员网站\n\n毋庸置疑，如果没有一个可以施展的环境，能够构建自定义\
  \ SharePoint 解决方案的技能也毫无用武之地！有些读者可能已经拥有可用于开发的环境。这可能是你公司用于内部网的 SharePoint Online 环境，也可能是\
  \ SharePoint 2013 本地部署环境。也许你正初次尝试学习 SharePoint 开发，但目前还没有可操作的环境。无论何种情况，你都有多种选择，我们将在本节中逐一探讨。\n\
  \n注意\n\n本节讨论的选项将重点围绕 SharePoint Online 和 Office 365。如果你已在本地方安装了 SharePoint，可以轻松创建一个新网站进行开发。即使你工作中已能使用\
  \ SharePoint，你仍可能希望拥有自己的独立工作环境，因此本节提供的选项同样适用。\n\n微软已大大简化了在最新版 SharePoint 上进行前端开发的入门流程。你可以通过以下网址注册\
  \ Office 365 开发人员网站：[`http://msdn.microsoft.com/en-us/library/office/fp179924(v=office.15).aspx`](http://msdn.microsoft.com/en-us/library/office/fp179924(v=office.15).aspx)。图\
  \ 1-1 展示了该页面及各种注册选项。\n\n![A978-1-4842-0544-0_1_Fig1_HTML.jpg](img/A978-1-4842-0544-0_1_Fig1_HTML.jpg)\n\
  \n图 1-1.\n\n微软网站上的 Office 365 开发人员网站注册选项\n\n如图所示，创建开发人员网站有三种方式：\n\n*   MSDN 订阅用户\
  \ - 如果你或你所在公司订阅了 MSDN，你可以作为该权益的一部分免费创建一个开发人员网站。很多拥有专职开发人员的公司都订阅了 MSDN，或者你个人可能也拥有订阅。无论哪种情况，只需点击“立即兑换您的权益”链接即可开始。如果你是业务用户，也值得考虑这个选项。如果你的公司有\
  \ MSDN 订阅，你可以申请一个许可证，或让 IT 部门为你创建网站并授予访问权限。\n*   Office 365 订阅用户 - 已订阅 E3 或 E4 Office\
  \ 365 计划的企业可以直接从 Office 365 管理中心预配开发人员网站。这些订阅级别允许使用针对开发人员的特殊网站模板创建新的专用网站集。有关创建开发人员网站的完整详细信息和步骤指南，请访问以下网址：[`http://msdn.microsoft.com/en-us/library/office/jj692554(v=office.15).aspx`](http://msdn.microsoft.com/en-us/library/office/jj692554(v=office.15).aspx)。\n\
  *   30 天试用版或开发者订阅 - 如果你希望或需要一个自己的环境，微软还提供 30 天的 Office 365 试用版。这是一个很好的选择，因为它为你提供了充足的时间来探索\
  \ Office 365 和 SharePoint Online，并在完全属于你自己的环境中测试开发技能。你还可以随时将该试用升级为每年 99.00 美元的年订阅。即使你在公司拥有\
  \ SharePoint，这也是一个绝佳选择。它能为你提供一个完全独立于生产环境的理想空间，用于构建自定义解决方案。每年 99 美元的价格，让你能以低成本构建解决方案，并可轻松迁移到生产环境中。\n\
  \n无论你的情况如何，你都可以轻松获得一个可用于开发自定义 SharePoint 解决方案的环境。我们已经讨论过如何获取 SharePoint 环境，接下来让我们探索一下本书中将使用的一些工具。\n\
  \n注意\n\n本书中的所有示例和截图均来自 SharePoint Online 环境，这是目前可用的最新版 SharePoint。\n\n### SharePoint\
  \ Designer\n\n如果你以前用过 SharePoint，那么你可能也用过 SharePoint Designer。它是微软提供的免费工具，也是处理 SharePoint\
  \ 相关任务的主力工具。它允许你执行广泛的任务——从品牌定制、连接外部数据库、构建列表等等。在本书中，Designer 并非核心工具，但它在帮助我们实现 jQuery\
  \ 与 SharePoint 的集成方面将发挥关键作用。这部分内容将在本章末尾介绍。现在，让我们先下载 Designer。\n\n你可以通过以下网址下载 SharePoint\
  \ Designer：[`http://www.microsoft.com/en-us/download/details.aspx?id=35491`](http://www.microsoft.com/en-us/download/details.aspx?id=35491)。图\
  \ 1-2 展示了微软下载中心网站上可供下载 Designer 的页面。\n\n![A978-1-4842-0544-0_1_Fig2_HTML.jpg](img/A978-1-4842-0544-0_1_Fig2_HTML.jpg)\n\
  \n图 1-2.\n\n微软网站上的 SharePoint Designer 下载页面\n\n现在，你只需下载并安装 Designer；我们稍后会使用它。尽管本书未对\
  \ Designer 进行深入探讨，但当你在使用 SharePoint 时，它仍会是一个非常有用的工具。如前所述，它功能广泛，能协助你完成许多任务。Designer\
  \ 同时适用于 SharePoint Online 和本地部署环境。\n\n\n\n### Visual Studio Express\n\n如果你不是开发者，可能没听说过\
  \ Visual Studio Express；即便听说过，它对你来说可能也像是为代码高手准备的高深程序。从某种程度上说，确实如此，但它是一个强大的工具，我们将用它来编写`HTML`和`JavaScript`代码。而且它还是免费的，由微软提供。\n\
  \n`Visual Studio`是一个集成开发环境，简称`IDE`。简单来说，就是“一个允许你编写代码的程序”。在本书中，我们所有的示例都将使用`HTML`和`JavaScript`。`HTML`和`JavaScript`的一个优点是，它们只是带有特殊扩展名（`.html`和`.js`）的文本文件。因此，创建和编辑这些文件真正需要的只是`记事本`。然而，尽管`记事本`看起来友好且不具威胁性，但在编写代码时它绝不是你的朋友。`Visual\
  \ Studio Express`提供了你所需的所有工具——甚至在检测到问题时还会提醒你。`记事本`可做不到这一点！\n\n根据技术需求的复杂程度，`Visual\
  \ Studio`有多种不同的版本。Express 版是一个功能齐全的版本，完全能满足本书的需求。你可以通过以下网址下载`Visual Studio Express`：[`http://www.visualstudio.com/en-us/products/visual-studio-express-vs.aspx`](http://www.visualstudio.com/en-us/products/visual-studio-express-vs.aspx)。图\
  \ 1-3 展示了`Visual Studio`网站的下载页面。\n\n![A978-1-4842-0544-0_1_Fig3_HTML.jpg](img/A978-1-4842-0544-0_1_Fig3_HTML.jpg)\n\
  \n图 1-3. 微软网站上的 Visual Studio Express 下载页面\n\n`Visual Studio Express`有多个版本，包括 Web、Windows\
  \ 等。`Express for Web`是使用`HTML`和`JavaScript`构建解决方案的理想版本。\n\n### 浏览器与开发者工具\n\n当最终用户使用`SharePoint`时，显然首选浏览器是`Internet\
  \ Explorer`。虽然`SharePoint`与其他浏览器（如`Firefox`和`Chrome`）配合良好，但`Internet Explorer`无疑是微软推荐的浏览器，也是`SharePoint`最可能友好兼容的。话虽如此，本书主要介绍如何使用`HTML`和`JavaScript`构建自定义解决方案，你会发现大多数现代浏览器的操作和表现都是一致的。在讨论浏览器之前，我们先来谈谈开发者工具。\n\
  \n开发者工具是一个通用术语，指的是用来帮助开发、调试，以及了解浏览器中`HTML`、`JavaScript`和`CSS`运行状况的工具。它们也可能被称为开发者工具栏、浏览器工具，或者完全不同的名称，比如`Firebug`。无论是什么工具，它们的功能都是一样的：帮助你开发解决方案。在几乎所有的浏览器中，你只需按下键盘上的`F12`键即可启动开发者工具，如图\
  \ 1-4 在`Internet Explorer`中所示。\n\n![A978-1-4842-0544-0_1_Fig4_HTML.jpg](img/A978-1-4842-0544-0_1_Fig4_HTML.jpg)\n\
  \n图 1-4. 在 Internet Explorer 中按下`F12`后启动的开发者工具\n\n如图 1-4 所示，这些工具提供了大量关于浏览器内部运行情况的洞察。你可以立即看到生成页面的`HTML`，以及应用的`CSS`样式。使用工具左侧的菜单，你还可以查看页面上加载了哪些`JavaScript`，甚至查看其中的代码。你甚至可以更进一步，在`JavaScript`中设置“断点”来暂停其执行，以便观察这些脚本运行时发生了什么。在前端开发工作中，这是一个非常宝贵的工具，我们会经常用到它。\n\
  \n图 1-5 展示了在`Google Chrome`中打开的开发者工具。同样，只需按下`F12`键即可打开。与`Internet Explorer`一样，你可以立即看到页面上应用的`HTML`和样式。\n\
  \n![A978-1-4842-0544-0_1_Fig5_HTML.jpg](img/A978-1-4842-0544-0_1_Fig5_HTML.jpg)\n\
  \n图 1-5. 在 Google Chrome 中按下`F12`后启动的开发者工具\n\n在`Chrome`中，菜单选项横跨工具屏幕顶部，提供类似的功能。你可以通过再次按下`F12`键来关闭开发者工具，就像打开它们一样。你应该下载几种浏览器，熟悉一下它们的工具。每个开发者对浏览器和工具都有自己的偏好；我偏好的是`Firefox`和`Firebug`，本书将使用它们。\n\
  \n我要明确地说，我认为`Internet Explorer`是一款出色的浏览器，至少最新版本是这样。这些年来它取得了长足的进步，终于能与一些后来居上的新秀浏览器相媲美。`Internet\
  \ Explorer`中的开发者工具非常好用，但我最偏好的还是`Firefox`中的`Firebug`。`Firebug`是`Firefox`的一个附加组件，其功能与其他浏览器中的工具类似，但在我看来，它组织内容的方式更友好、更易用。你绝对应该找到自己的偏好，使用最适合你的浏览器和工具。本书中的所有示例都将使用`Firebug`，但你并不局限于这些工具。\n\
  \n要安装`Firebug`，请通过以下网址下载`Firefox`浏览器：[`https://www.mozilla.org/firefox/`](https://www.mozilla.org/firefox/)。安装完成后，点击右上角的菜单图标。图\
  \ 1-6 展示了打开的菜单，其中高亮了“附加组件”选项。\n\n![A978-1-4842-0544-0_1_Fig6_HTML.jpg](img/A978-1-4842-0544-0_1_Fig6_HTML.jpg)\n\
  \n图 1-6. Firefox 菜单中的“附加组件”菜单选项\n\n点击“附加组件”选项，将在新标签页中打开“附加组件管理器”页面。该页面允许你管理所有附加组件并搜索新的组件。在屏幕右上角的搜索框中输入`firebug`，然后点击放大镜图标。图\
  \ 1-7 显示了输入后的搜索框。\n\n![A978-1-4842-0544-0_1_Fig7_HTML.jpg](img/A978-1-4842-0544-0_1_Fig7_HTML.jpg)\n\
  \n图 1-7. 搜索前的附加组件管理器页面上的搜索框\n\n搜索结果会返回所有匹配的附加组件，`Firebug`应该在列表顶部。点击图 1-8 中所示的“安装”按钮，将`Firebug`添加到`Firefox`中。\n\
  \n![A978-1-4842-0544-0_1_Fig8_HTML.jpg](img/A978-1-4842-0544-0_1_Fig8_HTML.jpg)\n\
  \n图 1-8. 点击“安装”按钮将在 Firefox 中安装 Firebug\n\n下载和安装完成后，`Firefox`会在右上角菜单旁边显示一个“bug”图标。图\
  \ 1-9 高亮了`Firebug`图标。\n\n![A978-1-4842-0544-0_1_Fig9_HTML.jpg](img/A978-1-4842-0544-0_1_Fig9_HTML.jpg)\n\
  \n图 1-9. 安装完成后显示 Firebug 图标\n\n现在`Firebug`已安装，你可以像在其他浏览器中打开开发者工具一样打开它——按下键盘上的`F12`键。你也可以点击`Firebug`图标来打开它，如图\
  \ 1-10 所示。\n\n![A978-1-4842-0544-0_1_Fig10_HTML.jpg](img/A978-1-4842-0544-0_1_Fig10_HTML.jpg)\n\
  \n图 1-10. 通过点击`F12`切换打开的 Firebug\n\n如图 1-10 所示，`Firebug`的外观和功能与其他浏览器中的开发者工具非常相似。再次强调，最终选择使用哪些工具是你的个人偏好。本书中的所有示例都将使用`Firefox`和`Firebug`。\n\
  \n\n\n### jQuery\n\n如果你过去做过任何 JavaScript 开发工作，你可能会时常感到有些沮丧。JavaScript 是一个出色的前端开发框架，它速度快，能让你迅速构建有用的代码。但有时它难以驾驭、难以调试，而且让新手望而生畏。jQuery\
  \ 的出现改变了这一切。\n\njQuery 是一个与 JavaScript 协同工作的框架，旨在让前端代码的编写更简单、更快速。jQuery 自称是“写得更少，做得更多”的框架——你会发现事实确实如此。它很快成为了\
  \ JavaScript 开发的标准，本书中的许多示例都会以某种方式用到 jQuery。如果你从未使用过它，也别担心：我们会从基础开始，让你逐步掌握。\n\n\
  **注**\n\n如果你是 jQuery 新手，jQuery 网站上有一个很棒的“入门”指南，网址是 [`http://learn.jquery.com/about-jquery/how-jquery-works/`](http://learn.jquery.com/about-jquery/how-jquery-works/)。此外，还有杰克·富兰克林（Apress，2013\
  \ 年）编写的《jQuery 入门》一书，对于刚起步的读者来说是一个很好的资源（参见 [`www.apress.com/9781430249320`](http://www.apress.com/9781430249320)）。\n\
  \n现在，我们来做一个快速的 jQuery 练习，让你熟悉它的工作原理。jQuery 的主要优点之一是能够轻松选择页面上的 HTML 元素。实现这一点的两种主要方法是使用元素的\
  \ ID 或其 CSS 类。图 1-11 显示了在打开 Firebug 的 Firefox 浏览器中的 jQuery 主页（[`jquery.com`](http://jquery.com)）。我们将在\
  \ jQuery 的网站上做这个练习，因为该网站肯定已经加载了 jQuery！\n\n![A978-1-4842-0544-0_1_Fig11_HTML.jpg](img/A978-1-4842-0544-0_1_Fig11_HTML.jpg)\n\
  \n*图 1-11. 在打开 Firebug 的 Firefox 浏览器中显示 jQuery 主页。将鼠标悬停在某个 HTML 部分上，页面会高亮显示它*\n\n\
  我们在 Firebug 中展开了 HTML 结构，并定位到页面左上角的徽标。当鼠标悬停在 HTML 上时，Firebug 会在浏览器中高亮显示相应的部分，让你能轻松看到它。在此页面上，徽标位于一个\
  \ ID 为 `\"logo-events\"` 的 `DIV` 元素内部。由于该元素有 ID，因此可以使用 jQuery 轻松定位。在 Firebug 中，单击标题为“Script”（脚本）的选项卡将其激活，如图\
  \ 1-12 所示。\n\n![A978-1-4842-0544-0_1_Fig12_HTML.jpg](img/A978-1-4842-0544-0_1_Fig12_HTML.jpg)\n\
  \n*图 1-12. 在 Firebug 中激活的“Scripts”（脚本）选项卡*\n\n在“Scripts”（脚本）选项卡中，有两个主要区域可用于处理前端代码。左侧面板显示当前正在检查的脚本。它上方有一个下拉菜单，你可以查看并选择当前页面加载的所有\
  \ JavaScript 文件。我们稍后会详细探讨这一点。右侧面板有更多选项卡，但最主要的是“Watch”（监视）选项卡。在此选项卡中，我们可以使用“New watch\
  \ expression”（新建监视表达式）文本框直接在浏览器中按需运行 JavaScript 命令。在编写前端代码时，这个区域将非常有用。\n\n单击“New\
  \ watch expression”（新建监视表达式）文本框内部，输入以下代码行，然后按回车键：\n\n```\n$(\"#logo-events\")\n\
  ```\n\n图 1-13 显示了运行这行代码的输出结果。\n\n![A978-1-4842-0544-0_1_Fig13_HTML.jpg](img/A978-1-4842-0544-0_1_Fig13_HTML.jpg)\n\
  \n*图 1-13. 在“Watch”（监视）选项卡中运行 jQuery 命令的输出*\n\n如你所见，结果是一个 Object（对象），在方括号内你可以看到\
  \ `\"div#logo-events\"`，这意味着 jQuery 成功找到了你正在查找的元素。让我们花点时间看看这到底是怎样发生的，以及 jQuery 是如何工作的。我们可以将\
  \ jQuery 命令的结构分解如下：\n\n- `$` - 这是调用 jQuery 的简写符号。所有 jQuery 命令都以这个符号开头。你可以把它理解为让\
  \ jQuery 去为你做一些事情。在这个例子中，我们是在说：“jQuery，去找出具有这个 ID 的元素。”`$` 后面总是跟着 `()`，括号内是你正在查找的元素。\n\
  - `#` - 这是一个简写符号，用于告诉 jQuery 你正在通过元素的 ID 来查找。`#` 后面的任何文本都应该是 HTML 元素上的有效 ID，并且只会返回一个结果，因为\
  \ HTML 元素不能共享 ID。\n- `.` - 这是一个简写符号，用于告诉 jQuery 你正在通过元素的 CSS 类来查找。因此，如果你的 HTML 中有\
  \ 10 个共享同一个 CSS 类 `\"red-box\"` 的 `DIV` 元素，你可以使用以下命令找到它们：`$(\".red-box\")`。它的结构与\
  \ ID 命令完全相同，只是将 `$` 换成了 `.`。`. ` 后面总是跟着 `()`，括号内是你正在查找的元素。\n\n既然我们已经找到了包含徽标的 `DIV`\
  \ 元素，就可以开始对其使用 jQuery 并操作页面上的 HTML 了。单击“New watch expression”（新建监视表达式）文本框内部，输入以下代码行，然后按回车键：\n\
  \n```\n$(\"#logo-events\").hide(\"slow\")\n```\n\n你会看到徽标区域从浏览器窗口中慢慢消失。你可以使用以下命令将其显示回来：\n\
  \n```\n$(\"#logo-events\").show(\"slow\")\n```\n\n这些都是非常简单的示例，但应该能展示 jQuery 能轻松为你的代码带来的强大功能。本书将通篇使用\
  \ jQuery，因此随着学习的深入，你会看到更多示例，并对它的使用越来越熟悉。现在，让我们在 SharePoint 环境中实现 jQuery，以便随时使用。\n\
  \n### 使用 SharePoint Designer 在 SharePoint 环境中实现 jQuery\n\n对于部分人来说，jQuery 已经在 SharePoint\
  \ 中实现了。这可能是为了支持之前的开发而完成的。但是，如果你是刚开始使用，或者刚刚注册 SharePoint Online 的试用版，那么你需要实现 jQuery\
  \ 才能学习本书中的示例。实际上，实现 jQuery 非常简单直接，在本节中，我们将介绍如何使用 SharePoint Designer 来实现。\n\n**注**\n\
  \n在你的环境中实现 jQuery 有多种不同的方法。这些方法包括通过自定义代码部署将其注入到所有页面，在特定页面上放置内容编辑器 Web 部件等等。我们将使用\
  \ SharePoint Designer，因为它提供了一种快速简便的方法将 jQuery 引入 SharePoint。\n\n#### 获取 jQuery\n\
  \n在实现 jQuery 之前，我们首先需要引用 jQuery 代码，或者下载一份副本并将其物理上传到 SharePoint。在本节中，我们将使用内容分发网络（CDN）来引用\
  \ jQuery。CDN 基本上是一个公共可用的服务器，上面的内容你可以用于自己的网站。jQuery 运营着一个 CDN，你可以在 [`https://code.jquery.com`](https://code.jquery.com/)\
  \ 上引用它。包括微软和谷歌在内的许多其他公司也运营着托管 jQuery 的 CDN。\n\n使用 CDN 的好处很多。最大的好处是速度快，因为在 Web 上有许多网站使用相同的\
  \ CDN。如果你的用户已经访问过其中一个站点，那么 jQuery 可能已经加载到他们的浏览器中了，因此你的页面加载速度会更快。另一个大好处是你无需担心直接下载和存储代码。无论哪种情况，在生产站点上使用\
  \ CDN 的决定都应咨询你的 IT 部门。在我们的案例中，这完全没问题，你应该放心在开发环境中使用它。\n\n要从 CDN 引用 jQuery，我们将使用以下代码行：\n\
  \n```\n<script src=\"//code.jquery.com/jquery-1.11.0.min.js\"></script>\n```\n\n\
  这是一个基本的 HTML 脚本标签，它将从 jQuery 的 CDN 加载版本 1.11 的 jQuery。你会注意到 URL 中没有 HTTP 或 HTTPS。这样移除后，脚本可以在非安全或安全\
  \ URL 下同样工作。现在让我们看看如何将此代码放入 SharePoint 中。\n\n\n\n#### 团队网站模板\n\n现在我们已经知道如何实现 `jQuery`，接下来就要实际动手了！我们将探讨两种选项：团队网站和发布网站。两者略有不同，所以我们先来看团队网站。启动\
  \ SharePoint Designer，点击“打开网站”图标，如图 1-14 所示。\n\n![A978-1-4842-0544-0_1_Fig14_HTML.jpg](img/A978-1-4842-0544-0_1_Fig14_HTML.jpg)\n\
  \n图 1-14. SharePoint Designer 中显示“打开网站”图标的主屏幕\n\n点击此按钮将弹出“打开网站”对话框，你需要在其中指定 SharePoint\
  \ 网站集的 URL。你可以打开特定的网站集，也可以通过输入 SharePoint 环境的基础 URL 来打开根网站。如果你使用的是 SharePoint Online，根网站的\
  \ URL 格式类似 `https://YOURSITENAME.sharepoint.com`。\n\n图 1-15 展示了“打开网站”对话框。你需要在标有“网站名称”的文本框中输入\
  \ URL，然后点击“打开”。在 Designer 打开网站之前，系统会弹出另一个对话框要求你输入凭据。\n\n![A978-1-4842-0544-0_1_Fig15_HTML.jpg](img/A978-1-4842-0544-0_1_Fig15_HTML.jpg)\n\
  \n图 1-15. “打开网站”对话框，你需要在此提供 SharePoint 网站的 URL\n\n一旦提供凭据并通过身份验证，SharePoint Designer\
  \ 将打开并显示你的网站视图。如果你从未使用过 Designer，不妨花点时间探索一下；你可能会对其提供的信息丰富程度印象深刻。Designer 让你可以深入了解所有列表和库、工作流、外部内容类型以及更多内容。它是一个非常有用的工具——尤其是在无法访问服务器的\
  \ SharePoint Online 环境中。\n\n**注意：** SharePoint Designer 是一个非常强大的工具，能轻易改变你的 SharePoint\
  \ 环境。如果你是新手，在导航时要格外小心，只进行那些你知道不会对环境造成危害的更改。\n\n熟悉 Designer 后，点击左侧导航中的“母版页”链接，如图\
  \ 1-16 所示。此区域不仅显示 SharePoint 中的所有母版页，还显示其他布局，包括搜索结果、显示模板等。我们将在本书后面再次探讨此区域，但现在，请选中\
  \ `seattle.master` 文件。选中该文件后，点击功能区中的“编辑文件”。\n\n![A978-1-4842-0544-0_1_Fig16_HTML.jpg](img/A978-1-4842-0544-0_1_Fig16_HTML.jpg)\n\
  \n图 1-16. SharePoint Designer 中的“母版页”选项卡。选中 `seattle.master` 文件后，点击功能区中的“编辑文件”\n\
  \n如果你是开发新手，下一个界面可能看起来有点吓人，但其实不然。编辑 `seattle.master` 文件时，你会看到所有呈现 SharePoint 页面的\
  \ ASP.NET 代码。嗯，几乎全部。此文件负责 SharePoint 页面的公共部分，例如徽标、功能区、导航等。虽然内容很多，但我们只需要添加 `jQuery`\
  \ 引用——然后退出！\n\n我们将代码行放置在页面顶部附近，就在闭合的 `</head>` 标签之前，如图 1-17 所示。\n\n![A978-1-4842-0544-0_1_Fig17_HTML.jpg](img/A978-1-4842-0544-0_1_Fig17_HTML.jpg)\n\
  \n图 1-17. 添加到 Seattle 母版页的 `jQuery` 引用\n\n如图 1-17 所示，我们将 `jQuery` 引用放置在闭合的 `</head>`\
  \ 标签之前，该标签正好位于开始的 `<body>` 标签上方。它基本上将成为 Head 区域中母版页引用的最后一个脚本。放置完成后，点击屏幕左上角的“保存”图标保存更改。这将自动将更改发布到你的\
  \ SharePoint 环境。\n\n保存更改后，启动浏览器并导航到你的网站。图 1-18 展示了打开 Firebug 的 SharePoint 环境。检查\
  \ HTML，我们可以看到 `jQuery` 引用现在已存在于母版页中，并且可供 SharePoint 中的所有页面使用。\n\n![A978-1-4842-0544-0_1_Fig18_HTML.jpg](img/A978-1-4842-0544-0_1_Fig18_HTML.jpg)\n\
  \n图 1-18. 使用 Firebug 检查 SharePoint 环境，以确保 `jQuery` 引用已就位\n\n**注意：** 一般来说，不建议修改 SharePoint\
  \ 的现成母版页。最主要的原因是，由于它们是现成的，如果 SharePoint Online 发布了更新或新版本并进行升级，你的更改极有可能会丢失。最佳实践是复制一份要修改的母版页，然后修改副本。这样，更新就不会覆盖你的更改。\n\
  \n\n\n#### 发布网站模板\n\n发布网站在修改母版页时表现得截然不同。从 SharePoint 2013 开始引入了设计管理器，它允许你上传一个 HTML\
  \ 文件，该文件将自动转换为母版页。这对于想要上传自定义设计并彻底改变网站外观的用户来说非常有用。然而，我们只需要注入 jQuery，因此需要多完成几个步骤。\n\
  \n打开 SharePoint Designer，点击左侧导航中的 `Master Pages` 链接。你首先会注意到文件数量比团队网站多得多。所有额外的文件都是发布网站自带的，目前你基本上可以忽略它们。找到\
  \ `seattle.master` 文件，你会注意到它附带了一个对应的 HTML 文件，如图 1-19 所示。\n\n![A978-1-4842-0544-0_1_Fig19_HTML.jpg](img/A978-1-4842-0544-0_1_Fig19_HTML.jpg)\n\
  \n图 1-19 发布网站模板中的 SharePoint Designer 母版页\n\n在这种模式下，你只能编辑 HTML 文件。当你对 HTML 文件进行编辑并保存后，更改会被转换并保存到母版页文件中。我们首先需要做的是复制一份\
  \ `seattle.html` 文件，因为这是我们可以实际编辑的文件。选中 `seattle.html` 文件，从功能区的“剪贴板”部分点击 `Copy` 按钮。随后\
  \ `Paste` 按钮会变为可用状态。点击 `Paste`。将创建一份 `seattle.html` 的副本，如图 1-20 所示。\n\n![A978-1-4842-0544-0_1_Fig20_HTML.jpg](img/A978-1-4842-0544-0_1_Fig20_HTML.jpg)\n\
  \n图 1-20 功能区中的“复制”和“粘贴”按钮\n\n复制文件后，它会被粘贴进来，默认名称为 `seattle_copy(1).html`。对大多数人来说，这显然不是一个可接受的名称！你可以右键单击新文件，然后从上下文菜单中选择\
  \ `Rename`，如图 1-21 所示。\n\n![A978-1-4842-0544-0_1_Fig21_HTML.jpg](img/A978-1-4842-0544-0_1_Fig21_HTML.jpg)\n\
  \n图 1-21 上下文菜单中的“重命名”选项\n\n我们将文件重命名为 `seattle_jquery.html`，然后按回车键。由于 HTML 文件通过同名链接到母版页，因此在你重命名新文件之前，Designer\
  \ 会提示你。图 1-22 显示了重命名时你会看到的提示。\n\n![A978-1-4842-0544-0_1_Fig22_HTML.jpg](img/A978-1-4842-0544-0_1_Fig22_HTML.jpg)\n\
  \n图 1-22 重命名复制的 HTML 文件时的重命名提示\n\n重命名后，你现在将拥有一个 `seattle_jquery.html` 文件和一个 `seattle_jquery.master`\
  \ 文件。选中新的 `seattle_jquery.html` 文件，点击功能区中的 `Edit File` 按钮。与团队网站母版页类似，我们将插入以下代码行来引用\
  \ jQuery：\n\n```\n<script src=\"//code.jquery.com/jquery-1.11.0.min.js\"></script>\n\
  ```\n\n这次我们将把它放在一个不同的位置，如图 1-23 所示。它将被添加在 `META` 标签下方，紧跟在一些 SharePoint 开箱即用的标签之后。\n\
  \n![A978-1-4842-0544-0_1_Fig23_HTML.jpg](img/A978-1-4842-0544-0_1_Fig23_HTML.jpg)\n\
  \n图 1-23 向新的母版页文件添加 jQuery 代码行\n\n添加完 jQuery 引用后，点击 `Save`，这将保存并发布文件。它还会生成一个包含修改的新\
  \ `seattle_jquery.master` 文件。现在我们已经添加了引用并更新了所有文件，需要将此新母版页设置为默认，以便我们的网站使用它。选中 `seattle_jquery.master`，点击功能区中的\
  \ `Set as Default`，如图 1-24 所示。\n\n![A978-1-4842-0544-0_1_Fig24_HTML.jpg](img/A978-1-4842-0544-0_1_Fig24_HTML.jpg)\n\
  \n图 1-24 将新母版页设置为默认\n\n现在新的母版页已创建并设置为默认，我们需要检查确保 jQuery 引用已正确设置。导航到使用发布网站模板的站点。图\
  \ 1-25 展示了打开了 Firebug 的 SharePoint 环境。检查 HTML，我们可以看到 jQuery 引用现在位于母版页中，并且对 SharePoint\
  \ 中的所有页面都可用。\n\n![A978-1-4842-0544-0_1_Fig25_HTML.jpg](img/A978-1-4842-0544-0_1_Fig25_HTML.jpg)\n\
  \n图 1-25 新母版页中的 jQuery 引用\n\n任何基于使用发布模板的父站点创建的子站点将自动继承此新母版页。这是在母版页中添加 jQuery 引用的首选方法。复制文件可确保在\
  \ SharePoint 应用更新时，你的更改保持不变。\n\n### 总结\n\n在本章中，我们介绍了本书中做前端开发所需的各种组件。如果你已经在开发解决方案，那么在拿起这本书之前，你可能已经安装了大部分（如果不是全部）这些组件。如果你是前端开发新手，你可能安装了一些新程序！现在，你应该已经拥有开始创建自己自定义解决方案所需的一切。这些组件的一大优点是，除了\
  \ SharePoint Online 和 Designer 之外，它们都可以用于许多其他项目。如果你发现自己喜欢前端开发，你可以将这些工具用于各种项目！\n\n\
  在下一章中，我们将探讨服务器端开发和前端开发之间的区别。我们还将研究 SharePoint 提供的用于支持此类开发的一些组件。你将看到一些代码，并为后续章节做好准备！\n\
  \n## 2. SharePoint 前端解决方案简介\n\nSharePoint 自推出以来已经历了巨大的发展，其开发故事也不例外。如果你曾在 SharePoint\
  \ 2007 或更早版本上做过任何开发，那么可以说你讨厌这种体验。SharePoint 2010 使事情变得容易得多，并引入了一些允许前端开发的新组件，例如 ECMAScript\
  \ 对象模型（后来更名为 JavaScript 对象模型）。随着最新版本的 SharePoint，真正的重点已经转向将代码从 SharePoint 服务器迁移到浏览器或其他服务器。\n\
  \n这一关注点的部分原因是，微软发现许多支持问题源于编写不佳或只是将服务器推向极限的服务器代码。再加上 SharePoint Online 的引入（最终用户无法访问服务器本身），因此需要更强大、更健壮的前端开发解决方案。由此产生的是扩展的\
  \ JavaScript 对象模型、新的 REST API 以及 SharePoint 应用程序。\n\n我们将在本书中更详细地深入探讨 JavaScript\
  \ 对象模型和 REST API。我们还将研究新的前端组件，例如 JSLink 和显示模板。本章将探讨服务器端开发和前端开发之间的区别，以及这种开发风格的一些能力。我们还将探讨你在此过程中可能遇到的一些限制。\n\
  \n> **注意**\n> 本书不涵盖 SharePoint 应用程序。虽然在某些情况下应用程序可以被视为前端开发，但这涉及到开发、网络和域管理，是一个非常庞大的主题。在很多情况下，SharePoint\
  \ 应用程序在服务器端运行，只是不在运行 SharePoint 的服务器上运行。有关构建 SharePoint 应用程序的更多信息，请访问以下 URL：[`http://msdn.microsoft.com/en-us/library/office/jj163230(v=office.15).aspx`](http://msdn.microsoft.com/en-us/library/office/jj163230(v=office.15).aspx)\
  \ 。\n\n\n\n## 服务器端开发 vs. 前端开发\n\nSharePoint 开发及自定义解决方案的构建在很长一段时间内都是硬核开发者的专属领域。这需要掌握广泛的组件知识，包括\
  \ `Visual Studio`、`PowerShell`、`ASP.NET`、`Microsoft Server` 等。即使对于曾从事 `.NET` 开发但刚接触\
  \ SharePoint 的人来说，这也常常令人生畏。图 2-1 展示了一个典型的服务器端开发体验，其中包括 `Visual Studio`、部署包以及一个用于实际将代码部署到服务器的\
  \ `PowerShell` 窗口。\n\n![A978-1-4842-0544-0_2_Fig1_HTML.jpg](img/A978-1-4842-0544-0_2_Fig1_HTML.jpg)\n\
  \n图 2-1. 典型的 SharePoint 服务器端开发体验\n\n服务器端代码是专门为在 SharePoint 服务器本身上运行而编写的。一旦代码编写完成并打包准备部署，它就会被复制到服务器上，并使用\
  \ `PowerShell` 或管理中心进行安装。大多数情况下，这需要开发人员、业务用户和服务器管理员共同协作。由于代码直接在服务器上运行，因此它拥有巨大的能力，但也可能很容易对\
  \ SharePoint 环境产生不利影响。\n\n就连为 SharePoint 编写服务器端代码都可能很困难，因为它需要一台安装了 SharePoint 的强大电脑。过去，大多数开发人员会在自己的电脑上构建虚拟机，从而在隔离环境中为\
  \ SharePoint 编写代码。由于需要学习新的代码框架、电脑上需要安装 SharePoint，以及为确保不佳的代码不会损害服务器而所需的编码最佳实践，学习服务器端开发有时颇具挑战。\n\
  \n随着 SharePoint Online 和 Office 365 的出现，服务器端开发受到了冲击，因为在这些产品中，你无法访问运行 SharePoint\
  \ 的服务器。从使用同一服务器的所有其他客户的角度来看，这是好事。如果一个客户安装了编写不佳或恶意的代码，他们可能会让整个服务器瘫痪，影响到所有人。然而，如果你是需要自定义解决方案的客户，你将不再拥有强大的服务器端代码这一选项。\n\
  \n**注意**\n\n沙盒解决方案提供了另一种在 SharePoint 中编写和部署服务器端代码的方式。这些解决方案不需要服务器访问权限，因为网站集管理员可以通过浏览器安装它们。它们被称为“沙盒”解决方案，是因为它们在服务器上隔离运行，并受到\
  \ SharePoint 的监控，以确保它们不影响性能。在 SharePoint 2013 中，沙盒解决方案仍可本地安装，但在 SharePoint Online\
  \ 中已被弃用，且只能包含 HTML 和 JavaScript。有关沙盒解决方案的更多信息，请访问以下 URL：[`http://technet.microsoft.com/en-us/library/ee721992(v=office.14).aspx`](http://technet.microsoft.com/en-us/library/ee721992(v=office.14).aspx)。\n\
  \n乍看之下，微软似乎削弱了为企业创建自定义 SharePoint 解决方案的能力，特别是如果你使用的是 Office 365。使用本地 SharePoint\
  \ 的客户也从微软收到了相同的信息，即停止将自定义代码放在服务器上。幸运的是，微软并没有让任何人因这种转变而“陷入困境”。最新版本的 SharePoint 配备了广泛的前端组件来开发解决方案。\n\
  \n前端开发，或称客户端代码，是专门为在 Web 浏览器中运行而编写的。它使用 HTML、JavaScript 和 CSS，并在所有浏览器中运行。你仍然需要将代码添加到\
  \ SharePoint 中，但由于它只是 HTML 和 JavaScript，你可以利用像文档库这样的开箱即用组件来上传和存储你的解决方案。在下一节中，我们将探讨使用\
  \ SharePoint 进行前端开发的各种组件，并了解它们能为你提供什么。\n\n## SharePoint 前端开发的组件\n\n现在我们已经了解了服务器端开发和前端开发之间的一些差异，接下来看看本书将涉及的前端开发的一些组件。在本书中，我们将展示几种创建自定义解决方案的不同方法，并在本节中向你介绍它们。这些介绍将是相当快速、高层次的概述，因为我们将在后续章节中深入探讨每一个主题。我们将探讨：\n\
  \n- JavaScript 对象模型 (JSOM)\n- REST API\n- JS 链接\n- 显示模板\n\n以上每一项都与其他组件协同工作，共同构成一个完整的前端解决方案。如果需要，你甚至可以同时使用其中的几个。现在，我们先快速了解一下每个项目，为你做好准备，以便在接下来的章节中开始构建一些解决方案。\n\
  \n\n\n### JavaScript 对象模型 (JSOM)\n\n`JavaScript 对象模型`（简称 `JSOM`）是 SharePoint 客户端\
  \ API 家族的一部分。它传统上被称为客户端对象模型，简称 `CSOM`。这很容易让人混淆，因为人们在广泛讨论时往往会使用术语“客户端对象模型”。`CSOM`\
  \ 涵盖了从 `JSOM`、Silverlight 库、到一组服务器端库，甚至 REST API 的所有内容。关键在于，如果有人谈论 `CSOM`，你可能需要他们更具体地说明他们正在做什么。\n\
  \n`JavaScript 对象模型`基本上是作为 SharePoint 一部分提供的一组 JavaScript 文件。每个文件都包含允许你执行各种任务的代码——从与术语库交互、访问用户个人资料信息，到读取列表和网站等常见核心任务。如果你有权访问服务器，可以在\
  \ `C:\\Program Files\\Common Files\\Microsoft Shared\\Web Server Extensions\\15\\\
  TEMPLATE\\LAYOUTS` 查看所有这些文件。图 2-2 在 Windows 资源管理器中显示了此文件夹。如果你使用的是 SharePoint Online，不必担心，所有这些文件仍然可用——只是无法在\
  \ Windows 资源管理器中查看它们！\n\n![A978-1-4842-0544-0_2_Fig2_HTML.jpg](img/A978-1-4842-0544-0_2_Fig2_HTML.jpg)\n\
  \n图 2-2.\n\n在文件系统中构成 JavaScript 对象模型的文件\n\n所有文件都位于 SharePoint 的 `Layouts` 文件夹中。`Layouts`\
  \ 文件夹是 SharePoint 中的一个主力文件夹，包含了许多在整个环境中使用的公共文件和代码。当部署使用自定义页面、图像等的自定义服务器端代码时，它们通常都会部署到\
  \ `Layouts` 文件夹。如果你不熟悉它，不用担心——你很快就会熟悉了。\n\n图 2-2 只展示了部分可用文件，但应该有助于说明 `JSOM` 在构建自定义解决方案方面的强大功能。微软投入了大量时间和精力来扩展\
  \ `JSOM` 的能力。由于他们告诉客户不再使用服务器端代码，并且在许多方面转向 SharePoint Online，他们确保提供一套全面的工具来支持丰富的开发体验。\n\
  \n**注意**\n\n有关 `JSOM` 的更多信息，请访问以下 URL 中 SharePoint 的 JavaScript API 参考：[`http://msdn.microsoft.com/en-us/library/office/jj193034(v=office.15).aspx`](http://msdn.microsoft.com/en-us/library/office/jj193034(v=office.15).aspx)。\n\
  \n在你的解决方案中使用 `JSOM` 相当直接，因为它们都是 JavaScript。首先，你需要放置对特定文件的引用，如下所示：\n\n```\n<script\
  \ type=\"text/javascript\" src=\"/_layouts/15/sp.js\"></script>\n```\n\n这是一个标准的\
  \ HTML `SCRIPT` 标签，它告诉浏览器加载位于 `SRC` 属性中指定位置的特定文件。在这种情况下，浏览器将加载位于 `Layouts` 文件夹中的\
  \ `sp.js` 文件。一旦我们有了所需的 SharePoint `JSOM` 文件的引用，我们就可以编写一个看起来像这样的脚本：\n\n```\n$(function\
  \ () {\n  retrieveListItems();\n});\n\nfunction retrieveListItems() {\n  var clientContext\
  \ = new SP.ClientContext();\n  var oList = clientContext.get_web().get_lists().getByTitle('Demo\
  \ List');\n  var camlQuery = new SP.CamlQuery();\n  this.collListItem = oList.getItems(camlQuery);\n\
  \  clientContext.load(collListItem);\n  clientContext.executeQueryAsync(\n    Function.createDelegate(this,\
  \ this.onQuerySucceeded),\n    Function.createDelegate(this, this.onQueryFailed)\n\
  \  );\n}\n```\n\n如果这是你第一次看到 `JSOM` 代码，不要不知所措！它可能看起来很吓人，但随着你学习本书，阅读和编写它会变得越来越容易。让我们分解这个示例，看看每一部分。\n\
  \n*   `$(function () {});` – 这是代码的入口点，完全是 jQuery。这被称为 `document.ready` 函数，之所以这么称呼是因为它在浏览器完全加载\
  \ HTML 页面时触发。在 jQuery 开发中你会经常看到它，因为这是一种在页面加载时触发代码的简单便捷方式。在这个示例中，我们只是调用了另一个包含 `JSOM`\
  \ 代码的函数。\n*   `SP.ClientContext()` – 这一行获取对客户端上下文的引用，并在每次对 SharePoint 服务器的 `JSOM`\
  \ 调用中使用。客户端上下文包含有关当前 Web 应用程序、网站、网站集等的许多信息。\n*   `clientContext.get_web().get_lists().getByTitle('Demo\
  \ List')` – 使用客户端上下文，我们可以获取对网站中任何内容的引用。在这一行中，我们引用当前网站，从所有列表中请求一个标题为“Demo List”的特定列表。这一行的语法非常易读：获取\
  \ Web，获取列表，按标题获取。在使用 REST API 时，你也会看到类似的模式。\n*   `SP.CamlQuery()` – 这一行允许你通过使用 CAML\
  \ 查询（一种用于查询 SharePoint 的语法）来指定要返回哪些项目。它已经存在了一段时间，并且在处理列表和库时经常使用。在这个示例中，我们只是传递一个空查询，告诉\
  \ SharePoint 我们希望列表中的所有项目。我们通过调用 `oList.getItems(camlQuery)` 并传入查询来实现。\n*   `clientContext.executeQueryAsync()`\
  \ – 这一行实际上会启动对 SharePoint 服务器的查询。然后你可以处理返回的数据并将其显示给用户。\n\n这已经是对 `JSOM` 尽可能高级别的解释了！主要目的是展示一些\
  \ `JSOM` 并简要解释各部分。`JSOM` 还有更多内容，但在我们深入任何演示之前，你至少已经接触过一些代码了。\n\n\n\n### REST API\n\
  \nREST API 随 SharePoint 2013 和 SharePoint Online 一同引入。它允许你通过精心构造的 URL 对 SharePoint\
  \ 进行 RESTful 调用。数据可以以 XML 或 JSON 格式返回，并且可以轻松地被浏览器中的 JavaScript 使用。在早期版本的 SharePoint\
  \ 中也提供了 RESTful 数据，但主要局限于列表交互。新的 REST API 已大大扩展，与 JSOM 类似，包含了广泛的功能。\n\n**注意**  \n\
  有关 REST API 的更多信息，请访问以下 URL 中的 SharePoint REST API 参考和示例：[`http://msdn.microsoft.com/en-us/library/office/jj860569(v=office.15).aspx`](http://msdn.microsoft.com/en-us/library/office/jj860569(v=office.15).aspx)。\n\
  \n一个典型的 REST API 调用如下所示：\n\n`http://SERVER/_api/web/lists/GetByTitle('Demo List')/items`\n\
  \n就像上一节中的 JSOM 示例一样，此 URL 将查询名为 `Demo List` 的列表，并请求所有项目。其语法也应该看起来很熟悉：`Web`、`Lists`、`GetByTitle`、`Items`。在这两个示例中，调用的结构都非常易读，并为你提供了了解预期数据所需的所有上下文。图\
  \ 2-3 展示了浏览器中 REST 调用的结果。\n\n![A978-1-4842-0544-0_2_Fig3_HTML.jpg](img/A978-1-4842-0544-0_2_Fig3_HTML.jpg)\n\
  \n**图 2-3.** 浏览器中返回为 XML 的 REST API 调用\n\n在此示例中，结果以 XML 格式返回，因为这是浏览器默认请求的格式。通过 JavaScript\
  \ 调用时，我们可以请求 XML 或 JSON。我们稍后将更详细地探讨这一点。与 JSOM 类似，我们可以提供 CAML 查询来限制结果，也可以使用查询字符串运算符来选择、筛选和排序我们从\
  \ API 请求的数据。\n\n如果我们想将数据限制为单行，REST API 调用如下所示：\n\n`http://SERVER/_api/web/lists/GetByTitle('Demo\
  \ List')/items?$top=1`\n\n查询字符串运算符 `$top=1` 告诉 API 只返回第一行数据。图 2-4 展示了浏览器中此调用的结果。\n\
  \n![A978-1-4842-0544-0_2_Fig4_HTML.jpg](img/A978-1-4842-0544-0_2_Fig4_HTML.jpg)\n\
  \n**图 2-4.** 使用查询字符串运算符限制结果的 REST API 调用\n\n有许多运算符可用于构造你的 REST API 调用。我们将在后面的章节中探讨更多运算符，但请放心，你将拥有获得正确结果所需的所有工具。此示例应能说明使用\
  \ REST API 从 SharePoint 请求数据是多么容易。\n\n### JSLink\n\nJSLink 是 SharePoint 2013 中的新功能，它提供了一种非常强大且简单的方法来设置列表视图\
  \ Web 部件的样式。在 JSLink 之前，你必须使用 XSLT（可扩展样式表语言转换）。XSLT 是一种设置 HTML 样式或进行转换并赋予其活力的方法。它在允许开发人员更改\
  \ Web 部件的呈现方式方面做得很好，但使用起来相当麻烦。大多数开发人员一想到必须使用 XSLT 就皱眉头，并通常会避开它。\n\n于是 JSLink 应运而生，它允许你使用\
  \ JavaScript 和 HTML 来设置部件样式。它提供了一种更简单、更快速的方法来呈现 Web 部件，以满足业务需求并提供增强的功能。JSLink 不仅提供了一种简单的方法来设置\
  \ Web 部件的样式，而且由于它基于 HTML 和 JavaScript，你还可以用它做更多事情。现在，让我们先看看 JSLink 是如何工作的。图 2-5\
  \ 展示了一个标准的 SharePoint 主页，其中插入了一个列表 Web 部件，并显示了来自 Demo List 的项目。\n\n![A978-1-4842-0544-0_2_Fig5_HTML.jpg](img/A978-1-4842-0544-0_2_Fig5_HTML.jpg)\n\
  \n**图 2-5.** 插入了列表 Web 部件的 SharePoint 页面，列出了 Demo List 中的项目\n\n这是 SharePoint 自带的列表\
  \ Web 部件，但它现在有一个新属性。如果将 Web 部件置于编辑模式并展开 Web 部件工具窗格中的“杂项”面板，你将看到一个名为“JS 链接”的新属性。这是一个文本框，你可以在其中放置一个\
  \ JavaScript 文件的路径，该文件将在 Web 部件呈现期间使用。图 2-6 展示了这个新属性。\n\n![A978-1-4842-0544-0_2_Fig6_HTML.jpg](img/A978-1-4842-0544-0_2_Fig6_HTML.jpg)\n\
  \n**图 2-6.** Web 部件属性窗格中的 JSLink 属性\n\n现在你已经知道如何通过 JSLink 属性应用 JavaScript 文件，让我们看看这个\
  \ JavaScript 实际上是什么样子的。以下代码是对 JS Link 代码工作原理的简单演示。\n\n```\n(function () {\n    var\
  \ overrideContext = {};\n    overrideContext.Templates = {};\n    overrideContext.Templates.Item\
  \ = overrideTemplate;\n    SPClientTemplates.TemplateManager.RegisterTemplateOverrides(overrideContext);\n\
  })();\n\nfunction overrideTemplate(ctx) {\n    return \"<div style='font-size:32px;border:solid\
  \ 1px Silver;'>\" + ctx.CurrentItem.Title + \"</div>\";\n}\n```\n\n让我们分解这个示例并查看每个部分。\n\
  \n- `overrideContext`、`overrideContext.Templates` 和 `overrideContext.Templates.Item`\
  \ —— 顾名思义，这些是覆盖 Web 部件默认呈现的对象。父对象 `overrideContext` 可以任意命名。前两行只是创建了该对象和一个名为 `Templates`\
  \ 的属性。这是所有 JSLink 文件中的标准部分，因为它构成了代码的基础。第三行定义了另一个 JavaScript 函数，该函数将对 Web 部件中的每个单独项目触发；这由其名称中的“`Item`”指定。你可以针对项目，或仅针对项目中的特定属性。例如，如果我们只想设置\
  \ `Title` 的样式，我们可以仅引用该属性。\n- `SPClientTemplates.TemplateManager.RegisterTemplateOverrides(overrideContext)`\
  \ —— 一旦你构建好对象，就必须告诉 SharePoint 你想要使用它。这行代码通过向 `TemplateManager` 对象注册来实现这一点。完成后，当\
  \ Web 部件呈现时，你引用的 JavaScript 函数将被调用。\n- `function overrideTemplate(ctx)` —— 这是在 Web\
  \ 部件呈现时实际运行的代码。它非常简单：只需呈现一个带有一些样式和当前项目标题的 HTML `DIV` 元素即可。\n\n将此代码放入文件后，我们将其上传到\
  \ SharePoint 的库中。然后，我们将该文件的路径放入 Web 部件的 JSLink 属性中。图 2-7 展示了使用 JSLink 文件呈现 Web 部件后的输出。\n\
  \n![A978-1-4842-0544-0_2_Fig7_HTML.jpg](img/A978-1-4842-0544-0_2_Fig7_HTML.jpg)\n\
  \n**图 2-7.** 应用 JS Link 代码后的列表 Web 部件\n\n我们将在后续章节中更详细地介绍使用 JSLink 的细节，并将展示更多设置内容样式和构建自定义解决方案的方法。当你在页面上使用列表\
  \ Web 部件时，你会发现 JSLink 是一个极其有用的工具，可以帮助你实现业务需求。\n\n\n\n## 显示模板\n\n与 JSLink 类似，显示模板是\
  \ SharePoint 2013 和 SharePoint Online 中的新增功能。它们与搜索 Web 部件（例如 SharePoint 附带的**内容搜索\
  \ Web 部件**）配合使用。显示模板使用 HTML 和 JavaScript 来呈现内容，并允许您指定要显示的属性、放置位置以及如何设置样式。通过使用这些模板，您可以对搜索结果及其显示方式进行高度控制。图\
  \ 2-8 显示了一个放置在页面上的标准内容搜索 Web 部件。\n\n![A978-1-4842-0544-0_2_Fig8_HTML.jpg](img/A978-1-4842-0544-0_2_Fig8_HTML.jpg)\n\
  \n图 2-8. 放置在页面上的现成内容搜索 Web 部件\n\n我们可以通过将 Web 部件置于编辑模式，并在 Web 部件工具窗格中查看属性面板来更改所使用的显示模板。在搜索条件正下方，您将找到**显示模板**区域。此部分有两个下拉菜单，用于选择内容的呈现方式：**控件**和**项目**。图\
  \ 2-9 显示了显示模板区域和下拉菜单。\n\n![A978-1-4842-0544-0_2_Fig9_HTML.jpg](img/A978-1-4842-0544-0_2_Fig9_HTML.jpg)\n\
  \n图 2-9. 内容搜索 Web 部件工具窗格中的控件和项目选项\n\n这些项中的每一个都是一个模板，它们协同工作以呈现内容。**控件模板**为内容提供整体\
  \ HTML 布局。您可以将其视为容纳所有搜索结果项的容器。这也是加载您希望在搜索结果中使用的任何 JavaScript 或 CSS 的好地方。**项目模板**为每个搜索结果项提供单独的\
  \ HTML。此模板还利用搜索结果中的托管属性，并允许您控制显示哪些属性。当一起使用时，这些模板提供了一种呈现内容的完整方式。\n\n您可以通过导航到**网站设置**，然后在**Web\
  \ 设计器库**标题下选择**母版页**来查看现成的显示模板。这将打开母版页库页面，如图 2-10 所示。\n\n![A978-1-4842-0544-0_2_Fig10_HTML.jpg](img/A978-1-4842-0544-0_2_Fig10_HTML.jpg)\n\
  \n图 2-10. 您可以在此处找到现成显示模板的母版页库\n\n注意：为了使用显示模板和内容搜索 Web 部件，您需要确保已激活 SharePoint Server\
  \ 发布网站功能。如果您的网站使用发布模板，则此功能应已激活。此外，此 Web 部件仅适用于 Office 365 E3 和 E4 计划，或企业内部部署的 SharePoint\
  \ 企业版。\n\n单击**显示模板**文件夹将显示另一个页面，其中所有当前显示模板按文件夹组织。内容搜索 Web 部件的显示模板全部位于**内容 Web 部件**文件夹中，如图\
  \ 2-11 所示。\n\n![A978-1-4842-0544-0_2_Fig11_HTML.jpg](img/A978-1-4842-0544-0_2_Fig11_HTML.jpg)\n\
  \n图 2-11. 显示模板和内容 Web 部件文件夹\n\n打开内容 Web 部件文件夹时，您将找到许多显示模板。每个模板都有一个 HTML 文件和一个对应的\
  \ JavaScript 文件，如图 2-12 所示。\n\n![A978-1-4842-0544-0_2_Fig12_HTML.jpg](img/A978-1-4842-0544-0_2_Fig12_HTML.jpg)\n\
  \n图 2-12. 带有 HTML 文件和对应 JavaScript 文件的显示模板\n\n当您构建一个新的显示模板时，您只需处理 HTML 文件。上传 HTML\
  \ 文件后，SharePoint 会为您生成 JavaScript 文件，并在呈现内容时使用该文件。通过此模型，您无需担心所需的脚本编写；您只需关注 HTML——其余部分由\
  \ SharePoint 完成。显示模板使用搜索结果中的托管属性来呈现内容。该模板使用标记系统来呈现内容，如下面的代码示例所示：\n\n```html\n<a\
  \ class=\"cbs-pictureImgLink\" href=\"_#= linkURL =#_\" title=\"_#= $htmlEncode(line1.defaultValueRenderer(line1))\
  \ =#_\" id=\"_#= pictureLinkId =#_\">\n```\n\n标记看起来像`_#= variableName =#_`。您可以创建自己的变量来存储内容，以便稍后在模板中使用。我们将在后面的章节中更详细地讨论这些内容。\n\
  \n## 总结\n\n在本章中，我们探讨了服务器端开发和前端开发之间的差异，并介绍了一些可用于自定义解决方案的组件。对于最新版本的 SharePoint，微软确实强调了不在开发工作中使用服务器端代码的优势。对于\
  \ SharePoint Online，您甚至根本无法使用它！正如您在本章中所读到的，他们提供了许多构建不依赖服务器端代码的自定义解决方案的选项。所有这些解决方案都利用\
  \ HTML 和 JavaScript，使任何熟悉构建网页的人都可以轻松访问这些解决方案。\n\n在下一章中，我们将继续扩展到目前为止所学的内容。我们将介绍内容编辑器\
  \ Web 部件，以及如何将 HTML 内容直接放置在页面上。此外，我们将探索新的脚本编辑器 Web 部件，该部件可以与内容编辑器结合使用。我们将使用您在本章中看到的一些代码，并实际查看其运行情况。\n\
  \n"
- "# 内容编辑器和脚本编辑器 Web 部件\n\n至此，您应该已安装所需的所有工具，并拥有一个用于开发的 SharePoint 环境。您也已经了解了服务器端开发和前端开发之间的差异。我们还研究了组成前端开发的一些部件。现在是时候开始实际运用我们学到的一些知识，并构建一些东西了！\n\
  \n在本章中，我们将介绍如何使用内容编辑器和脚本编辑器 Web 部件。如果您使用 SharePoint 已有一段时间，那么您应该已经了解内容编辑器 Web 部件，并且知道它如何让您轻松地将\
  \ HTML 添加到任何页面。最新版本的 SharePoint 带来了脚本编辑器 Web 部件，它允许您轻松地将 JavaScript 添加到任何页面。我们将探讨这些\
  \ Web 部件如何工作以及如何相互交互。到本章结束时，您将了解使用这些 Web 部件的优缺点，并会使用 HTML 和 JavaScript 构建一些自定义解决方案。\n\
  \n\n\n## 内容编辑器 Web 部件\n\n内容编辑器 Web 部件（CEWP）是 SharePoint 环境中的主力，它已经存在了很长时间，大多数用户都很熟悉它。顾名思义，CEWP\
  \ 用于在 SharePoint 页面上放置内容。你可以轻松地使用此 Web 部件在页面上放置 HTML，以便向用户发布内容、链接列表等等。\n\n使用 CEWP，你可以通过功能区使用与\
  \ Microsoft Word 类似的预定义样式和编辑工具来添加丰富内容。你可以直接在编辑器中编写 HTML，或者将其指向包含标记的 HTML 文件。通过功能区插入\
  \ Web 部件时，可以在“媒体和内容”类别下找到 CEWP，如图 3-1 所示。\n\n![A978-1-4842-0544-0_3_Fig1_HTML.jpg](img/A978-1-4842-0544-0_3_Fig1_HTML.jpg)\n\
  \n图 3-1. 可以找到内容编辑器 Web 部件的“媒体和内容”类别\n\n在你的页面中插入一个 CEWP，并将其置于编辑模式。你将看到有三种方式可以添加和编辑内容，描述如下，如图\
  \ 3-2 所示。\n\n![A978-1-4842-0544-0_3_Fig2_HTML.jpg](img/A978-1-4842-0544-0_3_Fig2_HTML.jpg)\n\
  \n图 3-2. 在内容编辑器 Web 部件中添加内容的各种方式\n\n*   **丰富内容** – 当你首次将 CEWP 添加到页面时，显然那里没有任何内容。在这种情况下，你将看到一个标题为“单击此处添加新内容”的链接。单击此链接会将光标直接置于\
  \ Web 部件中，你可以使用功能区添加丰富内容——就像在 Microsoft Word 中一样。这是一种向页面添加内容的简单便捷方式，但不是构建使用 SharePoint\
  \ 数据的自定义解决方案的好方法。\n*   **HTML 标记** – 另一种插入内容的方法是单击“单击此处添加新内容”链接，然后单击功能区中的**编辑源**按钮。这将打开一个对话框，你可以在其中直接向\
  \ CEWP 键入 HTML 内容。这对于快速插入 HTML 或测试你的 HTML 标记来说是一个很好的选择。对于构建自定义解决方案来说，这是一个更好的选择，但还不是最佳选择。\n\
  *   **链接到 HTML 文件** – 你也可以直接链接到一个 HTML 文件，以便在 Web 部件中显示内容。在 CEWP 工具窗格中，第一个属性标题为**内容链接**。在此文本框中，只需添加\
  \ HTML 文件的 URL，其内容将在 Web 部件呈现时显示。这是构建自定义解决方案时的首选用法，我们将在下一章中讨论这一点。\n\n现在，让我们使用功能区中的**编辑源**按钮放置一些\
  \ HTML。将 CEWP 置于编辑模式，单击“单击此处添加新内容”链接，然后单击功能区中的**编辑源**按钮。图 3-3 显示了单击此按钮后显示的对话框。\n\
  \n![A978-1-4842-0544-0_3_Fig3_HTML.jpg](img/A978-1-4842-0544-0_3_Fig3_HTML.jpg)\n\
  \n图 3-3. 单击功能区中的**编辑源**按钮后出现的对话框\n\n在此对话框中，我们可以直接键入 HTML 内容。在此示例中，我们将只添加一个包含 ID\
  \ 和一些文本的 `<div>` 元素。只需以下 HTML：\n\n```\n<div id=\"divHelloWorld\">Hello World!</div>\n\
  ```\n\n添加此内容并保存页面后，页面上将显示一条漂亮的“Hello World!”消息，如图 3-4 所示。\n\n![A978-1-4842-0544-0_3_Fig4_HTML.jpg](img/A978-1-4842-0544-0_3_Fig4_HTML.jpg)\n\
  \n图 3-4. 在内容编辑器 Web 部件中显示的 HTML 内容\n\n这是一个非常简单且并不令人兴奋的向页面添加 HTML 内容的示例。但是，如果您是添加自定义\
  \ HTML 的新手，那么这对于本章后续部分以及后续章节的内容来说是一个很好的起点。现在页面已经有了 HTML，让我们看一下脚本编辑器 Web 部件，并了解如何将自定义\
  \ JavaScript 与我们的 HTML 一起注入页面中。\n\n## 脚本编辑器 Web 部件\n\n脚本编辑器 Web 部件（SEWP）是 SharePoint\
  \ 2013 的新功能；它的设计初衷如其名称所示——向 SharePoint 页面添加脚本。在此 Web 部件出现之前，如果您想在页面上注入脚本，您会使用 CEWP。如果您链接到包含脚本的文件，这效果很好，但如果您想编辑源并手动放置脚本，通常会遇到问题。有时，脚本无法运行，或抛出错误，更糟糕的是，CEWP\
  \ 实际上会更改您输入的代码。这是一种不愉快的体验。\n\n有了 SEWP，这些问题不再是您需要担心的事情。您现在可以轻松地使用 SEWP 在页面上放置 JavaScript，因为它就是为了这个目的而构建的。您还可以使用此\
  \ Web 部件放置其他项目，包括 `<object>` 标签、HTML 等。通过功能区插入 Web 部件时，可以在“媒体和内容”类别下找到 SEWP，如图 3-5\
  \ 所示。\n\n![A978-1-4842-0544-0_3_Fig5_HTML.jpg](img/A978-1-4842-0544-0_3_Fig5_HTML.jpg)\n\
  \n图 3-5. 可以找到脚本编辑器 Web 部件的“媒体和内容”类别\n\n在你的页面中插入一个 SEWP，并将其置于编辑模式。你将看到有一种方法可以添加和编辑脚本——通过单击**编辑代码片段**链接，如图\
  \ 3-6 所示。\n\n![A978-1-4842-0544-0_3_Fig6_HTML.jpg](img/A978-1-4842-0544-0_3_Fig6_HTML.jpg)\n\
  \n图 3-6. 单击**编辑代码片段**以添加或编辑你的 JavaScript\n\n单击**编辑代码片段**链接将打开一个标题为**嵌入**的对话框，您可以在其中编写\
  \ JavaScript，如图 3-7 所示。放置到此 Web 部件中的 JavaScript 必须有效，并且包含 `<script></script>` 标签才能正常运行。SEWP\
  \ 甚至可以用来在页面上放置 HTML。如果您要放置 HTML，对话框将在您正在处理的文本框下方显示内容的预览。如果您要编写 JavaScript，则不会显示预览，因为该代码通常在页面上不可见。\n\
  \n![A978-1-4842-0544-0_3_Fig7_HTML.jpg](img/A978-1-4842-0544-0_3_Fig7_HTML.jpg)\n\
  \n图 3-7. 用于在脚本编辑器 Web 部件中编写脚本的**嵌入**对话框\n\n**注意：** 尽管脚本编辑器 Web 部件可用于注入 HTML，但您应该将此\
  \ Web 部件视为仅用于脚本。最好将您的 HTML 和脚本分离到不同的 Web 部件中。话虽如此，如果您只需要快速测试一个脚本，它可能非常有用。\n\n在本示例中，我们将使用\
  \ jQuery 添加一些 JavaScript，在页面加载时显示一个警告框：\n\n```\n<script type=\"text/javascript\"\
  >\n$(function() {\n    alert(\"Hello World!\");\n});\n</script>\n```\n\n如您所见，此代码包含一个开闭\
  \ `<script>` 标签，内部包含一个 jQuery `document.ready` 函数。此脚本所做的只是在 jQuery 检测到页面已加载时，触发一个包含文本“Hello\
  \ World!”的警告框。将此代码放入对话框并单击**插入**。保存页面。刷新页面时，您将看到警告框弹出，如图 3-8 所示。\n\n![A978-1-4842-0544-0_3_Fig8_HTML.jpg](img/A978-1-4842-0544-0_3_Fig8_HTML.jpg)\n\
  \n图 3-8. 通过脚本编辑器 Web 部件显示的 JavaScript 警告框\n\n与使用内容编辑器 Web 部件的示例非常相似，这非常简单，也不令人兴奋。但是，此时您的页面上应该已经有一个\
  \ CEWP 和一个 SEWP 了。接下来，让我们看看如何将它们连接起来以实现一个完整的解决方案。\n\n\n\n## 通过 REST API 整合运用\n\n\
  现在，我们已经在页面上放置了 CEWP 和 SEWP，接下来可以将它们连接起来协同工作。在本例中，我们将使用 REST API 从站点列表中提取数据，通过 SEWP\
  \ 利用 jQuery 发起 AJAX 调用，并在调用完成后更新 CEWP。我们将学习如何在页面上同时使用这两个 Web 部件，以及如何使用 jQuery 发起\
  \ AJAX 调用。首先，我们需要一个列表来从中获取数据。\n\n### 演示列表\n\n在本书中，我们将使用 JSOM 和 REST API 从 SharePoint\
  \ 查询数据。为了方便演示，我们将创建一个新的自定义列表用于实践。操作会尽量简化：只需创建一个新的自定义列表并添加一个额外的列即可，不涉及复杂功能。首先，使用“添加应用程序”功能添加一个自定义列表，并将此新列表命名为\
  \ `Demo List`。\n\n> **注意**  \n> 本部分假定您知道如何在 SharePoint 中创建新列表以及如何创建新列。如果需要创建新列的帮助，请访问以下\
  \ URL：[`http://office.microsoft.com/en-us/sharepoint-server-help/create-change-or-delete-a-column-in-a-list-or-library-HA102771913.aspx`](http://office.microsoft.com/en-us/sharepoint-server-help/create-change-or-delete-a-column-in-a-list-or-library-HA102771913.aspx)。\n\
  \n列表添加完成后，其默认视图中将只有一个列，即 `Title`。这固然可以，但让我们再添加一个列，以便多一些数据可供操作。进入列表设置，使用该页面上的“创建列”链接添加一个新列。选择类型为\
  \ `Multiple Lines of Text`，并将此列命名为 `Description`。在我的列表中，为了简单起见，我将其设置为 `Plain Text`\
  \ 列。图 3-9 显示了添加了一些数据后的 `Demo List`。\n\n![A978-1-4842-0544-0_3_Fig9_HTML.jpg](img/A978-1-4842-0544-0_3_Fig9_HTML.jpg)\n\
  \n**图 3-9.** 可供查询数据的 `Demo List`\n\n现在先插入几行数据。列表中的实际数据目前并不重要，它们只是用来确保我们能够查询并检索列表项。现在列表已就绪，让我们看看通过\
  \ REST API 查询它所需的代码。\n\n### jQuery、AJAX 和 REST API\n\n查询列表将通过 jQuery 向 REST API\
  \ 发起 AJAX 调用来完成。在上一章中，我们快速了解了 REST API URL 的结构。一个典型的查询列表的 URL 结构如下所示：\n\n`http://DOMAIN/SITE/_api/web/lists/GetByTitle('List\
  \ Name')/items`\n\n所有 REST API URL 在数据所在站点之后都以 `_api` 开头，或者在查询 SharePoint 根网站集时紧跟域名之后。`_api`\
  \ 是告知 SharePoint 您正在通过 REST 请求数据的标识。数据可以以 XML 或 JSON 格式请求，但对于大多数 JavaScript 调用，通常会使用\
  \ JSON。使用 REST API 的一个好处是，您可以在任何浏览器中构造 URL，并在代码中使用之前进行测试！\n\n> **注意**  \n> 在我的环境中，我在主网站集下创建了一个名为\
  \ `Apress` 的子网站。这是我在本书中编写和运行所有代码的站点区域。因此，您将看到类似于 `/apress/` 的 URL 结构。如果您在网站集的根站点操作，则您的\
  \ URL 引用应以 `/` 开头。请注意您的 URL，并确保引用正确！稍后，我们将编写一些代码为您自动处理这些，但在此部分，正确的 URL 结构非常重要。\n\
  \n为了通过浏览器发起调用，我们将使用标准的 jQuery AJAX 调用。以下代码演示了此调用：\n\n```html\n<script type=\"text/javascript\"\
  >\n$(function() {\n    $.ajax({\n        url: \"/apress/_api/web/lists/GetByTitle('Demo\
  \ List')\",\n        type: \"GET\",\n        headers: {\n            \"accept\"\
  : \"application/json;odata=verbose\"\n        },\n    }).success(function(data)\
  \ {\n        alert(data.d.Title + \" : \" + data.d.Created);\n    });\n});\n</script>\n\
  ```\n\n在这个示例中，我们将调用包装在熟悉的 `document.ready` 函数中。AJAX 调用使用 `$.ajax()` 函数发起。代码非常直接，只包含几个属性：\n\
  \n- `url` – 这是专门构造的 REST API URL，用于请求所需的特定数据。在此示例中，我们只请求列表属性。\n- `type` – type 表示标准的\
  \ HTTP 方法，即：`GET`、`POST`、`PUT` 和 `DELETE`。在此示例中，我们只是请求数据，因此使用 `GET`。\n- `headers`\
  \ – 如前所述，REST API 可以返回 XML 或 JSON。如果不指定所需的格式，将返回默认格式 XML。通过指定头部 `\"accept\": \"\
  application/json;odata=verbose\"`，我们告知 REST API 我们期望返回 JSON 格式的数据。\n\n在 `$.ajax`\
  \ 调用的末尾，我们附加了一个 `success` 函数，用于处理 REST API 返回的 `data`。jQuery 让处理 AJAX 调用并根据调用结果执行各种函数变得非常简单。例如，您可以附加其他函数，如\
  \ `failure` 和 `finally`。稍后我们将更详细地介绍这些内容。\n\n在我们的 `success` 函数中，我们传入 REST API 返回的\
  \ `data` 对象。现在我们只做一件事：弹出一个提示框，显示列表标题和创建日期。我们通过以下代码行实现：\n\n- `data.d.Title`\n- `data.d.Created`\n\
  \n`data` 对象包含查询返回的所有数据。该对象中有很多我们用不到的内容。`d` 属性保存了我们正在查找的所有列表属性。这可能看起来有些奇怪，但这就是访问通过\
  \ REST API 返回的所有数据的方式。例如，如果您在查询中请求列表项，您将访问 `data.d.results`。将这段代码放入 SEWP 并保存页面后，将弹出如图\
  \ 3-10 所示的提示框。\n\n![A978-1-4842-0544-0_3_Fig10_HTML.jpg](img/A978-1-4842-0544-0_3_Fig10_HTML.jpg)\n\
  \n**图 3-10.** 显示 `Demo List` 标题和创建日期的 JavaScript 提示框\n\n现在我们已经配置好了 AJAX 调用，并且数据正在返回，您应该会看到烦人的提示框弹出。这非常好，因为它让我们知道一切运行正常。然而，在实际应用中，您可能不会仅仅为了弹出提示框而发起\
  \ REST 调用。接下来，让我们借助更多的 jQuery 魔法，将这些数据放入 CEWP 中。\n\n\n\n#### 串联一切\n\n现在，你的页面上应该已经有一个`CEWP`和一个`SEWP`了。`CEWP`显示了一些基本的\
  \ HTML，而`SEWP`则在发起 REST API 调用并弹出一个警告框。接下来，我们要让它们协同工作：由`SEWP`调用 API 获取列表数据，然后用结果更新`CEWP`中的\
  \ HTML。完成这个示例后，你会看到让这两个 Web 部件协同工作来创建解决方案是多么简单。\n\n幸运的是，我们无需对`CEWP`做任何修改！如果你使用了本章本节提供的\
  \ HTML，那就已经准备就绪了。如果没有，它的代码应该是这样的：\n\n`<div id=\"divHelloWorld\">Hello World!</div>`\n\
  \n这行代码以及让 Web 部件协同工作的关键在于`DIV`标签中的`ID`属性：`\"divHelloWorld\"`。通过为`DIV`指定 ID，我们可以非常轻松地使用\
  \ jQuery 在 HTML 中找到该元素并更新其内容。当然，还有其他实现方式；例如，我们可以给`DIV`添加一个 CSS 类，然后通过类名来查找。无论哪种方式，只要能轻松找到元素，就能轻松更新它！\n\
  \n现在，我们来修改`SEWP`的脚本，让它更新`CEWP`。改动虽然很小，但效果会非常显著。请用以下代码更新你的脚本；唯一的变化在`success`函数中，我们将警告框替换为了新的\
  \ jQuery 代码：\n\n```\n<script type=\"text/javascript\">\n\n$(function() {\n\n  $.ajax({\n\
  \n    url: \"/apress/_api/web/lists/GetByTitle('Demo List')\",\n\n    type: \"GET\"\
  ,\n\n    headers: {\n\n        \"accept\": \"application/json;odata=verbose\"\n\n\
      },\n\n  }).success(function(data) {\n\n    $(\"#divHelloWorld\").html(data.d.Title\
  \ + \" : \" + data.d.Created);\n\n  });\n\n});\n\n</script>\n```\n\n这一行新代码的作用是查找\
  \ ID 为`\"divHelloWorld\"`的 HTML 元素。`#`符号用于告知 jQuery 我们正在查找的是 ID，而不是其他属性。在`SEWP`中应用这些更改并点击页面上的“保存”后，`CEWP`的\
  \ HTML 就会被更新，如图 3-11 所示。我们在结果中显示了创建日期；你的日期会与示例中显示的不同。\n\n![A978-1-4842-0544-0_3_Fig11_HTML.jpg](img/A978-1-4842-0544-0_3_Fig11_HTML.jpg)\n\
  \n**图 3-11.** 内容编辑器 Web 部件已被脚本编辑器 Web 部件更新\n\n如果你盯着`CEWP`看，会看到屏幕上的“Hello World”信息在更新为列表信息之前一闪而过。这是因为我们使用了\
  \ jQuery 的`document.ready`函数，该函数要等到页面（文档）加载完成后才会触发。如果你第一次没注意到，只需刷新浏览器就能再次看到。在实际场景中，为了避免这种可见的变更，你的\
  \ HTML 可能一开始就是空的。\n\n### 并非万能解决方案\n\n`CEWP`和`SEWP`是向页面注入自定义 HTML 和脚本的快捷方式。此刻，你可能会想：我还需要什么呢？我现在就可以开始构建自定义解决方案了！诚然，这两个\
  \ Web 部件为你提供了为用户构建解决方案的绝佳机会，它们易于使用，且协作良好。然而，对于更复杂的自定义开发来说，这种解决方案未必是最佳选择。\n\n随着你在开发过程中不断深入——无论是本书中的实践还是你自己的项目——你可能会发现解决方案的需求变得越来越大、越来越复杂。你可能需要多个\
  \ JavaScript 文件、自定义样式表，甚至多个 HTML 文件。这种情况下，使用`CEWP`和`SEWP`会变得非常繁琐且难以管理。此外，你可能需要在多个页面上使用相同的功能。在多个页面上放置多个\
  \ Web 部件并将它们串联起来会带来挑战。同时，这也为其他用户修改你的 HTML 和 JavaScript 提供了可乘之机。请记住，任何拥有编辑 Web 部件权限的人都可以修改这些代码，这可能会造成非常严重的后果。\n\
  \n这种解决方案虽然相当有效，但应谨慎使用。它非常适合那些工作量小的、一次性的简单脚本，或者显示少量数据的简单 HTML。由于它实现速度快，因此非常适合用来测试某些\
  \ HTML 和脚本，确保它们能正确运行。无论你是否决定采用这种方法，都请花点时间思考一下，它是否为满足你和用户的需求而做出的最佳选择。\n\n## 总结\n\n\
  在本章中，我们探讨了内容编辑器 Web 部件及其新版替代品——脚本编辑器 Web 部件。我们了解了如何使用这些 Web 部件在页面上放置自定义 HTML 和 JavaScript，以及这有多么简单。你学会了如何通过\
  \ jQuery 向 REST API 发起 AJAX 调用并检索列表数据。最后，我们研究了如何将这两个 Web 部件整合到一个单一的解决方案中。\n\n在下一章中，我们将继续沿着使用所学知识构建自定义解决方案的道路前进。我们将探讨如何将这种开发模式迁移到更易于维护的结构中，并动手实践一些更高级的脚本。我们还将进一步扩展\
  \ REST API 调用以及 JavaScript 对象模型调用。\n\n"
- "# 4. 使用 HTML 和 JavaScript 构建自定义 Web 部件\n\n内容编辑器 Web 部件与脚本编辑器 Web 部件的结合，使您能够快速在环境中构建解决方案。虽然这种组合确实为您提供了开发解决方案的选择，但它并非一种易于扩展或可重用的方案。您可能会发现它适用于简单的单页面解决方案，但一旦需求变得复杂，您就会发现该方案在许多方面都受到限制。幸运的是，您在前一章中学到的内容可以扩展到更健壮的解决方案中。\n\
  \n在本章中，您将学习如何使用埃瑟森方法构建健壮、可重用的 Web 部件。该方法仍然使用 HTML 和 JavaScript，是对前一章知识点的扩展。您将看到如何更好地组织代码结构，以及该方法如何帮助您应对几乎任何能想到的自定义解决方案。\n\
  \n## 埃瑟森方法\n\n在过去的几年里，我有幸作为一名顾问参与了许多令人兴奋的 SharePoint 项目。此外，我还有幸与一些非常有才华的人共事——他们每天都在激励着我。其中一位是迈克·埃瑟里奇。迈克和我曾参与一个面向公众的\
  \ SharePoint 2010 网站项目，该项目需要适配移动设备，同时还需要连接到未集成到 SharePoint 中的外部数据库。迈克的解决方案是构建可通过\
  \ JavaScript 调用的自定义 WCF Web 服务。这些服务随后与自定义 HTML 和 JavaScript 一起部署到服务器上。HTML 则通过放置在每个页面上的\
  \ XML 查看器 Web 部件来加载。\n\n这个解决方案效果非常好。它易于开发和快速部署。它使我们能够轻松地在服务器上整合数据并将其返回给页面，而且 HTML\
  \ 可以方便地从 SharePoint 服务器提供。这在 SharePoint 2010 中效果很好，在 SharePoint 2013 中也会同样出色，但不适用于\
  \ SharePoint Online，因为其中无法部署任何服务器端代码。幸运的是，由于微软扩展了 JavaScript 对象模型和 REST API，我们可以对解决方案进行调整，使其支持在服务器外部进行完整的开发生命周期——埃瑟森方法就此诞生。\n\
  \n埃瑟森方法由以下组件构成：\n\n- 文档库\n- 文件夹\n- 内容编辑器 Web 部件\n- HTML、JavaScript 和 CSS\n\n如您所见，这个解决方案只需要少量组件就能产生巨大影响。乍一看，您可能会想，用这么简单的一套东西怎么可能构建出健壮的解决方案呢？这种方法真正的力量在于它的简洁性，以及\
  \ JavaScript 对象模型和 REST API 的强大功能。让我们来详细了解每个组件。\n\n\n\n## 文档库\n\n该方法的中心是一个文档库。该库将作为自定义\
  \ Web 部件中所有代码的主要存储库。所有代码都将存储在此库中，每个 Web 部件对应一个文件夹。如果符合需求，你也可以使用多个库。例如，可以在网站集根目录下创建一个库，用于所有子网站。你也可以更精细地操作，在每个子网站中放置一个仅用于该网站的库。在结构组织方面，你可以非常灵活，因为它只是一个存放代码的地方。\n\
  \n设置文档库需要以下步骤：\n\n- 创建新的文档库。\n- 关闭搜索索引。\n- 开启版本控制。\n- 为库设置独立权限。\n\n首先，我们将创建一个开箱即用的文档库，并将其命名为`Webparts`，如图\
  \ 4-1 所示。\n\n![A978-1-4842-0544-0_4_Fig1_HTML.jpg](img/A978-1-4842-0544-0_4_Fig1_HTML.jpg)\n\
  \n**图 4-1.** 为我们代码创建的全新开箱即用文档库\n\n这没什么特别的：我们只需通过“设置”菜单，使用“添加应用程序”选项并选择“文档库”即可。接下来，我们要确保搜索引擎不会索引此库。原因在于该库将用于存储代码。普通用户无需查看这些代码，因为它们用于呈现自定义\
  \ Web 部件；因此，让这些代码出现在搜索结果中会扰乱用户的搜索体验。关闭搜索索引将确保代码文件不会出现在搜索结果中。从功能区访问“库设置”，然后选择“高级设置”，如图\
  \ 4-2 所示。\n\n![A978-1-4842-0544-0_4_Fig2_HTML.jpg](img/A978-1-4842-0544-0_4_Fig2_HTML.jpg)\n\
  \n**图 4-2.** 在“库设置”中访问“高级设置”页面\n\n在“高级设置”页面上，你会看到文档库的许多选项。在页面大约一半的位置找到“搜索”标题。这里只有两个选项：允许项目出现在搜索结果中，或不允许。选择“否”，如图\
  \ 4-3 所示。\n\n![A978-1-4842-0544-0_4_Fig3_HTML.jpg](img/A978-1-4842-0544-0_4_Fig3_HTML.jpg)\n\
  \n**图 4-3.** 关闭文档库的搜索索引\n\n滚动到页面底部并单击“确定”以保存更改。你将返回到“设置”页面，在此处可以继续进行版本控制设置。版本控制非常重要，因为它允许轻松回滚代码。如果你需要对现有代码进行更改，这会让你感到安心。例如，假设你开发了一个满足当前业务需求的解决方案，一切运行正常。然后你被要求进行重大更改并开发新代码以满足需求。你测试了代码，一切看起来很好。你上传了更改——用户立即开始抱怨出了问题！你忘记在不同浏览器中测试，你的代码导致所有使用\
  \ Chrome 的用户都遇到了问题。\n\n如果你开启了版本控制，只需转到文档库并还原以前的代码文件即可。就这样，用户看到的是以前的代码，至少一切又恢复正常了。正如你所见，在开发过程中的某个时刻，能够快速轻松地回滚代码更改的能力将被证明非常有帮助。\n\
  \n要开启版本控制，请单击“版本控制设置”链接，如图 4-4 所示。\n\n![A978-1-4842-0544-0_4_Fig4_HTML.jpg](img/A978-1-4842-0544-0_4_Fig4_HTML.jpg)\n\
  \n**图 4-4.** 访问文档库的“版本控制设置”\n\n进入“版本控制设置”页面后，在“文档版本历史记录”标题下单击“创建主要版本”选项，如图 4-5 所示。你也可以创建主要和次要版本；不过，在本书中我们保持简单，只使用主要版本。\n\
  \n![A978-1-4842-0544-0_4_Fig5_HTML.jpg](img/A978-1-4842-0544-0_4_Fig5_HTML.jpg)\n\
  \n**图 4-5.** 在文档库中开启“创建主要版本”\n\n滚动到页面底部并单击“确定”以保存更改。你将返回到“设置”页面，在此处可以继续进行权限设置。\n\
  \n> **注意：** 根据你创建的网站类型，你可能会发现版本控制已经开启。例如，启用了发布基础结构的发布门户或团队网站已经开启了版本控制。无论是哪种情况，请打开版本控制设置页面以确保它已开启。\n\
  \n最后，您必须通过应用唯一权限来保护文档库。我们希望保护此库，以便控制谁可以添加或修改放入其中的代码。用户需要拥有读取权限，以便代码可以加载到 Web 部件中；但你只希望开发人员拥有参与权限。这至关重要，因为你只希望少数人有权上传代码，甚至可能删除代码。要修改权限，请单击“此文档库的权限”链接，如图\
  \ 4-6 所示。\n\n![A978-1-4842-0544-0_4_Fig6_HTML.jpg](img/A978-1-4842-0544-0_4_Fig6_HTML.jpg)\n\
  \n**图 4-6.** 访问文档库的权限设置\n\n单击此链接将带你进入文档库的权限页面。要应用唯一权限，请单击功能区中的“停止继承权限”按钮，如图 4-7\
  \ 所示。\n\n![A978-1-4842-0544-0_4_Fig7_HTML.jpg](img/A978-1-4842-0544-0_4_Fig7_HTML.jpg)\n\
  \n**图 4-7.** 文档库功能区的“权限”选项卡\n\n通常，SharePoint 中的所有项目都继承其父级的权限。当你创建这个新的文档库时，默认情况下它继承其所在网站的权限。如果你选择停止继承权限，SharePoint\
  \ 会确认这是否是你的意图，并弹出一个确认对话框，如图 4-8 所示。\n\n![A978-1-4842-0544-0_4_Fig8_HTML.jpg](img/A978-1-4842-0544-0_4_Fig8_HTML.jpg)\n\
  \n**图 4-8.** 中断权限时的确认对话框\n\n单击“确定”确认更改，你将返回到权限页面。你会注意到功能区现在有一些额外的选项，最值得注意的是“授予权限”按钮，如图\
  \ 4-9 所示。你将使用“授予权限”选项来重新添加权限。\n\n![A978-1-4842-0544-0_4_Fig9_HTML.jpg](img/A978-1-4842-0544-0_4_Fig9_HTML.jpg)\n\
  \n**图 4-9.** 使用功能区中的“授予权限”按钮授予权限\n\n> **注意：** 一旦你停止继承权限，就应该删除列表中所有当前的用户和组。即使你已经中断了权限继承，之前的用户和组仍然会保留，除非手动删除。\n\
  \n单击“授予权限”按钮会启动“共享”对话框，你可以在其中选择要授予权限的用户，如图 4-10 所示。对话框中的第一个文本框允许你指定要授予其库访问权限的用户或组。在此步骤中，你希望授予每个人读取权限。当你键入文本框时，SharePoint\
  \ 会提供一个人员和组的自动完成列表供你选择。键入`Everyone`，然后从建议列表中选择它。\n\n![A978-1-4842-0544-0_4_Fig10_HTML.jpg](img/A978-1-4842-0544-0_4_Fig10_HTML.jpg)\n\
  \n**图 4-10.** 授予所有用户读取权限\n\n\n\n你可以点击“Show Options”链接展开对话框，查看可用的额外选项。你可能会想要取消勾选“Send\
  \ an Email Invitation”选项，特别是在添加大型用户组时。在这种情况下，该选项会向所有拥有 SharePoint 访问权限的用户发送邮件，这通常不是一个好主意。另一个选项是“Select\
  \ Permission Level”下拉菜单；选择`Read`，因为我们希望每个人都拥有该特定级别的访问权限。\n\n点击“Share”按钮以保存自定义权限。此时，所有用户对该库都拥有`Read`访问权限。对任何开发人员重复这些步骤，并授予他们`Contribute`权限级别。这样，这些用户就可以上传新代码并修改库中的现有代码。\n\
  \n注意\n\n如果你使用的是开发环境或仅由少数人访问的站点，可以跳过应用唯一权限。这在 QA 或生产环境中至关重要，但在开发环境中可以放宽要求。\n\n现在，文档库已创建并配置完成，我们可以继续处理其他组件，例如文件夹。除了为解决方案编写代码之外，使用\
  \ Etherson 方法设置文档库是最大的任务。相比之下，后续组件将显得简单。\n\n### 文件夹\n\n使用此方法，每个自定义 Web 部件都有一个包含该\
  \ Web 部件所需所有文件的文件夹。你也可以创建一个集中文件夹，其中包含所有 Web 部件共享的脚本。例如，如果你希望将 jQuery 副本存储在一个文件夹中，则可以避免通过\
  \ MasterPage 添加它，只需让每个 Web 部件从该集中文件夹进行引用即可。你也可以将一些对多个 Web 部件执行通用功能的实用脚本放在该集中文件夹中。无论有何需求，集中文件夹都可能派上用场。\n\
  \n导航到你上一节创建的`Webparts`文档库。使用菜单中的`New`命令，从上下文菜单中选择`New Folder`，如图 4-11 所示。\n\n![A978-1-4842-0544-0_4_Fig11_HTML.jpg](img/A978-1-4842-0544-0_4_Fig11_HTML.jpg)\n\
  \n图 4-11. 创建新文件夹\n\n创建一个新文件夹，并将其命名为`Simple Example`。我们将使用此文件夹来托管第一个示例的 HTML 和 JavaScript\
  \ 文件。此时，`Webparts`文档库中应只有一个文件夹。随着本书内容的深入，你将会添加更多文件夹；但目前来说，这是一个不错的开始。\n\n### HTML、JavaScript\
  \ 和 CSS\n\n现在我们已经有了一个文档库和一个用于托管代码的文件夹，让我们来组装一个 HTML 文件和一个 JavaScript 文件。在本节中，我们将使用\
  \ Visual Studio 编写代码并构建 HTML 和 JavaScript 文件。如果你在第一章安装了 Visual Studio Express，那就一切就绪了。你可以使用任何你喜欢的代码编辑器——甚至是记事本！启动\
  \ Visual Studio，然后通过点击`File` ➤ `New` ➤ `File`创建一个新文件，如图 4-12 所示。\n\n![A978-1-4842-0544-0_4_Fig12_HTML.jpg](img/A978-1-4842-0544-0_4_Fig12_HTML.jpg)\n\
  \n图 4-12. 在 Visual Studio 中创建新文件\n\n这将打开一个新的对话框，你可以在其中选择要创建的文件类型。这里有很多选项，但我们需要的那个就在最前面。从列表中选择`HTML\
  \ Page`，然后点击`Open`，如图 4-13 所示。\n\n![A978-1-4842-0544-0_4_Fig13_HTML.jpg](img/A978-1-4842-0544-0_4_Fig13_HTML.jpg)\n\
  \n图 4-13. 从“新建文件”对话框创建新的 HTML 页面\n\n点击`Open`后，你会看到一个新的 HTML 文件被创建并显示出来。如果你是 Visual\
  \ Studio 的新手，你将初步体验到代码编辑器带来的高效。新创建的 HTML 文件中已经为你生成了一些代码，如图 4-14 所示。\n\n![A978-1-4842-0544-0_4_Fig14_HTML.jpg](img/A978-1-4842-0544-0_4_Fig14_HTML.jpg)\n\
  \n图 4-14. 带有代码的新创建 HTML 文件\n\n如果你将此文件保存并加载到 SharePoint 中，它将不会显示任何内容，因为没有可供浏览器渲染给用户的内容。然而，这绝对是一个有效的\
  \ HTML 文件！虽然这并不令人印象深刻，但你会发现，在你编写代码时，Visual Studio 在很多类似的事情上都能提供帮助。\n\n对于这个示例，我们将从第\
  \ 3 章的代码开始，不过我们会将代码拆分为一个 HTML 文件和一个 JavaScript 文件。首先，在你的新 HTML 页面中添加以下代码行：\n\n```\n\
  <div id=\"divHelloWorld\">Hello World!</div>\n```\n\n将这行代码放在两个`<body>`标签之间，如图 4-15\
  \ 所示。\n\n![A978-1-4842-0544-0_4_Fig15_HTML.jpg](img/A978-1-4842-0544-0_4_Fig15_HTML.jpg)\n\
  \n图 4-15. 包含上一章代码的新 HTML 文件\n\n现在让我们创建一个 JavaScript 文件来托管我们的脚本。与之前一样，从菜单中选择`File`\
  \ ➤ `New` ➤ `File`。当“新建文件”对话框打开时，你会注意到列表中没有创建 JavaScript 文件的选项。为此，我们需要从左侧导航中选择`Web`，以查看所有适用于网站的文件模板。滚动到模板列表的底部，你会找到`JavaScript\
  \ File`模板，如图 4-16 所示。\n\n![A978-1-4842-0544-0_4_Fig16_HTML.jpg](img/A978-1-4842-0544-0_4_Fig16_HTML.jpg)\n\
  \n图 4-16. “新建文件”对话框中的 JavaScript 文件选项\n\n创建新的 JavaScript 文件后，你会注意到它与你之前创建的 HTML\
  \ 文件看起来截然不同。事实上，它完全是空白的，如图 4-17 所示。\n\n![A978-1-4842-0544-0_4_Fig17_HTML.jpg](img/A978-1-4842-0544-0_4_Fig17_HTML.jpg)\n\
  \n图 4-17. 在 Visual Studio 中创建的新 JavaScript 文件\n\n与 HTML 文件类似，你将使用第 3 章示例中的相同代码。将以下代码放入你刚刚创建的新\
  \ JavaScript 文件中：\n\n```\n$(function() {\n\n$.ajax({\n\nurl: \"/apress/_api/web/lists/GetByTitle('Demo\
  \ List')\",\n\ntype: \"GET\",\n\nheaders: {\n\n\"accept\": \"application/json;odata=verbose\"\
  \n\n},\n\n}).success(function(data) {\n\n$(\"#divHelloWorld\").html(data.d.Title\
  \ + \" : \" + data.d.Created);\n\n});\n\n});\n```\n\n\n\n本书的所有代码示例中，URL 均指向我的环境，该环境包含一个根网站集和一个名为\
  \ Apress 的子网站，我的所有代码都存放在此。因此，我的所有 URL 将显示为`\"/apress/.....\"`。您应根据代码部署位置以及网站结构，相应地更新自己的\
  \ URL。\n\n您会注意到，与第 3 章的示例不同，这里没有使用`<script></script>`标签对来包裹代码。由于代码是从扩展名为`.js`的 JavaScript\
  \ 文件中提供的，浏览器无需通过这类标签来识别脚本，如图 4-18 所示。\n\n![A978-1-4842-0544-0_4_Fig18_HTML.jpg](img/A978-1-4842-0544-0_4_Fig18_HTML.jpg)\n\
  \n图 4-18.\n\nVisual Studio 中的 JavaScript 代码\n\n现在两个文件都已创建，接下来需要保存它们。您可以将这些文件保存在电脑上的任意位置。将\
  \ HTML 文件命名为`SimpleExample.html`，JavaScript 文件命名为`SimpleExample.js`。保存文件后，我们需要将\
  \ JavaScript 文件连接到 HTML 文件，以确保代码能够正确触发。为此，我们需要在 HTML 文件中添加一个 JavaScript 引用，类似于以下代码行：\n\
  \n```\n<script type=\"text/javascript\" src=\"/apress/webparts/Simple Example/SimpleExample.js\"\
  ></script>\n```\n\n在我的环境中，有一个名为 Apress 的子网站，我的 Web 部件文档库就位于此。此脚本引用以`/`开头，表示使用网站的根\
  \ URL。接着，我们依次放置子网站名称、文档库名称、文件夹名称，最后是脚本文件名。根据您配置环境的方式，您可能不需要子网站引用，或者它的名称可能有所不同。\n\
  \n将脚本引用放置在 HTML 文件的`<head>`中，如图 4-19 所示。\n\n![A978-1-4842-0544-0_4_Fig19_HTML.jpg](img/A978-1-4842-0544-0_4_Fig19_HTML.jpg)\n\
  \n图 4-19.\n\n添加了脚本引用的 HTML 文件\n\n保存包含新脚本引用的`SimpleExample.html`文件。接下来，您需要将两个文件上传到您在文档库中创建的\
  \ Simple Example 文件夹中，如图 4-20 所示。\n\n![A978-1-4842-0544-0_4_Fig20_HTML.jpg](img/A978-1-4842-0544-0_4_Fig20_HTML.jpg)\n\
  \n图 4-20.\n\n上传到 Simple Example 文件夹中的 HTML 和 JavaScript 文件\n\n至此，使用 Etherson 方法，您已经创建并上传了重新实现第\
  \ 3 章示例所需的两个文件。如果您的解决方案更复杂，可以想象这个文件夹中会包含多个 JavaScript 文件、CSS 文件，甚至多个 HTML 文件。这一切都取决于您需求的复杂或简单程度。接下来，让我们了解如何使用内容编辑器\
  \ Web 部件来使用这些文件。\n\n## 内容编辑器 Web 部件\n\n现在我们已经拥有了渲染内容所需的文件，接下来在页面上放置一个 CEWP 并使用这些文件。我们将使用第\
  \ 3 章示例中的同一个网站和页面。如果页面上还有 CEWP 和 SEWP，请先删除它们，确保页面为空。将页面置于编辑模式，然后在页面上插入一个新的 CEWP。保存页面——我们稍后会回来处理这个\
  \ Web 部件。\n\n导航回 Web 部件文档库，打开 Simple Example 文件夹。右键单击`SimpleExample.html`文件，从菜单中选择复制链接位置，如图\
  \ 4-21 所示。\n\n![A978-1-4842-0544-0_4_Fig21_HTML.jpg](img/A978-1-4842-0544-0_4_Fig21_HTML.jpg)\n\
  \n图 4-21.\n\n复制 HTML 文件的位置\n\n根据您使用的浏览器，此选项的名称可能不同。例如，如果使用 Internet Explorer，您应选择复制快捷方式。无论使用哪种浏览器，右键单击都会提供复制文件\
  \ URL 的选项。复制完成后，您可以导航回包含 CEWP 的页面。\n\n将页面置于编辑模式，然后将 CEWP 置于编辑模式。与第 3 章类似，在 CEWP\
  \ 的工具窗格中，第一个属性是标题内容链接。将您复制的 URL 粘贴到此文本框中，如图 4-22 所示。\n\n![A978-1-4842-0544-0_4_Fig22_HTML.jpg](img/A978-1-4842-0544-0_4_Fig22_HTML.jpg)\n\
  \n图 4-22.\n\nCEWP 内容链接属性中`SimpleExample.html`文件的 URL\n\n与第 3 章的示例不同，由于此 HTML 文件包含对\
  \ JavaScript 文件的引用，我们只需将文件的 URL 放入内容链接属性中。当 HTML 文件加载时，JavaScript 文件也会随之加载。在此示例中，无需使用脚本编辑器\
  \ Web 部件。单击确定，然后保存页面。页面重新加载后，HTML 文件将渲染显示，如图 4-23 所示。\n\n![A978-1-4842-0544-0_4_Fig23_HTML.jpg](img/A978-1-4842-0544-0_4_Fig23_HTML.jpg)\n\
  \n图 4-23.\n\n在内容编辑器 Web 部件中渲染的`SimpleExample.html`文件\n\n此时，您可能会想，既然使用 CEWP 和 SEWP\
  \ 可以更快地得到结果，为什么还要进行这么多设置和配置呢？使用 Etherson 方法的好处，在更贴近实际场景的解决方案中会更加明显。例如，假设您需要开发一个自定义解决方案，该方案可以聚合用户正在关注的任务和文档，并将它们放入一个链接列表中，供用户点击查看项目。它将部署在网站集中每个部门子网站的主页上。使用\
  \ CEWP/SEWP 方案，您不仅需要将代码粘贴到每个页面上，如果之后需要修改解决方案，您还必须更新该代码的所有实例。这可能是一个巨大的挑战。而使用 Etherson\
  \ 方法，您仍然需要在每个网站中添加一个 CEWP，但只需引用一组代码文件。如果需要修改，您只需在一个地方更新代码。这要容易管理得多。\n\n这种方法的另一个好处是，CEWP\
  \ 可以为您处理一些错误。如果由于某种原因，HTML 文件不再可用——例如被移动或删除——CEWP 可以向用户显示一条友好消息。为了演示这一点，让我们从 CEWP\
  \ 中移除内容链接，然后单击应用按钮。Web 部件中的内容将被移除，您将得到一个空白的 CEWP，如图 4-24 所示。\n\n![A978-1-4842-0544-0_4_Fig24_HTML.jpg](img/A978-1-4842-0544-0_4_Fig24_HTML.jpg)\n\
  \n图 4-24.\n\n内容链接被移除后的内容编辑器 Web 部件\n\n\n\n至此，你已基本将 CEWP 恢复至刚添加时的初始状态。点击 Web 部件中央的“单击此处添加新内容”链接。你会注意到\
  \ Web 部件中出现了光标，此时可直接输入文本。在此处添加文本“抱歉，我们遇到了错误。”接下来，将 `SimpleExample.html` 的链接重新添加到“内容链接”属性中，如图\
  \ 4-25 所示。\n\n![A978-1-4842-0544-0_4_Fig25_HTML.jpg](img/A978-1-4842-0544-0_4_Fig25_HTML.jpg)\n\
  \n**图 4-25.** 放置在内容编辑器 Web 部件中的纯文本和内容链接 URL\n\n单击“确定”，然后保存页面。你会注意到 Web 部件的外观与仅使用“内容链接”属性时完全相同。纯文本消息未显示，而是渲染了\
  \ HTML 页面的内容。CEWP 始终优先使用添加到“内容链接”属性的任何 URL，而非显示其可能包含的纯文本。现在，让我们从 Simple Example\
  \ 文件夹中删除 HTML 和 JavaScript 文件，如图 4-26 所示。\n\n![A978-1-4842-0544-0_4_Fig26_HTML.jpg](img/A978-1-4842-0544-0_4_Fig26_HTML.jpg)\n\
  \n**图 4-26.** 从 Simple Example 文件夹中删除 HTML 和 JavaScript 文件\n\n一旦 HTML 文件被删除，CEWP\
  \ 将无法再加载它；它已经不存在了。由于在 Web 部件中提供了纯文本，它现在将显示你加载的错误消息，如图 4-27 所示。\n\n![A978-1-4842-0544-0_4_Fig27_HTML.jpg](img/A978-1-4842-0544-0_4_Fig27_HTML.jpg)\n\
  \n**图 4-27.** 当 Web 部件无法加载 HTML 文件时显示的纯文本消息\n\n在开发过程中，你需要对错误进行编码处理，但 CEWP 内置的这种回退机制是一个很好的选择，以防其他问题出现。你应始终以这种方式提供一些内容。有许多场景会导致\
  \ CEWP 无法访问你的 HTML 文件，例如：\n\n- 文件从文件夹中被删除（就像我们刚才做的那样）\n- 发生网络错误\n- 你在“内容链接”属性中手动输入\
  \ URL 时拼错了文件名\n\n利用此功能以防万一绝对是个更好的选择。现在，让我们更新上一个示例中的代码，使其不仅能显示列表名称，还能做更多事情。\n\n##\
  \ 处理列表数据\n\n上一个示例向你介绍了 Etherson 方法。至此，你有了一个 HTML 文件和一个 JavaScript 文件，它们可以提取列表数据并显示出来。这还不错，但显然这不是你在实际解决方案中会采用的方式。因此，让我们扩展这段代码，实际从列表中提取一些数据并展示给用户。如果你还没做过，请向你的“演示列表”中添加一些数据，如图\
  \ 4-28 所示。\n\n![A978-1-4842-0544-0_4_Fig28_HTML.jpg](img/A978-1-4842-0544-0_4_Fig28_HTML.jpg)\n\
  \n**图 4-28.** 填充了几个项目的演示列表\n\n此列表中的项目目前无关紧要；我们只需要一些数据来提取和显示。请随意添加任意数量的项目；我们将全部获取。现在列表中有了更多数据，我们将更新之前的\
  \ `SimpleExample.js` 文件，以便请求列表项而非列表数据。请使用以下代码更新你的文件：\n\n```\n$(function () {\n \
  \ $.ajax({\n    url: \"/apress/_api/web/lists/GetByTitle('Demo List')/items\",\n\
  \    type: \"GET\",\n    headers: {\n      \"accept\": \"application/json;odata=verbose\"\
  \n    },\n  }).success(function (data) {\n    var listItemInfo = \"\";\n    $.each(data.d.results,\
  \ function (key, value) {\n      listItemInfo += \"<strong>Title: </strong>\" +\
  \ value.Title + \" <strong>Description: </strong>\" + value.Description + \"<br\
  \ />\";\n    });\n    $(\"#divHelloWorld\").html(listItemInfo);\n  });\n});\n```\n\
  \n这段代码与之前的代码类似，但增加了一些关键内容。首先，AJAX 调用中的 URL 已更新，末尾添加了 `/items`：\n\n```\nurl: \"/apress/_api/web/lists/GetByTitle('Demo\
  \ List')/items\"\n```\n\n我们仍然在调用同一个列表，但这次需要让 REST API 知道我们想要列表中的项目。通过仅提供 `/items`\
  \ 而不附加其他信息，我们是在告诉 API 返回列表中的所有项目。\n\n**注意：** 除非你确信列表中的数据量不会很大，否则在任何数据调用中都不应请求所有项目。你可以通过提供限制条件或使用\
  \ CAML 查询来限制返回的数据量，从而仅返回你需要的项目。本书后面会深入探讨这些选项。\n\n在 JavaScript 的成功函数中，我们将遍历所有返回的数据：\n\
  \n```\nvar listItemInfo = \"\";\n$.each(data.d.results, function (key, value) {\n\
  \  listItemInfo += \"<strong>Title: </strong>\" + value.Title + \" <strong>Description:\
  \ </strong>\" + value.Description + \"<br />\";\n});\n```\n\n我们从一个新的空变量 `listItemInfo`\
  \ 开始。该变量用于保存我们在遍历 API 调用结果时构建的所有 HTML。接下来，我们使用 jQuery 内置函数 `each` 来遍历结果。通过使用 `$.each`，我们表示对于\
  \ `data.d.results` 对象中的每一个项目，执行以下函数。你会在自定义解决方案中频繁使用此函数，因为遍历列表项非常常见。\n\n与我们之前简单显示列表属性和数据的示例类似，我们看到了熟悉的\
  \ `data.d` 对象。但这次，我们有了一个名为 `results` 的新属性。当我们查询列表以获取其数据时，所需的所有信息都位于 `d` 属性下；例如，`d.Title`。当你请求列表项时，所有数据将位于\
  \ `results` 属性中。\n\n在 `each` 函数内部，我们将 `listItemInfo` 变量设置为一些 HTML，这些 HTML 用于获取当前列表项的“标题”和“描述”。使用\
  \ `+=` 语法，我们将变量设置为当前值加上新值。这是一种简单的方法，可以在前一循环有 HTML 内容时附加到它上面。循环完成后，我们将 HTML 设置到 Hello\
  \ World DIV 中：\n\n```\n$(\"#divHelloWorld\").html(listItemInfo);\n```\n\n图 4-29\
  \ 显示了 Visual Studio 中的完整文件。\n\n![A978-1-4842-0544-0_4_Fig29_HTML.jpg](img/A978-1-4842-0544-0_4_Fig29_HTML.jpg)\n\
  \n**图 4-29.**\n\n\n\n### Visual Studio 中更新的 `SimpleExample.js` 文件\n\n保存包含更新代码的文件。在上传到文档库之前，让我们快速更改\
  \ CEWP（内容编辑器 Web 部件）的标题，以使这个示例更贴近实际。导航回到放置 Web 部件的页面，并将其切换到编辑模式。展开“外观”（Appearance）折叠面板，并更新“标题”（Title）属性，如图\
  \ 4-30 所示。\n\n![A978-1-4842-0544-0_4_Fig30_HTML.jpg](img/A978-1-4842-0544-0_4_Fig30_HTML.jpg)\n\
