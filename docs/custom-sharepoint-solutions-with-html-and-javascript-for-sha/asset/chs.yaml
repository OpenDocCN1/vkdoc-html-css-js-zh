  \ 获取当前网站的完整 URL。接下来，硬编码 URL 的文档库部分和文件名。最后，我们将它们组合成一个名为 `fullUrl` 的新变量。你完全可以将所有这些操作放在一行中完成，但你会发现，将它们分解成较小的行，以后调试代码会更方便。一旦我们有了文件的\
  \ URL，我们就使用 jQuery AJAX 调用来获取文档：\n\n```javascript\n$.ajax({\n\n        url: fullUrl,\n\
