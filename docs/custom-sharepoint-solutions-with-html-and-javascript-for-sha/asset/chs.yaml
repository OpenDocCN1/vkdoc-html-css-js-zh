  在 SharePoint 中，查询是使用关键字查询语言（简称 KQL）构建的。使用 KQL，您可以指定传递给 SharePoint 搜索服务的搜索词或属性限制。KQL
  查询并不复杂，由以下一个或多个元素组成：


  - 自由文本关键字 - 这些可以是单词或短语，例如 whitepaper、event、Bob Smith 等。

  - 属性限制 - 这些可以是文件类型、作者、文件名等。


  属性限制的功能正如其名：限制搜索结果。例如，您可以添加一个`FileType`限制器，并通过使用`FileType:docx`仅返回某种文档类型（如仅返回 Word
  文件）。有大量的属性限制可供使用，这使得 KQL 在满足您的搜索需求方面非常强大。


  > **注意**：关键字查询语言虽然易于实现，但其语法非常丰富和深入。它非常适合精确地构建满足您需求的查询，但对于本书而言，这个主题过于庞大。我们仅浅尝辄止地介绍其能力。有关
  KQL、属性限制等的详细信息，请访问[`http://msdn.microsoft.com/en-us/library/office/ee558911(v=office.15).aspx`](http://msdn.microsoft.com/en-us/library/office/ee558911(v=office.15).aspx)。


  一个有效的 KQL 查询必须包含一个自由文本关键字、一个属性限制，或两者的组合。首先，我们将删除查询中的`{searchTerms}`部分。我们不会使用它，因为我们的`内容搜索
  Web 部件`将直接返回结果，无需用户任何交互。接下来，我们将使用`path`属性添加一个属性限制：


  `path:"https://brandonatkinson.sharepoint.com/apress/Shared Documents"`


  `path`属性指示查询仅从指定路径及其下的任何内容（包括文件夹、子网站等）返回结果。该路径必须是完全限定的 URL，如果包含空格，则必须用引号将 URL 括起来。在我的环境中，我使用的是开箱即用的`文档`文件夹，它实际上是`共享文档`文件夹。您可以通过单击导航面板中的文件夹并检查浏览器地址栏中的
  URL 来随时确认文件夹的实际名称。将此属性限制放入`查询文本`文本框并点击`测试查询`按钮，将产生如图 6-13 所示的结果。


  ![A978-1-4842-0544-0_6_Fig13_HTML.jpg](img/A978-1-4842-0544-0_6_Fig13_HTML.jpg)


