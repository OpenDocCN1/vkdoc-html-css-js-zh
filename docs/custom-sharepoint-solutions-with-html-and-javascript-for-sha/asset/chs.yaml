  \n```\nvar docTitle = $(\"#txtDocumentTitle\").val() + \".txt\";\n```\n\n我们将保持此示例的简洁性，删除之前创建的文本文件，因此将\
  \ `.txt` 扩展名硬编码到代码中。接下来，我们执行常规操作，引用当前的客户端上下文和网站，然后构建文档的路径：\n\n```\nvar fileUrl =\
  \ _spPageContextInfo.webServerRelativeUrl +\n\"/Shared Documents/\" + docTitle;\n\
  ```\n\n对于此路径，我们只需要文档的相对路径，而不是完整 URL。我们可以通过使用 `_spPageContextInfo.webServerRelativeUrl`\
  \ 来获取当前网站的相对路径。由于我们知道该文档位于“文档”文件夹中，我们将硬编码该路径，并添加用户提交的文档标题。与 SharePoint 中的其他删除操作一样，我们不需要在客户端上下文中加载此请求，只需直接调用\
  \ `deleteObject` 方法并执行查询即可。`success` 函数将向用户输出一条消息，告知他们文档已被删除。\n\n与我们之前看到的创建、读取和更新文档函数不同，假设用户具有删除权限，你可以使用\
  \ JSOM 删除任何你想要的文件。SharePoint 在删除文档方面非常灵活。你可以轻松使用相同的代码删除 Office 文档，而不会出现任何问题，也无需额外的\
  \ JavaScript 库。\n\n### 结果\n\n将内容编辑器 Web 部件的**内容链接**属性设置为该 HTML 文件，然后保存页面。页面将显示一个文本框供用户输入文档标题，并显示一条结果消息，如图\
  \ 8-18 所示。\n\n![A978-1-4842-0544-0_8_Fig18_HTML.jpg](img/A978-1-4842-0544-0_8_Fig18_HTML.jpg)\n\
  \n**图 8-18.** 通过 JSOM 删除文件\n\n\n\n## 使用站点\n\n此刻你可能会觉得 JSOM 相当强大！事实确实如此，为了证明这一点，我们将用它创建一个新站点！操作列表和库固然很酷，但能够通过\
  \ JavaScript 创建新站点才能真正展示 JSOM 的强大功能。\n\n### 创建站点\n\n在本例中，我们将创建一个新的团队站点。除了创建新站点外，我们还会设置其多项属性，包括标题、说明和网站模板。\n\
  \n#### HTML\n\n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为 `JSOMCreateSite.html`。此页面的标记包含一个用于用户输入新站点名称的文本框，以及一个用于输入站点说明的文本框。它包括以下几行代码：\n\
  \n```\n<script type=\"text/javascript\" src=\"/_layouts/15/sp.runtime.js\"></script>\n\
  <script type=\"text/javascript\" src=\"/_layouts/15/sp.js\"></script>\n<script type=\"\
  text/javascript\" src=\"/apress/Webparts/chapter 8/JSOMCreateSite.js\"></script>\n\
  <div id=\"DeleteFile\">\n    <div>\n        <strong>输入站点名称：</strong>\n        <br\
  \ />\n        <input type=\"text\" id=\"txtSiteTitle\" />\n    </div>\n    <br />\n\
  \    <div>\n        <strong>输入站点说明：</strong>\n        <br />\n        <textarea\
  \ cols=\"20\" id=\"txtSiteDescription\"></textarea>\n    </div>\n    <br />\n  \
  \  <input type=\"button\" id=\"btnSubmit\" value=\"提交\" />\n</div>\n<div id=\"divResults\"\
  ></div>\n```\n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript 文件，并将其命名为\
  \ `JSOMCreateSite.js`；包含以下代码：\n\n```\n$(function () {\n    bindButtonClick();\n\
  });\nfunction bindButtonClick() {\n    $(\"#btnSubmit\").on(\"click\", function\
  \ () {\n        createSite();\n    });\n}\nfunction createSite() {\n    var siteTitle\
  \ = $(\"#txtSiteTitle\").val();\n    var siteDesc = $(\"#txtSiteDescription\").val();\n\
  \    var siteUrl = siteTitle.replace(/\\s/g, \"\");\n    var clientContext = new\
  \ SP.ClientContext();\n    var collWeb = clientContext.get_web().get_webs();\n \
  \   var webCreationInfo = new SP.WebCreationInformation();\n    webCreationInfo.set_title(siteTitle);\n\
  \    webCreationInfo.set_description(siteDesc);\n    webCreationInfo.set_language(1033);\n\
  \    webCreationInfo.set_url(siteUrl);\n    webCreationInfo.set_useSamePermissionsAsParentSite(true);\n\
  \    webCreationInfo.set_webTemplate('STS#0');\n    var oNewWebsite = collWeb.add(webCreationInfo);\n\
  \    clientContext.executeQueryAsync(\n        Function.createDelegate(this, this.onQuerySucceeded),\n\
  \        Function.createDelegate(this, this.onQueryFailed)\n    );\n}\nfunction\
  \ onQuerySucceeded() {\n    $(\"#divResults\").html(\"站点创建成功！\");\n}\nfunction onQueryFailed(sender,\
  \ args) {\n    alert('请求失败。' + args.get_message() +\n        '\\n' + args.get_stackTrace());\n\
  }\n```\n\n创建新站点需要多写一些代码，但到现在为止，这些代码应该都非常熟悉了。首先，我们通过以下几行代码获取用户提交的标题和说明：\n\n```\n\
  var siteTitle = $(\"#txtSiteTitle\").val();\nvar siteDesc = $(\"#txtSiteDescription\"\
  ).val();\nvar siteUrl = siteTitle.replace(/\\s/g, \"\");\n```\n\n创建站点时，除了标题之外，还必须提供站点的\
  \ URL。在本例中，我们只需获取用户输入的标题文本，并移除所有空格来生成 URL。这是通过使用 JavaScript 的 `replace()` 方法完成的，第一个参数是我们正在搜索的内容，第二个参数是替换后的内容。`/\\\
  s/g` 文本表示一个空格，必须使用此表达式才能使函数正常工作。\n\n一旦我们获得了创建站点所需的变量，我们就引用当前的客户端上下文，然后获取当前网站中的网站集：\n\
  \n```\nvar collWeb = clientContext.get_web().get_webs();\n```\n\n`get_web().get_webs()`\
  \ 方法返回当前网站中所有子网站的集合。我们最终将把新站点添加到此集合中。接下来，我们创建一个 `SP.WebCreationInformation` 对象：\n\
  \n```\nvar webCreationInfo = new SP.WebCreationInformation();\nwebCreationInfo.set_title(siteTitle);\n\
  webCreationInfo.set_description(siteDesc);\nwebCreationInfo.set_language(1033);\n\
  webCreationInfo.set_url(siteUrl);\nwebCreationInfo.set_useSamePermissionsAsParentSite(true);\n\
  webCreationInfo.set_webTemplate('STS#0');\n```\n\n就像我们之前看到的其他 `CreationInformation`\
  \ 对象一样，我们创建一个新的 `WebCreationInformation` 对象并设置其各种属性。幸运的是，在此对象上配置属性所需的所有方法几乎都是不言自明的；例如，`set_useSamePermissionsAsParentSite()`\
  \ 决定此新站点是否应继承父站点的权限。有一些你可能不熟悉的棘手参数，例如 `1033`（在为站点设置语言时表示“英语”）和 `STS#0`（在设置站点模板时表示团队站点模板）。所有其他属性看起来应该很熟悉。\n\
  \n设置好属性后，我们只需将新站点添加到集合中：\n\n```\nvar oNewWebsite = collWeb.add(webCreationInfo);\n\
  ```\n\n创建新站点也是一个不需要在客户端上下文上加载查询的领域。你可以直接执行查询来创建新站点。`success` 函数将简单地通知用户站点已创建。\n\n\
  **注意**\n\n再次强调，这些示例中的代码在当前用户的权限级别下运行。由于这些示例中有许多执行高级功能，例如创建和删除 SharePoint 对象，用户需要具有适当的权限才能执行这些功能。这一点值得再次指出，因为创建站点将要求用户对创建新网站的区域拥有完全控制权限。\n\
  \n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为 HTML 文件并保存页面。页面将显示文本框，供用户输入新站点的标题和说明，并显示结果消息，如图\
  \ 8-19 所示。\n\n![A978-1-4842-0544-0_8_Fig19_HTML.jpg](img/A978-1-4842-0544-0_8_Fig19_HTML.jpg)\n\
  \n**图 8-19.** 通过 JSOM 创建新站点\n\n然后，我们可以打开新站点所在的“网站内容”页面，并滚动到底部。在“子网站”部分，我们可以看到新站点已创建，如图\
  \ 8-20 所示。\n\n![A978-1-4842-0544-0_8_Fig20_HTML.jpg](img/A978-1-4842-0544-0_8_Fig20_HTML.jpg)\n\
  \n**图 8-20.** “网站内容”页面中新创建的子网站\n\n### 删除站点\n\n在本节中，我们将删除上一示例中创建的站点。\n\n#### HTML\n\
  \n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为 `JSOMDeleteSite.html`。此页面的标记包含一个文本框，供用户输入他们想要删除的站点名称。它包括以下几行代码：\n\
  \n```\n<script type=\"text/javascript\" src=\"/_layouts/15/sp.runtime.js\"></script>\n\
  <script type=\"text/javascript\" src=\"/_layouts/15/sp.js\"></script>\n<script type=\"\
  text/javascript\" src=\"/apress/Webparts/chapter 8/JSOMDeleteSite.js\"></script>\n\
  <div id=\"DeleteFile\">\n    <div>\n        <strong>输入要删除的站点名称：</strong>\n     \
  \   <br />\n        <input type=\"text\" id=\"txtSiteTitle\" />\n    </div>\n  \
  \  <br />\n    <input type=\"button\" id=\"btnSubmit\" value=\"提交\" />\n</div>\n\
  <div id=\"divResults\"></div>\n```\n\n\n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的\
  \ JavaScript 文件，并将其命名为 `JSOMDeleteSite.js`；包含以下代码：\n\n```\n$(function () {\n   \
  \ bindButtonClick();\n});\n\nfunction bindButtonClick() {\n    $(\"#btnSubmit\"\
  ).on(\"click\", function () {\n        deleteSite();\n    });\n}\n\nfunction deleteSite()\
  \ {\n    var siteTitle = $(\"#txtSiteTitle\").val();\n    var siteTitleNoSpaces\
  \ = siteTitle.replace(/\\s/g, \"\");\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl\
  \ + \"/\" + siteTitleNoSpaces;\n    var clientContext = new SP.ClientContext(siteUrl);\n\
  \    var oWebsite = clientContext.get_web();\n    oWebsite.deleteObject();\n   \
  \ clientContext.executeQueryAsync(\n        Function.createDelegate(this, this.onQuerySucceeded),\n\
  \        Function.createDelegate(this, this.onQueryFailed)\n    );\n}\n\nfunction\
  \ onQuerySucceeded() {\n    $(\"#divResults\").html(\"Site successfully deleted!\"\
  );\n}\n\nfunction onQueryFailed(sender, args) {\n    alert('Request failed. ' +\
  \ args.get_message() +\n        '\\n' + args.get_stackTrace());\n}\n```\n\n与之前的示例一样，我们获取用户输入的网站标题，然后移除所有空格：\n\
  \n```\nvar siteTitle = $(\"#txtSiteTitle\").val();\nvar siteTitleNoSpaces = siteTitle.replace(/\\\
  s/g, \"\");\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl + \"/\" + siteTitleNoSpaces;\n\
  ```\n\n获取标题并移除空格后，我们需要构建网站的完整 URL。我们可以使用 `_spPageContextInfo.webAbsoluteUrl` 获取当前网站的完整\
  \ URL，然后在末尾简单地附加一个 `/` 和没有空格的网站标题。我们需要构建完整的 URL，以便可以请求要删除的目标网站的客户端上下文，而不是用户当前所在的网站：\n\
  \n```\nvar clientContext = new SP.ClientContext(siteUrl);\nvar oWebsite = clientContext.get_web();\n\
  ```\n\n到目前为止，我们一直使用用户查看页面时所在的当前网站的客户端上下文。但是，你可以通过将 URL 作为参数传递给 `SP.ClientContext()`\
  \ 方法（正如本示例中所做的那样），来请求其他网站的上下文。获得该网站的上下文后，我们使用 `clientContext.get_web()` 获取对该网站根网站的引用。与所有其他删除操作一样，我们只需调用\
  \ `deleteObject()` 方法来请求删除操作：\n\n```\noWebsite.deleteObject();\n```\n\n`success`\
  \ 函数会向用户显示一条消息，告知他们删除已完成。\n\n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为该 HTML 文件，然后保存页面。页面将显示一个文本框供用户输入网站标题，并显示一条结果消息，如图\
  \ 8-21 所示。\n\n![A978-1-4842-0544-0_8_Fig21_HTML.jpg](img/A978-1-4842-0544-0_8_Fig21_HTML.jpg)\n\
  \n图 8-21. 通过 JSOM 删除子网站\n\n在此示例中，我们将删除刚刚创建的网站。导航回网站内容页面将显示子网站已成功删除，如图 8-22 所示。\n\
  \n![A978-1-4842-0544-0_8_Fig22_HTML.jpg](img/A978-1-4842-0544-0_8_Fig22_HTML.jpg)\n\
  \n图 8-22. 该网站已从根网站中移除\n\n## 使用社交数据\n\nSharePoint 的一个重要新领域是社交数据。如果你要为 SharePoint\
  \ 编写自定义解决方案，你肯定会在某个时候需要访问社交数据。本节将演示如何提取其中一些数据以用于你的解决方案中。\n\n#### HTML\n\n在 Visual\
  \ Studio 中创建一个新的 HTML 文件，并将其命名为 `JSOMGetSocialData.html`。该页面的标记将包含几个 `DIV` 和一个 `SPAN`，用于输出数据。它包含以下行：\n\
  \n```\n<script type=\"text/javascript\" src=\"/_layouts/15/sp.runtime.js\"></script>\n\
  <script type=\"text/javascript\" src=\"/_layouts/15/sp.js\"></script>\n<script type=\"\
  text/javascript\" src=\"/_layouts/15/sp.userprofiles.js\"></script>\n<script type=\"\
  text/javascript\" src=\"/apress/Webparts/chapter 8/JSOMGetSocialData.js\"></script>\n\
  <link rel=\"stylesheet\" type=\"text/css\" href=\"/apress/Webparts/chapter 8/JSOMGetSocialData.css\"\
  \ />\n<div id=\"WelcomeMessage\">\n    Welcome back <span id=\"WelcomeMessageUserName\"\
  ></span>\n</div>\n<div id=\"UserFollows\" />\n```\n\n此示例的引用比迄今为止的任何其他示例都多。你会注意到，除了引用\
  \ `sp.js` 和 `sp.runtime.js` 之外，我们还包含了 `sp.userprofiles.js` 的引用。正如本章前面提到的，JSOM 功能分布在许多不同的文件中，这些文件服务于特定需求。在此示例中，由于我们想要获取用户的社交数据，因此我们必须包含对\
  \ `sp.userprofiles.js` 文件的引用，才能访问该功能。\n\n我们还将包含一个名为 `JSOMGetSocialData.css` 的自定义\
  \ CSS 文件。该文件将用于设置脚本输出的样式。所有其他示例本可以轻松地包含用于样式的 CSS。你会发现在自定义开发工作中，样式在许多 Web 部件中起着重要作用；因此，此示例将向你展示包含样式是多么容易。\n\
  \n\n\n#### JavaScript\n\n在 Visual Studio 中新建一个 JavaScript 文件，并将其命名为 `JSOMGetSocialData.js`，然后包含以下代码：\n\
  \n```js\n$(function () {\n    ExecuteOrDelayUntilScriptLoaded(getUserProfileProperties,\
  \ \"sp.userprofiles.js\");\n});\n\nfunction getUserProfileProperties() {\n    var\
  \ clientContext = new SP.ClientContext();\n    var peopleManager = new SP.UserProfiles.PeopleManager(clientContext);\n\
  \    this.userProperties = peopleManager.getMyProperties();\n    clientContext.load(userProperties);\n\
  \    \n    var followingManager = new SP.Social.SocialFollowingManager(clientContext);\n\
  \    this.following = followingManager.getFollowed(15);\n    \n    clientContext.executeQueryAsync(\n\
  \        Function.createDelegate(this, this.onQuerySucceeded),\n        Function.createDelegate(this,\
  \ this.onQueryFailed)\n    );\n}\n\nfunction onQuerySucceeded() {\n    $(\"#WelcomeMessageUserName\"\
  ).text(userProperties.get_displayName());\n    \n    var followedItems = \"您关注的项目：<br\
  \ />\";\n    $.each(following, function(index, value) {\n        followedItems +=\
  \ \"<a href='\" + value.get_uri() + \"'>\" + value.get_name() + \"</a><br />\";\n\
  \    });\n    \n    $(\"#UserFollows\").append(followedItems);\n}\n\nfunction onQueryFailed(sender,\
  \ args) {\n    alert('请求失败。' + args.get_message() +\n        '\\n' + args.get_stackTrace());\n\
  }\n```\n\n在 jQuery 的 `Document.ready` 函数中，我们包含了一个内置函数 `ExecuteOrDelayUntilScriptLoaded`。之所以需要使用它，是因为我们的\
  \ JavaScript 代码依赖于 `sp.userprofiles.js` 中的功能，如果在加载该文件之前运行，会导致错误：\n\n```js\nExecuteOrDelayUntilScriptLoaded(getUserProfileProperties,\
  \ \"sp.userprofiles.js\");\n```\n\n一旦触发了 `getUserProfileProperties` 函数，我们就获取当前客户端上下文的引用，然后用以下代码创建一个新的\
  \ `PeopleManager` 对象：\n\n```js\nvar peopleManager = new SP.UserProfiles.PeopleManager(clientContext);\n\
  this.userProperties = peopleManager.getMyProperties();\nclientContext.load(userProperties);\n\
  ```\n\n我们可以通过 `SP.UserProfiles.PeopleManager()` 方法创建一个新的 `PeopleManager` 对象，并以客户端上下文作为其参数传入。`PeopleManager`\
  \ 对象提供了访问用户数据的方法。在此例中，我们可以通过 `peopleManager.getMyProperties()` 方法获取当前用户的所有属性，然后在客户端上下文中加载\
  \ `userProperties` 变量。\n\n接下来，我们将使用 `SocialFollowingManager()` 对象获取用户关注的所有项目：\n\n\
  ```js\nvar followingManager = new SP.Social.SocialFollowingManager(clientContext);\n\
  this.following = followingManager.getFollowed(15);\n```\n\n我们可以通过 `SP.Social.SocialFollowingManager()`\
  \ 方法创建一个新的 `SocialFollowingManager` 对象，并以客户端上下文作为其参数传入。然后，我们可以通过 `getFollowed()`\
  \ 方法获取用户关注的所有“参与方”。一个“参与方”实际上就是用户关注的任何对象，可以是用户、文档、网站或标签。当您调用 `getFollowed()` 方法时，需要传入一个数字，该数字对应于您想要返回的参与方类型。在此示例中，我们使用\
  \ 15，表示所有参与方。您可以在 [`http://msdn.microsoft.com/en-us/library/microsoft.sharepoint.client.social.socialactortypes(v=office.15).aspx`](http://msdn.microsoft.com/en-us/library/microsoft.sharepoint.client.social.socialactortypes(v=office.15).aspx)\
  \ 上查看完整的取值列表。\n\n此示例中的 `success` 方法目前是最复杂的，因为我们需要比其它示例显示更多的数据。首先，我们将获取当前用户的用户名以便在页面上显示：\n\
  \n```js\n$(\"#WelcomeMessageUserName\").text(userProperties.get_displayName());\n\
  ```\n\n`userProperties` 对象有许多检索数据的方法；要获取用户名，我们可以调用 `get_displayName()` 方法。接下来，我们将遍历所有关注的项目，构建一个列表展示给用户：\n\
  \n```js\nvar followedItems = \"您关注的项目：<br />\";\n$.each(following, function(index,\
  \ value) {\n    followedItems += \"<a href='\" + value.get_uri() + \"'>\" + value.get_name()\
  \ + \"</a><br />\";\n});\n```\n\n首先，我们创建一个新变量来保存所有关注的项目。接着，我们使用 jQuery 的 `each`\
  \ 循环遍历每个项目。对于每个项目，我们调用 `get_uri()` 和 `get_name()` 方法来构造一个链接，以便用户可以从页面直接跳转到该项目。最后，我们通过下面这一行将所有\
  \ HTML 附加到页面上：\n\n```js\n$(\"#UserFollows\").append(followedItems);\n```\n\n####\
  \ CSS\n\n在 Visual Studio 中新建一个 CSS 文件，并将其命名为 `JSOMGetSocialData.css`，然后包含以下代码：\n\
  \n```css\n#WelcomeMessage {\n    margin-bottom: 20px;\n}\n#WelcomeMessageUserName\
  \ {\n    font-weight: bold;\n}\n#UserFollows {\n    border:dashed 1px #C0C0C0;\n\
  \    width:240px;\n    padding: 6px;\n}\n```\n\n这段 CSS 非常简单，仅用于提供一个基本的样式示例。我们将为欢迎消息添加底部外边距，并将用户名加粗。关注的项目将被包裹在一个虚线边框内以作强调。\n\
  \n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为指向 HTML 文件，然后保存页面。页面将向用户显示一条“欢迎回来”的消息，同时用户名以粗体显示。正下方是他们关注的所有项目的列表，以超链接形式呈现，如图\
  \ 8-23 所示。\n\n![A978-1-4842-0544-0_8_Fig23_HTML.jpg](img/A978-1-4842-0544-0_8_Fig23_HTML.jpg)\n\
  \n**图 8-23.** 通过 JSOM 检索社交数据\n\n"
- '# 总结


  在本章中，我们深入探讨了 JavaScript 对象模型 (JSOM)，并了解了如何使用 Etherson 方法创建自定义 Web 部件。我们研究了各种各样的示例：查询列表数据、创建新列表和网站，以及查询用户的社交数据。虽然与本书其它章节相比，这一章篇幅较长，但它仅仅触及了
  JSOM 在 SharePoint 中功能的皮毛。然而，在完成本章提供的所有示例后，您应该已经牢固掌握了如何使用 JSOM，以及 HTML、JavaScript
  和 CSS 如何在自定义 Web 部件中协同工作。现在您应该有足够的信心开始使用 JSOM 构建自己的自定义解决方案了。在下一章中，我们将研究许多相同的示例，并学习如何使用
  REST API 执行任务。




