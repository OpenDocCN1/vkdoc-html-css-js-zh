  \ JSLinkFieldTemplateExt.js`\n\n将列表视图 Web 部件置于编辑模式，并使用组合路径更新 JSLink 属性。点击“应用”，然后保存页面。乍一看，自定义渲染并没有太大变化。点击状态图像以触发点击事件，如图\
