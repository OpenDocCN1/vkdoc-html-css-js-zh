  \ CEWP 的页面并刷新它。您可能需要通过按键盘上的 `Ctrl+F5` 来执行硬刷新；这将指示浏览器从服务器加载 JavaScript 文件的全新副本。结果应该是加载了关于列表数据的先前脚本，如图\
