- "# 9. 使用 REST API\n\n在上一章中，我们了解了如何使用 JavaScript 对象模型（JSOM）和 Etherson 方法执行大量任务。本章将探讨相同的任务，但侧重于如何使用\
  \ REST API 来执行。为此，上一章中的许多 HTML 代码将类似，最终结果也将相同。不过，JavaScript 代码将完全不同。如果你跳过了 JSOM\
  \ 章节，也不必担心；本章会对代码进行完整解释，因此你不会对任何示例感到困惑。\n\nREST 全称为 Representational State Transfer（表征状态转移），这是一种略显花哨的说法，实际含义是“允许任何事物通过\
  \ Web 连接的 Web 服务”。任何能够通过互联网发起 HTTP 请求的设备都可以调用 REST 服务。这类服务近来非常流行，因为它是一种让数据能被任何系统访问的简单方法。SharePoint\
  \ 2013 引入了一套新的 REST API，用于向应用程序公开数据。幸运的是，这套 API 也可以通过 HTML 和 JavaScript 轻松使用。\n\n\
  > **注意：** 使用 REST API 的代码会在当前登录用户的上下文中运行。这意味着代码只能执行该用户权限级别所允许的操作。例如，如果你的代码用于在网站集中创建新的子网站，但当前登录用户没有该权限，则代码会运行但会产生错误。在构建解决方案时请牢记这一点，并确保不要向用户展示他们无法使用的选项。\n\
  \n## 准备工作\n\n本章的示例将继续使用第 4 章中介绍的 Etherson 方法。导航到网站中的 `Webparts` 文件夹，创建一个名为 `Chapter\
  \ 9` 的新文件夹，如图 9-1 所示。\n\n![A978-1-4842-0544-0_9_Fig1_HTML.jpg](img/A978-1-4842-0544-0_9_Fig1_HTML.jpg)\n\
  \n**图 9-1.** `Webparts` 文档库中的 `Chapter 9` 文件夹\n\n本章中的每个示例都将遵循相同的模式。我们先看在内容编辑器 Web\
  \ 部件中呈现的 HTML 文件，然后是用于检索和呈现数据的 JavaScript 文件，最后是结果。我们会详细分析每个文件，并在此过程中解释每个文件中的具体操作。\n\
  \n## 使用列表\n\n正如上一章所述，SharePoint 中列表无处不在！在你的开发工作中，几乎不可能不接触到列表。在本节中，我们将探讨如何使用 REST\
  \ API 与列表进行交互的一些方法。\n\n### 获取列表数据\n\n在这个示例中，我们将简单地检索一些列表数据并显示给用户。\n\n#### HTML\n\
  \n在 Visual Studio 中创建一个新的 HTML 文件，并命名为 `RESTGetListData.html`。本示例中的 HTML 非常简单，仅包含以下几行代码：\n\
  \n```html\n<script type=\"text/javascript\" src=\"/apress/webparts/chapter 9/RESTGetListData.js\"\
  ></script>\n<div id=\"divGetListData\"></div>\n```\n\n如果你已经学习过 JSOM 的示例，会注意到这里的\
  \ HTML 更加简洁，引用的 JavaScript 也更少。主要原因是使用 REST API 时，你不需要加载任何 SharePoint JavaScript\
  \ 文件（如 JSOM）。所有对 REST API 的调用都是通过 JavaScript AJAX 调用完成的。在我们的示例中将使用 jQuery 的 AJAX\
  \ 方法。\n\n接下来，我们加载自定义的 JavaScript 文件 `RESTGetListData`。该文件包含了将所有数据加载到页面上 ID 为 `divGetListData`\
  \ 的 DIV 元素中的所有代码。总的来说，这个页面上内容不多。\n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript\
  \ 文件，并命名为 `RESTGetListData.js`。与 HTML 相比，JavaScript 文件更为复杂，包含以下代码：\n\n```javascript\n\
  $(function () {\n    getListData();\n});\n\nfunction getListData() {\n    var siteUrl\
  \ = _spPageContextInfo.webAbsoluteUrl;\n    var fullUrl = siteUrl + \"/_api/web/lists\"\
  ;\n\n    $.ajax({\n        url: fullUrl,\n        type: \"GET\",\n        headers:\
  \ {\n            \"accept\": \"application/json;odata=verbose\",\n            \"\
  content-type\": \"application/json;odata=verbose\",\n        },\n        success:\
  \ onQuerySucceeded,\n        error: onQueryFailed\n    });\n}\n\nfunction onQuerySucceeded(data)\
  \ {\n    var listItemInfo = '';\n    $.each(data.d.results, function (key, value)\
  \ {\n        listItemInfo += 'Title: ' + value.Title + ' - Created: ' +\n      \
  \  value.Created + '<br />';\n    });\n    $(\"#divGetListData\").html(listItemInfo);\n\
  }\n\nfunction onQueryFailed() {\n    alert('Error!');\n}\n```\n\n首先你会注意到，这个文件中 SharePoint\
  \ 相关的代码非常少。绝大多数代码都是 JavaScript 和 jQuery，只有 `_spPageContextInfo.webAbsoluteUrl` 这一处调用了\
  \ SharePoint JavaScript。对于那些刚接触 SharePoint 前端开发、但具有 jQuery 经验的开发者来说，这似乎是一条捷径！如果你熟悉\
  \ jQuery 和 AJAX 调用，这确实提供了一种更快速创建自定义解决方案的方法。\n\n本书中的大部分 REST 示例都遵循与本示例相同的模式。让我们逐行详细分析，以完全理解其工作原理。脚本以\
  \ jQuery 的 `Document.ready` 方法开始，该方法简单地调用了一个名为 `getListData` 的自定义函数。在函数中，我们首先构建\
  \ REST API 的 URL：\n\n```javascript\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  var fullUrl = siteUrl + \"/_api/web/lists\";\n```\n\n我们使用 `_spPageContextInfo.webAbsoluteUrl`\
  \ 方法来获取用户当前所在网站的完整 URL。接着，通过 `/_api/web/lists` 添加上此 Web 中列表的 REST API 路径。这将生成一个类似于以下格式的\
  \ URL：\n\n```\nhttp://<DOMAIN>/<SITE>/_api/web/lists\n```\n\n这是所有 REST URL 的基本结构。`_api`\
  \ 表示这是对 REST API 的调用。当 SharePoint 在 AJAX 调用的 URL 中看到此部分时，它知道将请求路由到 REST API 进行处理。在这个特定示例中，我们请求的是当前\
  \ Web 上的列表集合。如果你将其与 JSOM 请求进行比较，可以看到一些相似之处：\n\n```javascript\nvar collList = clientContext.get_web().get_lists();\n\
  ```\n\n如你所见，REST API 遵循“获取 Web，然后获取列表”的类似模式。本模式将在本章中重复出现。接下来，我们发起一个标准的 jQuery AJAX\
  \ 调用来获取 Web 中的列表：\n\n```javascript\n$.ajax({\n    url: fullUrl,\n    type: \"GET\"\
  ,\n    headers: {\n        \"accept\": \"application/json;odata=verbose\",\n   \
  \     \"content-type\": \"application/json;odata=verbose\",\n    },\n    success:\
  \ onQuerySucceeded,\n    error: onQueryFailed\n});\n```\n\n对于此 AJAX 调用，我们首先传入的是调用的\
  \ URL，即之前创建的 `fullUrl` 变量，它保存了 REST API 的完整 URL。接着，我们指定调用的“类型”，这里是 `GET`。我们必须在调用中提供一些“标头”，以便\
  \ SharePoint 知道我们期望返回 JSON 格式的结果。为此，我们在 `accept` 和 `content-type` 标头中都传递了 `application/json;odata=verbose`。几乎所有的\
  \ REST 调用中都会用到这两个标头。最后，我们指定了调用完成时应触发的 `success` 和 `failure` 函数。`success` 函数简单地显示每个列表及其创建时间戳：\n\
  \n```javascript\nfunction onQuerySucceeded(data) {\n    var listItemInfo = '';\n\
  \    $.each(data.d.results, function (key, value) {\n        listItemInfo += 'Title:\
  \ ' + value.Title + ' - Created: ' +\n        value.Created + '<br />';\n    });\n\
  \    $(\"#divGetListData\").html(listItemInfo);\n}\n```\n\n\n\n### REST 调用数据的结构\n\
  \nREST 调用返回的数据结构起初可能会让人感到困惑。如果你打开 Firebug 并查看返回的对象，你会发现返回了大量的数据，远超向用户展示所需的量。此外，你想要向用户展示的数据嵌套在一个名为\
  \ `d` 的属性中。例如，在这个示例中，列表集合位于名为 `data.d.results` 的属性中。如果你要查询单个列表，则不会存在 `results` 属性，你可以直接从\
  \ `d` 属性访问数据，例如 `data.d.Title`。你将在本章中看到更多类似的实例。\n\n### 结果\n\n将内容编辑器 Web 部件的内容链接属性设置为\
  \ HTML 文件，然后保存页面。结果将显示当前网站中的所有列表，如图 9-2 所示。\n\n![A978-1-4842-0544-0_9_Fig2_HTML.jpg](img/A978-1-4842-0544-0_9_Fig2_HTML.jpg)\n\
  \n*图 9-2. 内容编辑器 Web 部件中的获取列表数据结果*\n\n### 创建新列表\n\n如本例所示，我们可以使用 REST 轻松创建新列表。\n\n\
  #### HTML\n\n在 Visual Studio 中创建一个新的 HTML 文件并将其命名为 `RESTCreateList.html`。此示例的 HTML\
  \ 比上一个示例稍复杂一些。它包含以下行：\n\n```\n<script type=\"text/javascript\" src=\"/apress/webparts/chapter\
  \ 9/RESTCreateList.js\"></script>\n\n<div>\n    <strong>输入列表名称：</strong>\n    <input\
  \ type=\"text\" id=\"txtListName\" />\n    <input type=\"button\" id=\"btnSubmitListName\"\
  \ value=\"提交\" />\n</div>\n<div id=\"divCreateListResults\"></div>\n```\n\nHTML\
  \ 稍微复杂一些，页面上有几个元素。首先，有一些简单的文本包裹在 `<strong>` 标签中，使其在页面上显示为粗体。接下来，有一个类型为 Text 的 INPUT，它是一个简单的文本框，供用户输入想要创建的列表名称。有一个按钮供用户提交新的列表请求，最后，还有一个\
  \ DIV 用于输出列表创建的结果。每个元素都有一个 ID，以便我们可以使用 jQuery 轻松定位它。\n\n> **注意**\n> 要通过 REST 创建新列表，执行代码的用户必须在\
  \ SharePoint 中至少拥有“管理列表”权限。无论权限级别如何，页面都会呈现；但是，如果用户没有足够的权限，SharePoint 将抛出错误。\n\n\
  #### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript 文件并将其命名为 `RESTCreateList.js`。相比之下，JavaScript\
  \ 文件更复杂。它包含以下行：\n\n```\n$(function () {\n    bindButtonClick();\n});\n\nfunction\
  \ bindButtonClick() {\n    $(\"#btnSubmitListName\").on(\"click\", function () {\n\
  \        var listName = $(\"#txtListName\").val();\n        createList(listName);\n\
  \    });\n}\n\nfunction createList(listName) {\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \    var fullUrl = siteUrl + \"/_api/web/lists\";\n\n    $.ajax({\n        url:\
  \ fullUrl,\n        type: \"POST\",\n        data: JSON.stringify({\n          \
  \  '__metadata': { 'type': 'SP.List' },\n            'BaseTemplate': 100,\n    \
  \        'Title': listName\n        }),\n        headers: {\n            \"accept\"\
  : \"application/json;odata=verbose\",\n            \"content-type\": \"application/json;odata=verbose\"\
  ,\n            \"X-RequestDigest\": $(\"#__REQUESTDIGEST\").val()\n        },\n\
  \        success: onQuerySucceeded,\n        error: onQueryFailed\n    });\n}\n\n\
  function onQuerySucceeded(data) {\n    $(\"#divCreateListResults\").html(data.d.Title\
  \ + \" 创建成功！\");\n}\n\nfunction onQueryFailed() {\n    alert('错误！');\n}\n```\n\n\
  在此示例中，我们不需要在页面加载时触发任何操作；但是，我们确实需要在页面加载时连接一个按钮点击事件。在 `Document.ready` 函数中，我们触发 `bindButtonClick`\
  \ 函数，该函数使用 jQuery 的 `on` 运算符为 HTML 中的 `btnSubmitListName` 按钮连接一个点击事件。当用户单击按钮时，我们从页面上的文本框中获取文本，并将其传递给\
  \ `createList()` 函数。这是通过以下行实现的：\n\n```\nfunction bindButtonClick() {\n    $(\"#btnSubmitListName\"\
  ).on(\"click\", function () {\n        var listName = $(\"#txtListName\").val();\n\
  \        createList(listName);\n    });\n}\n```\n\n`createList()` 函数接收一个名为 `listName`\
  \ 的变量，即用户在页面上输入的文本。接下来，我们使用以下代码构建 REST 调用的 URL：\n\n```\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  var fullUrl = siteUrl + \"/_api/web/lists\";\n```\n\n你会注意到，这与上一个示例中的 URL 相同，因为我们针对的是\
  \ Web 中的列表集合。然而，AJAX 看起来则大不相同：\n\n```\n$.ajax({\n    url: fullUrl,\n    type: \"\
  POST\",\n    data: JSON.stringify({\n        '__metadata': { 'type': 'SP.List' },\n\
  \        'BaseTemplate': 100,\n        'Title': listName\n    }),\n    headers:\
  \ {\n        \"accept\": \"application/json;odata=verbose\",\n        \"content-type\"\
  : \"application/json;odata=verbose\",\n        \"X-RequestDigest\": $(\"#__REQUESTDIGEST\"\
  ).val()\n    },\n    success: onQuerySucceeded,\n    error: onQueryFailed\n});\n\
  ```\n\n与上一个示例一样，我们将 `fullUrl` 变量作为要调用的 URL 传递，而现在的类型是 `POST`。由于在此示例中我们要创建一个新列表，因此使用\
  \ `POST` 来向 SharePoint 指示这是一个创建操作。接下来，我们使用以下行传递新列表的数据：\n\n```\ndata: JSON.stringify({\n\
  \    '__metadata': { 'type': 'SP.List' },\n    'BaseTemplate': 100,\n    'Title':\
  \ listName\n})\n```\n\n当我们使用 REST API 执行除 `GET` 之外的任何类型的操作时，我们都在向 SharePoint 传递数据。这些数据采用\
  \ JSON 格式。`JSON.stringify` 方法是一种标准的 JavaScript 方法，用于将 JavaScript 数据结构转换为 JSON 文本。这有助于确保我们传递给\
  \ SharePoint 的数据采用正确的格式。我们首先要做的是将“type”设置为 `SP.List`，并将 `BaseTemplate` 设置为 `100`，这是一个通用列表。最后，我们传递\
  \ `listName` 变量作为标题。接下来，我们添加标头，并包含一个名为 `X-RequestDigest` 的新标头：\n\n```\n\"X-RequestDigest\"\
  : $(\"#__REQUESTDIGEST\").val()\n```\n\n此标头允许我们传递页面上表单摘要控件的值。此控件在 SharePoint 中用作安全措施，以确保\
  \ `POST` 请求确实来自有效的 SharePoint 页面。你无需了解此控件的所有细节，只需知道可以使用 jQuery 行 `$(\"#__REQUESTDIGEST\"\
  ).val()` 获取其值即可。标头设置好后，我们指定成功和失败函数。`success` 函数仅显示列表名称以及一条成功消息：\n\n```\nfunction\
  \ onQuerySucceeded(data) {\n    $(\"#divGetListData\").html(data.d.Title + \" 创建成功！\"\
  );\n}\n```\n\n此函数接收一个名为 `data` 的参数。此变量将填充刚刚创建的列表中的数据。此变量的命名没有什么特别之处；我们可以将其命名为 `list`\
  \ 或 `myCoolData`。如果愿意，你甚至可以不指定参数，只显示一条成功消息！\n\n\n\n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为该\
  \ HTML 文件，然后保存页面。页面现在将显示文本框和按钮，供用户输入新的列表名称。输入 `My Custom REST List`，然后单击“提交”按钮。结果将显示成功消息，如图\
  \ 9-3 所示。\n\n![A978-1-4842-0544-0_9_Fig3_HTML.jpg](img/A978-1-4842-0544-0_9_Fig3_HTML.jpg)\n\
  \n*图 9-3. 运行后的创建新列表代码*\n\n由于这一切都是使用 JavaScript 和 AJAX 完成的，列表将会被创建，并且用户会按预期收到通知。但是，页面左侧的导航不会更新，因为页面尚未刷新。你完全可以修改这段代码，使其在成功时刷新页面，但在此示例中，我们只需在浏览器中手动刷新页面。图\
  \ 9-4 显示了刷新后的页面，其中新列表显示在左侧导航中。\n\n![A978-1-4842-0544-0_9_Fig4_HTML.jpg](img/A978-1-4842-0544-0_9_Fig4_HTML.jpg)\n\
  \n*图 9-4. 新列表显示在左侧导航窗格中*\n\n### 删除列表\n\n在此示例中，我们将简单地删除刚刚创建的列表。\n\n#### HTML\n\n\
  在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为 `RESTDeleteList.html`。此示例的 HTML 代码与前一个示例几乎相同。它包含以下代码行：\n\
  \n```\n<script type=\"text/javascript\" src=\"/apress/webparts/chapter 9/RESTDeleteList.js\"\
  ></script>\n<div>\n    <strong>输入要删除的列表名称：</strong>\n    <input type=\"text\" id=\"\
  txtListName\" />\n    <input type=\"button\" id=\"btnSubmitListName\" value=\"提交\"\
  \ />\n</div>\n<div id=\"divDeleteListResults\"></div>\n```\n\n这里唯一的区别是，我们更新了页面上的文本，以指示此\
  \ Web 部件将删除一个列表，并将结果显示的 DIV 的 ID 更改为 `divDeleteListResults`。\n\n#### JavaScript\n\
  \n在 Visual Studio 中创建一个新的 JavaScript 文件，并将其命名为 `RESTDeleteList.js`。该 JavaScript\
  \ 文件包含以下代码行：\n\n```\n$(function () {\n    bindButtonClick();\n});\n\nfunction bindButtonClick()\
  \ {\n    $(\"#btnSubmitListName\").on(\"click\", function () {\n        var listName\
  \ = $(\"#txtListName\").val();\n        deleteList(listName);\n    });\n}\n\nfunction\
  \ deleteList(listName) {\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \    var fullUrl = siteUrl + \"/_api/web/lists/GetByTitle('\" + listName + \"')\"\
  ;\n    $.ajax({\n        url: fullUrl,\n        type: \"POST\",\n        headers:\
  \ {\n            \"accept\": \"application/json;odata=verbose\",\n            \"\
  content-type\": \"application/json;odata=verbose\",\n            \"X-RequestDigest\"\
  : $(\"#__REQUESTDIGEST\").val(),\n            \"X-HTTP-Method\": \"DELETE\",\n \
  \           \"IF-MATCH\": \"*\"\n        },\n        success: onQuerySucceeded,\n\
  \        error: onQueryFailed\n    });\n}\n\nfunction onQuerySucceeded() {\n   \
  \ $(\"#divDeleteListResults\").html(\"列表已成功删除！\");\n}\n\nfunction onQueryFailed(sender,\
  \ args) {\n    alert('错误！');\n}\n```\n\njQuery 按钮绑定与前一个示例相同。接下来，我们需要构建 REST 调用的\
  \ URL，这次是请求一个特定的列表：\n\n```\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\nvar\
  \ fullUrl = siteUrl + \"/_api/web/lists/GetByTitle('\" + listName + \"')\";\n```\n\
  \n此 URL 添加了额外的 `GetByTitle` 命令，并传入我们要查找的列表名称。最终的 URL 如下所示：\n\n```\nhttp://<DOMAIN>/<SITE>/_api/web/lists/GetByTitle('<LISTNAME>')\n\
  ```\n\n接下来，我们需要添加几个额外的标头：\n\n```\n\"X-HTTP-Method\": \"DELETE\",\n\"IF-MATCH\":\
  \ \"*\"\n```\n\n你会注意到，请求类型是 `POST`，就像我们创建新列表时一样。但是，这里我们想发起一个“删除”请求，因此需要包含 `X-HTTP-Method`\
  \ 标头，以告知 SharePoint 我们要删除该列表，而不是对其执行其他操作。接下来，我们包含 `IF-MATCH` 标头。使用 REST 进行更新和删除操作时需要此标头。此标头有助于防止并发更新。例如，如果你尝试更新一个列表项，可以传入一个\
  \ `etag` 属性，如下所示：\n\n```\n\"If-Match\": data.d.__metadata.etag\n```\n\n在此标头中传递 `*`\
  \ 基本上是在告诉 SharePoint 不必担心并发问题，直接执行更新即可。在此示例中，我们正在删除列表，因此无需担心这个检查。`success` 函数仅通知用户删除已成功。\n\
  \n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为该 HTML 文件，然后保存页面。页面现在将显示文本框和按钮，供用户输入要删除的列表名称。输入\
  \ `My Custom REST List`，然后单击“提交”按钮。结果将显示成功消息，如图 9-5 所示。\n\n![A978-1-4842-0544-0_9_Fig5_HTML.jpg](img/A978-1-4842-0544-0_9_Fig5_HTML.jpg)\n\
  \n*图 9-5. 成功运行后的删除列表代码*\n\n由于这一切都是使用 JavaScript 和 AJAX 完成的，列表将会被删除，并且用户会按预期收到通知。但是，页面左侧的导航不会更新，因为页面尚未刷新。与之前一样，你可以修改这段代码，使其在成功时刷新页面，但在此示例中，我们只需在浏览器中手动刷新页面。图\
  \ 9-6 显示了刷新后的页面，此时该列表已不再显示在左侧导航中。\n\n![A978-1-4842-0544-0_9_Fig6_HTML.jpg](img/A978-1-4842-0544-0_9_Fig6_HTML.jpg)\n\
  \n*图 9-6. 已删除的列表已从左侧导航中移除*\n\n## 处理列表项\n\n由于处理列表是 SharePoint 开发中非常常见的任务，因此处理列表项更为常见。在本节中，我们将探讨一些使用\
  \ REST API 与列表项交互的方法。\n\n### 获取列表项\n\n此示例将向你展示如何使用 REST 检索列表项。\n\n#### HTML\n\n\
  在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为 `RESTGetListItems.html`。此示例的 HTML 代码延续了前几个示例的极简模式。它包含以下代码行：\n\
  \n```\n<script type=\"text/javascript\" src=\"/apress/webparts/chapter 9/RESTGetListItems.js\"\
  ></script>\n<div id=\"divListItems\"></div>\n```\n\n在此示例中，我们将简单地获取演示列表中的所有列表项，并将其显示在页面上的\
  \ `divListItems` DIV 中。\n\n\n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript\
  \ 文件，并将其命名为 `RESTGetListItems.js`。用于检索列表项的脚本与我们目前看到的其他脚本非常相似。它由以下几行代码组成：\n\n```\n\
  $(function () {\n    retrieveListItems();\n});\n\nfunction retrieveListItems() {\n\
  \    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n    var fullUrl = siteUrl\
  \ + \"/_api/web/lists/GetByTitle('Demo List')/items\";\n    $.ajax({\n        url:\
  \ fullUrl,\n        type: \"GET\",\n        headers: {\n            \"accept\":\
  \ \"application/json;odata=verbose\",\n            \"content-type\": \"application/json;odata=verbose\"\
  ,\n        },\n        success: onQuerySucceeded,\n        error: onQueryFailed\n\
  \    });\n}\n\nfunction onQuerySucceeded(data) {\n    var listItemInfo = '';\n \
  \   $.each(data.d.results, function (key, value) {\n        listItemInfo += '<strong>ID:\
  \ </strong> ' + value.Id +\n            ' <strong>Title:</strong> ' + value.Title\
  \ +\n            '<br />';\n    });\n    $(\"#divListItems\").html(listItemInfo);\n\
  }\n\nfunction onQueryFailed(sender, args) {\n    alert('Error!');\n}\n```\n\n用于获取列表项的\
  \ REST 调用 URL，现在看起来应该非常熟悉：\n\n```\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  var fullUrl = siteUrl + \"/_api/web/lists/GetByTitle('Demo List')/items\";\n```\n\
  \n与删除 URL 类似，我们使用 `GetByTitle` 命令获取列表的标题，然后添加 `items` 命令，该命令指示 SharePoint 返回列表中的所有项。AJAX\
  \ 调用是一个简单的 `GET` 请求，其中包含了我们熟悉的 JSON 标头。`success` 函数使用 jQuery 遍历结果：\n\n```\n$.each(data.d.results,\
  \ function (key, value) {\n    listItemInfo += '<strong>ID: </strong> ' + value.Id\
  \ +\n        ' <strong>Title:</strong> ' + value.Title +\n        '<br />';\n});\n\
  ```\n\n就像访问网站中的列表时一样，我们使用 `data.d.results` 集合来访问查询结果。在 jQuery 的 `each` 循环中，我们提取每个列表项的\
  \ ID 和 Title，并将这些结果显示在页面上。\n\n### 结果\n\n将内容编辑器 Web 部件的 `Content Link` 属性设置为该 HTML\
  \ 文件，然后保存页面。该页面现在将显示 Demo List 中的所有项目，如图 9-7 所示。\n\n![A978-1-4842-0544-0_9_Fig7_HTML.jpg](img/A978-1-4842-0544-0_9_Fig7_HTML.jpg)\n\
  \n**图 9-7.** 在内容编辑器 Web 部件中显示的 Demo List 列表项\n\n### 使用查询运算符限制结果\n\n在前一章中，我们讨论过在大多数情况下，你不应请求列表中的所有项；无论是使用\
  \ JSOM 还是 REST，这都不是一个好主意。我们看到了如何使用 CAML 查询在 JSOM 中限制结果。使用 REST API 时，你可以使用查询运算符来限制返回的结果。查询运算符本质上是在\
  \ AJAX 调用中附加到 REST URL 末尾的查询字符串参数。\n\n#### JavaScript\n\n更新上一个示例中的 `RESTGetListItems.js`，并用以下代码行更新声明\
  \ REST URL 的部分：\n\n```\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\nvar fullUrl\
  \ = siteUrl + \"/_api/web/lists/GetByTitle('Demo List')/items?$filter=Id ge 4\"\
  ;\n```\n\n此处唯一的添加项是在 URL 的末尾，带有以下查询字符串：`$filter=Id ge 4`。我们使用了 `filter` 运算符来过滤结果。我们指定要过滤\
  \ ID 大于或等于 (`ge`) 4 的项。这是一个非常简单的添加，但它是对查询运算符的一个很好的介绍。\n\n**注意：** 查询运算符是一个庞大的主题——本书无法详尽涵盖。这些运算符允许你进行选择、过滤、排序、排序等操作。你甚至可以通过使用这些运算符，告诉\
  \ SharePoint 仅返回关于 SharePoint 中项目的特定数据。有关使用查询运算符的更深入信息，请访问 [`msdn.microsoft.com/en-us/library/office/fp142385%28v=office.15%29.aspx`](http://msdn.microsoft.com/en-us/library/office/fp142385%28v=office.15%29.aspx)。\n\
  \n### 结果\n\n更新 JavaScript 文件并上传，覆盖之前的版本。刷新包含内容编辑器 Web 部件的页面，你将看到结果现在只显示 ID 大于或等于\
  \ 4 的项，如图 9-8 所示。\n\n![A978-1-4842-0544-0_9_Fig8_HTML.jpg](img/A978-1-4842-0544-0_9_Fig8_HTML.jpg)\n\
  \n**图 9-8.** 由查询运算符限制的 Demo List 查询结果\n\n## 添加列表项\n\n在这个示例中，我们将探讨如何向列表中添加新的列表项。\n\
  \n#### HTML\n\n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为 `RESTAddListItems.html`。此页面的标记将允许用户向\
  \ Demo List 添加一个项目，提供 Title 和 Description。它由以下代码行组成：\n\n```\n<script type=\"text/javascript\"\
  \ src=\"/apress/Webparts/chapter 9/RESTAddListItems.js\"></script>\n<div id=\"AddListData\"\
  >\n    <div>\n        Title:\n        <br />\n        <input type=\"text\" id=\"\
  txtTitle\" />\n    </div>\n    <div>\n        Description:\n        <br />\n   \
  \     <textarea cols=\"20\" id=\"txtDesc\"></textarea>\n    </div>\n    <br />\n\
  \    <div>\n        <input id=\"btnSubmit\" type=\"button\" value=\"Submit\" />\n\
  \    </div>\n</div>\n<div id=\"divResult\"></div>\n```\n\n我们为列表项的 Title 提供了一个类型为\
  \ `TEXT` 的 `INPUT`，并为 Description 提供了一个 `TEXTAREA`。页面上的每个元素都有一个 ID，因此我们可以轻松地使用 jQuery\
  \ 定位它。\n\n\n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript 文件，并将其命名为 `RESTADDListItems.js`。用于添加列表项的脚本与创建新列表的脚本类似。它包含以下几行代码：\n\
  \n```javascript\n$(function () {\n    bindButtonClick();\n});\n\nfunction bindButtonClick()\
  \ {\n    $(\"#btnSubmit\").on(\"click\", function () {\n        addListItem();\n\
  \    });\n}\n\nfunction addListItem() {\n    var title = $(\"#txtTitle\").val();\n\
  \    var desc = $(\"#txtDesc\").val();\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \    var fullUrl = siteUrl + \"/_api/web/lists/GetByTitle('Demo List')/items\";\n\
  \    $.ajax({\n        url: fullUrl,\n        type: \"POST\",\n        data: JSON.stringify({\n\
  \            '__metadata': { 'type': 'SP.Data.Demo_x0020_ListListItem' },\n    \
  \        'Title': title,\n            'Description': desc,\n            'Status':'On-time'\n\
  \        }),\n        headers: {\n            \"accept\": \"application/json;odata=verbose\"\
  ,\n            \"content-type\": \"application/json;odata=verbose\",\n         \
  \   \"X-RequestDigest\": $(\"#__REQUESTDIGEST\").val()\n        },\n        success:\
  \ onQuerySucceeded,\n        error: onQueryFailed\n    });\n}\n\nfunction onQuerySucceeded(sender,\
  \ args) {\n    $(\"#divResult\").html(\"Item successfully added!\");\n}\n\nfunction\
  \ onQueryFailed() {\n    alert('Error!');\n}\n```\n\n通过 jQuery 绑定按钮点击事件后，我们在点击事件中首先获取用户提供的值。这通过以下代码实现：\n\
  \n```javascript\nvar title = $(\"#txtTitle\").val();\nvar desc = $(\"#txtDesc\"\
  ).val();\n```\n\n接下来，我们构建 REST URL，目标是 `Demo List` 及其列表中的列表项：\n\n```javascript\n\
  var siteUrl = _spPageContextInfo.webAbsoluteUrl;\nvar fullUrl = siteUrl + \"/_api/web/lists/GetByTitle('Demo\
  \ List')/items\";\n```\n\n然后，我们创建一个 jQuery AJAX `POST` 调用，传入新列表项的数据：\n\n```javascript\n\
  data: JSON.stringify({\n    '__metadata': { 'type': 'SP.Data.Demo_x0020_ListListItem'\
  \ },\n    'Title': title,\n    'Description': desc,\n    'Status':'On-time'\n})\n\
  ```\n\n这段代码与本章前面看到的“创建列表”代码非常相似。我们首先要指定所创建项的类型；在本例中，类型是 `SP.Data.Demo_x0020_ListListItem`。项的类型始终包含其所属列表的名称，并遵循以下模式：\n\
  \n`SP.Data.<列表名称>ListItem`\n\n在此示例中，由于我们的列表名为 `Demo List`，因此我们必须包含 `_x0020_`，SharePoint\
  \ 使用它来表示空格。对于 `Title` 和 `Description`，我们只需传入之前获取的值。对于 `Status` 列，我们直接硬编码值为 `On-time`。由于我们执行的是\
  \ `POST` 操作，因此需要包含 `X-RequestDigest` 标头。`success` 函数将向用户显示一条消息，告知项目已添加到列表中。\n\n\
  ### 结果\n\n将内容编辑器 Web 部件的 `Content Link` 属性设置为该 HTML 文件，然后保存页面。页面将显示文本框，供用户输入详细信息。当添加项目时，页面会显示一条成功消息，如图\
  \ 9-9 所示。\n\n![A978-1-4842-0544-0_9_Fig9_HTML.jpg](img/A978-1-4842-0544-0_9_Fig9_HTML.jpg)\n\
  \n**图 9-9.** 向 Demo List 添加新项目\n\n然后，我们可以导航到 Demo List 以确认新项目已添加。图 9-10 显示了已添加新列表项并包含\
  \ HTML 页面提供值的 Demo List。\n\n![A978-1-4842-0544-0_9_Fig10_HTML.jpg](img/A978-1-4842-0544-0_9_Fig10_HTML.jpg)\n\
  \n**图 9-10.** 向 Demo List 添加的新列表项\n\n### 删除列表项\n\n在此示例中，我们将简单地删除上一节中创建的新列表项。\n\n\
  #### HTML\n\n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为 `RESTDeleteListItems.html`。此文件的\
  \ HTML 内容将更简洁，因为我们只需要从用户那里获取他们要删除的列表项对应的 ID。这通过以下代码实现：\n\n```html\n<script type=\"\
  text/javascript\" src=\"/apress/Webparts/chapter 9/RESTDeleteListItems.js\"></script>\n\
  <div>\n    Enter ID to Delete: <input type=\"text\" id=\"txtId\" />\n</div>\n<div>\n\
  \    <input id=\"btnSubmit\" type=\"button\" value=\"Submit\" />\n</div>\n<div id=\"\
  divResult\"></div>\n```\n\n这个示例过于简化，因为用户通常不太可能知道要删除的特定列表项的 ID。更实际的示例通常会向用户显示一个项目列表，并允许他们点击某个项目将其删除。在这种场景下，页面上会有列表项的\
  \ ID，您可以轻松访问它们。为了简化示例，我们将只使用一个简单的文本框。\n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的\
  \ JavaScript 文件，并将其命名为 `RESTDeleteListItems.js`。包含以下代码：\n\n```javascript\n$(function\
  \ () {\n    bindButtonClick();\n});\n\nfunction bindButtonClick() {\n    $(\"#btnSubmit\"\
  ).on(\"click\", function () {\n        deleteListItem();\n    });\n}\n\nfunction\
  \ deleteListItem() {\n    var id = $(\"#txtId\").val();\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \    var fullUrl = siteUrl + \"/_api/web/lists/GetByTitle('Demo List')/items(\"\
  \ + id + \")\";\n    $.ajax({\n        url: fullUrl,\n        type: \"POST\",\n\
  \        headers: {\n            \"accept\": \"application/json;odata=verbose\"\
  ,\n            \"content-type\": \"application/json;odata=verbose\",\n         \
  \   \"X-RequestDigest\": $(\"#__REQUESTDIGEST\").val(),\n            \"X-HTTP-Method\"\
  : \"DELETE\",\n            \"IF-MATCH\": \"*\"\n        },\n        success: onQuerySucceeded,\n\
  \        error: onQueryFailed\n    });\n}\n\nfunction onQuerySucceeded(sender, args)\
  \ {\n    $(\"#divResult\").html(\"Item successfully deleted!\");\n}\n\nfunction\
  \ onQueryFailed() {\n    alert('Error!');\n}\n```\n\n`deleteListItem()` 函数将在页面上的按钮点击事件中被调用。我们首先获取用户在页面上输入的\
  \ ID。这通过以下代码实现：\n\n```javascript\nvar id = $(\"#txtId\").val();\n```\n\n接下来，我们构建\
  \ REST URL，通过 ID 定位到特定的列表项：\n\n```javascript\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  var fullUrl = siteUrl + \"/_api/web/lists/GetByTitle('Demo List')/items(\" + id\
  \ + \")\";\n```\n\n您可以通过在 URL 末尾的括号中包含其 ID 来请求或定位单个列表项。完整的 URL 如下所示：\n\n`http://<DOMAIN>/<SITE>/_api/web/lists/GetByTitle('<列表名称>')/items(<ID>)`\n\
  \n与之前删除列表时一样，我们在发出 AJAX 调用时包含 `\"X-HTTP-Method\": \"DELETE\"` 和 `\"IF-MATCH\": \"\
  *\"` 标头。`success` 方法将向用户显示一条消息，告知删除操作已完成。\n\n### 结果\n\n将内容编辑器 Web 部件的 `Content Link`\
  \ 属性设置为该 HTML 文件，然后保存页面。页面将显示文本框供用户输入 ID，并在删除项目后显示一条成功消息，如图 9-11 所示。\n\n![A978-1-4842-0544-0_9_Fig11_HTML.jpg](img/A978-1-4842-0544-0_9_Fig11_HTML.jpg)\n\
  \n**图 9-11.** 使用 REST 删除列表项\n\n## 处理文档库\n\nSharePoint 的主要优势之一在于文档管理及其文档库。您肯定会遇到需要通过代码处理文档库的需求。在本节中，我们将介绍一些使用\
  \ REST API 与文档库交互的方法。\n\n### 创建新文件夹\n\n文件夹是 SharePoint 用户喜欢创建的东西，在本示例中，我们将了解如何通过代码创建文件夹。\n\
  \n\n\n#### HTML\n\n在 Visual Studio 中新建一个 HTML 文件，并将其命名为 `RESTCreateFolder.html`。此页面的标记非常简单，允许用户输入要创建的文件夹名称。它包含以下代码：\n\
  \n```html\n<script type=\"text/javascript\" src=\"/apress/Webparts/chapter 9/RESTCreateFolder.js\"\
  ></script>\n<div>\n    <strong>输入文件夹名称：</strong>\n    <input type=\"text\" id=\"\
  txtFolderName\" />\n    <input type=\"button\" id=\"btnSubmit\" value=\"提交\" />\n\
  </div>\n<div id=\"divResults\"></div>\n```\n\n#### JavaScript\n\n在 Visual Studio\
  \ 中新建一个 JavaScript 文件，并将其命名为 `RESTCreateFolder.js`。包含以下代码：\n\n```javascript\n$(function\
  \ () {\n    bindButtonClick();\n});\n\nfunction bindButtonClick() {\n    $(\"#btnSubmit\"\
  ).on(\"click\", function () {\n        createFolder();\n    });\n}\n\nfunction createFolder()\
  \ {\n    var folderName = $(\"#txtFolderName\").val();\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \    var fullUrl = siteUrl + \"/_api/web/folders\";\n\n    $.ajax({\n        url:\
  \ fullUrl,\n        type: \"POST\",\n        data: JSON.stringify({\n          \
  \  '__metadata': { 'type': 'SP.Folder' },\n            'ServerRelativeUrl': 'Shared\
  \ Documents/' + folderName\n        }),\n        headers: {\n            \"accept\"\
  : \"application/json;odata=verbose\",\n            \"content-type\": \"application/json;odata=verbose\"\
  ,\n            \"X-RequestDigest\": $(\"#__REQUESTDIGEST\").val()\n        },\n\
  \        success: onQuerySucceeded,\n        error: onQueryFailed\n    });\n}\n\n\
  function onQuerySucceeded() {\n    $(\"#divResults\").html(\"文件夹创建成功！\");\n}\n\n\
  function onQueryFailed() {\n    alert('错误！');\n}\n```\n\n使用 jQuery 绑定按钮单击事件后，`createFolder()`\
  \ 函数首先获取用户在页面上输入的文件夹名称：\n\n```javascript\nvar folderName = $(\"#txtFolderName\"\
  ).val();\n```\n\n接下来，我们创建 REST URL，但这次的目标是网站的文件夹集合：\n\n```javascript\nvar siteUrl\
  \ = _spPageContextInfo.webAbsoluteUrl;\nvar fullUrl = siteUrl + \"/_api/web/folders\"\
  ;\n```\n\n这与我们之前看到的常见模式有所不同，因为我们请求的 URL 并非专门用于创建文件夹的位置。我们在 `data` 属性中指定文件夹应存放的位置：\n\
  \n```javascript\ndata: JSON.stringify({\n    '__metadata': { 'type': 'SP.Folder'\
  \ },\n    'ServerRelativeUrl': 'Shared Documents/' + folderName\n})\n```\n\n`ServerRelativeUrl`\
  \ 属性用于告知 SharePoint 应在何处创建文件夹。在此示例中，我们将在“Shared Documents”文件夹中创建它，并追加用户在页面上输入的文件夹名称。与前面的示例一样，我们为项目指定了一个\
  \ `type`，此处为 `SP.Folder`。我们包含常见的请求头，并在 `success` 方法中通知用户文件夹已创建。\n\n### 结果\n\n将内容编辑器\
  \ Web 部件的“内容链接”属性设置为该 HTML 文件，然后保存页面。页面将显示一个文本框，供用户输入要创建的文件夹名称，完成后将显示成功消息，如图 9-12\
  \ 所示。\n\n![A978-1-4842-0544-0_9_Fig12_HTML.jpg](img/A978-1-4842-0544-0_9_Fig12_HTML.jpg)\n\
  \n**图 9-12.** 使用 REST 创建新文件夹\n\n然后，我们可以导航到文档库以直观地验证新文件夹是否已创建，如图 9-13 所示。\n\n![A978-1-4842-0544-0_9_Fig13_HTML.jpg](img/A978-1-4842-0544-0_9_Fig13_HTML.jpg)\n\
  \n**图 9-13.** 通过 REST 创建的新文件夹\n\n## 操作文件\n\n在自定义解决方案中，有时需要操作文件。在本节中，我们将了解如何使用 REST\
  \ 创建、读取和删除文本文件。\n\n### 创建新文件\n\n在此示例中，我们将了解如何通过代码创建新的文本文件。\n\n#### HTML\n\n在 Visual\
  \ Studio 中新建一个 HTML 文件，并将其命名为 `RESTCreateDocument.html`。此页面的标记将允许用户输入新文本文件的名称以及文件本身的内容。它包含以下代码：\n\
  \n```html\n<script type=\"text/javascript\" src=\"/apress/Webparts/chapter 9/RESTCreateDocument.js\"\
  ></script>\n<div id=\"CreateFile\">\n    <div>\n        <strong>输入文档标题：</strong>\n\
  \        <br />\n        <input type=\"text\" id=\"txtDocumentTitle\" />\n    </div>\n\
  \    <div>\n        <strong>输入文档内容：</strong>\n        <br />\n        <textarea\
  \ cols=\"20\" id=\"txtDocumentContent\"></textarea>\n    </div>\n    <br />\n  \
  \  <input type=\"button\" id=\"btnSubmit\" value=\"提交\" />\n</div>\n<div id=\"divResults\"\
  ></div>\n```\n\n\n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript 文件，并将其命名为\
  \ `RESTCreateDocument.js`。包含以下代码：\n\n```javascript\n$(function () {\n\n    bindButtonClick();\n\
  \n});\n\nfunction bindButtonClick() {\n\n    $(\"#btnSubmit\").on(\"click\", function\
  \ () {\n\n        createDocument();\n\n    });\n\n}\n\nfunction createDocument()\
  \ {\n\n    var docTitle = $(\"#txtDocumentTitle\").val() + \".txt\";\n\n    var\
  \ docContent = $(\"#txtDocumentContent\").val();\n\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \n    var fullUrl = siteUrl + \"/_api/web/GetFolderByServerRelativeUrl('Shared Documents')/Files/add(url='\"\
  \ + docTitle + \"',overwrite=true)\";\n\n    $.ajax({\n\n        url: fullUrl,\n\
  \n        type: \"POST\",\n\n        data: docContent,\n\n        headers: {\n\n\
  \            \"accept\": \"application/json;odata=verbose\",\n\n            \"content-type\"\
  : \"application/json;odata=verbose\",\n\n            \"X-RequestDigest\": $(\"#__REQUESTDIGEST\"\
  ).val()\n\n        },\n\n        success: onQuerySucceeded,\n\n        error: onQueryFailed\n\
  \n    });\n\n}\n\nfunction onQuerySucceeded() {\n\n    $(\"#divResults\").html(\"\
  Document successfully created!\");\n\n}\n\nfunction onQueryFailed() {\n\n    alert('Error!');\n\
  \n}\n```\n\n首先，我们需要获取用户在页面上输入的文档标题和内容。这通过以下代码行实现：\n\n```javascript\nvar docTitle\
  \ = $(\"#txtDocumentTitle\").val() + \".txt\";\nvar docContent = $(\"#txtDocumentContent\"\
  ).val();\n```\n\n注意，我们在文档标题末尾附加了`.txt`。这将让 SharePoint 知道我们打算创建一个文本文件，因为它会根据名称中的扩展名来确定文件类型。接下来，我们构建\
  \ REST URL：\n\n```javascript\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  var fullUrl = siteUrl + \"/_api/web/GetFolderByServerRelativeUrl('Shared Documents')/Files/add(url='\"\
  \ + docTitle + \"',overwrite=true)\";\n```\n\n这是迄今为止我们构建过的最复杂的 REST URL。为了引用要创建文件的文件夹，我们需要包含\
  \ `GetFolderByServerRelativeUrl` 命令，并传入文件夹名称；在本例中为 `Shared Documents`。然后，我们定位文件夹中的\
  \ Files 集合，并使用 `add` 命令来实际创建文件。我们可以为文件传入属性；在本例中，传入了 URL 和覆盖标志。文件内容通过 AJAX 调用中的 `data`\
  \ 属性传入：\n\n```javascript\n$.ajax({\n\n        url: fullUrl,\n\n        type: \"\
  POST\",\n\n        data: docContent,\n\n        headers: {\n\n            \"accept\"\
  : \"application/json;odata=verbose\",\n\n            \"content-type\": \"application/json;odata=verbose\"\
  ,\n\n            \"X-RequestDigest\": $(\"#__REQUESTDIGEST\").val()\n\n        }\n\
  ```\n\n`success` 函数会向用户显示一条消息，告知文件已创建。\n\n**注意**\n\n在本示例中，我们创建了一个简单的文本文件。在大多数实际场景中，文本文件并不是预期结果，而可能是\
  \ Word 文件或 Excel 文件。你完全可以修改此示例以生成 Word 文档，只需将 `.txt` 改为 `.docx` 即可。这个简单的更改实际上会创建一个包含其中内容的新\
  \ Word 文档。但是，它只能在客户端机器上的 Word 中打开，而不能在 Office Web Apps 中打开。幸运的是，Microsoft 提供了 Office\
  \ JavaScript 文件，允许你在浏览器中创建和操作 Office 文件。更多信息请访问 [`http://msdn.microsoft.com/en-us/library/office/fp160953%28v=office.15%29.aspx`](http://msdn.microsoft.com/en-us/library/office/fp160953%28v=office.15%29.aspx)。\n\
  \n### 结果\n\n将内容编辑器 Web 部件的内容链接属性设置为该 HTML 文件，然后保存页面。页面将显示文本框，供用户输入文档标题和内容，然后在新文档创建成功后显示成功消息，如图\
