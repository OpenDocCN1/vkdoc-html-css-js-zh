  让我们逐节分解这个文件，以了解其中的内容。首先，继续保存文件并将其命名为 `Item_CustomPdf.html`。文件顶部是标准的 HTML 和 `HEAD`
  标签；这些标签没什么特别的。`TITLE` 标签很重要，因为它将显示在内容搜索 Web 部件中选择项目模板时的下拉列表中。将标题更改为“自定义 PDF 模板”。


  ```

  <html >

  <head>

  <title>自定义 PDF 模板</title>

  ```


  下一部分是在名为 `CustomDocumentProperties` 的部分中的一组属性。这些属性向 SharePoint 提供了关于显示模板的额外信息。其中一些属性会自动为您填充，而其他一些则需要您更新。以下是一些比较重要的属性：


  - `ManagedPropertyMapping` - 此属性获取搜索使用的托管属性，并将它们映射到显示模板可以使用的值。

  - `MasterPageDescription` - 此属性为显示模板提供友好的描述，并向用户显示。

  - `TargetControlType` - 此属性指定使用显示模板的上下文；例如，内容 Web 部件。


  `ManagedPropertyMapping` 属性允许您在搜索中使用托管属性，并将它们映射到显示模板可以使用的值。它是一个逗号分隔的值列表，使用以下格式：


  ```

  ''属性显示名称''{属性名称}:''托管属性''

  ```


  例如，在此显示模板的 `ManagedPropertyMapping` 中，您会找到以下内容：`''Link URL''{Link URL}:''Path''`。这将托管属性
  `Path` 映射到一个名为 `Link URL` 的变量。`ManagedPropertyMapping` 映射了多个托管属性：


  ```

  <mso:ManagedPropertyMapping msdt:dt="string">''图片 URL''{Picture URL}:''PublishingImage;PictureURL;PictureThumbnailURL'',''链接
  URL''{Link URL}:''Path'',''第 1 行''{Line 1}:''Title'',''第 2 行''{Line 2}:''Description'',''第
  3 行''{Line 3}:'''',''SecondaryFileExtension'',''ContentTypeId''</mso:ManagedPropertyMapping>

  ```


  属性映射后，您可以使用以下 JavaScript 获取其值：


  ```

  var linkURL = $getItemValue(ctx, "Link URL");

  ```




  `getItemValue()`函数接受两个参数。第一个参数是`ctx`，代表当前上下文。你会注意到它没有在任何地方定义，但它可以直接使用。你只需要记住必须传入此参数，并且它始终可用。第二个参数是属性显示名称，需要用单引号括起来，用于`ManagedPropertyMapping`元素。在本例中，`Link
  URL`是属性名称。


  我们唯一需要更新的另一个属性是`MasterPageDescription`属性，只是为了更新描述，使其不产生混淆。


  ```

  <mso:MasterPageDescription msdt:dt="string">This Item Display Template will display
  custom PDF results.</mso:MasterPageDescription>

  ```


  在`<body>`标签之后，你会看到一个`<script>`部分：


  ```

  <script>


  $includeLanguageScript(this.url, "∼sitecollection/_catalogs/masterpage/Display Templates/Language
  Files/{Locale}/CustomStrings.js");


  </script>

  ```


  在此部分中，你可以添加自己的脚本或 CSS 引用。默认情况下，它包含对所有显示模板中都存在的`CustomStrings.js`文件的引用。你可以使用以下一些行来添加额外的引用：


  *   位于同一站点中的脚本：`$includeScript(this.url, "∼site/Webparts/CustomScript.js");`

  *   位于外部站点上的脚本：`$includeScript(this.url, "http://www.contoso.com/CustomScript.js");`

  *   位于同一站点中的 CSS 文件：`$includeCSS(this.url, "∼site/Webparts/CustomCSS.css");`


  紧跟在`<script>`标签之后，你会找到一个`<div>`元素，它包含显示模板中所有 HTML 和代码。这个 DIV 有一个必须与显示模板文件名匹配的 ID。例如，本例中的
  DIV 看起来像下面这样：


  ```

  <div id="Item_CustomPdf">

  ```


  在 DIV 元素之后，你会看到注释块中的代码，这些代码以`<!--#_`开头，以`_#-->`结尾。在此块内，你可以使用任何你想要的 JavaScript 代码，并且你将在此处获取所有托管属性的值。我们将保持此显示模板简单，仅使用两个托管属性，代码如下：


  ```

  <!--#_


  var linkURL = $getItemValue(ctx, "Link URL");


  var line1 = $getItemValue(ctx, "Line 1");


  _#-->

  ```


  如你所见，我们简单地声明了两个变量来保存`ManagedPropertyMapping`中定义的托管属性的值。我们将在 HTML 代码中使用这两个变量。我们也将保持
  HTML 简单，代码如下：


  ```

  <div style="border:solid 1px Silver;padding:10px;margin-bottom:20px;">


  <strong>_#= line1 =#_</strong>


  <br />


  <a href="_#= linkURL =#_">


  _#= linkURL =#_


  </a>


  </div>

  ```


  在这段代码中，我们简单地用一个 DIV 包裹所有内容。我们通过内联 CSS 应用了简单的边框和内边距。接下来，我们将使用以下语法显示`line1`变量：`_#=
  line1 =#_`。你可以通过使用此语法在显示模板中使用 JavaScript 变量。接着，我们将通过使用`<a>`元素显示 PDF 文件的链接。完整文件如图
  6-29 所示。


