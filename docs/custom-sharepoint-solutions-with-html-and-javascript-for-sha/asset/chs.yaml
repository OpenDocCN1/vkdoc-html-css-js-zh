  首先，我们需要获取用户在页面上输入的文档标题和内容，通过以下代码实现：\n\n```\nvar docTitle = $(\"#txtDocumentTitle\"\
  ).val() + \".txt\";\nvar docContent = $(\"#txtDocumentContent\").val();\n```\n\n\
  请注意，我们在文档标题末尾添加了 `.txt`。这会让 SharePoint 知道我们打算创建一个文本文件，因为它会使用名称中的扩展名来确定文件类型。接下来，我们获取当前客户端上下文的引用，以及我们想要保存新文档的网站和文档库。现在，我们需要创建一个新的\
  \ `SP.FileCreationInformation` 对象并设置其属性：\n\n```\nvar fileCreateInfo = new SP.FileCreationInformation();\n\
  fileCreateInfo.set_url(docTitle);\nfileCreateInfo.set_content(new SP.Base64EncodedByteArray());\n\
  ```\n\n现在，您应该开始了解在 SharePoint 中使用 JavaScript 创建对象的模式。几乎所有您创建的内容都有一个关联的 `CreationInformation`\
  \ 对象。创建对象后，我们使用 `set_url()` 方法设置文件的 URL。最后，我们使用 `SP.Base64EncodedByteArray()` 对象将文件的内容设置为一个空字节数组。您现在不需要过多担心此对象的细节，只需知道这是\
  \ JSOM 代码在设置新文件内容时所期望的即可。创建空数组后，我们需要使用以下代码填充它：\n\n```\nfor (var i = 0; i < docContent.length;\
  \ i++) {\n    fileCreateInfo.get_content().append(docContent.charCodeAt(i));\n}\n\
  ```\n\n这是一个简单的循环，它将获取用户提交的文本中的每个字符，并将其追加到文件内容中的空数组中。循环完成后，文本被输入到文档中，我们将其添加到库中：\n\
  \n```\nthis.newFile = oList.get_rootFolder().get_files().add(fileCreateInfo);\n\
  ```\n\n然后，我们在客户端上下文中加载查询并执行它。`success` 函数将简单地在屏幕上输出文件创建成功的消息。\n\n**注意：** 在此示例中，我们创建的是一个简单的文本文件。在大多数实际场景中，目标结果可能不是文本文件，而是\
  \ Word 文件或 Excel 文件。您完全可以通过将 `.txt` 更改为 `.docx` 来修改此示例以生成 Word 文档。实际上，这一简单的更改将创建一个包含内容的新\
  \ Word 文档。但是，它只能在客户端机器上的 Word 中打开，而不能在 Office Web Apps 中打开。幸运的是，微软提供了 Office JavaScript\
  \ 文件，允许您从浏览器创建和操作 Office 文件。您可以在 [`http://msdn.microsoft.com/en-us/library/office/fp160953%28v=office.15%29.aspx`](http://msdn.microsoft.com/en-us/library/office/fp160953%28v=office.15%29.aspx)\
  \ 找到更多信息。\n\n### 结果\n\n将内容编辑器 Web 部件的“内容链接”属性设置为该 HTML 文件，然后保存页面。页面将显示文本框，供用户输入文档的标题和内容，并在新文档创建成功后显示一条成功消息，如图\
  \ 8-15 所示。\n\n![A978-1-4842-0544-0_8_Fig15_HTML.jpg](img/A978-1-4842-0544-0_8_Fig15_HTML.jpg)\n\
  \n**图 8-15.** 从内容编辑器 Web 部件创建新文档\n\n我们可以导航到“文档”文件夹，发现新的文本文档已创建。您可以单击该文档，它将在浏览器中打开并显示用户从页面输入的内容，如图\
  \ 8-16 所示。\n\n![A978-1-4842-0544-0_8_Fig16_HTML.jpg](img/A978-1-4842-0544-0_8_Fig16_HTML.jpg)\n\
  \n**图 8-16.** 在“文档”文件夹中创建的新文本文档\n\n### 读取文件\n\n在本节中，我们将了解如何读取我们在上一示例中创建的文件。\n\n\
  #### HTML\n\n在 Visual Studio 中新建一个 HTML 文件，并将其命名为 `JSOMReadDocument.html`。此页面的标记非常简单，只包含对自定义\
  \ JavaScript 文件的引用和一个用于输出文档内容的 DIV。它包含以下代码行：\n\n```\n<script type=\"text/javascript\"\
  \ src=\"/apress/Webparts/chapter 8/JSOMReadDocument.js\"></script>\n<div id=\"divReadDocument\"\
  \ />\n```\n\n\n\n#### JavaScript\n\n在 Visual Studio 中创建一个新的 JavaScript 文件，并将其命名为\
  \ `JSOMReadDocument.js`；然后包含以下代码：\n\n```\n$(function () {\n    readDocument();\n\
  });\n\nfunction readDocument() {\n    var siteUrl = _spPageContextInfo.webAbsoluteUrl;\n\
  \    var documentLibrary = \"/Shared Documents/\"\n    var fileUrl = \"New Text\
  \ Doc.txt\";\n    var fullUrl = siteUrl + documentLibrary + fileUrl;\n    $.ajax({\n\
  \        url: fullUrl,\n        type: \"GET\"\n    })\n    .done(function (data)\
  \ {\n        $(\"#divReadDocument\").html(data);\n    })\n    .fail(function ()\
  \ {\n        alert(\"error\");\n    });\n}\n```\n\n乍一看，这段代码似乎很简洁，你会注意到其中根本没有用到任何\
  \ JSOM 代码。从 SharePoint 读取文本文件的美妙之处在于，你只需要 jQuery 即可。由于本章是关于 JSOM 的内容，这段代码或许应该放在别处，但我们既然创建了一个文档，你也应该了解如何读取它。这里有一个简单的\
  \ jQuery `Document.ready` 函数，它将触发读取文件的代码。我们有意让这段代码保持简单，并将我们刚刚创建的文档文件名硬编码进去：\n\n\
  ```\nvar siteUrl = _spPageContextInfo.webAbsoluteUrl;\nvar documentLibrary = \"\
  /Shared Documents/\"\nvar fileUrl = \"New Text Doc.txt\";\nvar fullUrl = siteUrl\
  \ + documentLibrary + fileUrl;\n```\n\n我们首先要做的是通过 `_spPageContextInfo.webAbsoluteUrl`\
  \ 获取当前网站的完整 URL。接下来，我们硬编码 URL 中的文档库部分和文件名。最后，我们将它们组合成一个名为 `fullUrl` 的新变量。你完全可以将所有这些操作放在一行代码中，但你会发现，如果将其拆分成较短的几行，后续调试代码会更容易。获得文件的\
  \ URL 后，我们使用 jQuery 的 AJAX 调用来获取文档：\n\n```\n$.ajax({\n    url: fullUrl,\n    type:\
  \ \"GET\"\n})\n.done(function (data) {\n    $(\"#divReadDocument\").html(data);\n\
  })\n.fail(function () {\n    alert(\"error\");\n});\n```\n\n当通过 jQuery 中的 AJAX 检索文本文件时，文件内容将以文本形式返回，我们可以直接将其输出到页面，无需任何修改。我们使用\
  \ jQuery 的 `.done` 函数，将文件内容设置到一个名为 `data` 的新变量中。然后，我们将获取到的数据设置为页面上结果显示 DIV 的 HTML\
  \ 内容。\n\n> **注意**：与之前创建新文件时类似，我们通过使用文本文件来保持简单。本节关于读取文件的内容亦是如此。你**无法**使用上述方法读取 Office\
  \ 文件。你需要利用 Office JavaScript 文件才能在浏览器中正确读取 Word 文件或 Excel 文件。你可以在 [`http://msdn.microsoft.com/en-us/library/office/fp160953%28v=office.15%29.aspx`](http://msdn.microsoft.com/en-us/library/office/fp160953%28v=office.15%29.aspx)\
  \ 找到更多信息。\n\n### 结果\n\n将内容编辑器 Web 部件的**内容链接**属性设置为该 HTML 文件，然后保存页面。页面将显示文本文件的内容，如图\
  \ 8-17 所示。\n\n![A978-1-4842-0544-0_8_Fig17_HTML.jpg](img/A978-1-4842-0544-0_8_Fig17_HTML.jpg)\n\
  \n**图 8-17.** 页面上显示的文本文件内容\n\n### 更新文件\n\n你也可以使用 JSOM 轻松更新文件。实际上，更新文件的代码与创建文件的代码基本相同，只需添加一行代码：\n\
  \n```\nfileCreateInfo.set_overwrite(true);\n```\n\n这行代码的作用是告诉 SharePoint 覆盖之前同名的文件。利用这一点，你可以轻松地将文本文件的内容读取到页面的文本框中，并允许用户修改内容。当用户希望保存文件时，使用与创建文件相同的代码，并包含覆盖命令。\n\
  \n### 删除文件\n\n在本例中，我们将了解如何删除文件。\n\n#### HTML\n\n在 Visual Studio 中创建一个新的 HTML 文件，并将其命名为\
  \ `JSOMDeleteDocument.html`。此页面的标记包含一个文本框，供用户输入他们想要删除的文件名。它由以下几行代码组成：\n\n```\n<script\
  \ type=\"text/javascript\" src=\"/_layouts/15/sp.runtime.js\"></script>\n<script\
