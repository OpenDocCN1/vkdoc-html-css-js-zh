  现在只返回了两个文件，因为`文档`库中只有两个 PDF 文件。虽然这是一个非常简单的示例，但它应该能说明 KQL 在构建查询时提供的强大功能。仅使用两个属性限制，我们就已经能够相当程度地限制搜索结果。您可以想象，如果要求只显示位于特定网站中的
  Office 文件（无论它们位于哪个文件夹），您的 KQL 查询将类似于以下内容：


  `path:"http://SERVER/SITE" FileType:docx FileType:xlsx FileType:ppt`


  如您所见，您可以组合相同类型的属性限制器来精确构建所需内容。KQL 非常灵活；您应该很容易找到满足需求的搜索词和属性限制的正确组合。


