  \n谨以此书献给我生命中的挚爱——珍妮。你给予我的力量和勇气远超你所意识到的。\n\n## 引言\n\n多年来，SharePoint 取得了长足的发展。SharePoint\
  \ 的开发历程也同样漫长，并且往往更加坎坷。至今仍有许多技术精湛的开发者宁愿自断手臂，也不愿成为 SharePoint 开发者！然而，SharePoint 短期内不会消失，并且随着\
  \ Office 365 和 SharePoint Online 的日益普及，开发者们发现自己被要求创建自定义解决方案的频率越来越高。\n\n过去，这意味着要将\
  \ SharePoint 安装到电脑上，学习不熟悉的新 API，掌握部署流程等等。你很容易会因为这些障碍而感到沮丧，这很常见。幸运的是，使用 SharePoint\
  \ 2013 和 SharePoint Online，你有了更多选择。\n\n从 SharePoint 2013 开始，微软极大地增强了在浏览器中使用 JavaScript\
  \ 所能实现的功能。这包括一套全新的 REST API，以及利用 JavaScript 对象模型（简称 JSOM）的扩展 JavaScript 库。这些最初是为了配合\
  \ SharePoint 应用程序（SharePoint 2013 中一种新的开发模型）而构建的。应用程序允许你编写针对 SharePoint 的代码，然后将其部署到其他地方。你可以编写自定义解决方案并将其部署到云端，而最终用户完全察觉不到差异。这非常棒，因为它给了开发者更多自由，并且使自定义代码远离\
  \ SharePoint 服务器。\n\n虽然 JSOM 和 REST API 非常适合应用程序，但它们的用途并不局限于此。这些工具可以很容易地通过浏览器中运行的\
  \ JavaScript 来使用。这不仅为经验丰富的专业开发者，也为那些懂 HTML 和 JavaScript 的高级用户，开启了一个全新的开发可能性世界。这意味着熟悉\
  \ HTML 和 JavaScript 的最终用户可以开始构建自己的解决方案。更棒的是，开发者只需很少的学习成本，就能利用他们已经掌握的技能。在 Visual\
  \ Studio 和 C# 中构建自定义解决方案受限的时代已经一去不复返了；现在，你有能力构建直接在浏览器中运行的健壮解决方案！\n\n本书将探讨利用现成组件和自定义代码为\
  \ SharePoint 构建解决方案的多种方法。阅读本书后，你将创建许多自定义 Web 部件，而这些部件你之前可能认为只有使用昂贵复杂工具的专业开发者才能做到。如果你是一名开发者，你会发现\
  \ SharePoint 开发不再是一件过于复杂且需要回避的事情。无论你身处何种职位，我都希望你能带着信心和知识从另一端走出来，开始构建自己的 SharePoint\
  \ 自定义解决方案。\n\n\n\n"
