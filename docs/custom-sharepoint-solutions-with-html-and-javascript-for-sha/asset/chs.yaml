  JavaScript 文件，我们将在本章后面看到这一点。


  > **注意**：显示模板可以非常简单，也可以非常复杂。您可以对哪些属性可用以及内容如何布局进行大量控制，甚至可以向模板中添加额外的 JavaScript。显示模板的整体主题相当庞大且复杂，无法在本章中完全覆盖。有关更多信息，请访问
  [`msdn.microsoft.com/en-us/library/office/jj945138%28v=office.15%29.aspx`](http://msdn.microsoft.com/en-us/library/office/jj945138%28v=office.15%29.aspx)。


  要开始构建新的显示模板，我们将下载另一个模板的副本并将其用作基础。显示模板可能非常复杂，从头开始构建一个可能是一项耗时的工作。使用现有模板作为起点将显著缩短创建新模板所需的时间。在此示例中，我们将重点放在项目模板上，并使用默认的“左侧图片，右侧三行文本”模板。在
  `Content Web Parts` 文件夹中，此模板标题为 `Item_Picture3Lines.html`。在文件夹中选中此模板，然后从功能区中点击“下载副本”，如图
  6-27 所示。


