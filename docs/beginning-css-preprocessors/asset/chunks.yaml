    \n# Development with Less\n\nIn the previous chapter, you looked into various\
    \ things you can do with Sass, including various techniques like mixins. In this\
    \ chapter, you will look into another preprocessor framework that’s equally famous,\
    \ named *Less*.\n\nThis chapter explores the following aspects of Less:\n\n* Client\
    \ and server-side variation of less\n* Language features\n* Nested rules\n* Import\
    \ directives\n* Mixin guards\n* Referencing the parent selector\n* Using `&` with\
    \ guards\n* Detached rules\n* Merging properties\n* Looping mixins\n* Functions\n\
    \n## Introduction to Less\n\nLess is a preprocessor language that gets compiled\
    \ into CSS. It was created by Alexis Sellier. Less is along the lines of “SCSS”\
    \ syntax of Sass, which in turn is like CSS syntax. Less is open source. Less\
    \ was first written in Ruby; however, in the later versions, it was rewritten\
    \ in JavaScript. Note that valid CSS is valid Less code. Less provides the following\
    \ features similar to Sass that you saw in previous chapter like variables, nesting,\
    \ operators, mixins, and functions; however what makes Less different from other\
    \ CSS precompilers is its ability to compile in real-time via `less.js` in the\
    \ browser.\n\nThere are two variants of Less, unlike Sass. Less has a client-side\
    \ variant, which compiles Less code in browsers and a server-side variant that\
    \ compiles the file server side and then provides it to the browser. Developer\
    \ can use the client-side variant for developing and testing code. The server-side\
    \ variant can be used to compile the code, minify it, and then make it production-ready.\n\
    \nA point to keep in mind is that the client-side variant does not generate output.\
    \ It compiles the code on each browser reload.\n\n### Client-Side Variation of\
    \ Less\n\nTo use the client-side variant of Less, you need to download the client-side\
    \ compiler named `less.js`, which is available at [http://lesscss.org/#download-options](http://lesscss.org/#download-options).\
    \ Once it’s downloaded, copy it into your working directory. Now let’s try some\
    \ Less code with this Less compiler.\n\n[***Listing 4-1***](#9781484213483_Ch04.xhtml#_FPar1).\
    \ An HTML Markup for the Example\n\n```\n<html>\n        <head>\n            \
    \    <title>Listing 4-1</title>\n                <link type=\"text/css\" rel=\"\
    stylesheet/less\" href=\"styles1.1.less\" />\n                <script src=\"//cdnjs.cloudflare.com/ajax/libs/less.js/2.2.0/less.min.js\"\
    ></script>\n        </head>\n        <body>\n                <p class=\"impElement\"\
    >This is my first Less code</p>\n        </body>\n</html>\n```\n\n[***Listing\
    \ 4-2***](#9781484213483_Ch04.xhtml#_FPar2). Less Code in `styles1.1.less`\n\n\
    ```\n.impElement{\n        background:#666;\n        padding:10px;\n        border-radius:10px;\n\
    }\n```\n\nWhen you run this page, the output will look as shown in [Figure 4-1](#9781484213483_Ch04.xhtml#Fig1).\n\
    \n![9781484213483_Fig04-01.jpg](OEBPS/Images/9781484213483_Fig04-01.jpg)\n\n[Figure\
    \ 4-1](#9781484213483_Ch04.xhtml#_Fig1). Output of [Listings 4-1](#9781484213483_Ch04.xhtml#FPar1)\
    \ and [4-2](#9781484213483_Ch04.xhtml#FPar2)\n\n![Image](OEBPS/Images/sq.jpg)\
    \ **Note** In the example provided in [Listing 4-1](#9781484213483_Ch04.xhtml#FPar1),\
    \ we have linked `less.js` through a content delivery network (CDN). To run this\
    \ code, you need a web server, otherwise `less.js` will not load. In case you\
    \ want to run this example without running a web server, download and link `less.js`\
    \ locally.\n\n### Server-Side Variant\n\nThe client-side variant is good for development\
    \ and debugging. However, when you’re deploying to production, it is advisable\
    \ to use the server-side variant—i.e., compile the Less code into a browser friendly\
    \ CSS. To do so, you need to install the `lessc` compiler. This can be installed\
    \ using node package manager.\n\nIf you don’t have node installed, you need to\
    \ install it first. The procedure for installing Node.js has been well explained\
    \ here: [http://howtonode.org/how-to-install-nodejs](http://howtonode.org/how-to-install-nodejs).\n\
    \nOnce you’re done installing Node.js, you are ready to start installing the `lessc`\
    \ compiler. Run the command in [Listing 4-3](#9781484213483_Ch04.xhtml#FPar4)\
    \ in the terminal.\n\n[***Listing 4-3***](#9781484213483_Ch04.xhtml#_FPar4). Command\
