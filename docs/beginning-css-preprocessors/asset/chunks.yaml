    # Mixins 与可变参数


    你可以通过允许 mixins 处理未知数量的变量，使其更加灵活。Sass 支持可变参数。这些参数在 mixins/函数的参数列表末尾声明，包含所有额外的参数，并以列表形式存在。这些参数看起来像普通参数，但在末尾有额外的
    `…`。清单 3-41 展示了之前代码的修改版本，它传递了一个名为 `fontProp` 的可变参数来设置字体属性。


    **清单 3-41**. 可变参数示例


    ```

    @mixin fancyBorder($borderColor:#000, $borderWidth:2px,$fontProp…) {

      border: {

        color: $borderColor;

        width: $borderWidth;

        style: dashed;

      }

      font:$fontProp;

    }


