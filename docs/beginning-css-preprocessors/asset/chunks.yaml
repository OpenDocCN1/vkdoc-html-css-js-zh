    \        line-height:40px;\n}\n\n.successBox {\n        @extend .messagebox;\n\
    \        color:#0F0;\n}\n```\n\n***列表 1-22***：在 Less 中用于扩展的示例\n\n```\n.messagebox\
    \ {\n        font-size:1em;\n        line-height:40px;\n}\n\n.successBox {\n \
    \       &:extend(.messagebox);\n        color:#0F0;\n}\n```\n\n# 运算符\n\n预处理器提供标准的数学运算符，以便你可以动态进行计算。见列表\
    \ 1-23。\n\n***列表 1-23***：在 Sass 和 Less 中展示数学运算的示例\n\n```\n.mainContent {\n  float:\
    \ left;\n  width: 750px / 960px * 100%;\n}\n```\n\n# CSS 预处理器的问题\n\n本节讨论被不当使用的预处理器特性。你将会看到因误用或过度使用预处理器特性而导致的最常见问题。\n\
    \n## 混合宏的问题\n\n混合宏是可复用的代码块，可以在需要时被调用。这避免了多次重写这些代码块。\n\n考虑一个用 Sass 预处理器编写的代码片段，如列表\
    \ 1-24 所示。\n\n***列表 1-24***：一个使用 Sass 的混合宏示例\n\n```\n@mixin notification {\n \
    \   color: #fff;\n    border-radius: 50%;\n}\n\n.errorNotification {\n    @include\
    \ notification;\n    background:#F00;\n}\n\n.successNotification {\n    @include\
    \ notification;\n    background: #0F0;\n}\n```\n\n这段代码编译成列表 1-25。\n\n***列表 1-25***：列表\
    \ 1-24 的输出\n\n```\n.errorNotification {\n  color: #fff;\n  border-radius: 50%;\n\
    \  background: #F00;\n}\n\n.successNotification {\n  color: #fff;\n  border-radius:\
    \ 50%;\n  background: #0F0;\n}\n```\n\n注意在列表 1-25 的输出中出现的代码重复。如果这个混合宏在整个样式代码中被广泛使用，将导致大量的代码冗余，从而增加文件大小。\n\
    \nSass 有一种其他预处理器不支持的方法——*扩展*。通过以逗号分隔的格式指定选择器，扩展代码可以同时设置多个选择器的相同属性。\n\n这种方法避免了重复；然而，如果扩展了太多选择器，可能会导致性能问题。生成的\
    \ CSS 将有许多逗号分隔格式的选择器，这可能导致性能问题。\n\n## 扩展选择器或使用混合宏可能妨碍维护\n\n扩展类或使用混合宏可能会导致维护问题。由于属性在不同的地方声明和使用，在没有完全预料影响的情况下修改属性的可能性很高。这可能导致布局在任何时候被破坏。\n\
    \n# 小结\n\n本章介绍了预处理器。你了解了它们如何影响你的工作流程，使其更高效，并在未来更易于维护。你还了解了目前市面上一些知名的预处理器。\n\n\
    下一章将深入探讨 Sass，并讨论其各种特性。\n\n# 第 2 章\n\n![image](img/frontdot.jpg)\n\n# Sass 简介\n\
    \n在上一章中，你了解了预编译器，包括为什么使用它们，哪些是知名的预处理器，以及它们的特性。本章将介绍最流行的预处理器之一：Sass。\n\n在本章中，你将探索\
    \ Sass 的以下方面：\n\n*   安装\n*   运行代码\n*   变量\n*   注释\n*   数据类型\n*   括号\n*   嵌套规则\n\
    *   嵌套属性\n*   引用父选择器\n*   插值\n*   占位符选择器\n*   逻辑及控制指令\n\n## 安装 Sass\n"
- fmt: 'You install Sass via a Ruby gem, so you need to have Ruby installed on your
    machine. If you are on Mac OS X, you already have Ruby installed. If you are on
    Windows or Linux, you need to download and install Ruby from [http://rubyinstaller.org/downloads/](http://rubyinstaller.org/downloads/).


    After installing Ruby, you install Sass by running the `gem` command. `gem` can
    be thought of as an extension that extends the functionality of applications that
    consume Ruby. You can install Sass via the command line using the command shown
    in [Listing 2-1](#9781484213483_Ch02.xhtml#FPar1). A simple interpretation of
    this command is “Ruby, install the gem called sass”.


    [***Listing 2-1***](#9781484213483_Ch02.xhtml#_FPar1). Command for Installing
    Sass


    ```

    sudo gem install sass

    ```


    After installation completes, you can verify it by running the command in [Listing
    2-2](#9781484213483_Ch02.xhtml#FPar2).


    [***Listing 2-2***](#9781484213483_Ch02.xhtml#_FPar2). Command for Verifying Sass
    Installation


    ```

    sass -v

    ```


    This should give you the output shown in [Figure **2-1**](#9781484213483_Ch02.xhtml#Fig1).


    ![9781484213483_Fig02-01.jpg](OEBPS/Images/9781484213483_Fig02-01.jpg)


    [Figure 2-1](#9781484213483_Ch02.xhtml#_Fig1). Output of the `sass -v` command


    Upon completing this installation, you are ready to use Sass.


    ## Checking Other Versions of Sass


    You can check for other available versions, beside the latest version, by executing
    the command shown in [Listing 2-3](#9781484213483_Ch02.xhtml#FPar3).


    [***Listing 2-3***](#9781484213483_Ch02.xhtml#_FPar3). Checking for Other Versions
    of Sass


    ```

    gem list sass –a –r

    ```


