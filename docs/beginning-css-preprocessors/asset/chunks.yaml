- fmt: 'If you open this file in an editor, the content of this file would be something
    like what’s shown in [Listing 5-6](#9781484213483_Ch05.xhtml#FPar6).


    [**Listing 5-6**](#9781484213483_Ch05.xhtml#_FPar6). Content of the Default `config.rb`
    File


    ```

    require ''compass/import-once/activate''

    # Require any additional compass plugins here.


    # Set this to the root of your project when deployed:

    http_path = "/"

    css_dir = "stylesheets"

    sass_dir = "sass"

    images_dir = "images"

    javascripts_dir = "javascripts"


    # You can select your preferred output style here (can be overridden via the command
    line):

    # output_style = :expanded or :nested or :compact or :compressed


    # To enable relative paths to assets via compass helper functions. Uncomment:

    # relative_assets = true


    # To disable debugging comments that display the original location of your selectors.
    Uncomment:

    # line_comments = false


    # If you prefer the indented syntax, you might want to regenerate this

    # project again passing --syntax sass, or you can uncomment this:

    # preferred_syntax = :sass

    # and then run:

    # sass-convert -R --from scss --to sass sass scss && rm -rf sass && mv scss sass

    ```


    When you make changes to the `config.rb` file, it is advisable to clear the `.sass-cache`
    by either manually deleting the sasscache folder or by running the `compass clean`
    command.


    You can use following command to watch the project changes: `compass watch`.


    Additional gems for flexible grids, boilerplate frameworks, and so on are available
    and can be referenced in a project, through `config.rb` file. This is done in
    the first section of the `config.rb` file. Note however you need to install these
    addons before you import them into your Compass project.


    Let’s consider an example where you want to import 960 Grid CSS framework addon.
    For this, you will have to first install the addon shown in [Listing 5-7](#9781484213483_Ch05.xhtml#FPar7)
    (the results are shown in [Figure 5-6](#9781484213483_Ch05.xhtml#Fig6)).


    [**Listing 5-7**](#9781484213483_Ch05.xhtml#_FPar7). Installing Custom Addons
    in the Compass Project


    ```

    sudo gem install compass-960-plugin

    ```


    ![9781484213483_Fig05-06.jpg](OEBPS/Images/9781484213483_Fig05-06.jpg)


    [Figure 5-6](#9781484213483_Ch05.xhtml#_Fig6). Installing an addon in a Compass
    project


    After installing the addon, the next step is to include it in your project. In
    case of an existing project, you need to change the first part of `config.rb`
    where you need to add a `require` statement, as shown in [Listing 5-8](#9781484213483_Ch05.xhtml#FPar8).


    [**Listing 5-8**](#9781484213483_Ch05.xhtml#_FPar8). Adding `require` in `config.rb`


    ```

    require "ninesixty"

    ```


    Once you add this to the config file, you can add 960 grid to your project by
    using `@import` statements within your SCSS, as shown in [Listing 5-9](#9781484213483_Ch05.xhtml#FPar9).


    [**Listing 5-9**](#9781484213483_Ch05.xhtml#_FPar9). Importing the 960 Grid


    ```

    @import "960/grid";

    @include grid-system-complete(12);

    ```


    This would add 960 grid system to your SCSS file. Since I created this project
    using the default `compass create` command, I will be using `screen.scss` as shown
    in [Listing 5-9](#9781484213483_Ch05.xhtml#FPar9). Now in order to get all this
    code in your final CSS, you can simply run the command shown in [Listing 5-10](#9781484213483_Ch05.xhtml#FPar10)
    inside the project directory.


    [**Listing 5-10**](#9781484213483_Ch05.xhtml#_FPar10). Command to Compile and
    Watch the SCSS File in Compass


    ```

    compass watch

    ```


    ![9781484213483_Fig05-07.jpg](OEBPS/Images/9781484213483_Fig05-07.jpg)


    Figure 5-7. The `compass watch` command will add the 960 grid classes to your
    stylesheet


    ![Image](OEBPS/Images/sq.jpg) **Note** If you face conflicts with versions of
    Sass or Compass after adding these plug-ins, uninstall and reinstall the version
    of Sass and compass as per the compatibility of plug-in. Additionally, changes
    in `config.rb` are not being registered by `compass watch` while watch is on.
    It has to be restarted.


    In addition to including addons in the project, you can also set folder path for
    various assets. In `config.rb`, you have a section similar to what is shown in
    [Listing 5-11](#9781484213483_Ch05.xhtml#FPar12).


    [**Listing 5-11**](#9781484213483_Ch05.xhtml#_FPar12). The Section in `config.rb`
    That Sets the Path of Various Assets


    ```

    # Set this to the root of your project when deployed:

    http_path = "/"

    css_dir = "stylesheets"

    sass_dir = "sass"

    images_dir = "images"

    javascripts_dir = "javascripts"

    ```


    You can also set final style of CSS output, which is shown in [Listing 5-12](#9781484213483_Ch05.xhtml#FPar13).


    [**Listing 5-12**](#9781484213483_Ch05.xhtml#_FPar13). The Section of `config.rb`
    Where You Set the CSS Output Style


    ```

    # You can select your preferred output style here (can be overridden via the command
    line):

    # output_style = :expanded or :nested or :compact or :compressed

    ```


    The final section in `config.rb` is enabling relative assets, that is, setting
    relative path for the assets. This setting is not enabled by default. With this
    setting turned on, you can specify an image name in CSS and it will know where
    to find it. You don’t have to specify the entire path. So after enabling the relative
    assets setting by uncommenting the line in `config.rb` it should be as shown in
    [Listing 5-13](#9781484213483_Ch05.xhtml#FPar14).


    [**Listing 5-13**](#9781484213483_Ch05.xhtml#_FPar14). The Section of `config.rb`
    Where You Set Relative Assets


    ```

    # To enable relative paths to assets via compass helper functions. Uncomment:

    relative_assets = true

    ```


    ## Responsive Grids with Sass and Compass


    Responsive grids are very useful tools for development. [Chapter 3](#9781484213483_Ch03.xhtml)
    discussed grids and how to build them. However, there are some common reasons
    that developers have against using them.


    One of the common reasons is addition of non-semantic classes to the written HTML
    markup (such as `col-md-8`) when you use bootstrap framework.


    Another reason for avoiding the use of grids is that they restrict creativity.


    However, with Sass and Compass, you will be working with flexible grid system
    that can be implemented as desired. Make the design as you desire and then bring
    it to life using Sass and Compass. You can have flexibility of numbers columns
    inside your grid.


    The advantage of using Sass and Compass grid systems is that they take the burden
    of complex mathematics off your shoulders. Thus, you can build complex grid systems
    without knowing much of the math. The example in this chapter uses *Susy* to build
    the grid system.


    ## Introduction to Susy


    Susy is a grid system based on Sass and Compass. It’s flexible and simple to use.
    In addition to its simplicity and flexibility, it generates clean code and is
    nicely documented.


    Susy is available at [http://susy.oddbird.net/](http://susy.oddbird.net/); the
    site contains good tutorials and reference documentation.


    Before you begin the task of building grids, let’s clarify one important concept.
    Susy will help you make the grid and will not automatically generate one.


    You define what you are building and then Susy does all calculations. Thus to
    simply explain, it’s like telling Susy, “I want a grid with 12 columns, where
    each column is 10em wide, having 2em gutter and .5em of padding on both sides
    of the grid”. Then Susy does the calculations to generate this grid.


    ## Getting Susy


    In order to get the Susy plug-in for Compass, you need to open terminal and type
    the command shown in [Listing 5-14](#9781484213483_Ch05.xhtml#FPar15).


    [**Listing 5-14**](#9781484213483_Ch05.xhtml#_FPar15). The Command for Susy Compass
    Extension


    ```

    sudo gem install susy

    ```


    This would give the output shown in [Figure 5-8](#9781484213483_Ch05.xhtml#Fig8).


    ![9781484213483_Fig05-08.jpg](OEBPS/Images/9781484213483_Fig05-08.jpg)


    [Figure 5-8](#9781484213483_Ch05.xhtml#_Fig8). The output of `Gem Install Susy`


    ## Using Susy to Your Project'
