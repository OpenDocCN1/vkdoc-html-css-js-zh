    ## 输出样式


    默认情况下，Sass 会以一种结构良好的格式输出 CSS。但同时，它也提供了多种样式选项。Sass 允许您从四种输出样式中进行选择，并通过 `--style`
    命令行参数指定。


    ### nested（嵌套样式）


    这是 Sass 的默认样式。它以普通格式显示 CSS 样式。缩进遵循原始 Sass 文档中的嵌套层级，如清单 3-56 所示。


    ***清单 3-56***. 嵌套样式示例


    ```css

    #container {

      color: #000; }

      #container p {

        padding: 10px; }

    ```


    ### expanded（展开样式）


    选择此样式时，生成的输出与手写 CSS 的格式完全相同。规则之间不会有像嵌套样式那样的缩进，如清单 3-57 所示。


    ***清单 3-57***. 展开样式示例


    ```css

    #container {

      color: #000;

    }


    #container p {

      padding: 10px;

    }

    ```


    ### compact（紧凑样式）


    紧凑输出比前两种样式占用更少的空间。它将所有属性放在一行上，每条规则占一行，如清单 3-58 所示。


    ***清单 3-58***. 紧凑样式示例


    ```css

    #container {color: #000;}

    #container p {padding: 10px;}

    ```


    ### compressed（压缩样式）


    压缩样式总体占用空间最小。它会消除所有空白，如清单 3-59 所示。


    ***清单 3-59***. 压缩样式示例


    ```css

    #container {color: #000;}#container p {padding: 10px;}

    ```


    ## 构建您自己的网格系统


    在本节中，您将构建属于您自己的网格系统，该系统可用于构建响应式网站。这将帮助您理解网格系统的工作原理，并在需要时帮助您创建自定义网格系统。网格系统允许内容以一致且灵活的模式进行垂直和水平排列。


    网格系统由两个组件构成：行（rows）和列（columns）。行是容纳列的容器。列决定内容的最终结构和排列。


    要开始构建您自己的网格，首先需要设置一些必要的类和变量。如清单 3-60 所示。


    ***清单 3-60***. 设置初始类和变量


    ```scss

    // Building custom grid system

    $column-spacing:2%;

    .col{

      float:left;

      margin-right:$column-spacing;

    }

    ```


    此代码将两列之间的间距设置为 `2%`，并定义了一个 `col` 类，该类将与特定列类一起使用。接下来，您需要为可变数量的列创建列类。该示例最多支持 12
    列，如清单 3-61 所示。


    ***清单 3-61***. 计算各种列类


    ```scss

    // Building custom grid system

    $column-spacing:2%;

    .col{

      float:left;

      margin-right:$column-spacing;

    }


    .col-1   { width:percentage(1 / 12) - $column-spacing; }

    .col-2   { width:percentage(1 / 6) - $column-spacing; }

    .col-3   { width:percentage(1 / 4) - $column-spacing; }

    .col-4   { width:percentage(1 / 3) - $column-spacing; }

    .col-5   { width:percentage(1 / 2.4) - $column-spacing; }

    .col-6   { width:percentage(1 / 2) - $column-spacing; }

    .col-7   { width:percentage(1 / 1.714285714285714) - $column-spacing; }

    .col-8   { width:percentage(1 / 1.5) - $column-spacing; }

    .col-9   { width:percentage(1 / 1.333333333333333) - $column-spacing; }

    .col-10  { width:percentage(1 / 1.2) - $column-spacing; }

    .col-11  { width:percentage(1 / 1.090909090909091) - $column-spacing; }

    .col-12  { width:percentage(1); }

    ```


    这段代码以百分比形式生成输出。您可以先假设只有一列，相当于 12 列网格。因此，当您要计算单列（`col-1`）时，计算公式如下：


    ```

    percentage(1/(总列数[12]/所需列数[1]) - 列间距)；

    ```


    您需要减去列间距，因为 `.col` 类中指定了 `margin-right`。为了计算不同列配置下的列宽，您需要更改所需列数的值。此代码的输出如清单 3-62
    所示。


