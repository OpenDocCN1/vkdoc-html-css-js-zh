    About the Author


    ![9781484213483_unFM-01.jpg](OEBPS/Images/9781484213483_unFM-01.jpg)


    **Anirudh Prabhu** is a software engineer with over six years of industry experience.
    He specializes in technologies such as HTML5, CSS3, PHP, jQuery, Twitter Bootstrap,
    Less, and Sass, and he also has knowledge of CoffeeScript and AngularJS. In addition
    to web development, he has been involved in building training materials and writing
    tutorials for these technologies.


    About the Technical Reviewer


    **Lokesh Iyer** completed his bachelor’s in IT from KC College, Mumbai and received
    his MBA from Sydenham College, Mumbai. He is the founder and director of SI Technologies,
    a company focused on providing hardware and software solutions as well as web
    exposure and security solutions. Over the past three years, he completed over
    60 projects on HTML5, CSS3, JavaScript, jQuery, PHP, C#, Android, and MySQL/SQLite
    databases with his team. Apart from his business ventures, he is a visiting faculty
    member at KC College of the bachelor’s in IT program.


    Acknowledgments


    First and foremost, I wish thank the awesome team at Apress for offering me such
    a wonderful opportunity to write this book. When Celestin “discovered” me through
    LinkedIn and asked me if I would like to write a book, it sounded like a straight
    and easy task. Over the next month, he painstakingly guided me through the entire
    process of preparing an initial proposal for the book and helped me finalize it.
    Subsequently, when the real action started in terms of writing the chapters, Rita
    was always there. She was the scrum master who was always there to help. She gave
    me that gentle nudge to make sure that even as I was running behind schedule,
    I did everything that needed to be done to catch up and deliver the chapter in
    potentially shippable increments. Thanks, Celestin and Rita, for not giving up
    on me!


    I also want to thanks Matt Moodie and the large team from Apress working in background,
    for all their efforts. In addition, the review feedback and critical inputs by
    reviewers is an author’s lifeline—it is the first feedback on a product that is
    still quite raw. I want to offer my sincere thanks to Lokesh Iyer for his technical
    review.


    I can’t thank my professional network enough for enriching my learning journey
    through the years—my former employers, my clients, managers, colleagues, team
    members, students, readers of my blog, audience to my talks, and the noblest of
    them all—the fellow volunteers. Thanks for all the support and learning opportunities
    and for making me a better professional every single day.


    Finally, despite all the diligent efforts of the editorial team and reviewers,
    I must accept responsibility for all the mistakes and shortcomings in this book.
    Let me know how I can make this book better.


    Introduction


    CSS preprocessor came into buzz a couple of years ago. The concept intrigued me:
    Allowing use of preprocessor files that could contain one or several things like
    variables, functions, mixins, and the like. After development, these special files
    would then be compiled into regular CSS files that all web browsers could understand.'
