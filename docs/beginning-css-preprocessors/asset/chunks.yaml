- fmt: "Now that you have `Susy for Compass` installed, the next step is to include\
    \ it in the project. In the previous section of this chapter you learned how to\
    \ include addons through the `config.rb` file. However, this time you will be\
    \ creating a new project with an addon included since the beginning. For this,\
    \ you will use the `compass create` command with some additional parameters, as\
    \ shown in [Listing 5-15](#9781484213483_Ch05.xhtml#FPar16).\n\n[***Listing 5-15***](#9781484213483_Ch05.xhtml#_FPar16).\
    \ The command for Creating Compass Project with the Susy Addon\n\n```\ncompass\
    \ create sampleSusyProj -r susy -u susy\n```\n\nThis will output the Compass project\
    \ as shown in [Figure 5-9](#9781484213483_Ch05.xhtml#Fig9).\n\n![9781484213483_Fig05-09.jpg](OEBPS/Images/9781484213483_Fig05-09.jpg)\n\
    \n[Figure 5-9](#9781484213483_Ch05.xhtml#_Fig9). Output of the `compass create`\
    \ command with additional parameters for Susy\n\nAfter creating the project, you\
    \ get two files in the `SCSS` directory: `_grid.scss` and `style.scss`. Now let’s\
    \ begin setting up the grid.\n\nTo set up the grid using Susy, the first thing\
    \ you need is to define all the Susy-specific variables needed for this task.\
    \ These are:\n\n* `$total-column`: The total number of columns\n* `$column-width`:\
    \ Width of each column\n* `$gutter-width`: Space between each column\n* `$grid-padding`:\
    \ Space from left and right side for the grid\n\nYou will define these properties\
    \ in `_grid.scss`. The first line is to import `\"susy\"`, which is required to\
    \ pull in all the Susy-related code into `_grid.scss`.\n\nFor this example, you\
    \ will assume the following values for these variables:\n\n* `$total-column`:\
    \ 12\n* `$column-width`: 10em\n* `$gutter-width`: 4em\n* `$grid-padding`: 4em\n\
    \nThe code should look like [Listing 5-16](#9781484213483_Ch05.xhtml#FPar17).\n\
    \n[***Listing 5-16***](#9781484213483_Ch05.xhtml#_FPar17). Setting Necessary Parameters\
    \ for Susy\n\n```\n@import \"susy\";\n\n$susy: (\n   columns: 12,\n   gutters:\
    \ 1/5\n);\n```\n\nNext, you need context for the grid. To do so, you need to set\
    \ some element as a container element. Let’s assume that the element you want\
    \ as a container is `page`. This is done in `style.scss`, as shown in [Listing\
    \ 5-17](#9781484213483_Ch05.xhtml#FPar18).\n\n[***Listing 5-17***](#9781484213483_Ch05.xhtml#_FPar18).\
    \ Setting an Element as Container in `style.scss`\n\n```\n@import \"grids\";\n\
    \n.page{\n   @include container;\n}\n```\n\nThis tells Susy that `.page` will\
    \ act as a container.\n\n## Showing the Grid Background\n\nSusy gives you the\
    \ ability to see the grid columns of a container in a browser. This can come in\
    \ handy if you want to know how your grid is performing. This can be done by amending\
    \ a rule, as shown in [Listing 5-18](#9781484213483_Ch05.xhtml#FPar19).\n\n[***Listing\
    \ 5-18***](#9781484213483_Ch05.xhtml#_FPar19). Telling Susy to Show the Grid\n\
    \n```\n@import \"grids\";\n\n.page{\n   @include container(show overlay);\n  \
    \ Height:500px; //Height has been set manually to show grid on an empty page\n\
    }\n```\n\nThe HTML code for this page is shown in [Listing 5-19](#9781484213483_Ch05.xhtml#FPar20).\n\
    \n[***Listing 5-19***](#9781484213483_Ch05.xhtml#_FPar20). HTML Markup for [Listing\
    \ 5-18](#9781484213483_Ch05.xhtml#FPar18)\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n\
    \    <title>Sample susy project</title>\n    <link rel=\"stylesheet\" type=\"\
    text/css\" href=\"stylesheets/style.css\">\n  </head>\n  <body>\n    <div class=\"\
    page\"></div>\n  </body>\n</html>\n```\n\nThe result of this code is shown in\
    \ [Figure 5-10](#9781484213483_Ch05.xhtml#Fig10). Note that the grids are visible\
    \ when you hover over the icon in the top-right corner.\n\n![9781484213483_Fig05-10.jpg](OEBPS/Images/9781484213483_Fig05-10.jpg)\n\
    \n[Figure 5-10](#9781484213483_Ch05.xhtml#_Fig10). Having a grid overlay\n\nNext,\
    \ you will set Susy to use the `box-sizing` model for `border-box`. You can do\
    \ this by adding this variable to the grid settings, as shown in [Listing 5-20](#9781484213483_Ch05.xhtml#FPar21).\n\
    \n[***Listing 5-20***](#9781484213483_Ch05.xhtml#_FPar21). Adding a Box-Sizing\
    \ Model to the Grid System Setting\n\n```\n@import \"susy\";\n\n$susy: (\n   columns:\
    \ 12,\n   gutters: 1/5,\n   global-box-sizing:border-box\n);\n```\n\nWhile developing\
    \ a responsive page or application, the first thing that you should think about\
    \ is a completely accessible design. That means regardless of the device or its\
    \ capability, the content should be accessible on your page or application. This\
    \ certainly does not guarantee the same layout and behavior across all devices.\n\
    \nNow let’s take a look at how you can set breakpoints in Susy. A breakpoint in\
    \ CSS is where the layout changes to suit the size of the viewport. Susy gives\
    \ you the flexibility to define as many breakpoints as you want. Consider two\
    \ breakpoints. You will define two variables for medium and large inside `_grid.scss`,\
    \ as shown in [Listing 5-21](#9781484213483_Ch05.xhtml#FPar22).\n\n[***Listing\
    \ 5-21***](#9781484213483_Ch05.xhtml#_FPar22). Defining Breakpoints in Susy\n\n\
    ```\n@import \"susy\";\n\n$susy: (\n   columns: 12,\n   gutters: 1/5,\n   global-box-sizing:border-box\n\
    );\n\n// Variables defining breakpoints\n$mediumScreen:750px;\n$largeScreen:1200px;\n\
    ```\n\nYou might have observed that the example declared only two breakpoints.\
    \ That is because you will build the sample layout with a mobile-first mindset,\
    \ which would be accessible across various devices regardless of their capabilities\
    \ and then enhance it for bigger-sized viewports.\n\nFor this example, you will\
    \ use a breakpoint plug-in available at [http://breakpoint-sass.com/](http://breakpoint-sass.com/).\
    \ To start using this, you first need to install the plug-in on your system, as\
    \ shown in [Listing 5-22](#9781484213483_Ch05.xhtml#FPar23) (the output is in\
    \ [Figure 5-11](#9781484213483_Ch05.xhtml#Fig11)).\n\n[***Listing 5-22***](#9781484213483_Ch05.xhtml#_FPar23).\
    \ Installing the Breakpoint Plug-In\n\n```\ngem install breakpoint\n```\n\n![9781484213483_Fig05-11.jpg](OEBPS/Images/9781484213483_Fig05-11.jpg)\n\
    \n[Figure 5-11](#9781484213483_Ch05.xhtml#_Fig11). Installing the breakpoint plug-in\n\
    \nThe next step is to include the plug-in in the `config.rb` file of your project\
    \ using `require \"breakpoint\"`.\n\nAfter including it in your config file, you\
    \ need to include it in the SCSS file you are working with using `@import \"breakpoint\"\
    `.\n\nNow you will start using the breakpoint in your code. To do so, let’s start\
    \ by setting `font-size` to `1.5em` for the large-screen breakpoint that you defined\
    \ earlier, as shown in [Listing 5-23](#9781484213483_Ch05.xhtml#FPar24).\n\n[***Listing\
    \ 5-23***](#9781484213483_Ch05.xhtml#_FPar24). Setting the Style for a Large-Screen\
    \ Breakpoint in `_grids.scss`\n\n```\n@import \"susy\";\n@import \"breakpoint\"\
    ;\n\n$susy: (\n   columns: 12,\n   gutters: 1/5,\n   global-box-sizing:border-box\n\
    );\n\n// Variables defining breakpoints value\n$mediumScreen:750px;\n$largeScreen:1200px;\n\
    \n.page {\n   @include breakpoint($largeScreen) {\n      font-size: 1.5em;\n \
    \  }\n}\n```\n\nThis code will generate a media query for the larger screen, as\
    \ shown in [Listing 5-24](#9781484213483_Ch05.xhtml#FPar25).\n\n[***Listing 5-24***](#9781484213483_Ch05.xhtml#_FPar25).\
    \ Output of [Listing 5-23](#9781484213483_Ch05.xhtml#FPar23) in `style.css`\n\n\
    ```\n@media (min-width: 1200px) {\n   /* line 17, ../sass/_grids.scss */\n   .page\
    \ {\n      font-size: 1.5em;\n   }\n}\n```\n\nNow let’s say you wanted to declare\
    \ a media query with min and max widths. You can do this by providing the value\
    \ in a space-separated format. For this, let's modify the value of the `$mediumScreen`\
    \ variable. This is shown in [Listing 5-25](#9781484213483_Ch05.xhtml#FPar26).\n\
    \n[***Listing 5-25***](#9781484213483_Ch05.xhtml#_FPar26). Setting the Value for\
    \ a Medium-Screen Breakpoint that has min and max Values in `_grids.scss`\n\n\
    ```\n@import \"susy\";\n@import \"breakpoint\";\n\n$susy: (\ncolumns: 12,\ngutters:\
    \ 1/5,\nglobal-box-sizing:border-box\n);\n\n// Variables defining breakpoints\
    \ value\n$mediumScreen:480px 750px;\n$largeScreen:1200px;\n\n.page {\n   @include\
    \ breakpoint($largeScreen) {\n   font-size: 1.5em;\n}\n@include breakpoint($mediumScreen){\n\
    \   font-size: 1em;\n}\n}\n```"
  raw: 'Now that you have Susy for Compass installed, the next step is to include
    it in the project. In the previous section of this chapter you learned how to
    include addons through the config.rb file. However, this time you will be creating
    a new project with an addon included since the beginning. For this, you will use
    the compass create command with some additional parameters, as shown in [Listing
    5-15](#9781484213483_Ch05.xhtml#FPar16).


    [***Listing 5-15***](#9781484213483_Ch05.xhtml#_FPar16). The command for Creating
    Compass Project with the Susy Addon


    ```

    compass create sampleSusyProj -r susy -u susy

    ```


    This will output the Compass project as shown in [Figure 5-9](#9781484213483_Ch05.xhtml#Fig9).


    ![9781484213483_Fig05-09.jpg](OEBPS/Images/9781484213483_Fig05-09.jpg)


    [Figure 5-9](#9781484213483_Ch05.xhtml#_Fig9). Output of the compass create command
    with additional parammeters for Susy


    After creating the project, you get two files in SCSS directory: _grid.scss and
    style.scss. Now let’s begin setting up the grid.


    To set up the grid using Susy, the first thing you need is to define all the Susy-specific
    variables needed for this task. These are:


    *   $total-column: The total number of columns

    *   $column-width: Width of each column

    *   $gutter-width: Space between each column

    *   $grid-padding: Space from left and right side for the grid


    You will define these properties in _grid.scss. The first line is to import "susy",
    which is required to pull in all the Susy-related code into _grid.scss.


    For this example, you will assume following values for these variables:


    *   $total-column:12

    *   $column-width:10em

    *   $gutter-width:4em

    *   $grid-padding:4em


    The code should look like [Listing 5-16](#9781484213483_Ch05.xhtml#FPar17).


    [***Listing 5-16***](#9781484213483_Ch05.xhtml#_FPar17). Setting Necessary Parameters
    for Susy


    ```

    @import "susy";


    $susy: (

       columns: 12,

       gutters: 1/5

    );

    ```


    Next, you need context for the grid. To do so, you need to set some element as
    a container element. For this let’s assume that the element you want as a container
    is page. This is done in style.scss, as shown in [Listing 5-17](#9781484213483_Ch05.xhtml#FPar18).


    [***Listing 5-17***](#9781484213483_Ch05.xhtml#_FPar18). Setting an Element as
    Container in style.scss


    ```

    @import "grids";


    .page{

       @include container;

    }

    ```


    This tells Susy that .page will act as a container.


    Showing the Grid Background


    Susy gives you the ability to see the grid columns of a container in a browser.
    This can come handy if you want to know how your grid is performing. This can
    be done by amending a rule, as shown in [Listing 5-18](#9781484213483_Ch05.xhtml#FPar19).


    [***Listing 5-18***](#9781484213483_Ch05.xhtml#_FPar19). Telling Susy to Show
    the Grid


    ```

    @import "grids";


    .page{

       @include container(show overlay);

       Height:500px; //Height has been set manually to shown grid on an empty page

    }

    ```


    The HTML code for this page is shown in [Listing 5-19](#9781484213483_Ch05.xhtml#FPar20).


    [***Listing 5-19***](#9781484213483_Ch05.xhtml#_FPar20). HTML Markup for [Listing
    5-18  ](#9781484213483_Ch05.xhtml#FPar18)


    ```

    <!DOCTYPE html>

    <html>

      <head>

        <title>Sample susy project</title>

        <link rel="stylesheet" type="text/css" href="stylesheets/style.css">

      </head>

      <body>

        <div class="page"></div>

      </body>

    </html>

    ```


    The result of this code is shown in [Figure 5-10](#9781484213483_Ch05.xhtml#Fig10).
    Note that the grids are visible when you hover over the icon in the top-right
    corner.


    ![9781484213483_Fig05-10.jpg](OEBPS/Images/9781484213483_Fig05-10.jpg)


    [Figure 5-10](#9781484213483_Ch05.xhtml#_Fig10). Having a grid overlay


    Next you will set Susy to use the box-sizing model for border-box. You can do
    this by adding this variable to the grid settings, as shown in [Listing 5-20](#9781484213483_Ch05.xhtml#FPar21).


    [***Listing 5-20***](#9781484213483_Ch05.xhtml#_FPar21). Adding a Box-Sizing Model
    to the Grid System Setting


    ```

    @import "susy";


    $susy: (

       columns: 12,

       gutters: 1/5,

       global-box-sizing:border-box

    );

    ```


    While developing a responsive page or application, the first thing that you should
    think about is a completely accessible design. That means regardless of the device
    or its capability, the content should be accessible on your page or application.
    This certainly does not guarantee the same layout and behavior across all devices.


    Now let’s take a look at how you can set breakpoints in Susy. A breakpoint in
    CSS is where the layout changes to suit the size of the viewport. Susy gives you
    flexibility to define as many breakpoints as you want. Consider two breakpoints.
    You will define two variables for medium and large inside _grid.scss, as shown
    in [Listing 5-21](#9781484213483_Ch05.xhtml#FPar22).


    [***Listing 5-21***](#9781484213483_Ch05.xhtml#_FPar22). Defining Breakpoints
    in Susy


    ```

    @import "susy";


    $susy: (

       columns: 12,

       gutters: 1/5,

       global-box-sizing:border-box

    );


    // Variables defning breakpoints

    $mediumScreen:750px;

    $largeScreen:1200px;

    ```


    You might have observed that the example declared only two breakpoints. That is
    because you will build the sample layout with a mobile first mindset, which would
    be accessible across various devices regardless of their capabilities and then
    enhance it for bigger sized viewports.


    For this example, you will use a breakpoint plug-in available at [http://breakpoint-sass.com/](http://breakpoint-sass.com/).
    To start using this, you first need to install the plug-in on your system, as
    shown in [Listing 5-22](#9781484213483_Ch05.xhtml#FPar23) (the output is in [Figure
    5-11](#9781484213483_Ch05.xhtml#Fig11)).


    [***Listing 5-22***](#9781484213483_Ch05.xhtml#_FPar23). Installing the Breakpoint
    Plug-In


    ```

    gem install breakpoint

    ```


    ![9781484213483_Fig05-11.jpg](OEBPS/Images/9781484213483_Fig05-11.jpg)


    [Figure 5-11](#9781484213483_Ch05.xhtml#_Fig11). Installing the breakpoint plug-in


    The next step is to include the plug-in in the config.rb file of your project
    using require "breakpoint.


    After including it in your config file, you need to include it in the SCSS file
    you are working with @import "breakpoint".


    Now you will start using the breakpoint in your code. To do so, let’s start by
    setting font-size to 1.5em for the large-screen breakpoint that you defined earlier,
    as shown in [Listing 5-23](#9781484213483_Ch05.xhtml#FPar24).


    [***Listing 5-23***](#9781484213483_Ch05.xhtml#_FPar24). Setting the Style for
    a Large-Screen Breakpoint in _grids.scss


    ```

    @import "susy";

    @import "breakpoint";


    $susy: (

       columns: 12,

       gutters: 1/5,

       global-box-sizing:border-box

    );


    // Variables defning breakpoints value

    $mediumScreen:750px;

    $largeScreen:1200px;


    .page {

       @include breakpoint($largeScreen) {

          font-size: 1.5em;

       }

    }

    ```


    This code will generate a media query for the larger screen, as shown in [Listing
    5-24](#9781484213483_Ch05.xhtml#FPar25).


    [***Listing 5-24***](#9781484213483_Ch05.xhtml#_FPar25). Output of [Listing 5-23](#9781484213483_Ch05.xhtml#FPar23)
    in style.css


    ```

    @media (min-width: 1200px) {

       /* line 17, ../sass/_grids.scss */

       .page {

          font-size: 1.5em;

       }

    }

    ```


    Now let’s say you wanted to declare a media query with min and max widths. You
    can do this by providing the value in a space-separated format. For this, lets
    modify the value of the $mediumScreen variable. This is shown in [Listing 5-25](#9781484213483_Ch05.xhtml#FPar26).


    [***Listing 5-25***](#9781484213483_Ch05.xhtml#_FPar26). Setting the Value for
    a Medium-Screen Breakpoint that has min and max Values in _grids.scss


    ```

    @import "susy";

    @import "breakpoint";


    $susy: (

    columns: 12,

    gutters: 1/5,

    global-box-sizing:border-box

    );


    // Variables defning breakpoints value

    $mediumScreen:480px 750px;

    $largeScreen:1200px;


    .page {

       @include breakpoint($largeScreen) {

       font-size: 1.5em;

    }

    @include breakpoint($mediumScreen){

       font-size: 1em;

    }

    }

    ```'
  trans: "好的，作为高级文档工程师和翻译员，我将严格遵守您提供的注意事项，将英文文本翻译成符合格式要求的中文译文。\n\n---\n\n\n现在您已经安装了\
    \ `Susy for Compass`，下一步是将其引入到项目中。在本章的前面部分，您已经学习了如何通过 `config.rb` 文件引入插件。不过，这次您将创建一个从一开始就包含了插件的新项目。为此，您需要使用带一些额外参数的\
    \ `compass create` 命令，如清单 5-15 所示。\n\n***清单 5-15***。使用 Susy 插件创建 Compass 项目的命令\n\
    \n```\ncompass create sampleSusyProj -r susy -u susy\n```\n\n这将输出 Compass 项目，如图\
    \ 5-9 所示。\n\n![9781484213483_Fig05-09.jpg](img/9781484213483_Fig05-09.jpg)\n\n\
    图 5-9。为 Susy 添加了额外参数的 `compass create` 命令的输出\n\n创建项目后，您会在 `SCSS` 目录中得到两个文件：`_grid.scss`\
    \ 和 `style.scss`。现在让我们开始设置网格。\n\n要使用 Susy 设置网格，您首先需要为此任务定义所有 Susy 特定的变量。这些变量是：\n\
    \n*   `$total-column`：总列数\n*   `$column-width`：每列的宽度\n*   `$gutter-width`：列之间的间距\n\
    *   `$grid-padding`：网格左侧和右侧的间距\n\n您将在 `_grid.scss` 中定义这些属性。第一行是导入 `\"susy\"`，这是将所有与\
    \ Susy 相关的代码引入 `_grid.scss` 所必需的。\n\n对于此示例，您将假定这些变量具有以下值：\n\n*   `$total-column`：12\n\
    *   `$column-width`：10em\n*   `$gutter-width`：4em\n*   `$grid-padding`：4em\n\n\
    代码应如清单 5-16 所示。\n\n***清单 5-16***。为 Susy 设置必要参数\n\n```\n@import \"susy\";\n\n$susy:\
    \ (\n   columns: 12,\n   gutters: 1/5\n);\n```\n\n接下来，您需要为网格提供上下文。为此，您需要将某个元素设置为容器元素。假设您想要作为容器的元素是\
    \ `page`。这是在 `style.scss` 中完成的，如清单 5-17 所示。\n\n***清单 5-17***。在 `style.scss` 中将元素设置为容器\n\
    \n```\n@import \"grids\";\n\n.page{\n   @include container;\n}\n```\n\n这告诉 Susy\
    \ `.page` 将充当容器。\n\n## 显示网格背景\n\nSusy 使您能够在浏览器中查看容器的网格列。如果您想知道网格的效果，这会非常方便。这可以通过修改一条规则来实现，如清单\
    \ 5-18 所示。\n\n***清单 5-18***。告诉 Susy 显示网格\n\n```\n@import \"grids\";\n\n.page{\n\
    \   @include container(show overlay);\n   Height:500px; // 已手动设置高度以在空白页面上显示网格\n\
    }\n```\n\n此页面的 HTML 代码如清单 5-19 所示。\n\n***清单 5-19***。清单 5-18 的 HTML 标记\n\n```\n\
    <!DOCTYPE html>\n<html>\n  <head>\n    <title>Sample susy project</title>\n  \
    \  <link rel=\"stylesheet\" type=\"text/css\" href=\"stylesheets/style.css\">\n\
    \  </head>\n  <body>\n    <div class=\"page\"></div>\n  </body>\n</html>\n```\n\
    \n这段代码的结果如图 5-10 所示。请注意，当您将鼠标悬停在右上角的图标上时，网格是可见的。\n\n![9781484213483_Fig05-10.jpg](img/9781484213483_Fig05-10.jpg)\n\
    \n图 5-10。显示网格覆盖层\n\n接下来，您将设置 Susy 使用 `border-box` 的 `box-sizing` 模型。您可以通过将此变量添加到网格设置中来实现，如清单\
    \ 5-20 所示。\n\n***清单 5-20***。为网格系统设置添加盒模型设置\n\n```\n@import \"susy\";\n\n$susy:\
    \ (\n   columns: 12,\n   gutters: 1/5,\n   global-box-sizing:border-box\n);\n\
    ```\n\n在开发响应式页面或应用程序时，您首先应该考虑的是完全可访问的设计。这意味着无论设备或其性能如何，内容都应该在您的页面或应用程序上可访问。这当然不能保证在所有设备上都有相同的布局和行为。\n\
    \n现在让我们看看如何在 Susy 中设置断点。CSS 中的断点是指布局发生变化以适应视口大小的地方。Susy 允许您灵活地定义任意数量的断点。考虑两个断点。您将在\
    \ `_grid.scss` 中为中屏幕和大屏幕定义两个变量，如清单 5-21 所示。\n\n***清单 5-21***。在 Susy 中定义断点\n\n\
    ```\n@import \"susy\";\n\n$susy: (\n   columns: 12,\n   gutters: 1/5,\n   global-box-sizing:border-box\n\
    );\n\n// 定义断点的变量\n$mediumScreen:750px;\n$largeScreen:1200px;\n```\n\n您可能已经注意到，该示例只声明了两个断点。这是因为您将以移动优先的理念构建示例布局，这使得布局在各种设备上均可访问，无论其性能如何，然后再针对更大尺寸的视口进行增强。\n\
    \n对于此示例，您将使用位于 [`breakpoint-sass.com/`](http://breakpoint-sass.com/) 的断点插件。要开始使用它，首先需要在系统上安装该插件，如清单\
    \ 5-22 所示（输出见图 5-11）。\n\n***清单 5-22***。安装断点插件\n\n```\ngem install breakpoint\n\
    ```\n\n![9781484213483_Fig05-11.jpg](img/9781484213483_Fig05-11.jpg)\n\n图 5-11。安装断点插件\n\
    \n下一步是使用 `require \"breakpoint\"` 将该插件包含到项目的 `config.rb` 文件中。\n\n将其包含到配置文件后，您需要使用\
    \ `@import \"breakpoint\"` 将其包含到您正在使用的 SCSS 文件中。\n\n现在，您将开始在代码中使用断点。为此，让我们先为您之前定义的大屏幕断点设置\
    \ `font-size` 为 `1.5em`，如清单 5-23 所示。\n\n***清单 5-23***。在 `_grids.scss` 中为大屏幕断点设置样式\n\
    \n```\n@import \"susy\";\n@import \"breakpoint\";\n\n$susy: (\n   columns: 12,\n\
    \   gutters: 1/5,\n   global-box-sizing:border-box\n);\n\n// 定义断点值的变量\n$mediumScreen:750px;\n\
    $largeScreen:1200px;\n\n.page {\n   @include breakpoint($largeScreen) {\n    \
    \  font-size: 1.5em;\n   }\n}\n```\n\n这段代码将为更大的屏幕生成一个媒体查询，如清单 5-24 所示。\n\n***清单\
    \ 5-24***。清单 5-23 在 `style.css` 中的输出\n\n```\n@media (min-width: 1200px) {\n  \
    \ /* line 17, ../sass/_grids.scss */\n   .page {\n      font-size: 1.5em;\n  \
    \ }\n}\n```\n\n现在，假设您想要声明一个具有最小和最大宽度的媒体查询。您可以通过以空格分隔的格式提供值来实现。为此，让我们修改 `$mediumScreen`\
    \ 变量的值。如清单 5-25 所示。\n\n***清单 5-25***。在 `_grids.scss` 中为具有最小和最大值的中屏幕断点设置值\n\n```\n\
    @import \"susy\";\n@import \"breakpoint\";\n\n$susy: (\ncolumns: 12,\ngutters:\
    \ 1/5,\nglobal-box-sizing:border-box\n);\n\n// 定义断点值的变量\n$mediumScreen:480px 750px;\n\
    $largeScreen:1200px;\n\n.page {\n   @include breakpoint($largeScreen) {\n   font-size:\
    \ 1.5em;\n}\n@include breakpoint($mediumScreen){\n   font-size: 1em;\n}\n}\n```\n"
- fmt: "[***Listing 5-26***](#9781484213483_Ch05.xhtml#_FPar27). Output of [Listing\
    \ 5-25 in style.css](#9781484213483_Ch05.xhtml#FPar25)\n\n```\n@media (min-width:\
    \ 480px) and (max-width: 750px) {\n/* line 17, ../sass/_grids.scss */\n.page {\n\
    font-size: 1em;\n}\n}\n```\n\nYou can add a media type to the media query definition.\
    \ The media type value must be the first parameter of the media query. Developers\
    \ omit the `all` media type for creating more concise media queries. If you want\
    \ the `all` media type to always be available, you need to set `$breakpoint-force-media-all:\
    \ true;`\n\nYou can see such advanced media query in [Listing 5-27](#9781484213483_Ch05.xhtml#FPar28).\n\
    \n[***Listing 5-27***](#9781484213483_Ch05.xhtml#_FPar28). Advanced Media Query\
    \ Specifying Media Type in the Beginning of `in_grids.scss`\n\n```\n@import \"\
    susy\";\n@import \"breakpoint\";\n\n$susy: (\ncolumns: 12,\ngutters: 1/5,\nglobal-box-sizing:border-box\n\
    );\n\n// Variables defning breakpoints value\n$mediumScreen:480px 750px;\n$largeScreen:1200px;\n\
    $advancedQuery: 'not screen' 320px;\n\n.page {\n   @include breakpoint($largeScreen)\
    \ {\n      font-size: 1.5em;\n   }\n   @include breakpoint($mediumScreen){\n \
    \     font-size: 1em;\n   }\n   @include breakpoint($advancedQuery) {\n      color:#777;\n\
    \   }\n}\n```\n\n***Listing 5-28***. Output of [Listing 5-27](#9781484213483_Ch05.xhtml#FPar27)\
    \ in `style.css`\n\n```\n@media (min-width: 1200px) {\n  /* line 19, ../sass/_grids.scss\
    \ */\n  .page {\n    font-size: 1.5em;\n  }\n}\n@media (min-width: 480px) and\
    \ (max-width: 750px) {\n  /* line 19, ../sass/_grids.scss */\n  .page {\n    font-size:\
    \ 1em;\n  }\n}\n@media not screen and (min-width: 320px) {\n  /* line 19, ../sass/_grids.scss\
    \ */\n  .page {\n    color: #777;\n  }\n}\n```\n\nMultiple features can be combined\
    \ to form a compound media query. This allows many features to be evaluated, as\
    \ shown in [Listing 5-29](#9781484213483_Ch05.xhtml#FPar30).\n\n[***Listing 5-29***](#9781484213483_Ch05.xhtml#_FPar30).\
    \ Example Demonstrating a Compound Media Query in `_grid.scss`\n\n```\n@import\
    \ \"susy\";\n@import \"breakpoint\";\n\n$susy: (\n   columns: 12,\n   gutters:\
    \ 1/5,\n   global-box-sizing:border-box\n);\n\n// Variables defning breakpoints\
    \ value\n$mediumScreen:480px 750px;\n$largeScreen:1200px;\n$advancedQuaery: 'not\
    \ screen' 320px;\n$compoundQuery: print (orientation landscape) (min-width 520px);\n\
    \n.page {\n   @include breakpoint($largeScreen) {\n      font-size: 1.5em;\n \
    \  }\n   @include breakpoint($mediumScreen){\n      font-size: 1em;\n   }\n  \
    \ @include breakpoint($advancedQuery) {\n      color:#777;\n   }\n   @include\
    \ breakpoint($compoundQuery) {\n      font-weight: bold;\n   }\n}\n```\n\n***Listing\
    \ 5-30***. Output of [Listing 5-29](#9781484213483_Ch05.xhtml#FPar30)\n\n```\n\
    @media (min-width: 1200px) {\n  /* line 19, ../sass/_grids.scss */\n  .page {\n\
    \    font-size: 1.5em;\n  }\n}\n@media (min-width: 480px) and (max-width: 750px)\
    \ {\n  /* line 19, ../sass/_grids.scss */\n  .page {\n    font-size: 1em;\n  }\n\
    }\n@media not screen and (min-width: 320px) {\n  /* line 19, ../sass/_grids.scss\
    \ */\n  .page {\n    color: #777;\n  }\n}\n@media print and (orientation: landscape)\
    \ and (min-width: 520px) {\n  /* line 19, ../sass/_grids.scss */\n  .page {\n\
    \    font-weight: bold;\n  }\n}\n```\n\n### Compass and CSS3\n\nCompass has become\
    \ favorite with many developers because it allows them to write a CSS3 features\
    \ through predefined mixins in single line syntax, which when compiled, generates\
    \ a stack of properties with proper vendor-prefixing. This is useful as it saves\
    \ lot of time and the developers don’t have to remember all the syntax. In this\
    \ section, you will look into some of these CSS3 features supported by Compass.\n\
    \nFor this, you will first create a new Compass project, as shown in [Listing\
    \ 5-31](#9781484213483_Ch05.xhtml#FPar32).\n\n[***Listing 5-31***](#9781484213483_Ch05.xhtml#_FPar32).\
    \ Creating a New Compass Project\n\n```\ncompass create effects\n```\n\nAfter\
    \ creating the project you will create an HTML file where you can see the output\
    \ of all the CSS3 features of Compass you are checking. The structure of this\
    \ file would look like [Listing 5-32](#9781484213483_Ch05.xhtml#FPar33)."
