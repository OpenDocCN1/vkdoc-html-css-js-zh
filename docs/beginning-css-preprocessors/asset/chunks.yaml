    \ Compass 扩展\n- 本章小结\n\n索引\n\n## 关于作者\n\n![9781484213483_unFM-01.jpg](img/9781484213483_unFM-01.jpg)\n\
    \n**阿尼鲁德·普拉布**（**Anirudh Prabhu**）是一位拥有六年以上行业经验的软件工程师。他专精于 HTML5、CSS3、PHP、jQuery、Twitter\
    \ Bootstrap、Less 和 Sass 等技术，同时了解 CoffeeScript 和 AngularJS。除 Web 开发外，他还参与过培训材料的编写以及这些技术的教程撰写。\n\
    \n## 关于技术审校者\n\n**洛凯什·耶尔**（**Lokesh Iyer**）在孟买 KC 学院获得了信息技术学士学位，并在孟买 Sydenham\
    \ 学院取得了 MBA 学位。他是 SI Technologies 的创始人兼董事，该公司致力于提供硬件和软件解决方案，以及网站推广和安全解决方案。在过去三年中，他带领团队完成了\
    \ 60 多个涉及 HTML5、CSS3、JavaScript、jQuery、PHP、C#、Android 和 MySQL/SQLite 数据库的项目。除了商业项目之外，他还在\
    \ KC 学院的信息技术本科项目中担任客座教授。\n\n## 致谢\n\n首先，我要衷心感谢 Apress 出色的团队为我提供了撰写本书的绝佳机会。当 Celestin\
    \ 通过 LinkedIn “发现” 我并询问我是否愿意写一本书时，这听起来像是一项直截了当且轻松的任务。在接下来的一个月里，他耐心地指导我完成了为本书准备初始提案的整个过程，并帮助我最终确定了它。随后，当我开始撰写各章节的实际工作时，Rita\
    \ 始终陪伴在旁。她就像一位 Scrum 大师，随时提供帮助。即使我的进度落后，她也会温柔地督促我，确保我完成所有必要的工作以赶上进度，并以可交付的增量形式提交章节。谢谢\
    \ Celestin 和 Rita 没有放弃我！\n\n我还要感谢 Matt Moodie 以及 Apress 在幕后辛勤工作的大型团队，感谢他们所有的努力。此外，审校者的审阅反馈和关键意见是作者的生命线——这是对一个仍相当粗糙的产品给出的第一份反馈。我衷心感谢洛凯什·耶尔（Lokesh\
    \ Iyer）的技术审校。\n\n我无法充分感谢我的专业网络多年来丰富我的学习之旅——我的前雇主、客户、经理、同事、团队成员、学生、我博客的读者、讲座的听众，以及其中最崇高的一群人——志愿者伙伴们。感谢你们提供的所有支持和学习机会，并让我每天都成为更好的专业人士。\n\
    \n最后，尽管编辑团队和审校者付出了勤奋的努力，但本书中的所有错误和不足之处，我必须承担责任。欢迎告诉我如何能让本书变得更好。\n\n## 简介\n\nCSS\
    \ 预处理器在几年前开始流行。这个概念让我着迷：允许使用包含变量、函数、混入（mixins）等一或多个特性的预处理器文件。在开发完成后，这些特殊文件会被编译成所有\
    \ Web 浏览器都能理解的常规 CSS 文件。\n"
- fmt: "# 排版后的内容\n\nBeing a believer of phrase “if it’s not broken, don’t fix it,”\
    \ I avoided using CSS preprocessors. The initial thought that would come to my\
    \ mind was, “Why add unnecessary processes to my workflow?”. Also, I feared the\
    \ steep learning curve and the command-line interface provided me another reason\
    \ to avoid CSS preprocessors.\n\nFinally, after watching several podcasts and\
    \ reading through many articles, I had an “a-ha” moment. It made me realize that,\
    \ “Wow, I should be incorporating this in my workflow!”.\n\nSince then, I’ve been\
    \ using `Sass` and `Less` in my projects, and it seems to have made my development\
    \ a lot simpler and more efficient. In this book, you will learn how both of these\
    \ preprocessors work.\n\nYou’ll first start by learning about the concept of preprocessors\
    \ and how they work. You also learn about the popular flavors of preprocessors\
    \ available on the market. You then look into the GUI-based tools available for\
    \ people who are not familiar with command-line interfaces.\n\nAs the chapters\
    \ progress, you will learn all about these two preprocessors—`Sass` and `Less`—and\
    \ learn about a popular framework based on `Sass` called `Compass`.\n\nThe knowledge\
    \ shared in this book can help you improve your productivity and write maintainable\
    \ and scalable CSS code.\n\n# Chapter 1\n\n![image](OEBPS/Images/frontdot.jpg)\n\
    \n## Introduction to Preprocessors\n\n`HTML5` and `CSS3` are changing how web\
    \ pages are designed. `CSS3` provided web developers with advanced features such\
    \ as gradients, transitions, and animations, etc. However, these new features\
    \ increased the complexity of CSS code, thus making it more difficult to maintain.\n\
    \nBesides the complexity introduced by `CSS3`, writing CSS may turn painful with\
    \ time, because programmers have to perform many of the same activities over and\
    \ over again (such as having to look up color values in CSS and margin/padding\
    \ declarations). These small repetitive tasks add up to quite a bit of inefficiency.\
    \ Preprocessors are the solution to these, and a handful of other, inefficiencies.\n\
    \nCSS preprocessors extend CSS with modern programming-language concepts. In order\
    \ to use `Sass` (Syntactically Awesome Stylesheets), you must know how to code\
    \ in CSS. CSS preprocessors allow you to use variables, functions, operations,\
    \ and even rule or selector nesting while coding your CSS. With CSS preprocessors,\
    \ you can apply the “Don’t Repeat Yourself” (DRY) principle to your CSS code.\
    \ Following the DRY principle helps you avoid code repetition.\n\n## What Are\
    \ Preprocessors?\n\nA preprocessor takes one form of data and converts it to another.\
    \ In the context of CSS, `Less` and `Sass` are popular preprocessor languages,\
    \ and they take input in the `Less` or `SCSS` format and produce processed CSS.\n\
    \nThese CSS preprocessors empower CSS by removing the inefficiencies and making\
    \ web sites easier and more logical to build. The increase in popularity of preprocessors\
    \ led to the rise of different frameworks based on them; one of the more popular\
    \ is `Compass`.\n\n[Figure 1-1](#9781484213483_Ch01.xhtml#Fig1) shows how a preprocessor\
    \ takes a preprocessor-formatted file and translates it to CSS that the browser\
    \ understands.\n\n![9781484213483_Fig01-01.jpg](OEBPS/Images/9781484213483_Fig01-01.jpg)\n\
    \n[Figure 1-1](#9781484213483_Ch01.xhtml#_Fig1). Preprocessor-friendly file being\
    \ translated to normal CSS\n\nWith a preprocessor, you can structure CSS similar\
    \ to other languages like `PHP` or `JavaScript`. Thus, a preprocessor brings peace\
    \ of mind to the developer. It lets you write code that’s future-proof and easily\
    \ maintainable, thus saving time and energy.\n\nPreprocessors are extensions of\
    \ CSS, which means that valid CSS code is valid preprocessor code. Developers\
    \ familiar with CSS won’t have a learning curve while learning any preprocessor.\n\
    \n## Why Use Preprocessors?\n\nCSS uses a declarative form of programming. This\
    \ means that the styles that you write in the code are used directly by the browser,\
    \ without any compiling.\n\nMany developers prefer to write stylesheets by hand.\
    \ They believe that preprocessors would add extra complexity to their workflow\
    \ or would have a steep learning curve. But in reality, CSS preprocessors make\
    \ your daily work a lot easier. This book shows you how preprocessors can be more\
    \ efficient for writing CSS without disturbing your workflow.\n\nLet’s consider\
    \ an example where you need to replace multiple instances of a color that’s used\
    \ sitewide by finding it one instance at a time. Wouldn’t it be great if CSS could\
    \ simplify this process? Something like [Listing 1-1](#9781484213483_Ch01.xhtml#FPar1)\
    \ would be an example.\n\n**[Listing 1-1](#9781484213483_Ch01.xhtml#_FPar1). Reusable\
    \ Variable for Color**\n\n```\n$site-color:#eee;\n\na {\n        color: $site-color;\n\
    }\n#topBar {\n        background-color: $site-color;\n        color:#fff;\n}\n\
    ```\n\nWith a preprocessor, changing a value in one place changes the entire stylesheet.\
    \ This is shown in [Listing 1-2](#9781484213483_Ch01.xhtml#FPar2).\n\n**[Listing\
    \ 1-2](#9781484213483_Ch01.xhtml#_FPar2). Output of [Listing 1-1](#9781484213483_Ch01.xhtml#FPar1)**\n\
    \n```\na {\n  color: #eee;\n}\n\n#topBar {\n  background-color: #eee;\n  color:\
    \ #fff;\n}\n```\n\nLet’s consider another example of code repetition. Many times\
    \ there are blocks of code used at various locations in your stylesheet, as shown\
    \ in [Listing 1-3](#9781484213483_Ch01.xhtml#FPar3).\n\n**[Listing 1-3](#9781484213483_Ch01.xhtml#_FPar3).\
    \ Repeated Code Block**\n\n```\np{\n        padding-bottom:45px;\n        text-align:center;\n\
    }\nfooter {\n        padding-bottom:45px;\n        text-align:center;\n}\n```\n\
    \nWith preprocessors, you can put these redundant rules into a *mixin*, which\
    \ is defined once and can be included as needed. This is shown in [Listing 1-4](#9781484213483_Ch01.xhtml#FPar4).\n\
    \n**[Listing 1-4](#9781484213483_Ch01.xhtml#_FPar4). Creating and Using a Reusable\
    \ Code Block in the Preprocessor**\n\n```\n@mixin containerSettings {\n      \
    \  padding-bottom: 45px;\n        text-align:center;\n}\np {\n        @include\
    \ containerSettings;\n}\nfooter {\n        @include containerSettings;\n}\n```\n\
    \n**[Listing 1-5](#9781484213483_Ch01.xhtml#FPar4). Output of [Listing 1-4](#9781484213483_Ch01.xhtml#FPar4)**\n\
    \n```\np {\n  padding-bottom: 45px;\n  text-align: center;\n}\n\nfooter {\n  padding-bottom:\
    \ 45px;\n  text-align: center;\n}\n```\n\nCSS, which is the foundation of all\
    \ preprocessors, has a steep learning curve when it comes to understanding how\
    \ different properties work, understanding cascading, browser support for various\
    \ properties, the selectors, the quirks, and so forth. In addition to all the\
    \ previous points, consider that maintaining stylesheets in today’s complex interfaces\
    \ is a big challenge too.\n\nMost of the time, stylesheets are immensely repetitive,\
    \ with properties or groupings of properties, etc. The typical CSS file is a linear\
    \ document. This makes a programmer from an object-oriented domain go crazy.\n\
    \nAs per the DRY principle: *Every piece of knowledge must have a single, unambiguous,\
    \ authoritative representation in a system.*\n\nThe simplest explanation of this\
    \ is that redundancy in code can result in failure and can create confusion for\
    \ developers. CSS does not follow the DRY principle. Most of the times, CSS files\
    \ will contain repeated rules, declarations, and values. Developers are constantly\
    \ writing the same snippets of code throughout their stylesheets.\n\nCSS lacks\
    \ features like variables, symbolic constants, conditionals, expressions over\
    \ variables, and so on, that are available in all other programming languages.\n\
    \nThe CSS preprocessor sits between your preprocessor-friendly file and the compiled\
    \ CSS files, which will be served to the browser. CSS preprocessors allow you\
    \ to write code as per the DRY principle, making it faster, efficient, and maintainable.\
    \ The code is then compiled into regular CSS files via the command line or an\
    \ application."
  raw: 'Being a believer of phrase “if it’s not broken, don’t fix it,” I avoided using
    CSS preprocessors. The initial thought that would come to my mind was, “Why add
    unnecessary processes to my workflow?”. Also, I feared the steep learning curve
    and the command-line interface provided me another reason to avoid CSS preprocessors.


    Finally, after watching several podcasts and reading through many articles, I
    had an “a-ha” moment. It made me realize that, “Wow, I should be incorporating
    this in my workflow!”.


    Since then, I’ve been using Sass and Less in my projects, and it seems to have
    made my development a lot simpler and more efficient. In this book, you will learn
    how both of these preprocessors work.


    You’ll first start by learning about the concept of preprocessors and how they
    work. You also learn about the popular flavors of preprocessors available on the
    market. You then look into the GUI-based tools available for people who are not
    familiar with command-line interfaces.


    As the chapters progress, you will learn all about these two preprocessors—Sass
    and Less—and learn about a popular framework based on Sass called Compass.


    The knowledge shared in this book can help you improve your productivity and write
    maintainable and scalable CSS code.


    CHAPTER 1


    ![image](OEBPS/Images/frontdot.jpg)


    Introduction to Preprocessors


    HTML5 and CSS3 are changing how web pages are designed. CSS3 provided web developers
    with advanced features such as gradients, transitions, and animations, etc. However,
    these new features increased the complexity of CSS code, thus making it more difficult
    to maintain.


    Besides the complexity introduced by CSS3, writing CSS may turn painful with time,
    because programmers have to perform many of the same activities over and over
    again (such as having to look up color values in CSS and margin/padding declarations).
    These small repetitive tasks add up to quite a bit of inefficiency. Preprocessors
    are the solution to these, and a handful of other, inefficiencies.


    CSS preprocessors extend CSS with modern programming-language concepts. In order
    to use Sass (Syntactically Awesome Stylesheets), you must know how to code in
    CSS. CSS preprocessors allow you to use variables, functions, operations, and
    even rule or selector nesting while coding your CSS. With CSS preprocessors, you
    can apply the “Don’t Repeat Yourself” (DRY) principle to your CSS code. Following
    the DRY principle helps you avoid code repetition.


    What Are Preprocessors?


    A preprocessor takes one form of data and converts it to another. In the context
    of CSS, Less and Sass are popular preprocessor languages, and they take input
    in the Less or SCSS format and produce processed CSS.


    These CSS preprocessors empower CSS by removing the inefficiencies and making
    web sites easier and more logical to build. The increase in popularity of preprocessors
    led to the rise of different frameworks based on them; one of the more popular
    is Compass.


    [Figure 1-1](#9781484213483_Ch01.xhtml#Fig1) shows how a preprocessor takes a
    preprocessor-formatted file and translates it to CSS that the browser understands.


    ![9781484213483_Fig01-01.jpg](OEBPS/Images/9781484213483_Fig01-01.jpg)


    [Figure 1-1](#9781484213483_Ch01.xhtml#_Fig1). Preprocessor-friendly file being
    translated to normal CSS


    With a preprocessor, you can structure CSS similar to other languages like PHP
    or JavaScript. Thus, a preprocessor brings peace of mind to the developer. It
    lets you write code that’s future-proof and easily maintainable, thus saving time
    and energy.


    Preprocessors are extensions of CSS, which means that valid CSS code is valid
    preprocessor code. Developers familiar with CSS won’t have a learning curve while
    learning any preprocessor.


    Why Use Preprocessors?


    CSS uses a declarative form of programming. This means that the styles that you
    write in the code are used directly by the browser, without any compiling.


    Many developers prefer to write stylesheets by hand. They believe that preprocessors
    would add extra complexity to their workflow or would have a steep learning curve.
    But in reality, CSS preprocessors make your daily work a lot easier. This book
    shows you how preprocessors can be more efficient for writing CSS without disturbing
    your workflow.


    Let’s consider an example where you need to replace multiple instances of a color
    that’s used sitewide by finding it one instance at a time. Wouldn’t it be great
    if CSS could simplify this process? Something like [Listing 1-1](#9781484213483_Ch01.xhtml#FPar1)
    would be an example.


    [***Listing 1-1***](#9781484213483_Ch01.xhtml#_FPar1). Reusable Variable for Color


    ```

    $site-color:#eee;


    a {

            color: $site-color;

    }

    #topBar {

            background-color: $site-color;

            color:#fff;

    }

    ```


    With a preprocessor, changing a value in one place changes the entire stylesheet.
    This is shown in [Listing 1-2](#9781484213483_Ch01.xhtml#FPar2).


    [***Listing 1-2***](#9781484213483_Ch01.xhtml#_FPar2). Output of [Listing 1-1](#9781484213483_Ch01.xhtml#FPar1)


    ```

    a {

      color: #eee;

    }


    #topBar {

      background-color: #eee;

      color: #fff;

    }

    ```


    Let’s consider another example of code repetition. Many times there are blocks
    of code used at various locations in your stylesheet, as shown in [Listing 1-3](#9781484213483_Ch01.xhtml#FPar3).


    [***Listing 1-3***](#9781484213483_Ch01.xhtml#_FPar3). Repeated Code Block


    ```

    p{

            padding-bottom:45px;

            text-align:center;

    }

    footer {

            padding-bottom:45px;

            text-align:center;

    }

    ```


    With preprocessors, you can put these redundant rules into a *mixin*, which is
    defined once and can be included as needed. This is shown in [Listing 1-4](#9781484213483_Ch01.xhtml#FPar4).


    [***Listing 1-4***](#9781484213483_Ch01.xhtml#_FPar4). Creating and Using a Reusable
    Code Block in the Preprocessor


    ```

    @mixin containerSettings {

            padding-bottom: 45px;

            text-align:center;

    }

    p {

            @include containerSettings;

    }

    footer {

            @include containerSettings;

    }

    ```


    ***Listing 1-5***. Output of [Listing 1-4](#9781484213483_Ch01.xhtml#FPar4)


    ```

    p {

      padding-bottom: 45px;

      text-align: center;

    }


    footer {

      padding-bottom: 45px;

      text-align: center;

    }

    ```


    CSS, which is the foundation of all preprocessors, has a steep learning curve
    when it comes to understanding how different properties work, understanding cascading,
    browser support for various properties, the selectors, the quirks, and so forth.
    In addition to all the previous points, consider that maintaining stylesheets
    in today’s complex interfaces is a big challenge too.


    Most of the time, stylesheets are immensely repetitive, with properties or groupings
    of properties, etc. The typical CSS file is a linear document. This makes a programmer
    from an object-oriented domain go crazy.


    As per the DRY principle: *Every piece of knowledge must have a single, unambiguous,
    authoritative representation in a system.*


    The simplest explanation of this is that redundancy in code can result in failure
    and can create confusion for developers. CSS does not follow the DRY principle.
    Most of the times, CSS files will contain repeated rules, declarations, and values.
    Developers are constantly writing the same snippets of code throughout their stylesheets.


    CSS lacks features like variables, symbolic constants, conditionals, expressions
    over variables, and so on, that are available in all other programming languages.


    The CSS preprocessor sits between your preprocessor-friendly file and the compiled
    CSS files, which will be served to the browser. CSS preprocessors allow you to
    write code as per the DRY principle, making it faster, efficient, and maintainable.
    The code is then compiled into regular CSS files via the command line or an application.'
  trans: "\n# 排版后的内容\n\n“如果没坏，就别修”，秉持着这一信条，我曾一度避免使用 CSS 预处理器。我最初的想法是：“为什么要在我的工作流中增加不必要的流程呢？”此外，我也担心陡峭的学习曲线，而命令行界面则给了我另一个拒绝\
    \ CSS 预处理器的理由。\n\n最终，在观看了一些播客并阅读了大量文章后，我豁然开朗。这让我意识到：“哇，我应该把这项技术融入我的工作流中！”\n\n\
    从那时起，我就在项目中开始使用 `Sass` 和 `Less`，它们似乎让我的开发工作变得简单高效得多。通过本书，你将了解这两种预处理器是如何工作的。\n\n\
    你将首先学习预处理器的概念及其工作原理。你还会了解市面上几种流行的预处理器。接着，我们将探讨一些基于图形用户界面的工具，这些工具适用于不熟悉命令行界面的用户。\n\
    \n随着章节的深入，你将全面了解这两种预处理器——`Sass` 和 `Less`，并学习一个基于 `Sass` 的流行框架 `Compass`。\n\n本书分享的知识将帮助你提高生产力，编写出可维护且可扩展的\
    \ CSS 代码。\n\n# 第一章\n\n![image](img/frontdot.jpg)\n\n## 预处理器简介\n\n`HTML5` 和 `CSS3`\
    \ 正在改变网页的设计方式。`CSS3` 为 Web 开发者提供了诸如渐变、过渡和动画等高级特性。然而，这些新特性也增加了 CSS 代码的复杂性，使其更难以维护。\n\
    \n除了 `CSS3` 引入的复杂性，随着时间的推移，手写 CSS 可能会变得痛苦，因为程序员不得不反复执行许多相同的操作（例如在 CSS 中查找颜色值以及声明外边距/内边距）。这些微小的重复性任务累积起来，造成了相当程度的低效率。预处理器正是解决这些以及其他低效问题的方案。\n\
    \nCSS 预处理器通过引入现代编程语言的概念来扩展 CSS。要使用 `Sass`（语法上很棒的样式表），你必须先掌握如何用 CSS 编码。CSS 预处理器允许你在编写\
    \ CSS 时使用变量、函数、运算，甚至是规则或选择器的嵌套。通过 CSS 预处理器，你可以将“不要重复自己”（DRY）原则应用到你的 CSS 代码中。遵循\
    \ DRY 原则有助于避免代码重复。\n\n## 什么是预处理器？\n\n预处理器接收一种形式的数据并将其转换为另一种形式。在 CSS 的语境下，`Less`\
    \ 和 `Sass` 是流行的预处理器语言，它们接收 `Less` 或 `SCSS` 格式的输入，并生成处理后的 CSS。\n\n这些 CSS 预处理器通过消除低效之处，使网站的构建更简单、更符合逻辑，从而增强了\
    \ CSS 的能力。预处理器的流行也催生了基于它们的各种框架；其中较为流行的一个是 `Compass`。\n\n图 1-1 展示了预处理器是如何获取预处理格式的文件并将其转换为浏览器能理解的\
    \ CSS 的。\n\n![9781484213483_Fig01-01.jpg](img/9781484213483_Fig01-01.jpg)\n\n\
    图 1-1. 预处理器友好的文件被转换为普通 CSS\n\n借助预处理器，你可以像使用 `PHP` 或 `JavaScript` 等其他语言一样来组织 CSS。因此，预处理器给开发者带来了安心。它让你编写出的代码具有前瞻性且易于维护，从而节省时间和精力。\n\
    \n预处理器是 CSS 的扩展，这意味着有效的 CSS 代码也是有效的预处理器代码。熟悉 CSS 的开发者在学习任何预处理器时都不会有任何学习曲线。\n\n\
    ## 为什么使用预处理器？\n\nCSS 使用声明式编程形式。这意味着你在代码中编写的样式会直接被浏览器使用，无需任何编译。\n\n许多开发者更倾向于手写样式表。他们认为预处理器会给他们的工作流增加额外的复杂性，或者存在陡峭的学习曲线。但实际上，CSS\
    \ 预处理器能让你的日常工作轻松很多。本书将向你展示预处理器如何在不干扰你工作流的情况下，更高效地编写 CSS。\n\n让我们考虑一个例子：你需要逐个查找并替换站点范围内使用的某个颜色的多个实例。如果\
    \ CSS 能简化这个过程，岂不是很棒？类似于清单 1-1 所示就是一个例子。\n\n**清单 1-1. 颜色可复用变量**\n\n```\n$site-color:#eee;\n\
    \na {\n        color: $site-color;\n}\n#topBar {\n        background-color: $site-color;\n\
    \        color:#fff;\n}\n```\n\n使用预处理器，只需更改一个地方的值就能改变整个样式表。如清单 1-2 所示。\n\n**清单\
    \ 1-2. 清单 1-1 的输出**\n\n```\na {\n  color: #eee;\n}\n\n#topBar {\n  background-color:\
    \ #eee;\n  color: #fff;\n}\n```\n\n让我们再考虑一个代码重复的例子。很多时候，样式表中会有多个地方使用相同的代码块，如清单\
    \ 1-3 所示。\n\n**清单 1-3. 重复的代码块**\n\n```\np{\n        padding-bottom:45px;\n   \
    \     text-align:center;\n}\nfooter {\n        padding-bottom:45px;\n        text-align:center;\n\
    }\n```\n\n使用预处理器，你可以将这些冗余的规则放入一个*混入 (mixin)* 中，该混入只需定义一次，并可按需引入。如清单 1-4 所示。\n\n\
    **清单 1-4. 在预处理器中创建和使用可复用代码块**\n\n```\n@mixin containerSettings {\n        padding-bottom:\
    \ 45px;\n        text-align:center;\n}\np {\n        @include containerSettings;\n\
    }\nfooter {\n        @include containerSettings;\n}\n```\n\n**清单 1-5. 清单 1-4 的输出**\n\
    \n```\np {\n  padding-bottom: 45px;\n  text-align: center;\n}\n\nfooter {\n  padding-bottom:\
    \ 45px;\n  text-align: center;\n}\n```\n\n作为所有预处理器基础的 CSS，在理解不同属性的工作原理、层叠机制、浏览器对各种属性的支持、选择器、怪癖行为等方面，本身就有一个陡峭的学习曲线。除了前述所有要点之外，还要考虑到在当今复杂的界面中维护样式表也是一个巨大的挑战。\n\
    \n大多数时候，样式表都非常重复，充斥着属性或属性组等。典型的 CSS 文件是一个线性文档。这足以让来自面向对象领域的程序员抓狂。\n\n根据 DRY 原则：*系统中的每一份知识都必须有单一、明确、权威的表述。*\n\
    \n对此最简单的解释是，代码中的冗余可能导致失败，并给开发者带来困惑。CSS 不遵循 DRY 原则。大多数时候，CSS 文件会包含重复的规则、声明和值。开发者不断地在样式表中编写相同的代码片段。\n\
    \nCSS 缺乏其他所有编程语言都具备的特性，如变量、符号常量、条件语句、基于变量的表达式等。\n\nCSS 预处理器位于你的预处理器友好文件和将提供给浏览器的已编译\
    \ CSS 文件之间。CSS 预处理器允许你按照 DRY 原则编写代码，使其更快速、高效且易于维护。然后，代码通过命令行或应用程序被编译成常规的 CSS 文件。\n"
- fmt: '# 排版后的内容


    Consider the example in [Listing 1-6](#9781484213483_Ch01.xhtml#FPar6). Modern
    browsers support `RGBA` (Red Green Blue Alpha) and `HSLA` (Hue Saturation Lightness
    Alpha) color values. However, you need to provide a fallback for older browsers.
    A common practice is to declare a hex value first and then the `RGBA` or `HSLA`
    value.


    [***Listing 1-6***](#9781484213483_Ch01.xhtml#_FPar6). Supporting a New Color
    Format in All Browsers Using CSS


    ```

    .container {

      background-color: #000;

      background-color: rgba(0,0,0, 0.9);

    }

    ```


    With preprocessors, this job can be done easily. If the same task were to be completed
    using the `Sass` precompiler, it would be done as shown in [Listing 1-7](#9781484213483_Ch01.xhtml#FPar7).


    [***Listing 1-7***](#9781484213483_Ch01.xhtml#_FPar7). `Sass` Version of [Listing
    1-6](#9781484213483_Ch01.xhtml#FPar6)


    ```

    $black:#000;

    .container {

            background-color: $black;

            background-color: rgba($black, 0.9);

    }

    ```


    The preprocessor does all the calculations related to `RGBA` values for you.


    With arrival of `CSS3` support in modern browsers, people are not using images
    as much and are going with pure `CSS`. However, each browser has its own implementation
    of these features, and therefore these require vendor prefixes and different syntaxes.
    You can see a simple example of this in [Listing 1-8](#9781484213483_Ch01.xhtml#FPar8).


    [***Listing 1-8***](#9781484213483_Ch01.xhtml#_FPar8). Implementation of `CSS`
    Features for Different Browsers


    ```

    .container {

            -webkit-border-radius: 10px;

            -moz-border-radius: 10px;

            -ms-border-radius: 10px;

            -o-border-radius: 10px;

            border-radius: 10px;

    }

    ```


    Preprocessors make this job easier by allowing you to declare this code in a reusable
    component called a *mixin* (covered in coming chapters) and then use it directly
    in your code.


    This example assumes that this reusable mixin is named `rounded-corners`. The
    code for this in the `Sass` preprocessor would look like [Listing 1-9](#9781484213483_Ch01.xhtml#FPar9).


    [***Listing 1-9***](#9781484213483_Ch01.xhtml#_FPar9). Implementing the code of
    [Listing 1-8](#9781484213483_Ch01.xhtml#FPar8) Using a `Sass` Preprocessor


    ```

    .container {

      @include rounded-corners(4px);

    }

    ```


    So far you have seen how preprocessors help in coding `CSS`. Now let’s consider
    how preprocessors can help during the post-coding phase. Compressing the `CSS`
    reduces its original size, which results in less loading time. This can be done
    using online tools or editor addons.


    However, the preprocessor can compile to `CSS` in various ways, one of which is
    compressed. The preprocessor can be configured in a way that, whenever a preprocessor
    file is saved, it is automatically compiled into `CSS` and compressed. This makes
    it production ready.


    ## Misconceptions About CSS Preprocessors


    This section discusses some common misconceptions that prevent developers from
    adopting preprocessors in their daily workflow.


    ### You Need To Be a Command-Line Expert


    Many developers fear the command line. To use preprocessors, you require very
    little command-line knowledge. In fact, you need to learn only a single command.
    Additionally, there are applications that perform the same task without accessing
    the command line.


    ### You Need To Change the Way You Write CSS


    Developers have a way of writing stylesheets and organizing them. Since the `SCSS`
    syntax is the same as `CSS`, developers don’t need to change the way they have
    been writing `CSS`.


    ### Why Not Write CSS Directly?


    The initial reaction of many developers when looking at `CSS` preprocessors is,
    “What’s wrong with writing the `CSS` directly? We use `CSS` regularly and can
    fix all the usual layout issues and develop responsive web sites that work across
    all devices.”


    Well, preprocessors by themselves cannot produce better `CSS`. For example, if
    you lack knowledge as to how to use `CSS`, preprocessors won’t be of any use in
    solving your issues. Preprocessors help you write `CSS` in a fast and maintainable
    manner by adhering to the `DRY` principle.'
