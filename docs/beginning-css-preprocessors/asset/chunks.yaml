  trans: "\n```css\n.notification {\n          border-radius: 5px;\n          padding:\
    \ 5px;\n}\n.errorLooks{\n  @extend .notification;\n  @at-root{\n    .icon{\n \
    \     border-radius:50%;\n    }\n  }\n}\n```\n\n在这个示例中，`.icon` 嵌套在 `errorLooks`\
    \ 中。这段代码编译后，将会得到代码清单 3-27 所示的结果。\n\n***代码清单 3-27***。代码清单 3-26 的输出\n```css\n.notification,\
    \ .errorLooks {\n  border-radius: 5px;\n  padding: 5px;\n}\n\n.icon {\n  border-radius:\
    \ 50%;\n}\n```\n\n请注意，`@at-root` 中的内容将出现在它被嵌套的规则之后。\n\n你可能会想，“我什么时候能用上这个呢？”\n\n\
    其实，有了 `@at-root`，你的代码会更易读、更易管理。请参考代码清单 3-28 中的示例。\n\n***代码清单 3-28***。实现 `@at-root`\
    \ 的示例\n```css\n.productImage {\n  height: 150px;\n  width: 150px;\n\n@at-root\
    \ {\n    @keyframes panimate {\n      0% { transform: scale(1.0); }\n      25%\
    \ { transform: scale(1.1); }\n      50% { transform: scale(1.2); }\n      75%\
    \ { transform: scale(1.1); }\n      100% { transform: scale(1.0); }\n    }\n \
    \ }\n  &:hover {\n    animation: panimate .8s infinite;\n  }\n}\n```\n\n在此示例中，你可以看到，使用\
    \ `@at-root` 将专用于该特定元素的动画声明放在其定义内部，提高了整体代码的可读性。\n\n***代码清单 3-29***。代码清单 3-28 的输出\n\
    ```css\n.productImage {\n  height: 150px;\n  width: 150px;\n}\n\n@keyframes panimate\
    \ {\n  0% {\n    transform: scale(1);\n  }\n  25% {\n    transform: scale(1.1);\n\
    \  }\n  50% {\n    transform: scale(1.2);\n  }\n  75% {\n    transform: scale(1.1);\n\
    \  }\n  100% {\n    transform: scale(1);\n  }\n}\n\n.productImage:hover {\n  animation:\
    \ panimate 0.8s infinite;\n}\n```\n\n## Mixin 指令\n\n随着 CSS 的增长，你会遇到需要按原样或稍微修改地重复使用整个样式块的情况。\n\
    \n混入（Mixin）使用 `@mixin` 声明，用于创建可在整个样式表中重用的样式代码。Mixins 可以包含完整的 CSS 规则。Mixins 可以接受参数，这使其更加灵活。\n\
    \nMixins 使用 `@mixin` 指令定义，后跟混入的名称、可选参数和包含代码的块，如代码清单 3-30 所示。\n\n***代码清单 3-30***。一个\
    \ Mixin 的示例\n```scss\n@mixin roundedEdges($radius:5px) {\n  -webkit-border-radius:\
    \ $radius;\n     -moz-border-radius: $radius;\n      -ms-border-radius: $radius;\n\
    \          border-radius: $radius;\n}\n.container {@include roundedEdges(10px);}\n\
    ```\n\n此示例展示了生成圆角代码的混入，它接受一个参数，如果未提供参数，其默认值设为 `5px`。\n\n***代码清单 3-31***。代码清单 3-30\
    \ 的输出\n```css\n.container {\n  -webkit-border-radius: 10px;\n  -moz-border-radius:\
    \ 10px;\n  -ms-border-radius: 10px;\n  border-radius: 10px;\n}\n```\n\n此示例展示了如何定义和包含\
    \ Mixins。Mixins 使用 `@mixin` 定义。它们使用 `@include` 包含。在此示例中，我们还提供了一个带有默认值的参数。\n\n\
    你还可以通过包含其他 Mixins 来创建复合 Mixins，如代码清单 3-32 所示。\n\n***代码清单 3-32***。一个复合 Mixin 的示例\n\
    ```scss\n@mixin success {\n  @include notification;\n  @include successTheme;\n\
    }\n```\n\nMixin 的参数以变量格式编写，如果有多个参数，则用逗号分隔。这些参数可以有默认值，如果未提供参数值，则将使用这些默认值。\n\n***代码清单\
    \ 3-33***。将代码块作为参数传递给 Mixin\n```scss\n@mixin clearFix {\n  &:after {\n    @content;\n\
    \  }\n}\n\n.btn {\n  display: inline-block;\n  @include clearFix {\n    clear:both;\n\
    \  }\n}\n```\n\n***代码清单 3-34***。代码清单 3-33 的输出\n```css\n.btn {\n  display: inline-block;\n\
    }\n\n.btn:after {\n  clear: both;\n}\n```\n\n## Mixins 与类\n\nMixins 使得在样式表中重用样式变得非常容易。任何重复的样式代码片段都是使用\
    \ Mixin 的绝佳候选。例如，一组适合一起设置的属性，如边框半径、背景渐变等，就适合做成一个 Mixin。\n\nMixins 与 CSS 类非常相似。两者都允许你存储样式块。这两者最重要的区别在于，类旨在用于\
    \ HTML 中，而 Mixin 则用于创建可在样式表中重用的块。\n\n因此，类应该有一个有意义的名称，能够正确标识元素。Mixin 的名称应该与它们提供的功能相关。\n\
    \n## Mixins 与 CSS 选择器\n\nMixins 除了可以包含属性外，还可以包含 CSS 选择器。代码清单 3-35 演示了这一点。\n\n\
    ***代码清单 3-35***。Mixin 内的 CSS 选择器\n```scss\n@mixin importantInfo {\n  font-weight:strong;\n\
    \  li {\n    margin: 0px 5px;\n  }\n}\n\n.notfication{\n  border-radius:35%;\n\
    \  @include importantInfo;\n}\n```\n\n此示例创建了一个名为 `importantInfo` 的 mixin，它包含自己的样式规则以及带有自身规则的\
    \ CSS 选择器 `li`。这在 `notification` 类中被包含。此代码的结果如代码清单 3-36 所示。\n\n***代码清单 3-36***。代码清单\
    \ 3-35 的输出\n```css\n.notfication {\n  border-radius: 35%;\n  font-weight:strong;\n\
    }\n\n.notfication li {\n  margin: 0px 5px;\n}\n```\n\n## Mixins 的参数\n\nSass 中的\
    \ Mixins 可以接受在调用该 mixin 时提供的参数。这有助于 mixin 根据提供的参数提供不同的行为，从而使其适用于广泛的应用场景。\n\n参数作为逗号分隔的变量列表，放在\
    \ mixin 名称后的括号内传递。代码清单 3-37 演示了这一点。\n\n***代码清单 3-37***。在 Mixins 中传递参数\n```scss\n\
    @mixin fancyBorder($fbColor, $fbWidth) {\n  border-color: $fbColor;\n  border-width:\
    \ $fbWidth;\n  border-style: dashed;\n}\n\n.specialNote{\n  @include fancyBorder(#000,2px)\n\
    }\n```\n\n此示例包含一个名为 `fancyBorder` 的 mixin，它接受两个参数：`borderColor` 和 `borderWidth`。其输出如代码清单\
    \ 3-38 所示。\n\n***代码清单 3-38***。代码清单 3-37 的输出\n```css\n.specialNote {\n  border-color:\
    \ #000;\n  border-width: 2px;\n  border-style: dashed;\n}\n```\n\nMixins 也可以为其参数设定默认值。因此，当你不向\
    \ mixin 传递任何值时，它将采用默认值。这可以通过修改代码清单 3-39 中的代码来演示。\n\n***代码清单 3-39***。演示默认变量的示例\n\
    ```scss\n@mixin fancyBorder($fbColor:#000, $fbWidth:2px) {\n  Border-color: $fbColor;\n\
    \  Border-width: $fbWidth;\n  Border-style: dashed;\n}\n\n.specialNote{\n  @include\
    \ fancyBorder;\n}\n```\n\nMixins 还允许你传递关键字参数。这使得 Mixins 更加灵活，允许参数以任意顺序传递。代码清单\
    \ 3-40 展示了这一点。\n\n***代码清单 3-40***。关键字参数示例\n```scss\n.specialNote{\n  @include\
    \ fancyBorder($borderColor:#00F, $borderWidth:1px)\n}\n```\n"
- fmt: '# Mixins 与变量参数


    你可以通过允许 mixins 处理未知数量的变量，使其更加灵活。Sass 支持可变参数。这些参数在 mixins/函数的参数列表末尾声明，包含所有额外的参数，并以列表形式存在。这些参数看起来像普通参数，但在末尾有额外的
    `…`。[Listing 3-41](#9781484213483_Ch03.xhtml#FPar41) 展示了之前代码的修改版本，它传递了一个名为 `fontProp`
    的变量参数来设置字体属性。


    [**Listing 3-41**](#9781484213483_Ch03.xhtml#_FPar41). 可变参数示例


    ```

    @mixin fancyBorder($borderColor:#000, $borderWidth:2px,$fontProp…) {

      border: {

        color: $borderColor;

        width: $borderWidth;

        style: dashed;

      }

      font:$fontProp;

    }


    .specialNote{

      @include fancyBorder(#00F, 1px,1px arial,sans-serif)

    }

    ```


    [**Listing 3-42**](#9781484213483_Ch03.xhtml#FPar41). [Listing 3-41](#9781484213483_Ch03.xhtml#FPar41)
    的输出


    ```

    .specialNote {

      border-color: #00F;

      border-width: 1px;

      border-style: dashed;

      font: 1px arial, sans-serif;

    }

    ```


    ## 在 Mixins 中使用内容块


    你还可以将样式块传递给 mixin，这些样式块可以放置在 mixin 提供的样式之外。这些样式会添加在声明 `@content` 规则的地方。上一个示例的修改版本如
    [Listing 3-43](#9781484213483_Ch03.xhtml#FPar43) 所示。


    [**Listing 3-43**](#9781484213483_Ch03.xhtml#_FPar43). 内容块示例


    ```

    @mixin fancyBorder($borderColor:#000, $borderWidth:2px,$fontProp…) {

      border: {

        color: $borderColor;

        width: $borderWidth;

        style: dashed;

      }

      font:$fontProp;

      @content;

    }


    .specialNote{

      @include fancyBorder(#00F, 1px,1px arial,sans-serif){

        line-height:0.8em;

      }

    }

    ```


    此代码片段的输出如 [Listing 3-44](#9781484213483_Ch03.xhtml#FPar44) 所示。


    [**Listing 3-44**](#9781484213483_Ch03.xhtml#_FPar44). [Listing 3-43](#9781484213483_Ch03.xhtml#FPar43)
    的输出


    ```

    .specialNote {

      border-color: #00F;

      border-width: 1px;

      border-style: dashed;

      font: 1px arial, sans-serif;

      line-height: 0.8em;

    }

    ```


    # 函数指令


    Sass 中的函数对提供的参数执行指定的操作。这些函数的语法类似于 CSS 函数，如 `rgb()`。与 CSS 函数不同，Sass 函数可以包含关键字参数，并返回对
    Sass 操作有用的值。


    Sass 提供了内置函数，这些函数旨在广泛应用于各种不同场景，例如颜色操作等。除此之外，Sass 还允许用户定义自己的函数，类似于定义 mixins。


    Sass 提供的一些内置函数分类如下：


    *   数值函数

    *   颜色函数

    *   列表函数


    ## 数值函数


    Sass 提供了一些用于处理数值的函数，特别是在使用 Sass 编写样式表时经常遇到的情况。


    以下讨论其中一些函数。


    ### `abs($number)`


    此函数将返回数字的绝对值，如 [Listing 3-45](#9781484213483_Ch03.xhtml#FPar45) 所示。


    [**Listing 3-45**](#9781484213483_Ch03.xhtml#_FPar45). 使用 `abs` 的示例


    ```

    $fontsize:1.1em;

    .container{

      // Will use 1.1em

      font-size:abs($fontsize);

    }

    ```


    ### `ceil($number)`


    此函数将返回数字的向上取整值，如 [Listing 3-46](#9781484213483_Ch03.xhtml#FPar46) 所示。


    [**Listing 3-46**](#9781484213483_Ch03.xhtml#_FPar46). 使用 `ceil` 的示例


    ```

    $fontsize:1.1em;

    .container{

      // Will use 2em

      font-size:ceil($fontsize);

    }

    ```


    ### `floor($number)`


    此函数将返回数字的向下取整值，如 [Listing 3-47](#9781484213483_Ch03.xhtml#FPar47) 所示。


    [**Listing 3-47**](#9781484213483_Ch03.xhtml#_FPar47). 使用 `floor` 的示例


    ```

    $fontsize:1.1em;

    .container{

      // Will use 1em

      font-size:floor($fontsize);

    }

    ```


    ### `percentage($number)`


    此函数将提供的数字转换为百分比并返回。作为参数提供的数字应该是无单位的，即它不应具有作为后缀的单位。参见 [Listing 3-48](#9781484213483_Ch03.xhtml#FPar48)。


    [**Listing 3-48**](#9781484213483_Ch03.xhtml#_FPar48). 使用 `percentage` 的示例


    ```

    $fontsize:1.1;

    .container{

      // Will use 110%

      font-size:percentage($fontsize);

    }

    ```


    ### `round($number)`


    此函数将返回所提供数字的最接近的整数值，如 [Listing 3-49](#9781484213483_Ch03.xhtml#FPar49) 所示。


    [**Listing 3-49**](#9781484213483_Ch03.xhtml#_FPar49). 使用 `round` 的示例


    ```

    $fontsize:1.1em;

    .container{

      // Will use 1em

      font-size:round($fontsize);

    }

    ```


    ## 颜色函数


    Sass 提供了多种用于转换颜色的函数，例如 `adjust_color`、`complement`、`grayscale`、`invert` 等。


    以下描述其中一些函数。


    ### `adjust_color($color,…)`


    此函数用于分配颜色的个别属性，例如红色、绿色、蓝色等。属性被指定为关键字参数，值将从原始值中加或减（参加 [Listing 3-50](#9781484213483_Ch03.xhtml#FPar50)）。可以使用此函数转换颜色的以下属性：


    *   红色

    *   绿色

    *   蓝色

    *   色相

    *   明度

    *   透明度


    [**Listing 3-50**](#9781484213483_Ch03.xhtml#_FPar50). 展示 `adjust_color` 的示例


    ```

    $fontcolor:#900;

    .container{

      color:adjust_color($fontcolor,$red:-5);

    }

    ```


    ### `complement($color)`


    此函数返回颜色的补色，如 [Listing 3-51](#9781484213483_Ch03.xhtml#FPar51) 所示。


    [**Listing 3-51**](#9781484213483_Ch03.xhtml#_FPar51). 展示 `complement` 的示例


    ```

    $fontcolor:#FF0000;

    .container{

      color:complement($fontcolor);

    }

    ```


    上一个代码片段的输出如 [Listing 3-52](#9781484213483_Ch03.xhtml#FPar52) 所示。


    [**Listing 3-52**](#9781484213483_Ch03.xhtml#_FPar52). [Listing 3-53](#9781484213483_Ch03.xhtml#FPar53)
    的输出


    ```

    .container {

      color: cyan;

    }

    ```


    ### `grayscale($color)`


    此函数返回颜色的灰度版本。这在 [Listing 3-53](#9781484213483_Ch03.xhtml#FPar53) 中演示。


    [**Listing 3-53**](#9781484213483_Ch03.xhtml#_FPar53). `grayscale` 的示例


    ```

    $fontcolor:#FFCC00;

    .container{

      color:grayscale($fontcolor);

    }

    ```


    ## 列表函数


    列表函数中最重要的函数之一是 `nth($list, $n)`。它用于从列表中获取单个项目。与 JavaScript 不同，Sass 列表从 1 开始计数。


    因此，`nth(10px 20px 30px, 1)` 将返回 `10px` 作为结果。


    另一个重要的函数是 `join`。`join($list1, $list2, [$separator])` 用于通过合并两个列表生成一个新列表。列表中的每个值都计为一个单独项目，该函数也可用于从单个项目生成列表。可选的
    `$separator` 参数决定列表的类型；可以是空格或逗号。如果省略，则使用 `$list1` 的类型。


    另一个简单但重要的函数是 `length($list)`。它返回 `$list` 中的项目数量。所以 `length(10 22 33)` 的结果是 `3`。


    # 用户定义函数


    `@function` 指令用于定义你自己的函数。当你要执行原生不支持的操作时，这很有用。`@function` 类似于 `@mixin`，不同之处在于 `@function`
    会返回结果。


    `@return` 指令是 `@function` 的重要组成部分，其行为类似于 JavaScript 中的 `return`。它接受 Sass 表达式，处理它们，并返回结果。此外，在触发
    `@return` 后，它会停止函数执行。


    考虑一个构建函数的简单示例。此示例编写一个函数，根据提供的列数生成每列的宽度，如 [Listing 3-54](#9781484213483_Ch03.xhtml#FPar54)
    所示。


    [**Listing 3-54**](#9781484213483_Ch03.xhtml#_FPar54). 用户定义函数的示例'
  raw: 'You can make mixins even more flexible by allowing them to deal with an unknown
    number of variables. Sass supports variable arguments. These are declared at the
    end of parameters for mixins/functions that contain all additional arguments in
    the form of a list. These arguments look like normal arguments, but have additional
    … at the end. [Listing 3-41](#9781484213483_Ch03.xhtml#FPar41) shows a modified
    version of the previous code, and it passes a variable parameter named fontProp
    to set the font attribute.


    [***Listing 3-41***](#9781484213483_Ch03.xhtml#_FPar41). Example of a Variable
    Argument


    ```

    @mixin fancyBorder($borderColor:#000, $borderWidth:2px,$fontProp…) {

      border: {

        color: $borderColor;

        width: $borderWidth;

        style: dashed;

      }

      font:$fontProp;

    }


    .specialNote{

      @include fancyBorder(#00F, 1px,1px arial,sans-serif)

    }

    ```


    ***Listing 3-42***. Output of [Listing 3-41](#9781484213483_Ch03.xhtml#FPar41)


    ```

    .specialNote {

      border-color: #00F;

      border-width: 1px;

      border-style: dashed;

      font: 1px arial, sans-serif;

    }

    ```


    Using Content Blocks in Mixins


    You can also pass blocks of styles to the mixin, which can be placed in addition
    to the styles provided by mixins. These styles are added wherever the @content
    rule is declared. The modified version of the previous example would look as shown
    in [Listing 3-43](#9781484213483_Ch03.xhtml#FPar43).


    [***Listing 3-43***](#9781484213483_Ch03.xhtml#_FPar43). Example of Content Block


    ```

    @mixin fancyBorder($borderColor:#000, $borderWidth:2px,$fontProp…) {

      border: {

        color: $borderColor;

        width: $borderWidth;

        style: dashed;

      }

      font:$fontProp;

      @content;

    }


    .specialNote{

      @include fancyBorder(#00F, 1px,1px arial,sans-serif){

        line-height:0.8em;

      }

    }

    ```


    The output of this snippet is shown in [Listing 3-44](#9781484213483_Ch03.xhtml#FPar44).


    [***Listing 3-44***](#9781484213483_Ch03.xhtml#_FPar44). Output of [Listing 3-43](#9781484213483_Ch03.xhtml#FPar43)


    ```

    .specialNote {

      border-color: #00F;

      border-width: 1px;

      border-style: dashed;

      font: 1px arial, sans-serif;

      line-height: 0.8em;

    }

    ```


    Function Directives


    Functions in Sass perform specified operations on the provided arguments. The
    syntax of these functions is similar to CSS functions like rgb(). Unlike CSS functions,
    Sass functions can have keyword arguments and return values useful for Sass operations.


    Sass provides built-in functions that are designed to be widely useful in many
    different circumstances, like color manipulation, and so on. In addition to that,
    Sass allows users to define their own functions, similar to defining mixins.


    Some of the built-in functions provided by Sass are categorized as follows:


    *   Numeric functions

    *   Color functions

    *   List functions


    Numeric Functions


    Sass provides a few functions for dealing with numeric values, especially for
    situations that come up frequently when writing stylesheets with Sass.


    Some of these are discussed in the following sections.


    abs($number)


    This function will return an absolute value of the number, as shown in [Listing
    3-45](#9781484213483_Ch03.xhtml#FPar45).


    [***Listing 3-45***](#9781484213483_Ch03.xhtml#_FPar45). Example Using abs


    ```

    $fontsize:1.1em;

    .container{

      // Will use 1.1em

      font-size:abs($fontsize);

    }

    ```


    ceil($number)


    This function will return a rounded-up value of a number, as shown in [Listing
    3-46](#9781484213483_Ch03.xhtml#FPar46).


    [***Listing 3-46***](#9781484213483_Ch03.xhtml#_FPar46). Example Using ceil


    ```

    $fontsize:1.1em;

    .container{

      // Will use 2em

      font-size:ceil($fontsize);

    }

    ```


    floor($number)


    This function will return a rounded-down value of a number, as shown in [Listing
    3-47](#9781484213483_Ch03.xhtml#FPar47).


    [***Listing 3-47***](#9781484213483_Ch03.xhtml#_FPar47). Example Using floor


    ```

    $fontsize:1.1em;

    .container{

      // Will use 1em

      font-size:floor($fontsize);

    }

    ```


    percentage($number)


    This function will convert the provided number into a percentage and return it.
    The number provided as the argument should be unitless, i.e., it should not possess
    a unit as a suffix. See [Listing 3-48](#9781484213483_Ch03.xhtml#FPar48).


    [***Listing 3-48***](#9781484213483_Ch03.xhtml#_FPar48). Example Using percentage


    ```

    $fontsize:1.1;

    .container{

      // Will use 110%

      font-size:percentage($fontsize);

    }

    ```


    round($number)


    This function will return the nearest round value of the number provided, as shown
    in [Listing 3-49](#9781484213483_Ch03.xhtml#FPar49).


    [***Listing 3-49***](#9781484213483_Ch03.xhtml#_FPar49). Example Using round


    ```

    $fontsize:1.1em;

    .container{

      // Will use 1em

      font-size:round($fontsize);

    }

    ```


    Color Functions


    Sass provided various functions for transforming the colors, such as adjust_color,
    complement, greyscale, invert, etc.


    Some of these are described in the following sections.


    adjust_color($color,…)


    This function is used to assign individual properties of colors such as red, green,
    blue, etc. The properties are specified as keyword arguments and values are added
    or subtracted from the original value (see [Listing 3-50](#9781484213483_Ch03.xhtml#FPar50)).
    The following properties of the color can be transformed using this function:


    *   Red

    *   Green

    *   Blue

    *   Hue

    *   Lightness

    *   Alpha


    [***Listing 3-50***](#9781484213483_Ch03.xhtml#_FPar50). Example Showing adjust_color


    ```

    $fontcolor:#900;

    .container{

      color:adjust_color($fontcolor,$red:-5);

    }

    ```


    complement($color)


    This function returns the complement of the color, as shown in [Listing 3-51](#9781484213483_Ch03.xhtml#FPar51).


    [***Listing 3-51***](#9781484213483_Ch03.xhtml#_FPar51). Example Showing complement


    ```

    $fontcolor:#FF0000;

    .container{

      color:complement($fontcolor);

    }

    ```


    The output of the previous code snippet is shown in [Listing 3-52](#9781484213483_Ch03.xhtml#FPar52).


    [***Listing 3-52***](#9781484213483_Ch03.xhtml#_FPar52). Output of [Listing 3-53](#9781484213483_Ch03.xhtml#FPar53).


    ```

    .container {

      color: cyan;

    }

    ```


    grayscale($color)


    This function returns the grayscale version of a color. This is demonstrated in
    [Listing 3-53](#9781484213483_Ch03.xhtml#FPar53).


    [***Listing 3-53***](#9781484213483_Ch03.xhtml#_FPar53). Example of grayscale


    ```

    $fontcolor:#FFCC00;

    .container{

      color:grayscale($fontcolor);

    }

    ```


    List Functions


    One of the most important functions among the list functions is nth($list, $n).
    It’s used to fetch a single item from the list. Unlike with JavaScript, Sass lists
    start counting from 1.


    Thus, nth(10px 20px 30px, 1) will return 10px as a result.


    Another important function is join. join($list1, $list2, [$separator]) is used
    to generate a new list by combining two lists. Each value in the list counts as
    a single item, and the function can also be used to make lists out of individual
    items. The optional $separator argument determines which type of list it should
    be; it can be a space or a comma. If it’s left out, the $list1 type is used.


    Another simple yet important function is length($list). It returns the number
    of items in $list. So length(10 22 33) is 3.


    User-Defined Functions


    The @function directive is used for defining your own function. This can be useful
    when you want to perform actions that are not natively supported. @function is
    similar to @mixin, except that @function returns a result.


    The @return directive is an important component of @function, which has a behavior
    similar to return in JavaScript. It accepts Sass expressions, processes them,
    and returns the result. Additionally, it stops the function execution after @return
    is triggered.


