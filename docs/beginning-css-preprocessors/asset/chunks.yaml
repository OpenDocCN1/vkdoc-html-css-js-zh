  raw: 'Next you will add the required code to the extension file. This is shown in
    [Listing 5-82](#9781484213483_Ch05.xhtml#FPar83). Please note the name of file
    and extension mixin are the same for convenience. They may defer in real life
    scenarios.


    ![9781484213483_Fig05-22.jpg](OEBPS/Images/9781484213483_Fig05-22.jpg)


    Figure 5-22\. Directory structure with an extension


    [***Listing 5-82***](#9781484213483_Ch05.xhtml#_FPar83). Adding Code to the Extension
    File customButton.scss


    ```

    @mixin customButton() {

       cursor: pointer;

       padding: 10px 15px;

       background-color: #eee;

       border: #bbb 1px solid;

       color: #555;

       @include border-radius(25%);

       @include transition-property(all);

       &:hover {

          background-color:#bbb;

       }

    }

    ```


    Next, you need to import this in the screen.scss file so that you can use it.
    This is demonstrated in [Listing 5-83](#9781484213483_Ch05.xhtml#FPar84).


    [***Listing 5-83***](#9781484213483_Ch05.xhtml#_FPar84). Importing the Extension
    in Your screen.scss


    ```

    // Code for custom extension

    @import "customButton";

    .primaryAction{

       @include customButton;

    }

    ```


    In addition to importing the extension into the SCSS file, you have to include
    the mixin from the extension in the class .primaryAction.


    The output of this code is shown in [Listing 5-84](#9781484213483_Ch05.xhtml#FPar85).


