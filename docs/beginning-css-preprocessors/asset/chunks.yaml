    \n## Summary\n\nThis chapter explained the advanced topics of Sass, such as including\
    \ other Sass files using `import` and using directives, using `@media`, extending\
    \ using `@extend`, using mixins, and some of the commonly used functions provided\
    \ by Sass and defining a functions using `@function`.\n\nIn addition to these\
