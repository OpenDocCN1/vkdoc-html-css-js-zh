    \n***列表 1-13***：使用 SASS 实现变量的示例\n\n```\n$text-color:#333;\nbody {\n        color:$text-color;\n\
    }\n```\n\n当这段代码被编译时，它会获取为`$text-color`定义的变量，并输出普通的 CSS，其中变量的值会被填入 CSS 中。这在处理适用于整个站点的属性并保持其一致时非常有用。\n\
