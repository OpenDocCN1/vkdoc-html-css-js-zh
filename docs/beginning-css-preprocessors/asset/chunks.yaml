  trans: "\n`@import` 也可用于导入多个文件。\n\n***清单 3-2***。使用 `@import` 获取多个文件的示例\n\n```\n\
    @import \"main\", \"mobile\"\n```\n\n此行为如图 图 3-1 所示。\n\n![9781484213483_Fig03-01.jpg](img/9781484213483_Fig03-01.jpg)\n\
    \n图 3-1。`@import` 在 Sass 中工作方式的直观展示\n\n### Partials\n\n假设你有一些可复用的 Sass 代码块想要导入，但又不希望它在最终的输出文件中出现。你可以使用\
    \ partials 来实现这一效果。Partials 有助于将样式代码分割到不同文件中，从而实现更好的组织管理。\n\n假设你有一个名为 `typography.scss`\
    \ 的 Sass 文件，其中包含有关排版的字体大小和字重等信息。要将其变为 partial 文件，你需要在文件名前加上下划线前缀。因此，文件名会变成 `_typography.scss`。这个下划线告诉\
    \ Sass 编译器，该文件是一个 partial，不需要编译成完整的 CSS。\n\n随着项目不断增长，通过将代码按逻辑块分类，这一方法能更轻松地管理项目中的样式代码。\n\
    \n因此，延续上一段的示例，将文件重命名为 `_typography.scss` 后，你可以使用简单的 `@import typography` 语句将其导入代码中。\n\
    \n### 嵌套的 @import\n\n导入操作也可以用于在样式规则中导入代码片段。使用 `@import`，你还可以导入 CSS 规则。\n\n我们来看一个例子，假设你有两个文件——`parent.scss`\
    \ 和 `file2.scss`。假设你想将 `parent.scss` 的内容导入到 `file2.scss` 中。你可以按照清单 3-3 所示的方式操作。\n\
    \n***清单 3-3***。使用 `@import` 导入样式的示例：`_parent.scss` 的内容\n\n```\n.parent{\n    \
    \    Background-color:#CCC;\n}\n```\n\n***清单 3-4***。使用 `@import` 导入样式的示例：`file2.scss`\
    \ 的内容\n\n```\n.child{\n        @import \"parent\";\n}\n```\n\n当执行清单 3-4 中所示的代码时，你会得到清单\
    \ 3-5 所示的输出结果。\n\n***清单 3-5***。清单 3-4 的输出结果\n\n```\n.child .parent{\n        Background-color:#CCC;\n\
    }\n```\n\n因此，当你在样式规则内应用导入时，所有被导入的规则都会嵌套在该特定规则内部。最终效果与这些样式直接嵌套在该特定选择器内完全相同。\n\n\
    ### 纯 CSS 导入\n\n除了自身的导入方式外，Sass 也支持 CSS 风格的 `@import`。有两种情况会触发此类行为，具体如下：\n\n*\
    \   要导入的文件的 URL/路径以 `.css` 扩展名结尾\n*   要导入的文件的 URL/路径以 `http(s)://` 开头\n\n因此，你无法直接在\
    \ Sass 中导入纯 CSS。不过，有一个变通方法。由于 Sass 与 CSS 兼容，你只需将文件的扩展名从 `.css` 改为 `.scss`，然后即可导入。\n\
    \n### @media\n\n媒体查询是当今网页设计过程中最核心的部分。通过媒体查询，你可以根据视口宽度、视口高度、设备宽度、设备高度以及屏幕方向等条件自定义你的\
    \ Web 应用。\n\n通常，开发者在构建网页时，会先编写“普通”样式，然后在末尾编写媒体查询。对于代码行数较少的样式表来说，这样没问题；但当代码增加到成千上万行时，管理起来将是一场噩梦。\n\
    \nSass 提供了更简便的方法。`@media` 用于编写类似 CSS 的媒体查询。然而，它有一个额外功能，即可以嵌套在样式规则内部。Sass 会自动构建媒体查询声明，并将相应的样式放入其中，如清单\
    \ 3-6 所示。\n\n***清单 3-6***。Sass 中的 `@media`\n\n```\n#container{\n        Width:960px;\n\
    \        @media screen and (min-width:500px){\n                Width:100%;}\n\
    }\n```\n\n***清单 3-7***。清单 3-6 的输出结果\n\n```\n#container {\n  Width: 960px;\n}\n\
    \n@media screen and (min-width: 500px) {\n  #container {\n    Width: 100%;\n \
    \ }\n}\n```\n\n现在你可能会想，为什么要用预处理器来写媒体查询，而不是使用传统的 CSS 方法？其中一个优点是代码可读性。通过使用 Sass\
    \ 集成的媒体查询方式，代码非常易于理解。\n\nSass 还允许嵌套媒体查询，以构建复杂的媒体查询。参考清单 3-8 中的示例，我们在 `#container`\
    \ 内部为不同的宽度嵌套了媒体查询。这使得代码易于理解，可读性也大大增强。\n\n***清单 3-8***。媒体查询的嵌套\n\n```\n@media screen\
    \ {\n  #container {\n    @media (min-width:500px) {\n      width: 500px;\n   \
    \ }\n    @media (min-width:700px) {\n      width: 700px;\n    }\n  }\n}\n```\n\
    \n***清单 3-9***。清单 3-8 的输出结果\n\n```\n@media screen and (min-width: 500px) {\n \
    \ #container {\n    width: 500px;\n  }\n}\n\n@media screen and (min-width: 700px)\
    \ {\n  #container {\n    width: 700px;\n  }\n}\n```\n\n更进一步，你可以创建一个包含媒体查询的 partial\
    \ 文件，然后在需要的地方引入它们。\n\n使用 Sass，你还可以内联包含媒体查询。考虑一个示例，你想要一个容器在不同视口大小下有不同的宽度。这可以通过清单\
    \ 3-10 中演示的方式实现。\n\n***清单 3-10***。内联媒体查询\n\n```\n$color1:#CCC;\n.color {\n   color:\
    \ $color1;\n   @include setQuery(sm) {\n      width: 80%;\n   }\n   @include setQuery(md)\
    \ {\n      width: 70%;\n   }\n   @include setQuery(lg) {\n      width: 60%;\n\
    \   }\n}\n```\n\n使用 Sass 编写媒体查询的另一个好处是，你可以将媒体查询的断点赋值给变量。然后这些变量就可以在媒体查询中使用。这在清单\
    \ 3-11 中得到了演示，它是前一个示例的更详细版本。\n\n***清单 3-11***。使用变量分配断点\n\n```\n$color1:#CCC;\n\
    $sm:320px;\n$md:720px;\n$lg:1280px;\n@mixin setQuery($type){\n  @if $type == sm\
    \ {\n    @media only screen and (min-width: $sm) and (max-width: $md - 1) {\n\
    \      @content;\n    }\n  }\n  @else if $type == md {\n    @media only screen\
    \ and (min-width: $md) and (max-width: $lg - 1) {\n      @content;\n    }\n  }\n\
    \  @else if $type == lg {\n    @media only screen and (min-width: $lg){\n    \
    \  @content\n    }\n  }\n}\n.container {\n  color: $color1;\n  @include setQuery(sm)\
    \ {\n    width: 80%;\n  }\n  @include setQuery(md) {\n    width: 70%;\n  }\n \
    \ @include setQuery(lg) {\n    width: 60%;\n  }\n}\n```\n\n前面的代码示例将宽度值存储在变量中。然后，根据我们传递给\
    \ mixin（类似于一个函数，用于在需要时注入带有计算的、可复用的样式，本章稍后会介绍这个概念）的参数变量，生成并注入媒体查询。前面代码的输出结果如清单\
    \ 3-12 所示。\n\n***清单 3-12***。清单 3-11 的输出结果\n\n```\n.container {\n  color: #CCC;\n\
    }\n\n@media only screen and (min-width: 320px) and (max-width: 719px) {\n  .container\
    \ {\n    width: 80%;\n  }\n}\n\n@media only screen and (min-width: 720px) and\
    \ (max-width: 1279px) {\n  .container {\n    width: 70%;\n  }\n}\n\n@media only\
    \ screen and (min-width: 1280px) {\n  .container {\n    width: 60%;\n  }\n}\n\
    ```\n\n### @extend\n"
- fmt: "When writing CSS, one situation we might come across often is where one class\
    \ needs to have all the style rules of another, plus its own style. Writing this\
    \ using simple CSS would require repeating the code. Using Sass, you can inherit\
    \ these required styles using `@extend`.\n\n`@extend` is known as a selector inheritance.\
    \ In selector inheritance, Sass inherits all the styles defined in another selector.\
    \ Consider the example shown in [Listing 3-13](#9781484213483_Ch03.xhtml#FPar13),\
    \ where `.notification` is inherited in `.success`.\n\n[***Listing 3-13***](#9781484213483_Ch03.xhtml#_FPar13).\
    \ An Example of Using `@extend`\n\n```css\n.notification{\n  border-radius:5px;\n\
    \  padding:5px;\n}\n\n.success{\n  @extend .notification;\n  background-color:#0F0;\n\
    }\n```\n\n[***Listing 3-14***](#9781484213483_Ch03.xhtml#FPar13). Output of [Listing\
    \ 3-13](#9781484213483_Ch03.xhtml#FPar13)\n\n```css\n.notification, .success {\n\
    \  border-radius: 5px;\n  padding: 5px;\n}\n\n.success {\n  background-color:\
    \ #0F0;\n}\n```\n\nThere are some disadvantages of using `@extend`. For one, the\
    \ result of extending may sometimes be unpredictable in a large file where the\
    \ extended CSS selector is present multiple times. This could result in undesirable\
    \ output.\n\nAnother issue with using `@extend` is that it cannot be used inside\
    \ `@media` declarations.\n\n`@extend` is also not as flexible as using mixins,\
    \ as it cannot accept arguments.\n\nIt is possible to create a single selector\
    \ by extending multiple selectors, as shown in [Listing 3-15](#9781484213483_Ch03.xhtml#FPar15).\n\
    \n[***Listing 3-15***](#9781484213483_Ch03.xhtml#_FPar15). Extending from Multiple\
    \ Selectors\n\n```css\n.notification {\n          border-radius: 5px;\n      \
    \    padding: 5px;\n}\n.errorLooks{\n        Color:#F00;\n        Background-color:rgba(255,0,0,0.5);\n\
    }\n.error {\n          @extend .notification;\n        @extend .errorLooks;\n\
    }\n```\n\n[***Listing 3-16***](#9781484213483_Ch03.xhtml#FPar15). Output of [Listing\
    \ 3-15](#9781484213483_Ch03.xhtml#FPar15)\n\n```css\n.notification, .error {\n\
    \  border-radius: 5px;\n  padding: 5px;\n}\n\n.errorLooks, .error {\n  Color:\
    \ #F00;\n  Background-color: rgba(255, 0, 0, 0.5);\n}\n```\n\nYou can also perform\
    \ chaining by extending the selectors in the next selector, as shown in [Listing\
    \ 3-17](#9781484213483_Ch03.xhtml#FPar17).\n\n[***Listing 3-17***](#9781484213483_Ch03.xhtml#_FPar17).\
    \ Chaining Within `@extend`\n\n```css\n.notification {\n          border-radius:\
    \ 5px;\n          padding: 5px;\n}\n.errorLooks{\n  @extend .notification;\n \
    \       Color:#F00;\n        Background-color:rgba(255,0,0,0.5);\n}\n.error {\n\
    \  @extend .errorLooks;\n}\n```\n\n[***Listing 3-18***](#9781484213483_Ch03.xhtml#FPar17).\
    \ Output of [Listing 3-17](#9781484213483_Ch03.xhtml#FPar17)\n\n```css\n.notification,\
    \ .errorLooks, .error {\n  border-radius: 5px;\n  padding: 5px;\n}\n\n.errorLooks,\
    \ .error {\n  Color: #F00;\n  Background-color: rgba(255, 0, 0, 0.5);\n}\n```\n\
    \n## `@extend` Behind the Scenes\n\nInheritance isn’t as simple as it seems. Understanding\
    \ how extending works will give you insight into how selectors are inherited and\
    \ thus will give you the ability to anticipate the output.\n\nLet’s take the example\
    \ used in the previous section. The principle behind `@extend` is that if `.error`\
    \ extends `.notification`, every instance of `.error` in the final stylesheet\
    \ will be replaced with `.notification, .error`.\n\nThere are two things regarding\
    \ `@extend` that you should keep in mind:\n\n*   Inheritance generates comparatively\
    \ less CSS than mixins, which does a somewhat similar thing. It only adds the\
    \ selector in a comma-separated list and does not clone the properties.\n*   Cascading\
    \ applies to inheritance similarly to how it does in normal CSS. When two rules\
    \ with different values apply to the same element, cascading decides which rule\
    \ will be applied. Thus the last rule is always applied.\n\n## When to Use Selector\
    \ Inheritance\n\nSuppose you are developing a web page and writing style rules\
    \ and you find that one of your classes (`.errorLooks`) is a more specific version\
    \ of another (`.notification`). How will you go about writing the style rule?\n\
    \n*   You could replicate the same style rules in both the classes. However, this\
    \ would result in a lot of duplicate code and would go against the DRY principle.\n\
    *   You could apply styles to a group of selectors (`.notification, .error`).\
    \ This is good, but over time will increase the complexity of your style code.\n\
    *   You could use `@extend` provided by Sass and allow `.error` to inherit from\
    \ `.notification`. This makes the code far more readable and easier to understand.\n\
    \n## Placeholder Selectors\n\nWhile using Sass, you might come across situations\
    \ where you want to write classes that you want to extend into other classes but\
    \ don’t want them to be rendered into the final compiled CSS file. For example,\
    \ you want to use a certain class containing code for rounded edges or margins\
    \ that’s not useful independently.\n\nThis can be achieved in Sass with something\
    \ known as a placeholder selector, which is rendered by prefixing the class name\
    \ with `%`—for example `%notification`.\n\n[***Listing 3-19***](#9781484213483_Ch03.xhtml#_FPar19).\
    \ Example of `@extend` Selectors\n\n```scss\n%notification {\n          border-radius:\
    \ 5px;\n          padding: 5px;\n}\n.errorLooks{\n  @extend %notification;\n}\n\
    ```\n\n[***Listing 3-20***](#9781484213483_Ch03.xhtml#_FPar20). Output of [Listing\
    \ 3-19](#9781484213483_Ch03.xhtml#FPar19)\n\n```css\n.errorLooks {\n  border-radius:\
    \ 5px;\n  padding: 5px;\n}\n```\n\nAs you see in [Listing 3-20](#9781484213483_Ch03.xhtml#FPar20),\
    \ the notification extend class has not been rendered in the final output.\n\n\
    ## Do More with `@extend`\n\nClasses are not the only things that can be extended.\
    \ It is also possible to extend complex elements like `a:hover`, `.notification`,\
    \ and `.error`, as shown in [Listing 3-21](#9781484213483_Ch03.xhtml#FPar21).\n\
    \n[***Listing 3-21***](#9781484213483_Ch03.xhtml#_FPar21). Example Demonstrating\
    \ Extending a Complex Element\n\n```scss\na{\n  color:#F00;\n  &:hover{\n    font-weight:bold;\n\
    \  }\n}\n.notification{\n        @extend a:hover ;\n}\n```\n\nIt is also possible\
    \ to create multiple rules by extending multiple CSS classes in one selector,\
    \ as shown in [Listing 3-22](#9781484213483_Ch03.xhtml#FPar22).\n\n[***Listing\
    \ 3-22***](#9781484213483_Ch03.xhtml#_FPar22). Example Demonstrating Extending\
    \ Multiple Classes\n\n```scss\n.notification{\n        Border-radius:50%;\n}\n\
    .strongText{\n        Font-weight:bold;\n}\n.error{\n        @extend .notification;\n\
    \        @extend .strongText;\n        Color:#F00;\n}\n```\n\nThis code will give\
    \ the output shown in [Listing 3-23](#9781484213483_Ch03.xhtml#FPar23).\n\n[***Listing\
    \ 3-23***](#9781484213483_Ch03.xhtml#FPar23). Output of [Listing 3-22](#9781484213483_Ch03.xhtml#FPar22)\n\
    \n```css\n.notification, .error {\n  Border-radius: 50%;\n}\n\n.strongText, .error\
    \ {\n  Font-weight: bold;\n}\n\n.error {\n  Color: #F00;\n}\n```\n\nIt is also\
    \ possible to chain the selectors while extending; that is, extending one selector\
    \ that already extends another selector. Here is the modified code of [Listing\
    \ 3-24](#9781484213483_Ch03.xhtml#FPar24) to demonstrate this phenomenon.\n\n\
    [***Listing 3-24***](#9781484213483_Ch03.xhtml#_FPar24). Example Demonstrating\
    \ Chaining `@extend`s\n\n```scss\n.notification{\n        Border-radius:50%;\n\
    }\n.strongText{\n  @extend .notification;\n        Font-weight:bold;\n}\n.error{\n\
    \        @extend .strongText;\n        Color:#F00;\n}\n```\n\nThe output of this\
    \ code will be the same as shown in [Listing 3-23](#9781484213483_Ch03.xhtml#FPar23).\n\
    \nThere might be situations where you want `@extend` to be ignored if the extended\
    \ selector has an error or is not present. You can use the `!optional` flag in\
    \ that case. This will prevent `@extend` from producing results. This is demonstrated\
    \ in [Listing 3-25](#9781484213483_Ch03.xhtml#FPar25).\n\n[***Listing 3-25***](#9781484213483_Ch03.xhtml#_FPar25).\
    \ Example Showing `!optional`\n\n```scss\n.success{\n  @extend .lightText !optional;\n\
    }\n```\n\n## `@at-root`\n\nThe Sass `@at-root` directive causes the rules inside\
    \ it to be rendered at the document root level, regardless of where they are nested.\
    \ See [Listing 3-26](#9781484213483_Ch03.xhtml#FPar26).\n\n[***Listing 3-26***](#9781484213483_Ch03.xhtml#_FPar26).\
    \ Example of `@at-root`"
  raw: 'When writing CSS, one situation we might come across often is where one class
    needs to have all the style rules of another, plus its own style. Writing this
    using simple CSS would require repeating the code. Using Sass, you can inherit
    these required styles using @extend.


    @extend is known as a selector inheritance. In selector inheritance, Sass inherits
    all the styles defined in another selector. Consider the example shown in [Listing
    3-13](#9781484213483_Ch03.xhtml#FPar13), where .notification is inherited in .success.


    [***Listing 3-13***](#9781484213483_Ch03.xhtml#_FPar13). An Example of Using @extend


    ```

    .notification{

      border-radius:5px;

      padding:5px;

    }


    .success{

      @extend .notification;

      background-color:#0F0;

    }

    ```


    ***Listing 3-14***. Output of [Listing 3-13](#9781484213483_Ch03.xhtml#FPar13)


    ```

    .notification, .success {

      border-radius: 5px;

      padding: 5px;

    }


    .success {

      background-color: #0F0;

    }

    ```


    There are some disadvantages of using @extend. For one, the result of extending
    may sometimes be unpredictable in a large file where the extended CSS selector
    is present multiple times. This could result in undesirable output.


    Another issue with using @extend is that it cannot be used inside @media declarations.


    @extend is also not as flexible as using mixins, as it cannot accept arguments.


    It is possible to create a single selector by extending multiple selectors, as
    shown in [Listing 3-15](#9781484213483_Ch03.xhtml#FPar15).


    [***Listing 3-15***](#9781484213483_Ch03.xhtml#_FPar15). Extending from Multiple
    Selectors


    ```

    .notification {

              border-radius: 5px;

              padding: 5px;

    }

    .errorLooks{

            Color:#F00;

            Background-color:rgba(255,0,0,0.5);

    }

    .error {

              @extend .notification;

            @extend .errorLooks;

    }

    ```


    ***Listing 3-16***. Output of [Listing 3-15](#9781484213483_Ch03.xhtml#FPar15)


    ```

    .notification, .error {

      border-radius: 5px;

      padding: 5px;

    }


    .errorLooks, .error {

      Color: #F00;

      Background-color: rgba(255, 0, 0, 0.5);

    }

    ```


    You can also perform chaining by extending the selectors in the next selector,
    as shown in [Listing 3-17](#9781484213483_Ch03.xhtml#FPar17).


    [***Listing 3-17***](#9781484213483_Ch03.xhtml#_FPar17). Chaining Within extend


    ```

    .notification {

              border-radius: 5px;

              padding: 5px;

    }

    .errorLooks{

      @extend .notification;

            Color:#F00;

            Background-color:rgba(255,0,0,0.5);

    }

    .error {

      @extend .errorLooks;

    }

    ```


    ***Listing 3-18***. Output of [Listing 3-17](#9781484213483_Ch03.xhtml#FPar17)


    ```

    .notification, .errorLooks, .error {

      border-radius: 5px;

      padding: 5px;

    }


    .errorLooks, .error {

      Color: #F00;

      Background-color: rgba(255, 0, 0, 0.5);

    }

    ```


    @extend Behind the Scenes


    Inheritance isn’t as simple as it seems. Understanding how extending works will
    give you insight into how selectors are inherited and thus will give you the ability
    to anticipate the output.


    Let’s take example used in previous section. The principle behind @extend is that
    if .error extends .notification, every instance of .error in the final stylesheet
    will be replaced with .notification, .error.


    There are two things regarding @extend that you should keep in mind:


    *   Inheritance generates comparatively less CSS than mixins, which does a somewhat
    similar thing. It only adds the selector in a comma-separated list and does not
    clone the properties.

    *   Cascading applies to inheritance similarly to how it does in normal CSS. When
    two rules with different values apply to the same element, cascading decides which
    rule will be applied. Thus the last rule is always applied.


    When to Use Selector Inheritance


    Suppose you are developing a web page and writing style rules and you find that
    one of your classes (.errorLooks) is a more specific version of another (.notification).
    How will you go about writing the style rule?


    *   You could replicate the same style rules in both the classes. However, this
    would result in lot of duplicate code and would go against the DRY principle.

    *   You could apply styles to group of selectors (.notification, .error). This
    is good, but over time will increase the complexity of your style code.

    *   You could use @extend provided by Sass and allow .error inherit from .notification.
    This makes the code far more readable and easier to understand.


    Placeholder Selectors


    While using Sass, you might come across situations where you want to write classes
    that you want to extend into other classes but don’t want it to be rendered into
    the final compiled CSS file. For example, you want to use a certain class containing
    code for rounded edges or margins that’s not useful independently.


    This can be achieved in Sass with something known as placeholder selector, which
    is rendered by prefixing the class name with %—for example %notification.


    [***Listing 3-19***](#9781484213483_Ch03.xhtml#_FPar19). Example of @extend Selectors


    ```

    %notification {

              border-radius: 5px;

              padding: 5px;

    }

    .errorLooks{

      @extend %notification;

    }

    ```


    [***Listing 3-20***](#9781484213483_Ch03.xhtml#_FPar20). Output of [Listing 3-19](#9781484213483_Ch03.xhtml#FPar19)


    ```

    .errorLooks {

      border-radius: 5px;

      padding: 5px;

    }

    ```


    As you see in [Listing 3-20](#9781484213483_Ch03.xhtml#FPar20), the notification
    extend class has not been rendered in the final output.


    Do More with @extend


    Classes are not the only things that can be extended. It is also possible to extend
    complex elements like a:hover, .notification, and .error, as shown in [Listing
    3-21](#9781484213483_Ch03.xhtml#FPar21).


    [***Listing 3-21***](#9781484213483_Ch03.xhtml#_FPar21). Example Demonstrating
    Extending a Complex Element


    ```

    a{

      color:#F00;

      &:hover{

        font-weight:bold;

      }

    }

    .notification{

            @extend a:hover ;

    }

    ```


    It is also possible to create multiple rules by extending multiple CSS classes
    in one selector, as shown in [Listing 3-22](#9781484213483_Ch03.xhtml#FPar22).


    [***Listing 3-22***](#9781484213483_Ch03.xhtml#_FPar22). Example Demonstrating
    Extending Multiple Classes


    ```

    .notification{

            Border-radius:50%;

    }

    .strongText{

            Font-weight:bold;

    }

    .error{

            @extend .notification;

            @extend .strongText;

            Color:#F00;

    }

    ```


    This code will give the output shown in [Listing 3-23](#9781484213483_Ch03.xhtml#FPar23).


    [***Listing 3-23***](#9781484213483_Ch03.xhtml#_FPar23). Output of [Listing 3-22](#9781484213483_Ch03.xhtml#FPar22)


    ```

    .notification, .error {

      Border-radius: 50%;

    }


    .strongText, .error {

      Font-weight: bold;

    }


    .error {

      Color: #F00;

    }

    ```


    It is also possible to chain the selectors while extending; that is, extending
    one selector that already extends another selector. Here is the modified code
    of [Listing 3-24](#9781484213483_Ch03.xhtml#FPar24) to demonstrate this phenomenon.


    [***Listing 3-24***](#9781484213483_Ch03.xhtml#_FPar24). Example Demonstrating
    Chaining extends


    ```

    .notification{

            Border-radius:50%;

    }

    .strongText{

      @extend .notification;

            Font-weight:bold;

    }

    .error{

            @extend .strongText;

            Color:#F00;

    }

    ```


    The output of this code will be same as shown in [Listing 3-23](#9781484213483_Ch03.xhtml#FPar23).


    There might be situations where you want @extend to be ignored if the extended
    selector has as error or is not present. You can use the !optional flag in that
    case. This will prevent @extend from producing results. This is demonstrated in
    [Listing 3-25](#9781484213483_Ch03.xhtml#FPar25).


    [***Listing 3-25***](#9781484213483_Ch03.xhtml#_FPar25). Example Showing !optional


    ```

    .success{

      @extend .lightText !optional;

    }

    ```


    @at-root


    The Sass @at-root directive causes the rules inside it to be rendered at the document
    root level, regardless of where they are nested. See [Listing 3-26](#9781484213483_Ch03.xhtml#FPar26).


    [***Listing 3-26***](#9781484213483_Ch03.xhtml#_FPar26). Example of @at-root'
  trans: "\n在编写 CSS 时，我们经常会遇到这样一种情况：某个类需要拥有另一个类的所有样式规则，同时还要有自己的样式。使用纯 CSS 编写这种需求会需要重复代码。而使用\
