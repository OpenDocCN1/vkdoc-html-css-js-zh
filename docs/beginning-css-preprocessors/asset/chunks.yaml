    ## Output Style


    By default, Sass outputs CSS in a nice structured format. But at the same time,
    it also provides options of various styles. Sass allows you to choose from four
    output styles that you can specify in the `--style` command-line parameter.


    ### nested


    This is the default style of Sass. It shows the CSS styles in normal format. Indentation
    is per the nesting in the original Sass document, as shown in [Listing 3-56](#9781484213483_Ch03.xhtml#FPar56).


    [***Listing 3-56***](#9781484213483_Ch03.xhtml#_FPar56). Example of Nested Styles


    ```css

    #container {

      color: #000; }

      #container p {

        padding: 10px; }

    ```


    ### expanded


    When this style is selected, the output derived is exactly as it would be if the
    CSS were handwritten. There won’t be any indentation for rules as would be with
    nested style of output, as shown in [Listing 3-57](#9781484213483_Ch03.xhtml#FPar57).


    [***Listing 3-57***](#9781484213483_Ch03.xhtml#_FPar57). Example of Expanded Styles


    ```css

    #container {

      color: #000;

    }


    #container p {

      padding: 10px;

    }

    ```


    ### compact


    Compact output consumes less space than the previous two styles. It puts all the
    properties on one single line, with one rule per line, as shown in [Listing 3-58](#9781484213483_Ch03.xhtml#FPar58).


    [***Listing 3-58***](#9781484213483_Ch03.xhtml#_FPar58). Example of Compact Styles


    ```css

    #container {color: #000;}

    #container p {padding: 10px;}

    ```


    ### compressed


    The compressed style takes minimum amount of space altogether. It eliminates all
    white space, as shown in [Listing 3-59](#9781484213483_Ch03.xhtml#FPar59).


    [***Listing 3-59***](#9781484213483_Ch03.xhtml#_FPar59). Example of Compressed
    Styles


    ```css

    #container {color: #000;}#container p {padding: 10px;}

    ```


    ## Building Your Own Grid System


    In this section, you will build your own grid system that can be used to build
    responsive web sites. This will help you understand how grid systems work and
    additionally help you create custom grid systems whenever you need them. A grid
    system allows content to be arranged vertically and horizontally in a consistent
    and flexible pattern.


    Grid systems are made of two components: rows and columns. Rows are containers
    that store the columns. Columns determine final structure and arrangement of content.


    To start building your own grid, lets first set some required classes and variables.
    This is shown in [Listing 3-60](#9781484213483_Ch03.xhtml#FPar60).


    [***Listing 3-60***](#9781484213483_Ch03.xhtml#_FPar60). Setting Initial Classes
    and Variables


    ```scss

    // Building custom grid system

    $column-spacing:2%;

    .col{

      float:left;

      margin-right:$column-spacing;

    }

    ```


    This code sets space between the two columns as `2%` and defines a `col` class,
    which will be used in addition to the column-specific classes. Next, you will
    create column classes for a variable number of columns. The example supports a
    maximum of 12 columns, as shown in [Listing 3-61](#9781484213483_Ch03.xhtml#FPar61).


    [***Listing 3-61***](#9781484213483_Ch03.xhtml#_FPar61). Calculating Various Column
    Classes


    ```scss

    // Building custom grid system

    $column-spacing:2%;

    .col{

      float:left;

      margin-right:$column-spacing;

    }


    .col-1   { width:percentage(1 / 12) - $column-spacing; }

    .col-2   { width:percentage(1 / 6) - $column-spacing; }

    .col-3   { width:percentage(1 / 4) - $column-spacing; }

    .col-4   { width:percentage(1 / 3) - $column-spacing; }

    .col-5   { width:percentage(1 / 2.4) - $column-spacing; }

    .col-6   { width:percentage(1 / 2) - $column-spacing; }

    .col-7   { width:percentage(1 / 1.714285714285714) - $column-spacing; }

    .col-8   { width:percentage(1 / 1.5) - $column-spacing; }

    .col-9   { width:percentage(1 / 1.333333333333333) - $column-spacing; }

    .col-10  { width:percentage(1 / 1.2) - $column-spacing; }

    .col-11  { width:percentage(1 / 1.090909090909091) - $column-spacing; }

    .col-12  { width:percentage(1); }

    ```


    This code generates the output in percentages. You can initially assume that there
    is only one single column, which is equivalent to 12 cols. So when you want to
    calculate one single column (`col-1`), the calculation for this would be:


    ```

    percentage(1/(total number of cols[12]/desired number of columns[1]) - column
    spacing);

    ```


    You need to subtract the column spacing, as `margin-right` is specified in the
    `.col` class. In order to calculate the column width for various column configurations,
    you need to change the value of desired number of columns. The output of this
    code is shown in [Listing 3-62](#9781484213483_Ch03.xhtml#FPar62).


    [***Listing 3-62***](#9781484213483_Ch03.xhtml#_FPar62). Output of [Listing 3-61](#9781484213483_Ch03.xhtml#FPar61)


