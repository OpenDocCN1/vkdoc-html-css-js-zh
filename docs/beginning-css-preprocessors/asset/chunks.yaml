  trans: "\n***列表 3-65***. 在 HTML 中使用生成的响应式网格（示例）\n\n```\n<div class=\"row\">\n  <div\
    \ class=\"col col-8\">\n    Far far away, behind the word mountains, far from\
    \ the countries Vokalia and Consonantia, there live the blind texts. Separated\
    \ they live in Bookmarksgrove right at the coast of the Semantics, a large language\
    \ ocean. A small river named Duden flows by their place and supplies it with the\
    \ necessary regelialia.\n  </div>\n  <div class=\"col col-4\">\n    This is a\
    \ sidebar area\n  </div>\n</div>\n```\n\n![9781484213483_Fig03-02.jpg](img/9781484213483_Fig03-02.jpg)\n\
    \n图 3-2. 列表 3-65 的输出\n\n## 总结\n\n本章讲解了 Sass 的高级主题，例如使用 `import` 包含其他 Sass 文件和使用指令、使用\
    \ `@media`、使用 `@extend` 进行扩展、使用 mixins，以及 Sass 提供的一些常用函数，并使用 `@function` 定义函数。\n\
    \n除了这些主题之外，你还学习了如何构建自己的网格系统。\n\n在下一章中，你将学习另一个类似 Sass 的框架，它提供了类似的功能，并且同样著名。\n\n\
    # 第 4 章\n\n![image](img/frontdot.jpg)\n\n# 使用 Less 进行开发\n\n在上一章中，你了解了可以用 Sass\
    \ 做的各种事情，包括 mixins 等各种技术。在本章中，你将了解另一个同样著名的预处理器框架，名为 *Less*。\n\n本章将探讨 Less 的以下方面：\n\
    \n*   Less 的客户端和服务端变体\n*   语言特性\n*   嵌套规则\n*   导入指令\n*   Mixin 守卫\n*   引用父级选择器\n\
    *   将 `&` 与守卫一起使用\n*   分离规则集\n*   合并属性\n*   循环 mixins\n*   函数\n\n## Less 简介\n\n\
    Less 是一种预处理器语言，会被编译成 CSS。它由 Alexis Sellier 创建。Less 遵循 Sass 的“SCSS”语法风格，而后者又类似于\
    \ CSS 语法。Less 是开源的。Less 最初是用 Ruby 编写的；然而，在后续版本中，它被用 JavaScript 重写。请注意，有效的 CSS\
    \ 也是有效的 Less 代码。Less 提供了与你在上一章中看到的 Sass 类似的功能，例如变量、嵌套、运算符、mixins 和函数；然而，使 Less\
    \ 区别于其他 CSS 预编译器的是它能够通过浏览器中的 `less.js` 进行实时编译。\n\n与 Sass 不同，Less 有两种变体。Less 有一个客户端变体，它在浏览器中编译\
    \ Less 代码；还有一个服务端变体，它在服务端编译文件，然后将其提供给浏览器。开发人员可以使用客户端变体来开发和测试代码。服务端变体可用于编译代码、压缩代码，然后使其可用于生产环境。\n\
    \n需要记住的一点是，客户端变体不会生成输出文件。它会在每次浏览器重新加载时编译代码。\n\n### Less 的客户端变体\n\n要使用 Less 的客户端变体，你需要下载名为\
    \ `less.js` 的客户端编译器，该编译器可在 [`lesscss.org/#download-options`](http://lesscss.org/#download-options)\
    \ 获取。下载完成后，将其复制到你的工作目录中。现在，让我们尝试使用这个 Less 编译器编写一些 Less 代码。\n\n***列表 4-1***. 示例的\
    \ HTML 标记\n\n```\n<html>\n        <head>\n                <title>列表 4-1</title>\n\
    \                <link type=\"text/css\" rel=\"stylesheet/less\" href=\"styles1.1.less\"\
    \ />\n                <script src=\"//cdnjs.cloudflare.com/ajax/libs/less.js/2.2.0/less.min.js\"\
    ></script>\n        </head>\n        <body>\n                <p class=\"impElement\"\
    >这是我的第一个 Less 代码</p>\n        </body>\n</html>\n```\n\n***列表 4-2***. `styles1.1.less`\
    \ 中的 Less 代码\n\n```\n.impElement{\n        background:#666;\n        padding:10px;\n\
    \        border-radius:10px;\n}\n```\n\n当你运行此页面时，输出将如图 4-1 所示。\n\n![9781484213483_Fig04-01.jpg](img/9781484213483_Fig04-01.jpg)\n\
    \n图 4-1. 列表 4-1 和 4-2 的输出\n\n![Image](img/sq.jpg) **注意** 在列表 4-1 提供的示例中，我们通过内容分发网络（CDN）链接了\
    \ `less.js`。要运行此代码，你需要一个 Web 服务器，否则 `less.js` 将无法加载。如果你希望在不运行 Web 服务器的情况下运行此示例，请下载\
    \ `less.js` 并在本地链接它。\n\n### 服务端变体\n\n客户端变体适用于开发和调试。但是，当部署到生产环境时，建议使用服务端变体——即将\
    \ Less 代码编译成浏览器友好的 CSS。为此，你需要安装 `lessc` 编译器。可以使用 node 包管理器进行安装。\n\n如果你没有安装 node，则需要先安装它。安装\
    \ Node.js 的步骤在此处有详细说明：[`howtonode.org/how-to-install-nodejs`](http://howtonode.org/how-to-install-nodejs)。\n\
    \n完成 Node.js 的安装后，你就可以开始安装 `lessc` 编译器了。在终端中运行列表 4-3 中的命令。\n\n***列表 4-3***. 安装\
    \ `lessc` 编译器的命令\n\n```\nnpm install -g less\n```\n\n你可以通过运行列表 4-4 中所示的命令来测试 `lessc`\
    \ 是否安装成功。\n\n***列表 4-4***. 检查 `lessc` 命令是否可用的命令\n\n```\nlessc -v\n```\n\n此命令将输出已安装的\
    \ `lessc` 版本。既然 `lessc` 编译器已经安装，让我们来看一下编译 Less 文件的过程。\n\n#### 编译 Less 文件\n\n你可以使用列表\
    \ 4-5 中所示的命令来编译一个 Less 文件。\n\n***列表 4-5***. 调用 `lessc` 编译器的命令\n\n```\nlessc style.less\n\
    ```\n\n此命令将直接在终端中为你提供输出。如果你希望将输出保存到 `.css` 文件中，则需要修改命令，添加一个由空格分隔的第二个参数，如列表 4-6\
    \ 所示。\n\n***列表 4-6***. 调用 `lessc` 编译器并将输出保存到另一个文件的命令\n\n```\nlessc style.less\
    \ style.css\n```\n\n可以使用各种选项来调用 `lessc` 编译器。列表 4-7 到 4-9 展示了一些支持的选项。\n\n***列表\
    \ 4-7***. `-h` 选项用于获取 `lessc` 编译器的帮助\n\n```\nlessc -h\n```\n\n***列表 4-8***. `--include`\
    \ 用于包含 Less 查找导入文件的路径\n\n```\nlessc --include-path=framework/;lib/\n```\n\n可用的导入路径可以用\
    \ `:` 或 `;` 分隔的列表指定。\n\n***列表 4-9***. 使用 `-l` 选项通过 `lessc` 编译器检查 Less 代码\n\n```\n\
    lessc -l style.less\n```\n\n除了这些之外，在调用 `lessc` 编译器时还可以使用许多其他选项。可以在 Less 文档中找到它们：[`lesscss.org/usage/index.html#command-line-usage-command-line-usage`](http://lesscss.org/usage/index.html#command-line-usage-command-line-usage)。\n\
    \n在下一节中，你将了解该语言提供的特性。\n\n## 语言特性\n\n本节涵盖 Less 提供的所有特性。许多特性与你之前章节中学到的类似；因此，它们应该很容易理解。\n\
    \n### 变量\n"
- fmt: "# Less 变量与混入\n\n## 变量\n\n`Less`中的变量用于存储值，使这些值能够在代码中重复使用。通过变量，您可以从单一位置控制可复用的值。在`Less`中，使用`@`符号创建变量。这一点在[Listing\
    \ 4-10](#9781484213483_Ch04.xhtml#FPar11)中进行了演示。\n\n[**Listing 4-10**](#9781484213483_Ch04.xhtml#_FPar11).\
    \ 声明和使用`Less`变量的示例\n\n```less\n@fontColor:#666;\nbody{\n        color:@fontColor;\n\
    }\n```\n\n**Listing 4-11**. [Listing 4-10](#9781484213483_Ch04.xhtml#FPar11)的输出\n\
    \n```css\nbody {\n  color: #666;\n}\n```\n\n变量的用途不仅限于赋值。它们还可以用于选择器、属性名称等位置。这可以通过插值（interpolation）实现，如[Listing\
    \ 4-12](#9781484213483_Ch04.xhtml#FPar13)所示。\n\n[**Listing 4-12**](#9781484213483_Ch04.xhtml#_FPar13).\
    \ 演示插值的示例\n\n```less\n@parent: container;\n.@{parent} {\n  width:100%;\n}\n```\n\
    \n[**Listing 4-13**](#9781484213483_Ch04.xhtml#_FPar14). [Listing 4-12](#9781484213483_Ch04.xhtml#FPar13)的输出\n\
    \n```css\n.container {\n  width: 100%;\n}\n```\n\n[Listing 4-14](#9781484213483_Ch04.xhtml#FPar15)至[4-18](#9781484213483_Ch04.xhtml#FPar19)展示了一些有效的变量声明示例。\n\
    \n[**Listing 4-14**](#9781484213483_Ch04.xhtml#_FPar15). 变量声明的有效示例\n\n```less\n\
    @color: red;\n@list: a b c d;\n@csv-list: a, b, c, d;\n```\n\n尽管变量类似于常量，但它们的值是可变的。它遵循一个简单的原则：后声明的变量生效。\n\
    \n在`Less`中，变量遵循惰性加载（lazy loading）模式，如[Listing 4-15](#9781484213483_Ch04.xhtml#FPar16)所示。惰性加载在技术上的含义是，对象可以在需要时才进行初始化。这与急加载（eager\
    \ loading）相反，急加载要求在使用前完成初始化。\n\n[**Listing 4-15**](#9781484213483_Ch04.xhtml#_FPar16).\
    \ 演示变量惰性加载的示例\n\n```less\n.container {\n        font-size: @size;\n}\n@size: 12px;\n\
    ```\n\n[**Listing 4-16**](#9781484213483_Ch04.xhtml#_FPar17). [Listing 4-15](#9781484213483_Ch04.xhtml#FPar16)的输出\n\
    \n```css\n.container {\n  font-size: 12px;\n}\n```\n\n从`Less`版本1.7开始，可以将一组属性存储到变量中。代码应放置在花括号内，类似于混入（mixin）的写法。这称为规则集（ruleset），如[Listing\
    \ 4-17](#9781484213483_Ch04.xhtml#FPar18)所示。\n\n[**Listing 4-17**](#9781484213483_Ch04.xhtml#_FPar18).\
    \ 演示存储和使用规则集的示例\n\n```less\n@disclaimer-ruleset: { color: #CCC; font-size: 10px;\
    \ };\n.disclaimer {\n        @disclaimer-ruleset();\n}\n```\n\n在[Listing 4-17](#9781484213483_Ch04.xhtml#FPar18)中，我们将一个规则集存储在变量中，并在`disclaimer`类内部使用它。[Listing\
    \ 4-18](#9781484213483_Ch04.xhtml#FPar19)显示了渲染后的最终输出。\n\n[**Listing 4-18**](#9781484213483_Ch04.xhtml#_FPar19).\
    \ [Listing 4-17](#9781484213483_Ch04.xhtml#FPar17)的输出\n\n```css\n.disclaimer {\n\
    \  color: #CCC;\n  font-size: 10px;\n}\n```\n\n## 注释\n\n注释有助于记录代码，使其更易于阅读和理解。您无需为了减小文件大小而减少注释数量。当文件被编译并生成最终的`CSS`代码时，注释会被移除。\n\
    \n在`Less`中添加注释的方式与`CSS`相同。注释写在`/* */`之间。您也可以使用`//`前缀来编写单行注释。\n\n有一种方法可以通知编译器某个特定注释是重要的，并且它应保留在最终编译版本中，如[Listing\
    \ 4-19](#9781484213483_Ch04.xhtml#FPar20)所示。\n\n[**Listing 4-19**](#9781484213483_Ch04.xhtml#_FPar20).\
    \ 告知编译器某个注释是重要的\n\n```less\n/*!\nThis needs to come in final output\n!*/\n```\n\
    \n## 混入\n\n混入是可复用的代码块，可以在整个代码中使用。混入可以包含完整的`CSS`规则。混入可以参数化；即它们可以接受参数，这使其非常灵活。在`Less`中定义混入的方式如[Listing\
    \ 4-20](#9781484213483_Ch04.xhtml#FPar21)所示。\n\n[**Listing 4-20**](#9781484213483_Ch04.xhtml#_FPar21).\
    \ `Less`中的混入示例\n\n```less\n.notification(@value:5px) {\n  border-radius: @value;\n\
    \  padding: @value;\n}\n.errorLooks{\n  .notification;\n}\n.successLooks{\n  .notification(10px);\n\
    }\n```\n\n在`Less`中，混入的声明方式类似于任何类定义。要在另一个规则中包含一个混入，只需写出混入的名称，前面加上句点，并可选地在括号内提供参数。混入允许您通过简单地将混入名称作为其属性之一，将一个类的所有属性嵌入到另一个类中。\n\
    \n[**Listing 4-21**](#9781484213483_Ch04.xhtml#_FPar22). [Listing 4-20](#9781484213483_Ch04.xhtml#FPar21)的输出\n\
    \n```css\n.errorLooks {\n  border-radius: 5px;\n  padding: 5px;\n}\n.successLooks\
    \ {\n  border-radius: 10px;\n  padding: 10px;\n}\n```\n\n如您所见，`notification`扩展类并未在最终输出中渲染。\n\
    \n此外，您可以混入一个类或`ID`选择器，这在[Listing 4-22](#9781484213483_Ch04.xhtml#FPar23)中进行了演示。\n\
    \n[**Listing 4-22**](#9781484213483_Ch04.xhtml#_FPar23). 混入`ID`和类的示例\n\n```less\n\
    .notification,#notification {\n  border-radius: 5px;\n  padding: 5px;\n}\n.errorLooks{\n\
    \  .notification;\n}\n.successLooks{\n  #notification;\n}\n```\n\n[**Listing 4-23**](#9781484213483_Ch04.xhtml#_FPar24).\
    \ [Listing 4-22](#9781484213483_Ch04.xhtml#FPar22)的输出\n\n```css\n.notification,\n\
    #notification {\n  border-radius: 5px;\n  padding: 5px;\n}\n.errorLooks {\n  border-radius:\
    \ 5px;\n  padding: 5px;\n}\n.successLooks {\n  border-radius: 5px;\n  padding:\
    \ 5px;\n}\n```\n\n如果您想创建一个混入，但不在渲染后的`.css`文件中输出它，只需在其后附加一对括号即可。您还可以在混入定义中包含选择器以及样式规则。这在[Listing\
    \ 4-24](#9781484213483_Ch04.xhtml#FPar25)中进行了演示。\n\n[**Listing 4-24**](#9781484213483_Ch04.xhtml#_FPar25).\
    \ 演示如何在混入定义中包含选择器的示例\n\n```less\n.notification() {\n  border-radius: 5px;\n  padding:\
    \ 5px;\n  &:hover{\n    border:2px solid #fff;\n  }\n}\n.errorLooks{\n  .notification;\n\
    }\n.successLooks{\n  .notification;\n}\n```\n\n**Listing 4-25**. [Listing 4-24](#9781484213483_Ch04.xhtml#FPar24)的输出\n\
    \n```css\n.errorLooks {\n  border-radius: 5px;\n  padding: 5px;\n}\n.errorLooks:hover\
    \ {\n  border: 2px solid #fff;\n}\n.successLooks {\n  border-radius: 5px;\n  padding:\
    \ 5px;\n}\n.successLooks:hover {\n  border: 2px solid #fff;\n}\n```\n\n并不总是需要包含整个混入。您也可以只包含其中的特定部分，例如，其中的选择器。这在[Listing\
    \ 4-26](#9781484213483_Ch04.xhtml#FPar27)中进行了演示。\n\n[**Listing 4-26**](#9781484213483_Ch04.xhtml#_FPar27).\
    \ 在另一个选择器内部使用混入中的选择器\n\n```less\n.notification() {\n  border-radius: 5px;\n  padding:\
    \ 5px;\n  .inner{\n      border:2px solid #fff;\n  }\n}\n.errorLooks{\n  .notification;\n\
    }\n.successLooks{\n  .notification .inner;\n}\n```\n\n[**Listing 4-27**](#9781484213483_Ch04.xhtml#FPar28).\
    \ [Listing 4-26](#9781484213483_Ch04.xhtml#FPar27)的输出\n\n```css\n.errorLooks {\n\
    \  border-radius: 5px;\n  padding: 5px;\n}\n.errorLooks .inner {\n  border: 2px\
    \ solid #fff;\n}\n.successLooks {\n  border: 2px solid #fff;\n}\n```\n\n如果您观察[Listing\
    \ 4-27](#9781484213483_Ch04.xhtml#FPar28)，`.sucessLooks`只采用了混入中内部样式（`inner`）的样式。当您在混入后附加`!important`时，所有属性都会带上`!important`，如[Listing\
    \ 4-28](#9781484213483_Ch04.xhtml#FPar29)所示。\n\n[**Listing 4-28**](#9781484213483_Ch04.xhtml#_FPar29).\
    \ 在混入中使用`!important`的实现"
  raw: 'Variables in Less are used to store values that would make them available
    to be used across the code. With variables, you can control the reusable values
    from single location. In Less, you create variables using the @ symbol. This is
    demonstrated in [Listing 4-10](#9781484213483_Ch04.xhtml#FPar11).


    [***Listing 4-10***](#9781484213483_Ch04.xhtml#_FPar11). Example of Declaring
    and Using Variables in Less


    ```

    @fontColor:#666;

    body{

            color:@fontColor;

    }

    ```


    ***Listing 4-11***. The Output of [Listing 4-10  ](#9781484213483_Ch04.xhtml#FPar11)


    ```

    body {

      color: #666;

    }

    ```


    Variables are used for more than just assigning values. They can be used in places
    like selectors, property names, etc. This can be done using interpolation, as
    shown in [Listing 4-12](#9781484213483_Ch04.xhtml#FPar13).


    [***Listing 4-12***](#9781484213483_Ch04.xhtml#_FPar13). Example Demonstrating
    Interpolation


    ```

    @parent: container;

    .@{parent} {

      width:100%;

    }

    ```


    [***Listing 4-13***](#9781484213483_Ch04.xhtml#_FPar14). Output of [Listing 4-13](#9781484213483_Ch04.xhtml#FPar14)


    ```

    .container {

      width: 100%;

    }

    ```


    [Listings 4-14](#9781484213483_Ch04.xhtml#FPar15) through [4-18](#9781484213483_Ch04.xhtml#FPar19)
    show some valid examples of variable declarations.


    [***Listing 4-14***](#9781484213483_Ch04.xhtml#_FPar15). Valid Example of Variable
    Declarations


    ```

    @color: red;

    @list: a b c d;

    @csv-list: a, b, c, d;

    ```


    Even though variables are similar to constants, their values are changeable. It
    works on a simple principle that the last declaration wins.


    In Less, variables follow the lazy loading pattern, as shown in [Listing 4-15](#9781484213483_Ch04.xhtml#FPar16).
    Lazy load technically means that an object can be initialized when it is needed.
    This is opposite of eager loading, whereby you need to initialize before you use
    them.


    [***Listing 4-15***](#9781484213483_Ch04.xhtml#_FPar16). Example Demonstrating
    Lazy Load in Variables


    ```

    .container {

            font-size: @size;

    }

    @size: 12px;

    ```


    [***Listing 4-16***](#9781484213483_Ch04.xhtml#_FPar17). Output of [Listing 4-15](#9781484213483_Ch04.xhtml#FPar16)


    ```

    .container {

      font-size: 12px;

    }

    ```


    With release of Less version 1.7, it is possible store groups of properties in
    a variable. The code should be placed between brackets just like with a mixin.
    This can be called ruleset, as shown in [Listing 4-17](#9781484213483_Ch04.xhtml#FPar18).


    [***Listing 4-17***](#9781484213483_Ch04.xhtml#_FPar18). Example Demonstrating
    Storing and Using Rulesets


    ```

    @disclaimer-ruleset: { color: #CCC; font-size: 10px; };

    .disclaimer {

            @disclaimer-ruleset();

    }

    ```


    In [Listing 4-17](#9781484213483_Ch04.xhtml#FPar18), we stored a ruleset in a
    variable and used it inside the disclaimer class. [Listing 4-18](#9781484213483_Ch04.xhtml#FPar19)
    shows the render final output.


    [***Listing 4-18***](#9781484213483_Ch04.xhtml#_FPar19). Output of [Listing 4-17](#9781484213483_Ch04.xhtml#FPar17)


    ```

    .disclaimer {

      color: #CCC;

      font-size: 10px;

    }

    ```


    Comments


    Comments help document your code and make it easier to read and understand. You
    don’t need to cut down on the number of comments to keep the file size smaller.
    When the file is compiled and the final CSS code is generated, comments are removed.


    Adding comments in Less is done same way as in CSS. Comments are written between
    /* */. You can also write single-line comments by prefixing them with //.


    There is a way by which you can notify the compiler that a specific comment is
    important and it should be allowed in the final compiled version, as shown in
    [Listing 4-19](#9781484213483_Ch04.xhtml#FPar20).


    [***Listing 4-19***](#9781484213483_Ch04.xhtml#_FPar20). Telling a Compiler That
    a Comment Is Important


    ```

    /*!

    This needs to come in final output

    !*/

    ```


    Mixins


    Mixins are reusable blocks of code that can be used across entire code. Mixins
    can contain full CSS rules. Mixins can be parameterized; i.e., they can accept
    arguments, which makes them flexible. Mixins are defined in Less as shown in [Listing
    4-20](#9781484213483_Ch04.xhtml#FPar21).


    [***Listing 4-20***](#9781484213483_Ch04.xhtml#_FPar21). Example of Mixins in
    Less


    ```

    .notification(@value:5px) {

      border-radius: @value;

      padding: @value;

    }

    .errorLooks{

      .notification;

    }

    .successLooks{

      .notification(10px);

    }

    ```


    In Less, mixins are declared like any class definition. When including a mixin
    in another rule, you just write the mixin name preceded by a period with the optional
    parameters within parentheses. Mixins allow you to embed all the properties of
    one class into another class by simply including the mixin name as one of its
    properties.


    [***Listing 4-21***](#9781484213483_Ch04.xhtml#_FPar22). Output of [Listing 4-20](#9781484213483_Ch04.xhtml#FPar21)


    ```

    .errorLooks {

      border-radius: 5px;

      padding: 5px;

    }

    .successLooks {

      border-radius: 10px;

      padding: 10px;

    }

    ```


    As you see, the notification extend class has not been rendered in the final output.


    In addition to this, you can mix in a class or an ID selector, which is demonstrated
    in [Listing 4-22](#9781484213483_Ch04.xhtml#FPar23).


    [***Listing 4-22***](#9781484213483_Ch04.xhtml#_FPar23). Mixing in an ID and Class
    Together


    ```

    .notification,#notification {

      border-radius: 5px;

      padding: 5px;

    }

    .errorLooks{

      .notification;

    }

    .successLooks{

      #notification;

    }

    ```


    [***Listing 4-23***](#9781484213483_Ch04.xhtml#_FPar24). Output of [Listing 4-22](#9781484213483_Ch04.xhtml#FPar22)


    ```

    .notification,

    #notification {

      border-radius: 5px;

      padding: 5px;

    }

    .errorLooks {

      border-radius: 5px;

      padding: 5px;

    }

    .successLooks {

      border-radius: 5px;

      padding: 5px;

    }

    ```


    If you want to create a mixin, but not output it in the rendered .css file, simply
    append parentheses to it. You can also include selectors in addition to style
    rules in your mixin definition. This is demonstrated in [Listing 4-24](#9781484213483_Ch04.xhtml#FPar25).


    [***Listing 4-24***](#9781484213483_Ch04.xhtml#_FPar25). Example Demonstrating
    How to Include Selectors Inside a Mixin Definition


    ```

    .notification() {

      border-radius: 5px;

      padding: 5px;

      &:hover{

        border:2px solid #fff;

      }

    }

    .errorLooks{

      .notification;

    }

    .successLooks{

      .notification;

    }

    ```


    ***Listing 4-25***. Output of [Listing 4-24](#9781484213483_Ch04.xhtml#FPar24)


    ```

    .errorLooks {

      border-radius: 5px;

      padding: 5px;

    }

    .errorLooks:hover {

      border: 2px solid #fff;

    }

    .successLooks {

      border-radius: 5px;

      padding: 5px;

    }

    .successLooks:hover {

      border: 2px solid #fff;

    }

    ```


    It is not necessary to always include the entire mixin. You can also include specific
    parts of it as well, for example, the selector inside of it. This is demonstrated
    in [Listing 4-26](#9781484213483_Ch04.xhtml#FPar27).


    [***Listing 4-26***](#9781484213483_Ch04.xhtml#_FPar27). Using a Selector Inside
    a Mixin Inside Another Selector


    ```

    .notification() {

      border-radius: 5px;

      padding: 5px;

      .inner{

          border:2px solid #fff;

      }

    }

    .errorLooks{

      .notification;

    }

    .successLooks{

      .notification .inner;

    }

    ```


    [***Listing 4-27***](#9781484213483_Ch04.xhtml#_FPar28). Output of [Listing 4-26](#9781484213483_Ch04.xhtml#FPar27)


    ```

    .errorLooks {

      border-radius: 5px;

      padding: 5px;

    }

    .errorLooks .inner {

      border: 2px solid #fff;

    }

    .successLooks {

      border: 2px solid #fff;

    }

    ```


    If you observe in [Listing 4-27](#9781484213483_Ch04.xhtml#FPar28), .sucessLooks
    has only taken the style of the inner styles within the mixin. When you append
    !important after mixin, all properties are included with important, as demonstrated
    in [Listing 4-28](#9781484213483_Ch04.xhtml#FPar29).


    [***Listing 4-28***](#9781484213483_Ch04.xhtml#_FPar29). Implementation of !important
    with Mixin'
  trans: "\n# Less 变量与混入\n\n## 变量\n\n`Less`中的变量用于存储值，使这些值能够在代码中重复使用。通过变量，您可以从单一位置控制可复用的值。在`Less`中，使用`@`符号创建变量。这一点在\
