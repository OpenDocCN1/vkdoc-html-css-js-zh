    \ to the root of your project when deployed:\nhttp_path = \"../\"\ncss_dir = \"\
    stylesheets\"\nsass_dir = \"sass\"\nimages_dir = \"images\"\njavascripts_dir = \"\
    javascripts\"\n```\n\n[Listing 5-63](#9781484213483_Ch05.xhtml#_FPar64). Example\
    \ demonstrating image-url()\n\n```\n// Background image using image-url\n.bgImage{\n\
       width:128px;\n   height:128px;\n   background:image-url(\"facebook.png\");\n\
    }\n```\n\nIn this code, image-url will automatically add the relative path to\
    \ the background image.\n\n[***Listing 5-64***](#9781484213483_Ch05.xhtml#_FPar65).\
    \ Output of [Listing 5-63](#9781484213483_Ch05.xhtml#FPar64)\n\n```\n/* line 148,\
    \ ../sass/screen.scss */\n.bgImage {\n  width: 128px;\n  height: 128px;\n  background:\
    \ url('../images/facebook.png?1447046278');\n}\n```\n\nImage-width()\n\nInstead\
    \ of manually finding out the width of the background image, you can use the image-width\
    \ function provided by Compass.\n\nThis function takes the input of the background\
    \ image path/name and returns the width in units of px. This is demonstrated in\
    \ [Listing 5-65](#9781484213483_Ch05.xhtml#FPar66).\n\n[***Listing 5-65***](#9781484213483_Ch05.xhtml#_FPar66).\
    \ Example of Using image-width\n\n```\n// Background image using image-url\n.bgImage{\n\
      width:image-width(\"facebook.png\");\n  height:128px;\n  background:image-url(\"\
    facebook.png\");\n}\n```\n\nThe output of this is same as in [Listing 5-64](#9781484213483_Ch05.xhtml#FPar65).\n\
    \nImage-height()\n\nSimilar to the image width function, you have image-height\
    \ function that returns the height of the image passed to it. This is demonstrated\
    \ in [Listing 5-66](#9781484213483_Ch05.xhtml#FPar67).\n\n[***Listing 5-66***](#9781484213483_Ch05.xhtml#_FPar67).\
    \ Example of Using image-height\n\n```\n// Background image using image-url\n\
    .bgImage{\n  width:image-width(\"facebook.png\");\n  height:image-height(\"facebook.png\"\
    );\n  background:image-url(\"facebook.png\");\n}\n```\n\nThe output of this is\
    \ the same as [Listing 5-64](#9781484213483_Ch05.xhtml#FPar65).\n\nImage Sprites\
    \ and Compass"
