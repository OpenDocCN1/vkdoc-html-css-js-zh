    Mixin Directives


    As your CSS grows, you’ll come across situations where you need to replicate entire
    chunk of styles as-is or with slight variations.


    Mixins, declared using @mixin, are used to create reusable style code that can
    be used across the entire stylesheet. Mixins can contain full CSS rules. Mixins
    can take arguments, which makes them flexible.


    Mixins are defined using the @mixin directive followed by the name of the mixin
    and optional argument and block containing code, as shown in [Listing 3-30](#9781484213483_Ch03.xhtml#FPar30).


    [***Listing 3-30***](#9781484213483_Ch03.xhtml#_FPar30). Example of a Mixin


    ```

    @mixin roundedEdges($radius:5px) {

      -webkit-border-radius: $radius;

         -moz-border-radius: $radius;

          -ms-border-radius: $radius;

              border-radius: $radius;

    }

    .container {@include roundedEdges(10px);}

    ```


    This example shows a mixin that generates code for rounded edges, which accepts
    a single parameter whose default value is set to 5px if it’s not provided.


    ***Listing 3-31***. Output of [Listing 3-30](#9781484213483_Ch03.xhtml#FPar30)


    ```

    .container {

      -webkit-border-radius: 10px;

      -moz-border-radius: 10px;

      -ms-border-radius: 10px;

      border-radius: 10px;

    }

    ```


    This example shows how the mixins are defined and included. The mixins are defined
    using @mixin. They are included using @include. In this example, we have also
    provided an argument with its default value.


    You can also create compounded mixins, by including other mixins, as shown in
    [Listing 3-32](#9781484213483_Ch03.xhtml#FPar32).


    [***Listing 3-32***](#9781484213483_Ch03.xhtml#_FPar32). Example of a Compound
    Mixin


    ```

    @mixin success {

      @include notification;

      @include successTheme;

    }

    ```


    Mixin arguments are written in variable format, separated by commas if more than
    one argument is there. These arguments can have default values that will be used
    if no value is provided as an argument.


    [***Listing 3-33***](#9781484213483_Ch03.xhtml#_FPar33). Passing a Block of Code
    as an Argument to a Mixin


    ```

    @mixin clearFix {

      &:after {

        @content;

      }

    }


    .btn {

      display: inline-block;

      @include clearFix {

        clear:both;

      }

    }

    ```


    ***Listing 3-34***. Output of [Listing 3-33](#9781484213483_Ch03.xhtml#FPar33)


    ```

    .btn {

      display: inline-block;

    }


    .btn:after {

      clear: both;

    }

    ```


    Mixins versus Classes


    Mixins make reusing styles in a stylesheet very easy. Any piece of style code
    that’s repeated is a good candidate for a mixin. For example, a group of properties
    that make sense to set together like border radius, background gradient, and so
    on, would be a good mixin.


    Mixins are very similar to CSS classes. Both let you store chunks of style. The
    most important difference between these two is that classes are meant to be used
    in your HTML, whereas mixins are used to create reusable chunks to use within
    stylesheets.


    Hence, the classes should have a meaningful name that properly identifies the
    element. Mixins names should be related to the functionality they provide.


    Mixins with CSS Selectors


    Mixins can contain CSS selectors in addition to properties. This is demonstrated
    in [Listing 3-35](#9781484213483_Ch03.xhtml#FPar35).


    [***Listing 3-35***](#9781484213483_Ch03.xhtml#_FPar35). CSS Selectors Within
    a Mixin


    ```

    @mixin importantInfo {

      font-weight:strong;

      li {

        margin: 0px 5px;

      }

    }


    .notfication{

      border-radius:35%;

      @include importantInfo;

    }

    ```


    This example creates a mixin named importantInfo, which contains its own style
    rule plus the CSS selector li with its own rule. This is included in the notification
    class. The result of this code is shown in [Listing 3-36](#9781484213483_Ch03.xhtml#FPar36).


    [***Listing 3-36***](#9781484213483_Ch03.xhtml#_FPar36). Output of [Listing 3-35](#9781484213483_Ch03.xhtml#FPar35)


    ```

    .notfication {

      border-radius: 35%;

      font-weight:strong;

    }


    .notfication li {

      margin: 0px 5px;

    }

    ```


    Arguments to Mixins


    Mixins in Sass can accept arguments that are provided while calling that mixin.
    This helps the mixin provide different behaviors, depending on arguments provided
    and thus make it useful for a wide range of scenarios.


    Arguments are passed as comma-separated lists of variables, inside parentheses,
    after the name of the mixin. This is demonstrated in [Listing 3-37](#9781484213483_Ch03.xhtml#FPar37).


    [***Listing 3-37***](#9781484213483_Ch03.xhtml#_FPar37). Passing Arguments in
    Mixins


    ```

    @mixin fancyBorder($fbColor, $fbWidth) {

      border-color: $fbColor;

      border-width: $fbWidth;

      border-style: dashed;

    }


    .specialNote{

      @include fancyBorder(#000,2px)

    }

    ```


    This example includes the mixin named fancyBorder, which takes two arguments:
    borderColor and borderWidth. The output of this is shown in [Listing 3-38](#9781484213483_Ch03.xhtml#FPar38).


    [***Listing 3-38***](#9781484213483_Ch03.xhtml#_FPar38). Output of [Listing 3-37](#9781484213483_Ch03.xhtml#FPar37)


    ```

    .specialNote {

      border-color: #000;

      border-width: 2px;

      border-style: dashed;

    }

    ```


    Mixins can also assume default values for their arguments. Thus, when you don’t
    pass any value to the mixin, it will assume the default values. This can be demonstrated
    by modifying the code in [Listing 3-39](#9781484213483_Ch03.xhtml#FPar39).


    [***Listing 3-39***](#9781484213483_Ch03.xhtml#_FPar39). Example Demonstrating
    Default Variables


    ```

    @mixin fancyBorder($fbColor:#000, $fbWidth:2px) {

      Border-color: $fbColor;

      Border-width: $fbWidth;

      Border-style: dashed;

    }


    .specialNote{

      @include fancyBorder;

    }

    ```


    Mixins also allow you to pass keyword arguments. This makes mixins even more flexible
    by allowing arguments to be passed in any order. This is shown in [Listing 3-40](#9781484213483_Ch03.xhtml#FPar40).


    [***Listing 3-40***](#9781484213483_Ch03.xhtml#_FPar40). Keyword Argument Example


    ```

    .specialNote{

      @include fancyBorder($borderColor:#00F, $borderWidth:1px)

    }

