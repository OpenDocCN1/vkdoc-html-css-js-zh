- fmt: "# Image Sprites with Compass\n\nBest practices in web development say that\
    \ it is good to use image sprites instead of using individual images. An image\
    \ sprite is a single image created by combining all the other images. This single\
    \ image is then shifted in the visible area with `background-position` property.\
    \ As this is a single image that gets loaded at the start, there is no delay in\
    \ seeing the images.\n\nIt is a useful technique, requiring a good amount of effort\
    \ if done manually. Compass makes using image sprites simple by eliminating the\
    \ effort and complexities involved.\n\n## Creating Image Sprites with Compass\n\
    \nFor creating image sprites with compass, you need a folder that will contain\
    \ all the images to be placed in an image sprite. You will make a folder called\
    \ `image-sprite` at the root of the project and place the images in it. You will\
    \ be adding four files to this folder, as shown in [Figure 5-20](#9781484213483_Ch05.xhtml#Fig20).\n\
    \n![9781484213483_Fig05-20.jpg](OEBPS/Images/9781484213483_Fig05-20.jpg)\n\n[Figure\
    \ 5-20](#9781484213483_Ch05.xhtml#_Fig20). Addding images to the sprite folder\n\
    \nNext, you need to import these into the SCSS file. This can be done as shown\
    \ in [Listing 5-67](#9781484213483_Ch05.xhtml#FPar68).\n\n[***Listing 5-67***](#9781484213483_Ch05.xhtml#_FPar68).\
    \ Generating the Image Sprite\n\n```\n// example of creating image sprite\n@import\
    \ \"image-loaded/*.png\";\n.socials{\n   @include all-image-loaded-sprites;\n\
    }\n```\n\nIn the previous code, the `import` statement will create the image sprite\
    \ file. The next `@include` statement will generate the necessary CSS code for\
    \ using the sprite. The output of this code is shown in [Listing 5-68](#9781484213483_Ch05.xhtml#FPar69).\n\
    \n[***Listing 5-68***](#9781484213483_Ch05.xhtml#_FPar69). Output of [Listing\
    \ 5-67](#9781484213483_Ch05.xhtml#FPar67)\n\n```\n/* line 72, image-loaded/*.png\
    \ */\n.image-loaded-sprite, .socials .image-loaded-facebook, .socials .image-loaded-googleplus,\
    \ .socials .image-loaded-linkedin, .socials .image-loaded-twitter {\n  background-image:\
    \ url('/images/image-loaded-sbf38a83327.png');\n  background-repeat: no-repeat;\n\
    }\n\n/* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-facebook {\n  background-position: 0 0;\n}\n/* line\
    \ 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-googleplus {\n  background-position: 0 -128px;\n\
    }\n/* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-linkedin {\n  background-position: 0 -256px;\n}\n\
    /* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-twitter {\n  background-position: 0 -384px;\n}\n\
    ```\n\n![9781484213483_Fig05-21.jpg](OEBPS/Images/9781484213483_Fig05-21.jpg)\n\
    \nFigure 5-21\\. Image sprite generated from the previous example\n\n## Text Hiding\n\
    \nCompass provides a few mixins to deal with hiding text when using `background-image`.\n\
    \nThe first mixin to look at is the `hide-text` mixin. It is implemented as shown\
    \ in [Listing 5-69](#9781484213483_Ch05.xhtml#FPar70).\n\n[***Listing 5-69***](#9781484213483_Ch05.xhtml#_FPar70).\
    \ Example Demonstrating `hide-text`\n\n```\n// example of creating image sprite\n\
    @import \"image-loaded/*.png\";\n.socials{\n   @include all-image-loaded-sprites;\n\
    \   @include hide-text;\n}\n```\n\nIn the previous code, the mixin is included\
    \ to hide text after creating the socials image sprite. The output of this code\
    \ is shown in [Listing 5-70](#9781484213483_Ch05.xhtml#FPar71).\n\n[***Listing\
    \ 5-70***](#9781484213483_Ch05.xhtml#_FPar71). Output of [Listing 5-69](#9781484213483_Ch05.xhtml#FPar69)\n\
    \n```\n.image-loaded-sprite, .socials .image-loaded-facebook, .socials .image-loaded-googleplus,\
    \ .socials .image-loaded-linkedin, .socials .image-loaded-twitter {\n  background-image:\
    \ url('/images/image-loaded-sbf38a83327.png');\n  background-repeat: no-repeat;\n\
    }\n\n/* line 156, ../sass/screen.scss */\n.socials {\n  text-indent: -119988px;\n\
    \  overflow: hidden;\n  text-align: left;\n  text-transform: capitalize;\n}\n\
    ```\n\nThis certainly does the job; however, there is catch. When `@include hide-text`\
    \ is added, it shifts the text. This means the browser is rendering an element\
    \ with the text in it, 119988px off the screen. This works fine on computers but\
    \ may cause issues on mobile devices. Hence, Compass provides some alternative\
    \ techniques.\n\nCompass provides another mixin called `squish-text` to squish\
    \ the text. This means that the text will be visually hidden but still accessible\
    \ to screen readers. This is demonstrated in [Listing 5-71](#9781484213483_Ch05.xhtml#FPar72).\n\
    \n[***Listing 5-71***](#9781484213483_Ch05.xhtml#_FPar72). Example Demonstrating\
    \ `squish-text`\n\n```\n// example of creating image sprite\n@import \"image-loaded/*.png\"\
    ;\n.socials{\n   @include all-image-loaded-sprites;\n   @include squish-text;\n\
    \   .icons {\n      width:128px;\n      height:128px;\n   }\n}\n```\n\nVisually\
    \ this appears the same as the previous example, but unlike the previous example,\
    \ it is hiding the text inline. This can be seen in [Listing 5-72](#9781484213483_Ch05.xhtml#FPar73).\n\
    \n[***Listing 5-72***](#9781484213483_Ch05.xhtml#_FPar73). Output of [Listing\
    \ 5-71](#9781484213483_Ch05.xhtml#FPar71)\n\n```\n/* line 72, image-loaded/*.png\
    \ */\n.image-loaded-sprite, .socials .image-loaded-facebook, .socials .image-loaded-googleplus,\
    \ .socials .image-loaded-linkedin, .socials .image-loaded-twitter {\n  background-image:\
    \ url('../images/image-loaded-sbf38a83327.png');\n  background-repeat: no-repeat;\n\
    }\n\n/* line 156, ../sass/screen.scss */\n.socials {\n  font: 0/0 serif;\n  text-shadow:\
    \ none;\n  color: transparent;\n}\n/* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-facebook {\n  background-position: 0 0;\n}\n/* line\
    \ 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-googleplus {\n  background-position: 0 -128px;\n\
    }\n/* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-linkedin {\n  background-position: 0 -256px;\n}\n\
    /* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-twitter {\n  background-position: 0 -384px;\n}\n\
    /* line 159, ../sass/screen.scss */\n.socials .icons {\n  width: 128px;\n  height:\
    \ 128px;\n}\n```\n\n[***Listing 5-73***](#9781484213483_Ch05.xhtml#_FPar74). HTML\
    \ code for [Listing 5-71](#9781484213483_Ch05.xhtml#FPar71)\n\n```\n<h1>Implementation\
    \ of Image sprite</h1>\n<div class=\"socials\">\n<div class=\"image-loaded-facebook\
    \ icons\"></div>\n</div>\n```\n\nWhen not working with image sprites, Compass\
    \ provides a mixin for showing an image instead of text. This is useful in situations\
    \ when you want to replace a header tag with a logo.\n\nThis mixin sets the dimensions\
    \ of the element according to the size of the image used. This can be seen in\
    \ [Listing 5-74](#9781484213483_Ch05.xhtml#FPar75).\n\n[***Listing 5-74***](#9781484213483_Ch05.xhtml#_FPar75).\
    \ Example of `replace-text-with-dimensions`\n\n```\n.singleSocial{\n   @include\
    \ replace-text-with-dimensions(\"../images/facebook.png\");\n}\n```\n\n***Listing\
    \ 5-75***. Output of [Listing 5-74](#9781484213483_Ch05.xhtml#FPar74)\n\n```\n\
    /* line 161, ../sass/screen.scss */\n.singleSocial {\n  text-indent: -119988px;\n\
    \  overflow: hidden;\n  text-align: left;\n  text-transform: capitalize;\n  background-image:\
    \ url('/images/../images/facebook.png?1447046278');\n  background-repeat: no-repeat;\n\
    \  background-position: 50% 50%;\n  width: 128px;\n  height: 128px;\n}\n```\n\n\
    ## Inline Images with Compass"
  raw: 'Best practices in web development say that it is good to use image sprites
    instead of using individual images. An image sprite is a single image created
    by combining all the other images. This single image is then shifted in the visible
    area with background-position property. As this is a single image that gets loaded
    at the start, there is no delay in seeing the images.


    It is a useful technique, requiring a good amount of effort if done manually.
    Compass makes using image sprites simple by eliminating the effort and complexities
    involved.


    For creating image sprites with compass, you need a folder that will contain all
    the images to be placed in an image sprite. You will make a folder called image-sprite
    at the root of the project and place the images in it. You will be adding four
    files to this folder, as shown in [Figure 5-20](#9781484213483_Ch05.xhtml#Fig20).


    ![9781484213483_Fig05-20.jpg](OEBPS/Images/9781484213483_Fig05-20.jpg)


    [Figure 5-20](#9781484213483_Ch05.xhtml#_Fig20). Addding images to the sprite
    folder


    Next, you need to import these into the SCSS file. This can be done as shown in
    [Listing 5-67](#9781484213483_Ch05.xhtml#FPar68).


    [***Listing 5-67***](#9781484213483_Ch05.xhtml#_FPar68). Generating the Image
    Sprite


    ```

    // example of creating image sprite

    @import "image-loaded/*.png";

    .socials{

       @include all-image-loaded-sprites;

    }

    ```


    In the previous code, the import statement will create the image sprite file.
    The next @include statement will generate the necessary CSS code for using the
    sprite. The output of this code is shown in [Listing 5-68](#9781484213483_Ch05.xhtml#FPar69).


    [***Listing 5-68***](#9781484213483_Ch05.xhtml#_FPar69). Output of [Listing 5-67](#9781484213483_Ch05.xhtml#FPar67)


    ```

    /* line 72, image-loaded/*.png */

    .image-loaded-sprite, .socials .image-loaded-facebook, .socials .image-loaded-googleplus,
    .socials .image-loaded-linkedin, .socials .image-loaded-twitter {

      background-image: url(''/images/image-loaded-sbf38a83327.png'');

      background-repeat: no-repeat;

    }


    /* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss
    */

    .socials .image-loaded-facebook {

      background-position: 0 0;

    }

    /* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss
    */

    .socials .image-loaded-googleplus {

      background-position: 0 -128px;

    }

    /* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss
    */

    .socials .image-loaded-linkedin {

      background-position: 0 -256px;

    }

    /* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss
    */

    .socials .image-loaded-twitter {

      background-position: 0 -384px;

    }

    ```


    ![9781484213483_Fig05-21.jpg](OEBPS/Images/9781484213483_Fig05-21.jpg)


    Figure 5-21\. Image sprite generated from the previous example


    Text Hiding


    Compass provides a few mixins to deal with hiding text when using background-image.


    The first mixin to look at is the hide-text mixin. It is implemented as shown
    in [Listing 5-69](#9781484213483_Ch05.xhtml#FPar70).


    [***Listing 5-69***](#9781484213483_Ch05.xhtml#_FPar70). Example Demonstrating
    hide-text


    ```

    // example of creating image sprite

    @import "image-loaded/*.png";

    .socials{

       @include all-image-loaded-sprites;

       @include hide-text;

    }

    ```


    In the previous code, the mixin is included to hide text after creating the socials
    image sprite. The output of this code is shown in [Listing 5-70](#9781484213483_Ch05.xhtml#FPar71).


    [***Listing 5-70***](#9781484213483_Ch05.xhtml#_FPar71). Output of [Listing 5-69](#9781484213483_Ch05.xhtml#FPar69)


    ```

    .image-loaded-sprite, .socials .image-loaded-facebook, .socials .image-loaded-googleplus,
    .socials .image-loaded-linkedin, .socials .image-loaded-twitter {

      background-image: url(''/images/image-loaded-sbf38a83327.png'');

      background-repeat: no-repeat;

    }


    /* line 156, ../sass/screen.scss */

    .socials {

      text-indent: -119988px;

      overflow: hidden;

      text-align: left;

      text-transform: capitalize;

    }

    ```


    This certainly does the job; however, there is catch. When @include hide-text
    is added, it shifts the text. This means the browser is rendering an element with
    the text in it, 119988px off the screen. This works fine on computers but may
    cause issues on mobile devices. Hence, Compass provides some alternative techniques.


    Compass provides another mixin called squish-text to squish the text. This means
    that the text will be visually hidden but still accessible to screen readers.
    This is demonstrated in [Listing 5-71](#9781484213483_Ch05.xhtml#FPar72).


    [***Listing 5-71***](#9781484213483_Ch05.xhtml#_FPar72). Example Demonstrating
    squish-text


