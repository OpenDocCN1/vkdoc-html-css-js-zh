  trans: "\n# 使用 Compass 实现 CSS 图像精灵\n\nWeb 开发的最佳实践指出，使用图像精灵比使用单个图像更好。图像精灵是将所有其他图像合并而成的单个图像。然后通过\
    \ `background-position` 属性在可视区域内移动这个单个图像。由于这个图像在加载之初就会被加载，因此查看图像时不会有延迟。\n\n这是一个实用的技术，但如果手动操作，需要花费大量精力。Compass\
    \ 简化了使用图像精灵的过程，消除了相关的工作量和复杂性。\n\n## 使用 Compass 创建图像精灵\n\n要使用 Compass 创建图像精灵，你需要一个文件夹来存放所有要放入图像精灵中的图片。你需要在项目根目录下创建一个名为\
    \ `image-sprite` 的文件夹，并将图片放入其中。你需要向该文件夹添加四个文件，如图 5-20 所示。\n\n![9781484213483_Fig05-20.jpg](img/9781484213483_Fig05-20.jpg)\n\
    \n图 5-20。向精灵文件夹添加图片\n\n接下来，你需要将这些图片导入到 SCSS 文件中。具体操作如代码清单 5-67 所示。\n\n***代码清单\
    \ 5-67***。生成图像精灵\n\n```\n// 创建图像精灵的示例\n@import \"image-loaded/*.png\";\n.socials{\n\
    \   @include all-image-loaded-sprites;\n}\n```\n\n在上述代码中，`import` 语句将创建图像精灵文件。接下来的\
    \ `@include` 语句将生成使用该精灵所需的 CSS 代码。此代码的输出如代码清单 5-68 所示。\n\n***代码清单 5-68***。代码清单\
    \ 5-67 的输出\n\n```\n/* line 72, image-loaded/*.png */\n.image-loaded-sprite, .socials\
    \ .image-loaded-facebook, .socials .image-loaded-googleplus, .socials .image-loaded-linkedin,\
    \ .socials .image-loaded-twitter {\n  background-image: url('/images/image-loaded-sbf38a83327.png');\n\
    \  background-repeat: no-repeat;\n}\n\n/* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-facebook {\n  background-position: 0 0;\n}\n/* line\
    \ 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-googleplus {\n  background-position: 0 -128px;\n\
    }\n/* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-linkedin {\n  background-position: 0 -256px;\n}\n\
    /* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-twitter {\n  background-position: 0 -384px;\n}\n\
    ```\n\n![9781484213483_Fig05-21.jpg](img/9781484213483_Fig05-21.jpg)\n\n图 5-21\\\
    . 从上述示例生成的图像精灵\n\n## 文本隐藏\n\nCompass 提供了几个混入（mixin），用于在使用 `background-image` 时处理文本隐藏。\n\
    \n首先要介绍的混入是 `hide-text` 混入。其实现如代码清单 5-69 所示。\n\n***代码清单 5-69***。演示 `hide-text`\
    \ 的示例\n\n```\n// 创建图像精灵的示例\n@import \"image-loaded/*.png\";\n.socials{\n   @include\
    \ all-image-loaded-sprites;\n   @include hide-text;\n}\n```\n\n在上述代码中，包含该混入是为了在创建社交图标图像精灵后隐藏文本。此代码的输出如代码清单\
    \ 5-70 所示。\n\n***代码清单 5-70***。代码清单 5-69 的输出\n\n```\n.image-loaded-sprite, .socials\
    \ .image-loaded-facebook, .socials .image-loaded-googleplus, .socials .image-loaded-linkedin,\
    \ .socials .image-loaded-twitter {\n  background-image: url('/images/image-loaded-sbf38a83327.png');\n\
    \  background-repeat: no-repeat;\n}\n\n/* line 156, ../sass/screen.scss */\n.socials\
    \ {\n  text-indent: -119988px;\n  overflow: hidden;\n  text-align: left;\n  text-transform:\
    \ capitalize;\n}\n```\n\n这显然能完成任务；但有一个问题。当添加 `@include hide-text` 时，它会偏移文本。这意味着浏览器正在渲染一个包含文本的元素，该文本在屏幕外\
    \ 119988px 处。这在计算机上运行良好，但在移动设备上可能会引起问题。因此，Compass 提供了一些替代技术。\n\nCompass 提供了另一个名为\
    \ `squish-text` 的混入，用于压缩文本。这意味着文本在视觉上将被隐藏，但屏幕阅读器仍然可以访问。这在代码清单 5-71 中进行了演示。\n\n\
    ***代码清单 5-71***。演示 `squish-text` 的示例\n\n```\n// 创建图像精灵的示例\n@import \"image-loaded/*.png\"\
    ;\n.socials{\n   @include all-image-loaded-sprites;\n   @include squish-text;\n\
    \   .icons {\n      width:128px;\n      height:128px;\n   }\n}\n```\n\n视觉上，这与前面的示例相同，但与前面的示例不同，它是内联隐藏文本。这可以在代码清单\
    \ 5-72 中看到。\n\n***代码清单 5-72***。代码清单 5-71 的输出\n\n```\n/* line 72, image-loaded/*.png\
    \ */\n.image-loaded-sprite, .socials .image-loaded-facebook, .socials .image-loaded-googleplus,\
    \ .socials .image-loaded-linkedin, .socials .image-loaded-twitter {\n  background-image:\
    \ url('../images/image-loaded-sbf38a83327.png');\n  background-repeat: no-repeat;\n\
    }\n\n/* line 156, ../sass/screen.scss */\n.socials {\n  font: 0/0 serif;\n  text-shadow:\
    \ none;\n  color: transparent;\n}\n/* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-facebook {\n  background-position: 0 0;\n}\n/* line\
    \ 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-googleplus {\n  background-position: 0 -128px;\n\
    }\n/* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-linkedin {\n  background-position: 0 -256px;\n}\n\
    /* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
    \ */\n.socials .image-loaded-twitter {\n  background-position: 0 -384px;\n}\n\
    /* line 159, ../sass/screen.scss */\n.socials .icons {\n  width: 128px;\n  height:\
    \ 128px;\n}\n```\n\n***代码清单 5-73***。代码清单 5-71 的 HTML 代码\n\n```\n<h1>Implementation\
    \ of Image sprite</h1>\n<div class=\"socials\">\n<div class=\"image-loaded-facebook\
    \ icons\"></div>\n</div>\n```\n\n当不使用图像精灵时，Compass 提供了一个用于用图像替换文本的混入。这在你想用 Logo\
    \ 替换标题标签的情况下非常有用。\n\n这个混入会根据所用图像的尺寸设置元素的尺寸。这可以在代码清单 5-74 中看到。\n\n***代码清单 5-74***。`replace-text-with-dimensions`\
    \ 的示例\n\n```\n.singleSocial{\n   @include replace-text-with-dimensions(\"../images/facebook.png\"\
    );\n}\n```\n\n***代码清单 5-75***。代码清单 5-74 的输出\n\n```\n/* line 161, ../sass/screen.scss\
    \ */\n.singleSocial {\n  text-indent: -119988px;\n  overflow: hidden;\n  text-align:\
    \ left;\n  text-transform: capitalize;\n  background-image: url('/images/../images/facebook.png?1447046278');\n\
    \  background-repeat: no-repeat;\n  background-position: 50% 50%;\n  width: 128px;\n\
    \  height: 128px;\n}\n```\n\n## 使用 Compass 实现内联图像\n"
- fmt: "Inline images embed images directly into the web pages, as per RFC 2397. Data\
    \ URIs used by inline images are designed to embed data items, as if they were\
    \ being referred to externally. Using inline images saves HTTP requests.\n\nThis\
    \ is demonstrated in [Listing 5-76](#9781484213483_Ch05.xhtml#FPar77).\n\n[***Listing\
    \ 5-76***](#9781484213483_Ch05.xhtml#_FPar77). Example Demonstrating inline-images\n\
    \n```\n.singleSocialInline{\n   background-image: inline-image(\"../images/facebook.png\"\
    );\n}\n```\n\n***Listing 5-77***. Output of [Listing 5-76](#9781484213483_Ch05.xhtml#FPar77)\n\
    \n```\n.singleSocialInline {\nbackground-image: url('data:image/png;base64,');\n\
    }\n```\n\n## CSS Transform\n\nCompass provides a mixin to support CSS3 transforms.\
    \ The Compass 2D transform mixins have the same syntax as the CSS 2D Transform\
    \ functions.\n\nLet’s take a look at the configurable parameters for CSS transforms:\n\
    \n*   `$default-origin-x`: Sets the default x-origin for transforms\n*   `$default-origin-y`:\
    \ Sets the default y-origin for transforms\n*   `$default-origin-z`: Sets the\
    \ default z-origin for transforms\n\nAll three of these have a default value of\
    \ 50%.\n\n*   `$default-scale-x`: Sets the default multiplier for x-axis scaling\n\
    *   `$default-scale-y`: Sets the default multiplier for y-axis scaling\n*   `$default-scale-z`:\
    \ Sets the default multiplier for z-axis scaling\n\nThe default value for these\
    \ three is 1.25.\n\n*   `$default-rotate`: Sets the default angle for rotations\n\
    *   `$default-vector-x`: Sets the default x-vector for the axis of 3D rotation\n\
    *   `$default-vector-y`: Sets the default y-vector for the axis of 3D rotation\n\
    *   `$default-vector-z`: Sets the default z-vector for the axis of 3D rotation\n\
    *   `$default-translate-x`: Sets the default x-length for translations\n*   `$default-translate-y`:\
    \ Sets the default y-length for translations\n*   `$default-translate-z`: Sets\
    \ the default z-length for translations\n*   `$default-skew-x`: Sets the default\
    \ x-angle for skewing\n*   `$default-skew-y`: Sets the default y-angle for skewing\n\
    *   `$default-skew-z`: Sets the default z-angle for skewing\n\nNow we will cover\
    \ some of the mixins provided by Compass to perform these transformations. The\
    \ first transformation we will cover is scale. This is used to scale elements.\
    \ This is demonstrated in [Listing 5-78](#9781484213483_Ch05.xhtml#FPar79).\n\n\
    [***Listing 5-78***](#9781484213483_Ch05.xhtml#_FPar79). Example Demonstrating\
    \ the Scale Mixin\n\n```\n.elementToScale{\n   width:32px;\n   height:32px;\n\
    \   display:block;\n   background:#F00;\n}\n.elementToScale:hover{\n   @include\
    \ scale(2.0);\n}\n```\n\nIn the previous example, you were using the scale transform\
    \ to scale the element two times its original size. The output of this can be\
    \ seen in [Listing 5-79](#9781484213483_Ch05.xhtml#FPar80).\n\n[***Listing 5-79***](#9781484213483_Ch05.xhtml#_FPar80).\
    \ Output of [Listing 5-78](#9781484213483_Ch05.xhtml#FPar79)\n\n```\n/* line 169,\
    \ ../sass/screen.scss */\n.elementToScale {\n  width: 32px;\n  height: 32px;\n\
    \  display: block;\n  background: #F00;\n}\n\n/* line 175, ../sass/screen.scss\
    \ */\n.elementToScale:hover {\n  -moz-transform: scale(2, 2);\n  -ms-transform:\
    \ scale(2, 2);\n  -webkit-transform: scale(2, 2);\n  transform: scale(2, 2);\n\
    }\n```\n\nNow the next transform you will check is translate. Translate is used\
    \ to move element from one position to other. This is demonstrated in [Listing\
    \ 5-80](#9781484213483_Ch05.xhtml#FPar81).\n\n[***Listing 5-80***](#9781484213483_Ch05.xhtml#_FPar81).\
    \ Example Demonstrating Translate Transform\n\n```\n.elementToTranslate{\n   width:32px;\n\
    \   height:32px;\n   display:block;\n   background:#F00;\n}\n.elementToTranslate:hover{\n\
    \   @include translate(30px);\n}\n```\n\nIn the previous example, you translate\
    \ the element by 30px on the positive axis of x, y, and z. The output of this\
    \ is shown in [Listing 5-81](#9781484213483_Ch05.xhtml#FPar82).\n\n[***Listing\
    \ 5-81***](#9781484213483_Ch05.xhtml#_FPar82). Output of [Listing 5-80](#9781484213483_Ch05.xhtml#FPar81)\n\
    \n```\n/* line 179, ../sass/screen.scss */\n.elementToTranslate {\n  width: 32px;\n\
    \  height: 32px;\n  display: block;\n  background: #F00;\n}\n\n/* line 185, ../sass/screen.scss\
    \ */\n.elementToTranslate:hover {\n  -moz-transform: translate(30px, 1em);\n \
    \ -ms-transform: translate(30px, 1em);\n  -webkit-transform: translate(30px, 1em);\n\
    \  transform: translate(30px, 1em);\n}\n```\n\nReferences to more transforms can\
    \ be found at [http://compass-style.org/reference/compass/css3/transform/](http://compass-style.org/reference/compass/css3/transform/).\n\
    \n## Working with Compass Extensions\n\nIn this section, you will use the Sass\
    \ and Compass skills to write a Compass extension, by means of which you can share\
    \ code with the community. You will explore the design decisions that are required\
    \ for building an extension, as well as take a look at the associated best practices.\n\
    \nCompass extensions are ways to share Sass scripts so that others can use them.\
    \ Beyond sharing, they can be used as individual blocks in your framework. Writing\
    \ a Compass extension is better approach over copy pasting Sass code snippets.\n\
    \nIn this example, you’ll take make a function that outputs a custom button style\
    \ and package those in a simple extension called `colorExtension`.\n\nYou will\
    \ first create a directory with the extension name and add a SCSS file with same\
    \ name inside it. This is the most basic and simplest form of extension, also\
    \ known as an *ad hoc* extension.\n\nA user can install ad hoc extensions by simply\
    \ copying the directory into its project’s extensions folder. After copying the\
    \ extension into the proper directory, the extension’s Sass files can be imported\
    \ just like any other Sass file in the project.\n\nFor standalone projects, extensions\
    \ should be placed in an extensions folder at the root of the project folder,\
    \ such as `projectDirectory/extensions/customButton/`. Please note that Compass\
    \ does not create this folder automatically. Users have to manually add these."
  raw: 'Inline images embed images directly into the web pages, as per RFC 2397\.
    Data URIs used by inline images are designed to embed data items, as if they were
    being referred to externally. Using inline images saves HTTP requests.


    This is demonstrated in [Listing 5-76](#9781484213483_Ch05.xhtml#FPar77).


    [***Listing 5-76***](#9781484213483_Ch05.xhtml#_FPar77). Example Demonstrating
    inline-images


    ```

    .singleSocialInline{

       background-image: inline-image("../images/facebook.png");

    }

    ```


    ***Listing 5-77***. Output of [Listing 5-76](#9781484213483_Ch05.xhtml#FPar77)


    ```

    .singleSocialInline {

    background-image: url(''data:image/png;base64,'');

    }

    ```


    CSS Transform


    Compass provides a mixin to support CSS3 transforms. The Compass 2D transform
    mixins have the same syntax as the CSS 2D Transform functions.


    Let’s take a look at the configurable parameters for CSS transforms:


    *   $default-origin-x: Sets the default x-origin for transforms

    *   $default-origin-y: Sets the default y-origin for transforms

    *   $default-origin-z: Sets the default z-origin for transforms


    All three of these have a default value of 50%.


    *   $default-scale-x: Sets the default multiplier for x-axis scaling

    *   $default-scale-y: Sets the default multiplier for y-axis scaling

    *   $default-scale-z: Sets the default multiplier for z-axis scaling


    The default value for these three is 1.25.


    *   $default-rotate: Sets the default angle for rotations

    *   $default-vector-x: Sets the default x-vector for the axis of 3D rotation

    *   $default-vector-y: Sets the default y-vector for the axis of 3D rotation

    *   $default-vector-z: Sets the default z-vector for the axis of 3D rotation

    *   $default-translate-x: Sets the default x-length for translations

    *   $default-translate-y: Sets the default y-length for translations

    *   $default-translate-z: Sets the default z-length for translations

    *   $default-skew-x: Sets the default x-angle for skewing

    *   $default-skew-y: Sets the default y-angle for skewing

    *   $default-skew-z: Sets the default z-angle for skewing


    Now we will cover some of the mixins provided by Compass to perform these transformations.
    The first transformation we will cover is scale. This is used to scale elements.
    This is demonstrated in [Listing 5-78](#9781484213483_Ch05.xhtml#FPar79).


    [***Listing 5-78***](#9781484213483_Ch05.xhtml#_FPar79). Example Demonstrating
    the Scale Mixin


    ```

    .elementToScale{

       width:32px;

       height:32px;

       display:block;

       background:#F00;

    }

    .elementToScale:hover{

       @include scale(2.0);

    }

    ```


    In the previous example, you were using the scale transform to scale the element
    two times its original size. The output of this can be seen in [Listing 5-79](#9781484213483_Ch05.xhtml#FPar80).


    [***Listing 5-79***](#9781484213483_Ch05.xhtml#_FPar80). Output of [Listing 5-78  ](#9781484213483_Ch05.xhtml#FPar79)


    ```

    /* line 169, ../sass/screen.scss */

    .elementToScale {

      width: 32px;

      height: 32px;

      display: block;

      background: #F00;

    }


    /* line 175, ../sass/screen.scss */

    .elementToScale:hover {

      -moz-transform: scale(2, 2);

      -ms-transform: scale(2, 2);

      -webkit-transform: scale(2, 2);

      transform: scale(2, 2);

    }

    ```


    Now the next transform you will check is translate. Translate is used to move
    element from one position to other. This is demonstrated in [Listing 5-80](#9781484213483_Ch05.xhtml#FPar81).


    [***Listing 5-80***](#9781484213483_Ch05.xhtml#_FPar81). Example Demonstrating
    Translate Transform


    ```

    .elementToTranslate{

       width:32px;

       height:32px;

       display:block;

       background:#F00;

    }

    .elementToTranslate:hover{

       @include translate(30px);

    }

    ```


    In the previous example, you translate the element by 30px on the positive axis
    of x, y, and z. The output of this is shown in [Listing 5-81](#9781484213483_Ch05.xhtml#FPar82).


    [***Listing 5-81***](#9781484213483_Ch05.xhtml#_FPar82). Output of [Listing 5-80](#9781484213483_Ch05.xhtml#FPar81)


    ```

    /* line 179, ../sass/screen.scss */

    .elementToTranslate {

      width: 32px;

      height: 32px;

      display: block;

      background: #F00;

    }


    /* line 185, ../sass/screen.scss */

    .elementToTranslate:hover {

      -moz-transform: translate(30px, 1em);

      -ms-transform: translate(30px, 1em);

      -webkit-transform: translate(30px, 1em);

      transform: translate(30px, 1em);

    }

    ```


    References to more transforms can be found at [http://compass-style.org/reference/compass/css3/transform/](http://compass-style.org/reference/compass/css3/transform/).


    Working with Compass Extensions


    In this section, you will use the Sass and Compass skills to write a Compass extension,
    by means of which you can share code with the community. You will explore the
    design decisions that are required for building an extension, as well as take
    a look at the associated best practices.


    Compass extensions are ways to share Sass scripts so that others can use them.
    Beyond sharing, they can be used as individual blocks in your framework. Writing
    a Compass extension is better approach over copy pasting Sass code snippets.


    In this example, you’ll take make a function that outputs a custom button style
    and package those in a simple extension called colorExtension.


    You will first create a directory with the extension name and add a SCSS file
    with same name inside it. This is the most basic and simplest form of extension,
    also known as an *ad hoc* extension.


    A user can install ad hoc extensions by simply copying the directory into its
    project’s extensions folder. After copying the extension into the proper directory,
    the extension’s Sass files can be imported just like any other Sass file in the
    project.


    For standalone projects, extensions should be placed in an extensions folder at
    the root of the project folder, such as projectDirectory/extensions/customButton/.
    Please note that Compass does not create this folder automatically. Users have
    to manually add these.'
  trans: "\n内联图像可直接将图像嵌入网页，遵循 RFC 2397 规范。内联图像使用的数据 URI 旨在嵌入数据项，就像它们是从外部引用一样。使用内联图像可以节省\
    \ HTTP 请求。\n\n列表 5-76 对此进行了演示。\n\n***列表 5-76***. 内联图像演示示例\n\n```\n.singleSocialInline{\n\
    \   background-image: inline-image(\"../images/facebook.png\");\n}\n```\n\n***列表\
    \ 5-77***. 列表 5-76  的输出结果\n\n```\n.singleSocialInline {\nbackground-image: url('data:image/png;base64,');\n\
    }\n```\n\n## CSS 变换\n\nCompass 提供了一个混合宏来支持 CSS3 变换。Compass 2D 变换混合宏的语法与 CSS 2D\
    \ 变换函数相同。\n\n我们来了解一下 CSS 变换的可配置参数：\n\n*   `$default-origin-x`：设置变换的默认 x 轴原点\n\
    *   `$default-origin-y`：设置变换的默认 y 轴原点\n*   `$default-origin-z`：设置变换的默认 z 轴原点\n\
    \n这三个参数的默认值均为 50%。\n\n*   `$default-scale-x`：设置 x 轴缩放的默认倍数\n*   `$default-scale-y`：设置\
    \ y 轴缩放的默认倍数\n*   `$default-scale-z`：设置 z 轴缩放的默认倍数\n\n这三个参数的默认值为 1.25。\n\n*  \
    \ `$default-rotate`：设置旋转的默认角度\n*   `$default-vector-x`：设置 3D 旋转轴的默认 x 向量\n*  \
    \ `$default-vector-y`：设置 3D 旋转轴的默认 y 向量\n*   `$default-vector-z`：设置 3D 旋转轴的默认\
    \ z 向量\n*   `$default-translate-x`：设置平移的默认 x 轴距离\n*   `$default-translate-y`：设置平移的默认\
    \ y 轴距离\n*   `$default-translate-z`：设置平移的默认 z 轴距离\n*   `$default-skew-x`：设置倾斜的默认\
    \ x 轴角度\n*   `$default-skew-y`：设置倾斜的默认 y 轴角度\n*   `$default-skew-z`：设置倾斜的默认 z\
    \ 轴角度\n\n现在，我们将介绍 Compass 提供的一些用于执行这些变换的混合宏。我们要介绍的第一个变换是缩放。它用于缩放元素。列表 5-78 对此进行了演示。\n\
    \n***列表 5-78***. 缩放混合宏演示示例\n\n```\n.elementToScale{\n   width:32px;\n   height:32px;\n\
    \   display:block;\n   background:#F00;\n}\n.elementToScale:hover{\n   @include\
    \ scale(2.0);\n}\n```\n\n在上一个示例中，您使用了缩放变换将元素缩放为其原始大小的两倍。此操作的输出结果见列表 5-79。\n\n\
    ***列表 5-79***. 列表 5-78  的输出结果\n\n```\n/* line 169, ../sass/screen.scss */\n.elementToScale\
    \ {\n  width: 32px;\n  height: 32px;\n  display: block;\n  background: #F00;\n\
    }\n\n/* line 175, ../sass/screen.scss */\n.elementToScale:hover {\n  -moz-transform:\
    \ scale(2, 2);\n  -ms-transform: scale(2, 2);\n  -webkit-transform: scale(2, 2);\n\
    \  transform: scale(2, 2);\n}\n```\n\n接下来您要了解的变换是平移。平移用于将元素从一个位置移动到另一个位置。列表 5-80\
    \ 对此进行了演示。\n\n***列表 5-80***. 平移变换演示示例\n\n```\n.elementToTranslate{\n   width:32px;\n\
    \   height:32px;\n   display:block;\n   background:#F00;\n}\n.elementToTranslate:hover{\n\
    \   @include translate(30px);\n}\n```\n\n在上一个示例中，您将元素沿 x、y 和 z 轴正方向平移了 30 像素。此操作的输出结果如列表\
    \ 5-81 所示。\n\n***列表 5-81***. 列表 5-80  的输出结果\n\n```\n/* line 179, ../sass/screen.scss\
    \ */\n.elementToTranslate {\n  width: 32px;\n  height: 32px;\n  display: block;\n\
    \  background: #F00;\n}\n\n/* line 185, ../sass/screen.scss */\n.elementToTranslate:hover\
    \ {\n  -moz-transform: translate(30px, 1em);\n  -ms-transform: translate(30px,\
    \ 1em);\n  -webkit-transform: translate(30px, 1em);\n  transform: translate(30px,\
    \ 1em);\n}\n```\n\n更多变换的参考资料可访问 [`compass-style.org/reference/compass/css3/transform/`](http://compass-style.org/reference/compass/css3/transform/)。\n\
    \n## 使用 Compass 扩展\n\n在本节中，您将运用 Sass 和 Compass 技能编写一个 Compass 扩展，通过这种方式您能与社区共享代码。您将探讨构建扩展所需的设计决策，并了解相关的最佳实践。\n\
    \nCompass 扩展是共享 Sass 脚本以便他人使用的方式。除了共享之外，它们还可以作为框架中的独立模块使用。编写 Compass 扩展比复制粘贴 Sass\
    \ 代码片段是更好的方法。\n\n在此示例中，您将创建一个输出自定义按钮样式的函数，并将其打包成一个名为 `colorExtension` 的简单扩展。\n\
    \n您首先需要创建一个以扩展名命名的目录，并在其中添加一个同名的 SCSS 文件。这是最基本、最简单的扩展形式，也称为*临时*扩展。\n\n用户只需将目录复制到项目下的扩展文件夹中，即可安装临时扩展。将扩展复制到正确的目录后，该扩展的\
    \ Sass 文件就可以像项目中其他 Sass 文件一样被导入。\n\n对于独立项目，扩展应放置在项目文件夹根目录下的扩展文件夹中，例如 `projectDirectory/extensions/customButton/`。请注意，Compass\
    \ 不会自动创建此文件夹。用户需要手动添加。\n"
- fmt: "Next you will add the required code to the extension file. This is shown in\
    \ [Listing 5-82](#9781484213483_Ch05.xhtml#FPar83). Please note the name of file\
    \ and extension mixin are the same for convenience. They may defer in real life\
    \ scenarios.\n\n![9781484213483_Fig05-22.jpg](OEBPS/Images/9781484213483_Fig05-22.jpg)\n\
    \nFigure 5-22. Directory structure with an extension\n\n[***Listing 5-82***](#9781484213483_Ch05.xhtml#_FPar83).\
    \ Adding Code to the Extension File `customButton.scss`\n\n```\n@mixin customButton()\
    \ {\n   cursor: pointer;\n   padding: 10px 15px;\n   background-color: #eee;\n\
    \   border: #bbb 1px solid;\n   color: #555;\n   @include border-radius(25%);\n\
    \   @include transition-property(all);\n   &:hover {\n      background-color:#bbb;\n\
    \   }\n}\n```\n\nNext, you need to import this in the `screen.scss` file so that\
    \ you can use it. This is demonstrated in [Listing 5-83](#9781484213483_Ch05.xhtml#FPar84).\n\
    \n[***Listing 5-83***](#9781484213483_Ch05.xhtml#_FPar84). Importing the Extension\
    \ in Your `screen.scss`\n\n```\n// Code for custom extension\n@import \"customButton\"\
    ;\n.primaryAction{\n   @include customButton;\n}\n```\n\nIn addition to importing\
    \ the extension into the `SCSS` file, you have to include the mixin from the extension\
    \ in the class `.primaryAction`.\n\nThe output of this code is shown in [Listing\
    \ 5-84](#9781484213483_Ch05.xhtml#FPar85).\n\n[***Listing 5-84***](#9781484213483_Ch05.xhtml#_FPar85).\
    \ Output of [Listing 5-83](#9781484213483_Ch05.xhtml#FPar84)\n\n```\n/* line 191,\
    \ ../sass/screen.scss */\n.primaryAction {\n  cursor: pointer;\n  padding: 10px\
    \ 15px;\n  background-color: #eee;\n  border: #bbb 1px solid;\n  color: #555;\n\
    \  -moz-border-radius: 25%;\n  -webkit-border-radius: 25%;\n  border-radius: 25%;\n\
    \  -moz-transition-property: all;\n  -o-transition-property: all;\n  -webkit-transition-property:\
    \ all;\n  transition-property: all;\n}\n/* line 9, ../extensions/customButton/stylesheets/customButton.scss\
    \ */\n.primaryAction:hover {\nbackground-color: #bbb;\n}\n```\n\nYou can apply\
    \ all the concepts of mixins you learned about earlier to the mixin in the extension.\n\
    \n## Summary\n\nIn this chapter, you learned about the Compass framework, a framework\
    \ based on Sass. You saw the various features it provides regarding grids, colors,\
