    \n图 5-15： 代码清单 5-45 的输出结果\n\n## 文本阴影\n\n接下来要介绍的 Compass 插件是文本阴影。Compass 让文本阴影插件的实现变得非常简单，如代码清单\
    \ 5-46 所示。\n\n***代码清单 5-46***。 使用 Compass 实现文本阴影\n\n```scss\n// 文本阴影代码\n.singleShadow{\n\
    \   @include single-text-shadow;\n}\n```\n\n这段代码会将文本阴影应用于 class 为`singleShadow`的元素。该代码的输出结果如代码清单\
    \ 5-47 所示。\n\n***代码清单 5-47***。 代码清单 5-46 的输出结果\n\n```css\n/* line 63, ../sass/screen.scss\
    \ */\n.singleShadow {\n  text-shadow: 0px 0px 1px #aaaaaa;\n}\n```\n\n可以使用 Compass\
    \ 提供的三个变量来自定义这个单一文本阴影，具体如下：\n\n*   `$default-text-shadow-color`：阴影的默认颜色\n*   `$default-text-shadow-blur`：模糊的默认值\n\
    *   `$default-text-shadow-v-offset`：阴影偏移的默认值\n\n***代码清单 5-48***。 演示在混入守卫中使用比较运算符的示例\n\
    \n```scss\n$default-text-shadow-color: rgba(255,250,0, 0.6);\n$default-text-shadow-blur:\
    \ 5px;\n$default-text-shadow-v-offset: 3px;\n.singleShadow{\n   @include single-text-shadow;\n\
    }\n```\n\n***代码清单 5-49***。 代码清单 5-48 的输出结果\n\n```css\n.singleShadow {\n   text-shadow:\
    \ 0px 3px 5px rgba(255, 250, 0, 0.6);\n}\n```\n\n***代码清单 5-50***。 代码清单 5-49 对应的\
    \ HTML\n\n```html\n<h1>Text shadow</h1>\n<span class=\"singleShadow\">This is\
    \ a text with single shadow</span>\n```\n\n![9781484213483_Fig05-16.jpg](img/9781484213483_Fig05-16.jpg)\n\
    \n图 5-16。 代码清单的输出结果\n\n你也可以为文本应用多重阴影，如代码清单 5-51 所示。\n\n***代码清单 5-51***。 为文本应用多重阴影\n\
    \n```scss\n.customMultipleshadows {\n   @include text-shadow(rgba(0,0,0, 0.2)\
    \ 1px 1px 0, rgba(10,10,10, 0.2) 2px 2px 0, rgba(11,11,11, 0.2) 3px 3px 0);\n\
    }\n```\n\n***代码清单 5-52***。 代码清单 5-51 的输出结果\n\n```css\n/* line 69, ../sass/screen.scss\
    \ */\n.customMultipleshadows {\n  text-shadow: rgba(0, 0, 0, 0.2) 1px 1px 0, rgba(10,\
    \ 10, 10, 0.2) 2px 2px 0, rgba(11, 11, 11, 0.2) 3px 3px 0;\n}\n```\n\n***代码清单\
    \ 5-53***。 代码清单 5-52 对应的 HTML\n\n```html\n<h1>Text shadow</h1>\n<span class=\"\
    singleShadow\">This is a text with single shadow</span>\n<span class=\"customMultipleshadows\"\
    >This is a text with custom Multiple shadows</span>\n```\n\n![9781484213483_Fig05-17.jpg](img/9781484213483_Fig05-17.jpg)\n\
    \n图 5-17。 单一文本阴影与多重文本阴影\n\n## 盒阴影\n\nCompass 支持的另一个很酷的 CSS3 特性是盒阴影。盒阴影与文本阴影类似，但它是应用于容器而非文本。这在代码清单\
    \ 5-54 中进行了演示。\n\n***代码清单 5-54***。 使用 Compass 演示盒阴影的示例\n\n```scss\n// 盒阴影代码\n\
    .shadow{\n   width:32px;\n   height:32px;\n   display:inline-block;\n   margin-right:10px;\n\
    \   background:#CCC;\n}\n.defaultBoxShadow {\n   @include single-box-shadow;\n\
    }\n\n.customBoxShadow {\n   @include box-shadow(#222 4px 3px 5px);\n}\n\n.multipleCustomBoxShadow\
    \ {\n   @include box-shadow(rgba(255,0,0 , 0.5) 0 0 25px, rgba(0,0,0, 0.7) 0 0\
    \ 6px 2px inset);\n}\n```\n\n***代码清单 5-55***。 代码清单 5-54 的输出结果\n\n```css\n/* line\
    \ 74, ../sass/screen.scss */\n.shadow {\n  width: 32px;\n  height: 32px;\n  display:\
    \ inline-block;\n  margin-right: 10px;\n  background: #CCC;\n}\n\n/* line 81,\
    \ ../sass/screen.scss */\n.defaultBoxShadow {\n  -moz-box-shadow: 0px 5px #333333;\n\
    \  -webkit-box-shadow: 0px 5px #333333;\n  box-shadow: 0px 5px #333333;\n}\n\n\
    /* line 85, ../sass/screen.scss */\n.customBoxShadow {\n  -moz-box-shadow: #222\
    \ 4px 3px 5px;\n  -webkit-box-shadow: #222 4px 3px 5px;\n  box-shadow: #222 4px\
    \ 3px 5px;\n}\n\n/* line 89, ../sass/screen.scss */\n.multipleCustomBoxShadow\
    \ {\n  -moz-box-shadow: rgba(255, 0, 0, 0.5) 0 0 25px, rgba(0, 0, 0, 0.7) 0 0\
    \ 6px 2px inset;\n  -webkit-box-shadow: rgba(255, 0, 0, 0.5) 0 0 25px, rgba(0,\
    \ 0, 0, 0.7) 0 0 6px 2px inset;\n  box-shadow: rgba(255, 0, 0, 0.5) 0 0 25px,\
    \ rgba(0, 0, 0, 0.7) 0 0 6px 2px inset;\n}\n```\n\n***代码清单 5-56***。 代码清单 5-54\
    \ 对应的 HTML\n\n```html\n<h1>Box shadow</h1>\n<div class='defaultBoxShadow shadow'></div>\n\
    <div class='customBoxShadow shadow'></div>\n<div class='multipleCustomBoxShadow\
    \ shadow'></div>\n```\n\n这个混入有以下可配置的参数：\n\n*   `$default-box-shadow-color`：提供默认的阴影颜色\n\
    *   `$default-box-shadow-h-offset`：提供默认的水平偏移值\n*   `$default-box-shadow-v-offset`：提供默认的垂直偏移值\n\
    *   `$default-box-shadow-blur`：提供默认的模糊量\n*   `$default-box-shadow-spread`：提供默认的扩展量\n\
    *   `$default-box-shadow-inset`：提供默认的阴影内嵌量\n\n![9781484213483_Fig05-18.jpg](img/9781484213483_Fig05-18.jpg)\n\
    \n图 5-18。 代码清单 5-46 的输出结果\n\n## 过渡\n\nCompass 还提供了混入，可轻松实现各种 CSS3 过渡效果。这在代码清单\
    \ 5-57 中进行了演示。\n\n***代码清单 5-57***。 使用 Compass 混入实现 CSS3 过渡的示例\n\n```scss\n.transition\
    \ {\n   width: 32px;\n   height: 32px;\n   display: block;\n   margin-bottom:\
    \ 10px;\n}\n// 通过设置将发生过渡的属性来启动过渡\n.default{\n   background:#F00;\n   @include\
    \ transition-property(all);\n}\n.default:hover{\n   background:#BBB;\n}\n.withDuration{\n\
    \   background:#F00;\n   @include transition-property(all);\n   @include transition-duration(3s);\n\
    }\n.withDuration:hover{\n   background:#BBB;\n}\n.widthDurationEaseIn{\n   background:#F00;\n\
    \   @include transition-property(all);\n   @include transition-duration(3s);\n\
    \   @include transition-timing-function(ease-out);\n}\n.widthDurationEaseIn:hover{\n\
    \   background:#BBB;\n}\n.widthDelay{\n   background:#F00;\n   @include transition-property(all);\n\
    \   @include transition-duration(3s);\n   @include transition-timing-function(ease-out);\n\
    \   @include transition-delay(3s);\n}\n.widthDelay:hover{\n   background:#BBB;\n\
    }\n```\n"
