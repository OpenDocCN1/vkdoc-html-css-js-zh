    compact


    Compact output consumes less space than the previous two styles. It puts all the
    properties on one single line, with one rule per line, as shown in [Listing 3-58](#9781484213483_Ch03.xhtml#FPar58).


    [***Listing 3-58***](#9781484213483_Ch03.xhtml#_FPar58). Example of Compact Styles


