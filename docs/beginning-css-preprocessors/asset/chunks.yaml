    Summary


    This chapter explained the advanced topics of Sass, such as including other Sass
    files using import and using directives, using @media, extending using @extend,
    using mixins, and some of the commonly used functions provided by Sass and defining
    a functions using @function.


    In addition to these topics, you also learned how to build your own grid system.


    In next chapter, you will look into another framework like Sass, which provides
    similar features and is equally well known.


    CHAPTER 4


    ![image](OEBPS/Images/frontdot.jpg)


    Development with Less


    In the previous chapter, you looked into various things you can do with Sass,
    including various techniques like mixins. In this chapter, you will look into
    another preprocessor framework that’s equally famous, named *Less*.


    This chapter explores the following aspects of Less:


    *   Client and server-side variation of less

    *   Language features

    *   Nested rules

    *   Import directives

    *   Mixin guards

    *   Referencing the parent selector

    *   Using & with guards

    *   Detached rules

    *   Merging properties

    *   Looping mixins

    *   Functions


    Introduction to Less


    Less is a preprocessor language that gets compiled into CSS. It was created by
    Alexis Sellier. Less is along the lines of “SCSS” syntax of Sass, which in turn
    is like CSS syntax. Less is open source. Less was first written in Ruby; however,
    in the later versions, it was rewritten in JavaScript. Note that valid CSS is
    valid Less code. Less provides the following features similar to Sass that you
    saw in previous chapter like variables, nesting, operators, mixins, and functions;
    however what makes Less different from other CSS precompilers is its ability to
    compile in real-time via less.js in the browser.


    There are two variants of Less, unlike Sass. Less has a client-side variant, which
    compiles Less code in browsers and a server-side variant that compiles the file
    server side and then provides it to the browser. Developer can use the client-side
    variant for developing and testing code. The server-side variant can be used to
    compile the code, minify it, and then make it production-ready.


    A point to keep in mind is that the client-side variant does not generate output.
    It compiles the code on each browser reload.


    Client-Side Variation of Less


    To use the client-side variant of Less, you need to download the client-side compiler
    named less.js, which is available at [http://lesscss.org/#download-options](http://lesscss.org/#download-options).
    Once it’s downloaded, copy it into your working directory. Now let’s try some
    Less code with this Less compiler.


    [***Listing 4-1***](#9781484213483_Ch04.xhtml#_FPar1). An HTML Markup for the
    Example


    ```

    <html>

            <head>

                    <title>Listing 4-1</title>

                    <link type="text/css" rel="stylesheet/less" href="styles1.1.less"
    />

                    <script src="//cdnjs.cloudflare.com/ajax/libs/less.js/2.2.0/less.min.js"></script>

            </head>

            <body>

                    <p class="impElement">This is my first Less code</p>

            </body>

    </html>

    ```


    [***Listing 4-2***](#9781484213483_Ch04.xhtml#_FPar2). Less Code in styles1.1.less


    ```

    .impElement{

            background:#666;

            padding:10px;

            border-radius:10px;

    }

    ```


    When you run this page, the output will look as shown in [Figure 4-1](#9781484213483_Ch04.xhtml#Fig1).


    ![9781484213483_Fig04-01.jpg](OEBPS/Images/9781484213483_Fig04-01.jpg)


    [Figure 4-1](#9781484213483_Ch04.xhtml#_Fig1). Output of [Listings 4-1](#9781484213483_Ch04.xhtml#FPar1)
    and [4-2](#9781484213483_Ch04.xhtml#FPar2)


    ![Image](OEBPS/Images/sq.jpg) **Note**  In the example provided in [Listing 4-1](#9781484213483_Ch04.xhtml#FPar1),
    we have linked less.js through a content delivery network (CDN). To run this code,
    you need a web server, otherwise less.js will not load. In case you want to run
    this example without running a web server, download and link less.js locally.


    Server-Side Variant


    The client-side variant is good for development and debugging. However, when you’re
    deploying to production, it is advisable to use the server-side variant—i.e.,
    compile the Less code into a browser friendly CSS. To do so, you need to install
    the lessc compiler. This can be installed using node package manager.


    If you don’t have node installed, you need to install it first. The procedure
    for installing Node.js has been well explained here: [http://howtonode.org/how-to-install-nodejs](http://howtonode.org/how-to-install-nodejs).


    Once you’re done installing Node.js, you are ready to start installing the lessc
    compiler. Run the command in [Listing 4-3](#9781484213483_Ch04.xhtml#FPar4) in
    the terminal.


    [***Listing 4-3***](#9781484213483_Ch04.xhtml#_FPar4). Command for Installing
    the lessc Compiler


    ```

    npm install -g less

    ```


    You can test if lessc is installed by running the command shown in [Listing 4-4](#9781484213483_Ch04.xhtml#FPar5).


    [***Listing 4-4***](#9781484213483_Ch04.xhtml#_FPar5). Command to Check if the
    lessc Command Is Available


    ```

    lessc -v

    ```


    This command will output the version of lessc installed. Now that the lessc compiler
    has been installed, let’s take a look at the procedure for compiling the Less
    files.


    Compiling a Less File


    You can compile a Less file using the command shown in [Listing 4-5](#9781484213483_Ch04.xhtml#FPar6).


    [***Listing 4-5***](#9781484213483_Ch04.xhtml#_FPar6). Command for Invoking the
    lessc Compiler


    ```

    lessc style.less

    ```


    This command will provide you with output within the terminal itself. If you wish
    to save the output in a .css file, you need to modify the command by adding a
    second parameter separated by a space, as shown in [Listing 4-6](#9781484213483_Ch04.xhtml#FPar7).


    [***Listing 4-6***](#9781484213483_Ch04.xhtml#_FPar7). Command for Invoking the
    lessc Compiler and Saving Output in Another File


    ```

    lessc style.less style.css

    ```


    The lessc compiler can be invoked with various options. [Listings 4-7](#9781484213483_Ch04.xhtml#FPar8)
    through [4-9](#9781484213483_Ch04.xhtml#FPar10) show some supported options.


    [***Listing 4-7***](#9781484213483_Ch04.xhtml#_FPar8). The -h Option for Help
    on the lessc Compiler


    ```

    lessc -h

    ```


    ***Listing 4-8***. The --include for Including Paths Where Less Will Find Imports


    ```

    lessc -include-path=framework/;lib/

    ```


    Available paths for import can be specified in a list separated by : or ;.


    [***Listing 4-9***](#9781484213483_Ch04.xhtml#_FPar10). Linting Less Code with
    the lessc Compiler by Using -l


    ```

    lessc -l style.less

    ```


    In addition to these, there are many other options available to apply while invoking
    lessc compilers. They can be found in the Less documentation here: [http://lesscss.org/usage/index.html#command-line-usage-command-line-usage](http://lesscss.org/usage/index.html#command-line-usage-command-line-usage).


    In the next section, you will look at features that this language provides.


    Language Features


    This section covers all the features provided by Less. Many of the features are
    similar to what you learned in previous chapters; hence, they should be easy to
    understand.


