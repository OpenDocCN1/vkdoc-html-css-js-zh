    # 函数指令


    Sass 中的函数对提供的参数执行指定的操作。这些函数的语法类似于 CSS 函数，如 `rgb()`。与 CSS 函数不同，Sass 函数可以包含关键字参数，并返回对
    Sass 操作有用的值。


    Sass 提供了内置函数，这些函数旨在广泛应用于各种不同场景，例如颜色操作等。除此之外，Sass 还允许用户定义自己的函数，类似于定义 mixins。


    Sass 提供的一些内置函数分类如下：


    *   数值函数

    *   颜色函数

    *   列表函数


    ## 数值函数


    Sass 提供了一些用于处理数值的函数，特别是在使用 Sass 编写样式表时经常遇到的情况。


    以下讨论其中一些函数。


    ### `abs($number)`


    此函数将返回数字的绝对值，如 清单 3-45 所示。


    **清单 3-45**. 使用 `abs` 的示例


    ```

    $fontsize:1.1em;

    .container{

      // Will use 1.1em

      font-size:abs($fontsize);

    }

    ```


    ### `ceil($number)`


    此函数将返回数字的向上取整值，如 清单 3-46 所示。


    **清单 3-46**. 使用 `ceil` 的示例


    ```

    $fontsize:1.1em;

    .container{

      // Will use 2em

      font-size:ceil($fontsize);

    }

    ```


    ### `floor($number)`


    此函数将返回数字的向下取整值，如 清单 3-47 所示。


    **清单 3-47**. 使用 `floor` 的示例


    ```

    $fontsize:1.1em;

    .container{

      // Will use 1em

      font-size:floor($fontsize);

    }

    ```


    ### `percentage($number)`


    此函数将提供的数字转换为百分比并返回。作为参数提供的数字应该是无单位的，即它不应具有作为后缀的单位。参见 清单 3-48。


    **清单 3-48**. 使用 `percentage` 的示例


    ```

    $fontsize:1.1;

    .container{

      // Will use 110%

      font-size:percentage($fontsize);

    }

    ```


    ### `round($number)`


    此函数将返回所提供数字的最接近的整数值，如 清单 3-49 所示。


    **清单 3-49**. 使用 `round` 的示例


    ```

    $fontsize:1.1em;

    .container{

      // Will use 1em

      font-size:round($fontsize);

    }

    ```


    ## 颜色函数


    Sass 提供了多种用于转换颜色的函数，例如 `adjust_color`、`complement`、`grayscale`、`invert` 等。


    以下描述其中一些函数。


    ### `adjust_color($color,…)`


    此函数用于分配颜色的个别属性，例如红色、绿色、蓝色等。属性被指定为关键字参数，值将从原始值中加或减（参见 清单 3-50）。可以使用此函数转换颜色的以下属性：


    *   红色

    *   绿色

    *   蓝色

    *   色相

    *   明度

    *   透明度


    **清单 3-50**. 展示 `adjust_color` 的示例


    ```

    $fontcolor:#900;

    .container{

      color:adjust_color($fontcolor,$red:-5);

    }

    ```


    ### `complement($color)`


    此函数返回颜色的补色，如 清单 3-51 所示。


    **清单 3-51**. 展示 `complement` 的示例


    ```

    $fontcolor:#FF0000;

    .container{

      color:complement($fontcolor);

    }

    ```


    上一个代码片段的输出如 清单 3-52 所示。


    **清单 3-52**. 清单 3-53 的输出


    ```

    .container {

      color: cyan;

    }

    ```


    ### `grayscale($color)`


    此函数返回颜色的灰度版本。这在 清单 3-53 中演示。


    **清单 3-53**. `grayscale` 的示例


    ```

    $fontcolor:#FFCC00;

    .container{

      color:grayscale($fontcolor);

    }

    ```


    ## 列表函数


    列表函数中最重要的函数之一是 `nth($list, $n)`。它用于从列表中获取单个项目。与 JavaScript 不同，Sass 列表从 1 开始计数。


    因此，`nth(10px 20px 30px, 1)` 将返回 `10px` 作为结果。


    另一个重要的函数是 `join`。`join($list1, $list2, [$separator])` 用于通过合并两个列表生成一个新列表。列表中的每个值都计为一个单独项目，该函数也可用于从单个项目生成列表。可选的
    `$separator` 参数决定列表的类型；可以是空格或逗号。如果省略，则使用 `$list1` 的类型。


    另一个简单但重要的函数是 `length($list)`。它返回 `$list` 中的项目数量。所以 `length(10 22 33)` 的结果是 `3`。


    # 用户定义函数


    `@function` 指令用于定义你自己的函数。当你要执行原生不支持的操作时，这很有用。`@function` 类似于 `@mixin`，不同之处在于 `@function`
    会返回结果。


    `@return` 指令是 `@function` 的重要组成部分，其行为类似于 JavaScript 中的 `return`。它接受 Sass 表达式，处理它们，并返回结果。此外，在触发
    `@return` 后，它会停止函数执行。


    考虑一个构建函数的简单示例。此示例编写一个函数，根据提供的列数生成每列的宽度，如 清单 3-54 所示。


    **清单 3-54**. 用户定义函数的示例

