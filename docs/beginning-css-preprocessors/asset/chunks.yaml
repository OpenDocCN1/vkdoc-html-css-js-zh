    \  width: 16px;\n  height: 16px;\n}\n\n.pinterest {\n  background-image: url(/images/icons/pinterest.png);\n\
    \  width: 16px;\n  height: 16px;\n}\n```\n\nIt is possible to have multiple variables\
    \ and list them in `@each`, as shown in [Listing 2-55](#9781484213483_Ch02.xhtml#FPar55).\
    \ In this example, you are using two variables as one element in a loop. A pair\
