    ![9781484213483_Fig05-14.jpg](OEBPS/Images/9781484213483_Fig05-14.jpg)


    Figure 5-14\. Output of border-radius code from previous listings


    You can see more examples of these on [http://compass-style.org/examples/compass/css3/border_radius/](http://compass-style.org/examples/compass/css3/border_radius/)
    .


    Opacity


    Compass also provides a mixin for opacity by which you can play with transparency
    of the element. This is demonstrated in [Listing 5-43](#9781484213483_Ch05.xhtml#FPar44).


    [***Listing 5-43***](#9781484213483_Ch05.xhtml#_FPar44). Opacity Mixin Provided
    by Compass


    ```

    <h1>Opacity</h1>

    <div class="opacity light0"></div>

    <div class="opacity light1"></div>

    <div class="opacity light2"></div>

    <div class="opacity light3"></div>

    <div class="opacity light4"></div>

    ```


    ***Listing 5-44***. Opacity Mixin Provided by Compass


    ```

    // Code for opacity mixin

    .opacity{

       width:32px;

       height:32px;

       display:inline-block;

       background:#000;

    }

    .light0{

       @include opacity(0);

    }

    .light1{

       @include opacity(0.1);

    }

    .light2{

       @include opacity(0.2);

    }

    .light3{

       @include opacity(0.3);

    }

    .light4{

       @include opacity(0.4);

    }

    ```


    In this example, you can set the transition of the opacity from transparent to
    partially opaque by setting different values of opacity. The output of this code
    is shown in the [Listing 5-45](#9781484213483_Ch05.xhtml#FPar46).


