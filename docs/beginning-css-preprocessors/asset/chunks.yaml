    \ solid #666);\n}\n```\n\n正如你在前面的示例中所见，当你传递一个属性列表进行赋值时，`@rest` 就派上了用场。\n\n###\
    \ 返回值\n\nMixin 不像在其他编程语言中那样返回值。然而，你可以利用它们的作用域来模拟这种行为。如果一个变量在调用者的作用域中未定义，它将被复制到调用者的作用域中。这在清单\
    \ 4-39 中进行了演示。\n\n**清单 4-39**：演示返回值的示例\n\n```\n.setPaddingMarginMixin() {\n  \
    \  @padding: 15px;\n    @margin: 30px;\n}\n.modifiedPMMixin() {\n    @margin:\
    \ 25px;\n    padding: @padding;\n    margin: @margin;\n    .setPaddingMarginMixin();\n\
    }\n.container {\n    .modifiedPMMixin();\n}\n```\n\n在这段代码中，`@padding` 的值被返回，然后被添加到了\
    \ `modifiedPMMixin` 的作用域中。这段代码的输出如清单 4-40 所示。\n\n**清单 4-40**：清单 4-39 的输出\n\n```\n\
    .container {\n  padding: 15px;\n  margin: 25px;\n}\n```\n\n### 嵌套规则\n\nCSS 不会体现元素之间的这种关系。使用\
    \ Less，你的代码能够反映元素之间的关系，并且可以像清单 4-41 那样编写。\n\n**清单 4-41**：使用 Less 反映元素之间关系的示例\n\
    \n```\n#sidebar {\n    .heading {\n        font-weight: bold;\n        color:\
    \ #BBB;\n    }\n    ul {\n        list-style: none;\n        li {\n          \
    \  a {\n                color: #006;\n            }\n        }\n    }\n}\n```\n\
    \n**清单 4-42**：清单 4-41 的输出\n\n```\n#sidebar .heading {\n  font-weight: bold;\n\
    \  color: #BBB;\n}\n#sidebar ul {\n  list-style: none;\n}\n#sidebar ul li a {\n\
    \  color: #006;\n}\n```\n\nLess 提供的这种模式在以下方面是有益的：\n\n*   它减少了代码冗余。你无需为多个子元素重复编写相同的选择器。\n\
    *   它使代码可读且易于维护。\n\n尽管嵌套是一个有用的特性，但应谨慎使用。嵌套会导致 DOM 和 CSS 代码之间的紧密绑定，因此由于特异性问题，会限制覆盖规则的可能性。\n\
    \n### 导入指令\n\nLess 提供了一个导入指令，用于从其他位置导入样式。与 CSS 不同，CSS 要求导入语句必须位于文件开头，而 Less 允许将\
    \ `@import` 语句放置在代码中的任何位置。\n"
- fmt: "`@import`语句的行为可能取决于导入文件的扩展名。\n\n- 如果导入的文件以`.css`结尾，它将被视为普通的CSS导入，语句保持不变。\n\
    - 对于任何其他扩展名，它将被视为Less文件并导入。如果缺少`.less`扩展名，则会自动追加，并导入文件内容。\n\n***列表 4-43***：展示各种导入方法的示例\n\
    \n```\n@import \"filetoimport\";\n@import \"filetoimport.less\";\n@import \"filetoimport.php\"\
    ;\n@import \"filetoimport.css\";\n```\n\n在此示例中，前三种方法将文件视为Less文件并导入其内容。然而，最后一种方法将被视为普通的CSS导入，因为文件名以`.css`结尾。\n\
    \n你可以为导入操作指定几个选项：\n\n- `reference`：将使用Less文件，但不输出其内容\n- `inline`：在输出中包含导入文件的内容，但不处理它\n\
    - `less`：无论文件扩展名是什么，都将其视为Less文件\n- `css`：无论文件扩展名是什么，都将其视为CSS文件\n- `once`：只包含该文件一次（这是默认行为）\n\
    - `multiple`：多次包含该文件\n- `optional`：当文件未找到时继续编译\n\n### Mixin Guards\n\n*Guards*在需要基于条件应用表达式时非常有用。它们也被称为*条件混入（conditional\
    \ mixins）*。\n\nLess 使用带守卫的混入（guarded mixins）来实现条件执行，而不是使用`if/else`语句，如[列表 4-44](#9781484213483_Ch04.xhtml#FPar45)所示。\n\
    \n[***列表 4-44***](#9781484213483_Ch04.xhtml#_FPar45)：展示 Mixin Guards 的示例\n\n```\n\
    .switchContrast (@color) when (lightness(@color) >= 60%) {\n  background-color:\
    \ #000;\n}\n.switchContrast (@color) when (lightness(@color) < 60%) {\n  background-color:\
    \ #FFF;\n}\n.switchContrast (@color) {\n  color: @color;\n}\n.container{\n   \
    \ .switchContrast(#666);\n}\n```\n\n[列表 4-44](#9781484213483_Ch04.xhtml#FPar45)\
    \ 演示了实现一个 mixin guard，检查输入颜色的亮度，并根据其值决定对比色组合。\n\n[***列表 4-45***](#9781484213483_Ch04.xhtml#_FPar46)：[列表\
    \ 4-46](#9781484213483_Ch04.xhtml#FPar46) 的输出\n\n```\n.container {\n  background-color:\
    \ #FFF;\n  color: #666666;\n}\n```\n\nGuards 支持以下比较运算符：`>`、`<`、`>=`、`<=`和`=`。[列表\
    \ 4-46](#9781484213483_Ch04.xhtml#FPar47) 演示了这样一个场景。\n\n[***列表 4-46***](#9781484213483_Ch04.xhtml#_FPar47)：展示在\
    \ Mixin Guard 中使用比较运算符的示例\n\n```\n@mediaType: mobile;\n.setScreen (@width) when\
    \ (@mediaType = mobile) {}\n.setScreen (@width) when (@mediaType = desktop) {}\n\
    ```\n\nGuards 还支持逻辑运算符，例如`and`、`or`和`not`。你可以使用`and`关键字来组合 guards，如[列表 4-47](#9781484213483_Ch04.xhtml#FPar48)所示。\n\
    \n[***列表 4-47***](#9781484213483_Ch04.xhtml#_FPar48)：展示`and`运算符的示例\n\n```\n@mediaType:\
    \ mobile;\n@orientation: landscape;\n@width: 960px;\n.setScreen (@width) when\
    \ (@mediaType = mobile) and (@orientation=\"landscape\") {}\n```\n\n你可以通过用逗号分隔\
    \ guards 来使用`or`运算符，如[列表 4-48](#9781484213483_Ch04.xhtml#FPar49)所示。\n\n[***列表\
    \ 4-48***](#9781484213483_Ch04.xhtml#_FPar49)：展示`or`运算符的示例\n\n```\n.setScreen\
    \ (@width) when (@mediaType = desktop),(@width >= 960) {}\n```\n\n你也可以使用`not`运算符进行否定，如[列表\
    \ 4-49](#9781484213483_Ch04.xhtml#FPar50)所示。\n\n[***列表 4-49***](#9781484213483_Ch04.xhtml#_FPar50)：展示`not`运算符的示例\n\
    \n```\n.setScreen (@width) when not (@width >= 960) {}\n```\n\n对于基于值类型的混入匹配，你可以使用`is`函数。参见[列表\
    \ 4-50](#9781484213483_Ch04.xhtml#FPar51)。\n\n[***列表 4-50***](#9781484213483_Ch04.xhtml#_FPar51)：展示`isnumber`的示例\n\
    \n```\n.setVal (@val1; @val2: 0) when (isnumber(@val2)) { ... }\n```\n\nLess 中可用的类型检查函数如下：\n\
    \n- `iscolor`\n- `iskeyword`\n- `isnumber`\n- `isstring`\n- `isurl`\n\n稍后说明的`default`函数，可用于根据其他混入进行混入匹配。\n\
    \n[***列表 4-51***](#9781484213483_Ch04.xhtml#_FPar52)：展示\"条件混入（Conditional Mixins）\"\
    的示例\n\n```\n.setVal (@a) when (@a > 0) { ...  }\n.setVal (@a) when (additionalCheck())\
    \ { ... }\n```\n\n## 引用父选择器\n\nLess 使用`&`符号来引用当前选择器的父级。`&`符号反转了嵌套顺序，并且可以扩展或合并类，如[列表\
    \ 4-52](#9781484213483_Ch04.xhtml#FPar53)所示。\n\n[***列表 4-52***](#9781484213483_Ch04.xhtml#_FPar53)：展示父选择器的示例\n\
    \n```\n.button\n{\n    background:#F00;\n    &:hover{\n        background: #500;\n\
    \    }\n}\n```\n\n[***列表 4-53***](#9781484213483_Ch04.xhtml#_FPar54)：[列表 4-52](#9781484213483_Ch04.xhtml#FPar52)\
    \ 的输出\n\n```\n.button {\n  background: #F00;\n}\n.button:hover {\n  background:\
    \ #500;\n}\n```\n\n`&`符号主要用于向一个类添加伪类。这在之前的列表中以一个简单示例进行了演示，即添加了`:hover`伪类。\n\n\
    另一个可以使用父选择器的常见场景是构建 clear fix。这可以通过将父选择器与`:after`一起使用来实现。这在[列表 4-54](#9781484213483_Ch04.xhtml#FPar55)中进行了演示。\n\
    \n[***列表 4-54***](#9781484213483_Ch04.xhtml#_FPar55)：使用父选择器构建 clear fix\n\n```\n\
    .clearfix() {\n    &:after {\n        clear: both;\n    }\n}\n\n.column{\n   \
    \ .clearfix;\n}\n```\n\n***列表 4-55***：[列表 4-54](#9781484213483_Ch04.xhtml#FPar54)\
    \ 的输出\n\n```\n.column:after {\n  clear: both;\n}\n```\n\n除了CSS提供的伪类之外，Less还提供了额外的伪类，即`extend`伪类，其语法类似于CSS伪类。`extend`伪类有助于扩展选择器，如[列表\
    \ 4-56](#9781484213483_Ch04.xhtml#FPar57)所示。\n\n[***列表 4-56***](#9781484213483_Ch04.xhtml#_FPar57)：展示`extend`伪类的示例\n\
    \n```\n.primary{\n    color: #00F;\n    &:hover {\n        color: #006;\n    }\n\
    }\n.secondary:extend(.primary){\n\n}\n```\n\n[列表 4-56](#9781484213483_Ch04.xhtml#FPar57)\
    \ 通过使用Less提供的`extend`伪选择器扩展了`primary`类。此代码的输出如[列表 4-57](#9781484213483_Ch04.xhtml#FPar58)所示。\n\
    \n[***列表 4-57***](#9781484213483_Ch04.xhtml#_FPar58)：[列表 4-58](#9781484213483_Ch04.xhtml#FPar58)\
    \ 的输出\n\n```\n.primary,\n.secondary {\n  color: #00F;\n}\n.primary:hover {\n \
    \ color: #006;\n}\n```\n\n## 将`&`与 Guards 结合使用\n\nGuards 可以与`&`符号一起使用，以创建条件语句。\n\
    \n这在[列表 4-58](#9781484213483_Ch04.xhtml#FPar59)中进行了演示，其中父选择器与一个 guard 结合使用，根据作为参数传入的颜色级别来决定使用哪种颜色。\n\
    \n[***列表 4-58***](#9781484213483_Ch04.xhtml#_FPar59)：将 Guard 与父选择器结合使用的示例\n\n\
    ```\n.colorGenerator(@level) {\n    & when(@level>5) {\n        color: #600;\n\
    \    }\n    & when (@level<=5){\n        color:#060;\n    }\n}\np.lead {\n   \
    \ .colorGenerator(6);\n}\np.secondLead {\n    .colorGenerator(1);\n}\n```\n\n\
    ***列表 4-59***：[列表 4-58](#9781484213483_Ch04.xhtml#FPar58) 的输出\n\n```\np.lead {\n\
    \  color: #600;\n}\np.secondLead {\n  color: #060;\n}\n```\n\n## 分离规则和混入\n\n分离规则集（detached\
    \ rulesets）是一组规则，包含有效的Less或CSS代码，并存储在一个变量中。在Less中，这些分离规则集可以作为参数传递给混入，如[列表 4-60](#9781484213483_Ch04.xhtml#FPar61)所示。\n\
    \n[***列表 4-60***](#9781484213483_Ch04.xhtml#_FPar61)：分离规则的示例\n\n```\n@errorStyleSettings:\
    \ { color: #A00; border: 1px solid #A00 }\n```"
  raw: 'The behavior of the @import statement may vary depending on the file extension
    of the imported file.


    *   If the imported file ends with .css, it will be treated like a normal CSS
    import and the statement will be left untouched.

    *   For any other extension, it will be treated like a Less file and will be imported.
    If the .less extension is not present, it will be appended and the file content
    will be imported.


    ***Listing 4-43***. Example Demonstrating Various Importing Methods


    ```

    @import "filetoimport";

    @import "filetoimport.less";

    @import "filetoimport.php";

    @import "filetoimport.css";

    ```


    In this example, first three methods will treat the file as a Less file and import
    its content. However the last method will be considered a normal CSS import, since
    the file name ends with .css”.


    There are several options that you can include with your imports:


    *   reference: This will use a Less file but do not output it

    *   inline: This will include the content of imported file in the output but will
    not process it

    *   less: This will treat the file as a Less file, no matter what the file extension

    *   css: This will treat the file as a CSS file, regardless of file extension

    *   once: This will include the file only one time (this is the default behavior)

    *   multiple: This will include the file multiple times

    *   optional: This will continue compiling when the file is not found


    Mixin Guards


    *Guards* are useful when expressions are to be applied on the basis of conditions.
    They are also known as *conditional mixins.*


    Less implements conditional execution using guarded mixins instead of if/else
    statements, as shown in [Listing 4-44](#9781484213483_Ch04.xhtml#FPar45).


    [***Listing 4-44***](#9781484213483_Ch04.xhtml#_FPar45). Example Demonstrating
    Mixin Guards


    ```

    .switchContrast (@color) when (lightness(@color) >= 60%) {

      background-color: #000;

    }

    .switchContrast (@color) when (lightness(@color) < 60%) {

      background-color: #FFF;

    }

    .switchContrast (@color) {

      color: @color;

    }

    .container{

        .switchContrast(#666);

    }

    ```


    [Listing 4-44](#9781484213483_Ch04.xhtml#FPar45) demonstrates implementing a mixin
    guard, where the input color lightness is checked and, based on its value, the
    contrast combination is decided.


    [***Listing 4-45***](#9781484213483_Ch04.xhtml#_FPar46). Output of [Listing 4-46](#9781484213483_Ch04.xhtml#FPar46)


    ```

    .container {

      background-color: #FFF;

      color: #666666;

    }

    ```


    Guard supports the following comparison operators: >, <, >=, <=, and =. [Listing
    4-46](#9781484213483_Ch04.xhtml#FPar47) demonstrates one such scenario.


    [***Listing 4-46***](#9781484213483_Ch04.xhtml#_FPar47). Example Demonstrating
    Use of Comparison Operator in Mixin Guard


    ```

    @mediaType: mobile;

    .setScreen (@width) when (@mediaType = mobile) {}

    .setScreen (@width) when (@mediaType = desktop) {}

    ```


    Guard also supports logical operators such as and, or, and not. You can use the
    and keyword to combine guards, as shown in [Listing 4-47](#9781484213483_Ch04.xhtml#FPar48).


    [***Listing 4-47***](#9781484213483_Ch04.xhtml#_FPar48). Example Demonstrating
    the and Operator


    ```

    @mediaType: mobile;

    @orientation: landscape;

    @width: 960px;

    .setScreen (@width) when (@mediaType = mobile) and (@orientation="landscape")
    {}

    ```


    You can use or operators by separating guards with commas, as shown in [Listing
    4-48](#9781484213483_Ch04.xhtml#FPar49).


    [***Listing 4-48***](#9781484213483_Ch04.xhtml#_FPar49). Example Demonstrating
    the or Operator


    ```

    .setScreen (@width) when (@mediaType = desktop),(@width >= 960) {}

    ```


    You can also use the not operator to negate, as demonstrated in [Listing 4-49](#9781484213483_Ch04.xhtml#FPar50).


    [***Listing 4-49***](#9781484213483_Ch04.xhtml#_FPar50). Example Demonstrating
    the not Operator


    ```

    .setScreen (@width) when not (@width >= 960) {}

    ```


    For matching mixins based on value type, you can use the is function. See [Listing
    4-50](#9781484213483_Ch04.xhtml#FPar51).


    [***Listing 4-50***](#9781484213483_Ch04.xhtml#_FPar51). Example Demonstrating
    isnumber


    ```

    .setVal (@val1; @val2: 0) when (isnumber(@val2)) { ... }

    ```


    The type-checking functions available in Less are as follows:


    *   iscolor

    *   iskeyword

    *   isnumber

    *   isstring

    *   isurl


    The default function, explained later, may be used to do a mixin match depending
    on other mixins.


    [***Listing 4-51***](#9781484213483_Ch04.xhtml#_FPar52). Example Demonstrating
    “Conditional Mixins”


    ```

    .setVal (@a) when (@a > 0) { ...  }

    .setVal (@a) when (additionalCheck()) { ... }

    ```


    Referencing the Parent Selector


    Less uses the & symbol to reference the parent of the current selector. The &
    symbol reverses the nesting order and can extend or merge classes, as shown in
    [Listing 4-52](#9781484213483_Ch04.xhtml#FPar53).


    [***Listing 4-52***](#9781484213483_Ch04.xhtml#_FPar53). Example Demonstrating
    the Parent Selector


    ```

    .button

    {

        background:#F00;

        &:hover{

            background: #500;

        }

    }

    ```


    [***Listing 4-53***](#9781484213483_Ch04.xhtml#_FPar54). Output of [Listing 4-52](#9781484213483_Ch04.xhtml#FPar52)


    ```

    .button {

      background: #F00;

    }

    .button:hover {

      background: #500;

    }

    ```


    The & symbol is mainly used to add pseudo-classes to a class. This is demonstrated
    with a simple example in the previous listing, by adding a :hover pseudo-class.


    Yet another common scenario where you can use a parent selector is for building
    a clear fix. This can be done by using the parent selector with :after. This is
    demonstrated in [Listing 4-54](#9781484213483_Ch04.xhtml#FPar55).


    [***Listing 4-54***](#9781484213483_Ch04.xhtml#_FPar55). Use of the Parent Selector
    to Build a Clear Fix


    ```

    .clearfix() {

        &:after {

            clear: both;

        }

    }


    .column{

        .clearfix;

    }

    ```


    ***Listing 4-55***. Output of [Listing 4-54](#9781484213483_Ch04.xhtml#FPar54)


    ```

    .column:after {

      clear: both;

    }

    ```


    Less provides pseudo-classes in addition to the ones provided by CSS, namely the
    extend pseudo-class, which has syntax similar to CSS pseudo-class. The extend
    pseudo-class helps extend the selector, as shown in [Listing 4-56](#9781484213483_Ch04.xhtml#FPar57).


    [***Listing 4-56***](#9781484213483_Ch04.xhtml#_FPar57). Example Demonstrating
    the extend Pseudo-Class


    ```

    .primary{

        color: #00F;

        &:hover {

            color: #006;

        }

    }

    .secondary:extend(.primary){


    }

    ```


    [Listing 4-56](#9781484213483_Ch04.xhtml#FPar57) extends the primary class by
    using the extend pseudo-selector provided by Less. The output of this code is
    shown in [Listing 4-57](#9781484213483_Ch04.xhtml#FPar58).


    [***Listing 4-57***](#9781484213483_Ch04.xhtml#_FPar58). Output of [Listing 4-58](#9781484213483_Ch04.xhtml#FPar58)


    ```

    .primary,

    .secondary {

      color: #00F;

    }

    .primary:hover {

      color: #006;

    }

    ```


    Using & with Guards


    Guards can be used along with the & symbol to make a conditional statement.


    This is demonstrated in [Listing 4-58](#9781484213483_Ch04.xhtml#FPar59), where
    the parent selector is used with a guard to determine which color to use as per
    the color level passed in as parameter.


    [***Listing 4-58***](#9781484213483_Ch04.xhtml#_FPar59). Example of a Guard with
    the Parent Selector


    ```

    .colorGenerator(@level) {

        & when(@level>5) {

            color: #600;

        }

        & when (@level<=5){

            color:#060;

        }

    }

    p.lead {

        .colorGenerator(6);

    }

    p.secondLead {

        .colorGenerator(1);

    }

    ```


    ***Listing 4-59***. Output of [Listing 4-58](#9781484213483_Ch04.xhtml#FPar58)


    ```

    p.lead {

      color: #600;

    }

    p.secondLead {

      color: #060;

    }

    ```


    Detached Rules and Mixins


    Detached rulesets are sets of rules, containing valid Less or CSS code, and stored
    in a variable. In Less, these detached rulesets can be passed as arguments to
    a mixin, as shown in [Listing 4-60](#9781484213483_Ch04.xhtml#FPar61).


    [***Listing 4-60***](#9781484213483_Ch04.xhtml#_FPar61). Example of a Detached
    Rule


    ```

    @errorStyleSettings: { color: #A00; border: 1px solid #A00 }

    ```'
