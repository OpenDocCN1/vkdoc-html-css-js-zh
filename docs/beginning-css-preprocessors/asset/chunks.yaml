    Now for the final part of this example, you will add styles for the `.row` class,
    which will act like a container for all the columns. After adding the styles,
    the final code should look like [Listing 3-63](#9781484213483_Ch03.xhtml#FPar63).


    [***Listing 3-63***](#9781484213483_Ch03.xhtml#_FPar63). Adding Styles for row


