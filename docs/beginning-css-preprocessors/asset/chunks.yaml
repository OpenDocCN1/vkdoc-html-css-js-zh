    Background-Gradient


    Compass provides mixins to support different variants of background-gradient,
    including:


    *   Linear

    *   Radial

    *   Horizontal linear

    *   Gradient with angle


    The HTML for this is shown in [Listing 5-33](#9781484213483_Ch05.xhtml#FPar34).


    [***Listing 5-33***](#9781484213483_Ch05.xhtml#_FPar34). Modified HTML for background-gradient


    ```

    <!DOCTYPE html>

    <html>

      <head>

        <title>Built in compass effects</title>

        <link rel="stylesheet" type="text/css" href="stylesheets/screen.css">

      </head>

      <body>

        <h1>Background Gradient</h1>

        <div class="gradElement"></div>

      </body>

    </html>

    ```


    Now you will add code for background-gradient, as shown in [Listing 5-34](#9781484213483_Ch05.xhtml#FPar35).


    [***Listing 5-34***](#9781484213483_Ch05.xhtml#_FPar35). Code for Background Gradient
    in screen.scss


    ```

    @import "compass";


    .gradElement{

       width:64px;

       height:64px;

       @include background-image(linear-gradient(to bottom right, #FF0000, #888888));

       display:inline-block;

    }

    ```


    In the previous code, you first import Compass so that you can get access to the
    CSS features. You then define the width and height of the element and set its
    display value to inline-block so that the element is visible. Next you invoke
    the background-image mixin, which will render the gradient for you. Its syntax
    is similar to its CSS counterpart, where values are comma- or space-separated.
    The final CSS of the previous code is shown in [Listing 5-35](#9781484213483_Ch05.xhtml#FPar36).


    [***Listing 5-35***](#9781484213483_Ch05.xhtml#_FPar36). Output CSS of code in
    [Listing 5-34](#9781484213483_Ch05.xhtml#FPar34)


    ```

    /* line 9, ../sass/screen.scss */

    .gradElement {

    width: 64px;

    height: 64px;

    background-image: url(''data:image/svg+xml;base64,'');

    background-size: 100%;

    background-image: -webkit-gradient(linear, 0% 0%, 100% 100%, color-stop(0%, #ff0000),
    color-stop(100%, #888888));

    background-image: -moz-linear-gradient(top, #ff0000, #888888);

    background-image: -webkit-linear-gradient(top, #ff0000, #888888);

    background-image: linear-gradient(to bottom right, #ff0000, #888888);

    display: inline-block;

    }

    ```


    ![9781484213483_Fig05-12.jpg](OEBPS/Images/9781484213483_Fig05-12.jpg)


    Figure 5-12\. Output of the linear gradient


    As you see in the final output, Compass adds the necessary vendor prefixing. Similarly,
    you can also create other types of gradients; for example try to create a radial
    gradient in [Listing 5-36](#9781484213483_Ch05.xhtml#FPar37).


    [***Listing 5-36***](#9781484213483_Ch05.xhtml#_FPar37). Creating a Radial Gradient
    with Compass


    ```

    .radGradElement{

       width:64px;

       height:64px;

       @include background-image(radial-gradient(30px 30px, #FF0000 10px, #888888
    30px));

       display:inline-block;

    }

    ```


    ![9781484213483_Fig05-13.jpg](OEBPS/Images/9781484213483_Fig05-13.jpg)


    Figure 5-13\. Output of the radial gradient


    More examples of background-gradient can be seen here: [http://compass-style.org/examples/compass/css3/gradient/](http://compass-style.org/examples/compass/css3/gradient/).


    Border Radius


    Another commonly used CSS3 feature is border-radius. It’s used to give rounded
    edges to an element. To see this in action, lets add some markup to the HTML file,
    as shown in [Listing 5-37](#9781484213483_Ch05.xhtml#FPar38).


    [***Listing 5-37***](#9781484213483_Ch05.xhtml#_FPar38). Additional Markup for
    the border-radius Markup


    ```

    <h1>Border Radius</h1>

    <div class="br1 rounded"></div>

    ```


    Now let’s add code to the SCSS file. In the first example, you will see an element
    that is rounded from all sides in [Listing 5-38](#9781484213483_Ch05.xhtml#FPar39).


    [***Listing 5-38***](#9781484213483_Ch05.xhtml#_FPar39). Simple Border Radius
    Mixin Implementation


    ```

    // Code for border radius mixin

    .rounded{

       width:64px;

       height:64px;

       display:inline-block;

       background:#FF0000;

    }

    .br1{

       @include border-radius(30px);

    }

    ```


    ***Listing 5-39***. Output of [Listing 5-38](#9781484213483_Ch05.xhtml#FPar38)


    ```

    /* line 23, ../sass/screen.scss */

    .rounded {

    width: 64px;

    height: 64px;

    display: inline-block;

    background: #FF0000;

    }


    /* line 29, ../sass/screen.scss */

    .br1 {

    -moz-border-radius: 30px;

    -webkit-border-radius: 30px;

    border-radius: 30px;

    }

    ```


    In addition to this simple border-radius mixin, Compass provides variants of border-radius
    mixins by which you can have single or two sides rounded. Let’s see an example
    of each variation. First, you will see the necessary markup to the HTML file,
    as shown in [Listing 5-40](#9781484213483_Ch05.xhtml#FPar41).


    [***Listing 5-40***](#9781484213483_Ch05.xhtml#_FPar41). Border Radius Variants


    ```

    <div class="br2 rounded"></div>

    <div class="br3 rounded"></div>

    ```


    Next you see the code for the SCSS file shown in [Listing 5-41](#9781484213483_Ch05.xhtml#FPar42).


    [***Listing 5-41***](#9781484213483_Ch05.xhtml#_FPar42). Border Radius Variants


    ```

    .br2{

      @include border-top-left-radius(30px);

    }

    .br3{

      @include border-bottom-radius(30px);

    }

    ```


    In the previous example, you can see two variations of border radius, one in which
    only one side is rounded and other where two sides are rounded. The output of
    the previous code is shown in [Listing 5-42](#9781484213483_Ch05.xhtml#FPar43).


    [***Listing 5-42***](#9781484213483_Ch05.xhtml#_FPar43). Output of [Listing 5-41](#9781484213483_Ch05.xhtml#FPar41)


