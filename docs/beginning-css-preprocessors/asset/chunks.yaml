    \n# 第 3 章\n\n![image](img/frontdot.jpg)\n\n# 高级 Sass\n\n在上一章中，你了解了安装步骤以及使用 Sass\
    \ 所需的基本组件。在本章中，你将学习 Sass 中更为高级的概念。\n\n本章将探索 Sass 的以下方面：\n\n*   `@import`\n*  \
    \ `@media`\n*   `@extend`\n*   `@at-root`\n*   混入指令\n*   函数指令\n*   输出样式\n*   构建你自己的网格系统\n\
    \n## `@import`\n\nSass 也支持类似于原生 CSS 中可用的导入功能。但与 CSS 不同——CSS 在遇到 `@import` 时会下载\
    \ CSS 文件——使用 Sass `@import` 规则导入的 Sass 和 SCSS 文件将在编译后合并并输出为单个文件。\n\n当你在文件中指定 Sass\
    \ 导入时，它会在当前目录中查找。可以使用 `load_paths` 选项指定额外的搜索路径。默认情况下，它采用文件名。\n\n***列表 3-1***。`@import`\
    \ 示例\n\n```\n@import \"main\"\n```\n"
- fmt: "`@import` can be used for importing multiple files as well.\n\n***Listing\
    \ 3-2***. Example of `@import` for Getting Multiple Files\n\n```\n@import \"main\"\
    , \"mobile\"\n```\n\nThis behavior is shown in [Figure 3-1](#9781484213483_Ch03.xhtml#Fig1).\n\
    \n![9781484213483_Fig03-01.jpg](OEBPS/Images/9781484213483_Fig03-01.jpg)\n\n[Figure\
    \ 3-1](#9781484213483_Ch03.xhtml#_Fig1). Visual representation of how `@import`\
    \ works in Sass\n\n### Partials\n\nLet’s say you have some reusable chunk of Sass\
    \ code that you want to import but don’t want to see it in the final output file.\
    \ You can use partials to achieve this result. Partials come in handy for segregating\
    \ the style code in various files for better organization.\n\nLet’s say you have\
    \ a Sass file containing information regarding typography like font size and weights\
    \ with the name `typography.scss`. To make this file partial, you need to prefix\
    \ it with an underscore. So the file name would be `_typography.scss`. The underscore\
    \ tells the Sass compiler that the specified file is a partial and need not be\
    \ compiled into complete CSS.\n\nThis makes managing style code in the project\
    \ easier as the project grows, by sorting code into logical chunks.\n\nThus continuing\
    \ with example from previous paragraph, after renaming the file `_typography.scss`,\
    \ you can import it in the code with a simple `@import typography` statement.\n\
    \n### Nested @import\n\nImports can also be used for importing code snippets within\
    \ style rules. Using `@import`, you can also import CSS rules.\n\nLet’s take an\
    \ example where you have two files—`parent.scss` and `file2.scss`. Say you want\
    \ to import the content of `parent.scss` into `file2.scss`. You could do so as\
    \ shown in [Listing 3-3](#9781484213483_Ch03.xhtml#FPar3).\n\n[***Listing 3-3***](#9781484213483_Ch03.xhtml#_FPar3).\
    \ Example of `@import` for Importing Style: Content of `_parent.scss`\n\n```\n\
    .parent{\n        Background-color:#CCC;\n}\n```\n\n[***Listing 3-4***](#9781484213483_Ch03.xhtml#_FPar4).\
    \ Example of `@import` for Importing Style: Content of `file2.scss`\n\n```\n.child{\n\
    \        @import \"parent\";\n}\n```\n\nWhen the code shown in [Listing 3-4](#9781484213483_Ch03.xhtml#FPar4)\
    \ is executed, you get the output shown in [Listing 3-5](#9781484213483_Ch03.xhtml#FPar5).\n\
    \n[***Listing 3-5***](#9781484213483_Ch03.xhtml#_FPar5). Output of [Listing 3-4](#9781484213483_Ch03.xhtml#FPar4)\n\
    \n```\n.child .parent{\n        Background-color:#CCC;\n}\n```\n\nThus when you\
    \ apply import within a style rule, all the imported rules will be nested inside\
    \ that specific rule. The result of this will be same as if the styles were nested\
    \ inside that specific selector.\n\n### Plain CSS Imports\n\nIn addition to its\
    \ own style of import, Sass also supports the CSS style `@import`. There are two\
    \ factors that cause such a behavior to be triggered. These are as follows:\n\n\
    * URL/path of the file to be imported ends with a `.css` extension\n* URL/path\
    \ of the file to be imported begins with `http(s)://`\n\nThus, you cannot import\
    \ plain CSS directly in Sass. However, there is a workaround for this. Since Sass\
    \ is compatible with CSS, you can simply change the extension of the file from\
    \ `.css` to `.scss` and import it.\n\n### @media\n\nMedia queries are the most\
    \ essential part of today’s web design process. With media queries, you can customize\
    \ your web app based on things like viewport width, viewport height, device width,\
    \ device height, and orientation.\n\nNormally, a developer building a web page\
    \ would first write \"normal\" styles and then write media queries at the end.\
    \ This would work fine for stylesheets with few lines of code; however, it will\
    \ be nightmare to manage when the code increases to thousands of lines.\n\nSass\
    \ provides something much easier. `@media` is used to write media queries similar\
    \ to CSS. However, it has an added feature that it can be nested within a style\
    \ rule. Sass will automatically build a media queries declaration and put respective\
    \ styles inside it, as shown in [Listing 3-6](#9781484213483_Ch03.xhtml#FPar6).\n\
    \n[***Listing 3-6***](#9781484213483_Ch03.xhtml#_FPar6). `@media` Inside Sass\n\
    \n```\n#container{\n        Width:960px;\n        @media screen and (min-width:500px){\n\
    \                Width:100%;}\n}\n```\n\n***Listing 3-7***. Output of [Listing\
    \ 3-6](#9781484213483_Ch03.xhtml#FPar6)\n\n```\n#container {\n  Width: 960px;\n\
    }\n\n@media screen and (min-width: 500px) {\n  #container {\n    Width: 100%;\n\
    \  }\n}\n```\n\nNow you might be wondering why we would use a preprocessor for\
    \ writing a media query instead of using the conventional CSS method. One of the\
    \ advantages is code readability. By using the Sass way of integrating the media\
    \ query, the code is very easy to understand.\n\nSass also allows nesting of media\
    \ queries for building complex media queries. Consider the example in [Listing\
    \ 3-8](#9781484213483_Ch03.xhtml#FPar8), where we have nested media queries for\
    \ different width inside the `#container`. This makes the code easy to understand\
    \ and far more readable.\n\n[***Listing 3-8***](#9781484213483_Ch03.xhtml#_FPar8).\
    \ Nesting of Media Queries\n\n```\n@media screen {\n  #container {\n    @media\
    \ (min-width:500px) {\n      width: 500px;\n    }\n    @media (min-width:700px)\
    \ {\n      width: 700px;\n    }\n  }\n}\n```\n\n***Listing 3-9***. Ouput of [Listing\
    \ 3-8](#9781484213483_Ch03.xhtml#FPar8)\n\n```\n@media screen and (min-width:\
    \ 500px) {\n  #container {\n    width: 500px;\n  }\n}\n\n@media screen and (min-width:\
    \ 700px) {\n  #container {\n    width: 700px;\n  }\n}\n```\n\nGoing further, you\
    \ can create a partial with media queries inside them and then include them wherever\
    \ needed.\n\nWith Sass, you can also include media queries inline. Consider an\
    \ example where you want a container to have different width on different viewport\
    \ sizes. This can be achieved as demonstrated in [Listing 3-10](#9781484213483_Ch03.xhtml#FPar10).\n\
    \n[***Listing 3-10***](#9781484213483_Ch03.xhtml#_FPar10). Inline Media Queries\n\
    \n```\n$color1:#CCC;\n.color {\n   color: $color1;\n   @include setQuery(sm) {\n\
    \      width: 80%;\n   }\n   @include setQuery(md) {\n      width: 70%;\n   }\n\
    \   @include setQuery(lg) {\n      width: 60%;\n   }\n}\n```\n\nYet another advantage\
    \ of writing media queries using Sass is that you can assign breakpoints for media\
    \ queries to variables. Then these variables can be used in media queries. This\
    \ is demonstrated in [Listing 3-11](#9781484213483_Ch03.xhtml#FPar11), which is\
    \ a more elaborate version of the previous example.\n\n[***Listing 3-11***](#9781484213483_Ch03.xhtml#_FPar11).\
    \ Using Variables for Assigning Breakpoint\n\n```\n$color1:#CCC;\n$sm:320px;\n\
    $md:720px;\n$lg:1280px;\n@mixin setQuery($type){\n  @if $type == sm {\n    @media\
    \ only screen and (min-width: $sm) and (max-width: $md - 1) {\n      @content;\n\
    \    }\n  }\n  @else if $type == md {\n    @media only screen and (min-width:\
    \ $md) and (max-width: $lg - 1) {\n      @content;\n    }\n  }\n  @else if $type\
    \ == lg {\n    @media only screen and (min-width: $lg){\n      @content\n    }\n\
    \  }\n}\n.container {\n  color: $color1;\n  @include setQuery(sm) {\n    width:\
    \ 80%;\n  }\n  @include setQuery(md) {\n    width: 70%;\n  }\n  @include setQuery(lg)\
    \ {\n    width: 60%;\n  }\n}\n```\n\nThe previous code example stored width values\
    \ in variables. Then, on the basis of which variable we pass as the parameter\
    \ to the mixin (which is like a function used to inject reusable style with computation\
    \ if needed, a concept that’s covered later in the chapter), the media query is\
    \ generated and injected. The output of the previous code is as shown in [Listing\
    \ 3-12](#9781484213483_Ch03.xhtml#FPar12).\n\n[***Listing 3-12***](#9781484213483_Ch03.xhtml#_FPar12).\
    \ Output of [Listing 3-11](#9781484213483_Ch03.xhtml#FPar11)\n\n```\n.container\
    \ {\n  color: #CCC;\n}\n\n@media only screen and (min-width: 320px) and (max-width:\
    \ 719px) {\n  .container {\n    width: 80%;\n  }\n}\n\n@media only screen and\
    \ (min-width: 720px) and (max-width: 1279px) {\n  .container {\n    width: 70%;\n\
    \  }\n}\n\n@media only screen and (min-width: 1280px) {\n  .container {\n    width:\
    \ 60%;\n  }\n}\n```\n\n### @extend"
  raw: '@import can be used for importing multiple files as well.


    ***Listing 3-2***. Example of @import for Getting Multiple Files


    ```

    @import "main", "mobile"

    ```


    This behavior is shown in [Figure 3-1](#9781484213483_Ch03.xhtml#Fig1).


    ![9781484213483_Fig03-01.jpg](OEBPS/Images/9781484213483_Fig03-01.jpg)


    [Figure 3-1](#9781484213483_Ch03.xhtml#_Fig1). Visual representation of how @import
    works in Sass


    Partials


    Let’s say you have some reusable chunk of Sass code that you want to import but
    don’t want to see it in the final output file. You can use partials to achieve
    this result. Partials come in handy for segregating the style code in various
    files for better organization.


    Let’s say you have a Sass file containing information regarding typography like
    font size and weights with the name typography.scss. To make this file partial,
    you need to prefix it with an underscore. So the file name would be _typography.scss.
    The underscore tells the Sass compiler that the specified file is a partial and
    need not be compiled into complete CSS.


    This makes managing style code in the project easier as the project grows, by
    sorting code into logical chunks.


    Thus continuing with example from previous paragraph, after renaming the file
    _typography.scss, you can import it in the code with a simple @import typography
    statement.


    Nested @import


    Imports can also be used for importing code snippets within style rules. Using
    @import, you can also import CSS rules.


    Let’s take an example where you have two files—parent.scss and file2.scss. Say
    you want to import the content of parent.scss into file2.scss. You could do so
    as shown in [Listing 3-3](#9781484213483_Ch03.xhtml#FPar3).


    [***Listing 3-3***](#9781484213483_Ch03.xhtml#_FPar3). Example of @import for
    Importing Style: Content of _parent.scss


    ```

    .parent{

            Background-color:#CCC;

    }

    ```


    [***Listing 3-4***](#9781484213483_Ch03.xhtml#_FPar4). Example of @import for
    Importing Style: Content of file2.scss


    ```

    .child{

            @import "parent";

    }

    ```


    When the code shown in [Listing 3-4](#9781484213483_Ch03.xhtml#FPar4) is executed,
    you get the output shown in [Listing 3-5](#9781484213483_Ch03.xhtml#FPar5).


    [***Listing 3-5***](#9781484213483_Ch03.xhtml#_FPar5). Output of [Listing 3-4](#9781484213483_Ch03.xhtml#FPar4)


    ```

    .child .parent{

            Background-color:#CCC;

    }

    ```


    Thus when you apply import within a style rule, all the imported rules will be
    nested inside that specific rule. The result of this will be same as if the styles
    were nested inside that specific selector.


    Plain CSS Imports


    In addition to its own style of import, Sass also supports the CSS style @import.
    There are two factors that cause such a behavior to be triggered. These are as
    follows:


    *   URL/path of the file to be imported ends with a .css extension

    *   URL/path of the file to be imported begins with http(s)://


    Thus, you cannot import plain CSS directly in Sass. However, there is a workaround
    for this. Since Sass is compatible with CSS, you can simply change the extension
    of the file from .css to .scss and import it.


    @media


    Media queries are the most essential part of today’s web design process. With
    media queries, you can customize your web app based on things like viewport width,
    viewport height, device width, device height, and orientation.


    Normally, a developer building a web page would first write "normal" styles and
    then write media queries at the end. This would work fine for stylesheets with
    few lines of code; however, it will be nightmare to manage when the code increases
    to thousands of lines.


    Sass provides something much easier. @media is used to write media queries similar
    to CSS. However, it has an added feature that it can be nested within a style
    rule. Sass will automatically build a media queries declaration and put respective
    styles inside it, as shown in [Listing 3-6](#9781484213483_Ch03.xhtml#FPar6).


    [***Listing 3-6***](#9781484213483_Ch03.xhtml#_FPar6). @media Inside Sass


    ```

    #container{

            Width:960px;

            @media screen and (min-width:500px){

                    Width:100%;}

    }

    ```


    ***Listing 3-7***. Output of [Listing 3-6](#9781484213483_Ch03.xhtml#FPar6)


    ```

    #container {

      Width: 960px;

    }


    @media screen and (min-width: 500px) {

      #container {

        Width: 100%;

      }

    }

    ```


    Now you might be wondering why we would use a preprocessor for writing a media
    query instead of using the conventional CSS method. One of the advantages is code
    readability. By using the Sass way of integrating the media query, the code is
    very easy to understand.


    Sass also allows nesting of media queries for building complex media queries.
    Consider the example in [Listing 3-8](#9781484213483_Ch03.xhtml#FPar8), where
    we have nested media queries for different width inside the #container. This makes
    the code easy to understand and far more readable.


    [***Listing 3-8***](#9781484213483_Ch03.xhtml#_FPar8). Nesting of Media Queries


    ```

    @media screen {

      #container {

        @media (min-width:500px) {

          width: 500px;

        }

        @media (min-width:700px) {

          width: 700px;

        }

      }

    }

    ```


    ***Listing 3-9***. Ouput of [Listing 3-8](#9781484213483_Ch03.xhtml#FPar8)


    ```

    @media screen and (min-width: 500px) {

      #container {

        width: 500px;

      }

    }


    @media screen and (min-width: 700px) {

      #container {

        width: 700px;

      }

    }

    ```


    Going further, you can create a partial with media queries inside them and then
    include them wherever needed.


    With Sass, you can also include media queries inline. Consider an example where
    you want a container to have different width on different viewport sizes. This
    can be achieved as demonstrated in [Listing 3-10](#9781484213483_Ch03.xhtml#FPar10).


    [***Listing 3-10***](#9781484213483_Ch03.xhtml#_FPar10). Inline Media Queries


    ```

    $color1:#CCC;

    .color {

       color: $color1;

       @include setQuery(sm) {

          width: 80%;

       }

       @include setQuery(md) {

          width: 70%;

       }

       @include setQuery(lg) {

          width: 60%;

       }

    }

    ```


    Yet another advantage of writing media queries using Sass is that you can assign
    breakpoints for media queries to variables. Then these variables can be used in
    media queries. This is demonstrated in [Listing 3-11](#9781484213483_Ch03.xhtml#FPar11),
    which is a more elaborate version of the previous example.


    [***Listing 3-11***](#9781484213483_Ch03.xhtml#_FPar11). Using Variables for Assigning
    Breakpoint


    ```

    $color1:#CCC;

    $sm:320px;

    $md:720px;

    $lg:1280px;

    @mixin setQuery($type){

      @if $type == sm {

        @media only screen and (min-width: $sm) and (max-width: $md - 1) {

          @content;

        }

      }

      @else if $type == md {

        @media only screen and (min-width: $md) and (max-width: $lg - 1) {

          @content;

        }

      }

      @else if $type == lg {

        @media only screen and (min-width: $lg){

          @content

        }

      }

    }

    .container {

      color: $color1;

      @include setQuery(sm) {

        width: 80%;

      }

      @include setQuery(md) {

        width: 70%;

      }

      @include setQuery(lg) {

        width: 60%;

      }

    }

    ```


    The previous code example stored width values in variables. Then, on the basis
    of which variable we pass as the parameter to the mixin (which is like a function
    used to inject reusable style with computation if needed, a concept that’s covered
    later in the chapter), the media query is generated and injected. The output of
    the previous code is as shown in [Listing 3-12](#9781484213483_Ch03.xhtml#FPar12).


    [***Listing 3-12***](#9781484213483_Ch03.xhtml#_FPar12). Output of [Listing 3-11](#9781484213483_Ch03.xhtml#FPar11)


    ```

    .container {

      color: #CCC;

    }


    @media only screen and (min-width: 320px) and (max-width: 719px) {

      .container {

        width: 80%;

      }

    }


    @media only screen and (min-width: 720px) and (max-width: 1279px) {

      .container {

        width: 70%;

      }

    }


    @media only screen and (min-width: 1280px) {

      .container {

        width: 60%;

      }

    }

    ```


