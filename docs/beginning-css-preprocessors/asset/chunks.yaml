  trans: '

    你可以通过 Ruby gem 安装 Sass，因此首先需要确保机器上已安装 Ruby。如果你使用 Mac OS X，系统已预装 Ruby。如果使用 Windows
    或 Linux，则需要从 [`rubyinstaller.org/downloads/`](http://rubyinstaller.org/downloads/)
    下载并安装 Ruby。


    安装 Ruby 后，可以通过运行 `gem` 命令来安装 Sass。你可以将 `gem` 视为一种扩展工具，它能够扩展使用 Ruby 的应用程序的功能。按照代码清单
    2-1 所示的命令，即可在命令行中安装 Sass。该命令的简单解释是：“Ruby，请安装名为 sass 的 gem”。


    ***代码清单 2-1***. 安装 Sass 的命令


    ```

    sudo gem install sass

    ```


    安装完成后，可以通过运行代码清单 2-2 中的命令进行验证。


    ***代码清单 2-2***. 验证 Sass 安装的命令


    ```

    sass -v

    ```


    这将会显示如图 **2-1** 所示的输出信息。


    ![9781484213483_Fig02-01.jpg](img/9781484213483_Fig02-01.jpg)


    图 2-1. `sass -v` 命令的输出


    完成此安装后，你就可以开始使用 Sass 了。


    ## 查看其他版本的 Sass


    除了最新版本，你还可以通过执行代码清单 2-3 所示的命令来查看其他可用版本。


    ***代码清单 2-3***. 查看其他版本的 Sass


    ```

    gem list sass –a –r

    ```


    该命令要求 Ruby 列出所有名称中包含“sass”的 gem。其中，`-r` 命令属性指示 Ruby 进行远程检查，以获取所有可用的 Sass 版本；`-a`
    命令属性用于列出所有可用版本。


    该 `gem list` 命令的输出如代码清单 2-4 所示。


