- fmt: "- 执行命令`gem list sass –pre –r`可查看可用的预发布版本，如[代码清单2-5](#9781484213483_Ch02.xhtml#FPar5)所示。\n\
    \n[**代码清单2-5**](#9781484213483_Ch02.xhtml#_FPar5)**：通过命令行查看预发布版本**\n\n```\ngem\
    \ list sass –pre –r\n```\n\n- 如需试用稳定版中尚未包含的最新功能，可安装预发布版本。使用[代码清单2-6](#9781484213483_Ch02.xhtml#FPar6)所示的命令进行安装。\n\
    \n[**代码清单2-6**](#9781484213483_Ch02.xhtml#_FPar6)**：安装预发布版本**\n\n```\nsudo gem\
    \ install sass –pre\n```\n\n- 某些情况下可能需要卸载已安装的Sass版本（例如使用支持项目中某些弃用功能的旧版本），可通过[代码清单2-7](#9781484213483_Ch02.xhtml#FPar7)所示方法操作。\n\
    \n[**代码清单2-7**](#9781484213483_Ch02.xhtml#_FPar7)**：卸载Sass的命令**\n\n```\ngem uninstall\
    \ sass –-version versionnumber\n```\n\n## 命令行替代方案\n\n除终端方式外，还有图形用户界面应用可运行并编译Sass，适合不熟悉或畏惧终端操作的用户。各平台均有免费及付费版本，部分应用如下：\n\
    \n*   Codekit（付费，仅Mac）\n*   Compass（付费，支持Mac/Windows/Linux）\n*   Prepros（付费，支持Mac/Windows/Linux）\n\
    *   Mixtures（免费，仅Mac）\n*   Scout（开源，支持Mac/Windows/Linux）\n*   Koala（免费，支持Mac/Windows/Linux）\n\
    \n## 编译Sass文件\n\n安装Sass后即可开始编码与编译。需指定Sass监听的哪个文件，使用[代码清单2-8](#9781484213483_Ch02.xhtml#FPar8)所示的命令。\n\
    \n[**代码清单2-8**](#9781484213483_Ch02.xhtml#_FPar8)**：Sass监听并编译文件的命令**\n\n```\n\
    sass --watch style.scss:style.css\n```\n\n[代码清单2-8](#9781484213483_Ch02.xhtml#FPar8)所示命令会监听`.scss`文件的变更。每当修改并保存`.scss`文件时，Sass会编译并生成对应的`.css`文件。该命令可分解为：\n\
    \n*   `sass`（主组件，表明这是一个Sass命令）\n*   `--watch`（该命令需执行的操作）\n*   `style.scss:style.css`（输入与输出文件，以冒号分隔）\n\
    \n在终端中输入[代码清单2-9](#9781484213483_Ch02.xhtml#FPar9)所示命令可查看更多命令选项。\n\n[**代码清单2-9**](#9781484213483_Ch02.xhtml#_FPar9)**：访问Sass文档的命令**\n\
    \n```\nsass --help\n```\n\n## 使用应用避免命令行：Scout\n\nScout是一款基于Adobe Air构建的免费应用，可从[http://mhs.github.io/scout-app/](http://mhs.github.io/scout-app/)下载。打开应用后，点击左下角的加号图标添加项目。[图2-2](#9781484213483_Ch02.xhtml#Fig2)展示了Scout应用的界面。\n\
    \n![9781484213483_Fig02-02.jpg](OEBPS/Images/9781484213483_Fig02-02.jpg)\n\n[图2-2](#9781484213483_Ch02.xhtml#_Fig2)\
    \ Scout应用界面；需点击左下角加号图标开始操作\n\n点击加号后，将看到[图2-3](#9781484213483_Ch02.xhtml#Fig3)所示的界面。\n\
    \n![9781484213483_Fig02-03.jpg](OEBPS/Images/9781484213483_Fig02-03.jpg)\n\n[图2-3](#9781484213483_Ch02.xhtml#_Fig3)\
    \ 向Scout添加项目\n\n如图所示，可配置多种参数，包括样式表目录、JavaScript目录和图像目录。还可在“Config File”字段中指定Sass编译的配置文件。请注意“Output\
    \ Modes”选项。保持默认设置可获得优化且可读的代码，不进行压缩。\n\n可设置不同的输出样式以进一步压缩输出结果。本示例中使用前两个字段指定样式表的输入和输出文件夹。\n\
    \n设置好所需字段后，点击项目名称旁的“Start”按钮启动Scout项目，将看到[图2-4](#9781484213483_Ch02.xhtml#Fig4)所示的界面。\n\
    \n![9781484213483_Fig02-04.jpg](OEBPS/Images/9781484213483_Fig02-04.jpg)\n\n[图2-4](#9781484213483_Ch02.xhtml#_Fig4)\
    \ 选择输入和输出文件夹\n\nScout会监听所有变更并编译为相应的CSS（参见[图2-5](#9781484213483_Ch02.xhtml#Fig5)）。若存在语法问题，用户会立即收到通知。随后可最小化应用，继续开发。\n\
    \n![9781484213483_Fig02-05.jpg](OEBPS/Images/9781484213483_Fig02-05.jpg)\n\n[图2-5](#9781484213483_Ch02.xhtml#_Fig5)\
    \ Scout已启动并正在监听项目\n\n## 自动化工作流\n\n与Scout类似，还有许多免费工具可加速前端开发。若希望进一步自动化开发流程且不畏惧命令行操作，可了解Yeoman（[http://yeoman.io/](http://yeoman.io/)），参见[图2-6](#9781484213483_Ch02.xhtml#Fig6)。Yeoman不仅编译Sass，还是一个完整的构建系统，可优化图像、刷新浏览器等。其核心功能包括：\n\
    \n*   **脚手架**（根据维基百科：“脚手架是某些模型-视图-控制器框架支持的技术，程序员可指定应用程序数据库的使用方式。编译器或框架利用此规范及预定义的代码模板，生成应用程序可用于创建、读取、更新和删除数据库条目的最终代码，有效地将模板视为构建更强大应用程序的‘脚手架’。公司通常用于创建基于Web的程序。”）\n\
    *   构建系统，生成压缩/编译后的代码构建版本。\n*   包管理器，自动获取所有必需的库。\n\n另一个知名的自动化工具是Bower（[http://bower.io/](http://bower.io/)）。\n\
    \n![9781484213483_Fig02-06.jpg](OEBPS/Images/9781484213483_Fig02-06.jpg)\n\n[图2-6](#9781484213483_Ch02.xhtml#_Fig6)\
    \ 访问Yeoman.io获取Yeoman框架\n\n## 变量\n\n与其他编程语言类似，变量用于将值关联到一个名称，以便在代码中重复使用。因此，您只需引用名称，而无需克隆值。在Sass中，可存储颜色、排版信息等可复用内容。使用`$`符号创建Sass变量，如[代码清单2-10](#9781484213483_Ch02.xhtml#FPar10)所示。\n\
    \n[**代码清单2-10**](#9781484213483_Ch02.xhtml#_FPar10)**：在Sass中创建变量**\n\n```\n$fontColor:#666;\n\
    \nbody{\n        color:$fontColor;\n}\n```\n\n当此Sass代码编译为普通CSS时，`body`样式定义中的`$fontColor`会被实际值替换。\n\
    \n变量如果在任何样式声明之外声明，则是全局可访问的；如果在特定选择器内声明，则仅对该选择器可用。参见[代码清单2-11](#9781484213483_Ch02.xhtml#FPar11)中的示例。\n\
    \n[**代码清单2-11**](#9781484213483_Ch02.xhtml#_FPar11)**：演示变量作用域的代码**\n\n```\nbody{\n\
    \  $fontColor:#666;\n  color:$fontColor;\n}\np{\n  color:$fontColor;\n}\n```\n\
    \n此代码会报错：\n\n```\nUndefined variable: \"$fontColor\".\n```\n\n这是因为`$fontColor`在`body`标签的样式块内声明。\n\
    \n变量可与样式规则的部分组合，形成单一样式规则。在此类实现中，变量会被其实际值替换。如[代码清单2-12](#9781484213483_Ch02.xhtml#FPar12)所示。"
  raw: 'You can also determine which prerelease versions are available by executing
    the command shown in [Listing 2-5](#9781484213483_Ch02.xhtml#FPar5).


    [***Listing 2-5***](#9781484213483_Ch02.xhtml#_FPar5). Checking the Prerelease
    Version Through the Command Line


    ```

    gem list sass –pre –r

    ```


    You can install the prerelease version if you want to try out all the bleeding-edge
    features that are not available in stable releases. Use the command shown in [Listing
    2-6](#9781484213483_Ch02.xhtml#FPar6) to do so.


    [***Listing 2-6***](#9781484213483_Ch02.xhtml#_FPar6). Installing the Prerelease
    Version


    ```

    sudo gem install sass –pre

    ```


    There may be situations where you might need to uninstall existing versions of
    Sass, such as to use an older version that supports some deprecated features used
    in the project. This can be done as in [Listing 2-7](#9781484213483_Ch02.xhtml#FPar7).


    [***Listing 2-7***](#9781484213483_Ch02.xhtml#_FPar7). Command for Uninstalling
    Sass


    ```

    gem uninstall sass –-version versionnumber

    ```


    An Alternative to the Command Line


    Besides The terminal method, there are GUI applications that will run and compile
    Sass, for people who are scared to operate or have no prior experience using terminals.
    There are free as well as paid variants of such apps for various platforms. Some
    of these are as follows


    *   Codekit (Paid) (available for Mac only)

    *   Compass (Paid) (available for Mac, Windows, and Linux)

    *   Prepros (Paid) (available for Mac, Windows, and Linux)

    *   Mixtures (Free) (available for Mac only)

    *   Scout (open source) (available for Mac, Windows, and Linux)

    *   Koala (Free) (available for Mac, Windows, and Linux)


    Compiling the sass File


    Once you have installed Sass, you can start coding and compiling. In order to
    do so, you must specify which file Sass should watch. This can be done using the
    command shown in [Listing 2-8](#9781484213483_Ch02.xhtml#FPar8).


    [***Listing 2-8***](#9781484213483_Ch02.xhtml#_FPar8). Sass Command to Watch and
    Compile a File


    ```

    sass --watch style.scss:style.css

    ```


    The command shown in [Listing 2-8](#9781484213483_Ch02.xhtml#FPar8) watches the
    .scss files for any changes. Whenever you modify and save the .scss file, Sass
    will compile and generate the output .css file. Thus the code given in [Listing
    2-8](#9781484213483_Ch02.xhtml#FPar8) can be broken down in following manner:


    *   sass (main component that indicates that this is a Sass command)

    *   --watch (action this command is supposed to perform)

    *   style.scss:style.css (input and output file separated by colon)


    You can find out more about the command options by typing the command shown in
    [Listing 2-9](#9781484213483_Ch02.xhtml#FPar9) in the terminal.


    [***Listing 2-9***](#9781484213483_Ch02.xhtml#_FPar9). Command for Accessing Sass
    Documentation


    ```

    sass --help

    ```


    Avoiding the Command Line with Apps: Using Scout


    Scout is a free app built using Adobe air and it can be downloaded from [http://mhs.github.io/scout-app/](http://mhs.github.io/scout-app/).
    Open the app and click the plus icon at the bottom-left corner to add a project.
    [Figure 2-2](#9781484213483_Ch02.xhtml#Fig2) shows the UI of the Scout app.


    ![9781484213483_Fig02-02.jpg](OEBPS/Images/9781484213483_Fig02-02.jpg)


    [Figure 2-2](#9781484213483_Ch02.xhtml#_Fig2). Scout app interface; to get started,
    you need to click on the bottom-left plus icon


    After you click the plus icon, you will see the interface shown in [Figure 2-3](#9781484213483_Ch02.xhtml#Fig3).


    ![9781484213483_Fig02-03.jpg](OEBPS/Images/9781484213483_Fig02-03.jpg)


    [Figure 2-3](#9781484213483_Ch02.xhtml#_Fig3). Adding a project to Scout


    As you can see, there are various parameters that you can configure, including
    stylesheet directories, JavaScript, and images directories. You can also provide
    specific config files for Sass compilation in the Config File field. Note the
    Output Modes option. If you leave it as is, you get optimized but readable code.
    No minification is performed.


    You can set various output styles by which output can be further compressed and
    minified. However, in this case, you will be using the first two fields where
    you specify the stylesheet input and output folders.


    Once you set your required fields, you can initiate a Scout project by clicking
    the Start button next to the project name. You will then see the screen shown
    in [Figure 2-4](#9781484213483_Ch02.xhtml#Fig4).


    ![9781484213483_Fig02-04.jpg](OEBPS/Images/9781484213483_Fig02-04.jpg)


    [Figure 2-4](#9781484213483_Ch02.xhtml#_Fig4). Selecting folders for Input and
    output


    Scout watches for all the changes that take place and compiles them to appropriate
    CSS (see [Figure 2-5](#9781484213483_Ch02.xhtml#Fig5)). If there are syntax issues,
    the user will be notified immediately. You can then minimize the app and continue
    your development.


    ![9781484213483_Fig02-05.jpg](OEBPS/Images/9781484213483_Fig02-05.jpg)


    [Figure 2-5](#9781484213483_Ch02.xhtml#_Fig5). Scout is initiated and watching
    a project


    Automating Workflow


    Like Scout, there are many free tools available to speed up the frontend development.
    If you want to automate your development further and you are not scared to play
    with command line, take a look at Yeoman ([http://yeoman.io/](http://yeoman.io/)).
    See [Figure 2-6](#9781484213483_Ch02.xhtml#Fig6). This does more than just compile
    Sass. It is a complete build system that optimizes images, refreshes the browser,
    etc. Some of the core features it provides are


    *   *Scaffolding* (As per wiki: “Scaffolding is a technique supported by some
    model-view-controller frameworks, in which the programmer can specify how the
    application database may be used. The compiler or framework uses this specification,
    together with pre-defined code templates, to generate the final code that the
    application can use to create, read, update and delete database entries, effectively
    treating the templates as a “scaffold” on which to build a more powerful application.
    It is usually used by company to for creating as a web-base program. [sic]”

    *   Build system to generate builds with compressed/compiled code.

    *   Package manager that will automatically get all the required libraries.


    Another such known automation tool is Bower ([http://bower.io/](http://bower.io/)).


    ![9781484213483_Fig02-06.jpg](OEBPS/Images/9781484213483_Fig02-06.jpg)


    [Figure 2-6](#9781484213483_Ch02.xhtml#_Fig6). Go to Yeoman.io to get the Yeoman
    framework


    Variables


    Like other programming languages, variables are used to associate values to a
    name that is available for reuse across the code. So you end up referring to a
    name instead of cloning values. In Sass, you can store color, typographic info,
    and so on, which are reusable. You use $ symbol to create a variable in Sass,
    as shown in [Listing 2-10](#9781484213483_Ch02.xhtml#FPar10).


    [***Listing 2-10***](#9781484213483_Ch02.xhtml#_FPar10). Creating Variables in
    Sass


    ```

    $fontColor:#666;


    body{

            color:$fontColor;

    }

    ```


    When this Sass code is compiled to normal CSS, $fontColor within the style definition
    of body gets replaced with the actual value.


    Variables, when declared outside any style declaration, are globally accessible.
    If they are declared inside any specific selector, they will be available only
    to that specific selector. Take a look at the example in [Listing 2-11](#9781484213483_Ch02.xhtml#FPar11).


    [***Listing 2-11***](#9781484213483_Ch02.xhtml#_FPar11). Code Demonstrating Scope
    of Variable


    ```

    body{

      $fontColor:#666;

      color:$fontColor;

    }

    p{

      color:$fontColor;

    }

    ```


    This code will give this error:


    ```

    Undefined variable: "$fontColor".

    ```


    This is because $fontColor is declared inside the style block for the body tag.


    Variables can be combined with parts of style rules to make a single style rule.
    In such an implementation, the variable is replaced by its actual value. This
    is demonstrated in [Listing 2-12](#9781484213483_Ch02.xhtml#FPar12).'
