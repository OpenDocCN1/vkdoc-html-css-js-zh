    \nLess 使用带守卫的混入（guarded mixins）来实现条件执行，而不是使用`if/else`语句，如列表 4-44 所示。\n\n***列表\
    \ 4-44***：展示 Mixin Guards 的示例\n\n```\n.switchContrast (@color) when (lightness(@color)\
    \ >= 60%) {\n  background-color: #000;\n}\n.switchContrast (@color) when (lightness(@color)\
    \ < 60%) {\n  background-color: #FFF;\n}\n.switchContrast (@color) {\n  color:\
    \ @color;\n}\n.container{\n    .switchContrast(#666);\n}\n```\n\n列表 4-44 演示了实现一个\
    \ mixin guard，检查输入颜色的亮度，并根据其值决定对比色组合。\n\n***列表 4-45***：列表 4-46 的输出\n\n```\n.container\
    \ {\n  background-color: #FFF;\n  color: #666666;\n}\n```\n\nGuards 支持以下比较运算符：`>`、`<`、`>=`、`<=`和`=`。列表\
    \ 4-46 演示了这样一个场景。\n\n***列表 4-46***：展示在 Mixin Guard 中使用比较运算符的示例\n\n```\n@mediaType:\
    \ mobile;\n.setScreen (@width) when (@mediaType = mobile) {}\n.setScreen (@width)\
    \ when (@mediaType = desktop) {}\n```\n\nGuards 还支持逻辑运算符，例如`and`、`or`和`not`。你可以使用`and`关键字来组合\
    \ guards，如列表 4-47 所示。\n\n***列表 4-47***：展示`and`运算符的示例\n\n```\n@mediaType: mobile;\n\
    @orientation: landscape;\n@width: 960px;\n.setScreen (@width) when (@mediaType\
    \ = mobile) and (@orientation=\"landscape\") {}\n```\n\n你可以通过用逗号分隔 guards 来使用`or`运算符，如列表\
    \ 4-48 所示。\n\n***列表 4-48***：展示`or`运算符的示例\n\n```\n.setScreen (@width) when (@mediaType\
    \ = desktop),(@width >= 960) {}\n```\n\n你也可以使用`not`运算符进行否定，如列表 4-49 所示。\n\n***列表\
    \ 4-49***：展示`not`运算符的示例\n\n```\n.setScreen (@width) when not (@width >= 960) {}\n\
    ```\n\n对于基于值类型的混入匹配，你可以使用`is`函数。参见列表 4-50。\n\n***列表 4-50***：展示`isnumber`的示例\n\n\
    ```\n.setVal (@val1; @val2: 0) when (isnumber(@val2)) { ... }\n```\n\nLess 中可用的类型检查函数如下：\n\
    \n- `iscolor`\n- `iskeyword`\n- `isnumber`\n- `isstring`\n- `isurl`\n\n稍后说明的`default`函数，可用于根据其他混入进行混入匹配。\n\
    \n***列表 4-51***：展示\"条件混入（Conditional Mixins）\"的示例\n\n```\n.setVal (@a) when (@a\
    \ > 0) { ...  }\n.setVal (@a) when (additionalCheck()) { ... }\n```\n\n## 引用父选择器\n\
    \nLess 使用`&`符号来引用当前选择器的父级。`&`符号反转了嵌套顺序，并且可以扩展或合并类，如列表 4-52 所示。\n\n***列表 4-52***：展示父选择器的示例\n\
    \n```\n.button\n{\n    background:#F00;\n    &:hover{\n        background: #500;\n\
    \    }\n}\n```\n\n***列表 4-53***：列表 4-52 的输出\n\n```\n.button {\n  background: #F00;\n\
    }\n.button:hover {\n  background: #500;\n}\n```\n\n`&`符号主要用于向一个类添加伪类。这在之前的列表中以一个简单示例进行了演示，即添加了`:hover`伪类。\n\
    \n另一个可以使用父选择器的常见场景是构建 clear fix。这可以通过将父选择器与`:after`一起使用来实现。这在列表 4-54 中进行了演示。\n\
    \n***列表 4-54***：使用父选择器构建 clear fix\n\n```\n.clearfix() {\n    &:after {\n    \
    \    clear: both;\n    }\n}\n\n.column{\n    .clearfix;\n}\n```\n\n***列表 4-55***：列表\
    \ 4-54 的输出\n\n```\n.column:after {\n  clear: both;\n}\n```\n\n除了 CSS 提供的伪类之外，Less\
    \ 还提供了额外的伪类，即`extend`伪类，其语法类似于 CSS 伪类。`extend`伪类有助于扩展选择器，如列表 4-56 所示。\n\n***列表\
    \ 4-56***：展示`extend`伪类的示例\n\n```\n.primary{\n    color: #00F;\n    &:hover {\n\
    \        color: #006;\n    }\n}\n.secondary:extend(.primary){\n\n}\n```\n\n列表\
    \ 4-56 通过使用 Less 提供的`extend`伪选择器扩展了`primary`类。此代码的输出如列表 4-57 所示。\n\n***列表 4-57***：列表\
    \ 4-58 的输出\n\n```\n.primary,\n.secondary {\n  color: #00F;\n}\n.primary:hover\
    \ {\n  color: #006;\n}\n```\n\n## 将`&`与 Guards 结合使用\n\nGuards 可以与`&`符号一起使用，以创建条件语句。\n\
    \n这在列表 4-58 中进行了演示，其中父选择器与一个 guard 结合使用，根据作为参数传入的颜色级别来决定使用哪种颜色。\n\n***列表 4-58***：将\
    \ Guard 与父选择器结合使用的示例\n\n```\n.colorGenerator(@level) {\n    & when(@level>5) {\n\
    \        color: #600;\n    }\n    & when (@level<=5){\n        color:#060;\n \
    \   }\n}\np.lead {\n    .colorGenerator(6);\n}\np.secondLead {\n    .colorGenerator(1);\n\
    }\n```\n\n***列表 4-59***：列表 4-58 的输出\n\n```\np.lead {\n  color: #600;\n}\np.secondLead\
    \ {\n  color: #060;\n}\n```\n\n## 分离规则和混入\n\n分离规则集（detached rulesets）是一组规则，包含有效的\
    \ Less 或 CSS 代码，并存储在一个变量中。在 Less 中，这些分离规则集可以作为参数传递给混入，如列表 4-60 所示。\n\n***列表 4-60***：分离规则的示例\n\
    \n```\n@errorStyleSettings: { color: #A00; border: 1px solid #A00 }\n```\n"
- fmt: "## Calling Detached Rulesets\n\nDetached rulesets can be called by adding\
    \ parentheses at the end. When using parentheses, content within the detached\
    \ ruleset gets copied inside the CSS ruleset. This is demonstrated in [Listing\
    \ 4-61](#9781484213483_Ch04.xhtml#FPar62).\n\n[**Listing 4-61**](#9781484213483_Ch04.xhtml#_FPar62).\
    \ Adding a Detached Ruleset Within Another Style Declaration\n\n```\n@errorStyleSettings:\
    \ {\n  color: #A00;\n  border: 1px solid #A00;\n};\n.errorDialog{\n    @errorStyleSettings();\n\
    }\n```\n\nDetached rules within mixins can prevent code redundancy. This is most\
    \ applicable when you need different style rules within different media queries\
    \ or classes nested within media queries.\n\n## Operations on Numbers and Colors\n\
    \nLess provides support for the arithmetic operations like addition, subtraction,\
    \ multiplication, and division. There is also a provision for placing operations\
    \ within parentheses to change the order of execution. These operations can be\
    \ applied on variables, values, and numbers.\n\n**Listing 4-62**. Example Demonstrating\
    \ Arithmetic Operations\n\n```\n.aside{\n    width:percentage(1 - (0.4+0.2))\n\
    }\n```\n\n[**Listing 4-63**](#9781484213483_Ch04.xhtml#_FPar64). Output of [Listing\
    \ 4-64](#9781484213483_Ch04.xhtml#FPar65)\n\n```\n.aside {\n  width: 40%;\n}\n\
    ```\n\nLess also supports color manipulation. These manipulations can be done\
    \ to values and colors with different units. This is demonstrated in [Listing\
    \ 4-64](#9781484213483_Ch04.xhtml#FPar65), where we take an input color and reduce\
    \ its value by 10%.\n\n[**Listing 4-64**](#9781484213483_Ch04.xhtml#_FPar65).\
    \ Example Demonstrating Color Manipulation in Less\n\n```\n@color: yellow;\n.lighten(@color){\n\
    \        color : @color - 10%;\n}\n.contrastContainer{\n    .lighten(@color)\n\
    }\n```\n\n[**Listing 4-65**](#9781484213483_Ch04.xhtml#_FPar66). Output of [Listing\
    \ 4-64](#9781484213483_Ch04.xhtml#FPar64)\n\n```\n.contrastContainer {\n  color:\
    \ #f5f500;\n}\n```\n\n## Merging Properties\n\nProperty merging comes in handy\
    \ with properties that accept comma-separated or space-separated values. Some\
    \ examples are: borders, backgrounds, transitions, and `font-family` properties.\
    \ Properties can be merged by adding a `+` flag for comma-separated lists or a\
    \ `+_` flag for space-separated lists, placed after the property names to be merged.\n\
    \n[Listing 4-66](#9781484213483_Ch04.xhtml#FPar67) shows an example of merging\
    \ comma-separated values. It merges the value of the `font` property. There are\
    \ two mixins—`fontSettings` and `fallbackFonts`—and the value of `fallbackFonts`\
    \ is merged into `fontSettings`.\n\nNote that if you miss out `+`: and write it\
    \ as `:` instead, content from `fallbackFonts` will be added on a new line and\
    \ will override font settings provided by `fontSettings`.\n\n[**Listing 4-66**](#9781484213483_Ch04.xhtml#_FPar67).\
    \ Example Demonstrating Merging Comma-Separated Values\n\n```\n.fallbackFonts(){\n\
    \    font-family+: Helvetica,sans-serif;\n}\n.fontSettings(){\n    font-family+:\
    \ Calibri;\n    .fallbackFonts;\n}\nbody {\n    .fontSettings;\n}\n```\n\n[**Listing\
    \ 4-67**](#9781484213483_Ch04.xhtml#_FPar68). Output of [Listing 4-66](#9781484213483_Ch04.xhtml#FPar66)\n\
    \n```\nbody {\n  font-family: Calibri, Helvetica, sans-serif;\n}\n```\n\n## Looping\
    \ Mixins\n\nIt is possible to have mixins execute recursively. This can be achieved\
    \ by combining them with mixin guards or patterns.\n\nThis is demonstrated in\
    \ [Listing 4-68](#9781484213483_Ch04.xhtml#FPar69), which generates 12 column\
    \ grid using mixin guards and looping.\n\n[**Listing 4-68**](#9781484213483_Ch04.xhtml#_FPar69).\
    \ Example Demonstrating Recursive Behavior of Mixins\n\n```\n.generateGridLayout(12);\n\
    .generateGridLayout(@n, @i: 1) when (@i =< @n) {\n  .col-@{i} {\n    width: (@i\
    \ * 100% / @n);\n  }\n  .generateGridLayout(@n, (@i + 1));\n}\n```\n\n**Listing\
    \ 4-69**. Output of [Listing 4-68](#9781484213483_Ch04.xhtml#FPar68)\n\n```\n\
    .col-1 {\n  width: 8.33333333%;\n}\n.col-2 {\n  width: 16.66666667%;\n}\n.col-3\
    \ {\n  width: 25%;\n}\n.col-4 {\n  width: 33.33333333%;\n}\n.col-5 {\n  width:\
    \ 41.66666667%;\n}\n.col-6 {\n  width: 50%;\n}\n.col-7 {\n  width: 58.33333333%;\n\
    }\n.col-8 {\n  width: 66.66666667%;\n}\n.col-9 {\n  width: 75%;\n}\n.col-10 {\n\
    \  width: 83.33333333%;\n}\n.col-11 {\n  width: 91.66666667%;\n}\n.col-12 {\n\
    \  width: 100%;\n}\n```\n\n## Functions\n\nLess provides many in-built functions.\
    \ With these in-built functions, you can manipulate the values as needed. These\
    \ can be used within guard expressions. The complete list of functions is at [http://lesscss.org/functions/](http://lesscss.org/functions/).\n\
    \nWe won’t be covering all the functions available, but rather cover the functions\
    \ from different categories. Functions can be categorized on the basis of their\
    \ input and output. There are mainly the following types of functions:\n\n* Mathematical\
    \ functions\n* Color functions\n* List functions\n* String functions\n* Type functions\n\
    \nThe Less functions support native JavaScript functions, since Less is written\
    \ in JavaScript. Presently, it is possible to evaluate JavaScript expressions\
    \ inside the Less code; however, this might be removed in future versions.\n\n\
    ### List Functions\n\nFunctions in this category can be used to iterate a CSV\
    \ list. This category contains two main functions—`extract()` and `length()`.\
    \ `extract()` as the name suggests is used to get the values from CSV and `length()`\
    \ is used to check their length.\n\nThe `extract` function is demonstrated in\
    \ [Listing 4-70](#9781484213483_Ch04.xhtml#FPar71), which generates classes for\
    \ social icons using the `extract()` function.\n\n[**Listing 4-70**](#9781484213483_Ch04.xhtml#_FPar71).\
    \ Example Demonstrating the Use of List Functions\n\n```\n@socials: \"twitter\"\
    ,\"facebook\",\"gplus\";\n.generateSocialIcons(@i) when (@i > 0) {\n    .generateSocialIcons((@i\
    \ - 1));\n    @socialName: e(extract(@socials, @i));\n    li.@{socialName}{\n\
    \        width:16px;height:16px;\n        background-image:url(\"@{socialName}.png\"\
    );\n    }\n}\n.generateSocialIcons(length(@socials));\n```\n\nThis example extracts\
    \ the values from the list named `@socials` and uses that value to generate specific\
    \ social classes. The output is shown in [Listing 4-71](#9781484213483_Ch04.xhtml#FPar72).\n\
    \n[**Listing 4-71**](#9781484213483_Ch04.xhtml#_FPar72). Output of Listing 4-70\n\
    \n```\nli.twitter {\n  width: 16px;\n  height: 16px;\n  background-image: url(\"\
    twitter.png\");\n}\nli.facebook {\n  width: 16px;\n  height: 16px;\n  background-image:\
    \ url(\"facebook.png\");\n}\nli.gplus {\n  width: 16px;\n  height: 16px;\n  background-image:\
    \ url(\"gplus.png\");\n}\n```\n\n### Color Functions\n\nThe color functions provided\
    \ by Less deal with various kinds of operations like color definition, operations,\
    \ blending, and channel manipulation.\n\nColors were declared in RGB format in\
    \ CSS2. An RGB is made of three channels: red, green, and blue. With the arrival\
    \ of CSS3, there have been new color definitions, such as HSL and HSV, which are\
    \ similar to RGB values. Less provides support for various color definition methods\
    \ and channel manipulation methods. These color declaration methods are demonstrated\
    \ in [Listing 4-72](#9781484213483_Ch04.xhtml#FPar73).\n\n[**Listing 4-72**](#9781484213483_Ch04.xhtml#_FPar73).\
    \ Example Demonstrating Various Color Declaration Techniques\n\n```\n.colorDefinition\
    \ {\n    color: rgb(255,133,75);\n    color: rgba(255,133,75,.4);\n    color:\
    \ hsl(76, 80%, 20%);\n    color: red;\n}\n```\n\nIn addition to color declaration\
    \ functions, Less provides two more methods—`darken()` and `lighten()`—that can\
    \ be used to compute a dark or light variant of the input color and intensity\
    \ provided. This is demonstrated in [Listing 4-73](#9781484213483_Ch04.xhtml#FPar74).\n\
    \n[**Listing 4-73**](#9781484213483_Ch04.xhtml#_FPar74). Example Demonstrating\
    \ the `lighten` and `darken` Functions\n\n```\n@primaryColor: #00A;\n@secondaryColor:\
    \ #0A0;\n.heading{\n    color:lighten(@primaryColor,20%);\n}\n.impNotice{\n  \
    \  color:darken(@primaryColor,35%);\n}\n.successfulEvent{\n    color:lighten(@secondaryColor,10%);\n\
    }\n```"
  raw: 'Detached rules can be called by adding parentheses at the end. When using
    parentheses, content within the detached ruleset gets copied inside the CSS ruleset.
    This is demonstrated in [Listing 4-61](#9781484213483_Ch04.xhtml#FPar62).


    [***Listing 4-61***](#9781484213483_Ch04.xhtml#_FPar62). Adding a Detached Ruleset
    Within Another Style Declaration


    ```

    @errorStyleSettings: { color: #A00; border: 1px solid #A00; };

    .errorDialog{

        @errorStyleSettings();

    }

    ```


    Detached rules within mixins can prevent code redundancy. This is most applicable
    when you need different style rules within different media queries or classes
    nested within media queries.


    Operations on Numbers and Colors


    Less provides support for the arithmetic operations like addition, subtraction,
    multiplication, and division. There is also a provision for placing operations
    within parentheses to change the order of execution. These operations can be applied
    on variables, values, and numbers.


    ***Listing 4-62***. Example Demonstrating Arithematic Operations


    ```

    .aside{

        width:percentage(1 - (0.4+0.2))

    }

    ```


    [***Listing 4-63***](#9781484213483_Ch04.xhtml#_FPar64). Output of [Listing 4-64](#9781484213483_Ch04.xhtml#FPar65)


    ```

    .aside {

      width: 40%;

    }

    ```


    Less also supports color manipulation. These manipulations can be done to values
    and colors with different units. This is demonstrated in [Listing 4-64](#9781484213483_Ch04.xhtml#FPar65),
    where we take a input color and reduce its value by 10%.


    [***Listing 4-64***](#9781484213483_Ch04.xhtml#_FPar65). Example Demonstrating
    Color Manipulation in Less


    ```

    @color: yellow;

    .lighten(@color){

            color : @color - 10%;

    }

    .contrastContainer{

        .lighten(@color)

    }

    ```


    [***Listing 4-65***](#9781484213483_Ch04.xhtml#_FPar66). Output of [Listing 4-64](#9781484213483_Ch04.xhtml#FPar64)


    ```

    .contrastContainer {

      color: #f5f500;

    }

    ```


    Merging Properties


    Property merging comes handy with properties that accept comma-separated or space-separated
    values. Some examples are: borders, backgrounds, transitions, and font-family
    properties. Properties can be merged by adding a + flag for comma-separated lists
    or a +_ flag for space-separated lists, placed after the property names to be
    merged.


    [Listing 4-66](#9781484213483_Ch04.xhtml#FPar67) shows an example of merging comma-separated
    values. It merges the value of the font property. There are two mixins—fontSettings
    and fallbackFonts—and the value of fallbackFonts is merged into fontSettings.


    Note that if you miss out +: and write it as : instead, content from fallbackFonts
    will be added on a new line and will override font settings provided by fontSettings.


    [***Listing 4-66***](#9781484213483_Ch04.xhtml#_FPar67). Example Demonstrating
    Merging Comma-Separated Values


    ```

    .fallbackFonts(){

        font-family+: Helvetica,sans-serif;

    }

    .fontSettings(){

        font-family+: Calibri;

        .fallbackFonts;

    }

    body {

        .fontSettings;

    }

    ```


    [***Listing 4-67***](#9781484213483_Ch04.xhtml#_FPar68). Output of [Listing 4-66](#9781484213483_Ch04.xhtml#FPar66)


    ```

    body {

      font-family: Calibri, Helvetica, sans-serif;

    }

    ```


    Looping Mixins


    It is possible to have mixins execute recursively. This can be achieved by combining
    them with mixin guards or patterns.


    This is demonstrated in [Listing 4-68](#9781484213483_Ch04.xhtml#FPar69), which
    generates 12 column grid using mixin guards and looping.


    [***Listing 4-68***](#9781484213483_Ch04.xhtml#_FPar69). Example Demonstrating
    Recurrsive Behavior of Mixins


    ```

    .generateGridLayout(12);

    .generateGridLayout(@n, @i: 1) when (@i =< @n) {

      .col-@{i} {

        width: (@i * 100% / @n);

      }

      .generateGridLayout(@n, (@i + 1));

    }

    ```


    ***Listing 4-69***. Output of [Listing 4-68](#9781484213483_Ch04.xhtml#FPar68)


    ```

    .col-1 {

      width: 8.33333333%;

    }

    .col-2 {

      width: 16.66666667%;

    }

    .col-3 {

      width: 25%;

    }

    .col-4 {

      width: 33.33333333%;

    }

    .col-5 {

      width: 41.66666667%;

    }

    .col-6 {

      width: 50%;

    }

    .col-7 {

      width: 58.33333333%;

    }

    .col-8 {

      width: 66.66666667%;

    }

    .col-9 {

      width: 75%;

    }

    .col-10 {

      width: 83.33333333%;

    }

    .col-11 {

      width: 91.66666667%;

    }

    .col-12 {

      width: 100%;

    }

    ```


    Functions


    Less provides many in-built functions. With these in-built functions, you can
    manipulate the values as needed. These can be used within guard expressions. The
    complete list of functions is at [http://lesscss.org/functions/](http://lesscss.org/functions/).


    We won’t be covering all the functions available, but rather cover the functions
    from different categories. Functions can be categorized on the basis of their
    input and output. There are mainly the following types of functions:


    *   Mathematical functions

    *   Color functions

    *   List functions

    *   String functions

    *   Type functions


    The Less functions support native JavaScript functions, since Less is written
    in JavaScript. Presently, it is possible to evaluate JavaScript expressions inside
    the Less code; however, this might be removed in future versions.


    List Functions


    Functions in this category can be used to iterate a CSV list. This category contains
    two main functions—extract() and length(). extract() as the name suggests is used
    to get the values from CSV and length() is used to check their length.


    The extract function is demonstrated in [Listing 4-70](#9781484213483_Ch04.xhtml#FPar71),
    which generates classes for social icons using the extract() function.


    [***Listing 4-70***](#9781484213483_Ch04.xhtml#_FPar71). Example Demonstrating
    the Use of List Functions


    ```

    @socials: "twitter","facebook","gplus";

    .generateSocialIcons(@i) when (@i > 0) {

        .generateSocialIcons((@i - 1));

        @socialName: e(extract(@socials, @i));

        li.@{socialName}{

            width:16px;height:16px;

            background-image:url("@{socialName}.png");

        }

    }

    .generateSocialIcons(length(@socials));

    ```


    This example extracts the values from the list named @socials and uses that value
    to generate specific social classes. The output is shown in [Listing 4-71](#9781484213483_Ch04.xhtml#FPar72).


    [***Listing 4-71***](#9781484213483_Ch04.xhtml#_FPar72). Output of Listing 4-70


    ```

    li.twitter {

      width: 16px;

      height: 16px;

      background-image: url("twitter.png");

    }

    li.facebook {

      width: 16px;

      height: 16px;

      background-image: url("facebook.png");

    }

    li.gplus {

      width: 16px;

      height: 16px;

      background-image: url("gplus.png");

    }

    ```


    Color Functions


    The color functions provided by Less deal with various kind of operations like
    color definition, operations, blending, and channel manipulation.


    Colors were declared in RGB format in CSS2. An RGB is made of three channels:
    red, green, and blue. With the arrival of CSS3, there have been new color definitions,
    such as HSL and HSV, which are similar to RGB values. Less provides supports for
    various color definition methods and channel manipulation methods. These color
    declaration methods are demonstrated in [Listing 4-72](#9781484213483_Ch04.xhtml#FPar73).


    [***Listing 4-72***](#9781484213483_Ch04.xhtml#_FPar73). Example Demonstrating
    Various Color Declaration Techniques


    ```

    .colorDefinition {

        color: rgb(255,133,75);

        color: rgba(255,133,75,.4);

        color: hsl(76, 80%, 20%);

        color: red;

    }

    ```


    In addition to color declaration functions, Less provides two more methods—darken()
    and lighten()—that can be used to compute a dark or light variant of the input
    color and intensity provided. This is demonstrated in [Listing 4-73](#9781484213483_Ch04.xhtml#FPar74).


    [***Listing 4-73***](#9781484213483_Ch04.xhtml#_FPar74). Example Demonstrating
    the lighten and darken Functions


    ```

    @primaryColor: #00A;

    @secondaryColor: #0A0;

    .heading{

        color:lighten(@primaryColor,20%);

    }

    .impNotice{

        color:darken(@primaryColor,35%);

    }

    .successfulEvent{

        color:lighten(@secondaryColor,10%);

    }

    ```'
  trans: "\n## 调用分离的规则集\n\n可以通过在末尾添加括号来调用分离的规则集。使用括号时，分离规则集中的内容会被复制到 CSS 规则集内部。这在清单\
    \ 4-61 中进行了演示。\n\n**清单 4-61**. 在另一个样式声明中添加分离的规则集\n\n```\n@errorStyleSettings:\
    \ {\n  color: #A00;\n  border: 1px solid #A00;\n};\n.errorDialog{\n    @errorStyleSettings();\n\
    }\n```\n\n混入中的分离规则可以防止代码冗余。当你需要在不同的媒体查询或媒体查询内嵌套的类中使用不同的样式规则时，这种方法最为适用。\n\n## 数字与颜色的运算\n\
    \nLess 支持加、减、乘、除等算术运算。此外，还可以通过在运算表达式周围添加括号来改变执行顺序。这些运算可应用于变量、值和数字。\n\n**清单 4-62**.\
    \ 演示算术运算的示例\n\n```\n.aside{\n    width:percentage(1 - (0.4+0.2))\n}\n```\n\n**清单\
    \ 4-63**. 清单 4-64 的输出\n\n```\n.aside {\n  width: 40%;\n}\n```\n\nLess 也支持颜色操作。这些操作可以对不同单位的值和颜色进行。这在清单\
    \ 4-64 中进行了演示，我们取一个输入颜色并将其值减少 10%。\n\n**清单 4-64**. 在 Less 中演示颜色操作的示例\n\n```\n\
    @color: yellow;\n.lighten(@color){\n        color : @color - 10%;\n}\n.contrastContainer{\n\
    \    .lighten(@color)\n}\n```\n\n**清单 4-65**. 清单 4-64 的输出\n\n```\n.contrastContainer\
    \ {\n  color: #f5f500;\n}\n```\n\n## 合并属性\n\n属性合并对于接受逗号分隔或空格分隔值的属性非常有用。例如：边框、背景、过渡和`font-family`属性。可以通过在要合并的属性名称后添加`+`标志（用于逗号分隔列表）或`+_`标志（用于空格分隔列表）来合并属性。\n\
    \n清单 4-66 展示了一个合并逗号分隔值的示例。它合并了`font`属性的值。这里有两个混入——`fontSettings`和`fallbackFonts`——并且`fallbackFonts`的值被合并到`fontSettings`中。\n\
    \n请注意，如果你漏掉了`+`: 并将其写成`:`，那么来自`fallbackFonts`的内容将被添加在新的一行，并覆盖`fontSettings`提供的字体设置。\n\
    \n**清单 4-66**. 演示合并逗号分隔值的示例\n\n```\n.fallbackFonts(){\n    font-family+: Helvetica,sans-serif;\n\
    }\n.fontSettings(){\n    font-family+: Calibri;\n    .fallbackFonts;\n}\nbody\
    \ {\n    .fontSettings;\n}\n```\n\n**清单 4-67**. 清单 4-66 的输出\n\n```\nbody {\n \
    \ font-family: Calibri, Helvetica, sans-serif;\n}\n```\n\n## 循环混入\n\n可以让混入递归执行。这可以通过将它们与混入守卫或模式结合来实现。\n\
    \n这在清单 4-68 中进行了演示，该清单使用混入守卫和循环生成了 12 列网格。\n\n**清单 4-68**. 演示混入递归行为的示例\n\n```\n\
    .generateGridLayout(12);\n.generateGridLayout(@n, @i: 1) when (@i =< @n) {\n \
    \ .col-@{i} {\n    width: (@i * 100% / @n);\n  }\n  .generateGridLayout(@n, (@i\
    \ + 1));\n}\n```\n\n**清单 4-69**. 清单 4-68 的输出\n\n```\n.col-1 {\n  width: 8.33333333%;\n\
    }\n.col-2 {\n  width: 16.66666667%;\n}\n.col-3 {\n  width: 25%;\n}\n.col-4 {\n\
    \  width: 33.33333333%;\n}\n.col-5 {\n  width: 41.66666667%;\n}\n.col-6 {\n  width:\
    \ 50%;\n}\n.col-7 {\n  width: 58.33333333%;\n}\n.col-8 {\n  width: 66.66666667%;\n\
    }\n.col-9 {\n  width: 75%;\n}\n.col-10 {\n  width: 83.33333333%;\n}\n.col-11 {\n\
    \  width: 91.66666667%;\n}\n.col-12 {\n  width: 100%;\n}\n```\n\n## 函数\n\nLess\
    \ 提供了许多内置函数。通过这些内置函数，你可以根据需要操作值。这些函数可以在守卫表达式中使用。完整的函数列表请访问 [`lesscss.org/functions/`](http://lesscss.org/functions/)。\n\
    \n我们不会涵盖所有可用的函数，而是介绍来自不同类别的函数。函数可以根据其输入和输出进行分类。主要有以下几种类型的函数：\n\n* 数学函数\n* 颜色函数\n\
    * 列表函数\n* 字符串函数\n* 类型函数\n\nLess 函数支持原生 JavaScript 函数，因为 Less 是用 JavaScript 编写的。目前，可以在\
    \ Less 代码中评估 JavaScript 表达式；不过，这在未来的版本中可能会被移除。\n\n### 列表函数\n\n此类别中的函数可用于迭代 CSV\
    \ 列表。此类别包含两个主要函数——`extract()`和`length()`。顾名思义，`extract()`用于从 CSV 中获取值，`length()`用于检查它们的长度。\n\
    \n`extract` 函数在清单 4-70 中进行了演示，该示例使用`extract()`函数为社交媒体图标生成类。\n\n**清单 4-70**. 演示列表函数用法的示例\n\
    \n```\n@socials: \"twitter\",\"facebook\",\"gplus\";\n.generateSocialIcons(@i)\
    \ when (@i > 0) {\n    .generateSocialIcons((@i - 1));\n    @socialName: e(extract(@socials,\
    \ @i));\n    li.@{socialName}{\n        width:16px;height:16px;\n        background-image:url(\"\
    @{socialName}.png\");\n    }\n}\n.generateSocialIcons(length(@socials));\n```\n\
    \n此示例从名为`@socials`的列表中提取值，并使用该值生成特定的社交媒体类。输出如清单 4-71 所示。\n\n**清单 4-71**. 清单 4-70\
    \ 的输出\n\n```\nli.twitter {\n  width: 16px;\n  height: 16px;\n  background-image:\
    \ url(\"twitter.png\");\n}\nli.facebook {\n  width: 16px;\n  height: 16px;\n \
    \ background-image: url(\"facebook.png\");\n}\nli.gplus {\n  width: 16px;\n  height:\
    \ 16px;\n  background-image: url(\"gplus.png\");\n}\n```\n\n### 颜色函数\n\nLess 提供的颜色函数处理各种操作，如颜色定义、运算、混合和通道操作。\n\
    \n在 CSS2 中，颜色以 RGB 格式声明。RGB 由三个通道组成：红色、绿色和蓝色。随着 CSS3 的出现，出现了新的颜色定义，例如 HSL 和 HSV，它们类似于\
    \ RGB 值。Less 支持各种颜色定义方法和通道操作方法。这些颜色声明方法在清单 4-72 中进行了演示。\n\n**清单 4-72**. 演示各种颜色声明技术的示例\n\
    \n```\n.colorDefinition {\n    color: rgb(255,133,75);\n    color: rgba(255,133,75,.4);\n\
    \    color: hsl(76, 80%, 20%);\n    color: red;\n}\n```\n\n除了颜色声明函数之外，Less 还提供了两种方法——`darken()`和`lighten()`——可用于计算输入颜色和强度提供的深色或浅色变体。这在清单\
    \ 4-73 中进行了演示。\n\n**清单 4-73**. 演示`lighten`和`darken`函数的示例\n\n```\n@primaryColor:\
    \ #00A;\n@secondaryColor: #0A0;\n.heading{\n    color:lighten(@primaryColor,20%);\n\
    }\n.impNotice{\n    color:darken(@primaryColor,35%);\n}\n.successfulEvent{\n \
    \   color:lighten(@secondaryColor,10%);\n}\n```\n"
- fmt: "### 颜色函数\n\n[***Listing 4-74***](#9781484213483_Ch04.xhtml#_FPar75). *Listing\
    \ 4-73* 的输出结果\n\n```\n.heading {\n  color: #1111ff;\n}\n.impNotice {\n  color:\
    \ #000000;\n}\n.successfulEvent {\n  color: #00dd00;\n}\n```\n\n在设计中使用高对比度是一个重要因素。高对比度不仅影响视障人士设计的可用性，对视力正常的人也有好处。然而，计算正确的对比度值并不容易。Less\
    \ 提供了`contrast()`函数，该函数计算一个易于识别的颜色。\n\n`contrast()`函数最多可以接受四个参数，其中只有第一个参数是必需的。\n\
    \n*   将需要对比度的颜色定义为首个参数。\n*   第二个和第三个参数定义了深色和浅色。\n*   最后一个可输入参数是阈值。阈值的默认值是43%。\n\
    \n高于阈值颜色的颜色被视为浅色，`contrast()`函数返回第二个参数中定义的深色。\n\n其他提供的一些函数包括：\n\n*   `saturate()`\n\
    *   `desaturate()`\n*   `fadein()`\n*   `fadeout()`\n*   `fade()`\n*   `spin()`\n\
    *   `mix()`\n*   `grayscale()`\n\n你可以通过应用颜色混合函数来生成新颜色，这些函数对提供的两种颜色输入执行基本操作，例如减法。\n\
    \n一些颜色混合函数包括：\n\n*   `multiply()`\n*   `screen()`\n*   `average()`\n*   `overlay()`\n\
    *   `hardlight()`\n*   `softlight()`\n*   `difference()`\n*   `exclusion()`\n\
    *   `negation()`\n\n让我们来看一些这些混合函数。\n\n*   `multiply()` 对两种颜色执行乘法运算。\n*   `screen()`\
    \ 得出输入颜色中最亮的颜色。\n*   `overlay()` 是`screen()`和`multiply()`函数的组合，结果颜色的亮度或暗度取决于第一个输入颜色的值。\n\
    *   `softlight()` 类似于`overlay()`，但它避免在其结果中出现纯黑色或纯白色。\n*   `hardlight()` 与`overlay()`完全相反，结果颜色的亮度或暗度由第二个输入颜色的值决定。\n\
    *   `difference()` 按照每个通道从第一种颜色中减去第二种颜色。如果任何特定通道遇到负值，它将会被反转。\n*   `average()`\
    \ 按照每个通道计算两个数字的平均值。\n\n所有这些函数已在 [Listing 4-75](#9781484213483_Ch04.xhtml#FPar76)\
    \ 中演示。\n\n[***Listing 4-75***](#9781484213483_Ch04.xhtml#_FPar76). 展示各种颜色混合函数的示例\n\
    \n```\n@primaryColor: #00A;\n@secondaryColor: #0A0;\n@tertiaryColor: #AAA;\n.heading{\n\
    \    color:multiply(@primaryColor,@tertiaryColor);\n    color:screen(@primaryColor,@secondaryColor);\n\
    \    color:overlay(@primaryColor,@tertiaryColor);\n    color:softlight(@secondaryColor,@tertiaryColor);\n\
    \    color:hardlight(@primaryColor,@tertiaryColor);\n    color:difference(@primaryColor,@secondaryColor);\n\
    \    color:average(@primaryColor,@secondaryColor);\n}\n```\n\n***Listing 4-76***.\
    \ [Listing 4-75](#9781484213483_Ch04.xhtml#FPar75) 的输出结果\n\n```\n.heading {\n\
    \  color: #000071;\n  color: #0000c6;\n  color: #00b700;\n  color: #5555c6;\n\
    \  color: #00aaaa;\n  color: #005555;\n}\n```\n\n### 类型函数\n\nLess 提供了类型函数来验证输入值的类型。如果输入类型与函数的测试匹配，这些函数返回`true`。\n\
    \n以下是一些类型函数：\n\n*   `isnumber()`\n*   `isstring()`\n*   `iscolor()`\n*   `iskeyword()`\n\
    *   `isurl()`\n*   `ispixel()`\n*   `isem()`\n*   `ispercentage()`\n*   `isunit()`\n\
    \n如果输入值是数字，`isnumber()`返回`true`；否则返回`false`。\n\n***Listing 4-77***. 对`isnumber`返回`true`或`false`的示例值\n\
    \n```\nisnumber(#fff);     // false\nisnumber(\"NormalText\"); // false\nisnumber(1234);\
    \     // true\nisnumber(56px);     // true\n```\n\n如果输入值是字符串，`isstring()`返回`true`；否则返回`false`。\n\
    \n***Listing 4-78***. 对`isstring`返回`true`或`false`的示例值\n\n```\nisstring(red); \
    \    // false\nisstring(\"NormalText\"); // true\n```\n\n如果输入值是颜色，`iscolor()`返回`true`；否则返回`false`。\n\
    \n***Listing 4-79***. 对`iscolor`返回`true`或`false`的示例值\n\n```\niscolor(#fff);  \
    \   // true\niscolor(\"NormalText\"); // false\n```\n\n如果输入值是URL，`isurl()`返回`true`；否则返回`false`。\n\
    \n***Listing 4-80***. 对`isurl`返回`true`或`false`的示例值\n\n```\nisurl(\"NormalText\"\
    ); // false\nisurl(url(...)); // true\n```\n\n如果输入值是像素单位数字，`ispixel()`返回`true`；否则返回`false`。\n\
    \n***Listing 4-81***. 对`ispixel`返回`true`或`false`的示例值\n\n```\nispixel(1234);  \
    \   // false\nispixel(56px);     // true\n```\n\n如果输入值是`em`单位数字，`isem()`返回`true`；否则返回`false`。\n\
    \n***Listing 4-82***. 对`isem`返回`true`或`false`的示例值\n\n```\nisem(56px);     // false\n\
    isem(7.8em);    // true\n```\n\n如果输入值是百分比值，`ispercentage()`返回`true`；否则返回`false`。\n\
    \n***Listing 4-83***. 对`ispercentage`返回`true`或`false`的示例值\n\n```\nispercentage(56px);\
    \     // false\nispercentage(7.8%);     // true\n```\n\n如果输入值的单位与第二个参数中指定的单位相同，`isunit()`返回`true`；否则返回`false`。\n\
    \n***Listing 4-84***. 对`isunit`返回`true`或`false`的示例值\n\n```\nisunit(11px, px);\
    \  // true\nisunit(2.2%, px);  // false\n```\n\n### 数学函数\n\nLess 提供了几个数学函数来对值执行各种数学运算。在本节中，我们将介绍其中一些函数。\n\
    \n*   `ceil()` 类似于JavaScript中的版本，它会将输入数字舍入为最高的整数值。例如，`ceil(2.4)`返回`3`。\n*   `floor()`\
    \ 将输入数字舍入为最低的整数值。例如，`floor(2.4)`返回`2`。\n*   `percentage()` 将输入数字转换为百分比值。例如，`percentage(0.5)`返回`50%`。\n\
    *   `round()` 对数字进行四舍五入。它接受两个参数。第一个参数是要舍入的数字。第二个参数是要舍入到的小数位数。例如，`round(1.67)`返回`2`，而`round(1.67,1)`将返回`1.7`。\n\
    *   `sqrt()` 计算输入值的平方根。另请注意，在执行此计算时，该函数会保留原始输入的单位。例如，`sqrt(25cm)`返回`5cm`。\n* \
    \  `pow()` 返回第一个参数的第二个参数次幂的值。例如，`pow(2,2)`返回`4`。\n*   `mod()` 计算输入值的模数。例如，`mod(11,6)`返回`5`。\n\
    *   `min()` 返回输入值中的最小值。例如，`min(2,1)`将返回`1`。\n*   `max()` 返回输入值中的最大值。例如，`max(2,1)`将返回`2`。\n\
    \n### 字符串函数\n\nLess 提供了字符串函数来操作字符串。在本节中，我们将研究这些函数。\n\n*   `escape()` 将对字符串中发现的特殊字符进行URL编码。此函数不会对以下字符集进行URL编码：`,`,\
    \ `/`, `?`, `@`, `&`, `+`, `'`, `~`, `!`, 和`$`。例如，`escape(x=10)`返回`x%3D10`。\n\
    *   `e()` 也称为CSS转义。它主要从输入字符串中移除引号，并返回不带引号的字符串，可用于CSS表达式中。我们在 [Listing 4-70](#9781484213483_Ch04.xhtml#FPar71)\
    \ 中使用了此函数来提取社交图标的名称并移除了其引号。\n*   `replace()` 用于替换给定输入中的字符串。此函数接受四个参数：\n    * \
    \  输入字符串，这是执行搜索和替换的目标。\n    *   要被替换的字符串/模式。\n    *   替换字符串，即用于替换搜索模式的字符串。\n \
    \   *   任何可选的正则表达式标志。\n\n例如，`replace(\"Is this planet?\", \"planet\\?\", \"earth\"\
    );` 会将单词`planet`替换为`earth`。\n\n### 杂项函数"
  raw: "[***Listing 4-74***](#9781484213483_Ch04.xhtml#_FPar75). Output of Listing\
    \ 4-73\n\n```\n.heading {\n  color: #1111ff;\n}\n.impNotice {\n  color: #000000;\n\
    }\n.successfulEvent {\n  color: #00dd00;\n}\n```\n\nHaving high contrast in your\
    \ design is an important factor. High contrast not only impacts the usability\
    \ of design for visually impaired people, but also benefits people with normal\
    \ vision. However, calculating the correct contrast value is not easy. Less provides\
    \ the contrast() function, which computes a color that is easily be seen.\n\n\
    The contrast() function can take up to four parameters, from which only the first\
    \ parameter is required.\n\n*   You define the color whose contrast is required\
    \ as the first parameter.\n*   The second and third parameters define the dark\
    \ and light color.\n*   The last parameter that can be inputted is threshold.\
    \ The default value of threshold is 43%.\n\nColors above the threshold value are\
    \ treated as light, and contrast() returns the dark color defined in the second\
    \ parameter.\n\nSome other functions provided include:\n\n*   saturate()\n*  \
    \ desaturate()\n*   fadein()\n*   fadeout()\n*   fade()\n*   spin()\n*   mix()\n\
    *   grayscale()\n\nYou can generate a new color by applying color-blending functions\
    \ that perform basic operations like subtraction on the two colors provided as\
    \ input.\n\nSome of the color blending functions are:\n\n*   multiply()\n*   screen()\n\
    *   average()\n*   overlay()\n*   hardlight()\n*   softlight()\n*   difference()\n\
    *   exclusion()\n*   negation()\n\nLet’s look at some of these blending functions.\n\
    \n*   multiply() performs multiplication between two colors.\n*   screen() results\
    \ in the brightest color among the input color.\n*   overlay() is the screen()\
    \ and multiply() functions combined, where the lightness or darkness of the resultant\
    \ colors depends on the value of first input color.\n*   softlight() is similar\
    \ to overlay(), but it avoids the pure blacks or pure whites in its results.\n\
    *   hardlight() is exactly the opposite of overlay(), whereby resultant colors\
    \ lightness or darkness is determined by the value of second input color.\n* \
    \  difference() subtracts the second color from first color on a per channel basis.\
    \ If a negative value is encountered for any specific channel, it will be inverted.\n\
    *   average() computes the average of two numbers on a per channel basis.\n\n\
    All these functions have been demonstrated in [Listing 4-75](#9781484213483_Ch04.xhtml#FPar76).\n\
    \n[***Listing 4-75***](#9781484213483_Ch04.xhtml#_FPar76). Example Demonstrating\
    \ the Various Color Blending Functions\n\n```\n@primaryColor: #00A;\n@secondaryColor:\
    \ #0A0;\n@tertiaryColor: #AAA;\n.heading{\n    color:multiply(@primaryColor,@tertiaryColor);\n\
        color:screen(@primaryColor,@secondaryColor);\n    color:overlay(@primaryColor,@tertiaryColor);\n\
        color:softlight(@secondaryColor,@tertiaryColor);\n    color:hardlight(@primaryColor,@tertiaryColor);\n\
        color:difference(@primaryColor,@secondaryColor);\n    color:average(@primaryColor,@secondaryColor);\n\
    }\n```\n\n***Listing 4-76***. Output of [Listing 4-75](#9781484213483_Ch04.xhtml#FPar75)\n\
    \n```\n.heading {\n  color: #000071;\n  color: #0000c6;\n  color: #00b700;\n  color:\
    \ #5555c6;\n  color: #00aaaa;\n  color: #005555;\n}\n```\n\nType Functions\n\n\
    Less provides type functions to verify the type of the input value. These functions\
    \ return true if the type of input matches the function’s test.\n\nHere are the\
    \ following type functions:\n\n*   isnumber()\n*   isstring(),\n*   iscolor()\n\
    *   iskeyword()\n*   isurl()\n*   ispixel()\n*   isem()\n*   ispercentage()\n\
    *   isunit()\n\nisnumber()returns true if the inputted value is a number; otherwise,\
    \ it returns false.\n\n***Listing 4-77***. Example Values That Return True or\
    \ False for isnumber\n\n```\nisnumber(#fff);     // false\nisnumber(\"NormalText\"\
    ); // false\nisnumber(1234);     // true\nisnumber(56px);     // true\n```\n\n\
    isstring()returns true if the inputted value is a string; otherwise, it returns\
    \ false.\n\n***Listing 4-78***. Example Values That Return True or False for issttring\n\
    \n```\nisstring(red);     // false\nisstring(\"NormalText\"); // true\n```\n\n\
    iscolor() returns true if the inputted value is a color; otherwise it returns\
    \ false.\n\n***Listing 4-79***. Example Values That Return True or False for iscolor\n\
    \n```\niscolor(#fff);     // true\niscolor(\"NormalText\"); // false\n```\n\n\
    isurl() returns true if the inputted value is an URL; otherwise, it returns false.\n\
    \n***Listing 4-80***. Example Values That Return True or False for isurl\n\n```\n\
    isurl(\"NormalText\"); // false\nisurl(url(...)); // true\n```\n\nispixel() returns\
    \ true if the inputted value is a number in pixel units; otherwise, it returns\
    \ false.\n\n***Listing 4-81***. Example Values That Return True or False for ispixel\n\
    \n```\nispixel(1234);     // false\nispixel(56px);     // true\n```\n\nisem()\
    \ returns true if the inputted value is a number in em units; otherwise, it returns\
    \ false.\n\n***Listing 4-82***. Example Values That Return True or False for isem\n\
    \n```\nisem(56px);     // false\nisem(7.8em);    // true\n```\n\nispercentage()\
    \ returns true if the inputted value is a percentage value; otherwise, it returns\
    \ false.\n\n***Listing 4-83***. Example Values That Return True or False for ispercentage\n\
    \n```\nispercentage(56px);     // false\nispercentage(7.8%);     // true\n```\n\
    \nisunit() returns true if the inputted value is of same unit as specified in\
    \ the second parameter; otherwise, it returns false.\n\n***Listing 4-84***. Example\
    \ Values That Return True or False for isunit\n\n```\nisunit(11px, px);  // true\n\
    isunit(2.2%, px);  // false\n```\n\nMathematical Functions\n\nLess provides several\
    \ mathematical functions to perform various mathematical operations on the values.\
    \ In this section, we will look at some of these functions.\n\n*   ceil() is similar\
    \ to the version in JavaScript and will round the input number to its highest\
    \ integer value. For example, ceil(2.4) returns 3.\n*   floor() rounds the input\
    \ number to its lowest integer value. For example, floor(2.4) returns 2.\n*  \
    \ percentage() converts the input number to a percentage value. For example, percentage(0.5)\
    \ returns 50%.\n*   round() rounds the number. It accepts two parameters. The\
    \ first parameter is the number to be rounded. The second parameter is the decimal\
    \ place to round to. For example, round(1.67) returns 2 while round(1.67,1) will\
    \ result in 1.7.\n*   sqrt() calculates the square root of the input values. Also\
    \ note that while performing this calculation, the functions retains the unit\
    \ of the original input. For example, sqrt(25cm) returns 5cm.\n*   pow() returns\
    \ the value of the first raised to the power of the second argument. For example,\
    \ pow(2,2) returns 4.\n*   mod() calculates the modules of input values. For example,\
    \ mod(11,6) returns 5.\n*   min()returns the lowest number among the input values.\
    \ For example, min(2,1) will return 1.\n*   max() returns the highest number among\
    \ the input values. For example, max(2,1) will return 2.\n\nString Functions\n\
    \nLess provides string functions to manipulate strings. In this section, we will\
    \ look into these functions.\n\n*   escape() will URL-encode the special characters\
    \ found in the string. This function will not URL-encode the following set of\
    \ characters: ,, /, ?, @, &, +, ', ~, !, and $. For example, escape(x=10) returns\
    \ x%3D10.\n*   e() is also known as CSS escaping. It mainly removes the quotes\
    \ from the input string and returns the string without quotes, which can be used\
    \ in CSS expression. We used this function in [Listing 4-70](#9781484213483_Ch04.xhtml#FPar71)\
    \ for extracting the name of social icons and removed quotes from it.\n*   replace()\
    \ is used to replace a string within the given input. This function accepts four\
    \ parameters:\n    *   Input string, which is the target on which search and replace\
    \ are to be performed\n    *   String/pattern to be replaced\n    *   Replacement\
    \ string, which is the string to replace the search pattern with\n    *   Any\
    \ optional regular expression flags\n\nFor example, replace(\"Is this planet?\"\
    , \"planet\\?\", \"earth\"); will replace the word planet with earth.\n\nMiscellaneous\
    \ Functions"
  trans: "\n### 颜色函数\n\n***清单 4-74***. *清单 4-73* 的输出结果\n\n```\n.heading {\n  color:\
    \ #1111ff;\n}\n.impNotice {\n  color: #000000;\n}\n.successfulEvent {\n  color:\
    \ #00dd00;\n}\n```\n\n在设计中使用高对比度是一个重要因素。高对比度不仅影响视障人士设计的可用性，对视力正常的人也有好处。然而，计算正确的对比度值并不容易。Less\
    \ 提供了`contrast()`函数，该函数计算一个易于识别的颜色。\n\n`contrast()`函数最多可以接受四个参数，其中只有第一个参数是必需的。\n\
    \n*   将需要对比度的颜色定义为首个参数。\n*   第二个和第三个参数定义了深色和浅色。\n*   最后一个可输入参数是阈值。阈值的默认值是 43%。\n\
    \n高于阈值颜色的颜色被视为浅色，`contrast()`函数返回第二个参数中定义的深色。\n\n其他提供的一些函数包括：\n\n*   `saturate()`\n\
    *   `desaturate()`\n*   `fadein()`\n*   `fadeout()`\n*   `fade()`\n*   `spin()`\n\
    *   `mix()`\n*   `grayscale()`\n\n你可以通过应用颜色混合函数来生成新颜色，这些函数对提供的两种颜色输入执行基本操作，例如减法。\n\
    \n一些颜色混合函数包括：\n\n*   `multiply()`\n*   `screen()`\n*   `average()`\n*   `overlay()`\n\
    *   `hardlight()`\n*   `softlight()`\n*   `difference()`\n*   `exclusion()`\n\
    *   `negation()`\n\n让我们来看一些这些混合函数。\n\n*   `multiply()` 对两种颜色执行乘法运算。\n*   `screen()`\
    \ 得出输入颜色中最亮的颜色。\n*   `overlay()` 是`screen()`和`multiply()`函数的组合，结果颜色的亮度或暗度取决于第一个输入颜色的值。\n\
    *   `softlight()` 类似于`overlay()`，但它避免在其结果中出现纯黑色或纯白色。\n*   `hardlight()` 与`overlay()`完全相反，结果颜色的亮度或暗度由第二个输入颜色的值决定。\n\
    *   `difference()` 按照每个通道从第一种颜色中减去第二种颜色。如果任何特定通道遇到负值，它将会被反转。\n*   `average()`\
    \ 按照每个通道计算两个数字的平均值。\n\n所有这些函数已在 清单 4-75 中演示。\n\n***清单 4-75***. 展示各种颜色混合函数的示例\n\
    \n```\n@primaryColor: #00A;\n@secondaryColor: #0A0;\n@tertiaryColor: #AAA;\n.heading{\n\
    \    color:multiply(@primaryColor,@tertiaryColor);\n    color:screen(@primaryColor,@secondaryColor);\n\
    \    color:overlay(@primaryColor,@tertiaryColor);\n    color:softlight(@secondaryColor,@tertiaryColor);\n\
    \    color:hardlight(@primaryColor,@tertiaryColor);\n    color:difference(@primaryColor,@secondaryColor);\n\
    \    color:average(@primaryColor,@secondaryColor);\n}\n```\n\n***清单 4-76***. 清单\
    \ 4-75 的输出结果\n\n```\n.heading {\n  color: #000071;\n  color: #0000c6;\n  color:\
    \ #00b700;\n  color: #5555c6;\n  color: #00aaaa;\n  color: #005555;\n}\n```\n\n\
    ### 类型函数\n\nLess 提供了类型函数来验证输入值的类型。如果输入类型与函数的测试匹配，这些函数返回`true`。\n\n以下是一些类型函数：\n\
    \n*   `isnumber()`\n*   `isstring()`\n*   `iscolor()`\n*   `iskeyword()`\n*  \
    \ `isurl()`\n*   `ispixel()`\n*   `isem()`\n*   `ispercentage()`\n*   `isunit()`\n\
    \n如果输入值是数字，`isnumber()`返回`true`；否则返回`false`。\n\n***清单 4-77***. 对`isnumber`返回`true`或`false`的示例值\n\
    \n```\nisnumber(#fff);     // false\nisnumber(\"NormalText\"); // false\nisnumber(1234);\
    \     // true\nisnumber(56px);     // true\n```\n\n如果输入值是字符串，`isstring()`返回`true`；否则返回`false`。\n\
    \n***清单 4-78***. 对`isstring`返回`true`或`false`的示例值\n\n```\nisstring(red);     //\
    \ false\nisstring(\"NormalText\"); // true\n```\n\n如果输入值是颜色，`iscolor()`返回`true`；否则返回`false`。\n\
    \n***清单 4-79***. 对`iscolor`返回`true`或`false`的示例值\n\n```\niscolor(#fff);     //\
    \ true\niscolor(\"NormalText\"); // false\n```\n\n如果输入值是 URL，`isurl()`返回`true`；否则返回`false`。\n\
    \n***清单 4-80***. 对`isurl`返回`true`或`false`的示例值\n\n```\nisurl(\"NormalText\"); //\
    \ false\nisurl(url(...)); // true\n```\n\n如果输入值是像素单位数字，`ispixel()`返回`true`；否则返回`false`。\n\
    \n***清单 4-81***. 对`ispixel`返回`true`或`false`的示例值\n\n```\nispixel(1234);     //\
    \ false\nispixel(56px);     // true\n```\n\n如果输入值是`em`单位数字，`isem()`返回`true`；否则返回`false`。\n\
    \n***清单 4-82***. 对`isem`返回`true`或`false`的示例值\n\n```\nisem(56px);     // false\n\
    isem(7.8em);    // true\n```\n\n如果输入值是百分比值，`ispercentage()`返回`true`；否则返回`false`。\n\
    \n***清单 4-83***. 对`ispercentage`返回`true`或`false`的示例值\n\n```\nispercentage(56px);\
    \     // false\nispercentage(7.8%);     // true\n```\n\n如果输入值的单位与第二个参数中指定的单位相同，`isunit()`返回`true`；否则返回`false`。\n\
    \n***清单 4-84***. 对`isunit`返回`true`或`false`的示例值\n\n```\nisunit(11px, px);  // true\n\
    isunit(2.2%, px);  // false\n```\n\n### 数学函数\n\nLess 提供了几个数学函数来对值执行各种数学运算。在本节中，我们将介绍其中一些函数。\n\
    \n*   `ceil()` 类似于 JavaScript 中的版本，它会将输入数字舍入为最高的整数值。例如，`ceil(2.4)`返回`3`。\n*  \
    \ `floor()` 将输入数字舍入为最低的整数值。例如，`floor(2.4)`返回`2`。\n*   `percentage()` 将输入数字转换为百分比值。例如，`percentage(0.5)`返回`50%`。\n\
    *   `round()` 对数字进行四舍五入。它接受两个参数。第一个参数是要舍入的数字。第二个参数是要舍入到的小数位数。例如，`round(1.67)`返回`2`，而`round(1.67,1)`将返回`1.7`。\n\
    *   `sqrt()` 计算输入值的平方根。另请注意，在执行此计算时，该函数会保留原始输入的单位。例如，`sqrt(25cm)`返回`5cm`。\n* \
    \  `pow()` 返回第一个参数的第二个参数次幂的值。例如，`pow(2,2)`返回`4`。\n*   `mod()` 计算输入值的模数。例如，`mod(11,6)`返回`5`。\n\
    *   `min()` 返回输入值中的最小值。例如，`min(2,1)`将返回`1`。\n*   `max()` 返回输入值中的最大值。例如，`max(2,1)`将返回`2`。\n\
    \n### 字符串函数\n\nLess 提供了字符串函数来操作字符串。在本节中，我们将研究这些函数。\n\n*   `escape()` 将对字符串中发现的特殊字符进行\
    \ URL 编码。此函数不会对以下字符集进行 URL 编码：`,`, `/`, `?`, `@`, `&`, `+`, `'`, `~`, `!`, 和`$`。例如，`escape(x=10)`返回`x%3D10`。\n\
    *   `e()` 也称为 CSS 转义。它主要从输入字符串中移除引号，并返回不带引号的字符串，可用于 CSS 表达式中。我们在 清单 4-70 中使用了此函数来提取社交图标的名称并移除了其引号。\n\
    *   `replace()` 用于替换给定输入中的字符串。此函数接受四个参数：\n    *   输入字符串，这是执行搜索和替换的目标。\n    * \
    \  要被替换的字符串/模式。\n    *   替换字符串，即用于替换搜索模式的字符串。\n    *   任何可选的正则表达式标志。\n\n例如，`replace(\"\
    Is this planet?\", \"planet\\?\", \"earth\");` 会将单词`planet`替换为`earth`。\n\n###\
    \ 杂项函数\n"
- fmt: "好的，以下是排版后的 Markdown 文档：\n\n除了前面提到的函数，Less 还有一些无法归类到特定组的函数，如下所示：\n\n- `color()`\
    \ 将一个包含颜色值的字符串转换为实际的颜色值。这与字符串类别的 `e()` 函数类似。例如，`color(\"#555\")` 返回 `#555`。\n\
    - `image-size()` 返回输入图像的尺寸。例如，`image-size(\"image.png\")` 返回 `16px 16px`。这可以拆分为两个独立的函数：`image-width()`\
    \ 和 `image-height()`。顾名思义，前者返回图像的宽度，后者返回图像的高度。\n- `convert()` 将输入值转换为第二个参数指定的特定单位。此函数接受两个参数：\n\
    \    - 要转换的输入值，需带有适当的单位。\n    - 一个有效的单位类型。\n\n例如，以下 `convert()` 函数调用 `convert(5s,\
    \ \"ms\")` 返回 `5000ms`。请注意，在调用此函数时，输入单位和预期的输出单位应该是兼容的。例如，`convert(10, ms)` 只会返回\
    \ `10`，这不是预期的结果，因为输入单位（此处没有单位）与输出类型不兼容。兼容意味着单位应代表相同类型的属性。\n\n- `default()` 与守卫（`guard`）一起使用。当根据输入找不到匹配的混合（`mixin`）时，它用于触发守卫。这在[清单\
    \ 4-85](#9781484213483_Ch04.xhtml#FPar86) 中演示。\n\n[***清单 4-85***](#9781484213483_Ch04.xhtml#_FPar86).\
    \ 演示带有守卫的 `default()` 函数的示例\n\n```\n.font(1){\n    font-size: 11px;\n}\n.font(5){\n\
    \    font-size: 26px;\n}\n.font(@size) when (default()) {\n    font-size: ~\"\
    @{size}px\";\n}\n\n.header {\n  .font(5);\n}\n\n.content {\n  .font(12);\n}\n\
    ```\n\n在此示例中，你有三个 `font` 混合的变体，如果输入值为 `1` 或 `5`，它会抛出一个预设值。对于其他情况，`default()` 返回\
    \ `true`，此时直接使用提供的值。此代码的输出如[清单 4-86](#9781484213483_Ch04.xhtml#FPar87) 所示。\n\n\
    [***清单 4-86***](#9781484213483_Ch04.xhtml#_FPar87). [清单 4-85](#9781484213483_Ch04.xhtml#FPar86)\
    \ 的输出\n\n```\n.header {\n  font-size: 26px;\n}\n.content {\n  font-size: 12px;\n\
    }\n```\n\n- `unit()` 的行为因传递的参数数量而异。此函数可以接受两个参数。如果只提供一个参数，它将从输入中提取并返回数值。例如，`unit(10px)`\
    \ 返回 `10`。当你想要为输入值分配某个单位时，传递两个参数。例如，`unit(10,px)` 返回 `10px`。请注意，这不能与 `convert()`\
    \ 函数互换使用。\n- `get-unit()` 用于只从给定值中提取单位。如果输入有任何单位，将仅返回该单位。\n\n## 将 Less 与外部框架一起使用\n\
    \n你可以将 Less 与其他知名框架一起使用。本节介绍如何使用 Less 与以下框架进行自定义或扩展：\n\n- Cardinal CSS\n- Ionic\
    \ 框架\n- Semantic Grid System\n\n### Cardinal CSS\n\nCardinal ([http://cardinalcss.com/](http://cardinalcss.com/))\
    \ 是一个类似 Bootstrap 的 CSS 框架。它是一个纯 CSS 框架，本质上是移动优先和模块化的。它不包含任何类似 Bootstrap 或 Foundation\
    \ 的 JavaScript 插件。Cardinal 的 CSS 是使用 Less 编写的。\n\n虽然这个框架制作精良，但其文档需要大量改进。你会在 Less\
    \ 代码框架中找到许多有用的注释。\n\n使用此框架的 HTML 标记应类似于[清单 4-87](#9781484213483_Ch04.xhtml#FPar88)。\n\
    \n[***清单 4-87***](#9781484213483_Ch04.xhtml#_FPar88). 使用 Cardinal 框架的示例标记\n\n\
    ```\n<div class=\"grid\">\n  <div class=\"grid-item 1/4\">Block 1</div>\n  <div\
    \ class=\"grid-item 1/4\">Block 2</div>\n  <div class=\"grid-item 1/4\">Block\
    \ 3</div>\n  <div class=\"grid-item 1/4\">Block 4</div>\n</div>\n```\n\nCardinal\
    \ 支持七种由六个断点组成的网格类型，如下所示：\n\n- `xs`: 480px;\n- `sm`: 600px;\n- `md`: 768px;\n-\
    \ `lg`: 960px;\n- `xl`: 1140px;\n- `xxl`: 1380px;\n\nLess Cardinal 插件会在你的自定义代码之前导入\
    \ Cardinal 的 Less 代码。此插件可以通过执行以下命令安装：\n\n```\nnpm install -g less-plugin-cardinal\n\
    ```\n\n安装后，可以使用以下命令使用该插件：\n\n```\nlessc mycode.less --cardinal\n```\n\n### Ionic\
    \ 和 Less\n\nIonic ([http://www.ionicframework.com](http://www.ionicframework.com))\
    \ 框架用于构建混合移动应用程序，这种应用就像以原生应用方式运行的 Web 应用。由于这些应用由网页构成，因此可以使用 HTML、JavaScript 和\
    \ CSS 等 Web 技术创建。Ionic 应用是使用 HTML5 构建的。\n\nIonic 的 Less 插件可在 [https://github.com/bassjobsen/lessplugin-ionic](https://github.com/bassjobsen/lessplugin-ionic)\
    \ 获得。它会在你的自定义 Less 代码之前导入 Ionic 框架代码。安装插件后，你可以使用以下命令简单地编译代码：\n\n```\nlessc apllication.less\
    \ application.css –ionic\n```\n\n此插件可以通过运行以下命令安装：\n\n```\nnpm install -g less-plugin-ionic\n\
    ```\n\n### Semantic Grid System\n\nSemantic Grid System ([https://github.com/tylertate/semantic.gs](https://github.com/tylertate/semantic.gs))\
    \ 是一种实现响应式布局的现代且简洁的方法，标记中没有任何无语义的类（`class`）。你只需设置列宽和间距宽，设置列数，然后在像素和百分比之间进行选择。它主要是用\
    \ Less 创建的，但也支持 SCSS 和 Stylus。\n\n这在[清单 4-88](#9781484213483_Ch04.xhtml#FPar89)\
    \ 中演示。\n\n[***清单 4-88***](#9781484213483_Ch04.xhtml#_FPar89). 演示 Semantic Grid\
    \ System 的示例\n\n```\n@import 'grid.less';\n@columns: 12;\n@column-width: 50;\n\
    @gutter-width: 10;\n@total-width: 100%;\n.main {\n    .column(9);\n}\n.sidebar\
    \ {\n    .column(3);\n}\n```\n\n## 总结\n\n本章介绍了另一个著名的预编译器框架——Less。本章涵盖了它的各种语言特性，包括嵌套、混合及其守卫，以及此框架提供的各种函数类别。\n\
    \n在下一章中，你将了解另一个名为 Compass 的著名框架。\n\n---\n\n# 第 5 章\n\n![image](OEBPS/Images/frontdot.jpg)\n\
    \n# Compass 简介\n\n在前面的章节中，您了解了两种著名的预编译语言——Sass 和 Less，并学习了它们提供的各种特性。现在，您将了解一个基于\
    \ Sass 的著名 CSS 框架，名为 Compass。\n\n本章将探讨 Compass 的以下方面：\n\n- 安装\n- 理解 `config.rb`\n\
    - 使用 Sass 和 Compass 创建响应式网格\n- Compass 和 CSS3\n- 图像精灵和 Compass\n- Compass 扩展\n\
    \n### Compass 简介\n\n正如其网站 ([http://compass-style.org/](http://compass-style.org/))\
    \ 所描述的，Compass 是“一个开源的 CSS 创作框架”。\n\nCompass 是一个使用 Sass 构建的框架。除了 Sass 之外，安装 Compass\
    \ 还能为您提供可重用的模式和工具，从而进一步减少编写 CSS 所需的时间和精力。\n\n使用 Compass，您可以通过单个语句使用像 `box-shadow`、`columns`\
    \ 等 CSS3 特性。Compass 将为其生成跨浏览器兼容的 CSS。\n\n### Compass 安装\n\nCompass 与 Sass 有类似的要求，即需要\
    \ Ruby 才能运行。安装过程在第 2 章中已解释。要开始使用，您需要运行[清单 5-1](#9781484213483_Ch05.xhtml#FPar1)\
    \ 中的命令，其结果如[图 5-1](#9781484213483_Ch05.xhtml#Fig1) 和[ 5-2](#9781484213483_Ch05.xhtml#Fig2)\
    \ 所示。\n\n![9781484213483_Fig05-01.jpg](OEBPS/Images/9781484213483_Fig05-01.jpg)\n\
    \n[图 5-1](#9781484213483_Ch05.xhtml#_Fig1). 命令 `gem update -system` 的输出\n\n![9781484213483_Fig05-02.jpg](OEBPS/Images/9781484213483_Fig05-02.jpg)"
  raw: "In addition to the previously mentioned functions, Less also has functions\
    \ that cannot be categorized in a specific group, as follows:\n\n*   color() converts\
    \ a string containing a color value to an actual color value. This is similar\
    \ to the e() function of string category. For example, color(\"#555\") returns\
    \ #555.\n*   image-size() returns the dimensions of the input image. For example,\
    \ image-size(\"image.png\") returns 16px 16px. These can be divided into two separate\
    \ functions—image-width() and image-height(). As the names indicate, the former\
    \ one returns the width and the latter one returns the height of the image.\n\
    *   convert() converts the input value to a specific unit as mentioned in second\
    \ parameter. This function takes two parameters:\n    *   The input value to be\
    \ converted with the appropriate unit.\n    *   A valid unit type.\n\nFor example,\
    \ the following convert function call convert(5s, \"ms\") returns 5000ms. Note\
    \ that while calling this function, the input unit and desired output unit should\
    \ be compatible. For example, convert(10, ms) will just return 10, which is not\
    \ a desired result, as the input unit (none in this case) is not compatible with\
    \ the output type. Compatible means that the units should represent the same type\
    \ of property.\n\n*   default() is used with the guard. It is used to fire the\
    \ guard when no matching mixin is found as per the input. This is demonstrated\
    \ in [Listing 4-85](#9781484213483_Ch04.xhtml#FPar86).\n\n[***Listing 4-85***](#9781484213483_Ch04.xhtml#_FPar86).\
    \ Example Demonstrating the default() Function with Guard\n\n```\n.font(1){\n\
        font-size: 11px;\n}\n.font(5){\n    font-size: 26px;\n}\n.font(@size) when\
    \ (default()) {\n    font-size: ~\"@{size}px\";\n}\n\n.header {\n  .font(5);\n\
    }\n\n.content {\n  .font(12);\n}\n```\n\nIn this example, you have three variants\
    \ of the font mixin, into which it would throw a preset value if the input value\
    \ is 1 or 5\\. For other cases, default() returns true in which the value provided\
    \ is directly used. The output of this code is shown in [Listing 4-86](#9781484213483_Ch04.xhtml#FPar87).\n\
    \n[***Listing 4-86***](#9781484213483_Ch04.xhtml#_FPar87). Output of [Listing\
    \ 4-85](#9781484213483_Ch04.xhtml#FPar86)\n\n```\n.header {\n  font-size: 26px;\n\
    }\n.content {\n  font-size: 12px;\n}\n```\n\n*   unit() has a different behavior\
    \ depending on the number of arguments passed. This function can take two parameters.\
    \ If only one parameter is provided, it will extract and return the numeric value\
    \ from the input. For example, unit(10px) returns 10\\. You pass two parameters\
    \ when you want to assign some unit to the input value. For example, unit(10,px)\
    \ returns 10px. Note this cannot be used interchangeably with the convert() function.\n\
    *   get-unit() is used to extract only the units from a given value. If the input\
    \ provided has any units, only that unit will be returned.\n\nUsing Less with\
    \ External Frameworks\n\nYou can use Less along with other well-known frameworks.\
    \ This section looks at how you can use Less with the following frameworks to\
    \ customize or extend them:\n\n*   Cardinal CSS\n*   Ionic framework\n*   Semantic\
    \ grid system\n\nCardinal CSS\n\nCardinal ([http://cardinalcss.com/](http://cardinalcss.com/))\
    \ is a CSS framework like Bootstrap. It is a pure CSS framework, which is mobile-first\
    \ and modular by nature. It does not include any JavaScript plugins like Bootstrap\
    \ or Foundation. Cardinal’s CSS has been written using Less.\n\nAlthough the framework\
    \ is nicely made, its documentation needs a lot of work. You will find lots of\
    \ useful comments in the Less code framework.\n\nThe HTML markup for consuming\
    \ this framework would look like [Listing 4-87](#9781484213483_Ch04.xhtml#FPar88).\n\
    \n[***Listing 4-87***](#9781484213483_Ch04.xhtml#_FPar88). Sample Markup for Consuming\
    \ the Cardinal Framework\n\n```\n<div class=\"grid\">\n  <div class=\"grid-item\
    \ 1/4\">Block 1</div>\n  <div class=\"grid-item 1/4\">Block 2</div>\n  <div class=\"\
    grid-item 1/4\">Block 3</div>\n  <div class=\"grid-item 1/4\">Block 4</div>\n\
    </div>\n```\n\nCardinal supports seven types of grids made up of six breakpoints,\
    \ which are as follows:\n\n*   xs: 480px;\n*   sm: 600px;\n*   md: 768px;\n* \
    \  lg: 960px;\n*   xl: 1140px;\n*   xxl: 1380px;\n\nThe Less Cardinal plugin will\
    \ import Cardinal’s Less code before your custom code. This plugin can be installed\
    \ by executing following command:\n\n```\nnpm install -g less-plugin-cardinal\n\
    ```\n\nAfter installation, the plugin can be used with following command\n\n```\n\
    lessc mycode.less --cardinal\n```\n\nIonic and Less\n\nThe Ionic ([http://www.ionicframework.com](http://www.ionicframework.com))\
    \ framework is used for building hybrid mobile apps, which are like web apps that\
    \ run like a native app. As these apps are made up of web pages, they can be created\
    \ using web technologies like HTML, JavaScript, and CSS. Ionic apps are built\
    \ by using HTML5.\n\nThe Less plugin for Ionic is available at [https://github.com/bassjobsen/lessplugin-ionic](https://github.com/bassjobsen/lessplugin-ionic).\
    \ This imports the Ionic Framework code before your custom Less code. After plugin\
    \ installation, you can simply compile your code with following command:\n\n```\n\
    lessc apllication.less application.css –ionic\n```\n\nThis plugin can be installed\
    \ by running the following command:\n\n```\nnpm install -g less-plugin-ionic\n\
    ```\n\nSemantic Grid System\n\nThe Semantic Grid System ([https://github.com/tylertate/semantic.gs](https://github.com/tylertate/semantic.gs))\
    \ is a modern and clean approach toward achieving responsive layouts, without\
    \ any unsemantic classes in the markup. You simply set the column and gutter widths,\
    \ set the number of columns, and then choose between pixels or percentages. It’s\
    \ primarily created with Less, but also supports SCSS and Stylus.\n\nIt’s demonstrated\
    \ in [Listing 4-88](#9781484213483_Ch04.xhtml#FPar89).\n\n[***Listing 4-88***](#9781484213483_Ch04.xhtml#_FPar89).\
    \ Example Demonstrating the Semantic Grid System\n\n```\n@import 'grid.less';\n\
    @columns: 12;\n@column-width: 50;\n@gutter-width: 10;\n@total-width: 100%;\n.main\
    \ {\n    .column(9);\n}\n.sidebar {\n    .column(3);\n}\n```\n\nSummary\n\nThis\
    \ chapter covered another known precompiler framework, called Less. The chapter\
    \ covered its various language features, including nesting, mixins, and their\
    \ guards and various categories of functions provided by this framework.\n\nIn\
    \ next chapter, you will look into another known framework called compass.\n\n\
    CHAPTER 5\n\n![image](OEBPS/Images/frontdot.jpg)\n\nIntroduction to Compass\n\n\
    In the previous chapters, you looked at two famous precompiling languages—Sass\
    \ and Less—and learned about the various features they provide. Now you will look\
    \ into a famous CSS framework that is based on Sass, called Compass.\n\nThis chapter\
    \ explores the following aspects of Compass:\n\n*   Installation\n*   Understanding\
    \ config.rb\n*   Responsive grids with Sass and Compass\n*   Compass and CSS3\n\
    *   Image sprites and Compass\n*   Compass extensions\n\nIntroduction to Compass\n\
    \nCompass, as described on its web site ([http://compass-style.org/](http://compass-style.org/)),\
    \ is “an open-source CSS authoring framework”.\n\nCompass is a framework built\
    \ using Sass. Installing Compass in addition to Sass gives you reusable patterns\
    \ and tools that further reduce the time and efforts you’ll need to write CSS.\n\
    \nWith Compass you can use CSS3 features like box-shadow, columns, and more with\
    \ a single statement. Compass will generate the cross-browser compatible CSS for\
    \ them.\n\nCompass Installation\n\nCompass has similar requirements as Sass does\
    \ in that it needs Ruby to run. The installation process is explained in [Chapter\
    \ 2](#9781484213483_Ch02.xhtml). To get started, you need to run command in [Listing\
    \ 5-1](#9781484213483_Ch05.xhtml#FPar1), the results of which are shown in [Figures\
    \ 5-1](#9781484213483_Ch05.xhtml#Fig1) and [5-2](#9781484213483_Ch05.xhtml#Fig2).\n\
    \n![9781484213483_Fig05-01.jpg](OEBPS/Images/9781484213483_Fig05-01.jpg)\n\n[Figure\
    \ 5-1](#9781484213483_Ch05.xhtml#_Fig1). Output of gem update -system\n\n![9781484213483_Fig05-02.jpg](OEBPS/Images/9781484213483_Fig05-02.jpg)"
  trans: "好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，对给定的英文文本进行翻译。\n\n以下是翻译后的中文 Markdown\
    \ 文档：\n\n\n除了前面提到的函数，Less 还有一些无法归类到特定组的函数，如下所示：\n\n- `color()` 将一个包含颜色值的字符串转换为实际的颜色值。这与字符串类别的\
    \ `e()` 函数类似。例如，`color(\"#555\")` 返回 `#555`。\n- `image-size()` 返回输入图像的尺寸。例如，`image-size(\"\
    image.png\")` 返回 `16px 16px`。这可以拆分为两个独立的函数：`image-width()` 和 `image-height()`。顾名思义，前者返回图像的宽度，后者返回图像的高度。\n\
    - `convert()` 将输入值转换为第二个参数指定的特定单位。此函数接受两个参数：\n    - 要转换的输入值，需带有适当的单位。\n    - 一个有效的单位类型。\n\
    \n例如，以下 `convert()` 函数调用 `convert(5s, \"ms\")` 返回 `5000ms`。请注意，在调用此函数时，输入单位和预期的输出单位应该是兼容的。例如，`convert(10,\
    \ ms)` 只会返回 `10`，这不是预期的结果，因为输入单位（此处没有单位）与输出类型不兼容。兼容意味着单位应代表相同类型的属性。\n\n- `default()`\
    \ 与守卫（`guard`）一起使用。当根据输入找不到匹配的混合（`mixin`）时，它用于触发守卫。这在清单 4-85 中演示。\n\n***清单 4-85***.\
    \ 演示带有守卫的 `default()` 函数的示例\n\n```\n.font(1){\n    font-size: 11px;\n}\n.font(5){\n\
    \    font-size: 26px;\n}\n.font(@size) when (default()) {\n    font-size: ~\"\
    @{size}px\";\n}\n\n.header {\n  .font(5);\n}\n\n.content {\n  .font(12);\n}\n\
    ```\n\n在此示例中，你有三个 `font` 混合的变体，如果输入值为 `1` 或 `5`，它会抛出一个预设值。对于其他情况，`default()` 返回\
    \ `true`，此时直接使用提供的值。此代码的输出如清单 4-86 所示。\n\n***清单 4-86***. 清单 4-85 的输出\n\n```\n\
    .header {\n  font-size: 26px;\n}\n.content {\n  font-size: 12px;\n}\n```\n\n-\
    \ `unit()` 的行为因传递的参数数量而异。此函数可以接受两个参数。如果只提供一个参数，它将从输入中提取并返回数值。例如，`unit(10px)` 返回\
    \ `10`。当你想要为输入值分配某个单位时，传递两个参数。例如，`unit(10,px)` 返回 `10px`。请注意，这不能与 `convert()`\
    \ 函数互换使用。\n- `get-unit()` 用于只从给定值中提取单位。如果输入有任何单位，将仅返回该单位。\n\n## 将 Less 与外部框架一起使用\n\
    \n你可以将 Less 与其他知名框架一起使用。本节介绍如何使用 Less 与以下框架进行自定义或扩展：\n\n- Cardinal CSS\n- Ionic\
    \ 框架\n- Semantic Grid System\n\n### Cardinal CSS\n\nCardinal ([`cardinalcss.com/`](http://cardinalcss.com/))\
    \ 是一个类似 Bootstrap 的 CSS 框架。它是一个纯 CSS 框架，本质上是移动优先和模块化的。它不包含任何类似 Bootstrap 或 Foundation\
    \ 的 JavaScript 插件。Cardinal 的 CSS 是使用 Less 编写的。\n\n虽然这个框架制作精良，但其文档需要大量改进。你会在 Less\
    \ 代码框架中找到许多有用的注释。\n\n使用此框架的 HTML 标记应类似于清单 4-87。\n\n***清单 4-87***. 使用 Cardinal\
    \ 框架的示例标记\n\n```\n<div class=\"grid\">\n  <div class=\"grid-item 1/4\">Block 1</div>\n\
    \  <div class=\"grid-item 1/4\">Block 2</div>\n  <div class=\"grid-item 1/4\"\
    >Block 3</div>\n  <div class=\"grid-item 1/4\">Block 4</div>\n</div>\n```\n\n\
    Cardinal 支持七种由六个断点组成的网格类型，如下所示：\n\n- `xs`: 480px;\n- `sm`: 600px;\n- `md`: 768px;\n\
    - `lg`: 960px;\n- `xl`: 1140px;\n- `xxl`: 1380px;\n\nLess Cardinal 插件会在你的自定义代码之前导入\
    \ Cardinal 的 Less 代码。此插件可以通过执行以下命令安装：\n\n```\nnpm install -g less-plugin-cardinal\n\
    ```\n\n安装后，可以使用以下命令使用该插件：\n\n```\nlessc mycode.less --cardinal\n```\n\n### Ionic\
    \ 和 Less\n\nIonic ([`www.ionicframework.com`](http://www.ionicframework.com))\
    \ 框架用于构建混合移动应用程序，这种应用就像以原生应用方式运行的 Web 应用。由于这些应用由网页构成，因此可以使用 HTML、JavaScript 和\
    \ CSS 等 Web 技术创建。Ionic 应用是使用 HTML5 构建的。\n\nIonic 的 Less 插件可在 [`github.com/bassjobsen/lessplugin-ionic`](https://github.com/bassjobsen/lessplugin-ionic)\
    \ 获得。它会在你的自定义 Less 代码之前导入 Ionic 框架代码。安装插件后，你可以使用以下命令简单地编译代码：\n\n```\nlessc apllication.less\
    \ application.css –ionic\n```\n\n此插件可以通过运行以下命令安装：\n\n```\nnpm install -g less-plugin-ionic\n\
    ```\n\n### Semantic Grid System\n\nSemantic Grid System ([`github.com/tylertate/semantic.gs`](https://github.com/tylertate/semantic.gs))\
    \ 是一种实现响应式布局的现代且简洁的方法，标记中没有任何无语义的类（`class`）。你只需设置列宽和间距宽，设置列数，然后在像素和百分比之间进行选择。它主要是用\
    \ Less 创建的，但也支持 SCSS 和 Stylus。\n\n这在清单 4-88 中演示。\n\n***清单 4-88***. 演示 Semantic\
    \ Grid System 的示例\n\n```\n@import 'grid.less';\n@columns: 12;\n@column-width:\
    \ 50;\n@gutter-width: 10;\n@total-width: 100%;\n.main {\n    .column(9);\n}\n\
    .sidebar {\n    .column(3);\n}\n```\n\n## 总结\n\n本章介绍了另一个著名的预编译器框架——Less。本章涵盖了它的各种语言特性，包括嵌套、混合及其守卫，以及此框架提供的各种函数类别。\n\
    \n在下一章中，你将了解另一个名为 Compass 的著名框架。\n\n---\n\n# 第 5 章\n\n![image](img/frontdot.jpg)\n\
    \n# Compass 简介\n\n在前面的章节中，您了解了两种著名的预编译语言——Sass 和 Less，并学习了它们提供的各种特性。现在，您将了解一个基于\
    \ Sass 的著名 CSS 框架，名为 Compass。\n\n本章将探讨 Compass 的以下方面：\n\n- 安装\n- 理解 `config.rb`\n\
    - 使用 Sass 和 Compass 创建响应式网格\n- Compass 和 CSS3\n- 图像精灵和 Compass\n- Compass 扩展\n\
    \n### Compass 简介\n\n正如其网站 ([`compass-style.org/`](http://compass-style.org/))\
    \ 所描述的，Compass 是“一个开源的 CSS 创作框架”。\n\nCompass 是一个使用 Sass 构建的框架。除了 Sass 之外，安装 Compass\
    \ 还能为您提供可重用的模式和工具，从而进一步减少编写 CSS 所需的时间和精力。\n\n使用 Compass，您可以通过单个语句使用像 `box-shadow`、`columns`\
    \ 等 CSS3 特性。Compass 将为其生成跨浏览器兼容的 CSS。\n\n### Compass 安装\n\nCompass 与 Sass 有类似的要求，即需要\
    \ Ruby 才能运行。安装过程在第 2 章中已解释。要开始使用，您需要运行清单 5-1 中的命令，其结果如图 5-1 和 5-2 所示。\n\n![9781484213483_Fig05-01.jpg](img/9781484213483_Fig05-01.jpg)\n\
    \n图 5-1. 命令 `gem update -system` 的输出\n\n![9781484213483_Fig05-02.jpg](img/9781484213483_Fig05-02.jpg)\n"
- fmt: '[Figure 5-2](#9781484213483_Ch05.xhtml#_Fig2). Output of `sudo gem install
    Compass`


    [***Listing 5-1***](#9781484213483_Ch05.xhtml#_FPar1). Command for Installing
    Compass


    ```

    gem update --system

    gem install compass

    ```


    If you want to work on experimental features provided by Compass, you can install
    the preview version of it by executing the command in [Listing 5-2](#9781484213483_Ch05.xhtml#FPar2).


    [***Listing 5-2***](#9781484213483_Ch05.xhtml#_FPar2). Command for Installing
    the Preview Version of Compass


    ```

    gem install compass --pre

    ```


    When you run this command, the output will look as shown in [Figure 5-3](#9781484213483_Ch05.xhtml#Fig3).


    ![9781484213483_Fig05-03.jpg](OEBPS/Images/9781484213483_Fig05-03.jpg)


    [Figure 5-3](#9781484213483_Ch05.xhtml#_Fig3). Output of [Listing 5-2](#9781484213483_Ch05.xhtml#FPar2)


    Once you are done installing Compass, you can get started by executing the command
    shown in [Listing 5-3](#9781484213483_Ch05.xhtml#FPar3).


    [***Listing 5-3***](#9781484213483_Ch05.xhtml#_FPar3). Command for Creating a
    Project with Compass


    ```

    compass create <projectName>

    ```


    For Mac users, compass creator Chris Eppstein provides an installer package that
    can be installed without terminal. This is available at [https://github.com/chriseppstein/compass/downloads](https://github.com/chriseppstein/compass/downloads).


    The latest version of Mac OS X seems to have some issues with the previously defined
    method of installation. You may come across an error such as:


    ```

    ERROR: While executing gem ... (Errno::EPERM)

    Operation not permitted - /usr/bin/compass

    ```


    This happens because of the rootless mode introduced in latest OS X. In rootless
    mode, `/usr/bin` is not writable even using `sudo`.


    This issue can be solved using the following command:


    ```

    sudo gem install -n /usr/local/bin compass

    ```


    ## Creating a Project in Compass


    To begin, you will create a blank project using Compass. To do so, use the command
    in [Listing 5-4](#9781484213483_Ch05.xhtml#FPar4) (the results are shown in [Figure
    5-4](#9781484213483_Ch05.xhtml#Fig4)).


    [***Listing 5-4***](#9781484213483_Ch05.xhtml#_FPar4). The Command to Create a
    Project Using Compass


    ```

    compass create learnCompass

    ```


    ![9781484213483_Fig05-04.jpg](OEBPS/Images/9781484213483_Fig05-04.jpg)


    [Figure 5-4](#9781484213483_Ch05.xhtml#_Fig4). Output of the `compass create`
    command


    This command will create the necessary directory structure and the CSS files.
    It also creates a config file that configures Compass and Sass options.


    GUI-based tools have an option to create compass projects. For example, CodeKit
    provides an option called `Create New Compass Project`.


    You can customize this default method of creating project, for example, creating
    project with different folder names. This can be done by providing additional
    options in the `compass create` command, as shown in [Listing 5-5](#9781484213483_Ch05.xhtml#FPar5).


    [***Listing 5-5***](#9781484213483_Ch05.xhtml#_FPar5). Customizing the Project
    Creation in Compass


    ```

    compass create customProject --sass-dir "scss" --javascripts-dir "scripts"

    ```


    In this command, you are specifying the folder names as per the requirements.
    These customizations that you provide are saved in `config.rb` file that is generated
    in the project.


    The `compass create` command won’t create a folder for JavaScript. You need to
    manually create it.


    `compass create` has an option called `--bare` that will not create the files
    and folders that it would otherwise create by default. The created project will
    just have `config.rb` file and Sass folder. [Figure 5-5](#9781484213483_Ch05.xhtml#Fig5)
    shows the default structure created by the `compass create` command.


    ![9781484213483_Fig05-05.jpg](OEBPS/Images/9781484213483_Fig05-05.jpg)


    [Figure 5-5](#9781484213483_Ch05.xhtml#_Fig5). Default structure created by the
    `compass create` command


    ## Understanding `config.rb`


    `config.rb` is the main file in a Compass project. It defines several important
    aspects of project such as location of files and how the CSS should be generated
    from Sass/Scss.'
