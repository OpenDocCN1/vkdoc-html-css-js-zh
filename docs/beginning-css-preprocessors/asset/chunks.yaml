    \ Web 的程序。”）\n*   构建系统，生成压缩/编译后的代码构建版本。\n*   包管理器，自动获取所有必需的库。\n\n另一个知名的自动化工具是\
    \ Bower（[`bower.io/`](http://bower.io/)）。\n\n![9781484213483_Fig02-06.jpg](img/9781484213483_Fig02-06.jpg)\n\
    \n图 2-6 访问 Yeoman.io 获取 Yeoman 框架\n\n## 变量\n\n与其他编程语言类似，变量用于将值关联到一个名称，以便在代码中重复使用。因此，您只需引用名称，而无需克隆值。在\
    \ Sass 中，可存储颜色、排版信息等可复用内容。使用`$`符号创建 Sass 变量，如代码清单 2-10 所示。\n\n**代码清单 2-10****：在\
    \ Sass 中创建变量**\n\n```\n$fontColor:#666;\n\nbody{\n        color:$fontColor;\n\
    }\n```\n\n当此 Sass 代码编译为普通 CSS 时，`body`样式定义中的`$fontColor`会被实际值替换。\n\n变量如果在任何样式声明之外声明，则是全局可访问的；如果在特定选择器内声明，则仅对该选择器可用。参见代码清单\
    \ 2-11 中的示例。\n\n**代码清单 2-11****：演示变量作用域的代码**\n\n```\nbody{\n  $fontColor:#666;\n\
    \  color:$fontColor;\n}\np{\n  color:$fontColor;\n}\n```\n\n此代码会报错：\n\n```\nUndefined\
    \ variable: \"$fontColor\".\n```\n\n这是因为`$fontColor`在`body`标签的样式块内声明。\n\n变量可与样式规则的部分组合，形成单一样式规则。在此类实现中，变量会被其实际值替换。如代码清单\
    \ 2-12 所示。\n"
- fmt: "### Code Combining Parts of CSS Rules with Variables\n\n**Listing 2-12**.\
    \ Code Combining Parts of CSS Rules with Variables\n\n```\n$border-color: #000;\n\
    .containerBlock {\n  border: 2px $border-color solid;\n}\n```\n\nIt is possible\
    \ to create a variable from another variable. This can be done as shown in **Listing\
    \ 2-13**.\n\n**Listing 2-13**. Declaring One Variable from Another Variable\n\n\
    ```\n$border-color: #000;\n$borderDeclaration: 2px $border-color solid;\n.containerBlock\
    \ {\n  border:$borderDeclaration;\n}\n```\n\nSass allows you to use underscores\
    \ and hyphens interchangeably in your code. Thus, the code shown in **Listing\
    \ 2-14** will be valid and won’t produce an error.\n\n**Listing 2-14**. Demo Showing\
    \ the Interchangeable Use of Underscores and Hyphens\n\n```\n$color-positive:\
    \ #0F0;\n.note {\ncolor: $color_positive;\n}\n```\n\n### Data Types\n\nSass supports\
    \ various data types:\n\n- Numbers (e.g., `2.0`, `15`, `12px`)\n- Strings (e.g.,\
    \ `\"foo\"`, `bar`)\n- Colors (e.g., `#f00`, `rgb(255,255,150)`)\n- Boolean (e.g.,\
    \ `true`, `false`)\n- Comma- or space-separated values (e.g., `10px 20px`, `'Tahoma','Arial',san-serif`)\n\
    \nSass also supports CSS `!important` declarations.\n\n### Default Values for\
    \ Variables\n\nVariables can be given default values that will come into action\
    \ if they are not assigned any specific value. This comes handy when you want\
    \ to use a default value across your code and modify it only in certain situations,\
    \ as shown in **Listings 2-15** and **2-16**.\n\n**Listing 2-15**. Example of\
    \ Default Values\n\n```\n$borderRadius: 5px !default;\n```\n\n**Listing 2-16**.\
    \ Example of a Default Value Being Ignored When a Value Is Specified Explicitly\n\
    \n```\n$borderRadius:10px;\n.notArea{\n        Border-radius:$borderRadius;\n\
    }\n```\n\n**Listing 2-17**. Output of **Listing 2-16**\n\n```\n.notArea{\n   \
    \     Border-radius:10px;\n}\n```\n\nIf the code in **Listing 2-16** runs without\
    \ explicitly specifying the value for `borderRadius`, it will choose to go ahead\
    \ with the default value. The output will thus be as shown in **Listing 2-18**.\n\
    \n**Listing 2-18**. Output of **Listing 2-16** Without Explicitly Defining a Value\
    \ for `borderRadius`\n\n```\n.notArea{\n        Border-radius:5px;\n}\n```\n\n\
    ### Nesting Styles in Sass\n\nWhile writing CSS, you have to repeat the selectors\
    \ to assign style rules for elements placed under some elements. The code shown\
    \ in **Listing 2-19** is a common example of selector repetition.\n\n**Listing\
    \ 2-19**. Code Repetition in CSS\n\n```\n.article .h1 {\n  font-weight: bold;\n\
    }\n\n.article p {\n  line-height: 1em;\n}\n\n.article img {\n  float: left;\n\
    }\n```\n\nIn Sass, you can avoid this code repetition by nesting CSS selectors.\
    \ Thus, the code in **Listing 2-19**, rewritten in Sass, would look like **Listing\
    \ 2-20**.\n\n**Listing 2-20**. Sass Version of the Code in **Listing 2-19**\n\n\
    ```\n.article{\n  .h1{\n    font-weight:bold;\n  }\n  p{\n    line-height:1em;\n\
    \  }\n  img{\n    float:left;\n  }\n}\n```\n\nThis approach not only eliminates\
    \ code repetition, it also makes the code more readable.\n\nNesting can be done\
    \ with groups of selectors as well. This is shown in **Listing 2-21**.\n\n**Listing\
    \ 2-21**. Nesting a Group of Selectors\n\n```\n.article{\n  p,section{\n    line-height:1em;\n\
    \  }\n}\n```\n\n**Listing 2-22**. Output of **Listing 2-21**\n\n```\n.article\
    \ p, .article section {\n  line-height: 1em;\n}\n```\n\n### Referencing a Parent\
    \ Selector: `&`"
  raw: '[***Listing 2-12***](#9781484213483_Ch02.xhtml#_FPar12). Code Combining Parts
    of CSS Rules with Variables


    ```

    $border-color: #000;

    .containerBlock {

      border: 2px $border-color solid;

    }

    ```


    It is possible to create a variable from another variable. This can be done as
    shown in [Listing 2-13](#9781484213483_Ch02.xhtml#FPar13).


    [***Listing 2-13***](#9781484213483_Ch02.xhtml#_FPar13). Declaring One Variable
    from Another Variable


    ```

    $border-color: #000;

    $borderDeclaration: 2px $border-color solid;

    .containerBlock {

      border:$borderDeclaration;

    }

    ```


    Sass allows you to use underscores and hyphens interchangeably in your code. Thus,
    the code shown in [Listing 2-14](#9781484213483_Ch02.xhtml#FPar14) will be valid
    and won’t produce an error.


    [***Listing 2-14***](#9781484213483_Ch02.xhtml#_FPar14). Demo Showing the Interchangable
    Use of Underscores and Hyphens


    ```

    $color-positive: #0F0;

    .note {

    color: $color_positive;

    }

    ```


    Data Types


    Sass supports various data types:


    *   Numbers (e.g., 2.0,15,12px)

    *   Strings (e.g., "foo",bar)

    *   Colors (e.g., #f00, rgb(255,255,150))

    *   Boolean (e.g., true, false)

    *   Comma- or space-separated values (e.g., 10px 20px, ''Tahoma'',''Arial'',san-serif)


    Sass also supports css !important declarations.


    Default Values for Variables


    Variables can be given default values that will come into action if they are not
    assigned any specific value. This comes handy when you want to use a default value
    across your code and modify it only in certain situations, as shown in [Listings
    2-15](#9781484213483_Ch02.xhtml#FPar15) and [2-16](#9781484213483_Ch02.xhtml#FPar16).


    [***Listing 2-15***](#9781484213483_Ch02.xhtml#_FPar15). Example of Default Values


    ```

    $borderRadius: 5px !default;

    ```


    [***Listing 2-16***](#9781484213483_Ch02.xhtml#_FPar16). Example of a Default
    Value Being Ignored When a Value Is Specified Explicitly


    ```

    $borderRadius:10px;

    .notArea{

            Border-radius:$borderRadius;

    }

    ```


    ***Listing 2-17***. Output of [Listing 2-16](#9781484213483_Ch02.xhtml#FPar16)


    ```

    .notArea{

            Border-radius:10px;

    }

    ```


    If the code in [Listing 2-16](#9781484213483_Ch02.xhtml#FPar16) runs without explicitly
    specifying the value for borderRadius, it will choose go ahead with default value.
    Output will thus be as shown in [Listing 2-18](#9781484213483_Ch02.xhtml#FPar18).


    [***Listing 2-18***](#9781484213483_Ch02.xhtml#_FPar18). Output of [Listing 2-16
    Without Explicitly Defining a Value for borderRadius](#9781484213483_Ch02.xhtml#FPar16)


    ```

    .notArea{

            Border-radius:5px;

    }

    ```


    Nesting Styles in Sass


    While writing CSS, you have to repeat the selectors to assign style rules for
    elements placed under some elements. The code shown in [Listing 2-19](#9781484213483_Ch02.xhtml#FPar19)
    is a common example of selector repetition.


    [***Listing 2-19***](#9781484213483_Ch02.xhtml#_FPar19). Code Repetition in CSS


    ```

    .article .h1 {

      font-weight: bold;

    }


    .article p {

      line-height: 1em;

    }


    .article img {

      float: left;

    }

    ```


    In Sass, you can avoid this code repetition by nesting CSS selectors. Thus, the
    code in [Listing 2-19](#9781484213483_Ch02.xhtml#FPar19), rewritten in Sass, would
    look like [Listing 2-20](#9781484213483_Ch02.xhtml#FPar20).


    [***Listing 2-20***](#9781484213483_Ch02.xhtml#_FPar20). Sass Version of the Code
    in [Listing 2-19](#9781484213483_Ch02.xhtml#FPar19)


    ```

    .article{

      .h1{

        font-weight:bold;

      }

      p{

        line-height:1em;

      }

      img{

        float:left;

      }

    }

    ```


    This approach not only eliminates code repetition, it also makes the code more
    readable.


    Nesting can be done with groups of selectors as well. This is shown in [Listing
    2-21](#9781484213483_Ch02.xhtml#FPar21).


    [***Listing 2-21***](#9781484213483_Ch02.xhtml#_FPar21). Nesting a Group of Selectors


    ```

    .article{

      p,section{

        line-height:1em;

      }

    }

    ```


    ***Listing 2-22***. Output of [Listing 2-21](#9781484213483_Ch02.xhtml#FPar21)


    ```

    .article p, .article section {

      line-height: 1em;

    }

    ```


    Referencing a Parent Selector: &'
  trans: "\n### 结合变量组合 CSS 规则代码\n\n**清单 2-12** 结合变量组合 CSS 规则代码\n\n```\n$border-color:\
    \ #000;\n.containerBlock {\n  border: 2px $border-color solid;\n}\n```\n\n你可以基于一个变量来创建另一个变量，具体做法如\
    \ **清单 2-13** 所示。\n\n**清单 2-13** 基于一个变量声明另一个变量\n\n```\n$border-color: #000;\n\
    $borderDeclaration: 2px $border-color solid;\n.containerBlock {\n  border:$borderDeclaration;\n\
    }\n```\n\nSass 允许你在代码中互换使用下划线和连字符。因此，**清单 2-14** 所示的代码是有效的，不会报错。\n\n**清单 2-14**\
    \ 演示下划线与连字符的互换使用\n\n```\n$color-positive: #0F0;\n.note {\ncolor: $color_positive;\n\
    }\n```\n\n### 数据类型\n\nSass 支持多种数据类型：\n\n- 数值（例如：`2.0`、`15`、`12px`）\n- 字符串（例如：`\"\
    foo\"`、`bar`）\n- 颜色值（例如：`#f00`、`rgb(255,255,150)`）\n- 布尔值（例如：`true`、`false`）\n\
    - 逗号或空格分隔的值（例如：`10px 20px`、`'Tahoma','Arial',san-serif`）\n\nSass 也支持 CSS 的 `!important`\
    \ 声明。\n\n### 变量的默认值\n\n变量可以被赋予默认值，当未给变量指定具体值时，该默认值就会生效。当你想在代码中统一使用某个默认值，并只在特定情况下修改它时，这一特性会非常有用，如\
    \ **清单 2-15** 和 **2-16** 所示。\n\n**清单 2-15** 默认值示例\n\n```\n$borderRadius: 5px !default;\n\
    ```\n\n**清单 2-16** 显式指定值时默认值被忽略的示例\n\n```\n$borderRadius:10px;\n.notArea{\n  \
    \      Border-radius:$borderRadius;\n}\n```\n\n**清单 2-17** **清单 2-16** 的输出结果\n\
    \n```\n.notArea{\n        Border-radius:10px;\n}\n```\n\n如果在运行 **清单 2-16** 的代码时，没有显式指定\
    \ `borderRadius` 的值，代码会继续使用默认值。因此，输出结果将如 **清单 2-18** 所示。\n\n**清单 2-18** 未显式定义\
    \ `borderRadius` 值时 **清单 2-16** 的输出结果\n\n```\n.notArea{\n        Border-radius:5px;\n\
    }\n```\n\n### Sass 中的样式嵌套\n\n编写 CSS 时，你必须重复选择器来为某些元素下的子元素分配样式规则。**清单 2-19** 所示的代码就是一个常见的选择器重复示例。\n\
    \n**清单 2-19** CSS 中的代码重复\n\n```\n.article .h1 {\n  font-weight: bold;\n}\n\n.article\
    \ p {\n  line-height: 1em;\n}\n\n.article img {\n  float: left;\n}\n```\n\n在 Sass\
    \ 中，你可以通过嵌套 CSS 选择器来避免这种代码重复。因此，**清单 2-19** 的代码用 Sass 重写后会如 **清单 2-20** 所示。\n\n\
    **清单 2-20** **清单 2-19** 的 Sass 版本\n\n```\n.article{\n  .h1{\n    font-weight:bold;\n\
    \  }\n  p{\n    line-height:1em;\n  }\n  img{\n    float:left;\n  }\n}\n```\n\n\
    这种方法不仅消除了代码重复，还使代码更具可读性。\n\n选择器组同样可以进行嵌套，如 **清单 2-21** 所示。\n\n**清单 2-21** 嵌套选择器组\n\
    \n```\n.article{\n  p,section{\n    line-height:1em;\n  }\n}\n```\n\n**清单 2-22**\
    \ **清单 2-21** 的输出结果\n\n```\n.article p, .article section {\n  line-height: 1em;\n\
    }\n```\n\n### 引用父选择器：`&`\n"
- fmt: "在 Sass 中嵌套样式时，很多情况下你可能需要引用父选择器。例如，如果你想为元素的悬停状态编写样式，可以通过在 `&` 选择器前加前缀来引用父元素，如[清单\
    \ 2-23](#9781484213483_Ch02.xhtml#FPar23)所示。\n\n[***Listing 2-23***](#9781484213483_Ch02.xhtml#_FPar23).\
    \ 使用 `&` 引用父选择器\n\n```\na {\n        text-decoration:none;\n        &:hover {\n\
    \                text-decoration:underline;\n        }\n}\n```\n\n编译此代码时，`&` 会被替换为父选择器。编译后的输出如[清单\
    \ 2-24](#97814814834283_Ch02.xhtml#FPar24)所示。\n\n[***Listing 2-24***](#97814814834283_Ch02.xhtml#FPar24).\
    \ [清单 2-23](#9781484213483_Ch02.xhtml#FPar23) 的输出\n\n```\na {\n        text-decoration:none;\n\
    }\na:hover{\n        text-decoration:underline;\n}\n```\n\n`&` 的另一个特性是，无论嵌套深度如何，它都能解析父选择器。考虑[清单\
    \ 2-25](#9781484213483_Ch02.xhtml#FPar25)中的代码。\n\n[***Listing 2-25***](#9781484213483_Ch02.xhtml#FPar25).\
    \ `&` 在样式声明中嵌套了两层\n\n```\n#contentArea {\n        font-size:1em;\n        a#referenceLinkContainer{\n\
    \                background:#CCC;\n                &:hover{\n                \
    \        border:1px solid #000;\n                }\n        }\n}\n```\n\n输出如[清单\
    \ 2-26](#9781484213483_Ch02.xhtml#FPar26)所示。\n\n[***Listing 2-26***](#9781484213483_Ch02.xhtml#FPar26).\
    \ [清单 2-25](#9781484213483_Ch02.xhtml#FPar25) 的编译输出\n\n```\n#contentArea{ font-size:\
    \ 1em;}\n#contentArea a#referenceLinkContainer{background: #CCC;}\n#contentArea\
    \ a#referenceLinkContainer:hover{border:1px solid #000;}\n```\n\n在 SCSS 中使用组合器\n\
    \n组合器选择器——`+`、`>` 和 `~`——用于组合选择器。它们告诉浏览器哪些元素处于上下文中。\n\n`>` 也被称为*子组合器*。它用于选择父元素的直接子元素。在前面的例子中，它会选择\
    \ `section` 的直接子元素 `h1`，而不会定位嵌套在子元素内部的任何 `h1`。参见[清单 2-27](#9781484213483_Ch02.xhtml#FPar27)。\n\
    \n[***Listing 2-27***](#9781484213483_Ch02.xhtml#FPar27). 在 CSS 中使用组合器的示例\n\n\
    ```\n.article{\n  section > h1{\n    line-height:1em;\n  }\n}\n```\n\n`+` 也被称为*相邻组合器*。它用于选择同一层级的下一个元素，不会检查父元素的子元素。如[清单\
    \ 2-28](#9781484213483_Ch02.xhtml#FPar28) 和[2-29](#9781484213483_Ch02.xhtml#FPar29)所示。\n\
    \n[***Listing 2-28***](#9781484213483_Ch02.xhtml#FPar28). 演示相邻组合器的 HTML 标记\n\n\
    ```\n<section>\n        <article>\n                <p>This is a child paragraph</p>\n\
    \        </article>\n        <p>This is an adjacent paragraph</p>\n        <article>\n\
    \                <p>This is a child paragraph</p>\n        </article>\n</section>\n\
    ```\n\n[***Listing 2-29***](#9781484213483_Ch02.xhtml#FPar29). 演示相邻组合器的 CSS\n\n\
    ```\nArticle + p{\n        Color: #F00;\n}\n```\n\n在[清单 2-29](#9781484213483_Ch02.xhtml#FPar29)\
    \ 所示的代码中，规则将应用于 `article` 标签之后的任何 `p` 标签，而不应用于 `article` 标签内部的 `p` 标签。\n\n`~`\
    \ 被称为*通用兄弟*组合器。它会选择任意 `article` 之后出现的每个 `article`，无论它们之间有什么元素。参见[清单 2-30](#9781484213483_Ch02.xhtml#FPar30)。\n\
    \n[***Listing 2-30***](#9781484213483_Ch02.xhtml#FPar30). 演示通用兄弟组合器的 CSS\n\n```\n\
    Article ~ article{\n        Color: #F00; \n}\n```\n\n注释\n\n与其他编程语言一样，Sass 支持单行注释和多行注释。单行注释通过在代码前添加\
    \ `//` 创建。多行注释则包含在 `/**/` 中。[清单 2-31](#9781484213483_Ch02.xhtml#FPar31) 展示了一些示例。\n\
    \n[***Listing 2-31***](#9781484213483_Ch02.xhtml#_FPar31). 注释示例"
  raw: "When nesting styles in Sass, there are many occasions where you might need\
    \ to refer to the parent selector. For example, if you want to write a style for\
    \ a hover state of an element, you can refer to the parent element by prefixing\
    \ the & selector, as shown in [Listing 2-23](#9781484213483_Ch02.xhtml#FPar23).\n\
    \n[***Listing 2-23***](#9781484213483_Ch02.xhtml#_FPar23). Using & to Refer to\
    \ the Parent Selector\n\n```\na {\n        text-decoration:none;\n        &:hover\
    \ {\n                text-decoration:underline;\n        }\n}\n```\n\nWhen this\
    \ code is compiled, & is replaced with the parent selector. The compiled output\
    \ is shown in [Listing 2-24](#9781484213483_Ch02.xhtml#FPar24).\n\n[***Listing\
    \ 2-24***](#9781484213483_Ch02.xhtml#_FPar24). Output of [Listing 2-23](#9781484213483_Ch02.xhtml#FPar23)\n\
    \n```\na {\n        text-decoration:none;\n}\na:hover{\n        text-decoration:underline;\n\
    }\n```\n\nAnother feature of & is that it resolves the parent selector regardless\
    \ of any depth in nesting. Consider the code in [Listing 2-25](#9781484213483_Ch02.xhtml#FPar25).\n\
    \n[***Listing 2-25***](#9781484213483_Ch02.xhtml#_FPar25). & Is Nested Two Levels\
    \ Below in the Style Declaration\n\n```\n#contentArea {\n        font-size:1em;\n\
            a#referenceLinkContainer{\n                background:#CCC;\n                &:hover{\n\
                            border:1px solid #000;\n                }\n        }\n\
    }\n```\n\nThe output is shown in [Listing 2-26](#9781484213483_Ch02.xhtml#FPar26).\n\
    \n[***Listing 2-26***](#9781484213483_Ch02.xhtml#_FPar26). Compiled output of\
    \ [Listing 2-25](#9781484213483_Ch02.xhtml#FPar25)\n\n```\n#contentArea{ font-size:\
    \ 1em;}\n#contentArea a#referenceLinkContainer{background: #CCC;}\n#contentArea\
    \ a#referenceLinkContainer:hover{border:1px solid #000;}\n```\n\nUsing Combinators\
    \ in Your SCSS\n\nCombinator selectors— +, >, and ~ —are used to combine selectors.\
    \ They tell the browser which elements are in context.\n\nThe > is also known\
    \ as the *child combinator.* It’s used to select the immediate child of the parent.\
    \ In the previous example, it would select the immediate h1 of section. It will\
    \ not target any h1’s that have been nested inside a child element. See [Listing\
    \ 2-27](#9781484213483_Ch02.xhtml#FPar27).\n\n[***Listing 2-27***](#9781484213483_Ch02.xhtml#_FPar27).\
    \ Example of Using a Combinator in CSS\n\n```\n.article{\n  section > h1{\n    line-height:1em;\n\
      }\n}\n```\n\nThe + is also known as the *adjacent combinator.* It’s used to\
    \ select the next element at the same level. It would not check the parent element’s\
    \ children. It’s shown in [Listings 2-28](#9781484213483_Ch02.xhtml#FPar28) and\
    \ [2-29](#9781484213483_Ch02.xhtml#FPar29).\n\n[***Listing 2-28***](#9781484213483_Ch02.xhtml#_FPar28).\
    \ HTML Markup to Demonstrate an Adjacent Combinator\n\n```\n<section>\n        <article>\n\
                    <p>This is a child paragraph</p>\n        </article>\n        <p>This\
    \ is an adjacent paragraph</p>\n        <article>\n                <p>This is\
    \ a child paragraph</p>\n        </article>\n</section>\n```\n\n[***Listing 2-29***](#9781484213483_Ch02.xhtml#_FPar29).\
    \ CSS Demonstrating an Adjacent Combinator\n\n```\nArticle + p{\n        Color:\
    \ #F00;\n}\n```\n\nIn the code shown in [Listing 2-29](#9781484213483_Ch02.xhtml#FPar29),\
    \ the rule will apply to any p tag that is after the article tag and not ones\
    \ that are inside the article tags.\n\nThe ~ is called the *general sibling* combinator.\
    \ It will select every article that comes after another article, regardless of\
    \ what elements are between them. See [Listing 2-30](#9781484213483_Ch02.xhtml#FPar30).\n\
    \n[***Listing 2-30***](#9781484213483_Ch02.xhtml#_FPar30). CSS Demonstrating the\
    \ General Sibling Combinator\n\n```\nArticle ~ article{\n        Color: #F00;\
    \ \n}\n```\n\nComments\n\nLike other programming languages, Sass supports single-line\
    \ and multiline comments. Single-line comments are created by prefixing them with\
    \ //. Multiline comments are enclosed within /**/. [Listing 2-31](#9781484213483_Ch02.xhtml#FPar31)\
    \ shows some examples.\n\n[***Listing 2-31***](#9781484213483_Ch02.xhtml#_FPar31).\
    \ Comment Examples"
  trans: "\n在 Sass 中嵌套样式时，很多情况下你可能需要引用父选择器。例如，如果你想为元素的悬停状态编写样式，可以通过在 `&` 选择器前加前缀来引用父元素，如清单\
    \ 2-23 所示。\n\n***清单 2-23***. 使用 `&` 引用父选择器\n\n```\na {\n        text-decoration:none;\n\
    \        &:hover {\n                text-decoration:underline;\n        }\n}\n\
    ```\n\n编译此代码时，`&` 会被替换为父选择器。编译后的输出如清单 2-24 所示。\n\n***清单 2-24***. 清单 2-23 的输出\n\
    \n```\na {\n        text-decoration:none;\n}\na:hover{\n        text-decoration:underline;\n\
    }\n```\n\n`&` 的另一个特性是，无论嵌套深度如何，它都能解析父选择器。考虑清单 2-25 中的代码。\n\n***清单 2-25***. `&`\
    \ 在样式声明中嵌套了两层\n\n```\n#contentArea {\n        font-size:1em;\n        a#referenceLinkContainer{\n\
    \                background:#CCC;\n                &:hover{\n                \
    \        border:1px solid #000;\n                }\n        }\n}\n```\n\n输出如清单\
    \ 2-26 所示。\n\n***清单 2-26***. 清单 2-25 的编译输出\n\n```\n#contentArea{ font-size: 1em;}\n\
    #contentArea a#referenceLinkContainer{background: #CCC;}\n#contentArea a#referenceLinkContainer:hover{border:1px\
    \ solid #000;}\n```\n\n在 SCSS 中使用组合器\n\n组合器选择器——`+`、`>` 和 `~`——用于组合选择器。它们告诉浏览器哪些元素处于上下文中。\n\
    \n`>` 也被称为*子组合器*。它用于选择父元素的直接子元素。在前面的例子中，它会选择 `section` 的直接子元素 `h1`，而不会定位嵌套在子元素内部的任何\
    \ `h1`。参见清单 2-27。\n\n***清单 2-27***. 在 CSS 中使用组合器的示例\n\n```\n.article{\n  section\
    \ > h1{\n    line-height:1em;\n  }\n}\n```\n\n`+` 也被称为*相邻组合器*。它用于选择同一层级的下一个元素，不会检查父元素的子元素。如清单\
    \ 2-28 和 2-29 所示。\n\n***清单 2-28***. 演示相邻组合器的 HTML 标记\n\n```\n<section>\n     \
    \   <article>\n                <p>This is a child paragraph</p>\n        </article>\n\
    \        <p>This is an adjacent paragraph</p>\n        <article>\n           \
    \     <p>This is a child paragraph</p>\n        </article>\n</section>\n```\n\n\
    ***清单 2-29***. 演示相邻组合器的 CSS\n\n```\nArticle + p{\n        Color: #F00;\n}\n```\n\
    \n在清单 2-29 所示的代码中，规则将应用于 `article` 标签之后的任何 `p` 标签，而不应用于 `article` 标签内部的 `p` 标签。\n\
    \n`~` 被称为*通用兄弟*组合器。它会选择任意 `article` 之后出现的每个 `article`，无论它们之间有什么元素。参见清单 2-30。\n\
    \n***清单 2-30***. 演示通用兄弟组合器的 CSS\n\n```\nArticle ~ article{\n        Color: #F00;\
    \ \n}\n```\n\n注释\n\n与其他编程语言一样，Sass 支持单行注释和多行注释。单行注释通过在代码前添加 `//` 创建。多行注释则包含在 `/**/`\
    \ 中。清单 2-31 展示了一些示例。\n\n***清单 2-31***. 注释示例\n"
- fmt: "```\n// This is Single line comment\n/* This is a\nMulti line comment */\n\
    ```\n\n当 Sass 文件被编译时，多行注释会被保留，而单行注释会被删除。\n\n## 嵌套属性\n\n与嵌套规则类似，Sass 也允许嵌套属性。例如，考虑`font-family`、`font-size`和`font-weight`等属性，它们都属于`font`命名空间。\n\
    \n在 Sass 中，你可以嵌套属于同一命名空间的属性，如[清单 2-32](#9781484213483_Ch02.xhtml#FPar32)所示。\n\n\
    [***清单 2-32***](#9781484213483_Ch02.xhtml#_FPar32). 嵌套属性\n\n```\n.content{\nfont:\
    \ {\n        family: 'Tahoma';\n        size: 13px;\n        weight: bold;\n \
    \       }\n}\n```\n\n此代码编译后如[清单 2-33](#9781484213483_Ch02.xhtml#FPar33)所示。\n\n\
    [***清单 2-33***](#9781484213483_Ch02.xhtml#_FPar33). [清单 2-32](#9781484213483_Ch02.xhtml#FPar32)\
    \ 的输出\n\n```\n.content{\n        font-family: 'Tahoma';\n        font-size: 13px;\n\
    \        font-weight: bold; \n}\n```\n\n## 插值\n\n如果你想要动态构建选择器或属性，就需要使用插值。当你想用循环来生成样式时，这非常有用。例如，你有一个包含社交媒体图标名称的数组，你可以使用循环配合插值来生成这类样式。它也可以用在简单的场景中，比如你想在类名中使用存储在变量中的值，如[清单\
    \ 2-34](#9781484213483_Ch02.xhtml#FPar34)所示。\n\n插值使用`#{}`语法实现。\n\n[***清单 2-34***](#9781484213483_Ch02.xhtml#_FPar34).\
    \ 展示插值的示例\n\n```\n$innerContainerClass: container;\n.left .#{$innerContainerClass}\
    \ {\n        width:50%;\n        display:inline-block;\n}\n```\n\n[***清单 2-35***](#9781484213483_Ch02.xhtml#FPar34).\
    \ [清单 2-34](#9781484213483_Ch02.xhtml#FPar34) 的输出\n\n```\n.left .container{\n\
    \        width:50%;\n        display:inline-block;\n}\n```\n\n## 占位选择器\n\n占位选择器是一种特殊类型的选择器，看起来与普通的\
    \ ID 或类选择器相似，但前缀是`%`而不是`#`或`.`。占位符与其他选择器的不同之处在于，它们不会在最终的输出`.css`文件中呈现。\n\n占位选择器（参见[清单\
    \ 2-36](#9781484213483_Ch02.xhtml#FPar36)）用于扩展某些样式集，同时不将该样式集渲染到最终输出中。你将在下一章学习`@extend`时看到它的实现。\n\
    \n[***清单 2-36***](#9781484213483_Ch02.xhtml#_FPar36). 占位选择器示例\n\n```\n%importantText{\n\
    \        Color:red;\n        Font-weight:bold;\n}\n\n.notice{\n        @extend\
    \ %importantText;\n}\n```\n\n[***清单 2-37***](#9781484213483_Ch02.xhtml#FPar36).\
    \ [清单 2-36](#9781484213483_Ch02.xhtml#FPar36) 的输出，其中`%importantText`已被渲染\n\n```\n\
    .notice {\n  Color: red;\n  Font-weight: bold;\n}\n```\n\n## Sass 的逻辑能力\n\nSass\
    \ 不仅通过融入 DRY 原则使编写 CSS 变得简单且易于维护，还增加了核心 CSS 所缺失的逻辑和计算等能力。使用 Sass，你可以执行数学计算，根据某些条件执行操作，或者进行循环。让我们更详细地探讨这些方面。\n\
    \n### Sass 中的数学运算\n\nSass 支持加法、减法、乘法和除法。\n\n#### 加法\n\n加法可以如[清单 2-38](#9781484213483_Ch02.xhtml#FPar38)所示进行操作。\n\
    \n[***清单 2-38***](#9781484213483_Ch02.xhtml#_FPar38). 展示加法的示例\n\n```\n.container{\
    \ width: 20%+80%;}\n```\n\n请注意，数学运算只能发生在相同类型的操作数之间。换句话说，你不能在像素和百分比之间执行数学运算。\n\n\
    #### 减法\n\n减法可以如[清单 2-39](#9781484213483_Ch02.xhtml#FPar39)所示进行操作。\n\n[***清单 2-39***](#9781484213483_Ch02.xhtml#_FPar39).\
    \ 展示减法的示例\n\n```\n.container{ width: 80%-40%;}\n```\n\n#### 乘法\n\n乘法可以如[清单 2-40](#9781484213483_Ch02.xhtml#FPar40)所示进行操作。"
  raw: "```\n// This is Single line comment\n/* This is a\nMulti line comment */\n\
    ```\n\nWhen the Sass file is compiled, multiline comments are retained while single-line\
    \ comments are removed.\n\nNesting Properties\n\nLike nested rules, Sass also\
    \ allows nesting of properties. For example, consider the properties like font-family,\
    \ font-size, and font-weight. These all come under the font namespace.\n\nIn Sass,\
    \ you can nest properties that come under the same namespace, as shown in [Listing\
    \ 2-32](#9781484213483_Ch02.xhtml#FPar32).\n\n[***Listing 2-32***](#9781484213483_Ch02.xhtml#_FPar32).\
    \ Nesting Properties\n\n```\n.content{\nfont: {\n        family: 'Tahoma';\n        size:\
    \ 13px;\n        weight: bold;\n        }\n}\n```\n\nThis code is compiled as\
    \ shown in [Listing 2-33](#9781484213483_Ch02.xhtml#FPar33).\n\n[***Listing 2-33***](#9781484213483_Ch02.xhtml#_FPar33).\
    \ Output of [Listing 2-32](#9781484213483_Ch02.xhtml#FPar32)\n\n```\n.content{\n\
            font-family: 'Tahoma';\n        font-size: 13px;\n        font-weight:\
    \ bold; \n}\n```\n\nInterpolation\n\nIf you want to build your selectors or properties\
    \ dynamically, interpolation is the thing you need. This comes handy when you\
    \ want use loops to generate styles. For example, you have an array containing\
    \ names of social network icons. You can use loop with interpolation to generate\
    \ such styles. It can be used in a simple situation where you want use a value\
    \ stored in a variable in a class name, as demonstrated in [Listing 2-34](#9781484213483_Ch02.xhtml#FPar34).\n\
    \nInterpolation is done using the #{} syntax.\n\n[***Listing 2-34***](#9781484213483_Ch02.xhtml#_FPar34).\
    \ Example Showing Interpolation\n\n```\n$innerContainerClass: container;\n.left\
    \ .#{$innerContainerClass} {\n        width:50%;\n        display:inline-block;\n\
    }\n```\n\n***Listing 2-35***. Output of [Listing 2-34](#9781484213483_Ch02.xhtml#FPar34)\n\
    \n```\n.left .container{\n        width:50%;\n        display:inline-block;\n\
    }\n```\n\nPlaceholder Selectors\n\nPlaceholder selectors are special types of\
    \ selectors that look similar to normal IDs or class selectors, but are prefixed\
    \ by % instead of # or .. Placeholders differ from other selectors in that they\
    \ are not rendered in the final output .css file.\n\nPlaceholder selectors (see\
    \ [Listing 2-36](#9781484213483_Ch02.xhtml#FPar36)) are used to extend certain\
    \ sets of styles without rendering that set in the final output. You will see\
    \ its implementation the next chapter when you look at @extend.\n\n[***Listing\
    \ 2-36***](#9781484213483_Ch02.xhtml#_FPar36). Example of a Placeholder Selector\n\
    \n```\n%importantText{\n        Color:red;\n        Font-weight:bold;\n}\n\n.notice{\n\
            @extend %importantText;\n}\n```\n\n***Listing 2-37***. Output of [Listing\
    \ 2-36,](#9781484213483_Ch02.xhtml#FPar36) where %importantText Has Been Rendered\n\
    \n```\n.notice {\n  Color: red;\n  Font-weight: bold;\n}\n```\n\nLogical Capabilities\
    \ of Sass\n\nSass not only makes writing CSS easy and maintainable by incorporating\
    \ the DRY principle, but it also adds capabilities such as logic and calculations,\
    \ which were missing in core CSS. With Sass, you can perform math calculations,\
    \ perform some operations on the basis of some condition, or do some looping.\
    \ Let’s look into these aspects in more detail.\n\nMathematical Operations in\
    \ Sass\n\nSass supports addition, subtraction, multiplication, and division.\n\
    \nAddition\n\nAddition can be done as shown in [Listing 2-38](#9781484213483_Ch02.xhtml#FPar38).\n\
    \n[***Listing 2-38***](#9781484213483_Ch02.xhtml#_FPar38). Example Showing Addition\n\
    \n```\n.container{ width: 20%+80%;}\n```\n\nNote that mathematical operations\
    \ can occur only with same type of operands. In other words, you cannot perform\
    \ mathematical operations between pixel and percentage.\n\nSubtraction\n\nSubtraction\
    \ can be done as shown in [Listing 2-39](#9781484213483_Ch02.xhtml#FPar39).\n\n\
    [***Listing 2-39***](#9781484213483_Ch02.xhtml#_FPar39). Example Showing Subtraction\n\
    \n```\n.container{ width: 80%-40%;}\n```\n\nMultiplication\n\nMultiplication can\
    \ be done as shown in [Listing 2-40](#9781484213483_Ch02.xhtml#FPar40)."
  trans: "\n```\n// 这是单行注释\n/* 这是\n多行注释 */\n```\n\n当 Sass 文件被编译时，多行注释会被保留，而单行注释会被删除。\n\
