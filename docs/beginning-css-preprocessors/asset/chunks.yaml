    对于 Mac 用户，Compass 的创建者 Chris Eppstein 提供了一个无需使用终端即可安装的安装程序包。该程序包可在 [`github.com/chriseppstein/compass/downloads`](https://github.com/chriseppstein/compass/downloads)
