- fmt: "# Which Are the Known Preprocessors?\n\nLet’s look at some known preprocessors\
    \ available today, shown in [Figure 1-2](#9781484213483_Ch01.xhtml#Fig2).\n\n\
    ![9781484213483_Fig01-02.jpg](OEBPS/Images/9781484213483_Fig01-02.jpg)\n\n[Figure\
    \ 1-2](#9781484213483_Ch01.xhtml#_Fig2). Known preprocessing frameworks\n\n##\
    \ Sass\n\n`Sass` (Syntactically Awesome Stylesheets) is the most famous preprocessor\
    \ and it’s been around for eight years. `Sass` is a preprocessor language originally\
    \ designed and developed by Hampton Catlin and Natalie Weizenbaum.\n\nWhen `SassScript`\
    \ is compiled, it generates CSS rules for various selectors as specified in the\
    \ `Sass` file. `Sass` can monitor the `.sass` or `.scss` files and generate an\
    \ output `.css` file whenever the `.sass` or `.scss` file is saved.\n\n`Sass`\
    \ is open source and coded in Ruby.\n\n## Less\n\nJust like `Sass`, `Less` is\
    \ another popular CSS preprocessor. It enhances the default CSS syntax by provision\
    \ of mixins, variables, and nested style rules. It is easy to set up. You can\
    \ also reference its JavaScript file in your HTML document and get started.\n\n\
    `Less` has attracted a very strong userbase due to its simplicity. `Less` is open\
    \ source. Its initial version was written in Ruby; however, the later versions\
    \ were written in JavaScript. A valid CSS code is a valid `Less` code, because\
    \ `Less` follows the same semantics.\n\nThe main difference between `Less` and\
    \ other CSS preprocessors is that `Less` allows real-time compilation via `less.js`\
    \ within the browser.\n\n## Compass\n\n`Compass` is an open source CSS authoring\
    \ framework. `Compass` is based on `Sass`, and hence it can use of all `Sass`’\
    \ features. It is very popular and is under active development. With `Compass`,\
    \ developers can write cleaner markup without presentational classes.\n\n`Compass`\
    \ is filled with many reusable patterns most commonly used by developers.\n\n\
    In parallel to `Compass` is `Bourbon`, which is built with `Sass`, for `Sass`\
    \ by Thoughtbot. `Bourbon` is a library of simple and lightweight mixins for `Sass`.\n\
    \nSome of key features that `Compass` provides are discussed next.\n\n### Mixins\n\
    \n`Compass` and `Bourbon` both provide a huge collection of mixins for various\
    \ CSS3 features, which you will look at in detail in coming chapters. That means\
    \ the developers don’t have to worry about vendor prefixes or CSS hacks. [Listing\
    \ 1-10](#9781484213483_Ch01.xhtml#FPar10) demonstrates the use of mixins with\
    \ regard to box sizing.\n\n***[Listing 1-10](#9781484213483_Ch01.xhtml#_FPar10)***.\
    \ Example Showing the Use of a Mixin Provided by Compass\n\n```\nel{\n       \
    \ @include box-sizing(border-box);\n}\n```\n\n### Typography\n\n`Compass` and\
    \ `Bourbon` both contain typography-related mixins, variables, and functions.\
    \ `Compass` comes with a lot of variables and a couple of mixins.\n\nOne of the\
    \ features of `Compass` in this area is that it can also work with `rem` units\
    \ with `px` fallbacks.\n\n***Listing 1-11***. Example Showing Use Typographical\
    \ Functionalities of Compass\n\n```\nel{\n        @include adjust-font-size-to(42px);\n\
    }\n```\n\n### Helpers\n\nOne thing that `Compass` provides are helpers. Helpers\
    \ save time, as they are predefined CSS snippets that you need to use directly\
    \ in your stylesheets.\n\nFor example, `Compass` provides a helper for clearing\
    \ the floats, a reset (with various options), some techniques for image replacement,\
    \ and more.\n\n`Bourbon` calls these helpers addons, and they are fewer in number\
    \ than `Compass`.\n\n### Sprites\n\nBecause `Compass` is partly built in Ruby,\
    \ `Compass` can interact with the file system. One of the things it can do is\
    \ build sprites based on a folder of images.\n\n***Listing 1-12***. Example Showing\
    \ Compass’ Simple Way of Building Sprites\n\n```\n@import \"icon/*.png\";\n@include\
    \ all-icon-sprites;\n```\n\nIt also provides functions like `image-width()`, `image-height()`,\
    \ and `inline-image()`, which encode an image file in Base64.\n\n## Features of\
    \ Preprocessors\n\nThis section goes through some common features of preprocessors\
    \ that make them great tools for developers versus using CSS directly. You will\
    \ be looking at some examples in context. The examples use two famous preprocessors—`Sass`\
    \ and `Less`—which you will be studying in detail in coming chapters.\n\n### Variables"
  raw: 'Which Are the Known Preprocessors?


    Let’s look at some known preprocessors available today, shown in [Figure 1-2](#9781484213483_Ch01.xhtml#Fig2).


    ![9781484213483_Fig01-02.jpg](OEBPS/Images/9781484213483_Fig01-02.jpg)


    [Figure 1-2](#9781484213483_Ch01.xhtml#_Fig2). Known preprocessing frameworks


    Sass


    Sass (Syntactically Awesome Stylesheets) is the most famous preprocessor and it’s
    been around for eight years. Sass is a preprocessor language originally designed
    and developed by Hampton Catlin and Natalie Weizenbaum.


    When SassScript is compiled, it generates CSS rules for various selectors as specified
    in the Sass file. Sass can monitor the .sass or .scss files and generate an output
    .css file whenever the .sass or .scss file is saved.


    Sass is open source and coded in Ruby.


    Less


    Just like Sass, Less is another popular CSS preprocessor. It enhances the default
    CSS syntax by provision of mixins, variables, and nested style rules. It is easy
    to set up. You can also reference its JavaScript file in your HTML document and
    get started.


    Less has attracted a very strong userbase due to its simplicity. Less is open
    source. Its initial version was written in Ruby; however, the later versions were
    written in JavaScript. A valid CSS code is a valid Less code, because Less follows
    the same semantics.


    The main difference between Less and other CSS preprocessors is that Less allows
    real-time compilation via less.js within the browser.


    Compass


    Compass is an open source CSS authoring framework. Compass is based on Sass, and
    hence it can use of all Sass’ features. It is very popular and is under active
    development. With Compass, developers can write cleaner markup without presentational
    classes.


    Compass is filled with many reusable patterns most commonly used by developers.


    In parallel to Compass is Bourbon, which is built with Sass, for Sass by Thoughtbot.
    Bourbon is a library of simple and lightweight mixins for Sass.


    Some of key features that Compass provides are discussed next.


    Mixins


    Compass and Bourbon both provide a huge collection of mixins for various CSS3
    features, which you will look at in detail in coming chapters. That means the
    developers don’t have to worry about vendor prefixes or CSS hacks. [Listing 1-10](#9781484213483_Ch01.xhtml#FPar10)
    demonstrates the use of mixins with regard to box sizing.


    [***Listing 1-10***](#9781484213483_Ch01.xhtml#_FPar10). Example Showing the Use
    of a Mixin Provided by Compass


    ```

    el{

            @include box-sizing(border-box);

    }

    ```


    Typography


    Compass and Bourbon both contain typography-related mixins, variables, and functions.
    Compass comes with a lot of variables and a couple of mixins.


    One of the features of Compass in this area is that it can also work with rem
    units with px fallbacks.


    ***Listing 1-11***. Example Showing Use Typographical Functionalities of Compass


    ```

    el{

            @include adjust-font-size-to(42px);

    }

    ```


    Helpers


    One thing that Compass provides are helpers. Helpers save time, as they are predefined
    CSS snippets that you need to use directly in your stylesheets.


    For example, Compass provides a helper for clearing the floats, a reset (with
    various options), some techniques for image replacement, and more.


    Bourbon calls these helpers addons, and they are fewer in number than Compass.


    Sprites


    Because Compass is partly built in Ruby, Compass can interact with the file system.
    One of the things it can do is build sprites based on a folder of images.


    ***Listing 1-12***. Example Showing Compass’ Simple Way of Building Sprites


    ```

    @import "icon/*.png";

    @include all-icon-sprites;

    ```


    It also provides functions like image-width(), image-height(), and inline-image(),
    which encode an image file in Base64.


    Features of Preprocessors


    This section goes through some common features of preprocessors that make them
    great tools for developers versus using CSS directly. You will be looking at some
    examples in context. The examples use two famous preprocessors—Sass and Less—which
    you will be studying in detail in coming chapters.


    Variables'
  trans: "\n# 已知的预处理器有哪些？\n\n让我们来看一下当今一些已知的预处理器，如图 1-2 所示。\n\n![9781484213483_Fig01-02.jpg](img/9781484213483_Fig01-02.jpg)\n\
    \n图 1-2。已知的预处理框架\n\n## Sass\n\n`Sass`（Syntactically Awesome Stylesheets，语法上令人惊艳的样式表）是最著名的预处理器，已经存在了八年之久。`Sass`\
    \ 是一种预处理器语言，最初由 Hampton Catlin 和 Natalie Weizenbaum 设计和开发。\n\n当 `SassScript` 被编译时，它会根据\
    \ `Sass` 文件中指定的规则，为各个选择器生成相应的 CSS 规则。`Sass` 可以监视 `.sass` 或 `.scss` 文件，并在这些文件被保存时自动生成输出的\
    \ `.css` 文件。\n\n`Sass` 是开源的，并使用 Ruby 编写。\n\n## Less\n\n与 `Sass` 类似，`Less` 是另一种流行的\
    \ CSS 预处理器。它通过提供混入（mixins）、变量和嵌套样式规则来增强默认的 CSS 语法。它很容易设置。你也可以在 HTML 文档中引用它的 JavaScript\
    \ 文件并开始使用。\n\n`Less` 因其简洁性吸引了非常庞大的用户群。`Less` 是开源的。其初始版本是用 Ruby 编写的，但后续版本是用 JavaScript\
    \ 编写的。有效的 CSS 代码也是有效的 `Less` 代码，因为 `Less` 遵循相同的语义。\n\n`Less` 与其他 CSS 预处理器的主要区别在于，`Less`\
    \ 允许通过 `less.js` 在浏览器中进行实时编译。\n\n## Compass\n\n`Compass` 是一个开源的 CSS 编写框架。`Compass`\
    \ 基于 `Sass`，因此可以使用 `Sass` 的所有特性。它非常流行，并且正处于活跃的开发阶段。使用 `Compass`，开发者可以编写更简洁的标记，而无需使用表示性的类。\n\
    \n`Compass` 包含了大量开发者最常使用的可复用模式。\n\n与 `Compass` 齐名的是 `Bourbon`，它由 Thoughtbot 公司使用\
    \ `Sass` 为 `Sass` 构建。`Bourbon` 是一个为 `Sass` 提供的简单轻量级混入库。\n\n接下来讨论 `Compass` 提供的一些关键特性。\n\
    \n### 混入（Mixins）\n\n`Compass` 和 `Bourbon` 都为各种 CSS3 特性提供了大量的混入集合，你将在后续章节中详细了解。这意味着开发者无需担心浏览器厂商前缀或\
    \ CSS 技巧。清单 1-10 演示了关于盒子大小调整的混入使用。\n\n***清单 1-10***。展示使用 Compass 提供的混入的示例\n\n\
    ```\nel{\n        @include box-sizing(border-box);\n}\n```\n\n### 排版\n\n`Compass`\
    \ 和 `Bourbon` 都包含与排版相关的混入、变量和函数。`Compass` 带有大量变量和几个混入。\n\n在这一领域，`Compass` 的一个特性是它还能使用带有\
    \ `px` 回退方案的 `rem` 单位。\n\n***清单 1-11***。展示使用 Compass 排版功能的示例\n\n```\nel{\n   \
    \     @include adjust-font-size-to(42px);\n}\n```\n\n### 辅助工具\n\n`Compass` 提供的一个功能是辅助工具。辅助工具可以节省时间，因为它们是预定义的\
    \ CSS 代码片段，你可以直接在样式表中使用。\n\n例如，`Compass` 提供了一个用于清除浮动的辅助工具、一个重置工具（带有多种选项）、一些图像替换技术等。\n\
    \n`Bourbon` 将这些辅助工具称为附加组件，但其数量比 `Compass` 少。\n\n### 精灵图（Sprites）\n\n由于 `Compass`\
    \ 部分是用 Ruby 构建的，因此它可以与文件系统交互。它能够做到的事情之一就是根据一个图像文件夹构建精灵图。\n\n***清单 1-12***。展示 Compass\
    \ 构建精灵图的简单方法的示例\n\n```\n@import \"icon/*.png\";\n@include all-icon-sprites;\n\
    ```\n\n它还提供了 `image-width()`、`image-height()` 和 `inline-image()` 等函数，用于将图像文件编码为\
    \ Base64 格式。\n\n## 预处理器的特性\n\n本节将介绍预处理器的一些常见特性，与直接使用 CSS 相比，这些特性使它们成为开发者出色的工具。你将看到一些上下文示例。这些示例使用了两个著名的预处理器——`Sass`\
    \ 和 `Less`——你将在后续章节中详细学习它们。\n\n### 变量\n"
- fmt: "# Variables\n\nVariables help you store information that needs to be reused\
    \ in your stylesheet. Properties like colors, font styles, or any CSS style can\
    \ be stored and reused. For example, in Sass `$` symbol is used to declare a variable.\n\
    \n***Listing 1-13***. Example Showing Implementation of Variables Using SASS\n\
    \n```\n$text-color:#333;\nbody {\n        color:$text-color;\n}\n```\n\nWhen this\
    \ code is compiled, it takes the variable defined for the `$text-color` and outputs\
    \ normal CSS with the variable’s values placed in the CSS. This can be useful\
    \ when working with properties applicable sitewide and keeping them consistent\
    \ throughout the site.\n\n***Listing 1-14***. Output of Previous Code Snippet\n\
    \n```\nbody {\n        color:#333;\n}\n```\n\nSimilarly in Less CSS `@` symbol\
    \ is used to declare a variable.\n\n***Listing 1-15***. Example Showing Implementation\
    \ of Variables Using Less\n\n```\n@text-color:#333;\nbody{\n        color:$text-color;\n\
    }\n```\n\n# Nesting\n\nVisual hierarchy of a page is not as clear in CSS as it\
    \ is in HTML. Preprocessors let you nest CSS selectors, similar to the way it\
    \ is done in HTML.\n\n***Listing 1-16***. Example of Nesting in Sass or Less\n\
    \n```\nnav {\n  ul {\n    margin: 0 auto;\n    padding: 10px 15px;\n    list-height:\
    \ 1em;\n  }\n}\n```\n\nThe generated CSS will look like [Listing 1-17](#9781484213483_Ch01.xhtml#FPar17).\n\
    \n[***Listing 1-17***](#9781484213483_Ch01.xhtml#_FPar17). Output of Previous\
    \ Code Snippet\n\n```\nnav ul {\n  margin: 0 auto;\n  padding: 10px 15px;\n  list-height:\
    \ 1em;\n}\n```\n\n# Import\n\nPreprocessors have a slightly different `@import`\
    \ implementation to the one in CSS. Instead of fetching a file from server, Sass\
    \ will fetch the specified file and merge it into the file you’re importing. This\
    \ results in a single CSS file being served to the web browser.\n\nSuppose you\
    \ have two SCSS files called `reset.scss` and `style.scss` and you want to import\
    \ `reset.scss` into `style.scss`. This can be done using Sass; see [Listing 1-18](#9781484213483_Ch01.xhtml#FPar18).\n\
    \n[***Listing 1-18***](#9781484213483_Ch01.xhtml#_FPar18). Example of Importing\
    \ Content of One File into Another\n\n```\n@import 'reset';\nbody {\n        background-color:\
    \ #efefef;\n}\n```\n\n![Image](OEBPS/Images/sq.jpg) **Note**  There is no need\
    \ to specify the file extension while importing files in Sass. Sass automatically\
    \ figures out the appropriate file and imports it.\n\nIn Less, however, the behavior\
    \ of import varies per file extension. If the imported file has a `.css` extension,\
    \ it will be treated as a normal CSS import and won’t be changed when compiled.\
    \ If it has any other extension, it will be treated like Less and will be imported\
    \ and merged.\n\n# Mixins\n\nMixins let you create snippets of CSS declarations\
    \ that you can reuse throughout your stylesheet. Mixins are further configurable\
    \ by passing parameters as well as setting defaults for those parameters. Mixins\
    \ are most useful when you want to repeatedly use vendor-prefixed syntax. They\
    \ reduce the tedious rewriting of code (see [Listings 1-19](#9781484213483_Ch01.xhtml#FPar20)\
    \ and [1-20](#9781484213483_Ch01.xhtml#FPar21)).\n\n[***Listing 1-19***](#9781484213483_Ch01.xhtml#_FPar20).\
    \ Example of a Border-Radius Mixin with a Parameter and its Default Value in Sass\n\
    \n```\n@mixin rounded-corners($radius:5px) {\n  -webkit-border-radius: $radius;\n\
    \     -moz-border-radius: $radius;\n      -ms-border-radius: $radius;\n      \
    \    border-radius: $radius;\n}\n\n.container { @include rounded-corners(10px);\
    \ }\n```\n\n[***Listing 1-20***](#9781484213483_Ch01.xhtml#_FPar21). Example of\
    \ a Border-Radius Mixin with a Parameter and its Default Value in Less\n\n```\n\
    .rounded-corners(@radius:5px) {\n  -webkit-border-radius: @radius;\n     -moz-border-radius:\
    \ @radius;\n      -ms-border-radius: @radius;\n          border-radius: @radius;\n\
    }\n\n.container { .rounded-corners(10px); }\n```\n\n# Extend/Inheritance\n\nPreprocessors\
    \ allow you to share a collection of CSS properties between one or more selectors.\
    \ This helps you write preprocessor code as per the DRY principle. See [Listings\
    \ 1-21](#9781484213483_Ch01.xhtml#FPar22) and [1-22](#9781484213483_Ch01.xhtml#FPar23).\n\
    \n[***Listing 1-21***](#9781484213483_Ch01.xhtml#_FPar22). Example for Extend\
    \ in Sass\n\n```\n.messagebox {\n        font-size:1em;\n        line-height:40px;\n\
    }\n\n.successBox {\n        @extend .messagebox;\n        color:#0F0;\n}\n```\n\
    \n[***Listing 1-22***](#9781484213483_Ch01.xhtml#_FPar23). Example for Extend\
    \ in Less\n\n```\n.messagebox {\n        font-size:1em;\n        line-height:40px;\n\
    }\n\n.successBox {\n        &:extend(.messagebox);\n        color:#0F0;\n}\n```\n\
    \n# Operators\n\nPreprocessors provide standard math operators so that you can\
    \ perform calculations on the fly. See [Listing 1-23](#9781484213483_Ch01.xhtml#FPar24).\n\
    \n[***Listing 1-23***](#9781484213483_Ch01.xhtml#FPar24). Example Showing a Math\
    \ Operation in Sass and Less\n\n```\n.mainContent {\n  float: left;\n  width:\
    \ 750px / 960px * 100%;\n}\n```\n\n# Problems with CSS Preprocessors\n\nThis section\
    \ discusses the features of preprocessors that are used inappropriately. You will\
    \ see most common problems that occur due to misuse or overuse of preprocessor\
    \ features.\n\n## Problems with Mixins\n\nMixins are reusable blocks of code that\
    \ are called wherever you need to include them. This is instead of having to rewrite\
    \ these blocks several times.\n\nConsider a code snippet written in the Sass preprocessor,\
    \ shown in [Listing 1-24](#9781484213483_Ch01.xhtml#FPar25).\n\n[***Listing 1-24***](#9781484213483_Ch01.xhtml#FPar25).\
    \ An Example of a Mixin Using Sass\n\n```\n@mixin notification {\n    color: #fff;\n\
    \    border-radius: 50%;\n}\n\n.errorNotification {\n    @include notification;\n\
    \    background:#F00;\n}\n\n.successNotification {\n    @include notification;\n\
    \    background: #0F0;\n}\n```\n\nThis code compiles to [Listing 1-25](#9781484213483_Ch01.xhtml#FPar26).\n\
    \n[***Listing 1-25***](#9781484213483_Ch01.xhtml#FPar26). Output of [Listing 1-24](#9781484213483_Ch01.xhtml#FPar25)\n\
    \n```\n.errorNotification {\n  color: #fff;\n  border-radius: 50%;\n  background:\
    \ #F00;\n}\n\n.successNotification {\n  color: #fff;\n  border-radius: 50%;\n\
    \  background: #0F0;\n}\n```\n\nNotice the code duplication that occurs in the\
    \ output shown in [Listing 1-25](#9781484213483_Ch01.xhtml#FPar26). If this mixin\
    \ is used extensively across style code, it would result in a large amount of\
    \ code redundancy and thus increase the file size.\n\nSass has an alternative\
    \ approach, which is not supported by other preprocessors—*extending*. Extending\
    \ the code will set the same properties of multiple selectors simultaneously,\
    \ by specifying the selectors in a comma-separated format.\n\nThis approach avoids\
    \ duplication; however, it can cause performance issues if too many selectors\
    \ are extended. The resulting CSS will have many selectors in comma-separated\
    \ format, which can cause performance issues.\n\n## Extending Selectors or Using\
    \ Mixins Can Hamper Maintenance\n\nExtending classes or using mixins can cause\
    \ maintenance issues. Since the properties are declared and used in different\
    \ places, the chances of changing a property without anticipating a complete impact\
    \ are high. This can cause layouts to break at any point.\n\n# Summary\n\nThis\
    \ chapter introduced preprocessors. You looked at how they can influence your\
    \ workflow, making it more efficient and far easier to maintain in the future.\
    \ You also looked at some known preprocessors currently available in the market.\n\
    \nThe next chapter dives into Sass and discusses its various features.\n\n# CHAPTER\
    \ 2\n\n![image](OEBPS/Images/frontdot.jpg)\n\n# Introduction to Sass\n\nIn the\
    \ previous chapter, you learned about precompilers, including why to use them,\
    \ which ones are the known preprocessors, and their features. This chapter covers\
    \ one of the most popular preprocessors: Sass.\n\nIn this chapter, you explore\
    \ the following aspects of Sass:\n\n*   Installation\n*   Running the code\n*\
    \   Variables\n*   Comments\n*   Data types\n*   Parentheses\n*   Nested rules\n\
    *   Nested properties\n*   Referencing parent selector\n*   Interpolation\n* \
    \  Placeholder selector\n*   Logical and control directives\n\n## Installing Sass"
  raw: 'Variables help you store information that needs to be reused in your stylesheet.
    Properties like colors, font styles, or any CSS style can be stored and reused.
    For example, in Sass $ symbol is used to declare a variable.


    ***Listing 1-13***. Example Showing Implementation of Variables Using SASS


    ```

    $text-color:#333;

    body {

            color:$text-color;

    }

    ```


    When this code is compiled, it takes the variable defined for the $text-color
    and outputs normal CSS with the variable’s values placed in the CSS. This can
    be useful when working with properties applicable sitewide and keeping them consistent
    throughout the site.


    ***Listing 1-14***. Output of Previous Code Snippet


    ```

    body {

            color:#333;

    }

    ```


    Similarly in Less CSS @ symbol is used to declare a variable.


    ***Listing 1-15***. Example Showing Implementation of Variables Using Less


    ```

    @text-color:#333;

    body{

            color:$text-color;

    }

    ```


    Nesting


    Visual hierarchy of a page is not as clear in CSS as it is in HTML. Preprocessors
    let you nest CSS selectors, similar to the way it is done in HTML.


    ***Listing 1-16***. Example of Nesting in Sass or Less


    ```

    nav {

      ul {

        margin: 0 auto;

        padding: 10px 15px;

        list-height: 1em;

      }

    }

    ```


    The generated CSS will look like [Listing 1-17](#9781484213483_Ch01.xhtml#FPar17).


    [***Listing 1-17***](#9781484213483_Ch01.xhtml#_FPar17). Output of Previous Code
    Snippet


    ```

    nav ul {

      margin: 0 auto;

      padding: 10px 15px;

      list-height: 1em;

    }

    ```


    Import


    Preprocessors have a slightly different @import implementation to the one in CSS.
    Instead of fetching a file from server, Sass will fetch the specified file and
    merge it into the file you’re importing. This results in a single CSS file being
    served to the web browser.


    Suppose you have two SCSS files called reset.scss and style.scss and you want
    to import reset.scss into style.scss. This can be done using Sass; see [Listing
    1-18](#9781484213483_Ch01.xhtml#FPar18).


    [***Listing 1-18***](#9781484213483_Ch01.xhtml#_FPar18). Example of Importing
    Content of One File into Another


    ```

    @import ''reset'';

    body {

            background-color: #efefef;

    }

    ```


    ![Image](OEBPS/Images/sq.jpg) **Note**  There is no need to specify the file extension
    while importing files in Sass. Sass automatically figures out the appropriate
    file and imports it.


    In Less, however, the behavior of import varies per file extension. If the imported
    file has a .css extension, it will be treated as a normal CSS import and won’t
    be changed when compiled. If it has any other extension, it will be treated like
    Less and will be imported and merged.


    Mixins


    Mixins let you create snippets of CSS declarations that you can reuse throughout
    your stylesheet. Mixins are further configurable by passing parameters as well
    as setting defaults for those parameters. Mixins are most useful when you want
    to repeatedly use vendor-prefixed syntax. They reduce the tedious rewriting of
    code (see [Listings 1-19](#9781484213483_Ch01.xhtml#FPar20) and [1-20](#9781484213483_Ch01.xhtml#FPar21)).


    [***Listing 1-19***](#9781484213483_Ch01.xhtml#_FPar20). Example of a Border-Radius
    Mixin with a Parameter and its Default Value in Sass


    ```

    @mixin rounded-corners($radius:5px) {

      -webkit-border-radius: $radius;

         -moz-border-radius: $radius;

          -ms-border-radius: $radius;

              border-radius: $radius;

    }


    .container { @include rounded-corners(10px); }

    ```


    [***Listing 1-20***](#9781484213483_Ch01.xhtml#_FPar21). Example of a Border-Radius
    Mixin with a Parameter and its Default Value in Less


    ```

    .rounded-corners(@radius:5px) {

      -webkit-border-radius: @radius;

         -moz-border-radius: @radius;

          -ms-border-radius: @radius;

              border-radius: @radius;

    }


    .container { .rounded-corners(10px); }

    ```


    Extend/Inheritance


    Preprocessors allow you to share a collection of CSS properties between one or
    more selectors. This helps you write preprocessor code as per the DRY principle.
    See [Listings 1-21](#9781484213483_Ch01.xhtml#FPar22) and [1-22](#9781484213483_Ch01.xhtml#FPar23).


    [***Listing 1-21***](#9781484213483_Ch01.xhtml#_FPar22). Example for Extend in
    Sass


    ```

    .messagebox {

            font-size:1em;

            line-height:40px;

    }


    .successBox {

            @extend .messagebox;

            color:#0F0;

    }

    ```


    [***Listing 1-22***](#9781484213483_Ch01.xhtml#_FPar23). Example for Extend in
    Less


    ```

    .messagebox {

            font-size:1em;

            line-height:40px;

    }


    .successBox {

            &:extend(.messagebox);

            color:#0F0;

    }

    ```


    Operators


    Preprocessors provide standard math operators so that you can perform calculations
    on the fly. See [Listing 1-23](#9781484213483_Ch01.xhtml#FPar24).


    [***Listing 1-23***](#9781484213483_Ch01.xhtml#_FPar24). Example Showing a Math
    Operation in Sass and Less


    ```

    .mainContent {

      float: left;

      width: 750px / 960px * 100%;

    }

    ```


    Problems with CSS Preprocessors


    This section discusses the features of preprocessors that are used inappropriately.
    You will see most common problems that occur due to misuse or overuse of preprocessor
    features.


    Problems with Mixins


    Mixins are reusable blocks of code that are called wherever you need to include
    them. This is instead of having to rewrite these blocks several times.


    Consider a code snippet written in the Sass preprocessor, shown in [Listing 1-24](#9781484213483_Ch01.xhtml#FPar25).


    [***Listing 1-24***](#9781484213483_Ch01.xhtml#_FPar25). An Example of a Mixin
    Using Sass


    ```

    @mixin notification {

        color: #fff;

        border-radius: 50%;

    }


    .errorNotification {

        @include notification;

        background:#F00;

    }


    .successNotification {

        @include notification;

        background: #0F0;

    }

    ```


    This code compiles to [Listing 1-25](#9781484213483_Ch01.xhtml#FPar26).


    [***Listing 1-25***](#9781484213483_Ch01.xhtml#_FPar26). Output of [Listing 1-24](#9781484213483_Ch01.xhtml#FPar25)


    ```

    .errorNotification {

      color: #fff;

      border-radius: 50%;

      background: #F00;

    }


    .successNotification {

      color: #fff;

      border-radius: 50%;

      background: #0F0;

    }

    ```


    Notice the code duplication that occurs in the output shown in [Listing 1-25](#9781484213483_Ch01.xhtml#FPar26).
    If this mixin is used extensively across style code, it would result in a large
    amount of code redundancy and thus increase the file size.


    Sass has an alternative approach, which is not supported by other preprocessors—*extending*.
    Extending the code will set the same properties of multiple selectors simultaneously,
    by specifying the selectors in a comma-separated format.


    This approach avoids duplication; however, it can cause performance issues if
    too many selectors are extended. The resulting CSS will have many selectors in
    comma-separated format, which can cause performance issues.


    Extending Selectors or Using Mixins Can Hamper Maintenance


    Extending classes or using mixins can cause maintenance issues. Since the properties
    are declared and used in different places, the chances of changing a property
    without anticipating a complete impact are high. This can cause layouts to break
    at any point.


    Summary


    This chapter introduced preprocessors. You looked at how they can influence your
    workflow, making it more efficient and far easier to maintain in the future. You
    also looked at some known preprocessors currently available in the market.


    The next chapter dives into Sass and discusses its various features.


    CHAPTER 2


    ![image](OEBPS/Images/frontdot.jpg)


    Introduction to Sass


    In the previous chapter, you learned about precompilers, including why to use
    them, which ones are the known preprocessors, and their features. This chapter
    covers one of the most popular preprocessors: Sass.


    In this chapter, you explore the following aspects of Sass:


    *   Installation

    *   Running the code

    *   Variables

    *   Comments

    *   Data types

    *   Parentheses

    *   Nested rules

    *   Nested properties

    *   Referencing parent selector

    *   Interpolation

    *   Placeholder selector

    *   Logical and control directives


