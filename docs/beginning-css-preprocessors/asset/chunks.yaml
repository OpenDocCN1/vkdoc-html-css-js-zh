- fmt: "[***Listing 2-40***](#9781484213483_Ch02.xhtml#_FPar40). Example showing Multiplication\n\
    \n```\n.container{ width: 80%*40%;}\n```\n\n**Division**\n\nDivision can be done\
    \ as shown in [Listing 2-41](#9781484213483_Ch02.xhtml#FPar41).\n\n[***Listing\
    \ 2-41***](#9781484213483_Ch02.xhtml#_FPar41). Example showing Division\n\n```\n\
    .container{ width: 80%/40%;}\n```\n\n**Parentheses**\n\nIn Sass, parentheses are\
    \ used to manipulate the order of execution, as shown in [Listing 2-42](#9781484213483_Ch02.xhtml#FPar42).\n\
    \n[***Listing 2-42***](#9781484213483_Ch02.xhtml#_FPar42). Parentheses in Action\n\
    \n```\n.leftSide{\n        Font-size:1em + (.2em*2);\n}\n```\n\n***Listing 2-43***.\
    \ Output of [Listing 2-42](#9781484213483_Ch02.xhtml#FPar42)\n\n```\n.leftSide{\n\
    \        Font-size:1.4em;\n}\n```\n\n**Calculations Using Variables**\n\nCalculations\
    \ can be performed with variables as well. Check out [Listing 2-44](#9781484213483_Ch02.xhtml#FPar44).\n\
    \n[***Listing 2-44***](#9781484213483_Ch02.xhtml#_FPar44). Example of Performing\
    \ Calculations Using Variables\n\n```\n$container:100%;\n$contentArea:50%;\n$gutter:10%;\n\
    .sidebar{\n  width: $container - ($contentArea+$gutter);\n}\n```\n\n**Control\
    \ Directives**\n\nSass provides control directives for including styles or bringing\
    \ some variations in styles based on some condition.\n\nControl directives are\
    \ complex and aren’t typically used on a daily basis. They are mainly used in\
    \ mixins in order to make them flexible. This is commonly seen in mixins within\
    \ libraries like Compass, which is covered in coming chapters.\n\n`@if`\n\nThis\
    \ control directive takes an expression and applies the associated style if the\
    \ expression evaluates to something other than `false` or `null`, as shown in\
    \ [Listing 2-45](#9781484213483_Ch02.xhtml#FPar45).\n\n[***Listing 2-45***](#9781484213483_Ch02.xhtml#_FPar45).\
    \ Example of Using `@if`\n\n```\n$isVisible : true !default;\n.container{\n  @if\
    \ $isVisible{\n    display: block;\n  }\n  @else{\n    display: none;\n  }\n}\n\
    ```\n\nIn the previous code, `$isVisible` is evaluated inside `.container` and,\
    \ depending on the result, a style is applied.\n\n***Listing 2-46***. Output of\
    \ [Listing 2-45](#9781484213483_Ch02.xhtml#FPar45)\n\n```\n.container {\n  display:\
    \ block;\n}\n```\n\n`@if` can be combined with one or more `@else if` statements\
    \ and one `@else` statement. [Listing 2-47](#9781484213483_Ch02.xhtml#FPar47)\
    \ shows an example where the background color is applied in hex code based on\
    \ the color specified in the text form.\n\n[***Listing 2-47***](#9781484213483_Ch02.xhtml#_FPar47).\
    \ Combination of `@if`, `@else if`, and `@else`\n\n```\n$blockColor: green;\n\
    .container {\n  @if $blockColor == red {\n    background-color: #f00;\n  } @else\
    \ if $blockColor == green {\n    background-color: #0f0;\n  } @else if $blockColor\
    \ == blue {\n    background-color: #00f;\n  } @else {\n    background-color: #000;\n\
    \  }\n}\n```\n\n***Listing 2-48***. Combination of `@if`, `@else if`, and `@else`\n\
    \n```\n.container {\n  background-color: #0f0;\n}\n```\n\n`@for`\n\nThe `@for`\
    \ directive is used to output styles by means of looping. Using the `@for` loop,\
    \ you can adjust styles based on the value of the counter. There are two variations\
    \ of this:\n\n*   Using `through` (`$counter` from `<start_value>` through `<end_value>`)\n\
    *   Using `to` (`$counter` from `<start_value>` to `<end_value>`)\n\nWhen `<start_value>`\
    \ is greater than `<end_value>`, the counter will decrement. The main difference\
    \ between `through` and `to` is that the former one includes the `<end_value>`\
    \ while the latter one doesn’t. See [Listings 2-49](#9781484213483_Ch02.xhtml#FPar49)\
    \ through [2-52](#9781484213483_Ch02.xhtml#FPar52).\n\n[***Listing 2-49***](#9781484213483_Ch02.xhtml#_FPar49).\
    \ Example of Using `@for` with `through`\n\n```\n@for $size from 1 through 3 {\n\
    \  .header-#{$size} { font-size: 2em * $size; }\n}\n```\n\n***Listing 2-50***.\
    \ Output of [Listing 2-49](#9781484213483_Ch02.xhtml#FPar49)\n\n```\n.header-1\
    \ {\n  font-size: 2em;\n}\n\n.header-2 {\n  font-size: 4em;\n}\n\n.header-3 {\n\
    \  font-size: 6em;\n}\n```\n\n[***Listing 2-51***](#9781484213483_Ch02.xhtml#_FPar51).\
    \ Example of Using `@for` with `to`\n\n```\n@for $size from 1 to 3 {\n  .header-#{$size}\
    \ { font-size: 2em * $size; }\n}\n```"
  raw: '[***Listing 2-40***](#9781484213483_Ch02.xhtml#_FPar40). Example showing Multiplication


    ```

    .container{ width: 80%*40%;}

    ```


    Division


    Division can be done as shown in [Listing 2-41](#9781484213483_Ch02.xhtml#FPar41).


    [***Listing 2-41***](#9781484213483_Ch02.xhtml#_FPar41). Example showing Division


    ```

    .container{ width: 80%/40%;}

    ```


    Parentheses


    In Sass, parentheses are used to manipulate the order of execution, as shown in
    [Listing 2-42](#9781484213483_Ch02.xhtml#FPar42).


    [***Listing 2-42***](#9781484213483_Ch02.xhtml#_FPar42). Parentheses in Action


    ```

    .leftSide{

            Font-size:1em + (.2em*2);

    }

    ```


    ***Listing 2-43***. Output of [Listing 2-42](#9781484213483_Ch02.xhtml#FPar42)


    ```

    .leftSide{

            Font-size:1.4em;

    }

    ```


    Calculations Using Variables


    Calculations can be performed with variables as well. Check out [Listing 2-44](#9781484213483_Ch02.xhtml#FPar44).


    [***Listing 2-44***](#9781484213483_Ch02.xhtml#_FPar44). Example of Performing
    Calculations Using Variables


    ```

    $container:100%;

    $contentArea:50%;

    $gutter:10%;

    .sidebar{

      width: $container - ($contentArea+$gutter);

    }

    ```


    Control Directives


    Sass provides control directives for including styles or bringing some variations
    in styles based on some condition.


    Control directives are complex and aren’t typically used on a daily basis. They
    are mainly used in mixins in order to make them flexible. This is commonly seen
    in mixins within libraries like Compass, which is covered in coming chapters.


    @if


    This control directive takes an expression and applies the associated style if
    the expression evaluates to something other than false or null, as shown in [Listing
    2-45](#9781484213483_Ch02.xhtml#FPar45).


    [***Listing 2-45***](#9781484213483_Ch02.xhtml#_FPar45). Example of Using @if


    ```

    $isVisible : true !default;

    .container{

      @if $isVisible{

        display: block;

      }

      @else{

        display: none;

      }

    }

    ```


    In the previous code, $isVisible is evaluated inside .container and, depending
    on the result, a style is applied.


    ***Listing 2-46***. Output of [Listing 2-45](#9781484213483_Ch02.xhtml#FPar45)


    ```

    .container {

      display: block;

    }

    ```


    @if can be combined with one or more @else if statements and one @else statement.
    [Listing 2-47](#9781484213483_Ch02.xhtml#FPar47) shows an example where the background
    color is applied in hex code based on the color specified in the text form.


    [***Listing 2-47***](#9781484213483_Ch02.xhtml#_FPar47). Combination of @if, @else
    if, and @else


    ```

    $blockColor: green;

    .container {

      @if $blockColor == red {

        background-color: #f00;

      } @else if $blockColor == green {

        background-color: #0f0;

      } @else if $blockColor == blue {

        background-color: #00f;

      } @else {

        background-color: #000;

      }

    }

    ```


    ***Listing 2-48***. Combination of @if, @else if, and @else


    ```

    .container {

      background-color: #0f0;

    }

    ```


    @for


    The @for directive is used to output styles by means of looping. Using the @for
    loop, you can adjust styles based on the value of the counter. There are two variations
    of this:


    *   Using through ($counter from <start_value> through <end_value>)

    *   Using to ($counter from <start_value> to <end_value>)


    When <start_value> is greater than <end_value>, the counter will decrement. The
    main difference between through and to is that the former one includes the <end_value>
    while the latter one doesn’t. See [Listings 2-49](#9781484213483_Ch02.xhtml#FPar49)
    through [2-52](#9781484213483_Ch02.xhtml#FPar52).


    [***Listing 2-49***](#9781484213483_Ch02.xhtml#_FPar49). Example of Using @for
    with through


    ```

    @for $size from 1 through 3 {

      .header-#{$size} { font-size: 2em * $size; }

    }

    ```


    ***Listing 2-50***. Output of [Listing 2-49](#9781484213483_Ch02.xhtml#FPar49)


    ```

    .header-1 {

      font-size: 2em;

    }


    .header-2 {

      font-size: 4em;

    }


    .header-3 {

      font-size: 6em;

    }

    ```


    [***Listing 2-51***](#9781484213483_Ch02.xhtml#_FPar51). Example of Using @for
    with to


    ```

    @for $size from 1 to 3 {

      .header-#{$size} { font-size: 2em * $size; }

    }

    ```'
