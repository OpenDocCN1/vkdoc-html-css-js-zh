    \ #BBB;\n}\n```\n\n## Textfield Placeholder\n\nThe last example you will see is\
    \ styling the input field’s placeholder text. This is demonstrated in [Listing\
    \ 5-59](#9781484213483_Ch05.xhtml#FPar60) with the use of the input-placeholder\
    \ mixin.\n\n[***Listing 5-59***](#9781484213483_Ch05.xhtml#_FPar60). Example of\
    \ Styling an Input Field Placeholder\n\n```\n// Code for styling input placeholder\n\
    input[type=\"text\"] {\n   font-size:15px;\n   @include input-placeholder {\n\
    \      color: #AAA;\n      font-weight: bold;\n      font-size: 15px;\n   }\n\
    }\n```\n\n***Listing 5-60***. Output of [Listing 5-59](#9781484213483_Ch05.xhtml#FPar60)\n\
    \n```\n/* line 138, ../sass/screen.scss */\ninput[type=\"text\"] {\n  font-size:\
    \ 15px;\n}\n/* line 61, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/css3/_user-interface.scss\
    \ */\ninput[type=\"text\"]:-moz-placeholder {\n  color: #AAA;\n  font-weight:\
    \ bold;\n  font-size: 15px;\n}\n/* line 64, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/css3/_user-interface.scss\
    \ */\ninput[type=\"text\"]::-moz-placeholder {\n  color: #AAA;\n  font-weight:\
    \ bold;\n  font-size: 15px;\n}\n/* line 67, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/css3/_user-interface.scss\
    \ */\ninput[type=\"text\"]:-ms-input-placeholder {\n  color: #AAA;\n  font-weight:\
    \ bold;\n  font-size: 15px;\n}\n/* line 56, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/css3/_user-interface.scss\
    \ */\ninput[type=\"text\"]::-webkit-input-placeholder {\n  color: #AAA;\n  font-weight:\
    \ bold;\n  font-size: 15px;\n}\n```\n\nThis mixin automatically generates the\
    \ appropriate vendor-prefixed code, which makes implementing such features very\
    \ easy.\n\n***Listing 5-61***. HTML code for [Listing 5-60](#9781484213483_Ch05.xhtml#FPar60)\n\
    \n```\n<input name='input' placeholder='This is styled input place holder' type='text'>\n\
    ```\n\n![9781484213483_Fig05-19.jpg](OEBPS/Images/9781484213483_Fig05-19.jpg)\n\
    \n**Figure 5-19.** Output of [Listing 5-53](#9781484213483_Ch05.xhtml#FPar54)\n\
    \n## Image-url( )\n\nIn CSS, you need to specify relative paths when you specify\
    \ background images. This is simplified by Compass. Compass provides features\
    \ by which you can define paths for all the images in `config.rb` and then while\
    \ specifying the background image just use the image name. This is demonstrated\
    \ in the following listings.\n\n***Listing 5-62***. `config.rb` for `image-url()`\n\
    \n```\n# Set this to the root of your project when deployed:\nhttp_path = \"../\"\
    \ncss_dir = \"stylesheets\"\nsass_dir = \"sass\"\nimages_dir = \"images\"\njavascripts_dir\
    \ = \"javascripts\"\n```\n\n[Listing 5-63](#9781484213483_Ch05.xhtml#_FPar64).\
    \ Example demonstrating `image-url()`\n\n```\n// Background image using image-url\n\
    .bgImage{\n   width:128px;\n   height:128px;\n   background:image-url(\"facebook.png\"\
    );\n}\n```\n\nIn this code, `image-url` will automatically add the relative path\
    \ to the background image.\n\n[***Listing 5-64***](#9781484213483_Ch05.xhtml#_FPar65).\
    \ Output of [Listing 5-63](#9781484213483_Ch05.xhtml#FPar64)\n\n```\n/* line 148,\
    \ ../sass/screen.scss */\n.bgImage {\n  width: 128px;\n  height: 128px;\n  background:\
    \ url('../images/facebook.png?1447046278');\n}\n```\n\n## Image-width()\n\nInstead\
    \ of manually finding out the width of the background image, you can use the `image-width`\
    \ function provided by Compass.\n\nThis function takes the input of the background\
    \ image path/name and returns the width in units of `px`. This is demonstrated\
    \ in [Listing 5-65](#9781484213483_Ch05.xhtml#FPar66).\n\n[***Listing 5-65***](#9781484213483_Ch05.xhtml#_FPar66).\
    \ Example of Using `image-width`\n\n```\n// Background image using image-url\n\
    .bgImage{\n  width:image-width(\"facebook.png\");\n  height:128px;\n  background:image-url(\"\
    facebook.png\");\n}\n```\n\nThe output of this is same as in [Listing 5-64](#9781484213483_Ch05.xhtml#FPar65).\n\
    \n## Image-height()\n\nSimilar to the `image-width` function, you have `image-height`\
    \ function that returns the height of the image passed to it. This is demonstrated\
    \ in [Listing 5-66](#9781484213483_Ch05.xhtml#FPar67).\n\n[***Listing 5-66***](#9781484213483_Ch05.xhtml#_FPar67).\
    \ Example of Using `image-height`\n\n```\n// Background image using image-url\n\
    .bgImage{\n  width:image-width(\"facebook.png\");\n  height:image-height(\"facebook.png\"\
    );\n  background:image-url(\"facebook.png\");\n}\n```\n\nThe output of this is\
    \ the same as [Listing 5-64](#9781484213483_Ch05.xhtml#FPar65).\n\n## Image Sprites\
    \ and Compass"
