    \  Background-color:rgba(255,0,0,0.5);\n}\n.error {\n          @extend .notification;\n\
    \        @extend .errorLooks;\n}\n```\n\n**代码清单 3-16**。代码清单 3-15 的输出\n\n```css\n\
    .notification, .error {\n  border-radius: 5px;\n  padding: 5px;\n}\n\n.errorLooks,\
    \ .error {\n  Color: #F00;\n  Background-color: rgba(255, 0, 0, 0.5);\n}\n```\n\
    \n你也可以通过在下一个选择器中扩展选择器来进行链式操作，如代码清单 3-17 所示。\n\n**代码清单 3-17**。`@extend` 中的链式操作\n\
    \n```css\n.notification {\n          border-radius: 5px;\n          padding: 5px;\n\
    }\n.errorLooks{\n  @extend .notification;\n        Color:#F00;\n        Background-color:rgba(255,0,0,0.5);\n\
    }\n.error {\n  @extend .errorLooks;\n}\n```\n\n**代码清单 3-18**。代码清单 3-17 的输出\n\n\
    ```css\n.notification, .errorLooks, .error {\n  border-radius: 5px;\n  padding:\
    \ 5px;\n}\n\n.errorLooks, .error {\n  Color: #F00;\n  Background-color: rgba(255,\
    \ 0, 0, 0.5);\n}\n```\n\n## `@extend` 幕后原理\n\n继承并不像看起来那么简单。理解扩展是如何工作的，能让你深入了解选择器是如何被继承的，从而让你能够预测输出结果。\n\
    \n让我们使用上一节中的例子。`@extend` 背后的原理是：如果 `.error` 扩展了 `.notification`，那么在最终样式表中，`.error`\
    \ 的每个实例都将被替换为 `.notification, .error`。\n\n关于 `@extend`，有两件事你应该牢记：\n\n*   与功能类似的\
    \ mixin 相比，继承生成的 CSS 相对较少。它只是将选择器添加到一个逗号分隔的列表中，而不会克隆属性。\n*   层叠（Cascading）对继承的适用方式与普通\
    \ CSS 相同。当两个具有不同值的规则应用于同一个元素时，层叠规则决定应用哪个规则。因此，总是应用最后一个规则。\n\n## 何时使用选择器继承\n\n\
    假设你正在开发一个网页并编写样式规则，你发现你的一个类（`.errorLooks`）是另一个类（`.notification`）的更具体版本。你会如何编写样式规则？\n\
    \n*   你可以在这两个类中复制相同的样式规则。但这会导致大量重复代码，违背了 DRY 原则。\n*   你可以将样式应用于一组选择器（`.notification,\
    \ .error`）。这很好，但随着时间的推移，会增加样式代码的复杂性。\n*   你可以使用 Sass 提供的 `@extend`，让 `.error`\
    \ 继承 `.notification`。这使代码更具可读性，也更容易理解。\n\n## 占位符选择器\n\n在使用 Sass 时，你可能会遇到这样的情况：你想编写一些类，用于被其他类扩展，但又不希望它们被渲染到最终编译的\
    \ CSS 文件中。例如，你想使用一个包含圆角或边距代码的类，但这个类本身并没有独立用途。\n\n在 Sass 中，可以通过一种称为占位符选择器的方式来实现这一点，方法是在类名前加上\
    \ `%` 前缀——例如 `%notification`。\n\n**代码清单 3-19**。`@extend` 选择器的示例\n\n```scss\n%notification\
    \ {\n          border-radius: 5px;\n          padding: 5px;\n}\n.errorLooks{\n\
    \  @extend %notification;\n}\n```\n\n**代码清单 3-20**。代码清单 3-19 的输出\n\n```css\n.errorLooks\
    \ {\n  border-radius: 5px;\n  padding: 5px;\n}\n```\n\n正如你在代码清单 3-20 中所见，`notification`\
    \ 这个扩展类并未出现在最终输出中。\n\n## 使用 `@extend` 做更多事\n\n类并不是唯一可以被扩展的元素。也可以扩展像 `a:hover`、`.notification`\
    \ 和 `.error` 这样的复杂元素，如代码清单 3-21 所示。\n\n**代码清单 3-21**。演示扩展复杂元素的示例\n\n```scss\n\
    a{\n  color:#F00;\n  &:hover{\n    font-weight:bold;\n  }\n}\n.notification{\n\
    \        @extend a:hover ;\n}\n```\n\n也可以在一个选择器中通过扩展多个 CSS 类来创建多个规则，如代码清单 3-22\
    \ 所示。\n\n**代码清单 3-22**。演示扩展多个类的示例\n\n```scss\n.notification{\n        Border-radius:50%;\n\
    }\n.strongText{\n        Font-weight:bold;\n}\n.error{\n        @extend .notification;\n\
    \        @extend .strongText;\n        Color:#F00;\n}\n```\n\n这段代码将产生如代码清单 3-23\
    \ 所示的输出。\n\n**代码清单 3-23**。代码清单 3-22 的输出\n\n```css\n.notification, .error {\n \
    \ Border-radius: 50%;\n}\n\n.strongText, .error {\n  Font-weight: bold;\n}\n\n\
    .error {\n  Color: #F00;\n}\n```\n\n在扩展时也可以链式操作选择器；也就是说，扩展一个已经扩展了另一个选择器的选择器。以下是代码清单\
    \ 3-24 中修改后的代码，用于演示这种现象。\n\n**代码清单 3-24**。演示 `@extend` 链式操作的示例\n\n```scss\n.notification{\n\
    \        Border-radius:50%;\n}\n.strongText{\n  @extend .notification;\n     \
    \   Font-weight:bold;\n}\n.error{\n        @extend .strongText;\n        Color:#F00;\n\
    }\n```\n\n这段代码的输出与代码清单 3-23 所示相同。\n\n有时可能会遇到这种情况：如果被扩展的选择器出错或不存在，你希望 `@extend`\
    \ 被忽略。在这种情况下，你可以使用 `!optional` 标志。这将阻止 `@extend` 产生结果。这在代码清单 3-25 中进行了演示。\n\n\
    **代码清单 3-25**。展示 `!optional` 的示例\n\n```scss\n.success{\n  @extend .lightText !optional;\n\
    }\n```\n\n## `@at-root`\n\nSass 的 `@at-root` 指令会使其内部的规则被渲染到文档的根级别，无论它们原本嵌套在何处。参见代码清单\
    \ 3-26。\n\n**代码清单 3-26**。`@at-root` 的示例\n"
