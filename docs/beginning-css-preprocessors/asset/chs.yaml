- '# 简介


  CSS 预处理器在几年前开始流行。这个概念让我着迷：允许使用包含变量、函数、混入（mixins）等一或多个特性的预处理器文件。在开发完成后，这些特殊文件会被编译成所有
  Web 浏览器都能理解的常规 CSS 文件。




  '
- '# 排版后的内容


  “如果没坏，就别修”，秉持着这一信条，我曾一度避免使用 CSS 预处理器。我最初的想法是：“为什么要在我的工作流中增加不必要的流程呢？”此外，我也担心陡峭的学习曲线，而命令行界面则给了我另一个拒绝
  CSS 预处理器的理由。


  最终，在观看了一些播客并阅读了大量文章后，我豁然开朗。这让我意识到：“哇，我应该把这项技术融入我的工作流中！”


  从那时起，我就在项目中开始使用 `Sass` 和 `Less`，它们似乎让我的开发工作变得简单高效得多。通过本书，你将了解这两种预处理器是如何工作的。


  你将首先学习预处理器的概念及其工作原理。你还会了解市面上几种流行的预处理器。接着，我们将探讨一些基于图形用户界面的工具，这些工具适用于不熟悉命令行界面的用户。


  随着章节的深入，你将全面了解这两种预处理器——`Sass` 和 `Less`，并学习一个基于 `Sass` 的流行框架 `Compass`。


  本书分享的知识将帮助你提高生产力，编写出可维护且可扩展的 CSS 代码。


  '
- "# 第一章\n\n![image](img/frontdot.jpg)\n\n## 预处理器简介\n\n`HTML5` 和 `CSS3` 正在改变网页的设计方式。`CSS3`\
  \ 为 Web 开发者提供了诸如渐变、过渡和动画等高级特性。然而，这些新特性也增加了 CSS 代码的复杂性，使其更难以维护。\n\n除了 `CSS3` 引入的复杂性，随着时间的推移，手写\
  \ CSS 可能会变得痛苦，因为程序员不得不反复执行许多相同的操作（例如在 CSS 中查找颜色值以及声明外边距/内边距）。这些微小的重复性任务累积起来，造成了相当程度的低效率。预处理器正是解决这些以及其他低效问题的方案。\n\
  \nCSS 预处理器通过引入现代编程语言的概念来扩展 CSS。要使用 `Sass`（语法上很棒的样式表），你必须先掌握如何用 CSS 编码。CSS 预处理器允许你在编写\
  \ CSS 时使用变量、函数、运算，甚至是规则或选择器的嵌套。通过 CSS 预处理器，你可以将“不要重复自己”（DRY）原则应用到你的 CSS 代码中。遵循 DRY\
  \ 原则有助于避免代码重复。\n\n## 什么是预处理器？\n\n预处理器接收一种形式的数据并将其转换为另一种形式。在 CSS 的语境下，`Less` 和 `Sass`\
  \ 是流行的预处理器语言，它们接收 `Less` 或 `SCSS` 格式的输入，并生成处理后的 CSS。\n\n这些 CSS 预处理器通过消除低效之处，使网站的构建更简单、更符合逻辑，从而增强了\
  \ CSS 的能力。预处理器的流行也催生了基于它们的各种框架；其中较为流行的一个是 `Compass`。\n\n图 1-1 展示了预处理器是如何获取预处理格式的文件并将其转换为浏览器能理解的\
  \ CSS 的。\n\n![9781484213483_Fig01-01.jpg](img/9781484213483_Fig01-01.jpg)\n\n图 1-1.\
  \ 预处理器友好的文件被转换为普通 CSS\n\n借助预处理器，你可以像使用 `PHP` 或 `JavaScript` 等其他语言一样来组织 CSS。因此，预处理器给开发者带来了安心。它让你编写出的代码具有前瞻性且易于维护，从而节省时间和精力。\n\
  \n预处理器是 CSS 的扩展，这意味着有效的 CSS 代码也是有效的预处理器代码。熟悉 CSS 的开发者在学习任何预处理器时都不会有任何学习曲线。\n\n##\
  \ 为什么使用预处理器？\n\nCSS 使用声明式编程形式。这意味着你在代码中编写的样式会直接被浏览器使用，无需任何编译。\n\n许多开发者更倾向于手写样式表。他们认为预处理器会给他们的工作流增加额外的复杂性，或者存在陡峭的学习曲线。但实际上，CSS\
  \ 预处理器能让你的日常工作轻松很多。本书将向你展示预处理器如何在不干扰你工作流的情况下，更高效地编写 CSS。\n\n让我们考虑一个例子：你需要逐个查找并替换站点范围内使用的某个颜色的多个实例。如果\
  \ CSS 能简化这个过程，岂不是很棒？类似于清单 1-1 所示就是一个例子。\n\n**清单 1-1. 颜色可复用变量**\n\n```\n$site-color:#eee;\n\
  \na {\n        color: $site-color;\n}\n#topBar {\n        background-color: $site-color;\n\
  \        color:#fff;\n}\n```\n\n使用预处理器，只需更改一个地方的值就能改变整个样式表。如清单 1-2 所示。\n\n**清单 1-2.\
  \ 清单 1-1 的输出**\n\n```\na {\n  color: #eee;\n}\n\n#topBar {\n  background-color:\
  \ #eee;\n  color: #fff;\n}\n```\n\n让我们再考虑一个代码重复的例子。很多时候，样式表中会有多个地方使用相同的代码块，如清单 1-3\
  \ 所示。\n\n**清单 1-3. 重复的代码块**\n\n```\np{\n        padding-bottom:45px;\n        text-align:center;\n\
  }\nfooter {\n        padding-bottom:45px;\n        text-align:center;\n}\n```\n\n\
  使用预处理器，你可以将这些冗余的规则放入一个*混入 (mixin)* 中，该混入只需定义一次，并可按需引入。如清单 1-4 所示。\n\n**清单 1-4. 在预处理器中创建和使用可复用代码块**\n\
  \n```\n@mixin containerSettings {\n        padding-bottom: 45px;\n        text-align:center;\n\
  }\np {\n        @include containerSettings;\n}\nfooter {\n        @include containerSettings;\n\
  }\n```\n\n**清单 1-5. 清单 1-4 的输出**\n\n```\np {\n  padding-bottom: 45px;\n  text-align:\
  \ center;\n}\n\nfooter {\n  padding-bottom: 45px;\n  text-align: center;\n}\n```\n\
  \n作为所有预处理器基础的 CSS，在理解不同属性的工作原理、层叠机制、浏览器对各种属性的支持、选择器、怪癖行为等方面，本身就有一个陡峭的学习曲线。除了前述所有要点之外，还要考虑到在当今复杂的界面中维护样式表也是一个巨大的挑战。\n\
  \n大多数时候，样式表都非常重复，充斥着属性或属性组等。典型的 CSS 文件是一个线性文档。这足以让来自面向对象领域的程序员抓狂。\n\n根据 DRY 原则：*系统中的每一份知识都必须有单一、明确、权威的表述。*\n\
  \n对此最简单的解释是，代码中的冗余可能导致失败，并给开发者带来困惑。CSS 不遵循 DRY 原则。大多数时候，CSS 文件会包含重复的规则、声明和值。开发者不断地在样式表中编写相同的代码片段。\n\
  \nCSS 缺乏其他所有编程语言都具备的特性，如变量、符号常量、条件语句、基于变量的表达式等。\n\nCSS 预处理器位于你的预处理器友好文件和将提供给浏览器的已编译\
  \ CSS 文件之间。CSS 预处理器允许你按照 DRY 原则编写代码，使其更快速、高效且易于维护。然后，代码通过命令行或应用程序被编译成常规的 CSS 文件。\n\
  \n\n\n\n"
- "# 排版后的内容\n\n参考代码清单 1-6 中的示例。现代浏览器支持 `RGBA`（红绿蓝透明度）和 `HSLA`（色相饱和度亮度透明度）颜色值。不过，你需要为旧版浏览器提供降级方案。常见的做法是先声明一个十六进制颜色值，再声明\
  \ `RGBA` 或 `HSLA` 颜色值。\n\n***代码清单 1-6***。使用 CSS 在所有浏览器中支持新的颜色格式\n\n```\n.container\
  \ {\n  background-color: #000;\n  background-color: rgba(0,0,0, 0.9);\n}\n```\n\n\
  使用预处理器可以轻松完成这项工作。如果使用 `Sass` 预编译器完成同样的任务，则可按照代码清单 1-7 所示进行操作。\n\n***代码清单 1-7***。代码清单\
  \ 1-6 的 `Sass` 版本\n\n```\n$black:#000;\n.container {\n        background-color:\
  \ $black;\n        background-color: rgba($black, 0.9);\n}\n```\n\n预处理器会为你完成所有与\
  \ `RGBA` 值相关的计算。\n\n随着现代浏览器对 `CSS3` 的支持，人们不再大量使用图片，转而采用纯 `CSS`。然而，每种浏览器对这些功能的实现方式各有不同，因此需要添加浏览器厂商前缀并使用不同的语法。你可以在代码清单\
  \ 1-8 中看到一个简单的示例。\n\n***代码清单 1-8***。针对不同浏览器的 `CSS` 特性实现\n\n```\n.container {\n        -webkit-border-radius:\
  \ 10px;\n        -moz-border-radius: 10px;\n        -ms-border-radius: 10px;\n        -o-border-radius:\
  \ 10px;\n        border-radius: 10px;\n}\n```\n\n预处理器通过允许你将这段代码声明为一个可重用的组件（称为 *mixin*，将在后续章节中介绍），然后直接在代码中使用它，从而让这项工作变得更加轻松。\n\
  \n此示例假设这个可重用的 mixin 名为 `rounded-corners`。在 `Sass` 预处理器中，相应的代码如代码清单 1-9 所示。\n\n***代码清单\
  \ 1-9***。使用 `Sass` 预处理器实现代码清单 1-8 的代码\n\n```\n.container {\n  @include rounded-corners(4px);\n\
  }\n```\n\n到目前为止，你已经了解了预处理器如何帮助编写 `CSS` 代码。现在，我们来考虑一下预处理器如何在后编码阶段提供帮助。压缩 `CSS` 可以减小其原始大小，从而缩短加载时间。这可以通过在线工具或编辑器插件来实现。\n\
  \n然而，预处理器可以通过多种方式编译成 `CSS`，其中一种方式就是压缩。预处理器可以配置为：每当保存预处理器文件时，自动编译为 `CSS` 并压缩。这使得它可以直接用于生产环境。\n\
  \n## 关于 CSS 预处理器的常见误解\n\n本节将讨论一些常见的误解，这些误解阻碍了开发者在日常工作中采用预处理器。\n\n### 你必须成为命令行专家\n\
  \n许多开发者害怕使用命令行。使用预处理器几乎不需要多少命令行知识。事实上，你只需要学习一条命令。此外，还有一些应用程序可以在不接触命令行的前提下完成同样的任务。\n\
  \n### 你必须改变编写 CSS 的方式\n\n开发者有自己编写和组织样式表的方式。由于 `SCSS` 语法与 `CSS` 相同，开发者无需改变他们一直以来编写\
  \ `CSS` 的方式。\n\n### 为什么不直接编写 CSS？\n\n许多开发者初次接触 `CSS` 预处理器时的反应是：“直接编写 `CSS` 有什么问题？我们日常都在用\
  \ `CSS`，可以解决所有常见的布局问题，并开发出在所有设备上都能正常运行的响应式网站。”\n\n其实，预处理器本身并不能生成更好的 `CSS`。例如，如果你缺乏如何正确使用\
  \ `CSS` 的知识，那么预处理器也帮不上什么忙。预处理器通过遵循 **DRY**（不要重复自己）原则，帮助你以更快速、更易于维护的方式编写 `CSS`。\n\
  \n\n\n\n## 已知的预处理器有哪些？\n\n让我们来看一下当今一些已知的预处理器，如图 1-2 所示。\n\n![9781484213483_Fig01-02.jpg](img/9781484213483_Fig01-02.jpg)\n\
  \n图 1-2。已知的预处理框架\n\n### Sass\n\n`Sass`（Syntactically Awesome Stylesheets，语法上令人惊艳的样式表）是最著名的预处理器，已经存在了八年之久。`Sass`\
  \ 是一种预处理器语言，最初由 Hampton Catlin 和 Natalie Weizenbaum 设计和开发。\n\n当 `SassScript` 被编译时，它会根据\
  \ `Sass` 文件中指定的规则，为各个选择器生成相应的 CSS 规则。`Sass` 可以监视 `.sass` 或 `.scss` 文件，并在这些文件被保存时自动生成输出的\
  \ `.css` 文件。\n\n`Sass` 是开源的，并使用 Ruby 编写。\n\n### Less\n\n与 `Sass` 类似，`Less` 是另一种流行的\
  \ CSS 预处理器。它通过提供混入（mixins）、变量和嵌套样式规则来增强默认的 CSS 语法。它很容易设置。你也可以在 HTML 文档中引用它的 JavaScript\
  \ 文件并开始使用。\n\n`Less` 因其简洁性吸引了非常庞大的用户群。`Less` 是开源的。其初始版本是用 Ruby 编写的，但后续版本是用 JavaScript\
  \ 编写的。有效的 CSS 代码也是有效的 `Less` 代码，因为 `Less` 遵循相同的语义。\n\n`Less` 与其他 CSS 预处理器的主要区别在于，`Less`\
  \ 允许通过 `less.js` 在浏览器中进行实时编译。\n\n### Compass\n\n`Compass` 是一个开源的 CSS 编写框架。`Compass`\
  \ 基于 `Sass`，因此可以使用 `Sass` 的所有特性。它非常流行，并且正处于活跃的开发阶段。使用 `Compass`，开发者可以编写更简洁的标记，而无需使用表示性的类。\n\
  \n`Compass` 包含了大量开发者最常使用的可复用模式。\n\n与 `Compass` 齐名的是 `Bourbon`，它由 Thoughtbot 公司使用\
  \ `Sass` 为 `Sass` 构建。`Bourbon` 是一个为 `Sass` 提供的简单轻量级混入库。\n\n接下来讨论 `Compass` 提供的一些关键特性。\n\
  \n### 混入（Mixins）\n\n`Compass` 和 `Bourbon` 都为各种 CSS3 特性提供了大量的混入集合，你将在后续章节中详细了解。这意味着开发者无需担心浏览器厂商前缀或\
  \ CSS 技巧。清单 1-10 演示了关于盒子大小调整的混入使用。\n\n***清单 1-10***。展示使用 Compass 提供的混入的示例\n\n```\n\
  el{\n        @include box-sizing(border-box);\n}\n```\n\n### 排版\n\n`Compass` 和 `Bourbon`\
  \ 都包含与排版相关的混入、变量和函数。`Compass` 带有大量变量和几个混入。\n\n在这一领域，`Compass` 的一个特性是它还能使用带有 `px`\
  \ 回退方案的 `rem` 单位。\n\n***清单 1-11***。展示使用 Compass 排版功能的示例\n\n```\nel{\n        @include\
  \ adjust-font-size-to(42px);\n}\n```\n\n### 辅助工具\n\n`Compass` 提供的一个功能是辅助工具。辅助工具可以节省时间，因为它们是预定义的\
  \ CSS 代码片段，你可以直接在样式表中使用。\n\n例如，`Compass` 提供了一个用于清除浮动的辅助工具、一个重置工具（带有多种选项）、一些图像替换技术等。\n\
  \n`Bourbon` 将这些辅助工具称为附加组件，但其数量比 `Compass` 少。\n\n### 精灵图（Sprites）\n\n由于 `Compass`\
  \ 部分是用 Ruby 构建的，因此它可以与文件系统交互。它能够做到的事情之一就是根据一个图像文件夹构建精灵图。\n\n***清单 1-12***。展示 Compass\
  \ 构建精灵图的简单方法的示例\n\n```\n@import \"icon/*.png\";\n@include all-icon-sprites;\n```\n\
  \n它还提供了 `image-width()`、`image-height()` 和 `inline-image()` 等函数，用于将图像文件编码为 Base64\
  \ 格式。\n\n## 预处理器的特性\n\n本节将介绍预处理器的一些常见特性，与直接使用 CSS 相比，这些特性使它们成为开发者出色的工具。你将看到一些上下文示例。这些示例使用了两个著名的预处理器——`Sass`\
  \ 和 `Less`——你将在后续章节中详细学习它们。\n\n### 变量\n\n\n\n### 变量\n\n变量帮助你存储在样式表中需要复用的信息。像颜色、字体样式或任何\
  \ CSS 样式都可以被存储和复用。例如，在 Sass 中，使用`$`符号来声明一个变量。\n\n***列表 1-13***：使用 SASS 实现变量的示例\n\
  \n```\n$text-color:#333;\nbody {\n        color:$text-color;\n}\n```\n\n当这段代码被编译时，它会获取为`$text-color`定义的变量，并输出普通的\
  \ CSS，其中变量的值会被填入 CSS 中。这在处理适用于整个站点的属性并保持其一致时非常有用。\n\n***列表 1-14***：上述代码片段的输出\n\n\
  ```\nbody {\n        color:#333;\n}\n```\n\n类似地，在 Less CSS 中，使用`@`符号来声明一个变量。\n\n\
  ***列表 1-15***：使用 Less 实现变量的示例\n\n```\n@text-color:#333;\nbody{\n        color:$text-color;\n\
  }\n```\n\n### 嵌套\n\n页面在 CSS 中的视觉层次不如在 HTML 中那么清晰。预处理器允许你像在 HTML 中那样嵌套 CSS 选择器。\n\
  \n***列表 1-16***：在 Sass 或 Less 中的嵌套示例\n\n```\nnav {\n  ul {\n    margin: 0 auto;\n\
  \    padding: 10px 15px;\n    list-height: 1em;\n  }\n}\n```\n\n生成的 CSS 将如列表 1-17\
  \ 所示。\n\n***列表 1-17***：上述代码片段的输出\n\n```\nnav ul {\n  margin: 0 auto;\n  padding:\
  \ 10px 15px;\n  list-height: 1em;\n}\n```\n\n### 导入\n\n预处理器的`@import`实现与 CSS 中的略有不同。Sass\
  \ 不会从服务器获取文件，而是获取指定的文件并将其合并到你正在导入的文件中。这会向 web 浏览器提供一个单一的 CSS 文件。\n\n假设你有两个 SCSS\
  \ 文件，名为`reset.scss`和`style.scss`，你想将`reset.scss`导入到`style.scss`中。这可以通过 Sass 实现；见列表\
  \ 1-18。\n\n***列表 1-18***：将一个文件的内容导入另一个文件的示例\n\n```\n@import 'reset';\nbody {\n \
  \       background-color: #efefef;\n}\n```\n\n![Image](img/sq.jpg)**注意** 在 Sass\
  \ 中导入文件时，无需指定文件扩展名。Sass 会自动识别合适的文件并将其导入。\n\n然而，在 Less 中，导入的行为因文件扩展名而异。如果导入的文件具有`.css`扩展名，它将被视为普通的\
  \ CSS 导入，编译时不会改变。如果它有其他扩展名，它将被视为 Less 文件并会被导入和合并。\n\n### 混合宏\n\n混合宏允许你创建可在样式表中复用的\
  \ CSS 声明片段。通过传递参数以及为这些参数设置默认值，可以进一步配置混合宏。当你想要重复使用厂商前缀语法时，混合宏最为有用。它们减少了繁琐的代码重写（见列表\
  \ 1-19 和 1-20）。\n\n***列表 1-19***：在 Sass 中带参数和默认值的圆角混合宏示例\n\n```\n@mixin rounded-corners($radius:5px)\
  \ {\n  -webkit-border-radius: $radius;\n     -moz-border-radius: $radius;\n    \
  \  -ms-border-radius: $radius;\n          border-radius: $radius;\n}\n\n.container\
  \ { @include rounded-corners(10px); }\n```\n\n***列表 1-20***：在 Less 中带参数和默认值的圆角混合宏示例\n\
  \n```\n.rounded-corners(@radius:5px) {\n  -webkit-border-radius: @radius;\n    \
  \ -moz-border-radius: @radius;\n      -ms-border-radius: @radius;\n          border-radius:\
  \ @radius;\n}\n\n.container { .rounded-corners(10px); }\n```\n\n### 扩展/继承\n\n预处理器允许你在一个或多个选择器之间共享一组\
  \ CSS 属性。这有助于你按照 DRY 原则编写预处理器代码。见列表 1-21 和 1-22。\n\n***列表 1-21***：在 Sass 中用于扩展的示例\n\
  \n```\n.messagebox {\n        font-size:1em;\n        line-height:40px;\n}\n\n.successBox\
  \ {\n        @extend .messagebox;\n        color:#0F0;\n}\n```\n\n***列表 1-22***：在\
  \ Less 中用于扩展的示例\n\n```\n.messagebox {\n        font-size:1em;\n        line-height:40px;\n\
  }\n\n.successBox {\n        &:extend(.messagebox);\n        color:#0F0;\n}\n```\n\
  \n### 运算符\n\n预处理器提供标准的数学运算符，以便你可以动态进行计算。见列表 1-23。\n\n***列表 1-23***：在 Sass 和 Less\
  \ 中展示数学运算的示例\n\n```\n.mainContent {\n  float: left;\n  width: 750px / 960px * 100%;\n\
  }\n```\n\n## CSS 预处理器的问题\n\n本节讨论被不当使用的预处理器特性。你将会看到因误用或过度使用预处理器特性而导致的最常见问题。\n\n###\
  \ 混合宏的问题\n\n混合宏是可复用的代码块，可以在需要时被调用。这避免了多次重写这些代码块。\n\n考虑一个用 Sass 预处理器编写的代码片段，如列表 1-24\
  \ 所示。\n\n***列表 1-24***：一个使用 Sass 的混合宏示例\n\n```\n@mixin notification {\n    color:\
  \ #fff;\n    border-radius: 50%;\n}\n\n.errorNotification {\n    @include notification;\n\
  \    background:#F00;\n}\n\n.successNotification {\n    @include notification;\n\
  \    background: #0F0;\n}\n```\n\n这段代码编译成列表 1-25。\n\n***列表 1-25***：列表 1-24 的输出\n\
  \n```\n.errorNotification {\n  color: #fff;\n  border-radius: 50%;\n  background:\
  \ #F00;\n}\n\n.successNotification {\n  color: #fff;\n  border-radius: 50%;\n  background:\
  \ #0F0;\n}\n```\n\n注意在列表 1-25 的输出中出现的代码重复。如果这个混合宏在整个样式代码中被广泛使用，将导致大量的代码冗余，从而增加文件大小。\n\
  \nSass 有一种其他预处理器不支持的方法——*扩展*。通过以逗号分隔的格式指定选择器，扩展代码可以同时设置多个选择器的相同属性。\n\n这种方法避免了重复；然而，如果扩展了太多选择器，可能会导致性能问题。生成的\
  \ CSS 将有许多逗号分隔格式的选择器，这可能导致性能问题。\n\n### 扩展选择器或使用混合宏可能妨碍维护\n\n扩展类或使用混合宏可能会导致维护问题。由于属性在不同的地方声明和使用，在没有完全预料影响的情况下修改属性的可能性很高。这可能导致布局在任何时候被破坏。\n\
  \n## 小结\n\n本章介绍了预处理器。你了解了它们如何影响你的工作流程，使其更高效，并在未来更易于维护。你还了解了目前市面上一些知名的预处理器。\n\n下一章将深入探讨\
  \ Sass，并讨论其各种特性。\n\n"
