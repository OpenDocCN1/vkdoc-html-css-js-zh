- "# Sass 简介\n\n在上一章中，你了解了预编译器，包括为什么使用它们，哪些是知名的预处理器，以及它们的特性。本章将介绍最流行的预处理器之一：Sass。\n\
  \n在本章中，你将探索 Sass 的以下方面：\n\n*   安装\n*   运行代码\n*   变量\n*   注释\n*   数据类型\n*   括号\n\
  *   嵌套规则\n*   嵌套属性\n*   引用父选择器\n*   插值\n*   占位符选择器\n*   逻辑及控制指令\n\n## 安装 Sass\n\n\
  \n\n你可以通过 Ruby gem 安装 Sass，因此首先需要确保机器上已安装 Ruby。如果你使用 Mac OS X，系统已预装 Ruby。如果使用 Windows\
  \ 或 Linux，则需要从 [`rubyinstaller.org/downloads/`](http://rubyinstaller.org/downloads/)\
  \ 下载并安装 Ruby。\n\n安装 Ruby 后，可以通过运行 `gem` 命令来安装 Sass。你可以将 `gem` 视为一种扩展工具，它能够扩展使用 Ruby\
  \ 的应用程序的功能。按照代码清单 2-1 所示的命令，即可在命令行中安装 Sass。该命令的简单解释是：“Ruby，请安装名为 sass 的 gem”。\n\n\
  ***代码清单 2-1***. 安装 Sass 的命令\n\n```\nsudo gem install sass\n```\n\n安装完成后，可以通过运行代码清单\
  \ 2-2 中的命令进行验证。\n\n***代码清单 2-2***. 验证 Sass 安装的命令\n\n```\nsass -v\n```\n\n这将会显示如图\
  \ **2-1** 所示的输出信息。\n\n![9781484213483_Fig02-01.jpg](img/9781484213483_Fig02-01.jpg)\n\
  \n图 2-1. `sass -v` 命令的输出\n\n完成此安装后，你就可以开始使用 Sass 了。\n\n## 查看其他版本的 Sass\n\n除了最新版本，你还可以通过执行代码清单\
  \ 2-3 所示的命令来查看其他可用版本。\n\n***代码清单 2-3***. 查看其他版本的 Sass\n\n```\ngem list sass –a –r\n\
  ```\n\n该命令要求 Ruby 列出所有名称中包含“sass”的 gem。其中，`-r` 命令属性指示 Ruby 进行远程检查，以获取所有可用的 Sass\
  \ 版本；`-a` 命令属性用于列出所有可用版本。\n\n该 `gem list` 命令的输出如代码清单 2-4 所示。\n\n***代码清单 2-4***.\
