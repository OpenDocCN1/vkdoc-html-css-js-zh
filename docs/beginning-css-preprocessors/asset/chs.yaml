- "# 使用 Less 进行开发\n\n在上一章中，你了解了可以用 Sass 做的各种事情，包括 mixins 等各种技术。在本章中，你将了解另一个同样著名的预处理器框架，名为\
  \ *Less*。\n\n本章将探讨 Less 的以下方面：\n\n*   Less 的客户端和服务端变体\n*   语言特性\n*   嵌套规则\n*   导入指令\n\
  *   Mixin 守卫\n*   引用父级选择器\n*   将 `&` 与守卫一起使用\n*   分离规则集\n*   合并属性\n*   循环 mixins\n\
  *   函数\n\n## Less 简介\n\nLess 是一种预处理器语言，会被编译成 CSS。它由 Alexis Sellier 创建。Less 遵循 Sass\
  \ 的“SCSS”语法风格，而后者又类似于 CSS 语法。Less 是开源的。Less 最初是用 Ruby 编写的；然而，在后续版本中，它被用 JavaScript\
  \ 重写。请注意，有效的 CSS 也是有效的 Less 代码。Less 提供了与你在上一章中看到的 Sass 类似的功能，例如变量、嵌套、运算符、mixins\
  \ 和函数；然而，使 Less 区别于其他 CSS 预编译器的是它能够通过浏览器中的 `less.js` 进行实时编译。\n\n与 Sass 不同，Less 有两种变体。Less\
  \ 有一个客户端变体，它在浏览器中编译 Less 代码；还有一个服务端变体，它在服务端编译文件，然后将其提供给浏览器。开发人员可以使用客户端变体来开发和测试代码。服务端变体可用于编译代码、压缩代码，然后使其可用于生产环境。\n\
  \n需要记住的一点是，客户端变体不会生成输出文件。它会在每次浏览器重新加载时编译代码。\n\n### Less 的客户端变体\n\n要使用 Less 的客户端变体，你需要下载名为\
  \ `less.js` 的客户端编译器，该编译器可在 [`lesscss.org/#download-options`](http://lesscss.org/#download-options)\
  \ 获取。下载完成后，将其复制到你的工作目录中。现在，让我们尝试使用这个 Less 编译器编写一些 Less 代码。\n\n***列表 4-1***. 示例的\
  \ HTML 标记\n\n```\n<html>\n        <head>\n                <title>列表 4-1</title>\n\
  \                <link type=\"text/css\" rel=\"stylesheet/less\" href=\"styles1.1.less\"\
  \ />\n                <script src=\"//cdnjs.cloudflare.com/ajax/libs/less.js/2.2.0/less.min.js\"\
  ></script>\n        </head>\n        <body>\n                <p class=\"impElement\"\
  >这是我的第一个 Less 代码</p>\n        </body>\n</html>\n```\n\n***列表 4-2***. `styles1.1.less`\
  \ 中的 Less 代码\n\n```\n.impElement{\n        background:#666;\n        padding:10px;\n\
  \        border-radius:10px;\n}\n```\n\n当你运行此页面时，输出将如图 4-1 所示。\n\n![9781484213483_Fig04-01.jpg](img/9781484213483_Fig04-01.jpg)\n\
  \n图 4-1. 列表 4-1 和 4-2 的输出\n\n![Image](img/sq.jpg) **注意** 在列表 4-1 提供的示例中，我们通过内容分发网络（CDN）链接了\
  \ `less.js`。要运行此代码，你需要一个 Web 服务器，否则 `less.js` 将无法加载。如果你希望在不运行 Web 服务器的情况下运行此示例，请下载\
  \ `less.js` 并在本地链接它。\n\n### 服务端变体\n\n客户端变体适用于开发和调试。但是，当部署到生产环境时，建议使用服务端变体——即将 Less\
  \ 代码编译成浏览器友好的 CSS。为此，你需要安装 `lessc` 编译器。可以使用 node 包管理器进行安装。\n\n如果你没有安装 node，则需要先安装它。安装\
  \ Node.js 的步骤在此处有详细说明：[`howtonode.org/how-to-install-nodejs`](http://howtonode.org/how-to-install-nodejs)。\n\
  \n完成 Node.js 的安装后，你就可以开始安装 `lessc` 编译器了。在终端中运行列表 4-3 中的命令。\n\n***列表 4-3***. 安装 `lessc`\
  \ 编译器的命令\n\n```\nnpm install -g less\n```\n\n你可以通过运行列表 4-4 中所示的命令来测试 `lessc` 是否安装成功。\n\
  \n***列表 4-4***. 检查 `lessc` 命令是否可用的命令\n\n```\nlessc -v\n```\n\n此命令将输出已安装的 `lessc`\
  \ 版本。既然 `lessc` 编译器已经安装，让我们来看一下编译 Less 文件的过程。\n\n#### 编译 Less 文件\n\n你可以使用列表 4-5\
  \ 中所示的命令来编译一个 Less 文件。\n\n***列表 4-5***. 调用 `lessc` 编译器的命令\n\n```\nlessc style.less\n\
  ```\n\n此命令将直接在终端中为你提供输出。如果你希望将输出保存到 `.css` 文件中，则需要修改命令，添加一个由空格分隔的第二个参数，如列表 4-6 所示。\n\
  \n***列表 4-6***. 调用 `lessc` 编译器并将输出保存到另一个文件的命令\n\n```\nlessc style.less style.css\n\
  ```\n\n可以使用各种选项来调用 `lessc` 编译器。列表 4-7 到 4-9 展示了一些支持的选项。\n\n***列表 4-7***. `-h` 选项用于获取\
  \ `lessc` 编译器的帮助\n\n```\nlessc -h\n```\n\n***列表 4-8***. `--include` 用于包含 Less 查找导入文件的路径\n\
  \n```\nlessc --include-path=framework/;lib/\n```\n\n可用的导入路径可以用 `:` 或 `;` 分隔的列表指定。\n\
  \n***列表 4-9***. 使用 `-l` 选项通过 `lessc` 编译器检查 Less 代码\n\n```\nlessc -l style.less\n\
  ```\n\n除了这些之外，在调用 `lessc` 编译器时还可以使用许多其他选项。可以在 Less 文档中找到它们：[`lesscss.org/usage/index.html#command-line-usage-command-line-usage`](http://lesscss.org/usage/index.html#command-line-usage-command-line-usage)。\n\
  \n在下一节中，你将了解该语言提供的特性。\n\n## 语言特性\n\n本节涵盖 Less 提供的所有特性。许多特性与你之前章节中学到的类似；因此，它们应该很容易理解。\n\
  \n### 变量\n\n\n\n"
- "# Less 变量与混入\n\n### 变量\n\n`Less`中的变量用于存储值，使这些值能够在代码中重复使用。通过变量，您可以从单一位置控制可复用的值。在`Less`中，使用`@`符号创建变量。这一点在\
  \ Listing 4-10 中进行了演示。\n\n**代码清单 4-10**. 声明和使用`Less`变量的示例\n\n```less\n@fontColor:#666;\n\
  body{\n        color:@fontColor;\n}\n```\n\n**代码清单 4-11**. 代码清单 4-10 的输出\n\n```css\n\
  body {\n  color: #666;\n}\n```\n\n变量的用途不仅限于赋值。它们还可以用于选择器、属性名称等位置。这可以通过插值（interpolation）实现，如代码清单\
  \ 4-12 所示。\n\n**代码清单 4-12**. 演示插值的示例\n\n```less\n@parent: container;\n.@{parent}\
  \ {\n  width:100%;\n}\n```\n\n**代码清单 4-13**. 代码清单 4-12 的输出\n\n```css\n.container\
  \ {\n  width: 100%;\n}\n```\n\n代码清单 4-14 至 4-18 展示了一些有效的变量声明示例。\n\n**代码清单 4-14**.\
  \ 变量声明的有效示例\n\n```less\n@color: red;\n@list: a b c d;\n@csv-list: a, b, c, d;\n\
  ```\n\n尽管变量类似于常量，但它们的值是可变的。它遵循一个简单的原则：后声明的变量生效。\n\n在`Less`中，变量遵循惰性加载（lazy loading）模式，如代码清单\
  \ 4-15 所示。惰性加载在技术上的含义是，对象可以在需要时才进行初始化。这与急加载（eager loading）相反，急加载要求在使用前完成初始化。\n\n\
  **代码清单 4-15**. 演示变量惰性加载的示例\n\n```less\n.container {\n        font-size: @size;\n\
  }\n@size: 12px;\n```\n\n**代码清单 4-16**. 代码清单 4-15 的输出\n\n```css\n.container {\n \
  \ font-size: 12px;\n}\n```\n\n从`Less`版本 1.7 开始，可以将一组属性存储到变量中。代码应放置在花括号内，类似于混入（mixin）的写法。这称为规则集（ruleset），如代码清单\
  \ 4-17 所示。\n\n**代码清单 4-17**. 演示存储和使用规则集的示例\n\n```less\n@disclaimer-ruleset: { color:\
  \ #CCC; font-size: 10px; };\n.disclaimer {\n        @disclaimer-ruleset();\n}\n\
  ```\n\n在代码清单 4-17 中，我们将一个规则集存储在变量中，并在`disclaimer`类内部使用它。代码清单 4-18 显示了渲染后的最终输出。\n\
  \n**代码清单 4-18**. 代码清单 4-17 的输出\n\n```css\n.disclaimer {\n  color: #CCC;\n  font-size:\
  \ 10px;\n}\n```\n\n### 注释\n\n注释有助于记录代码，使其更易于阅读和理解。您无需为了减小文件大小而减少注释数量。当文件被编译并生成最终的`CSS`代码时，注释会被移除。\n\
  \n在`Less`中添加注释的方式与`CSS`相同。注释写在`/* */`之间。您也可以使用`//`前缀来编写单行注释。\n\n有一种方法可以通知编译器某个特定注释是重要的，并且它应保留在最终编译版本中，如代码清单\
  \ 4-19 所示。\n\n**代码清单 4-19**. 告知编译器某个注释是重要的\n\n```less\n/*!\nThis needs to come in\
  \ final output\n!*/\n```\n\n### 混入\n\n混入是可复用的代码块，可以在整个代码中使用。混入可以包含完整的`CSS`规则。混入可以参数化；即它们可以接受参数，这使其非常灵活。在`Less`中定义混入的方式如代码清单\
  \ 4-20 所示。\n\n**代码清单 4-20**. `Less`中的混入示例\n\n```less\n.notification(@value:5px)\
  \ {\n  border-radius: @value;\n  padding: @value;\n}\n.errorLooks{\n  .notification;\n\
  }\n.successLooks{\n  .notification(10px);\n}\n```\n\n在`Less`中，混入的声明方式类似于任何类定义。要在另一个规则中包含一个混入，只需写出混入的名称，前面加上句点，并可选地在括号内提供参数。混入允许您通过简单地将混入名称作为其属性之一，将一个类的所有属性嵌入到另一个类中。\n\
  \n**代码清单 4-21**. 代码清单 4-20 的输出\n\n```css\n.errorLooks {\n  border-radius: 5px;\n\
  \  padding: 5px;\n}\n.successLooks {\n  border-radius: 10px;\n  padding: 10px;\n\
  }\n```\n\n如您所见，`notification`扩展类并未在最终输出中渲染。\n\n此外，您可以混入一个类或`ID`选择器，这在代码清单 4-22 中进行了演示。\n\
  \n**代码清单 4-22**. 混入`ID`和类的示例\n\n```less\n.notification,#notification {\n  border-radius:\
  \ 5px;\n  padding: 5px;\n}\n.errorLooks{\n  .notification;\n}\n.successLooks{\n\
  \  #notification;\n}\n```\n\n**代码清单 4-23**. 代码清单 4-22 的输出\n\n```css\n.notification,\n\
  #notification {\n  border-radius: 5px;\n  padding: 5px;\n}\n.errorLooks {\n  border-radius:\
  \ 5px;\n  padding: 5px;\n}\n.successLooks {\n  border-radius: 5px;\n  padding: 5px;\n\
  }\n```\n\n如果您想创建一个混入，但不在渲染后的`.css`文件中输出它，只需在其后附加一对括号即可。您还可以在混入定义中包含选择器以及样式规则。这在代码清单\
  \ 4-24 中进行了演示。\n\n**代码清单 4-24**. 演示如何在混入定义中包含选择器的示例\n\n```less\n.notification()\
  \ {\n  border-radius: 5px;\n  padding: 5px;\n  &:hover{\n    border:2px solid #fff;\n\
  \  }\n}\n.errorLooks{\n  .notification;\n}\n.successLooks{\n  .notification;\n}\n\
  ```\n\n**代码清单 4-25**. 代码清单 4-24 的输出\n\n```css\n.errorLooks {\n  border-radius: 5px;\n\
  \  padding: 5px;\n}\n.errorLooks:hover {\n  border: 2px solid #fff;\n}\n.successLooks\
  \ {\n  border-radius: 5px;\n  padding: 5px;\n}\n.successLooks:hover {\n  border:\
  \ 2px solid #fff;\n}\n```\n\n并不总是需要包含整个混入。您也可以只包含其中的特定部分，例如，其中的选择器。这在代码清单 4-26 中进行了演示。\n\
  \n**代码清单 4-26**. 在另一个选择器内部使用混入中的选择器\n\n```less\n.notification() {\n  border-radius:\
  \ 5px;\n  padding: 5px;\n  .inner{\n      border:2px solid #fff;\n  }\n}\n.errorLooks{\n\
  \  .notification;\n}\n.successLooks{\n  .notification .inner;\n}\n```\n\n**代码清单\
  \ 4-27**. 代码清单 4-26 的输出\n\n```css\n.errorLooks {\n  border-radius: 5px;\n  padding:\
  \ 5px;\n}\n.errorLooks .inner {\n  border: 2px solid #fff;\n}\n.successLooks {\n\
  \  border: 2px solid #fff;\n}\n```\n\n如果您观察代码清单 4-27，`.sucessLooks`只采用了混入中内部样式（`inner`）的样式。当您在混入后附加`!important`时，所有属性都会带上`!important`，如代码清单\
  \ 4-28 所示。\n\n**代码清单 4-28**. 在混入中使用`!important`的实现\n\n\n\n```\n.notification() {\n\
  \    border-radius: 5px;\n    padding: 5px;\n    .inner {\n        border: 2px solid\
  \ #fff;\n    }\n}\n.errorLooks {\n    .notification;\n}\n.successLooks {\n    .notification\
  \ .inner !important;\n}\n```\n\n**清单 4-29**：清单 4-28 的输出\n\n```\n.errorLooks {\n\
  \  border-radius: 5px;\n  padding: 5px;\n}\n.errorLooks .inner {\n  border: 2px\
  \ solid #fff;\n}\n.successLooks {\n  border: 2px solid #fff !important;\n}\n```\n\
  \nMixin 类似于任何函数式编程语言中的函数。因此，与任何函数式语言一样，它们可以接受参数。这在清单 4-30 中得到了演示，我们为圆角创建了一个参数化的\
  \ mixin，它接受一个半径参数。\n\n**清单 4-30**：演示参数化 Mixin 的示例\n\n```\n.roundedEdges (@radius)\
  \ {\n    -webkit-border-radius: @radius;\n    -moz-border-radius: @radius;\n   \
  \ -o-border-radius: @radius;\n    border-radius: @radius\n}\n\n.info {\n    font-weight:\
  \ bold;\n    .roundedEdges(50px)\n}\n```\n\n**清单 4-31**：清单 4-30 的输出\n\n```\n.info\
  \ {\n  font-weight: bold;\n  -webkit-border-radius: 50px;\n  -moz-border-radius:\
  \ 50px;\n  -o-border-radius: 50px;\n  border-radius: 10px;\n}\n```\n\nMixin 中的参数可以有默认值，当调用\
  \ mixin 时没有传递参数时，可以使用该默认值。因此，你可以通过为半径参数添加一个默认值来修改前面的示例。这看起来就像清单 4-32 所示。\n\n**清单\
  \ 4-32**：演示 Mixin 参数默认值的示例\n\n```\n.roundedEdges (@radius:5px) {\n    -webkit-border-radius:\
  \ @radius;\n    -moz-border-radius: @radius;\n    -o-border-radius: @radius;\n \
  \   border-radius: @radius\n}\n\n.info {\n    font-weight: bold;\n    .roundedEdges(50px);\n\
  }\n\n.note {\n    font-style: italic;\n    .roundedEdges();\n}\n```\n\n**清单 4-33**：清单\
  \ 4-32 的输出\n\n```\n.info {\n  font-weight: bold;\n  -webkit-border-radius: 50px;\n\
  \  -moz-border-radius: 50px;\n  -o-border-radius: 50px;\n  border-radius: 50px;\n\
  }\n.note {\n  font-style: italic;\n  -webkit-border-radius: 5px;\n  -moz-border-radius:\
  \ 5px;\n  -o-border-radius: 5px;\n  border-radius: 5px;\n}\n```\n\nMixin 可以接受多个参数，形式为用分号分隔的值，这与其他编程语言类似。在\
  \ Less 中，使用分号，因为逗号的行为存在歧义。逗号用于分隔参数和列表项。\n\nLess 中的 Mixin 也支持重载。这在清单 4-34 中进行了演示。\n\
  \n**清单 4-34**：展示 Mixin 重载的示例\n\n```\n.specialArea(@color; @width) {\n    border:\
  \ 2px dashed @color;\n    width: @width;\n    color: @color;\n}\n.specialArea(@color;)\
  \ {\n    color: @color;\n}\n\n.fullEmphasis {\n    background-color: #BBB;\n   \
  \ .specialArea(#FFF);\n}\n\n.sideEmphasis {\n    background-color: #BBB;\n    .specialArea(#FFF,200px)\n\
  }\n```\n\n在清单 4-34 中，`specialArea` 有两个变体。一个接受单个参数——颜色，另一个接受两个参数。这段代码的输出如清单 4-35\
  \ 所示。\n\n**清单 4-35**：清单 4-34 的输出\n\n```\n.fullEmphasis {\n  background-color: #BBB;\n\
  \  color: #FFF;\n}\n.sideEmphasis {\n  background-color: #BBB;\n  border: 2px dashed\
  \ #ffffff;\n  width: 200px;\n  color: #FFF;\n}\n```\n\nLess 有两个特殊的变量，分别称为 `@arguments`\
  \ 和 `@rest`。\n\n#### `@arguments`\n\n`@arguments` 变量包含传递给 mixin 并存在于其内部的所有参数的列表。在\
  \ Less 中，列表是由空格分隔的值，因此你可以将 `@arguments` 用于由空格分隔的属性，例如边框样式、外边距等。这在清单 4-36 中进行了演示。\n\
  \n**清单 4-36**：演示 `@arguments` 用法的示例\n\n```\n.borderAroundElement(@width:1px; @style:solid;\
  \ @color: #000) {\n    border: @arguments;\n}\n.subsection {\n    .borderAroundElement();\n\
  }\n.impInlineContent {\n    .borderAroundElement(2px;dashed;#f00);\n}\n```\n\n此示例为边框参数提供了值，然后使用\
  \ `@arguments` 将这些值赋给 border 属性。此清单的输出如清单 4-37 所示。\n\n**清单 4-37**：清单 4-36 的输出\n\n\
  ```\n.subsection {\n  border: 1px solid #000;\n}\n.impInlineContent {\n  border:\
  \ 2px dashed #f00;\n}\n```\n\n#### `@rest`\n\n`@rest` 使你能灵活地使用数量不定的参数调用 mixin。这在清单\
  \ 4-38 中进行了演示。\n\n**清单 4-38**：演示 `@rest` 用法的示例\n\n```\n.borderAroundElement(@width:10px;\
  \ @rest...) {\n    width: @width;\n    border: @rest;\n}\n.subsection {\n    .borderAroundElement(100px;1px\
  \ solid #666);\n}\n```\n\n正如你在前面的示例中所见，当你传递一个属性列表进行赋值时，`@rest` 就派上了用场。\n\n#### 返回值\n\
  \nMixin 不像在其他编程语言中那样返回值。然而，你可以利用它们的作用域来模拟这种行为。如果一个变量在调用者的作用域中未定义，它将被复制到调用者的作用域中。这在清单\
  \ 4-39 中进行了演示。\n\n**清单 4-39**：演示返回值的示例\n\n```\n.setPaddingMarginMixin() {\n    @padding:\
  \ 15px;\n    @margin: 30px;\n}\n.modifiedPMMixin() {\n    @margin: 25px;\n    padding:\
  \ @padding;\n    margin: @margin;\n    .setPaddingMarginMixin();\n}\n.container\
  \ {\n    .modifiedPMMixin();\n}\n```\n\n在这段代码中，`@padding` 的值被返回，然后被添加到了 `modifiedPMMixin`\
  \ 的作用域中。这段代码的输出如清单 4-40 所示。\n\n**清单 4-40**：清单 4-39 的输出\n\n```\n.container {\n  padding:\
  \ 15px;\n  margin: 25px;\n}\n```\n\n#### 嵌套规则\n\nCSS 不会体现元素之间的这种关系。使用 Less，你的代码能够反映元素之间的关系，并且可以像清单\
  \ 4-41 那样编写。\n\n**清单 4-41**：使用 Less 反映元素之间关系的示例\n\n```\n#sidebar {\n    .heading\
  \ {\n        font-weight: bold;\n        color: #BBB;\n    }\n    ul {\n       \
  \ list-style: none;\n        li {\n            a {\n                color: #006;\n\
  \            }\n        }\n    }\n}\n```\n\n**清单 4-42**：清单 4-41 的输出\n\n```\n#sidebar\
  \ .heading {\n  font-weight: bold;\n  color: #BBB;\n}\n#sidebar ul {\n  list-style:\
  \ none;\n}\n#sidebar ul li a {\n  color: #006;\n}\n```\n\nLess 提供的这种模式在以下方面是有益的：\n\
  \n*   它减少了代码冗余。你无需为多个子元素重复编写相同的选择器。\n*   它使代码可读且易于维护。\n\n尽管嵌套是一个有用的特性，但应谨慎使用。嵌套会导致\
  \ DOM 和 CSS 代码之间的紧密绑定，因此由于特异性问题，会限制覆盖规则的可能性。\n\n#### 导入指令\n\nLess 提供了一个导入指令，用于从其他位置导入样式。与\
  \ CSS 不同，CSS 要求导入语句必须位于文件开头，而 Less 允许将 `@import` 语句放置在代码中的任何位置。\n\n\n\n`@import`语句的行为可能取决于导入文件的扩展名。\n\
  \n- 如果导入的文件以`.css`结尾，它将被视为普通的 CSS 导入，语句保持不变。\n- 对于任何其他扩展名，它将被视为 Less 文件并导入。如果缺少`.less`扩展名，则会自动追加，并导入文件内容。\n\
  \n***列表 4-43***：展示各种导入方法的示例\n\n```\n@import \"filetoimport\";\n@import \"filetoimport.less\"\
  ;\n@import \"filetoimport.php\";\n@import \"filetoimport.css\";\n```\n\n在此示例中，前三种方法将文件视为\
  \ Less 文件并导入其内容。然而，最后一种方法将被视为普通的 CSS 导入，因为文件名以`.css`结尾。\n\n你可以为导入操作指定几个选项：\n\n-\
  \ `reference`：将使用 Less 文件，但不输出其内容\n- `inline`：在输出中包含导入文件的内容，但不处理它\n- `less`：无论文件扩展名是什么，都将其视为\
  \ Less 文件\n- `css`：无论文件扩展名是什么，都将其视为 CSS 文件\n- `once`：只包含该文件一次（这是默认行为）\n- `multiple`：多次包含该文件\n\
  - `optional`：当文件未找到时继续编译\n\n#### Mixin Guards\n\n*Guards*在需要基于条件应用表达式时非常有用。它们也被称为*条件混入（conditional\
  \ mixins）*。\n\nLess 使用带守卫的混入（guarded mixins）来实现条件执行，而不是使用`if/else`语句，如列表 4-44 所示。\n\
  \n***列表 4-44***：展示 Mixin Guards 的示例\n\n```\n.switchContrast (@color) when (lightness(@color)\
  \ >= 60%) {\n  background-color: #000;\n}\n.switchContrast (@color) when (lightness(@color)\
  \ < 60%) {\n  background-color: #FFF;\n}\n.switchContrast (@color) {\n  color: @color;\n\
  }\n.container{\n    .switchContrast(#666);\n}\n```\n\n列表 4-44 演示了实现一个 mixin guard，检查输入颜色的亮度，并根据其值决定对比色组合。\n\
  \n***列表 4-45***：列表 4-46 的输出\n\n```\n.container {\n  background-color: #FFF;\n  color:\
  \ #666666;\n}\n```\n\nGuards 支持以下比较运算符：`>`、`<`、`>=`、`<=`和`=`。列表 4-46 演示了这样一个场景。\n\
  \n***列表 4-46***：展示在 Mixin Guard 中使用比较运算符的示例\n\n```\n@mediaType: mobile;\n.setScreen\
  \ (@width) when (@mediaType = mobile) {}\n.setScreen (@width) when (@mediaType =\
  \ desktop) {}\n```\n\nGuards 还支持逻辑运算符，例如`and`、`or`和`not`。你可以使用`and`关键字来组合 guards，如列表\
  \ 4-47 所示。\n\n***列表 4-47***：展示`and`运算符的示例\n\n```\n@mediaType: mobile;\n@orientation:\
  \ landscape;\n@width: 960px;\n.setScreen (@width) when (@mediaType = mobile) and\
  \ (@orientation=\"landscape\") {}\n```\n\n你可以通过用逗号分隔 guards 来使用`or`运算符，如列表 4-48\
  \ 所示。\n\n***列表 4-48***：展示`or`运算符的示例\n\n```\n.setScreen (@width) when (@mediaType\
  \ = desktop),(@width >= 960) {}\n```\n\n你也可以使用`not`运算符进行否定，如列表 4-49 所示。\n\n***列表\
  \ 4-49***：展示`not`运算符的示例\n\n```\n.setScreen (@width) when not (@width >= 960) {}\n\
  ```\n\n对于基于值类型的混入匹配，你可以使用`is`函数。参见列表 4-50。\n\n***列表 4-50***：展示`isnumber`的示例\n\n\
  ```\n.setVal (@val1; @val2: 0) when (isnumber(@val2)) { ... }\n```\n\nLess 中可用的类型检查函数如下：\n\
  \n- `iscolor`\n- `iskeyword`\n- `isnumber`\n- `isstring`\n- `isurl`\n\n稍后说明的`default`函数，可用于根据其他混入进行混入匹配。\n\
  \n***列表 4-51***：展示\"条件混入（Conditional Mixins）\"的示例\n\n```\n.setVal (@a) when (@a\
  \ > 0) { ...  }\n.setVal (@a) when (additionalCheck()) { ... }\n```\n\n## 引用父选择器\n\
  \nLess 使用`&`符号来引用当前选择器的父级。`&`符号反转了嵌套顺序，并且可以扩展或合并类，如列表 4-52 所示。\n\n***列表 4-52***：展示父选择器的示例\n\
  \n```\n.button\n{\n    background:#F00;\n    &:hover{\n        background: #500;\n\
  \    }\n}\n```\n\n***列表 4-53***：列表 4-52 的输出\n\n```\n.button {\n  background: #F00;\n\
  }\n.button:hover {\n  background: #500;\n}\n```\n\n`&`符号主要用于向一个类添加伪类。这在之前的列表中以一个简单示例进行了演示，即添加了`:hover`伪类。\n\
  \n另一个可以使用父选择器的常见场景是构建 clear fix。这可以通过将父选择器与`:after`一起使用来实现。这在列表 4-54 中进行了演示。\n\n\
  ***列表 4-54***：使用父选择器构建 clear fix\n\n```\n.clearfix() {\n    &:after {\n        clear:\
  \ both;\n    }\n}\n\n.column{\n    .clearfix;\n}\n```\n\n***列表 4-55***：列表 4-54 的输出\n\
  \n```\n.column:after {\n  clear: both;\n}\n```\n\n除了 CSS 提供的伪类之外，Less 还提供了额外的伪类，即`extend`伪类，其语法类似于\
  \ CSS 伪类。`extend`伪类有助于扩展选择器，如列表 4-56 所示。\n\n***列表 4-56***：展示`extend`伪类的示例\n\n```\n\
  .primary{\n    color: #00F;\n    &:hover {\n        color: #006;\n    }\n}\n.secondary:extend(.primary){\n\
  \n}\n```\n\n列表 4-56 通过使用 Less 提供的`extend`伪选择器扩展了`primary`类。此代码的输出如列表 4-57 所示。\n\n\
  ***列表 4-57***：列表 4-58 的输出\n\n```\n.primary,\n.secondary {\n  color: #00F;\n}\n.primary:hover\
  \ {\n  color: #006;\n}\n```\n\n## 将`&`与 Guards 结合使用\n\nGuards 可以与`&`符号一起使用，以创建条件语句。\n\
  \n这在列表 4-58 中进行了演示，其中父选择器与一个 guard 结合使用，根据作为参数传入的颜色级别来决定使用哪种颜色。\n\n***列表 4-58***：将\
  \ Guard 与父选择器结合使用的示例\n\n```\n.colorGenerator(@level) {\n    & when(@level>5) {\n\
  \        color: #600;\n    }\n    & when (@level<=5){\n        color:#060;\n   \
  \ }\n}\np.lead {\n    .colorGenerator(6);\n}\np.secondLead {\n    .colorGenerator(1);\n\
  }\n```\n\n***列表 4-59***：列表 4-58 的输出\n\n```\np.lead {\n  color: #600;\n}\np.secondLead\
  \ {\n  color: #060;\n}\n```\n\n## 分离规则和混入\n\n分离规则集（detached rulesets）是一组规则，包含有效的\
  \ Less 或 CSS 代码，并存储在一个变量中。在 Less 中，这些分离规则集可以作为参数传递给混入，如列表 4-60 所示。\n\n***列表 4-60***：分离规则的示例\n\
  \n```\n@errorStyleSettings: { color: #A00; border: 1px solid #A00 }\n```\n\n\n\n\
  ## 调用分离的规则集\n\n可以通过在末尾添加括号来调用分离的规则集。使用括号时，分离规则集中的内容会被复制到 CSS 规则集内部。这在清单 4-61 中进行了演示。\n\
  \n**清单 4-61**. 在另一个样式声明中添加分离的规则集\n\n```\n@errorStyleSettings: {\n  color: #A00;\n\
  \  border: 1px solid #A00;\n};\n.errorDialog{\n    @errorStyleSettings();\n}\n```\n\
  \n混入中的分离规则可以防止代码冗余。当你需要在不同的媒体查询或媒体查询内嵌套的类中使用不同的样式规则时，这种方法最为适用。\n\n## 数字与颜色的运算\n\n\
  Less 支持加、减、乘、除等算术运算。此外，还可以通过在运算表达式周围添加括号来改变执行顺序。这些运算可应用于变量、值和数字。\n\n**清单 4-62**.\
  \ 演示算术运算的示例\n\n```\n.aside{\n    width:percentage(1 - (0.4+0.2))\n}\n```\n\n**清单\
  \ 4-63**. 清单 4-64 的输出\n\n```\n.aside {\n  width: 40%;\n}\n```\n\nLess 也支持颜色操作。这些操作可以对不同单位的值和颜色进行。这在清单\
  \ 4-64 中进行了演示，我们取一个输入颜色并将其值减少 10%。\n\n**清单 4-64**. 在 Less 中演示颜色操作的示例\n\n```\n@color:\
  \ yellow;\n.lighten(@color){\n        color : @color - 10%;\n}\n.contrastContainer{\n\
  \    .lighten(@color)\n}\n```\n\n**清单 4-65**. 清单 4-64 的输出\n\n```\n.contrastContainer\
  \ {\n  color: #f5f500;\n}\n```\n\n## 合并属性\n\n属性合并对于接受逗号分隔或空格分隔值的属性非常有用。例如：边框、背景、过渡和`font-family`属性。可以通过在要合并的属性名称后添加`+`标志（用于逗号分隔列表）或`+_`标志（用于空格分隔列表）来合并属性。\n\
  \n清单 4-66 展示了一个合并逗号分隔值的示例。它合并了`font`属性的值。这里有两个混入——`fontSettings`和`fallbackFonts`——并且`fallbackFonts`的值被合并到`fontSettings`中。\n\
  \n请注意，如果你漏掉了`+`: 并将其写成`:`，那么来自`fallbackFonts`的内容将被添加在新的一行，并覆盖`fontSettings`提供的字体设置。\n\
  \n**清单 4-66**. 演示合并逗号分隔值的示例\n\n```\n.fallbackFonts(){\n    font-family+: Helvetica,sans-serif;\n\
  }\n.fontSettings(){\n    font-family+: Calibri;\n    .fallbackFonts;\n}\nbody {\n\
  \    .fontSettings;\n}\n```\n\n**清单 4-67**. 清单 4-66 的输出\n\n```\nbody {\n  font-family:\
  \ Calibri, Helvetica, sans-serif;\n}\n```\n\n## 循环混入\n\n可以让混入递归执行。这可以通过将它们与混入守卫或模式结合来实现。\n\
  \n这在清单 4-68 中进行了演示，该清单使用混入守卫和循环生成了 12 列网格。\n\n**清单 4-68**. 演示混入递归行为的示例\n\n```\n\
  .generateGridLayout(12);\n.generateGridLayout(@n, @i: 1) when (@i =< @n) {\n  .col-@{i}\
  \ {\n    width: (@i * 100% / @n);\n  }\n  .generateGridLayout(@n, (@i + 1));\n}\n\
  ```\n\n**清单 4-69**. 清单 4-68 的输出\n\n```\n.col-1 {\n  width: 8.33333333%;\n}\n.col-2\
  \ {\n  width: 16.66666667%;\n}\n.col-3 {\n  width: 25%;\n}\n.col-4 {\n  width: 33.33333333%;\n\
  }\n.col-5 {\n  width: 41.66666667%;\n}\n.col-6 {\n  width: 50%;\n}\n.col-7 {\n \
  \ width: 58.33333333%;\n}\n.col-8 {\n  width: 66.66666667%;\n}\n.col-9 {\n  width:\
  \ 75%;\n}\n.col-10 {\n  width: 83.33333333%;\n}\n.col-11 {\n  width: 91.66666667%;\n\
  }\n.col-12 {\n  width: 100%;\n}\n```\n\n## 函数\n\nLess 提供了许多内置函数。通过这些内置函数，你可以根据需要操作值。这些函数可以在守卫表达式中使用。完整的函数列表请访问\
  \ [`lesscss.org/functions/`](http://lesscss.org/functions/)。\n\n我们不会涵盖所有可用的函数，而是介绍来自不同类别的函数。函数可以根据其输入和输出进行分类。主要有以下几种类型的函数：\n\
  \n* 数学函数\n* 颜色函数\n* 列表函数\n* 字符串函数\n* 类型函数\n\nLess 函数支持原生 JavaScript 函数，因为 Less 是用\
  \ JavaScript 编写的。目前，可以在 Less 代码中评估 JavaScript 表达式；不过，这在未来的版本中可能会被移除。\n\n### 列表函数\n\
  \n此类别中的函数可用于迭代 CSV 列表。此类别包含两个主要函数——`extract()`和`length()`。顾名思义，`extract()`用于从 CSV\
  \ 中获取值，`length()`用于检查它们的长度。\n\n`extract` 函数在清单 4-70 中进行了演示，该示例使用`extract()`函数为社交媒体图标生成类。\n\
  \n**清单 4-70**. 演示列表函数用法的示例\n\n```\n@socials: \"twitter\",\"facebook\",\"gplus\"\
  ;\n.generateSocialIcons(@i) when (@i > 0) {\n    .generateSocialIcons((@i - 1));\n\
  \    @socialName: e(extract(@socials, @i));\n    li.@{socialName}{\n        width:16px;height:16px;\n\
  \        background-image:url(\"@{socialName}.png\");\n    }\n}\n.generateSocialIcons(length(@socials));\n\
  ```\n\n此示例从名为`@socials`的列表中提取值，并使用该值生成特定的社交媒体类。输出如清单 4-71 所示。\n\n**清单 4-71**. 清单\
  \ 4-70 的输出\n\n```\nli.twitter {\n  width: 16px;\n  height: 16px;\n  background-image:\
  \ url(\"twitter.png\");\n}\nli.facebook {\n  width: 16px;\n  height: 16px;\n  background-image:\
  \ url(\"facebook.png\");\n}\nli.gplus {\n  width: 16px;\n  height: 16px;\n  background-image:\
  \ url(\"gplus.png\");\n}\n```\n\n### 颜色函数\n\nLess 提供的颜色函数处理各种操作，如颜色定义、运算、混合和通道操作。\n\
  \n在 CSS2 中，颜色以 RGB 格式声明。RGB 由三个通道组成：红色、绿色和蓝色。随着 CSS3 的出现，出现了新的颜色定义，例如 HSL 和 HSV，它们类似于\
  \ RGB 值。Less 支持各种颜色定义方法和通道操作方法。这些颜色声明方法在清单 4-72 中进行了演示。\n\n**清单 4-72**. 演示各种颜色声明技术的示例\n\
  \n```\n.colorDefinition {\n    color: rgb(255,133,75);\n    color: rgba(255,133,75,.4);\n\
  \    color: hsl(76, 80%, 20%);\n    color: red;\n}\n```\n\n除了颜色声明函数之外，Less 还提供了两种方法——`darken()`和`lighten()`——可用于计算输入颜色和强度提供的深色或浅色变体。这在清单\
  \ 4-73 中进行了演示。\n\n**清单 4-73**. 演示`lighten`和`darken`函数的示例\n\n```\n@primaryColor:\
  \ #00A;\n@secondaryColor: #0A0;\n.heading{\n    color:lighten(@primaryColor,20%);\n\
  }\n.impNotice{\n    color:darken(@primaryColor,35%);\n}\n.successfulEvent{\n   \
  \ color:lighten(@secondaryColor,10%);\n}\n```\n\n\n\n### 颜色函数\n\n***清单 4-74***.\
  \ *清单 4-73* 的输出结果\n\n```\n.heading {\n  color: #1111ff;\n}\n.impNotice {\n  color:\
  \ #000000;\n}\n.successfulEvent {\n  color: #00dd00;\n}\n```\n\n在设计中使用高对比度是一个重要因素。高对比度不仅影响视障人士设计的可用性，对视力正常的人也有好处。然而，计算正确的对比度值并不容易。Less\
  \ 提供了`contrast()`函数，该函数计算一个易于识别的颜色。\n\n`contrast()`函数最多可以接受四个参数，其中只有第一个参数是必需的。\n\
  \n*   将需要对比度的颜色定义为首个参数。\n*   第二个和第三个参数定义了深色和浅色。\n*   最后一个可输入参数是阈值。阈值的默认值是 43%。\n\
  \n高于阈值颜色的颜色被视为浅色，`contrast()`函数返回第二个参数中定义的深色。\n\n其他提供的一些函数包括：\n\n*   `saturate()`\n\
  *   `desaturate()`\n*   `fadein()`\n*   `fadeout()`\n*   `fade()`\n*   `spin()`\n\
  *   `mix()`\n*   `grayscale()`\n\n你可以通过应用颜色混合函数来生成新颜色，这些函数对提供的两种颜色输入执行基本操作，例如减法。\n\
  \n一些颜色混合函数包括：\n\n*   `multiply()`\n*   `screen()`\n*   `average()`\n*   `overlay()`\n\
  *   `hardlight()`\n*   `softlight()`\n*   `difference()`\n*   `exclusion()`\n* \
  \  `negation()`\n\n让我们来看一些这些混合函数。\n\n*   `multiply()` 对两种颜色执行乘法运算。\n*   `screen()`\
  \ 得出输入颜色中最亮的颜色。\n*   `overlay()` 是`screen()`和`multiply()`函数的组合，结果颜色的亮度或暗度取决于第一个输入颜色的值。\n\
  *   `softlight()` 类似于`overlay()`，但它避免在其结果中出现纯黑色或纯白色。\n*   `hardlight()` 与`overlay()`完全相反，结果颜色的亮度或暗度由第二个输入颜色的值决定。\n\
  *   `difference()` 按照每个通道从第一种颜色中减去第二种颜色。如果任何特定通道遇到负值，它将会被反转。\n*   `average()` 按照每个通道计算两个数字的平均值。\n\
  \n所有这些函数已在 清单 4-75 中演示。\n\n***清单 4-75***. 展示各种颜色混合函数的示例\n\n```\n@primaryColor: #00A;\n\
  @secondaryColor: #0A0;\n@tertiaryColor: #AAA;\n.heading{\n    color:multiply(@primaryColor,@tertiaryColor);\n\
  \    color:screen(@primaryColor,@secondaryColor);\n    color:overlay(@primaryColor,@tertiaryColor);\n\
  \    color:softlight(@secondaryColor,@tertiaryColor);\n    color:hardlight(@primaryColor,@tertiaryColor);\n\
  \    color:difference(@primaryColor,@secondaryColor);\n    color:average(@primaryColor,@secondaryColor);\n\
  }\n```\n\n***清单 4-76***. 清单 4-75 的输出结果\n\n```\n.heading {\n  color: #000071;\n \
  \ color: #0000c6;\n  color: #00b700;\n  color: #5555c6;\n  color: #00aaaa;\n  color:\
  \ #005555;\n}\n```\n\n### 类型函数\n\nLess 提供了类型函数来验证输入值的类型。如果输入类型与函数的测试匹配，这些函数返回`true`。\n\
  \n以下是一些类型函数：\n\n*   `isnumber()`\n*   `isstring()`\n*   `iscolor()`\n*   `iskeyword()`\n\
  *   `isurl()`\n*   `ispixel()`\n*   `isem()`\n*   `ispercentage()`\n*   `isunit()`\n\
  \n如果输入值是数字，`isnumber()`返回`true`；否则返回`false`。\n\n***清单 4-77***. 对`isnumber`返回`true`或`false`的示例值\n\
  \n```\nisnumber(#fff);     // false\nisnumber(\"NormalText\"); // false\nisnumber(1234);\
  \     // true\nisnumber(56px);     // true\n```\n\n如果输入值是字符串，`isstring()`返回`true`；否则返回`false`。\n\
  \n***清单 4-78***. 对`isstring`返回`true`或`false`的示例值\n\n```\nisstring(red);     // false\n\
  isstring(\"NormalText\"); // true\n```\n\n如果输入值是颜色，`iscolor()`返回`true`；否则返回`false`。\n\
  \n***清单 4-79***. 对`iscolor`返回`true`或`false`的示例值\n\n```\niscolor(#fff);     // true\n\
  iscolor(\"NormalText\"); // false\n```\n\n如果输入值是 URL，`isurl()`返回`true`；否则返回`false`。\n\
  \n***清单 4-80***. 对`isurl`返回`true`或`false`的示例值\n\n```\nisurl(\"NormalText\"); //\
  \ false\nisurl(url(...)); // true\n```\n\n如果输入值是像素单位数字，`ispixel()`返回`true`；否则返回`false`。\n\
  \n***清单 4-81***. 对`ispixel`返回`true`或`false`的示例值\n\n```\nispixel(1234);     // false\n\
  ispixel(56px);     // true\n```\n\n如果输入值是`em`单位数字，`isem()`返回`true`；否则返回`false`。\n\
  \n***清单 4-82***. 对`isem`返回`true`或`false`的示例值\n\n```\nisem(56px);     // false\n\
  isem(7.8em);    // true\n```\n\n如果输入值是百分比值，`ispercentage()`返回`true`；否则返回`false`。\n\
  \n***清单 4-83***. 对`ispercentage`返回`true`或`false`的示例值\n\n```\nispercentage(56px);\
  \     // false\nispercentage(7.8%);     // true\n```\n\n如果输入值的单位与第二个参数中指定的单位相同，`isunit()`返回`true`；否则返回`false`。\n\
  \n***清单 4-84***. 对`isunit`返回`true`或`false`的示例值\n\n```\nisunit(11px, px);  // true\n\
  isunit(2.2%, px);  // false\n```\n\n### 数学函数\n\nLess 提供了几个数学函数来对值执行各种数学运算。在本节中，我们将介绍其中一些函数。\n\
  \n*   `ceil()` 类似于 JavaScript 中的版本，它会将输入数字舍入为最高的整数值。例如，`ceil(2.4)`返回`3`。\n*   `floor()`\
  \ 将输入数字舍入为最低的整数值。例如，`floor(2.4)`返回`2`。\n*   `percentage()` 将输入数字转换为百分比值。例如，`percentage(0.5)`返回`50%`。\n\
  *   `round()` 对数字进行四舍五入。它接受两个参数。第一个参数是要舍入的数字。第二个参数是要舍入到的小数位数。例如，`round(1.67)`返回`2`，而`round(1.67,1)`将返回`1.7`。\n\
  *   `sqrt()` 计算输入值的平方根。另请注意，在执行此计算时，该函数会保留原始输入的单位。例如，`sqrt(25cm)`返回`5cm`。\n*   `pow()`\
  \ 返回第一个参数的第二个参数次幂的值。例如，`pow(2,2)`返回`4`。\n*   `mod()` 计算输入值的模数。例如，`mod(11,6)`返回`5`。\n\
  *   `min()` 返回输入值中的最小值。例如，`min(2,1)`将返回`1`。\n*   `max()` 返回输入值中的最大值。例如，`max(2,1)`将返回`2`。\n\
  \n### 字符串函数\n\nLess 提供了字符串函数来操作字符串。在本节中，我们将研究这些函数。\n\n*   `escape()` 将对字符串中发现的特殊字符进行\
  \ URL 编码。此函数不会对以下字符集进行 URL 编码：`,`, `/`, `?`, `@`, `&`, `+`, `'`, `~`, `!`, 和`$`。例如，`escape(x=10)`返回`x%3D10`。\n\
  *   `e()` 也称为 CSS 转义。它主要从输入字符串中移除引号，并返回不带引号的字符串，可用于 CSS 表达式中。我们在 清单 4-70 中使用了此函数来提取社交图标的名称并移除了其引号。\n\
  *   `replace()` 用于替换给定输入中的字符串。此函数接受四个参数：\n    *   输入字符串，这是执行搜索和替换的目标。\n    *   要被替换的字符串/模式。\n\
  \    *   替换字符串，即用于替换搜索模式的字符串。\n    *   任何可选的正则表达式标志。\n\n例如，`replace(\"Is this planet?\"\
  , \"planet\\?\", \"earth\");` 会将单词`planet`替换为`earth`。\n\n### 杂项函数\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，对给定的英文文本进行翻译。\n\
  \n以下是翻译后的中文 Markdown 文档：\n\n\n除了前面提到的函数，Less 还有一些无法归类到特定组的函数，如下所示：\n\n- `color()`\
  \ 将一个包含颜色值的字符串转换为实际的颜色值。这与字符串类别的 `e()` 函数类似。例如，`color(\"#555\")` 返回 `#555`。\n- `image-size()`\
  \ 返回输入图像的尺寸。例如，`image-size(\"image.png\")` 返回 `16px 16px`。这可以拆分为两个独立的函数：`image-width()`\
  \ 和 `image-height()`。顾名思义，前者返回图像的宽度，后者返回图像的高度。\n- `convert()` 将输入值转换为第二个参数指定的特定单位。此函数接受两个参数：\n\
  \    - 要转换的输入值，需带有适当的单位。\n    - 一个有效的单位类型。\n\n例如，以下 `convert()` 函数调用 `convert(5s,\
  \ \"ms\")` 返回 `5000ms`。请注意，在调用此函数时，输入单位和预期的输出单位应该是兼容的。例如，`convert(10, ms)` 只会返回\
  \ `10`，这不是预期的结果，因为输入单位（此处没有单位）与输出类型不兼容。兼容意味着单位应代表相同类型的属性。\n\n- `default()` 与守卫（`guard`）一起使用。当根据输入找不到匹配的混合（`mixin`）时，它用于触发守卫。这在清单\
  \ 4-85 中演示。\n\n***清单 4-85***. 演示带有守卫的 `default()` 函数的示例\n\n```\n.font(1){\n    font-size:\
  \ 11px;\n}\n.font(5){\n    font-size: 26px;\n}\n.font(@size) when (default()) {\n\
  \    font-size: ~\"@{size}px\";\n}\n\n.header {\n  .font(5);\n}\n\n.content {\n\
  \  .font(12);\n}\n```\n\n在此示例中，你有三个 `font` 混合的变体，如果输入值为 `1` 或 `5`，它会抛出一个预设值。对于其他情况，`default()`\
  \ 返回 `true`，此时直接使用提供的值。此代码的输出如清单 4-86 所示。\n\n***清单 4-86***. 清单 4-85 的输出\n\n```\n\
  .header {\n  font-size: 26px;\n}\n.content {\n  font-size: 12px;\n}\n```\n\n- `unit()`\
  \ 的行为因传递的参数数量而异。此函数可以接受两个参数。如果只提供一个参数，它将从输入中提取并返回数值。例如，`unit(10px)` 返回 `10`。当你想要为输入值分配某个单位时，传递两个参数。例如，`unit(10,px)`\
  \ 返回 `10px`。请注意，这不能与 `convert()` 函数互换使用。\n- `get-unit()` 用于只从给定值中提取单位。如果输入有任何单位，将仅返回该单位。\n\
  \n## 将 Less 与外部框架一起使用\n\n你可以将 Less 与其他知名框架一起使用。本节介绍如何使用 Less 与以下框架进行自定义或扩展：\n\n\
  - Cardinal CSS\n- Ionic 框架\n- Semantic Grid System\n\n### Cardinal CSS\n\nCardinal\
  \ ([`cardinalcss.com/`](http://cardinalcss.com/)) 是一个类似 Bootstrap 的 CSS 框架。它是一个纯\
  \ CSS 框架，本质上是移动优先和模块化的。它不包含任何类似 Bootstrap 或 Foundation 的 JavaScript 插件。Cardinal\
  \ 的 CSS 是使用 Less 编写的。\n\n虽然这个框架制作精良，但其文档需要大量改进。你会在 Less 代码框架中找到许多有用的注释。\n\n使用此框架的\
  \ HTML 标记应类似于清单 4-87。\n\n***清单 4-87***. 使用 Cardinal 框架的示例标记\n\n```\n<div class=\"\
  grid\">\n  <div class=\"grid-item 1/4\">Block 1</div>\n  <div class=\"grid-item\
  \ 1/4\">Block 2</div>\n  <div class=\"grid-item 1/4\">Block 3</div>\n  <div class=\"\
  grid-item 1/4\">Block 4</div>\n</div>\n```\n\nCardinal 支持七种由六个断点组成的网格类型，如下所示：\n\n\
  - `xs`: 480px;\n- `sm`: 600px;\n- `md`: 768px;\n- `lg`: 960px;\n- `xl`: 1140px;\n\
  - `xxl`: 1380px;\n\nLess Cardinal 插件会在你的自定义代码之前导入 Cardinal 的 Less 代码。此插件可以通过执行以下命令安装：\n\
  \n```\nnpm install -g less-plugin-cardinal\n```\n\n安装后，可以使用以下命令使用该插件：\n\n```\nlessc\
  \ mycode.less --cardinal\n```\n\n### Ionic 和 Less\n\nIonic ([`www.ionicframework.com`](http://www.ionicframework.com))\
  \ 框架用于构建混合移动应用程序，这种应用就像以原生应用方式运行的 Web 应用。由于这些应用由网页构成，因此可以使用 HTML、JavaScript 和 CSS\
  \ 等 Web 技术创建。Ionic 应用是使用 HTML5 构建的。\n\nIonic 的 Less 插件可在 [`github.com/bassjobsen/lessplugin-ionic`](https://github.com/bassjobsen/lessplugin-ionic)\
  \ 获得。它会在你的自定义 Less 代码之前导入 Ionic 框架代码。安装插件后，你可以使用以下命令简单地编译代码：\n\n```\nlessc apllication.less\
  \ application.css –ionic\n```\n\n此插件可以通过运行以下命令安装：\n\n```\nnpm install -g less-plugin-ionic\n\
  ```\n\n### Semantic Grid System\n\nSemantic Grid System ([`github.com/tylertate/semantic.gs`](https://github.com/tylertate/semantic.gs))\
  \ 是一种实现响应式布局的现代且简洁的方法，标记中没有任何无语义的类（`class`）。你只需设置列宽和间距宽，设置列数，然后在像素和百分比之间进行选择。它主要是用\
  \ Less 创建的，但也支持 SCSS 和 Stylus。\n\n这在清单 4-88 中演示。\n\n***清单 4-88***. 演示 Semantic Grid\
  \ System 的示例\n\n```\n@import 'grid.less';\n@columns: 12;\n@column-width: 50;\n@gutter-width:\
  \ 10;\n@total-width: 100%;\n.main {\n    .column(9);\n}\n.sidebar {\n    .column(3);\n\
  }\n```\n\n## 总结\n\n本章介绍了另一个著名的预编译器框架——Less。本章涵盖了它的各种语言特性，包括嵌套、混合及其守卫，以及此框架提供的各种函数类别。\n\
  \n在下一章中，你将了解另一个名为 Compass 的著名框架。\n\n---\n\n"
- "# 第 5 章\n\n![image](img/frontdot.jpg)\n\n## Compass 简介\n\n在前面的章节中，您了解了两种著名的预编译语言——Sass\
  \ 和 Less，并学习了它们提供的各种特性。现在，您将了解一个基于 Sass 的著名 CSS 框架，名为 Compass。\n\n本章将探讨 Compass\
  \ 的以下方面：\n\n- 安装\n- 理解 `config.rb`\n- 使用 Sass 和 Compass 创建响应式网格\n- Compass 和 CSS3\n\
  - 图像精灵和 Compass\n- Compass 扩展\n\n## Compass 简介\n\n正如其网站 ([`compass-style.org/`](http://compass-style.org/))\
  \ 所描述的，Compass 是“一个开源的 CSS 创作框架”。\n\nCompass 是一个使用 Sass 构建的框架。除了 Sass 之外，安装 Compass\
  \ 还能为您提供可重用的模式和工具，从而进一步减少编写 CSS 所需的时间和精力。\n\n使用 Compass，您可以通过单个语句使用像 `box-shadow`、`columns`\
  \ 等 CSS3 特性。Compass 将为其生成跨浏览器兼容的 CSS。\n\n## Compass 安装\n\nCompass 与 Sass 有类似的要求，即需要\
  \ Ruby 才能运行。安装过程在第 2 章中已解释。要开始使用，您需要运行清单 5-1 中的命令，其结果如图 5-1 和 5-2 所示。\n\n![9781484213483_Fig05-01.jpg](img/9781484213483_Fig05-01.jpg)\n\
  \n图 5-1. 命令 `gem update -system` 的输出\n\n![9781484213483_Fig05-02.jpg](img/9781484213483_Fig05-02.jpg)\n\
  \n\n\n图 5-2. `sudo gem install Compass` 命令的输出\n\n***清单 5-1***. 安装 Compass 的命令\n\n\
  ```\ngem update --system\ngem install compass\n```\n\n如果你想使用 Compass 提供的实验性功能，可以通过执行清单\
  \ 5-2 中的命令来安装其预览版本。\n\n***清单 5-2***. 安装 Compass 预览版的命令\n\n```\ngem install compass\
  \ --pre\n```\n\n运行此命令时，输出结果将如图图 5-3 所示。\n\n![9781484213483_Fig05-03.jpg](img/9781484213483_Fig05-03.jpg)\n\
  \n图 5-3. 清单 5-2 的输出\n\n完成 Compass 安装后，你可以通过执行清单 5-3 中所示的命令来开始使用。\n\n***清单 5-3***.\
  \ 使用 Compass 创建项目的命令\n\n```\ncompass create <projectName>\n```\n\n对于 Mac 用户，Compass\
  \ 的创建者 Chris Eppstein 提供了一个无需使用终端即可安装的安装程序包。该程序包可在 [`github.com/chriseppstein/compass/downloads`](https://github.com/chriseppstein/compass/downloads)\
  \ 获取。\n\n最新版本的 Mac OS X 对于之前定义的安装方法似乎存在一些问题。你可能会遇到如下错误：\n\n```\nERROR: While executing\
  \ gem ... (Errno::EPERM)\nOperation not permitted - /usr/bin/compass\n```\n\n这是由于最新版\
  \ OS X 中引入的无根模式导致的。在无根模式下，即使使用 `sudo`，`/usr/bin` 目录也无法写入。\n\n可以使用以下命令解决此问题：\n\n\
  ```\nsudo gem install -n /usr/local/bin compass\n```\n\n## 在 Compass 中创建项目\n\n首先，你将使用\
  \ Compass 创建一个空白项目。为此，请使用清单 5-4 中的命令（结果如图图 5-4 所示）。\n\n***清单 5-4***. 使用 Compass\
  \ 创建项目的命令\n\n```\ncompass create learnCompass\n```\n\n![9781484213483_Fig05-04.jpg](img/9781484213483_Fig05-04.jpg)\n\
  \n图 5-4. `compass create` 命令的输出\n\n此命令将创建必要的目录结构和 CSS 文件。它还会创建一个配置文件，用于配置 Compass\
  \ 和 Sass 选项。\n\n基于 GUI 的工具也提供了创建 Compass 项目的选项。例如，CodeKit 提供了一个名为 `Create New Compass\
  \ Project` 的选项。\n\n你可以自定义这种默认的项目创建方式，例如，使用不同的文件夹名称来创建项目。这可以通过在 `compass create`\
  \ 命令中提供附加选项来实现，如清单 5-5 所示。\n\n***清单 5-5***. 在 Compass 中自定义项目创建\n\n```\ncompass create\
  \ customProject --sass-dir \"scss\" --javascripts-dir \"scripts\"\n```\n\n在此命令中，你根据需求指定了文件夹名称。这些自定义设置会保存在项目生成的\
  \ `config.rb` 文件中。\n\n`compass create` 命令不会创建 JavaScript 文件夹。你需要手动创建它。\n\n`compass\
  \ create` 有一个名为 `--bare` 的选项，使用该选项将不会创建默认情况下会创建的文件和文件夹。创建的项目将只包含 `config.rb` 文件和\
  \ Sass 文件夹。图 5-5 显示了 `compass create` 命令创建的默认结构。\n\n![9781484213483_Fig05-05.jpg](img/9781484213483_Fig05-05.jpg)\n\
  \n图 5-5. `compass create` 命令创建的默认结构\n\n## 理解 `config.rb`\n\n`config.rb` 是 Compass\
  \ 项目中的主要文件。它定义了项目的几个重要方面，例如文件的位置以及如何从 Sass/Scss 生成 CSS。\n\n\n\n如果你在编辑器中打开这个文件，文件内容将类似于清单\
  \ 5-6 所示的内容。\n\n**清单 5-6**. 默认 `config.rb` 文件的内容\n\n```\nrequire 'compass/import-once/activate'\n\
  # Require any additional compass plugins here.\n\n# Set this to the root of your\
  \ project when deployed:\nhttp_path = \"/\"\ncss_dir = \"stylesheets\"\nsass_dir\
  \ = \"sass\"\nimages_dir = \"images\"\njavascripts_dir = \"javascripts\"\n\n# You\
  \ can select your preferred output style here (can be overridden via the command\
  \ line):\n# output_style = :expanded or :nested or :compact or :compressed\n\n#\
  \ To enable relative paths to assets via compass helper functions. Uncomment:\n\
  # relative_assets = true\n\n# To disable debugging comments that display the original\
  \ location of your selectors. Uncomment:\n# line_comments = false\n\n# If you prefer\
  \ the indented syntax, you might want to regenerate this\n# project again passing\
  \ --syntax sass, or you can uncomment this:\n# preferred_syntax = :sass\n# and then\
  \ run:\n# sass-convert -R --from scss --to sass sass scss && rm -rf sass && mv scss\
  \ sass\n```\n\n当你对 `config.rb` 文件进行更改时，建议清除 `.sass-cache`，可以通过手动删除 sasscache 文件夹，或者运行\
  \ `compass clean` 命令来实现。\n\n你可以使用以下命令来监视项目更改：`compass watch`。\n\n其他用于灵活网格、样板框架等的\
  \ gem 是可用的，并且可以通过 `config.rb` 文件在项目中引用。这是在 `config.rb` 文件的第一部分完成的。但请注意，你需要先将这些插件安装好，然后才能将它们导入到你的\
  \ Compass 项目中。\n\n让我们考虑一个例子，你想要导入 960 Grid CSS 框架插件。为此，你首先需要安装清单 5-7 所示的插件（结果如图\
  \ 5-6 所示）。\n\n**清单 5-7**. 在 Compass 项目中安装自定义插件\n\n```\nsudo gem install compass-960-plugin\n\
  ```\n\n![9781484213483_Fig05-06.jpg](img/9781484213483_Fig05-06.jpg)\n\n图 5-6. 在\
  \ Compass 项目中安装插件\n\n安装插件后，下一步是将其包含到你的项目中。如果是现有项目，你需要修改 `config.rb` 的第一部分，在其中添加一个\
  \ `require` 语句，如清单 5-8 所示。\n\n**清单 5-8**. 在 `config.rb` 中添加 `require`\n\n```\nrequire\
  \ \"ninesixty\"\n```\n\n一旦你将其添加到配置文件中，你就可以通过在 SCSS 中使用 `@import` 语句将 960 网格添加到你的项目中，如清单\
  \ 5-9 所示。\n\n**清单 5-9**. 导入 960 网格\n\n```\n@import \"960/grid\";\n@include grid-system-complete(12);\n\
  ```\n\n这将把 960 网格系统添加到你的 SCSS 文件中。由于我使用默认的 `compass create` 命令创建了这个项目，我将使用 `screen.scss`，如清单\
  \ 5-9 所示。现在，为了将所有代码放入最终的 CSS 中，你可以在项目目录中简单地运行清单 5-10 所示的命令。\n\n**清单 5-10**. 在 Compass\
  \ 中编译并监视 SCSS 文件的命令\n\n```\ncompass watch\n```\n\n![9781484213483_Fig05-07.jpg](img/9781484213483_Fig05-07.jpg)\n\
  \n图 5-7. `compass watch` 命令会将 960 网格类添加到你的样式表中\n\n![Image](img/sq.jpg) **注意** 如果在添加这些插件后遇到\
  \ Sass 或 Compass 版本冲突，请根据插件的兼容性卸载并重新安装相应版本的 Sass 和 Compass。此外，在 `compass watch`\
  \ 运行时，对 `config.rb` 的更改不会被注册。需要重新启动它。\n\n除了在项目中包含插件外，你还可以为各种资源设置文件夹路径。在 `config.rb`\
  \ 中，有一个类似于清单 5-11 所示的部分。\n\n**清单 5-11**. `config.rb` 中设置各种资源路径的部分\n\n```\n# Set\
  \ this to the root of your project when deployed:\nhttp_path = \"/\"\ncss_dir =\
  \ \"stylesheets\"\nsass_dir = \"sass\"\nimages_dir = \"images\"\njavascripts_dir\
  \ = \"javascripts\"\n```\n\n你还可以设置 CSS 输出的最终样式，如清单 5-12 所示。\n\n**清单 5-12**. `config.rb`\
  \ 中设置 CSS 输出样式的部分\n\n```\n# You can select your preferred output style here (can\
  \ be overridden via the command line):\n# output_style = :expanded or :nested or\
  \ :compact or :compressed\n```\n\n`config.rb` 中的最后一部分是启用相对资源，即设置资源的相对路径。此设置默认未启用。启用此设置后，你可以在\
  \ CSS 中指定图像名称，它将知道去哪里找到它。你无需指定完整路径。因此，通过取消注释 `config.rb` 中的相应行来启用相对资源设置后，它应如清单 5-13\
  \ 所示。\n\n**清单 5-13**. `config.rb` 中设置相对资源的部分\n\n```\n# To enable relative paths\
  \ to assets via compass helper functions. Uncomment:\nrelative_assets = true\n```\n\
  \n## 使用 Sass 和 Compass 实现响应式网格\n\n响应式网格是非常有用的开发工具。第 3 章讨论了网格以及如何构建它们。然而，开发者反对使用它们的一些常见原因。\n\
  \n一个常见原因是，当你使用 Bootstrap 框架时，会在编写的 HTML 标记中添加非语义类（例如 `col-md-8`）。\n\n另一个避免使用网格的原因是它们限制了创造力。\n\
  \n然而，使用 Sass 和 Compass，你将使用灵活的网格系统，可以根据需要实现。随心所欲地设计，然后使用 Sass 和 Compass 将其变为现实。你可以在网格内灵活设置列数。\n\
  \n使用 Sass 和 Compass 网格系统的优势在于，它们将复杂数学计算的负担从你肩上卸下。因此，即使不了解太多数学知识，你也可以构建复杂的网格系统。本章的示例使用\
  \ *Susy* 来构建网格系统。\n\n## Susy 简介\n\nSusy 是一个基于 Sass 和 Compass 的网格系统。它灵活且易于使用。除了简单和灵活之外，它还能生成干净的代码，并有良好的文档记录。\n\
  \nSusy 可以在 [`susy.oddbird.net/`](http://susy.oddbird.net/) 获取；该网站包含很好的教程和参考文档。\n\
  \n在开始构建网格任务之前，让我们澄清一个重要的概念。Susy 将帮助你创建网格，但不会自动生成一个。\n\n你定义你要构建什么，然后 Susy 进行所有计算。简单来说，这就像是告诉\
  \ Susy：“我想要一个 12 列的网格，每列宽 10em，间距为 2em，网格两侧各有 0.5em 的内边距”。然后 Susy 进行计算以生成这个网格。\n\
  \n## 获取 Susy\n\n为了获取 Susy 的 Compass 插件，你需要打开终端并输入清单 5-14 所示的命令。\n\n**清单 5-14**.\
  \ Susy Compass 扩展的命令\n\n```\nsudo gem install susy\n```\n\n这将产生如图 5-8 所示的输出。\n\n\
  ![9781484213483_Fig05-08.jpg](img/9781484213483_Fig05-08.jpg)\n\n图 5-8. `Gem Install\
  \ Susy` 的输出\n\n## 在你的项目中使用 Susy\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵守您提供的注意事项，将英文文本翻译成符合格式要求的中文译文。\n\
  \n---\n\n\n现在您已经安装了 `Susy for Compass`，下一步是将其引入到项目中。在本章的前面部分，您已经学习了如何通过 `config.rb`\
  \ 文件引入插件。不过，这次您将创建一个从一开始就包含了插件的新项目。为此，您需要使用带一些额外参数的 `compass create` 命令，如清单 5-15\
  \ 所示。\n\n***清单 5-15***。使用 Susy 插件创建 Compass 项目的命令\n\n```\ncompass create sampleSusyProj\
  \ -r susy -u susy\n```\n\n这将输出 Compass 项目，如图 5-9 所示。\n\n![9781484213483_Fig05-09.jpg](img/9781484213483_Fig05-09.jpg)\n\
  \n图 5-9。为 Susy 添加了额外参数的 `compass create` 命令的输出\n\n创建项目后，您会在 `SCSS` 目录中得到两个文件：`_grid.scss`\
  \ 和 `style.scss`。现在让我们开始设置网格。\n\n要使用 Susy 设置网格，您首先需要为此任务定义所有 Susy 特定的变量。这些变量是：\n\
  \n*   `$total-column`：总列数\n*   `$column-width`：每列的宽度\n*   `$gutter-width`：列之间的间距\n\
  *   `$grid-padding`：网格左侧和右侧的间距\n\n您将在 `_grid.scss` 中定义这些属性。第一行是导入 `\"susy\"`，这是将所有与\
  \ Susy 相关的代码引入 `_grid.scss` 所必需的。\n\n对于此示例，您将假定这些变量具有以下值：\n\n*   `$total-column`：12\n\
  *   `$column-width`：10em\n*   `$gutter-width`：4em\n*   `$grid-padding`：4em\n\n代码应如清单\
  \ 5-16 所示。\n\n***清单 5-16***。为 Susy 设置必要参数\n\n```\n@import \"susy\";\n\n$susy: (\n\
  \   columns: 12,\n   gutters: 1/5\n);\n```\n\n接下来，您需要为网格提供上下文。为此，您需要将某个元素设置为容器元素。假设您想要作为容器的元素是\
  \ `page`。这是在 `style.scss` 中完成的，如清单 5-17 所示。\n\n***清单 5-17***。在 `style.scss` 中将元素设置为容器\n\
  \n```\n@import \"grids\";\n\n.page{\n   @include container;\n}\n```\n\n这告诉 Susy\
  \ `.page` 将充当容器。\n\n## 显示网格背景\n\nSusy 使您能够在浏览器中查看容器的网格列。如果您想知道网格的效果，这会非常方便。这可以通过修改一条规则来实现，如清单\
  \ 5-18 所示。\n\n***清单 5-18***。告诉 Susy 显示网格\n\n```\n@import \"grids\";\n\n.page{\n\
  \   @include container(show overlay);\n   Height:500px; // 已手动设置高度以在空白页面上显示网格\n\
  }\n```\n\n此页面的 HTML 代码如清单 5-19 所示。\n\n***清单 5-19***。清单 5-18 的 HTML 标记\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n  <head>\n    <title>Sample susy project</title>\n    <link rel=\"\
  stylesheet\" type=\"text/css\" href=\"stylesheets/style.css\">\n  </head>\n  <body>\n\
  \    <div class=\"page\"></div>\n  </body>\n</html>\n```\n\n这段代码的结果如图 5-10 所示。请注意，当您将鼠标悬停在右上角的图标上时，网格是可见的。\n\
  \n![9781484213483_Fig05-10.jpg](img/9781484213483_Fig05-10.jpg)\n\n图 5-10。显示网格覆盖层\n\
  \n接下来，您将设置 Susy 使用 `border-box` 的 `box-sizing` 模型。您可以通过将此变量添加到网格设置中来实现，如清单 5-20\
  \ 所示。\n\n***清单 5-20***。为网格系统设置添加盒模型设置\n\n```\n@import \"susy\";\n\n$susy: (\n  \
  \ columns: 12,\n   gutters: 1/5,\n   global-box-sizing:border-box\n);\n```\n\n在开发响应式页面或应用程序时，您首先应该考虑的是完全可访问的设计。这意味着无论设备或其性能如何，内容都应该在您的页面或应用程序上可访问。这当然不能保证在所有设备上都有相同的布局和行为。\n\
  \n现在让我们看看如何在 Susy 中设置断点。CSS 中的断点是指布局发生变化以适应视口大小的地方。Susy 允许您灵活地定义任意数量的断点。考虑两个断点。您将在\
  \ `_grid.scss` 中为中屏幕和大屏幕定义两个变量，如清单 5-21 所示。\n\n***清单 5-21***。在 Susy 中定义断点\n\n```\n\
  @import \"susy\";\n\n$susy: (\n   columns: 12,\n   gutters: 1/5,\n   global-box-sizing:border-box\n\
  );\n\n// 定义断点的变量\n$mediumScreen:750px;\n$largeScreen:1200px;\n```\n\n您可能已经注意到，该示例只声明了两个断点。这是因为您将以移动优先的理念构建示例布局，这使得布局在各种设备上均可访问，无论其性能如何，然后再针对更大尺寸的视口进行增强。\n\
  \n对于此示例，您将使用位于 [`breakpoint-sass.com/`](http://breakpoint-sass.com/) 的断点插件。要开始使用它，首先需要在系统上安装该插件，如清单\
  \ 5-22 所示（输出见图 5-11）。\n\n***清单 5-22***。安装断点插件\n\n```\ngem install breakpoint\n```\n\
  \n![9781484213483_Fig05-11.jpg](img/9781484213483_Fig05-11.jpg)\n\n图 5-11。安装断点插件\n\
  \n下一步是使用 `require \"breakpoint\"` 将该插件包含到项目的 `config.rb` 文件中。\n\n将其包含到配置文件后，您需要使用\
  \ `@import \"breakpoint\"` 将其包含到您正在使用的 SCSS 文件中。\n\n现在，您将开始在代码中使用断点。为此，让我们先为您之前定义的大屏幕断点设置\
  \ `font-size` 为 `1.5em`，如清单 5-23 所示。\n\n***清单 5-23***。在 `_grids.scss` 中为大屏幕断点设置样式\n\
  \n```\n@import \"susy\";\n@import \"breakpoint\";\n\n$susy: (\n   columns: 12,\n\
  \   gutters: 1/5,\n   global-box-sizing:border-box\n);\n\n// 定义断点值的变量\n$mediumScreen:750px;\n\
  $largeScreen:1200px;\n\n.page {\n   @include breakpoint($largeScreen) {\n      font-size:\
  \ 1.5em;\n   }\n}\n```\n\n这段代码将为更大的屏幕生成一个媒体查询，如清单 5-24 所示。\n\n***清单 5-24***。清单 5-23\
  \ 在 `style.css` 中的输出\n\n```\n@media (min-width: 1200px) {\n   /* line 17, ../sass/_grids.scss\
  \ */\n   .page {\n      font-size: 1.5em;\n   }\n}\n```\n\n现在，假设您想要声明一个具有最小和最大宽度的媒体查询。您可以通过以空格分隔的格式提供值来实现。为此，让我们修改\
  \ `$mediumScreen` 变量的值。如清单 5-25 所示。\n\n***清单 5-25***。在 `_grids.scss` 中为具有最小和最大值的中屏幕断点设置值\n\
  \n```\n@import \"susy\";\n@import \"breakpoint\";\n\n$susy: (\ncolumns: 12,\ngutters:\
  \ 1/5,\nglobal-box-sizing:border-box\n);\n\n// 定义断点值的变量\n$mediumScreen:480px 750px;\n\
  $largeScreen:1200px;\n\n.page {\n   @include breakpoint($largeScreen) {\n   font-size:\
  \ 1.5em;\n}\n@include breakpoint($mediumScreen){\n   font-size: 1em;\n}\n}\n```\n\
  \n\n\n***列表 5-26***. 列表 5-25 在`style.css`中的输出\n\n```\n@media (min-width: 480px)\
  \ and (max-width: 750px) {\n/* line 17, ../sass/_grids.scss */\n.page {\nfont-size:\
  \ 1em;\n}\n}\n```\n\n你可以在媒体查询定义中添加媒体类型。媒体类型的值必须是媒体查询的第一个参数。开发人员通常会省略`all`媒体类型，以创建更简洁的媒体查询。如果你希望始终可以使用`all`媒体类型，需要设置`$breakpoint-force-media-all:\
  \ true;`\n\n你可以在列表 5-27 中看到这种高级媒体查询。\n\n***列表 5-27***. 在`in_grids.scss`开头指定媒体类型的高级媒体查询\n\
  \n```\n@import \"susy\";\n@import \"breakpoint\";\n\n$susy: (\ncolumns: 12,\ngutters:\
  \ 1/5,\nglobal-box-sizing:border-box\n);\n\n// 定义断点值的变量\n$mediumScreen:480px 750px;\n\
  $largeScreen:1200px;\n$advancedQuery: 'not screen' 320px;\n\n.page {\n   @include\
  \ breakpoint($largeScreen) {\n      font-size: 1.5em;\n   }\n   @include breakpoint($mediumScreen){\n\
  \      font-size: 1em;\n   }\n   @include breakpoint($advancedQuery) {\n      color:#777;\n\
  \   }\n}\n```\n\n***列表 5-28***. 列表 5-27 在`style.css`中的输出\n\n```\n@media (min-width:\
  \ 1200px) {\n  /* line 19, ../sass/_grids.scss */\n  .page {\n    font-size: 1.5em;\n\
  \  }\n}\n@media (min-width: 480px) and (max-width: 750px) {\n  /* line 19, ../sass/_grids.scss\
  \ */\n  .page {\n    font-size: 1em;\n  }\n}\n@media not screen and (min-width:\
  \ 320px) {\n  /* line 19, ../sass/_grids.scss */\n  .page {\n    color: #777;\n\
  \  }\n}\n```\n\n多个特性可以组合成一个复合媒体查询。这样可以评估多个特性，如列表 5-29 所示。\n\n***列表 5-29***. 在`_grid.scss`中展示复合媒体查询的示例\n\
  \n```\n@import \"susy\";\n@import \"breakpoint\";\n\n$susy: (\n   columns: 12,\n\
  \   gutters: 1/5,\n   global-box-sizing:border-box\n);\n\n// 定义断点值的变量\n$mediumScreen:480px\
  \ 750px;\n$largeScreen:1200px;\n$advancedQuaery: 'not screen' 320px;\n$compoundQuery:\
  \ print (orientation landscape) (min-width 520px);\n\n.page {\n   @include breakpoint($largeScreen)\
  \ {\n      font-size: 1.5em;\n   }\n   @include breakpoint($mediumScreen){\n   \
  \   font-size: 1em;\n   }\n   @include breakpoint($advancedQuery) {\n      color:#777;\n\
  \   }\n   @include breakpoint($compoundQuery) {\n      font-weight: bold;\n   }\n\
  }\n```\n\n***列表 5-30***. 列表 5-29 的输出\n\n```\n@media (min-width: 1200px) {\n  /*\
  \ line 19, ../sass/_grids.scss */\n  .page {\n    font-size: 1.5em;\n  }\n}\n@media\
  \ (min-width: 480px) and (max-width: 750px) {\n  /* line 19, ../sass/_grids.scss\
  \ */\n  .page {\n    font-size: 1em;\n  }\n}\n@media not screen and (min-width:\
  \ 320px) {\n  /* line 19, ../sass/_grids.scss */\n  .page {\n    color: #777;\n\
  \  }\n}\n@media print and (orientation: landscape) and (min-width: 520px) {\n  /*\
  \ line 19, ../sass/_grids.scss */\n  .page {\n    font-weight: bold;\n  }\n}\n```\n\
  \n## Compass 与 CSS3\n\nCompass 已成为众多开发者的心头好，因为它允许通过预定义的混入，以单行语法编写 CSS3 特性；编译后，会生成带有正确供应商前缀的属性集。这非常实用，可以节省大量时间，开发者也无需记住所有语法。在本节中，你将了解\
  \ Compass 支持的部分 CSS3 特性。\n\n为此，你首先需要创建一个新的 Compass 项目，如列表 5-31 所示。\n\n***列表 5-31***.\
  \ 创建新的 Compass 项目\n\n```\ncompass create effects\n```\n\n创建项目后，你将创建一个 HTML 文件，在其中查看所研究的\
  \ Compass 所有 CSS3 特性的输出结果。该文件的结构如列表 5-32 所示。\n\n\n\n***清单 5-32*** 创建一个 HTML 文件\n\
  \n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>Built in compass effects</title>\n\
  \  </head>\n  <body>\n  </body>\n</html>\n```\n\n### 背景渐变\n\nCompass 提供了多种 mixin\
  \ 来支持 `background-gradient`（背景渐变）的不同变体，包括：\n- 线性渐变\n- 径向渐变\n- 水平线性渐变\n- 带角度的渐变\n\
  \n对应的 HTML 代码如清单 5-33 所示。\n\n***清单 5-33*** `background-gradient` 的修改版 HTML\n\n```html\n\
  <!DOCTYPE html>\n<html>\n  <head>\n    <title>Built in compass effects</title>\n\
  \    <link rel=\"stylesheet\" type=\"text/css\" href=\"stylesheets/screen.css\"\
  >\n  </head>\n  <body>\n    <h1>Background Gradient</h1>\n    <div class=\"gradElement\"\
  ></div>\n  </body>\n</html>\n```\n\n现在，你将添加 `background-gradient` 的代码，如清单 5-34 所示。\n\
  \n***清单 5-34*** `screen.scss` 中的背景渐变代码\n\n```scss\n@import \"compass\";\n\n.gradElement{\n\
  \   width:64px;\n   height:64px;\n   @include background-image(linear-gradient(to\
  \ bottom right, #FF0000, #888888));\n   display:inline-block;\n}\n```\n\n在上述代码中，你首先导入了\
  \ Compass，以便能够使用其 CSS 特性。然后定义了元素的 `width` 和 `height`，并将其 `display` 值设置为 `inline-block`，以使元素可见。接着调用了\
  \ `background-image` 这个 mixin，它会为你渲染渐变。其语法与 CSS 中的对应属性类似，值之间用逗号或空格分隔。上述代码最终生成的 CSS\
  \ 如清单 5-35 所示。\n\n***清单 5-35*** 清单 5-34 代码输出的 CSS\n\n```css\n/* line 9, ../sass/screen.scss\
  \ */\n.gradElement {\nwidth: 64px;\nheight: 64px;\nbackground-image: url('data:image/svg+xml;base64,');\n\
  background-size: 100%;\nbackground-image: -webkit-gradient(linear, 0% 0%, 100% 100%,\
  \ color-stop(0%, #ff0000), color-stop(100%, #888888));\nbackground-image: -moz-linear-gradient(top,\
  \ #ff0000, #888888);\nbackground-image: -webkit-linear-gradient(top, #ff0000, #888888);\n\
  background-image: linear-gradient(to bottom right, #ff0000, #888888);\ndisplay:\
  \ inline-block;\n}\n```\n\n![9781484213483_Fig05-12.jpg](img/9781484213483_Fig05-12.jpg)\n\
  \n**图 5-12.** 线性渐变的输出效果\n\n正如你在最终输出中所见，Compass 会自动添加必要的浏览器厂商前缀。类似地，你还可以创建其他类型的渐变；例如，尝试在清单\
  \ 5-36 中创建一个径向渐变。\n\n***清单 5-36*** 使用 Compass 创建径向渐变\n\n```scss\n.radGradElement{\n\
  \   width:64px;\n   height:64px;\n   @include background-image(radial-gradient(30px\
  \ 30px, #FF0000 10px, #888888 30px));\n   display:inline-block;\n}\n```\n\n![9781484213483_Fig05-13.jpg](img/9781484213483_Fig05-13.jpg)\n\
  \n**图 5-13.** 径向渐变的输出效果\n\n更多关于 `background-gradient` 的示例可以在这里查看：\n[`compass-style.org/examples/compass/css3/gradient/`](http://compass-style.org/examples/compass/css3/gradient/).\n\
  \n### 边框圆角\n\n另一个常用的 CSS3 特性是 `border-radius`。它用于为元素添加圆角。为了演示其用法，让我们在 HTML 文件中添加一些标记，如清单\
  \ 5-37 所示。\n\n***清单 5-37*** `border-radius` 的附加标记\n\n```html\n<h1>Border Radius</h1>\n\
  <div class=\"br1 rounded\"></div>\n```\n\n现在让我们在 SCSS 文件中添加代码。在第一个示例中，你将看到一个所有角都为圆角的元素，如清单\
  \ 5-38 所示。\n\n***清单 5-38*** 简单的边框圆角 mixin 实现\n\n```scss\n// Code for border radius\
  \ mixin\n.rounded{\n   width:64px;\n   height:64px;\n   display:inline-block;\n\
  \   background:#FF0000;\n}\n.br1{\n   @include border-radius(30px);\n}\n```\n\n\
  ***清单 5-39*** 清单 5-38 的输出 CSS\n\n```css\n/* line 23, ../sass/screen.scss */\n.rounded\
  \ {\nwidth: 64px;\nheight: 64px;\ndisplay: inline-block;\nbackground: #FF0000;\n\
  }\n\n/* line 29, ../sass/screen.scss */\n.br1 {\n-moz-border-radius: 30px;\n-webkit-border-radius:\
  \ 30px;\nborder-radius: 30px;\n}\n```\n\n除了这个简单的 `border-radius` mixin 之外，Compass\
  \ 还提供了 `border-radius` mixin 的变体，通过它们可以只对单个或两个角进行圆角处理。下面我们来看每个变体的示例。首先，你将看到 HTML\
  \ 文件所需的标记，如清单 5-40 所示。\n\n***清单 5-40*** 边框圆角变体\n\n```html\n<div class=\"br2 rounded\"\
  ></div>\n<div class=\"br3 rounded\"></div>\n```\n\n接下来是 SCSS 文件的代码，如清单 5-41 所示。\n\
  \n***清单 5-41*** 边框圆角变体\n\n```scss\n.br2{\n  @include border-top-left-radius(30px);\n\
  }\n.br3{\n  @include border-bottom-radius(30px);\n}\n```\n\n在上一个示例中，你可以看到 `border-radius`\
  \ 的两种变体，一种是仅对单个角进行圆角处理，另一种是对两个角进行圆角处理。上述代码的输出如清单 5-42 所示。\n\n***清单 5-42*** 清单 5-41\
  \ 的输出 CSS\n\n```css\n/* line 32, ../sass/screen.scss */\n.br2 {\n  -moz-border-radius-topleft:\
  \ 30px;\n  -webkit-border-top-left-radius: 30px;\n  border-top-left-radius: 30px;\n\
  }\n\n/* line 35, ../sass/screen.scss */\n.br3 {\n  -moz-border-radius-bottomleft:\
  \ 30px;\n  -webkit-border-bottom-left-radius: 30px;\n  border-bottom-left-radius:\
  \ 30px;\n  -moz-border-radius-bottomright: 30px;\n  -webkit-border-bottom-right-radius:\
  \ 30px;\n  border-bottom-right-radius: 30px;\n}\n```\n\n![9781484213483_Fig05-14.jpg](img/9781484213483_Fig05-14.jpg)\n\
  \n**图 5-14.** 前几个清单中 `border-radius` 代码的输出效果\n\n你可以在以下网址查看这些特性的更多示例：\n[`compass-style.org/examples/compass/css3/border_radius/`](http://compass-style.org/examples/compass/css3/border_radius/).\n\
  \n### 透明度\n\nCompass 还提供了一个用于 `opacity` 的 mixin，通过它你可以控制元素的透明度。这在清单 5-43 中进行了演示。\n\
  \n***清单 5-43*** Compass 提供的透明度 mixin\n\n```html\n<h1>Opacity</h1>\n<div class=\"\
  opacity light0\"></div>\n<div class=\"opacity light1\"></div>\n<div class=\"opacity\
  \ light2\"></div>\n<div class=\"opacity light3\"></div>\n<div class=\"opacity light4\"\
  ></div>\n```\n\n***清单 5-44*** Compass 提供的透明度 mixin\n\n```scss\n// Code for opacity\
  \ mixin\n.opacity{\n   width:32px;\n   height:32px;\n   display:inline-block;\n\
  \   background:#000;\n}\n.light0{\n   @include opacity(0);\n}\n.light1{\n   @include\
  \ opacity(0.1);\n}\n.light2{\n   @include opacity(0.2);\n}\n.light3{\n   @include\
  \ opacity(0.3);\n}\n.light4{\n   @include opacity(0.4);\n}\n```\n\n在这个示例中，你可以通过设置不同的\
  \ `opacity` 值，实现元素从完全透明到部分不透明的过渡效果。这段代码的输出如清单 5-45 所示。\n\n***清单 5-45*** 清单 5-44\
  \ 的输出 CSS\n\n\n```scss\n/* line 40, ../sass/screen.scss */\n.opacity {\n  width:\
  \ 32px;\n  height: 32px;\n  display: inline-block;\n  background: #000;\n}\n\n/*\
  \ line 46, ../sass/screen.scss */\n.light0 {\n  filter: progid:DXImageTransform.Microsoft.Alpha(Opacity=0);\n\
  \  opacity: 0;\n}\n\n/* line 49, ../sass/screen.scss */\n.light1 {\n  filter: progid:DXImageTransform.Microsoft.Alpha(Opacity=10);\n\
  \  opacity: 0.1;\n}\n\n/* line 52, ../sass/screen.scss */\n.light2 {\n  filter:\
  \ progid:DXImageTransform.Microsoft.Alpha(Opacity=20);\n  opacity: 0.2;\n}\n\n/*\
  \ line 55, ../sass/screen.scss */\n.light3 {\n  filter: progid:DXImageTransform.Microsoft.Alpha(Opacity=30);\n\
  \  opacity: 0.3;\n}\n\n/* line 58, ../sass/screen.scss */\n.light4 {\n  filter:\
  \ progid:DXImageTransform.Microsoft.Alpha(Opacity=40);\n  opacity: 0.4;\n}\n```\n\
  \n![9781484213483_Fig05-15.jpg](img/9781484213483_Fig05-15.jpg)\n\n图 5-15： 代码清单\
  \ 5-45 的输出结果\n\n### 文本阴影\n\n接下来要介绍的 Compass 插件是文本阴影。Compass 让文本阴影插件的实现变得非常简单，如代码清单\
  \ 5-46 所示。\n\n***代码清单 5-46***。 使用 Compass 实现文本阴影\n\n```scss\n// 文本阴影代码\n.singleShadow{\n\
  \   @include single-text-shadow;\n}\n```\n\n这段代码会将文本阴影应用于 class 为`singleShadow`的元素。该代码的输出结果如代码清单\
  \ 5-47 所示。\n\n***代码清单 5-47***。 代码清单 5-46 的输出结果\n\n```css\n/* line 63, ../sass/screen.scss\
  \ */\n.singleShadow {\n  text-shadow: 0px 0px 1px #aaaaaa;\n}\n```\n\n可以使用 Compass\
  \ 提供的三个变量来自定义这个单一文本阴影，具体如下：\n\n*   `$default-text-shadow-color`：阴影的默认颜色\n*   `$default-text-shadow-blur`：模糊的默认值\n\
  *   `$default-text-shadow-v-offset`：阴影偏移的默认值\n\n***代码清单 5-48***。 演示在混入守卫中使用比较运算符的示例\n\
  \n```scss\n$default-text-shadow-color: rgba(255,250,0, 0.6);\n$default-text-shadow-blur:\
  \ 5px;\n$default-text-shadow-v-offset: 3px;\n.singleShadow{\n   @include single-text-shadow;\n\
  }\n```\n\n***代码清单 5-49***。 代码清单 5-48 的输出结果\n\n```css\n.singleShadow {\n   text-shadow:\
  \ 0px 3px 5px rgba(255, 250, 0, 0.6);\n}\n```\n\n***代码清单 5-50***。 代码清单 5-49 对应的\
  \ HTML\n\n```html\n<h1>Text shadow</h1>\n<span class=\"singleShadow\">This is a\
  \ text with single shadow</span>\n```\n\n![9781484213483_Fig05-16.jpg](img/9781484213483_Fig05-16.jpg)\n\
  \n图 5-16。 代码清单的输出结果\n\n你也可以为文本应用多重阴影，如代码清单 5-51 所示。\n\n***代码清单 5-51***。 为文本应用多重阴影\n\
  \n```scss\n.customMultipleshadows {\n   @include text-shadow(rgba(0,0,0, 0.2) 1px\
  \ 1px 0, rgba(10,10,10, 0.2) 2px 2px 0, rgba(11,11,11, 0.2) 3px 3px 0);\n}\n```\n\
  \n***代码清单 5-52***。 代码清单 5-51 的输出结果\n\n```css\n/* line 69, ../sass/screen.scss */\n\
  .customMultipleshadows {\n  text-shadow: rgba(0, 0, 0, 0.2) 1px 1px 0, rgba(10,\
  \ 10, 10, 0.2) 2px 2px 0, rgba(11, 11, 11, 0.2) 3px 3px 0;\n}\n```\n\n***代码清单 5-53***。\
  \ 代码清单 5-52 对应的 HTML\n\n```html\n<h1>Text shadow</h1>\n<span class=\"singleShadow\"\
  >This is a text with single shadow</span>\n<span class=\"customMultipleshadows\"\
  >This is a text with custom Multiple shadows</span>\n```\n\n![9781484213483_Fig05-17.jpg](img/9781484213483_Fig05-17.jpg)\n\
  \n图 5-17。 单一文本阴影与多重文本阴影\n\n### 盒阴影\n\nCompass 支持的另一个很酷的 CSS3 特性是盒阴影。盒阴影与文本阴影类似，但它是应用于容器而非文本。这在代码清单\
  \ 5-54 中进行了演示。\n\n***代码清单 5-54***。 使用 Compass 演示盒阴影的示例\n\n```scss\n// 盒阴影代码\n.shadow{\n\
  \   width:32px;\n   height:32px;\n   display:inline-block;\n   margin-right:10px;\n\
  \   background:#CCC;\n}\n.defaultBoxShadow {\n   @include single-box-shadow;\n}\n\
  \n.customBoxShadow {\n   @include box-shadow(#222 4px 3px 5px);\n}\n\n.multipleCustomBoxShadow\
  \ {\n   @include box-shadow(rgba(255,0,0 , 0.5) 0 0 25px, rgba(0,0,0, 0.7) 0 0 6px\
  \ 2px inset);\n}\n```\n\n***代码清单 5-55***。 代码清单 5-54 的输出结果\n\n```css\n/* line 74,\
  \ ../sass/screen.scss */\n.shadow {\n  width: 32px;\n  height: 32px;\n  display:\
  \ inline-block;\n  margin-right: 10px;\n  background: #CCC;\n}\n\n/* line 81, ../sass/screen.scss\
  \ */\n.defaultBoxShadow {\n  -moz-box-shadow: 0px 5px #333333;\n  -webkit-box-shadow:\
  \ 0px 5px #333333;\n  box-shadow: 0px 5px #333333;\n}\n\n/* line 85, ../sass/screen.scss\
  \ */\n.customBoxShadow {\n  -moz-box-shadow: #222 4px 3px 5px;\n  -webkit-box-shadow:\
  \ #222 4px 3px 5px;\n  box-shadow: #222 4px 3px 5px;\n}\n\n/* line 89, ../sass/screen.scss\
  \ */\n.multipleCustomBoxShadow {\n  -moz-box-shadow: rgba(255, 0, 0, 0.5) 0 0 25px,\
  \ rgba(0, 0, 0, 0.7) 0 0 6px 2px inset;\n  -webkit-box-shadow: rgba(255, 0, 0, 0.5)\
  \ 0 0 25px, rgba(0, 0, 0, 0.7) 0 0 6px 2px inset;\n  box-shadow: rgba(255, 0, 0,\
  \ 0.5) 0 0 25px, rgba(0, 0, 0, 0.7) 0 0 6px 2px inset;\n}\n```\n\n***代码清单 5-56***。\
  \ 代码清单 5-54 对应的 HTML\n\n```html\n<h1>Box shadow</h1>\n<div class='defaultBoxShadow\
  \ shadow'></div>\n<div class='customBoxShadow shadow'></div>\n<div class='multipleCustomBoxShadow\
  \ shadow'></div>\n```\n\n这个混入有以下可配置的参数：\n\n*   `$default-box-shadow-color`：提供默认的阴影颜色\n\
  *   `$default-box-shadow-h-offset`：提供默认的水平偏移值\n*   `$default-box-shadow-v-offset`：提供默认的垂直偏移值\n\
  *   `$default-box-shadow-blur`：提供默认的模糊量\n*   `$default-box-shadow-spread`：提供默认的扩展量\n\
