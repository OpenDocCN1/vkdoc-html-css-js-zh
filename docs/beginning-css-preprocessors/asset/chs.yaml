  \  background-repeat: no-repeat;\n  background-position: 50% 50%;\n  width: 128px;\n\
  \  height: 128px;\n}\n```\n\n### 使用 Compass 实现内联图像\n\n\n\n内联图像可直接将图像嵌入网页，遵循 RFC\
  \ 2397 规范。内联图像使用的数据 URI 旨在嵌入数据项，就像它们是从外部引用一样。使用内联图像可以节省 HTTP 请求。\n\n列表 5-76 对此进行了演示。\n\
  \n***列表 5-76***. 内联图像演示示例\n\n```\n.singleSocialInline{\n   background-image: inline-image(\"\
  ../images/facebook.png\");\n}\n```\n\n***列表 5-77***. 列表 5-76  的输出结果\n\n```\n.singleSocialInline\
  \ {\nbackground-image: url('data:image/png;base64,');\n\
  }\n```\n\n## CSS 变换\n\nCompass 提供了一个混合宏来支持 CSS3 变换。Compass 2D 变换混合宏的语法与 CSS 2D 变换函数相同。\n\
  \n我们来了解一下 CSS 变换的可配置参数：\n\n*   `$default-origin-x`：设置变换的默认 x 轴原点\n*   `$default-origin-y`：设置变换的默认\
  \ y 轴原点\n*   `$default-origin-z`：设置变换的默认 z 轴原点\n\n这三个参数的默认值均为 50%。\n\n*   `$default-scale-x`：设置\
  \ x 轴缩放的默认倍数\n*   `$default-scale-y`：设置 y 轴缩放的默认倍数\n*   `$default-scale-z`：设置 z\
  \ 轴缩放的默认倍数\n\n这三个参数的默认值为 1.25。\n\n*   `$default-rotate`：设置旋转的默认角度\n*   `$default-vector-x`：设置\
  \ 3D 旋转轴的默认 x 向量\n*   `$default-vector-y`：设置 3D 旋转轴的默认 y 向量\n*   `$default-vector-z`：设置\
  \ 3D 旋转轴的默认 z 向量\n*   `$default-translate-x`：设置平移的默认 x 轴距离\n*   `$default-translate-y`：设置平移的默认\
  \ y 轴距离\n*   `$default-translate-z`：设置平移的默认 z 轴距离\n*   `$default-skew-x`：设置倾斜的默认\
  \ x 轴角度\n*   `$default-skew-y`：设置倾斜的默认 y 轴角度\n*   `$default-skew-z`：设置倾斜的默认 z 轴角度\n\
  \n现在，我们将介绍 Compass 提供的一些用于执行这些变换的混合宏。我们要介绍的第一个变换是缩放。它用于缩放元素。列表 5-78 对此进行了演示。\n\n\
  ***列表 5-78***. 缩放混合宏演示示例\n\n```\n.elementToScale{\n   width:32px;\n   height:32px;\n\
  \   display:block;\n   background:#F00;\n}\n.elementToScale:hover{\n   @include\
  \ scale(2.0);\n}\n```\n\n在上一个示例中，您使用了缩放变换将元素缩放为其原始大小的两倍。此操作的输出结果见列表 5-79。\n\n***列表\
  \ 5-79***. 列表 5-78  的输出结果\n\n```\n/* line 169, ../sass/screen.scss */\n.elementToScale\
  \ {\n  width: 32px;\n  height: 32px;\n  display: block;\n  background: #F00;\n}\n\
  \n/* line 175, ../sass/screen.scss */\n.elementToScale:hover {\n  -moz-transform:\
  \ scale(2, 2);\n  -ms-transform: scale(2, 2);\n  -webkit-transform: scale(2, 2);\n\
  \  transform: scale(2, 2);\n}\n```\n\n接下来您要了解的变换是平移。平移用于将元素从一个位置移动到另一个位置。列表 5-80\
  \ 对此进行了演示。\n\n***列表 5-80***. 平移变换演示示例\n\n```\n.elementToTranslate{\n   width:32px;\n\
  \   height:32px;\n   display:block;\n   background:#F00;\n}\n.elementToTranslate:hover{\n\
  \   @include translate(30px);\n}\n```\n\n在上一个示例中，您将元素沿 x、y 和 z 轴正方向平移了 30 像素。此操作的输出结果如列表\
  \ 5-81 所示。\n\n***列表 5-81***. 列表 5-80  的输出结果\n\n```\n/* line 179, ../sass/screen.scss\
  \ */\n.elementToTranslate {\n  width: 32px;\n  height: 32px;\n  display: block;\n\
  \  background: #F00;\n}\n\n/* line 185, ../sass/screen.scss */\n.elementToTranslate:hover\
  \ {\n  -moz-transform: translate(30px, 1em);\n  -ms-transform: translate(30px, 1em);\n\
  \  -webkit-transform: translate(30px, 1em);\n  transform: translate(30px, 1em);\n\
  }\n```\n\n更多变换的参考资料可访问 [`compass-style.org/reference/compass/css3/transform/`](http://compass-style.org/reference/compass/css3/transform/)。\n\
  \n## 使用 Compass 扩展\n\n在本节中，您将运用 Sass 和 Compass 技能编写一个 Compass 扩展，通过这种方式您能与社区共享代码。您将探讨构建扩展所需的设计决策，并了解相关的最佳实践。\n\
  \nCompass 扩展是共享 Sass 脚本以便他人使用的方式。除了共享之外，它们还可以作为框架中的独立模块使用。编写 Compass 扩展比复制粘贴 Sass\
  \ 代码片段是更好的方法。\n\n在此示例中，您将创建一个输出自定义按钮样式的函数，并将其打包成一个名为 `colorExtension` 的简单扩展。\n\n\
  您首先需要创建一个以扩展名命名的目录，并在其中添加一个同名的 SCSS 文件。这是最基本、最简单的扩展形式，也称为*临时*扩展。\n\n用户只需将目录复制到项目下的扩展文件夹中，即可安装临时扩展。将扩展复制到正确的目录后，该扩展的\
  \ Sass 文件就可以像项目中其他 Sass 文件一样被导入。\n\n对于独立项目，扩展应放置在项目文件夹根目录下的扩展文件夹中，例如 `projectDirectory/extensions/customButton/`。请注意，Compass\
  \ 不会自动创建此文件夹。用户需要手动添加。\n\n\n\n接下来，你需要在扩展文件中添加所需的代码，如代码清单 5-82 所示。为了方便起见，请注意文件名和扩展混合宏的名称保持一致。在实际场景中，它们可能会有所不同。\n\
  \n![9781484213483_Fig05-22.jpg](img/9781484213483_Fig05-22.jpg)\n\n图 5-22. 包含扩展的目录结构\n\
  \n***代码清单 5-82***. 向扩展文件`customButton.scss`中添加代码\n\n```\n@mixin customButton() {\n\
  \   cursor: pointer;\n   padding: 10px 15px;\n   background-color: #eee;\n   border:\
  \ #bbb 1px solid;\n   color: #555;\n   @include border-radius(25%);\n   @include\
  \ transition-property(all);\n   &:hover {\n      background-color:#bbb;\n   }\n\
  }\n```\n\n接下来，你需要在 `screen.scss` 文件中导入此扩展，以便能够使用它。如代码清单 5-83 所示。\n\n***代码清单 5-83***.\
  \ 在你的`screen.scss`中导入扩展\n\n```\n// Code for custom extension\n@import \"customButton\"\
  ;\n.primaryAction{\n   @include customButton;\n}\n```\n\n除了将扩展导入 `SCSS` 文件之外，你还需要在\
  \ `.primaryAction` 类中包含来自该扩展的混合宏。\n\n该代码的输出如代码清单 5-84 所示。\n\n***代码清单 5-84***. 代码清单\
  \ 5-83 的输出\n\n```\n/* line 191, ../sass/screen.scss */\n.primaryAction {\n  cursor:\
  \ pointer;\n  padding: 10px 15px;\n  background-color: #eee;\n  border: #bbb 1px\
  \ solid;\n  color: #555;\n  -moz-border-radius: 25%;\n  -webkit-border-radius: 25%;\n\
  \  border-radius: 25%;\n  -moz-transition-property: all;\n  -o-transition-property:\
  \ all;\n  -webkit-transition-property: all;\n  transition-property: all;\n}\n/*\
  \ line 9, ../extensions/customButton/stylesheets/customButton.scss */\n.primaryAction:hover\
  \ {\nbackground-color: #bbb;\n}\n```\n\n你可以将之前学到的关于混合宏的所有概念应用于扩展中的混合宏。\n\n## 本章小结\n\
