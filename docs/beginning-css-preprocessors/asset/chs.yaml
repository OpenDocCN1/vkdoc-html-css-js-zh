  \n**图 5-19.** 清单 5-53 的输出结果\n\n## `image-url()` 函数\n\n在 CSS 中，指定背景图片时需要指定相对路径。Compass\
  \ 简化了这一过程。Compass 提供的功能允许你在 `config.rb` 中为所有图片定义路径，然后在指定背景图片时直接使用图片名称即可。这在以下清单中进行了演示。\n\
  \n***清单 5-62***。用于 `image-url()` 的 `config.rb`\n\n```\n# Set this to the root of\
  \ your project when deployed:\nhttp_path = \"../\"\ncss_dir = \"stylesheets\"\n\
  sass_dir = \"sass\"\nimages_dir = \"images\"\njavascripts_dir = \"javascripts\"\n\
  ```\n\n清单 5-63。演示 `image-url()` 的示例\n\n```\n// Background image using image-url\n\
  .bgImage{\n   width:128px;\n   height:128px;\n   background:image-url(\"facebook.png\"\
  );\n}\n```\n\n在这段代码中，`image-url` 会自动为背景图片添加相对路径。\n\n***清单 5-64***。清单 5-63 的输出结果\n\
  \n```\n/* line 148, ../sass/screen.scss */\n.bgImage {\n  width: 128px;\n  height:\
  \ 128px;\n  background: url('../images/facebook.png?1447046278');\n}\n```\n\n##\
  \ `image-width()` 函数\n\n无需手动查找背景图片的宽度，你可以使用 Compass 提供的 `image-width` 函数。\n\n该函数接收背景图片的路径/名称作为输入，并以\
  \ `px` 为单位返回宽度。这在清单 5-65 中进行了演示。\n\n***清单 5-65***。使用 `image-width` 的示例\n\n```\n\
  // Background image using image-url\n.bgImage{\n  width:image-width(\"facebook.png\"\
  );\n  height:128px;\n  background:image-url(\"facebook.png\");\n}\n```\n\n其输出结果与清单\
  \ 5-64 相同。\n\n## `image-height()` 函数\n\n与 `image-width` 函数类似，还有一个 `image-height`\
  \ 函数，它返回传入图片的高度。这在清单 5-66 中进行了演示。\n\n***清单 5-66***。使用 `image-height` 的示例\n\n```\n\
  // Background image using image-url\n.bgImage{\n  width:image-width(\"facebook.png\"\
  );\n  height:image-height(\"facebook.png\");\n  background:image-url(\"facebook.png\"\
  );\n}\n```\n\n其输出结果与清单 5-64 相同。\n\n## 图片精灵与 Compass\n\n\n\n### 使用 Compass 实现 CSS\
  \ 图像精灵\n\nWeb 开发的最佳实践指出，使用图像精灵比使用单个图像更好。图像精灵是将所有其他图像合并而成的单个图像。然后通过 `background-position`\
  \ 属性在可视区域内移动这个单个图像。由于这个图像在加载之初就会被加载，因此查看图像时不会有延迟。\n\n这是一个实用的技术，但如果手动操作，需要花费大量精力。Compass\
  \ 简化了使用图像精灵的过程，消除了相关的工作量和复杂性。\n\n### 使用 Compass 创建图像精灵\n\n要使用 Compass 创建图像精灵，你需要一个文件夹来存放所有要放入图像精灵中的图片。你需要在项目根目录下创建一个名为\
  \ `image-sprite` 的文件夹，并将图片放入其中。你需要向该文件夹添加四个文件，如图 5-20 所示。\n\n![9781484213483_Fig05-20.jpg](img/9781484213483_Fig05-20.jpg)\n\
  \n图 5-20。向精灵文件夹添加图片\n\n接下来，你需要将这些图片导入到 SCSS 文件中。具体操作如代码清单 5-67 所示。\n\n***代码清单 5-67***。生成图像精灵\n\
  \n```\n// 创建图像精灵的示例\n@import \"image-loaded/*.png\";\n.socials{\n   @include all-image-loaded-sprites;\n\
  }\n```\n\n在上述代码中，`import` 语句将创建图像精灵文件。接下来的 `@include` 语句将生成使用该精灵所需的 CSS 代码。此代码的输出如代码清单\
  \ 5-68 所示。\n\n***代码清单 5-68***。代码清单 5-67 的输出\n\n```\n/* line 72, image-loaded/*.png\
  \ */\n.image-loaded-sprite, .socials .image-loaded-facebook, .socials .image-loaded-googleplus,\
  \ .socials .image-loaded-linkedin, .socials .image-loaded-twitter {\n  background-image:\
  \ url('/images/image-loaded-sbf38a83327.png');\n  background-repeat: no-repeat;\n\
  }\n\n/* line 84, ../../../../../../Library/Ruby/Gems/2.0.0/gems/compass-core-1.0.3/stylesheets/compass/utilities/sprites/_base.scss\
