  ```\n\n\n\n- 执行命令`gem list sass –pre –r`可查看可用的预发布版本，如代码清单 2-5 所示。\n\n**代码清单 2-5****：通过命令行查看预发布版本**\n\
  \n```\ngem list sass –pre –r\n```\n\n- 如需试用稳定版中尚未包含的最新功能，可安装预发布版本。使用代码清单 2-6 所示的命令进行安装。\n\
  \n**代码清单 2-6****：安装预发布版本**\n\n```\nsudo gem install sass –pre\n```\n\n- 某些情况下可能需要卸载已安装的\
  \ Sass 版本（例如使用支持项目中某些弃用功能的旧版本），可通过代码清单 2-7 所示方法操作。\n\n**代码清单 2-7****：卸载 Sass 的命令**\n\
  \n```\ngem uninstall sass –-version versionnumber\n```\n\n## 命令行替代方案\n\n除终端方式外，还有图形用户界面应用可运行并编译\
  \ Sass，适合不熟悉或畏惧终端操作的用户。各平台均有免费及付费版本，部分应用如下：\n\n*   Codekit（付费，仅 Mac）\n*   Compass（付费，支持\
  \ Mac/Windows/Linux）\n*   Prepros（付费，支持 Mac/Windows/Linux）\n*   Mixtures（免费，仅 Mac）\n\
  *   Scout（开源，支持 Mac/Windows/Linux）\n*   Koala（免费，支持 Mac/Windows/Linux）\n\n## 编译\
  \ Sass 文件\n\n安装 Sass 后即可开始编码与编译。需指定 Sass 监听的哪个文件，使用代码清单 2-8 所示的命令。\n\n**代码清单 2-8****：Sass\
  \ 监听并编译文件的命令**\n\n```\nsass --watch style.scss:style.css\n```\n\n代码清单 2-8 所示命令会监听`.scss`文件的变更。每当修改并保存`.scss`文件时，Sass\
  \ 会编译并生成对应的`.css`文件。该命令可分解为：\n\n*   `sass`（主组件，表明这是一个 Sass 命令）\n*   `--watch`（该命令需执行的操作）\n\
  *   `style.scss:style.css`（输入与输出文件，以冒号分隔）\n\n在终端中输入代码清单 2-9 所示命令可查看更多命令选项。\n\n**代码清单\
  \ 2-9****：访问 Sass 文档的命令**\n\n```\nsass --help\n```\n\n## 使用应用避免命令行：Scout\n\nScout\
  \ 是一款基于 Adobe Air 构建的免费应用，可从[`mhs.github.io/scout-app/`](http://mhs.github.io/scout-app/)下载。打开应用后，点击左下角的加号图标添加项目。图\
  \ 2-2 展示了 Scout 应用的界面。\n\n![9781484213483_Fig02-02.jpg](img/9781484213483_Fig02-02.jpg)\n\
  \n图 2-2 Scout 应用界面；需点击左下角加号图标开始操作\n\n点击加号后，将看到图 2-3 所示的界面。\n\n![9781484213483_Fig02-03.jpg](img/9781484213483_Fig02-03.jpg)\n\
  \n图 2-3 向 Scout 添加项目\n\n如图所示，可配置多种参数，包括样式表目录、JavaScript 目录和图像目录。还可在“Config File”字段中指定\
  \ Sass 编译的配置文件。请注意“Output Modes”选项。保持默认设置可获得优化且可读的代码，不进行压缩。\n\n可设置不同的输出样式以进一步压缩输出结果。本示例中使用前两个字段指定样式表的输入和输出文件夹。\n\
  \n设置好所需字段后，点击项目名称旁的“Start”按钮启动 Scout 项目，将看到图 2-4 所示的界面。\n\n![9781484213483_Fig02-04.jpg](img/9781484213483_Fig02-04.jpg)\n\
  \n图 2-4 选择输入和输出文件夹\n\nScout 会监听所有变更并编译为相应的 CSS（参见图 2-5）。若存在语法问题，用户会立即收到通知。随后可最小化应用，继续开发。\n\
  \n![9781484213483_Fig02-05.jpg](img/9781484213483_Fig02-05.jpg)\n\n图 2-5 Scout 已启动并正在监听项目\n\
  \n## 自动化工作流\n\n与 Scout 类似，还有许多免费工具可加速前端开发。若希望进一步自动化开发流程且不畏惧命令行操作，可了解 Yeoman（[`yeoman.io/`](http://yeoman.io/)），参见图\
  \ 2-6。Yeoman 不仅编译 Sass，还是一个完整的构建系统，可优化图像、刷新浏览器等。其核心功能包括：\n\n*   **脚手架**（根据维基百科：“脚手架是某些模型-视图-控制器框架支持的技术，程序员可指定应用程序数据库的使用方式。编译器或框架利用此规范及预定义的代码模板，生成应用程序可用于创建、读取、更新和删除数据库条目的最终代码，有效地将模板视为构建更强大应用程序的‘脚手架’。公司通常用于创建基于\
  \ Web 的程序。”）\n*   构建系统，生成压缩/编译后的代码构建版本。\n*   包管理器，自动获取所有必需的库。\n\n另一个知名的自动化工具是 Bower（[`bower.io/`](http://bower.io/)）。\n\
  \n![9781484213483_Fig02-06.jpg](img/9781484213483_Fig02-06.jpg)\n\n图 2-6 访问 Yeoman.io\
  \ 获取 Yeoman 框架\n\n### 变量\n\n与其他编程语言类似，变量用于将值关联到一个名称，以便在代码中重复使用。因此，您只需引用名称，而无需克隆值。在\
  \ Sass 中，可存储颜色、排版信息等可复用内容。使用`$`符号创建 Sass 变量，如代码清单 2-10 所示。\n\n**代码清单 2-10****：在\
  \ Sass 中创建变量**\n\n```\n$fontColor:#666;\n\nbody{\n        color:$fontColor;\n}\n\
  ```\n\n当此 Sass 代码编译为普通 CSS 时，`body`样式定义中的`$fontColor`会被实际值替换。\n\n变量如果在任何样式声明之外声明，则是全局可访问的；如果在特定选择器内声明，则仅对该选择器可用。参见代码清单\
  \ 2-11 中的示例。\n\n**代码清单 2-11****：演示变量作用域的代码**\n\n```\nbody{\n  $fontColor:#666;\n\
  \  color:$fontColor;\n}\np{\n  color:$fontColor;\n}\n```\n\n此代码会报错：\n\n```\nUndefined\
  \ variable: \"$fontColor\".\n```\n\n这是因为`$fontColor`在`body`标签的样式块内声明。\n\n变量可与样式规则的部分组合，形成单一样式规则。在此类实现中，变量会被其实际值替换。如代码清单\
  \ 2-12 所示。\n\n\n\n### 结合变量组合 CSS 规则代码\n\n**清单 2-12** 结合变量组合 CSS 规则代码\n\n```\n$border-color:\
  \ #000;\n.containerBlock {\n  border: 2px $border-color solid;\n}\n```\n\n你可以基于一个变量来创建另一个变量，具体做法如\
  \ **清单 2-13** 所示。\n\n**清单 2-13** 基于一个变量声明另一个变量\n\n```\n$border-color: #000;\n$borderDeclaration:\
  \ 2px $border-color solid;\n.containerBlock {\n  border:$borderDeclaration;\n}\n\
  ```\n\nSass 允许你在代码中互换使用下划线和连字符。因此，**清单 2-14** 所示的代码是有效的，不会报错。\n\n**清单 2-14** 演示下划线与连字符的互换使用\n\
  \n```\n$color-positive: #0F0;\n.note {\ncolor: $color_positive;\n}\n```\n\n### 数据类型\n\
  \nSass 支持多种数据类型：\n\n- 数值（例如：`2.0`、`15`、`12px`）\n- 字符串（例如：`\"foo\"`、`bar`）\n- 颜色值（例如：`#f00`、`rgb(255,255,150)`）\n\
  - 布尔值（例如：`true`、`false`）\n- 逗号或空格分隔的值（例如：`10px 20px`、`'Tahoma','Arial',san-serif`）\n\
  \nSass 也支持 CSS 的 `!important` 声明。\n\n### 变量的默认值\n\n变量可以被赋予默认值，当未给变量指定具体值时，该默认值就会生效。当你想在代码中统一使用某个默认值，并只在特定情况下修改它时，这一特性会非常有用，如\
  \ **清单 2-15** 和 **2-16** 所示。\n\n**清单 2-15** 默认值示例\n\n```\n$borderRadius: 5px !default;\n\
  ```\n\n**清单 2-16** 显式指定值时默认值被忽略的示例\n\n```\n$borderRadius:10px;\n.notArea{\n    \
  \    Border-radius:$borderRadius;\n}\n```\n\n**清单 2-17** **清单 2-16** 的输出结果\n\n```\n\
  .notArea{\n        Border-radius:10px;\n}\n```\n\n如果在运行 **清单 2-16** 的代码时，没有显式指定\
  \ `borderRadius` 的值，代码会继续使用默认值。因此，输出结果将如 **清单 2-18** 所示。\n\n**清单 2-18** 未显式定义 `borderRadius`\
  \ 值时 **清单 2-16** 的输出结果\n\n```\n.notArea{\n        Border-radius:5px;\n}\n```\n\n\
  ### Sass 中的样式嵌套\n\n编写 CSS 时，你必须重复选择器来为某些元素下的子元素分配样式规则。**清单 2-19** 所示的代码就是一个常见的选择器重复示例。\n\
  \n**清单 2-19** CSS 中的代码重复\n\n```\n.article .h1 {\n  font-weight: bold;\n}\n\n.article\
  \ p {\n  line-height: 1em;\n}\n\n.article img {\n  float: left;\n}\n```\n\n在 Sass\
  \ 中，你可以通过嵌套 CSS 选择器来避免这种代码重复。因此，**清单 2-19** 的代码用 Sass 重写后会如 **清单 2-20** 所示。\n\n\
  **清单 2-20** **清单 2-19** 的 Sass 版本\n\n```\n.article{\n  .h1{\n    font-weight:bold;\n\
  \  }\n  p{\n    line-height:1em;\n  }\n  img{\n    float:left;\n  }\n}\n```\n\n\
  这种方法不仅消除了代码重复，还使代码更具可读性。\n\n选择器组同样可以进行嵌套，如 **清单 2-21** 所示。\n\n**清单 2-21** 嵌套选择器组\n\
  \n```\n.article{\n  p,section{\n    line-height:1em;\n  }\n}\n```\n\n**清单 2-22**\
  \ **清单 2-21** 的输出结果\n\n```\n.article p, .article section {\n  line-height: 1em;\n\
  }\n```\n\n### 引用父选择器：`&`\n\n\n\n在 Sass 中嵌套样式时，很多情况下你可能需要引用父选择器。例如，如果你想为元素的悬停状态编写样式，可以通过在\
  \ `&` 选择器前加前缀来引用父元素，如清单 2-23 所示。\n\n***清单 2-23***. 使用 `&` 引用父选择器\n\n```\na {\n \
  \       text-decoration:none;\n        &:hover {\n                text-decoration:underline;\n\
  \        }\n}\n```\n\n编译此代码时，`&` 会被替换为父选择器。编译后的输出如清单 2-24 所示。\n\n***清单 2-24***.\
  \ 清单 2-23 的输出\n\n```\na {\n        text-decoration:none;\n}\na:hover{\n        text-decoration:underline;\n\
  }\n```\n\n`&` 的另一个特性是，无论嵌套深度如何，它都能解析父选择器。考虑清单 2-25 中的代码。\n\n***清单 2-25***. `&` 在样式声明中嵌套了两层\n\
  \n```\n#contentArea {\n        font-size:1em;\n        a#referenceLinkContainer{\n\
  \                background:#CCC;\n                &:hover{\n                  \
  \      border:1px solid #000;\n                }\n        }\n}\n```\n\n输出如清单 2-26\
  \ 所示。\n\n***清单 2-26***. 清单 2-25 的编译输出\n\n```\n#contentArea{ font-size: 1em;}\n#contentArea\
  \ a#referenceLinkContainer{background: #CCC;}\n#contentArea a#referenceLinkContainer:hover{border:1px\
  \ solid #000;}\n```\n\n在 SCSS 中使用组合器\n\n组合器选择器——`+`、`>` 和 `~`——用于组合选择器。它们告诉浏览器哪些元素处于上下文中。\n\
  \n`>` 也被称为*子组合器*。它用于选择父元素的直接子元素。在前面的例子中，它会选择 `section` 的直接子元素 `h1`，而不会定位嵌套在子元素内部的任何\
  \ `h1`。参见清单 2-27。\n\n***清单 2-27***. 在 CSS 中使用组合器的示例\n\n```\n.article{\n  section\
  \ > h1{\n    line-height:1em;\n  }\n}\n```\n\n`+` 也被称为*相邻组合器*。它用于选择同一层级的下一个元素，不会检查父元素的子元素。如清单\
  \ 2-28 和 2-29 所示。\n\n***清单 2-28***. 演示相邻组合器的 HTML 标记\n\n```\n<section>\n       \
  \ <article>\n                <p>This is a child paragraph</p>\n        </article>\n\
  \        <p>This is an adjacent paragraph</p>\n        <article>\n             \
  \   <p>This is a child paragraph</p>\n        </article>\n</section>\n```\n\n***清单\
  \ 2-29***. 演示相邻组合器的 CSS\n\n```\nArticle + p{\n        Color: #F00;\n}\n```\n\n在清单\
  \ 2-29 所示的代码中，规则将应用于 `article` 标签之后的任何 `p` 标签，而不应用于 `article` 标签内部的 `p` 标签。\n\n\
  `~` 被称为*通用兄弟*组合器。它会选择任意 `article` 之后出现的每个 `article`，无论它们之间有什么元素。参见清单 2-30。\n\n***清单\
  \ 2-30***. 演示通用兄弟组合器的 CSS\n\n```\nArticle ~ article{\n        Color: #F00; \n}\n\
  ```\n\n注释\n\n与其他编程语言一样，Sass 支持单行注释和多行注释。单行注释通过在代码前添加 `//` 创建。多行注释则包含在 `/**/` 中。清单\
  \ 2-31 展示了一些示例。\n\n***清单 2-31***. 注释示例\n\n\n\n```\n// 这是单行注释\n/* 这是\n多行注释 */\n```\n\
  \n当 Sass 文件被编译时，多行注释会被保留，而单行注释会被删除。\n\n## 嵌套属性\n\n与嵌套规则类似，Sass 也允许嵌套属性。例如，考虑 `font-family`、`font-size`\
  \ 和 `font-weight` 等属性，它们都属于 `font` 命名空间。\n\n在 Sass 中，你可以嵌套属于同一命名空间的属性，如清单 2-32 所示。\n\
  \n***清单 2-32***. 嵌套属性\n\n```\n.content{\nfont:{\n        family: 'Tahoma';\n   \
  \     size: 13px;\n        weight: bold;\n        }\n}\n```\n\n此代码编译后如清单 2-33 所示。\n\
  \n***清单 2-33***. 清单 2-32 的输出\n\n```\n.content{\n        font-family: 'Tahoma';\n\
  \        font-size: 13px;\n        font-weight: bold; \n}\n```\n\n## 插值\n\n如果你想要动态构建选择器或属性，就需要使用插值。当你想用循环来生成样式时，这非常有用。例如，你有一个包含社交媒体图标名称的数组，你可以使用循环配合插值来生成这类样式。它也可以用在简单的场景中，比如你想在类名中使用存储在变量中的值，如清单\
  \ 2-34 所示。\n\n插值使用 `#{}` 语法实现。\n\n***清单 2-34***. 展示插值的示例\n\n```\n$innerContainerClass:\
  \ container;\n.left .#{$innerContainerClass} {\n        width:50%;\n        display:inline-block;\n\
  }\n```\n\n***清单 2-35***. 清单 2-34 的输出\n\n```\n.left .container{\n        width:50%;\n\
  \        display:inline-block;\n}\n```\n\n## 占位选择器\n\n占位选择器是一种特殊类型的选择器，看起来与普通的 ID\
  \ 或类选择器相似，但前缀是 `%` 而不是 `#` 或 `.`。占位符与其他选择器的不同之处在于，它们不会在最终的输出 `.css` 文件中呈现。\n\n占位选择器（参见清单\
  \ 2-36）用于扩展某些样式集，同时不将该样式集渲染到最终输出中。你将在下一章学习 `@extend` 时看到它的实现。\n\n***清单 2-36***.\
  \ 占位选择器示例\n\n```\n%importantText{\n        Color:red;\n        Font-weight:bold;\n\
  }\n\n.notice{\n        @extend %importantText;\n}\n```\n\n***清单 2-37***. 清单 2-36\
  \ 的输出，其中 `%importantText` 已被渲染\n\n```\n.notice {\n  Color: red;\n  Font-weight:\
  \ bold;\n}\n```\n\n## Sass 的逻辑能力\n\nSass 不仅通过融入 DRY 原则使编写 CSS 变得简单且易于维护，还增加了核心 CSS\
  \ 所缺失的逻辑和计算等能力。使用 Sass，你可以执行数学计算，根据某些条件执行操作，或者进行循环。让我们更详细地探讨这些方面。\n\n### Sass 中的数学运算\n\
  \nSass 支持加法、减法、乘法和除法。\n\n#### 加法\n\n加法可以如清单 2-38 所示进行操作。\n\n***清单 2-38***. 展示加法的示例\n\
  \n```\n.container{ width: 20%+80%;}\n```\n\n请注意，数学运算只能发生在相同类型的操作数之间。换句话说，你不能在像素和百分比之间执行数学运算。\n\
  \n#### 减法\n\n减法可以如清单 2-39 所示进行操作。\n\n***清单 2-39***. 展示减法的示例\n\n```\n.container{\
  \ width: 80%-40%;}\n```\n\n#### 乘法\n\n乘法可以如清单 2-40 所示进行操作。\n\n\n\n***列表 2-40***.\
  \ 展示乘法示例\n\n```\n.container{ width: 80%*40%;}\n```\n\n**除法**\n\n除法可按列表 2-41 所示的方式实现。\n\
  \n***列表 2-41***. 展示除法示例\n\n```\n.container{ width: 80%/40%;}\n```\n\n**括号**\n\n\
  在 Sass 中，括号用于控制运算顺序，如列表 2-42 所示。\n\n***列表 2-42***. 括号的实际应用\n\n```\n.leftSide{\n\
  \        Font-size:1em + (.2em*2);\n}\n```\n\n***列表 2-43***. 列表 2-42 的输出\n\n```\n\
  .leftSide{\n        Font-size:1.4em;\n}\n```\n\n**使用变量进行计算**\n\n计算也可以使用变量进行。请参考列表\
  \ 2-44。\n\n***列表 2-44***. 使用变量进行计算的示例\n\n```\n$container:100%;\n$contentArea:50%;\n\
  $gutter:10%;\n.sidebar{\n  width: $container - ($contentArea+$gutter);\n}\n```\n\
  \n**控制指令**\n\nSass 提供了控制指令，用于根据某些条件包含样式或引入样式变体。\n\n控制指令较为复杂，通常不用于日常开发。它们主要用于混合（mixins）中，以增强其灵活性。这在诸如\
  \ Compass 等库的混合中很常见，后续章节会对此进行介绍。\n\n`@if`\n\n该控制指令接受一个表达式，如果表达式计算结果不为 `false` 或\
  \ `null`，则应用关联的样式，如列表 2-45 所示。\n\n***列表 2-45***. 使用 `@if` 的示例\n\n```\n$isVisible\
  \ : true !default;\n.container{\n  @if $isVisible{\n    display: block;\n  }\n \
  \ @else{\n    display: none;\n  }\n}\n```\n\n在上述代码中，`$isVisible` 在 `.container`\
  \ 内部被求值，并根据结果应用样式。\n\n***列表 2-46***. 列表 2-45 的输出\n\n```\n.container {\n  display:\
  \ block;\n}\n```\n\n`@if` 可以与一个或多个 `@else if` 语句以及一个 `@else` 语句组合使用。列表 2-47 展示了一个示例，其中背景颜色根据文本形式的颜色应用十六进制代码。\n\
  \n***列表 2-47***. `@if`、`@else if` 和 `@else` 的组合使用\n\n```\n$blockColor: green;\n\
  .container {\n  @if $blockColor == red {\n    background-color: #f00;\n  } @else\
  \ if $blockColor == green {\n    background-color: #0f0;\n  } @else if $blockColor\
  \ == blue {\n    background-color: #00f;\n  } @else {\n    background-color: #000;\n\
  \  }\n}\n```\n\n***列表 2-48***. `@if`、`@else if` 和 `@else` 的组合使用\n\n```\n.container\
  \ {\n  background-color: #0f0;\n}\n```\n\n`@for`\n\n`@for` 指令用于通过循环输出样式。使用 `@for`\
  \ 循环，你可以根据计数器的值调整样式。它有两种变体：\n\n*   使用 `through`（`$counter` 从 `<开始值>` 到 `<结束值>`，包含结束值）\n\
  *   使用 `to`（`$counter` 从 `<开始值>` 到 `<结束值>`，不包含结束值）\n\n当 `<开始值>` 大于 `<结束值>` 时，计数器会递减。`through`\
  \ 和 `to` 的主要区别在于前者包含 `<结束值>`，而后者不包含。请参见列表 2-49 至 2-52。\n\n***列表 2-49***. 使用 `@for`\
  \ 配合 `through` 的示例\n\n```\n@for $size from 1 through 3 {\n  .header-#{$size} { font-size:\
  \ 2em * $size; }\n}\n```\n\n***列表 2-50***. 列表 2-49 的输出\n\n```\n.header-1 {\n  font-size:\
  \ 2em;\n}\n\n.header-2 {\n  font-size: 4em;\n}\n\n.header-3 {\n  font-size: 6em;\n\
  }\n```\n\n***列表 2-51***. 使用 `@for` 配合 `to` 的示例\n\n```\n@for $size from 1 to 3 {\n\
  \  .header-#{$size} { font-size: 2em * $size; }\n}\n```\n\n\n\n***列表 2-52***。列表\
  \ 2-51 的输出\n\n```\n.header-1 {\n  font-size: 2em;\n}\n\n.header-2 {\n  font-size:\
  \ 4em;\n}\n```\n\n### `@each`\n\n`@each` 指令是另一个与 `@for` 类似的循环指令，区别在于它不使用计数器，而是提供一个列表来决定执行何种操作。\n\
  \n思考一个构建社交图标样式的例子，如列表 2-53 所示。你遍历一个包含社交图标名称的数组，并利用插值生成带有名称和背景图片的样式类。\n\n***列表 2-53***。演示\
  \ `@each` 实现的示例\n\n```\n$socials: twitter linkedin pinterest;\n@each $social in\
  \ $socials {\n  .#{$social} {\n    background-image: url(/images/icons/#{$social}.png);\n\
  \    width:16px;height:16px;\n  }\n}\n```\n\n***列表 2-54***。列表 2-53 的输出\n\n```\n\
  .twitter {\n  background-image: url(/images/icons/twitter.png);\n  width: 16px;\n\
  \  height: 16px;\n}\n\n.linkedin {\n  background-image: url(/images/icons/linkedin.png);\n\
  \  width: 16px;\n  height: 16px;\n}\n\n.pinterest {\n  background-image: url(/images/icons/pinterest.png);\n\
  \  width: 16px;\n  height: 16px;\n}\n```\n\n可以在 `@each` 中使用多个变量并将其列出，如列表 2-55 所示。在此示例中，你将两个变量作为循环中的一个元素使用。`$notification`\
  \ 和 `$color` 这一对被视作单个循环实体，经过求值后，相应地生成样式。\n\n***列表 2-55***。演示使用多个列表实现 `@each` 的示例\n\
  \n```\n@each $notification, $color in (success, green),(warning, amber),(error,red)\
  \ {\n  .#{$notification}-icon {\n    background-color: $color;\n  }\n}\n```\n\n\
  ***列表 2-56***。列表 2-55 的输出\n\n```\n.success-icon {\n  background-color: green;\n\
  }\n\n.warning-icon {\n  background-color: amber;\n}\n\n.error-icon {\n  background-color:\
  \ red;\n}\n```\n\n### `@while`\n\n`@while` 指令会一直迭代，直到给定的条件不再满足为止，并输出 while 循环体内部嵌套的样式。列表\
  \ 2-57 展示了一个为响应式设计构建列布局的示例。它使用 while 循环构建了一个四列网格。\n\n***列表 2-57***。演示 `@while` 的示例\n\
  \n```\n$col: 4;\n@while $col > 0 {\n  .cols-#{$col} {\n    width: 100% / $col;\n\
  \  }\n  $col: $col - 1;\n}\n```\n\n***列表 2-58***。列表 2-57 的输出\n\n```\n.cols-4 {\n\
  \  width: 25%;\n}\n\n.cols-3 {\n  width: 33.33333%;\n}\n\n.cols-2 {\n  width: 50%;\n\
  }\n\n.cols-1 {\n  width: 100%;\n}\n```\n\n## 本章小结\n\n本章介绍了 Sass 的基本组件。在下一章中，你将深入学习\
  \ Sass 的高级方面，例如创建混入和扩展已有样式。\n\n"
