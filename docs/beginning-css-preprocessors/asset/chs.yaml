  \   @include transition-delay(3s);\n}\n.widthDelay:hover{\n   background:#BBB;\n\
  }\n```\n\n\n\n在本示例中，你首先设置了将随过渡变化的属性。在此例中，你对任何属性应用的所有更改都将伴随过渡效果。第二个示例中，你设置了过渡的持续时间（即过渡完成所需的时间）。第三个示例中，你设置了过渡的缓动属性（即过渡开始和结束时的平滑程度）。最后一个示例中，你设置了延迟（过渡开始前的延迟时间）。其输出结果如清单\
