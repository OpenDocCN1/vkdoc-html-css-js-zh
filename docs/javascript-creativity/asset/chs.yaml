  \n\n## 介绍拖放功能\n\n你经常会想要将拖放功能用作动画的一部分，或者作为应用程序的组成部分。这可能用于在页面上拖动元素来触发事件，也可能用于将文件从系统拖入浏览器。我将介绍一个使用相对高级的应用，它类似于一本涂色书，你可以将图像拖到画布上，它会生成用户可以上色的线条画。这两个例子都很好地说明了我们如何使用现代\
  \ HTML 创建令人印象深刻的界面，并证明这些技术不仅仅用于游戏开发！\n\n正如前面提到的，我将通过创建一个小的涂色书网页应用来演示将本地文件拖入浏览器的技术。在该应用中，将图像拖到画布上会将其转换为线条画，然后可以使用画笔进行着色。我制作这样一个应用的原因，一方面是让你思考一些略微高级的技术，例如边缘检测，但更重要的是，我希望你有一个可以摆弄的东西，并随心所欲地扩展其功能——学习唯一的方法就是实践。因此，在整个这个迷你项目以及整本书中，我都会提供一些想法并提及一些算法，供你思考并实现。\n\
  \n对于我们的涂色书，我们需要从一个全尺寸的画布开始。这是通过 JavaScript 完成的，因为通过 CSS 设置 100% 的宽度和高度会缩放画布，而不是增加其尺寸。我们还需要为\
  \ `'dragover'`、`'dragenter'` 和 `'drop'` 事件设置事件监听器。对于前两个事件，我们需要阻止浏览器的默认行为，因此我创建了一个名为\
  \ `preventDefault` 的简单函数，它在事件上调用同名方法。在清单 2-3 中，你可以看到用于设置画布以启用拖放功能的样板代码。\n\n**清单\
  \ 2-3.**\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>涂色书</title>\n</head>\n\
  <body style=\"margin:0\">\n<canvas id=\"drop\"></canvas>\n</body>\n<script>\n(function()\
  \ {\nvar drop = document.querySelector(\"#drop\");\nvar ctx = drop.getContext('2d');\n\
  /* 将画布设置为全宽 */\ndrop.height = window.innerHeight;\ndrop.width = window.innerWidth;\n\
  drop.addEventListener('dragover', preventDefault);\ndrop.addEventListener('dragenter',\
  \ preventDefault);\ndrop.addEventListener('drop', handleDrop);\nfunction preventDefault(e)\
  \ {\nif (e.preventDefault) {\ne.preventDefault();\n}\nreturn false;\n}\nfunction\
  \ handleDrop(e) {\ne.stopPropagation();\ne.preventDefault();\ne.dataTransfer.dropEffect\
  \ = \"copy\";\n// 放置处理的代码将写在此处\n}\n})();\n</script>\n</html>\n```\n\n如清单 2-3 所示，这提供了一个良好的起点，但现在我们需要实际将图像放到画布上。我们需要使用的所有数据都存储在\
  \ `handleDrop` 的事件变量 `e` 中，因此我们可以使用 `e.dataTransfer.files[0];` 将文件本身移动到它自己的变量中——我恰当地将其命名为\
  \ `'file'`——这为我们提供了第一个被放置的文件（在此示例中，我们只使用一个）。当然，你可以扩展此功能，让每个放置的文件都在单独的画布中打开，就像 Photoshop\
  \ 那样。\n\n由于实现方式的原因，要将图像绘制到画布上，必须首先将其放入一个 HTML 元素中；这有点奇怪，但一旦你了解了它，就很容易处理，幸运的是，该元素不需要添加到\
  \ DOM 中。我们还需要一个 `FileReader` 来完成两件事：首先将文件转换为 base 64 数据 URL，其次在文件加载后将数据 URL 添加到图像元素的\
  \ `src` 属性中。\n\n```\nvar file = e.dataTransfer.files[0];\nvar image = new Image();\n\
  var reader = new FileReader();\nreader.readAsDataURL(file);\nreader.onload = (function()\
  \ {\nreturn function(e)  {\nimage.src = e.target.result;\n};\n})();\n```\n\n所以现在图像存在了，并且位于\
  \ `image.src` 中，但我们还看不到它，因为它还没有被添加到 DOM 或绘制到画布上。是时候解决这个问题了！与 `reader` 有 `onload`\
  \ 事件处理属性一样，`image` 也有。所以我们只需要编写一个函数，将图像绘制到画布左上角（即 `(0,0)`）的上下文中。实现如下：\n\n```\nfunction\
  \ handleDrop(e) {\ne.stopPropagation();\ne.preventDefault();\ne.dataTransfer.dropEffect\
  \ = \"copy\";\nvar file = e.dataTransfer.files[0];\nvar image = new Image();\nvar\
  \ reader = new FileReader();\nreader.readAsDataURL(file);\nreader.onload = (function()\
  \ {\nreturn function(e)  {\nimage.src = e.target.result;\n};\n})();\nimage.onload\
  \ = function() {\nctx.drawImage(image, 0, 0);\n};\n}\n```\n\n现在如果你将其复制到模块中，应该能够将图像放到页面上，并让它们出现在画布上！\n\
  \n接下来，我们将编写一个“朴素”的边缘检测滤镜，它大致基于 Sobel 算子。此滤镜的实现基于 HTML 规范中关于像素操作的一个示例（我们的版本将颜色减少为黑白线条）。还有一个更高级的基于\
  \ Sobel 的版本，称为 Canny 边缘检测（由 John F. Canny 于 1986 年开发）。这是你可能想要自己添加的一个特性，因为它包含了降噪功能，因此可以生成质量更高的线条画。\n\
  \n让我们首先创建一个名为 `findEdges` 的新函数，它接受一个名为 `originalData` 的参数，该参数应保存上下文的图像数据；即，画布上显示的内容的当前上下文状态副本（在本例中，是我们的图像）。在函数内部，我们应该创建一个变量，我们称之为\
  \ `output`，用于保存我们将写入每个像素的临时图像数据，以便随后将其放回上下文。现在，你需要记住另一件奇怪的事情：要将像素写入图像数据，你必须有两个变量，一个用于\
  \ `ImageData`（我们的 `output` 变量），一个用于 `ImageData.data`（我们称之为 `outputData`），这听起来很蠢，但两者紧密耦合，因此你写入\
  \ `outputData`，然后将 `output`（自动包含正确的数据）放到画布上下文中。在我们进入边缘检测算法之前，我将向你展示所有这些设置代码。\n\n\
  ```\nfunction findEdges(originalData) {\nvar output = ctx.createImageData(drop.width,\
  \ drop.height);\nvar w = originalData.width, h = originalData.height;\nvar inputData\
  \ = originalData.data;\nvar outputData = output.data;\nvar threshold = 100;\n//\
  \ 边缘检测代码写在此处\n// 操作后将图像数据放回\nctx.putImageData(output, 0, 0);\n}\n```\n\n要编写算法，你首先需要理解数据结构，它是一个\
  \ `Uint8ClampedArray`。虽然这个名字听起来很吓人，但它是一个 8 位无符号（仅正数）整数数组（或者我更喜欢的说法——字节大小的元素！），其组织方式非常简单，遵循“红、绿、蓝、Alpha”的模式，然后重复自身，因此每个像素由四个数组元素组成。\n\
  \n要计算像素的位置 (`i`)，我们需要两个循环，一个用于图像的高度 (`y`)，另一个用于宽度 (`x`)。然后，我们可以通过计算 `y` 乘以画布的宽度来得到每个像素的第一个颜色（红色），因为数组是按行存储的，然后加上\
  \ `x` 来找到该行中的位置。当然，由于组成像素的颜色（包括 Alpha）数量，这需要乘以 4。\n\n```\nfor (var y = 0; y < h;\
  \ y += 1) {\nfor (var x = 0; x < w; x += 1) {\nvar i = (y * w + x) * 4;\n}\n}\n\
  ```\n\n\n\n现在我们已经确定了每个像素的位置，需要计算加权平均值。具体做法是将所有相邻像素（包括水平、垂直和对角线方向）的颜色相加，然后减去当前颜色的\
  \ 8 倍（因为共有 8 个邻居）。完成后，根据阈值将像素的所有颜色（包括 Alpha 通道）设置为`255`或`0`。我之前将阈值设为`100`，但你可以自由调整数值以获得最佳效果。最后，我们将输出（`ImageData`）绘制到画布的上下文中。\n\
  \n```javascript\nimage.onload = function() {\n\n    ctx.drawImage(image, 0, 0);\n\
  \n    var originalData = ctx.getImageData(0, 0, drop.width, drop.height);\n\n  \
  \  findEdges(originalData);\n\n};\n\nfunction findEdges(originalData) {\n\n    var\
  \ output = ctx.createImageData(drop.width, drop.height);\n\n    var w = originalData.width,\
  \ h = originalData.height;\n\n    var inputData = originalData.data;\n\n    var\
  \ outputData = output.data;\n\n    var threshold = 100;\n\n    // 边缘检测\n\n    for\
  \ (var y = 0; y < h; y += 1) {\n\n        for (var x = 0; x < w; x += 1) {\n\n \
  \           var i = (y * w + x) * 4;\n\n            outputData[i] = inputData[i\
  \ - w*4 - 4]  +   inputData[i - w*4]  + inputData[i - w*4 + 4] +\n\n           \
  \ inputData[i - 4]           - 8 * inputData[i]           + inputData[i + 4] +\n\
  \n            inputData[i + w*4 - 4] + inputData[i + w*4] + inputData[i + w*4 +\
  \ 4];\n\n            if (outputData[i] < threshold)\n\n            {\n\n       \
  \         outputData[i] = 255;\n\n                outputData[i+1] = 255;\n\n   \
  \             outputData[i+2] = 255;\n\n            }\n\n            else\n\n  \
  \          {\n\n                outputData[i] = 0;\n\n                outputData[i+1]\
  \ = 0;\n\n                outputData[i+2] = 0;\n\n            }\n\n            outputData[i\
  \ + 3] = 255; // alpha\n\n        }\n\n    }\n\n    // 处理后将图像数据放回\n\n    ctx.putImageData(output,\
  \ 0, 0);\n\n}\n```\n\n现在，当你将图像拖拽到画布上时，应该能得到一个粗略的轮廓。如果你愿意接受挑战，可以尝试改进轮廓的质量。正如我之前提到的，最好的方法可能是实现\
  \ Canny 边缘检测，但也有一些更简单的调整可以改善效果。如果尝试优化算法，请务必通过 Twitter 或电子邮件告知我！\n\n## 制作画笔\n\n接下来要制作一支画笔——一支圆形的笔刷，而不是包含所有刷毛的现代\
  \ Photoshop 风格画笔。\n\n与之前一样，我们需要确定要触发哪些事件。我认为应该使用`mousedown`来触发绘图，`mouseup`停止绘图，`mousemove`在鼠标按住时绘制。我们可以通过一个名为`drawing`的布尔变量来检查状态。在`mousedown`中，我们需要调用一个函数（我将其命名为`startPath`）来开始路径；这一步需要与路径的其他部分分开处理，以避免每次鼠标移动时都尝试开始新路径。在`startPath`中，我们需要使用`ctx.beginPath()`开始路径，然后将画笔移动到鼠标的当前位置。在\
  \ Canvas（以及大多数其他计算机图形库）中，`moveTo`用于在不绘制的情况下移动画笔，而`lineTo`用于从当前位置绘制到新位置。我还在`startPath`中设置了画笔的大小和颜色。\n\
  \n```javascript\ndrop.addEventListener('mousedown', startPath);\n\ndrop.addEventListener('mouseup',\
  \ function() {\n\n    drawing = false;\n\n});\n\ndrop.addEventListener('mousemove',\
  \ handleDrawing);\n\nfunction startPath(e)  {\n\n    ctx.strokeStyle = \"#0000ff\"\
  ;\n\n    ctx.lineWidth   = lineWidth;\n\n    ctx.beginPath();\n\n    ctx.moveTo(e.clientX\
  \ + lineWidth, e.clientY + lineWidth);\n\n    drawing = true;\n\n}\n```\n\n从代码中可以看出，`mousemove`触发了一个名为`handleDrawing`的函数。该函数使用之前提到的`lineTo`绘制路径，并通过`stroke`使其具有`startPath`中指定的大小和颜色。\n\
  \n```javascript\nfunction handleDrawing(e)  {\n\n    if (drawing == true)\n\n  \
  \  {\n\n        ctx.lineTo(e.clientX + lineWidth, e.clientY + lineWidth);\n\n  \
  \      ctx.stroke();\n\n    }\n\n}\n```\n\n最后一项任务是让这张图片可以下载。为此，我们需要回到在链接的`href`中使用`toDataURL`的方法。要使链接可下载，可以使用`download`属性——这是某些现代浏览器支持的新功能。在其他浏览器上，用户需要右键单击并手动保存图片。如果需要，你可以将其添加到替代文本中，以方便使用。\n\
  \n```javascript\nvar save = document.querySelector(\"#save\");\n\nsave.addEventListener('click',\
  \ saveCanvas);\n\nfunction saveCanvas()  {\n\n    var img = drop.toDataURL(\"image/png\"\
  );\n\n    save.href = img;\n\n    save.download = \"colouringBook.png\";\n\n}\n\
  ```\n\n`<a id=\"save\" class=\"button\">保存</a>`\n\n你可以在下面的清单 2-4 中查看完整的示例。\n\n**清单\
