  var average = 0;\nfor (var i = 0; i < freqData.length; i++)  {\naverage += freqData[i];\n\
  }\naverage = average / freqData.length;\nreturn average;\n}\n\nfunction interpolate(a,b)\
  \ {\nreturn a + (b-a) * 0.04;\n}\n```\n\n开头部分只是我们通常在 canvas 中使用的设置代码，用于获取上下文和尺寸。然而，在这些行之后，有一行非常强大的代码：`g.globalCompositeOperation\
  \ = \"lighter\"`。如果你在技术层面有计算机图形学的经验，或者使用过 Photoshop（或其他图形软件）中的混合模式，那么你就会明白它的作用。合成操作是一种合成形式（与裁剪一起），用于根据多个形状的重叠方式（基于许多常见算法）来操作它们。合成操作符本身被称为\
  \ Porter-Duff 操作符（以发明者命名），但在 canvas 中使用时名称略有不同。合成操作有很多种。这里我们使用的是 `lighter`，它只会让形状重叠的区域颜色变得更亮，是重叠形状颜色的混合结果。默认操作是\
  \ `source-over`。表 6-1 是所有可用操作符的完整列表（来自 canvas 规范）：\n\n*表 6-1.*\n\n| 操作名称 | Porter-Duff\
  \ 操作符 | 描述 |\n| --- | --- | --- |\n| `source-atop` | A atop B | 在源图像和目标图像都不透明的地方显示源图像。在目标图像不透明但源图像透明的地方显示目标图像。其他地方显示透明。\
  \ |\n| `source-in` | A in B | 在源图像和目标图像都不透明的地方显示源图像。其他地方显示透明。 |\n| `source-out`\
  \ | A out B | 在源图像不透明且目标图像透明的地方显示源图像。其他地方显示透明。 |\n| `source-over` | A over B | 在源图像不透明的地方显示源图像。其他地方显示目标图像。这是默认操作。\
  \ |\n| `destination-atop` | B atop A | 与 `source-atop` 相同，但使用目标图像代替源图像，反之亦然。 |\n\
  | `destination-in` | B in A | 与 `source-in` 相同，但使用目标图像代替源图像，反之亦然。 |\n| `destination-out`\
  \ | B out A | 与 `source-out` 相同，但使用目标图像代替源图像，反之亦然。 |\n| `destination-over` | B over\
  \ A | 与 `source-over` 相同，但使用目标图像代替源图像，反之亦然。 |\n| `lighter` | A plus B | 显示源图像和目标图像的总和，颜色值以\
  \ 255（100%）为上限。 |\n| `copy` | A (B 被忽略) | 显示源图像，而不是目标图像。 |\n| `xor` | A xor B |\
  \ 源图像和目标图像的异或操作。 |\n\n\n\n代码的下一部分使用一个比例来缩放和平移画布。严格来说，这并不是必需的，但我决定保留它，因为这是一种有趣的优化方法。基本上，我们不会绘制整个画布的坐标，而是将坐标绘制在\
  \ `-1` 到 `1` 之间，从而提升性能，因为转换画布比逐个绘制整个画布更简单、更快捷。`lastPointVisible` 布尔值是另一个微小的优化，它仅用于渲染前景，这样背景中不可见的部分就不会被渲染。接下来，我们需要使用\
  \ `requestAnimationFrame`，原因与之前相同：保持动画流畅，并且只在需要时进行处理（这显然是非常耗费资源的代码）。`RAF` 调用一个 `draw`\
  \ 函数来绘制每一帧。顺便说一句，你是否已经看到了其中的模式？每个项目都可以简化为几个模式，这就是为什么我使用一些你可能永远不需要构建的示例——这些概念本身就很有用！\n\
  \n在 `draw` 函数内部，我们获取频率数据。现在我们面临一个小困境……如何使用这些数据？在这个例子中，我决定只使用平均频率来移动可视化中的线条，但还有很多其他方式可以尝试。一个好主意可能是计算每分钟的节拍（BPM），或者使用独立的线条来表示不同的频率范围。\n\
  \n完整的代码列表一如既往地可以在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
  \ 和我自己的网站 [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)\
  \ 上找到。\n\n## 总结\n\n那是一个特别长的项目，所以我确保只解释那些不太明显的概念或代码；希望你没有在这个过程中迷失方向。当然，音乐播放器的范围非常广泛，本章只是触及了你能实现的功能的皮毛，因此我选择了那些能让你在其他项目中学习到最多技能的功能。我强烈鼓励你探索项目的其他方向，例如添加插件系统或将音乐可视化器转换为\
  \ 3D（目前它给人以 3D 的效果，但仅以 2D 显示）。我略过了可视化中的大量数学内容，因为我旨在探索使用 JavaScript 可以创作的创意内容，而不是教授数学。但我强烈推荐阅读\
  \ Steven Wittens 关于其 js1k 演示制作的文章，网址为 [`http://acko.net/blog/js1k-demo-the-making-of`](http://acko.net/blog/js1k-demo-the-making-of)。\n\
