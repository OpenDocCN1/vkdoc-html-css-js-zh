  \ Math.sqrt(dx * dx + dy * dy);\n    }\n\n    function angleBetween(x1, y1, x2,\
  \ y2)\n    {\n        return Math.atan2(y1 - y2, x1 - x2) * (180.0 / Math.PI);\n\
  \    }\n\n    function angleDifference(a1, a2)\n    {\n        return ((((a1 - a2)\
