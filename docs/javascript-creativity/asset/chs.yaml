  }\n```\n\n## 总结\n\n我希望通过本章，你对如何实时处理视频并利用它产生实用的解决方案有了更深入的理解。运动检测和目标追踪是计算机视觉的两个关键起点。虽然目前网络上计算机视觉的应用场景可能还不多，但我们开始看到越来越多的应用，例如在照片中检测人脸以便标记人物。一些公司（*咳咳*\
  \ 脸书）甚至在推进人脸识别，而这正是基于人脸检测的。许多人认为计算机视觉极其复杂，只有学术界才需要关注，但事实并非如此。我强烈建议你进一步探索这个主题，其中很多内容超出了本书的范围，但如果你查看附录，你会找到一些额外的信息和有用的资源以便进一步阅读。下一章将基于本章的一些概念进行构建，尽管我们将使用一个相当简单的算法来检测手指的运动，以便我们可以用它来在本书前面构建的键盘上弹奏一个音符。希望你能看到，无论是通过编写简单算法还是利用他人已有的库，入门计算机视觉并不像大多数人想象的那么困难，而且现在通过使用\
  \ HTML5 和 JavaScript 就能实现，甚至更加容易，无需依赖 C++或其他更复杂的语言！\n\n\n\n"
- "# 10. 使用手势与浏览器交互\n\n本章旨在将你目前学到的所有知识融会贯通，构建一个雄心勃勃的音乐创作 Web 应用，它允许多人使用计算机生成的音频，通过\
  \ JavaScript、Node.js 和一些 HTML5 API 同时演奏乐器。哦，对了，它还需要利用网络摄像头，让你能通过手指在空中进行输入。\n\n我相信你也能想象，这是一项艰巨的任务。本章将带你实现其基础版本，并允许你按照自己的意愿进行扩展。例如，与其追踪所有手指以便正确弹奏键盘，不如改为使用一个光标，你可以通过指向左侧或右侧来移动它，或者指向中间来模拟按键。\n\
  \n## 将键盘移至服务器端\n\n我们将基于第 5 章的键盘来构建这个项目。目前，键盘的设置允许你同时演奏多个音符（这是一个好的开端），但我们需要修改它，以使多人能够同时演奏多个音符。当然，即使两个人演奏同一个音符，也应该只播放一次。这非常理想，因为这意味着我们每个人只需要一组振荡器，所以当\
  \ B 开始演奏某个音符时，它将使用 A 正在使用的同一组振荡器来播放。\n\n之前我们在 `stopSound` 函数中关闭了振荡器，但这可能会导致竞态条件问题（即，操作不一定会按照你期望的顺序发生），而且由于无法播放已停止的振荡器，更好的做法是删除它（在本例中，我们会将其设为\
  \ null）并创建一个新的（反正我们之前也是这么做的）。为了更容易检查振荡器是否存在，我修改了数组初始化循环，将索引初始值设为 null，而不是一开始就创建新的振荡器。\n\
  \n```\n// 白键\nvar o = new Array(21);\nfor (var i = 0; i < 21; i++)  {\n    o[i]\
  \ = null;\n}\n\n// 黑键\nvar ob = new Array(15);\nfor (var i = 0; i < 15; i++)  {\n\
  \    ob[i] = null;\n}\n\nfunction stopSound(i, black)  {\n    var osc;\n    if (black)\
  \ {\n        osc = ob[i];\n    } else {\n        osc = o[i];\n    }\n    if ((black\
  \ && ob[i] !== null) || (!black && o[i] !== null)) {\n        osc.noteOff(0);\n\
