  \ (count > 1) {\n                centerx = centerx / count;\n                centery\
  \ = centery / count;\n            }\n            else  {\n                centerx\
  \ = Math.random() * canvas.width;\n                centery = Math.random() * canvas.height;\n\
  \            }\n            var angleToCenter = angleBetween(b.x,b.y,centerx,centery);\n\
  \            var lerpangle = angleDifference(b.heading, angleToCenter);\n      \
  \      b.heading += lerpangle * 0.01;\n            headingx = dir_x(2,b.heading);\n\
  \            headingy = dir_y(2,b.heading);\n            b.x += headingx;\n    \
  \        b.y += headingy;\n            if (b.x < 0) b.x = canvas.width;\n      \
  \      if (b.y < 0) b.y = canvas.height;\n            if (b.x > canvas.width) b.x\
  \ = 0;\n            if (b.y > canvas.height) b.y = 0;\n        }\n        requestAnimationFrame(draw);\n\
  \    }\n\n    function draw()  {\n        ctx.clearRect(0,0,canvas.width, canvas.height);\n\
  \        for (var i = 0; i < flock.length; i++)\n        {\n            var b =\
  \ flock[i];\n            ctx.fillStyle = \"blue\";\n            ctx.fillRect(b.x,b.y,\
  \ b.size, b.size);\n            ctx.beginPath();\n            ctx.moveTo(b.x + (b.size\
  \ / 2),b.y + (b.size / 2));\n            ctx.lineTo((b.x + (b.size / 2)) + dir_x(20,flock[i].heading),(b.y\
  \ + (b.size / 2)) + dir_y(20,flock[i].heading));\n            ctx.strokeStyle =\
  \ \"red\"\n            ctx.stroke();\n        }\n    }\n\n    function distanceBetween(a,\
