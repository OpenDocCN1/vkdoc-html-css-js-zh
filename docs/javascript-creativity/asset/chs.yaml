  \n```\n// 这将填充颜色设置为红色\nctx.fillStyle = \"#ff0000\";\n// fillRectangle(x, y, width,\
  \ height);\nctx.fillRect(10, 10, 50, 50);\n```\n\n如图 2-1 所示，前面的代码只是绘制了一个红色的相同矩形。\n\
  \n![A978-1-4302-5945-9_2_Fig1_HTML.jpg](img/A978-1-4302-5945-9_2_Fig1_HTML.jpg)\n\
  \n图 2-1. 一个简单的红色矩形\n\n那么现在，既然我们关心的是动画，就让这个方块动起来吧！\n\n## RequestAnimationFrame\n\n\
  如果你曾经需要在 JavaScript 中执行重复性任务（例如轮询），那么你可能对 `setInterval` 和 `setTimeout` 有所了解。这两个函数都不可靠，因为它们可能在超时后的任何时间触发，而不是正好在超时时触发，如果你需要它们立即触发（这对于流畅动画来说非常重要），这就会导致问题。此外，许多浏览器的最小计时器分辨率约为\
  \ 16ms，这可能会造成延迟，尤其是在意料之外的情况下。使用超时的另一个问题是，你需要手动设置超时时间；因此任何测试都将只针对该特定计算机。另一方面，`requestAnimationFrame`\
  \ (rAF) 可以在其运行的计算机的最佳时机触发。它不是固定时间，而是以每秒最多 60 帧的速度运行，但触发频率较低（例如，当浏览器标签页在后台时）。另一个可以使用的优化是第二个参数，它可以是一个\
  \ `DOM` 元素来约束 rAF。\n\n由于在撰写本文时，某些浏览器对 `requestAnimationFrame` 的支持不足，建议使用一个 shim，以便在实现了其某种版本的浏览器中正常工作。我不会在代码示例中包含这一点，但在所有浏览器都正确支持该标准之前，你应该将其视为必需的。\n\
  \n```\n// RequestAnimationFrame 的 Shim\n(function() {\n  var requestAnimationFrame\
  \ = window.requestAnimationFrame || window.mozRequestAnimationFrame ||\n       \
  \                       window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;\n\
  \  window.requestAnimationFrame = requestAnimationFrame;\n})();\n```\n\n我发现分离代码很重要，因此虽然我暂时不会使用任何特定的设计模式（因为代码量还很小），但我鼓励你恰当地组织代码。对于本节，我认为\
  \ `logic()` 和 `draw()` 是合适的函数名称。\n\n```\n// 这是一种选择元素的方式\nvar ele = document.querySelector(\"\
  #animation\");\nvar ctx = ele.getContext('2d');\nvar x = y = 10;\nvar width = height\
  \ = 50;\n\nfunction logic () {\n    x += 10;\n    if (x < ele.width - width) requestAnimationFrame(draw);\n\
  }\n\nfunction draw()  {\n    ctx.clearRect(0, 0, ele.width, ele.height);\n    //\
  \ 这将填充颜色设置为红色\n    ctx.fillStyle = \"#ff0000\";\n    // fillRectangle(x, y, width,\
  \ height);\n    ctx.fillRect(x, y, 50, 50);\n}\n\nrequestAnimationFrame(draw);\n\
  setInterval(logic, 1000/60);\n```\n\n你会注意到我同时使用了 `requestAnimationFrame` 和 `setInterval`，这是因为你很少希望动画以全速运行（取决于计算机），因此这允许在仍然使用\
  \ `requestAnimationFrame` 来提高渲染性能的同时设置速度。现在，我提到动画不必全速运行，但我还没有向你展示如何轻松更改该速度——为此，我们将使用线性插值。\n\
  \n## 线性插值\n\n线性插值 (lerp) 用于定义特定路径的子坐标。这可以比作进行长途旅行并在途中停下来吃饭。在动画中，它用于平滑路径，因此它不是从一个点跳到另一个点，而是看起来在它们之间滑动（当然，实际上它只是进行了更小的跳跃）。\n\
  \n```\nn = start + (end - start) * speed\n```\n\n上面的代码方程用于计算下一个插值点。这应该被迭代，这样每一帧的起始变量都是前一帧的\
  \ `n`，因为它逐渐向终点移动（现在取决于设置的速度，而不是每秒帧数）。\n\n```\nvar ele = document.querySelector(\"\
  #animation\");\nvar ctx = ele.getContext('2d');\nvar startX = 10;\nvar startY =\
  \ 10;\nvar endX = ele.width - 50;\nvar x = startX;\nvar y = startY;\nvar duration\
  \ = 0;\nvar width = height = 50;\n\nfunction lerp(start, end, speed) {\n    return\
  \ start + (end - start) * speed;\n}\n\nfunction logic () {\n    duration += 0.02;\n\
  \    x = lerp(startX, endX, duration);\n    if (x < ele.width - width)\n       \
  \ requestAnimationFrame(draw);\n}\n\nfunction draw()  {\n    ctx.clearRect(0, 0,\
  \ ele.width, ele.height);\n    // 这将填充颜色设置为红色\n    ctx.fillStyle = \"#ff0000\";\n\
  \    // fillRectangle(x, y, width, height);\n    ctx.fillRect(x, y, 50, 50);\n}\n\
  \nrequestAnimationFrame(draw);\nsetInterval(logic, 1000/60);\n```\n\n这与之前的版本差别不大，只是我们现在有一个\
  \ `lerp()` 函数，几乎与之前的方程相同。我还定义了 `duration`、`startX` 和 `startY` 变量以便传入函数。最大的变化是 `logic()`。我没有调整\
  \ `x`（这会导致跳跃），而是将 `duration` 增加了一小点，然后我将其简单传入 `lerp()` 函数，以获得 `x` 的新值（该值位于通往最终 x\
  \ 目的地的路径上的某处）。\n\n\n\n### 跟随鼠标\n\n很多时候，你需要的是交互式动画，而不仅仅是视频。在 Canvas 中添加交互性的一种常见方式是使用鼠标。首先，我将向你展示如何让你的红色小方块跟随鼠标移动。\n\
  \n鼠标由操作系统处理，因此会触发一个所有程序都能访问的事件，这当然意味着“鼠标”这个术语实际上指的是任何能够触发该事件的设备。对于这种情况，我们需要监听 `'mousemove'`\
  \ 事件。为此，我们使用 `addEventListener` 将监听器添加到特定元素。\n\n`element.addEventListener(type,\
  \ listener, useCapture boolean optional);`\n\n`Type` 是事件的名称（请参阅下面跟随的鼠标特定事件列表）。`Listener`\
  \ 可以通过两种方式实现：作为实现 `EventListener` 接口的对象，或者作为简单的回调函数。`useCapture` 是一个布尔值，如果事件应在捕获阶段触发，则为\
  \ `true`；否则，它将在目标和冒泡阶段触发。在现代浏览器上，`useCapture` 默认为 `false`，但一些较旧的浏览器可能需要它。\n\n- \
  \  `click`\n-   `dblclick`\n-   `mousedown`\n-   `mouseenter`\n-   `mouseleave`\n\
  -   `mousemove`\n-   `mouseover`\n-   `mouseout`\n-   `mouseup`\n\n要使方块跟随鼠标移动，你需要一个回调函数，根据鼠标位置设置新的起点和终点，如下所示：\n\
  \n```javascript\nele.addEventListener('mousemove', function(evt) {\n    startX =\
  \ x;\n    endX = evt.clientX;\n});\n```\n\n这为方块设置了新的路径，所以现在我们只需要稍作修改使其平滑。我决定添加一些约束，以确保如果鼠标将\
  \ x 设置为方块已经前往的位置时，方块不会试图移出 Canvas 或出现闪烁。如果不符合此约束，则持续时间被设置为 0。\n\n```javascript\n\
  function logic (evt) {\n    var max = ele.width - width;\n    duration += 0.02;\n\
  \    var l = lerp(startX, endX, duration);\n    if (l < max && l > 0 && endX !=\
  \ x)\n    {\n        x = l;\n        requestAnimationFrame(draw);\n    }\n    else\
  \ {\n        duration = 0;\n    }\n}\n```\n\n这应该可以向你展示，仅仅一些微小的改变就能完全改变整个动画以及用户与之交互的方式。请参阅清单\
  \ 2-1，了解所有部分如何整合在一起。\n\n**清单 2-1.**\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n\
  \        <title>Chapter 2 - Basics of Canvas</title>\n    </head>\n    <body>\n\
  \        <canvas id=\"animation\">\n            <p>Fallback not supported.</p>\n\
  \        </canvas>\n        <script src=\"script.js\"></script>\n    </body>\n</html>\n\
  ```\n\n```javascript\n// Polyfill for RequestAnimationFrame\n(function() {\n  var\
  \ requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame\
  \ ||\n                              window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;\n\
  \  window.requestAnimationFrame = requestAnimationFrame;\n})();\n\nvar ele = document.querySelector(\"\
  #animation\");\nvar ctx = ele.getContext('2d');\nvar width = height = 50;\nvar startX\
  \ = 10;\nvar startY = 10;\nvar endX;\nvar x = startX;\nvar y = startY;\nvar duration\
  \ = 0;\n\nfunction logic (evt) {\n    var max = ele.width - width;\n    duration\
  \ += 0.02;\n    var l = lerp(startX, endX, duration);\n    if (l < max && l > 0\
  \ && endX != x)\n    {\n        x = l;\n        requestAnimationFrame(draw);\n \
  \   }\n    else {\n        duration = 0;\n    }\n}\n\nfunction draw()  {\n    ctx.clearRect(0,\
  \ 0, ele.width, ele.height);\n    // This sets the fill colour to red\n    ctx.fillStyle\
  \ = \"#ff0000\";\n    // fillRectangle(x, y, width, height);\n    ctx.fillRect(x,\
  \ y, 50, 50);\n}\n\nfunction lerp(start, end, speed) {\n    return start + (end\
  \ - start) * speed;\n}\n\nele.addEventListener('mousemove', function(evt) {\n  \
  \  startX = x;\n    endX = evt.clientX;\n});\n\nrequestAnimationFrame(draw);\nsetInterval(logic,\
  \ 1000/60);\n```\n\n### 弹跳方块\n\n既然我们已经了解了如何进行静态动画（从左向右移动）以及如何使用输入进行动画，我想再做一个使用方块的示例，为其添加一个动态元素。动画的工作方式有很多种选择。最常见的是让物体在\
  \ Canvas 的边界上弹跳。这个示例的难度相比上一个并没有提升太多，但它将很好地衔接下一个示例（这将是一个简单的群体模拟实现）。\n\n为了弹跳方块，我们不是在当前和期望位置之间进行“lerp”（线性插值），而是需要让它沿特定方向移动，直到碰到边缘。这意味着我们需要使用基础三角学，根据一个角度（起始为\
  \ 360 度内的随机角度）来找到位置。正如你从 lerp 中了解到的，最好采用许多小步骤而不是一个大步骤来移动，所以我们可以让三角函数计算一个距离。为了找到\
  \ x 方向，我们计算角度（弧度制）的余弦值乘以距离，对于 y 方向，我们做同样的操作，但是使用角度的正弦值。\n\n```javascript\nfunction\
  \ degreesToRadians(degrees) {\n    return degrees * (Math.PI / 180);\n}\n\nfunction\
  \ dir_x(length, angle) {\n    return length * Math.cos(degreesToRadians(angle));\n\
  }\n\nfunction dir_y(length, angle) {\n    return length * Math.sin(degreesToRadians(angle));\n\
  }\n```\n\n一旦我们实现了这些函数，剩下的就与之前的示例类似了。我们需要为 x 和 y 轴初始化距离和方向变量。距离应从 0 开始，方向需要是 0 到\
  \ 360 度之间的随机角度。在逻辑函数中，最好从一个简单的检查开始，确保两个 `heading` 变量都在 -360 到 360 之间。然后我们需要检查物体是否在边界内，如果不在，则将其反弹回来。之后，我们只需在当前坐标和通过上述角度与方向函数计算出的坐标之间进行\
  \ lerp 插值。\n\n```javascript\nvar ele = document.querySelector(\"#animation\");\n\
  ele.height = window.innerHeight;\nele.width = window.innerWidth;\nvar ctx = ele.getContext('2d');\n\
  var x = 10;\nvar y = 10;\nvar duration = 0;\nvar width = height = 50;\nvar heading_x\
  \ = heading_y = Math.random() * 360;\nvar distance_x = distance_y = 0;\n\nfunction\
  \ logic () {\n    if (heading_x > 360 || heading_x < -360) heading_x = 0;\n    if\
  \ (heading_y > 360 || heading_y < -360) heading_y = 0;\n\n    if (x <= 0 || x >=ele.width\
  \ - width) {\n        heading_x = heading_x + 180;\n    }\n    if (y <= 0 || y >=ele.height\
  \ - height) {\n        heading_y = -heading_y;\n    }\n\n    distance_x = dir_x(2,\
  \ heading_x);\n    distance_y = dir_y(2, heading_y);\n\n    if (duration < 10) duration\
  \ += 0.05;\n    x = lerp(x, x + distance_x, duration);\n    y = lerp(y, y + distance_y,\
  \ duration);\n\n    requestAnimationFrame(draw);\n}\n```\n\n就是这样。你可以在 Apress 网站\
  \ [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442) 或我的个人网站\
  \ [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)\
  \ 上提供的本书配套下载资源中找到所有示例的完整代码清单。\n\n\n\n## “聪明”的动画\n\n接下来我们将创建一个“聪明”的动画——也就是说，在弹跳盒子示例中动态动画概念的基础上进行扩展，让物体能够感知周围环境。1986\
  \ 年，克雷格·雷诺兹创建了一个令人惊叹的鸟群模拟程序，他称之为“Boids”。它仅基于三条规则构建，使得每只虚拟鸟能够自主运动，同时也能看到附近的同伴并向它们移动。我找到的关于每条规则的最佳解释如下：\n\
  \n*   **分离**：转向以避免与附近的鸟群成员拥挤\n*   **对齐**：转向朝向附近鸟群成员的平均方向\n*   **凝聚**：转向朝附近鸟群成员的平均位置（质心）移动\n\
  \n我们的动画基于 Boids，不过为了简洁起见，某些部分会进行简化（我鼓励你修改我的代码来改进它——为此你可能需要使用向量）。我们将从通常的设置代码开始，比如\
  \ `getContext` 等，同时为 Boid 创建一个对象，用于存储其位置、方向和大小数据。完成后，我们创建一个名为 `setup()` 的函数，它会将每只虚拟鸟（无论我们设置了多少只）以随机位置和随机方向添加到画布上。我编写了一个简单的函数来包装\
  \ JavaScript 的 `Math.random`，只是为了让代码更整洁一些。\n\n```\n(function()  {\nvar canvas =\
  \ document.querySelector(\"#flocking\");\nvar ctx = canvas.getContext('2d');\ncanvas.height\
  \ = window.innerHeight;\ncanvas.width = window.innerWidth;\nvar flock = [];\nvar\
  \ flockRadius = 250;\nvar neighborRadius = 10;\nvar Boid = function(x, y, heading,\
  \ size) {\nthis.x = x;\nthis.y = y;\nthis.heading = heading\nthis.size = size;\n\
  };\nfunction setup()  {\nfor (var i = 0; i < 50; i++)\n{\nflock.push(new Boid(rand(canvas.width),\
  \ rand(canvas.height), rand(360), 15));\n}\nsetInterval(logic, 1000/60);\n}\nfunction\
  \ logic () {\nfor (var i = 0; i < flock.length; i++)  {\n// 对每只虚拟鸟执行某些操作\n}\nrequestAnimationFrame(draw);\n\
  }\nfunction draw()  {\n// 绘制部分在此进行\n}\nfunction rand(max)  {\nreturn Math.random()\
  \ * max;\n}\nsetup();\n})();\n```\n\n你可能注意到，我们没有使用“向上”或“向右”来表示方向，而是使用了 0 到 360 度。这使动画更加流畅，也便于我们之后使用弧度计算。我们使用变量\
  \ `flockRadius` 来控制虚拟鸟互相可视的距离（也用于统一方向等）。现在让我们为绘制方法添加一些代码。为此，我们首先需要清除每一帧的画布（如果不这样做，就会直接在上一帧上绘制）。画布清除后，就该绘制虚拟鸟了！因此我们需要遍历鸟群数组，将当前虚拟鸟存储在名为\
  \ `b` 的变量中，并将每一只绘制到画布（即画布上下文）的正确位置上。要找到位置，我们取 `b.x` 和 `b.y`，但需要加上其大小的一半，因为位置是虚拟鸟的中心，而不是其左上角。\n\
  \n```\nfunction draw()  {\nctx.clearRect(0,0,canvas.width, canvas.height);\nfor\
  \ (var i = 0; i < flock.length; i++)\n{\nvar b = flock[i];\nctx.fillStyle = \"blue\"\
  ;\nctx.fillRect(b.x,b.y, b.size, b.size);\nctx.beginPath();\nctx.moveTo(b.x + (b.size\
  \ / 2),b.y + (b.size / 2));\nctx.lineTo((b.x + (b.size / 2)) + dir_x(20,flock[i].heading),(b.y\
  \ + (b.size / 2)) + dir_y(20,flock[i].heading));\nctx.strokeStyle = \"red\"\nctx.stroke();\n\
  }\n}\n```\n\n在 `lineTo` 中，我使用了两个函数，用于在给定距离和方向时获取位置。这里我用这些函数画了一条线，指向每只虚拟鸟朝向的方向，长度为\
  \ 20 像素。下面是辅助函数的代码。它们使用了基本的三角学和勾股定理，因此应该很容易理解。\n\n```\nfunction distanceBetween(a,\
  \ b)  {\nvar dx = a.x - b.x;\nvar dy = a.y - b.y;\nreturn Math.sqrt(dx * dx + dy\
  \ * dy);\n}\n\nfunction angleBetween(x1, y1, x2, y2)\n{\n```\n\n\n\n```javascript\n\
  function angleBetween(x1, y1, x2, y2)\n{\n    return Math.atan2(y1 - y2, x1 - x2)\
  \ * (180.0 / Math.PI);\n}\n\nfunction angleDifference(a1, a2)\n{\n    return ((((a1\
  \ - a2) % 360) + 540) % 360) - 180;\n}\n\nfunction degreesToRadians(degrees){\n\
  \    return degrees * (Math.PI / 180);\n}\n\nfunction dir_x(length, angle){\n  \
  \  return length * Math.cos(degreesToRadians(angle));\n}\n\nfunction dir_y(length,\
  \ angle){\n    return length * Math.sin(degreesToRadians(angle));\n}\n```\n\n别被这些数学计算吓到——它们恰好能让我们更轻松地编写逻辑函数，我们现在就开始吧！首先，需要在\
  \ for 循环中设置一些变量，用以记录仿生鸟要飞往的位置。这些变量叫做`centerx`和`centery`，但它们并不是画布的中心（我将它视为“关注中心”）。我还提供了一个变量\
  \ `b`，以便更轻松地访问 `flock[i]`。变量设置完毕后，我们就可以再次遍历仿生鸟群来寻找邻居了，也就是距离小于`flockRadius`的任何仿生鸟。有了这些，我们就能找出平均位置（将每只仿生鸟的`x`和`y`坐标加到`centerx`和`centery`上，然后除以该半径内的仿生鸟数量）。当然，如果鸟群里只有一只仿生鸟，那我们不妨给它一个随机的位置作为目标点。\n\
  \n```javascript\nfor (var i = 0; i < flock.length; i++)  {\n    var centerx = 0;\n\
  \    var centery = 0;\n    var count = 0;\n    var b = flock[i];\n    for (var j\
  \ = 0; j < flock.length; j++)\n    {\n        var distance = distanceBetween(b,\
  \ flock[j]);\n        if (distance < flockRadius)\n        {\n            centerx\
  \ += flock[j].x;\n            centery += flock[j].y;\n            count++;\n   \
  \     }\n    }\n    if (count > 1) {\n        centerx = centerx / count;\n     \
  \   centery = centery / count;\n    }\n    else  {\n        centerx = Math.random()\
  \ * canvas.width;\n        centery = Math.random() * canvas.height;\n    }\n   \
  \ // 设置航向和 x/y 位置\n}\n```\n\n现在我们已经得到了关注中心/重力中心（我想“重力”这个词更贴切），就可以计算出仿生鸟为了朝正确方向飞行所需转动的角度了。我们通过使用\
  \ `angleBetween` 和 `angleDifference` 这两个辅助函数来得到所需角度，然后进行线性插值，让它在每次迭代中都更接近目标点。当然，由于我们代码的设计方式，它的目标点可能会根据与邻居的接近程度而变化（请记住，我们是在嵌套循环中改变中心点的）。最后，为了防止仿生鸟飞出画面，我们需要定义一个“环绕”机制，这样当仿生鸟离开画布时，它会出现在对面一侧（就像《小行星》或《贪吃蛇》游戏那样）。\n\
  \n```javascript\nif (count > 1) {\n    centerx = centerx / count;\n    centery =\
  \ centery / count;\n}\nelse  {\n    centerx = Math.random() * canvas.width;\n  \
  \  centery = Math.random() * canvas.height;\n}\nvar angleToCenter = angleBetween(b.x,b.y,centerx,centery);\n\
  var lerpangle = angleDifference(b.heading, angleToCenter);\nb.heading += lerpangle\
  \ * 0.01;\nheadingx = dir_x(2,b.heading);\nheadingy = dir_y(2,b.heading);\nb.x +=\
  \ headingx;\nb.y += headingy;\nif (b.x < 0) b.x = canvas.width;\nif (b.y < 0) b.y\
  \ = canvas.height;\nif (b.x > canvas.width) b.x = 0;\nif (b.y > canvas.height) b.y\
  \ = 0;\n```\n\n如果你将上述代码放在上一段代码中注释所在的位置，你会发现现在画布上有了蓝色仿生鸟，它们带有表示方向的红色线条，在画布上四处飞行并聚集在一起。图\
  \ 2-2 展示了应有的效果。这个动画可以通过多种方式改进，例如增加分离行为，让它们彼此并列飞行而不是互相穿过。\n\n![A978-1-4302-5945-9_2_Fig2_HTML.jpg](img/A978-1-4302-5945-9_2_Fig2_HTML.jpg)\n\
