  ### 画布分析


  时间线是一个非常强大的工具，但在调试画布动画时，它常常感觉像是猜测（因为大多数动画都是通过脚本动态生成的，我们并不真正知道每个函数实际上在做什么）。幸运的是，Chrome
  开发者工具中有一个全新的工具，可以让你捕获画布帧（在撰写本文时，它仍仅在 Chrome Canary 版本中可用）。它在“分析”选项卡下（你可能需要在开发者工具设置中启用实验性功能）。


  捕获的帧分析与断点非常相似，不同之处在于它不会暂停代码，而是记录一帧，并允许你逐步执行每个发出的调用。这非常强大，因为它能让你看到确切的执行顺序，并显示该特定步骤下画布的状态，如图
