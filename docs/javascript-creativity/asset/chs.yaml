- "# 7. 使用 Node.js 实现实时协作\n\n到目前为止，在本书中，我们编写的所有代码都是客户端的。虽然如今的客户端 JavaScript 非常强大，但通常还需要一个服务器，以便数据可以存储在线、将敏感逻辑保留在客户端之外，或者让用户能够在线互动。你可能熟悉其他服务器端语言，如\
  \ PHP 或 Ruby（甚至可能是 Perl！），但 Node.js 的优势之一是你使用 JavaScript 编写服务器端代码，因此由于你拥有客户端 JS\
  \ 的经验，应该很容易上手。\n\n## 制作聊天室\n\n在本章中，我们使用 Node.js 和 Socket.IO 来创建一个实时的聊天室 Web 应用，允许多个用户互相交谈。我指导你在本地机器上设置\
  \ Node.js，因为最常用的服务器（共享主机）通常不支持 Node.js。但请注意，像 Heroku 和 Amazon Web Services 这样的服务提供免费套餐。\n\
  \n### 安装 Node.js\n\n显然，要使用 Node.js 编写任何代码，你需要先安装它。安装方法有很多。你可以使用包管理器，如 `apt-get`、`yum`\
  \ 或 `Homebrew`（取决于你使用的操作系统），但这些包管理器并不总是最新的。在 Node.js 网站 [`www.nodejs.org`](http://www.nodejs.org/)\
  \ 上，你可以下载最新版本的可执行二进制文件或从源代码构建。或者，你也可以使用来自 [`www.github.com/creationix/nvm`](http://www.github.com/creationix/nvm)\
  \ 的 Node 版本管理器（`nvm`）。如果你正在处理许多并非都使用最新版本的代码库，这尤其有用。Node 自带一个名为 `npm` 的内置包管理器，它使用名为\
  \ `package.json` 的文件来处理依赖关系。因此，你无需自己安装 `Express` 和 `Socket.IO`，只需将它们写入该文件即可。当你准备安装这些包时，在包含\
  \ `package.json` 的文件夹中运行 `npm install`。\n\n```\n{\n    \"name\": \"javascript-creativity-chatroom\"\
  ,\n    \"description\": \"A chatroom made in chapter 7 of the JavaScript Creativity\
  \ book.\",\n    \"version\": \"0.0.1\",\n    \"private\": true,\n    \"dependencies\"\
  : {\n        \"express\": \"3.x\",\n        \"socket.io\": \"0.9.x\"\n    }\n}\n\
  ```\n\n与传统的 JavaScript 不同，Node.js 有一个模块系统，允许你在运行时加载 JavaScript 文件。每个模块都在一个文件中定义，通过\
  \ `module.exports` 对象导出变量和函数。在另一个文件中，你可以使用 `require` 函数来加载该模块并获取其 `module.exports`\
  \ 的内容。加载模块有三种不同的方式。\n\n*   `require()` 一个相对文件，例如 `require('./lib/utils.js')`。这会加载单个文件并返回该文件中\
  \ `module.exports` 的值。如果你的项目很大且包含多个文件，你会经常使用这种方法。\n*   `require()` 一个核心模块，这些模块是一些特殊的关键词。例如，使用\
  \ `require('http')` 来加载核心的 `http` 模块。Node.js 预装了一系列标准核心模块，但它们默认不包含在内，这意味着当你需要它们时必须显式地引入。你可以在\
  \ Node.js 文档（[`www.nodejs.org/api/index.html`](http://nodejs.org/api/index.html)）中查看核心模块的完整列表。\n\
  *   `require()` 一个来自 `node_modules` 文件夹的独立模块，例如 `require('express')`。这是模块系统最强大的功能。你可以通过引用模块名称来加载整个独立的模块。其工作原理是，Node.js\
  \ 对 `node_modules` 文件夹有特殊认知。它会从当前脚本所在的目录向上遍历目录树，查找 `node_modules/<name>/package.json`\
  \ 或 `node_modules/<name>/index.js`。它会首先查看 `package.json`，检查它是否有一个 `\"main\"` 属性，该属性引用了一个名称与\
  \ `index.js` 不同的 `.js` 文件来加载。假设你有一个文件 `/www/myapp/index.js`，其中包含 `require('express')`。Node.js\
  \ 会在以下目录中查找该模块：\n    *   `/www/myapp/node_modules/express/`（`package.json` 或 `index.js`）\n\
  \    *   `/www/node_modules/express/`（`package.json` 或 `index.js`）\n    *   `/node_modules/express/`（`package.json`\
  \ 或 `index.js`）\n    *   `$NODE_PATH/express/`（`package.json` 或 `index.js`）\n  \
  \  *   `$HOME/.node_modules/express/`（`package.json` 或 `index.js`）\n    *   `$HOME/.node_libraries/express/`（`package.json`\
  \ 或 `index.js`）\n    *   `$PREFIX/lib/node/express/`（`package.json` 或 `index.js`）\n\
  \    *   这是 Node.js 查找的文件夹的详尽列表。强烈建议你将模块放在本地的 `node_modules` 文件夹中，以确保速度和可靠性。其他文件夹主要用于\
  \ `node_modules` 文件夹内的 Node.js 模块需要它们自己的模块时，这样你就可以在项目和你自己的模块之间共享模块。\n\n\n\n这就是 `npm`\
  \ 发挥作用，让事情变得更好的地方。由于 Node.js 中 `node_modules` 文件夹的特性，`npm` 会查看你的 `package.json`\
  \ 中的 `dependencies` 和 `devDependencies` 对象，并将每个依赖项下载到你的 `node_modules` 文件夹中。它还会下载你所有模块的依赖项，以及这些模块的模块的依赖项，依此类推。`dependencies`\
  \ 和 `devDependencies` 的区别在于，`npm` 不会安装其他模块的 `devDependencies`，只会安装 `dependencies`。默认情况下，`npm`\
  \ 会将所有内容安装到本地的 `node_modules` 文件夹中。但这并不总是你想要的，所以如果你使用 `npm install -g <module>`\
  \ 安装模块，那么它会将它们全局安装（通常在 `$HOME/.node_modules/` 中）。这非常有用，因为你可以用它来安装用 Node.js 编写的命令行程序。例如，我在开发项目时使用\
  \ Remy Sharp 的 `nodemon` 作为运行 node 服务器的替代方式，因为默认的运行服务器的方式 `node [filename]` 不会监视服务器运行时已更新的文件。要安装\
  \ `nodemon`，你可以运行 `npm –g install nodemon`，然后运行 `nodemon [filename]` 通过 `nodemon`\
  \ 运行服务器。更多关于 `nodemon` 的信息可以在 [`www.remy.github.io/nodemon/`](http://remy.github.io/nodemon/)\
  \ 找到。\n\n当然，Node.js 最简单的例子就是 Hello World。要提供网页服务，我们需要引入一个名为 `http` 的模块，它可以让我们处理\
  \ `HTTP` 的底层细节。这个模块是一个核心模块，所以我们使用列表中的第一个定义。一旦引入了 `HTTP`，我们将其存储在一个名为 `http` 的变量中。然后我们使用\
  \ `http` 上的一个名为 `createServer` 的方法；这个方法有一个回调函数，允许你发送响应（也就是网页）。要创建被提供的网页，我们首先使用 `response.writeHead`\
  \ 编写头部信息。需要提供的第一个参数是 `HTTP` 状态码 `200`（表示成功）。第二个参数是实际的头部信息，在这个例子中我们只写入 \"Hello World\"\
  ，所以 `Content-Type` 可以是 `text/plain`，如果你想向页面写入一些 HTML，你可以选择使用 `text/html`。要写入实际内容，只需使用\
  \ `response.write`。一旦你写完了响应，使用 `response.end()` 结束它。现在你已经有了一个服务器，但要让页面真正被提供，你需要告诉它在一个端口上监听活动（在这个例子中，端口是\
  \ 8080）。\n\n```\nvar http = require(\"http\");\n\nhttp.createServer(function(request,\
  \ response) {\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n\
  \  response.write(\"Hello World\");\n  response.end();\n}).listen(8080);\n```\n\n\
  现在你已经知道如何引入一个模块并用它来做一些事情了，让我们来创建我们自己简单的模块，这个模块会用到我提到的 `module.exports`。这个模块将把我们的\
  \ Hello World 代码封装到一个名为 `helloworld.js` 的文件中，然后我们在 `server.js` 中将其作为名为 `hello` 的变量引入，并调用\
  \ `server` 方法。\n\n`helloworld.js`\n\n```\nvar http = require(\"http\");\n\nfunction\
  \ hello() {\n  http.createServer(function(request, response) {\n    response.writeHead(200,\
  \ {\"Content-Type\": \"text/html\"});\n    response.write(\"Hello World\");\n  \
  \  response.end();\n  }).listen(8080);\n}\n\nmodule.exports.server = hello;\n```\n\
  \n`server.js`\n\n```\nvar hello = require('./helloworld.js');\nhello.server();\n\
  ```\n\n当然，这是一个极其简单的例子，但它很好地展示了如何引入一个自定义模块，并根据它导出的名称（而不是函数本身的名称）来调用一个方法。在这里指出方法和函数之间的区别可能会有所帮助，因为很多人会交替使用这两个词（这是可以的，但我更喜欢更精确一些）。方法是用于对象的，而函数则独立于任何对象。\n\
  \n## Socket.IO 和 Express\n\n我之前提到过 Socket.IO，它是我们通过 `package.json` 安装的包之一，但我没有解释它的作用。基本上，它是\
  \ web sockets 的一个封装，使得所有浏览器都能支持实时通信。\n\n> Socket.IO 旨在让每个浏览器和移动设备都能实现实时应用，模糊了不同传输机制之间的差异。它是无忧无虑的、100%\
  \ 基于 JavaScript 的实时通信。 —— Socket.IO 主页\n\nSocket.IO 也非常易于使用。一旦安装完成，它需要在服务器端文件中被引入（类似于在\
  \ PHP 中引入文件，但 node 会自动找到它被安装的位置），然后将其设置为监听服务器。\n\n当然，我们还没有创建服务器。像 PHP 这样的语言每次执行一个文件，并将文件的内容转换为输出；Node.js\
  \ 则不同，它是一个长期运行的过程，会多次为多个文件提供服务。Node.js 内置了一个 HTTP 模块（如果你愿意，也可以使用 apache 或 nginx），它让你有能力自己创建一个简单的服务器——但在大多数情况下，你并不想处理底层服务器代码。\n\
  \nExpress.js 让你可以专注于开发网站时实际编写代码的部分，而不用担心每个文件如何访问其余的文件结构等问题。然而，它的观点并不强烈；使用 Express.js，你可以使用任何你喜欢的范式（或工作方式）。你可以使用\
  \ Express 提供的工具编写简单的网站、博客、高级 web 应用或 REST API。如果你确实喜欢强观点的做法，Express 有一个名为 `express-generator`\
  \ 的官方结构工具，可以使用 `npm` 全局安装，以帮助你开始一个新项目，尽管它不会强迫你一直使用相同的结构。\n\n作为使用 Express 管理底层代码的简要示例，请看下面的两个代码片段。如果你在\
  \ `localhost:8080/hello`，它们都会向页面写入 'Hello World!'，如果你在其他任何页面上，它们都会写入 'Goodbye cruel\
  \ world!'。区别在于，第一个片段直接使用了 `http`，而第二个片段使用了 Express。当然，这仅仅触及了 Express 能力的皮毛，但它应该很好地展示了\
  \ Express 如何不需要像 HTTP 头部这样的底层代码。\n\n**不使用 Express**\n\n```\nvar http = require('http');\n\
  \nhttp.createServer(function(request, response) {\n  var url = request.url;\n  response.writeHead(200,\
  \ {\"Content-Type\": \"text/html\"});\n\n  if (url == '/hello')  {\n    response.write(\"\
  Hello World!\");\n  }\n  else  {\n    response.write(\"Goodbye cruel world!\");\n\
  \  }\n  response.end();\n}).listen(8080);\n```\n\n**使用 Express**\n\n```\nvar express\
  \ = require('express');\nvar app = express();\n\napp.get('/hello', function(request,\
  \ response) {\n  response.send(\"Hello World!\");\n});\n\napp.get('/*', function(request,\
  \ response) {\n  response.send(\"Goodbye cruel world!\");\n});\n\napp.listen(8080);\n\
  ```\n\n现在，让我们使用 Express 来开始为我们的聊天室编写服务器。在本章的开头，有一个用于安装 Express 和 Socket.IO 的 `package.json`，如果你还没有安装这些包，那么你现在需要安装它们。单独使用\
  \ Express 与使用 Socket.IO 略有不同，因为需要将一个 `http.createServer` 实例传递给 Socket.IO 的监听器。这在\
  \ Express 的第 3 版中发生了变化，在此之前，`express()` 函数返回的是 `http.Server` 的一个实例。\n\n```\nvar\
  \ app = require('express')(),\n    server = require('http').createServer(app),\n\
  \    io = require('socket.io').listen(server);\n\nserver.listen(8080);\n```\n\n\n\
  \n## 构建基础聊天室\n\n目前没什么可看的，因为我们这次连“Hello World”都没写在页面上，所以先用纯 HTML 搭建一个基础页面。对于最简单的聊天室，我们只需要两个文本框来输入你的昵称和消息（根据\
  \ UI 设计不同，昵称的输入方式可以有所不同），以及一个发送消息的按钮和一个用于显示消息的 `div`（也可以使用列表来改善语义）。这个文件通常可以（但不是必须）保存为\
  \ `index.html`，放在与服务器代码相同的文件夹中。\n\n```html\n<!doctype html>\n<html>\n<head>\n<title>聊天室</title>\n\
  </head>\n<body>\n<label for=\"nickname\">昵称:</label><input type=\"text\" id=\"nickname\"\
  ></input>\n<div id=\"messages\"></div>\n<textarea id=\"message\"></textarea>\n<a\
  \ id=\"send\">发送</a>\n</body>\n</html>\n```\n\n现在你需要使用路由器（就像我们在 Hello World 示例中那样）来告诉浏览器在哪里找到内容。对于这个聊天室，我们希望多个房间可访问，一个很好的方法是将聊天室的名称（或一个随机标识符）放在房间的\
  \ URL 中。`Express` 提供了一种简单的方法来检查这个名称，作为路径名片段（也称为命名参数），但由于这个聊天室不需要多个视图，我们可以直接将每个页面重定向到\
  \ `index.html`。我们可以使用通配符来代替路径名片段，但介绍路径名作为参数使用的概念是个好方法。这也是强制包含聊天室 ID 的一种方式，因为如果没有\
  \ ID，它将不会提供页面；这意味着如果你想要添加一个主页，就需要一个单独的路由。\n\n```javascript\napp.get('/:id?', function\
  \ (req, res) {\n  res.sendfile(__dirname + '/index.html');\n});\n```\n\n当然，这只是一个相当无用的聊天室。让我们编写处理消息的服务器端代码。使用\
  \ `Socket.IO`，我们需要通过 `io.sockets.on('connection', function (socket) {});` 作为连接事件处理器来检查连接，然后加入路径名片段中命名的房间。与\
  \ `Express` 不同，为了获取标识符，我们使用 `var room = socket.handshake.headers.referer`，因为一旦路由完成，`Express`\
  \ 的 `.get` 调用就不可用了。获取标识符的其他方法包括：从客户端发送路径名片段，或者最初使用 `res.local`（作用域限于请求/响应周期的变量）提供它，并在客户端将其暴露为全局变量。使用\
  \ `socket.handshake` 虽然路径较长，但在这种情况下是避免从客户端发送的好方法。\n\n将标识符存储在名为 `room` 的变量中后，我们现在可以使用\
  \ `socket.join(room)` 来加入一个与 ID 同名的 `Socket.IO` 房间。这些房间本质上是一种将正确的消息发送给正确的人的方式，只有房间的成员才能收到该特定房间的消息。\n\
  \n为了检查消息或用户离开房间的情况，我们在 `socket` 上使用事件处理器。`Socket.IO` 上的每一次通信都被归类为一条消息，不要与聊天室中写入的消息混淆。发送消息被称为发射（emitting）。要让聊天室中的消息相互发送，我们首先在客户端（我稍后会讲到）向服务器发射消息，然后服务器将消息发送给连接到该房间的其他客户端。要从服务器向房间发射消息，我们使用\
  \ `io.sockets.in(room).emit(key, value)`。对于聊天室消息，我们使用字符串 `'message'` 作为键，数据则通过事件监听器上的\
  \ `data` 参数作为值传递。对于离开房间，键是 `'leave'`。\n\n```javascript\nio.sockets.on('connection',\
  \ function (socket) {\n  var room = socket.handshake.headers.referer;\n  socket.join(room);\n\
  \  socket.on('message', function (data) {\n    io.sockets.in(room).emit('message',\
  \ data);\n  });\n  socket.on('leave', function (room) {\n    socket.leave(room);\n\
  \  });\n});\n```\n\n就基础聊天室的服务器端而言，这就是全部了，你可以看到代码在清单 7-1 中是多么简洁。我们现在需要做的就是在客户端为事件处理器设置代码，以便在发送消息时发射消息。这样，借助\
  \ `Socket.IO` 房间和我们刚刚编写的代码，它会自动将消息发送给同一房间中的任何人——而且是实时的！不需要担心 AJAX 或长轮询，`Socket.IO`\
  \ 会使用最适合的方法（大多数现代浏览器使用 Web Socket，其他浏览器则会回退到合适的方法）。不使用 AJAX 是我选择在本章中不使用 jQuery 或任何类似库的最大因素之一，不过在大型项目中你可能需要使用它们。\n\
  \n**清单 7-1**\n\n```html\n<script>\n  var socket = io.connect('http://localhost');\n\
  \n  socket.on('message', function(evt) {\n    document.querySelector(\"#messages\"\
  ).innerHTML += '<p><span class=\"nickname\">'+evt.nickname+': </span><span class=\"\
  message\">' + evt.message +'</span></p>';\n  });\n\n  sendButton = document.querySelector(\"\
  #send\");\n  var messages = document.querySelector(\"#message\");\n\n  sendButton.addEventListener('click',\
  \ function() {\n    socket.emit('message', {\n      \"message\": messages.value,\n\
  \      \"nickname\": document.querySelector(\"#nickname\").value || '访客'\n    });\n\
  \    messages.value = \"\";\n  });\n</script>\n```\n\n> **注意**  \n> 要在客户端使用 `Socket.IO`，你必须包含\
  \ `<script src=\"/socket.io/socket.io.js\"></script>`，不过你不需要担心文件的位置，因为 Node.js 会自动处理。\n\
  \n## 总结\n\n许多 Node.js 初学者在接触到一种与自己习惯的技术截然不同的技术时，总是感到有些畏惧。我希望本章能够让你轻松地进入 Node.js\
  \ 的世界，让你觉得制作一个实时的多用户应用简直简单得可笑。聊天室可以非常多样化，所以这个练习应该为你学习更多语言知识提供了一个很好的起点。你可以通过使用你感兴趣的语言特性来增强聊天室，从而更进一步。在下一章中，我们将为聊天室添加视频和音频流功能，作为一种会议风格的功能，这将把你的\
  \ Node.js 专业技能提升到新的水平。\n\n---\n\n"
- "# 8. 使用 WebRTC 进行视频到视频通信\n\n我们的聊天室的自然演进是视频对视频通信，就像 Skype 和 Google Hangouts 使用的那种，但直到最近，这比听起来要困难得多。为什么呢？是的，你猜对了……需要插件（也就是\
  \ Flash）。直到 2012 年，也就是 Web 诞生近 20 年后，来自网络摄像头的原生视频流才开始进入浏览器。现在 WebRTC 开始得到良好支持，学习如何使用它是值得的。我不会假装它很简单——它确实不简单——但是，一旦你理解了它的工作原理，一切就都说得通了。\n\
  \n## WebRTC 简介\n\n好了，我们知道 WebRTC 用于实现浏览器之间的通信，但它到底是什么？WebRTC 实际上是一组规范，这些规范通常一起使用来创建实时通信链路。这组规范也包括用于数据的规范，所以它不仅限于视频和音频（尽管在撰写本文时，数据规范的支持还不够好，但正在积极开发中）。WebRTC\
  \ 的形成方式与 TCP 服务器非常相似，它需要使用正确的协议进行握手，而不是像你习惯使用的普通 API 那样。还应注意，WebRTC 是点对点的，而不是客户端/服务器模式，这就是为什么它需要客户端额外的网络支持。由于大多数\
  \ Web 开发者可能从未需要编写 TCP 服务器，我认为我们应该从头开始。\n\n\n\n### `GetUserMedia()`\n\n在 WebRTC 出现之前，创建原生视频通信最困难的问题之一，其实并非通信本身难以实现（尽管缺乏点对点能力确实让这件事变得非常困难）。不，最棘手的难题是访问摄像头！\n\
  \n幸运的是，我们现在有了 `navigator.getUserMedia()`，这个函数能让我们从输入设备获取视频和音频，并通过回调函数对这些内容进行处理。\n\
  \n```\nnavigator.getUserMedia( {audio: true, video: true},\n    function(s) {\n\
  \        vid.src = URL.createObjectURL(s);\n        vid.play();\n    }, function(error)\
  \ {throw error;}\n);\n```\n\n第一个参数是一个配置对象，用于选择你想要使用的输入类型。接着是两个回调函数：第一个定义了成功从输入设备获取媒体流时的处理逻辑，第二个则定义了失败时的处理逻辑。\n\
  \n就是这样。很简单，对吧？曾经网页开发中最令人头疼的问题之一，现在只需要一个方法就能解决。\n\n虽然我们现在纯粹是在讨论 `getUserMedia`，但我想指出的是，你可以用它来实现任何普通视频能做的事情（因为它通过\
  \ video 元素传输）。在接下来的几章中，我们将探讨计算机视觉——一个通常被认为与 Web 无关的庞大主题，我们将以 `getUserMedia` 作为整个项目的基础，这将向您展示视频不仅仅能用于视频会议。\n\
  \n## 规范\n\n正如我在本章开头提到的，WebRTC 是一套规范。它包含以下三个 API：\n\n- Media Stream API\n- PeerConnection\
  \ API\n- DataChannel API\n\nMedia Stream API 主要涵盖了我之前解释过的 `getUserMedia()` 方法。它需要单独的规范，因为尽管使用起来非常简单，但对浏览器实现者来说却很复杂。Peer\
  \ Connections 也很复杂，因为 HTML API 中以前从未有过任何形式的点对点网络。它为我们提供了一个简单的 API 来使用，而无需陷入网络通信的繁杂细节中。\n\
  \n使用这个 API，我们创建一个 Peer Connection 对象来处理所有点对点通信。该对象包含一个 ICE（交互式连接建立）代理、连接状态和 ICE\
  \ 状态。幸运的是，这些也是通过 API 来处理的！所以我们不需要自己计算正确的状态等，只需使用 `new RTCIceCandidate` 创建对象，它就会自行处理状态。\n\
  \nData Channel API 在撰写本文时是集成度最低的，因为与实时传输视频和音频相比，传输简单数据（使用服务器）已经容易得多。数据通道可能比媒体流更重要，因为它允许数据在点对点之间发送，这有无数可能性，比如制作不需要服务器的多人游戏（或者至少，服务器不需要承担全部负载）。正如我们将在后续章节中看到的，媒体流可以非常强大，但数据的常见用途更多，因此能够无需服务器传输数据是非常令人兴奋的！\n\
  \n## 服务器\n\n很抱歉。是的，WebRTC 不需要服务器——但它确实需要。简单想想，你总是需要一种方式找到对方。没有服务器，除非你手动输入 IP 地址，否则\
  \ Peer Connections 根本无法知道在哪里连接。所以我们使用服务器，在我们的例子中是 Node.js，这样消息才能到达正确的客户端。这被称为信令（signaling）。服务器的复杂性取决于你的需求。我们将编写一个相当基础的服务器，用于处理\
  \ Offer 和 Candidate，但只限于两个客户端。扩展服务器以支持更多连接是相当简单的。我鼓励你尝试一下，因为这是理解 WebRTC 复杂性及其网络结构的绝佳方式。\n\
  \n## 从何开始？\n\n如你所见，我们面前的任务相当繁重。我认为我们应该从服务器开始，因为它是代码中最小的部分，同时也充当我们的测试套件。我们将对第 7 章中的代码进行扩展，此处附上代码供你回忆和对比。\n\
  \n```\nvar app = require('express')(),\nserver = require('http').createServer(app),\n\
  io = require('socket.io').listen(server);\n\nio.set('log level', 1); // 移除调试日志\n\
  \nserver.listen(8080);\n\napp.get('/:id', function (req, res) {\n    res.sendfile(__dirname\
  \ + '/index.html');\n});\n\nio.sockets.on('connection', function (socket) {\n  \
  \  var room = socket.handshake.headers.referer;\n    socket.join(room);\n    socket.on('message',\
  \ function (data) {\n        io.sockets.in(room).emit('message', data);\n    });\n\
  \    socket.on('leave', function (room) {\n        socket.leave(room);\n    });\n\
  });\n```\n\n我们需要保留所有这些代码，不过部分内容将会被编辑。在此类可能相当复杂的应用中，我倾向于为每个套接字赋予一个唯一标识符。为此我使用了 `node-uuid`，因此我们需要在文件顶部导入它。然后，在连接新套接字时运行的代码中，我们将\
  \ `uuid.v1()` 的输出赋值给 `socket.id`。当然，我们需要让客户端知道它被分配了一个 ID，因此我们发送一个 `'assigned_id'`\
  \ 消息，将 ID 发送给客户端。\n\n```\nvar express = require('express'),\nhttp = require('http'),\n\
  uuid = require (\"node-uuid\"),\napp = express(),\nserver = http.createServer(app),\n\
  io = require('socket.io').listen(server);\n\nio.sockets.on('connection', function\
  \ (socket) {\n    var room = socket.handshake.headers.referer;\n    console.log('JOINED',\
  \ room);\n    socket.join(room);\n    socket.id = uuid.v1();\n    socket.emit('assigned_id',\
  \ socket.id);\n    // 其他所有代码写在这里\n});\n```\n\n客户端需要监听发出的消息，并将其存储在客户端的 socket 中。\n\
  \n```\nsocket.on('assigned_id', function(data)  {\n    console.log('assigned id'\
  \ + data);\n    socket.id = data;\n});\n```\n\n现在我们需要为信令创建结构。当客户端的摄像头成功启动后，它会将媒体流添加到自己的\
  \ Peer Connection 中，然后创建一个 Offer。在回调函数中，Peer Connection 被赋予本地描述（local description）。我们从回调中获取描述作为参数。该描述保存了关于客户端的所有数据（以\
  \ SDP 格式），例如 IP 地址。我们将在编写完服务器后解释描述的确切格式；这些信息大部分是为浏览器准备的复杂数据，但其中一部分对理解很有帮助。现在，客户端需要让服务器知道是时候将\
  \ Offer 发送给另一个客户端了。为了避免混淆，我们称原始客户端为 c1，与之连接的客户端为 c2。因此，服务器需要将任何 `'received_offer'`\
  \ 消息发送到正确的套接字 c2。最终，服务器对 `'received_candidate'` 和 `'received_answer'` 也要做同样的处理；这三条消息是基本信令切换所需的全部内容。\n\
  \n```\nsocket.on('received_offer', function(data) {\n    console.log(\"received_offer\
  \ %j\", data);\n    io.sockets.in(room).emit('received_offer', data);\n});\n\nsocket.on('received_candidate',\
  \ function(data) {\n    console.log(\" received_candidate %j\", data);\n    io.sockets.in(room).emit('received_candidate',\
  \ data);\n});\n\nsocket.on('received_answer', function(data) {\n    console.log(\"\
  \ received_answer %j\", data);\n    io.sockets.in(room).emit('received_answer',\
  \ data);\n});\n```\n\n\n\n## WebRTC 连接与信令流程\n\n你必须记住，整个代码在两个客户端上运行，因此 `c1` 会发送 `received_offer`\
  \ 给 `c2`，但 `c2` 也会将其发送给 `c1`。这是我们知道两者都已就绪的方式。当 `c2` 收到 offer 时，它会将其对等连接的远程描述设置为\
  \ `c1` 发送的描述（`c1` 的本地描述成为 `c2` 的远程描述，反之亦然）。然后它创建一个 answer，并将其本地描述发送回去（同样通过回调处理）；这一步可能看起来不是必需的，因为双方已经拥有彼此的描述，但这可以视为一种确认。它还会在客户端设置一个名为\
  \ `connected` 的布尔变量为 `true`，以防止此过程重复并导致无限循环。每个客户端的对等连接在本地描述设置完成后会注册一个 ICE candidate\
  \ 就绪事件；这会触发一个由客户端通过 `pc.onIceCandidate()` 处理的事件，该事件随后用于通过发送之前提到的 `'received_candidate'`\
  \ 消息来向服务器发送更多数据（以 SDP 形式，稍后将解释）。当然，`c2` 现在接收到 SDP 并将其用于将 `c1` 添加为对等连接的 ICE candidate。\n\
  \n如果一切按计划进行，`c1` 和 `c2` 现在将能够看到彼此。当然，前提是我们已经实现了客户端部分。我的解释可能显得有些混乱，但这是因为我想准确解释其工作原理，而不仅仅是服务器需要处理几条消息。这与我们在第\
  \ 7 章中所学的概念基本相同，也是编写 Node.js 代码时经常使用的模式。清单 8-1 是服务器的代码，包括用于平滑关闭连接的消息以及用于获取房间内客户端数量的消息：\n\
  \n**清单 8-1.** `Server.js`\n\n```javascript\nvar express = require('express'),\n\
  \    http = require('http'),\n    uuid = require (\"node-uuid\"),\n    app = express(),\n\
  \    server = http.createServer(app),\n    io = require('socket.io').listen(server);\n\
  \nio.set('log level', 1); // 移除调试日志\n\napp.use(express.static('public'));\n\nserver.listen(8080);\n\
  \napp.get('/:id?', function (req, res) {\n    res.sendfile(__dirname + '/index.html');\n\
  });\n\nio.sockets.on('connection', function(socket) {\n    var room = socket.handshake.headers.referer;\n\
  \    console.log('JOINED', room);\n    socket.join(room);\n    socket.id = uuid.v1();\n\
  \    socket.emit('assigned_id', socket.id);\n\n    socket.on('debug_clients', function(data)\
  \ {\n        socket.emit('room_count', io.sockets.manager.rooms['/' + room].length);\n\
  \    });\n\n    io.sockets.in(room).emit('room_count', io.sockets.manager.rooms['/'\
  \ + room].length);\n\n    socket.on('received_offer', function(data) {\n       \
  \ console.log(\" received_offer %j\", data);\n        io.sockets.in(room).emit('received_offer',\
  \ data);\n    });\n\n    socket.on('received_candidate', function(data) {\n    \
  \    console.log(\" received_candidate %j\", data);\n        io.sockets.in(room).emit('received_candidate',\
  \ data);\n    });\n\n    socket.on('received_answer', function(data) {\n       \
  \ console.log(\" received_answer %j\", data);\n        io.sockets.in(room).emit('received_answer',\
  \ data);\n    });\n\n    socket.on('close', function() {\n        console.log(\"\
  closed %j\", room);\n        io.sockets.in(room).emit('closed', room);\n    });\n\
  });\n```\n\n## WebRTC 背后的技术\n\n好了，让我们暂时从代码中抽身。我已经描述了 WebRTC 客户端之间相互连接的流程，但其中有很多术语你可能之前没见过。因此，在编写客户端代码之前，我想介绍一下\
  \ WebRTC 背后的技术及其工作原理。这些内容有点超出本书的范围，所以我鼓励你进一步阅读相关资料。如果你不太感兴趣，可以跳过本节，直接进入实现客户端的下一节。\n\
  \n### ICE\n\n我之前多次提到 ICE。它代表 Interactive Connectivity Establishment（交互式连接建立），根据\
  \ RFC 5245（[`www.ietf.org/rfc/rfc5245.txt`](http://www.ietf.org/rfc/rfc5245.txt)）的定义，它是“一种用于提供/应答模型的网络地址转换（NAT）遍历协议”。该\
  \ RFC 文档非常详细，部分人可能会觉得很有趣，但我认为摘要已经很好地概括了其目的。对某些人来说，这些内容听起来可能完全像天书，但希望在你阅读完我关于 ICE\
  \ 及其他技术的简短总结后，能够理解它。\n\n> 本文档描述了一种用于基于 UDP 的多媒体会话的网络地址转换（NAT）遍历协议，该会话通过提供/应答模型建立。此协议称为交互式连接建立（ICE）。ICE\
  \ 利用了用于 NAT 的会话遍历工具（STUN）协议及其扩展——使用中继进行 NAT 遍历（TURN）。任何使用提供/应答模型的协议（如会话发起协议 SIP）都可以使用\
  \ ICE。——RFC 5245 摘要\n\n正如我在本章“规范”部分所解释的，每个 WebRTC 客户端必须具备的对等连接由多个组件构成，包括 `iceConnectionState`、`iceGatheringState`\
  \ 以及 ICE 代理。ICE 代理是重要（且简单）的部分。它是每个客户端上 WebRTC 的端点，负责使用信令协议与其他端点通信。我们使用 ICE 的原因是（正如摘要所述）它是用于\
  \ UDP 通信 NAT 遍历的标准化协议。这基本上意味着它能够在不被阻止的情况下穿越安全机制（如防火墙）。ICE 通过并行检查所有可能的通信路径来工作，从而快速找到最优路径。状态（显而易见）用于查找\
  \ ICE 代理的状态，并且它们是只读的。\n\n`iceGatheringState` 的可能状态包括：\n\n*   `new`\n*   `gathering`\n\
  *   `complete`\n\n`iceConnectionState` 的可能状态包括：\n\n*   `starting`\n*   `checking`\n\
  *   `connected`\n*   `completed`\n*   `failed`\n*   `disconnected`\n*   `closed`\n\
  \n### NAT 遍历\n\nNAT 是硬件路由器（以及部分商用交换机）背后的技术，它允许一台路由器后面的多台机器使用同一个 IP 地址工作。它接收传入的数据包，并根据数据包的来源将其发送到正确的设备。它将内部网络地址（例如\
  \ `192.168.1.123`）转换为外部 IP，反之亦然。出于多种原因（包括安全性），入站通信通常受到限制，并且通常涉及一个端口白名单表，NAT 设备使用该表将内部地址与入站端口关联起来（通常称为防火墙）。\n\
  \nNAT 遍历是一组方法的统称，用于以用户友好的方式绕过这些限制。如果没有 NAT 遍历技术，用户将不得不手动在防火墙上打开端口以允许入站流量，并将这些端口信息提供给其他连接方。一些常见的\
  \ NAT 遍历技术包括：反向代理、套接字安全（SOCKS）、通用即插即用（UPnP）和 UDP 打洞。\n\n### STUN/TURN\n\nSTUN（用于\
  \ NAT 的会话遍历工具）和 TURN（围绕 NAT 使用中继进行遍历）都是信令协议，通常被 ICE 用作 NAT 遍历的工具。如果你希望运行自己的服务器，每种协议都有开源实现。我在本章中使用的两个服务器（你只需要一个，但可以配置多个作为备份）分别由\
  \ Google 和 Mozilla 运行，地址为 `stun:stun.l.google.com:19302` 和 `stun:stun.services.mozilla.com`。你会注意到这两个服务器都是\
  \ STUN 服务器。这主要是因为它们是我找到的第一个可靠的免费服务器。两者之间的主要区别在于，TURN 使用中继技术，因此数据通过中继服务器传输到客户端。然而，TURN\
  \ 的优点是它构建在 STUN 之上，因此它始终首先尝试使用 STUN，如果失败，则使用中继。TURN 的另一个优点是它适用于对称 NAT，而 STUN 无法做到这一点。\n\
  \n\n\n#### SDP\n\n如果我用“天书”来形容 ICE 协议的抽象内容，那么我的词汇量无法描述 SDP。乍一看（可能第二眼和第三眼也是），它看起来难以理解。但别担心，重要的部分相当容易理解，其余部分都有文档说明（主要在\
  \ `RFC4566` 中）。`SDP` 代表会话描述协议（Session Description Protocol），是在客户端之间发送的数据形式。以下是一个\
  \ SDP 示例，本例在 `localhost` 下运行本章代码，并在两个 Google Chrome 标签页之间建立连接。SDP 内容范围很广，很大程度上取决于通信阶段，因此如果你查看自己的\
  \ SDP 数据，不要期望它看起来完全相同。我只包含了前 11 行，因为大部分内容对我们调试来说通常没什么用，而且主要与加密有关。\n\n```\nv=0\n\
  o=- 6888311506875211333 2 IN IP4 127.0.0.1\ns=-\nt=0 0\na=group:BUNDLE audio video\n\
  a=msid-semantic: WMS YuWoij3TGBXIt0Ud2iqCWMbt7FnkBqSNpP96\nm=audio 1 RTP/SAVPF 111\
  \ 103 104 0 8 107 106 105 13 126\nc=IN IP4 0.0.0.0\na=rtcp:1 IN IP4 0.0.0.0\na=ice-ufrag:qbj6LYoXCSHnUUuq\n\
  a=ice-pwd:C/eziXfWhziBTVpMylTLU2M3\n```\n\n这看起来令人生畏，我知道。让我们从等号前面的字母开始。这被称为“类型”，它始终只是一个字符，并且区分大小写。类型的顺序是预定义的，主要是为了减少错误，并使得解析器更容易实现。当然，这也方便调试，因为我们始终知道要找的数据应该在哪里！我只解释前四行，因为它们是最可能出错的行，其余的都是可选的，因此不太可能出问题（如果出了问题，更可能是浏览器中的\
  \ bug，而不是你的代码）。请注意，属性采用`<type>=<attribute>:<value>`的形式。如果你有兴趣了解大多数属性，可以很容易地在网上搜索到，我可能会在我的网站上写一篇文章来配合本章内容。\n\
  \n```\n会话描述\nv=  (协议版本)\no=  (发起者和会话标识符)\ns=  (会话名称)\ni=* (会话信息)\nu=* (描述的统一资源标识符)\n\
  e=* (电子邮件地址)\np=* (电话号码)\nc=* (连接信息 —— 如果包含在所有媒体中则不需要)\nb=* (零行或多行带宽信息)\n一个或多个时间描述\
  \ (\"t=\" 和 \"r=\" 行；见下文)\nz=* (时区调整)\nk=* (加密密钥)\na=* (零行或多行会话属性行)\n零个或多个媒体描述\n\
  \n时间描述\nt=  (会话激活时间)\nr=* (零个或多个重复时间)\n\n媒体描述（如果存在）\nm=  (媒体名称和传输地址)\ni=* (媒体标题)\n\
  c=* (连接信息 —— 如果在会话级别包含则为可选项)\nb=* (零行或多行带宽信息)\nk=* (加密密钥)\na=* (零行或多行媒体属性行)\n\n\
  * 表示可选项\n```\n\n本类型指南摘自 `RFC 4566`，因此感谢互联网协会（The Internet Society）。你可以很容易地看到 `SDP`\
  \ 对象如何分为三个部分。在撰写本文时，所有 SDP 对象都以 `v=0` 开头，因为没有其他可用版本。在我的示例中，第二行（发起者和会话标识符）是 `o=-\
  \ 6888311506875211333 2 IN IP4 127.0.0.1`。连字符表示没有用户名，因为我没有使用私有的 `TURN` 服务器。长数字是会话的唯一标识符。接下来，我们找到这一行的关键部分，至少对于调试来说，那就是会话版本；这是会话数据更改的次数（每次我们发送包含数据的新消息时，此数字都会增加）。你可以使用会话版本绝对确定会话描述已更新。`IN`\
  \ 代表互联网（Internet），它在那里是为了使协议具有前瞻性。然后我们有 IP 类型，在这种情况下是 IP 版本 4。第二行最后是 IP 地址。我在本地运行，因此它报告\
  \ IP 地址为 `127.0.0.1`（`localhost`）。\n\n你可能注意到我的示例直接跳到了时间部分，这是一个实现决策（在本例中由 Chrome\
  \ 决定），因为中间的行都是可选的。第一个 `0` 表示开始时间，后面的 `0` 表示停止时间。由于两者都是 `0`，这意味着会话是永久性的。\n\n## 客户端代码\n\
  \n好吧，这是从代码中解脱出来的一个不错休息，但我认为我们都准备好重新投入，并对 `WebRTC` 实际工作原理以及我们发送的数据到底是什么有了更坚实的理解。还记得信令如何工作的概述吗？这里再次以列表形式呈现，以便更容易实现：\n\
  \n1. 启动摄像头。\n2. 将流添加到 `Peer Connection`。\n3. 发送带有本地描述（Local Description）的 `received_offer`\
  \ 消息。\n4. 将本地描述添加到 `Peer Connection`。\n5. 将接收到的描述作为远程描述（Remote Description）添加到 `Peer\
  \ Connection`。\n6. 创建应答（Answer）。\n7. 设置 `connect` 为 `true` 以防止无限循环。\n8. 添加 `ICE\
  \ Candidate`。\n9. 加载摄像头。\n\n你可能还记得本章开头，启动摄像头的正确方法是使用 `navigator.getUserMedia()`。不幸的是，由于在撰写本文时浏览器中的不同实现，我们使用了\
  \ `Adapter.js`，它去掉了供应商前缀，以便跨浏览器使用 `RTC`。为了快速加载视频，无需担心用户界面等，我们将 `getUserMedia` 放入一个名为\
  \ `broadcast()` 的函数中，并在 `window.onload` 中调用它。在 `getUserMedia` 的回调中，我们需要将流添加到 `Peer\
  \ Connection`，然后使用 `URL.createObjectURL()`（我们在第 2 章中使用过）将流添加到 `video` 元素并播放视频。一旦服务器发送消息表明房间人数超过\
  \ 1，就该向服务器发送 offer 了。\n\n```javascript\nvar socket = io.connect('http://localhost');\n\
  var pc = new RTCPeerConnection(servers, mediaConstraints);\nvar initConnection =\
  \ false;\n\nsocket.on('room_count', function(data) {\n  room_count = data;\n  console.log('ROOM\
  \ COUNT', data);\n  if (room_count > 1)\n    initConnection = true;\n});\n\nfunction\
  \ broadcast() {\n  getUserMedia({audio: true, video: true}, function(s) {\n    pc.addStream(s);\n\
  \    console.log(\"GOT MEDIA\");\n    vid1.src = URL.createObjectURL(s);\n    vid1.play();\n\
  \    if (initConnection) start();\n  }, function(error) {throw error;});\n};\n\n\
  window.onload = function() {\n  broadcast();\n};\n```\n\n在 `start()` 中，我们需要创建 offer，这通过\
  \ `Peer Connection` 的 `pc.createOffer()` 发生。该方法本身提供了 `SDP` 作为参数，我们可以使用它来设置本地描述（Local\
  \ Description），并向服务器发送一条包含 `SDP` 的 `'received_offer'` 消息。\n\n```javascript\nfunction\
  \ start() {\n  console.log('STARTING');\n  // 这将初始化 peer connection\n  pc.createOffer(function(description)\
  \ {\n    console.log(description);\n    pc.setLocalDescription(description);\n \
  \   socket.emit('received_offer', JSON.stringify(description));\n  }, null, mediaConstraints);\n\
  };\n```\n\n你会注意到两个额外的参数，第二个是用于错误处理的回调（为了简单起见，我省略了它），第三个是我称为 `mediaConstraints` 的变量。这个变量包含强制数据，用于说明视频和/或音频是否可用，以及可选数据，在本例中是\
  \ `DtlsSrtpKeyAgreement`，它用于为默认不启用它的浏览器（例如旧版 Chrome）启用数据报传输层安全性（Datagram Transport\
  \ Layer Security）。\n\n```javascript\nvar mediaConstraints = {\n  'mandatory': {\n\
  \    'OfferToReceiveAudio':true,\n    'OfferToReceiveVideo':true\n  },\n  'optional':\
  \ [{'DtlsSrtpKeyAgreement': 'true'}]\n};\n```\n\n\n\n### 建立对等连接的步骤\n\n这就引出了步骤 4，将远程描述添加到对等连接中。我们从之前发送的\
  \ `\"received_offer\"` 消息中获取此描述（请记住，客户端 1 和 2 都会互相发送该消息）。首先，解析 SDP 的 JSON 字符串化数据，并将其存储在一个名为\
  \ `data` 的变量中。然后，通过访问 `type` 属性来确认数据确实是一个 offer，以此防范可能出现的边界情况。接着，我们将对等连接的远程描述设置为数据的\
  \ `RTCSessionDescription`。完成这一步后，我们以与使用 `createOffer()` 类似的方式，使用对等连接的 `createAnswer()`\
  \ 方法。首先，将本地描述设置为与提供的数据相同，然后向服务器发送一条 `\"received_answer\"` 消息。\n\n```\nsocket.on('received_offer',\
  \ function(data) {\n    data = JSON.parse(data);\n    console.log('received offer');\n\
  \    if (data.type == \"offer\") {\n        pc.setRemoteDescription(new RTCSessionDescription(data));\n\
  \        pc.createAnswer(function(data) {\n            console.log('sending answer',\
  \ data);\n            pc.setLocalDescription(data);\n            socket.emit('received_answer',\
  \ data);\n        }, null, mediaConstraints);\n    }\n});\n```\n\n当然，我们现在要检查 `\"\
  received_answer\"`（当你把整个过程拆解成小部分时，一切就没那么复杂了，对吧？）。我们现在需要一个名为 `connected` 的变量，以确保只尝试连接一次。如果该变量被设置为\
  \ `false`，并且数据确实是一个 answer，那么我们将再次使用 SDP 创建一个远程描述，并将其添加到对等连接中。然后，我们只需将 `connected`\
  \ 设置为 `true`，这样就不会反复重连（再次强调，这是一种很少出现的边界情况）。\n\n```\nsocket.on('received_answer',\
  \ function(data) {\n    console.log('received answer', data);\n    if(!connected\
  \ && data.type == \"answer\") {\n        var description = new RTCSessionDescription(data);\n\
  \        console.log(\"Setting remote description\", description);\n        pc.setRemoteDescription(description);\n\
  \        connected = true;\n    }\n});\n```\n\n现在，对等连接知道它有一个 ICE 候选项，因为一旦设置了本地描述，对等连接就会开始“收集候选项”。当它获得一个\
  \ ICE 候选项时，我们将其自己的候选项（包括 ID 和标签）作为 `\"received_candidate\"` 消息发送回去。因此，我们现在需要监听 `\"\
  received_candidate\"`，并将该候选项添加到对等连接中。这个过程主要只是为了确认每个候选项，当客户端数量超过两个时，这会更成问题。清单 8-2\
  \ 显示了 `client.js` 文件的当前状态。\n\n**清单 8-2.** `Client.js`\n\n```\nsocket.on('received_candidate',\
  \ function(data) {\n    console.log('received candidate', data);\n    data = JSON.parse(data);\n\
  \    var candidate = new RTCIceCandidate({\n        sdpMLineIndex: data.label,\n\
  \        candidate: data.candidate\n    });\n    pc.addIceCandidate(candidate);\n\
  });\n\npc.onicecandidate = function(e) {\n    console.log(\"oniceCandidate\", e);\n\
  \    if(e.candidate) {\n        socket.emit('received_candidate', JSON.stringify({\n\
  \            label: e.candidate.sdpMLineIndex,\n            id: e.candidate.sdpMid,\n\
  \            candidate: e.candidate.candidate\n        }));\n    }\n};\n```\n\n\
  既然两个对等连接都已拥有所需的所有候选项，我们基本上就完成了。一切都准备就绪后，`addstream` 事件将被触发，让我们可以将远程视频流放入一个视频元素中（在本例中为\
  \ `vid2`）。\n\n```\npc.onaddstream = function(e) {\n    console.log('start remote\
  \ video stream');\n    console.log(e);\n    vid2.src = URL.createObjectURL(e.stream);\n\
  \    vid2.play();\n};\n```\n\n值得注意的是，未关闭连接的用户会看到远程视频停留在最后传输的那一帧上。你可以通过为 `'close'`\
  \ 消息添加事件处理程序，使其显示连接已断开。代码的最终版本可以在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
  \ 或我的个人网站 shanehudson.net/javascript-creativity 的下载资源中找到。\n\n## 总结\n\n我希望你喜欢这一章。`WebRTC`\
  \ 是一种起初令人困惑，且在浏览器实现层面（如 SDP）非常复杂的技术，但一旦你掌握了它，实际上相当简单。它也极其强大。我们在这里演示了最显而易见的用例，因为作为入门介绍它最为有用，但\
  \ `WebRTC`（特别是如果你想放弃信令机制并采用其他方法来寻找其他客户端）作为一种通用的点对点技术也非常有用；例如，如果你希望用户在没有服务器开销的情况下进行连接，可以开发一个游戏或原型应用。访问用户摄像头的功能也非常强大，正如你将在下一章中看到的，我们将开始探索计算机视觉领域。\n\
  \n## 运动检测\n\n## 运动检测简介\n\n到目前为止，在整本书中，我们已经研究了许多技术，它们具有明显的应用场景，无需太多创造力即可实现，有些是以前无法实现但现在却很容易做到的事情，例如上一章中的视频聊天。现在，我想深入探讨计算机视觉领域，这是我个人的兴趣之一，并且拥有多种多样的应用方式。由于本书既不涉及高级计算机视觉，也不针对学术/研究实验室，我们将坚持使用相对简单的算法，并避免任何需要训练的人工智能技术，例如面部识别。\n\
  \n在本章中，我们专注于运动检测，因为它与 `WebRTC` 结合得很好，并且可能是基础计算机视觉中最有用的方面之一。在下一章中，我们将创建一个可以通过运动检测来演奏，并通过\
  \ `WebRTC` 与他人合奏的乐器，这将很好地贯穿整本书。不过现在，请思考一下运动检测还能用于哪些其他类型的应用，例如家庭安防，甚至仅仅是视觉效果。\n\n\
  \n\n### 视频处理样板代码\n\n到目前为止你可能会注意到，大多数此类项目都遵循类似的模式。这里我快速介绍本章中视频处理代码（即便不是全部，也是绝大部分）将要使用的模式。我们首先为\
  \ `window.URL` 和 `navigator.getUserMedia` 编写一个 shim，本章我决定使用一个变量来调用与浏览器兼容的方法，而不是像上一章那样使用完整的\
  \ polyfill（因为完整的 `WebRTC` 技术栈比 `getUserMedia` 的浏览器支持度更差）。\n\n```\nwindow.URL = window.URL\
  \ || window.webkitURL;\n\nnavigator.getUserMedia  =  navigator.getUserMedia ||\n\
  \                           navigator.webkitGetUserMedia ||\n                  \
  \         navigator.mozGetUserMedia ||\n                           navigator.msGetUserMedia;\n\
  \nif (navigator.getUserMedia === undefined) {\n    throw new Error(\"Browser doesn't\
  \ support getUserMedia\");\n}\n```\n\n现在我们需要设置页面，在本例中，要让视频和 canvas 元素在浏览器窗口内全屏显示。只需将\
  \ video 元素设置为自动播放，获取 canvas 的上下文，并初始化视频流。为了绘制帧，我们连接视频流并添加一个事件监听器，一旦视频准备就绪（例如 `'canplay'`\
  \ 事件），就调用 `draw()`。现在有一个小问题：通常情况下这可以正常工作，但某些版本的 Firefox（编写本书时，这些版本都相当常用）存在一个 bug，会导致\
  \ `drawImage` 在视频帧大小尚未设置之前运行。错误是 `NS_ERROR_NOT_AVAILABLE`，为了避免这个错误，我们可以使用 try catch。当然，在生产代码中，无论如何都建议进行彻底的错误处理，所以这不应该是个大问题。\n\
  \n在 try catch 块内，我们需要将 video 元素的图像绘制到 canvas 上下文。为了获取可操作的数据，我们需要使用 `ctx.getImageData(0,\
  \ 0, w, h)` 来获取帧，它有一个 data 属性可用于检索和修改帧。以下是样板代码。请注意其中有一个注释，指示在何处操作数据。\n\n```\nfunction\
  \ setup()  {\n  videoElement = document.querySelector(\"video\");\n  videoElement.width\
  \ = w = window.innerWidth;\n  videoElement.height = h = window.innerHeight;\n  videoElement.autoplay\
  \ = true;\n  canvas = document.querySelector('canvas');\n  canvas.width = w;\n \
  \ canvas.height = h;\n  ctx = canvas.getContext('2d');\n  navigator.getUserMedia({video:\
  \ true}, function (stream) {\n      videoElement.src = window.URL.createObjectURL(stream);\n\
  \      videoElement.addEventListener('canplay', draw);\n  }, function() {});\n}\n\
  \nfunction draw() {\n  if (videoElement.paused || videoElement.ended) {\n      return;\n\
  \  }\n  try  {\n      ctx.drawImage(videoElement, 0, 0, w, h);\n      manip = ctx.getImageData(0,\
  \ 0, w, h);\n      var data = manip.data;\n      // Manipulate the frame by modifying\
  \ data\n      ctx.putImageData(manip, 0, 0);\n      requestAnimationFrame(draw);\n\
  \  }\n  catch (e)  {\n      if (e.name == \"NS_ERROR_NOT_AVAILABLE\") {\n      \
  \    setTimeout(draw, 0);\n      }\n      else  {\n          throw e;\n      }\n\
  \  }\n}\n```\n\n### 基础视频处理\n\n你应该还记得，在第 3 章中，我们曾通过简单地遍历像素来处理视频，但由于那是本书的开头部分，这里我将快速回顾一下。这次，让我们直接反转像素，这样我们就可以轻松看到处理过程是如何工作的，而不必担心用于创建效果的具体算法。\n\
  \n用于反转帧的函数是 `invertFrame`，它接受 `data` 作为参数。对 `invertFrame` 的调用应放置在样板代码中注释所在的位置，data\
  \ 参数应来自 `data` 变量。请注意，我们将返回 `data` 变量，以便它直接影响样板代码中的 `manip.data`（因为这是实际的帧）。我们首先得到的数据格式是\
  \ `Uint8ClampedArray`。这意味着该数组包含无符号整数（即正数），并且它们被限制为 8 位（一个字节），由于 2⁸ 是 256，因此数组任何索引处的最大值是\
  \ 255（当然，这是从 0 开始计数的结果）。\n\n**注意**\n\n该数组由 RGBA 颜色值组成，因此您应该每遍历四个索引，以获取每种颜色的起始位置。\n\
  \n因此，在遍历数组时，我们从每种颜色的起始位置开始，因此需要（通常，除非您只想查找红色）同时检查绿色和蓝色的索引（分别通过检查 `data[i+1]` 和 `data[i+2]`）。要反转颜色，我们需要用\
  \ 255 减去每种颜色的当前值（例如，使白色变成黑色）。\n\n```\nfunction invertFrame(data)  {\n  // Iterate\
  \ through each pixel, inverting it\n  for (var i = 0; i < data.length; i += 4) {\n\
  \    var r = data[i],\n        g = data[i+1],\n        b = data[i+2];\n\n    data[i]\
  \ = 255 - r;\n    data[i+1] = 255 - g;\n    data[i+2] = 255 - b;\n  }\n  return\
  \ data;\n}\n```\n\n请参阅列表 9-1，了解如何将其与样板代码结合使用。\n\n**列表 9-1.**\n\n```\nwindow.URL\
  \ = window.URL || window.webkitURL;\n\nnavigator.getUserMedia  =  navigator.getUserMedia\
  \ ||\nnavigator.webkitGetUserMedia ||\nnavigator.mozGetUserMedia ||\nnavigator.msGetUserMedia;\n\
  \nif (navigator.getUserMedia === undefined) {\n  throw new Error(\"Browser doesn't\
  \ support getUserMedia\");\n}\n\nvar videoElement, canvas, ctx, manip, w, h;\nwindow.addEventListener('DOMContentLoaded',\
  \ setup);\n\nfunction setup()  {\n  videoElement = document.querySelector(\"video\"\
  );\n  videoElement.width = w = window.innerWidth;\n  videoElement.height = h = window.innerHeight;\n\
  \  videoElement.autoplay = true;\n  canvas = document.querySelector('canvas');\n\
  \  canvas.width = w;\n  canvas.height = h;\n  ctx = canvas.getContext('2d');\n \
  \ navigator.getUserMedia({video: true}, function (stream) {\n    videoElement.src\
  \ = window.URL.createObjectURL(stream);\n    videoElement.addEventListener('canplay',\
  \ draw);\n  }, function() {});\n}\n\nfunction draw() {\n  if (videoElement.paused\
  \ || videoElement.ended) {\n    return;\n  }\n  try  {\n    ctx.drawImage(videoElement,\
  \ 0, 0, w, h);\n    manip = ctx.getImageData(0, 0, w, h);\n    var data = manip.data;\n\
  \    data = invertFrame(data);\n    ctx.putImageData(manip, 0, 0);\n    requestAnimationFrame(draw);\n\
  \  }\n  catch (e)  {\n    if (e.name == \"NS_ERROR_NOT_AVAILABLE\") {\n      setTimeout(draw,\
  \ 0);\n    }\n    else  {\n      throw e;\n    }\n  }\n}\n\nfunction invertFrame(data)\
  \  {\n  // Iterate through each pixel, inverting it\n  for (var i = 0; i < data.length;\
  \ i += 4) {\n    var r = data[i],\n        g = data[i+1],\n        b = data[i+2];\n\
  \    data[i] = 255 - r;\n    data[i+1] = 255 - g;\n    data[i+2] = 255 - b;\n  }\n\
  \  return data;\n}\n```\n\n\n\n## 运动检测\n\n现在你已经刷新了视频操作的知识，让我们深入第一个演示：在视频中检测运动。这是一个有用的计算机视觉技术，尽管（在此例中）它完全基于朴素的方法，不涉及人工智能，也没有特别复杂的算法。仔细想想，运动检测其实就是在显示帧与帧之间的差异。我们可以通过优化、跨多帧检测或跟踪运动来让它变得更复杂，但目前我们只需找出差异。\n\
  \n实现这一点相当容易：你获取当前数据并存储起来，这样在下一帧时，你就能同时拥有新数据和旧数据。一旦你有了这两组数据，就可以进行比较，找出不同的像素。然而，如果你这样做，很快就会注意到摄像头每一帧捕捉到的画面并不完全相同，因此背景看起来会像有许多运动。为了解决这个问题，你可以使用一个阈值来调整精度。因为我们没有使用任何人工智能，所以这个阈值可以是一个效果良好的任意数值（我在测试时，15\
  \ 的效果就不错）。在图 9-1 中，你可以看到我头部运动的检测结果，这正是因为我使用了任意的阈值。如果我们创建一个 AI，它会尝试找出最可能属于我们寻找的那种运动的像素，比如手的轮廓，或者更简单地说，是一群像素而不是单个点的运动（因为我们感兴趣的任何物体都不可能只有一个像素那么大！）。\n\
  \n在 `try` 块中，我们略微修改了样板代码，使其检查 `oldData` 是否为 `null`（这应该是它的初始值）。如果它不为 `null`，则进行操作；如果为\
  \ `null`，则将来自 `data.manip` 的当前数据赋值给它。\n\n![A978-1-4302-5945-9_9_Fig1_HTML.jpg](img/A978-1-4302-5945-9_9_Fig1_HTML.jpg)\n\
  \n**图 9-1.** 屏幕截图显示了我移动时被检测到的面部大致轮廓\n\n```\nbctx.drawImage(videoElement, 0, 0, w,\
  \ h);\nmanip = bctx.getImageData(0, 0, w, h);\nvar data = manip.data;\nif (oldData\
  \ != null) {\n    data = motionDetection(data, oldData);\n    ctx.putImageData(manip,\
  \ 0, 0);\n    oldData = null;\n}\nelse  {\n    oldData = manip.data;\n}\nrequestAnimationFrame(draw);\n\
  ```\n\n`motionDetection()` 函数的工作原理如前所述：它接收当前帧的数据和上一帧的数据（尽管这可以通过多种方式优化或变得更高级，所以不一定非得是上一帧），然后比较它们，并为每一个发生了移动且在阈值范围内的像素绘制一个红色像素。\n\
  \n```\nfunction motionDetection(data, oldData)  {\n    // 遍历每个像素，如果未发生变化则设为 255\n\
  \    for( var y = 0 ; y < h; y++ ) {\n        for( var x = 0 ; x < w; x++ ) {\n\
  \            var indexOld = (y * w + x) * 4,\n                    oldr = oldData[indexOld],\n\
  \                    oldg = oldData[indexOld+1],\n                    oldb = oldData[indexOld+2],\n\
  \                    olda = oldData[indexOld+3];\n            var indexNew = (y\
  \ * w + x) * 4,\n                    r = data[indexNew],\n                    g\
  \ = data[indexNew+1],\n                    b = data[indexNew+2],\n             \
  \       a = data[indexNew+3];\n            if (oldr > r - 15 || oldg > g - 15 ||\
  \ oldb > b - 15)\n            {\n                data[indexNew] = 255;\n       \
  \         data[indexNew+1] = 255;\n                data[indexNew+2] = 255;\n   \
  \             data[indexNew+3] = 255;\n                detected = true;\n      \
  \      }\n            else\n            {\n                data[indexNew] = 255;\n\
  \                data[indexNew+1] = 0;\n                data[indexNew+2] = 0;\n\
  \                data[indexNew+3] = 255;\n            }\n        }\n    }\n    return\
  \ data;\n}\n```\n\n## 运动跟踪\n\n好了，检测运动是一回事，但除非你在创建报警系统或进行艺术创作，否则单独使用它并不是很有用。你通常要么想让计算机足够聪明，能够识别出物体是什么（这对机器人尤其重要），要么更常见的是，仅仅知道同一个物体在哪里——这被称为跟踪。我们已经生成了一个显示运动的图像，但它并没有尝试将运动归为一个物体。实现这一目标的方法有很多种，例如基于颜色进行校准，并寻找具有正确平均颜色的区域，或者你可以使用人工智能并实际训练它来寻找某个物体。\n\
  \n虽然颜色校准比使用人工智能更容易，但它可能会导致很多问题，而且如果你希望它可靠，涉及的数学很快就变得过于复杂，不适合在一本书的单独一章中讲解。因此，我们将采取介于两者之间的方法，使用一个名为\
  \ `js-objectDetect` 的库（由 Martin Tschirsich 编写，可在 github 上找到：[`https://github.com/mtschirs/js-objectdetect`](https://github.com/mtschirs/js-objectdetect)），它基于\
  \ OpenCV 目标检测器，并且可以使用已训练好的分类器。在我们开始看代码之前，让我们先了解一下这个库实际的工作原理。\n\n### 类 Haar 特征\n\n\
  大多数图像处理算法都需要一种检测图像中特征的方法，而有相当多的不同方法可以做到这一点。最常用的方法（由于它们在 Viola-Jones 算法中的应用）被称为类\
  \ Haar 特征。它们基于 Alfréd Haar 在 1909 年提出的原始 Haar 小波。小波是一种数学函数，它将数据切割成不同的频率，然后缩放并分析数据的模式。它是信号处理的基本工具，并且提供了一种可以缩放数据的备选方案，以替代傅里叶变换（我们在第\
  \ 3 章中使用过）。类 Haar 特征可以被视为 Haar 小波的一种更具体的形式，因为你可以使用不同大小的黑白矩形（如图 9-2 所示）来可视化它们。\n\n\
  ![A978-1-4302-5945-9_9_Fig2_HTML.jpg](img/A978-1-4302-5945-9_9_Fig2_HTML.jpg)\n\n\
  **图 9-2.** 类 Haar 特征示例，以黑白矩形形式可视化\n\n它们之所以是黑白矩形，而不是类似于它们正在寻找的特征的形状，是因为大多数物体都有共同的阴影模式（例如在眼睛和鼻子之间）。它们通过使用积分图（summed\
  \ area tables）来高效工作，以生成所谓的积分图像（integral image），从而可以快速查找矩形内所有像素的总和，而无需每次都重新计算。单独来看，类\
  \ Haar 特征并不是特别有用，但当它们作为 Viola-Jones 算法（该算法使用滑动窗口进行搜索）的一部分时，它们就变得至关重要了。\n\n\n\n###\
  \ Viola–Jones\n\n正如你从上一节可能猜到的，驱动`js-objectDetect`和 OpenCV 目标检测器的算法，基于保罗·维奥拉和迈克尔·琼斯在\
  \ 2001 年撰写的一篇论文（后来由莱纳·林哈特改进），通常简称为 Viola–Jones 算法。我不会详细介绍该算法，因为它相当复杂，但如果你对计算机视觉或人工智能有浓厚的兴趣，那么它或许值得一读。原论文确实包含了一些相当高级的数学内容，但它的写作方式应该不会太难理解。该算法的工作原理大致是：获取两组图像——正匹配和负匹配；通过用一个试图匹配图像窗口内容与哈尔特征的小窗口遍历每一张图像，来训练算法。与所有训练一样，样本集越大，结果就应该越准确。\n\
  \n这篇论文将该算法描述为一个“视觉目标检测框架”，因此它可以以多种不同的方式实现。该论文包含了三个主要贡献，它们可以被视为任何基于 Viola–Jones 的人脸检测算法的主要组成部分。第一个组成部分是积分图像，正如我之前所解释的，这是哈尔特征如此高效的原因。第二个组成部分是基于\
  \ AdaBoost 的学习算法。他们提出的最后一个对人脸检测很重要的组成部分是级联分类器，它用于快速丢弃图像的背景。值得注意的是，用于检测的算法与用于训练的算法是相同的，因此使用分类器不需要额外的步骤。分类器是训练的结果，我们将使用预定义的级联，这样就不需要训练了（因为这需要大规模数据集，且可能耗时很长）。`js-objectDetect`库包含了一些作为示例的分类器（包括嘴部、眼睛和手部的分类器，而不仅仅是人脸），因此本章我们将使用这些分类器。级联分类器有两种类型：桩和树。桩是树的一个单一节点，由于其在准确性和效率之间的平衡，通常是最佳选择，因此`js-objectDetect`库只处理以\
  \ JSON 格式存储的桩级联。\n\n### 使用 `js-objectDetect`\n\n这个库使得使用极其强大的 Viola–Jones 算法变得非常容易，甚至无需安装\
  \ OpenCV（一个大型的 C++计算机视觉框架）。它采用 GPL 许可证，因此你可以自由阅读和修改其代码。它也有很好的注释，所以如果你对 Viola–Jones\
  \ 算法的实现细节感兴趣，这绝对是一个好的起点。在下一章中，我们将使用目标检测作为输入，但在本章中，为了演示追踪，我们将改为在人脸周围绘制一个矩形框。人脸检测是计算机视觉的常见用途，因为它是大多数更高级计算机视觉主题（如人脸识别或眼球追踪）的基础。\n\
  \n**注意：** 与运动检测一样，追踪仍然依赖于网络摄像头生成的 2D 图像，因此它可能不是完全准确的，并且需要良好的照明条件以及只能追踪一张人脸。\n\n\
  实际上，使用`js-objectDetect`进行人脸检测非常容易；只需引入该库并运行一小段 JavaScript 代码即可。它不使用 canvas，因此可以直接将`getUserMedia`与视频元素配合使用，而无需考虑\
  \ canvas 上下文。该库当然包含在本书附带的下载文件中。我加入了一个带有`cursor`类的 div；这是包围检测到人脸的框。\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<head>\n<title>网络摄像头应用</title>\n<style>\nhtml, body { margin:\
  \ 0; padding: 0; }\nvideo { position: absolute; top: 0; left: 0;  }\n</style>\n\
  </head>\n<body>\n<video></video>\n<div class=\"cursor\"></div>\n<script src=\"js-objectDetect/compatibility.js\"\
