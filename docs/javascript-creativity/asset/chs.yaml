  \n// 边缘检测\n\nfor (var y = 0; y < h; y += 1) {\n\nfor (var x = 0; x < w; x += 1)\
  \ {\n\nvar i = (y * w + x) * 4;\n\noutputData[i] = inputData[i - w*4 - 4] +   inputData[i\
  \ - w*4] + inputData[i - w*4 + 4] +\n\ninputData[i - 4]       -   8*inputData[i]\
  \     + inputData[i + 4] +\n\ninputData[i + w*4 - 4] +   inputData[i + w*4] + inputData[i\
  \ + w*4 + 4];\n\nif (outputData[i] < threshold)\n\n{\n\noutputData[i] = 255;\n\n\
  outputData[i+1] = 255;\n\noutputData[i+2] = 255;\n\n}\n\nelse\n\n{\n\noutputData[i]\
  \ = 0;\n\noutputData[i+1] = 0;\n\noutputData[i+2] = 0;\n\n}\n\noutputData[i + 3]\
  \ = 255; // alpha 通道\n\n}\n\n}\n\n// 操作后，将图像数据放回\n\nctx.putImageData(output, 0,\
  \ 0);\n\n}\n\nfunction startPath(e)  {\n\nctx.strokeStyle = \"#0000ff\";\n\nctx.lineWidth\
  \   = lineWidth;\n\nctx.beginPath();\n\nctx.moveTo(e.clientX + lineWidth, e.clientY\
  \ + lineWidth);\n\ndrawing = true;\n\n}\n\nfunction handleDrawing(e)  {\n\nif (drawing\
  \ == true)\n\n{\n\nctx.lineTo(e.clientX + lineWidth, e.clientY + lineWidth);\n\n\
  ctx.stroke();\n\n}\n\n}\n\nfunction saveCanvas()  {\n\nvar img = drop.toDataURL(\"\
  image/png\");\n\nsave.href = img;\n\nsave.download = \"colouringBook.png\";\n\n\
  }\n\n})();\n```\n\n**注意：**\n\n你可以在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
  \ 或我个人的网站 [`www.shanehudson.net/javascript-creativity/`](http://www.shanehudson.net/javascript-creativity/)\
  \ 上，下载与本项目配套的本书完整源代码。\n\n现在，你就拥有了如图 2-3 所示的涂色书。\n\n![A978-1-4302-5945-9_2_Fig3_HTML.jpg](img/A978-1-4302-5945-9_2_Fig3_HTML.jpg)\n\
  \n**图 2-3.** 这张图展示了一张企鹅照片，它被转换为线条艺术，并使用 canvas 进行了绘制\n\n## 总结\n\n现在，你应该对动画背后的一些数学原理（如线性插值）感到自信了。你也应该感觉自己理解了\
  \ `requestAnimationFrame`，并且大体上了解了如何搭建一个动画框架。我加入了一些拖放功能，因为我发现纯粹的“画几条线”这类绘图示例很无聊。我希望这能使其内容更丰富一些，并且对你有所帮助。涂色书和\
  \ boids 的例子都有很大的改进空间（以及优化空间），我鼓励你去探索。\n\n在本章结束之际，我想让你思考一下动画，以及你通常可以用 canvas 和动画做些什么。我们生活在一个充满数据的世界里。充满噪音。无论是统计数据还是推文，都很难分辨哪些重要，哪些不重要。网络不必是线性的。以\
  \ Twitter 的时间线为例……现在想象一下这些推文以 boids 的形式呈现，它们根据作者或主题，或者也许是根据话题标签的热度来进行分组。动画并非所有场景都需要，但它们既可以作为装饰，也可以非常有用。我期待看到你的创作！\n\
  \n"
- "# 3. 音频与视频基础\n\n如果我们谈论交互性，我们就会想要使用音频和视频。多年来，我们不得不使用诸如 Flash 或 Silverlight 之类的“权宜之计”来将这些关键元素添加到网络，但现在，音频和视频直接内置于\
  \ HTML 中。在本章中，我们将深入探讨这两个元素（即 `<audio>` 和 `<video>`）的来龙去脉，以便你能毫无顾虑地使用它们。我还会向你介绍一些新技术，例如操作，我们也会涉及优化技术。在后面的章节中，我们将探索音频创作的深度，并在这个过程中创建一个媒体播放器。本章为你提供了实现这些目标所需的基础。\n\
  \n## 容器与编解码器\n\n在涉及使用音频和视频时，我们将处理各种浏览器实现和支持。每种格式通常都有一系列优点和缺点，有些经过了很好的优化，有些则拥有自由许可。因此，在我们深入探讨如何实现的具体细节之前，最好先了解一些关于容器和编解码器、它们的局限性以及它们是否获得许可的知识。\n\
  \n### 容器\n\n容器是一种文件格式，用作一系列编解码器的封装格式。你可以把容器想象成包含已用编解码器编码的音频，以及关于使用哪种编解码器的数据的文件。许多编解码器都受到多种容器的支持。\n\
  \n#### WebM\n\n`WebM` 是一个由谷歌赞助的音频-视频容器。它免版税，包含基于 Matroska 容器的 VP8 视频流和 Vorbis 音频流。它根据\
  \ BSD 许可证发布，所有用户都被授予全球性的、非独占的、免费的、免版税的专利许可。\n\n#### MP4\n\n运动图像专家组（MPEG）已经标准化了许多容器和编解码器。他们最著名的可能是\
  \ MP3 音频编解码器，但 MP4 是最常用的视频格式之一。MP4 通常使用 H.264 作为视频编解码器，使用 AAC 或 MP3 作为音频编解码器。MP4\
  \ 格式受专利限制，这导致了浏览器之间关于非免版税格式在网络上是否适用的讨论。\n\n#### QuickTime 文件格式\n\nSafari 使用 QuickTime\
  \ 来播放浏览器本身不支持的格式，例如 QuickTime 文件格式（称为 Mov）。`MP4` 基于 Mov 规范，因此支持与 `MP4` 相同的编解码器，但支持度较低，因为\
  \ `MP4` 是标准化的，而 Mov 不是。\n\n#### AVI\n\n微软于 1992 年发布了音频视频交错格式（AVI）；它是仍被广泛使用的最古老的容器格式之一（与\
  \ Mov 并列）。由于 AVI 非常古老，与更新的容器（如 `MP4` 和 `Ogg`）相比，它有很多缺点。一些缺点包括缺乏元数据和压缩。由于这些缺点，AVI\
  \ 在网络上不被原生使用，但可以与 Flash 视频播放器一起使用。\n\n#### ASF\n\n高级系统格式（ASF）是由微软专门为流媒体创建的一种容器。ASF\
  \ 通常包含 Windows Media Video (WMV) 或 Windows Media Audio (WMA)。该规范是免费提供的（就像免费啤酒一样），但受专利限制。\n\
  \n#### Ogg\n\n`Ogg` 是一种开源容器格式，由 Xiph.Org 基金会维护，并根据 BSD 许可证发布。由于其开放性，该格式受到高度赞扬，但在撰写本文时，Internet\
  \ Explorer、Safari 和许多移动浏览器都不支持它。话虽如此，通常建议将 `Ogg` 与其他格式一起使用。`Ogg` 支持许多编解码器，但通常音频使用\
  \ Vorbis，视频使用 Theora。\n\n#### Matroska\n\n另一种完全开放的容器格式是 Matroska。它是一种通用格式，旨在（在可能的情况下）支持所有编解码器。WebM\
  \ 是 Matroska 的一个子集。这使得媒体播放器（包括浏览器）可以声明它们支持 WebM，而无需完全支持 Matroska 支持的每种编解码器。\n\n\
  #### WAV\n\n波形音频文件格式（以其文件扩展名 WAV 而闻名）是一种由微软和 IBM 开发的容器。它无专利且无损。通常，WAV 用作未压缩格式，但也可以与无损脉冲编码调制（LPCM）一起用于压缩。\n\
  \n\n\n### 编解码器\n\n编解码器用于对数据进行编码，即处理原始数据流（信号）。大多数编解码器会尝试压缩原始数据，有些是有损的（意味着压缩会损失质量），另一些则是无损的。容器格式中存储的正是由编解码器生成的编码数据。\n\
  \n#### MP3\n\n这可能是最广为人知的音频格式，因此可能是一个很好的入门编解码器。`MP3` 被称为有损格式，与无损格式相对，这意味着在原始录音被压缩时，声音会损失质量。然而，它经过了良好的优化，并且由于带宽占用低，可以成为网络音频的不错选择。`MP3`\
  \ 最大的缺点是它受专利保护，这意味着许多人（尤其是过去曾拒绝支持该格式直至 Firefox 21 的 Mozilla）反对使用该格式，转而选择使用免费开放的格式。\n\
  \n#### Vorbis\n\n`Vorbis` 是最受欢迎的开源、无专利音频编解码器，受到许多浏览器的支持。它通常被称为 `Ogg Vorbis`，尽管 `Ogg`\
  \ 是一个容器，`Vorbis` 常与它一起使用，而非该格式本身的名称。`Vorbis` 有许多其他容器，但通常使用的容器是 `Ogg`、`QuickTime\
  \ MOV` 或 `WebM`。\n\n#### AAC\n\n`高级音频编码` (`AAC`) 特别有趣，因为它常与 `H.264` 配合提供音频，并且是 `3GP`（常用于移动设备）容器中使用的主要音频编解码器（`AMR`\
  \ 除外）。`AAC` 受到大多数浏览器的支持（除 OSX 上的 Opera 和 Firefox，以及某些 Linux 发行版外，原因在于许可协议）。\n\n\
  #### AC-3\n\n`AC-3` 是由杜比实验室创建的音频编解码器，通常被称为 `杜比数字`。它很少用于网络，但广泛应用于高清电影。\n\n#### H.264\n\
  \n`H.264` 是由视频编码专家组 (`VCEG`) 和动态图像专家组开发的视频编解码器。该编解码器用于蓝光光盘，在网络上也十分流行，因为浏览器支持度良好（由于许可问题，除\
  \ Opera 外的所有浏览器在可能的情况下都支持 `H.264`）。思科发布了一个开源的 `H.264` 实现，试图解决许可问题。\n\n#### VP8\n\
  \n这是 `WebM` 中用于视频的编解码器。它归谷歌所有，但谷歌已做出不可撤销的专利承诺，允许任何人实现 `VP8`。\n\n#### Theora\n\n\
  基于 `VP3`（`VP8` 的前身），`Theora` 是一种开源的、有损视频编解码器，由 Xiph.Org 基金会维护。它常与 `Ogg` 容器格式一起用于网络。\n\
  \n### 编码视频\n\n现在，你可能想知道如何编码视频。遗憾的是，浏览器无法自动完成此操作，因此你需要使用转换器。市面上有很多转换器，但最流行的似乎是 `Handbrake`\
  \ 和 `Miro`。我个人使用 `Miro`，因为它设计精良、简单易用且开源。`Miro` 可在 [`www.mirovideoconverter.com`](http://www.mirovideoconverter.com/)\
  \ 获取。\n\n### 浏览器兼容性\n\n在撰写本文时，Firefox 尚未添加对 `MP3` 的支持，而 Internet Explorer 和 Safari\
  \ 都不支持 `OGG` 或 `WebM`。移动端的支持则更加缺乏。\n\n与 `<audio>` 类似，我们可以使用相当多的编解码器和容器。Chrome 和\
  \ Firefox 都致力于 `WebM`，尽管 Internet Explorer 和 Safari 不支持它。一些旧版本的浏览器会支持某些格式，但不支持 `WebM`，因此同时使用\
  \ `OGG` 和 `MP4` 是值得的。之前我提到过，`Vorbis` 常被称为 `OGG Vorbis`，对于视频，我们使用 `OGG` 容器，其中音频采用\
  \ `Vorbis`，视频采用 `Theora`。由于前面描述的专利原因，`OGG` 和 `WebM` 都优先于 `MP4`。要了解浏览器支持的最新状态，请查看\
  \ [`www.docs.webplatform.org/wiki/html/elements/audio`](http://www.docs.webplatform.org/wiki/html/elements/audio)。\n\
  \n## 使用 `<audio>` 和 `<video>` 元素\n\n现在我们已经了解了容器、编解码器以及可能遇到的文件，我们可以看看如何将它们应用到我们的网页中。\n\
  \n注意\n\n本章使用的音频来自 [`www.incompetech.com/music/royalty-free`](http://www.incompetech.com/music/royalty-free)，视频来自\
  \ [`www.bigbuckbunny.com`](http://www.bigbuckbunny.com/)。\n\n### `<audio>`\n\n让我们从音频元素开始，这是我们在现代浏览器中用来听声音的。这个声音可以是任何东西，从播客到音乐。在开始之前，我需要强调一点——请谨慎使用。不要在用户加载网站时突然播放声音。当\
  \ Flash 能做到这一点时，我们就讨厌它，现在依然如此。在最基本的形式中，`audio` 元素可以像 `img` 元素一样接受一个 `src` 属性：\n\n\
  `<audio src=\"audio.mp3\" >`\n\n只需将此代码添加到你的 HTML 文档中即可。这样做的缺点是我们无法提供一个文件列表，因为我们需要根据浏览器兼容性提供不同的音频编解码器。为了解决这个问题，我们使用嵌套在\
  \ `<audio>` 中的 `<source>` 元素。这个元素允许你提供不同的文件，并让浏览器自动选择最佳方案。它像往常一样接受 `src` 属性，以及 `type`\
  \ 属性。在 `type` 属性中，我们给出 MIME 类型（可能如你所料），这需要包括容器作为主类型，并在分号后包含编解码器。如果你认为有必要针对旧版浏览器，你也可以在\
  \ `source` 元素旁边提供 Flash 备选方案。以下是一个例子，音频文件可以在上面链接的 Incompetech 网站上找到，也可以在本书的下载文件中找到：\n\
  \n```\n<audio>\n   <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n  \
  \ <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\n由于浏览器有一个用来选择源的算法，因此源的顺序和数量都不是问题。目前大多数人只使用\
  \ `Vorbis` 和 `MP3`，但随着时间的推移，这种情况可能会改变。`WebM` 容器格式很可能会比 `Ogg` 容器格式更受欢迎，因为许多浏览器供应商正大力将其推行为专为网络设计的开放视频格式。同样值得注意的是，`WebM`\
  \ 正在与一种名为 `WebP` 的图像格式一同开发。\n\n### `<video>`\n\n视频元素 (`<video>`) 的实现方式与 `<audio>`\
  \ 类似。与 `<audio>` 一样，你可以只指定一个视频文件，也可以使用 `<source>` 指定多个文件：\n\n```\n<video>\n    <source\
  \ src='../video.ogv' type='video/ogg;'>\n    <source src='../video.mp4' type='video/mp4'>\n\
  \    <source src='../video.webm' type='video/webm'>\n</video>\n```\n\n同样，与音频类似，浏览器会根据浏览器和操作系统的能力，通过算法选择源。拥有多个源且顺序任意都是没有问题的。示例中的三种格式：`Ogg`、`MP4`\
  \ 和 `WebM`，是撰写本文时支持度最好的。\n\n## 属性和属性特性\n\n那么，现在我们知道了如何在 HTML 文档中实现音频和视频，让我们来看看这些元素可用的属性和属性特性。`audio`\
  \ 和 `video` 元素之间有很多重叠之处，大多数属性适用于两者，因此我将一起解释，而不是分章节说明。\n\n\n\n### 控件\n\n好了，现在我们的页面上有了音频——但我们可以做得更多。目前浏览器可以选择要播放的文件，但我们无法告诉它开始播放。当我们想用\
  \ JavaScript 来控制音频或视频时，它当前的状态很有用，但理想情况下，它应该有一个媒体播放器。大多数浏览器都有内置播放器，只需在元素中添加 `controls`\
  \ 即可触发。就像这样：\n\n```\n<audio controls>\n  <source src='audio.ogg' type='audio/ogg;\
  \ codecs=vorbis'>\n  <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\
  \n同样，对于视频，我们会使用以下代码：\n\n```\n<video controls>\n  <source src='../video.ogv' type='video/ogg;'>\n\
  \  <source src='../video.mp4' type='video/mp4'>\n  <source src='../video.webm' type='video/webm'>\n\
  </video>\n```\n\n如果你在浏览器中运行这段代码，现在应该会看到一个基本的音频（或视频）播放器。如果你想提供自定义播放器以配合网站的样式，那么最好的方法可能是自己创建\
  \ DOM 元素并按需设置样式，然后将其挂载到一个未启用 `controls` 的 `<audio>`/`<video>` 元素上。\n\n**注意**\n\n\
  有些浏览器使用 Shadow DOM，因此理论上你可以用 CSS 设置默认控件的样式，但在撰写本文时，每个浏览器的实现都大相径庭，而且 Shadow DOM 仍处于初期阶段。我建议查看\
  \ [www.caniuse.com](http://www.caniuse.com/) 了解当前各浏览器的实现状态。\n\n### 自动播放\n\n有时你可能有正当理由希望音频或视频自动播放。虽然这种做法通常不讨喜，但实现起来很简单。与\
  \ `controls` 类似，你只需在元素中添加 `autoplay` 属性即可。你也可以使用 JavaScript 通过 `element.autoplay\
  \ = true` 来设置，就像这样：\n\n```\n<audio autoplay>\n  <source src='audio.ogg' type='audio/ogg;\
  \ codecs=vorbis'>\n  <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\
  \n视频的工作方式也大致相同：\n\n```\n<video autoplay>\n  <source src='../video.ogv' type='video/ogg;'>\n\
  \  <source src='../video.mp4' type='video/mp4'>\n  <source src='../video.webm' type='video/webm'>\n\
  </video>\n```\n\n### 预加载\n\n与前两个属性相比，`preload` 的作用不太明显，它用于在页面加载时尝试加载整个音频或视频文件，或者仅加载元数据（如时长）；这取决于属性的值。如果未设置\
  \ `preload`，则由浏览器决定（默认值通常是 `metadata`）。话虽如此，即使设置了该属性，它也只是个提示，浏览器会根据不同浏览器之间变化的多种条件，将其作为首选考虑。\n\
  \n`preload` 有三个可接受的值。分别是：\n\n- `auto`：如果条件合适，则让浏览器优先处理。例如，如果连接状况良好，它可能会尝试下载整个文件。当\
  \ `preload` 设置为 `auto` 时，`readyState` 变量会从 0（未下载任何内容）递增到 4（可无中断播放），一个完全预加载的文件的 `readyState`\
  \ 为 4。\n- `metadata`：这是最常用的值，因为它是一种“折中方案”。它基本上让浏览器知道，了解文件信息（例如时长）会很好，但在用户点击播放之前，不需要整个文件。当\
  \ `preload` 设置为 `metadata` 时，一旦元数据下载完成，`readyState` 将被设置为 1（拥有元数据），并且可能根据获取的积极程度变为\
  \ 2 或 3。\n- `none`：通过告诉浏览器在用户点击播放之前不需要任何信息，来减轻服务器压力。当然，正如我之前所说，这只是一个提示，因此浏览器可能仍会决定提供元数据或整个文件。\n\
  \n该属性的工作方式与其他示例类似，对于音频：\n\n```\n<audio preload='metadata'>\n  <source src='audio.ogg'\
  \ type='audio/ogg; codecs=vorbis'>\n  <source src='audio.mp3' type='audio/mpeg'>\n\
  </audio>\n```\n\n对于视频：\n\n```\n<video preload='metadata'>\n  <source src='../video.ogv'\
  \ type='video/ogg;'>\n  <source src='../video.mp4' type='video/mp4'>\n  <source\
  \ src='../video.webm' type='video/webm'>\n</video>\n```\n\n**注意**\n\n该属性在大多数浏览器中支持良好，但基于\
  \ Presto 的 Opera 浏览器除外，它们使用的是旧的名称 `autobuffer`。\n\n### 循环\n\n这是一个强制音频或视频文件在播放完毕后从头开始循环的属性。它可以作为属性（直接在\
  \ HTML 中设置）或属性（通过 JavaScript 设置）来使用。将 `loop` 作为属性使用，你可以检查当前状态（是 `true` 还是 `false`）。\n\
  \n```\n<audio loop>\n  <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n\
  \  <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\n视频也可以这样做：\n\n```\n\
  <video loop>\n  <source src='../video.ogv' type='video/ogg;'>\n  <source src='../video.mp4'\
  \ type='video/mp4'>\n  <source src='../video.webm' type='video/webm'>\n</video>\n\
  ```\n\n### 已播放部分\n\n你通常需要知道媒体的哪些部分已被播放，尤其是在创建媒体播放器或某种广告时。`Played` 是一个属性，可以与 JavaScript\
  \ 一起使用来获取一个 `TimeRanges` 对象，该对象包含已播放的每个片段的开始和结束时间。例如，如果我听了开头大约 20 秒，那么调用 `ele.played.start(0)`\
  \ 将返回 0，因为这是开头，而 `ele.played.end(0)` 将返回 20；参数是索引，因此 0 表示第一个收听的片段，1 表示第二个。你可以使用\
  \ `ele.played.length` 来查找已收听的独立片段的数量。\n\n```\nvar ele = document.querySelector('audio');\n\
  \nfunction log() {\n  for (var i = 0; i < ele.played.length; i++)\n  {\n      console.log(\"\
  片段 \" + i);\n      console.log(\"  开始: \" + ele.played.start(i));\n      console.log(\"\
  \  结束: \" + ele.played.end(i));\n  }\n}\n```\n\n要将其改为适用于视频，你只需选择视频而不是音频：\n\n```\n\
  var ele = document.querySelector('video');\n```\n\n在这个例子中，如果你从控制台运行 `log()`，那么你将看到你已播放的音频或视频的每个片段，以及以秒为单位的开始和结束时间。除了纯粹的演示或调试目的之外，`played`\
  \ 属性在媒体播放器中很有用，它可以让用户看到他们已经听过的部分。\n\n### 缓冲\n\n与 `played` 类似，我们可以获取一个代表文件中已缓冲部分的\
  \ `TimeRanges` 对象。在制作媒体播放器时（我们将在后续章节中实现），了解文件的缓冲部分很有帮助，我们可以不使用 `controls` 属性，而是创建显示音频文件缓冲区域的自定义控件。与\
  \ `played` 不同，`buffered` 可能有多个索引，例如，如果用户移动了播放头。\n\n```\nvar ele = document.querySelector('audio');\n\
  // 或： var ele = document.querySelector('video');\n\nfunction log() {\n    for (var\
  \ i = 0; i < ele.buffered.length; i++)\n    {\n      console.log(\"片段 \" + i);\n\
  \      console.log(\"  开始: \" + ele.buffered.start(i));\n      console.log(\"  结束:\
  \ \" + ele.buffered.end(i));\n    }\n}\n```\n\n\n\n### 时长\n\n要获取音频或视频文件的长度，我们可以使用\
  \ `duration` 属性，它以秒为单位返回持续时间。如果音频或视频元素正在流式传输文件，那么除非流式传输停止，否则持续时间将被设置为无穷大（具体来说，根据规范，是正无穷大）。在这种情况下，持续时间将返回已流式传输内容的长度（以秒为单位）。如果持续时间发生变化（例如在流式传输的情况下），则会触发\
  \ `durationchange` 事件，您可以使用事件监听器来触发样式或 DOM 更改，以让用户知道文件已停止流式传输。\n\n```\nvar ele =\
  \ document.querySelector('audio');\n\n// 或者：var ele = document.querySelector('video');\n\
  \nconsole.log(ele.duration);\n```\n\n### 音量\n\n`volume` 属性可用于获取和设置音量；它通过 0.0 到 1.0\
  \ 之间的数字进行控制。默认情况下，初始音量为 1.0，这是浏览器允许的最大值（不一定是扬声器的最大值）。音量只是一个设置/获取属性，使得访问和修改音量变得容易：\n\
  \n```\nvar ele = document.querySelector('audio');\n\n// 或者：var ele = document.querySelector('video');\n\
  \nvar vol = 0.5; // 您想要设置的目标音量\n\nconsole.log(ele.volume);\n\nele.volume = vol;\n\
  \nconsole.log(ele.volume);\n```\n\n### 播放速率\n\n`playbackrate` 是音频/视频播放的速度。原始速度为\
  \ 1.0，该速率是初始速度的倍数。例如，如果您将 `playbackrate` 更改为 0.5，那么音频或视频将以慢动作播放。另一方面，如果您将速率更改为 1.5，音频或视频将会快进。\n\
  \n```\nvar ele = document.querySelector('audio');\n\n// 或者：var ele = document.querySelector('video');\n\
  \nfunction slowMotion()  {\n    ele.playbackrate = 0.5;\n}\n\nfunction fastForward()\
  \  {\n    ele.playbackrate = 1.5;\n}\n```\n\n### 网络状态\n\n此属性用于确定网络活动。它返回 0 到 3 之间的\
  \ 4 个数字，对应以下状态：\n\n- `0. NETWORK_EMPTY` – 表示元素尚未初始化。\n- `1. NETWORK_IDLE` – 表示已选择正确的音频/视频文件，但当前未使用网络。\n\
  - `2. NETWORK_LOADING` – 正在下载音频/视频。\n- `3. NETWORK_NO_SOURCE` – 要么给定的文件都不兼容，要么没有提供文件。\n\
  \n与许多前面的属性不同，`networkState` 是一个只读属性。此代码展示了如何使用它：\n\n```\nvar ele = document.querySelector('audio');\n\
  \n// 或者：var ele = document.querySelector('video');\n\nfunction logNetworkState()\
  \  {\n    console.log(ele.networkState);\n}\n```\n\n## Web 音频 API\n\n接下来让我们深入音频分析的领域，我们将在后面的章节中利用它来创建音频的可视化效果。为此，我们将使用\
  \ Web 音频 API。\n\n该 API 基于节点的概念，每个节点接收当前的音频（可以是原始版本，也可以是已经经过任意数量节点处理后的音频），然后对其进行处理。我说“处理”是为了故意模糊其定义，节点可以按照您希望的任何方式进行编码。一些默认用途包括：声道分离与合并、振荡和增益控制。我特别喜欢的一个类比是\
  \ Stuart Memo 在他的《Web 音频 API 简介》文章中提出的，他解释了 API 节点的工作原理就像给吉他添加失真效果器和放大器一样，您可以移除任何一个节点或添加新节点，而无需做任何其他事情，只需改变连接线即可。目前，我们只打算使用\
  \ `AnalyserNode` 来精确查看音频内部的情况。然后，我们将开始使用其他节点来理解发生了什么变化。\n\n### 分析音频\n\n首先，我们需要创建一个音频上下文和一个分析器，然后将它们连接起来。上下文是一个接口，可以访问音频的所有属性，以及用于创建和连接节点的方法。\n\
  \n```\nvar ele = document.querySelector('audio');\n\nvar ctx = new AudioContext();\n\
  \nvar analyser = ctx.createAnalyser();\n\nvar source = ctx.createMediaElementSource(ele);\n\
  \nsource.connect(analyser);\n\nanalyser.connect(ctx.destination);\n```\n\n您会注意到我在一个“源”变量中使用了\
  \ `createMediaElementSource`。这只是将来自 `<audio>` 元素的音频重新路由到 API 中。这意味着您现在通过该元素播放的音频将受\
  \ API 上下文图（节点相互连接的方式）控制并被用作其中的一个节点。这也意味着，是 Web 音频 API 而不是元素本身在控制音量和其它属性（除了控制音乐的播放时间）。因此，如果您仍然想使用元素控件，则需要使用一个\
  \ `GainNode` 将其连接起来，如下所示：\n\n```\nvar ele = document.querySelector('audio');\n\n\
  var ctx = new AudioContext();\n\nvar analyser = ctx.createAnalyser();\n\nvar source\
  \ = ctx.createMediaElementSource(ele);\n\nvar volumeControl = ctx.createGainNode();\n\
  \nsource.connect(volumeControl);\n\nvolumeControl.connect(analyser);\n\nanalyser.connect(ctx.destination);\n\
  \nele.addEventListener('onvolumechange', volumeControl, false);\n\nfunction volumeChange()\
  \  {\n    volumeControl.gain.value = ele.volume;\n}\n\nfunction log()  {\n    freqData\
  \ = new Uint8Array(analyser.frequencyBinCount);\n    analyser.getByteFrequencyData(freqData);\n\
  \    console.log(freqData);\n}\n```\n\n注意\n\n在编写本文时，`onvolumechange` 事件不能作为动态事件监听器工作，因此您需要在\
  \ `<audio>` 元素上包含 `onvolumechange=\"volumeChange();\"`。\n\n现在回到分析器。这个节点让我们能够访问快速傅里叶变换（FFT）的数据，这是一种用于多种用途（包括音频分析）的复杂算法。有两种可用的数据类型：频域数据和时域数据。可以使用\
  \ `getFloatFrequencyData` 或 `getByteFrequencyData` 获取频率数据（取决于您想要的数据类型，我们将使用第二种方法将数据存储在字节数组中），这两种方法都返回一个归一化频率的数组。之所以有两种方法，是因为浮点数组的分辨率（即精度）远高于字节数组。由于归一化的方式，我们需要遍历数组的每个索引，并将其乘以采样率除以\
  \ FFT 的大小。要查看结果，我们将其记录到控制台：\n\n```\nfunction log()  {\n    freqData = new Uint8Array(analyser.frequencyBinCount);\n\
  \    analyser.getByteFrequencyData(freqData);\n    for (var i = 0; i < freqData.length;\
  \ i++) {\n        console.log(freqData[i] * ctx.sampleRate / analyser.fftSize);\n\
  \    }\n}\n```\n\n您现在应该会看到各种数字，这些数字取决于您正在播放的音频。每个数字代表一个频率（440Hz 是最容易记住的频率，这是中央 C\
  \ 上方的 A 音），我们将在后面的章节中更详细地介绍（届时我会介绍一些音乐理论）。现在，只需查看这些数据并思考您可以用它做些什么（甚至可以尝试实现它们）。当然，一串看似随机的数字对任何人都没有意义，可视化是理解任何类型数据的关键，因此我们现在将使用前一章学到的知识来创建可视化音乐播放的二维图形。\n\
  \n\n\n### 频率可视化\n\n我们可以用整本书来制作看起来很棒但不太实用的有趣游戏或随机动画；相反，让我们来看看将 Web Audio API 和 canvas\
  \ 结合使用时，我们能制作出什么样的工具。这个示例将展示频率可视化，下一个示例将是声谱图。首先，我们使用 `getByteFrequencyData` 的原始输出来创建一个简单的条形图风格的可视化效果，展示归一化后的频率（由于数值上限为\
  \ 255，这使其易于绘图）。为此，我们需要设置变量来引用音频和 canvas 元素，以及它们各自的上下文和一个分析器节点。我还建议像之前一样设置音量控制，这样你就能看到可视化效果如何随音量变化（同时也方便你调低音量！），我觉得这相当有趣。对于节点，我们需要将音频源连接到音量节点，音量节点再连接到分析器，最后输出到扬声器（目标设备）。\n\
  \n```\nvar audioEle = document.querySelector('audio');\nvar audioCtx = new AudioContext();\n\
  var canvasEle = document.querySelector('canvas');\nvar canvasCtx = canvasEle.getContext('2d');\n\
  var analyser = audioCtx.createAnalyser();\nvar source = audioCtx.createMediaElementSource(audioEle);\n\
  var volumeControl = audioCtx.createGainNode();\nsource.connect(volumeControl);\n\
  volumeControl.connect(analyser);\nanalyser.connect(audioCtx.destination);\n```\n\
  \n现在，我们需要在之前使用的 `volumeChange` 函数旁边，添加 `logic` 和 `draw` 两个函数。在 `logic` 函数中，我们只需获取频率数据并将其传递给\
  \ `draw` 函数，由它绘制到 canvas 上。我认为使用细线进行可视化效果不错，但你可以通过修改 x 位置（我选择了 `i` 表示当前频率，这意味着它们彼此相邻）和宽度（我保持为\
  \ 1 以保持细线）来改变。当然，你需要记得调用 `logic`，为此我使用了 `setInterval`。\n\n```\nfunction volumeChange()\
  \  {\n  volumeControl.gain.value = audioEle.volume;\n}\n\nfunction logic()  {\n\
  \  var freqData = new Uint8Array(analyser.frequencyBinCount);\n  analyser.getByteFrequencyData(freqData);\n\
  \n  requestAnimationFrame(function() {\n    draw(freqData);\n  });\n}\n\nfunction\
  \ draw(freqData)  {\n  canvasCtx.clearRect(0, 0, canvasEle.width, canvasEle.height);\n\
  \  canvasCtx.fillStyle = \"#ff0000\";\n  for (var i = 0; i < freqData.length; i++)\
  \ {\n    canvasCtx.fillRect(i, canvasEle.height, 1, canvasEle.height - freqData[i]);\n\
  \  }\n}\n\nsetInterval(logic, 1000/60);\n```\n\n图 3-1 展示了音频播放时频率可视化的结果。\n\n![A978-1-4302-5945-9_3_Fig1_HTML.jpg](img/A978-1-4302-5945-9_3_Fig1_HTML.jpg)\n\
  \n图 3-1.\n\n这是频率可视化效果\n\n> **注意**  \n> 你可能会看到一面红色；这很可能是由于音量被静音了。调高音量以获得正确的可视化效果。\n\
  \n这些内容应该都很好理解，因为我们已经讲解过每一个概念，比如音频处理节点和 canvas 绘制。你可以在清单 3-1 以及本书附带的文件中找到这段代码。\n\n\
  ### 清单 3-1. 频率可视化代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Chapter 3 –\
  \ Frequency Visualisation</title>\n</head>\n<body>\n<audio controls onvolumechange=\"\
  volumeChange();\">\n<source src='../audio.ogg' type='audio/ogg; codecs=vorbis'>\n\
  <source src='../audio.mp3' type='audio/mpeg'>\n</audio>\n<canvas>Canvas is not supported\
  \ by your browser</canvas>\n<script src=\"script.js\"></script>\n</body>\n</html>\n\
  \n// Pollyfill for AudioContext\n(function() {\n  window.AudioContext = window.AudioContext\
  \ || window.webkitAudioContext;\n  var requestAnimationFrame = window.requestAnimationFrame\
  \ || window.mozRequestAnimationFrame ||\n    window.webkitRequestAnimationFrame\
  \ || window.msRequestAnimationFrame;\n  window.requestAnimationFrame = requestAnimationFrame;\n\
  })();\n\nvar audioEle = document.querySelector('audio');\nvar audioCtx = new AudioContext();\n\
  var canvasEle = document.querySelector('canvas');\nvar canvasCtx = canvasEle.getContext('2d');\n\
  var analyser = audioCtx.createAnalyser();\nvar source = audioCtx.createMediaElementSource(audioEle);\n\
  var volumeControl = audioCtx.createGainNode();\n\nsource.connect(volumeControl);\n\
  volumeControl.connect(analyser);\nanalyser.connect(audioCtx.destination);\n\n//audioEle.addEventListener('onvolumechange',\
  \ volumeControl, false);\n\nfunction volumeChange()  {\n  volumeControl.gain.value\
  \ = audioEle.volume;\n}\n\nfunction logic()  {\n  var freqData = new Uint8Array(analyser.frequencyBinCount);\n\
  \  analyser.getByteFrequencyData(freqData);\n\n  requestAnimationFrame(function()\
  \ {\n    draw(freqData);\n  });\n}\n\nfunction draw(freqData)  {\n  canvasCtx.clearRect(0,\
  \ 0, canvasEle.width, canvasEle.height);\n  canvasCtx.fillStyle = \"#ff0000\";\n\
  \  for (var i = 0; i < freqData.length; i++) {\n    canvasCtx.fillRect(i, canvasEle.height,\
  \ 1, canvasEle.height - freqData[i]);\n  }\n}\n\nsetInterval(logic, 1000/60);\n\
  ```\n\n\n\n### 声谱图\n\n通过之前的可视化方式，你可以轻松看到音频的频率及其变化方式，但这仅限于在任意给定时刻。现在我们要使用声谱图，它能展示音频随时间的变化过程，其中\
  \ x 轴代表时间，y 轴代表音频部分，颜色代表频率。这种技术用途广泛，小到呈现优美图案，大到实现语音识别。由于声谱图与之前的可视化方式类似，只是多了一个时间维度，我们不妨基于现有代码进行开发。这里我要介绍一个新事件：`onaudioprocess`。该事件属于`JavaScriptNode`，使用下面这行代码创建：\n\
  \n```\nvar logger = audioCtx.createJavaScriptNode(analyser.frequencyBinCount, 1,\
  \ 1);\n```\n\n`onaudioprocess`事件与音频播放速度同步运行，使其成为音频逻辑中`setInterval`的完美替代方案（类似我们使用`requestAnimationFrame`以更精确、动态的速度进行动画渲染）。我们还需要创建一个名为`x`的变量来保存当前的时间位置，以便知道需要绘制多少次才能到达当前位置。\n\
  \n```\nvar logger = audioCtx.createJavaScriptNode(analyser.frequencyBinCount, 1,\
  \ 1);\n\nlogger.onaudioprocess = function () {\n  logic();\n}\n\nvar x = 0;\n\n\
  function logic() {\n  if(!audioEle.paused) {\n    x += 1;\n    var freqData = new\
  \ Uint8Array(analyser.frequencyBinCount);\n    analyser.getByteFrequencyData(freqData);\n\
  \    requestAnimationFrame(function() {\n      draw(freqData);\n    });\n  }\n}\n\
  ```\n\n以下是相关代码，你可以看到它与我们之前的代码非常相似，只是使用了`onaudioprocess`并检查元素是否暂停。这两个改进点都可以应用于之前的代码；我只是不想一次性把所有内容都塞进去。现在我们只需要绘制可视化图形！但从何开始呢？简单——我们首先明确要做什么。在这个案例中，我们希望绘制单个列，每个像素代表标准化后的频率（以颜色表示）。为此，我们将使用\
  \ HSL 而非 RGB，因为 HSL 允许我们将色相设置为 0 到 255 之间的数值（这正是`getByteFrequencyData`返回的值），而无需指定每种颜色。每在画布上绘制完一列，我就会清空并从起点继续绘制，如同翻新一页。你可能想通过滑动而不是清空的方式来改进此功能。\n\
  \n```\nfunction draw(freqData) {\n  if (x > canvasEle.width) {\n    canvasCtx.clearRect(0,\
  \ 0, canvasEle.width, canvasEle.height);\n    x = 0;\n  }\n  for (var i = 0; i <\
  \ freqData.length; i++) {\n    canvasCtx.fillStyle = \"hsl(\" + freqData[i] + \"\
  ,100%, 50%)\";\n    canvasCtx.fillRect(x, canvasEle.height - i, 1, 1);\n  }\n}\n\
  ```\n\n现在你应该已经理解如何利用频率数据生成各种可视化效果了，而且这些效果并非仅仅是装饰性的。图 3-2 展示了播放一些音频后声谱图的外观。完整代码一如既往地可以在本书的下载资料中找到。\n\
  \n![A978-1-4302-5945-9_3_Fig2_HTML.jpg](img/A978-1-4302-5945-9_3_Fig2_HTML.jpg)\n\
  \n**图 3-2.** 声谱图展示\n\n> **注意** 与之前的示例一样，你可能会看到一片红色；这很可能是因为音量被静音了。请调高音量以获取正确的可视化效果。\n\
  \n清单 3-2 展示了声谱图所需的完整代码，同样可以在本书的下载资料中找到。\n\n**清单 3-2. 声谱图代码**\n\n```\n<!DOCTYPE html>\n\
  <html>\n<head>\n<title>Chapter 3 - Spectrogram</title>\n</head>\n<body>\n<audio\
  \ controls onvolumechange=\"volumeChange();\">\n<source src='../audio.ogg' type='audio/ogg;\
  \ codecs=vorbis'>\n<source src='../audio.mp3' type='audio/mpeg'>\n</audio>\n<canvas>Canvas\
  \ is not supported by your browser</canvas>\n<script src=\"script.js\"></script>\n\
  </body>\n</html>\n\n// Pollyfill for AudioContext\n(function() {\n  window.AudioContext\
  \ = window.AudioContext || window.webkitAudioContext || window.mozAudioContext;\n\
  \  var requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame\
  \ ||\n  window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;\n\
  \  window.requestAnimationFrame = requestAnimationFrame;\n})();\n\nvar audioEle\
  \ = document.querySelector('audio');\nvar audioCtx = new AudioContext();\nvar canvasEle\
  \ = document.querySelector('canvas');\nvar canvasCtx = canvasEle.getContext('2d');\n\
  var analyser = audioCtx.createAnalyser();\nanalyser.smoothingTimeConstant = 0;\n\
  var logger = audioCtx.createJavaScriptNode(analyser.frequencyBinCount, 1, 1);\n\
  var source = audioCtx.createMediaElementSource(audioEle);\nvar volumeControl = audioCtx.createGainNode();\n\
  source.connect(volumeControl);\nvolumeControl.connect(analyser);\nanalyser.connect(audioCtx.destination);\n\
  logger.connect(audioCtx.destination);\n//audioEle.addEventListener('onvolumechange',\
  \ volumeControl, false);\nlogger.onaudioprocess = function () {\n  logic();\n}\n\
  function volumeChange() {\n  volumeControl.gain.value = audioEle.volume;\n}\nvar\
  \ x = 0;\nfunction logic() {\n  if(!audioEle.paused) {\n    x += 1;\n    var freqData\
  \ = new Uint8Array(analyser.frequencyBinCount);\n    analyser.getByteFrequencyData(freqData);\n\
  \    requestAnimationFrame(function() {\n      draw(freqData);\n    });\n  }\n}\n\
  function draw(freqData) {\n  if (x > canvasEle.width) {\n    canvasCtx.clearRect(0,\
  \ 0, canvasEle.width, canvasEle.height);\n    x = 0;\n  }\n  for (var i = 0; i <\
  \ freqData.length; i++) {\n    canvasCtx.fillStyle = \"hsl(\" + freqData[i] + \"\
  ,100%, 50%)\";\n    canvasCtx.fillRect(x, canvasEle.height - i, 1, 1);\n  }\n}\n\
  ```\n\n### Web Audio API 节点\n\n我们已经使用过几个 Web Audio API 节点，例如`MediaElementSource`、`GainNode`和`Analyser`。以下是其他可用节点和方法的概述。\n\
  \n| 节点名称 | 描述 |\n| --- | --- |\n| `AnalyserNode` | 获取音频当前状态的数据，例如频率。 |\n| `AudioBufferSourceNode`\
  \ | 缓冲短音频资源，用作临时但易于访问的存储。 |\n| `BiquadFilterNode` | 处理基本滤波器（即低级滤波器），例如低通/高通滤波器，用于截断低于或高于给定值的频率。\
  \ |\n| `ChannelSplitterNode` | 分离每个声道，以便在处理图中单独使用它们进行更精细的控制。 |\n| `ChannelMergerNode`\
  \ | 使用此合并节点合并已分离（或需要合并）的任何声道。 |\n| `ConvolverNode` | 应用线性卷积效果，通过模拟声学空间或高质量效果来操控声音。\
  \ |\n| `DelayNode` | 将输出（到处理图中的下一个节点）延迟特定时间量。 |\n| `GainNode` | 通过将音频乘以增益属性来改变音频音量。\
  \ |\n| `MediaElementAudioSourceNode` | 允许你将媒体元素连接到 Web Audio API。 |\n| `PannerNode`\
  \ | 在三维空间中定位声音。这通常大量用于游戏中，但在其他场景也可能有用。 |\n| `WaveShaperNode` | 用于非线性失真。 |\n\n\n\n\
  ## 处理视频\n\n遗憾的是，目前并没有类似 Web Audio API 那样专门用于视频的 API，因此你需要自行处理视频。当然，以分析音频的方式分析视频，远比使用\
  \ Web Audio API 要困难得多。不过，创建一个基础滤镜并非难事。为了避免陷入复杂的数学运算，我将介绍一个简单的反色滤镜。本章不会涉及复杂滤镜，因为第\
  \ 9 章和第 10 章将在此基础上，利用实时视频中的物体检测作为输入，来控制我们将在第 5 章创建的键盘。\n\n反色滤镜的原理是：遍历每一个像素，用 255\
  \ 减去该颜色的当前值，从而将其反转。处理后的结果会被绘制到画布上并显示出来。在这个示例中，我会同时显示画布和视频元素，但你也可以选择完全隐藏视频元素。\n\n\
  > **注意：** 由于跨域资源共享策略的限制，你可能需要在服务器（或 `localhost`）上运行此示例。\n\n我们照常先设置元素和上下文的变量。完成后，即可开始编写处理视频源的函数。首先，需要将视频的当前帧绘制到画布上。\n\
  \n```javascript\nvar canvasEle = document.querySelector('canvas');\nvar canvasCtx\
  \ = canvasEle.getContext('2d');\nvar videoEle = document.querySelector('video');\n\
  var w = videoEle.clientWidth;\nvar h = videoEle.clientHeight;\ncanvasEle.width =\
  \ w;\ncanvasEle.height = h;\n```\n\n然后，我们需要获取图像数据并遍历每个像素（记住，每个像素由 RGBA 四个独立的值组成）。如前所述，我们用\
  \ 255 减去当前值来进行反色处理。完成后，将图像数据放回，并使用 `requestAnimationFrame` 再次调用绘制函数。\n\n```javascript\n\
  drawInvertedFrame();\n\nfunction drawInvertedFrame() {\n    canvasCtx.drawImage(videoEle,\
  \ 0, 0, w, h);\n    var manip = canvasCtx.getImageData(0, 0, w, h);\n    var data\
  \ = manip.data;\n    // 遍历每个像素，进行反色处理\n    for (var i = 0; i < data.length; i +=\
  \ 4) {\n        var r = data[i],\n            g = data[i+1],\n            b = data[i+2];\n\
  \        data[i] = 255 - r;\n        data[i+1] = 255 - g;\n        data[i+2] = 255\
  \ - b;\n    }\n    canvasCtx.putImageData(manip, 0, 0);\n    requestAnimationFrame(drawInvertedFrame);\n\
  }\n```\n\n下图（图 3-3）展示了反色视频与原始视频的实时对比效果。\n\n![A978-1-4302-5945-9_3_Fig3_HTML.jpg](img/A978-1-4302-5945-9_3_Fig3_HTML.jpg)\n\
  \n**图 3-3.** 该图展示了视频上应用反色滤镜的效果，并与原始视频进行了对比\n\n与往常一样，完整的代码清单可在本书配套的下载文件中找到。\n\n##\
  \ 本章小结\n\n本章让你探索了网络中的音频和视频。你现在应该对各种可用的编解码器及其优缺点有了扎实的理解。我也尝试深入探讨了 Web Audio API。我希望通过将它与前一章的可视化内容（而不是给你一堆数字）相结合，能够帮助你理解它，并发现它更有用。\n\
  \n我鼓励你多尝试 Web Audio API 以及视频处理——你可以创造出许多非常有趣的效果，这些效果在一般的网页设计和开发中可能会很有用（尤其是作为视觉辅助和精致的细节）。除了简单的网站，还有许多空间可以开发更像网络应用的东西，比如我们即将创建的媒体播放器。\n\
  \n"
- "# 3D 入门\n\n在开始创建媒体播放器之前，我想花一章的时间来讲解 3D，从基础形状到可视化。在接下来的章节中，我们将创建音乐可视化作为媒体播放器的一部分，但你应能自如地运用各种\
  \ 3D 场景，尤其是数据可视化。首先，让我们从整体上了解一下 3D 图形，然后再使用一个名为 Three.js 的库。很多基础知识你会熟悉，但我还是希望从头开始讲起，以确保我讲得足够全面。\n\
  \n## 3D 基础\n\n如你所知，一个 3D 世界（很像我们的世界）由三个维度组成：`x`、`y` 和 `z`。可以简单地通过一个标准的笛卡尔坐标图来想象这些维度：有一个指向右方的轴表示\
  \ `x`，另一个指向上方的轴表示 `y`，还有一个表示深度的轴，那就是 `z` 轴。我说 `z` 表示深度，因为感觉如此，但实际上，正 `z` 朝向您，负 `z`\
  \ 则远离您。你可以在图 4-1 中看到一个示例。\n\n![A978-1-4302-5945-9_4_Fig1_HTML.jpg](img/A978-1-4302-5945-9_4_Fig1_HTML.jpg)\n\
  \n**图 4-1.** 3D 坐标轴\n\n在 3D 世界中，物体和形状是通过网格（Mesh）来创建的。网格可以像简单的立方体那样简单，也可以像你用 3D 建模软件设计出的物体那样复杂（我们不会涉及那么深入，但我会解释如何导入模型）。要赋予网格外观，可以使用材质（Material），这类似于现实世界，每种材质都有其自身的属性集，例如颜色和不透明度。我们将在本章后面学习如何定义自己的材质。\n\
  \n除了网格和材质，我们还有相机和灯光。在 2D 动画中，我们经常移动形状；而在 3D 动画中，我们可以选择移动相机（即用户可以看到的内容）来围绕场景旋转。我提到了灯光，它的作用显而易见，但你可能会惊讶于灯光的种类之多。灯光和相机各自在本章后面有专门的章节介绍。仅仅通过改变灯光的类型或位置就能改变一个场景的氛围，这往往令人印象深刻。\n\
  \n### Three.js\n\nThree.js 是一个库，它让在浏览器中渲染 3D 变得容易得多。它允许你使用多种渲染器，包括 canvas 和 WebGL。我通常建议避免使用库，但要在没有库的情况下使用\
  \ WebGL，你需要用一种叫 GLSL 的语言来编写着色器（由于依赖 GPU，使用 WebGL 必须有着色器），其语法类似于 C 语言。为了本书的目标而学习\
  \ GLSL 有些大材小用，而且花费的时间会超过一个章节！我将使用 Three.js 的 56 版本，该版本也包含在可下载的源代码中，但你可以在 [`http://www.mrdoob.github.com/three.js/`](http://mrdoob.github.com/three.js/)\
  \ 找到最新版本。\n\n\n\n#### 构建场景\n\n你可以像在电影中一样理解“场景”——它是你放置网格（物体）、光源和摄像机的地方。场景就是你的舞台。设置一个场景非常简单，因为你只需要场景本身、一台摄像机和渲染器。当然，那将是一个空场景！一个简单的场景对象可以使用\
  \ `THREE.Scene()` 创建，让我们继续创建一个基础的（空）场景。之后，我们可以开始添加基础几何体，例如立方体或球体。\n\n首先，我们可以创建用于存储渲染器（即我们的视口）尺寸的宽度和高度变量。在本例中，我将设置它们为内部窗口的尺寸。与之前几章我们自己创建画布不同，我们还需要一个容器来放置渲染器；我们可以让\
  \ Three.js 根据我们选择的渲染器来创建 DOM。现在我们需要选择渲染器，Three.js 的构建方式允许你创建自己的渲染器或使用第三方渲染器，但你真正需要了解的只有\
  \ `CanvasRenderer` 和 `WebGLRenderer`。两者的区别在于：Canvas 的兼容性更广，但 WebGL 效率更高。这是因为 WebGL\
  \ 原生支持 3D（OpenGL ES 2），其 3D 运算在 GPU 上运行；而 Canvas 没有 3D 支持（需要自行编写），其 3D 运算在 JavaScript\
  \ 中运行（速度慢得多）。因此，我们暂时坚持使用 `WebGLRenderer`，不过你也可以尝试两者，以感受它们的差异（通常差异很细微）。选定渲染器后，我将其存储在名为\
  \ `renderer` 的变量中，我们可以设置其尺寸并将其添加到 DOM 中。\n\n```\nvar width  = window.innerWidth,\n\
  \    height = window.innerHeight;\nvar container = document.querySelector('#container');\n\
  var renderer = new THREE.WebGLRenderer();\nrenderer.setSize(width, height);\ncontainer.appendChild(renderer.domElement);\n\
  ```\n\n接下来我们需要创建一台摄像机。本章稍后我会介绍如何使用多台摄像机，但一开始我们先只使用一台。与渲染器类似，有几种默认的摄像机类，并且通过继承抽象的\
  \ `Camera` 类很容易编写自己的摄像机类型。内置的摄像机有 `OrthographicCamera` 和 `PerspectiveCamera`，它们可用于提供场景的不同视图；通常你可以认为透视视图显示的是\
  \ 3D 视角，而正交视图显示的是 2D 视角。在本例中，我们选择透视摄像机，因为我们只想看到场景中的内容（初始情况下一无所有），而不是某个特定视角（例如俯视图）。对于我们的\
  \ `PerspectiveCamera`，有四个参数，根据文档说明，它们是：\n\n*   `fov`：摄像机视锥体的垂直视野\n*   `aspect`：摄像机视锥体的宽高比\n\
  *   `near`：摄像机视锥体的近截面\n*   `far`：摄像机视锥体的远截面\n\n如果你了解“视锥体”的含义，那么这些参数就不难理解；在这里，它就是指视图的一部分。通常这些参数会存储为变量，但由于目前其他地方用不到它们，我决定直接将值作为参数写入，以减少代码行数。创建摄像机后，我们可以为其定位，目前只需将摄像机的\
  \ z 坐标设置为 300，这样当我们添加一些网格后，场景就能很好地呈现在视野中。\n\n```\nvar camera = new THREE.PerspectiveCamera(45,\
  \ width / height, 1, 1000);\ncamera.position.z = 300;\n```\n\n一旦场景中有了物体，你可能会通过调整这些数值来感受它们如何影响场景的视角，这会很有帮助。正如我前面提到的，要创建场景本身，你只需要创建\
  \ `Scene` 类的一个实例。场景创建后，我们可以将摄像机添加到其中。要渲染场景，我们使用 `renderer.render(scene, camera)`，这自解释性很强。我决定将其放在一个与第\
  \ 2 章类似的设置中。这非常适合作为开发更复杂动画和渲染的模板。\n\n```\nvar scene = new THREE.Scene();\nscene.add(camera);\n\
  \nfunction logic() {\n    requestAnimationFrame(render);\n}\n\nfunction render()\
  \ {\n    renderer.render(scene, camera);\n}\n\nsetInterval(logic, 1000/60);\n```\n\
  \n\n\n### 添加网格\n\n一个基础场景相当乏味，而且坦率地说，没什么用处。因此，让我们通过研究可以使用的各种网格来让情况变得有趣一些。不过首先，我们需要一些光线，这样才能实际看到物体（这真的就像在黑暗的房间里——物体就在场景中，但你看不到它们）。稍后我会解释光的类型，但目前我们只需使用一个简单的\
  \ `DirectionalLight`（平行光），它的用法就像一盏台灯，指向特定方向，而不是照亮整个场景。我选择使用这种类型的光，因为它能让我们立刻轻松地看到阴影。默认的平行光是白色的，强度为\
  \ 1；默认情况下，光指向场景中心 (0,0,0)。需要注意的是，尽管平行光有一个名为 `position` 的属性，但这表示光指向的方向，而光源本身并没有实际位置（它是无限远的）。我决定将光放置在更靠近摄像机的位置，这样我们就能看到物体周围漂亮简单的阴影了。\n\
  \n```\nvar directionalLight = new THREE.DirectionalLight();\ndirectionalLight.position.z\
  \ = 10;\nscene.add(directionalLight);\n```\n\n让我们从一个球体开始（类似于 Three.js 官方文档中的示例）。要创建任何原始对象，我们需要创建一个包含几何体类型和材质的网格。对于球体，我们可以使用\
  \ `THREE.SphereGeometry` 搭配任何类型的材质，在这个例子中，我将使用一种名为 `THREE.MeshLambertMaterial` 的材质（稍后会详细介绍）。\n\
  \n```\nvar radius = 100,\n    segments = 50,\n    rings = 50;\n\nvar sphereMaterial\
  \ = new THREE.MeshLambertMaterial({\n    color: 0xFF0000\n});\n\nvar sphere = new\
  \ THREE.Mesh(\n    new THREE.SphereGeometry(\n        radius,\n        segments,\n\
  \        rings),\n    sphereMaterial);\n\nscene.add(sphere);\n```\n\n如你所见，我首先设置了三个变量来控制球体的属性。你会知道半径是球体大小/直径的一半。`segments`\
  \ 和 `rings` 用于指定球体的质量——数值越低，质量越差。尝试将它们从 50 改为 10，你会看到锯齿状的边缘，并且可能能够看到构成环和段的线条。你可以把它们想象成纬度和经度；`rings`\
  \ 水平环绕球体，`segments` 则是垂直的。\n\n**注意**\n\n如果你熟悉位图图像或数学几何，你会明白不存在完美的曲线，因此对于应该有多少环和段，并没有正确的答案。只需选择一个在质量和优化之间感觉合适的折中数值即可。\n\
  \n如果运行以下代码，你应该会看到一个红色的球体。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>场景中的形状</title>\n\
  \    <style>\n        * { margin: 0; }\n        canvas { background: #000;}\n  \
  \  </style>\n</head>\n<body>\n    <div id=\"container\"></div>\n    <script src=\"\
  ../three.min.js\"></script>\n    <script src=\"script.js\"></script>\n</body>\n\
  </html>\n```\n\n```\nvar width  = window.innerWidth,\n    height = window.innerHeight;\n\
  var container = document.querySelector('#container');\nvar renderer = new THREE.WebGLRenderer();\n\
  renderer.setSize(width, height);\ncontainer.appendChild(renderer.domElement);\n\n\
  var VIEW_ANGLE = 45,\n    NEAR = 0.1,\n    FAR = 10000;\nvar camera =  new THREE.PerspectiveCamera(45,\
  \ width / height, 1, 1000);\ncamera.position.z = 300;\n\nvar scene = new THREE.Scene();\n\
  scene.add(camera);\n\nvar directionalLight = new THREE.DirectionalLight();\ndirectionalLight.position.z\
  \ = 10;\nscene.add(directionalLight);\n\nvar radius = 100,\n    segments = 50,\n\
  \    rings = 50;\nvar sphereMaterial = new THREE.MeshLambertMaterial({\n    color:\
  \ 0xFF0000\n});\n\nvar sphere = new THREE.Mesh(\n    new THREE.SphereGeometry(\n\
  \        radius,\n        segments,\n        rings),\n    sphereMaterial);\n\nscene.add(sphere);\n\
  \nfunction logic()  {\n    requestAnimationFrame(render);\n}\n\nfunction render()\
  \ {\n    renderer.render(scene, camera);\n}\n\nsetInterval(logic, 1000/60);\n```\n\
  \n创建每个原始形状的方法类似，因此我不逐一引导你创建每种形状，而是提供表 4-1 来展示形状类型。请注意，除非我特别说明，构造函数的每个参数都是可选的。许多几何体基于\
  \ `PolyhedronGeometry`，因此参数 `detail` 用于决定创建形状所使用的三角形数量。另外请记住，所有构造函数都应加上 `THREE`\
  \ 前缀。\n\n**表 4-1.** 展示 Three.js 中可用的几何体\n\n| 名称 | 构造函数 | 备注 |\n| --- | --- | ---\
  \ |\n| `CircleGeometry` | `CircleGeometry(radius, segments, thetaStart, thetaLength)`\
  \ | theta 参数用于创建分段；通过改变它们，可以指定特定的弧线。 |\n| `ConvexGeometry` | `ConvexGeometry(vertices)`\
  \ |  |\n| `CubeGeometry` | `CubeGeometry(width, height, depth, widthSegments, heightSegments,\
  \ depthSegment)` |  |\n| `CylinderGeometry` | `CylinderGeometry(radiusTop, radiusBottom,\
  \ height, radiusSegments, heightSegments, openEnded)` |  |\n| `ExtrudeGeometry`\
  \ | `ExtrudeGeometry(shapes, options)` | 这个有很多选项，我将在本表之后进行说明。 |\n| `IcosahedronGeometry`\
  \ | `IcosahedronGeometry(radius, detail)` |  |\n| `LatheGeometry` | `LatheGeometry(points,\
  \ segments, phiStart, phiLength)` |  |\n| `OctahedronGeometry` | `OctahedronGeometry(radius,\
  \ detail)` |  |\n| `ParametricGeometry` | `ParametricGeometry(parametricFunction,\
  \ uSegments, ySegments, useTris)` |  |\n| `PlaneGeometry` | `PlaneGeometry(width,\
  \ height, widthSegments, heightSegments)` |  |\n| `PolyhedronGeometry` | `PolyhedronGeometry(vertices,\
  \ faces, radius, detail)` |  |\n| `RingGeometry` | `RingGeometry(innerRadius, outerRadius,\
  \ thetaSegments, phiSegments, thetaStart, thetaLength)` |  |\n| `ShapeGeometry`\
  \ | `ShapeGeometry(shapes, options)` |  |\n| `SphereGeometry` | `SphereGeometry(radius,\
  \ widthSegments, heightSegments, phiStart, phiLength, thetaStart, thetaLength)`\
  \ | 我们已经介绍过球体，但和圆一样，还有一些额外选项偶尔可能有用。 |\n| `TetrahedronGeometry` | `TetrahedronGeometry(radius,\
  \ detail)` |  |\n| `TextGeometry` | `TextGeometry(text, parameters)` | 用于创建 3D 文本，我将在本章后面部分介绍。\
  \ |\n| `TorusGeometry` | `TorusGeometry(radius, tube, radialSegments, tubularSegments,\
  \ arc)` |  |\n| `TorusKnotGeometry` | `TorusKnotGeometry(radius, tube, radialSegments,\
  \ tubularSegments, p, q, heightScale)` |  |\n| `TubeGeometry` | `TubeGeometry(path,\
  \ segments, radius, radiusSegments, closed, debug)` |  |\n\n\n\n### 拉伸（Extrusion）\n\
  \n这些形状中的大多数你都能理解；然而 `ExtrudeGeometry`（拉伸几何体）的使用方式不同，并且具有许多选项。其目的是扩展一个形状，例如将 2D 形状转化为\
  \ 3D，或者在 3D 形状的某个面上进行构建。在这个示例中，我们将从一些点作为路径开始，这些点代表一个基本的 2D 直角三角形，我们将由此生成一个 2D 形状（即，由路径中的点创建的平面）。形状创建完毕后，我们需要对其进行拉伸以形成一个棱柱。\n\
  \n**提示：** 为了简单起见，我使用了三角形。路径通常用于创建复杂的形状。\n\n该路径是一个点数组，这些点使用 2D 向量（表示图形的坐标）创建。Three.js\
  \ 提供了一个处理向量的实用库，使得计算两点之间的距离以及执行类似功能变得非常简单。要将路径转换为形状，只需将路径作为参数传递给 `THREE.Shape` 构造函数即可。\n\
  \n```\nvar path = [];\npath.push( new THREE.Vector2 (   0,  50 ) );\npath.push(\
  \ new THREE.Vector2 (  50,  50 ) );\npath.push( new THREE.Vector2 (  50,  0 ) );\n\
  var shape = new THREE.Shape( path );\n```\n\n正如我之前提到的，`ExtrudeGeometry` 有许多选项用于定义所需的拉伸类型，如表\
  \ 4-2 所示。\n\n**表 4-2.** `ExtrudeGeometry` 的可用选项\n\n| `curveSegments` | 路径上的点数，默认为\
  \ 12。 |\n| --- | --- |\n| `steps` | 每次拉伸中的细分数量，默认为 32。 |\n| `amount` | 拉伸的数量，基本上是形状的尺寸，默认为\
  \ 100。 |\n| `bevelEnabled` | 启用倒角，它会使连接拉伸边缘与形状面的顶点变得圆滑。默认值为 `true`。 |\n| `bevelThickness`\
  \ | 倒角的厚度，默认为 6。 |\n| `bevelSize` | 倒角开始的边缘距离，默认值为 `bevelThickness` 减去 2。 |\n| `bevelSegments`\
  \ | 倒角的段数，类似于球体的分段数，用于控制倒角的质量。默认为 3。 |\n| `extrudePath` | 形状中需要被拉伸的特定路径。 |\n| `frames`\
  \ | 一个 Frenet 框架数组，用于显示样条曲线的切线、法线和副法线。这超出了本书的范围，但默认情况下会自行生成框架。 |\n| `material` |\
  \ 前后面材质的索引，无默认值。 |\n| `extrudeMaterial` | 拉伸面材质的索引，无默认值。 |\n| `uvGenerator` | 允许你指定\
  \ UV 生成器。默认情况下使用 `THREE.ExtrudeGeometry.WorldUVGenerator`。 |\n\n**提示：** 这些选项（尤其是默认值）在不同版本的库中可能会有所变化。\n\
  \n下面的代码创建了一个拉伸几何体，以展示如何使用这些不同的设置来生成一个相当复杂的形状。\n\n```\nvar extrusionSettings = {\n\
  \  size: 30, height: 4, curveSegments: 3,\n  bevelThickness: 1, bevelSize: 2, bevelEnabled:\
  \ false,\n  material: 0, extrudeMaterial: 1\n};\nvar extrude = new THREE.ExtrudeGeometry(\
  \ shape, extrusionSettings );\nvar extrudedShape = new THREE.Mesh( extrude, material\
  \ );\nscene.add(extrudedShape);\n```\n\n现在，你可能会看这段代码，再看屏幕上显示的内容，感到有点困惑。它本应看起来像一个三角形，别担心！由于相机的视角，它看起来像那样，所以我们让这个形状旋转，这样你就能看到它的\
  \ 3D 效果。我非常喜欢在 x 轴和 y 轴上旋转的效果。它产生了一种类似“8”字形的运动，这对于观察形状的所有侧面非常有用。这段代码为形状添加了旋转：\n\n\
  ```\nfunction logic()  {\n  extrudedShape.rotation.y += 0.05;\n  extrudedShape.rotation.x\
  \ += 0.05;\n  requestAnimationFrame(render);\n}\n```\n\n图 4-2 展示了添加旋转后的拉伸形状。\n\n\
  ![A978-1-4302-5945-9_4_Fig2_HTML.jpg](img/A978-1-4302-5945-9_4_Fig2_HTML.jpg)\n\n\
  **图 4-2.** 拉伸效果\n\n### 文本（Text）\n\n有时你可能会需要 3D 文本。这不是一个常见的用例，但也许你在制作类似电影标题或广告的东西。这也是许多人不意识到可以轻松实现的功能，所以我想简要地看一下。`TextGeometry`\
  \ 构建在 `ExtrusionGeometry` 之上，因此大部分内容都是熟悉的。让我们创建一段显示“Hello World!”的 3D 文本——因为每个人都喜欢\
  \ Hello World——它像我们的棱柱一样以相同的方式旋转，以展示它们有多么相似（而且我觉得这种旋转看起来非常迷人）。\n\n**警告：** 默认情况下，Three.js\
  \ 使用一种名为 Helvetiker（这不是拼写错误）的字体，必须包含该字体，或者你应该使用不同的字体，否则会出现错误。该字体可以从 [`www.typeface.neocracy.org/`](http://www.typeface.neocracy.org/)\
  \ 下载，也包含在本书的源代码中。\n\n我正在修改我们用于拉伸的代码，因此将重复使用光照、材质以及其余设置代码。`TextGeometry` 与其他几何体没有什么不同，因此在添加到场景之前，需要将其传递给\
  \ `Mesh`（网格）；这似乎显而易见，但我总是忘记！让我们从默认文本开始：\n\n```\nvar text = new THREE.Mesh(new THREE.TextGeometry(\"\
  Hello World!\", {}), material);\nscene.add(text);\n```\n\n如表 4-3 所示，还有许多其他选项可用于自定义文本。\n\
  \n**表 4-3.** `TextGeometry` 的可用选项\n\n| `size` | 文本的大小，默认为 150。 |\n| --- | --- |\n\
  | `height` | 拉伸文本的厚度，默认为 50。 |\n| `curveSegments` | 曲线上的点数，默认为 12。 |\n| `font` |\
  \ 字体名称，默认为 Helvetiker。 |\n| `weight` | 字体粗细。可以是任何有效的 CSS `font-weight`，例如 `normal`\
  \ 和 `bold`。默认为 `normal`。 |\n| `style` | 与 weight 类似，style 允许任何有效的 CSS `font-style`，例如\
  \ `normal` 和 `italic`。默认为 `normal`。 |\n| `bevelEnabled` | 启用倒角，它会使连接拉伸边缘与形状面的顶点变得圆滑。默认值为\
  \ `false`。 |\n| `bevelThickness` | 倒角的厚度，默认为 6。 |\n| `bevelSize` | 倒角开始的边缘距离，默认值为\
  \ `bevelThickness` 减去 2。 |\n\n这些选项应该很容易理解，因为它们大多来自 CSS 字体选项或我们已经讨论过的 `ExtrudedGeometry`。不过，我将向你展示一个关于如何使用这些选项的简单示例：\n\
  \n```\nvar options = {\n  size: 20,\n  height: 20,\n  bevelEnabled: true,\n  bevelThickness:\
  \ 25\n};\nvar text = new THREE.Mesh(new THREE.TextGeometry(\"Hello World!\", options),\
  \ material);\nscene.add(text);\n```\n\n如你所见，如果你将文本视为另一种形状，添加文本是非常容易的。\n\n\n\n###\
  \ 照明\n\n照明是我认为真正能够“设定场景”的一个要素（请原谅我的双关语），因为整个场景都依赖于照明来决定显示什么（以及同样重要的，隐藏什么阴影），以及整体的氛围。就像在电影中一样，照明可以用来彻底改变用户的感受。我不会深入探讨用户体验设计，但这一点值得铭记和思考！\n\
  \n> **注意**  \n> 由于照明依赖于物体的材质，你需要确保材质设置正确。这将在下一节中解释，但现在请确保使用`MeshLambertMaterial`或`MeshPongMaterial`，因为它们被设置为可以与灯光配合使用。\n\
  \n我将介绍一些更常用的照明类型；当然还有其他类型，你也可以创建自己的照明，我们稍后可能会简单提及。每种类型的灯光都有许多属性和参数，尽管有些比其他的更多，以下是你应该熟悉的一些内容：\n\
  \n- **强度（Intensity）**：灯光的强度是指它的亮度，数值范围可以从 0 到 1，其中 1 是灯光的实际颜色，0 是不可见（就像关闭了一样）。默认值通常为\
  \ 1。有些灯光没有强度属性（至少在撰写本文时是如此），但你总是可以通过将每个 RGB 颜色乘以一个强度变量来模拟。\n- **十六进制颜色（Hex）**：这是一种必须采用十六进制形式的颜色（例如白色为`0xffffff`）。通常默认值为白色。\n\
  - **阴影（Shadows）**：关于阴影有不少属性，例如灯光是否投射阴影。我将在解释完每种灯光类型后再讨论这些属性。\n\n在整个章节中，我们一直使用`DirectionalLight`作为场景中唯一的光源。如前所述，`DirectionalLight`是一种朝特定方向投射的光源，并且会影响该方向上所有物体，无论它们与光源的距离如何。我还应该提醒你之前关于`DirectionalLight`的说法：它实际上并没有具体的位置，相反，你设置的位置是它向场景原点投射光线的起始位置。`DirectionalLight`的语法如下：\n\
  \n```\nTHREE.DirectionalLight(hex, intensity)\n```\n\n另一方面，`PointLight`会向所有方向发射光线，但如果设置了距离，它对物体的影响会因物体与光源的距离而有所不同。当距离设置为\
  \ 0（默认值）时，灯光会像`DirectionalLight`一样影响所有物体。`PointLight`的语法如下：\n\n```\nTHREE.PointLight(hex,\
  \ intensity, distance)\n```\n\n还有一种名为`SpotLight`的灯光，它可以像`DirectionalLight`一样使用，但可以更精确地控制。`SpotLight`和`DirectionalLight`的一个区别是角度。`DirectionalLight`的光线朝大致方向发射，而`SpotLight`则在指定的角度范围内（默认为`pi/2`）定向发射光线。它也可以像`PointLight`一样覆盖指定的距离。如果你只是想照亮一个场景，通常可以使用前两种灯光，但如果你想仔细引导光照，那么这是理想的光源。`SpotLight`的语法如下：\n\
  \n```\nTHREE.SpotLight(hex, intensity, distance, angle, exponent)\n```\n\n我之前提到过照明可以营造氛围。有一种专门用于此目的的灯光，正如你所料，叫做`AmbientLight`。这种灯光会影响到场景中所有能被光源影响的物体。因为它用于增强照明，所以应只与其他灯光配合使用。`AmbientLight`的语法如下：\n\
  \n```\nTHREE.AmbientLight(hex)\n```\n\n你可能会发现`AmbientLight`会优先于所有其他灯光，要解决这个问题，只需调整其强度，使其成为弱光（环境光）。改变强度的示例如下：\n\
  \n```\nvar light = new THREE.AmbientLight();\nvar intensity = 0.025;\nscene.add(light);\n\
  light.color.setRGB(20 * intensity, 0 * intensity, 255 * intensity);\n```\n\n很多时候，你会想确切地了解灯光在做什么、它们的位置以及光线投射的方向。有很多方法可以实现这一点——你可以使用控制台查看每个灯光的属性，但我建议采用更图形化的方式。对于许多灯光，Three.js\
  \ 提供了辅助对象，可以用线条显示方向。如果你有一个`DirectionalLight`，那么可以使用`DirectionalLightHelper`，它会以虚线形式显示其指向的方向。你可以通过更改材质来改变线条的类型，例如颜色或虚线样式。大多数灯光也都有辅助工具，例如`SpotLightHelper`可用于显示光线的角度。\n\
  \n另一种查看光源的方法是（例如在灯光的位置创建一个球体对象），如下所示：\n\n```\nvar lightDebug = new THREE.Mesh(new\
  \ THREE.SphereGeometry(5), new THREE.MeshBasicMaterial());\nlightDebug.position\
  \ = light.position;\nscene.add(lightDebug);\n```\n\n使用这种方法的一种方式——我更喜欢这种方式，而且我知道很多其他人也经常使用这种技术——是将球体做得非常小，这样你既能看到它，它又看起来更像是动画的一部分，而不是调试模式。\n\
  \n\n\n#### 材质\n\n你已经见过了几种被使用和提及的材质，例如`Phong`、`Lambert`和`Basic`——但它们到底是什么呢？每种材质都指定了所使用的着色类型。这是基于真实世界中的材质及其差异而来的，例如，一个塑料瓶和一个闪亮的罐子在相同的光照下，由于反射、透明度等因素，会呈现出不同的外观。我们无法完全模拟真实世界中的精确条件，但可以通过修改某些属性以及使用不同的着色器来非常接近。在撰写本书时，Three.js\
  \ 为我们提供了表 4-4 中所示的内置材质。\n\n表 4-4. 展示了 Three.js 中可用的内置材质。\n\n| `LineBasicMaterial`\
  \ | `LineBasicMaterial` 用于创建直线，默认颜色为白色，宽度为 1 像素。 |\n| --- | --- |\n| `LineDashedMaterial`\
  \ | 此材质与 `LineBasicMaterial` 类似，但用于创建虚线，在调试时非常有用（但不限于此），因为你知道它并不打算成为场景的一部分。 |\n\
  | `MeshBasicMaterial` | 根据 `wireframe` 属性（默认为 `false`），此材质用于绘制平面或线框面，并且不受光照影响。通常在其他材质之上使用它来绘制线框，因为它的开销最小。它也常用于应用纹理（图像）。\
  \ |\n| `MeshDepthMaterial` | 此材质用于显示深度，通常在后处理中使用。 |\n| `MeshFaceMaterial` | 很多时候一个形状的每一面都需要不同的材质，`MeshFaceMaterial`\
  \ 实际上就是一个材质数组。 |\n| `MeshNormalMaterial` | 这是一种非常有用的材质，尤其适用于原型设计，因为它能确保每个面都有独特的颜色，并且不需要光照。\
  \ |\n| `ParticleBasicMaterial` | 这是粒子系统使用的材质。颜色默认为白色。 |\n| `ShaderMaterial` | 如果你想编写自己的着色器（本书不会涉及），那么可以使用这种材质。它提供了\
  \ GLSL 的属性，例如 `fragmentShader`、`vertexShader` 和 `uniforms`。 |\n\n表 4-4 中缺少了两种材质：`MeshLambertMaterial`\
  \ 和 `MeshPhongMaterial`。我会将这两种材质与列表分开处理，因为它们有些相似，并且涉及大量的渲染技术（远非一个列表所能涵盖）。我们之前已经将\
  \ `Lambert` 用作通用的 3D 材质，但我没有解释它是什么。根据当前的 Three.js 文档，对这两种材质区别的简单解释是：\n\n- **Lambert**：用于非光泽（朗伯）表面的材质，逐顶点计算。\n\
  - **Phong**：用于光泽表面的材质，逐像素计算。\n\n这通常足以让你决定在每种情况下使用哪一种，但我认为更全面的理解很重要，因此我将简要解释它们的技术差异，并鼓励你进行更深入的研究。\n\
  \n在计算机图形学中，有两种模型（可以结合使用）来决定对象的着色方式：光照模型和着色模型。光照模型使用环境光、漫反射和镜面高光来显示从表面反射（或折射）的光线。着色的数学计算很复杂，因为它无法简化为简单的组件，基本上，它使用平面着色或插值着色来为面着色（即计算亮度）。`MeshLambertMaterial`\
  \ 使用 Gouraud 着色和朗伯光照模型，默认情况下在每个顶点处进行光照计算，然后在面片上进行插值。`MeshPhongMaterial` 使用 Phong\
  \ 着色和 Phong 光照模型，默认情况下，顶点法线在表面进行插值，并且在每个像素（更准确地说，是纹素）处进行光照计算。\n\n**注意：** Three.js\
  \ 并未完全按照算法标准实现，因此如果你对这些数学模型特别感兴趣，请将这一点考虑在内。\n\n### 数据可视化\n\n关于文档的介绍就到这里，让我们继续前进，制作一些有用的东西。数据可视化的类型有很多，从基本的条形图和饼图，到详细的地球仪，甚至太阳系模型。所有这些都有其用途，通常用作向公众展示数据的方式，也可用于数据分析。这是一个广阔的学科领域，因此我们仅会触及你可以可视化的内容以及如何实现它的皮毛。\n\
  \n我们可以在任何地方开始，比如用基本 3D 图形显示政府的财务数据，但这很快就会变得枯燥，所以让我们制作一个 3D 节点图，展示曾经合作过的男女演员（灵感来源于“凯文·贝肯六度分隔”理论）。在这个例子中，我们的节点是演员/女演员，连线是电影。我提供了一些示例数据（JSON\
  \ 格式），以免你需要注册 API。这也意味着我可以对数据进行更有选择性的筛选，因为大部分数据并非必需。\n\n\n### 3D 节点图\n\n与其直接使用数据，不如先从图形开始。在本节中，所有节点和边都是随机生成的，并且两个节点之间完全有可能存在多条相同的边。目前我们无需担心这个问题（一旦有了真实数据，处理起来会容易得多）。\n\
  \n我们从所有场景都具备的基础设置开始，这次同时使用了方向光和环境光，以便每个节点（我们将用随机颜色的球体表示）呈现出良好的效果。\n\n```\nvar width\
  \  = window.innerWidth,\n    height = window.innerHeight;\nvar container = document.querySelector('#container');\n\
  var renderer = new THREE.WebGLRenderer();\nrenderer.setSize(width, height);\ncontainer.appendChild(renderer.domElement);\n\
  var VIEW_ANGLE = 45,\n    NEAR = 0.1,\n    FAR = 10000;\nvar camera =  new THREE.PerspectiveCamera(45,\
  \ width / height, 1, 1000);\ncamera.position.z = 600;\nvar ambient = new THREE.AmbientLight(\
  \ 0x050505, 2 );\ndirectionalLight = new THREE.DirectionalLight( 0xffffff, 1 );\n\
  directionalLight.position.set( 2, 1.2, 10 ).normalize();\nvar scene = new THREE.Scene();\n\
  scene.add(ambient);\nscene.add(directionalLight);\nscene.add(camera);\n// 本节其余代码将放在此处。\n\
  function logic()  {\n    requestAnimationFrame(render);\n}\nfunction render() {\n\
  \    renderer.render(scene, camera);\n}\nsetInterval(logic, 1000/60);\n```\n\n你知道如何创建球体，而且我相信你很快就能想出让它们随机定位的方法。然而，我们需要做的是随机定位球体，还需要用线条将它们随机连接起来形成边。为此，我们创建了一个\
  \ `Node` 对象，用于存储名称和位置，然后生成随机的边。由于我们目前没有使用数据，名称默认为“随机节点”，并且有一个通过属性 `edges` 访问的 `getEdges()`\
  \ 函数，该函数返回两个随机节点用于连接边。要在 `getEdges` 中生成随机边，我们只需将 `Math.random()` 乘以节点数量，然后向下取整（floor），因为索引是从\
  \ 0 而不是 1 开始的。\n\n```\nvar amount_nodes = 20;\nvar Node = function() {\n    name\
  \ = \"随机节点\",\n    position = new THREE.Vector3();\n    function getEdges() {\n\
  \        return [Math.floor(Math.random()*amount_nodes), Math.floor(Math.random()*amount_nodes)\
  \ ];\n    }\n    return {\n        name: name,\n        edges: getEdges()\n    }\n\
  }\n```\n\n要绘制图形，我们需要三个函数：一个绘制单个节点，一个绘制节点的所有边，还需要一个函数利用前两个函数来绘制整个图形。我们先从 `drawNode(n)`\
  \ 开始，将节点作为参数传入，这样就能方便地访问我们刚创建的节点对象。在函数内部，我们使用之前教过的相同技术创建一个球体，材质为随机颜色的朗伯材质。随机颜色的实现出乎意料地简单，因为十六进制（例如\
  \ `0xffffff`）与任何其他数字的处理方式相同（毕竟它只是数字在不同进制下的表示），我们可以对其进行数学运算，这里就是将其乘以一个随机数。为了确定位置，我们选择一个在指定区域边界内的随机数，然后减去该区域的数值，以使图形保持在中心位置。\n\
  \n```\nfunction drawNode(n)  {\n    var radius = 10,\n        segments = 50,\n \
  \       rings = 50;\n    var node = new THREE.Mesh(\n        var material = new\
  \ THREE.MeshLambertMaterial( {  color: Math.random() * 0xffffff } );\n        var\
  \ draw_object = new THREE.Mesh(\n            new THREE.SphereGeometry(\n       \
  \         radius,\n                segments,\n                rings),\n        \
  \    material);\n        );\n    var area = 300;\n    node.position.x = Math.floor(Math.random()\
  \ * (area * 2 + 1) - area);\n    node.position.y = Math.floor(Math.random() * (area\
  \ * 2 + 1) - area);\n    node.position.z = Math.floor(Math.random() * (area * 2\
  \ + 1) - area);\n    n.position = node.position;\n    scene.add(node);\n}\n```\n\
  \n现在，节点已经绘制到场景中，是时候用边将它们连接起来了。由于这些边是随机生成的，正如我之前所说，有些边可能会重叠，导致线条变粗。一旦我们添加了数据，这种情况就不会发生，因为我们可以利用数据来检查某条线是否已经存在。从环境光中你已经知道，要实现透明度，需要将\
  \ `transparent` 设置为 `true`，所以我在这里的 `LineBasicMaterial` 中也这么做了，因为如果边是 100% 白色且不透明，会显得过于密集。要确定线条的走向，我们需要遍历\
  \ `node.edges`（在创建新节点时随机生成），并创建一个几何体，其顶点位于当前节点的位置和其他节点（`nodes[node.edges[i]]`）的位置。创建完成后，我们只需使用这个几何体创建一条新线，然后将其添加到场景中。\n\
  \n```\nfunction drawEdges(node)  {\n    var line_material = new THREE.LineBasicMaterial(\
  \ { color: 0xffffff, transparent: true, opacity: 0.1, linewidth:0.5 } );\n    for\
  \ (var i = 0; i < node.edges.length; i++)  {\n        var tmp_geo = new THREE.Geometry();\n\
  \        tmp_geo.vertices.push(node.position);\n        tmp_geo.vertices.push(nodes[node.edges[i]].position);\n\
  \        var line = new THREE.Line( tmp_geo, line_material );\n        scene.add(line);\n\
  \    }\n}\n```\n\n最后，为了完成这部分项目，我们只需使用刚才编写的两个函数来绘制图形。你可能已经注意到，我们使用了一个名为 `nodes` 的数组，节点是在\
  \ `drawGraph()` 函数中创建的。该函数的第一部分会循环遍历节点数量（`amount_nodes`），并在数组中创建一个新的 `Node` 对象，然后使用\
  \ `drawNode()` 绘制它。由于 `drawEdges()` 需要使用节点数组来确定哪些边是连接的，因此边必须在一个单独的循环中创建。\n\n```\n\
  var nodes = [];\ndrawGraph();\nfunction drawGraph()  {\n    // 绘制节点\n    for (var\
  \ i = 0; i < amount_nodes; i++)  {\n        nodes[i] = new Node();\n        drawNode(nodes[i]);\n\
  \    }\n    // 绘制边，必须在节点就位后才能进行\n    for (var i = 0; i < amount_nodes; i++)  {\n\
  \        drawEdges(nodes[i]);\n    }\n}\n```\n\n如果现在将所有代码组合起来，你应该会看到一个颜色随机的漂亮 3D\
  \ 节点图，但它并不代表任何实际数据（参见图 4-3）。这对于各种可视化来说是一个良好的起点，并且应该能让你自如地使用这些工具（即 Three.js）来生成比简单形状更复杂的图形。\n\
  \n![A978-1-4302-5945-9_4_Fig3_HTML.jpg](img/A978-1-4302-5945-9_4_Fig3_HTML.jpg)\n\
  \n**图 4-3.** 节点图\n\n我鼓励你修改代码，使其成为你自己的作品。以下是一些扩展图形的思路：\n\n*   使用 API 可视化实时数据（Twitter、政府开放数据等）。\n\
  *   根据数据改变节点的大小和/或颜色。\n*   为悬停或点击节点和/或边添加文本叠加层。\n*   优化导航。在拥有数千个节点的图形中进行导航是很困难的。哪种方式效果最好——方向键？鼠标？点击移动？这是一个探索缩放的好方法。\n\
  \n你可以通过多种方式使用相机（本章前面已经解释了一些方法）来浏览图形。目前，我只是使用了简单的相机旋转技术，该技术已包含在代码中。\n\n\n\n### 添加数据\n\
  \n我们有一个显示随机节点的节点图，看起来不错，但背后其实没有任何意义。我创建了一个名为 `data.js` 的 JavaScript 文件（其中包含一个名为\
