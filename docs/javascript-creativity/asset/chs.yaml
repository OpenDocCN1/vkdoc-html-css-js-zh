- "# 在浏览器中创作音乐\n\n在第 3 章中，我们使用 Web Audio API 通过创建简单的可视化和频谱图来分析音频。本章是对第 3 章的扩展，将使用该\
  \ API 来创作音乐。为此，我将介绍一些音乐理论知识，并给出几个示例，然后创建一个 Web 应用，让用户使用基本的合成器创作音乐片段，并且能够在音轨上移动这些片段以创作自己的音乐。这个项目潜力巨大，因此你可以通过多种方式来修改它，使其成为你自己的作品，比如打造一个功能完整的基于\
  \ Web 的数字音频工作站。\n\n\n\n## 音乐理论\n\n本书并非关于音乐理论，但为了完成本项目并理解（或至少使用）`Web Audio API`，掌握音乐理论的基础知识至关重要。音乐是声音，而随机的声音只是噪音，但音乐并非噪音，那么音乐的特殊之处何在？区分音乐与噪音的要素有很多，包括节奏和速度，但更重要的是（至少从我们的角度而言），音高和音色是音乐的核心，它们构成了乐器本身。我们无需成为出色的音乐家就能创造出一款可用于创作非凡音乐的工具，只需专注于乐器本身的特性即可——在本例中，我们的乐器使用`Web\
  \ Audio API`构建，而音高就是音符的频率。\n\n那么，让我们从最基础的问题开始：什么是音符？简单来说，音符是特定波长的声波（即决定音高的频率）。音符按照音高从\
  \ A 到 G（嗯……大致如此）以字母顺序命名，所以 D 比 C 高。我之所以说“大致如此”，是因为音符实际上以八度为单位循环，从 C 到 C，因此同一八度内的\
  \ A 比 C 高，但比更高八度的 C 低。每个频率都可以用赫兹（`hz`）来表示（无论从语言上还是实践上）。由于在钢琴上的位置，频率为`261.63hz`的\
  \ C 被称为中央 C，通常作为计算基准的音符。例如，一个容易记忆的频率是“中央 C 上方的 A”，即`440hz`。\n\n由于每个八度都包含相同名称的音符，只是频率不同，而我们已经知道音符本身就是一个频率，因此各八度之间必然存在联系，否则它们从根本上就不可能是相同的音符。这种联系就是比率；每个八度的比率是`2:1`，因此音符的波长是前一个八度的两倍。所以，要从中央\
  \ C 上方的 A 到中央 C 下方的 A，我们只需计算`440/2 = 220hz`。这种关系是和声背后的基本概念。每个音符都可以用代表八度的数字来标记，原因显而易见，例如，中央\
  \ C 就是`C3`。\n\n如果你想象一架钢琴，你会记得黑键以特定模式分布在白键上方；这些琴键用于演奏音符之间的半音（或半音阶），其比率为`2^(1/12)`。音符上方的半音称为升音，音符下方的半音称为降音。因此，`466.16`被称为`A#`（升\
  \ A）或`Bb`（降 B）。这些半音是“等音”最常见的例子，因为从技术上讲，它们是两个完全相同的音符，唯一的区别在于音乐的方向。\n\n我们没有钢琴、吉他或任何其他乐器，那么我们计划如何制作音乐呢？当我解释什么是音符时，我将其频率称为波长，因为它是由声波产生的。正如你可能所知，所有声波都是通过振动产生的。因此，我们只需要拼图的最后一块：振荡器；这是所有声音合成的基础，因为它让我们仅通过扬声器就能产生声波。声音包络是声音合成中常用的术语，“用于定义声音波形，该术语涵盖声音的四个组成部分：起音、衰减、延音和释音。通过操控声音包络，你可以开始控制声音。想想钢琴和三角铁的区别，它们都有相当长的延音（即共鸣持续时间较长），但三角铁的声音像“叮”的一声，而钢琴的声音持续时间更长（当然取决于你弹奏音符的时间长短），因此钢琴的起音比三角铁更强。在实践中，由于涉及大量物理因素（例如木质钢琴的特性），要完美合成任何乐器都很难，但通过操控每个音符，你可以尝试仅通过振荡所选波形来复现音乐的声音。\n\
  \n每个声波都有一个形状（波形），它在视觉上表示音符振幅随时间的变化。这涉及很多我们无需关注的物理知识，但基本上，振幅决定了扬声器需要如何移动来产生声音。有四种基本波形，它们构成了所有声音的基础（见图\
  \ 5-1）。\n\n![A978-1-4302-5945-9_5_Fig1_HTML.jpg](img/A978-1-4302-5945-9_5_Fig1_HTML.jpg)\n\
  \n图 5-1. 波形示例。[`https://en.wikipedia.org/wiki/File:Waveforms.svg`](https://en.wikipedia.org/wiki/File:Waveforms.svg)\n\
  \n四种波形分别是：\n\n*   正弦波：这条曲线遵循数学函数正弦的形状。\n*   方波：方波类似于二进制，它要么处于一个频率，要么处于另一个频率。\n*\
  \   三角波：三角波类似于正弦波，但不够平滑。这导致声音相当尖锐。\n*   锯齿波：这些波是前述所有波的组合。这种波具有三角波的缓慢尖锐音色，直到达到峰值，然后重置为原始频率，很像方波。\n\
  \n\n\n## 创建键盘\n\n在掌握了基础理论之后，让我们着手创建一个键盘。实现方式有很多种，比如使用 DOM 或 Canvas，但由于琴键都是基本的矩形，我认为最佳方案是使用基于矢量的\
  \ SVG。为了更便捷地创建 SVG 并将事件绑定到琴键（使其真正可用），我们将使用一个名为 `svg.js` 的库（可在 `www.svgjs.com` 找到）。一架钢琴有\
  \ 88 个琴键（52 个白键和 36 个黑键），由于屏幕键盘容纳这么多键位过于拥挤，我决定只包含中间的 3 个八度，这样我们就有了 21 个白键。此外，仅允许鼠标操作并不合理，因为除非使用多点触控屏，否则你无法同时按下多个琴键。当然，标准\
  \ QWERTY 键盘中排只有九个字母键，因此我决定将 S 到 K 这七个键定义为可演奏的白键，并使用 A 和 L 键来分别降低或升高一个八度。这并非完美方案，因为你可能需要同时演奏多个八度，但对于本项目而言已经足够了。\n\
  \n让我们从定义一个 SVG 开始：`var keyboard = SVG('keyboard')`；这将创建一个 id 为 keyboard 的 SVG，可以通过同名变量进行访问。创建好\
  \ SVG 后，我们就可以开始添加琴键了。白键是最简单的，因为我们只需将 SVG 的宽度（以及位置）除以所需琴键的数量来创建即可。由于这些是白键，我们需要设置属性，使其填充色为白色，描边色为黑色。我们还需要设置\
  \ id 属性，以便后续可以修改琴键的背景（用于按键反馈），id 将被设置为 `\"key\"+i`，这样我们就可以通过遍历这 21 个键轻松访问每个键。\n\n\
  ```\nvar keys = [];\n\nfor (var i = 0; i < 21; i++)  {\n    keys[i] = keyboard.rect(width/21,\
  \ height);\n    keys[i].move(width/21 * i, 0);\n    keys[i].attr({ fill: '#fff',\
  \ stroke: '#000', id: \"key\"+i });\n    // 事件处理程序添加在此处\n}\n```\n\n我们还需要为黑键添加矩形，但它们并非直接相邻，而是分成\
  \ 2 个和 3 个一组的组合，并且黑键的高度仅为键盘高度的一半多一点。为了将这些键分组，我选择简化处理：只需检查 `i` 是否是某组中的最后一个键。如果是，则将一个白键的宽度（`width/21`）加到名为\
  \ `prevKey` 的变量中，该变量用于计算黑键的位置。\n\n```\nvar bkeys = [];\nvar prev = 0;\n\nfor (var\
  \ i = 0; i < 15; i++)  {\n    bkeys[i] = keyboard.rect(width/42, height / 1.7);\n\
  \    bkeys[i].attr({ fill: '#000', stroke: '#000', id: \"bkey\"+i });\n    bkeys[i].move(prev\
  \ + (width/(21*1.3)), 0);\n    prev = prev + width/21;\n    if (i == 1 || i == 4\
  \ || i == 6 || i == 9 || i == 11)  {\n        prev += width/21;\n    }\n    // 事件处理程序添加在此处。\n\
  }\n```\n\n现在，一个键盘已经绘制到了屏幕上，如图 5-2 所示。\n\n![A978-1-4302-5945-9_5_Fig2_HTML.jpg](img/A978-1-4302-5945-9_5_Fig2_HTML.jpg)\n\
  \n**图 5-2.** 键盘布局，包含三个八度\n\n键盘布局创建完成后，我们需要添加事件处理程序，以便能够播放声音并高亮显示被按下的键。由于我们有两种输入方式（键盘和鼠标），因此需要不少事件处理程序。`SVG.js`\
  \ 使我们能够轻松地将事件处理程序绑定到每个键，通过将 `mousedown` 和 `mouseup` 事件绑定到琴键，可以方便地处理鼠标操作。`keypress`\
  \ 和 `keyup` 事件则通过向窗口添加事件监听器来处理，这是事件处理的常规方式。为了将琴键与音符绑定，我们需要为黑键（上排）和白键（中排）设置数组。由于\
  \ `keypress` 和 `keyup` 事件中每个键的键码不同，因此每种键都需要两个数组。为了获得正确的音符（因为计算机键盘没有足够的键对应所有音符），我们需要将音符位置（将\
  \ S 到 K 视为一个八度）加上该八度内的键数乘以当前八度数；这意味着黑键使用 `i + octave * 5`，白键使用 `i + octave * 7`。对于鼠标事件，我们需要使用闭包来保存计数器，因为我们必须在刚才创建的\
  \ for 循环内部为每个键绑定事件，但如果不用闭包，循环结束后 `i` 的值会是 `21` 而不是正确的值。当一个键被按下时，它需要改变颜色，并在键被释放后恢复原色（无论使用鼠标还是键盘都是如此）。对于声音，我们将使用名为\
  \ `playSound(n)` 和 `stopSound(n)` 的函数，其中 `n` 是闭包创建时的原始 `i` 值。这些更改如示例 5-1 所示。\n\n\
  **示例 5-1.**\n\n```\nvar keyboardKeys = [83,68,70,71,72,74,75];\nvar blackKeys =\
  \ [69,82,89,85,73];\nvar keyboardPressKeys = [115,100,102,103,104,106,107];\nvar\
  \ blackKeyPress = [101, 114, 121, 117, 105];\nvar octave = 1; // 其中八度 1 = 中央 C\n\
  \nvar keys = [];\n\nfor (var i = 0; i < 21; i++)  {\n    keys[i] = keyboard.rect(width/21,\
  \ height);\n    keys[i].move(width/21 * i, 0);\n    keys[i].attr({ fill: '#fff',\
  \ stroke: '#000', id: \"key\"+i });\n    keys[i].mousedown ((function(n) {\n   \
  \     return function()  {\n            var key = SVG.get(\"key\"+n);\n        \
  \    key.fill({ color: '#f06' });\n            playSound(n, false);\n        }\n\
  \    })(i));\n    keys[i].mouseup((function(n)  {\n        return function() {\n\
  \            keys[n].fill({ color: '#fff' });\n            stopSound(n, false);\n\
  \        }\n    })(i));\n}\n\nvar bkeys = [];\nvar prev = 0;\n\nfor (var i = 0;\
  \ i < 15; i++)  {\n    bkeys[i] = keyboard.rect(width/42, height / 1.7);\n    bkeys[i].attr({\
  \ fill: '#000', stroke: '#000', id: \"bkey\"+i });\n    bkeys[i].move(prev + (width/(21*1.3)),\
  \ 0);\n    prev = prev + width/21;\n    if (i == 1 || i == 4 || i == 6 || i == 9\
  \ || i == 11)  {\n        prev += width/21;\n    }\n    bkeys[i].mousedown ((function(n)\
  \ {\n        return function()  {\n            var key = SVG.get(\"bkey\"+n);\n\
  \            key.fill({ color: '#f06' });\n            playSound(n, true);\n   \
  \     }\n    })(i));\n    bkeys[i].mouseup((function(n)  {\n        return function()\
  \ {\n            bkeys[n].fill({ color: '#000' });\n            stopSound(n, true);\n\
  \        }\n    })(i));\n}\n\nwindow.addEventListener('keypress', function(e) {\n\
  \    for (var i = 0; i < keyboardPressKeys.length; i++)  {\n        if (e.keyCode\
  \ == keyboardPressKeys[i]) {\n            var n = i + octave * 7;\n            var\
  \ key = SVG.get(\"key\"+n);\n            key.fill({ color: '#f06' });\n        \
  \    playSound(n, false);\n        }\n    }\n    for (var i = 0; i < blackKeyPress.length;\
  \ i++)  {\n        if (e.keyCode == blackKeyPress[i]) {\n            var n = i +\
  \ (octave * 5);\n            var key = SVG.get(\"bkey\"+n);\n            key.fill({\
  \ color: '#f06' });\n            playSound(n, true);\n        }\n    }\n    if (e.keyCode\
  \ == 97 && octave > 0) --octave;\n    if (e.keyCode == 108 && octave < 2) ++octave;\n\
  });\n\nwindow.addEventListener('keyup', function(e) {\n    console.log(e.keyCode);\n\
  \    for (var i = 0; i < keyboardKeys.length; i++)  {\n        if (e.keyCode ==\
  \ keyboardKeys[i]) {\n            var key = SVG.get(\"key\"+(i+octave*7));\n   \
  \         key.fill({ color: '#fff' });\n            stopSound(i+octave*7, false);\n\
  \        }\n    }\n    for (var i = 0; i < blackKeys.length; i++)  {\n        if\
  \ (e.keyCode == blackKeys[i]) {\n            var n = i + octave * 5;\n         \
  \   var key = SVG.get(\"bkey\"+n);\n            key.fill({ color: '#000' });\n \
  \           stopSound(n, true);\n        }\n    }\n});\n```\n\n\n\n要播放每个音符，我们需要两个振荡器数组，一个用于黑键，一个用于白键。我们将每个振荡器连接到一个单独的增益节点上，这样我们就有了一个节点可以用来录制音乐，以及实现音量调节的潜力。显然，每个振荡器需要以正确的频率运行，我们可以自动生成这些频率，但由于我们确切知道将使用哪些按键（并且考虑到黑键之间的间隔，生成这些频率特别麻烦），我们可以像这样在数组中指定它们：\n\
  \n```javascript\nvar whiteNotes = [130.82, 146.83, 164.81, 174.61, 196, 220, 246.94,\
  \ 261.63, 293.66, 329.63,\n349.23, 392, 440, 493.88, 523.25, 587.33, 659.26, 698.46,\
  \ 783.99, 880, 987.77];\nvar blackNotes = [138.59, 155.56, 185, 207.65, 233.08,\
  \ 277.18, 311.13, 369.99, 415.3, 466.16, 554.37, 622.25, 739.99, 830.61, 932.33];\n\
  ```\n\n正如你在设置按键的代码中看到的，`playSound`和`stopSound`函数都将`i`和`black`作为参数，这样我们就可以知道正在播放音符的位置和包含其频率的数组。在`playSound`内部，我们选择振荡器，设置频率和类型，然后当然使用`osc.noteOn(0)`将其开启。\n\
  \n- `Sine`波 = 0\n- `Square`波 = 1\n- `Sawtooth`波 = 2\n- `Triangle`波 = 3\n\n我根据个人偏好选择了锯形波，但请全部尝试一下，看看你更喜欢哪个！修改后的代码如下所示：\n\
  \n```javascript\nfunction playSound(i, black) {\n    stopSound(i, black);\n    var\
  \ freq;\n    if (black) freq = blackNotes[i];\n    else freq = whiteNotes[i];\n\
  \    if (black) osc = ob[i];\n    else osc = o[i];\n    osc.type = 3;\n    osc.frequency.value\
  \ = freq;\n    console.log(freq);\n    osc.connect(gainNode);\n    osc.noteOn(0);\n\
  \    if (black) ob[i] = osc;\n    else o[i] = osc;\n}\n\nfunction stopSound(i, black)\
  \  {\n    if (black) osc = ob[i];\n    else osc = o[i];\n    if (typeof(o[i]) !=\
  \ \"undefined\") {\n        osc.noteOff(0);\n        osc.disconnect();\n       \
  \ osc = ctx.createOscillator();\n    }\n    if (black) ob[i] = osc;\n    else o[i]\
  \ = osc;\n}\n```\n\n这就是创建可弹奏键盘所需的全部内容！`Web Audio API`处理了大部分底层声音管理，所以你只需要连接节点并播放音符即可。我使用了`SVG.js`，但你可以使用任何其他内容，从头开始创建，甚至可以使用矢量程序（如`Adobe\
  \ Illustrator`）来导出`SVG`。\n\n### 录制音乐\n\n现在我们有了一个可用的键盘，我们希望能够录制并回放输出。在本章的后面，我们将添加在轨道上移动音乐片段的功能，因此我们需要存储音乐。为了将其作为独立应用使用，无需服务器或让用户下载和上传音乐而使事情复杂化，我们将使用本地存储作为轻松存储和检索音乐的方式。本地存储使用键值对工作，因此我们需要为音乐命名（可以通过用户输入或基于本地存储大小生成），并且还需要将音乐存储为值——这是比较棘手的地方。\n\
  \n我不喜欢重新发明轮子（而且正如我所说，这相当棘手），因此为了将音乐录制为`wav`编码的`blob`，我决定使用`Matt Diamond`的`Recorder.js`（可以在[`http://www.github.com/mattdiamond/Recorderjs`](http://www.github.com/mattdiamond/Recorderjs)找到）。这个库通过监听指定的`Web\
  \ Audio API`通道工作，而不是正常连接，然后启用多种方法，包括我们将用来将音频作为`blob`获取的方法（`exportWAV`）。\n\n> **注意**\n\
  > 要使用`Recorder.js`，你必须在`web`服务器上，因为它使用`web workers`来提高性能。在电脑上实现此目的的一种方法是运行`python\
  \ -m SimpleHTTPServer`。\n\n让我们开始设置记录器，让它监听我们之前创建的增益节点。在构造函数中完成此操作后，我们开始录制。\n\n```javascript\n\
  var recorder = new Recorder(gainNode, { workerPath: \"../recorderWorker.js\"});\n\
  recorder.record();\n```\n\n如你所见，这使得监听从`gainNode`到输出硬件的任何音频变得非常容易。现在，我们需要创建一个录制声音以及播放声音的函数。当我们调用`recordSound`方法时，我们需要将`blob`（即音频）存储为文本（因为`localStorage`不允许直接存储对象），因此我们使用`window.URL.createObjectURL`转换对象。要播放音乐，我们动态创建一个新的`Audio`元素（尽管无需将其附加到`DOM`），其`src`链接到`localStorage`中存储的`URL`。为了使其可扩展，以便我们可以拥有许多音乐片段，每个函数都有一个名为`name`的参数，该参数成为`localStorage`的键（其中对象`url`是值）。由于对象`URL`的创建方式，要以任何方式使用它们，你需要将它们添加为音频元素的`src`。由于为每个片段这样做效率低下，因此更好的方法是在录制期间计算出持续时间，并将其与对象`URL`一起作为一个对象，然后使用`JSON`将其转换为字符串。\n\
  \n```javascript\nfunction recordSound(name)  {\n    recorder.exportWAV(function(blob)\
  \ {\n        var object =  {\n            file: window.URL.createObjectURL(blob),\n\
  \            size: recordEnd - recordStart\n        }\n        localStorage[name]\
  \ = JSON.stringify(object);\n        drawTimeline();\n    });\n}\n\nfunction playAudio(id)\
  \  {\n    var audio = new Audio(JSON.parse(localStorage[localStorage.key(id)]).file);\n\
  \    audio.play();\n}\n```\n\n使用`Recorder.js`，我们可以轻松录制`Web Audio API`能够产生的任何音频，无论是生成的音符还是吉他等输入。这使得在客户端存储录音并播放它们变得很容易。\n\
  \n\n\n## 时间线\n\n现在键盘已经可以正常工作，录制音频的一切也已准备就绪，接下来让我们创建界面。为了避免项目过于复杂，我们将保持设计简洁：只需一个包含时间线的键盘，用于放置音乐片段，以及用于录制、播放和停止时间线的按钮。页面加载时，`localStorage`\
  \ 中的片段需要显示为矩形，其宽度与片段的时长成正比。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>音乐理论</title>\n\
  <style>\n* { margin: 0; }\nbody { background-color: #747e88; }\na { color: #d4dfcf;\
  \ cursor: pointer;}\na:hover, a:focus  { color: #E4eee3; }\n.controls a { display:\
  \ inline-block; padding: 10px; }\n.recording { background-color: #d68189; }\n#tracks\
  \  { height: 300px; width: 100%; }\n#keyboard  { height: 300px; position: relative;\
  \ width: 100%; }\n</style>\n</head>\n<body>\n<div class=\"controls\">\n<a id=\"\
  record\">录制</a>\n<a id=\"play\">播放</a>\n<a id=\"stop\">停止</a>\n</div>\n<div id=\"\
  tracks\"></div>\n<div id=\"keyboard\"></div>\n<script src=\"../svg.js\"></script>\n\
  <script src=\"../svg.draggable.js\"></script>\n<script src=\"../recorder.js\"></script>\n\
  <script src=\"../recorderWorker.js\"></script>\n<script src=\"script.js\"></script>\n\
  </body>\n</html>\n```\n\n从页面顶部的按钮开始，每个按钮都需要一个点击事件监听器，其回调函数负责执行指定任务。播放和停止按钮只需切换一个\
  \ `play` 变量，用于判断当前时间的时间线指示条是否应该移动。录制按钮则需要切换录制状态，包括使用录制器录制增益节点、切换按钮上的录制类，以及设置用于计算时长的\
  \ `recordStart` 和 `recordEnd` 变量。我们使用提示框来获取音乐片段的名称。虽然可以在界面内实现，但为了简洁起见，我直接使用了提示框。\n\
  \n```javascript\nvar toggleRecord = false;\nvar recordStart;\nvar recordEnd;\nvar\
  \ recorder;\n\ndocument.querySelector(\"#record\").addEventListener('click', function()\
  \ {\n  if (!toggleRecord) {\n    recorder = new Recorder(gainNode, { workerPath:\
  \ \"../recorderWorker.js\"});\n    recorder.record();\n    recordStart = Date.now();\n\
  \    document.querySelector(\"#record\").className = \"recording\";\n    toggleRecord\
  \ = !toggleRecord;\n  }\n  else {\n    recordEnd = Date.now();\n    document.querySelector(\"\
  #record\").className = \"\";\n    toggleRecord = !toggleRecord;\n    recordSound(prompt(\"\
  声音片段名称：\"));\n  }\n});\n\ndocument.querySelector(\"#play\").addEventListener('click',\
  \ function() {\n  play = true;\n});\n\ndocument.querySelector(\"#stop\").addEventListener('click',\
  \ function() {\n  play = false;\n});\n```\n\n按钮准备就绪后，我们开始构建实际的时间线。与键盘一样，这里使用 SVG。空的时间线仅包含代表每个音轨的线条，因此我们需要一个变量来定义音轨数量（便于调整所需数量）。绘制线条时，需要绘制（音轨数量\
  \ + 1）条线，以便形成底部边框。`trackPos` 变量用于确定每个音轨的高度，并将每个音轨定位在正确的位置。\n\n```javascript\nvar\
  \ timelineWidth = document.querySelector(\"#tracks\").clientWidth;\nvar timelineHeight\
  \ = document.querySelector(\"#tracks\").clientHeight;\nvar tracks = SVG('tracks');\n\
  var play = false;\nvar numOfTracks = 5;\nvar track = [];\nvar trackPos = timelineHeight\
  \ / numOfTracks;\nvar clippings = [];\n\ndrawTimeline();\n\nfunction drawTimeline()\
  \ {\n  tracks.clear();\n  for (var i = 0; i <= numOfTracks; i++) {\n    track[i]\
  \ = tracks.line(0, timelineHeight / numOfTracks, timelineWidth, trackPos);\n   \
  \ track[i].move(0, trackPos * i);\n    track[i].attr({ stroke: '#DAC8B0', id: \"\
  track\" + i });\n  }\n  // 此处放置片段\n}\n```\n\n音乐片段是与时间线位于同一 SVG 中的矩形，因为它们属于时间线的一部分，并根据音乐片段的时长来表示它。每个矩形都需要可拖动，以便在音轨间移动。我们可以像第\
  \ 2 章那样使用事件监听器，但由于我们使用了 SVG.js，可以直接使用其插件，该插件位于 [`https://github.com/wout/svg.draggable.js`](https://github.com/wout/svg.draggable.js)。要使矩形可拖动，只需包含脚本，然后在矩形上调用\
  \ `.draggable()` 方法即可。由于矩形位于时间线 SVG 内部，使其可拖动意味着它只能在该 SVG 内拖动，而不会越过应用程序的其他组件。尽管如此，它仍然可以被拖出\
  \ SVG 边界，但会不可见，因此我们需要阻止它超出范围。我们还需要让矩形在音轨之间吸附。为此，需要检查矩形是否在每个音轨的边界内；如果不在，则取位置的天花板值，使其吸附到某个音轨。每个矩形还需要一些跟随其移动的文本，用于标注音乐的名称。在图\
  \ 5-3 中，你可以看到录制并放置几个音频片段到时间线后的效果。\n\n![A978-1-4302-5945-9_5_Fig3_HTML.jpg](img/A978-1-4302-5945-9_5_Fig3_HTML.jpg)\n\
  \n**图 5-3.** 完成后的项目，显示时间线中不同音轨上放置了预先录制的音乐\n\n在代码清单 5-2 中，你可以看到使矩形可拖动并在时间线上吸附所需的最终修改。\n\
  \n**代码清单 5-2.**\n\n```javascript\nvar clippings = [];\n\ndrawTimeline();\n\nfunction\
  \ drawTimeline() {\n  tracks.clear();\n  for (var i = 0; i <= numOfTracks; i++)\
  \ {\n    track[i] = tracks.line(0, timelineHeight / numOfTracks, timelineWidth,\
  \ trackPos);\n    track[i].move(0, trackPos * i);\n    track[i].attr({ stroke: '#DAC8B0',\
  \ id: \"track\" + i });\n  }\n  for (var i = 0; i < localStorage.length; i++) {\n\
  \    var clipping = JSON.parse(localStorage[localStorage.key(i)]);\n    clippings[i]\
  \ = tracks.rect(timelineWidth / 120 * clipping.size / 120, trackPos);\n    clippings[i].attr(\
  \ { fill: \"#C6A49A\" } );\n    clippings[i].move(150, trackPos * 3);\n    var text\
  \ = tracks.text(localStorage.key(i)).move(clippings[i].x() + 10, clippings[i].y()\
  \ + 10).front();\n    text.attr( { fill: \"#fff\", id: \"text\" + i });\n    clippings[i].draggable();\n\
  \    clippings[i].dragend = (function(text) {\n      return function() {\n     \
  \   if (this.y() < 0)\n          this.move(this.x(), 0);\n        if (this.y() >\
  \ timelineHeight - trackPos)\n          this.move(this.x(), height - trackPos);\n\
  \        else\n          this.move(this.x(), Math.ceil(this.y() / trackPos) * trackPos);\n\
  \        text.move(this.x() + 10, this.y() + 10);\n      }\n    })(text);\n    clippings[i].dragmove\
  \ = (function(text) {\n      return function() {\n        text.move(this.x() + 10,\
  \ this.y() + 10);\n      }\n    })(text);\n  }\n}\n```\n\n本章的最终代码可以在常规位置找到，即 Apress\
  \ 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442) 上本书的可下载配套资源，或我自己的网站\
  \ [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)。\n\
  \n## 总结\n\n现在我们拥有了一个音乐创作网页应用的雏形。从这里出发，有许多方向可以探索，例如改变音符的音调或增加静音音轨的功能。我们将在下一章把这个音乐创作应用集成到将要创建的媒体播放器中。希望本章能让你充分领略\
  \ Web Audio API 的能力，并积累一些使用 SVG 和本地存储的经验。\n\n\n\n"
- "# 6. 音乐播放器\n\n到目前为止，我们已经简要游览了声音与图形的蜿蜒之路。我们从 Canvas 起步，探索了二维世界与动画的世界；随后跨越到视频和音频\
  \ HTML 元素以及 Web Audio API，利用 Canvas 创建了频谱图等工具来可视化音乐。接着我们又一头扎进三维图形世界，在那里摆弄各种光照与材质，学习它们之间的相互作用。第\
  \ 5 章看似完全放弃了图形（当然除了使用 SVG），纯粹聚焦于音乐，通过 JavaScript 生成音符，无需任何插件或音频文件，只需一个实现了 Web Audio\
  \ API 的浏览器即可。不过，我想在第 3 章（我们研究了所用编解码器并介绍了 Web Audio API）的基础上更进一步，专注于音频文件，并构建那个我一直提及的媒体播放器。\n\
  \n本章将收束前几章的所有未尽之处。我们将制作一个媒体播放器，它既包含前一章的音乐创作功能，又集成了一个 3D 可视化器（基于 Steven Wittens 的\
  \ js1k 演示）。这个可视化器不像频谱图那样偏向工具性，而更像你可能在 Winamp 等媒体播放器上见过的艺术效果。\n\n## 媒体播放器\n\n我想采用与前面章节不同的方式来切入。之前我是向你分块教授某个主题领域（比如声音）的知识。但本章我更希望它像一个待完成的项目，而非单纯的讲授。构建这样一个大型应用有众多方法，可添加的功能也五花八门，因此我将先定义应用的规格说明，至于你是按照我的方式还是另辟蹊径，都悉听尊便。\n\
  \n### 规格说明\n\n我们的音乐播放器必须完全运行在客户端，因此除了通过 URL 播放托管音乐所需的服务器之外，不应依赖任何其他服务器。必须提供多种音乐来源选项，包括本地机器以及可能的服务（如\
  \ Tomahawk）。当然，与任何媒体播放器一样，必须有暂停、播放和停止按钮，并且至少支持一个播放列表的功能。正如我前面提到的，我们将把音乐创作应用和 3D\
  \ 可视化器集成到播放器中。这些功能会融入应用，但仍有很大的扩展空间，比如开发一个插件系统来解耦各项功能。\n\n### 从何入手\n\n现在，我们需要思考如何最佳地组织数据和界面，使它们既不过度耦合，又能相互影响。实现方式有很多种，但由于\
  \ Backbone 在这方面非常流行，我建议使用 Backbone。我不会假定你已具备相关背景知识（尽管这也不是它的使用教程），因此我会在用到每个部分时快速加以解释。\n\
  \n### 播放列表\n\n音乐播放器的主要功能是播放列表中的曲目。因此，从这个功能入手是合理的：我们可以拥有多个命名的播放列表（示例中使用了拉丁和雷鬼），每个列表中存储着曲目。曲目应包含名称、艺术家名称和\
  \ URL。URL 可用于播放本地和远程来源的音乐，以及我们在第 5 章中用于存储音乐的 Data URI。\n\n#### 模型\n\n在 Backbone\
  \ 中，分别使用 `Backbone.Model.extend()` 和 `Backbone.Collection.extend()` 来创建模型类和集合类。模型本质上是一个经过\
  \ Backbone 特性增强的数组，而集合则是存储多个模型的一种方式（这是许多编程语言中常见的概念，但在 JavaScript 中并非原生）。每个模型都可以有默认值（defaults），它们是一些简单的对象，用于在数据不完整时提供默认内容。集合有一个名为\
  \ `model` 的属性，用于指定应使用的模型类。我决定使用一个名为 `backbone.localstorage.js` 的 Backbone `localStorage`\
  \ 插件，只需在集合中添加属性 `localStorage: new Backbone.LocalStorage(\"playlists\")` 即可启用。\n\
  \n为此，我们需要将实体分离为模型：`Playlist` 模型包含一个名称以及一个 `Tracks` 数组，这样我们就可以拥有一系列播放列表，每个播放列表各自包含曲目和名称。每个\
  \ `Track` 模型则包含名称、艺术家和 URL，如前所述。之所以需要为每个播放列表建立一个模型，而不仅仅是一个曲目集合，是因为集合无法命名，而播放列表的目的正是将曲目归类到有意义的列表中（例如按音乐流派）。\n\
  \n```\nvar Track = Backbone.Model.extend({\n\n  defaults: {\n\n      title: \"Unknown\"\
  , // 标题：未知\n\n      artist: \"Unknown\", // 艺术家：未知\n\n      url: \"Unknown\" //\
  \ 链接：未知\n\n  }\n\n});\n\nvar Playlist = Backbone.Model.extend({\n\n  defaults: {\n\
  \n      title: \"Untitled Playlist\", // 标题：未命名播放列表\n\n      tracks: [] // 曲目：空数组\n\
  \n  }\n\n});\n\nvar Playlists = Backbone.Collection.extend({\n\n  model: Playlist,\n\
  \n  localStorage: new Backbone.LocalStorage(\"playlists\")\n\n});\n\nvar playlists\
  \ = new Playlists();\n```\n\n\n\n### 视图\n\n我们使用`Backbone.View.extend()`创建视图来展示模型和集合。视图是一种封装模型所有方法和事件处理程序的方式，使得每个视图能够自行管理其所关联的数据，而不必操心众多不同的数据。更重要的是，视图还是一种将模型中的数据与模板连接起来的方式，这些模板用于生成渲染数据到页面的\
  \ HTML。通常，一个视图会处理单个模型，因此你需要定义一个模型和一个视图。不幸的是，视图可以处理集合，但只能将其视为一个整体模型。我们需要创建处理模型视图的列表视图，这样每个模型视图可以附加一个事件，而不是让整个集合来处理事件。因此，为了拥有一个既显示播放列表名称列表又显示播放列表本身的界面，我们需要为每个列表创建一个列表视图，并为每个单独的模型创建一个视图。我将列表视图命名为`PlaylistListView`和`TrackListView`，这样它们的含义就一目了然了。当然，我选择`TrackList`而不是`Playlist`是为了避免名称重复，并且这样命名更清晰一些。每个列表都有其对应模型的视图，即`PlaylistView`和`TrackView`，每个列表视图中可以根据需要创建任意多个此类视图。图\
  \ 6-1 以图形方式展示了这些视图之间的关系。\n\n![A978-1-4302-5945-9_6_Fig1_HTML.jpg](img/A978-1-4302-5945-9_6_Fig1_HTML.jpg)\n\
  \n图 6-1. 一个展示了具有两个可点击列表项的列表的界面所需的视图\n\n`PlaylistListView`是一个按名称列出每个播放列表的视图，因此它可以直接绑定到一个`id`为`playlists`的`div`。这个视图不负责渲染到模板的任何数据，因此我们可以直接进行下一步：在初始化方法中，将`playlists`集合中的每个模型绑定到一个名为`renderItem`的函数上，该函数为集合中的每个播放列表模型创建一个`playlistView`并将其渲染到屏幕上。当然，视图还需要一个`render`函数，以便对每个模型调用`renderItem`。我通过使用\
  \ Underscore 的`_.each`遍历模型，获取每个模型的 JSON 数据，然后将其传递给`renderItem`函数来实现这一点。`TrackListView`的工作原理相同，它为播放列表的`tracks`数组中的每个`Track`模型渲染一个`TrackView`。\n\
  \n```\nvar PlaylistListView = Backbone.View.extend({\n\nel: \"#playlists\",\n\n\
  model: playlists,\n\ninitialize: function() {\n\nthis.listenTo(this.model, \"change\"\
  , this.render);\n\nthis.bind('render', this.render);\n\n_.bindAll(this, \"renderItem\"\
  );\n\n},\n\nrenderItem: function(model){\n\nvar playlistView = new PlaylistView({model:\
  \ model});\n\nplaylistView.render();\n\n$(this.el).append(playlistView.el);\n\n\
  },\n\nrender: function(){\n\n$(\"#playlists\").html('');\n\nvar self = this,\n\n\
  html = '';\n\n_.each(this.model.toJSON(), function(mod) {\n\nself.renderItem(mod);\n\
  \n});\n\n}\n\n});\n\nvar TrackListView = Backbone.View.extend({\n\nel: $(\"#tracks\"\
  ),\n\ninitialize: function(){\n\nthis.bind('changePlaylist', this.changePlaylist);\n\
  \n_.bindAll(this, \"renderItem\");\n\n},\n\nrenderItem: function(model){\n\nvar\
  \ trackView = new TrackView({model: model});\n\ntrackView.render();\n\n$(this.el).append(trackView.el);\n\
  \n},\n\nrender: function(){\n\n$(\"#tracks\").html('');\n\nif (this.model)  {\n\n\
  var self = this,\n\nhtml = '';\n\n_.each(this.model.toJSON().tracks, function(mod)\
  \ {\n\nself.renderItem(mod);\n\n});\n\n}\n\n},\n\nchangePlaylist: function(current)\
  \  {\n\nif (!this.model && current) {\n\nthis.model = current;\n\n}\n\nthis.render();\n\
  \n}\n\n});\n```\n\n单个视图的工作方式类似，但显然它们只需要渲染自身，而不需要渲染整个集合的内容。这些视图还使用 Underscore 模板将数据渲染到页面上。每个视图都有双击事件，这些事件会触发一个名为`play`的函数。在`PlaylistView`中，`play`函数会触发一个事件，使得`App`播放播放列表中的第一首曲目；而在`TrackView`中，`play`函数用于播放特定的曲目。\n\
  \n```\nvar PlaylistView = Backbone.View.extend({\n\ntagName: \"li\",\n\ntemplate:\
  \ _.template($('#playlist-template').html()),\n\nevents: {\n\n\"dblclick\"  : \"\
  play\"\n\n},\n\nrender: function() {\n\nvar html = this.template(this.model);\n\n\
  $(this.el).html(html);\n\nreturn this;\n\n},\n\nplay: function()  {\n\nthis.trigger('play');\n\
  \n}\n\n});\n\nvar TrackView = Backbone.View.extend({\n\ntagName: \"li\",\n\ntemplate:\
  \ _.template($('#track-template').html()),\n\nevents: {\n\n\"dblclick\"  : \"play\"\
  \n\n},\n\nrender: function() {\n\nif(this.model)  {\n\nvar html = this.template(this.model);\n\
  \n$(this.el).html(html);\n\n}\n\nreturn this;\n\n},\n\nplay: function()  {\n\nconsole.log(\"\
  Playing \" + this.model.title);\n\nplayer.trigger(\"play\", this.model);\n\n}\n\n\
  });\n```\n\n### 播放器对象\n\n你会注意到我调用了一个`player`上的函数，这个对象负责管理声音。默认情况下，该对象存储`el`作为快速访问`$(\"\
  #player\")`（一个音频元素）的方式，同时它将当前曲目 ID 存储为`track`并默认为`null`。状态默认为`\"paused\"`，用于判断曲目是否正在播放。要切换曲目，我们只需要一个`setTrack`函数，将`track`设置为新的曲目\
  \ ID。当然，播放器需要能够播放音乐，因此需要一个`play`函数；它需要接受一个可选的曲目 ID 作为参数，以便将其添加到音频元素的`src`中。\n\n\
  ```\nvar Player = Backbone.View.extend({\n\n    el : \"#player\",\n\n    track :\
  \ null,\n\n    state : \"paused\",\n\n    initialize: function()  {\n\n      this.bind('play',\
  \ this.play);\n\n      this.bind('pause', this.pause);\n\n    },\n\n    setTrack\
  \ : function(track)  {\n\n      this.track = track;\n\n    },\n\n    play : function(track)\
  \  {\n\n      // 如果设置了曲目，则播放新歌。否则播放当前的 src（用于暂停恢复）。\n\n      if (track)  {\n\n \
  \       this.setTrack(track);\n\n        $(this.el).attr(\"src\", track.url).appendTo($(this.el).parent());\n\
  \n      }\n\n      $(\"#togglePlaying\").html(\"Pause\");\n\n      this.state =\
  \ \"playing\";\n\n      this.el.play();\n\n    },\n\n    pause : function()  {\n\
  \n      $(\"#togglePlaying\").html(\"Play\");\n\n      this.state = \"paused\";\n\
  \n      this.el.pause();\n\n    }\n\n  });\n\n  var player = new Player();\n```\n\
  \n\n\n### 主应用视图\n\n好的，我们已经有了大量构成应用基础的代码，但目前它实际上不会执行任何操作，因为没有任何代码被关联起来。正是这个视图负责了解当前播放列表，以及管理所有视图之间（以及任何不在视图内的元素）的交互。由于页面上的每个列表视图都只有一个实例，`AppView`\
  \ 将列表视图作为单例来处理，因此每个列表视图在应用中最多只能有一个实例在使用。\n\n到目前为止，我们需要的只是一个基础界面，包含每个视图的元素以及用于触发新建播放列表和添加曲目提示的两个链接。这些元素就是普通的\
  \ HTML 元素，其使用方法与不使用 Backbone 时相同，唯一的区别是我们还需要引入依赖关系（包括 Backbone）作为脚本。\n\n```\n<div\
  \ id=\"app\">\n  <a id=\"new-playlist\">新建播放列表</a>\n  <a id=\"new-track\">添加曲目</a>\n\
  \  <ul id=\"playlists\"></ul>\n  <ul id=\"tracks\"></ul>\n  <div id=\"player-controls\"\
  >\n    <a id=\"togglePlaying\">播放</a>\n  </div>\n</div>\n<audio id=\"player\"></audio>\n\
  <script src=\"../vendor/jquery.min.js\"></script>\n<script src=\"../vendor/underscore.min.js\"\
  ></script>\n<script src=\"../vendor/backbone.min.js\"></script>\n<script src=\"\
  ../vendor/backbone.localStorage.js\"></script>\n<script src=\"js/app.js\"></script>\n\
  ```\n\n数据使用 Underscore 的模板引擎进行处理。模板定义在主 HTML 文件的 script 标签内。\n\n```\n<script type=\"\
  text/template\" id=\"playlist-template\">\n  <li><%= title %></li>\n</script>\n\
  <script type=\"text/template\" id=\"track-template\">\n  <li>\n    <%= title %>\n\
  \    <%= artist %>\n  </li>\n</script>\n```\n\n`AppView` 负责处理与 DOM 的交互；在 Backbone\
  \ 中，通过定义事件类型，后跟用于查找元素的选择器，再跟一个值（即应触发的函数名称）来处理事件。 `AppView` 将使用我们本章前面创建的模型（例如 `playlists`）。您可以在下面的代码中看到事件监听器是如何设置的，以及我们将用于开发\
  \ `AppView` 的结构。\n\n```\nvar AppView = Backbone.View.extend({\n  el: $(\"#app\"\
  ),\n  currentPlaylist: -1, // 播放列表的索引\n  trackListView : new TrackListView(),\n\
  \  playlistListView : new PlaylistListView(),\n  events: {\n    \"click #clear-completed\"\
  : \"clearCompleted\",\n    \"click #toggle-all\": \"toggleAllComplete\",\n    \"\
  click #new-playlist\":  \"createPlaylist\",\n    \"click #new-track\":  \"createTrack\"\
  ,\n    \"click #togglePlaying\" : \"togglePlay\"\n  },\n  initialize: function()\
  \ { },\n  changePlaylist: function(id)  { },\n  createPlaylist: function(e) { };\n\
  \  createTrack: function(url) { },\n  handleDrop: function(e) { },\n  play: function()\
  \  { },\n  preventDefault: function(e) { },\n  render: function()  { },\n  renderTracks:\
  \ function() { },\n  renderPlaylists: function() { },\n  togglePlay: function()\
  \  { }\n});\nvar App = new AppView;\n```\n\n在 `initialize` 函数内部，我们将设置 Backbone 事件（与\
  \ DOM 事件相对），这些事件在模型上触发事件时触发函数。第一个函数是 `renderPlaylists`，其目的是每当播放列表需要更改时，它可以在 `playlistListView`\
  \ 上进行渲染以更新页面上的播放列表。还有一个用于渲染的函数叫做 `render`，它被用作一个全捕获函数来同时渲染播放列表和曲目。render 函数会调用 `renderPlaylists`\
  \ 和 `renderTracks`。后者通过确保要渲染的播放列表（即播放列表中的实际曲目）具有存储在 `currentPlaylist` 中的当前 id 来工作。然而，它应该始终是正确的，因为要更改播放列表，我们首先有一个\
  \ `changePlaylist` 函数，该函数既更改 `currentPlaylist` id，也更改 `trackListView` 的播放列表模型。\n\
  \n```\nchangePlaylist: function(id)  {\n  this.currentPlaylist = id;\n  this.render();\n\
  },\nrender: function()  {\n  this.renderTracks();\n  this.renderPlaylists();\n},\n\
  renderTracks: function() {\n  if (this.currentPlaylist != -1)  {\n    var current\
  \ = playlists.get(this.currentPlaylist);\n    this.trackListView.trigger('changePlaylist',\
  \ current);\n  }\n},\nrenderPlaylists: function() {\n  this.playlistListView.trigger('render');\n\
  }\n```\n\n现在我们只剩下两个函数需要创建——用于添加新播放列表和曲目的函数。创建一个新播放列表非常简单，因为我们可以通过一个提示框获取播放列表名称，然后只需在\
  \ `playlists` 集合上使用 Backbone 的 `create` 函数创建一个新的播放列表即可。然而，对于 `createTrack` 函数，我们需要做更多的工作。我们需要获取\
  \ `trackName`、`trackArtist` 和 `trackUrl`，所有这些我们都可以通过提示框来请求，除非有 URL 被传递给该函数（例如用于我们稍后将添加的拖放功能），在这种情况下，该\
  \ URL 被用作 `trackUrl`。然后，我们需要检查是否存在一个有曲目的播放列表。如果尚未设置 `currentPlaylist`，那么如果存在任何播放列表，我们就只使用第一个。由于曲目存储在模型内的一个数组中，我们需要稍微绕开默认的\
  \ Backbone 行为，因为你可以替换数组，但不能向其中添加。为此，我们检索当前的曲目数组，然后将新曲目添加到该数组中。将新曲目添加到数组后，我们可以用包含该曲目的“新”数组覆盖模型中的数组。完成后，现在是将曲目渲染到页面上的时候了。\n\
  \n```\ncreatePlaylist: function(e) {\n  var playlistName = prompt(\"播放列表名称\");\n\
  \  playlists.create({title: playlistName});\n},\ncreatePlaylist: function(e) {\n\
  \  var playlistName = prompt(\"播放列表名称\");\n  playlists.create({title: playlistName});\n\
  },\ncreateTrack: function(url) {\n  var trackName = prompt(\"曲目名称\");\n  var trackArtist\
  \ = prompt(\"曲目艺术家\");\n  var trackUrl = (typeof(url) === \"string\") ? url : prompt(\"\
  曲目 URL\");\n  if (trackName && playlists.models[0]) {\n    if (this.currentPlaylist===-1)\
  \ this.currentPlaylist = playlists.models[0].id;\n    var tracks = playlists.get(this.currentPlaylist).get(\"\
  tracks\");\n    tracks.push({ title: trackName, artist: trackArtist, url: trackUrl\
  \ });\n    playlists.get(this.currentPlaylist).save({ tracks : tracks});\n    this.renderTracks();\n\
  \  }\n},\n```\n\n\n\n### 拖放功能\n\n如果你回忆一下第 2 章的内容，应该还记得我们在涂色书应用中使用过拖放功能。拖拽文件是让文件进入应用最直观的方式之一，因此将其用于添加新音轨也合情合理。当前版本会将拖入的音轨添加到当前播放列表中，但我建议你进行修改，尝试通过将音轨拖放到播放列表名称上来将其添加到指定列表。我重构了第\
  \ 2 章中的原始代码，旨在展示在其他类型文件上使用拖放功能的相似性。首先，我们设置事件监听器，按需调用`preventDefaults`和`handleDrop`。`handleDrop`函数用于从拖放的文件中选取第一个文件，并转发给`createTrack`——即主`App`视图中负责将音轨添加到播放列表的函数。这是利用已有代码轻松添加新功能的一个绝佳范例！遗憾的是，我们无法直接使用\
  \ Backbone 事件，因为（在撰写本文时）尚无法阻止事件冒泡。为获取音轨名称和艺术家信息，我认为使用提示框是最简单的方法。此处代码还有两处可优化之处，建议你尝试实现：一是支持拖放多个文件，二是改进界面，避免使用提示框（或者你也可以尝试从文件的元数据中获取信息）。\n\
  \n在 `AppView` 的初始化函数中，我们放置事件监听器：\n\n```javascript\nwindow.addEventListener('dragover',\
  \ this.preventDefault, false);\nwindow.addEventListener('dragenter', this.preventDefault,\
  \ false);\nwindow.addEventListener('drop', this.handleDrop, false);\n```\n\n我们还需要在\
  \ `AppView` 中添加 `handleDrop` 和 `preventDefault` 函数：\n\n```javascript\nhandleDrop:\
  \ function(e) {\n      e.stopPropagation();\n      e.preventDefault();\n      var\
  \ file = e.dataTransfer.files[0];\n      reader = new FileReader();\n      reader.readAsDataURL(file);\n\
  \      reader.onload = (function(theFile) {\n        return function(e) {\n    \
  \      App.createTrack(e.target.result);\n        };\n      })(file);\n    },\n\
  \    preventDefault: function(e) {\n      if (e.preventDefault) {\n        e.preventDefault();\n\
  \      }\n      return false;\n    },\n```\n\n### 集成音乐创作功能\n\n现在我们来集成上一章中的音乐创作功能，这样我们就可以创建自己的音轨并添加到播放列表中。这听起来像是简单的任务，事实也基本如此，但之前我们让创作者的工作方式导致包含播放列表的\
  \ `localStorage` 会出问题（因为它使用计数器而非哈希值作为 ID）。所以我们需要先修复这个问题！\n\n当前，音乐创作应用中每条 `localStorage`\
  \ 记录的键是通过计数器来遍历和查找特定剪贴片段的。这种方法通常很糟糕，因为如果某个 ID 被移除，可能会破坏循环；而且，正如我刚才提到的，当存储中存在其他类型的键值对时，它也无法很好地工作。如果你查看使用\
  \ Backbone 插件生成的 `localStorage`，会发现所有键都带有一个作为命名空间前缀的字符串。此外，还有一个与命名空间同名的键，其值是一个列表（即经过\
  \ `JSON.stringify` 处理的数组），包含所有剪贴片段的名称，这样我们就可以通过遍历数组中的每个名称来找到对应的键，从而实现对所有键的迭代。\n\n\
  在 `recordSound` 函数中，我们需要进行修改，使得对象在存储时键前面正确带上命名空间。同时，还需要像之前解释的那样，将键添加到命名空间的值中。因此我们需要检查命名空间是否存在，以便追加新键或创建新的命名空间。当需要访问数据时，可以使用\
  \ `JSON.parse(localStorage[\"clippings-\" + clippingNames[i]])`。\n\n```javascript\n\
  function recordSound(name)  {\n    recorder.exportWAV(function(blob) {\n       \
  \ var object =  {\n            file: window.URL.createObjectURL(blob),\n       \
  \     size: recordEnd - recordStart\n        }\n        if (localStorage[\"clippings\"\
  ]) {\n            var clippings = JSON.parse(localStorage[\"clippings\"]);\n   \
  \         clippings.push(name);\n            localStorage[\"clippings\"] = JSON.stringify(clippings);\n\
  \        }\n        else  {\n            localStorage[\"clippings\"] = JSON.stringify([name]);\n\
  \        }\n        localStorage[\"clippings-\"+name] = JSON.stringify(object);\n\
  \        drawTimeline();\n    });\n}\n```\n\n包含上述修改的最终版键盘代码，可在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
  \ 或我个人的网站 `www.shanehudson.net/javascript-creativity` 提供的在线下载资源中找到。\n\n\n\n### 音乐可视化\n\
  \n到目前为止，我们讨论的大部分内容（例如设计模式或乐理）都有规则可循。但这一步没有。你可以将音乐可视化视为一门艺术，我们所使用的大部分数学知识都只是松散地基于三角函数等概念，我们可以调整这些数值使视觉效果变得有趣。我深受\
  \ Steven Wittens 的启发（[`http://www.acko.net`](http://www.acko.net/)），他在这个领域非常活跃，通过撰写文章、在会议上演讲以及创建演示项目，全部使用数学来创造有趣的视觉效果。在本节中，我修改了\
  \ Steven 的 js1k 参赛作品，使其能与音乐播放器配合使用，因为他已经就此写了一篇深入的文章（[`http://acko.net/blog/js1k-demo-the-making-of`](http://acko.net/blog/js1k-demo-the-making-of)），我强烈推荐阅读！\n\
  \n图 6-2 中展示的可视化效果，是一个带有曲线的 2D 画布，方块会随着音乐的节奏在曲线上移动。由于它基于 Steven 的文章，因此我不会深入细节，但我想挑出一些关键点，这些点通常可用于其他项目。首先，请查看\
  \ `visualizer.js` 的完整代码清单。我试图清理代码，但由于它最初是为了高度优化而创建的，因此某些部分可能仍未使用最佳实践。\n\n![A978-1-4302-5945-9_6_Fig2_HTML.jpg](img/A978-1-4302-5945-9_6_Fig2_HTML.jpg)\n\
  \n*图 6-2. 播放 Kevin MacLeod 创作的 Bassa Island Game Loop 时的音乐可视化效果*\n\n```\n// Polyfill\
  \ for RequestAnimationFrame\n(function() {\nvar requestAnimationFrame = window.requestAnimationFrame\
  \ || window.mozRequestAnimationFrame ||\nwindow.webkitRequestAnimationFrame || window.msRequestAnimationFrame;\n\
  window.requestAnimationFrame = requestAnimationFrame;\n})();\n\nfunction visualizer()\
  \ {\nw = $('#visualizer').width();\nh = $('#visualizer').height();\ng = $('#visualizer')[0].getContext(\"\
  2d\");\nratio = w / h;\ng.globalCompositeOperation = \"lighter\";\ng.scale(w / 2\
  \ / ratio, h / 2);\ng.translate(ratio, 1);\nlw = 45 / h;\na = r = d = 0;\nXt = Yt\
  \ = Zt = Xi = Yi = Zi = x = y = z = X = Y = Z = frames = 0;\nlastPointVisible =\
  \ false;\ntime = u = -8;\nrequestAnimationFrame(draw);\n}\n\nfunction draw() {\n\
  freqData = new Uint8Array(analyser.frequencyBinCount);\nanalyser.getByteFrequencyData(freqData);\n\
  if (!$(\"#player\")[0].paused)  {\nvar average = getAverage(freqData);\nconsole.log(average);\n\
  //console.log(freqData);\nif (average > 0)  {\nfor (frames = 0; frames < 70; frames++)\
  \ {\nXt = (average/100) * 18 - 9;\nYt = (average/100) * 18 - 9;\nZt = (average/100)\
  \ * 18 - 9;\n}\nXi = interpolate(Xi, Xt);\nYi = interpolate(Yi, Yt);\nZi = interpolate(Zi,\
  \ Zt);\nX  = interpolate(X,  Xi);\nY  = interpolate(Y,  Yi);\nZ  = interpolate(Z,\
  \  Zi);\nyaw   = Math.atan2(Z, -X * 2);\npitch = Math.atan2(Y * 2, Math.sqrt(X *\
  \ X + Z * Z));\ntime += 0.05;\ng.clearRect(-ratio, -1, 2 * ratio, 2);\nfor (i =\
  \ 16; i; --i) {\nv = 0;\nfor (pointIndex = 45; pointIndex;) {\npointIndex--;\noffset\
  \ = time - pointIndex * 0.03 - i * 3;\nlongitude = Math.cos(offset + Math.sin(offset\
  \ * 0.31)) * 2\n+ Math.sin(offset * 0.83) * 3 + offset * 0.02;\nlatitude = Math.sin(offset\
  \ * 0.7) - Math.cos(3 + offset * 0.23) * 3;\ndistance = Math.sqrt(pointIndex+.2);\n\
  z = Math.cos(longitude) * Math.cos(latitude) * distance;\ny = Math.sin(longitude)\
  \ * Math.cos(latitude) * distance;\nz = Math.sin(latitude) * distance;\nx -= X;\
  \ y -= Y; z -= Z;\nx2 = x * Math.cos(yaw) + z * Math.sin(yaw);\ny2 = y;\nz2 = z\
  \ * Math.cos(yaw) - x * Math.sin(yaw);\nx3 = x2;\ny3 = y2 * Math.cos(pitch) + z2\
  \ * Math.sin(pitch);\nz3 = z2 * Math.cos(pitch) - y2 * Math.sin(pitch);\nh = !pointIndex;\n\
  g.lineWidth = lw * (2 + h) / z3;\nx = x3 / z3;\ny = y3 / z3;\ng.lineTo(x,y);\ndistance\
  \ = Math.round(45 - pointIndex) * (1 + h + Math.max(0, Math.sin(time * 6 - pointIndex\
  \ / 8) - .95) * 70);\ng.strokeStyle = \"rgb(\" + Math.round(distance * (Math.sin(h\
  \ + i + time * .15) + 1)) + \",\" + Math.round(distance * (h + Math.sin(i - 1) +\
