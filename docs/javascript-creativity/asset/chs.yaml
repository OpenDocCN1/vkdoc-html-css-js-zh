  \n}\n\n}\n\n}\n\n}\n\nfor (var i = 0; i < nodes.length; i++)  {\n\ndrawEdges(nodes[i]);\n\
  \n}\n\n}\n```\n\n最后，需要显示每个节点对应的人物名字。由于我们已经为每个节点创建了一种材质，赋予了节点自身的颜色，我们可以利用这一点，让文本颜色与节点颜色匹配。我设置了文本的尺寸和高度（拉伸）为\
  \ 10，但这只是一个看起来不错的随意数值——你可以随意更改。另外，正如我之前提到的，或许可以考虑在点击节点时才显示文本，因为随着节点增多，文本会变得难以辨认。这部分应添加到\
  \ `drawNode` 函数的末尾：\n\n```\nvar text_object = new THREE.Mesh(new THREE.TextGeometry(node.name,\
  \ { size : 10, height: 10}), material);\n\ntext_object.position.x = draw_object.position.x;\n\
  \ntext_object.position.y = draw_object.position.y;\n\ntext_object.position.z = draw_object.position.z;\n\
  \nscene.add(text_object);\n```\n\n图 4-4 展示了本章的最终成果：一个表示数据并在节点旁显示名字的节点图。\n\n![A978-1-4302-5945-9_4_Fig4_HTML.jpg](img/A978-1-4302-5945-9_4_Fig4_HTML.jpg)\n\
  \n**图 4-4.** 表示数据的最终节点图\n\n与往常一样，完整的代码可在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
  \ 或我自己的网站 [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)\
  \ 上找到。\n\n## 小结\n\n在本章中，你从让物体出现的 3D 基础知识起步，逐步发展到将其用于数据可视化。仅仅在数据可视化领域，你就能做许多事情，更别提在\
