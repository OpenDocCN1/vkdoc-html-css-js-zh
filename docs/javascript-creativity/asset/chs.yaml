  \ * canvas.height, Math.random() * 360, 15));\n        }\n        setInterval(logic,\
  \ 1000/60);\n    }\n\n    function logic () {\n        for (var i = 0; i < flock.length;\
  \ i++)  {\n            var centerx = 0;\n            var centery = 0;\n        \
  \    var count = 0;\n            var b = flock[i];\n            for (var j = 0;\
  \ j < flock.length; j++)\n            {\n                var distance = distanceBetween(b,\
  \ flock[j]);\n                if (distance < flockRadius)\n                {\n \
