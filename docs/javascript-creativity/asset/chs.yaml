  \ 函数需要在对应键上没有正在使用的振荡器时才播放新声音；否则会导致问题，比如无法停止播放，或者声音只会播放很短的时间。我还对它进行了一些清理，避免在不需要的情况下重复检查相同的条件。注意，我将\
