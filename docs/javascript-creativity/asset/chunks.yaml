    \ `b`，以便更轻松地访问 `flock[i]`。变量设置完毕后，我们就可以再次遍历仿生鸟群来寻找邻居了，也就是距离小于`flockRadius`的任何仿生鸟。有了这些，我们就能找出平均位置（将每只仿生鸟的`x`和`y`坐标加到`centerx`和`centery`上，然后除以该半径内的仿生鸟数量）。当然，如果鸟群里只有一只仿生鸟，那我们不妨给它一个随机的位置作为目标点。\n\
    \n```javascript\nfor (var i = 0; i < flock.length; i++)  {\n    var centerx =\
    \ 0;\n    var centery = 0;\n    var count = 0;\n    var b = flock[i];\n    for\
    \ (var j = 0; j < flock.length; j++)\n    {\n        var distance = distanceBetween(b,\
    \ flock[j]);\n        if (distance < flockRadius)\n        {\n            centerx\
    \ += flock[j].x;\n            centery += flock[j].y;\n            count++;\n \
    \       }\n    }\n    if (count > 1) {\n        centerx = centerx / count;\n \
    \       centery = centery / count;\n    }\n    else  {\n        centerx = Math.random()\
    \ * canvas.width;\n        centery = Math.random() * canvas.height;\n    }\n \
    \   // 设置航向和 x/y 位置\n}\n```\n\n现在我们已经得到了关注中心/重力中心（我想“重力”这个词更贴切），就可以计算出仿生鸟为了朝正确方向飞行所需转动的角度了。我们通过使用\
    \ `angleBetween` 和 `angleDifference` 这两个辅助函数来得到所需角度，然后进行线性插值，让它在每次迭代中都更接近目标点。当然，由于我们代码的设计方式，它的目标点可能会根据与邻居的接近程度而变化（请记住，我们是在嵌套循环中改变中心点的）。最后，为了防止仿生鸟飞出画面，我们需要定义一个“环绕”机制，这样当仿生鸟离开画布时，它会出现在对面一侧（就像《小行星》或《贪吃蛇》游戏那样）。\n\
