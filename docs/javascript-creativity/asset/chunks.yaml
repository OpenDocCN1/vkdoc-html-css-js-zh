    \ 2012 年，也就是 Web 诞生近 20 年后，来自网络摄像头的原生视频流才开始进入浏览器。现在 WebRTC 开始得到良好支持，学习如何使用它是值得的。我不会假装它很简单——它确实不简单——但是，一旦你理解了它的工作原理，一切就都说得通了。\n\
    \n## WebRTC 简介\n\n好了，我们知道 WebRTC 用于实现浏览器之间的通信，但它到底是什么？WebRTC 实际上是一组规范，这些规范通常一起使用来创建实时通信链路。这组规范也包括用于数据的规范，所以它不仅限于视频和音频（尽管在撰写本文时，数据规范的支持还不够好，但正在积极开发中）。WebRTC\
    \ 的形成方式与 TCP 服务器非常相似，它需要使用正确的协议进行握手，而不是像你习惯使用的普通 API 那样。还应注意，WebRTC 是点对点的，而不是客户端/服务器模式，这就是为什么它需要客户端额外的网络支持。由于大多数\
    \ Web 开发者可能从未需要编写 TCP 服务器，我认为我们应该从头开始。\n"
- fmt: "# `GetUserMedia()`\n\nOne of the hardest problems with creating native video\
    \ communication before WebRTC was not the fact that communication itself was hard\
    \ to do (though without any peer to peer capabilities, it was very hard to do).\
    \ No, the most difficult problem was accessing the webcam!\n\nLuckily, we now\
    \ have `navigator.getUserMedia()`, which is a method that lets us get both the\
    \ video and audio from an input device and do something with it using the callback.\n\
    \n```\nnavigator.getUserMedia( {audio: true, video: true},\n    function(s) {\n\
    \        vid.src = URL.createObjectURL(s);\n        vid.play();\n    }, function(error)\
    \ {throw error;}\n);\n```\n\nThe first parameter is a configuration object that\
    \ let’s you choose the type of input that you want to use. Then we have two callbacks,\
    \ the first for what to do if the input successfully gives you a stream and the\
    \ second for if it fails.\n\nAnd that’s that. Simple, right? One of the most annoying\
    \ problems in web development, now possible using just one method.\n\nNow, while\
    \ we are talking purely about `getUserMedia`, I would like to point out that you\
    \ could do anything with it that you can do with a normal video (since it goes\
    \ through the video element). In the next few chapters we will be looking at computer\
    \ vision, a massive topic that is not usually thought of as related to the Web,\
    \ we will be using `getUserMedia` as the base for the entire project and it will\
    \ show you that video is not just for conference calls.\n\n## Specifications\n\
    \nAs I mentioned at the beginning of the chapter, WebRTC is a set of specifications.\
    \ It consists of the following three APIs:\n\n- Media Stream API\n- PeerConnection\
    \ API\n- DataChannel API\n\nThe Media Stream API primarily covers the `getUserMedia()`\
    \ method that I explained previously. It requires its own specification because,\
    \ despite being very easy to use, it is complicated for browser implementers.\
    \ Peer Connections are also complicated because there has never before been any\
    \ kind of peer-to-peer networking within the HTML APIs. It provides us with a\
    \ simple API to use rather than getting bogged down in the messy workings of networking.\n\
    \nUsing the API, we create a Peer Connection object to handle all peer-to-peer\
    \ communication. This object consists of an ICE (Interactive Connectivity Establishment)\
    \ agent, the state of the connection, and an ICE state. Luckily for us, this is\
    \ handled using the API too! So instead of working out the correct states and\
    \ so on, we can simply create the object using `new RTCIceCandidate` and it handles\
    \ the states itself.\n\nThe Data Channel API is, at the time of writing, the least\
    \ implemented due to it being much easier to transfer simple data already (using\
    \ servers) than it is to transfer video and audio in real time. Data channels\
    \ will probably be more important than the media streams because the data channels\
    \ allow data to be sent peer to peer, which has countless possibilities such as\
    \ for making multiplayer games that do not need a server (or at least, the server\
    \ does not need to take the full load). As we will see in the chapters that follow,\
    \ the media streams can be extremely powerful but data has a lot more common usages,\
    \ so it is exciting to be able to transfer data without a server!\n\n## Servers\n\
    \nI’m sorry. Yes, WebRTC does not need servers—but it does. If you think about\
    \ it on very simple terms, you always need a way to find each other. Without a\
    \ server, unless you manually enter the IP addresses, the Peer Connections simply\
    \ cannot know where to connect. So we use servers, in our case Node.js, so that\
    \ messages get to the right clients. This is known as signaling. The complexity\
    \ of the servers depends on your needs. We will be writing a fairly basic server\
    \ that handles offers and candidates but will be limited to two clients. It would\
    \ be fairly simple to extend the server to enable more connections. I encourage\
    \ you to attempt this, as it is a great way to understand the intricacies of WebRTC\
    \ and its networking structure.\n\n## Where to Start?\n\nAs you can see, we have\
    \ quite a big task ahead of us. I think we should start with the server because\
    \ it is the smallest part of the code and acts as a kind of testing suite for\
    \ us. We are extending the code from [Chapter 7](#A978-1-4302-5945-9_7_Chapter.html),\
    \ which I have included here for your memory and as a comparison.\n\n```\nvar\
    \ app = require('express')(),\nserver = require('http').createServer(app),\nio\
    \ = require('socket.io').listen(server);\n\nio.set('log level', 1); // Removes\
    \ debug logs\n\nserver.listen(8080);\n\napp.get('/:id', function (req, res) {\n\
    \    res.sendfile(__dirname + '/index.html');\n});\n\nio.sockets.on('connection',\
    \ function (socket) {\n    var room = socket.handshake.headers.referer;\n    socket.join(room);\n\
    \    socket.on('message', function (data) {\n        io.sockets.in(room).emit('message',\
    \ data);\n    });\n    socket.on('leave', function (room) {\n        socket.leave(room);\n\
    \    });\n});\n```\n\nWe need to keep all this, though some parts will be edited.\
    \ In applications such as this, where there is potential for it to be quite complicated,\
    \ I tend to give each socket a unique identifier. To do this I have used `node-uuid`,\
    \ so we need to import that at the top. Then within the code that runs when a\
    \ new socket has connected, we assign the output of `uuid.v1()` to `socket.id`.\
    \ Of course we need to let the client know that it has been given an id, so we\
    \ emit an `'assigned_id'` message that sends the id to the client.\n\n```\nvar\
    \ express = require('express'),\nhttp = require('http'),\nuuid = require (\"node-uuid\"\
    ),\napp = express(),\nserver = http.createServer(app),\nio = require('socket.io').listen(server);\n\
    \nio.sockets.on('connection', function (socket) {\n    var room = socket.handshake.headers.referer;\n\
    \    console.log('JOINED', room);\n    socket.join(room);\n    socket.id = uuid.v1();\n\
    \    socket.emit('assigned_id', socket.id);\n    // Everything else goes here\n\
    });\n```\n\nThe client-side needs to look for the emitted message and to store\
    \ it within the client-side socket.\n\n```\nsocket.on('assigned_id', function(data)\
    \  {\n    console.log('assigned id' + data);\n    socket.id = data;\n});\n```\n\
    \nNow we need to create the structure for the signaling. It starts when a client’s\
    \ webcam is successfully running, it adds its stream to its own peer connection,\
    \ then creates an offer. Within the callback, the peer connection is given the\
    \ local description. We get the description from the callback as a parameter.\
    \ This description holds all the data (as SDP) about the client, such as IP address.\
    \ I will explain the exact format of the description after we have written the\
    \ server; it is mostly complicated data for the browser but some of it is useful\
    \ to know about. The client now needs to let the server know that it is time to\
    \ send the offer to the other client. To avoid confusion, let’s call the original\
    \ client c1 and the one it connects to c2. So, the server needs to send any `'received_offer'`\
    \ messages on to the correct socket, c2. It eventually does the same for both\
    \ `'received_candidate'` and `'received_answer'` as well; these three are all\
    \ that are needed for basic switching.\n\n```\nsocket.on('received_offer', function(data)\
    \ {\n    console.log(\"received_offer %j\", data);\n    io.sockets.in(room).emit('received_offer',\
    \ data);\n});\n\nsocket.on('received_candidate', function(data) {\n    console.log(\"\
    \ received_candidate %j\", data);\n    io.sockets.in(room).emit('received_candidate',\
    \ data);\n});\n\nsocket.on('received_answer', function(data) {\n    console.log(\"\
    \ received_answer %j\", data);\n    io.sockets.in(room).emit('received_answer',\
    \ data);\n});\n```"
  raw: '### GetUserMedia()


    One of the hardest problems with creating native video communication before WebRTC
    was not the fact that communication itself was hard to do (though without any
    peer to peer capabilities, it was very hard to do). No, the most difficult problem
    was accessing the webcam!


    Luckily, we now have `navigator.getUserMedia()`, which is a method that lets us
    get both the video and audio from an input device and do something with it using
    the callback.


    `navigator.getUserMedia( {audio: true, video: true},`


        `function(s) {`


            `vid.src = URL.createObjectURL(s);`


            `vid.play();`


        `}, function(error) {throw error;}`


    `);`


    The first parameter is a configuration object that let’s you choose the type of
    input that you want to use. Then we have two callbacks, the first for what to
    do if the input successfully gives you a stream and the second for if it fails.


    And that’s that. Simple, right? One of the most annoying problems in web development,
    now possible using just one method.


    Now, while we are talking purely about `getUserMedia`, I would like to point out
    that you could do anything with it that you can do with a normal video (since
    it goes through the video element). In the next few chapters we will be looking
    at computer vision, a massive topic that is not usually thought of as related
    to the Web, we will be using `getUserMedia` as the base for the entire project
    and it will show you that video is not just for conference calls.


    ### Specifications


    As I mentioned at the beginning of the chapter, WebRTC is a set of specifications.
    It consists of the following three APIs:


    *   Media Stream API

    *   PeerConnection API

    *   DataChannel API


    The Media Stream API primarily covers the `getUserMedia()` method that I explained
    previously. It requires its own specification because, despite being very easy
    to use, it is complicated for browser implementers. Peer Connections are also
    complicated because there has never before been any kind of peer-to-peer networking
    within the HTML APIs. It provides us with a simple API to use rather than getting
    bogged down in the messy workings of networking.


    Using the API, we create a Peer Connection object to handle all peer-to-peer communication.
    This object consists of an ICE (Interactive Connectivity Establishment) agent,
    the state of the connection, and an ICE state. Luckily for us, this is handled
    using the API too! So instead of working out the correct states and so on, we
    can simply create the object using `new RTCIceCandidate` and it handles the states
    itself.


    The Data Channel API is, at the time of writing, the least implemented due to
    it being much easier to transfer simple data already (using servers) than it is
    to transfer video and audio in real time. Data channels will probably be more
    important than the media streams because the data channels allow data to be sent
    peer to peer, which has countless possibilities such as for making multiplayer
    games that do not need a server (or at least, the server does not need to take
    the full load). As we will see in the chapters that follow, the media streams
    can be extremely powerful but data has a lot more common usages, so it is exciting
    to be able to transfer data without a server!


    ### Servers


    I’m sorry. Yes, WebRTC does not need servers—but it does. If you think about it
    on very simple terms, you always need a way to find each other. Without a server,
    unless you manually enter the IP addresses, the Peer Connections simply cannot
    know where to connect. So we use servers, in our case Node.js, so that messages
    get to the right clients. This is known as signaling. The complexity of the servers
    depends on your needs. We will be writing a fairly basic server that handles offers
    and candidates but will be limited to two clients. It would be fairly simple to
    extend the server to enable more connections. I encourage you to attempt this,
    as it is a great way to understand the intricacies of WebRTC and its networking
    structure.


    ### Where to Start?


    As you can see, we have quite a big task ahead of us. I think we should start
    with the server because it is the smallest part of the code and acts as a kind
    of testing suite for us. We are extending the code from [Chapter 7](#A978-1-4302-5945-9_7_Chapter.html),
    which I have included here for your memory and as a comparison.


    `var app = require(''express'')(),`


    `server = require(''http'').createServer(app),`


    `io = require(''socket.io'').listen(server);`


    `io.set(''log level'', 1); // Removes debug logs`


    `server.listen(8080);`


    `app.get(''/:id'', function (req, res) {`


    `res.sendfile(__dirname + ''/index.html'');`


    `});`


    `io.sockets.on(''connection'', function (socket) {`


    `var room = socket.handshake.headers.referer;`


    `socket.join(room);`


    `socket.on(''message'', function (data) {`


    `io.sockets.in(room).emit(''message'', data);`


    `});`


    `socket.on(''leave'', function (room) {`


    `socket.leave(room);`


    `});`


    `});`


    We need to keep all this, though some parts will be edited. In applications such
    as this, where there is potential for it to be quite complicated, I tend to give
    each socket a unique identifier. To do this I have used `node-uuid`, so we need
    to import that at the top. Then within the code that runs when a new socket has
    connected, we assign the output of `uuid.v1()` to `socket.id`. Of course we need
    to let the client know that it has been given an id, so we emit an `''assigned_id''`
    message that sends the id to the client.


    `var express = require(''express''),`


    `http = require(''http''),`


    `uuid = require ("node-uuid"),`


    `app = express(),`


    `server = http.createServer(app),`


    `io = require(''socket.io'').listen(server);`


    `io.sockets.on(''connection'', function (socket) {`


    `var room = socket.handshake.headers.referer;`


    `console.log(''JOINED'', room);`


    `socket.join(room);`


    `socket.id = uuid.v1();`


    `socket.emit(''assigned_id'', socket.id);`


    `// Everything else goes here`


    `});`


    The client-side needs to look for the emitted message and to store it within the
    client-side socket.


    `socket.on(''assigned_id'', function(data)  {`


    `console.log(''assigned id'' + data);`


    `socket.id = data;`


    `});`


    Now we need to create the structure for the signaling. It starts when a client’s
    webcam is successfully running, it adds its stream to its own peer connection,
    then creates an offer. Within the callback, the peer connection is given the local
    description. We get the description from the callback as a parameter. This description
    holds all the data (as SDP) about the client, such as IP address. I will explain
    the exact format of the description after we have written the server; it is mostly
    complicated data for the browser but some of it is useful to know about. The client
    now needs to let the server know that it is time to send the offer to the other
    client. To avoid confusion, let’s call the original client c1 and the one it connects
    to c2\. So, the server needs to send any `''received_offer''` messages on to the
    correct socket, c2\. It eventually does the same for both `''received_candidate''`
    and `''received_answer''` as well; these three are all that are needed for basic
    switching.


    `socket.on(''received_offer'', function(data) {`


    `console.log("received_offer %j", data);`


    `io.sockets.in(room).emit(''received_offer'', data);`


    `});`


    `socket.on(''received_candidate'', function(data) {`


    `console.log(" received_candidate %j", data);`


    `io.sockets.in(room).emit(''received_candidate'', data);`


    `});`


    `socket.on(''received_answer'', function(data) {`


    `console.log(" received_answer %j", data);`


    `io.sockets.in(room).emit(''received_answer'', data);`


    `});`'
  trans: "\n# `GetUserMedia()`\n\n在 WebRTC 出现之前，创建原生视频通信最困难的问题之一，其实并非通信本身难以实现（尽管缺乏点对点能力确实让这件事变得非常困难）。不，最棘手的难题是访问摄像头！\n\
    \n幸运的是，我们现在有了 `navigator.getUserMedia()`，这个函数能让我们从输入设备获取视频和音频，并通过回调函数对这些内容进行处理。\n\
    \n```\nnavigator.getUserMedia( {audio: true, video: true},\n    function(s) {\n\
    \        vid.src = URL.createObjectURL(s);\n        vid.play();\n    }, function(error)\
    \ {throw error;}\n);\n```\n\n第一个参数是一个配置对象，用于选择你想要使用的输入类型。接着是两个回调函数：第一个定义了成功从输入设备获取媒体流时的处理逻辑，第二个则定义了失败时的处理逻辑。\n\
    \n就是这样。很简单，对吧？曾经网页开发中最令人头疼的问题之一，现在只需要一个方法就能解决。\n\n虽然我们现在纯粹是在讨论 `getUserMedia`，但我想指出的是，你可以用它来实现任何普通视频能做的事情（因为它通过\
    \ video 元素传输）。在接下来的几章中，我们将探讨计算机视觉——一个通常被认为与 Web 无关的庞大主题，我们将以 `getUserMedia` 作为整个项目的基础，这将向您展示视频不仅仅能用于视频会议。\n\
    \n## 规范\n\n正如我在本章开头提到的，WebRTC 是一套规范。它包含以下三个 API：\n\n- Media Stream API\n- PeerConnection\
    \ API\n- DataChannel API\n\nMedia Stream API 主要涵盖了我之前解释过的 `getUserMedia()` 方法。它需要单独的规范，因为尽管使用起来非常简单，但对浏览器实现者来说却很复杂。Peer\
    \ Connections 也很复杂，因为 HTML API 中以前从未有过任何形式的点对点网络。它为我们提供了一个简单的 API 来使用，而无需陷入网络通信的繁杂细节中。\n\
    \n使用这个 API，我们创建一个 Peer Connection 对象来处理所有点对点通信。该对象包含一个 ICE（交互式连接建立）代理、连接状态和 ICE\
    \ 状态。幸运的是，这些也是通过 API 来处理的！所以我们不需要自己计算正确的状态等，只需使用 `new RTCIceCandidate` 创建对象，它就会自行处理状态。\n\
    \nData Channel API 在撰写本文时是集成度最低的，因为与实时传输视频和音频相比，传输简单数据（使用服务器）已经容易得多。数据通道可能比媒体流更重要，因为它允许数据在点对点之间发送，这有无数可能性，比如制作不需要服务器的多人游戏（或者至少，服务器不需要承担全部负载）。正如我们将在后续章节中看到的，媒体流可以非常强大，但数据的常见用途更多，因此能够无需服务器传输数据是非常令人兴奋的！\n\
    \n## 服务器\n\n很抱歉。是的，WebRTC 不需要服务器——但它确实需要。简单想想，你总是需要一种方式找到对方。没有服务器，除非你手动输入 IP 地址，否则\
    \ Peer Connections 根本无法知道在哪里连接。所以我们使用服务器，在我们的例子中是 Node.js，这样消息才能到达正确的客户端。这被称为信令（signaling）。服务器的复杂性取决于你的需求。我们将编写一个相当基础的服务器，用于处理\
    \ Offer 和 Candidate，但只限于两个客户端。扩展服务器以支持更多连接是相当简单的。我鼓励你尝试一下，因为这是理解 WebRTC 复杂性及其网络结构的绝佳方式。\n\
    \n## 从何开始？\n\n如你所见，我们面前的任务相当繁重。我认为我们应该从服务器开始，因为它是代码中最小的部分，同时也充当我们的测试套件。我们将对第 7\
    \ 章中的代码进行扩展，此处附上代码供你回忆和对比。\n\n```\nvar app = require('express')(),\nserver = require('http').createServer(app),\n\
    io = require('socket.io').listen(server);\n\nio.set('log level', 1); // 移除调试日志\n\
    \nserver.listen(8080);\n\napp.get('/:id', function (req, res) {\n    res.sendfile(__dirname\
    \ + '/index.html');\n});\n\nio.sockets.on('connection', function (socket) {\n\
    \    var room = socket.handshake.headers.referer;\n    socket.join(room);\n  \
    \  socket.on('message', function (data) {\n        io.sockets.in(room).emit('message',\
    \ data);\n    });\n    socket.on('leave', function (room) {\n        socket.leave(room);\n\
    \    });\n});\n```\n\n我们需要保留所有这些代码，不过部分内容将会被编辑。在此类可能相当复杂的应用中，我倾向于为每个套接字赋予一个唯一标识符。为此我使用了\
    \ `node-uuid`，因此我们需要在文件顶部导入它。然后，在连接新套接字时运行的代码中，我们将 `uuid.v1()` 的输出赋值给 `socket.id`。当然，我们需要让客户端知道它被分配了一个\
    \ ID，因此我们发送一个 `'assigned_id'` 消息，将 ID 发送给客户端。\n\n```\nvar express = require('express'),\n\
    http = require('http'),\nuuid = require (\"node-uuid\"),\napp = express(),\nserver\
    \ = http.createServer(app),\nio = require('socket.io').listen(server);\n\nio.sockets.on('connection',\
    \ function (socket) {\n    var room = socket.handshake.headers.referer;\n    console.log('JOINED',\
    \ room);\n    socket.join(room);\n    socket.id = uuid.v1();\n    socket.emit('assigned_id',\
    \ socket.id);\n    // 其他所有代码写在这里\n});\n```\n\n客户端需要监听发出的消息，并将其存储在客户端的 socket 中。\n\
    \n```\nsocket.on('assigned_id', function(data)  {\n    console.log('assigned id'\
    \ + data);\n    socket.id = data;\n});\n```\n\n现在我们需要为信令创建结构。当客户端的摄像头成功启动后，它会将媒体流添加到自己的\
    \ Peer Connection 中，然后创建一个 Offer。在回调函数中，Peer Connection 被赋予本地描述（local description）。我们从回调中获取描述作为参数。该描述保存了关于客户端的所有数据（以\
    \ SDP 格式），例如 IP 地址。我们将在编写完服务器后解释描述的确切格式；这些信息大部分是为浏览器准备的复杂数据，但其中一部分对理解很有帮助。现在，客户端需要让服务器知道是时候将\
    \ Offer 发送给另一个客户端了。为了避免混淆，我们称原始客户端为 c1，与之连接的客户端为 c2。因此，服务器需要将任何 `'received_offer'`\
    \ 消息发送到正确的套接字 c2。最终，服务器对 `'received_candidate'` 和 `'received_answer'` 也要做同样的处理；这三条消息是基本信令切换所需的全部内容。\n\
    \n```\nsocket.on('received_offer', function(data) {\n    console.log(\"received_offer\
    \ %j\", data);\n    io.sockets.in(room).emit('received_offer', data);\n});\n\n\
    socket.on('received_candidate', function(data) {\n    console.log(\" received_candidate\
    \ %j\", data);\n    io.sockets.in(room).emit('received_candidate', data);\n});\n\
    \nsocket.on('received_answer', function(data) {\n    console.log(\" received_answer\
    \ %j\", data);\n    io.sockets.in(room).emit('received_answer', data);\n});\n\
    ```\n"
- fmt: "# WebRTC 连接与信令流程\n\n你必须记住，整个代码在两个客户端上运行，因此 `c1` 会发送 `received_offer` 给 `c2`，但\
    \ `c2` 也会将其发送给 `c1`。这是我们知道两者都已就绪的方式。当 `c2` 收到 offer 时，它会将其对等连接的远程描述设置为 `c1` 发送的描述（`c1`\
    \ 的本地描述成为 `c2` 的远程描述，反之亦然）。然后它创建一个 answer，并将其本地描述发送回去（同样通过回调处理）；这一步可能看起来不是必需的，因为双方已经拥有彼此的描述，但这可以视为一种确认。它还会在客户端设置一个名为\
    \ `connected` 的布尔变量为 `true`，以防止此过程重复并导致无限循环。每个客户端的对等连接在本地描述设置完成后会注册一个 ICE candidate\
    \ 就绪事件；这会触发一个由客户端通过 `pc.onIceCandidate()` 处理的事件，该事件随后用于通过发送之前提到的 `'received_candidate'`\
    \ 消息来向服务器发送更多数据（以 SDP 形式，稍后将解释）。当然，`c2` 现在接收到 SDP 并将其用于将 `c1` 添加为对等连接的 ICE candidate。\n\
    \n如果一切按计划进行，`c1` 和 `c2` 现在将能够看到彼此。当然，前提是我们已经实现了客户端部分。我的解释可能显得有些混乱，但这是因为我想准确解释其工作原理，而不仅仅是服务器需要处理几条消息。这与我们在[第7章](#A978-1-4302-5945-9_7_Chapter.html)中所学的概念基本相同，也是编写\
    \ Node.js 代码时经常使用的模式。清单 8-1 是服务器的代码，包括用于平滑关闭连接的消息以及用于获取房间内客户端数量的消息：\n\n**清单 8-1.**\
    \ `Server.js`\n\n```javascript\nvar express = require('express'),\n    http =\
    \ require('http'),\n    uuid = require (\"node-uuid\"),\n    app = express(),\n\
    \    server = http.createServer(app),\n    io = require('socket.io').listen(server);\n\
    \nio.set('log level', 1); // 移除调试日志\n\napp.use(express.static('public'));\n\n\
    server.listen(8080);\n\napp.get('/:id?', function (req, res) {\n    res.sendfile(__dirname\
    \ + '/index.html');\n});\n\nio.sockets.on('connection', function(socket) {\n \
    \   var room = socket.handshake.headers.referer;\n    console.log('JOINED', room);\n\
    \    socket.join(room);\n    socket.id = uuid.v1();\n    socket.emit('assigned_id',\
    \ socket.id);\n\n    socket.on('debug_clients', function(data) {\n        socket.emit('room_count',\
    \ io.sockets.manager.rooms['/' + room].length);\n    });\n\n    io.sockets.in(room).emit('room_count',\
    \ io.sockets.manager.rooms['/' + room].length);\n\n    socket.on('received_offer',\
    \ function(data) {\n        console.log(\" received_offer %j\", data);\n     \
    \   io.sockets.in(room).emit('received_offer', data);\n    });\n\n    socket.on('received_candidate',\
    \ function(data) {\n        console.log(\" received_candidate %j\", data);\n \
    \       io.sockets.in(room).emit('received_candidate', data);\n    });\n\n   \
    \ socket.on('received_answer', function(data) {\n        console.log(\" received_answer\
    \ %j\", data);\n        io.sockets.in(room).emit('received_answer', data);\n \
    \   });\n\n    socket.on('close', function() {\n        console.log(\"closed %j\"\
    , room);\n        io.sockets.in(room).emit('closed', room);\n    });\n});\n```\n\
    \n# WebRTC 背后的技术\n\n好了，让我们暂时从代码中抽身。我已经描述了 WebRTC 客户端之间相互连接的流程，但其中有很多术语你可能之前没见过。因此，在编写客户端代码之前，我想介绍一下\
    \ WebRTC 背后的技术及其工作原理。这些内容有点超出本书的范围，所以我鼓励你进一步阅读相关资料。如果你不太感兴趣，可以跳过本节，直接进入实现客户端的下一节。\n\
    \n## ICE\n\n我之前多次提到 ICE。它代表 Interactive Connectivity Establishment（交互式连接建立），根据\
    \ RFC 5245（[http://www.ietf.org/rfc/rfc5245.txt](http://www.ietf.org/rfc/rfc5245.txt)）的定义，它是“一种用于提供/应答模型的网络地址转换（NAT）遍历协议”。该\
    \ RFC 文档非常详细，部分人可能会觉得很有趣，但我认为摘要已经很好地概括了其目的。对某些人来说，这些内容听起来可能完全像天书，但希望在你阅读完我关于 ICE\
    \ 及其他技术的简短总结后，能够理解它。\n\n> 本文档描述了一种用于基于 UDP 的多媒体会话的网络地址转换（NAT）遍历协议，该会话通过提供/应答模型建立。此协议称为交互式连接建立（ICE）。ICE\
    \ 利用了用于 NAT 的会话遍历工具（STUN）协议及其扩展——使用中继进行 NAT 遍历（TURN）。任何使用提供/应答模型的协议（如会话发起协议 SIP）都可以使用\
    \ ICE。——RFC 5245 摘要\n\n正如我在本章“规范”部分所解释的，每个 WebRTC 客户端必须具备的对等连接由多个组件构成，包括 `iceConnectionState`、`iceGatheringState`\
    \ 以及 ICE 代理。ICE 代理是重要（且简单）的部分。它是每个客户端上 WebRTC 的端点，负责使用信令协议与其他端点通信。我们使用 ICE 的原因是（正如摘要所述）它是用于\
    \ UDP 通信 NAT 遍历的标准化协议。这基本上意味着它能够在不被阻止的情况下穿越安全机制（如防火墙）。ICE 通过并行检查所有可能的通信路径来工作，从而快速找到最优路径。状态（显而易见）用于查找\
    \ ICE 代理的状态，并且它们是只读的。\n\n`iceGatheringState` 的可能状态包括：\n\n*   `new`\n*   `gathering`\n\
    *   `complete`\n\n`iceConnectionState` 的可能状态包括：\n\n*   `starting`\n*   `checking`\n\
    *   `connected`\n*   `completed`\n*   `failed`\n*   `disconnected`\n*   `closed`\n\
    \n## NAT 遍历\n\nNAT 是硬件路由器（以及部分商用交换机）背后的技术，它允许一台路由器后面的多台机器使用同一个 IP 地址工作。它接收传入的数据包，并根据数据包的来源将其发送到正确的设备。它将内部网络地址（例如\
    \ `192.168.1.123`）转换为外部 IP，反之亦然。出于多种原因（包括安全性），入站通信通常受到限制，并且通常涉及一个端口白名单表，NAT 设备使用该表将内部地址与入站端口关联起来（通常称为防火墙）。\n\
    \nNAT 遍历是一组方法的统称，用于以用户友好的方式绕过这些限制。如果没有 NAT 遍历技术，用户将不得不手动在防火墙上打开端口以允许入站流量，并将这些端口信息提供给其他连接方。一些常见的\
    \ NAT 遍历技术包括：反向代理、套接字安全（SOCKS）、通用即插即用（UPnP）和 UDP 打洞。\n\n## STUN/TURN\n\nSTUN（用于\
    \ NAT 的会话遍历工具）和 TURN（围绕 NAT 使用中继进行遍历）都是信令协议，通常被 ICE 用作 NAT 遍历的工具。如果你希望运行自己的服务器，每种协议都有开源实现。我在本章中使用的两个服务器（你只需要一个，但可以配置多个作为备份）分别由\
    \ Google 和 Mozilla 运行，地址为 `stun:stun.l.google.com:19302` 和 `stun:stun.services.mozilla.com`。你会注意到这两个服务器都是\
    \ STUN 服务器。这主要是因为它们是我找到的第一个可靠的免费服务器。两者之间的主要区别在于，TURN 使用中继技术，因此数据通过中继服务器传输到客户端。然而，TURN\
    \ 的优点是它构建在 STUN 之上，因此它始终首先尝试使用 STUN，如果失败，则使用中继。TURN 的另一个优点是它适用于对称 NAT，而 STUN 无法做到这一点。"
  raw: 'You must remember that the entire code runs on both clients, so c1 will send
    `received_offer` to c2 but c2 will also send it to c1\. This is how we know when
    both are ready. When c2 receives the offer it sets its peer connection’s remote
    description to the one that c1 sent (c1’s local description becomes c2’s remote
    description and vice versa). It then creates an answer that sends back its local
    description (again, from the callback); this step may not seem necessary since
    they both already have each other’s description but it can be considered a confirmation.
    It also sets a Boolean variable, on the client-side, called `connected` to be
    true so that this cannot repeat itself and cause an infinite loop. The peer connection,
    on each client, registers that an ICE candidate is ready once the local descriptions
    are set; this triggers an event that is handled by the client using `pc.onIceCandidate()`,
    which is then used to send more data (in the form of SDP, which I shall explain
    soon) to the server by emitting the `''received_candidate''` message that was
    mentioned previously. Of course, c2 now receives the SDP and uses it to add c1
    as an ICE candidate to the peer connection.


    If all went to according to plan, c1 and c2 will now see each other. Well, they
    would if we had implemented the client-side. My explanation may have seemed quite
    confusing but that is because I wanted to explain exactly how it works, not just
    that the server needs to serve a few messages. It is basically the same concept
    as we had in [Chapter 7](#A978-1-4302-5945-9_7_Chapter.html) and a pattern that
    you will often use when writing node.js code. Listing 8-1 is the code for the
    server, including a message for closing the connection smoothly and another for
    how many clients are in the room:


    Listing 8-1. Server.js


    `var express = require(''express''),`


    `http = require(''http''),`


    `uuid = require ("node-uuid"),`


    `app = express(),`


    `server = http.createServer(app),`


    `io = require(''socket.io'').listen(server);`


    `io.set(''log level'', 1); // Removes debug logs`


    `app.use(express.static(''public''));`


    `server.listen(8080);`


    `app.get(''/:id?'', function (req, res) {`


    `res.sendfile(__dirname + ''/index.html'');`


    `});`


    `io.sockets.on(''connection'', function(socket) {`


    `var room = socket.handshake.headers.referer;`


    `console.log(''JOINED'', room);`


    `socket.join(room);`


    `socket.id = uuid.v1();`


    `socket.emit(''assigned_id'', socket.id);`


    `socket.on(''debug_clients'', function(data) {`


    `socket.emit(''room_count'', io.sockets.manager.rooms[''/'' + room].length);`


    `});`


    `io.sockets.in(room).emit(''room_count'', io.sockets.manager.rooms[''/'' + room].length);`


    `socket.on(''received_offer'', function(data) {`


    `console.log(" received_offer %j", data);`


    `io.sockets.in(room).emit(''received_offer'', data);`


    `});`


    `socket.on(''received_candidate'', function(data) {`


    `console.log(" received_candidate %j", data);`


    `io.sockets.in(room).emit(''received_candidate'', data);`


    `});`


    `socket.on(''received_answer'', function(data) {`


    `console.log(" received_answer %j", data);`


    `io.sockets.in(room).emit(''received_answer'', data);`


    `});`


    `socket.on(''close'', function() {`


    `console.log("closed %j", room);`


    `io.sockets.in(room).emit(''closed'', room);`


    `});`


    `});`


    ## Technologies Behind WebRTC


    Okay, let’s take a brief break from the code. I’ve described the flow of how WebRTC
    clients connect to each other, but there are a lot of terms that you probably
    haven’t seen before. So before we write the client-side code, I would like to
    go through the technologies behind WebRTC and how they work, they are a bit out
    of scope for this book so I encourage you to read more about them. If you’re not
    particularly interested, then feel free to skip over to the next section where
    we implement the client-side.


    ### ICE


    I’ve mentioned ICE quite a bit. It stands for Interactive Connectivity Establishment,
    which according to RFC 5245 ( [`http://www.ietf.org/rfc/rfc5245.txt`](http://www.ietf.org/rfc/rfc5245.txt)
    ) is “A Protocol for Network Address Translator (NAT) Traversal for Offer/Answer
    Protocols”. The RFC goes into a lot of detail, which some of you may find very
    interesting, but I think the abstract sums up the purpose quite well. To some
    of you this will sound like absolute gobbledygook, so hopefully once you have
    read my brief summaries about ICE and the other technologies then you will understand
    it.


    > This document describes a protocol for Network Address Translator (NAT) traversal
    for UDP-based multimedia sessions established with the offer/answer model. This
    protocol is called Interactive Connectivity Establishment (ICE). ICE makes use
    of the Session Traversal Utilities for NAT (STUN) protocol and its extension,
    Traversal Using Relay NAT (TURN). ICE can be used by any protocol utilizing the
    offer/answer model, such as the Session Initiation Protocol (SIP). RFC 5245 Abstract


    As I explained in the “Specifications” section of this chapter, the peer connection
    that every WebRTC client must have is made up of components, including `iceConnectionState`,
    `iceGatheringState` and the ICE Agent. The ICE Agent is the important (yet simple)
    part. It is the endpoint for WebRTC on each client and it is responsible for communicating
    with the other endpoints, using a signaling protocol. The reason we use ICE at
    all is that it is (as the abstract states) a standardized protocol for NAT traversal
    for UDP communication. This basically means that it is a way of getting through
    security, such as firewalls, without being blocked. ICE works by checking all
    possible paths of communication in parallel, which quickly finds the best possible
    path. The states are used (quite obviously) to find the state of the ICE Agent
    and they are read-only.


    The possible states of `iceGatheringState` are


    *   new

    *   gathering

    *   complete


    The possible states of `iceConnectionState` are


    *   starting

    *   checking

    *   connected

    *   completed

    *   failed

    *   disconnected

    *   closed


    ### NAT Traversal


    NAT is the technology behind hardware routers (and some commercial switches) that
    allows many machines behind one router to work using one IP. It takes incoming
    packets of data, and sends them to the correct device based on where it came from.
    It translates the internal network addresses (for example, 192.168.1.123) to the
    outward facing IP and back again. Inbound communication is restricted for many
    reasons, including security, and usually involves a port whitelist table that
    the NAT device uses to associate internal addresses to inbound ports (commonly
    referred to as a firewall).


    NAT Traversal is a name for a group of methods of getting around this in a user
    friendly way. Without NAT Traversal techniques, users would have to manually open
    ports on their firewall to allow inbound traffic, and give this port information
    to other connecting parties. Some common NAT Traversal techniques are; Reverse
    Proxies, Socket Secure (SOCKS), Universal Plug and Play (UPnP), and UDP Hole Punching.


    ### STUN/TURN


    STUN (Session Traversal Utilities for NAT) and TURN (Traversal Using Relays around
    NAT) are both signaling protocols that are often used as tools by ICE for the
    NAT traversal. There are open source implementations for each if you wish to run
    your own server. The two that I used for this chapter (you only need one, but
    you can have an array of them so that there are backups) are run by Google and
    Mozilla at `stun:stun.l.google.com:19302` and `stun:stun.services.mozilla.com`.
    You will notice that both of these servers are STUN. This is mostly because they
    were the first free servers that I found to be reliable. The main difference between
    the two is that TURN uses a relay technique, so the data is relayed through to
    server to get to the client. The upside however is that TURN builds on STUN, so
    it always tries to use STUN first but if that fails it, then relays. Another advantage
    of TURN is that it works with Symmetric NATs, which STUN does not.'
