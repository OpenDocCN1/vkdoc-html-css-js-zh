    \n本书中可能出现商标名称、标识和图像。我们在编辑过程中使用商标名称、标识和图像时，并非每次都使用商标符号，而是以有利于商标所有者的方式使用，无意侵犯商标。本出版物中使用商号、商标、服务标记和类似术语，即使未明确标识，也不应被视为对其是否受所有权保护的表达。\n\
    \n尽管本书中的建议和信息在出版时被认为是真实和准确的，但作者、编辑或出版者对可能出现的任何错误或遗漏不承担法律责任。出版者对本文所含材料不作任何明示或暗示的保证。\n\
    \n谨以此书献给我的父母：John 和 Michelle\n\n## 前言\n\n万维网似乎总是在追赶。早在 90 年代，网络与 CD-ROM 竞争时处于劣势——至少在技术实现方面是如此。CD-ROM\
    \ 提供了更丰富的交互性、更好的视觉效果和使用音频的可能性。但从长远来看，这并不重要。CD-ROM 根本无法与万维网的浩瀚无垠相抗衡。\n\n后来，Macromedia（以及后来的\
    \ Adobe）Flash 与网络展开了较量。在动画、音频和视频方面，网络似乎再次无法与其竞争对手匹敌。然而，网络又一次比其更华丽的对 手更持久。\n\n\
    最近，我们在移动领域看到了同样故事的重演。与原生应用相比，网络似乎无法提供同样丰富的交互体验。但即使在这里，我怀疑在原生应用的热潮消退很久之后，网络仍将比以往任何时候都更强大。\n\
    \n这些专有技术——CD-ROM、Flash、原生应用——每一项都可能被解读为对开放网络的威胁，但我更愿意将它们视为网络的研究与开发部门。总会有某种竞争技术在表面上看起来旨在挑战网络的主导地位。实际上，这些技术展示了\
    \ web 开发者希望从浏览器和标准化机构那里获得什么样的功能。如果没有 Flash，我们会有 CSS 动画吗？如果没有原生应用，人们会投入那么多精力来提供对设备\
    \ API 的访问吗？\n\n网络总会落后于其他技术，这没关系。随着时间的推移，网络的功能集不断增长，同时始终保持向后兼容性（这是那些竞争技术所严重缺乏的）。网络功能集的增长有时看起来可能慢得令人痛苦，但值得偶尔退后一步，看看我们已经走了多远。\n\
    \n这本书就像一张快照，捕捉了当今网络浏览器所能实现的尖端功能。我们取得的进步可能会让你感到惊讶。它当然让我感到惊讶。我对我们现在能用音频、视频和动画实现的成就感到相当震惊。而最擅长让人震惊的人莫过于\
    \ Shane 了。他就像网络开发界的 Doogie Howser。（问问你的父母。）\n\n那么，准备好开始一段狂野之旅吧。Shane Hudson 将带你走向前沿。\n\
    \nJeremy Keith  \n网络大使\n\n## 关于作者\n\nShane Hudson 是一位网络开发者，对尖端网络技术和网络标准都抱有浓厚的兴趣。他在\
    \ JavaScript 方面拥有丰富的经验，曾参与一系列高度交互的网站和副项目。他还对人工智能和计算机视觉领域感兴趣。您可以通过电子邮件`shane@shanehudson.net`或在\
    \ Twitter 上通过`@ShaneHudson`联系 Shane。\n\n## 关于技术审校\n\nKeith Cirkel 是来自英国伦敦的 JavaScript\
    \ 顾问，专门从事开源 JavaScript 库和文献的编写。要了解更多关于他的工作，请访问[`http://keithcirkel.co.uk`](http://keithcirkel.co.uk/)，通过\
    \ GitHub 在[`github.com/keithamus`](http://github.com/keithamus)联系他，或在 Twitter\
    \ 上通过[`twitter.com/keithamus`](http://twitter.com/keithamus)联系他。\n\n## 致谢\n\n\
    直到我写了这本书，我才真正理解为什么每一位作者的致谢都会说：“如果没有……这本书就不可能完成。”如果不是那些在写作过程中帮助过我的人，我早就放弃了，这本书也就不会存在了。\n"
- fmt: 'I must start by thanking Louise Corrigan, my wonderful editor, for absolutely
    everything. I originally just casually asked her who I should talk to about writing
    a book, then just a few months later I had signed my contract. Throughout the
    process she has encouraged me (there were many times when I wanted to just stop
    writing) and helped develop the ideas for each chapter. Without Louise, I am certain
    that this book would be just a figment of my imagination, but instead you are
    holding it in your hands. Thank you Louise, for believing in me.


    Before starting the book, I had no idea what the role of coordinating editor meant.
    Mark Powers and Christine Ricketts were my two coordinating editors, and they
    are both incredible people. It took me far longer to write the book than I had
    expected and yet both Mark and Christine did a great job making sure everything
    went as smoothly as possible.


    The final member of staff from Apress that I owe a great many thanks to is Linda
    Seifert, who copyedited the entire book. I may have written a book now but I am
    still a programmer, so Linda was like a magician turning my strings of words into
    sentences worthy of being published.


    I know there were also many other people working behind the scenes on the book,
    whom I had little contact with. So I would like to say thank you to those people
    too.


    My technical reviewer throughout the book was Keith Cirkel and I truly could not
    have been luckier. Keith is a great guy and an incredible programmer. He constantly
    gave me ideas on how to improve not only the code but the flow of the chapters
    as well. Much of the code was written late at night and he was able to pick up
    lots of ways to improve the code, rather than just testing that it ran without
    errors.


    Alongside the people working with me on the book, I have some other people that
    deserve acknowledgement for their varied support with the book. First is Ryan
    Lamvohee, a programmer from Australia. I’ve never met Ryan in person, but he was
    the first programmer I ever got to know online and has supported me ever since.
    It was Ryan’s interest in programming computers to make music that I learned much
    of what I wrote in Chapter 5 about music theory in JavaScript. Ryan also helped
    a great deal with the beginning of the book, developing ideas for the example
    projects.


    I of course need to thank Jeremy Keith for writing the foreword of this book.
    I really wanted Jeremy to write it, but I didn’t expect him to do so! He is an
    incredible writer, deeply thoughtful, and a true asset to the web. When I asked
    him for a title to put along side his name, I expected it to be to do with Clearleft
    (where he was one of the founders). Instead he asked for “Ambassador to the Web”.
    If it were any one else, I would be wary of that title — but Jeremy really does
    deserve it.


    Stuart Memo was another inspiration for Chapter 5, having given a brilliant talk
    titled “JavaScript is the new Punk Rock” that I highly recommend you watch. Stuart
    has also done a great many other interesting things with the Web Audio API so
    take a look at his website: [`www.stuartmemo.com`](http://www.stuartmemo.com/).
    Originally, I was going to write my own 3D music visualization but no matter what
    I did, I could not (at least in the time I had) do better than the one Steven
    Wittens had already explained in a lot of detail. So I was very thankful when
    Steven gave me his permission to use his visualization in the book. I highly recommend
    you read his article explaining the math behind the visualization, as well as
    the other articles on Steven’s incredible website: [`www.acko.net`](http://www.acko.net/).


    Both Matt Diamond and Keith Norman were also very helpful to the development of
    the book. Matt wrote the `Recorder.js` script that allows recording of the Web
    Audio API nodes and he helped with some problems I had using it. Keith Norman
    wrote the base code for the Web RTC code that I used in Chapter 8 and helped to
    review my code.


    Throughout the book I had a lot of support from my family and friends, especially
    of course my parents (who I dedicated to book to). Everybody was thrilled for
    me and tried to help keep me enthused. I would like to give special thanks to
    everybody in the University of Kent’s School of Computing and Plymouth Marine
    Laboratory’s Remote Sensing Department for their consistent support. I would also
    like to thank my housemates, Edd Greer and Silvana Mallor Hoya, who both put up
    with me working all hours of the day and helped me see the book to its end. There
    are so many other people that I wish I could give acknowledgement to but my final
    thank you goes to Sam Hutchings, a friend of mine that I consider to be a wordsmith.
    He helped with some of the phrasing and was another person who helped my enthusiasm
    without which I would not have finished writing this book. And lastly, thank you
    to everybody on Twitter that put up with all my moaning throughout the writing
    process!'
  raw: 'I must start by thanking Louise Corrigan, my wonderful editor, for absolutely
    everything. I originally just casually asked her who I should talk to about writing
    a book, then just a few months later I had signed my contract. Throughout the
    process she has encouraged me (there were many times when I wanted to just stop
    writing) and helped develop the ideas for each chapter. Without Louise, I am certain
    that this book would be just a figment of my imagination, but instead you are
    holding it in your hands. Thank you Louise, for believing in me.


    Before starting the book, I had no idea what the role of coordinating editor meant.
    Mark Powers and Christine Ricketts were my two coordinating editors, and they
    are both incredible people. It took me far longer to write the book than I had
    expected and yet both Mark and Christine did a great job making sure everything
    went as smoothly as possible.


    The final member of staff from Apress that I owe a great many thanks to is Linda
    Seifert, who copyedited the entire book. I may have written a book now but I am
    still a programmer, so Linda was like a magician turning my strings of words into
    sentences worthy of being published.


