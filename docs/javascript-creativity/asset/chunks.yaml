    ## “聪明”的动画


    接下来我们将创建一个“聪明”的动画——也就是说，在弹跳盒子示例中动态动画概念的基础上进行扩展，让物体能够感知周围环境。1986 年，克雷格·雷诺兹创建了一个令人惊叹的鸟群模拟程序，他称之为“Boids”。它仅基于三条规则构建，使得每只虚拟鸟能够自主运动，同时也能看到附近的同伴并向它们移动。我找到的关于每条规则的最佳解释如下：


    *   **分离**：转向以避免与附近的鸟群成员拥挤

    *   **对齐**：转向朝向附近鸟群成员的平均方向

    *   **凝聚**：转向朝附近鸟群成员的平均位置（质心）移动


    我们的动画基于 Boids，不过为了简洁起见，某些部分会进行简化（我鼓励你修改我的代码来改进它——为此你可能需要使用向量）。我们将从通常的设置代码开始，比如
    `getContext` 等，同时为 Boid 创建一个对象，用于存储其位置、方向和大小数据。完成后，我们创建一个名为 `setup()` 的函数，它会将每只虚拟鸟（无论我们设置了多少只）以随机位置和随机方向添加到画布上。我编写了一个简单的函数来包装
    JavaScript 的 `Math.random`，只是为了让代码更整洁一些。


    ```

    (function()  {

    var canvas = document.querySelector("#flocking");

    var ctx = canvas.getContext(''2d'');

    canvas.height = window.innerHeight;

    canvas.width = window.innerWidth;

    var flock = [];

    var flockRadius = 250;

    var neighborRadius = 10;

    var Boid = function(x, y, heading, size) {

    this.x = x;

    this.y = y;

    this.heading = heading

    this.size = size;

    };

    function setup()  {

    for (var i = 0; i < 50; i++)

    {

    flock.push(new Boid(rand(canvas.width), rand(canvas.height), rand(360), 15));

    }

    setInterval(logic, 1000/60);

    }

    function logic () {

    for (var i = 0; i < flock.length; i++)  {

    // 对每只虚拟鸟执行某些操作

    }

    requestAnimationFrame(draw);

    }

    function draw()  {

    // 绘制部分在此进行

    }

    function rand(max)  {

    return Math.random() * max;

    }

    setup();

    })();

    ```


    你可能注意到，我们没有使用“向上”或“向右”来表示方向，而是使用了 0 到 360 度。这使动画更加流畅，也便于我们之后使用弧度计算。我们使用变量 `flockRadius`
    来控制虚拟鸟互相可视的距离（也用于统一方向等）。现在让我们为绘制方法添加一些代码。为此，我们首先需要清除每一帧的画布（如果不这样做，就会直接在上一帧上绘制）。画布清除后，就该绘制虚拟鸟了！因此我们需要遍历鸟群数组，将当前虚拟鸟存储在名为
    `b` 的变量中，并将每一只绘制到画布（即画布上下文）的正确位置上。要找到位置，我们取 `b.x` 和 `b.y`，但需要加上其大小的一半，因为位置是虚拟鸟的中心，而不是其左上角。


    ```

    function draw()  {

    ctx.clearRect(0,0,canvas.width, canvas.height);

    for (var i = 0; i < flock.length; i++)

    {

    var b = flock[i];

    ctx.fillStyle = "blue";

    ctx.fillRect(b.x,b.y, b.size, b.size);

    ctx.beginPath();

    ctx.moveTo(b.x + (b.size / 2),b.y + (b.size / 2));

    ctx.lineTo((b.x + (b.size / 2)) + dir_x(20,flock[i].heading),(b.y + (b.size /
    2)) + dir_y(20,flock[i].heading));

    ctx.strokeStyle = "red"

    ctx.stroke();

    }

    }

    ```


    在 `lineTo` 中，我使用了两个函数，用于在给定距离和方向时获取位置。这里我用这些函数画了一条线，指向每只虚拟鸟朝向的方向，长度为 20 像素。下面是辅助函数的代码。它们使用了基本的三角学和勾股定理，因此应该很容易理解。


    ```

    function distanceBetween(a, b)  {

    var dx = a.x - b.x;

    var dy = a.y - b.y;

    return Math.sqrt(dx * dx + dy * dy);

    }


