    `}`


    `// Draw edges, has to be done once we have the nodes in place`


    `for (var i = 0; i < amount_nodes; i++)  {`


    `drawEdges(nodes[i]);`


    `}`


    `}`


    If you now put it all together, it should show a nice 3D node graph of random
    colors that does not represent anything (see Figure [4-3](#A978-1-4302-5945-9_4_Chapter.html#Fig3)).
    This is a good starting point for a variety of visualizations and it should make
    you feel comfortable using the tools (namely Three.js) to produce more than just
    a simple shape.


    ![A978-1-4302-5945-9_4_Fig3_HTML.jpg](A978-1-4302-5945-9_4_Fig3_HTML.jpg)


    Figure 4-3.


    Node graph


    I encourage you to fiddle with the code to make it your own. Here are a few ideas
    for how you can extend the graph:


    *   Use an API to visualize live data (Twitter, Government open data, etc.).

    *   Change size and/or color of the nodes based on the data.

    *   Add text overlays for hovering or clicking on the nodes and/or edges.

    *   Work on the navigation. It is hard to navigate a graph that has thousands
    of nodes. What works best`—`arrow keys? Mouse? Click to move? This is a good way
    to explore scale.


    There are a lot of ways you could use the camera (some of which were explained
    earlier in the chapter) to navigate the graph. For now I have just been using
    the simple camera rotation technique, which is included in the code.'
  trans: "\n### 3D 节点图\n\n与其直接使用数据，不如先从图形开始。在本节中，所有节点和边都是随机生成的，并且两个节点之间完全有可能存在多条相同的边。目前我们无需担心这个问题（一旦有了真实数据，处理起来会容易得多）。\n\
    \n我们从所有场景都具备的基础设置开始，这次同时使用了方向光和环境光，以便每个节点（我们将用随机颜色的球体表示）呈现出良好的效果。\n\n```\nvar\
    \ width  = window.innerWidth,\n    height = window.innerHeight;\nvar container\
    \ = document.querySelector('#container');\nvar renderer = new THREE.WebGLRenderer();\n\
    renderer.setSize(width, height);\ncontainer.appendChild(renderer.domElement);\n\
    var VIEW_ANGLE = 45,\n    NEAR = 0.1,\n    FAR = 10000;\nvar camera =  new THREE.PerspectiveCamera(45,\
    \ width / height, 1, 1000);\ncamera.position.z = 600;\nvar ambient = new THREE.AmbientLight(\
    \ 0x050505, 2 );\ndirectionalLight = new THREE.DirectionalLight( 0xffffff, 1 );\n\
    directionalLight.position.set( 2, 1.2, 10 ).normalize();\nvar scene = new THREE.Scene();\n\
    scene.add(ambient);\nscene.add(directionalLight);\nscene.add(camera);\n// 本节其余代码将放在此处。\n\
    function logic()  {\n    requestAnimationFrame(render);\n}\nfunction render()\
    \ {\n    renderer.render(scene, camera);\n}\nsetInterval(logic, 1000/60);\n```\n\
    \n你知道如何创建球体，而且我相信你很快就能想出让它们随机定位的方法。然而，我们需要做的是随机定位球体，还需要用线条将它们随机连接起来形成边。为此，我们创建了一个\
    \ `Node` 对象，用于存储名称和位置，然后生成随机的边。由于我们目前没有使用数据，名称默认为“随机节点”，并且有一个通过属性 `edges` 访问的\
    \ `getEdges()` 函数，该函数返回两个随机节点用于连接边。要在 `getEdges` 中生成随机边，我们只需将 `Math.random()`\
    \ 乘以节点数量，然后向下取整（floor），因为索引是从 0 而不是 1 开始的。\n\n```\nvar amount_nodes = 20;\nvar\
    \ Node = function() {\n    name = \"随机节点\",\n    position = new THREE.Vector3();\n\
    \    function getEdges() {\n        return [Math.floor(Math.random()*amount_nodes),\
    \ Math.floor(Math.random()*amount_nodes) ];\n    }\n    return {\n        name:\
    \ name,\n        edges: getEdges()\n    }\n}\n```\n\n要绘制图形，我们需要三个函数：一个绘制单个节点，一个绘制节点的所有边，还需要一个函数利用前两个函数来绘制整个图形。我们先从\
    \ `drawNode(n)` 开始，将节点作为参数传入，这样就能方便地访问我们刚创建的节点对象。在函数内部，我们使用之前教过的相同技术创建一个球体，材质为随机颜色的朗伯材质。随机颜色的实现出乎意料地简单，因为十六进制（例如\
    \ `0xffffff`）与任何其他数字的处理方式相同（毕竟它只是数字在不同进制下的表示），我们可以对其进行数学运算，这里就是将其乘以一个随机数。为了确定位置，我们选择一个在指定区域边界内的随机数，然后减去该区域的数值，以使图形保持在中心位置。\n\
    \n```\nfunction drawNode(n)  {\n    var radius = 10,\n        segments = 50,\n\
    \        rings = 50;\n    var node = new THREE.Mesh(\n        var material = new\
    \ THREE.MeshLambertMaterial( {  color: Math.random() * 0xffffff } );\n       \
    \ var draw_object = new THREE.Mesh(\n            new THREE.SphereGeometry(\n \
    \               radius,\n                segments,\n                rings),\n\
    \            material);\n        );\n    var area = 300;\n    node.position.x\
    \ = Math.floor(Math.random() * (area * 2 + 1) - area);\n    node.position.y =\
    \ Math.floor(Math.random() * (area * 2 + 1) - area);\n    node.position.z = Math.floor(Math.random()\
    \ * (area * 2 + 1) - area);\n    n.position = node.position;\n    scene.add(node);\n\
    }\n```\n\n现在，节点已经绘制到场景中，是时候用边将它们连接起来了。由于这些边是随机生成的，正如我之前所说，有些边可能会重叠，导致线条变粗。一旦我们添加了数据，这种情况就不会发生，因为我们可以利用数据来检查某条线是否已经存在。从环境光中你已经知道，要实现透明度，需要将\
    \ `transparent` 设置为 `true`，所以我在这里的 `LineBasicMaterial` 中也这么做了，因为如果边是 100% 白色且不透明，会显得过于密集。要确定线条的走向，我们需要遍历\
    \ `node.edges`（在创建新节点时随机生成），并创建一个几何体，其顶点位于当前节点的位置和其他节点（`nodes[node.edges[i]]`）的位置。创建完成后，我们只需使用这个几何体创建一条新线，然后将其添加到场景中。\n\
    \n```\nfunction drawEdges(node)  {\n    var line_material = new THREE.LineBasicMaterial(\
    \ { color: 0xffffff, transparent: true, opacity: 0.1, linewidth:0.5 } );\n   \
    \ for (var i = 0; i < node.edges.length; i++)  {\n        var tmp_geo = new THREE.Geometry();\n\
    \        tmp_geo.vertices.push(node.position);\n        tmp_geo.vertices.push(nodes[node.edges[i]].position);\n\
    \        var line = new THREE.Line( tmp_geo, line_material );\n        scene.add(line);\n\
    \    }\n}\n```\n\n最后，为了完成这部分项目，我们只需使用刚才编写的两个函数来绘制图形。你可能已经注意到，我们使用了一个名为 `nodes`\
    \ 的数组，节点是在 `drawGraph()` 函数中创建的。该函数的第一部分会循环遍历节点数量（`amount_nodes`），并在数组中创建一个新的\
    \ `Node` 对象，然后使用 `drawNode()` 绘制它。由于 `drawEdges()` 需要使用节点数组来确定哪些边是连接的，因此边必须在一个单独的循环中创建。\n\
    \n```\nvar nodes = [];\ndrawGraph();\nfunction drawGraph()  {\n    // 绘制节点\n \
    \   for (var i = 0; i < amount_nodes; i++)  {\n        nodes[i] = new Node();\n\
    \        drawNode(nodes[i]);\n    }\n    // 绘制边，必须在节点就位后才能进行\n    for (var i =\
    \ 0; i < amount_nodes; i++)  {\n        drawEdges(nodes[i]);\n    }\n}\n```\n\n\
    如果现在将所有代码组合起来，你应该会看到一个颜色随机的漂亮 3D 节点图，但它并不代表任何实际数据（参见图 4-3）。这对于各种可视化来说是一个良好的起点，并且应该能让你自如地使用这些工具（即\
    \ Three.js）来生成比简单形状更复杂的图形。\n\n![A978-1-4302-5945-9_4_Fig3_HTML.jpg](img/A978-1-4302-5945-9_4_Fig3_HTML.jpg)\n\
    \n**图 4-3.** 节点图\n\n我鼓励你修改代码，使其成为你自己的作品。以下是一些扩展图形的思路：\n\n*   使用 API 可视化实时数据（Twitter、政府开放数据等）。\n\
    *   根据数据改变节点的大小和/或颜色。\n*   为悬停或点击节点和/或边添加文本叠加层。\n*   优化导航。在拥有数千个节点的图形中进行导航是很困难的。哪种方式效果最好——方向键？鼠标？点击移动？这是一个探索缩放的好方法。\n\
    \n你可以通过多种方式使用相机（本章前面已经解释了一些方法）来浏览图形。目前，我只是使用了简单的相机旋转技术，该技术已包含在代码中。\n"
- fmt: '### Adding Data


    We have a node graph showing random nodes, it looks nice but there really isn’t
    any meaning behind it. I have created a JavaScript file called `data.js` (with
    JSON in a variable called `data` to make it easy to access) that includes four
    actors/actresses and three movies. We will be using this to create a tiny node
    graph that shows the movies as edges between the nodes of the actors/actresses.
    Although there is not much data, this should give you a good idea of how the graph
    can be used for data visualization. Here is the data we will be using:


    ```

    var data = {


    "People": [


    {


    "Id" : 0,


    "Name": "Tom Cruise",


    "Films": [1, 2]


    },


    {


    "Id" : 1,


    "Name": "Morgan Freeman",


    "Films": [1,3,5]


    },


    {


    "Id" : 2,


    "Name": "Bruce Willis",


    "Films": [3, 4]


    },


    {


    "Id" : 3,


    "Name": "Mary-Louise Parker",


    "Films": [3]


    }


    ],


    "Films": [


    {


    "Id": 0,


    "Name": "Oblivion",


    "Cast": [0, 1]


    },


    {


    "Id": 1,


    "Name": "Mission: Impossible",


    "Cast": [0]


    },


    {


    "Id": 2,


    "Name": "RED",


    "Cast": [1, 2, 3]


    },


    {


    "Id": 3,


    "Name": "Die Hard",


    "Cast": [2]


    },


    {


    "Id": 4,


    "Name": "The Shawshank Redemption",


    "Cast": [1]


    }


    ]


    }

    ```


    To create the graph we use the code we previously created but need to modify it
    to read the data object so that it links between the actors/actresses based on
    films they have been in. Although it is probably more useful to show every connection,
    I decided that for this example it would be best to only show when they are connected
    rather than having a separate line for each movie. I did this by checking whether
    the node was already in the array of edges of the other node.


    The main change between this code and the previous is the `drawGraph()` function
    in which we now assign the people data to each node. Once the nodes are drawn,
    we need to go through each film and create edges in each node for every film by
    connecting each person to the person before them in the cast array, providing
    they have not already been connected.


    ```

    drawGraph();


    function drawGraph()  {


    var people = data["People"];


    var films = data["Films"];


    for (var i = 0; i < people.length; i++)  {


    nodes[i] = new Node();


    nodes[i].name = people[i].Name;


    nodes[i].films = people[i].Films;


    drawNode(nodes[i]);


    }


    for (var i = 0; i < films.length; i++)  {


    var cast = films[i]["Cast"];


    console.log(cast);


    if (cast.length > 1)  {


    for (var j = 1; j < cast.length; j++)  {


    if (nodes[cast[j-1]].edges.indexOf(cast[j]) == -1)  {


    console.log(j)


    console.log(nodes[cast[j-1]]);


    nodes[cast[j-1]].edges.push(cast[j]);


    }


    }


    }


    }


    for (var i = 0; i < nodes.length; i++)  {


    drawEdges(nodes[i]);


    }


    }

    ```


    Finally, the name of the person that each node corresponds to should be shown.
    As we have already created a material for each node that gives a node its own
    color, we can use that to match the text color with the node. I’ve given the text
    a size and height (extrusion) of 10, but that is an arbitrary number that looked
    good — feel free to change it. Also, as I mentioned earlier, perhaps look into
    showing the text when a node has been clicked because as more nodes are added,
    the text will become harder to read. This should be added at the end of the `drawNode`
    function:


    ```

    var text_object = new THREE.Mesh(new THREE.TextGeometry(node.name, { size : 10,
    height: 10}), material);


    text_object.position.x = draw_object.position.x;


    text_object.position.y = draw_object.position.y;


    text_object.position.z = draw_object.position.z;


    scene.add(text_object);

    ```


    Figure [4-4](#A978-1-4302-5945-9_4_Chapter.html#Fig4) shows the final outcome
    of this chapter, the node graph representing the data and showing the names alongside
    the nodes.


    ![A978-1-4302-5945-9_4_Fig4_HTML.jpg](A978-1-4302-5945-9_4_Fig4_HTML.jpg)


    **Figure 4-4.** The final node graph representing the data


    The entire code for this is available, as always, on either the Apress website
    at [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442) or my
    own website at [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)
    .


    ## Summary


    In this chapter you have developed 3D skills from the basics of making an object
    appear to using it for data visualization. There is a wide variety of things you
    can do in just data visualization alone, let alone everything else you can do
    in a 3D world. Hopefully you now feel comfortable with Three.js. I encourage you
    to extend the examples in this chapter and to fiddle around with them, especially
    the node graph. In [Chapter 5](#A978-1-4302-5945-9_5_Chapter.html) we create music
    (or at least sound!) in the browser using the Web Audio API and SVG.


    # Creating Music in the Browser


    In [Chapter 3](#A978-1-4302-5945-9_3_Chapter.html) we used the Web Audio API to
    analyze audio by creating a simple visualization and a spectrogram. This chapter
    extends [Chapter 3](#A978-1-4302-5945-9_3_Chapter.html) by using the API to create
    music. To do this I introduce music theory and have a few examples before creating
    a web app that lets users create snippets of music using a basic synthesizer and
    to be able to move the snippets around the track to create their own music. This
    project is full of potential, so there are many routes you could take to modify
    it and make it your own, such as a full-fledged web-based Digital Audio Workstation.'
