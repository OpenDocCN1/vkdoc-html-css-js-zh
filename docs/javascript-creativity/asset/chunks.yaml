    \n#### Vorbis\n\n`Vorbis` 是最受欢迎的开源、无专利音频编解码器，受到许多浏览器的支持。它通常被称为 `Ogg Vorbis`，尽管\
    \ `Ogg` 是一个容器，`Vorbis` 常与它一起使用，而非该格式本身的名称。`Vorbis` 有许多其他容器，但通常使用的容器是 `Ogg`、`QuickTime\
    \ MOV` 或 `WebM`。\n\n#### AAC\n\n`高级音频编码` (`AAC`) 特别有趣，因为它常与 `H.264` 配合提供音频，并且是\
    \ `3GP`（常用于移动设备）容器中使用的主要音频编解码器（`AMR` 除外）。`AAC` 受到大多数浏览器的支持（除 OSX 上的 Opera 和 Firefox，以及某些\
    \ Linux 发行版外，原因在于许可协议）。\n\n#### AC-3\n\n`AC-3` 是由杜比实验室创建的音频编解码器，通常被称为 `杜比数字`。它很少用于网络，但广泛应用于高清电影。\n\
    \n#### H.264\n\n`H.264` 是由视频编码专家组 (`VCEG`) 和动态图像专家组开发的视频编解码器。该编解码器用于蓝光光盘，在网络上也十分流行，因为浏览器支持度良好（由于许可问题，除\
    \ Opera 外的所有浏览器在可能的情况下都支持 `H.264`）。思科发布了一个开源的 `H.264` 实现，试图解决许可问题。\n\n#### VP8\n\
    \n这是 `WebM` 中用于视频的编解码器。它归谷歌所有，但谷歌已做出不可撤销的专利承诺，允许任何人实现 `VP8`。\n\n#### Theora\n\n\
    基于 `VP3`（`VP8` 的前身），`Theora` 是一种开源的、有损视频编解码器，由 Xiph.Org 基金会维护。它常与 `Ogg` 容器格式一起用于网络。\n\
    \n### 编码视频\n\n现在，你可能想知道如何编码视频。遗憾的是，浏览器无法自动完成此操作，因此你需要使用转换器。市面上有很多转换器，但最流行的似乎是\
    \ `Handbrake` 和 `Miro`。我个人使用 `Miro`，因为它设计精良、简单易用且开源。`Miro` 可在 [`www.mirovideoconverter.com`](http://www.mirovideoconverter.com/)\
    \ 获取。\n\n### 浏览器兼容性\n\n在撰写本文时，Firefox 尚未添加对 `MP3` 的支持，而 Internet Explorer 和 Safari\
    \ 都不支持 `OGG` 或 `WebM`。移动端的支持则更加缺乏。\n\n与 `<audio>` 类似，我们可以使用相当多的编解码器和容器。Chrome\
    \ 和 Firefox 都致力于 `WebM`，尽管 Internet Explorer 和 Safari 不支持它。一些旧版本的浏览器会支持某些格式，但不支持\
    \ `WebM`，因此同时使用 `OGG` 和 `MP4` 是值得的。之前我提到过，`Vorbis` 常被称为 `OGG Vorbis`，对于视频，我们使用\
    \ `OGG` 容器，其中音频采用 `Vorbis`，视频采用 `Theora`。由于前面描述的专利原因，`OGG` 和 `WebM` 都优先于 `MP4`。要了解浏览器支持的最新状态，请查看\
    \ [`www.docs.webplatform.org/wiki/html/elements/audio`](http://www.docs.webplatform.org/wiki/html/elements/audio)。\n\
    \n## 使用 `<audio>` 和 `<video>` 元素\n\n现在我们已经了解了容器、编解码器以及可能遇到的文件，我们可以看看如何将它们应用到我们的网页中。\n\
    \n注意\n\n本章使用的音频来自 [`www.incompetech.com/music/royalty-free`](http://www.incompetech.com/music/royalty-free)，视频来自\
    \ [`www.bigbuckbunny.com`](http://www.bigbuckbunny.com/)。\n\n### `<audio>`\n\n\
    让我们从音频元素开始，这是我们在现代浏览器中用来听声音的。这个声音可以是任何东西，从播客到音乐。在开始之前，我需要强调一点——请谨慎使用。不要在用户加载网站时突然播放声音。当\
    \ Flash 能做到这一点时，我们就讨厌它，现在依然如此。在最基本的形式中，`audio` 元素可以像 `img` 元素一样接受一个 `src` 属性：\n\
    \n`<audio src=\"audio.mp3\" >`\n\n只需将此代码添加到你的 HTML 文档中即可。这样做的缺点是我们无法提供一个文件列表，因为我们需要根据浏览器兼容性提供不同的音频编解码器。为了解决这个问题，我们使用嵌套在\
    \ `<audio>` 中的 `<source>` 元素。这个元素允许你提供不同的文件，并让浏览器自动选择最佳方案。它像往常一样接受 `src` 属性，以及\
    \ `type` 属性。在 `type` 属性中，我们给出 MIME 类型（可能如你所料），这需要包括容器作为主类型，并在分号后包含编解码器。如果你认为有必要针对旧版浏览器，你也可以在\
    \ `source` 元素旁边提供 Flash 备选方案。以下是一个例子，音频文件可以在上面链接的 Incompetech 网站上找到，也可以在本书的下载文件中找到：\n\
    \n```\n<audio>\n   <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n\
    \   <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\n由于浏览器有一个用来选择源的算法，因此源的顺序和数量都不是问题。目前大多数人只使用\
    \ `Vorbis` 和 `MP3`，但随着时间的推移，这种情况可能会改变。`WebM` 容器格式很可能会比 `Ogg` 容器格式更受欢迎，因为许多浏览器供应商正大力将其推行为专为网络设计的开放视频格式。同样值得注意的是，`WebM`\
    \ 正在与一种名为 `WebP` 的图像格式一同开发。\n\n### `<video>`\n\n视频元素 (`<video>`) 的实现方式与 `<audio>`\
    \ 类似。与 `<audio>` 一样，你可以只指定一个视频文件，也可以使用 `<source>` 指定多个文件：\n\n```\n<video>\n  \
    \  <source src='../video.ogv' type='video/ogg;'>\n    <source src='../video.mp4'\
    \ type='video/mp4'>\n    <source src='../video.webm' type='video/webm'>\n</video>\n\
    ```\n\n同样，与音频类似，浏览器会根据浏览器和操作系统的能力，通过算法选择源。拥有多个源且顺序任意都是没有问题的。示例中的三种格式：`Ogg`、`MP4`\
    \ 和 `WebM`，是撰写本文时支持度最好的。\n\n## 属性和属性特性\n\n那么，现在我们知道了如何在 HTML 文档中实现音频和视频，让我们来看看这些元素可用的属性和属性特性。`audio`\
    \ 和 `video` 元素之间有很多重叠之处，大多数属性适用于两者，因此我将一起解释，而不是分章节说明。\n"
- fmt: "# Controls\n\nOkay, so we have audio on our page now—but we can do more. Currently\
    \ the browser can choose a file to play, but we have no way to tell it to play.\
    \ Its current state is useful when we want to use JavaScript to control the audio\
    \ or video, but ideally it should have a media player. Most browsers have a built-in\
    \ player that can be triggered simply by adding `controls` to the element. Like\
    \ so:\n\n```\n<audio controls>\n  <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n\
    \  <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\nLikewise we would\
    \ use the following code for a video:\n\n```\n<video controls>\n  <source src='../video.ogv'\
    \ type='video/ogg;'>\n  <source src='../video.mp4' type='video/mp4'>\n  <source\
    \ src='../video.webm' type='video/webm'>\n</video>\n```\n\nIf you run that in\
    \ your browser you should now see a basic audio (or video) player. If you want\
    \ to provide a customized player, to fit the style of your website, then you are\
    \ probably best creating the DOM elements and styling them as you wish then hooking\
    \ it up to an `<audio>`/`<video>` element that does not have `controls` enabled.\n\
    \n**Note**\n\nSome browsers use Shadow DOM so in theory you could style the default\
    \ controls with CSS but, at the time of writing, each browser is very different\
    \ and the Shadow DOM is still new. I would recommend checking [www.caniuse.com](http://www.caniuse.com/)\
    \ to see the current implementation status across browsers.\n\n# Autoplay\n\n\
    Occasionally you may have a legitimate reason to want audio or video to autoplay.\
    \ While this is usually frowned upon, it is simple to do. As with `controls`,\
    \ you can just add the `autoplay` attribute to the element. You can also set this\
    \ using JavaScript with `element.autoplay = true`, like so:\n\n```\n<audio autoplay>\n\
    \  <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n  <source src='audio.mp3'\
    \ type='audio/mpeg'>\n</audio>\n```\n\nAnd for video it would work in much the\
    \ same way:\n\n```\n<video autoplay>\n  <source src='../video.ogv' type='video/ogg;'>\n\
    \  <source src='../video.mp4' type='video/mp4'>\n  <source src='../video.webm'\
    \ type='video/webm'>\n</video>\n```\n\n# Preload\n\nThis is slightly less obvious\
    \ than the previous two attributes, `preload` is used to attempt to load either\
    \ the entire audio or video file or the metadata (such as duration) at page load;\
    \ this is based on the value of the attribute. If `preload` is not set, then it\
    \ is the choice of the browser (the default is usually `metadata`). That said,\
    \ even if the attribute is set, it is only a hint and is used as the preferred\
    \ choice for the browser to consider it based on a number of conditions that change\
    \ between browsers.\n\nThere are three acceptable values for `preload`. These\
    \ are:\n\n- `auto`: This gives priority to the browser, if it is appropriate to\
    \ do so. For example, if the connectivity is good, then it may try to download\
    \ the entire file. With `preload` set to `auto`, the `readyState` variable will\
    \ increment from 0 (nothing downloaded) to 4 (will play without interruption),\
    \ a fully preloaded file will have a 4 `readyState`.\n- `metadata`: This is the\
    \ most commonly used value because it is a kind of “happy medium.” It basically\
    \ lets the browser know that it would be great to know about the file, including\
    \ the duration for instance, but that the entire file isn’t needed until the user\
    \ clicks play. With `preload` set to `metadata`, the `readyState` will be set\
    \ to 1 (has metadata) once the metadata has downloaded and may move to 2 or 3\
    \ depending on how aggressive the fetching is.\n- `none`: This reduces stress\
    \ on the server by telling the browser that no information is needed until the\
    \ user clicks play. Of course, as I said earlier, this is just a hint and so it\
    \ may decide to give the metadata or entire file anyway.\n\nThe attribute works\
    \ just like the other examples, for audio:\n\n```\n<audio preload='metadata'>\n\
    \  <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n  <source src='audio.mp3'\
    \ type='audio/mpeg'>\n</audio>\n```\n\nAnd for video:\n\n```\n<video preload='metadata'>\n\
    \  <source src='../video.ogv' type='video/ogg;'>\n  <source src='../video.mp4'\
    \ type='video/mp4'>\n  <source src='../video.webm' type='video/webm'>\n</video>\n\
    ```\n\n**Note**\n\nThis attribute is well supported in most browsers, except Presto-based\
    \ Opera browsers, which use the old name of `autobuffer`.\n\n# Loop\n\nThis is\
    \ an attribute that forces the audio or video file to loop back to the beginning\
    \ once the file has completed playing. This can be either set as an attribute\
    \ (straight to the HTML) or as a property (from JavaScript). Using `loop` as a\
    \ property lets you check the current state (whether it is `true` or `false`).\n\
    \n```\n<audio loop>\n  <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n\
    \  <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\nYou can do the\
    \ same for video:\n\n```\n<video loop>\n  <source src='../video.ogv' type='video/ogg;'>\n\
    \  <source src='../video.mp4' type='video/mp4'>\n  <source src='../video.webm'\
    \ type='video/webm'>\n</video>\n```\n\n# Played\n\nYou will often want to know\
    \ which parts of the media have been played, especially if you are creating a\
    \ media player or perhaps an advertisement of some kind. `Played` is a property\
    \ that can be used with JavaScript to get a `TimeRanges` object that has the start\
    \ and end times of each portion of the track that has been played. For example,\
    \ if I listened to the beginning for about 20 seconds, then calling `ele.played.start(0)`\
    \ would give 0 because it is the beginning and `ele.played.end(0)` would give\
    \ 20; the parameter is the index, so 0 would be the first portion listened and\
    \ 1 would be the second. You can use `ele.played.length` to find the amount of\
    \ separate portions listened to.\n\n```\nvar ele = document.querySelector('audio');\n\
    \nfunction log() {\n  for (var i = 0; i < ele.played.length; i++)\n  {\n     \
    \ console.log(\"Portion \" + i);\n      console.log(\"  Start: \" + ele.played.start(i));\n\
    \      console.log(\"  End: \" + ele.played.end(i));\n  }\n}\n```\n\nTo change\
    \ this to work with video, you just need to select video instead of audio:\n\n\
    ```\nvar ele = document.querySelector('video');\n```\n\nIn this example, if you\
    \ run `log()` from the console, then you will see each portion of the audio or\
    \ video that you have played to with the start and end times in seconds. Aside\
    \ from purely demonstration purposes or for debugging, the `played` property is\
    \ useful in media players as a way for users to see parts they have already listened\
    \ to.\n\n# Buffered\n\nAs with `played`, we are able to get a `TimeRanges` object\
    \ for the portions of the file that have buffered. It helps to know the buffered\
    \ portions of the file when making a media player (which we will be doing in a\
    \ later chapter) where instead of using the `controls` attribute, we can instead\
    \ create a custom control that shows the buffered areas of the audio file. Unlike\
    \ `played`, `buffered` may have multiple indexes, for example if the user has\
    \ moved the playhead.\n\n```\nvar ele = document.querySelector('audio');\n// Or:\
    \ var ele = document.querySelector('video');\n\nfunction log() {\n    for (var\
    \ i = 0; i < ele.buffered.length; i++)\n    {\n      console.log(\"Portion \"\
    \ + i);\n      console.log(\"  Start: \" + ele.buffered.start(i));\n      console.log(\"\
    \  End: \" + ele.buffered.end(i));\n    }\n}\n```"
  raw: '### Controls


    Okay, so we have audio on our page now—but we can do more. Currently the browser
    can choose a file to play, but we have no way to tell it to play. Its current
    state is useful when we want to use JavaScript to control the audio or video,
    but ideally it should have a media player. Most browsers have a built-in player
    that can be triggered simply by adding controls to the element. Like so:


    `<audio controls>`


       `<source src=''audio.ogg'' type=''audio/ogg; codecs=vorbis''>`


       `<source src=''audio.mp3'' type=''audio/mpeg''>`


    `</audio>`


    Likewise we would use the following code for a video:


    `<video controls>`


        `<source src=''../video.ogv'' type=''video/ogg;''>`


        `<source src=''../video.mp4'' type=''video/mp4''>`


        `<source src=''../video.webm'' type=''video/webm''>`


    `</video>`


    If you run that in your browser you should now see a basic audio (or video) player.
    If you want to provide a customized player, to fit the style of your website,
    then you are probably best creating the DOM elements and styling them as you wish
    then hooking it up to an <audio>/<video> element that does not have controls enabled.


    Note


    Some browsers use Shadow DOM so in theory you could style the default controls
    with CSS but, at the time of writing, each browser is very different and the Shadow
    DOM is still new. I would recommend checking [www.​caniuse.​com](http://www.caniuse.com/)
    to see the current implementation status across browsers.


    ### Autoplay


    Occasionally you may have a legitimate reason to want audio or video to autoplay.
    While this is usually frowned upon, it is simple to do. As with controls, you
    can just add the autoplay attribute to the element. You can also set this using
    JavaScript with `element.autoplay = true`, like so:


    `<audio autoplay>`


       `<source src=''audio.ogg'' type=''audio/ogg; codecs=vorbis''>`


       `<source src=''audio.mp3'' type=''audio/mpeg''>`


    `</audio>`


    And for video it would work in much the same way:


    `<video autoplay>`


        `<source src=''../video.ogv'' type=''video/ogg;''>`


        `<source src=''../video.mp4'' type=''video/mp4''>`


        `<source src=''../video.webm'' type=''video/webm''>`


    `</video>`


    ### Preload


    This is slightly less obvious than the previous two attributes, preload is used
    to attempt to load either the entire audio or video file or the metadata (such
    as duration) at page load; this is based on the value of the attribute. If preload
    is not set, then it is the choice of the browser (the default is usually metadata).
    That said, even if the attribute is set, it is only a hint and is used as the
    preferred choice for the browser to consider it based on a number of conditions
    that change between browsers.


    There are three acceptable values for preload. These are


    *   auto: This gives priority to the browser, if it is appropriate to do so. For
    example, if the connectivity is good, then it may try to download the entire file.
    With preload set to auto, the `readyState` variable will increment from 0 (nothing
    downloaded) to 4 (will play without interruption), a fully preloaded file will
    have a 4 `readyState`.

    *   metadata: This is the most commonly used value because it is a kind of “happy
    medium.” It basically lets the browser know that it would be great to know about
    the file, including the duration for instance, but that the entire file isn’t
    needed until the user clicks play. With preload set to metadata, the `readyState`
    will be set to 1 (has metadata) once the metadata has downloaded and may move
    to 2 or 3 depending on how aggressive the fetching is.

    *   none: This reduces stress on the server by telling the browser that no information
    is needed until the user clicks play. Of course, as I said earlier, this is just
    a hint and so it may decide to give the metadata or entire file anyway.


    The attribute works just like the other examples, for audio:


    `<audio preload=''metadata''>`


       `<source src=''audio.ogg'' type=''audio/ogg; codecs=vorbis''>`


       `<source src=''audio.mp3'' type=''audio/mpeg''>`


    `</audio>`


    And for video:


    `<video preload=''metadata''>`


        `<source src=''../video.ogv'' type=''video/ogg;''>`


        `<source src=''../video.mp4'' type=''video/mp4''>`


        `<source src=''../video.webm'' type=''video/webm''>`


    `</video>`


    Note


    This attribute is well supported in most browsers, except Presto-based Opera browsers,
    which use the old name of autobuffer.


    ### Loop


    This is an attribute that forces the audio or video file to loop back to the beginning
    once the file has completed playing. This can be either set as an attribute (straight
    to the HTML) or as a property (from JavaScript). Using `loop` as a property lets
    you check the current state (whether it is true or false).


    `<audio loop>`


       `<source src=''audio.ogg'' type=''audio/ogg; codecs=vorbis''>`


       `<source src=''audio.mp3'' type=''audio/mpeg''>`


    `</audio>`


    You can do the same for video:


    `<video loop>`


        `<source src=''../video.ogv'' type=''video/ogg;''>`


        `<source src=''../video.mp4'' type=''video/mp4''>`


        `<source src=''../video.webm'' type=''video/webm''>`


    `</video>`


    ### Played


    You will often want to know which parts of the media have been played, especially
    if you are creating a media player or perhaps an advertisement of some kind. `Played`
    is a property that can be used with JavaScript to get a `TimeRanges` object that
    has the start and end times of each portion of the track that has been played.
    For example, if I listened to the beginning for about 20 seconds, then calling
    `ele.played.start(0)` would give 0 because it is the beginning and `ele.played.end(0)`
    would give 20; the parameter is the index, so 0 would be the first portion listened
    and 1 would be the second. You can use `ele.played.length` to find the amount
    of separate portions listened to.


    `var ele = document.querySelector(''audio'');`


    `function log()  {`


      `for (var i = 0; i < ele.played.length; i++)`


      `{`


          `console.log("Portion " + i);`


          `console.log("  Start: " + ele.played.start(i));`


          `console.log("  End: " + ele.played.end(i));`


      `}`


    `}`


    To change this to work with video, you just need to select video instead of audio:


    `var ele = document.querySelector(''video'');`


    In this example, if you run `log()` from the console, then you will see each portion
    of the audio or video that you have played to with the start and end times in
    seconds. Aside from purely demonstration purposes or for debugging, the `played`
    property is useful in media players as a way for users to see parts they have
    already listened to.


    ### Buffered


    As with `played`, we are able to get a `TimeRanges` object for the portions of
    the file that have buffered. It helps to know the buffered portions of the file
    when making a media player (which we will be doing in a later chapter) where instead
    of using the controls `attribute`, we can instead create a custom control that
    shows the buffered areas of the audio file. Unlike `played`, `buffered` may have
    multiple indexes, for example if the user has moved the playhead.


    `var ele = document.querySelector(''audio'');`


    `// Or: var ele = document.querySelector(''video'');`


    `function log()  {`


        `for (var i = 0; i < ele.buffered.length; i++)`


        `{`


          `console.log("Portion " + i);`


          `console.log("  Start: " + ele.buffered.start(i));`


          `console.log("  End: " + ele.buffered.end(i));`


        `}`


    `}`'
  trans: "\n# 控件\n\n好了，现在我们的页面上有了音频——但我们可以做得更多。目前浏览器可以选择要播放的文件，但我们无法告诉它开始播放。当我们想用\
    \ JavaScript 来控制音频或视频时，它当前的状态很有用，但理想情况下，它应该有一个媒体播放器。大多数浏览器都有内置播放器，只需在元素中添加 `controls`\
    \ 即可触发。就像这样：\n\n```\n<audio controls>\n  <source src='audio.ogg' type='audio/ogg;\
    \ codecs=vorbis'>\n  <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\
    \n同样，对于视频，我们会使用以下代码：\n\n```\n<video controls>\n  <source src='../video.ogv' type='video/ogg;'>\n\
    \  <source src='../video.mp4' type='video/mp4'>\n  <source src='../video.webm'\
    \ type='video/webm'>\n</video>\n```\n\n如果你在浏览器中运行这段代码，现在应该会看到一个基本的音频（或视频）播放器。如果你想提供自定义播放器以配合网站的样式，那么最好的方法可能是自己创建\
    \ DOM 元素并按需设置样式，然后将其挂载到一个未启用 `controls` 的 `<audio>`/`<video>` 元素上。\n\n**注意**\n\
    \n有些浏览器使用 Shadow DOM，因此理论上你可以用 CSS 设置默认控件的样式，但在撰写本文时，每个浏览器的实现都大相径庭，而且 Shadow DOM\
    \ 仍处于初期阶段。我建议查看 [www.caniuse.com](http://www.caniuse.com/) 了解当前各浏览器的实现状态。\n\n\
    # 自动播放\n\n有时你可能有正当理由希望音频或视频自动播放。虽然这种做法通常不讨喜，但实现起来很简单。与 `controls` 类似，你只需在元素中添加\
    \ `autoplay` 属性即可。你也可以使用 JavaScript 通过 `element.autoplay = true` 来设置，就像这样：\n\n\
    ```\n<audio autoplay>\n  <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n\
    \  <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\n视频的工作方式也大致相同：\n\
    \n```\n<video autoplay>\n  <source src='../video.ogv' type='video/ogg;'>\n  <source\
    \ src='../video.mp4' type='video/mp4'>\n  <source src='../video.webm' type='video/webm'>\n\
    </video>\n```\n\n# 预加载\n\n与前两个属性相比，`preload` 的作用不太明显，它用于在页面加载时尝试加载整个音频或视频文件，或者仅加载元数据（如时长）；这取决于属性的值。如果未设置\
    \ `preload`，则由浏览器决定（默认值通常是 `metadata`）。话虽如此，即使设置了该属性，它也只是个提示，浏览器会根据不同浏览器之间变化的多种条件，将其作为首选考虑。\n\
    \n`preload` 有三个可接受的值。分别是：\n\n- `auto`：如果条件合适，则让浏览器优先处理。例如，如果连接状况良好，它可能会尝试下载整个文件。当\
    \ `preload` 设置为 `auto` 时，`readyState` 变量会从 0（未下载任何内容）递增到 4（可无中断播放），一个完全预加载的文件的\
    \ `readyState` 为 4。\n- `metadata`：这是最常用的值，因为它是一种“折中方案”。它基本上让浏览器知道，了解文件信息（例如时长）会很好，但在用户点击播放之前，不需要整个文件。当\
    \ `preload` 设置为 `metadata` 时，一旦元数据下载完成，`readyState` 将被设置为 1（拥有元数据），并且可能根据获取的积极程度变为\
    \ 2 或 3。\n- `none`：通过告诉浏览器在用户点击播放之前不需要任何信息，来减轻服务器压力。当然，正如我之前所说，这只是一个提示，因此浏览器可能仍会决定提供元数据或整个文件。\n\
    \n该属性的工作方式与其他示例类似，对于音频：\n\n```\n<audio preload='metadata'>\n  <source src='audio.ogg'\
    \ type='audio/ogg; codecs=vorbis'>\n  <source src='audio.mp3' type='audio/mpeg'>\n\
    </audio>\n```\n\n对于视频：\n\n```\n<video preload='metadata'>\n  <source src='../video.ogv'\
    \ type='video/ogg;'>\n  <source src='../video.mp4' type='video/mp4'>\n  <source\
    \ src='../video.webm' type='video/webm'>\n</video>\n```\n\n**注意**\n\n该属性在大多数浏览器中支持良好，但基于\
    \ Presto 的 Opera 浏览器除外，它们使用的是旧的名称 `autobuffer`。\n\n# 循环\n\n这是一个强制音频或视频文件在播放完毕后从头开始循环的属性。它可以作为属性（直接在\
    \ HTML 中设置）或属性（通过 JavaScript 设置）来使用。将 `loop` 作为属性使用，你可以检查当前状态（是 `true` 还是 `false`）。\n\
    \n```\n<audio loop>\n  <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n\
    \  <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\n视频也可以这样做：\n\n\
    ```\n<video loop>\n  <source src='../video.ogv' type='video/ogg;'>\n  <source\
    \ src='../video.mp4' type='video/mp4'>\n  <source src='../video.webm' type='video/webm'>\n\
    </video>\n```\n\n# 已播放部分\n\n你通常需要知道媒体的哪些部分已被播放，尤其是在创建媒体播放器或某种广告时。`Played` 是一个属性，可以与\
    \ JavaScript 一起使用来获取一个 `TimeRanges` 对象，该对象包含已播放的每个片段的开始和结束时间。例如，如果我听了开头大约 20 秒，那么调用\
    \ `ele.played.start(0)` 将返回 0，因为这是开头，而 `ele.played.end(0)` 将返回 20；参数是索引，因此 0 表示第一个收听的片段，1\
    \ 表示第二个。你可以使用 `ele.played.length` 来查找已收听的独立片段的数量。\n\n```\nvar ele = document.querySelector('audio');\n\
    \nfunction log() {\n  for (var i = 0; i < ele.played.length; i++)\n  {\n     \
    \ console.log(\"片段 \" + i);\n      console.log(\"  开始: \" + ele.played.start(i));\n\
    \      console.log(\"  结束: \" + ele.played.end(i));\n  }\n}\n```\n\n要将其改为适用于视频，你只需选择视频而不是音频：\n\
    \n```\nvar ele = document.querySelector('video');\n```\n\n在这个例子中，如果你从控制台运行 `log()`，那么你将看到你已播放的音频或视频的每个片段，以及以秒为单位的开始和结束时间。除了纯粹的演示或调试目的之外，`played`\
    \ 属性在媒体播放器中很有用，它可以让用户看到他们已经听过的部分。\n\n# 缓冲\n\n与 `played` 类似，我们可以获取一个代表文件中已缓冲部分的\
    \ `TimeRanges` 对象。在制作媒体播放器时（我们将在后续章节中实现），了解文件的缓冲部分很有帮助，我们可以不使用 `controls` 属性，而是创建显示音频文件缓冲区域的自定义控件。与\
    \ `played` 不同，`buffered` 可能有多个索引，例如，如果用户移动了播放头。\n\n```\nvar ele = document.querySelector('audio');\n\
    // 或： var ele = document.querySelector('video');\n\nfunction log() {\n    for\
    \ (var i = 0; i < ele.buffered.length; i++)\n    {\n      console.log(\"片段 \"\
    \ + i);\n      console.log(\"  开始: \" + ele.buffered.start(i));\n      console.log(\"\
    \  结束: \" + ele.buffered.end(i));\n    }\n}\n```\n"
- fmt: "### Duration\n\nTo find the length of the audio or video file we can use the\
    \ `duration` property, which returns the duration in seconds. If the audio or\
    \ video element is streaming a file, then the duration will be set as infinity\
    \ (specifically, according to the spec, positive infinity) unless the streaming\
    \ stops. In this case the duration will be returned as the amount of seconds of\
    \ the length of what has been streamed. If the duration changes, such as in the\
    \ case of the streaming, then the `durationchange` event is triggered, you can\
    \ use an event listener to trigger styling or DOM changes to let the user know\
    \ a file has stopped streaming.\n\n```\nvar ele = document.querySelector('audio');\n\
    \n// Or: var ele = document.querySelector('video');\n\nconsole.log(ele.duration);\n\
    ```\n\n### Volume\n\nThe `volume` property can be used to both get and set the\
    \ volume; it is controlled using a number between 0.0 and 1.0. By default the\
    \ initial volume will be 1.0, which is the maximum that the browser will allow\
    \ (not necessarily the maximum of the speakers). The volume is simply a setter/getter\
    \ property, making it easy to get access and to modify the volume:\n\n```\nvar\
    \ ele = document.querySelector('audio');\n\n// Or: var ele = document.querySelector('video');\n\
    \nvar vol = 0.5; // The volume you want to set it to\n\nconsole.log(ele.volume);\n\
    \nele.volume = vol;\n\nconsole.log(ele.volume);\n```\n\n### Playback Rate\n\n\
    The `playbackrate` is the speed at which the audio/video is played. The original\
    \ speed is 1.0 and the rate is the multiplication of the initial speed. For example,\
    \ if you change the `playbackrate` to 0.5, then you get the audio or video played\
    \ in slow motion. On the other hand, if you change the rate to 1.5, the audio\
    \ or video would be fast-forwarded.\n\n```\nvar ele = document.querySelector('audio');\n\
    \n// Or: var ele = document.querySelector('video');\n\nfunction slowMotion() \
    \ {\n    ele.playbackrate = 0.5;\n}\n\nfunction fastForward()  {\n    ele.playbackrate\
    \ = 1.5;\n}\n```\n\n### Network State\n\nThis property is used to determine the\
    \ network activity. It returns 4 numbers, from 0 to 3, which correspond to the\
    \ following states:\n\n- `0. NETWORK_EMPTY` – This means that the element has\
    \ not yet been initialized.\n- `1. NETWORK_IDLE` – This means that the correct\
    \ audio/video file has been chosen, but is not currently using the network.\n\
    - `2. NETWORK_LOADING` – The audio/video is being downloaded.\n- `3. NETWORK_NO_SOURCE`\
    \ – Either none of the given files are compatible or no file was provided.\n\n\
    Unlike many of the previous properties, `networkState` is a read-only property.\
    \ This code shows how it can be used:\n\n```\nvar ele = document.querySelector('audio');\n\
    \n// Or: var ele = document.querySelector('video');\n\nfunction logNetworkState()\
    \  {\n    console.log(ele.networkState);\n}\n```\n\n## Web Audio API\n\nLet’s\
    \ move on and delve into the realm of audio analysis, which we will be using in\
    \ later chapters to create visualizations of the audio. For this we’ll be using\
    \ the Web Audio API.\n\nThe API is based on the concept of nodes, where each one\
    \ takes the current audio (which could be either the original version or already\
    \ have been through any number of nodes), which it then does something with. I\
    \ said “something” to be purposely vague, nodes can be coded in any way that you\
    \ want them to be. Some of the default usages include: channel splitting and merging,\
    \ oscillation, and gain control. One analogy that I particularly like was one\
    \ Stuart Memo made in his “An introduction to the Web Audio API” article in which\
    \ he explained how the API nodes work just the same as adding a distortion pedal\
    \ and an amp to a guitar, you can remove either node or add new nodes without\
    \ having to do anything other than change the cables. For now, we are just going\
    \ to use `AnalyserNode` to see exactly what is going on within the audio. From\
    \ there we will start using other nodes to understand what has changed.\n\n###\
    \ Analyzing Audio\n\nFirst, we need to create both an audio context and an analyzer\
    \ that we then connect together. The context is the interface that gives access\
    \ to all properties of the audio, as well as the methods that are used to create\
    \ and connect nodes.\n\n```\nvar ele = document.querySelector('audio');\n\nvar\
    \ ctx = new AudioContext();\n\nvar analyser = ctx.createAnalyser();\n\nvar source\
    \ = ctx.createMediaElementSource(ele);\n\nsource.connect(analyser);\n\nanalyser.connect(ctx.destination);\n\
    ```\n\nYou will note that I am using `createMediaElementSource` within a “source”\
    \ variable. This simply re-routes the audio from the `<audio>` element into the\
    \ API. This means that the audio you play through the element will now be controlled\
    \ by and used as a node of the API’s context graph (the way in which each node\
    \ is connected). It also means that the Web Audio API, rather than the element,\
    \ is controlling volume and other attributes (except controlling when the music\
    \ is playing) so if you would still like to use the element controls, you need\
    \ to hook it up using a `GainNode`, like so:\n\n```\nvar ele = document.querySelector('audio');\n\
    \nvar ctx = new AudioContext();\n\nvar analyser = ctx.createAnalyser();\n\nvar\
    \ source = ctx.createMediaElementSource(ele);\n\nvar volumeControl = ctx.createGainNode();\n\
    \nsource.connect(volumeControl);\n\nvolumeControl.connect(analyser);\n\nanalyser.connect(ctx.destination);\n\
    \nele.addEventListener('onvolumechange', volumeControl, false);\n\nfunction volumeChange()\
    \  {\n    volumeControl.gain.value = ele.volume;\n}\n\nfunction log()  {\n   \
    \ freqData = new Uint8Array(analyser.frequencyBinCount);\n    analyser.getByteFrequencyData(freqData);\n\
    \    console.log(freqData);\n}\n```\n\nNote\n\nAt the time of writing, the `onvolumechange`\
    \ event does not work as a dynamic event listener, so instead you need to include\
    \ `onvolumechange=\"volumeChange();\"` on the `<audio>` element.\n\nNow back to\
    \ the analyzer. This node gives us access to data from a Fast Fourier Transform\
    \ (FFT), which is a complicated algorithm used for a variety of things including\
    \ audio analysis. There are two types of data available, frequency and time domain.\
    \ Frequency data can be gained using `getFloatFrequencyData` or `getByteFrequencyData`\
    \ (depending on type of data you want, we will be using the second to store the\
    \ data in an array of bytes) both of these methods give an array of normalized\
    \ frequencies. The reason for the two methods is that the resolution (that is,\
    \ the quality) of the float array is much higher than that of the byte. Due to\
    \ the way it is normalized, we need to go through each index of the array and\
    \ multiply it by the sample rate divided by size of the FFT. To see the outcome\
    \ of this, let’s log it to the console:\n\n```\nfunction log()  {\n    freqData\
    \ = new Uint8Array(analyser.frequencyBinCount);\n    analyser.getByteFrequencyData(freqData);\n\
    \    for (var i = 0; i < freqData.length; i++) {\n        console.log(freqData[i]\
    \ * ctx.sampleRate / analyser.fftSize);\n    }\n}\n```\n\nYou should now see a\
    \ variety of numbers, which are dependent on the audio you are playing. Each number\
    \ represents the frequency (440Hz is the easiest frequency to remember, this is\
    \ the A above Middle C), which we will go into more detail in a later chapter\
    \ (where I introduce some music theory). For now, just look at the data and think\
    \ of things you can do with it (maybe even try to implement them). Of course,\
    \ a list of seemingly random numbers is no good to anyone, visualizations are\
    \ key to understanding any type of data, and so we are now going to use what we\
    \ learned in the previous chapter to create 2D graphs that visualize the music."
