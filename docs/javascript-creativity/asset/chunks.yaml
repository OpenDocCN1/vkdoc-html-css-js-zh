  trans: '

    ### 时间线


    到目前为止，我们已经讨论了调试器中用于修复代码并确保其按预期工作的功能。然而，有时让代码运行起来是容易的部分——让代码运行得*快*往往困难得多。我们仍在讨论调试器，但此时不再是为了检查代码的每个部分是否正常工作而进行检查，而是需要记录整个过程，以便我们能发现性能上的模式（着眼于代码的整体运行情况，而非每个单独的函数/行）。这个主题很容易就能写满一整本书，所以我将介绍基础知识，这应该能为你理解并提升性能提供一个良好的起点。


    在 Chrome 中，我们用于衡量代码性能的工具是时间线。我应该指出，网络面板也与此相关，因为它能让我们看到哪些资源导致了延迟。但我将要重点关注代码的运行，而不是资源，因为与代码性能测试（这对于更具创造性的
    Web 应用至关重要）相比，你更可能对资源（在普通网站上）有经验。


    要开始使用时间线，你需要通过点击圆形按钮来记录代码的运行。一旦开始记录，你会注意到一些图表被创建出来。在撰写本文时，会记录三个方面：事件、帧和内存；所有这些都是同时记录的，但只能通过选择它们来分别查看。在基本层面上，这些功能为你提供了一种测试代码各部分速度的好方法，因为它像栈一样分解代码，向你展示每个函数调用。这是一个相当简单的寻找瓶颈的方法，但这仅仅触及了时间线功能的皮毛。


    它不仅仅显示函数花费的时间，还将其分解为加载、脚本、渲染和绘制。这对于了解为什么一个函数花费的时间比预期要长极其有用。加载类别包含任何 XHR（AJAX）调用以及
    HTML 解析。函数内的逻辑包含在脚本类别中。渲染是进行 DOM 操作的地方，主要是重新计算样式和布局。绘制是浏览器更新显示内容以匹配渲染结果的地方，包括对画布和其他不直接与
    DOM 相关的元素的任何更改。


    在第二章中，我们使用画布模拟鸟群（称为 Boids），所以我使用时间线记录了它，以向你展示其工作原理。图 1-2 展示了事件时间线，有助于函数计时并直观地看到它们产生的栈。截图中只显示了两种不同的颜色。这是因为使用画布时
    DOM 元素极少，因此不需要加载和渲染。DOM 的缺失也是时间线内模式形成的相同原因，如果我们记录一个普通网站的性能，那么可能会看到滚动或悬停在按钮上时的变化；所以时间线对于画布动画之外的功能肯定也很强大！图
    1-3 展示了帧时间线。它测量页面的每秒帧数 (FPS)，因为低 FPS 会使站点或动画看起来“卡顿”，而不是人们期望的流畅体验。本节的第三张截图，图 1-4，展示了内存时间线；你可以从峰值看出，内存存储的数据越来越多，直到垃圾回收器介入并清除存储旧数据的内存。你会注意到时间线下方有相当多的空白区域。这个空间用于显示
    DOM 节点和事件处理程序数量的图表（正如你在图 1-5 中所见，它展示了我曾经制作的一个基本作品集网站的时间线）。


    ![A978-1-4302-5945-9_1_Fig5_HTML.jpg](img/A978-1-4302-5945-9_1_Fig5_HTML.jpg)


    **图 1-5.** 显示作品集网站上 DOM 元素渲染的内存时间线


    ![A978-1-4302-5945-9_1_Fig4_HTML.jpg](img/A978-1-4302-5945-9_1_Fig4_HTML.jpg)


    **图 1-4.** 显示 Chrome 开发者工具的内存时间线


    ![A978-1-4302-5945-9_1_Fig3_HTML.jpg](img/A978-1-4302-5945-9_1_Fig3_HTML.jpg)


    **图 1-3.** 显示 Chrome 开发者工具的帧时间线


    ![A978-1-4302-5945-9_1_Fig2_HTML.jpg](img/A978-1-4302-5945-9_1_Fig2_HTML.jpg)


    **图 1-2.** 显示 Chrome 开发者工具的事件时间线


    ### 画布分析


    时间线是一个非常强大的工具，但在调试画布动画时，它常常感觉像是猜测（因为大多数动画都是通过脚本动态生成的，我们并不真正知道每个函数实际上在做什么）。幸运的是，Chrome
    开发者工具中有一个全新的工具，可以让你捕获画布帧（在撰写本文时，它仍仅在 Chrome Canary 版本中可用）。它在“分析”选项卡下（你可能需要在开发者工具设置中启用实验性功能）。


    捕获的帧分析与断点非常相似，不同之处在于它不会暂停代码，而是记录一帧，并允许你逐步执行每个发出的调用。这非常强大，因为它能让你看到确切的执行顺序，并显示该特定步骤下画布的状态，如图
    1-6 所示。


    ![A978-1-4302-5945-9_1_Fig6_HTML.jpg](img/A978-1-4302-5945-9_1_Fig6_HTML.jpg)


    **图 1-6.** 捕获画布帧


    ## 总结


    这开篇一章希望能为你阅读本书的其余部分做好准备。我坚信仅仅通过阅读书本是无法学会的，所以我写作的方式是希望引导你掌握不同的技巧和了解每个主题的方法，而不是写一本“操作指南”式的书。因此，本章的调试部分在本书余下部分应该对你非常有用，因为调试不仅仅是修复损坏的代码，更是探索代码实际如何工作以及如何改进它。


    # 2. Canvas 与动画基础


    在交互的世界里，一个简单的动画既可以成为一个很好的入门学习内容，也能有效地向用户传达信息。许多人认为网站上所有的交互功能都是游戏，但事实并非如此！我希望通过本章，你能了解到如何做一些与众不同的事情——如何通过专业的动画从标准网站中脱颖而出。


    如今，我们可以通过多种方式添加动画，配合日益强大的 HTML 和 CSS 技术，包括：变换、画布和 SVG。我重点关注画布，因为它在本书中被大量使用，不过你也应该能自如地使用这三种技术，并理解它们各自的优缺点。简而言之，你可以将画布视为光栅图，将
    SVG 视为矢量图，而变换则用于操作 DOM 元素。

    '
- fmt: "# What Is Canvas?\n\n`Canvas` is well named, as it can be likened to a painter's\
    \ canvas because it is empty until you start painting. On its own, `canvas` is\
    \ no different than a `div` — it is a blank non-semantic block element. The difference\
    \ however is that `canvas` has a context that can be used for drawing on with\
    \ JavaScript, this context can be extracted using `var ctx = canvas.getContext('2d')`;\
    \ where `canvas` is a variable containing reference to a `canvas` element. You\
    \ may have noticed that I have specified a 2d context, `getContext` allows you\
    \ to choose between multiple contexts, currently the 2d context is the most common\
    \ and most well developed; however `WebGL` and other technologies can be used\
    \ for a 3d context.\n\nBecause `canvas` is not supported in legacy browsers, it\
    \ is possible to declare a fallback so that other content can be shown instead\
    \ — such as a static image or a flash animation. To add a fallback you simply\
    \ just write html between the `canvas` tags. I would recommend you avoid writing\
    \ \"Canvas is not supported in your browser\" because the experience of a website\
    \ should be tailored to the capabilities of the device/browser rather than to\
    \ criticize the user for their browsing habits; however for simplicity's sake\
    \ I will be breaking that rule for many exercises in this book.\n\n```\n<canvas\
    \ id=\"animation\">\n    <img src=\"images/canvas-fallback.png\">\n</canvas>\n\
    ```\n\nOnce you have a context, you can start drawing. All drawing features of\
    \ the context use the Cartesian grid system in which you have both the x and y\
    \ axes, it should be noted that — as with most computer-based graphics — the context\
    \ uses the bottom-right quadrant, so the top-left corner is its origin (0,0).\n\
    \n```\nvar ctx = canvas.getContext('2d');\n//fillRect(x, y, width, height);\n\
    ctx.fillRect(10, 10, 50, 50);\n```\n\nThe preceding code paints a 50px × 50px\
    \ square at 10px away from the top-left corner on each axis. Do note that any\
    \ four-sided shapes are called rectangles in canvas. By default this rectangle\
    \ is black. Because the drawing onto context is procedural, it is required that\
    \ we change color before we draw the object. After we have changed the color,\
    \ all objects will use the same color until it is changed again.\n\n```\n// This\
    \ sets the fill color to red\nctx.fillStyle = \"#ff0000\";\n// fillRectangle(x,\
    \ y, width, height);\nctx.fillRect(10, 10, 50, 50);\n```\n\nAs you can see in\
    \ Figure [2-1](#A978-1-4302-5945-9_2_Chapter.html#Fig1), the preceding code simply\
    \ draws the same rectangle in red.\n\n![A978-1-4302-5945-9_2_Fig1_HTML.jpg](A978-1-4302-5945-9_2_Fig1_HTML.jpg)\n\
    \nFigure 2-1. A simple red rectangle\n\nSo now, since we are concerned with animation,\
    \ let's get this square moving!\n\n## RequestAnimationFrame\n\nIf you have ever\
    \ needed repetitive tasks in JavaScript, such as polling, then you will probably\
    \ have experience with `setInterval` and `setTimeout`. Both of these functions\
    \ are unreliable because they can trigger at anytime after the timeout rather\
    \ than on it, which can cause trouble if you need them to be triggered immediately\
    \ (something that is quite important for smooth animations). Also, many browsers\
    \ have a minimum timer resolution of about 16ms that can cause delays especially\
    \ when not expected. Another problem with using timeouts is that you need to set\
    \ the timeout manually; so any testing will be specific to that computer. On the\
    \ other hand, `requestAnimationFrame` (rAF) can be used to trigger at the best\
    \ time for the computer it is running on. Rather than a set time, it runs up to\
    \ 60 frames per second but fires less frequently (such as when the browser tab\
    \ is in the background). A further optimization that can be used is the second\
    \ parameter, which can be a `DOM` element to constrain the rAF.\n\nDue to a lack\
    \ of browser support of `requestAnimationFrame` in some browsers at the time of\
    \ writing, it is recommended to use a shim so that it works across browsers that\
    \ implement a version of it. I will not be including this in the code examples,\
    \ but you should take it as required until all browsers support the standards\
    \ correctly.\n\n```\n// Shim for RequestAnimationFrame\n(function() {\n  var requestAnimationFrame\
    \ = window.requestAnimationFrame || window.mozRequestAnimationFrame ||\n     \
    \                         window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;\n\
    \  window.requestAnimationFrame = requestAnimationFrame;\n})();\n```\n\nI find\
    \ that it is important to separate code, so while I will not be using any particular\
    \ design patterns yet (being small amounts of code), I encourage you to organize\
    \ your code appropriately. For this section I think `logic()` and `draw()` are\
    \ appropriate names for functions.\n\n```\n// This is a way of selecting\nvar\
    \ ele = document.querySelector(\"#animation\");\nvar ctx = ele.getContext('2d');\n\
    var x = y = 10;\nvar width = height = 50;\n\nfunction logic () {\n    x += 10;\n\
    \    if (x < ele.width - width) requestAnimationFrame(draw);\n}\n\nfunction draw()\
    \  {\n    ctx.clearRect(0, 0, ele.width, ele.height);\n    // This sets the fill\
    \ colour to red\n    ctx.fillStyle = \"#ff0000\";\n    // fillRectangle(x, y,\
    \ width, height);\n    ctx.fillRect(x, y, 50, 50);\n}\n\nrequestAnimationFrame(draw);\n\
    setInterval(logic, 1000/60);\n```\n\nYou will notice that I have used both `requestAnimationFrame`\
    \ and `setInterval`, this is due to the fact that you rarely want the animation\
    \ to be running at full speed (dependent on the computer) so this allows the speed\
    \ to be set while still using `requestAnimationFrame` to improve the performance\
    \ of the rendering. Now, I mentioned animation does not have to run at full speed,\
    \ but I have not yet showed you how to easily change that speed — for that we\
    \ are going to use Linear Interpolation.\n\n## Linear Interpolation\n\nLinear\
    \ Interpolation (lerp) is used to define subcoordinates of the particular path.\
    \ This can be likened to taking a long journey and stopping off for food along\
    \ the way. In animation, it is used to smooth out the path, so instead of jumping\
    \ from one point to another it appears to slide between them (of course, it actually\
    \ just makes much smaller jumps).\n\n```\nn = start + (end - start) * speed\n\
    ```\n\nThe preceding code equation is used to work out the next point of the interpolation.\
    \ This should be iterated so that every frame the start variable is the `n` of\
    \ the previous frame, because it is gradually moving toward the end point (now\
    \ dependent on the speed set rather than the fps).\n\n```\nvar ele = document.querySelector(\"\
    #animation\");\nvar ctx = ele.getContext('2d');\nvar startX = 10;\nvar startY\
    \ = 10;\nvar endX = ele.width - 50;\nvar x = startX;\nvar y = startY;\nvar duration\
    \ = 0;\nvar width = height = 50;\n\nfunction lerp(start, end, speed) {\n    return\
    \ start + (end - start) * speed;\n}\n\nfunction logic () {\n    duration += 0.02;\n\
    \    x = lerp(startX, endX, duration);\n    if (x < ele.width - width)\n     \
    \   requestAnimationFrame(draw);\n}\n\nfunction draw()  {\n    ctx.clearRect(0,\
    \ 0, ele.width, ele.height);\n    // This sets the fill colour to red\n    ctx.fillStyle\
    \ = \"#ff0000\";\n    // fillRectangle(x, y, width, height);\n    ctx.fillRect(x,\
    \ y, 50, 50);\n}\n\nrequestAnimationFrame(draw);\nsetInterval(logic, 1000/60);\n\
    ```\n\nThis is not too different from the previous version, except we now have\
    \ a `lerp()` function almost identical to the earlier equation. I have also defined\
    \ `duration`, `startX`, and `startY` variables to be plugged into the function.\
    \ The biggest change is `logic()`. Rather than adjusting `x` (which causes it\
    \ to jump), I increased `duration` by a tiny amount, which I then simply plugged\
    \ into the `lerp()` function to get the new value for `x` (which is somewhere\
    \ on the path to the final x destination)."
  raw: '## What Is Canvas?


    Canvas is well named, as it can be likened to a painter’s canvas because it is
    empty until you start painting. On its own, canvas is no different than a div`—`it
    is a blank non-semantic block element. The difference however is that canvas has
    a context that can be used for drawing on with JavaScript, this context can be
    extracted using `var ctx = canvas.getContext(''2d'')` `;` where canvas is a variable
    containing reference to a canvas element. You may have noticed that I have specified
    a 2d context, `getContext` allows you to choose between multiple contexts, currently
    the 2d context is the most common and most well developed; however WebGL and other
    technologies can be used for a 3d context.


    Because canvas is not supported in legacy browsers, it is possible to declare
    a fallback so that other content can be shown instead`—`such as a static image
    or a flash animation. To add a fallback you simply just write html between the
    canvas tags. I would recommend you avoid writing “Canvas is not supported in your
    browser” because the experience of a website should be tailored to the capabilities
    of the device/browser rather than to criticize the user for their browsing habits;
    however for simplicity’s sake I will be breaking that rule for many exercises
    in this book.


    `<canvas id="animation">`


        `<img src="images/canvas-fallback.png">`


    `</canvas>`


    Once you have a context, you can start drawing. All drawing features of the context
    use the Cartesian grid system in which you have both the x and y axes, it should
    be noted that`—`as with most computer-based graphics`—`the context uses the bottom-right
    quadrant, so the top-left corner is its origin (0,0).


    `var ctx = canvas.getContext(''2d'');`


    `//fillRect(x, y, width, height);`


    `ctx.fillRect(10, 10, 50, 50);`


    The preceding code paints a 50px `×` 50px square at 10px away from the top-left
    corner on each axis. Do note that any four-sided shapes are called rectangles
    in canvas. By default this rectangle is black. Because the drawing onto context
    is procedural, it is required that we change color before we draw the object.
    After we have changed the color, all objects will use the same color until it
    is changed again.


    `// This sets the fill color to red`


    `ctx.fillStyle = "#ff0000";`


    `// fillRectangle(x, y, width, height);`


    `ctx.fillRect(10, 10, 50, 50);`


    As you can see in Figure [2-1](#A978-1-4302-5945-9_2_Chapter.html#Fig1), the preceding
    code simply draws the same rectangle in red.


    ![A978-1-4302-5945-9_2_Fig1_HTML.jpg](A978-1-4302-5945-9_2_Fig1_HTML.jpg)


    Figure 2-1.


    A simple red rectangle


    So now, since we are concerned with animation, let’s get this square moving!


    ### RequestAnimationFrame


    If you have ever needed repetitive tasks in JavaScript, such as polling, then
    you will probably have experience with `setInterval` and `setTimeout`. Both of
    these functions are unreliable because they can trigger at anytime after the timeout
    rather than on it, which can cause trouble if you need them to be triggered immediately
    (something that is quite important for smooth animations). Also, many browsers
    have a minimum timer resolution of about 16ms that can cause delays especially
    when not expected. Another problem with using timeouts is that you need to set
    the timeout manually; so any testing will be specific to that computer. On the
    other hand, `requestAnimationFrame` (rAF) can be used to trigger at the best time
    for the computer it is running on. Rather than a set time, it runs up to 60 frames
    per second but fires less frequently (such as when the browser tab is in the background).
    A further optimization that can be used is the second parameter, which can be
    a DOM element to constrain the rAF.


    Due to a lack of browser support of `requestAnimationFrame` in some browsers at
    the time of writing, it is recommended to use a shim so that it works across browsers
    that implement a version of it. I will not be including this in the code examples,
    but you should take it as required until all browsers support the standards correctly.


    `// Shim for RequestAnimationFrame`


    `(function() {`


      `var requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame
    ||`


                                  `window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;`


      `window.requestAnimationFrame = requestAnimationFrame;`


    `})();`


    I find that it is important to separate code, so while I will not be using any
    particular design patterns yet (being small amounts of code), I encourage you
    to organize your code appropriately. For this section I think `logic()` and `draw()`
    are appropriate names for functions.


    `// This is a way of selecting`


    `var ele = document.querySelector("#animation");`


    `var ctx = ele.getContext(''2d'');`


    `var x = y = 10;`


    `var width = height = 50;`


    `function logic () {`


        `x += 10;`


        `if (x < ele.width - width) requestAnimationFrame(draw);`


    `}`


    `function draw()  {`


        `ctx.clearRect(0, 0, ele.width, ele.height);`


        `// This sets the fill colour to red`


        `ctx.fillStyle = "#ff0000";`


        `// fillRectangle(x, y, width, height);`


        `ctx.fillRect(x, y, 50, 50);`


    `}`


    `requestAnimationFrame(draw);`


    `setInterval(logic, 1000/60);`


    You will notice that I have used both `requestAnimationFrame` and `setInterval`,
    this is due to the fact that you rarely want the animation to be running at full
    speed (dependent on the computer) so this allows the speed to be set while still
    using `requestAnimationFrame` to improve the performance of the rendering. Now,
    I mentioned animation does not have to run at full speed, but I have not yet showed
    you how to easily change that speed`—`for that we are going to use Linear Interpolation.


    ### Linear Interpolation


    Linear Interpolation (lerp) is used to define subcoordinates of the particular
    path. This can be likened to taking a long journey and stopping off for food along
    the way. In animation, it is used to smooth out the path, so instead of jumping
    from one point to another it appears to slide between them (of course, it actually
    just makes much smaller jumps).


    `n = start + (end - start) * speed`


    The preceding code equation is used to work out the next point of the interpolation.
    This should be iterated so that every frame the start variable is the `n` of the
    previous frame, because it is gradually moving toward the end point (now dependent
    on the speed set rather than the fps).


    `var ele = document.querySelector("#animation");`


    `var ctx = ele.getContext(''2d'');`


    `var startX = 10;`


    `var startY = 10;`


    `var endX = ele.width - 50;`


    `var x = startX;`


    `var y = startY;`


    `var duration = 0;`


    `var width = height = 50;`


    `function lerp(start, end, speed) {`


        `return start + (end - start) * speed;`


    `}`


    `function logic () {`


        `duration += 0.02;`


        `x = lerp(startX, endX, duration);`


        `if (x < ele.width - width)`


            `requestAnimationFrame(draw);`


    `}`


    `function draw()  {`


        `ctx.clearRect(0, 0, ele.width, ele.height);`


        `// This sets the fill colour to red`


        `ctx.fillStyle = "#ff0000";`


        `// fillRectangle(x, y, width, height);`


        `ctx.fillRect(x, y, 50, 50);`


    `}`


    `requestAnimationFrame(draw);`


    `setInterval(logic, 1000/60);`


    This is not too different from the previous version, except we now have a `lerp()`
    function almost identical to the earlier equation. I have also defined duration,
    `startX`, and `startY` variables to be plugged into the function. The biggest
    change is `logic()`. Rather than adjusting `x` (which causes it to jump), I increased
    duration by a tiny amount, which I then simply plugged into the `lerp()` function
    to get the new value for `x` (which is somewhere on the path to the final x destination).'
  trans: "\n# 什么是 Canvas？\n\n`Canvas` 这个名字起得很贴切，因为它可以比作画家的画布——在开始绘制之前，它是一片空白。`canvas`\
    \ 本身和 `div` 并无区别，都是一个空白的无语义块级元素。然而，不同之处在于 `canvas` 拥有一个可用于通过 JavaScript 绘制的上下文，这个上下文可以通过\
    \ `var ctx = canvas.getContext('2d')` 来获取；其中 `canvas` 是一个包含对 `canvas` 元素引用的变量。你可能已经注意到了，我指定了一个\
    \ 2d 上下文，`getContext` 允许你在多种上下文之间进行选择，目前 2d 上下文是最常见且最成熟的；不过，`WebGL` 和其他技术可以用于\
    \ 3d 上下文。\n\n由于旧版浏览器不支持 `canvas`，可以声明一个后备方案，以便显示其他内容——例如静态图像或 Flash 动画。要添加后备内容，只需在\
    \ `canvas` 标签之间编写 HTML 即可。我建议你避免编写“你的浏览器不支持 Canvas”这样的提示，因为网站体验应该根据设备/浏览器的能力进行调整，而不是批评用户的浏览习惯；不过，为了简化，我在本书的许多练习中会打破这条规则。\n\
    \n```\n<canvas id=\"animation\">\n    <img src=\"images/canvas-fallback.png\"\
    >\n</canvas>\n```\n\n一旦你获得了上下文，就可以开始绘制了。上下文的所有绘制功能都使用笛卡尔坐标系，其中包含 x 轴和 y 轴。需要注意的是——与大多数基于计算机的图形一样——上下文使用右下象限，因此左上角是它的原点\
    \ (0,0)。\n\n```\nvar ctx = canvas.getContext('2d');\n//fillRect(x, y, width, height);\n\
    ctx.fillRect(10, 10, 50, 50);\n```\n\n前面的代码在距左上角 x 轴和 y 轴各 10px 的位置绘制了一个 50px\
    \ × 50px 的正方形。请注意，在 canvas 中，任何四边形都称为矩形。默认情况下，这个矩形是黑色的。由于绘制到上下文的过程是程序化的，因此我们需要在绘制对象之前更改颜色。更改颜色后，所有对象将使用相同的颜色，直到再次更改为止。\n\
    \n```\n// 这将填充颜色设置为红色\nctx.fillStyle = \"#ff0000\";\n// fillRectangle(x, y, width,\
    \ height);\nctx.fillRect(10, 10, 50, 50);\n```\n\n如图 2-1 所示，前面的代码只是绘制了一个红色的相同矩形。\n\
    \n![A978-1-4302-5945-9_2_Fig1_HTML.jpg](img/A978-1-4302-5945-9_2_Fig1_HTML.jpg)\n\
    \n图 2-1. 一个简单的红色矩形\n\n那么现在，既然我们关心的是动画，就让这个方块动起来吧！\n\n## RequestAnimationFrame\n\
    \n如果你曾经需要在 JavaScript 中执行重复性任务（例如轮询），那么你可能对 `setInterval` 和 `setTimeout` 有所了解。这两个函数都不可靠，因为它们可能在超时后的任何时间触发，而不是正好在超时时触发，如果你需要它们立即触发（这对于流畅动画来说非常重要），这就会导致问题。此外，许多浏览器的最小计时器分辨率约为\
    \ 16ms，这可能会造成延迟，尤其是在意料之外的情况下。使用超时的另一个问题是，你需要手动设置超时时间；因此任何测试都将只针对该特定计算机。另一方面，`requestAnimationFrame`\
    \ (rAF) 可以在其运行的计算机的最佳时机触发。它不是固定时间，而是以每秒最多 60 帧的速度运行，但触发频率较低（例如，当浏览器标签页在后台时）。另一个可以使用的优化是第二个参数，它可以是一个\
    \ `DOM` 元素来约束 rAF。\n\n由于在撰写本文时，某些浏览器对 `requestAnimationFrame` 的支持不足，建议使用一个 shim，以便在实现了其某种版本的浏览器中正常工作。我不会在代码示例中包含这一点，但在所有浏览器都正确支持该标准之前，你应该将其视为必需的。\n\
    \n```\n// RequestAnimationFrame 的 Shim\n(function() {\n  var requestAnimationFrame\
    \ = window.requestAnimationFrame || window.mozRequestAnimationFrame ||\n     \
    \                         window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;\n\
    \  window.requestAnimationFrame = requestAnimationFrame;\n})();\n```\n\n我发现分离代码很重要，因此虽然我暂时不会使用任何特定的设计模式（因为代码量还很小），但我鼓励你恰当地组织代码。对于本节，我认为\
    \ `logic()` 和 `draw()` 是合适的函数名称。\n\n```\n// 这是一种选择元素的方式\nvar ele = document.querySelector(\"\
    #animation\");\nvar ctx = ele.getContext('2d');\nvar x = y = 10;\nvar width =\
    \ height = 50;\n\nfunction logic () {\n    x += 10;\n    if (x < ele.width - width)\
    \ requestAnimationFrame(draw);\n}\n\nfunction draw()  {\n    ctx.clearRect(0,\
    \ 0, ele.width, ele.height);\n    // 这将填充颜色设置为红色\n    ctx.fillStyle = \"#ff0000\"\
    ;\n    // fillRectangle(x, y, width, height);\n    ctx.fillRect(x, y, 50, 50);\n\
    }\n\nrequestAnimationFrame(draw);\nsetInterval(logic, 1000/60);\n```\n\n你会注意到我同时使用了\
    \ `requestAnimationFrame` 和 `setInterval`，这是因为你很少希望动画以全速运行（取决于计算机），因此这允许在仍然使用\
    \ `requestAnimationFrame` 来提高渲染性能的同时设置速度。现在，我提到动画不必全速运行，但我还没有向你展示如何轻松更改该速度——为此，我们将使用线性插值。\n\
    \n## 线性插值\n\n线性插值 (lerp) 用于定义特定路径的子坐标。这可以比作进行长途旅行并在途中停下来吃饭。在动画中，它用于平滑路径，因此它不是从一个点跳到另一个点，而是看起来在它们之间滑动（当然，实际上它只是进行了更小的跳跃）。\n\
    \n```\nn = start + (end - start) * speed\n```\n\n上面的代码方程用于计算下一个插值点。这应该被迭代，这样每一帧的起始变量都是前一帧的\
    \ `n`，因为它逐渐向终点移动（现在取决于设置的速度，而不是每秒帧数）。\n\n```\nvar ele = document.querySelector(\"\
    #animation\");\nvar ctx = ele.getContext('2d');\nvar startX = 10;\nvar startY\
    \ = 10;\nvar endX = ele.width - 50;\nvar x = startX;\nvar y = startY;\nvar duration\
    \ = 0;\nvar width = height = 50;\n\nfunction lerp(start, end, speed) {\n    return\
    \ start + (end - start) * speed;\n}\n\nfunction logic () {\n    duration += 0.02;\n\
    \    x = lerp(startX, endX, duration);\n    if (x < ele.width - width)\n     \
    \   requestAnimationFrame(draw);\n}\n\nfunction draw()  {\n    ctx.clearRect(0,\
    \ 0, ele.width, ele.height);\n    // 这将填充颜色设置为红色\n    ctx.fillStyle = \"#ff0000\"\
    ;\n    // fillRectangle(x, y, width, height);\n    ctx.fillRect(x, y, 50, 50);\n\
    }\n\nrequestAnimationFrame(draw);\nsetInterval(logic, 1000/60);\n```\n\n这与之前的版本差别不大，只是我们现在有一个\
    \ `lerp()` 函数，几乎与之前的方程相同。我还定义了 `duration`、`startX` 和 `startY` 变量以便传入函数。最大的变化是\
    \ `logic()`。我没有调整 `x`（这会导致跳跃），而是将 `duration` 增加了一小点，然后我将其简单传入 `lerp()` 函数，以获得\
    \ `x` 的新值（该值位于通往最终 x 目的地的路径上的某处）。\n"
- fmt: "### Follow the Mouse\n\nQuite often, you will need interactive animation rather\
    \ than just a video. A common way to add interactivity within canvas is by using\
    \ the mouse. To start with, I will show you how you can get your little red square\
    \ to follow your movements.\n\nThe mouse is handled by the operating system and\
    \ so triggers an event for all programs to access, which means of course that\
    \ the term “mouse” actually means any device capable of triggering the event.\
    \ For this case, we need to look for the event `'mousemove'`. To do so, we use\
    \ `addEventListener` to add the listener to a specific element.\n\n`element.addEventListener(type,\
    \ listener, useCapture boolean optional);`\n\n`Type` is the name of the event\
    \ (see the list that follows of mouse-specific events). `Listener` can be implemented\
    \ in two ways, either as an object that implements `EventListener` or as a simple\
    \ callback function. The `useCapture` is a Boolean that is true if the event should\
    \ be triggered on the capture stage; otherwise it will be triggered on target\
    \ and bubbling phases. `useCapture` will default to false on modern browsers though\
    \ some older browsers will require it.\n\n- `click`\n- `dblclick`\n- `mousedown`\n\
    - `mouseenter`\n- `mouseleave`\n- `mousemove`\n- `mouseover`\n- `mouseout`\n-\
    \ `mouseup`\n\nTo make the mouse move, you need a callback that sets the new start\
    \ and end points based on the mouse, like so:\n\n```javascript\nele.addEventListener('mousemove',\
    \ function(evt) {\n    startX = x;\n    endX = evt.clientX;\n});\n```\n\nThis\
    \ sets the new path for the square, so now we just need to modify it slightly\
    \ so that it is smooth. I have decided to add constraints to make sure the square\
    \ doesn’t try to go off the canvas or glitch if the mouse sets x to where the\
    \ square is already heading. If it doesn’t match this constraint, then duration\
    \ gets set to 0.\n\n```javascript\nfunction logic (evt) {\n    var max = ele.width\
    \ - width;\n    duration += 0.02;\n    var l = lerp(startX, endX, duration);\n\
    \    if (l < max && l > 0 && endX != x)\n    {\n        x = l;\n        requestAnimationFrame(draw);\n\
    \    }\n    else {\n        duration = 0;\n    }\n}\n```\n\nThis should show you\
    \ just how easily a few tiny changes can completely change the whole animation\
    \ and how the user interacts with it. See Listing 2-1 to see how it all fits together.\n\
    \n**Listing 2-1.**\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n        <title>Chapter\
    \ 2 - Basics of Canvas</title>\n    </head>\n    <body>\n        <canvas id=\"\
    animation\">\n            <p>Fallback not supported.</p>\n        </canvas>\n\
    \        <script src=\"script.js\"></script>\n    </body>\n</html>\n```\n\n```javascript\n\
    // Polyfill for RequestAnimationFrame\n(function() {\n  var requestAnimationFrame\
    \ = window.requestAnimationFrame || window.mozRequestAnimationFrame ||\n     \
    \                         window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;\n\
    \  window.requestAnimationFrame = requestAnimationFrame;\n})();\n\nvar ele = document.querySelector(\"\
    #animation\");\nvar ctx = ele.getContext('2d');\nvar width = height = 50;\nvar\
    \ startX = 10;\nvar startY = 10;\nvar endX;\nvar x = startX;\nvar y = startY;\n\
    var duration = 0;\n\nfunction logic (evt) {\n    var max = ele.width - width;\n\
    \    duration += 0.02;\n    var l = lerp(startX, endX, duration);\n    if (l <\
    \ max && l > 0 && endX != x)\n    {\n        x = l;\n        requestAnimationFrame(draw);\n\
    \    }\n    else {\n        duration = 0;\n    }\n}\n\nfunction draw()  {\n  \
    \  ctx.clearRect(0, 0, ele.width, ele.height);\n    // This sets the fill colour\
    \ to red\n    ctx.fillStyle = \"#ff0000\";\n    // fillRectangle(x, y, width,\
    \ height);\n    ctx.fillRect(x, y, 50, 50);\n}\n\nfunction lerp(start, end, speed)\
    \ {\n    return start + (end - start) * speed;\n}\n\nele.addEventListener('mousemove',\
    \ function(evt) {\n    startX = x;\n    endX = evt.clientX;\n});\n\nrequestAnimationFrame(draw);\n\
    setInterval(logic, 1000/60);\n```\n\n### Bouncing Box\n\nNow that we have looked\
    \ at how to animate in a static way (moving from left to right) as well as using\
    \ an input, I would like to do one more example using the box by adding a dynamic\
    \ element to it. There are so many options for how an animation works. The most\
    \ common is bouncing an object off the boundaries of the canvas. It is not much\
    \ of a step up in difficulty from the previous example but will tie in nicely\
    \ with the next example (which will be a naïve implementation of flocking boids).\n\
    \nInstead of “lerping” between current and desired positions, to bounce a box\
    \ we need to make it go in a specific direction until it hits an edge. This means\
    \ that we need to use basic trigonometry to take an angle (it will begin as a\
    \ random angle under 360 degrees) and to find the position. As you know from lerping,\
    \ it is best to move in lots of small steps rather than a big one, so we can define\
    \ the distance for the trigonometry function to find. To find the x direction,\
    \ we find the cos of the angle (in radians) multiplied by the distance and for\
    \ the y direction we do the same but using the sin of the angle.\n\n```javascript\n\
    function degreesToRadians(degrees) {\n    return degrees * (Math.PI / 180);\n\
    }\n\nfunction dir_x(length, angle) {\n    return length * Math.cos(degreesToRadians(angle));\n\
    }\n\nfunction dir_y(length, angle) {\n    return length * Math.sin(degreesToRadians(angle));\n\
    }\n```\n\nOnce we implement these functions, it is similar to the previous examples.\
    \ We need to initialize variables for both x and y axes for distance and heading\
    \ (direction). Distance should start as 0, and heading needs to be a random angle\
    \ up to 360 degrees. Within logic, it is best to start with a simple check to\
    \ make sure both `heading` variables are between −360 and 360. Then we need to\
    \ check whether the object is within the boundaries, if it isn’t, then bounce\
    \ it back. After that, we simply lerp between current position and the position\
    \ that is found by using the degrees and direction functions above.\n\n```javascript\n\
    var ele = document.querySelector(\"#animation\");\nele.height = window.innerHeight;\n\
    ele.width = window.innerWidth;\nvar ctx = ele.getContext('2d');\nvar x = 10;\n\
    var y = 10;\nvar duration = 0;\nvar width = height = 50;\nvar heading_x = heading_y\
    \ = Math.random() * 360;\nvar distance_x = distance_y = 0;\n\nfunction logic ()\
    \ {\n    if (heading_x > 360 || heading_x < -360) heading_x = 0;\n    if (heading_y\
    \ > 360 || heading_y < -360) heading_y = 0;\n\n    if (x <= 0 || x >=ele.width\
    \ - width) {\n        heading_x = heading_x + 180;\n    }\n    if (y <= 0 || y\
    \ >=ele.height - height) {\n        heading_y = -heading_y;\n    }\n\n    distance_x\
    \ = dir_x(2, heading_x);\n    distance_y = dir_y(2, heading_y);\n\n    if (duration\
    \ < 10) duration += 0.05;\n    x = lerp(x, x + distance_x, duration);\n    y =\
    \ lerp(y, y + distance_y, duration);\n\n    requestAnimationFrame(draw);\n}\n\
    ```\n\nAnd that’s that. You can find the full code listing for all the examples\
    \ in the download that complements this book on the Apress website at [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
    \ or my own website at [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)."
  raw: '### Follow the Mouse


    Quite often, you will need interactive animation rather than just a video. A common
    way to add interactivity within canvas is by using the mouse. To start with, I
    will show you how you can get your little red square to follow your movements.


    The mouse is handled by the operating system and so triggers an event for all
    programs to access, which means of course that the term “mouse” actually means
    any device capable of triggering the event. For this case, we need to look for
    the event `''mousemove''`. To do so, we use `addEventListener` to add the listener
    to a specific element.


    `element.addEventListener(type, listener, useCapture boolean optional);`


    `Type` is the name of the event (see the list that follows of mouse-specific events).
    `Listener` can be implemented in two ways, either as an object that implements
    `EventListener` or as a simple callback function. The `useCapture` is a Boolean
    that is true if the event should be triggered on the capture stage; otherwise
    it will be triggered on target and bubbling phases. `useCapture` will default
    to false on modern browsers though some older browsers will require it.


    `click`


    `dblclick`


    `mousedown`


    `mouseenter`


    `mouseleave`


    `mousemove`


    `mouseover`


    `mouseout`


    `mouseup`


    To make the mouse move, you need a callback that sets the new start and end points
    based on the mouse, like so:


    `ele.addEventListener(''mousemove'', function(evt) {`


        `startX = x;`


        `endX = evt.clientX;`


    `});`


    This sets the new path for the square, so now we just need to modify it slightly
    so that it is smooth. I have decided to add constraints to make sure the square
    doesn’t try to go off the canvas or glitch if the mouse sets x to where the square
    is already heading. If it doesn’t match this constraint, then duration gets set
    to 0.


    `function logic (evt) {`


        `var max = ele.width - width;`


        `duration += 0.02;`


        `var l = lerp(startX, endX, duration);`


        `if (l < max && l > 0 && endX != x)`


        `{`


            `x = l;`


            `requestAnimationFrame(draw);`


        `}`


        `else {`


            `duration = 0;`


        `}`


    `}`


    This should show you just how easily a few tiny changes can completely change
    the whole animation and how the user interacts with it. See Listing 2-1 to see
    how it all fits together.


    Listing 2-1.


    `<!DOCTYPE html>`


    `<html>`


        `<head>`


            `<title>Chapter 2 - Basics of Canvas</title>`


        `</head>`


        `<body>`


            `<canvas id="animation">`


                `<p>Fallback not supported.</p>`


            `</canvas>`


            `<script src="script.js"></script>`


        `</body>`


    `</html>`


    `// Polyfill for RequestAnimationFrame`


    `(function() {`


      `var requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame
    ||`


                                  `window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;`


      `window.requestAnimationFrame = requestAnimationFrame;`


    `})();`


    `var ele = document.querySelector("#animation");`


    `var ctx = ele.getContext(''2d'');`


    `var width = height = 50;`


    `var startX = 10;`


    `var startY = 10;`


    `var endX;`


    `var x = startX;`


    `var y = startY;`


    `var duration = 0;`


    `function logic (evt) {`


        `var max = ele.width - width;`


        `duration += 0.02;`


        `var l = lerp(startX, endX, duration);`


        `if (l < max && l > 0 && endX != x)`


        `{`


            `x = l;`


            `requestAnimationFrame(draw);`


        `}`


        `else {`


            `duration = 0;`


        `}`


    `}`


    `function draw()  {`


        `ctx.clearRect(0, 0, ele.width, ele.height);`


        `// This sets the fill colour to red`


        `ctx.fillStyle = "#ff0000";`


        `// fillRectangle(x, y, width, height);`


        `ctx.fillRect(x, y, 50, 50);`


    `}`


    `function lerp(start, end, speed) {`


        `return start + (end - start) * speed;`


    `}`


    `ele.addEventListener(''mousemove'', function(evt) {`


        `startX = x;`


        `endX = evt.clientX;`


    `});`


    `requestAnimationFrame(draw);`


    `setInterval(logic, 1000/60);`


    ### Bouncing Box


    Now that we have looked at how to animate in a static way (moving from left to
    right) as well as using an input, I would like to do one more example using the
    box by adding a dynamic element to it. There are so many options for how an animation
    works. The most common is bouncing an object off the boundaries of the canvas.
    It is not much of a step up in difficulty from the previous example but will tie
    in nicely with the next example (which will be a naïve implementation of flocking
    boids).


    Instead of “lerping” between current and desired positions, to bounce a box we
    need to make it go in a specific direction until it hits an edge. This means that
    we need to use basic trigonometry to take an angle (it will begin as a random
    angle under 360 degrees) and to find the position. As you know from lerping, it
    is best to move in lots of small steps rather than a big one, so we can define
    the distance for the trigonometry function to find. To find the x direction, we
    find the cos of the angle (in radians) multiplied by the distance and for the
    y direction we do the same but using the sin of the angle.


    `function degreesToRadians(degrees) {`


        `return degrees * (Math.PI / 180);`


    `}`


    `function dir_x(length, angle) {`


        `return length * Math.cos(degreesToRadians(angle));`


    `}`


    `function dir_y(length, angle) {`


        `return length * Math.sin(degreesToRadians(angle));`


    `}`


    Once we implement these functions, it is similar to the previous examples. We
    need to initialize variables for both x and y axes for distance and heading (direction).
    Distance should start as 0, and heading needs to be a random angle up to 360 degrees.
    Within logic, it is best to start with a simple check to make sure both `heading`
    variables are between −360 and 360\. Then we need to check whether the object
    is within the boundaries, if it isn’t, then bounce it back. After that, we simply
    lerp between current position and the position that is found by using the degrees
    and direction functions above.


    `var ele = document.querySelector("#animation");`


    `ele.height = window.innerHeight;`


    `ele.width = window.innerWidth;`


    `var ctx = ele.getContext(''2d'');`


    `var x = 10;`


    `var y = 10;`


    `var duration = 0;`


    `var width = height = 50;`


    `var heading_x = heading_y = Math.random() * 360;`


    `var distance_x = distance_y = 0;`


    `function logic () {`


        `if (heading_x > 360 || heading_x < -360) heading_x = 0;`


        `if (heading_y > 360 || heading_y < -360) heading_y = 0;`


        `if (x <= 0 || x >=ele.width - width) {`


            `heading_x = heading_x + 180;`


        `}`


        `if (y <= 0 || y >=ele.height - height) {`


            `heading_y = -heading_y;`


        `}`


        `distance_x = dir_x(2, heading_x);`


        `distance_y = dir_y(2, heading_y);`


        `if (duration < 10) duration += 0.05;`


        `x = lerp(x, x + distance_x, duration);`


        `y = lerp(y, y + distance_y, duration);`


        `requestAnimationFrame(draw);`


    `}`


    And that’s that. You can find the full code listing for all the examples in the
    download that complements this book on the Apress website at [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)
    or my own website at [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)
    .'
  trans: "\n### 跟随鼠标\n\n很多时候，你需要的是交互式动画，而不仅仅是视频。在 Canvas 中添加交互性的一种常见方式是使用鼠标。首先，我将向你展示如何让你的红色小方块跟随鼠标移动。\n\
    \n鼠标由操作系统处理，因此会触发一个所有程序都能访问的事件，这当然意味着“鼠标”这个术语实际上指的是任何能够触发该事件的设备。对于这种情况，我们需要监听\
    \ `'mousemove'` 事件。为此，我们使用 `addEventListener` 将监听器添加到特定元素。\n\n`element.addEventListener(type,\
    \ listener, useCapture boolean optional);`\n\n`Type` 是事件的名称（请参阅下面跟随的鼠标特定事件列表）。`Listener`\
    \ 可以通过两种方式实现：作为实现 `EventListener` 接口的对象，或者作为简单的回调函数。`useCapture` 是一个布尔值，如果事件应在捕获阶段触发，则为\
    \ `true`；否则，它将在目标和冒泡阶段触发。在现代浏览器上，`useCapture` 默认为 `false`，但一些较旧的浏览器可能需要它。\n\n\
    -   `click`\n-   `dblclick`\n-   `mousedown`\n-   `mouseenter`\n-   `mouseleave`\n\
    -   `mousemove`\n-   `mouseover`\n-   `mouseout`\n-   `mouseup`\n\n要使方块跟随鼠标移动，你需要一个回调函数，根据鼠标位置设置新的起点和终点，如下所示：\n\
    \n```javascript\nele.addEventListener('mousemove', function(evt) {\n    startX\
    \ = x;\n    endX = evt.clientX;\n});\n```\n\n这为方块设置了新的路径，所以现在我们只需要稍作修改使其平滑。我决定添加一些约束，以确保如果鼠标将\
    \ x 设置为方块已经前往的位置时，方块不会试图移出 Canvas 或出现闪烁。如果不符合此约束，则持续时间被设置为 0。\n\n```javascript\n\
    function logic (evt) {\n    var max = ele.width - width;\n    duration += 0.02;\n\
    \    var l = lerp(startX, endX, duration);\n    if (l < max && l > 0 && endX !=\
    \ x)\n    {\n        x = l;\n        requestAnimationFrame(draw);\n    }\n   \
    \ else {\n        duration = 0;\n    }\n}\n```\n\n这应该可以向你展示，仅仅一些微小的改变就能完全改变整个动画以及用户与之交互的方式。请参阅清单\
    \ 2-1，了解所有部分如何整合在一起。\n\n**清单 2-1.**\n\n```html\n<!DOCTYPE html>\n<html>\n    <head>\n\
    \        <title>Chapter 2 - Basics of Canvas</title>\n    </head>\n    <body>\n\
    \        <canvas id=\"animation\">\n            <p>Fallback not supported.</p>\n\
    \        </canvas>\n        <script src=\"script.js\"></script>\n    </body>\n\
    </html>\n```\n\n```javascript\n// Polyfill for RequestAnimationFrame\n(function()\
    \ {\n  var requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame\
    \ ||\n                              window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;\n\
    \  window.requestAnimationFrame = requestAnimationFrame;\n})();\n\nvar ele = document.querySelector(\"\
    #animation\");\nvar ctx = ele.getContext('2d');\nvar width = height = 50;\nvar\
    \ startX = 10;\nvar startY = 10;\nvar endX;\nvar x = startX;\nvar y = startY;\n\
    var duration = 0;\n\nfunction logic (evt) {\n    var max = ele.width - width;\n\
    \    duration += 0.02;\n    var l = lerp(startX, endX, duration);\n    if (l <\
    \ max && l > 0 && endX != x)\n    {\n        x = l;\n        requestAnimationFrame(draw);\n\
    \    }\n    else {\n        duration = 0;\n    }\n}\n\nfunction draw()  {\n  \
    \  ctx.clearRect(0, 0, ele.width, ele.height);\n    // This sets the fill colour\
    \ to red\n    ctx.fillStyle = \"#ff0000\";\n    // fillRectangle(x, y, width,\
    \ height);\n    ctx.fillRect(x, y, 50, 50);\n}\n\nfunction lerp(start, end, speed)\
    \ {\n    return start + (end - start) * speed;\n}\n\nele.addEventListener('mousemove',\
    \ function(evt) {\n    startX = x;\n    endX = evt.clientX;\n});\n\nrequestAnimationFrame(draw);\n\
    setInterval(logic, 1000/60);\n```\n\n### 弹跳方块\n\n既然我们已经了解了如何进行静态动画（从左向右移动）以及如何使用输入进行动画，我想再做一个使用方块的示例，为其添加一个动态元素。动画的工作方式有很多种选择。最常见的是让物体在\
    \ Canvas 的边界上弹跳。这个示例的难度相比上一个并没有提升太多，但它将很好地衔接下一个示例（这将是一个简单的群体模拟实现）。\n\n为了弹跳方块，我们不是在当前和期望位置之间进行“lerp”（线性插值），而是需要让它沿特定方向移动，直到碰到边缘。这意味着我们需要使用基础三角学，根据一个角度（起始为\
    \ 360 度内的随机角度）来找到位置。正如你从 lerp 中了解到的，最好采用许多小步骤而不是一个大步骤来移动，所以我们可以让三角函数计算一个距离。为了找到\
    \ x 方向，我们计算角度（弧度制）的余弦值乘以距离，对于 y 方向，我们做同样的操作，但是使用角度的正弦值。\n\n```javascript\nfunction\
    \ degreesToRadians(degrees) {\n    return degrees * (Math.PI / 180);\n}\n\nfunction\
    \ dir_x(length, angle) {\n    return length * Math.cos(degreesToRadians(angle));\n\
    }\n\nfunction dir_y(length, angle) {\n    return length * Math.sin(degreesToRadians(angle));\n\
    }\n```\n\n一旦我们实现了这些函数，剩下的就与之前的示例类似了。我们需要为 x 和 y 轴初始化距离和方向变量。距离应从 0 开始，方向需要是 0\
    \ 到 360 度之间的随机角度。在逻辑函数中，最好从一个简单的检查开始，确保两个 `heading` 变量都在 -360 到 360 之间。然后我们需要检查物体是否在边界内，如果不在，则将其反弹回来。之后，我们只需在当前坐标和通过上述角度与方向函数计算出的坐标之间进行\
    \ lerp 插值。\n\n```javascript\nvar ele = document.querySelector(\"#animation\");\n\
    ele.height = window.innerHeight;\nele.width = window.innerWidth;\nvar ctx = ele.getContext('2d');\n\
    var x = 10;\nvar y = 10;\nvar duration = 0;\nvar width = height = 50;\nvar heading_x\
    \ = heading_y = Math.random() * 360;\nvar distance_x = distance_y = 0;\n\nfunction\
    \ logic () {\n    if (heading_x > 360 || heading_x < -360) heading_x = 0;\n  \
    \  if (heading_y > 360 || heading_y < -360) heading_y = 0;\n\n    if (x <= 0 ||\
    \ x >=ele.width - width) {\n        heading_x = heading_x + 180;\n    }\n    if\
    \ (y <= 0 || y >=ele.height - height) {\n        heading_y = -heading_y;\n   \
    \ }\n\n    distance_x = dir_x(2, heading_x);\n    distance_y = dir_y(2, heading_y);\n\
    \n    if (duration < 10) duration += 0.05;\n    x = lerp(x, x + distance_x, duration);\n\
    \    y = lerp(y, y + distance_y, duration);\n\n    requestAnimationFrame(draw);\n\
    }\n```\n\n就是这样。你可以在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
    \ 或我的个人网站 [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)\
    \ 上提供的本书配套下载资源中找到所有示例的完整代码清单。\n"
- fmt: '## “Clever” Animation


    Next we are going to create a “clever” animation — that is to say, extending on
    the previous concept of dynamic animation found in the bouncing box example by
    making objects aware of their surroundings. In 1986, Craig Reynolds created an
    incredible simulation of birds flocking that he called Boids. It was built on
    just three rules that allowed each boid to be responsible for its own movement,
    but also allowed it to see local neighbors and move toward them. The best explanation
    for each rule I have found was this:


    *   Separation: Steer to avoid crowding local flockmates

    *   Alignment: Steer toward the average heading of local flockmates

    *   Cohesion: Steer to move toward the average position (center of mass) of local
    flockmates


    Our animation is based on Boids, though some of it will be simplified for brevity
    (I encourage you to modify my code to improve it — to do so you will probably
    want to use vectors). We will start with our usual set up code, `getContext`.
    etc., as well as creating an object for Boid that holds the data about location,
    direction, and size of the boid. Once that is done we create a function called
    `setup()`, which adds each boid (depending how many we set) onto the canvas at
    a random position with a random direction. I have made a simple function to wrap
    the JavaScript `Math.random`, just to make the code a bit neater.


    ```

    (function()  {

    var canvas = document.querySelector("#flocking");

    var ctx = canvas.getContext(''2d'');

    canvas.height = window.innerHeight;

    canvas.width = window.innerWidth;

    var flock = [];

    var flockRadius = 250;

    var neighborRadius = 10;

    var Boid = function(x, y, heading, size) {

    this.x = x;

    this.y = y;

    this.heading = heading

    this.size = size;

    };

    function setup()  {

    for (var i = 0; i < 50; i++)

    {

    flock.push(new Boid(rand(canvas.width), rand(canvas.height), rand(360), 15));

    }

    setInterval(logic, 1000/60);

    }

    function logic () {

    for (var i = 0; i < flock.length; i++)  {

    // Do something with each boid

    }

    requestAnimationFrame(draw);

    }

    function draw()  {

    // Drawing goes here

    }

    function rand(max)  {

    return Math.random() * max;

    }

    setup();

    })();

    ```


    You may notice that for direction instead of “up” or “right” we use degrees, 0
    to 360\. This makes the animation much more fluid and also allows us to use radian
    math later. We use a variable `flockRadius` to control the distance at which boids
    can see each other (used for heading the same way, etc.). Now let’s add some code
    to the drawing method. For this we are going to need to start by clearing the
    canvas each frame (if you don’t do this, you will just draw over the previous
    frame). Once the canvas is cleared, it is time to draw the boids! So we need to
    iterate over the flock array, while storing the current boid in a variable called
    `b`, drawing each one to the canvas (that is, the context of the canvas) at the
    correct position. To find the position, we take `b.x` and `b.y` but we need to
    add half of its size onto it, because the position is the center of the boid rather
    than the top left of it.


    ```

    function draw()  {

    ctx.clearRect(0,0,canvas.width, canvas.height);

    for (var i = 0; i < flock.length; i++)

    {

    var b = flock[i];

    ctx.fillStyle = "blue";

    ctx.fillRect(b.x,b.y, b.size, b.size);

    ctx.beginPath();

    ctx.moveTo(b.x + (b.size / 2),b.y + (b.size / 2));

    ctx.lineTo((b.x + (b.size / 2)) + dir_x(20,flock[i].heading),(b.y + (b.size /
    2)) + dir_y(20,flock[i].heading));

    ctx.strokeStyle = "red"

    ctx.stroke();

    }

    }

    ```


    In `lineTo` I have used a couple of functions used to get the position when given
    a distance and direction. In this case I have used the functions to draw a line
    pointing 20px in the direction each boid is heading. Here you can see the helper
    functions. They use basic trigonometry and Pythagoras, so they should be fairly
    easy to follow.


    ```

    function distanceBetween(a, b)  {

    var dx = a.x - b.x;

    var dy = a.y - b.y;

    return Math.sqrt(dx * dx + dy * dy);

    }


    function angleBetween(x1, y1, x2, y2)

    {

    ```'
