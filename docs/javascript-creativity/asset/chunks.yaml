    \ is just a matter of implementing the steps from the previous chapter. We start\
    \ by capturing two frames of the webcam and analyzing it to find motion between\
    \ the two frames. Remember, we are not using any artificial intelligence to do\
    \ this so you may need to fiddle with the numbers to make it accurate for your\
    \ lighting conditions and distance from the screen (as well as movement behind\
    \ you).\n\nTo find the motion, we iterate through the pixels of the second frame\
    \ comparing them to the previous frame. If they are different, then change the\
    \ color to black otherwise make it white. For this example we only need motion\
    \ on the X axis so, every time motion is detected, we add the percentage of the\
    \ width that corresponds to the X position of the movement. For example, `motionX\
    \ += 100*(x/w);`. Once everything has been checked, we can divide it by the count\
    \ to find the average X position. Due to simple math this is not completely accurate,\
    \ but it is enough to find an indication of motion. Depending on the orientation\
    \ of the canvas, you may need to invert the numbers to mirror motion correctly:\
    \ `motionX = 100 - motionX;`.\n\nNow, we can check to see whether `motionX` is\
    \ within the bounds of the particular motion we are looking for. In this we want\
    \ to move a cursor left and right, pressing the key if there is motion in the\
    \ middle third. So if `motionX` is less than `100/3`, then move left. If it is\
    \ between `100/3` and `(100/3)*2`, then press the key or if it is above `(100/3)*2`,\
    \ then move right.\n\nThis example only works for the white keys, but you could\
    \ quite easily extend it to include black keys by finding motion on the Y-axis\
    \ as well.\n\n```javascript\nfunction motionDetection(data, oldData)  {\n  var\
    \ motionX = 0;\n  var count = 0;\n\n  // Iterate through each pixel, changing\
    \ to 255 if it has not changed\n  for( var y = 0 ; y < h; y++ ) {\n    for( var\
    \ x = 0 ; x < w; x++ ) {\n      var indexOld = (y * w + x) * 4,\n          oldr\
    \ = oldData[indexOld],\n          oldg = oldData[indexOld+1],\n          oldb\
    \ = oldData[indexOld+2],\n          olda = oldData[indexOld+3];\n\n      var indexNew\
    \ = (y * w + x) * 4,\n          r = data[indexNew],\n          g = data[indexNew+1],\n\
    \          b = data[indexNew+2],\n          a = data[indexNew+3];\n\n      if\
    \ (oldr > r - 30 || oldg > g - 30 || oldb > b - 30) {\n        data[indexNew]\
    \ = 255;\n        data[indexNew+1] = 255;\n        data[indexNew+2] = 255;\n \
    \       data[indexNew+3] = 255;\n      } else {\n        data[indexNew] = 0;\n\
    \        data[indexNew+1] = 0;\n        data[indexNew+2] = 0;\n        data[indexNew+3]\
    \ = 255;\n        motionX += 100*(x/w); // motionX = The percentage of W than\
    \ X is at\n        count++;\n      }\n    }\n  }\n\n  motionX = motionX / count;\n\
    \  motionX = 100 - motionX;\n\n  if (motionX > 0)  {\n    if (motionX > 100/3\
    \ && motionX < (100/3)*2)  {\n      if (o[i] === null)\n        playSound(currentCursor,\
    \ false);\n      console.log('2');\n    }\n\n    if (motionX > (100/3)*2)  {\n\
    \      if (currentCursor + 1 < keys.length)  {\n        cursor[currentCursor].hide();\n\
    \        stopSound(currentCursor, false);\n        currentCursor++;\n        cursor[currentCursor].show();\n\
    \      }\n      console.log('3');\n    }\n\n    if (motionX < 100/3) {\n     \
    \ if (currentCursor - 1 >=0)  {\n        cursor[currentCursor].hide();\n     \
    \   stopSound(currentCursor, false);\n        currentCursor--;\n        cursor[currentCursor].show();\n\
    \      }\n      console.log('1');\n    }\n  }\n\n  return data;\n}\n```\n\nThe\
    \ cursor is a round red dot that is created at the same time as the keys; instead\
    \ of moving a cursor along the keys it hides and only shows the correct one.\n\
    \n```javascript\ncursor[i] = keyboard.circle(width/21);\ncursor[i].attr({ fill:\
    \ '#ff0000' });\ncursor[i].move(width/21 * i, height / 1.5);\ncursor[i].hide();\n\
    ```\n\nNow, the project should all be working. You can find the complete code\
    \ below in Listing 11-1 and in the download that is available on the Apress website\
    \ at [www.apress.com/9781430259442](http://www.apress.com/9781430259442) or on\
    \ my own website at [www.shanehudson.net/javascript-creativity](http://www.shanehudson.net/javascript-creativity).\n\
    \n```javascript\n// Listing 11-1. server.js\n\nvar express = require('express'),\n\
    \    http = require('http'),\n    uuid = require (\"node-uuid\"),\n    app = express(),\n\
    \    server = http.createServer(app),\n```"
