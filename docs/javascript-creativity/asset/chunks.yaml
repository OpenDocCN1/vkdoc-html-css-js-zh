- fmt: "代码的下一部分使用一个比例来缩放和平移画布。严格来说，这并不是必需的，但我决定保留它，因为这是一种有趣的优化方法。基本上，我们不会绘制整个画布的坐标，而是将坐标绘制在\
    \ `-1` 到 `1` 之间，从而提升性能，因为转换画布比逐个绘制整个画布更简单、更快捷。`lastPointVisible` 布尔值是另一个微小的优化，它仅用于渲染前景，这样背景中不可见的部分就不会被渲染。接下来，我们需要使用\
    \ `requestAnimationFrame`，原因与之前相同：保持动画流畅，并且只在需要时进行处理（这显然是非常耗费资源的代码）。`RAF` 调用一个\
    \ `draw` 函数来绘制每一帧。顺便说一句，你是否已经看到了其中的模式？每个项目都可以简化为几个模式，这就是为什么我使用一些你可能永远不需要构建的示例——这些概念本身就很有用！\n\
    \n在 `draw` 函数内部，我们获取频率数据。现在我们面临一个小困境……如何使用这些数据？在这个例子中，我决定只使用平均频率来移动可视化中的线条，但还有很多其他方式可以尝试。一个好主意可能是计算每分钟的节拍（BPM），或者使用独立的线条来表示不同的频率范围。\n\
    \n完整的代码列表一如既往地可以在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
    \ 和我自己的网站 [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)\
    \ 上找到。\n\n## 总结\n\n那是一个特别长的项目，所以我确保只解释那些不太明显的概念或代码；希望你没有在这个过程中迷失方向。当然，音乐播放器的范围非常广泛，本章只是触及了你能实现的功能的皮毛，因此我选择了那些能让你在其他项目中学习到最多技能的功能。我强烈鼓励你探索项目的其他方向，例如添加插件系统或将音乐可视化器转换为3D（目前它给人以3D的效果，但仅以2D显示）。我略过了可视化中的大量数学内容，因为我旨在探索使用JavaScript可以创作的创意内容，而不是教授数学。但我强烈推荐阅读\
    \ Steven Wittens 关于其 js1k 演示制作的文章，网址为 [`http://acko.net/blog/js1k-demo-the-making-of`](http://acko.net/blog/js1k-demo-the-making-of)。\n\
    \n# 7. 使用 Node.js 实现实时协作\n\n到目前为止，在本书中，我们编写的所有代码都是客户端的。虽然如今的客户端 JavaScript 非常强大，但通常还需要一个服务器，以便数据可以存储在线、将敏感逻辑保留在客户端之外，或者让用户能够在线互动。你可能熟悉其他服务器端语言，如\
    \ PHP 或 Ruby（甚至可能是 Perl！），但 Node.js 的优势之一是你使用 JavaScript 编写服务器端代码，因此由于你拥有客户端 JS\
    \ 的经验，应该很容易上手。\n\n## 制作聊天室\n\n在本章中，我们使用 Node.js 和 Socket.IO 来创建一个实时的聊天室 Web 应用，允许多个用户互相交谈。我指导你在本地机器上设置\
    \ Node.js，因为最常用的服务器（共享主机）通常不支持 Node.js。但请注意，像 Heroku 和 Amazon Web Services 这样的服务提供免费套餐。\n\
    \n### 安装 Node.js\n\n显然，要使用 Node.js 编写任何代码，你需要先安装它。安装方法有很多。你可以使用包管理器，如 `apt-get`、`yum`\
    \ 或 `Homebrew`（取决于你使用的操作系统），但这些包管理器并不总是最新的。在 Node.js 网站 [`www.nodejs.org`](http://www.nodejs.org/)\
    \ 上，你可以下载最新版本的可执行二进制文件或从源代码构建。或者，你也可以使用来自 [`www.github.com/creationix/nvm`](http://www.github.com/creationix/nvm)\
    \ 的 Node 版本管理器（`nvm`）。如果你正在处理许多并非都使用最新版本的代码库，这尤其有用。Node 自带一个名为 `npm` 的内置包管理器，它使用名为\
    \ `package.json` 的文件来处理依赖关系。因此，你无需自己安装 `Express` 和 `Socket.IO`，只需将它们写入该文件即可。当你准备安装这些包时，在包含\
    \ `package.json` 的文件夹中运行 `npm install`。\n\n```\n{\n    \"name\": \"javascript-creativity-chatroom\"\
    ,\n    \"description\": \"A chatroom made in chapter 7 of the JavaScript Creativity\
    \ book.\",\n    \"version\": \"0.0.1\",\n    \"private\": true,\n    \"dependencies\"\
    : {\n        \"express\": \"3.x\",\n        \"socket.io\": \"0.9.x\"\n    }\n\
    }\n```\n\n与传统的 JavaScript 不同，Node.js 有一个模块系统，允许你在运行时加载 JavaScript 文件。每个模块都在一个文件中定义，通过\
    \ `module.exports` 对象导出变量和函数。在另一个文件中，你可以使用 `require` 函数来加载该模块并获取其 `module.exports`\
    \ 的内容。加载模块有三种不同的方式。\n\n*   `require()` 一个相对文件，例如 `require('./lib/utils.js')`。这会加载单个文件并返回该文件中\
    \ `module.exports` 的值。如果你的项目很大且包含多个文件，你会经常使用这种方法。\n*   `require()` 一个核心模块，这些模块是一些特殊的关键词。例如，使用\
    \ `require('http')` 来加载核心的 `http` 模块。Node.js 预装了一系列标准核心模块，但它们默认不包含在内，这意味着当你需要它们时必须显式地引入。你可以在\
    \ Node.js 文档（[`www.nodejs.org/api/index.html`](http://nodejs.org/api/index.html)）中查看核心模块的完整列表。\n\
    *   `require()` 一个来自 `node_modules` 文件夹的独立模块，例如 `require('express')`。这是模块系统最强大的功能。你可以通过引用模块名称来加载整个独立的模块。其工作原理是，Node.js\
    \ 对 `node_modules` 文件夹有特殊认知。它会从当前脚本所在的目录向上遍历目录树，查找 `node_modules/<name>/package.json`\
    \ 或 `node_modules/<name>/index.js`。它会首先查看 `package.json`，检查它是否有一个 `\"main\"` 属性，该属性引用了一个名称与\
    \ `index.js` 不同的 `.js` 文件来加载。假设你有一个文件 `/www/myapp/index.js`，其中包含 `require('express')`。Node.js\
    \ 会在以下目录中查找该模块：\n    *   `/www/myapp/node_modules/express/`（`package.json` 或 `index.js`）\n\
    \    *   `/www/node_modules/express/`（`package.json` 或 `index.js`）\n    *   `/node_modules/express/`（`package.json`\
    \ 或 `index.js`）\n    *   `$NODE_PATH/express/`（`package.json` 或 `index.js`）\n\
    \    *   `$HOME/.node_modules/express/`（`package.json` 或 `index.js`）\n    *  \
    \ `$HOME/.node_libraries/express/`（`package.json` 或 `index.js`）\n    *   `$PREFIX/lib/node/express/`（`package.json`\
    \ 或 `index.js`）\n    *   这是 Node.js 查找的文件夹的详尽列表。强烈建议你将模块放在本地的 `node_modules` 文件夹中，以确保速度和可靠性。其他文件夹主要用于\
    \ `node_modules` 文件夹内的 Node.js 模块需要它们自己的模块时，这样你就可以在项目和你自己的模块之间共享模块。"
  raw: "The next portion of the code uses a ratio to scale and translate the canvas.\
    \ Strictly speaking, this isn’t needed. But I have decided to keep it because\
    \ it is an interesting approach to optimization. Basically instead of plotting\
    \ the coordinates of the entire canvas, we will be plotting them between −1 and\
    \ 1, so that the performance is improved, as transforming the canvas is easier\
    \ and quicker than individually plotting the entire thing. The `lastPointVisible`\
    \ boolean is another slight optimization that is used to only render the foreground\
    \ so that nothing in the background that cannot be seen is rendered anyway. From\
    \ here we need to use `requestAnimationFrame` for the same reasons as before,\
    \ to keep it smooth and to only process (this is of course very intensive code)\
    \ when needed. The `RAF` calls a `draw` function that draws each frame. As an\
    \ aside, are you seeing the patterns yet? Every project can be reduced to just\
    \ a few patterns, which is why I use examples that you will probably never need\
    \ to build—the concepts will be useful regardless!\n\nWithin the `draw` function\
    \ we grab the frequency data. Now we have a bit of a dilemma… how to use the data?\
    \ For this example I have decided to just use the average frequency to move the\
    \ lines in the visualization, but there are many options for playing around with\
    \ this. One good idea might be to work out the beats per minute or to have separate\
    \ lines representing ranges of frequencies.\n\nThe full code listing is, as always,\
    \ available on both the Apress website at [www.​apress.​com/​9781430259442](http://www.apress.com/9781430259442)\
    \ and on my own website at [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)\
    \ .\n\n## Summary\n\nThat was a particularly long project so I made sure to only\
    \ explain the concepts or code that were not already pretty obvious; hopefully\
    \ you did not get lost along the way. Of course, a music player has such wide\
    \ scope that this chapter barely scrapes the edges of what you can do so I chose\
    \ the features that would teach you the most skills for using in other projects.\
    \ I strongly encourage you to explore other avenues of the project, such as adding\
    \ a plugin system or converting the music visualizer into 3D (currently it gives\
    \ the effect of 3D but is only shown in 2D). I glossed over a lot of the math\
    \ for the visualization because I am trying to explore creative things we can\
    \ make with JavaScript rather than teaching math, but I strongly recommend reading\
    \ Steven Wittens’ article on the making of his js1k demo at [http://​acko.​net/​blog/​js1k-demo-the-making-of](http://acko.net/blog/js1k-demo-the-making-of).\n\
    \n# 7. Real-time Collaboration with Node.js\n\nThroughout the book so far, all\
    \ the code we have written has been client side, but although client side JavaScript\
    \ is very powerful nowadays it is often necessary to have a server so that data\
    \ can be stored online, to keep sensitive logic out of the client, or so that\
    \ users can interact with each other online. You may be familiar with other server\
    \ side languages such as PHP or Ruby (possibly even Perl!), but one of the advantages\
    \ of Node.js is that you write server side code in JavaScript so it should be\
    \ easy to pick up because you have client side JS experience.\n\n## Making a Chatroom\n\
    \nIn this chapter we use Node.js with Socket.IO to create a real time chatroom\
    \ web app that allows multiple users to talk to each other. I guide you through\
    \ setting up Node.js on your local machine because most commonly used servers\
    \ (shared hosting) do not support Node.js, but do be aware that some services\
    \ such as Heroku and Amazon Web Services do have free tiers.\n\n### Installing\
    \ Node.js\n\nObviously to write anything using Node.js, you need to have it installed.\
    \ There are many ways to install it. You can use a package manager such as apt-get,\
    \ yum, or Homebrew (depending on which operating system you are using) but these\
    \ are not always up to date. On the Node.js website, [`www.nodejs.org`](http://www.nodejs.org/)\
    \ , you can download the latest version executable binaries or build it from source\
    \ code. Alternatively, you can use the Node Version Manager (`nvm`) from [`www.github.com/creationix/nvm`](http://www.github.com/creationix/nvm)\
    \ , which is particularly useful if you are working with many codebases that are\
    \ not all using the latest version. Node comes with a built-in package manager\
    \ called `npm`, which handles dependencies using a file called `package.json`,\
    \ so rather than installing Express and Socket.IO yourself, you just put it in\
    \ the file. When you are ready to install the packages, run `npm install` within\
    \ the folder that has `package.json`.\n\n`{`\n\n`\"name\": \"javascript-creativity-chatroom\"\
    ,`\n\n`\"description\": \"A chatroom made in chapter 7 of the JavaScript Creativity\
    \ book.\",`\n\n`\"version\": \"0.0.1\",`\n\n`\"private\": true,`\n\n`\"dependencies\"\
    : {`\n\n`\"express\": \"3.x\",`\n\n`\"socket.io\" : \"0.9.x\"`\n\n`}`\n\n`}`\n\
    \nUnlike traditional JavaScript, Node.js has a module system that allows you to\
    \ load JavaScript files at runtime. Each module is defined in a file, exporting\
    \ variables and functions through a `module.exports` object. In another file,\
    \ you can use the `'require'` function to load the module and get to its `module.exports`\
    \ contents. There are three different ways to load a module.\n\n*   `require()`\
    \ a relative file, for example `require('./lib/utils.js')`. This requires the\
    \ single file and returns the value of `'module.exports` `'` in that file. You’ll\
    \ use this method quite a lot if you have large, multi-file projects.\n*   `require()`\
    \ a core module, which are special keywords, for example `require('http') to load\
    \ the core http module`. Node.js comes installed with a host of standard core\
    \ modules, but they are not included by default, meaning you have to require them\
    \ when you want them. You can see the full list of core modules in the Node.js\
    \ documentation ( [`www.nodejs.org/api/index.html`](http://www.http//nodejs.org/api/index.html)\
    \ ).\n*   `require()` a distinct module from a `node_modules` folder, for example\
    \ `require('express')`. This is the most powerful feature of the module system.\
    \ You can require entire separate modules by referencing the module name. The\
    \ way this works is that Node.js has special knowledge of the `node_modules` folder.\
    \ It walks up the directory tree from the current script, looking for `node_modules/<name>/package.json`\
    \ or `node_modules/<name>/index.js`. It looks at the package.json first, is to\
    \ see whether it has a “main” property, which references a .js file to load that\
    \ is named differently to index.js. Let’s say you have a file `/www/myapp/index.js`,\
    \ in this file you have `require('express')`. Node.js looks for the module in\
    \ the following directories:\n    *   `/www/myapp/node_modules/express/`(package.json\
    \ or index.js)\n    *   `/www/node_modules/express/`(package.json or index.js)\n\
    \    *   `/node_modules/express/`(package.json or index.js)\n    *   `$NODE_PATH/express/`(package.json\
    \ or index.js)\n    *   `$HOME/.node_modules/express/`(package.json or index.js)\n\
    \    *   `$HOME/.node_libraries/express/`(package.json or index.js)\n    *   `$PREFIX/lib/node/express/`(package.json\
    \ or index.js)\n    *   This is an exhaustive list of the folders Node.js looks\
    \ in; it is highly recommended that you ensure your modules are placed in the\
    \ local node_modules folder, for speed and reliability. The other folders are\
    \ mostly useful for when Node.js modules inside a node_modules folder require\
    \ their own modules, so you can share modules between your project and your modules."
