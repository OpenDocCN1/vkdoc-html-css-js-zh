  raw: 'Now that we have worked out the position of each pixel we need to work out
    the weighted average, which we can do by adding all the neighboring (both directional
    and diagonal) colors then subtracting 8 times the current color since there are
    8 neighbors. Once that is done, we set all colors in the pixel (including alpha)
    to 255 or 0 depending on which side of the threshold they are. The threshold I
    set earlier to 100 but you are welcome to fiddle around with the numbers to find
    the best result. After this we just put the output (the ImageData) onto the context
    of the canvas.


