    \n```\nvar light = new THREE.AmbientLight();\nvar intensity = 0.025;\nscene.add(light);\n\
    light.color.setRGB(20 * intensity, 0 * intensity, 255 * intensity);\n```\n\n很多时候，你会想确切地了解灯光在做什么、它们的位置以及光线投射的方向。有很多方法可以实现这一点——你可以使用控制台查看每个灯光的属性，但我建议采用更图形化的方式。对于许多灯光，Three.js\
    \ 提供了辅助对象，可以用线条显示方向。如果你有一个`DirectionalLight`，那么可以使用`DirectionalLightHelper`，它会以虚线形式显示其指向的方向。你可以通过更改材质来改变线条的类型，例如颜色或虚线样式。大多数灯光也都有辅助工具，例如`SpotLightHelper`可用于显示光线的角度。\n\
