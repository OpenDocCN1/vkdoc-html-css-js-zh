  trans: '

    #### 材质


    你已经见过了几种被使用和提及的材质，例如`Phong`、`Lambert`和`Basic`——但它们到底是什么呢？每种材质都指定了所使用的着色类型。这是基于真实世界中的材质及其差异而来的，例如，一个塑料瓶和一个闪亮的罐子在相同的光照下，由于反射、透明度等因素，会呈现出不同的外观。我们无法完全模拟真实世界中的精确条件，但可以通过修改某些属性以及使用不同的着色器来非常接近。在撰写本书时，Three.js
    为我们提供了表 4-4 中所示的内置材质。


    表 4-4. 展示了 Three.js 中可用的内置材质。


    | `LineBasicMaterial` | `LineBasicMaterial` 用于创建直线，默认颜色为白色，宽度为 1 像素。 |

    | --- | --- |

    | `LineDashedMaterial` | 此材质与 `LineBasicMaterial` 类似，但用于创建虚线，在调试时非常有用（但不限于此），因为你知道它并不打算成为场景的一部分。
    |

    | `MeshBasicMaterial` | 根据 `wireframe` 属性（默认为 `false`），此材质用于绘制平面或线框面，并且不受光照影响。通常在其他材质之上使用它来绘制线框，因为它的开销最小。它也常用于应用纹理（图像）。
    |

    | `MeshDepthMaterial` | 此材质用于显示深度，通常在后处理中使用。 |

    | `MeshFaceMaterial` | 很多时候一个形状的每一面都需要不同的材质，`MeshFaceMaterial` 实际上就是一个材质数组。 |

    | `MeshNormalMaterial` | 这是一种非常有用的材质，尤其适用于原型设计，因为它能确保每个面都有独特的颜色，并且不需要光照。 |

    | `ParticleBasicMaterial` | 这是粒子系统使用的材质。颜色默认为白色。 |

    | `ShaderMaterial` | 如果你想编写自己的着色器（本书不会涉及），那么可以使用这种材质。它提供了 GLSL 的属性，例如 `fragmentShader`、`vertexShader`
    和 `uniforms`。 |


    表 4-4 中缺少了两种材质：`MeshLambertMaterial` 和 `MeshPhongMaterial`。我会将这两种材质与列表分开处理，因为它们有些相似，并且涉及大量的渲染技术（远非一个列表所能涵盖）。我们之前已经将
    `Lambert` 用作通用的 3D 材质，但我没有解释它是什么。根据当前的 Three.js 文档，对这两种材质区别的简单解释是：


    - **Lambert**：用于非光泽（朗伯）表面的材质，逐顶点计算。

    - **Phong**：用于光泽表面的材质，逐像素计算。


    这通常足以让你决定在每种情况下使用哪一种，但我认为更全面的理解很重要，因此我将简要解释它们的技术差异，并鼓励你进行更深入的研究。


    在计算机图形学中，有两种模型（可以结合使用）来决定对象的着色方式：光照模型和着色模型。光照模型使用环境光、漫反射和镜面高光来显示从表面反射（或折射）的光线。着色的数学计算很复杂，因为它无法简化为简单的组件，基本上，它使用平面着色或插值着色来为面着色（即计算亮度）。`MeshLambertMaterial`
    使用 Gouraud 着色和朗伯光照模型，默认情况下在每个顶点处进行光照计算，然后在面片上进行插值。`MeshPhongMaterial` 使用 Phong
    着色和 Phong 光照模型，默认情况下，顶点法线在表面进行插值，并且在每个像素（更准确地说，是纹素）处进行光照计算。


    **注意：** Three.js 并未完全按照算法标准实现，因此如果你对这些数学模型特别感兴趣，请将这一点考虑在内。


    ### 数据可视化


    关于文档的介绍就到这里，让我们继续前进，制作一些有用的东西。数据可视化的类型有很多，从基本的条形图和饼图，到详细的地球仪，甚至太阳系模型。所有这些都有其用途，通常用作向公众展示数据的方式，也可用于数据分析。这是一个广阔的学科领域，因此我们仅会触及你可以可视化的内容以及如何实现它的皮毛。


    我们可以在任何地方开始，比如用基本 3D 图形显示政府的财务数据，但这很快就会变得枯燥，所以让我们制作一个 3D 节点图，展示曾经合作过的男女演员（灵感来源于“凯文·贝肯六度分隔”理论）。在这个例子中，我们的节点是演员/女演员，连线是电影。我提供了一些示例数据（JSON
    格式），以免你需要注册 API。这也意味着我可以对数据进行更有选择性的筛选，因为大部分数据并非必需。'
- fmt: "### 3D Node Graph\n\nRather than jumping straight into using the data, it\
    \ is best to instead just start with the graph. In this section all the nodes\
    \ and edges will be random and it is entirely possible for two nodes to have multiple\
    \ edges of the same edges. At this moment we needn't worry about that (it becomes\
    \ much easier to handle once we have the real data).\n\nWe start with the basic\
    \ setup that all scenes have, this time using both directional and ambient lights\
    \ so that each node (which we will represent using random-colored spheres) has\
    \ a nice effect.\n\n```\nvar width  = window.innerWidth,\n    height = window.innerHeight;\n\
    var container = document.querySelector('#container');\nvar renderer = new THREE.WebGLRenderer();\n\
    renderer.setSize(width, height);\ncontainer.appendChild(renderer.domElement);\n\
    var VIEW_ANGLE = 45,\n    NEAR = 0.1,\n    FAR = 10000;\nvar camera =  new THREE.PerspectiveCamera(45,\
    \ width / height, 1, 1000);\ncamera.position.z = 600;\nvar ambient = new THREE.AmbientLight(\
    \ 0x050505, 2 );\ndirectionalLight = new THREE.DirectionalLight( 0xffffff, 1 );\n\
    directionalLight.position.set( 2, 1.2, 10 ).normalize();\nvar scene = new THREE.Scene();\n\
    scene.add(ambient);\nscene.add(directionalLight);\nscene.add(camera);\n// The\
    \ rest of the code for this section will go here.\nfunction logic()  {\n    requestAnimationFrame(render);\n\
    }\nfunction render() {\n    renderer.render(scene, camera);\n}\nsetInterval(logic,\
    \ 1000/60);\n```\n\nYou know how to make spheres and I am sure it would take you\
    \ all of two seconds to work out how to position them randomly. However, what\
    \ we need to do is randomly position spheres and we also need to randomly link\
    \ them together with lines for edges. To do this, we have a `Node` object that\
    \ stores the name and position and then generates the random edges. Because we\
    \ are not currently using the data, the name defaults to \"Random Node\" and there\
    \ is a `getEdges()` function that is accessed by the property `edges` that returns\
    \ two random nodes to which to connect edges. To generate the random edges in\
    \ `getEdges` we just need to multiply `Math.random()` by the amount of nodes,\
    \ then round down (floor) because the indexes start from 0 not 1.\n\n```\nvar\
    \ amount_nodes = 20;\nvar Node = function() {\n    name = \"Random Node\",\n \
    \   position = new THREE.Vector3();\n    function getEdges() {\n        return\
    \ [Math.floor(Math.random()*amount_nodes), Math.floor(Math.random()*amount_nodes)\
    \ ];\n    }\n    return {\n        name: name,\n        edges: getEdges()\n  \
    \  }\n}\n```\n\nTo draw the graph we need three functions, one that draws a node\
    \ and one that draws all of the edges of a node, we also need a function to draw\
    \ the graph using the previous two functions. Let's start with `drawNode(n)`,\
    \ we take the node as a parameter so we have easy access to the node object we\
    \ just made. Within the function we create a sphere using the same technique taught\
    \ earlier, with a Lambert material of a random color. The random color is surprisingly\
    \ easy to do, since hex (such as `0xffffff`) is treated the same as any other\
    \ number (it is after all just a representation of a number to a different base),\
    \ we can do math on it, in this cause multiplying it by a random number. To find\
    \ the position we choose a random number that is within the boundaries of an area\
    \ that we specify, the area is then subtracted from this number to keep the graph\
    \ in the center.\n\n```\nfunction drawNode(n)  {\n    var radius = 10,\n     \
    \   segments = 50,\n        rings = 50;\n    var node = new THREE.Mesh(\n    \
    \    var material = new THREE.MeshLambertMaterial( {  color: Math.random() * 0xffffff\
    \ } );\n        var draw_object = new THREE.Mesh(\n            new THREE.SphereGeometry(\n\
    \                radius,\n                segments,\n                rings),\n\
    \            material);\n        );\n    var area = 300;\n    node.position.x\
    \ = Math.floor(Math.random() * (area * 2 + 1) - area);\n    node.position.y =\
    \ Math.floor(Math.random() * (area * 2 + 1) - area);\n    node.position.z = Math.floor(Math.random()\
    \ * (area * 2 + 1) - area);\n    n.position = node.position;\n    scene.add(node);\n\
    }\n```\n\nNow we have the nodes drawn to the scene and it is time to connect them\
    \ with the edges. Because these edges are random, as I said earlier, it is likely\
    \ that some will double up causing thicker lines. This will not happen once we\
    \ have added the data because we can use it to check whether a line has already\
    \ been made. As you know from ambient lights, to have opacity you need to set\
    \ `transparent` to `true`, so I have done this in `LineBasicMaterial` because\
    \ the edges would be overwhelming if they were 100% white and opaque. To work\
    \ out where the lines should go, we need to loop through the `node.edges` (which\
    \ we randomly generate when a new node is created) and create a geometry that\
    \ has a vertex at the current node's position and at the other node's (`nodes[node.edges[i]]`)\
    \ position. Once that is created, we simply make a new line using the geometry\
    \ and then add it to the scene.\n\n```\nfunction drawEdges(node)  {\n    var line_material\
    \ = new THREE.LineBasicMaterial( { color: 0xffffff, transparent: true, opacity:\
    \ 0.1, linewidth:0.5 } );\n    for (var i = 0; i < node.edges.length; i++)  {\n\
    \        var tmp_geo = new THREE.Geometry();\n        tmp_geo.vertices.push(node.position);\n\
    \        tmp_geo.vertices.push(nodes[node.edges[i]].position);\n        var line\
    \ = new THREE.Line( tmp_geo, line_material );\n        scene.add(line);\n    }\n\
    }\n```\n\nLastly, to finish this part of the project we just need to draw the\
    \ graph using the two functions we just wrote. You may have noticed we were using\
    \ an array called `nodes`, the nodes are created within `drawGraph()`. The first\
    \ part of the function loops through the amount of nodes (`amount_nodes`) and\
    \ creates a new `Node` object within the array, which it then draws using `drawNode()`.\
    \ The edges have to be drawn afterward in a separate loop since `drawEdges()`\
    \ uses the array of nodes to see which edges connect.\n\n```\nvar nodes = [];\n\
    drawGraph();\nfunction drawGraph()  {\n    // Draw nodes\n    for (var i = 0;\
    \ i < amount_nodes; i++)  {\n        nodes[i] = new Node();\n        drawNode(nodes[i]);\n\
    \    }\n    // Draw edges, has to be done once we have the nodes in place\n  \
    \  for (var i = 0; i < amount_nodes; i++)  {\n        drawEdges(nodes[i]);\n \
    \   }\n}\n```\n\nIf you now put it all together, it should show a nice 3D node\
    \ graph of random colors that does not represent anything (see Figure [4-3](#A978-1-4302-5945-9_4_Chapter.html#Fig3)).\
    \ This is a good starting point for a variety of visualizations and it should\
    \ make you feel comfortable using the tools (namely Three.js) to produce more\
    \ than just a simple shape.\n\n![A978-1-4302-5945-9_4_Fig3_HTML.jpg](A978-1-4302-5945-9_4_Fig3_HTML.jpg)\n\
    \n**Figure 4-3.** Node graph\n\nI encourage you to fiddle with the code to make\
    \ it your own. Here are a few ideas for how you can extend the graph:\n\n*   Use\
    \ an API to visualize live data (Twitter, Government open data, etc.).\n*   Change\
    \ size and/or color of the nodes based on the data.\n*   Add text overlays for\
    \ hovering or clicking on the nodes and/or edges.\n*   Work on the navigation.\
    \ It is hard to navigate a graph that has thousands of nodes. What works best—arrow\
    \ keys? Mouse? Click to move? This is a good way to explore scale.\n\nThere are\
    \ a lot of ways you could use the camera (some of which were explained earlier\
    \ in the chapter) to navigate the graph. For now I have just been using the simple\
    \ camera rotation technique, which is included in the code."
