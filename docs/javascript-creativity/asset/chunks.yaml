    Now when you drag an image onto the canvas you should get a rough outline. One
    of your challenges, if you are willing to take it, is to improve the quality of
    the outline. As I mentioned earlier, your best bet is probably by implementing
    Canny but there are also some easier changes that can be made to improve it. Please
    do tweet or email me any attempts at improving the algorithm!


    ### Making the Paintbrush


    Our next task is to make a paintbrush—a round circular brush, not a modern Photoshop-style
    brush that includes all the bristles.


    As with before, we need to decide which events need to be triggered. I think we
    should use `mousedown` to trigger drawing, `mouseup` to stop drawing, and `mousemove`
    to draw while the mouse is down, We can check this using a Boolean called `''drawing''`.
    In `mousedown` we need to call a function, I have called it `startPath`, to begin
    the path; this needs to be done separately to the rest of the path so that it
    does not keep trying to start a new path every time the mouse moves. In `startPath`
    we need to begin the path, using `ctx.beginPath()`, then move the brush to the
    current position of the mouse. In canvas, and indeed most other computer graphics
    libraries, `moveTo` is used to move the brush without drawing and `lineTo` is
    used to draw from the current position to the new position. I have also used `startPath`
    to set the size and the color of the brush.


    `drop.addEventListener(''mousedown'', startPath);`


    `drop.addEventListener(''mouseup'', function() {`


    `drawing = false;`


    `});`


    `drop.addEventListener(''mousemove'', handleDrawing);`


    `function startPath(e)  {`


    `ctx.strokeStyle = "#0000ff";`


    `ctx.lineWidth   = lineWidth;`


    `ctx.beginPath();`


    `ctx.moveTo(e.clientX + lineWidth, e.clientY + lineWidth);`


    `drawing = true;`


    `}`


    As you can see from the code, `mousemove` triggers a function called `handleDrawing`.
    This uses `lineTo` that I mentioned earlier to draw the path, as well calls `stroke`
    to make it the size and color specified in `startPath`.


    `function handleDrawing(e)  {`


    `if (drawing == true)`


    `{`


    `ctx.lineTo(e.clientX + lineWidth, e.clientY + lineWidth);`


    `ctx.stroke();`


    `}`


    `}`


    Our last task is to make this image downloadable. To do this we go back to using
    `toDataURL` in the href of a link. To make the link downloadable we can use the
    download attribute, a new feature that is available in some modern browsers. On
    other browsers, the user would have to right-click and manually save the image.
    You can add that to the alt text to make it easy to use if you want to.


    `var save = document.querySelector("#save");`


    `save.addEventListener(''click'', saveCanvas);`


    `function saveCanvas()  {`


    `var img = drop.toDataURL("image/png");`


    `save.href = img;`


    `save.download = "colouringBook.png";`


    `}`


