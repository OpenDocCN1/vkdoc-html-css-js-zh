  trans: '

    ### 第 4 章


    *   [`mrdoob.github.io/three.js/`](http://www.mrdoob.github.com/three.js%20-%20Three.js)—`Three.js`是一个广泛使用的`WebGL`封装库，用于在网页上实现
    3D 效果。

    *   [`typeface.neocracy.org`](http://www.typeface.neocracy.org/)—在这里你可以找到`Three.js`作为默认字体使用的
    Helvetiker 字体。


    ### 第 5 章


    *   [`www.svgjs.com`](http://www.svgjs.com/)—这是一个轻量级的 SVG 库，我们在第 5 章中使用它来处理音乐播放器中的时间轴创建。

    *   [`github.com/mattdiamond/Recorderjs`](http://www.github.com/mattdiamond/Recorderjs%20-%20Matt%20Diamond''s%20Recorder.js)—Matt
    Diamond 的`Recorder.js`是一个脚本，它使用 Web Workers 来实现对 Web Audio API 节点的录制。


    ### 第 6 章


    *   [`www.acko.net`](http://www.acko.net/)—Steven Wittens 的网站本身就是一件杰作，里面充满了关于网络数学和图形的精彩文章。

    *   `www.acko.net/blog/js1k-demo-the-making-of`—Steven 的这篇特定文章被用作第 6 章的基础，我强烈推荐你阅读它。


    ### 第 7 章


    *   [`www.nodejs.org`](http://www.nodejs.org/)—这是`Node.js`的官方网站，书中所有服务器端代码都使用该语言。

    *   [`www.github.com/creationix/nvm`](http://www.github.com/creationix/nvm)—推荐使用
    Node 版本管理器（`NVM`）来处理`Node.js`的多个版本。

    *   [`www.nodejs.org/api/index.html`](http://www.http//nodejs.org/api/index.html)—这是`Node.js`的文档，也可以从`Node.js`主站首页找到。


    ### 第 8 章


    *   [`www.ietf.org/rfc/rfc5245.txt`](http://www.ietf.org/rfc/rfc5245.txt)—RFC
    5245 详细介绍了交互式连接建立（`ICE`）。虽然阅读量很大，但在处理`WebRTC`时非常有用。


    ### 第 9 章


    *   [`www.github.com/mtschirs/js-objectdetect`](http://www.github.com/mtschirs/js-objectdetect)—这个由
    Martin Tschirsich 编写的库是基于 Viola-Jones 算法的 JavaScript 实现。它使得进行对象检测变得容易，而无需深究实现细节。


