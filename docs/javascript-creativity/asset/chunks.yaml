  raw: '# 10. Interacting with the Browser Using Gestures


    This chapter aims to take everything you’ve learned so far and put it all together
    to make an ambitious music creation web app that allows multiple people to play
    instruments, using computer-generated audio, at the same time using just JavaScript,
    Node.js, and some HTML5 APIs. Oh, and it also needs to use the webcam to allow
    input using your fingers in the air.


    As I’m sure you can imagine this is a massive task. This chapter gets you to a
    basic version of it and allows you to extend the task however you please. For
    example, instead of tracking all fingers so that you can play the keyboard properly,
    it will instead have a cursor that you can move left or right by pointing in that
    direction, or pointing in the middle to simulate a key press.


    ## Taking the Keyboard Server-Side


    We base this project on the keyboard from [Chapter 5](#A978-1-4302-5945-9_5_Chapter.html).
    Currently, the keyboard is set up so that you can play multiple notes at once
    (which is a good start) but we need to modify it so that multiple people can play
    multiple notes. Of course, even if two people are playing the same note, it should
    only be played once. This is ideal as it means we only need one set of oscillators
    per person, so when person B starts playing a note it will play using the set
    of oscillators that person A is using.


    Previously we turned off the oscillator within `stopSound` but this can cause
    issues with race conditions (that is, things done always happen in the order you
    expect) and since you cannot play a stopped oscillator, it is better to delete
    it (in this case, we will set it to null) and create a new one (which we were
    doing anyway). To make it easier to check existence of an oscillator, I’ve changed
    the array initialization loops to set the indexes to null instead of creating
    new oscillators to begin with.


    `// White Keys`


    `var o = new Array(21);`


    `for (var i = 0; i < 21; i++)  {`


    `o[i] = null;`


    `}`


    `// Black Keys`


    `var ob = new Array(15);`


    `for (var i = 0; i < 15; i++)  {`


    `ob[i] = null;`


    `}`


    `function stopSound(i, black)  {`


    `var osc;`


    `if (black) {`


    `osc = ob[i];`


    `} else {`


    `osc = o[i];`


    `}`


    `if ((black && ob[i] !== null) || (!black && o[i] !== null)) {`


    `osc.noteOff(0);`


    `osc.disconnect();`


    `if (black) {`


    `ob[i] = null;`


    `} else {`


    `o[i] = null;`


    `}`


    `}`


    `}`


    The `playSound` function now needs to only play a new sound if there is no oscillator
    already on the key; otherwise it will cause problems such as not being able to
    stop it playing or it will only play for a short amount of time. I’ve also cleaned
    it up a little so that the same conditions are not checked twice without needing
    to be. Note that I’ve changed `ctx` to `actx`, this is so that it is obviously
    an Audio Context and to avoid confusion with the Canvas Context used for the computer
    vision.


    `var gainNode = actx.createGainNode();`


    `gainNode.connect(actx.destination);`


    `function playSound(i, black) {`


    `if ((black && ob[i] === null) || (!black && o[i] === null)) {`


    `var osc = actx.createOscillator();`


    `var freq;`


    `if (black)  {`


    `freq = blackNotes[i];`


    `}`


    `else  {`


    `freq = whiteNotes[i];`


    `}`


    `osc.type = 3;`


    `osc.frequency.value = freq;`


    `osc.connect(gainNode);`


    `osc.noteOn(0);`


    `if (black) {`


    `ob[i] = osc;`


    `} else {`


    `o[i] = osc;`


    `}`


    `}`


    `}`


    So now the keyboard is set up a little better and we can write the server code.
    Socket.IO allows you to define the structure of all communication between the
    client and server in a very nice way; each message is a task that is usually passed
    on to the other clients. The keyboard has two tasks: play sounds and stop playing
    sounds. All we need is a couple of listeners for messages that play or stop sounds.


    `socket.on(''play_sound'', function (data) {`


    `data.color = socket.color;`


    `console.log("play sound %j", data);`


    `socket.broadcast.to(room).emit(''play_sound'', data);`


    `});`


    `socket.on(''stop_sound'', function (data) {`


    `console.log("stop sound %j", data);`


    `socket.broadcast.to(room).emit(''stop_sound'', data);`


    `});`


    You may have noticed that we send a color to everyone in the room; this is so
    that they can easily see keys that other people have pressed. I’ve not created
    them uniquely, using a database or anything, but when the socket originally connects
    it creates a random color. I’ve done this by creating a random number and multiplying
    it by 16777215, this is essentially the same as doing a bitwise shift on the hex
    color for white (#ffffff).


    `socket.color = ''#''+ (''000000'' + Math.floor(Math.random()*16777215).toString(16)).slice(-6);`


    And that’s it! The rest of the server-side code is the same as we had in [Chapter
    7](#A978-1-4302-5945-9_7_Chapter.html).


    server.js


    `var express = require(''express''),`


    `http = require(''http''),`


    `uuid = require ("node-uuid"),`


    `app = express(),`


    `server = http.createServer(app),`'
  trans: "\n# 10. 使用手势与浏览器交互\n\n本章旨在将你目前学到的所有知识融会贯通，构建一个雄心勃勃的音乐创作 Web 应用，它允许多人使用计算机生成的音频，通过\
    \ JavaScript、Node.js 和一些 HTML5 API 同时演奏乐器。哦，对了，它还需要利用网络摄像头，让你能通过手指在空中进行输入。\n\n\
    我相信你也能想象，这是一项艰巨的任务。本章将带你实现其基础版本，并允许你按照自己的意愿进行扩展。例如，与其追踪所有手指以便正确弹奏键盘，不如改为使用一个光标，你可以通过指向左侧或右侧来移动它，或者指向中间来模拟按键。\n\
    \n## 将键盘移至服务器端\n\n我们将基于第 5 章的键盘来构建这个项目。目前，键盘的设置允许你同时演奏多个音符（这是一个好的开端），但我们需要修改它，以使多人能够同时演奏多个音符。当然，即使两个人演奏同一个音符，也应该只播放一次。这非常理想，因为这意味着我们每个人只需要一组振荡器，所以当\
    \ B 开始演奏某个音符时，它将使用 A 正在使用的同一组振荡器来播放。\n\n之前我们在 `stopSound` 函数中关闭了振荡器，但这可能会导致竞态条件问题（即，操作不一定会按照你期望的顺序发生），而且由于无法播放已停止的振荡器，更好的做法是删除它（在本例中，我们会将其设为\
    \ null）并创建一个新的（反正我们之前也是这么做的）。为了更容易检查振荡器是否存在，我修改了数组初始化循环，将索引初始值设为 null，而不是一开始就创建新的振荡器。\n\
    \n```\n// 白键\nvar o = new Array(21);\nfor (var i = 0; i < 21; i++)  {\n    o[i]\
    \ = null;\n}\n\n// 黑键\nvar ob = new Array(15);\nfor (var i = 0; i < 15; i++) \
    \ {\n    ob[i] = null;\n}\n\nfunction stopSound(i, black)  {\n    var osc;\n \
    \   if (black) {\n        osc = ob[i];\n    } else {\n        osc = o[i];\n  \
    \  }\n    if ((black && ob[i] !== null) || (!black && o[i] !== null)) {\n    \
    \    osc.noteOff(0);\n        osc.disconnect();\n        if (black) {\n      \
    \      ob[i] = null;\n        } else {\n            o[i] = null;\n        }\n\
    \    }\n}\n```\n\n现在，`playSound` 函数需要在对应键上没有正在使用的振荡器时才播放新声音；否则会导致问题，比如无法停止播放，或者声音只会播放很短的时间。我还对它进行了一些清理，避免在不需要的情况下重复检查相同的条件。注意，我将\
    \ `ctx` 改为了 `actx`，这样做是为了明确它是一个音频上下文（Audio Context），并避免与用于计算机视觉的画布上下文（Canvas Context）混淆。\n\
    \n```\nvar gainNode = actx.createGainNode();\ngainNode.connect(actx.destination);\n\
    \nfunction playSound(i, black) {\n    if ((black && ob[i] === null) || (!black\
    \ && o[i] === null)) {\n        var osc = actx.createOscillator();\n        var\
    \ freq;\n        if (black)  {\n            freq = blackNotes[i];\n        }\n\
    \        else  {\n            freq = whiteNotes[i];\n        }\n        osc.type\
    \ = 3;\n        osc.frequency.value = freq;\n        osc.connect(gainNode);\n\
    \        osc.noteOn(0);\n        if (black) {\n            ob[i] = osc;\n    \
    \    } else {\n            o[i] = osc;\n        }\n    }\n}\n```\n\n现在键盘的设置好了一些，我们可以编写服务器代码了。Socket.IO\
    \ 允许你以一种非常优雅的方式定义客户端和服务器之间所有通信的结构；每条消息都是一个任务，通常会被传递给其他客户端。键盘有两个任务：播放声音和停止播放声音。我们只需要一些监听器来处理播放或停止声音的消息即可。\n\
    \n```\nsocket.on('play_sound', function (data) {\n    data.color = socket.color;\n\
    \    console.log(\"play sound %j\", data);\n    socket.broadcast.to(room).emit('play_sound',\
    \ data);\n});\n\nsocket.on('stop_sound', function (data) {\n    console.log(\"\
    stop sound %j\", data);\n    socket.broadcast.to(room).emit('stop_sound', data);\n\
    });\n```\n\n你可能注意到了，我们会向房间内的每个人发送一个颜色值；这样他们就能轻松看到其他人按下了哪些键。我没有使用数据库或其他方式为它们创建唯一标识，而是在\
    \ socket 初始连接时创建一个随机颜色。我通过生成一个随机数并乘以 16777215 来实现这一点，这本质上等同于对白色（`#ffffff`）的十六进制颜色进行位运算左移。\n\
    \n```\nsocket.color = '#'+ ('000000' + Math.floor(Math.random()*16777215).toString(16)).slice(-6);\n\
    ```\n\n就是这样！其余的服务器端代码与我们在第 7 章中的代码相同。\n\n`server.js`\n\n```\nvar express = require('express'),\n\
    \    http = require('http'),\n    uuid = require (\"node-uuid\"),\n    app = express(),\n\
    \    server = http.createServer(app),\n```\n"
- fmt: "```javascript\nio = require('socket.io').listen(server);\n```\n\n```javascript\n\
    io.set('log level', 1); // Removes debug logs\n```\n\n```javascript\napp.use(express.static('public'));\n\
    ```\n\n```javascript\nserver.listen(8080);\n```\n\n```javascript\napp.get('/:id',\
