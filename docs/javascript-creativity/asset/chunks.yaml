    # 3. Audio and Video Basics


    If we are talking about interactivity, we are going to want to use audio and video.
    For years we had to use "hacks" such as Flash or Silverlight to add these crucial
    elements to the web, but we now have audio and video built directly into HTML.
    In this chapter we go through the ins and outs of both elements (that is, `<audio>`
    and `<video>`) so that you can use them without hesitation. I also introduce you
    to some new techniques such as manipulation, and we will touch on optimization
    techniques too. In later chapters we will be exploring the depths of audio creation
    and we will be creating a media player in the process. This chapter gives you
    the grounding you need to do that.


    ## Containers and Codecs


    When it comes to using audio and video, we will be dealing with a variety of browser
    implementations and support. Each format tends to have a set of advantages and
    disadvantages, some are well optimized and some are freely licensed. For this
    reason, it''s good to understand a little about a few containers and codecs, their
    limitations, and whether they are licensed, before we go on to the details of
    how to implement.


    ### Containers


    A container is a file format that is used as a wrapper format for a range of codecs.
    You could think of containers as files that hold audio that has already been encoded
    with a codec, as well as data on which codec was used. Many codecs are supported
    by multiple containers.


    #### WebM


    `WebM` is an audio-video container sponsored by Google. It is royalty free, and
    comprises VP8 video and Vorbis audio streams in a container based on Matroska.
    It''s released under a BSD license and all users are granted a worldwide, non-exclusive,
    no-charge, royalty-free patent license.


    #### MP4


    The Moving Picture Experts Group (MPEG) has standardized many containers and codecs.
    They are probably most well-known for the MP3 audio codec, but MP4 is one of the
    most commonly used video formats. MP4 usually uses H.264 as the video codec and
    AAC or MP3 as the audio codec. The MP4 format is patent-encumbered, which has
    caused discussions between browsers about the suitability of non-royalty-free
    formats on the web.


    #### QuickTime File Format


    Safari uses QuickTime for playing formats that are not natively supported in the
    browser, such as QuickTime File Format (known as Mov). `MP4` was based on the
    Mov specification and so supports the same codecs as `MP4` but has less support,
    as `MP4` is standardized and Mov is not.


    #### AVI


    Microsoft released Audio Video Interleaved (AVI) in 1992; it is one of the oldest
    container formats that is still widely used (alongside Mov). Because AVI is so
    old, it has a lot of disadvantages to the more modern containers such as `MP4`
    and `Ogg`. Some disadvantages include a lack of meta-data and compression. Due
    to these disadvantages, AVI is not used natively on the web but can be used with
    Flash video players.


    #### ASF


    Advanced Systems Format (ASF) is a container that was created by Microsoft especially
    for streaming media. ASF usually contains either Windows Media Video (WMV) or
    Windows Media Audio (WMA). The specification is freely (as in beer) available
    but is patented-encumbered.


    #### Ogg


    `Ogg` is an open source container format maintained by the Xiph.Org Foundation
    and released under the BSD license. The format is praised highly due to how open
    it is, but at the time of writing Internet Explorer, Safari, and many mobile browsers
    do not support it. That said, it is generally recommended to use `Ogg` alongside
    other formats. `Ogg` supports many codecs but is usually used with Vorbis for
    audio and Theora for video.


    #### Matroska


    Another fully open container format is Matroska. It is a universal format in that
    it attempts to support all codecs (where possible). WebM is a subset of Matroska.
    This is so media players (including browsers) can say they support WebM without
    having full support for every codec that Matroska supports.


    #### WAV


    Waveform Audio File Format (known by its file extension WAV) is a container developed
    by Microsoft and IBM. It is patent-free and is lossless. Commonly, WAV is used
    as an uncompressed format but it can be used with Lossless Pulse-code modulation
    (LPCM) for compression.'
