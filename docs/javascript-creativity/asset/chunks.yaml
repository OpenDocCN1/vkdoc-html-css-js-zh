- fmt: "# Timeline\n\nNow that we have the keyboard working and have everything set\
    \ up for recording the audio, let’s create the interface. To avoid over complicating\
    \ the project we will keep it simple and just have the keyboard with a timeline\
    \ on which to put the music clippings, as well as buttons for recording and playing\
    \ and stopping the timeline. When the page is loaded, the clips in the `localStorage`\
    \ need to be represented as rectangles with a width proportional to the duration\
    \ of the clip.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Music Theory</title>\n\
    <style>\n* { margin: 0; }\nbody { background-color: #747e88; }\na { color: #d4dfcf;\
    \ cursor: pointer;}\na:hover, a:focus  { color: #E4eee3; }\n.controls a { display:\
    \ inline-block; padding: 10px; }\n.recording { background-color: #d68189; }\n\
    #tracks  { height: 300px; width: 100%; }\n#keyboard  { height: 300px; position:\
    \ relative; width: 100%; }\n</style>\n</head>\n<body>\n<div class=\"controls\"\
    >\n<a id=\"record\">Record</a>\n<a id=\"play\">Play</a>\n<a id=\"stop\">Stop</a>\n\
    </div>\n<div id=\"tracks\"></div>\n<div id=\"keyboard\"></div>\n<script src=\"\
    ../svg.js\"></script>\n<script src=\"../svg.draggable.js\"></script>\n<script\
    \ src=\"../recorder.js\"></script>\n<script src=\"../recorderWorker.js\"></script>\n\
    <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\nStarting with the\
    \ buttons across the top of the page, each button needs an event listener for\
    \ click events that have callbacks to do their specified task. The play and stop\
    \ buttons just need to simply toggle a `play` variable that we will use to check\
    \ whether the timeline bar for current time should be moving. The record button\
    \ needs to toggle recording, this includes using the recorder to record the gain\
    \ node, as well as toggling the recording class on the button and setting up the\
    \ `recordStart` and `recordEnd` variables that are used to work out the duration.\
    \ To get the name of the music clip we use a prompt. This could be done within\
    \ the interface, but I used a prompt just for simplicity.\n\n```javascript\nvar\
    \ toggleRecord = false;\nvar recordStart;\nvar recordEnd;\nvar recorder;\n\ndocument.querySelector(\"\
    #record\").addEventListener('click', function() {\n  if (!toggleRecord) {\n  \
    \  recorder = new Recorder(gainNode, { workerPath: \"../recorderWorker.js\"});\n\
    \    recorder.record();\n    recordStart = Date.now();\n    document.querySelector(\"\
    #record\").className = \"recording\";\n    toggleRecord = !toggleRecord;\n  }\n\
    \  else {\n    recordEnd = Date.now();\n    document.querySelector(\"#record\"\
    ).className = \"\";\n    toggleRecord = !toggleRecord;\n    recordSound(prompt(\"\
    Name of sound clipping:\"));\n  }\n});\n\ndocument.querySelector(\"#play\").addEventListener('click',\
    \ function() {\n  play = true;\n});\n\ndocument.querySelector(\"#stop\").addEventListener('click',\
    \ function() {\n  play = false;\n});\n```\n\nWith the buttons ready, let’s start\
    \ making the actual timeline. As with the keyboard, this uses SVG. An empty timeline\
    \ simply has lines representing each track, so we need a variable for the amount\
    \ of tracks (this makes it easy to change the amount needed) and to draw the lines\
    \ we draw the amount of tracks + 1 so that it has a bottom border. The `trackPos`\
    \ variable is used to know the height of each individual track, as well as to\
    \ position each track in the correct place.\n\n```javascript\nvar timelineWidth\
    \ = document.querySelector(\"#tracks\").clientWidth;\nvar timelineHeight = document.querySelector(\"\
    #tracks\").clientHeight;\nvar tracks = SVG('tracks');\nvar play = false;\nvar\
    \ numOfTracks = 5;\nvar track = [];\nvar trackPos = timelineHeight / numOfTracks;\n\
    var clippings = [];\n\ndrawTimeline();\n\nfunction drawTimeline() {\n  tracks.clear();\n\
    \  for (var i = 0; i <= numOfTracks; i++) {\n    track[i] = tracks.line(0, timelineHeight\
    \ / numOfTracks, timelineWidth, trackPos);\n    track[i].move(0, trackPos * i);\n\
    \    track[i].attr({ stroke: '#DAC8B0', id: \"track\" + i });\n  }\n  // Clippings\
    \ go here\n}\n```\n\nThe music clippings are rectangles on the same SVG as the\
    \ timeline, because they are part of it, that represent the music based on the\
    \ duration of the clip. Each rectangle needs to be draggable so that they can\
    \ be moved around the tracks. We could use event listeners like we did in [Chapter\
    \ 2](#A978-1-4302-5945-9_2_Chapter.html), but since we are using SVG.js we can\
    \ just use the plugin for it that is found at [`https://github.com/wout/svg.draggable.js`](https://github.com/wout/svg.draggable.js).\
    \ To make the rectangles draggable we just need to include the script, then call\
    \ `.draggable()` on the rectangle. Because the rectangle is within the timeline\
    \ SVG, making it draggable means it can drag within that SVG not over the other\
    \ components of the app. That said, it can still be dragged outside the SVG but\
    \ cannot be seen, so we need to stop it from going out of the bounds. We also\
    \ need to snap the rectangles between the tracks, to do this we need to check\
    \ that the rectangle is within the boundary of each track and if it isn’t, then\
    \ to take the ceiling of the position so that it snaps to one of the tracks. Each\
    \ rectangle also requires some text (that is moved with it) labeling the rectangle\
    \ to the name of the music. In Figure [5-3](#A978-1-4302-5945-9_5_Chapter.html#Fig3)\
    \ you can see how it looks when a few audio clippings have been recorded and placed\
    \ in the timeline.\n\n![A978-1-4302-5945-9_5_Fig3_HTML.jpg](A978-1-4302-5945-9_5_Fig3_HTML.jpg)\n\
    \n**Figure 5-3.** The finished project, showing the timeline with some pre-recorded\
    \ music in separate tracks\n\nIn Listing 5-2, you can see the final modifications\
    \ that are needed to make the rectangles draggable and snap on the timeline.\n\
    \n**Listing 5-2.**\n\n```javascript\nvar clippings = [];\n\ndrawTimeline();\n\n\
    function drawTimeline() {\n  tracks.clear();\n  for (var i = 0; i <= numOfTracks;\
    \ i++) {\n    track[i] = tracks.line(0, timelineHeight / numOfTracks, timelineWidth,\
    \ trackPos);\n    track[i].move(0, trackPos * i);\n    track[i].attr({ stroke:\
    \ '#DAC8B0', id: \"track\" + i });\n  }\n  for (var i = 0; i < localStorage.length;\
    \ i++) {\n    var clipping = JSON.parse(localStorage[localStorage.key(i)]);\n\
    \    clippings[i] = tracks.rect(timelineWidth / 120 * clipping.size / 120, trackPos);\n\
    \    clippings[i].attr( { fill: \"#C6A49A\" } );\n    clippings[i].move(150, trackPos\
    \ * 3);\n    var text = tracks.text(localStorage.key(i)).move(clippings[i].x()\
    \ + 10, clippings[i].y() + 10).front();\n    text.attr( { fill: \"#fff\", id:\
    \ \"text\" + i });\n    clippings[i].draggable();\n    clippings[i].dragend =\
    \ (function(text) {\n      return function() {\n        if (this.y() < 0)\n  \
    \        this.move(this.x(), 0);\n        if (this.y() > timelineHeight - trackPos)\n\
    \          this.move(this.x(), height - trackPos);\n        else\n          this.move(this.x(),\
    \ Math.ceil(this.y() / trackPos) * trackPos);\n        text.move(this.x() + 10,\
    \ this.y() + 10);\n      }\n    })(text);\n    clippings[i].dragmove = (function(text)\
    \ {\n      return function() {\n        text.move(this.x() + 10, this.y() + 10);\n\
    \      }\n    })(text);\n  }\n}\n```\n\nThe finalized code for the chapter can\
    \ be found in the usual place, the downloadable complement to the book on the\
    \ Apress website at [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
    \ or on my own website at [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity).\n\
    \n## Summary\n\nWe now have the beginning of a music creation web app. From here\
    \ there are many paths you can go down, such as changing the tone of the notes\
    \ or adding the ability to mute tracks. We will be integrating this music creation\
    \ app into the media player that we will be creating in the next chapter. Hopefully\
    \ this has given you a good taste of what the Web Audio API can do, as well as\
    \ some experience with SVG and local storage."
  raw: '#### Timeline


    Now that we have the keyboard working and have everything set up for recording
    the audio, let’s create the interface. To avoid over complicating the project
    we will keep it simple and just have the keyboard with a timeline on which to
    put the music clippings, as well as buttons for recording and playing and stopping
    the timeline. When the page is loaded, the clips in the `localStorage` need to
    be represented as rectangles with a width proportional to the duration of the
    clip.


    `<!DOCTYPE html>`


    `<html>`


    `<head>`


    `<title>Music Theory</title>`


    `<style>`


    `* { margin: 0; }`


    `body { background-color: #747e88; }`


    `a { color: #d4dfcf; cursor: pointer;}`


    `a:hover, a:focus  { color: #E4eee3; }`


    `.controls a { display: inline-block; padding: 10px; }`


    `.recording { background-color: #d68189; }`


    `#tracks  { height: 300px; width: 100%; }`


    `#keyboard  { height: 300px; position: relative; width: 100%; }`


    `</style>`


    `</head>`


    `<body>`


    `<div class="controls">`


    `<a id="record">Record</a>`


    `<a id="play">Play</a>`


    `<a id="stop">Stop</a>`


    `</div>`


    `<div id="tracks"></div>`


    `<div id="keyboard"></div>`


    `<script src="../svg.js"></script>`


    `<script src="../svg.draggable.js"></script>`


    `<script src="../recorder.js"></script>`


    `<script src="../recorderWorker.js"></script>`


    `<script src="script.js"></script>`


    `</body>`


    `</html>`


    Starting with the buttons across the top of the page, each button needs an event
    listener for click events that have callbacks to do their specified task. The
    play and stop buttons just need to simply toggle a play variable that we will
    use to check whether the timeline bar for current time should be moving. The record
    button needs to toggle recording, this includes using the recorder to record the
    gain node, as well as toggling the recording class on the button and setting up
    the `recordStart` and `recordEnd` variables that are used to work out the duration.
    To get the name of the music clip we use a prompt. This could be done within the
    interface, but I used a prompt just for simplicity.


    `var toggleRecord = false;`


    `var recordStart;`


    `var recordEnd;`


    `var recorder;`


    `document.querySelector("#record").addEventListener(''click'', function() {`


    `if (!toggleRecord)  {`


    `recorder = new Recorder(gainNode, { workerPath: "../recorderWorker.js"});`


    `recorder.record();`


    `recordStart = Date.now();`


    `document.querySelector("#record").className = "recording";`


    `toggleRecord = !toggleRecord;`


    `}`


    `else  {`


    `recordEnd = Date.now();`


    `document.querySelector("#record").className = "";`


    `toggleRecord = !toggleRecord;`


    `recordSound(prompt("Name of sound clipping:"));`


    `}`


    `});`


    `document.querySelector("#play").addEventListener(''click'', function() {`


    `play = true;`


    `});`


    `document.querySelector("#stop").addEventListener(''click'', function() {`


    `play = false;`


    `});`


    With the buttons ready, let’s start making the actual timeline. As with the keyboard,
    this uses SVG. An empty timeline simply has lines representing each track, so
    we need a variable for the amount of tracks (this makes it easy to change the
    amount needed) and to draw the lines we draw the amount of tracks + 1 so that
    it has a bottom border. The trackPos variable is used to know the height of each
    individual track, as well as to position each track in the correct place.


    `var timelineWidth = document.querySelector("#tracks").clientWidth;`


    `var timelineHeight = document.querySelector("#tracks").clientHeight;`


    `var tracks = SVG(''tracks'');`


    `var play = false;`


    `var numOfTracks = 5;`


    `var track = [];`


    `var trackPos = timelineHeight/numOfTracks;`


    `var clippings = [];`


    `drawTimeline();`


    `function drawTimeline()  {`


    `tracks.clear();`


    `for (var i = 0; i <= numOfTracks; i++)  {`


    `track[i] = tracks.line(0, timelineHeight/numOfTracks, timelineWidth, trackPos);`


    `track[i].move(0, trackPos * i);`


    `track[i].attr({ stroke: ''#DAC8B0'', id: "track"+i });`


    `}`


    `// Clippings go here`


    `}`


    The music clippings are rectangles on the same SVG as the timeline, because they
    are part of it, that represent the music based on the duration of the clip. Each
    rectangle needs to be draggable so that they can be moved around the tracks. We
    could use event listeners like we did in [Chapter 2](#A978-1-4302-5945-9_2_Chapter.html),
    but since we are using SVG.js we can just use the plugin for it that is found
    at [`https://github.com/wout/svg.draggable.js`](https://github.com/wout/svg.draggable.js)
    . To make the rectangles draggable we just need to include the script, then call
    `.` `draggable()` on the rectangle. Because the rectangle is within the timeline
    SVG, making it draggable means it can drag within that SVG not over the other
    components of the app. That said, it can still be dragged outside the SVG but
    cannot be seen, so we need to stop it from going out of the bounds. We also need
    to snap the rectangles between the tracks, to do this we need to check that the
    rectangle is within the boundary of each track and if it isn’t, then to take the
    ceiling of the position so that it snaps to one of the tracks. Each rectangle
    also requires some text (that is moved with it) labeling the rectangle to the
    name of the music. In Figure [5-3](#A978-1-4302-5945-9_5_Chapter.html#Fig3) you
    can see how it looks when a few audio clippings have been recorded and placed
    in the timeline.


    ![A978-1-4302-5945-9_5_Fig3_HTML.jpg](A978-1-4302-5945-9_5_Fig3_HTML.jpg)


    Figure 5-3.


    The finished project, showing the timeline with some pre-recorded music in separate
    tracks


    In Listing 5-2, you can see the final modifications that are needed to make the
    rectangles draggable and snap on the timeline.


    Listing 5-2.


    `var clippings = [];`


    `drawTimeline();`


    `function drawTimeline()  {`


    `tracks.clear();`


    `for (var i = 0; i <= numOfTracks; i++)  {`


    `track[i] = tracks.line(0, timelineHeight/numOfTracks, timelineWidth, trackPos);`


    `track[i].move(0, trackPos * i);`


    `track[i].attr({ stroke: ''#DAC8B0'', id: "track"+i });`


    `}`


    `for (var i = 0; i < localStorage.length; i++)  {`


    `var clipping = JSON.parse(localStorage[localStorage.key(i)]);`


    `clippings[i] = tracks.rect(timelineWidth/120 * clipping.size/120, trackPos);`


    `clippings[i].attr( { fill: "#C6A49A" } );`


    `clippings[i].move(150, trackPos * 3);`


    `var text = tracks.text(localStorage.key(i)).move(clippings[i].x() + 10, clippings[i].y()
    + 10).front();`


    `text.attr( { fill: "#fff", id: "text"+i });`


    `clippings[i].draggable();`


    `clippings[i].dragend = (function(text)  {`


    `return function() {`


    `if (this.y() < 0)`


    `this.move(this.x(), 0);`


    `if (this.y() > timelineHeight - trackPos)`


    `this.move(this.x(), height - trackPos);`


    `else`


    `this.move(this.x(), Math.ceil(this.y() / trackPos) * trackPos);`


    `text.move(this.x() + 10, this.y() + 10);`


    `}`


    `})(text);`


    `clippings[i].dragmove = (function(text)  {`


    `return function() {`


    `text.move(this.x() + 10, this.y() + 10);`


    `}`


    `})(text);`


    `}`


    `}`


    The finalized code for the chapter can be found in the usual place, the downloadable
    complement to the book on the Apress website at [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)
    or on my own website at [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)
    .


    ## Summary


    We now have the beginning of a music creation web app. From here there are many
    paths you can go down, such as changing the tone of the notes or adding the ability
    to mute tracks. We will be integrating this music creation app into the media
    player that we will be creating in the next chapter. Hopefully this has given
    you a good taste of what the Web Audio API can do, as well as some experience
    with SVG and local storage.'
  trans: "\n# 时间线\n\n现在键盘已经可以正常工作，录制音频的一切也已准备就绪，接下来让我们创建界面。为了避免项目过于复杂，我们将保持设计简洁：只需一个包含时间线的键盘，用于放置音乐片段，以及用于录制、播放和停止时间线的按钮。页面加载时，`localStorage`\
    \ 中的片段需要显示为矩形，其宽度与片段的时长成正比。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>音乐理论</title>\n\
    <style>\n* { margin: 0; }\nbody { background-color: #747e88; }\na { color: #d4dfcf;\
    \ cursor: pointer;}\na:hover, a:focus  { color: #E4eee3; }\n.controls a { display:\
    \ inline-block; padding: 10px; }\n.recording { background-color: #d68189; }\n\
    #tracks  { height: 300px; width: 100%; }\n#keyboard  { height: 300px; position:\
    \ relative; width: 100%; }\n</style>\n</head>\n<body>\n<div class=\"controls\"\
    >\n<a id=\"record\">录制</a>\n<a id=\"play\">播放</a>\n<a id=\"stop\">停止</a>\n</div>\n\
    <div id=\"tracks\"></div>\n<div id=\"keyboard\"></div>\n<script src=\"../svg.js\"\
    ></script>\n<script src=\"../svg.draggable.js\"></script>\n<script src=\"../recorder.js\"\
    ></script>\n<script src=\"../recorderWorker.js\"></script>\n<script src=\"script.js\"\
    ></script>\n</body>\n</html>\n```\n\n从页面顶部的按钮开始，每个按钮都需要一个点击事件监听器，其回调函数负责执行指定任务。播放和停止按钮只需切换一个\
    \ `play` 变量，用于判断当前时间的时间线指示条是否应该移动。录制按钮则需要切换录制状态，包括使用录制器录制增益节点、切换按钮上的录制类，以及设置用于计算时长的\
    \ `recordStart` 和 `recordEnd` 变量。我们使用提示框来获取音乐片段的名称。虽然可以在界面内实现，但为了简洁起见，我直接使用了提示框。\n\
    \n```javascript\nvar toggleRecord = false;\nvar recordStart;\nvar recordEnd;\n\
    var recorder;\n\ndocument.querySelector(\"#record\").addEventListener('click',\
    \ function() {\n  if (!toggleRecord) {\n    recorder = new Recorder(gainNode,\
    \ { workerPath: \"../recorderWorker.js\"});\n    recorder.record();\n    recordStart\
    \ = Date.now();\n    document.querySelector(\"#record\").className = \"recording\"\
    ;\n    toggleRecord = !toggleRecord;\n  }\n  else {\n    recordEnd = Date.now();\n\
    \    document.querySelector(\"#record\").className = \"\";\n    toggleRecord =\
    \ !toggleRecord;\n    recordSound(prompt(\"声音片段名称：\"));\n  }\n});\n\ndocument.querySelector(\"\
    #play\").addEventListener('click', function() {\n  play = true;\n});\n\ndocument.querySelector(\"\
    #stop\").addEventListener('click', function() {\n  play = false;\n});\n```\n\n\
    按钮准备就绪后，我们开始构建实际的时间线。与键盘一样，这里使用 SVG。空的时间线仅包含代表每个音轨的线条，因此我们需要一个变量来定义音轨数量（便于调整所需数量）。绘制线条时，需要绘制（音轨数量\
    \ + 1）条线，以便形成底部边框。`trackPos` 变量用于确定每个音轨的高度，并将每个音轨定位在正确的位置。\n\n```javascript\n\
    var timelineWidth = document.querySelector(\"#tracks\").clientWidth;\nvar timelineHeight\
    \ = document.querySelector(\"#tracks\").clientHeight;\nvar tracks = SVG('tracks');\n\
    var play = false;\nvar numOfTracks = 5;\nvar track = [];\nvar trackPos = timelineHeight\
    \ / numOfTracks;\nvar clippings = [];\n\ndrawTimeline();\n\nfunction drawTimeline()\
    \ {\n  tracks.clear();\n  for (var i = 0; i <= numOfTracks; i++) {\n    track[i]\
    \ = tracks.line(0, timelineHeight / numOfTracks, timelineWidth, trackPos);\n \
    \   track[i].move(0, trackPos * i);\n    track[i].attr({ stroke: '#DAC8B0', id:\
    \ \"track\" + i });\n  }\n  // 此处放置片段\n}\n```\n\n音乐片段是与时间线位于同一 SVG 中的矩形，因为它们属于时间线的一部分，并根据音乐片段的时长来表示它。每个矩形都需要可拖动，以便在音轨间移动。我们可以像第\
    \ 2 章那样使用事件监听器，但由于我们使用了 SVG.js，可以直接使用其插件，该插件位于 [`https://github.com/wout/svg.draggable.js`](https://github.com/wout/svg.draggable.js)。要使矩形可拖动，只需包含脚本，然后在矩形上调用\
    \ `.draggable()` 方法即可。由于矩形位于时间线 SVG 内部，使其可拖动意味着它只能在该 SVG 内拖动，而不会越过应用程序的其他组件。尽管如此，它仍然可以被拖出\
    \ SVG 边界，但会不可见，因此我们需要阻止它超出范围。我们还需要让矩形在音轨之间吸附。为此，需要检查矩形是否在每个音轨的边界内；如果不在，则取位置的天花板值，使其吸附到某个音轨。每个矩形还需要一些跟随其移动的文本，用于标注音乐的名称。在图\
    \ 5-3 中，你可以看到录制并放置几个音频片段到时间线后的效果。\n\n![A978-1-4302-5945-9_5_Fig3_HTML.jpg](img/A978-1-4302-5945-9_5_Fig3_HTML.jpg)\n\
    \n**图 5-3.** 完成后的项目，显示时间线中不同音轨上放置了预先录制的音乐\n\n在代码清单 5-2 中，你可以看到使矩形可拖动并在时间线上吸附所需的最终修改。\n\
    \n**代码清单 5-2.**\n\n```javascript\nvar clippings = [];\n\ndrawTimeline();\n\nfunction\
    \ drawTimeline() {\n  tracks.clear();\n  for (var i = 0; i <= numOfTracks; i++)\
    \ {\n    track[i] = tracks.line(0, timelineHeight / numOfTracks, timelineWidth,\
    \ trackPos);\n    track[i].move(0, trackPos * i);\n    track[i].attr({ stroke:\
    \ '#DAC8B0', id: \"track\" + i });\n  }\n  for (var i = 0; i < localStorage.length;\
    \ i++) {\n    var clipping = JSON.parse(localStorage[localStorage.key(i)]);\n\
    \    clippings[i] = tracks.rect(timelineWidth / 120 * clipping.size / 120, trackPos);\n\
    \    clippings[i].attr( { fill: \"#C6A49A\" } );\n    clippings[i].move(150, trackPos\
    \ * 3);\n    var text = tracks.text(localStorage.key(i)).move(clippings[i].x()\
    \ + 10, clippings[i].y() + 10).front();\n    text.attr( { fill: \"#fff\", id:\
    \ \"text\" + i });\n    clippings[i].draggable();\n    clippings[i].dragend =\
    \ (function(text) {\n      return function() {\n        if (this.y() < 0)\n  \
    \        this.move(this.x(), 0);\n        if (this.y() > timelineHeight - trackPos)\n\
    \          this.move(this.x(), height - trackPos);\n        else\n          this.move(this.x(),\
    \ Math.ceil(this.y() / trackPos) * trackPos);\n        text.move(this.x() + 10,\
    \ this.y() + 10);\n      }\n    })(text);\n    clippings[i].dragmove = (function(text)\
    \ {\n      return function() {\n        text.move(this.x() + 10, this.y() + 10);\n\
    \      }\n    })(text);\n  }\n}\n```\n\n本章的最终代码可以在常规位置找到，即 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
    \ 上本书的可下载配套资源，或我自己的网站 [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)。\n\
    \n## 总结\n\n现在我们拥有了一个音乐创作网页应用的雏形。从这里出发，有许多方向可以探索，例如改变音符的音调或增加静音音轨的功能。我们将在下一章把这个音乐创作应用集成到将要创建的媒体播放器中。希望本章能让你充分领略\
    \ Web Audio API 的能力，并积累一些使用 SVG 和本地存储的经验。\n"
- fmt: "# 6. The Music Player\n\nSo far, we have taken a brief tour through the winding\
    \ roads of sound and graphics. We started with canvas and explored the world of\
    \ 2D and animations; from there we crossed into looking at the video and audio\
    \ HTML elements and Web Audio API from which we used canvas for visualizing music\
    \ by creating tools such as spectrograms. It was then back into graphics to dive\
    \ head first into 3D worlds where we played with types of lighting and materials\
    \ to learn how things affect one another. [Chapter 5](#A978-1-4302-5945-9_5_Chapter.html)\
    \ seemingly dropped the graphics altogether (except from using SVGs of course)\
    \ and focused purely on music, generating notes through JavaScript without requiring\
    \ any plugins or audio files, just a browser that implements the Web Audio API.\
    \ I would, however, like to focus a little bit more on audio files by extending\
    \ from [Chapter 3](#A978-1-4302-5945-9_3_Chapter.html) (where we looked at the\
    \ codecs that are used and introduced the Web Audio API) and creating that media\
    \ player I keep mentioning.\n\nThis chapter ties up all the loose ends of the\
    \ previous chapters. We will make a media player that includes the music creation\
    \ from the previous chapter as well as creating a 3D visualizer (based on Steven\
    \ Wittens’ js1k demo) that is less of a tool than the spectrogram and more like\
    \ the art that you may remember seeing on media players such as Winamp.\n\n##\
    \ Media Player\n\nI would like to come at this from a different direction than\
    \ the previous chapters. Earlier I taught you parts of a subject area, such as\
    \ sound. Rather than teaching, I would like this chapter to feel more like a project\
    \ to work on. There are so many ways to build a large app like this, as well as\
    \ so many different features, that I’m going to define the specification of the\
    \ app and it is your choice whether to tackle it the same way as I am or to take\
    \ a different route.\n\n### Specification\n\nOur music player must be client-side\
    \ only, so there should be no reliance on servers except any that host music that\
    \ is being played via a URL. There must be options from where to play the music,\
    \ including the local machine and possibly services such as Tomahawk. Of course,\
    \ as with any media player there must be pause, play, and stop buttons as well\
    \ as functionality for at least one playlist. As I already mentioned, we will\
    \ be integrating both the music creation app and a 3D visualizer into the media\
    \ player. These will be integrated into the app but there is plenty of scope to\
    \ take the app a lot further, such as developing a plugin system to separate out\
    \ the functionality.\n\n### Where to Start\n\nNow we need to think about the best\
    \ way to organize the data and interface so that they are not too tightly linked\
    \ but can affect each other. There are many ways to go about this, but because\
    \ Backbone is very popular for doing exactly this, I am going to suggest we use\
    \ Backbone. I am not going to presume any prior knowledge of it, although it isn’t\
    \ a tutorial about it either, so I will quickly explain each part of it as it\
    \ is needed.\n\n### Playlists\n\nThe main function of a music player is to play\
    \ the tracks within a playlist. So it makes sense to start with this functionality,\
    \ where we can have a number of named playlists (the examples used are Latin and\
    \ Reggae) that have tracks stored within them. The tracks should have a name,\
    \ artist name, and URL. The URL can be used to play music from both local and\
    \ remote sources, as well as the Data URIs that we used for storing the music\
    \ in [Chapter 5](#A978-1-4302-5945-9_5_Chapter.html).\n\n#### Models\n\nIn Backbone,\
    \ there are both model and collection classes that can be created using `Backbone.Model.extend()`\
    \ and `Backbone.Collection.extend()`, respectively. A model is simply an array\
    \ that has been enhanced with Backbone features, and a collection is a way to\
    \ store multiple models (this is a concept that is common in many programming\
    \ languages but is not native within JavaScript). Each model can have defaults,\
    \ which are simple objects used so that if part of the data is incomplete, then\
    \ it will use the default. Collections have a property, called `model`, which\
    \ defines the model class that should be used. I have decided to use a `localStorage`\
    \ plugin for Backbone called `backbone.localstorage.js`, which can be added to\
    \ the collection by adding the property `localStorage: new Backbone.LocalStorage(\"\
    playlists\")`.\n\nTo do this we need to separate the entities into models, so\
    \ that the `Playlist` model has a name as well as an array of `Tracks` so that\
    \ there can be a list of playlists that each have tracks and a name of their own.\
    \ Each `Track` model has the name, artist, and URL as explained previously. The\
    \ reason that we need a model for each playlist rather than just a collection\
    \ of tracks is that collections cannot be named and of course the purpose of playlists\
    \ is to separate tracks often into meaningful playlists such as the genre of music.\n\
    \n```\nvar Track = Backbone.Model.extend({\n\n  defaults: {\n\n      title: \"\
    Unknown\",\n\n      artist: \"Unknown\",\n\n      url: \"Unknown\"\n\n  }\n\n\
    });\n\nvar Playlist = Backbone.Model.extend({\n\n  defaults: {\n\n      title:\
    \ \"Untitled Playlist\",\n\n      tracks: []\n\n  }\n\n});\n\nvar Playlists =\
    \ Backbone.Collection.extend({\n\n  model: Playlist,\n\n  localStorage: new Backbone.LocalStorage(\"\
    playlists\")\n\n});\n\nvar playlists = new Playlists();\n```"
  raw: '# 6. The Music Player


    So far, we have taken a brief tour through the winding roads of sound and graphics.
    We started with canvas and explored the world of 2D and animations; from there
    we crossed into looking at the video and audio html elements and web audio API
    from which we used canvas for visualizing music by creating tools such as spectrograms.
    It was then back into graphics to dive head first into 3D worlds where we played
    with types of lighting and materials to learn how things affect one another. [Chapter
    5](#A978-1-4302-5945-9_5_Chapter.html) seemingly dropped the graphics altogether
    (except from using SVGs of course) and focused purely on music, generating notes
    through JavaScript without requiring any plugins or audio files, just a browser
    that implements the web audio API. I would, however, like to focus a little bit
    more on audio files by extending from [Chapter 3](#A978-1-4302-5945-9_3_Chapter.html)
    (where we looked at the codecs that are used and introduced the web audio API)
    and creating that media player I keep mentioning.


    This chapter ties up all the loose ends of the previous chapters. We will make
    a media player that includes the music creation from the previous chapter as well
    as creating a 3D visualizer (based on Steven Wittens’ js1k demo) that is less
    of a tool than the spectrogram and more like the art that you may remember seeing
    on media players such as Winamp.


    ## Media Player


    I would like to come at this from a different direction than the previous chapters.
    Earlier I taught you parts of a subject area, such as sound. Rather than teaching,
    I would like this chapter to feel more like a project to work on. There are so
    many ways to build a large app like this, as well as so many different features,
    that I’m going to define the specification of the app and it is your choice whether
    to tackle it the same way as I am or to take a different route.


    ### Specification


    Our music player must be client-side only, so there should be no reliance on servers
    except any that host music that is being played via a URL. There must be options
    from where to play the music, including the local machine and possibly services
    such as Tomahawk. Of course, as with any media player there must be pause, play,
    and stop buttons as well as functionality for at least one playlist. As I already
    mentioned, we will be integrating both the music creation app and a 3D visualizer
    into the media player. These will be integrated into the app but there is plenty
    of scope to take the app a lot further, such as developing a plugin system to
    separate out the functionality.


    ### Where to Start


    Now we need to think about the best way to organize the data and interface so
    that they are not too tightly linked but can affect each other. There are many
    ways to go about this, but because Backbone is very popular for doing exactly
    this, I am going to suggest we use Backbone. I am not going to presume any prior
    knowledge of it, although it isn’t a tutorial about it either, so I will quickly
    explain each part of it as it is needed.


    ### Playlists


    The main function of a music player is to play the tracks within a playlist. So
    it makes sense to start with this functionality, where we can have a number of
    named playlists (the examples used are Latin and Reggae) that have tracks stored
    within them. The tracks should have a name, artist name, and URL. The URL can
    be used to play music from both local and remote sources, as well as the Data
    URIs that we used for storing the music in [Chapter 5](#A978-1-4302-5945-9_5_Chapter.html).


    #### Models


    In Backbone, there are both model and collection classes that can be created using
    `Backbone.Model.extend()` and `Backbone.Collection.extend()`, respectively. A
    model is simply an array that has been enhanced with Backbone features, and a
    collection is a way to store multiple models (this is a concept that is common
    in many programming languages but is not native within JavaScript). Each model
    can have defaults, which are simple objects used so that if part of the data is
    incomplete, then it will use the default. Collections have a property, called
    model, which defines the model class that should be used. I have decided to use
    a `localStorage` plugin for Backbone called `backbone.localstorage.js`, which
    can be added to the collection by adding the property `localStorage: new Backbone.LocalStorage("playlists")`.


    To do this we need to separate the entities into models, so that the `Playlist`
    model has a name as well as an array of `Tracks` so that there can be a list of
    playlists that each have tracks and a name of their own. Each `Track` model has
    the name, artist, and URL as explained previously. The reason that we need a model
    for each playlist rather than just a collection of tracks is that collections
    cannot be named and of course the purpose of playlists is to separate tracks often
    into meaningful playlists such as the genre of music.


    `var Track = Backbone.Model.extend({`


      `defaults: {`


          `title: "Unknown",`


          `artist: "Unknown",`


          `url: "Unknown"`


      `}`


    `});`


    `var Playlist = Backbone.Model.extend({`


      `defaults: {`


          `title: "Untitled Playlist",`


          `tracks: []`


      `}`


    `});`


    `var Playlists = Backbone.Collection.extend({`


      `model: Playlist,`


      `localStorage: new Backbone.LocalStorage("playlists")`


    `});`


    `var playlists = new Playlists();`'
  trans: "\n# 6. 音乐播放器\n\n到目前为止，我们已经简要游览了声音与图形的蜿蜒之路。我们从 Canvas 起步，探索了二维世界与动画的世界；随后跨越到视频和音频\
    \ HTML 元素以及 Web Audio API，利用 Canvas 创建了频谱图等工具来可视化音乐。接着我们又一头扎进三维图形世界，在那里摆弄各种光照与材质，学习它们之间的相互作用。第\
    \ 5 章看似完全放弃了图形（当然除了使用 SVG），纯粹聚焦于音乐，通过 JavaScript 生成音符，无需任何插件或音频文件，只需一个实现了 Web\
    \ Audio API 的浏览器即可。不过，我想在第 3 章（我们研究了所用编解码器并介绍了 Web Audio API）的基础上更进一步，专注于音频文件，并构建那个我一直提及的媒体播放器。\n\
    \n本章将收束前几章的所有未尽之处。我们将制作一个媒体播放器，它既包含前一章的音乐创作功能，又集成了一个 3D 可视化器（基于 Steven Wittens\
    \ 的 js1k 演示）。这个可视化器不像频谱图那样偏向工具性，而更像你可能在 Winamp 等媒体播放器上见过的艺术效果。\n\n## 媒体播放器\n\n\
    我想采用与前面章节不同的方式来切入。之前我是向你分块教授某个主题领域（比如声音）的知识。但本章我更希望它像一个待完成的项目，而非单纯的讲授。构建这样一个大型应用有众多方法，可添加的功能也五花八门，因此我将先定义应用的规格说明，至于你是按照我的方式还是另辟蹊径，都悉听尊便。\n\
    \n### 规格说明\n\n我们的音乐播放器必须完全运行在客户端，因此除了通过 URL 播放托管音乐所需的服务器之外，不应依赖任何其他服务器。必须提供多种音乐来源选项，包括本地机器以及可能的服务（如\
    \ Tomahawk）。当然，与任何媒体播放器一样，必须有暂停、播放和停止按钮，并且至少支持一个播放列表的功能。正如我前面提到的，我们将把音乐创作应用和 3D\
    \ 可视化器集成到播放器中。这些功能会融入应用，但仍有很大的扩展空间，比如开发一个插件系统来解耦各项功能。\n\n### 从何入手\n\n现在，我们需要思考如何最佳地组织数据和界面，使它们既不过度耦合，又能相互影响。实现方式有很多种，但由于\
    \ Backbone 在这方面非常流行，我建议使用 Backbone。我不会假定你已具备相关背景知识（尽管这也不是它的使用教程），因此我会在用到每个部分时快速加以解释。\n\
    \n### 播放列表\n\n音乐播放器的主要功能是播放列表中的曲目。因此，从这个功能入手是合理的：我们可以拥有多个命名的播放列表（示例中使用了拉丁和雷鬼），每个列表中存储着曲目。曲目应包含名称、艺术家名称和\
    \ URL。URL 可用于播放本地和远程来源的音乐，以及我们在第 5 章中用于存储音乐的 Data URI。\n\n#### 模型\n\n在 Backbone\
    \ 中，分别使用 `Backbone.Model.extend()` 和 `Backbone.Collection.extend()` 来创建模型类和集合类。模型本质上是一个经过\
    \ Backbone 特性增强的数组，而集合则是存储多个模型的一种方式（这是许多编程语言中常见的概念，但在 JavaScript 中并非原生）。每个模型都可以有默认值（defaults），它们是一些简单的对象，用于在数据不完整时提供默认内容。集合有一个名为\
    \ `model` 的属性，用于指定应使用的模型类。我决定使用一个名为 `backbone.localstorage.js` 的 Backbone `localStorage`\
    \ 插件，只需在集合中添加属性 `localStorage: new Backbone.LocalStorage(\"playlists\")` 即可启用。\n\
    \n为此，我们需要将实体分离为模型：`Playlist` 模型包含一个名称以及一个 `Tracks` 数组，这样我们就可以拥有一系列播放列表，每个播放列表各自包含曲目和名称。每个\
    \ `Track` 模型则包含名称、艺术家和 URL，如前所述。之所以需要为每个播放列表建立一个模型，而不仅仅是一个曲目集合，是因为集合无法命名，而播放列表的目的正是将曲目归类到有意义的列表中（例如按音乐流派）。\n\
    \n```\nvar Track = Backbone.Model.extend({\n\n  defaults: {\n\n      title: \"\
    Unknown\", // 标题：未知\n\n      artist: \"Unknown\", // 艺术家：未知\n\n      url: \"Unknown\"\
    \ // 链接：未知\n\n  }\n\n});\n\nvar Playlist = Backbone.Model.extend({\n\n  defaults:\
    \ {\n\n      title: \"Untitled Playlist\", // 标题：未命名播放列表\n\n      tracks: [] //\
    \ 曲目：空数组\n\n  }\n\n});\n\nvar Playlists = Backbone.Collection.extend({\n\n  model:\
    \ Playlist,\n\n  localStorage: new Backbone.LocalStorage(\"playlists\")\n\n});\n\
    \nvar playlists = new Playlists();\n```\n"
- fmt: "### Views\n\n我们使用`Backbone.View.extend()`创建视图来展示模型和集合。视图是一种封装模型所有方法和事件处理程序的方式，使得每个视图能够自行管理其所关联的数据，而不必操心众多不同的数据。更重要的是，视图还是一种将模型中的数据与模板连接起来的方式，这些模板用于生成渲染数据到页面的HTML。通常，一个视图会处理单个模型，因此你需要定义一个模型和一个视图。不幸的是，视图可以处理集合，但只能将其视为一个整体模型。我们需要创建处理模型视图的列表视图，这样每个模型视图可以附加一个事件，而不是让整个集合来处理事件。因此，为了拥有一个既显示播放列表名称列表又显示播放列表本身的界面，我们需要为每个列表创建一个列表视图，并为每个单独的模型创建一个视图。我将列表视图命名为`PlaylistListView`和`TrackListView`，这样它们的含义就一目了然了。当然，我选择`TrackList`而不是`Playlist`是为了避免名称重复，并且这样命名更清晰一些。每个列表都有其对应模型的视图，即`PlaylistView`和`TrackView`，每个列表视图中可以根据需要创建任意多个此类视图。图[6-1](#A978-1-4302-5945-9_6_Chapter.html#Fig1)以图形方式展示了这些视图之间的关系。\n\
    \n![A978-1-4302-5945-9_6_Fig1_HTML.jpg](A978-1-4302-5945-9_6_Fig1_HTML.jpg)\n\n\
    图 6-1. 一个展示了具有两个可点击列表项的列表的界面所需的视图\n\n`PlaylistListView`是一个按名称列出每个播放列表的视图，因此它可以直接绑定到一个`id`为`playlists`的`div`。这个视图不负责渲染到模板的任何数据，因此我们可以直接进行下一步：在初始化方法中，将`playlists`集合中的每个模型绑定到一个名为`renderItem`的函数上，该函数为集合中的每个播放列表模型创建一个`playlistView`并将其渲染到屏幕上。当然，视图还需要一个`render`函数，以便对每个模型调用`renderItem`。我通过使用Underscore的`_.each`遍历模型，获取每个模型的JSON数据，然后将其传递给`renderItem`函数来实现这一点。`TrackListView`的工作原理相同，它为播放列表的`tracks`数组中的每个`Track`模型渲染一个`TrackView`。\n\
    \n```\nvar PlaylistListView = Backbone.View.extend({\n\nel: \"#playlists\",\n\n\
    model: playlists,\n\ninitialize: function() {\n\nthis.listenTo(this.model, \"\
    change\", this.render);\n\nthis.bind('render', this.render);\n\n_.bindAll(this,\
    \ \"renderItem\");\n\n},\n\nrenderItem: function(model){\n\nvar playlistView =\
    \ new PlaylistView({model: model});\n\nplaylistView.render();\n\n$(this.el).append(playlistView.el);\n\
    \n},\n\nrender: function(){\n\n$(\"#playlists\").html('');\n\nvar self = this,\n\
    \nhtml = '';\n\n_.each(this.model.toJSON(), function(mod) {\n\nself.renderItem(mod);\n\
    \n});\n\n}\n\n});\n\nvar TrackListView = Backbone.View.extend({\n\nel: $(\"#tracks\"\
    ),\n\ninitialize: function(){\n\nthis.bind('changePlaylist', this.changePlaylist);\n\
    \n_.bindAll(this, \"renderItem\");\n\n},\n\nrenderItem: function(model){\n\nvar\
    \ trackView = new TrackView({model: model});\n\ntrackView.render();\n\n$(this.el).append(trackView.el);\n\
    \n},\n\nrender: function(){\n\n$(\"#tracks\").html('');\n\nif (this.model)  {\n\
    \nvar self = this,\n\nhtml = '';\n\n_.each(this.model.toJSON().tracks, function(mod)\
    \ {\n\nself.renderItem(mod);\n\n});\n\n}\n\n},\n\nchangePlaylist: function(current)\
    \  {\n\nif (!this.model && current) {\n\nthis.model = current;\n\n}\n\nthis.render();\n\
    \n}\n\n});\n```\n\n单个视图的工作方式类似，但显然它们只需要渲染自身，而不需要渲染整个集合的内容。这些视图还使用Underscore模板将数据渲染到页面上。每个视图都有双击事件，这些事件会触发一个名为`play`的函数。在`PlaylistView`中，`play`函数会触发一个事件，使得`App`播放播放列表中的第一首曲目；而在`TrackView`中，`play`函数用于播放特定的曲目。\n\
    \n```\nvar PlaylistView = Backbone.View.extend({\n\ntagName: \"li\",\n\ntemplate:\
    \ _.template($('#playlist-template').html()),\n\nevents: {\n\n\"dblclick\"  :\
    \ \"play\"\n\n},\n\nrender: function() {\n\nvar html = this.template(this.model);\n\
    \n$(this.el).html(html);\n\nreturn this;\n\n},\n\nplay: function()  {\n\nthis.trigger('play');\n\
    \n}\n\n});\n\nvar TrackView = Backbone.View.extend({\n\ntagName: \"li\",\n\ntemplate:\
    \ _.template($('#track-template').html()),\n\nevents: {\n\n\"dblclick\"  : \"\
    play\"\n\n},\n\nrender: function() {\n\nif(this.model)  {\n\nvar html = this.template(this.model);\n\
    \n$(this.el).html(html);\n\n}\n\nreturn this;\n\n},\n\nplay: function()  {\n\n\
    console.log(\"Playing \" + this.model.title);\n\nplayer.trigger(\"play\", this.model);\n\
    \n}\n\n});\n```\n\n### Player Object\n\n你会注意到我调用了一个`player`上的函数，这个对象负责管理声音。默认情况下，该对象存储`el`作为快速访问`$(\"\
    #player\")`（一个音频元素）的方式，同时它将当前曲目ID存储为`track`并默认为`null`。状态默认为`\"paused\"`，用于判断曲目是否正在播放。要切换曲目，我们只需要一个`setTrack`函数，将`track`设置为新的曲目ID。当然，播放器需要能够播放音乐，因此需要一个`play`函数；它需要接受一个可选的曲目ID作为参数，以便将其添加到音频元素的`src`中。\n\
    \n```\nvar Player = Backbone.View.extend({\n\n    el : \"#player\",\n\n    track\
    \ : null,\n\n    state : \"paused\",\n\n    initialize: function()  {\n\n    \
    \  this.bind('play', this.play);\n\n      this.bind('pause', this.pause);\n\n\
    \    },\n\n    setTrack : function(track)  {\n\n      this.track = track;\n\n\
    \    },\n\n    play : function(track)  {\n\n      // If track is set then play\
    \ new song. Else play current src (used for pausing).\n\n      if (track)  {\n\
    \n        this.setTrack(track);\n\n        $(this.el).attr(\"src\", track.url).appendTo($(this.el).parent());\n\
    \n      }\n\n      $(\"#togglePlaying\").html(\"Pause\");\n\n      this.state\
    \ = \"playing\";\n\n      this.el.play();\n\n    },\n\n    pause : function()\
    \  {\n\n      $(\"#togglePlaying\").html(\"Play\");\n\n      this.state = \"paused\"\
    ;\n\n      this.el.pause();\n\n    }\n\n  });\n\n  var player = new Player();\n\
    ```"
  raw: '#### Views


    We create views to display the models and collections using `Backbone.View.extend()`.
    A view is a way to encapsulate all the methods and event handlers of a model so
    that each looks after itself rather than worrying about lots of different data.
    It is also, perhaps more importantly, a way to connect to the data within the
    models to the templates that produce the HTML for rendering the data to the page.
    Usually one view would deal with a single model so that you would have to define
    just one model and one view. Unfortunately, views can handle collections but only
    as one collective model. We need to create list views that handle the model views,
    so that each model view can have an event attached to it rather than to the collection
    overall. So, to have an interface where there is both a list of playlist names
    as well as the playlist itself we need to have a list view for each as well as
    a view for each individual model. I have decided to call the list views `PlaylistListView`
    and `TrackListView` so that it is obvious they are list views. Of course I had
    to choose TrackList instead of Playlist so that the names were not duplicated
    and it is slightly more obvious what they mean. Each list has a view of the model
    it represents, `PlaylistView` and `TrackView`, of which there can be as many as
    needed per list view. Figure [6-1](#A978-1-4302-5945-9_6_Chapter.html#Fig1) shows
    a graphical representation of how these views are related.


    ![A978-1-4302-5945-9_6_Fig1_HTML.jpg](A978-1-4302-5945-9_6_Fig1_HTML.jpg)


    Figure 6-1.


    A diagram showing the views required for an interface that has two lists with
    clickable list items


    The `PlaylistListView` is the view that lists each playlist by name, so it can
    be directly bound to a div with an id of `playlists`. This view is not responsible
    for any data that gets rendered to templates so we can go straight ahead and,
    inside the initialization, bind each model within the `playlists` collection to
    a function called `renderItem` that creates the `playlistView` for each playlist
    model in the collection and renders it to the screen. Of course, the view also
    requires a `render` function so that calls the `renderItem` on each model, I have
    done this by iterating through the models using Underscore’s `_.each` to get the
    JSON of each model which it then passes to the `renderItem` function. The `TrackListView`
    works in the same way, rendering a `TrackView` for each `Track` model in the playlist’s
    `tracks` array.


    `var PlaylistListView = Backbone.View.extend({`


    `el: "#playlists",`


    `model: playlists,`


    `initialize: function() {`


    `this.listenTo(this.model, "change", this.render);`


    `this.bind(''render'', this.render);`


    `_.bindAll(this, "renderItem");`


    `},`


    `renderItem: function(model){`


    `var playlistView = new PlaylistView({model: model});`


    `playlistView.render();`


    `$(this.el).append(playlistView.el);`


    `},`


    `render: function(){`


    `$("#playlists").html('''');`


    `var self = this,`


    `html = '''';`


    `_.each(this.model.toJSON(), function(mod) {`


    `self.renderItem(mod);`


    `});`


    `}`


    `});`


    `var TrackListView = Backbone.View.extend({`


    `el: $("#tracks"),`


    `initialize: function(){`


    `this.bind(''changePlaylist'', this.changePlaylist);`


    `_.bindAll(this, "renderItem");`


    `},`


    `renderItem: function(model){`


    `var trackView = new TrackView({model: model});`


    `trackView.render();`


    `$(this.el).append(trackView.el);`


    `},`


    `render: function(){`


    `$("#tracks").html('''');`


    `if (this.model)  {`


    `var self = this,`


    `html = '''';`


    `_.each(this.model.toJSON().tracks, function(mod) {`


    `self.renderItem(mod);`


    `});`


    `}`


    `},`


    `changePlaylist: function(current)  {`


    `if (!this.model && current) {`


    `this.model = current;`


    `}`


    `this.render();`


    `}`


    `});`


    The individual views work in a similar way but of course they only have to render
    themselves and not the contents of the collection. These views also use underscore
    templates to render the data to the page. Each view has double-click events that
    trigger a function called `play` for the `PlaylistView` The `play` function triggers
    an event that causes `App` to play the first track on the playlist, whereas the
    `play` function on `TrackView` is used to play the specific track.


    `var PlaylistView = Backbone.View.extend({`


    `tagName: "li",`


    `template: _.template($(''#playlist-template'').html()),`


    `events: {`


    `"dblclick"  : "play"`


    `},`


    `render: function() {`


    `var html = this.template(this.model);`


    `$(this.el).html(html);`


    `return this;`


    `},`


    `play: function()  {`


    `this.trigger(''play'');`


    `}`


    `});`


    `var TrackView = Backbone.View.extend({`


    `tagName: "li",`


    `template: _.template($(''#track-template'').html()),`


    `events: {`


    `"dblclick"  : "play"`


    `},`


    `render: function() {`


    `if(this.model)  {`


    `var html = this.template(this.model);`


    `$(this.el).html(html);`


    `}`


    `return this;`


    `},`


    `play: function()  {`


    `console.log("Playing " + this.model.title);`


    `player.trigger("play", this.model);`


    `}`


    `});`


    ### Player Object


    You will notice that I call a function on `player`, this is the object that is
    in control of managing the sound. By default the object stores `el` as a way to
    quickly access `$("#player")`, which is an audio element, it also stores the current
    track id as `track` and defaults to `null`. The state defaults to `"paused"` and
    is used to know whether a track is playing. To change the track we just need a
    `setTrack` function that sets `track` to be the new track id. Of course, the player
    needs to be able to play music so a `play` function is required; it needs to take
    a track id as an optional parameter so that it can be added to the `src` of the
    audio element.


    `var Player = Backbone.View.extend({`


        `el : "#player",`


        `track : null,`


        `state : "paused",`


        `initialize: function()  {`


          `this.bind(''play'', this.play);`


          `this.bind(''pause'', this.pause);`


        `},`


        `setTrack : function(track)  {`


          `this.track = track;`


        `},`


        `play : function(track)  {`


          `// If track is set then play new song. Else play current src (used for
    pausing).`


          `if (track)  {`


            `this.setTrack(track);`


            `$(this.el).attr("src", track.url).appendTo($(this.el).parent());`


          `}`


          `$("#togglePlaying").html("Pause");`


          `this.state = "playing";`


          `this.el.play();`


        `},`


        `pause : function()  {`


          `$("#togglePlaying").html("Play");`


          `this.state = "paused";`


          `this.el.pause();`


        `}`


      `});`


      `var player = new Player();`'
  trans: "\n### 视图\n\n我们使用`Backbone.View.extend()`创建视图来展示模型和集合。视图是一种封装模型所有方法和事件处理程序的方式，使得每个视图能够自行管理其所关联的数据，而不必操心众多不同的数据。更重要的是，视图还是一种将模型中的数据与模板连接起来的方式，这些模板用于生成渲染数据到页面的\
    \ HTML。通常，一个视图会处理单个模型，因此你需要定义一个模型和一个视图。不幸的是，视图可以处理集合，但只能将其视为一个整体模型。我们需要创建处理模型视图的列表视图，这样每个模型视图可以附加一个事件，而不是让整个集合来处理事件。因此，为了拥有一个既显示播放列表名称列表又显示播放列表本身的界面，我们需要为每个列表创建一个列表视图，并为每个单独的模型创建一个视图。我将列表视图命名为`PlaylistListView`和`TrackListView`，这样它们的含义就一目了然了。当然，我选择`TrackList`而不是`Playlist`是为了避免名称重复，并且这样命名更清晰一些。每个列表都有其对应模型的视图，即`PlaylistView`和`TrackView`，每个列表视图中可以根据需要创建任意多个此类视图。图\
    \ 6-1 以图形方式展示了这些视图之间的关系。\n\n![A978-1-4302-5945-9_6_Fig1_HTML.jpg](img/A978-1-4302-5945-9_6_Fig1_HTML.jpg)\n\
    \n图 6-1. 一个展示了具有两个可点击列表项的列表的界面所需的视图\n\n`PlaylistListView`是一个按名称列出每个播放列表的视图，因此它可以直接绑定到一个`id`为`playlists`的`div`。这个视图不负责渲染到模板的任何数据，因此我们可以直接进行下一步：在初始化方法中，将`playlists`集合中的每个模型绑定到一个名为`renderItem`的函数上，该函数为集合中的每个播放列表模型创建一个`playlistView`并将其渲染到屏幕上。当然，视图还需要一个`render`函数，以便对每个模型调用`renderItem`。我通过使用\
    \ Underscore 的`_.each`遍历模型，获取每个模型的 JSON 数据，然后将其传递给`renderItem`函数来实现这一点。`TrackListView`的工作原理相同，它为播放列表的`tracks`数组中的每个`Track`模型渲染一个`TrackView`。\n\
    \n```\nvar PlaylistListView = Backbone.View.extend({\n\nel: \"#playlists\",\n\n\
    model: playlists,\n\ninitialize: function() {\n\nthis.listenTo(this.model, \"\
    change\", this.render);\n\nthis.bind('render', this.render);\n\n_.bindAll(this,\
    \ \"renderItem\");\n\n},\n\nrenderItem: function(model){\n\nvar playlistView =\
    \ new PlaylistView({model: model});\n\nplaylistView.render();\n\n$(this.el).append(playlistView.el);\n\
    \n},\n\nrender: function(){\n\n$(\"#playlists\").html('');\n\nvar self = this,\n\
    \nhtml = '';\n\n_.each(this.model.toJSON(), function(mod) {\n\nself.renderItem(mod);\n\
    \n});\n\n}\n\n});\n\nvar TrackListView = Backbone.View.extend({\n\nel: $(\"#tracks\"\
    ),\n\ninitialize: function(){\n\nthis.bind('changePlaylist', this.changePlaylist);\n\
    \n_.bindAll(this, \"renderItem\");\n\n},\n\nrenderItem: function(model){\n\nvar\
    \ trackView = new TrackView({model: model});\n\ntrackView.render();\n\n$(this.el).append(trackView.el);\n\
    \n},\n\nrender: function(){\n\n$(\"#tracks\").html('');\n\nif (this.model)  {\n\
    \nvar self = this,\n\nhtml = '';\n\n_.each(this.model.toJSON().tracks, function(mod)\
    \ {\n\nself.renderItem(mod);\n\n});\n\n}\n\n},\n\nchangePlaylist: function(current)\
    \  {\n\nif (!this.model && current) {\n\nthis.model = current;\n\n}\n\nthis.render();\n\
    \n}\n\n});\n```\n\n单个视图的工作方式类似，但显然它们只需要渲染自身，而不需要渲染整个集合的内容。这些视图还使用 Underscore 模板将数据渲染到页面上。每个视图都有双击事件，这些事件会触发一个名为`play`的函数。在`PlaylistView`中，`play`函数会触发一个事件，使得`App`播放播放列表中的第一首曲目；而在`TrackView`中，`play`函数用于播放特定的曲目。\n\
    \n```\nvar PlaylistView = Backbone.View.extend({\n\ntagName: \"li\",\n\ntemplate:\
    \ _.template($('#playlist-template').html()),\n\nevents: {\n\n\"dblclick\"  :\
    \ \"play\"\n\n},\n\nrender: function() {\n\nvar html = this.template(this.model);\n\
    \n$(this.el).html(html);\n\nreturn this;\n\n},\n\nplay: function()  {\n\nthis.trigger('play');\n\
    \n}\n\n});\n\nvar TrackView = Backbone.View.extend({\n\ntagName: \"li\",\n\ntemplate:\
    \ _.template($('#track-template').html()),\n\nevents: {\n\n\"dblclick\"  : \"\
    play\"\n\n},\n\nrender: function() {\n\nif(this.model)  {\n\nvar html = this.template(this.model);\n\
    \n$(this.el).html(html);\n\n}\n\nreturn this;\n\n},\n\nplay: function()  {\n\n\
    console.log(\"Playing \" + this.model.title);\n\nplayer.trigger(\"play\", this.model);\n\
    \n}\n\n});\n```\n\n### 播放器对象\n\n你会注意到我调用了一个`player`上的函数，这个对象负责管理声音。默认情况下，该对象存储`el`作为快速访问`$(\"\
    #player\")`（一个音频元素）的方式，同时它将当前曲目 ID 存储为`track`并默认为`null`。状态默认为`\"paused\"`，用于判断曲目是否正在播放。要切换曲目，我们只需要一个`setTrack`函数，将`track`设置为新的曲目\
    \ ID。当然，播放器需要能够播放音乐，因此需要一个`play`函数；它需要接受一个可选的曲目 ID 作为参数，以便将其添加到音频元素的`src`中。\n\n\
    ```\nvar Player = Backbone.View.extend({\n\n    el : \"#player\",\n\n    track\
    \ : null,\n\n    state : \"paused\",\n\n    initialize: function()  {\n\n    \
    \  this.bind('play', this.play);\n\n      this.bind('pause', this.pause);\n\n\
    \    },\n\n    setTrack : function(track)  {\n\n      this.track = track;\n\n\
    \    },\n\n    play : function(track)  {\n\n      // 如果设置了曲目，则播放新歌。否则播放当前的 src（用于暂停恢复）。\n\
    \n      if (track)  {\n\n        this.setTrack(track);\n\n        $(this.el).attr(\"\
    src\", track.url).appendTo($(this.el).parent());\n\n      }\n\n      $(\"#togglePlaying\"\
    ).html(\"Pause\");\n\n      this.state = \"playing\";\n\n      this.el.play();\n\
    \n    },\n\n    pause : function()  {\n\n      $(\"#togglePlaying\").html(\"Play\"\
    );\n\n      this.state = \"paused\";\n\n      this.el.pause();\n\n    }\n\n  });\n\
    \n  var player = new Player();\n```\n"
- fmt: "### Main App View\n\nOkay, so we have lots of code to make up the basis of\
    \ the app, but currently it will not actually do anything because none of the\
    \ code is linked together. It is this view that is responsible for knowing the\
    \ current playlist as well as managing all interactions between views (and any\
    \ elements that are not in views). Due to the way that there is only ever one\
    \ of each list view on the page, `AppView` handles the list views as singletons\
    \ so that there can ever only be one of each in use.\n\nSo far all we need is\
    \ a basic interface, consisting of elements for each view and two links that are\
    \ used to trigger the prompts for new playlist and add tracks. These elements\
    \ are just HTML elements that can be used in the same way as you would without\
    \ Backbone, the only difference is that we also need to include the dependencies\
    \ (including Backbone) as scripts.\n\n```\n<div id=\"app\">\n  <a id=\"new-playlist\"\
    >New Playlist</a>\n  <a id=\"new-track\">Add Track</a>\n  <ul id=\"playlists\"\
    ></ul>\n  <ul id=\"tracks\"></ul>\n  <div id=\"player-controls\">\n    <a id=\"\
    togglePlaying\">Play</a>\n  </div>\n</div>\n<audio id=\"player\"></audio>\n<script\
    \ src=\"../vendor/jquery.min.js\"></script>\n<script src=\"../vendor/underscore.min.js\"\
    ></script>\n<script src=\"../vendor/backbone.min.js\"></script>\n<script src=\"\
    ../vendor/backbone.localStorage.js\"></script>\n<script src=\"js/app.js\"></script>\n\
    ```\n\nThe data is handled using Underscore’s templating engine. The templates\
    \ are defined within script tags in the main HTML file.\n\n```\n<script type=\"\
    text/template\" id=\"playlist-template\">\n  <li><%= title %></li>\n</script>\n\
    <script type=\"text/template\" id=\"track-template\">\n  <li>\n    <%= title %>\n\
    \    <%= artist %>\n  </li>\n</script>\n```\n\n`AppView` is responsible for handling\
    \ interactions with the DOM; the events are handled in Backbone by defining the\
    \ type of event followed by a selector to find the elements and then a value that\
    \ is the name of the function that should be triggered. The `AppView` will be\
    \ using the models (such as `playlists`) that we created earlier in the chapter.\
    \ You can see how the event listeners are set in the code that follows, as well\
    \ as the structure that we will be using to develop the `AppView`.\n\n```\nvar\
    \ AppView = Backbone.View.extend({\n  el: $(\"#app\"),\n  currentPlaylist: -1,\
    \ // Index of the playlist,\n  trackListView : new TrackListView(),\n  playlistListView\
    \ : new PlaylistListView(),\n  events: {\n    \"click #clear-completed\": \"clearCompleted\"\
    ,\n    \"click #toggle-all\": \"toggleAllComplete\",\n    \"click #new-playlist\"\
    :  \"createPlaylist\",\n    \"click #new-track\":  \"createTrack\",\n    \"click\
    \ #togglePlaying\" : \"togglePlay\"\n  },\n  initialize: function() { },\n  changePlaylist:\
    \ function(id)  { },\n  createPlaylist: function(e) { };\n  createTrack: function(url)\
    \ { },\n  handleDrop: function(e) { },\n  play: function()  { },\n  preventDefault:\
    \ function(e) { },\n  render: function()  { },\n  renderTracks: function() { },\n\
    \  renderPlaylists: function() { },\n  togglePlay: function()  { }\n});\nvar App\
    \ = new AppView;\n```\n\nWithin the `initialize` function we will set up Backbone\
    \ events (as opposed to DOM events) that trigger functions when events have been\
    \ triggered on a model. The first function is `renderPlaylists`, the purpose of\
    \ it is so that whenever the list of playlists needs changing, it can render on\
    \ the `playlistListView` to update the playlists on the page. There is another\
    \ function for rendering called `render`, which is used as a catchall to render\
    \ both playlist and tracks. The render function calls both `renderPlaylists` and\
    \ `renderTracks`. The latter works by making sure the playlist to be rendered\
    \ (the actual tracks within the playlist, that is) has the current id held within\
    \ `currentPlaylist`. However, it should always be correct already because to change\
    \ playlist in the first place we have a `changePlaylist` function that both changes\
    \ the `currentPlaylist` id as well as changing the playlist model for the `trackListView`.\n\
    \n```\nchangePlaylist: function(id)  {\n  this.currentPlaylist = id;\n  this.render();\n\
    },\nrender: function()  {\n  this.renderTracks();\n  this.renderPlaylists();\n\
    },\nrenderTracks: function() {\n  if (this.currentPlaylist != -1)  {\n    var\
    \ current = playlists.get(this.currentPlaylist);\n    this.trackListView.trigger('changePlaylist',\
    \ current);\n  }\n},\nrenderPlaylists: function() {\n  this.playlistListView.trigger('render');\n\
    }\n```\n\nWe are now left with two more functions to create—the functions for\
    \ adding new playlists and tracks. It is very simple to create a new playlist,\
    \ because we can get the playlist name through a prompt and then just create a\
    \ new playlist using Backbones’ `create` function on the `playlists` collection.\
    \ For the `createTrack` function, however, we have quite a lot more work to do.\
    \ We need to get the `trackName`, `trackArtist`, and `trackUrl`, all of which\
    \ we can ask for using prompts, except for when a URL is passed to the function\
    \ (such as for the drag and drop functionality that we will add shortly) in which\
    \ case that URL is used as `trackUrl`. We then need to check whether there is\
    \ a playlist with tracks in it. If a `currentPlaylist` has not been set, then\
    \ we just use the first playlist if any exists. Because the tracks are stored\
    \ within an array inside a model, we have to work around the default Backbone\
    \ behavior a bit as you can replace the array but not add to it. To do so we retrieve\
    \ the current array of tracks and then add the new track to that array. With the\
    \ new track in the array we can overwrite the array in the model with the “new”\
    \ array that includes the track. With that done, it is now time to render the\
    \ tracks to the page.\n\n```\ncreatePlaylist: function(e) {\n  var playlistName\
    \ = prompt(\"Playlist Name\");\n  playlists.create({title: playlistName});\n},\n\
    createPlaylist: function(e) {\n  var playlistName = prompt(\"Playlist Name\");\n\
    \  playlists.create({title: playlistName});\n},\ncreateTrack: function(url) {\n\
    \  var trackName = prompt(\"Track name\");\n  var trackArtist = prompt(\"Track\
    \ artist\");\n  var trackUrl = (typeof(url) === \"string\") ? url : prompt(\"\
    Track url\");\n  if (trackName && playlists.models[0]) {\n    if (this.currentPlaylist===-1)\
    \ this.currentPlaylist = playlists.models[0].id;\n    var tracks = playlists.get(this.currentPlaylist).get(\"\
    tracks\");\n    tracks.push({ title: trackName, artist: trackArtist, url: trackUrl\
    \ });\n    playlists.get(this.currentPlaylist).save({ tracks : tracks});\n   \
    \ this.renderTracks();\n  }\n},\n```"
  raw: '### Main App View


    Okay, so we have lots of code to make up the basis of the app, but currently it
    will not actually do anything because none of the code is linked together. It
    is this view that is responsible for knowing the current playlist as well as managing
    all interactions between views (and any elements that are not in views). Due to
    the way that there is only ever one of each list view on the page, `AppView` handles
    the list views as singletons so that there can ever only be one of each in use.


    So far all we need is a basic interface, consisting of elements for each view
    and two links that are used to trigger the prompts for new playlist and add tracks.
    These elements are just HTML elements that can be used in the same way as you
    would without Backbone, the only difference is that we also need to include the
    dependencies (including Backbone) as scripts.


    `<div id="app">`


    `<a id="new-playlist">New Playlist</a>`


    `<a id="new-track">Add Track</a>`


    `<ul id="playlists"></ul>`


    `<ul id="tracks"></ul>`


    `<div id="player-controls">`


    `<a id="togglePlaying">Play</a>`


    `</div>`


    `</div>`


    `<audio id="player">`


    `<script src="../vendor/jquery.min.js"></script>`


    `<script src="../vendor/underscore.min.js"></script>`


    `<script src="../vendor/backbone.min.js"></script>`


    `<script src="../vendor/backbone.localStorage.js"></script>`


    `<script src="js/app.js"></script>`


    The data is handled using Underscore’s templating engine. The templates are defined
    within script tags in the main HTML file.


    `<script type="text/template" id="playlist-template">`


    `<li><%= title %></li>`


    `</script>`


    `<script type="text/template" id="track-template">`


    `<li>`


    `<%= title %>`


    `<%= artist %>`


    `</li>`


    `</script>`


    `AppView` is responsible for handling interactions with the DOM; the events are
    handled in Backbone by defining the type of event followed by a selector to find
    the elements and then a value that is the name of the function that should be
    triggered. The `AppView` will be using the models (such as `playlists`) that we
    created earlier in the chapter. You can see how the event listeners are set in
    the code that follows, as well as the structure that we will be using to develop
    the `AppView`.


    `var AppView = Backbone.View.extend({`


    `el: $("#app"),`


    `currentPlaylist: -1, // Index of the playlist,`


    `trackListView : new TrackListView(),`


    `playlistListView : new PlaylistListView(),`


    `events: {`


    `"click #clear-completed": "clearCompleted",`


    `"click #toggle-all": "toggleAllComplete",`


    `"click #new-playlist":  "createPlaylist",`


    `"click #new-track":  "createTrack",`


    `"click #togglePlaying" : "togglePlay"`


    `},`


    `initialize: function() { },`


    `changePlaylist: function(id)  { },`


    `createPlaylist: function(e) { };`


    `createTrack: function(url) { },`


    `handleDrop: function(e) { },`


    `play: function()  { },`


    `preventDefault: function(e) { },`


    `render: function()  { },`


    `renderTracks: function() { },`


    `renderPlaylists: function() { },`


    `togglePlay: function()  { }`


    `});`


    `var App = new AppView;`


    Within the `initialize` function we will set up Backbone events (as opposed to
    DOM events) that trigger functions when events have been triggered on a model.
    The first function is `renderPlaylists`, the purpose of it is so that whenever
    the list of playlists needs changing, it can render on the `playlistListView`
    to update the playlists on the page. There is another function for rendering called
    `render`, which is used as a catchall to render both playlist and tracks. The
    render function calls both `renderPlaylists` and `renderTracks`. The latter works
    by making sure the playlist to be rendered (the actual tracks within the playlist,
    that is) has the current id held within `currentPlaylist`. However, it should
    always be correct already because to change playlist in the first place we have
    a `changePlaylist` function that both changes the `currentPlaylist` id as well
    as changing the playlist model for the `trackListView`.


    `changePlaylist: function(id)  {`


    `this.currentPlaylist = id;`


    `this.render();`


    `},`


    `render: function()  {`


    `this.renderTracks();`


    `this.renderPlaylists();`


    `},`


    `renderTracks: function() {`


    `if (this.currentPlaylist != -1)  {`


    `var current = playlists.get(this.currentPlaylist);`


    `this.trackListView.trigger(''changePlaylist'', current);`


    `}`


    `},`


    `renderPlaylists: function() {`


    `this.playlistListView.trigger(''render'');`


    `}`


    We are now left with two more functions to create—the functions for adding new
    playlists and tracks. It is very simple to create a new playlist, because we can
    get the playlist name through a prompt and then just create a new playlist using
    Backbones’ `create` function on the `playlists` collection. For the `createTrack`
    function, however, we have quite a lot more work to do. We need to get the `trackName`,
    `trackArtist`, and `trackUrl`, all of which we can ask for using prompts, except
    for when a URL is passed to the function (such as for the drag and drop functionality
    that we will add shortly) in which case that URL is used as `trackUrl`. We then
    need to check whether there is a playlist with tracks in it. If a `currentPlaylist`
    has not been set, then we just use the first playlist if any exists. Because the
    tracks are stored within an array inside a model, we have to work around the default
    Backbone behavior a bit as you can replace the array but not add to it. To do
    so we retrieve the current array of tracks and then add the new track to that
    array. With the new track in the array we can overwrite the array in the model
    with the “new” array that includes the track. With that done, it is now time to
    render the tracks to the page.


    `createPlaylist: function(e) {`


    `var playlistName = prompt("Playlist Name");`


    `playlists.create({title: playlistName});`


    `},`


    `createPlaylist: function(e) {`


    `var playlistName = prompt("Playlist Name");`


    `playlists.create({title: playlistName});`


    `},`


    `createTrack: function(url) {`


    `var trackName = prompt("Track name");`


    `var trackArtist = prompt("Track artist");`


    `var trackUrl = (typeof(url) === "string") ? url : prompt("Track url");`


    `if (trackName && playlists.models[0]) {`


    `if (this.currentPlaylist===-1) this.currentPlaylist = playlists.models[0].id;`


    `var tracks = playlists.get(this.currentPlaylist).get("tracks");`


    `tracks.push({ title: trackName, artist: trackArtist, url: trackUrl });`


    `playlists.get(this.currentPlaylist).save({ tracks : tracks});`


    `this.renderTracks();`


    `}`


    `},`'
  trans: "\n### 主应用视图\n\n好的，我们已经有了大量构成应用基础的代码，但目前它实际上不会执行任何操作，因为没有任何代码被关联起来。正是这个视图负责了解当前播放列表，以及管理所有视图之间（以及任何不在视图内的元素）的交互。由于页面上的每个列表视图都只有一个实例，`AppView`\
    \ 将列表视图作为单例来处理，因此每个列表视图在应用中最多只能有一个实例在使用。\n\n到目前为止，我们需要的只是一个基础界面，包含每个视图的元素以及用于触发新建播放列表和添加曲目提示的两个链接。这些元素就是普通的\
    \ HTML 元素，其使用方法与不使用 Backbone 时相同，唯一的区别是我们还需要引入依赖关系（包括 Backbone）作为脚本。\n\n```\n\
    <div id=\"app\">\n  <a id=\"new-playlist\">新建播放列表</a>\n  <a id=\"new-track\">添加曲目</a>\n\
    \  <ul id=\"playlists\"></ul>\n  <ul id=\"tracks\"></ul>\n  <div id=\"player-controls\"\
    >\n    <a id=\"togglePlaying\">播放</a>\n  </div>\n</div>\n<audio id=\"player\"\
    ></audio>\n<script src=\"../vendor/jquery.min.js\"></script>\n<script src=\"../vendor/underscore.min.js\"\
    ></script>\n<script src=\"../vendor/backbone.min.js\"></script>\n<script src=\"\
    ../vendor/backbone.localStorage.js\"></script>\n<script src=\"js/app.js\"></script>\n\
    ```\n\n数据使用 Underscore 的模板引擎进行处理。模板定义在主 HTML 文件的 script 标签内。\n\n```\n<script type=\"\
    text/template\" id=\"playlist-template\">\n  <li><%= title %></li>\n</script>\n\
    <script type=\"text/template\" id=\"track-template\">\n  <li>\n    <%= title %>\n\
    \    <%= artist %>\n  </li>\n</script>\n```\n\n`AppView` 负责处理与 DOM 的交互；在 Backbone\
    \ 中，通过定义事件类型，后跟用于查找元素的选择器，再跟一个值（即应触发的函数名称）来处理事件。 `AppView` 将使用我们本章前面创建的模型（例如 `playlists`）。您可以在下面的代码中看到事件监听器是如何设置的，以及我们将用于开发\
    \ `AppView` 的结构。\n\n```\nvar AppView = Backbone.View.extend({\n  el: $(\"#app\"\
    ),\n  currentPlaylist: -1, // 播放列表的索引\n  trackListView : new TrackListView(),\n\
    \  playlistListView : new PlaylistListView(),\n  events: {\n    \"click #clear-completed\"\
    : \"clearCompleted\",\n    \"click #toggle-all\": \"toggleAllComplete\",\n   \
    \ \"click #new-playlist\":  \"createPlaylist\",\n    \"click #new-track\":  \"\
    createTrack\",\n    \"click #togglePlaying\" : \"togglePlay\"\n  },\n  initialize:\
    \ function() { },\n  changePlaylist: function(id)  { },\n  createPlaylist: function(e)\
    \ { };\n  createTrack: function(url) { },\n  handleDrop: function(e) { },\n  play:\
    \ function()  { },\n  preventDefault: function(e) { },\n  render: function() \
    \ { },\n  renderTracks: function() { },\n  renderPlaylists: function() { },\n\
    \  togglePlay: function()  { }\n});\nvar App = new AppView;\n```\n\n在 `initialize`\
    \ 函数内部，我们将设置 Backbone 事件（与 DOM 事件相对），这些事件在模型上触发事件时触发函数。第一个函数是 `renderPlaylists`，其目的是每当播放列表需要更改时，它可以在\
    \ `playlistListView` 上进行渲染以更新页面上的播放列表。还有一个用于渲染的函数叫做 `render`，它被用作一个全捕获函数来同时渲染播放列表和曲目。render\
    \ 函数会调用 `renderPlaylists` 和 `renderTracks`。后者通过确保要渲染的播放列表（即播放列表中的实际曲目）具有存储在 `currentPlaylist`\
    \ 中的当前 id 来工作。然而，它应该始终是正确的，因为要更改播放列表，我们首先有一个 `changePlaylist` 函数，该函数既更改 `currentPlaylist`\
    \ id，也更改 `trackListView` 的播放列表模型。\n\n```\nchangePlaylist: function(id)  {\n  this.currentPlaylist\
    \ = id;\n  this.render();\n},\nrender: function()  {\n  this.renderTracks();\n\
    \  this.renderPlaylists();\n},\nrenderTracks: function() {\n  if (this.currentPlaylist\
    \ != -1)  {\n    var current = playlists.get(this.currentPlaylist);\n    this.trackListView.trigger('changePlaylist',\
    \ current);\n  }\n},\nrenderPlaylists: function() {\n  this.playlistListView.trigger('render');\n\
    }\n```\n\n现在我们只剩下两个函数需要创建——用于添加新播放列表和曲目的函数。创建一个新播放列表非常简单，因为我们可以通过一个提示框获取播放列表名称，然后只需在\
    \ `playlists` 集合上使用 Backbone 的 `create` 函数创建一个新的播放列表即可。然而，对于 `createTrack` 函数，我们需要做更多的工作。我们需要获取\
    \ `trackName`、`trackArtist` 和 `trackUrl`，所有这些我们都可以通过提示框来请求，除非有 URL 被传递给该函数（例如用于我们稍后将添加的拖放功能），在这种情况下，该\
    \ URL 被用作 `trackUrl`。然后，我们需要检查是否存在一个有曲目的播放列表。如果尚未设置 `currentPlaylist`，那么如果存在任何播放列表，我们就只使用第一个。由于曲目存储在模型内的一个数组中，我们需要稍微绕开默认的\
    \ Backbone 行为，因为你可以替换数组，但不能向其中添加。为此，我们检索当前的曲目数组，然后将新曲目添加到该数组中。将新曲目添加到数组后，我们可以用包含该曲目的“新”数组覆盖模型中的数组。完成后，现在是将曲目渲染到页面上的时候了。\n\
    \n```\ncreatePlaylist: function(e) {\n  var playlistName = prompt(\"播放列表名称\");\n\
    \  playlists.create({title: playlistName});\n},\ncreatePlaylist: function(e) {\n\
    \  var playlistName = prompt(\"播放列表名称\");\n  playlists.create({title: playlistName});\n\
    },\ncreateTrack: function(url) {\n  var trackName = prompt(\"曲目名称\");\n  var trackArtist\
    \ = prompt(\"曲目艺术家\");\n  var trackUrl = (typeof(url) === \"string\") ? url :\
    \ prompt(\"曲目 URL\");\n  if (trackName && playlists.models[0]) {\n    if (this.currentPlaylist===-1)\
    \ this.currentPlaylist = playlists.models[0].id;\n    var tracks = playlists.get(this.currentPlaylist).get(\"\
    tracks\");\n    tracks.push({ title: trackName, artist: trackArtist, url: trackUrl\
    \ });\n    playlists.get(this.currentPlaylist).save({ tracks : tracks});\n   \
    \ this.renderTracks();\n  }\n},\n```\n"
- fmt: "### Drag and Drop\n\nIf you stretch your memory back to [Chapter 2](#A978-1-4302-5945-9_2_Chapter.html),\
    \ you will remember that we used drag and drop functionality for the coloring\
    \ book app. Dragging files is quite an obvious way to get a file into the app,\
    \ so it makes sense to use it as a way to add new tracks. This version adds the\
    \ dropped track to the current playlist but I recommend you modify it to try to\
    \ add tracks to a playlist by dropping it on the playlist’s name. I have reworked\
    \ the original code we had in [Chapter 2](#A978-1-4302-5945-9_2_Chapter.html)\
    \ so that you can see how similar it is to use drag and drop functionality on\
    \ other types of files. We start by setting up the event listeners to call `preventDefaults`\
    \ and `handleDrop` as needed. The `handleDrop` function is used to select the\
    \ first file out of the dropped files and forward it to `createTrack`, which is\
    \ the function in the main `App` view that adds the track to the playlist. This\
    \ is a good example of leveraging code that has already been written to easily\
    \ add new functionality! Unfortunately we cannot directly use Backbone events\
    \ because there is (at the time of writing) no way to stop the event bubbling.\
    \ To get the track name and artist I have decided that prompts are the easiest\
    \ way to do it. There are two more opportunities for improving the code here,\
    \ which I encourage you to try, these are to enable multiple file drops and to\
    \ improve the interface so that prompts are not required (or you could perhaps\
    \ try to get the data from the metadata of the file).\n\nIn the `AppView` initialize\
    \ function, we put the event listeners:\n\n```javascript\nwindow.addEventListener('dragover',\
    \ this.preventDefault, false);\nwindow.addEventListener('dragenter', this.preventDefault,\
    \ false);\nwindow.addEventListener('drop', this.handleDrop, false);\n```\n\nWe\
    \ also need the `handleDrop` and `preventDefault` functions in the `AppView`:\n\
    \n```javascript\nhandleDrop: function(e) {\n      e.stopPropagation();\n     \
    \ e.preventDefault();\n      var file = e.dataTransfer.files[0];\n      reader\
    \ = new FileReader();\n      reader.readAsDataURL(file);\n      reader.onload\
    \ = (function(theFile) {\n        return function(e) {\n          App.createTrack(e.target.result);\n\
    \        };\n      })(file);\n    },\n    preventDefault: function(e) {\n    \
    \  if (e.preventDefault) {\n        e.preventDefault();\n      }\n      return\
    \ false;\n    },\n```\n\n### Integrating the Music Creation\n\nLet’s now integrate\
    \ the music creation from the previous chapter so that we can create our own tracks\
    \ to add to the playlists. It sounds like a simple task, and it mostly is, but\
    \ we made the creator work in such a way that the `localStorage` with playlists\
    \ in it will muck it up (because it uses a counter as an id instead of a hash).\
    \ So we need to fix that first!\n\nCurrently the key of each `localStorage` record\
    \ of the music creation app is used within a counter to iterate over and to find\
    \ any particular clipping. This is generally quite a bad approach because if an\
    \ id is removed, then it could break the loop and also, as I just mentioned, it\
    \ does not play well when there are other types of key-value pairs in the storage.\
    \ If you take a look at the `localStorage` that was produced using the Backbone\
    \ plugin, you will see that the keys all have a string prepended as a kind of\
    \ namespace for the key. There is also a single key of the same name as the namespace,\
    \ the value of which is a list (read: `JSON.stringify` — ed array) containing\
    \ each clipping name so that we can still iterate over all the keys by taking\
    \ each name in the array and finding the corresponding key.\n\nWithin the `recordSound`\
    \ function, we need to change it so that the object is now stored correctly with\
    \ the namespace before the key. It also needs to add the key to the value of the\
    \ namespace, as explained, so we need to check whether it exists so that we can\
    \ either add to it or make a new one. Whenever data needs to be accessed, you\
    \ can use `JSON.parse(localStorage[\"clippings-\" + clippingNames[i]])`.\n\n```javascript\n\
    function recordSound(name)  {\n    recorder.exportWAV(function(blob) {\n     \
    \   var object =  {\n            file: window.URL.createObjectURL(blob),\n   \
    \         size: recordEnd - recordStart\n        }\n        if (localStorage[\"\
    clippings\"]) {\n            var clippings = JSON.parse(localStorage[\"clippings\"\
    ]);\n            clippings.push(name);\n            localStorage[\"clippings\"\
    ] = JSON.stringify(clippings);\n        }\n        else  {\n            localStorage[\"\
    clippings\"] = JSON.stringify([name]);\n        }\n        localStorage[\"clippings-\"\
    +name] = JSON.stringify(object);\n        drawTimeline();\n    });\n}\n```\n\n\
    The final version of the keyboard with the changes made can be found in the online\
    \ download available from the Apress website at [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
    \ or my own website at `www.shanehudson.net/javascript-creativity`."
  raw: '### Drag and Drop


    If you stretch your memory back to [Chapter 2](#A978-1-4302-5945-9_2_Chapter.html),
    you will remember that we used drag and drop functionality for the coloring book
    app. Dragging files is quite an obvious way to get a file into the app, so it
    makes sense to use it as a way to add new tracks. This version adds the dropped
    track to the current playlist but I recommend you modify it to try to add tracks
    to a playlist by dropping it on the playlist’s name. I have reworked the original
    code we had in [Chapter 2](#A978-1-4302-5945-9_2_Chapter.html) so that you can
    see how similar it is to use drag and drop functionality on other types of files.
    We start by setting up the event listeners to call `preventDefaults` and `handleDrop`
    as needed. The `handleDrop` function is used to select the first file out of the
    dropped files and forward it to `createTrack`, which is the function in the main
    App view that adds the track to the playlist. This is a good example of leveraging
    code that has already been written to easily add new functionality! Unfortunately
    we cannot directly use Backbone events because there is (at the time of writing)
    no way to stop the event bubbling. To get the track name and artist I have decided
    that prompts are the easiest way to do it. There are two more opportunities for
    improving the code here, which I encourage you to try, these are to enable multiple
    file drops and to improve the interface so that prompts are not required (or you
    could perhaps try to get the data from the metadata of the file).


    In the `AppView` initialize function, we put the event listeners:


    `window.addEventListener(''dragover'', this.preventDefault, false);`


    `window.addEventListener(''dragenter'', this.preventDefault, false);`


    `window.addEventListener(''drop'', this.handleDrop, false);`


    We also need the `handleDrop` and `preventDefault` functions in the `AppView`:


    `handleDrop: function(e) {`


          `e.stopPropagation();`


          `e.preventDefault();`


          `var file = e.dataTransfer.files[0];`


          `reader = new FileReader();`


          `reader.readAsDataURL(file);`


          `reader.onload = (function(theFile) {`


            `return function(e) {`


              `App.createTrack(e.target.result);`


            `};`


          `})(file);`


        `},`


        `preventDefault: function(e) {`


          `if (e.preventDefault) {`


            `e.preventDefault();`


          `}`


          `return false;`


        `},`


    ### Integrating the Music Creation


    Let’s now integrate the music creation from the previous chapter so that we can
    create our own tracks to add to the playlists. It sounds like a simple task, and
    it mostly is, but we made the creator work in such a way that the `localStorage`
    with playlists in it will muck it up (because it uses a counter as an id instead
    of a hash). So we need to fix that first!


    Currently the key of each `localStorage` record of the music creation app is used
    within a counter to iterate over and to find any particular clipping. This is
    generally quite a bad approach because if an id is removed, then it could break
    the loop and also, as I just mentioned, it does not play well when there are other
    types of key-value pairs in the storage. If you take a look at the `localStorage`
    that was produced using the Backbone plugin, you will see that the keys all have
    a string prepended as a kind of namespace for the key. There is also a single
    key of the same name as the namespace, the value of which is a list (read: `JSON.stringifiy`’ed
    array) containing each clipping name so that we can still iterate over all the
    keys by taking each name in the array and finding the corresponding key.


    Within the `recordSound` function, we need to change it so that the object is
    now stored correctly with the namespace before the key. It also needs to add the
    key to the value of the namespace, as explained, so we need to check whether it
    exists so that we can either add to it or make a new one. Whenever data needs
    to be accessed, you can use `JSON.parse(localStorage["clippings-" + clippingNames[i]])`.


      `function recordSound(name)  {`


        `recorder.exportWAV(function(blob) {`


            `var object =  {`


                `file: window.URL.createObjectURL(blob),`


                `size: recordEnd - recordStart`


            `}`


            `if (localStorage["clippings"]) {`


                `var clippings = JSON.parse(localStorage["clippings"]);`


                `clippings.push(name);`


                `localStorage["clippings"] = JSON.stringify(clippings);`


            `}`


            `else  {`


                `localStorage["clippings"] = JSON.stringify([name]);`


            `}`


            `localStorage["clippings-"+name] = JSON.stringify(object);`


            `drawTimeline();`


        `});`


    `}`


    The final version of the keyboard with the changes made can be found in the online
    download available from the Apress website at [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)
    or my own website at `www.shanehudson.net/javascript-creativity`.'
  trans: "\n### 拖放功能\n\n如果你回忆一下第 2 章的内容，应该还记得我们在涂色书应用中使用过拖放功能。拖拽文件是让文件进入应用最直观的方式之一，因此将其用于添加新音轨也合情合理。当前版本会将拖入的音轨添加到当前播放列表中，但我建议你进行修改，尝试通过将音轨拖放到播放列表名称上来将其添加到指定列表。我重构了第\
    \ 2 章中的原始代码，旨在展示在其他类型文件上使用拖放功能的相似性。首先，我们设置事件监听器，按需调用`preventDefaults`和`handleDrop`。`handleDrop`函数用于从拖放的文件中选取第一个文件，并转发给`createTrack`——即主`App`视图中负责将音轨添加到播放列表的函数。这是利用已有代码轻松添加新功能的一个绝佳范例！遗憾的是，我们无法直接使用\
    \ Backbone 事件，因为（在撰写本文时）尚无法阻止事件冒泡。为获取音轨名称和艺术家信息，我认为使用提示框是最简单的方法。此处代码还有两处可优化之处，建议你尝试实现：一是支持拖放多个文件，二是改进界面，避免使用提示框（或者你也可以尝试从文件的元数据中获取信息）。\n\
    \n在 `AppView` 的初始化函数中，我们放置事件监听器：\n\n```javascript\nwindow.addEventListener('dragover',\
    \ this.preventDefault, false);\nwindow.addEventListener('dragenter', this.preventDefault,\
    \ false);\nwindow.addEventListener('drop', this.handleDrop, false);\n```\n\n我们还需要在\
    \ `AppView` 中添加 `handleDrop` 和 `preventDefault` 函数：\n\n```javascript\nhandleDrop:\
    \ function(e) {\n      e.stopPropagation();\n      e.preventDefault();\n     \
    \ var file = e.dataTransfer.files[0];\n      reader = new FileReader();\n    \
    \  reader.readAsDataURL(file);\n      reader.onload = (function(theFile) {\n \
    \       return function(e) {\n          App.createTrack(e.target.result);\n  \
    \      };\n      })(file);\n    },\n    preventDefault: function(e) {\n      if\
    \ (e.preventDefault) {\n        e.preventDefault();\n      }\n      return false;\n\
    \    },\n```\n\n### 集成音乐创作功能\n\n现在我们来集成上一章中的音乐创作功能，这样我们就可以创建自己的音轨并添加到播放列表中。这听起来像是简单的任务，事实也基本如此，但之前我们让创作者的工作方式导致包含播放列表的\
    \ `localStorage` 会出问题（因为它使用计数器而非哈希值作为 ID）。所以我们需要先修复这个问题！\n\n当前，音乐创作应用中每条 `localStorage`\
    \ 记录的键是通过计数器来遍历和查找特定剪贴片段的。这种方法通常很糟糕，因为如果某个 ID 被移除，可能会破坏循环；而且，正如我刚才提到的，当存储中存在其他类型的键值对时，它也无法很好地工作。如果你查看使用\
    \ Backbone 插件生成的 `localStorage`，会发现所有键都带有一个作为命名空间前缀的字符串。此外，还有一个与命名空间同名的键，其值是一个列表（即经过\
    \ `JSON.stringify` 处理的数组），包含所有剪贴片段的名称，这样我们就可以通过遍历数组中的每个名称来找到对应的键，从而实现对所有键的迭代。\n\
    \n在 `recordSound` 函数中，我们需要进行修改，使得对象在存储时键前面正确带上命名空间。同时，还需要像之前解释的那样，将键添加到命名空间的值中。因此我们需要检查命名空间是否存在，以便追加新键或创建新的命名空间。当需要访问数据时，可以使用\
    \ `JSON.parse(localStorage[\"clippings-\" + clippingNames[i]])`。\n\n```javascript\n\
    function recordSound(name)  {\n    recorder.exportWAV(function(blob) {\n     \
    \   var object =  {\n            file: window.URL.createObjectURL(blob),\n   \
    \         size: recordEnd - recordStart\n        }\n        if (localStorage[\"\
    clippings\"]) {\n            var clippings = JSON.parse(localStorage[\"clippings\"\
    ]);\n            clippings.push(name);\n            localStorage[\"clippings\"\
    ] = JSON.stringify(clippings);\n        }\n        else  {\n            localStorage[\"\
    clippings\"] = JSON.stringify([name]);\n        }\n        localStorage[\"clippings-\"\
    +name] = JSON.stringify(object);\n        drawTimeline();\n    });\n}\n```\n\n\
    包含上述修改的最终版键盘代码，可在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
    \ 或我个人的网站 `www.shanehudson.net/javascript-creativity` 提供的在线下载资源中找到。\n"
- fmt: '### Music Visualization


    Most of what we have gone through so far has rules, such as design patterns or
    music theory. This step does not. You can think of music visualization as an art,
    most of the mathematics we use are loosely based on concepts such as trigonometry
    from which we can fiddle the numbers to make the visualization look interesting.
    I have been very inspired by Steven Wittens ([`http://www.acko.net`](http://www.acko.net/))
    who has been active in this space by writing articles, speaking at conferences,
    and creating demos that all use math to create interesting effects. For this section
    I have modified Steven’s js1k entry to use with the music player, because he has
    already written an in-depth article ([`http://acko.net/blog/js1k-demo-the-making-of`](http://acko.net/blog/js1k-demo-the-making-of))
    about it which I highly recommend reading!


    The visualization, shown in Figure [6-2](#A978-1-4302-5945-9_6_Chapter.html#Fig2),
    is a 2D canvas with curved lines on which squares move along to the tempo of the
    music. Because it is based on Steven’s article, I will not go into too much detail
    but I would like to pick out some of the key aspects that can often be used in
    other projects so first take a look at the full code listing for `visualizer.js`.
    I have tried to clean the code up but because it was originally created to be
    very well optimized, there are still some parts that may not use best practices.


    ![A978-1-4302-5945-9_6_Fig2_HTML.jpg](A978-1-4302-5945-9_6_Fig2_HTML.jpg)


    *Figure 6-2. Music visualization while playing Bassa Island Game Loop by Kevin
    MacLeod*


    ```

    // Polyfill for RequestAnimationFrame

    (function() {

    var requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame
    ||

    window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;

    window.requestAnimationFrame = requestAnimationFrame;

    })();


    function visualizer() {

    w = $(''#visualizer'').width();

    h = $(''#visualizer'').height();

    g = $(''#visualizer'')[0].getContext("2d");

    ratio = w / h;

    g.globalCompositeOperation = "lighter";

    g.scale(w / 2 / ratio, h / 2);

    g.translate(ratio, 1);

    lw = 45 / h;

    a = r = d = 0;

    Xt = Yt = Zt = Xi = Yi = Zi = x = y = z = X = Y = Z = frames = 0;

    lastPointVisible = false;

    time = u = -8;

    requestAnimationFrame(draw);

    }


    function draw() {

    freqData = new Uint8Array(analyser.frequencyBinCount);

    analyser.getByteFrequencyData(freqData);

    if (!$("#player")[0].paused)  {

    var average = getAverage(freqData);

    console.log(average);

    //console.log(freqData);

    if (average > 0)  {

    for (frames = 0; frames < 70; frames++) {

    Xt = (average/100) * 18 - 9;

    Yt = (average/100) * 18 - 9;

    Zt = (average/100) * 18 - 9;

    }

    Xi = interpolate(Xi, Xt);

    Yi = interpolate(Yi, Yt);

    Zi = interpolate(Zi, Zt);

    X  = interpolate(X,  Xi);

    Y  = interpolate(Y,  Yi);

    Z  = interpolate(Z,  Zi);

    yaw   = Math.atan2(Z, -X * 2);

    pitch = Math.atan2(Y * 2, Math.sqrt(X * X + Z * Z));

    time += 0.05;

    g.clearRect(-ratio, -1, 2 * ratio, 2);

    for (i = 16; i; --i) {

    v = 0;

    for (pointIndex = 45; pointIndex;) {

    pointIndex--;

    offset = time - pointIndex * 0.03 - i * 3;

    longitude = Math.cos(offset + Math.sin(offset * 0.31)) * 2

    + Math.sin(offset * 0.83) * 3 + offset * 0.02;

    latitude = Math.sin(offset * 0.7) - Math.cos(3 + offset * 0.23) * 3;

    distance = Math.sqrt(pointIndex+.2);

    z = Math.cos(longitude) * Math.cos(latitude) * distance;

    y = Math.sin(longitude) * Math.cos(latitude) * distance;

    z = Math.sin(latitude) * distance;

    x -= X; y -= Y; z -= Z;

    x2 = x * Math.cos(yaw) + z * Math.sin(yaw);

    y2 = y;

    z2 = z * Math.cos(yaw) - x * Math.sin(yaw);

    x3 = x2;

    y3 = y2 * Math.cos(pitch) + z2 * Math.sin(pitch);

    z3 = z2 * Math.cos(pitch) - y2 * Math.sin(pitch);

    h = !pointIndex;

    g.lineWidth = lw * (2 + h) / z3;

    x = x3 / z3;

    y = y3 / z3;

    g.lineTo(x,y);

    distance = Math.round(45 - pointIndex) * (1 + h + Math.max(0, Math.sin(time *
    6 - pointIndex / 8) - .95) * 70);

    g.strokeStyle = "rgb(" + Math.round(distance * (Math.sin(h + i + time * .15) +
    1)) + "," + Math.round(distance * (h + Math.sin(i - 1) + 1)) + "," + Math.round(distance
    * (h + Math.sin(i - 1.3) + 1)) + ")";

    if (z3 > 0.1) {

    if (lastPointVisible) {

    g.stroke();

    }

    else {

    lastPointVisible = true;

    }

    }

    else {

    lastPointVisible = false;

    }

    g.beginPath();

    g.moveTo(x,y);

    }

    }

    }

    }

    requestAnimationFrame(draw);

    }


    function getAverage(freqData)  {

    var average = 0;

    for (var i = 0; i < freqData.length; i++)  {

    average += freqData[i];

    }

    average = average / freqData.length;

    return average;

    }


    function interpolate(a,b) {

    return a + (b-a) * 0.04;

    }

    ```


    The beginning is just setup code like we usually use for canvas, grabbing the
    context and the dimensions. After these lines however is a very powerful line
    of code, `g.globalCompositeOperation = "lighter"`. If you have experience with
    computer graphics on a technical level or have used blending modes in Photoshop
    (or another graphics package), then you will have an idea of what this does. Composite
    operations are a form of compositing (alongside clipping) that are used for manipulating
    (based on a number of commonplace algorithms) multiple shapes depending on how
    they overlap. The composite operators themselves are known as Porter-Duff operators
    (after their inventors) but have slightly different names when used with canvas.
    There are many composite operations. Here we are using `lighter`, which just makes
    any overlapped area of shapes so that the color is a lighter blend of the overlapped
    shapes. The default is `source-over`. Table [6-1](#A978-1-4302-5945-9_6_Chapter.html#Tab1)
    is a full list of available operations (from the canvas spec):


    *Table 6-1.*


    | Operation Name | Porter-Duff Operator | Description |

    | --- | --- | --- |

    | `source-atop` | A atop B | Display the source image wherever both images are
    opaque. Display the destination image wherever the destination image is opaque
    but the source image is transparent. Display transparency elsewhere. |

    | `source-in` | A in B | Display the source image wherever both the source image
    and destination image are opaque. Display transparency elsewhere. |

    | `source-out` | A out B | Display the source image wherever the source image
    is opaque and the destination image is transparent. Display transparency elsewhere.
    |

    | `source-over` | A over B | Display the source image wherever the source image
    is opaque. Display the destination image elsewhere. This is the default operation.
    |

    | `destination-atop` | B atop A | Same as `source-atop` but using the destination
    image instead of the source image and vice versa. |

    | `destination-in` | B in A | Same as `source-in` but using the destination image
    instead of the source image and vice versa. |

    | `destination-out` | B out A | Same as `source-out` but using the destination
    image instead of the source image and vice versa. |

    | `destination-over` | B over A | Same as `source-over` but using the destination
    image instead of the source image and vice versa. |

    | `lighter` | A plus B | Display the sum of the source image and destination image,
    with color values approaching 255 (100%) as a limit. |

    | `copy` | A (B is ignored) | Display the source image instead of the destination
    image. |

    | `xor` | A xor B | Exclusive OR of the source image and destination image. |'
