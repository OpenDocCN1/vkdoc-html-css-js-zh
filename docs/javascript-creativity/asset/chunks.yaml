  trans: '

    ### 浏览器兼容性


    首先要检查的是你的浏览器是否支持所使用的功能。如果你曾在生产环境中使用过任何现代技术，这一点应该已经很熟悉了，因为许多用户仍在使用的浏览器并不支持这些功能。当然，在这种情况下，你应该以“渐进增强”的方式编写代码，让现代浏览器获得现代功能，同时不破坏老旧浏览器。不过，在本书中（因为本书涉及的是前沿技术和功能），我不支持老旧浏览器，而且在编写代码时，这些代码常常只在一两种浏览器上有效。除非另有说明，我都是使用
    Google Chrome 31 测试所有代码。大多数代码在 Mozilla Firefox 中应该也能运行。


    如今浏览器发展迅速，事实上，在我写这本书期间，Chrome 将 Webkit 分支成了 Blink，这已经影响了相关规范，因为它们不再总是同意走同一条路。因此，我们需要一种方法来了解不同版本的浏览器何时更改了实现。遗憾的是，除了查看变更日志或问题追踪器之外，没有其他方法能知道某些内容是否已被更改。幸运的是，由于两个开源项目，我们确实能知道新功能何时添加（这对大多数情况来说已经足够）：[`www.html5please.com`](http://www.html5please.com/)
    和 [`www.caniuse.com`](http://www.caniuse.com/)。HTML5 Please 用于轻松了解是否推荐在生产环境中使用某项功能，而
    Can I Use 用于了解某项功能在哪些浏览器中得到支持。


    ### JavaScript 控制台


    每个浏览器都有不同的开发者工具，有些相似，有些则完全不同，但所有浏览器的一个共同点是 JavaScript 控制台。所有错误都会记录在这里，但它通常远比仅仅作为错误日志强大得多。我将从
    Google Chrome 的角度来讨论它，但大多数浏览器都有非常相似的命令。


    #### 访问变量


    你常常会想知道某个变量的值，以便验证它是否符合预期，或者仅仅是为了了解数据的结构（尤其是对象）。要实现这一点，只需在 JavaScript 控制台中输入变量名，其值就会显示在名称下方。这对于包括对象和数组在内的所有类型都有效。有几种通过控制台访问变量的方法：


    - 代码运行后 – 如果你只对最终结果感兴趣，只需按照我上面解释的方法输入变量名即可。

    - 断点 – 我稍后会详细讨论断点，但与其他许多语言中的调试器一样，你可以添加一个断点，以便在断点处的代码被执行时检查变量。

    - 调试器语句 – 你可以在代码中手动添加断点，只需在代码中写入 `debugger`;。通常使用断点更容易，但了解 `debugger` 语句也是很有价值的。

    - 代码内部 – 你可以从代码内部记录到控制台。通常使用断点更容易，但如果愿意，你也可以在代码内通过写入 `console.log(''foo'');` 来记录。

    - 以表格形式 – 目前这仅在 Google Chrome 和 Firebug 中可用，但它是一种将数组以表格数据形式查看（每个索引对应一行）的非常有用的方法。通过运行
    `console.table(array);`，无论是从代码内部还是从控制台内部（我建议在断点期间直接从控制台运行，因为它与其他浏览器不兼容）都可以实现。


    #### 提示符


    控制台中可供输入的区域被称为提示符，因为它的使用方式与 shell（命令行）提示符非常相似。这对于访问控制台 API（如 `console.log` 和 `console.table`）非常有用。但它也更加强大，因为它可以计算表达式。这些表达式可以是简单计算（结果会立即输出），也可以是与你当前所在页面更相关的内容，例如修改
    DOM。实际上，你可以在提示符中编写任何 JavaScript，这使其成为调试中不可或缺的工具，因为你可以，例如，将一个未能按预期工作的函数提取出来并加以修改，而不影响脚本的其余部分。


    ### 源代码


    与控制台一样，大多数 JavaScript 调试工具（浏览器内和/或插件）都提供查看源代码的方式——这很合理，因为你通常需要查看代码才能理解和调试它——但它不仅仅是只读的。这些工具允许你逐行操作和调试代码。在
    Google Chrome 中，它位于“Sources”选项卡下，尽管大多数功能在其他大多数工具中也是可用的。


    #### 实时编辑


    有时你想要编写一行代码或测试一个函数，这正是提示符的用途；但有时你想要多次更改代码本身，并查看它如何影响整个代码库。与其使用提示符或反复在文本编辑器中保存，你可以进入源代码选项卡并直接编辑代码。这将在
    JavaScript 虚拟机的新实例中运行代码，以便你可以测试和调试所有需要的内容，而不会覆盖原始文件（覆盖后需刷新，且你可能丢失有用的代码等）。


    #### 断点


    你可能已经熟悉基本的断点了，无论是通过使用 JS 开发者工具还是之前的编程语言。它是开发者工具包中最有用的工具之一。在代码视图（Chrome 中的 Sources
    选项卡）中，你可以通过点击行号来添加断点，这会在该行留下一个标记（即断点）。正如我之前解释的，这种默认类型的断点会暂停 JavaScript 的执行，并允许你查看当前状态，包括变量的值。还有其他几种类型的断点，并非所有调试器都能处理所有类型的断点，这些断点在不同的情况下可能非常有用。


    ![A978-1-4302-5945-9_1_Fig1_HTML.jpg](img/A978-1-4302-5945-9_1_Fig1_HTML.jpg)


    图 1-1.


    添加条件断点


    - **DOM 断点**：这些断点允许你在发生更改（例如修改属性或移除元素）时暂停代码。在 Chrome 中，可以通过右键单击 DOM 节点，然后选择“Break
    on…”下列出的选项之一来找到。

    - **异常**：你常常会遇到代码设置了抛出异常的情况，但与其在代码中处理它，不如正确地调试它并找出导致异常的原因。与其为每个异常设置断点（这很快就会变得烦人），你可以将调试器设置为在“所有异常”或“仅未捕获的异常”时暂停。在
    Chrome 中，通过点击带有六边形背景的暂停按钮来访问此功能。颜色会根据其设置的模式而变化。

    - **事件**：可以为事件被触发时设置断点，例如 `click` 或 `mousemove`，这对于确保事件在应该触发的地方被触发并执行预期操作非常有用。在
    Chrome 中，这些断点位于 Sources 面板下的 Event Listener Breakpoints 标题下。

    - **条件断点**：这与默认断点相同，只是你可以设置断点暂停的条件，其工作方式与在 `if` 语句中设置断点相同。在我看来，这是最有用的断点类型，因为你可以用它只在结果不符合预期时暂停代码。要放置条件断点，请右键单击行号，它会给你一个文本字段来输入条件，如图
    1-1 所示。

    '
- fmt: '### Timeline


    So far we have discussed functionality in debuggers that allow you to fix code
    and make sure it is working as you would expect it to. Sometimes however, getting
    the code to work is the easy bit—making it fast is often far harder. We are still
    on the subject of debuggers but now rather than inspecting to make sure each part
    of the code is working, we instead need to record the entire process so that we
    can spot patterns in performance (looking at the overall running of the code rather
    than each individual function/line). This is a subject that could easily fill
    an entire book, so I will go over the basics and it should give you a good starting
    point for figuring out how to understand and improve the performance.


    In Chrome, the tool that we use to measure performance of the code is the timeline.
    I should note that the network pane is also related, as it lets us see which resources
    are causing a delay. But I’m going to focus on the running of the code rather
    than the resources, because it is more likely that you have experience with resources
    (on a normal website) than with performance testing of the code (crucial for the
    more creative of web apps).


    To start using the timeline, you need to record the running of the code by clicking
    the circle button. As soon as it starts recording you will notice that some graphs
    are created. There are (at the time of writing) three aspects that are recorded:
    Events, Frames, and Memory; all these are recorded simultaneously but can only
    be viewed separately by selecting them. At the basic level, these features give
    you a good way to test the speed of parts of your code because it breaks down
    the code like a stack, showing you each function call. This is a fairly easy way
    to find bottlenecks, but it only really scratches the surface of what the timeline
    can do.


    Rather than just showing the amount of time the function takes, it also splits
    it into loading, scripting, rendering, and painting. These are extremely useful
    for knowing why a function is taking longer than it should. The loading category
    is where any XHR (AJAX) calls are made as well as parsing the HTML. The logic
    within the function is included in the scripting category. Rendering is where
    the DOM manipulation takes place, primarily recalculating styles and layout. Paint
    is where the browser updates what is being shown to match the outcome of the rendering,
    including any changes on canvas and other elements that are not directly DOM related.


    In [Chapter 2](#A978-1-4302-5945-9_2_Chapter.html), we use canvas for a simulation
    of birds flocking (known as Boids) and so I have recorded that using the timeline
    to show you how it works. Figure [1-2](#A978-1-4302-5945-9_1_Chapter.html#Fig2)
    shows the events timeline, useful for timing functions and visually seeing the
    stack that they produce. There are only two different colors shown in the screenshots.
    This is because there are very few DOM elements due to using a canvas and so there
    is no loading and rendering required. The lack of DOM is also the same reason
    for the patterns within the timeline, if we were recording performance of a regular
    website, then we might see changes on scrolling or hovering over a button; so
    the timeline is definitely powerful for more than canvas animations! Figure [1-3](#A978-1-4302-5945-9_1_Chapter.html#Fig3)
    shows the frames timeline. This measures the Frames Per Second (FPS) of the page
    because a low FPS can make a site or animation look ”janky” instead of the smooth
    experience that people expect. The third screenshot of this section, Figure [1-4](#A978-1-4302-5945-9_1_Chapter.html#Fig4),
    shows the memory timeline; you can see from the spikes that the memory stores
    more and more until the garbage collector comes along and clears the memory that
    is storing old data. You will notice that there is quite a lot of whitespace below
    the timeline. This space is for a graph showing the amount of DOM nodes and event
    handlers (as you can see in Figure [1-5](#A978-1-4302-5945-9_1_Chapter.html#Fig5),
    which shows the timeline for a basic portfolio website I once made).


    ![A978-1-4302-5945-9_1_Fig5_HTML.jpg](A978-1-4302-5945-9_1_Fig5_HTML.jpg)


    **Figure 1-5.** A memory timeline showing DOM elements rendering on a portfolio
    website


    ![A978-1-4302-5945-9_1_Fig4_HTML.jpg](A978-1-4302-5945-9_1_Fig4_HTML.jpg)


    **Figure 1-4.** Showing Chrome Developer Tools’ memory timeline


    ![A978-1-4302-5945-9_1_Fig3_HTML.jpg](A978-1-4302-5945-9_1_Fig3_HTML.jpg)


    **Figure 1-3.** Showing Chrome Developer Tools’ frames timeline


    ![A978-1-4302-5945-9_1_Fig2_HTML.jpg](A978-1-4302-5945-9_1_Fig2_HTML.jpg)


    **Figure 1-2.** Showing Chrome Developer Tools’ events timeline


    ### Canvas Profiles


    The timeline is an incredibly powerful tool, but when it comes to debugging a
    canvas animation it can often feel like guess work (because most animations are
    scripted to be dynamic, we don’t really know what each function is actually doing).
    Luckily, there is a brand new tool in Chrome Developer Tools that lets you capture
    a canvas frame (at the time of writing it is still only in the Canary version
    of Chrome). It is available under the Profiles tab (you may need to enable the
    experiment under the developer tools’ settings).


    A captured frame profile is very similar to a breakpoint, except instead of pausing
    the code it records a frame and allows you to step through each call that is made.
    This is incredibly powerful because it lets you see the exact order of execution
    and shows the state of the canvas at that particular step, as shown in Figure
    [1-6](#A978-1-4302-5945-9_1_Chapter.html#Fig6).


    ![A978-1-4302-5945-9_1_Fig6_HTML.jpg](A978-1-4302-5945-9_1_Fig6_HTML.jpg)


    **Figure 1-6.** Capturing a canvas frame


    ## Summary


    This opening chapter has hopefully prepared you for the rest of the book. I am
    a strong believer that you cannot learn by purely reading a book, so I have written
    in such a way that I hope to guide you to different techniques and ways of learning
    about each subject rather than writing a ”how to” book. So the debugging section
    of this chapter should be very useful to you throughout the rest of the book because
    debugging isn’t just about fixing broken code, it is about exploring how the code
    actually works and how you can improve it.


    # 2. Canvas and Animation Basics


    In the world of interactivity, a simple animation can be both a great introduction
    to learning as well as effective for conveying messages to the user. Many people
    believe that all interactive features on websites are games, but this just is
    not true! I hope that from this chapter you will gain an insight of how you can
    do something a little bit differently—how to stand out from the standard websites
    with professional animations.


    There are many ways we can add animation these days, with the ever-more impressive
    HTML and CSS technologies, including: transforms, canvas, and SVG. I focus on
    canvas as it is used heavily throughout the book, though you should feel comfortable
    using all three and understand the pros and cons of each. In brief, you can think
    of canvas as raster and SVG as vector, with transforms used to manipulate DOM
    elements.'
