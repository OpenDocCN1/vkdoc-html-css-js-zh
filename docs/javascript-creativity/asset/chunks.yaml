- fmt: '# Music Theory


    This book is not about music theory, but in order to complete this project and
    to understand (or at least use) the `Web Audio API` it is quite important to understand
    the basics of music theory. Music is sound, and random sound is just noise, but
    since music is not noise, what makes music special? There are a number of aspects
    of music that are used to separate music from noise. These aspects include rhythm
    and tempo, but more importantly (from our point of view at least) it is the pitch
    and timbre that is at the heart of music, they are the aspects that create the
    instruments themselves. We do not need to be incredible musicians to create a
    tool that can be used for incredible music, we just need to focus on the aspects
    of the instrument itself and in this case our instrument is made using the `Web
    Audio API` and pitch is the frequency of the note.


    So let’s start right at the beginning, what is a note? Simply put, a note is a
    sound wave of a specific wavelength (the frequency that causes the pitch). Notes
    are named alphabetically in order of pitch from A to G (well…sort of), so a D
    is higher than a C. I said sort of because notes actually loop, in octaves, from
    C to C so A is higher than C of the same octave but lower than the C of the octave
    above it. Each frequency can be represented (both linguistically and practically)
    in hertz (`hz`). Due to the position on a piano, the C at frequency `261.63hz`
    is called Middle C and is generally used as the note that calculations are relative
    to. For example, an easy to remember frequency is `440hz` “A above Middle C.”


    Because every octave has the same notes at different frequencies and we already
    know a note is just a frequency itself, there must be a link between each octave
    because otherwise they fundamentally cannot be the same note. This link is ratio;
    each octave has the ratio of `2:1`, so the wavelength of the note is double the
    octave before it. So to go from the A above Middle C to the A below Middle C we
    can simply do `440/2 = 220hz`. This relationship is the fundamental concept behind
    harmony. Each note can be labeled with a number representing the octave, for obvious
    reasons, so for example Middle C is `C3`.


    If you think of a piano, you will remember seeing the black keys spread in a pattern
    above the white keys; these keys are used to play the semitone (or half-step)
    between notes, which have a ratio of `2^(1/12)`. A semitone that is above a note
    will be its sharp, and the semitone below a note is its flat. So `466.16` is known
    as `A#` (A Sharp) or `Bb` (B Flat). These semitones are the most common example
    of “enharmonic equivalents” because they are technically two notes that are identical,
    the only difference being the direction of the music.


    We don’t have a piano, or a guitar, or any other instrument, so how do we plan
    to make music? When I explained what a note is, I called its frequency a wavelength
    because it is generated by sound waves. As you probably know, all sound waves
    are generated through vibrations. So all we need is the final piece of the puzzle,
    an oscillator; this is the basis of all sound synthesis, because it allows us
    to produce sound waves using just a speaker. Sound envelope is a term often used
    in sound synthesis ‘that defines the sound of the wave, the term covers four components
    of sound: attack, decay, sustain, and release. By manipulating the sound envelope,
    you can begin to control the sound. Think of the differences between a piano and
    a triangle, they both have quite a high sustain (that is, they resonance for quite
    a while) but a triangle kind of “dings,” whereas a piano sounds for a lot longer
    (depending of course on how long you play the note) so there is more attack for
    a piano than a triangle. In practice, it is hard to perfectly synthesis any instrument
    due to the amount of physics involved (such as the properties of a wooden piano)
    but by manipulating each note it gives you a way to attempt to replicate the sound
    of music through simply oscillating a waveform of your choosing.


    Each sound wave has a shape (waveform) that visually represents the amplitude
    of the note over time, this has a lot of physics that we do not need to be concerned
    with but basically the amplitude is how the speaker needs to move to produce the
    sound. There are four basic waveforms, which make the basis of all sounds (see
    Figure [5-1](#A978-1-4302-5945-9_5_Chapter.html#Fig1)).


    ![A978-1-4302-5945-9_5_Fig1_HTML.jpg](A978-1-4302-5945-9_5_Fig1_HTML.jpg)


    Figure 5-1. Examples of waveforms. [`https://en.wikipedia.org/wiki/File:Waveforms.svg`](https://en.wikipedia.org/wiki/File:Waveforms.svg)


    The four waveforms are


    *   Sine wave: This curved line follows the shape of the mathematical function
    sine.

    *   Square wave: A square wave is similar to binary, in that it is either at one
    frequency or the other.

    *   Triangle wave: The triangle wave is similar to the sine wave but is less smooth.
    This results in quite a sharp sound.

    *   Sawtooth wave: These waves are a combination of all the previous waves. This
    wave has the slow sharp sound of the triangle until it reaches the peak and then
    resets to the original frequency, much like the square wave.'
