    # 1. 引言


    在本书中，我们将深入探索 HTML5 与现代 JavaScript 的“兔子洞”，沿途涉猎众多不同主题。我们将从 `canvas` 开始（许多读者可能已经很熟悉它了），并利用它完成两个示例：一个群集动画应用和一个涂色书应用。每一章都会展示每个主题如何在现实世界中落地；HTML5
    和 JavaScript 如何协同工作，创建实用的应用程序，而不仅仅用于制作游戏或酷炫演示（尽管它也能为此提供助力）。本书分为三个主要项目，并在行文中穿插了其他示例。每个示例（尤其是主要项目）都力求成为你探索和实验的良好起点，因为尽管结构化学习的书籍很有用，但没有什么比亲自动手编写代码更好的了。


    在结束 `canvas` 章节后，我们将于第 3 章深入探讨如何在网页上使用音频和视频；这一章主要聚焦于 Web Audio API，以及音频和视频的 HTML
    元素。该 API 功能极其强大，因此本章仅作简要介绍，主要关注音频可视化，这与第 2 章以 `canvas` 作为图形基础的内容衔接得很好。随后我们将转向
    3D 图形，探索网页上 3D 技术的基础。我决定使用广受欢迎的 `Three.js` 库来处理 WebGL，因为纯 WebGL 的“着色器代码”相当复杂，且与
    C 语言非常相似。第 4 章沿途包含了多个示例，但主要示例是一个 3D 节点图，展示了电影与演员/女演员之间的关系。我选择这个示例是因为数据可视化是一项极其有用的技术，也是我深感兴趣的领域之一；同时，它也能很好地展示这些新技术如何让我们在网页上实现原生功能。


    在第 5 章中，我们将稍微偏离主线，进入音乐理论的领域，因为第一个主要项目将是一个包含 3D 可视化和音乐创作的音乐播放器；这将把截至目前的各章内容很好地串联起来。本章大量建立在第
    3 章对 Web Audio API 的介绍之上，不过，这里并非进行可视化，而是生成声音（希望这能作为音乐创作的一个起点）。当然，与所有章节一样，这仅是对一个庞大领域的管窥，因此我力求使其成为一个良好的起点，而非全面的指南。第
    3 章中的音乐理论部分，是本书得名《JavaScript 创造力》的原因之一；本书并非关于设计，甚至不局限于 `canvas` 能做什么——而是关于将 Web
    技术创造性地应用于博客或在线商店之外的更多领域。


    音乐播放器项目将在第 6 章中整合完成。我使用 `Backbone` 来绑定所有数据，当然，你也可以将其转换，改用 `Ember` 甚至 ES6 等其他工具。


    下一个项目涵盖第 7 章和第 8 章。该项目是一个使用 WebRTC 和 `Node.js` 的视频聊天应用。第 7 章将简要介绍如何使用 `Node.js`
    构建一个基于文本的聊天室，第 8 章将较为深入地探讨 WebRTC 的工作原理及使用方法。这对许多人来说将是一个有用的章节，因为视频聊天是人们（尤其是一些企业内部）想要实现的常见项目。该项目还介绍了
    `getUserMedia`，这将是最后一个项目（第 9 章和第 10 章）所需的基础，该最后一个项目涉及使用网络摄像头进行运动和物体检测。


    物体检测在 Web 行业并非特别常见的领域，但这一直是我的兴趣所在；既然我们现在已经拥有了访问网络摄像头的原生能力（甚至还有更复杂的技术，如 Web Workers——尽管本书不会使用它们），那么我在
    Web 上做计算机视觉也就顺理成章了！最后一个涉及物体检测的项目可能不如其他项目实用，但更有趣，希望能为任何对此感兴趣的人提供一个完美的起点，同时也展示 Web
    平台真正强大的能力。大多数计算机视觉算法都基于数学，令人困惑，因此我选择了朴素算法（易于理解但存在许多未处理的边界情况），同时也使用了一个库来处理更高级的物体检测，这样你可以在不受学术轰炸的情况下获得入门体验。


    最后一个项目将各章节串联起来。它是一个实时的、多用户参与的、由计算机生成并由手势控制的音乐乐队。这是一个雄心勃勃的项目，绝非完美。它是练习本书所有内容的好方法，而且（我希望）是一个有趣且独特的项目。生成的音乐不会很动听，可能会有延迟，音效也不佳，但我认为它是本书完美的结尾；毕竟，本书的主要目的是让你参与到那些你可能从未想过的项目中去！


    ## 你需要了解的知识


    现在你已经知道了我们将随本书展开的旅程，那么能够顺利启程就很重要了。本书的定位是要求读者具备一定的 JavaScript 实用知识。这基本属实，但本书的编写方式使得，尽管某些代码相当复杂，但任何有一定编程背景的人应该都能较为轻松地理解。


    **注意**


    本章将专注于基础知识，即调试，因此大多数读者可能想直接跳到第 2 章，了解 `canvas` 的介绍。


    ### CSS


    我只想说，本书预期读者了解 CSS，但这并非必需。我在某些章节中会使用 CSS 来设计页面部分元素的样式，但我倾向于将重点放在全书代码上，因此设计上未做打磨，CSS
    的使用也极少。即使你不懂 CSS 也能顺利完成阅读，但请注意，如果我在某些地方使用了 CSS，也不会进行解释。


    ### 调试


    至少在我看来，调试是程序员最好的技能，因为代码经常不能按预期工作（尤其是在不同浏览器之间），即使它能工作，也总有改进的空间。本书中的大部分代码依赖于前沿技术，许多规范甚至在我在撰写本书期间就已经发生了变化——因此，如果任何内容无法工作，可能是由于我编写代码之后实现方式已发生改变，或者你使用的浏览器不支持该功能。

    '
- fmt: '### Browser Compatibility


    The first thing to check is whether your browser is compatible with the features
    being used. This is something you should already be familiar with if you’ve ever
    used any modern technologies in production because many users still use browsers
    that do not support it. Of course, in this case you should be writing code in
    a “progressive enhancement” way so that the modern browsers get the modern features
    but it does not break the older browsers. However, throughout this book (because
    it is about cutting-edge technologies and features) I do not support older browsers
    and quite often at the time of writing the code only works in one or two browsers.
    Unless otherwise stated, I test all the code using Google Chrome 31. Most of it
    should also work in Mozilla Firefox.


    The browsers change rapidly these days, in fact while I was writing the book Chrome
    forked Webkit into Blink and it has already affected specifications because they
    no longer always agree to go the same route. So what we need is a way to know
    when different versions of browsers change the implementation. Unfortunately,
    apart from looking through the change logs or bug tracker, there is no way to
    know if something has been changed. Luckily, we do know when features are added
    (which is enough for the majority of cases) due to two open source projects: [`www.html5please.com`](http://www.html5please.com/)
    and [`www.caniuse.com`](http://www.caniuse.com/) . HTML5 Please is used to easily
    know if using a feature in production is recommended, and Can I Use is used to
    know in which browsers a feature is supported.


    ### JavaScript Console


    Every browser has different developer tools, some are similar and some quite different
    but one similarity that all browsers have is the JavaScript Console. This is where
    all errors are logged, but it is often much more powerful than just an error log.
    I discuss it from a Google Chrome viewpoint, but most browsers have very similar
    commands.


    #### Access to Variables


    Often you will want to know a variable’s value so that you can verify it is what
    you would expect or even just to learn how the data is structured (especially
    for objects). To do this, simply type the name of the variable into the JavaScript
    console and the value will be output below the name, this works for all types
    including objects and arrays. There are a few ways to access the variables via
    the console:


    - After the code has run – If you are only interested in the final outcome, just
    do as I explained above and type the variable name.

    - Breakpoint – I will discuss breakpoints in more detail shortly but as with debuggers
    in many other languages, you are able to add a breakpoint that allows you to examine
    the variables at the point that the code at the breakpoint is executed.

    - Debugger Statements – You can manually add breakpoints in your code by writing
    `debugger`; in your code. It is generally easier to use breakpoints, but worth
    knowing about the `debugger` statement.

    - Inside the code – You can log to the console from within the code. It is usually
    easier to use breakpoints but if you wish to you can log by writing `console.log(''foo'');`
    within the code.

    - As a table – This is currently only available in Google Chrome and Firebug but
    it is a very useful way to view arrays as tabular data where each index is a row.
    By running `console.table(array);` from either within the code or within the console
    (I would recommend straight from console, during a breakpoint, since it is not
    compatible with other browsers).


    #### Prompt


    The area that you are able to type into within the console is known as the prompt,
    since it is used in much the same way as a shell (command line) prompt is used.
    This is very useful for accessing the console API, such as `console.log` and `console.table`.
    But it is also far more powerful, since it can evaluate expressions. These could
    be as basic as simple calculation (the answer gets outputted straight away) or
    something more specific to the page you’re on such as modifying the DOM. In fact,
    you can write any JavaScript within the prompt, which makes it an invaluable tool
    for debugging since you can for example take a function that is not working as
    you would expect it to and modify it without affecting the rest of the script.


    ### Sources


    As with the console, most JavaScript debugging tools (within browsers and/or plugins)
    have a way to view the source code – which makes sense since you usually need
    to see the code to understand and debug it – but it is not just read-only. These
    tools allow you to manipulate and debug the code line by line. In Google Chrome,
    it is found under the ‘Sources’ tab, although most of the features are available
    in most other tools too.


    #### Live Editing


    Sometimes you want to be able to write a line of code or test out a function,
    that is what the prompt is for, but sometimes you want to change the code itself
    a variety of times and to see how it does affect the rest of the codebase. Rather
    than using the prompt or repeatedly saving in your text editor, you can go into
    the source tab and directly edit the code. This will run it in a new instance
    of the JavaScript Virtual Machine so that you can test and debug all you need
    to without overwriting the original file (which would then need to be refreshed,
    and you may lose useful code et cetera).


    #### Breakpoints


    You are likely already familiar with basic breakpoints, either from using JS developer
    tools or a previous language. It is one of the most useful tools in a developer’s
    toolkit. While in code view (sources tab in Chrome) you can add a breakpoint by
    clicking the line count, which leaves a marker (the breakpoint). As I explained
    earlier, this default type of breakpoint pauses the JavaScript and allows you
    to see the current state, including the values of the variables. There are a few
    other types of breakpoints and not all debuggers can deal with all types of breakpoints,
    which can be useful in different situations.


    ![A978-1-4302-5945-9_1_Fig1_HTML.jpg](A978-1-4302-5945-9_1_Fig1_HTML.jpg)


    Figure 1-1.


    Adding a conditional breakpoint


    - **DOM breakpoints**: These let you pause the code for changes such as modification
    of an attribute or removal of an element. In Chrome this can be found by right-clicking
    a DOM node and selecting one of the options listed under Break on….

    - **Exceptions**: Quite often you will have code that is set up to throw an exception
    but rather than handling it in the code, you will want to debug it properly and
    figure out what caused the exception. Instead of having breakpoints on every exception,
    which soon gets annoying, you can set the debugger to pause on either all exceptions
    or just uncaught exceptions. In Chrome this is accessed by clicking the pause
    button that has a hexagonal background. The color changes dependent on which mode
    it is set to.

    - **Events**: Breakpoints can be set for when an event gets triggered, such as
    `click` or `mousemove`, which can be very useful for making sure events are triggered
    where they should be and that they do as expected. In Chrome, these are available
    from the sources panel under the Event Listener Breakpoints heading.

    - **Conditional breakpoints**: These are the same as the default breakpoint except
    that you can set conditions on which the breakpoint pauses, which work the same
    way as if you put a breakpoint within an `if` statement. These are, in my opinion,
    the most useful kind of breakpoint because you can use them to only pause the
    code when the results are not what you would expect them to be. To place a conditional
    breakpoint, right-click the line count and it will give you a text field to type
    the condition as shown in Figure [1-1](#A978-1-4302-5945-9_1_Chapter.html#Fig1).'
