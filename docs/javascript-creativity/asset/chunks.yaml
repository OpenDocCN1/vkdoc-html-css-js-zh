  trans: "\n### 频率可视化\n\n我们可以用整本书来制作看起来很棒但不太实用的有趣游戏或随机动画；相反，让我们来看看将 Web Audio API\
    \ 和 canvas 结合使用时，我们能制作出什么样的工具。这个示例将展示频率可视化，下一个示例将是声谱图。首先，我们使用 `getByteFrequencyData`\
    \ 的原始输出来创建一个简单的条形图风格的可视化效果，展示归一化后的频率（由于数值上限为 255，这使其易于绘图）。为此，我们需要设置变量来引用音频和 canvas\
    \ 元素，以及它们各自的上下文和一个分析器节点。我还建议像之前一样设置音量控制，这样你就能看到可视化效果如何随音量变化（同时也方便你调低音量！），我觉得这相当有趣。对于节点，我们需要将音频源连接到音量节点，音量节点再连接到分析器，最后输出到扬声器（目标设备）。\n\
    \n```\nvar audioEle = document.querySelector('audio');\nvar audioCtx = new AudioContext();\n\
    var canvasEle = document.querySelector('canvas');\nvar canvasCtx = canvasEle.getContext('2d');\n\
    var analyser = audioCtx.createAnalyser();\nvar source = audioCtx.createMediaElementSource(audioEle);\n\
    var volumeControl = audioCtx.createGainNode();\nsource.connect(volumeControl);\n\
    volumeControl.connect(analyser);\nanalyser.connect(audioCtx.destination);\n```\n\
    \n现在，我们需要在之前使用的 `volumeChange` 函数旁边，添加 `logic` 和 `draw` 两个函数。在 `logic` 函数中，我们只需获取频率数据并将其传递给\
    \ `draw` 函数，由它绘制到 canvas 上。我认为使用细线进行可视化效果不错，但你可以通过修改 x 位置（我选择了 `i` 表示当前频率，这意味着它们彼此相邻）和宽度（我保持为\
    \ 1 以保持细线）来改变。当然，你需要记得调用 `logic`，为此我使用了 `setInterval`。\n\n```\nfunction volumeChange()\
    \  {\n  volumeControl.gain.value = audioEle.volume;\n}\n\nfunction logic()  {\n\
    \  var freqData = new Uint8Array(analyser.frequencyBinCount);\n  analyser.getByteFrequencyData(freqData);\n\
    \n  requestAnimationFrame(function() {\n    draw(freqData);\n  });\n}\n\nfunction\
    \ draw(freqData)  {\n  canvasCtx.clearRect(0, 0, canvasEle.width, canvasEle.height);\n\
    \  canvasCtx.fillStyle = \"#ff0000\";\n  for (var i = 0; i < freqData.length;\
    \ i++) {\n    canvasCtx.fillRect(i, canvasEle.height, 1, canvasEle.height - freqData[i]);\n\
    \  }\n}\n\nsetInterval(logic, 1000/60);\n```\n\n图 3-1 展示了音频播放时频率可视化的结果。\n\n![A978-1-4302-5945-9_3_Fig1_HTML.jpg](img/A978-1-4302-5945-9_3_Fig1_HTML.jpg)\n\
    \n图 3-1.\n\n这是频率可视化效果\n\n> **注意**  \n> 你可能会看到一面红色；这很可能是由于音量被静音了。调高音量以获得正确的可视化效果。\n\
    \n这些内容应该都很好理解，因为我们已经讲解过每一个概念，比如音频处理节点和 canvas 绘制。你可以在清单 3-1 以及本书附带的文件中找到这段代码。\n\
    \n### 清单 3-1. 频率可视化代码\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Chapter\
    \ 3 – Frequency Visualisation</title>\n</head>\n<body>\n<audio controls onvolumechange=\"\
    volumeChange();\">\n<source src='../audio.ogg' type='audio/ogg; codecs=vorbis'>\n\
    <source src='../audio.mp3' type='audio/mpeg'>\n</audio>\n<canvas>Canvas is not\
    \ supported by your browser</canvas>\n<script src=\"script.js\"></script>\n</body>\n\
    </html>\n\n// Pollyfill for AudioContext\n(function() {\n  window.AudioContext\
    \ = window.AudioContext || window.webkitAudioContext;\n  var requestAnimationFrame\
    \ = window.requestAnimationFrame || window.mozRequestAnimationFrame ||\n    window.webkitRequestAnimationFrame\
    \ || window.msRequestAnimationFrame;\n  window.requestAnimationFrame = requestAnimationFrame;\n\
    })();\n\nvar audioEle = document.querySelector('audio');\nvar audioCtx = new AudioContext();\n\
    var canvasEle = document.querySelector('canvas');\nvar canvasCtx = canvasEle.getContext('2d');\n\
    var analyser = audioCtx.createAnalyser();\nvar source = audioCtx.createMediaElementSource(audioEle);\n\
    var volumeControl = audioCtx.createGainNode();\n\nsource.connect(volumeControl);\n\
    volumeControl.connect(analyser);\nanalyser.connect(audioCtx.destination);\n\n\
    //audioEle.addEventListener('onvolumechange', volumeControl, false);\n\nfunction\
    \ volumeChange()  {\n  volumeControl.gain.value = audioEle.volume;\n}\n\nfunction\
    \ logic()  {\n  var freqData = new Uint8Array(analyser.frequencyBinCount);\n \
    \ analyser.getByteFrequencyData(freqData);\n\n  requestAnimationFrame(function()\
    \ {\n    draw(freqData);\n  });\n}\n\nfunction draw(freqData)  {\n  canvasCtx.clearRect(0,\
    \ 0, canvasEle.width, canvasEle.height);\n  canvasCtx.fillStyle = \"#ff0000\"\
    ;\n  for (var i = 0; i < freqData.length; i++) {\n    canvasCtx.fillRect(i, canvasEle.height,\
    \ 1, canvasEle.height - freqData[i]);\n  }\n}\n\nsetInterval(logic, 1000/60);\n\
    ```\n"
- fmt: "### Spectrogram\n\nWith our previous visualization you can easily see the\
    \ frequencies and the way the audio changes, but only at any given time. Now we\
    \ are going to use a spectrogram, which shows how the audio changes over time,\
    \ where the x axis is time, y is part of the audio, and the color is frequency.\
    \ This is used for a number of things from simply nice patterns to speech recognition.\
    \ Because a spectrogram is similar to the previous visualization, with the extra\
    \ dimension of time, we might as well work from our existing code. One event that\
    \ I would like to now introduce is `onaudioprocess`. The event is part of a `JavaScriptNode`,\
    \ created using the following line:\n\n```\nvar logger = audioCtx.createJavaScriptNode(analyser.frequencyBinCount,\
    \ 1, 1);\n```\n\nThe `onaudioprocess` event works at the same speed as the audio\
    \ is playing, allowing it to be the perfect replacement to `setInterval` for audio\
    \ logic (in the same way we use `requestAnimationFrame` to render at a more accurate\
    \ and dynamic speed for animation). Let’s also create a variable called `x` that\
    \ will hold the current position in time, so that we know how many iterations\
    \ to draw until we hit the current position.\n\n```\nvar logger = audioCtx.createJavaScriptNode(analyser.frequencyBinCount,\
    \ 1, 1);\n\nlogger.onaudioprocess = function () {\n  logic();\n}\n\nvar x = 0;\n\
    \nfunction logic() {\n  if(!audioEle.paused) {\n    x += 1;\n    var freqData\
    \ = new Uint8Array(analyser.frequencyBinCount);\n    analyser.getByteFrequencyData(freqData);\n\
    \    requestAnimationFrame(function() {\n      draw(freqData);\n    });\n  }\n\
    }\n```\n\nHere is the code for that, you can see that it is very similar to our\
    \ early code except that it uses `onaudioprocess` and checks that the element\
    \ is not paused. Both of these are improvements you could make to our previous\
    \ code; I just didn’t want to chuck everything in at once. We now just need to\
    \ draw our visualization! But where to start? Simple—we start with trying to work\
    \ out what we are doing. In this case, we want to draw individual columns where\
    \ each pixel represents the frequency (normalized) as a color. To do this we will\
    \ be using HSL instead of RGB, because it allows us to set the hue as a number\
    \ between 0 and 255 (which is exactly what we get from `getByteFrequencyData`)\
    \ rather than requiring each color to be specified. Once it has drawn every column\
    \ on the canvas, I will be clearing it and carrying on from the beginning as if\
    \ turning a new page, you may want to improve this by sliding rather than clearing.\n\
    \n```\nfunction draw(freqData) {\n  if (x > canvasEle.width) {\n    canvasCtx.clearRect(0,\
    \ 0, canvasEle.width, canvasEle.height);\n    x = 0;\n  }\n  for (var i = 0; i\
    \ < freqData.length; i++) {\n    canvasCtx.fillStyle = \"hsl(\" + freqData[i]\
    \ + \",100%, 50%)\";\n    canvasCtx.fillRect(x, canvasEle.height - i, 1, 1);\n\
    \  }\n}\n```\n\nYou should now understand how we can take the frequency data and\
    \ produce a variety of visualizations, and they don’t have to be just purely decorative\
    \ either. Figure [3-2](#A978-1-4302-5945-9_3_Chapter.html#Fig2) shows how the\
    \ spectrogram looks after some audio has been played. As always, the full code\
    \ can be found in the download that accompanies this book.\n\n![A978-1-4302-5945-9_3_Fig2_HTML.jpg](A978-1-4302-5945-9_3_Fig2_HTML.jpg)\n\
    \n**Figure 3-2.** This shows the spectrogram\n\n> **Note** As with the previous\
    \ example, you may see a wall of red; this is probably due to the volume being\
    \ muted. Turn up the volume to get the correct visualization.\n\nListing 3-2 shows\
    \ the complete code required for the Spectrogram, it can also be found in the\
    \ download for the book.\n\n**Listing 3-2. Code for the Spectrogram**\n\n```\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>Chapter 3 - Spectrogram</title>\n</head>\n\
    <body>\n<audio controls onvolumechange=\"volumeChange();\">\n<source src='../audio.ogg'\
    \ type='audio/ogg; codecs=vorbis'>\n<source src='../audio.mp3' type='audio/mpeg'>\n\
    </audio>\n<canvas>Canvas is not supported by your browser</canvas>\n<script src=\"\
    script.js\"></script>\n</body>\n</html>\n\n// Pollyfill for AudioContext\n(function()\
    \ {\n  window.AudioContext = window.AudioContext || window.webkitAudioContext\
    \ || window.mozAudioContext;\n  var requestAnimationFrame = window.requestAnimationFrame\
    \ || window.mozRequestAnimationFrame ||\n  window.webkitRequestAnimationFrame\
    \ || window.msRequestAnimationFrame;\n  window.requestAnimationFrame = requestAnimationFrame;\n\
    })();\n\nvar audioEle = document.querySelector('audio');\nvar audioCtx = new AudioContext();\n\
    var canvasEle = document.querySelector('canvas');\nvar canvasCtx = canvasEle.getContext('2d');\n\
    var analyser = audioCtx.createAnalyser();\nanalyser.smoothingTimeConstant = 0;\n\
    var logger = audioCtx.createJavaScriptNode(analyser.frequencyBinCount, 1, 1);\n\
    var source = audioCtx.createMediaElementSource(audioEle);\nvar volumeControl =\
    \ audioCtx.createGainNode();\nsource.connect(volumeControl);\nvolumeControl.connect(analyser);\n\
    analyser.connect(audioCtx.destination);\nlogger.connect(audioCtx.destination);\n\
    //audioEle.addEventListener('onvolumechange', volumeControl, false);\nlogger.onaudioprocess\
    \ = function () {\n  logic();\n}\nfunction volumeChange() {\n  volumeControl.gain.value\
    \ = audioEle.volume;\n}\nvar x = 0;\nfunction logic() {\n  if(!audioEle.paused)\
    \ {\n    x += 1;\n    var freqData = new Uint8Array(analyser.frequencyBinCount);\n\
    \    analyser.getByteFrequencyData(freqData);\n    requestAnimationFrame(function()\
    \ {\n      draw(freqData);\n    });\n  }\n}\nfunction draw(freqData) {\n  if (x\
    \ > canvasEle.width) {\n    canvasCtx.clearRect(0, 0, canvasEle.width, canvasEle.height);\n\
    \    x = 0;\n  }\n  for (var i = 0; i < freqData.length; i++) {\n    canvasCtx.fillStyle\
    \ = \"hsl(\" + freqData[i] + \",100%, 50%)\";\n    canvasCtx.fillRect(x, canvasEle.height\
    \ - i, 1, 1);\n  }\n}\n```\n\n### Web Audio API Nodes\n\nWe have used a few Web\
    \ Audio API nodes already such as `MediaElementSource`, `GainNode`, and `Analyser`.\
    \ Here is an overview of the other nodes and methods available.\n\n| Name of Node\
    \ | Description |\n| --- | --- |\n| `AnalyserNode` | Obtains data about the current\
    \ state of audio, such as frequencies. |\n| `AudioBufferSourceNode` | Buffers\
    \ short audio assets to be used as temporary but easy to access storage. |\n|\
    \ `BiquadFilterNode` | Processes basic filters (known as low-level filters), such\
    \ as low/high pass, where frequencies are cutoff either below or above the given\
    \ value. |\n| `ChannelSplitterNode` | Splits each channel so that you can use\
    \ them within the process graph separately for a finer control. |\n| `ChannelMergerNode`\
    \ | Merges any channels that have been split (or otherwise need merging) using\
    \ this merger node. |\n| `ConvolverNode` | Applies a linear convolution effect,\
    \ which is how sound can be manipulated to simulate acoustic space or a high-quality\
    \ effect. |\n| `DelayNode` | Delays the output (to the next node in the process\
    \ graph) by a specific amount of time. |\n| `GainNode` | Changes the volume of\
    \ audio by multiplying the audio by the gain attribute. |\n| `MediaElementAudioSourceNode`\
    \ | Allows you to connect a media element to the Web Audio API. |\n| `PannerNode`\
    \ | Specializes sound in a 3d space. This is usually used heavily within games,\
    \ but may be useful elsewhere too. |\n| `WaveShaperNode` | Used for non-linear\
    \ distortion. |"
