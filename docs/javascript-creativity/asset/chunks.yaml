    \ = light.position;\nscene.add(lightDebug);\n```\n\n使用这种方法的一种方式——我更喜欢这种方式，而且我知道很多其他人也经常使用这种技术——是将球体做得非常小，这样你既能看到它，它又看起来更像是动画的一部分，而不是调试模式。\n"
- fmt: '#### Materials


    You have seen a few materials used and mentioned, such as `Phong`, `Lambert`,
    and `Basic`—but what are they? Each type of material specifies the type of shading
    that is used. This is based on real-life materials and the differences between
    them, such as a plastic bottle appears different than a shiny can under the same
    lighting due to reflection, transparency, and so on. It is not possible to model
    the exact conditions we find in real life, but we can get quite close by modifying
    some properties and by using different shaders. At the time of writing, Three.js
    provides us with the built-in materials shown in Table 4-4.


    Table 4-4. Showing the built-in materials available in Three.js.


    | `LineBasicMaterial` | The `LineBasicMaterial` is used to create straight lines
    that by default are white and 1px wide. |

    | --- | --- |

    | `LineDashedMaterial` | This is similar to the `LineBasicMaterial` but is used
    to create dashed lines that are useful for debugging (though not limited to it),
    as you know it is not meant to be part of the scene. |

    | `MeshBasicMaterial` | Depending on the `wireframe` property (defaults to `false`),
    this material is used to either draw flat or wireframe faces and is not affected
    by lighting. It is commonplace to use this for wireframes over the other materials
    since it has the least overhead. It is also commonly used for applying textures
    (images). |

    | `MeshDepthMaterial` | This material is used to show depth and it is usually
    used in post processing. |

    | `MeshFaceMaterial` | Quite often a shape will require different materials on
    each side, `MeshFaceMaterial` is effectively an array of materials. |

    | `MeshNormalMaterial` | This is a useful material, especially for prototyping,
    since it makes sure each face has a distinctive color and does not require lighting.
    |

    | `ParticleBasicMaterial` | This is the material used by particle systems. The
    color defaults to white. |

    | `ShaderMaterial` | If you would like to write your own shader (which will not
    be covered in this book), then this is the material you can use. It provides properties
    for GLSL such as `fragmentShader`, `vertexShader`, and `uniforms`. |


    There are two materials missing from Table 4-4, `MeshLambertMaterial` and `MeshPhongMaterial`.
    I will tackle these two separately from the list because they are somewhat similar
    and involve a lot of rendering techniques (too much for a list). We have already
    used `Lambert` as a generic 3D material but I didn’t explain what it is. The simple
    explanation of the difference between the two materials, according to the current
    Three.js documentation is:


    - **Lambert**: A material for non-shiny (Lambertian) surfaces, evaluated per vertex.

    - **Phong**: A material for shiny surfaces, evaluated per pixel.


    This is generally enough for you to decide which to use for each situation, but
    I feel a more complete understanding is important and so I will briefly explain
    the technical differences and encourage you to look into them in more detail.


    In computer graphics there are two models—which can both be combined—that determine
    the shading of the object; these are illumination and shading. Illumination uses
    ambient, diffuse, and specular to display light reflected (or refracted) off (or
    through) a surface. The math for shading is complicated, because it cannot be
    reduced to components, basically it shades (that is, works out the brightness)
    the faces using either flat shading or interpolated. The `MeshLambertMaterial`
    uses Gourand shading and Lambert illumination and by default the illumination
    is performed at each vertex and then interpolated across the face. `MeshPhongMaterial`
    uses both Phong shading and Phong illumination models and by default the vertex
    normals are interpolated across the surface and illumination is performed at each
    pixel (or more correctly, texel).


    **Note:** Three.js does not use perfect implementation of the algorithms, so if
    you are particularly interested in the mathematical models, then take that into
    consideration.


    ### Data Visualizations


    That’s enough documentation for now, let’s move on and make something useful.
    There are many types of data visualizations, from basic bar and pie charts to
    detailed globes and even models of solar systems. There are uses for all these,
    usually as a way to present the data to the public but also for data analysis.
    It is a vast subject area and so we will only be touching the surface of what
    you could visualize and how you could do it.


    We could start anywhere, such as basic 3D graphics showing the government’s financial
    data but that will quickly get boring so let’s make a 3D node graph showing actors
    and actresses that have worked with each other (inspired by Six Degrees of Kevin
    Bacon). In this case, our nodes are the actors/actresses and the edges are films.
    I have provided some sample data as JSON to avoid the need to make you sign up
    to an API. This also means I can be more selective about the data because most
    of it is not needed.'
  raw: '#### Materials


    You have seen a few materials used and mentioned, such as Phong, Lambert, and
    Basic`—`but what are they? Each type of material specifies the type of shading
    that is used. This is based on real-life materials and the differences between
    them, such as a plastic bottle appears different than a shiny can under the same
    lighting due to reflection, transparency, and so on. It is not possible to model
    the exact conditions we find in real life, but we can get quite close by modifying
    some properties and by using different shaders. At the time of writing, Three.js
    provides us with the built-in materials shown in Table [4-4](#A978-1-4302-5945-9_4_Chapter.html#Tab4).


    Table 4-4.


    Showing the built-in materials avaiable in Three.js.


    | `LineBasicMaterial` | The `LineBasicMaterial` is used to create straight lines
    that by default are white and 1px wide. |

    | --- | --- |

    | `LineDashedMaterial` | This is similar to the `LineBasicMaterial` but is used
    to create dashed lines that are useful for debugging (though not limited to it),
    as you know it is not meant to be part of the scene. |

    | `MeshBasicMaterial` | Depending on the wireframe property (defaults to false),
    this material is used to either draw flat or wireframe faces and is not affected
    by lighting. It is commonplace to use this for wireframes over the other materials
    since it has the least overhead. It is also commonly used for applying textures
    (images). |

    | `MeshDepthMaterial` | This material is used to show depth and it is usually
    used in post processing. |

    | `MeshFaceMaterial` | Quite often a shape will require different materials on
    each side, `MeshFaceMaterial` is effectively an array of materials. |

    | `MeshNormalMaterial` | This is a useful material, especially for prototyping,
    since it makes sure each face is has a distinctive color and does not require
    lighting. |

    | `ParticleBasicMaterial` | This is the material used by particle systems. The
    color defaults to white. |

    | `ShaderMaterial` | If you would like to write your own shader (which will not
    be covered in this book), then this is the material you can use. It provides properties
    for GLSL such as `fragmentShader`, `vertexShader`, and `uniforms`. |


    There are two materials missing from Table [4-4](#A978-1-4302-5945-9_4_Chapter.html#Tab4),
    `MeshLambertMaterial` and `MeshPhongMaterial`. I will tackle these two separately
    from the list because they are somewhat similar and involve a lot of rendering
    techniques (too much for a list). We have already used Lambert as a generic 3D
    material but I didn’t explain what it is. The simple explanation of the difference
    between the two materials, according to the current Three.js documentation is


    *   Lambert: A material for non-shiny (Lambertian) surfaces, evaluated per vertex.

    *   Phong: A material for shiny surfaces, evaluated per pixel.


    This is generally enough for you to decide which to use for each situation, but
    I feel a more complete understanding is important and so I will briefly explain
    the technical differences and encourage you to look into them in more detail.


    In computer graphics there are two models`—`which can both be combined `—`that
    determine the shading of the object; these are illumination and shading. Illumination
    uses ambient, diffuse, and specular to display light reflected (or refracted)
    off (or through) a surface. The math for shading is complicated, because it cannot
    be reduced to components, basically it shades (that is, works out the brightness)
    the faces using either flat shading or interpolated. The `MeshLambertMaterial`
    uses Gourand shading and Lambert illumination and by default the illumination
    is performed at each vertex and then interpolated across the face. `MeshPhongMaterial`
    uses both Phong shading and Phong illumination models and by default the vertex
    normals are interpolated across the surface and illumination is performed at each
    pixel (or more correctly, texel).


    Note


    Three.js does not use perfect implementation of the algorithms, so if you are
    particularly interested in the mathematical models, then take that into consideration.


    ### Data Visualizations


    That’s enough documentation for now, let’s move on and make something useful.
    There are many types of data visualizations, from basic bar and pie charts to
    detailed globes and even models of solar systems. There are uses for all these,
    usually as a way to present the data to the public but also for data analysis.
    It is a vast subject area and so we will only be touching the surface of what
    you could visualize and how you could do it.


    We could start anywhere, such as basic 3D graphics showing the government’s financial
    data but that will quickly get boring so let’s make a 3D node graph showing actors
    and actresses that have worked with each other (inspired by Six Degrees of Kevin
    Bacon). In this case, our nodes are the actors/actresses and the edges are films.
    I have provided some sample data as JSON to avoid the need to make you sign up
    to an API. This also means I can be more selective about the data because most
