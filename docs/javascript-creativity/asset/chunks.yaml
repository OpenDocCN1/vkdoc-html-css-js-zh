- fmt: "# 10. Interacting with the Browser Using Gestures\n\nThis chapter aims to\
    \ take everything you’ve learned so far and put it all together to make an ambitious\
    \ music creation web app that allows multiple people to play instruments, using\
    \ computer-generated audio, at the same time using just JavaScript, Node.js, and\
    \ some HTML5 APIs. Oh, and it also needs to use the webcam to allow input using\
    \ your fingers in the air.\n\nAs I’m sure you can imagine this is a massive task.\
    \ This chapter gets you to a basic version of it and allows you to extend the\
    \ task however you please. For example, instead of tracking all fingers so that\
    \ you can play the keyboard properly, it will instead have a cursor that you can\
    \ move left or right by pointing in that direction, or pointing in the middle\
    \ to simulate a key press.\n\n## Taking the Keyboard Server-Side\n\nWe base this\
    \ project on the keyboard from [Chapter 5](#A978-1-4302-5945-9_5_Chapter.html).\
    \ Currently, the keyboard is set up so that you can play multiple notes at once\
    \ (which is a good start) but we need to modify it so that multiple people can\
    \ play multiple notes. Of course, even if two people are playing the same note,\
    \ it should only be played once. This is ideal as it means we only need one set\
    \ of oscillators per person, so when person B starts playing a note it will play\
    \ using the set of oscillators that person A is using.\n\nPreviously we turned\
    \ off the oscillator within `stopSound` but this can cause issues with race conditions\
    \ (that is, things done always happen in the order you expect) and since you cannot\
    \ play a stopped oscillator, it is better to delete it (in this case, we will\
    \ set it to null) and create a new one (which we were doing anyway). To make it\
    \ easier to check existence of an oscillator, I’ve changed the array initialization\
    \ loops to set the indexes to null instead of creating new oscillators to begin\
    \ with.\n\n```\n// White Keys\nvar o = new Array(21);\nfor (var i = 0; i < 21;\
    \ i++)  {\n    o[i] = null;\n}\n\n// Black Keys\nvar ob = new Array(15);\nfor\
    \ (var i = 0; i < 15; i++)  {\n    ob[i] = null;\n}\n\nfunction stopSound(i, black)\
    \  {\n    var osc;\n    if (black) {\n        osc = ob[i];\n    } else {\n   \
    \     osc = o[i];\n    }\n    if ((black && ob[i] !== null) || (!black && o[i]\
    \ !== null)) {\n        osc.noteOff(0);\n        osc.disconnect();\n        if\
    \ (black) {\n            ob[i] = null;\n        } else {\n            o[i] = null;\n\
    \        }\n    }\n}\n```\n\nThe `playSound` function now needs to only play a\
    \ new sound if there is no oscillator already on the key; otherwise it will cause\
    \ problems such as not being able to stop it playing or it will only play for\
    \ a short amount of time. I’ve also cleaned it up a little so that the same conditions\
    \ are not checked twice without needing to be. Note that I’ve changed `ctx` to\
    \ `actx`, this is so that it is obviously an Audio Context and to avoid confusion\
    \ with the Canvas Context used for the computer vision.\n\n```\nvar gainNode =\
    \ actx.createGainNode();\ngainNode.connect(actx.destination);\n\nfunction playSound(i,\
    \ black) {\n    if ((black && ob[i] === null) || (!black && o[i] === null)) {\n\
    \        var osc = actx.createOscillator();\n        var freq;\n        if (black)\
    \  {\n            freq = blackNotes[i];\n        }\n        else  {\n        \
    \    freq = whiteNotes[i];\n        }\n        osc.type = 3;\n        osc.frequency.value\
    \ = freq;\n        osc.connect(gainNode);\n        osc.noteOn(0);\n        if\
    \ (black) {\n            ob[i] = osc;\n        } else {\n            o[i] = osc;\n\
    \        }\n    }\n}\n```\n\nSo now the keyboard is set up a little better and\
    \ we can write the server code. Socket.IO allows you to define the structure of\
    \ all communication between the client and server in a very nice way; each message\
