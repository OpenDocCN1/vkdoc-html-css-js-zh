    modifying the x position (I chose i, for current frequency, meaning they are all
    next to each other) and the width (which I kept as 1 to keep thin). Of course
    you need to remember to call `logic`, I have used `setInterval` for this.


    `function volumeChange()  {`


    `volumeControl.gain.value = audioEle.volume;`


    `}`


    `function logic()  {`


    `var freqData = new Uint8Array(analyser.frequencyBinCount);`


    `analyser.getByteFrequencyData(freqData);`


    `requestAnimationFrame(function() {`


