    \ data);\n  });\n\n  // Chatroom messages\n  socket.on('message', function (data)\
    \ {\n    io.sockets.in(room).emit('message', data);\n  });\n\n  // Music\n  socket.on('play_sound',\
    \ function (data) {\n    data.color = socket.color;\n    console.log(\"play sound\
    \ %j\", data);\n    socket.broadcast.to(room).emit('play_sound', data);\n  });\n\
    \n  socket.on('stop_sound', function (data) {\n    console.log(\"stop sound %j\"\
    , data);\n    socket.broadcast.to(room).emit('stop_sound', data);\n  });\n\n \
    \ // Close socket and let others know\n  socket.on('close', function () {\n  \
    \  console.log(\"closed %j\", room);\n    io.sockets.in(room).emit('closed', room);\n\
    \    socket.leave(room);\n  });\n});\n```\n\nOn the client-side we need to both\
    \ send the messages, as well as handle received messages. To begin with, let’s\
    \ set the color. We set a variable called `color` when the `'color'` message is\
    \ received (when you break it down bit by bit, this really is simple!).\n\n```javascript\n\
    socket.on('color', function(data) {\n  color = data;\n})\n```\n\nWhen the play\
    \ or stop messages are received, we need to call the corresponding function; on\
    \ play we also need to set the color of the particular key to be the color that\
