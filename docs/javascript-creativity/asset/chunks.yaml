    `if (navigator.getUserMedia === undefined) {`


    `throw new Error("Browser doesn''t support getUserMedia");`


    `}`


    `var videoElement, canvas, ctx, manip, w, h;`


    `window.addEventListener(''DOMContentLoaded'', setup);`


    `function setup()  {`


    `videoElement = document.querySelector("video");`


    `videoElement.width = w = window.innerWidth;`


    `videoElement.height = h = window.innerHeight;`


    `videoElement.autoplay = true;`


    `canvas = document.querySelector(''canvas'');`


    `canvas.width = w;`


    `canvas.height = h;`


    `ctx = canvas.getContext(''2d'');`


    `navigator.getUserMedia({video: true}, function (stream) {`


    `videoElement.src = window.URL.createObjectURL(stream);`


    `videoElement.addEventListener(''canplay'', draw);`


    `}, function() {});`


    `}`


    `function draw() {`


    `if (videoElement.paused || videoElement.ended) {`


    `return;`


    `}`


    `try  {`


    `ctx.drawImage(videoElement, 0, 0, w, h);`


    `manip = ctx.getImageData(0, 0, w, h);`


    `var data = manip.data;`


    `data = invertFrame(data);`


    `ctx.putImageData(manip, 0, 0);`


    `requestAnimationFrame(draw);`


    `}`


    `catch (e)  {`


    `if (e.name == "NS_ERROR_NOT_AVAILABLE") {`


    `setTimeout(draw, 0);`


    `}`


    `else  {`


    `throw e;`


    `}`


    `}`


    `}`


    `function invertFrame(data)  {`


    `// Iterate through each pixel, inverting it`


    `for (var i = 0; i < data.length; i += 4) {`


    `var r = data[i],`


    `g = data[i+1],`


    `b = data[i+2];`


    `data[i] = 255 - r;`


    `data[i+1] = 255 - g;`


    `data[i+2] = 255 - b;`


    `}`


    `return data;`


    `}`'
  trans: "\n### 视频处理样板代码\n\n到目前为止你可能会注意到，大多数此类项目都遵循类似的模式。这里我快速介绍本章中视频处理代码（即便不是全部，也是绝大部分）将要使用的模式。我们首先为\
    \ `window.URL` 和 `navigator.getUserMedia` 编写一个 shim，本章我决定使用一个变量来调用与浏览器兼容的方法，而不是像上一章那样使用完整的\
    \ polyfill（因为完整的 `WebRTC` 技术栈比 `getUserMedia` 的浏览器支持度更差）。\n\n```\nwindow.URL =\
    \ window.URL || window.webkitURL;\n\nnavigator.getUserMedia  =  navigator.getUserMedia\
    \ ||\n                           navigator.webkitGetUserMedia ||\n           \
    \                navigator.mozGetUserMedia ||\n                           navigator.msGetUserMedia;\n\
    \nif (navigator.getUserMedia === undefined) {\n    throw new Error(\"Browser doesn't\
    \ support getUserMedia\");\n}\n```\n\n现在我们需要设置页面，在本例中，要让视频和 canvas 元素在浏览器窗口内全屏显示。只需将\
    \ video 元素设置为自动播放，获取 canvas 的上下文，并初始化视频流。为了绘制帧，我们连接视频流并添加一个事件监听器，一旦视频准备就绪（例如 `'canplay'`\
    \ 事件），就调用 `draw()`。现在有一个小问题：通常情况下这可以正常工作，但某些版本的 Firefox（编写本书时，这些版本都相当常用）存在一个 bug，会导致\
    \ `drawImage` 在视频帧大小尚未设置之前运行。错误是 `NS_ERROR_NOT_AVAILABLE`，为了避免这个错误，我们可以使用 try\
    \ catch。当然，在生产代码中，无论如何都建议进行彻底的错误处理，所以这不应该是个大问题。\n\n在 try catch 块内，我们需要将 video\
    \ 元素的图像绘制到 canvas 上下文。为了获取可操作的数据，我们需要使用 `ctx.getImageData(0, 0, w, h)` 来获取帧，它有一个\
    \ data 属性可用于检索和修改帧。以下是样板代码。请注意其中有一个注释，指示在何处操作数据。\n\n```\nfunction setup()  {\n\
    \  videoElement = document.querySelector(\"video\");\n  videoElement.width = w\
    \ = window.innerWidth;\n  videoElement.height = h = window.innerHeight;\n  videoElement.autoplay\
    \ = true;\n  canvas = document.querySelector('canvas');\n  canvas.width = w;\n\
    \  canvas.height = h;\n  ctx = canvas.getContext('2d');\n  navigator.getUserMedia({video:\
    \ true}, function (stream) {\n      videoElement.src = window.URL.createObjectURL(stream);\n\
    \      videoElement.addEventListener('canplay', draw);\n  }, function() {});\n\
    }\n\nfunction draw() {\n  if (videoElement.paused || videoElement.ended) {\n \
    \     return;\n  }\n  try  {\n      ctx.drawImage(videoElement, 0, 0, w, h);\n\
    \      manip = ctx.getImageData(0, 0, w, h);\n      var data = manip.data;\n \
    \     // Manipulate the frame by modifying data\n      ctx.putImageData(manip,\
    \ 0, 0);\n      requestAnimationFrame(draw);\n  }\n  catch (e)  {\n      if (e.name\
    \ == \"NS_ERROR_NOT_AVAILABLE\") {\n          setTimeout(draw, 0);\n      }\n\
    \      else  {\n          throw e;\n      }\n  }\n}\n```\n\n### 基础视频处理\n\n你应该还记得，在第\
    \ 3 章中，我们曾通过简单地遍历像素来处理视频，但由于那是本书的开头部分，这里我将快速回顾一下。这次，让我们直接反转像素，这样我们就可以轻松看到处理过程是如何工作的，而不必担心用于创建效果的具体算法。\n\
    \n用于反转帧的函数是 `invertFrame`，它接受 `data` 作为参数。对 `invertFrame` 的调用应放置在样板代码中注释所在的位置，data\
    \ 参数应来自 `data` 变量。请注意，我们将返回 `data` 变量，以便它直接影响样板代码中的 `manip.data`（因为这是实际的帧）。我们首先得到的数据格式是\
    \ `Uint8ClampedArray`。这意味着该数组包含无符号整数（即正数），并且它们被限制为 8 位（一个字节），由于 2⁸ 是 256，因此数组任何索引处的最大值是\
    \ 255（当然，这是从 0 开始计数的结果）。\n\n**注意**\n\n该数组由 RGBA 颜色值组成，因此您应该每遍历四个索引，以获取每种颜色的起始位置。\n\
    \n因此，在遍历数组时，我们从每种颜色的起始位置开始，因此需要（通常，除非您只想查找红色）同时检查绿色和蓝色的索引（分别通过检查 `data[i+1]` 和\
    \ `data[i+2]`）。要反转颜色，我们需要用 255 减去每种颜色的当前值（例如，使白色变成黑色）。\n\n```\nfunction invertFrame(data)\
    \  {\n  // Iterate through each pixel, inverting it\n  for (var i = 0; i < data.length;\
    \ i += 4) {\n    var r = data[i],\n        g = data[i+1],\n        b = data[i+2];\n\
    \n    data[i] = 255 - r;\n    data[i+1] = 255 - g;\n    data[i+2] = 255 - b;\n\
    \  }\n  return data;\n}\n```\n\n请参阅列表 9-1，了解如何将其与样板代码结合使用。\n\n**列表 9-1.**\n\n\
    ```\nwindow.URL = window.URL || window.webkitURL;\n\nnavigator.getUserMedia  =\
    \  navigator.getUserMedia ||\nnavigator.webkitGetUserMedia ||\nnavigator.mozGetUserMedia\
    \ ||\nnavigator.msGetUserMedia;\n\nif (navigator.getUserMedia === undefined) {\n\
    \  throw new Error(\"Browser doesn't support getUserMedia\");\n}\n\nvar videoElement,\
    \ canvas, ctx, manip, w, h;\nwindow.addEventListener('DOMContentLoaded', setup);\n\
    \nfunction setup()  {\n  videoElement = document.querySelector(\"video\");\n \
    \ videoElement.width = w = window.innerWidth;\n  videoElement.height = h = window.innerHeight;\n\
    \  videoElement.autoplay = true;\n  canvas = document.querySelector('canvas');\n\
    \  canvas.width = w;\n  canvas.height = h;\n  ctx = canvas.getContext('2d');\n\
    \  navigator.getUserMedia({video: true}, function (stream) {\n    videoElement.src\
    \ = window.URL.createObjectURL(stream);\n    videoElement.addEventListener('canplay',\
    \ draw);\n  }, function() {});\n}\n\nfunction draw() {\n  if (videoElement.paused\
    \ || videoElement.ended) {\n    return;\n  }\n  try  {\n    ctx.drawImage(videoElement,\
    \ 0, 0, w, h);\n    manip = ctx.getImageData(0, 0, w, h);\n    var data = manip.data;\n\
    \    data = invertFrame(data);\n    ctx.putImageData(manip, 0, 0);\n    requestAnimationFrame(draw);\n\
    \  }\n  catch (e)  {\n    if (e.name == \"NS_ERROR_NOT_AVAILABLE\") {\n      setTimeout(draw,\
    \ 0);\n    }\n    else  {\n      throw e;\n    }\n  }\n}\n\nfunction invertFrame(data)\
    \  {\n  // Iterate through each pixel, inverting it\n  for (var i = 0; i < data.length;\
    \ i += 4) {\n    var r = data[i],\n        g = data[i+1],\n        b = data[i+2];\n\
    \    data[i] = 255 - r;\n    data[i+1] = 255 - g;\n    data[i+2] = 255 - b;\n\
    \  }\n  return data;\n}\n```\n"
- fmt: "# Motion Detection\n\nNow that you have refreshed knowledge of manipulating\
    \ video, let’s dive into our first demonstration of using detecting motion in\
    \ the video. This is a computer vision that is useful despite (in this case) being\
    \ completely naïve, there is no artificial intelligence involved nor particularly\
    \ complicated algorithms. If you think about it, motion detection is simply showing\
    \ the difference between frames. We could make it more complicated by optimizing\
    \ it, detect over a number of frames or to track the motion, but for now let’s\
    \ just find the difference.\n\nIt is quite easy to do this; you take the current\
    \ data and store it so that on the next frame you have both new data and old data.\
    \ Once you have both pieces of data, you can compare the two and find the pixels\
    \ that are different. However, if you do this, you will soon notice that the camera\
    \ doesn’t see everything the same each frame so it will look like there is a lot\
    \ of motion in the background. To get around this, you can use a threshold to\
    \ alter the accuracy. Because we are not using any artificial intelligence, this\
    \ can be an arbitrary number that works well (15 worked well while I was testing).\
    \ In Figure [9-1](#A978-1-4302-5945-9_9_Chapter.html#Fig1), you can see the motion\
    \ of my head as a result of the arbitrary threshold that I used. If we were creating\
    \ an AI, it would attempt to find the most likely pixels to be the kind of motion\
    \ we are looking for, such as the outline of a hand or more simply a bunch of\
    \ pixels rather than a single movement (since nothing we will be interested in\
    \ is the size of a pixel!).\n\nWithin the `try` block, we slightly modify the\
    \ boilerplate code so that it checks `oldData` for being `null` (which should\
    \ be its initial value), if it isn’t, then it manipulates and if it is null, then\
    \ it assigns the current data from `data.manip`.\n\n![A978-1-4302-5945-9_9_Fig1_HTML.jpg](A978-1-4302-5945-9_9_Fig1_HTML.jpg)\n\
    \n**Figure 9-1.** A screenshot showing the rough outline of my face being detected\
    \ as I move\n\n```\nbctx.drawImage(videoElement, 0, 0, w, h);\nmanip = bctx.getImageData(0,\
    \ 0, w, h);\nvar data = manip.data;\nif (oldData != null) {\n    data = motionDetection(data,\
    \ oldData);\n    ctx.putImageData(manip, 0, 0);\n    oldData = null;\n}\nelse\
    \  {\n    oldData = manip.data;\n}\nrequestAnimationFrame(draw);\n```\n\nThe `motionDetection()`\
    \ function works as explained previously; it takes both the current frame’s data\
    \ and the previous (although this could be optimized or more advanced in a variety\
    \ of ways, so it is not necessarily only the previous frame), then compares them\
    \ and draws a red pixel to every pixel that has moved and is within the bounds\
    \ of the threshold.\n\n```\nfunction motionDetection(data, oldData)  {\n    //\
    \ Iterate through each pixel, changing to 255 if it has not changed\n    for(\
    \ var y = 0 ; y < h; y++ ) {\n        for( var x = 0 ; x < w; x++ ) {\n      \
    \      var indexOld = (y * w + x) * 4,\n                    oldr = oldData[indexOld],\n\
    \                    oldg = oldData[indexOld+1],\n                    oldb = oldData[indexOld+2],\n\
    \                    olda = oldData[indexOld+3];\n            var indexNew = (y\
    \ * w + x) * 4,\n                    r = data[indexNew],\n                   \
    \ g = data[indexNew+1],\n                    b = data[indexNew+2],\n         \
    \           a = data[indexNew+3];\n            if (oldr > r - 15 || oldg > g -\
    \ 15 || oldb > b - 15)\n            {\n                data[indexNew] = 255;\n\
    \                data[indexNew+1] = 255;\n                data[indexNew+2] = 255;\n\
    \                data[indexNew+3] = 255;\n                detected = true;\n \
    \           }\n            else\n            {\n                data[indexNew]\
    \ = 255;\n                data[indexNew+1] = 0;\n                data[indexNew+2]\
    \ = 0;\n                data[indexNew+3] = 255;\n            }\n        }\n  \
    \  }\n    return data;\n}\n```\n\n# Motion Tracking\n\nOkay, so detecting motion\
    \ is one thing but, unless you are creating an alarm system or making art, it\
    \ isn’t very useful alone. You usually want to either make the computer clever\
    \ enough to recognize what the object is (especially true for robots) or, more\
    \ often, just know where the same object is—this is called tracking. We produced\
    \ an image that shows motion but it doesn’t make any attempt to group the motion\
    \ as an object. There are a large variety of ways to do this, such as calibrating\
    \ based on color and looking for areas with the correct average color, or you\
    \ could use artificial intelligence and actually train it to look for an object.\n\
    \nWhile color calibration is easier than using AI, it can cause a lot of problems\
    \ and the math soon becomes far too complicated, for just a chapter of a book,\
    \ if you want it to be reliable. So instead we are going to go half way between\
    \ the two methods and use library called `js-objectDetect` (written by Martin\
    \ Tschirsich and found on github at [`https://github.com/mtschirs/js-objectdetect`](https://github.com/mtschirs/js-objectdetect)),\
    \ which is based on the OpenCV object detector and can take already trained classifiers.\
    \ Before we get to the code, let’s look into how the library actually works.\n\
    \n## Haar-like Features\n\nMost image processing algorithms require a way to detect\
    \ features in an image and there are quite a few different ways to do that. The\
    \ most common (due to their use in the Viola-Jones algorithm) are called Haar-like\
    \ features. These are based on the original Haar wavelets that were proposed by\
    \ Alfréd Haar in 1909. A wavelet is a mathematical function that cuts data into\
    \ different frequencies, then it scales and analyzes the data for patterns. It\
    \ is an essential tool for signal processing and provides an alternative, with\
    \ the advantage of being able to scale the data, to the Fourier transform (which\
    \ we used in [Chapter 3](#A978-1-4302-5945-9_3_Chapter.html)). Haar-like features\
    \ can be considered as a more tangible form of Haar wavelets, as you can visualize\
    \ them using different sized black and white rectangles (as shown in Figure [9-2](#A978-1-4302-5945-9_9_Chapter.html#Fig2)).\n\
    \n![A978-1-4302-5945-9_9_Fig2_HTML.jpg](A978-1-4302-5945-9_9_Fig2_HTML.jpg)\n\n\
    **Figure 9-2.** An example of Haar-like features, visualized as black and white\
    \ rectangles\n\nThe reason they are black and white rectangles, as opposed to\
    \ something that resembles the feature they are searching for, is that most objects\
    \ have a common pattern of shadows (such as between an eye and nose). They work\
    \ efficiently by using summed area tables, to produce what is known as an integral\
    \ image, which allows quick lookups of the sum of all the pixels in the rectangle\
    \ without needing to calculate them every time. On their own, Haar-like features\
    \ are not particularly useful but when you use them as part of the Viola-Jones\
    \ algorithm (which uses a moving window to search) then they become essential."
  raw: '### Motion Detection


    Now that you have refreshed knowledge of manipulating video, let’s dive into our
    first demonstration of using detecting motion in the video. This is a computer
    vision that is useful despite (in this case) being completely naïve, there is
    no artificial intelligence involved nor particularly complicated algorithms. If
    you think about it, motion detection is simply showing the difference between
    frames. We could make it more complicated by optimizing it, detect over a number
    of frames or to track the motion, but for now let’s just find the difference.


    It is quite easy to do this; you take the current data and store it so that on
    the next frame you have both new data and old data. Once you have both pieces
    of data, you can compare the two and find the pixels that are different. However,
    if you do this, you will soon notice that the camera doesn’t see everything the
    same each frame so it will look like there is a lot of motion in the background.
    To get around this, you can use a threshold to alter the accuracy. Because we
    are not using any artificial intelligence, this can be an arbitrary number that
    works well (15 worked well while I was testing). In Figure [9-1](#A978-1-4302-5945-9_9_Chapter.html#Fig1),
    you can see the motion of my head as a result of the arbitrary threshold that
    I used. If we were creating an AI, it would attempt to find the most likely pixels
    to be the kind of motion we are looking for, such as the outline of a hand or
    more simply a bunch of pixels rather than a single movement (since nothing we
    will be interested in is the size of a pixel!).


    Within the try block, we slightly modify the boilerplate code so that it checks
    `oldData` for being `null` (which should be its initial value), if it isn’t, then
    it manipulates and if it is null, then it assigns the current data from `data.manip`.


    ![A978-1-4302-5945-9_9_Fig1_HTML.jpg](A978-1-4302-5945-9_9_Fig1_HTML.jpg)


    Figure 9-1.


    A screenshot showing the rough outline of my face being detected as I move


    `bctx.drawImage(videoElement, 0, 0, w, h);`


    `manip = bctx.getImageData(0, 0, w, h);`


    `var data = manip.data;`


    `if (oldData != null) {`


        `data = motionDetection(data, oldData);`


        `ctx.putImageData(manip, 0, 0);`


        `oldData = null;`


    `}`


    `else  {`


        `oldData = manip.data;`


    `}`


    `requestAnimationFrame(draw);`


    The `motionDetection` function works as explained previously; it takes both the
    current frame’s data and the previous (although this could be optimized or more
    advanced in a variety of ways, so it is not necessarily only the previous frame),
    then compares them and draws a red pixel to every pixel that has moved and is
    within the bounds of the threshold.


    `function motionDetection(data, oldData)  {`


        `// Iterate through each pixel, changing to 255 if it has not changed`


        `for( var y = 0 ; y < h; y++ ) {`


            `for( var x = 0 ; x < w; x++ ) {`


                `var indexOld = (y * w + x) * 4,`


                        `oldr = oldData[indexOld],`


                        `oldg = oldData[indexOld+1],`


                        `oldb = oldData[indexOld+2],`


                        `olda = oldData[indexOld+3];`


                `var indexNew = (y * w + x) * 4,`


                        `r = data[indexNew],`


                        `g = data[indexNew+1],`


                        `b = data[indexNew+2],`


                        `a = data[indexNew+3];`


                `if (oldr > r - 15 || oldg > g - 15 || oldb > b - 15)`


                `{`


                    `data[indexNew] = 255;`


                    `data[indexNew+1] = 255;`


                    `data[indexNew+2] = 255;`


                    `data[indexNew+3] = 255;`


                    `detected = true;`


                `}`


                `else`


                `{`


                    `data[indexNew] = 255;`


                    `data[indexNew+1] = 0;`


                    `data[indexNew+2] = 0;`


                    `data[indexNew+3] = 255;`


                `}`


            `}`


        `}`


        `return data;`


    `}`


    ## Motion Tracking


    Okay, so detecting motion is one thing but, unless you are creating an alarm system
    or making art, it isn’t very useful alone. You usually want to either make the
    computer clever enough to recognize what the object is (especially true for robots)
    or, more often, just know where the same object is—this is called tracking. We
    produced an image that shows motion but it doesn’t make any attempt to group the
    motion as an object. There are a large variety of ways to do this, such as calibrating
    based on color and looking for areas with the correct average color, or you could
    use artificial intelligence and actually train it to look for an object.


    While color calibration is easier than using AI, it can cause a lot of problems
    and the math soon becomes far too complicated, for just a chapter of a book, if
    you want it to be reliable. So instead we are going to go half way between the
    two methods and use library called js-objectDetect (written by Martin Tschirsich
    and found on github at [`https://github.com/mtschirs/js-objectdetect`](https://github.com/mtschirs/js-objectdetect)
    ), which is based on the OpenCV object detector and can take already trained classifiers.
    Before we get to the code, let’s look into how the library actually works.


    ### Haar-like Features


    Most image processing algorithms require a way to detect features in an image
    and there are quite a few different ways to do that. The most common (due to their
    use in the Viola-Jones algorithm) are called Haar-like features. These are based
    on the original Haar wavelets that were proposed by Alfréd Haar in 1909\. A wavelet
    is a mathematical function that cuts data into different frequencies, then it
    scales and analyzes the data for patterns. It is an essential tool for signal
    processing and provides an alternative, with the advantage of being able to scale
    the data, to the Fourier transform (which we used in [Chapter 3](#A978-1-4302-5945-9_3_Chapter.html)).
    Haar-like features can be considered as a more tangible form of Haar wavelets,
    as you can visualize them using different sized black and white rectangles (as
    shown in Figure [9-2](#A978-1-4302-5945-9_9_Chapter.html#Fig2)).


    ![A978-1-4302-5945-9_9_Fig2_HTML.jpg](A978-1-4302-5945-9_9_Fig2_HTML.jpg)


    Figure 9-2.


    An example of Haar-like features, visualized as black and white rectangles


    The reason they are black and white rectangles, as opposed to something that resembles
    the feature they are searching for, is that most objects have a common pattern
    of shadows (such as between an eye and nose). They work efficiently by using summed
    area tables, to produce what is known as an integral image, which allows quick
    lookups of the sum of all the pixels in the rectangle without needing to calculate
    them every time. On their own, Haar-like features are not particularly useful
    but when you use them as part of the Viola-Jones algorithm (which uses a moving
    window to search) then they become essential.'
  trans: "\n# 运动检测\n\n现在你已经刷新了视频操作的知识，让我们深入第一个演示：在视频中检测运动。这是一个有用的计算机视觉技术，尽管（在此例中）它完全基于朴素的方法，不涉及人工智能，也没有特别复杂的算法。仔细想想，运动检测其实就是在显示帧与帧之间的差异。我们可以通过优化、跨多帧检测或跟踪运动来让它变得更复杂，但目前我们只需找出差异。\n\
    \n实现这一点相当容易：你获取当前数据并存储起来，这样在下一帧时，你就能同时拥有新数据和旧数据。一旦你有了这两组数据，就可以进行比较，找出不同的像素。然而，如果你这样做，很快就会注意到摄像头每一帧捕捉到的画面并不完全相同，因此背景看起来会像有许多运动。为了解决这个问题，你可以使用一个阈值来调整精度。因为我们没有使用任何人工智能，所以这个阈值可以是一个效果良好的任意数值（我在测试时，15\
    \ 的效果就不错）。在图 9-1 中，你可以看到我头部运动的检测结果，这正是因为我使用了任意的阈值。如果我们创建一个 AI，它会尝试找出最可能属于我们寻找的那种运动的像素，比如手的轮廓，或者更简单地说，是一群像素而不是单个点的运动（因为我们感兴趣的任何物体都不可能只有一个像素那么大！）。\n\
    \n在 `try` 块中，我们略微修改了样板代码，使其检查 `oldData` 是否为 `null`（这应该是它的初始值）。如果它不为 `null`，则进行操作；如果为\
    \ `null`，则将来自 `data.manip` 的当前数据赋值给它。\n\n![A978-1-4302-5945-9_9_Fig1_HTML.jpg](img/A978-1-4302-5945-9_9_Fig1_HTML.jpg)\n\
    \n**图 9-1.** 屏幕截图显示了我移动时被检测到的面部大致轮廓\n\n```\nbctx.drawImage(videoElement, 0, 0,\
    \ w, h);\nmanip = bctx.getImageData(0, 0, w, h);\nvar data = manip.data;\nif (oldData\
    \ != null) {\n    data = motionDetection(data, oldData);\n    ctx.putImageData(manip,\
    \ 0, 0);\n    oldData = null;\n}\nelse  {\n    oldData = manip.data;\n}\nrequestAnimationFrame(draw);\n\
    ```\n\n`motionDetection()` 函数的工作原理如前所述：它接收当前帧的数据和上一帧的数据（尽管这可以通过多种方式优化或变得更高级，所以不一定非得是上一帧），然后比较它们，并为每一个发生了移动且在阈值范围内的像素绘制一个红色像素。\n\
    \n```\nfunction motionDetection(data, oldData)  {\n    // 遍历每个像素，如果未发生变化则设为 255\n\
    \    for( var y = 0 ; y < h; y++ ) {\n        for( var x = 0 ; x < w; x++ ) {\n\
    \            var indexOld = (y * w + x) * 4,\n                    oldr = oldData[indexOld],\n\
    \                    oldg = oldData[indexOld+1],\n                    oldb = oldData[indexOld+2],\n\
    \                    olda = oldData[indexOld+3];\n            var indexNew = (y\
    \ * w + x) * 4,\n                    r = data[indexNew],\n                   \
    \ g = data[indexNew+1],\n                    b = data[indexNew+2],\n         \
    \           a = data[indexNew+3];\n            if (oldr > r - 15 || oldg > g -\
    \ 15 || oldb > b - 15)\n            {\n                data[indexNew] = 255;\n\
    \                data[indexNew+1] = 255;\n                data[indexNew+2] = 255;\n\
    \                data[indexNew+3] = 255;\n                detected = true;\n \
    \           }\n            else\n            {\n                data[indexNew]\
    \ = 255;\n                data[indexNew+1] = 0;\n                data[indexNew+2]\
    \ = 0;\n                data[indexNew+3] = 255;\n            }\n        }\n  \
    \  }\n    return data;\n}\n```\n\n# 运动跟踪\n\n好了，检测运动是一回事，但除非你在创建报警系统或进行艺术创作，否则单独使用它并不是很有用。你通常要么想让计算机足够聪明，能够识别出物体是什么（这对机器人尤其重要），要么更常见的是，仅仅知道同一个物体在哪里——这被称为跟踪。我们已经生成了一个显示运动的图像，但它并没有尝试将运动归为一个物体。实现这一目标的方法有很多种，例如基于颜色进行校准，并寻找具有正确平均颜色的区域，或者你可以使用人工智能并实际训练它来寻找某个物体。\n\
    \n虽然颜色校准比使用人工智能更容易，但它可能会导致很多问题，而且如果你希望它可靠，涉及的数学很快就变得过于复杂，不适合在一本书的单独一章中讲解。因此，我们将采取介于两者之间的方法，使用一个名为\
    \ `js-objectDetect` 的库（由 Martin Tschirsich 编写，可在 github 上找到：[`https://github.com/mtschirs/js-objectdetect`](https://github.com/mtschirs/js-objectdetect)），它基于\
    \ OpenCV 目标检测器，并且可以使用已训练好的分类器。在我们开始看代码之前，让我们先了解一下这个库实际的工作原理。\n\n## 类 Haar 特征\n\
    \n大多数图像处理算法都需要一种检测图像中特征的方法，而有相当多的不同方法可以做到这一点。最常用的方法（由于它们在 Viola-Jones 算法中的应用）被称为类\
    \ Haar 特征。它们基于 Alfréd Haar 在 1909 年提出的原始 Haar 小波。小波是一种数学函数，它将数据切割成不同的频率，然后缩放并分析数据的模式。它是信号处理的基本工具，并且提供了一种可以缩放数据的备选方案，以替代傅里叶变换（我们在第\
    \ 3 章中使用过）。类 Haar 特征可以被视为 Haar 小波的一种更具体的形式，因为你可以使用不同大小的黑白矩形（如图 9-2 所示）来可视化它们。\n\
    \n![A978-1-4302-5945-9_9_Fig2_HTML.jpg](img/A978-1-4302-5945-9_9_Fig2_HTML.jpg)\n\
    \n**图 9-2.** 类 Haar 特征示例，以黑白矩形形式可视化\n\n它们之所以是黑白矩形，而不是类似于它们正在寻找的特征的形状，是因为大多数物体都有共同的阴影模式（例如在眼睛和鼻子之间）。它们通过使用积分图（summed\
    \ area tables）来高效工作，以生成所谓的积分图像（integral image），从而可以快速查找矩形内所有像素的总和，而无需每次都重新计算。单独来看，类\
    \ Haar 特征并不是特别有用，但当它们作为 Viola-Jones 算法（该算法使用滑动窗口进行搜索）的一部分时，它们就变得至关重要了。\n"
- fmt: '# Viola–Jones


    As you probably guessed from the previous section, the algorithm that powers both
    `js-objectDetect` and the OpenCV object detector is based on a paper written by
    Paul Viola and Michael Jones in 2001 (later improved on by Rainer Lienhart) and
    commonly known simply as Viola–Jones. I will not go into details about the algorithm,
    as it is quite complicated, but if you have a deep interest in computer vision
    or artificial intelligence, then it may be worth reading. The original paper does
    include some rather advanced math but it is written in a way that shouldn’t be
    too difficult to understand. The algorithm basically works by taking two sets
    of images, positive matches and negative; these are used to train it by going
    over each image with a small window that attempts to match the contents of the
    window of the image to Haar-like features. As with all training, the larger the
    sets, the more accurate it should be.


    The paper described the algorithm as being a “visual object detection framework”,
    so it can be implemented in a variety of different ways. The paper is comprised
    of three main contributions, which can be considered as the main components of
    any Viola–Jones‑based facial detection algorithm. The first component is integral
    images, which as I explained earlier, is how Haar-like features are so efficient.
    The second component is a learning algorithm based on AdaBoost. The last component
    that they put forward as being important to facial detection is cascade classifiers,
    which are used to quickly discard the background of the image. It is quite interesting
    to note that the algorithm used for detection is the same as the one used for
    training, so there is no extra step required to actually use the classifiers.
    The classifiers are the outcomes of the training and we will be using predefined
    cascades so that training is not required (because it needs a large data set and
    can take a long time). The `js-objectDetect` library includes some classifiers
    as samples (including mouth, eye, and hand classifiers, not just faces), so we
    shall be using those for this chapter. There are two types of cascade classifier,
    stump and tree. A stump is a single node of a tree and is usually best to use
    due to the balance between accuracy and efficiency, so the `js-objectDetect` library
    only works with stump cascades that are stored as JSON.


    # Using `js-objectDetect`


    The library makes it very easy to use the Viola–Jones algorithm, which is extremely
    powerful, without even needing to install OpenCV (a large C++ framework for computer
    vision). It is licensed under GPL so you can freely read the code and modify it.
    It is also well commented, so if you are interested in the implementation details
    of the Viola–Jones algorithm, then it is definitely a good place to start. In
    the next chapter we will be using object detection as input but for this chapter,
    to demonstrate tracking, we will be drawing a rectangle around a face instead.
    Facial detection is a common use of computer vision because it is the basis of
    most more advanced computer vision topics, such as facial recognition or eye tracking.


    **Note:** As with motion detection, tracking is still dependent on the 2D image
    produced by the webcam, so it may not be completely accurate and does require
    good lighting and only one face to track.


    It is actually extremely easy to use `js-objectDetect` for facial detection; it
    just requires the library to be included and a small bit of JavaScript to run
    it. It does not use canvas, so the `getUserMedia` can be set up directly with
    a video element rather than worrying about canvas contexts. The library is of
    course included in the download that complements this book. I have included a
    div with the class `cursor`; this is the box that surrounds the face that has
    been detected.


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Webcam Stuff</title>

    <style>

    html, body { margin: 0; padding: 0; }

    video { position: absolute; top: 0; left: 0;  }

    </style>

    </head>

    <body>

    <video></video>

    <div class="cursor"></div>

    <script src="js-objectDetect/compatibility.js"></script>

    <script src="js-objectDetect/smoother.js"></script>

    <script src="js-objectDetect/objectdetect.js"></script>

    <script src="js-objectDetect/objectdetect.frontalface.js"></script>

    <script src="js-objectDetect/jquery.js"></script>

    <script src="js-objectDetect/jquery.objectdetect.js"></script>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    The JavaScript required (within `script.js`) is comprised of a set-up function
    that handles the dimensions of the video element as well as the `getUserMedia`
    that calls the draw function to run the detection on each frame. There is also
    a jQuery function that is used to actually draw the square around the face. This
    works by getting dimensions from the library and modifies the css of the div to
    fit it.


    ```javascript

    window.URL = window.URL || window.webkitURL;

    navigator.getUserMedia  =  navigator.getUserMedia ||

    navigator.webkitGetUserMedia ||

    navigator.mozGetUserMedia ||

    navigator.msGetUserMedia;

    if (navigator.getUserMedia === undefined) {

    if (console !== undefined) {

    console.log("Browser doesn''t support getUserMedia");

    }

    }

    window.addEventListener(''DOMContentLoaded'', setup);

    function setup()  {

    videoElement = document.querySelector("video");

    videoElement.width = w = window.innerWidth;

    videoElement.height = h = window.innerHeight;

    videoElement.autoplay = true;

    navigator.getUserMedia({video: true}, function (stream) {

    videoElement.src = window.URL.createObjectURL(stream);

    videoElement.addEventListener(''canplay'', draw);

    }, function() {});

    }

    $.fn.highlight = function(rect, color) {

    $(''.cursor'').css({

    "border":   "2px solid " + color,

    "position": "absolute",

    "left":     ($(this).offset().left + rect[0]) + "px",

    "top":      ($(this).offset().top  + rect[1]) + "px",

    "width":    rect[2] + "px",

    "height":   rect[3] + "px",

    "z-index": 2

    });

    }

    function draw()  {

    $("video").objectdetect("all", {classifier: objectdetect.frontalface}, function(faces)
    {

    for (var i = 0; i < faces.length; ++i) {

    $(this).highlight(faces[i], "red");

    }

    });

    requestAnimationFrame(draw);

    }

    ```


    # Summary


    I hope that from this chapter you have gained a deeper understanding of how to
    manipulate video in real time and use it to produce useful solutions. Motion detection
    and object tracking are the two key starting points of computer vision. Although
    there may not currently be many use-cases for computer vision on the web, we are
    starting to see more and more of it, such as detecting faces in photos to tag
    people. Some companies (*ahem* Facebook) are going as far as facial recognition,
    which has its basis in facial detection. Many people consider computer vision
    to be incredibly complicated, something that only academia need to be interested
    in, but that’s just not the case. I highly recommend you to look further into
    this topic, much of it is beyond the scope of this book but if you take a look
    at the appendix you will find some extra information and useful resources for
    further reading. The next chapter builds on some of the concepts in this chapter,
    although we will be using a fairly naïve algorithm for detecting the movement
    of a finger so that we can use it to play a note on the keyboard that we built
    earlier in the book. Hopefully you can see that either by writing naïve algorithms
    or using libraries other people have already worked on, it is not as difficult
    to get started with computer vision as most people think it is and it is even
    more accessible now that it can be achieved, without relying on C++ or other more
    difficult languages, using HTML5 and JavaScript!'
  raw: '### Viola–Jones


    As you probably guessed from the previous section, the algorithm that powers both
    js-objectDetect and the OpenCV object detector is based on a paper written by
    Paul Viola and Michael Jones in 2001 (later improved on by Rainer Lienhart) and
    commonly known simply as Viola-Jones. I will not go into details about the algorithm,
    as it is quite complicated, but if you have a deep interest in computer vision
    or artificial intelligence, then it may be worth reading. The original paper does
    include some rather advanced math but it is written in a way that shouldn’t be
    too difficult to understand. The algorithm basically works by taking two sets
    of images, positive matches and negative; these are used to train it by going
    over each image with a small window that attempts to match the contents of the
    window of the image to Haar-like features. As with all training, the larger the
    sets, the more accurate it should be.


    The paper described the algorithm as being a “visual object detection framework”,
    so it can be implemented in a variety of different ways. The paper is comprised
    of three main contributions, which can be considered as the main components of
    any Viola-Jones−based facial detection algorithm. The first component is integral
    images, which as I explained earlier, is how Haar-like features are so efficient.
    The second component is a learning algorithm based on AdaBoost. The last component
    that they put forward as being important to facial detection is cascade classifiers,
    which are used to quickly discard the background of the image. It is quite interesting
    to note that the algorithm used for detection is the same as the one used for
    training, so there is no extra step required to actually use the classifiers.
    The classifiers are the outcomes of the training and we will be using predefined
    cascades so that training is not required (because it needs a large data set and
    can take a long time). The js-objectDetect library includes some classifiers as
    samples (including mouth, eye, and hand classifiers, not just faces), so we shall
    be using those for this chapter. There are two types of cascade classifier, stump
    and tree. A stump is a single node of a tree and is usually best to use due to
    the balance between accuracy and efficiency, so the js-objectDetect library only
    works with stump cascades that are stored as JSON.


