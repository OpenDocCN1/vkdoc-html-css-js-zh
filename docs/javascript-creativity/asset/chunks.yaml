    ## 总结


    现在，你应该对动画背后的一些数学原理（如线性插值）感到自信了。你也应该感觉自己理解了 `requestAnimationFrame`，并且大体上了解了如何搭建一个动画框架。我加入了一些拖放功能，因为我发现纯粹的“画几条线”这类绘图示例很无聊。我希望这能使其内容更丰富一些，并且对你有所帮助。涂色书和
    boids 的例子都有很大的改进空间（以及优化空间），我鼓励你去探索。


    在本章结束之际，我想让你思考一下动画，以及你通常可以用 canvas 和动画做些什么。我们生活在一个充满数据的世界里。充满噪音。无论是统计数据还是推文，都很难分辨哪些重要，哪些不重要。网络不必是线性的。以
    Twitter 的时间线为例……现在想象一下这些推文以 boids 的形式呈现，它们根据作者或主题，或者也许是根据话题标签的热度来进行分组。动画并非所有场景都需要，但它们既可以作为装饰，也可以非常有用。我期待看到你的创作！


    # 3. 音频与视频基础


    如果我们谈论交互性，我们就会想要使用音频和视频。多年来，我们不得不使用诸如 Flash 或 Silverlight 之类的“权宜之计”来将这些关键元素添加到网络，但现在，音频和视频直接内置于
    HTML 中。在本章中，我们将深入探讨这两个元素（即 `<audio>` 和 `<video>`）的来龙去脉，以便你能毫无顾虑地使用它们。我还会向你介绍一些新技术，例如操作，我们也会涉及优化技术。在后面的章节中，我们将探索音频创作的深度，并在这个过程中创建一个媒体播放器。本章为你提供了实现这些目标所需的基础。


    ## 容器与编解码器


    在涉及使用音频和视频时，我们将处理各种浏览器实现和支持。每种格式通常都有一系列优点和缺点，有些经过了很好的优化，有些则拥有自由许可。因此，在我们深入探讨如何实现的具体细节之前，最好先了解一些关于容器和编解码器、它们的局限性以及它们是否获得许可的知识。


    ### 容器


    容器是一种文件格式，用作一系列编解码器的封装格式。你可以把容器想象成包含已用编解码器编码的音频，以及关于使用哪种编解码器的数据的文件。许多编解码器都受到多种容器的支持。


    #### WebM


    `WebM` 是一个由谷歌赞助的音频-视频容器。它免版税，包含基于 Matroska 容器的 VP8 视频流和 Vorbis 音频流。它根据 BSD 许可证发布，所有用户都被授予全球性的、非独占的、免费的、免版税的专利许可。


    #### MP4


    运动图像专家组（MPEG）已经标准化了许多容器和编解码器。他们最著名的可能是 MP3 音频编解码器，但 MP4 是最常用的视频格式之一。MP4 通常使用 H.264
    作为视频编解码器，使用 AAC 或 MP3 作为音频编解码器。MP4 格式受专利限制，这导致了浏览器之间关于非免版税格式在网络上是否适用的讨论。


    #### QuickTime 文件格式


    Safari 使用 QuickTime 来播放浏览器本身不支持的格式，例如 QuickTime 文件格式（称为 Mov）。`MP4` 基于 Mov 规范，因此支持与
    `MP4` 相同的编解码器，但支持度较低，因为 `MP4` 是标准化的，而 Mov 不是。


    #### AVI


    微软于 1992 年发布了音频视频交错格式（AVI）；它是仍被广泛使用的最古老的容器格式之一（与 Mov 并列）。由于 AVI 非常古老，与更新的容器（如
    `MP4` 和 `Ogg`）相比，它有很多缺点。一些缺点包括缺乏元数据和压缩。由于这些缺点，AVI 在网络上不被原生使用，但可以与 Flash 视频播放器一起使用。


    #### ASF


    高级系统格式（ASF）是由微软专门为流媒体创建的一种容器。ASF 通常包含 Windows Media Video (WMV) 或 Windows Media
    Audio (WMA)。该规范是免费提供的（就像免费啤酒一样），但受专利限制。


    #### Ogg


    `Ogg` 是一种开源容器格式，由 Xiph.Org 基金会维护，并根据 BSD 许可证发布。由于其开放性，该格式受到高度赞扬，但在撰写本文时，Internet
    Explorer、Safari 和许多移动浏览器都不支持它。话虽如此，通常建议将 `Ogg` 与其他格式一起使用。`Ogg` 支持许多编解码器，但通常音频使用
    Vorbis，视频使用 Theora。


    #### Matroska


    另一种完全开放的容器格式是 Matroska。它是一种通用格式，旨在（在可能的情况下）支持所有编解码器。WebM 是 Matroska 的一个子集。这使得媒体播放器（包括浏览器）可以声明它们支持
    WebM，而无需完全支持 Matroska 支持的每种编解码器。


    #### WAV


    波形音频文件格式（以其文件扩展名 WAV 而闻名）是一种由微软和 IBM 开发的容器。它无专利且无损。通常，WAV 用作未压缩格式，但也可以与无损脉冲编码调制（LPCM）一起用于压缩。

