    # 音乐理论


    本书并非关于音乐理论，但为了完成本项目并理解（或至少使用）`Web Audio API`，掌握音乐理论的基础知识至关重要。音乐是声音，而随机的声音只是噪音，但音乐并非噪音，那么音乐的特殊之处何在？区分音乐与噪音的要素有很多，包括节奏和速度，但更重要的是（至少从我们的角度而言），音高和音色是音乐的核心，它们构成了乐器本身。我们无需成为出色的音乐家就能创造出一款可用于创作非凡音乐的工具，只需专注于乐器本身的特性即可——在本例中，我们的乐器使用`Web
    Audio API`构建，而音高就是音符的频率。


    那么，让我们从最基础的问题开始：什么是音符？简单来说，音符是特定波长的声波（即决定音高的频率）。音符按照音高从 A 到 G（嗯……大致如此）以字母顺序命名，所以
    D 比 C 高。我之所以说“大致如此”，是因为音符实际上以八度为单位循环，从 C 到 C，因此同一八度内的 A 比 C 高，但比更高八度的 C 低。每个频率都可以用赫兹（`hz`）来表示（无论从语言上还是实践上）。由于在钢琴上的位置，频率为`261.63hz`的
    C 被称为中央 C，通常作为计算基准的音符。例如，一个容易记忆的频率是“中央 C 上方的 A”，即`440hz`。


    由于每个八度都包含相同名称的音符，只是频率不同，而我们已经知道音符本身就是一个频率，因此各八度之间必然存在联系，否则它们从根本上就不可能是相同的音符。这种联系就是比率；每个八度的比率是`2:1`，因此音符的波长是前一个八度的两倍。所以，要从中央
    C 上方的 A 到中央 C 下方的 A，我们只需计算`440/2 = 220hz`。这种关系是和声背后的基本概念。每个音符都可以用代表八度的数字来标记，原因显而易见，例如，中央
    C 就是`C3`。


    如果你想象一架钢琴，你会记得黑键以特定模式分布在白键上方；这些琴键用于演奏音符之间的半音（或半音阶），其比率为`2^(1/12)`。音符上方的半音称为升音，音符下方的半音称为降音。因此，`466.16`被称为`A#`（升
    A）或`Bb`（降 B）。这些半音是“等音”最常见的例子，因为从技术上讲，它们是两个完全相同的音符，唯一的区别在于音乐的方向。


    我们没有钢琴、吉他或任何其他乐器，那么我们计划如何制作音乐呢？当我解释什么是音符时，我将其频率称为波长，因为它是由声波产生的。正如你可能所知，所有声波都是通过振动产生的。因此，我们只需要拼图的最后一块：振荡器；这是所有声音合成的基础，因为它让我们仅通过扬声器就能产生声波。声音包络是声音合成中常用的术语，“用于定义声音波形，该术语涵盖声音的四个组成部分：起音、衰减、延音和释音。通过操控声音包络，你可以开始控制声音。想想钢琴和三角铁的区别，它们都有相当长的延音（即共鸣持续时间较长），但三角铁的声音像“叮”的一声，而钢琴的声音持续时间更长（当然取决于你弹奏音符的时间长短），因此钢琴的起音比三角铁更强。在实践中，由于涉及大量物理因素（例如木质钢琴的特性），要完美合成任何乐器都很难，但通过操控每个音符，你可以尝试仅通过振荡所选波形来复现音乐的声音。


    每个声波都有一个形状（波形），它在视觉上表示音符振幅随时间的变化。这涉及很多我们无需关注的物理知识，但基本上，振幅决定了扬声器需要如何移动来产生声音。有四种基本波形，它们构成了所有声音的基础（见图
    5-1）。


    ![A978-1-4302-5945-9_5_Fig1_HTML.jpg](img/A978-1-4302-5945-9_5_Fig1_HTML.jpg)


    图 5-1. 波形示例。[`https://en.wikipedia.org/wiki/File:Waveforms.svg`](https://en.wikipedia.org/wiki/File:Waveforms.svg)


    四种波形分别是：


    *   正弦波：这条曲线遵循数学函数正弦的形状。

    *   方波：方波类似于二进制，它要么处于一个频率，要么处于另一个频率。

    *   三角波：三角波类似于正弦波，但不够平滑。这导致声音相当尖锐。

    *   锯齿波：这些波是前述所有波的组合。这种波具有三角波的缓慢尖锐音色，直到达到峰值，然后重置为原始频率，很像方波。

