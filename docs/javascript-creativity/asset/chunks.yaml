    \ {\n  keys[i] = keyboard.rect(width/21, height);\n  keys[i].move(width/21 * i,\
    \ 0);\n  keys[i].attr({ fill: '#fff', stroke: '#000', id: \"key\"+i });\n  keys[i].mousedown\
