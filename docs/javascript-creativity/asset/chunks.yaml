- fmt: '## Introducing Drag-and-Drop


    Quite often you will want to use drag-and-drop as part of an animation or as an
    integral part of your application. This might be for dragging elements around
    the page to trigger an event, or it might be to drag files from your system into
    the browser. I am going to introduce using a rather advanced app that works similar
    to a coloring book where you drag an image onto the canvas and it generates line
    art that the user can color in. Both of these are good examples of how we can
    create impressive interfaces using modern HTML, as well as prove that these technologies
    are not just for game creation!


    As mentioned, I am going to demonstrate the technique of dragging local files
    into the browser by creating a small coloring book web app where dragging an image
    onto the canvas turns it into line art that can then be colored in using a brush.
    My reason for making an app like this is to both get you thinking about slightly
    more advanced techniques, such as edge detection, but more importantly I want
    you to have something you can fiddle with, and extend functionality to your heart’s
    desire—the only way to learn is to do. So throughout both this mini-project and,
    indeed, the entire book, I will be providing ideas and mentioning algorithms for
    you to think about and implement.


    For our coloring book we need to start with a full-size canvas. This is done through
    JavaScript, because setting 100% width and height via CSS would scale rather than
    increase the size of the canvas. We also need to set up event listeners for `''dragover''`,
    `''dragenter''`, and `''drop''` events. For the first two events we need to stop
    the default browser behavior, so I have created a simple function called `preventDefault`,
    which calls a method with the same name on the event. In Listing 2-3, you can
    see the boilerplate code for setting up the canvas to enable drag and drop functionality.


    **Listing 2-3.**


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Coloring Book</title>

    </head>

    <body style="margin:0">

    <canvas id="drop"></canvas>

    </body>

    <script>

    (function() {

    var drop = document.querySelector("#drop");

    var ctx = drop.getContext(''2d'');

    /* These are to set the canvas to full width */

    drop.height = window.innerHeight;

    drop.width = window.innerWidth;

    drop.addEventListener(''dragover'', preventDefault);

    drop.addEventListener(''dragenter'', preventDefault);

    drop.addEventListener(''drop'', handleDrop);

    function preventDefault(e) {

    if (e.preventDefault) {

    e.preventDefault();

    }

    return false;

    }

    function handleDrop(e) {

    e.stopPropagation();

    e.preventDefault();

    e.dataTransfer.dropEffect = "copy";

    // Code for drop will go here

    }

    })();

    </script>

    </html>

    ```


    As you can see in Listing 2-3, this provides a good starting point, but now we
    need to actually put the image onto the canvas. All the data that we need to use
    is stored in `e`, the event variable of `handleDrop`, so we can move the file
    itself into its own variable—which I have aptly named ‘file’—using `e.dataTransfer.files[0];`
    which gives us the first of the dropped files (as in this example we will only
    be using one). Of course, you could extend this by making each dropped file open
    in a separate canvas such as Photoshop does.


    Due to the way it is implemented, to draw an image to the canvas you must first
    put it into an HTML element; this is slightly odd but easy to work with once you
    know about it as luckily the element does not need to be added to the DOM. We
    also require a `FileReader` to do two things: first to turn the file into a base
    64 data URL and second to add the data URL to the `src` of the image element once
    the file has loaded.


    ```

    var file = e.dataTransfer.files[0];

    var image = new Image();

    var reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = (function() {

    return function(e)  {

    image.src = e.target.result;

    };

    })();

    ```


    So now the image exists and is sitting in `image.src`, but we cannot yet see it
    because it hasn’t been added to the DOM or drawn to the canvas. Time to fix that!
    In the same way that `reader` had an `onload` event handler attribute, so does
    `image`. So we just need to write a function that draws the image to the context
    of the canvas at the top-left corner of the canvas (aka `(0,0)`). This is done
    like this:


    ```

    function handleDrop(e) {

    e.stopPropagation();

    e.preventDefault();

    e.dataTransfer.dropEffect = "copy";

    var file = e.dataTransfer.files[0];

    var image = new Image();

    var reader = new FileReader();

    reader.readAsDataURL(file);

    reader.onload = (function() {

    return function(e)  {

    image.src = e.target.result;

    };

    })();

    image.onload = function() {

    ctx.drawImage(image, 0, 0);

    };

    }

    ```


    Now if you copy that into the module, you should be able to drop images onto the
    page and have them appear on the canvas!


    We are now going to write a “naïve” edge detection filter loosely based on the
    Sobel operator, this implementation of the filter is based on an example within
    the html spec for pixel manipulation (our version reduces the colors to black
    and white lines). There is a more advanced version that uses Sobel called Canny
    Edge Detection (developed in 1986 by John F. Canny). This is one feature that
    you might want to add yourself because it includes noise reduction and so can
    produce much higher quality line art.


    Let’s start by creating a new function called `findEdges` that takes a parameter
    called `originalData`, which should hold the image data of the context; that is,
    a copy of the current context state that is being shown on the canvas (in this
    case, our image). Within the function we should create a variable, let’s call
    it `output`, to hold the temporary image data that we will be writing each pixel
    to so that it can then be put back onto the context. Now, another odd thing you
    need to remember, to write pixels to the image data you have to have two variables,
    one for the `ImageData` (our `output` variable) and one for the `ImageData.data`
    (let’s call this `outputData`), which sounds silly, but both are tightly coupled
    so you write to `outputData` then put the `output` (automatically containing the
    correct data) onto the canvas context. Before we get into the edge detection algorithm
    I am going to show you the code for all this set-up code.


    ```

    function findEdges(originalData) {

    var output = ctx.createImageData(drop.width, drop.height);

    var w = originalData.width, h = originalData.height;

    var inputData = originalData.data;

    var outputData = output.data;

    var threshold = 100;

    // edge detection goes here

    // put the image data back after manipulation

    ctx.putImageData(output, 0, 0);

    }

    ```


    To write the algorithm you first need to understand the data structure, which
    is a `Uint8ClampedArray`. Although the name sounds quite scary, it is an array
    of 8-bit unsigned (positive only) integers (or as I prefer—byte-sized elements!)
    that is quite simply organized as a pattern of ‘red, green, blue, alpha’ which
    then repeats itself, so that each pixel is made up of four array elements.


    To work out the position (`i`) of the pixel, we need two loops, one for the height
    (`y`) of the image and another for the width (`x`). We can then get the first
    color (red) of each pixel by working out `y` times width of the canvas, since
    the array stores by row, then add `x` to find the position in that row. Of course,
    this is then multiplied by 4 due to the amount of colors (including alpha) that
    make up the pixel.


    ```

    for (var y = 0; y < h; y += 1) {

    for (var x = 0; x < w; x += 1) {

    var i = (y * w + x) * 4;

    }

    }

    ```'
