    You can think of a scene in the same way as you would in a film`—`it is where
    you put the meshes (objects), lighting, and cameras. The scene is your stage.
    You can set up a scene quite simply, as all you require is the scene itself, a
    camera, and the renderer. Of course, that would be an empty scene! A simple scene
    object can be created using `THREE.Scene()` so let’s go ahead and create a basic
    (empty) scene. Afterward we can start adding basic geometry such as cubes or spheres.


    We can start by creating variables for width and height to store the size of the
    renderer (that is, our viewport) so for this example I am going to set each to
    use the dimensions of the inner window. We also need a container to put the renderer
    in, unlike previous chapters where we made a canvas ourselves; we can let Three.js
    create the DOM, depending on the renderer we choose. Now we need to choose the
    renderer, Three.js is built in such a way that you can create your own renderer
    or use a third-party’s renderer but the only ones you really need to know about
    are the `CanvasRenderer` and `WebGLRenderer`. The difference between these is
    that canvas is more widely supported but WebGL is more efficient. This is because
    WebGL has native 3D support (OpenGL ES 2) in which the 3D math runs on the GPU,
    whereas Canvas has no 3D support (you have to write it yourself) meaning its 3D
    math runs in JavaScript (much slower). So let’s just stick to using WebGLRenderer
    for now, you might want to try both though just to get a feel for the differences
    (they are usually only subtle). With the renderer chosen, I have stored it in
    a variable called `renderer`, we can set the dimensions and add it to the DOM.


    `var width  = window.innerWidth,`


    `height = window.innerHeight;`


    `var container = document.querySelector(''#container'');`


    `var renderer = new THREE.WebGLRenderer();`


    `renderer.setSize(width, height);`


    `container.appendChild(renderer.domElement);`


    From here we need to create a camera. Later in the chapter I will go through how
    to use multiple cameras, but to start with let’s just have one. As with renderers,
    there are a couple of default camera classes and it is very easy to code your
    own type of camera by inheriting from the abstract `Camera` class. The built-in
    cameras are `OrthographicCamera` and `PerspectiveCamera`, which we can use to
    provide different views of the scene; you can usually consider perspective as
    showing a 3D view, while orthographic shows a 2D view. For this example let’s
    choose the perspective because we just want to see what is on the scene (which
    to start with will be nothing) rather than a particular view (such as top down).
    For our `PerspectiveCamera` there are four parameters, which according to the
    documentation are


    *   fov: Camera frustum vertical field of view

    *   aspect: Camera frustum aspect ratio

    *   near: Camera frustum near plane

    *   far: Camera frustum far plane


    This makes sense providing you know the meaning of frustum; in this case it is
    simply the portion of the view. Often these parameters are stored as variables
    but since we have no use for them elsewhere at the moment, I have decided to write
    the values directly as parameters to reduce the amount of lines of code. With
    a camera created we can position it, for now let’s just set the camera’s z dimension
    to 300 so that the scene is nicely in view once we add some meshes.


    `var camera =  new THREE.PerspectiveCamera(45, width / height, 1, 1000);`


    `camera.position.z = 300;`


    Once we have objects in the scene, you will probably benefit from fiddling with
    these numbers to get a feel for how they affect the view of the scene. As I mentioned
    earlier, to create the scene itself all you need to do is create an instance of
    the `Scene` class. With the scene created, we can add the camera to it. To render
    the scene we use `renderer.render` `(scene, camera)`; which is self-explanatory
    have decided to put this within a similar set up to the one we used in [Chapter
    2](#A978-1-4302-5945-9_2_Chapter.html).This works very nicely as a boilerplate
    for developing more advanced animations and renders.


    `var scene = new THREE.Scene();`


    `scene.add(camera);`


    `function logic()  {`


    `requestAnimationFrame(render);`


    `}`


    `function render() {`


    `renderer.render(scene, camera);`


    `}`


    `setInterval(logic, 1000/60);`'
  trans: "\n#### 构建场景\n\n你可以像在电影中一样理解“场景”——它是你放置网格（物体）、光源和摄像机的地方。场景就是你的舞台。设置一个场景非常简单，因为你只需要场景本身、一台摄像机和渲染器。当然，那将是一个空场景！一个简单的场景对象可以使用\
    \ `THREE.Scene()` 创建，让我们继续创建一个基础的（空）场景。之后，我们可以开始添加基础几何体，例如立方体或球体。\n\n首先，我们可以创建用于存储渲染器（即我们的视口）尺寸的宽度和高度变量。在本例中，我将设置它们为内部窗口的尺寸。与之前几章我们自己创建画布不同，我们还需要一个容器来放置渲染器；我们可以让\
    \ Three.js 根据我们选择的渲染器来创建 DOM。现在我们需要选择渲染器，Three.js 的构建方式允许你创建自己的渲染器或使用第三方渲染器，但你真正需要了解的只有\
    \ `CanvasRenderer` 和 `WebGLRenderer`。两者的区别在于：Canvas 的兼容性更广，但 WebGL 效率更高。这是因为 WebGL\
    \ 原生支持 3D（OpenGL ES 2），其 3D 运算在 GPU 上运行；而 Canvas 没有 3D 支持（需要自行编写），其 3D 运算在 JavaScript\
    \ 中运行（速度慢得多）。因此，我们暂时坚持使用 `WebGLRenderer`，不过你也可以尝试两者，以感受它们的差异（通常差异很细微）。选定渲染器后，我将其存储在名为\
    \ `renderer` 的变量中，我们可以设置其尺寸并将其添加到 DOM 中。\n\n```\nvar width  = window.innerWidth,\n\
    \    height = window.innerHeight;\nvar container = document.querySelector('#container');\n\
    var renderer = new THREE.WebGLRenderer();\nrenderer.setSize(width, height);\n\
    container.appendChild(renderer.domElement);\n```\n\n接下来我们需要创建一台摄像机。本章稍后我会介绍如何使用多台摄像机，但一开始我们先只使用一台。与渲染器类似，有几种默认的摄像机类，并且通过继承抽象的\
    \ `Camera` 类很容易编写自己的摄像机类型。内置的摄像机有 `OrthographicCamera` 和 `PerspectiveCamera`，它们可用于提供场景的不同视图；通常你可以认为透视视图显示的是\
    \ 3D 视角，而正交视图显示的是 2D 视角。在本例中，我们选择透视摄像机，因为我们只想看到场景中的内容（初始情况下一无所有），而不是某个特定视角（例如俯视图）。对于我们的\
    \ `PerspectiveCamera`，有四个参数，根据文档说明，它们是：\n\n*   `fov`：摄像机视锥体的垂直视野\n*   `aspect`：摄像机视锥体的宽高比\n\
    *   `near`：摄像机视锥体的近截面\n*   `far`：摄像机视锥体的远截面\n\n如果你了解“视锥体”的含义，那么这些参数就不难理解；在这里，它就是指视图的一部分。通常这些参数会存储为变量，但由于目前其他地方用不到它们，我决定直接将值作为参数写入，以减少代码行数。创建摄像机后，我们可以为其定位，目前只需将摄像机的\
    \ z 坐标设置为 300，这样当我们添加一些网格后，场景就能很好地呈现在视野中。\n\n```\nvar camera = new THREE.PerspectiveCamera(45,\
    \ width / height, 1, 1000);\ncamera.position.z = 300;\n```\n\n一旦场景中有了物体，你可能会通过调整这些数值来感受它们如何影响场景的视角，这会很有帮助。正如我前面提到的，要创建场景本身，你只需要创建\
    \ `Scene` 类的一个实例。场景创建后，我们可以将摄像机添加到其中。要渲染场景，我们使用 `renderer.render(scene, camera)`，这自解释性很强。我决定将其放在一个与第\
    \ 2 章类似的设置中。这非常适合作为开发更复杂动画和渲染的模板。\n\n```\nvar scene = new THREE.Scene();\nscene.add(camera);\n\
    \nfunction logic() {\n    requestAnimationFrame(render);\n}\n\nfunction render()\
    \ {\n    renderer.render(scene, camera);\n}\n\nsetInterval(logic, 1000/60);\n\
    ```\n"
- fmt: "### Adding Meshes\n\nA basic scene is rather boring and, quite frankly, useless.\
    \ So let’s spice things up a bit by taking a look at the kinds of meshes we can\
    \ use. Firstly though, we need some lighting so that we can actually see the objects\
    \ (it really is like being in a room in the dark — the objects are on the scene\
    \ but you cannot see them). I will explain the types of lights shortly, but for\
    \ now we can just use a simple `DirectionalLight`, which is used just like a desk\
    \ lamp in that it points in a specific direction rather than covering the entire\
    \ scene. I chose to use this type of lighting because it allows us to easily see\
    \ shadows straight away. A default directional light is white and has an intensity\
    \ of 1; by default the light points toward the center to the scene (0,0,0). It\
    \ should be noted that although the directional light has a property called `position`,\
    \ that is the direction that the light is pointed and the light source itself\
    \ does not have an actual position (it is infinite). I have decided to place light\
    \ further toward the camera, so that we can see a nice simple shadow around the\
    \ object.\n\n```\nvar directionalLight = new THREE.DirectionalLight();\ndirectionalLight.position.z\
    \ = 10;\nscene.add(directionalLight);\n```\n\nLet’s start with a sphere (similar\
    \ to that of the official documentation for Three.js). To create any primitive\
    \ object, we need to create a mesh that includes the type of geometry and the\
    \ material. For a sphere we can use `THREE.SphereGeometry` with any type of material,\
    \ in this example I will be using a material called `THREE.MeshLambertMaterial`\
    \ (more information about that soon).\n\n```\nvar radius = 100,\n    segments\
    \ = 50,\n    rings = 50;\n\nvar sphereMaterial = new THREE.MeshLambertMaterial({\n\
    \    color: 0xFF0000\n});\n\nvar sphere = new THREE.Mesh(\n    new THREE.SphereGeometry(\n\
    \        radius,\n        segments,\n        rings),\n    sphereMaterial);\n\n\
    scene.add(sphere);\n```\n\nAs you can see, I have started by setting up three\
    \ variables to control the properties of the sphere. You will know that radius\
    \ is half of the size/diameter of the sphere. Segments and rings are used to specify\
    \ the quality of the sphere — the lower the numbers the lower quality. Try changing\
    \ them from 50 to 10, you will see jagged edges and will probably be able to see\
    \ where the lines are that make up the rings and segments. You can think of them\
    \ similar to latitude and longitude; rings go horizontally around the sphere and\
    \ segments are vertical.\n\n**Note**\n\nIf you are familiar with bitmap images\
    \ or mathematical geometry, you will understand that there is no perfect curve,\
    \ so there is no correct answer for how many rings and segments you should have.\
    \ Just choose the number that feels right as a tradeoff between quality and optimization.\n\
    \nIf you run the following code you should see a red sphere.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n    <title>Shapes In Scene</title>\n    <style>\n   \
    \     * { margin: 0; }\n        canvas { background: #000;}\n    </style>\n</head>\n\
    <body>\n    <div id=\"container\"></div>\n    <script src=\"../three.min.js\"\
    ></script>\n    <script src=\"script.js\"></script>\n</body>\n</html>\n```\n\n\
    ```\nvar width  = window.innerWidth,\n    height = window.innerHeight;\nvar container\
    \ = document.querySelector('#container');\nvar renderer = new THREE.WebGLRenderer();\n\
    renderer.setSize(width, height);\ncontainer.appendChild(renderer.domElement);\n\
    \nvar VIEW_ANGLE = 45,\n    NEAR = 0.1,\n    FAR = 10000;\nvar camera =  new THREE.PerspectiveCamera(45,\
    \ width / height, 1, 1000);\ncamera.position.z = 300;\n\nvar scene = new THREE.Scene();\n\
    scene.add(camera);\n\nvar directionalLight = new THREE.DirectionalLight();\ndirectionalLight.position.z\
    \ = 10;\nscene.add(directionalLight);\n\nvar radius = 100,\n    segments = 50,\n\
    \    rings = 50;\nvar sphereMaterial = new THREE.MeshLambertMaterial({\n    color:\
    \ 0xFF0000\n});\n\nvar sphere = new THREE.Mesh(\n    new THREE.SphereGeometry(\n\
    \        radius,\n        segments,\n        rings),\n    sphereMaterial);\n\n\
    scene.add(sphere);\n\nfunction logic()  {\n    requestAnimationFrame(render);\n\
    }\n\nfunction render() {\n    renderer.render(scene, camera);\n}\n\nsetInterval(logic,\
    \ 1000/60);\n```\n\nCreating each primitive shape is similar so instead of guiding\
    \ you through each shape, here is a Table 4-1 shows the types of shapes. Do note\
    \ that unless I specify otherwise, every parameter of the constructor is optional.\
    \ Many of the geometries are based on `PolyhedronGeometry`, so the parameter `detail`\
    \ is used to determine the amount of triangles are used to create the shape. Also\
    \ remember that all constructors should be prepended with `THREE`.\n\n**Table\
    \ 4-1.** Showing geometries available in Three.js\n\n| Name | Constructor | Notes\
    \ |\n| --- | --- | --- |\n| `CircleGeometry` | `CircleGeometry(radius, segments,\
    \ thetaStart, thetaLength)` | The theta parameters are used to create segments;\
    \ by changing them you can specify a particular arc. |\n| `ConvexGeometry` | `ConvexGeometry(vertices)`\
    \ |  |\n| `CubeGeometry` | `CubeGeometry(width, height, depth, widthSegments,\
    \ heightSegments, depthSegment)` |  |\n| `CylinderGeometry` | `CylinderGeometry(radiusTop,\
    \ radiusBottom, height, radiusSegments, heightSegments, openEnded)` |  |\n| `ExtrudeGeometry`\
    \ | `ExtrudeGeometry(shapes, options)` | There are many options for this one so\
    \ I will go through them after this table. |\n| `IcosahedronGeometry` | `IcosahedronGeometry(radius,\
    \ detail)` |  |\n| `LatheGeometry` | `LatheGeometry(points, segments, phiStart,\
    \ phiLength)` |  |\n| `OctahedronGeometry` | `OctahedronGeometry(radius, detail)`\
    \ |  |\n| `ParametricGeometry` | `ParametricGeometry(parametricFunction, uSegments,\
    \ ySegments, useTris)` |  |\n| `PlaneGeometry` | `PlaneGeometry(width, height,\
    \ widthSegments, heightSegments)` |  |\n| `PolyhedronGeometry` | `PolyhedronGeometry(vertices,\
    \ faces, radius, detail)` |  |\n| `RingGeometry` | `RingGeometry(innerRadius,\
    \ outerRadius, thetaSegments, phiSegments, thetaStart, thetaLength)` |  |\n| `ShapeGeometry`\
    \ | `ShapeGeometry(shapes, options)` |  |\n| `SphereGeometry` | `SphereGeometry(radius,\
    \ widthSegments, heightSegments, phiStart, phiLength, thetaStart, thetaLength)`\
    \ | We have already been through spheres, but as with circles there are some extra\
    \ options that may be useful occasionally. |\n| `TetrahedronGeometry` | `TetrahedronGeometry(radius,\
    \ detail)` |  |\n| `TextGeometry` | `TextGeometry(text, parameters)` | This is\
    \ used to create 3D text, which I will go over later in the chapter. |\n| `TorusGeometry`\
    \ | `TorusGeometry(radius, tube, radialSegments, tubularSegments, arc)` |  |\n\
    | `TorusKnotGeometry` | `TorusKnotGeometry(radius, tube, radialSegments, tubularSegments,\
    \ p, q, heightScale)` |  |\n| `TubeGeometry` | `TubeGeometry(path, segments, radius,\
    \ radiusSegments, closed, debug)` |  |"
