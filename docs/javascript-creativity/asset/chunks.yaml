  trans: "\n# 用摄像头控制音乐\n\n为键盘添加动作控制只需实现前一章中的步骤即可。我们首先捕捉摄像头中的两帧画面并进行分析，以找出两帧之间的运动。请记住，我们并未使用任何人工智能技术，因此你可能需要调整一些数值，使其能根据你的光照条件、与屏幕的距离（以及身后的移动情况）来准确识别。\n\
    \n要检测运动，我们遍历第二帧画面的每个像素，并将其与前一帧的对应像素进行比较。如果像素值不同，就将其颜色变为黑色，否则变为白色。在这个示例中，我们只需要检测\
    \ X 轴方向上的运动：因此每当检测到运动时，我们就会根据运动发生的 X 位置，累加其对应的宽度百分比数值。例如：`motionX += 100*(x/w);`。遍历检查完毕后，将总和除以计数即可得出平均的\
    \ X 位置。由于运算方法简单，结果并不完全精确，但足以指示运动的大致方向。根据画布的朝向，你可能需要反转数值才能正确镜像运动：`motionX = 100\
    \ - motionX;`。\n\n现在，我们可以检查 `motionX` 是否位于我们关注的特定运动范围之内。在本例中，我们希望光标能左右移动，并在中间三分之一的区域检测到运动时按下按键。因此，如果\
    \ `motionX` 小于 `100/3`，则向左移动；如果介于 `100/3` 和 `(100/3)*2` 之间，则按下按键；如果大于 `(100/3)*2`，则向右移动。\n\
    \n本例仅适用于白键，但你完全可以通过额外检测 Y 轴上的运动，将其轻松扩展以涵盖黑键。\n\n```javascript\nfunction motionDetection(data,\
    \ oldData)  {\n  var motionX = 0;\n  var count = 0;\n\n  // 遍历每个像素，若未改变则设为 255\n\
    \  for( var y = 0 ; y < h; y++ ) {\n    for( var x = 0 ; x < w; x++ ) {\n    \
    \  var indexOld = (y * w + x) * 4,\n          oldr = oldData[indexOld],\n    \
    \      oldg = oldData[indexOld+1],\n          oldb = oldData[indexOld+2],\n  \
    \        olda = oldData[indexOld+3];\n\n      var indexNew = (y * w + x) * 4,\n\
    \          r = data[indexNew],\n          g = data[indexNew+1],\n          b =\
    \ data[indexNew+2],\n          a = data[indexNew+3];\n\n      if (oldr > r - 30\
    \ || oldg > g - 30 || oldb > b - 30) {\n        data[indexNew] = 255;\n      \
    \  data[indexNew+1] = 255;\n        data[indexNew+2] = 255;\n        data[indexNew+3]\
    \ = 255;\n      } else {\n        data[indexNew] = 0;\n        data[indexNew+1]\
    \ = 0;\n        data[indexNew+2] = 0;\n        data[indexNew+3] = 255;\n     \
    \   motionX += 100*(x/w); // motionX = X 位置对应的宽度百分比\n        count++;\n      }\n\
    \    }\n  }\n\n  motionX = motionX / count;\n  motionX = 100 - motionX;\n\n  if\
    \ (motionX > 0)  {\n    if (motionX > 100/3 && motionX < (100/3)*2)  {\n     \
    \ if (o[i] === null)\n        playSound(currentCursor, false);\n      console.log('2');\n\
    \    }\n\n    if (motionX > (100/3)*2)  {\n      if (currentCursor + 1 < keys.length)\
    \  {\n        cursor[currentCursor].hide();\n        stopSound(currentCursor,\
    \ false);\n        currentCursor++;\n        cursor[currentCursor].show();\n \
