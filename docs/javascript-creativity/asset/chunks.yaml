- fmt: "### Codecs\n\nA codec is used to encode data, to take a raw data stream (a\
    \ signal) and process it. Most codecs attempt to compress the raw data, some are\
    \ lossy (meaning that the compression loses quality) and others are lossless.\
    \ It is the encoded data (created by the codec) that is held within the container\
    \ format.\n\n#### MP3\n\nThis is probably the most well-known audio format, so\
    \ it is probably a good codec to start with. `MP3` is known as a lossy format,\
    \ as opposed to a lossless format, meaning the sound loses quality when compressed\
    \ from original the recording. However, it is well optimized and can be a good\
    \ choice for audio on the web due to low bandwidth usage. The biggest downfall\
    \ to `MP3` is that it is patented, meaning that many people (notably Mozilla in\
    \ the past, who refused to support the format until Firefox 21) are against the\
    \ format and instead opt to use freely available formats.\n\n#### Vorbis\n\n`Vorbis`\
    \ is the most popular open source, patent-free, audio codec that is supported\
    \ on many browsers. It is often referred to as `Ogg Vorbis` despite `Ogg` being\
    \ a container that `Vorbis` is often used with rather than the format’s name.\
    \ There are many other containers for `Vorbis`, but usually the container is `Ogg`,\
    \ `QuickTime MOV`, or `WebM`.\n\n#### AAC\n\n`Advanced Audio Coding` (`AAC`) is\
    \ particularly interesting as it often complements `H.264` to provide audio, and\
    \ is the primary audio codec used in `3GP` (commonly used on mobile devices) containers\
    \ (other than `AMR`). `AAC` is supported in most browsers (except Opera Firefox\
    \ on OSX, and some Linux distributions due to licensing agreements).\n\n#### AC-3\n\
    \n`AC-3` is an audio codec created by Dolby Laboratories and generally known as\
    \ `Dolby Digital`. It is rarely used on the web but is widely used in high-definition\
    \ movies.\n\n#### H.264\n\n`H.264` is a video codec developed by the Video Coding\
    \ Experts Group (`VCEG`) and the Moving Picture Experts Group. The codec is used\
    \ for Blu-ray discs and is also very popular on the web because browser support\
    \ is good (all browsers except Opera support `H.264` where possible, due to licensing\
    \ issues). Cisco has released an open implementation of `H.264` that attempts\
    \ to solve the licensing issues.\n\n#### VP8\n\nThis is the codec used for video\
    \ in `WebM`. It is owned by Google but they have given an irrevocable patent promise\
    \ that allows anyone to implement `VP8`.\n\n#### Theora\n\nBased on `VP3` (a predecessor\
    \ to `VP8`), `Theora` is an open, lossy video codec that is maintained by the\
    \ Xiph.Org Foundation. It is often used on the web with the `Ogg` container format.\n\
    \n### Encoding Videos\n\nNow, you may want to know how to encode videos. Unfortunately\
    \ browsers cannot automatically do this, so you will need to use a converter.\
    \ There are many converters available, but the most popular seem to be `Handbrake`\
    \ and `Miro`. I personally use `Miro` because it is well-designed, simple to use,\
    \ and open source, `Miro` is available at [`www.mirovideoconverter.com`](http://www.mirovideoconverter.com/).\n\
    \n### Browser Compatibility\n\nAt the time of writing, Firefox has not yet added\
    \ support for `MP3` and both Internet Explorer and Safari do not support `OGG`\
    \ or `WebM`. Mobile support is even more lacking.\n\nAs with `<audio>` there are\
    \ quite a few codecs and containers we can use. Chrome and Firefox have both committed\
    \ to `WebM`, although Internet Explorer and Safari do not support it. Some older\
    \ versions of browsers will support but not `WebM`, so it is worth using `OGG`\
    \ and `MP4` too. Earlier I mentioned that `Vorbis` is often called `OGG Vorbis`,\
    \ for video we use the `OGG` container with `Vorbis` for audio and `Theora` for\
    \ video. `OGG` and `WebM` are both preferred over `MP4` for the patent reasons\
    \ described earlier. To see the current state of browser support, please check\
    \ [`www.docs.webplatform.org/wiki/html/elements/audio`](http://www.docs.webplatform.org/wiki/html/elements/audio).\n\
    \n## Using the `<audio>` and `<video>` elements\n\nNow that we have an understanding\
    \ of containers and codecs and the files we may encounter, we can look at how\
    \ we implement these on our web pages.\n\nNote\n\nThe audio used in this chapter\
    \ is from [`www.incompetech.com/music/royalty-free`](http://www.incompetech.com/music/royalty-free)\
    \ and the video is from [`www.bigbuckbunny.com`](http://www.bigbuckbunny.com/).\n\
    \n### `<audio>`\n\nLet’s start with the audio element, which is what we use to\
    \ listen to sound in modern browsers. This sound could be anything, from a podcast\
    \ to music. Before we start I need to stress a point—use this with care. Don’t\
    \ blast out sound when the user loads the website. We hated this when Flash could\
    \ do it and we still hate it now. In its most basic form, the audio element can\
    \ take a `src` just like an `img` element can:\n\n`<audio src=\"audio.mp3\" >`\n\
    \nThis is simply added into your HTML document. The problem with this is that\
    \ we cannot provide a list of files, because we need to provide different audio\
    \ codecs based on browser compatibility. To solve this, we use the `<source>`\
    \ element nested inside `<audio>`. This is an element that allows you to provide\
    \ different files and have the browser automatically choose the best case. It\
    \ takes the `src` attribute like normal, as well as `type`. In the `type` attribute\
    \ we give the MIME type (as you may expect), this needs to include both the container\
    \ as the main type with the codecs included after a semicolon. You can also include\
    \ a Flash alternative alongside the source elements if you deem it necessary to\
    \ target older browsers. Here is an example, the audio files can be found on the\
    \ Incompetech website at the link above, as well as in the download for this book:\n\
    \n```\n<audio>\n   <source src='audio.ogg' type='audio/ogg; codecs=vorbis'>\n\
    \   <source src='audio.mp3' type='audio/mpeg'>\n</audio>\n```\n\nBecause the browsers\
    \ have an algorithm to choose the source, the order of sources and the amount\
    \ of them are not a problem. Most people currently just use `Vorbis` and `MP3`\
    \ but over time that may change. It is quite likely that `WebM` container format\
    \ will become more popular than the `Ogg` container format, because many browser\
    \ vendors are heavily pushing it as the open video format made for the web. It\
    \ is also worth noting that `WebM` is being developed alongside an image format\
    \ called `WebP`.\n\n### `<video>`\n\nThe video element (`<video>`) is implemented\
    \ in a similar way to `<audio>`. As with `<audio>` you can specify either just\
    \ one video file, or specify many using `<source>`:\n\n```\n<video>\n    <source\
    \ src='../video.ogv' type='video/ogg;'>\n    <source src='../video.mp4' type='video/mp4'>\n\
    \    <source src='../video.webm' type='video/webm'>\n</video>\n```\n\nAgain, as\
    \ with audio, the browsers have an algorithm to choose the source based on the\
    \ capabilities of the browser and operating system. It is not a problem to have\
    \ many sources, in any order. The three formats in the example: `Ogg`, `MP4`,\
    \ and `WebM`, are the best supported at the time of writing.\n\n## Attributes\
    \ and Properties\n\nSo, now we know how to implement audio and video on our HTML\
    \ document, let’s look at the attributes and properties available to these elements.\
    \ There is a lot of overlap between the audio and video elements, most attributes\
    \ work on both, so I will explain them together instead of in separate sections."
  raw: '### Codecs


    A codec is used to encode data, to take a raw data stream (a signal) and process
    it. Most codecs attempt to compress the raw data, some are lossy (meaning that
    the compression loses quality) and others are lossless. It is the encoded data
    (created by the codec) that is held within the container format.


    #### MP3


    This is probably the most well-known audio format, so it is probably a good codec
    to start with. MP3 is known as a lossy format, as opposed to a lossless format,
    meaning the sound loses quality when compressed from original the recording. However,
    it is well optimized and can be a good choice for audio on the web due to low
    bandwidth usage. The biggest downfall to MP3 is that it is patented, meaning that
    many people (notably Mozilla in the past, who refused to support the format until
    Firefox 21) are against the format and instead opt to use freely available formats.


    #### Vorbis


    Vorbis is the most popular open source, patent-free, audio codec that is supported
    on many browsers. It is often referred to as Ogg Vorbis despite Ogg being a container
    that Vorbis is often used with rather than the format’s name. There are many other
    containers for Vorbis, but usually the container is Ogg, QuickTime MOV, or WebM.


    #### AAC


    Advanced Audio Coding (AAC) is particularly interesting as it often complements
    H.264 to provide audio, and is the primary audio codec used in 3GP (commonly used
    on mobile devices) containers (other than AMR). AAC is supported in most browsers
    (except Opera Firefox on OSX, and some Linux distributions due to licensing agreements).


    #### AC-3


    AC-3 is an audio codec created by Dolby Laboratories and generally known as Dolby
    Digital. It is rarely used on the web but is widely used in high-definition movies.


    #### H.264


    H.264 is a video codec developed by the Video Coding Experts Group (VCEG) and
    the Moving Picture Experts Group. The codec is used for Blu-ray discs and is also
    very popular on the web because browser support is good (all browsers except Opera
    support H.264 where possible, due to licensing issues). Cisco has released an
    open implementation of H.264 that attempts to solve the licensing issues.


    #### VP8


    This is the codec used for video in WebM. It is owned by Google but they have
    given an irrevocable patent promise that allows anyone to implement VP8.


    #### Theora


    Based on VP3 (a predecessor to VP8), Theora is an open, lossy video codec that
    is maintained by the Xiph.Org Foundation. It is often used on the web with the
    Ogg container format.


    ### Encoding Videos


    Now, you may want to know how to encode videos. Unfortunately browsers cannot
    automatically do this, so you will need to use a converter. There are many converters
    available, but the most popular seem to be Handbrake and Miro. I personally use
    Miro because it is well-designed, simple to use, and open source, Miro is available
    at [`www.mirovideoconverter.com`](http://www.mirovideoconverter.com/) .


    ### Browser Compatibility


    At the time of writing, Firefox has not yet added support for MP3 and both Internet
    Explorer and Safari do not support OGG or WebM. Mobile support is even more lacking.


    As with `<audio>` there are quite a few codecs and containers we can use. Chrome
    and Firefox have both committed to WebM, although Internet Explorer and Safari
    do not support it. Some older versions of browsers will supportbut not WebM, so
    it is worth using OGG and MP4 too. Earlier I mentioned that Vorbis is often called
    OGG Vorbis, for video we use the OGG container with Vorbis for audio and Theora
    for video. OGG and WebM are both preferred over MP4 for the patent reasons described
    earlier. To see the current state of browser support, please check[`www.docs.webplatform.org/wiki/html/elements/audio`](http://www.docs.webplatform.org/wiki/html/elements/audio)
    .


    ## Using the <audio> and <video> elements


    Now that we have an understanding of containers and codecs and the files we may
    encounter, we can look at how we implement these on our web pages.


    Note


    The audio used in this chapter is from [`www.incompetech.com/music/royalty-free`](http://www.incompetech.com/music/royalty-free)
    and the video is from [`www.bigbuckbunny.com`](http://www.bigbuckbunny.com/) .


    ### <audio>


    Let’s start with the audio element, which is what we use to listen to sound in
    modern browsers. This sound could be anything, from a podcast to music. Before
    we start I need to stress a point—use this with care. Don’t blast out sound when
    the user loads the website. We hated this when Flash could do it and we still
    hate it now. In its most basic form, the audio element can take a `src` just like
    an `img` element can:


    `<audio src="audio.mp3" >`


    This is simply added into your HTML document. The problem with this is that we
    cannot provide a list of files, because we need to provide different audio codecs
    based on browser compatibility. To solve this, we use the `<source>` element nested
    inside `<audio>`. This is an element that allows you to provide different files
    and have the browser automatically choose the best case. It takes the `src` attribute
    like normal, as well as type. In the `type` attribute we give the MIME type (as
    you may expect), this needs to include both the container as the main type with
    the codecs included after a semicolon. You can also include a Flash alternative
    alongside the source elements if you deem it necessary to target older browsers.
    Here is an example, the audio files can be found on the Incompetech website at
    the link above, as well as in the download for this book:


    `<audio>`


       `<source src=''audio.ogg'' type=''audio/ogg; codecs=vorbis''>`


       `<source src=''audio.mp3'' type=''audio/mpeg''>`


    `</audio>`


    Because the browsers have an algorithm to choose the source, the order of sources
    and the amount of them are not a problem. Most people currently just use Vorbis
    and MP3 but over time that may change. It is quite likely that WebM container
    format will become more popular than the Ogg container format, because many browser
    vendors are heavily pushing it as the open video format made for the web. It is
    also worth noting that WebM is being developed alongside an image format called
    WebP.


    ### <video>


    The video element (`<video>`) is implemented in a similar way to `<audio>`. As
    with `<audio>` you can specify either just one video file, or specify many using
    `<source>:`


    `<video>`


        `<source src=''../video.ogv'' type=''video/ogg;''>`


        `<source src=''../video.mp4'' type=''video/mp4''>`


        `<source src=''../video.webm'' type=''video/webm''>`


    `</video>`


    Again, as with audio, the browsers have an algorithm to choose the source based
    on the capabilities of the browser and operating system. It is not a problem to
    have many sources, in any order. The three formats in the example: Ogg, MP4, and
    WebM, are the best supported at the time of writing.


    ## Attributes and Properties


    So, now we know how to implement audio and video on our HTML document, let’s look
    at the attributes and properties available to these elements. There is a lot of
    overlap between the audio and video elements, most attributes work on both, so
    I will explain them together instead of in separate sections.'
