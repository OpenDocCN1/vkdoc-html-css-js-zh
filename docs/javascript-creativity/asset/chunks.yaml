    that shouldn’t often happen).


    `socket.on(''received_answer'', function(data) {`


    `console.log(''received answer'', data);`


    `if(!connected && data.type == "answer") {`


    `var description = new RTCSessionDescription(data);`


    `console.log("Setting remote description", description);`


    `pc.setRemoteDescription(description);`


    `connected = true;`


    `}`


    `});`


    The peer connection now knows that it had an ICE candidate as the peer connection
    ‘gathers candidates’ once the local descriptions have been set. When it has an
    ICE candidate, we then send its own candidate back (including an id and label)
    as a “received_candidate” message. So we now need to listen for “received_candidate”
    and add that candidate to the peer connection. This process is mostly just for
    confirmation of each candidate, it is more of a problem when there are more than
    two clients. Listing 8-2 shows the current state of the client.js file.


    Listing 8-2. Client.js


    `socket.on(''received_candidate'', function(data) {`


    `console.log(''received candidate'', data);`


    `data = JSON.parse(data);`


    `var candidate = new RTCIceCandidate({`


    `sdpMLineIndex: data.label,`


    `candidate: data.candidate`


    `});`


    `pc.addIceCandidate(candidate);`


    `});`


    `pc.onicecandidate = function(e) {`


    `console.log("oniceCandidate", e);`


    `if(e.candidate) {`


    `socket.emit(''received_candidate'', JSON.stringify({`


    `label: e.candidate.sdpMLineIndex,`


    `id: e.candidate.sdpMid,`


    `candidate: e.candidate.candidate`


