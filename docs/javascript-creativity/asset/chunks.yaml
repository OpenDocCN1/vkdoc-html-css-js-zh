  trans: "\n### 添加网格\n\n一个基础场景相当乏味，而且坦率地说，没什么用处。因此，让我们通过研究可以使用的各种网格来让情况变得有趣一些。不过首先，我们需要一些光线，这样才能实际看到物体（这真的就像在黑暗的房间里——物体就在场景中，但你看不到它们）。稍后我会解释光的类型，但目前我们只需使用一个简单的\
    \ `DirectionalLight`（平行光），它的用法就像一盏台灯，指向特定方向，而不是照亮整个场景。我选择使用这种类型的光，因为它能让我们立刻轻松地看到阴影。默认的平行光是白色的，强度为\
    \ 1；默认情况下，光指向场景中心 (0,0,0)。需要注意的是，尽管平行光有一个名为 `position` 的属性，但这表示光指向的方向，而光源本身并没有实际位置（它是无限远的）。我决定将光放置在更靠近摄像机的位置，这样我们就能看到物体周围漂亮简单的阴影了。\n\
    \n```\nvar directionalLight = new THREE.DirectionalLight();\ndirectionalLight.position.z\
    \ = 10;\nscene.add(directionalLight);\n```\n\n让我们从一个球体开始（类似于 Three.js 官方文档中的示例）。要创建任何原始对象，我们需要创建一个包含几何体类型和材质的网格。对于球体，我们可以使用\
    \ `THREE.SphereGeometry` 搭配任何类型的材质，在这个例子中，我将使用一种名为 `THREE.MeshLambertMaterial`\
    \ 的材质（稍后会详细介绍）。\n\n```\nvar radius = 100,\n    segments = 50,\n    rings = 50;\n\
    \nvar sphereMaterial = new THREE.MeshLambertMaterial({\n    color: 0xFF0000\n\
    });\n\nvar sphere = new THREE.Mesh(\n    new THREE.SphereGeometry(\n        radius,\n\
    \        segments,\n        rings),\n    sphereMaterial);\n\nscene.add(sphere);\n\
    ```\n\n如你所见，我首先设置了三个变量来控制球体的属性。你会知道半径是球体大小/直径的一半。`segments` 和 `rings` 用于指定球体的质量——数值越低，质量越差。尝试将它们从\
    \ 50 改为 10，你会看到锯齿状的边缘，并且可能能够看到构成环和段的线条。你可以把它们想象成纬度和经度；`rings` 水平环绕球体，`segments`\
    \ 则是垂直的。\n\n**注意**\n\n如果你熟悉位图图像或数学几何，你会明白不存在完美的曲线，因此对于应该有多少环和段，并没有正确的答案。只需选择一个在质量和优化之间感觉合适的折中数值即可。\n\
    \n如果运行以下代码，你应该会看到一个红色的球体。\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>场景中的形状</title>\n\
    \    <style>\n        * { margin: 0; }\n        canvas { background: #000;}\n\
    \    </style>\n</head>\n<body>\n    <div id=\"container\"></div>\n    <script\
    \ src=\"../three.min.js\"></script>\n    <script src=\"script.js\"></script>\n\
    </body>\n</html>\n```\n\n```\nvar width  = window.innerWidth,\n    height = window.innerHeight;\n\
    var container = document.querySelector('#container');\nvar renderer = new THREE.WebGLRenderer();\n\
    renderer.setSize(width, height);\ncontainer.appendChild(renderer.domElement);\n\
    \nvar VIEW_ANGLE = 45,\n    NEAR = 0.1,\n    FAR = 10000;\nvar camera =  new THREE.PerspectiveCamera(45,\
    \ width / height, 1, 1000);\ncamera.position.z = 300;\n\nvar scene = new THREE.Scene();\n\
    scene.add(camera);\n\nvar directionalLight = new THREE.DirectionalLight();\ndirectionalLight.position.z\
    \ = 10;\nscene.add(directionalLight);\n\nvar radius = 100,\n    segments = 50,\n\
    \    rings = 50;\nvar sphereMaterial = new THREE.MeshLambertMaterial({\n    color:\
    \ 0xFF0000\n});\n\nvar sphere = new THREE.Mesh(\n    new THREE.SphereGeometry(\n\
    \        radius,\n        segments,\n        rings),\n    sphereMaterial);\n\n\
    scene.add(sphere);\n\nfunction logic()  {\n    requestAnimationFrame(render);\n\
    }\n\nfunction render() {\n    renderer.render(scene, camera);\n}\n\nsetInterval(logic,\
    \ 1000/60);\n```\n\n创建每个原始形状的方法类似，因此我不逐一引导你创建每种形状，而是提供表 4-1 来展示形状类型。请注意，除非我特别说明，构造函数的每个参数都是可选的。许多几何体基于\
    \ `PolyhedronGeometry`，因此参数 `detail` 用于决定创建形状所使用的三角形数量。另外请记住，所有构造函数都应加上 `THREE`\
    \ 前缀。\n\n**表 4-1.** 展示 Three.js 中可用的几何体\n\n| 名称 | 构造函数 | 备注 |\n| --- | --- | ---\
    \ |\n| `CircleGeometry` | `CircleGeometry(radius, segments, thetaStart, thetaLength)`\
    \ | theta 参数用于创建分段；通过改变它们，可以指定特定的弧线。 |\n| `ConvexGeometry` | `ConvexGeometry(vertices)`\
    \ |  |\n| `CubeGeometry` | `CubeGeometry(width, height, depth, widthSegments,\
    \ heightSegments, depthSegment)` |  |\n| `CylinderGeometry` | `CylinderGeometry(radiusTop,\
    \ radiusBottom, height, radiusSegments, heightSegments, openEnded)` |  |\n| `ExtrudeGeometry`\
    \ | `ExtrudeGeometry(shapes, options)` | 这个有很多选项，我将在本表之后进行说明。 |\n| `IcosahedronGeometry`\
    \ | `IcosahedronGeometry(radius, detail)` |  |\n| `LatheGeometry` | `LatheGeometry(points,\
    \ segments, phiStart, phiLength)` |  |\n| `OctahedronGeometry` | `OctahedronGeometry(radius,\
    \ detail)` |  |\n| `ParametricGeometry` | `ParametricGeometry(parametricFunction,\
    \ uSegments, ySegments, useTris)` |  |\n| `PlaneGeometry` | `PlaneGeometry(width,\
    \ height, widthSegments, heightSegments)` |  |\n| `PolyhedronGeometry` | `PolyhedronGeometry(vertices,\
    \ faces, radius, detail)` |  |\n| `RingGeometry` | `RingGeometry(innerRadius,\
    \ outerRadius, thetaSegments, phiSegments, thetaStart, thetaLength)` |  |\n| `ShapeGeometry`\
    \ | `ShapeGeometry(shapes, options)` |  |\n| `SphereGeometry` | `SphereGeometry(radius,\
    \ widthSegments, heightSegments, phiStart, phiLength, thetaStart, thetaLength)`\
    \ | 我们已经介绍过球体，但和圆一样，还有一些额外选项偶尔可能有用。 |\n| `TetrahedronGeometry` | `TetrahedronGeometry(radius,\
    \ detail)` |  |\n| `TextGeometry` | `TextGeometry(text, parameters)` | 用于创建 3D\
    \ 文本，我将在本章后面部分介绍。 |\n| `TorusGeometry` | `TorusGeometry(radius, tube, radialSegments,\
    \ tubularSegments, arc)` |  |\n| `TorusKnotGeometry` | `TorusKnotGeometry(radius,\
    \ tube, radialSegments, tubularSegments, p, q, heightScale)` |  |\n| `TubeGeometry`\
    \ | `TubeGeometry(path, segments, radius, radiusSegments, closed, debug)` |  |\n"
- fmt: "### Extrusion\n\nMost of these shapes will make sense to you; however `ExtrudeGeometry`\
    \ is used differently and has many options. The purpose is to extend a shape,\
    \ such as turning a 2D shape into 3D or building on one of the faces of a 3D shape.\
    \ For this example we are going to start with some points as a path, which represent\
    \ a basic 2D right-angled triangle, from which we will produce a 2D shape (that\
    \ is, a plane created from the points in the path). With the shape created, we\
    \ then need to extrude it to make into a prism.\n\n**Note:** I have used a triangle\
    \ for simplicity. Paths are usually used to create complex shapes.\n\nThe path\
    \ is an array of points that are created using 2D vectors (which represent the\
    \ coordinates of a graph). Three.js provides a useful library for dealing with\
    \ vectors, which makes it very simple to work out the distance between two points\
    \ and similar functions. To turn the path into a shape, you can just pass the\
    \ path to the `THREE.Shape` constructor as a parameter.\n\n```\nvar path = [];\n\
    path.push( new THREE.Vector2 (   0,  50 ) );\npath.push( new THREE.Vector2 ( \
    \ 50,  50 ) );\npath.push( new THREE.Vector2 (  50,  0 ) );\nvar shape = new THREE.Shape(\
    \ path );\n```\n\nAs I mentioned earlier, `ExtrudeGeometry` has a lot of options\
    \ for defining the type of extrusion that is needed as seen in Table 4-2.\n\n\
    **Table 4-2.** Showing the options available for `ExtrudeGeometry`\n\n| `curveSegments`\
    \ | The number of points on the path, 12 by default. |\n| --- | --- |\n| `steps`\
    \ | The amount of subdivisions within every extrusion. This defaults to 32. |\n\
    | `amount` | This is the amount of extrusions to make, basically the size of the\
    \ shape, defaults to 100. |\n| `bevelEnabled` | Enables bevel, which rounds the\
    \ vertices that connect the edges of the extrusion to the faces of the shape.\
    \ This is `true` by default. |\n| `bevelThickness` | The thickness of the bevel,\
    \ defaults to 6. |\n| `bevelSize` | This is the distance from the edge that the\
    \ bevel starts. It defaults to `bevelThickness` minus 2. |\n| `bevelSegments`\
    \ | The amount of segments of the bevel, similar to that of spheres in that it\
    \ controls the quality of the bevel. Defaults to 3. |\n| `extrudePath` | A particular\
    \ path within the shape that should be extruded. |\n| `frames` | This is an array\
    \ of Frenet frames that expose the tangents, normal, and binormals of the spline.\
    \ This is out of the scope of the book, but it defaults to generating the frames\
    \ itself. |\n| `material` | This is the material index for the front and back\
    \ faces, it has no default. |\n| `extrudeMaterial` | This is the material index\
    \ for the extruded faces, it has no default. |\n| `uvGenerator` | This allows\
    \ you to specify the UV generator. By default it uses `THREE.ExtrudeGeometry.WorldUVGenerator`.\
    \ |\n\n**Note:** These options are subject to change, especially the defaults,\
    \ between versions of the library.\n\nThe code that follows creates an extruded\
    \ geometry to show how the various settings can be used to produce a fairly complicated\
    \ shape.\n\n```\nvar extrusionSettings = {\n  size: 30, height: 4, curveSegments:\
    \ 3,\n  bevelThickness: 1, bevelSize: 2, bevelEnabled: false,\n  material: 0,\
    \ extrudeMaterial: 1\n};\nvar extrude = new THREE.ExtrudeGeometry( shape, extrusionSettings\
    \ );\nvar extrudedShape = new THREE.Mesh( extrude, material );\nscene.add(extrudedShape);\n\
    ```\n\nNow, you may look at this code, see what appears on your screen, and be\
    \ a bit confused. It is meant to look like a triangle, don’t worry! It looks like\
    \ that due to the viewpoint of the camera, so let’s make the shape rotate so that\
    \ you can see it in all its 3D goodness. I quite like the effect of rotating on\
    \ the x and y axes. It kind of gives a figure-eight motion, which is useful for\
    \ seeing all sides of the shape. This code adds rotation to the shape:\n\n```\n\
    function logic()  {\n  extrudedShape.rotation.y += 0.05;\n  extrudedShape.rotation.x\
    \ += 0.05;\n  requestAnimationFrame(render);\n}\n```\n\nFigure 4-2 shows the extruded\
    \ shape with the added rotation.\n\n![A978-1-4302-5945-9_4_Fig2_HTML.jpg](A978-1-4302-5945-9_4_Fig2_HTML.jpg)\n\
    \n**Figure 4-2.** Extrusion\n\n### Text\n\nThere may be times when you need 3D\
    \ text. It is not a common use case, but perhaps you are making something that\
    \ feels like the titles of a movie or an advertisement. It is also something that\
    \ many people do not realize is easily possible, so I would like to briefly take\
    \ a look at it. The `TextGeometry` builds on the `ExtrusionGeometry` so it will\
    \ be mostly familiar. Let’s create 3D text that says “Hello World!”—because everyone\
    \ loves Hello World—that rotates in the same shape as our prism did to show how\
    \ similar they are (and because I find the rotation very mesmerizing to look at).\n\
    \n**Caution:** By default, Three.js uses a font called Helvetiker (it is not a\
    \ spelling mistake) that must be included or you should use a different font,\
    \ otherwise there will be errors. This font can be downloaded from [http://www.typeface.neocracy.org/](http://www.typeface.neocracy.org/)\
    \ and is also included in the source code for this book.\n\nI am modifying the\
    \ code we used for extrusion, so will be reusing the lighting and materials as\
    \ well as the rest of the set up code. `TextGeometry` is no different than any\
    \ other geometry, so it needs to be passed to a `Mesh` before it can be added\
    \ to the scene; this probably seems obvious but I keep forgetting! Let’s start\
    \ with the default text:\n\n```\nvar text = new THREE.Mesh(new THREE.TextGeometry(\"\
    Hello World!\", {}), material);\nscene.add(text);\n```\n\nThere are a number of\
    \ other options that we can use to customize the text as shown in Table 4-3.\n\
    \n**Table 4-3.** Showing the options available for `TextGeometry`\n\n| `size`\
    \ | The size of the text, defaults to 150. |\n| --- | --- |\n| `height` | The\
    \ thickness of the extruded text. The default is 50. |\n| `curveSegments` | The\
    \ number of points on the curve, defaults to 12. |\n| `font` | The name of the\
    \ font. The default is Helvetiker. |\n| `weight` | This is the font weight. It\
    \ can be any valid CSS font-weight, such as `normal` and `bold`. The default is\
    \ `normal`. |\n| `style` | As with weight, style allows any valid CSS font-style,\
    \ such as `normal` and `italic`. The default is `normal`. |\n| `bevelEnabled`\
    \ | Enables bevel, which rounds the vertices that connect the edges of the extrusion\
    \ to the faces of the shape. This is `false` by default. |\n| `bevelThickness`\
    \ | The thickness of the bevel, defaults to 6. |\n| `bevelSize` | This is the\
    \ distance from the edge that the bevel starts; it defaults to `bevelThickness`\
    \ minus 2. |\n\nThese options should be easy to understand because they are mostly\
    \ from the CSS font options or from `ExtrudedGeometry` that we have already discussed.\
    \ I will however show you a quick example of how these options can be used:\n\n\
    ```\nvar options = {\n  size: 20,\n  height: 20,\n  bevelEnabled: true,\n  bevelThickness:\
    \ 25\n};\nvar text = new THREE.Mesh(new THREE.TextGeometry(\"Hello World!\", options),\
    \ material);\nscene.add(text);\n```\n\nAs you can see, it is quite easy to add\
    \ text if you think of it as just another shape."
  raw: '#### Extrusion


    Most of these shapes will make sense to you; however `ExtrudeGeometry` is used
    differently and has many options. The purpose is to extend a shape, such as turning
    a 2D shape into 3D or building on one of the faces of a 3D shape. For this example
    we are going to start with some points as a path, which represent a basic 2D right-angled
    triangle, from which we will produce a 2D shape (that is, a plane created from
    the points in the path). With the shape created, we then need to extrude it to
    make into a prism.


    Note


    I have used a triangle for simplicity. Paths are usually used to create complex
    shapes.


    The path is an array of points that are created using 2D vectors (which represent
    the coordinates of a graph). Three.js provides a useful library for dealing with
    vectors, which makes it very simple to work out the distance between two points
    and similar functions. To turn the path into a shape, you can just pass the path
    to the `THREE.Shape` constructor as a parameter.


    `var path = [];`


    `path.push( new THREE.Vector2 (   0,  50 ) );`


    `path.push( new THREE.Vector2 (  50,  50 ) );`


    `path.push( new THREE.Vector2 (  50,  0 ) );`


    `var shape = new THREE.Shape( path );`


    As I mentioned earlier, `ExtrudeGeometry` has a lot of options for defining the
    type of extrusion that is needed as seen in Table [4-2](#A978-1-4302-5945-9_4_Chapter.html#Tab2).


    Table 4-2.


    Showing the options avaiable for `ExtrudeGeometry`


    | `curveSegments` | The number of points on the path, 12 by default. |

    | --- | --- |

    | `steps` | The amount of subdivisions within every extrusion. This defaults to
    32. |

    | `amount` | This is the amount of extrusions to make, basically the size of the
    shape, defaults to 100. |

    | `bevelEnabled` | Enables bevel, which rounds the vertices that connect the edges
    of the extrusion to the faces of the shape. This is (true) by default. |

    | `bevelThickness` | The thickness of the bevel, defaults to 6. |

    | `bevelSize` | This is the distance from the edge that the bevel starts. It defaults
    to `bevelThickness` minus 2. |

    | `bevelSegments` | The amount of segments of the bevel, similar to that of spheres
    in that it controls the quality of the bevel. Defaults to 3. |

    | `extrudePath` | A particular path within the shape that should be extruded.
    |

    | `frames` | This is an array of Frenet frames that expose the tangents, normal,
    and binormals of the spline. This is out of the scope of the book, but it defaults
    to generating the frames itself. |

    | `material` | This is the material index for the front and back faces, it has
    no default. |

    | `extrudeMaterial` | This is the material index for the extruded faces, it has
    no default. |

    | `uvGenerator` | This allows you to specify the UV generator. By default it uses
    `THREE.ExtrudeGeometry.WorldUVGenerator`. |


    Note


    These options are subject to change, especially the defaults, between versions
    of the library.


    The code that follows creates an extruded geometry to show how the various settings
    can be used to produce a fairly complicated shape.


    `var extrusionSettings = {`


    `size: 30, height: 4, curveSegments: 3,`


    `bevelThickness: 1, bevelSize: 2, bevelEnabled: false,`


    `material: 0, extrudeMaterial: 1`


    `};`


    `var extrude = new THREE.ExtrudeGeometry( shape, extrusionSettings );`


    `var extrudedShape = new THREE.Mesh( extrude, material );`


    `scene.add(extrudedShape);`


    Now, you may look at this code, see what appears on your screen, and be a bit
    confused. It is meant to look like a triangle, don’t worry! It looks like that
    due to the viewpoint of the camera, so let’s make the shape rotate so that you
    can see it in all its 3D goodness. I quite like the effect of rotating on the
    x and y axes. It kind of gives a figure-eight motion, which is useful for seeing
    all sides of the shape. This code adds rotation to the shape:


    `function logic()  {`


    `extrudedShape.rotation.y += 0.05;`


    `extrudedShape.rotation.x += 0.05;`


    `requestAnimationFrame(render);`


    `}`


    Figure [4-2](#A978-1-4302-5945-9_4_Chapter.html#Fig2) shows the extruded shape
    with the added rotation.


    ![A978-1-4302-5945-9_4_Fig2_HTML.jpg](A978-1-4302-5945-9_4_Fig2_HTML.jpg)


    Figure 4-2.


    Extrusion


    #### Text


    There may be times when you need 3D text. It is not a common use case, but perhaps
    you are making something that feels like the titles of a movie or an advertisement.
    It is also something that many people do not realize is easily possible, so I
    would like to briefly take a look at it. The `TextGeometry` builds on the `ExtrusionGeometry`
    so it will be mostly familiar. Let’s create 3D text that says “Hello World!”`—`because
    everyone loves Hello World`—`that rotates in the same shape as our prism did to
    show how similar they are (and because I find the rotation very mesmerizing to
    look at).


    Caution


    By default, Three.js uses a font called Helvetiker (it is not a spelling mistake)
    that must be included or you should use a different font, otherwise there will
    be errors. This font can be downloaded from [`http://www.typeface.neocracy.org/`](http://www.typeface.neocracy.org/)
    and is also included in the source code for this book.


    I am modifying the code we used for extrusion, so will be reusing the lighting
    and materials as well as the rest of the set up code. `TextGeometry` is no different
    than any other geometry, so it needs to be passed to a `Mesh` before it can be
    added to the scene; this probably seems obvious but I keep forgetting! Let’s start
    with the default text:


    `var text = new THREE.Mesh(new THREE.TextGeometry("Hello World!", {}), material);`


    `scene.add(text);`


    There are a number of other options that we can use to customize the text as shown
    in Table [4-3](#A978-1-4302-5945-9_4_Chapter.html#Tab3).


    Table 4-3.


    Showing the options avaiable for `TextGeometry`


    | `size` | The size of the text, defaults to 150. |

    | --- | --- |

    | `height` | The thickness of the extruded text. The default is 50. |

    | `curveSegments` | The number of points on the curve, defaults to 12. |

    | `font` | The name of the font. The default is Helvetiker. |

    | `weight` | This is the font weight. It can be any valid CSS font-weight, such
    as normal and bold. The default is normal. |

    | `style` | As with weight, style allows any valid CSS font-style, such as normal
    and italic. The default is normal. |

    | `bevelEnabled` | Enables bevel, which rounds the vertices that connect the edges
    of the extrusion to the faces of the shape. This is false by default. |

    | `bevelThickness` | The thickness of the bevel, defaults to 6. |

    | `bevelSize` | This is the distance from the edge that the bevel starts; it defaults
    to `bevelThickness` minus 2. |


    These options should be easy to understand because they are mostly from the CSS
    font options or from `ExtrudedGeometry` that we have already discussed. I will
    however show you a quick example of how these options can be used:


    `var options = {`


      `size: 20,`


      `height: 20,`


      `bevelEnabled: true,`


      `bevelThickness: 25`


    `};`


    `var text = new THREE.Mesh(new THREE.TextGeometry("Hello World!", options), material);`


    `scene.add(text);`


    As you can see, it is quite easy to add text if you think of it as just another
    shape.'
  trans: "\n### 拉伸（Extrusion）\n\n这些形状中的大多数你都能理解；然而 `ExtrudeGeometry`（拉伸几何体）的使用方式不同，并且具有许多选项。其目的是扩展一个形状，例如将\
    \ 2D 形状转化为 3D，或者在 3D 形状的某个面上进行构建。在这个示例中，我们将从一些点作为路径开始，这些点代表一个基本的 2D 直角三角形，我们将由此生成一个\
    \ 2D 形状（即，由路径中的点创建的平面）。形状创建完毕后，我们需要对其进行拉伸以形成一个棱柱。\n\n**提示：** 为了简单起见，我使用了三角形。路径通常用于创建复杂的形状。\n\
    \n该路径是一个点数组，这些点使用 2D 向量（表示图形的坐标）创建。Three.js 提供了一个处理向量的实用库，使得计算两点之间的距离以及执行类似功能变得非常简单。要将路径转换为形状，只需将路径作为参数传递给\
    \ `THREE.Shape` 构造函数即可。\n\n```\nvar path = [];\npath.push( new THREE.Vector2 (\
    \   0,  50 ) );\npath.push( new THREE.Vector2 (  50,  50 ) );\npath.push( new\
    \ THREE.Vector2 (  50,  0 ) );\nvar shape = new THREE.Shape( path );\n```\n\n\
    正如我之前提到的，`ExtrudeGeometry` 有许多选项用于定义所需的拉伸类型，如表 4-2 所示。\n\n**表 4-2.** `ExtrudeGeometry`\
    \ 的可用选项\n\n| `curveSegments` | 路径上的点数，默认为 12。 |\n| --- | --- |\n| `steps` | 每次拉伸中的细分数量，默认为\
    \ 32。 |\n| `amount` | 拉伸的数量，基本上是形状的尺寸，默认为 100。 |\n| `bevelEnabled` | 启用倒角，它会使连接拉伸边缘与形状面的顶点变得圆滑。默认值为\
    \ `true`。 |\n| `bevelThickness` | 倒角的厚度，默认为 6。 |\n| `bevelSize` | 倒角开始的边缘距离，默认值为\
    \ `bevelThickness` 减去 2。 |\n| `bevelSegments` | 倒角的段数，类似于球体的分段数，用于控制倒角的质量。默认为\
    \ 3。 |\n| `extrudePath` | 形状中需要被拉伸的特定路径。 |\n| `frames` | 一个 Frenet 框架数组，用于显示样条曲线的切线、法线和副法线。这超出了本书的范围，但默认情况下会自行生成框架。\
    \ |\n| `material` | 前后面材质的索引，无默认值。 |\n| `extrudeMaterial` | 拉伸面材质的索引，无默认值。 |\n\
    | `uvGenerator` | 允许你指定 UV 生成器。默认情况下使用 `THREE.ExtrudeGeometry.WorldUVGenerator`。\
    \ |\n\n**提示：** 这些选项（尤其是默认值）在不同版本的库中可能会有所变化。\n\n下面的代码创建了一个拉伸几何体，以展示如何使用这些不同的设置来生成一个相当复杂的形状。\n\
    \n```\nvar extrusionSettings = {\n  size: 30, height: 4, curveSegments: 3,\n \
    \ bevelThickness: 1, bevelSize: 2, bevelEnabled: false,\n  material: 0, extrudeMaterial:\
    \ 1\n};\nvar extrude = new THREE.ExtrudeGeometry( shape, extrusionSettings );\n\
    var extrudedShape = new THREE.Mesh( extrude, material );\nscene.add(extrudedShape);\n\
    ```\n\n现在，你可能会看这段代码，再看屏幕上显示的内容，感到有点困惑。它本应看起来像一个三角形，别担心！由于相机的视角，它看起来像那样，所以我们让这个形状旋转，这样你就能看到它的\
    \ 3D 效果。我非常喜欢在 x 轴和 y 轴上旋转的效果。它产生了一种类似“8”字形的运动，这对于观察形状的所有侧面非常有用。这段代码为形状添加了旋转：\n\
    \n```\nfunction logic()  {\n  extrudedShape.rotation.y += 0.05;\n  extrudedShape.rotation.x\
    \ += 0.05;\n  requestAnimationFrame(render);\n}\n```\n\n图 4-2 展示了添加旋转后的拉伸形状。\n\
    \n![A978-1-4302-5945-9_4_Fig2_HTML.jpg](img/A978-1-4302-5945-9_4_Fig2_HTML.jpg)\n\
    \n**图 4-2.** 拉伸效果\n\n### 文本（Text）\n\n有时你可能会需要 3D 文本。这不是一个常见的用例，但也许你在制作类似电影标题或广告的东西。这也是许多人不意识到可以轻松实现的功能，所以我想简要地看一下。`TextGeometry`\
    \ 构建在 `ExtrusionGeometry` 之上，因此大部分内容都是熟悉的。让我们创建一段显示“Hello World!”的 3D 文本——因为每个人都喜欢\
    \ Hello World——它像我们的棱柱一样以相同的方式旋转，以展示它们有多么相似（而且我觉得这种旋转看起来非常迷人）。\n\n**警告：** 默认情况下，Three.js\
    \ 使用一种名为 Helvetiker（这不是拼写错误）的字体，必须包含该字体，或者你应该使用不同的字体，否则会出现错误。该字体可以从 [`www.typeface.neocracy.org/`](http://www.typeface.neocracy.org/)\
    \ 下载，也包含在本书的源代码中。\n\n我正在修改我们用于拉伸的代码，因此将重复使用光照、材质以及其余设置代码。`TextGeometry` 与其他几何体没有什么不同，因此在添加到场景之前，需要将其传递给\
    \ `Mesh`（网格）；这似乎显而易见，但我总是忘记！让我们从默认文本开始：\n\n```\nvar text = new THREE.Mesh(new\
    \ THREE.TextGeometry(\"Hello World!\", {}), material);\nscene.add(text);\n```\n\
    \n如表 4-3 所示，还有许多其他选项可用于自定义文本。\n\n**表 4-3.** `TextGeometry` 的可用选项\n\n| `size` |\
    \ 文本的大小，默认为 150。 |\n| --- | --- |\n| `height` | 拉伸文本的厚度，默认为 50。 |\n| `curveSegments`\
    \ | 曲线上的点数，默认为 12。 |\n| `font` | 字体名称，默认为 Helvetiker。 |\n| `weight` | 字体粗细。可以是任何有效的\
    \ CSS `font-weight`，例如 `normal` 和 `bold`。默认为 `normal`。 |\n| `style` | 与 weight\
    \ 类似，style 允许任何有效的 CSS `font-style`，例如 `normal` 和 `italic`。默认为 `normal`。 |\n|\
    \ `bevelEnabled` | 启用倒角，它会使连接拉伸边缘与形状面的顶点变得圆滑。默认值为 `false`。 |\n| `bevelThickness`\
    \ | 倒角的厚度，默认为 6。 |\n| `bevelSize` | 倒角开始的边缘距离，默认值为 `bevelThickness` 减去 2。 |\n\n\
    这些选项应该很容易理解，因为它们大多来自 CSS 字体选项或我们已经讨论过的 `ExtrudedGeometry`。不过，我将向你展示一个关于如何使用这些选项的简单示例：\n\
    \n```\nvar options = {\n  size: 20,\n  height: 20,\n  bevelEnabled: true,\n  bevelThickness:\
    \ 25\n};\nvar text = new THREE.Mesh(new THREE.TextGeometry(\"Hello World!\", options),\
    \ material);\nscene.add(text);\n```\n\n如你所见，如果你将文本视为另一种形状，添加文本是非常容易的。\n"
- fmt: "# 照明\n\n照明是我认为真正“设定场景”的一个要素（请原谅我的双关），因为整个场景依赖于照明来决定显示什么（以及同样重要的阴影是什么），以及整体的氛围。就像在电影中一样，照明可以用来完全改变用户的感受。我不会深入探讨用户体验设计，但这一点值得记住和思考！\n\
    \n> **注意**  \n> 由于照明依赖于物体的材质，你需要确保材质设置正确。这将在下一节中解释，但现在请确保使用`MeshLambertMaterial`或`MeshPongMaterial`，因为它们被设置为可以与灯光配合使用。\n\
    \n我将介绍一些更常用的照明类型；当然还有其他类型，你也可以创建自己的照明，我们可能会在后面稍作提及。每种类型的灯光都有许多属性和参数，尽管有些比其他的更多，以下是你应该熟悉的一些内容：\n\
    \n- **强度（Intensity）**：灯光的强度是指它的亮度，数值范围可以从0到1，其中1是灯光的实际颜色，0是不可见（就像关闭了一样）。默认值通常为1。有些灯光没有强度属性（至少在撰写本文时是如此），但你总是可以通过将每个RGB颜色乘以一个强度变量来模拟。\n\
    - **十六进制颜色（Hex）**：这是一种必须采用十六进制形式的颜色（例如白色为`0xffffff`）。通常默认值为白色。\n- **阴影（Shadows）**：关于阴影有不少属性，例如灯光是否投射阴影。我将在解释完每种灯光类型后再讨论这些属性。\n\
    \n在整个章节中，我们一直使用`DirectionalLight`作为场景中唯一的光源。如前所述，`DirectionalLight`是一种朝特定方向投射的光源，并且会影响该方向上所有物体，无论它们与光源的距离如何。我还应该提醒你之前关于`DirectionalLight`的说法：它实际上并没有具体的位置，相反，你设置的位置是它向场景原点投射光线的起始位置。`DirectionalLight`的语法如下：\n\
    \n```\nTHREE.DirectionalLight(hex, intensity)\n```\n\n另一方面，`PointLight`会向所有方向发射光线，但如果设置了距离，它对物体的影响会因物体与光源的距离而有所不同。当距离设置为0（默认值）时，灯光会像`DirectionalLight`一样影响所有物体。`PointLight`的语法如下：\n\
    \n```\nTHREE.PointLight(hex, intensity, distance)\n```\n\n还有一种名为`SpotLight`的灯光，它可以像`DirectionalLight`一样使用，但可以更精确地控制。`SpotLight`和`DirectionalLight`的一个区别是角度。`DirectionalLight`的光线朝大致方向发射，而`SpotLight`则在指定的角度范围内（默认为`pi/2`）定向发射光线。它也可以像`PointLight`一样覆盖指定的距离。如果你只是想照亮一个场景，通常可以使用前两种灯光，但如果你想仔细引导光照，那么这是理想的光源。`SpotLight`的语法如下：\n\
    \n```\nTHREE.SpotLight(hex, intensity, distance, angle, exponent)\n```\n\n我之前提到过照明可以营造氛围。有一种专门用于此目的的灯光，正如你所料，叫做`AmbientLight`。这种灯光会影响到场景中所有能被光源影响的物体。因为它用于增强照明，所以应只与其他灯光配合使用。`AmbientLight`的语法如下：\n\
    \n```\nTHREE.AmbientLight(hex)\n```\n\n你可能会发现`AmbientLight`会优先于所有其他灯光，要解决这个问题，只需调整其强度，使其成为弱光（环境光）。改变强度的示例如下：\n\
    \n```\nvar light = new THREE.AmbientLight();\nvar intensity = 0.025;\nscene.add(light);\n\
    light.color.setRGB(20 * intensity, 0 * intensity, 255 * intensity);\n```\n\n很多时候，你会想确切地了解灯光在做什么、它们的位置以及光线投射的方向。有很多方法可以实现这一点——你可以使用控制台查看每个灯光的属性，但我建议采用更图形化的方式。对于许多灯光，Three.js提供了辅助对象，可以用线条显示方向。如果你有一个`DirectionalLight`，那么可以使用`DirectionalLightHelper`，它会以虚线形式显示其指向的方向。你可以通过更改材质来改变线条的类型，例如颜色或虚线样式。大多数灯光也都有辅助工具，例如`SpotLightHelper`可用于显示光线的角度。\n\
    \n另一种查看光源的方法是（例如在灯光的位置创建一个球体对象），如下所示：\n\n```\nvar lightDebug = new THREE.Mesh(new\
    \ THREE.SphereGeometry(5), new THREE.MeshBasicMaterial());\nlightDebug.position\
    \ = light.position;\nscene.add(lightDebug);\n```\n\n使用这种方法的一种方式——我更喜欢这种方式，而且我知道很多其他人也经常使用这种技术——是将球体做得非常小，这样你既能看到它，它又看起来更像是动画的一部分，而不是调试模式。"
  raw: '#### Lighting


    Lighting is the one thing that I find really “sets the scene” (if you will pardon
    my pun) because the entire scene depends on the lighting for what will show (and
    what will be shadows, which is equally important) as well as the general ambience.
    Just like in a film, lighting can be used to completely change how the user feels.
    I will not get into user experience design, but it is worth remembering and thinking
    about!


    Note


    Because the lighting is dependent on the material of the object, you need to make
    sure the material is set up correctly. This will be explained in the next section,
    but for now make sure to use either `MeshLambertMaterial` or `MeshPongMaterial`
    because they are set up to work with lights.


    I am going to go through some of the more commonly used types of lighting; of
    course there are others and you can create your own, some of which we may touch
    on briefly later. Each type of light has a number of properties and parameters,
    though some have more than others, here are a few that you should be familiar
    with:


    *   Intensity: The intensity of a light is how bright it is, the number can range
    from 0 to 1, where 1 is the actual color of the light and 0 is invisible (as if
    it is turned off). The default is usually 1\. Some lights do not have intensity
    (at least at the time of writing) but you can always mimic it by multiplying each
    RGB color by an intensity variable.

    *   Hex: This is a color that must be in the form of hex (such as white being
    0xffffff). Usually this defaults to white.

    *   Shadows: There are quite a few properties about shadows, such as whether the
    light casts shadows. I discuss these once I have explained each type of light.


    Throughout the chapter we have been using a `DirectionalLight` as the only light
    source in the scene. As I explained earlier, a `DirectionalLight` is a light source
    that is cast in a particular direction and affects every object in that direction
    regardless of distance from the source. I should also remind you what I said earlier
    about `DirectionalLight` not having an actual position as such, instead the position
    that you set is the location from which it directs the light to the origin of
    the scene. The syntax for `DirectionalLight` is


    `THREE.DirectionalLight (hex, intensity)`


    A `PointLight` on the other hand emits light in all directions but the effect
    on the objects can differ depending on the distance from the source if a distance
    is set. When the distance is set to 0 (which it is by default), then the light
    will affect all objects like `DirectionalLight`s do. The syntax for `PointLight`
    is


    `THREE.PointLight (hex, intensity, distance)`


    There is another light, called a `SpotLight`, which can be used like a `DirectionalLight`
    but can be controlled much more precisely. One difference between `SpotLight`
    and `DirectionalLight` is angles. With a `DirectionalLight` the light emits in
    the general direction, whereas a `SpotLight` emits the light directionally within
    a specified angle (that defaults to pi/2). It also can cover a specified distance
    like the `PointLight`. You can usually use the other two lights if you want to
    just light a scene, but if you want to carefully direct the lighting, then this
    is the ideal light source. The syntax for `SpotLight` is


    `THREE.SpotLight (hex, intensity, distance, angle, exponent)`


    I mentioned about lighting causing an ambience. There is a light just for that
    called, as you might expect, `AmbientLight`. This light affects every object in
    the scene that can be affected by a light source. Because it is used to enhance
    the lighting, it should only be used with other lighting. The syntax for `AmbientLight`
    is


    `THREE.AmbientLight (hex)`


    You will probably find that the `AmbientLight` takes priority over all other lighting,
    and to fix that just change the intensity so that it is only a weak light (ambient).
    An example of changing intensity is


    `var light = new THREE.AmbientLight();`


    `var intensity = 0.025;`


    `scene.add(light);`


    `light.color.setRGB( 20 * intensity, 0 * intensity, 255 * intensity );`


    Quite often you will want to know exactly what the lights are doing, where they
    are positioned, and the direction that the light is being cast. There are many
    ways to do this`—`you could use the console to look at the properties of each
    light but I would suggest something more graphical. For many of the lights, Three.js
    provides helper objects that show the direction using lines. If you have a `DirectionalLight`,
    then you can use a `DirectionalLightHelper`, which shows a dotted line in the
    direction it is pointing. You can change the type of line, such as color or dashes,
    by changing the material. Most of the lights also have helpers, such as the `SpotLightHelper`
    that can be used to show the angle of light.


    Another way to see the light source is to create an object (such as a sphere)
    in the position of the light, which you can see here:


    `var lightDebug = new THREE.Mesh(new THREE.SphereGeometry(5), new THREE.MeshBasicMaterial());`


    `lightDebug.position = light.position;`


    `scene.add(lightDebug);`


    One way of using this version, which is what I prefer and I know many other people
    use the technique quite often, is to make the sphere quite small so that you can
    see it but it looks more like part of the animation rather than a debug mode.'
