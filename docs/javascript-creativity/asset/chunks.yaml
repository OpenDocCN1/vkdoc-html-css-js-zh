  trans: '

    # Viola–Jones


    正如你从上一节可能猜到的，驱动`js-objectDetect`和 OpenCV 目标检测器的算法，基于保罗·维奥拉和迈克尔·琼斯在 2001 年撰写的一篇论文（后来由莱纳·林哈特改进），通常简称为
    Viola–Jones 算法。我不会详细介绍该算法，因为它相当复杂，但如果你对计算机视觉或人工智能有浓厚的兴趣，那么它或许值得一读。原论文确实包含了一些相当高级的数学内容，但它的写作方式应该不会太难理解。该算法的工作原理大致是：获取两组图像——正匹配和负匹配；通过用一个试图匹配图像窗口内容与哈尔特征的小窗口遍历每一张图像，来训练算法。与所有训练一样，样本集越大，结果就应该越准确。


    这篇论文将该算法描述为一个“视觉目标检测框架”，因此它可以以多种不同的方式实现。该论文包含了三个主要贡献，它们可以被视为任何基于 Viola–Jones 的人脸检测算法的主要组成部分。第一个组成部分是积分图像，正如我之前所解释的，这是哈尔特征如此高效的原因。第二个组成部分是基于
    AdaBoost 的学习算法。他们提出的最后一个对人脸检测很重要的组成部分是级联分类器，它用于快速丢弃图像的背景。值得注意的是，用于检测的算法与用于训练的算法是相同的，因此使用分类器不需要额外的步骤。分类器是训练的结果，我们将使用预定义的级联，这样就不需要训练了（因为这需要大规模数据集，且可能耗时很长）。`js-objectDetect`库包含了一些作为示例的分类器（包括嘴部、眼睛和手部的分类器，而不仅仅是人脸），因此本章我们将使用这些分类器。级联分类器有两种类型：桩和树。桩是树的一个单一节点，由于其在准确性和效率之间的平衡，通常是最佳选择，因此`js-objectDetect`库只处理以
    JSON 格式存储的桩级联。


    # 使用 `js-objectDetect`


    这个库使得使用极其强大的 Viola–Jones 算法变得非常容易，甚至无需安装 OpenCV（一个大型的 C++计算机视觉框架）。它采用 GPL 许可证，因此你可以自由阅读和修改其代码。它也有很好的注释，所以如果你对
    Viola–Jones 算法的实现细节感兴趣，这绝对是一个好的起点。在下一章中，我们将使用目标检测作为输入，但在本章中，为了演示追踪，我们将改为在人脸周围绘制一个矩形框。人脸检测是计算机视觉的常见用途，因为它是大多数更高级计算机视觉主题（如人脸识别或眼球追踪）的基础。


    **注意：** 与运动检测一样，追踪仍然依赖于网络摄像头生成的 2D 图像，因此它可能不是完全准确的，并且需要良好的照明条件以及只能追踪一张人脸。


    实际上，使用`js-objectDetect`进行人脸检测非常容易；只需引入该库并运行一小段 JavaScript 代码即可。它不使用 canvas，因此可以直接将`getUserMedia`与视频元素配合使用，而无需考虑
    canvas 上下文。该库当然包含在本书附带的下载文件中。我加入了一个带有`cursor`类的 div；这是包围检测到人脸的框。


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>网络摄像头应用</title>

    <style>

    html, body { margin: 0; padding: 0; }

    video { position: absolute; top: 0; left: 0;  }

    </style>

    </head>

    <body>

    <video></video>

    <div class="cursor"></div>

    <script src="js-objectDetect/compatibility.js"></script>

    <script src="js-objectDetect/smoother.js"></script>

    <script src="js-objectDetect/objectdetect.js"></script>

    <script src="js-objectDetect/objectdetect.frontalface.js"></script>

    <script src="js-objectDetect/jquery.js"></script>

    <script src="js-objectDetect/jquery.objectdetect.js"></script>

    <script src="script.js"></script>

    </body>

    </html>

    ```


    所需的 JavaScript 代码（位于`script.js`内）包含一个设置函数，用于处理视频元素的尺寸以及`getUserMedia`，该函数会调用绘制函数在每一帧上运行检测。还有一个
    jQuery 函数用于实际在人脸周围绘制方形框。它通过从库中获取尺寸，并修改 div 的 CSS 来适应它。


    ```javascript

    window.URL = window.URL || window.webkitURL;

    navigator.getUserMedia  =  navigator.getUserMedia ||

    navigator.webkitGetUserMedia ||

    navigator.mozGetUserMedia ||

    navigator.msGetUserMedia;

    if (navigator.getUserMedia === undefined) {

    if (console !== undefined) {

    console.log("浏览器不支持 getUserMedia");

    }

    }

    window.addEventListener(''DOMContentLoaded'', setup);

    function setup()  {

    videoElement = document.querySelector("video");

    videoElement.width = w = window.innerWidth;

    videoElement.height = h = window.innerHeight;

    videoElement.autoplay = true;

    navigator.getUserMedia({video: true}, function (stream) {

    videoElement.src = window.URL.createObjectURL(stream);

    videoElement.addEventListener(''canplay'', draw);

    }, function() {});

    }

    $.fn.highlight = function(rect, color) {

    $(''.cursor'').css({

    "border":   "2px solid " + color,

    "position": "absolute",

    "left":     ($(this).offset().left + rect[0]) + "px",

    "top":      ($(this).offset().top  + rect[1]) + "px",

    "width":    rect[2] + "px",

    "height":   rect[3] + "px",

    "z-index": 2

    });

    }

    function draw()  {

    $("video").objectdetect("all", {classifier: objectdetect.frontalface}, function(faces)
    {

    for (var i = 0; i < faces.length; ++i) {

    $(this).highlight(faces[i], "red");

    }

    });

    requestAnimationFrame(draw);

    }

    ```


    # 总结


    我希望通过本章，你对如何实时处理视频并利用它产生实用的解决方案有了更深入的理解。运动检测和目标追踪是计算机视觉的两个关键起点。虽然目前网络上计算机视觉的应用场景可能还不多，但我们开始看到越来越多的应用，例如在照片中检测人脸以便标记人物。一些公司（*咳咳*
    脸书）甚至在推进人脸识别，而这正是基于人脸检测的。许多人认为计算机视觉极其复杂，只有学术界才需要关注，但事实并非如此。我强烈建议你进一步探索这个主题，其中很多内容超出了本书的范围，但如果你查看附录，你会找到一些额外的信息和有用的资源以便进一步阅读。下一章将基于本章的一些概念进行构建，尽管我们将使用一个相当简单的算法来检测手指的运动，以便我们可以用它来在本书前面构建的键盘上弹奏一个音符。希望你能看到，无论是通过编写简单算法还是利用他人已有的库，入门计算机视觉并不像大多数人想象的那么困难，而且现在通过使用
    HTML5 和 JavaScript 就能实现，甚至更加容易，无需依赖 C++或其他更复杂的语言！

