  trans: '

    ### 添加数据


    我们有一个显示随机节点的节点图，看起来不错，但背后其实没有任何意义。我创建了一个名为 `data.js` 的 JavaScript 文件（其中包含一个名为
    `data` 的 JSON 变量，便于访问），里面包含了四位演员和三位电影。我们将用它来创建一个微型节点图，将电影显示为连接演员节点的边。虽然数据不多，但这能让你很好地了解如何将图用于数据可视化。以下是我们将使用的数据：


    ```

    var data = {


    "People": [


    {


    "Id" : 0,


    "Name": "Tom Cruise",


    "Films": [1, 2]


    },


    {


    "Id" : 1,


    "Name": "Morgan Freeman",


    "Films": [1,3,5]


    },


    {


    "Id" : 2,


    "Name": "Bruce Willis",


    "Films": [3, 4]


    },


    {


    "Id" : 3,


    "Name": "Mary-Louise Parker",


    "Films": [3]


    }


    ],


    "Films": [


    {


    "Id": 0,


    "Name": "Oblivion",


    "Cast": [0, 1]


    },


    {


    "Id": 1,


    "Name": "Mission: Impossible",


    "Cast": [0]


    },


    {


    "Id": 2,


    "Name": "RED",


    "Cast": [1, 2, 3]


    },


    {


    "Id": 3,


    "Name": "Die Hard",


    "Cast": [2]


    },


    {


    "Id": 4,


    "Name": "The Shawshank Redemption",


    "Cast": [1]


    }


    ]


    }

    ```


    要创建这个图，我们使用之前编写的代码，但需要对其进行修改，以读取 `data` 对象，从而根据演员共同出演的电影在他们之间建立连接。虽然显示所有连接可能更有用，但我决定在这个示例中最好只显示他们之间有连接的情况，而不是为每部电影都画一条单独的线。我通过检查节点是否已在另一个节点的边数组中来实现了这一点。


    这段代码与之前代码的主要区别在于 `drawGraph()` 函数，我们现在将人物数据分配给每个节点。绘制节点后，我们需要遍历每部电影，在影片对应的每个节点上为参演演员列表中的每个人创建一条边，将其连接到列表中的前一个人（前提是他们尚未连接）。


    ```

    drawGraph();


    function drawGraph()  {


    var people = data["People"];


    var films = data["Films"];


    for (var i = 0; i < people.length; i++)  {


    nodes[i] = new Node();


    nodes[i].name = people[i].Name;


    nodes[i].films = people[i].Films;


    drawNode(nodes[i]);


    }


    for (var i = 0; i < films.length; i++)  {


    var cast = films[i]["Cast"];


    console.log(cast);


    if (cast.length > 1)  {


    for (var j = 1; j < cast.length; j++)  {


    if (nodes[cast[j-1]].edges.indexOf(cast[j]) == -1)  {


    console.log(j)


    console.log(nodes[cast[j-1]]);


    nodes[cast[j-1]].edges.push(cast[j]);


    }


    }


    }


    }


    for (var i = 0; i < nodes.length; i++)  {


    drawEdges(nodes[i]);


    }


    }

    ```


    最后，需要显示每个节点对应的人物名字。由于我们已经为每个节点创建了一种材质，赋予了节点自身的颜色，我们可以利用这一点，让文本颜色与节点颜色匹配。我设置了文本的尺寸和高度（拉伸）为
    10，但这只是一个看起来不错的随意数值——你可以随意更改。另外，正如我之前提到的，或许可以考虑在点击节点时才显示文本，因为随着节点增多，文本会变得难以辨认。这部分应添加到
    `drawNode` 函数的末尾：


    ```

    var text_object = new THREE.Mesh(new THREE.TextGeometry(node.name, { size : 10,
    height: 10}), material);


    text_object.position.x = draw_object.position.x;


    text_object.position.y = draw_object.position.y;


    text_object.position.z = draw_object.position.z;


    scene.add(text_object);

    ```


    图 4-4 展示了本章的最终成果：一个表示数据并在节点旁显示名字的节点图。


    ![A978-1-4302-5945-9_4_Fig4_HTML.jpg](img/A978-1-4302-5945-9_4_Fig4_HTML.jpg)


    **图 4-4.** 表示数据的最终节点图


    与往常一样，完整的代码可在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)
    或我自己的网站 [`www.shanehudson.net/javascript-creativity`](http://www.shanehudson.net/javascript-creativity)
    上找到。


    ## 小结


    在本章中，你从让物体出现的 3D 基础知识起步，逐步发展到将其用于数据可视化。仅仅在数据可视化领域，你就能做许多事情，更别提在 3D 世界中还能做的其他事情了。希望你现在对
    Three.js 已经得心应手。我鼓励你扩展本章中的示例，并动手摆弄它们，尤其是节点图。在第 5 章中，我们将使用 Web Audio API 和 SVG
    在浏览器中创作音乐（至少是声音！）。


    # 在浏览器中创作音乐


    在第 3 章中，我们使用 Web Audio API 通过创建简单的可视化和频谱图来分析音频。本章是对第 3 章的扩展，将使用该 API 来创作音乐。为此，我将介绍一些音乐理论知识，并给出几个示例，然后创建一个
    Web 应用，让用户使用基本的合成器创作音乐片段，并且能够在音轨上移动这些片段以创作自己的音乐。这个项目潜力巨大，因此你可以通过多种方式来修改它，使其成为你自己的作品，比如打造一个功能完整的基于
    Web 的数字音频工作站。

