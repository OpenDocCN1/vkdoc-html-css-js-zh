  trans: "\n### 声谱图\n\n通过之前的可视化方式，你可以轻松看到音频的频率及其变化方式，但这仅限于在任意给定时刻。现在我们要使用声谱图，它能展示音频随时间的变化过程，其中\
    \ x 轴代表时间，y 轴代表音频部分，颜色代表频率。这种技术用途广泛，小到呈现优美图案，大到实现语音识别。由于声谱图与之前的可视化方式类似，只是多了一个时间维度，我们不妨基于现有代码进行开发。这里我要介绍一个新事件：`onaudioprocess`。该事件属于`JavaScriptNode`，使用下面这行代码创建：\n\
    \n```\nvar logger = audioCtx.createJavaScriptNode(analyser.frequencyBinCount,\
    \ 1, 1);\n```\n\n`onaudioprocess`事件与音频播放速度同步运行，使其成为音频逻辑中`setInterval`的完美替代方案（类似我们使用`requestAnimationFrame`以更精确、动态的速度进行动画渲染）。我们还需要创建一个名为`x`的变量来保存当前的时间位置，以便知道需要绘制多少次才能到达当前位置。\n\
    \n```\nvar logger = audioCtx.createJavaScriptNode(analyser.frequencyBinCount,\
    \ 1, 1);\n\nlogger.onaudioprocess = function () {\n  logic();\n}\n\nvar x = 0;\n\
    \nfunction logic() {\n  if(!audioEle.paused) {\n    x += 1;\n    var freqData\
    \ = new Uint8Array(analyser.frequencyBinCount);\n    analyser.getByteFrequencyData(freqData);\n\
    \    requestAnimationFrame(function() {\n      draw(freqData);\n    });\n  }\n\
    }\n```\n\n以下是相关代码，你可以看到它与我们之前的代码非常相似，只是使用了`onaudioprocess`并检查元素是否暂停。这两个改进点都可以应用于之前的代码；我只是不想一次性把所有内容都塞进去。现在我们只需要绘制可视化图形！但从何开始呢？简单——我们首先明确要做什么。在这个案例中，我们希望绘制单个列，每个像素代表标准化后的频率（以颜色表示）。为此，我们将使用\
    \ HSL 而非 RGB，因为 HSL 允许我们将色相设置为 0 到 255 之间的数值（这正是`getByteFrequencyData`返回的值），而无需指定每种颜色。每在画布上绘制完一列，我就会清空并从起点继续绘制，如同翻新一页。你可能想通过滑动而不是清空的方式来改进此功能。\n\
    \n```\nfunction draw(freqData) {\n  if (x > canvasEle.width) {\n    canvasCtx.clearRect(0,\
    \ 0, canvasEle.width, canvasEle.height);\n    x = 0;\n  }\n  for (var i = 0; i\
    \ < freqData.length; i++) {\n    canvasCtx.fillStyle = \"hsl(\" + freqData[i]\
    \ + \",100%, 50%)\";\n    canvasCtx.fillRect(x, canvasEle.height - i, 1, 1);\n\
    \  }\n}\n```\n\n现在你应该已经理解如何利用频率数据生成各种可视化效果了，而且这些效果并非仅仅是装饰性的。图 3-2 展示了播放一些音频后声谱图的外观。完整代码一如既往地可以在本书的下载资料中找到。\n\
    \n![A978-1-4302-5945-9_3_Fig2_HTML.jpg](img/A978-1-4302-5945-9_3_Fig2_HTML.jpg)\n\
    \n**图 3-2.** 声谱图展示\n\n> **注意** 与之前的示例一样，你可能会看到一片红色；这很可能是因为音量被静音了。请调高音量以获取正确的可视化效果。\n\
    \n清单 3-2 展示了声谱图所需的完整代码，同样可以在本书的下载资料中找到。\n\n**清单 3-2. 声谱图代码**\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Chapter 3 - Spectrogram</title>\n</head>\n<body>\n\
    <audio controls onvolumechange=\"volumeChange();\">\n<source src='../audio.ogg'\
    \ type='audio/ogg; codecs=vorbis'>\n<source src='../audio.mp3' type='audio/mpeg'>\n\
    </audio>\n<canvas>Canvas is not supported by your browser</canvas>\n<script src=\"\
    script.js\"></script>\n</body>\n</html>\n\n// Pollyfill for AudioContext\n(function()\
    \ {\n  window.AudioContext = window.AudioContext || window.webkitAudioContext\
    \ || window.mozAudioContext;\n  var requestAnimationFrame = window.requestAnimationFrame\
    \ || window.mozRequestAnimationFrame ||\n  window.webkitRequestAnimationFrame\
    \ || window.msRequestAnimationFrame;\n  window.requestAnimationFrame = requestAnimationFrame;\n\
    })();\n\nvar audioEle = document.querySelector('audio');\nvar audioCtx = new AudioContext();\n\
    var canvasEle = document.querySelector('canvas');\nvar canvasCtx = canvasEle.getContext('2d');\n\
    var analyser = audioCtx.createAnalyser();\nanalyser.smoothingTimeConstant = 0;\n\
    var logger = audioCtx.createJavaScriptNode(analyser.frequencyBinCount, 1, 1);\n\
    var source = audioCtx.createMediaElementSource(audioEle);\nvar volumeControl =\
    \ audioCtx.createGainNode();\nsource.connect(volumeControl);\nvolumeControl.connect(analyser);\n\
    analyser.connect(audioCtx.destination);\nlogger.connect(audioCtx.destination);\n\
    //audioEle.addEventListener('onvolumechange', volumeControl, false);\nlogger.onaudioprocess\
    \ = function () {\n  logic();\n}\nfunction volumeChange() {\n  volumeControl.gain.value\
    \ = audioEle.volume;\n}\nvar x = 0;\nfunction logic() {\n  if(!audioEle.paused)\
    \ {\n    x += 1;\n    var freqData = new Uint8Array(analyser.frequencyBinCount);\n\
    \    analyser.getByteFrequencyData(freqData);\n    requestAnimationFrame(function()\
    \ {\n      draw(freqData);\n    });\n  }\n}\nfunction draw(freqData) {\n  if (x\
    \ > canvasEle.width) {\n    canvasCtx.clearRect(0, 0, canvasEle.width, canvasEle.height);\n\
    \    x = 0;\n  }\n  for (var i = 0; i < freqData.length; i++) {\n    canvasCtx.fillStyle\
    \ = \"hsl(\" + freqData[i] + \",100%, 50%)\";\n    canvasCtx.fillRect(x, canvasEle.height\
    \ - i, 1, 1);\n  }\n}\n```\n\n### Web Audio API 节点\n\n我们已经使用过几个 Web Audio API\
    \ 节点，例如`MediaElementSource`、`GainNode`和`Analyser`。以下是其他可用节点和方法的概述。\n\n| 节点名称 |\
    \ 描述 |\n| --- | --- |\n| `AnalyserNode` | 获取音频当前状态的数据，例如频率。 |\n| `AudioBufferSourceNode`\
    \ | 缓冲短音频资源，用作临时但易于访问的存储。 |\n| `BiquadFilterNode` | 处理基本滤波器（即低级滤波器），例如低通/高通滤波器，用于截断低于或高于给定值的频率。\
    \ |\n| `ChannelSplitterNode` | 分离每个声道，以便在处理图中单独使用它们进行更精细的控制。 |\n| `ChannelMergerNode`\
    \ | 使用此合并节点合并已分离（或需要合并）的任何声道。 |\n| `ConvolverNode` | 应用线性卷积效果，通过模拟声学空间或高质量效果来操控声音。\
    \ |\n| `DelayNode` | 将输出（到处理图中的下一个节点）延迟特定时间量。 |\n| `GainNode` | 通过将音频乘以增益属性来改变音频音量。\
    \ |\n| `MediaElementAudioSourceNode` | 允许你将媒体元素连接到 Web Audio API。 |\n| `PannerNode`\
    \ | 在三维空间中定位声音。这通常大量用于游戏中，但在其他场景也可能有用。 |\n| `WaveShaperNode` | 用于非线性失真。 |\n"
- fmt: "# Manipulating Video\n\nUnfortunately, there is no API like the Web Audio\
    \ API that is used for video so you need to manipulate the video yourself. Of\
    \ course, analyzing the video in the same way as analyzing the audio would be\
    \ far harder than using the Web Audio API. However, it is not terribly hard to\
    \ create a basic filter. I am going to go through a simple invert filter, so that\
    \ we do not get bogged down in the math. We will not go past simple filters in\
    \ this chapter because Chapters 9 and 10 will extend this chapter by using object\
    \ detection on real-time video as an input for controlling the keyboard that we\
    \ will create in Chapter 5.\n\nThe principle of invert is that we go through each\
    \ pixel and invert it, by subtracting the current value of a color from 255. The\
    \ output of this gets drawn onto a canvas, which is shown. For this example I\
    \ will be showing the canvas alongside the video element, but you may prefer to\
    \ hide the video element altogether.\n\n> **Note:** You may need to run this on\
    \ a server (or `localhost`) due to Cross-Origin Resource Sharing policies.\n\n\
    We start as usual, by setting up the variables for elements and contexts. Once\
    \ that is complete we can start on the function for manipulating the video source.\
    \ First, you need to draw the current frame of the video onto the canvas.\n\n\
    ```javascript\nvar canvasEle = document.querySelector('canvas');\nvar canvasCtx\
    \ = canvasEle.getContext('2d');\nvar videoEle = document.querySelector('video');\n\
    var w = videoEle.clientWidth;\nvar h = videoEle.clientHeight;\ncanvasEle.width\
    \ = w;\ncanvasEle.height = h;\n```\n\nWe then need to get the image data and iterate\
    \ over it, for each pixel (remember, each pixel is made out of 4 separate values\
    \ for RGBA). We flip them by subtracting the current value from 255, as I previously\
    \ explained. Once that is done, we can put the image data back and then use `requestAnimationFrame`\
    \ to call the draw function again.\n\n```javascript\ndrawInvertedFrame();\n\n\
    function drawInvertedFrame() {\n    canvasCtx.drawImage(videoEle, 0, 0, w, h);\n\
    \    var manip = canvasCtx.getImageData(0, 0, w, h);\n    var data = manip.data;\n\
    \    // Iterate through each pixel, inverting it\n    for (var i = 0; i < data.length;\
    \ i += 4) {\n        var r = data[i],\n            g = data[i+1],\n          \
    \  b = data[i+2];\n        data[i] = 255 - r;\n        data[i+1] = 255 - g;\n\
    \        data[i+2] = 255 - b;\n    }\n    canvasCtx.putImageData(manip, 0, 0);\n\
    \    requestAnimationFrame(drawInvertedFrame);\n}\n```\n\nThe following image,\
    \ Figure 3-3, shows the inverted video being rendered in real-time alongside the\
    \ original video.\n\n![A978-1-4302-5945-9_3_Fig3_HTML.jpg](A978-1-4302-5945-9_3_Fig3_HTML.jpg)\n\
    \n**Figure 3-3.** This figure shows the invert filter on a video alongside the\
    \ original\n\nAs always, the complete code listing for this is available in the\
    \ downloadable file that complements this book.\n\n## Summary\n\nThis chapter\
    \ allowed you to explore audio and video on the web. You should now have a solid\
    \ understanding of the different codecs that you can use, with the advantages\
    \ and disadvantages of each. I have tried also to delve into Web Audio API quite\
    \ deeply. I hope that by linking it into the previous chapter using visualizations\
    \ rather than just giving you a large amount of numbers, that you can understand\
    \ it and find it much more useful.\n\nI would like to encourage you to play around\
    \ with the Web Audio API as well as to try video manipulation—there are a lot\
    \ of very interesting effects that you can create that you may find useful (especially\
    \ as a visual aide and for nice details) within general web design and development.\
    \ Aside from simple websites, there is a lot of room for more of a web app kind\
    \ of thing, such as the media player we will soon be creating.\n\n# Beginning\
    \ 3D\n\nBefore we start creating the media player, I would like to spend a chapter\
    \ going through 3D from basic shapes to visualizations. In the upcoming chapters\
    \ we will be creating music visualizations as part of the media player but you\
    \ should feel comfortable with all kinds of usages of 3D, especially data visualizations.\
    \ To begin with let's take a look at 3D graphics in general, before moving on\
    \ to using a library called Three.js. Much of the basics will be familiar to you,\
    \ but I would like to start from the beginning to make sure I cover it fully.\n\
    \n## Basics of 3D\n\nAs you know, a 3D world (much like our own) consists of three\
    \ dimensions: `x`, `y`, and `z`. These dimensions can be visualized simply by\
    \ thinking of a standard Cartesian graph, where you have an axis pointing right\
    \ for `x`, another pointing up representing `y`, and a third that shows depth,\
    \ which is the `z`-axis. I say that `z` represents depth, because that is how\
    \ it feels, but actually positive `z` comes toward you while negative goes away.\
    \ You can see an example of this in Figure 4-1.\n\n![A978-1-4302-5945-9_4_Fig1_HTML.jpg](A978-1-4302-5945-9_4_Fig1_HTML.jpg)\n\
    \n**Figure 4-1.** 3D axes\n\nIn the 3D world, objects and shapes are created using\
    \ meshes. A mesh could be as complicated as you like, from a simple cube to an\
    \ object that you have designed using 3D modeling software (we will not be going\
    \ that far, but I will explain how to import the models). To give an appearance\
    \ to a mesh you can use materials, which is similar to the real world in that\
    \ each material has its own set of properties, such as color and opacity. We will\
    \ take a look at defining our own materials later in the chapter.\n\nAs well as\
    \ meshes and materials, we also have camera and lights. Whereas in a 2D animation\
    \ we often move the shapes around, in a 3D animation we have the option of moving\
    \ the camera (that is, what the user can see) around the scene. I mentioned lights\
    \ and it is obvious what these are for, but you may well be surprised at how many\
    \ different types of lighting there are. Lighting and cameras each have their\
    \ own sections later in this chapter. It can be rather impressive seeing how a\
    \ scene can be changed just by changing the type or position of the lights.\n\n\
    ### Three.js\n\nThree.js is a library that makes it much easier to render 3D within\
    \ the browser. It allows you to use a number of renderers, including canvas and\
    \ WebGL. I would usually recommend avoiding libraries but to use WebGL without\
    \ a library you need to write shaders (which are required to use WebGL due to\
    \ the reliance on a GPU) in a language called GLSL, which has syntax similar to\
    \ C. Learning GLSL is overkill for the aims of this book and would take longer\
    \ than one chapter! I will be using version 56 of Three.js, which is also included\
    \ in the downloadable source code, but you can find the latest version at [`http://www.mrdoob.github.com/three.js/`](http://mrdoob.github.com/three.js/)."
  raw: '## Manipulating Video


    Unfortunately, there is no API like the Web Audio API that is used for video so
    you need to manipulate the video yourself. Of course, analyzing the video in the
    same way as analyzing the audio would be far harder than using the Web Audio API.
    However, it is not terribly hard to create a basic filter. I am going to go through
    a simple invert filter, so that we do not get bogged down in the math. We will
    not go past simple filters in this chapter because [Chapters 9](#A978-1-4302-5945-9_9_Chapter.html)
    and [10](#A978-1-4302-5945-9_10_Chapter.html) will extend this chapter by using
    object detection on real-time video as an input for controlling the keyboard that
    we will create in [Chapter 5](#A978-1-4302-5945-9_5_Chapter.html).


    The principle of invert is that we go through each pixel and invert it, by subtracting
    the current value of a color from 255\. The output of this gets drawn onto a canvas,
    which is shown. For this example I will be showing the canvas alongside the video
    element, but you may prefer to hide the video element altogether.


    Note


    You may need to run this on a server (or localhost) due to Cross-Origin Resource
    Sharing policies.


    We start as usual, by setting up the variables for elements and contexts. Once
    that is complete we can start on the function for manipulating the video source.
    First, you need to draw the current frame of the video onto the canvas.


    `var canvasEle = document.querySelector(''canvas'');`


    `var canvasCtx = canvasEle.getContext(''2d'');`


    `var videoEle = document.querySelector(''video'');`


    `var w = videoEle.clientWidth;`


    `var h = videoEle.clientHeight;`


    `canvasEle.width = w;`


    `canvasEle.height = h;`


    We then need to get the image data and iterate over it, for each pixel (remember,
    each pixel is made out of 4 separate values for RGBA. We flip them by subtracting
    the current value from 255, as I previously explained. Once that is done, we can
    put the image data back and then use `requestAnimationFrame` to call the draw
    function again.


    `drawInvertedFrame();`


    `function drawInvertedFrame()  {`


        `canvasCtx.drawImage(videoEle, 0, 0, w, h);`


        `var manip = canvasCtx.getImageData(0, 0, w, h);`


        `var data = manip.data;`


        `// Iterate through each pixel, inverting it`


        `for (var i = 0; i < data.length; i += 4) {`


            `var r = data[i],`


                `g = data[i+1],`


                `b = data[i+2];`


            `data[i] = 255 - r;`


            `data[i+1] = 255 - g;`


            `data[i+2] = 255 - b;`


        `}`


        `canvasCtx.putImageData(manip, 0, 0);`


        `requestAnimationFrame(drawInvertedFrame);`


    `}`


    `The following image, Figure` [`3-3`](#A978-1-4302-5945-9_3_Chapter.html#Fig3)
    `, shows the inverted video` `being rendered in real-time alongside the original
    video.`


    ![A978-1-4302-5945-9_3_Fig3_HTML.jpg](A978-1-4302-5945-9_3_Fig3_HTML.jpg)


    Figure 3-3.


    `This figure shows the invert filter on a video alongside the original`


    As always, the complete code listing for this is available in the downloadable
    file that complements this book.


    ## Summary


    This chapter allowed you to explore audio and video on the web. You should now
    have a solid understanding of the different codecs that you can use, with the
    advantages and disadvantages of each. I have tried also to delve into Web Audio
    API quite deeply. I hope that by linking it into the previous chapter using visualizations
    rather than just giving you a large amount of numbers, that you can understand
    it and find it much more useful.


    I would like to encourage you to play around with the Web Audio API as well as
    to try video manipulation—there are a lot of very interesting effects that you
    can create that you may find useful (especially as a visual aide and for nice
    details) within general web design and development. Aside from simple websites,
    there is a lot of room for more of a web app kind of thing, such as the media
    player we will soon be creating.


    # 4. Beginning 3D


    Before we start creating the media player, I would like to spend a chapter going
    through 3D from basic shapes to visualizations. In the upcoming chapters we will
    be creating music visualizations as part of the media player but you should feel
    comfortable with all kinds of usages of 3D, especially data visualizations. To
    begin with let’s take a look at 3D graphics in general, before moving on to using
    a library called Three.js. Much of the basics will be familiar to you, but I would
    like to start from the beginning to make sure I cover it fully.


    ## Basics of 3D


    As you know, a 3D world (much like our own) consists of three dimensions: x, y,
    and z. These dimensions can be visualized simply by thinking of a standard Cartesian
    graph, where you have an axis pointing right for x, another pointing up representing
    y, and a third that shows depth, which is the z-axis. I say that z represents
    depth, because that is how it feels, but actually positive z comes toward you
    while negative goes away. You can see an example of this in Figure [4-1](#A978-1-4302-5945-9_4_Chapter.html#Fig1).


    ![A978-1-4302-5945-9_4_Fig1_HTML.jpg](A978-1-4302-5945-9_4_Fig1_HTML.jpg)


    Figure 4-1.


    3D axes


    In the 3D world, objects and shapes are created using meshes. A mesh could be
    as complicated as you like, from a simple cube to an object that you have designed
    using 3D modeling software (we will not be going that far, but I will explain
    how to import the models). To give an appearance to a mesh you can use materials,
    which is similar to the real world in that each material has its own set of properties,
    such as color and opacity. We will take a look at defining our own materials later
    in the chapter.


    As well as meshes and materials, we also have camera and lights. Whereas in a
    2D animation we often move the shapes around, in a 3D animation we have the option
    of moving the camera (that is, what the user can see) around the scene. I mentioned
    lights and it is obvious what these are for, but you may well be surprised at
    how many different types of lighting there are. Lighting and cameras each have
    their own sections later in this chapter. It can be rather impressive seeing how
    a scene can be changed just by changing the type or position of the lights.


    ### Three.js


    Three.js is a library that makes it much easier to render 3D within the browser.
    It allows you to use a number of renderers, including canvas and WebGL. I would
    usually recommend avoiding libraries but to use WebGL without a library you need
    to write shaders (which are required to use WebGL due to the reliance on a GPU)
    in a language called GLSL, which has syntax similar to C. Learning GLSL is overkill
    for the aims of this book and would take longer than one chapter! I will be using
    version 56 of Three.js, which is also included in the downloadable source code,
    but you can find the latest version at [`http://www.mrdoob.github.com/three.js/`](http://mrdoob.github.com/three.js/)
    .'
  trans: "\n# 处理视频\n\n遗憾的是，目前并没有类似 Web Audio API 那样专门用于视频的 API，因此你需要自行处理视频。当然，以分析音频的方式分析视频，远比使用\
    \ Web Audio API 要困难得多。不过，创建一个基础滤镜并非难事。为了避免陷入复杂的数学运算，我将介绍一个简单的反色滤镜。本章不会涉及复杂滤镜，因为第\
    \ 9 章和第 10 章将在此基础上，利用实时视频中的物体检测作为输入，来控制我们将在第 5 章创建的键盘。\n\n反色滤镜的原理是：遍历每一个像素，用 255\
    \ 减去该颜色的当前值，从而将其反转。处理后的结果会被绘制到画布上并显示出来。在这个示例中，我会同时显示画布和视频元素，但你也可以选择完全隐藏视频元素。\n\
    \n> **注意：** 由于跨域资源共享策略的限制，你可能需要在服务器（或 `localhost`）上运行此示例。\n\n我们照常先设置元素和上下文的变量。完成后，即可开始编写处理视频源的函数。首先，需要将视频的当前帧绘制到画布上。\n\
    \n```javascript\nvar canvasEle = document.querySelector('canvas');\nvar canvasCtx\
    \ = canvasEle.getContext('2d');\nvar videoEle = document.querySelector('video');\n\
    var w = videoEle.clientWidth;\nvar h = videoEle.clientHeight;\ncanvasEle.width\
    \ = w;\ncanvasEle.height = h;\n```\n\n然后，我们需要获取图像数据并遍历每个像素（记住，每个像素由 RGBA 四个独立的值组成）。如前所述，我们用\
    \ 255 减去当前值来进行反色处理。完成后，将图像数据放回，并使用 `requestAnimationFrame` 再次调用绘制函数。\n\n```javascript\n\
    drawInvertedFrame();\n\nfunction drawInvertedFrame() {\n    canvasCtx.drawImage(videoEle,\
    \ 0, 0, w, h);\n    var manip = canvasCtx.getImageData(0, 0, w, h);\n    var data\
    \ = manip.data;\n    // 遍历每个像素，进行反色处理\n    for (var i = 0; i < data.length; i\
    \ += 4) {\n        var r = data[i],\n            g = data[i+1],\n            b\
    \ = data[i+2];\n        data[i] = 255 - r;\n        data[i+1] = 255 - g;\n   \
    \     data[i+2] = 255 - b;\n    }\n    canvasCtx.putImageData(manip, 0, 0);\n\
    \    requestAnimationFrame(drawInvertedFrame);\n}\n```\n\n下图（图 3-3）展示了反色视频与原始视频的实时对比效果。\n\
    \n![A978-1-4302-5945-9_3_Fig3_HTML.jpg](img/A978-1-4302-5945-9_3_Fig3_HTML.jpg)\n\
    \n**图 3-3.** 该图展示了视频上应用反色滤镜的效果，并与原始视频进行了对比\n\n与往常一样，完整的代码清单可在本书配套的下载文件中找到。\n\n\
    ## 本章小结\n\n本章让你探索了网络中的音频和视频。你现在应该对各种可用的编解码器及其优缺点有了扎实的理解。我也尝试深入探讨了 Web Audio API。我希望通过将它与前一章的可视化内容（而不是给你一堆数字）相结合，能够帮助你理解它，并发现它更有用。\n\
    \n我鼓励你多尝试 Web Audio API 以及视频处理——你可以创造出许多非常有趣的效果，这些效果在一般的网页设计和开发中可能会很有用（尤其是作为视觉辅助和精致的细节）。除了简单的网站，还有许多空间可以开发更像网络应用的东西，比如我们即将创建的媒体播放器。\n\
    \n# 3D 入门\n\n在开始创建媒体播放器之前，我想花一章的时间来讲解 3D，从基础形状到可视化。在接下来的章节中，我们将创建音乐可视化作为媒体播放器的一部分，但你应能自如地运用各种\
    \ 3D 场景，尤其是数据可视化。首先，让我们从整体上了解一下 3D 图形，然后再使用一个名为 Three.js 的库。很多基础知识你会熟悉，但我还是希望从头开始讲起，以确保我讲得足够全面。\n\
    \n## 3D 基础\n\n如你所知，一个 3D 世界（很像我们的世界）由三个维度组成：`x`、`y` 和 `z`。可以简单地通过一个标准的笛卡尔坐标图来想象这些维度：有一个指向右方的轴表示\
    \ `x`，另一个指向上方的轴表示 `y`，还有一个表示深度的轴，那就是 `z` 轴。我说 `z` 表示深度，因为感觉如此，但实际上，正 `z` 朝向您，负\
    \ `z` 则远离您。你可以在图 4-1 中看到一个示例。\n\n![A978-1-4302-5945-9_4_Fig1_HTML.jpg](img/A978-1-4302-5945-9_4_Fig1_HTML.jpg)\n\
    \n**图 4-1.** 3D 坐标轴\n\n在 3D 世界中，物体和形状是通过网格（Mesh）来创建的。网格可以像简单的立方体那样简单，也可以像你用 3D\
    \ 建模软件设计出的物体那样复杂（我们不会涉及那么深入，但我会解释如何导入模型）。要赋予网格外观，可以使用材质（Material），这类似于现实世界，每种材质都有其自身的属性集，例如颜色和不透明度。我们将在本章后面学习如何定义自己的材质。\n\
    \n除了网格和材质，我们还有相机和灯光。在 2D 动画中，我们经常移动形状；而在 3D 动画中，我们可以选择移动相机（即用户可以看到的内容）来围绕场景旋转。我提到了灯光，它的作用显而易见，但你可能会惊讶于灯光的种类之多。灯光和相机各自在本章后面有专门的章节介绍。仅仅通过改变灯光的类型或位置就能改变一个场景的氛围，这往往令人印象深刻。\n\
    \n### Three.js\n\nThree.js 是一个库，它让在浏览器中渲染 3D 变得容易得多。它允许你使用多种渲染器，包括 canvas 和 WebGL。我通常建议避免使用库，但要在没有库的情况下使用\
    \ WebGL，你需要用一种叫 GLSL 的语言来编写着色器（由于依赖 GPU，使用 WebGL 必须有着色器），其语法类似于 C 语言。为了本书的目标而学习\
    \ GLSL 有些大材小用，而且花费的时间会超过一个章节！我将使用 Three.js 的 56 版本，该版本也包含在可下载的源代码中，但你可以在 [`http://www.mrdoob.github.com/three.js/`](http://mrdoob.github.com/three.js/)\
    \ 找到最新版本。\n"
- fmt: "#### Make a Scene\n\nYou can think of a scene in the same way as you would\
    \ in a film—it is where you put the meshes (objects), lighting, and cameras. The\
    \ scene is your stage. You can set up a scene quite simply, as all you require\
    \ is the scene itself, a camera, and the renderer. Of course, that would be an\
    \ empty scene! A simple scene object can be created using `THREE.Scene()` so let’s\
    \ go ahead and create a basic (empty) scene. Afterward we can start adding basic\
    \ geometry such as cubes or spheres.\n\nWe can start by creating variables for\
    \ width and height to store the size of the renderer (that is, our viewport) so\
    \ for this example I am going to set each to use the dimensions of the inner window.\
    \ We also need a container to put the renderer in, unlike previous chapters where\
    \ we made a canvas ourselves; we can let Three.js create the DOM, depending on\
    \ the renderer we choose. Now we need to choose the renderer, Three.js is built\
    \ in such a way that you can create your own renderer or use a third-party’s renderer\
    \ but the only ones you really need to know about are the `CanvasRenderer` and\
    \ `WebGLRenderer`. The difference between these is that canvas is more widely\
    \ supported but WebGL is more efficient. This is because WebGL has native 3D support\
    \ (OpenGL ES 2) in which the 3D math runs on the GPU, whereas Canvas has no 3D\
    \ support (you have to write it yourself) meaning its 3D math runs in JavaScript\
    \ (much slower). So let’s just stick to using `WebGLRenderer` for now, you might\
    \ want to try both though just to get a feel for the differences (they are usually\
    \ only subtle). With the renderer chosen, I have stored it in a variable called\
    \ `renderer`, we can set the dimensions and add it to the DOM.\n\n```\nvar width\
    \  = window.innerWidth,\n    height = window.innerHeight;\nvar container = document.querySelector('#container');\n\
    var renderer = new THREE.WebGLRenderer();\nrenderer.setSize(width, height);\n\
    container.appendChild(renderer.domElement);\n```\n\nFrom here we need to create\
    \ a camera. Later in the chapter I will go through how to use multiple cameras,\
    \ but to start with let’s just have one. As with renderers, there are a couple\
    \ of default camera classes and it is very easy to code your own type of camera\
    \ by inheriting from the abstract `Camera` class. The built-in cameras are `OrthographicCamera`\
    \ and `PerspectiveCamera`, which we can use to provide different views of the\
    \ scene; you can usually consider perspective as showing a 3D view, while orthographic\
    \ shows a 2D view. For this example let’s choose the perspective because we just\
    \ want to see what is on the scene (which to start with will be nothing) rather\
    \ than a particular view (such as top down). For our `PerspectiveCamera` there\
    \ are four parameters, which according to the documentation are\n\n*   `fov`:\
    \ Camera frustum vertical field of view\n*   `aspect`: Camera frustum aspect ratio\n\
    *   `near`: Camera frustum near plane\n*   `far`: Camera frustum far plane\n\n\
    This makes sense providing you know the meaning of frustum; in this case it is\
    \ simply the portion of the view. Often these parameters are stored as variables\
    \ but since we have no use for them elsewhere at the moment, I have decided to\
    \ write the values directly as parameters to reduce the amount of lines of code.\
    \ With a camera created we can position it, for now let’s just set the camera’s\
    \ z dimension to 300 so that the scene is nicely in view once we add some meshes.\n\
    \n```\nvar camera = new THREE.PerspectiveCamera(45, width / height, 1, 1000);\n\
    camera.position.z = 300;\n```\n\nOnce we have objects in the scene, you will probably\
    \ benefit from fiddling with these numbers to get a feel for how they affect the\
    \ view of the scene. As I mentioned earlier, to create the scene itself all you\
    \ need to do is create an instance of the `Scene` class. With the scene created,\
    \ we can add the camera to it. To render the scene we use `renderer.render(scene,\
    \ camera)`; which is self-explanatory. I have decided to put this within a similar\
    \ set up to the one we used in [Chapter 2](#A978-1-4302-5945-9_2_Chapter.html).\
    \ This works very nicely as a boilerplate for developing more advanced animations\
    \ and renders.\n\n```\nvar scene = new THREE.Scene();\nscene.add(camera);\n\n\
    function logic() {\n    requestAnimationFrame(render);\n}\n\nfunction render()\
    \ {\n    renderer.render(scene, camera);\n}\n\nsetInterval(logic, 1000/60);\n\
    ```"
