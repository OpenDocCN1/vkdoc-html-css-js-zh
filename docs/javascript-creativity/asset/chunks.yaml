- fmt: "# Creating a Keyboard\n\nNow that we’ve covered some basic theory, let’s knuckle\
    \ down and create a keyboard. There are many ways we could do this, such as using\
    \ DOM or canvas but because keys are basic rectangles I have decided the best\
    \ route is SVG as it is vector. To make it easy to create the SVG and to bind\
    \ events to the keys (so that they can actually be used), we will be using a library\
    \ called `svg.js` (this can be found at `www.svgjs.com`). A piano has 88 keys\
    \ (52 white and 36 black), because this is a lot of keys to fit into an on-screen\
    \ keyboard I have decided to include only the middle 3 octaves, giving us 21 white\
    \ keys. Now, it does not make sense to allow the keyboard to only be used by a\
    \ mouse because you cannot (unless on a multi-touch screen) press multiple keys\
    \ without using the keyboard. Of course, a QWERTY keyboard only has nine letters\
    \ on the middle row so I have decided to take S to K as playable white keys and\
    \ use A or L to go down or up an octave. This is not a perfect solution because\
    \ you may want to play more than one octave at a time, but for this project it\
    \ is enough.\n\nLet’s start by defining an SVG using `var keyboard = SVG('keyboard')`;\
    \ this creates an SVG with an id of keyboard that can be accessed using a variable\
    \ of the same name. With the SVG created we can now start adding the keys, the\
    \ white keys are the easiest since we can just create keys with the width (and\
    \ position) of the SVG divided by the amount of keys needed. Because these are\
    \ the white keys, we need to set the attributes so that fill is white and stroke\
    \ is black. Another attribute we need to set is the id so that we can modify the\
    \ background (for key press) of the key later, this will be set to `\"key\"+i`\
    \ so that we can easily access each key by iterating over the 21 keys.\n\n```\n\
    var keys = [];\n\nfor (var i = 0; i < 21; i++)  {\n    keys[i] = keyboard.rect(width/21,\
    \ height);\n    keys[i].move(width/21 * i, 0);\n    keys[i].attr({ fill: '#fff',\
    \ stroke: '#000', id: \"key\"+i });\n    // Event handlers go here\n}\n```\n\n\
    We need to add rectangles for the black keys also, but instead of being directly\
    \ next to each other they are split into groups of 2 and 3, also the keys are\
    \ just over half the height of the keyboard. To split the keys into groups, I\
    \ have decided to keep it simple and just check to see whether `i` is one of the\
    \ last keys of the group. If it is, then we add the width of a white key (`width/21`)\
    \ to a variable called `prevKey` that we use to work out the position of the key.\n\
    \n```\nvar bkeys = [];\nvar prev = 0;\n\nfor (var i = 0; i < 15; i++)  {\n   \
    \ bkeys[i] = keyboard.rect(width/42, height / 1.7);\n    bkeys[i].attr({ fill:\
    \ '#000', stroke: '#000', id: \"bkey\"+i });\n    bkeys[i].move(prev + (width/(21*1.3)),\
    \ 0);\n    prev = prev + width/21;\n    if (i == 1 || i == 4 || i == 6 || i ==\
    \ 9 || i == 11)  {\n        prev += width/21;\n    }\n    // Event handlers go\
    \ here.\n}\n```\n\nYou now have a keyboard drawn to the screen, as seen in Figure\
    \ [5-2](#A978-1-4302-5945-9_5_Chapter.html#Fig2).\n\n![A978-1-4302-5945-9_5_Fig2_HTML.jpg](A978-1-4302-5945-9_5_Fig2_HTML.jpg)\n\
    \n**Figure 5-2.** The layout of the keyboard, consisting of three octaves\n\n\
    Now that we have the keyboard layout created, we need to add the event handlers\
    \ so that we can play sound as well as highlighting the key that has been pressed.\
    \ Because we have two types of input (keyboard and mouse), quite a few event handlers\
    \ are needed. `SVG.js` allows us to easily bind an event handler to each key,\
    \ which makes it easy to handle the mouse by binding `mousedown` and `mouseup`\
    \ to the keys. The `keypress` and `keyup` events are handled by adding event listeners\
    \ to the window, which is the normal way of handling events. To bind the keys\
    \ to the notes, we need to set up arrays for the top row of keys being black and\
    \ middle row being white. We also need two arrays for each because `keypress`\
    \ and `keyup` have different ids for each key. To get the correct note, because\
    \ there are not enough keys on a computer keyboard for all the notes, we need\
    \ to add the note position (using S to K as an octave) to the amount of keys in\
    \ the octave multiplied by the current octave; this means that for black keys\
    \ we use `i + octave * 5` and for white we use `i + octave * 7`. For the mouse\
