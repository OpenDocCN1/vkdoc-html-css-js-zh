    To find the length of the audio or video file we can use the `duration` property,
    which returns the duration in seconds. If the audio or video element is streaming
    a file, then the duration will be set as infinity (specifically, according to
    the spec, positive infinity) unless the streaming stops. In this case the duration
    will be returned as the amount of seconds of the length of what has been streamed.
    If the duration changes, such as in the case of the streaming, then the `durationchange`
    event is triggered, you can use an event listener to trigger styling or DOM changes
    to let the user know a file has stopped streaming.


    `var ele = document.querySelector(''audio'');`


    `// Or: var ele = document.querySelector(''video'');`


    `console.log(ele.duration);`


    ### Volume


    The `volume` property can be used to both get and set the volume; it is controlled
    using a number between 0.0 and 1.0\. By default the initial volume will be 1.0,
    which is the maximum that the browser will allow (not necessarily the maximum
    of the speakers). The volume is simply a setter/getter property, making it easy
    to get access and to modify the volume:


    `var ele = document.querySelector(''audio'');`


    `// Or: var ele = document.querySelector(''video'');`


    `var vol = 0.5; // The volume you want to set it to`


    `console.log(ele.volume);`


    `ele.volume = vol;`


    `console.log(ele.volume);`


    ### Playback Rate


    The `playbackrate` is the speed at which the audio/video is played. The original
    speed is 1.0 and the rate is the multiplication of the initial speed. For example,
    if you change the `playbackrate` to 0.5, then you get the audio or video played
    in slow motion. On the other hand, if you change the rate to 1.5, the audio or
    video would be fast-forwarded.


    `var ele = document.querySelector(''audio'');`


    `// Or: var ele = document.querySelector(''video'');`


    `function slowMotion()  {`


        `ele.playbackrate = 0.5;`


    `}`


    `function fastForward()  {`


        `ele.playbackrate = 1.5;`


    `}`


    ### Network State


    This property is used to determine the network activity. It returns 4 numbers,
    from 0 to 3, which correspond to the following states:


    *   `0\. NETWORK_EMPTY` – This means that the element has not yet been initialized.

    *   `1\. NETWORK_IDLE` – This means that the correct audio/video file has been
    chosen, but is not currently using the network.

    *   `2\. NETWORK_LOADING` – The audio/video is being downloaded.

    *   `3\. NETWORK_NO_SOURCE` - Either none of the given files are compatible or
    no file was provided.


    Unlike many of the previous properties, `networkState` is a read-only property.
    This code shows how it can be used:


    `var ele = document.querySelector(''audio'');`


    `// Or: var ele = document.querySelector(''video'');`


    `function logNetworkState()  {`


        `console.log(ele.networkState);`


    `}`


    ## Web Audio API


    Let’s move on and delve into the realm of audio analysis, which we will be using
    in later chapters to create visualizations of the audio. For this we’ll be using
    the Web Audio API.


    The API is based on the concept of nodes, where each one takes the current audio
    (which could be either the original version or already have been through any number
    of nodes), which it then does something with. I said “something” to be purposely
    vague, nodes can be coded in any way that you want them to be. Some of the default
    usages include: channel splitting and merging, oscillation, and gain control.
    One analogy that I particularly like was one Stuart Memo made in his “An introduction
    to the Web Audio API” article in which he explained how the API nodes work just
    the same as adding a distortion pedal and an amp to a guitar, you can remove either
    node or add new nodes without having to do anything other than change the cables.
    For now, we are just going to use `AnalyserNode` to see exactly what is going
    on within the audio. From there we will start using other nodes to understand
    what has changed.


    ### Analyzing Audio


    First, we need to create both an audio context and an analyzer that we then connect
    together. The context is the interface that gives access to all properties of
    the audio, as well as the methods that are used to create and connect nodes.


    `var ele = document.querySelector(''audio'');`


    `var ctx = new AudioContext();`


    `var analyser = ctx.createAnalyser();`


    `var source = ctx.createMediaElementSource(ele);`


    `source.connect(analyser);`


    `analyser.connect(ctx.destination);`


    You will note that I am using `createMediaElementSourc` `e` within a “source”
    variable. This simply re-routes the audio from the `<audio>` element into the
    API. This means that the audio you play through the element will now be controlled
    by and used as a node of the API’s context graph (the way in which each node is
    connected). It also means that the Web Audio API, rather than the element, is
    controlling volume and other attributes (except controlling when the music is
    playing) so if you would still like to use the element controls, you need to hook
    it up using a GainNode, like so:


    `var ele = document.querySelector(''audio'');`


    `var ctx = new AudioContext();`


    `var analyser = ctx.createAnalyser();`


    `var source = ctx.createMediaElementSource(ele);`


    `var volumeControl = ctx.createGainNode();`


    `source.connect(volumeControl);`


    `volumeControl.connect(analyser);`


    `analyser.connect(ctx.destination);`


    `ele.addEventListener(''onvolumechange'', volumeControl, false);`


    `function volumeChange()  {`


        `volumeControl.gain.value = ele.volume;`


    `}`


    `function log()  {`


        `freqData = new Uint8Array(analyser.frequencyBinCount);`


        `analyser.getByteFrequencyData(freqData);`


        `console.log(freqData);`


    `}`


    Note


    At the time of writing, the `onvolumechange` event does not work as a dynamic
    event listener, so instead you need to include `onvolumechange="volumeChange();"`
    on the `<audio>` element.


    Now back to the analyzer. This node gives us access to data from a Fast Fourier
    Transform (FFT), which is a complicated algorithm used for a variety of things
    including audio analysis. There are two types of data available, frequency and
    time domain. Frequency data can be gained using `getFloatFrequencyData` or `getByteFrequencyData`
    (depending on type of data you want, we will be using the second to store the
    data in an array of bytes) both of these methods give an array of normalized frequencies.
    The reason for the two methods is that the resolution (that is, the quality) of
    the float array is much higher than that of the byte. Due to the way it is normalized,
    we need to go through each index of the array and multiply it by the sample rate
    divided by size of the FFT. To see the outcome of this, let’s log it to the console:


    `function log()  {`


        `freqData = new Uint8Array(analyser.frequencyBinCount);`


        `analyser.getByteFrequencyData(freqData);`


        `for (var i = 0; i < freqData.length; i++) {`


            `console.log(freqData[i] * ctx.sampleRate / analyser.fftSize);`


        `}`


    `}`


    You should now see a variety of numbers, which are dependent on the audio you
    are playing. Each number represents the frequency (440Hz is the easiest frequency
    to remember, this is the A above Middle C), which we will go into more detail
    in a later chapter (where I introduce some music theory). For now, just look at
    the data and think of things you can do with it (maybe even try to implement them).
    Of course, a list of seemingly random numbers is no good to anyone, visualizations
    are key to understanding any type of data, and so we are now going to use what
    we learned in the previous chapter to create 2D graphs that visualize the music.'
  trans: "\n### 时长\n\n要获取音频或视频文件的长度，我们可以使用 `duration` 属性，它以秒为单位返回持续时间。如果音频或视频元素正在流式传输文件，那么除非流式传输停止，否则持续时间将被设置为无穷大（具体来说，根据规范，是正无穷大）。在这种情况下，持续时间将返回已流式传输内容的长度（以秒为单位）。如果持续时间发生变化（例如在流式传输的情况下），则会触发\
    \ `durationchange` 事件，您可以使用事件监听器来触发样式或 DOM 更改，以让用户知道文件已停止流式传输。\n\n```\nvar ele\
    \ = document.querySelector('audio');\n\n// 或者：var ele = document.querySelector('video');\n\
    \nconsole.log(ele.duration);\n```\n\n### 音量\n\n`volume` 属性可用于获取和设置音量；它通过 0.0 到\
    \ 1.0 之间的数字进行控制。默认情况下，初始音量为 1.0，这是浏览器允许的最大值（不一定是扬声器的最大值）。音量只是一个设置/获取属性，使得访问和修改音量变得容易：\n\
    \n```\nvar ele = document.querySelector('audio');\n\n// 或者：var ele = document.querySelector('video');\n\
    \nvar vol = 0.5; // 您想要设置的目标音量\n\nconsole.log(ele.volume);\n\nele.volume = vol;\n\
    \nconsole.log(ele.volume);\n```\n\n### 播放速率\n\n`playbackrate` 是音频/视频播放的速度。原始速度为\
    \ 1.0，该速率是初始速度的倍数。例如，如果您将 `playbackrate` 更改为 0.5，那么音频或视频将以慢动作播放。另一方面，如果您将速率更改为\
    \ 1.5，音频或视频将会快进。\n\n```\nvar ele = document.querySelector('audio');\n\n// 或者：var\
    \ ele = document.querySelector('video');\n\nfunction slowMotion()  {\n    ele.playbackrate\
    \ = 0.5;\n}\n\nfunction fastForward()  {\n    ele.playbackrate = 1.5;\n}\n```\n\
    \n### 网络状态\n\n此属性用于确定网络活动。它返回 0 到 3 之间的 4 个数字，对应以下状态：\n\n- `0. NETWORK_EMPTY`\
    \ – 表示元素尚未初始化。\n- `1. NETWORK_IDLE` – 表示已选择正确的音频/视频文件，但当前未使用网络。\n- `2. NETWORK_LOADING`\
    \ – 正在下载音频/视频。\n- `3. NETWORK_NO_SOURCE` – 要么给定的文件都不兼容，要么没有提供文件。\n\n与许多前面的属性不同，`networkState`\
    \ 是一个只读属性。此代码展示了如何使用它：\n\n```\nvar ele = document.querySelector('audio');\n\n\
    // 或者：var ele = document.querySelector('video');\n\nfunction logNetworkState()\
    \  {\n    console.log(ele.networkState);\n}\n```\n\n## Web 音频 API\n\n接下来让我们深入音频分析的领域，我们将在后面的章节中利用它来创建音频的可视化效果。为此，我们将使用\
    \ Web 音频 API。\n\n该 API 基于节点的概念，每个节点接收当前的音频（可以是原始版本，也可以是已经经过任意数量节点处理后的音频），然后对其进行处理。我说“处理”是为了故意模糊其定义，节点可以按照您希望的任何方式进行编码。一些默认用途包括：声道分离与合并、振荡和增益控制。我特别喜欢的一个类比是\
    \ Stuart Memo 在他的《Web 音频 API 简介》文章中提出的，他解释了 API 节点的工作原理就像给吉他添加失真效果器和放大器一样，您可以移除任何一个节点或添加新节点，而无需做任何其他事情，只需改变连接线即可。目前，我们只打算使用\
    \ `AnalyserNode` 来精确查看音频内部的情况。然后，我们将开始使用其他节点来理解发生了什么变化。\n\n### 分析音频\n\n首先，我们需要创建一个音频上下文和一个分析器，然后将它们连接起来。上下文是一个接口，可以访问音频的所有属性，以及用于创建和连接节点的方法。\n\
    \n```\nvar ele = document.querySelector('audio');\n\nvar ctx = new AudioContext();\n\
    \nvar analyser = ctx.createAnalyser();\n\nvar source = ctx.createMediaElementSource(ele);\n\
    \nsource.connect(analyser);\n\nanalyser.connect(ctx.destination);\n```\n\n您会注意到我在一个“源”变量中使用了\
    \ `createMediaElementSource`。这只是将来自 `<audio>` 元素的音频重新路由到 API 中。这意味着您现在通过该元素播放的音频将受\
    \ API 上下文图（节点相互连接的方式）控制并被用作其中的一个节点。这也意味着，是 Web 音频 API 而不是元素本身在控制音量和其它属性（除了控制音乐的播放时间）。因此，如果您仍然想使用元素控件，则需要使用一个\
    \ `GainNode` 将其连接起来，如下所示：\n\n```\nvar ele = document.querySelector('audio');\n\
    \nvar ctx = new AudioContext();\n\nvar analyser = ctx.createAnalyser();\n\nvar\
    \ source = ctx.createMediaElementSource(ele);\n\nvar volumeControl = ctx.createGainNode();\n\
    \nsource.connect(volumeControl);\n\nvolumeControl.connect(analyser);\n\nanalyser.connect(ctx.destination);\n\
    \nele.addEventListener('onvolumechange', volumeControl, false);\n\nfunction volumeChange()\
    \  {\n    volumeControl.gain.value = ele.volume;\n}\n\nfunction log()  {\n   \
    \ freqData = new Uint8Array(analyser.frequencyBinCount);\n    analyser.getByteFrequencyData(freqData);\n\
    \    console.log(freqData);\n}\n```\n\n注意\n\n在编写本文时，`onvolumechange` 事件不能作为动态事件监听器工作，因此您需要在\
    \ `<audio>` 元素上包含 `onvolumechange=\"volumeChange();\"`。\n\n现在回到分析器。这个节点让我们能够访问快速傅里叶变换（FFT）的数据，这是一种用于多种用途（包括音频分析）的复杂算法。有两种可用的数据类型：频域数据和时域数据。可以使用\
    \ `getFloatFrequencyData` 或 `getByteFrequencyData` 获取频率数据（取决于您想要的数据类型，我们将使用第二种方法将数据存储在字节数组中），这两种方法都返回一个归一化频率的数组。之所以有两种方法，是因为浮点数组的分辨率（即精度）远高于字节数组。由于归一化的方式，我们需要遍历数组的每个索引，并将其乘以采样率除以\
    \ FFT 的大小。要查看结果，我们将其记录到控制台：\n\n```\nfunction log()  {\n    freqData = new Uint8Array(analyser.frequencyBinCount);\n\
    \    analyser.getByteFrequencyData(freqData);\n    for (var i = 0; i < freqData.length;\
    \ i++) {\n        console.log(freqData[i] * ctx.sampleRate / analyser.fftSize);\n\
    \    }\n}\n```\n\n您现在应该会看到各种数字，这些数字取决于您正在播放的音频。每个数字代表一个频率（440Hz 是最容易记住的频率，这是中央\
    \ C 上方的 A 音），我们将在后面的章节中更详细地介绍（届时我会介绍一些音乐理论）。现在，只需查看这些数据并思考您可以用它做些什么（甚至可以尝试实现它们）。当然，一串看似随机的数字对任何人都没有意义，可视化是理解任何类型数据的关键，因此我们现在将使用前一章学到的知识来创建可视化音乐播放的二维图形。\n"
- fmt: "### Frequency Visualization\n\nWe could spend the entire book making fun games\
    \ or random animations that look great but are not too useful; instead, let’s\
    \ look at the kind of tools we can make when we use the Web Audio API and canvas\
    \ together. This example will be frequency visualization, and the next will be\
    \ a spectrogram. To start with, let’s use the original output of `getByteFrequencyData`\
    \ to produce a simple bar chart style visualization of the normalized frequencies\
    \ (this makes it easy to chart, due to the 255 cap). To do this we need to set\
    \ up variables for references to the audio and canvas elements, as well as the\
    \ contexts for each and an analyzer node. I would also recommend setting up the\
    \ volume control as we did earlier, so that you can see how the visualization\
    \ changes dependent on the volume (as well as just so that you can easily turn\
    \ it down!), I find it quite interesting. For the nodes, we need to connect the\
    \ source to the volume which is then connected to the analyzer before output to\
    \ the speakers (destination).\n\n```\nvar audioEle = document.querySelector('audio');\n\
    var audioCtx = new AudioContext();\nvar canvasEle = document.querySelector('canvas');\n\
    var canvasCtx = canvasEle.getContext('2d');\nvar analyser = audioCtx.createAnalyser();\n\
    var source = audioCtx.createMediaElementSource(audioEle);\nvar volumeControl =\
    \ audioCtx.createGainNode();\nsource.connect(volumeControl);\nvolumeControl.connect(analyser);\n\
    analyser.connect(audioCtx.destination);\n```\n\nNow we need to add, alongside\
    \ the `volumeChange` function we used earlier, both logic and draw functions.\
    \ Within logic we simply need to grab the frequency data and send it over to the\
    \ draw function where it will draw it to the canvas. I think it looks good with\
    \ thin lines for the visualization but you can change that by modifying the x\
    \ position (I chose `i`, for current frequency, meaning they are all next to each\
    \ other) and the width (which I kept as 1 to keep thin). Of course you need to\
    \ remember to call `logic`, I have used `setInterval` for this.\n\n```\nfunction\
    \ volumeChange()  {\n  volumeControl.gain.value = audioEle.volume;\n}\n\nfunction\
    \ logic()  {\n  var freqData = new Uint8Array(analyser.frequencyBinCount);\n \
    \ analyser.getByteFrequencyData(freqData);\n\n  requestAnimationFrame(function()\
    \ {\n    draw(freqData);\n  });\n}\n\nfunction draw(freqData)  {\n  canvasCtx.clearRect(0,\
    \ 0, canvasEle.width, canvasEle.height);\n  canvasCtx.fillStyle = \"#ff0000\"\
    ;\n  for (var i = 0; i < freqData.length; i++) {\n    canvasCtx.fillRect(i, canvasEle.height,\
    \ 1, canvasEle.height - freqData[i]);\n  }\n}\n\nsetInterval(logic, 1000/60);\n\
    ```\n\nFigure [3-1](#A978-1-4302-5945-9_3_Chapter.html#Fig1) shows the outcome\
    \ of the frequency visualization while the audio is playing.\n\n![A978-1-4302-5945-9_3_Fig1_HTML.jpg](A978-1-4302-5945-9_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1.\n\nThis shows the frequency visualization\n\n> **Note**  \n> You\
    \ may see a wall of red; this is probably due to the volume being muted. Turn\
    \ up the volume to get the correct visualization.\n\nThis should all be very self-explanatory,\
    \ as we have already gone through each of these concepts, such as audio processing\
    \ nodes and canvas drawing. You can find the code in Listing 3-1 as well as in\
    \ the files that accompany this book.\n\n### Listing 3-1. Code for the Frequency\
    \ Visualization\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Chapter 3 – Frequency\
    \ Visualisation</title>\n</head>\n<body>\n<audio controls onvolumechange=\"volumeChange();\"\
    >\n<source src='../audio.ogg' type='audio/ogg; codecs=vorbis'>\n<source src='../audio.mp3'\
    \ type='audio/mpeg'>\n</audio>\n<canvas>Canvas is not supported by your browser</canvas>\n\
    <script src=\"script.js\"></script>\n</body>\n</html>\n\n// Pollyfill for AudioContext\n\
    (function() {\n  window.AudioContext = window.AudioContext || window.webkitAudioContext;\n\
    \  var requestAnimationFrame = window.requestAnimationFrame || window.mozRequestAnimationFrame\
    \ ||\n    window.webkitRequestAnimationFrame || window.msRequestAnimationFrame;\n\
    \  window.requestAnimationFrame = requestAnimationFrame;\n})();\n\nvar audioEle\
    \ = document.querySelector('audio');\nvar audioCtx = new AudioContext();\nvar\
    \ canvasEle = document.querySelector('canvas');\nvar canvasCtx = canvasEle.getContext('2d');\n\
    var analyser = audioCtx.createAnalyser();\nvar source = audioCtx.createMediaElementSource(audioEle);\n\
    var volumeControl = audioCtx.createGainNode();\n\nsource.connect(volumeControl);\n\
    volumeControl.connect(analyser);\nanalyser.connect(audioCtx.destination);\n\n\
    //audioEle.addEventListener('onvolumechange', volumeControl, false);\n\nfunction\
    \ volumeChange()  {\n  volumeControl.gain.value = audioEle.volume;\n}\n\nfunction\
    \ logic()  {\n  var freqData = new Uint8Array(analyser.frequencyBinCount);\n \
    \ analyser.getByteFrequencyData(freqData);\n\n  requestAnimationFrame(function()\
    \ {\n    draw(freqData);\n  });\n}\n\nfunction draw(freqData)  {\n  canvasCtx.clearRect(0,\
    \ 0, canvasEle.width, canvasEle.height);\n  canvasCtx.fillStyle = \"#ff0000\"\
    ;\n  for (var i = 0; i < freqData.length; i++) {\n    canvasCtx.fillRect(i, canvasEle.height,\
    \ 1, canvasEle.height - freqData[i]);\n  }\n}\n\nsetInterval(logic, 1000/60);\n\
    ```"
  raw: '### Frequency Visualization


    We could spend the entire book making fun games or random animations that look
    great but are not too useful; instead, let’s look at the kind of tools we can
    make when we use the Web Audio API and canvas together. This example will be frequency
    visualization, and the next will be a spectrogram. To start with, let’s use the
    original output of `getByteFrequencyData` to produce a simple bar chart style
    visualization of the normalized frequencies (this makes it easy to chart, due
    to the 255 cap). To do this we need to set up variables for references to the
    audio and canvas elements, as well as the contexts for each and an analyzer node.
    I would also recommend setting up the volume control as we did earlier, so that
    you can see how the visualization changes dependent on the volume (as well as
    just so that you can easily turn it down!), I find it quite interesting. For the
    nodes, we need to connect the source to the volume which is then connected to
    the analyzer before output to the speakers (destination).


