    | `AnalyserNode` | Obtains data about the current state of audio, such as frequencies.
    |

    | `AudioBufferSourceNode` | Buffers short audio assets to be used as temporary
    but easy to access storage. |

    | `BiquadFilterNode` | Processes basic filters (known as low-level filters), such
    as low/high pass, where frequencies are cutoff either below or above the given
    value. |

