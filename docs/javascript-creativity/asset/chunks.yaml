    ## Summary


    I hope you enjoyed this chapter, WebRTC is one of those technologies that are
    quite confusing at first and is very complex at a browser implementation level
    (such as the SDP), but once you get your head around it, it is actually fairly
    simple. It is also incredibly powerful. We did the most obvious use-case here,
    because it is the most useful as an introduction, but WebRTC is (especially if
    you want to drop the signaling and have a different method of finding other clients)
    useful as a general usage peer to peer technology; for example, you could have
    a game or a prototype app in which you want to have users connected without the
    overheads of a server. The access to the user’s webcam is also extremely powerful,
    as you will see in the next chapter where we start to explore the realm of Computer
    Vision.


    # 9. Motion Detection


    ## An Introduction to Motion Detection


    Throughout the book so far we have looked at a number of technologies that have
    obvious applications that you can implement without too much creativity, things
    that may not have been possible before but that are not too hard to do now, such
    as the video-to-video chat in the previous chapter. I would now like to delve
    into the realms of computer vision, one of my personal interests and one that
    has a large variety of ways to apply it. Because this book is neither about advanced
    computer vision nor targeted at academia/research labs, we will stick to relatively
    naïve algorithms and avoid any artificial intelligence that requires training,
    such as facial recognition.


    In this chapter we focus on motion detection, because it ties in well with the
    `WebRTC` and is probably the most useful aspect of basic computer vision. In the
    next chapter we will be creating a musical instrument that can be played using
    motion detection and with other people over `WebRTC`, which should nicely tie
    the entire book together. For now though, think about the other kinds of applications
    you could use motion detection for, such as home security or even just visual
    effects.'
  trans: "\n# 建立对等连接的步骤\n\n这就引出了步骤 4，将远程描述添加到对等连接中。我们从之前发送的 `\"received_offer\"` 消息中获取此描述（请记住，客户端\
    \ 1 和 2 都会互相发送该消息）。首先，解析 SDP 的 JSON 字符串化数据，并将其存储在一个名为 `data` 的变量中。然后，通过访问 `type`\
    \ 属性来确认数据确实是一个 offer，以此防范可能出现的边界情况。接着，我们将对等连接的远程描述设置为数据的 `RTCSessionDescription`。完成这一步后，我们以与使用\
    \ `createOffer()` 类似的方式，使用对等连接的 `createAnswer()` 方法。首先，将本地描述设置为与提供的数据相同，然后向服务器发送一条\
    \ `\"received_answer\"` 消息。\n\n```\nsocket.on('received_offer', function(data)\
    \ {\n    data = JSON.parse(data);\n    console.log('received offer');\n    if\
    \ (data.type == \"offer\") {\n        pc.setRemoteDescription(new RTCSessionDescription(data));\n\
    \        pc.createAnswer(function(data) {\n            console.log('sending answer',\
    \ data);\n            pc.setLocalDescription(data);\n            socket.emit('received_answer',\
    \ data);\n        }, null, mediaConstraints);\n    }\n});\n```\n\n当然，我们现在要检查 `\"\
    received_answer\"`（当你把整个过程拆解成小部分时，一切就没那么复杂了，对吧？）。我们现在需要一个名为 `connected` 的变量，以确保只尝试连接一次。如果该变量被设置为\
    \ `false`，并且数据确实是一个 answer，那么我们将再次使用 SDP 创建一个远程描述，并将其添加到对等连接中。然后，我们只需将 `connected`\
    \ 设置为 `true`，这样就不会反复重连（再次强调，这是一种很少出现的边界情况）。\n\n```\nsocket.on('received_answer',\
    \ function(data) {\n    console.log('received answer', data);\n    if(!connected\
    \ && data.type == \"answer\") {\n        var description = new RTCSessionDescription(data);\n\
    \        console.log(\"Setting remote description\", description);\n        pc.setRemoteDescription(description);\n\
    \        connected = true;\n    }\n});\n```\n\n现在，对等连接知道它有一个 ICE 候选项，因为一旦设置了本地描述，对等连接就会开始“收集候选项”。当它获得一个\
    \ ICE 候选项时，我们将其自己的候选项（包括 ID 和标签）作为 `\"received_candidate\"` 消息发送回去。因此，我们现在需要监听\
    \ `\"received_candidate\"`，并将该候选项添加到对等连接中。这个过程主要只是为了确认每个候选项，当客户端数量超过两个时，这会更成问题。清单\
    \ 8-2 显示了 `client.js` 文件的当前状态。\n\n**清单 8-2.** `Client.js`\n\n```\nsocket.on('received_candidate',\
    \ function(data) {\n    console.log('received candidate', data);\n    data = JSON.parse(data);\n\
    \    var candidate = new RTCIceCandidate({\n        sdpMLineIndex: data.label,\n\
    \        candidate: data.candidate\n    });\n    pc.addIceCandidate(candidate);\n\
    });\n\npc.onicecandidate = function(e) {\n    console.log(\"oniceCandidate\",\
    \ e);\n    if(e.candidate) {\n        socket.emit('received_candidate', JSON.stringify({\n\
    \            label: e.candidate.sdpMLineIndex,\n            id: e.candidate.sdpMid,\n\
    \            candidate: e.candidate.candidate\n        }));\n    }\n};\n```\n\n\
    既然两个对等连接都已拥有所需的所有候选项，我们基本上就完成了。一切都准备就绪后，`addstream` 事件将被触发，让我们可以将远程视频流放入一个视频元素中（在本例中为\
    \ `vid2`）。\n\n```\npc.onaddstream = function(e) {\n    console.log('start remote\
    \ video stream');\n    console.log(e);\n    vid2.src = URL.createObjectURL(e.stream);\n\
    \    vid2.play();\n};\n```\n\n值得注意的是，未关闭连接的用户会看到远程视频停留在最后传输的那一帧上。你可以通过为 `'close'`\
    \ 消息添加事件处理程序，使其显示连接已断开。代码的最终版本可以在 Apress 网站 [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
    \ 或我的个人网站 shanehudson.net/javascript-creativity 的下载资源中找到。\n\n## 总结\n\n我希望你喜欢这一章。`WebRTC`\
    \ 是一种起初令人困惑，且在浏览器实现层面（如 SDP）非常复杂的技术，但一旦你掌握了它，实际上相当简单。它也极其强大。我们在这里演示了最显而易见的用例，因为作为入门介绍它最为有用，但\
    \ `WebRTC`（特别是如果你想放弃信令机制并采用其他方法来寻找其他客户端）作为一种通用的点对点技术也非常有用；例如，如果你希望用户在没有服务器开销的情况下进行连接，可以开发一个游戏或原型应用。访问用户摄像头的功能也非常强大，正如你将在下一章中看到的，我们将开始探索计算机视觉领域。\n\
    \n# 运动检测\n\n## 运动检测简介\n\n到目前为止，在整本书中，我们已经研究了许多技术，它们具有明显的应用场景，无需太多创造力即可实现，有些是以前无法实现但现在却很容易做到的事情，例如上一章中的视频聊天。现在，我想深入探讨计算机视觉领域，这是我个人的兴趣之一，并且拥有多种多样的应用方式。由于本书既不涉及高级计算机视觉，也不针对学术/研究实验室，我们将坚持使用相对简单的算法，并避免任何需要训练的人工智能技术，例如面部识别。\n\
    \n在本章中，我们专注于运动检测，因为它与 `WebRTC` 结合得很好，并且可能是基础计算机视觉中最有用的方面之一。在下一章中，我们将创建一个可以通过运动检测来演奏，并通过\
    \ `WebRTC` 与他人合奏的乐器，这将很好地贯穿整本书。不过现在，请思考一下运动检测还能用于哪些其他类型的应用，例如家庭安防，甚至仅仅是视觉效果。\n"
- fmt: "### Boilerplate for Video Manipulation\n\nAs you will have noticed by now,\
    \ most of these kinds of projects follow a similar pattern. Here I quickly go\
    \ over the pattern that we will be using for video manipulation for the majority\
    \ (if not all) the code in this chapter. We start with a shim for `window.URL`\
    \ and `navigator.getUserMedia`, for this chapter I’ve decided to use a variable\
    \ that uses the method that is compatible with the browser rather than using a\
    \ full polyfill as we did in the previous chapter (because the full `WebRTC` stack\
    \ is less supported than `getUserMedia`).\n\n```\nwindow.URL = window.URL || window.webkitURL;\n\
    \nnavigator.getUserMedia  =  navigator.getUserMedia ||\n                     \
    \      navigator.webkitGetUserMedia ||\n                           navigator.mozGetUserMedia\
    \ ||\n                           navigator.msGetUserMedia;\n\nif (navigator.getUserMedia\
    \ === undefined) {\n    throw new Error(\"Browser doesn't support getUserMedia\"\
    );\n}\n```\n\nNow we need to set up the page, in this case so that both the video\
    \ and canvas elements are full size within the browser window. Just set the video\
    \ element to autoplay, get the context of the canvas, and initialize the video\
    \ stream. To draw the frame we connect the stream and add an event listener that\
    \ calls `draw()` once the video is ready (for example, ‘canplay’). There is now\
    \ a slight problem, normally this would work fine but some versions of Firefox\
    \ (all of which at the time of writing are quite commonly used) have a bug that\
    \ causes `drawImage` to run before the size of the video frame has been set. The\
    \ error is `NS_ERROR_NOT_AVAILABLE` and to prevent it we can use a try catch.\
    \ Of course, in production code it is recommended to do thorough error handling\
    \ anyway, so this should not be too much of a problem.\n\nWithin the try catch\
    \ block, we need to draw the image from the video element to the canvas context.\
    \ To get data that we can manipulate we need to get the frame using `ctx.getImageData(0,\
    \ 0, w, h)`, which has a data property that can be used to retrieve and modify\
    \ the frame. Following is the boilerplate code. Note that there is a comment showing\
    \ where to manipulate the data.\n\n```\nfunction setup()  {\n  videoElement =\
    \ document.querySelector(\"video\");\n  videoElement.width = w = window.innerWidth;\n\
    \  videoElement.height = h = window.innerHeight;\n  videoElement.autoplay = true;\n\
    \  canvas = document.querySelector('canvas');\n  canvas.width = w;\n  canvas.height\
    \ = h;\n  ctx = canvas.getContext('2d');\n  navigator.getUserMedia({video: true},\
    \ function (stream) {\n      videoElement.src = window.URL.createObjectURL(stream);\n\
    \      videoElement.addEventListener('canplay', draw);\n  }, function() {});\n\
    }\n\nfunction draw() {\n  if (videoElement.paused || videoElement.ended) {\n \
    \     return;\n  }\n  try  {\n      ctx.drawImage(videoElement, 0, 0, w, h);\n\
    \      manip = ctx.getImageData(0, 0, w, h);\n      var data = manip.data;\n \
    \     // Manipulate the frame by modifying data\n      ctx.putImageData(manip,\
    \ 0, 0);\n      requestAnimationFrame(draw);\n  }\n  catch (e)  {\n      if (e.name\
    \ == \"NS_ERROR_NOT_AVAILABLE\") {\n          setTimeout(draw, 0);\n      }\n\
    \      else  {\n          throw e;\n      }\n  }\n}\n```\n\n### Basic Video Manipulation\n\
    \nYou should remember that back in [Chapter 3](#A978-1-4302-5945-9_3_Chapter.html)\
    \ we manipulated video by simply iterating over the pixels, but because that was\
    \ at the beginning of the book I will quickly go over it again. This time, let’s\
    \ just invert the pixels so that we can easily see how the manipulation works\
    \ without worrying about the exact algorithm used to create an effect.\n\nThe\
    \ function for inverting the frame is `invertFrame` and take `data` as a parameter,\
    \ the call to `invertFrame` should be placed where the comment was in the boilerplate\
    \ code and the data parameter should come from the `data` variable. Do note that\
    \ we will be returning the `data` variable so that it directly effects the `manip.data`\
    \ from the boilerplate code (since this is the actual frame). We start with the\
    \ data in the form of a `Uint8ClampedArray`. This means that the array contains\
    \ unsigned ints (that is, positive numbers) and they are clamped to 8 bits (a\
    \ byte) and because 2^8 is 256, the max number in any index of the array is 255\
    \ (due, of course, to counting from 0).\n\n**Note**\n\nThe array is comprised\
    \ of RGBA colors, so you should iterate over every four indexes to get the start\
    \ of each color.\n\nSo while we iterate over the array, we start from the beginning\
    \ of each color and therefore need to (usually, unless you just want to find red)\
    \ check the indexes of the green and blue colors as well (by checking `data[i+1]`\
    \ and `data[i+2]`, respectively). To invert the colors, we need to minus the current\
    \ value of each color from 255 (for example, making white become black).\n\n```\n\
    function invertFrame(data)  {\n  // Iterate through each pixel, inverting it\n\
    \  for (var i = 0; i < data.length; i += 4) {\n    var r = data[i],\n        g\
    \ = data[i+1],\n        b = data[i+2];\n\n    data[i] = 255 - r;\n    data[i+1]\
    \ = 255 - g;\n    data[i+2] = 255 - b;\n  }\n  return data;\n}\n```\n\nSee Listing\
    \ 9-1 for how this fits with the boilerplate code.\n\n**Listing 9-1.**\n\n```\n\
    window.URL = window.URL || window.webkitURL;\n\nnavigator.getUserMedia  =  navigator.getUserMedia\
    \ ||\nnavigator.webkitGetUserMedia ||\nnavigator.mozGetUserMedia ||\nnavigator.msGetUserMedia;\n\
    \nif (navigator.getUserMedia === undefined) {\n  throw new Error(\"Browser doesn't\
    \ support getUserMedia\");\n}\n\nvar videoElement, canvas, ctx, manip, w, h;\n\
    window.addEventListener('DOMContentLoaded', setup);\n\nfunction setup()  {\n \
    \ videoElement = document.querySelector(\"video\");\n  videoElement.width = w\
    \ = window.innerWidth;\n  videoElement.height = h = window.innerHeight;\n  videoElement.autoplay\
    \ = true;\n  canvas = document.querySelector('canvas');\n  canvas.width = w;\n\
    \  canvas.height = h;\n  ctx = canvas.getContext('2d');\n  navigator.getUserMedia({video:\
    \ true}, function (stream) {\n    videoElement.src = window.URL.createObjectURL(stream);\n\
    \    videoElement.addEventListener('canplay', draw);\n  }, function() {});\n}\n\
    \nfunction draw() {\n  if (videoElement.paused || videoElement.ended) {\n    return;\n\
    \  }\n  try  {\n    ctx.drawImage(videoElement, 0, 0, w, h);\n    manip = ctx.getImageData(0,\
    \ 0, w, h);\n    var data = manip.data;\n    data = invertFrame(data);\n    ctx.putImageData(manip,\
    \ 0, 0);\n    requestAnimationFrame(draw);\n  }\n  catch (e)  {\n    if (e.name\
    \ == \"NS_ERROR_NOT_AVAILABLE\") {\n      setTimeout(draw, 0);\n    }\n    else\
    \  {\n      throw e;\n    }\n  }\n}\n\nfunction invertFrame(data)  {\n  // Iterate\
    \ through each pixel, inverting it\n  for (var i = 0; i < data.length; i += 4)\
    \ {\n    var r = data[i],\n        g = data[i+1],\n        b = data[i+2];\n  \
    \  data[i] = 255 - r;\n    data[i+1] = 255 - g;\n    data[i+2] = 255 - b;\n  }\n\
    \  return data;\n}\n```"
  raw: '### Boilerplate for Video Manipulation


    As you will have noticed by now, most of these kinds of projects follow a similar
    pattern. Here I quickly go over the pattern that we will be using for video manipulation
    for the majority (if not all) the code in this chapter. We start with a shim for
    `window.URL` and `navigator.getUserMedia`, for this chapter I’ve decided to use
    a variable that uses the method that is compatible with the browser rather than
    using a full polyfill as we did in the previous chapter (because the full `WebRTC`
    stack is less supported than `getUserMedia`).


    `window.URL = window.URL || window.webkitURL;`


    `navigator.getUserMedia  =  navigator.getUserMedia ||`


                               `navigator.webkitGetUserMedia ||`


                               `navigator.mozGetUserMedia ||`


                               `navigator.msGetUserMedia;`


    `if (navigator.getUserMedia === undefined) {`


        `throw new Error("Browser doesn''t support getUserMedia");`


    `}`


    Now we need to set up the page, in this case so that both the video and canvas
    elements are full size within the browser window. Just set the video element to
    autoplay, get the context of the canvas, and initialize the video stream. To draw
    the frame we connect the stream and add an event listener that calls `draw()`
    once the video is ready (for example, ‘canplay’). There is now a slight problem,
    normally this would work fine but some versions of Firefox (all of which at the
    time of writing are quite commonly used) have a bug that causes `drawImage` to
    run before the size of the video frame has been set. The error is `NS_ERROR_NOT_AVAILABLE`
    and to prevent it we can use a try catch. Of course, in production code it is
    recommended to do thorough error handling anyway, so this should not be too much
    of a problem.


    Within the try catch block, we need to draw the image from the video element to
    the canvas context. To get data that we can manipulate we need to get the frame
    using `ctx.getImageData(0, 0, w, h),`which has a data property that can be used
    to retrieve and modify the frame. Following is the boilerplate code. Note that
    there is a comment showing where to manipulate the data.


    `function setup()  {`


      `videoElement = document.querySelector("video");`


      `videoElement.width = w = window.innerWidth;`


      `videoElement.height = h = window.innerHeight;`


      `videoElement.autoplay = true;`


      `canvas = document.querySelector(''canvas'');`


      `canvas.width = w;`


      `canvas.height = h;`


      `ctx = canvas.getContext(''2d'');`


      `navigator.getUserMedia({video: true}, function (stream) {`


          `videoElement.src = window.URL.createObjectURL(stream);`


          `videoElement.addEventListener(''canplay'', draw);`


      `}, function() {});`


    `}`


    `function draw() {`


      `if (videoElement.paused || videoElement.ended) {`


          `return;`


      `}`


      `try  {`


          `ctx.drawImage(videoElement, 0, 0, w, h);`


          `manip = ctx.getImageData(0, 0, w, h);`


          `var data = manip.data;`


          `// Manipulate the frame by modifying data`


          `ctx.putImageData(manip, 0, 0);`


          `requestAnimationFrame(draw);`


      `}`


      `catch (e)  {`


          `if (e.name == "NS_ERROR_NOT_AVAILABLE") {`


              `setTimeout(draw, 0);`


          `}`


          `else  {`


              `throw e;`


          `}`


      `}`


    `}`


    ### Basic Video Manipulation


    You should remember that back in [Chapter 3](#A978-1-4302-5945-9_3_Chapter.html)
    we manipulated video by simply iterating over the pixels, but because that was
    at the beginning of the book I will quickly go over it again. This time, let’s
    just invert the pixels so that we can easily see how the manipulation works without
    worrying about the exact algorithm used to create an effect.


    The function for inverting the frame is `invertFrame` and take `data` as a parameter,
    the call to `invertFrame` should be placed where the comment was in the boilerplate
    code and the data parameter should come from the `data` variable. Do note that
    we will be returning the `data` variable so that it directly effects the `manip.data`
    from the boilerplate code (since this is the actual frame). We start with the
    data in the form of a `Uint8ClampedArray`. This means that the array contains
    unsigned ints (that is, positive numbers) and they are clamped to 8 bits (a byte)
    and because 2^8 is 256, the max number in any index of the array is 255 (due,
    of course, to counting from 0).


    Note


    The array is comprised of RGBA colors, so you should iterate over every four indexes
    to get the start of each color.


    So while we iterate over the array, we start from the beginning of each color
    and therefore need to (usually, unless you just want to find red) check the indexes
    of the green and blue colors as well (by checking `data[i+1]` and `data[i+2]`,
    respectively). To invert the colors, we need to minus the current value of each
    color from 255 (for example, making white become black).


    `function invertFrame(data)  {`


    `// Iterate through each pixel, inverting it`


    `for (var i = 0; i < data.length; i += 4) {`


    `var r = data[i],`


    `g = data[i+1],`


    `b = data[i+2];`


    `data[i] = 255 - r;`


    `data[i+1] = 255 - g;`


    `data[i+2] = 255 - b;`


    `}`


    `return data;`


    `}`


    See Listing 9-1 for how this fits with the boilerplate code.


    Listing 9-1.


    `window.URL = window.URL || window.webkitURL;`


    `navigator.getUserMedia  =  navigator.getUserMedia ||`


    `navigator.webkitGetUserMedia ||`


    `navigator.mozGetUserMedia ||`


