    \    *   `/www/node_modules/express/`（`package.json` 或 `index.js`）\n    *   `/node_modules/express/`（`package.json`\
    \ 或 `index.js`）\n    *   `$NODE_PATH/express/`（`package.json` 或 `index.js`）\n\
    \    *   `$HOME/.node_modules/express/`（`package.json` 或 `index.js`）\n    *  \
    \ `$HOME/.node_libraries/express/`（`package.json` 或 `index.js`）\n    *   `$PREFIX/lib/node/express/`（`package.json`\
    \ 或 `index.js`）\n    *   这是 Node.js 查找的文件夹的详尽列表。强烈建议你将模块放在本地的 `node_modules` 文件夹中，以确保速度和可靠性。其他文件夹主要用于\
    \ `node_modules` 文件夹内的 Node.js 模块需要它们自己的模块时，这样你就可以在项目和你自己的模块之间共享模块。\n"
- fmt: "This is where `npm` steps in to make things even better. Due to the features\
    \ of `node_modules` folders in Node.js, `npm` looks at the `dependencies` and\
    \ `devDependencies` objects in your `package.json`, and downloads each to your\
    \ `node_modules` folder. It also downloads all your modules’ dependencies, and\
    \ your modules’ modules’ dependencies, and so on. The difference between `dependencies`\
    \ and `devDependencies` is that `npm` will not install `devDependencies` of other\
    \ modules, only `dependencies`. By default `npm` installs everything into the\
    \ local `node_modules` folder. This isn’t always what you want, so if you install\
    \ modules with `npm install -g <module>`, then it installs them globally (typically\
    \ in `$HOME/.node_modules/`). This is really useful as you can use this to install\
    \ command line programs written in Node.js. For example I use `nodemon` by Remy\
    \ Sharp as an alternative way to run the node server while I am developing a project,\
    \ because the default `node [filename]` approach to running a server does not\
    \ watch for files that have been updated while the server is running. To install\
    \ `nodemon` you run `npm –g install nodemon`, then run `nodemon [filename]` to\
    \ run a server through `nodemon`. More information about `nodemon` can be found\
    \ at [`www.remy.github.io/nodemon/`](http://www.http//remy.github.io/nodemon/).\n\
    \nThe simplest example of Node.js is, of course, Hello World. To serve a web page\
    \ we need to require a module called `http`, which lets us handle the low-level\
    \ aspects of `HTTP`. This module is a core module, so we use the first definition\
    \ in the list. Once `HTTP` is required, we store it within a variable called `http`.\
    \ We then use a method on `http` called `createServer`; this has a callback that\
    \ lets you send a response (also known as the web page). To create the web page\
    \ that gets served, we start by writing the headers using `response.writeHead`.\
    \ The first parameter that needs to be provided is the `HTTP` status code `200`\
    \ (OK). The second is the actual header, in this example we are only writing “Hello\
    \ World” so the `Content-Type` can be `text/plain`, you may choose to use `text/html`\
    \ if you want to write some HTML to the page. To write the actual content, you\
    \ just use `response.write`. Once you’ve finished writing the response, end it\
    \ with `response.end()`. Now you have a server but to actually serve the page\
    \ you need to tell it to listen for activity on a port (in this case, port 8080).\n\
    \n```\nvar http = require(\"http\");\n\nhttp.createServer(function(request, response)\
    \ {\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n  response.write(\"\
    Hello World\");\n  response.end();\n}).listen(8080);\n```\n\nNow that you know\
    \ how to require a module and do something with it, let’s make our own simple\
    \ module that makes use of the `module.exports` that I mentioned. This module\
    \ will wrap up our Hello World code into a file called `helloworld.js`, which\
    \ we then require as a variable called `hello` in `server.js` and call the `server`\
    \ method.\n\n`helloworld.js`\n\n```\nvar http = require(\"http\");\n\nfunction\
    \ hello() {\n  http.createServer(function(request, response) {\n    response.writeHead(200,\
    \ {\"Content-Type\": \"text/html\"});\n    response.write(\"Hello World\");\n\
    \    response.end();\n  }).listen(8080);\n}\n\nmodule.exports.server = hello;\n\
    ```\n\n`server.js`\n\n```\nvar hello = require('./helloworld.js');\nhello.server();\n\
    ```\n\nOf course, this is an incredibly simplistic example but it shows you quite\
    \ nicely how you can require a custom module and call a method based on the name\
    \ that it is exported as rather than the name of the function. It may help to\
    \ point out here the differences between a method and a function, because many\
    \ people use them interchangeably (which is fine, but I prefer to be more specific).\
    \ A method is used on an object, while a function is independent of any object.\n\
    \n## Socket.IO and Express\n\nI mentioned Socket.IO earlier, it was one of the\
    \ packages we installed from `package.json`, but I did not explain what it does.\
    \ Basically it is a wrapper for web sockets so that all browsers can support real-time\
    \ communication.\n\n> Socket.IO aims to make real-time apps possible in every\
    \ browser and mobile device, blurring the differences between the different transport\
    \ mechanisms. It’s care-free real-time 100% in JavaScript. Socket.IO homepage\n\
    \nSocket.IO is also incredibly easy to use. Once it is installed, it needs to\
    \ be required within the server-side files (similar to requiring a file in PHP,\
    \ but node automatically finds the location that it is installed) and then set\
    \ it to listen to the server.\n\nOf course, we have not yet made a server. Languages\
    \ such as PHP execute once per file and translate the file’s contents into an\
    \ output, Node.js is different in that it is a long-standing process that will\
    \ serve many files many times. Node.js includes an HTTP module, although you can\
    \ use apache or nginx if you want, that gives you the capability of creating a\
    \ simple server yourself—but for most situations you don’t want to be mucking\
    \ around with low-level server code.\n\nExpress.js makes it easy to get to the\
    \ actual code-writing part of developing a website, rather than worrying about\
    \ how each file can access the rest of the file structure and so on. However,\
    \ it isn’t very opinionated; with Express.js you can use any paradigm (or way\
    \ of working) that you like. You can write simple websites, blogs, advanced web\
    \ apps, or a REST API using the tools that Express provides. If you do prefer\
    \ an opinionated approach, there is an official structuring tool for Express called\
    \ `express-generator` that can be installed globally using `npm` to help you get\
    \ started on a new project, although it doesn’t force you to keep using the same\
    \ structure.\n\nAs a brief example of using Express to manage the low-level code,\
    \ see the two code snippets that follow. They both write ‘Hello World!’ to the\
    \ page if you are on `localhost:8080/hello`, and they write ‘Goodbye cruel world!’\
    \ if you are on any other page. The difference is that the first snippet directly\
    \ uses the `http` and the second snippet uses Express. Of course this barely scratches\
    \ the skin of what Express is capable of, but it should show you nicely how Express\
    \ does not require the lower-level code such as HTTP headers.\n\n**Without Express**\n\
    \n```\nvar http = require('http');\n\nhttp.createServer(function(request, response)\
    \ {\n  var url = request.url;\n  response.writeHead(200, {\"Content-Type\": \"\
    text/html\"});\n\n  if (url == '/hello')  {\n    response.write(\"Hello World!\"\
    );\n  }\n  else  {\n    response.write(\"Goodbye cruel world!\");\n  }\n  response.end();\n\
    }).listen(8080);\n```\n\n**With Express**\n\n```\nvar express = require('express');\n\
    var app = express();\n\napp.get('/hello', function(request, response) {\n  response.send(\"\
    Hello World!\");\n});\n\napp.get('/*', function(request, response) {\n  response.send(\"\
    Goodbye cruel world!\");\n});\n\napp.listen(8080);\n```\n\nNow let’s use Express\
    \ to begin the writing the server for our chatroom. At the beginning of the chapter\
    \ there was a `package.json` for installing Express and Socket.IO, if you haven’t\
    \ yet installed those packages, then you will need to do so now. Using Socket.IO\
    \ is slightly different than using Express on its own in that it requires an `http.createServer`\
    \ instance to be passed to Socket.IO’s listener. This was changed in version 3\
    \ of Express, prior to that the `express()` function returned an instance of `http.Server`.\n\
    \n```\nvar app = require('express')(),\n    server = require('http').createServer(app),\n\
    \    io = require('socket.io').listen(server);\n\nserver.listen(8080);\n```"
  raw: 'This is where `npm` steps in to make things even better. Due to the features
    of `node_modules` folders in Node.js, npm looks at the “`dependencies`” and “`devDependencies`”
    objects in your package.json, and download each to your node_modules folder. It
    also downloads all your modules’ dependencies, and your modules’ modules’ dependencies,
    and so on. The difference between “dependencies” and “devDependencies” is that
    npm will not install devDependencies of other modules, only dependencies. By default
    npm installs everything into the local `node_modules` folder. This isn’t always
    what you want, so if you install modules with `npm install -g <module>`, then
    it installs them globally (typically in `$HOME/.node_modules/`). This is really
    useful as you can use this to install command line programs written in Node.js.
    For example I use nodemon by Remy Sharp as an alternative way to run the node
    server while I am developing a project, because the default `node [filename]`
    approach to running a server does not watch for files that have been updated while
    the server is running. To install `nodemon` you run `npm –g install nodemon`,
    then run nodemon [filename] to run a server through nodemon. More information
    about nodemon can be found at [`www.remy.github.io/nodemon/`](http://www.http//remy.github.io/nodemon/)
    .


    The simplest example of Node.js is, of course, Hello World. To serve a web page
    we need to require a module called `http`, which lets us handle the low-level
    aspects of `HTTP`. This module is a core module, so we use the first definition
    in the list. Once `HTTP` is required, we store it within a variable called `http`.
    We then use a method on `http` called createServer; this has a callback that lets
    you send a response (also known as the web page). To create the web page that
    gets served, we start by writing the headers using `response.writeHead`. The first
    parameter that needs to be provided is the `HTTP` status code `200` (OK). The
    second is the actual header, in this example we are only writing “Hello World”
    so the `Content-Type` can be `text/plain`, you may choose to use `text/html` if
    you want to write some HTML to the page. To write the actual content, you just
    use `response.write`. Once you’ve finished writing the response, end it with `response.end()`.
    Now you have a server but to actually serve the page you need to tell it to listen
    for activity on a port (in this case, port 8080).


    `var http = require("http");`


    `http.createServer(function(request, response) {`


    `response.writeHead(200, {"Content-Type": "text/plain"});`


    `response.write("Hello World");`


    `response.end();`


    `}).listen(8080);`


    Now that you know how to require a module and do something with it, let’s make
    our own simple module that makes use of the `module.exports` that I mentioned.
    This module will wrap up our Hello World code into a file called `helloworld.js`,
    which we then require as a variable called hello in `server.js` and call the server
    method.


    helloworld.js


    `var http = require("http");`


    `function hello() {`


    `http.createServer(function(request, response) {`


    `response.writeHead(200, {"Content-Type": "text/html"});`


    `response.write("Hello World");`


    `response.end();`


    `}).listen(8080);`


    `}`


    `module.exports.server = hello;`


    `server.js`


    `var hello = require(''./helloworld.js'');`


    `hello.server();`


    Of course, this is an incredibly simplistic example but it shows you quite nicely
    how you can require a custom module and call a method based on the name that it
    is exported as rather than the name of the function. It may help to point out
    here the differences between a method and a function, because many people use
    them interchangeably (which is fine, but I prefer to be more specific). A method
    is used on an object, while a function is independent of any object.


    ### Socket.IO and Express


    I mentioned Socket.IO earlier, it was one of the packages we installed from `package.json`,
    but I did not explain what it does. Basically it is a wrapper for web sockets
    so that all browsers can support real-time communication.


    > Socket.IO aims to make real-time apps possible in every browser and mobile device,
    blurring the differences between the different transport mechanisms. It’s care-free
    real-time 100% in JavaScript. Socket.IO homepage


    Socket.IO is also incredibly easy to use. Once it is installed, it needs to be
    required within the server-side files (similar to requiring a file in PHP, but
    node automatically finds the location that it is installed) and then set it to
    listen to the server.


    Of course, we have not yet made a server. Languages such as PHP execute once per
    file and translate the file’s contents into an output, Node.js is different in
    that it is a long-standing process that will serve many files many times. Node.js
    includes an HTTP module, although you can use apache or nginx if you want, that
    gives you the capability of creating a simple server yourself—but for most situations
    you don’t want to be mucking around with low-level server code.


    Express.js makes it easy to get to the actual code-writing part of developing
    a website, rather than worrying about how each file can access the rest of the
    file structure and so on. However, it isn’t very opinionated; with Express.js
    you can use any paradigm (or way of working) that you like. You can write simple
    websites, blogs, advanced web apps, or a REST API using the tools that Express
    provides. If you do prefer an opinionated approach, there is an official structuring
    tool for Express called express-generator that can be installed globally using
    npm to help you get started on a new project, although it doesn’t force you to
    keep using the same structure.


    As a brief example of using Express to manage the low-level code, see the two
    code snippets that follow. They both write ‘Hello World!’ to the page if you are
    on localhost:8080/hello, and they write ‘Goodbye cruel world!’ if you are on any
    other page. The difference is that the first snippet directly uses the http and
    the second snippet uses Express. Of course this barely scratches the skin of what
    Express is capable of, but it should show you nicely how Express does not require
    the lower-level code such as HTTP headers.


    Without Express


    `var http = require(''http'');`


    `http.createServer(function(request, response) {`


    `var url = request.url;`


    `response.writeHead(200, {"Content-Type": "text/html"});`


    `if (url == ''/hello'')  {`


    `response.write("Hello World!");`


    `}`


    `else  {`


    `response.write("Goodbye cruel world!");`


    `}`


    `response.end();`


    `}).listen(8080);`


    With Express


    `var express = require(''express'');`


    `var app = express();`


    `app.get(''/hello'', function(request, response) {`


    `response.send("Hello World!");`


    `});`


    `app.get(''/*'', function(request, response) {`


    `response.send("Goodbye cruel world!");`


    `});`


    `app.listen(8080);`


    Now let’s use Express to begin the writing the server for our chatroom. At the
    beginning of the chapter there was a `package.json` for installing Express and
    Socket.IO, if you haven’t yet installed those packages, then you will need to
    do so now. Using Socket.IO is slightly different than using Express on its own
    in that it requires an `http.createServer` instance to be passed to Socket.IO’s
    listener. This was changed in version 3 of Express, prior to that the `express()`
    function returned an instance of `http.Server`.


    `var app = require(''express'')(),`


    `server = require(''http'').createServer(app),`


    `io = require(''socket.io'').listen(server);`


    `server.listen(8080);`'
  trans: "\n这就是 `npm` 发挥作用，让事情变得更好的地方。由于 Node.js 中 `node_modules` 文件夹的特性，`npm` 会查看你的\
    \ `package.json` 中的 `dependencies` 和 `devDependencies` 对象，并将每个依赖项下载到你的 `node_modules`\
    \ 文件夹中。它还会下载你所有模块的依赖项，以及这些模块的模块的依赖项，依此类推。`dependencies` 和 `devDependencies` 的区别在于，`npm`\
    \ 不会安装其他模块的 `devDependencies`，只会安装 `dependencies`。默认情况下，`npm` 会将所有内容安装到本地的 `node_modules`\
    \ 文件夹中。但这并不总是你想要的，所以如果你使用 `npm install -g <module>` 安装模块，那么它会将它们全局安装（通常在 `$HOME/.node_modules/`\
    \ 中）。这非常有用，因为你可以用它来安装用 Node.js 编写的命令行程序。例如，我在开发项目时使用 Remy Sharp 的 `nodemon` 作为运行\
    \ node 服务器的替代方式，因为默认的运行服务器的方式 `node [filename]` 不会监视服务器运行时已更新的文件。要安装 `nodemon`，你可以运行\
    \ `npm –g install nodemon`，然后运行 `nodemon [filename]` 通过 `nodemon` 运行服务器。更多关于 `nodemon`\
    \ 的信息可以在 [`www.remy.github.io/nodemon/`](http://remy.github.io/nodemon/) 找到。\n\
    \n当然，Node.js 最简单的例子就是 Hello World。要提供网页服务，我们需要引入一个名为 `http` 的模块，它可以让我们处理 `HTTP`\
    \ 的底层细节。这个模块是一个核心模块，所以我们使用列表中的第一个定义。一旦引入了 `HTTP`，我们将其存储在一个名为 `http` 的变量中。然后我们使用\
    \ `http` 上的一个名为 `createServer` 的方法；这个方法有一个回调函数，允许你发送响应（也就是网页）。要创建被提供的网页，我们首先使用\
    \ `response.writeHead` 编写头部信息。需要提供的第一个参数是 `HTTP` 状态码 `200`（表示成功）。第二个参数是实际的头部信息，在这个例子中我们只写入\
    \ \"Hello World\"，所以 `Content-Type` 可以是 `text/plain`，如果你想向页面写入一些 HTML，你可以选择使用\
    \ `text/html`。要写入实际内容，只需使用 `response.write`。一旦你写完了响应，使用 `response.end()` 结束它。现在你已经有了一个服务器，但要让页面真正被提供，你需要告诉它在一个端口上监听活动（在这个例子中，端口是\
    \ 8080）。\n\n```\nvar http = require(\"http\");\n\nhttp.createServer(function(request,\
    \ response) {\n  response.writeHead(200, {\"Content-Type\": \"text/plain\"});\n\
    \  response.write(\"Hello World\");\n  response.end();\n}).listen(8080);\n```\n\
    \n现在你已经知道如何引入一个模块并用它来做一些事情了，让我们来创建我们自己简单的模块，这个模块会用到我提到的 `module.exports`。这个模块将把我们的\
    \ Hello World 代码封装到一个名为 `helloworld.js` 的文件中，然后我们在 `server.js` 中将其作为名为 `hello`\
    \ 的变量引入，并调用 `server` 方法。\n\n`helloworld.js`\n\n```\nvar http = require(\"http\"\
    );\n\nfunction hello() {\n  http.createServer(function(request, response) {\n\
    \    response.writeHead(200, {\"Content-Type\": \"text/html\"});\n    response.write(\"\
    Hello World\");\n    response.end();\n  }).listen(8080);\n}\n\nmodule.exports.server\
    \ = hello;\n```\n\n`server.js`\n\n```\nvar hello = require('./helloworld.js');\n\
    hello.server();\n```\n\n当然，这是一个极其简单的例子，但它很好地展示了如何引入一个自定义模块，并根据它导出的名称（而不是函数本身的名称）来调用一个方法。在这里指出方法和函数之间的区别可能会有所帮助，因为很多人会交替使用这两个词（这是可以的，但我更喜欢更精确一些）。方法是用于对象的，而函数则独立于任何对象。\n\
    \n## Socket.IO 和 Express\n\n我之前提到过 Socket.IO，它是我们通过 `package.json` 安装的包之一，但我没有解释它的作用。基本上，它是\
    \ web sockets 的一个封装，使得所有浏览器都能支持实时通信。\n\n> Socket.IO 旨在让每个浏览器和移动设备都能实现实时应用，模糊了不同传输机制之间的差异。它是无忧无虑的、100%\
    \ 基于 JavaScript 的实时通信。 —— Socket.IO 主页\n\nSocket.IO 也非常易于使用。一旦安装完成，它需要在服务器端文件中被引入（类似于在\
    \ PHP 中引入文件，但 node 会自动找到它被安装的位置），然后将其设置为监听服务器。\n\n当然，我们还没有创建服务器。像 PHP 这样的语言每次执行一个文件，并将文件的内容转换为输出；Node.js\
    \ 则不同，它是一个长期运行的过程，会多次为多个文件提供服务。Node.js 内置了一个 HTTP 模块（如果你愿意，也可以使用 apache 或 nginx），它让你有能力自己创建一个简单的服务器——但在大多数情况下，你并不想处理底层服务器代码。\n\
    \nExpress.js 让你可以专注于开发网站时实际编写代码的部分，而不用担心每个文件如何访问其余的文件结构等问题。然而，它的观点并不强烈；使用 Express.js，你可以使用任何你喜欢的范式（或工作方式）。你可以使用\
    \ Express 提供的工具编写简单的网站、博客、高级 web 应用或 REST API。如果你确实喜欢强观点的做法，Express 有一个名为 `express-generator`\
    \ 的官方结构工具，可以使用 `npm` 全局安装，以帮助你开始一个新项目，尽管它不会强迫你一直使用相同的结构。\n\n作为使用 Express 管理底层代码的简要示例，请看下面的两个代码片段。如果你在\
    \ `localhost:8080/hello`，它们都会向页面写入 'Hello World!'，如果你在其他任何页面上，它们都会写入 'Goodbye\
    \ cruel world!'。区别在于，第一个片段直接使用了 `http`，而第二个片段使用了 Express。当然，这仅仅触及了 Express 能力的皮毛，但它应该很好地展示了\
    \ Express 如何不需要像 HTTP 头部这样的底层代码。\n\n**不使用 Express**\n\n```\nvar http = require('http');\n\
    \nhttp.createServer(function(request, response) {\n  var url = request.url;\n\
    \  response.writeHead(200, {\"Content-Type\": \"text/html\"});\n\n  if (url ==\
    \ '/hello')  {\n    response.write(\"Hello World!\");\n  }\n  else  {\n    response.write(\"\
    Goodbye cruel world!\");\n  }\n  response.end();\n}).listen(8080);\n```\n\n**使用\
    \ Express**\n\n```\nvar express = require('express');\nvar app = express();\n\n\
    app.get('/hello', function(request, response) {\n  response.send(\"Hello World!\"\
    );\n});\n\napp.get('/*', function(request, response) {\n  response.send(\"Goodbye\
    \ cruel world!\");\n});\n\napp.listen(8080);\n```\n\n现在，让我们使用 Express 来开始为我们的聊天室编写服务器。在本章的开头，有一个用于安装\
    \ Express 和 Socket.IO 的 `package.json`，如果你还没有安装这些包，那么你现在需要安装它们。单独使用 Express 与使用\
    \ Socket.IO 略有不同，因为需要将一个 `http.createServer` 实例传递给 Socket.IO 的监听器。这在 Express 的第\
    \ 3 版中发生了变化，在此之前，`express()` 函数返回的是 `http.Server` 的一个实例。\n\n```\nvar app = require('express')(),\n\
    \    server = require('http').createServer(app),\n    io = require('socket.io').listen(server);\n\
    \nserver.listen(8080);\n```\n"
- fmt: "# 构建基础聊天室\n\n目前没有什么可看的，因为我们这次甚至没有在页面上写\"Hello World\"，所以我们先使用纯HTML搭建一个基础页面。对于最简单的聊天室，我们只需要两个文本框来输入你的昵称和消息（根据UI设计的不同，昵称的输入方式可以有所不同），以及一个发送消息的按钮和一个`div`（也可以使用列表来改善语义）来显示消息。这个文件通常可以（但不是必须）保存为`index.html`，放在与服务器代码相同的文件夹中。\n\
    \n```html\n<!doctype html>\n<html>\n<head>\n<title>Chatroom</title>\n</head>\n\
    <body>\n<label for=\"nickname\">Nickname:</label><input type=\"text\" id=\"nickname\"\
    ></input>\n<div id=\"messages\"></div>\n<textarea id=\"message\"></textarea>\n\
    <a id=\"send\">Send</a>\n</body>\n</html>\n```\n\n现在你需要使用路由器（就像我们在Hello World示例中做的那样）来告诉浏览器在哪里找到内容。对于这个聊天室，我们希望多个房间可访问，一个很好的方法是将聊天室的名称（或一个随机标识符）放在房间的URL中。`Express`提供了一种简单的方法来检查这个名称，作为路径名片段（也称为命名参数），但由于这个聊天室不需要多个视图，我们可以直接将每个页面重定向到`index.html`。我们可以使用通配符来代替路径名片段，但介绍路径名作为参数使用的概念是个好方法。这也是强制包含聊天室ID的一种方式，因为如果没有ID，它将不会提供页面；这意味着如果你想要添加一个主页，就需要一个单独的路由。\n\
    \n```javascript\napp.get('/:id?', function (req, res) {\n  res.sendfile(__dirname\
    \ + '/index.html');\n});\n```\n\n当然，这只是一个相当无用的聊天室。让我们编写处理消息的服务器端代码。使用`Socket.IO`，我们需要通过`io.sockets.on('connection',\
    \ function (socket) {});`作为连接事件处理器来检查连接，然后加入路径名片段中命名的房间。与`Express`不同，为了获取标识符，我们使用`var\
    \ room = socket.handshake.headers.referer`，因为一旦路由完成，`Express`的`.get`调用就不可用了。获取标识符的其他方法包括：从客户端发送路径名片段，或者最初使用`res.local`（作用域限于请求/响应周期的变量）提供它，并在客户端将其暴露为全局变量。使用`socket.handshake`虽然路径较长，但在这种情况下是避免从客户端发送的好方法。\n\
    \n将标识符存储在名为`room`的变量中后，我们现在可以使用`socket.join(room)`来加入一个与ID同名的`Socket.IO`房间。这些房间本质上是一种将正确的消息发送给正确的人的方式，只有房间的成员才能收到该特定房间的消息。\n\
    \n为了检查消息或用户离开房间的情况，我们在`socket`上使用事件处理器。`Socket.IO`上的每一次通信都被归类为一条消息，不要与聊天室中写入的消息混淆。发送消息被称为发射（emitting）。要让聊天室中的消息相互发送，我们首先在客户端（我稍后会讲到）向服务器发射消息，然后服务器将消息发送给连接到该房间的其他客户端。要从服务器向房间发射消息，我们使用`io.sockets.in(room).emit(key,\
    \ value)`。对于聊天室消息，我们使用字符串`'message'`作为键，数据则通过事件监听器上的`data`参数作为值传递。对于离开房间，键是`'leave'`。\n\
    \n```javascript\nio.sockets.on('connection', function (socket) {\n  var room =\
    \ socket.handshake.headers.referer;\n  socket.join(room);\n  socket.on('message',\
    \ function (data) {\n    io.sockets.in(room).emit('message', data);\n  });\n \
    \ socket.on('leave', function (room) {\n    socket.leave(room);\n  });\n});\n\
    ```\n\n就基础聊天室的服务器端而言，这就是全部了，你可以看到代码在清单7-1中是多么简洁。我们现在需要做的就是在客户端为事件处理器设置代码，以便在发送消息时发射消息。这样，借助`Socket.IO`房间和我们刚刚编写的代码，它会自动将消息发送给同一房间中的任何人——而且是实时的！不需要担心AJAX或长轮询，`Socket.IO`会使用最适合的方法（大多数现代浏览器使用Web\
    \ Socket，其他浏览器则会回退到合适的方法）。不使用AJAX是我选择在本章中不使用jQuery或任何类似库的最大因素之一，不过在大型项目中你可能需要使用它们。\n\
    \n**清单7-1**\n\n```html\n<script>\n  var socket = io.connect('http://localhost');\n\
    \n  socket.on('message', function(evt) {\n    document.querySelector(\"#messages\"\
    ).innerHTML += '<p><span class=\"nickname\">'+evt.nickname+': </span><span class=\"\
    message\">' + evt.message +'</span></p>';\n  });\n\n  sendButton = document.querySelector(\"\
    #send\");\n  var messages = document.querySelector(\"#message\");\n\n  sendButton.addEventListener('click',\
    \ function() {\n    socket.emit('message', {\n      \"message\": messages.value,\n\
    \      \"nickname\": document.querySelector(\"#nickname\").value || 'Guest'\n\
    \    });\n    messages.value = \"\";\n  });\n</script>\n```\n\n> **注意**  \n> 要在客户端使用`Socket.IO`，你必须包含`<script\
    \ src=\"/socket.io/socket.io.js\"></script>`，不过你不需要担心文件的位置，因为Node.js会自动处理。\n\n\
    ## 总结\n\n许多Node.js初学者在接触到一种与自己习惯的技术截然不同的技术时，总是感到有些畏惧。我希望本章能够让你轻松地进入Node.js的世界，让你觉得制作一个实时的多用户应用简直简单得可笑。聊天室可以非常多样化，所以这个练习应该为你学习更多语言知识提供了一个很好的起点。你可以通过使用你感兴趣的语言特性来增强聊天室，从而更进一步。在下一章中，我们将为聊天室添加视频和音频流功能，作为一种会议风格的功能，这将把你的Node.js专业技能提升到新的水平。\n\
    \n---\n\n# 8. 使用WebRTC进行视频到视频通信\n\n我们的聊天室的自然演进是视频对视频通信，就像Skype和Google Hangouts使用的那种，但直到最近，这比听起来要困难得多。为什么呢？是的，你猜对了……需要插件（也就是Flash）。直到2012年，也就是Web诞生近20年后，来自网络摄像头的原生视频流才开始进入浏览器。现在WebRTC开始得到良好支持，学习如何使用它是值得的。我不会假装它很简单——它确实不简单——但是，一旦你理解了它的工作原理，一切就都说得通了。\n\
    \n## WebRTC简介\n\n好了，我们知道WebRTC用于实现浏览器之间的通信，但它到底是什么？WebRTC实际上是一组规范，这些规范通常一起使用来创建实时通信链路。这组规范也包括用于数据的规范，所以它不仅限于视频和音频（尽管在撰写本文时，数据规范的支持还不够好，但正在积极开发中）。WebRTC的形成方式与TCP服务器非常相似，它需要使用正确的协议进行握手，而不是像你习惯使用的普通API那样。还应注意，WebRTC是点对点的，而不是客户端/服务器模式，这就是为什么它需要客户端额外的网络支持。由于大多数Web开发者可能从未需要编写TCP服务器，我认为我们应该从头开始。"
  raw: 'Currently there is nothing to see, because we didn’t even write ‘Hello World’
    to the page this time, so let’s set up a basic page using just HTML. For the most
    basic chatroom, all we need is two text boxes to put your name and message in
    (you could do name differently depending on UI choices) as well as a button to
    send the message and a div (you could use a list to improve semantics) to put
    the messages in. This file can be (although doesn’t have to be) saved as index.html
    in the same folder as the server code, as you would normally.


    `<!doctype html>`


    `<html>`


    `<head>`


    `<title>Chatroom</title>`


    `</head>`


    `<body>`


    `<label for="nickname">Nickname:</label><input type="text" id="nickname"></input>`


    `<div id="messages"></div>`


    `<textarea id="message"></textarea>`


    `<a id="send">Send</a>`


    `</body>`


    `</html>`


    Now you need to use routers (as we did in the Hello World example) to tell the
    browser where to find content. For this chatroom, we want multiple rooms to be
    accessible and a nice way to do this is have the name of the chatroom (or a random
    identifier) in the URL of the room. Express has a way to easily check for this
    name, as a pathname segment (also known as a named parameter), but because this
    chatroom does not need multiple views, we can just direct every page to index.html.
    We could use a wildcard for this instead of a pathname segment, but it is a nice
    way to introduce the idea of pathnames being used as parameters. It is also a
    way to force a chatroom id to be included, as it will not serve the page without
    any id; this means that a separate route would be needed if you want to add a
    homepage.


    `app.get(''/:id?'', function (req, res) {`


    `res.sendfile(__dirname + ''/index.html'');`


    `});`


    Of course, this is a rather useless chatroom. Let’s write the server-side code
    for dealing with messages. Using Socket.IO we need to check for a connection,
    using `io.sockets.on(''connection'', function (socket) {});` as an event handler
    for any connections, then join the room that is named in the pathname segment.
    Unlike Express, to get the identifier we use `var room = socket.handshake.headers.referer`
    as the Express `.get` call is not available once it has already been routed. Other
    ways to get the identifier would be to send the pathname segment from the client
    side or to initially serve it using a `res.local` (variables scoped to the request/response
    cycle) and exposing as a global variable on the client side. Using `socket.handshake`
    is quite long but in this case it is a nice way to avoid sending from the client
    side.


    With the identifier stored in a variable called `room`, we can now use `socket.join(room);`
    to join a Socket.IO room with the same name as the ID. These rooms are basically
    a way to send the right messages to the right people, only members of the room
    will get the messages for that particular room.


    To check for messages or when the user leaves the room, we use event handlers
    on socket. Every communication over Socket.IO is classed as a message, not to
    be confused with the messages that are written in the chatroom. Sending messages
    is called emitting. For messages in the chatroom to be sent to each other, we
    first emit the message on the client side (which I will get to shortly) to the
    server, which then sends it to the other clients connected to the room. To emit
    a message to the room from the server we use `io.sockets.in(room).emit(key, value);`.
    For a chatroom message we use the string `''message''` as the key and the data
    is passed through as the value from a data parameter on the event listener. For
    leaving a room, the key is `''leave''`.


    `io.sockets.on(''connection'', function (socket) {`


    `var room = socket.handshake.headers.referer;`


    `socket.join(room);`


    `socket.on(''message'', function (data) {`


    `io.sockets.in(room).emit(''message'', data);`


    `});`


    `socket.on(''leave'', function (room) {`


    `socket.leave(room);`


    `});`


    `});`


    And that’s it for the server in terms of a basic chatroom, you can see how brief
    the code is in Listing 7-1\. All we need to do now is for the event handlers on
    the client-side to emit the messages when sent so that, using the power of Socket.IO
    rooms and the code we have just written, it will automatically send the messages
    to anybody in the same room— in real time! There is no AJAX or long polling to
    worry about, Socket.IO uses the best method available (most modern browsers use
    Web Sockets but others fall back to the appropriate method). The lack of using
    AJAX is one of the biggest factors in my choice to not use jQuery or any similar
    libraries for this chapter, though you may need to for larger projects.


    Listing 7-1.


    `<script>`


    `var socket = io.connect(''http://localhost'');`


    `socket.on(''message'', function(evt) {`


    `document.querySelector("#messages").innerHTML += ''<p><span class="nickname">''+evt.nickname+'':
    </span><span class="message">'' + evt.message +''</span></p>'';`


    `});`


    `sendButton = document.querySelector("#send");`


    `var messages = document.querySelector("#message");`


    `sendButton.addEventListener(''click'', function() {`


    `socket.emit(''message'', {`


    `"message": messages.value,`


    `"nickname": document.querySelector("#nickname").value || ''Guest''`


    `});`


    `messages.value = "";`


    `});`


    `</script>`


    Note


    To use Socket.IO on the client-side you must include `<script src="/socket.io/socket.io.js"></script>`
    although you do not need to worry about the location because Node.js deals with
    it automatically.


    ## Summary


    Many Node.js beginners always feel a bit daunted at the prospect of learning a
    technology that is so different from what they are used to. I hope this chapter
    has eased you in to the world of Node.js in such a way that you find it almost
    laughably easy to make a real-time multi-user application. Chatrooms can be very
    diverse, so this exercise should give you a great starting point to learn more
    of the language. You can take it further by enhancing your chatroom using features
    of the language that you find interesting. In the next chapter we will be adding
    video and audio streaming to the chatroom as a conference-style feature that will
    take you to the next level of node expertise.


    # 8. Video-to-Video Using WebRTC


    The natural progression to our chatroom is video-to-video, such as the kind Skype
    and Google Hangouts use, but until very recently this was a lot harder than it
    sounds. Why? Yep, you guessed it . . . plugins were required (namely, Flash).
    It was not until 2012, nearly 20 years after the start of the Web, that the beginnings
    of native video streaming from a webcam started trickling into the browsers. Now
    that WebRTC is starting to become well supported, it is worth learning how to
    use it. I am not going to pretend it is simple—it isn’t—but, once you’ve got your
    head around how it works, it does make sense.


    ## Introduction to WebRTC


    Okay, so we know that WebRTC is used to allow communication between browsers,
    but what is it? WebRTC is actually a set of specifications that are often used
    together to create a real-time communication link. The group of specs includes
    one for data too so it is not just for video and audio (though at the time of
    writing, the data spec is not well supported but it is being actively developed).
    WebRTC is formed very similar to TCP servers in that it requires a handshake sent
    using correct protocols rather than just being a common API that you are used
    to using. It should also be noted that WebRTC is peer to peer rather than client/server,
    which is why it requires extra networking on the client-side. Since the majority
    of web developers have probably never needed to write a TCP server, I think we
    should start from the beginning.'
