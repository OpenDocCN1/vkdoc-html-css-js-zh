  trans: "\n# 创建键盘\n\n在掌握了基础理论之后，让我们着手创建一个键盘。实现方式有很多种，比如使用 DOM 或 Canvas，但由于琴键都是基本的矩形，我认为最佳方案是使用基于矢量的\
    \ SVG。为了更便捷地创建 SVG 并将事件绑定到琴键（使其真正可用），我们将使用一个名为 `svg.js` 的库（可在 `www.svgjs.com`\
    \ 找到）。一架钢琴有 88 个琴键（52 个白键和 36 个黑键），由于屏幕键盘容纳这么多键位过于拥挤，我决定只包含中间的 3 个八度，这样我们就有了 21\
    \ 个白键。此外，仅允许鼠标操作并不合理，因为除非使用多点触控屏，否则你无法同时按下多个琴键。当然，标准 QWERTY 键盘中排只有九个字母键，因此我决定将\
    \ S 到 K 这七个键定义为可演奏的白键，并使用 A 和 L 键来分别降低或升高一个八度。这并非完美方案，因为你可能需要同时演奏多个八度，但对于本项目而言已经足够了。\n\
    \n让我们从定义一个 SVG 开始：`var keyboard = SVG('keyboard')`；这将创建一个 id 为 keyboard 的 SVG，可以通过同名变量进行访问。创建好\
    \ SVG 后，我们就可以开始添加琴键了。白键是最简单的，因为我们只需将 SVG 的宽度（以及位置）除以所需琴键的数量来创建即可。由于这些是白键，我们需要设置属性，使其填充色为白色，描边色为黑色。我们还需要设置\
    \ id 属性，以便后续可以修改琴键的背景（用于按键反馈），id 将被设置为 `\"key\"+i`，这样我们就可以通过遍历这 21 个键轻松访问每个键。\n\
    \n```\nvar keys = [];\n\nfor (var i = 0; i < 21; i++)  {\n    keys[i] = keyboard.rect(width/21,\
    \ height);\n    keys[i].move(width/21 * i, 0);\n    keys[i].attr({ fill: '#fff',\
    \ stroke: '#000', id: \"key\"+i });\n    // 事件处理程序添加在此处\n}\n```\n\n我们还需要为黑键添加矩形，但它们并非直接相邻，而是分成\
    \ 2 个和 3 个一组的组合，并且黑键的高度仅为键盘高度的一半多一点。为了将这些键分组，我选择简化处理：只需检查 `i` 是否是某组中的最后一个键。如果是，则将一个白键的宽度（`width/21`）加到名为\
    \ `prevKey` 的变量中，该变量用于计算黑键的位置。\n\n```\nvar bkeys = [];\nvar prev = 0;\n\nfor (var\
    \ i = 0; i < 15; i++)  {\n    bkeys[i] = keyboard.rect(width/42, height / 1.7);\n\
    \    bkeys[i].attr({ fill: '#000', stroke: '#000', id: \"bkey\"+i });\n    bkeys[i].move(prev\
    \ + (width/(21*1.3)), 0);\n    prev = prev + width/21;\n    if (i == 1 || i ==\
    \ 4 || i == 6 || i == 9 || i == 11)  {\n        prev += width/21;\n    }\n   \
    \ // 事件处理程序添加在此处。\n}\n```\n\n现在，一个键盘已经绘制到了屏幕上，如图 5-2 所示。\n\n![A978-1-4302-5945-9_5_Fig2_HTML.jpg](img/A978-1-4302-5945-9_5_Fig2_HTML.jpg)\n\
    \n**图 5-2.** 键盘布局，包含三个八度\n\n键盘布局创建完成后，我们需要添加事件处理程序，以便能够播放声音并高亮显示被按下的键。由于我们有两种输入方式（键盘和鼠标），因此需要不少事件处理程序。`SVG.js`\
    \ 使我们能够轻松地将事件处理程序绑定到每个键，通过将 `mousedown` 和 `mouseup` 事件绑定到琴键，可以方便地处理鼠标操作。`keypress`\
    \ 和 `keyup` 事件则通过向窗口添加事件监听器来处理，这是事件处理的常规方式。为了将琴键与音符绑定，我们需要为黑键（上排）和白键（中排）设置数组。由于\
    \ `keypress` 和 `keyup` 事件中每个键的键码不同，因此每种键都需要两个数组。为了获得正确的音符（因为计算机键盘没有足够的键对应所有音符），我们需要将音符位置（将\
    \ S 到 K 视为一个八度）加上该八度内的键数乘以当前八度数；这意味着黑键使用 `i + octave * 5`，白键使用 `i + octave * 7`。对于鼠标事件，我们需要使用闭包来保存计数器，因为我们必须在刚才创建的\
    \ for 循环内部为每个键绑定事件，但如果不用闭包，循环结束后 `i` 的值会是 `21` 而不是正确的值。当一个键被按下时，它需要改变颜色，并在键被释放后恢复原色（无论使用鼠标还是键盘都是如此）。对于声音，我们将使用名为\
    \ `playSound(n)` 和 `stopSound(n)` 的函数，其中 `n` 是闭包创建时的原始 `i` 值。这些更改如示例 5-1 所示。\n\
    \n**示例 5-1.**\n\n```\nvar keyboardKeys = [83,68,70,71,72,74,75];\nvar blackKeys\
    \ = [69,82,89,85,73];\nvar keyboardPressKeys = [115,100,102,103,104,106,107];\n\
    var blackKeyPress = [101, 114, 121, 117, 105];\nvar octave = 1; // 其中八度 1 = 中央\
    \ C\n\nvar keys = [];\n\nfor (var i = 0; i < 21; i++)  {\n    keys[i] = keyboard.rect(width/21,\
    \ height);\n    keys[i].move(width/21 * i, 0);\n    keys[i].attr({ fill: '#fff',\
    \ stroke: '#000', id: \"key\"+i });\n    keys[i].mousedown ((function(n) {\n \
    \       return function()  {\n            var key = SVG.get(\"key\"+n);\n    \
    \        key.fill({ color: '#f06' });\n            playSound(n, false);\n    \
    \    }\n    })(i));\n    keys[i].mouseup((function(n)  {\n        return function()\
    \ {\n            keys[n].fill({ color: '#fff' });\n            stopSound(n, false);\n\
    \        }\n    })(i));\n}\n\nvar bkeys = [];\nvar prev = 0;\n\nfor (var i = 0;\
    \ i < 15; i++)  {\n    bkeys[i] = keyboard.rect(width/42, height / 1.7);\n   \
    \ bkeys[i].attr({ fill: '#000', stroke: '#000', id: \"bkey\"+i });\n    bkeys[i].move(prev\
    \ + (width/(21*1.3)), 0);\n    prev = prev + width/21;\n    if (i == 1 || i ==\
    \ 4 || i == 6 || i == 9 || i == 11)  {\n        prev += width/21;\n    }\n   \
    \ bkeys[i].mousedown ((function(n) {\n        return function()  {\n         \
    \   var key = SVG.get(\"bkey\"+n);\n            key.fill({ color: '#f06' });\n\
    \            playSound(n, true);\n        }\n    })(i));\n    bkeys[i].mouseup((function(n)\
    \  {\n        return function() {\n            bkeys[n].fill({ color: '#000' });\n\
    \            stopSound(n, true);\n        }\n    })(i));\n}\n\nwindow.addEventListener('keypress',\
    \ function(e) {\n    for (var i = 0; i < keyboardPressKeys.length; i++)  {\n \
    \       if (e.keyCode == keyboardPressKeys[i]) {\n            var n = i + octave\
    \ * 7;\n            var key = SVG.get(\"key\"+n);\n            key.fill({ color:\
    \ '#f06' });\n            playSound(n, false);\n        }\n    }\n    for (var\
    \ i = 0; i < blackKeyPress.length; i++)  {\n        if (e.keyCode == blackKeyPress[i])\
    \ {\n            var n = i + (octave * 5);\n            var key = SVG.get(\"bkey\"\
    +n);\n            key.fill({ color: '#f06' });\n            playSound(n, true);\n\
    \        }\n    }\n    if (e.keyCode == 97 && octave > 0) --octave;\n    if (e.keyCode\
    \ == 108 && octave < 2) ++octave;\n});\n\nwindow.addEventListener('keyup', function(e)\
    \ {\n    console.log(e.keyCode);\n    for (var i = 0; i < keyboardKeys.length;\
    \ i++)  {\n        if (e.keyCode == keyboardKeys[i]) {\n            var key =\
    \ SVG.get(\"key\"+(i+octave*7));\n            key.fill({ color: '#fff' });\n \
    \           stopSound(i+octave*7, false);\n        }\n    }\n    for (var i =\
    \ 0; i < blackKeys.length; i++)  {\n        if (e.keyCode == blackKeys[i]) {\n\
    \            var n = i + octave * 5;\n            var key = SVG.get(\"bkey\"+n);\n\
    \            key.fill({ color: '#000' });\n            stopSound(n, true);\n \
    \       }\n    }\n});\n```\n"
- fmt: "要播放每个音符，我们需要两个振荡器数组，一个用于黑键，一个用于白键。我们将每个振荡器连接到一个单独的增益节点上，这样我们就有了一个节点可以用来录制音乐，以及实现音量调节的潜力。显然，每个振荡器需要以正确的频率运行，我们可以自动生成这些频率，但由于我们确切知道将使用哪些按键（并且考虑到黑键之间的间隔，生成这些频率特别麻烦），我们可以像这样在数组中指定它们：\n\
    \n```javascript\nvar whiteNotes = [130.82, 146.83, 164.81, 174.61, 196, 220, 246.94,\
    \ 261.63, 293.66, 329.63,\n349.23, 392, 440, 493.88, 523.25, 587.33, 659.26, 698.46,\
    \ 783.99, 880, 987.77];\nvar blackNotes = [138.59, 155.56, 185, 207.65, 233.08,\
    \ 277.18, 311.13, 369.99, 415.3, 466.16, 554.37, 622.25, 739.99, 830.61, 932.33];\n\
    ```\n\n正如你在设置按键的代码中看到的，`playSound`和`stopSound`函数都将`i`和`black`作为参数，这样我们就可以知道正在播放音符的位置和包含其频率的数组。在`playSound`内部，我们选择振荡器，设置频率和类型，然后当然使用`osc.noteOn(0)`将其开启。\n\
    \n- `Sine`波 = 0\n- `Square`波 = 1\n- `Sawtooth`波 = 2\n- `Triangle`波 = 3\n\n我根据个人偏好选择了锯形波，但请全部尝试一下，看看你更喜欢哪个！修改后的代码如下所示：\n\
    \n```javascript\nfunction playSound(i, black) {\n    stopSound(i, black);\n  \
    \  var freq;\n    if (black) freq = blackNotes[i];\n    else freq = whiteNotes[i];\n\
    \    if (black) osc = ob[i];\n    else osc = o[i];\n    osc.type = 3;\n    osc.frequency.value\
    \ = freq;\n    console.log(freq);\n    osc.connect(gainNode);\n    osc.noteOn(0);\n\
    \    if (black) ob[i] = osc;\n    else o[i] = osc;\n}\n\nfunction stopSound(i,\
    \ black)  {\n    if (black) osc = ob[i];\n    else osc = o[i];\n    if (typeof(o[i])\
    \ != \"undefined\") {\n        osc.noteOff(0);\n        osc.disconnect();\n  \
    \      osc = ctx.createOscillator();\n    }\n    if (black) ob[i] = osc;\n   \
    \ else o[i] = osc;\n}\n```\n\n这就是创建可弹奏键盘所需的全部内容！`Web Audio API`处理了大部分底层声音管理，所以你只需要连接节点并播放音符即可。我使用了`SVG.js`，但你可以使用任何其他内容，从头开始创建，甚至可以使用矢量程序（如`Adobe\
    \ Illustrator`）来导出`SVG`。\n\n### 录制音乐\n\n现在我们有了一个可用的键盘，我们希望能够录制并回放输出。在本章的后面，我们将添加在轨道上移动音乐片段的功能，因此我们需要存储音乐。为了将其作为独立应用使用，无需服务器或让用户下载和上传音乐而使事情复杂化，我们将使用本地存储作为轻松存储和检索音乐的方式。本地存储使用键值对工作，因此我们需要为音乐命名（可以通过用户输入或基于本地存储大小生成），并且还需要将音乐存储为值——这是比较棘手的地方。\n\
    \n我不喜欢重新发明轮子（而且正如我所说，这相当棘手），因此为了将音乐录制为`wav`编码的`blob`，我决定使用`Matt Diamond`的`Recorder.js`（可以在[`http://www.github.com/mattdiamond/Recorderjs`](http://www.github.com/mattdiamond/Recorderjs)找到）。这个库通过监听指定的`Web\
    \ Audio API`通道工作，而不是正常连接，然后启用多种方法，包括我们将用来将音频作为`blob`获取的方法（`exportWAV`）。\n\n> **注意**\n\
    > 要使用`Recorder.js`，你必须在`web`服务器上，因为它使用`web workers`来提高性能。在电脑上实现此目的的一种方法是运行`python\
    \ -m SimpleHTTPServer`。\n\n让我们开始设置记录器，让它监听我们之前创建的增益节点。在构造函数中完成此操作后，我们开始录制。\n\n\
    ```javascript\nvar recorder = new Recorder(gainNode, { workerPath: \"../recorderWorker.js\"\
    });\nrecorder.record();\n```\n\n如你所见，这使得监听从`gainNode`到输出硬件的任何音频变得非常容易。现在，我们需要创建一个录制声音以及播放声音的函数。当我们调用`recordSound`方法时，我们需要将`blob`（即音频）存储为文本（因为`localStorage`不允许直接存储对象），因此我们使用`window.URL.createObjectURL`转换对象。要播放音乐，我们动态创建一个新的`Audio`元素（尽管无需将其附加到`DOM`），其`src`链接到`localStorage`中存储的`URL`。为了使其可扩展，以便我们可以拥有许多音乐片段，每个函数都有一个名为`name`的参数，该参数成为`localStorage`的键（其中对象`url`是值）。由于对象`URL`的创建方式，要以任何方式使用它们，你需要将它们添加为音频元素的`src`。由于为每个片段这样做效率低下，因此更好的方法是在录制期间计算出持续时间，并将其与对象`URL`一起作为一个对象，然后使用`JSON`将其转换为字符串。\n\
    \n```javascript\nfunction recordSound(name)  {\n    recorder.exportWAV(function(blob)\
    \ {\n        var object =  {\n            file: window.URL.createObjectURL(blob),\n\
    \            size: recordEnd - recordStart\n        }\n        localStorage[name]\
    \ = JSON.stringify(object);\n        drawTimeline();\n    });\n}\n\nfunction playAudio(id)\
    \  {\n    var audio = new Audio(JSON.parse(localStorage[localStorage.key(id)]).file);\n\
    \    audio.play();\n}\n```\n\n使用`Recorder.js`，我们可以轻松录制`Web Audio API`能够产生的任何音频，无论是生成的音符还是吉他等输入。这使得在客户端存储录音并播放它们变得很容易。"
  raw: 'To play each note we need to have two arrays of oscillators, one for black
    and one for white. We connect each oscillator to a single gain node so that we
    have a node that we can use for recording the music, as well as potential for
    a volume changer. Obviously each oscillator needs to run at the correct frequency,
    we could automatically generate the frequencies but because we know exactly which
    keys will be used (and it is particularly awkward to generate them taking into
    consideration the gaps in the black keys) we can specify them in arrays like so:


    `var whiteNotes = [130.82, 146.83, 164.81, 174.61, 196, 220, 246.94, 261.63, 293.66,
    329.63,`


    `349.23, 392, 440, 493.88, 523.25, 587.33, 659.26, 698.46, 783.99, 880, 987.77];`


    `var blackNotes = [138.59, 155.56, 185, 207.65, 233.08, 277.18, 311.13, 369.99,
    415.3, 466.16, 554.37, 622.25, 739.99, 830.61, 932.33];`


    As you saw in the code for setting up the keys, the `playSound` and `stopSound`
    functions both take `i` and `black` as parameters so that we can know the position
    and the array that has the frequency for the note that is being played. Within
    `playSound` we select the oscillator and set both the frequency as well as the
    type and of course then turn it on using `osc.noteOn(0)`.


    *   Sine wave = 0

    *   Square wave = 1

    *   Sawtooth wave = 2

    *   Triangle wave = 3


    I have chosen sawtooth due to personal preference, but try them all and see what
    you think! The modified code is shown here:


    `function playSound(i, black) {`


    `stopSound(i, black);`


    `var freq;`


    `if (black) freq = blackNotes[i];`


    `else freq = whiteNotes[i];`


    `if (black) osc = ob[i];`


    `else osc = o[i];`


    `osc.type = 3;`


    `osc.frequency.value = freq;`


    `console.log(freq);`


    `osc.connect(gainNode);`


    `osc.noteOn(0);`


    `if (black) ob[i] = osc;`


    `else o[i] = osc;`


    `}`


    `function stopSound(i, black)  {`


    `if (black) osc = ob[i];`


    `else osc = o[i];`


    `if (typeof(o[i]) != "undefined") {`


    `osc.noteOff(0);`


    `osc.disconnect();`


    `osc = ctx.createOscillator();`


    `}`


    `if (black) ob[i] = osc;`


    `else o[i] = osc;`


    `}`


    That’s all you need to create a playable keyboard! The Web Audio API handles most
    of the low-level sound management, so you only need to connect the nodes and play
    the notes. I’ve used SVG.js but you could use anything else, create it from scratch,
    or even use a vector program such as Adobe Illustrator to export SVGs.


    #### Recording the Music


    Now that we have a working keyboard, we want to be able to record it and playback
    the output. Later in the chapter we will be adding functionality to move the music
    clippings around a track, so we need to store the music. So that we can use this
    as a standalone app, without requiring a server or complicating things for the
    user by asking them to download and upload the music , we will use local storage
    as a way to easily store and retrieve the music. Local storage works using key-value
    pairs, so we are going to need to name the music (which can be done either by
    user input or generating it based on the size of the local storage) and we also
    need to store the music as a value`—`this is the tricky bit.


    I am not a fan of reinventing the wheel (and as I said, it is quite tricky), so
    to record the music to a wav encoded blob I have decided to use Matt Diamond’s
    Recorder.js (this can be found at [`http://www.github.com/mattdiamond/Recorderjs`](http://www.github.com/mattdiamond/Recorderjs)
    ). This library works by watching a specified Web Audio API channel, instead of
    connecting as normal, then enables a number of methods, including the method (exportWAV)
    that we will be using to get the audio as a blob.


    Note


    To use Recorder.js you must be on a web server because it uses web workers to
    improve performance. One way to do this on your computer is to run `python -m
    SimpleHTTPServer`.


    Let’s start setting up the recorder by making it watch the gain node we created
    earlier. After that is done in the constructor, we then start recording.


    `var recorder = new Recorder(gainNode, { workerPath: "../recorderWorker.js"});`


    `recorder.record();`


    As you can see, this makes it very easy to watch any audio that goes from `gainNode`
    to the output hardware. Now we need to create a function for recording the sound
    as well as playing it. When we call the `recordSound` method we need to store
    the blob (that is, the audio) as text (because `localStorage` does not allow objects
    to be directly stored) so we convert the object using `window.URL.createObjectURL`.
    To play the music we dynamically create a new Audio element (no need to append
    it to the DOM though) that has the src linking to the URL stored in `localStorage`.
    To make it scalable, so we can have a lot of music clippings, each function has
    a parameter called name that then becomes the key to the localStorage (where the
    object url is the value). Due to the way object URLs are created, to use them
    in any way you need to add them as the src of an audio element. Due to inefficiencies
    of doing so for every clip, it is instead best to work out the duration while
    it is recording and to add it alongside the object URL as an object that is then
    made into a string using JSON.


    `function recordSound(name)  {`


        `recorder.exportWAV(function(blob) {`


            `var object =  {`


                `file: window.URL.createObjectURL(blob),`


                `size: recordEnd - recordStart`


            `}`


            `localStorage[name] = JSON.stringify(object);`


            `drawTimeline();`


        `});`


    `}`


    `function playAudio(id)  {`


        `var audio = new Audio(JSON.parse(localStorage[localStorage.key(id)]).file);`


        `audio.play();`


    `}`


    Using `Recorder.js` allows us to painlessly record anything that the Web Audio
    API can produce, be that generated notes or an input such as guitar. This makes
    it easy to store the recordings on the client side and play them back.'
