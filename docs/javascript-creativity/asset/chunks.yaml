    \ RFC 5245（[`www.ietf.org/rfc/rfc5245.txt`](http://www.ietf.org/rfc/rfc5245.txt)）的定义，它是“一种用于提供/应答模型的网络地址转换（NAT）遍历协议”。该\
    \ RFC 文档非常详细，部分人可能会觉得很有趣，但我认为摘要已经很好地概括了其目的。对某些人来说，这些内容听起来可能完全像天书，但希望在你阅读完我关于 ICE\
    \ 及其他技术的简短总结后，能够理解它。\n\n> 本文档描述了一种用于基于 UDP 的多媒体会话的网络地址转换（NAT）遍历协议，该会话通过提供/应答模型建立。此协议称为交互式连接建立（ICE）。ICE\
    \ 利用了用于 NAT 的会话遍历工具（STUN）协议及其扩展——使用中继进行 NAT 遍历（TURN）。任何使用提供/应答模型的协议（如会话发起协议 SIP）都可以使用\
    \ ICE。——RFC 5245 摘要\n\n正如我在本章“规范”部分所解释的，每个 WebRTC 客户端必须具备的对等连接由多个组件构成，包括 `iceConnectionState`、`iceGatheringState`\
    \ 以及 ICE 代理。ICE 代理是重要（且简单）的部分。它是每个客户端上 WebRTC 的端点，负责使用信令协议与其他端点通信。我们使用 ICE 的原因是（正如摘要所述）它是用于\
    \ UDP 通信 NAT 遍历的标准化协议。这基本上意味着它能够在不被阻止的情况下穿越安全机制（如防火墙）。ICE 通过并行检查所有可能的通信路径来工作，从而快速找到最优路径。状态（显而易见）用于查找\
    \ ICE 代理的状态，并且它们是只读的。\n\n`iceGatheringState` 的可能状态包括：\n\n*   `new`\n*   `gathering`\n\
    *   `complete`\n\n`iceConnectionState` 的可能状态包括：\n\n*   `starting`\n*   `checking`\n\
    *   `connected`\n*   `completed`\n*   `failed`\n*   `disconnected`\n*   `closed`\n\
    \n## NAT 遍历\n\nNAT 是硬件路由器（以及部分商用交换机）背后的技术，它允许一台路由器后面的多台机器使用同一个 IP 地址工作。它接收传入的数据包，并根据数据包的来源将其发送到正确的设备。它将内部网络地址（例如\
    \ `192.168.1.123`）转换为外部 IP，反之亦然。出于多种原因（包括安全性），入站通信通常受到限制，并且通常涉及一个端口白名单表，NAT 设备使用该表将内部地址与入站端口关联起来（通常称为防火墙）。\n\
    \nNAT 遍历是一组方法的统称，用于以用户友好的方式绕过这些限制。如果没有 NAT 遍历技术，用户将不得不手动在防火墙上打开端口以允许入站流量，并将这些端口信息提供给其他连接方。一些常见的\
    \ NAT 遍历技术包括：反向代理、套接字安全（SOCKS）、通用即插即用（UPnP）和 UDP 打洞。\n\n## STUN/TURN\n\nSTUN（用于\
    \ NAT 的会话遍历工具）和 TURN（围绕 NAT 使用中继进行遍历）都是信令协议，通常被 ICE 用作 NAT 遍历的工具。如果你希望运行自己的服务器，每种协议都有开源实现。我在本章中使用的两个服务器（你只需要一个，但可以配置多个作为备份）分别由\
    \ Google 和 Mozilla 运行，地址为 `stun:stun.l.google.com:19302` 和 `stun:stun.services.mozilla.com`。你会注意到这两个服务器都是\
    \ STUN 服务器。这主要是因为它们是我找到的第一个可靠的免费服务器。两者之间的主要区别在于，TURN 使用中继技术，因此数据通过中继服务器传输到客户端。然而，TURN\
    \ 的优点是它构建在 STUN 之上，因此它始终首先尝试使用 STUN，如果失败，则使用中继。TURN 的另一个优点是它适用于对称 NAT，而 STUN 无法做到这一点。\n"
- fmt: "### SDP\n\n如果我用“天书”来形容 ICE 协议的抽象内容，那么我的词汇量无法描述 SDP。乍一看（可能第二眼和第三眼也是），它看起来难以理解。但别担心，重要的部分相当容易理解，其余部分都有文档说明（主要在\
    \ `RFC4566` 中）。`SDP` 代表会话描述协议（Session Description Protocol），是在客户端之间发送的数据形式。以下是一个\
    \ SDP 示例，本例在 `localhost` 下运行本章代码，并在两个 Google Chrome 标签页之间建立连接。SDP 内容范围很广，很大程度上取决于通信阶段，因此如果你查看自己的\
    \ SDP 数据，不要期望它看起来完全相同。我只包含了前 11 行，因为大部分内容对我们调试来说通常没什么用，而且主要与加密有关。\n\n```\nv=0\n\
    o=- 6888311506875211333 2 IN IP4 127.0.0.1\ns=-\nt=0 0\na=group:BUNDLE audio video\n\
    a=msid-semantic: WMS YuWoij3TGBXIt0Ud2iqCWMbt7FnkBqSNpP96\nm=audio 1 RTP/SAVPF\
    \ 111 103 104 0 8 107 106 105 13 126\nc=IN IP4 0.0.0.0\na=rtcp:1 IN IP4 0.0.0.0\n\
    a=ice-ufrag:qbj6LYoXCSHnUUuq\na=ice-pwd:C/eziXfWhziBTVpMylTLU2M3\n```\n\n这看起来令人生畏，我知道。让我们从等号前面的字母开始。这被称为“类型”，它始终只是一个字符，并且区分大小写。类型的顺序是预定义的，主要是为了减少错误，并使得解析器更容易实现。当然，这也方便调试，因为我们始终知道要找的数据应该在哪里！我只解释前四行，因为它们是最可能出错的行，其余的都是可选的，因此不太可能出问题（如果出了问题，更可能是浏览器中的\
    \ bug，而不是你的代码）。请注意，属性采用`<type>=<attribute>:<value>`的形式。如果你有兴趣了解大多数属性，可以很容易地在网上搜索到，我可能会在我的网站上写一篇文章来配合本章内容。\n\
    \n```\n会话描述\nv=  (协议版本)\no=  (发起者和会话标识符)\ns=  (会话名称)\ni=* (会话信息)\nu=* (描述的统一资源标识符)\n\
    e=* (电子邮件地址)\np=* (电话号码)\nc=* (连接信息 —— 如果包含在所有媒体中则不需要)\nb=* (零行或多行带宽信息)\n一个或多个时间描述\
    \ (\"t=\" 和 \"r=\" 行；见下文)\nz=* (时区调整)\nk=* (加密密钥)\na=* (零行或多行会话属性行)\n零个或多个媒体描述\n\
    \n时间描述\nt=  (会话激活时间)\nr=* (零个或多个重复时间)\n\n媒体描述（如果存在）\nm=  (媒体名称和传输地址)\ni=* (媒体标题)\n\
    c=* (连接信息 —— 如果在会话级别包含则为可选项)\nb=* (零行或多行带宽信息)\nk=* (加密密钥)\na=* (零行或多行媒体属性行)\n\n\
    * 表示可选项\n```\n\n本类型指南摘自 `RFC 4566`，因此感谢互联网协会（The Internet Society）。你可以很容易地看到 `SDP`\
    \ 对象如何分为三个部分。在撰写本文时，所有 SDP 对象都以 `v=0` 开头，因为没有其他可用版本。在我的示例中，第二行（发起者和会话标识符）是 `o=-\
    \ 6888311506875211333 2 IN IP4 127.0.0.1`。连字符表示没有用户名，因为我没有使用私有的 `TURN` 服务器。长数字是会话的唯一标识符。接下来，我们找到这一行的关键部分，至少对于调试来说，那就是会话版本；这是会话数据更改的次数（每次我们发送包含数据的新消息时，此数字都会增加）。你可以使用会话版本绝对确定会话描述已更新。`IN`\
    \ 代表互联网（Internet），它在那里是为了使协议具有前瞻性。然后我们有 IP 类型，在这种情况下是 IP 版本 4。第二行最后是 IP 地址。我在本地运行，因此它报告\
    \ IP 地址为 `127.0.0.1`（`localhost`）。\n\n你可能注意到我的示例直接跳到了时间部分，这是一个实现决策（在本例中由 Chrome\
    \ 决定），因为中间的行都是可选的。第一个 `0` 表示开始时间，后面的 `0` 表示停止时间。由于两者都是 `0`，这意味着会话是永久性的。\n\n##\
    \ 客户端代码\n\n好吧，这是从代码中解脱出来的一个不错休息，但我认为我们都准备好重新投入，并对 `WebRTC` 实际工作原理以及我们发送的数据到底是什么有了更坚实的理解。还记得信令如何工作的概述吗？这里再次以列表形式呈现，以便更容易实现：\n\
    \n1. 启动摄像头。\n2. 将流添加到 `Peer Connection`。\n3. 发送带有本地描述（Local Description）的 `received_offer`\
    \ 消息。\n4. 将本地描述添加到 `Peer Connection`。\n5. 将接收到的描述作为远程描述（Remote Description）添加到\
    \ `Peer Connection`。\n6. 创建应答（Answer）。\n7. 设置 `connect` 为 `true` 以防止无限循环。\n8.\
    \ 添加 `ICE Candidate`。\n9. 加载摄像头。\n\n你可能还记得本章开头，启动摄像头的正确方法是使用 `navigator.getUserMedia()`。不幸的是，由于在撰写本文时浏览器中的不同实现，我们使用了\
    \ `Adapter.js`，它去掉了供应商前缀，以便跨浏览器使用 `RTC`。为了快速加载视频，无需担心用户界面等，我们将 `getUserMedia`\
    \ 放入一个名为 `broadcast()` 的函数中，并在 `window.onload` 中调用它。在 `getUserMedia` 的回调中，我们需要将流添加到\
    \ `Peer Connection`，然后使用 `URL.createObjectURL()`（我们在[第 2 章](#A978-1-4302-5945-9_2_Chapter.html)中使用过）将流添加到\
    \ `video` 元素并播放视频。一旦服务器发送消息表明房间人数超过 1，就该向服务器发送 offer 了。\n\n```javascript\nvar\
    \ socket = io.connect('http://localhost');\nvar pc = new RTCPeerConnection(servers,\
    \ mediaConstraints);\nvar initConnection = false;\n\nsocket.on('room_count', function(data)\
    \ {\n  room_count = data;\n  console.log('ROOM COUNT', data);\n  if (room_count\
    \ > 1)\n    initConnection = true;\n});\n\nfunction broadcast() {\n  getUserMedia({audio:\
    \ true, video: true}, function(s) {\n    pc.addStream(s);\n    console.log(\"\
    GOT MEDIA\");\n    vid1.src = URL.createObjectURL(s);\n    vid1.play();\n    if\
    \ (initConnection) start();\n  }, function(error) {throw error;});\n};\n\nwindow.onload\
    \ = function() {\n  broadcast();\n};\n```\n\n在 `start()` 中，我们需要创建 offer，这通过 `Peer\
    \ Connection` 的 `pc.createOffer()` 发生。该方法本身提供了 `SDP` 作为参数，我们可以使用它来设置本地描述（Local\
    \ Description），并向服务器发送一条包含 `SDP` 的 `'received_offer'` 消息。\n\n```javascript\nfunction\
    \ start() {\n  console.log('STARTING');\n  // 这将初始化 peer connection\n  pc.createOffer(function(description)\
    \ {\n    console.log(description);\n    pc.setLocalDescription(description);\n\
    \    socket.emit('received_offer', JSON.stringify(description));\n  }, null, mediaConstraints);\n\
    };\n```\n\n你会注意到两个额外的参数，第二个是用于错误处理的回调（为了简单起见，我省略了它），第三个是我称为 `mediaConstraints`\
    \ 的变量。这个变量包含强制数据，用于说明视频和/或音频是否可用，以及可选数据，在本例中是 `DtlsSrtpKeyAgreement`，它用于为默认不启用它的浏览器（例如旧版\
    \ Chrome）启用数据报传输层安全性（Datagram Transport Layer Security）。\n\n```javascript\nvar\
    \ mediaConstraints = {\n  'mandatory': {\n    'OfferToReceiveAudio':true,\n  \
    \  'OfferToReceiveVideo':true\n  },\n  'optional': [{'DtlsSrtpKeyAgreement': 'true'}]\n\
    };\n```"
  raw: '### SDP


    If I called the abstract for the ICE protocol gobbledygook, then my vocabulary
    cannot describe SDP. At first glance (and probably at second and third too), it
    looks impenetrable. But do not worry, the important bits are quite simple to understand
    and the rest is documented (primarily in RFC4566). SDP stands for Session Description
    Protocol and is the form of data that is sent between clients. Below is an example
    of SDP, in this case running the code for this chapter under localhost and having
    a connection between two Google Chrome tabs. There is a wide range of possible
    SDP contents, largely dependent on the stage of communication, so don’t expect
    it to look identical if you look at your own SDP data. I have only included the
    first 11 lines because the majority of it is not often useful to us for debugging
    and it mostly concerned with encryption.


    `v=0`


    `o=- 6888311506875211333 2 IN IP4 127.0.0.1`


    `s=-`


    `t=0 0`


    `a=group:BUNDLE audio video`


    `a=msid-semantic: WMS YuWoij3TGBXIt0Ud2iqCWMbt7FnkBqSNpP96`


    `m=audio 1 RTP/SAVPF 111 103 104 0 8 107 106 105 13 126`


    `c=IN IP4 0.0.0.0`


    `a=rtcp:1 IN IP4 0.0.0.0`


    `a=ice-ufrag:qbj6LYoXCSHnUUuq`


    `a=ice-pwd:C/eziXfWhziBTVpMylTLU2M3`


    Daunting, I know. Let’s start with the letters before the equal sign. This is
    called the type and it is always just one character and is case-sensitive. The
    order of types is predefined, mostly to reduce errors and so that parsers can
    be implemented more easily. Of course it is also handy for debugging, as we will
    always know where the data we are looking for should be! I will only explain the
    first four lines as they are the ones that are most likely to go wrong, the rest
    are optional and therefore are less likely to break (and if it does, more likely
    to be a bug in the browser rather than your code). Do note that the attributes
    are in the form of `<type>=<attribute>:<value>.` Most attributes are easily searchable
    online if you are interested in learning about them, and I will probably write
    an article to accompany this chapter on my site.


    `Session description`


    `v=  (protocol version)`


    `o=  (originator and session identifier)`


    `s=  (session name)`


    `i=* (session information)`


    `u=* (URI of description)`


    `e=* (email address)`


    `p=* (phone number)`


    `c=* (connection information -- not required if included in`


    `all media)`


    `b=* (zero or more bandwidth information lines)`


    `One or more time descriptions ("t=" and "r=" lines; see below)`


    `z=* (time zone adjustments)`


    `k=* (encryption key)`


    `a=* (zero or more session attribute lines)`


    `Zero or more media descriptions`


    `Time description`


    `t=  (time the session is active)`


    `r=* (zero or more repeat times)`


    `Media description, if present`


    `m=  (media name and transport address)`


    `i=* (media title)`


    `c=* (connection information -- optional if included at`


    `session level)`


    `b=* (zero or more bandwidth information lines)`


    `k=* (encryption key)`


    `a=* (zero or more media attribute lines)`


    `* means optional`


    This guide to types was taken from the RFC 4566, so credit goes to The Internet
    Society. You can see quite easily how the SDP object breaks up into three sections.
    At the time of writing, all SDP objects start with v=0 because there are no other
    versions available. In my example, the second line (originator and session identifier)
    was `o=- 6888311506875211333 2 IN IP4 127.0.0.1`. The hyphen indicates that there
    is no username because I was not using a private TURN server. The long number
    is the unique identifier for the session. Next we find the important part of this
    line, at least for debugging, the session version; this is the amount of times
    the session data has changed (each time we send a new message with data, this
    number increments). You can use the session version to be absolutely sure that
    the session description was updated. `IN` stands for Internet, it is there to
    make the protocol future proof. We then have the type of IP, in this case IP version
    4\. Last on the second line is the IP address. I was running locally so it reported
    the IP address back as being 127.0.0.1 (localhost).


    You may notice that my example jumps straight to the timing section, this is an
    implementation decision (in this case by Chrome) as the lines in between are all
    optional. The first 0 represents start time and the following 0 represents stop
    time. Since both are 0, it means the session is permanent.


    ## Client-side Code


    Okay, that was a nice break from the code but I think we are all ready to dive
    back in with a firmer understanding of how WebRTC actually works and what the
    data we are sending really is. Remember the walkthrough of how the signaling works?
    Here it is again in the form of a list to make it easier to implement:


    Start webcam.   Add stream to peer connection.   Send received_offer message with
    Local Description. Add local description to Peer Connection.     Adds received
    description to Peer Connection as Remote Description.   Create Answer.   Set connect
    to true to prevent infinite loop.   Add ICE Candidate.   Load webcam.


    You may remember from the beginning of the chapter that the correct way to start
    the webcam is by using `navigator.getUserMedia()`, unfortunately due to the different
    implementations in browsers at the time of writing we are using `Adapter.js` and
    that drops the vendor prefix in order to get RTC working cross browser. To make
    the video load quickly, without worrying about user interfaces and so on. we put
    `getUserMedia` into a function called `broadcast()` and call it without `window.onload`.
    Within the callback of `getUserMedia`, we need to add the stream to the Peer Connection,
    then use `URL.createObjectURL()`(which we used in [Chapter 2](#A978-1-4302-5945-9_2_Chapter.html))
    to add the stream to the video element and play the video. Once the server sends
    a message that the room count is more than 1, it is time to send an offer to the
    server.


    `var socket = io.connect(''` `http://localhost` `'');`


    `var pc = new RTCPeerConnection(servers, mediaConstraints);`


    `var initConnection = false;`


    `socket.on(''room_count'', function(data)  {`


    `room_count = data;`


    `console.log(''ROOM COUNT'', data);`


    `if (room_count > 1)`


    `initConnection = true;`


    `});`


    `function broadcast() {`


    `getUserMedia({audio: true, video: true}, function(s) {`


    `pc.addStream(s);`


    `console.log("GOT MEDIA");`


    `vid1.src = URL.createObjectURL(s);`


    `vid1.play();`


    `if (initConnection) start();`


    `}, function(error) {throw error;});`


    `};`


    `window.onload = function() {`


    `broadcast();`


    `};`


    Within `start()` we need to create the offer, this happens through Peer Connection’s
    `pc.createOffer()`. The method itself provides the SDP accessible as a parameter,
    we can then use it to set the local description and emit a `''received_offer''`
    message to the server containing the SDP.


    `function start() {`


    `console.log(''STARTING'');`


    `// this initializes the peer connection`


    `pc.createOffer(function(description) {`


    `console.log(description);`


    `pc.setLocalDescription(description);`


    `socket.emit(''received_offer'', JSON.stringify(description));`


    `}, null, mediaConstraints);`


    `};`


    You will notice two extra parameters, the second is a callback used for error
    handling (for simplicity I have left that out) and the third is a variable that
    I’ve called `mediaConstraints`. This variable contains both mandatory data that
    says whether video and/or audio is available as well as optional, in this case
    `DtlsSrtpKeyAgreemen`t, which is used to enable Datagram Transport Layer Security
    for browsers that do not enable it by default (such as older versions of Chrome).


    `var mediaConstraints = {`


    `''mandatory'': {`


    `''OfferToReceiveAudio'':true,`


    `''OfferToReceiveVideo'':true`


    `},`


    `''optional'': [{''DtlsSrtpKeyAgreement'': ''true''}]`


    `};`'
  trans: "\n### SDP\n\n如果我用“天书”来形容 ICE 协议的抽象内容，那么我的词汇量无法描述 SDP。乍一看（可能第二眼和第三眼也是），它看起来难以理解。但别担心，重要的部分相当容易理解，其余部分都有文档说明（主要在\
    \ `RFC4566` 中）。`SDP` 代表会话描述协议（Session Description Protocol），是在客户端之间发送的数据形式。以下是一个\
    \ SDP 示例，本例在 `localhost` 下运行本章代码，并在两个 Google Chrome 标签页之间建立连接。SDP 内容范围很广，很大程度上取决于通信阶段，因此如果你查看自己的\
    \ SDP 数据，不要期望它看起来完全相同。我只包含了前 11 行，因为大部分内容对我们调试来说通常没什么用，而且主要与加密有关。\n\n```\nv=0\n\
    o=- 6888311506875211333 2 IN IP4 127.0.0.1\ns=-\nt=0 0\na=group:BUNDLE audio video\n\
    a=msid-semantic: WMS YuWoij3TGBXIt0Ud2iqCWMbt7FnkBqSNpP96\nm=audio 1 RTP/SAVPF\
    \ 111 103 104 0 8 107 106 105 13 126\nc=IN IP4 0.0.0.0\na=rtcp:1 IN IP4 0.0.0.0\n\
    a=ice-ufrag:qbj6LYoXCSHnUUuq\na=ice-pwd:C/eziXfWhziBTVpMylTLU2M3\n```\n\n这看起来令人生畏，我知道。让我们从等号前面的字母开始。这被称为“类型”，它始终只是一个字符，并且区分大小写。类型的顺序是预定义的，主要是为了减少错误，并使得解析器更容易实现。当然，这也方便调试，因为我们始终知道要找的数据应该在哪里！我只解释前四行，因为它们是最可能出错的行，其余的都是可选的，因此不太可能出问题（如果出了问题，更可能是浏览器中的\
    \ bug，而不是你的代码）。请注意，属性采用`<type>=<attribute>:<value>`的形式。如果你有兴趣了解大多数属性，可以很容易地在网上搜索到，我可能会在我的网站上写一篇文章来配合本章内容。\n\
    \n```\n会话描述\nv=  (协议版本)\no=  (发起者和会话标识符)\ns=  (会话名称)\ni=* (会话信息)\nu=* (描述的统一资源标识符)\n\
    e=* (电子邮件地址)\np=* (电话号码)\nc=* (连接信息 —— 如果包含在所有媒体中则不需要)\nb=* (零行或多行带宽信息)\n一个或多个时间描述\
    \ (\"t=\" 和 \"r=\" 行；见下文)\nz=* (时区调整)\nk=* (加密密钥)\na=* (零行或多行会话属性行)\n零个或多个媒体描述\n\
    \n时间描述\nt=  (会话激活时间)\nr=* (零个或多个重复时间)\n\n媒体描述（如果存在）\nm=  (媒体名称和传输地址)\ni=* (媒体标题)\n\
    c=* (连接信息 —— 如果在会话级别包含则为可选项)\nb=* (零行或多行带宽信息)\nk=* (加密密钥)\na=* (零行或多行媒体属性行)\n\n\
    * 表示可选项\n```\n\n本类型指南摘自 `RFC 4566`，因此感谢互联网协会（The Internet Society）。你可以很容易地看到 `SDP`\
    \ 对象如何分为三个部分。在撰写本文时，所有 SDP 对象都以 `v=0` 开头，因为没有其他可用版本。在我的示例中，第二行（发起者和会话标识符）是 `o=-\
    \ 6888311506875211333 2 IN IP4 127.0.0.1`。连字符表示没有用户名，因为我没有使用私有的 `TURN` 服务器。长数字是会话的唯一标识符。接下来，我们找到这一行的关键部分，至少对于调试来说，那就是会话版本；这是会话数据更改的次数（每次我们发送包含数据的新消息时，此数字都会增加）。你可以使用会话版本绝对确定会话描述已更新。`IN`\
    \ 代表互联网（Internet），它在那里是为了使协议具有前瞻性。然后我们有 IP 类型，在这种情况下是 IP 版本 4。第二行最后是 IP 地址。我在本地运行，因此它报告\
    \ IP 地址为 `127.0.0.1`（`localhost`）。\n\n你可能注意到我的示例直接跳到了时间部分，这是一个实现决策（在本例中由 Chrome\
    \ 决定），因为中间的行都是可选的。第一个 `0` 表示开始时间，后面的 `0` 表示停止时间。由于两者都是 `0`，这意味着会话是永久性的。\n\n##\
    \ 客户端代码\n\n好吧，这是从代码中解脱出来的一个不错休息，但我认为我们都准备好重新投入，并对 `WebRTC` 实际工作原理以及我们发送的数据到底是什么有了更坚实的理解。还记得信令如何工作的概述吗？这里再次以列表形式呈现，以便更容易实现：\n\
    \n1. 启动摄像头。\n2. 将流添加到 `Peer Connection`。\n3. 发送带有本地描述（Local Description）的 `received_offer`\
    \ 消息。\n4. 将本地描述添加到 `Peer Connection`。\n5. 将接收到的描述作为远程描述（Remote Description）添加到\
    \ `Peer Connection`。\n6. 创建应答（Answer）。\n7. 设置 `connect` 为 `true` 以防止无限循环。\n8.\
    \ 添加 `ICE Candidate`。\n9. 加载摄像头。\n\n你可能还记得本章开头，启动摄像头的正确方法是使用 `navigator.getUserMedia()`。不幸的是，由于在撰写本文时浏览器中的不同实现，我们使用了\
    \ `Adapter.js`，它去掉了供应商前缀，以便跨浏览器使用 `RTC`。为了快速加载视频，无需担心用户界面等，我们将 `getUserMedia`\
    \ 放入一个名为 `broadcast()` 的函数中，并在 `window.onload` 中调用它。在 `getUserMedia` 的回调中，我们需要将流添加到\
    \ `Peer Connection`，然后使用 `URL.createObjectURL()`（我们在第 2 章中使用过）将流添加到 `video` 元素并播放视频。一旦服务器发送消息表明房间人数超过\
    \ 1，就该向服务器发送 offer 了。\n\n```javascript\nvar socket = io.connect('http://localhost');\n\
    var pc = new RTCPeerConnection(servers, mediaConstraints);\nvar initConnection\
    \ = false;\n\nsocket.on('room_count', function(data) {\n  room_count = data;\n\
    \  console.log('ROOM COUNT', data);\n  if (room_count > 1)\n    initConnection\
    \ = true;\n});\n\nfunction broadcast() {\n  getUserMedia({audio: true, video:\
    \ true}, function(s) {\n    pc.addStream(s);\n    console.log(\"GOT MEDIA\");\n\
    \    vid1.src = URL.createObjectURL(s);\n    vid1.play();\n    if (initConnection)\
    \ start();\n  }, function(error) {throw error;});\n};\n\nwindow.onload = function()\
    \ {\n  broadcast();\n};\n```\n\n在 `start()` 中，我们需要创建 offer，这通过 `Peer Connection`\
    \ 的 `pc.createOffer()` 发生。该方法本身提供了 `SDP` 作为参数，我们可以使用它来设置本地描述（Local Description），并向服务器发送一条包含\
    \ `SDP` 的 `'received_offer'` 消息。\n\n```javascript\nfunction start() {\n  console.log('STARTING');\n\
    \  // 这将初始化 peer connection\n  pc.createOffer(function(description) {\n    console.log(description);\n\
    \    pc.setLocalDescription(description);\n    socket.emit('received_offer', JSON.stringify(description));\n\
    \  }, null, mediaConstraints);\n};\n```\n\n你会注意到两个额外的参数，第二个是用于错误处理的回调（为了简单起见，我省略了它），第三个是我称为\
    \ `mediaConstraints` 的变量。这个变量包含强制数据，用于说明视频和/或音频是否可用，以及可选数据，在本例中是 `DtlsSrtpKeyAgreement`，它用于为默认不启用它的浏览器（例如旧版\
    \ Chrome）启用数据报传输层安全性（Datagram Transport Layer Security）。\n\n```javascript\nvar\
    \ mediaConstraints = {\n  'mandatory': {\n    'OfferToReceiveAudio':true,\n  \
    \  'OfferToReceiveVideo':true\n  },\n  'optional': [{'DtlsSrtpKeyAgreement': 'true'}]\n\
    };\n```\n"
- fmt: "# Steps for Creating a Peer Connection\n\nThis brings us to step 4, adding\
    \ the remote description to the Peer Connection. We get this description from\
    \ the `\"received_offer\"` message, the one that we previously sent (remember\
    \ that both client 1 and 2 send the message to each other). This starts by parsing\
    \ the stringifyed JSON of the SDP and store in a variable called `data`. We then\
    \ check that the data is definitely an offer by accessing the `type` property,\
    \ just as a way to prevent possible edge cases. Then we set the peer connection’s\
    \ remote description to be an `RTCSessionDescription` of the data. With that done,\
    \ we use peer connection’s `createAnswer()` in much the same way as we used `createOffer()`.\
    \ First set the local description to be the same as the data that is provided,\
    \ then emit a `\"received_answer\"` message to the server.\n\n```\nsocket.on('received_offer',\
    \ function(data) {\n    data = JSON.parse(data);\n    console.log('received offer');\n\
    \    if (data.type == \"offer\") {\n        pc.setRemoteDescription(new RTCSessionDescription(data));\n\
    \        pc.createAnswer(function(data) {\n            console.log('sending answer',\
    \ data);\n            pc.setLocalDescription(data);\n            socket.emit('received_answer',\
    \ data);\n        }, null, mediaConstraints);\n    }\n});\n```\n\nOf course, we\
    \ now check for `\"received_answer\"` (this all gets much less complicated as\
    \ you break it down into pieces, don’t you think?). We now need a variable called\
    \ `connected` so that it only attempts to connect once, if the variable is set\
    \ to false and the data is definitely an answer, then we once again create a remote\
    \ description using the SDP that is then added to the peer connection. Then we\
    \ simply set `connected` to true so that it doesn’t keep reconnecting (again,\
    \ an edge case that shouldn’t often happen).\n\n```\nsocket.on('received_answer',\
    \ function(data) {\n    console.log('received answer', data);\n    if(!connected\
    \ && data.type == \"answer\") {\n        var description = new RTCSessionDescription(data);\n\
    \        console.log(\"Setting remote description\", description);\n        pc.setRemoteDescription(description);\n\
    \        connected = true;\n    }\n});\n```\n\nThe peer connection now knows that\
    \ it had an ICE candidate as the peer connection ‘gathers candidates’ once the\
    \ local descriptions have been set. When it has an ICE candidate, we then send\
    \ its own candidate back (including an id and label) as a `\"received_candidate\"\
    ` message. So we now need to listen for `\"received_candidate\"` and add that\
    \ candidate to the peer connection. This process is mostly just for confirmation\
    \ of each candidate, it is more of a problem when there are more than two clients.\
    \ Listing 8-2 shows the current state of the `client.js` file.\n\n**Listing 8-2.**\
    \ `Client.js`\n\n```\nsocket.on('received_candidate', function(data) {\n    console.log('received\
    \ candidate', data);\n    data = JSON.parse(data);\n    var candidate = new RTCIceCandidate({\n\
    \        sdpMLineIndex: data.label,\n        candidate: data.candidate\n    });\n\
    \    pc.addIceCandidate(candidate);\n});\n\npc.onicecandidate = function(e) {\n\
    \    console.log(\"oniceCandidate\", e);\n    if(e.candidate) {\n        socket.emit('received_candidate',\
    \ JSON.stringify({\n            label: e.candidate.sdpMLineIndex,\n          \
    \  id: e.candidate.sdpMid,\n            candidate: e.candidate.candidate\n   \
    \     }));\n    }\n};\n```\n\nNow that both peer connections have all the candidates\
    \ needed, we are practically finished. Once everything is ready, the `addstream`\
    \ event will be triggered, letting us put the remote video stream into a video\
    \ element (in this case, `vid2`).\n\n```\npc.onaddstream = function(e) {\n   \
    \ console.log('start remote video stream');\n    console.log(e);\n    vid2.src\
    \ = URL.createObjectURL(e.stream);\n    vid2.play();\n};\n```\n\nIt is worth noting\
    \ that the user who has not closed the connection will see the remote video as\
    \ frozen on the last frame that was delivered, you could instead make it say that\
    \ the connection has dropped by having an event handler on the `'close'` message.\
    \ The final version of the code can be found in the download available on the\
    \ Apress website at [`www.apress.com/9781430259442`](http://www.apress.com/9781430259442)\
    \ or on my own website at shanehudson.net/javascript-creativity.\n\n## Summary\n\
    \nI hope you enjoyed this chapter, `WebRTC` is one of those technologies that\
    \ are quite confusing at first and is very complex at a browser implementation\
    \ level (such as the SDP), but once you get your head around it, it is actually\
    \ fairly simple. It is also incredibly powerful. We did the most obvious use-case\
    \ here, because it is the most useful as an introduction, but `WebRTC` is (especially\
    \ if you want to drop the signaling and have a different method of finding other\
    \ clients) useful as a general usage peer to peer technology; for example, you\
    \ could have a game or a prototype app in which you want to have users connected\
    \ without the overheads of a server. The access to the user’s webcam is also extremely\
    \ powerful, as you will see in the next chapter where we start to explore the\
    \ realm of Computer Vision.\n\n# Motion Detection\n\n## An Introduction to Motion\
    \ Detection\n\nThroughout the book so far we have looked at a number of technologies\
    \ that have obvious applications that you can implement without too much creativity,\
    \ things that may not have been possible before but that are not too hard to do\
    \ now, such as the video-to-video chat in the previous chapter. I would now like\
    \ to delve into the realms of computer vision, one of my personal interests and\
    \ one that has a large variety of ways to apply it. Because this book is neither\
    \ about advanced computer vision nor targeted at academia/research labs, we will\
    \ stick to relatively naïve algorithms and avoid any artificial intelligence that\
    \ requires training, such as facial recognition.\n\nIn this chapter we focus on\
    \ motion detection, because it ties in well with the `WebRTC` and is probably\
    \ the most useful aspect of basic computer vision. In the next chapter we will\
    \ be creating a musical instrument that can be played using motion detection and\
    \ with other people over `WebRTC`, which should nicely tie the entire book together.\
    \ For now though, think about the other kinds of applications you could use motion\
    \ detection for, such as home security or even just visual effects."
