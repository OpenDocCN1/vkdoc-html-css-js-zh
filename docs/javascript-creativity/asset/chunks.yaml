    \ {\n    keys[data.i].fill({ color: data.color });\n  }\n  playSound(data.i, data.black);\n\
    });\n\nsocket.on('stop_sound', function(data) {\n  if (data.black) {\n    bkeys[data.i].fill({\
    \ color: '#000' });\n  } else {\n    keys[data.i].fill({ color: '#fff' });\n \
    \ }\n  stopSound(data.i, data.black);\n});\n```\n\nTo send the messages, we just\
