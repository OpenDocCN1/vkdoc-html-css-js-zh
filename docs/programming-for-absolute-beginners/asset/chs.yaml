  \ 函数。因为控制台会逐行处理你输入的内容，所以你需要将整个函数写在一行内。\n4.  现在，在 JavaScript 控制台中使用 `square_a_number`\
  \ 函数计算 3 和 6 的平方。\n\n## 12.2 查找和修改网页元素\n\n现在，我们对 JavaScript 控制台的工作原理有了一定了解，是时候与我们的网页进行交互了。JavaScript\
  \ 提供了一个存储在全局变量 `document` 中的特殊对象，它是与网页交互的桥梁。在 JavaScript 中，网页上的每个标签都由其自身的对象表示，并拥有自己的属性和方法。用于\
  \ HTML 页面的标准对象类型列表（包含其属性和方法）被称为**文档对象模型**，通常简称为 **DOM**。本章将介绍这些对象的一些常用方法。\n\n我们要做的第一件事是查找一个\
  \ HTML 元素。请记住，*元素* 是开始/结束标签及其之间所有内容的组合。请注意，在文件中，我们为几个标签添加了 `id` 属性。这使得在 JavaScript\
  \ 中查找它们变得容易。`document` 对象有一个通过 `id` 属性查找 HTML 元素的方法，名为 `getElementById`。它接受一个参数，即要查找的\
  \ HTML `id` 值，并返回一个表示该 HTML 元素的 JavaScript 对象。如果未找到该元素，则返回特殊的 JavaScript 值 `null`，该值被视为“空”值。在你的控制台中，输入以下内容：\n\
  \n```\ndocument.getElementById(\"first_paragraph\");\n```\n\n这将返回一个对象，该对象代表第一个段落的\
  \ HTML 元素。一旦我们有了这个对象，就可以对其进行修改，这些修改将反映在网页本身中。每个浏览器在控制台中展示这个值的方式可能不同，但底层结果是相同的——它是一个代表我们在屏幕上看到的\
  \ HTML 元素的 JavaScript 对象。无论如何，我们不仅想显示这个值，还想操作它。一个好的第一步是将该对象存储在一个变量中。因此，请执行以下操作：\n\
  \n```\nvar x = document.getElementById(\"first_paragraph\");\n```\n\n\n\n现在代表 HTML\
  \ 元素的对象被存储在我们的变量`x`中。我们可以用它做什么？一个简单的事情就是更改文本。仅包含文本（即没有子元素）的 HTML 元素可以通过其`textContent`属性访问或更改该文本。输入以下代码：\n\
  \n```\nx.textContent\n```\n\n它应该返回`\"This is my first paragraph\"`这个值，不过可能带有多余的空格。现在既然我们可以访问`textContent`属性，我们也可以更改它。输入以下代码为段落设置新文本：\n\
  \n```\nx.textContent = \"This is a changed paragraph.\";\n```\n\n你应该会看到网页立即随着新段落文本而改变。如你所见，如果我们为\
  \ HTML 元素添加`id`属性，就可以轻松地找到它们并在 JavaScript 程序中进行操作。\n\n一只手形图标，其食指指向右侧方向。\n\n### 练习题\n\
  \n请使用 JavaScript 控制台完成以下任务：\n\n1.  查找并修改`<h1>`元素的文本。\n2.  查找并修改`<h2>`元素的文本。\n3.\
  \  使用`prompt`函数请求用户输入一个字符串，并将其存储在一个变量中。然后将该段落文本设置为此值。\n\n## 12.3 创建新的 HTML 元素\n\n\
  现在我们已经学会了查找和修改 HTML 元素，是时候学习如何创建一个新元素了。`document`对象有一个名为`createElement`的方法正是用来做这件事的。\n\
  \n在控制台中输入以下代码：\n\n```\nvar new_element = document.createElement(\"p\");\nnew_element.textContent\
  \ = \"This is a new paragraph\";\n```\n\n这会创建一个新元素，但尚未将其添加到页面中。它仅仅存在于内存中，只存在于变量里。我们还没有告诉文档要把它放在哪里。现在，我们想将新元素作为`<body>`元素中的最后一个内容。因此，首先我们需要查找`<body>`元素：\n\
  \n```\nvar body_element = document.getElementById(\"mainbody\");\n```\n\n现在我们需要告诉`<body>`元素将我们的新元素追加到其子元素的末尾。这可以通过我们的`<body>`元素的`appendChild`方法来完成。输入以下代码：\n\
  \n```\nbody_element.appendChild(new_element);\n```\n\n只要输入这行代码，新的段落就会立刻出现！\n\n一只手形图标，其食指指向右侧方向。\n\
  \n### 练习活动\n\n为了练习向网页添加 HTML 内容，我们将创建一个`<ul>`标签，然后通过 JavaScript 控制台向其中添加额外的`<li>`标签。如果您对这里的任何步骤感到困惑，请回顾前面的部分来了解如何执行每一步。\n\
  \n1.  首先，修改本节使用的 HTML 文件，在其中添加一个包含至少一个`<li>`标签的`<ul>`标签。\n2.  为`<ul>`标签添加一个`id`属性，以便在下一步中使用\
  \ JavaScript 找到它。\n3.  打开 JavaScript 控制台。使用`document`对象的`getElementById`方法找到`<ul>`元素并将其存储在变量中。\n\
  4.  现在使用`document`对象的`createElement`方法创建一个新的`<li>`标签来放入其中。\n5.  使用新标签的`textContent`属性将其设置为您想要的任何文本。\n\
  6.  现在对您的`<ul>`元素使用`appendChild`方法，将新的`<li>`标签添加到列表末尾。\n7.  练习向列表中添加另一个`<li>`标签。\n\
  8.  尝试使用 JavaScript 创建一个全新的`<ul>`标签，并将其添加到页面底部。然后向您用 JavaScript 创建的`<ul>`标签中添加额外的`<li>`标签。\n\
  \n## 12.4 与输入字段通信\n\n到目前为止，与用户的所有交互都是通过`alert`和`prompt`函数进行的。但是，您可能已经注意到，在网页上，大多数交互都直接发生在网页本身内部。这几乎完全像我们在前几节中进行的网页操作一样。区别在于我们将要使用`<input\
  \ />`标签。`<input />`元素对象的运作方式与我们见过的其他元素对象类似，但它有一个特殊的属性叫做`value`，代表字段中的文本。\n\n为了了解这些输入字段的工作方式，请将图\
  \ 12-2 中的 HTML 代码输入到一个文件中，并在浏览器中加载它。\n\n有一点需要注意——*务必*在按钮上包含`type=\"button\"`属性。否则，单击按钮可能会导致页面重新加载，从而丢失您创建的所有变量。\n\
  \n![]（images/531249_1_En_12_Chapter/531249_1_En_12_Fig2_HTML.png）\n\n一个 Doctype\
  \ HTML 文件的屏幕截图，包含输入字段示例，其中用 Java 脚本编写了输入字段 1 和 2。\n\n**图 12-2** 包含输入字段的 HTML 文件\n\
  \n现在，打开 JavaScript 控制台。我们首先要做的是查找两个`<input />`元素并将它们存储在变量中。为此，输入以下代码：\n\n```\nvar\
  \ fld1 = document.getElementById(\"field1\");\nvar fld2 = document.getElementById(\"\
  field2\");\n```\n\n现在单独输入`fld1`以确保它返回一个 HTML 元素作为值。如果没有返回，则说明您输入有误。对`fld2`执行相同操作以进行检查。\n\
  \n现在输入以下代码：\n\n```\nfld1.value = \"Hello\";\n```\n\n输入后，第一个字段中应该会出现文本“Hello”。进入第二个字段，在网页中输入文本“Goodbye”。现在在\
  \ JavaScript 控制台中输入以下代码：\n\n```\nfld2.value\n```\n\n它现在应该会把您输入的值（如果按指示操作，应为`\"Goodbye\"\
  `）打印到控制台上。现在我们知道如何设置和读取`<input />`元素的值了！\n\n现在查找`<span>`标签。请记住，`<span>`标签用于指定文本区域。在我们的例子中，我们指定了要写入结果的位置。无论如何，请执行以下操作来查找`<span>`标签，以便我们准备好写入该位置的页面：\n\
  \n```\nvar results_span = document.getElementById(\"results\");\n```\n\n现在单独输入`results_span`，以便检查您是否正确获取了`<span>`元素。我们要做的是从每个输入字段读取一个数字，将它们相乘，然后将结果写入`<span>`元素中。\n\
  \n首先在每个输入字段中输入两个数字。在这个例子中，假设您在第一个字段中输入了“5”，在第二个字段中输入了“7”。请记住，由于这是从键盘输入的，因此它被视为字符串，而不是数字。因此，`fld1.value`将是字符串`\"\
  5\"`而不是数字`5`，而`fld2.value`将是字符串`\"7\"`而不是数字`7`。因此，我们需要使用`parseInt`函数将这些字符串转换为数字。\n\
  \n在 JavaScript 控制台中输入以下代码以读取字段的值并将其存储在变量中：\n\n```\nvar val1 = parseInt(fld1.value);\n\
  var val2 = parseInt(fld2.value);\n```\n\n现在，`val1`和`val2`应该包含您输入的数字。您可以通过在控制台中单独输入变量名来验证，确保它返回正确的值。\n\
  \n现在，我们需要将两个数字相乘。输入以下代码来完成此操作：\n\n```\nvar result = val1 * val2;\n```\n\n`result`现在包含了结果。\n\
  \n现在，我们只需要将`result`中的值写回到页面上。我们将使用`results_span`的`textContent`属性来完成此操作。JavaScript\
  \ 在显示数字之前会自动将其转换为字符串。以下代码实现了这一点：\n\n```\nresults_span.textContent = result;\n```\n\
  \n\n\n## 12.5 为按钮添加功能\n\n到目前为止，我们已经能够在文档中对输入字段手动执行一些 JavaScript 处理。但这并不是网页通常的工作方式。通常，用户通过点击按钮来告诉计算机完成某个功能。因此，我们必须将所需的功能附加到按钮上。\n\
  \n![](img/531249_1_En_12_Fig3_HTML.png)\n\n一个用 JavaScript 编写的 HTML 文件截图，其中包含一个将变量\
  \ 1 和 2 相乘的函数。\n\n**图 12-3** 用于相乘两个文本字段的函数\n\n那么，首先，我们将创建一个函数，用于执行我们在上一节中完成的任务。为了便于阅读，我会将其写成多行。然而，由于\
  \ JavaScript 控制台每次只解释一行，你*必须*将整个函数写在同一行。别担心，JavaScript 语言无论写成一行还是多行，其工作方式完全相同——正因如此，它使用分号来分隔语句。所以，只要你正确输入所有内容，即使写在一行也能正常运行。图\
  \ 12-3 展示了这个函数。请注意，它使用了 `document` 对象。这之所以可行，是因为 `document` 是一个全局变量。同时也要注意，该函数不接受任何参数。它仅通过使用\
  \ `document` 这个全局变量来工作。\n\n一旦你在控制台中输入了该函数（全部写在一行），调用此函数就应该能执行所有任务。为了测试一下，在输入字段中输入两个不同的数字，然后在\
  \ JavaScript 控制台中输入以下内容：\n\n```\nmultiply_fields();\n```\n\n这应该会将两个数字相乘，并将结果写入 `results\
  \ <span>` 标签中。如果未能生效，请重新检查你的函数。现在，我们希望用户在点击我们的按钮时，能够运行这个函数。这实际上非常容易实现。`<button>`\
  \ 标签有一个名为 `onclick` 的属性。如果你将 `onclick` 设置为一个函数，那么当按钮被点击时，它就会调用该函数！目前，你应该只使用不接受参数的函数。\n\
  \n那么，要实现这一点，我们需要在页面上找到 `<button>`，然后设置它的 `onclick` 属性。代码如下：\n\n```\nvar btn = document.getElementById(\"\
  my_button\");\nbtn.onclick = multiply_fields;\n```\n\n请注意，这里我们并不是在*调用*函数 `multiply_fields`。我们是在将函数本身*存储*到\
  \ `onclick` 属性中，以备日后使用。记住，JavaScript 函数本身就是值，并且像其他任何值一样存储在变量和属性中。因此，我们是将函数存储在 `btn`\
  \ 对象中，而 `btn` 对象会在适当的时候调用该函数。试试看，输入两个值，然后点击按钮。如果一切设置正确，它应该会在正确的位置显示结果。\n\n## 12.6\
  \ 整合所有内容\n\n现在，我们真正想要的是让所有这些功能随网页一起加载。为此，我们需要将所有代码放入一个 JavaScript 文件中。在与 HTML 文件相同的目录下创建一个名为\
  \ `multiply.js` 的文本文件。将图 12-4 中的代码输入到 `multiply.js` 中。\n\n现在我们需要将其附加到 HTML 文件中。为此，请在\
  \ HTML 文件的 `<head>` 元素中添加以下标签：\n\n```\n<script src=\"multiply.js\" defer=\"defer\"\
  ></script>\n```\n\n注意我们添加的新属性——`defer=\"defer\"`。这个属性改变了 JavaScript *何时*被加载和运行。通常情况下，JavaScript\
  \ 会在这个标签所在的位置被精确加载和运行。在我们的案例中，这意味着只有 `<head>` 元素存在，因为该标签出现在页面其余部分之前。这无法正常工作，因为 `document.getElementById(\"\
  my_button\")` 会返回 `null`（即无值），因为按钮此时尚未成为页面的一部分。属性 `defer=\"defer\"` 告诉浏览器等到整个页面加载完毕后再运行\
  \ JavaScript 代码。\n\n![](img/531249_1_En_12_Fig4_HTML.png)\n\n一个用于在 JavaScript 中相乘变量\
  \ 1 和 2 字段的完整 HTML 代码截图。\n\n**图 12-4** 用于相乘两个字段的完整代码\n\n现在，在将你的 `<script>` 标签添加到\
  \ HTML 文件并保存所有内容之后，重新加载页面。在你输入两个数字并点击按钮后，它应该会给出答案。\n\n### 练习活动\n\n既然你已经知道如何为网页添加功能，本活动将让你在同一个页面上添加第二个函数。\n\
  \n1.  从本节完成的文件开始。\n2.  接下来，在你的 JavaScript 文件中创建一个新函数，该函数将把两个数字相加，而不是相乘。将这个函数命名为\
  \ `add_fields`。*不要*删除原有的 `multiply_fields` 代码。只需添加一个新函数。\n3.  现在向页面添加第二个按钮。确保给它一个不同的\
  \ `id` 属性，这样你才能找到它。不要删除现有的按钮。\n4.  现在在你的 JavaScript 文件中添加代码，使其能够找到新按钮，并将你的 `add_fields`\
  \ 函数附加到该按钮上。\n5.  测试你的新页面。确保两个按钮都能执行各自相应的操作。\n\n## 12.7 向控制台记录日志\n\n如果你的程序存在实际错误，这些错误通常会在\
  \ JavaScript 控制台中报告。因此，在进行开发时，我几乎总是保持控制台打开，以便可以查看自己哪里搞砸了。不过，你也可以自己向控制台写入值。当你拥有复杂的代码或计算，并希望跟踪计算过程中各个阶段的状态时，这通常会很有帮助。JavaScript\
  \ 很贴心地提供了一个名为 `console` 的全局变量，允许你向控制台写入内容。`console` 对象有一个 `log` 方法，允许你将任何你想要的内容写入控制台。\n\
  \n修改你之前的程序，在 `multiply_fields` 函数的某处添加以下这行代码：\n\n```\nconsole.log(\"I am here\"\
  );\n```\n\n现在，当你点击按钮时，它应该会在控制台中写入 “`I am here`”。\n\n大多数浏览器都有额外的工具用于调试你的 JavaScript\
  \ 程序。如何使用这些工具的详细内容超出了本书的范围，但我至少会提一下最常见也最强大的一个工具——断点。断点会告诉 JavaScript 解释器在某一代码行处停止。然后，你作为程序员，就可以查看此时所有变量的值，并让\
  \ JavaScript 逐行执行你的代码，以观察每一行如何影响正在发生的事情。\n\n控制台日志记录和断点经常被用作彼此的替代，但它们各自有更适合某些问题的场景。控制台日志对于实时监控正在运行的程序非常有用。通过让控制台日志报告重要的状态信息，你可以观察程序在执行计算时的流程。断点则适用于代码中有一个特定位置出现问题，并且你需要查看过程中每一步如何影响结果的情况。为什么这个变量被设置成了那个值？是哪个条件导致它走错了分支？哪个值意外地变成了\
  \ null 或 undefined？通过设置合适的断点并逐步执行你的程序，这些问题可以很快得到解答。\n\n\n\n# 食指指向右侧的手形图标  \n###\
  \ 编程接口的宏观视角\n\n本章向你介绍了文档对象模型（DOM）。你可能会好奇，如何知道有哪些对象、属性和函数可供使用。当你把一个函数赋值给 `onclick`\
  \ 属性，点击按钮时它就能神奇地调用该函数，这看似神秘甚至随意。实际上，当程序员创建 JavaScript 和 DOM 这类系统时，他们必须决定如何表示和交互各种事物——例如对象和属性的命名方式及使用方法。这些对象、函数和属性的名称本质上是随意的——完全取决于程序员如何命名。幸运的是，这些命名通常具有逻辑性，能帮助你学习如何使用它们；但有时，由于疏忽或历史原因，也会出现一些不合逻辑的古怪命名。这在编程中相当常见。\n\
  \n系统所支持的标准对象、属性和函数的列表被称为**应用程序编程接口**，更常见的叫法是**API**。那么，你如何知道 API 中提供了哪些对象、属性和函数呢？通常，程序员会将其记录下来，并通过**文档**进行共享。大多数编程系统都有一份参考手册，列出了所有可用的函数。不过，这些手册通常相当冗长，因为系统开发者会尽力预想你可能需要的所有功能，并为每一项提供对应的函数。但通常来说，大多数\
  \ API 都围绕少数几个核心概念展开，一旦你掌握了这些概念，其余细节随时可以查阅。\n\n#### 12.7.1 回顾\n\n在本章中，我们练习了如何使用 JavaScript\
  \ 与网页进行交互。我们学习了以下内容：\n\n- JavaScript 内置了一些对象，使我们能够与系统其余部分及网络进行交互。\n- `document`\
  \ 对象是允许我们与当前网页交互的入口。\n- DOM 是在与 HTML 页面及其元素交互时可使用的对象和属性列表。\n- HTML 标签的 `id` 属性可用于从\
  \ JavaScript 中查找元素并进行操作。\n- `document` 对象的 `getElementById` 方法允许我们利用 `id` 属性获取代表页面中\
  \ HTML 元素的对象，并将其存储在变量中进行检查和操作。\n- HTML 元素对象的 `textContent` 属性允许我们获取和设置 HTML 元素的文本内容。\n\
  - 可以使用 `document` 的 `createElement` 方法创建元素。\n- 新创建的元素可以使用元素的 `appendChild` 方法添加到页面中。该方法会将元素作为给定元素对象的最后一个子元素添加。\n\
  - `<input />` 标签可用于允许用户输入数据以供处理。\n- `<input />` 标签对象的 `value` 属性可用于读取或设置文本字段的值。\n\
  - `<button>` 标签可用于启动处理过程。请务必设置 `type=\"button\"` 属性，以确保其正常运行。\n- 将 `<button>` 元素对象的\
  \ `onclick` 值设置为一个函数，将在点击该按钮时运行该函数。\n- 在 `<script>` 标签上设置 `defer=\"defer\"` 属性将使其在文档完全加载后再执行\
  \ JavaScript。从现在开始，所有 `<script>` 标签都应添加此属性。\n- `console` 对象是一个内置的 JavaScript 对象，它有一个\
  \ `log` 方法，可以将任何值写入控制台。\n- API 是系统中可供程序员使用的标准对象、属性和函数的列表。\n- API 文档描述了哪些对象、属性和函数可用，以及它们如何工作的详细信息。\n\
