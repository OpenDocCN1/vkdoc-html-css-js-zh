  # 第四部分 中级 JavaScript\n\n## 中级 JavaScript\n\n本部分将更深入地探讨 JavaScript 语言的运行机制。这要求你更深入地思考\
  \ JavaScript 如何解释你所编写的内容，以及当你编写代码时计算机内部实际发生的事情。\n\n# 13. 递归函数与调用栈\n\n在第 10 章中，你了解到函数可用于将代码片段打包成可重复使用的、定义良好的单元。在本章中，我们将更详细地探讨\
  \ JavaScript 是如何追踪这些函数的。\n\n\n\n### 13.1 程序栈\n\n此前，我们讨论了局部变量（函数内定义的变量）和全局变量（函数外定义的变量）。我们提到局部变量仅限于定义它的函数内部使用。也就是说，如果有一个名为\
  \ `x` 的全局变量，而某个函数内部也定义了一个名为 `x` 的局部变量，那么这两个 `x` 代表的是**不同**的变量。因此，函数可以修改其内部的局部 `x`\
  \ 而不会影响全局 `x`。这样做的好处之一，就是我们在开发函数时无需担心项目中其他开发人员使用了什么变量名。\n\n设想一下，如果你正与一位伙伴共同开发一个程序。如果你们必须就每一个变量名达成一致（以防止一方的操作意外覆盖另一方的变量），这将变得十分繁琐，从而使开发进程非常缓慢。而有了局部变量，只要变量是在函数内部定义的，其具体名称就无关紧要。全局变量仍然需要统一命名，但尤其是在大型项目中，全局变量的数量应该要少得多。\n\
  \n那么，JavaScript 是如何追踪局部变量的呢？事实证明，几乎所有编程语言都以大致相同的方式来追踪局部变量——通过一种称为**程序栈**（或简称栈）的机制。栈是编程语言用来追踪程序当前执行状态的方式。说白了，它就是一个信息栈，编程语言用它来记录程序中正在发生的事情。\n\
  \n例如，当一个程序调用一个函数时，它必须记住函数执行完毕后应该返回哪里。因此，它会将返回位置压入栈中，以便在函数结束后知道该回到何处。如果这个函数又调用了另一个函数，那么它会将另一个返回位置压入栈顶。当第二个函数执行完毕，它会查看栈顶，了解应该返回的位置，弹出（移除）该值，然后从指定位置继续执行。当最初的函数执行完毕时，其返回位置再次回到栈顶，因此它就知道应该返回哪里了。\n\
  \n图 13-1 展示了一些相互调用的函数。其中包含了注释，标明了程序即将执行的不同位置（标记为“位置 1”、“位置 2”等），以便我们讨论程序在这些函数间的执行流程。如果跳过函数中变量的声明部分，实际代码是从位置\
  \ 8 开始执行的。就我们目前讨论的内容而言，可以认为程序开始时栈是空的。\n\n程序做的第一件事就是调用函数 `function_one`。当 `function_one`\
  \ 结束时，程序应该在哪里继续执行？它应该在位置 9 继续执行。此时的栈如图 13-2 所示。\n\n现在，来看 `function_one`。代码从位置 1\
  \ 开始执行，接着立即调用了函数 `function_two`。想想在 `function_two` 执行完毕后，代码应该从哪里继续？它应该从位置 2 继续执行。因此，将该位置压入栈顶。此时栈如图\
  \ 13-3 所示。\n\n那么，`function_two` 做了什么？它调用了另一个函数 `function_three`。由于 `function_three`\
  \ 执行完毕后，它应该继续执行的下一个位置是位置 5，因此将这个位置压入栈中。此时栈如图 13-4 所示。\n\n现在，`function_three` 也发起了自己的函数调用，不过这次是调用一个内建函数。对内建函数的调用与其他函数调用的工作方式完全相同。那么，`alert`\
  \ 执行完毕后，`function_three` 应该从哪里继续执行？它应该回到位置 7，此时栈将如图 13-5 所示。\n\n现在情况变得有趣了。当 `alert`\
  \ 执行完毕后会发生什么？它如何知道该去哪里？它只需查看栈顶！栈顶写着：“执行完毕后，返回代码中的位置 7。” 然后 JavaScript 移除栈顶元素，并从位置\
  \ 7 继续执行。此时栈恢又复到图 13-4 所示的状态。但是，在位置 7 剩下的唯一一件事就是从函数返回。因此，它再次执行同样的过程——查看栈顶以确定应该返回的位置。这次它返回位置\
  \ 5，栈恢复到图 13-3 所示的状态。同理，在位置 5 唯一要做的就是返回，栈指示返回位置 2。于是我们返回到位置 2，并将其从栈顶移除。栈再次恢复到图 13-2\
  \ 所示的状态。\n\n![](img/531249_1_En_13_Fig5_HTML.png)\n\n一幅包含 5 行文本的示意图。1，位置 7 的返回地址。2，位置\
  \ 5 的返回地址。3，位置 3 的返回地址。4，位置 9 的返回地址。5，栈底。\n\n**图 13-5** 内建函数调用后的栈\n\n![](img/531249_1_En_13_Fig4_HTML.png)\n\
  \n一幅包含 4 行文本的示意图。1，位置 5 的返回地址。2，位置 2 的返回地址。3，位置 9 的返回地址。4，栈底。\n\n**图 13-4** 第三次函数调用后的栈\n\
  \n![](img/531249_1_En_13_Fig3_HTML.png)\n\n一幅包含三行文本的示意图。1，位置 2 的返回地址。2，位置 9 的返回地址。3，栈底。\n\
  \n**图 13-3** 第二次函数调用后的栈\n\n![](img/531249_1_En_13_Fig2_HTML.png)\n\n第一次函数调用后的栈有两行。第\
  \ 1 行，位置 9 的返回地址。第 2 行，栈底。\n\n**图 13-2** 第一次函数调用后的栈\n\n![](img/531249_1_En_13_Fig1_HTML.png)\n\
  \n一个包含三个函数、变量、调用函数以及不同位置（位置 1 至位置 9）的程序代码。\n\n**图 13-1** 函数相互调用的示例\n\n现在情况变得更加有趣了。在位置\
  \ 2 发生了什么？它再次调用了 `function_three`，但这次返回位置与之前不同——是位置 3。此时栈如图 13-6 所示。\n\n当 `function_three`\
  \ 运行时，它知道这次应该返回位置 3，而不是像之前被 `function_two` 调用时返回位置 5。所以，正如你所见，栈负责追踪程序的执行状态，并帮助计算机了解如何以及从哪里返回函数调用。\n\
  \n![](img/531249_1_En_13_Fig6_HTML.png)\n\n一幅包含 3 行文本的示意图。1，位置 3 的返回地址。2，位置 9 的返回地址。3，栈底。\n\
  \n**图 13-6** 第二次调用 `function_three` 后的栈\n\n通常，代码中的实际情况比这更复杂。由于许多函数都有返回值，而且函数实际上只是语句的一部分，因此返回时必须将程序发送到代码行中间的准确位置。这和之前的思路相同，只是计算机追踪的位置比我们示例中的行号要复杂得多。例如，考虑以下代码：\n\
  \n```\nvar square_a_number = function(x) {\n    return x * x;\n};\nvar y = square_a_number(square_a_number(2)\
  \ * 4);\n```\n\n\n\n### 13.2 栈中的局部变量\n\n在本例中，我们在*同一行*多次调用一个函数，每次调用都会返回到*该行中的不同位置*。不用担心，JavaScript\
  \ 确切地知道每次应该返回到哪里。它的定位系统比我们上面粗浅的例子要精确得多。此外，随着我们深入学习，JavaScript 在栈中存储的信息远不止返回位置。\n\
  \nJavaScript 在栈中存储的另一项主要内容是当前函数中使用的局部变量列表。为了讨论这一点，让我们看一个函数，它将计算一个范围内的所有数值之和，我们称之为\
  \ `sum_range`。例如，如果你给它数字 3 和 7，`sum_range(3, 7)` 将计算 `3 + 4 + 5 + 6 + 7` 并得出 `25`。图\
  \ 13-7 展示了这段代码的样子。在这个例子中，我们有局部变量——`r_start`、`r_end`、`x` 和 `total`。请记住，局部变量对全局作用域是不可见的。JavaScript\
  \ 实现这一点的方法是将当前变量列表保存在栈上。\n\n因此，当函数被调用时，不仅返回位置被放入栈中，还会在内存中创建一个\"作用域\"（可访问变量列表），并将栈链接到该作用域。\n\
  \n![](img/531249_1_En_13_Fig7_HTML.png)\n\n一个 9 行代码的求和程序，其中 `sum_range` 的 `r_start`\
  \ 和 `r_end` 分别为 3 和 5，提示消息显示数字 3 到 7 的和。\n\n**图 13-7** 对范围内所有数值求和\n\n所以，当我们调用 `sum_range`\
  \ 时，栈看起来会更复杂一些。图 13-8 展示了当 `sum_range` 函数刚开始执行 `for` 循环时栈的状态。请注意，当前作用域和当前位置周围有一个粗黑线框，这被称为**栈帧**。栈帧是为特定函数调用在栈上打包在一起的所有数据。作用域和返回位置共同组成了每个函数调用的栈帧。\n\
  \n栈帧将 JavaScript 指向当前用于处理变量的作用域。作用域的工作方式是：当你在程序中引用一个变量，比如 `x` 时，JavaScript 首先在栈上查找当前作用域的位置，然后在当前作用域中查找该变量。如果找到，就使用这个值。你看到局部作用域顶部写着\"\
  父级作用域\"的方框了吗？每个作用域都链接到一个父级作用域，这告诉 JavaScript 如果在当前作用域中找不到变量，应该去哪里查找。在本例中，父级作用域是全局作用域。在第\
  \ 14 章中，我们将看到如何链接更多的作用域。\n\n所以，当函数被调用时，不仅返回位置被放入栈中，还会创建一个*全新的*作用域，并且该新作用域的链接也会被放入栈中。\n\
  \n让我们看另一个类似的程序，它将声明一个名为 `sum_squares_of_range` 的函数。这个函数的工作方式与 `sum_range` 类似，不同之处在于它会对范围内的每个数字进行平方运算。代码如下：\n\
  \n![](img/531249_1_En_13_Fig9_HTML.png)\n\n一个 13 行代码的程序，用于计算范围内数字的平方和。`sum_square_range`\
  \ 的值为 3 和 6，提示消息显示数字 3 到 6 的平方和。\n\n**图 13-9** 对范围内数字的平方求和\n\n![](img/531249_1_En_13_Fig8_HTML.png)\n\
  \n一个概念性的计算机内存布局示意图，包含栈、局部作用域和全局作用域三个数据表。\n\n**图 13-8** 函数调用中计算机内存的概念布局\n\n在这个程序中，栈的深度达到了两层。首先，它调用\
  \ `sum_squares_of_range`，这导致了与上一个例子类似的情况。然后，为了计算每个数字的平方，它对每个数字调用 `square_number`。图\
  \ 13-10 展示了第一次调用 `square_number` 后、即将返回之前的栈布局。请注意，这两个函数的所有局部变量都*存在*，但它们只能从各自的函数内部*访问*。当\
  \ `square_number` 函数激活时，\"当前作用域\"指向 `square_number` 的局部作用域，该作用域包含其变量以及一条指向全局作用域的链接。因此，当\
  \ `square_number` 设置 `x` 的值时，它只影响其自己作用域内的 `x` 值。`sum_squares_of_range` 中的 `x` 对这个函数甚至不可见。所以，即使我们为\
  \ `x` 赋值，也只是针对特定于该函数的 `x` 的*局部*副本。当函数返回时，它会移除*同时*移除局部作用域的链接和返回位置。当 `sum_squares_of_range`\
  \ 再次开始执行时，其自己的作用域将位于栈顶，并且它完全看不到 `square_number` 的作用域。\n\n另外需要注意的一点是，当函数首次开始执行时，局部作用域*只*包含父级作用域和参数的条目。JavaScript\
  \ 依赖 `var` 关键字在其作用域内创建新变量。`var` 关键字使 JavaScript 在当前作用域（而*不是*任何父级作用域）中查找该变量是否*在该作用域内*存在。如果变量不存在，JavaScript\
  \ 就在当前作用域中创建该变量。如果变量已经存在，JavaScript *不会*创建新副本，而是继续使用已经存在的那个。\n\n![](img/531249_1_En_13_Fig10_HTML.png)\n\
  \n一个包含栈帧、`square_number` 的局部作用域、`sum_squares_of_range` 的局部作用域和全局作用域四个数据表的示意图。\n\n\
  **图 13-10** 两个函数同时激活时的栈帧\n\n一个手掌图标，食指指向右侧。\n\n#### 实践活动\n\n1.  查看你在第 10 章编写的使用函数的程序，挑选其中一个。\n\
  2.  打印出你的函数。从任何函数调用处画线到被调用函数的开头。从 `return` 语句画线到程序中返回的位置。\n3.  为这个程序创建一个类似于图 13-10\
  \ 的栈、局部作用域和全局作用域图，要求至少有一个函数处于激活状态。\n\n### 13.3 递归函数\n\n既然我们已经了解了栈帧和局部变量的工作原理，是时候学习**递归函数**了。递归函数是一个以自身为基础定义的函数。想一想前面图\
  \ 13-7 中对两个数之间的所有值求和的程序。在该程序中，我们使用了一个循环来遍历整个范围。但是，有没有另一种思考这个问题的方式呢？另一种解决途径呢？\n\n\
  考虑对 4 到 10 之间的所有数字求和。是否存在一个更小的、类似的、可以以相同方式利用的问题？确实，对 4 到 10 之间的所有数字求和，等同于将 4 加上\
  \ 5 到 10 之间数字的和。所以，`sum_range(4, 10)` 与 `4 + sum_range(5, 10)` 的结果相同。同样，`sum_range(5,\
  \ 10)` 与 `5 + sum_range(6, 10)` 的结果相同。\n\n以自身为基础定义函数被称为递归。我们如何编写一个使用递归的程序呢？图 13-11\
  \ 展示了这种实现的部分示例。\n\n![](img/531249_1_En_13_Fig11_HTML.png)\n\n\n\n#### 用于定义 `sum_range`\
  \ 函数的 4 行程序代码\n\n1. `var sum_underscore_range = function(r_start, r_end)`\n2. `var\
  \ value = r_start + sum_range(r_start + 1, r_end)`\n3. `return value;`\n4. `};`\n\
  \n**图 13-13** `sum_range` 函数的部分递归定义\n\n如你所见，该函数是根据其自身定义的。然而，如果你尝试运行这个函数，你会意识到一个问题：它永远停不下来！函数中没有任何机制使其在到达范围末端时停止，因此它会一直运行下去。\n\
  \n在编写递归程序时，主要需要处理两种情况：**基线情况**和**归纳情况**。归纳情况就是我们刚刚已经编写好的情况——即使用递归来解决问题的情况。归纳情况的名称来源于数学中的归纳证明，这与递归函数非常相似。而我们缺失的情况是基线情况——即停止递归以返回答案的情况。\n\
  \n在我们的程序中，当 `r_start` 和 `r_end` 相等时，就出现了基线情况。当这种情况发生时，我们不需要再递归了——我们知道答案是什么！当范围的起点和终点相等时，我们只需返回*那个*数字。\n\
  \n因此，使用递归的 `sum_range` 函数的完整定义如图 13-12 所示。如你所见，现在有一个用于检查基线情况的 `if` 语句，如果找到基线情况，它会立即计算结果。否则，程序将继续递归执行。\n\
  \n然而，你可能已经注意到了某个有趣的现象。我们这里使用了局部变量，但却是反复使用相同的局部变量。难道每次调用函数时这些变量不会被覆盖吗？事实上，它们不会。原因在于，**每次调用函数时**，JavaScript\
  \ 都会创建一个*新的*局部变量作用域。因此，每次调用 `sum_range` 时，都会创建一个新的局部作用域。所以，如果你调用 `sum_range(2, 5)`，它会创建四个局部变量作用域，每次调用\
  \ `sum_range` 都会生成一个。\n\n在第三次调用之后，堆栈看起来会像图 13-13 所示。请注意，在第三次调用 `sum_range` 后，图中恰好有三个\
  \ `sum_range` 局部作用域的副本，每个副本都以全局作用域作为父作用域，并且每个作用域中都有 `r_start` 和 `r_end` 自己的值。这就是计算机使递归函数调用成为可能的方式。\n\
  \n![](img/531249_1_En_13_Fig12_HTML.png)\n\n#### `sum_range` 函数实现的 9 行程序代码\n\n该程序包含一个处理基线情况和归纳情况的\
  \ `if` 和 `else` 条件语句，`sum_range` 的参数为 `3` 和 `12`，并弹出一条提示消息，内容为：3 到 12 之间所有数字的和即为结果。\n\
  \n**图 13-12** `sum_range` 函数的完整递归实现\n\n在迄今为止的示例中，并没有使用递归的必要。事实上，考虑到生成的所有函数调用、堆栈帧和局部作用域，我们的代码实际上比使用简单循环时要慢得多。尽管如此，在许多情况下，递归是使问题最具可理解性的方式，或者使用递归编写程序是最简单的。如今的程序很少需要大量的优化。虽然程序本身的速度不应被忽视，但通常最重要的事情是程序员编写程序所花费的时间，或者另一位程序员阅读和理解程序所花费的时间。这些通常比纯计算速度更为重要。\n\
  \n理解递归能帮助你更轻松地找到某些问题的解决方案。当你熟练使用递归时，你会开始将许多复杂的问题看成是伪装起来的简单问题。此外，理解递归还能帮助你更好地理解他人使用递归编写的代码。使用递归的最佳时机是当你可以将问题视为一个反复出现的相同问题，并且每一步都只是前一个问题的一个更小版本时。\n\
  \n![](img/531249_1_En_13_Fig13_HTML.png)\n\n#### 堆栈帧递归函数调用的 5 个数据表示意图\n\n堆栈从 3 个\
  \ `sum_range` 流向局部作用域，然后是全局作用域。\n\n**图 13-13** 递归函数调用的堆栈帧\n\n## 13.3.1 回顾\n\n在本章中，我们学习了\
  \ JavaScript 堆栈的工作原理，以及它如何使我们能够编写递归函数。我们学习了以下内容：\n\n* JavaScript 使用堆栈来跟踪程序中正在发生的事情。\n\
  * 每次调用函数时，JavaScript 会将返回位置的书签压入堆栈，指示函数完成后程序应跳转到的位置。\n* 每次函数完成时，JavaScript 会从堆栈中弹出一个书签，以确定应在何处恢复程序执行。\n\
  * 这种堆栈机制允许 JavaScript 返回到代码中的正确位置，即使函数从多个位置被调用也是如此。\n* 每次调用函数时（即使多次调用的是同一个函数），JavaScript\
  \ 都会保留一个独立的局部变量列表（局部作用域）。\n* 每次调用函数时，JavaScript 也会将指向新局部作用域的链接压入堆栈，以便知道当前正在使用哪个作用域。在函数执行结束时，该作用域会连同返回位置一起被弹出。\n\
  * 当程序引用一个变量时，JavaScript 只会查找*当前*局部作用域，并尝试在该作用域中找到你的变量。\n* 每个 JavaScript 作用域都有一个指向父作用域的链接。如果引用的变量在局部作用域中找不到，程序会尝试在父作用域中查找。\n\
  * 使用 `var` 关键字会在当前局部作用域中创建一个新变量。如果当前没有局部作用域（即程序不在函数内部），则会在全局作用域中创建该变量。\n* 递归函数是根据其自身定义的函数。\n\
  * 每个递归函数至少需要两种情况——归纳情况和基线情况。\n* 当问题的每一步都只是更大问题的一个简化形式时，最适合使用递归函数。\n* JavaScript\
  \ 堆栈是使递归程序能够工作的关键，因为堆栈为每次函数调用都保留了独立的局部作用域，从而允许函数在每次被调用时都有变量的独立副本。\n\n## 13.3.2 学以致用\n\
