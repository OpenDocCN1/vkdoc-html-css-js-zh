- "# 4. 计算机如何看待数据\n\n第 3 章介绍了计算机如何通过互联网相互传输数据的基础知识。本章将对此进行扩展，涵盖文档在计算机内部的存储方式。与上一章类似，本章中的许多信息更多是背景知识而非实用技能。JavaScript\
  \ 编程语言会自动为你处理大量数据处理工作，因此你无需为此操心。尽管如此，了解计算机在幕后为你做了什么仍然很重要！\n\n我们通常认为计算机是无所不能的系统，但现实中计算机的能力非常有限。在许多工程领域，工程师通过*限制*可能性来获得最强大的成果，这使得剩余的可能性更具威力。发动机通过将燃烧反应的能量引导到特定方向来运作。能量不再向四面八方扩散（这是其常态），而是只被允许沿着特定方向运动。汽车驾驶员可以去任何想去的地方，但这仅仅是因为发动机内部的燃烧被限制在非常有限的方向上。计算机之所以强大，恰恰是因为它们同样受到了限制。\n\
  \n计算机的核心功能只有两个——处理数字和传输数字。这似乎有悖常理。毕竟，当你在键盘上打字时，屏幕上显示的不应该是字母吗？你的计算机难道不处理图形和声音吗？实际上，所有这些都由数字控制。屏幕上每个像素的颜色都是一个数字。你输入的每个字母都有一个对应的数字。每一种声音都是一长串数字。计算机*看起来*好像在做很多不同的事情，但实际上它只做两件事——处理数字和传输数字。\n\
  \n本章的第一部分将介绍计算机如何用数字存储数据。第二部分将介绍如何将这些数字组织成一种**文件格式**，以便 Web 浏览器等软件应用程序读取。\n\n##\
  \ 4.1 计算机内存的模样\n\n要理解计算机如何看待内存，可以想象一个房间里摆满了编号的储物柜，它们的大小都一样。这些储物柜类似于计算机内存，因为它们都是编号的固定大小存储位置序列。例如，如果你有\
  \ 2 GB 的计算机内存，那意味着你的计算机包含大约 20 亿个固定大小的存储位置，或者用我们的类比来说，就是 20 亿个储物柜。每个位置都有一个编号，并且每个位置都有相同的固定长度。储物柜和计算机内存的区别在于，你可以在储物柜里存放不同种类的东西，但计算机内存的每个存储位置只能存储一个数字。\n\
  \n在现代计算机中，每个存储位置可以存储一个介于 0 到 255 之间的数字。这样的数字被称为**字节**。你可能想知道为什么计算机使用 0 到 255 的范围，而不是更自然的数字，比如\
  \ 100 或 1000。原因是 0 到 255 的范围对计算机*本身*就是自然的。在数学中，我们通常使用十进制系统来表示数字，该系统有十个数字——从 0 到\
  \ 9。然而，计算机使用二进制系统，该系统只有两个数字——0 和 1。每个数字被称为一个**位**，是*二进制数字*的缩写。当你书写数字时，数到十就用完了数字，所以你会增加另一位数字来继续计数，形成一个两位数。在二进制中，数到二就用完了数字。\n\
  \n图 4-1 列出了十进制和二进制中从 0 到 11 的数字。\n\n![](img/531249_1_En_4_Fig1_HTML.png)\n\n一个包含\
  \ 3 列的十进制和二进制数字表格，并附有位值说明。十进制数字从 0 到 11。\n\n图 4-1\n\n十进制和二进制表示的数字\n\n如果继续这样计算下去，你会发现\
  \ 255 是用 8 位能得到的最大数字。它在二进制中看起来像 `11111111`。简而言之，计算机的一个字节之所以存储 0 到 255 之间的数字，是因为一个字节由\
  \ 8 位组成。\n\n需要注意的是，左列和右列中的数字是*相同的数字*，只是表示方式不同。我们使用十进制数字的原因，可能源于我们的文化最初是用手指计数的。少数文化，例如尤基人，开始用手指间的缝隙计数，因此他们的数字系统只有\
  \ 8 个数字。这些情况下的数字本质并无不同——只是显示方式不同而已！\n\n在计算机编程中经常遇到的另外两种数字系统是**八进制**系统和**十六进制**系统。八进制系统只使用数字\
  \ 0–7，而十六进制系统实际上在我们现有的数字基础上*增加了*数字。十六进制使用字母来增加额外的数字。因此，在十六进制中，字母 A–F 代表十进制数字 10–15，而十六进制中的\
  \ 10 与十进制中的 16 相同。\n\n图 4-2 显示了十进制、二进制、八进制和十六进制中数字 0–16 的合并列表：\n\n![](img/531249_1_En_4_Fig2_HTML.png)\n\
  \n一个 4 列 17 行的表格，展示了数字 0 到 16 在十进制、二进制、八进制和十六进制中的表示。十六进制列包含数字和字母。\n\n图 4-2\n\n数字\
  \ 0–16 的十进制、二进制、八进制和十六进制表示\n\n\n\n在计算中经常使用八进制和十六进制的原因是，一位八进制数字恰好表示 3 位（bits），而一位十六进制数字恰好表示\
  \ 4 位。两个十六进制数字组合在一起表示 1 字节（byte）。因此，八进制和十六进制本质上被用作书写二进制数的简写形式。屏幕颜色就是一个例子。屏幕上的每个点由\
  \ 3 个字节表示——1 个字节用于红色分量，1 个字节用于绿色分量，1 个字节用于蓝色分量。在许多工具中，这些字节被拼接成一个六位十六进制数。例如，红色表示为`FF0000`，绿色表示为`00FF00`，蓝色表示为`0000FF`，蓝绿色表示为`00FFFF`，而更暗的蓝绿色表示为`009999`。\n\
  \n无论如何，计算机内存是一个由数百万或数十亿个字节依次排列而成的长序列。每个字节都有一个地址，它就像一个储物柜编号，因此你可以引用计算机中的特定内存位置。我们不会自己通过内存地址来访问字节，但计算机在最低级别上正是这样工作的。\n\
  \n现在，只能处理 0 到 255 之间的数字可能看起来非常有限。这之所以不是问题，是因为这只是机器在最低级别上的工作方式。编程语言会将几个这样的字节组合在一起，以表示更大的数字或其他类型的数据。表示带有小数点的数字是一个更困难的问题，但通常通过指定一定数量的位作为整数部分，再指定一定数量的位作为小数点在数字中的位置来解决。尽管在\
  \ JavaScript 中你不必处理这些细节，但最好记住，在最低级别上，你处理的所有东西都只是 0 到 255 之间的一系列数字。\n\n在接下来的内容中，我们将假设计算机能够处理我们抛给它的任何大小的数字。这并不完全正确，但对于我们的目的来说已经足够了。\n\
  \n![](img/531249_1_En_4_Figa_HTML.jpg) 一只手指向右方的手形图标。练习题\n\n*   如何将十进制数 12 写成二进制？\n\
  *   一位十六进制数字表示多少位？\n*   由于黑色是没有颜色，你认为在本节讨论的十六进制系统中如何表示黑色？\n*   白色是所有颜色的混合，又该如何表示？\n\
  \n## 4.2 使用数字表示数据\n\n那么，如果我们只能使用数字，如何存储其他类型的数据呢？答案是我们必须将信息转换成一系列数字。假设我们想描述一个人。我们可能想存储哪些信息？可能包括以下内容：\n\
  \n*   身高\n*   体重\n*   发色（黑色、金色、棕色、红色、白色等）\n*   眼睛颜色（蓝色、绿色、淡褐色等）\n\n其中一些值本身就是数字，比如身高和体重。我们只需要决定使用的单位。假设我们用英寸表示身高，用磅表示体重。发色和眼睛颜色不是数字，但计算机只能处理数字。那么我们该怎么办？我们为每个可能的值指定一个数字。例如，对于发色，黑色为\
  \ 0，金色为 1，棕色为 2，红色为 3，白色为 4。某个颜色为什么获得特定的数值并不需要理由。重要的是，无论我们分配了什么数字，都要一致地使用同一个数字来表示那种发色。接下来，我们可以为眼睛颜色选择数字。对于眼睛，我们可以设蓝色为\
  \ 0，绿色为 1，淡褐色为 2。这些数字与发色使用的数字重叠也没关系，只要我们知道当前处理的是哪一种数据即可。\n\n现在，我们可以用四个数字的序列来表示一个人——他们的身高、体重、发色和眼睛颜色。使用这个系统，我本人就是\
  \ 72, 275, 2, 2。一个与我完全相同但眼睛是蓝色的人将是 72, 275, 2, 0。注意数字的顺序有多么重要。如果我们不知道数字的顺序，就无法理解这些数据。这并非因为数字是按重要性排列的——我们完全可以将其排列为体重、眼睛颜色、身高、发色——重要的是我们*知道*预期的数字顺序，并且在每次使用数据时*遵循该约定*。否则，我们可能会把某人的体重误认为是身高，或者把眼睛颜色误认为是发色。\n\
  \n当你拥有一个预定义的数据集来描述某事物时，这被称为**数据格式**。数据格式看起来可能没什么大不了的。然而，当与其他程序通信时，它们的数据模式可能与你的不同。想象另一个程序，它存储相同的数据，但身高使用的是英尺而不是英寸。或者，假设它对每个人使用五个数字，第五个是年龄。在这些情况下，如果你从这种其他格式加载数据，就必须将数据从给定的数据格式转换为你自己程序所需的数据格式。这可能包括转换某些数据（例如，英尺到英寸）、忽略某些数据（因为我们的格式不包含年龄）、计算数据（如果一个程序需要年龄，或者另一个程序发送了出生日期），以及许多其他可能性。这些被称为**数据转换**，并且占据了编程任务的很大一部分。\n\
  \n![](img/531249_1_En_4_Figb_HTML.jpg) 一只手指向右方的手形图标。练习题\n\n1.  使用本节描述的数据格式描述你自己。\n\
  2.  用通俗的语言写出以下数字代表的人长什么样：\n\n    ```\n    69, 150, 0, 1\n    ```\n\n\n\n## 4.3 数据中的序列\n\
  \n我们在第 4.2 节中探讨的数据格式仅在我们需要存储固定数量的内容时才有用。由于每条数据都是通过其在序列中的位置来标识的，因此如果我们改变数据中项目的数量，它们的含义也会随之改变。假设你想存储一个人孩子的年龄。问题在于我们不知道一个人可能有多少个孩子。他们可能没有孩子，也可能有\
  \ 20 个。解决这个问题的一种方法是先存储孩子的数量，然后再存储孩子的年龄。这样我们就能知道孩子的年龄序列何时结束。例如，我们可以将格式修改为：身高；体重；孩子数量；孩子\
  \ 1 的年龄，孩子 2 的年龄，等等；发色；以及瞳色。通过在儿童列表*之前*存储孩子的数量，即使每条记录的长度略有不同，我们仍然能够知道每条数据在记录中的位置，因为我们知道需要寻找多少个孩子。\n\
  \n假设我们的朋友弗雷德有三个孩子，年龄分别为 12 岁、10 岁和 5 岁。他的记录可能如下所示：`70, 200, 3, 12, 10, 5, 1, 1`。数字\
  \ 3 告诉你接下来的三条记录将是孩子的年龄。之后，你再继续处理记录的其余部分。\n\n另一种存储重复值的方法是使用所谓的**哨兵**值。哨兵是一个值，它告诉你已经到达列表的末尾。因此，与其存储孩子的数量，我们可以决定使用一个哨兵值。由于没有孩子的年龄是负数，我们可以使用`-1`来表示列表结束，而不是使用计数。在这种方案下，弗雷德的记录将如下所示：`70,\
  \ 200, 12, 10, 5, -1, 1, 1`。\n\n此类数据序列通常被称为**数组**。数组就是将一系列数据打包成一个单一集合的序列。在这个例子中，孩子们的年龄就被视为一个数组。\n\
  \n![](img/531249_1_En_4_Figc_HTML.jpg)一个手指指向右方的手型图标。练习题\n\n1. 如果弗雷德有六个孩子，年龄分别是 21、19、14、12、10\
  \ 和 5 岁，使用带有孩子计数格式的记录会是什么样子？\n2. 如果使用带有哨兵值的格式，该记录又会是什么样子？\n3. 为什么哨兵值不能是一个可能的数据值很重要？\n\
  \n## 4.4 用数字表示字母\n\n现在我们稍微了解了计算机如何使用数字表示数据，就可以讨论计算机最常见的存储内容之一——文本了。在前一节中，我们对一个人的描述缺少了一个东西：这个人的*名字*。你如何仅用数字来表示一个名字，或者任何文本呢？\n\
  \n在我们研究计算机如何存储整段文本之前，我们先来看看计算机如何存储单个字符。由于计算机将所有内容都存储为数字，因此对于字母也是如此。就像我们用数字 0 来表示蓝色眼睛一样，我们可以为字母表中的每个字母都指定一个数字。然而，我们在屏幕上显示的不仅仅是字母表中的字母。还有标点符号、大小写字母、符号，甚至数字。数字需要用数字来表示似乎很奇怪，但当你将它们与“需要键入或显示的字符”列表混合在一起时，这就有意义了。因为没有什么能阻止你在文本中键入一个\
  \ 0，所以它必须与其他所有字符一起被表示出来。\n\n每个可能显示的字符都有一个对应的数字来表示它。最常用的在单字节中通过数字表示字符的系统称为**ASCII**码，它是在\
  \ 20 世纪 60 年代开发的。在 ASCII 中，十进制数 65–90 代表大写字母 A–Z，十进制数 97–122 代表小写字母 a–z，十进制数 48–57\
  \ 代表数字 0–9，空格则由十进制数 32 表示。更完整的 ASCII 表见附录 D。\n\n这就是表示单个字符的方法，但如何表示一整段文本，比如某个人的名字呢？回顾一下上一节，我们是如何表示一系列事物的？我们使用了数组，而一段文本可以被视为一个字符数组。作为数组，它既可以表示为一个长度值后跟字符列表，也可以表示为一个带有哨兵值的字符列表。在\
  \ ASCII 中，十进制数 0 是一个特殊字符，称为**空**字符，它被用作字符列表的哨兵。字符数组通常被称为**字符串**，而使用空字符作为哨兵值来表示的字符串通常被称为**空终止字符串**。\n\
  \n让我们回到我们在添加孩子之前的人物数据格式。假设我们想在记录中存储这个人的名字。该记录将存储姓名、身高、体重、发色和瞳色。我们可以使用空终止字符串来表示姓名。因此，我的名字“Jon”将被编码为`74,\
  \ 111, 110, 0`。那么，我的完整记录如下所示：\n\n```\n74, 111, 110, 0, 72, 275, 2, 0\n```\n\n你可以通过哨兵值来判断我的名字在哪里结束以及记录的其余部分从哪里开始。\n\
  \n现在，我们添加孩子，使用`-1`作为哨兵值。假设我有两个孩子，Jim 和 Bob。在接下来的记录中，我们将使用格式：姓名、身高、体重、发色、瞳色、孩子 1\
  \ 的姓名、孩子 1 的年龄、… 、-1。看起来像这样：\n\n```\n74, 111, 110, 0, 72, 275, 2, 0, 74, 105,\n\
  109, 0, 14, 66, 111, 98, 0, 12, -1\n```\n\n![](img/531249_1_En_4_Figd_HTML.jpg)一个手指指向右方的手型图标。练习题\n\
  \n* 查看上面的记录。根据这个格式，Jim 的年龄是多少？\n* 如果我还有一个名叫 Mary Ann、年龄为 6 岁的孩子，请为我创建一条新记录。\n\n\
  正如你所见，为了处理数据，计算机必须非常精确地知道何种数据放在何处、其长度是多少、以及它是否重复。为了让两个程序之间进行通信，甚至让同一程序内的两个函数之间进行通信，它们必须就数据的格式达成一致。现在，在像\
  \ JavaScript 这样的现代编程语言中，其表示方式比一串数字友好得多。例如，JavaScript 允许你写`\"Jim\"`而不是`74, 105, 109,\
  \ 0`，但在底层它实际上做的是同样的事情。`\"Jim\"`是一个字符串。在大多数编程语言中，给一串字符加上引号表示这些字符应该被视为一个文本字符串。通常，如果你在程序中看到`234`，它表示的是*数字*234，但`\"\
  234\"`表示的是字符`2`、`3`、`4`组成的字符串（在 ASCII 中分别由数字 50、51、52 表示）。\n\n现代编程语言和程序使用一种称为**UTF-8**的编码，而不是\
  \ ASCII，但在大多数情况下，当使用英语时，它们是等价的。有关字符编码和 UTF-8 的更多信息，请参见附录 D。\n\n\n\n### 4.5 什么是文件格式？\n\
  \n到目前为止，我们已经讨论了计算机如何使用数据格式在内存中存储内容。之所以使用数据格式，是因为一切内容都由数字表示，因此我们需要一种格式来了解这些数字的*含义*。*文件格式*与数据格式完全相同，区别在于它存储在磁盘上而非内存中。\n\
  \n你是否曾尝试用错误的应用程序打开文档？结果如何？通常，如果用错误的应用程序打开文档，要么会报错，要么会显示一堆乱码。正如我们所见，由于程序只处理数字，它们必须知道数据格式才能理解数据。如果不了解格式，文件就是一堆无意义的内容。\n\
  \n计算机通常通过文件名来区分不同的文件类型。大多数文件都有一个**文件扩展名**，用于标识文件类型。例如，Adobe 可移植文档格式文件通常以 `.pdf`\
  \ 结尾。还有许多不同的图形格式，每种都有各自的扩展名，例如 `.jpg`、`.jpeg`、`.png` 或 `.gif`。MP3 音频文件的扩展名为 `.mp3`。\n\
  \n然而，在互联网上，URL 并不总是包含扩展名，而且出于各种技术原因，有时甚至会包含与所发送文件类型*不同*的扩展名。此外，有时多个格式共享同一个扩展名。因此，为了消除歧义，互联网使用**内容类型**（也称\
  \ MIME 类型）来标识文件格式。如果你还记得在第 3 章中使用 HTTP 与服务器通信的内容，在我们发送请求后，服务器会返回响应行、响应头和响应文档。其中，Web\
  \ 服务器返回的一个响应头就是 `Content-Type` 头。在我们的示例中，服务器返回的内容类型是 `text/html`。内容类型包含两部分：类型和子类型。在此例中，类型是\
  \ \"text\"，子类型是 \"html\"。既然类型是 \"text\"，你认为它如何存储数据？所有文本文档都将数据存储为长字符串。在文本文档中，*唯一*允许的数据类型就是字符。大多数不具有\
  \ \"text\" 类型的文件被称为**二进制**文件，这仅意味着它们包含非文本数据。\n\n然而请注意，这里有一个子类型 \"html\"。这表明文本文件本身也可以具有格式。也就是说，我们可以对文本文件进行组织，使其便于计算机定位特定类型的数据。例如，电子表格常使用\
  \ CSV（逗号分隔值）文件。CSV 文件格式使用逗号分隔不同列的数据，使用回车符分隔不同行的数据。图 4-3 显示了一个包含三列四行的 CSV 文件示例。\n\
  \n![](img/531249_1_En_4_Fig3_HTML.png)\n\nCSV 文件的图示包含了 Jon B、Fred F、Jennifer Q 和\
  \ Jim Z 的姓名、年龄和身高。\n\n**图 4-3** CSV 文件示例\n\n由于 CSV 是文本文档，整个文件将作为字符串存储。电子表格在加载文档时，可能会将第\
  \ 2 列和第 3 列转换为数字，但在磁盘上，由于它是文本文档，它是以字符串形式存储的。该格式规定：当电子表格加载文件时，应基于逗号位置将行拆分为列，并基于换行位置将文件拆分为行。因此，因为它是文本格式，文件的所有细节都易于被人查看和理解——因为它只是一串字符。然而，它实际上是一种*数据格式*，因为文件的不同部分具有重要含义——在此例中，就是逗号和换行符。\n\
  \n在第 6 章中，我们将探讨 HTML 文件格式。\n\n![](img/531249_1_En_4_Fige_HTML.jpg)一个手形图标，食指指向右侧方向。\n\
  \n**练习题**\n\n要了解文本文件和二进制文件的区别，请用文本编辑器打开不同类型的文件。关于什么是文本编辑器以及如何使用，请参见附录 B.3。\n\n1.\
  \  按照 B.3 中的说明打开你的文本编辑器。\n2.  在计算机上打开一个具有以下扩展名之一的文件：`.jpg`、`.jpeg`、`.png`、`.pdf`、`.mp3`、`.doc`、`.xls`。如果你的计算机没有显示文件扩展名，B.3\
  \ 节介绍了如何使其可见。\n3.  由于你使用的是文本编辑器，它会尝试将文件中的每个数字当作字符处理。这就是为什么会出现各种奇怪字符——你的文本编辑器不知道如何处理非文本字符。\n\
  4.  现在，在计算机上打开一个具有以下扩展名之一的文件：`.txt`、`.csv`、`.html`、`.rtf`。如果你没有这些类型的文件，你可以使用任何文字处理器轻松创建一个\
  \ `.rtf` 文件。只需告诉文字处理器将文档导出为“富文本格式”，它就会生成一个扩展名为 `.rtf` 的合适文件。\n5.  即使你*不理解*该文件，它至少应该是可查看的——你应该能识别出它使用的字符。\n\
  6.  请注意，扩展名本身不起任何作用——它们仅仅用于帮助你了解文件内容、使用哪个程序打开文件以及为该文件显示哪个图标。你的操作系统会保留一个默认程序列表，用于处理各种文件扩展名。如果你更改了文件的扩展名，计算机很可能会为该文件打开错误的程序！\n\
  \n#### 4.5.1 回顾\n\n在本章中，我们介绍了计算机如何查看和处理数据的一些细节。我们学到了以下内容：\n\n*   计算机使用数字存储一切内容。\n\
  *   为了让计算机理解这些数字的含义，它们必须采用预定义的数据格式。\n*   数据列表通常通过存储长度（位于数据项数量之前）或使用哨兵值来指示列表末尾的方式进行存储。\n\
  *   显示字符（包括字母、数字、标点符号和空格）通过用数字表示每个字符来存储。\n*   文本块存储为由显示字符组成的序列，称为*字符串*。\n*   与其他序列一样，字符串的大小由长度或末尾的哨兵值（通常为数字\
  \ 0，而非文本数字 `\"0\"`，称为*空*字符）给出。\n*   文件格式就是存储在磁盘上的数据格式。\n*   文件名具有*文件扩展名*，用于指示数据的格式。\n\
  *   文本文件是一种文件格式，其中整个文件存储为一个长字符串。\n*   文本文件本身通常具有特定的结构。\n*   CSV 文件是具有特定结构的文本文件示例——它们使用换行符分隔记录，使用逗号分隔字段。\n\
  *   HTML 文件是具有自身结构的文本文件。\n\n\n\n#### 4.5.2 学以致用\n\n1.  假设我们想在一台计算机上存储关于一辆汽车的数据。我们可能需要存储哪些数据？我们该如何用数字在计算机中表示这些数据？\n\
  \n2.  用 ASCII 码数字写出你最喜爱的汽车品牌名称。\n\n3.  尝试用文本编辑器创建你自己的 CSV 格式文件。保存时务必确保文件扩展名为`.csv`。现在，如果你的计算机上有电子表格程序，尝试用该程序打开这个文件。会发生什么？\n\
  \n4.  打开你的电子表格程序并创建一个电子表格。为电子表格单元格添加颜色和样式。然后，将电子表格保存或导出为 CSV 文件。在文本编辑器中打开该文件。它看起来是什么样？再在电子表格程序中打开该\
  \ CSV 文件。发生了什么变化？\n\n5.  在你的文字处理程序中编写一个文档。写上三到四行文字，每行的格式略有不同（字体大小、斜体等）。将此文件保存为 RTF（也称为“富文本格式”，扩展名为`.rtf`）文件。RTF\
  \ 文件是文字处理程序的一种文本格式。用文本编辑器打开该文件。它看起来是什么样？你能找到你原本的文本吗？你能解读那些其他字符可能代表什么意思吗？现在，在文本编辑器中对你原有的一些文本进行修改，然后用文字处理程序打开该文件。发生了什么？\n\
  \n"
- "# 5. 计算机的工作原理\n\n既然我们已经对计算机的来源、通信方式以及数据存储方式有了一些了解，我们就可以学习计算机是如何工作的了。第 1 章讨论了机器语言与编程语言的区别，机器语言允许程序员向计算机发出它直接理解的指令，而编程语言则是一种更接近人类思考方式的计算机编程方法。由于编程语言并非计算机的母语，它们最终必须被翻译成机器语言指令。因此，由于必须能够翻译成机器语言，编程语言比人类语言要更严谨、更精确。\n\
  \n大多数程序员永远不需要使用机器语言。然而，至少在概念上理解机器语言是什么样子的，还是很有好处的，因为这有助于你理解编程所需的精确性。新手程序员遇到的最大问题是，他们在编写程序时，期望计算机执行他们*实际意图*所要表达的内容，而这往往与他们实际告诉计算机去做的内容不同。\n\
  \n我年轻时上过一堂课，课上老师让两个人背对背坐着，这样他们就看不到对方。然后，其中一个人需要折一架纸飞机，并向另一个人准确描述折叠纸张的步骤，以便对方也能折出一架。如果你曾尝试过类似的事情，你就会知道，在你无法看到对方如何尝试理解你的话，并且没有任何视觉线索表明你意图的情况下，要传达准确的指令有多么困难。几乎无一例外，对方会把纸折错，最后得到一堆无用的废纸。关键在于，即使我们认为自己表达得很精确，即使我们努力追求精确，我们给出的指令往往也不像我们以为的那么精确。然而，计算机在接收指令时却要求绝对的精确。\n\
  \n了解机器语言的工作原理，能让你体会到编程所需的那种精确性。因此，在我们开始学习编程之前，本章将让你感受一下计算机在机器语言层面是如何实际进行处理的。\n\n\
  本章中的例子可能看起来很繁琐。它们确实*很*繁琐。如今很少有人再用机器语言编程了，因为*它*实在太繁琐了。不过别担心，编程语言的发明正是为了消除机器语言的繁琐。这里的重点是向你介绍机器的思考方式，以便你更好地理解所需的精确性，并开始按照计算机需要你思考的方式来思考。在我整个编程生涯中，从未需要过用机器语言编程。然而，了解机器语言如何工作极大地帮助我调整了自己的想象和思维，从而更好地理解如何让程序运行起来。\n\
  \n## 5.1 计算机的组成部分\n\n你可以从概念上将计算机分为四个主要部分：\n\n*   **中央处理器** (CPU)\n*   计算机的**内存**\
  \ (也称为随机存取存储器，或 RAM)\n*   一个**输入/输出系统**\n*   一条用于在这些不同部件之间移动数据的**数据总线**\n\n计算机的\
  \ CPU 是大部分数据处理发生的地方。CPU 本身又分为两个组件：**控制单元** 和 **算术逻辑单元** (ALU)。控制单元管理计算过程本身。控制单元维护一个被称为**指令指针**的数据，它保存着内存中下一条要执行指令的位置。控制单元查看一条指令，确定处理该指令所需的条件，然后管理执行该指令所需的所有组件。这可能包括从内存写入和读取数据、向输入/输出系统读写数据，以及告诉算术逻辑单元执行计算。算术逻辑单元直接执行基本计算，如加、减、乘、除。它还执行逻辑比较，比如比较两个值是否相等，或者一个值是否大于另一个值。尽管有些处理器拥有比其他处理器更多的内置计算功能，但它们在计算能力上是等价的。即使你只有一个只能做加法和减法的处理器，你也可以编写额外的代码，利用加法和减法来实现乘法和除法。一台配备最少指令的计算机也能执行任何必要的计算——只是需要程序员付出更多努力。ALU\
  \ 还可以包含称为寄存器的临时存储位置，用于执行计算和存储结果。\n\n计算机的内存是计算机存储正在被积极处理的数据的地方。计算机的内存*不同于*它的硬盘驱动器。硬盘驱动器实际上是在计算机外部，通过输入/输出系统连接的。硬盘驱动器是数据可以永久存储的地方。计算机内存则是数据在使用时存储的地方。为了理解这种差异，如果你突然关闭计算机，存储在内存中的信息会被清除。在第\
  \ 4 章中，我们讨论了计算机内存是如何布局的。它被划分为数十亿个存储单元，每个单元可以保存一个 0 到 255 之间的数字。这些单元本身是编号的，以便于识别和快速访问。\n\
  \n计算机中的输入/输出系统负责与外部世界进行通信。计算机主机本身无法与人交互。键盘输入、屏幕输出、硬盘驱动器、网络适配器，以及我们与计算机交互时所想到的所有其他设备，实际上都位于计算机的“外部”，通过输入/输出系统连接。存在几种输入/输出系统标准，其中最常用的是**通用串行总线**\
  \ (USB)。USB 定义了一种将输入/输出设备连接到计算机的标准方式。这使得 U 盘、USB 摄像头、USB 键盘以及无数其他设备都能连接到你的计算机。没有输入/输出系统，计算机将无法使用，因为我们就没有办法向它提供数据或程序，也无法看到计算结果。\n\
  \n\n\n数据总线负责在各个系统之间传输数据。它是计算机系统中一个**重要但常被忽视**的特性。例如，如果你有一个非常快的 CPU 和大容量内存，但数据总线在将内存数据传输到\
  \ CPU 时速度缓慢，那么两者都无法发挥太大作用。总线通过集线器连接在一起，集线器负责引导进出每个设备的数据流。许多现代计算机架构都包含两个独立的集线器。直接连接\
  \ CPU 的最快集线器通常被称为**北桥**。它将 CPU 连接到内存和显卡。另一个集线器通常被称为**南桥**，它连接北桥与其余的输入/输出系统。\n\n\
  ## 5.2 一个简化的纸面机器模拟\n\n在本章的剩余部分，我们将以一个“纸面机器”进行实践。也就是说，我们将用笔和纸来模拟 CPU 在运行程序时的行为。\n\
  \n这里介绍的机器和机器语言的目的是帮助你理解机器语言的*概念*。我们将要介绍的机器语言并不是任何计算机上实际使用的机器语言，但它非常相似。如果你将来希望学习真实的机器语言，这将有助于你理解和学习。因此，你不需要记忆本章后面的任何内容。但是，你确实需要按照说明进行操作并完成活动，因为它们将帮助你理解计算机正在做什么。\n\
  \n为了进行模拟，你需要几张白纸、一支钢笔和一支带橡皮擦的铅笔。你可能还想用一把尺子来辅助画直线。当说明提到要用铅笔时，务必使用铅笔，因为你会进行大量擦除操作。\n\
  \n以下初始步骤应使用钢笔完成。\n\n在第一张纸的顶部，将标题写为“计算机内存”。然后，画一个填满整张纸的 8x8 网格方格。在每个方格的左上角编号，从 0\
  \ 开始，一直到 63。这些就是内存位置的地址。请务必留出足够的空间在每个方框内写入一个值。每个内存位置可以接收一个介于 0 到 255 之间的数字。如果方框内没有写入值，则假定该值为零（因此，现在你的内存全是零）。这张纸将代表一个非常微小的计算机内存。（真实的计算机内存大约需要五十亿张这样的纸。）随着我们模拟的进行，方格中的值将会改变。\n\
  \n在第二张纸的顶部，将标题写为“控制单元”。然后，在纸的左上角画一个空方框，并将其标记为“指令指针”。接着，在纸的剩余部分创建四列，分别标为“含义”、“操作码”、“操作数\
  \ 1”和“操作数 2”。\n\n在第三张纸的顶部，将标题写为“算术逻辑单元”。在这片区域内画 16 个方框，并分别标为“寄存器 0”到“寄存器 15”。\n\n\
  这个过程结束后，你应该有三张纸，看起来与图 5-1 所示一致。\n\n在下一节中，我们将处理一个机器语言程序，这个操作应使用铅笔完成。你将把该程序（图 5-3）复制到内存中。然后，为了运行模拟，你将使用图\
  \ 5-2 中详述的步骤。\n\n在这种机器语言中，每条指令由三部分组成——`操作码`、`操作数 1`和`操作数 2`。`操作码`是实际执行的功能。操作码列表及其含义在本章末尾。每个操作码都有非常特定的任务。一个操作码可能指示你从内存中加载一个值到寄存器，将寄存器值相加，比较寄存器值等等。`操作数\
  \ 1`和`操作数 2`的行为会根据所使用的操作码而有所不同。说明会告诉你如何使用它们。\n\n操作数的使用方式称为模式。有时，操作数会指定一个寄存器编号（称为*寄存器模式*）。这意味着操作数中的数字指向算术逻辑单元中的一个寄存器。如果操作数是\
  \ 6，使用寄存器模式意味着该操作数指向寄存器 6。有时，操作数会指定一个内存位置（称为*内存模式*）。这意味着操作数中的数字指向计算机内存中的一个内存位置。如果操作数是\
  \ 6，使用内存模式意味着该操作数指向内存位置 6。有时，操作数会指定一个数值（称为*立即数模式*）。这意味着操作数中的数字本身被用作数值。如果操作数是 6，使用立即数模式意味着该操作数仅仅指向数值\
  \ 6 本身。最后，还有一种模式称为*间接模式*。在这种模式下，操作数指向一个寄存器，但该寄存器被用来指向一个内存位置。所以，如果操作数是 6，使用间接模式意味着该操作数指向存储在寄存器\
  \ 6 中的一个内存位置。如果寄存器 6 的值是 23，那么在间接模式下，将使用内存位置 23 作为操作数。\n\n举个例子，假设指令是`20, 5, 10`。这意味着\
  \ 20 是操作码，5 是`操作数 1`，10 是`操作数 2`。现在，我们在本章末尾（第 5.5 节）的操作码表中查找操作码 20。表中显示，这个操作码的意思是“立即数加载”。表格中还说明，`操作数\
  \ 1`使用*寄存器模式*，因此指向一个寄存器。由于`操作数 1`是 5，所以`操作数 1`被解释为指向寄存器 5。表格说明`操作数 2`使用*立即数模式*，因此使用数值本身。由于`操作数\
  \ 2`是 10，所以`操作数 2`就是数值 10。在描述中，它说我们应该将由`操作数 2`指定的值加载到由`操作数 1`指定的寄存器中。因此，我们需要拿出“算术逻辑单元”那张纸，擦掉寄存器\
  \ 5 中的内容，并写入数值 10。\n\n![](img/531249_1_En_5_Fig2_HTML.png)\n\n一个用于模拟过程的 8 步文本指令。第一步是拿出控制单元纸，查看你的指令指针，最后回到步骤\
  \ 1 并再次执行。\n\n图 5-2\n模拟步骤\n\n![](img/531249_1_En_5_Fig1_HTML.png)\n\n一组 3 张表格。1，控制单元，有\
  \ 4 列：含义、操作码、操作数 1 和操作数 2。2，算术逻辑单元是一个 4x4 的表格，标注为寄存器 0 到 15。3，计算机内存是一个 8x8 的表格，编号从\
  \ 0 到 63。\n\n图 5-1\n机器模拟设置\n\n在下一节中，我们将进行一次完整的模拟。\n\n![](img/531249_1_En_5_Figa_HTML.jpg)一只手形图标，食指指向右侧。\n\
  ### 在课堂环境中进行模拟\n\n这种模拟很容易在课堂环境中进行，实际上它最初就是为课堂使用而开发的。要做到这一点，你需要使用白板或黑板，而不是纸张。指定一名学生担任控制单元。该学生负责执行上述步骤，但不能离开控制单元区域或在其他学生的板上书写。\n\
  \n指定另一名学生担任数据总线。该学生负责在计算机内存之间传输所有必要的数据。控制单元将指示数据总线需要获取或存储哪些值。数据总线只听从控制单元的指令。\n\n\
  再指定一名学生处理算术逻辑单元的纸。他们将执行控制单元要求在其寄存器上进行的任何计算，并可以向控制单元提供其寄存器中已计算出的任何值。\n\n我发现，互动式地执行计算极大地提高了学生将计算机内部发生的情况可视化的能力，从长远来看，这使他们成为更好的程序员。\n\
  \n\n\n## 5.3 一个简短的程序：乘以 2\n\n现在我们将编写一个程序来实现将一个数乘以 2。如果你翻阅本章末尾（5.5 节）的操作码表，可能会注意到其中没有用于乘法的操作码。但基础算术告诉我们，可以通过重复加法来实现乘法。因此，我们需要取出一个数，将其自身相加，然后把结果存回寄存器或内存中。在我们的程序中，内存地址\
  \ 62 将存储要乘的数（本例中为数字 12），而程序结束时，内存地址 63 将存储计算出的结果。\n\n![](img/531249_1_En_5_Fig3_HTML.png)\n\
  \n一段用于两个数乘法的 3 行 Java 代码。它写着：`var multiply underscore by underscore two equal functions\
  \ of x, open brace. 2, return x multiplied by 2 semicolon. 3, close brace semicolon`。\n\
  \n图 5-3\n用 JavaScript 实现一个数乘以 2\n\n### 5.3.1 设置模拟环境\n\n开始模拟前，需要将代码和数据都写入内存。请将图 5-4\
  \ 中的数值复制到你的计算机内存表中。\n\n![](img/531249_1_En_5_Fig4_HTML.png)\n\n一个 8 行 8 列的表格，单元格标号从\
  \ 0 到 63。单元格中包含的数字有：0、22、62、21、1、133、25、63、12。其余所有单元格数字均为 0。\n\n图 5-4\n用于实现一个数乘以\
  \ 2 的机器语言程序\n\n在你打算彻底放弃编程之前，请允许我提醒你，这个练习的重点并非我们真的会用这种方式编程，而是让你一窥计算机处理问题的视角。计算机编程语言被发明出来的根本原因，正是为了让我们不必每天处理这些底层内容。所以，为了缓解你的焦虑，图\
  \ 5-3 展示了用 JavaScript 实现相同功能的代码。\n\n你可能仍然不明白这段代码具体做了什么，也不理解为什么这样写，但希望它能给你带来希望——这总比一堆写出来的数字更容易理解。\n\
  \n现在，要运行这个程序，你需要查看图 5-2 中的步骤。我们将一步步地执行，以便你掌握操作方法。\n\n### 5.3.2 运行模拟\n\n现在，让我们一步步地执行这个程序，看看发生了什么。所有操作都*用铅笔*完成。查看图\
  \ 5-2。第一步是核对内存位置是否已正确复制。请现在完成这一步。接着，在标有“指令指针”的方框中写入 0。现在就开始执行。然后，我们可以按编号步骤继续。\n\n\
  步骤 1 要求查看指令指针。它应该显示为 0。\n\n步骤 2 要求查看指令指针所指向的内存位置。由于指令指针为 0，我们查看内存地址 0。\n\n步骤 3 要求将该内存位置的值复制到控制单元表的第一行，位于“操作码”标题下。内存地址\
  \ 0 的值是 22，因此我们在控制单元表第一行的操作码列中写入 22。\n\n步骤 4 要求将内存中的下一个值复制到“操作数 1”列。下一个内存地址是地址 1，其值为\
  \ 0。因此，我们在操作数 1 列写入数字 0。接着，将内存中的下一个值（地址 2）复制到“操作数 2”列。内存地址 2 的值是 62，所以在操作数 2 列写入数字\
  \ 62。这就是我们的第一条指令：`22, 0, 62`。\n\n步骤 5 要求将指令指针的值加 3。当前指令指针的值为 0，所以`3 + 0`等于 3。擦除\
  \ 0，在方框中写入 3。这让我们可以在下次执行这些步骤时读取下一条指令。然而，现在执行这一步很重要，而不是在步骤末尾，因为有些指令可能会进一步修改这个值。\n\
  \n步骤 6 要求在 5.节的操作码列表中查找操作码列中的值。操作码是 22，所以浏览操作码列表找到操作码 22。操作码并非按数字顺序排列，因此你需要逐一查找，直到找到正确的那个。操作码是“Load\
  \ Memory”（加载内存）。因此，在“含义”列中写入“Load Memory”。\n\n步骤 7 要求执行该操作码在操作码表中列出的步骤。你会注意到操作码表指出，操作数\
  \ 1 指向一个寄存器，操作数 2 指向一个内存位置。因此，我们将处理寄存器 0 和内存地址 62。描述说明，要将操作数 2 指定内存位置的值加载到操作数 1\
  \ 指定的寄存器中。因此，我们将内存地址 62 的值加载到寄存器 0 中。内存地址 62 的值为 12，所以在算术逻辑单元表的寄存器 0 中写入 12。\n\n\
  步骤 8 要求返回步骤 1，并对下一条指令重复执行。\n\n现在我们回到了步骤 1。因此，我们需要再次查看指令指针。这次它被设置为 3。步骤 2 要求查看指令指针指向的内存位置。该位置包含数字\
  \ 21。步骤 3 要求将该数字复制到控制单元表的下一行，位于操作码列。因此，在操作码列中写入数字 21。步骤 4 要求将接下来的两个内存位置复制到操作数 1\
  \ 和操作数 2 列。接下来的两个内存位置分别包含数字 1 和 0，所以在操作数 1 列写入 1，在操作数 2 列写入 0。我们复制的指令是`21, 1, 0`。\n\
  \n步骤 5 要求将指令指针的值加 3。因此，在指令指针方框中写入 6，擦除之前的值。\n\n\n\n**步骤 6** 指示在 5.5 节的操作码列表中查找 `Opcode`\
  \ 列中的值，并将该操作码的名称写入 `Meaning` 列。该操作码的含义是“加载寄存器”。**步骤 7** 指示执行操作码描述的功能。描述说明要将 `Operand\
  \ 2` 指定的寄存器中的值复制到 `Operand 1` 指定的寄存器中。`Operand 1` 是 1，`Operand 2` 是 0。因此，查看寄存器 0。它当前包含数字\
  \ 12。所以，将 12 写入寄存器 1 的方框中。\n\n这条指令为我们提供了同一个数字的两个副本——一个在寄存器 0 中，另一个在寄存器 1 中。这很好，因为乘以\
  \ 2 就是将同一个数字相加两次。因此，你认为下一条指令会是什么类型？浏览指令列表，看看你认为我们下一步会执行哪一条。**步骤 8** 指示对下一条指令重复此过程，那么我们现在开始。\n\
  \n如果你再次执行步骤 1–4，你将复制到下一条指令，即 `133, 0, 1`。**步骤 5** 告知我们要将 `Instruction Pointer` 加\
  \ 3，所以在 `Instruction Pointer` 框中写入 9。**步骤 6** 指示在操作码列表中查找 `Opcode` (133) 并写下其含义。在\
  \ `Meaning` 列中写入“Add”。**步骤 7** 指示执行操作码描述的功能。它说明要将 `Operand 1` 和 `Operand 2` 指定的两个寄存器相加，并将结果存储在\
  \ `Operand 1` 指定的寄存器中。`Operand 1` 是 0，`Operand 2` 是 1。因此，我们将把寄存器 0 中的值与寄存器 1 中的值相加。寄存器\
  \ 0 中有 12，寄存器 1 中也有 12。相加得到 24。指令说将值存储在 `Operand 1` 指定的寄存器中。`Operand 1` 是 0，所以我们将结果存储在寄存器\
  \ 0 中。因此，擦除寄存器 0 中当前的内容，并在其中写入 24。\n\n寄存器 0 现在有了我们想要的值（24 是 `12 * 2`），但目标是将它存储到内存地址\
  \ 63 中。那么你认为下一条指令可能会做什么？**步骤 8** 指示重复此过程来找出答案。\n\n执行步骤 1–4 将得到下一条指令：`25, 63, 0`。**步骤\
  \ 5** 指示我们将 `Instruction Pointer` 增加到 12。**步骤 6** 指示我们在操作码列表中查找操作码 25 的含义，并将其写在\
  \ `Meaning` 列中。这得到了“存储内存”。\n\n**步骤 7** 指示我们执行与该操作码关联的指令。这说明了要将 `Operand 2` 指定的寄存器中的值存储到\
  \ `Operand 1` 指定的内存位置中。`Operand 1` 是 63，`Operand 2` 是 0。因此，我们将获取寄存器 0 中的值（即 24）并将其写入内存位置\
  \ 63，擦除该位置当前的内容。因此，将 24 写入内存位置 63。\n\n**步骤 8** 指示返回步骤 1 并处理下一条指令。\n\n执行步骤 1–4 将得到下一条指令——`0,\
  \ 0, 0`。**步骤 5** 指示将 `Instruction Pointer` 增加到 15。**步骤 6** 指示查找操作码，它告诉我们操作码 0 是“Halt”。**步骤\
  \ 7** 指示如果我们到达 `Halt` 指令，我们应该结束模拟。\n\n现在我们完成了！如果你还记得本节开头的内容，目标是将存储在内存位置 62 中的值乘以\
  \ 2，并将其存储在内存位置 63 中。内存位置 62 中有 12，内存位置 63 中有 24。虽然做了很多工作，但这正是计算机在处理指令时所做的事情。这些指令必须如此简单，因为计算机本身无法思考；它们只能处理。由于指令非常简单，即使执行简单的任务也需要相当多的指令。然而，这种简单性也允许计算机每秒执行数十亿条指令。\n\
  \n## 5.4 对数字列表求和\n\n现在我们将做一个更复杂的程序——我们将对一个数字列表求和。为了做到这一点，我们需要能够知道何时到达数字列表的末尾。我们将使用一个哨兵值来表示我们到达了数字列表的末尾。（有关哨兵值的更多信息，请参见第\
  \ 4 章。）我们将使用数字 255 作为哨兵来表示数字列表的末尾。\n\n这个程序要做的是，将从内存位置 57 开始的所有数字相加，直到遇到哨兵值，然后将结果存储在内存位置\
  \ 56 中。\n\n程序如图 5-5 所示。\n\n![](img/531249_1_En_5_Fig5_HTML.png)\n\n一个 8 行 8 列的表格，编号从\
  \ 0 到 63。其中一些单元格包含随机数字，其他单元格为 0。\n\n**图 5-5** 用于对数字列表求和的机器语言程序\n\n现在，在我们逐步讲解程序之前，让我们思考一下执行这个过程需要发生什么。首先，我们需要一个地方（可能是一个寄存器）来在我们遍历数字时保存当前的和。在过程中，我们需要检查每个数字，看它是否与我们的哨兵值\
  \ 255 匹配。如果遇到哨兵值，我们需要让计算机执行与未遇到时 *不同的* 操作。最后，我们需要一种重复步骤的方法，因为我们不知道要进行多少次计算。\n\n\
  实现所有这些的方法是比较和条件跳转。也就是说，我们将比较两个数字，并根据比较结果，潜在地修改指令指针，告诉计算机运行不同的代码。由于我们通过查看指令指针来获取下一条代码，如果一条指令修改了指令指针，那么我们将执行与否则会执行的\
  \ *不同的* 任务。\n\n我们将看到的另一个特性是间接模式。由于我们将要查看未知数量的不同值，因此我们无法将要加载的值的地址放在代码中。因此，我们要做的是使用一个寄存器来保存第一个值的地址，然后使用间接模式告诉计算机从寄存器中存储的地址加载值。然后，我们可以将寄存器中的值加一，使其指向内存中的下一个位置。\n\
  \n那么现在，让我们使用图 5-2 中的步骤进行模拟。与我们在上一个程序中逐步执行每个步骤不同，我假设你现在知道如何操作这些步骤。每个段落都是八个步骤的全部内容。我将重点放在每条指令的含义上，而不是执行它的所有步骤。执行步骤是你的工作，但一定要\
  \ *按正确的顺序* 完成所有步骤。另外，为了使发生的事情更容易理解，我们将在进行过程中为我们的寄存器命名，以便我们知道它们在做什么。计算机不使用这个——这完全是为了我们自己的目的，以便我们知道每个寄存器的用途。\n\
  \n第一条指令是 `20, 0, 0`。这表示用数字 0 加载寄存器 0。寄存器 0 将保存所有数字的和。你可以继续将寄存器 0 标记为“sum”，以便记住它的用途。记住，计算机不关心它是做什么用的——计算机只做你告诉它的事情。但是\
  \ *你* 需要记住它的用途，这样你才能理解这个程序。\n\n下一条指令是 `20, 3, 255`。这表示用数字 255 加载寄存器 3。这是我们的哨兵值，将用于比较。你可以用单词“sentinel”来标记寄存器\
  \ 3。\n\n\n\n下一条指令是`20, 1, 57`，这条指令将数字 57 加载到寄存器 1 中。这是我们开始读取数值的位置起点。请注意，我们是将数字 57\
  \ 存入寄存器 1，而不是内存地址 57 的内容。那将是后续步骤。将寄存器 1 标记为“指针”（`pointer`），因为它将指向我们要读取数值的内存位置。\n\
  \n下一条指令是`20, 5, 1`，这条指令将数字 1 加载到寄存器 5 中。这是我们将用于递增内存位置指针的数字。将寄存器 5 标记为“递增”（`increment`）。\n\
  \n请注意当前指令指针的位置，它应位于 12。之前的所有指令都是“设置”指令，旨在为流程启动做准备。下一条指令将真正启动处理过程。你应该将内存位置 12 标记为“主进程开始”（`main\
  \ process start`），以提醒自己这是核心处理过程发生的地方。\n\n位于内存位置 12 的指令是`23, 2, 1`。这条指令要求查看寄存器 1\
  \ 中的值，并将该值作为要去查找的内存位置。目前，寄存器 1 中的值是 57。因此，查看内存位置 57，并将该值放入寄存器 2。将寄存器 2 标记为“当前值”（`current\
  \ value`），它此时应包含值 10。\n\n回想一下我们要实现的目标，接下来需要判断当前值是否是我们的哨兵值。因此，我们必须将当前值（寄存器 2）与哨兵值（寄存器\
  \ 3）进行比较。然而，由于在这种机器语言中，比较操作会用比较结果覆盖其中一个被比较的值（请参考表格中的比较指令），我们必须先将其中一个值复制到一个新寄存器中，以免它被破坏。因此，下一条指令是`21,\
  \ 4, 3`，这条指令将寄存器 3（哨兵值）的内容复制到寄存器 4。将寄存器 4 标记为“哨兵比较”（`sentinel comparison`），它此时应包含值\
  \ 255。\n\n下一条指令是`37, 4, 2`。查阅该指令可知，它用于比较寄存器 2（当前值）与寄存器 4 中的值。如果两者相等，则将数字 0 存入寄存器\
  \ 4。如果寄存器 2 中的值大于寄存器 4 中的值，则将数字 2 存入寄存器 4。最后，如果寄存器 4 中的值大于寄存器 2 中的值，则将数字 1 存入寄存器\
  \ 4。这样一来，比较结束后，寄存器 4 将包含当前值与哨兵值比较的结果。由于寄存器 4 的值为 255，寄存器 2 的值为 10，寄存器 4 中的值将被擦除，并在其位置写入数字\
  \ 1，因为 255 大于 10。\n\n现在我们已经完成了比较，下一步该做什么？下一条指令是`65, 33, 4`。这条指令要求查看寄存器 4：如果值为 0，则将指令指针改为\
  \ 33；否则，不做任何操作。这是一个条件跳转指令。基本上，它表示如果之前对当前值与哨兵值的比较显示它们相等（结果为 0），则跳转到程序的结尾（位于内存位置 33）。由于寄存器\
  \ 4 包含 1，条件不触发，我们像往常一样继续执行下一条指令。\n\n下一条指令是`133, 0, 2`。这条指令将寄存器 2（当前值）的内容加到寄存器 0（当前总和）上，并将结果存入寄存器\
  \ 2。由于寄存器 0 当前为 0，现在它应该是 10 + 0，即 10。\n\n现在我们需要对下一个值执行相同的操作。但我们如何获取下一个值呢？由于寄存器 1\
  \ 保存着指向下一个值的指针，我们只需将寄存器 1 增加 1，而这个增量值存储在寄存器 5（递增）中。下一条指令是`133, 1, 5`，这条指令将寄存器 5（递增）的内容加到寄存器\
  \ 1（指针）上，并将结果存入寄存器 1。\n\n现在我们已经准备好对下一个值执行相同的计算。我们只需要跳回到代码中的正确位置，以便重复整个过程。下一条指令是`64,\
  \ 12, 0`。指令 64 是“无条件分支”。这意味着我们直接修改指令指针为 12。因此，下一条指令执行时，你将回到内存位置 12 以获取下一条指令。我们之前将这个位置标记为“主进程开始”（`main\
  \ process start`）。将当前内存位置（30）标记为“主进程结束”（`main process end`）。\n\n![](img/531249_1_En_5_Fig6_HTML.png)\n\
  \n一段 7 行的代码：`var addNumbers = function(numList) {`，`var sum = 0;`，`for` 循环，`sum\
  \ = sum + numList[i];`。\n\n**图 5-6**  \n在 JavaScript 中计算一组数字的和\n\n现在，我不打算逐一带你走完所有后续步骤，因为你将反复经历相同的步骤。不过，请思考一下当你从内存中加载值\
  \ 255 时会发生什么？此时，之前的比较操作会发现寄存器 4（哨兵比较）中的值与寄存器 2（当前值）中的值相等，因此会将值 0 存入寄存器 4。然后，下一条“如果为零则跳转”（`Jump\
  \ if Zero`）指令将真正生效——寄存器 4 中的值为 0，因此我们会将指令指针修改为指令中指定的位置（即 33）。\n\n此时，我们将加载内存位置 33\
  \ 处的指令`25, 56, 0`。这条指令将寄存器 0（当前总和，此时已是最终总和）的值存入内存位置 56。内存位置 56 现在应包含相关数值的总和（即 25）。\n\
  \n下一条指令是`0, 0, 0`，这条指令通知模拟器停止。现在我们已经完成，内存位置 56 保存着内存位置 57、58 和 59 中数值的总和。\n\n和之前一样，这在\
  \ JavaScript 中要简单得多。在 JavaScript 中，类似的函数如图 5-6 所示。\n\n同样，我不期望你现在就理解它的含义，但你至少应该认识到，这比编写一堆机器语言指令的数字要容易得多！\n\
  \n希望这个练习能帮助你理解计算机执行处理时的精确性，以及对程序员准确性的要求。如果计算机程序的指令中哪怕有一条写错了，整个程序都会失败。虽然你很可能不会再需要这样做，但目标是让你的思维方式与计算机的思维方式保持一致。这将使你在未来思考编程问题时变得更容易。\n\
  \n如果你喜欢这个过程，附录 E 中还提供了其他一些机器语言程序的示例。\n\n\n\n### 5.5 机器操作码表\n\n本节列出了本章模拟机器所使用的不同机器操作码。操作码按类别排序，而非按编号排序，但由于总数不超过\
  \ 20 个，这不会造成太大不便。虽然我们不会使用所有列出的操作码，但为了完整性和附录 E 中的示例，仍将它们全部列出。\n\n每个操作码都附带了其所使用的操作数类型。操作数是用于处理指令的值列表。例如，对于`add`指令，操作数将是指存放待相加数值的位置以及结果应存放的位置。该模拟机器有四种类型的操作数：\n\
  \n-   **立即数操作数**：立即数操作数表示数值本身。也就是说，如果我们要将值`1`加载到某处，我们会使用立即数模式的操作数。\n-   **寄存器操作数**：寄存器是\
  \ ALU 内部的临时存储位置。因此，如果一个操作码使用寄存器操作数，该操作数将指向寄存器编号。\n-   **内存操作数**：内存操作数是一个数字，称为**内存地址**，它指向计算机内存中用于加载或存储值的一个存储位置。\n\
  -   **间接操作数**：间接操作数将寄存器中的值用作该操作数的内存位置。例如，假设一个间接操作数的值为`1`。这意味着要查看寄存器`1`，并将该寄存器中的值用作指令需要操作的内存地址。所以，如果寄存器`1`的值为`35`，那么我们将对内存地址`35`进行读写。\n\
  \n我们要看的第一组指令是加载/存储指令（图 5-7）。这些指令只是在存储位置之间移动数据。它们也最充分地利用了上述不同的操作数类型。\n\n![图 5-7](img/531249_1_En_5_Fig7_HTML.png)\n\
  \n*图 5-7 — 加载/存储指令*\n\n下一组操作码是算术操作码（图 5-8）。这些是通过加、减等操作来修改数值的操作码。在我们的模拟机器中，算术操作码非常少，但大多数真实计算机都有一套相当丰富的算术操作码。尽管如此，即使操作码列表有限，通过一点创意，用它们也能完成很多事情。请注意，比较操作码也包含在此列表中。\n\
  \n![图 5-8](img/531249_1_En_5_Fig8_HTML.png)\n\n*图 5-8 — 算术指令*\n\n最后一组操作码是跳转指令（图\
  \ 5-9）。这些指令会改变指令指针，通常基于某个条件。这些条件被设计为与上面`Compare`操作码（即`37`）的结果相匹配。一种常见的模式是`Compare`指令之后跟上基于比较结果的条件`Jump`指令。本书中我们不使用跳转指令的间接版本，但它们在此列出，是因为它们在所有通用处理器中都是非常强大且重要的功能。\n\
  \n![图 5-9](img/531249_1_En_5_Fig9_HTML.png)\n\n*图 5-9 — 跳转指令*\n\n就是这样！这就是计算机的全部。尽管这可能看起来很令人困惑，但你能在几页纸内写出所有规则，这本身就相当了不起。计算机的本质确实很简单。大多数人感到困惑是因为他们认为计算机很复杂。但实际上，它们只是精确地执行你的指令。精确地执行。\n\
  \n虽然执行这些微小的计算对你来说可能显得很繁琐，但对计算机来说却相当简单。事实上，正是这种简单性使计算机能够快速运行。现代计算机每秒可以执行大约 50 亿条此类指令*。它们必须如此之快才能跟上最新的软件。每当你移动鼠标时，计算机都必须执行与上述非常相似的操作，以重新计算新的鼠标位置并在屏幕上重绘光标。你可能已经注意到，即使每秒有\
  \ 50 亿条指令，有时仍然不够用！\n\n![手型图标](img/531249_1_En_5_Figb_HTML.jpg) **操作码编号**\n\n你可能觉得操作码的编号系统有点奇怪。然而，这个编号系统实际上有一个非常合乎逻辑的顺序，但只有当你把这些数字写成二进制形式时，这个规划才会显现出来。每个操作码都是一个通用指令类型（`load`、`add`、`jump`等）及其所使用操作数类型的组合，每个操作数占用\
  \ 2 位。这在计算机中经常如此——那些看似随意或奇怪的东西，在你了解更多知识后，往往会变得非常有意义。\n\n别担心，我没指望你去逐个将操作码转换成二进制——毕竟，这只是一个帮助你理解这些工作原理的玩具系统。但无论如何，请记住，不仅计算机，整个生活都充满了这样的事物：它们的逻辑可能不会直接显现，但如果你愿意深入挖掘并观察表象之下，这些逻辑是可知的。\n\
  \n### 5.5.1 回顾\n\n在本章中，我们讲解了机器实际工作的原理。我们学到了以下内容：\n\n-   计算机的主要部件是 CPU、计算机内存、输入/输出系统和数据总线。\n\
  -   CPU 的工作方式是逐条获取指令、解码，然后执行指令指定的过程。\n-   CPU 上的每条指令都执行一个非常微小的单一任务。\n-   计算机只能精确执行你告诉它的指令。\n\
  -   程序的所有步骤都必须精确指定，计算机才能正确执行。\n\n### 5.5.2 学以致用\n\n1.  思考一下，如果程序中某条指令被更改，会发生什么？一条缺失或有缺陷的指令会如何影响结果？\n\
  2.  你是否注意到代码和数据都存放在同一内存中？通过将所有内容存储为数字，代码和数据可以使用同一系统进行存储。如果你意外地用数据值覆盖了一条指令，可能会遇到什么问题？\n\
  3.  从附录 E 中选择一个程序，看看你是否能成功运行它。\n4.  你如何修改本章中的第一个程序，使其乘以`3`而不是`2`？\n\n"
- '# 第二部分：Web 编程的基本要素


  Web 编程的基本要素


  JavaScript 主要是一种用于增强网站交互性的语言。本部分介绍构成网页运行基础的技术——HTML、CSS 和 JavaScript。本部分不会深入探讨这些主题的任何细节，但会提供足够的背景知识，帮助你理解它们如何协同工作来创建一个网页。




  '
- "# 6. HTML 文件格式\n\n在第 4 章中，我们了解了计算机如何格式化数据。在本章中，我们将探讨互联网上用于显示网页的数据格式。这种格式就是 HTML——超文本标记语言。本书并非\
  \ HTML 专著，但若要真正理解 JavaScript 的工作原理，掌握 HTML 是必要的。本章对 HTML 的介绍不会过于深入，但足以让你对 HTML 的运作机制有一个功能性的理解。\n\
  \n## 6.1 HTML 快速入门\n\nHTML 具有许多使其广受欢迎的特性，并已成为网络官方格式。首先，它是一种超文本格式。这意味着每个文件都包含指向互联网上其他文件的**超链接**（或简称为**链接**）。正是这一点实现了互联网上的网状结构。每个文档（即网页）都包含许多指向其他网页的链接，而这些网页本身又包含指向更多网页的链接。因此，这种文件格式遵循了网络的基本理念——信息相互关联，如果我们想进一步了解某件事，只需点击链接即可。\n\
  \nHTML 的另一个重要特性是它是一种**标记语言**。“标记语言”一词源于手稿在计算机出现之前的编辑和排版方式。手写与制作印刷书籍略有不同。制作书籍时，你需要知道文本使用什么字体、字母多大、是否要加粗等等。打字机和手写材料无法向印刷厂传达这些信息。因此，作者在写书时，会用注释“标记”稿件，告知印刷厂如何呈现最终文本效果。\n\
  \n![](img/531249_1_En_6_Fig1_HTML.png)\n\n一个文本文档有作者为 3 行和 1 个段落做的 4 处标记。文字为：Time\
  \ 18 B F center, Helv 12 F R, C T Helv 14 B F, 以及 Helv 12。\n\n图 6-1\n\n作者为印刷厂标记文档的示例\n\
  \n图 6-1 展示了标记过的文档是什么样子。由于手稿是手写或使用打字机完成的，作者无法以想要的字体输入文档，因此他们插入这些标记注释来告知印刷厂该怎么做。“Helv\
  \ 12”告诉印刷厂将字体设为 12 点 Helvetica；“BF”表示使用粗体字；“FR”表示将文本右对齐。这类指令精确地告诉印刷厂如何排版每段文本。有时这可能会很繁琐，因此另一种做法是，给印刷厂的指令告诉他们文本具有什么*功能*，然后再用单独的页面说明如何排版该功能。在此例中，“CT”告诉印刷厂标记文本是章节标题，因此印刷厂也知道将该标题放入每页顶部的页眉中。有时标记会精确告诉印刷厂该做什么（例如，“Helv\
  \ 12”表示使用 12 点 Helvetica 字体），有时标记则会告诉印刷厂文本在文档中的功能（例如，“CT”告诉印刷厂该文本是章节标题）。如果作者指定了文本的功能，他们还会提供单独的页面，告知印刷厂每种文本片段应如何处理。这种将文档的结构和功能与其显示方式分离的思想，我们将在第\
  \ 7 章再次探讨。\n\n![](img/531249_1_En_6_Fig2_HTML.png)\n\n一个 HTML 文档包含一个带有标题的头部区域、一个带有主标题和子标题的主体区域，以及一个页脚区域。\n\
  \n图 6-2\n\n一个简单的 HTML 文档\n\nHTML 是一个极其相似的概念。它是一种标记语言，意味着它由文本以及告知计算机如何解释这些文本的附加文本组成。图\
  \ 6-2 展示了一小段 HTML，让你感受一下这种语言。\n\n如你所见，HTML 文档主要由文本组成，并在文本周围编写了附加代码，以告知计算机该文本应起什么作用。用\
  \ HTML 的行话来说，这些代码被称为**标签**。`<p>` 是一个**开始标签**，它告诉计算机将该段文本视为一个段落；`</p>` 是一个**结束标签**，它告诉计算机这是该段落的结束。类似地，`<h1>`\
  \ 告诉计算机将该文本视为一个大标题（即一级标题），`</h1>` 告诉计算机这是这个大标题的结束。HTML 有一套预定义的标签可供你用来构建文档。通过在文本文件中排列文本和标签，你可以轻松构建自己的网页！\n\
  \n![](img/531249_1_En_6_Figa_HTML.jpg) 一只手形图标，食指指向右侧方向。动手实践\n\n1.  打开你的文本编辑器，将图\
  \ 6-2 中所示的 HTML 文档输入到一个新文件中。\n\n2.  保存文件，使其扩展名为 `.html`。\n\n3.  打开你的浏览器。不要输入 URL，而是转到“文件”菜单并选择“打开”。打开你刚刚保存的文件。\n\
  \n4.  观察浏览器如何显示每个被标签标记的文本块。\n\n5.  同时观察浏览器的地址栏。如果它显示了协议，请注意它*不是* HTTP URL，而是 `file:`\
  \ URL。这是因为它是从你的硬盘驱动器获取文件，而不是从网络服务器。\n\n6.  返回你的文本编辑器，添加一个新标题和一段新文本，然后保存文件。\n\n7.\
  \  点击浏览器上的刷新按钮查看你的更改。\n\n8.  在单词之间以及标签前后添加额外的空格。保存文件并重新加载浏览器。有什么变化吗？除了分隔单词外，空白（称为**空白字符**）在\
  \ HTML 中是不起作用的。如果你需要调整间距，必须使用标签来告诉计算机你想要做什么。\n\n\n\n## 6.2 HTML 文档的组成部分\n\n现在你已经了解了\
  \ HTML 文档的样貌，是时候深入探究其格式了。首先需要了解的是标签的基本规则。这些规则很重要，请特别留意。\n\n1.  所有标签都由尖括号（即 `<` 和\
  \ `>`）括起来。\n\n2.  几乎所有标签都有起始标签和结束标签。对于段落标签而言，起始标签是 `<p>`，结束标签是 `</p>`。它们之间唯一的区别在于结束标签在标签名前有一个正斜杠（`/`）。如果你忘记了结束标签，许多浏览器不会报错，但你可能会得到奇怪的结果。\n\
  \n3.  成对的起始标签和结束标签必须完整地包含在其他成对的起始标签和结束标签之内。例如，`<p>hello <i>there</p></i>` 是不允许的，但\
  \ `<p>hello <i>there</i></p>` 是允许的。在第一个（错误的）例子中，`<p>` 标签起始于 `<i>` 标签**之前**，但结束标签\
  \ `</p>` 却出现在结束标签 `</i>` 之前。因此，`<i> </i>` 这对标签并未完整地包含在 `<p> </p>` 这对标签之内。\n\n4.\
  \  对于少数没有结束标签的标签，你可以将起始标签和结束标签合并在一起。`<br/>` 没有结束标签，因此它被写成 `<br />`。这被称为自闭合标签。\n\n\
  5.  起始标签、结束标签以及它们所包含的内容和标签的组合称为一个**元素**。`<p>` 是一个标签，但 `<p>hello</p>` 是一个元素。\n\n\
  6.  空白（称为空白符）用于分隔单词，但别无他用。HTML 会忽略单词之前、之间和之后的所有额外空格。这包括换行符和用于对齐的空格。所有这些都由标签控制，而不是由你手动添加空格来完成。\n\
  \n从现在开始，我将仅用起始标签来指代标签。除非我们明确说明，否则你应始终假定起始标签需要对应的结束标签。\n\n现在，你可能已经注意到，在我们原始的 HTML\
  \ 示例中，有几个标签似乎没有起到任何作用——即 `<html>`、`<head>` 和 `<body>`。`<html>` 标签被称为文档根标签。它是包含所有其他标签的标签，并且是必须存在的。在本书中，如果你看到某个示例没有\
  \ `<html>` 标签，那它只是展示了文档的一个片段——其余部分默认为存在，但我们只展示重要部分以使示例更清晰。每个文档的第一个标签都应该是 `<html>`\
  \ 标签，并且每个文档都应以 `</html>` 结束标签结尾。`<head>` 标签包含用于告知浏览器**关于**文档的信息的标签，但这些信息不会在文档本身中显示。在给出的示例中，`<head>`\
  \ 标签包含一个 `<title>` 标签，该标签告知浏览器文档的标题。浏览器通常会在窗口顶部显示此标题，并且在你将该页面加入书签时也会用到它。`<body>`\
  \ 标签告知浏览器，我们开始进入文档中应被显示的部分。\n\n你将在大多数 HTML 文档中遇到的一些基本标签包括：\n\n*   `<html>` – 这是文档中所有其他标签的主要容器。\n\
  *   `<head>` – 此标签包含向浏览器提供**关于**页面的信息（而非页面内容本身）的标签。\n*   `<title>` – 此标签告知浏览器你页面的标题。\n\
  *   `<body>` – 此标签包含实际的页面内容。\n*   `<h1>` – 此标签用于页面中最大的标题。\n*   `<h2>` – 此标签用于页面中的副标题。HTML\
  \ 还有更小尺寸的副标题，直至 `<h6>`。\n*   `<p>` – 这是段落标签。浏览器通常会在任意两个段落之间添加一个空行。\n*   `<br/>`\
  \ – 这是一个换行符。此标签是自闭合的，用于在文档中的任何位置强制换行。\n*   `<b>` – 此标签告知浏览器使用粗体字体。\n*   `<i>` –\
  \ 此标签告知浏览器使用斜体字体。\n*   `<u>` – 此标签告知浏览器为其内容添加下划线。\n*   `<div>` – 这是一个通用标签，用于将内容块分组在一起。\n\
  *   `<span>` – 这是一个通用标签，用于将段落或其他文本块中的字母或单词分组在一起。\n\n另外，请注意我们以 `<!DOCTYPE html>`\
  \ 开头文件。这被称为**文档类型声明**，它告知浏览器，没错，这确实是一个 HTML 文档。\n\n**练习题**\n\n1.  如果 `<h4>` 是起始标签，那么它的结束标签是什么？\n\
  \n2.  以下哪段 HTML 片段使用了无效的标签？为什么？\n    1.  `<h1>My Heading</h1>`\n        `<p>This\
  \ is a <i>great</i> section.`\n        `<b>Don't you think?</b></p>`\n\n    2. \
  \ `<h1>My Heading</h1>`\n        `<p>This is a <i>great</i> section.`\n        `<b>Don't\
  \ you think?</p></b>`\n\n    3.  `<h1>My Heading</h1>`\n        `<p>This is a <i>great</i>\
  \ section.</p>`\n        `<p><b>Don't you think?</b></p>`\n\n3.  打开互联网上的任意一个网页。查看该网页的\
  \ HTML 源代码（有关操作方法，请参见附录 B.4）。尝试从上面的列表中识别出相应的标签。\n\n4.  在之前的练习活动中，你创建了一个 HTML 文件。使用上面列表中的一些标签来修改你的\
  \ HTML 文件。\n\n![一段 div 标签属性的代码。它定义了宽度为 100 的 division，文本内容为“这个块只有 100 像素宽，无论我在里面放多少文字”，以及\
  \ div 的闭合标签。](img/531249_1_En_6_Fig3_HTML.png)\n\n**图 6-3** – 标签属性示例\n\n## 6.3 为标签添加属性\n\
  \nHTML 标签还可以拥有所谓的**属性**。属性用于修改或特化一个 HTML 标签。例如，大多数标签可以接受一个 `width` 属性，该属性告知浏览器标签内容的宽度应该设置成多大。图\
  \ 6-3 展示了一个属性示例。\n\n如你所见，该属性被放置在起始标签**内部**。其格式为 `attribute-name=\"value\"`。该值应始终用引号括起来，不过你可以选择单引号或双引号。^(⁵)\
  \ 引号内允许的值取决于你正在使用的特定标签。你还可以在同一个标签上指定多个属性。如果指定多个属性，只需用空格（**而不是**逗号）分隔它们，并且可以根据需要添加任意数量的属性。\n\
  \n我应该指出，以这种方式设置宽度在 HTML 中实际上是不被提倡的（你将在第 7 章中看到更好的方法）。我在此提到它，仅仅是因为它能以简单的方式说明属性的概念。\n\
  \n\n\n### 6.4 引用其他文档的标签\n\n如前所述，**超文本**的价值之一在于其引用其他文档的能力。HTML 页面引用其他文档，要么是为了将其包含到当前页面中，要么是在用户执行操作时链接到这些文档。你最常见的标签如下：\n\
  \n*   `<img />`——该标签用于在标签放置的位置将图像包含到页面中。`src`属性告诉浏览器在哪里找到图像。注意，`<img />`是一个自闭合标签。使用标签`<img\
  \ src=\"https://placekitten.com/200/300\" />`会将一张猫咪图片放入你的网页中。\n\n*   `<a>`——该标签用于在点击标签内的文本时链接到另一个文档。`href`属性（即超文本引用）告诉浏览器下一步要访问哪个\
  \ URL。使用标签`<a href=\"https://mindmatters.ai/\">点击我</a>`会创建一个指向 MindMatters 新闻网站的链接。\n\
  \n*   `<link />`——该标签用于将样式表连接到你的 HTML 页面。我们将在第 7 章中详细介绍样式表。注意，`<link />`是一个自闭合标签。\n\
  \n*   `<script>`——该标签用于将 JavaScript 程序连接到你的 HTML 页面。我们将在第 8 章开始介绍 JavaScript。\n\n\
  文档中这些标签的几个示例如图 6-4 所示。\n\n![](img/531249_1_En_6_Fig4_HTML.png)\n\n*一个 HTML 文档包含头部部分、带有主标题的主体部分以及页脚部分。主体部分包含一个指向\
  \ MindMatters 网站的链接标签和一个猫咪图片的图像源标签。*\n\n**图 6-4** – 展示引用其他文档标签的示例文档\n\n如本例所示，`<a>`标签创建了一个指向其他文档的链接。要链接的文档放在`href`属性中，而链接文本放在开始和结束标签之间。最后，`<img\
  \ />`标签引用指定 URL 处的图像文件，并将其包含在页面中。\n\n![](img/531249_1_En_6_Figc_HTML.jpg)\n\n*一个手形图标，食指指向右侧方向。*\n\
  \n**练习题**\n\n*   使用本节中的示例文档创建一个新的 HTML 文件。在浏览器中查看它，确保所有内容输入正确。\n*   修改这个 HTML 文件。为你所有喜欢的网络去处添加链接。\n\
  *   在网上找一张你喜欢的图片。找到它的 URL（见附录 B.5）。将那张图片添加到你的网页中。\n\n当一个文档引用另一个文档时，并不总是需要引用目标文档的完整\
  \ URL。此外，如果你需要移动一组文档，修改所有网页中的链接以指向新的 URL 会非常困难。例如，假设你拥有网站`www.example.com`。但随后有人出高价购买这个域名。现在你必须把内容转移到另一个域名下。然而，如果你的所有链接都指向`www.example.com/whatever`，你就必须逐个修改它们以指向新域名！在实际场景中，考虑一下你在构建网站新版本的情况。当你还在构建时，当前网站需要保持原样，所以你把测试版本放在另一个网站上。如果当你迁移时所有链接都能正常工作，那不是很好吗？完整的\
  \ URL 做不到这一点，因为它们指向的是互联网上的精确位置。一旦我们改变位置，URL 就失效了。\n\n为了解决这个问题，URL 可以被重写为相对于当前文档位置的**相对路径**。假设我有一个文件在`www.example.com/fruit/oranges.html`，另一个在`www.example.com/fruit/apples.html`，并且它们相互链接。按照目前展示的方案，第一个文件中的链接应该这样写：\n\
  \n```\n查看苹果\n```\n\n第二个文件中的链接回第一个文件应该这样写：\n\n```\n我更喜欢橙子\n```\n\n这相当繁琐，尤其是当它们位于同一个目录下时（例如`www.example.com/fruit`）。\n\
  \nHTML 标准为我们提供了三种选择。我们一直在使用的常规 URL，也称为**完全限定 URL**或**绝对 URL**，包含了连接所需的所有数据。**相对\
  \ URL**则从*当前*URL 中获取大部分连接信息，出于链接目的，当前 URL 也称为**基础 URL**。因此，在前面的例子中，如果我们已经在查看`www.example.com/fruit/apples.html`，我们可以仅通过引用`oranges.html`来链接到另一个文件，如下所示：\n\
  \n```\n查看橙子页面\n```\n\n这是一个相对 URL，它告诉浏览器在我们当前所在的文件夹中查找，但只需替换 URL 的最后一部分，使其指向这个新文件。使用相对\
  \ URL 不仅减少了输入量，还更容易移动文档组。只要`apples.html`和`oranges.html`保持在同一个目录下，你可以将它们移动到不同的网站或站点内的不同目录，它们的链接仍然有效。简而言之，相对\
  \ URL 使用当前 URL（包括当前目录及之前的部分）作为起点。相对 URL 只是告诉如何*从当前位置*到达文档。你可以通过相对 URL 不包含协议且不以斜杠开头来区分它和完全限定\
  \ URL。\n\n还有其他两种 URL，它们是绝对 URL 和相对 URL 的混合体。第一种是**绝对路径**。绝对路径告诉浏览器使用当前协议和服务器，但将路径完全替换为指定的路径。在我们的例子中，`apples.html`的绝对路径是`/fruit/apples.html`。注意，绝对路径*总是*以斜杠开头。如果它不以斜杠开头，则被认为是相对\
  \ URL。\n\n最后一种 URL 是**网络路径**。这种 URL 使用当前页面的协议，但你需要指定其余所有内容。因此，`oranges.html`的网络路径是`//www.example.com/fruit/oranges.html`。网络路径很少需要用到，但如果看到它们，了解其含义是好的。\n\
  \n![](img/531249_1_En_6_Figd_HTML.jpg)\n\n*一个手形图标，食指指向右侧方向。*\n\n**练习题**\n\n1.  在与你的其他网页相同的目录中，创建另一个简单的网页。\n\
  2.  从你的新页面创建一个链接到你其他页面之一。记得使用相对链接！\n3.  创建另一个链接到互联网上的其他页面。\n4.  保存页面，并在浏览器中打开它。\n\
  5.  测试你的链接。它们起作用了吗？如果没有，请检查浏览器中的 URL，看看浏览器认为你要求它去哪里。\n\n\n\n## 6.5 相对 URL\n\n相对\
  \ URL 拥有许多特性，无论是在构建网站还是在使用本书这样的教材时都非常有用。例如，由于我们创建的文件将存放在你的硬盘上，而不是网络服务器上，因此使用相对 URL\
  \ 比使用指定硬盘上其他文档位置的极长的 `file:` URL 要容易得多。此外，使用相对 URL 意味着，即使你将创建的网页交给老师或家长，它们仍然能够正常工作。如果你使用\
  \ `file:` URL，那么当你的家长或老师在他们的电脑上加载这些 URL 时，所有 URL 都会出错，因为这些文件在他们电脑上的位置与在你电脑上的位置不同。相反，如果你使用相对\
  \ URL，那么只要你将所有文件一起交付，这些 URL 在新位置仍然能正常工作。出于本书的目的，每当你引用自己创建或存储在硬盘上的文件时，都应使用相对 URL；但当你引用存储在网络其他地方的文件时，则应使用绝对\
  \ URL。\n\n相对 URL 的另一个特性是你可以用它们来引用子目录。假设你希望 `www.example.com/fruit/apples.html` 这个页面链接到\
  \ `www.example.com/fruit/exotic/rambutan.html` 文件。你会注意到，它们之间共享了大量的 URL 路径。相对 URL\
  \ 告诉了你如何从当前目录到达目标文档。从 `www.example.com/fruit/` 开始，我只需要说我想去 `exotic/rambutan.html`。因此，我可以像这样链接到这个页面：\n\
  \n```\n<a href=\"exotic/rambutan.html\">红毛丹果实</a>\n```\n\n现在，假设我正在编写关于红毛丹的页面，并且想查看我的苹果页面。使用相对\
  \ URL 该如何实现呢？有一个特殊的目录名用于指代上级目录（也称为父目录）。它用两个点（即 `..`）表示。如果你正在编写页面 `www.example.com/fruit/exotic/rambutan.html`，并且想要链接到\
  \ `www.example.com/fruit/oranges.html`，你可以像这样编写链接：\n\n```\n<a href=\"../oranges.html\"\
  >橙子</a>\n```\n\n你可以在 URL 中包含任意多级目录。例如，如果你正在编写页面 `www.example.com/fruit/exotic/rambutan.html`，并且想链接到页面\
  \ `www.example.com/fruit/poisonous/snowberry.html`，你应该这样写：\n\n```\n<a href=\"../poisonous/snowberry.html\"\
  >雪莓果实</a>\n```\n\n另一个重要的特殊目录名是 `.` 目录。虽然两个点（`..`）指代父目录，但单个点（`.`）指代当前目录。这在 HTML 中很少使用，但你偶尔会见到它。\n\
  \n## 6.6 其他 HTML 特性\n\nHTML 还有许多其他优秀特性。本书的目标是让你掌握足够的 HTML 知识，以便能够入门并理解你在互联网上阅读的关于\
  \ HTML 的内容。有很多标签可以执行各种不同的功能。在本节中，我们将介绍一些更常用的标签和简单特性，但这并非详尽无遗的列表。\n\n### 6.6.1 实体\n\
  \n由于 HTML 使用 `<` 和 `>` 字符来表示给定文本是一个标签，那么你该如何实际编写这些字符呢？HTML 提供了实体（Entities）来指代那些要么在\
  \ HTML 格式中有特殊用途，要么难以键入的字符（例如其他语言的字符）。一个 HTML 实体以和号（`&`）开头，并以分号（`;`）结尾。常见的实体包括：\n\
  \n*   `&gt;` >\n*   `&lt;` <\n*   `&amp;` &\n*   `&quot;` \"\n*   `&apos;` '\n*\
  \   `&nbsp;` 一个“不换行”空格——即在该点不允许换行的空格\n*   `&copy;` ©\n\n### 6.6.2 列表\n\n列表是在 HTML\
  \ 中组织内容的绝佳方式。列表可以是无序的（即项目符号列表），也可以是有序的（即编号列表）。用于包裹整个列表的标签，对于无序列表是 `<ul>`，对于有序列表是\
  \ `<ol>`。然后，无论是哪种列表，每个列表项都包含在 `<li>` 标签中。\n\n图 6-5 展示了一个简短的 HTML 片段，说明了如何使用这些列表。第一个列表将显示为项目符号列表，而第二个列表将显示为编号列表。\n\
  \n### 6.6.3 表格标签\n\n除了段落、标题和列表之外，人们经常需要在网页上呈现数据表格。HTML 拥有一套专门用于显示数据表格的标签。假设我们想制作一个朋友名单，包含他们的姓名、电子邮件和电话号码。我们希望第一行是表头（例如“姓名”、“电子邮件”和“电话”），其他行是数据。为此，我们需要几个标签：\n\
  \n*   `<table>` 此标签包裹整个表格。\n\n```\n<ol>\n  <li>我花园里的植物</li>\n</ol>\n<ul>\n  <li>G.\
  \ K. 我最喜欢的书</li>\n</ul>\n```\n\n*   `<tr>` 此标签包裹一行数据。\n*   `<td>` 此标签包裹单个数据单元格的内容。\n\
  *   `<th>` 此标签与 `<td>` 标签类似，但用于表头（它通常使内容变为粗体）。\n*   `<thead>` 此标签并非严格必需，但通常用于包裹表格表头的一行或多行。\n\
  *   `<tbody>` 此标签也并非严格必需，但通常用于包裹表格中的数据行。\n*   `<tfoot>` 类似于 `<thead>` 标签，但用于表格的页脚。\n\
  \n图 6-6 是一个片段，展示了如何将这些标签组合起来创建一个表格。\n\n```\n<table>\n  <thead>\n    <tr>\n     \
  \ <th>姓名</th>\n      <th>电子邮件</th>\n      <th>电话</th>\n    </tr>\n  </thead>\n \
  \ <tbody>\n    <tr>\n      <td>杰夫</td>\n      <td>jeff@example.com</td>\n      <td>555-555-1234</td>\n\
  \    </tr>\n    <tr>\n      <td>梅丽莎</td>\n      <td>melissa@example.com</td>\n \
  \     <td>555-555-6789</td>\n    </tr>\n  </tbody>\n</table>\n```\n\n| 姓名 | 电子邮件\
  \ | 电话 |\n| --- | --- | --- |\n| 杰夫 | jeff@example.com | 555-555-1234 |\n| 梅丽莎 |\
  \ melissa@example.com | 555-555-6789 |\n\n### 6.6.4 表单标签\n\n许多网页允许你输入数据。用于输入数据的网页通常被称为“表单”。这些标签允许用户输入他们自己的值。在我们知道如何处理它们之前，它们还不会派上用场，但我们会列出其中一些标签以备将来使用。请注意，`<input\
  \ />` 标签实际上可以是几种不同的输入元素。页面上显示的控件元素取决于 `type` 属性。`<input />` 标签也应被编写为自闭合标签。\n\n*\
  \   `<form>` 此标签通常包裹其他表单标签。如果表单需要将数据提交到服务器，该目标地址通常放在 `action` 属性中。\n*   `<input\
  \ type=\"text\" />` 这是一个基本的单行数据输入字段。\n*   `<input type=\"checkbox\" />` 这是一个可以选中或取消选中的单个复选框。\n\
  *   `<textarea>` 这是一个多行数据输入字段。\n*   `<select>` 这是一个下拉列表。每个选项都在此标签内部使用 `<option>`\
  \ 标签指定。\n*   `<button>` 这是一个基本的按钮。其内部包含的文本就是按钮上的文字。\n\n这些标签大多还有一个 `name` 属性，你可以用它来指定该字段的用途（这将在以后变得重要），以及一个\
  \ `value` 属性，用于给字段设置初始值，或者在复选框的情况下，指定该复选框所代表的值。\n\n图 6-7 展示了一个表单的示例 HTML 片段（注意：这实际上并不*执行*任何操作；它只是让用户与之交互而已）。\n\
  \n\n\n### 6.6.5 标准属性\n\n每个 HTML 元素都有几个标准属性。其中对本书较为重要的有三个：`id`、`class` 和 `style`。`id`\
  \ 属性本质上为你的 HTML 元素赋予了一个在文档中唯一的名称。我们可以利用此属性来定位该元素，以便通过 JavaScript 进行处理或设置样式。请注意，如果同一页面中有两个元素具有相同的\
  \ `id` 属性，浏览器并不会报错，但这可能会引发细微的错误。\n\n![](img/531249_1_En_6_Fig7_HTML.png)\n\n一个 HTML\
  \ 代码片段，展示了表单元素列表：用于文本输入的 input 字段、复选框、用于多行输入的文本区域、带有选项列表的 select 标签（用于下拉菜单），以及用于按钮的\
  \ button 标签。\n\n**图 6-7** 表单元素演示\n\n`class` 属性则更偏向于一种临时属性——你基本上可以根据需要随意使用它。通常，它用于将某些项目归为一组，以便赋予它们相似的样式，或者让整个元素组被\
  \ JavaScript 处理。\n\n最后，`style` 属性可用于显式设置元素的样式信息（参见第 7 章）。\n\n### 6.6.6 注释、声明、处理指令和\
  \ CDATA 块\n\n当我们讨论一种语言的结构时，我们谈论的是它的语法。语法规定了哪些类型的字母、符号和特性允许出现在哪些位置。例如，标签是 HTML 语法中不可或缺的一部分。为了很好地理解什么是语法，或许举一个违反语法的例子会有所帮助。我们看到过像\
  \ `<p><i>This is an italicized paragraph</i></p>` 这样的标签，这是完全合法的。但是，想象一下，如果我们不小心输入了\
  \ `<p <i>>` 而不是 `<p><i>`，这就构成了语法错误，意味着我们没有正确遵循 HTML 的结构。\n\n语法之所以重要，是因为计算机正是通过它来理解我们试图做什么。\n\
  \n到目前为止，我们讨论的 HTML 语法的两个主要单元是标签和实体。还有其他一些重要的语法单元需要了解，但它们在本书中很少用到。\n\n一个常见的语法单元是\
  \ HTML 注释。在编写任何类型的代码时，大多数编程语言和标记语言都允许开发者为其代码添加注释。注释是程序员为自己或任何其他查看代码的开发者所写的笔记。它大致表述为“我这样做是因为用其他方法遇到了困难”或“代码如此编写的原因”。它包含了一些查看代码时不易立即察觉的重要信息，但浏览器会忽略这些信息。\n\
  \n在 HTML 中，与大多数其他计算机语言一样，注释本质上会被浏览器忽略。这一特性使得注释有了另一个用途——临时禁用代码的某些部分。假设你构建了一个大型网页，并且想看看在没有一大段代码的情况下页面是什么样子。与其删除那段代码之后再重新输入，不如将其包裹在注释中，这样浏览器就会忽略它。这被称为*注释掉*代码，因为你通过使用注释将代码从文档或程序中移除了。\n\
  \n那么注释长什么样呢？注释很简单。它们以 `<!--` 开头，以 `-->` 结尾。以下是一个包含几个注释的简短 HTML 片段：\n\n```\n带注释的网页\n\
  \n这是一个列表项\n这个列表项不可见，因为它已被注释掉\n-->\n另一个列表项\n```\n\nHTML 的另一个特性是声明。声明用于标识并可能扩展有效标签、属性和实体的列表。通常，你唯一会看到的声明是\
  \ HTML *文档类型*声明，它告诉计算机你正在处理的文档的基本类型，以便其知道哪些标签是有效的以及它们的含义。HTML 文档类型声明告诉计算机：没错，你确实正在查看一个\
  \ HTML 文档。其基本形式如下：`<!DOCTYPE html>`。它总是被放置在第一个 `<html>` 标签*之前*。还有其他更花哨的写法，但其含义基本相同——是的，计算机，你正在查看一个\
  \ HTML 文档。\n\n另一个特性是处理指令。这些指令用于向文档处理器（如浏览器）提供关于如何处理文档的特殊信息。然而，除了极少数处理指令外，这个特性几乎完全未被使用。处理指令看起来像一个开始标签并且可以包含属性，但在处理指令名称之前和右尖括号之前都有一个问号，如下所示：\n\
  \n```\n<?指令名称和属性?>\n```\n\n你唯一可能看到的处理指令是下面这个，被称为 XML 声明：\n\n```\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n```\n\n\n\n```html\n如果使用了此标记，它必须位于文档的开头、`<!DOCTYPE>`\
  \ 声明之前，甚至在任何空行或空白字符之前。它告知浏览器在处理 HTML 文档时使用特殊的、更严格的规则。例如，如果不使用此标记，浏览器对于 HTML 标准的小违规行为会更加宽容。\n\
  \n另一个偶尔会看到的特性是 CDATA 区段。当需要在文档中写入大量尖括号，但又不想为每个尖括号都编写实体时，通常会使用 CDATA 区段。CDATA 区段告知浏览器将文本视为纯文本，不要尝试查找标签、注释或实体。CDATA\
  \ 区段以 `<![CDATA[` 开头，以 `]]>` 结尾。\n\n图 6-8 展示了一个简短示例。\n\n许多浏览器并非在所有情况下都完全支持 CDATA\
  \ 区段，因此最好避免使用它，但了解什么是 CDATA 区段是好的，以防万一遇到。\n\n![](img/531249_1_En_6_Fig8_HTML.png)\n\
  \n一个 HTML 的 CDATA 代码以小于号、感叹号、左方括号、`CDATA`、左方括号开头，并以两个右方括号和一个大于号结尾。\n\n**图 6-8**\
  \ 一个 CDATA 示例\n\n### 6.6.7 回顾\n\n在本章中，我们介绍了 HTML 的基础知识，它是什么，以及如何编写它。我们学习了以下内容：\n\
  \n*   标记语言是一种文本文档，它使用标签（同样是文本）来指定文档不同部分的结构和功能。\n*   HTML 是互联网上用于网页的标记语言。\n*   在\
  \ HTML 中，空格本质上被忽略——取而代之的是使用标签来标记段落和换行的位置。\n*   URL 指定了互联网上文档的位置。\n*   一个 HTML 文档可以使用\
  \ URL 引用互联网上的另一个文档。\n*   可以使用相对 URL 来引用同一网站上的其他相关文件。\n*   只要文件被一起移动，相对 URL 可以轻松地保持文档链接的可用性。\n\
  *   HTML 有许多适用于各种不同情况的标签。\n*   标签可以拥有属性，属性进一步特化了它们的功能。\n*   `id`、`class` 和 `style`\
  \ 属性可以应用于任何标签。\n\n### 6.6.8 应用你所学到的知识\n\n1.  创建一个新的 HTML 文件。在同一目录下放置一张图片（扩展名为 `.jpg`\
  \ 或 `.png`）。你能想出如何使用相对 URL 编写 `<img />` 标签来将图片包含到你的网页中吗？\n2.  创建一系列三个相互关联且主题相同的网页。在网页顶部放置指向组内其他每个页面的链接。进行测试，确保你能够在浏览器中导航它们。\n\
  3.  浏览本章的标签列表。修改你的页面，使每个页面都有一个或多个标题，并且你的页面序列至少包含一个表格、一个列表和一个实体。\n4.  访问几个你最喜欢的网站，并查看该网站几个页面的\
  \ HTML（参见附录 B.4）。识别出你认识的标签和你不知道的标签。在互联网上查找至少两个你不熟悉的标签。当前版本 HTML 的官方标签列表可在 [`www.w3.org/TR/html-markup/elements.html`](http://www.w3.org/TR/html-markup/elements.html)\
  \ 找到。\n5.  当浏览不同网站时，留意它们的组织方式和布局。哪些类型的内容是所有网站共有的？是否有常见的布局方式？网页本身的基本结构及其在网站上的组织被称为网站的**信息架构**，也称为\
  \ IA。你能勾勒出网页的基本布局——他们把菜单放在哪里，把图片放在哪里，把内容放在哪里等吗？你能画出一个你在网站上从一个页面导航到另一个页面的地图吗？\n\n\
  ---\n\n# 脚注\n\n---\n\n<br>\n\n# 7. 层叠样式表入门\n\n## 7.1 层叠样式表的起源\n\n当 HTML 最初被开发时，它完全用于传递信息。HTML\
  \ 最初被构建为一种浏览和查看文档的简单方式。因此，HTML 文档从不美观，但非常实用。此外，所使用的标签与标签所标记文本在文档中的目的之间存在直接对应关系。例如，`<h1>`\
  \ 标签意味着给定的文本是一个主标题。如果你查看 HTML 代码本身，你会发现带有该标签的文本，从而确切地知道它的含义。事实上，如果你认识这些标签，你几乎可以像在浏览器中阅读渲染后的文档一样轻松地阅读带有标签的文档源码。\n\
  \n然而，随着越来越多的人开始使用 Web，HTML 开始服务于除了纯粹信息性目的之外的更多用途。现代 Web 更加以用户为中心，并融合了许多其他类型的媒体和功能，包括导航、娱乐、广告和品牌塑造。在早期，为了适应这些新用途，HTML\
  \ 的标签和属性集不断扩展。然而，问题在于 HTML 最初的美感和简洁性丢失了。网页变成了由难以辨认的标签组成的复杂混乱体。此外，不同的浏览器对标签的渲染方式略有不同。因此，要编写一个网页，你不仅需要知道每个标签*做什么*，还需要知道该标签在每个浏览器中*看起来*是什么样子，以及如何让它们协同工作以产生一个好看的网页。\n\
  \n控制 Web 标准的组织认识到了这个问题，并决定让 HTML 回归其本源。为了实现这一点，他们试图将**内容**与**表现**分开。内容指的是网页旨在传达的数据。表现指的是该页面在用户眼中看起来的样子。标题、段落、图表等都属于内容。背景、格式、布局、颜色、字体和装饰都属于表现。\n\
  \n为此，他们从 HTML 中移除了样式，并创建了一种新的语言，称为**层叠样式表**（简称 CSS），来告诉浏览器 HTML 应该看起来如何。在这个新范式下，文档的结构和内容由\
  \ HTML 编写。这些内容应该如何布局、格式化和呈现，则由 CSS 编写。用户与内容之间的高级交互由 JavaScript 编写。这种分离并不完美，但这是一个巨大的改进。\n\
  \n> 一个手形图标，其食指指向右侧。技术的演进。\n\n\n\n## 技术演进与 CSS 基础\n\n### 技术演进中的重构\n\n有趣的是，我们可以观察到技术演进的方式。`HTML`的演进过程与许多其他技术非常相似。第一个版本非常简洁直接，很好地满足了用户的需求。\n\
  \n然而，它的成功也带来了许多问题。因为每个人都在使用它，新的用户（有着与原始用户不同的需求）也开始使用它。为了适应这种情况，开发者们简单地向`HTML`添加了大量功能。但很快人们发现，简单地添加功能只会让事情变得混乱。虽然这扩展了`HTML`的能力，但代价是让所有`HTML`工作变得更加复杂（且昂贵）。\n\
  \n`HTML`演进的下一步是重新评估`HTML`工作的不同方面以及它们所服务的不同需求。事实证明，有几个需求是明显不同的：处理内容的需求、以视觉愉悦的方式展示内容的需求，以及使内容具有交互性的需求。\n\
  \n因为这些需求是可以区分的，它们被**重构**为完全独立的组成部分。`HTML`负责内容，`CSS`负责呈现，而`JavaScript`负责交互。`HTML`是一种优秀的内容语言，但并不是好的样式语言。因此，这种新的架构让`HTML`能够专注于它最擅长的领域，而将样式和交互留给更适合这些任务的其他技术。\n\
  \n重构在技术演进中是一种常见的现象。单词\"refactoring\"（重构）基于数学中的\"factoring\"（因式分解）概念。在数学中，因式分解指的是将一个数字分解为其质因数。数字`15`的质因数是`5`和`3`。在技术领域，重构也是类似的：重新评估已有的技术，寻找更基础的、可以将技术划分而成的组件。这通常发生在技术的发展导致其变得过于复杂时。此时，就需要重新评估，看看是否存在技术可以划分成的*更简单*的组件。\n\
  \n重构并非万能药，必须谨慎使用。如果过早进行重构，可能无法清晰看到所有不同的组件，并且可能会以让进展变得更加困难而非更容易的方式进行重构。不过，在大多数情况下，重构往往能给旧技术带来新的活力，因为它同时提高了灵活性和可理解性。\n\
  \n### CSS 文档的结构\n\n理解`CSS`基本操作的最佳方式是亲自实践。首先，创建一个名为`basic.css`的文件，内容如图 7-1 所示（和往常一样，请确保*完全*按照所示内容输入）。\n\
  \n这个文档表达的意思是：\n\n- 所有`<h1>`标签内的文本应显示为蓝色、20 点字号的字体（**点**是排版中的度量单位——1 点等于 1/72 英寸）。\n\
  - 所有`<p>`标签内的文本应显示为黑色、12 点字号的字体。\n\n现在，在与`basic.css`相同的目录下创建一个名为`basic.html`的文件，内容如图\
  \ 7-2 所示。\n\n将这两个文件关联起来的部分是`<link>`标签。`<link>`标签可以用于指定各种相关的文档（其链接的内容由`rel`属性指定），但它最重要的用途是指定网页要使用的样式表。`<link>`标签所引用的文档列在`href`属性中。简而言之，上面文档中的`<link>`标签表示使用`basic.css`文件作为其样式表。\n\
  \n![一个 10 行的 CSS 文档，包含标题部分（`<title>`和`<link rel=\"stylesheet\" href=\"basic.css\"\
  >`）、正文部分（包含标题和段落）以及页脚部分。](img/531249_1_En_7_Fig2_HTML.png)\n\n图 7-2 使用 CSS 的网页\n\
  \n![一个 8 行的 CSS 文档，显示了标题的字号 20pt 和颜色蓝色，以及段落的字号 12pt 和颜色黑色。](img/531249_1_En_7_Fig1_HTML.png)\n\
  \n图 7-1 一个简单的 CSS 文档\n\n如果你用浏览器打开这个文件，你会发现它确实按照我们的指定渲染了文档。如果没有，请回头检查并尝试找出错误（首先，确保两个文件在同一个目录下）。\n\
  \n`CSS`文件格式相当简单明了。它由两个主要部分组成：选择器和属性。`CSS`属性列出要使用的样式，而`CSS`选择器则告诉这些样式要应用于哪些`HTML`元素。所以，在我们查看的文件中，`h1`和`p`就是选择器。选择器后面跟着用花括号（`{`和`}`）包裹的属性列表，属性列表说明了要在文本上使用哪些样式。\n\
  \n我们在图 7-1 中使用的两个属性是`color`（定义文本的颜色）和`font-size`（定义文本使用的字号）。`CSS2`定义了 98 个可供使用的属性，而`CSS3`定义了更多。不过，入门所需的属性并不多。本章将只介绍最重要的属性，但你可以在[`www.w3schools.com/cssref/`](http://www.w3schools.com/cssref/)上看到相当全面的`CSS`属性列表。\n\
  \n### 理解选择器\n\n上一节中使用的`CSS`选择器列出了要设置样式的标签名称。然而，这样的选择器用途有限，无法提供我们制作真正优秀文档所需的灵活性。\n\
  \n假设你有不同类型的段落想要以不同的方式进行布局。你希望一个段落是蓝色背景上的红色文本，另一个段落是黑色背景上的绿色文本。为了实现这一点，`CSS`文件必须能够区分这两种不同类型的段落，但`HTML`只提供了一种段落标签（`<p>`）。为了实现这一目标，`CSS`也可以使用属性来选择一组属性应用于哪些标签。为了促进这一过程，`HTML`定义了一个`class`属性，该属性适用于*所有*`HTML`标签，可以用于编写者想要的任何目的。通常，它们用于区分标签，以便`CSS`进行处理。\n\
  \n![一个 17 行的 HTML 代码，包含标题、正文和页脚部分。正文部分有两个不同的类名（sections 1 和 2），使用`<div>`标签包含标题和段落。](img/531249_1_En_7_Fig3_HTML.png)\n\
  \n图 7-3 使用类的 HTML 文件\n\n让我们看看这是如何工作的。创建图 7-3 所示的 HTML 文件，并将其命名为`classes.html`：\n\
  \n这个文档使用`<div>`标签将文档分为两个部分，每个部分都有一个标题和一个或多个段落。这些部分通过`class`属性相互区分。在第一个部分中，段落之间也通过相同的方式区分。\n\
  \n`CSS`允许我们使用`HTML`属性为同一个标签的不同用途提供特定的样式。\n\n为了看到实际效果，在与上一个文件相同的目录下创建一个名为`classes.css`的文件，内容如图\
  \ 7-4 所示。输入完`HTML`和`CSS`文件后，打开`classes.html`文件，看看结果是什么样子。\n\n![一个 12 行的 CSS 代码程序，显示了为类样式\
  \ 1 和 2 要使用的字号、颜色和背景颜色。](img/531249_1_En_7_Fig4_HTML.png)\n\n图 7-4 为类设置样式的 CSS 文件\n\
  \n\n\n现在让我们看看图 7-4 中指定的样式如何在 HTML 上生效。第一个选择器与之前一样——它由一个标签名及其后的样式属性组成。它规定段落标签的字体大小应为十磅。\n\
  \n然而，下一个选择器则不同。这个选择器写的是 `p[class=style1]`，这意味着它*仅*适用于那些 `class` 属性值为 `style1` 的\
  \ `<p>` 标签。其属性表明，带有 `style1` 类的段落应为蓝底红字。请注意，带有 `style1` 类的 `<p>` 标签也*会*匹配第一个选择器，因为第一个选择器适用于*所有*\
  \ `<p>` 标签。因此，原始选择器中设置的任何属性仍然会被应用，所以它同样会使用十磅字体。\n\n最后一个选择器与前一个类似，区别在于它被设置为匹配带有 `style1`\
  \ 类的段落。它将以黑底绿字显示该段落，并将字体大小设置为 12 磅。这与第一组 CSS 属性中设置的、将所有 `<p>` 标签字号设为十磅的设置存在冲突。然而，*由于这些属性的选择器更具体*，它的属性会取代更通用选择器中的属性。\n\
  \n```\n一个 12 行的 CSS 代码程序，展示了带有 class 样式 1 和 2 的三个段落的字号、颜色和背景色。\n```\n\n**图 7-5**\
  \ 使用简化类表示法的 CSS 文件\n\n你可以通过任意属性选择 HTML 元素。不过，通过 `class` 属性进行选择非常常见。事实上，它如此常见，以至于有了一种专门的简化表示法来按类选择。对于选择器，我无需写成\
  \ `p[class=style1]`，而可以简写为 `p.style1`。因此，如果我使用这种简化表示法重写我的 `classes.css` 文件，它将如图\
  \ 7-5 所示。这不仅更容易编写，也更容易阅读！\n\nCSS 提供了丰富的选择器，让你能够以非常动态的方式为文档设置样式。你可以拥有表示其他标签内部标签、前面有其他标签的标签，以及多种其他选择\
  \ HTML 元素进行样式设置的方式。然而，本书仅涵盖理解如何编写网页程序所需的最基本的 CSS 元素，因此我们不会对 CSS 选择器进行更深入的探讨。\n\n\
  ## 7.4 CSS 盒模型\n\n为了更深入地理解 CSS 样式的工作原理，了解 CSS 如何看待网页上的内容至关重要。这被称为 CSS“盒模型”，因为 CSS\
  \ 从方框的角度来思考网页。CSS 有多种审视内容的方式，但主要有两种——要么作为文本行（称为*内联*样式），要么作为矩形框（称为*块级*样式）。还有其他更专用的结构，例如表格、列表和弹性布局结构，但本章将只关注内联和块级样式。其他样式包含许多复杂性，超出了本书的讨论范围。\n\
  \n我们处理过的大多数标签，如 `<div>`、`<p>`、`<h1>`、`<h2>` 等，默认情况下都是块级样式标签。这意味着在生成内容时，浏览器会将给定元素放入一个矩形框中。除非另有指定，否则该框的宽度将尽可能宽（即其容器的尺寸），高度则足以容纳所有内容。内联标签，如\
  \ `<a>` 和 `<span>` 标签，主要用于段落*内部*的文本。因此，它们并非严格的矩形框，因为文本可能从一行的中间开始，并换行到下一行，从而产生不规则的形状。\n\
  \n所以，块级标签用于设置段落、段落组以及其他块状内容的样式，而内联标签则用于设置段落（或其他块级元素）*内部*文本的样式。你也可以使用 `display` 属性将\
  \ HTML 元素从内联更改为块级，反之亦然。通过使用 `display: block;` 或 `display: inline;` 设置该属性，你可以强制 HTML\
  \ 元素以不同于其默认方式的行为表现。\n\n通用盒模型如图 7-6 所示。块级元素以直接的方式使用盒模型的所有部分，而内联元素由于其内容的不规则形状，有时行为会有点奇怪。\n\
  \nCSS 为块级元素创建的每个框都是一个矩形内容区域，周围环绕着内边距、边框和外边距。它们以如下方式协同工作：\n\n- **内容**是你放在元素内部的 HTML，无论是纯文本、其他标签（甚至可能什么都没有）。\n\
  - **内边距**是紧挨着内容周围的区域（可以分别为每一边设置内边距大小）。\n- **边框**是环绕内边距的一条线（通常是实线）。\n- **背景**（如果已设置）会延伸到内容、内边距和边框的后面。\n\
  \n```\n一个由 4 层同心矩形组成的示意图，分别标注为内容、内边距、边框和外边距。\n```\n\n**图 7-6** CSS 盒模型\n\n- **外边距**是边框外部的区域。然而，外边距略有不同，因为它是一个元素与下一个元素之间的*最小*间距。因此，如果相邻的两个元素都设置了外边距，则只会使用两者中较大的那个外边距（不会将两者相加）。\n\
  \n\n\n## CSS 盒模型\n\n内容区域的大小可通过 `width` 和 `height` 属性手动设置。若未设置宽度，则宽度会被自动调整，使得整个盒模型（包括内容、内边距、边框和外边距）能够适应其包含盒（若无其他包含盒，则适应屏幕）的完整宽度。随后，根据已确定（或手动设置）的宽度，高度会设置为容纳内容所需的任意值。通常你无法看到所有这些部分（尤其是边框），因为它们宽度为零。不过，你可以使用\
  \ CSS 为任意盒模型的这些方面分别设置大小和其他属性。\n\n行内内容因其不规则的形状，可以拥有内边距和边框，但外边距的行为较为特殊。本质上，对于行内元素，顶部和底部的外边距会被忽略，而左右外边距仅在该元素的起始和结束位置生效。然而，如果行内内容跨越多行，左外边距仅在第一行生效，右外边距仅在最后一行生效。\n\
  \n如果回到图 7-3 中的 HTML 代码，我们可以修改 CSS 样式表（`classes.css`）来展示盒模型的工作方式。该 HTML 通过 `<div>`\
  \ 标签分为两个部分。我们将为每个 `<div>` 标签设置边框、背景、内边距和内部宽度。图 7-7 展示了要使用的代码。\n\n这将产生两个大盒子（每个部分对应一个）和几个小盒子。请记住，除非另有约束，盒模型会占据尽可能多的宽度。顶部的盒子占据页面的整个宽度（减去其自身周围的外边距）。该盒子内部的盒子也占据尽可能多的宽度，但它们会受到其外部盒子的外边距、边框和内边距的约束。\n\
  \n![](img/531249_1_En_7_Fig7_HTML.png)\n\n一段 15 行的 CSS 代码包含了第一部分的过程、内边距和外边距细节，以及第二部分的边框、背景、宽度、内边距和外边距。\n\
  \n**图 7-7** 盒模型的 CSS 示例\n\n第二个盒子并未横跨整个屏幕，因为我们将其宽度设置为 `50%`。因此，它仅横跨了页面的一半宽度。同样地，该盒子内部的盒子也受限于此新尺寸。\n\
  \n虽然我们将所有方向上的外边距、内边距和边框都设置为相同值，但我们也可以为不同方向设置不同值。例如，我们可以不直接使用 `padding`，而是分别设置 `padding-right`、`padding-left`、`padding-top`\
  \ 和 `padding-bottom` 为不同的值。\n\n到目前为止，我们已经看到了 CSS 中几种不同的尺寸单位。CSS 提供了多种度量单位，但最常见的是：`pt`（点）、`px`（像素）、`in`（英寸）、`mm`（毫米）以及\
  \ `%`（相对于包含尺寸的百分比）。此外，CSS 还拥有一些相对于当前所选字体大小的单位：`em` 是当前字体中字母“m”的大小，`ex` 是当前字体中字母“x”的大小，`ch`\
  \ 是当前字体中数字“0”的大小。`rem` 则是页面根元素字体大小中字母“m”的大小。`rem` 单位非常流行，因为如果在各处都使用它，只需更改根元素的字体大小，即可自动缩放整个网页。\n\
  \n## CSS 的其他能力\n\n本章内容仅是 CSS 的冰山一角，但希望你已经对其功能和工作原理有了初步的了解。除了目前已讨论的功能外，CSS 还具有以下能力：移动盒子、将数据放入表格、为列表添加编号、生成少量内容、使用图像作为背景、显示和隐藏元素，甚至更多。此外，CSS\
  \ 还可以根据屏幕尺寸调整布局。例如，如果你的页面内容很多，但只在屏幕较小（如手机）时希望显示其中一小部分，CSS 允许你根据屏幕尺寸隐藏或显示不同元素，或为它们应用不同的样式。能够轻松适应各种截然不同屏幕尺寸的设计，通常被称为**响应式**布局。\n\
  \n多年来，人们开发了许多不同的 CSS 扩展，用于实现额外功能，例如动画、部分 3D 操作、渐变背景（一种颜色平滑过渡到另一种颜色）等。这些扩展并非在所有浏览器上都得到支持，但每年都会有更多功能可供开发者使用。\n\
  \n要领略 CSS 惊人的灵活性，你应该查看一下 CSS Zen Garden，网址是 [`www.csszengarden.com`](http://www.csszengarden.com)。这是一个样式集合，所有样式都用于展示*同一张网页*，唯一的区别是所使用的\
  \ CSS。这种方式能够实现的创造力简直令人难以置信。同时需要注意的是，这之所以成为可能，正是由于 HTML 被重构为独立的内容和设计组件。因此，你确实只需通过替换样式表就能改变整个网站的设计。在\
  \ CSS 出现之前，这样的更改需要重写整个网站。而现在，只需要重写样式表即可。\n\n### 本章回顾\n\n本章涵盖了层叠样式表的基础知识。我们学到了以下内容：\n\
  \n*   技术通常通过将旧的单体技术重构为不同概念来发展。\n*   层叠样式表（CSS）是在 HTML 被重构以分离网页内容、呈现和交互性时发展起来的。\n\
  *   CSS 文件用于处理 HTML 内容的呈现。\n*   CSS 允许 HTML 容纳网页内容，而无需考虑其显示方式。\n*   CSS 通过将一系列样式属性应用于由选择器指定的\
  \ HTML 元素来工作。\n*   CSS 选择器通常基于标签名称和属性值。\n*   CSS 基于 CSS 盒模型进行页面布局，其中每个 HTML 元素在页面上被分配一个矩形框，并拥有自己的内边距、边框和外边距。\n\
  *   仅通过更改样式表，就能为 HTML 内容实现多种多样的布局，其效果令人惊叹。\n*   由于页面或页面集的样式存在于外部文件中，CSS 允许通过仅更新共享的\
  \ CSS 文件来改变整个网站的外观。\n\n### 学以致用\n\n1.  将图 7-3 中的 HTML 文件取出，并为其编写一个新的样式表。将标题设置为 16\
  \ 点字号的字体，段落文本设置为 12 点字号的字体。在段落之间设置 12 点的间距。\n\n2.  创建一个新的 HTML 文件和一个新的 CSS 文件。在屏幕上创建四个矩形，每个矩形具有不同的宽度、高度和背景颜色。\n\
  \n\n\n3. 为图 7-3 中的内容构思你自己的设计。首先，在一张纸上画出你想要的布局——尽情发挥创意！然后，试着看看当前掌握的 CSS 知识能实现设计中的哪些部分。如果你的想象力超出了现有技能，不必担心。尽力而为即可！你还可以上网查找其他\
  \ CSS 属性，让你的设计变得生动。像 `w3schools.com` 这样的网站提供了丰富的 CSS 创作资料。\n\n4. 在 CSS Zen Garden（`csszengarden.com`）上找到你最喜欢的设计。页面某处有一个“查看该设计的\
  \ CSS”链接。点击该链接，看看能否理解 CSS 文件的作用。如果有很多不懂的地方，不必担心。专注于那些你*确实*理解的部分。\n\n## 8. 你的第一个\
  \ JavaScript 程序\n\n到目前为止，我们已经介绍了网页内容（使用 HTML）和呈现（使用 CSS）的基础知识。如前所述，HTML 是一种*标记语言*，用于告诉计算机文本的结构。CSS\
  \ 是 HTML 的对应物，作为一种*样式语言*，用于告诉计算机你希望 HTML 如何呈现。这两者都是有限且专用的文档语言。它们告诉计算机一个或一组文档的静态结构，但并不执行任何功能或计算。无论是\
  \ HTML 还是 CSS，都不是真正通用的**编程语言**。因此，为了给网页添加交互和计算功能，我们需要使用 JavaScript 编程语言。本章将介绍一个简短而简单的程序。不过，详细阅读本章非常重要，因为我们将介绍许多在讨论程序和编程语言工作原理时会用到的术语。\n\
  \n### 8.1 JavaScript 简史\n\nJavaScript 由布兰登·艾奇（Brendan Eich）于 1995 年创建，当时他就职于网景公司（Netscape，现为\
  \ Mozilla）。JavaScript 是网络工作方式的一场革命，因为它将网络从一个主要是相互链接的文档群体，转变为一个真正沉浸式的交互环境。许多开发者（包括我自己）最初都对\
  \ JavaScript 的实用性持怀疑态度。然而，多年来它已经证明了自己的价值。JavaScript 刚发布时，其他几家供应商曾试图通过推出自己的脚本语言与之竞争。其中最主要的是\
  \ `VBScript`，由微软从 Internet Explorer 3（1996 年）版本开始实现。但到了 2019 年，所有浏览器都已正式移除对 `VBScript`\
  \ 的支持。\n\n还有其他技术也能让网页更具动态性，例如 Java、Flash、Silverlight、ActiveX 以及其他插件，但这些技术都未能像 JavaScript\
  \ 那样与 HTML 文档深度集成。这些其他技术通常通过从浏览器中接管网页的特定区域并自行处理来工作。而 JavaScript 则是作为网页本身的一个集成部分来工作。这些其他技术是为了弥补\
  \ JavaScript 在动画、视频以及与计算机其他部分（如摄像头，这些通常不属于浏览过程的一部分）集成等方面的不足而开发的。然而，JavaScript 也逐渐接管了这些任务，时至今日，几乎你浏览体验中的任何方面都离不开\
  \ JavaScript。JavaScript 经受住了时间的考验，并不断证明其实用性。\n\n关于 JavaScript 的一个容易混淆之处是其名称。如前文所述，还有另一种*不同的*网页编程语言叫做\
  \ Java。它们并非同一回事，甚至也不相似。务必始终使用 JavaScript 的全名称呼它，因为它的工作方式和行为与 Java 有显著不同。^(⁶)\n\n\
  多年来，JavaScript 的支持和标准化程度大幅提升。在 JavaScript 早期，每个浏览器处理 JavaScript 的方式都大相径庭，编写一套能到处运行的\
  \ JavaScript 非常困难。30 年后的今天，情况已大为改善。JavaScript 已由 ECMA 标准化，命名为 `ECMAScript`。尽管以不同的名称标准化，但它与\
  \ JavaScript 是同一门语言。\n\nJavaScript 现在绝对是开发交互式网页最标准的方式。它安装于所有主流浏览器上，且版本间几乎所有的差异都已解决。它也得到了众多第三方开发者的支持，他们编写编程**库**（附加功能模块），为\
  \ JavaScript 程序员提供了实现几乎任何想象到的功能的能力。\n\n![](img/531249_1_En_8_Fig1_HTML.png)\n\n\
  一个 14 行的简单 JavaScript 程序，包含 header 标签、body 标签、script type 为 text/javascript，并声明了无值的变量：person\
  \ age string、number 以及 age in twenty years。最后显示一条警告消息：“in 20 years you will be +\
  \ age in twenty years + years old”。\n\n**图 8-1** 包含 JavaScript 程序的简单网页\n\n\n\n##\
  \ 8.2 一个简单的 JavaScript 程序\n\n我们不会先描述 JavaScript 的外观和工作原理，而是直接输入一个示例程序来开始学习 JavaScript，*随后*再解释其工作原理。将图\
  \ 8-1 中所示的程序键入文本编辑器，并将其保存为 HTML 文件。\n\n输入此程序后，在浏览器中加载它。它会打开一个对话框，询问你的年龄。接着它会打开另一个对话框，告诉你\
  \ 20 年后你的年龄。非常简单，对吧？如果你的浏览器没有执行这些操作，请仔细检查，确保你输入的代码与列出的代码*完全*一致。如果仍然无法运行，请参见附录 B.6。\n\
  \n现在，我们来看看这段代码的作用。\n\n首先要注意的是 `<script>` 标签。这个标签告诉浏览器，位于 `<script>` 开始和结束标签之间的内容是\
  \ JavaScript 代码。浏览器一遇到结束标签就会开始运行这段代码，甚至在页面加载完毕之前就会执行。`<script>` 标签有两个可能的属性。这里使用的是\
  \ `type` 属性，它告诉浏览器脚本的语言类型。这个属性值应该始终是 `text/javascript`。`<script>` 标签还可以接受另一个属性 `src`，它告诉浏览器在另一个文件（由\
  \ `src` 的值指定）中寻找 JavaScript 代码，而不是让代码直接位于网页本身中。\n\n在 `<script>` 标签之后，是一条 JavaScript\
  \ 单行注释。\n\n```\n// This is a program in JavaScript\n```\n\n每当 JavaScript 代码中出现两条斜杠时，从该位置到行尾的内容都被视为注释，会被浏览器忽略（更多关于注释的信息，请参见第\
  \ 6.6.6 节）。你在 JavaScript 中还会看到的另一种注释类型以 `/*` 开头，以 `*/` 结尾，适用于跨越多行的注释。\n\n第一组编程语句以关键字\
  \ `var` 开头：\n\n```\nvar person_age_string;\nvar person_age_number;\nvar age_in_twenty_years;\n\
  ```\n\n`var` 告诉 JavaScript 我们需要一个临时存储空间，称为**变量**，用来保存某些数据，并为该临时存储空间指定一个名称。因此，`var\
  \ person_age_string` 表示 `person_age_string` 将是一个临时存储空间的名称，我们将用它来保存数据。程序员表述这种方式为：`var\
  \ person_age_string` 创建了一个名为 `person_age_string` 的变量。这也被称为*定义*或**声明**一个变量。当我们稍后引用\
  \ `person_age_string` 时，它指的就是这个变量。\n\n其后是一个分号（`;`）。在 JavaScript 中，分号用于分隔各个语句。因此，当我们看到分号时，就知道已经到达一条语句的末尾。\n\
  \n接下来的两条语句与第一条类似，定义了变量 `person_age_number` 和 `age_in_twenty_years`。注意，我们在变量名中使用了下划线（`_`）。这使我们程序员能够看清单词的拼写，同时也确保计算机知道它们是一个整体。例如，如果我说“我要去公交车站（bus\
  \ stop）”，你知道“bus stop”实际上是一个概念。然而，计算机并没有那么智能。因此，如果你与计算机交谈，你需要说“我要去 bus_stop”（注意下划线），这样计算机就知道\
  \ bus_stop 应该被视为一个单词。\n\n下一条语句包含了更多操作。代码如下：\n\n```\nperson_age_string = prompt(\"\
  What is your age?\");\n```\n\n这行代码中有几个重要的事情发生。首先，注意等号（`=`）。在大多数编程语言（包括 JavaScript）中，等号是一条*命令*，表示将等号右侧的值赋给左侧的变量。它*不表示*这两个东西已经相等；它表示将右侧的值*赋值*给左侧的变量。这被称为**赋值语句**。这条语句的左侧是我们刚刚定义的一个变量。这条语句表示我们应该将一个新值存入该变量。这条语句的右侧则指明了这个值应该是什么。\n\
  \n右侧的部分就变得有趣了。`prompt(\"What is your age?\")` 告诉计算机弹出一个对话框，询问给定的问题，然后返回用户输入的值。这被称为**函数**，因为它调用了定义在其他地方的功能。JavaScript\
  \ 中的函数以函数名（此处为 `prompt`）开头，接着是左括号 `(`，然后是函数 **参数**，最后是右括号 `)`。*参数*（也称为**实参**）是发送给函数的值，函数使用该值来执行其功能。在本例中，函数有一个参数，即\
  \ `\"What is your age?\"`。这是一个字符串——一个由多个字符组合成单个单元的序列（就像我们在第 4.4 节讨论的那样）。在 JavaScript\
  \ 中，字符串用双引号（`\"`）、单引号（`’`）或反引号（`` ` ``）括起来，并被视为一个单一的值，不过如果需要，你也可以单独访问其中的字符。^(⁷)\n\
  \n我们说这个参数*被传递给函数*，因为函数会接收我们放在这里的任何值。`prompt` 函数可以接受一个或两个参数。第一个参数是你希望显示在输入框前面给用户看的文本。第二个参数（我们在这里没有使用）会为用户提供一个默认值。如果某个函数需要多个参数，每个参数之间用逗号（`,`）分隔。因此，如果我们想给用户一个默认年龄，可以这样写：\n\
  \n```\nprompt(\"What is your age?\", \"25\")\n```\n\n\n\n请记住，`prompt` 处理的是**字符串**，而不是数字，这也是为什么我们默认值要用引号括起来。代码会等待该函数执行完毕才继续，这意味着，在这种情况下，用户需要输入一个值并点击“确定”按钮。当用户真的输入了内容时，该值就会被用作该函数的结果值。我们说这个函数*返回*了那个值。\n\
  \n因此，用我们目前讨论的术语来说，就是代码 `prompt(\"What is your age?\")` 使用参数 `\"What is your age?\"\
  ` 调用了函数 `prompt`，并返回用户输入的任何内容作为该函数的值。然后，由于 `prompt` 函数返回用户输入的任何内容，用户输入的值就被存储到变量\
  \ `person_age_string` 中。\n\n那么，我们为什么要把变量命名为 `person_age_string` 呢？因为我们无法控制用户输入的内容，所以得到的是用户以字符串形式返回的内容。我们希望用户输入一个数字，但实际上他可以输入任何他想输入的内容——没有什么能阻止他输入非数字字符。因此，`prompt`\
  \ 函数总是返回一个字符串。希望用户按我们的要求输入了一个数字。但无论如何，`prompt` 返回的是一个字符串。我们将变量命名为 `person_age_string`，以便记住它保存的是一个字符串，而不是数字。\n\
  \n现在，程序需要将用户输入的年龄加上 20 岁。目前这还无法实现，因为我们保存的是用户输入的*字符串*，而要执行加法运算，我们需要一个*数字*。下一行代码 `person_age_number\
  \ = parseInt(person_age_string)` 完成了我们所需的转换。`parseInt` 是一个内置函数，它接收一个字符串，并将其**解析**为数字。*解析*是将一个字符串转换成一个更易于计算机程序操作的计算机化表示形式的过程。这里，我们是将一个字符串转换（解析）成一个数字。`parseInt`\
  \ 是“parse integer”（解析整数）的缩写，其中**整数**（integer）是一个完整的数字（例如 1、2、3、4 等）。如果你想要一个带小数的数字，你应该使用\
  \ `parseFloat`，它是“parse a floating-point number”（解析浮点数）的缩写，而**浮点数**（floating-point\
  \ number）是包含小数点的数字（例如 31.25、0.002、23.12 等）。\n\n然后，我们从 `parseInt` 函数获取值，并将其存储到变量\
  \ `person_age_number` 中。现在，我们以数字形式将所需的值保存在一个变量中。由于它是一个数字，我们就可以用它进行计算了！\n\n`age_in_twenty_years\
  \ = person_age_number + 20` 告诉计算机将变量 `person_age_number` 的值加上 20，然后将结果存储到 `age_in_twenty_years`\
  \ 中。\n\n在 JavaScript 中，`+` 和 `=` 被视为**运算符**，而它们所操作的值被称为**操作数**。运算符是语言中内置的特殊操作。它们与函数不同，因为正如我们将要学到的，你可以编写自己的函数，但语言的运算符本质上是固定的。运算符用于执行特殊任务（例如赋值），或者用于那些使用函数调用看起来很奇怪的地方。例如，对于数学运算，写\
  \ `2 + 3` 比写类似 `add(2, 3)` 的东西要自然得多。\n\n现在我们有了要找的值；我们只需要显示它。下一行代码会显示该值。\n\n```\n\
  alert(\"20 年后你将 \" + age_in_twenty_years + \" 岁\");\n```\n\n这段代码有几个奇怪的地方。首先，它对字符串使用了加号（`+`）。字符串要怎么相加呢？呃，在\
  \ JavaScript 中，当加号用于字符串时，它不再表示加法，而是表示**拼接**。拼接意味着将两个东西连接在一起。在这里，我们将字符串首尾相连。有一个问题——`age_in_twenty_years`\
  \ 不是字符串而是数字！JavaScript 通过在加法执行之前自动将与字符串相加的任何内容转换为字符串来处理这个问题。所以，如果加号两边都是数字，它表示加法；但如果加号任何一边是字符串，它则表示拼接。此外，拼接会在另一个值不是字符串时将其转换为字符串。\n\
  \n这段代码另一个有趣的特点是它组合了多个操作。它将三个项目拼接在一起，然后将结果字符串传递给 `alert` 函数。在大多数编程语言（包括 JavaScript）中，你可以根据需要将任意多的操作和函数组合在一起，以得到最终值。最内层的操作会先执行，其结果随后作为输入传递给更外层的操作。\n\
  \n最后，这段代码引入了 `alert` 函数，它会向用户显示一个弹出窗口。当用户点击“确定”按钮时，`alert` 函数返回。\n\n### 练习题\n\n\
  1.  什么是变量？如何在 JavaScript 中声明变量？\n2.  JavaScript 中加号的两种不同用途是什么？\n3.  `prompt` 和 `alert`\
  \ 函数分别有什么作用？\n\n### 练习活动\n\n在这个活动中，我们将尝试修改本节中的程序。在开始活动之前，请确保原始程序能够正常运行。每完成一步都要测试你的程序，确保它仍然能工作。如果你等到最后才测试，而程序无法工作，你将不知道错在哪里。\n\
  \n1.  在你的 `prompt` 之前添加一个仅显示“hello”的 `alert`。\n2.  将增加的年限改为 25 年。同时确保修改最后的 `alert`\
  \ 显示正确的内容！\n3.  你能想出如何将 `prompt` 和 `parseInt` 这两行代码合并成一行，使得 `prompt` 的输出成为 `parseInt`\
  \ 的输入吗？在这种情况下，哪个变量不再需要了？\n\n### 将 JavaScript 移至单独文件\n\n就像 CSS 一样，JavaScript 既可以嵌入到你的\
  \ HTML 文件中，也可以存储在单独的文件中。我建议除非有特定原因需要将 JavaScript 包含在页面中，否则应始终将其保存在单独的文件中。有时 JavaScript\
  \ 和 HTML 之间的交互可能导致意外结果，例如浏览器将你的部分 JavaScript 误认为是 HTML 标签。通过将 JavaScript 代码保存在单独的文件中，可以避免这些问题。\n\
  \n![一个包含页眉、正文和页脚的 7 行 HTML 代码。正文部分有一个标题“一个简单的 JavaScript 程序”和一个脚本标签，脚本类型为 text/javascript，源为\
  \ application.dot.js。](img/531249_1_En_8_Fig2_HTML.png)\n\n**图 8-2** 引用外部 JavaScript\
  \ 的 HTML 文件\n\n要将 JavaScript 放入单独文件，你只需复制 `<script>` 开始和结束标签之间的代码，并将其粘贴到一个扩展名为 `.js`\
  \ 的新文本文档中。然后，修改你的 `<script>` 标签，添加一个 `src` 属性（保持 `type` 属性不变），其值为新 JavaScript 文件的相对\
  \ URL。如果我们将 JavaScript 文件命名为 `application.js` 并放在与 HTML 文件相同的文件夹中，那么 HTML 将如图 8-2\
  \ 所示，而 JavaScript 将如图 8-3 所示。\n\n\n\n#### 将 JavaScript 保存在单独的文件中\n\n将 JavaScript\
  \ 代码保存在单独的文件中还有其他好处。首先，它能让你的 HTML 页面更易于阅读，因为页面中只包含一种语言——HTML。通过将不同语言分隔到各自文件中，你能够更好地保持头脑清晰。另一个原因是，它允许你在多个网页之间共享\
  \ JavaScript 程序及其代码片段，这样你就不必一遍又一遍地编写或复制相同的代码。这也意味着，如果你在一个地方修改了代码，就不必在每个其他页面上搜索并进行相同的修改，而这个过程既繁琐又容易出错。如果你有一个大型的\
  \ JavaScript 应用程序，分离 JavaScript 代码实际上可以让你的页面加载更快，因为浏览器只需加载一次你的 JavaScript，而不是让它占据每个文件中间的位置。\n\
  \n![](img/531249_1_En_8_Fig3_HTML.png)\n\n一个包含 7 行代码的简单 JavaScript 程序，声明了一个变量为 `personAge`\
  \ 字符串、数字以及二十年后的年龄，但没有赋值。最后弹出一条提示信息，内容为“20 年后你将 + 二十年后的年龄 + 岁”。\n\n**图 8-3**  \n\
  从 HTML 引用的简短 JavaScript 文件\n\n#### 8.3.1 回顾\n\n在本章中，我们介绍了编写 JavaScript 程序的最基础知识。我们学习了以下内容：\n\
  \n- JavaScript 是一种通用编程语言，允许我们创建动态网页。\n- ECMAScript 是由负责标准化的组织为该语言指定的名称，但大多数人通常仍称其为\
  \ JavaScript。\n- JavaScript 可以嵌入到页面中，也可以存储在单独的文件里。\n- 在网页中，JavaScript 通过 `<script>`\
  \ 标签进行标识。\n- 变量是用于存储值的位置，并使用 `var` 关键字进行声明。\n- `=` 运算符用于给变量赋值。\n- 函数是在其他地方定义的、有名称的过程。\n\
  - 函数可以被赋予值，这些值称为参数（或实参），在函数运行时供其使用。\n- 多个函数参数之间用逗号分隔。\n- 函数完成后，其返回的值称为*返回值*。\n-\
  \ JavaScript 使用引号（`’`、`\"` 或 `` ` ``）来表示字符串。\n- `prompt` 是一个函数，它会弹出一个对话框，让用户输入字符串，并返回该字符串。\n\
  - `parseInt` 是一个将字符串转换为数字的函数。\n- `alert` 是一个弹出带有消息的对话框的函数。\n- `+` 运算符的作用是相加（对于数字）或拼接（对于字符串）。\n\
  \n#### 8.3.2 学以致用\n\n1.  创建一个新的 JavaScript 程序，向用户询问*两个*值。将这些值转换为整数，然后将它们相加并显示结果。\n\
  2.  尝试重写你刚刚创建的程序，使其不使用变量。提示：让你的函数的返回值成为其他函数的参数。一次逐步合并代码，每次消除一个变量，这可能会有所帮助。\n3. \
  \ 如果你输入了非数字的内容，这些函数会发生什么？它们会显示什么？你认为为什么会这样？\n\n---\n\n# 第三部分：JavaScript 基础\n\n**JavaScript\
  \ 基础**\n\n本部分涵盖了开始使用 JavaScript 进行编程所需的许多基本原则。\n\n## 9. 基本 JavaScript 语法\n\n所有语言，无论是人类语言还是计算机语言，都有所谓的**语法**。语言的语法是词语和符号允许组合的方式。例如，考虑英语句子“I\
  \ ate the the apple.”。这个句子有一个*语法错误*——我连续放了两个“the”。这在英语中是不允许的（并且毫无意义）。但语法的作用不仅仅是告诉你如何避免形成错误的句子。它还告诉你一个句子的*含义*。例如，如果我说“我有一根黄色的香蕉和一个红色的苹果”，你就知道“黄色”这个词描述我的香蕉，“红色”这个词描述我的苹果。你知道这一点是因为英语语法告诉了你形容词放在一个词前面意味着什么——它意味着这个形容词修饰该词。编程语言的语法非常类似。与往常一样，编程语言与人类语言的不同之处在于其语法更严格、更精确。计算机永远不会理解你的*意图*，只会理解你告诉它的东西。如果我对你说“我有一根香蕉黄色”，你可能会明白我的意思。但在大多数情况下，计算机不会。\n\
  \n请注意，为了运行本章中的程序，你需要像在 8.3 节中那样为它们创建一个 HTML 包装器。建议你将 JavaScript 保存在一个单独的文件中，并通过\
  \ `<script>` 标签的 `src` 属性来引用它。\n\n### 9.1 语法的构成元素\n\n虽然每种编程语言都有自己的语法，但某些类型的语法单位（即句法片段）是几乎所有编程语言所共有的。例如，几乎每种编程语言都有一个语句分隔符——一个告诉编程语言你已结束一条语句的符号。在\
  \ JavaScript（以及许多其他语言）中，分号 (`;`) 起到这个作用。因为编程语言需要知道语句在哪里开始和结束，所以大多数语言都包含一个语法单位，用来表示我们已完成一条语句。\n\
  \nJavaScript 中包含的标准语法元素有：\n\n- **字面量**：在语言中书写一个特定值的方式称为**字面量**。例如，在 JavaScript 中，`2`\
  \ 是一个表示数字 2 的字面量，而 `\"2\"` 是一个表示包含一个字符（即数字“2”）的字符串的字面量。我们将在学习不同类型的字面量时讨论如何编写它们。目前，数字和字符串是我们主要关注的两种字面量类型。\n\
  \n- **标识符**：**标识符**是程序员定义的名称。例如，变量的名称就是标识符。每种编程语言都有关于如何命名标识符的规则，通常限制你只能使用某些字符作为名称。在大多数编程语言中，标识符不能包含空格、破折号或其他符号字符，但可以包含下划线，并且应以字母开头。`my\
  \ identifier` 不是一个有效的标识符，但 `my_identifier` 是。\n\n- **关键字**：**关键字**看起来像一个标识符，但由编程语言本身定义。我们目前见过的\
  \ `var` 就是一个关键字，它表示接下来的标识符将是一个新变量的名称。许多语法单位都由特定的关键字指示。在 JavaScript 中，关键字也是**保留字**，这意味着你*不允许*使用与关键字同名的标识符。\n\
  \n- **运算符**：**运算符**是执行某项任务的东西（通常是像 `+` 或 `-` 这样的符号），如果将其写为函数会很不方便或不自然。运算符用于执行操作的值称为**操作数**。因此，对于\
  \ `2 + 3`，`+` 是运算符，而 `2` 和 `3` 是操作数。\n\n\n\n*   **函数**：**函数**是一种将代码分组以作为一个单元执行的方法，该单元可以反复使用。大多数语言都既有语言本身提供的内置函数，也有让用户定义执行特定项目任务的自定义函数的方式。我们将在第\
  \ 10 章详细讨论如何创建函数。\n*   **表达式**：**表达式**是函数、关键字、运算符、标识符和字面量的组合，它们共同作用以产生一个值。例如，`5\
  \ + 2 + 3`就是一个表达式，它产生的值是`10`。\n*   **控制结构**：**控制结构**（也称为**流程控制语句**）用于改变计算机程序通常的线性执行流程。例如，如果你想只在某人勾选了某个复选框时才执行一个任务，你就需要使用控制结构来确保代码只在符合条件时运行。\n\
  \n请记住，本书的目标是为你提供一个实用的入门介绍，而非一份详尽的清单。我们会跳过某些语法细节，或仅作简短提及与过度简化。实际上，我可以保证，如果我把所有细节都告诉你，你会放下这本书去找别的事情做！但这并非障碍。事实上，程序员很少能完全掌握自己所使用的编程语言的每一个语法细节。有些细节涵盖了程序员从未想过要处理的情况，它们是由语言创建者为完备性而包含进来的。因此，在任何语言中，你几乎永远都是一名学生，极少能成为大师。而那些少数大师通常就是创造这些语言的人。本书所涵盖的内容应能在很长一段时间内为你提供良好的指导，但请记住，总有更多东西需要学习。\n\
  \n## 9.2 赋值语句\n\n在第 8 章中，我们已经相当详细地讨论了赋值语句。赋值语句是大多数编程语言的基础。\n\n一个赋值语句示例如下：\n\n```\n\
  x = 2 + 3;\n```\n\n赋值语句有两边——左侧和右侧。左侧要么是一个变量，要么（如我们将在第 11 章看到的）是某个可以存储值的位置的引用。就本章而言，赋值的左侧将是一个变量。赋值语句的右侧是一个*表达式*。如前所述，表达式是运算符、函数、字面量和标识符的组合，它们会生成一个值。在这种情况下，`2\
  \ + 3`生成了值`5`。因此，右侧的值是`5`。右侧生成的值随后被存储在左侧。\n\n表达式可以很简单——你可以只有一个字面量值（例如`2`）。你也可以在表达式中使用变量。实际上，你甚至可以在接收赋值的同一表达式中使用该变量。请看以下代码：\n\
  \n```\nvar x;\nx = 10; // x 当前值为 10\nx = x + 13; // x 现在值为 23\n```\n\n如果你看最后一条语句，表达式是`x\
  \ + 13`。由于`x`的当前值是`10`（前一行赋予的值），因此表达式的值是`10 + 13`，即`23`。由于这是一个赋值语句，右侧表达式的值（`23`）现在被赋给左侧的变量（`x`）。现在，`x`的值是`23`。\n\
  \n表达式也可以使用括号进行分组，以告知编程语言你希望哪些运算先执行。例如，请看以下代码：\n\n```\nvar x;\nx = (2 + 10) * 3;\n\
  ```\n\n这里，首先计算`2 + 10`，得到值`12`，然后计算`12 * 3`，得到`36`。这个数字（`36`）随后被存储在变量`x`中。\n\n你还可以在表达式中包含函数调用。例如，我们可以这样做：\n\
  \n```\nvar x;\nx = \"123\"; // 这是字符串 \"123\"，不是数字 123\nvar y;\ny = parseInt(x) +\
  \ 12;\n```\n\n这段代码的最后一行结合了一个函数调用与`+`运算符。函数调用接收`x`中的值并返回其整数值，然后该值与`12`相加，结果为`135`。\n\
  \n表达式也可以包含在函数的参数中。请看以下代码：\n\n```\nvar x;\nx = parseInt(\"12\" + \"3\");\n```\n\n\
  这里我们有`\"12\" + \"3\"`作为一个表达式，它生成了值`\"123\"`（因为`\"12\"`和`\"3\"`都是字符串）。这个值随后被传递给`parseInt`函数，该函数生成*数字*`123`，然后被存储在`x`中。\n\
  \n## 9.3 控制结构\n\n控制结构会修改程序的执行流程。通常，你会认为程序是按顺序逐条语句执行的。控制结构是一种语法单元，它会导致程序的流程以某种方式被改变。每种编程语言都有的、用于修改流程的两种基本控制结构是：*条件分支*，它使计算机根据某个条件执行一段代码或另一段代码；以及*循环*，它使计算机重复执行一段代码（重复次数取决于指定的条件）。\n\
  \n#### 9.3.1 `if` 语句\n\n`if`语句是 JavaScript 程序员进行条件分支的主要方式。\n\n`if`语句的基本形式如下：\n\n\
  ```\nif (some_condition) {\n    // 如果 some_condition 为 true，则执行这里的代码\n} else {\n\
  \    // 如果 some_condition 不为 true，则执行这里的代码\n}\n```\n\n首先注意花括号（`{` 和 `}`）的使用。在 JavaScript\
  \ 中，花括号用于将多条语句组合成**块**。`if`语句通常有两个块——一个在条件为真时执行，另一个在条件为假时执行（前面有关键字`else`）。你可以在这些块中放入任意数量的语句。\n\
  \n![图 9-1 一个 `if` 语句示例](img/531249_1_En_9_Fig1_HTML.png)\n\n一个 JavaScript 代码将年龄作为变量且由用户定义。其中包含\
  \ if 和 else 循环，包括年龄和投票年限。\n\n**图 9-1** 一个 `if` 语句示例\n\n第二件要注意的事情是`if`后面的`some_condition`。`if`语句使用**条件表达式**来决定执行哪个块。条件表达式与其他表达式一样，只不过表达式的值不是数字或字符串，而是一个**布尔**值。布尔值就是要么为`true`，要么为`false`的值。布尔表达式通常比较两个值，以确定它们是否相等、一个是否大于另一个，或进行其他类似可得出`true`或`false`的操作。\n\
  \n为了更清楚，图 9-1 展示了一个使用`if`语句的程序。在这个例子中，条件表达式是`my_age > 17`。它的作用是查看变量`my_age`，如果`my_age`的值大于\
  \ 17，那么表达式的值就是`true`；如果`my_age`的值不大于 17，那么表达式的值就是`false`。`>`运算符的工作原理类似于数学运算符，只不过它给出的值是一个布尔值（`true`/`false`）而不是一个数值。注意代码中发生的情况。如果你的年龄超过\
  \ 17 岁，它只会弹出一个提醒。然而，如果你的年龄是 17 岁或以下，它会执行多项任务——首先，它会计算你还需要等多少年才能投票，然后显示结果。编程语言正是通过将语句组合成块，从而根据条件知道哪些语句需要一起执行。\n\
  \n\n\n## 常见布尔运算符\n\n常见的布尔运算符（结果为 `true` 或 `false` 的运算符）包括以下这些：\n\n| 运算符 | 含义 | 示例\
  \ |\n| --- | --- | --- |\n| `==` | 相等 | `2 == 2` 结果为 `true`；`2 == 3` 结果为 `false`\
  \ |\n| `!=` | 不相等 | `2 != 2` 结果为 `false`；`2 != 3` 结果为 `true` |\n| `<` | 小于 | `2\
  \ < 2` 结果为 `false`；`1 < 2` 结果为 `true` |\n| `>` | 大于 | `2 > 2` 结果为 `false`；`3 > 2`\
  \ 结果为 `true` |\n| `>=` | 大于或等于 | `2 >= 2` 结果为 `true`；`1 >= 2` 结果为 `false` |\n| `<=`\
  \ | 小于或等于 | `2 <= 2` 结果为 `true`；`3 <= 2` 结果为 `false` |\n| `===` | 严格相等 | `2 == \"\
  2\"` 结果为 `true`，但 `2 === \"2\"` 结果为 `false` |\n\n通常，我们需要将多个条件组合起来。假设我们想知道*以下两个条件是否同时成立*——你的年龄正好是\
  \ 18 岁，并且你的名字是弗雷德。有两种方法可以实现这个需求。第一种方法是将一个 `if` 语句嵌套在另一个 `if` 语句中，如下所示：\n\n```\n\
  var my_age;\nvar my_name;\nmy_name = prompt(\"What is your name?\");\nmy_age = parseInt(prompt(\"\
  What is your age?\"));\nif(my_age == 18) {\n    if(my_name == \"Fred\") {\n    \
  \    alert(\"Your name is Fred and you are 18!\");\n    }\n}\n```\n\n请注意，首先，这些 `if`\
  \ 语句没有 `else` 分支。`else` 分支实际上是可选的。如果条件为假，并且没有 `else` 分支，程序就会跳过它，继续执行下一条语句。另一点需要注意的是，我们可以在某个条件成立的代码块内再放置一个\
  \ `if` 语句。在 JavaScript 中，*任何*代码都可以放在这些代码块中。\n\n然而，这种方式需要输入很多代码。如果能将两个 `if` 语句合并成一个单一的语句，那就更好了。我们可以通过组合布尔表达式来实现这一点。布尔表达式可以通过两个运算符进行组合：`&&`（读作“且”）和\
  \ `||`（读作“或”）。如果 `&&` 的*两个*操作数都为真，那么它返回真值；如果 `||` 的*任一*操作数为真，它返回真值。因此，我们可以使用 `&&`\
  \ 将这些语句合并成一个 `if` 语句：\n\n```\nvar my_age;\nvar my_name;\nmy_name = prompt(\"What\
  \ is your name?\");\nmy_age = parseInt(prompt(\"What is your age?\"));\nif(my_age\
  \ == 18 && my_name == \"Fred\") {\n    alert(\"Your name is Fred and you are 18!\"\
  );\n}\n```\n\n我们还需要介绍的最后一个布尔运算符是 `!`（读作“非”）运算符。`!` 运算符没有两个操作数，只有一个，位于该运算符的右侧。该运算符返回其右侧布尔值的*相反值*。最好使用带圆括号的\
  \ `!` 运算符，这样你、计算机以及阅读你代码的其他人就能清楚地知道你要将该运算符应用于哪个表达式。例如，如果我想判断变量 `my_value` 是否不在 3\
  \ 到 10 之间，我可以这样写 `!(my_value >= 3 && my_value <= 10)`。如果值在范围内，圆括号内的表达式将返回真值，然后 `!`\
  \ 运算符会使其返回相反的结果。\n\n#### `while` 语句\n\n我们已经学习了使用 `if` 语句的条件语句，现在是时候来看看循环语句了。循环用于重复执行一段代码，重复一定次数，或者直到满足特定条件为止。假设你有一个问答游戏，你想让某人不断尝试答案，直到答对为止。你会使用循环，因为你希望代码不断向他们提问并读取答案，直到他们给出正确答案。换句话说，你希望他们*重复*执行提问和检查答案的代码。\n\
  \nJavaScript 中最基本的循环结构是 `while` 语句。`while` 语句的整体结构如下：\n\n```\nwhile(some_condition)\
  \ {\n    // 在此处执行任务\n}\n```\n\n`while` 语句告诉 JavaScript 重复执行给定代码块中的代码，直到 `some_condition`\
  \ 变为假。它在每次运行代码块之前都会检查 `some_condition`，如果条件为真，则运行循环。如果条件为假，则循环结束，继续执行代码的下一部分。\n\n\
  以下是一个包含 `while` 循环的示例程序，该循环将重复执行，直到用户输入正确的值：\n\n```\nvar answer;\nwhile(answer !=\
  \ \"Genesis\") {\n    answer = prompt(\"What is the first book in the Bible?\");\n\
  }\nalert(\"You got the answer right!\");\n```\n\n这段代码会先创建一个名为 `answer` 的变量。除非另有指定，否则\
  \ JavaScript 中创建的变量会被赋一个特殊的空值，叫做 `undefined`。创建变量后，代码开始执行 `while` 循环。循环开始时，会评估其条件，该条件称为**循环条件**。条件是\
  \ `answer != \"Genesis\"`，即检查变量 `answer` 是否与字符串 `\"Genesis\"` 不同。的确，`undefined`\
  \ 与 `\"Genesis\"` 不同，因此条件为真。这意味着我们可以继续执行循环。循环条件之后是一个用花括号括起来的语句块，称为**循环体**。如果循环条件为真，就会执行这些语句。在这个循环中，只有一条语句，它要求用户回答一个问题，并将结果存储在\
  \ `answer` 变量中。\n\n当计算机执行完循环体后，它会重新评估循环条件，以判断是应该再次运行循环还是结束。假设用户错误地回答了问题，输入了 “Exodus”。会发生什么？`answer`\
  \ 的值会是 `\"Exodus\"`。当评估循环条件时，`answer != \"Genesis\"` 仍然返回真。因此，它再次运行循环体。现在假设这次他们正确输入了\
  \ “Genesis”。会发生什么？`\"Genesis\"` 被存入 `answer`。现在循环体再次执行完毕，所以它重新评估循环条件。这次，条件 `answer\
  \ != \"Genesis\"` 是假！当循环条件为假时，控制权会转移到循环体之后的第一条指令。在这个例子中，那条指令告诉用户他们输入了正确的值。\n\n编写循环时需要注意的一点是，要确保循环条件最终能够评估为假。否则会发生什么？它会永远循环下去！用计算机术语来说，这被称为**无限循环**。你应该始终仔细检查，确保你的循环最终会终止。我们将在下一节更详细地讨论无限循环。\n\
  \n![](img/531249_1_En_9_Fig2_HTML.png)\n\n一段包含 6 行 JavaScript 代码的程序，用于处理数字和累加总和，将下一个数字加到总和上，转到下一个数字，执行\
  \ while 循环，并通过 alert 消息提示数字 1 到 6 的总和是多少。\n\n**图 9-2** 使用 `while` 循环累加数字 1 到 6\n\
  \n\n\n#### 9.3.3 `for` 语句\n\n循环的一个常见用途是按指定次数执行计算。假设我们想编写一个程序，将 1 到 6 之间的所有数字相加。这可以通过循环轻松实现。图\
  \ 9-2 展示了如何使用 `while` 循环来完成此任务。\n\n其工作原理是，首先为每个变量赋予起始值。这被称为**初始化**变量。程序的成功或失败往往取决于变量是否被初始化为了正确的值。在此例中，`num`\
  \ 被设置为我们要相加的第一个数字。变量 `sum` 被设置为零。之所以设为零，是因为这是任何数相加前的初始状态——什么也没加的总和就是零。\n\n接着，对循环条件进行求值。是的，`num`\
  \ 的值是 1，小于或等于 6。然后，将该数字加到 `sum` 中，并重新赋值给 `sum`，此时 `sum` 变为 1。下一步是最关键的部分——给 `num`\
  \ 加 1，并将结果存回 `num`，使其移动到下一个数字。现在 `num` 的值是 2。注意，尽管它仍然小于或等于 6，但它离终止循环又近了一步。然后我们再次检查循环条件并执行循环体。在下一次循环迭代结束时，`num`\
  \ 的值又向循环终止迈进了一步。\n\n在循环体执行六次之后，`num` 的值变为 7，这将终止循环并给出最终结果。\n\n现在花点时间思考一下——如果我们不小心省略了循环末尾给\
  \ `num` 加 1 的代码，会发生什么？`num` 将永远不会增加，因此它将*始终*为 1，那么 `num <= 6` 将*始终*为真，循环将永远无法结束。永不结束的循环被称为**无限循环**。无限循环可能会锁死你的浏览器，甚至更糟，导致整个电脑死机。\n\
  \n当你有一个像这样简单的循环时，其中只有一个变量用于控制循环是否重复进行，这个变量被称为**循环控制变量**。在 `while` 循环中，循环终止条件与循环控制变量递增的位置是分离的。而初始化循环控制变量的位置又在另一处。将这些重要的循环部分分散在不同位置可能会很危险，因为我们很容易忘记包含循环控制的一个或多个部分。\n\
  \n不过，还有另一种流程控制语句可用，对于简单循环，它能将所有管理控制变量的步骤集中在一处。这个语句就是 `for` 语句。\n\n`for` 语句的结构如下：\n\
  \n```\nfor(循环控制变量初始化; 循环条件;\n循环控制变量修改) {\n// 循环体\n}\n```\n\n现在我们使用控制变量的三个位置都打包在了\
  \ `for` 语句的同一个位置。这使得编写简单循环的过程更不容易出错。因此，如果我们使用 `for` 语句重写之前的程序，结果将如图 9-3 所示。\n\n\
  如你所见，我们针对循环控制变量所做的所有操作都被包含在一起。这种语法通过将所有管理代码集中在一处，让你能更好地管理循环控制变量。同时，它也使得代码更易于阅读。`while`\
  \ 语句仍然非常重要，尤其是对于具有更复杂条件和控制的循环来说。然而，多数情况下，使用 `for` 循环就足够了。\n\n![](img/531249_1_En_9_Fig3_HTML.png)\n\
  \n一段 5 行 JavaScript 代码。第 1 行是 `var sum = 0` 分号。第 2 行，`for` 循环包含 `var num = 1` 分号，`num\
  \ <= 6` 分号，`num = num + 1` 分号。第 3 行，`sum = sum + num` 分号。第 4 行，`alert` 消息。\n\n**图\
  \ 9-3** 使用 `for` 语句对 1 到 6 的数字求和\n\n#### 9.3.4 回顾\n\n在本章中，我们介绍了 JavaScript 语法的基础知识。我们学习了以下内容：\n\
  \n- 语法是程序或句子的结构表达其含义的方式。\n- 每种语言都有其独特的语法。\n- 许多编程语言通用的语法单元类型包括字面量、标识符、关键字、运算符、函数、表达式和控制结构。\n\
  - 表达式是由字面量、标识符、运算符和函数组成的序列，它们组合在一起产生一个值。\n- JavaScript 赋值语句有一个右侧部分，其中包含提供要赋值值的表达式，以及一个左侧部分，指明该值应放置在何处（哪个变量中）。\n\
  - 控制结构是修改程序流程的语句。\n- 控制结构修改程序流程的两种最常见方式是通过条件分支和循环。\n- `if` 语句是 JavaScript 中条件分支的主要方法。\n\
  - JavaScript 中的大多数循环是通过 `while` 语句或 `for` 语句实现的。\n- 循环的基本结构是循环初始化器、循环条件和循环体。\n-\
  \ 简单循环围绕单个循环控制变量进行，该变量用于循环结构的全部三个部分。\n- `for` 循环允许程序员将所有对循环控制变量的操作集中在一个位置，这样程序员更易正确编写，也便于他人阅读和理解。\n\
  - 可以在条件分支语句或循环语句的体中放置多条语句。花括号表示哪些语句属于控制结构的体，这被称为代码块。\n- 条件分支语句和循环语句也可以嵌套在其他分支和循环语句内部，以实现更复杂的处理。\n\
  - `var` 语句也可以与赋值语句结合使用，为变量提供初始值。\n\n#### 9.3.5 学以致用\n\n1.  输入第 9.3.2 节中问答游戏的代码。务必创建一个加载该\
  \ JavaScript 代码的 HTML 文件。验证游戏是否正常运行。\n2.  创建你自己的问答游戏，至少包含三个问题。\n3.  为此游戏添加额外代码，以便在用户答错问题时给出提示。如果这是你第一次编程，这可能比你想象的要难。仔细思考程序具体是如何运行的，以及你需要做些什么才能在正确的位置给出提示。根据你决定采用的方式，你可能需要在循环体中嵌入一个\
  \ `if` 语句。\n4.  输入第 9.3.3 节中用于将数字 1 到 6 相加的代码。务必创建一个加载该 JavaScript 代码的 HTML 文件。验证其是否正常运行。\n\
  5.  修改代码，让用户输入他们想用来求和的数字范围。别忘了使用 `parseInt`！\n6.  在上一个示例中，用户有可能会输入一个无效的范围（即，数字范围的起始值大于结束值）。添加\
  \ `if` 语句来处理这种情况，既可以向用户发出警告，也可以直接修复该问题。\n\n## 10. 函数与作用域介绍\n\n\n\n## 函数\n\n在前一章中，我们学习了编程的基本要素：赋值语句、条件分支和循环。对于小型程序来说，这些就足够了。实际上，仅凭这些特性，你就可以完成任何可能的计算。然而，随着程序规模的增长——哪怕只是稍微变大一点——你都需要一些工具，让你能用每一行代码完成更多工作，并将代码组织成逻辑块。想象一下，如果你的程序有一万行代码，当你需要修改某一行时，可能很难找到它！\n\
  \n同样，假设有一个任务你需要反复执行。如果每次都要重新输入代码，那将浪费大量精力！此外，假设你发现复制的代码中存在一个错误（称为**bug**）。如果你有 20\
  \ 份代码副本，就必须找到每一份并逐个修复。这既繁琐、浪费，又容易出错。\n\n我们需要做的是将代码片段打包成一个单元。这样做能使代码更有条理且可复用。大多数编程语言使用**函数**来组织和复用代码片段。\n\
  \n![一个包含 6 行代码的程序：1. 声明变量`square_a_number`等于函数`function(num)`；2. `var value = num\
  \ * num;`；3. `return value;`；4. `}`；5 和 6. `alert(\"The square of 3 is \" + square_a_number(3));`和`alert(\"\
  The square of 4 is \" + square_a_number(4));`](img/531249_1_En_10_Fig1_HTML.png)\n\
  \n**图 10-1** 使用函数的示例\n\n## 10.1 你的第一个函数\n\n你已经对函数有一些经验了。还记得`parseInt`、`prompt`和`alert`吗？这些被称为**内置函数**，因为它们是\
  \ JavaScript 本身的一部分。不过，你也可以定义自己的函数，并以同样的方式调用它们。\n\n为了开始讨论函数，我先展示一个简单的程序来说明函数是如何工作的。请记住，和本章中的其他程序一样，你需要按照第\
  \ 8.3 节描述的方法，将这个程序嵌入到一个 HTML 文件中。图 10-1 展示了代码。这个程序定义了一个函数，它接收一个值并返回该值的平方（即该值乘以自身）。然后，该函数被使用了两次，传入了不同的数字进行平方运算。\n\
  \n这段代码中的函数使用`function`关键字定义。在`function`关键字后面是一个参数列表——括号内列出了该函数可以接收的所有参数。我们定义的函数接收一个参数，并将其命名为`num`。这意味着传递给函数的值会在函数执行期间被存储在`num`中，这样我们就有了一个名字来引用它。由于它出现在参数列表中，我们不需要使用`var`关键字来定义它。\n\
  \n简而言之，`function(num)`告诉 JavaScript 定义一个接收一个参数的函数，并将该参数命名为`num`。当我们在函数内部使用`num`时，操作的是程序被调用时传入的值。我们本可以使用任何有效的名字来代替`num`，但`num`对于数字来说是一个合适的名字。\n\
  \n花括号内部是定义函数行为的代码块。在这个例子中，我们创建了一个名为`value`的新变量，将`num`乘以自身，然后将结果存入`value`。接着，`return`语句告诉\
  \ JavaScript 将什么值返回给调用该函数的代码。在这个程序中，返回语句表示当前存储在`value`中的结果应该作为函数的结果返回。\n\n`function`运算符定义了一个函数。然而，我们需要能够从代码中调用这个函数，所以它需要一个名字。在\
  \ JavaScript 中，我们如何命名一个东西呢？答案是将其存储在一个变量中。正如你在代码中看到的，我们将函数存储在一个名为`square_a_number`的变量中。像往常一样，别忘了在赋值语句末尾加上分号（`;`），否则\
  \ JavaScript 可能会混淆。\n\n现在，我们有了包含函数的变量`square_a_number`，就可以像调用其他函数（如`parseInt`）一样调用它。`square_a_number(5)`将返回\
  \ 25，而`square_a_number(6)`将返回 36。\n\n### 练习\n\n1.  在与`square_a_number`函数相同的文件中，定义另一个名为`cube_a_number`的函数，该函数返回一个数的立方（即该数乘以自身再乘以自身）。\n\
  \n2.  像我们对`square_a_number`所做的那样，多次调用`alert`函数，并传入`cube_a_number`函数的结果。\n\n3.  `square_a_number`函数的主体创建了一个名为`value`的变量来存储计算的临时结果。但是，由于计算非常简单，我们实际上不需要这个变量。你能重写`square_a_number`，使其不使用变量吗？\n\
  \n4.  修改程序，让用户输入一个数字，然后调用`square_a_number`计算平方，最后将结果显示给用户。\n\n5.  将你刚刚编写的程序中的用户交互部分放入一个运行三次的`for`循环中，这样程序会询问用户三次数字并给出结果。\n\
  \n6.  将循环从`for`循环改为`while`循环，并持续执行操作，直到用户输入零作为要平方的数字为止。\n\n![一个 JavaScript 程序，包含变量`sumRange\
  \ = function(start, end)`（用户定义）。其中使用了`for`循环，包含变量名和范围，以及`alert`消息“The sum of all\
  \ the numbers between start and end is”加上结果。](img/531249_1_En_10_Fig2_HTML.png)\n\
  \n**图 10-2** 一个嵌入了`while`循环的函数\n\n\n\n## 10.2 更多函数示例\n\n为了确保你掌握函数的概念，我们再来看一个例子。假设我们想编写一个函数，用于对某一范围内的数字求和，比如\
  \ 2 到 12 之间的所有数字。这与我们在 9.3.3 节中编写的代码类似，但这次它会把起始值和结束值作为参数。那么我们应该如何编写呢？\n\n我们需要一个函数，但这个函数内部还需要有一个循环，用于遍历从起始值到结束值的所有数字。代码如图\
  \ 10-2 所示。\n\n这个函数与我们之前写的函数有几个不同之处。首先，它有两个参数，而不是一个——`range_start` 和 `range_end`。函数可以有任意多个参数，甚至可以没有参数，此时写作\
  \ `function()`。在这个例子中，我们需要两个值，因为我们需要范围的起始值和结束值。在 JavaScript 中，参数是**按位置对应**的，这意味着你用\
  \ `function` 关键字定义参数的顺序，必须与调用函数时传入值的顺序一致。换句话说，由于 `range_start` 是第一个参数，函数调用中的第一个值就会被赋给这个参数。`range_end`\
  \ 是第二个参数，因此传递到函数调用的第二个值就会赋给它。所以，调用 `sum_range(start_val, end_val)` 会告诉 JavaScript\
  \ 执行 `sum_range` 函数，将 `start_val` 的值赋给 `range_start`，将 `end_val` 的值赋给 `range_end`。然后它执行函数并返回值，在这个例子中，返回值被存入变量\
  \ `result`。接下来，函数内部还嵌入了一个 `for` 循环。就像 JavaScript 中的任何代码块一样，我们可以在函数内部嵌入任何类型的语句或运算符。\n\
  \n对于这个小程序，由于我们只使用了一次 `sum_range` 函数，它并没有帮我们节省多少输入量。但你能想象吗，如果我们在程序的多个不同地方都需要这个功能，并且反复使用它，那么将这段代码放入一个函数中将在未来节省大量的输入工作和麻烦。\n\
  \n尽管这个例子并没有节省多少输入量，但使用函数仍然有一个显著的优势——它可以将应用程序的不同组成部分分离开来。在这个程序中，我们既有用户交互（提示、接收输入和显示输出），也有计算（对范围内的所有数字求和）。通过将计算部分放入函数中，我们让这两个部分都变得更清晰。\n\
  \n想象一下，如果我们把所有代码都混在一起而不使用函数，可能连理解程序试图做什么都会变得困难。相反，通过将一部分代码分离成一个名称易于理解的函数（例如 `sum_range`），我们就能更清楚地了解整个程序在做什么。你可以看着它说：“哦，是的，这个名为\
  \ `sum_range` 的代码片段是对范围内的数字求和。看！在这里我们用这个函数处理来自用户的两个输入。”\n\n同样，对于小型程序来说，这可能不是什么大问题，但当你编写包含成千上万行代码的程序时，将代码分解成可管理、可理解的组件，每个组件负责一个小的、定义明确的任务，会使代码更容易理解和修改。\n\
  \n总的来说，在计算机编程中，将用户界面与计算分离开来是一个好主意。这为程序本身带来了许多长期的好处。在计算机编程中，用户界面往往会经常变化，即使底层逻辑保持不变。因此，将核心逻辑与其界面分离，可以使程序更易于扩展和修改，而不会带来不必要的麻烦。通常情况下，程序可能拥有多个面向核心逻辑的用户界面，或者一个用户界面加上一个供外部程序使用的接口。在这里，分离核心逻辑使得该逻辑不必在每个界面中重复。此外，编写测试来确保代码正常工作也是一种好的实践。测试核心逻辑通常比测试用户界面更直接，因此单独编写核心逻辑也使其更容易被测试。\n\
  \n\n\n# 右手食指指向右侧的手形图标。练习题\n\n1.  创建一个函数，它接受三个参数并返回这三个参数中的最大值。你需要使用多个`if`语句来完成这个任务。\n\
  \n2.  创建一个名为`multiply`的函数，该函数接受两个参数并执行与`*`（乘法）运算符相同的功能。但是，请不要在你的代码中使用`*`运算符。相反，通过对第一个参数进行重复加法来完成任务。请确保包含运行该函数并显示结果的代码，以便你知道自己是否做对了！\n\
  \n## 10.3 函数\n\n#### 调用函数\n\n函数也可以调用其他函数。例如，我们可以创建一个名为`sum_squares_for_range`的新函数，它类似于`sum_range`函数，但不同的是，它不会对范围内的数字求和，而是对范围内的每个数字调用`square_a_number`，以求取其平方并求和。在查看代码（图\
  \ 10-3）之前，请思考一下你将如何实现这样一个函数。\n\n正如你所看到的，就像我们可以在程序中的任何其他地方调用函数一样，我们也可以在一个函数内部调用另一个函数。利用这一特性，我们可以构建越来越复杂的函数。我们可以将几个经常一起使用的小函数组合起来，编写一个更大的函数，以一种有趣且有用的方式将它们结合起来。同样，如果我们有一个难以理解的大型函数，我们可以尝试将其分解成定义明确的几个部分，并为这些部分分别创建独立的函数。\n\
  \n## 10.4 变量作用域\n\n既然我们已经了解了函数在 JavaScript 中的工作方式，现在需要讨论一下变量作用域。变量的作用域指的是在程序中变量被创建、处于激活状态可供使用，以及被销毁的位置。\n\
  \n在一些最早的编程语言中，所有变量都具有全局作用域——这意味着该变量在整個程序中始终存在，并且在程序中的任何位置都可以访问。然而，这很快就会导致问题。我们已经多次创建了临时变量来保存中间值，例如`sum_range`函数中的`sum`变量。如果你所有的变量都是全局作用域，当你从一个函数调用另一个函数时，如果两个函数都为临时变量使用了相同的名称，那么你的临时结果就会被另一个函数覆盖！\n\
  \n![](img/531249_1_En_10_Fig3_HTML.png)\n\n一个 JavaScript 程序包含一个变量 squared number，该变量具有一个数字的函数且是用户自定义的。使用了\
  \ for 循环，并包含了 range 起始和结束值，然后给出一个提示消息，内容为 2 到 5 之间的平方和。\n\n**图 10-3** 一个函数调用另一个函数\n\
  \n如果所有变量都具有全局作用域，避免这种情况的唯一方法就是确保每个变量都有一个唯一的名称。无论是跟踪变量名，还是编写由此产生的不可避免地过长的名称，都会既繁琐又耗时。编程语言很快采用了新的作用域策略，赋予程序员更多的自由度。\n\
  \nJavaScript 对函数内部使用`var`声明的变量所采用的作用域类型称为函数作用域。这意味着除了全局作用域之外，每个函数都有一个唯一的、独立的作用域。如果在函数外部声明变量`var\
  \ myvar`，那么该变量存在于全局作用域中，被称为全局变量。由于它是全局的，我可以在*程序中的任何位置*访问`myvar`。如果我们改为在函数*内部*声明`var\
  \ myvar`，那么`myvar`将*仅在该函数内部*可用。这样的变量通常被称为局部变量。函数的参数也表现得如同它们是函数作用域内的局部变量一样。\n\n![](img/531249_1_En_10_Fig5_HTML.png)\n\
  \n一段 7 行代码中，`var myvar = 3` 是全局变量，`myvar = 5` 这一版本的 `myvar` 现在是局部的，调用函数，并给出一个提示消息：调用\
  \ my 函数 `myvar` 之后。\n\n**图 10-5** 全局变量与局部变量\n\n![](img/531249_1_En_10_Fig4_HTML.png)\n\
  \n一段 7 行代码中，`var myvar = 3` 是全局变量，将全局变量写为 `myvar = 5`，调用函数，并给出一个提示消息：调用 my 函数 `myvar`\
  \ 之后。\n\n**图 10-4** 修改全局变量\n\n为了说明这一点，图 10-4 展示了一个在函数内部修改全局变量的程序。在这段代码中，程序开始时，创建了全局变量`myvar`（它在任何函数之外定义）并赋值为`3`。然后，程序调用`my_function()`。该函数将`myvar`设置为`5`，然后返回。现在，当我们再次显示这个变量时，它的值是`5`。将其与图\
  \ 10-5 中程序发生的情况进行对比。在这个例子中，因为在函数中`myvar`前面有`var`关键字，所以创建了一个该函数特有的局部变量。这个变量在其他任何地方都不存在。即使在全局作用域中存在一个`myvar`，在函数执行期间，`myvar`将指向同名的局部变量。因此，在函数内部设置局部变量`myvar`不会对全局作用域产生影响。两个警示框都会显示相同的值，因为修改发生在局部变量上。\n\
  \n此外，如果另一个函数也有一个局部作用域的`myvar`，那么它将是与全局作用域的`myvar`或此函数局部作用域的`myvar`都不同的变量。每个函数的局部变量都属于该函数，甚至不能在函数外部被引用。\n\
  \n拥有局部作用域使得函数能够像“黑盒”一样工作，这意味着编写调用函数代码的人不必关心该函数是如何实现的细节。如果我们只有全局作用域，那么在调用一个函数之前，我需要去查找它正在使用的所有变量，以确保我没有使用相同的变量。然而，如果函数编写者只使用局部变量，那么如果我在程序中使用该函数，我就不必担心它可能会意外地覆盖我正在使用的变量。即使只有一个程序员在编写大型程序时，情况也是如此。你不会记住在函数中使用的每一个变量的名称。但是，如果你确保只在函数内部使用局部变量和参数，那么你就不需要记住所有的变量名，因为它们都将限定在给定函数的范围内。\n\
  \n偶尔，你也会需要使用全局作用域。事实上，我们在函数名上正是这样做的——我们将它们存储在全局变量中。在 JavaScript 中，函数像其他任何值一样被存储在变量中。因此，为了让函数能够互相调用，它们必须存在于全局作用域中。你也可以在另一个函数内部定义一个函数，但我们将在第\
  \ 14 章再讨论这一点。\n\n#### 10.4.1 回顾\n\n在本章中，我们讨论了什么是函数以及如何在代码中使用函数。我们学到了以下内容：\n\n* \
  \  `function` 运算符用于创建一个函数。\n*   一个函数接受参数，这些参数是指向传递给函数的值的变量。\n*   函数参数是按位置对应的，这意味着使用\
  \ `function` 运算符定义参数的顺序，与函数调用时必须使用的顺序相同。\n*   一个函数有一个函数体，这是告诉计算机在调用函数时需要做什么的代码。\n\
  \n\n\n**函数**\n\n- 函数存储在命名变量中，以便于调用。程序员通常将函数存储在全局变量中，以便在程序的任何位置都能访问该函数。\n- 函数可以调用其他函数。\n\
  - 函数可用于将代码组织成定义明确、易于理解的单元。\n- 函数可用于通过将重复的代码段移至函数中，来最小化需要编写的代码量。\n- 当重复的代码段被移入函数时，还有助于修复错误，因为只需在一个位置进行修复即可。\n\
  - 变量的作用域指的是变量何时生效以及可从哪些位置访问它。\n- 全局作用域中的变量可以从代码中的任何位置访问。\n- 函数局部作用域中的变量只能在该函数内部访问。\n\
  - 如果函数有一个与全局变量同名的局部变量，那么在该函数执行期间，全局变量将被隐藏。\n- 如果两个函数有一个同名的局部变量，这两个变量指的是两个*不同的*变量，因为它们各自存在于不同的作用域中。\n\
  \n### 应用所学知识\n\n凭借目前所学知识，你现在可以开始编写真正的程序了。记住你的工具——`if`、`while`、`for`和`function`——你将能够编写以下所有程序。\n\
  \n1.  创建一个摄氏温度转华氏温度转换器。它应询问用户摄氏温度，并返回华氏温度。从摄氏温度转换为华氏温度的公式是：将摄氏温度乘以 9，结果除以 5，然后加上\
  \ 32。确保实际的转换代码包含在一个函数中。\n2.  创建一个燃油效率计算器。它应询问你行驶的里程数、使用的加仑数以及每加仑燃油的价格。然后，它应告知你每英里的行驶成本（美元）。计算公式为：每加仑价格乘以加仑数，再除以里程数。确保该公式在一个函数中处理。\n\
  3.  实现阶乘函数。阶乘函数接收一个数字，并将从 1 到该数字的所有数字相乘。例如，6 的阶乘是 `6 * 5 * 4 * 3 * 2 * 1`。3 的阶乘是\
  \ `3 * 2 * 1`。请注意，由于你在重复一个操作，因此需要一个循环。确保阶乘计算写在一个函数中。编写一个用户界面，允许用户输入他们想要计算阶乘的数字。\n\
  4.  从这些计算器中任选一个，使其允许用户输入任意数量的值。你可以通过事后询问用户是否要继续，或者设置一个特殊值让用户输入以表示完成来实现。无论如何，要让用户能够持续使用该应用程序，直到他们准备结束为止。\n\
  \n### 使用对象和数组将值组合在一起\n\n到目前为止，在编程过程中，我们基本上处理的是简单值，例如单个数字和字符串。然而，在编写计算机程序时，通常需要处理多个组合在一起的值。例如，考虑一笔银行交易——你需要存储哪些值？你需要知道交易发生的时间、交易金额、汇款人和收款人。因此，你至少需要四个值——交易的时间戳、金额、转出账户和转入账户。\n\
  \n现在，我们可以用四个独立的变量来表示这些信息。我们可以这样写：\n\n```\nvar transaction_timestamp;\nvar transaction_amount;\n\
  var transaction_from_account;\nvar transaction_to_account;\n```\n\n如果这样写，当我们必须将这些变量传入一个函数时，我们就得将它们作为四个独立的参数传递。想象一下，如果后来我们为这笔交易添加了额外的数据，比如转账手续费和转账所用的货币。那么我们需要传递的变量数量就增加到了\
  \ 6 个！不仅如此，每个处理这些数据的函数都必须重写，以接受额外的参数！这种情况并不罕见。在许多程序中，可能有几十个相互关联的值。将它们作为单个值传递会很快变得难以控制。\n\
  \n#### 对象基础介绍\n\n为了将数据片段打包在一起，JavaScript 使用**对象**。对象就是一组带名称的值的集合。这就像一个把几个变量打包成一个单元的过程。\n\
  \n回到我们银行交易的例子，我可以将所有变量打包成一个单一的变量，该变量为每个组成部分拥有命名的值。与某些编程语言不同，JavaScript 不关心你在一个对象中打包了多少个值，你甚至不必提前告诉\
  \ JavaScript 它们将是什么。你通常从一个空对象开始，然后使用任何你想要的名称把你想要的任何值放进去。这并不意味着名称不重要——它们非常重要，因为那是你跟踪它们的方式，但\
  \ JavaScript 本身并不关心。\n\nJavaScript 中的对象可以通过多种方式生成。我们将要介绍的第一种方式是使用`new`关键字。要获得一个空白对象，你只需输入`new\
  \ Object()`。\n\n```\nvar my_transaction = new Object();\n```\n\n对象本身也是值，可以像任何其他值一样存储在变量中并在表达式中使用。\n\
  \n现在，让我们看看如何为对象赋值：\n\n```\nvar my_transaction = new Object();\nmy_transaction.timestamp\
  \ = \"2014-02-05\";\nmy_transaction.amount = 1000;\nmy_transaction.from_account\
  \ = \"12345\";\nmy_transaction.to_account = \"54321\";\n```\n\nJavaScript 根据名称将值存储在对象中。这些值通常被称为对象的**属性**或**特性**。因此，当你输入`my_transaction.amount`时，这告诉\
  \ JavaScript 查找`my_transaction`对象的`amount`属性。\n\n这些是我们进行银行交易所需要的信息。然而，一笔交易也需要账户的信息。一个银行*账户*对象会是什么样子？这样一个对象需要账号、账户持有人姓名以及当前余额。因此，我们可能会有一个如下所示的对象：\n\
  \n```\nvar my_account = new Object();\nmy_account.account_number = \"12345\";\n\
  my_account.owner = \"Fred Fredston\";\nmy_account.current_balance = 1200;\n```\n\
  \n\n\n# 第 11 章：对象与函数\n\n现在，假设我要定义一个函数，用于处理一笔针对账户的交易。我希望它能接收 `my_transaction` 并将其应用于\
  \ `my_account`（即将 `my_transaction` 中的金额添加到 `my_account` 的余额中）。为此，我可以创建一个函数，该函数接收两个对象，提取所需的值，并处理交易。如果账户号码与交易的\
  \ `from_account` 匹配，则从该账户中扣除金额；如果与交易的 `to_account` 匹配，则将金额存入该账户。图 11-1 展示了这一过程。\n\
  \n现在，我可以调用这个函数：`process_transaction(my_account, my_transaction);`。请注意，我们不必传入每个值，只需传入*包含*所需值的对象即可。\n\
  \n另一个要点是，当我们传入对象时，实际上可以*修改*接收到的对象。注意，这个函数不返回值，而是修改 `account` 对象本身。结果是对象的修改，而不是返回值。这被称为**变异函数**，因为它修改（即改变）作为参数传入的对象，而不是返回一个值。不过，变异只适用于对象。基本类型的值（如数字、字符串等）直接作为参数传入时，无法以这种方式修改。\n\
  \n请注意，如果一个函数没有返回值，它会返回特殊值 `undefined`，意为“无值”。\n\n总之，对象允许函数操作值，而不仅仅是处理值。当我们只传入数字和字符串时，即使修改了参数变量，也不会影响调用函数中的值。现在使用对象，我们可以修改传入的任何对象的*属性*。然而，我们无法用一个新对象完全替换整个对象，但可以修改它的所有属性。\n\
  \n![](img/531249_1_En_11_Fig1_HTML.png)\n\n一个使用 `if` 和 `else` 条件判断账户当前余额的程序。\n\n\
  **图 11-1** 一个接收两个对象的函数\n\n\U0001F449 **练习题**\n\n1.  找一个产品目录（任何类型均可）。浏览目录，列出每个目录项包含的数据字段。从中挑选两个目录项，用于完成本练习的后续部分。\n\
  2.  创建一个程序，构建两个对象——每个挑选的目录项对应一个对象。程序应使用你在上一步中列出的字段（如果字段很复杂，如图像，可以跳过）。使用 `alert`\
  \ 函数显示你已放入对象中的部分数据。\n3.  创建一个函数，用于显示单个项目的所有信息。该函数接收一个参数——要显示的项目。它应显示该对象上定义的每个属性。然后，对每个项目调用该函数。\n\
  4.  创建一个函数，向用户询问要放入对象中的值，然后返回一个包含这些属性值的新对象。\n\n## 11.2 简化对象创建\n\n因为 JavaScript 程序员总是使用\
  \ `new Object()` 来创建对象，所以 JavaScript 提供了一种特殊语法，让你能更快更简便地创建新对象：`{}`。这与 `new Object()`\
  \ 效果相同，都会创建一个新的空对象。因此，我们之前可以用以下代码开头：\n\n```\nvar my_transaction = {};\nmy_transaction.timestamp\
  \ = \"2014-02-05\";\nmy_transaction.amount = 1000;\n```\n\n然而，`{}` 还能玩出更多花样。你实际上可以用它在一开始就指定一组初始属性，这样就不必逐个赋值了。语法如下：\n\
  \n```\nvar my_transaction = {\n  timestamp: \"2014-02-05\",\n  amount: 1000,\n \
  \ from_account: \"12345\",\n  to_account: \"54321\"\n};\n```\n\n如你所见，使用这种语法，在 `{`\
  \ 和 `}` 之间，包含一组命名值，这些值将成为对象的属性。每个属性名后跟一个冒号和我们要设置的属性值。这使得初始化对象比冗长的方式更快、更简洁。请记住，属性名通常应限于变量允许的名称类型（即，不要在属性名中包含空格、破折号或特殊字符）。\n\
  \n\U0001F449 **练习题**\n\n修改上一节的练习代码，使用更简短的对象创建语法。\n\n## 11.3 使用数组存储值序列\n\n到目前为止，我们处理的是对象，它是命名值的集合。在本节中，我们将讨论**数组**，它是有序的*值序列*。\n\
  \n在第 4.3 节中，我们讨论了计算机如何存储值序列。简而言之，它存储序列中元素的数量，然后存储这些值本身。JavaScript 中的这种结构称为数组。JavaScript\
  \ 中的数组并非完全按照我们在第 4.3 节中讨论的方式存储，但这仍然是思考它们的一种有用方式。\n\n为什么我们需要值序列？假设我想存储我孩子们的年龄。我*可以*用对象来做，但会相当笨拙。使用对象，我可以这样做：\n\
  \n```\nvar children_ages = {\n  first_child: 11,\n  second_child: 8,\n  third_child:\
  \ 7\n};\n```\n\n这在一定程度上可行，但使用这样的结构会很困难。例如，如果我想输出每个孩子的年龄，编写一个循环来遍历每个孩子并输出年龄会很难，尤其是如果我事先不知道有多少个孩子的话。\n\
  \n而数组允许我们定义有序的值序列。因此，与其用笨拙的对象，我们可以编写更优雅的代码，如下所示：\n\n```\nvar children_ages = new\
  \ Array();\nchildren_ages[0] = 11;\nchildren_ages[1] = 8;\nchildren_ages[2] = 7;\n\
  ```\n\n在这段代码中，`children_ages` 首先被赋值为一个空数组——这就是 `new Array()` 的作用。第一行告诉 JavaScript\
  \ 创建一个空的值序列，并将其存储在变量 `children_ages` 中。在下一行，我们告诉 JavaScript，序列中的第一个值应为 `11`。`[]`\
  \ 表示法表示我们需要使用括号内的数字来告诉我们要引用数组中的哪个元素，如果该元素还不存在，则创建它。^(⁸) 数组中的元素通过其**索引**号来引用。索引号*从零开始*（而不是一），然后依次递增。^(⁹)\
  \ 因此，`[0]` 表示引用数组的第一个成员。\n\n代码 `children_ages[0] = 11;` 告诉 JavaScript 在 `children_ages`\
  \ 数组中查找第一个值，如果不存在则创建一个。接着，它会查看等号右侧，看表达式的结果是什么。在本例中，值是 `11`，因此它在 `children_ages`\
  \ 的索引 0 处存储数字 11。索引 1 和 2 也是如此。代码执行完毕后，`children_ages` 中有三个值——11、8 和 7。\n\n\n\n\
  ## 11.4 在程序中使用数组\n\n将值存入数组后，操作起来就方便多了。当我们尝试将值存入对象时，必须知道每个值的名称（例如 `first_child`、`second_child`\
  \ 等）。如果事先不知道有多少个孩子，我们就无法命名变量。而通过将它们存入数组，每个值都会获得一个数字索引，而非属性名称。计算机按顺序遍历这些索引要容易得多。\n\
  \n假设我们要遍历一个包含孩子年龄的数组，并找出最大年龄。该怎么做呢？当我们说“遍历数组”时，意味着要对数组中的每个元素重复执行某些代码。在需要重复代码时，我们使用哪种编程结构？当然是循环！\n\
  \n问题在于我们必须知道何时结束。也就是说，需要知道数组中有多少个值，这样我们才能在不需要更多值时停止。数组除了能通过索引访问值之外，在某些方面也像对象一样工作。\n\
  \n![](img/531249_1_En_11_Fig2_HTML.png)\n\n使用 `if` 条件找出最大值的程序。\n\n**图 11-2**  \n\
  在数组中查找最大值\n\n数组有一些特殊属性可用于获取关于数组的信息。数组最重要的属性是 `length` 属性。`length` 属性返回数组中值的数量。因此，在我们的代码中，`children_ages.length`\
  \ 将返回 3，因为它包含三个值。请注意，由于 JavaScript 数组使用从零开始的索引，这比最大的*索引*（即 2）大 1。数组大小比最大索引大 1 是你在计算机编程中需要经常记住的一个特性。\n\
  \n图 11-2 展示了一个函数，它接收一个年龄数组并返回最大值。在这段代码中，`for` 循环使用 `i` 作为循环计数器重复执行。`i` 从 0 开始，因为数组索引从\
  \ 0 开始。每次循环结束时，`i` 增加 1（`i++` 只是 `i = i + 1` 的简写）。将索引递增 1 基本上意味着“转到列表中的下一个值”。`for`\
  \ 语句的中间部分是条件。这里的条件是 `i < age_array.length`。由于数组长度比数组的最后一个索引*大 1*，这个条件意味着只要索引有效就继续执行。当\
  \ `i` 最终达到 `age_array.length` 时，它将不再指向有效值，因此我们应该停止循环。\n\n我们在循环内部做什么？我们只是测试每个值（`age_array[i]`）是否大于前一个值（`the_largest`）。如果更大，则将当前值写入\
  \ `the_largest`；否则忽略它。然后，在循环结束后，我们返回 `the_largest` 的值作为函数的结果。\n\n图 11-3 展示了如何将这个函数整合到一个更大的程序中。\n\
  \n![](img/531249_1_En_11_Fig3_HTML.png)\n\n从 3 个输入的年龄中找出最大年龄的程序。\n\n**图 11-3** \
  \ \n使用 `largest_age` 函数\n\n就像我们可以用 `{}` 语法简化对象创建一样，数组也有特殊的语法，使其易于创建。在 JavaScript\
  \ 中，你只需在方括号（`[]`）中放入一个列表即可创建数组。以下是一些示例：\n\n```\n// 创建一个空数组\nvar empty_array = [];\n\
  // 创建我们之前用过的数组\nvar children_ages = [11, 8, 7];\n// 获取 children_ages 中的最大值\nvar\
  \ largest = largest_age(children_ages);\n// 跳过变量，直接传入数组\nvar largest_inline = largest_age([11,\
  \ 8, 7]);\n```\n\n使用这种语法可以节省我们大量的编程工作量。\n\n另一个值得注意的技巧是如何向数组末尾添加值，无论数组有多长。虽然有多种方法，但最符合你当前学习进度的做法是直接将数组长度用作索引。请记住，长度总是比最后一个索引大\
  \ 1，因此它也是即将添加的*下一个*索引。\n\n以下代码展示了如何向数组中添加三个数字：\n\n```\nvar my_array = [];\nmy_array[my_array.length]\
  \ = 23;\nmy_array[my_array.length] = 99;\nmy_array[my_array.length] = 10;\n```\n\
  \n如果需要访问 `my_array` 数组的最后一个元素，可以使用 `my_array[my_array.length - 1]`。第一个元素始终是 `my_array[0]`。此外，如果你想删除数组末尾的元素，也可以设置\
  \ `length` 属性。要删除 `my_array` 数组的所有元素，只需执行 `my_array.length = 0;`。\n\n> 一个手指向右指的手形图标。\n\
  \n### 练习题\n\n1. 完整写出 `largest_age` 函数。向它传入不同的数组进行测试，确保它总是返回最大年龄。\n\n2. 不要自己创建数组值，而是让用户输入值。首次尝试时，让用户输入恰好三个值。确保这些值在存入数组之前被转换为数字！\n\
  \n3. 扩展你的程序，使用户可以输入任意数量的值。记得包含一种让用户表示输入完成的方式，可以是在每次输入后询问他们是否完成，或者要求用户输入一个特殊的哨兵值来表示完成。\n\
  \n## 11.5 混合使用对象与数组\n\n虽然对象和数组本身已经相当强大，但通过将它们混合使用，可以进一步提升两者的能力。对象属性中存储的值不必局限于数字和字符串——它们可以是任何\
  \ JavaScript 值，包括其他对象或数组！同样，数组中的值也不一定只是数字；它们可以是 JavaScript 支持的任何值，包括对象和其他数组。混合搭配对象和数组，让你能够灵活地表示几乎任何现实世界的数据集。\n\
  \n例如，假设我想记录更多关于孩子的信息，而不仅仅是年龄。我还想包含他们的名字和最喜欢的颜色。此外，假设我希望孩子列表是包含我个人信息的更大记录的一部分，而不是独立存在的一个变量。该如何编写呢？图\
  \ 11-4 展示了完整写法。\n\n![](img/531249_1_En_11_Fig4_HTML.png)\n\n记录名为 Jim、Jack 和 Joel\
  \ 的三个孩子的姓名、年龄和最喜欢颜色的程序。\n\n**图 11-4**  \n构建一个复杂对象\n\n\n\n如你所见，我们首先在变量 `my_record`\
  \ 中创建了一个空对象。然后我们向该对象添加了一个名字。接着，我们向该对象添加了一个空数组，并将该属性命名为 `children`。现在，要访问这个数组，我们必须使用\
  \ `my_record.children`。由于 `my_record.children` 是一个数组，我们可以对其使用索引。因此，`my_record.children[0]`\
  \ 指的是 `my_record.children` 数组中的第一个值。由于该索引尚不存在，它会被创建。但是，那里存储的是什么呢？是一个新的空对象！因此，`my_record.children[0]`\
  \ 现在指向一个空对象。我们能对对象做什么呢？我们可以添加属性。我们可以通过执行 `my_record.children[0].name = \"Jim\";`\
  \ 在这个新的空对象上创建一个 `name` 属性。然后我们以同样的方式设置年龄。在此过程结束时，我们得到了一个包含对象数组的对象。现在，如果我们想使用 `largest_age`\
  \ 函数，我们必须重写它。为什么呢？因为现在数组不再是一个数字数组，而是一个对象数组。因此，对于每个对象，我们必须查找 `age` 属性。图 11-5 展示了相关代码。\n\
  \n我们在这个函数中所做的是修改循环，使其将对象**临时**存储在一个名为 `child` 的变量中。然后我们使用 `child.age` 来访问孩子的年龄。请注意，如果不使用这个额外的\
  \ `child` 变量，我们也可以直接输入 `child_array[i].age` 来实现，但从长远来看，创建这个额外的变量会减少大量输入，并且更易于阅读。\n\
  \n![](img/531249_1_En_11_Fig5_HTML.png)\n\n一个使用 `if` 条件判断孩子中最大年龄的程序。\n\n图 11-5 \
  \ \n使用对象的 `largest_age` 函数\n\n要在我们的 `my_record` 中的孩子列表上调用此函数，我们只需编写 `largest_age(my_record.children)`。图\
  \ 11-4 展示了构建复杂对象的复杂方式。然而，就像有更简单的方法来编写简单的对象和数组一样，复杂的对象和数组也可以使用简化的语法来构建。图 11-6 展示了与我们在图\
  \ 11-4 中构建的完全相同的对象，但使用了简化表示法。正如你所见，这样做输入量少得多，且更易于阅读。由于书写方式，它占用了更多空间，但你并非必须那样做——JavaScript\
  \ 不关心使用了多少或少量的空间。如果你愿意，完全可以将整个复杂对象写在一行上，但我认为将事物分开带来的清晰度值得占用额外的空间。\n\n## 11.6 对象方法\n\
  \n**方法** 是一个物理上附加到对象上的函数。我们目前看到的函数（例如 `alert` 和 `prompt`）存储在全局变量中，可以在任何地方使用。而方法是一个作为属性存储在对象本身的函数。请记住，创建函数实际上是一个两步过程——`function`\
  \ 关键字*创建*了函数，但之后我们必须将其赋值给一个变量才能通过名称调用它。然而，就像我们可以将函数存储在变量中一样，我们也可以将其存储在对象的属性中。以这种方式存储的函数称为方法。\n\
  \n![](img/531249_1_En_11_Fig6_HTML.png)\n\n一个使用简化表示法记录 Jon 三个孩子姓名、年龄和最喜欢颜色的程序。\n\
  \n图 11-6  \n使用简化表示法的复杂对象\n\n由于它们存储在对象属性中，因此它们没有全局名称；它们只能**通过**对象来访问。此外，方法在被调用时会隐式地传递它们所属的对象。\n\
  \n举个例子，让我们看看数组对象的一个内置方法，称为 `push`。`push` 方法只是将一个项目添加到数组的末尾。以下代码创建数组 `[5, 6, 7]`：\n\
  \n```\nvar my_array = [];\nmy_array.push(5);\nmy_array.push(6);\nmy_array.push(7);\n\
  ```\n\n`my_array.push(5)` 的作用是查看 `my_array` 对象上的 `push` 属性，并调用在那里找到的函数。因为是以这种方式调用的，它会隐式地将\
  \ `my_array` 传递给该函数，并显式地将数字 5 作为第一个参数传递。然后 `push` 方法实现了与编写 `my_array[my_array.length]\
  \ = 5;` 相同的功能。\n\n对象方法有很多好处。首先，它们减少了全局定义方法的数量。就像我们通常尽量消除全局变量一样，因为记住哪些变量已经在使用会增加心智负担，将函数打包到对象的方法中而不是全局变量中，减少了我们需要关注的全局定义方法的数量。同样地，因为方法是在对象本身上定义的，我们实际上可以在不同对象上重用相同的方法名。在数组上，`push`\
  \ 的意思是“将值推送到末尾”。然而，对于其他类型的对象（比如割草机），`push` 可能意味着完全不同的东西。因此，在不同对象上，可能存在一个含义完全不同的\
  \ `push` 方法。如果所有这些不同的函数都必须存在于全局作用域中，它们将都需要不同的名称，例如 `array_push` 和 `lawnmower_push`。这会增加输入量，并且最终会变得更加混乱。\n\
  \n最后，方法语法明确了方法中的主要参与者。定义方法的对象通常是方法中最重要的参数，并为操作提供上下文。它使代码读起来有点像句子。你可以将 `my_array.push(5)`\
  \ 解读为“告诉 `my_array` 去 `push` 数字 `5`”。至少对我来说，这比语法是 `array_push(my_array, 5)` 更清晰（或者至少更整洁）。\n\
  \n与数组上的 `push` 方法相对应的是 `pop` 方法。`pop` 方法移除数组的最后一个元素（将其长度减 1）并返回被移除的值。\n\n我们将在第 15\
  \ 章深入探讨方法（以及如何创建自己的方法）。不过现在，我只希望你熟悉它们的运作方式，因为我们将在第 12 章更多地使用它们。\n\n一个食指指向右侧的手形图标。练习题\n\
  \n1.  编写一个程序，使用户可以不断向数组中添加项目，直到完成。使用 `push` 方法添加它们。然后，完成后，将数组中的所有值相加并显示结果。\n\n2.\
  \  尝试创建一个对象，并将一个函数赋值给它的某个属性。在第 15 章之前，你还不知道如何接收隐式传递的对象，但至少可以练习将函数作为对象属性进行赋值和使用。\n\
  \n### 11.6.1 回顾\n\n在本章中，我们介绍了复合值（对象和数组）的基础知识。我们学到了以下内容：\n\n-   对象将相关数据片段保存为一个单一的、内聚的整体。\n\
  -   对象中的每个值都放入一个属性中，该属性是一个用于访问该值的名称。\n-   数据序列称为数组。\n-   每个数组保存一系列相关的值。\n-   通过索引访问数组中的值。\n\
  -   数组索引从零开始，这意味着第一个索引始终为 0，最后一个索引始终比数组长度小 1。\n-   如果你为一个尚不存在的对象属性或数组索引赋值，系统会自动为你创建该属性或索引。\n\
  -   每个数组都有一个 `length` 属性，告诉你数组的大小。\n-   `length` 属性可以在循环中用来控制循环执行的次数。\n\n\n\n###\
  \ 对象与数组\n\n-   对象和数组可以互相嵌套——一个属性的值可以是数组，而某个数组索引位置的值也可以是一个完整的对象（该对象也可能包含数组）。\n- \
  \  对象和数组都有特殊的语法（`{}` 和 `[]`），以便于输入。\n-   函数也可以作为对象的属性存储，此时被称为**方法**。\n-   当使用 `对象名.方法名()`\
  \ 语法调用方法时，该对象会隐式地作为参数传递给该方法。\n\n### 11.6.2 实践所学\n\n1.  创建一个产品数组，使每个产品都是一个包含 `name`、`code`、`description`\
  \ 和 `price` 属性的对象。\n2.  现在，创建一个接受两个参数的函数：一个产品数组和一个产品代码。该函数应循环查找与代码匹配的对象。找到对象后，应返回包含匹配代码的完整对象。\n\
  3.  现在，添加用户交互功能。用户应能输入产品代码，程序将查找该产品的信息，并通过 `alert` 弹出框显示出来。\n4.  扩展程序，使用户可以查找任意数量的产品代码。\n\
  \n# 脚注\n\n# 12. 与网页交互\n\n在前面的章节中，我们学习了对象如何工作以及如何构建自己的对象。然而，JavaScript 也提供了多个现成的内置对象供你使用。这些标准对象是程序与系统其他部分（包括\
  \ HTML 文档、屏幕、计算机存储、通信设施以及其他重要系统功能）之间的桥梁。在本章中，我们将使用标准的 `document` 对象与网页进行交互。请注意，在本章的前半部分，我们将*仅*与\
  \ JavaScript 控制台交互。要使它与从网页加载的脚本协同工作，还需要额外的步骤，这将在 12.6 节中介绍。\n\n## 12.1 使用 JavaScript\
  \ 控制台\n\n为了观察 `document` 对象的实际运作，我们将使用 **JavaScript 控制台**。JavaScript 控制台允许你逐行输入\
  \ JavaScript 代码，并立即查看结果。关于如何在你的系统上访问 JavaScript 控制台，请参见附录 B.4.1。\n\n在开始使用控制台之前，请将图\
