  \ `25`。\n\n## 14.3 创造函数的函数\n\n假设我们想要一个充当计数器的函数。也就是说，每次调用该函数时，它都会给出下一个数字。第一次调用该函数时，它返回\
  \ 1，然后返回 2，依此类推。我们该如何编写这样的函数呢？\n\n![](img/531249_1_En_14_Fig4_HTML.png)\n\n一个 9\
  \ 行代码的函数，返回一个函数，声明将数字平方作为 x 的函数的变量，返回 x 乘以 x，结果作为 my function 5，并给出调用 my function\
  \ 5 结果的警报消息。\n\n**图 14-4** 返回一个函数的函数\n\n让我们首先探讨一种*不*奏效的方法。花点时间看看您是否能找出图 14-5 中展示的程序有什么问题。如果您还没想出来，请尝试将其放入网页中并运行。会发生什么？\n\
  \n该程序的问题在于 `counter` 的定义是一个局部变量。因此，每次运行该函数时，它都会创建一个全新的名为 `counter` 的变量并将其设置为零。因此，这个函数将始终返回值\
  \ `1`。\n\n解决此问题的一种方法是将 `counter` 变量设为全局变量而不是局部变量。图 14-6 中的代码会稍微好一些。这个代码实际上按我们期望的方式运行，但它有两个非常大的缺点。第一个缺点是\
  \ `counter` 变量是一个全局变量。这意味着使用 `next_value` 函数的人必须知道 `counter` 变量，以免自己使用它。对于函数的用户来说，必须了解如此多关于函数如何实现的信息是不良的编程实践。第二个缺点是这仅允许程序中使用一个计数器函数。为了获得第二个计数器函数，我们需要重新编码。编写两次完全相同的代码，只改变变量名，这似乎非常浪费。\n\
  \n为了解决这些问题，我们需要一种方法，使 `counter` 的作用域与全局作用域隔离，并且能够动态创建计数器函数的新实例，每个实例都有自己独立的 `counter`\
  \ 变量。这两点都可以通过创建函数生成函数来解决。\n\n![](img/531249_1_En_14_Fig7_HTML.png)\n\n一个 12 行代码的具有局部作用域的函数。声明变量以创建新函数，返回\
  \ x 和新函数，变量 my function a 和 b 等于 create function of 12 和 20，并给出警报消息。\n\n\n\n###\
  \ 图 14-7  \n**以局部作用域为父作用域的函数示例**  \n\n![](img/531249_1_En_14_Fig6_HTML.png)  \n\n\
  一段 9 行的计数器全局变量代码：声明变量 `counter` 为 `0`，下一值作为一个函数，`counter` 等于 `counter 加 1`，`return\
  \ counter`，声明变量，并针对第一个和第二个值给出提示信息。  \n\n### 图 14-6  \n**为计数器使用全局变量**  \n\n![](img/531249_1_En_14_Fig5_HTML.png)\
  \  \n\n一段 9 行的错误创建计数器程序代码：将下一值作为函数声明变量，`counter` 为 `0`，`counter` 等于 `counter 加 1`，`return\
  \ counter`，声明变量，并针对第一个和第二个值给出提示信息。  \n\n### 图 14-5  \n**创建计数器的错误程序**  \n\n在第 10\
  \ 章中，我们学习了 `function` 操作符会利用给定代码创建一个新函数。在第 13 章中，我们了解到每次调用函数时，都会为该函数创建一个新的局部作用域。我们还了解了每个新的局部作用域如何与一个父作用域建立链接，到目前为止，这个父作用域一直是全局作用域。（回顾一下，可以回头查看图\
  \ 13-8、13-10 和 13-13 以加深印象。）那么，这个父作用域的链接是如何创建的？它是否可以指向全局作用域以外的其他作用域？  \n\n原来，父作用域指向的是函数创建时*处于活动状态的任何作用域*。到目前为止，在我们的函数被创建时，活动的作用域一直是全局作用域。这就是为什么我们函数上的父作用域始终是全局作用域。相反，如果函数是在另一个函数处于活动状态时创建的，那么它的父作用域将是其创建时处于活动状态的局部作用域！当这样的函数被调用时，它仍然会为其参数以及所有使用\
  \ `var` 关键字声明的变量创建一个全新的局部作用域。然而，当引用其局部作用域中未定义的任何变量时，它会去查找其父作用域，也就是函数创建时处于活动状态的局部作用域。当一门计算机编程语言将活动函数的局部作用域存储为在该作用域内创建的函数的父作用域时，这种特性被称为**词法闭包**。\
  \  \n\n图 14-7 展示了这种父作用域操作的实际应用。这个示例被设计得非常简短，以便你能更轻松地看清所有运作环节。从高层来看，`create_function`\
  \ 函数接收一个参数并创建一个始终返回该值的函数。请注意 `var my_func_a = create_function(12);` 这一行。这行代码会让 `create_function`\
  \ 构建一个始终返回数值 `12` 的新函数，并将这个新函数存储在 `my_func_a` 中。  \n\n`create_function` 是如何做到这一点的呢？好吧，让我们逐步分析代码。\
  \  \n\n`create_function` 函数所做的第一件事就是创建一个函数。`function` 操作符可以在任何位置用于创建新函数。然后，它将该函数存储到\
  \ `new_function` 中，后者是 `create_function` 的一个局部变量。接着，它返回这个新创建的函数。  \n\n这个新创建的函数有什么特别之处呢？由于它是在\
  \ `create_function` *内部*定义的，因此它的父作用域就是在 `create_function` 被调用时创建的局部作用域。因此，每当 `create_function`\
  \ 运行时，它都会创建一个具有*不同*父作用域（即调用 `create_function` 函数时创建的那个作用域）的 `new_function` 函数的*新版本*。现在，当\
  \ `create_function` 返回时，它的局部作用域不再处于活动状态，但它不会被销毁，因为返回的函数仍然引用着它。这个作用域将一直处于休眠状态，直到所创建的函数被调用，届时它将变成所创建函数的新局部作用域的父作用域。\
  \  \n\n因此，当你调用 `create_function(12)` 时，会创建一个包含变量 `x` 的新局部作用域，并且 `x` 通过参数列表被赋值为 `12`。当将要存储在\
  \ `new_function` 中的函数被创建时，当前的局部作用域（其中 `x` 是局部变量）会被链接到该函数，从而使其成为通过调用该函数所创建的每个新局部作用域的父作用域。然后，这个函数被返回并存储在\
  \ `my_func_a` 中。当稍后调用 `my_func_a` 时，它会为函数调用创建一个新的局部作用域。然而，父作用域被设置为函数创建时活动的作用域——即\
  \ `x` 被设置为 `12` 的那个作用域。因此，当它执行 `return x;` 代码时，它首先会在新创建的局部作用域中查找 `x`，但没有找到。接着，它会去父作用域中查找，并在那里找到了\
  \ `x`。如果在父作用域中也没有找到 `x`，它会继续沿着作用域链向上，直到全局作用域。  \n\n请注意，`my_func_b` 是以相同方式创建的。然而，正如我们提到的，每次调用函数时都会创建一个新的局部作用域。因此，当调用\
  \ `create_function(20)` 时，会创建一个*新的*局部作用域，并且这个作用域中的 `x` 被设置为 `20`。这个作用域会被附加为所创建并存储在\
  \ `my_func_b` 中的函数的父作用域。  \n\n当 `my_func_a` 被调用时，父作用域是 `x` 被设为 `12` 的那个；但是当 `my_func_b`\
  \ 被调用时，父作用域是 `x` 被设为 `20` 的那个。  \n\n![](img/531249_1_En_14_Fig8_HTML.png)  \n\n\
  一段 18 行的创建计数器函数的代码。第 1 行：`var create_underscore_counter = function()`。第 2 行：`var\
  \ current_underscore_value = 0;`。代码中包含 5 行提示信息。  \n\n### 图 14-8  \n**用于创建计数器函数的函数**\
  \  \n\n我们现在有两个来自相同代码但功能不同的函数。这两个函数之所以工作方式不同，是因为它们在调用时具有*不同的父作用域*。  \n\n现在，让我们回到计数器函数的问题上。我们想要一个能够为我们创建新的计数器函数的函数。因此，我们真正需要的是一个可以附加到不同的父作用域上的计数器函数，每个父作用域都有自己的当前计数值。\
  \  \n\n图 14-8 展示了这在代码中是如何实现的。这段代码与之前仅仅从父作用域输出值的代码非常相似。唯一的区别在于，我们在返回 `current_val`\
  \ 之前，先操作了父作用域中 `current_val` 的值（将其加 1）。这个修改会被保留，因为每次调用 `mycounter_a` 时，它都会拉取同一个作用域作为父作用域。由于\
  \ `current_val` 在 `counter_function` 内部并未使用 `var` 关键字声明，因此无论是在读取还是写入该值时，它始终会引用其父作用域中的\
  \ `current_val`。  \n\n由于 `mycounter_a` 和 `mycounter_b` 是通过不同的 `create_counter` 调用创建的，它们各自维护着不同的父作用域，因此对于\
  \ `current_val` 拥有独立的值。不过请注意，`mycounter_c` 的表现就好像再次调用了 `mycounter_a` 一样。这是为什么呢？因为\
  \ `mycounter_c` *并非一个新函数*。它和 `mycounter_a` *是同一个函数*，因为它只是被赋值（引用）过去的。  \n\n`mycounter_a`\
  \ 和 `mycounter_b` 都是通过调用 `create_counter` 创建的，但 `mycounter_c` 只是获取了 `mycounter_a`\
  \ 中存储的同一个函数。请记住，函数和任何其他值一样存储在变量中，并且可以在不同的变量之间来回赋值，而这些赋值并不会改变底层的值。因此，`mycounter_a`\
  \ 和 `mycounter_c` 指向的完全是同一个函数（使用完全相同的父作用域）。\n\n\n\n## 14.4 柯里化函数\n\n在第 14.1 节中，我们学习了如何获取多个特定函数，并将它们组合成一个接收函数作为参数的单一高阶函数。在本节中，我们将研究相反的过程——获取一个泛化的（即高阶的）函数，并通过预先指定一个或多个参数来创建其更新、更具体的版本。\n\
  \n回顾一下图 14-1、14-2 和 14-3。你会注意到，图 14-1 和图 14-2 的功能都存在于图 14-3 中。你可能正确地推断出，图 14-3 中定义的函数\
  \ `sum_range_with_transformation` 因此比其他程序中定义的单个函数 `sum_cubes_of_range` 和 `sum_squares_of_range`\
  \ 更强大。然而，有时调用那些将另一个函数作为参数的函数可能会令人困惑。例如，如果程序员通常需要对一个范围内的数求平方和，但很少需要应用其他变换，那么将 `sum_squares_of_range`\
  \ 作为其独立的函数可能会很有用。\n\n现在，我们仍然希望利用我们的 `sum_range_with_transformation` 函数。原因在于，如果你有执行某项任务的代码，你不想让它存在两份副本。如果你在一份副本中发现了一个错误，你必须记得在另一份副本中也修复它。如果你找到了一种更好的方法来实现该函数，你也必须记得（并花时间）重写另一个函数以保持一致。\n\
  \n![](img/531249_1_En_14_Fig9_HTML.png)\n\n一个包含变量 sum_of_square_range（函数为 r start\
  \ 和 r end）的三行代码。该函数包含 return range_transformation（r start, r end, 和 square_number\
  \ 值）。\n\n**图 14-9** 从通用函数创建专用函数\n\n我们希望能够轻松调用 `sum_squares_of_range`，同时保留将所有逻辑集中通过\
  \ `sum_range_with_transformation` 处理的能力。实现这一点的方法就是**柯里化**。柯里化一个函数意味着你获取一个通用函数，并通过将一个或多个参数固定为常量值，从中创建一个专用函数。\n\
  \n例如，如果我们想在图 14-3 的程序基础上构建一个名为 `sum_squares_of_range` 的专用函数，我们可以添加图 14-9 中列出的代码来实现。如你所见，我们没有像在图\
  \ 14-1 中那样从头编写 `sum_squares_of_range` 函数，而是使用了 `sum_range_with_transformation` 作为构建块来创建我们的函数。这使\
  \ `sum_squares_of_range` 成为一种更简单的编写 `sum_range_with_transformation` 的方式，其中部分参数已经内置。\n\
  \n我们可以更进一步，定义一个生成函数的函数，你可以根据一个变换函数创建自定义的求和函数。这听起来有点奇怪，但举个例子可能会有所帮助。图 14-10 中的代码可以附加到图\
  \ 14-3 的末尾，以生成一个可运行的程序。在这个例子中，`create_summing_function` 将变换作为其参数，并返回一个全新的函数，该函数将该参数用作\
  \ `sum_range_with_transformation` 的最后一个参数，从而提供了一种创建新变换函数的非常简单的方法。\n\n## 14.5 匿名函数\n\
  \n函数只是值。正如我们早在第 8 章中所学，你通常甚至不需要创建变量来保存每个中间值。类似地，我们也并不总是需要将函数存储在变量中。\n\n就像键入数字 `5`\
  \ 会生成值 5 一样，使用 `function` 关键字会定义一个新函数。让我们回顾一下我们在图 14-10 中编写的代码。假设我们想创建一个新的求和函数，但这次我们希望在求和之前将范围内的数字提升到四次幂。现在，我们可以创建一个单独的函数来将数字提升到四次幂，然后直接使用图\
  \ 14-10 中的技术。然而，一个更简单的方法是完全省略函数命名，在调用 `create_summing_function` 时直接定义它。结果将类似于图 14-11，它将附加到你图\
  \ 14-10 中编写的程序中。\n\n![](img/531249_1_En_14_Fig11_HTML.png)\n\n一个包含变量 sum_of_fourth_power_of_range（函数为\
  \ x 的 sum_function）的五行代码。该函数包括 return x 的幂，以及变量 new_result 等于从 3 到 6 的数字之和，并给出一个\
  \ alert。\n\n**图 14-11** 使用匿名函数\n\n![](img/531249_1_En_14_Fig10_HTML.png)\n\n一个用于创建专用函数生成器的九行代码。第\
  \ 1 行是 var create_summing_function = function(transformation)。\n\n**图 14-10** 创建专用函数生成器\n\
  \n如你所见，在图 14-10 中我们为变换使用了命名函数，而这里我们直接传递了函数。我们传递的这个函数没有名字。它被定义后，不是存储在变量中，而是简单地作为参数传递给另一个函数。在代码中定义但没有给定名称的函数被称为**匿名函数**。\n\
  \n### 14.5.1 回顾\n\n在本章中，我们学习了几种创建和使用函数的高级方法。我们学到了以下内容：\n\n*   函数可以作为参数传递给其他函数。\n\
  *   当一个函数将另一个函数作为参数时，它允许调整该函数的过程。\n*   当两个函数看起来很相似，只是各自执行略有不同的过程时，它们通常可以合并成一个接受函数作为参数的函数。\n\
  *   当一个函数接受一个函数作为参数时，它被称为高阶函数。\n*   函数可以返回其他函数作为值。\n*   函数可以创建新函数作为返回值。\n*   当创建一个函数时，它组合并存储了要执行的代码以及指向它被创建时所在作用域的链接。\n\
  *   当为每次函数调用创建局部作用域时，这个指向作用域的链接将用作父作用域。\n*   如果一种计算机编程语言在创建函数时存储了一个指向活动作用域的链接，以便在函数中用作父作用域，那么我们就说该编程语言具有词法闭包。\n\
  *   柯里化是通过预先指定一个或多个参数，从更通用或更高阶的函数定义新的、特定函数的过程。\n\n### 14.5.2 学以致用\n\n1.  修改图 14-8\
  \ 中的计数器程序，使其接受一个起始值，允许你从任意值开始计数。\n2.  进一步修改计数器程序，使你还可以指定一个“步进”值（即，每次调用使计数器的递增值大于\
  \ 1）。\n3.  修改图 14-11 中的程序以执行另一种变换。如果你需要灵感，可以尝试仅将值翻倍。\n\n# 15. 中间对象\n\n\n\n截至目前，我们创建的只是包含数据的对象。仅包含数据的对象有时被称为**记录**（records）——它们存储数据，但不会执行任何操作。在第\
  \ 11 章中，我们编写了操作这些记录的函数。如果要执行某项操作（例如从账户中取款），你会调用相应的函数，它就会完成你的需求。这是一种不错的编程风格，适用于许多场景。然而，随着程序变得更大更复杂，将操作对象的函数与对象本身更紧密地关联起来会更有益处。\n\
  \n在第 11 章中，我们将几个相关的变量分组到单个对象中。这为代码带来了几项改进：\n\n1.  它使用了更少的变量，因为值都是同一个变量的属性。\n2. \
  \ 它允许相关的值一起传递给函数，而无需逐个传递。\n3.  它使代码更易于理解，因为相关的值被打包成一个单一单元。\n\n## 15.1 将函数附加到对象\n\
  \n像我们在第 11 章中那样，将相关的值打包成一个对象被称为**封装**（encapsulation）。然而，通过将函数也添加到对象中，可以进一步推进封装。如第\
  \ 11 章所述，这些函数被称为“方法”。方法是作为对象属性的函数，从对象调用该函数会将对象作为隐式参数（即，不在参数列表中）传递给函数。我们将从创建显式传递对象的函数开始，然后展示如何隐式传递对象。\n\
  \n假设我们有一个表示汽车的对象。它有两个值——行驶里程数和剩余油量。现在，假设我们有一个能让我们行驶十英里的函数。需要发生什么？好吧，该函数会增加行驶里程数并减少剩余油量。\n\
  \n图 15-1 展示了这样一个对象的代码。如你所见，`drive_car`函数关联了几个不同的值——行驶里程数、油箱剩余油量以及汽车的燃油效率。由于`drive_car`函数与汽车抽象紧密相关，因此将函数直接附加到`my_car`对象上是合理的，如图\
  \ 15-2 所示。\n\n如你所见，我们分配函数的方式与分配其他值的方式相同。我们也可以通过输入`my_car.drive = function() { ...}`来完成，但这种方式更简单。\n\
  \n既然函数在对象中，如何调用它呢？本书中我们所做的所有函数调用，都是通过简单地输入持有函数的变量名（通常是全局变量），然后添加括号并列出要传递给函数的参数来完成的。这里的方式相同。唯一的区别在于，由于函数存储在对象中而不是全局变量中，我们必须将函数值作为对象的属性来访问。\n\
  \n因此，我们会这样写：\n\n```\nmy_car.drive(my_car, 50);\n```\n\n这给我们带来了什么优势？目前还不多。然而，这样做实现的一个重要事情是减少了全局变量的数量，因为到目前为止，我们通常将函数存储在全局变量中。现在，该函数只存储在*汽车*对象内部。对于我们的简单程序来说，这似乎不重要，但在大型项目中，函数的数量可能增长到数千个。在这种情况下，将全局变量的数量保持在最低限度对于保持清晰至关重要。\n\
  \n![](img/531249_1_En_15_Fig2_HTML.png)\n\n这是一个 11 行的程序代码，用于计算汽车记录的剩余油量：行驶里程数、剩余油量和每加仑英里数。该程序说明，如果汽车剩余油量小于\
  \ 0，则显示一条警告消息。\n\n**图 15-2 将函数附加到对象**\n\n![](img/531249_1_En_15_Fig1_HTML.png)\n\
  \n这是一个 14 行的程序代码，用于计算汽车记录的剩余油量：行驶里程数、剩余油量和每加仑英里数。\n\n**图 15-1 一个简单的汽车对象**\n\n同理，请注意，当它是一个全局变量时，我们将其命名为`drive_car`。我们给它取了一个更长的名字，以防止**命名冲突**（name\
  \ clashes）——即两个函数意外地同名。当你将函数放在全局变量中时，通常必须给它们起非常长的名字，以防止其他人意外地调用同名的另一个函数。当函数存储在对象本身上时，情况并非如此。此外，如果函数只附加到对象上，我们已知它是在操作汽车，因为那是我们分配它的地方。因此，我们将函数名缩短为`drive`，这使得代码更清晰，也更易于编写。\n\
  \n不过，有一个问题，`drive`函数看起来有点冗余。代码正在对象上调用`drive`函数，但还必须将对象作为参数传入。事实证明，你在对象上定义的几乎所有函数都需要对象的存在。因此，如果你通过属性（例如`car.drive`）在对象上查找函数，JavaScript\
  \ 有一种方法可以隐式地将对象（即`car`）发送给该函数，而无需使其成为参数。JavaScript 有一个特殊的变量，总是命名为`this`，它保存了用于查找函数的对象（如果有的话）。它被称为`this`，因为它指的是“*这个*我们正在使用的当前对象”。\n\
  \n因此，我们可以从函数中移除参数`the_car`，因为它将通过`this`变量自动传入。利用`this`变量，我们可以将代码写成如图 15-3 所示。\n\n\
  因此，虽然大多数函数参数是*显式*传递给函数的，因为我们在定义函数时命名了它们，但`this`参数是*隐式*传递给函数的——它不在参数列表中。相反，JavaScript\
  \ 在幕后自动处理它。\n\n在面向对象编程中，定义在对象上并使用`this`变量的函数通常被称为**方法**（methods）或**消息**（messages）。与其他语言不同，在\
  \ JavaScript 中，函数和方法之间的区别*仅*在于你使用它们的方式——如果你的函数使用了`this`变量，那么它就是方法。\n\n你也可以从人类语言的角度来思考方法。对象是主语，方法是动词或命令，函数参数是直接宾语、副词或其他修饰语。\n\
  \n![](img/531249_1_En_15_Fig3_HTML.png)\n\n这是一个 14 行的程序代码，用于使用`this`变量计算汽车记录的剩余油量：行驶里程数、剩余油量和每加仑英里数。如果剩余油量小于\
  \ 0，则警告消息显示“你没油了”。\n\n**图 15-3 使用`this`为对象编写函数**\n\n当我们看到`my_car.drive(50)`时，应该将其理解为“亲爱的`my_car`，请使用\
  \ 50 作为参数执行你的`drive`函数”。\n\n到目前为止，我们已经看到，使用附加到对象上的函数可以减少全局变量名称的数量，引出更短的函数名，并使编程更接近英语表达习惯。\n\
  \n## 15.2 高效使用对象\n\n在代码中使用对象有几个原因。因为它遵循语言的主语/动词/宾语模式，所以理解以面向对象风格编写的代码要容易得多。因此，通过将函数与其相关数据结合，你使程序更易于使用和修改，因为代码更清晰了。\n\
  \n\n\n### 对象与模块化\n\n对象还有助于程序员将代码划分为清晰可辨的部分。这种做法被称为**模块化**。通过将函数附加到持有其数据的对象上，你不仅是在给计算机编程，更是在向未来的程序员（以及未来的自己）传达代码中想法之间的分界。这使得程序员能够将思路和行动专注于相关的函数。如果我知道所有与\
  \ `my_car` 相关的代码在哪里，我就能轻松找到并修改它。由于围绕 `my_car` 的所有函数都定义在彼此附近，当需要做出修改时，更容易找到也需要同步修改的相关函数。\n\
  \n![](img/531249_1_En_15_Fig4_HTML.png)\n\n一段 6 行的程序代码记录了行驶里程，这是一个关于行驶英里数的函数，以及行驶里程加上行驶英里数。第\
  \ 1 行写着 `var magic underscore car equal open curly brace`。\n\n**图 15-4** 一个实现相同接口的新对象\n\
  \n当编写较大的程序时，有时很难追踪数据在整个程序中的变化。如果你删除了一个字段或改变了它的使用方式，如何知道你是否已经修改了其余代码以正确使用它？通过将与对象相关的所有代码*植入*对象本身，当对象的代码被修改时，更容易找到需要更改的地方。\n\
  \n编程不仅仅是让程序运行。你还必须让代码对你自己和他人而言都能理解且易于修改。思考你需要哪些对象、它们需要哪些函数来工作、以及它们需要哪些数据，这将帮助你创建更好的对象，这对你当前和未来的工作都有帮助。这会让你的代码更具可读性、更易于理解和维护。\n\
  \n然而，面向对象编程的好处不仅仅是让代码更易读和易理解。它还允许你根据对象能执行的功能（而非其所包含的数据）来使用对象。\n\n我们已经有能够驾驶汽车的代码。假设我们发明了一种新型魔法汽车，它完全不受汽油限制。它可以驾驶任意你想要的里程数。这种汽车可以使用图\
  \ 15-4 所示的代码来实现。这个对象远没有我们之前的对象那么复杂，但这不是我要强调的重点。你是否注意到这个对象*也*有一个 `drive` 方法？对于这种新型汽车，该函数的操作方式不同，但它与我们另一个对象上的\
  \ `drive` 函数同名，且接受相同的参数。\n\n这使我们能够编写接受对象作为参数的函数和方法，而无需关心这个对象具体是什么。换句话说，如果我的函数需要使用\
  \ `drive` 方法，那么这个函数不需要关心它正在使用的是 `drive` 方法的*哪个*版本。无论是汽车还是魔法汽车，只要我的函数使用了 `drive`\
  \ 方法，我就可以将任一种类型的对象用于这个函数。\n\n#### 构建对象\n\n只有一个附加了函数的对象并不能让我们取得多大进展。大多数程序都包含大量相似的对象。按照固定模式构建对象被称为构建对象，而构建对象的函数被称为**构造函数**。JavaScript\
  \ 有多种不同的对象构建方式。然而，由于这是一本入门书籍，我们只讨论其中一种——构造函数。\n\n构造函数是一种使用 JavaScript 的 `new` 关键字调用的函数。按照惯例，构造函数名称以大写字母开头，以便轻松识别其为构造函数。\n\
  \n假设我想为我的汽车编写一个构造函数，它接受汽车的初始油量。这样的函数可能如图 15-5 所示。注意，我们通过 `new Car(50)` 来创建车辆。这创建了一个新的空对象，并将其设置为\
  \ `Car()` 函数内的 `this` 对象。然后我们用参数 `50` 调用了 `Car` 函数。`new` 关键字不依赖函数使用 `return` 关键字返回值，而是返回在\
  \ `this` 变量中使用的新构建的对象。\n\n在这个程序中，`Car` 函数是一个构造函数。它与 `new` 关键字配合使用，来构建一个新的对象以供使用。函数*不*必须以大写字母开头，但大多数\
  \ JavaScript 程序员都遵循这个约定，以确保哪些函数被用作构造函数是明确的。\n\n在某些编程语言中，`Car` 会被视为一个**类型**或**类**。类让程序员对对象能做什么有所预期——它将具有哪些属性、哪些函数，以及它们如何协同工作。这在某种程度上类似于\
  \ JavaScript 中的构造函数，因为构造函数在对象上设置初始属性和函数。\n\n![](img/531249_1_En_15_Fig5_HTML.png)\n\
  \n一个 16 行的汽车构造函数程序代码。程序提到了行驶里程、剩余油量和每加仑英里数。最后，程序识别出每辆车中的剩余油量。\n\n**图 15-5** 一个汽车构造函数\n\
  \n这意味着，大多数由构造函数创建的对象都将具有相似的属性和函数。\n\n##### 回顾\n\n在本章中，我们涵盖了如何将函数附加到对象上的基础知识。我们学到了以下内容：\n\
  \n*   由于函数也是值，因此函数可以像其他值一样作为对象的属性存储。\n*   将函数附加到对象上可以减少全局命名空间的杂乱。\n*   如果通过对象调用函数，则该函数所存储的对象会通过\
  \ `this` 参数隐式传递。\n*   以这种方式组织代码可以使软件更具可读性，因为它遵循典型的英语主谓宾句子结构。\n*   创建并初始化新对象的函数被称为构造函数。\n\
  *   构造函数通常存储在以大写字母开头的变量中，以便与其他函数区分。\n*   构造函数通常根据它们正在创建的对象类型来命名。\n*   构造函数使用 `new`\
  \ 关键字进行调用。\n*   使用构造函数可以用很少的代码创建大量相似的对象。\n\n##### 实践应用\n\n1.  创建一个构造函数 `Rectangle`，它创建一个具有\
  \ `base` 和 `height` 属性的对象。\n\n2.  扩展你的 `Rectangle` 构造函数，使其包含两个方法：`find_area()` 和\
  \ `find_perimeter()`，这两个方法能返回相应的计算结果。这些方法不应有任何参数，只能使用隐式的 `this` 参数。如果你忘记了几何知识，对于矩形，*面积*\
  \ = *底* × *高*，*周长* = *2* (*底* + *高*)。务必测试它们以确保其正常工作。\n\n\n\n#### 3. 创建 Circle 类\n\
  \n为`Circle`创建一个新的构造函数，它接受一个半径作为参数。它还应具有`find_area()`和`find_perimeter()`方法。如果你忘记了几何知识，*面积*\
  \ = *π* x *半径*²，*周长* = 2 x *π* x *半径*。请确保测试它们以确认它们能正常工作。\n\n#### 4. 创建 biggest_area\
  \ 函数\n\n创建一个名为`biggest_area`的函数，它接受一个`Rectangle`对象数组，并使用`find_area()`函数告诉用户数组中最大的面积是多少。\n\
  \n#### 5. 多态性应用\n\n如果你的`biggest_area`函数只使用了对象的`find_area()`函数，那么你应该能够将任何实现了类似函数的对象传递给它。由于`Circle`对象也具有`find_area()`函数，尝试将`Rectangle`和`Circle`对象交错放入同一个数组中。由于它们都应该以相同的方式响应，因此它们都应该能被`biggest_area`函数同等对待。\n\
  \n# Part V：编程应用\n\n在本部分中，我们将探讨应用程序运行的一些基础知识。我们将研究如何使用 JavaScript 修改页面、访问外部服务，甚至编写一个简单的服务。\n\
  \n# 16. 现代化 JavaScript\n\n在我们开始介绍现实世界中应用程序编写的一些细节之前，我想花点时间向你介绍一些现代 JavaScript 中常用的特性，这些特性在现代应用程序中很常见。请注意，本书的目标并非提供\
  \ JavaScript 本身的全面介绍，而是将 JavaScript 作为学习通用编程的跳板。尽管如此，我想花点时间介绍一些多年来引入的 JavaScript\
  \ 现代化特性，你在阅读 JavaScript 代码时很可能会遇到这些特性。这些都不是根本性的变革，但它们确实让 JavaScript 的读写变得稍微容易一些。\n\
  \nJavaScript 最初编写时的主要目标是简单、易于实现和易于学习。JavaScript 背后的基本思想非常简单，以至于其作者最初仅用 10 天就编写出了\
  \ JavaScript。然而，随着它作为一种编程语言变得越来越普及，越来越多的附加功能被添加进来。\n\n在本章中，我们将探讨一些多年来被添加到 JavaScript\
  \ 中且最常用的功能。此外，我们还将涉及一些重要但本书尚未讨论过的旧特性。\n\n## 16.1 使用 let 和 const 声明变量\n\n到目前为止，我们在本书中一直使用`var`关键字来声明变量。正如我们所注意到的，当在函数外部使用时，`var`声明一个全局变量；当在函数内部使用时，`var`声明一个局部变量，其作用域限定在包含它的函数内。然而，`var`有一些奇怪的行为，为了与旧代码向后兼容，这些行为需要保留，尽管使用这些行为可能并不明智。\n\
  \n首先，`var`关键字可以出现在函数中的*任何位置*，并且它仍然会反向应用于该函数中先前对该变量的使用。如果你使用`var`多次声明一个变量，所有这些声明都会被合并为一个单独的变量声明。最后，函数作用域是一个令人惊讶的特性，因为大多数编程语言在*块*级别划分作用域。\n\
  \n由于这些缺点，JavaScript 的较新版本引入了`let`关键字来声明变量。使用`let`与`var`非常相似，但有一些重要的区别：\n\n*   `let`关键字必须出现在使用该变量*之前*。\n\
  *   每次使用`let`关键字都会声明一个全新的变量。\n*   `let`关键字是块级作用域，而不是函数级作用域。\n*   如果你尝试在同一作用域内对同一个变量两次使用`let`，将会产生错误。\n\
  \n图 16-1 中的代码说明了这些差异。跟随学习将帮助你理解这两种声明变量方式在行为上的差异。\n\n另一个用于声明变量的关键字是`const`，它代表“常量”。它的工作方式与`let`非常相似，区别在于，一旦赋值，该变量就不能再被赋予其他值。这在两个方面很有帮助。首先，它使得\
  \ JavaScript 内部能够进行优化，如果你有需要快速执行的代码，这可以使你的代码运行得更快。其次，更重要的是，它帮助你记住哪些变量是实际变化的，哪些变量应该保持不变。`const`关键字会提醒你，这个变量只应被赋值一次，如果你忘记了，随后对该值的赋值将会产生错误。\n\
  \n图 16-1 的最后几行将会产生错误，因为常量值被重新赋值了。\n\n![](img/531249_1_En_16_Fig1_HTML.png)\n\n一个\
  \ 14 行的代码初始化变量`x`和`z`为 3，引用了函数作用域的`x`、全局的`z`，重新确认了`x`的存在，并为这个块创建了一个新的`y`。\n\n**图\
  \ 16-1 `let`和`var`之间的区别**\n\n在大多数现代 JavaScript 应用程序中，`let`和`const`比`var`更受青睐。我们主要使用`var`，因为它对初学者更宽容，并且反映了大量现有的\
  \ JavaScript 文档。然而，如果你进一步深入学习，你很可能会经常看到`let`和`const`。\n\n## 16.2 解构赋值\n\n一种可以节省大量输入的特性是所谓的**解构赋值**。假设你有一个数组`myary`，其值为`[23,\
  \ 43, 5]`。现在，假设你想将这些值分别赋给变量`x`、`y`和`z`。通常，你会像下面这样做：\n\n```\nlet x = myary[0];\n\
  let y = myary[1];\nlet z = myary[2];\n```\n\n然而，解构允许我们以一种简洁的方式告诉 JavaScript 如何执行赋值。以下是使用解构的相同赋值：\n\
  \n```\nlet [x, y, z] = myary;\n```\n\n这表示我们应该预期`myary`的结构与左侧相似，并相应地分配变量。数组中的任何其他成员都会被忽略，如果数组成员不足，变量将被赋值为`undefined`。\n\
  \n这也适用于对象。假设我们有一个如下所示的对象：\n\n```\nvar myobj = {\nfield1: \"val1\",\nfield2: \"val2\"\
  ,\nfield3: \"val3\"\n};\n```\n\n假设我们想将`field1`和`field2`提取到各自的变量中。可以按如下方式完成：\n\n\
  ```\nlet { field1, field2 } = myobj;\n```\n\n如果我们想将`field2`重命名为`myotherfield`，可以这样写：\n\
  \n```\nlet { field1, field2: myotherfield } = myobj;\n```\n\n当你想要从一个对象或数组中提取多个部分而无需编写复杂代码时，解构非常有用。你只需镜像左侧，使你要赋值的变量位于你期望的右侧的相同位置。你可以将数组嵌入对象中，再将对象嵌入数组中，以此类推。\n\
  \n如前所述，本书不旨在成为一本完整的 JavaScript 书籍，但我确实想让你了解一些既有帮助你又可能在现实世界中遇到的语法片段。\n\n## 16.3 使用字符串访问属性\n\
  \nJavaScript 从一开始就具备的一个重要特性是能够通过属性的字符串名称来访问属性。这允许将 JavaScript 对象用作极其灵活的数据存储。为了理解我的意思，让我们看一个示例对象。\n\
  \n```\nvar theperson = {\nname: \"Jim\",\nage: 20,\nhair: \"brown\"\n};\n```\n\n\
  \n\n现在，我们已经知道如何使用`theperson.name`或`theperson.age`访问该对象的单个属性。但是，我们也可以使用字符串形式的属性名来向对象请求某个属性。如果要获取`name`属性，可以通过`theperson[\"\
  name\"]`来实现。通过将其放在赋值语句的左侧，我们同样可以设置一个字段，无论该字段之前是否存在。\n\n因为这是一个字符串，我们也可以使用变量。\n\n\
  ```\nvar myfield = \"name\";\nalert(\"The person's name is \" + theperson[myfield]);\n\
  ```\n\n这意味着用户甚至可以指定他们想要访问的字段。\n\n```\nvar myfield = prompt(\"What field would you\
  \ like to read?\");\nalert(\"The value of that field is \" + theperson[myfield]);\n\
  ```\n\n这在对象字段的创建和使用中提供了极大的灵活性。事实上，属性名称可以是任意字符串，甚至不必通过“标准”语法访问。例如，我可以设置一个类似`theperson[\"\
  some,;/field–+\"]`的字段。如果尝试使用标准方法访问该字段，将会出现语法错误。但作为字符串，这是一次完全合法的操作。在许多情况下，让对象充当随机的键值对集合是很有用的。以这种方式使用对象可以实现这一点。在计算机编程中，以这种方式使用的对象有不同的称呼，例如**字典**、**哈希表**、**映射**或**关联数组**。\n\
  \n## 16.4 函数语法\n\n到目前为止，我们声明函数的方式如下：\n\n```\nvar myfuncname = function(param1, param2)\
  \ {\n// Function body here\n}\n```\n\n选择这种语法是为了强调*创建*函数与*为函数分配名称*之间的区别。我认为这样做有助于更轻松地理解如何创建函数并将其作为参数传递（就像我们在第\
  \ 14 章中所做的那样）。然而，还有另一种同时完成这两件事的语法，它更常用。上面同样的代码片段，使用这种语法，看起来像这样：\n\n```\nfunction\
  \ myfuncname(param1, param2) {\n// Function body here\n}\n```\n\n然而，现代 JavaScript\
  \ 又增加了一种创建函数的方法，即所谓的**lambda 函数**或**箭头函数**。^((10))使用 lambda/箭头函数创建相同的函数如下所示：\n\n\
  ```\nvar myfuncname = (param1, param2) => {\n// Function body here\n}\n```\n\n其含义（几乎）相同，但省去了冗长的`function`关键字。\n\
  \n它们与常规函数确实存在一些细微差别，但通常这些差别并不重要。主要区别如下：\n\n*   常规函数会获得另一个我们尚未讨论过的特殊变量，名为`arguments`。这本质上是一个包含传递给函数的所有参数的数组，允许使用比参数列表中显示的更多参数来调用函数。箭头函数没有这个特殊变量。\n\
  \n*   箭头函数不会覆盖`this`变量（参见第 15 章）。如果你想继承当前正在使用的`this`变量，箭头函数会有所帮助。如果你想创建对象方法，则应使用传统语法。\n\
  \n*   常规函数可以配合`new`关键字调用来构建对象（同样，参见第 15 章）。由于箭头函数不处理自己的`this`变量，因此不能以这种方式使用箭头函数。\n\
  \n因此，除了一些边界情况外，箭头函数与我们迄今为止使用的语法基本相同。然而，尽管看起来微不足道，但箭头函数不会覆盖`this`变量这一特性非常实用。如果你正在对象内部编写方法，并且需要动态创建函数，可以根据是否希望`this`被覆盖来选择使用常规函数或箭头函数。\n\
  \n### 16.4.1 回顾\n\n在本章中，我们学习了 JavaScript 中可用的其他语法。我们学习了以下内容：\n\n*   可以使用`let`和`const`关键字声明变量，以实现块级作用域和更清晰的行为。\n\
  \n*   使用`const`关键字声明的变量在声明后不应重新赋值。\n\n*   通过解构赋值，可以大大简化基于复杂对象和数组布局的变量赋值。\n\n*  \
  \ 箭头函数语法更紧凑，编写起来也更方便。\n\n*   箭头函数语法不会覆盖`this`特殊变量。\n\n### 16.4.2 学以致用\n\n1.  回顾你之前的程序，并使用`let`替换`var`来重写它们。\n\
  \n2.  检查一个程序，找到从未重新赋值的变量，并使用`const`关键字声明该变量。\n\n3.  重写一个使用函数的程序，使其使用箭头语法。\n\n4.\
  \  重写图 11-5 中的函数，使其使用解构语法将孩子的年龄放入单独的变量中。\n\n# 脚注\n\n## 17. 使用远程服务（API）\n\n现代计算机编程最基本的方面之一就是编写与服务器交互的程序。JavaScript\
  \ 主要是一种前端语言，意味着它通常处理与用户的交互。通常，你的数据存储、检索或操作都位于某个远程服务或数据库中。那么，如何访问这些服务呢？大多数现代服务（如果不是全部）都是通过\
  \ Web 上的 HTTP/HTTPS 请求进行访问的（回到第 3 章复习 HTTP）。本质上，服务器的构建方式是，URL 告诉服务器你想要或需要修改哪些数据，然后服务器做出相应的响应。因此，通过了解这些\
  \ URL 的结构以及服务器的期望，你可以构建 URL 和 HTTP 请求来获取、修改和操作服务器上的数据。\n\nURL 的结构及其应如何通过 HTTP 访问的具体细节被称为**应用程序编程接口**，简称\
  \ **API**。API 实际上指的是用于编程另一个系统的任何有文档记录的接口。例如，所有标准的 JavaScript 对象和函数（如`alert`、`prompt`、`document`等）都是\
  \ JavaScript API 的一部分。\n\n然而，在本章中，当我们提到 API 时，我们指的是远程服务在 HTTP 上公开的、有文档记录的接口。\n\n\
  许多 API 的使用是需要付费的，但有一个 API 现在是免费的，并且几乎可以确定将来也会保持免费，因为你已经通过纳税支付了它的费用：NASA 数据 API。该\
  \ API 为 NASA 收集和整理的各种数据提供了访问入口。NASA API 包括以下内容：\n\n*   每日天文一图\n*   地球卫星图像\n*   火星车照片\n\
  *   火星天气服务\n*   更多，远不止这些！\n\n你可以在`api.nasa.gov`找到关于 NASA API 的通用信息。\n\n\n\n# 17.1\
  \ 获取 API 密钥\n\n大多数 API 都需要知道你的身份，或者至少需要识别你是一个独立的个体。这样做的原因是，如果你开始滥用该平台（试图入侵、使用过多资源、添加不良数据等），API\
  \ 的运营者需要有能力取消你对 API 的访问权限。\n\n因此，大多数 API 至少要求进行最低限度的身份验证。执行这种身份验证的一种方法就是使用 `API\
  \ 密钥`。通常，`API 密钥`在访问网站时同时充当用户名和密码。有时它们需要保密，有时则不需要。但请注意，网页上传递给用户的*所有内容*（包括你的 JavaScript）对用户都是可见的，因此你不希望将任何*秘密*访问密钥包含在你的\
  \ JavaScript 中，或包含在你的 JavaScript 加载到浏览器的任何文件中。对于 NASA 数据 API 的情况，将你的 `API 密钥`包含在\
  \ JavaScript 文件中是完全没问题的。\n\n为了完成这些练习，你需要注册你自己的 API 密钥。为此，请访问 `api.nasa.gov` 并填写他们的“生成\
  \ API 密钥”表单。这将返回一个很长的字符串，如下所示（这并非真实 API 密钥）：\n\n```\nhgohi60L0JLMZProclQIY2ku1lXebMHfMlxXQ94E\n\
  ```\n\n你需要将其复制下来以备将来使用。在本章的所有示例中，我们将简单地将其称为 `APIKEY`。因此，无论你在何处看到 `APIKEY`，都请将其替换为你从\
  \ NASA 获得的值。\n\n你可以直接用浏览器测试你的 API 密钥。访问下面的 URL，你会看到关于 NASA 每日天文一图的信息：\n\n```\nhttps://api.nasa.gov/planetary/apod?api_key=APIKEY\n\
  ```\n\n这是一个特定的 URL，它执行一个预定义的功能，旨在供其他程序使用。这样的 URL 通常被称为`端点`。我们在本章将要做的就是让我们的 JavaScript\
  \ 代码访问并使用这些数据。\n\n# 17.2 JSON：数据的语言\n\n你可能已经注意到，我们在上一节中访问的 URL 里的数据看起来似曾相识。你可能觉得它惊人地像是一个\
  \ JavaScript 对象。实际上，这个 URL 生成的数据采用一种称为 JSON 的格式，JSON 代表 JavaScript 对象标记法（JavaScript\
  \ Object Notation）。它是 JavaScript 的一个子集，经常用于在互联网 API 上传输数据。\n\n在 JSON 之前，互联网 API\
  \ 的主要格式是 XML。XML 类似于 HTML，但你可以创建任意想要的标签。^((11)) 然而，最终 XML 使用起来比许多人预期的要困难得多。处理 XML\
  \ 是一项相当困难的编程任务，既耗时又容易出错。\n\n但是，使用 JSON，数据到来时*已经准备好可以放入变量中*。不需要进行真正的处理——它直接就能用。因此，读取和处理数据以使其成为可用形式的整个步骤都可以直接跳过。JSON\
  \ 数据以一种已经可用于程序的形式传输。\n\nJavaScript 提供了两个主要函数来读写 JSON（不过，正如我们将看到的，即使这两个函数最终也很大程度上变得没有必要）。要将一个对象或数组转换为\
  \ JSON，只需使用 `JSON.stringify()` 函数。该函数接受一个 JavaScript 值作为参数，然后返回一个字符串，该字符串是该对象的 JSON\
  \ 格式版本。\n\n另一个函数是 `JSON.parse()`，它接受一个 JSON 字符串并返回等效的 JavaScript 对象。下面的代码展示了这两个函数的实际应用：\n\
  \n```\nvar obj = {\nmykey: \"myval\",\nmyotherkey: [1, 2, 3]\n};\nvar str = JSON.stringify(obj);\n\
  console.log(str);\nvar newobj = JSON.parse(str);\nconsole.log(newobj);\n```\n\n\
  运行时，它首先会在控制台中记录一个*字符串*，该字符串包含对象的 JSON 表示形式，大致应该与 JavaScript 对象匹配。第二次记录的对象则是从处理 JSON\
  \ 代码创建的对象。作为一个术语说明，将编程语言的数据结构转换为可传输或可存储的结构（如字符串）被称为`序列化`，而将可传输/可存储的结构重新生成编程语言数据结构的过程被称为`反序列化`。\n\
  \n# 17.3 使用 JavaScript 访问网络\n\n既然我们对所使用的数据结构有了一点了解，现在可以看看如何使用 JavaScript 代码加载这些数据了。JavaScript\
  \ 提供了两种访问网络的机制。较旧的一种称为 `XMLHTTPRequest`。你会在很多旧代码中看到它。较新的（且更易于使用的）一种称为 Fetch API，以其主要函数\
  \ `fetch` 命名。\n\nFetch API 用一个例子最容易说明。那么，我们先来获取 NASA 每日天文一图的信息，并向用户显示标题。图 17-1 展示了代码。\n\
  \n这段代码以调用 `fetch` 开始，传入我们想要获取的 URL。然而，网络并不总是立即响应，但 `fetch` 函数会立即返回，以防你还有其他事情要做。但是，`fetch`\
  \ 函数返回的是一个称为 `Promise` 的对象。Promise 是一个封装了如下概念的对象：某些事情需要花费未知的时间来处理，而我们希望对结果进行某些操作。在这里，我们不知道传输数据需要多长时间，但是，一旦数据传输完成，我们就想处理它。`Promise`\
  \ 有一个名为 `then` 的函数，它向 `Promise` 提供一个函数，当 Promise 的所有处理完成后会调用该函数。这个函数应该接受一个参数，即我们试图执行的任何操作的结果。\n\
  \n![](img/531249_1_En_17_Fig1_HTML.png)\n\n一段 8 行 JavaScript 代码的 Fetch API 示例。它从链接获取图片，并弹出消息显示图片标题。\n\
  \n**图 17-1** Fetch API 的简单示例\n\n在我们的代码中，我们调用了 `then`，并传入一个函数，该函数接受一个参数 `response`，这是从与\
  \ NASA 的 Web 服务器通信后得到的响应。为了获取响应的 JSON 值，我们必须调用 response 的 `json` 函数，该函数会确保我们拥有所有数据，然后，假设数据是\
  \ JSON 格式，它会将其转换为 JavaScript 对象。然而，这本身也被包裹在一个 `Promise` 中，这要求我们调用 `then` 并传入一个函数，当所有数据准备就绪时，这个\
  \ Promise 会调用该函数。\n\n最后，当数据以参数 `jsonval` 的形式传入时，我们可以访问所有接收到的字段。这些字段与你之前直接访问 URL\
  \ 时观察到的字段相同。我们使用了 `title` 字段向用户显示。也请随意尝试其他字段。\n\n# 17.4 查询字符串\n\nURL 的末尾可以附加一个`查询字符串`（也称为`搜索参数`）。查询字符串是一组附加在\
  \ URL 末尾的 `key=value` 键值对，用于修改请求。这些键值对之间用 & 符号（`&`）分隔，整个查询字符串通过问号（`?`）与主 URL 分隔开。\n\
  \n实际上，我们正在访问的 URL 已经包含了一个简短的查询字符串。让我们再看一下这个 URL：\n\n```\nhttps://api.nasa.gov/planetary/apod?api_key=APIKEY\n\
  ```\n\n\n\n注意，在请求末尾的问号之后附加了一个单独的 `key=value` 对。API 也允许添加其他查询参数。虽然 API 在其查询字符串中支持许多键（你可以在\
  \ `api.nasa.gov` 上查看更多），但我们将重点关注一个：`date`。这将返回该特定日期的每日天文一图。API 规定此参数必须以特定格式给出，即\
  \ `YYYY-MM-DD`。因此，对于 2009 年 8 月 3 日，日期应格式化为 `2009-08-03`。以下 URL 将其包含在查询字符串中：\n\n\
  ```\nhttps://api.nasa.gov/planetary/apod?api_key=APIKEY&date=2009-08-03\n```\n\n\
  请注意，手动从字符串构造这些 URL 可能很诱人；有一个名为 `URLSearchParams` 的标准类可以为你处理此操作。要生成前面的 URL，你可以执行以下操作：\n\
  \n```\nvar query = {\napi_key: \"APIKEY\",\ndate: \"2009-08-03\"\n};\nvar query_string\
  \ = new URLSearchParams(query).toString();\nvar full_url = \"https://api.nasa.gov/planetary/apod?\"\
  \ + query_string;\n```\n\n通常在计算机编程中，最好使用提供的函数，而不是尝试自己动手，因为函数中通常处理了许多你可能未意识到的小细节和陷阱。如果你对格式或协议不够熟悉，或者不够仔细，最终可能会把事情搞得一团糟，甚至导致错误，或者更糟的是，引发安全问题。因此，当某些内容的格式将由计算机读取时，几乎总是最好使用标准函数来处理它们，而不是自行尝试。\n\
  \n![一个包含 17 行 HTML 的代码，其头部区域有 head 和 script，主体区域有标题、段落、文本类型的输入、按钮和图像源，以及页脚区域。](img/531249_1_En_17_Fig2_HTML.png)\n\
  \n**图 17-2** 每日天文一图查询工具（HTML）\n\n## 17.5 与网页交互\n\n在本节中，我们将展示如何同时利用读取 URL 的能力和使用查询字符串操作\
  \ URL 的能力，以使用每日天文一图构建一个完整的交互式页面。这里我们将展示一个按日期查询每日天文一图并为你显示该图片的工具。请注意，这要求用户按照上一节中指定的格式（`YYYY-MM-DD`）输入日期。\n\
  \n我们将用于此目的 HTML 如图 17-2 所示。相应的 JavaScript 代码如图 17-3 所示。\n\n![一个包含 21 行 JavaScript\
  \ 的代码，展示了与 API 和网页的连接点。第 1 行显示，let endpoint 等于 https://api.nasa.gov/planetary/apod。](img/531249_1_En_17_Fig3_HTML.png)\n\
  \n**图 17-3** 每日天文一图查询工具（JavaScript）\n\n如你所见，此代码具有与图 17-1 相同的基本结构，但通过以下方式进行了扩展：\n\
  \n1.  它由对 HTML 元素的点击触发。\n2.  它从 HTML 中提取一个额外的字段。\n3.  它使用 `URLSearchParams` 来构造查询字符串。\n\
  4.  它在完成后操作 HTML。\n\n你会发现，Web 编程中的很多内容正是由这类交互组成的。\n\n## 17.6 其他几点注意事项\n\n仅通过 URL\
  \ 和查询字符串访问网页能让你走得很远，但通过 URL 可以传递的数据量是有限的。出于这个原因（以及其他原因），还有其他方式可以向 Web 服务器传递数据。HTTP\
  \ 支持多种 HTTP **方法**（也称为**动词**）。我们到目前为止一直使用的标准方法是 `GET`。其他三种常见的方法是 `POST`、`PUT` 和\
  \ `DELETE`。\n\n这些方法是否以及如何工作完全取决于 API，但拥有这些不同动词的总体目标如下：\n\n\n\n-   `GET` 用于获取服务器上已存在的数据，这些数据通过特定的\
  \ URL 进行标识。\n-   `DELETE` 用于删除服务器上已存在的数据，这些数据通过特定的 URL 进行标识。\n-   `PUT` 用于更新服务器上已存在的数据，这些数据通过特定的\
  \ URL 进行标识。\n-   `POST` 用于创建服务器上尚不存在的数据。此处使用的 URL 通常每次创建新内容时都相同。\n\n由于 `PUT` 和 `POST`\
  \ 用于发送数据，它们还支持所谓的**实体主体（entity body）**或**负载（payload）**，可以随请求一起发送。这些数据的编码方式有多种，但最常见的两种是：(a)\
  \ 采用与查询字符串相同的格式，或 (b) 使用 JSON。在发送数据的同时，访问远程 API 时通常还需要发送特定的 HTTP 标头（我们在第 [3] 章中已了解了一些关于\
  \ HTTP 标头的内容）。其中一个特定的标头是 `Content-Type` 标头，大多数服务要求你在发送 `PUT`/`POST` 负载时附带此标头，以描述数据的格式（作为参考，查询字符串格式负载的\
  \ `Content-Type` 是 `application/x-www-form-urlencoded`，而 JSON 负载的 `Content-Type`\
  \ 是 `application/json`）。\n\n以下是一个使用 HTTP `POST` 方法发送负载的简单示例，以便你看到所有组成部分：\n\n```\n\
  var myobject = {\na: 1,\nb: \"someval\"\n};\nfetch(\"https://www.example.com/some_endpoint\"\
  , {\nmethod: \"post\",\nheaders: {\n\"Content-Type\": \"application/json\",\n\"\
  Other-Header\": \"My other header value\"\n},\nbody: JSON.stringify(myobject)\n\
  }).then((response) => {\n// Do something with the response.\n});\n```\n\n关于这一切如何组合在一起的详细信息，完全取决于你所访问的\
  \ API。本节仅告知你 API 文档通常会涉及哪些内容。\n\n### 关于 CORS 的说明\n\n我想花点时间向你介绍 CORS。这在一定程度上超出了本书的预期范围，但我认为在它给你造成问题之前提一下是有必要的。CORS\
  \ 代表“跨域资源共享”（cross-origin resource sharing），是一种浏览器安全功能，允许 Web 服务器告诉浏览器它们期望来自哪个网站的流量。其目的是防止一个页面上的浏览器窗口触发对另一个网站的操作。因此，在发起请求之前，浏览器会向服务器发送一个“预检”请求，以检查请求是否来自有效的来源。\n\
  \n我提到这一点是因为，如果你尝试访问某个 API 却不断收到错误，很可能是遇到了 CORS 错误。如果你在构建自己的 API（我们将在第 [18] 章中对此进行一些介绍），情况尤其如此。你必须明确地将任何接收请求的主机（这些主机与托管\
  \ JavaScript 的服务器不同）列入白名单。通常，如果存在 CORS 问题，JavaScript 控制台会提到“CORS”、“cross-origin”或“preflight”问题。\n\
  \n这里涉及很多细微差别，但我主要想让你在花数天时间试图弄清楚为什么某些东西不起作用之前，先了解这个问题。\n\n## 17.6.1 回顾\n\n在本章中，我们练习了使用\
  \ JavaScript 访问远程基于 JSON 的 API。我们学到了以下内容：\n\n- 程序员使用术语 **API** 来指代访问由其他开发者或组织构建的功能的文档化方式。\n\
  - 在 Web 上，API 通常基于针对特定、文档化的 URL 的 HTTP 请求。\n- NASA 有一个易于访问的 API，用于公开查询 NASA 数据，可在\
  \ `api.nasa.gov` 找到。\n- 许多 API 通过 API 密钥来管理访问，该密钥包含用户访问服务的凭证。\n- 许多 API 使用 JSON\
  \ 作为传输信息的格式，JSON 是一种基于 JavaScript 子集的格式。\n- JavaScript 包含 `JSON.stringify` 和 `JSON.parse`\
  \ 函数，用于在 JSON 字符串和 JavaScript 对象之间来回转换。\n- 标准 JavaScript 的 `fetch` 函数用于从 JSON 发起\
  \ HTTP 请求。\n- `fetch` 函数返回一个 `Promise`，然后向其提供一个在数据准备好时应调用的函数。\n- 可以通过查询字符串（通常使用\
  \ `key=value` 对格式化）经由 HTTP 发送附加数据。\n- HTTP 有多种可用于数据访问的方法。默认方法是 `GET`，但也有 `PUT`、`POST`\
  \ 和 `DELETE`。\n- `PUT` 和 `POST` 方法可以包含一个 HTTP 实体主体，以允许发送比 URL 单独支持更多的数据。\n- 使用 `fetch`\
  \ 函数，程序员还可以发送额外的 HTTP 标头。\n- CORS 是一种由浏览器实施的安全措施，用于控制哪些网页有权访问哪些 HTTP 端点。\n\n## 17.6.2\
  \ 学以致用\n\n1.  每日天文一图（APOD）也支持获取随机图像的数量，而不是特定日期的图像。修改图 [17-2] 和图 [17-3] 中的代码，去掉输入字段，只保留一个按钮，每次点击该按钮时获取三张随机图像。请注意，此时\
  \ API 将返回一个对象数组，而不仅仅是单个对象。你可以考虑使用 `console.log` 在开发时显示结果，以便你能确切地看到代码接收到的是什么。\n\n\
  2.  修改上一个程序，使用户可以输入他们想要查看的图片数量。请注意，对于此练习，你需要根据用户请求的图片数量动态添加和删除 `<img />` 标签。\n\n\
  3.  查看 NASA 的 API 列表。寻找一个你感兴趣的 API，并练习用浏览器访问它。然后，使用 HTML 和 JavaScript 编写一个用于访问该\
  \ API 的界面。\n\n## 18. 编写服务器端 JavaScript\n\n到目前为止，我们已经编写了用户界面，但我们只访问了*其他人的*服务器端代码。在本章中，我们将非常简要地介绍等式的另一侧，让你快速体验一下服务器端编程。本章的目标甚至不是让你完全做好进行服务器端编程的准备，这需要一整本额外的书。但我确实认为，至少了解一点这方面的内容对你来说很重要。\n\
  \n### 18.1 编程语言\n\n虽然 Web 编程的用户端（也称为**前端**或**客户端**编程）几乎完全使用 HTML 和 JavaScript 完成，但在服务器端（也称为**后端**编程），JavaScript\
  \ 实际上很少使用。此外，编程语言很少单独使用，而是与**应用程序框架**一起使用，这些框架自动完成了服务器端编程所需的许多任务。请注意，也有前端应用程序框架（例如，React、JQuery\
  \ 和 Angular），但编写没有框架的前端应用程序要比编写没有框架的后端应用程序容易得多。\n\n以下是服务器端常用的一些编程语言，括号中列出了它们常见的应用程序框架名称：\n\
  \n- Go（Gin、Iris、go-kit）\n- Python（Django、Masonite、TurboGears）\n- Ruby（Rails、Sinatra）\n\
  - Java（Spring Boot、Quarkus）\n- PHP（Laravel、Symfony、Zend、Wordpress）\n- C#（ASP.NET）\n\
  - JavaScript（Express）\n\n\n\n### 编程语言与框架的选择\n\n编程语言（及其框架）的列表几乎无穷无尽，每种都有其优缺点。我的建议是（为你下一本书的购买）选择一种看起来容易上手的语言。这可能不是你最终会坚持使用的语言，但早期轻松的成功能帮助你更熟悉整个运作方式。有时复杂的框架是必要的，但从简单的东西开始更好，这样你就能获得经验，理解为什么复杂的框架需要那些复杂性。\n\
  \n就我个人而言，如果我想快速编写某些东西，我会使用`Ruby`和`Rails`框架。当`Rails`首次推出时，你可以用之前仅需 10%的代码量编写相同的应用程序！如今，`Rails`的许多特性已被其他框架采纳，但我仍然认为`Rails`是最容易快速编写服务端应用的框架。\n\
  \n除此之外，我通常根据我所在公司的需求编写代码。大多数公司不希望维护大量用不同语言编写的程序，因此它们通常会尽量标准化为少数几种语言。这意味着总的来说，你通常无法选择自己使用的服务端语言，所以你应该做好准备，在你的职业生涯中可能需要学习多种语言。\n\
  \n在本章中，既然我们已经花时间学习了`JavaScript`，我们将使用`JavaScript`和`Express`框架做一个简单的示例。\n\n## 18.2\
  \ 在浏览器之外使用 JavaScript\n\n最初，你只能在浏览器中使用`JavaScript`。然而，由于`JavaScript`已成为一种几乎通用的语言，每个开发者都需要了解一些相关知识，最终人们决定：既然它在浏览器中如此有用，为什么不在服务端使用呢？因此，一群开发者提取了谷歌`Chrome`浏览器的开源`JavaScript`引擎，将其从浏览器中剥离，并创建了`Node.js`（通常简称为`Node`），一个非浏览器环境的`JavaScript`引擎。\n\
  \n你可以从`nodejs.org`下载`Node`并安装到自己的电脑上。你需要使用命令行来运行本节中的命令。你可以在附录 B.2 中找到命令行的简短介绍。\n\
  \n以下是一个简单的`Node`应用，它只向输出写入内容。你可以将此文件命名为`myapp.js`。\n\n```\nconsole.log(\"Welcome\
  \ to Node!\");\n```\n\n安装`Node`后，你可以通过命令行使用`Node`运行这个`JavaScript`文件，输入`node myapp.js`即可。`Node`的语言特性与标准`JavaScript`完全相同，但基于浏览器的特性（如`alert`、`prompt`、`document`等）缺失了，同时包含了一些额外的功能。\n\
  \n## 18.3 使用 Node 的小型 Web 服务\n\n图 18-1 展示了一个用`Node`编写的小型 HTTP 服务示例（将其保存为文件`nodeserver.js`）。该服务将在端口\
  \ 3000（一个非标准 HTTP 端口）上监听请求，然后无论请求的 URL 是什么，它都会返回包含请求 URL 和一条消息的 JSON 数据。\n\n这段代码引入了一个我们尚未讨论过的新的语言特性——`JavaScript`\
  \ **模块**。模块是`JavaScript`将代码打包成一个单元的方式。只有当应用程序请求该代码时，它才会被处理。`require`函数加载一个`JavaScript`模块，然后该模块可以被赋值给一个变量，用于访问模块的内容。在这里，提供\
  \ HTTP 服务功能的特性位于一个名为`http`的模块中，该模块被加载并赋值给一个同名变量。从此，`http`的工作方式就像一个普通的`JavaScript`对象。\n\
  \n`http`对象有一个`createServer`函数。这个函数接受一个函数作为参数，该参数函数接收一个请求对象（浏览器发送的内容）和一个响应对象（我们将用它来发送响应），然后处理该请求。每当有人访问我们的服务器时，这个函数就会被调用。然后，这个服务器被告知在端口\
  \ 3000 上监听请求。选择端口 3000 是因为某些计算机上已有服务在标准 HTTP 端口上监听，因此我们使用一个在所有计算机上可能都空闲的备用端口。\n\n\
  ![](img/531249_1_En_18_Fig1_HTML.png)\n\n一个 11 行的 JavaScript 程序代码。第 1 行：`const http\
  \ = require('http');`。它在端口 3000 上监听请求，并有一条消息为\"hello\"。\n\n**图 18-1 Node 中的小型 Web\
  \ 服务**\n\n你可以通过在命令行运行`node nodeserver.js`来执行这段代码。然后可以通过浏览器访问`http://localhost:3000/whatever`来访问它。我们使用`http`而不是`https`，因为使用`HTTPS`需要大量额外的设置。`localhost`是一个标准名称，指的是浏览器所在的本机。`：3000`这个附加部分告诉浏览器查看端口\
  \ 3000 而不是标准端口（80）。然后路径是其后的一切内容（从斜杠开始）。服务器函数将响应任何给定的路径。\n\n## 18.4 为什么需要框架\n\n在这个示例中，我们的服务器通过运行*相同*的函数来响应*每个*请求。如果你有多个端点，这就会变得很棘手。这样想——你需要检查每个可能的端点\
  \ URL，并编写一大堆`if`语句来判断应该调用哪个函数。因此，框架的标准特性之一就是执行**请求路由**。请求路由意味着将 URL 端点与应处理它们的函数进行匹配。对于两三个端点而言，运行一系列`if`语句并不麻烦，但大多数应用程序有*数百个*端点，这时就需要一种更优雅的方法。\n\
  \n此外，你的应用程序很可能需要存储某些数据。虽然你*可以*将其存储在文件系统中（并且有允许你这样做的函数），但由于多种原因，这通常被视为不良实践。相反，数据通常存储在数据库中。然而，连接数据库、查询数据库并以可用形式将数据返回给应用程序的过程有时相当耗时。因此，这些操作也常常借助框架来完成。\n\
  \n框架通常还具有其他特性，例如任务调度（即在午夜运行报告并发送到某处）、资源管理（确保没有人过于频繁地调用某个端点）、与其他服务交互以及预构建的数据操作函数。由于所有这些特性，应用程序开发者通常选择使用完整的框架，而不是直接处理服务请求。\n\
  \n## 18.5 让你的服务可用\n\n在自己的机器上运行 HTTP 服务器是一回事，但真正想要的是让它对全世界可用。我不会告诉你具体如何操作（再说一次，那将是另一本书的内容），但我可以告诉你所需的基本步骤。\n\
  \n-   你需要从托管服务商处租用一台服务器。我个人最喜欢的托管服务商是`Linode`，但有无数其他选择，例如`Digital Ocean`、`Azure`、`Bluehost`、`InMotion`、`AWS`^((12))和`Hostinger`。\n\
  -   你需要配置服务器，使其运行你选择的语言和框架。\n-   你需要将应用程序安装到服务器上。\n-   你需要确保你的应用程序在服务器启动时自动启动。\n\
  -   你需要为你的服务注册一个域名。\n-   你需要确保域名的 DNS 记录指向你服务的正确 IP 地址。\n\n\n\n### 排版后的内容\n\n您需要在服务器上注册、安装并维护\
  \ SSL 证书，才能启用 HTTPS 连接。\n\n随着服务规模扩大，您需要考虑让服务实现**弹性扩展**（即利用更多机器来提升运行速度）。为此，我推荐我的著作\
  \ *Cloud Native Applications with Docker and Kubernetes*。\n\n## 18.5.1 回顾\n\n本章简要介绍了服务端开发的相关内容。我们学到了以下知识：\n\
  \n*   前端编程主要涉及 HTML 与 JavaScript，而后端编程则可使用多种语言。\n*   在没有浏览器的环境中，使用 `Node.js` 来启用\
  \ JavaScript 编程。\n*   模块是一组 JavaScript 功能包，可通过 `require` 函数请求并存储到变量中。\n*   `Node.js`\
  \ 内置了 `http` 模块，方便您编写 HTTP 服务代码。\n*   HTTP 服务中常见的任务（如请求路由、数据库访问、任务调度以及访问其他服务）需要借助应用框架来完成。\n\
  *   要使应用对公众可用，还需经过许多其他步骤，包括：寻找托管服务商、将代码加载到远程服务器，以及在 DNS 系统中注册和设置域名。\n\n## 18.5.2\
  \ 实践所学\n\n1.  修改图 18-1 中的代码，使其对路径 `/mypath1` 和 `/mypath2` 返回不同的消息。\n2.  扩展 Web 服务器，定义一个哈希表（参见第\
  \ 16 章），其中键为路径，值为要发送的消息。使用哈希表查找而非 `if` 语句来找到合适的消息。\n3.  进一步扩展上述方法，使值不再包含字符串消息，而是一个待执行的函数，该函数将请求和响应对象作为参数传入。这样做与应用服务器的路由方式非常相似。\n\
  4.  查阅本章提到的几个托管服务商。他们提供什么服务？费用是多少？定价方式如何？\n\n# 脚注\n\n## 19. 结语\n\n恭喜——您已经迈入了广阔编程世界的第一步。本书向您介绍了计算机、互联网、网页、CSS\
  \ 和 JavaScript 的基础知识。然而，本书当然没有教您关于这些主题的全部知识。希望您现在对编写和运行程序的过程，以及使程序成功运行所需的思维工作有了基本的了解。接下来走向何方，取决于您自己。如果您喜欢网站相关，那么应该更深入地研究本书涵盖的主题——HTML、CSS\
  \ 和 JavaScript。学习一个 JavaScript 框架，比如 `React` 或 `JQuery`，可能也是个好主意。除此之外，还有许多针对不同设备和应用程序的专用工具、语言和技术。例如，用于数据库系统、手机应用、电商应用、游戏、微控制器系统（带有小芯片的微型设备）以及桌面应用程序的工具和语言，各有其专用的工具和语言。\n\
  \n然而，学习第一门编程语言通常是最难的。一旦您习惯了语句、循环、变量和函数的概念，那么即使不同的语言有不同的实现方式，您也已经训练了自己的思维，能够用这些术语来思考。学习\
  \ JavaScript 可能很有挑战性，但它应该会让您学习下一门语言轻松得多。\n\n请记住，软件开发是动态变化的。程序员需要用一生中的大量时间来掌握不断变化的新语言、新工具和新技术。\n\
