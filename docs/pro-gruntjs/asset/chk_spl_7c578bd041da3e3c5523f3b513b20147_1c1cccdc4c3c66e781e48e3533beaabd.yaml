  - 如果“内容速览”(no:56) 和 “目录”(no:82) 都在正文之前，且规则要求前置内容统一划分，那么它们应该属于同一个“前置部分”章节，或者至少“目录”本身不是一个拥有大量正文内容的“章”，而只是一个索引页。将目录页单独划为一章在某些系统中是合理的，但如果“内容速览”也被划了，那么它们是否应该合并？更关键的是，目录通常被视为元数据，而非正文章节。如果系统要求前置内容合并为一章，那么“目录”就不应独立分章。
