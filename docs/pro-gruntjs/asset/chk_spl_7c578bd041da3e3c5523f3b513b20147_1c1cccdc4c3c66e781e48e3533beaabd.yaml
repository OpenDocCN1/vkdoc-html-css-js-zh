- 'no': 286
  overturn_probability: 0.8
  alternative: 前置内容小标题（关于作者）
  counter_evidence:
  - '`## 关于作者` 是二级标题。'
  - 根据规则“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章”，这部分内容通常归属于一个“前置部分”大章，或者如果系统粒度较细，可能各自独立。
  - 但关键在于层级：它是 `##`，而全书最高层级是 `#`（如 `# 第 1 章`）。规则指出“只划分全书最高层级的大章”。`##` 通常是节标题，不独立成章，除非它是最高层级。在这里，`#`
    是最高层级（如 no:340 `# 第 1 章`）。`##` 不应独立成章，应归属于其所属的 `#` 级章节（即前置部分章）。
  - 如果前置部分没有用 `#` 标识为一个整体章，那么 `##` 级别的“关于作者”确实可能被误判。但根据“只划分最高层级”的原则，`##` 不应该触发分章。
  keep_split: false
