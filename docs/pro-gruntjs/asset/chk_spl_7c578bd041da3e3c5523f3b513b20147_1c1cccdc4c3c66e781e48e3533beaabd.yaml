- 'no': 2
  overturn_probability: 0.8
  alternative: 封面页/书名行
  counter_evidence:
  - 该行是 Markdown 的一级标题 `# 精通 `Grunt.js``，且紧接着是封面图片 `![](img/cover.jpeg)`，符合书籍封面或扉页的排版特征。
  - 根据规则“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章”，封面及前置内容（如版权页、目录等）通常归为一章，而非每一行都划分。虽然它标志着文档开始，但通常作为“前置部分”的第一章起点即可，或者如果后续有目录、关于作者等，它们都属于前置部分。更关键的是，如果将封面单独划为一章，后续的“内容速览”(no:56)、“目录”(no:82)、“关于作者”(no:286)等是否也各自独立？通常这类书的结构是：前置部分（包含封面、目录、关于作者等）可能合并或按大块划分，但封面本身仅作为文档起始，有时会被忽略或合并入第一个实质章节前的部分。然而，严格来说，如果原判断认为它是章节，我们需要看它是否像一个“章”。封面标题通常是书名，不是章节标题。它不具备“统领性、概括性，能覆盖后续内容”的特征（除了它是书名）。因此，它更像是一个文档标识，而非章节标题。
  keep_split: false
