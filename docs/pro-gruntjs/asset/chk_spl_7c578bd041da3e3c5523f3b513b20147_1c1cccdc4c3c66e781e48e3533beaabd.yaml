  - 其后紧跟的是具体的章节列表（第1章、第2章等），以及“关于作者”、“致谢”等前置内容的列表项。
  - 根据规则“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章”，整个前置部分（从封面到目录结束）通常被视为一个整体章节，或者“内容速览”只是目录页的一个标题，不应单独划分为一个新的正文大章。如果后续有“#
    目录”(no:82)，则“内容速览”可能是目录页的一部分，或者是OCR识别出的一个子标题。即使它是一个独立的前置部分标题，它也与后续的“# 目录”、“# 关于作者”等属于同一类“前置内容”，规则倾向于将这部分统一管理，而不是每个小标题都分章。
  keep_split: false
