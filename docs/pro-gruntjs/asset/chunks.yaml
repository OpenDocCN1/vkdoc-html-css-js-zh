- fmt: "# Extracting Common Configuration Options\n\nThe final optimization that we\
    \ can make the organization of our Grunt configuration is to extract common configuration\
    \ options from each task configuration. For example, instead of hard-coding the\
    \ path to our distribution folder, we can define it once and reuse it throughout\
    \ our configuration, following the principles of Don’t Repeat Yourself. We can\
    \ achieve this, as Grunt allows us to define variables within our task configuration.\
    \ [Listing 7-20](#part0014.html#list20) contains the modified configuration for\
    \ `grunt-contrib-cssmin`.\n\n[***Listing 7-20***](#part0014.html#_list20). Use\
    \ of Variables in Grunt Plug-in Configuration\n\n```\n'use strict';\n\nmodule.exports\
    \ = function (grunt) {\n  grunt.config(\n    'cssmin', {\n    dist: {\n      options:\
    \ {\n        report: 'gzip'\n      },\n      files: {\n        '<%= paths.css.dest\
    \ %>main.css': '<%= paths.css.src %>main.css'\n      }\n    }\n  });\n};\n```\n\
    \nBy separating our task configuration from common paths such as the source and\
    \ destination folders, we make our tasks less brittle and even increase the reuse\
    \ across projects. To use this approach, we must define these variables in Grunt\
    \ configuration. [Listing 7-21](#part0014.html#list21) contains a new module that\
    \ can be added to the `tasks` folder. This module will be called `config.js`.\n\
    \n[***Listing 7-21***](#part0014.html#_list21). Sample Configuration Module\n\n\
    ```\n'use strict';\n\nmodule.exports = function (grunt) {\n  grunt.config.merge({\n\
    \    paths: {\n      css: {\n        src: 'app/css/',\n        dest: 'dest/css/'\n\
    \      }\n    }\n  });\n};\n```\n\nThe configuration module defines a set of key/value\
    \ pairs that can then be used within our Grunt task configuration. [Listing 7-21](#part0014.html#list21)\
    \ shows a very small subset of the overall configuration required for the project.\
    \ It can be extended to include properties such as the port numbers used for local\
    \ development. As discussed in the previous section, we can also use `grunt options`\
    \ to switch our configurations per environment, for example, if the paths differ\
    \ on your local development environment compared to your continuous integration\
    \ environment. Another good use case for having environment-based configuration\
    \ is your test runner. Locally, you may choose to run only your tests in a headless\
    \ browser, for speed and efficiency. However, in your test environment, you may\
    \ want to run the tests against a number of browsers.\n\nThis brings us to the\
    \ end of our discussion on Grunt configuration optimization. At the end of this\
    \ process, our `Gruntfile` has been reduced down to 22 lines, and each task configuration\
    \ is now managed by a separate module, with common paths being shared to allow\
    \ us to easily update our project structure. Next, we’ll return to exploring approaches\
    \ to reduce the runtime of the Grunt task runner.\n\n## Running Tasks in Parallel\n\
    \nIn the previous section, we started to group tasks into logical groups, which\
    \ was a great approach to generalizing our task runner and communicating it throughout\
    \ a team. Grouping tasks together has not reduced the total time; however, it\
    \ does make our next optimization a little easier. In this section, we’ll explore\
    \ running tasks in parallel. As Grunt is a task runner based on files, the files\
    \ output from a task are input into the next task, which leads to problems when\
    \ trying to parallelize parts of the build. For example, we cannot run our CSS\
    \ minification process until our SASS compilation has completed and output. However,\
    \ there are sections of our build process that can be parallelized, for example,\
    \ our CSS tasks can be run at the same time as our JavaScript tasks.\n\nTo achieve\
    \ parallel running of tasks, we must introduce a new plug-in to the project. The\
    \ plug-in required to parallelize our build is called `grunt-concurrent`. [Listing\
    \ 7-22](#part0014.html#list22) shows how to include the plug-in into the project.\n\
    \n[***Listing 7-22***](#part0014.html#_list22). Adding `grunt-concurrent` to the\
    \ Project\n\n```\nnpm install --save-dev grunt-concurrent\n```\n\nNow that the\
    \ plug-in has been added to our project, we must define configuration. To do this,\
    \ we create a new configuration file in the `tasks` folder (see [Listing 7-23](#part0014.html#list23)).\n\
    \n[***Listing 7-23***](#part0014.html#_list23). Configuration for `grunt-concurrent`\n\
    \n```\n'use strict';\n\nmodule.exports = function (grunt) {\n  grunt.config(\n\
    \    'concurrent', {\n    assets: ['css', 'js']\n  });\n};\n```\n\nThis configuration\
    \ defined in [Listing 7-23](#part0014.html#list23) is simple and defines a single\
    \ set of concurrent tasks. The value assigned to the `assets` property is an array\
    \ of tasks to be run concurrently. To run these tasks in parallel, you can use\
