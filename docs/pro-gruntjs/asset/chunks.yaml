    \ --save-dev\n```\n\n请注意，我们的插件是一个 Node.js 包，并且我们还将依赖关系保存到了 `package.json` 中（通过在\
    \ `install` 命令中传递 `--save-dev`）。重新运行 `grunt` 命令现在会返回成功消息。然而，由于我们的源文件还不存在，`dist`\
    \ 文件夹中的输出文件 `built.js` 目前是空的。\n\n在项目中创建一个名为 `src` 的新文件夹。在此文件夹内，创建 `fileA.js` 和\
    \ `fileB.js`。在每个文件中，分别放入两段不同的内容（建议我分别放入“A”和“B”）。重新运行 `grunt` 任务后，`built.js` 文件现在应包含\
    \ `fileA.js` 和 `fileB.js` 的内容，并用 `;` 合并和分隔（参见图 2-12）。\n\n![9781484200148_Fig02-12.jpg](img/00018.jpeg)\n\
    \nFigure 2-12. 合并后的输出\n\n因此，我们已在项目上成功安装、配置并运行了 Grunt。在探索 Grunt 优化工作流程的各种方法之前，了解\
    \ Grunt 背后的关键概念非常重要。让我们从配置任务开始。\n\n## 配置任务\n\n如前所述，任务的配置包含在项目的 `Gruntfile` 中。在此\
    \ `Gruntfile` 内部，配置通过 `grunt.initConfig` 方法传递给 Grunt。传递给 `grunt.initConfig` 的大部分配置将位于以任务命名的属性下，但也可以包含任意数据。如果配置中的属性与任务名称冲突，则这些属性会被忽略。\n\
    \n由于 `Gruntfile` 是 JavaScript（或者如果你选择的话，也可以是 CoffeeScript）文件，配置并不严格局限于 JSON。这使得任务配置非常强大，因为它可以通过编程方式生成。为了阐明这一原理，让我们重新审视第一个\
    \ `Gruntfile`，并将文件位置指定为配置的一部分（参见清单 2-13）。\n\n***清单 2-13***. 在 Gruntfile 中使用变量\n\
    \n```\nmodule.exports = function(grunt) {\n\nvar app_files = ['src/fileA.js',\
    \ 'src/fileB.js'],\n         output = 'dist/built.js';\n\n// Project configuration.\n\
    \  grunt.initConfig({\n    pkg: grunt.file.readJSON('package.json'),\n\nconcat:\
    \ {\n      options: {\n        separator: ';',\n      },\n      dist: {\n    \
    \    src: app_files,\n        dest: output\n      }\n    }\n  });\n\n// Load the\
    \ plugin that provides the \"concat\" task.\n  grunt.loadNpmTasks('grunt-contrib-concat');\n\
    };\n```\n\n在上面的 `Gruntfile` 中，我们将源文件和输出文件的定义分别移到了任意属性 `app_files` 和 `output` 中。随后，我们更新了任务配置来使用这些属性。\n\
    \n当运行 `grunt` 时，它会扫描配置对象，寻找与任务名称匹配的属性。此配置将被应用到任务提供的默认配置之上。任务还允许指定多个配置；每组配置被称为一个目标（`target`）。每个目标都有一个任意名称。以下\
    \ `Gruntfile`（清单 2-14）扩展了我们之前的版本，添加了一个名为 `test` 的额外目标。\n\n***清单 2-14***. 多目标允许我们从同一个\
    \ Gruntfile 以多种方式配置任务\n\n```\nmodule.exports = function(grunt) {\n\nvar app_files\
    \ = ['src/fileA.js', 'src/fileB.js'],\n         output = 'dist/built.js',\n  \
    \  test_output = 'test/built.js';\n\n// Project configuration.\n  grunt.initConfig({\n\
    \    pkg: grunt.file.readJSON('package.json'),\n\nconcat: {\n      options: {\n\
    \        separator: ';',\n      },\n      dist: {\n        src: app_files,\n \
    \       dest: output\n      },\n      test: {\n        src: app_files,\n     \
    \   dest: test_output\n      }\n    }\n  });\n\n// Load the plugin that provides\
    \ the \"concat\" task.\n  grunt.loadNpmTasks('grunt-contrib-concat');\n};\n```\n\
    \n有了额外的目标，我们将合并后的文件输出到一个新的位置，即 `test` 文件夹。Grunt 提供了运行特定目标或所有目标的能力。要运行特定目标，可以使用以下命令：\n\
    \n```\ngrunt concat:test\n```\n\n上述命令将仅运行名为 `concat` 的任务中名为 `test` 的目标。要运行给定任务的所有目标，可以省略目标名称，如下面的代码所示。运行该命令将依次执行\
    \ `dist` 和 `test` 目标。\n\n```\ngrunt concat\n```\n\n这会遍历每个目标并依次执行它们。上述命令的输出可以在图\
    \ 2-13 中看到。\n\n![9781484200148_Fig02-13.jpg](img/00019.jpeg)\n\nFigure 2-13. 运行多个目标时的输出\n\
    \n在任务配置中，可以指定 `options` 参数来覆盖任务设置的默认值。这些选项可以被目标级别的选项覆盖。目标级别选项由目标内的 `options` 属性定义。在以下示例（清单\
    \ 2-15）中，我们的 `Gruntfile` 已被修改，以更改 `test` 目标的分隔符。\n\n***清单 2-15***. 使用选项的示例\n\n\
    ```\nmodule.exports = function(grunt) {\n\nvar app_files = ['src/fileA.js', 'src/fileB.js'],\n\
    \         output = 'dist/built.js',\n    test_output = 'test/built.js';\n\n//\
    \ Project configuration.\n  grunt.initConfig({\n    pkg: grunt.file.readJSON('package.json'),\n\
    \nconcat: {\n      options: {\n        separator: ';',\n      },\n      dist:\
    \ {\n        src: app_files,\n        dest: output\n      },\n      test: {\n\
    \        options: {\n          separator: ' ',\n        },\n        src: app_files,\n\
    \        dest: test_output\n      }\n    }\n  });\n\n// Load the plugin that provides\
    \ the \"concat\" task.\n  grunt.loadNpmTasks('grunt-contrib-concat');\n};\n```\n\
    \n上述配置将用值 `;` 覆盖由 `concat` 任务为所有目标设置的默认分隔符。此外，`test` 目标覆盖了此设置，并指定分隔符为单个空格。\n\n\
    本章的最后一部分涵盖了 Grunt 为选择每个任务的输入和输出文件提供的各种选项。\n\n## 使用文件\n\nGrunt 提供了一个丰富且强大的 API，用于选择任务将要操作的文件。有多种方法可以为每个任务声明源文件和目标文件的映射，每种方法在复杂性和灵活性方面各有不同。\n\
    \n### 紧凑格式\n"
- fmt: "# Compact File Format\n\nThe compact file format is commonly used for read-only\
    \ tasks. As it accepts a single source-destination file mapping, the `src` property\
    \ does not require a matching `dest` property. It would be used for tasks that\
    \ operate on a set of files and report back the status for these files. An example\
    \ of such a task might be a unit test runner that operates on a set of test cases\
    \ and reports the outcome of each test.\n\nFollowing is an example of the compact\
    \ file format ([Listing 2-16](#part0009.html#list16)) using the `grunt-mocha-test`\
    \ plug-in. For those unfamiliar with Mocha ([http://mochajs.org/](http://mochajs.org/)),\
    \ it is a JavaScript test runner.\n\n[***Listing 2-16***](#part0009.html#_list16).\
    \ Using the Compact File Format to Run Mocha Tests\n\n```\nmodule.exports = function(grunt)\
    \ {\n\ngrunt.initConfig({\n    // Configure a mochaTest task\n    mochaTest: {\n\
    \      test: {\n        options: {\n          reporter: 'spec'\n        },\n \
    \       src: ['test/**/*.js']\n      }\n    }\n  });\n\n// Add the grunt-mocha-test\
    \ tasks.\n  grunt.loadNpmTasks('grunt-mocha-test');\n  grunt.registerTask('default',\
    \ 'mochaTest');\n\n};\n```\n\nThe preceding `Gruntfile` loads the `grunt-mocha-test`\
    \ plug-in and uses it to operate on all files in the `test` folder that have the\
    \ extension `.js`. To match on all files within the `test` directory, we’ve used\
    \ a wildcard pattern. The pattern used will match all files within the top-level\
    \ `test` directory and any subdirectories of it. If we wished only to match on\
    \ files within the top-level `test` folder, we could simplify our pattern to `*.js`.\
    \ The important thing to note here is the lack of a `dest` property, as a task\
    \ does not output to a file.\n\n# File Object Format\n\nThe file object format\
    \ allows for multiple source-destination file mappings. The file object format\
    \ declares the mapping as a JavaScript object wherein the destination is the property\
    \ key, while the value can be one or more source files. As each mapping is essentially\
    \ keyed by the “destination” file, there can be many mappings per target. This\
    \ format is commonly used when you want to reduce a set of files into a single\
    \ file, such as in the case of concatenating JavaScript.\n\nThe following `Gruntfile`\
    \ ([Listing 2-17](#part0009.html#list17)) demonstrates the use of the file object\
    \ format.\n\n[***Listing 2-17***](#part0009.html#_list17). Using the File Object\
    \ Format to Concatenate Files\n\n```\nmodule.exports = function(grunt) {\n\n//\
    \ Project configuration.\n  grunt.initConfig({\n    pkg: grunt.file.readJSON('package.json'),\n\
    \nconcat: {\n      options: {\n        separator: ';',\n      },\n      dist:\
    \ {\n        files: {\n          'build/app.js': ['src/fileA.js', 'src/fileB.js']\n\
    \        }\n      }\n    }\n  });\n\n// Load the plugin that provides the \"concat\"\
    \ task.\n  grunt.loadNpmTasks('grunt-contrib-concat');\n};\n```\n\nThe preceding\
    \ `Gruntfile` revisits our earlier example, but instead of defining `src` and\
    \ `dest` properties, the destination file is defined as the property name itself.\n\
    \n# Files Array Format\n\nThe files array format extends the compact format by\
    \ allowing multiple source-destination mappings per target. Instead of taking\
    \ a single `src` and `dest` property, the files are declared as a `files` property,\
    \ and the value of this property is an array of the compact format. The following\
    \ example ([Listing 2-18](#part0009.html#list18)) modifies our existing example\
    \ by adding CSS concatenation into the same target.\n\n[***Listing 2-18***](#part0009.html#_list18).\
    \ Use File Array Format to Concatenate Multiple Files Together\n\n```\nmodule.exports\
    \ = function(grunt) {\n\n// Project configuration.\n  grunt.initConfig({\n   \
    \ pkg: grunt.file.readJSON('package.json'),\n\nconcat: {\n      options: {\n \
    \       separator: ';',\n      },\n      dist: {\n        files: [\n         \
    \ {src: ['src/fileA.js', 'src/fileB.js'], dest: 'build/app.js'},\n          {src:\
    \ ['src/stylesA.css', 'src/stylesB.css'], dest: 'build/app.css'}\n        ]\n\
    \      }\n    }\n  });\n\n// Load the plugin that provides the \"concat\" task.\n\
    \  grunt.loadNpmTasks('grunt-contrib-concat');\n};\n```\n\nIn the preceding example,\
    \ the `src` and `dest` properties have been replaced with a `files` property.\
    \ The `files` property is assigned an array of objects. Each object has `src`\
    \ and `dest` properties, allowing multiple source-destination mappings to be declared.\
    \ The output for the `dist` target will be `build/app.js` and `build/app.css`.\n\
    \n# Summary\n\nIn this chapter, you’ve begun to explore how we can introduce Grunt\
    \ into a project. You started by becoming familiar with Node and npm, as these\
    \ are fundamental to understanding how Grunt and its plug-in ecosystem work. The\
    \ remainder of this chapter discussed installing Grunt into a project, how to\
    \ install our first task, and how to provide the required configuration for the\
    \ task. Finally, the flexible API that Grunt provides for pattern matching files\
    \ within our project, to define inputs and outputs for our tasks, was introduced.\n\
    \nThe next chapter will begin to look at real-world use cases for employing Grunt\
    \ to automate common tasks associated with HTML and CSS.\n\n# CHAPTER 3\n\n![image](images/00005.jpeg)\n\
    \n# Using Grunt with HTML and CSS\n\nIn the previous chapter, we explored how\
    \ to bootstrap a project to use Grunt and how to install and configure tasks within\
    \ a project. Next, we’ll look at a variety of useful plug-ins that can help with\
    \ our workflow when working with HTML and CSS, the fundamentals of the Web. The\
    \ topics covered in this chapter include CSS preprocessing, simplifying installation\
    \ of third-party dependencies, and optimizing content for release to the public.\n\
    \nBefore we explore the tasks available to automate while working with HTML and\
    \ CSS, let me introduce the project we’ll use to demonstrate all the fantastic\
    \ plug-ins available.\n\n## The Demo App\n\nThroughout the remainder of the book,\
    \ we will look at a variety of Grunt plug-ins that are freely available for you\
    \ to use on future projects. To help demonstrate each of these plug-ins, we develop\
    \ an application. This application will be a simple Node application that allows\
    \ users to keep a simple to-do list in the browser. There is no need to worry\
    \ if you have little experience with Node, as we’ll be using Node to run a very\
    \ simple web server.\n\nThe vast majority of the application will be HTML, CSS,\
    \ and JavaScript. To start, let’s use a stripped-down version of the HTML5 boilerplate\
    \ HTML (see [Listing 3-1](#part0010.html#list1)).\n\n[***Listing 3-1***](#part0010.html#_list1).\
    \ HTML Boilerplate for the To-Do List App\n\n```\n<!DOCTYPE html>\n<html class=\"\
    no-js\">\n <head>\n  <meta charset=\"utf-8\">\n  <meta http-equiv=\"X-UA-Compatible\"\
    \ content=\"IE=edge\">\n  <title>Pro Grunt.js: Todo List</title>\n  <meta name=\"\
    description\" content=\"\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n\n<link rel=\"stylesheet\" href=\"css/main.css\">\n </head>\n\
    \ <body>\n  <!--[if lt IE 8]>\n   <p class=\"browsehappy\">You are using an <strong>outdated</strong>\
    \ browser. Please <a href=\"http://browsehappy.com/\">upgrade your browser</a>\
    \ to improve your experience.</p>\n  <![endif]-->\n\n<!-- Add your site or application\
    \ content here -->\n  <h1>Pro Grunt.js</h1>\n  <h2>Todo List</h2>\n\n<script src=\"\
    //ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js\"></script>\n  <script>window.jQuery\
    \ || document.write('<script src=\"js/vendor/jquery-1.11.0.min.js\"><\\/script>')</script>\n\
    \  <script src=\"js/main.js\"></script>\n </body>\n</html>\n```\n\nAs you can\
    \ see from [Listing 3-1](#part0010.html#list1), the HTML document is very small\
    \ at present. There is a CSS file included in the `head` element; jQuery and `main.js`\
    \ JavaScript files are included at the end of the `body` tag. For now, don’t worry\
    \ about the CSS and JavaScript files, as this will be covered later in the book.\
    \ First let’s see how Grunt can help generate, lint, and minify our CSS file.\n\
    \n## CSS Preprocessing"
  raw: 'The compact file format is commonly used for read-only tasks. As it accepts
    a single source-destination file mapping, the src property does not require a
    matching dest property. It would be used for tasks that operate on a set of files
    and report back the status for these files. An example of such a task might be
    a unit test runner that operates on a set of test cases and reports the outcome
    of each test.


    Following is an example of the compact file format ([Listing 2-16](#part0009.html#list16))
    using the grunt-mocha-test plug-in. For those unfamiliar with Mocha ([http://mochajs.org/](http://mochajs.org/)),
    it is a JavaScript test runner.


    [***Listing 2-16***](#part0009.html#_list16). Using the Compact File Format to
    Run Mocha Tests


    ```

    module.exports = function(grunt) {


    grunt.initConfig({

        // Configure a mochaTest task

        mochaTest: {

          test: {

            options: {

              reporter: ''spec''

            },

            src: [''test/**/*.js'']

          }

        }

      });


    // Add the grunt-mocha-test tasks.

      grunt.loadNpmTasks(''grunt-mocha-test'');

      grunt.registerTask(''default'', ''mochaTest'');


    };

    ```


    The preceding Gruntfile loads the grunt-mocha-test plug-in and uses it to operate
    on all files in the test folder that have the extension .js. To match on all files
    within the test directory, we’ve used a wildcard pattern. The pattern used will
    match all files within the top-level test directory and any subdirectories of
    it. If we wished only to match on files within the top-level test folder, we could
    simplify our pattern to *.js. The important thing to note here is the lack of
    a dest property, as a task does not output to a file.


    File Object Format


    The file object format allows for multiple source-destination file mappings. The
    file object format declares the mapping as a JavaScript object wherein the destination
    is the property key, while the value can be one or more source files. As each
    mapping is essentially keyed by the “destination” file, there can be many mappings
    per target. This format is commonly used when you want to reduce a set of files
    into a single file, such as in the case of concatenating JavaScript.


    The following Gruntfile ([Listing 2-17](#part0009.html#list17)) demonstrates the
    use of the file object format.


    [***Listing 2-17***](#part0009.html#_list17). Using the File Object Format to
    Concatenate Files


    ```

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        pkg: grunt.file.readJSON(''package.json''),


    concat: {

          options: {

            separator: '';'',

          },

          dist: {

            files: {

              ''build/app.js'': [''src/fileA.js'', ''src/fileB.js'']

            }

          }

        }

      });


    // Load the plugin that provides the "concat" task.

      grunt.loadNpmTasks(''grunt-contrib-concat'');

    };

    ```


    The preceding Gruntfile revisits our earlier example, but instead of defining
    src and dest properties, the destination file is defined as the property name
    itself.


    Files Array Format


    The files array format extends the compact format by allowing multiple source-destination
    mappings per target. Instead of taking a single src and dest property, the files
    are declared as a files property, and the value of this property is an array of
    the compact format. The following example ([Listing 2-18](#part0009.html#list18))
    modifies our existing example by adding CSS concatenation into the same target.


    [***Listing 2-18***](#part0009.html#_list18). Use File Array Format to Concatentate
    Multiple Files Together


    ```

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        pkg: grunt.file.readJSON(''package.json''),


    concat: {

          options: {

            separator: '';'',

          },

          dist: {

            files: [

              {src: [''src/fileA.js'', ''src/fileB.js''], dest: ''build/app.js''},

              {src: [''src/stylesA.css'', ''src/stylesB.css''], dest: ''build/app.css''}

            ]

          }

        }

      });


    // Load the plugin that provides the "concat" task.

      grunt.loadNpmTasks(''grunt-contrib-concat'');

    };

    ```


    In the preceding example, the src and dest properties have been replaced with
    a files property. The files property is assigned an array of objects. Each object
    has src and dest properties, allowing multiple source-destination mappings to
    be declared. The output for the dist target will be build/app.js and build/app.css.


    Summary


    In this chapter, you’ve begun to explore how we can introduce Grunt into a project.
    You started by becoming familiar with Node and npm, as these are fundamental to
    understanding how Grunt and its plug-in ecosystem work. The remainder of this
    chapter discussed installing Grunt into a project, how to install our first task,
    and how to provide the required configuration for the task. Finally, the flexible
    API that Grunt provides for pattern matching files within our project, to define
    inputs and outputs for our tasks, was introduced.


    The next chapter will begin to look at real-world use cases for employing Grunt
    to automate common tasks associated with HTML and CSS.


    CHAPTER 3


    ![image](images/00005.jpeg)


    Using Grunt with HTML and CSS


    In the previous chapter, we explored how to bootstrap a project to use Grunt and
    how to install and configure tasks within a project. Next, we’ll look at a variety
    of useful plug-ins that can help with our workflow when working with HTML and
    CSS, the fundamentals of the Web. The topics covered in this chapter include CSS
    preprocessing, simplifying installation of third-party dependencies, and optimizing
    content for release to the public.


    Before we explore the tasks available to automate while working with HTML and
    CSS, let me introduce the project we’ll use to demonstrate all the fantastic plug-ins
    available.


    The Demo App


    Throughout the remainder of the book, we will look at a variety of Grunt plug-ins
    that are freely available for you to use on future projects. To help demonstrate
    each of these plug-ins, we develop an application. This application will be a
    simple Node application that allows users to keep a simple to-do list in the browser.
    There is no need to worry if you have little experience with Node, as we’ll be
    using Node to run a very simple web server.


    The vast majority of the application will be HTML, CSS, and JavaScript. To start,
    let’s use a stripped-down version of the HTML5 boilerplate HTML (see [Listing
    3-1](#part0010.html#list1)).


    [***Listing 3-1***](#part0010.html#_list1). HTML Boilerplate for the To-Do List
    App


    ```

    <!DOCTYPE html>

    <html class="no-js">

     <head>

      <meta charset="utf-8">

      <meta http-equiv="X-UA-Compatible" content="IE=edge">

      <title>Pro Grunt.js: Todo List</title>

      <meta name="description" content="">

      <meta name="viewport" content="width=device-width, initial-scale=1">


    <link rel="stylesheet" href="css/main.css">

     </head>

     <body>

      <!--[if lt IE 8]>

       <p class="browsehappy">You are using an <strong>outdated</strong> browser.
    Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your
    experience.</p>

      <![endif]-->


    <!-- Add your site or application content here -->

      <h1>Pro Grunt.js</h1>

      <h2>Todo List</h2>


    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>

      <script>window.jQuery || document.write(''<script src="js/vendor/jquery-1.11.0.min.js"><\/script>'')</script>

      <script src="js/main.js"></script>

     </body>

    </html>

    ```


    As you can see from [Listing 3-1](#part0010.html#list1), the HTML document is
    very small at present. There is a CSS file included in the head element; jQuery
    and main.js JavaScript files are included at the end of the body tag. For now,
    don’t worry about the CSS and JavaScript files, as this will be covered later
    in the book. First let’s see how Grunt can help generate, lint, and minify our
    CSS file.


