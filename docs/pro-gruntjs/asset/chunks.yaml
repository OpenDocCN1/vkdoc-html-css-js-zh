- fmt: '# Grunt 入门指南


    ## 引言


    So, you’ve picked up this book with the rather unusual title, and you’re probably
    wondering what `Grunt` is or, at least, what all the buzz concerning Grunt has
    been about for the last 24 months. To put it simply, `Grunt` is a JavaScript task
    runner. Its primary aim is to automate repetitive tasks, freeing up developers’
    time to concentrate on the more difficult problems they face every day.


    `Grunt` is written in JavaScript on top of Node distributed via `npm` and was
    created by Ben Alman ([https://github.com/cowboy](https://github.com/cowboy)).
    Since day one, `Grunt` has featured an application program interface (API) to
    allow developers to extend and add custom tasks to suit their own process. This
    high customization has lead `Grunt` to become extremely popular with a large ecosystem
    that is constantly expanding.


    As a task runner, one of the core concepts of `Grunt` is “tasks.” Each task has
    a set of configuration options that can be tuned to meet your specific needs.
    Tasks can also have multiple versions: for example, one set of configuration for
    development and another for production. In addition to this, `Grunt` offers the
    ability to define custom tasks. Custom tasks can combine existing tasks into a
    single task or add completely new functionality. In addition, `Grunt` has a well-documented
    API that enables developers to change the behavior of their task runner at runtime.


    Throughout this book, `Grunt` will be used to demonstrate how this small yet extremely
    powerful tool can be used to optimize your developer workflow. `Grunt` is often
    portrayed as being a tool solely for front-end engineers; however, I will also
    demonstrate how projects that aren’t solely front-end focused can also benefit
    from the introduction of `Grunt`.


    ## How Can I Benefit from Grunt?


    One of the key benefits and primary objectives of `Grunt` is automation. You may
    question why you need automation, when your existing workflow works for you. I
    hope this book will serve as encouragement and demonstrate how automation can
    make you more efficient.


    Most developers are familiar with the tools required to perform tasks such as
    code linting, asset minification, and compiling CSS as part of their workflow.
    However, not every developer has this process automated. Some teams opt to use
    continuous integration as a point to build their application and perform prerelease
    checks. This environment is often controlled outside of the development team,
    with responsibilities lying elsewhere within an organization.


    It is convenient to rely on your continuous integration environment to perform
    build tasks. As a developer, you write code, push it to your central code repository,
    and your continuous integration (CI) server handles the rest. However, if you
    have to replicate an issue locally from a production environment, this may not
    be the quickest process for you. With the power of `Grunt`, you can utilize the
    same build process easily within your local development and CI environment, reducing
    the time taken to build a production version of your application locally.


    Developers working on their own or in a small team opting to use command-line
    or graphical user interface (GUI) tools can unify their build process through
    the use of `Grunt`. Unifying the build process will simplify the project setup
    and maintenance, as there will be a single process to follow.


    ## Continuous Integration


    If you are unfamiliar with CI, it is a common development practice of merging
    code from a team of developers into a central repository. It is often used to
    run unit tests, perform code analysis, and automate deployments. Most modern open
    source projects use `TravisCI` ([https://travis-ci.org/](https://travis-ci.org/)),
    an open source CI environment that can be easily integrated with GitHub repositories.
    Other alternatives that are popular within the development community are `Hudson`
    and `Jenkins`, `Jenkins` being a fork of `Hudson`. Both `Jenkins` and `Hudson`
    have a number of plug-ins available for integrating third-party tools or systems,
    such as a plug-in that adds the ability to trigger builds on updates to repositories
    within GitHub.


    ## Speeding Up Your Workflow


    There are some fantastic tools and integrated development environments (IDEs)
    available to help you develop applications and sites that provide tools for common
    tasks, such as compiling your CSS and linting your JavaScript. However, such tools
    typically require an initial setup and can also lead to a disjointed workflow.


    You might be wondering what is meant by a “disjointed workflow.” Consider the
    following scenario: You’re working a very simple one-page application with a set
    of JavaScript files, a CSS preprocessor, and a number of images. Before you release
    the application, you will have to lint your JavaScript, compile your CSS, and
    compress your images. For each of these problems, you can choose from a wide range
    of tools already in existence, such as `JSHint`, `LESS` compiler, and `pngquant`.
    It is likely that your IDE will lint your JavaScript and LESS compilation; however,
    you would have to switch to the command line to then run `pngquant`.


    Switching between your browser, editor, and command-line interface while developing
    will distract you from focusing on the key problems that you must solve. `Grunt`
    can provide you with a solution for unifying these tasks. In addition, `Grunt`
    also automates these tasks, so that you can focus on the unique problems within
    your application.


    ## Every Craftsman Needs a Toolbelt


    There is no denying that the craftsmanship of front-end web development has changed
    dramatically over the last few years. Gone are the days when valuable development
    time was consumed by solving browser compatibility issues, as developers now have
    access to a rich set of tools that handle such trivia. Utilizing these tools enables
    developers to invest their time in solving more complex problems with their applications.
    The emergence of frameworks that solve everyday tasks, such as `Bootstrap` and
    `AngularJS`, have enabled developers to deliver enhanced experiences through their
    applications.


    Increasingly, users are accessing applications from mobile devices and have an
    expectation that web applications should offer the same experience as native mobile
    applications. The increased volume of traffic to applications from mobile devices
    has also forced developers to rethink how they engineer their applications, adding
    further complexity. To combat this, a developer has to build a set of reliable
    tools that can be used time and time again.


    `Grunt` should become one of your primary tools that form part of your toolbelt.
    Due to the modular nature of `Grunt`, it is quite easy to build a recipe book
    of tasks that can be used across multiple projects. Each task focuses on a single
    problem, and it is easy to mix and match configurations across projects to build
    a powerful set of tools for each context.


    ## Integration with Other Tools'
