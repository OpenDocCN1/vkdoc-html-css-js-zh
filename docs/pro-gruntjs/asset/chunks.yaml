- fmt: "# 优化 Grunt 工作流程\n\n在前面的章节中，我们集中讨论了自动化构建过程以优化资源并确保它们符合特定质量标准。在本章中，我们将专注于优化\
    \ `Grunt` 工作流程本身。随着项目的增长，除非注意提高可维护性，否则项目通常会变得难以维护。你的 `Grunt` 工作流程也不例外。当你在项目中使用\
    \ `Grunt` 执行更多任务时，你可能会开始觉得 `Gruntfile` 变得有点笨重。在接下来的几个小节中，我将介绍一些技术，以确保随着项目的增长，你的\
    \ `Grunt` 任务仍然易于理解和快速运行。\n\n## 测量性能\n\n与所有类型的性能优化一样，最好先了解问题并收集统计数据来测量和分析所做的任何更改，以确保做出正确的更改。就\
    \ `Grunt` 而言，了解每个任务运行所需的时间以及构建的整体性能是有益的。这将确保我们可以减少构建应用程序所需的时间，并识别构建中现有或新出现的问题。构建过程的性能与你的应用程序同样重要。在这种情况下，我们作为开发人员就是用户，但同样的可用性基本原则同样适用。例如，如果我们的构建过程耗时超过一秒，我们的注意力很可能会转移到另一个任务上。\n\
    \n如果你打算将 `Grunt` 作为构建工具引入开发团队，性能将是团队成员可能提出疑问的问题之一。在本节中，我们将介绍一种机制，让你能够展示构建的性能，并在项目增长时持续监控构建过程。\n\
    \n插件 `time-grunt` 将允许我们测量构建的性能。`time-grunt` 显示 `grunt` 任务的已用执行时间，并且与我们到目前为止使用的所有插件不同。`time-grunt`\
    \ 不会引入新任务；相反，它会挂接到 `Grunt` 进程来测量已用执行时间。[***Listing 7-1***](#part0014.html#list1)\
    \ 演示了如何将 `time-grunt` 添加到项目中。\n\n[***Listing 7-1***](#part0014.html#_list1). 将\
    \ `time-grunt` 添加到项目\n\n```\nnpm install time-grunt --save-dev\n```\n\n现在插件已添加到项目中，我们必须更新\
    \ `Gruntfile` 以确保 `time-grunt` 挂接到我们的构建过程。[***Listing 7-2***](#part0014.html#list2)\
    \ 演示了如何将 `time-grunt` 添加到我们的 `Gruntfile`。在这种情况下，我们将其添加到了 `Gruntfile` 的顶部。[***Listing\
    \ 7-2***](#part0014.html#list2) 的重要部分是将 `Grunt` 对象传递给 `time-grunt` 插件，因为这允许它挂接到\
    \ `grunt.log` 调用，从而针对我们的构建生成时间测量结果。为了测量已用时间，`time-grunt` 使用了另一个名为 `hooker` 的 `mpm`\
    \ 模块。`hooker` 模块使用一种称为猴子补丁（`monkey patching`）的方法来修改被修补的原始对象的运行时。对于 `time-grunt`，使用了预钩子（`pre-hook`），因此每次调用\
    \ `grunt.log` 都会在 `time-grunt` 插件内执行一个函数，从而允许它测量给定任务开始和结束之间的时间差。\n\n[***Listing\
    \ 7-2***](#part0014.html#_list2). 将 `time-grunt` 添加到我们的 `Gruntfile`\n\n```\n'use\
    \ strict';\n\nmodule.exports = function(grunt) {\n\n// Load time-grunt to measure\
    \ performance\n  require('time-grunt')(grunt);\n\n};\n```\n\n现在 `time-grunt` 已添加到我们的\
    \ `Gruntfile`，运行我们的构建应该会生成类似于 [Figure 7-1](#part0014.html#Fig1) 所示的输出。当 `Grunt`\
    \ 完成最后一个任务时，`time-grunt` 将输出每个任务运行所花费的时间、运行所花费的时间百分比以及每个任务所花费时间的可视化表示。`time-grunt`\
    \ 的最终输出是所有任务完成所花费的总时间。目前，我们的任务总共需要 11 秒才能完成。在本章的其余部分，我们将研究减少构建过程执行时间和提高 `Grunt`\
    \ 工作流程可维护性的技术。\n\n![9781484200148_Fig07-01.jpg](images/00057.jpeg)\n\n[Figure\
    \ 7-1](#part0014.html#_Fig1). 最后一个任务结束时 `time-grunt` 的输出\n\n在开始讨论如何改进加载 `Grunt`\
    \ 插件的方法之前，重要的是要注意，即使 `Grunt` 因致命错误而停止，`time-grunt` 仍会输出结果。[Figure 7-2](#part0014.html#Fig2)\
    \ 显示了一个示例输出，其中 `grunt-contrib-jshint` 抛出了致命错误，因为在应用程序的 JavaScript 中发现了一个错误。\n\n\
    ![9781484200148_Fig07-02.jpg](images/00058.jpeg)\n\n[Figure 7-2](#part0014.html#_Fig2).\
    \ 即使 `Grunt` 未执行所有预期任务，`time-grunt` 也会输出\n\n## 加载插件\n\n在本章的第一节中，我们发现了当前总构建时间需要\
    \ 11 秒。加载插件目前占我们某个任务每次运行总时间的大约 3 秒。在本节中，我们将研究几种加载任务的方法。在修改我们的 `Gruntfile` 以通过替代方法加载插件之前，让我们重新审视一下我们当前是如何将插件加载到\
    \ `Grunt` 工作流程中的。目前，我们在 `Gruntfile` 中单独加载插件，如 [***Listing 7-3***](#part0014.html#list3)\
    \ 所示。\n\n[***Listing 7-3***](#part0014.html#_list3). 单独加载 `Grunt` 插件\n\n```\n\
    grunt.loadNpmTasks('grunt-contrib-sass');\ngrunt.loadNpmTasks('grunt-bower-install');\n\
    grunt.loadNpmTasks('grunt-recess');\ngrunt.loadNpmTasks('grunt-autoprefixer');\n\
    grunt.loadNpmTasks('grunt-contrib-cssmin');\ngrunt.loadNpmTasks('grunt-contrib-concat');\n\
    grunt.loadNpmTasks('grunt-contrib-jshint');\ngrunt.loadNpmTasks('grunt-contrib-requirejs');\n\
    grunt.loadNpmTasks('grunt-contrib-handlebars');\ngrunt.loadNpmTasks('grunt-contrib-uglify');\n\
    grunt.loadNpmTasks('grunt-modernizr');\ngrunt.loadNpmTasks('grunt-bower-requirejs');\n\
    grunt.loadNpmTasks('grunt-uncss');\ngrunt.loadNpmTasks('grunt-contrib-copy');\n\
    grunt.loadNpmTasks('grunt-usemin');\n```\n\n每次我们想在 `Gruntfile` 中使用插件时添加它的过程会很快变得成本高昂且容易出错。人们常犯的一个错误是在为插件定义配置后忘记调用\
    \ `grunt.loadNpmTasks`。[Figure 7-3](#part0014.html#Fig3) 显示了一个示例，其中正在运行 `grunt-modernizr`，但该插件尚未在\
    \ `Gruntfile` 中加载。\n\n![9781484200148_Fig07-03.jpg](images/00059.jpeg)\n\n[Figure\
    \ 7-3](#part0014.html#_Fig3). 尝试从未加载的插件运行任务\n\n### 使用 `matchdep` 自动化加载\n\n单独加载插件可能会占用\
    \ `Gruntfile` 的很大一部分。为了解决这个问题，让我们探索自动加载 `Gruntfile` 中的任务。我们将使用的第一个模块是 `matchdep`，它能够按名称过滤依赖项。`matchdep`\
    \ 将允许我们使用 `minimatch` 库支持的模式来过滤从 `package.json` 加载的包。如果你还记得，`minimatch` 也被 `Grunt`\
    \ 用于文件模式匹配。因此，如果你对 `Grunt` 的文件匹配感到满意，使用 `matchdep` 也应该易于理解。[***Listing 7-4***](#part0014.html#list4)\
    \ 将模块添加到我们的项目中。\n\n[***Listing 7-4***](#part0014.html#_list4). 将 `node-matchdep`\
    \ 添加到我们的项目\n\n```\nnpm install --save-dev matchdep\n```"
  raw: 'In the previous chapters, we’ve concentrated on automating the build process
    to optimize our assets and ensure that they meet certain quality standards. In
    this chapter, we’ll focus on optimizing your Grunt workflow itself. As projects
    grow, they typically become less maintainable, unless some attention is given
    to improve the maintainability. Your Grunt workflow is no different. As you start
    to use Grunt to perform more tasks within a project, you may start to feel that
    your Gruntfile is becoming a little unwieldy. Over the next few sections, I’ll
    introduce techniques to ensure that as your project grows, your Grunt tasks remain
    understandable and fast.


    Measuring Performance


    As with all types of performance optimization, it is best to understand the problem
    and gather statistics to measure and analyze any changes made, to ensure the correct
    changes are made. In the case of Grunt, it is good to understand how long each
    task is taking to run and the overall performance of our build. This will ensure
    that we can reduce the time it takes to build our applications and also identify
    existing or new issues in the build. The performance of a build process is just
    as important as your application. In this case, we, as developers, are the users,
    but the same fundamental principles of usability apply. For instance, if our build
    process takes longer than one second, it is likely that our attention will switch
    to focus onto another task.


    If you aim to introduce Grunt as your build tool to a team of developers, performance
    will be one of the concerns your team members may question you on. In this section,
    we’ll introduce a mechanism to allow you to demonstrate the performance of your
    build and continue to monitor the build process as the project grows.


    The plug-in time-grunt will allow us to measure the performance of our build.
    time-grunt displays the elapsed execution time of grunt tasks and differs from
    all plug-ins we’ve used so far. time-grunt does not introduce a new task; instead,
    it hooks onto the Grunt process to measure the elapsed execution time. [Listing
    7-1](#part0014.html#list1) demonstrates how to add time-grunt to the project.


    [***Listing 7-1***](#part0014.html#_list1). Adding time-grunt to the Project


    ```

    npm install time-grunt --save-dev

    ```


    Now that the plug-in has been added to the project, we must update our Gruntfile
    to ensure that time-grunt hooks into our build process. [Listing 7-2](#part0014.html#list2)
    demonstrates how to add time-grunt to our Gruntfile. In this case, we’ve added
    it to the top of our Gruntfile. The important part of [Listing 7-2](#part0014.html#list2)
    is the passing of the Grunt object to the time-grunt plug-in, as this allows it
    to hook onto the grunt.log calls, to produce time measurements against our build.
    To measure the elapsed time, time-grunt uses another mpm module, known as hooker.
    The hooker module uses an approach known as monkey patching to modify the runtime
    of the original object being patched. With time-grunt, a pre-hook is used, so
    each call to grunt.log executes a function within the time-grunt plug-in, allowing
    it to measure the time difference between the start and end of a given task.


    [***Listing 7-2***](#part0014.html#_list2). Adding time-grunt to Our Gruntfile


    ```

    ''use strict'';


    module.exports = function(grunt) {


    // Load time-grunt to measure performance

      require(''time-grunt'')(grunt);


    };

    ```


    With time-grunt now added to our Gruntfile, running our build should generate
    an output similar to the one shown in [Figure 7-1](#part0014.html#Fig1). As Grunt
    completes the last task, time-grunt will output the time taken for each task to
    run, the percentage of time taken to run, and a visualization of the time spent
    on each task. The final output from time-grunt is the total time taken for all
    the tasks to complete. At present, our tasks take a total of 11 seconds to complete.
    Throughout the remainder of this chapter, we’ll look at techniques to reduce the
    execution time of our build process and improve the maintainability of our Grunt
    workflow.


    ![9781484200148_Fig07-01.jpg](images/00057.jpeg)


    [Figure 7-1](#part0014.html#_Fig1). Time-grunt output at the end of the last task


    Before starting a discussion on how to improve our approach on loading Grunt plug-ins,
    it is important to note that time-grunt will still output results, even if Grunt
    is stopped by a fatal error. [Figure 7-2](#part0014.html#Fig2) shows a sample
    output in which grunt-contrib-jshint throws a fatal error, as an error is discovered
    in the application’s JavaScript.


    ![9781484200148_Fig07-02.jpg](images/00058.jpeg)


    [Figure 7-2](#part0014.html#_Fig2). time-grunt outputs even if Grunt does not
    execute all intended tasks


    Loading Plug-ins


    In the first section of this chapter, we discovered that our total build time
    is currently taking a total of 11 seconds. The loading of plug-ins currently accounts
    for approximately 3 seconds of the total time each run takes for one of our tasks.
    In this section, we’ll look at a few approaches for loading our tasks. Before
    modifying our Gruntfile to load plug-ins by an alternative method, let’s revisit
    how we currently load plug-ins into our Grunt workflow. At present, we are loading
    plug-ins individually within our Gruntfile, as in [Listing 7-3](#part0014.html#list3).


    [***Listing 7-3***](#part0014.html#_list3). Loading Grunt Plug-ins Individually


    ```

    grunt.loadNpmTasks(''grunt-contrib-sass'');

    grunt.loadNpmTasks(''grunt-bower-install'');

    grunt.loadNpmTasks(''grunt-recess'');

    grunt.loadNpmTasks(''grunt-autoprefixer'');

    grunt.loadNpmTasks(''grunt-contrib-cssmin'');

    grunt.loadNpmTasks(''grunt-contrib-concat'');

    grunt.loadNpmTasks(''grunt-contrib-jshint'');

    grunt.loadNpmTasks(''grunt-contrib-requirejs'');

    grunt.loadNpmTasks(''grunt-contrib-handlebars'');

    grunt.loadNpmTasks(''grunt-contrib-uglify'');

    grunt.loadNpmTasks(''grunt-modernizr'');

    grunt.loadNpmTasks(''grunt-bower-requirejs'');

    grunt.loadNpmTasks(''grunt-uncss'');

    grunt.loadNpmTasks(''grunt-contrib-copy'');

    grunt.loadNpmTasks(''grunt-usemin'');

    ```


    The process of adding a plug-in each time we want to use it within our Gruntfile
    can quickly become costly and is error-prone. A common error people make is forgetting
    to place call grunt.loadNpmTasks after defining their configuration for a plug-in.
    [Figure 7-3](#part0014.html#Fig3) shows an example in which grunt-modernizr is
    being run, but the plug-in hasn’t been loaded in the Gruntfile.


    ![9781484200148_Fig07-03.jpg](images/00059.jpeg)


    [Figure 7-3](#part0014.html#_Fig3). Attempting to run a task from a plug-in that
    has not been loaded


    Automating Loading with matchdep


    Loading individual plug-ins can take a large part of a Gruntfile. To remove this
    problem, let’s explore automating the loading of tasks in our Gruntfile. The first
    module we’ll use is matchdep, which has the ability to filter dependencies by
    name. matchdep will allow us to filter packages loaded from package.json, using
    a pattern that is supported by the minimatch library. If you remember, minimatch
    is also used by Grunt for its pattern matching on files. Therefore, if you feel
    comfortable with Grunt’s file matching, using matchdep should also be easy to
    understand. [Listing 7-4](#part0014.html#list4) adds the module to our project.


    [***Listing 7-4***](#part0014.html#_list4). Adding node-matchdep to Our Project


    ```

    npm install --save-dev matchdep

    ```'
  trans: "\n# 优化 Grunt 工作流程\n\n在前面的章节中，我们集中讨论了自动化构建过程以优化资源并确保它们符合特定质量标准。在本章中，我们将专注于优化\
    \ `Grunt` 工作流程本身。随着项目的增长，除非注意提高可维护性，否则项目通常会变得难以维护。你的 `Grunt` 工作流程也不例外。当你在项目中使用\
    \ `Grunt` 执行更多任务时，你可能会开始觉得 `Gruntfile` 变得有点笨重。在接下来的几个小节中，我将介绍一些技术，以确保随着项目的增长，你的\
    \ `Grunt` 任务仍然易于理解和快速运行。\n\n## 测量性能\n\n与所有类型的性能优化一样，最好先了解问题并收集统计数据来测量和分析所做的任何更改，以确保做出正确的更改。就\
    \ `Grunt` 而言，了解每个任务运行所需的时间以及构建的整体性能是有益的。这将确保我们可以减少构建应用程序所需的时间，并识别构建中现有或新出现的问题。构建过程的性能与你的应用程序同样重要。在这种情况下，我们作为开发人员就是用户，但同样的可用性基本原则同样适用。例如，如果我们的构建过程耗时超过一秒，我们的注意力很可能会转移到另一个任务上。\n\
    \n如果你打算将 `Grunt` 作为构建工具引入开发团队，性能将是团队成员可能提出疑问的问题之一。在本节中，我们将介绍一种机制，让你能够展示构建的性能，并在项目增长时持续监控构建过程。\n\
    \n插件 `time-grunt` 将允许我们测量构建的性能。`time-grunt` 显示 `grunt` 任务的已用执行时间，并且与我们到目前为止使用的所有插件不同。`time-grunt`\
    \ 不会引入新任务；相反，它会挂接到 `Grunt` 进程来测量已用执行时间。*清单 7-1* 演示了如何将 `time-grunt` 添加到项目中。\n\n\
    *清单 7-1*. 将 `time-grunt` 添加到项目\n\n```\nnpm install time-grunt --save-dev\n```\n\
    \n现在插件已添加到项目中，我们必须更新 `Gruntfile` 以确保 `time-grunt` 挂接到我们的构建过程。*清单 7-2* 演示了如何将 `time-grunt`\
    \ 添加到我们的 `Gruntfile`。在这种情况下，我们将其添加到了 `Gruntfile` 的顶部。*清单 7-2* 的重要部分是将 `Grunt`\
    \ 对象传递给 `time-grunt` 插件，因为这允许它挂接到 `grunt.log` 调用，从而针对我们的构建生成时间测量结果。为了测量已用时间，`time-grunt`\
    \ 使用了另一个名为 `hooker` 的 `npm` 模块。`hooker` 模块使用一种称为猴子补丁（`monkey patching`）的方法来修改被修补的原始对象的运行时。对于\
    \ `time-grunt`，使用了预钩子（`pre-hook`），因此每次调用 `grunt.log` 都会在 `time-grunt` 插件内执行一个函数，从而允许它测量给定任务开始和结束之间的时间差。\n\
    \n*清单 7-2*. 将 `time-grunt` 添加到我们的 `Gruntfile`\n\n```\n'use strict';\n\nmodule.exports\
    \ = function(grunt) {\n\n// 加载 time-grunt 以测量性能\n  require('time-grunt')(grunt);\n\
    \n};\n```\n\n现在 `time-grunt` 已添加到我们的 `Gruntfile`，运行我们的构建应该会生成类似于 图 7-1 所示的输出。当\
    \ `Grunt` 完成最后一个任务时，`time-grunt` 将输出每个任务运行所花费的时间、运行所花费的时间百分比以及每个任务所花费时间的可视化表示。`time-grunt`\
    \ 的最终输出是所有任务完成所花费的总时间。目前，我们的任务总共需要 11 秒才能完成。在本章的其余部分，我们将研究减少构建过程执行时间和提高 `Grunt`\
    \ 工作流程可维护性的技术。\n\n![9781484200148_Fig07-01.jpg](img/00057.jpeg)\n\n图 7-1. 最后一个任务结束时\
    \ `time-grunt` 的输出\n\n在开始讨论如何改进加载 `Grunt` 插件的方法之前，重要的是要注意，即使 `Grunt` 因致命错误而停止，`time-grunt`\
    \ 仍会输出结果。图 7-2 显示了一个示例输出，其中 `grunt-contrib-jshint` 抛出了致命错误，因为在应用程序的 JavaScript\
    \ 中发现了一个错误。\n\n![9781484200148_Fig07-02.jpg](img/00058.jpeg)\n\n图 7-2. 即使 `Grunt`\
    \ 未执行所有预期任务，`time-grunt` 也会输出\n\n## 加载插件\n\n在本章的第一节中，我们发现了当前总构建时间需要 11 秒。加载插件目前占我们某个任务每次运行总时间的大约\
    \ 3 秒。在本节中，我们将研究几种加载任务的方法。在修改我们的 `Gruntfile` 以通过替代方法加载插件之前，让我们重新审视一下我们当前是如何将插件加载到\
    \ `Grunt` 工作流程中的。目前，我们在 `Gruntfile` 中单独加载插件，如 *清单 7-3* 所示。\n\n*清单 7-3*. 单独加载 `Grunt`\
    \ 插件\n\n```\ngrunt.loadNpmTasks('grunt-contrib-sass');\ngrunt.loadNpmTasks('grunt-bower-install');\n\
    grunt.loadNpmTasks('grunt-recess');\ngrunt.loadNpmTasks('grunt-autoprefixer');\n\
    grunt.loadNpmTasks('grunt-contrib-cssmin');\ngrunt.loadNpmTasks('grunt-contrib-concat');\n\
    grunt.loadNpmTasks('grunt-contrib-jshint');\ngrunt.loadNpmTasks('grunt-contrib-requirejs');\n\
    grunt.loadNpmTasks('grunt-contrib-handlebars');\ngrunt.loadNpmTasks('grunt-contrib-uglify');\n\
    grunt.loadNpmTasks('grunt-modernizr');\ngrunt.loadNpmTasks('grunt-bower-requirejs');\n\
    grunt.loadNpmTasks('grunt-uncss');\ngrunt.loadNpmTasks('grunt-contrib-copy');\n\
    grunt.loadNpmTasks('grunt-usemin');\n```\n\n每次我们想在 `Gruntfile` 中使用插件时添加它的过程会很快变得成本高昂且容易出错。人们常犯的一个错误是在为插件定义配置后忘记调用\
    \ `grunt.loadNpmTasks`。图 7-3 显示了一个示例，其中正在运行 `grunt-modernizr`，但该插件尚未在 `Gruntfile`\
    \ 中加载。\n\n![9781484200148_Fig07-03.jpg](img/00059.jpeg)\n\n图 7-3. 尝试从未加载的插件运行任务\n\
    \n### 使用 `matchdep` 自动化加载\n\n单独加载插件可能会占用 `Gruntfile` 的很大一部分。为了解决这个问题，让我们探索自动加载\
    \ `Gruntfile` 中的任务。我们将使用的第一个模块是 `matchdep`，它能够按名称过滤依赖项。`matchdep` 将允许我们使用 `minimatch`\
    \ 库支持的模式来过滤从 `package.json` 加载的包。如果你还记得，`minimatch` 也被 `Grunt` 用于文件模式匹配。因此，如果你对\
    \ `Grunt` 的文件匹配感到满意，使用 `matchdep` 也应该易于理解。*清单 7-4* 将模块添加到我们的项目中。\n\n*清单 7-4*.\
    \ 将 `node-matchdep` 添加到我们的项目\n\n```\nnpm install --save-dev matchdep\n```\n"
- fmt: "With the module now added to the project, we can now use it within our Gruntfile,\
    \ as shown in [Listing 7-5](#part0014.html#list5).\n\n[***Listing 7-5***](#part0014.html#_list5).\
    \ Loading Grunt Tasks with `matchdep`\n\n```\n'use strict';\n\nmodule.exports\
    \ = function(grunt) {\n\n// Load time-grunt to measure performance\n  require('time-grunt')(grunt);\n\
    \n// Load all grunt tasks\n  require('matchdep').filterDev('grunt-*').forEach(grunt.loadNpmTasks);\n\
    };\n```\n\nThere is a new line added to our `Gruntfile` in [Listing 7-5](#part0014.html#list5)\
    \ that is responsible for including the `matchdep` module into our `Gruntfile`\
    \ and then using it to load our Grunt plug-ins. The `matchdep` module has a number\
    \ of functions for filtering Node dependencies. In our example, we’re using the\
    \ `filterDev` function, which looks in the nearest `package.json` for the `devDependencies`\
    \ and then applies a filter. Each function offered by `matchdep` returns the dependencies\
    \ as an array of strings. In [Listing 7-5](#part0014.html#list5), we take the\
    \ array of dependencies and iterate each one and pass it to the `grunt.loadNpmTasks`.\
    \ This final step ensures that all our Grunt plug-ins are loaded. We could target\
    \ our plug-ins to specifically load all those produced by the core Grunt team.\
    \ [Listing 7-6](#part0014.html#list6) demonstrates the use of targeting a subset\
    \ of Grunt plug-ins.\n\n[***Listing 7-6***](#part0014.html#_list6). Loading Only\
    \ Grunt Plug-ins Produced by the Core Grunt Team\n\n```\n// Load all grunt tasks\n\
    require('matchdep').filterDev('grunt-contrib-*').forEach(grunt.loadNpmTasks);\n\
    ```\n\nIn addition to targeting dependencies by name, `matchdep` allows you to\
    \ specify the location of the file containing your dependencies. [Listing 7-7](#part0014.html#list7)\
    \ offers an example that includes this feature.\n\n[***Listing 7-7***](#part0014.html#_list7).\
    \ Loading Dependencies from Another Location\n\n```\n// Load all grunt tasks from\
    \ another json file\nrequire('matchdep').filterAll('grunt-*', './build/tasks.json').forEach(grunt.loadNpmTasks);\n\
    ```\n\nIn the preceding example, we’ve specified a location that the dependencies\
    \ should be loaded from. [Listing 7-8](#part0014.html#list8) contains the `tasks.json`\
    \ used in [Listing 7-7](#part0014.html#list7).\n\n[***Listing 7-8***](#part0014.html#_list8).\
    \ Sample Dependencies File: `tasks.json`\n\n```\n{\n  \"devDependencies\": {\n\
    \    \"grunt\": \"^0.4.5\",\n    \"grunt-a11y\": \"0.1.0\",\n    \"grunt-autoprefixer\"\
    : \"^2.0.0\",\n    \"grunt-bower-install\": \"^1.4.0\",\n    \"grunt-bower-requirejs\"\
    : \"^0.11.0\",\n    \"grunt-contrib-clean\": \"^0.5.0\"\n  }\n}\n```\n\n[Listing\
    \ 7-8](#part0014.html#list8) contains a smaller subset of the project dependencies.\
    \ If you now run `grunt-contrib-clean`, the task will still successfully run;\
    \ however, if you try to run `grunt-contrib-jshint`, an error will be thrown,\
    \ as the plug-in is not loaded. The ability to load different dependencies can\
    \ be useful. For example, it provides the ability to load a different set of dependencies\
    \ based on an option. [Listing 7-9](#part0014.html#list9) demonstrates the use\
    \ of such an option to switch the dependencies file used. [Listing 7-9](#part0014.html#list9)\
    \ loads an option called `deploy` that can be passed as a parameter to Grunt at\
    \ runtime. If the option is set, then the file `./build/tasks.json` is used; otherwise,\
    \ the `package.json` is loaded. This can reduce the time taken to load dependencies\
    \ as part of a deployment while allowing the local development environment to\
    \ run more complex sets of tasks. [Listing 7-10](#part0014.html#list10) contains\
    \ an example of how to pass an option to `grunt`. The option will return `true`\
    \ if the option is set; otherwise, it returns `false`.\n\n[***Listing 7-9***](#part0014.html#_list9).\
    \ Modifying Dependencies at Load Time\n\n```\nmodule.exports = function(grunt)\
    \ {\n\nvar deploy  = grunt.option('deploy');\n  var depFile = deploy ? './build/tasks.json'\
    \ : './package.json';\n\n// Load time-grunt to measure performance\n  require('time-grunt')(grunt);\n\
    \n// Load dependencies\n  require('matchdep').filterDev('grunt-*', depFile).forEach(grunt.loadNpmTasks);\n\
    \n};\n```"
