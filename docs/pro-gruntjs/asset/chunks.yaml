    Now that the configuration has been updated to use grunt-newer, running the build
    task consecutively should yield a faster second runtime, as the output from the
    first run will be cached. However, if a file that a task is dependent on changes,
    then the cache will not be used. [Figure 7-7](#part0014.html#Fig7) shows the timings
    from two runs of our tasks. The first run is on the left, and the cached run on
    the right.


