- fmt: "```html\n<picture>\n   <source media=\"(min-width: 64em)\" src=\"high-res.jpg\"\
    >\n   <source media=\"(min-width: 37.5em)\" src=\"med-res.jpg\">\n   <source src=\"\
    low-res.jpg\">\n   <img src=\"fallback.jpg\" alt=\"This picture loads on non-supporting\
    \ browsers.\">\n   <p>Accessible text.</p>\n</picture>\n```\n\nTo support a similar\
    \ solution in older browsers, I’d suggest serving the lowest quality image and\
    \ progressively enhancing the user experience through the use of JavaScript solutions.\
    \ One such solution is `Imager.js`, produced by the BBC Responsive News team (<https://github.com/BBC-News/Imager.js/>).\n\
    \n`Imager.js` simplifies the workflow when working images for responsivity and\
    \ prevents multiple images from being downloaded by the browser. Image elements\
    \ are swapped with elements that have data attributes for the image source. They\
    \ are called to `Image.js` then defined by the image widths available, allowing\
    \ you to define pixel density as well. `Image.js` then runs over the page, replacing\
    \ these elements with image elements most appropriate to the image. [Listing 5-11](#part0012.html#list11)\
    \ demonstrates the HTML before `Image.js` is run, while [Listing 5-12](#part0012.html#list12)\
    \ illustrates the effect of `Imager.js` on the HTML of the page.\n\n[***Listing\
    \ 5-11***](#part0012.html#_list11). HTML Before Image.js\n\n```\n<div style=\"\
    width: 240px\">\n    <div class=\"delayed-image-load\" data-src=\"http://placehold.it/{width}\"\
    \ data-alt=\"alternative text\"></div>\n</div>\n\n<script>\n    new Imager({ availableWidths:\
    \ [200, 260, 320, 600] });\n</script>\n```\n\n[***Listing 5-12***](#part0012.html#_list12).\
    \ HTML After Image.js Has Modified the Page\n\n```\n<div style=\"width: 240px\"\
    >\n    <img src=\"http://placehold.it/260\" data-src=\"http://placehold.it/{width}\"\
    \ \nalt=\"alternative text\" class=\"image-replace\">\n</div>\n\n<script>\n  \
    \  new Imager({ availableWidths: [200, 260, 320, 600] });\n</script>\n```\n\n\
    As demonstrated in [Listing 5-12](#part0012.html#list12), `Image.js` has modified\
    \ the original `div` element, replacing it with a new `img` element. From the\
    \ array of available sizes, `Image.js` has chosen 260 for our current device.\
    \ It replaces the placeholder, `{width}`, with the chosen width, before setting\
    \ this as the `src` attribute for the new image element. As the images are also\
    \ lazily loaded, the initial page render time should be improved as well.\n\n\
    This concludes the section on responsive images. Next, I’ll introduce a new plug-in\
    \ capable of generating image sprites.\n\n## Producing Image Sprites\n\nThis is\
    \ the final section of our exploration of Grunt to automate image optimization\
    \ for modern web applications. Image spriting is a performance technique that\
    \ aims to reduce the number of HTTP requests made when rendering a page. An image\
    \ sprite combines several smaller images into a single larger image. Although\
    \ this does not necessarily reduce the amount of bandwidth used by the page, it\
    \ can improve the performance of the load time of the page. Having multiple requests\
    \ for images from the same domain can lead to a bottleneck in your page load time,\
    \ as some browsers implement a limit on the number of requests that can be simultaneously\
    \ made to the same domain. For example, Internet Explorer 10 restricts the number\
    \ of parallel downloads for a single domain to eight requests. Therefore, if you\
    \ have a lot of iconography on a page, this could lead to some icons taking longer\
    \ than expected to be downloaded. Creating an image sprite can help resolve this\
    \ issue, as a single request is made for the sprite, instead of a request per\
    \ image.\n\nThe simplest yet most time-consuming method of generating a sprite\
    \ is by hand. This means opening all your icons into your favorite image-editing\
    \ software and carefully placing each image alongside one another before exporting\
    \ the newly produced sprite as an optimized image. Once the sprite has been handcrafted,\
    \ you will then have to produce the CSS that will be used to position the sprite\
    \ correctly, so that only a single icon appears in the correct element. Each time\
    \ you add a new icon or logo to your site, you will have to reopen the sprite\
    \ and modify the CSS. Obviously, this isn’t ideal and carries a lot of overhead\
    \ in terms of maintenance. The maintenance is also doubled if you want to start\
    \ producing a retina sprite sheet for devices with higher pixel density displays.\n\
    \nA second approach is to use a free online tool, such as [www.spritebox.net](http://www.spritebox.net),\
    \ that provides convenient means for uploading and creating sprites. These online\
    \ tools are more powerful than the manual approach described previously, as they\
    \ often produce the CSS, LESS, or SASS for integrating into your application.\
    \ The main drawback of using these tools is the need to be online to use them,\
    \ and they don’t seamlessly integrate with your workflow. If you have to work\
    \ offline, you’ll have to wait until you can get back online before updating your\
    \ imagery and sprites. Also, as the images are generated online, you will have\
    \ to optimize these, once you copy the new sprite into your project.\n\n## Automating\
    \ Sprite Creation\n\nThe previous approaches are far from perfect, as outlined,\
    \ but some of the shortfalls can be addressed by the use of `Grunt`. Using `Grunt`\
    \ to generate the sprite has benefits of making the process repeatable and reusable.\
    \ In addition to these, most `Grunt` plug-ins developed for sprite generation\
    \ can be run offline. There are a number of sprite generation plug-ins available\
    \ for `Grunt`. I will focus on one in particular, called `grunt-spritesmith`.\
    \ This plug-in has a rich set of options that allows for full control over the\
    \ sprite generated and also provides options to output CSS for most major CSS\
    \ preprocessors. [Listing 5-13](#part0012.html#list13) demonstrates how to install\
    \ `grunt-spritesmith` to your project.\n\n[***Listing 5-13***](#part0012.html#_list13).\
    \ Installing grunt-spritesmith\n\n```\nnpm install  grunt-spritesmith --save-dev\n\
    ```\n\nThe plug-in works on the basis of using a sprite engine. A sprite engine\
    \ is an external image-processing tool that the plug-in uses to process the sprite.\
    \ The plug-in, at the time of writing, supports `pngsmith`, `phantomjs`, `canvas`,\
    \ and `GraphicsMagick` as sprite engines. The choice of sprite engine affects\
    \ the capabilities of the plug-in. For example, using `pngsmith` will prevent\
    \ the plug-in from processing images that are not png files. While `canvas` offers\
    \ the best performance when processing more than 100 sprites, it is only supported\
    \ on the Linux platform. In our examples, we will be using `phantomjs`, which\
    \ is capable of processing all image formats.\n\nLet’s start to explore the options\
    \ available when generating a sprite with `grunt-spritesmith`. [Listing 5-14](#part0012.html#list14)\
    \ provides a sample configuration that we will go through in detail.\n\n[***Listing\
    \ 5-14***](#part0012.html#_list14). grunt-spritesmith Configuration\n\n```\nsprite:\
    \ {\n    app: {\n      src: ['build/icons/**.png'],\n      destImg: 'app/img/sprite.png',\n\
    \      destCSS: 'build/styles/_sprite.scss',\n      imgPath: '../img',\n     \
    \ algorithm: 'top-down',\n      padding: 35,\n      engine: 'phantomjs',\n   \
    \   cssFormat: 'scss'\n    }\n  }\n```"
