    # 改进的前端工作流


    不可否认，过去两年间前端工程师可用的工具已经取得了巨大进步。由社区大力开发的一个特定项目是 `Yeoman`。`Yeoman` 被定义为一种工作流而非框架，它包含三个关键组件：`Yo`、`Grunt`
    和 `Bower`。`Grunt` 是 `Yeoman` 项目中的关键角色，正如本书后续所示，将 `Yo` 和 `Grunt` 结合使用，能够快速搭建包含自动化构建流程的项目。


    ## 版本控制


    使用 `Grunt` 的另一个关键优势在于，你的任务及其配置都会进行版本控制。由于项目中的 `Grunt` 任务是通过 `npm` 安装的，因此可以轻松地通过
    `npm` 本身进行管理。除此之外，配置的变更对整个团队清晰可见，因为它们与项目一同进行版本控制。这构建了一套整个团队都能学习、开发并从中受益的工具集。


    ![Image](img/00006.jpeg) **注意** `npm` 是一个 JavaScript 包管理器，允许开发者轻松共享和重用 JavaScript
    模块。`npm` 负责处理包的版本控制、依赖关系和发布。每个包都有一个在名为 `package.json` 的 JSON 配置文件中定义的元数据，其中包含名称、描述、版本、作者和依赖关系等信息。


    ## 可读性


    另一个促进 `Grunt` 快速普及的因素是其可读性。`Grunt` 的任务配置是一个简单的 JSON 配置对象，使其具有高度的可读性和可理解性。


    `Grunt` 还推广了“不要重复自己”（DRY）的开发技巧，因为任务可以使用变量作为其配置的一部分。正如你将在本书后续内容中看到的那样，这也提高了任务配置的可读性。


    拥有一个可读性强的任务运行器的另一个好处是，能够显著缩短新团队成员掌握构建流程工作原理所需的时间。


    ## 替代方案


    需要认识到，`Grunt` 并非首个用于自动化开发者工作流的任务运行器。有许多替代方案；然而，`Grunt` 凭借其庞大的生态系统、简洁性和速度，在其中脱颖而出。在深入探讨
    `Grunt` 之前，我们将简要介绍几个流行的替代方案。


    ### Ant


    正式名称为 `Apache Ant`，“Ant”是一个基于 Java 的构建工具。任务不是使用 JavaScript 指定的，而是在项目中的 XML 文件中定义。`Ant`
    附带超过 100 个内置任务，例如文件拼接、gzip 压缩文件以及替换文件中的内容。然而，这些任务更偏向于 Java 项目的构建流程。例如，如果你想支持 JavaScript
    的 linting 检查，你必须包含一个新任务。要添加此类任务，`Ant` 要求将新任务编译成 JAR 文件，并从 XML 配置中引用。对于不熟悉 Java
    的人来说，刚开始时这可能会有些令人生畏。如果你的项目在构建流程中不需要 Java，那么 `Grunt` 可能是更好的选择，因为引入 Java 会给项目增加不必要的依赖。


    你可能会考虑选择 `Grunt` 而非 `Ant`，原因在于其使用的配置格式：JSON 而非 XML。阅读 `Ant` 的构建文件感觉有点臃肿，并且无法一目了然地看清构建流程如何整合，而
    `Grunt` 的 JSON 更为精简，并且任务可以组合成逻辑名称。


    ### Rake


    `Rake` 是 Ruby 社区对 Make 文件的回应。`Rake` 允许开发者使用 Ruby 语法定义任务。任何使用过 `Ruby on Rails`
    框架的人应该对 `Rake` 相当熟悉，因为它被用作执行诸如创建数据库、运行测试和编译静态资源等任务的首选工具。


    `Rake` 没有任务配置的概念。相反，它选择定义并执行 Ruby 代码的任务来实现目标。例如，没有可用的配方或插件仓库来执行常见任务。如果你想拼接和 lint
    检查你的 JavaScript，你必须从头开始编写你自己的任务，然后才能使用它。这显然会增加你开始项目的成本，因为 `Rake` 没有提供任何立即可用的东西。你需要确保你的任务高度可配置，以增加跨项目的重用性。


    `Grunt` 通过提供广泛的插件选择来解决必须“重新发明轮子”的问题。此外，`Grunt` 还通过提供丰富的 API 来支持任务配置，从而推广了“配置优于代码”的概念。


    ### Gulp


    `Gulp` 是一个相对较新的工具，与 `Grunt` 一样，也基于 JavaScript。`Grunt` 和 `Gulp` 的另一个相似之处是基于模块的架构，并通过使用
    `npm` 作为依赖管理器来驱动。`Gulp` 与 `Grunt` 一样易于上手；然而，可以说 `Gulp` 的任务定义更为简洁，因为任务是用代码而非配置来表达的。


    已经有多篇博客文章将 `Grunt` 和 `Gulp` 进行对比。然而，也有相反的观点认为，这两个工具可以共存，因为它们在实现共同目标的方式上存在差异。`Gulp`
    比 `Grunt` 更快，但由于其使用了 Node 流，入门门槛稍高。


    ![Image](img/00006.jpeg) **注意** `Grunt` 组合任务的方式是一个任务的输出会产生一个临时文件，该文件由下一个任务拾取进行处理。`Gulp`
    不会产生这些临时文件；文件在各个任务之间通过管道传输。


    ## 总结


    在本章中，你已经对 `Grunt` 是什么以及项目如何从使用它中获益有了基本了解。你还探讨了 `Grunt` 与现有类似替代方案的比较。本书将帮助你理解如何在项目中设置和使用
    `Grunt`，使你能够快速地 lint 检查、测试和优化你的应用程序。


    # 第 2 章


    ![image](img/00005.jpeg)


    # 如何在项目中使用 Grunt


    在上一章中，你简要了解了 `Grunt` 以及在项目中使用 `Grunt` 的好处。本章将更详细地介绍 `Grunt`、如何安装 `Grunt`，以及如何在你的项目中使用
    `Grunt`。在了解 `Grunt` 本身之前，充分理解 `Node.js` 非常重要。`Grunt` 构建在 `Node.js` 之上，因此，充分理解
    `Node.js` 以及模块在 `Node.js` 中的运作方式，将使学习和理解 `Grunt` 变得更加容易。


    ## Node.js


    `Node.js` 是一个应用程序平台，允许开发者实现构建在 Chrome 的 JavaScript 引擎 V8 之上的事件驱动应用程序。正如你们中许多人知道的那样，JavaScript
    最初是一种客户端语言；它被用来实现交互式界面。`Node.js` 将 JavaScript 用作服务器端的脚本语言，并通过非阻塞 I/O 操作实现高可扩展性。为了实现非阻塞
    I/O 操作，`Node.js` 应用程序使用异步执行，而传统上，应用程序按给定顺序执行代码。非阻塞 I/O 是一个过程，允许在等待一个耗时的 I/O 操作响应时继续执行其他处理。例如，如果一个
    `Node.js` 应用程序向远程 HTTP 服务发送请求以获取数据，它不会在等待响应后再处理其他请求。在请求发送到远程 HTTP 服务后，`Node.js`
    应用程序将继续处理其他请求，直到远程 HTTP 服务响应后，才返回到原始例程。这种在等待 I/O 操作时继续处理其他请求的能力可以显著提升性能。

    '
- fmt: '# Node.js 简介


    `Node.js` 由 Ryan Dahl 于 2009 年创建。他的灵感来自于那些会持续轮询服务器以获取更新的网站。Dahl 希望创建一个事件驱动的框架，允许服务器将数据推送到浏览器，而不是通过持续轮询来获取数据。


    `Node.js` 在多个平台上均可使用：Linux、Windows 和 Mac OS X。每个平台的安装过程都相对简单，你必须在能够使用 `Grunt`
    之前安装好 `Node.js`。


    # 在 Linux 上安装


    `Node.js` 可以从其源码下载，但也可以通过大多数流行的包管理器（如 `yum` 和 `aptitude`）获取。例如，在 Ubuntu 12.04
    及更高版本上，可以使用以下命令安装 `Node.js`：


    ```

    sudo yum apt-get install Node.js

    ```


    关于在你的 Linux 发行版上安装 `Node.js` 的更多具体细节，请参考官方文档（[https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager](https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager)）。


    # 在 Windows 上安装


    对于使用 Windows 的读者，请前往 [http://nodejs.org/](http://nodejs.org/) 并下载 Windows 安装程序。完成安装过程后，`Node.js`
    即可使用。


    # 在 Mac OS X 上安装


    在 Mac OS X 上，可以从 [http://nodejs.org](http://nodejs.org) 获取官方安装程序；不过，你也可以选择从你偏好的包管理器安装最新版本。`Node.js`
    在 Mac OS X 平台上的大多数流行包管理器中均可使用。


    要使用 `Homebrew` 安装 `Node.js`，请使用以下命令：


    ```

    brew install node

    ```


    或者，要使用 `MacPorts` 安装 `Node.js`，请使用以下命令：


    ```

    sudo port install Node.js

    ```


    # 确认安装


    完成上述安装步骤后，`Node.js` 即可使用。作为安装的一部分，包管理器 `npm` 现在也被安装了。在 `Node.js` 版本 0.6.3 之前，`npm`
    是单独安装的。要确认 `node` 和 `npm` 是否可用，请打开终端（或 Windows 中的命令提示符），然后输入以下命令：


    ```

    node --version

    npm –version

    ```


    你应该会看到与[图 2-1](#part0009.html#Fig1) 中所示类似版本号的输出，具体取决于各自的环境。


    在本书的剩余部分，我们将使用 `Node.js` 版本 0.10.26 和 `npm` 版本 1.4.3，如[图 2-1](#part0009.html#Fig1)
    所示。


    ![9781484200148_Fig02-01.jpg](images/00007.jpeg)


    [图 2-1](#part0009.html#_Fig1). 检查已安装的 `node` 和 `npm` 版本


    # npm


    `npm` 提供了一种便捷的方式来跨多个项目创建、共享和安装 `Node.js` 包。这些包会被发布到一个中央 `npm` 注册表，允许全球的开发者在其自身项目中安装并重用这些包。`npm`
    提供了一种标准方法来定义易于跨项目重用的 JavaScript 包。每个包都有一个名称、描述、作者以及一组依赖项。


    正如前一章所述，`Grunt` 采用了基于插件的架构，允许开发者在不同项目之间混合搭配任务。为了实现这种极高的灵活性，`Grunt` 利用了 `Node.js`
    和 `npm` 提供的现有模块化机制。每个 `Grunt` 插件都是一个可以使用 `npm` 安装的 `Node.js` 包。


    `npm` 允许开发者定义一个包的依赖项。当其他人安装一个包时，`npm` 会管理该包的安装及其依赖项，因此你无需为此操心。


    在首次了解 `Grunt` 之前，我将介绍 `Node.js` 和 `npm` 的两个关键特性，我们在安装和使用 `Grunt` 时会用到它们。


    ## 查找模块


    `npm` 允许开发者搜索所有 `Node.js` 包的注册表。针对注册表的搜索可以接受一个或多个搜索词。搜索词也可以是正则表达式，这些正则表达式以 `/`
    开头。


    要搜索一个包，请打开命令行或命令提示符并输入：


    ```

    npm search grunt

    ```'
  raw: 'Node.js was created by Ryan Dahl in 2009\. His inspiration came from his experience
    of web sites that would continuously poll servers for updates. Dahl wanted to
    create a framework that was event-driven and allowed servers to push data to the
    browser, instead of data being polled continuously.


    Node.js is available across multiple platforms: Linux, Windows, and Mac OS X.
    The installation process for each is relatively easy, and you will have to install
    Node.js before you can use Grunt.


    Installing on Linux


    Node.js is available to download from its source, but it is also available via
    most popular package managers, such as yum and aptitude. For example, on Ubuntu
    12.04 and later versions, Node.js can be installed using the following:


    ```

    sudo yum apt-get install Node.js

    ```


    For more specific details on installing Node.js on your distribution of Linux,
    refer to the official documentation ([https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager](https://github.com/joyent/node/wiki/Installing-Node.js-via-package-manager)).


    Installing on Windows


    For readers using Windows, head over to [http://nodejs.org/](http://nodejs.org/)
    and download the Windows installer. Once you have completed the installation process,
    Node.js will be available.


    Installing on Mac OS X


    On Mac OS X, there is an official installer available from [http://nodejs.org](http://nodejs.org);
    however, you may wish to install the latest version from your package manager
    of choice. Node.js is available for the most popular package managers on the Mac
    OS X platform.


    To install Node.js with Homebrew, use the following:


    ```

    brew install node

    ```


    Alternatively, to install Node.js with MacPorts, use the following:


    ```

    sudo port install Node.js

    ```


    Confirming Your Installation


    After completing the preceding installation steps, Node.js will be available to
    you. As part of the installation npm, a package manager, for now, was also installed.
    Prior to version 0.6.3 of Node.js, npm was installed separately. To confirm that
    node and npm are available, open the terminal, or command prompt in Windows, and
    type the following:


    ```

    node --version

    npm –version

    ```


    You should have a similar version number to the one shown in [Figure 2-1](#part0009.html#Fig1)
    in the respective environments.


    For the remainder the book, we will be using Node.js version 0.10.26 and npm version
    1.4.3, as illustrated in [Figure 2-1](#part0009.html#Fig1).


    ![9781484200148_Fig02-01.jpg](images/00007.jpeg)


    [Figure 2-1](#part0009.html#_Fig1). Checking which version of node and npm are
    installed


    npm


    npm provides a convenient way to create, share, and install Node.js packages across
    several projects. Packages are published to a central npm registry allowing developers
    from across the globe to install and reuse these packages within their own project.
    npm provides a standard approach to defining JavaScript packages that can be easily
    reused across projects. Each package has a name, description, author(s), and a
    set of dependencies.


    As mentioned in the previous chapter, Grunt uses a plug-in-based architecture,
    allowing developers to mix and match tasks across projects. To achieve this extreme
    flexibility, Grunt harnesses the existing modularization offered by Node.js and
    npm. Each Grunt plug-in is a Node.js package that can be installed using npm.


    npm allows developers to define a package’s dependencies. When others install
    a package, npm manages the installation and its dependencies so that you don’t
    have to worry.


    Before taking a first look at Grunt, I’ll cover two key features of Node.js and
    npm that we will use when installing and using Grunt.


    Finding Modules


    npm allows developers to search a registry of all Node.js packages. Searches against
    a registry accept one or more search terms. A search term can also be a regular
    expression, these start with a /.


    To search for a package, open the command line or command prompt and enter


    ```

    npm search grunt

    ```'
