    ,\n    underscore: \"bower_components/underscore/underscore\"\n  },\n  packages:\
    \ [\n\n]\n});\n```\n\n`index.html`文件中包含的第三个脚本将是我们的主应用程序 JavaScript 模块。这将是加载其他模块和初始化应用程序的起点。清单\
    \ 4-10 演示了`main.js`文件。\n\n**清单 4-10**. 包含我们初始化代码的`main.js`文件\n\n```\nrequire(['js/app'],\
