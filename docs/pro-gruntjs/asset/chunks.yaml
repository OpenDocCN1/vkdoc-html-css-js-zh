      live: {

        options: {

          urls: [''www.twitter.com'']

        }

      }

    }

    ```


    As shown in [Listing 6-34](#part0013.html#list34), the plug-in can be simply configured
    with a series of URLs. In our example, we’ve hard-coded the URL into our Gruntfile,
    but in a larger application build process, this should be pushed into a configuration
    file and loaded at build time. This means the URLs are more maintainable and can
    be shared across tasks. We’ll explore this further in the next chapter.


    In addition to the URLs option, the grunt-a11y plug-in accepts another option
    that allows the plug-in to throw an error, should it encounter any issues with
    accessibility in the URLs you are testing. This option becomes important if you
    want to run these tests as part of a continuous integration environment and want
    to fail your builds if the accessibility tests fail. [Figure 6-16](#part0013.html#Fig16)
    shows a sample output from the plug-in.


    ![9781484200148_Fig06-16.jpg](images/00054.jpeg)


    [Figure 6-16](#part0013.html#_Fig16). Sample output from running grunt-a11y


    The grunt-a11y plug-in reports issues with missing labels, ARIA properties, missing
    metadata, or low element contrast. This doesn’t replace actual accessibility testing
    with another suite of tools. However, this plug-in can be used as an aid to help
    ensure that a baseline of accessibility is maintained within your application.


    Exposing the Local Server to the Outside World


    While developing your application locally, it is always convenient to be able
    to share and show your work-in-progress to others. Also, third-party tools sometimes
    need the ability to view your application on the open Web, to be able to work
    effectively. This is true of tools such as Google PageSpeed Insights or WebPagetest,
    which can be used to analyze the network performance of your application. Fortunately,
    there is a tool called ngrok that allows you to securely expose a local development
    onto the Web with a public URL. In this section, we’ll explore configuring our
    Grunt workflow to allow us to easily expose our application.


    ngrok is available as a binary download from [https://ngrok.com](https://ngrok.com)
    and is also available as a Node module, which means we can easily integrate it
    into our Grunt workflow. To get started, let’s include ngrok in our project, by
    installing the package using npm, as shown in [Listing 6-35](#part0013.html#list35).


    [***Listing 6-35***](#part0013.html#_list35). Installing ngrok


    ```

    npm install ngrok --save-dev

    ```


    To use ngrok within our Grunt workflow, we will register a task within our Gruntfile.
    Our new task, ngrok, is asynchronous, as it will send a request to the ngrok API
    to request a public URL for our application. We have configured our application
    to run on port 8000 locally during development, hence we pass the port number
    8000 to the call to ngrok. The ngrok library returns either an error and/or a
    public URL. Once the URL has been returned, we can modify our configuration of
    other Grunt tasks to run against our public URL. For example, we can modify the
    URLs in our grunt-a11y task to run against a local development environment instead
    of a production environment. [Listing 6-36](#part0013.html#list36) shows the complete
    custom task.


    [***Listing 6-36***](#part0013.html#_list36). Custom Grunt Task for Running ngrok


    ```

    var ngrok = require (''ngrok'');


    module.exports = function (grunt) {


    grunt.registerTask(‘ngrok’, ''Running ngrok'', function () {

        var done = this.async();

        var port = 8000;


    ngrok.connect(port, function (err, url) {

          if (err !== null) {

            grunt.fail.fatal(err);

            return done();

          }

          grunt.log.write(url);

          done();

        });

      });


    // Register default tasks

      grunt.registerTask(''default'', [''ngrok'']);

    };

    ```


    If you are working within a corporate proxy, then it is likely you can combine
    ngrok with your other Grunt plug-ins to run these while behind the proxy. In the
    next section, we’ll expose our application, so that we are able to run performance
    tests against our site.


    Performance Testing


    In this final section of this chapter, we’ll explore the tools available to automate
    performance testing. We’ll be focusing on network performance in particular, reviewing
    how optimized our applications are for delivery over the network. There are a
    number of great tools available for performing these sorts of tests. We’ll be
    focusing on two plug-ins: grunt-pagespeed and grunt-perfbudget.'
  trans: "\n***清单 6-32***. 待办事项的 Jasmine 测试\n\n```\ndefine([\n  'app/js/models/todo'\n\
    ], function(Todo) {\n\ndescribe('A todo item', function() {\n    'use strict';\n\
    \nvar todo;\n\nbeforeEach(function() {\n      todo = new Todo({\n        'title':\
    \ 'Test Item',\n        'date': '24/02/2014'\n      });\n    });\n\nit('should\
