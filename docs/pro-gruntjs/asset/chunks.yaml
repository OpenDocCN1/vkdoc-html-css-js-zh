    \ Grunt 插件的`package.json`文件副本。前面示例中需要注意的重要属性是`devDependencies`和`dependencies`。这些属性允许我们定义项目所需的其他\
    \ Node.js 包。在本章后面，你将看到 Grunt 插件的依赖项是如何在此处体现的。\n\n`npm`提供了一个用于快速启动项目的便捷命令。它会询问一系列问题，并根据你的回答生成一个`package.json`文件。让我们回顾一下之前的示例，并为该项目生成一个`package.json`。首先，确保你位于项目的根文件夹（包含`index.js`的文件夹）中，然后运行以下命令：\n\
    \n```\nnpm init\n```\n\n随后，`npm`会提示你回答一系列问题（见图 2-8）。\n\n![9781484200148_Fig02-08.jpg](img/00014.jpeg)\n\
    \n图 2-8：示例应用程序从*卫报*网站输出的 HTML\n\n`npm`会显示即将生成的`package.json`，并询问是否正确。如果你选择“是”，你会发现在项目根目录下现在有了一个`package.json`文件。你可能还注意到，`npm`足够智能，可以检测到我们已经安装了`request`，并将其添加到生成的`package.json`文件中。\n\
    \n一旦`package.json`文件被添加到项目中，安装包时你需要添加一个额外的标志，以确保`npm`更新`package.json`。例如，如果我们想为项目添加一个流行的单元测试框架`nodeunit`，我们需要运行以下命令：\n\
    \n```\nnpm install nodeunit --save\n```\n\n`--save`标志告诉`npm`我们希望将此包添加为依赖项。或者，我们可以使用`--save-dev`将包添加到开发依赖项中。运行上述命令后，`package.json`文件应该类似于下面的代码清单\
    \ 2-6：\n\n***代码清单 2-6***：安装`nodeunit`后的`package.json`\n\n```json\n{\n  \"name\"\
    : \"guardian-grabber\",\n  \"version\": \"0.0.1\",\n  \"description\": \"\",\n\
    \  \"main\": \"index.js\",\n  \"dependencies\": {\n    \"request\": \"~2.34.0\"\
    ,\n    \"nodeunit\": \"⁰.8.6\"\n  },\n  \"devDependencies\": {},\n  \"scripts\"\
    : {\n    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n\
    \  \"author\": \"James Cryer\",\n  \"license\": \"ISC\"\n}\n```\n\n现在我们已经明确了什么是\
    \ Node.js 包，以及如何在自己的项目中搜索和安装它们，接下来我们可以进入 Grunt 本身。\n\n## Grunt\n\n如前所述，Grunt 插件是\
    \ Node.js 包。但是，我还没提到 Grunt 本身也是一个 Node.js 包。在本书中，我们将使用 Grunt 0.4.x 版本。注意 Grunt\
    \ 的版本很重要，因为 0.3.x 和 0.4.x 版本之间有一些重大的变化。最大的变化是将 Grunt 包拆分为三个独立的包：\n\n* `grunt-cli`\n\
    * `grunt`\n* `grunt-init`\n\n这一设计决策背后的原因稍后将会明确。首先，让我们通过运行以下命令来安装第一个包`grunt-cli`：\n\
    \n```\nnpm install -g grunt-cli\n```\n"
- fmt: 'This will install the `Grunt` command-line interface globally. This will make
    the `grunt` command available in your command line (for OS X, *nix, or BSD, etc.),
    or command prompt on Windows. Depending on your setup, the preceding command may
    have to be run using `sudo` or as administrator on the respective platforms.


    Once `grunt-cli` has been installed, you should be able to run the following:


    ```

    grunt –version

    ```


    And you should see a similar output to the one in [Figure 2-9](#part0009.html#Fig9).


    ![9781484200148_Fig02-09.jpg](images/00015.jpeg)


    [Figure 2-9](#part0009.html#_Fig9). Grunt version output on command line


    The `Grunt` command-line interface is not a task runner itself; it is responsible
    for running the local version of `Grunt` install on each project. This reduces
    the need to install the task runner globally and allows projects to have different
    versions of `Grunt` installed, if needed.


    The next step to using `Grunt` on a project is to install the second `Grunt` package,
    called `grunt`.


    ## Creating a New Project to Work with Grunt


    To use `Grunt` in a project, two specific files are required:


    *   `package.json`

    *   `Gruntfile`


    We’ve already seen `package.json` files, as part of our exploration into Node.js
    modules. This file will contain a development dependency on `grunt` itself and
    the associated plug-ins required for the project.


    The `Gruntfile`, either `Gruntfile.js` or `Gruntfile.coffee`, is the file that
    contains the configuration of your tasks and/or definition of custom tasks.


    ## Adding Grunt and Plug-ins to Your Project


    As discussed earlier, a `package.json` file can be added by using `npm init`.
    `Grunt` also offers an alternative approach, scaffolding a project with `Grunt`
    using `grunt-init`, and we’ll take a look at this later in the book. First, let’s
    reuse the `npm init` command to generate a `package.json` file, as in [Listing
    2-7](#part0009.html#list7).


    [***Listing 2-7***](#part0009.html#_list7). Sample `package.json` File


    ```

    {

      "name": "grunt-file-example",

      "version": "0.0.1",

      "description": "",

      "main": "index.js",

      "scripts": {

        "test": "echo \"Error: no test specified\" && exit 1"

      },

      "author": "James",

      "license": "ISC"

    }

    ```


    To now add `Grunt` to the project, run the following command in the root folder
    of your project:


    ```

    npm install grunt --save-dev

    ```


    This should be the latest stable version of `Grunt` added to your project, and
    it should store a reference in your `package.json`, which now looks like [Listing
    2-8](#part0009.html#list8).


    [***Listing 2-8***](#part0009.html#_list8). Updated `package.json` with Grunt
    Dependency Added


    ```

    {

      "name": "grunt-file-example",

      "version": "0.0.1",

      "description": "",

      "main": "index.js",

      "scripts": {

        "test": "echo \"Error: no test specified\" && exit 1"

      },

      "author": "James",

      "license": "ISC",

      "devDependencies": {

        "grunt": "^0.4.3"

      }

    }

    ```


    Note: `devDependencies` has been added to the end of the file, and `grunt` has
    been referenced. If you rerun the `grunt` command as follows, the output displays
    the version of `grunt-cli` and `Grunt` packages (see [Figure 2-10](#part0009.html#Fig10)):


    ```

    grunt –version

    ```


    ![9781484200148_Fig02-10.jpg](images/00016.jpeg)


    [Figure 2-10](#part0009.html#_Fig10). Grunt version output on command line


    At this stage, if you run the `grunt` command from within your project without
    any other flags, you will see an error. This error informs you that it is unable
    to find a `Gruntfile`.


    Create a new file in the root of your project and call it `Gruntfile.js`. This
    will create a JavaScript `Gruntfile`; however, if you would like to use CoffeeScript
    instead, save the file as `Gruntfile.coffee`. Throughout the book, all `Gruntfiles`
    will use JavaScript; however, I would recommend that you try writing your `Gruntfiles`
    using CoffeeScript. I personally favor CoffeeScript over JavaScript for this particular
    task, as it offers a cleaner and more readable configuration file.


    A `Gruntfile` consists of the following:


    *   The module exports, sometimes referred to the “wrapper” function

    *   Project and task configuration

    *   Loading Grunt plug-ins and tasks

    *   Custom tasks


    Let’s add the preceding to our `Gruntfile.js` file. First, we have to add the
    module’s exports statement to the `Gruntfile` (see [Listing 2-9](#part0009.html#list9)).


    [***Listing 2-9***](#part0009.html#_list9). Start of a `Gruntfile.js`


    ```

    module.exports = function(grunt) {


    };

    ```


    This should look familiar to you, I hope, as it follows the same pattern that
    Node.js modules use. It is important to note that the function we are exporting
    from our `Gruntfile` expects a single parameter, which we have named `grunt`.
    This `grunt` variable will allow us to access the `Grunt` API within our `Gruntfile`.
    This is essential for configuring our task runner and defining customer tasks.


    Next, we have to add our project configuration and tasks. As this is our first
    `Grunt` project, we will start simply and add a single task for concatenating
    files. The modified `Gruntfile` with the added configuration is as follows ([Listing
    2-10](#part0009.html#list10)):


    [***Listing 2-10***](#part0009.html#_list10). Adding `grunt-concat` to `Gruntfile.js`


    ```

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        pkg: grunt.file.readJSON(''package.json''),


    concat: {

          options: {

            separator: '';'',

          },

          dist: {

            src: [''src/fileA.js'', ''src/fileB.js''],

            dest: ''dist/built.js'',

          }

        }

    });

    };

    ```


    As you can see, there has been quite a number of lines added to the file. The
    first new line is a call to `grunt.initConfig`. This function initializes the
    configuration for the current project and expects a configuration object to be
    passed to it. A configuration object is a fancy name for a simple JavaScript object.
    Nearly every `Gruntfile` you write will contain a call to this function.


    Next, let’s inspect the configuration object passed to the `initConfig` call.
    There are two top-level properties: `pkg` and `concat`. The first property, `pkg`,
    stores a reference to contents of `package.json` for the project. It can be useful
    sometimes to use properties from our project definition within our `Gruntfile`.
    We will explore how to use these properties later in the book. The second property,
    `concat`, is our first task configuration.


    The `Grunt` plug-in we will use in this first project is `grunt-contrib-concat`.
    This plug-in has a task defined as `concat`, hence we can define our configuration
    for this task by using the same key. The next two key properties defined within
    `concat` are `options` and `dist`. `options` allows us, as developers, to override
    the defaults provided by the plug-in author. In our example, we’re overriding
    the default value for the `separator` option by specifying the character `;`.
    The `dist` property is known as a *target*. Targets allow us to configure a given
    task in multiple contexts and provide alternative options for each. In our first
    example, our target is used to define the input and output files for our task.
    The task will search for two files, `fileA.js` and `fileB.js`, in a folder `src/`.
    These will be merged, and the output will be stored in `dist/built.js`.


    At the moment, our `Gruntfile` is not valid, as we’ve not loaded our plug-in.
    Loading plug-ins is trivial, as `Grunt` provides an easy-to-use API to load each
    task. Update our `Gruntfile` by adding the following ([Listing 2-11](#part0009.html#list11)):


    [***Listing 2-11***](#part0009.html#_list11). Add `loadNpmTasks` to the File,
    to Load a Plug-in


    ```

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        pkg: grunt.file.readJSON(''package.json''),


    concat: {

          options: {

            separator: '';'',

          },

          dist: {

            src: [''src/fileA.js'', ''src/fileB.js''],

            dest: ''dist/built.js'',

          }

        }

      });


    // Load the plugin that provides the "concat" task.

      grunt.loadNpmTasks(''grunt-contrib-concat'');

    };

    ```'
