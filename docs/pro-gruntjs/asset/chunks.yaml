- fmt: "[***Listing 7-10***](#part0014.html#_list10). Using Grunt Boolean Option,\
    \ in This Case the Option Is `deploy`\n\n```sh\ngrunt clean --deploy\n```\n\n\
    `Grunt` supports the ability for you to specify an option value, instead of using\
    \ a Boolean option. For example, an option can be used to specify the environment.\
    \ [Listing 7-11](#part0014.html#list11) and [Listing 7-12](#part0014.html#list12)\
    \ contain examples of using an environment option to switch which dependencies\
    \ file is loaded. This provides a flexible solution, as a new environment can\
    \ be added quickly, simply by creating a new file then updating the environment\
    \ option passed to `Grunt`. This could be useful if you had a different build\
    \ for your development, continuous integration, and test and production environments.\n\
    \n[***Listing 7-11***](#part0014.html#_list11). Grunt Configuration Using an Option\
    \ to Switch Which Dependency File Is Loaded\n\n```js\nmodule.exports = function(grunt)\
    \ {\n\nvar env = grunt.option('environment') || 'dev';\n\n// Load time-grunt to\
    \ measure performance\n  require('time-grunt')(grunt);\n\n// Load dependencies\n\
    \  require('matchdep').filterDev('grunt-*', './build/' + env + '.json').forEach(grunt.loadNpmTasks);\n\
    \n};\n```\n\n[***Listing 7-12***](#part0014.html#_list12). Using Grunt Option\
    \ with Specify Value\n\n```sh\ngrunt build --environment=test\n```\n\n## Automating\
    \ Loading with `load-grunt-tasks`\n\n`matchdep` is not the only plug-in that can\
    \ be used to automate the loading of `Grunt` plug-ins. Another popular plug-in\
    \ for loading `Grunt` plug-ins is `load-grunt-tasks`. Both plug-ins are similar,\
    \ but `load-grunt-tasks` has a more succinct method for loading `Grunt` plug-ins.\
    \ [Listing 7-13](#part0014.html#list13) demonstrates the most basic approach of\
    \ loading `Grunt` plug-ins with `load-grunt-tasks`.\n\n[***Listing 7-13***](#part0014.html#_list13).\
    \ Loading Grunt Plug-ins with `load-grunt-tasks`\n\n```js\nmodule.exports = function(grunt)\
    \ {\n  require('load-grunt-tasks')(grunt);\n};\n```\n\nAs shown in [Listing 7-13](#part0014.html#list13),\
    \ the amount of code needed to load `Grunt` plug-ins with `load-grunt-tasks` is\
    \ less in comparison to the `matchdep` module. `Load-grunt-tasks` also supports\
    \ the same powerful set of options that `matchdep` supports for more advance use.\
    \ [Listing 7-14](#part0014.html#list14) contains an example of using `load-grunt-tasks`\
    \ to load dependencies based on an option passed to `Grunt`, which mirrors the\
    \ same load process demonstrated in [Listing 7-11](#part0014.html#list11), where\
    \ `matchdep` was used.\n\n[***Listing 7-14***](#part0014.html#_list14). Using\
    \ Option to Modify Which Dependencies Are Loaded with `load-grunt-tasks`\n\n```js\n\
    module.exports = function(grunt) {\n\nvar env = grunt.option('environment') ||\
    \ 'dev';\n\n// Load dependencies\n  require('load-grunt-tasks')(grunt, {\n   \
    \ pattern: 'grunt-*',\n    config: './build/' + env + '.json'\n  });\n\n};\n```\n\
    \n`load-grunt-tasks` accepts three options: `pattern`, `config`, and `scope`.\
    \ The `pattern` option allows us to filter by name which plug-ins are loaded,\
    \ as we were able to do earlier with `matchdep`. The `config` pattern allows you\
    \ to specify which JSON dependency file should be loaded. The `scope` option specifies\
    \ in which type of dependencies you wish to search for plug-ins. The `scope` option\
    \ allows the following values: `dependencies`, `devDependencies`, `peerDependencies`,\
    \ and `bundledDependencies`.\n\n## Deferring Automating Loading\n\nThe ability\
    \ to automate the loading tasks not only simplifies the addition of new plug-ins\
    \ to our `Gruntfile` but also allows us to easily optimize our loading of plug-ins.\
    \ We can now decide which plug-ins to load at a specific point in time. We can\
    \ defer the loading of a particular plug-in until a task is run. [Listing 7-15](#part0014.html#list15)\
    \ contains an example in which we’re not loading `grunt-contrib-imagemin` and\
    \ `grunt-spritesmith` until our custom image task is run.\n\n[***Listing 7-15***](#part0014.html#_list15).\
    \ Defering Loading of Expensive Plug-ins Until They Are Used\n\n```js\nmodule.exports\
    \ = function(grunt) {\n\nvar env = grunt.option('environment') || 'dev';\n\nrequire('load-grunt-tasks')(grunt,\
    \ {\n    pattern: ['grunt-*', '!grunt-contrib-imagemin', '!grunt-spritesmith'],\n\
    \    config: './build/' + env + '.json'\n  });\n\ngrunt.registerTask('images',\
    \ [], function () {\n    require('load-grunt-tasks')(grunt, { config: './build/images.json'\
    \ });\n    grunt.task.run('imagemin', 'sprite');\n  });\n\n};\n```\n\nThere are\
    \ two fundamental changes in [Listing 7-15](#part0014.html#list15). The first\
    \ is a modified `pattern` passed to our first `load-grunt-tasks` call that excludes\
    \ the `grunt-contrib-imagemin` and `grunt-spritesmith` plug-ins. The second change\
    \ is the definition of a new task called `images`. Inside the body of our task,\
    \ we use `load-grunt-tasks` to load our image dependencies, as defined in a separate\
    \ file, before telling `grunt` to run the `imagemin` and `sprite` tasks. This\
    \ approach will defer the loading of `grunt-contrib-imagemin` and `grunt-spritesmith`\
    \ until we run the `images` task. Deferring the loading of a plug-in until it\
    \ is needed will reduce the time taken to run all other tasks.\n\nIn this section,\
    \ we’ve started to improve how we can load tasks by automating loading of plug-ins,\
    \ switching loaded plug-ins based on options, and deferring the loading of plug-ins\
    \ until they are needed. [Figure 7-4](#part0014.html#Fig4) shows the output of\
    \ our application after `grunt-contrib-imagemin` is removed from the main task.\
    \ Our total time has dropped from 11 seconds to 9.1 seconds. The reduction in\
    \ time isn’t too significant but demonstrates how you can start to reduce your\
    \ build time. Throughout the chapter, we’ll continue to reduce time by adding\
    \ further techniques to optimize the build process.\n\n![9781484200148_Fig07-04.jpg](images/00060.jpeg)\n\
    \n[Figure 7-4](#part0014.html#_Fig4). Reduction is overall runtime after our changes\n\
    \n## Organizing Your Gruntfile\n\nIn the previous section, we optimized how to\
    \ load plug-ins into our `Grunt` workflow, and in doing so, we removed 30 lines\
    \ from our `Gruntfile`. In this section, we’ll be removing approximately 300 lines\
    \ from our `Gruntfile`, as we explore ways of managing our task configuration\
    \ in an improved approach. The previous section reduced the overtime taken for\
    \ our `Grunt` tasks to run. The aim of this section is to make our task configuration\
    \ more maintainable. The first step to improved maintenance is to extract our\
    \ task configuration into more manageable modules. The second step is to extract\
    \ all the hard-coded paths from our `Grunt` configuration into configuration objects,\
    \ making it easier to share configuration across tasks.\n\n### Using Modules\n\
    \nTo make our first improvement, we’ll be moving our entire configuration out\
    \ of the `Gruntfile` and into individual modules for each task. To achieve this,\
    \ we’ll be using part of the `Grunt` API to load our configuration in a single\
    \ API call. [Listing 7-16](#part0014.html#list16) contains our updated `Gruntfile`,\
    \ which utilizes the `Grunt` API to simplify our `Gruntfile`, by using `grunt.task.loadTasks`.\
    \ Using `grunt.task.loadTasks` will load all the files in the folder path provided.\
    \ In our example, we specify the folder as `tasks`, and, therefore, `Grunt` will\
    \ attempt to load files within a `tasks` folder relative to the `Gruntfile`. It\
    \ is important to note that we are no longer making a call to `grunt.initConfig`.\n\
    \n[***Listing 7-16***](#part0014.html#_list16). Removing Task Configuration from\
    \ Main Gruntfile\n\n```js\nmodule.exports = function(grunt) {\n\n// Measure performance\n\
    \  require('time-grunt')(grunt);\n\n// Load main tasks\n  require('load-grunt-tasks')(grunt,\
    \ {\n    pattern: ['grunt-*', '!grunt-contrib-imagemin', '!grunt-spritesmith']\n\
    \  });\n\n// Custom task for images\n  grunt.registerTask('images', [], function\
    \ () {\n    require('load-grunt-tasks')(grunt, { config: './build/images.json'\
    \ });\n    grunt.task.run('imagemin', 'sprite');\n  });\n\n// Load configuration\n\
    \  grunt.task.loadTasks('tasks');\n};\n```"
  raw: '[***Listing 7-10***](#part0014.html#_list10). Using Grunt Boolean Option,
    in This Case the Option Is deploy


    ```

    grunt  clean --deploy

    ```


    Grunt supports the ability for you to specify an option value, instead of using
    a Boolean option. For example, an option can be used to specify the environment.
    [Listing 7-11](#part0014.html#list11) and [Listing 7-12](#part0014.html#list12)
    contain examples of using an environment option to switch which dependencies file
    is loaded. This provides a flexible solution, as a new environment can be added
    quickly, simply by creating a new file then updating the environment option passed
    to Grunt. This could be useful if you had a different build for your development,
    continuous integration, and test and production environments.


    [***Listing 7-11***](#part0014.html#_list11). Grunt Configuration Using an Option
    to Switch Which Dependency File Is Loaded


    ```

    module.exports = function(grunt) {


    var env = grunt.option(''environment'') || ''dev'';


    // Load time-grunt to measure performance

      require(''time-grunt'')(grunt);


    // Load dependencies

      require(''matchdep'').filterDev(''grunt-*'', ''./build/'' + env + ''.json'').forEach(grunt.loadNpmTasks);


    };

    ```


    [***Listing 7-12***](#part0014.html#_list12). Using Grunt Option with Specify
    Value


    ```

    grunt build --environment=test

    ```


    Automating Loading with load-grunt-tasks


    matchdep is not the only plug-in that can be used to automate the loading of Grunt
    plug-ins. Another popular plug-in for loading Grunt plug-ins is load-grunt-tasks.
    Both plug-ins are similar, but load-grunt-tasks has a more succinct method for
    loading Grunt plug-ins. [Listing 7-13](#part0014.html#list13) demonstrates the
    most basic approach of loading Grunt plug-ins with load-grunt-tasks.


    [***Listing 7-13***](#part0014.html#_list13). Loading Grunt Plug-ins with load-grunt-tasks


    ```

    module.exports = function(grunt) {

      require(''load-grunt-tasks'')(grunt);

    };

    ```


    As shown in [Listing 7-13](#part0014.html#list13), the amount of code needed to
    load Grunt plug-ins with load-grunt-tasks is less in comparison to the matchdep
    module. Load-grunt-tasks also supports the same powerful set of options that matchdep
    supports for more advance use. [Listing 7-14](#part0014.html#list14) contains
    an example of using load-grunt-tasks to load dependencies based on an option passed
    to Grunt, which mirrors the same load process demonstrated in [Listing 7-11](#part0014.html#list11),
    where matchdep was used.


    [***Listing 7-14***](#part0014.html#_list14). Using Option to Modify Which Dependencies
    Are Loaded with load-grunt-tasks


    ```

    module.exports = function(grunt) {


    var env = grunt.option(''environment'') || ''dev'';


    // Load dependencies

      require(''load-grunt-tasks'')(grunt, {

        pattern: ''grunt-*'',

        config: ''./build/'' + env + ''.json''

      });


    };

    ```


    load-grunt-tasks accepts three options: pattern, config, and scope. The pattern
    option allows us to filter by name which plug-ins are loaded, as we were able
    to do earlier with matchdep. The config pattern allows you to specify which json
    dependency file should be loaded. The scope option specifies in which type of
    dependencies you wish to search for plug-ins. The scope option allows the following
    values: dependencies, devDependencies, peerDependencies, and bundledDependencies.


    Deferring Automating Loading


    The ability to automate the loading tasks not only simplifies the addition of
    new plug-ins to our Gruntfile but also allows us to easily optimize our loading
    of plug-ins. We can now decide which plug-ins to load at a specific point in time.
    We can defer the loading of a particular plug-in until a task is run. [Listing
    7-15](#part0014.html#list15) contains an example in which we’re not loading grunt-contrib-imagemin
    and grunt-spritesmith until our custom image task is run.


    [***Listing 7-15***](#part0014.html#_list15). Defering Loading of Expensive Plug-ins
    Until They Are Used


    ```

    module.exports = function(grunt) {


    var env = grunt.option(''environment'') || ''dev'';


    require(''load-grunt-tasks'')(grunt, {

        pattern: [''grunt-*'', ''!grunt-contrib-imagemin'', ''!grunt-spritesmith''],

        config: ''./build/'' + env + ''.json''

      });


    grunt.registerTask(''images'', [], function () {

        require(''load-grunt-tasks'')(grunt, { config: ''./build/images.json'' });

        grunt.task.run(''imagemin'', ''sprite'');

      });


    };

    ```


    There are two fundamental changes in [Listing 7-15](#part0014.html#list15). The
    first is a modified pattern passed to our first load-grunt-tasks call that excludes
    the grunt-contrib-imagemin and grunt-spritesmith plug-ins. The second change is
    the definition of a new task called images. Inside the body of our task, we use
    load-grunt-tasks to load our image dependencies, as defined in a separate file,
    before telling grunt to run the imagemin and sprite tasks. This approach will
    defer the loading of grunt-contrib-imagemin and grunt-spritesmith until we run
    the images task. Deferring the loading of a plug-in until it is needed will reduce
    the time taken to run all other tasks.


    In this section, we’ve started to improve how we can load tasks by automating
    loading of plug-ins, switching loaded plug-ins based on options, and deferring
    the loading of plug-ins until they are needed. [Figure 7-4](#part0014.html#Fig4)
    shows the output of our application after grunt-contrib-imagemin is removed from
    the main task. Our total time has dropped from 11 seconds to 9.1 seconds. The
    reduction in time isn’t too significant but demonstrates how you can start to
    reduce your build time. Throughout the chapter, we’ll continue to reduce time
    by adding further techniques to optimize the build process.


    ![9781484200148_Fig07-04.jpg](images/00060.jpeg)


    [Figure 7-4](#part0014.html#_Fig4). Reduction is overall runtime after our changes


    Organizing Your Gruntfile


    In the previous section, we optimized how to load plug-ins into our Grunt workflow,
    and in doing so, we removed 30 lines from our Gruntfile. In this section, we’ll
    be removing approximately 300 lines from our Gruntfile, as we explore ways of
    managing our task configuration in an improved approach. The previous section
    reduced the overtime taken for our Grunt tasks to run. The aim of this section
    is to make our task configuration more maintainable. The first step to improved
    maintenance is to extract our task configuration into more manageable modules.
    The second step is to extract all the hard-coded paths from our Grunt configuration
    into configuration objects, making it easier to share configuration across tasks.


    Using Modules


    To make our first improvement, we’ll be moving our entire configuration out of
    the Gruntfile and into individual modules for each task. To achieve this, we’ll
    be using part of the Grunt API to load our configuration in a single API call.
    [Listing 7-16](#part0014.html#list16) contains our updated Gruntfile, which utilizes
    the Grunt API to simplify our Gruntfile, by using grunt.task.loadTasks. Using
    grunt.task.loadTasks will load all the files in the folder path provided. In our
    example, we specify the folder as tasks, and, therefore, Grunt will attempt to
    load files within a tasks folder relative to the Gruntfile. It is important to
    note that we are no longer making a call to grunt.initConfig.


    [***Listing 7-16***](#part0014.html#_list16). Removing Task Configuration from
    Main Gruntfile


    ```

    module.exports = function(grunt) {


    // Measure performance

      require(''time-grunt'')(grunt);


    // Load main tasks

      require(''load-grunt-tasks'')(grunt, {

        pattern: [''grunt-*'', ''!grunt-contrib-imagemin'', ''!grunt-spritesmith'']

      });


    // Custom task for images

      grunt.registerTask(''images'', [], function () {

        require(''load-grunt-tasks'')(grunt, { config: ''./build/images.json'' });

        grunt.task.run(''imagemin'', ''sprite'');

      });


    // Load configuration

      grunt.task.loadTasks(''tasks'');

    };

    ```'
