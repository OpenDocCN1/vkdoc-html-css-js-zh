  trans: "\n# 紧凑文件格式\n\n紧凑文件格式通常用于只读任务。由于它接受单一的源文件到目标文件的映射，因此`src`属性不需要对应的`dest`属性。它适用于对一组文件执行操作并报告这些文件状态的任务。此类任务的一个例子是单元测试运行器，它针对一组测试用例执行操作并报告每个测试的结果。\n\
    \n以下是使用`grunt-mocha-test`插件的紧凑文件格式示例（清单 2-16）。对于不熟悉 Mocha（[`mochajs.org/`](http://mochajs.org/)）的读者，它是一个\
    \ JavaScript 测试运行器。\n\n***清单 2-16***. 使用紧凑文件格式运行 Mocha 测试\n\n```\nmodule.exports\
    \ = function(grunt) {\n\ngrunt.initConfig({\n    // 配置一个 mochaTest 任务\n    mochaTest:\
    \ {\n      test: {\n        options: {\n          reporter: 'spec'\n        },\n\
    \        src: ['test/**/*.js']\n      }\n    }\n  });\n\n// 添加 grunt-mocha-test\
    \ 任务。\n  grunt.loadNpmTasks('grunt-mocha-test');\n  grunt.registerTask('default',\
    \ 'mochaTest');\n\n};\n```\n\n上述`Gruntfile`加载了`grunt-mocha-test`插件，并用它来处理`test`文件夹中所有扩展名为`.js`的文件。为了匹配`test`目录内的所有文件，我们使用了通配符模式。该模式将匹配顶级`test`目录及其任何子目录中的所有文件。如果我们只想匹配顶级`test`文件夹内的文件，我们可以将模式简化为`*.js`。这里需要注意的重点是缺少`dest`属性，因为任务不会输出到文件。\n\
    \n# 文件对象格式\n\n文件对象格式允许定义多个源文件到目标文件的映射。文件对象格式将映射声明为一个 JavaScript 对象，其中目标文件作为属性键，而值可以是一个或多个源文件。由于每个映射本质上以“目标”文件为键，因此一个目标可以包含多个映射。当你希望将一组文件合并成单个文件时（例如在拼接\
    \ JavaScript 文件的情况下），通常会使用这种格式。\n\n以下`Gruntfile`（清单 2-17）演示了文件对象格式的使用。\n\n***清单\
    \ 2-17***. 使用文件对象格式拼接文件\n\n```\nmodule.exports = function(grunt) {\n\n// 项目配置。\n\
    \  grunt.initConfig({\n    pkg: grunt.file.readJSON('package.json'),\n\nconcat:\
    \ {\n      options: {\n        separator: ';',\n      },\n      dist: {\n    \
    \    files: {\n          'build/app.js': ['src/fileA.js', 'src/fileB.js']\n  \
    \      }\n      }\n    }\n  });\n\n// 加载提供\"concat\"任务的插件。\n  grunt.loadNpmTasks('grunt-contrib-concat');\n\
    };\n```\n\n上述`Gruntfile`重访了我们之前的例子，但不同之处在于，它将目标文件定义为属性名本身，而不是定义`src`和`dest`属性。\n\
    \n# 文件数组格式\n\n文件数组格式扩展了紧凑格式，允许每个目标包含多个源文件到目标文件的映射。它不是使用单一的`src`和`dest`属性，而是将文件声明为一个`files`属性，该属性的值是紧凑格式的数组。以下示例（清单\
    \ 2-18）修改了我们现有的例子，将 CSS 拼接功能添加到了同一个目标中。\n\n***清单 2-18***. 使用文件数组格式将多个文件拼接在一起\n\
    \n```\nmodule.exports = function(grunt) {\n\n// 项目配置。\n  grunt.initConfig({\n\
    \    pkg: grunt.file.readJSON('package.json'),\n\nconcat: {\n      options: {\n\
    \        separator: ';',\n      },\n      dist: {\n        files: [\n        \
    \  {src: ['src/fileA.js', 'src/fileB.js'], dest: 'build/app.js'},\n          {src:\
    \ ['src/stylesA.css', 'src/stylesB.css'], dest: 'build/app.css'}\n        ]\n\
    \      }\n    }\n  });\n\n// 加载提供\"concat\"任务的插件。\n  grunt.loadNpmTasks('grunt-contrib-concat');\n\
    };\n```\n\n在上例中，`src`和`dest`属性已被替换为`files`属性。`files`属性被赋予一个对象数组。每个对象都有`src`和`dest`属性，从而可以声明多个源文件到目标文件的映射。`dist`目标的输出将是`build/app.js`和`build/app.css`。\n\
    \n# 总结\n\n在本章中，你已开始探索如何将 Grunt 引入项目。首先，你熟悉了 Node 和 npm，因为它们是理解 Grunt 及其插件生态系统工作原理的基础。本章其余部分讨论了在项目中安装\
    \ Grunt、安装第一个任务以及如何为任务提供所需配置的方法。最后，介绍了 Grunt 提供的灵活 API，用于在项目中模式匹配文件，从而为任务定义输入和输出。\n\
    \n下一章将开始探讨使用 Grunt 自动化处理与 HTML 和 CSS 相关的常见任务的实际用例。\n\n# 第 3 章\n\n![image](img/00005.jpeg)\n\
    \n# 将 Grunt 与 HTML 和 CSS 结合使用\n\n在上一章中，我们探讨了如何引导项目使用 Grunt，以及如何在项目中安装和配置任务。接下来，我们将介绍多种有用的插件，它们可以在处理\
    \ Web 基础——HTML 和 CSS——时帮助我们优化工作流程。本章涵盖的主题包括 CSS 预处理、简化第三方依赖的安装，以及优化内容以进行公开发布。\n\
    \n在探索可用于自动化处理 HTML 和 CSS 的任务之前，让我先介绍一个项目，我们将用它来演示所有可用的优秀插件。\n\n## 演示应用\n\n在本书余下部分，我们将介绍多种免费的\
    \ Grunt 插件，供你在未来的项目中使用。为了帮助演示每一种插件，我们将开发一个应用程序。这个应用程序将是一个简单的 Node 应用程序，允许用户在浏览器中维护一个简单的待办事项列表。如果你对\
    \ Node 不太熟悉，也不必担心，因为我们只会使用 Node 来运行一个非常简单的 Web 服务器。\n\n该应用程序的绝大部分将涉及 HTML、CSS\
    \ 和 JavaScript。首先，让我们使用一个精简版的 HTML5 boilerplate HTML（参见清单 3-1）。\n\n***清单 3-1***.\
    \ 待办事项列表应用的 HTML 模板\n\n```\n<!DOCTYPE html>\n<html class=\"no-js\">\n <head>\n\
    \  <meta charset=\"utf-8\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"\
    IE=edge\">\n  <title>Pro Grunt.js: 待办事项列表</title>\n  <meta name=\"description\"\
    \ content=\"\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n\n<link rel=\"stylesheet\" href=\"css/main.css\">\n </head>\n <body>\n  <!--[if\
    \ lt IE 8]>\n   <p class=\"browsehappy\">你正在使用一个<strong>过时</strong>的浏览器。请<a href=\"\
    http://browsehappy.com/\">升级你的浏览器</a>以提升体验。</p>\n  <![endif]-->\n\n<!-- 在此处添加你的网站或应用内容\
    \ -->\n  <h1>Pro Grunt.js</h1>\n  <h2>待办事项列表</h2>\n\n<script src=\"//ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js\"\
    ></script>\n  <script>window.jQuery || document.write('<script src=\"js/vendor/jquery-1.11.0.min.js\"\
    ><\\/script>')</script>\n  <script src=\"js/main.js\"></script>\n </body>\n</html>\n\
    ```\n\n从清单 3-1 可以看出，目前这个 HTML 文档非常小巧。`head`元素中包含了一个 CSS 文件；`body`标签末尾引入了 jQuery\
    \ 和`main.js` JavaScript 文件。现在不必担心 CSS 和 JavaScript 文件，这些将在本书后面部分介绍。首先，让我们看看 Grunt\
    \ 如何帮助我们生成、检查（lint）和压缩 CSS 文件。\n\n## CSS 预处理\n"
- fmt: "# CSS Preprocessing\n\n`CSS preprocessing` is a relatively new technology,\
    \ existing only for approximately the past five years. Within these five years,\
    \ there has been rapid adoption by developers, primarily owing to it solving some\
    \ of the pain points of using CSS. As it stands, there are currently three major\
    \ CSS preprocessors available: LESS ([http://lesscss.org](http://lesscss.org)),\
    \ Sass ([http://sass-lang.com](http://sass-lang.com)), and Stylus ([www.stylus.com](http://www.stylus.com)).\
    \ CSS preprocessors have grown in such popularity that browser vendors have started\
    \ to offer support as part of their developer tools.\n\nCSS preprocessors typically\
    \ extend CSS, offering new features such as the ability to define variables and\
    \ nested selectors. This generally leads to cleaner and more maintainable CSS.\
    \ For demonstration purposes, in this book, we will be using Sass. To use Sass,\
    \ you must have the Ruby language installed.\n\n## Installing Sass\n\nTo be able\
    \ to install Sass, you will have to install Ruby onto your machine. Once successfully\
    \ installed, Ruby should be available via the command line or command prompt.\n\
    \n### Installing Ruby on Linux\n\nTo install Ruby on Linux, it is best to install\
    \ it from your distribution package manager or tools such as `rbenv` or `rvm`.\n\
    \n### Installing Ruby on Windows\n\nOn Windows, there is a one-click installer\
    \ for Ruby. Once installed, Ruby should be available on the command prompt.\n\n\
    ### Installing Ruby on Mac OS X\n\nRuby comes preinstalled on Mac OS X; however,\
    \ the version installed depends on the version of Mac OS X you are running. Mountain\
    \ Lion comes bundled with version 1.8.7, while Mavericks comes with Ruby 2.0.0.\n\
    \nI would recommend running 2.0.0 while working with Sass. For those readers using\
    \ Mountain Lion or older versions, I’d recommend using `rbenv` to install and\
    \ maintain your Ruby installations.\n\n## Checking Your Ruby Installation\n\n\
    Once you have Ruby installed, you should be able to run the Ruby command from\
    \ the command line or command prompt. [Listing 3-2](#part0010.html#list2) demonstrates\
    \ how to check which version of Ruby you have installed.\n\n[***Listing 3-2***](#part0010.html#_list2).\
    \ Checking the Version of Ruby Installed\n\n```\nruby --version\n```\n\nThis command\
    \ should output something similar to what is shown in [Figure 3-1](#part0010.html#Fig1).\n\
    \n![9781484200148_Fig03-01.jpg](images/00020.jpeg)\n\n[Figure 3-1](#part0010.html#_Fig1).\
    \ Ruby version currently installed\n\nIf you do not see a similar output to the\
    \ one above, I would recommend double-checking the installation steps for the\
    \ platform you are running. To get started with Sass, the next step is to install\
    \ the gem. Similar to Node, Ruby has a package manager system called Ruby Gems,\
    \ and each Ruby package is bundled as a gem. [Listing 3-3](#part0010.html#list3)\
    \ demonstrates how to install Sass from the command line or command prompt and\
    \ subsequently check the version of Sass installed.\n\n[***Listing 3-3***](#part0010.html#_list3).\
    \ Installing Sass Gem\n\n```\ngem install sass\nsass --version\n```\n\nIf Sass\
    \ has successfully installed, a similar output to `Sass 3.3.3 (Maptastic Maple)`\
    \ will be printed. Now that we have Sass installed, let’s take a brief look at\
    \ its key features, before looking at how Grunt can help us while working with\
    \ Sass.\n\n## Brief Introduction to Sass\n\nAs mentioned earlier, Sass is a CSS\
    \ preprocessor. You’re probably wondering what this means. Well, Sass takes some\
    \ input, runs a process over it, and the output is CSS. By this process, the input\
    \ can either be SCSS or Sass files. SCSS is the main syntax of Sass 3, and what\
    \ we will be using throughout this book. Sass is a slightly older syntax-inspired\
    \ HAML that has a much stricter set of rules for compiling.\n\nThe SCSS, also\
    \ known as Sassy CSS, is a superset of CSS3, which means that any CSS3 style sheet\
    \ is a valid SCSS style sheet. SCSS files have the file extension `.scss`. [Listing\
    \ 3-4](#part0010.html#list4) demonstrates how Sass can be used to compile a SCSS\
    \ file to CSS from the command line.\n\n[***Listing 3-4***](#part0010.html#_list4).\
    \ Compiling an SCSS File to CSS Using Sass\n\n```\nsass input.scss output.css\n\
    ```\n\nRunning the command in [Listing 3-4](#part0010.html#list4) will output\
    \ a CSS file containing all the styles listed in the SCSS file `input.scss`. The\
    \ command-line tool `sass` can also be passed a number of flags to modify the\
    \ generated CSS file. We will take a look at some of these flags later in the\
    \ chapter. Before this, we’ll explore the features of Sass that improve the maintainability\
    \ and readability of our CSS files.\n\n## Variables\n\nVariables should be familiar\
    \ to readers who have some programming experience in such languages as JavaScript\
    \ or Ruby. Variables offer a method of storing a value so that we can reuse it\
    \ later on. Variables also provide a convenient and memorable name for referencing\
    \ this value. In terms of Sass, variables can be used to store CSS property values.\
    \ [Listing 3-5](#part0010.html#list5) demonstrates how we can store hex values\
    \ for colors that are used later in our SCSS file.\n\n[***Listing 3-5***](#part0010.html#_list5).\
    \ Variables Used to Store Color Values\n\n```\n$primary-color: #A2A2A2;\n$background-color:\
    \ #C3C3C3;\n\nbody {\n    color: $primary-color;\n    background: $background-color;\n\
    }\n```\n\nVariables start with `$` and then the name of the variable. The value\
    \ of the variable appears after the `:`. In our example, we’re only using variables\
    \ to store color values, but variables can also store CSS attribute values for\
    \ any CSS property. When Sass is processing, the variables are replaced with the\
    \ variable values, but the variable definitions are not. [Listing 3-6](#part0010.html#list6)\
    \ shows the preceding example after it has been processed.\n\n[***Listing 3-6***](#part0010.html#_list6).\
    \ CSS Output from Processing the SCSS File in [Listing 3-5](#part0010.html#list5)\n\
    \n```\nbody {\n    color: #A2A2A2;\n    background: #C3C3C3;\n}\n```\n\n## Nesting\n\
    \nAnother powerful feature is the ability to nest selectors, which allows CSS\
    \ authors to nest their CSS selectors to match the visual representation of your\
    \ HTML. [Listing 3-7](#part0010.html#list7) demonstrates how nesting can be used\
    \ to make your CSS more readable and maintainable.\n\n[***Listing 3-7***](#part0010.html#_list7).\
    \ Using Nested Selectors\n\n```\nheader {\n    width: 936px;\n    padding: 12px;\n\
    \n    h1 {\n        font-size: 2.4em;\n        line-height: 1em;\n        margin:\
    \ 0 0 12px;\n    }\n\n    nav {\n        padding: 12px;\n    }\n}\n```\n\nNote\
    \ how the `h1` and `nav` selectors are nested within the `header` selector. As\
    \ Sass processes the SCSS file, it collapses nested selectors to generate more\
    \ complex selectors. The output from the SCSS file in [Listing 3-7](#part0010.html#list7)\
    \ is shown in [Listing 3-8](#part0010.html#list8).\n\n[***Listing 3-8***](#part0010.html#_list8).\
    \ Output from Nested Selectors\n\n```\nheader {\n    width: 936px;\n    padding:\
    \ 12px;\n}\n\nheader h1 {\n    font-size: 2.4em;\n    line-height: 1em;\n    margin:\
    \ 0 0 12px;\n}\n\nheader nav {\n    padding: 12px;\n}\n```\n\nIn addition to nesting\
    \ selectors, a more advanced feature is available to combine nested pseudo-class\
    \ selectors (as shown in [Listing 3-9](#part0010.html#list9)).\n\n[***Listing\
    \ 3-9***](#part0010.html#_list9). Pseudo-class Selectors Combined with Nested\
    \ Selectors\n\n```\na {\n    text-decoration: none;\n\n    &:hover,\n    &:focus\
    \ {\n        text-decoration: underline;\n    }\n}\n```\n\nNote the use of the\
    \ ampersand (`&`) in [Listing 3-9](#part0010.html#list9). This leads to the current\
    \ selector being appended to the parent selector, which in our example is `a`.\
    \ The output of our example is shown in [Listing 3-10](#part0010.html#list10),\
    \ with the selector `a:hover, a:focus` being generated.\n\n[***Listing 3-10***](#part0010.html#_list10).\
    \ Appending Pseudo-class Selectors with `&`\n\n```\na {\n    text-decoration:\
    \ none;\n}\n\na:hover, a:focus {\n    text-decoration: underline;\n}\n```\n\n\
    ## Partials and Imports"
  raw: 'CSS preprocessing is a relatively new technology, existing only for approximately
    the past five years. Within these five years, there has been rapid adoption by
    developers, primarily owing to it solving some of the pain points of using CSS.
    As it stands, there are currently three major CSS preproccesors available: LESS
    ([http://lesscss.org](http://lesscss.org)), Sass ([http://sass-lang.com](http://sass-lang.com)),
    and Stylus ([www.stylus.com](http://www.stylus.com)). CSS preprocessors have grown
    in such popularity that browser vendors have started to offer support as part
    of their developer tools.


    CSS preprocessors typically extend CSS, offering new features such as the ability
    to define variables and nested selectors. This generally leads to cleaner and
    more maintainable CSS. For demonstration purposes, in this book, we will be using
    Sass. To use Sass, you must have the Ruby language installed.


    Installing Sass


    To be able to install Sass, you will have to install Ruby onto your machine. Once
    successfully installed, Ruby should be available via the command line or command
    prompt.


    Installing Ruby on Linux


    To install Ruby on Linux, it is best to install it from your distribution package
    manager or tools such as rbenv or rvm.


    Installing Ruby on Windows


    On Windows, there is a one-click installer for Ruby. Once installed, Ruby should
    be available on the command prompt.


    Installing Ruby on Mac OS X


    Ruby comes preinstalled on Mac OS X; however, the version install depends on the
    version of Mac OS X you are running. Mountain Lion comes bundled with version
    1.8.7, while Mavericks comes with Ruby 2.0.0.


    I would recommend running 2.0.0 while working with Sass. For those readers using
    Mountain Lion or older versions, I’d recommend using rbenv to install and maintain
    your Ruby installations.


    Checking Your Ruby Installation


    Once you have Ruby installed, you should be able to run the Ruby command from
    the command line or command prompt. [Listing 3-2](#part0010.html#list2) demonstrates
    how to check which version of Ruby you have installed.


    [***Listing 3-2***](#part0010.html#_list2). Checking the Version of Ruby Installed


    ```

    ruby --version

    ```


    This command should output something similar to what is shown in [Figure 3-1](#part0010.html#Fig1).


    ![9781484200148_Fig03-01.jpg](images/00020.jpeg)


    [Figure 3-1](#part0010.html#_Fig1). Ruby version currently installed


    If you do not see a similar output to the one above, I would recommend double-checking
    the installation steps for the platform you are running. To get started with Sass,
    the next step is to install the gem. Similar to Node, Ruby has a package manager
    system called Ruby Gems, and each Ruby package is bundled as a gem. [Listing 3-3](#part0010.html#list3)
    demonstrates how to install Sass from the command line or command prompt and subsequently
    check the version of Sass installed.


    [***Listing 3-3***](#part0010.html#_list3). Installing Sass Gem


    ```

    gem install sass

    sass --version

    ```


    If Sass has successfully installed, a similar output to Sass 3.3.3 (Maptastic
    Maple) will be printed. Now that we have Sass installed, let’s take a brief look
    at its key features, before looking at how Grunt can help us while working with
    Sass.


    Brief Introduction to Sass


    As mentioned earlier, Sass is a CSS preproccessor. You’re probably wondering what
    this means. Well, Sass takes some input, runs a process over it, and the output
    is CSS. By this process, the input can either be SCSS or Sass files. SCSS is the
    main syntax of Sass 3, and what we will be using throughout this book. Sass is
    a slightly older syntax-inspired HAML that has a much stricter set of rules for
    compiling.


    The SCSS, also known as Sassy CSS, is a superset of CSS3, which means that any
    CSS3 style sheet is a valid SCSS style sheet. SCSS files have the file extension
    .scss. [Listing 3-4](#part0010.html#list4) demonstrates how Sass can be used to
    compile a SCSS file to CSS from the command line.


    [***Listing 3-4***](#part0010.html#_list4). Compiling an SCSS File to CSS Using
    Sass


    ```

    sass input.scss output.css

    ```


    Running the command in [Listing 3-4](#part0010.html#list4) will output a CSS file
    containing all the styles listed in the SCSS file input.scss. The command-like
    tool sass can also be passed a number of flags to modify the generated CSS file.
    We will take a look at some of these flags later in the chapter. Before this,
    we’ll explore the features of Sass that improve the maintainability and readability
    of our CSS files.


    Variables


    Variables should be familiar to readers who have some programming experience in
    such languages as JavaScript or Ruby. Variables offer a method of storing a value
    so that we can reuse it later on. Variables also provide a convenient and memorable
    name for referencing this value. In terms of Sass, variables can be used to store
    CSS property values. [Listing 3-5](#part0010.html#list5) demonstrates how we can
    store hex values for colors that are used later in our SCSS file.


    [***Listing 3-5***](#part0010.html#_list5). Variables Used to Store Color Values


    ```

    $primary-color: #A2A2A2;

    $background-color: #C3C3C3;


    body {

        color: $primary-color;

        background: $background-color;

    }

    ```


    Variables start with $ and then name of the variable. The value of the variable
    appears after the :. In our example, we’re only using variables to store color
    values, but variables can also store CSS attribute values for any CSS property.
    When Sass is processing, the variables are replaced with the variable values,
    but the variable definitions are not. [Listing 3-6](#part0010.html#list6) shows
    the preceding example after it has been processed.


    [***Listing 3-6***](#part0010.html#_list6). CSS Output from Processing the SCSS
    File in [Listing 3-5](#part0010.html#list5)


    ```

    body {

        color: #A2A2A2;

        background: #C3C3C3;

    }

    ```


    Nesting


    Another powerful feature is the ability to nest selectors, which allows CSS authors
    to nest their CSS selectors to match the visual representation of your HTML. [Listing
    3-7](#part0010.html#list7) demonstrates how nesting can be used to make your CSS
    more readable and maintainable.


    [***Listing 3-7***](#part0010.html#_list7). Using Nested Selectors


    ```

    header {

        width: 936px;

        padding: 12px;


    h1 {

             font-size: 2.4em;

             line-height: 1em;

             margin: 0 0 12px;

        }


    nav {

            padding: 12px;

        }

    }

    ```


    Note how the h1 and nav selectors are nested within the header selector. As Sass
    processes the SCSS file, it collapses nested selectors to generate more complex
    selectors. The output from the SCSS file in [Listing 3-7](#part0010.html#list7)
    is shown in [Listing 3-8](#part0010.html#list8).


    [***Listing 3-8***](#part0010.html#_list8). Output from Nested Selectors


    ```

    header {

        width: 936px;

        padding: 12px;

    }


    header h1 {

        font-size: 2.4em;

        line-height: 1em;

        margin: 0 0 12px;

    }


    header nav {

        padding: 12px;

    }

    ```


    In addition to nesting selectors, a more advanced feature is available to combine
    nested pseudo-class selectors (as shown in [Listing 3-9](#part0010.html#list9)).


    [***Listing 3-9***](#part0010.html#_list9). Pseudo-class Selectors Combined with
    Nested Selectors


    ```

    a {

        text-decoration: none;


    &:hover,

        &:focus {

            text-decoration: underline;

        }

    }

    ```


    Note the use of the ampersand (&) in [Listing 3-9](#part0010.html#list9). This
    leads to the current selector being appended to the parent selector, which in
    our example is a. The output of our example is shown in [Listing 3-10](#part0010.html#list10),
    with the selector a:hover, a:focus being generated.


    [***Listing 3-10***](#part0010.html#_list10). Appending Pseudo-class Selectors
    with &


    ```

    a {

        text-decoration: none;

    }


    a:hover, a:focus {

         text-decoration: underline;

    }

    ```


    Partials and Imports'
  trans: "\n# CSS 预处理\n\n`CSS 预处理`是一项相对较新的技术，其存在时间大约只有过去五年。在这五年间，它迅速被开发者采用，主要原因是它解决了使用\
    \ CSS 时的一些痛点。目前，主要有三种 CSS 预处理器可用：LESS（[`lesscss.org`](http://lesscss.org)）、Sass（[`sass-lang.com`](http://sass-lang.com)）和\
    \ Stylus（[www.stylus.com](http://www.stylus.com)）。CSS 预处理器越来越流行，以至于浏览器厂商已开始在其开发者工具中提供支持。\n\
    \nCSS 预处理器通常对 CSS 进行扩展，提供诸如定义变量和嵌套选择器等新功能。这通常会带来更清晰、更易于维护的 CSS。为便于演示，本书将使用 Sass。要使用\
    \ Sass，你必须安装 Ruby 语言。\n\n## 安装 Sass\n\n要安装 Sass，你需要在你的机器上安装 Ruby。成功安装后，即可通过命令行或命令提示符使用\
    \ Ruby。\n\n### 在 Linux 上安装 Ruby\n\n在 Linux 上安装 Ruby，最好通过你的发行版包管理器或诸如 `rbenv` 或\
    \ `rvm` 之类的工具来安装。\n\n### 在 Windows 上安装 Ruby\n\n在 Windows 上，Ruby 有一个一键安装程序。安装完成后，即可在命令提示符下使用\
    \ Ruby。\n\n### 在 Mac OS X 上安装 Ruby\n\nMac OS X 预装了 Ruby；但安装的版本取决于你运行的 Mac OS X\
    \ 版本。Mountain Lion 随附版本 1.8.7，而 Mavericks 则随附 Ruby 2.0.0。\n\n在使用 Sass 时，我建议运行\
    \ 2.0.0 版本。对于使用 Mountain Lion 或更早版本的读者，我建议使用 `rbenv` 来安装和维护你的 Ruby 安装。\n\n## 检查你的\
    \ Ruby 安装\n\n安装 Ruby 后，你应该能够从命令行或命令提示符运行 Ruby 命令。清单 3-2 演示了如何检查你安装的 Ruby 版本。\n\
    \n***清单 3-2***。检查已安装的 Ruby 版本\n\n```\nruby --version\n```\n\n该命令应输出类似于图 3-1 所示的内容。\n\
    \n![9781484200148_Fig03-01.jpg](img/00020.jpeg)\n\n图 3-1。当前安装的 Ruby 版本\n\n如果你没有看到与上述类似的输出，我建议仔细检查你所运行平台的安装步骤。要开始使用\
    \ Sass，下一步是安装 gem。与 Node 类似，Ruby 有一个名为 Ruby Gems 的包管理系统，每个 Ruby 包都打包为一个 gem。清单\
    \ 3-3 演示了如何从命令行或命令提示符安装 Sass，并随后检查已安装的 Sass 版本。\n\n***清单 3-3***。安装 Sass Gem\n\n\
    ```\ngem install sass\nsass --version\n```\n\n如果 Sass 安装成功，将打印类似 `Sass 3.3.3 (Maptastic\
    \ Maple)` 的输出。现在我们已安装 Sass，让我们简要了解一下它的主要特性，然后再了解 Grunt 如何在使用 Sass 时帮助我们。\n\n##\
    \ Sass 简介\n\n如前所述，Sass 是一种 CSS 预处理器。你可能想知道这意味着什么。简单来说，Sass 接收一些输入，对其执行处理，然后输出\
    \ CSS。通过此过程，输入可以是 SCSS 或 Sass 文件。SCSS 是 Sass 3 的主要语法，也是本书将要用到的。Sass 是一种稍旧的、受 HAML\
    \ 启发的语法，其编译规则更为严格。\n\nSCSS（也称为 Sassy CSS）是 CSS3 的超集，这意味着任何 CSS3 样式表都是有效的 SCSS\
    \ 样式表。SCSS 文件的扩展名为 `.scss`。清单 3-4 演示了如何使用 Sass 从命令行将 SCSS 文件编译为 CSS。\n\n***清单\
    \ 3-4***。使用 Sass 将 SCSS 文件编译为 CSS\n\n```\nsass input.scss output.css\n```\n\n\
    运行清单 3-4 中的命令将输出一个包含 SCSS 文件 `input.scss` 中所有样式的 CSS 文件。命令行工具 `sass` 也可以传递多个标志来修改生成的\
    \ CSS 文件。我们将在本章后面介绍其中一些标志。在此之前，我们先探讨 Sass 中能提高 CSS 文件可维护性和可读性的特性。\n\n## 变量\n\n\
    对于具有 JavaScript 或 Ruby 等语言编程经验的读者来说，变量应该很熟悉。变量提供了一种存储值的方法，以便我们稍后重用。变量还为引用此值提供了一个方便且易于记忆的名称。在\
    \ Sass 中，变量可用于存储 CSS 属性值。清单 3-5 演示了我们如何存储颜色的十六进制值，以便在 SCSS 文件中稍后使用。\n\n***清单 3-5***。用于存储颜色值的变量\n\
    \n```\n$primary-color: #A2A2A2;\n$background-color: #C3C3C3;\n\nbody {\n    color:\
    \ $primary-color;\n    background: $background-color;\n}\n```\n\n变量以 `$` 开头，后跟变量名。变量的值出现在\
    \ `:` 之后。在我们的示例中，仅使用变量来存储颜色值，但变量也可以存储任何 CSS 属性的值。当 Sass 进行处理时，变量会被替换为变量值，但变量定义不会被替换。清单\
    \ 3-6 显示了上述示例处理后的结果。\n\n***清单 3-6***。处理清单 3-5 中 SCSS 文件后输出的 CSS\n\n```\nbody {\n\
    \    color: #A2A2A2;\n    background: #C3C3C3;\n}\n```\n\n## 嵌套\n\n另一个强大的功能是能够嵌套选择器，这允许\
    \ CSS 作者嵌套其 CSS 选择器以匹配 HTML 的视觉表示。清单 3-7 演示了如何使用嵌套使 CSS 更具可读性和可维护性。\n\n***清单 3-7***。使用嵌套选择器\n\
    \n```\nheader {\n    width: 936px;\n    padding: 12px;\n\n    h1 {\n        font-size:\
    \ 2.4em;\n        line-height: 1em;\n        margin: 0 0 12px;\n    }\n\n    nav\
    \ {\n        padding: 12px;\n    }\n}\n```\n\n请注意 `h1` 和 `nav` 选择器是如何嵌套在 `header`\
    \ 选择器中的。当 Sass 处理 SCSS 文件时，它会展开嵌套的选择器以生成更复杂的选择器。清单 3-7 中 SCSS 文件的输出如清单 3-8 所示。\n\
    \n***清单 3-8***。嵌套选择器的输出\n\n```\nheader {\n    width: 936px;\n    padding: 12px;\n\
    }\n\nheader h1 {\n    font-size: 2.4em;\n    line-height: 1em;\n    margin: 0\
    \ 0 12px;\n}\n\nheader nav {\n    padding: 12px;\n}\n```\n\n除了嵌套选择器之外，还有一个更高级的功能可用于组合嵌套的伪类选择器（如清单\
    \ 3-9 所示）。\n\n***清单 3-9***。伪类选择器与嵌套选择器的组合\n\n```\na {\n    text-decoration: none;\n\
    \n    &:hover,\n    &:focus {\n        text-decoration: underline;\n    }\n}\n\
    ```\n\n请注意清单 3-9 中 & 符号（`&`）的使用。这会导致当前选择器被附加到父选择器上，在我们的示例中，父选择器是 `a`。我们示例的输出如清单\
    \ 3-10 所示，生成了选择器 `a:hover, a:focus`。\n\n***清单 3-10***。使用 `&` 附加伪类选择器\n\n```\n\
    a {\n    text-decoration: none;\n}\n\na:hover, a:focus {\n    text-decoration:\
    \ underline;\n}\n```\n\n## 局部文件和导入\n"
- fmt: "# Partials\n\nPartials allow developers to create SCSS files that contain\
    \ a snippet of CSS. These snippets can then be included in other SCSS files. The\
    \ ability to include other snippets into other SCSS files dramatically improves\
    \ the reuse of the SCSS you write, as you can pick and choose which partials to\
    \ include. Partials have a file name convention that means they must begin with\
    \ an underscore. This tells Sass that the file does not directly generate output.\
    \ For example, a partial for the header module might be named `_header.scss`.\n\
    \nTo include partials within a file, you have to use the `@import` directive.\
    \ Imports, coupled with partials, allow you to split your CSS into more manageable\
    \ and readable chunks. [Listing 3-11](#part0010.html#list11) illustrates how the\
    \ `@import` directive can be used.\n\n[***Listing 3-11***](#part0010.html#_list11).\
    \ Using the `@import` Directive to Combine Multiple Files with Sass\n\n```\n//\
    \ _reset.scss\n\nhtml, body, ul, ol, h1, h2, h3, h4, h5, h5, p {\n    margin:\
    \ 0;\n    padding: 0;\n}\n\n// _header.scss\n\nheader {\n    h1 {\n        font-size:\
    \ 2em;\n        margin: 12px 0;\n    }\n}\n\n// main.scss\n\n@import 'reset';\n\
    @import 'header';\n\nbody {\n    color: #A2A2A2;\n    background: #C3C3C3;\n}\n\
    ```\n\nIn [Listing 3-11](#part0010.html#list11), there are a total of three files:\
    \ `_reset.scss`, `_header.scss`, and `main.scss`. The `main.scss` file imports\
    \ the contents of the `_reset.scss` and `_header.scss` files. It is important\
    \ to note that when using the `@import` directive, you must include the file extension\
    \ `.scss`. When Sass processes `main.scss`, it will generate a single file, not\
    \ three. The `@import` directive in Sass should not be confused with the `@import`\
    \ directive from CSS. These provide very different functionality. When using the\
    \ `@import` directive in Sass, the contents of the file merge into the files that\
    \ import the partial. With CSS imports, each file remains separate, and the browser\
    \ makes a separate HTTP call for each file. [Listing 3-12](#part0010.html#list12)\
    \ shows the output from compiling the `main.scss` file.\n\n[***Listing 3-12***](#part0010.html#_list12).\
    \ Output from Compiling Sass with Imports and Partials\n\n```\nhtml, body, ul,\
    \ ol, h1, h2, h3, h4, h5, h5, p {\n    margin: 0;\n    padding: 0;\n}\n\nheader\
    \ {\n    h1 {\n        font-size: 2em;\n        margin: 12px 0;\n    }\n}\n\n\
    body {\n    color: #A2A2A2;\n    background: #C3C3C3;\n}\n```\n\n## Mixins\n\n\
    Mixins provide a method to reuse CSS in a convenient way that allows you to define\
    \ a set of selectors or properties and reuse them multiple times without copying\
    \ and pasting them. In addition to this, mixins can also accept parameters, so\
    \ that each time they are used, they can be slightly altered to meet specific\
    \ needs. The primary benefit of mixins is the improved maintainability, because\
    \ if you have to update the CSS later, you only have to modify it in a single\
    \ place. A common example of the use of mixins is browser prefixes. Instead of\
    \ having to continually define each browser vendor’s particular implementation,\
    \ you can capture this in a single mixin. This means that if the browser vendor\
    \ changes its implementation, you only have to modify the mixin, and the rest\
    \ of the CSS output will be updated with the change. [Listing 3-13](#part0010.html#list13)\
    \ demonstrates such an example with the CSS3 property `border-radius`.\n\n[***Listing\
    \ 3-13***](#part0010.html#_list13). Defining a Sass Mixin for the CSS3 Property\
    \ `border-radius`\n\n```\n@mixin border-radius($radius) {\n    -webkit-border-radius:\
    \ $radius;\n    -moz-border-radius: $radius;\n    -ms-border-radius: $radius;\n\
    \    border-radius: $radius;\n}\n\n.panel {\n    @include border-radius(4px);\n\
    }\n\n.login-box {\n    @include border-radius(10px);\n}\n```\n\nIn [Listing 3-13](#part0010.html#list13),\
    \ we define a mixin with the name `border-radius` and then use the mixin by applying\
    \ it to the class selector `.panel`. The mixin starts with the directive `@mixin`,\
    \ followed by the name and a set of parameters. In our example, there is a single\
    \ parameter, `radius`, which is a Sass variable, so it begins with `$`. Using\
    \ a parameter in this mixin allows us to pass in the radius to be applied to our\
    \ selector. To use a mixin, the `@include` directive is used. The `@include` is\
    \ followed by the mixin’s name and a set of parameters, if required. [Listing\
    \ 3-14](#part0010.html#list14) illustrates the output from the Sass in [Listing\
    \ 3-13](#part0010.html#list13).\n\n[***Listing 3-14***](#part0010.html#_list14).\
    \ CSS Output from Using Mixins\n\n```\n.panel {\n    -webkit-border-radius: 4px;\n\
    \    -moz-border-radius: 4px;\n    -ms-border-radius: 4px;\n    border-radius:\
    \ 4px;\n}\n\n.login-box {\n  -webkit-border-radius: 10px;\n  -moz-border-radius:\
    \ 10px;\n  -ms-border-radius: 10px;\n  border-radius: 10px;\n}\n```\n\nIt should\
    \ be noted that a mixin itself is not output in the CSS, only the use of the mixin\
    \ where it has been included.\n\n## Extend/Inheritance\n\nThe final Sass feature\
    \ we’ll look at in this introduction is inheritance. Inheritance allows you to\
    \ keep your CSS DRY. For those unfamiliar with the principle of DRY, it stands\
    \ for “Don’t Repeat Yourself” and aims to reduce repetition. Sass provides the\
    \ ability to keep our CSS DRY through the directive `@extend`. [Listing 3-15](#part0010.html#list15)\
    \ demonstrates how to use `@extend`.\n\n[***Listing 3-15***](#part0010.html#_list15).\
    \ Using `@extend` to Keep CSS Output DRY\n\n```\n.notice {\n    border: 1px solid\
    \ #FBCE2D;\n    padding: 8px;\n}\n\n.alert {\n    @extend .notice;\n    border-color:\
    \ #F0F0F0;\n}\n```\n\nIn [Listing 3-15](#part0010.html#list15), we define the\
    \ class selectors `.notice` and `.alert`. The `@extend` directive is used as part\
    \ of the `.alert` property definitions, with the name of the selector we want\
    \ to extend. As part of the CSS generation, the `.notice` and `.alert` selectors\
    \ are combined into a rule. This can be seen in [Listing 3-16](#part0010.html#list16).\n\
    \n[***Listing 3-16***](#part0010.html#_list16). Output from Use of `@extend`\n\
    \n```\n.notice, .alert {\n    border: 1px solid #FBCE2D;\n    padding: 8px;\n\
    }\n\n.alert {\n    border-color: #F0F0F0;\n}\n```\n\nNow that we’ve seen the power\
    \ that Sass can offer in terms of making working with large and complex style\
    \ sheets easier, let’s look at how Grunt can help us speed up our workflow.\n\n\
    ## Sass with Grunt\n\nTo compile your Sass files with Grunt, a Grunt plug-in called\
    \ `grunt-contrib-sass` is available. Plug-ins that begin with “grunt-contrib”\
    \ are plug-ins officially supported by the core Grunt team. To install this plug-in,\
    \ follow the same procedure as introduced in the previous chapter. (See [Listing\
    \ 3-17](#part0010.html#list17)).\n\n[***Listing 3-17***](#part0010.html#_list17).\
    \ Installing `grunt-contrib-sass`\n\n```\nnpm install grunt-contrib-sass --save-dev\n\
    ```\n\nAt this point, `grunt-contrib-sass` has been added to our project, and\
    \ the dependency added to our `package.json` file. Next, we have to add the task\
    \ to our `Gruntfile`. [Listing 3-18](#part0010.html#list18) demonstrates our `Gruntfile`\
    \ with the newly added plug-in configured to compile our Sass.\n\n[***Listing\
    \ 3-18***](#part0010.html#_list18). Gruntfile Configured with `grunt-contrib-sass`\n\
    \n```\n/*global module:false*/\nmodule.exports = function(grunt) {\n\n// Project\
    \ configuration.\n  grunt.initConfig({\n\n// Task configuration.\n    sass: {\n\
    \      dist: {\n        options: {\n          style: 'expanded'\n        },\n\
    \        files: {\n          'css/main.css': 'build/styles/main.scss'\n      \
    \  }\n      }\n    }\n  });\n\n// These plugins provide necessary tasks.\n  grunt.loadNpmTasks('grunt-contrib-sass');\n\
    \n// Default task.\n  grunt.registerTask('default', ['sass']);\n};\n```"
  raw: 'Partials allow developers to create SCSS files that contain a snippet of CSS.
    These snippets can then be included in other SCSS files. The ability to include
    other snippets into other SCSS files dramatically improves the reuse of the SCSS
    you write, as you can pick and choose which partials to include. Partials have
    a file name convention that means they must begin with an underscore. This tells
    Sass that the file does not directly generate output. For example, a partial for
    the header module might be named _header.scss.


    To include partials within a file, you have to use the @import directive. Imports,
    coupled with partials, allow you to split your CSS into more manageable and readable
    chunks. [Listing 3-11](#part0010.html#list11) illustrates how the @import directive
    can be used.


    [***Listing 3-11***](#part0010.html#_list11). Using the @import Directive to Combine
    Multiple Files with Sass


    ```

    // _reset.scss


    html, body, ul, ol, h1, h2, h3, h4, h5, h5, p {

        margin: 0;

        padding: 0;

    }


    // _header.scss


    header {

        h1 {

            font-size: 2em;

            margin: 12px 0;

        }

    }


    // main.scss


    @import ''reset'';

    @import ''header'';


    body {

        color: #A2A2A2;

        background: #C3C3C3;

    }

    ```


    In [Listing 3-11](#part0010.html#list11), there are a total of three files: _reset.scss,
    _header.scss, and main.scss. The main.scss file imports the contents of the _reset.scss
    and _header.scss files. It is important to note that when using the @import directive,
    you must include the file extension .scss. When Sass processes main.scss, it will
    generate a single file, not three. The @import directive in Sass should not be
    confused with the @import directive from CSS. These provide very different functionality.
    When using the @import directive in Sass, the contents of the file merge into
    the files that import the partial. With CSS imports, each file remains separate,
    and the browser makes a separate HTTP call for each file. [Listing 3-12](#part0010.html#list12)
    shows the output from compiling the main.scss file.


    [***Listing 3-12***](#part0010.html#_list12). Output from Compiling Sass with
    Imports and Partials


    ```

    html, body, ul, ol, h1, h2, h3, h4, h5, h5, p {

        margin: 0;

        padding: 0;

    }


    header {

        h1 {

            font-size: 2em;

            margin: 12px 0;

        }

    }


    body {

        color: #A2A2A2;

        background: #C3C3C3;

    }

    ```


    Mixins


    Mixins provide a method to reuse CSS in a convenient way that allows you to define
    a set of selectors or properties and reuse them multiple times without copying
    and pasting them. In addition to this, mixins can also accept parameters, so that
    each time they are used, they can be slightly altered to meet specific needs.
    The primary benefit of mixins is the improved maintainability, because if you
    have to update the CSS later, you only have to modify it in a single place. A
    common example of the use of mixins is browser prefixes. Instead of having to
    continually define each browser vendor’s particular implementation, you can capture
    this in a single mixin. This means that if the browser vendor changes its implementation,
    you only have to modify the mixin, and the rest of the CSS output will be updated
    with the change. [Listing 3-13](#part0010.html#list13) demonstrates such an example
    with the CSS3 property border-radius.


    [***Listing 3-13***](#part0010.html#_list13). Defining a Sass Mixin for the CSS3
    Property border-radius


    ```

    @mixin border-radius($radius) {

        -webkit-border-radius: $radius;

        -moz-border-radius: $radius;

        -ms-border-radius: $radius;

        border-radius: $radius;

    }


    .panel {

        @include border-radius(4px);

    }


    .login-box {

        @include border-radius(10px);

    }

    ```


    In [Listing 3-13](#part0010.html#list13), we define a mixin with the name border-radius
    and then use the mixin by applying it to the class selector panel. The mixin starts
    with the directive @mixin, followed by the name and a set of parameters. In our
    example, there is a single parameter, radius, which is a Sass variable, so it
    begins with $. Using a parameter in this mixin allows us to pass in the radius
    to be applied to our selector. To use a mixin, the @include directive is used.
    The @include is followed by the mixin’s name and a set of parameters, if required.
    [Listing 3-14](#part0010.html#list14) illustrates the output from the Sass in
    [Listing 3-13](#part0010.html#list13).


    [***Listing 3-14***](#part0010.html#_list14). CSS Output from Using Mixins


    ```

    .panel {

        -webkit-border-radius: 4px;

        -moz-border-radius: 4px;

        -ms-border-radius: 4px;

        border-radius: 4px;

    }


    .login-box {

      -webkit-border-radius: 10px;

      -moz-border-radius: 10px;

      -ms-border-radius: 10px;

      border-radius: 10px;

    }

    ```


    It should be noted that a mixin itself is not output in the CSS, only the use
    of the mixin where it has been included.


    Extend/Inheritance


    The final Sass feature we’ll look at in this introduction is inheritance. Inheritance
    allows you to keep your CSS DRY. For those unfamiliar with the principle of DRY,
    it stands for “Don’t Repeat Yourself” and aims to reduce repetition. Sass provides
    the ability to keep our CSS DRY through the directive @extend. [Listing 3-15](#part0010.html#list15)
    demonstrates how to use @extend.


    [***Listing 3-15***](#part0010.html#_list15). Using @extend to Keep CSS Output
    DRY


    ```

    .notice {

        border: 1px solid #FBCE2D;

        padding: 8px;

    }


    .alert {

        @extend .notice;

        border-color: #F0F0F0;

    }

    ```


    In [Listing 3-15](#part0010.html#list15), we define the class selectors .notice
    and .alert. The @extend directive is used as part of the .alert property definitions,
    with the name of the selector we want to extend. As part of the CSS generation,
    the .notice and .alert selectors are combined into a rule. This can be seen in
    [Listing 3-16](#part0010.html#list16).


    [***Listing 3-16***](#part0010.html#_list16). Output from Use of @extend


    ```

    .notice, .alert {

        border: 1px solid #FBCE2D;

        padding: 8px;

    }


    .alert {

        border-color: #F0F0F0;

    }

    ```


    Now that we’ve seen the power that Sass can offer in terms of making working with
    large and complex style sheets easier, let’s look at how Grunt can help us speed
    up our workflow.


    Sass with Grunt


    To compile your Sass files with Grunt, a Grunt plug-in called grunt-contrib-sass
    is available. Plug-ins that begin with “grunt-contrib” are plug-ins officially
    supported by the core Grunt team. To install this plug-in, follow the same procedure
    as introduced in the previous chapter. (See [Listing 3-17](#part0010.html#list17)).


    [***Listing 3-17***](#part0010.html#_list17). Installing grunt-contrib-sass


    ```

    npm install grunt-contrib-sass --save-dev

    ```


    At this point, grunt-contrib-sass has been added to our project, and the dependency
    added to our package.json file. Next, we have to add the task to our Gruntfile.
    [Listing 3-18](#part0010.html#list18) demonstrates our Gruntfile with the newly
    added plug-in configured to compile our Sass.


    [***Listing 3-18***](#part0010.html#_list18). Gruntfile Configured with grunt-contrib-sass


    ```

    /*global module:false*/

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({


    // Task configuration.

        sass: {

          dist: {

            options: {

              style: ''expanded''

            },

            files: {

              ''css/main.css'': ''build/styles/main.scss''

            }

          }

        }

      });


    // These plugins provide necessary tasks.

      grunt.loadNpmTasks(''grunt-contrib-sass'');


    // Default task.

      grunt.registerTask(''default'', [''sass'']);

    };

    ```'
  trans: "\n# Partials（局部文件）\n\nPartials（局部文件）允许开发者创建包含 CSS 片段（snippet）的 SCSS 文件。这些片段可以被包含到其他\
    \ SCSS 文件中。将其他片段包含到其他 SCSS 文件中的能力，极大地提高了所编写 SCSS 的可重用性，因为你可以选择要包含哪些 partials（局部文件）。Partials（局部文件）有一个文件命名约定，即它们必须以**下划线**开头。这告诉\
    \ Sass 该文件不直接生成输出。例如，用于头部模块的 partial 可能被命名为 `_header.scss`。\n\n要将 partials（局部文件）包含在一个文件中，必须使用\
    \ `@import` 指令。Imports（导入）与 partials（局部文件）结合使用，可以将 CSS 拆分成更易于管理和阅读的块。列表 3-11 演示了如何使用\
    \ `@import` 指令。\n\n***列表 3-11***. 使用 `@import` 指令将多个文件与 Sass 合并\n\n```\n// _reset.scss\n\
    \nhtml, body, ul, ol, h1, h2, h3, h4, h5, h5, p {\n    margin: 0;\n    padding:\
    \ 0;\n}\n\n// _header.scss\n\nheader {\n    h1 {\n        font-size: 2em;\n  \
    \      margin: 12px 0;\n    }\n}\n\n// main.scss\n\n@import 'reset';\n@import\
    \ 'header';\n\nbody {\n    color: #A2A2A2;\n    background: #C3C3C3;\n}\n```\n\
    \n在列表 3-11 中，共有三个文件：`_reset.scss`、`_header.scss` 和 `main.scss`。`main.scss` 文件导入了\
    \ `_reset.scss` 和 `_header.scss` 文件的内容。需要注意的是，在使用 `@import` 指令时，必须包含文件扩展名 `.scss`。当\
    \ Sass 处理 `main.scss` 时，它将生成一个文件，而不是三个文件。不要将 Sass 中的 `@import` 指令与 CSS 中的 `@import`\
    \ 指令混淆。它们提供的功能非常不同。使用 Sass 中的 `@import` 指令时，文件的内容会合并到导入该 partial 的文件中。而使用 CSS\
    \ imports 时，每个文件保持独立，浏览器会为每个文件进行单独的 HTTP 调用。列表 3-12 显示了编译 `main.scss` 文件后的输出结果。\n\
    \n***列表 3-12***. 使用 Imports 和 Partials 编译 Sass 的输出\n\n```\nhtml, body, ul, ol,\
    \ h1, h2, h3, h4, h5, h5, p {\n    margin: 0;\n    padding: 0;\n}\n\nheader {\n\
    \    h1 {\n        font-size: 2em;\n        margin: 12px 0;\n    }\n}\n\nbody\
    \ {\n    color: #A2A2A2;\n    background: #C3C3C3;\n}\n```\n\n## Mixins（混合器）\n\
    \nMixins（混合器）提供了一种便捷的方法来重用 CSS，允许你定义一组选择器或属性，并在不进行复制粘贴的情况下多次重用它们。除此之外，mixins 还可以接受参数，这样每次使用时，都可以稍作修改以满足特定需求。Mixins\
    \ 的主要优势在于提高了可维护性，因为如果以后需要更新 CSS，只需在一个地方进行修改即可。Mixins 的一个常见用途是处理浏览器前缀。你可以将所有浏览器厂商的特定实现捕获到一个单一的\
    \ mixin 中，而不必每次都重复定义它们。这意味着，如果浏览器厂商更改了其实现，你只需要修改 mixin，其余的 CSS 输出将随更改而更新。列表 3-13\
    \ 演示了这样一个关于 CSS3 属性 `border-radius` 的示例。\n\n***列表 3-13***. 为 CSS3 属性 `border-radius`\
    \ 定义一个 Sass 的 Mixin\n\n```\n@mixin border-radius($radius) {\n    -webkit-border-radius:\
    \ $radius;\n    -moz-border-radius: $radius;\n    -ms-border-radius: $radius;\n\
    \    border-radius: $radius;\n}\n\n.panel {\n    @include border-radius(4px);\n\
    }\n\n.login-box {\n    @include border-radius(10px);\n}\n```\n\n在列表 3-13 中，我们定义了一个名为\
    \ `border-radius` 的 mixin，然后通过将其应用于类选择器 `.panel` 来使用该 mixin。Mixin 以指令 `@mixin`\
    \ 开头，后跟名称和一组参数。在我们的示例中，有一个参数 `radius`，它是一个 Sass 变量，因此以 `$` 开头。在这个 mixin 中使用参数允许我们传入要应用于选择器的半径值。要使用一个\
    \ mixin，需要使用 `@include` 指令。`@include` 后跟 mixin 的名称和一组参数（如果需要的话）。列表 3-14 展示了列表\
    \ 3-13 中 Sass 代码的输出结果。\n\n***列表 3-14***. 使用 Mixins 的 CSS 输出\n\n```\n.panel {\n\
    \    -webkit-border-radius: 4px;\n    -moz-border-radius: 4px;\n    -ms-border-radius:\
    \ 4px;\n    border-radius: 4px;\n}\n\n.login-box {\n  -webkit-border-radius: 10px;\n\
    \  -moz-border-radius: 10px;\n  -ms-border-radius: 10px;\n  border-radius: 10px;\n\
    }\n```\n\n需要注意的是，mixin 本身不会输出到 CSS 中，只有使用 mixin 的地方（即它被包含的地方）才会输出。\n\n## Extend/Inheritance（扩展/继承）\n\
    \n在本介绍中，我们要看的最后一个 Sass 特性是继承。继承允许你保持 CSS 的**DRY**。对于那些不熟悉 DRY 原则的人来说，它代表“不要重复自己”（Don't\
    \ Repeat Yourself），旨在减少重复。Sass 通过指令 `@extend` 提供了保持 CSS DRY 的能力。列表 3-15 演示了如何使用\
    \ `@extend`。\n\n***列表 3-15***. 使用 `@extend` 保持 CSS 输出的 DRY 原则\n\n```\n.notice\
    \ {\n    border: 1px solid #FBCE2D;\n    padding: 8px;\n}\n\n.alert {\n    @extend\
    \ .notice;\n    border-color: #F0F0F0;\n}\n```\n\n在列表 3-15 中，我们定义了类选择器 `.notice`\
    \ 和 `.alert`。`@extend` 指令被用作 `.alert` 属性定义的一部分，后面跟着我们想要扩展的选择器名称。在 CSS 生成过程中，`.notice`\
    \ 和 `.alert` 选择器被合并到一个规则中。这可以在列表 3-16 中看到。\n\n***列表 3-16***. 使用 `@extend` 的输出\n\
    \n```\n.notice, .alert {\n    border: 1px solid #FBCE2D;\n    padding: 8px;\n\
    }\n\n.alert {\n    border-color: #F0F0F0;\n}\n```\n\n既然我们已经了解了 Sass 在简化大型复杂样式表工作方面所能提供的强大功能，那么让我们看看\
    \ Grunt 如何帮助我们加速工作流程。\n\n## Sass with Grunt（Sass 与 Grunt 的结合）\n\n要使用 Grunt 编译\
    \ Sass 文件，可以使用一个名为 `grunt-contrib-sass` 的 Grunt 插件。以“grunt-contrib”开头的插件是 Grunt\
    \ 核心团队官方支持的插件。要安装此插件，请遵循上一章介绍的相同步骤。（见列表 3-17）。\n\n***列表 3-17***. 安装 `grunt-contrib-sass`\n\
    \n```\nnpm install grunt-contrib-sass --save-dev\n```\n\n至此，`grunt-contrib-sass`\
    \ 已添加到我们的项目中，并且依赖项也已添加到我们的 `package.json` 文件中。接下来，我们必须将该任务添加到我们的 `Gruntfile` 中。列表\
    \ 3-18 演示了我们的 `Gruntfile`，其中配置了新添加的插件来编译我们的 Sass。\n\n***列表 3-18***. 配置了 `grunt-contrib-sass`\
    \ 的 Gruntfile\n\n```\n/*global module:false*/\nmodule.exports = function(grunt)\
    \ {\n\n// Project configuration.\n  grunt.initConfig({\n\n// Task configuration.\n\
    \    sass: {\n      dist: {\n        options: {\n          style: 'expanded'\n\
    \        },\n        files: {\n          'css/main.css': 'build/styles/main.scss'\n\
    \        }\n      }\n    }\n  });\n\n// These plugins provide necessary tasks.\n\
    \  grunt.loadNpmTasks('grunt-contrib-sass');\n\n// Default task.\n  grunt.registerTask('default',\
    \ ['sass']);\n};\n```\n"
- fmt: "在 `[Listing 3-18](#part0010.html#list18)` 中，`Gruntfile` 看起来与上一章使用的非常相似。`grunt-contrib-sass`\
    \ 任务在文件末尾加载，而 `sass` 任务被设置为默认任务。`Gruntfile` 的其余部分由该任务的配置组成。我们添加了一个名为 `dist` 的目标，并在其中设置了一个选项\
    \ `style`。`grunt-contrib-sass` 任务封装了 `Sass` 命令，并公开了 `Sass` 命令接受的一些用于改变 CSS 输出的标志。\n\
    \n`style` 选项会修改输出 CSS 的格式。该选项有四个可能的值：`nested`、`expanded`、`compact` 和 `compressed`。默认值是\
    \ `nested`，它会对 CSS 进行缩进，类似于 Sass 文件。`expanded` 值最为冗长，看起来类似于手写 CSS。在本地处理棘手的 CSS\
    \ 问题时，这种样式非常有用。`compact` 和 `compressed` 样式，顾名思义，是更小的格式。`compact` 样式将每个选择器及其所有\
    \ CSS 属性和值输出在一行中。`compressed` 样式输出最小化的内容。除了每个选择器所需的空格之外，所有空白字符都被删除。使用 `compressed`\
    \ 样式，所有选择器都出现在同一行，这非常适合在您的在线网站上使用。除了样式选项之外，`grunt-contrib-sass` 还提供了在 CSS 输出中输出源代码行号的选项，既可以缓存编译后的\
    \ sass，也可以生成 source map。我将在本书后面（作为高级主题的一部分）介绍 source map。\n\n我们的 Sass `Gruntfile`\
    \ 配置的最后一部分定义了要使用的文件。在这种情况下，我们选择使用文件对象格式来配置任务使用哪些文件。如您所见，我们在 `build/styles` 路径下使用了\
    \ SCSS 文件 `main.scss`。需要注意的是，这是相对于 `Gruntfile` 的路径。让我们来试运行我们的 `Gruntfile`。打开命令行并导航到项目空间。此时运行\
    \ `Grunt` 应该会输出类似于 `[Figure 3-2](#part0010.html#Fig2)` 所示的内容。\n\n![9781484200148_Fig03-02.jpg](images/00021.jpeg)\n\
    \n`[Figure 3-2](#part0010.html#_Fig2).` 由于缺少源文件而失败的 Sass Grunt 配置\n\n如您所见，`Grunt`\
    \ 执行失败，并显示一条错误消息，告知我们无法找到源文件。请添加 `styles` 文件夹。此文件夹应位于 `build` 文件夹内。现在重新运行 `Grunt`，应该会成功完成，并显示消息\
    \ “File css/main.css created.”。如果您打开应用程序文件夹，您现在应该会看到一个 `css` 文件夹被创建，并且其中包含 `main.css`。`[Listing\
    \ 3-19](#part0010.html#list19)` 说明了此阶段的项目结构。\n\n`[***Listing 3-19***](#part0010.html#_list19)`.\
    \ 我们的演示应用的 `main.scss`\n\n```\n$primary-color: #a2a2a2;\n\nbody {\n  color: $primary-color;\n\
    }\n```\n\n在这个阶段，我们的待办事项应用程序看起来非常基础——只有一个标题。让我们开始增加一些功能，并通过引入一些库来美化样式。在下一节中，您将看到\
    \ `Grunt` 如何帮助简化将库导入到我们项目中的过程。\n\n## 使用 Grunt 处理前端框架\n\n在过去的几年里，对 Web 应用程序的需求不断增加，要求它们提供与原生应用程序相同的丰富沉浸式体验。为了满足这一需求，Web\
    \ 应用程序变得越来越复杂。随着复杂性的增加，我们看到了强大的前端框架的出现，以帮助开发人员快速为这些 Web 应用程序原型设计和交付新功能。这带来了一个新的挑战：作为开发人员，我们如何安装和管理这些依赖关系。像\
    \ Ruby 和 Java 这样的后端技术，有依赖管理器工具来解决这个问题已经有一段时间了。值得庆幸的是，现在也有针对前端库的解决方案，形式是来自 Twitter\
    \ 的名为 `Bower` 的工具。在探讨如何将 `Bower` 与 `Grunt` 集成之前，让我们先了解更多关于 `Bower` 本身的信息。\n\n\
    ### Bower\n\n`Bower` 是一个为 Web 构建的包管理器，旨在解决前端包管理的问题。`Bower` 与 `npm` 一样，不会全局安装包；相反，包被隔离到本地项目中。如果您必须在多个项目之间工作并且不想共享依赖关系，这非常有用。包通过\
    \ `Git` 安装；然而，每个包的内容可能会有所不同，因为 `Bower` 不规定一个包应该包含什么。例如，一个包可能包含 JavaScript 或 CSS，或者就此而言的任何其他类型的资源。\n\
    \n### 安装 Bower\n\n`Bower` 与 `npm` 一样，依赖于 Node。`[Listing 3-20](#part0010.html#list20)`\
    \ 演示了如何安装 `Bower`。在这一点上，您应该对此感到相当熟悉。\n\n`[***Listing 3-20***](#part0010.html#_list20)`.\
    \ 安装 Bower\n\n```\nnpm install -g bower\n```\n\n请注意，我们使用 `-g` 标志来安装 `Bower`，因为\
    \ `Bower` 是通过命令行访问的。安装过程完成后，`Bower` 现在应该可以通过命令行使用。要检查其是否可用，您可以运行 `[Listing 3-21](#part0010.html#list21)`\
    \ 中显示的命令。\n\n`[***Listing 3-21***](#part0010.html#_list21)`. 检查已安装的 Bower 版本\n\
    \n```\nbower --version\n```\n\n除了安装 `Bower`，您还必须安装 `Git`。`Git` 网站为每个平台提供了一些很好的安装说明（[http://git-scm.com/book/en/Getting-Started-Installing-Git](http://git-scm.com/book/en/Getting-Started-Installing-Git)）。\n\
    \n### 使用 Bower\n\n`Bower` 有一套非常简单的命令来管理依赖关系。这些命令包括安装、搜索和卸载包。`Bower` 有几种安装包的方法。首先，`Bower`\
    \ 可以读取一个称为 `bower.json` 的配置文件。`bower.json` 类似于 `package.json`，因为它定义了一个项目的前端依赖关系，而\
    \ `package.json` 则定义一个项目的 Node 依赖关系。`[Listing 3-22](#part0010.html#list22)` 提供了一个\
    \ `bower.json` 示例以及使用 `bower.json` 安装依赖关系所需的命令。\n\n`[***Listing 3-22***](#part0010.html#_list22)`.\
    \ `bower.json` 和安装依赖关系\n\n```\n// bower.json\n{\n  \"name\": \"todo-app\",\n \
    \ \"dependencies\": {\n    \"jquery\": \"~2.1.0\"\n  }\n}\n\nbower install\n```\n\
    \n将上述文件保存在项目根目录后，运行 `bower install` 命令。这将在本地或远程查找 `jQuery`。一旦找到，该包就会被下载并安装到一个名为\
    \ `bower_components` 的文件夹中。在 `bower_components` 文件夹中，每个包都包含在其各自的文件夹中。我们很快就会看到如何控制\
    \ `Bower` 用于安装包的文件夹。在此之前，让我们继续了解安装包的各种方法。`[Listing 3-23](#part0010.html#list23)`\
    \ 演示了如何通过传递包名称并将依赖关系自动保存到 `bower.json` 文件中来安装一个包。\n\n`[***Listing 3-23***](#part0010.html#_list23)`.\
    \ `bower.json` 和安装依赖关系\n\n```\nbower install backbone -S\n```"
  raw: 'The Gruntfile in [Listing 3-18](#part0010.html#list18) should look fairly
    familiar to the one we used in the previous chapter. The grunt-contrib-sass task
    is loaded toward the end of the file, and the sass task is set as the default
    task. The rest of the Grunt file is taken up by the configuration for the task.
    We’ve added a target called dist, and inside this, we’ve set one option, style.
    The grunt-contrib-sass task wraps the Sass command and exposes some of the flags
    that the Sass command accepts to alter the CSS output.


    The style option modifies the format of the CSS that is output. There are four
    possible values for this option: nested, expanded, compact, and compressed. The
    default value is nested, which indents the CSS similarly to the Sass files. The
    expanded value is the most verbose and looks similar to the handwritten CSS. This
    style is great when trying to work out difficult CSS issues locally. compact and
    compressed styles, as their names suggest, are smaller formats. compact style
    outputs each selector on a single line along with all CSS properties and values
    for the selector. compressed processes the minimal output. All whitespace is removed,
    except for the space required for each selector. With the compress style, all
    selectors appear on the same line, and this is ideal for using on your live site.
    In addition to the style options, grunt-contribub-sass provides options for outputting
    source line numbers in the CSS output, either to cache the compiled sass or produce
    a source map. I’ll be covering source maps later in this book, as part of advanced
    topics.


    The final part of our Sass Gruntfile configuration defines the files to use. In
    this case, we’ve opted to use the file object format to configure which files
    are used for the task. As you can see, we’re using the SCSS file main.scss in
    the path of build/styles. It should be noted that this is relative to the Gruntfile.
    Let’s take our Gruntfile for a spin. Fire up the command line and navigate to
    the project space. Running Grunt at this point should output something similar
    to what is shown in [Figure 3-2](#part0010.html#Fig2).


    ![9781484200148_Fig03-02.jpg](images/00021.jpeg)


    [Figure 3-2](#part0010.html#_Fig2). Failing Sass Grunt configuration, due to lack
    of source file


    As you can see, Grunt fails, with an error message informing us that the source
    file cannot be found. Add the file folder styles. This folder should be inside
    the build folder. Rerunning Grunt will now complete successfully, with the message
    “File css/main.css created.” If you open the application folder, you should now
    see that there is a css folder created and main.css within it. [Listing 3-19](#part0010.html#list19)
    illustrates the project structure at this stage.


    [***Listing 3-19***](#part0010.html#_list19). main.scss for Our Demo Application


    ```

    $primary-color: #a2a2a2;


    body {

      color: $primary-color;

    }

    ```


    At this stage, our to-do application looks very basic—with a mere title. Let’s
    start to pack some functionality and spruce up the styles by pulling in some libraries
    to help us. In the next section, you will see how Grunt can help simplify importing
    libraries into our projects.


    Working with Front-End Frameworks with Grunt


    Over the past few years, there has been an increase in demand for web applications
    to offer the same rich immersive that native applications provide. To meet this
    demand, web applications have become increasing complex. With this increase in
    complexity, we’ve seen the emergence of powerful front-end frameworks to aid developers
    to quickly prototype and deliver new features for these web applications. This
    has introduced a new challenge: how, as developers, we install and manage these
    dependencies. Back-end technologies, such as Ruby and Java, have had dependency
    manager tools to solve this problem for some time. Thankfully, there is now a
    solution for front-end libraries too, in the form of a tool called Bower, from
    Twitter. Before looking at how we can integrate Bower with Grunt, let’s find out
    a little more about Bower itself.


    Bower


    Bower is a package manager built for the Web that aims to solve the problem of
    front-end package management. Bower, like npm, does not install package-wide;
    instead, packages are isolated to a local project. This is extremely useful if
    you have to work across multiple projects and do not want to share dependencies.
    Packages are installed via Git; however, the contents of each package may vary,
    as Bower does not dictate what a package should contain. For example, a package
    may contain JavaScript or CSS, or any other type of asset, for that matter.


    Installing Bower


    Bower, like npm, depends on Node. [Listing 3-20](#part0010.html#list20) demonstrates
    how to install bower. This should be fairly familiar to you at this point.


    [***Listing 3-20***](#part0010.html#_list20). Installing Bower


    ```

    npm install -g bower

    ```


    Note that we use the -g flag to install bower, as Bower is accessed via the command
    line. After the installation process is completed, Bower should now be available
    via the command line. To check its availability, you can run the command shown
    in [Listing 3-21](#part0010.html#list21).


    [***Listing 3-21***](#part0010.html#_list21). Checking the Version of Bower Installed


    ```

    bower --version

    ```


    In addition to installing Bower, you will also have to have Git installed. The
    Git web site offers some great installation instructions for each platform ([http://git-scm.com/book/en/Getting-Started-Installing-Git](http://git-scm.com/book/en/Getting-Started-Installing-Git)).


    Using Bower


    Bower has a very simple set of commands to manage dependency. These include installing,
    searching, and uninstalling packages. Bower has a few methods for installing packages.
    First, Bower can read a configuration file known as bower.json. bower.json is
    akin to package.json, as it defines a project’s front-end dependences, while package.json
    defines Node dependencies for a project. [Listing 3-22](#part0010.html#list22)
    provides a sample bower.json and the command required to install the dependencies
    using bower.json.


    [***Listing 3-22***](#part0010.html#_list22). bower.json and Installing Dependencies


    ```

    // bower.json

    {

      "name": "todo-app",

      "dependencies": {

        "jquery": "~2.1.0"

      }

    }


    bower install

    ```


    With the preceding file saved in the root of your project, you run the bower install
    command. This will then either look for jQuery locally or remotely. Once found,
    the package is downloaded and installed into a folder named bower_components.
    With the bower_components folder, each package is contained with the folder. We
    shall see shortly how to control which folder bower uses for installing packages.
    Before this, let’s continue with the various methods of installing packages. [Listing
    3-23](#part0010.html#list23) demonstrates how to install a package by passing
    the package name and saving the dependency to the bower.json file automatically.


    [***Listing 3-23***](#part0010.html#_list23). bower.json and Installing Dependencies


    ```

    bower install backbone -S

    ```'
