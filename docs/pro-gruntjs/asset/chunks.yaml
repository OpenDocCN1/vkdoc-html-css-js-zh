  trans: '

    # `package.json` 中最重要的部分是文件的 `scripts` 节。Travis CI 在构建应用程序时会运行测试脚本。因此，运行正确的 Grunt
    任务至关重要。经过这最后的修改，我们的项目现在已准备好部署到 Travis CI 上。每次你对项目进行修改时，你都能确信自己没有在多个环境中破坏项目。


    ## 总结


    在整本书中，我们一直专注于通过持续添加 Grunt 任务来解决每个 Web 项目中常见的普遍问题，从而优化我们的应用程序开发者工作流程。在本章中，我们借机审查了我们的
    Grunt 实现，它已经变得臃肿且笨拙。我们引入了许多技术来将 Grunt 的执行时间缩短几秒钟，并改进了任务配置的结构，使我们的项目处于一种能够适应下一系列挑战的状态。


    至此，我们通过 Grunt 的旅程就结束了。我希望你觉得这本书很有帮助，并且它教会了你使用 Grunt 来改进工作流程的新颖有趣的方法。在这个不断发布新软件功能成为常态的苛求世界中，我们必须通过使用能够自动化和简化任务的工具来帮助自己，以便我们能够专注于更困难的问题。Grunt
    是一个强大且灵活的工具，可用于自动化任意数量的任务，如果当前没有满足你特定需求的插件，那么 Grunt 提供的丰富 API 也会让编写插件变得简单。


