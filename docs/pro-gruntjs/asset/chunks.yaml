  trans: '

    这将全局安装 `Grunt` 命令行界面。安装后，`grunt` 命令将在你的命令行（适用于 OS X、*nix 或 BSD 等系统）或 Windows 命令提示符中可用。根据你的配置，上述命令可能需要在相应平台上使用
    `sudo` 或以管理员身份运行。


    一旦 `grunt-cli` 安装完成，你应该能够运行以下命令：


    ```

    grunt –version

    ```


    之后，你将会看到与图 2-9 中类似的输出。


    ![9781484200148_Fig02-09.jpg](img/00015.jpeg)


    图 2-9。命令行中的 Grunt 版本输出


    `Grunt` 命令行界面本身并不是一个任务运行器；它负责运行每个项目中安装的本地版本的 `Grunt`。这减少了全局安装任务运行器的需要，并允许项目在需要时安装不同版本的
    `Grunt`。


    在项目中使用 `Grunt` 的下一步是安装第二个 `Grunt` 包，名为 `grunt`。


    ## 创建一个使用 Grunt 的新项目


    要在项目中使用 `Grunt`，需要两个特定的文件：


    *   `package.json`

    *   `Gruntfile`


    我们在探索 Node.js 模块时已经见过 `package.json` 文件。此文件将包含对 `grunt` 本身以及项目所需相关插件的开发依赖项。


    `Gruntfile`，无论是 `Gruntfile.js` 还是 `Gruntfile.coffee`，都是包含任务配置和/或自定义任务定义的文件。


    ## 向项目添加 Grunt 和插件


    如前所述，可以使用 `npm init` 来添加 `package.json` 文件。`Grunt` 也提供了一种替代方法，即使用 `grunt-init`
    通过 `Grunt` 来搭建项目脚手架，我们将在本书后面部分介绍该方法。首先，让我们复用 `npm init` 命令来生成一个 `package.json`
    文件，如清单 2-7 所示。


    ***清单 2-7***。示例 `package.json` 文件


    ```

    {

      "name": "grunt-file-example",

      "version": "0.0.1",

      "description": "",

      "main": "index.js",

      "scripts": {

        "test": "echo \"Error: no test specified\" && exit 1"

      },

      "author": "James",

      "license": "ISC"

    }

    ```


    现在要将 `Grunt` 添加到项目中，请在项目的根文件夹中运行以下命令：


    ```

    npm install grunt --save-dev

    ```


    这会将最新稳定版的 `Grunt` 添加到你的项目，并应在你的 `package.json` 中存储一个引用，现在看起来像清单 2-8。


    ***清单 2-8***。添加了 Grunt 依赖项后更新的 `package.json`


    ```

    {

      "name": "grunt-file-example",

      "version": "0.0.1",

      "description": "",

      "main": "index.js",

      "scripts": {

        "test": "echo \"Error: no test specified\" && exit 1"

      },

      "author": "James",

      "license": "ISC",

      "devDependencies": {

        "grunt": "⁰.4.3"

      }

    }

    ```


    注意：`devDependencies` 已添加到文件末尾，并且引用了 `grunt`。如果你按如下方式重新运行 `grunt` 命令，输出将显示 `grunt-cli`
    和 `Grunt` 包的版本（参见图 2-10）：


    ```

    grunt –version

    ```


    ![9781484200148_Fig02-10.jpg](img/00016.jpeg)


    图 2-10。命令行中的 Grunt 版本输出


    此时，如果你在项目中不带任何其他标志运行 `grunt` 命令，你将看到一个错误。此错误提示你无法找到 `Gruntfile`。


    在项目的根目录中创建一个新文件，并将其命名为 `Gruntfile.js`。这将创建一个 JavaScript 的 `Gruntfile`；但是，如果你想改用
    CoffeeScript，请将文件保存为 `Gruntfile.coffee`。本书中的所有 `Gruntfile` 都将使用 JavaScript；不过，我建议你尝试使用
    CoffeeScript 编写你的 `Gruntfile`。就这项特定任务而言，我个人更偏爱 CoffeeScript 而非 JavaScript，因为它提供了更清晰、更易读的配置文件。


    一个 `Gruntfile` 包含以下部分：


    *   模块导出，有时也称为“包装器”函数

    *   项目和任务配置

    *   加载 Grunt 插件和任务

    *   自定义任务


    让我们将上述内容添加到我们的 `Gruntfile.js` 文件中。首先，我们必须将模块的导出语句添加到 `Gruntfile` 中（参见清单 2-9）。


    ***清单 2-9***。`Gruntfile.js` 的开头


    ```

    module.exports = function(grunt) {


    };

    ```


    我希望这看起来让你熟悉，因为它遵循了 Node.js 模块使用的相同模式。需要注意的是，我们从 `Gruntfile` 中导出的函数期望接收一个参数，我们将其命名为
    `grunt`。这个 `grunt` 变量将允许我们访问 `Gruntfile` 中的 `Grunt` API。这对配置我们的任务运行器和定义自定义任务至关重要。


    接下来，我们必须添加我们的项目配置和任务。由于这是我们的第一个 `Grunt` 项目，我们将从简单的开始，添加一个用于连接文件的任务。修改后的 `Gruntfile`
    及其添加的配置如下（清单 2-10）：


    ***清单 2-10***。将 `grunt-concat` 添加到 `Gruntfile.js`


    ```

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        pkg: grunt.file.readJSON(''package.json''),


    concat: {

          options: {

            separator: '';'',

          },

          dist: {

            src: [''src/fileA.js'', ''src/fileB.js''],

            dest: ''dist/built.js'',

          }

        }

    });

    };

    ```


    如你所见，文件中添加了相当多的行。第一个新行是对 `grunt.initConfig` 的调用。此函数初始化当前项目的配置，并期望向其传递一个配置对象。配置对象实际上就是一个普通的
    JavaScript 对象。几乎你编写的每个 `Gruntfile` 都会包含对此函数的调用。


    接下来，我们来检查传递给 `initConfig` 调用的配置对象。它有两个顶级属性：`pkg` 和 `concat`。第一个属性 `pkg` 存储了对项目
    `package.json` 内容的引用。有时在 `Gruntfile` 中使用我们项目定义中的属性会很有用。我们将在本书后面探讨如何使用这些属性。第二个属性
    `concat` 是我们的第一个任务配置。


    我们在这个第一个项目中要使用的 `Grunt` 插件是 `grunt-contrib-concat`。该插件定义了一个名为 `concat` 的任务，因此我们可以通过使用相同的键来定义此任务的配置。`concat`
    内定义的下两个关键属性是 `options` 和 `dist`。`options` 允许我们作为开发者覆盖插件作者提供的默认值。在我们的示例中，我们通过指定字符
    `;` 来覆盖 `separator` 选项的默认值。`dist` 属性被称为*目标*。目标允许我们在多个上下文中配置给定的任务，并为每个上下文提供替代选项。在我们的第一个示例中，我们的目标用于定义任务的输入和输出文件。该任务将在
    `src/` 文件夹中查找两个文件：`fileA.js` 和 `fileB.js`。它们将被合并，输出将存储在 `dist/built.js` 中。


    目前，我们的 `Gruntfile` 是无效的，因为我们还没有加载插件。加载插件很简单，因为 `Grunt` 提供了一个易于使用的 API 来加载每个任务。通过添加以下内容来更新我们的
    `Gruntfile`（清单 2-11）：


    ***清单 2-11***。将 `loadNpmTasks` 添加到文件中以加载插件


    ```

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        pkg: grunt.file.readJSON(''package.json''),


    concat: {

          options: {

            separator: '';'',

          },

          dist: {

            src: [''src/fileA.js'', ''src/fileB.js''],

            dest: ''dist/built.js'',

          }

        }

      });


    // Load the plugin that provides the "concat" task.

      grunt.loadNpmTasks(''grunt-contrib-concat'');

    };

    ```

