- fmt: "# Test-Driven Development and Fixtures\n\nNow that we have our first set of\
    \ tests written, let’s explore how easier it becomes to add new features to our\
    \ `Todo` module. In this section, we’ll explore using the testing methodology\
    \ of writing our automated tests first, before writing a small amount of code\
    \ to make our tests pass. Once we have our tests passing, we are free to re-factor\
    \ our implementation to meet our development standards. This process is known\
    \ as Test Driven Development and is often shortened to `TDD`. For example, let’s\
    \ add the ability to undo the completion of an item. [Listing 6-15](#part0013.html#list15)\
    \ illustrates the newly added function that is intended to mark an item as being\
    \ incomplete.\n\n[***Listing 6-15***](#part0013.html#_list15). A Simple JavaScript\
    \ Module That Represents a To-Do Item\n\n```\n/**\n  *\n  * @name Todo\n  * @classdesc\
    \ Todo Model\n  * @author James Cryer\n  * @exports Backbone.Model\n  */\n'use\
    \ strict';\n\nvar Backbone = require('backbone');\n\nmodule.exports = Backbone.Model.extend({\n\
    \  defaults: {\n    'title': '',\n    'date': '19/02/2015',\n    'complete': false\n\
    \  },\n\ncomplete: function () {\n    this.set('complete', true);\n  },\n\nundo:\
    \ function () {\n    this.set('complete', true);\n  }\n});\n```\n\nNext, we have\
    \ to add a test to verify that the `undo` function is working as expected. This\
    \ is shown in [Listing 6-16](#part0013.html#list16).\n\n[***Listing 6-16***](#part0013.html#_list16).\
    \ Updating the Test Module to Verify the `undo` Function Is As Expected\n\n```\n\
    'use strict';\n\nexports.todo = {\n  setUp: function (done) {\n    var Todo =\
    \ require('../../app/js/models/todo');\n\nthis.todo = new Todo({\n      'title':\
    \ 'Test Item',\n      'date': '24/02/2014'\n    });\n    done();\n  },\n  ...\n\
    \nitem_can_be_marked_as_incomplete: function (test) {\n    this.todo.complete();\n\
    \    this.todo.undo();\n    test.equal(this.todo.get('complete'), false);\n  \
    \  test.done();\n  }\n};\n```\n\nRerunning our tests should cause a failure, as\
    \ we currently have a defect in the `undo` function. At present, it is setting\
    \ the `complete` attribute to `true`, while it should be set to `false`. [Figure\
    \ 6-8](#part0013.html#Fig8) shows the output of rerunning the tests, with the\
    \ failing test present.\n\n![9781484200148_Fig06-08.jpg](images/00046.jpeg)\n\n\
    [Figure 6-8](#part0013.html#_Fig8). `grunt-contrib-nodeunit` reporting a failing\
    \ test\n\nIf you open the test results file generated by the plug-in, it will\
    \ provide you with a more detailed output of the cause of the failure. Alternatively,\
    \ if you want to see the output in the console, the default reporter will output\
    \ any errors generated by `nodeunit`, as shown in [Figure 6-9](#part0013.html#Fig9).\n\
    \n![9781484200148_Fig06-09.jpg](images/00047.jpeg)\n\n[Figure 6-9](#part0013.html#_Fig9).\
    \ Failing test output to console\n\nThe output generated from a failing test is\
    \ informative, providing the file the test failed within, the name of the test,\
    \ the reason for failure, and the line number, which further supports the principle\
    \ of minimizing the number of things tested. A succinct test is usually far easier\
    \ to understand and trace the cause of the failure. In our example, the cause\
    \ of the failure is simply a matter of setting a value to `true` instead of `false`.\
    \ If the `undo` function is updated, as per [Listing 6-17](#part0013.html#list17),\
    \ the tests will all pass once again.\n\n[***Listing 6-17***](#part0013.html#_list17).\
    \ Modified `undo` Function to Resolve Failing Tests\n\n```\n...\n\nundo: function\
    \ () {\n  this.set('complete', false);\n}\n...\n```\n\nWhile writing a test, it\
    \ is often useful to use test data, to easily modify the state of your application\
    \ while running tests. In the next section, we’ll explore the use of `Grunt` to\
    \ generate or modify test fixtures before running our tests.\n\n## Generating\
    \ Fixtures\n\nAs shown in the last section, having a suite of tests that can be\
    \ automatically run each time you make a change to your application can be powerful,\
    \ and this is particularly useful for large, complex applications for which the\
    \ time required to manually test is far greater than that for running a suite\
    \ of automated tests. However, as the complexity grows within an application,\
    \ it is likely that you will want to test the various states that an application\
    \ can and cannot transition between. This is where a set of test fixtures can\
    \ become helpful, as it allows you to quickly switch your application context,\
    \ based on the data that is loaded into your application.\n\nAs the name suggests,\
    \ fixtures are typically known and predefined. However, from time to time, you\
    \ may require fixtures that are partially dynamic, for instance, if you want to\
    \ verify that your application responds correctly to dates in the future. If you\
    \ have a fixed date, you either have to ensure your application is configured\
    \ to run within a given time period or modify your text fixtures to ensure that\
    \ their dates are always in the future.\n\nLet’s extend our example from the previous\
    \ section by adding a new function to our `Todo` module. This function will determine\
    \ whether the date has passed on the to-do item, essentially allowing us to find\
    \ all to-do items that have expired. [Listing 6-18](#part0013.html#list18) contains\
    \ the modified `Todo` module, with the additional function `hasExpired`.\n\n[***Listing\
    \ 6-18***](#part0013.html#_list18). Modified `Todo` Module with the Ability to\
    \ Check If an Item Has Expired\n\n```\nmodule.exports = Backbone.Model.extend({\n\
    \  defaults: {\n    'title': '',\n    'date': '19/02/2015',\n    'complete': false\n\
    \  },\n\ncomplete: function () {\n    this.set('complete', true);\n  },\n\nundo:\
    \ function () {\n    this.set('complete', false);\n  },\n\nhasExpired: function\
    \ () {\n    return new Date(this.get('date')) < new Date();\n  }\n});\n```\n\n\
    Next, we have to add a test to ensure that our new function is working as expected.\
    \ [Listing 6-19](#part0013.html#list19) has the modified test module with a test\
    \ for the `hasExpired` function.\n\n[***Listing 6-19***](#part0013.html#_list19).\
    \ Test Module Containing Additional Test for Expiration Functionality\n\n```\n\
    exports.todo = {\n  setUp: function (done) {\n    var Todo = require('../../app/js/models/todo');\n\
    \nthis.todo = new Todo({\n      'title': 'Test Item',\n      'date': '24/02/2014'\n\
    \    });\n    done();\n  },\n  ...\n  item_has_expired: function (test) {\n  \
    \  this.todo.set('date', '2011-05-26T07:56:00.123Z');\n    test.ok(this.todo.hasExpired());\n\
    \    test.done();\n  }\n};\n```\n\nIn the latest test, we update our `todo` instance\
    \ with a new date that is set in the past and verify that when we call `hasExpired`\
    \ on the instance, the value `true` is returned. This doesn’t appear to be too\
    \ problematic, as the test will always pass. Imagine a scenario in which we want\
    \ to start handing multiple to-do items that form a to-do item list. On the set\
    \ of to-do items, we want to be able to filter all the active items, items that\
    \ have yet to expire. In such a test, we must ensure that we always have available\
    \ some items that have not expired, and also, as there are multiple instances,\
    \ we do not want to bloat our test module with lots of data. In such a scenario,\
    \ it is best to create an external file containing our test data and load the\
    \ data when the tests are run. This introduces a new problem, as our test file\
    \ contains static data, and we have to ensure that the test data is dynamic.\n\
    \n## Automating Fixtures at Runtime\n\n`Grunt` can be used to automate the production\
    \ of dynamic test data before each test run. To achieve this, we can use another\
    \ `Grunt` plug-in called `grunt-text-replace`. `Grunt-text-replace`, as the name\
    \ suggests, allows you to configure the plug-in to replace text patterns within\
    \ a file and output the result to another location. To get started, let’s first\
    \ install the plug-in, as shown in [Listing 6-20](#part0013.html#list20)."
  raw: 'Now that we have our first set of tests written, let’s explore how easier
    it becomes to add new features to our Todo module. In this section, we’ll explore
    using the testing methodology of writing our automated tests first, before writing
    a small amount of code to make our tests pass. Once we have our tests passing,
    we are free to re-factor our implementation to meet our development standards.
    This process is known as Test Driven Development and is often shortened to TDD.
    For example, let’s add the ability to undo the completion of an item. [Listing
    6-15](#part0013.html#list15) illustrates the newly added function that is intended
    to mark an item as being incomplete.


    [***Listing 6-15***](#part0013.html#_list15). A Simple JavaScript Module That
    Represents a To-Do Item


    ```

    /**

      *

      * @name Todo

      * @classdesc Todo Model

      * @author James Cryer

      * @exports Backbone.Model

      */

    ''use strict'';


    var Backbone = require(''backbone'');


    module.exports = Backbone.Model.extend({

      defaults: {

        ''title'': '''',

        ''date'': ''19/02/2015'',

        ''complete'': false

      },


    complete: function () {

        this.set(''complete'', true);

      },


    undo: function () {

        this.set(''complete'', true);

      }

    });

    ```


    Next, we have to add a test to verify that the undo function is working as expected.
    This is shown in [Listing 6-16](#part0013.html#list16).


    [***Listing 6-16***](#part0013.html#_list16). Updating the Test Module to Verify
    the undo Function Is As Expected


    ```

    ''use strict'';


    exports.todo = {

      setUp: function (done) {

        var Todo = require(''../../app/js/models/todo'');


    this.todo = new Todo({

          ''title'': ''Test Item'',

          ''date'': ''24/02/2014''

        });

        done();

      },

      ...


    item_can_be_marked_as_incomplete: function (test) {

        this.todo.complete();

        this.todo.undo();

        test.equal(this.todo.get(''complete''), false);

        test.done();

      }

    };

    ```


    Rerunning our tests should cause a failure, as we currently have a defect in the
    undo function. At present, it is setting the complete attribute to true, while
    it should be set to false. [Figure 6-8](#part0013.html#Fig8) shows the output
    of rerunning the tests, with the failing test present.


    ![9781484200148_Fig06-08.jpg](images/00046.jpeg)


    [Figure 6-8](#part0013.html#_Fig8). grunt-contrib-nodeunit reporting a failing
    test


    If you open the test results file generated by the plug-in, it will provide you
    with a more detailed output of the cause of the failure. Alternatively, if you
    want to see the output in the console, the default reporter will output any errors
    generated by nodeunit, as shown in [Figure 6-9](#part0013.html#Fig9).


    ![9781484200148_Fig06-09.jpg](images/00047.jpeg)


    [Figure 6-9](#part0013.html#_Fig9). Failing test output to console


    The output generated from a failing test is informative, providing the file the
    test failed within, the name of the test, the reason for failure, and the line
    number, which further supports the principle of minimizing the number of things
    tested. A succinct test is usually far easier to understand and trace the cause
    of the failure. In our example, the cause of the failure is simply a matter of
    setting a value to true instead of false. If the undo function is updated, as
    per [Listing 6-17](#part0013.html#list17), the tests will all pass once again.


    [***Listing 6-17***](#part0013.html#_list17). Modifed undo Function to Resolve
    Failing Tests


    ```

    ...


    undo: function () {

      this.set(''complete'', false);

    }

    ...

    ```


    While writing a test, it is often useful to use test data, to easily modify the
    state of your application while running tests. In the next section, we’ll explore
    the use of Grunt to generate or modify test fixtures before running our tests.


    Generating Fixtures


    As shown in the last section, having a suite of tests that can be automatically
    run each time you make a change to your application can be powerful, and this
    is particularly useful for large, complex applications for which the time required
    to manually test is far greater than that for running a suite of automated tests.
    However, as the complexity grows within an application, it is likely that you
    will want to test the various states that an application can and cannot transition
    between. This is where a set of test fixtures can become helpful, as it allows
    you to quickly switch your application context, based on the data that is loaded
    into your application.


    As the name suggests, fixtures are typically known and predefined. However, from
    time to time, you may require fixtures that are partially dynamic, for instance,
    if you want to verify that your application responds correctly to dates in the
    future. If you have a fixed date, you either have to ensure your application is
    configured to run within a given time period or modify your text fixtures to ensure
    that their dates are always in the future.


    Let’s extend our example from the previous section by adding a new function to
    our Todo module. This function will determine whether the date has passed on the
    to-do item, essentially allowing us to find all to-do items that have expired.
    [Listing 6-18](#part0013.html#list18) contains the modified Todo module, with
    the additional function hasExpired.


    [***Listing 6-18***](#part0013.html#_list18). Modified Todo Module with the Ability
    to Check If an Item Has Expired


    ```

    module.exports = Backbone.Model.extend({

      defaults: {

        ''title'': '''',

        ''date'': ''19/02/2015'',

        ''complete'': false

      },


    complete: function () {

        this.set(''complete'', true);

      },


    undo: function () {

        this.set(''complete'', false);

      },


    hasExpired: function () {

        return new Date(this.get(''date'')) < new Date();

      }

    });

    ```


    Next, we have to add a test to ensure that our new function is working as expected.
    [Listing 6-19](#part0013.html#list19) has the modified test module with a test
    for the hasExpired function.


    [***Listing 6-19***](#part0013.html#_list19). Test Module Containing Additional
    Test for Expiration Functionality


    ```

    exports.todo = {

      setUp: function (done) {

        var Todo = require(''../../app/js/models/todo'');


    this.todo = new Todo({

          ''title'': ''Test Item'',

          ''date'': ''24/02/2014''

        });

        done();

      },

      ...

      item_has_expired: function (test) {

        this.todo.set(''date'', ''2011-05-26T07:56:00.123Z'');

        test.ok(this.todo.hasExpired());

        test.done();

      }

    };

    ```


    In the latest test, we update our todo instance with a new date that is set in
    the past and verify that when we call hasExpired on the instance, the value true
    is returned. This doesn’t appear to be too problematic, as the test will always
    pass. Imagine a scenario in which we want to start handing multiple to-do items
    that form a to-do item list. On the set of to-do items, we want to be able to
    filter all the active items, items that have yet to expire. In such a test, we
    must ensure that we always have available some items that have not expired, and
    also, as there are multiple instances, we do not want to bloat our test module
    with lots of data. In such a scenario, it is best to create an external file containing
    our test data and load the data when the tests are run. This introduces a new
    problem, as our test file contains static data, and we have to ensure that the
    test data is dynamic.


    Automating Fixtures at Runtime


    Grunt can be used to automate the production of dynamic test data before each
    test run. To achieve this, we can use another Grunt plug-in called grunt-text-replace.
    Grunt-text-replace, as the name suggests, allows you to configure the plug-in
    to replace text patterns within a file and output the result to another location.
    To get started, let’s first install the plug-in, as shown in [Listing 6-20](#part0013.html#list20).'
  trans: "\n# 测试驱动开发与测试夹具\n\n现在我们已经编写了第一批测试，让我们探讨一下为 `Todo` 模块添加新功能会变得多么容易。在本节中，我们将探索一种测试方法：先编写自动化测试，再编写少量代码来通过测试。一旦测试通过，我们就可以自由地重构实现以满足开发标准。这个过程被称为测试驱动开发，通常简称为\
    \ `TDD`。例如，让我们添加撤销完成待办事项的功能。清单 6-15 演示了新添加的用于将项目标记为未完成的函数。\n\n***清单 6-15***. 一个表示待办事项的简单\
    \ JavaScript 模块\n\n```\n/**\n  *\n  * @name Todo\n  * @classdesc Todo 模型\n  *\
    \ @author James Cryer\n  * @exports Backbone.Model\n  */\n'use strict';\n\nvar\
    \ Backbone = require('backbone');\n\nmodule.exports = Backbone.Model.extend({\n\
    \  defaults: {\n    'title': '',\n    'date': '19/02/2015',\n    'complete': false\n\
    \  },\n\ncomplete: function () {\n    this.set('complete', true);\n  },\n\nundo:\
    \ function () {\n    this.set('complete', true);\n  }\n});\n```\n\n接下来，我们必须添加一个测试来验证\
    \ `undo` 函数是否按预期工作，如清单 6-16 所示。\n\n***清单 6-16***. 更新测试模块以验证 `undo` 函数是否符合预期\n\n\
    ```\n'use strict';\n\nexports.todo = {\n  setUp: function (done) {\n    var Todo\
    \ = require('../../app/js/models/todo');\n\nthis.todo = new Todo({\n      'title':\
    \ 'Test Item',\n      'date': '24/02/2014'\n    });\n    done();\n  },\n  ...\n\
    \nitem_can_be_marked_as_incomplete: function (test) {\n    this.todo.complete();\n\
    \    this.todo.undo();\n    test.equal(this.todo.get('complete'), false);\n  \
    \  test.done();\n  }\n};\n```\n\n重新运行测试应该会导致失败，因为当前 `undo` 函数中存在缺陷。目前，它将 `complete`\
    \ 属性设置为 `true`，而本应设置为 `false`。图 6-8 显示了重新运行测试的输出，其中包含失败的测试。\n\n![9781484200148_Fig06-08.jpg](img/00046.jpeg)\n\
    \n图 6-8. `grunt-contrib-nodeunit` 报告测试失败\n\n如果你打开该插件生成的测试结果文件，它会提供更详细的失败原因输出。或者，如果你想在控制台中查看输出，默认的\
    \ reporter 会输出 `nodeunit` 产生的所有错误，如图 6-9 所示。\n\n![9781484200148_Fig06-09.jpg](img/00047.jpeg)\n\
    \n图 6-9. 失败的测试输出到控制台\n\n失败的测试所生成的输出信息量很大，它提供了测试失败的文件、测试名称、失败原因以及行号，这进一步支持了最小化测试数量的原则。简洁的测试通常更容易理解和追溯失败原因。在我们的示例中，失败的原因仅仅是将值设置为\
    \ `true` 而不是 `false`。如果按照清单 6-17 更新 `undo` 函数，所有测试将再次通过。\n\n***清单 6-17***. 修改后的\
    \ `undo` 函数以解决测试失败问题\n\n```\n...\n\nundo: function () {\n  this.set('complete',\
    \ false);\n}\n...\n```\n\n在编写测试时，使用测试数据通常很有用，这样可以方便地在运行测试时修改应用程序的状态。在下一节中，我们将探讨如何在运行测试之前使用\
    \ `Grunt` 生成或修改测试夹具。\n\n## 生成夹具\n\n如上一节所示，拥有一套每次更改应用程序时都能自动运行的测试套件非常强大，这对于大型、复杂的应用程序尤其有用，因为手动测试所需的时间远大于运行一套自动化测试所需的时间。然而，随着应用程序复杂性的增加，你很可能会想要测试应用程序可以转换和不可以转换的各种状态。这时，一组测试夹具就会很有帮助，因为它允许你根据加载到应用程序中的数据快速切换应用程序上下文。\n\
    \n顾名思义，夹具通常是已知且预定义的。但是，有时你可能需要部分动态的夹具，例如，你想要验证应用程序是否能正确响应未来的日期。如果你有一个固定日期，那么要么必须确保应用程序配置为在给定的时间段内运行，要么修改你的文本夹具以确保它们的日期总是在将来。\n\
    \n让我们从前一节的示例进行扩展，为我们的 `Todo` 模块添加一个新函数。该函数将判断待办事项的日期是否已过，本质上允许我们找出所有已过期的待办事项。清单\
    \ 6-18 包含了修改后的 `Todo` 模块，其中添加了 `hasExpired` 函数。\n\n***清单 6-18***. 修改后的 `Todo`\
    \ 模块，能够检查项目是否已过期\n\n```\nmodule.exports = Backbone.Model.extend({\n  defaults:\
    \ {\n    'title': '',\n    'date': '19/02/2015',\n    'complete': false\n  },\n\
    \ncomplete: function () {\n    this.set('complete', true);\n  },\n\nundo: function\
    \ () {\n    this.set('complete', false);\n  },\n\nhasExpired: function () {\n\
    \    return new Date(this.get('date')) < new Date();\n  }\n});\n```\n\n接下来，我们必须添加一个测试来确保我们的新函数按预期工作。清单\
    \ 6-19 包含了修改后的测试模块，其中添加了对 `hasExpired` 函数的测试。\n\n***清单 6-19***. 测试模块，包含针对过期功能的附加测试\n\
    \n```\nexports.todo = {\n  setUp: function (done) {\n    var Todo = require('../../app/js/models/todo');\n\
    \nthis.todo = new Todo({\n      'title': 'Test Item',\n      'date': '24/02/2014'\n\
    \    });\n    done();\n  },\n  ...\n  item_has_expired: function (test) {\n  \
    \  this.todo.set('date', '2011-05-26T07:56:00.123Z');\n    test.ok(this.todo.hasExpired());\n\
    \    test.done();\n  }\n};\n```\n\n在最新的测试中，我们用一个新的过去日期更新了我们的 `todo` 实例，并验证了当我们在实例上调用\
    \ `hasExpired` 时，返回值是 `true`。这看起来问题不大，因为测试总会通过。想象一个场景，我们想要开始处理多个待办事项以形成一个待办事项列表。在这组待办事项中，我们希望能够过滤出所有活跃的、尚未过期的项目。在这样的测试中，我们必须确保始终有一些未过期的项目可用，同时，由于有多个实例，我们不希望用大量数据使测试模块变得臃肿。在这样的场景下，最好的方法是创建一个包含测试数据的外部文件，并在运行测试时加载数据。这引出了一个新的问题，因为我们的测试文件包含静态数据，而我们必须确保测试数据是动态的。\n\
    \n## 在运行时自动化生成夹具\n\n`Grunt` 可用于在每次测试运行前自动生成动态测试数据。为此，我们可以使用另一个名为 `grunt-text-replace`\
    \ 的 `Grunt` 插件。顾名思义，`Grunt-text-replace` 允许你配置该插件以替换文件中的文本模式，并将结果输出到另一个位置。首先，让我们安装该插件，如清单\
    \ 6-20 所示。\n"
- fmt: "### 安装`grunt-text-replace`\n\n[***Listing 6-20***](#part0013.html#_list20).\
    \ 安装`grunt-text-replace`\n\n```\nnpm install –save-dev grunt-text-replace\n```\n\
    \n在配置任务之前，我们先生成静态测试数据并将其保存到`build`文件夹中。在应用的`build`文件夹内，创建一个名为`fixtures`的新文件夹。在新`fixtures`文件夹中，我们可以创建一个名为`todo.json`的文件来存放待办事项的测试数据。[Listing\
    \ 6-21](#part0013.html#list21) 包含了测试数据，其中所有需要未来日期的条目都将`FUTURE_DATE`作为占位符。现在，我们已经有了基本的文本测试数据，接下来可以配置`grunt-text-replace`来生成每次运行测试时使用的测试数据。\n\
    \n### 待办事项的测试数据\n\n[***Listing 6-21***](#part0013.html#_list21). 待办事项的测试数据\n\n\
    ```\n[\n  {\n    \"title\": \"Past Item\",\n    \"date\": \"2011-05-26T07:56:00.123Z\"\
    \n  },\n  {\n    \"title\": \"Future item 1\",\n    \"date\": \"FUTURE_DATE\"\n\
    \  },\n  {\n    \"title\": \"Future item 2\",\n    \"date\": \"FUTURE_DATE\"\n\
    \  }\n]\n```\n\n### 配置`grunt-text-replace`以动态生成测试日期\n\n[Listing 6-22](#part0013.html#_list22)\
    \ 包含了`grunt-text-replace`的任务配置。该配置包含源文件夹、目标文件夹以及一个替换数组。该插件支持简单的文本替换、正则表达式替换，或者像本例中一样，使用函数来替换源文件中的文本。替换完成后，修改后的文本将输出到目标文件夹，并保留与原文件相同的文件名。在我们的示例中，文件从`build/fixtures`读取，然后写入`tests/fixtures`。\n\
    \n[***Listing 6-22***](#part0013.html#_list22). 配置`grunt-text-replace`以动态生成测试日期\n\
    \n```\nreplace: {\n  fixtures: {\n    src: ['build/fixtures/*.json'],\n    dest:\
    \ 'tests/fixtures/',\n    replacements: [{\n      from: 'FUTURE_DATE',\n     \
    \ to: function () {\n        var today = new Date();\n        return new Date(today.getFullYear()\
    \ + 1, today.getMonth(), today.getDate())\n      }\n    }]\n  }\n}\n```\n\n现在，`grunt-text-replace`已经配置了目标和任务，我们可以像使用其他任何`grunt`插件一样，通过`grunt-cli`的`npm`包来运行它。不幸的是，`grunt-text-replace`默认不会提供关于读取或写入文件的任何反馈。要查看运行任务时哪些文件被写入，可以使用Grunt的`verbose`标志，如[Listing\
    \ 6-23](#part0013.html#list23)所示。使用`verbose`标志将生成类似于[Figure 6-10](#part0013.html#Fig10)的输出。\n\
    \n![9781484200148_Fig06-10.jpg](images/00048.jpeg)\n\n[Figure 6-10](#part0013.html#_Fig10).\
    \ 启用`verbose`标志运行`grunt-text-replace`的示例输出\n\n[***Listing 6-23***](#part0013.html#_list23).\
    \ 使用`verbose`标志输出`grunt-text-replace`生成的文件\n\n```\ngrunt replace –v\n```\n\n###\
    \ 应用动态数据生成\n\n现在我们已经拥有了一组动态测试数据，接下来可以编写一个模块来处理待办事项列表。我们将使用Backbone库中的一个模块——`Collection`。`Collection`提供了一种方便的方式来处理一个或多个模型，追踪一组项目中的变化，并对这些项目应用函数。[Listing\
    \ 6-24](#part0013.html#list24) 包含了一个新的待办事项集合的完整可运行示例。\n\n### 用于处理多个待办事项的Backbone集合\n\
    \n[***Listing 6-24***](#part0013.html#_list24). 用于处理多个待办事项的Backbone集合\n\n```\n\
    'use strict';\n\nvar _ = require('underscore');\nvar Todo = require('../models/todo');\n\
    var Backbone = require('backbone');\n\nmodule.exports = Backbone.Collection.extend({\n\
    \nmodel: Todo,\n\nactiveItems: function () {\n    return _.filter(this.models,\
    \ function(item) { return !item.hasExpired(); });\n  },\n\nexpiredItems: function\
    \ () {\n    return _.filter(this.models, function(item) { return item.hasExpired();\
    \ });\n  }\n});\n```\n\n如[Listing 6-24](#part0013.html#list24)所示，我们的集合期望接收一个`Todo`模块的实例作为模型。该集合还包含两个用于过滤集合的函数：第一个用于查找所有活跃项目，第二个用于查找集合中所有已过期的项目。为了验证函数是否按预期工作，我们可以在`tests/collections`中创建一个新的测试模块。与我们的第一个测试一样，该文件的名称应与被测试的模块相同，但以`_test`作为后缀。\n\
    \n### 待办事项集合的测试模块\n\n[Listing 6-25](#part0013.html#_list25) 包含了`todos_test.js`的内容，即对我们集合的测试。该集合有三个测试：一个用于确认集合使用了正确的模型，另一个用于验证我们可以按活跃项目过滤集合，最后一个用于过滤集合中的过期项目。测试模块的一个重要部分是突出显示在每个测试之前执行的`setUp`函数。该函数用于加载测试数据。请注意，我们从`tests`文件夹内加载测试数据文件，因此使用的是由`grunt-text-replace`生成的数据。这些数据随后被加载到待办事项集合中，然后在每个测试中使用。\n\
    \n[***Listing 6-25***](#part0013.html#_list25). 待办事项集合的测试模块\n\n```\n'use strict';\n\
    \nexports.todos = {\n  setUp: function (done) {\n    var data = require('../fixtures/todos');\n\
    \    var Todos = require('../../app/js/collections/todos');\n\nthis.todos = new\
    \ Todos(data);\n    done();\n  },\n\ncollection_has_model_of_todo: function (test)\
    \ {\n    var Todo = require('../../app/js/models/todo');\n    test.equal(this.todos.model,\
    \ Todo);\n    test.done();\n  },\n\ncollection_can_filter_active_items: function\
    \ (test) {\n    test.equal(this.todos.activeItems().length, 2);\n    test.done();\n\
    \  },\n\ncollection_can_filter_expired_items: function (test) {\n    test.equal(this.todos.expiredItems().length,\
    \ 1);\n    test.done();\n  }\n};\n```\n\n运行`grunt-contrib-nodeunit`任务应生成与[Figure\
    \ 6-11](#part0013.html#Fig11)相同的输出。\n\n![9781484200148_Fig06-11.jpg](images/00049.jpeg)\n\
    \n[Figure 6-11](#part0013.html#_Fig11). 同时运行集合和模型测试的`grunt-contrib-nodeunit`\n\
    \n将一套测试与一组通过时间动态修改的可靠测试数据相结合，会变得非常宝贵，尤其是在时间紧迫、错误容易潜入项目的情况下。除了单元级别的测试，我们还可以开始探索更高级别的测试。我们可以在浏览器中测试应用——实际上，可以在多个浏览器中测试。在下一节中，我将介绍一个新的Grunt插件，它可以帮助我们自动化这一过程。\n\
    \n### 在浏览器中测试\n\n对更高级、性能更佳的Web应用的需求日益增长。作为开发者，我们通过在浏览器中构建高度交互和复杂的应用来回应这一需求。页面通常运行着大量的JavaScript代码。到目前为止，我们进行的测试都完全在Node环境中运行。在本节中，我们将编写可以在浏览器中运行的测试。这将确保我们的生产代码能够在最接近用户最终使用环境的环境中运行。借助自动化工具的强大功能，我们可以在多个浏览器中运行测试，这有助于验证应用的稳定性。"
  raw: '[***Listing 6-20***](#part0013.html#_list20). Installing grunt-text-replace


    ```

    npm install –save-dev grunt-text-replace

    ```


    Before configuring the task, let’s generate our static test data and save it in
    the build folder. Inside the build folder of our application, let’s create a new
    folder called fixtures. Inside the new fixtures folder, we can create our to-do
    fixtures in a file named todo.json. [Listing 6-21](#part0013.html#list21) contains
    our test fixtures, with all items that require future dates having the value FUTURE_DATE
    as a placeholder. Now that we have our baseline text fixtures, we can start to
    configure grunt-text-replace to generate our fixtures that will be used each time
    we run our tests.


    [***Listing 6-21***](#part0013.html#_list21). Testing Fixtures for Our To-Do Items


    ```

    [

      {

        "title": "Past Item",

        "date": "2011-05-26T07:56:00.123Z"

      },

      {

        "title": "Future item 1",

        "date": "FUTURE_DATE"

      },

      {

        "title": "Future item 2",

        "date": "FUTURE_DATE"

      }

    ]

    ```


    [Listing 6-22](#part0013.html#_list22) contains the task configuration for grunt-text-replace.
    The configuration for the target contains the source folders, the destination
    folder, and an array of replacements. The plug-in supports simple text swapping,
    regular expression swapping, or, as in our configuration, the use of functions
    to replace text within the source files. After the text has been replaced, the
    modified text is then output to the destination folder with the same name as the
    source file. In our example, files are read from build/fixtures and then written
    to tests/fixtures.


    [***Listing 6-22***](#part0013.html#_list22). Configuring grunt-text-replace to
    Dynamically Generate Dates for Our Tests


    ```

    replace: {

      fixtures: {

        src: [''build/fixtures/*.json''],

        dest: ''tests/fixtures/'',

        replacements: [{

          from: ''FUTURE_DATE'',

          to: function () {

            var today = new Date();

            return new Date(today.getFullYear() + 1, today.getMonth(), today.getDate())

          }

        }]

      }

    }

    ```


    Now that grunt-text-replace has been provided with configuration and a target,
    we can run it as we would any other grunt plug-in, using the grunt-cli npm package.
    Unfortunately, grunt-text-replace does not provide any feedback in terms of the
    files being read or written by default. To see which files have been written when
    running the task, you can use Grunt’s verbose flag, as shown in [Listing 6-23](#part0013.html#list23).
    Using the verbose flag will generate output similar to that featured in [Figure
    6-10](#part0013.html#Fig10).


    ![9781484200148_Fig06-10.jpg](images/00048.jpeg)


    [Figure 6-10](#part0013.html#_Fig10). Sample output of running grunt-text-replace
    with the verbose flag enabled


    [***Listing 6-23***](#part0013.html#_list23). Using the Verbose Flag to Output
    the Files Generated by grunt-text-replace


    ```

    grunt replace –v

    ```


    Applying Fixture Generation


    Now that we have a set of dynamic fixtures, we can start to write a module that
    will handle our to-do list items. We will use a module of the Backbone library
    called Collection. Collections provide a convenient way of handling one or more
    models, tracking changes within a set of items, and applying functions to these
    too. [Listing 6-24](#part0013.html#list24) contains the complete working example
    of a new to-do collection.


    [***Listing 6-24***](#part0013.html#_list24). Backbone Collection to Handle Multiple
    To-Do Items


    ```

    ''use strict'';


    var _ = require(''underscore'');

    var Todo = require(''../models/todo'');

    var Backbone = require(''backbone'');


    module.exports = Backbone.Collection.extend({


    model: Todo,


    activeItems: function () {

        return _.filter(this.models, function(item) { return !item.hasExpired(); });

      },


    expiredItems: function () {

        return _.filter(this.models, function(item) { return item.hasExpired(); });

      }

    });

    ```


    As shown in [Listing 6-24](#part0013.html#list24), our collection expects to take
    a model that is an instance of our Todo module. The collection also has two functions
    for filtering the collection, the first to find all active items, and the second
    to find all expired items within the collection. To verify that our functions
    are working as expected, we can create a new test module in tests/collections.
    The file, as with our first tests, should be named the same as the module being
    tested but postfixed with _test.


    [Listing 6-25](#part0013.html#_list25) contains the contents of todos_test.js,
    the tests for our collection. There are three tests for the collection: one to
    confirm the correct model is being used for the collection, another for verifying
    that we can filter the collection by active, and a final one for filtering the
    collection’s expired items. An important section of the test module is to highlight
    the setUp function that is executed before each test. This is used to load our
    fixture data. Note that we load the fixtures file from within the tests folder
    and, hence, use the data generated from grunt-text-replace. This data is then
    loaded into the todos collection before being used within each test.


    [***Listing 6-25***](#part0013.html#_list25). Test Module for Todos Collection


    ```

    ''use strict'';


    exports.todos = {

      setUp: function (done) {

        var data = require(''../fixtures/todos'');

        var Todos = require(''../../app/js/collections/todos'');


    this.todos = new Todos(data);

        done();

      },


    collection_has_model_of_todo: function (test) {

        var Todo = require(''../../app/js/models/todo'');

        test.equal(this.todos.model, Todo);

        test.done();

      },


    collection_can_filter_active_items: function (test) {

        test.equal(this.todos.activeItems().length, 2);

        test.done();

      },


    collection_can_filter_expired_items: function (test) {

        test.equal(this.todos.expiredItems().length, 1);

        test.done();

      }

    };

    ```


    Running the grunt-contrib-nodeunit task should generate the same output as shown
    in [Figure 6-11](#part0013.html#Fig11).


    ![9781484200148_Fig06-11.jpg](images/00049.jpeg)


    [Figure 6-11](#part0013.html#_Fig11). grunt-contrib-nodeunit with tests for both
    the collection and model being run


    Having a suite of tests combined with a set of solid fixtures that are dynamically
    modified through time can become invaluable, especially if you are working under
    tight deadlines, when mistakes can easily creep into a project. In addition to
    tests that work at a unit level, we can start to explore a higher level of testing.
    We can start to test our application in the browser itself—in fact, in multiple
    browsers. In the next section, I’ll introduce a new Grunt plug-in that can help
    automate this process for us.


    Testing in the Browser


    The demands for more advanced and performant web applications have risen. As developers,
    we’ve responded by building highly interactive and complex applications in the
    browser. Pages typically have a larger amount of JavaScript running in them. The
    testing carried out so far has been exclusively run within the Node environment.
    In this section, we will look to write tests that can be run in the browser. This
    will ensure that our production code can run in the environment that closely matches
    the environment in which it will be run by our users. With the power of automation
    tools, we can run our tests in multiple browsers, which can help us verify the
    stability of our applications.'
  trans: "\n### 安装`grunt-text-replace`\n\n***清单 6-20***. 安装`grunt-text-replace`\n\n\
    ```\nnpm install –save-dev grunt-text-replace\n```\n\n在配置任务之前，我们先生成静态测试数据并将其保存到`build`文件夹中。在应用的`build`文件夹内，创建一个名为`fixtures`的新文件夹。在新`fixtures`文件夹中，我们可以创建一个名为`todo.json`的文件来存放待办事项的测试数据。清单\
    \ 6-21 包含了测试数据，其中所有需要未来日期的条目都将`FUTURE_DATE`作为占位符。现在，我们已经有了基本的文本测试数据，接下来可以配置`grunt-text-replace`来生成每次运行测试时使用的测试数据。\n\
    \n### 待办事项的测试数据\n\n***清单 6-21***. 待办事项的测试数据\n\n```\n[\n  {\n    \"title\": \"\
    Past Item\",\n    \"date\": \"2011-05-26T07:56:00.123Z\"\n  },\n  {\n    \"title\"\
    : \"Future item 1\",\n    \"date\": \"FUTURE_DATE\"\n  },\n  {\n    \"title\"\
    : \"Future item 2\",\n    \"date\": \"FUTURE_DATE\"\n  }\n]\n```\n\n### 配置`grunt-text-replace`以动态生成测试日期\n\
    \n清单 6-22 包含了`grunt-text-replace`的任务配置。该配置包含源文件夹、目标文件夹以及一个替换数组。该插件支持简单的文本替换、正则表达式替换，或者像本例中一样，使用函数来替换源文件中的文本。替换完成后，修改后的文本将输出到目标文件夹，并保留与原文件相同的文件名。在我们的示例中，文件从`build/fixtures`读取，然后写入`tests/fixtures`。\n\
    \n***清单 6-22***. 配置`grunt-text-replace`以动态生成测试日期\n\n```\nreplace: {\n  fixtures:\
    \ {\n    src: ['build/fixtures/*.json'],\n    dest: 'tests/fixtures/',\n    replacements:\
    \ [{\n      from: 'FUTURE_DATE',\n      to: function () {\n        var today =\
    \ new Date();\n        return new Date(today.getFullYear() + 1, today.getMonth(),\
    \ today.getDate())\n      }\n    }]\n  }\n}\n```\n\n现在，`grunt-text-replace`已经配置了目标和任务，我们可以像使用其他任何`grunt`插件一样，通过`grunt-cli`的`npm`包来运行它。不幸的是，`grunt-text-replace`默认不会提供关于读取或写入文件的任何反馈。要查看运行任务时哪些文件被写入，可以使用\
    \ Grunt 的`verbose`标志，如清单 6-23 所示。使用`verbose`标志将生成类似于图 6-10 的输出。\n\n![9781484200148_Fig06-10.jpg](img/00048.jpeg)\n\
    \n图 6-10. 启用`verbose`标志运行`grunt-text-replace`的示例输出\n\n***清单 6-23***. 使用`verbose`标志输出`grunt-text-replace`生成的文件\n\
    \n```\ngrunt replace –v\n```\n\n### 应用动态数据生成\n\n现在我们已经拥有一组动态测试数据，接下来可以编写一个模块来处理待办事项列表。我们将使用\
    \ Backbone 库中的一个模块——`Collection`。`Collection`提供了一种方便的方式来处理一个或多个模型，追踪一组项目中的变化，并对这些项目应用函数。清单\
    \ 6-24 包含了一个新的待办事项集合的完整可运行示例。\n\n### 用于处理多个待办事项的 Backbone 集合\n\n***清单 6-24***.\
    \ 用于处理多个待办事项的 Backbone 集合\n\n```\n'use strict';\n\nvar _ = require('underscore');\n\
    var Todo = require('../models/todo');\nvar Backbone = require('backbone');\n\n\
    module.exports = Backbone.Collection.extend({\n\nmodel: Todo,\n\nactiveItems:\
    \ function () {\n    return _.filter(this.models, function(item) { return !item.hasExpired();\
    \ });\n  },\n\nexpiredItems: function () {\n    return _.filter(this.models, function(item)\
    \ { return item.hasExpired(); });\n  }\n});\n```\n\n如清单 6-24 所示，我们的集合期望接收一个`Todo`模块的实例作为模型。该集合还包含两个用于过滤集合的函数：第一个用于查找所有活跃项目，第二个用于查找集合中所有已过期的项目。为了验证函数是否按预期工作，我们可以在`tests/collections`中创建一个新的测试模块。与我们的第一个测试一样，该文件的名称应与被测试的模块相同，但以`_test`作为后缀。\n\
    \n### 待办事项集合的测试模块\n\n清单 6-25 包含了`todos_test.js`的内容，即对我们集合的测试。该集合有三个测试：一个用于确认集合使用了正确的模型，另一个用于验证我们可以按活跃项目过滤集合，最后一个用于过滤集合中的过期项目。测试模块的一个重要部分是突出显示在每个测试之前执行的`setUp`函数。该函数用于加载测试数据。请注意，我们从`tests`文件夹内加载测试数据文件，因此使用的是由`grunt-text-replace`生成的数据。这些数据随后被加载到待办事项集合中，然后在每个测试中使用。\n\
    \n***清单 6-25***. 待办事项集合的测试模块\n\n```\n'use strict';\n\nexports.todos = {\n  setUp:\
    \ function (done) {\n    var data = require('../fixtures/todos');\n    var Todos\
    \ = require('../../app/js/collections/todos');\n\nthis.todos = new Todos(data);\n\
    \    done();\n  },\n\ncollection_has_model_of_todo: function (test) {\n    var\
    \ Todo = require('../../app/js/models/todo');\n    test.equal(this.todos.model,\
    \ Todo);\n    test.done();\n  },\n\ncollection_can_filter_active_items: function\
    \ (test) {\n    test.equal(this.todos.activeItems().length, 2);\n    test.done();\n\
    \  },\n\ncollection_can_filter_expired_items: function (test) {\n    test.equal(this.todos.expiredItems().length,\
    \ 1);\n    test.done();\n  }\n};\n```\n\n运行`grunt-contrib-nodeunit`任务应生成与图 6-11\
    \ 相同的输出。\n\n![9781484200148_Fig06-11.jpg](img/00049.jpeg)\n\n图 6-11. 同时运行集合和模型测试的`grunt-contrib-nodeunit`\n\
    \n将一套测试与一组通过时间动态修改的可靠测试数据相结合，会变得非常宝贵，尤其是在时间紧迫、错误容易潜入项目的情况下。除了单元级别的测试，我们还可以开始探索更高级别的测试。我们可以在浏览器中测试应用——实际上，可以在多个浏览器中测试。在下一节中，我将介绍一个新的\
    \ Grunt 插件，它可以帮助我们自动化这一过程。\n\n### 在浏览器中测试\n\n对更高级、性能更佳的 Web 应用的需求日益增长。作为开发者，我们通过在浏览器中构建高度交互和复杂的应用来回应这一需求。页面通常运行着大量的\
    \ JavaScript 代码。到目前为止，我们进行的测试都完全在 Node 环境中运行。在本节中，我们将编写可以在浏览器中运行的测试。这将确保我们的生产代码能够在最接近用户最终使用环境的环境中运行。借助自动化工具的强大功能，我们可以在多个浏览器中运行测试，这有助于验证应用的稳定性。\n"
- fmt: "# 使用 Karma 测试运行器\n\n在本节中，我们将探索使用一个名为 `Karma` 的新测试运行器。流行前端框架 `AngularJS` 背后的团队开发了\
    \ `Karma`。`Karma` 项目旨在使测试驱动开发更简单、更快速，同时允许开发人员在真实的浏览器中运行测试。`Karma` 可用于在本地开发和持续集成环境中运行测试。`Karma`\
    \ 不是一个测试框架，而是一个测试运行器，因此它可以轻松地与流行的 `JavaScript` 测试框架（如 `Jasmine`、`Mocha` 等）集成。在撰写本文时，`Karma`\
    \ 支持在以下浏览器中运行测试：`Chrome`、`Firefox`、`Safari`、`PhantomJS`、`Opera`、`IE`、`BrowserStack`\
    \ 等。`Karma` 的核心团队还开发了一个 `Grunt` 插件，用于轻松地将 `Karma` 与你的构建流程集成。该插件名为`grunt-karma`。\n\
    \n## 配置 Karma 测试运行器\n\n首先，让我们安装 `grunt` 插件并将其添加到我们的项目中。[清单 6-26](#part0013.html#list26)\
    \ 演示了如何安装新插件，[清单 6-27](#part0013.html#list27) 包含了要添加到`Gruntfile.js`中的配置。\n\n[***清单\
    \ 6-26***](#part0013.html#_list26). 安装`grunt-karma`\n\n```\nnpm install --save-dev\
    \ grunt-karma\n```\n\n[***清单 6-27***](#part0013.html#_list27). `grunt-karma`的\
    \ Grunt 配置\n\n```\nkarma: {\n  all: {\n    configFile: 'tests/karma.conf.js'\n\
    \  }\n}\n```\n\n`grunt-karma`插件允许你选择如何定义任务配置。它允许你定义一个配置文件或作为 Grunt 选项的特定配置。在我们的配置中，如[清单\
    \ 6-27](#part0013.html#list27) 所示，我们选择使用配置文件。也可以通过指定目标中的选项来覆盖配置文件。例如，你可以在配置文件中定义通用配置，并在持续集成环境中运行测试时覆盖特定配置。[清单\
    \ 6-28](#part0013.html#list28) 包含了将保存在`karma.conf.js`文件中的配置。\n\n[***清单 6-28***](#part0013.html#_list28).\
    \ Karma 配置文件\n\n```\n'use strict';\n\nmodule.exports = function(config) {\n  config.set({\n\
    \    files: [\n      'tests/main.js',\n      {pattern: 'app/js/**/*.js', included:\
    \ false},\n      {pattern: 'tests/specs/**/*.js', included: false},\n      {pattern:\
    \ 'tests/fixtures/**/*.js', included: false}\n    ],\n    basePath: '../',\n \
    \   frameworks: ['jasmine', 'requirejs'],\n    reporters: ['progress'],\n\nrunnerPort:\
    \ 9000,\n    singleRun: false,\n    browsers: ['PhantomJS', 'Firefox'],\n    logLevel:\
    \ 'ERROR'\n  });\n};\n```\n\n配置文件包含要加载到浏览器中的文件设置，以及用于解析文件的基础路径。下一个配置指定了要使用的测试框架以及如何报告测试结果。最后一组选项配置\
    \ `Karma` 在端口 9000 上运行本地 Web 服务器，并在 `PhantomJS` 和 `Firefox` 浏览器中运行测试。\n\n在使用 `Karma`\
    \ 运行测试之前，我们必须安装额外的 `npm` 包，其中包含让 `Karma` 与我们选择的浏览器和测试框架集成的插件。[清单 6-29](#part0013.html#list29)\
    \ 包含了成功运行 `Karma` 之前需要安装的所有包。\n\n[***清单 6-29***](#part0013.html#_list29). 安装额外插件以支持我们的\
    \ Karma 测试\n\n```\nnpm install --save-dev karma-jasmine karma-requirejs karma-phantomjs-launcher\
    \ karma-firefox-launcher\n```\n\n如果我们现在尝试运行`grunt-karma`任务，我们应该会看到一个浏览器窗口启动，并加载一个类似于[图\
    \ 6-12](#part0013.html#Fig12) 所示的页面。接下来，我们必须添加一个额外的文件来配置我们的测试运行器以与 `RequireJS`\
    \ 配合使用，从而提供将应用程序和测试模块作为 AMD 模块加载的能力。[清单 6-30](#part0013.html#list30) 演示了新文件`test/main.js`。当\
    \ `Karma` 加载页面时，该文件将首先被加载。它负责配置 `RequireJS` 以拥有正确的路径。因此，当一个模块请求它依赖的另一个模块时，`RequireJS`\
    \ 知道正确的 `require` 路径。\n\n![9781484200148_Fig06-12.jpg](images/00050.jpeg)\n\n\
    [图 6-12](#part0013.html#_Fig12). 在浏览器中启动 Karma\n\n[***清单 6-30***](#part0013.html#_list30).\
    \ 支持使用 Karma 的 RequireJS 和 AMD 模块的配置\n\n```\nvar allTestFiles = [];\nvar TEST_REGEXP\
    \ = /(spec|test)\\.js$/i;\n\nvar pathToModule = function(path) {\n  return path.replace(/^\\\
    /base\\//, '').replace(/\\.js$/, '');\n};\n\nObject.keys(window.__karma__.files).forEach(function(file)\
    \ {\n  if (TEST_REGEXP.test(file)) {\n    // Normalize paths to RequireJS module\
    \ names.\n    allTestFiles.push(pathToModule(file));\n  }\n});\n\nrequire.config({\n\
    \  // Karma serves files under /base, which is the basePath from your config file\n\
    \  baseUrl: '/base',\n\n// dynamically load all test files\n  deps: allTestFiles,\n\
    \n// we have to kickoff jasmine, as it is asynchronous\n  callback: window.__karma__.start,\n\
    \npaths: {\n    'jquery': 'app/bower_components/jquery/dist/jquery',\n    'backbone':\
    \ 'app/bower_components/backbone/backbone',\n    'underscore': 'app/bower_components/underscore/underscore',\n\
    \    'fixtures': 'test/fixtures'\n  }\n});\n```\n\n## 修改我们的应用程序以使用 AMD\n\n既然我们已经有了支持运行测试的配置，我们应该能够开始编写和运行测试了。重新运行\
    \ `grunt` 任务，然后点击页面右上角的 `Debug` 按钮，应该可以让你检查测试文件是否按预期加载。[图 6-13](#part0013.html#Fig13)\
    \ 说明了此时你将看到的示例调试页面。现在测试运行器已在浏览器中正确加载，你应该会在控制台中注意到一条消息，表明没有测试被跳过。此时，是时候开始添加测试来验证我们的应用程序是否按预期工作了。我们将重新审视上一节中为\
    \ Todo 模块编写的测试。这一次，Todo 模块将被封装为一个 AMD 模块。完成的模块如[清单 6-31](#part0013.html#list31)\
    \ 所示。\n\n![9781484200148_Fig06-13.jpg](images/00051.jpeg)\n\n[图 6-13](#part0013.html#_Fig13).\
    \ 在浏览器中调试 Karma 测试\n\n[清单 6-31](#part0013.html#list31) 和[6-32](#part0013.html#list32)\
    \ 包含了待办事项项及其关联的测试。这些实现与上一节所示的类似。这些文件的唯一区别在于它们是 AMD 模块，并且使用 `Jasmine` 测试框架而不是 `nodeunit`。再次运行测试将导致所有三个测试通过。`Karma`\
    \ 会将测试结果输出到控制台，如果你选择在浏览器中调试测试，也会输出到浏览器中。[图 6-14](#part0013.html#Fig14) 包含了控制台中`grunt-karma`的输出。你可能已经注意到，当你对应用程序或测试文件进行更改时，`grunt-karma`\
    \ 将自动重新运行测试。每次 `Karma` 运行时，它都会在配置中包含的所有浏览器中运行测试，并报告任何给定浏览器中的错误（参见[图 6-15](#part0013.html#Fig15)）。\n\
    \n[***清单 6-31***](#part0013.html#_list31). 作为 AMD 模块封装的 Todo 模块\n\n```\ndefine(['backbone'],\
    \ function(Backbone) {\n  'use strict';\n\nreturn Backbone.Model.extend({\n  \
    \  defaults: {\n      'title': '',\n      'date': '19/02/2015',\n      'complete':\
    \ false\n    },\n\ncomplete: function () {\n      this.set('complete', true);\n\
    \    }\n  });\n});\n```"
  raw: 'In this section, we’ll explore using a new test runner called Karma. The team
    behind the popular front-end framework AngularJS developed Karma. The Karma project
    aims to make test-driven development easier and fast, while allowing developers
    to run tests in real browsers. Karma can be used to run tests in local development
    and in a continuous integration environment. Karma is not a testing framework,
    but a test runner, and, therefore, integrates easily with popular JavaScript test
    frameworks such as Jasmine, Mocha, and many others. At the time of writing, Karma
    has support for running tests in the following browsers: Chrome, Firefox, Safari,
    PhantomJS, Opera, IE, BrowseStack, and many others. The core team behind Karma
    has also developed a Grunt plug-in for easily integrating Karma with your build
    process. The plug-in is named grunt-karma.


    Configuring Karma Test Runner


    To get started, let’s install the grunt plug-in and add it to our project. [Listing
    6-26](#part0013.html#list26) demonstrates how to install the new plug-in, and
    [Listing 6-27](#part0013.html#list27) contains the configuration to be added to
    our Gruntfile.js.


    [***Listing 6-26***](#part0013.html#_list26). Installing grunt-karma


    ```

    npm install --save-dev  grunt-karma

    ```


    [***Listing 6-27***](#part0013.html#_list27). Grunt Configuration for grunt-karma


    ```

    karma: {

      all: {

        configFile: ''tests/karma.conf.js''

      }

    }

    ```


    The grunt-karma plug-in allows you to choose how to define your task configuration.
    It allows you to define a configuration file or specific configuration as Grunt
    options. In our configuration, in [Listing 6-27](#part0013.html#list27), we’ve
    opted to use a configuration file. The configuration file can also be overridden
    by specifying options within a target. For example, you can define common configuration
    in the configuration file and override particular configuration when running your
    tests within a continuous integration environment. [Listing 6-28](#part0013.html#list28)
    contains the configuration that will be kept within the karma.conf.js file.


    [***Listing 6-28***](#part0013.html#_list28). Karma Configuration File


    ```

    ''use strict'';


    module.exports = function(config) {

      config.set({

        files: [

          ''tests/main.js'',

          {pattern: ''app/js/**/*.js'', included: false},

          {pattern: ''tests/specs/**/*.js'', included: false},

          {pattern: ''tests/fixtures/**/*.js'', included: false}

        ],

        basePath: ''../'',

        frameworks: [''jasmine'', ''requirejs''],

        reporters: [''progress''],


    runnerPort: 9000,

        singleRun: false,

        browsers: [''PhantomJS'', ''Firefox''],

        logLevel: ''ERROR''

      });

    };

    ```


    The configuration file contains settings for which files to load into the browser
    and the base path to use to resolve the files. The next configuration specifies
    the test frameworks to be used and how to report the results of the tests. The
    last set of options configures Karma to run a local web server on port 9000, and
    to run the tests in the browsers PhantomJS and Firefox.


    Before we can run our tests using Karma, we have to install additional npm packages
    that contain the plug-ins for Karma to integrate with our chosen browsers and
    test frameworks. [Listing 6-29](#part0013.html#list29) contains all the packages
    will need to be installed before we can run Karma successfully.


    [***Listing 6-29***](#part0013.html#_list29). Installing Additional Plug-ins to
    Support Our Karma Tests


    ```

    npm install --save-dev karma-jasmine karma-requirejs karma-phantomjs-launcher
    karma-firefox-launcher

    ```


    If we try to run the grunt-karma task now, we should see a browser window launch
    and a page similar to the one shown in [Figure 6-12](#part0013.html#Fig12) loaded.
    Next, we must add an additional file to configure our test runner to work with
    RequireJS, providing the ability to load our application and test modules as AMD
    modules. [Listing 6-30](#part0013.html#list30) demonstrates the new file test/main.js.
    This file will be loaded first when Karma loads the page. It is responsible for
    configuring RequireJS to have the correct paths. Therefore, when a module requests
    another module it depends on, RequireJS knows the correct path to require.


    ![9781484200148_Fig06-12.jpg](images/00050.jpeg)


    [Figure 6-12](#part0013.html#_Fig12). Launching Karma in a browser


    [***Listing 6-30***](#part0013.html#_list30). Configuration to Support RequireJS
    and AMD Modules with Karma


    ```

    var allTestFiles = [];

    var TEST_REGEXP = /(spec|test)\.js$/i;


    var pathToModule = function(path) {

      return path.replace(/^\/base\//, '''').replace(/\.js$/, '''');

    };


    Object.keys(window.__karma__.files).forEach(function(file) {

      if (TEST_REGEXP.test(file)) {

        // Normalize paths to RequireJS module names.

        allTestFiles.push(pathToModule(file));

      }

    });


    require.config({

      // Karma serves files under /base, which is the basePath from your config file

      baseUrl: ''/base'',


    // dynamically load all test files

      deps: allTestFiles,


    // we have to kickoff jasmine, as it is asynchronous

      callback: window.__karma__.start,


    paths: {

        ''jquery'': ''app/bower_components/jquery/dist/jquery'',

        ''backbone'': ''app/bower_components/backbone/backbone'',

        ''underscore'': ''app/bower_components/underscore/underscore'',

        ''fixtures'': ''test/fixtures''

      }

    });

    ```


    Modifying Our Application to Use AMD


    Now that we have the configuration in place to support running our tests, we should
    be able to start writing and running tests. Rerunning the grunt task and then
    clicking the Debug button at the top right-hand corner of the page should allow
    you to check whether your test files are loading as expected. [Figure 6-13](#part0013.html#Fig13)
    illustrates a sample debug page that you will see at this point. Now that the
    test runner is loading correctly in the browser, you should notice a message in
    the console stating that no tests have been skipped. At this point, it is time
    to start adding tests to verify that our application is working as expected. We
    will revisit the tests written in the previous section for the Todo module. This
    time, the Todo module will be wrapped as an AMD module. The completed module is
    shown in [Listing 6-31](#part0013.html#list31).


    ![9781484200148_Fig06-13.jpg](images/00051.jpeg)


    [Figure 6-13](#part0013.html#_Fig13). Debugging Karma tests in the browser


    [Listings 6-31](#part0013.html#list31) and [6-32](#part0013.html#list32) contain
    the to-do item and associated tests. These are of similar implementation, as shown
    in the previous section. These files differ only in that they are AMD modules
    and use the Jasmine test framework instead of nodeunit. Running the tests again
    will result in all three tests passing. Karma will output the test results to
    the console and also in the browser, if you have chosen to debug the tests in
    the browser. [Figure 6-14](#part0013.html#Fig14) contains the output from grunt-karma
    in the console. You may have noticed that as you make changes to your application
    or test files, grunt-karma will automatically rerun the tests. Each time Karma
    runs, it runs the tests in all the browsers contained in the configuration and
    reports any errors within a given browser (see [Figure 6-15](#part0013.html#Fig15)).


    [***Listing 6-31***](#part0013.html#_list31). Todo Module Wrapped As an AMD Module


    ```

    define([''backbone''], function(Backbone) {

      ''use strict'';


    return Backbone.Model.extend({

        defaults: {

          ''title'': '''',

          ''date'': ''19/02/2015'',

          ''complete'': false

        },


    complete: function () {

          this.set(''complete'', true);

        }

      });

    });

    ```'
