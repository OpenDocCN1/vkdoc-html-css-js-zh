    Rake does not have a concept of task configuration. Instead, it opts for tasks
    that define and execute Ruby to achieve its goals. For example, there are no repositories
    of recipes or plug-ins available to perform common tasks. If you want to concatenate
    and lint your JavaScript, you will have to start from scratch and write your task
    before you can use it. This will obviously make it more costly to get started
    on your projects, as Rake doesn’t offer anything up front. It is up to you to
    ensure that your tasks are highly configurable to increase reuse across projects.


    Grunt solves the problem of having to reinvent the wheel by offering a wide selection
    of plug-ins. In addition, Grunt also promotes the concept of configuration over
    code, by providing a rich API for supporting task configuration.


    Gulp


    Gulp is a relatively new tool that is, like Grunt, JavaScript-based. Another similarity
    between Grunt and Gulp is the modular-based architecture, powered by the use of
    npm as a dependency manager. Gulp, like Grunt, is easy to get started; however,
    arguably, Gulp has more succinct task definition, as tasks are expressed in code
    instead of configuration.


    There have been several blog posts that pit Grunt and Gulp against each other.
    However, there have also been counter arguments stating that both tools can coexist,
    owing to differences in how they achieve a common set of goals. Gulp is faster
    than Grunt, yet the barrier to entry is a little higher, due to its use of Node
    streams.


    ![Image](images/00006.jpeg) **Note**  Grunt combines tasks in which the output
    of one task produces a temporary file that is picked up by the next task for processing.
    Gulp doesn’t produce these temporary files; files are piped between each task.


    Summary


    In this chapter, you’ve received a basic overview of what Grunt is and how projects
    can benefit from using it. You’ve also explored how Grunt compares to similar
    alternatives available. This book should provide you with an understanding of
    how to set up and use Grunt on your projects, allowing you to rapidly lint, test,
    and optimize your applications.


    CHAPTER 2


    ![image](images/00005.jpeg)


    How to Use Grunt in Your Project


    In the previous chapter, you received a brief introduction to Grunt and the benefits
    of using Grunt in your projects. This chapter will take a more detailed look at
    Grunt, how to install Grunt, and how to use Grunt in your projects. Before looking
    at Grunt itself, it is important to have a good understanding of Node.js. Grunt
    is built on top of Node.js, so having a good understanding of Node.js and how
    modules operate within Node.js will make learning and understanding Grunt easier.


    Node.js


    Node.js is an application platform that allows developers to implement event-driven
    applications built on top of Chrome’s JavaScript engine, V8\. As many of you will
    know, JavaScript originated as a client-side language; it was used to implement
    interactive interfaces. Node.js utilizes JavaScript as a scripting language on
    the server side and achieves high scalability through non-blocking I/O operations.
    To achieve non-blocking I/O operations, Node.js applications use asynchronous
    execution, whereas, traditionally, applications execute code in a given sequence.
    Non-blocking I/O is a process that allows other processing to continue while waiting
    for a response from an expensive I/O operation. For example, if a Node.js application
    sends a request to a remote HTTP service for data, it does not wait for a response
    before processing other requests. Upon the request being sent to the remote HTTP
    service, the Node.js application will continue to process other requests before
    returning to the original routine, once the remote HTTP service has responded.
    This ability to continue processing other requests while waiting for I/O operations
    can provide significant performance improvements.'
