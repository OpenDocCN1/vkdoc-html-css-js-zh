  raw: '[Figure 7-10](#part0014.html#_Fig10). LiveReload button for enabling LiveReload
    within our application


    The ability to automatically reload assets in the browser is powerful. It can
    reduce the need to leave your favorite text editor, as the browser will continue
    to refresh itself in the background, so that you can instantly see the outcome
    of your changes. As stated in the beginning of this section, grunt-contrib-watch
    does not reduce the execution time of our tasks, but it does speed up our workflow
    by automating loading of refreshed assets.


    Continuous Integration


    Now that we’ve reduced the feedback loop on our Grunt tasks by reducing the execution
    time and improved the time taken for changes to make it into the browser, I’ll
    next introduce a final step to improve our Grunt workflow. Throughout the book
    I’ve mentioned the use of continuous integration. In this section, we’ll introduce
    this into our workflow. Although it isn’t strictly a part of the Grunt workflow,
    it can—andshould—form part of your development workflow. There are a number of
    continuous integration solutions available, including Jenkins, AppVeyor, and Travis.
    We’ll be focusing on Travis CI, as it offers free open source build environments
    for open source projects. One of the easiest ways to integrate with Travis CI
    is to host your project on github.com. The site offers free hosting for open source
    projects. GitHub allows you to define a post commit hook that will trigger a build
    of your application on Travis CI. [Figure 7-11](#part0014.html#Fig11) shows a
    screen from travis.org. This screen allows you to toggle which repositories should
    build on Travis CI.


    ![9781484200148_Fig07-11.jpg](images/00067.jpeg)


    [Figure 7-11](#part0014.html#_Fig11). Integrating Travis CI with GitHub repository


    Toggle the repository to “”ON.” Now that the service has been added to the GitHub
    repository, we have to add a file to the project to test Travis CI, specify which
    build environments we want to test our project in, determine what commands have
    to be run to build, and test our application. This file is a YAML file stored
    within the root of the project and called .travis.yml. [Listing 7-30](#part0014.html#list30)
    contains the contents of the .travis.yml.


    [***Listing 7-30***](#part0014.html#_list30). .travis.yml Configuration for Travis
    CI


    ```

    language: node_js

    node_js:

      - "0.10"


    addons:

      firefox: "17.0"


    before_script:

      - npm install -g bower grunt-cli

      - bower install

      - export DISPLAY=:99.0

      - sh -e /etc/init.d/xvfb start

    ```


    The .travis.yml configuration defines a number of properties for our project.
    First, the language of Node is defined, as we will be running our application
    within a Node environment. Next, we specify the version of Node we want to run.
    In this instance, we’ve chosen the latest stable version, 0.10\. The next line
    defines an addon of the Firefox version 17.0 browser. We will be using Firefox
    to run our tests within the continuous integration environment. The next set of
    options defines a set of commands to run before our application is installed.
    The first line installs bower and grunt-cli Node modules that will be used to
    build our application. The next line is used to install front-end components for
    our applications. The third and fourth lines are used to configure a headless
    browser known as PhantomJS.


    Now that we’ve completed the integration of Travis CI, every commit that is pushed
    to GitHub will trigger a build on Travis CI, and you will receive notification
    if the build fails. To ensure that tests run successfully, we have to ensure that
    our package.json file contains the correct test command. [Listing 7-31](#part0014.html#list31)
    contains the modified package.json.


    [***Listing 7-31***](#part0014.html#_list31). Adding Grunt Test to Our package.json


    ```

    {

      "engines": {

        "node": ">= 0.10.0"

      },

      "devDependencies": {

        ...

      },

      "scripts": {

        "test": "grunt test"

      }

    }

    ```'
  trans: "\n# 7-10. LiveReload 按钮：在应用程序中启用 LiveReload\n\n在浏览器中自动重新加载资产的能力非常强大。它可以减少你离开最喜爱的文本编辑器的需求，因为浏览器会在后台持续刷新自身，从而使你能够即时看到更改的结果。如本节开头所述，`grunt-contrib-watch`\
    \ 并不会缩短我们任务的执行时间，但通过自动加载刷新后的资产，它能够加快我们的工作流程。\n\n## 持续集成\n\n目前，我们通过缩短执行时间缩减了 Grunt\
    \ 任务的反馈循环，并缩短了更改在浏览器中生效所需的时间。接下来，我将介绍改善 Grunt 工作流程的最后一步。在本书中，我提到了持续集成的使用。在本节中，我们将把它引入到工作流程中。虽然严格来说，它并非\
    \ Grunt 工作流程的一部分，但它可以——并且应当——成为你开发工作流程的一部分。有许多可用的持续集成解决方案，包括 `Jenkins`、`AppVeyor`\
    \ 和 `Travis`。我们将重点介绍 `Travis CI`，因为它为开源项目提供了免费的开放源代码构建环境。\n\n与 `Travis CI` 集成的最简单方法之一是将你的项目托管在\
    \ `github.com` 上。该网站为开源项目提供免费托管。`GitHub` 允许你定义一个提交后钩子，该钩子将在 `Travis CI` 上触发应用程序的构建。图\
    \ 7-11 显示了来自 `travis.org` 的一个屏幕。此屏幕允许你切换哪些仓库应在 `Travis CI` 上进行构建。\n\n![9781484200148_Fig07-11.jpg](img/00067.jpeg)\n\
    \n# 7-11. 将 Travis CI 与 GitHub 仓库集成\n\n将仓库切换为“开启”。现在，服务已添加到 `GitHub` 仓库，我们需要在项目中添加一个文件来测试\
    \ `Travis CI`，指定要在其上测试项目的构建环境，并确定需要运行哪些命令来构建和测试我们的应用程序。此文件是一个 `YAML` 文件，存储在项目的根目录中，名为\
    \ `.travis.yml`。清单 7-30 包含了 `.travis.yml` 的内容。\n\n## 清单 7-30. Travis CI 的 `.travis.yml`\
    \ 配置\n\n```\nlanguage: node_js\nnode_js:\n  - \"0.10\"\n\naddons:\n  firefox:\
    \ \"17.0\"\n\nbefore_script:\n  - npm install -g bower grunt-cli\n  - bower install\n\
    \  - export DISPLAY=:99.0\n  - sh -e /etc/init.d/xvfb start\n```\n\n`.travis.yml`\
    \ 配置为我们的项目定义了许多属性。首先，定义了 `Node` 的语言，因为我们将在 `Node` 环境中运行应用程序。接下来，我们指定要运行的 `Node`\
    \ 版本。在此示例中，我们选择了最新的稳定版本 `0.10`。下一行定义了 `Firefox` 浏览器版本 `17.0` 的附加组件。我们将使用 `Firefox`\
    \ 在持续集成环境中运行测试。再下一组选项定义了一组在安装应用程序之前要运行的命令。第一行安装了用于构建应用程序的 `bower` 和 `grunt-cli`\
    \ `Node` 模块。下一行用于安装我们应用程序的前端组件。第三行和第四行用于配置一个名为 `PhantomJS` 的无头浏览器。\n\n现在我们已经完成了\
    \ `Travis CI` 的集成，每次推送到 `GitHub` 的提交都会在 `Travis CI` 上触发一次构建，如果构建失败，你将收到通知。为了确保测试成功运行，我们必须确保我们的\
    \ `package.json` 文件包含正确的测试命令。清单 7-31 包含了修改后的 `package.json`。\n\n## 清单 7-31. 将\
    \ Grunt 测试添加到我们的 `package.json`\n\n```\n{\n  \"engines\": {\n    \"node\": \"\
    >= 0.10.0\"\n  },\n  \"devDependencies\": {\n    ...\n  },\n  \"scripts\": {\n\
    \    \"test\": \"grunt test\"\n  }\n}\n```\n"
- fmt: '# The importance of the package.json here is the scripts section of the file.
    Travis CI runs the test script when building the application. Therefore, it is
    important to run the correct Grunt task. With this final change, our project is
    now ready for building on Travis CI. Every time you make a change to the project,
    you will have the confidence of knowing that you are not breaking the project
    across multiple environments.


    ## Summary


    Throughout the book we’ve focused on optimizing our application developer workflow
    by continually adding Grunt tasks to solve common problems that we face in every
    web project. In this chapter, we took the opportunity to review our Grunt implementation,
    which had become bloated and unwieldy. We’ve introduced a number of techniques
    to reduce our Grunt execution time by seconds and improve the structure of task
    configuration, leaving our project in a state that is ready to adapt to our next
    set of challenges.


    This brings our journey through Grunt to an end. I hope you’ve found the book
    helpful and that it has taught you new and interesting ways of using Grunt to
    improve your workflow. In an ever-demanding world in which the continuous release
    of new features in software is the norm, we have to help ourselves by using tools
    that automate and simplify tasks, to allow us to focus on the more difficult problems.
    Grunt is a powerful and flexible tool that can be used to automate any number
    of tasks, and if there isn’t a plug-in available for your specific need, then
    a rich API provided by Grunt makes writing plug-ins simple.


