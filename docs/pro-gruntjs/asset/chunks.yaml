    \ with an additional qualifier to return plug-ins for a particular task. For example,\
    \ to search for Grunt plug-ins associated with PHP, the following search can be\
    \ performed:\n\n```\nnpm search gruntplugin php\n```\n\nOnce you’ve found the\
    \ package you’re looking for, you have to install it. You’ll see in the next section\
    \ how `npm` makes this process trivial.\n\n## Installing Modules\n\n`npm` offers\
    \ a very simple method for installing Node.js packages from the following locations:\n\
    \n*   Registry using the package name\n*   From a tarball file stored locally\n\
    *   From a tarball URL\n*   From a folder\n*   For example, to install `request`,\
    \ the popular Node.js HTTP client, use the following command:\n\n```\nnpm install\
    \ request\n```\n\nThis will begin to install the `request` package into a folder,\
    \ `node_modules`, inside the current directory. Inside the `node_modules` folder,\
    \ `npm` will also install the dependencies that `request` requires. As part of\
    \ the installation process, `npm` will list all the packages it is attempting\
    \ to install. As `request` installs, your command-line interface should look similar\
    \ to the output in [Figure 2-4](#part0009.html#Fig4).\n\n![9781484200148_Fig02-04.jpg](images/00010.jpeg)\n\
    \n[Figure 2-4](#part0009.html#_Fig4). Using `npm` to install the package called\
    \ `request`\n\n## Modules\n\nAs seen in the preceding figure, it is relatively\
    \ easy to discover and install new packages with `npm`. Before starting our exploration\
    \ into the use of Grunt, it is important to understand what a Node.js module consists\
    \ of.\n\nThe Node.js module system is an implementation the CommonJS module system.\
    \ The CommonJS specification was devised to address how JavaScript modules should\
    \ be written to improve interoperability. It aims to bridge the gap that JavaScript\
    \ does not currently solve, by allowing developers to create clearly defined modules\
    \ that can be shared across projects.\n\nIn the simplest of forms, a module is\
    \ a JavaScript file. Node.js provides the ability for developers to include the\
    \ JavaScript defined in one file into another and use its functionality. The simplest\
    \ module is as follows:\n\n```\nexports.test = \"value\";\n```\n\nThe preceding\
    \ can be saved in a file titled `something.js` and defines a single property for\
    \ the module `test`. This could then be reused as follows:\n\n```\nvar mod = require('./something');\n\
    console.log(mod.test);\n```\n\nIn the preceding code sample, we’re including the\
    \ module `something` and referencing the module as `mod` locally. We can then\
    \ use the property `test` within our application by referencing it on `mod`. The\
    \ preceding application will output the string value to the command line.\n\n\
    As you can see, inside the module there is a JavaScript object called `exports`.\
    \ As Node.js includes a module, it creates a new context and injects the `exports`\
    \ object. The `exports` object is then returned as part of a call to `require`.\
    \ To expose any functionality publically as part of a Node.js module, properties\
    \ can be assigned to the `exports` object. Let’s take a look at another example\
    \ ([Listing 2-1](#part0009.html#list1)) with a module that exposes a function.\n\
    \n[***Listing 2-1***](#part0009.html#_list1). Exporting a Function As Part of\
    \ a Node.js Module\n\n```\nexports.add = function(a, b) {\n  return a + b;\n};\n\
    ```\n\nThe preceding module, when saved as `something.js`, can then be used as\
    \ follows ([Listing 2-2](#part0009.html#list2)):\n\n[***Listing 2-2***](#part0009.html#_list2).\
    \ Calling a Function from an Imported Module\n\n```\nvar simple = require('./something');\n\
    console.log(simple.add(1,2));\n```\n\nRunning this application will output `3`\
    \ to the command line.\n\nThe use of modules also provides the ability to hide\
    \ the implementation of complex functionality within a module while exposing a\
    \ simplified interface for users of the module. Following ([Listing 2-3](#part0009.html#list3))\
    \ is a module that hides the property `display` from users of the module.\n\n\
    [***Listing 2-3***](#part0009.html#_list3). Node.js Module Demonstrating Private\
    \ Variables\n\n```\nvar display = false;\n\nmodule.exports = {\n  isHidden: function()\
    \ {\n     return display === false;\n  },\n  hide: function() {\n     display\
    \ = false;\n  },\n  show: function() {\n     display = true;\n  }\n};\n```\n\n\
    In the preceding example, the module allows a user of this module to manipulate\
    \ the `display` property through the `hide` and `show` methods.\n\nAt this stage,\
    \ you might be wondering how this relates to Grunt. As mentioned earlier, Grunt\
    \ plug-ins are Node.js packages. Grunt plug-ins typically consist of one or more\
    \ modules and often rely on other Node.js packages to achieve their goal. Having\
    \ a good understanding of Node.js, its module system, and how it operates will\
    \ put you in great stead when using Grunt on your projects. Thus far, you’ve seen\
    \ how to load modules relative to the current module. These are known as File\
    \ Modules. In addition to File Modules, modules can be loaded from the `node_modules`\
    \ directory. `node_modules` is the directory with which `npm` will create and\
    \ install your project dependencies when you run the `npm install` command. Let’s\
    \ take a quick look at an example of this.\n\n### Loading Modules from `node_modules`\n\
    \nIn our example, we will once again install the Node.js package called `request`,\
    \ using the following:\n\n```\nnpm install request\n```\n\nOnce `npm` has completed\
    \ the install, you will notice that a new folder has been created in your current\
    \ folder (see [Figure 2-5](#part0009.html#Fig5)). If you open the `node_modules`\
    \ folder, you will see another folder matching the name of the Node.js package\
    \ that has been installed. The `request` folder contains the contents of the `request`\
    \ package.\n\n![9781484200148_Fig02-05.jpg](images/00011.jpeg)\n\n[Figure 2-5](#part0009.html#_Fig5).\
    \ `node_modules` directory created when installing packages locally\n\nNow that\
    \ the package is installed, it is now available for use in our project. Following\
    \ ([Listing 2-4](#part0009.html#list4)) is a sample application that loads the\
    \ `request` module and uses it to make a request for `'http://www.guardian.co.uk'`.\n\
    \n[***Listing 2-4***](#part0009.html#_list4). Loading and Using the `request`\
    \ Module\n\n```\nvar request = require('request');\n\nrequest.get('http://www.guardian.co.uk',\
    \ function(error, response, body) {\n  if (!error && response.statusCode == 200)\
    \ {\n    console.log(body);\n  }\n});\n```\n\nThe preceding sample application\
    \ can be saved to `index.js` alongside the `node_modules` directory. It can then\
    \ be run from the command line, as follows:\n\n```\nnode index.js\n```"
  raw: 'This will return all the Node.js packages that contain the word *grunt* in
    the title, description, author, and/or tags. You will see later in the chapter
    how to define this metadata for a package. The results of your search should look
    similar to those shown in [Figure 2-2](#part0009.html#Fig2), with the search term
    highlighted.


    ![9781484200148_Fig02-02.jpg](images/00008.jpeg)


    [Figure 2-2](#part0009.html#_Fig2). Searching for node packages with npm


    The first time npm search is run against a repository, a local index is built.
    This local index contains a reference to all the packages within the searched
    repository. The local index is intended to speed up future searches but may take
    some time if you run the search command while on a small network.


    The results returned from a search contain the module name and the description
    in columns, respectively. If a search is performed for a particular package author,
    the author column is also displayed. For example, a search for “jrcryer”


    ```

    npm search jrcryer

    ```


    will return all plug-ins written by me (see [Figure 2-3](#part0009.html#Fig3)).


    ![9781484200148_Fig02-03.jpg](images/00009.jpeg)


    [Figure 2-3](#part0009.html#_Fig3). Searching for node packages by author


    The quickest way to find a Grunt plug-in is to search for the tag “gruntplugin.”
    This is the suggested tag that plug-in authors are advised to associate with their
    plug-ins. This tag can be combined with an additional qualifier to return plug-ins
    for a particular task. For example, to search for Grunt plug-ins associated with
    PHP, the following search can be performed:


    ```

    npm search gruntplugin php

    ```


    Once you’ve found the package you’re looking for, you have to install it. You’ll
    see in the next section how npm makes this process trivial.


    Installing Modules


    npm offers a very simple method for installing Node.js packages from the following
    locations:


    *   Registry using the package name

    *   From a tarball file stored locally

    *   From a tarball URL

    *   From a folder

    *   For example, to install request, the popular Node.js HTTP client, use the
    following command:


    ```

    npm install request

    ```


    This will begin to install the request package into a folder, node_modules, inside
    the current directory. Inside the node_modules folder, npm will also install the
    dependencies that request requires. As part of the installation process, npm will
    list all the packages it is attempting to install. As request installs, your command-line
    interface should look similar to the output in [Figure 2-4](#part0009.html#Fig4).


    ![9781484200148_Fig02-04.jpg](images/00010.jpeg)


    [Figure 2-4](#part0009.html#_Fig4). Using npm to install the package called request


    Modules


    As seen in the preceding figure, it is relatively easy to discover and install
    new packages with npm. Before starting our exploration into the use of Grunt,
    it is important to understand what a Node.js module consists of.


    The Node.js module system is an implementation the CommonJS module system. The
    CommonJS specification was devised to address how JavaScript modules should be
    written to improve interoperability. It aims to bridge the gap that JavaScript
    does not currently solve, by allowing developers to create clearly defined modules
    that can be shared across projects.


    In the simplest of forms, a module is a JavaScript file. Node.js provides the
    ability for developers to include the JavaScript defined in one file into another
    and use its functionality. The simplest module is as follows:


    ```

    exports.test = "value";

    ```


    The preceding can be saved in a file titled something.js and defines a single
    property for the module test. This could then be reused as follows:


    ```

    var mod = require(''./something'');

    console.log(mod.test);

    ```


    In the preceding code sample, we’re including the module something and referencing
    the module as mod locally. We can then use the property test within our application
    by referencing it on mod. The preceding application will output the string value
    to the command line.


    As you can see, inside the module there is a JavaScript object called exports.
    As Node.js includes a module, it creates a new context and injects the exports
    object. The exports object is then returned as part of a call to require. To expose
    any functionality publically as part of a Node.js module, properties can be assigned
    to the exports object. Let’s take a look at another example ([Listing 2-1](#part0009.html#list1))
    with a module that exposes a function.


    [***Listing 2-1***](#part0009.html#_list1). Exporting a Function As Part of a Node.js
    Module


    ```

    exports.add = function(a, b) {

      return a + b;

    };

    ```


    The preceding module, when saved as something.js, can then be used as follows
    ([Listing 2-2](#part0009.html#list2)):


    [***Listing 2-2***](#part0009.html#_list2). Calling a Function from an Imported
    Module


    ```

    var simple = require(''./something'');

    console.log(simple.add(1,2));

    ```


    Running this application will output “3” to the command line.


    The use of modules also provides the ability to hide the implementation of complex
    functionality within a module while exposing a simplified interface for users
    of the module. Following ([Listing 2-3](#part0009.html#list3)) is a module that
    hides the property display from users of the module.


    [***Listing 2-3***](#part0009.html#_list3). Node.js Module Demonstrating Private
    Variables


    ```

    var display = false;


    exports = {

      isHidden: function() {

         return display === false;

      },

      hide: function() {

         display = false;

      },

      show: function() {

         display = true;

      }

    };

    ```


    In the preceding example, the module allows a user of this module to manipulate
    the display property through the hide and show methods.


    At this stage, you might be wondering how this relates to Grunt. As mentioned
    earlier, Grunt plug-ins are Node.js packages. Grunt plug-ins typically consist
    of one or more modules and often rely on other Node.js packages to achieve their
    goal. Having a good understanding of Node.js, its module system, and how it operates
    will put you in great stead when using Grunt on your projects. Thus far, you’ve
    seen how to load modules relative to the current module. These are known as File
    Modules. In addition to File Modules, modules can be loaded from the node_modules
    directory. node_modules is the directory with which npm will create and install
    your project dependencies when you run the npm install command. Let’s take a quick
    look at an example of this.


    Loading Modules from node_modules


    In our example, we will once again install the Node.js package called request,
    using the following:


    ```

    npm install request

    ```


    Once npm has completed the install, you will notice that a new folder has been
    created in your current folder (see [Figure 2-5](#part0009.html#Fig5)). If you
    open the node_modules folder, you will see another folder matching the name of
    the Node.js package that has been installed. The request folder contains the contents
    of the request package.


    ![9781484200148_Fig02-05.jpg](images/00011.jpeg)


    [Figure 2-5](#part0009.html#_Fig5). node_modules directory created when installing
    packages locally


    Now that the package is installed, it is now available for use in our project.
    Following ([Listing 2-4](#part0009.html#list4)) is a sample application that loads
    the request module and uses it to make a request for ''[http://www.guardian.co.uk](http://www.guardian.co.uk)''.


    [***Listing 2-4***](#part0009.html#_list4). Loading and Using the request Module


    ```

    var request = require(''request'');


    request.get(''http://www.guardian.co.uk'', function(error, response, body) {

      if (!error && response.statusCode == 200) {

        console.log(body);

      }

    });

    ```


    The preceding sample application can be saved to index.js alongside the node_modules
    directory. It can then be run from the command line, as follows:


    ```

    node index.js

    ```'
  trans: "\n此命令将返回所有在标题、描述、作者和/或标签中包含单词 `grunt` 的 Node.js 包。你将在本章后面了解如何为包定义这些元数据。搜索结果应类似于**图\
    \ 2-2** 所示，其中搜索词会被高亮显示。\n\n![9781484200148_Fig02-02.jpg](img/00008.jpeg)\n\n**图\
    \ 2-2**. 使用 `npm` 搜索 Node 包\n\n首次对仓库运行 `npm search` 时，会构建一个本地索引。该本地索引包含对所搜索仓库中所有包的引用。本地索引旨在加速后续搜索，但如果你在小网络环境下运行搜索命令，可能需要一些时间。\n\
    \n搜索结果会分别以列的形式返回模块名称和描述。如果针对特定包作者进行搜索，还会显示作者列。例如，搜索 `jrcryer`\n\n```\nnpm search\
    \ jrcryer\n```\n\n将返回我编写的所有插件（参见**图 2-3**）。\n\n![9781484200148_Fig02-03.jpg](img/00009.jpeg)\n\
    \n**图 2-3**. 按作者搜索 Node 包\n\n寻找 Grunt 插件最快的方法是搜索标签 `gruntplugin`。这是建议插件作者与他们的插件关联的标签。此标签可与其他限定词结合使用，以返回特定任务的插件。例如，要搜索与\
    \ PHP 相关的 Grunt 插件，可以执行以下搜索：\n\n```\nnpm search gruntplugin php\n```\n\n一旦找到你需要的包，就必须安装它。你将在下一节了解\
    \ `npm` 如何让这一过程变得简单。\n\n## 安装模块\n\n`npm` 提供了一种非常简单的方法，可以从以下位置安装 Node.js 包：\n\n\
    *   使用包名从注册表安装\n*   从本地存储的 tarball 文件安装\n*   从 tarball URL 安装\n*   从文件夹安装\n* \
    \  例如，要安装流行的 Node.js HTTP 客户端 `request`，请使用以下命令：\n\n```\nnpm install request\n\
    ```\n\n这会将 `request` 包安装到当前目录下的 `node_modules` 文件夹中。在 `node_modules` 文件夹中，`npm`\
    \ 还会安装 `request` 所依赖的包。作为安装过程的一部分，`npm` 会列出它尝试安装的所有包。当安装 `request` 时，你的命令行界面应类似于\
    \ **图 2-4** 中的输出。\n\n![9781484200148_Fig02-04.jpg](img/00010.jpeg)\n\n**图 2-4**.\
    \ 使用 `npm` 安装名为 `request` 的包\n\n## 模块\n\n如上图所示，使用 `npm` 发现和安装新包相对容易。在开始探索 Grunt\
    \ 的使用之前，理解 Node.js 模块的构成至关重要。\n\nNode.js 模块系统是 CommonJS 模块系统的一种实现。CommonJS 规范旨在解决如何编写\
    \ JavaScript 模块以提高互操作性的问题。它旨在填补 JavaScript 目前尚未解决的空白，允许开发者创建定义清晰的模块，这些模块可以跨项目共享。\n\
    \n从最简单的形式来看，模块就是一个 JavaScript 文件。Node.js 为开发者提供了将一个文件中定义的 JavaScript 包含到另一个文件中并使用其功能的能力。最简单的模块如下所示：\n\
    \n```\nexports.test = \"value\";\n```\n\n可以将上述内容保存到名为 `something.js` 的文件中，它为 `test`\
    \ 模块定义了一个单一属性。然后可以像下面这样复用：\n\n```\nvar mod = require('./something');\nconsole.log(mod.test);\n\
    ```\n\n在上面的代码示例中，我们包含了 `something` 模块，并在本地将其引用为 `mod`。然后，我们可以通过在 `mod` 上引用 `test`\
    \ 属性，在应用程序中使用该属性。上述应用程序将把字符串值输出到命令行。\n\n如你所见，模块内部有一个名为 `exports` 的 JavaScript\
    \ 对象。当 Node.js 加载一个模块时，它会创建一个新的上下文并注入 `exports` 对象。然后，`exports` 对象作为 `require`\
    \ 调用的一部分被返回。为了将任何功能公开为 Node.js 模块的一部分，可以将属性分配给 `exports` 对象。我们再来看另一个示例（**代码清单\
    \ 2-1**），其中有一个暴露函数的模块。\n\n***代码清单 2-1***. 作为 Node.js 模块的一部分导出函数\n\n```\nexports.add\
    \ = function(a, b) {\n  return a + b;\n};\n```\n\n将上述模块保存为 `something.js` 后，可以像下面这样使用（**代码清单\
    \ 2-2**）：\n\n***代码清单 2-2***. 从导入的模块调用函数\n\n```\nvar simple = require('./something');\n\
    console.log(simple.add(1,2));\n```\n\n运行此应用程序将在命令行输出 `3`。\n\n使用模块还提供了在模块内部隐藏复杂功能实现的能力，同时为模块用户提供简化的接口。下面（**代码清单\
    \ 2-3**）是一个向模块用户隐藏 `display` 属性的模块。\n\n***代码清单 2-3***. 演示私有变量的 Node.js 模块\n\n\
    ```\nvar display = false;\n\nmodule.exports = {\n  isHidden: function() {\n  \
    \   return display === false;\n  },\n  hide: function() {\n     display = false;\n\
    \  },\n  show: function() {\n     display = true;\n  }\n};\n```\n\n在上面的例子中，该模块允许用户通过\
    \ `hide` 和 `show` 方法来操作 `display` 属性。\n\n此时，你可能在想这与 Grunt 有何关系。如前所述，Grunt 插件就是\
    \ Node.js 包。Grunt 插件通常由一个或多个模块组成，并且通常依赖其他 Node.js 包来实现其目标。深入了解 Node.js、其模块系统以及其运作方式，将为你项目中使用\
    \ Grunt 打下坚实的基础。到目前为止，你已经了解了如何加载相对于当前模块的模块。这些被称为文件模块。除了文件模块，还可以从 `node_modules`\
    \ 目录加载模块。`node_modules` 是当你运行 `npm install` 命令时，`npm` 将创建并安装项目依赖项的目录。让我们快速看一个示例。\n\
    \n### 从 `node_modules` 加载模块\n\n在我们的示例中，我们将再次安装名为 `request` 的 Node.js 包，使用以下命令：\n\
    \n```\nnpm install request\n```\n\n一旦 `npm` 完成安装，你会注意到当前文件夹中创建了一个新文件夹（参见**图 2-5**）。如果你打开\
    \ `node_modules` 文件夹，你会看到另一个与已安装的 Node.js 包名称匹配的文件夹。`request` 文件夹包含了 `request`\
    \ 包的内容。\n\n![9781484200148_Fig02-05.jpg](img/00011.jpeg)\n\n**图 2-5**. 本地安装包时创建的\
    \ `node_modules` 目录\n\n现在包已安装，它就可以在我们的项目中使用。下面（**代码清单 2-4**）是一个示例应用程序，它加载 `request`\
    \ 模块并使用它向 `'http://www.guardian.co.uk'` 发起请求。\n\n***代码清单 2-4***. 加载并使用 `request`\
    \ 模块\n\n```\nvar request = require('request');\n\nrequest.get('http://www.guardian.co.uk',\
    \ function(error, response, body) {\n  if (!error && response.statusCode == 200)\
    \ {\n    console.log(body);\n  }\n});\n```\n\n上述示例应用程序可以保存为 `index.js`，放在 `node_modules`\
    \ 目录旁边。然后可以在命令行中运行它，如下所示：\n\n```\nnode index.js\n```\n"
- fmt: "以上内容将输出*Guardian*首页的HTML内容（见图2-6）。在应用程序的第一行，我们引入了`request`包，并用变量名`request`存储了对它的引用。这使得我们可以在自己的应用程序中使用该包中定义的函数。在本例中，我们使用了`request`包提供的`get`方法，该方法允许我们向提供的URL发送一个HTTP\
    \ GET请求。\n\n![9781484200148_Fig02-06.jpg](images/00012.jpeg)\n\n图2-6：示例应用程序从*Guardian*网站输出的HTML\n\
    \n这里需要注意的重要一点是，在`require`的开头没有`/`、`../`、`\"`或`./`。如果传递给`require`的模块标识符不是一个核心Node.js模块，并且不以`/`、`../`或`./`开头，Node.js将尝试从当前模块的父目录加载模块，并在其后添加`node_modules`。如果在该目录中未找到模块，它会继续向上寻找其父目录，以此类推。\n\
    \n例如，如果我们的应用程序位于`/Users/james/projects/progrunt/index.js`，Node.js将尝试在以下位置加载`request`包：\n\
    \n*   `/Users/james/projects/progrunt/node_modules/request`\n*   `/Users/james/projects/node_modules/request`\n\
    *   `/Users/james/node_modules/request`\n*   `/Users/node_modules/request`\n*\
    \   `/node_modules/request`\n\n这允许应用程序定位其依赖项，从而避免冲突（见图2-7）。\n\n![9781484200148_Fig02-07.jpg](images/00013.jpeg)\n\
    \n图2-7：当运行`require('request')`时，`index.js`从`request`目录加载\n\n眼尖的读者可能已经注意到，在前面的例子中，我们加载的是文件，但`request`却是从一个目录加载的。Node.js也支持从文件夹加载模块。Node.js将尝试根据以下规则从文件夹加载模块：\n\
    \n*   从文件夹内`package.json`中的`main`属性\n*   `index.js`文件\n*   `index.node`文件\n\n\
    在我们的例子中，`request`包同时满足了第一条规则和第二条规则。\n\n至此，我们介绍了Node.js加载包的各种方法。理解每种方法都很重要，因为你将在本书的后续部分用到它们。接下来，我们将研究如何为你的Node.js项目定义属性和依赖项。同样，这也是一个需要理解的重要部分，因为在项目中使用Grunt时你将用到相同的技术。\n\
    \n## 定义Node.js项目\n\nNode.js提供了一种便捷的方法来定义包的元数据。这些元数据在通过`npm`搜索包时使用，同时也会在`npm`网站（[www.npmjs.org](http://www.npmjs.org)）上显示，以便开发者了解包的功能和用法。此外，元数据还允许开发者定义开发该包所需的依赖项以及运行该包所需的依赖项。\n\
    \n包元数据必须包含以下内容：\n\n*   包名称\n*   包的当前版本\n*   包的作者，包括其电子邮件地址\n\n除了这些必填属性外，元数据还可以包含以下内容：\n\
    \n*   包描述\n*   关键字\n*   许可证\n*   贡献者列表\n*   仓库——指向包源代码控制仓库的URL\n*   开发依赖项——开发该包所需的依赖项\n\
    *   依赖项——运行该包所需的依赖项\n*   引擎——支持的Node.js版本\n\n包的元数据保存在模块根目录下名为`package.json`的文件中。在前面的示例中，`package.json`文件会与`index.js`文件位于同一目录。下面是一个示例`package.json`（见代码清单2-5）：\n\
    \n***代码清单2-5***：用于定义包元数据的示例`package.json`文件\n\n```json\n{\n  \"name\": \"grunt-pagespeed\"\
    ,\n  \"version\": \"0.1.2\",\n  \"description\": \"Grunt plugin for running Google\
    \ PageSpeed Insights.\",\n  \"homepage\": \"https://github.com/jrcryer/grunt-pagespeed\"\
    ,\n  \"author\": {\n    \"name\": \"James Cryer\",\n    \"email\": \"chat@jamescryer.com\"\
    ,\n    \"url\": \"http://www.jamescryer.com/\"\n  },\n  \"repository\": {\n  \
    \  \"type\": \"git\",\n    \"url\": \"git://github.com/jrcryer/grunt-pagespeed.git\"\
    \n  },\n  \"contributors\": [],\n  \"main\": \"Gruntfile.coffee\",\n  \"engines\"\
    : {\n    \"node\": \">=0.8.0\"\n  },\n  \"devDependencies\": {\n    \"grunt\"\
    : \"~0.4.1\"\n  },\n  \"dependencies\": {\n    \"googleapis\": \"~0.6.1\"\n  },\n\
    \  \"keywords\": [\n    \"gruntplugin\",\n    \"pagespeed\",\n    \"insights\"\
    ,\n    \"grunt\",\n    \"performance\"\n  ]\n}\n```\n\n以上是我用于对网站运行`pagespeed insights`的Grunt插件的`package.json`文件副本。前面示例中需要注意的重要属性是`devDependencies`和`dependencies`。这些属性允许我们定义项目所需的其他Node.js包。在本章后面，你将看到Grunt插件的依赖项是如何在此处体现的。\n\
    \n`npm`提供了一个用于快速启动项目的便捷命令。它会询问一系列问题，并根据你的回答生成一个`package.json`文件。让我们回顾一下之前的示例，并为该项目生成一个`package.json`。首先，确保你位于项目的根文件夹（包含`index.js`的文件夹）中，然后运行以下命令：\n\
    \n```\nnpm init\n```\n\n随后，`npm`会提示你回答一系列问题（见图2-8）。\n\n![9781484200148_Fig02-08.jpg](images/00014.jpeg)\n\
    \n图2-8：示例应用程序从*Guardian*网站输出的HTML\n\n`npm`会显示即将生成的`package.json`，并询问是否正确。如果你选择“是”，你会发现在项目根目录下现在有了一个`package.json`文件。你可能还注意到，`npm`足够智能，可以检测到我们已经安装了`request`，并将其添加到生成的`package.json`文件中。\n\
    \n一旦`package.json`文件被添加到项目中，安装包时你需要添加一个额外的标志，以确保`npm`更新`package.json`。例如，如果我们想为项目添加一个流行的单元测试框架`nodeunit`，我们需要运行以下命令：\n\
    \n```\nnpm install nodeunit --save\n```\n\n`--save`标志告诉`npm`我们希望将此包添加为依赖项。或者，我们可以使用`--save-dev`将包添加到开发依赖项中。运行上述命令后，`package.json`文件应该类似于下面的代码清单2-6：\n\
    \n***代码清单2-6***：安装`nodeunit`后的`package.json`\n\n```json\n{\n  \"name\": \"guardian-grabber\"\
    ,\n  \"version\": \"0.0.1\",\n  \"description\": \"\",\n  \"main\": \"index.js\"\
    ,\n  \"dependencies\": {\n    \"request\": \"~2.34.0\",\n    \"nodeunit\": \"\
    ^0.8.6\"\n  },\n  \"devDependencies\": {},\n  \"scripts\": {\n    \"test\": \"\
    echo \\\"Error: no test specified\\\" && exit 1\"\n  },\n  \"author\": \"James\
    \ Cryer\",\n  \"license\": \"ISC\"\n}\n```\n\n现在我们已经明确了什么是Node.js包，以及如何在自己的项目中搜索和安装它们，接下来我们可以进入Grunt本身。\n\
    \n## Grunt\n\n如前所述，Grunt插件是Node.js包。但是，我还没提到Grunt本身也是一个Node.js包。在本书中，我们将使用Grunt\
    \ 0.4.x版本。注意Grunt的版本很重要，因为0.3.x和0.4.x版本之间有一些重大的变化。最大的变化是将Grunt包拆分为三个独立的包：\n\n\
    *   `grunt-cli`\n*   `grunt`\n*   `grunt-init`\n\n这一设计决策背后的原因稍后将会明确。首先，让我们通过运行以下命令来安装第一个包`grunt-cli`：\n\
    \n```\nnpm install -g grunt-cli\n```"
  raw: 'The preceding will output the HTML contents of the *Guardian* home page (see
    [Figure 2-6](#part0009.html#Fig6)). On the first line of the application, we include
    the request package and store a reference to it with the variable named request.
    This allows us to use functions defined within the package within our own application.
    In our example, we use the get method that the request package offers, which allows
    us to send an HTTP GET request to the supplied URL.


    ![9781484200148_Fig02-06.jpg](images/00012.jpeg)


    [Figure 2-6](#part0009.html#_Fig6). Sample application output HTML from *Guardian*
    web site


    The important thing to note here is the lack of /, ../,” or ./ at the start of
    require. If the module identifier passed to require is not a core Node.js module
    and does not start with /, ../, or ./, Node.js will attempt to load the module
    from the current module’s parent directory, appended with “node_modules.” If the
    module is not found, it moves to the parent directory, and so on.


    For example, if our application is located at /Users/james/projects/progrunt/index.js,
    Node.js will attempt to load the request package at the following locations:


    *   /Users/james/projects/progrunt/node_modules/request

    *   /Users/james/projects/node_modules/request

    *   /Users/james/node_modules/request

    *   /Users/node_modules/request

    *   /node_modules/request


    This allows applications to localize their dependencies, so that they do not clash
    (see [Figure 2-7](#part0009.html#Fig7)).


    ![9781484200148_Fig02-07.jpg](images/00013.jpeg)


    [Figure 2-7](#part0009.html#_Fig7). index.js is loaded from request when require(''request);
    is run


    The sharp-eyed among you might have noticed that in our earlier examples, we were
    loading files, but request is being loaded from a directory. Node.js also supports
    loading modules from folders. Node.js will attempt to load a module from a folder,
    using the following rules:


    *   From the main property from the package.json inside the folder

    *   index.js file

    *   index.node file


    In our example, the request package contains matches on the first rule and second
    rule.


    This concludes the various approaches Node.js takes to load packages. It has been
    important to visit each approach, as you will use these throughout the remainder
    of the book. Next, we will look at how to define properties and dependencies for
    your Node.js projects. Again, this is an important section to understand, as you’ll
    use the same techniques when using Grunt on a project.


    Defining Node.js Projects


    Node.js provides a convenient method for defining metadata for a package. This
    metadata is used when searching for a package via npm. It is also used on the
    npm site, [www.npmjs.org](http://www.npmjs.org), to display useful information
    to allow developers to understand what a package does and how it can be used.
    In addition, the metadata also allows developers to define the dependencies needed
    to develop the package and the dependencies needed to run the package.


    Package metadata must include the following:


    *   A package name

    *   The current version of the package

    *   The author of the package, including his/her e-mail address


    Aside from these mandatory properties, the metadata can also include the following:


    *   Package description

    *   Keywords

    *   Licenses

    *   List of contributors

    *   Repository—the URL to the source-control repository for the package

    *   Development dependencies—dependencies required to develop the package

    *   Dependencies—dependencies required to run the package

    *   Engines—the versions of Node.js supported


    The metadata for a package is kept within a file called package.json in the root
    of the module. In our earlier example, the package.json file would appear alongside
    the index.js file. Following ([Listing 2-5](#part0009.html#list5)) is a sample
    package.json:


    [***Listing 2-5***](#part0009.html#_list5). Sample package.json File for Defining
    Package Metadata


    ```

    {

      "name": "grunt-pagespeed",

      "version": "0.1.2",

      "description": "Grunt plugin for running Google PageSpeed Insights.",

      "homepage": "https://github.com/jrcryer/grunt-pagespeed",

      "author": {

        "name": "James Cryer",

        "email": "chat@jamescryer.com",

        "url": "http://www.jamescryer.com/"

      },

      "repository": {

        "type": "git",

        "url": "git://github.com/jrcryer/grunt-pagespeed.git"

      },

      "contributors": [],

      "main": "Gruntfile.coffee",

      "engines": {

        "node": ">=0.8.0"

      },

      "devDependencies": {

        "grunt": "~0.4.1"

      },

      "dependencies": {

        "googleapis": "~0.6.1"

      },

      "keywords": [

        "gruntplugin",

        "pagespeed",

        "insights",

        "grunt",

        "performance"

      ]

    }

    ```


    The preceding is a copy of the package.json from my Grunt plug-in for running
    pagespeed insights against sites. The important properties to note in the preceding
    example are devDependencies and dependencies. These are the properties that allow
    us to define other Node.js packages required for our project. Later in this chapter,
    you will see how Grunt plug-in dependencies appear here.


    npm bundles a handy command for bootstrapping your projects. It asks a set of
    questions and generates a package.json file based on your answers. Let’s revisit
    our earlier example and generate a package.json for the project. First, ensure
    that you are in the root folder of the project (the folder containing index.js)
    and run the following:


    ```

    npm init

    ```


    npm will then prompt you to answer a series of questions (see [Figure 2-8](#part0009.html#Fig8)).


    ![9781484200148_Fig02-08.jpg](images/00014.jpeg)


    [Figure 2-8](#part0009.html#_Fig8). Sample application output HTML from *Guardian*
    web site


    npm will present you with the package.json that is about to be generated and ask
    whether it is correct. If you select yes, you will notice that you now have a
    package.json file in the root of the project. You may have also noticed that npm
    is clever enough to detect that we’ve already installed request and added it to
    the generated package.json file.


    Once the package.json file is added your project, you have to add an additional
    flag when installing packages, to ensure that npm updates the package.json. For
    example, if we want to add a popular unit-testing framework nodeunit to our project,
    we would have to run the following:


    ```

    npm install nodeunit –save

    ```


    The -save flag informs npm that we wish to add this package as a dependency. Alternatively,
    we could have used --save-dev to add the package to the development dependencies.
    After running the preceding command, the package.json file should now look similar
    to [Listing 2-6](#part0009.html#list6).


    [***Listing 2-6***](#part0009.html#_list6). package.json after Installing nodeunit


    ```

    {

      "name": "guardian-grabber",

      "version": "0.0.1",

      "description": "",

      "main": "index.js",

      "dependencies": {

        "request": "~2.34.0",

        "nodeunit": "^0.8.6"

      },

      "devDependencies": {},

      "scripts": {

        "test": "echo \"Error: no test specified\" && exit 1"

      },

      "author": "James Cryer",

      "license": "ISC"

    }

    ```


    Now that I’ve established what a Node.js package is and how we can search and
    install them within our own projects, we can move on to Grunt itself.


    Grunt


    As mentioned previously, Grunt plug-ins are Node.js packages. However, I failed
    to mention that Grunt is itself a Node.js package as well. Throughout this book,
    we will be using Grunt version 0.4.x. It is important to note the version of Grunt,
    as there were some significant changes between version 0.3.x and 0.4.x. The biggest
    change was to split the Grunt package into three separate packages:


    *   grunt-cli

    *   grunt

    *   grunt-init


    The reasons behind this design decision will be made clear shortly. First, let’s
    install the first package, grunt-cli, by running the following:


    ```

    npm install -g grunt-cli

    ```'
