    \    });\n\nit('should not be complete', function() {\n      expect(todo.get('complete')).toBe(false);\n\
    \    });\n\nit('should be marked as completed', function() {\n      todo.complete();\n\
    \      expect(todo.get('complete')).toBe(true);\n    });\n\n});\n});\n```\n\n\
    ![9781484200148_Fig06-14.jpg](img/00052.jpeg)\n\n图 6-14. 控制台中 `grunt-karma` 的输出\n\
    \n![9781484200148_Fig06-15.jpg](img/00053.jpeg)\n\n图 6-15. Karma 调试视图中的控制台输出，包含每个测试的名称及其通过状态\n\
    \n在我们的示例中，我们仅仅是初步探索了 Karma 在测试应用程序方面的强大能力。在实际应用中，Karma 能够在一秒钟内在每个浏览器中运行数百个测试。你也可以选择在你用户使用的所有主流浏览器中运行所有测试。\n\
    \n在下一章中，当我们为项目搭建持续集成环境时，我们将再次讨论 `grunt-karma`。我们将探讨如何在虚拟化环境中的多个浏览器中运行测试。\n\n##\
    \ 自动化可访问性测试\n\n任何 Web 应用测试策略的另一个关键组成部分应该是可访问性测试。进行可访问性测试是为了确保所有访问你应用程序或网站的用户都能获得良好的体验，并且不会受到限制，无法访问应用功能或网站内容。人们常犯的一个错误是，认为可访问性测试只关乎验证网站是否对视力较差或完全失明的用户友好。可访问性的范畴远不止于此，还有更多的检查项需要执行，以确保网站或应用是易于访问的。在本节中，我们将探讨如何使用工具来自动化检测\
    \ Web 应用中的可访问性问题。为了执行测试，我们将使用 Chrome 无障碍工具来验证我们的应用或页面。幸运的是，已经有一个封装了 `npm` `a11y`\
    \ 包的 `grunt` 插件可供使用。\n\n首先，我们需要将 `grunt-a11y` 插件添加到项目中。清单 6-33 展示了安装过程。\n\n***清单\
    \ 6-33***. 安装 `grunt-a11y`\n\n```\nnpm install --save-dev grunt-a11y\n```\n\n\
    现在，我们的 `grunt` 工作流程中已经可以使用 `a11y` 了，接下来我们需要配置该插件，如清单 6-34 所示。\n\n***清单 6-34***.\
    \ 配置 `grunt-ally` 为我们的应用程序运行可访问性测试\n\n```\na11y: {\n  live: {\n    options: {\n\
    \      urls: ['www.twitter.com']\n    }\n  }\n}\n```\n\n如清单 6-34 所示，该插件可以通过一系列\
    \ URL 进行简单配置。在我们的示例中，我们将 URL 硬编码到了 `Gruntfile` 中，但在大型应用的构建过程中，这应该被推入一个配置文件，并在构建时加载。这意味着\
    \ URL 更易于维护，并且可以在任务之间共享。我们将在下一章进一步探讨这一点。\n\n除了 `urls` 选项外，`grunt-a11y` 插件还接受另一个选项，允许插件在检测到所测试\
    \ URL 存在可访问性问题时抛出错误。如果你希望将这些测试作为持续集成环境的一部分，并且希望在可访问性测试失败时导致构建失败，那么这个选项就变得非常重要。图\
    \ 6-16 展示了该插件的示例输出。\n\n![9781484200148_Fig06-16.jpg](img/00054.jpeg)\n\n图 6-16.\
    \ 运行 `grunt-a11y` 的示例输出\n\n`grunt-a11y` 插件会报告缺少标签、ARIA 属性、元数据或元素对比度低等问题。这并不能替代使用其他工具套件进行的实际可访问性测试。但是，该插件可以作为一种辅助工具，帮助确保应用程序中维护了可访问性的基线标准。\n\
    \n## 将本地服务器暴露给外部世界\n\n在本地开发应用程序时，能够与他人分享和展示你的工作进行中状态总是很方便的。此外，第三方工具有时也需要能够在开放的\
    \ Web 上查看你的应用程序，才能有效地工作。像 Google PageSpeed Insights 或 WebPagetest 这样的工具就是如此，它们可以用来分析应用程序的网络性能。幸运的是，有一个名为\
    \ `ngrok` 的工具，它允许你通过一个公共 URL 将本地开发环境安全地暴露到网络上。在本节中，我们将探讨如何配置我们的 `Grunt` 工作流程，以便轻松地暴露我们的应用程序。\n\
    \n`ngrok` 可以从 [`ngrok.com`](https://ngrok.com) 下载二进制文件，也可以作为 Node 模块使用，这意味着我们可以轻松地将其集成到我们的\
    \ `Grunt` 工作流程中。首先，我们通过使用 `npm` 安装包来将 `ngrok` 包含到我们的项目中，如清单 6-35 所示。\n\n***清单\
    \ 6-35***. 安装 `ngrok`\n\n```\nnpm install ngrok --save-dev\n```\n\n为了在我们的 `Grunt`\
    \ 工作流程中使用 `ngrok`，我们将在 `Gruntfile` 中注册一个任务。我们的新任务 `ngrok` 是异步的，因为它会向 `ngrok` API\
    \ 发送请求，为我们的应用程序请求一个公共 URL。我们将应用程序配置为在开发期间本地运行在端口 `8000` 上，因此我们将端口号 `8000` 传递给对\
    \ `ngrok` 的调用。`ngrok` 库会返回一个错误和/或一个公共 URL。一旦返回 URL，我们就可以修改其他 `Grunt` 任务的配置，使其针对我们的公共\
    \ URL 运行。例如，我们可以修改 `grunt-a11y` 任务中的 URL，使其针对本地开发环境而不是生产环境运行。清单 6-36 展示了完整的自定义任务。\n\
    \n***清单 6-36***. 用于运行 `ngrok` 的自定义 Grunt 任务\n\n```\nvar ngrok = require ('ngrok');\n\
    \nmodule.exports = function (grunt) {\n\ngrunt.registerTask('ngrok', 'Running\
    \ ngrok', function () {\n    var done = this.async();\n    var port = 8000;\n\n\
    ngrok.connect(port, function (err, url) {\n      if (err !== null) {\n       \
    \ grunt.fail.fatal(err);\n        return done();\n      }\n      grunt.log.write(url);\n\
    \      done();\n    });\n  });\n\n// Register default tasks\n  grunt.registerTask('default',\
    \ ['ngrok']);\n};\n```\n\n如果你在需要代理的公司网络内工作，那么你很可能可以将 `ngrok` 与其他 `Grunt` 插件结合使用，以便在代理环境下运行它们。在下一节中，我们将暴露我们的应用程序，以便能够对我们的网站进行性能测试。\n\
    \n## 性能测试\n\n在本章的最后一节，我们将探讨可用于自动化性能测试的工具。我们将特别关注网络性能，评估我们的应用程序在网络传输方面的优化程度。有许多很棒的工具可以用来执行这类测试。我们将重点介绍两个插件：`grunt-pagespeed`\
    \ 和 `grunt-perfbudget`。\n"
- fmt: "# Grunt-pagespeed 与 Grunt-perfbudget\n\n`Grunt-pagespeed` 封装了 Node 模块 `PSI`。`PSI`\
    \ 是 *PageSpeed Insights* 的缩写。PageSpeed Insights 是 Google 的一款产品，允许开发者通过浏览器中的表单、API\
    \ 或浏览器插件来运行性能测试。Node 模块直接与 API 交互。该 API 接受多个参数，但主要是网站的 URL。API 随后获取 URL，向其发出请求，并对页面生成的请求（例如，CSS\
    \ 的请求）执行分析。分析会应用一系列规则来确定页面的整体性能，并返回一个介于 0 到 100 之间的分数，其中 100 表示性能最佳。`grunt-pagespeed`\
    \ 模块允许你定义一个阈值，该阈值必须在每次运行性能测试时达到。如果未达到阈值，该插件将抛出错误。如果你希望在发布到生产环境之前，将性能测试作为构建过程的一部分来运行以验证性能，这将特别有用。该插件还支持多种输出格式，包括\
    \ `TAP` 和 `JSON`。\n\n`Grunt-perfbudget` 与另一个名为 WebPagetest 的类似 PageSpeed Insights\
    \ 的性能工具交互。与 PageSpeed Insights 一样，WebPagetest 可以通过多种方式使用：通过网络表单、API 或在自己的安装上运行。Grunt\
    \ 插件使用公共 API；但是，它可以配置为针对 WebPagetest 的本地安装运行。`Grunt-perfbudget` 与 `grunt-pagespeed`\
    \ 不同，因为它允许你为每个指标（例如，请求数量）定义性能阈值。\n\n让我们开始同时安装这两个插件（参见[清单 6-37](#part0013.html#list37)）。\n\
    \n[***清单 6-37***](#part0013.html#_list37). 安装 `grunt-pagespeed` 和 `grunt-perfbudget`\n\
    \n```\nnpm install grunt-pagespeed grunt-perfbudget --save-dev\n```\n\n现在两个插件都已可用，我们必须对它们进行配置。我们将从\
    \ `grunt-pagespeed` 开始，其配置如[清单 6-38](#part0013.html#list38) 所示。\n\n[***清单 6-38***](#part0013.html#_list38).\
    \ `grunt-pagespeed` 配置\n\n```\npagespeed: {\n  options: {\n    nokey: true,\n\
    \    url: \"https://developers.google.com\"\n  },\n  prod: {\n    options: {\n\
    \      locale: \"en_GB\",\n      strategy: \"desktop\",\n      threshold: 80\n\
    \    }\n  }\n}\n```\n\n`Grunt-pagespeed` 允许你定义多个参数，这些参数将修改对所提供的 URL 运行的测试。在我们的示例中，我们正在测试单个\
    \ URL：`https://developers.google.com`；但是，该插件支持针对多个 URL 运行测试，每个 URL 都会对照定义的阈值进行检查。除了\
    \ `url` 选项外，还有用于设置预期策略和 API 密钥的选项。`strategy` 决定对给定 URL 执行的分析类型。它可以是 `mobile` 或\
    \ `desktop`。`API key` 是通过 Google APIs 控制台获得的密钥。然而，按照我们的配置，Google 提供了无需密钥即可使用 PageSpeed\
    \ Insights 的功能。这会限制你对 API 的使用，如果你打算在生产环境或正式构建过程中使用 PageSpeed Insights，那么我建议设置一个\
    \ API 密钥。在我们的示例中，我们还将阈值设置为 80，这意味着如果我们的整体性能分数低于 80，将会抛出一个错误。\n\n[图 6-17](#part0013.html#Fig17)\
    \ 显示了使用上述配置运行 Grunt 插件的示例输出。如您所见，整体分数、策略和 URL 都定义在输出的顶部。此外，还给出了每条规则的明细，以及按类型分组的静态资源大小的相关值。\n\
    \n![9781484200148_Fig06-17.jpg](images/00055.jpeg)\n\n[图 6-17](#part0013.html#_Fig17).\
    \ `grunt-pagespeed` 的示例输出\n\n## 性能开发环境\n\n如您所见，当长期在项目上工作时，这可能非常有用。它可以帮助您跟踪出现的任何性能问题，并确保您的应用程序在每个版本中都达到基准。如果您在一个有许多开发人员的项目上工作，且每个版本都添加新的前端依赖项，这将特别有用。另外值得注意的是，`grunt-pagespeed`\
    \ 可以与 `ngrok` 结合使用，在将应用程序发布到公共 URL 之前测试您的本地开发环境。[清单 6-39](#part0013.html#list39)\
    \ 通过再次使用上一节中的 `ngrok` 任务，演示了如何实现这一点。\n\n[***清单 6-39***](#part0013.html#_list39).\
    \ 使用 `ngrok` 和 `grunt-pagespeed` 进行本地性能测试的自定义任务\n\n```\ngrunt.registerTask('ngrok',\
    \ 'Running ngrok', function () {\n  var done = this.async();\n  var port = 8000;\n\
    \nngrok.connect(port, function (err, url) {\n    if (err !== null) {\n      grunt.fail.fatal(err);\n\
    \      return done();\n    }\n    grunt.config.set('pagespeed.options.url', url);\n\
    \    grunt.task.run('pagespeed');\n    done();\n  });\n});\n```\n\n关键的修改在于传递给\
    \ `connect` 函数的回调中。在最后几行，我们使用 `grunt.config` API 在执行 `pagespeed` 任务之前设置了 `grunt-pagespeed`\
    \ URL 的值。然后，`pagespeed` 任务将使用从 `ngrok` 服务返回的 URL 运行。\n\n接下来，我们将把 `grunt-perfbudget`\
    \ 集成到项目中。这与 `grunt-pagespeed` 略有不同，因为我们可以对照 WebPagetest 的响应中的每个指标来定义阈值。[清单 6-40](#part0013.html#list40)\
    \ 包含用于测试我们应用程序的示例配置。\n\n[***清单 6-40***](#part0013.html#_list40). `grunt-perfbudget`\
    \ 的配置\n\n```\nperfbudget: {\n  default: {\n    options: {\n      url: 'https://developers.google.com',\n\
    \      key: 'API_KEY_HERE',\n      budget: {\n        visualComplete: '4000',\n\
    \        SpeedIndex: '1500'\n      }\n    }\n  }\n}\n```\n\n运行上述配置将输出测试的 URL、所选预算的分数以及预算是否达标。[图\
    \ 6-18](#part0013.html#Fig18) 显示了 `grunt-perfbudget` 的示例输出。与 `grunt-pagespeed`\
    \ 一样，如果某个特定预算未达标，将会抛出一个错误。\n\n![9781484200148_Fig06-18.jpg](images/00056.jpeg)\n\
    \n[图 6-18](#part0013.html#_Fig18). `grunt-perfbudget` 的输出\n\n与 `grunt-pagespeed`\
    \ 一样，`grunt-perfbudget` 可以与 `ngrok` 结合使用来测试本地开发环境，如果您希望在发布应用程序之前开始分析页面性能。为了简化对大量\
    \ URL 的测试，这两个插件都可以与 `grunt-text-replace` 结合使用，以动态生成一组 URL。例如，如果您想测试不同的环境，并且每个环境中的路径相同，则可以动态写入域名或子域名，同时只需维护一个\
    \ URL 列表。\n\n## 总结\n\n在本章中，我们探讨了如何使用 Grunt 来辅助搭建本地开发环境、设置测试环境以及在本地开发环境中对我们的应用程序执行基准测试。我们还探讨了编写测试的好处，以及如何在各种浏览器上运行这些测试。最后，我们介绍了一些工具，这些工具可以帮助验证，当我们将更改引入应用程序时，不会同时引入性能瓶颈。\n\
    \n此时，我们的 `Gruntfile` 变得臃肿且难以管理，存在大量重复。除了庞大的 `Gruntfile`，每次运行 Grunt 时（即使只运行单个任务），我们都会加载大量插件。在最后一章中，我们将研究一些工具和技术，以使我们的\
    \ Grunt 工作流本身更加优化。最终目标是拥有一个精简且易于理解的构建过程，团队中的任何人都可以轻松使用。\n\n# 第 7 章\n\n![image](images/00005.jpeg)\n\
    \n## 优化您的 Grunt 工作流"
  raw: 'Grunt-pagespeed wraps the Node module, PSI. PSI is an abbreviation of *PageSpeed*
    *Insights*. PageSpeed Insights is a product from Google that allows developers
    to run performance tests either via a form in the browser, an API, or a browser
    plug-in. The Node module interacts directly with the API. The API accepts a number
    of parameters but primarily the URL of the site. The API then takes the URL, making
    a request to the API, and performs analysis on the requests generated from the
    page (e.g., requests for CSS). The analysis then applies a series of rules to
    determine the overall performance of the page, returning a single score between
    0 and 100, where 100 is the most performant. The grunt-pagespeed module lets you
    define a threshold that must be achieved each time the performance test is run.
    If the threshold is not met, the plug-in will throw an error. This is particularly
    useful if you want to run performance testing as part of your build process, to
    verify the performance before releasing to production. The plug-in also supports
    a number of output formats, including TAP and JSON.


    Grunt-perfbudget interacts with another performance tool similar to PageSpeed
    Insights known as WebPagetest. As with PageSpeed Insights, the WebPagetest can
    be used in a number of ways, via a web form, an API, or run on your own installation.
    The Grunt plug-in uses the public API; however, it can be configured to run against
    a local installation of WebPagetest. Grunt-perfbudget differs from grunt-pagespeed,
    as it allows you to define performance thresholds for each metric (e.g., the number
    of requests).


    Let’s get started by installing both plug-ins at the same time (see [Listing 6-37](#part0013.html#list37)).


    [***Listing 6-37***](#part0013.html#_list37). Installing grunt-pagespeed and grunt-perfbudget


    ```

    npm install grunt-pagespeed grunt-perfbudget --save-dev

    ```


    Now that both plug-ins are available, we must configure each of them. We’ll start
    with grunt-pagespeed, with the configuration shown in [Listing 6-38](#part0013.html#list38).


    [***Listing 6-38***](#part0013.html#_list38). grunt-pagespeed Configuration


    ```

    pagespeed: {

      options: {

        nokey: true,

        url: "https://developers.google.com"

      },

      prod: {

        options: {

          locale: "en_GB",

          strategy: "desktop",

          threshold: 80

        }

      }

    }

    ```


    Grunt-pagespeed allows you to define a number of parameters that will modify the
    tests run against the URLs supplied. In our example, we’re testing a single URL:
    [https://developers.google.com](https://developers.google.com); however, the plug-in
    has support for running tests against multiple URLs, with each being checked against
    the defined threshold. In addition to the URL option, there are options available
    for setting the expected strategy and API key. The strategy determines the analysis
    to be performed on the given URL. This can either be mobile or desktop. The API
    key is the key available via the Google APIs console. However, Google offers the
    ability to use PageSpeed Insights with no key, as per our configuration. This
    gives you limited usage of the API, and if you intend to use PageSpeed Insights
    in production or your formal build process, then I’d advise setting an API key.
    In our example, we’ve also set the threshold to a value of 80, meaning that if
    our overall performance score is below 80, an error will be thrown.


    [Figure 6-17](#part0013.html#Fig17) shows a sample output from running the Grunt
    plug-in with the preceding configuration. As you can see, the overall score, strategy,
    and URL are defined at the top of the output. In addition, a breakdown of each
    rule is given, with the associated value with the size of the static resources
    grouped by type.


    ![9781484200148_Fig06-17.jpg](images/00055.jpeg)


    [Figure 6-17](#part0013.html#_Fig17). Sample output from grunt-pagespeed


    Performancing Development Environments


    As you can see, this can be extremely useful when working on a project for a long
    time. It can help you track any performance issues as they arise and ensure that
    your application is meeting a benchmark on each release. This is particularly
    useful if you are working on a project with many developers with new front-end
    dependencies being added on each release. It is good to also note that grunt-pagespeed
    can be combined with ngrok to test your local development environment before releasing
    your application to a public URL. [Listing 6-39](#part0013.html#list39) demonstrates
    how this can be achieved, by revisiting the ngrok task from the previous section.


    [***Listing 6-39***](#part0013.html#_list39). A Custom Task to Use ngrok and grunt-pagespeed
    for Local Performance Testing


    ```

    grunt.registerTask(''ngrok'', ''Running ngrok'', function () {

      var done = this.async();

      var port = 8000;


    ngrok.connect(port, function (err, url) {

        if (err !== null) {

          grunt.fail.fatal(err);

          return done();

        }

        grunt.config.set(''pagespeed.options.url'', url);

        grunt.task.run(''pagespeed'');

        done();

      });

    });

    ```


    The key modification is in the callback passed to the connect function. In the
    last few lines, we use the grunt.config API to set the value of the grunt-pagespeed
    URL before executing the pagespeed task. The pagespeed task will then run with
    the URL returned from the ngrok service.


    Next, we will integrate grunt-perfbudget into the project. This slightly differs
    from grunt-pagespeed, as we can define thresholds against each metric in the response
    from WebPagetest. [Listing 6-40](#part0013.html#list40) contains sample configuration
    to be used to test our application.


    [***Listing 6-40***](#part0013.html#_list40). Configuration for grunt-perfbudget


    ```

    perfbudget: {

      default: {

        options: {

          url: ''https://developers.google.com'',

          key: ''API_KEY_HERE'',

          budget: {

            visualComplete: ''4000'',

            SpeedIndex: ''1500''

          }

        }

      }

    }

    ```


    Running the preceding configuration will output the URL tested, the score for
    the given budget selected, and whether the budget was met. [Figure 6-18](#part0013.html#Fig18)
    has sample output from grunt-perfbudget. As with grunt-pagespeed, if a particular
    budget is not met, an error will be thrown.


    ![9781484200148_Fig06-18.jpg](images/00056.jpeg)


    [Figure 6-18](#part0013.html#_Fig18). Output from grunt-perfbudget


    As with grunt-pagespeed, grunt-perfbudget can be combined with ngrok to test local
    development environments, if you want to start to analyze page performance before
    releasing your application. To simplify testing large sets of URLs, both plug-ins
    can be used in combination with grunt-text-replace to dynamically generate a set
    of URLs. For example, if you want to test different environments, and the paths
    are identical in each environment, the domain or subdomain can be dynamically
    written while only having to keep a single list of URLs.


    Summary


    Throughout this chapter, we’ve explored how Grunt can be used to aid with setting
    up a local development environment, setting up test environments, and performing
    baseline tests against our applications in local development environments. We’ve
    explored the benefits of writing tests and how these can be run across a variety
    of browsers. We’ve concluded by introducing tools that can help verify that as
    we introduce changes into our applications, we do not introduce any performance
    bottlenecks simultaneously.


    At this point, our Gruntfile has become bloated and unmanageable, with lots of
    duplication. Alongside our large Gruntfile, we’re loading a lot of plug-ins each
    time Grunt runs, even if a single task is run. In the final chapter, we’ll look
    at tools and techniques to make our Grunt workflow itself more optimized. The
    ultimate goal will be to have a lean and understandable build process that can
    be easily used by anyone within a team.


