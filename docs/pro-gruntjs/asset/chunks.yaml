    \  return Backbone.View.extend({\n\ntagName: 'div',\n\nclassName: 'todo-form',\n\
    \nrender: function() {\n\n}\n  });\n});\n\n// js/views/todo-item.js\n\ndefine(['backbone'],\
    \ function(Backbone) {\n  return Backbone.View.extend({\n\ntagName: 'li',\n\n\
    className: 'todo-item',\n\nrender: function() {\n\n}\n  });\n});\n```\n\n清单 4-12\
    \ 添加了四个新的 AMD 模块：一个 Backbone 集合、一个模型和两个视图。目前，应用程序功能不多，因为我们还没有为 Backbone 视图定义要渲染的模板。然而，它确实建立了应用程序结构，我们可以开始基于此改进工作流程。在当前状态下，向应用程序添加新模块相对容易：创建一个新文件，然后添加对它的引用。但是，我们没有优化生产环境中\
    \ JavaScript 代码的流程。让我们更新`Gruntfile`以优化出现在`dist`文件夹中的 JavaScript。\n\n首先，让我们引入一个新的`Grunt.js`插件来将我们的`require.js`模块编译到单个文件中。如前一章所述，在生产环境中，您希望尽量减少\
    \ HTTP 调用次数，这意味着更少的资源。在我们的特定示例中，如果我们能够在生产环境中合并 JavaScript 文件，我们将把连接数从 11 个减少到\
    \ 1 个。我们将使用的`Grunt.js`插件称为`grunt-contrib-requirejs`。该插件可用于自动化运行`require.js`优化器。`require.js`优化器旨在解析使用\
    \ AMD 模块的 JavaScript 应用程序，并将这些模块合并到单个文件中。除此之外，优化器还可以使用名为`Uglify`的库来压缩合并后的 JavaScript。清单\
    \ 4-13 演示了`grunt-contrib-requirejs`的配置。\n\n**清单 4-13**. 添加`grunt-contrib-requirejs`配置\n\
    \n```\nrequirejs: {\n  dist: {\n    options: {\n      baseUrl: 'app/',\n     \
    \ name: '../.tmp/concat/js/main',\n      out: 'dist/js/main.js',\n      optimize:\
    \ 'uglify2',\n      paths: {\n        backbone: 'bower_components/backbone/backbone',\n\
    \        bootstrap: 'bower_components/bootstrap/dist/js/bootstrap',\n        jquery:\
