  trans: '

    Grunt 可以自动化从单元测试到系统测试各个级别的测试工作。在接下来的几节中，我们将探索如何设置 Grunt 任务来运行单元测试、在不同浏览器中运行测试、验证应用程序的无障碍性，并最终进行性能测试。


    ## 编写第一个测试


    让我们从最基本的单元测试开始，踏上使用 Grunt 自动化各种应用程序测试的旅程。市面上有多种测试框架可供选择。在本例中，我们将使用 `nodeunit`。`Nodeunit`
    是一个简单但健壮的测试框架，它支持异步运行测试，并支持多种报告格式。有一个名为 `grunt-contrib-nodeunit` 的 Grunt 插件可以封装
    `nodeunit` 包。清单 6-9 展示了如何将该插件添加到项目中。


    ***清单 6-9***. 安装 `grunt-contrib-nodeunit`


    ```

    npm install --save-dev grunt-contrib-nodeunit

    ```


    接下来，需要将任务配置添加到我们的 `Gruntfile.js` 文件中（见清单 6-10）。


    ***清单 6-10***. `grunt-contrib-nodeunit` 的配置


    ```

    nodeunit: {

        all: [''test/*_test.js''],

        options: {

          reporter: ''junit'',

          reporterOptions: {

            output: ''out''

          }

        }

      }

    ```


    清单 6-10 中的配置定义了一个目标，该目标将查找 `test` 文件夹中所有以 `test.js` 结尾的文件。例如，如果 `item_test.js`、`list_test.js`
    和 `user_test.js` 文件存在于 `test` 文件夹中，则它们都将匹配该模式。此外，还设置了其他配置选项，用于配置测试运行器的输出。在这个实例中，测试运行器被配置为使用
    JUnit 格式化程序输出结果，并且输出结果应存储在 `out` 目录中。


    如果现在运行该任务，由于当前没有 `test` 文件夹或任何已编写的测试，我们将得到类似于图 6-6 所示的输出。接下来，我们将创建一个简单的 JavaScript
    模块，用于表示待办事项列表中的一个项目。清单 6-11 包含了该待办事项模块的定义，该模块扩展了 `Backbone.Model` 模块。


    ![9781484200148_Fig06-06.jpg](img/00044.jpeg)


    图 6-6. 在未定义任何测试的情况下运行 `grunt-contrib-nodeunit`


    ***清单 6-11***. 表示待办事项的简单 JavaScript 模块


    ```

    /**

      *

      * @name Todo

      * @classdesc Todo Model

      * @author James Cryer

      * @exports Backbone.Model

      */

    ''use strict'';


    var Backbone = require(''backbone'');


    module.exports = Backbone.Model.extend({

      defaults: {

        ''title'': '''',

        ''date'': ''19/02/2015'',

        ''complete'': false

      },


    complete: function () {

        this.set(''complete'', true);

      }

    });

    ```


    `Todo` 模块定义了一组默认属性：`title`、`date` 和 `complete` 状态。此外，还定义了一个用于将 `Todo` 模块实例标记为已完成的函数。`Backbone.Model`
    模块使得为 `Todo` 模块的每个实例轻松定义属性默认值成为可能。


    `complete` 函数使用 `Backbone.Model` 提供的 `set()` 函数来修改 `Todo` 模块实例的属性。清单 6-12 提供了一个如何在应用程序中使用这个简单模块的示例。这个简单的示例创建了一个
    `Todo` 模块的新实例，并传入了 `title` 和必须完成的 `date`。创建待办事项后，我们将其设置为已完成。目前，除非我们在浏览器中运行它，否则我们没有办法验证新的
    `Todo` 模块是否按预期工作。现在，让我们结合使用 `nodeunit` 和 `grunt-contrib-nodeunit` 来编写一个测试，这样每次我们对模块进行更改时都可以运行它。


    ***清单 6-12***. 使用 `Todo` 模块的示例


    ```

    define([

      ''js/model/todo''

    ], function (Todo) {

      var todo = new Todo({

        ''title'': ''buy groceries'',

        ''date'': ''20/02/2015''

      });

      todo.complete();

    });

    ```


    为了创建我们的第一个测试，我们必须首先在应用程序的根目录下创建一个新文件夹。在测试文件夹中创建一个与应用程序代码相匹配的镜像结构通常非常有用。为了保持测试文件夹结构与应用程序文件夹同步，最好在新创建的
    `test` 文件夹内创建一个 `models` 文件夹。在 `models` 文件夹中，我们将为 `Todo` 模块创建第一组测试。该文件应命名为 `todo_test.js`，以便与我们在
    Grunt 配置中定义的模式相匹配。清单 6-13 包含了测试模块的内容。


    ***清单 6-13***. 第一个测试：确认 `Todo` 模块按预期工作


    ```

    ''use strict'';


    exports.todo = {

          setUp: function (done) {

            var Todo = require(''../../app/js/models/todo'');


    this.todo = new Todo({

              ''title'': ''Test Item'',

              ''date'': ''24/02/2014''

            });

            done();

          },

          item_has_a_title: function (test) {

            test.equal(this.todo.get(''title''), ''Test Item'');

            test.done();

          },

          item_is_not_complete: function (test) {

            test.equal(this.todo.get(''complete''), false);

            test.done();

          },

          item_can_be_completed: function (test) {

            this.todo.complete();

            test.ok(this.todo.get(''complete''));

            test.done();

          }

        };

    ```


    清单 6-13 中显示的测试模块总共包含三个测试：确保项目有标题、确保项目默认未完成、以及确保项目可以被标记为已完成。如果你现在运行 `nodeunit`
    任务，如图 6-7 所示，你将看到总共执行了三个断言。断言不应与测试混淆；每个测试可以有多个断言。通常认为每个测试只做一个断言是最佳实践；然而，这并不是一个金科玉律，而更像是一个原则，旨在鼓励编写仅测试系统一小部分的测试。例如，在我们的测试模块中，我们将检查调用
    `complete` 函数后 `complete` 属性是否被设置为 `true` 的测试拆分开来。我们本可以将此测试与之前检查 `complete` 属性值是否为
    `false` 的测试合并。然而，通过拆分这些测试，如果默认值发生更改或者 `complete` 函数出现故障，将更容易发现问题的原因。


    ![9781484200148_Fig06-07.jpg](img/00045.jpeg)


    图 6-7. 使用 grunt 运行 `nodeunit` 测试


    ## 修改 Nodeunit 的输出


    `grunt-contrib-nodeunit` 的输出非常简洁，仅显示测试总体是否通过、运行的断言数量以及完成测试所花费的时间。由于我们当前选择了 JUnit
    报告器，该插件还会输出包含测试结果的文件的位置。清单 6-14 包含了在项目上运行 `grunt-contrib-nodeunit` 生成的输出。


    ***清单 6-14***. 来自 `grunt-contrib-nodeunit` 的 JUnit 报告器输出示例


    ```

    <?xml version="1.0" encoding="UTF-8" ?>

    <testsuite name="todo_test.js"

               errors="0"

               failures="0"

               tests="3">

      <testcase name="todo - item_has_a_title"></testcase>

      <testcase name="todo - item_is_not_complete"></testcase>

      <testcase name="todo - item_can_be_completed"></testcase>

    </testsuite>

    ```


    运行该插件生成的输出可以在持续集成环境中使用。我们将在本章后面探讨如何设置这样的环境。


    ## 使用 Grunt 进行测试驱动开发

