    提供了一种标准方法来定义易于跨项目重用的 JavaScript 包。每个包都有一个名称、描述、作者以及一组依赖项。


    正如前一章所述，`Grunt` 采用了基于插件的架构，允许开发者在不同项目之间混合搭配任务。为了实现这种极高的灵活性，`Grunt` 利用了 `Node.js`
    和 `npm` 提供的现有模块化机制。每个 `Grunt` 插件都是一个可以使用 `npm` 安装的 `Node.js` 包。


    `npm` 允许开发者定义一个包的依赖项。当其他人安装一个包时，`npm` 会管理该包的安装及其依赖项，因此你无需为此操心。


    在首次了解 `Grunt` 之前，我将介绍 `Node.js` 和 `npm` 的两个关键特性，我们在安装和使用 `Grunt` 时会用到它们。


    ## 查找模块


    `npm` 允许开发者搜索所有 `Node.js` 包的注册表。针对注册表的搜索可以接受一个或多个搜索词。搜索词也可以是正则表达式，这些正则表达式以 `/`
    开头。


    要搜索一个包，请打开命令行或命令提示符并输入：


    ```

    npm search grunt

    ```

