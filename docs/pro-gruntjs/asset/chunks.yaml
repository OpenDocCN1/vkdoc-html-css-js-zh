    \n***Listing 7-13***. 使用 `load-grunt-tasks` 加载 Grunt 插件\n\n```js\nmodule.exports\
    \ = function(grunt) {\n  require('load-grunt-tasks')(grunt);\n};\n```\n\n如 ***Listing\
    \ 7-13*** 所示，与 `matchdep` 模块相比，使用 `load-grunt-tasks` 加载 `Grunt` 插件所需的代码量更少。`Load-grunt-tasks`\
    \ 也支持 `matchdep` 所支持的同系列强大选项，以实现更高级的用法。***Listing 7-14*** 包含了一个示例，演示如何使用 `load-grunt-tasks`\
    \ 基于传递给 `Grunt` 的选项来加载依赖，这与 ***Listing 7-11*** 中使用 `matchdep` 所演示的加载过程相同。\n\n\
    ***Listing 7-14***. 使用选项修改使用 `load-grunt-tasks` 加载的依赖\n\n```js\nmodule.exports\
    \ = function(grunt) {\n\nvar env = grunt.option('environment') || 'dev';\n\n//\
    \ Load dependencies\n  require('load-grunt-tasks')(grunt, {\n    pattern: 'grunt-*',\n\
    \    config: './build/' + env + '.json'\n  });\n\n};\n```\n\n`load-grunt-tasks`\
    \ 接收三个选项：`pattern`、`config` 和 `scope`。`pattern` 选项允许我们通过名称过滤要加载的插件，就像我们之前用 `matchdep`\
    \ 做的那样。`config` 选项允许你指定要加载哪个 JSON 依赖文件。`scope` 选项用于指定你希望在哪种类型的依赖中搜索插件。`scope`\
    \ 选项允许以下值：`dependencies`、`devDependencies`、`peerDependencies` 和 `bundledDependencies`。\n\
    \n## 延迟自动化加载\n\n自动化加载任务的能力不仅简化了向 `Gruntfile` 添加新插件的过程，还让我们能够轻松优化插件的加载。我们现在可以决定在特定时间点加载哪些插件。我们可以将特定插件的加载延迟到某个任务运行时进行。***Listing\
    \ 7-15*** 包含了一个示例，在该示例中，我们直到自定义的图像任务运行时才加载 `grunt-contrib-imagemin` 和 `grunt-spritesmith`。\n\
    \n***Listing 7-15***. 延迟加载开销大的插件直到它们被使用\n\n```js\nmodule.exports = function(grunt)\
    \ {\n\nvar env = grunt.option('environment') || 'dev';\n\nrequire('load-grunt-tasks')(grunt,\
    \ {\n    pattern: ['grunt-*', '!grunt-contrib-imagemin', '!grunt-spritesmith'],\n\
    \    config: './build/' + env + '.json'\n  });\n\ngrunt.registerTask('images',\
    \ [], function () {\n    require('load-grunt-tasks')(grunt, { config: './build/images.json'\
    \ });\n    grunt.task.run('imagemin', 'sprite');\n  });\n\n};\n```\n\n***Listing\
    \ 7-15*** 中有两个根本性的变化。第一个是传递给第一个 `load-grunt-tasks` 调用的 `pattern` 经过了修改，排除了 `grunt-contrib-imagemin`\
    \ 和 `grunt-spritesmith` 插件。第二个变化是定义了一个名为 `images` 的新任务。在该任务的主体内部，我们在告诉 `grunt`\
    \ 运行 `imagemin` 和 `sprite` 任务之前，使用 `load-grunt-tasks` 来加载定义在另一个文件中的图像依赖。这种方法会将\
    \ `grunt-contrib-imagemin` 和 `grunt-spritesmith` 的加载延迟到我们运行 `images` 任务时。将插件的加载延迟到需要时，可以减少运行所有其他任务所花费的时间。\n\
    \n在本节中，我们开始通过自动化加载插件、根据选项切换加载的插件以及将插件加载延迟到需要时，来改进我们加载任务的方式。***Figure 7-4*** 显示了从主任务中移除\
    \ `grunt-contrib-imagemin` 后我们应用的输出。我们的总时间从 11 秒下降到了 9.1 秒。时间的减少并不是特别显著，但演示了如何开始减少你的构建时间。在本章中，我们将通过加入更多优化构建过程的技巧来继续减少时间。\n\
    \n![9781484200148_Fig07-04.jpg](img/00060.jpeg)\n\n***Figure 7-4***. 更改后总运行时间的减少\n\
    \n## 组织你的 Gruntfile\n\n在上一节中，我们优化了如何将插件加载到我们的 `Grunt` 工作流中，并且在此过程中，我们从 `Gruntfile`\
    \ 中移除了 30 行代码。在本节中，我们将从 `Gruntfile` 中移除大约 300 行代码，同时探索以改进的方式管理任务配置的方法。上一节减少了 `Grunt`\
    \ 任务运行所花费的额外时间。本节的目标是使我们的任务配置更易于维护。改进维护的第一步是将我们的任务配置提取到更易于管理的模块中。第二步是将所有硬编码的路径从\
    \ `Grunt` 配置中提取到配置对象中，从而更容易在任务之间共享配置。\n\n### 使用模块\n\n为了进行首次改进，我们将把整个配置从 `Gruntfile`\
    \ 中移出，放入每个任务各自的独立模块中。为了实现这一点，我们将使用 `Grunt` API 的一部分，通过单个 API 调用来加载我们的配置。***Listing\
    \ 7-16*** 包含了更新后的 `Gruntfile`，它通过使用 `grunt.task.loadTasks` 利用 `Grunt` API 来简化我们的\
    \ `Gruntfile`。使用 `grunt.task.loadTasks` 将加载提供的文件夹路径中的所有文件。在我们的示例中，我们将文件夹指定为 `tasks`，因此\
    \ `Grunt` 将尝试加载相对于 `Gruntfile` 的 `tasks` 文件夹内的文件。需要注意的是，我们不再调用 `grunt.initConfig`\
    \ 了。\n\n***Listing 7-16***. 从主 Gruntfile 中移除任务配置\n\n```js\nmodule.exports = function(grunt)\
    \ {\n\n// Measure performance\n  require('time-grunt')(grunt);\n\n// Load main\
    \ tasks\n  require('load-grunt-tasks')(grunt, {\n    pattern: ['grunt-*', '!grunt-contrib-imagemin',\
    \ '!grunt-spritesmith']\n  });\n\n// Custom task for images\n  grunt.registerTask('images',\
    \ [], function () {\n    require('load-grunt-tasks')(grunt, { config: './build/images.json'\
    \ });\n    grunt.task.run('imagemin', 'sprite');\n  });\n\n// Load configuration\n\
    \  grunt.task.loadTasks('tasks');\n};\n```"
- fmt: "`Listing 7-17`包含`tasks`目录中某个文件的内容。在`Listing 7-17`中，我们使用`Grunt`对象通过API调用`grunt.config`为每个任务单独添加配置。`grunt.initConfig`与`grunt.config`的接口不同。`grunt.config`的第一个参数是要更新的属性字符串，第二个参数是与该属性关联的值。在新的设置中，每个任务的配置都存储在单独的文件中。这有助于维护配置，因为每个模块都专注于配置单个任务。将配置任务的职责分散到多个文件中还能提高可读性，并使新团队成员更容易清晰地看到每个任务的配置位置。以前，新团队成员需要翻阅数百行代码来找出负责给定任务的配置部分。在新创建的模块中，配置通常少于20行。`Figure\
    \ 7-5`是`tasks`文件夹中包含的文件的截图。\n\n**`Listing 7-17`**：来自`tasks`文件夹的Grunt模块示例\n\n```\n\
    'use strict';\n\nmodule.exports = function (grunt) {\n  grunt.config(\n    'jshint',\
    \ {\n    options: {\n      jshintrc: true\n    },\n    dist: {\n      src: ['Gruntfile.js',\
    \ 'app/js/**/*.js']\n    },\n    bower: {\n      src: ['app/bower_components/handlebars/handlebars.js']\n\
    \    }\n  });\n};\n```\n\n![9781484200148_Fig07-05.jpg](images/00061.jpeg)\n\n\
    **`Figure 7-5`**：`tasks`文件夹中保存的所有模块\n\n## 使用分组\n\n目前，我们仍然在主`Gruntfile`中定义了默认任务，这是一个庞大的任务列表。下一个针对Grunt工作流的优化是开始将任务分组为逻辑组。这开始为我们的任务运行器添加我们自己的语言，这将帮助我们向团队中的其他人传达构建思路。此外，它允许我们定位特定的一组任务而无需运行所有任务。由于我们已经将任务配置移到了单独的模块中，我们将在`task`文件夹内创建新的模块来保存我们的自定义任务。新创建的模块将命名为`aliases.js`，因为它将包含其他任务的别名。`Listing\
    \ 7-18`显示了新创建模块的内容。\n\n**`Listing 7-18`**：将任务分组为逻辑组以简化任务\n\n```\n'use strict';\n\
    \nmodule.exports = function (grunt) {\n\ngrunt.registerTask('prepare', ['clean',\
    \ 'useminPrepare']);\n  grunt.registerTask('css', ['sass', 'autoprefixer', 'uncss']);\n\
    \  grunt.registerTask('dependencies', ['bowerInstall']);\n  grunt.registerTask('js',\
    \ ['jshint', 'handlebars']);\n  grunt.registerTask('minify', ['copy', 'cssmin',\
    \ 'concat', 'rev', 'requirejs', 'usemin']);\n  grunt.registerTask('build', ['prepare',\
    \ 'dependencies', 'css', 'js', 'minify']);\n\ngrunt.registerTask('default', ['build',\
    \ 'connect:server']);\n  grunt.registerTask('serve', ['build', 'connect:dev']);\n\
    \n};\n```\n\n`Listing 7-18`中的模块定义了许多新任务。每个任务执行一个或多个其他任务。通过分组任务，我们可以开始为特定任务构建更灵活的任务运行器。在我们的示例中，我们有一个通用的`build`任务，用于准备开发和发布环境的应用程序。通过定义一个`build`任务，我们可以通过简单地更改最后运行的任务来轻松加载应用程序进行测试或开发。现在我们有一套基本的构建应用程序的步骤，添加新任务变得轻而易举。例如，让我们添加一个测试任务，如`Listing\
    \ 7-19`所示。\n\n**`Listing 7-19`**：通过基本的构建步骤，添加新任务要容易得多\n\n```\ngrunt.register('test',\
    \ ['build', 'karma']);\n```"
  raw: '[Listing 7-17](#part0014.html#list17) contains the contents of one of the
    files inside the tasks directory. In [Listing 7-17](#part0014.html#list17), we
    use the Grunt object to add the config for each task individually, using the API
    call grunt.config. The interface for grunt.initConfig and grunt.config differs.
    grunt.config’s first parameter is the string of the property to be updated, while
    the second parameter is the value to associate with the property. In the new setup,
    the configuration for each task is stored in an individual file. This helps to
    maintain the configuration, as each module is focused on the task of configuring
    a single task. Splitting the responsibility of configuring our tasks over multiple
    files also improves the readability and makes it easier for new team members to
    clearly see where the configuration for each task lies. Previously, new team members
    would have to trawl through hundreds of lines of code to identify the part the
    configuration responsible for a given task. In the newly created modules, the
    configuration is typically fewer than 20 lines. [Figure 7-5](#part0014.html#Fig5)
    is a screenshot of the files contained within the tasks folder.


    [***Listing 7-17***](#part0014.html#_list17). Example Grunt Module from the tasks
    Folder


    ```

    ''use strict'';


    module.exports = function (grunt) {

      grunt.config(

        ''jshint'', {

        options: {

          jshintrc: true

        },

        dist: {

          src: [''Gruntfile.js'', ''app/js/**/*.js'']

        },

        bower: {

          src: [''app/bower_components/handlebars/handlebars.js'']

        }

      });

    };

    ```


    ![9781484200148_Fig07-05.jpg](images/00061.jpeg)


    [Figure 7-5](#part0014.html#_Fig5). All modules held within the tasks folder


    Using Groups


    At present, we still have the definition of our default task within the main Gruntfile,
    and it is a large list of tasks. The next optimization to our Grunt workflow is
    to start grouping tasks into logical groups. This starts to add our own language
    to our task runner, which will help us communicate the ideas of our build to others
    on the team. In addition, it will allow us to target a specific set of tasks without
    running all the tasks. As we’ve moved the task configuration into separate modules,
    we’ll create new modules within the task folder to hold our custom tasks. The
    new module created will be named aliases.js, as it will contain our aliases for
    other tasks. [Listing 7-18](#part0014.html#list18) shows the contents of the newly
    created module.


    [***Listing 7-18***](#part0014.html#_list18). Simplify Tasks by Grouping Them
    into Logical Groups


    ```

    ''use strict'';


    module.exports = function (grunt) {


    grunt.registerTask(''prepare'', [''clean'', ''useminPrepare'']);

      grunt.registerTask(''css'', [''sass'', ''autoprefixer'', ''uncss'']);

      grunt.registerTask(''dependencies'', [''bowerInstall'']);

      grunt.registerTask(''js'', [''jshint'', ''handlebars'']);

      grunt.registerTask(''minify'', [''copy'', ''cssmin'', ''concat'', ''rev'', ''requirejs'',
    ''usemin'']);

      grunt.registerTask(''build'', [''prepare'', ''dependencies'', ''css'', ''js'',
    ''minify'']);


    grunt.registerTask(''default'', [''build'', ''connect:server'']);

      grunt.registerTask(''serve'', [''build'', ''connect:dev'']);


    };

    ```


    The module in [Listing 7-18](#part0014.html#list18) defines a number of new tasks.
    Each task performs one or more other tasks. By grouping tasks together, we can
    start to build more flexible task runners for specific tasks. In our example,
    we have a generic build task that prepares the application for development and
    release. By defining a build task, we can easily load the application for testing
    or for development by simplify changing the last task that is run. Now that we
    have a basic set of steps to build our application, it is painless to add new
    tasks. For instance, let’s add a test task, as shown in [Listing 7-19](#part0014.html#list19).


    [***Listing 7-19***](#part0014.html#_list19). Adding a New Task Is a Lot Easier
    with a Basic Number of Steps to Build an Application


    ```

    grunt.register(''test'', [‘''build'', ''karma'']);

    ```'
