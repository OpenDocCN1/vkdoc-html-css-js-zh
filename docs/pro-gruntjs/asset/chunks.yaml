- fmt: '# The Improved Front-End Workflow


    There is no denying that tools available for front-end engineers have dramatically
    improved over the last 24 months. One particular project that has seen substantial
    development by the community is `Yeoman`. Coined as a workflow instead of a framework,
    `Yeoman` consists of three key components: `Yo`, `Grunt`, and `Bower`. `Grunt`
    is a key player in the `Yeoman` project, and, as illustrated later in the book,
    combining `Yo` and `Grunt` together provides the ability to rapidly scaffold projects
    that include an automated build process.


    ## Versioning


    Another key benefit of using `Grunt` is that your tasks are versioned along with
    their configuration. As `Grunt` tasks within a project are installed by `npm`,
    these are easily managed using `npm` itself. In addition to this, the configuration
    changes are clearly visible to the whole team as they are versioned with the project.
    This builds a toolset that the whole team can learn, develop, and benefit from.


    ![Image](images/00006.jpeg) **Note** `npm` is a package manager for JavaScript,
    allowing developers to easily share and reuse JavaScript modules. `npm` handles
    the versioning, dependencies, and publishing of packages. Each package has metadata
    defined in a JSON configuration file, called `package.json`, which contains information
    such as name, description, version, authors, and dependencies.


    ## Readability


    Another factor contributing to `Grunt`’s rapid growth in popularity is its readability.
    `Grunt`’s task configuration is a simple JSON configuration object, making it
    highly readable and understandable.


    `Grunt` also promotes the development technique of Don’t Repeat Yourself (DRY),
    as tasks can use variables as part of their configuration. As you’ll see later
    in the book, this also improves the readability of task configuration.


    A further benefit of having a readable task runner is to dramatically reduce the
    time required for new team members to get up to speed on how the build process
    works.


    ## Alternatives


    It’s good to be aware that `Grunt` wasn’t the first task runner to automate developer
    workflow. There are a number of alternatives; however, `Grunt` stands tall among
    them, due to its vast ecosystem, simplicity, and speed. We’ll briefly look at
    a few popular alternatives before delving into `Grunt`.


    ### Ant


    Formally known as `Apache Ant`, “Ant” is a Java-based build tool. Rather than
    specifying tasks using JavaScript, tasks are defined in an XML file in your project.
    `Ant` comes packaged with more than 100 built-in tasks, such as concatenation
    of files, gzipping files, and replacing contents within a file. However, these
    tasks are slightly more oriented toward a build process for a Java project. For
    example, if you want to support JavaScript linting, you will have to include a
    new task. To add such tasks, `Ant` requires the new tasks to be compiled as JAR
    files and referenced from the XML configuration. For those unfamiliar with Java,
    this might be a little daunting when you first get started. `Grunt` might be a
    better fit if your project doesn’t require Java as part of the build process,
    as this adds an unnecessary dependency to the project.


    You may consider choosing `Grunt` over `Ant` owing to the configuration format
    use: JSON instead of XML. Reading an `Ant` build file feels a little bloated,
    and it isn’t obvious at a glance how a build process hangs together, while `Grunt`’s
    JSON is leaner, and tasks can be combined into logical names.


    ### Rake


    `Rake` is the Ruby community’s answer to Make files. `Rake` allows developers
    to define tasks using Ruby syntax. Anybody who has used the `Ruby on Rails` framework
    should be reasonably familiar with `Rake`, as it’s used as the tool of choice
    for tasks such as the creation of databases, running tests, and compiling static
    assets.


    `Rake` does not have a concept of task configuration. Instead, it opts for tasks
    that define and execute Ruby to achieve its goals. For example, there are no repositories
    of recipes or plug-ins available to perform common tasks. If you want to concatenate
    and lint your JavaScript, you will have to start from scratch and write your task
    before you can use it. This will obviously make it more costly to get started
    on your projects, as `Rake` doesn’t offer anything up front. It is up to you to
    ensure that your tasks are highly configurable to increase reuse across projects.


    `Grunt` solves the problem of having to reinvent the wheel by offering a wide
    selection of plug-ins. In addition, `Grunt` also promotes the concept of configuration
    over code, by providing a rich API for supporting task configuration.


    ### Gulp


    `Gulp` is a relatively new tool that is, like `Grunt`, JavaScript-based. Another
    similarity between `Grunt` and `Gulp` is the modular-based architecture, powered
    by the use of `npm` as a dependency manager. `Gulp`, like `Grunt`, is easy to
    get started; however, arguably, `Gulp` has more succinct task definition, as tasks
    are expressed in code instead of configuration.


    There have been several blog posts that pit `Grunt` and `Gulp` against each other.
    However, there have also been counter arguments stating that both tools can coexist,
    owing to differences in how they achieve a common set of goals. `Gulp` is faster
    than `Grunt`, yet the barrier to entry is a little higher, due to its use of Node
    streams.


    ![Image](images/00006.jpeg) **Note** `Grunt` combines tasks in which the output
    of one task produces a temporary file that is picked up by the next task for processing.
    `Gulp` doesn’t produce these temporary files; files are piped between each task.


    ## Summary


    In this chapter, you’ve received a basic overview of what `Grunt` is and how projects
    can benefit from using it. You’ve also explored how `Grunt` compares to similar
    alternatives available. This book should provide you with an understanding of
    how to set up and use `Grunt` on your projects, allowing you to rapidly lint,
    test, and optimize your applications.


    # CHAPTER 2


    ![image](images/00005.jpeg)


    # How to Use Grunt in Your Project


    In the previous chapter, you received a brief introduction to `Grunt` and the
    benefits of using `Grunt` in your projects. This chapter will take a more detailed
    look at `Grunt`, how to install `Grunt`, and how to use `Grunt` in your projects.
    Before looking at `Grunt` itself, it is important to have a good understanding
    of `Node.js`. `Grunt` is built on top of `Node.js`, so having a good understanding
    of `Node.js` and how modules operate within `Node.js` will make learning and understanding
    `Grunt` easier.


    ## Node.js


    `Node.js` is an application platform that allows developers to implement event-driven
    applications built on top of Chrome’s JavaScript engine, V8. As many of you will
    know, JavaScript originated as a client-side language; it was used to implement
    interactive interfaces. `Node.js` utilizes JavaScript as a scripting language
    on the server side and achieves high scalability through non-blocking I/O operations.
    To achieve non-blocking I/O operations, `Node.js` applications use asynchronous
    execution, whereas, traditionally, applications execute code in a given sequence.
    Non-blocking I/O is a process that allows other processing to continue while waiting
    for a response from an expensive I/O operation. For example, if a `Node.js` application
    sends a request to a remote HTTP service for data, it does not wait for a response
    before processing other requests. Upon the request being sent to the remote HTTP
    service, the `Node.js` application will continue to process other requests before
    returning to the original routine, once the remote HTTP service has responded.
    This ability to continue processing other requests while waiting for I/O operations
    can provide significant performance improvements.'
