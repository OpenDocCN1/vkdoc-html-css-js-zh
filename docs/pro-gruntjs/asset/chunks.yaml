    In the preceding example, the Bower package is installed by the package’s name.
    However, this can be replaced with a URL for the Git repository, svn repository,
    zip file, or tar file.


    In addition to install packages, Bower offers the ability to search for packages
    via the command line. [Figure 3-3](#part0010.html#Fig3) shows a sample search
    for Twitter Bootstrap. Matching results contain the package name and the URL that
    the package is available from.


    ![9781484200148_Fig03-03.jpg](images/00022.jpeg)


    [Figure 3-3](#part0010.html#_Fig3). Using Bower to search for front-end packages


    As mentioned previously, the folder in which Bower installs packages can be controlled
    by settings within your .bowerrc file. [Listing 3-25](#part0010.html#list25) demonstrates
    how to modify the folder by showing the contents of a .bowerrc file. The .bowerrc
    file should be saved in the root of the project, alongside the bower.json file.


    [***Listing 3-25***](#part0010.html#_list25). bowerrc File to Install Bower Packages
    to a Specific Folder


    ```

    {

      "directory": "build/bower_components"

    }

    ```


    Running the bower install command will not lead to components being installed
    into the build folder.


    This concludes the brief introduction to Bower. It is an extremely powerful tool
    that can help when working with lots of front-end frameworks. Next you will see
    how we can use Grunt and Bower to automate insertion of the Bower components into
    our page as they are installed.


    Bower with Grunt


    Bower is an amazing tool without Grunt, but when used together, it can dramatically
    reduce the time required to scaffold your front-end dependencies. The plug-in
    that bridges the gap between Bower and Grunt is called grunt-bower-install. The
    grunt-bower-install plug-in can be used to automate the injection of front-end
    JavaScript and CSS files that have been installed by Bower into your HTML. To
    achieve this, grunt-bower-install relies on wiredep, a Node module. When wiredep
    is run over your source files, it looks for special comments in the HTML. If it
    finds a comment, it will inject the relevant tag into the HTML.


    First, let’s update the Gruntfile.js to use the new plug-in. Don’t forget that
    you’ll also have to install this plug-in. [Listing 3-26](#part0010.html#list26)
    shows the updated Grunt file with the task added.


    [***Listing 3-26***](#part0010.html#_list26). bowerrc File to Install Bower Packages
    to a Specific Folder


    ```

    /*global module:false*/

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        // Task configuration.

        ...


    bowerInstall: {

          dist: {

            src: [''*.html''],

            dependencies: true,

            devDependencies: true,

            exclude: []

          }

        }

      });


    // These plugins provide necessary tasks.

      grunt.loadNpmTasks(''grunt-contrib-sass'');

      grunt.loadNpmTasks(''grunt-bower-install'');


    // Default task.

      grunt.registerTask(''default'', [''sass'', ''bower-install'']);

    };

    ```


    [Listing 3-26](#part0010.html#list26) introduces a new task, bowerInstall, with
    a target of dist. This target has a number of options, the first being the src.
    The grunt-bower-install plug-in updates the HTML; therefore, it does not require
    a destination file. The next two options determine which dependencies should be
    injected into the HTML. Dependencies are the production and development dependences,
    while devDependencies relates to Bower packages that are only required for development.
    The final option is exclude, which is empty in our example but can be used to
    exclude particular libraries from being processed by the plug-in. A number of
    additional options are available for this plug-in, including the ability to inject
    imports into Sass files.


    Before running the task on the project, there is one final step: updating the
    HTML. [Listing 3-27](#part0010.html#list27) contains the HTML file that we first
    saw at the start of the chapter, but with jQuery removed from the footer. In place
    of jQuery, a new comment has been added for wiredep to use while processing the
    HTML file.


    [***Listing 3-27***](#part0010.html#_list27). HTML Modifications to Support the
    grunt-bower-install Plug-in


    ```

    <!doctype html>

    <html class="no-js">

    <head>

    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Pro Grunt.js: Todo List</title>

    <meta name="description" content="">

    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- bower:css -->

    <!-- endbower -->

    <link rel="stylesheet" href="css/main.css">


    </head>

    <body>

        <!--[if lt IE 8]>

        <p class="browsehappy">You are using an <strong>outdated</strong> browser.
    Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your
    experience.</p>

        <![endif]-->


    <!-- Add your site or application content here -->

       <h1>Pro Grunt.js</h1>

       <h2>Todo List</h2>


    <!-- bower:js -->

       <!-- endbower -->

       <script src="js/main.js"></script>

    </body>

    </html>

    ```


    The comments added before the final script tag at the end of the body is a placeholder
    for wiredep to inject references to the Bower components into the outputted HTML
    file. To run the task, use the command shown in [Listing 3-28](#part0010.html#list28).


    [***Listing 3-28***](#part0010.html#_list28). Running grunt-bower-install


    ```

    grunt bowerInstall

    ```


    As the task runs it should notify of any files that it is update as it runs. In
    our example, this should be the index.html file. Once the task has completed,
    if you open the index.html file, references to jQuery, Backbone.js, and Underscore.js
    will have been added between the bower. js comments. [Listing 3-29](#part0010.html#list29)
    contains a snippet of the HTML after the task has run.


    [***Listing 3-29***](#part0010.html#_list29). index.html Snippet after Grunt Task


    ```

    <!-- bower:js -->

    <script src="build/bower_components/jquery/dist/jquery.js"></script>

    <script src="build/bower_components/underscore/underscore.js"></script>

    <script src="build/bower_components/backbone/backbone.js"></script>

    <!-- endbower -->

    ```


    At this point, this might not appear that useful, but imagine a scenario in which
    you return to a project three months from now. There is a new framework you want
    to use for your project. It takes two commands to download and inject the framework
    into our page.


    Linting


    So far, we’ve seen how to generate CSS and import third-party libraries. Both
    the tasks generate some output or modify a file within your project. In this section,
    you will see how Grunt can provide tools to validate our HTML and CSS to adhere
    to a common set of rules.'
  trans: '

    这将把流行的 JavaScript MVC 框架 `Backbone.js` ([`backbonejs.org/`](http://backbonejs.org/))
    安装到 `bower_components` 文件夹中。由于 `Backbone.js` 包定义了对 `Underscore.js` 库的依赖，`Bower`
    也会在单个命令中为我们安装它。清单 3-24 展示了在 清单 3-23 中的命令成功执行后的 `bower.json` 文件。


    ***清单 3-24***. 安装 Backbone.js 后的 bower.json


    ```

    {

      "name": "todo-app",

      "dependencies": {

        "jquery": "~2.1.0",

        "backbone": "~1.1.2"

      }

    }

    ```


    在前面的例子中，`Bower` 包是通过包名安装的。但是，这可以替换为 Git 仓库、SVN 仓库、zip 文件或 tar 文件的 URL。


    除了安装包，`Bower` 还提供了通过命令行搜索包的功能。图 3-3 展示了对 `Twitter Bootstrap` 的搜索示例。匹配结果包含包名和包的可用
    URL。


    ![9781484200148_Fig03-03.jpg](img/00022.jpeg)


    图 3-3. 使用 Bower 搜索前端包


    如前所述，`Bower` 安装包的文件夹可以通过 `.bowerrc` 文件中的设置来控制。清单 3-25 通过显示 `.bowerrc` 文件的内容来演示如何修改文件夹。`.bowerrc`
    文件应保存在项目的根目录中，与 `bower.json` 文件一起。


    ***清单 3-25***. 将 Bower 包安装到特定文件夹的 bowerrc 文件


    ```

    {

      "directory": "build/bower_components"

    }

    ```


    运行 `bower install` 命令不会导致组件被安装到 `build` 文件夹中。


    这就结束了关于 `Bower` 的简要介绍。它是一个非常强大的工具，在处理大量前端框架时会很有帮助。接下来，你将看到如何结合使用 `Grunt` 和 `Bower`，在
    `Bower` 组件安装后自动化地将它们插入到我们的页面中。


    ## Bower 与 Grunt


    没有 `Grunt` 的 `Bower` 已经是一个很出色的工具，但当它们一起使用时，可以显著减少搭建前端依赖所需的时间。连接 `Bower` 和 `Grunt`
    的插件叫做 `grunt-bower-install`。`grunt-bower-install` 插件可用于自动注入由 `Bower` 安装到 HTML
    中的前端 JavaScript 和 CSS 文件。为了实现这一点，`grunt-bower-install` 依赖于一个 Node 模块 `wiredep`。当
    `wiredep` 运行于你的源文件时，它会查找 HTML 中的特殊注释。如果找到注释，它会将相关的标签注入到 HTML 中。


    首先，让我们更新 `Gruntfile.js` 以使用这个新插件。不要忘记你也需要安装这个插件。清单 3-26 展示了添加了该任务后的更新版 `Gruntfile`
    文件。


    ***清单 3-26***. 将 Bower 包安装到特定文件夹的 bowerrc 文件


    ```

    /*global module:false*/

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        // Task configuration.

        ...


    bowerInstall: {

          dist: {

            src: [''*.html''],

            dependencies: true,

            devDependencies: true,

            exclude: []

          }

        }

      });


    // These plugins provide necessary tasks.

      grunt.loadNpmTasks(''grunt-contrib-sass'');

      grunt.loadNpmTasks(''grunt-bower-install'');


    // Default task.

      grunt.registerTask(''default'', [''sass'', ''bower-install'']);

    };

    ```


    清单 3-26 引入了一个新任务 `bowerInstall`，其目标是 `dist`。这个目标有几个选项，第一个是 `src`。`grunt-bower-install`
    插件会更新 HTML；因此它不需要目标文件。接下来的两个选项决定了哪些依赖应该被注入到 HTML 中。`Dependencies` 是生产和开发依赖，而 `devDependencies`
    则仅与开发所需的 `Bower` 包相关。最后一个选项是 `exclude`，在我们的例子中是空的，但可以用来排除特定库，使其不被插件处理。该插件还有许多其他可用选项，包括向
    Sass 文件注入导入语句的能力。


    在项目上运行该任务之前，还有最后一步：更新 HTML。清单 3-27 包含了我们在本章开头首次看到的 HTML 文件，但已从页脚中移除了 `jQuery`。取而代之的是添加了一条新的注释，供
    `wiredep` 在处理 HTML 文件时使用。


    ***清单 3-27***. 支持 grunt-bower-install 插件的 HTML 修改


    ```

    <!doctype html>

    <html class="no-js">

    <head>

    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Pro Grunt.js: Todo List</title>

    <meta name="description" content="">

    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- bower:css -->

    <!-- endbower -->

    <link rel="stylesheet" href="css/main.css">


    </head>

    <body>

        <!--[if lt IE 8]>

        <p class="browsehappy">You are using an <strong>outdated</strong> browser.
    Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your
    experience.</p>

        <![endif]-->


    <!-- Add your site or application content here -->

       <h1>Pro Grunt.js</h1>

       <h2>Todo List</h2>


    <!-- bower:js -->

       <!-- endbower -->

       <script src="js/main.js"></script>

    </body>

    </html>

    ```


    在 `body` 末尾的最后一个 `script` 标签之前添加的注释，是 `wiredep` 用来将 `Bower` 组件的引用注入到输出 HTML 文件中的占位符。要运行该任务，请使用
    清单 3-28 中所示的命令。


    ***清单 3-28***. 运行 grunt-bower-install


    ```

    grunt bowerInstall

    ```


    当任务运行时，它会通知其在运行时更新了哪些文件。在我们的示例中，这应该是 `index.html` 文件。任务完成后，如果你打开 `index.html`
    文件，你会发现对 `jQuery`、`Backbone.js` 和 `Underscore.js` 的引用已被添加到 `bower:js` 注释之间。清单
    3-29 包含了任务运行后的 HTML 片段。


    ***清单 3-29***. Grunt 任务执行后的 index.html 片段


    ```

    <!-- bower:js -->

    <script src="build/bower_components/jquery/dist/jquery.js"></script>

    <script src="build/bower_components/underscore/underscore.js"></script>

    <script src="build/bower_components/backbone/backbone.js"></script>

    <!-- endbower -->

    ```


    目前看来，这或许没什么用，但想象一个场景：你在三个月后回到一个项目中。你有一个想要在项目中使用的新的框架。只需两个命令就能将其下载并注入到你的页面中。


    ## 代码检查


    到目前为止，我们已经看到了如何生成 CSS 和导入第三方库。这两个任务都会生成一些输出或修改项目中的某个文件。在本节中，你将看到 `Grunt` 如何提供工具来验证我们的
    HTML 和 CSS，使其遵循一套通用的规则。

    '
- fmt: "# 为团队制定 CSS 标准\n\n尽管开发者社区普遍认为，随着浏览器厂商在官方标准最终确定前就努力实现最新特性（这可能会使验证复杂化），HTML\
    \ 验证已失去一些相关性，但这不应阻止团队为 HTML 和 CSS 设定一个基线标准。拥有完善标准的团队能更快地让新成员上手，因为他们有了一套可遵循的规则，且当前的\
    \ HTML 和 CSS 也遵循着相似的模式。\n\n## 为你的 CSS 设定标准\n\n让我们介绍来自 Twitter 团队的另一个工具 `RECESS`。`RECESS`\
    \ 是一个 Node 命令行工具，它可以检查（lint）或从 LESS 文件构建你的 CSS。`RECESS` 会检查你的 CSS，确保样式整洁一致。在执行检查时，它会应用一系列规则检查你的\
    \ CSS。以下是这些规则的列表：\n\n- **无 ID**：CSS 不应包含 ID 选择器。\n- **无 JS 前缀**：CSS 不应包含以 `.js-`\
    \ 开头的类选择器。\n- **选择器不过度限定**：CSS 不应包含过度限定的选择器，例如 `div#home.page`。\n- **无下划线**：CSS\
    \ 类选择器的名称不应包含下划线。\n- **无通配选择器**：CSS 不应包含 `*` 选择器。\n- **无带单位的零值**：CSS 不应包含带有单位的零值属性。例如，`padding:\
    \ 0px;` 是无效的，而应使用 `padding: 0`。\n- **严格的属性顺序**：CSS 应遵循 `RECESS` 的属性顺序规则。\n\n`RECESS`\
    \ 可作为独立的 Node 命令行类工具使用。不过，已经有一个 Grunt 插件包装了该 Node 工具，使得 CSS 检查可以自动化。该 Grunt 插件的名称是\
    \ `grunt-recess`。[列表 3-30](#part0010.html#list30) 展示了修改后的项目 Gruntfile，其中包含了 `RECESS`。\n\
    \n[***列表 3-30***](#part0010.html#_list30). 修改后的 Gruntfile，包含 RECESS\n\n```javascript\n\
    /*global module:false*/\nmodule.exports = function(grunt) {\n\n// Project configuration.\n\
    \  grunt.initConfig({\n    // Task configuration.\n    ...\n    recess: {\n  \
    \    dist: {\n        options: {\n          compile: false,\n          noIDs:\
    \ true\n        },\n        files: {\n          'src': 'css/main.css',\n     \
    \ }\n    }\n  });\n\n// These plugins provide necessary tasks.\n  grunt.loadNpmTasks('grunt-bower-install');\n\
    \  grunt.loadNpmTasks('grunt-contrib-sass');\n  grunt.loadNpmTasks('grunt-recess');\n\
    \n// Default task.\n  grunt.registerTask('default', ['sass', 'bower-install',\
    \ 'recess']);\n\n};\n```\n\n在上面的 Gruntfile 中，我们添加了 `RECESS` 任务并附带了一些新配置。为了与其他任务保持一致，我们定义了一个目标\
    \ `dist`。对于这个目标，我们将 `compile` 选项设置为 `false`。`RECESS` 能够编译 LESS 和 CSS，并按照其规则重组规则。由于我们通过\
    \ Sass 生成 CSS，因此将此选项设置为 `false`。另一个设置的选项是 `noIDs`。这对应于 `RECESS` 应用的一组规则。将 `noIDs`\
    \ 设置为 `true` 将导致 `RECESS` 在 CSS 包含 ID 选择器时报告无效 CSS。这在[图 3-4](#part0010.html#Fig4)\
    \ 中展示。\n\n![9781484200148_Fig03-04.jpg](images/00023.jpeg)\n\n[图 3-4](#part0010.html#_Fig4).\
    \ 由于 ID 选择器导致的 RECESS 任务失败\n\n其余的配置定义了我们要 `RECESS` 处理的文件。由于此任务不生成文件输出，我们只需定义源文件，不需要目标文件。添加此任务后，每次运行\
    \ `grunt` 命令时，我们的 Sass 将被编译，CSS 输出到 `css/main.css`。之后，`RECESS` 将处理我们的 CSS，以确保其整洁一致。\n\
    \n目前，`RECESS` 任务只寻找单个 CSS 文件。然而，Grunt 能够在文件路径中使用通配符来匹配多个文件。[列表 3-31](#part0010.html#list31)\
    \ 演示了如何在文件路径中使用通配符。\n\n[***列表 3-31***](#part0010.html#_list31). 使用通配符匹配多个 CSS\
    \ 文件\n\n```javascript\nrecess: {\n  dist: {\n    options: {\n      compile: false,\n\
    \      noIDs: true\n    },\n    files: {\n      'src': 'css/**/*.css',\n  }\n\
    }\n```\n\n通过做出[列表 3-31](#part0010.html#list31) 中概述的这一小改动，我们可以向 `css` 文件夹添加更多 CSS\
    \ 文件。除了向 `css` 文件夹添加额外的 CSS 文件外，我们还可以添加包含 CSS 文件的文件夹，Grunt 也将处理这些文件。\n\n我希望，在这一点上，你能开始看到我们如何将不同的任务组合在一起，为整个团队创建一个可重复的流程。\n\
    \n## 前缀（Prefixing）\n\n目前，我们已经拥有一个可重复且可靠的 CSS 生成和检查流程。接下来，我们将探讨如何利用 Grunt 来消除为\
    \ CSS 添加前缀的需求。\n\nCSS 前缀由浏览器厂商引入，旨在让前端工程师能够使用 W3C 标准尚未最终确定的涌现特性。例如，当浏览器厂商最初引入\
    \ CSS 渐变时，标准仍在变化中，且实现方式各不相同。每个浏览器厂商允许开发者通过为 CSS 属性添加前缀，使用自己特定的实现来应用相同的视觉效果。[列表\
    \ 3-32](#part0010.html#list32) 演示了 CSS3 渐变的 CSS 前缀。\n\n[***列表 3-32***](#part0010.html#_list32).\
    \ CSS 前缀\n\n```css\n.super-gradient {\n    background: #7abcff;\n    background:\
    \ -moz-linear-gradient(-45deg,  #7abcff 0%, #60abf8 44%, #4096ee 100%);\n    background:\
    \ -webkit-gradient(linear, left top, right bottom, color-stop(0%,#7abcff),\n \
    \   color-stop(44%,#60abf8), color-stop(100%,#4096ee));\n    background: -webkit-linear-gradient(-45deg,\
    \  #7abcff 0%,#60abf8 44%,#4096ee 100%);\n    background: -o-linear-gradient(-45deg,\
    \  #7abcff 0%,#60abf8 44%,#4096ee 100%);\n    background: -ms-linear-gradient(-45deg,\
    \  #7abcff 0%,#60abf8 44%,#4096ee 100%);\n    background: linear-gradient(135deg,\
    \  #7abcff 0%,#60abf8 44%,#4096ee 100%);\n}\n```\n\n[列表 3-32](#part0010.html#list32)\
    \ 演示了线性 CSS 渐变的不同实现，特别是 FireFox（以 `-moz` 为前缀）和 webkit（以 `-webkit` 为前缀）之间的差异。你可能已经注意到，上述\
    \ CSS 中存在大量重复。社区中的一些开发者反对使用前缀，因为它们会导致 CSS 臃肿，因为每个属性都必须为每个浏览器重复，这很容易使网站所需的 CSS\
    \ 变得臃肿。\n\n为了解决重复这一首要问题，有一个名为 `autoprefixer` 的工具。你可以通过其名称猜到它的功能，但为了澄清，`autoprefixer`\
    \ 解析 CSS，并使用来自流行网站 Can I Use（http://caniuse.com/）的值，为 CSS 规则添加特定于厂商的前缀。`Autoprefixer`\
    \ 是一个 Node 应用程序，可以使用 `npm` 安装，或集成到其他 Node 应用程序中以编程方式使用。[列表 3-33](#part0010.html#list33)\
    \ 展示了如何在命令行中使用 `autoprefixer`。\n\n[***列表 3-33***](#part0010.html#_list33). 命令行中的\
    \ Autoprefixer\n\n```bash\nautoprefixer styles/main.css\n```\n\n前面的命令将解析 CSS 样式表，并将特定于厂商的前缀添加到同一文件中。[列表\
    \ 3-34](#part0010.html#list34) 中的示例展示了使用 `autoprefixer` 前后的对比。\n\n[***列表 3-34***](#part0010.html#_list34).\
    \ 使用 Autoprefixer 时 CSS 的前后对比\n\n```css\n/* Before */\n\nh1 {\n  box-sizing: border-box;\n\
    }\n\n/* After */\n\nh1 {\n  -webkit-box-sizing: border-box;\n  -moz-box-sizing:\
    \ border-box;\n  box-sizing: border-box;\n}\n```"
  raw: 'Although there is a strong feeling in the developer community that HTML validation
    has lost some relevance as browser vendors strive to implement the latest features
    before they are finalized in an official standard that can complicate validation,
    this should not prevent teams from having a baseline standard for both HTML and
    CSS. A team with a solid set of standards can get new members on board more quickly,
    as they have a set of rules to follow, and the current HTML and CSS follow a similar
    pattern.


    Setting a Standard for Your CSS


    Let’s introduce another tool from the Twitter team, RECESS. RECESS is a Node command
    line, too, that can either lint or build your CSS from LESS files. RECESS will
    check your CSS to ensure that styles are tidy and consistent. It applies a number
    of rules against your CSS while linting is performed. Following is a list of these
    rules:


    *   *No IDs*: The CSS should not contain ID selectors.

    *   *No JS Prefixes*: The CSS should not contain class selectors with .js- prepended.

    *   *No over qualifying of selectors*: The CSS should not contain selectors that
    have been overqualified, for example, div#home.page.

    *   *No underscores*: CSS class selectors should not have class names that contain
    underscores.

    *   *No universal selectors*: CSS should not contain a selector of *.

    *   *No zeros with units*: CSS should not contain attribute values of zero that
    have an associated unit. For example, padding: 0px; would be invalid. Instead,
    this should be padding: 0.

    *   *Strict property order*: CSS should conform to RECESS property order.


    RECESS is available as a standalone Node command-like tool. However, there is
    already a Grunt plug-in that wraps the Node tool so that CSS linting can be automated.
    The name of the Grunt plug-in is grunt-recess. [Listing 3-30](#part0010.html#list30)
    shows the project Gruntfile modified to include RECESS.


    [***Listing 3-30***](#part0010.html#_list30). Gruntfile Modified to Include RECESS


    ```

    /*global module:false*/

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        // Task configuration.

        ...

        recess: {

          dist: {

            options: {

              compile: false,

              noIDs: true

            },

            files: {

              ''src'': ''css/main.css'',

          }

        }

      });


    // These plugins provide necessary tasks.

      grunt.loadNpmTasks(''grunt-bower-install'');

      grunt.loadNpmTasks(''grunt-contrib-sass'');

      grunt.loadNpmTasks(''grunt-recess'');


    // Default task.

      grunt.registerTask(''default'', [''sass'', ''bower-install'', ''recess'']);


    };

    ```


    In the preceding Gruntfile, the task for RECESS has been added with some new configuration.
    To keep it in line with our other tasks, we’ve defined a target of dist. For this
    target, we’ve set the compile option to false. RECESS is able to compile LESS
    and CSS, restructuring rules in line with its rules. As we’re generating our CSS
    from Sass, this option has been set to false. The other option set is noIDs. This
    relates back to the set of rules RECESS applies. Setting noIDs to true will lead
    to RECESS reporting invalid CSS if the CSS contains an ID selector. This is shown
    in [Figure 3-4](#part0010.html#Fig4).


    ![9781484200148_Fig03-04.jpg](images/00023.jpeg)


    [Figure 3-4](#part0010.html#_Fig4). Failing RECESS task due to ID selectors


    The remainder of the configuration defines the file we want RECESS to process.
    As this task does not generate a file output, we only have to define a source
    file and no destination. With the addition of this task, each time we run the
    grunt command, our Sass will be compiled with the CSS being output to css/main.css.
    After this, RECESS will process our CSS to ensure it is tidy and consistent.


    Currently, the RECESS task is looking for a single CSS file. However, Grunt has
    the ability to use wildcards within file paths, to match many files. [Listing
    3-31](#part0010.html#list31) demonstrates how to use wildcards within the file
    paths.


    [***Listing 3-31***](#part0010.html#_list31). Using Wildcards to Match Multiple
    CSS Files


    ```

    recess: {

      dist: {

        options: {

          compile: false,

          noIDs: true

        },

        files: {

          ''src'': ''css/**/*.css'',

      }

    }

    ```


    By making this small change, outlined in [Listing 3-31](#part0010.html#list31),
    we can add more CSS files to the css folder. In addition to adding extra CSS files
    to this css folder, we can add folders that contain CSS files, and Grunt will
    process these as well.


    I hope, at this point, that you can begin to see how we can use different tasks
    together to produce a repeatable process for the whole team to use.


    Prefixing


    At this stage, we’ve got a repeatable and reliable process for generating and
    linting our CSS. Next, we’ll explore how we can use Grunt to remove the need to
    prefix our CSS.


    CSS prefixes were introduced by browser vendors to allow front-end engineers to
    use emerging features that had not yet been finalized in a W3C standard. For example,
    when browser vendors originally introduced CSS gradients, the standard was still
    in flux, and the implementations varied. Each browser vendor allowed developers
    to apply the same visual effects, using their own specific implementation, by
    prefixing the CSS property. [Listing 3-32](#part0010.html#list32) demonstrates
    the CSS prefix for a CSS3 gradient.


    [***Listing 3-32***](#part0010.html#_list32). CSS Prefixes


    ```

    .super-gradient {

        background: #7abcff;

        background: -moz-linear-gradient(-45deg,  #7abcff 0%, #60abf8 44%, #4096ee
    100%);

        background: -webkit-gradient(linear, left top, right bottom, color-stop(0%,#7abcff),

        color-stop(44%,#60abf8), color-stop(100%,#4096ee));

        background: -webkit-linear-gradient(-45deg,  #7abcff 0%,#60abf8 44%,#4096ee
    100%);

        background: -o-linear-gradient(-45deg,  #7abcff 0%,#60abf8 44%,#4096ee 100%);

        background: -ms-linear-gradient(-45deg,  #7abcff 0%,#60abf8 44%,#4096ee 100%);

        background: linear-gradient(135deg,  #7abcff 0%,#60abf8 44%,#4096ee 100%);

    }

    ```


    [Listing 3-32](#part0010.html#list32) demonstrates different implementations of
    linear CSS gradients, in particular, the difference between FireFox (prefixed
    with –moz) and webkit (prefixed with –webkit). As you may have noticed, there
    is a lot of repetition in the preceding CSS. Some developers in the community
    are against the use of prefixes, as they can contribute to bloated CSS, as each
    property must be repeated for each browser, which can easily bloat the CSS required
    for a site.


    To solve the first issue, the repetition, there is a tool called autoprefixer.
    You can probably guess what it does by the name, but to clarify, autoprefixer
    parses CSS and adds vendor-specific prefixes to CSS rules using values from the
    popular site Can I Use ([http://caniuse.com/](http://caniuse.com/)). Autoprefixer
    is a Node application that can be installed using npm or integrated to other Node
    applications to be used programmatically. [Listing 3-33](#part0010.html#list33)
    shows how the autoprefixer can be used on the command line.


    [***Listing 3-33***](#part0010.html#_list33). Autoprefixer on the Command Line


    ```

    autoprefixer styles/main.css

    ```


    The preceding command will parse the CSS style sheet and add vendor-specific prefixes
    to the same file. The example in [Listing 3-34](#part0010.html#list34) demonstrates
    a before and after view.


    [***Listing 3-34***](#part0010.html#_list34). Before and After View of CSS When
    Using Autoprefixer


    ```

    /* Before */


    h1 {

      box-sizing: border-box;

    }


    /* After */


    h1 {

      -webkit-box-sizing: border-box;

      -moz-box-sizing: border-box;

      box-sizing: border-box;

    }

    ```'
  trans: "\n# 为团队制定 CSS 标准\n\n尽管开发者社区普遍认为，随着浏览器厂商在官方标准最终确定前就努力实现最新特性（这可能会使验证复杂化），HTML\
    \ 验证已失去一些相关性，但这不应阻止团队为 HTML 和 CSS 设定一个基线标准。拥有完善标准的团队能更快地让新成员上手，因为他们有了一套可遵循的规则，且当前的\
    \ HTML 和 CSS 也遵循着相似的模式。\n\n## 为你的 CSS 设定标准\n\n让我们介绍来自 Twitter 团队的另一个工具 `RECESS`。`RECESS`\
    \ 是一个 Node 命令行工具，它可以检查（lint）或从 LESS 文件构建你的 CSS。`RECESS` 会检查你的 CSS，确保样式整洁一致。在执行检查时，它会应用一系列规则检查你的\
    \ CSS。以下是这些规则的列表：\n\n-   **无 ID**：CSS 不应包含 ID 选择器。\n-   **无 JS 前缀**：CSS 不应包含以\
    \ `.js-` 开头的类选择器。\n-   **选择器不过度限定**：CSS 不应包含过度限定的选择器，例如 `div#home.page`。\n-  \
    \ **无下划线**：CSS 类选择器的名称不应包含下划线。\n-   **无通配选择器**：CSS 不应包含 `*` 选择器。\n-   **无带单位的零值**：CSS\
    \ 不应包含带有单位的零值属性。例如，`padding: 0px;` 是无效的，而应使用 `padding: 0`。\n-   **严格的属性顺序**：CSS\
    \ 应遵循 `RECESS` 的属性顺序规则。\n\n`RECESS` 可作为独立的 Node 命令行类工具使用。不过，已经有一个 Grunt 插件包装了该\
    \ Node 工具，使得 CSS 检查可以自动化。该 Grunt 插件的名称是 `grunt-recess`。列表 3-30 展示了修改后的项目 Gruntfile，其中包含了\
    \ `RECESS`。\n\n***列表 3-30***. 修改后的 Gruntfile，包含 RECESS\n\n```javascript\n/*global\
    \ module:false*/\nmodule.exports = function(grunt) {\n\n// Project configuration.\n\
    \  grunt.initConfig({\n    // Task configuration.\n    ...\n    recess: {\n  \
    \    dist: {\n        options: {\n          compile: false,\n          noIDs:\
    \ true\n        },\n        files: {\n          'src': 'css/main.css',\n     \
    \ }\n    }\n  });\n\n// These plugins provide necessary tasks.\n  grunt.loadNpmTasks('grunt-bower-install');\n\
    \  grunt.loadNpmTasks('grunt-contrib-sass');\n  grunt.loadNpmTasks('grunt-recess');\n\
    \n// Default task.\n  grunt.registerTask('default', ['sass', 'bower-install',\
    \ 'recess']);\n\n};\n```\n\n在上面的 Gruntfile 中，我们添加了 `RECESS` 任务并附带了一些新配置。为了与其他任务保持一致，我们定义了一个目标\
    \ `dist`。对于这个目标，我们将 `compile` 选项设置为 `false`。`RECESS` 能够编译 LESS 和 CSS，并按照其规则重组规则。由于我们通过\
    \ Sass 生成 CSS，因此将此选项设置为 `false`。另一个设置的选项是 `noIDs`。这对应于 `RECESS` 应用的一组规则。将 `noIDs`\
    \ 设置为 `true` 将导致 `RECESS` 在 CSS 包含 ID 选择器时报告无效 CSS。这在图 3-4 中展示。\n\n![9781484200148_Fig03-04.jpg](img/00023.jpeg)\n\
    \n图 3-4. 由于 ID 选择器导致的 RECESS 任务失败\n\n其余的配置定义了我们要 `RECESS` 处理的文件。由于此任务不生成文件输出，我们只需定义源文件，不需要目标文件。添加此任务后，每次运行\
    \ `grunt` 命令时，我们的 Sass 将被编译，CSS 输出到 `css/main.css`。之后，`RECESS` 将处理我们的 CSS，以确保其整洁一致。\n\
    \n目前，`RECESS` 任务只寻找单个 CSS 文件。然而，Grunt 能够在文件路径中使用通配符来匹配多个文件。列表 3-31 演示了如何在文件路径中使用通配符。\n\
    \n***列表 3-31***. 使用通配符匹配多个 CSS 文件\n\n```javascript\nrecess: {\n  dist: {\n   \
    \ options: {\n      compile: false,\n      noIDs: true\n    },\n    files: {\n\
    \      'src': 'css/**/*.css',\n  }\n}\n```\n\n通过做出列表 3-31 中概述的这一小改动，我们可以向 `css`\
    \ 文件夹添加更多 CSS 文件。除了向 `css` 文件夹添加额外的 CSS 文件外，我们还可以添加包含 CSS 文件的文件夹，Grunt 也将处理这些文件。\n\
    \n我希望，在这一点上，你能开始看到我们如何将不同的任务组合在一起，为整个团队创建一个可重复的流程。\n\n## 前缀（Prefixing）\n\n目前，我们已经拥有一个可重复且可靠的\
    \ CSS 生成和检查流程。接下来，我们将探讨如何利用 Grunt 来消除为 CSS 添加前缀的需求。\n\nCSS 前缀由浏览器厂商引入，旨在让前端工程师能够使用\
    \ W3C 标准尚未最终确定的涌现特性。例如，当浏览器厂商最初引入 CSS 渐变时，标准仍在变化中，且实现方式各不相同。每个浏览器厂商允许开发者通过为 CSS\
    \ 属性添加前缀，使用自己特定的实现来应用相同的视觉效果。列表 3-32 演示了 CSS3 渐变的 CSS 前缀。\n\n***列表 3-32***. CSS\
    \ 前缀\n\n```css\n.super-gradient {\n    background: #7abcff;\n    background: -moz-linear-gradient(-45deg,\
    \  #7abcff 0%, #60abf8 44%, #4096ee 100%);\n    background: -webkit-gradient(linear,\
    \ left top, right bottom, color-stop(0%,#7abcff),\n    color-stop(44%,#60abf8),\
    \ color-stop(100%,#4096ee));\n    background: -webkit-linear-gradient(-45deg,\
    \  #7abcff 0%,#60abf8 44%,#4096ee 100%);\n    background: -o-linear-gradient(-45deg,\
    \  #7abcff 0%,#60abf8 44%,#4096ee 100%);\n    background: -ms-linear-gradient(-45deg,\
    \  #7abcff 0%,#60abf8 44%,#4096ee 100%);\n    background: linear-gradient(135deg,\
    \  #7abcff 0%,#60abf8 44%,#4096ee 100%);\n}\n```\n\n列表 3-32 演示了线性 CSS 渐变的不同实现，特别是\
    \ FireFox（以 `-moz` 为前缀）和 webkit（以 `-webkit` 为前缀）之间的差异。你可能已经注意到，上述 CSS 中存在大量重复。社区中的一些开发者反对使用前缀，因为它们会导致\
    \ CSS 臃肿，因为每个属性都必须为每个浏览器重复，这很容易使网站所需的 CSS 变得臃肿。\n\n为了解决重复这一首要问题，有一个名为 `autoprefixer`\
    \ 的工具。你可以通过其名称猜到它的功能，但为了澄清，`autoprefixer` 解析 CSS，并使用来自流行网站 Can I Use（http://caniuse.com/）的值，为\
    \ CSS 规则添加特定于厂商的前缀。`Autoprefixer` 是一个 Node 应用程序，可以使用 `npm` 安装，或集成到其他 Node 应用程序中以编程方式使用。列表\
    \ 3-33 展示了如何在命令行中使用 `autoprefixer`。\n\n***列表 3-33***. 命令行中的 Autoprefixer\n\n```bash\n\
    autoprefixer styles/main.css\n```\n\n前面的命令将解析 CSS 样式表，并将特定于厂商的前缀添加到同一文件中。列表 3-34\
    \ 中的示例展示了使用 `autoprefixer` 前后的对比。\n\n***列表 3-34***. 使用 Autoprefixer 时 CSS 的前后对比\n\
    \n```css\n/* Before */\n\nh1 {\n  box-sizing: border-box;\n}\n\n/* After */\n\n\
    h1 {\n  -webkit-box-sizing: border-box;\n  -moz-box-sizing: border-box;\n  box-sizing:\
    \ border-box;\n}\n```\n"
- fmt: "从[清单3-34](#part0010.html#list34)可以看出，`autoprefixer`可以节省大量时间，因为它会自动添加供应商特定的规则。使用`autoprefixer`的另一个好处是减少了学习每个供应商对新功能具体实现的需求。除了这两个好处外，`autoprefixer`会保持最新状态，因为它使用的是\"\
    Can I Use\"网站，从而减少了跟踪浏览器实现变化的需求。接下来，我们将看看一个可以自动为CSS添加前缀的插件。\n\n有一个Grunt插件封装了Node模块，可以通过Grunt运行`autoprefixer`。该插件名为`grunt-autoprefixer`。[清单3-35](#part0010.html#list35)展示了`Gruntfile`中的新任务。\n\
    \n[**清单3-35**](#part0010.html#_list35). Grunt任务\n\n```\n/*global module:false*/\n\
    module.exports = function(grunt) {\n\n// Project configuration.\n  grunt.initConfig({\n\
    \  ...\n    autoprefixer: {\n      dist: {\n        options: {\n           diff:\
    \ true\n        },\n        src: 'css/main.css',\n      },\n    }\n  });\n\n//\
    \ These plugins provide necessary tasks.\n  grunt.loadNpmTasks('grunt-contrib-sass');\n\
    \  grunt.loadNpmTasks('grunt-bower-install');\n  grunt.loadNpmTasks('grunt-recess');\n\
    \  grunt.loadNpmTasks('grunt-autoprefixer');\n\n// Default task.\n  grunt.registerTask('default',\
    \ ['sass', 'bowerInstall', 'recess', 'autoprefixer']);\n\n};\n```\n\n安装Grunt插件`grunt-autoprefixer`并将上述`Gruntfile`应用到项目后，自动添加前缀的过程就自动化了。每次运行Grunt时，生成的CSS都会被解析并传递给`autoprefixer`以添加供应商特定的前缀。在我们的配置中，我们还定义了`diff`选项并将其设置为`true`。当`autoprefixer`修改CSS时，可以指示它生成一个补丁文件，其中包含源CSS与`autoprefixer`生成的CSS之间的差异。除此之外，`autoprefixer`可以配置为在生成供应商前缀时针对特定浏览器。这些选项可以通过`options`传递给Grunt任务。\n\
    \n如前所述，添加前缀有时会不受欢迎，因为它可能导致CSS臃肿。在下一节中，我们将研究能够自动压缩HTML和CSS以提升项目性能的Grunt任务。\n\n\
    ## Minification\n\nWeb应用程序的性能应该是每个开发人员都关心的问题。作为开发人员，你有责任尽最大努力优化应用程序。影响Web应用程序加载性能的关键因素之一是页面中资源的大小。例如，大型CSS或JavaScript文件可能导致性能不佳，因为浏览器下载它们需要更长时间，最终可能阻塞浏览器初始渲染页面。因此，应用程序的开发人员有责任确保其实际系统中交付的资源是经过优化的。\n\
    \n压缩的目标始终是保留代码的操作特性，同时减少其总体字节占用。在此上下文中，压缩HTML和CSS意味着通过去除不必要的内容来减少每个资源的大小。如果查看CSS，可以通过多种修改来减小其大小。\n\
    \n- 删除注释\n- 删除空白\n- 删除声明块中的最后一个分号\n- 删除多余的分号\n- 归约零值\n- 去除浮点数值的前导零\n- 压缩颜色\n-\
    \ 将`none`转换为零值\n\n幸运的是，多年来已有工具可以自动化这一过程。一个由Yahoo!开发的流行工具是`YUICompressor`。`YUICompressor`是一个基于Rhino\
    \ JavaScript引擎的Java工具。不过，`YUICompressor`有一个Node移植版本，称为`mincss`。它作为一个Node模块提供，而不是命令行工具，因此可以集成到你的Node应用程序中。\n\
    \n核心Grunt团队开发了一个执行类似压缩的Grunt任务。然而，这个任务并没有封装`mincss`模块；而是使用了`CleanCSS`。与`mincss`不同，`CleanCSS`提供了一个用于压缩CSS的命令行接口和一个Node模块。这个Grunt插件叫做`grunt-contrib-cssmin`。让我们更新项目以包含此插件。[清单3-36](#part0010.html#list36)演示了更新后的`Gruntfile`。\n\
    \n[**清单3-36**](#part0010.html#_list36). 包含`grunt-contrib-cssmin`配置的`Gruntfile`\n\
    \n```\n/*global module:false*/\nmodule.exports = function(grunt) {\n\n// Project\
    \ configuration.\n  grunt.initConfig({\n    // Task configuration.\n    ...\n\
    \    cssmin: {\n      dist: {\n        files: {\n          'dist/css/main.css':\
    \ 'css/main.css'\n        }\n      }\n    }\n  });\n\n// These plugins provide\
    \ necessary tasks.\n  grunt.loadNpmTasks('grunt-contrib-sass');\n  grunt.loadNpmTasks('grunt-bower-install');\n\
    \  grunt.loadNpmTasks('grunt-recess');\n  grunt.loadNpmTasks('grunt-autoprefixer');\n\
    \  grunt.loadNpmTasks('grunt-contrib-cssmin');\n\n// Default task.\n  grunt.registerTask('default',\
    \ [\n    'sass',\n    'bowerInstall',\n    'recess',\n    'autoprefixer',\n  \
    \  'cssmin'\n  ]);\n};\n```\n\n与我们之前的配置相比，这里应该没有太大不同。我们添加了`grunt-contrib-cssmin`插件来加载，并将`cssmin`添加到默认任务中。`cssmin`本身的配置声明了一个名为`dist`的目标，它使用`css/main.css`文件（来自`sass`任务的输出）并将压缩后的CSS输出到新位置`dist/css/main.css`。[图3-5](#part0010.html#Fig5)显示了当前项目运行默认任务的情况。`grunt-contrib-cssmin`插件的输出是最后一个，并且很有帮助地报告了压缩前后CSS的大小差异。此外，可以配置`grunt-contrib-cssmin`来报告使用gzip结合压缩时的大小。为了优化CSS的交付，最好使用gzip压缩提供内容。\n\
    \n内容的gzip压缩通常在Web服务器级别处理，因为并非所有客户端都接受gzip压缩的内容。大多数现代Web服务器支持启用gzip的指令。在这些服务器的配置中，必须根据内容类型定义哪些文件应被压缩。对于CSS，你需要为`text/css`启用它。一旦添加，如果客户端请求CSS时带有`Content-Encoding`头设置为`gzip`，那么Web服务器将在发送给客户端之前使用gzip压缩CSS。\n\
    \n![9781484200148_Fig03-05.jpg](images/00024.jpeg)\n\n[图3-5](#part0010.html#_Fig5).\
    \ Grunt默认任务运行多个任务\n\n在进入下一个主题之前，让我们看看我们之前定义规则的CSS前后对比。为了可读性，空白没有被去除，但实际上，压缩后的CSS输出会出现在单行上，并尽可能去除所有空白。[清单3-37](#part0010.html#list37)演示了一个已压缩的CSS文件。输出CSS中的第一个修改是针对`body`选择器的声明。`body`的`color`已通过将颜色从`#333333`更新为`#333`来压缩。第二个修改是去除了`border-top`声明末尾的多余分号。接下来的更新是从输出中删除了注释。在处理复杂CSS样式表时，注释可以是一个很好的沟通工具。然而，在生产环境中使用CSS时，这并不是必需的，去除注释可以减少CSS样式表的最终大小。`paragraph`选择器的声明演示了零值的压缩；段落的`padding`从`0px\
    \ 0px`简化为`0`。浮点数值也被修改，去除了小数点前出现的`0`。对CSS的最后修改是去除了每个声明块中的最后一个分号。"
  raw: 'As you can see from [Listing 3-34](#part0010.html#list34), autoprefixer can
    save a lot of time, as it will add in the vendor-specific rules. Another benefit
    of using autoprefixer is the reduced need to learn every vendor’s specific implementations
    for new features. In addition to these two benefits, autoprefixer is kept up to
    date as it uses the Can I Use site, reducing the need to track changes in browser
    implementations. Next, we’ll take a look at a plug-in that can automate the prefixing
    of our CSS.


    There is a Grunt plug-in that wraps the Node module to run autoprefixer via Grunt.
    The name of the plug-in is grunt-autoprefixer. [Listing 3-35](#part0010.html#list35)
    demonstrates the new task in the Gruntfile.


    [***Listing 3-35***](#part0010.html#_list35). Grunt Task


    ```

    /*global module:false*/

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

      ...

        autoprefixer: {

          dist: {

            options: {

               diff: true

            },

            src: ''css/main.css'',

          },

        }

      });


    // These plugins provide necessary tasks.

      grunt.loadNpmTasks(''grunt-contrib-sass'');

      grunt.loadNpmTasks(''grunt-bower-install'');

      grunt.loadNpmTasks(''grunt-recess'');

      grunt.loadNpmTasks(''grunt-autoprefixer'');


    // Default task.

      grunt.registerTask(''default'', [''sass'', ''bowerInstall'', ''recess'', ''autoprefixer'']);


    };

    ```


    After installing the Grunt plug-in, grunt-autoprefixer, and applying the preceding
    Gruntfile to your project, you will have the autoprefixing automated. Each time
    you run Grunt, the CSS produced will be parsed to autoprefixer for vendor-specific
    prefixes to be added. In our configuration, we also define the option diff and
    set this to true. When autoprefixer modifies your CSS, it can be told to generate
    a patch file that contains the difference between the source CSS and the CSS produced
    by autoprefixer. In addition to this, autoprefixer can be configured to target
    specific browsers when generating the vendor prefixes. These can be passed to
    the Grunt task via options.


    As mentioned previously, prefixing can sometimes be frowned upon, as it can lead
    to bloated CSS. In the next section, we will look at Grunt tasks that can automate
    minifying our HTML and CSS to improve the performance of a project.


    Minification


    Performance of web applications should be a concern for every developer. As a
    developer, it is your responsibility to ensure you’ve done your best to optimize
    your application. One of the key factors that can affect the loading performance
    of a web application is the size of the assets within the page. For example, large
    CSS or JavaScript files can lead to poor performance, as it takes longer for the
    browser to download, which ultimately can block the browser from initially rendering
    the page. Therefore, it is the responsibility of the developer(s) of the application
    to ensure that assets delivered in their live system are optimized.


    The goal of minification is always to preserve the operational qualities of the
    code while reducing its overall byte footprint. In this context, minifying HTML
    and CSS means reducing the size of the content for each resource by stripping
    unnecessary content. If we look at CSS, there are a number of modifications by
    which its size can be reduced.


    *   Removing comments

    *   Removing whitespace

    *   Removing the last semicolon in a declaration block

    *   Removing additional semicolons

    *   Reducing zero values

    *   Stripping leading zeros off floating point values

    *   Compressing colors

    *   Transforming none to zero values


    Fortunately, for a number of years, there have been tools available to automate
    this process. A popular tool, produced by Yahoo!, is called YUICompressor. YUICompressor
    is a Java tool based on top of the Rhino JavaScript engine. However, there is
    a Node port for YUICompressor called mincss. This is available as a Node module,
    not as command-line tool, and, therefore, can be integrated into your Node applications.


    The core Grunt team has developed a Grunt task that performs similar compression.
    However, this does not wrap the mincss module; instead, it uses CleanCSS. CleanCSS,
    unlike mincss, provides a command-line interface for minifying your CSS and a
    Node module. The Grunt plug-in is called grunt-contrib-cssmin. Let’s update our
    project to include this plug-in. [Listing 3-36](#part0010.html#list36) demonstrates
    the updated Gruntfile.


    [***Listing 3-36***](#part0010.html#_list36). Gruntfile with Configuration for
    grunt-contrib-cssmin


    ```

    /*global module:false*/

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        // Task configuration.

        ...

        cssmin: {

          dist: {

            files: {

              ''dist/css/main.css'': ''css/main.css''

            }

          }

        }

      });


    // These plugins provide necessary tasks.

      grunt.loadNpmTasks(''grunt-contrib-sass'');

      grunt.loadNpmTasks(''grunt-bower-install'');

      grunt.loadNpmTasks(''grunt-recess'');

      grunt.loadNpmTasks(''grunt-autoprefixer'');

      grunt.loadNpmTasks(''grunt-contrib-cssmin'');


    // Default task.

      grunt.registerTask(''default'', [

        ''sass'',

        ''bowerInstall'',

        ''recess'',

        ''autoprefixer'',

        ''cssmin''

      ]);

    };

    ```


    There should be nothing too dramatically different from our previous configurations.
    We’ve added the grunt-contrib-cssmin plug-in to be loaded and the cssmin to our
    default task. The configuration for cssmin itself declares a target called dist,
    which uses the css/main.css file (the output from our sass task) and outputs the
    compressed CSS to a new location of dist/css/main.css. [Figure 3-5](#part0010.html#Fig5)
    shows the default task running for our current project. The grunt-contrib-cssmin
    plug-in output is last and, also helpful, reports back the size difference in
    the CSS before and after compression. In addition, grunt-contrib-cssmin can be
    configured to report the size when gzip is used in combination with minification.
    To optimize the delivery of your CSS, it is best to serve the content compressed,
    using gzip.


    Gzipping of content is normally handled at the web server level, as not all clients
    will accept content compressed with gzip. Most modern web servers support directives
    to enable gzip. In the configuration for these servers, you must define by content
    type which files should be served. In the case of CSS, you will have to enable
    it for text/css. Once added, if the client requests your CSS with the Content-Encoding
    header set to gzip, then the web server will use gzip to compress the CSS before
    sending it to the client.


    ![9781484200148_Fig03-05.jpg](images/00024.jpeg)


    [Figure 3-5](#part0010.html#_Fig5). Grunt default task running several tasks


    Before we move on to the next topic, let’s look at a before and after CSS for
    the rules we defined earlier. For readability, whitespacing has not been stripped,
    but in reality, the CSS output from minification appears on a single line and,
    where possible, with all whitespace removed. [Listing 3-37](#part0010.html#list37)
    demonstrates a CSS file that has been minified. The first modification in the
    outputted CSS is to the body selector’s declarations. The body’s color has been
    minified by updating the color from #333333 to #333\. The second modification
    is the stripping of additional semicolons from the end of the border-top declaration.
    The next update is the comment being removed from the output. Comments can be
    an excellent communication tool while working on complex CSS style sheets. However,
    this isn’t required, for when using your CSS in production, stripping comments
    can reduce the final size of the CSS style sheet. The paragraph selector’s declaration
    demonstrates the minification of zero value; the padding of the paragraph is collapsed
    from “0px 0px” to simply “0.” The floating point values have also been modified
    to remove the 0 that appears before the decimal point. The final modification
    made to the CSS is the removal of the last semicolon within each declaration block.'
  trans: "\n从清单 3-34 可以看出，`autoprefixer`可以节省大量时间，因为它会自动添加供应商特定的规则。使用`autoprefixer`的另一个好处是减少了学习每个供应商对新功能具体实现的需求。除了这两个好处外，`autoprefixer`会保持最新状态，因为它使用的是\"\
    Can I Use\"网站，从而减少了跟踪浏览器实现变化的需求。接下来，我们将看看一个可以自动为 CSS 添加前缀的插件。\n\n有一个 Grunt 插件封装了\
    \ Node 模块，可以通过 Grunt 运行`autoprefixer`。该插件名为`grunt-autoprefixer`。清单 3-35 展示了`Gruntfile`中的新任务。\n\
    \n**清单 3-35**. Grunt 任务\n\n```\n/*global module:false*/\nmodule.exports = function(grunt)\
    \ {\n\n// Project configuration.\n  grunt.initConfig({\n  ...\n    autoprefixer:\
    \ {\n      dist: {\n        options: {\n           diff: true\n        },\n  \
    \      src: 'css/main.css',\n      },\n    }\n  });\n\n// These plugins provide\
    \ necessary tasks.\n  grunt.loadNpmTasks('grunt-contrib-sass');\n  grunt.loadNpmTasks('grunt-bower-install');\n\
    \  grunt.loadNpmTasks('grunt-recess');\n  grunt.loadNpmTasks('grunt-autoprefixer');\n\
    \n// Default task.\n  grunt.registerTask('default', ['sass', 'bowerInstall', 'recess',\
    \ 'autoprefixer']);\n\n};\n```\n\n安装 Grunt 插件`grunt-autoprefixer`并将上述`Gruntfile`应用到项目后，自动添加前缀的过程就自动化了。每次运行\
    \ Grunt 时，生成的 CSS 都会被解析并传递给`autoprefixer`以添加供应商特定的前缀。在我们的配置中，我们还定义了`diff`选项并将其设置为`true`。当`autoprefixer`修改\
    \ CSS 时，可以指示它生成一个补丁文件，其中包含源 CSS 与`autoprefixer`生成的 CSS 之间的差异。除此之外，`autoprefixer`可以配置为在生成供应商前缀时针对特定浏览器。这些选项可以通过`options`传递给\
    \ Grunt 任务。\n\n如前所述，添加前缀有时会不受欢迎，因为它可能导致 CSS 臃肿。在下一节中，我们将研究能够自动压缩 HTML 和 CSS 以提升项目性能的\
    \ Grunt 任务。\n\n## 压缩\n\nWeb 应用程序的性能应该是每个开发人员都关心的问题。作为开发人员，你有责任尽最大努力优化应用程序。影响 Web\
    \ 应用程序加载性能的关键因素之一是页面中资源的大小。例如，大型 CSS 或 JavaScript 文件可能导致性能不佳，因为浏览器下载它们需要更长时间，最终可能阻塞浏览器初始渲染页面。因此，应用程序的开发人员有责任确保其实际系统中交付的资源是经过优化的。\n\
    \n压缩的目标始终是保留代码的操作特性，同时减少其总体字节占用。在此上下文中，压缩 HTML 和 CSS 意味着通过去除不必要的内容来减少每个资源的大小。如果查看\
    \ CSS，可以通过多种修改来减小其大小。\n\n- 删除注释\n- 删除空白\n- 删除声明块中的最后一个分号\n- 删除多余的分号\n- 归约零值\n\
    - 去除浮点数值的前导零\n- 压缩颜色\n- 将`none`转换为零值\n\n幸运的是，多年来已有工具可以自动化这一过程。一个由 Yahoo!开发的流行工具是`YUICompressor`。`YUICompressor`是一个基于\
    \ Rhino JavaScript 引擎的 Java 工具。不过，`YUICompressor`有一个 Node 移植版本，称为`mincss`。它作为一个\
    \ Node 模块提供，而不是命令行工具，因此可以集成到你的 Node 应用程序中。\n\n核心 Grunt 团队开发了一个执行类似压缩的 Grunt 任务。然而，这个任务并没有封装`mincss`模块；而是使用了`CleanCSS`。与`mincss`不同，`CleanCSS`提供了一个用于压缩\
    \ CSS 的命令行接口和一个 Node 模块。这个 Grunt 插件叫做`grunt-contrib-cssmin`。让我们更新项目以包含此插件。清单 3-36\
    \ 演示了更新后的`Gruntfile`。\n\n**清单 3-36**. 包含`grunt-contrib-cssmin`配置的`Gruntfile`\n\
    \n```\n/*global module:false*/\nmodule.exports = function(grunt) {\n\n// Project\
    \ configuration.\n  grunt.initConfig({\n    // Task configuration.\n    ...\n\
    \    cssmin: {\n      dist: {\n        files: {\n          'dist/css/main.css':\
    \ 'css/main.css'\n        }\n      }\n    }\n  });\n\n// These plugins provide\
    \ necessary tasks.\n  grunt.loadNpmTasks('grunt-contrib-sass');\n  grunt.loadNpmTasks('grunt-bower-install');\n\
    \  grunt.loadNpmTasks('grunt-recess');\n  grunt.loadNpmTasks('grunt-autoprefixer');\n\
    \  grunt.loadNpmTasks('grunt-contrib-cssmin');\n\n// Default task.\n  grunt.registerTask('default',\
    \ [\n    'sass',\n    'bowerInstall',\n    'recess',\n    'autoprefixer',\n  \
    \  'cssmin'\n  ]);\n};\n```\n\n与我们之前的配置相比，这里应该没有太大不同。我们添加了`grunt-contrib-cssmin`插件来加载，并将`cssmin`添加到默认任务中。`cssmin`本身的配置声明了一个名为`dist`的目标，它使用`css/main.css`文件（来自`sass`任务的输出）并将压缩后的\
    \ CSS 输出到新位置`dist/css/main.css`。图 3-5 显示了当前项目运行默认任务的情况。`grunt-contrib-cssmin`插件的输出是最后一个，并且很有帮助地报告了压缩前后\
    \ CSS 的大小差异。此外，可以配置`grunt-contrib-cssmin`来报告使用 gzip 结合压缩时的大小。为了优化 CSS 的交付，最好使用\
    \ gzip 压缩提供内容。\n\n内容的 gzip 压缩通常在 Web 服务器级别处理，因为并非所有客户端都接受 gzip 压缩的内容。大多数现代 Web\
    \ 服务器支持启用 gzip 的指令。在这些服务器的配置中，必须根据内容类型定义哪些文件应被压缩。对于 CSS，你需要为`text/css`启用它。一旦添加，如果客户端请求\
    \ CSS 时带有`Content-Encoding`头设置为`gzip`，那么 Web 服务器将在发送给客户端之前使用 gzip 压缩 CSS。\n\n\
    ![9781484200148_Fig03-05.jpg](img/00024.jpeg)\n\n图 3-5. Grunt 默认任务运行多个任务\n\n在进入下一个主题之前，让我们看看我们之前定义规则的\
    \ CSS 前后对比。为了可读性，空白没有被去除，但实际上，压缩后的 CSS 输出会出现在单行上，并尽可能去除所有空白。清单 3-37 演示了一个已压缩的\
    \ CSS 文件。输出 CSS 中的第一个修改是针对`body`选择器的声明。`body`的`color`已通过将颜色从`#333333`更新为`#333`来压缩。第二个修改是去除了`border-top`声明末尾的多余分号。接下来的更新是从输出中删除了注释。在处理复杂\
    \ CSS 样式表时，注释可以是一个很好的沟通工具。然而，在生产环境中使用 CSS 时，这并不是必需的，去除注释可以减少 CSS 样式表的最终大小。`paragraph`选择器的声明演示了零值的压缩；段落的`padding`从`0px\
    \ 0px`简化为`0`。浮点数值也被修改，去除了小数点前出现的`0`。对 CSS 的最后修改是去除了每个声明块中的最后一个分号。\n"
- fmt: "# Removing Unused or Duplicate CSS\n\nThere is another great tool available\
    \ for optimizing your CSS before releasing it. This tool is used to remove unused\
    \ CSS from your style sheet and is called `UnCSS`. `UnCSS` offers a command-line\
    \ tool and a `Node` module to be integrated to your existing application. To analyze\
    \ a style sheet, `UnCSS` goes through the following process:\n\n1. The HTML file\
    \ is loaded by `PhantomJS`, a headless browser, and JavaScript is executed.\n\
    2. Used style sheets are extracted from the resulting HTML.\n3. The style sheets\
    \ are concatenated, and the rules are parsed, using the `Node` module `css-parse`.\n\
    4. Selectors that are not used within the HTML are filtered out, using `document.querySelector`.\n\
    5. The remaining rules are converted back to CSS.\n\n[***Listing 3-37***](#part0010.html#_list37).\
    \ Before and After CSS When Using `grunt-contrib-cssmin`\n\n```\n/* Before */\n\
    \nbody {\n  color: #333333;\n  border-top: 2px solid #2a2a2a;;\n}\n\n/* Some comment\
    \ */\np {\n  margin: 0px 0px;\n  padding: 0.333em 0.6em;\n}\n\nh1 {\n  -webkit-transition:\
    \ -webkit-transform 1s;\n  transition: transform 1s;\n}\n\n/* After */\n\nbody{color:#333;border-top:2px\
    \ solid #2a2a2a}\n\np{margin:0;padding:.333em .6em}\n\nh1{-webkit-transition:-webkit-transform\
    \ 1s;transition:transform 1s}\n```\n\nOne of the limitations of `UnCSS` is the\
    \ need for static HTML files. Obviously, not all web applications are built from\
    \ a set of HTML files. There is a solution to this problem: the development of\
    \ a patterns library. Patterns libraries are best described as communication tools\
    \ with which a team can iterate over UI elements within an application or site.\
    \ A patterns library will consist of the UI components that can be used within\
    \ the application. Each component will have sample HTML and CSS. As a patterns\
    \ library contains all of the HTML and CSS that will ultimately build an application,\
    \ it provides a set of pages that should contain all the selectors that are defined\
    \ within your CSS. If any CSS appears unused throughout these pages, it should\
    \ not be required for your application. The UX team at MailChimp has produced\
    \ an excellent patterns library, and it is available for viewing online at [http://ux.mailchimp.com/patterns/](http://ux.mailchimp.com/patterns/).\n\
    \n`Addy Osmani` has written a `Grunt` plug-in that wraps `UnCSS`, allowing users\
    \ to integrate `UnCSS` as part of their build process. Within the documentation\
    \ for the `Grunt` plug-in, `Addy` notes the prolific use of frameworks, such as\
    \ `Twitter Bootstrap` and `TopCoat`. However only 10% of these larger frameworks\
    \ are actually used in most web sites. [Listing 3-38](#part0010.html#list38) contains\
    \ the configuration for `grunt-uncss`. The configuration of the `uncss` task is\
    \ a little different from other tasks we’ve seen previously, as the source file\
    \ type is different from the destination file. The `uncss` task takes an array\
    \ of HTML files as input, and the output is a single CSS file. You may be wondering\
    \ what happens if your HTML files include references to multiple CSS files. As\
    \ the CSS is tokenized by `UnCSS`, at stage 5 in the process, all the CSS is converted\
    \ back to CSS and merged in a global style sheet. Therefore, if you are using\
    \ a CSS framework such as `Bootstrap`, all the unused CSS from `Bootstrap` is\
    \ removed and merged with your application code. This is the best of both worlds:\
    \ you get to use a powerful CSS framework to kick-start your project while keeping\
    \ your CSS for your application trim.\n\nLet’s update the application to include\
    \ `Bootstrap`, to demonstrate the flexibility of this solution. To include `Bootstrap`\
    \ in the project, we can use `Bower`. [Listing 3-38](#part0010.html#list38) shows\
    \ the command used to install `Bootstrap`. After installing `Bootstrap`, running\
    \ `Grunt` will run our `bowerInstall` task, which automatically injects `Twitter\
    \ Bootstrap` into the head of the HTML document. This is shown in [Listing 3-39](#part0010.html#list39).\n\
    \n[***Listing 3-38***](#part0010.html#_list38). Gruntfile with `uncss` Task Configured\n\
    \n```\n...\n    cssmin: {\n      dist: {\n        options: {\n          report:\
    \ 'gzip'\n        },\n        files: {\n          'dist/css/main.css': 'dist/css/main.css'\n\
    \        }\n      }\n    },\n\nuncss: {\n      dist: {\n        files: {\n   \
    \       'dist/css/main.css': ['index.html']\n        }\n      }\n    }\n  });\n\
    \n// These plugins provide necessary tasks.\n  ...\n  grunt.loadNpmTasks('grunt-uncss');\n\
    \n// Default task.\n  grunt.registerTask('default', [\n    'sass',\n    'bowerInstall',\n\
    \    'recess',\n    'autoprefixer',\n    'uncss',\n    'cssmin'\n  ]);\n};\n```\n\
    \n[***Listing 3-39***](#part0010.html#_list39). Installing `Twitter Bootstrap`\
    \ Using `Bower`\n\n```\nbower install  bootstrap –-save-dev\n```\n\nNow that `Bootstrap`\
    \ has been installed in our application, if you rerun the `grunt` task, you should\
    \ note a shift in the size of our CSS. Previously, our CSS was a few bytes. Now\
    \ the starting size of our CSS has jumped to approximately 120KB. After `UnCSS`\
    \ runs over our CSS, the size is considerably reduced from 120KB to 2.39KB. The\
    \ CSS output in `dist/css/main.css` contains the CSS from `Bootstrap` and our\
    \ application CSS combined in a single file. This is another great performance\
    \ win, as we should strive to reduce the number of CSS files within our page,\
    \ as, typically, fewer requests per page are better. Fewer requests typically\
    \ improve performance, due to latency costs, while establishing new connections.\
    \ This is particularly prevalent for devices accessing sites on slower network\
    \ connections. For a more in-depth study and explanation of browser performance,\
    \ I recommend reading *Higher Performance Browser Networking* by Ilya Grigorik\
    \ (O’Reilly Media, 2013).\n\nAs you can see from [Listing 3-40](#part0010.html#list40),\
    \ our `index.html` file is still currently referencing our unoptimized version\
    \ of the CSS file. Ideally, before shipping our application to the public, we’d\
    \ want to update the references to the optimized CSS files. Fortunately, `Grunt`\
    \ can also help with this task as well. Let’s see how.\n\n[***Listing 3-40***](#part0010.html#list40).\
    \ HTML Head Section Updated Automatically with `Bootstrap` Injected\n\n```\n<head>\n\
    <meta charset=\"utf-8\">\n<meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\"\
    >\n<title>Pro Grunt.js: Todo List</title>\n<meta name=\"description\" content=\"\
    \">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
    \n<!-- bower:css -->\n<link rel=\"stylesheet\" href=\"build/bower_components/bootstrap/dist/css/bootstrap.css\"\
    \ />\n<!-- endbower -->\n<link rel=\"stylesheet\" href=\"css/main.css\">\n</head>\n\
    ```\n\n## Packaging Your App for Production\n\nAs noted in the previous section,\
    \ we now have an optimized CSS file, but it is not currently being used within\
    \ our project. As `Grunt` works on the principle of multiple tasks working together\
    \ on a set of files, each task modifying the files and producing an output for\
    \ the next task to pick up, we have to introduce a task to update our HTML with\
    \ references to optimized CSS, in much the same way as our `bowerInstall` task\
    \ injects references to `Bower` components installed for our project.\n\nThe `Yeoman`\
    \ team has created a plug-in that solves this problem, and it is called `grunt-usemin`.\
    \ This plug-in is a little different from the ones encountered thus far. It introduces\
    \ two tasks: `useminPrepare` and `usemin`.\n\nThe `useminPrepare` task should\
    \ be used to ready your files for the `usemin` task to update your HTML file with\
    \ the correct references to the static assets, such as CSS. `Grunt-usemin`, like\
    \ `grunt-bower-install`, uses special HTML comments within the HTML to cleverly\
    \ replace references to the files. The `grunt-usemin` plug-in also introduces\
    \ a little magic to our project, as it auto-generates configuration for our tasks,\
    \ such as concatenation and minification. Therefore, we can remove the `cssmin`\
    \ configuration from our `Gruntfile`, as `usemin` will auto-generate it for us.\n\
    \n[Listing 3-41](#part0010.html#list41) illustrates the modifications needed by\
    \ the HTML to support `usemin`, in particular the blocks added to support rewriting\
    \ of asset names."
  raw: 'Removing Unused or Duplicate CSS


    There is another great tool available for optimizing your CSS before releasing
    it. This tool is used to remove unused CSS from your style sheet and is called
    UnCSS. UnCSS offers a command-line tool and a Node module to be integrated to
    your existing application. To analyze a style sheet, UnCSS goes through the following
    process:


    1.  The HTML file is loaded by PhantomJS, a headless browser, and JavaScript is
    executed.

    2.  Used style sheets are extracted from the resulting HTML.

    3.  The style sheets are concatenated, and the rules are parsed, using the Node
    module css-parse.

    4.  Selectors that are not used within the HTML are filtered out, using document.querySelector.

    5.  The remaining rules are converted back to CSS.


    [***Listing 3-37***](#part0010.html#_list37). Before and After CSS When Using
    grunt-contrib-cssmin


    ```

    /* Before */


    body {

      color: #333333;

      border-top: 2px solid #2a2a2a;;

    }


    /* Some comment */

    p {

      margin: 0px 0px;

      padding: 0.333em 0.6em;

    }


    h1 {

      -webkit-transition: -webkit-transform 1s;

      transition: transform 1s;

    }


    /* After */


    body{color:#333;border-top:2px solid #2a2a2a}


    p{margin:0;padding:.333em .6em}


    h1{-webkit-transition:-webkit-transform 1s;transition:transform 1s}

    ```


    One of the limitations of UnCSS is the need for static HTML files. Obviously,
    not all web applications are built from a set of HTML files. There is a solution
    to this problem: the development of a patterns library. Patterns libraries are
    best described as communication tools with which a team can iterate over UI elements
    within an application or site. A patterns library will consist of the UI components
    that can be used within the application. Each component will have sample HTML
    and CSS. As a patterns library contains all of the HTML and CSS that will ultimately
    build an application, it provides a set of pages that should contain all the selectors
    that are defined within your CSS. If any CSS appears unused throughout these pages,
    it should not be required for your application. The UX team at MailChimp has produced
    an excellent patterns library, and it is available for viewing online at [http://ux.mailchimp.com/patterns/](http://ux.mailchimp.com/patterns/).


    Addy Osmani has written a Grunt plug-in that wraps UnCSS, allowing users to integrate
    UnCSS as part of their build process. Within the documentation for the Grunt plug-in,
    Addy notes the prolific use of frameworks, such as Twitter Bootstrap and TopCoat.
    However only 10% of these larger frameworks are actually used in most web sites.
    [Listing 3-38](#part0010.html#list38) contains the configuration for grunt-uncss.
    The configuration of the uncss task is a little different from other tasks we’ve
    seen previously, as the source file type is different from the destination file.
    The uncss task takes an array of HTML files as input, and the output is a single
    CSS file. You may be wondering what happens if your HTML files include references
    to multiple CSS files. As the CSS is tokenized by UnCSS, at stage 5 in the process,
    all the CSS is converted back to CSS and merged in a global style sheet. Therefore,
    if you are using a CSS framework such as Bootstrap, all the unused CSS from Bootstrap
    is removed and merged with your application code. This is the best of both worlds:
    you get to use a powerful CSS framework to kick-start your project while keeping
    your CSS for your application trim.


    Let’s update the application to include Bootstrap, to demonstrate the flexibility
    of this solution. To include Bootstrap in the project, we can use Bower. [Listing
    3-38](#part0010.html#list38) shows the command used to install Bootstrap. After
    installing Bootstrap, running Grunt will run our bowerInstall task, which automatically
    injects Twitter Bootstrap into the head of the HTML document. This is shown in
    [Listing 3-39](#part0010.html#list39).


    [***Listing 3-38***](#part0010.html#_list38). Gruntfile with uncss Task Configured


    ```

    ...

        cssmin: {

          dist: {

            options: {

              report: ''gzip''

            },

            files: {

              ''dist/css/main.css'': ''dist/css/main.css''

            }

          }

        },


    uncss: {

          dist: {

            files: {

              ''dist/css/main.css'': [''index.html'']

            }

          }

        }

      });


    // These plugins provide necessary tasks.

      ...

      grunt.loadNpmTasks(''grunt-uncss'');


    // Default task.

      grunt.registerTask(''default'', [

        ''sass'',

        ''bowerInstall'',

        ''recess'',

        ''autoprefixer'',

        ''uncss'',

        ''cssmin''

      ]);

    };

    ```


    [***Listing 3-39***](#part0010.html#_list39). Installing Twitter Bootstrap Using
    Bower


    ```

    bower install  bootstrap –-save-dev

    ```


    Now that Bootstrap has been installed in our application, if you rerun the grunt
    task, you should note a shift in the size of our CSS. Previously, our CSS was
    a few bytes. Now the starting size of our CSS has jumped to approximately 120KB.
    After UnCSS runs over our CSS, the size is considerably reduced from 120KB to
    2.39KB. The CSS output in dist/css/main.css contains the CSS from Bootstrap and
    our application CSS combined in a single file. This is another great performance
    win, as we should strive to reduce the number of CSS files within our page, as,
    typically, fewer requests per page are better. Fewer requests typically improve
    performance, due to latency costs, while establishing new connections. This is
    particularly prevalent for devices accessing sites on slower network connections.
    For a more in-depth study and explanation of browser performance, I recommend
    reading *Higher Performance Browser Networking* by Ilya Grigorik (O’Reilly Media,
    2013).


    As you can see from [Listing 3-40](#part0010.html#list40), our index.html file
    is still currently referencing our unoptimized version of the CSS file. Ideally,
    before shipping our application to the public, we’d want to update the references
    to the optimized CSS files. Fortunately, Grunt can also help with this task as
    well. Let’s see how.


    [***Listing 3-40***](#part0010.html#_list40). HTML Head Section Updated Automatically
    with Bootstrap Injected


    ```

    <head>

    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Pro Grunt.js: Todo List</title>

    <meta name="description" content="">

    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- bower:css -->

    <link rel="stylesheet" href="build/bower_components/bootstrap/dist/css/bootstrap.css"
    />

    <!-- endbower -->

    <link rel="stylesheet" href="css/main.css">

    </head>

    ```


    Packaging Your App for Production


    As noted in the previous section, we now have an optimized CSS file, but it is
    not currently being used within our project. As Grunt works on the principle of
    multiple tasks working together on a set of files, each task modifying the files
    and producing an output for the next task to pick up, we have to introduce a task
    to update our HTML with references to optimized CSS, in much the same way as our
    bowerInstall task injects references to Bower components installed for our project.


    The Yeoman team has created a plug-in that solves this problem, and it is called
    grunt-usemin. This plug-in is a little different from the ones encountered thus
    far. It introduces two tasks: useminPrepare and usemin.


    The useminPrepare task should be used to ready your files for the usemin task
    to update your HTML file with the correct references to the static assets, such
    as CSS. Grunt-usemin, like grunt-bower-install, uses special HTML comments within
    the HTML to cleverly replace references to the files. The grunt-usemin plug-in
    also introduces a little magic to our project, as it auto-generates configuration
    for our tasks, such as concatenation and minification. Therefore, we can remove
    the cssmin configuration from our Gruntfile, as usemin will auto-generate it for
    us.


    [Listing 3-41](#part0010.html#list41) illustrates the modifications needed by
    the HTML to support usemin, in particular the blocks added to support rewriting
    of asset names.'
  trans: "\n# 移除未使用或重复的 CSS\n\n在发布项目前，还有一个优秀的工具可用于优化 CSS。这个名为 `UnCSS` 的工具用于从样式表中移除未使用的\
    \ CSS。`UnCSS` 提供了命令行工具和可集成到现有应用的 `Node` 模块。为了分析样式表，`UnCSS` 会执行以下流程：\n\n1.  `PhantomJS`（一个无头浏览器）加载\
    \ HTML 文件，并执行其中的 JavaScript。\n2.  从生成的 HTML 中提取已使用的样式表。\n3.  使用 `Node` 模块 `css-parse`\
    \ 将样式表合并并解析规则。\n4.  使用 `document.querySelector` 过滤出 HTML 中未使用的选择器。\n5.  将剩余的规则转换回\
    \ CSS。\n\n***列表 3-37***. 使用 `grunt-contrib-cssmin` 前后的 CSS 对比\n\n```\n/* 之前 */\n\
    \nbody {\n  color: #333333;\n  border-top: 2px solid #2a2a2a;;\n}\n\n/* 某些注释 */\n\
    p {\n  margin: 0px 0px;\n  padding: 0.333em 0.6em;\n}\n\nh1 {\n  -webkit-transition:\
    \ -webkit-transform 1s;\n  transition: transform 1s;\n}\n\n/* 之后 */\n\nbody{color:#333;border-top:2px\
    \ solid #2a2a2a}\n\np{margin:0;padding:.333em .6em}\n\nh1{-webkit-transition:-webkit-transform\
    \ 1s;transition:transform 1s}\n```\n\n`UnCSS` 的局限性之一是需要静态 HTML 文件。显然，并非所有 Web\
    \ 应用都由一组 HTML 文件构建而成。对此有一个解决方案：开发一个**模式库**。模式库最好被描述为一种沟通工具，团队可以通过它在应用或网站中迭代 UI\
    \ 元素。模式库由可在应用中使用的 UI 组件组成。每个组件都包含示例 HTML 和 CSS。由于模式库包含了最终构建应用所需的所有 HTML 和 CSS，它提供了一组页面，这些页面应包含你的\
    \ CSS 中定义的所有选择器。如果任何 CSS 在这些页面中显示为未使用，那么你的应用就不需要它。MailChimp 的 UX 团队制作了一个优秀的模式库，你可以通过\
    \ [`ux.mailchimp.com/patterns/`](http://ux.mailchimp.com/patterns/) 在线查看。\n\n\
    `Addy Osmani` 编写了一个封装了 `UnCSS` 的 `Grunt` 插件，允许用户将 `UnCSS` 集成到他们的构建流程中。在该 `Grunt`\
    \ 插件的文档中，`Addy` 指出像 `Twitter Bootstrap` 和 `TopCoat` 这样的框架被广泛使用。然而，在大多数网站中，这些大型框架只使用了其中的\
    \ 10%。列表 3-38 包含了 `grunt-uncss` 的配置。`uncss` 任务的配置与我们之前看到的其他任务略有不同，因为源文件类型与目标文件类型不同。`uncss`\
    \ 任务接收一个 HTML 文件数组作为输入，输出是一个单一的 CSS 文件。你可能想知道，如果你的 HTML 文件引用了多个 CSS 文件会发生什么。由于\
    \ CSS 被 `UnCSS` 标记化，在其流程的第 5 阶段，所有 CSS 会被转换回 CSS 并合并到一个全局样式表中。因此，如果你正在使用像 `Bootstrap`\
    \ 这样的 CSS 框架，所有来自 `Bootstrap` 的未使用 CSS 都会被移除，并与你的应用代码合并。这是两全其美的做法：你既能使用强大的 CSS\
    \ 框架来启动项目，又能保持应用 CSS 的精简。\n\n让我们更新应用以包含 `Bootstrap`，来演示此解决方案的灵活性。要在项目中包含 `Bootstrap`，我们可以使用\
    \ `Bower`。列表 3-38 显示了用于安装 `Bootstrap` 的命令。安装 `Bootstrap` 后，运行 `Grunt` 将执行我们的 `bowerInstall`\
    \ 任务，该任务会自动将 `Twitter Bootstrap` 注入到 HTML 文档的 `<head>` 中。如列表 3-39 所示。\n\n***列表\
    \ 3-38***. 配置了 `uncss` 任务的 Gruntfile\n\n```\n...\n    cssmin: {\n      dist: {\n\
    \        options: {\n          report: 'gzip'\n        },\n        files: {\n\
    \          'dist/css/main.css': 'dist/css/main.css'\n        }\n      }\n    },\n\
    \nuncss: {\n      dist: {\n        files: {\n          'dist/css/main.css': ['index.html']\n\
    \        }\n      }\n    }\n  });\n\n// 这些插件提供了必要的任务。\n  ...\n  grunt.loadNpmTasks('grunt-uncss');\n\
    \n// 默认任务。\n  grunt.registerTask('default', [\n    'sass',\n    'bowerInstall',\n\
    \    'recess',\n    'autoprefixer',\n    'uncss',\n    'cssmin'\n  ]);\n};\n```\n\
    \n***列表 3-39***. 使用 `Bower` 安装 `Twitter Bootstrap`\n\n```\nbower install  bootstrap\
    \ –-save-dev\n```\n\n现在 `Bootstrap` 已安装到我们的应用中，如果重新运行 `grunt` 任务，你应该会注意到 CSS 文件大小的变化。之前，我们的\
    \ CSS 只有几个字节。现在，CSS 的初始大小跃升至约 120KB。在 `UnCSS` 处理完我们的 CSS 后，大小从 120KB 显著减小到 2.39KB。`dist/css/main.css`\
    \ 中的 CSS 输出包含了 `Bootstrap` 的 CSS 和我们应用的 CSS，合并为一个文件。这是另一个巨大的性能胜利，因为我们应该努力减少页面中\
    \ CSS 文件的数量。通常，每个页面的请求越少越好。由于建立新连接时的延迟成本，更少的请求通常能提升性能。这对于使用较慢网络连接访问网站的移动设备尤其重要。如需更深入地学习和研究浏览器性能，我推荐阅读\
    \ Ilya Grigorik 的《高性能浏览器网络》（O'Reilly Media, 2013）。\n\n正如你在列表 3-40 中看到的，我们的 `index.html`\
    \ 文件目前仍然引用着未优化的 CSS 文件。理想情况下，在将应用发布给公众之前，我们希望将引用更新为优化的 CSS 文件。幸运的是，`Grunt` 也可以帮助完成这项任务。让我们看看怎么做。\n\
    \n***列表 3-40***. 自动更新并注入 `Bootstrap` 后的 HTML `<head>` 部分\n\n```\n<head>\n<meta\
    \ charset=\"utf-8\">\n<meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\"\
    >\n<title>Pro Grunt.js: Todo List</title>\n<meta name=\"description\" content=\"\
    \">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\
    \n<!-- bower:css -->\n<link rel=\"stylesheet\" href=\"build/bower_components/bootstrap/dist/css/bootstrap.css\"\
    \ />\n<!-- endbower -->\n<link rel=\"stylesheet\" href=\"css/main.css\">\n</head>\n\
    ```\n\n## 为生产环境打包你的应用\n\n如前一节所述，我们现在有了优化的 CSS 文件，但它并未在当前项目中使用。由于 `Grunt` 的工作原则是多个任务协作处理一组文件，每个任务修改文件并产生输出供下一个任务使用，因此我们必须引入一个任务，用优化后的\
    \ CSS 的引用更新我们的 HTML，这与我们的 `bowerInstall` 任务将 `Bower` 组件的引用注入项目的方式类似。\n\n`Yeoman`\
    \ 团队创建了一个解决此问题的插件，名为 `grunt-usemin`。这个插件与我们之前遇到的略有不同。它引入了两个任务：`useminPrepare`\
    \ 和 `usemin`。\n\n`useminPrepare` 任务应用于准备文件，以便 `usemin` 任务更新你的 HTML 文件，使其包含对静态资源（如\
    \ CSS）的正确引用。`Grunt-usemin` 与 `grunt-bower-install` 类似，它使用 HTML 中的特殊 HTML 注释来巧妙地替换文件引用。`grunt-usemin`\
    \ 插件还为我们的项目带来了一些“魔法”，因为它会自动生成我们任务的配置，例如合并和压缩任务。因此，我们可以从 `Gruntfile` 中移除 `cssmin`\
    \ 配置，因为 `usemin` 会为我们自动生成。\n\n列表 3-41 展示了 HTML 为支持 `usemin` 所需的修改，特别是为了支持重写资源名称而添加的区块。\n"
- fmt: "[***Listing 3-41***](#part0010.html#_list41). Modified `index.html` with Additional\
    \ Blocks for `usemin`\n\n```\n<head>\n<meta charset=\"utf-8\">\n<meta http-equiv=\"\
    X-UA-Compatible\" content=\"IE=edge\">\n<title>Pro Grunt.js: Todo List</title>\n\
    <meta name=\"description\" content=\"\">\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n\n<!-- build:css css/main.css -->\n<!-- bower:css -->\n\
    <link rel=\"stylesheet\" href=\"build/bower_components/bootstrap/dist/css/bootstrap.css\"\
    \ />\n<!-- endbower -->\n<link rel=\"stylesheet\" href=\"css/main.css\">\n<!--\
    \ endbuild -->\n</head>\n```\n\nNow that we have prepared our HTML file for use\
    \ with `usemin`, we have to configure the `useminPrepare` and `usemin` tasks within\
    \ our `Gruntfile`. [Listing 3-42](#part0010.html#list42) demonstrates the output\
    \ from the `usemin` task, most notably the rewritten path to support the new optimized\
    \ CSS.\n\n[***Listing 3-42***](#part0010.html#_list42). `Gruntfile` with `useminPrepare`\
    \ and `usemin` Added\n\n```\ncopy: {\n    dist: {\n      expand: true,\n     \
    \ cwd: 'app/',\n      src: 'index.html',\n      dest: 'dist/'\n    }\n  },\n\n\
    useminPrepare: {\n    dist: {\n      src: 'app/index.html',\n      dest: 'dist/'\n\
    \    }\n  },\n\nusemin: {\n    html: 'dist/index.html'\n  }\n\n// Default task.\n\
    grunt.registerTask('default', [\n  'useminPrepare',\n  'sass',\n  'bowerInstall',\n\
    \  'autoprefixer',\n  'recess',\n  'uncss',\n  'usemin'\n]);\n```\n\nAs you can\
    \ see, the actual configuration for `useminPrepare` and `usemin` themselves is\
    \ rather trim. We inform `usemin` where the HTML file exists for our preparation\
    \ and then one to be used by `usemin`. At the moment, we do not have an `index.html`\
    \ file in our `dist` folder; therefore, we have to introduce a new Grunt plug-in\
    \ called `grunt-contrib-copy`. This plug-in is used to copy files or folders from\
    \ one place to another within a project. In our project, we will use `grunt-contrib-copy`\
    \ to copy the `index.html` file from `app/index.html` to `dist/index.html`. This\
    \ file will then be processed by `usemin` to update the references to the optimized\
    \ CSS. Having an `index.html` file in our `dist` folder allows us to work locally\
    \ with a development copy of our application before building a version for releasing\
    \ that contains the correct references to the optimized CSS. [Listing 3-43](#part0010.html#list43)\
    \ contains the configuration for `grunt-contrib-copy`.\n\n[***Listing 3-43***](#part0010.html#_list43).\
    \ Head Element Has Been Modified to Contain Reference to Optimized CSS\n\n```\n\
    <head>\n<meta charset=\"utf-8\">\n<meta http-equiv=\"X-UA-Compatible\" content=\"\
    IE=edge\">\n<title>Pro Grunt.js: Todo List</title>\n<meta name=\"description\"\
    \ content=\"\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n<link rel=\"stylesheet\" href=\"css/main.css\">\n</head>\n```\n\nAs you can\
    \ see, the `index.html` now contains a reference to the optimized CSS, ready for\
    \ deployment to production. In the following section, we will look at asset versioning\
    \ of optimized caching of static assets and how Grunt can help us with this process.\n\
    \n## Versioning\n\nIn the final section of this chapter, we’ll see how we can\
    \ use Grunt to further improve the performance of our production code. In this\
    \ section, we’ll look at how we can ship versioned assets. The primary reason\
    \ to ship versioned assets is to safely set far future cache headers for our static\
    \ assets. Setting far future headers improves performance, as clients can cache\
    \ a copy of your assets, preventing them from having to return to your server\
    \ to re-request the asset on each page load. Typically, we will set a far future\
    \ expires header on assets such as CSS, web fonts, and JavaScript. For an example\
    \ of web server configuration for expires headers, check out HTML5 Boilerplate’s\
    \ `.htaccess` file. This provides a great starting point for people using the\
    \ Apache web server and sets the majority of static assets to expire a month from\
    \ the time they were accessed.\n\nAs mentioned, Grunt can help with the delivery\
    \ of static assets with far future headers. Simply sending an expires header with\
    \ a far future date can be dangerous. Any updates to that asset will not be picked\
    \ up until the cache expires and the client re-requests the asset from the server.\
    \ There are a couple solutions to this problem. One popular approach is to add\
    \ a cache buster to the URL for the asset. When the asset itself changes, the\
    \ cache buster is updated, forcing the client to re-request the asset from the\
    \ server. [Listing 3-44](#part0010.html#list44) shows a dummy URL for a CSS file\
    \ with a cache buster appended.\n\n[***Listing 3-44***](#part0010.html#_list44).\
    \ Dummy CSS URL with Cache Buster Appended\n\n```\nhttp://mysite.com/styles/app.css?c=20140303\n\
    ```\n\nUnfortunately, some proxy servers are configured by default not to cache\
    \ URLs that contain query strings. Therefore, we need an alternatively approach.\
    \ [Listing 3-45](#part0010.html#list45) shows both approaches.\n\n[***Listing\
    \ 3-45***](#part0010.html#_list45). Alternative Asset Version Approaches\n\n```\n\
    http://mysite.com/0.1.0/styles/app.css\nhttp://mysite.com/styles/app.0.1.0.css\n\
    ```\n\nIn the first approach, the version number is inserted into the path to\
    \ the assets. This is the approach the BBC currently takes to version its assets.\
    \ For example, the BBC homepage has the following reference: [http://static.bbci.co.uk/h4clock/0.69.3/style/h4clock.css](http://static.bbci.co.uk/h4clock/0.69.3/style/h4clock.css).\
    \ In this case, the version is `0.69.3`. The alternative approach, including the\
    \ version in the asset file name, is used by jQuery when serving jQuery from its\
    \ CDN. For example, the URL for the latest version of jQuery, at the time of writing,\
    \ is [http://code.jquery.com/jquery-1.11.0.min.js](http://code.jquery.com/jquery-1.11.0.min.js).\n\
    \nThere is a Grunt plug-in, `grunt-rev`, available to perform version asset production.\
    \ The `grunt-rev` plug-in generates a hash based on the contents of your file.\
    \ It offers a number of algorithms for generating the hash, such as `md5` and\
    \ `sha256`. The hash generated for a file is injected before the file extension.\
    \ In addition to this, `grunt-rev` works perfectly with the `usemin` plug-in introduced\
    \ in the previous section. [Listing 3-46](#part0010.html#list46) shows the latest\
    \ configuration for both of these files.\n\n[***Listing 3-46***](#part0010.html#_list46).\
    \ Configuration for Static Asset Versioning\n\n```\nrev: {\n  dist: {\n    src:\
    \ 'dist/css/main.css'\n  }\n}\n```\n\nAs you can see, the CSS generated in the\
    \ temporary folder as part of the earlier tasks is now picked up by the `rev`\
    \ task and dropped into the `dist/css` folder. Once this has completed, `usemin`\
    \ modifies the `index.html` file in the `dist` folder with the path to the newly\
    \ versioned CSS. The benefit of using hashes over timestamps, in this case, is\
    \ that the hash should only change when the contents of the file itself changes.\
    \ This is particularly important if you have multiple teams generating the same\
    \ static assets. You only want the asset name to change when there has been a\
    \ genuine change to the contents of the file.\n\n## Summary\n\nIn this chapter,\
    \ we’ve explored how to use Grunt to ease our development workflow when working\
    \ with HTML and CSS. We started with a brief introduction into CSS preprocessors\
    \ and how Grunt can aid us with compiling our CSS. After this, we moved on to\
    \ Bower, a powerful front-end dependency manager, which can be integrated with\
    \ Grunt to make managing front-end libraries within our projects easy. The remainder\
    \ of the chapter looked at a number of plug-ins that can be used to help optimize\
    \ our HTML and CSS before releasing it onto the public Web.\n\nIn the next chapter,\
    \ we’ll continue to look at how Grunt can help when working with front-end technology,\
    \ as you discover a powerful set of plug-ins to help with JavaScript development.\n\
    \n# CHAPTER 4\n\n![image](images/00005.jpeg)\n\n## Using Grunt with JavaScript"
