    ## Bower 与 Grunt


    没有 `Grunt` 的 `Bower` 已经是一个很出色的工具，但当它们一起使用时，可以显著减少搭建前端依赖所需的时间。连接 `Bower` 和 `Grunt`
    的插件叫做 `grunt-bower-install`。`grunt-bower-install` 插件可用于自动注入由 `Bower` 安装到 HTML
    中的前端 JavaScript 和 CSS 文件。为了实现这一点，`grunt-bower-install` 依赖于一个 Node 模块 `wiredep`。当
    `wiredep` 运行于你的源文件时，它会查找 HTML 中的特殊注释。如果找到注释，它会将相关的标签注入到 HTML 中。


    首先，让我们更新 `Gruntfile.js` 以使用这个新插件。不要忘记你也需要安装这个插件。[Listing 3-26](#part0010.html#list26)
    展示了添加了该任务后的更新版 `Gruntfile` 文件。


    [***Listing 3-26***](#part0010.html#_list26). 将 Bower 包安装到特定文件夹的 bowerrc 文件


    ```

    /*global module:false*/

    module.exports = function(grunt) {


    // Project configuration.

      grunt.initConfig({

        // Task configuration.

        ...


    bowerInstall: {

          dist: {

            src: [''*.html''],

            dependencies: true,

            devDependencies: true,

            exclude: []

          }

        }

      });


    // These plugins provide necessary tasks.

      grunt.loadNpmTasks(''grunt-contrib-sass'');

      grunt.loadNpmTasks(''grunt-bower-install'');


    // Default task.

      grunt.registerTask(''default'', [''sass'', ''bower-install'']);

    };

    ```


    [Listing 3-26](#part0010.html#list26) 引入了一个新任务 `bowerInstall`，其目标是 `dist`。这个目标有几个选项，第一个是
    `src`。`grunt-bower-install` 插件会更新 HTML；因此它不需要目标文件。接下来的两个选项决定了哪些依赖应该被注入到 HTML 中。`Dependencies`
    是生产和开发依赖，而 `devDependencies` 则仅与开发所需的 `Bower` 包相关。最后一个选项是 `exclude`，在我们的例子中是空的，但可以用来排除特定库，使其不被插件处理。该插件还有许多其他可用选项，包括向
    Sass 文件注入导入语句的能力。


    在项目上运行该任务之前，还有最后一步：更新 HTML。[Listing 3-27](#part0010.html#list27) 包含了我们在本章开头首次看到的
    HTML 文件，但已从页脚中移除了 `jQuery`。取而代之的是添加了一条新的注释，供 `wiredep` 在处理 HTML 文件时使用。


    [***Listing 3-27***](#part0010.html#_list27). 支持 grunt-bower-install 插件的 HTML
    修改


    ```

    <!doctype html>

    <html class="no-js">

    <head>

    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Pro Grunt.js: Todo List</title>

    <meta name="description" content="">

    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- bower:css -->

    <!-- endbower -->

    <link rel="stylesheet" href="css/main.css">


    </head>

    <body>

        <!--[if lt IE 8]>

        <p class="browsehappy">You are using an <strong>outdated</strong> browser.
    Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your
    experience.</p>

        <![endif]-->


    <!-- Add your site or application content here -->

       <h1>Pro Grunt.js</h1>

       <h2>Todo List</h2>


    <!-- bower:js -->

       <!-- endbower -->

       <script src="js/main.js"></script>

    </body>

    </html>

    ```


    在 `body` 末尾的最后一个 `script` 标签之前添加的注释，是 `wiredep` 用来将 `Bower` 组件的引用注入到输出 HTML 文件中的占位符。要运行该任务，请使用
    [Listing 3-28](#part0010.html#list28) 中所示的命令。


    [***Listing 3-28***](#part0010.html#_list28). 运行 grunt-bower-install


    ```

    grunt bowerInstall

    ```


    当任务运行时，它会通知其在运行时更新了哪些文件。在我们的示例中，这应该是 `index.html` 文件。任务完成后，如果你打开 `index.html`
    文件，你会发现对 `jQuery`、`Backbone.js` 和 `Underscore.js` 的引用已被添加到 `bower:js` 注释之间。[Listing
    3-29](#part0010.html#list29) 包含了任务运行后的 HTML 片段。


    [***Listing 3-29***](#part0010.html#_list29). Grunt 任务执行后的 index.html 片段


    ```

    <!-- bower:js -->

    <script src="build/bower_components/jquery/dist/jquery.js"></script>

    <script src="build/bower_components/underscore/underscore.js"></script>

    <script src="build/bower_components/backbone/backbone.js"></script>

    <!-- endbower -->

    ```


    目前看来，这或许没什么用，但想象一个场景：你在三个月后回到一个项目中。你有一个想要在项目中使用的新的框架。只需两个命令就能将其下载并注入到你的页面中。


