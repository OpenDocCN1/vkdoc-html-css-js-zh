    [Listing 7-8](#part0014.html#list8) contains a smaller subset of the project dependencies.
    If you now run grunt-contrib-clean, the task will still successfully run; however,
    if you try to run grunt-contrib-jshint, an error will be thrown, as the plug-in
    is not loaded. The ability to load different dependencies can be useful. For example,
    it provides the ability to load a different set of dependencies based on an option.
    [Listing 7-9](#part0014.html#list9) demonstrates the use of such an option to
    switch the dependencies file used. [Listing 7-9](#part0014.html#list9) loads an
    option called deploy that can be passed as a parameter to Grunt at runtime. If
    the option is set, then the file ./build/tasks.json is used; otherwise, the package.json
    is loaded. This can reduce the time taken to load dependencies as part of a deployment
    while allowing the local development environment to run more complex sets of tasks.
    [Listing 7-10](#part0014.html#list10) contains an example of how to pass an option
    to grunt. The option will return true if the option is set; otherwise, it returns
    false.


    [***Listing 7-9***](#part0014.html#_list9). Modifying Dependencies at Load Time


    ```

    module.exports = function(grunt) {


    var deploy  = grunt.option(''deploy'');

      var depFile = deploy ? ''./build/tasks.json'' : ''./package.json'';


    // Load time-grunt to measure performance

      require(''time-grunt'')(grunt);


    // Load dependencies

      require(''matchdep'').filterDev(''grunt-*'', depFile).forEach(grunt.loadNpmTasks);


    };

    ```'
