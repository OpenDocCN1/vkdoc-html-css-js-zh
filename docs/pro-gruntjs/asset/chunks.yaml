    \ (cached run on the right)\n\n## Reloading Changes Automatically in the Browser\n\
    \nChanges made throughout this chapter have improved the speed and maintenance\
    \ of Grunt workflow. In this section, we’ll look at another technique to improve\
    \ the speed of feedback from our Grunt tasks. To achieve this, we’ll combine `grunt-contrib-watch`\
    \ with live-reload, to automatically reload assets in the browser. This will not\
    \ reduce the overall performance of our Grunt tasks, but it will provide the perceived\
    \ performance boost, as we will target which tasks are run, given the files that\
    \ are changing. The plug-in `grunt-contrib-watch` can be used to watch a set of\
    \ files and run a set of tasks when these files change. [Listing 7-27](#part0014.html#list27)\
    \ demonstrates how to add the plug-in to the project.\n\n[**Listing 7-27**](#part0014.html#_list27).\
    \ Adding `grunt-contrib-watch` to the Project\n\n```\nnpm install --save-dev grunt-contrib-watch\n\
    ```\n\nNext, the configuration for the new plug-in must be added to the project.\
    \ To do this, let’s add a file to the `tasks` folder called `watch.js` (see [Listing\
    \ 7-28](#part0014.html#list28)).\n\n[**Listing 7-28**](#part0014.html#_list28).\
    \ `grunt-contrib-watch` Configuration to Automatically Run\n\n```\n'use strict';\n\
    \nmodule.exports = function (grunt) {\n  grunt.config(\n    'watch', {\n    css:\
    \ {\n      files: ['<%= paths.sass.src %>**/*.scss'],\n      tasks: ['css'],\n\
    \      options: {\n        livereload: true\n      }\n    }\n  });\n};\n```\n\n\
    [Listing 7-28](#part0014.html#list28) has the configuration for the new plug-in.\
    \ Each target for `grunt-contrib-watch` accepts two options: `files` and `tasks`.\
    \ The `files` option is one or more patterns for files to watch. These are patterns\
    \ supported by the `minimatch` library, as discussed earlier in the chapter. The\
    \ next option is the `tasks` option. This specifies which tasks should be run\
    \ when one of the files matching the patterns in the `files` option changes. In\
    \ our example, we’ve added `livereload` and set its value to `true`. This final\
    \ option is important, if we want to automatically reload our CSS in the browser\
    \ each time we make a change. To integrate this fully in our application task\
    \ runner, we have to modify the aliases module. The modified configuration is\
    \ shown in [Listing 7-29](#part0014.html#list29) by placing the `watch` task after\
    \ the development server is launched. However, if you now run the tasks, the `watch`\
    \ task will never run, as `connect` never exits. Therefore, Grunt will never run\
    \ the new task. To resolve this, we have to make one last change by removing the\
    \ `keepalive` option from our configuration. The `keepalive` option was originally\
    \ used to ensure that the local development server was not shut down. As the new\
    \ `watch` task does not exit, it continues instead to listen for changes in one\
    \ of the files being watched and then triggers the associated jobs to run. Once\
    \ the `keepalive` option is removed from `grunt-contrib-connect`, running the\
    \ default task should generate output as shown in [Figure 7-8](#part0014.html#Fig8).\
    \ As shown in [Figure 7-8](#part0014.html#Fig8), Grunt never exits unless it is\
    \ forced to, as `grunt-contrib-watch` does not exit unless forced.\n\n[**Listing\
    \ 7-29**](#part0014.html#_list29). Updated Alias Module to Include `grunt-contrib-watch`\
    \ After `grunt-contrib-connect`\n\n```\n'use strict';\n\nmodule.exports = function\
    \ (grunt) {\n\ngrunt.registerTask('prepare', ['clean', 'useminPrepare']);\n  grunt.registerTask('css',\
    \ ['newer:sass', 'newer:autoprefixer', 'newer:uncss']);\n  grunt.registerTask('dependencies',\
    \ ['bowerInstall']);\n  grunt.registerTask('js', ['newer:jshint', 'handlebars']);\n\
    \  grunt.registerTask('minify', ['copy', 'cssmin', 'newer:concat', 'requirejs',\
    \ 'rev', 'usemin']);\n  grunt.registerTask('build', ['prepare', 'dependencies',\
    \ 'css', 'js', 'minify']);\n\ngrunt.registerTask('default', ['build', 'connect:server',\
    \ 'watch']);\n  grunt.registerTask('serve', ['build', 'connect:dev']);\n  grunt.registerTask('test',\
