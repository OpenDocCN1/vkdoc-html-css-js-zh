    \ the new image element. As the images are also lazily loaded, the initial page\
    \ render time should be improved as well.\n\nThis concludes the section on responsive\
    \ images. Next, I’ll introduce a new plug-in capable of generating image sprites.\n\
    \nProducing Image Sprites\n\nThis is the final section of our exploration of Grunt\
    \ to automate image optimization for modern web applications. Image spriting is\
    \ a performance technique that aims to reduce the number of HTTP requests made\
    \ when rendering a page. An image sprite combines several smaller images into\
    \ a single larger image. Although this does not necessarily reduce the amount\
    \ of bandwidth used by the page, it can improve the performance of the load time\
    \ of the page. Having multiple requests for images from the same domain can lead\
    \ to a bottleneck in your page load time, as some browsers implement a limit on\
    \ the number of requests that can be simultaneously made to the same domain. For\
    \ example, Internet Explorer 10 restricts the number of parallel downloads for\
    \ a single domain to eight requests. Therefore, if you have a lot of iconography\
    \ on a page, this could lead to some icons taking longer than expected to be downloaded.\
    \ Creating an image sprite can help resolve this issue, as a single request is\
    \ made for the sprite, instead of a request per image.\n\nThe simplest yet most\
    \ time-consuming method of generating a sprite is by hand. This means opening\
    \ all your icons into your favorite image-editing software and carefully placing\
    \ each image alongside one another before exporting the newly produced sprite\
    \ as an optimized image. Once the sprite has been handcrafted, you will then have\
    \ to produce the CSS that will be used to position the sprite correctly, so that\
    \ only a single icon appears in the correct element. Each time you add a new icon\
    \ or logo to your site, you will have to reopen the sprite and modify the CSS.\
    \ Obviously, this isn’t ideal and carries a lot of overhead in terms of maintenance.\
    \ The maintenance is also doubled if you want to start producing a retina sprite\
    \ sheet for devices with higher pixel density displays.\n\nA second approach is\
    \ to use a free online tool, such as [www.spritebox.net](http://www.spritebox.net),\
    \ that provides convenient means for uploading and creating sprites. These online\
    \ tools are more powerful than the manual approach described previously, as they\
    \ often produce the CSS, LESS, or SASS for integrating into your application.\
    \ The main drawback of using these tools is the need to be online to use them,\
    \ and they don’t seamlessly integrate with your workflow. If you have to work\
    \ offline, you’ll have to wait until you can get back online before updating your\
    \ imagery and sprites. Also, as the images are generated online, you will have\
    \ to optimize these, once you copy the new sprite into your project.\n\nAutomating\
    \ Sprite Creation\n\nThe previous approaches are far from perfect, as outlined,\
    \ but some of the shortfalls can be addressed by the use of Grunt. Using Grunt\
    \ to generate the sprite has benefits of making the process repeatable and reusable.\
    \ In addition to these, most Grunt plug-ins developed for sprite generation can\
    \ be run offline. There are a number of sprite generation plug-ins available for\
    \ Grunt. I will focus on one in particular, called grunt-spritesmith. This plug-in\
    \ has a rich set of options that allows for full control over the sprite generated\
    \ and also provides options to output CSS for most major CSS preprocessors. [Listing\
    \ 5-13](#part0012.html#list13) demonstrates how to install grunt-spritesmith to\
    \ your project.\n\n[***Listing 5-13***](#part0012.html#_list13). Installing grunt-spritesmith\n\
    \n```\nnpm install  grunt-spritesmith --save-dev\n```\n\nThe plug-in works on\
    \ the basis of using a sprite engine. A sprite engine is an external image-processing\
    \ tool that the plug-in uses to process the sprite. The plug-in, at the time of\
    \ writing, supports pngsmith, phantomjs, canvas, and GraphicsMagick as sprite\
    \ engines. The choice of sprite engine affects the capabilities of the plug-in.\
    \ For example, using pngsmith will prevent the plug-in from processing images\
    \ that are not png files. While canvas offers the best performance when processing\
    \ more than 100 sprites, it is only supported on the Linux platform. In our examples,\
    \ we will be using phantomjs, which is capable of processing all image formats.\n\
    \nLet’s start to explore the options available when generating a sprite with grunt-spritesmith.\
    \ [Listing 5-14](#part0012.html#list14) provides a sample configuration that we\
    \ will go through in detail.\n\n[***Listing 5-14***](#part0012.html#_list14).\
    \ grunt-spritesmith Configuration\n\n```\nsprite: {\n    app: {\n      src: ['build/icons/**.png'],\n\
          destImg: 'app/img/sprite.png',\n      destCSS: 'build/styles/_sprite.scss',\n\
          imgPath: '../img',\n      algorithm: 'top-down',\n      padding: 35,\n      engine:\
    \ 'phantomjs',\n      cssFormat: 'scss'\n    }\n  }\n```"
  trans: "```html\n<picture>\n   <source media=\"(min-width: 64em)\" src=\"high-res.jpg\"\
    >\n   <source media=\"(min-width: 37.5em)\" src=\"med-res.jpg\">\n   <source src=\"\
    low-res.jpg\">\n   <img src=\"fallback.jpg\" alt=\"此图片在不支持的浏览器上加载。\">\n   <p>无障碍文本。</p>\n\
    </picture>\n```\n\n为了在旧版浏览器中实现类似的解决方案，我建议先提供最低质量的图片，然后通过 JavaScript 解决方案渐进式地增强用户体验。其中一个方案是由\
    \ BBC 响应式新闻团队开发的 `Imager.js`（<https://github.com/BBC-News/Imager.js/>）。\n\n`Imager.js`\
    \ 简化了处理响应式图片的工作流程，并防止浏览器下载多张重复图片。它通过使用带有图片源数据属性的元素来替换原有的图片元素。这些元素会交由 `Image.js`\
    \ 处理，然后根据可用的图片宽度进行定义，同时还能定义像素密度。之后，`Image.js` 会在页面上运行，将这些元素替换为最适合当前页面的图片元素。清单\
    \ 5-11 展示了 `Image.js` 运行前的 HTML 代码，而清单 5-12 则展示了 `Imager.js` 对页面 HTML 的影响。\n\n\
    ***清单 5-11***. Image.js 运行前的 HTML 代码\n\n```\n<div style=\"width: 240px\">\n  \
    \  <div class=\"delayed-image-load\" data-src=\"http://placehold.it/{width}\"\
    \ data-alt=\"替代文本\"></div>\n</div>\n\n<script>\n    new Imager({ availableWidths:\
    \ [200, 260, 320, 600] });\n</script>\n```\n\n***清单 5-12***. Image.js 修改页面后的 HTML\
    \ 代码\n\n```\n<div style=\"width: 240px\">\n    <img src=\"http://placehold.it/260\"\
    \ data-src=\"http://placehold.it/{width}\" \nalt=\"替代文本\" class=\"image-replace\"\
    >\n</div>\n\n<script>\n    new Imager({ availableWidths: [200, 260, 320, 600]\
    \ });\n</script>\n```\n\n如清单 5-12 所示，`Image.js` 修改了原始的 `div` 元素，将其替换为一个新的 `img`\
    \ 元素。从可用的尺寸数组中，`Image.js` 为当前设备选择了 260。它会将占位符 `{width}` 替换为选中的宽度，然后将其设置为新图片元素的\
    \ `src` 属性。由于图片也采用了懒加载，页面的初始渲染时间也应得到改善。\n\n关于响应式图片的内容到此结束。接下来，我将介绍一个能生成图片精灵（Image\
    \ Sprites）的新插件。\n\n## 制作图片精灵\n\n这是我们探索使用 Grunt 为现代 Web 应用自动化图片优化的最后一个部分。图片精灵是一种性能优化技术，旨在减少渲染页面时发出的\
    \ HTTP 请求数量。图片精灵将多个小图片合并成一张大图。虽然这不一定能减少页面消耗的带宽总量，但可以提升页面的加载性能。从同一域名请求多张图片可能导致页面加载时间的瓶颈，因为部分浏览器对同一域名的并发请求数有限制。例如，Internet\
    \ Explorer 10 将单个域名的并行下载数限制为 8 个。因此，如果页面上有很多图标，可能会导致某些图标的下载时间超出预期。创建图片精灵有助于解决这个问题，因为只需要为精灵图发起一次请求，而不是每张图片都请求一次。\n\
    \n生成精灵图最简单但最耗时的方法是手工操作。这意味着打开你最喜欢的图片编辑软件，将所有图标导入其中，仔细地将每张图片相邻放置，然后将新生成的精灵图导出为优化后的图片。手工制作完精灵图后，你还需要编写\
    \ CSS 来正确定位精灵图，以便在正确的元素中只显示一个图标。每次为网站添加新图标或 Logo 时，你都必须重新打开精灵图并修改 CSS。显然，这并不理想，并且会带来大量的维护开销。如果你还想为具有更高像素密度显示器的设备制作视网膜精灵图，维护工作量还会翻倍。\n\
    \n第二种方法是使用免费的在线工具，例如 [www.spritebox.net](http://www.spritebox.net)，它提供了上传和创建精灵图的便捷方式。这些在线工具比之前描述的手动方法更强大，因为它们通常会生成\
    \ CSS、LESS 或 SASS，方便集成到你的应用中。使用这些工具的主要缺点是需要联网才能使用，并且它们不能与你的工作流程无缝集成。如果你需要离线工作，就必须等到恢复联网后才能更新你的图片和精灵图。此外，由于图片是在线生成的，一旦你将新的精灵图复制到项目中，还需要对其进行优化。\n\
    \n## 自动化创建精灵图\n\n如上所述，前面的方法远非完美，但其中一些缺点可以通过使用 `Grunt` 来解决。使用 `Grunt` 生成精灵图的好处是使过程可重复且可复用。除此之外，大多数为精灵图生成而开发的\
    \ `Grunt` 插件都可以离线运行。`Grunt` 有许多可用的精灵图生成插件。我将重点介绍其中一个，名为 `grunt-spritesmith`。这个插件拥有丰富的选项，可以完全控制生成的精灵图，并且还提供了为大多数主流\
    \ CSS 预处理器输出 CSS 的选项。清单 5-13 演示了如何将 `grunt-spritesmith` 安装到你的项目中。\n\n***清单 5-13***.\
    \ 安装 grunt-spritesmith\n\n```\nnpm install  grunt-spritesmith --save-dev\n```\n\
    \n该插件基于精灵引擎（sprite engine）运行。精灵引擎是一个外部的图片处理工具，插件使用它来处理精灵图。在撰写本文时，该插件支持 `pngsmith`、`phantomjs`、`canvas`\
    \ 和 `GraphicsMagick` 作为精灵引擎。精灵引擎的选择会影响插件的能力。例如，使用 `pngsmith` 会阻止插件处理非 png 格式的图片。虽然\
    \ `canvas` 在处理超过 100 个精灵图时性能最佳，但它仅支持 Linux 平台。在我们的示例中，我们将使用能够处理所有图片格式的 `phantomjs`。\n\
    \n让我们开始探索使用 `grunt-spritesmith` 生成精灵图时可用的选项。清单 5-14 提供了一个示例配置，我们将对其进行详细说明。\n\n\
    ***清单 5-14***. grunt-spritesmith 配置\n\n```\nsprite: {\n    app: {\n      src:\
    \ ['build/icons/**.png'],\n      destImg: 'app/img/sprite.png',\n      destCSS:\
    \ 'build/styles/_sprite.scss',\n      imgPath: '../img',\n      algorithm: 'top-down',\n\
    \      padding: 35,\n      engine: 'phantomjs',\n      cssFormat: 'scss'\n   \
    \ }\n  }\n```"
- fmt: "如[列表5-14](#part0012.html#list14)所示，`grunt-spritesmith`为生成适合特定用例的精灵图提供了极大的灵活性。我将回顾[列表5-14](#part0012.html#list14)中定义的每个选项，并解释每个选项对输出的精灵图和CSS的影响。第一个选项仅用于定义哪些文件应包含在精灵图中。在示例中，我们在`build`文件夹中添加了一个包含所有图标的新文件夹。下一个选项`destImg`决定了生成的精灵图的位置和文件名。第三个选项决定了插件生成的CSS的位置和文件名。在我们的示例中，我们希望生成`SCSS`以集成到现有的`SCSS`工作流程中。`imgPath`选项控制生成的CSS中出现的图像路径。如果你的路径与构建路径不同，这会非常有用。在我们的案例中，`CSS`和图像在构建文件夹中的位置不同；因此，我们指定了图像路径，以便图像能够正确加载。`algorithm`选项控制图像在生成的精灵图中的布局方式。此选项允许图像从上到下、从左到右或沿对角线添加。这在处理响应式解决方案时特别有用，因为图像可能需要以特定方式布局以支持不同的设备宽度。与`algorithm`选项一样，`padding`选项也控制图像在精灵图中的布局。顾名思义，`padding`控制每个图标周围的填充量。在我们的示例中，我们选择为每个图标添加`35px`的填充。当你有需要应用背景图像的大元素，并且必须确保只有一个图标显示为背景图像图标时，这很有用。如前所述，`grunt-spritesmith`将图像创建委托给第三方图像工具。`engine`选项控制用于生成精灵图的工具。在[列表5-14](#part0012.html#list14)中，`phantomjs`被用作创建精灵图的工具。`grunt-spritesmith`最强大的功能之一是能够以所选格式输出`CSS`。在我们的示例中，我们指定了`SCSS`；但是，该插件支持`LESS`、`SASS`、`Stylus`和`CSS`输出。\n\
    \n[列表5-14](#part0012.html#list14)中的配置输出两个资源：精灵图文件和`SCSS`文件。[图5-4](#part0012.html#Fig4)展示了项目目录中的输出文件。\n\
    \n![9781484200148_Fig05-04.jpg](images/00035.jpeg)\n\n[图5-4](#part0012.html#_Fig4)。`grunt-spritesmith`插件输出的精灵图和`SCSS`文件\n\
    \n使用`grunt-spritesmith`为精灵表生成`SCSS`的另一个好处是它生成了一组丰富的`mixin`。[列表5-15](#part0012.html#list15)提供了从上述示例生成的完整`SCSS`文件示例。\n\
    \n[***列表5-15***](#part0012.html#_list15)。`grunt-spritesmith`输出的`SCSS`示例\n\n```\n\
    $upload-x: 0px;\n$upload-y: 1443px;\n$upload-offset-x: 0px;\n$upload-offset-y:\
    \ -1443px;\n$upload-width: 76px;\n$upload-height: 76px;\n$upload-total-width:\
    \ 76px;\n$upload-total-height: 1741px;\n$upload-image: '../img';\n$upload: 0px\
    \ 1443px 0px -1443px 76px 76px 76px 1741px '../img';\n\n@mixin sprite-width($sprite)\
    \ {\n  width: nth($sprite, 5);\n}\n\n@mixin sprite-height($sprite) {\n  height:\
    \ nth($sprite, 6);\n}\n\n@mixin sprite-position($sprite) {\n  $sprite-offset-x:\
    \ nth($sprite, 3);\n  $sprite-offset-y: nth($sprite, 4);\n  background-position:\
    \ $sprite-offset-x  $sprite-offset-y;\n}\n\n@mixin sprite-image($sprite) {\n \
    \ $sprite-image: nth($sprite, 9);\n  background-image: url(#{$sprite-image});\n\
    }\n\n@mixin sprite($sprite) {\n  @include sprite-image($sprite);\n  @include sprite-position($sprite);\n\
    \  @include sprite-width($sprite);\n  @include sprite-height($sprite);\n}\n```\n\
    \n对于添加到精灵表的每个图像，`grunt-spritesmith`会生成许多以文件名开头的变量。每个变量都包含图像的属性，例如，在精灵表中的`x`坐标。这些变量被组合起来，并由生成的`mixin`使用。该插件还会生成四个`mixin`。前四个是便捷`mixin`，由主`mixin`\
    \ `sprite`使用。`sprite` `mixin`是实际用于生成包含图标或图像作为背景的`CSS`输出的`mixin`。[列表5-16](#part0012.html#list16)演示了如何使用`sprite`\
    \ `mixin`将上传图标添加到我们的`CSS`输出中。\n\n[***列表5-16***](#part0012.html#_list16)。使用`grunt-spritesmith`在`CSS`中生成图标\n\
    \n```\n.icon-upload {\n  @include sprite-width($icon-upload);\n}\n```\n\n各种变量的创建与`grunt-spritesmith`生成的`mixin`相结合，使得维护精灵表变得异常容易。精灵表本身的任何更改对`SCSS`都是透明的，因为变量值的更改不需要在`SCSS`中进行任何更新。此外，精灵表和`SCSS`可以传递给其他`Grunt`任务，从而实现诸如代码检查和压缩等任务。\n\
    \n## 使用SVG\n\n本章的第一部分致力于优化Web的光栅图像。在余下的章节中，我将重点优化处理`SVG`文件的工作流程。`SVG`非常适合生成可缩放且可使用`CSS`设置样式的轻量级图标。`SVG`是一种基于`XML`的文件格式，适用于生成二维图形，其中元素用于定义路径、形状和多边形。[列表5-17](#part0012.html#list17)演示了一个基本的`SVG`文件，[图5-5](#part0012.html#Fig5)展示了该`SVG`文件的视觉效果。\n\
    \n[***列表5-17***](#part0012.html#_list17)。`SVG`文档示例\n\n```\n<?xml version=\"1.0\"\
    \ standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD SVG 1.1//EN\" \"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"39\" height=\"32\" viewBox=\"\
    0 0 39 32\">\n    <!-- tick icon -->\n    <path d=\"M15.815 32l23.475-28.046-4.695-3.954-19.521\
    \ 23.228-11.12-9.266-1.954 10.695z\"/>\n</svg>\n```\n\n![9781484200148_Fig05-05.jpg](images/00036.jpeg)\n\
    \n[图5-5](#part0012.html#_Fig5)。[列表5-17](#part0012.html#list17)输出的`SVG`视觉效果\n\n\
    除了基本的二维图形外，`JavaScript`和`CSS`也可以与`SVG`一起使用来制作动画。这并非`SVG`成为理想图标格式的唯一特性。使用`SVG`作为图标的主要优势在于它们体积轻量，并且可以在不影响图像质量的情况下轻松缩放。过去几年中，`SVG`文件的使用有所增加，这主要是由人们通过各种设备访问Web的趋势推动的。由于`SVG`的文件大小通常小于光栅图像，并且如前所述易于缩放，这解决了为高像素密度显示器设备渲染清晰图像的问题。然而，与所有页面资源一样，应谨慎考虑，以避免使页面臃肿、增加页面重量并导致不良的用户体验。`Grunt`通过提供自动化优化`SVG`文件的工具，有助于降低这种风险。\n\
    \n### 压缩SVG"
  raw: 'As demonstrated in [Listing 5-14](#part0012.html#list14), grunt-spritesmith
    provides a lot of flexibility for generating a sprite that will work for your
    particular use case. I’ll review each of the options defined in [Listing 5-14](#part0012.html#list14)
    and provide an explanation of the impact each has on the outputted sprite and
    CSS. The first option is simply one to define which files should be included in
    the sprite. In the example, we have added a new folder in the build folder that
    contains all our icons. The next option, destImg, determines the location and
    the file name of the sprite sheet produced.  The third option determines the location
    and the file name of the CSS produced by the plug-in. In our example, we are looking
    to produce SCSS to integrate with our existing SCSS workflow. The option imgPath
    controls the image path that appears within the CSS produced. This is useful if
    your path is different from your build. In our case, the CSS and images are not
    in the same location in our build folder; therefore, we specify the image path,
    so that our images will be correctly loaded. The algorithm option controls how
    the images are laid out in the sprite generated. This option allows the images
    to be added from top to bottom, left to right, or diagonally. This is particularly
    useful when working on a responsive solution for which images may have to be laid
    out in a particular manner, to support varying device widths. As with the algorithm
    option, the padding option also controls the layout of the images within the sprite.
    padding, as the name suggests, controls the amount of padding around each icon.
    In our example, we’ve chosen to use 35px padding around each icon. This is useful
    when you have large elements that require background images applied, and you have
    to ensure that only a single icon appears as the background image icon. As discussed,
    grunt-spritesmith delegates the image creation to third-party image tools. The
    engine option controls which tool is used to produce the sprite. In [Listing 5-14](#part0012.html#list14),
    phantomjs is used as the tool to create the sprite image. One of the most powerful
    features of grunt-spritesmith is the ability to output the CSS in a chosen format.
    In our example, we’ve specified SCSS; however, the plug-in supports LESS, SASS,
    Stylus, and CSS outputs.


    The output from the configuration in [Listing 5-14](#part0012.html#list14) is
    two assets: the sprite image and SCSS file. [Figure 5-4](#part0012.html#Fig4)
    demonstrates the output files in the project directory.


    ![9781484200148_Fig05-04.jpg](images/00035.jpeg)


    [Figure 5-4](#part0012.html#_Fig4). Sprite and SCSS files output from the grunt-spritesmith
    plug-in


    Another benefit of using grunt-spritesmith to produce the SCSS for your sprite
    sheet is the rich set of mixins produced. [Listing 5-15](#part0012.html#list15)
    provides a sample of the overall SCSS file produced from the preceding example.


    [***Listing 5-15***](#part0012.html#_list15). Sample SCSS Output from grunt-spritesmith


    ```

    $upload-x: 0px;

    $upload-y: 1443px;

    $upload-offset-x: 0px;

    $upload-offset-y: -1443px;

    $upload-width: 76px;

    $upload-height: 76px;

    $upload-total-width: 76px;

    $upload-total-height: 1741px;

    $upload-image: ''../img'';

    $upload: 0px 1443px 0px -1443px 76px 76px 76px 1741px ''../img'';


    @mixin sprite-width($sprite) {

      width: nth($sprite, 5);

    }


    @mixin sprite-height($sprite) {

      height: nth($sprite, 6);

    }


    @mixin sprite-position($sprite) {

      $sprite-offset-x: nth($sprite, 3);

      $sprite-offset-y: nth($sprite, 4);

      background-position: $sprite-offset-x  $sprite-offset-y;

    }


    @mixin sprite-image($sprite) {

      $sprite-image: nth($sprite, 9);

      background-image: url(#{$sprite-image});

    }


    @mixin sprite($sprite) {

      @include sprite-image($sprite);

      @include sprite-position($sprite);

      @include sprite-width($sprite);

      @include sprite-height($sprite);

    }

    ```


    For each image added to the sprite sheet, grunt-spritesmith produces a number
    of variables prepended with the file name. Each variable contains a property for
    the image, for example, the x coordinate within the sprite sheet. These variables
    are combined and used by the mixins produced. There are also four mixins produced
    by the plug-in. The first four are convenience mixins that are used by the primary
    mixin, sprite. The sprite mixin is the mixin that can be used to actually produce
    CSS output that will contain the icon or image as background. [Listing 5-16](#part0012.html#list16)
    demonstrates the use of the sprite mixin to add the upload icons to our CSS output.


    [***Listing 5-16***](#part0012.html#_list16). Using grunt-spritesmith to Produce
    Icons in CSS


    ```

    .icon-upload {

      @include sprite-width($icon-upload);

    }

    ```


    The creation of the various variables combined with the mixins produced by grunt-spritesmith
    makes maintaining your sprites incredibly easy. Any changes within the sprite
    itself are hidden from your SCSS, as the variable values changes do not require
    any updates within your own SCSS. In addition, the sprite and the SCSS can be
    passed through your other grunt tasks, leading to tasks such as linting and minification
    being applied.


    Working with SVGs


    The first part of this chapter has been dedicated to optimizing raster imagery
    for the Web. In the remainder of the chapter, I will focus on optimizing our workflow
    for dealing with SVG files. SVGs are excellent for producing lightweight icons
    that scale and can be styled using CSS. SVGs are an XML-based file format suitable
    for producing two-dimensional graphics in which elements are used to define paths,
    shapes, and polygons. [Listing 5-17](#part0012.html#list17) demonstrates a basic
    SVG file, and [Figure 5-5](#part0012.html#Fig5) illustrates the visual appearance
    of this SVG file.


    [***Listing 5-17***](#part0012.html#_list17). Sample SVG Document


    ```

    <?xml version="1.0" standalone="no"?>

    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">

    <svg xmlns="http://www.w3.org/2000/svg" width="39" height="32" viewBox="0 0 39
    32">

        <!-- tick icon -->

        <path d="M15.815 32l23.475-28.046-4.695-3.954-19.521 23.228-11.12-9.266-1.954
    10.695z"/>

    </svg>

    ```


    ![9781484200148_Fig05-05.jpg](images/00036.jpeg)


    [Figure 5-5](#part0012.html#_Fig5). The SVG visual output from [Listing 5-17](#part0012.html#list17)


    Along with basic two-dimensional graphics, JavaScript and CSS can be used with
    SVG to produce animations as well. This isn’t the only feature of SVG that makes
    them desirable as a format of icons. The key benefit of using SVGs for icons is
    the fact that they are lightweight and can be easily scaled without affecting
    the quality of the image. The use of SVG files has increased over the past couple
    of years, primarily driven by the rise of people accessing the Web from a variety
    of devices. As SVGs are generally smaller in file size than raster images and,
    as stated previously, are easily scaled, this solves the problem of rendering
    sharp imagery for devices with high pixel density displays. However, as with all
    page assets, careful consideration should be taken not to bloat the page, adding
    page weight and producing a poor user experience. Grunt can help reduce the risk
    of this, by providing tools to automate optimization of SVG files.


