    \      dest: 'dist/'\n    }\n  },\n\nusemin: {\n    html: 'dist/index.html'\n\
    \  }\n\n// 默认任务。\ngrunt.registerTask('default', [\n  'useminPrepare',\n  'sass',\n\
    \  'bowerInstall',\n  'autoprefixer',\n  'recess',\n  'uncss',\n  'usemin'\n]);\n\
    ```\n\n如你所见，`useminPrepare` 和 `usemin` 本身的实际配置相当精简。我们告诉 `usemin` 用于准备的 HTML 文件位置，以及后续要由\
    \ `usemin` 处理的文件位置。目前，我们的 `dist` 文件夹中还没有 `index.html` 文件；因此，我们需要引入一个新的 Grunt 插件，名为\
    \ `grunt-contrib-copy`。该插件用于在项目内部将文件或文件夹从一个位置复制到另一个位置。在我们的项目中，我们将使用 `grunt-contrib-copy`\
    \ 将 `index.html` 文件从 `app/index.html` 复制到 `dist/index.html`。然后，该文件将由 `usemin`\
    \ 处理，以更新对优化后 CSS 的引用。在 `dist` 文件夹中拥有 `index.html` 文件，使我们能够在构建包含正确引用了优化 CSS 的发布版本之前，先使用应用的开发副本进行本地工作。清单\
    \ 3-43 包含了 `grunt-contrib-copy` 的配置。\n\n***清单 3-43***. `<head>` 元素已被修改为包含对优化后\
    \ CSS 的引用\n\n```\n<head>\n<meta charset=\"utf-8\">\n<meta http-equiv=\"X-UA-Compatible\"\
    \ content=\"IE=edge\">\n<title>Pro Grunt.js: Todo List</title>\n<meta name=\"\
    description\" content=\"\">\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1\">\n<link rel=\"stylesheet\" href=\"css/main.css\">\n</head>\n\
    ```\n\n如你所见，`index.html` 现在包含了对优化后 CSS 的引用，已准备好部署到生产环境。在下一节中，我们将探讨静态资源优化缓存的资源版本控制，以及\
    \ Grunt 如何在这一过程中为我们提供帮助。\n\n## 版本控制\n\n在本章的最后一节中，我们将了解如何使用 Grunt 进一步提升生产环境代码的性能。本节将探讨如何交付带版本号的资源。交付带版本号的资源的主要原因是能够为我们的静态资源安全地设置遥远的未来缓存头。设置遥远的未来缓存头可以提高性能，因为客户端可以缓存你的资源副本，从而避免每次加载页面时都必须返回服务器重新请求资源。通常，我们会为\
    \ CSS、Web 字体和 JavaScript 等资源设置一个遥远的未来过期头。有关过期头配置的 Web 服务器示例，请查看 HTML5 Boilerplate\
    \ 的 `.htaccess` 文件。这为使用 Apache Web 服务器的用户提供了一个很好的起点，它将大多数静态资源的过期时间设置为从它们被访问之时起的一个月后。\n\
    \n如前所述，Grunt 可以帮助通过设置遥远的未来缓存头来交付静态资源。简单地发送一个遥远的未来日期作为过期头可能存在风险。对该资源的任何更新都不会被客户端获取，直到缓存过期并且客户端从服务器重新请求该资源为止。解决这个问题有几种方法。一种流行的方法是为资源的\
    \ URL 添加一个缓存破坏器。当资源本身发生变化时，缓存破坏器会更新，强制客户端从服务器重新请求该资源。清单 3-44 显示了一个附加了缓存破坏器的 CSS\
    \ 文件的示例 URL。\n\n***清单 3-44***. 附加了缓存破坏器的 CSS 示例 URL\n\n```\nhttp://mysite.com/styles/app.css?c=20140303\n\
    ```\n\n不幸的是，某些代理服务器默认配置为不缓存包含查询字符串的 URL。因此，我们需要一种替代方法。清单 3-45 展示了这两种方法。\n\n***清单\
    \ 3-45***. 替代资源版本控制方法\n\n```\nhttp://mysite.com/0.1.0/styles/app.css\nhttp://mysite.com/styles/app.0.1.0.css\n\
    ```\n\n第一种方法是将版本号插入到资源的路径中。这也是 BBC 当前对其资源进行版本控制所采用的方法。例如，BBC 主页有以下引用：[`static.bbci.co.uk/h4clock/0.69.3/style/h4clock.css`](http://static.bbci.co.uk/h4clock/0.69.3/style/h4clock.css)。在此例中，版本号为\
    \ `0.69.3`。另一种方法，即将版本号包含在资源文件名中，是 jQuery 在其 CDN 上提供 jQuery 服务时所使用的方式。例如，在撰写本文时，最新版\
    \ jQuery 的 URL 是 [`code.jquery.com/jquery-1.11.0.min.js`](http://code.jquery.com/jquery-1.11.0.min.js)。\n\
    \n有一个名为 `grunt-rev` 的 Grunt 插件可用于执行资源版本化生产。`grunt-rev` 插件基于文件内容生成一个哈希值。它提供了多种生成哈希值的算法，例如\
    \ `md5` 和 `sha256`。为文件生成的哈希值会被注入到文件扩展名之前。除此之外，`grunt-rev` 可以与上一节介绍的 `usemin` 插件完美配合。清单\
    \ 3-46 展示了这两个文件的最新配置。\n\n***清单 3-46***. 静态资源版本控制的配置\n\n```\nrev: {\n  dist: {\n\
    \    src: 'dist/css/main.css'\n  }\n}\n```\n\n如你所见，作为早期任务的一部分在临时文件夹中生成的 CSS，现在被\
    \ `rev` 任务获取并放入 `dist/css` 文件夹。完成后，`usemin` 会修改 `dist` 文件夹中的 `index.html` 文件，使其包含指向新版化\
    \ CSS 的路径。在这种情况下，使用哈希代替时间戳的好处是，哈希只应在文件内容本身发生更改时才改变。当有多个团队生成相同的静态资源时，这一点尤为重要。你只希望当文件内容发生真正更改时，资源名称才发生变化。\n\
    \n## 总结\n\n在本章中，我们探讨了在使用 HTML 和 CSS 时，如何使用 Grunt 来简化我们的开发工作流。我们从 CSS 预处理器的简要介绍以及\
    \ Grunt 如何帮助我们编译 CSS 开始。之后，我们转向 Bower，一个强大的前端依赖管理器，它可以与 Grunt 集成，使我们在项目中轻松管理前端库。本章的剩余部分介绍了一些可用于优化\
    \ HTML 和 CSS 的插件，以便将其发布到公共网络。\n\n在下一章中，我们将继续了解 Grunt 在应对前端技术时如何提供帮助，届时你将发现一套强大的插件，用于辅助\
    \ JavaScript 开发。\n\n# 第 4 章\n\n![image](img/00005.jpeg)\n\n## 使用 Grunt 处理 JavaScript"
- fmt: "# Grunt 与 JavaScript 模块化开发\n\n至此，我已经介绍了如何在一个项目上设置`Grunt`，并且你已经看到了它在处理 CSS\
    \ 和 HTML 时的作用。接下来，我们将开始探索在 JavaScript 开发中使用`Grunt`的好处。正如最初介绍`Grunt`时提到的，它是基于`Node.js`平台（一个\
    \ JavaScript 引擎）编写的。这一事实使得`Grunt`成为处理 JavaScript 工作时的完美工具，因为开发者可以利用现有的`Node.js`模块快速处理插件以扩展他们的工作流程。在本章中，我将介绍`Grunt`如何帮助进行\
    \ JavaScript 模板化、处理 JavaScript 模块以及自动化测试。首先，我将概述我们计划如何扩展待办事项列表应用，并使用`Grunt`来自动化我们的工作流程和构建过程。\n\
    \n## 增强我们的待办事项列表应用\n\n目前，我们的待办事项列表应用仍然非常基础。我们已经有了一个完全使用`Grunt`构建的 HTML 和 CSS 大纲。在本章中，我们将继续在此基础上进行构建，使用`Grunt`添加一个由流行的\
    \ JavaScript 框架`BackBone.js`驱动的丰富用户界面。此外，我们将研究如何测试我们的应用、生成文档，以及通过 lint 和压缩 JavaScript\
    \ 来为生产环境构建我们的应用。\n\n首先，让我们使用`Bower`安装`Backbone.js`。[图 4-1](#part0011.html#Fig1)\
    \ 演示了通过`Bower`安装`Backbone`的过程。\n\n![9781484200148_Fig04-01.jpg](images/00025.jpeg)\n\
    \n[图 4-1](#part0011.html#_Fig1) 安装`Backbone.js`也会导致安装`underscore.js`，因为`Backbone`依赖于这个库。\n\
    \n接下来，我们需要更新我们的应用。运行`Grunt`将更新项目根目录下的`index.html`文件，以包含对`Backbone.js`和`underscore.js`的引用。\n\
    \n`Backbone.js`提供了一种 MV* 架构，允许开发者将应用逻辑划分为逻辑部分。它松散地遵循了许多现代 Web 应用框架（如 Ruby on Rails）所遵循的相同模式。这将使我们能够以模块化的方式开发待办事项应用：一个模块负责存储数据，另一个负责展示数据，再另一个负责控制应用流程。这很好地引出了`Grunt.js`如何帮助我们使用模块开发\
    \ JavaScript 应用并优化它们以便交付到生产环境的话题。\n\n## JavaScript 模块\n\n使用不同模块开发应用的好处是众所周知的。模块化软件通常能提高可维护性，因为每个模块被设计为执行单一任务，并且可以与系统的其他部分解耦。此外，模块有助于封装功能，对模块用户隐藏实现细节。这使得修改模块内部结构变得更容易，而不会影响系统的其他部分。\n\
    \n大多数现代编程语言原生支持分发和导入模块，但遗憾的是，当前版本的 JavaScript 并不支持。然而，ECMAScript 6（也称为`Harmony`或`ES6`），即下一版本的\
    \ JavaScript，将支持将模块导入到我们的 JavaScript 应用中。虽然本文编写时浏览器还不支持 ES6 模块加载，但我们仍然可以使用框架和工具来开始在\
    \ JavaScript 应用中使用模块。\n\n除了 ES6 定义的模块格式外，目前还有两种其他流行的格式：AMD 和 CommonJS。在了解`Grunt.js`如何帮助我们利用\
    \ JavaScript 应用中模块的强大功能之前，让我们先简要了解一下每种格式。\n\n### AMD\n\nAMD 代表 *Asynchronous Module\
    \ Definition*（异步模块定义），旨在让 JavaScript 开发者现在就能在浏览器中使用模块。AMD 源于 Dojo 框架在使用 XHR +\
    \ eval 过程中的实际经验，并试图避免这些方法的弱点。AMD 格式规定了如何定义模块以及要异步加载的依赖关系。\n\n与传统的网页 JavaScript\
    \ 方法相比，AMD 提供了许多优势。不再需要多个`script`标签和拥挤的全局命名空间，而是使用一个单一的 JavaScript 应用文件，所有其他模块都异步加载。每个模块封装了自己的功能，并且必须显式地返回一个接口供其他模块使用。\n\
    \n定义和使用 AMD 模块时有两个基本概念。第一个是`define`函数。`define`函数提供了一种命名模块、声明依赖关系和模块实现的方法。[清单 4-1](#part0011.html#list1)\
    \ 展示了一个非常基础的 AMD 模块，它返回两个属性：`keys`和`cities`。[清单 4-1](#part0011.html#list1) 演示了\
    \ AMD 模块的一些基本方面。`define`函数用于定义我们的模块，它接受三个参数：模块名称、模块依赖关系以及包含模块实现的回调函数。在这个例子中，我们将模块命名为`simpleModule`，并定义了对`underscore`框架的单一依赖。最后一个参数是模块的实现。需要注意的是，`underscore`作为参数传递给了我们的回调函数，以便在模块中使用它。通过允许依赖项被传递到模块的作用域内，就不需要将模块分配给全局命名空间。这减少了模块之间副作用的风险，因为每个模块只访问其作用域内的变量。\n\
    \n[***清单 4-1***](#part0011.html#_list1) 一个基础的 AMD 模块\n\n```\ndefine(\n  'simpleModule',\n\
    \  ['/underscore'],\n  function(_) {\n\nvar places = {\n      'nyc': 'New York',\n\
    \      'lon': 'London'\n    };\n\nreturn {\n        keys: _.keys(places),\n  \
    \      cities: _.values(places).sort()\n    };\n});\n```\n\n在[清单 4-1](#part0011.html#list1)\
    \ 中，返回了一个包含两个值`keys`和`cities`的对象。然而，AMD 并没有规定模块必须返回的类型。例如，模块可以返回一个单一的值，或者一个可以稍后执行的函数。在结束对定义\
    \ AMD 模块的介绍之前，重要的是要注意最佳实践是不命名模块，并且每个 AMD 模块都应该定义在自己的文件中。通过应用这两个原则，模块的可移植性会提高，其他开发者可以将模块移动到不同的路径，从而为模块赋予不同的名称/ID。\n\
    \n现在我们有了一个定义的模块，我们需要一种方法将它包含在我们的应用中，以便可以使用它。AMD 模块的另一个基本概念是`require`函数。`require`函数用于加载模块。[清单\
    \ 4-2](#part0011.html#list2) 演示了一个加载并使用[清单 4-1](#part0011.html#list1) 中定义的模块的小型\
    \ JavaScript 应用。\n\n[***清单 4-2***](#part0011.html#_list2) 使用`require`加载和使用其他模块\n\
    \n```\ndefine(['jquery'], function($) {\n  require(['data/cities'], function(data)\
    \ {\n    $('#cities').text(data.cities.join(', '));\n  });\n});\n```\n\n在[清单 4-2](#part0011.html#list2)\
    \ 中，我们首次看到`require`函数的使用。在这个特定的例子中，我们是在一个新模块的作用域内使用`require`。该模块依赖于`jQuery`，然后使用`require`函数加载我们在[清单\
    \ 4-1](#part0011.html#list1) 中定义的模块。到目前为止，我们还没有探讨模块 ID 的话题。在[清单 4-2](#part0011.html#list2)\
    \ 中，我们使用模块 ID `data/cities`加载了（在[清单 4-1](#part0011.html#list1) 中定义的）模块。模块 ID 可以被视为相当于文件夹路径。为了帮助说明这一点，[图\
    \ 4-2](#part0011.html#Fig2) 展示了一个文件夹结构，代表了[清单 4-2](#part0011.html#list2) 中的例子。\n\
    \n![9781484200148_Fig04-02.jpg](images/00026.jpeg)"
  raw: 'At this point, I’ve covered setting up Grunt on a project, and you’ve seen
    how it can help when working with CSS and HTML. Next, we’ll start to explore the
    benefits of using Grunt while developing in JavaScript. As mentioned, when you
    were first introduced to Grunt, it is written on top of the Node.js platform,
    a JavaScript engine. This fact makes Grunt the perfect tool to use while working
    with JavaScript, as developers can exploit existing Node.js modules to rapidly
    process plug-ins to extend their workflow. In this chapter, I’ll cover how Grunt
    can help with JavaScript templating, working with JavaScript modules, and automated
    testing. First, I’ll outline how we plan to extend our to-do list application
    and use Grunt to automate our workflow and build process.


    Enhancing Our To-Do List Application


    At present, our to-do list application is still very basic. We’ve got an outline
    of HTML and CSS that is all built using Grunt. In the course of this chapter,
    we will continue to build on this application, by using Grunt to add a rich user
    interface powered by the popular JavaScript framework BackBone.js. In addition,
    we’ll look at how we can test our application, produce documentation, and build
    our application for production by linting and minifying the JavaScript.


    To get started, let’s install Backbone.js using Bower. [Figure 4-1](#part0011.html#Fig1)
    demonstrates the installation of Backbone with Bower.


    ![9781484200148_Fig04-01.jpg](images/00025.jpeg)


    [Figure 4-1](#part0011.html#_Fig1). Installing Backbone.js also leads to underscore.js
    being installed, as Backbone depends on this library


    Next, we have to update our application. Running Grunt will update the index.html
    file in the root of our application to include references to Backbone.js and underscore.js.


    Backbone.js provides an MV* architecture allowing developers to separate application
    logic into logical parts. It loosely follows the same pattern that many modern
    web application frameworks, such as Ruby on Rails, follow. This will allow us
    to develop our to-do application in modules: one responsible for storing data,
    another for presenting our data, and yet another for controlling the application
    flow. This leads us nicely to the topic of how Grunt.js can help us develop our
    JavaScript applications, using modules and optimizing them for delivery in production.


    JavaScript Modules


    The benefits of developing applications with distinct modules are well understood.
    Modular software often leads to improved maintainability, as each module is designed
    to perform a single task and can be decoupled from other parts of the system.
    In addition, modules help encapsulate functionality, hiding the implementation
    details from users of the module. This makes it easier to modify the internals
    of a module without affecting other parts of the system.


    Most modern programming languages have native support for distributing and importing
    modules, but, unfortunately, the current iteration of JavaScript does not. However,
    ECMAScript 6, also known as Harmony or ES6, the next version of JavaScript, will
    offer support for importing modules into our JavaScript applications. While browsers,
    at the time of writing, do not offer support for ES6 module loading, we can still
    use frameworks and tools to start using modules within our JavaScript application
    today.


    Aside from the ES6 definition of a modular format, there are two other popular
    formats currently used, known as AMD and CommonJS. Before looking at how Grunt.js
    can help us utilize the power of modules within our JavaScript applications, let’s
    take a brief look at each of these formats.


    AMD


    AMD stands for *Asynchronous Module Definition* and aims to allow JavaScript developers
    to use modules within browsers today. AMD arises from real-world experiences of
    the Dojo framework with the use of XHR + eval and seeks to avoid the weaknesses
    in these. The AMD format states how to define modules and the dependencies to
    be loaded asynchronously.


    AMD offers a number of benefits over the traditional method, including JavaScript
    within a web page. Instead of multiple script tags and a pollulated global namespace,
    there is a single JavaScript application file, and all other modules are loaded
    asynchronously. Each module encapsulates its own functionality and has to explicitly
    return an interface for other modules to utilize.


    There are two fundamental concepts used when defining and using AMD modules. The
    first of these is the function define. The define function provides a method for
    naming a module, declaring the dependencies and the implementation of the module.
    [Listing 4-1](#part0011.html#list1) illustrates a very basic AMD module that returns
    two properties: keys and cities. [Listing 4-1](#part0011.html#list1) demonstrates
    some fundmental aspects of the AMD modules. The define function is used to define
    our module, and it accepts three parameters: the module name, the module dependencies,
    and the callback function containing the module’s implementation. In this example,
    we’ve named our module simpleModule and defined a single dependency on the framework
    underscore. The final parameter is the implementation. It is important to note
    that underscore is passed into our callback as a parameter, so that it can be
    used within our module. By allowing dependencies to be passed into the scope of
    our module, the need for modules to be assigned to the global namespace is removed.
    This reduces the risk of side effects across modules, as each module only accesses
    variables within its scope.


    [***Listing 4-1***](#part0011.html#_list1). A Basic AMD Module


    ```

    define(

      ''simpleModule'',

      [''/underscore''],

      function(_) {


    var places = {

          ''nyc'': ''New York'',

          ''lon'': ''London''

        };


    return {

            keys: _.keys(places),

            cities: _.values(places).sort()

        };

    });

    ```


    In [Listing 4-1](#part0011.html#list1), an object is returned with two values
    attached: keys and cities. However, AMD does not prescribe the type returned by
    a module. For example, it is acceptable for a module to return a single value
    or a function that can be executed later. Before concluding our introduction to
    defining AMD modules, it is important to note that it is best pratice not to name
    modules, and each AMD module should be defined in its own file. By applying these
    two principles, the portability of modules improves, and other developers can
    move modules into different paths to give the module a different name/ID.


    Now that we have a module defined, we need a way of including it within our application,
    so that it can be used. Another fundamental concept of AMD modules is the require
    function. The require function is used to load modules. [Listing 4-2](#part0011.html#list2)
    demonstrates a small JavaScript application that loads and uses the module defined
    in [Listing 4-1](#part0011.html#list1).


    [***Listing 4-2***](#part0011.html#_list2). Using require to Load and Use Other
    Modules


    ```

    define([''jquery''], function($) {

      require([''data/cities''], function(data) {

        $(''#cities'').text(data.cities.join('', ''));

      });

    });

    ```


    In [Listing 4-2](#part0011.html#list2), we see the use of the require function
    for the first time. In this particular example, we’re using require within the
    scope of a new module. The module has a dependency on jQuery and then uses the
    require function to load the module we defined in [Listing 4-1](#part0011.html#list1).
    As of yet, we haven’t explored the topic of module IDs. In [Listing 4-2](#part0011.html#list2),
    we load our module (defined in [Listing 4-1](#part0011.html#list1)) with the module
    ID of data/cities. Module IDs can be considered the equivalent of folder paths.
    To help illustrate this, [Figure 4-2](#part0011.html#Fig2) shows a folder structure
    that represents the example from [Listing 4-2](#part0011.html#list2).


    ![9781484200148_Fig04-02.jpg](images/00026.jpeg)'
  trans: "```markdown\n\n# Grunt 与 JavaScript 模块化开发\n\n至此，我已经介绍了如何在一个项目上设置`Grunt`，并且你已经看到了它在处理\
    \ CSS 和 HTML 时的作用。接下来，我们将开始探索在 JavaScript 开发中使用`Grunt`的好处。正如最初介绍`Grunt`时提到的，它是基于`Node.js`平台（一个\
    \ JavaScript 引擎）编写的。这一事实使得`Grunt`成为处理 JavaScript 工作时的完美工具，因为开发者可以利用现有的`Node.js`模块快速处理插件以扩展他们的工作流程。在本章中，我将介绍`Grunt`如何帮助进行\
    \ JavaScript 模板化、处理 JavaScript 模块以及自动化测试。首先，我将概述我们计划如何扩展待办事项列表应用，并使用`Grunt`来自动化我们的工作流程和构建过程。\n\
    \n## 增强我们的待办事项列表应用\n\n目前，我们的待办事项列表应用仍然非常基础。我们已经有了一个完全使用`Grunt`构建的 HTML 和 CSS 大纲。在本章中，我们将继续在此基础上进行构建，使用`Grunt`添加一个由流行的\
    \ JavaScript 框架`BackBone.js`驱动的丰富用户界面。此外，我们将研究如何测试我们的应用、生成文档，以及通过 lint 和压缩 JavaScript\
    \ 来为生产环境构建我们的应用。\n\n首先，让我们使用`Bower`安装`Backbone.js`。图 4-1 演示了通过`Bower`安装`Backbone`的过程。\n\
    \n![9781484200148_Fig04-01.jpg](img/00025.jpeg)\n\n图 4-1 安装`Backbone.js`也会导致安装`underscore.js`，因为`Backbone`依赖于这个库。\n\
    \n接下来，我们需要更新我们的应用。运行`Grunt`将更新项目根目录下的`index.html`文件，以包含对`Backbone.js`和`underscore.js`的引用。\n\
    \n`Backbone.js`提供了一种 MV* 架构，允许开发者将应用逻辑划分为逻辑部分。它松散地遵循了许多现代 Web 应用框架（如 Ruby on Rails）所遵循的相同模式。这将使我们能够以模块化的方式开发待办事项应用：一个模块负责存储数据，另一个负责展示数据，再另一个负责控制应用流程。这很好地引出了`Grunt.js`如何帮助我们使用模块开发\
    \ JavaScript 应用并优化它们以便交付到生产环境的话题。\n\n## JavaScript 模块\n\n使用不同模块开发应用的好处是众所周知的。模块化软件通常能提高可维护性，因为每个模块被设计为执行单一任务，并且可以与系统的其他部分解耦。此外，模块有助于封装功能，对模块用户隐藏实现细节。这使得修改模块内部结构变得更容易，而不会影响系统的其他部分。\n\
    \n大多数现代编程语言原生支持分发和导入模块，但遗憾的是，当前版本的 JavaScript 并不支持。然而，ECMAScript 6（也称为`Harmony`或`ES6`），即下一版本的\
    \ JavaScript，将支持将模块导入到我们的 JavaScript 应用中。虽然本文编写时浏览器还不支持 ES6 模块加载，但我们仍然可以使用框架和工具来开始在\
    \ JavaScript 应用中使用模块。\n\n除了 ES6 定义的模块格式外，目前还有两种其他流行的格式：AMD 和 CommonJS。在了解`Grunt.js`如何帮助我们利用\
    \ JavaScript 应用中模块的强大功能之前，让我们先简要了解一下每种格式。\n\n### AMD\n\nAMD 代表 *Asynchronous Module\
    \ Definition*（异步模块定义），旨在让 JavaScript 开发者现在就能在浏览器中使用模块。AMD 源于 Dojo 框架在使用 XHR +\
    \ eval 过程中的实际经验，并试图避免这些方法的弱点。AMD 格式规定了如何定义模块以及要异步加载的依赖关系。\n\n与传统的网页 JavaScript\
    \ 方法相比，AMD 提供了许多优势。不再需要多个`script`标签和拥挤的全局命名空间，而是使用一个单一的 JavaScript 应用文件，所有其他模块都异步加载。每个模块封装了自己的功能，并且必须显式地返回一个接口供其他模块使用。\n\
    \n定义和使用 AMD 模块时有两个基本概念。第一个是`define`函数。`define`函数提供了一种命名模块、声明依赖关系和模块实现的方法。清单 4-1\
    \ 展示了一个非常基础的 AMD 模块，它返回两个属性：`keys`和`cities`。清单 4-1 演示了 AMD 模块的一些基本方面。`define`函数用于定义我们的模块，它接受三个参数：模块名称、模块依赖关系以及包含模块实现的回调函数。在这个例子中，我们将模块命名为`simpleModule`，并定义了对`underscore`框架的单一依赖。最后一个参数是模块的实现。需要注意的是，`underscore`作为参数传递给了我们的回调函数，以便在模块中使用它。通过允许依赖项被传递到模块的作用域内，就不需要将模块分配给全局命名空间。这减少了模块之间副作用的风险，因为每个模块只访问其作用域内的变量。\n\
    \n***清单 4-1*** 一个基础的 AMD 模块\n\n```\ndefine(\n  'simpleModule',\n  ['/underscore'],\n\
    \  function(_) {\n\nvar places = {\n      'nyc': 'New York',\n      'lon': 'London'\n\
    \    };\n\nreturn {\n        keys: _.keys(places),\n        cities: _.values(places).sort()\n\
    \    };\n});\n```\n\n在清单 4-1 中，返回了一个包含两个值`keys`和`cities`的对象。然而，AMD 并没有规定模块必须返回的类型。例如，模块可以返回一个单一的值，或者一个可以稍后执行的函数。在结束对定义\
    \ AMD 模块的介绍之前，重要的是要注意最佳实践是不命名模块，并且每个 AMD 模块都应该定义在自己的文件中。通过应用这两个原则，模块的可移植性会提高，其他开发者可以将模块移动到不同的路径，从而为模块赋予不同的名称/ID。\n\
    \n现在我们有了一个定义的模块，我们需要一种方法将它包含在我们的应用中，以便可以使用它。AMD 模块的另一个基本概念是`require`函数。`require`函数用于加载模块。清单\
    \ 4-2 演示了一个加载并使用清单 4-1 中定义的模块的小型 JavaScript 应用。\n\n***清单 4-2*** 使用`require`加载和使用其他模块\n\
    \n```\ndefine(['jquery'], function($) {\n  require(['data/cities'], function(data)\
    \ {\n    $('#cities').text(data.cities.join(', '));\n  });\n});\n```\n\n在清单 4-2\
    \ 中，我们首次看到`require`函数的使用。在这个特定的例子中，我们是在一个新模块的作用域内使用`require`。该模块依赖于`jQuery`，然后使用`require`函数加载我们在清单\
    \ 4-1 中定义的模块。到目前为止，我们还没有探讨模块 ID 的话题。在清单 4-2 中，我们使用模块 ID `data/cities`加载了（在清单 4-1\
    \ 中定义的）模块。模块 ID 可以被视为相当于文件夹路径。为了帮助说明这一点，图 4-2 展示了一个文件夹结构，代表了清单 4-2 中的例子。\n\n![9781484200148_Fig04-02.jpg](img/00026.jpeg)\n\
    \n```"
- fmt: "[Figure 4-2](#part0011.html#_Fig2). Examples from [Listings 4-1](#part0011.html#list1)\
    \ and [4-2](#part0011.html#list2) demonstrate module ID\n\nIn the example from\
    \ [Listing 4-2](#part0011.html#list2), we use the module ID of `data/cities`,\
    \ which matches the folder structure highlighted in [Figure 4-2](#part0011.html#Fig2).\
    \ The `data` part of the module ID represents the folder, while the `cities` part\
    \ represents the file `cities.js`.\n\nThus far, I’ve discussed the core concepts\
    \ regarding AMD modules, but I have yet to discuss module loading in practice.\
    \ There are two popular JavaScript frameworks that implement AMD module loading:\
    \ `require.js` and `curl.js`. For the remainder of the book, we’ll be using `require.js`\
    \ to load AMD modules. Bower can be used to add `require.js` to the project, as\
    \ demonstrated in [Figure 4-3](#part0011.html#Fig3).\n\n![9781484200148_Fig04-03.jpg](images/00027.jpeg)\n\
    \n[Figure 4-3](#part0011.html#_Fig3). Using Bower to add require.js to a project\n\
    \nAfter running `grunt` on the project, `require.js` should now be loaded into\
    \ our sample application. Before looking at how we can fully integrate `require.js`\
    \ into our project, let’s explore an alternative JavaScript modular format, CommonJS.\n\
    \n## CommonJS\n\nCommonJS is an alternative JavaScript modular format and aims\
    \ to standardize both modules and packages by specifying a simple API for declaring\
    \ service-side modules. The CommonJS specification is not concerned with broader\
    \ issues of IO and file systems. CommonJS was already discussed in [Chapter 2](#part0009.html),\
    \ when Node.js modules were first introduced. The structure of CommonJS modules\
    \ is simpler than AMD modules, as there is no wrapper function. Instead, functionality\
    \ is made available to dependent code via an `exports` variable. To use a module,\
    \ there is a `require()` function available; however, as modules are not loaded\
    \ asynchronously, they are returned immediately. [Listing 4-3](#part0011.html#list3)\
    \ demonstrates the CommonJS implementation of the module from [Listing 4-1](#part0011.html#list1).\n\
    \n[***Listing 4-3***](#part0011.html#_list3). CommonJS Implementation of Simple\
    \ Places Module\n\n```\nvar _ = require('underscore');\n\nvar places = {\n  \"\
    nyc\": \"New York\",\n  \"lon\": \"London\"\n};\n\nexports.data = {\n  keys: _.keys(places),\n\
    \  cities: _.values(places).sort()\n};\n```\n\nThe module in [Listing 4-3](#part0011.html#list3)\
    \ offers the same functionality as the one defined in [Listing 4-1](#part0011.html#list1).\
    \ The key difference in this implementation is how we define dependencies and\
    \ expose the module functionality. Dependencies are loaded with the use of the\
    \ `require()` function, and functionality is exposed using the `exports` variable\
    \ that is injected into our module when it is included in an application. [Listing\
    \ 4-4](#part0011.html#list4) demonstrates the use of our very simple CommonJS\
    \ module.\n\n[***Listing 4-4***](#part0011.html#_list4). Demonstrating the Use\
    \ of CommonJS Modules\n\n```\n'use strict';\n\nvar data = require('./data/cities').data;\n\
    console.log(data.cities.join(', '));\n```\n\nAs mentioned previously, CommonJS\
    \ is intended for use on the server side and not within the browser. Therefore,\
    \ [Listing 4-4](#part0011.html#list4) simply outputs the cities to the console,\
    \ instead of inserting them into the page. However, the actual functionality offered\
    \ by both modules is identical. Before we start to explore using AMD modules in\
    \ our Grunt.js workflow, it is important to note that there is a new universal\
    \ module loader—known as Browserify—available. Browserify allows you to develop\
    \ CommonJS modules and then bundle them into a single JavaScript file to load\
    \ into the browser. This offers the additional benefits of being able to use the\
    \ same JavaScript on the server and the client side without modification. Browserify\
    \ has also conceived transformers that allow CommonJS and AMD modules to be loaded\
    \ into the same application. Although it would be good practice to develop your\
    \ application with a mixture of module formats, this can come in handy if your\
    \ favorite front-end JavaScript framework is only published as an AMD module.\n\
    \n## Combining Grunt.js and JavaScript Modules\n\nLet’s now modify our application\
    \ to use `require.js` to load JavaScript modules while we are developing our application.\
    \ This allows us to develop our application in a modular functionality, encouraging\
    \ us not to mix responsibilities between modules and essentially leading to a\
    \ more decoupled set of modules. As illustrated in [Listing 4-5](#part0011.html#list5),\
    \ we have jQuery, Bootstrap, Underscore.js, Backbone.js, and `require.js` included\
    \ in our application.\n\n[***Listing 4-5***](#part0011.html#_list5). JavaScript\
    \ Includes Currently in Our Application\n\n```\n<!-- build:js js/app.js -->\n\
    <!-- bower:js -->\n<script src=\"bower_components/jquery/dist/jquery.js\"></script>\n\
    <script src=\"bower_components/bootstrap/dist/js/bootstrap.js\"></script>\n<script\
    \ src=\"bower_components/underscore/underscore.js\"></script>\n<script src=\"\
    bower_components/backbone/backbone.js\"></script>\n<script src=\"bower_components/requirejs/require.js\"\
    ></script>\n<!-- endbower -->\n<script src=\"js/main.js\"></script>\n<!-- endbuild\
    \ -->\n```\n\nAlthough this works effectively in development, when we later look\
    \ to compile our JavaScript into a single file for release, we may encounter some\
    \ issues, as the goal libraries may clash with the ones used by `require.js`.\
    \ To resolve this issue, the JavaScript include can be modified to use a new Grunt\
    \ plug-in called `grunt-bower-requirejs`. The `grunt-bower-requirejs` plug-in\
    \ is similar to `grunt-bower-install` and will read your Bower components and\
    \ merge them with your `require.js` path configuration. [Listing 4-6](#part0011.html#list6)\
    \ demonstrates a modified `index.html` file containing the configuration required\
    \ to use the `grunt-bower-install` plug-in.\n\n[***Listing 4-6***](#part0011.html#_list6).\
    \ index.html Modified to Support require.js\n\n```\n<!-- build:js js/main.js -->\n\
    \  <script src=\"bower_components/requirejs/require.js\"></script>\n  <script\
    \ src=\"js/paths.js\"></script>\n  <script src=\"js/main.js\"></script>\n<!--\
    \ endbuild -->\n```\n\nIn [Listing 4-6](#part0011.html#list6), `index.html` has\
    \ been modified to remove the `grunt-bower-install` configuration. In its place,\
    \ three script tags have been introduced. The first includes the `require.js`\
    \ library itself; the second is a JavaScript file containing `require.js` path\
    \ configuration; and the final script tag loads our application. The `path.js`\
    \ file is used by the `grunt-bower-requirejs` plug-in to merge our Bower components.\
    \ [Listing 4-7](#part0011.html#list7) demonstrates the `path.js` file before `grunt-bower-requirejs`\
    \ is run. To begin, the file simply needs a call to the `requirejs.config()` method\
    \ with an empty configuration object.\n\n[***Listing 4-7***](#part0011.html#_list7).\
    \ path.js File Before grunt-bower-requirejs\n\n```\nrequirejs.config({});\n```"
