    ```\n\nwill return all plug-ins written by me (see [Figure 2-3](#part0009.html#Fig3)).\n\
    \n![9781484200148_Fig02-03.jpg](images/00009.jpeg)\n\n[Figure 2-3](#part0009.html#_Fig3).\
    \ Searching for node packages by author\n\nThe quickest way to find a Grunt plug-in\
    \ is to search for the tag `gruntplugin`. This is the suggested tag that plug-in\
