- fmt: 'Grunt can automate testing at all levels, from unit to system testing. In
    the next few sections, we’ll explore setting up Grunt tasks to run unit tests,
    run tests in different browsers, validate the accessibility of our application,
    and, finally, conduct performance testing as well.


    ## Writing Our First Test


    Let’s begin our journey into using Grunt to automate a variety of tests against
    our application by starting simply and writing tests for the smallest possible
    unit of our application. There are a variety of test frameworks available. For
    this particular example, we’ll be using `nodeunit`. `Nodeunit` is a simple but
    robust test framework that allows tests to run asynchronously and support multiple
    reporting formats. There is a Grunt plug-in available that wraps the `nodeunit`
    package called `grunt-contrib-nodeunit`. [Listing 6-9](#part0013.html#list9) illustrates
    adding the plug-in to the project.


    [***Listing 6-9***](#part0013.html#_list9). Installing `grunt-contrib-nodeunit`


    ```

    npm install --save-dev grunt-contrib-nodeunit

    ```


    Next, the task configuration has to be added to our `Gruntfile.js` file (see [Listing
    6-10](#part0013.html#list10)).


    [***Listing 6-10***](#part0013.html#_list10). Configuration for `grunt-contrib-nodeunit`


    ```

    nodeunit: {

        all: [''test/*_test.js''],

        options: {

          reporter: ''junit'',

          reporterOptions: {

            output: ''out''

          }

        }

      }

    ```


    The configuration in [Listing 6-10](#part0013.html#list10) defines a target that
    will look for files within the `test` folder that end in `test.js`. For example,
    `item_test.js`, `list_test.js`, and `user_test.js` would all match the pattern
    if the files existed in the `test` folder. Additional configuration options have
    been set to configure the output of the test runner. The test runner in this instance
    has been configured to output the results, using the JUnit formatter, and the
    output should be stored in the directory `out`.


    If the task is now run, we will get an output similar to the one shown in [Figure
    6-6](#part0013.html#Fig6), as we do not currently have a `test` folder or any
    tests written. Next, we will create a simple JavaScript module that represents
    an item in our to-do list. [Listing 6-11](#part0013.html#list11) contains the
    definition of the to-do item module that extends the `Backbone.Model` module.


    ![9781484200148_Fig06-06.jpg](images/00044.jpeg)


    [Figure 6-6](#part0013.html#_Fig6). Running `grunt-contrib-nodeunit` with no tests
    defined


    [***Listing 6-11***](#part0013.html#_list11). A Simple JavaScript Module That
    Represents a To-Do Item


    ```

    /**

      *

      * @name Todo

      * @classdesc Todo Model

      * @author James Cryer

      * @exports Backbone.Model

      */

    ''use strict'';


    var Backbone = require(''backbone'');


    module.exports = Backbone.Model.extend({

      defaults: {

        ''title'': '''',

        ''date'': ''19/02/2015'',

        ''complete'': false

      },


    complete: function () {

        this.set(''complete'', true);

      }

    });

    ```


    The `Todo` module defines a set of defaults: `title`, `date`, and `complete` status.
    There is also a single function defined to mark an instance of the `Todo` module
    as being complete. The `Backbone.Model` module provides the ability to easily
    define default values for attributes for each instance of our `Todo` module.


    The `complete` function uses the `set()` function provided by the `Backbone.Model`
    to modify attributes of our instances of the `Todo` module. [Listing 6-12](#part0013.html#list12)
    provides an example of how this simple module could be used within an application.
    The trivial example creates a new instance of the `Todo` module, passing in the
    `title` and `date` it has to be completed by. After the to-do item is created,
    we set it as being complete. At the moment, we do not have a method of validating
    that our new `Todo` module is behaving as expected, unless we run it in the browser.
    Let’s use `nodeunit` combined with `grunt-contrib-nodeunit` to write a test that
    can be run each time we make a change to our module.


    [***Listing 6-12***](#part0013.html#_list12). Example of Using the `Todo` Module


    ```

    define([

      ''js/model/todo''

    ], function (Todo) {

      var todo = new Todo({

        ''title'': ''buy groceries'',

        ''date'': ''20/02/2015''

      });

      todo.complete();

    });

    ```


    To create our first test, we must first create a new folder in the root of our
    application. It can often prove useful to create a mirror structure in your test
    folder that matches the application code. To keep our test folder structure in
    synchronization with our application folder, it is best to create a `models` folder
    within the newly created `test` folder. Inside the `models` folder, we’ll create
    our first set of tests for our `Todo` module. The file should be named `todo_test.js`,
    so that it matches the pattern defined in our Grunt configuration. [Listing 6-13](#part0013.html#list13)
    contains the contents of the test module.


    [***Listing 6-13***](#part0013.html#_list13). Our First Test: Confirming That
    the `Todo` Module Is Functioning As Expected


    ```

    ''use strict'';


    exports.todo = {

          setUp: function (done) {

            var Todo = require(''../../app/js/models/todo'');


    this.todo = new Todo({

              ''title'': ''Test Item'',

              ''date'': ''24/02/2014''

            });

            done();

          },

          item_has_a_title: function (test) {

            test.equal(this.todo.get(''title''), ''Test Item'');

            test.done();

          },

          item_is_not_complete: function (test) {

            test.equal(this.todo.get(''complete''), false);

            test.done();

          },

          item_can_be_completed: function (test) {

            this.todo.complete();

            test.ok(this.todo.get(''complete''));

            test.done();

          }

        };

    ```


    The test module shown in [Listing 6-13](#part0013.html#list13) contains a total
    of three tests: to ensure that an item has a title, that an item defaults to being
    incomplete, and a final test to ensure that an item can be marked as completed.
    If you now run the `nodeunit` task, as shown in [Figure 6-7](#part0013.html#Fig7),
    you will see that there is a total three assertions made. Assertions should not
    be confused with tests; each test can have a number of assertions. It is often
    considered best practice to make only one assertion per test; however, this is
    not a golden rule but more a principle to encourage writing tests that only test
    a small unit of the system. For example, in our test module, we have split the
    test for ensuring that the `complete` attribute is set to `true` after the `complete`
    function is called. We could have combined this with the previous test of checking
    the value of the `complete` attribute to `false`. However, by combining these
    tests, if either the default changed or the `complete` function broke, it would
    be harder to discover the cause of the issue.


    ![9781484200148_Fig06-07.jpg](images/00045.jpeg)


    [Figure 6-7](#part0013.html#_Fig7). Running the `nodeunit` tests using grunt


    ## Modifying the Output from Nodeunit


    The output from `grunt-contrib-nodeunit` is minimal, showing that, overall, the
    tests passed, the number of assertions run, and the time taken to complete the
    tests. As we currently have the JUnit reporter selected, the plug-in also outputs
    the location of the files containing the test results. [Listing 6-14](#part0013.html#list14)
    contains the output generated from running `grunt-contrib-nodeunit` on the project.


    [***Listing 6-14***](#part0013.html#_list14). Sample JUnit Reporter Output from
    `grunt-contrib-nodeunit`


    ```

    <?xml version="1.0" encoding="UTF-8" ?>

    <testsuite name="todo_test.js"

               errors="0"

               failures="0"

               tests="3">

      <testcase name="todo - item_has_a_title"></testcase>

      <testcase name="todo - item_is_not_complete"></testcase>

      <testcase name="todo - item_can_be_completed"></testcase>

    </testsuite>

    ```


    The output generated from running the plug-in can be used within a continuous
    integration environment. We will explore setting up such an environment later
    in this chapter.


    ## Test-Driven Development with Grunt'
