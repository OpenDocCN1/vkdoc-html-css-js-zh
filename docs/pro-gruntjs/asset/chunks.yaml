  raw: 'The additional line adds a call to the loadNpmTasks function. This function
    is responsible for loading tasks from a specific plug-in and expects the plug-in’s
    name to be passed to it.


    Before we can try to run our Gruntfile, we have one final statement to add to
    Gruntfile. Add the following line ([Listing 2-12](#part0009.html#list12)) directly
    after the call to loadNpmTasks.


    [***Listing 2-12***](#part0009.html#_list12). Defining a Default Task to Be Run
    When Grunt Is Run Without a Task Name


    ```

    // Default task(s).

    grunt.registerTask(''default'', [''concat'']);

    ```


    This final line defines a default task that will be run each time someone runs
    the grunt command from within our project without passing any other values. If
    the plug-in is missing from our node_modules folder, Grunt will fail to run, as
    shown in [Figure 2-11](#part0009.html#Fig11).


    ![9781484200148_Fig02-11.jpg](images/00017.jpeg)


    [Figure 2-11](#part0009.html#_Fig11). Grunt fails to run


    At this point, we have our first complete Gruntfile. Save the file and return
    to your command line. While inside the root folder, running grunt will return
    an error, as we’ve not installed the grunt-contrib-concat plug-in yet. To add
    this plug-in to our project, run the following:


    ```

    npm install grunt-contrib-concat --save-dev

    ```


    Note that our plug-in is a Node.js package, and we’re also storing a dependency
    inside our package.json (by passing --save-dev to the install command). Rerunning
    the grunt command will now yield a success message. However, our output file,
    built.js, in the dist folder is currently empty, as our source files do not exist.


    Add a new folder called src to the project. Inside this file, create fileA.js
    and fileB.js. Inside each of the files, put two different pieces of content. (I’d
    suggest “A” and “B,” respectively). Rerunning the grunt task, the built.js file
    should now contain the contents of fileA.js and fileB.js combined and separated
    by a ; (see [Figure 2-12](#part0009.html#Fig12)).


    ![9781484200148_Fig02-12.jpg](images/00018.jpeg)


    [Figure 2-12](#part0009.html#_Fig12). Output from concentation


    So we’ve successfully installed, set up, and run Grunt on the project. Before
    exploring the various ways Grunt can optimize our workflow, it is important to
    cover the key concepts behind Grunt. Let’s start with configuring our tasks.


    Configuring Tasks


    As explained previously, the configuration for tasks is contained within a Gruntfile
    for a project. Inside this Gruntfile, configuration is passed to Grunt via the
    grunt.initConfig method. The majority of the configuration passed to grunt.initConfig
    will be under a task named properties, but it may also contain arbitrary data.
    If the properties in the configuration clash with task names, they will be ignored.


    As the Gruntfile is JavaScript, or CoffeeScript, if you choose, the configuration
    is not limited strictly to JSON. This makes the task configuration extremely powerful,
    as it can be programmatically generated. To illustrate this principle, let’s revisit
    our first Gruntfile and specify our files location as part of the configuration
    (see [Listing 2-13](#part0009.html#list13)).


    [***Listing 2-13***](#part0009.html#_list13). Using Variables in Our Gruntfile


    ```

    module.exports = function(grunt) {


    var app_files = [''src/fileA.js'', ''src/fileB.js''],

             output = ''dist/built.js'';


    // Project configuration.

      grunt.initConfig({

        pkg: grunt.file.readJSON(''package.json''),


    concat: {

          options: {

            separator: '';'',

          },

          dist: {

            src: app_files,

            dest: output

          }

        }

      });


    // Load the plugin that provides the "concat" task.

      grunt.loadNpmTasks(''grunt-contrib-concat'');

    };

    ```


    In the preceding Gruntfile, we’ve shifted the definition of our source files and
    output file into arbitrary properties called app_files and output, respectively.
    Subsequently, we’ve updated our task configuration to use these properties.


    When grunt is run, it scans the configuration object for a property matching the
    task’s name. This configuration is applied against the default configuration provided
    by the task. Tasks also provide the ability to specify multiple configurations;
    each set of configurations is known as a target. Each target has an arbitrary
    name. The following Gruntfile ([Listing 2-14](#part0009.html#list14)) expands
    on our previous version to add an additional target called test.


    [***Listing 2-14***](#part0009.html#_list14). Multiple Targets Allow Us to Configure
    a Task from the Same Gruntfile in Multiple Ways


    ```

    module.exports = function(grunt) {


    var app_files = [''src/fileA.js'', ''src/fileB.js''],

             output = ''dist/built.js'',

        test_output = ''test/built.js'';


    // Project configuration.

      grunt.initConfig({

        pkg: grunt.file.readJSON(''package.json''),


    concat: {

          options: {

            separator: '';'',

          },

          dist: {

            src: app_files,

            dest: output

          },

          test: {

            src: app_files,

            dest: test_output

          }

        }

      });


    // Load the plugin that provides the "concat" task.

      grunt.loadNpmTasks(''grunt-contrib-concat'');

    };

    ```


    With the additional target, we output our concatentated file to a new location,
    the test folder. Grunt provides the ability to run a specific target or all targets.
    To run a specific target, the following command can be used:


    ```

    grunt concat:test

    ```


    The preceding command will run the task named concat and the target with the name
    test only. To run all targets, for a given task, the target can be omitted, as
    demonstrated in the following code. Running the command will run both the dist
    and test target sequentially.


    ```

    grunt concat

    ```


    This will iterate through each target and execute them in turn. The output of
    the preceding command can be seen in [Figure 2-13](#part0009.html#Fig13).


    ![9781484200148_Fig02-13.jpg](images/00019.jpeg)


    [Figure 2-13](#part0009.html#_Fig13). Output when running multiple targets


    Within a task configuration, an options parameter can be specified to override
    the defaults set by a task. These options can be overridden by target-level options.
    Target-level options are defined by an options property within a target. In the
    following example ([Listing 2-15](#part0009.html#list15)), our Gruntfile has been
    modified to change the separator for the test target.


    [***Listing 2-15***](#part0009.html#_list15). An Example of Using Options


    ```

    module.exports = function(grunt) {


    var app_files = [''src/fileA.js'', ''src/fileB.js''],

             output = ''dist/built.js'',

        test_output = ''test/built.js'';


    // Project configuration.

      grunt.initConfig({

        pkg: grunt.file.readJSON(''package.json''),


    concat: {

          options: {

            separator: '';'',

          },

          dist: {

            src: app_files,

            dest: output

          },

          test: {

            options: {

              separator: '' '',

            },

            src: app_files,

            dest: test_output

          }

        }

      });


    // Load the plugin that provides the "concat" task.

      grunt.loadNpmTasks(''grunt-contrib-concat'');

    };

    ```


    The preceding configuration will override the default separator set by the concat
    task with the value of ; for all targets. In addition, the test target overrides
    this and specifies a separator of a single whitespace.


    The final section of this chapter covers the various options Grunt provides for
    selecting the files to input and output from each task.


    Working with Files


    Grunt provides a rich and powerful API for selecting the files that a task will
    operate on. There are a variety of methods for declaring the source and destination
    file mappings for each task, each varying in terms of complexity and flexibility.


