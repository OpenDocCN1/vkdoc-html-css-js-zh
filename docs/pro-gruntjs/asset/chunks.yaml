- fmt: "[***Listing 6-32***](#part0013.html#_list32). Jasmine Tests for the To-Do\
    \ Item\n\n```\ndefine([\n  'app/js/models/todo'\n], function(Todo) {\n\ndescribe('A\
    \ todo item', function() {\n    'use strict';\n\nvar todo;\n\nbeforeEach(function()\
    \ {\n      todo = new Todo({\n        'title': 'Test Item',\n        'date': '24/02/2014'\n\
    \      });\n    });\n\nit('should have a title', function() {\n      expect(todo.get('title')).toBe('Test\
    \ Item');\n    });\n\nit('should not be complete', function() {\n      expect(todo.get('complete')).toBe(false);\n\
    \    });\n\nit('should be marked as completed', function() {\n      todo.complete();\n\
    \      expect(todo.get('complete')).toBe(true);\n    });\n\n});\n});\n```\n\n\
    ![9781484200148_Fig06-14.jpg](images/00052.jpeg)\n\n[Figure 6-14](#part0013.html#_Fig14).\
    \ Output from `grunt-karma` in the console\n\n![9781484200148_Fig06-15.jpg](images/00053.jpeg)\n\
    \n[Figure 6-15](#part0013.html#_Fig15). Console output in Karma debug view, containing\
    \ the name of each test and its pass status\n\nIn our example, we’ve only begun\
    \ to explore the power that Karma can have in terms of testing your application.\
    \ In a real-world application, Karma is capable of running hundreds of tests within\
    \ each browser in under a second. You may also choose to run all your tests in\
    \ all the major browsers employed by your users.\n\nIn the next chapter, we’ll\
    \ revisit `grunt-karma` when we set up a continuous integration environment for\
    \ our project. We’ll explore running our tests in multiple browsers in a virtualized\
    \ environment.\n\n## Automating Accessibility Testing\n\nAnother key component\
    \ of any test strategy for web applications should be accessibility testing. Accessibility\
    \ testing should be conducted to ensure that everybody accessing your application\
    \ or site has a positive experience and is not restricted from accessing your\
    \ application features or site content. The mistake is often made that accessibility\
    \ testing is only concerned with verifying that a site is accessible to those\
    \ with little or no sight. Accessibility goes far beyond this, and there are far\
    \ more checks that have to be carried out to ensure that a site or an application\
    \ is accessible. In this section, we’ll explore how to use tooling to automate\
    \ early detection of accessibility issues within a web application. To conduct\
    \ the tests, we’ll be using Chrome Accessibility Tools to validate our application\
    \ or page. Fortunately, there is a `grunt` plug-in already written that wraps\
    \ the `npm` `a11y` package.\n\nTo get started, we need to add the `grunt-a11y`\
    \ plug-in to our project. [Listing 6-33](#part0013.html#list33) shows the installation\
    \ process.\n\n[***Listing 6-33***](#part0013.html#_list33). Installing `grunt-a11y`\n\
    \n```\nnpm install --save-dev grunt-a11y\n```\n\nNow that we have `a11y` available\
    \ to our `grunt` workflow, we must configure the plug-in, as shown in [Listing\
    \ 6-34](#part0013.html#list34).\n\n[***Listing 6-34***](#part0013.html#_list34).\
    \ Configuring `grunt-ally` to Run Accessibility Tests for Our Applications\n\n\
    ```\na11y: {\n  live: {\n    options: {\n      urls: ['www.twitter.com']\n   \
    \ }\n  }\n}\n```\n\nAs shown in [Listing 6-34](#part0013.html#list34), the plug-in\
    \ can be simply configured with a series of URLs. In our example, we’ve hard-coded\
    \ the URL into our `Gruntfile`, but in a larger application build process, this\
    \ should be pushed into a configuration file and loaded at build time. This means\
    \ the URLs are more maintainable and can be shared across tasks. We’ll explore\
    \ this further in the next chapter.\n\nIn addition to the `urls` option, the `grunt-a11y`\
    \ plug-in accepts another option that allows the plug-in to throw an error, should\
    \ it encounter any issues with accessibility in the URLs you are testing. This\
    \ option becomes important if you want to run these tests as part of a continuous\
    \ integration environment and want to fail your builds if the accessibility tests\
    \ fail. [Figure 6-16](#part0013.html#Fig16) shows a sample output from the plug-in.\n\
    \n![9781484200148_Fig06-16.jpg](images/00054.jpeg)\n\n[Figure 6-16](#part0013.html#_Fig16).\
    \ Sample output from running `grunt-a11y`\n\nThe `grunt-a11y` plug-in reports\
    \ issues with missing labels, ARIA properties, missing metadata, or low element\
    \ contrast. This doesn’t replace actual accessibility testing with another suite\
    \ of tools. However, this plug-in can be used as an aid to help ensure that a\
    \ baseline of accessibility is maintained within your application.\n\n## Exposing\
    \ the Local Server to the Outside World\n\nWhile developing your application locally,\
    \ it is always convenient to be able to share and show your work-in-progress to\
    \ others. Also, third-party tools sometimes need the ability to view your application\
    \ on the open Web, to be able to work effectively. This is true of tools such\
    \ as Google PageSpeed Insights or WebPagetest, which can be used to analyze the\
    \ network performance of your application. Fortunately, there is a tool called\
    \ `ngrok` that allows you to securely expose a local development onto the Web\
    \ with a public URL. In this section, we’ll explore configuring our `Grunt` workflow\
    \ to allow us to easily expose our application.\n\n`ngrok` is available as a binary\
    \ download from [https://ngrok.com](https://ngrok.com) and is also available as\
    \ a Node module, which means we can easily integrate it into our `Grunt` workflow.\
    \ To get started, let’s include `ngrok` in our project, by installing the package\
    \ using `npm`, as shown in [Listing 6-35](#part0013.html#list35).\n\n[***Listing\
    \ 6-35***](#part0013.html#_list35). Installing `ngrok`\n\n```\nnpm install ngrok\
    \ --save-dev\n```\n\nTo use `ngrok` within our `Grunt` workflow, we will register\
    \ a task within our `Gruntfile`. Our new task, `ngrok`, is asynchronous, as it\
    \ will send a request to the `ngrok` API to request a public URL for our application.\
    \ We have configured our application to run on port `8000` locally during development,\
    \ hence we pass the port number `8000` to the call to `ngrok`. The `ngrok` library\
    \ returns either an error and/or a public URL. Once the URL has been returned,\
    \ we can modify our configuration of other `Grunt` tasks to run against our public\
    \ URL. For example, we can modify the URLs in our `grunt-a11y` task to run against\
    \ a local development environment instead of a production environment. [Listing\
    \ 6-36](#part0013.html#list36) shows the complete custom task.\n\n[***Listing\
    \ 6-36***](#part0013.html#_list36). Custom Grunt Task for Running `ngrok`\n\n\
    ```\nvar ngrok = require ('ngrok');\n\nmodule.exports = function (grunt) {\n\n\
    grunt.registerTask('ngrok', 'Running ngrok', function () {\n    var done = this.async();\n\
    \    var port = 8000;\n\nngrok.connect(port, function (err, url) {\n      if (err\
    \ !== null) {\n        grunt.fail.fatal(err);\n        return done();\n      }\n\
    \      grunt.log.write(url);\n      done();\n    });\n  });\n\n// Register default\
    \ tasks\n  grunt.registerTask('default', ['ngrok']);\n};\n```\n\nIf you are working\
    \ within a corporate proxy, then it is likely you can combine `ngrok` with your\
    \ other `Grunt` plug-ins to run these while behind the proxy. In the next section,\
    \ we’ll expose our application, so that we are able to run performance tests against\
    \ our site.\n\n## Performance Testing\n\nIn this final section of this chapter,\
    \ we’ll explore the tools available to automate performance testing. We’ll be\
    \ focusing on network performance in particular, reviewing how optimized our applications\
    \ are for delivery over the network. There are a number of great tools available\
    \ for performing these sorts of tests. We’ll be focusing on two plug-ins: `grunt-pagespeed`\
    \ and `grunt-perfbudget`."
