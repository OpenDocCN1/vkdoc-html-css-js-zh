    # Grunt 入门指南


    ## 引言


    那么，你拿起了这本标题略显独特的书，可能想知道什么是 `Grunt`，或者至少想知道过去两年间关于 Grunt 的种种热议究竟为何。简单来说，`Grunt`
    是一个 JavaScript 任务运行器。其主要目标是自动化重复性任务，将开发人员的时间解放出来，以便专注于他们每天面临的更棘手的问题。


    `Grunt` 基于 Node.js 以 JavaScript 编写，通过 `npm` 分发，由 Ben Alman（[`github.com/cowboy`](https://github.com/cowboy)）创建。自面世以来，`Grunt`
    就提供了一个应用程序编程接口（API），允许开发者扩展并添加自定义任务以适应他们自身的流程。这种高度的可定制性使得 `Grunt` 变得极其流行，并拥有一个不断扩展的庞大生态系统。


    作为一个任务运行器，`Grunt` 的核心概念之一是“任务”。每个任务都有一组可调的配置选项来满足你的特定需求。任务也可以有多个版本：例如，一套用于开发环境的配置，另一套用于生产环境。除此之外，`Grunt`
    还提供了定义自定义任务的能力。自定义任务可以将现有任务组合成一个任务，或添加全新的功能。此外，`Grunt` 拥有文档齐全的 API，使开发者能够在运行时改变其任务运行器的行为。


    贯穿全书，我们将使用 `Grunt` 来演示这个小巧但极其强大的工具如何优化你的开发工作流程。`Grunt` 常被描绘成前端工程师的专属工具；然而，我还会演示那些不完全是前端导向的项目如何也能从引入
    `Grunt` 中获益。


    ## 我如何从 Grunt 中获益？


    `Grunt` 的主要优势和首要目标之一是自动化。当你现有的工作流程对你来说行之有效时，你可能会质疑为什么需要自动化。我希望这本书能起到鼓励作用，并演示自动化如何能让你更高效。


    大多数开发者都熟悉执行代码检查、资源压缩、编译 CSS 等工作流程中所需的任务工具。然而，并非所有开发者都实现了流程自动化。一些团队选择使用持续集成作为构建应用程序和执行发布前检查的节点。这个环境通常由开发团队之外的人员控制，职责落在组织内部的其它部门。


    依赖持续集成环境来执行构建任务是很便捷的。作为开发者，你编写代码，推送到中央代码仓库，然后持续集成（CI）服务器处理其余事情。但是，如果你需要在本地重现生产环境中的某个问题，那么这可能不是最快的方式。借助
    `Grunt` 的强大功能，你可以在本地开发和 CI 环境中轻松使用相同的构建流程，从而缩短在本地构建应用程序生产版本所需的时间。


    独立工作或在小团队中工作的开发者，如果选择使用命令行或图形用户界面（GUI）工具，可以通过使用 `Grunt` 来统一他们的构建流程。统一构建流程将简化项目设置和维护，因为只需遵循一个流程即可。


    ## 持续集成


    如果你不熟悉 CI，这是一种常见的开发实践，即将来自一个团队开发者的代码合并到中央仓库。它通常用于运行单元测试、执行代码分析和自动化部署。大多数现代开源项目使用
    `TravisCI`（[`travis-ci.org/`](https://travis-ci.org/)），这是一个开源 CI 环境，可以轻松与 GitHub
    仓库集成。开发社区中其他流行的选择还有 `Hudson` 和 `Jenkins`，`Jenkins` 是 `Hudson` 的一个分支。`Jenkins`
    和 `Hudson` 都有许多用于集成第三方工具或系统的插件，例如，一个插件可以实现在 GitHub 仓库有更新时触发构建。


    ## 加速你的工作流程


    有一些出色的工具和集成开发环境（IDE），它们提供了常见任务的工具，例如编译 CSS 和检查 JavaScript 代码，帮助你开发应用程序和网站。然而，这类工具通常需要初始设置，并且也可能导致工作流程脱节。


    你可能想知道什么是“脱节的工作流程”。考虑以下场景：你正在开发一个非常简单的单页应用，它包含一组 JavaScript 文件、一个 CSS 预处理器和一些图片。在你发布应用程序之前，你必须进行
    JavaScript 代码检查、编译 CSS 以及压缩图片。针对这些问题中的每一个，你都可以从现有的众多工具中进行选择，例如 `JSHint`、`LESS`
    编译器 和 `pngquant`。你的 IDE 很可能会检查你的 JavaScript 代码并编译 LESS；但是，你还得切换到命令行去运行 `pngquant`。


    在开发过程中，在浏览器、编辑器和命令行界面之间来回切换会让你分心，无法专注于必须解决的关键问题。`Grunt` 可以为你提供一个统一这些任务的解决方案。此外，`Grunt`
    还能自动化这些任务，以便你可以专注于应用程序中特有的问题。


    ## 每个工匠都需要一个工具带


    不可否认，前端 Web 开发的技艺在过去几年发生了翻天覆地的变化。过去需要花费大量宝贵开发时间来解决浏览器兼容性问题的日子一去不复返了，因为开发者现在可以访问一套丰富的工具来处理此类琐事。利用这些工具，开发者可以将时间投入到解决应用程序中更复杂的问题上。解决日常任务的框架的出现，例如
    `Bootstrap` 和 `AngularJS`，使开发者能够通过他们的应用程序提供增强的体验。


    越来越多的用户通过移动设备访问应用程序，并期望 Web 应用程序能提供与原生移动应用程序相同的体验。来自移动设备的应用流量激增，也迫使开发者重新思考他们如何设计应用程序，从而增加了更多的复杂性。为了应对这种情况，开发者必须构建一套可反复使用的可靠工具。


    `Grunt` 应当成为你工具带中的主要工具之一。由于 `Grunt` 的模块化特性，很容易构建一份可在多个项目中使用的任务配方手册。每个任务专注于解决一个特定问题，并且很容易跨项目混合搭配配置，为每种场景构建一套强大的工具集。


    ## 与其他工具集成

