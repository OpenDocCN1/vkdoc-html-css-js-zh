    \ 使用`require`加载名为`js/app`的模块。加载后，使用 jQuery 的`isReady`缩写，然后期望`js/app`模块返回一个`init`函数。清单\
    \ 4-11 定义了模块`js/app`，我们的第一个 AMD 模块。\n\n**清单 4-11**. 用作应用程序代码起点的应用模块\n\n```\ndefine(function()\
    \ {\n\nvar initialize = function() {\n    console.log('app.init');\n  };\n\nreturn\
    \ {\n    init: initialize\n  };\n});\n```\n\n清单 4-11 定义了一个简单的 AMD 模块，目前不依赖于任何其他模块。它定义了一个名为`initialize`的私有方法，并通过`return`语句将其作为`init`函数暴露给模块的用户。如果您现在在您喜欢的浏览器中加载应用程序，您应该会在控制台中看到“app.init”打印出来，如图\
    \ 4-4 所示。\n\n![9781484200148_Fig04-04.jpg](img/00028.jpeg)\n\n**图 4-4**. 使用`require.js`加载应用模块的演示\n\
    \n既然我们已经确认应用程序正在加载 AMD 模块，让我们为待办事项应用程序添加一些骨架代码。清单 4-12 列出了组成完整待办事项应用程序的几个新模块。\n\
    \n**清单 4-12**. 构成完整应用程序的 AMD 模块\n\n```\n// js/app.js\n\ndefine([\n  'js/collections/todos',\n\
