    # Introduction


    Welcome to *Pro Grunt.js*. This book has been written for those who are interested
    in learning how Grunt.js can be use to modernize their developer workflow. Grunt
    can be used to automate mundane, repetitive tasks that feature in almost all mobile
    and web projects. Developing optimal web applications that are tuned for performance
    is essential to delivering a good user experience for all. We cannot make assumptions
    about the devices and the networks users are accessing our sites and applications
    from. Grunt can be used to ensure that every project we develop has a set of best
    practices baked in from the outset through the definition of a common set of tasks
    that will enable our project to be minified, linted and tested. Grunt''s extensibility
    and large number of plugins makes it the perfect tool for quickly developing a
    tool belt that is re-usable across projects.


    ## Chapter 1


    This chapter introduces Grunt, providing an overview of the benefits of using
    a task runner like Grunt before concluding with a comparison to other popular
    build tools.


    ## Chapter 2


    This chapter discusses the core concepts of Grunt. Installing Grunt on a project,
    tasks and file matchers are also covered.


    ## Chapter 3


    This chapter is dedicated to the introduction of Grunt tasks for working with
    HTML and CSS. Topics such as sass compilation, html minification and CSS linting
    are discussed.


    ## Chapter 4


    This chapter discusses a set of Grunt tasks that can be used whilst working with
    JavaScript. It covers linting, minifications and documentation generation.


    ## Chapter 5


    This chapter introduces a set of Grunt plugins for working with images, SVG and
    icons. Image compression, svg minification and automated sprite generation are
    covered.


    ## Chapter 6


    This chapter discusses setting up a local Node server to run a static website
    generated by Grunt locally. The topic of testing local web applications is also
    covered in this chapter using frameworks such as Karma.


    ## Chapter 7


    The final chapter looks at how a Grunt workflow itself can be optimized to make
    it more maintainable and reusable. Topics such as Grunt configuration files, optimize
    plugin loading, and measuring Grunt load times are discussed.


