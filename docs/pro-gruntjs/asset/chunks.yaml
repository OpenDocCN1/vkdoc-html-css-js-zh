    \        underscore: 'bower_components/underscore/underscore',\n        handlebars:\
    \ 'bower_components/handlebars/handlebars'\n      }\n    }\n  }\n},\n```\n\n新配置设置了一些选项。首先，`baseUrl`设置与应用程序路径匹配，因为我们的应用程序位于`app`文件夹内。这使得`require.js`优化器能够正确找到\
    \ AMD 模块。下一个配置选项`main`告诉优化器哪个主文件是应用程序的起点。这指向`.tmp`目录，因为我们想要将 AMD 模块与作为`usemin`插件一部分生成的合并\
    \ JavaScript 结合起来。因此，`requirejs`任务必须在`concat`任务完成后运行。`out`选项，如您所料，指定了任务的输出应放置的位置。最后，该任务提供了指定应用哪种优化的能力。在我们的配置中，我们选择了`UglifyJS2`。要禁用优化，可以传递`none`值。\n\
    \n将此配置添加到您的`Gruntfile.js`文件后，您还需要将此任务添加到默认任务中。清单 4-14 显示了更新后的默认任务。\n\n**清单 4-14**.\
