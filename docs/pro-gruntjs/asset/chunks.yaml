      keys: _.keys(places),

      cities: _.values(places).sort()

    };

    ```


    The module in [Listing 4-3](#part0011.html#list3) offers the same functionality
    as the one defined in [Listing 4-1](#part0011.html#list1). The key difference
    in this implementation is how we define dependencies and expose the module functionality.
    Dependencies are loaded with the use of the require function, and functionality
    is exposed using the exports variable that is injected into our module when it
    is included in an application. [Listing 4-4](#part0011.html#list4) demonstrates
    the use of our very simple CommonJS module.


    [***Listing 4-4***](#part0011.html#_list4). Demonstrating the Use of CommonJS
    Modules


    ```

    ''use strict'';


    var data = require(''./data/cities'').data;

    console.log(data.cities.join('', ''));

    ```


    As mentioned previously, CommonJS is intended for use on the server side and not
    within the browser. Therefore, [Listing 4-4](#part0011.html#list4) simply outputs
    the cities to the console, instead of inserting them into the page. However, the
    actual functionality offered by both modules is identical. Before we start to
    explore using AMD modules in our Grunt.js workflow, it is important to note that
    there is a new universal module loader—known as Browserify—available. Browserify
    allows you to develop CommonJS modules and then bundle them into a single JavaScript
    file to load into the browser. This offers the additional benefits of being able
    to use the same JavaScript on the server and the client side without modification.
    Browserify has also conceived transformers that allow CommonJS and AMD modules
    to be loaded into the same application. Although it would be good practice to
    develop your application with a mixture of module formats, this can come in handy
    if your favorite front-end JavaScript framework is only published as an AMD module.


    Combining Grunt.js and JavaScript Modules


    Let’s now modify our application to use require.js to load JavaScript modules
    while we are developing our application. This allows us to develop our application
    in a modular functionality, encouraging us not to mix responsibilities between
    modules and essentially leading to a more decoupled set of modules. As illustrated
    in [Listing 4-5](#part0011.html#list5), we have jQuery, Bootstrap, Underscore.js,
    Backbone.js, and require.js included in our application.


    [***Listing 4-5***](#part0011.html#_list5). JavaScript Includes Currently in Our
    Application


    ```

    <!-- build:js js/app.js -->

    <!-- bower:js -->

    <script src="bower_components/jquery/dist/jquery.js"></script>

    <script src="bower_components/bootstrap/dist/js/bootstrap.js"></script>

    <script src="bower_components/underscore/underscore.js"></script>

    <script src="bower_components/backbone/backbone.js"></script>

    <script src="bower_components/requirejs/require.js"></script>

    <!-- endbower -->

    <script src="js/main.js"></script>

    <!-- endbuild -->

    ```


    Although this works effectively in development, when we later look to compile
    our JavaScript into a single file for release, we may encounter some issues, as
    the goal libraries may clash with the ones used by require.js. To resolve this
    issue, the JavaScript include can be modified to use a new Grunt plug-in called
    grunt-bower-requirejs. The grunt-bower-requirejs plug-in is similar to grunt-bower-install
    and will read your bower components and merge them with your require.js path configuration.
    [Listing 4-6](#part0011.html#list6) demostrates a modified index.html file containing
    the configuration required to use the grunt-bower-install plug-in.


    [***Listing 4-6***](#part0011.html#_list6). index.html Modified to Support require.js


    ```

    <!-- build:js js/main.js -->

      <script src="bower_components/requirejs/require.js"></script>

      <script src="js/paths.js"></script>

      <script src="js/main.js"></script>

    <!-- endbuild -->

    ```


    In [Listing 4-6](#part0011.html#list6), index.html has been modified to remove
    the grunt-bower-install configuration. In its place, three script tags have been
    introduced. The first includes the require.js library itself; the second is a
    JavaScript file containing require.js path configuration; and the final script
    tag loads our application. The path.js file is used by the grunt-bower-requirejs
    plug-in to merge our bower components. [Listing 4-7](#part0011.html#list7) demonstrates
    the path.js file before grunt-bower-requirejs is run. To begin, the file simply
    needs a call to the require.js configuration method with an empty configuration
    object.


    [***Listing 4-7***](#part0011.html#_list7). path.js File Before grunt-bower-requirejs


    ```

    requirejs.config({});

    ```'
  trans: "\n图 4-2. 清单 4-1 和 4-2 中的示例演示了模块 ID\n\n在清单 4-2 的示例中，我们使用了模块 ID `data/cities`，这与图\
    \ 4-2 中突出显示的文件夹结构相匹配。模块 ID 中的`data`部分代表文件夹，而`cities`部分则代表文件`cities.js`。\n\n到目前为止，我已经讨论了关于\
    \ AMD 模块的核心概念，但还没有讨论实际的模块加载。有两个流行的 JavaScript 框架实现了 AMD 模块加载：`require.js`和`curl.js`。在本书的剩余部分，我们将使用`require.js`来加载\
    \ AMD 模块。可以使用 Bower 将`require.js`添加到项目中，如图 4-3 所示。\n\n![9781484200148_Fig04-03.jpg](img/00027.jpeg)\n\
    \n图 4-3. 使用 Bower 将 require.js 添加到项目中\n\n在项目上运行`grunt`之后，`require.js`现在应该已被加载到我们的示例应用程序中。在研究如何将`require.js`完全集成到项目之前，让我们先探索另一种\
    \ JavaScript 模块化格式：CommonJS。\n\n## CommonJS\n\nCommonJS 是另一种 JavaScript 模块化格式，旨在通过指定一个用于声明服务端模块的简单\
    \ API，来标准化模块和包。CommonJS 规范不涉及 IO 和文件系统等更广泛的问题。在第 2 章首次介绍 Node.js 模块时，已经讨论过 CommonJS。CommonJS\
    \ 模块的结构比 AMD 模块更简单，因为它没有包装函数。相反，功能通过一个`exports`变量提供给依赖代码。要使用一个模块，可以使用`require()`函数；然而，由于模块不是异步加载的，它们会立即返回。清单\
    \ 4-3 演示了清单 4-1 中模块的 CommonJS 实现。\n\n***清单 4-3***. 简单地点模块的 CommonJS 实现\n\n```\n\
    var _ = require('underscore');\n\nvar places = {\n  \"nyc\": \"New York\",\n \
    \ \"lon\": \"London\"\n};\n\nexports.data = {\n  keys: _.keys(places),\n  cities:\
    \ _.values(places).sort()\n};\n```\n\n清单 4-3 中的模块提供了与清单 4-1 中定义的模块相同的功能。此实现的关键区别在于我们如何定义依赖关系和暴露模块功能。依赖关系通过使用`require()`函数加载，而功能则通过使用`exports`变量暴露，该变量在模块被包含到应用程序中时会被注入。\
    \ 清单 4-4 演示了我们这个非常简单的 CommonJS 模块的用法。\n\n***清单 4-4***. 演示 CommonJS 模块的用法\n\n```\n\
    'use strict';\n\nvar data = require('./data/cities').data;\nconsole.log(data.cities.join(',\
    \ '));\n```\n\n如前所述，CommonJS 旨在用于服务端，而非浏览器中。因此，清单 4-4 只是将城市列表输出到控制台，而不是将它们插入到页面中。然而，这两个模块提供的实际功能是相同的。在我们开始探索如何在\
    \ Grunt.js 工作流中使用 AMD 模块之前，需要注意的是，现在有一个新的通用模块加载器——称为 Browserify——可用。Browserify\
    \ 允许您开发 CommonJS 模块，然后将它们打包成一个单独的 JavaScript 文件加载到浏览器中。这带来了额外的好处：无需修改即可在服务器端和客户端使用相同的\
    \ JavaScript。Browserify 还构思了转换器，允许将 CommonJS 和 AMD 模块加载到同一个应用程序中。虽然混合使用不同模块格式来开发应用程序是一种好做法，但如果您最喜欢的\
    \ JavaScript 前端框架仅作为 AMD 模块发布，这会非常方便。\n\n## 结合 Grunt.js 和 JavaScript 模块\n\n现在让我们修改我们的应用程序，使其在开发过程中使用`require.js`来加载\
    \ JavaScript 模块。这使我们能够以模块化的功能来开发应用程序，鼓励我们不要在模块之间混合职责，从而基本上实现一组更松散耦合的模块。如清单 4-5\
    \ 所示，我们的应用程序包含了 jQuery、Bootstrap、Underscore.js、Backbone.js 和`require.js`。\n\n\
    ***清单 4-5***. 当前应用程序中的 JavaScript 包含项\n\n```\n<!-- build:js js/app.js -->\n<!--\
    \ bower:js -->\n<script src=\"bower_components/jquery/dist/jquery.js\"></script>\n\
    <script src=\"bower_components/bootstrap/dist/js/bootstrap.js\"></script>\n<script\
    \ src=\"bower_components/underscore/underscore.js\"></script>\n<script src=\"\
    bower_components/backbone/backbone.js\"></script>\n<script src=\"bower_components/requirejs/require.js\"\
    ></script>\n<!-- endbower -->\n<script src=\"js/main.js\"></script>\n<!-- endbuild\
    \ -->\n```\n\n虽然这在开发中很有效，但稍后当我们打算将 JavaScript 编译成一个单独的文件以供发布时，可能会遇到一些问题，因为目标库可能与`require.js`使用的库冲突。为了解决这个问题，可以修改\
    \ JavaScript 包含项，以使用一个名为`grunt-bower-requirejs`的新 Grunt 插件。`grunt-bower-requirejs`插件类似于`grunt-bower-install`，它会读取你的\
    \ Bower 组件，并将它们与你的`require.js`路径配置合并。清单 4-6 演示了修改后的`index.html`文件，其中包含使用`grunt-bower-install`插件所需的配置。\n\
    \n***清单 4-6***. 修改后的 index.html 以支持 require.js\n\n```\n<!-- build:js js/main.js\
    \ -->\n  <script src=\"bower_components/requirejs/require.js\"></script>\n  <script\
    \ src=\"js/paths.js\"></script>\n  <script src=\"js/main.js\"></script>\n<!--\
    \ endbuild -->\n```\n\n在清单 4-6 中，`index.html`已被修改，移除了`grunt-bower-install`配置。取而代之的是引入了三个\
    \ script 标签。第一个包含了`require.js`库本身；第二个是一个包含`require.js`路径配置的 JavaScript 文件；最后一个\
    \ script 标签加载我们的应用程序。`path.js`文件被`grunt-bower-requirejs`插件用于合并我们的 Bower 组件。清单\
    \ 4-7 演示了在运行`grunt-bower-requirejs`之前的`path.js`文件。开始时，该文件只需要使用一个空配置对象调用`requirejs.config()`方法。\n\
    \n***清单 4-7***. 运行 grunt-bower-requirejs 之前的 path.js 文件\n\n```\nrequirejs.config({});\n\
    ```\n"
- fmt: "接下来，我们的`Gruntfile.js`必须被修改以支持新的`grunt-bower-requirejs`插件。[清单 4-8](#part0011.html#list8)\
    \ 演示了添加到`Gruntfile.js`中以支持该新插件的配置。\n\n[**清单 4-8**](#part0011.html#_list8). 用于`grunt-bower-requirejs`的配置，以使用\
    \ Bower 组件维护`require.js`路径\n\n```\nbower: {\n    dist: {\n      rjsConfig: 'app/js/paths.js',\n\
    \      options: {\n        baseUrl: 'app/'\n      }\n    }\n}\n```\n\n第一个选项定义了我们的`require.js`配置文件的路径。这将是任务运行时将修改的文件。第二个选项`baseUrl`定义了所有路径的前置URL。当您希望将模块移动到同一项目中的新位置时，例如，在为生产环境构建应用程序时，这非常有用。运行`bower`任务现在应该会修改`path.js`以匹配[清单\
    \ 4-9](#part0011.html#list9)。这将允许我们在AMD模块中使用Bower组件。\n\n[**清单 4-9**](#part0011.html#_list9).\
    \ 配置并运行`grunt-bower-requirejs`后的`path.js`\n\n```\nrequirejs.config({\n  paths:\
    \ {\n    backbone: \"bower_components/backbone/backbone\",\n    bootstrap: \"\
    bower_components/bootstrap/dist/js/bootstrap\",\n    jquery: \"bower_components/jquery/dist/jquery\"\
    ,\n    requirejs: \"bower_components/requirejs/require\",\n    underscore: \"\
    bower_components/underscore/underscore\"\n  },\n  packages: [\n\n]\n});\n```\n\
    \n`index.html`文件中包含的第三个脚本将是我们的主应用程序JavaScript模块。这将是加载其他模块和初始化应用程序的起点。[清单 4-10](#part0011.html#list10)\
    \ 演示了`main.js`文件。\n\n[**清单 4-10**](#part0011.html#_list10). 包含我们初始化代码的`main.js`文件\n\
    \n```\nrequire(['js/app'], function(app) {\n  $(function() {\n    app.init();\n\
    \  });\n});\n```\n\n[清单 4-10](#part0011.html#list10) 使用`require`加载名为`js/app`的模块。加载后，使用jQuery的`isReady`缩写，然后期望`js/app`模块返回一个`init`函数。[清单\
    \ 4-11](#part0011.html#list11) 定义了模块`js/app`，我们的第一个AMD模块。\n\n[**清单 4-11**](#part0011.html#_list11).\
    \ 用作应用程序代码起点的应用模块\n\n```\ndefine(function() {\n\nvar initialize = function() {\n\
    \    console.log('app.init');\n  };\n\nreturn {\n    init: initialize\n  };\n\
    });\n```\n\n[清单 4-11](#part0011.html#list11) 定义了一个简单的AMD模块，目前不依赖于任何其他模块。它定义了一个名为`initialize`的私有方法，并通过`return`语句将其作为`init`函数暴露给模块的用户。如果您现在在您喜欢的浏览器中加载应用程序，您应该会在控制台中看到“app.init”打印出来，如[图\
    \ 4-4](#part0011.html#Fig4) 所示。\n\n![9781484200148_Fig04-04.jpg](images/00028.jpeg)\n\
    \n[**图 4-4**](#part0011.html#_Fig4). 使用`require.js`加载应用模块的演示\n\n既然我们已经确认应用程序正在加载AMD模块，让我们为待办事项应用程序添加一些骨架代码。[清单\
    \ 4-12](#part0011.html#list12) 列出了组成完整待办事项应用程序的几个新模块。\n\n[**清单 4-12**](#part0011.html#_list12).\
    \ 构成完整应用程序的AMD模块\n\n```\n// js/app.js\n\ndefine([\n  'js/collections/todos',\n\
    \  'js/views/form',\n  'js/views/todo-item'\n  ], function(Collection, FormView,\
    \ TodoView) {\n\nvar initialize = function() {\n    console.log('app.init');\n\
    \    var todos = new Collection();\n    new FormView().render();\n    new TodoView(todos).render();\n\
    \  };\n\nreturn {\n    init: initialize\n  };\n});\n\n// js/collections/todos.js\n\
    \ndefine(['backbone', 'js/models/todo'], function(Backbone, Todo) {\n  return\
    \ Backbone.Collection.extend({\n    model: Todo\n  });\n});\n\n// js/models/todo.js\n\
    \ndefine(['backbone'], function(Backbone) {\n  return Backbone.Model.extend({\n\
    \n});\n});\n\n// js/views/form.js\n\ndefine(['backbone'], function(Backbone) {\n\
    \  return Backbone.View.extend({\n\ntagName: 'div',\n\nclassName: 'todo-form',\n\
    \nrender: function() {\n\n}\n  });\n});\n\n// js/views/todo-item.js\n\ndefine(['backbone'],\
    \ function(Backbone) {\n  return Backbone.View.extend({\n\ntagName: 'li',\n\n\
    className: 'todo-item',\n\nrender: function() {\n\n}\n  });\n});\n```\n\n[清单 4-12](#part0011.html#list12)\
    \ 添加了四个新的AMD模块：一个Backbone集合、一个模型和两个视图。目前，应用程序功能不多，因为我们还没有为Backbone视图定义要渲染的模板。然而，它确实建立了应用程序结构，我们可以开始基于此改进工作流程。在当前状态下，向应用程序添加新模块相对容易：创建一个新文件，然后添加对它的引用。但是，我们没有优化生产环境中JavaScript代码的流程。让我们更新`Gruntfile`以优化出现在`dist`文件夹中的JavaScript。\n\
    \n首先，让我们引入一个新的`Grunt.js`插件来将我们的`require.js`模块编译到单个文件中。如前一章所述，在生产环境中，您希望尽量减少HTTP调用次数，这意味着更少的资源。在我们的特定示例中，如果我们能够在生产环境中合并JavaScript文件，我们将把连接数从11个减少到1个。我们将使用的`Grunt.js`插件称为`grunt-contrib-requirejs`。该插件可用于自动化运行`require.js`优化器。`require.js`优化器旨在解析使用AMD模块的JavaScript应用程序，并将这些模块合并到单个文件中。除此之外，优化器还可以使用名为`Uglify`的库来压缩合并后的JavaScript。[清单\
    \ 4-13](#part0011.html#list13) 演示了`grunt-contrib-requirejs`的配置。\n\n[**清单 4-13**](#part0011.html#_list13).\
    \ 添加`grunt-contrib-requirejs`配置\n\n```\nrequirejs: {\n  dist: {\n    options:\
    \ {\n      baseUrl: 'app/',\n      name: '../.tmp/concat/js/main',\n      out:\
    \ 'dist/js/main.js',\n      optimize: 'uglify2',\n      paths: {\n        backbone:\
    \ 'bower_components/backbone/backbone',\n        bootstrap: 'bower_components/bootstrap/dist/js/bootstrap',\n\
    \        jquery: 'bower_components/jquery/dist/jquery',\n        requirejs: 'bower_components/requirejs/require',\n\
    \        underscore: 'bower_components/underscore/underscore',\n        handlebars:\
    \ 'bower_components/handlebars/handlebars'\n      }\n    }\n  }\n},\n```\n\n新配置设置了一些选项。首先，`baseUrl`设置与应用程序路径匹配，因为我们的应用程序位于`app`文件夹内。这使得`require.js`优化器能够正确找到AMD模块。下一个配置选项`main`告诉优化器哪个主文件是应用程序的起点。这指向`.tmp`目录，因为我们想要将AMD模块与作为`usemin`插件一部分生成的合并JavaScript结合起来。因此，`requirejs`任务必须在`concat`任务完成后运行。`out`选项，如您所料，指定了任务的输出应放置的位置。最后，该任务提供了指定应用哪种优化的能力。在我们的配置中，我们选择了`UglifyJS2`。要禁用优化，可以传递`none`值。\n\
    \n将此配置添加到您的`Gruntfile.js`文件后，您还需要将此任务添加到默认任务中。[清单 4-14](#part0011.html#list14)\
    \ 显示了更新后的默认任务。\n\n[**清单 4-14**](#part0011.html#_list14). 修改后的默认任务，包含`grunt-contrib-requirejs`\n\
    \n```\ngrunt.loadNpmTasks('grunt-contrib-requirejs');\n\n// Default task.\ngrunt.registerTask('default',\
    \ [\n  'useminPrepare',\n  'sass',\n  'bowerInstall',\n  'autoprefixer',\n  'recess',\n\
    \  'uncss',\n  'copy',\n  'cssmin',\n  'concat',\n  'requirejs',\n  'rev',\n \
    \ 'usemin'\n]);\n```"
  raw: 'Next, our Gruntfile.js must be modified to support the new grunt-bower-requirejs
    plug-in. [Listing 4-8](#part0011.html#list8) demonstrates the configuration added
    to our Gruntfile.js to support the new plug-in.


    [***Listing 4-8***](#part0011.html#_list8). Configuration for grunt-bower-requirejs
    to Maintain require.js Paths with bower Components


    ```

    bower: {

        dist: {

          rjsConfig: ''app/js/paths.js'',

          options: {

            baseUrl: ''app/''

          }

        }

    }

    ```


    The first option defines the path to our require.js configuration. This will be
    the file that the task will modify when run. The second option, baseUrl, defines
    the URL that is prepended to all paths. This is useful when you want to move your
    modules to a new location within the same project, for example, when building
    your application for production. Running the bower task should now modify path.js
    to match [Listing 4-9](#part0011.html#list9). This will allow us to use bower
    components within our AMD modules.


    [***Listing 4-9***](#part0011.html#_list9). path.js After grunt-bower-requirejs
    Has Been Configured and Run


    ```

    requirejs.config({

      paths: {

        backbone: "bower_components/backbone/backbone",

        bootstrap: "bower_components/bootstrap/dist/js/bootstrap",

        jquery: "bower_components/jquery/dist/jquery",

        requirejs: "bower_components/requirejs/require",

        underscore: "bower_components/underscore/underscore"

      },

      packages: [


    ]

    });

    ```


    The third script included in the index.html file will be our main application
    JavaScript module. This will be the starting point of our application that will
    be used to load other modules and initialize our application. [Listing 4-10](#part0011.html#list10)
    illustrates the main.js file.


    [***Listing 4-10***](#part0011.html#_list10). main.js File Containing Our Initilize
    Code


    ```

    require([''js/app''], function(app) {

      $(function() {

        app.init();

      });

    });

    ```


    [Listing 4-10](#part0011.html#list10) uses require to load the module known as
    js/app. Once loaded, jQuery isReady shorthand is used, then the js/app module
    is expected to return an init function. [Listing 4-11](#part0011.html#list11)
    defines the module js/app, our first AMD module.


    [***Listing 4-11***](#part0011.html#_list11). Application Module Used As the Starting
    Point of Our Application Code


    ```

    define(function() {


    var initialize = function() {

        console.log(''app.init'');

      };


    return {

        init: initialize

      };

    });

    ```


    [Listing 4-11](#part0011.html#list11) defines a simple AMD module that currently
    does not depend on any other modules. It defines a private method called initialize
    and exposes this to users of the module, via the return statement, as an init
    function. If you now load the application in your favorite browser, you should
    see “app.init” printed to the console, as shown in [Figure 4-4](#part0011.html#Fig4).


    ![9781484200148_Fig04-04.jpg](images/00028.jpeg)


    [Figure 4-4](#part0011.html#_Fig4). Demonstration of application module being
    loaded using require.js


    Now that we have confirmed that our application is loading AMD modules, let’s
    add some more skeleton code for our to-do application. [Listing 4-12](#part0011.html#list12)
    lists several new modules that will make up the total to-do application.


    [***Listing 4-12***](#part0011.html#_list12). AMD Modules to Make Up the Complete
    Application


    ```

    // js/app.js


    define([

      ''js/collections/todos'',

      ''js/views/form'',

      ''js/views/todo-item''

      ], function(Collection, FormView, TodoView) {


    var initialize = function() {

        console.log(''app.init'');

        var todos = new Collection();

        new FormView().render();

        new TodoView(todos).render();

      };


    return {

        init: initialize

      };

    });


    // js/collections/todos.js


    define([''backbone'', ''js/models/todo''], function(Backbone, Todo) {

      return Backbone.Collection.extend({

        model: Todo

      });

    });


    // js/models/todo.js


    define([''backbone''], function(Backbone) {

      return Backbone.Model.extend({


    });

    });


    // js/views/form.js


    define([''backbone''], function(Backbone) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    render: function() {


    }

      });

    });


    // js/views/todo-item.js


    define([''backbone''], function(Backbone) {

      return Backbone.View.extend({


    tagName: ''li'',


    className: ''todo-item'',


    render: function() {


    }

      });

    });

    ```


    [Listing 4-12](#part0011.html#list12) adds four new AMD modules: a Backbone collection,
    model, and two views. At the moment, the application does not do a lot, as we
    have not defined templates for the Backbone views to render. However, it does
    set up the application structure with which we can start to improve our workflow.
    In the current state, to add a new module to our application is relatively easy:
    we create a new file and then add a reference to it. However, we do not have a
    process for optimizing our JavaScript code in production. Let’s update our Gruntfile
    to optimize the JavaScript that appears in the dist folder.


    First, let’s introduce a new Grunt.js plug-in to compile our require.js modules
    into a single file. As discussed in the previous chapter, in production, you want
    to aim for the fewest number of HTTP calls, which means fewer assets. In our particular
    example, if we are able to combine our JavaScript files in production, we will
    reduce the number of connections from 11 to 1\. The Grunt.js plug-in we will use
    is called grunt-contrib-requirejs. The plug-in grunt-contrib-plugin can be used
    to automate the running of the require.js optimizer. The require.js optimizer
    is designed to parse a JavaScript application that is using AMD modules and combine
    the modules into a single file. In addition to this, the optimizer can also minify
    the combined JavaScript, using the library known as Uglify. [Listing 4-13](#part0011.html#list13)
    demonstrates the configuration for grunt-contrib-requirejs.


    [***Listing 4-13***](#part0011.html#_list13). Adding grunt-contrib-requirejs Configuration


    ```

    requirejs: {

      dist: {

        options: {

          baseUrl: ''app/'',

          name: ''../.tmp/concat/js/main'',

          out: ''dist/js/main.js'',

          optimize: ''uglify2'',

          paths: {

            backbone: ''bower_components/backbone/backbone'',

            bootstrap: ''bower_components/bootstrap/dist/js/bootstrap'',

            jquery: ''bower_components/jquery/dist/jquery'',

            requirejs: ''bower_components/requirejs/require'',

            underscore: ''bower_components/underscore/underscore'',

            handlebars: ''bower_components/handlebars/handlebars''

          }

        }

      }

    },

    ```


    The new configuration has a number of options set. First, the baseUrl is set to
    match that of the application path, as our application resides within the app
    folder. This leads to the AMD modules being correctly located by the require.js
    optimizer. The next configuration option, main, indicates to the optimizer the
    main file that is the starting point of the application. This points to the .tmp
    directly, as we want to combine our AMD modules with the concentrated JavaScript
    produced as part of the usemin plug-in. Therefore, the requirejs task will have
    to run after the concat task has completed. The out option, as you might expect,
    dictates where the output from the task should be placed. Finally, the task provides
    the ability to specify which optimization should be applied. In our configuration,
    we’ve opted for UglifyJS2\. To disable optimization, the value of none can be
    passed.


    Once this has been added to your Gruntfile.js file, you will have to add the task
    to the default task. [Listing 4-14](#part0011.html#list14) shows the updated default
    task.


    [***Listing 4-14***](#part0011.html#_list14). Default Task Modified to Include
    grunt-contrib-requirejs


    ```

    grunt.loadNpmTasks(''grunt-contrib-requirejs'');


    // Default task.

    grunt.registerTask(''default'', [

      ''useminPrepare'',

      ''sass'',

      ''bowerInstall'',

      ''autoprefixer'',

      ''recess'',

      ''uncss'',

      ''copy'',

      ''cssmin'',

      ''concat'',

      ''requirejs'',

      ''rev'',

      ''usemin''

    ]);

    ```'
  trans: "\n接下来，我们的`Gruntfile.js`必须被修改以支持新的`grunt-bower-requirejs`插件。清单 4-8 演示了添加到`Gruntfile.js`中以支持该新插件的配置。\n\
    \n**清单 4-8**. 用于`grunt-bower-requirejs`的配置，以使用 Bower 组件维护`require.js`路径\n\n```\n\
    bower: {\n    dist: {\n      rjsConfig: 'app/js/paths.js',\n      options: {\n\
