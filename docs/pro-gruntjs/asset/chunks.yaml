    \ URL。当您希望将模块移动到同一项目中的新位置时，例如，在为生产环境构建应用程序时，这非常有用。运行`bower`任务现在应该会修改`path.js`以匹配清单\
    \ 4-9。这将允许我们在 AMD 模块中使用 Bower 组件。\n\n**清单 4-9**. 配置并运行`grunt-bower-requirejs`后的`path.js`\n\
