  raw: 'Extracting Common Configuration Options


    The final optimization that we can make the organization of our Grunt configuration
    is to extract common configuration options from each task configuration. For example,
    instead of hard-coding the path to our distribution folder, we can define it once
    and reuse it throughout our configuration, following the principles of Don’t Repeat
    Yourself. We can achieve this, as Grunt allows us to define variables within our
    task configuration. [Listing 7-20](#part0014.html#list20) contains the modified
    configuration for grunt-contrib-cssmin.


    [***Listing 7-20***](#part0014.html#_list20). Use of Variables in Grunt Plug-in
    Configuration


    ```

    ''use strict'';


    module.exports = function (grunt) {

      grunt.config(

        ''cssmin'', {

        dist: {

          options: {

            report: ''gzip''

          },

          files: {

            ''<%= paths.css.dest %>main.css'': ''<%= paths.css.src %>main.css''

          }

        }

      });

    };

    ```


    By separating our task configuration from common paths such as the source and
    destination folders, we make our tasks less brittle and even increase the reuse
    across projects. To use this approach, we must define these variables in Grunt
    configuration. [Listing 7-21](#part0014.html#list21) contains a new module that
    can be added to the tasks folder. This module will be called config.js.


    [***Listing 7-21***](#part0014.html#_list21). Sample Configuration Module


    ```

    ''use strict'';


    module.exports = function (grunt) {

      grunt.config.merge({

        paths: {

          css: {

            src: ''app/css/'',

            dest: ''dest/css/''

          }

        }

      });

    };

    ```


    The configuration module defines a set of key/value pairs that can then be used
    within our Grunt task configuration. [Listing 7-21](#part0014.html#list21) shows
    a very small subset of the overall configuration required for the project. It
    can be extended to include properties such as the port numbers used for local
    development. As discussed in the previous section, we can also use grunt options
    to switch our configurations per environment, for example, if the paths differ
    on your local development environment compared to your continuous integration
    environment. Another good use case for having environment-based configuration
    is your test runner. Locally, you may choose to run only your tests in a headless
    browser, for speed and efficiency. However, in your test environment, you may
    want to run the tests against a number of browsers.


    This brings us to the end of our discussion on Grunt configuration optimization.
    At the end of this process, our Gruntfile has been reduced down to 22 lines, and
    each task configuration is now managed by a separate module, with common paths
    being shared to allow us to easily update our project structure. Next, we’ll return
    to exploring approaches to reduce the runtime of the Grunt task runner.


    Running Tasks in Parallel


    In the previous section, we started to group tasks into logical groups, which
    was a great approach to generalizing our task runner and communicating it throughout
    a team. Grouping tasks together has not reduced the total time; however, it does
    make our next optimization a little easier. In this section, we’ll explore running
    tasks in parallel. As Grunt is a task runner based on files, the files output
    from a task are input into the next task, which leads to problems when trying
    to parallelize parts of the build. For example, we cannot run our CSS minification
    process until our SASS compilation has completed and output. However, there are
    sections of our build process that can be parallelized, for example, our CSS tasks
    can be run at the same time as our JavaScript tasks.


    To achieve parallel running of tasks, we must introduce a new plug-in to the project.
    The plug-in required to parallelize our build is called grunt-concurrent. [Listing
    7-22](#part0014.html#list22) shows how to include the plug-in into the project.


    [***Listing 7-22***](#part0014.html#_list22). Adding grunt-concurrent to the Project


    ```

    npm install --save-dev grunt-concurrent

    ```


    Now that the plug-in has been added to our project, we must define configuration.
    To do this, we create a new configuration file in the tasks folder (see [Listing
    7-23](#part0014.html#list23)).


    [***Listing 7-23***](#part0014.html#_list23). Configuration for grunt-concurrent


    ```

    ''use strict'';


    module.exports = function (grunt) {

      grunt.config(

        ''concurrent'', {

        assets: [''css'', ''js'']

      });

    };

    ```


    This configuration defined in [Listing 7-23](#part0014.html#list23) is simple
    and defines a single set of concurrent tasks. The value assigned to the assets
    property is an array of tasks to be run concurrently. To run these tasks in parallel,
    you can use Grunt as with any other task. Concurrent tasks can be included in
    other tasks as well, allowing for a mixture of sequential and concurrent tasks.
    [Listing 7-24](#part0014.html#list24) contains an updated version of our aliases
    module to use for the new concurrent task.


    [***Listing 7-24***](#part0014.html#_list24). Using grunt-concurrent in the Aliases
    Module


    ```

    module.exports = function (grunt) {


    grunt.registerTask(''prepare'', [''clean'', ''useminPrepare'']);

      grunt.registerTask(''css'', [''sass'', ''autoprefixer'', ''uncss'']);

      grunt.registerTask(''dependencies'', [''bowerInstall'']);

      grunt.registerTask(''js'', [''jshint'', ''handlebars'']);

      grunt.registerTask(''minify'', [''copy'', ''cssmin'', ''concat'', ''requirejs'',
    ''rev'', ''usemin'']);

      grunt.registerTask(''build'', [''prepare'', ''dependencies'', ''concurrent:assets'',
    ''minify'']);

      grunt.registerTask(''default'', [''build'', ''connect:server'']);

      grunt.registerTask(''serve'', [''build'', ''connect:dev'']);

      grunt.registerTask(''test'', [''build'', ''karma'']);

    };

    ```


    The build task has been updated in [Listing 7-24](#part0014.html#list24) to now
    run our CSS and JavaScript tasks in parallel. Running our default task should
    allow us to measure whether there has been any performance increase. [Figure 7-6](#part0014.html#Fig6)
    contains a sample output, and it may be surprising, but the overall time has increased—not
    the desired effect. To analyze the root cause of the problem, the verbose flag
    can be used to understand the performance decrease. In this scenario, the performance
    decrease can be attributed to grunt tasks being loaded a second time when grunt-concurrent
    is used. To resolve this issue, it is best to revisit the techniques used in the
    initial section and review which modules should be loaded as part of the main
    runner and the ones loaded for concurrent tasks.


    ![9781484200148_Fig07-06.jpg](images/00062.jpeg)


    [Figure 7-6](#part0014.html#_Fig6). Performance decrease introduced by using grunt-concurrent


    Running Things on Changes


    In our attempts to optimize our Grunt workflow further, the next approach we’ll
    explore is the use of a new plug-in known as grunt-newer. The grunt-newer plug-in
    aims to reduce the workload Grunt has to perform by executing a task only if the
    task’s source files have changed. The plug-in itself does not require any additional
    configuration. Instead, to utilize its features, a task’s name should be prefixed
    with newer:. [Listing 7-25](#part0014.html#list25) demonstrates adding the plug-in
    to the project.


    [***Listing 7-25***](#part0014.html#_list25). Adding grunt-newer to the Project


    ```

    npm install --save-dev grunt-newer

    ```


    To use the plug-in in our project, we have to update our alias module with the
    new prefix. [Listing 7-26](#part0014.html#list26) has sample configuration to
    support this.


    [***Listing 7-26***](#part0014.html#_list26). Modified Configuration to Use grunt-newer


    ```

    ''use strict'';


    module.exports = function (grunt) {'
