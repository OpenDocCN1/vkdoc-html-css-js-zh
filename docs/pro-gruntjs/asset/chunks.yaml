- fmt: '## 注意任务顺序


    必须注意任务的执行顺序。我们必须将`requirejs`任务放在`concat`之后，以确保在运行`requirejs`任务之前，我们的应用程序文件已经拼接完成并放入`.tmp`文件夹。现在，新任务已加载，并且`requirejs`任务已添加到默认任务中，运行`grunt`应该会生成`js/main.js`文件。


    在进入下一个主题之前，我们需要进一步优化输出到`dist`文件夹的JavaScript文件。我们还必须修改`grunt-rev`任务，使其包含我们的JavaScript文件。这是一个小改动，用于确保`dist`目标与[清单4-15](#part0011.html#list15)中的目标一致。


    [***清单4-15***](#part0011.html#_list15)。更新`grunt-rev`以包含JavaScript，确保缓存有效


    ```

    rev: {

      dist: {

        src: [''dist/css/main.css'', ''dist/js/main.js'']

      }

    },

    ```


    ## 清理构建过程


    随着构建过程的增加，可能会有一些构建产物残留下来。一个常见的例子是，一个临时文件在压缩之前，但在合并过程中生成之后。这些文件通常是无害的，因为它们通常不会出现在生产代码中。然而，最佳实践要求确保每次构建都是干净的。我们可以引入一个任务来解决这个问题，我们将添加的是`grunt-contrib-clean`。`grunt-contrib-clean`插件可用于删除特定文件或递归清理目录。[清单4-16](#part0011.html#list16)展示了用于待办事项应用的配置。


    [***清单4-16***](#part0011.html#_list16)。`grunt-contrib-clean`的配置


    ```

    clean: {

      tmp: {

        src: [''.tmp'', ''.sass-cache'', ''dist'', ''app/js/template.js'']

      }

    }

    ```


    [清单4-16](#part0011.html#list16)中概述的配置将简单地删除`.tmp`、`.sass-cache`和`dist`文件夹。这三个文件夹都是在构建过程中生成的，因此删除它们无害。最好将`clean`任务添加到默认任务中（参见[清单4-17](#part0011.html#list17)），这样每次运行`grunt`时都会清理应用程序。最佳实践建议它应该是第一个运行的任务，以确保每次构建在运行前都处于原始状态。如果`clean`只被添加到构建过程的末尾，那么之前失败的构建可能会污染新的构建。


    [***清单4-17***](#part0011.html#_list17)。修改后的默认任务示例


    ```

    // Default task.

    grunt.registerTask(''default'', [

      ''clean'',

      ''useminPrepare'',

      ''sass'',

      ''bowerInstall'',

      ''autoprefixer'',

      ''recess'',

      ....

    ]);

    ```


    ## JavaScript模板


    随着我们的AMD模块作为工作流的一部分被集成，让我们将注意力转向待办事项应用的实现。在本节中，我们将探讨JavaScript模板库的使用，以及如何使用Grunt自动化这些模板的生成并将其集成到工作流中。


    对于具有丰富用户界面的现代Web应用程序，将应用程序划分为执行特定任务的模块非常重要，如前一节所述。这导致了遵循模型-视图-控制器（MVC）常见设计模式的前端框架的迅速涌现。


    在MVC设计模式中，应用程序模块被分为三个关注点。模型包含应用程序的状态；视图是该状态的表示；控制器编排从视图触发的动作，以修改模型中的状态，并通知视图状态的变化。在大多数现代框架中，视图是通过使用模板引擎生成的。通常，像`Backbone`这样的框架并不指定要使用的模板引擎，而是允许开发者选择最适合其需求的引擎。


    JavaScript有大量的模板引擎可用，它们提供了诸如局部模板和助手函数等强大功能。每个引擎的能力各不相同，从最简单的形式（如`underscore.js`的`template`函数）到功能更丰富的函数（如`handlebars.js`）。在我们的大多数示例中，我们将使用`handlebars.js`，并将其集成到待办事项应用的`Grunt.js`工作流中。在更新`Grunt`工作流之前，让我们探讨一下在使用JavaScript模板时可以应用的各种实现策略。


    第一种技术也是三种中最简单的一种，是根本不使用模板引擎，而是以编程方式构建视图。[清单4-18](#part0011.html#list18)演示了使用`jQuery`创建一个`<h1>`元素，并将一个局部变量赋值为其文本，从而构建一个`Backbone`视图。在这个简单的例子中，解决方案可能看起来足够，但是当视图变得更复杂并且我们必须遍历大量元素时，这种方法很快就会失效。


    [***清单4-18***](#part0011.html#_list18)。使用`Backbone.js`的简单视图渲染


    ```

    define([''backbone''], function(Backbone) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            $(''<h1 />'').text(title)

          );

        }

      });

    });

    ```


    下一种方法是使用内联模板，其中模板字符串存储在一个局部变量中，然后传递给模板引擎。在[清单4-19](#part0011.html#list19)中，使用了`underscore.js`的`template`函数来演示内联模板的使用。


    [***清单4-19***](#part0011.html#_list19)。使用`underscore.js`的`template`函数进行内联模板


    ```

    define([''backbone''], function(Backbone) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    template: _.template(''<h1><%= title %></h1>''),


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            this.template({title: title})

          );

        }

      });

    });

    ```


    这种方法存在与第一种方法相同的问题：当模板简单时，内联模板运行良好。如果我们将[清单4-19](#part0011.html#list19)中的示例扩展为具有迭代循环的多行模板，它将很快变得难以维护。


    第三种方法通过提高可维护性，解决了前两种方法带来的问题。模板存储在DOM内的`<script>`标签中。每个模板都有一个唯一的ID，以便可以从DOM中选择它，然后将其内容传递给模板引擎。[清单4-20](#part0011.html#list20)演示了如何从DOM加载模板并将其传递给`underscore.js`的`template`函数。


    [***清单4-20***](#part0011.html#_list20)。从DOM加载模板


    ```

    // index.html


    <script type="text/template" id="title-tmpl">

      <h1><%= title %></h1>

    </script>


    // view.js


    define([''backbone'', ''underscore''], function(Backbone, _) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    template: _.template(document.getElementById(''title-tmpl'').innerHTML),


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            this.template({title: title})

          );

        }

      });

    });

    ```'
  raw: 'It is important to note the order of tasks. We must include the requirejs
    task after concat, to ensure that our application file has been concatentated
    into the .tmp folder before the requirejs task is run. Now that the new task is
    loaded and the requirejs task has been added to the default task, running grunt
    should produce a js/main.js file.


    Before moving on to the next topic, we have to further optimize the JavaScript
    output to the dist folder. We must modify the grunt-rev task to include our JavaScript
    file as well. This is a minor modification to ensure that the dist target matches
    the one in [Listing 4-15](#part0011.html#list15).


    [***Listing 4-15***](#part0011.html#_list15). Updating grunt-rev to Include JavaScript,
    to Ensure Caching Is Effective


    ```

    rev: {

      dist: {

        src: [''dist/css/main.css'', ''dist/js/main.js'']

      }

    },

    ```


    Cleaning the Build Process


    As the build process increases, it is likely that you may have artifacts that
    remain built as part of the build. A common example is a temporary file before
    it has been minified but after it has been generated as part of a concentration
    process. These files are generally harmless, as they typically do not appear in
    the production code. However, it is best practice to ensure that each build is
    clean. A task can be introduced to solve this problem, and the one we will add
    is grunt-contrib-clean. The grunt-contrib-clean plug-in can be used to remove
    particular files or recursively clean a directory. [Listing 4-16](#part0011.html#list16)
    illustrates the configuration used for the to-do application.


    [***Listing 4-16***](#part0011.html#_list16). Configuraton for grunt-contrib-clean


    ```

    clean: {

      tmp: {

        src: [''.tmp'', ''.sass-cache'', ''dist'', ''app/js/template.js'']

      }

    }

    ```


    The configuration outlined in [Listing 4-16](#part0011.html#list16) will simply
    remove the .tmp, .sass-cache, and dist folders. All three of these folders are
    generated as part of the build process, so there is no harm in removing them.
    It is a good idea to add the clean task to the default task (see [Listing 4-17](#part0011.html#list17)),
    so that the application is cleaned each time grunt is run. Best practice suggests
    that it should be the first task run, to ensure that each build is in a pristine
    state before being run. If clean is added only to the end of the build process,
    there is a possibility that a previous build that failed will populate newer builds.


    [***Listing 4-17***](#part0011.html#_list17). Illustration of a Modified Default
    Task


    ```

    // Default task.

    grunt.registerTask(''default'', [

      ''clean'',

      ''useminPrepare'',

      ''sass'',

      ''bowerInstall'',

      ''autoprefixer'',

      ''recess'',

      ....

    ]);

    ```


    JavaScript Templating


    With our AMD modules integrated as part of workflow, let’s turn our attention
    to the implementation of the to-do application. In this section, we will explore
    the use of JavaScript templating libraries and the use of Grunt to automate the
    generation of these templates into our workflow.


    With modern web applications with rich user interfaces, it is important to separate
    the application into modules that perform specific tasks, as outlined in the previous
    section. This has lead to the rapid emergence of front-end frameworks that follow
    the common design pattern of model-view-controller, alternatively known as MVC.


    In the MVC design pattern, application modules are divided into three concerns.
    The model contains the state of the application; the view is the representation
    of that state; and the controller orchestrates actions fired from the view to
    modify the state in the model and notify the view of changes to the state. In
    most modern frameworks, the views are generated by using a templating engine.
    Often, frameworks, such as Backbone, do not prescribe the templating engine to
    be used and allow the developer to choose the engine that best suits his/her needs.


    There is a vast set of templating engines available for JavaScript, offering powerful
    features such as partials and helpers. The capabilities of each engine vary from
    the simplest form, such as the underscore.js template function, to more feature-rich
    functions such as handlebars.js. For the majority of our examples, we will be
    using handlebars.js, and we will integrate this into the Grunt.js workflow for
    the to-do application. Before updating the Grunt workflow, let’s explore the various
    implementation strageties that can be applied when using JavaScript templating.


    The first technique, and the simplest of the three, is to not use a template engine
    but to build the view programmatically. [Listing 4-18](#part0011.html#list18)
    demonstrates building a Backbone view, using jQuery to create an h1 element and
    assigning a local variable as the text. In this trivial example, the solution
    may appear adequate, but this approach quickly starts to break down when the views
    become more complex and we have to iterate over a number of items.


    [***Listing 4-18***](#part0011.html#_list18). Simple View Rendering with Backbone.js


    ```

    define([''backbone''], function(Backbone) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            $(''<h1 />'').text(title)

          );

        }

      });

    });

    ```


    The next approach is to use inline templates in which the template string is stored
    within a local variable and passed to the template engine. In [Listing 4-19](#part0011.html#list19),
    the underscore.js template function has been used to demonstrate the use of inline
    templates.


    [***Listing 4-19***](#part0011.html#_list19). Using Inline Templates with the
    template Function from underscore.js


    ```

    define([''backbone''], function(Backbone) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    template: _.template(''<h1><%= title %></h1>''),


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            this.template({title: title})

          );

        }

      });

    });

    ```


    This approach suffers from the same issues as the first approach: an inline template
    works well when the template is simple. If we were to expand the sample in [Listing
    4-19](#part0011.html#list19) to be used as a multiple-line template with an iterative
    loop, this would quickly become unmaintainable.


    The third approach solves the issues associated with the first two approaches
    by improving the maintainability. The templates are stored within script tags
    within the DOM. Each template is given a unique ID, so that it can be selected
    from the DOM, and its contents then passed to the template engine. [Listing 4-20](#part0011.html#list20)
    demonstrates loading a template from the DOM and passing it to the underscore.js
    template function.


    [***Listing 4-20***](#part0011.html#_list20). Loading Template from the DOM


    ```

    // index.html


    <script type="text/template" id="title-tmpl">

      <h1><%= title %></h1>

    </script>


    // view.js


    define([''backbone'', ''underscore''], function(Backbone, _) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    template: _.template(document.getElementById(''title-tmpl'').innerHTML),


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            this.template({title: title})

          );

        }

      });

    });

    ```'
  trans: '

    ## 注意任务顺序


    必须注意任务的执行顺序。我们必须将`requirejs`任务放在`concat`之后，以确保在运行`requirejs`任务之前，我们的应用程序文件已经拼接完成并放入`.tmp`文件夹。现在，新任务已加载，并且`requirejs`任务已添加到默认任务中，运行`grunt`应该会生成`js/main.js`文件。


    在进入下一个主题之前，我们需要进一步优化输出到`dist`文件夹的 JavaScript 文件。我们还必须修改`grunt-rev`任务，使其包含我们的 JavaScript
    文件。这是一个小改动，用于确保`dist`目标与清单 4-15 中的目标一致。


    ***清单 4-15***。更新`grunt-rev`以包含 JavaScript，确保缓存有效


    ```

    rev: {

      dist: {

        src: [''dist/css/main.css'', ''dist/js/main.js'']

      }

    },

    ```


    ## 清理构建过程


    随着构建过程的增加，可能会有一些构建产物残留下来。一个常见的例子是，一个临时文件在压缩之前，但在合并过程中生成之后。这些文件通常是无害的，因为它们通常不会出现在生产代码中。然而，最佳实践要求确保每次构建都是干净的。我们可以引入一个任务来解决这个问题，我们将添加的是`grunt-contrib-clean`。`grunt-contrib-clean`插件可用于删除特定文件或递归清理目录。清单
    4-16 展示了用于待办事项应用的配置。


    ***清单 4-16***。`grunt-contrib-clean`的配置


    ```

    clean: {

      tmp: {

        src: [''.tmp'', ''.sass-cache'', ''dist'', ''app/js/template.js'']

      }

    }

    ```


    清单 4-16 中概述的配置将简单地删除`.tmp`、`.sass-cache`和`dist`文件夹。这三个文件夹都是在构建过程中生成的，因此删除它们无害。最好将`clean`任务添加到默认任务中（参见清单
    4-17），这样每次运行`grunt`时都会清理应用程序。最佳实践建议它应该是第一个运行的任务，以确保每次构建在运行前都处于原始状态。如果`clean`只被添加到构建过程的末尾，那么之前失败的构建可能会污染新的构建。


    ***清单 4-17***。修改后的默认任务示例


    ```

    // Default task.

    grunt.registerTask(''default'', [

      ''clean'',

      ''useminPrepare'',

      ''sass'',

      ''bowerInstall'',

      ''autoprefixer'',

      ''recess'',

      ....

    ]);

    ```


    ## JavaScript 模板


    随着我们的 AMD 模块作为工作流的一部分被集成，让我们将注意力转向待办事项应用的实现。在本节中，我们将探讨 JavaScript 模板库的使用，以及如何使用
    Grunt 自动化这些模板的生成并将其集成到工作流中。


    对于具有丰富用户界面的现代 Web 应用程序，将应用程序划分为执行特定任务的模块非常重要，如前一节所述。这导致了遵循模型-视图-控制器（MVC）常见设计模式的前端框架的迅速涌现。


    在 MVC 设计模式中，应用程序模块被分为三个关注点。模型包含应用程序的状态；视图是该状态的表示；控制器编排从视图触发的动作，以修改模型中的状态，并通知视图状态的变化。在大多数现代框架中，视图是通过使用模板引擎生成的。通常，像`Backbone`这样的框架并不指定要使用的模板引擎，而是允许开发者选择最适合其需求的引擎。


    JavaScript 有大量的模板引擎可用，它们提供了诸如局部模板和助手函数等强大功能。每个引擎的能力各不相同，从最简单的形式（如`underscore.js`的`template`函数）到功能更丰富的函数（如`handlebars.js`）。在我们的大多数示例中，我们将使用`handlebars.js`，并将其集成到待办事项应用的`Grunt.js`工作流中。在更新`Grunt`工作流之前，让我们探讨一下在使用
    JavaScript 模板时可以应用的各种实现策略。


    第一种技术也是三种中最简单的一种，是根本不使用模板引擎，而是以编程方式构建视图。清单 4-18 演示了使用`jQuery`创建一个`<h1>`元素，并将一个局部变量赋值为其文本，从而构建一个`Backbone`视图。在这个简单的例子中，解决方案可能看起来足够，但是当视图变得更复杂并且我们必须遍历大量元素时，这种方法很快就会失效。


    ***清单 4-18***。使用`Backbone.js`的简单视图渲染


    ```

    define([''backbone''], function(Backbone) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            $(''<h1 />'').text(title)

          );

        }

      });

    });

    ```


    下一种方法是使用内联模板，其中模板字符串存储在一个局部变量中，然后传递给模板引擎。在清单 4-19 中，使用了`underscore.js`的`template`函数来演示内联模板的使用。


    ***清单 4-19***。使用`underscore.js`的`template`函数进行内联模板


    ```

    define([''backbone''], function(Backbone) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    template: _.template(''<h1><%= title %></h1>''),


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            this.template({title: title})

          );

        }

      });

    });

    ```


    这种方法存在与第一种方法相同的问题：当模板简单时，内联模板运行良好。如果我们将清单 4-19 中的示例扩展为具有迭代循环的多行模板，它将很快变得难以维护。


    第三种方法通过提高可维护性，解决了前两种方法带来的问题。模板存储在 DOM 内的`<script>`标签中。每个模板都有一个唯一的 ID，以便可以从 DOM
    中选择它，然后将其内容传递给模板引擎。清单 4-20 演示了如何从 DOM 加载模板并将其传递给`underscore.js`的`template`函数。


    ***清单 4-20***。从 DOM 加载模板


    ```

    // index.html


    <script type="text/template" id="title-tmpl">

      <h1><%= title %></h1>

    </script>


    // view.js


    define([''backbone'', ''underscore''], function(Backbone, _) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    template: _.template(document.getElementById(''title-tmpl'').innerHTML),


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            this.template({title: title})

          );

        }

      });

    });

    ```

    '
- fmt: "该解决方案与前两个方案的关键区别在于加载模板内容的方法。模板不再存储在 JavaScript 应用程序代码中，而是迁移到了 DOM 中。通过使用`document.getElementById`将模板内容传递给模板函数来加载模板内容。这解决了维护更复杂模板的问题，因为模板的可读性大大提高，其标签可以像其他任何\
    \ HTML 模板一样进行编辑。然而，这种方法也带来了一个问题：每个模板都需要一个额外的脚本标签，这会使页面变得臃肿。如果你只有少数几个模板，这可能不是问题，但模板数量会迅速增加，从而引发新的可维护性问题。这引出了我们的最终解决方案，该方案使用\
    \ Grunt 来改善 JavaScript 模板的可维护性和可读性。\n\n在这种最终方法中，我们将使用一个 Grunt 插件将模板预编译成单个 JavaScript\
    \ 模板（JST）文件。需要注意的是，在这个解决方案中，我们将从`underscore.js`模板切换到`handlebars.js`。然而，在开始编写模板之前，我们必须先在`Grunt.js`文件中添加一个新插件。本解决方案中使用的插件是`grunt-contrib-handlebars`。[清单4-21](#part0011.html#list21)显示了用于生成\
    \ JST 文件的配置。\n\n[**清单4-21**](#part0011.html#_list21). Grunt 对 `grunt-contrib-handlebars`\
    \ 的配置\n\n```\nhandlebars: {\n    dist: {\n      options: {\n        namespace:\
    \ 'JST',\n        amd: true\n      },\n      files: {\n        'app/js/template.js':\
    \ ['build/templates/**/*.hbs']\n      }\n    }\n  },\n```\n\n上述配置将加载`build/templates`文件夹中的所有模板，并将它们编译成一个\
    \ AMD 模块，输出到`app/js/template.js`。然后，通过将模板模块作为依赖项添加，可以在我们的 AMD 模块中使用这些模板。[清单4-22](#part0011.html#list22)演示了更新后使用新模板模块的视图。\n\
    \n[**清单4-22**](#part0011.html#_list22). 在视图模块中使用模板模块\n\n```\ndefine(['backbone',\
    \ 'js/template'], function(Backbone, Template) {\n  return Backbone.View.extend({\n\
    \ntagName: 'div',\n\nclassName: 'todo-form',\n\ntemplate: Template[\"build/templates/form.hbs\"\
    ],\n\nrender: function() {\n      var title = \"Hello World!\";\n      this.$el.html(\n\
    \        this.template({title: title})\n      );\n    }\n  });\n});\n```\n\n[清单4-20](#part0011.html#list20)和[4-22](#part0011.html#list22)之间的主要区别在于将模板从\
    \ HTML 中移除。这带来了两个好处：首先，它减少了需要管理 HTML 中哪些模板的问题。对于具有许多模板且每个页面都需要这些模板的复杂应用程序来说，这是一个问题。将模板从\
    \ HTML 中移除也减少了初始页面加载的数据量，这对加载时性能很有好处。模板被编译到 JavaScript 应用程序代码中并在生产环境中压缩，这进一步提高了性能。第二个好处是，通过将每个单独的模板放在一个单独的文件中，实现了分离。这使维护更加容易，因为你可以专注于一个特定的模板，而不必担心影响其他模板。[清单4-23](#part0011.html#list23)显示了一个示例模板。\n\
    \n[**清单4-23**](#part0011.html#_list23). 保存在 `build/templates/form.hbs` 中的示例模板\n\
    \n```\n<h1>{{title}}</h1>\n```\n\n要在项目中使用`handlebars`，我们还必须使用`bower`添加它。添加后，`grunt-bower-requirejs`会包含非\
    \ AMD 版本的`handlebars`库。因此，我们必须添加一个`shim`，以便`require.js`将其导出为全局变量。[清单4-24](#part0011.html#list24)演示了添加到`paths.js`和`Gruntfile.js`中的`shim`。\n\
    \n[**清单4-24**](#part0011.html#_list24). 修改后的 `handlebar.js` 配置\n\n```\n// paths.js\n\
    requirejs.config({\n  shim: {\n    handlebars: {\n      exports: 'Handlebars'\n\
    \    }\n  },\n  paths: {\n    backbone: 'bower_components/backbone/backbone',\n\
    \    bootstrap: 'bower_components/bootstrap/dist/js/bootstrap',\n    jquery: 'bower_components/jquery/dist/jquery',\n\
    \    requirejs: 'bower_components/requirejs/require',\n    underscore: 'bower_components/underscore/underscore',\n\
    \    handlebars: 'bower_components/handlebars/handlebars'\n  },\n  packages: [\n\
    \n]\n});\n\n// Gruntfile.js\n\nrequirejs: {\n      dist: {\n        options: {\n\
    \          baseUrl: 'app',\n          name: '../.tmp/concat/js/main',\n      \
    \    out: 'dist/js/main.js',\n          optimize: 'uglify2',\n          mainConfig:\
    \ 'app/js/paths.js',\n          shim: {\n            handlebars: {\n         \
    \     exports: 'Handlebars'\n            }\n          },\n          paths: {\n\
    \            backbone: 'bower_components/backbone/backbone',\n            bootstrap:\
    \ 'bower_components/bootstrap/dist/js/bootstrap',\n            jquery: 'bower_components/jquery/dist/jquery',\n\
    \            requirejs: 'bower_components/requirejs/require',\n            underscore:\
    \ 'bower_components/underscore/underscore',\n            handlebars: 'bower_components/handlebars/handlebars'\n\
    \          }\n        }\n      }\n    },\n```\n\n本节关于 JavaScript 模板化的内容到此结束。你已经了解了如何创建、编译和优化用于生产环境的模板。我介绍了`handlebars.js`的使用；然而，还有许多其他可用的模板化选项。另一个流行的模板引擎是\
    \ `Jade`，通常与 `Express` 框架一起使用。\n\n## JavaScript Linting\n\n在上一章中，我讨论了使用 RECESS（一个来自\
    \ Twitter 的 CSS lint 工具）来确保项目中的 CSS 符合一组样式规则并检测常见错误。在本节中，我们将探讨如何将 JSHint 与 Grunt\
    \ 结合使用，以自动化 JavaScript 的 linting 过程。JSHint 是一个社区驱动的代码质量工具，用于检测 JavaScript 应用程序中的错误和潜在问题。它帮助团队标准化其\
    \ JavaScript 编码风格。JSHint 是 JSLint 的一个分支，比其父项目更少一些“固执己见”。JSHint 还为开发者提供设置标志以启用和禁用某些规则的能力。自\
    \ 2011 年发布以来，JSHint 已被 Facebook、Twitter 和 jQuery 等公司的工程师采用。\n\n幸运的是，有一个现有的插件可以将\
    \ JSHint 集成到我们的 Grunt 工作流中。这个名为`grunt-contrib-plugin`的插件是核心插件之一。[清单4-25](#part0011.html#list25)演示了为\
    \ JSHint 配置的更新后的`Gruntfile.js`。\n\n[**清单4-25**](#part0011.html#_list25). JSHint\
    \ 的配置\n\n```\njshint: {\n  dist: {\n    src: ['Gruntfile.js', 'app/js/**/*.js']\n\
    \  }\n}\n\n// These plugins provide necessary tasks.\ngrunt.loadNpmTasks('grunt-contrib-jshint');\n\
    \n// Default task.\ngrunt.registerTask('default', [\n  'clean',\n  'useminPrepare',\n\
    \  'sass',\n  'bowerInstall',\n  'autoprefixer',\n  'jshint',\n  'handlebars',\n\
    \  'recess',\n  'uncss',\n  'copy',\n  'cssmin',\n  'concat',\n  'requirejs',\n\
    \  'rev',\n  'usemin'\n]);\n```\n\n如[清单4-25](#part0011.html#list25)所示，将 JSHint\
    \ 集成到现有工作流中非常简单。`grunt-contrib-jshint`插件只需要一组要分析的源文件。注意任务运行的顺序很重要，`jshint`在`handlebars`任务之前执行，因为`handlebars`任务的输出不会通过所有\
    \ JSHint 规则。[图4-5](#part0011.html#Fig5)显示了一个示例 Grunt 配置，其中`jshint`和`handlebars`任务的顺序被颠倒了。\n\
    \n![9781484200148_Fig04-05.jpg](images/00029.jpeg)\n\n[图4-5](#part0011.html#_Fig5).\
    \ 颠倒任务顺序会导致错误"
  raw: 'The key difference between this solution and the first two is the method used
    to load the template content. Instead of storing the template within the JavaScript
    application code, the template has been shifted to the DOM. The template content
    is loaded by using document.getElementById to pass the template content to the
    template function. This resolves the issue of maintaining more complex templates,
    as the templates are far more readable, because the tags can be edited as any
    other HTML template. However, this approach does introduce the issue of your page
    being bloated with additional script tags, one for each template. This may not
    be an issue if you have a few templates, but it can quickly escalate and introduce
    a new maintainability concern. This leads nicely to our final solution, which
    uses Grunt to improve maintainability and readability of our JavaScript templates.


    In this final approach, we will use a Grunt plug-in to pre-compile the templates
    into a single JavaScript template (JST) file. It is important to note that in
    this solution, we will switch from the underscore.js template to handlebars.js.
    Before we can start writing templates, however, we must add a new plug-in to the
    Grunt.js file. The plug-in that will be using in this solution is grunt-contrib-handlebars.
    [Listing 4-21](#part0011.html#list21) shows the configuration that will be used
    to generate the JST file.


    [***Listing 4-21***](#part0011.html#_list21). Grunt Configuration for grunt-contrib-handlebars


    ```

    handlebars: {

        dist: {

          options: {

            namespace: ''JST'',

            amd: true

          },

          files: {

            ''app/js/template.js'': [''build/templates/**/*.hbs'']

          }

        }

      },

    ```


    The preceding configuration will load all templates from the build/templates folder
    and compile them into a single AMD module that is output to app/js/template.js.
    This will then allow the templates to be used within our AMD modules, by adding
    the template module as a dependency. [Listing 4-22](#part0011.html#list22) demonstrates
    the view, updated to use the new template module.


    [***Listing 4-22***](#part0011.html#_list22). Using the Template Module Within
    the View Module


    ```

    define([''backbone'', ''js/template''], function(Backbone, Template) {

      return Backbone.View.extend({


    tagName: ''div'',


    className: ''todo-form'',


    template: Template["build/templates/form.hbs"],


    render: function() {

          var title = "Hello World!";

          this.$el.html(

            this.template({title: title})

          );

        }

      });

    });

    ```


    The primary difference between [Listings 4-20](#part0011.html#list20) and [4-22](#part0011.html#list22)
    is removal of the template from HTML. This brings two benefits, the first being
    that we reduce the problem of managing which templates to include within the HTML.
    This is a problem for complex applications that have many templates and many pages
    for which templates are needed for every page. Removing the templates from the
    HTML also reduces the payload of the initial page load, which is great for load-time
    performance. The templates are compiled into the JavaScript application code and
    compressed in production, which further improves performance. The second benefit
    is the separation that occurs by having each individual template in a separate
    file. This leads to easier maintainence, as you can focus on a particular template
    without worrying about affecting other templates. [Listing 4-23](#part0011.html#list23)
    shows a sample template.


    [***Listing 4-23***](#part0011.html#_list23). Sample Template Saved in build/templates/form.hbs


    ```

    <h1>{{title}}</h1>

    ```


    To use handlebars in the project, we also must add it, using bower. Once added,
    the non-AMD version of the handlebars library is included by grunt-bower-requirejs.
    Therefore, we have to add a shim in order for require.js to export it as a global.
    [Listing 4-24](#part0011.html#list24) demonstrates the shim being added to the
    paths.js and Gruntfile.js.


    [***Listing 4-24***](#part0011.html#_list24). Modified Configuration for handlebar.js


    ```

    // paths.js

    requirejs.config({

      shim: {

        handlebars: {

          exports: ''Handlebars''

        }

      },

      paths: {

        backbone: ''bower_components/backbone/backbone'',

        bootstrap: ''bower_components/bootstrap/dist/js/bootstrap'',

        jquery: ''bower_components/jquery/dist/jquery'',

        requirejs: ''bower_components/requirejs/require'',

        underscore: ''bower_components/underscore/underscore'',

        handlebars: ''bower_components/handlebars/handlebars''

      },

      packages: [


    ]

    });


    // Gruntfile.js


    requirejs: {

          dist: {

            options: {

              baseUrl: ''app'',

              name: ''../.tmp/concat/js/main'',

              out: ''dist/js/main.js'',

              optimize: ''uglify2'',

              mainConfig: ''app/js/paths.js'',

              shim: {

                handlebars: {

                  exports: ''Handlebars''

                }

              },

              paths: {

                backbone: ''bower_components/backbone/backbone'',

                bootstrap: ''bower_components/bootstrap/dist/js/bootstrap'',

                jquery: ''bower_components/jquery/dist/jquery'',

                requirejs: ''bower_components/requirejs/require'',

                underscore: ''bower_components/underscore/underscore'',

                handlebars: ''bower_components/handlebars/handlebars''

              }

            }

          }

        },

    ```


    This concludes the section on JavaScript templating. You have seen how to create,
    compile, and optimize templating for production. I covered the use of handlebars.js;
    however, there are many other templating options available. Another popular templating
    engine is Jade, often used with the Express framework.


    JavaScript Linting


    In the previous chapter, I discussed the use of RECESS, a CSS lint tool from Twitter,
    to ensure that the CSS in our projects conform to a set of styling rules and to
    detect common errors. In this section, we will explore the use of JSHint with
    Grunt to automate the linting of our JavaScript. JSHint is a community-driven
    code-quality tool for detecting errors and potential problems in JavaScript applications.
    It aids teams in standardizing their JavaScript coding styles. JSHint is a fork
    of JSLint and is slightly less opinionated than its parent. JSHint also provides
    the ability for developers to set flags to enable and disable certain rules. Since
    its release in 2011, JSHint has been adopted by engineers at Facebook, Twitter,
    and jQuery, to name a few.


    Fortunately, there is an existing plug-in for integrating JSHint into our Grunt
    workflow. The plug-in, one of the core plug-ins, is called grunt-contrib-plugin.
    [Listing 4-25](#part0011.html#list25) demonstrates an updated Gruntfile.js with
    configuration for JSHint.


    [***Listing 4-25***](#part0011.html#_list25). Configuration for JSHint


    ```

    jshint: {

      dist: {

        src: [''Gruntfile.js'', ''app/js/**/*.js'']

      }

    }


    // These plugins provide necessary tasks.

    grunt.loadNpmTasks(''grunt-contrib-jshint'');


    // Default task.

    grunt.registerTask(''default'', [

      ''clean'',

      ''useminPrepare'',

      ''sass'',

      ''bowerInstall'',

      ''autoprefixer'',

      ''jshint'',

      ''handlebars'',

      ''recess'',

      ''uncss'',

      ''copy'',

      ''cssmin'',

      ''concat'',

      ''requirejs'',

      ''rev'',

      ''usemin''

    ]);

    ```


    As [Listing 4-25](#part0011.html#list25) demonstrates, to integrate JSHint into
    our existing workflow is very simple. The grunt-contrib-jshint plug-in only requires
    a set of source files to analyze. It is important to note the order in which the
    tasks are run, jshint being executed before the handlebars task, as the output
    from the handlebars task will not pass all the JSHint rules. [Figure 4-5](#part0011.html#Fig5)
    shows a sample Grunt configuration in which the ordering of the jshint and handlebars
    tasks has been reversed.


    ![9781484200148_Fig04-05.jpg](images/00029.jpeg)


    [Figure 4-5](#part0011.html#_Fig5). Reversing the ordering of tasks leads to errors'
  trans: "\n该解决方案与前两个方案的关键区别在于加载模板内容的方法。模板不再存储在 JavaScript 应用程序代码中，而是迁移到了 DOM 中。通过使用`document.getElementById`将模板内容传递给模板函数来加载模板内容。这解决了维护更复杂模板的问题，因为模板的可读性大大提高，其标签可以像其他任何\
    \ HTML 模板一样进行编辑。然而，这种方法也带来了一个问题：每个模板都需要一个额外的脚本标签，这会使页面变得臃肿。如果你只有少数几个模板，这可能不是问题，但模板数量会迅速增加，从而引发新的可维护性问题。这引出了我们的最终解决方案，该方案使用\
    \ Grunt 来改善 JavaScript 模板的可维护性和可读性。\n\n在这种最终方法中，我们将使用一个 Grunt 插件将模板预编译成单个 JavaScript\
    \ 模板（JST）文件。需要注意的是，在这个解决方案中，我们将从`underscore.js`模板切换到`handlebars.js`。然而，在开始编写模板之前，我们必须先在`Grunt.js`文件中添加一个新插件。本解决方案中使用的插件是`grunt-contrib-handlebars`。清单\
    \ 4-21 显示了用于生成 JST 文件的配置。\n\n**清单 4-21**. Grunt 对 `grunt-contrib-handlebars` 的配置\n\
    \n```\nhandlebars: {\n    dist: {\n      options: {\n        namespace: 'JST',\n\
    \        amd: true\n      },\n      files: {\n        'app/js/template.js': ['build/templates/**/*.hbs']\n\
    \      }\n    }\n  },\n```\n\n上述配置将加载`build/templates`文件夹中的所有模板，并将它们编译成一个 AMD\
    \ 模块，输出到`app/js/template.js`。然后，通过将模板模块作为依赖项添加，可以在我们的 AMD 模块中使用这些模板。清单 4-22 演示了更新后使用新模板模块的视图。\n\
    \n**清单 4-22**. 在视图模块中使用模板模块\n\n```\ndefine(['backbone', 'js/template'], function(Backbone,\
    \ Template) {\n  return Backbone.View.extend({\n\ntagName: 'div',\n\nclassName:\
    \ 'todo-form',\n\ntemplate: Template[\"build/templates/form.hbs\"],\n\nrender:\
    \ function() {\n      var title = \"Hello World!\";\n      this.$el.html(\n  \
    \      this.template({title: title})\n      );\n    }\n  });\n});\n```\n\n清单 4-20\
    \ 和 4-22 之间的主要区别在于将模板从 HTML 中移除。这带来了两个好处：首先，它减少了需要管理 HTML 中哪些模板的问题。对于具有许多模板且每个页面都需要这些模板的复杂应用程序来说，这是一个问题。将模板从\
    \ HTML 中移除也减少了初始页面加载的数据量，这对加载时性能很有好处。模板被编译到 JavaScript 应用程序代码中并在生产环境中压缩，这进一步提高了性能。第二个好处是，通过将每个单独的模板放在一个单独的文件中，实现了分离。这使维护更加容易，因为你可以专注于一个特定的模板，而不必担心影响其他模板。清单\
    \ 4-23 显示了一个示例模板。\n\n**清单 4-23**. 保存在 `build/templates/form.hbs` 中的示例模板\n\n```\n\
    <h1>{{title}}</h1>\n```\n\n要在项目中使用`handlebars`，我们还必须使用`bower`添加它。添加后，`grunt-bower-requirejs`会包含非\
    \ AMD 版本的`handlebars`库。因此，我们必须添加一个`shim`，以便`require.js`将其导出为全局变量。清单 4-24 演示了添加到`paths.js`和`Gruntfile.js`中的`shim`。\n\
    \n**清单 4-24**. 修改后的 `handlebar.js` 配置\n\n```\n// paths.js\nrequirejs.config({\n\
    \  shim: {\n    handlebars: {\n      exports: 'Handlebars'\n    }\n  },\n  paths:\
    \ {\n    backbone: 'bower_components/backbone/backbone',\n    bootstrap: 'bower_components/bootstrap/dist/js/bootstrap',\n\
    \    jquery: 'bower_components/jquery/dist/jquery',\n    requirejs: 'bower_components/requirejs/require',\n\
    \    underscore: 'bower_components/underscore/underscore',\n    handlebars: 'bower_components/handlebars/handlebars'\n\
    \  },\n  packages: [\n\n]\n});\n\n// Gruntfile.js\n\nrequirejs: {\n      dist:\
    \ {\n        options: {\n          baseUrl: 'app',\n          name: '../.tmp/concat/js/main',\n\
    \          out: 'dist/js/main.js',\n          optimize: 'uglify2',\n         \
    \ mainConfig: 'app/js/paths.js',\n          shim: {\n            handlebars: {\n\
    \              exports: 'Handlebars'\n            }\n          },\n          paths:\
    \ {\n            backbone: 'bower_components/backbone/backbone',\n           \
    \ bootstrap: 'bower_components/bootstrap/dist/js/bootstrap',\n            jquery:\
    \ 'bower_components/jquery/dist/jquery',\n            requirejs: 'bower_components/requirejs/require',\n\
    \            underscore: 'bower_components/underscore/underscore',\n         \
    \   handlebars: 'bower_components/handlebars/handlebars'\n          }\n      \
    \  }\n      }\n    },\n```\n\n本节关于 JavaScript 模板化的内容到此结束。你已经了解了如何创建、编译和优化用于生产环境的模板。我介绍了`handlebars.js`的使用；然而，还有许多其他可用的模板化选项。另一个流行的模板引擎是\
    \ `Jade`，通常与 `Express` 框架一起使用。\n\n## JavaScript 代码检查\n\n在上一章中，我讨论了使用 RECESS（一个来自\
    \ Twitter 的 CSS 检查工具）来确保项目中的 CSS 符合一组样式规则并检测常见错误。在本节中，我们将探讨如何将 JSHint 与 Grunt\
    \ 结合使用，以自动化 JavaScript 代码检查过程。JSHint 是一个社区驱动的代码质量工具，用于检测 JavaScript 应用程序中的错误和潜在问题。它帮助团队标准化其\
    \ JavaScript 编码风格。JSHint 是 JSLint 的一个分支，比其父项目更少一些“固执己见”。JSHint 还为开发者提供设置标志以启用和禁用某些规则的能力。自\
    \ 2011 年发布以来，JSHint 已被 Facebook、Twitter 和 jQuery 等公司的工程师采用。\n\n幸运的是，有一个现有的插件可以将\
    \ JSHint 集成到我们的 Grunt 工作流中。这个名为`grunt-contrib-plugin`的插件是核心插件之一。清单 4-25 演示了为 JSHint\
    \ 配置的更新后的`Gruntfile.js`。\n\n**清单 4-25**. JSHint 的配置\n\n```\njshint: {\n  dist:\
    \ {\n    src: ['Gruntfile.js', 'app/js/**/*.js']\n  }\n}\n\n// These plugins provide\
    \ necessary tasks.\ngrunt.loadNpmTasks('grunt-contrib-jshint');\n\n// Default\
    \ task.\ngrunt.registerTask('default', [\n  'clean',\n  'useminPrepare',\n  'sass',\n\
    \  'bowerInstall',\n  'autoprefixer',\n  'jshint',\n  'handlebars',\n  'recess',\n\
    \  'uncss',\n  'copy',\n  'cssmin',\n  'concat',\n  'requirejs',\n  'rev',\n \
    \ 'usemin'\n]);\n```\n\n如清单 4-25 所示，将 JSHint 集成到现有工作流中非常简单。`grunt-contrib-jshint`插件只需要一组要分析的源文件。注意任务运行的顺序很重要，`jshint`在`handlebars`任务之前执行，因为`handlebars`任务的输出不会通过所有\
    \ JSHint 规则。图 4-5 显示了一个示例 Grunt 配置，其中`jshint`和`handlebars`任务的顺序被颠倒了。\n\n![9781484200148_Fig04-05.jpg](img/00029.jpeg)\n\
    \n图 4-5. 颠倒任务顺序会导致错误\n"
- fmt: "\nWith some applications, you may want to lint the JavaScript included via\
    \ `bower`. This may produce errors, as highlighted in [Figure 4-5](#part0011.html#Fig5),\
    \ which can be resolved by modifying the rules applied by `JSHint`. There are\
    \ three approaches to modifying the ruleset applied by `JSHint` while integrating\
    \ with `Grunt`. The first option is to apply the configuration via `Grunt` options;\
    \ the second is to use a `.jshintrc` file; and the last option is to define your\
    \ rulesets within your `package.json`. The first option is useful when you have\
    \ to apply configuration via rulesets for different source files. For example,\
    \ you can apply one set of rules for your application code while another set of\
    \ libraries is developed by others. [Listing 4-26](#part0011.html#list26) demonstrates\
    \ this first approach.\n\n[***Listing 4-26***](#part0011.html#_list26). Configuration\
    \ Containing Options\n\n```\njshint: {\n  dist: {\n    src: ['Gruntfile.js', 'app/js/**/*.js']\n\
    \  },\n  bower: {\n    options: {\n      \"eqnull\": true,\n      \"eqeqeq\":\
    \ true,\n      \"laxbreak\": true,\n    },\n    src: ['app/bower_components/handlebars/handlebars.js']\n\
    \  }\n}\n```\n\nIn [Listing 4-26](#part0011.html#list26), the `Grunt` configuration\
    \ has been extended to cover the `handlebars` library included by `bower`. As\
    \ `handlebars` will not pass all of `JSHint` rules, options have been added to\
    \ relax certain rules. In this case, the rules for null equality, triple equals,\
    \ and line breaks have been suppressed. [Figure 4-6](#part0011.html#Fig6) shows\
    \ the output from the preceding task if these particular rules are not suppressed.\n\
    \n![9781484200148_Fig04-06.jpg](images/00030.jpeg)\n\n[Figure 4-6](#part0011.html#_Fig6).\
    \ Handlebars failing JSHint rules\n\nAnother alternative approach to relaxing\
    \ `JSHint` rules is to apply global runtime configuration. This requires creating\
    \ a new file in the root of your project. This file should be named `.jshintrc`,\
    \ and the contents should be formatted as valid JSON. The JSON object should contain\
    \ a set of rules to be suppressed. An example of this is presented in [Listing\
    \ 4-27](#part0011.html#list27). For `JSHint` to use this file, the `Grunt` configuration\
    \ requires an additional option setting. This option is `jshintrc`, which can\
    \ either be set to `true` or as a path to a `jshintrc` file. In a case wherein\
    \ you have options set within your `Grunt` file and a `.jshintrc`, the rulesets\
    \ are not merged, and the `jshintrc` file configuration is used instead of the\
    \ `Gruntfile` configuration.\n\n[***Listing 4-27***](#part0011.html#_list27).\
    \ JSHint Runtime Configuration\n\n```\n{\n  \"eqnull\": true,\n  \"eqeqeq\": true,\n\
    \  \"laxbreak\": true\n}\n```\n\nThe final approach is similar to the use of a\
    \ `.jshintrc` file. The modifications to be made to the ruleset are declared in\
    \ the project's `package.json` under the property `jshintConfig`.\n\n## Modernizr\n\
    \n`Modernizr` is a popular feature-detection library written in JavaScript for\
    \ determining which features from HTML5 and CSS3 specifications are available\
    \ in the browser. It has become hugely popular within the development community,\
    \ as it allows designers and developers to utilize the latest web technologies\
    \ while ensuring that a good experience can be maintained for users with browsers\
    \ that are lagging behind. `Modernizr` is a great tool to add to your toolbelt,\
    \ especially when implementing progressive enhancements.\n\n`Modernizr` runs quickly\
    \ within the page, generating a JavaScript object and adding classes to the HTML\
    \ element of the page that act as hooks within your CSS. [Listing 4-28](#part0011.html#list28)\
    \ demonstrates the use of the JavaScript object generated, while [Listing 4-29](#part0011.html#list29)\
    \ shows how `Modernizr` adds CSS classes to the HTML element.\n\n[***Listing 4-28***](#part0011.html#_list28).\
    \ Using Modernizr JavaScript to Detect localStorage\n\n```\nif (Modernizr.localstorage)\
    \ {\n  // use localstorage\n} else {\n  // use alternative storage\n}\n```\n\n\
    [***Listing 4-29***](#part0011.html#_list29). Modernizr Modifies HTML Elements,\
    \ Providing Easy Hooks Within CSS\n\n```\n<html lang=\"en\" class=\"js no-touch\
    \ postmessage history multiplebgs boxshadow opacity cssanimations csscolumns cssgradients\
    \ csstransforms csstransitions fontface localstorage sessionstorage svg inlinesvg\
    \ no-blobbuilder blob bloburls download formdata\">\n```\n\nThe `Modernizr` team\
    \ has produced a `Grunt` plug-in that mirrors the functionality of their `Modulizr`.\
    \ The `grunt-modernizr` plug-in processes your JavaScript, CSS, and SCSS files\
    \ to build an optimized version for your project. The optimized version of `Modernizr`\
    \ will only contain tests for the features you use within your project. This helps\
    \ to reduce the overall size of the JavaScript used in the production version\
    \ of your applications, thereby reducing the page load time. [Listing 4-30](#part0011.html#list30)\
    \ shows a modified `Gruntfile` configuration for the `grunt-modernizr` plug-in.\n\
    \n[***Listing 4-30***](#part0011.html#_list30). Gruntfile Configuration for grunt-modernizr\n\
    \n```\nmodernizr: {\n   dist: {\n     devFile : \"remote\",\n     outputFile :\
    \ \"app/js/modernizr.js\",\n     extra : {\n       shiv : true,\n       load :\
    \ false,\n       cssclasses : true\n     },\n     uglify : true,\n     parseFiles\
    \ : true,\n     files : {\n       src: [\"build/styles/**/*.scss\", \"app/js/**/*.js\"\
    ]\n     }\n   }\n }\n```\n\nThe `grunt-modernizr` plug-in requires a development\
    \ version of `Modernizr`, in order to produce an optimized version. In [Listing\
    \ 4-30](#part0011.html#list30), the option `devFile` is set to `remote`. This\
    \ option is used to prevent false positives as the task runs. For example, if\
    \ you had a local version of `Modernizr` installed and ran the task, there would\
    \ be the potential for the file to be processed by the task, leading to an unoptimized\
    \ version of `Modernizr` being generated. The next option, `outputFile`, tells\
    \ the task where the optimized version of `Modernizr` should be output. The next\
    \ option is labeled `extra`, which relates to the extras available on the `Modernizr`\
    \ download page. The configuration in [Listing 4-30](#part0011.html#list30) includes\
    \ the `html5shiv` and support for adding CSS classes to the HTML element, while\
    \ explicitly excluding `Modernizr.load`, which is a resource loader. The `parseFiles`\
    \ option, coupled with the `files` option, configures the task to crawl the files\
    \ within the project for references to `Modernizr` features. [Listing 4-31](#part0011.html#list31)\
    \ contains a snippet of JavaScript that will cause the task to include support\
    \ for testing whether the browser has support for `localStorage`.\n\n[***Listing\
    \ 4-31***](#part0011.html#_list31). JavaScript Snippet That Will Trigger the Browser\
    \ to Include Modernizr Test for localStorage\n\n```\nif (Modernizr.localstorage)\
    \ {\n  var item = localStorage.getItem(\"favourite\");\n}\n```\n\nThe next example,\
    \ [Listing 4-32](#part0011.html#list32), demonstrates how the task parses SCSS\
    \ files, to determine which features to detect in the optimized `Modernizr`.\n\
    \n[***Listing 4-32***](#part0011.html#_list32). SCSS File Including a CSS Class\
    \ That Matches Those Found in Modernizr\n\n```\n.profile {\n  .boxshadow {\n \
    \   box-shadow: 0px 0px 10px 1px rgba(0, 0, 0, 0.5);\n  }\n}\n```\n\nNext time\
    \ the task runs, it will find the `boxshadow` class in the SCSS file and include\
    \ the tests for box shadow.\n\n## Minification\n\nSo far in this chapter, we have\
    \ focused heavily on optimizing our JavaScript code to ensure that our application\
    \ is error-free and compressed. Owing to the use of `usemin`, we haven’t had to\
    \ explicitly configure a task to minify, as `usemin` automatically uses `Uglify`\
    \ to minify and obfuscate the JavaScript. We will briefly look at how we can configure\
    \ `Grunt` without the `usemin` task to minify JavaScript files.\n\nA number of\
    \ plug-ins exist for minifying JavaScript. To simplify things, we’ll focus on\
    \ using `Uglify` to minify and then obfuscate our JavaScript. There is a core\
    \ plug-in available for integrating `Uglify` into a `Grunt` workflow. [Listing\
    \ 4-33](#part0011.html#list33) contains a sample configuration for the plug-in\
    \ `grunt-contrib-uglify`.\n"
  raw: 'With some applications, you may want to lint the JavaScript included via bower.
    This may produce errors, as highlighted in [Figure 4-5](#part0011.html#Fig5),
    which can be resolved by modifying the rules applied by JSHint. There are three
    approaches to modifying the ruleset applied by JSHint whilse integrating with
    Grunt. The first opton is to apply the configuration via Grunt options; the second
    is to use a .jshintrc file; and the last option is to define your rulesets within
    your package.json. The first option is useful when you have to apply configuration
    via rulesets for different source files. For example, you can apply one set of
    rules of your application code while another set of libraries is developed by
    others. [Listing 4-26](#part0011.html#list26) demonstrates this first approach.


    [***Listing 4-26***](#part0011.html#_list26). Configuration Containing Options


    ```

    jshint: {

      dist: {

        src: [''Gruntfile.js'', ''app/js/**/*.js'']

      },

      bower: {

        options: {

          "eqnull": true,

          "eqeqeq": true,

          "laxbreak": true,

        },

        src: [''app/bower_components/handlebars/handlebars.js'']

      }

    }

    ```


    In [Listing 4-26](#part0011.html#list26), the Grunt configuration has been extended
    to cover the handlebars library included by bower. As handlebars will not pass
    all of JSHint rules, options have been added to relax certain rules. In this case,
    the rules for null equality, triple equals, and line breaks have been suppressed.
    [Figure 4-6](#part0011.html#Fig6) shows the output from the preceding task if
    these particular rules are not suppressed.


    ![9781484200148_Fig04-06.jpg](images/00030.jpeg)


    [Figure 4-6](#part0011.html#_Fig6). Handlebars failing JSHint rules


    Another alternative approach to relaxing JSHint rules is to apply global runtime
    configuration. This requires creating a new file in the root of your project.
    This file should be named .jshintrc, and the contents should be formatted as valid
    JSON. The JSON object should contain a set of rules to be suppressed. An example
    of this is presented in [Listing 4-27](#part0011.html#list27). For JSHint to use
    this file, the Grunt configuration requires an additional option setting. This
    option is jshintrc, which can either be set to true or as a path to a jshintrc
    file. In a case wherein you have options set within your Grunt file and a .jshintrc,
    the rulesets are not merged, and the jshintrc file configuration is used instead
    of the Gruntfile configuration.


    [***Listing 4-27***](#part0011.html#_list27). JSHint Runtime Configuration


    ```

    {

      "eqnull": true,

      "eqeqeq": true,

      "laxbreak": true

    }

    ```


    The final approach is similar to the use of a .jshintrc file. The modifications
    to be made to the ruleset are declared in the projects package.json under the
    property jshintConfig.


    Modernizr


    Modernizr is a popular feature-detection library written in JavaScript for determining
    which features from HTML5 and CSS3 specifications are available in the browser.
    It has become hugely popular within the development community, as it allows designers
    and developers to utilize the latest web technologies while ensuring that a good
    experience can be maintained for users with browsers that are lagging behind.
    Modernizr is a great tool to add to your toolbelt, especially when implementing
    progressive enhancements.


    Modernizr runs quickly within the page, generating a JavaScript object and adding
    classes to the HTML element of the page that act as hooks within your CSS. [Listing
    4-28](#part0011.html#list28) demonstrates the use of the JavaScript object generated,
    while [Listing 4-29](#part0011.html#list29) shows how Modernizr adds CSS classes
    to the HTML element.


    [***Listing 4-28***](#part0011.html#_list28). Using Modernizr JavaScript to Detect
    localStorage


    ```

    if (Modernizr.localstorage) {

      // use localstorage

    } else {

      // use alternative storage

    }

    ```


    [***Listing 4-29***](#part0011.html#_list29). Modernizr Modifies HTML Elements,
    Providing Easy Hooks Within CSS


    ```

    <html lang="en" class="js no-touch postmessage history multiplebgs boxshadow opacity
    cssanimations csscolumns cssgradients csstransforms csstransitions fontface localstorage
    sessionstorage svg inlinesvg no-blobbuilder blob bloburls download formdata">

    ```


    The Modernizr team has produced a Grunt plug-in that mirrors the functionality
    of their Modulizr. The grunt-modernizr plug-in processes your JavaScript, CSS,
    and SCSS files to build an optimized version for your project. The optimized version
    of Modernizr will only contain tests for the features you use within your project.
    This helps to reduce the overall size of the JavaScript used in the production
    version of your applications, thereby reducing the page load time. [Listing 4-30](#part0011.html#list30)
    shows a modified Gruntfile configuration for the grunt-modernizr plug-in.


    [***Listing 4-30***](#part0011.html#_list30). Gruntfile Configuration for grunt-modernizr


    ```

    modernizr: {

       dist: {

         devFile : "remote",

         outputFile : "app/js/modernizr.js",

         extra : {

           shiv : true,

           load : false,

           cssclasses : true

         },

         uglify : true,

         parseFiles : true,

         files : {

           src: ["build/styles/**/*.scss", "app/js/**/*.js"]

         }

       }

     }

    ```


    The grunt-modernizr plug-in requires a development version of Modernizr, in order
    to produce an optimized version. In [Listing 4-30](#part0011.html#list30), the
    option devFile is set to remote. This option is used to prevent false positives
    as the task runs. For example, if you had a local version of Modernizr installed
    and ran the task, there would be the potential for the file to be processed by
    the task, leading to an unoptimized version of Modernizr being generated. The
    next option, outputFile, tells the task where the optimized version of Modernizr
    should be output. The next option is labeled extra, which relates to the extras
    available on the Modernizr download page. The configuration in [Listing 4-30](#part0011.html#list30)
    includes the html5shiv and support for adding CSS classes to the HTML element,
    while explicitly excluding Modernizr.load, which is a resource loader. The parseFiles
    option, coupled with the files option, configures the task to crawl the files
    within the project for refreshes to Modernizr features. [Listing 4-31](#part0011.html#list31)
    contains a snippet of JavaScript that will cause the task to include support for
    testing whether the brower has support for localStorage.


    [***Listing 4-31***](#part0011.html#_list31). JavaScript Snippet That Will Trigger
    the Browser to Include Modernizr Test for localStorage


    ```

    if (Modernizr.localstorage) {

      var item = localStorage.getItem("favourite");

    }

    ```


    The next example, [Listing 4-32](#part0011.html#list32), demonstrates how the
    task parses SCSS files, to determine which features to detect in the optimized
    Modernizr.


    [***Listing 4-32***](#part0011.html#_list32). SCSS File Including a CSS Class
    That Matches Those Found in Modernizr


    ```

    .profile {

      .boxshadow {

        box-shadow: 0px 0px 10px 1px rgba(0, 0, 0, 0.5);

      }

    }

    ```


    Next time the task runs, it will find the boxshadow class in the SCSS file and
    include the tests for box shadow.


    Minification


    So far in this chapter, we have focused heavily on optimizing our JavaScript code
    to ensure that our application is error-free and compressed. Owing to the use
    of usemin, we haven’t had to explicitly configure a task to minify, as usemin
    automatically uses Uglify to minify and obfuscate the JavaScript. We will briefly
    look at how we can configure Grunt without the usemin task to minify JavaScript
    files.


    A number of plug-ins exist for minifying JavaScript. To simplify things, we’ll
    focus on using Uglify to minify and then obfuscate our JavaScript. There is a
    core plug-in available for integrating Uglify into a Grunt workflow. [Listing
    4-33](#part0011.html#list33) contains a sample configuration for the plug-in grunt-contrib-uglify.'
  trans: "\n\n在某些应用中，你可能希望对通过 `bower` 引入的 JavaScript 进行 lint 检查。这可能会产生如图 4-5 所示的错误，这些问题可以通过修改\
    \ `JSHint` 所应用的规则来解决。在与 `Grunt` 集成的过程中，有三种方法可以修改 `JSHint` 应用的规则集。第一种方法是通过 `Grunt`\
    \ 配置项应用配置；第二种是使用 `.jshintrc` 文件；最后一种是在 `package.json` 中定义规则集。当需要为不同的源文件通过规则集应用配置时，第一种方法非常有用。例如，你可以为你的应用程序代码应用一套规则，而为其他人开发的库应用另一套规则。清单\
    \ 4-26 展示了第一种方法。\n\n***清单 4-26***. 包含配置项的配置\n\n```\njshint: {\n  dist: {\n   \
    \ src: ['Gruntfile.js', 'app/js/**/*.js']\n  },\n  bower: {\n    options: {\n\
    \      \"eqnull\": true,\n      \"eqeqeq\": true,\n      \"laxbreak\": true,\n\
    \    },\n    src: ['app/bower_components/handlebars/handlebars.js']\n  }\n}\n\
    ```\n\n在 清单 4-26 中，`Grunt` 配置已扩展以涵盖由 `bower` 引入的 `handlebars` 库。由于 `handlebars`\
    \ 无法通过所有 `JSHint` 规则，因此添加了配置项以放宽某些规则。在本例中，关于空值相等、三等号和换行符的规则已被抑制。 图 4-6 展示了如果这些特定规则未被抑制时，上述任务产生的输出。\n\
    \n![9781484200148_Fig04-06.jpg](img/00030.jpeg)\n\n图 4-6. Handlebars 未通过 JSHint\
    \ 规则检查\n\n另一种放宽 `JSHint` 规则的方法是应用全局运行时配置。这需要在你的项目根目录下创建一个新文件。该文件应命名为 `.jshintrc`，其内容应格式化为有效的\
    \ JSON。该 JSON 对象应包含一组需要被抑制的规则。清单 4-27 中给出了一个示例。为了让 `JSHint` 使用此文件，`Grunt` 配置需要一个额外的配置项设置。这个配置项是\
    \ `jshintrc`，它可以设置为 `true` 或者一个指向 `jshintrc` 文件的路径。如果你同时在 `Grunt` 文件和 `.jshintrc`\
    \ 文件中设置了配置项，规则集不会合并，而是会使用 `jshintrc` 文件配置来代替 `Gruntfile` 中的配置。\n\n***清单 4-27***.\
    \ JSHint 运行时配置\n\n```\n{\n  \"eqnull\": true,\n  \"eqeqeq\": true,\n  \"laxbreak\"\
    : true\n}\n```\n\n最后一种方法与使用 `.jshintrc` 文件类似。对规则集的修改在项目的 `package.json` 中的 `jshintConfig`\
    \ 属性下声明。\n\n## Modernizr\n\n`Modernizr` 是一个用 JavaScript 编写的流行的特性检测库，用于确定浏览器支持\
    \ HTML5 和 CSS3 规范中的哪些特性。它在开发社区中变得非常流行，因为它允许设计师和开发者利用最新的 Web 技术，同时确保使用落后浏览器的用户也能保持良好的体验。`Modernizr`\
    \ 是一个可以加入你工具箱的优秀工具，尤其是在实现渐进增强时。\n\n`Modernizr` 在页面内快速运行，生成一个 JavaScript 对象，并向页面的\
    \ HTML 元素添加类，这些类在你的 CSS 中充当钩子。清单 4-28 演示了生成的 JavaScript 对象的使用，而清单 4-29 展示了 `Modernizr`\
    \ 如何向 HTML 元素添加 CSS 类。\n\n***清单 4-28***. 使用 Modernizr JavaScript 检测 localStorage\n\
    \n```\nif (Modernizr.localstorage) {\n  // 使用 localstorage\n} else {\n  // 使用替代存储\n\
    }\n```\n\n***清单 4-29***. Modernizr 修改 HTML 元素，在 CSS 中提供方便的钩子\n\n```\n<html lang=\"\
    en\" class=\"js no-touch postmessage history multiplebgs boxshadow opacity cssanimations\
    \ csscolumns cssgradients csstransforms csstransitions fontface localstorage sessionstorage\
    \ svg inlinesvg no-blobbuilder blob bloburls download formdata\">\n```\n\n`Modernizr`\
    \ 团队开发了一个 `Grunt` 插件，其功能与其 `Modulizr` 相似。`grunt-modernizr` 插件会处理你的 JavaScript、CSS\
    \ 和 SCSS 文件，为你的项目构建一个优化版本。优化版本的 `Modernizr` 将只包含你项目中使用的特性的测试。这有助于减少应用程序生产版本中使用的\
    \ JavaScript 的总大小，从而缩短页面加载时间。清单 4-30 展示了为 `grunt-modernizr` 插件修改后的 `Gruntfile`\
    \ 配置。\n\n***清单 4-30***. grunt-modernizr 的 Gruntfile 配置\n\n```\nmodernizr: {\n\
    \   dist: {\n     devFile : \"remote\",\n     outputFile : \"app/js/modernizr.js\"\
    ,\n     extra : {\n       shiv : true,\n       load : false,\n       cssclasses\
    \ : true\n     },\n     uglify : true,\n     parseFiles : true,\n     files :\
    \ {\n       src: [\"build/styles/**/*.scss\", \"app/js/**/*.js\"]\n     }\n  \
    \ }\n }\n```\n\n`grunt-modernizr` 插件需要一个开发版本的 `Modernizr` 来生成优化版本。在清单 4-30 中，`devFile`\
    \ 选项被设置为 `remote`。此选项用于防止任务运行时出现误报。例如，如果你在本地安装了某个版本的 `Modernizr` 并运行该任务，则该文件有可能被该任务处理，从而导致生成了未优化的\
    \ `Modernizr` 版本。下一个选项 `outputFile` 告诉任务优化后的 `Modernizr` 版本应输出到何处。接下来的选项标记为 `extra`，它关联到\
    \ `Modernizr` 下载页面上可用的附加功能。清单 4-30 中的配置包含了 `html5shiv` 以及向 HTML 元素添加 CSS 类的支持，同时明确排除了\
    \ `Modernizr.load`（这是一个资源加载器）。`parseFiles` 选项与 `files` 选项结合使用，配置该任务以爬取项目中引用 `Modernizr`\
    \ 特性的文件。清单 4-31 包含了一段 JavaScript 代码片段，这将导致该任务包含对浏览器是否支持 `localStorage` 的测试。\n\n\
    ***清单 4-31***. 将触发浏览器包含 Modernizr 对 localStorage 测试的 JavaScript 代码片段\n\n```\n\
    if (Modernizr.localstorage) {\n  var item = localStorage.getItem(\"favourite\"\
    );\n}\n```\n\n下一个示例，清单 4-32，演示了该任务如何解析 SCSS 文件，以确定优化版 `Modernizr` 需要检测哪些特性。\n\n\
    ***清单 4-32***. 包含与 Modernizr 中类名相匹配的 CSS 类的 SCSS 文件\n\n```\n.profile {\n  .boxshadow\
    \ {\n    box-shadow: 0px 0px 10px 1px rgba(0, 0, 0, 0.5);\n  }\n}\n```\n\n下次运行该任务时，它会在\
    \ SCSS 文件中找到 `boxshadow` 类，并包含对盒阴影的测试。\n\n## 代码压缩\n\n到目前为止，本章我们重点讨论了优化 JavaScript\
    \ 代码，以确保我们的应用程序没有错误并进行压缩。由于使用了 `usemin`，我们不需要显式配置压缩任务，因为 `usemin` 会自动使用 `Uglify`\
    \ 来压缩和混淆 JavaScript。我们将简要地看一下如何配置 `Grunt`（不使用 `usemin` 任务）来压缩 JavaScript 文件。\n\
    \n存在许多用于压缩 JavaScript 的插件。为简单起见，我们将重点介绍使用 `Uglify` 来压缩并随后混淆我们的 JavaScript。有一个核心插件可用于将\
    \ `Uglify` 集成到 `Grunt` 工作流中。清单 4-33 包含了 `grunt-contrib-uglify` 插件的示例配置。\n\n"
- fmt: "### `grunt-contrib-uglify` 配置\n\n[***Listing 4-33***](#part0011.html#_list33).\
    \ `grunt-contrib-uglify` 配置\n\n```\nuglify: {\n  options: {\n    report: 'gzip'\n\
    \  },\n  dist: {\n    files: {\n      'dist/js/main.js': ['app/js/main.js']\n\
    \    }\n  }\n}\n```\n\n[Listing 4-33](#part0011.html#list33) 中的配置相当简单；它设置了任务生成的报告（涉及大小、节省空间），以及要操作的文件。`report`\
    \ 选项决定了任务的输出。将该选项设置为`gzip`会打印一个额外的大小，该大小表示输出 JavaScript 若经过 gzip 压缩后的大小。除了上述内容，在生产应用程序中合并多个文件也是个好主意。同样，这个任务也可以通过之前的`usemin`任务来执行。通过合并文件，压缩率应该会更高。另外，还有一个核心插件可用来执行此任务：`grunt-contrib-concat`插件可用于将多个文件合并成一个文件。[Listing\
    \ 4-34](#part0011.html#list34) 展示了该任务的示例配置。\n\n### `grunt-contrib-concat` 配置\n\
    \n[***Listing 4-34***](#part0011.html#_list34). `grunt-contrib-concat` 配置\n\n\
    ```\nconcat: {\n  dist: {\n    files: {\n      'dist/js/main.js': ['app/js/**/*.js']\n\
    \    }\n  }\n}\n```\n\n上述配置将合并所有 JavaScript 文件，然后将输出存储到`dist`文件夹。在这个阶段，最好对`concat`任务输出的文件运行`uglify`任务。\n\
    \n### 文档生成\n\n在最后这一节，我们将简要探讨如何使用 Grunt 来自动化生成 JavaScript 应用程序的文档。如果你正在开发供其他开发者使用的库，自动化生成文档非常重要。没有自动化，维护一套完整的文档会变得困难，并且可能导致其他开发者在尝试复用\
    \ JavaScript 库时很快感到沮丧。有一个插件可用于生成文档，即`grunt-jsdoc`。该插件提供了一个`jsdoc`任务，能够生成 HTML\
    \ 格式的文档。[Listing 4-35](#part0011.html#list35) 包含了为项目生成文档的示例配置。\n\n### 生成 HTML\
    \ 文档的 `grunt-jsdoc` 配置\n\n[***Listing 4-35***](#part0011.html#_list35). 用于生成 HTML\
    \ 文档的 `grunt-jsdoc` 配置\n\n```\njsdoc : {\n  dist : {\n    src: ['app/js/**/*.js'],\n\
    \    options: {\n      destination: 'doc'\n    }\n  }\n}\n```\n\n[Listing 4-35](#part0011.html#list35)\
    \ 非常简单：它定义了要解析文档的所有 JavaScript 文件的源，以及一个配置输出目录（文档将在此创建）的选项。要生成文档，需要向我们的 JavaScript\
    \ 模块中添加注解。[Listing 4-36](#part0011.html#list36) 展示了更新了用于生成文档的注解后的待办事项模型。\n\n###\
    \ 带有 JSDoc 注解的待办事项模型（修改版）\n\n[***Listing 4-36***](#part0011.html#_list36). 带有\
    \ JSDoc 注解的修改后的待办事项模型\n\n```\n/**\n * @name Todo\n * @classdesc Todo Model\n *\
    \ @author James Cryer\n * @exports Backbone.Model\n */\ndefine(['backbone'], function(Backbone)\
    \ {\n  return Backbone.Model.extend({\n\n});\n});\n```\n\n[Listing 4-36](#part0011.html#list36)\
    \ 并未提供所有可用注解的详尽列表。除了模块，模块内的单个函数也可以被注解。[Figure 4-7](#part0011.html#Fig7) 展示了为 [Listing\
    \ 4-36](#part0011.html#list36) 中的模块自动生成的文档。\n\n![9781484200148_Fig04-07.jpg](images/00031.jpeg)\n\
    \n[Figure 4-7](#part0011.html#_Fig7). 使用 Grunt 自动生成的 JSDoc 文档\n\n### 总结\n\n在本章中，我介绍了\
    \ Grunt 如何通过使用 JavaScript 模块和模板来优化我们的 JavaScript 工作流。在讨论过程中，我们探讨了与性能相关的话题，以及确保生产版本的\
    \ JavaScript 代码经过优化以便交付给用户。除了这些话题，还介绍了其他工具，例如`JSHint`和`Modernizr`，以进一步增强 JavaScript\
    \ 开发工作流。最后，我以对复杂 JavaScript 应用程序自动生成文档的简要讨论作为结束。\n\n下一章将关注页面可视化元素的工作流，探讨使用 Grunt\
    \ 来自动化处理图像、Web 字体和 SVG 相关的任务。\n\n## 第 5 章\n\n![image](images/00005.jpeg)\n\n#\
    \ 使用 Grunt 处理图像、SVG 和图标\n\n到目前为止，我们已经探索了如何使用 Grunt 来优化处理 HTML、CSS 和 JavaScript。接下来，我们将发现如何将\
    \ Grunt 用于 Web 开发的另一个基本任务：生成视觉资源。自移动革命开始以来，随着 Flash 的衰落和高密度像素显示屏的出现，为生产环境准备视觉资源变得越来越复杂。在本章中，我们将使用\
    \ Grunt 来优化图像，为不同设备生成多个版本，并压缩 SVG 文件。和往常一样，使用 Grunt 会产生一套强大的工具，可以用于多个项目。\n\n###\
    \ 压缩图像\n\n本章我们将讨论的第一个话题是图像优化。在本节中，我们将探讨如何使用 Grunt 来优化图像，使其可供在我们的应用中使用。图像优化是提高现代\
    \ Web 应用加载时性能的重要组成部分，因为图像通常占据页面总大小的重要部分。优化可以在不牺牲图像质量的前提下，减小图像的文件大小。\n\n在 Web 应用中使用图像时，需要考虑多种因素。你需要回答的首要问题是：哪种格式适合你的图像？需要考虑两种格式：矢量图和光栅图。我将在本章后面更深入地讨论矢量图像，届时会回顾如何使用`SVG`（可缩放矢量图形）与\
    \ Grunt 配合。`SVG`是一种矢量格式，可用于生成高度可缩放的图像，而文件大小不会增加。首先，我将重点介绍光栅图像。\n\n光栅图像在 Web 上的使用更为传统，这主要得益于浏览器厂商的支持。光栅图像可以提供多种格式，例如`GIF`、`PNG`或`JPEG`。由于光栅图像的数据以像素网格的形式存储，它们不具备可缩放图像格式的特性。随着图像尺寸的增加，文件大小也会增加。每种光栅图像格式通常用于特定目的。如\
    \ Google 的 Web 基础（[https://developers.google.com/web/fundamentals/media/images/optimize-images-for-performance](https://developers.google.com/web/fundamentals/media/images/optimize-images-for-performance)）所述，`JPEG`图像通常用于摄影，而`PNG`用于纯色图形，例如标志。\n\
    \n正如本书中反复提到的，在开发现代 Web 应用时，加载时性能对于应用的成功至关重要，因为用户对页面加载时间有感知。因此，我们必须努力提供最增强的体验，同时优化页面使其快速加载。由于图像在一般用户体验中扮演着重要角色，我们在开发应用时还必须考虑如何优化这些资源。此处的优化意味着在保证图像质量的前提下，减小图像的文件大小。光栅图像的文件大小可以通过使用应用了无损和有损压缩的工具进行显著缩减。"
  raw: '[***Listing 4-33***](#part0011.html#_list33). Configuration for grunt-contrib-uglify


    ```

    uglify: {

      options: {

        report: ''gzip''

      },

      dist: {

        files: {

          ''dist/js/main.js'': [''app/js/main.js'']

        }

      }

    }

    ```


    The configuration in [Listing 4-33](#part0011.html#list33) is fairly simple; it
    sets the report that the task should generate in terms of size, saving, and the
    files to operate on. The report option determines output from the task. Setting
    the option to gzip will print an additional size, which represents the size of
    the output JavaScript if it was to be compressed with gzip. In addition to the
    preceding, it would be a good idea to contact multiple files for production application.
    Again, this task is performed by the usemin task previously. By combining files,
    the rates of compression should be greater. Again, there is another core plug-in
    available for performing this task. The grunt-contrib-concat plug-in is available
    to concatenate multiple files into a single file. [Listing 4-34](#part0011.html#list34)
    shows a sample configuration for this task.


    [***Listing 4-34***](#part0011.html#_list34). grunt-contrib-concat Configuration


    ```

    concat: {

      dist: {

        files: {

          ''dist/js/main.js'': [''app/js/**/*.js'']

        }

      }

    }

    ```


    The preceding configuration will combine all JavaScript files and then store the
    output to the dist folder. At this stage, it would be a good practice to run the
    Uglify task over the file output from the concat task.


    Documentation


    In this final section, we will briefly explore how Grunt can be used to automate
    the production of documentation for JavaScript applications. Automating the production
    of documentation is important if you are producing libraries for other developers
    to consume. Without automation, the task of maintaining a solid set of documentation
    can become difficult and can lead to other developers becoming rapidly frustrated
    when they try to reuse the JavaScript library. There is a plug-in available for
    producing documentation. Known as grunt-jsdoc, this plug-in makes a jsdoc task
    available that generates documentation in an HTML format. [Listing 4-35](#part0011.html#list35)
    contains a sample configuration for generating documentation for the project.


    [***Listing 4-35***](#part0011.html#_list35). grunt-jsdoc Configuration for Generating
    HTML Documentation


    ```

    jsdoc : {

      dist : {

        src: [''app/js/**/*.js''],

        options: {

          destination: ''doc''

        }

      }

    }

    ```


    [Listing 4-35](#part0011.html#list35) is very simple, as it defines the source
    of all JavaScript files to parse for documentation and an option to configure
    the output directory in which the documentation will be created. To generate documentation,
    annotations have to be added to our JavaScript modules. [Listing 4-36](#part0011.html#list36)
    shows the to-do model updated with some annotations to generate the documentation.


    [***Listing 4-36***](#part0011.html#_list36). Modified To-Do Model with JSDoc
    Annotations


    ```

    /**

     * @name Todo

     * @classdesc Todo Model

     * @author James Cryer

     * @exports Backbone.Model

     */

    define([''backbone''], function(Backbone) {

      return Backbone.Model.extend({


    });

    });

    ```


    [Listing 4-36](#part0011.html#list36) does not provide an exhaustive list of annontations
    that can be used. In addition to modules, individual functions within a module
    can also be annotated. [Figure 4-7](#part0011.html#Fig7) illustrates the generated
    documentated for the module in [Listing 4-36](#part0011.html#list36).


    ![9781484200148_Fig04-07.jpg](images/00031.jpeg)


    [Figure 4-7](#part0011.html#_Fig7). JSDoc documentation automatically generated
    with Grunt


    Summary


    In this chapter, I’ve covered how Grunt can optimize our JavaScript workflow with
    the use of JavaScript modules and templates. As part of this discussion, we’ve
    explored topics concerned with performance and ensuring that the production version
    of the JavaScript code is optimized for delivery to users. In addition to these
    topics, other tools were introduced, such as JSHint and Modernizr, to further
    enhance the development workflow with JavaScript. Finally, I concluded with a
    brief discussion on automating generation of documentation for complex JavaScript
    application.


    The next chapter will focus on the workflow regarding visual elements of page,
    exploring the use of Grunt for automating tasks when working with imagery, web
    fonts, and SVG.


    CHAPTER 5


    ![image](images/00005.jpeg)


    Using Grunt with Images, SVG, and Icons


    So far, we’ve explored how Grunt can be used to optimize working with HTML, CSS,
    and JavaScript. Next, we’ll discover how Grunt can be used with another fundamental
    task of web development: producing visual assets. Since the start of the mobile
    revolution, the fall of Flash, and the emergence of high-density pixel displays,
    preparing visual assets for production has become more and more complicated. In
    this chapter, Grunt will be used to optimize images, producing multiple versions
    for different devices, and to minify SVG files. As always, using Grunt results
    in a powerful set of tools that can be used across many projects.


    Compressing Images


    The first topic that we will review in this chapter is image optimization. In
    this section, we will explore how Grunt can be used to optimize images ready for
    use within our applications. Image optimization is an important part of improving
    load-time performance of modern web applications, as images are typically a significant
    portion of a page’s total weight. Optimization can be used to reduce the file
    size of images, without compromising image quality.


    There are a number of factors to consider when using imagery within a web application.
    The initial question you need to answer is, Which format is correct to use for
    your image? There are two formats to consider: vector and raster images. I will
    discuss vector images in more depth later in this chapter, when reviewing the
    use of SVG (Scalable Vector Graphic) with Grunt. SVG is a vector format that can
    be used to generate highly scalable images, without an increase in file size.
    First, I’ll focus on raster images.


    Raster images have been more traditionally used on the Web, mainly due to browser
    vendor support. Raster images can be served in multiple formats, such as GIF,
    PNG, or JPEG. As the data for raster images are stored as a grid of pixels, they
    do not offer a scalable image format. As the image size increases, the file size
    will also increase. Each raster image format is typically used for a specific
    purpose. As outlined in Google’s Web Fundamentals ([https://developers.google.com/web/fundamentals/media/images/optimize-images-for-performance](https://developers.google.com/web/fundamentals/media/images/optimize-images-for-performance)),
    JPEG images are usually used for photography and PNG for solid color graphics
    such as logos.


    As noted throughout the book, when developing modern web applications, load-time
    performance can be critical to the success of our applications, as users have
    perceptions regarding page load times. Therefore, we must strive to deliver the
    most enhanced experience, while optimizing our pages to load rapidly. As imagery
    can play an important part of the general user experience, we must also consider
    how we can optimize these assets when developing our application. Optimization
    in this context means reducing the file size of the images while not compromising
    on image quality. Raster images can be dramatically reduced in file size, by passing
    them through tools that apply loseless and lossy compression.'
  trans: "\n### `grunt-contrib-uglify` 配置\n\n***清单 4-33***. `grunt-contrib-uglify`\
    \ 配置\n\n```\nuglify: {\n  options: {\n    report: 'gzip'\n  },\n  dist: {\n  \
    \  files: {\n      'dist/js/main.js': ['app/js/main.js']\n    }\n  }\n}\n```\n\
    \n清单 4-33 中的配置相当简单；它设置了任务生成的报告（涉及大小、节省空间），以及要操作的文件。`report` 选项决定了任务的输出。将该选项设置为\
    \ `gzip` 会打印一个额外的大小，该大小表示输出 JavaScript 若经过 gzip 压缩后的大小。除了上述内容，在生产应用程序中合并多个文件也是个好主意。同样，这个任务也可以通过之前的\
    \ `usemin` 任务来执行。通过合并文件，压缩率应该会更高。另外，还有一个核心插件可用来执行此任务：`grunt-contrib-concat` 插件可用于将多个文件合并成一个文件。清单\
    \ 4-34 展示了该任务的示例配置。\n\n### `grunt-contrib-concat` 配置\n\n***清单 4-34***. `grunt-contrib-concat`\
    \ 配置\n\n```\nconcat: {\n  dist: {\n    files: {\n      'dist/js/main.js': ['app/js/**/*.js']\n\
    \    }\n  }\n}\n```\n\n上述配置将合并所有 JavaScript 文件，然后将输出存储到 `dist` 文件夹。在这个阶段，最好对 `concat`\
    \ 任务输出的文件运行 `uglify` 任务。\n\n### 文档生成\n\n在最后这一节，我们将简要探讨如何使用 Grunt 来自动化生成 JavaScript\
    \ 应用程序的文档。如果你正在开发供其他开发者使用的库，自动化生成文档非常重要。没有自动化，维护一套完整的文档会变得困难，并且可能导致其他开发者在尝试复用\
    \ JavaScript 库时很快感到沮丧。有一个插件可用于生成文档，即 `grunt-jsdoc`。该插件提供了一个 `jsdoc` 任务，能够生成 HTML\
    \ 格式的文档。清单 4-35 包含了为项目生成文档的示例配置。\n\n### 生成 HTML 文档的 `grunt-jsdoc` 配置\n\n***清单\
    \ 4-35***. 用于生成 HTML 文档的 `grunt-jsdoc` 配置\n\n```\njsdoc : {\n  dist : {\n    src:\
    \ ['app/js/**/*.js'],\n    options: {\n      destination: 'doc'\n    }\n  }\n\
    }\n```\n\n清单 4-35 非常简单：它定义了要解析文档的所有 JavaScript 文件的源，以及一个配置输出目录（文档将在此创建）的选项。要生成文档，需要向我们的\
    \ JavaScript 模块中添加注解。清单 4-36 展示了更新了用于生成文档的注解后的待办事项模型。\n\n### 带有 JSDoc 注解的待办事项模型（修改版）\n\
    \n***清单 4-36***. 带有 JSDoc 注解的修改后的待办事项模型\n\n```\n/**\n * @name Todo\n * @classdesc\
    \ Todo Model\n * @author James Cryer\n * @exports Backbone.Model\n */\ndefine(['backbone'],\
    \ function(Backbone) {\n  return Backbone.Model.extend({\n\n});\n});\n```\n\n\
    清单 4-36 并未提供所有可用注解的详尽列表。除了模块，模块内的单个函数也可以被注解。图 4-7 展示了为 清单 4-36 中的模块自动生成的文档。\n\n\
    ![9781484200148_Fig04-07.jpg](img/00031.jpeg)\n\n图 4-7. 使用 Grunt 自动生成的 JSDoc 文档\n\
    \n### 总结\n\n在本章中，我介绍了 Grunt 如何通过使用 JavaScript 模块和模板来优化我们的 JavaScript 工作流。在讨论过程中，我们探讨了与性能相关的话题，以及确保生产版本的\
    \ JavaScript 代码经过优化以便交付给用户。除了这些话题，还介绍了其他工具，例如 `JSHint` 和 `Modernizr`，以进一步增强 JavaScript\
    \ 开发工作流。最后，我以对复杂 JavaScript 应用程序自动生成文档的简要讨论作为结束。\n\n下一章将关注页面可视化元素的工作流，探讨使用 Grunt\
    \ 来自动化处理图像、Web 字体和 SVG 相关的任务。\n\n## 第 5 章\n\n![image](img/00005.jpeg)\n\n# 使用\
    \ Grunt 处理图像、SVG 和图标\n\n到目前为止，我们已经探索了如何使用 Grunt 来优化处理 HTML、CSS 和 JavaScript。接下来，我们将发现如何将\
    \ Grunt 用于 Web 开发的另一个基本任务：生成视觉资源。自移动革命开始以来，随着 Flash 的衰落和高密度像素显示屏的出现，为生产环境准备视觉资源变得越来越复杂。在本章中，我们将使用\
    \ Grunt 来优化图像，为不同设备生成多个版本，并压缩 SVG 文件。和往常一样，使用 Grunt 会产生一套强大的工具，可以用于多个项目。\n\n###\
    \ 压缩图像\n\n本章我们将讨论的第一个话题是图像优化。在本节中，我们将探讨如何使用 Grunt 来优化图像，使其可供在我们的应用中使用。图像优化是提高现代\
    \ Web 应用加载时性能的重要组成部分，因为图像通常占据页面总大小的重要部分。优化可以在不牺牲图像质量的前提下，减小图像的文件大小。\n\n在 Web 应用中使用图像时，需要考虑多种因素。你需要回答的首要问题是：哪种格式适合你的图像？需要考虑两种格式：矢量图和光栅图。我将在本章后面更深入地讨论矢量图像，届时会回顾如何使用\
    \ `SVG`（可缩放矢量图形）与 Grunt 配合。`SVG` 是一种矢量格式，可用于生成高度可缩放的图像，而文件大小不会增加。首先，我将重点介绍光栅图像。\n\
    \n光栅图像在 Web 上的使用更为传统，这主要得益于浏览器厂商的支持。光栅图像可以提供多种格式，例如 `GIF`、`PNG` 或 `JPEG`。由于光栅图像的数据以像素网格的形式存储，它们不具备可缩放图像格式的特性。随着图像尺寸的增加，文件大小也会增加。每种光栅图像格式通常用于特定目的。如\
    \ Google 的 Web 基础（[`developers.google.com/web/fundamentals/media/images/optimize-images-for-performance`](https://developers.google.com/web/fundamentals/media/images/optimize-images-for-performance)）所述，`JPEG`\
    \ 图像通常用于摄影，而 `PNG` 用于纯色图形，例如标志。\n\n正如本书中反复提到的，在开发现代 Web 应用时，加载时性能对于应用的成功至关重要，因为用户对页面加载时间有感知。因此，我们必须努力提供最增强的体验，同时优化页面使其快速加载。由于图像在一般用户体验中扮演着重要角色，我们在开发应用时还必须考虑如何优化这些资源。此处的优化意味着在保证图像质量的前提下，减小图像的文件大小。光栅图像的文件大小可以通过使用应用了无损和有损压缩的工具进行显著缩减。\n"
- fmt: "# Loseless Compression and Lossy Compression\n\nLoseless compression takes\
    \ its name from the fact that the original file can be re-created exactly; nothing\
    \ is stripped from the file. Loseless compression is based on the concept of splitting\
    \ the file into smaller parts, for transmission and/or storage. Lossy compression\
    \ applies a different principle. With this form of compression, data is removed\
    \ from the image, and the output cannot be used to re-create the original file.\
    \ `Grunt` can be used to automate the use of these compression files within your\
    \ application and also to report the percentage reduction of the file size for\
    \ each image.\n\nIn this section, we will introduce a new plug-in: `grunt-contrib-imagemin`.\
    \ This adds support for compressing GIF, JPEG, PNG, and SVG formats. For now,\
    \ we will explore the use of this plug-in for raster images only. Let’s start\
    \ first by adding the new plug-in to our project (see [Listing 5-1](#part0012.html#list1)).\n\
    \n[***Listing 5-1***](#part0012.html#_list1). Adding `grunt-contrib-imagemin`\
    \ to `package.json` Using `npm`\n\n```\nnpm install grunt-contrib-imagemin –-save-dev\n\
    ```\n\nNow that the plug-in has been installed for the project, next we must configure\
    \ the plug-in to find our images and optimize each one. [Listing 5-2](#part0012.html#list2)\
    \ demonstrates a sample `Gruntfile` configuration for the newly added plug-in.\n\
    \n[***Listing 5-2***](#part0012.html#_list2). `Gruntfile` Configuration for `grunt-contrib-imagemin`\n\
    \n```\n...\nimagemin: {\n  app: {\n    options: {\n      optimizationLevel: 6,\n\
    \      progressive: true,\n      use: [pngquant()]\n    },\n    files: [{\n  \
    \    expand: true,\n      cwd: 'src/',\n      src: ['**/*.{png,jpg,gif}'],\n \
    \     dest: 'dist/'\n    }]\n  }\n}\n...\n```\n\nThe options defined in the configuration\
    \ within [Listing 5-2](#part0012.html#list2) set the level of optimization to\
    \ 6, conversion of JPEG compression to progressive, and, finally, the use of a\
    \ plug-in known as `pngquant`. Let’s explore each of these options individually.\n\
    \nWe set an option known as `optimizationLevel` to the value of 6. The `optimizationLevel`\
    \ option controls how many trials are run to compress the IDAT chunks of PNG images.\
    \ This is primarily a feature of the PNG compression tool included with the plug-in,\
    \ known as `optipng`. IDAT chunks are essentially the image data for a PNG file.\
    \ The more trials run, the longer the compression will take, as more effort is\
    \ needed as `optipng` attempts to find the optimal trial. Each trial will attempt\
    \ to use a series of compression technics to reduce the file in size, without\
    \ affecting the image quality. This option accepts values from 0 to 7. A value\
    \ of 0 means that no compression is applied to the files, and with a value of\
    \ 7, 240 trials will be run in an attempt to reduce the image in size.\n\nThe\
    \ `progressive` option allows us to affect how `jpegtran`, the JPEG compression\
    \ tool used by `grunt-contrib-imagemin`, is used. The `progressive` option can\
    \ either be enabled or disabled. When this option is enabled with the value of\
    \ `true`, the resulting JPEG file will be in a progressive JPEG format. Progressive\
    \ JPEGs render, as the name suggests, progressively. This means a low-quality\
    \ version is initially visible, then, as more data is received over the network,\
    \ the image quality will gradually improve. Progressive JPEGs can also boost better\
    \ compression rates, if the original image is larger than approximately 30KB,\
    \ studies have shown ([http://calendar.perfplanet.com/2012/progressive-jpegs-a-new-best-practice/](http://calendar.perfplanet.com/2012/progressive-jpegs-a-new-best-practice/)).\n\
    \nThe final option we will look at is the `use` option. This allows the `grunt-contrib-imagemin`\
    \ plug-in to be configured to use other `imagemin` plug-ins. `Grunt-contrib-imagemin`\
    \ wraps the NodeJS module `imagemin`; therefore, any `imagemin` plug-in can be\
    \ used with the plug-in as well. Altogether, there are ten plug-ins that can be\
    \ used with `imagemin`. Each plug-in allows `grunt-contrib-imagemin` to use a\
    \ series of compression tools. In our example, we’ve configured `grunt-contrib-imagemin`\
    \ to use `pngquant`.\n\nBefore moving on to the next topic in this chapter, let’s\
    \ view a sample output for `grunt-contrib-imagemin` (see [Figure 5-1](#part0012.html#Fig1)).\
    \ For this, we will add two new images to the project. One can be a large background\
    \ image in a JPEG format and the other a delete icon that is a PNG image.\n\n\
    ![9781484200148_Fig05-01.jpg](images/00032.jpeg)\n\n[Figure 5-1](#part0012.html#_Fig1).\
    \ `grunt-contrib-imagemin` sample output\n\nAs shown in [Figure 5-1](#part0012.html#Fig1),\
    \ `grunt-contrib-imagemin` lists every file that is processed. For each file processed,\
    \ the file source, the total size saved, and the percentage reduction are output.\
    \ Finally, the total number is processed with the total reduction. Although image\
    \ compression is an important part of an application build process, it does not\
    \ tackle the problem of serving images for responsive sites. In the next section,\
    \ we will use `Grunt` to prepare our imagery that is optimized for various breakpoints.\n\
    \n# Producing Responsive Images\n\nAs discussed previously, the growth in the\
    \ use of mobile devices is staggering. This introduces a new challenge, as, typically,\
    \ mobile devices have smaller displays than traditional devices from which people\
    \ have accessed web applications. Therefore, we need a solution to allow us to\
    \ display an image across a breadth of devices. One that has become widely adopted\
    \ since it was made popular after publication in *Responsive Web Design* by Ethan\
    \ Marcotte (A Book Apart, 2011) is outlined in [Listing 5-3](#part0012.html#list3).\n\
    \n[***Listing 5-3***](#part0012.html#_list3). Use of `max-width` to Ensure Images\
    \ Fill Available Container Width While Maintaining Aspect\n\n```\n.container >\
    \ img {\n  max-width: 100%;\n}\n```\n\nThe CSS outlined in [Listing 5-3](#part0012.html#list3)\
    \ will ensure the image fills the available width within the element with the\
    \ class attribute `.container`. Using the `max-width` property also ensures that\
    \ the aspect ratio of the image is maintained as it fills the available width.\
    \ This can then be coupled with media queries, introduced as part of the CSS3\
    \ standard, to render an image at different widths for each different class of\
    \ devices. [Listing 5-4](#part0012.html#list4) demonstrates the use of media queries\
    \ to adjust the width of the image.\n\n[***Listing 5-4***](#part0012.html#_list4).\
    \ Use of Media Queries to Optimize the Display of Images\n\n```\n.container >\
    \ img {\n  max-width: 100%;\n}\n\n@media screen and (min-width: 400px) {\n  .container\
    \ {\n    width: 368px;\n  }\n}\n\n@media screen and (min-width: 768px) {\n  .container\
    \ {\n    width: 416px;\n  }\n}\n```\n\n[Listing 5-4](#part0012.html#list4) initially\
    \ sets our images within elements having class attributes of `container`, to stretch\
    \ to full the available width. Next, we apply media queries, first for devices\
    \ with a display width of 400px and greater that will constrain our image to 368px.\
    \ Finally, we apply a media query to increase the width of the image to 416px\
    \ for devices having a display width of 768px and greater.\n\nThis solution works\
    \ perfectly well in most scenarios; however, there are two negatives to this approach.\
    \ The first issue associated with the solution is the varying network access different\
    \ devices have. For example, some mobile devices may access your web application\
    \ over a 3G connection, while someone else uses his/her home desktop device that\
    \ employs a fiber broadband connection. Therefore, to ensure that the desktop\
    \ experience is good, we have to use a large image and, thus, serve a high-resolution\
    \ image. However, on a mobile device, the display size is a lot smaller, so we\
    \ can afford to reduce the size of the image, to reduce page weight. The second\
    \ issue associated with this solution is the performance impact. At the time of\
    \ writing, image resizing performed by the browser is an expensive operation.\
    \ The larger the image, the greater the cost of downsizing the image for a mobile\
    \ display.\n\n## Resizing Images with Grunt"
  raw: 'Loseless compression takes its name from the fact that the original file can
    be re-created exactly; nothing is stripped from the file. Loseless compression
    is based on the concept of splitting the file into smaller parts, for transmission
    and/or storage. Lossy compression applies a different principle. With this form
    of compression, data is removed from the image, and the output cannot be used
    to re-create the original file. Grunt can be used to automate the use of these
    compression files within your application and also to report the percentage reduction
    of the file size for each image.


    In this section, we will introduce a new plug-in: grunt-contrib-imagemin. This
    adds support for compressing GIF, JPEG, PNG, and SVG formats. For now, we will
    explore the use of this plug-in for raster images only. Let’s start first by adding
    the new plug-in to our project (see [Listing 5-1](#part0012.html#list1)).


    [***Listing 5-1***](#part0012.html#_list1). Adding grunt-contrib-imagemin to package.json
    Using npm


    ```

    npm install grunt-contrib-imagemin –-save-dev

    ```


    Now that the plug-in has been installed for the project, next we must configure
    the plug-in to find our images and optimize each one. [Listing 5-2](#part0012.html#list2)
    demonstrates a sample Gruntfile configuration for the newly added plug-in.


    [***Listing 5-2***](#part0012.html#_list2). Gruntfile Configuration for grunt-contrib-imagemin


    ```

    ...

    imagemin: {

      app: {

        options: {

          optimizationLevel: 6,

          progressive: true,

          use: [pngquant()]

        },

        files: [{

          expand: true,

          cwd: ''src/'',

          src: [''**/*.{png,jpg,gif}''],

          dest: ''dist/''

        }]

      }

    }

    ...

    ```


    The options defined in the configuration within [Listing 5-2](#part0012.html#list2)
    set the level of optimization to 6, conversion of JPEG compression to progressive,
    and, finally, the use of a plug-in known as pngquant. Let’s explore each of these
    options individually.


    We set an option known as optimizationLevel to the value of 6\. The optimizationLevel
    option controls how many trials are run to compress the IDAT chunks of PNG images.
    This is primarily a feature of the PNG compression tool included with the plug-in,
    known as optipng. IDAT chunks are essentially the image data for a PNG file. The
    more trials run, the longer the compression will take, as more effort is needed
    as optipng attempts to find the optimal trial. Each trial will attempt to use
    a series of compression technics to reduce the file in size, without affecting
    the image quality. This option accepts values from 0 to 7\. A value of 0 means
    that no compression is applied to the files, and with a value of 7, 240 trials
    will be run in an attempt to reduce the image in size.


    The progressive option allows us to affect how jpegtran, the JPEG compression
    tool used by grunt-contrib-imagemin, is used. The progressive option can either
    be enabled or disabled. When this option is enabled with the value of true, the
    resulting JPEG file will be in a progressive JPEG format. Progressive JPEGs render,
    as the name suggests, progressively. This means a low-quality version is initially
    visible, then, as more data is received over the network, the image quality will
    gradually improve. Progressive JPEGs can also boost better compression rates,
    if the original image is larger than approximately 30KB, studies have shown ([http://calendar.perfplanet.com/2012/progressive-jpegs-a-new-best-practice/](http://calendar.perfplanet.com/2012/progressive-jpegs-a-new-best-practice/)).


    The final option we will look at is the use option. This allows the grunt-contrib-imagemin
    plug-in to be configured to use other imagemin plug-ins. Grunt-contrib-imagemin
    wraps the NodeJS module imagemin; therefore, any imagemin plug-in can be used
    with the plug-in as well. Altogether, there are ten plug-ins that can be used
    with imagemin. Each plug-in allows grunt-contrib-imagemin to use a series of compression
    tools. In our example, we’ve configured grunt-contrib-imagemin to use pngquant.


    Before moving on to the next topic in this chapter, let’s view a sample output
    for grunt-contrib-imagemin (see [Figure 5-1](#part0012.html#Fig1)). For this,
    we will add two new images to the project. One can be a large background image
    in a JPEG format and the other a delete icon that is a PNG image.


    ![9781484200148_Fig05-01.jpg](images/00032.jpeg)


    [Figure 5-1](#part0012.html#_Fig1). grunt-contrib-imagemin sample output


    As shown in [Figure 5-1](#part0012.html#Fig1), grunt-contrib-imagemin lists every
    file that is processed. For each file processed, the file source, the total size
    saved, and the percentage reduction are output. Finally, the total number is processed
    with the total reduction. Although image compression is an important part of an
    application build process, it does not tackle the problem of serving images for
    responsive sites. In the next section, we will use Grunt to prepare our imagery
    that is optimized for various breakpoints.


    Producing Responsive Images


    As discussed previously, the growth in the use of mobile devices is staggering.
    This introduces a new challenge, as, typically, mobile devices have smaller displays
    than traditional devices from which people have accessed web applications. Therefore,
    we need a solution to allow us to display an image across a breadth of devices.
    One that has become widely adopted since it was made popular after publication
    in *Responsive Web Design* by Ethan Marcotte (A Book Apart, 2011) is outlined
    in [Listing 5-3](#part0012.html#list3).


    [***Listing 5-3***](#part0012.html#_list3). Use of max-width to Ensure Images
    Fill Available Container Width While Maintaining Aspect


    ```

    .container > img {

        max-width: 100%;

    }

    ```


    The CSS outlined in [Listing 5-3](#part0012.html#list3) will ensure the image
    fills the available width within the element with the class attribute .container.
    Using the max-width property also ensures that the aspect ratio of the image is
    maintained as it fills the available width. This can then be coupled with media
    queries, introduced as part of the CSS3 standard, to render an image at different
    widths for each different class of devices. [Listing 5-4](#part0012.html#list4)
    demonstrates the use of media queries to adjust the width of the image.


    [***Listing 5-4***](#part0012.html#_list4). Use of Media Queries to Optimize the
    Display of Images


    ```

     .container > img {

        max-width: 100%;

    }


    @media screen and (min-width: 400px) {

        .container {

            width: 368px;

        }

    }


    @media screen and (min-width: 768px) {

        .container {

            width: 416px;

        }

    }

    ```


    [Listing 5-4](#part0012.html#list4) initially sets our images within elements
    having class attributes of container, to stretch to full the available width.
    Next, we apply media queries, first for devices with a display width of 400px
    and greater that will constrain our image to 368px. Finally, we apply a media
    query to increase the width of the image to 416px for devices having a display
    width of 768px and greater.


    This solution works perfectly well in most scenarios; however, there are two negatives
    to this approach. The first issue associated with the solution is the varying
    network access different devices have. For example, some mobile devices may access
    your web application over a 3G connection, while someone else uses his/her home
    desktop device that employs a fiber broadband connection. Therefore, to ensure
    that the desktop experience is good, we have to use a large image and, thus, serve
    a high-resolution image. However, on a mobile device, the display size is a lot
    smaller, so we can afford to reduce the size of the image, to reduce page weight.
    The second issue associated with this solution is the performance impact. At the
    time of writing, image resizing performed by the browser is an expensive operation.
    The larger the image, the greater the cost of downsizing the image for a mobile
    display.


    Resizing Images with Grunt'
  trans: "\n# 无损压缩与有损压缩\n\n无损压缩得名于其能完全还原原始文件，不会丢失任何数据。它基于将文件分割成更小部分进行传输或存储的原理。有损压缩则采用不同的原则：在压缩过程中会移除图像数据，输出结果无法用来重建原始文件。`Grunt`\
    \ 可自动在应用中使用这些压缩文件，并报告每张图像的文件大小缩减百分比。\n\n本节我们将介绍一个新插件：`grunt-contrib-imagemin`。该插件支持压缩\
    \ GIF、JPEG、PNG 和 SVG 格式。目前我们将先探索其在光栅图像中的应用。首先将新插件添加到项目中（见列表 5-1）。\n\n***列表 5-1***。使用\
    \ `npm` 将 `grunt-contrib-imagemin` 添加到 `package.json`\n\n```\nnpm install grunt-contrib-imagemin\
    \ –-save-dev\n```\n\n插件安装到项目后，接下来需要配置插件以查找图像并进行优化。列表 5-2 展示了新添插件的 `Gruntfile`\
    \ 配置示例。\n\n***列表 5-2***。`grunt-contrib-imagemin` 的 `Gruntfile` 配置\n\n```\n...\n\
    imagemin: {\n  app: {\n    options: {\n      optimizationLevel: 6,\n      progressive:\
    \ true,\n      use: [pngquant()]\n    },\n    files: [{\n      expand: true,\n\
    \      cwd: 'src/',\n      src: ['**/*.{png,jpg,gif}'],\n      dest: 'dist/'\n\
    \    }]\n  }\n}\n...\n```\n\n列表 5-2 中配置的选项将优化级别设为 6，JPEG 压缩转为渐进式，最后使用名为 `pngquant`\
    \ 的插件。我们逐一分析这些选项。\n\n我们将 `optimizationLevel` 选项设为 6。该选项控制压缩 PNG 图像 IDAT 块时运行的尝试次数，这主要是插件内置的\
    \ PNG 压缩工具 `optipng` 的功能。IDAT 块本质上是 PNG 文件的图像数据。尝试次数越多，压缩耗时越长，因为 `optipng` 需要更多努力来寻找最优方案。每次尝试都会运用一系列压缩技术来减小文件大小，且不影响图像质量。该选项接受\
    \ 0 到 7 的值：0 表示不对文件进行压缩，7 表示将运行 240 次尝试来缩小图像尺寸。\n\n`progressive` 选项影响 `grunt-contrib-imagemin`\
    \ 使用的 JPEG 压缩工具 `jpegtran` 的工作方式。该选项可启用或禁用。当设为 `true` 启用时，生成的 JPEG 文件将采用渐进式 JPEG\
    \ 格式。顾名思义，渐进式 JPEG 会逐步渲染：最初显示低质量版本，随着网络传输更多数据，图像质量逐渐提升。研究显示（[`calendar.perfplanet.com/2012/progressive-jpegs-a-new-best-practice/`](http://calendar.perfplanet.com/2012/progressive-jpegs-a-new-best-practice/)），若原始图像大于约\
    \ 30KB，渐进式 JPEG 还能获得更好的压缩率。\n\n我们来看最后一个选项 `use`。该选项允许配置 `grunt-contrib-imagemin`\
    \ 使用其他 `imagemin` 插件。`Grunt-contrib-imagemin` 封装了 NodeJS 模块 `imagemin`，因此任何 `imagemin`\
    \ 插件都可用于此。总计有十个插件可与 `imagemin` 配合使用，每个插件都让 `grunt-contrib-imagemin` 能够运用一系列压缩工具。在我们的示例中，配置了\
    \ `grunt-contrib-imagemin` 使用 `pngquant`。\n\n在进入本章下一主题前，我们先查看 `grunt-contrib-imagemin`\
    \ 的示例输出（见图 5-1）。为此，我们向项目添加两张新图像：一张是 JPEG 格式的大型背景图，另一张是 PNG 格式的删除图标。\n\n![9781484200148_Fig05-01.jpg](img/00032.jpeg)\n\
    \n图 5-1。`grunt-contrib-imagemin` 示例输出\n\n如 图 5-1 所示，`grunt-contrib-imagemin` 会列出所有处理的文件。针对每个文件，输出文件来源、总节省空间及缩减百分比。最后汇总处理的文件总数与总缩减量。虽然图像压缩是应用构建流程的重要部分，但它无法解决响应式网站的图片适配问题。下一节我们将使用\
    \ `Grunt` 来准备针对不同断点优化的图像。\n\n# 生成响应式图像\n\n如前所述，移动设备的使用增长惊人。这带来了新挑战，因为移动设备通常比人们访问网络应用的传统设备拥有更小的屏幕。因此，我们需要一种解决方案来让图像适配不同设备。自\
    \ Ethan Marcotte 所著《响应式 Web 设计》（A Book Apart，2011 年）推广后，广泛采用的一种方法在列表 5-3 中进行了概述。\n\
    \n***列表 5-3***。使用 `max-width` 确保图像在填充可用容器宽度时保持宽高比\n\n```\n.container > img {\n\
      max-width: 100%;\n}\n```\n\n列表 5-3 中的 CSS 确保图像填充 class 属性为 `.container` 的元素内的可用宽度。使用\
    \ `max-width` 属性还能在图像填充可用宽度时保持宽高比。这可以配合 CSS3 标准中引入的媒体查询，针对不同设备类别以不同宽度渲染图像。列表 5-4\
    \ 演示了使用媒体查询调整图像宽度。\n\n***列表 5-4***。使用媒体查询优化图像显示\n\n```\n.container > img {\n  max-width:\
    \ 100%;\n}\n\n@media screen and (min-width: 400px) {\n  .container {\n    width:\
    \ 368px;\n  }\n}\n\n@media screen and (min-width: 768px) {\n  .container {\n    width:\
    \ 416px;\n  }\n}\n```\n\n列表 5-4 首先将 class 属性为 `container` 元素内的图像设置为拉伸至可用宽度。接着应用媒体查询：首先针对显示宽度为\
    \ 400px 及以上的设备，将图像约束为 368px；最后针对显示宽度为 768px 及以上的设备，将图像宽度增加至 416px。\n\n此方案在大多数场景下效果良好，但存在两个缺点。第一个问题是不同设备网络接入的差异。例如，有些移动设备可能通过\
    \ 3G 连接访问应用，而其他人则使用光纤宽带连接的台式机。为保证桌面端体验，必须使用大图提供高分辨率图像。但在移动设备上，显示尺寸更小，因此可缩小图像以降低页面加载量。第二个问题是性能影响。目前，浏览器执行图像缩放仍是高开销操作。图像越大，为移动显示缩小图像的代价越高。\n\
    \n## 使用 Grunt 调整图像尺寸\n"
- fmt: "让我们先解决第二个问题：消除浏览器为适应设备宽度而调整图片大小的需求。为了解决这个问题，我们将以多种断点生成图片。然后可以为每个设备使用最合适的图片。每次需要发布新内容时生成多个图片成本高昂且是重复性任务，因此非常适合集成到`Grunt`工作流中。让我们引入一个新插件：`grunt-responsive-images`。这个插件封装了图像处理工具`GraphicsMagick`和`ImageMagick`，并允许指定一组尺寸来调整原始图片的大小。[清单5-5](#part0012.html#list5)演示了该插件的安装。\n\
    \n***清单5-5***。安装`grunt-responsive-images`\n\n```\nnpm install --save-dev grunt-responsive-images\n\
    ```\n\n在可以使用该插件之前，必须安装`GraphicsMagick`或`ImageMagick`。在我们的示例中，我们将使用`GraphicsMagick`。要安装`GraphicsMagick`，请访问`GraphicsMagick`下载页面（[http://sourceforge.net/projects/graphicsmagick/files/graphicsmagick/](http://sourceforge.net/projects/graphicsmagick/files/graphicsmagick/)），Mac以外的所有平台均适用。Mac用户可以使用`Homebrew`安装`GraphicsMagick`，如[清单5-6](#part0012.html#list6)所示。\n\
    \n***清单5-6***。使用`Homebrew`安装`GraphicsMagick`\n\n```\nbrew install GraphicsMagick\n\
    ```\n\n接下来，必须将插件的配置添加到项目中。[清单5-7](#part0012.html#list7)演示了项目的示例配置。\n\n***清单5-7***。`grunt-responsive-images`的`Grunt`配置\n\
    \n```\nresponsive_images: {\n  dest: {\n    options: {\n      sizes: [{\n    \
    \    width: 320,\n        height: 240\n      },{\n        name: 'large',\n   \
    \     width: 640\n      },{\n        name: \"large\",\n        width: 1024,\n\
    \        suffix: \"_x2\",\n        quality: 60\n      }]\n    },\n    files: [{\n\
    \      expand: true,\n      src: ['img/**.{jpg,gif,png}'],\n      cwd: 'app/',\n\
    \      dest: 'dist/'\n    }]\n  }\n}\n...\ngrunt.loadNpmTasks('grunt-responsive-images');\n\
    ```\n\n`grunt-responsive-images`是一个非常灵活的插件，它为您提供了对输出图片的大量控制。让我们分解[清单5-7](#part0012.html#list7)中的配置，解释每个选项的作用。首先，我们定义`options`，它是一个`sizes`数组。每个`sizes`至少定义一个输出图片的维度，并将为传递给插件的每个图片生成一个此尺寸的新图片。\n\
    \n第一个`sizes`是最简单的示例。我们仅定义图片的高度和宽度。这将生成一个具有这些尺寸的新图片，文件名后附加上新的图片尺寸。第二个`sizes`选项定义单一维度，即宽度。此配置将在保持宽高比的同时将图片调整为指定维度。这第二组配置引入了一个新选项：`name`。`name`选项将用作图片后缀的一部分。在我们的示例中，新图片文件名将包含原始图片名称和`name`后缀。例如，`background-large.jpg`。最后的配置引入了两个新选项：`suffix`和`quality`。`suffix`选项允许在文件名和`name`参数后附加额外的后缀。[清单5-7](#part0012.html#list7)中的示例可能生成最终名称为`background-large_x2.jpg`的图片。`quality`参数指作为插件一部分生成的JPEG图片的质量。它接受1到100之间的值，其中100将生成最佳质量的图片。\n\
    \n除了这些选项，我们还为我们的目标定义了一个`files`配置。这是标准的`Grunt`文件数组格式，它将找到`/app/img`目录下的所有图片，将这些图片传递给插件，并将输出存储在`/dist/img`中。\n\
    \n`grunt-responsive-image`插件还允许在配置中定义以下内容：\n\n*   `rename`：这提供了替换图片原始文件名的能力，同时保留其后缀。\n\
    *   `aspectRatio`：此选项默认保持。将其设置为`false`则不保持宽高比。\n*   `gravity`：在图片裁剪过程中，此选项控制图片的放置位置。默认设置为`center`。它接受所有方位点的值（例如，`northwest`，`north`，`northeast`等）。\n\
    *   `upscale`：这决定如果目标尺寸大于原始图片，是否应放大图片。\n*   `separator`：这是用于文件名和后缀之间的字符。\n*  \
    \ `units`：这提供了像素、百分比和倍数单位及其表示之间的映射。默认情况下，此选项设置为`{ percentage: 'pc', pixel: '',\
    \ multiply: 'x' }`。\n\n在继续讨论如何在应用程序中使用这些新生成的图片之前，我们将快速查看插件的输出，如[图5-2](#part0012.html#Fig2)和[图5-3](#part0012.html#Fig3)所示。\n\
    \n![9781484200148_Fig05-02.jpg](images/00033.jpeg)\n\n[图5-2](#part0012.html#_Fig2).\
    \ `grunt-responsive-images`的示例输出\n\n![9781484200148_Fig05-03.jpg](images/00034.jpeg)\n\
    \n[图5-3](#part0012.html#_Fig3). `grunt-responsive-images`生成的图片\n\n如[图5-2](#part0012.html#Fig2)所示，该插件会为每个尺寸配置输出生成的文件数量。在我们的配置中，有三组不同的图片。这生成了三行输出，对于每组尺寸选项，插件生成了两个图片。[图5-3](#part0012.html#Fig3)显示了根据[清单5-6](#part0012.html#list6)中的配置生成并在[图5-2](#part0012.html#Fig2)中列出的图片。两张源图片`background.jpg`和`delete.png`由插件转换，为每张图片额外生成三张图片。现在我们有一系列图片，必须将它们应用到相关设备。\n\
    \n背景图片可以很容易地使用CSS应用。我们可以使用媒体查询针对不同宽度的设备。[清单5-8](#part0012.html#list8)演示了为不同类别的设备应用多个版本背景图片的示例。\n\
    \n***清单5-8***。使用媒体查询应用响应式图片\n\n```\nbody {\n    background: url(../img/background-320x240.jpg);\n\
    }\n\n@media screen and (min-width: 600px) {\n    body {\n        background: url(../img/background-large.jpg);\n\
    \    }\n}\n```\n\n### 使用`srcset`的响应式图片\n\n这种解决方案对背景图片效果很好，但不能解决内容中图片的问题。在撰写本文时，`srcset`属性仅在最新版本的Firefox、Chrome、Safari和Opera中受支持。`srcset`属性允许开发者为不同的设备属性定义多个图片来源。[清单5-9](#part0012.html#list9)演示了一个示例。\n\
    \n***清单5-9***。使用`srcset`定义不同图片\n\n```\n<img alt=\"Cool Apps\" src=\"del1x.jpg\"\
    \ srcset=\"del1x.jpg 1x, del2x.jpg 2x, del4x.jpg 4x\">\n```\n\n`srcset`属性规范已被`picture`元素规范取代，后者定义了`picture`元素并扩展了原始的`srcset`属性。该规范详细描述了一组更丰富的属性，可用于针对特定设备，其方式类似于我们针对特定设备使用CSS的方式。在撰写本文时，`picture`元素（见[清单5-10](#part0012.html#list10)）仅在最新版本的Chrome和Firefox中受支持。\n\
    \n***清单5-10***。`picture`元素"
  raw: 'Let’s tackle the second issue introduced, removing the need for a browser
    to resize an image to fit the device width. To solve this problem, we will produce
    images at a variety of breakpoints. The most appropriate image can then be used
    for each device. Producing multiple images each time we need to publish new content
    would be costly and is a repeatable task, therefore an ideal candidate for integration
    with our Grunt workflow. Let’s introduce a new plug-in: grunt-responsive-images.
    This plug-in wraps the image processing tools GraphicsMagick and ImageMagick and
    allows a set of sizes by which to resize the original image. [Listing 5-5](#part0012.html#list5)
    demonstrates installation of the plug-in.


    [***Listing 5-5***](#part0012.html#_list5). Installing grunt-responsive-images


    ```

    npm install --save-dev grunt-responsive-images

    ```


    Before the plug-in can be used, GraphicsMagick or ImageMagick must be installed.
    For our examples, we will be using GraphicsMagick. To install GraphicsMagick,
    please visit the GraphicsMagick download page ([http://sourceforge.net/projects/graphicsmagick/files/graphicsmagick/](http://sourceforge.net/projects/graphicsmagick/files/graphicsmagick/)),
    for all platforms except Mac. Mac users can use Homebrew to install GraphicsMagick,
    as shown in [Listing 5-6](#part0012.html#list6).


    [***Listing 5-6***](#part0012.html#_list6). Installing GraphicsMagick with Homebrew


    ```

    brew install GraphicsMagick

    ```


    Next, the configuration for the plug-in has to be added to the project. [Listing
    5-7](#part0012.html#list7) demonstrates a sample configuration for the project.


    [***Listing 5-7***](#part0012.html#_list7). Grunt Configuration for grunt-responsive-images


    ```

    responsive_images: {

      dest: {

        options: {

          sizes: [{

            width: 320,

            height: 240

          },{

            name: ''large'',

            width: 640

          },{

            name: "large",

            width: 1024,

            suffix: "_x2",

            quality: 60

          }]

        },

        files: [{

          expand: true,

          src: [''img/**.{jpg,gif,png}''],

          cwd: ''app/'',

          dest: ''dist/''

        }]

      }

    }

    ...

    grunt.loadNpmTasks(''grunt-responsive-images'');

    ```


    grunt-responsive-images is a very flexible plug-in that provides you with a lot
    of control over the outputted images. Let’s break down the configuration from
    [Listing 5-7](#part0012.html#list7), to explain how each works. First, we define
    our options, which are an array of sizes. Each size defines at least one dimension
    of the images to be output and will produce a new image at this size for each
    image passed the plug-in.


    The first size used is the simplest possible example. We simply define a height
    and width for the image. This will result in a new image being generated with
    these dimensions and the file name suffixed with the new image dimensions. The
    second size option defines a single dimension, the width. This configuration will
    resize the image to match the specified dimension while maintaining the aspect
    ratio. This second set of configurations introduces a new option, name. The name
    option will be used as part of the image suffix. In our example, the new image
    file name will contain the original image name and the name suffix. An example
    would be background-large.jpg. The final configuration introduces two new options,
    suffix and quality. The suffix option allows an additional suffix to be appended
    to the file name and the name parameter. Our example in [Listing 5-7](#part0012.html#list7)
    could produce an image of the final name background-large_x2.jpg. The quality
    parameter refers to quality of the JPEG image generated as part of the plug-in.
    This accepts values between 1 and 100, where 100 will produce the best-quality
    image.


    In addition to these options, we also define a files configuration for our target.
    This is the standard Grunt file array format that will find all images in our
    /app/img directory, pass these to the plug-in, and store the output in /dist/img.


    The grunt-responsive-image plug-in also allows the following to be defined in
    configuration:


    *   rename: This provides the ability to replace the image’s original file name
    while maintaining its suffixes.

    *   aspectRatio: This option is maintained by default. Setting it to false does
    not maintain the aspect ratio.

    *   gravity: During the cropping of the image, this option controls where the
    image is placed. By default, this is set to center. It accepts values for all
    compass points (e.g., northwest, north, northeast, etc.).

    *   upscale: This determines whether an image should be upscaled if the dimensions
    are larger than the original image.

    *   separator: This is the character that is used between the file name and the
    suffix.

    *   units: This provides a mapping among pixels, percentages, and multiply units
    and their representation. By default, this option is set to { percentage: ''pc'',
    pixel: '''', multiply: ''x'' }.


    Before moving on to how we can use these newly produced images in our application,
    we’ll quickly look at the output of the plug-in, as demonstrated in [Figures 5-2](#part0012.html#Fig2)
    and [5-3](#part0012.html#Fig3).


    ![9781484200148_Fig05-02.jpg](images/00033.jpeg)


    [Figure 5-2](#part0012.html#_Fig2). Sample output from grunt-responsive-images


    ![9781484200148_Fig05-03.jpg](images/00034.jpeg)


    [Figure 5-3](#part0012.html#_Fig3). Images produced by grunt-responsive-images


    As [Figure 5-2](#part0012.html#Fig2) demonstrates, the plug-in will output the
    number of files generated for each size configuration. In our configuration, we
    had three different sets of images. This generated three lines of output, and
    for each set of size options, the plug-in produced two images. [Figure 5-3](#part0012.html#Fig3)
    shows the images generated from the configuration in [Listing 5-6](#part0012.html#list6)
    and listed in [Figure 5-2](#part0012.html#Fig2). Two source images, background.jpg
    and delete.png, are transformed by the plug-in to produce three additional images
    for each image. Now that we have a series of images, we must apply these to the
    relevant devices.


    Background images are easily applied using CSS. We can target devices at different
    widths using media queries. [Listing 5-8](#part0012.html#list8) demonstrates an
    example of applying multiple versions of a background image for a different class
    of devices.


    [***Listing 5-8***](#part0012.html#_list8). Applying Responsive Images Using Media
    Queries


    ```

    body {

        background: url(../img/background-320x240.jpg);

    }


    @media screen and (min-width: 600px) {

        body {

            background: url(../img/background-large.jpg);

        }

    }

    ```


    Responsive Images with srcset


    This solution works well for background images but does not solve the problem
    for images that appear in our content. At the time of writing, the srcset attribute
    for image elements is only supported in the latest version of Firefox, Chrome,
    Safari, and Opera. The srcset attribute allows developers to define multiple images’
    sources for different device attributes. [Listing 5-9](#part0012.html#list9) demonstrates
    an example of this.


    [***Listing 5-9***](#part0012.html#_list9). srcset Used to Define Different Images


    ```

    <img alt="Cool Apps" src="del1x.jpg" srcset="del1x.jpg 1x, del2x.jpg 2x, del4x.jpg
    4x">

    ```


    The srcset attribute specification has been replaced with the picture element
    specification, which defines the picture element and extends the original srcset
    attribute. The specification details a richer set of attributes that can be used
    to target specific devices, in much the same way we can target CSS for particular
    devices. The picture element (see [Listing 5-10](#part0012.html#list10)), at the
    time of writing, is only supported in the latest version of Chrome and Firefox.


    [***Listing 5-10***](#part0012.html#_list10). Picture Element'
