    file in our dist folder; therefore, we have to introduce a new Grunt plug-in called
    grunt-contrib-copy. This plug-in is used to copy files or folders from one place
    to another within a project. In our project, we will use grunt-contrib-copy to
    copy the index.html file from app/index.html to dist/index.html. This file will
    then be processed by usemin to update the references to the optimized CSS. Having
    an index.html file in our dist folder allows us to work locally with a development
    copy of our application before building a version for releasing that contains
    the correct references to the optimized CSS. [Listing 3-43](#part0010.html#list43)
    contains the configuration for grunt-contrib-copy.


    [***Listing 3-43***](#part0010.html#_list43). Head Element Has Been Modified to
    Contain Reference to Optimized CSS


    ```

    <head>

    <meta charset="utf-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Pro Grunt.js: Todo List</title>

    <meta name="description" content="">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="css/main.css">

    </head>

    ```


    As you can see, the index.html now contains a reference to the optimized CSS,
    ready for deployment to production. In the following section, we will look at
    asset versioning of optimized caching of static assets and how Grunt can help
    us with this process.


    Versioning


    In the final section of this chapter, we’ll see how we can use Grunt to further
    improve the performance of our production code. In this section, we’ll look at
    how we can ship versioned assets. The primary reason to ship versioned assets
    is to safely set far future cache headers for our static assets. Setting far future
    headers improves performance, as clients can cache a copy of your assets, preventing
    them from having to return to your server to re-request the asset on each page
    load. Typically, we will set a far future expires header on assets such as CSS,
    web fonts, and JavaScript. For an example of web server configuration for expires
    headers, check out HTML5 Boilerplate’s .htaccess file. This provides a great starting
    point for people using the Apache web server and sets the majority of static assets
    to expire a month from the time they were accessed.


    As mentioned, Grunt can help with the delivery of static assets with far future
    headers. Simply sending an expires header with a far future date can be dangerous.
    Any updates to that asset will not be picked up until the cache expires and the
    client re-requests the asset from the server. There are a couple solutions to
    this problem. One popular approach is to add a cache buster to the URL for the
    asset. When the asset itself changes, the cache buster is updated, forcing the
    client to re-request the asset from the server. [Listing 3-44](#part0010.html#list44)
    shows a dummy URL for a CSS file with a cache buster appended.


    [***Listing 3-44***](#part0010.html#_list44). Dummy CSS URL with Cache Buster
    Appended


    ```

    http://mysite.com/styles/app.css?c=20140303

    ```


    Unfortunately, some proxy servers are configured by default not to cache URLs
    that contain query strings. Therefore, we need an alternatively approach. [Listing
    3-45](#part0010.html#list45) shows both approaches.


    [***Listing 3-45***](#part0010.html#_list45). Alternative Asset Version Approaches


    ```

    http://mysite.com/0.1.0/styles/app.css

    http://mysite.com/styles/app.0.1.0.css

    ```


    In the first approach, the version number is inserted into the path to the assets.
    This is the approach the BBC currently takes to version its assets. For example,
    the BBC homepage has the following reference: [http://static.bbci.co.uk/h4clock/0.69.3/style/h4clock.css](http://static.bbci.co.uk/h4clock/0.69.3/style/h4clock.css).
    In this case, the version is 0.69.3\. The alternative approach, including the
    version in the asset file name, is used by jQuery when serving jQuery from its
    CDN. For example, the URL for the latest version of jQuery, at the time of writing,
    is [http://code.jquery.com/jquery-1.11.0.min.js](http://code.jquery.com/jquery-1.11.0.min.js).


    There is a Grunt plug-in, grunt-rev, available to perform version asset production.
    The grunt-rev plug-in generates a hash based on the contents of your file. It
    offers a number of algorithms for generating the hash, such as md5 and sha256\.
    The hash generated for a file is injected before the file extension. In addition
    to this, grunt-rev works perfectly with the usemin plug-in introduced in the previous
    section. [Listing 3-46](#part0010.html#list46) shows the latest configuration
    for both of these files.


    [***Listing 3-46***](#part0010.html#_list46). Configuration for Static Asset Versioning


    ```

    rev: {

      dist: {

        src: ''dist/css/main.css''

      }

    }

    ```


    As you can see, the CSS generated in the temporary folder as part of the earlier
    tasks is now picked up by the rev task and dropped into the dist/css folder. Once
    this has completed, usemin modifies the index.html file in the dist folder with
    the path to the newly versioned CSS. The benefit of using hashes over timestamps,
    in this case, is that the hash should only change when the contents of the file
    itself changes. This is particularly important if you have multiple teams generating
    the same static assets. You only want the asset name to change when there has
    been a genuine change to the contents of the file.


    Summary


    In this chapter, we’ve explored how to use Grunt to ease our development workflow
    when working with HTML and CSS. We started with a brief introduction into CSS
    preprocessors and how Grunt can aid us with compiling our CSS. After this, we
    moved on to Bower, a powerful front-end dependency manager, which can be integrated
    with Grunt to make managing front-end libraries within our projects easy. The
    remainder of the chapter looked at a number of plug-ins that can be used to help
    optimize our HTML and CSS before releasing it onto the public Web.


    In the next chapter, we’ll continue to look at how Grunt can help when working
    with front-end technology, as you discover a powerful set of plug-ins to help
    with JavaScript development.


