  trans: "  \n如列表 5-14 所示，`grunt-spritesmith`为生成适合特定用例的精灵图提供了极大的灵活性。我将回顾列表 5-14 中定义的每个选项，并解释每个选项对输出的精灵图和\
    \ CSS 的影响。第一个选项仅用于定义哪些文件应包含在精灵图中。在示例中，我们在`build`文件夹中添加了一个包含所有图标的新文件夹。下一个选项`destImg`决定了生成的精灵图的位置和文件名。第三个选项决定了插件生成的\
    \ CSS 的位置和文件名。在我们的示例中，我们希望生成`SCSS`以集成到现有的`SCSS`工作流程中。`imgPath`选项控制生成的 CSS 中出现的图像路径。如果你的路径与构建路径不同，这会非常有用。在我们的案例中，`CSS`和图像在构建文件夹中的位置不同；因此，我们指定了图像路径，以便图像能够正确加载。`algorithm`选项控制图像在生成的精灵图中的布局方式。此选项允许图像从上到下、从左到右或沿对角线添加。这在处理响应式解决方案时特别有用，因为图像可能需要以特定方式布局以支持不同的设备宽度。与`algorithm`选项一样，`padding`选项也控制图像在精灵图中的布局。顾名思义，`padding`控制每个图标周围的填充量。在我们的示例中，我们选择为每个图标添加`35px`的填充。当你有需要应用背景图像的大元素，并且必须确保只有一个图标显示为背景图像图标时，这很有用。如前所述，`grunt-spritesmith`将图像创建委托给第三方图像工具。`engine`选项控制用于生成精灵图的工具。在列表\
    \ 5-14 中，`phantomjs`被用作创建精灵图的工具。`grunt-spritesmith`最强大的功能之一是能够以所选格式输出`CSS`。在我们的示例中，我们指定了`SCSS`；但是，该插件支持`LESS`、`SASS`、`Stylus`和`CSS`输出。\n\
    \n列表 5-14 中的配置输出两个资源：精灵图文件和`SCSS`文件。图 5-4 展示了项目目录中的输出文件。\n\n![9781484200148_Fig05-04.jpg](img/00035.jpeg)\n\
    \n图 5-4。`grunt-spritesmith`插件输出的精灵图和`SCSS`文件\n\n使用`grunt-spritesmith`为精灵表生成`SCSS`的另一个好处是它生成了一组丰富的`mixin`。列表\
    \ 5-15 提供了从上述示例生成的完整`SCSS`文件示例。\n\n***列表 5-15***。`grunt-spritesmith`输出的`SCSS`示例\n\
    \n```\n$upload-x: 0px;\n$upload-y: 1443px;\n$upload-offset-x: 0px;\n$upload-offset-y:\
    \ -1443px;\n$upload-width: 76px;\n$upload-height: 76px;\n$upload-total-width:\
    \ 76px;\n$upload-total-height: 1741px;\n$upload-image: '../img';\n$upload: 0px\
    \ 1443px 0px -1443px 76px 76px 76px 1741px '../img';\n\n@mixin sprite-width($sprite)\
    \ {\n  width: nth($sprite, 5);\n}\n\n@mixin sprite-height($sprite) {\n  height:\
    \ nth($sprite, 6);\n}\n\n@mixin sprite-position($sprite) {\n  $sprite-offset-x:\
    \ nth($sprite, 3);\n  $sprite-offset-y: nth($sprite, 4);\n  background-position:\
    \ $sprite-offset-x  $sprite-offset-y;\n}\n\n@mixin sprite-image($sprite) {\n \
    \ $sprite-image: nth($sprite, 9);\n  background-image: url(#{$sprite-image});\n\
    }\n\n@mixin sprite($sprite) {\n  @include sprite-image($sprite);\n  @include sprite-position($sprite);\n\
    \  @include sprite-width($sprite);\n  @include sprite-height($sprite);\n}\n```\n\
    \n对于添加到精灵表的每个图像，`grunt-spritesmith`会生成许多以文件名开头的变量。每个变量都包含图像的属性，例如，在精灵表中的`x`坐标。这些变量被组合起来，并由生成的`mixin`使用。该插件还会生成四个`mixin`。前四个是便捷`mixin`，由主`mixin`\
    \ `sprite`使用。`sprite` `mixin`是实际用于生成包含图标或图像作为背景的`CSS`输出的`mixin`。列表 5-16 演示了如何使用`sprite`\
    \ `mixin`将上传图标添加到我们的`CSS`输出中。\n\n***列表 5-16***。使用`grunt-spritesmith`在`CSS`中生成图标\n\
    \n```\n.icon-upload {\n  @include sprite-width($icon-upload);\n}\n```\n\n各种变量的创建与`grunt-spritesmith`生成的`mixin`相结合，使得维护精灵表变得异常容易。精灵表本身的任何更改对`SCSS`都是透明的，因为变量值的更改不需要在`SCSS`中进行任何更新。此外，精灵表和`SCSS`可以传递给其他`Grunt`任务，从而实现诸如代码检查和压缩等任务。\n\
    \n## 使用 SVG\n\n本章的第一部分致力于优化 Web 的光栅图像。在余下的章节中，我将重点优化处理`SVG`文件的工作流程。`SVG`非常适合生成可缩放且可使用`CSS`设置样式的轻量级图标。`SVG`是一种基于`XML`的文件格式，适用于生成二维图形，其中元素用于定义路径、形状和多边形。列表\
    \ 5-17 演示了一个基本的`SVG`文件，图 5-5 展示了该`SVG`文件的视觉效果。\n\n***列表 5-17***。`SVG`文档示例\n\n\
    ```\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD\
    \ SVG 1.1//EN\" \"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\">\n<svg xmlns=\"\
    http://www.w3.org/2000/svg\" width=\"39\" height=\"32\" viewBox=\"0 0 39 32\"\
    >\n    <!-- tick icon -->\n    <path d=\"M15.815 32l23.475-28.046-4.695-3.954-19.521\
    \ 23.228-11.12-9.266-1.954 10.695z\"/>\n</svg>\n```\n\n![9781484200148_Fig05-05.jpg](img/00036.jpeg)\n\
    \n图 5-5。列表 5-17 输出的`SVG`视觉效果\n\n除了基本的二维图形外，`JavaScript`和`CSS`也可以与`SVG`一起使用来制作动画。这并非`SVG`成为理想图标格式的唯一特性。使用`SVG`作为图标的主要优势在于它们体积轻量，并且可以在不影响图像质量的情况下轻松缩放。过去几年中，`SVG`文件的使用有所增加，这主要是由人们通过各种设备访问\
    \ Web 的趋势推动的。由于`SVG`的文件大小通常小于光栅图像，并且如前所述易于缩放，这解决了为高像素密度显示器设备渲染清晰图像的问题。然而，与所有页面资源一样，应谨慎考虑，以避免使页面臃肿、增加页面重量并导致不良的用户体验。`Grunt`通过提供自动化优化`SVG`文件的工具，有助于降低这种风险。\n\
    \n### 压缩 SVG\n"
- fmt: "与 CSS 和 JavaScript 一样，SVG 文件也可以被压缩。这主要源于一个事实：与其他基于文本的文件格式一样，可以去除不必要的内容和空格。如果你从流行的图形软件包中导出\
    \ SVG 图像，这一点尤其适用。幸运的是，`Grunt` 有一个可用于优化 SVG 文件的插件，并能在你的应用程序中直接使用。我现在要介绍的插件叫做 `grunt-svgmin`。`grunt-svgmin`\
    \ 封装了 Node.js 库 `SVGO`，这是一个 SVG 优化器。`SVGO` 将执行诸如删除空属性、注释、文档类型声明以及将样式转换为属性等优化操作。[Listing\
    \ 5-18](#part0012.html#list18) 展示了一个 `grunt-svgmin` 的示例配置。\n\n[***Listing 5-18***](#part0012.html#_list18).\
    \ `grunt-svgmin` 配置\n\n```\nsvgmin: {\n    app: {\n      options: {\n        plugins:\
    \ [\n          { removeViewBox: true },\n          { removeUselessStrokeAndFill:\
    \ true }\n        ]\n      },\n      files: [{\n        expand: true,\n      \
    \  cwd: 'build/svg',\n        src: ['**/*.svg'],\n        dest: 'app/img/',\n\
    \        ext: '.min.svg'\n      }]\n    }\n  }\n```\n\n[Listing 5-18](#part0012.html#list18)\
    \ 中展示的配置演示了在项目中优化 SVG 文件所需的最简单配置。这里定义了两个选项：`removeViewBox` 和 `removeUselessStrokeAndFill`。第一个选项会从根\
    \ `<svg>` 元素中移除 `viewBox` 属性。第二个选项会移除那些 `stroke-width` 属性设置为 `0` 或 `none` 的描边。如果\
    \ SVG 包含 `fill` 属性设置为 `none` 且 `opacity` 设置为 `0` 的元素，则 `fill-opacity` 会被移除。此外，`grunt-svgmin`\
    \ 还会从 SVG 中移除空格、注释和文档类型声明。[Listing 5-19](#part0012.html#list19) 展示了一个示例输入 SVG\
    \ 文件，优化后的版本见 [Listing 5-20](#part0012.html#list20)。\n\n[***Listing 5-19***](#part0012.html#_list19).\
    \ 优化前的 SVG 文件\n\n```\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg\
    \ PUBLIC \"-//W3C//DTD SVG 1.1//EN\" \"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"39\" height=\"32\" viewBox=\"\
    0 0 39 32\">\n  <!-- tick icon -->\n  <path stroke=\"0\" stroke-width=\"0\" fill=\"\
    none\" fill-opacity=\"0\" d=\"M15.815 32l23.475-28.046-4.695-3.954-19.521 23.228-11.12-9.266-1.954\
    \ 10.695z\"/>\n</svg>\n```\n\n[***Listing 5-20***](#part0012.html#_list20). 经\
    \ `grunt-svgmin` 优化后的 SVG 文件\n\n```\n<svg xmlns=\"http://www.w3.org/2000/svg\"\
    \ width=\"39\" height=\"32\"><path d=\"M15.815 32L39.29 3.954 34.595 0l-19.52\
    \ 23.228-11.12-9.266L2 24.657z\" fill=\"none\"/></svg>\n```\n\n与其他压缩插件一样，`grunt-svgmin`\
    \ 插件会在压缩后输出文件大小的缩减百分比。[Figure 5-6](#part0012.html#Fig6) 展示了该插件的一个示例输出。\n\n![9781484200148_Fig05-06.jpg](images/00037.jpeg)\n\
    \n[Figure 5-6](#part0012.html#_Fig6). `grunt-svgmin` 的示例输出\n\n## 生成 SVG Sprites\n\
    \nSVG 图像可以通过多种方式包含在页面中，包括使用 `<object>` 元素、`<iframe>` 标签、`<img>` 标签，或者将内容直接嵌入文档。除这些方法外，SVG\
    \ 文件也可以在 CSS 中被引用为背景。与所有页面资源一样，我们必须尽量减少下载整个页面所需的请求数量。这个规则同样适用于 SVG 文件。想象一个页面，其菜单系统包含大量图标。如果菜单中的每个图标都通过\
    \ `<img>` 元素引用一个 SVG 文件，或者使用 CSS `background` 属性来应用，这可能会产生许多不必要的请求。与光栅图像一样，我们可以将多个\
    \ SVG 文件合并成一个单一文件，并应用它来代替单个文件。这样做的好处是所有图像只需一次 HTTP 请求，并且这个 SVG Sprite 可以使用 gzip\
    \ 进行压缩，从而进一步减少带宽消耗。为了实现这些改进，我们可以引入一个名为 `grunt-svg-sprite` 的新插件。[Listing 5-21](#part0012.html#list21)\
    \ 展示了 `grunt-svg-sprite` 的一些示例配置。\n\n[***Listing 5-21***](#part0012.html#_list21).\
    \ `grunt-svg-sprite` 配置\n\n```\nsvgsprite: {\n  app : {\n    options: {\n    \
    \  render: {\n        scss: {\n          dest: '../../build/styles/_font.scss'\n\
    \        },\n        css: false\n      },\n      spritedir: '',\n      padding:\
    \ 35,\n      layout: 'vertical'\n    },\n    src: 'build/svg/',\n    dest: 'app/img/'\n\
    \  }\n}\n```\n\n[Listing 5-21](#part0012.html#list21) 中概述的配置将生成一个 SVG Sprite 和一个配套的\
    \ SCSS 文件。为了实现这一点，`render` 选项被设置为包含 SCSS 文件的目标路径。需要注意的是，此路径是相对于由 `dest` 选项定义的目标目录的。另外，要禁用\
    \ CSS 输出，需要将 `css` 选项设置为 `false`。定义的下一个选项是 `spritedir`，它阻止 sprite 被放置在一个专用文件夹中。在我们的示例中，生成的\
    \ sprite 将输出在 `dest` 文件夹的根目录下。`padding` 选项与 `grunt-spritesmith` 的 `padding` 选项相同，它控制每个图标周围的间距。提供的最后一个选项是\
    \ `layout`，它控制每个图标在 SVG Sprite 中的布局方式。它接受 `vertical`、`horizontal` 或 `diagonal`\
    \ 这几个值。\n\n通过将导入语句添加到 `main.scss` 文件的顶部，可以轻松地将 SVG Sprite 集成到我们现有的 SASS 工作流中，如\
    \ [Listing 5-22](#part0012.html#list22) 所示。\n\n[***Listing 5-22***](#part0012.html#_list22).\
    \ 将 SVG Sprite 添加到 SASS 文件\n\n```\n@import 'font;\n```\n\n编译后的 CSS 现在将包含新的 CSS\
    \ 选择器，每个选择器对应 sprite 中包含的一个图标。要使用这些图标之一，我们可以创建 HTML，如 [Listing 5-23](#part0012.html#list23)\
    \ 所示。\n\n[***Listing 5-23***](#part0012.html#_list23). 演示如何使用 SVG Sprite\n\n```\n\
    <div class=\"svg-circle\"></div>\n```\n\n[Listing 5-23](#part0012.html#list23)\
    \ 中的 HTML 会将 CSS `background` 属性应用于 `div` 元素，该元素会渲染出与原始 `circle.svg` 文件相对应的图标。\n\
    \n## 生成图标字体"
  raw: 'As with CSS and JavaScript, SVG files can also be minified. This primarily
    derives from the fact that, as with other text-based file formats, unnecessary
    content and space can be stripped. This is particularly true if you export your
    SVG images from popular graphics packages. Luckily, Grunt has a plug-in available
    for optimizing SVG files that is ready for use within your application. The plug-in
    that I will introduce now is called grunt-svgmin. Grunt-svgmin wraps the Node.js
    library SVGO, an SVG optimizer. SVGO will perform optimizations such as removing
    empty attributes, comments, doctype declarations, and converting styles into attributes.
    [Listing 5-18](#part0012.html#list18) shows a sample configuration for grunt-svgmin.


    [***Listing 5-18***](#part0012.html#_list18). grunt-svgmin Configuration


    ```

    svgmin: {

        app: {

          options: {

            plugins: [

              { removeViewBox: true },

              { removeUselessStrokeAndFill: true }

            ]

          },

          files: [{

            expand: true,

            cwd: ''build/svg'',

            src: [''**/*.svg''],

            dest: ''app/img/'',

            ext: ''.min.svg''

          }]

        }

      }

    ```


    The configuration shown in [Listing 5-18](#part0012.html#list18) demonstrates
    the simplest of the configurations required to optimize SVG files within a project.
    There are two options defined: removeViewBox and removeUselessStrokeAndFill. The
    first of these options removes the viewBox attribute from the root SVG element.
    The second will remove strokes that have an accompanying stroke-width attribute
    set to 0 or none. If the SVG contains elements with the attribute fill set to
    none and the opacity set to 0, then fill-opacity is removed. In addition, grunt-svgmin
    will also remove whitespace, comments, and doctype declarations from the SVG.
    [Listing 5-19](#part0012.html#list19) shows a sample input SVG file, followed
    by the optimized version in [Listing 5-20](#part0012.html#list20).


    [***Listing 5-19***](#part0012.html#_list19). SVG File Before Optimization


    ```

    <?xml version="1.0" standalone="no"?>

    <!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">

    <svg xmlns="http://www.w3.org/2000/svg" width="39" height="32" viewBox="0 0 39
    32">

      <!-- tick icon -->

      <path stroke="0" stroke-width="0" fill="none" fill-opacity="0" d="M15.815 32l23.475-28.046-4.695-3.954-19.521
    23.228-11.12-9.266-1.954 10.695z"/>

    </svg>

    ```


    [***Listing 5-20***](#part0012.html#_list20). SVG File Optimized by grunt-svgmin


    ```

    <svg xmlns="http://www.w3.org/2000/svg" width="39" height="32"><path d="M15.815
    32L39.29 3.954 34.595 0l-19.52 23.228-11.12-9.266L2 24.657z" fill="none"/></svg>

    ```


    The grunt-svgmin plug-in, as with other minification plug-ins, outputs the percentage
    reduction in file size after the minification has been applied. [Figure 5-6](#part0012.html#Fig6)
    shows a sample output of the plug-in.


    ![9781484200148_Fig05-06.jpg](images/00037.jpeg)


    [Figure 5-6](#part0012.html#_Fig6). Sample output from grunt-svgmin


    Generating SVG Sprites


    There are a number of ways an SVG image can be included in a page, among them
    is using the object element, an iframe tag, a img tag, or embedding the content
    directly in the document. In addition to these methods, SVG files can also be
    references as backgrounds in CSS. As with all page assets, we have to attempt
    to reduce the number of requests required to download the whole page. This rule
    also applies to SVG files. Imagine a page with a lot of icons for a menu system.
    If each icon in the menu references an SVG file via an img element or is applied
    using a CSS background property, this could generate a number of unnecessary requests.
    As with raster images, we can combine SVG files into a single file and apply this
    instead of individual files. Doing so offers the benefits of have a single HTTP
    request for all images, and the SVG sprite can be compressed using gzip, offering
    further bandwidth reductions. To achieve these improvements, we can introduce
    a new plug-in called grunt-svg-sprite. [Listing 5-21](#part0012.html#list21) demonstrates
    some sample configuration for grunt-svg-sprite.


    [***Listing 5-21***](#part0012.html#_list21). grunt-svg-sprite Configuration


    ```

    svgsprite: {

      app : {

        options: {

          render: {

            scss: {

              dest: ''../../build/styles/_font.scss''

            },

            css: false

          },

          spritedir: '''',

          padding: 35,

          layout: ''vertical''

        },

        src: ''build/svg/'',

        dest: ''app/img/''

      }

    }

    ```


    The configuration outlined in [Listing 5-21](#part0012.html#list21) will generate
    an SVG sprite and an accompanying SCSS file. To achieve this, the render option
    has been set with a destination for the SCSS file. It should be noted that this
    path is relative to the destination directory defined by the dest option. Also,
    to disable CSS output, the css option has to be set to false. The next option
    defined, spritedir, prevents the sprite from being placed within a dedicated folder.
    In our example, the generated sprite will be output in the root of the dest folder.
    The padding option is the same as the grunt-spritesmith padding option. It controls
    the padding to apply around each icon. The final option supplied is layout. This
    controls how each icon is laid out in the SVG sprite. This accepts values of vertical,
    horizontal, or diagonal.


    The SVG sprite can easily be integrated into our existing SASS workflow, by adding
    an import to the top of the main.scss file, as demonstrated in [Listing 5-22](#part0012.html#list22).


    [***Listing 5-22***](#part0012.html#_list22). Adding an SVG Sprite to a SASS File


    ```

    @import ''font;

    ```


    The compiled CSS will now have new CSS selectors defined, one for each icon included
    in the sprite. To use one of these icons, we can create HTML, as shown in [Listing
    5-23](#part0012.html#list23).


    [***Listing 5-23***](#part0012.html#_list23). Demonstrating Using the SVG Sprite


    ```

    <div class="svg-circle"></div>

    ```


    The HTML in [Listing 5-23](#part0012.html#list23) will apply the CSS background
    property to the div element that will render the icon corresponding to the originating
    circle.svg file.


    Generating Icon Fonts'
  trans: "\n与 CSS 和 JavaScript 一样，SVG 文件也可以被压缩。这主要源于一个事实：与其他基于文本的文件格式一样，可以去除不必要的内容和空格。如果你从流行的图形软件包中导出\
    \ SVG 图像，这一点尤其适用。幸运的是，`Grunt` 有一个可用于优化 SVG 文件的插件，并能在你的应用程序中直接使用。我现在要介绍的插件叫做 `grunt-svgmin`。`grunt-svgmin`\
    \ 封装了 Node.js 库 `SVGO`，这是一个 SVG 优化器。`SVGO` 将执行诸如删除空属性、注释、文档类型声明以及将样式转换为属性等优化操作。Listing\
    \ 5-18 展示了一个 `grunt-svgmin` 的示例配置。\n\n***Listing 5-18***. `grunt-svgmin` 配置\n\n\
    ```\nsvgmin: {\n    app: {\n      options: {\n        plugins: [\n          {\
    \ removeViewBox: true },\n          { removeUselessStrokeAndFill: true }\n   \
    \     ]\n      },\n      files: [{\n        expand: true,\n        cwd: 'build/svg',\n\
    \        src: ['**/*.svg'],\n        dest: 'app/img/',\n        ext: '.min.svg'\n\
    \      }]\n    }\n  }\n```\n\nListing 5-18 中展示的配置演示了在项目中优化 SVG 文件所需的最简单配置。这里定义了两个选项：`removeViewBox`\
    \ 和 `removeUselessStrokeAndFill`。第一个选项会从根 `<svg>` 元素中移除 `viewBox` 属性。第二个选项会移除那些\
    \ `stroke-width` 属性设置为 `0` 或 `none` 的描边。如果 SVG 包含 `fill` 属性设置为 `none` 且 `opacity`\
    \ 设置为 `0` 的元素，则 `fill-opacity` 会被移除。此外，`grunt-svgmin` 还会从 SVG 中移除空格、注释和文档类型声明。Listing\
    \ 5-19 展示了一个示例输入 SVG 文件，优化后的版本见 Listing 5-20。\n\n***Listing 5-19***. 优化前的 SVG\
    \ 文件\n\n```\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"\
    -//W3C//DTD SVG 1.1//EN\" \"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
    >\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"39\" height=\"32\" viewBox=\"\
    0 0 39 32\">\n  <!-- tick icon -->\n  <path stroke=\"0\" stroke-width=\"0\" fill=\"\
    none\" fill-opacity=\"0\" d=\"M15.815 32l23.475-28.046-4.695-3.954-19.521 23.228-11.12-9.266-1.954\
    \ 10.695z\"/>\n</svg>\n```\n\n***Listing 5-20***. 经 `grunt-svgmin` 优化后的 SVG 文件\n\
    \n```\n<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"39\" height=\"32\"><path\
    \ d=\"M15.815 32L39.29 3.954 34.595 0l-19.52 23.228-11.12-9.266L2 24.657z\" fill=\"\
    none\"/></svg>\n```\n\n与其他压缩插件一样，`grunt-svgmin` 插件会在压缩后输出文件大小的缩减百分比。Figure 5-6\
    \ 展示了该插件的一个示例输出。\n\n![9781484200148_Fig05-06.jpg](img/00037.jpeg)\n\nFigure 5-6.\
    \ `grunt-svgmin` 的示例输出\n\n## 生成 SVG Sprites\n\nSVG 图像可以通过多种方式包含在页面中，包括使用 `<object>`\
    \ 元素、`<iframe>` 标签、`<img>` 标签，或者将内容直接嵌入文档。除这些方法外，SVG 文件也可以在 CSS 中被引用为背景。与所有页面资源一样，我们必须尽量减少下载整个页面所需的请求数量。这个规则同样适用于\
    \ SVG 文件。想象一个页面，其菜单系统包含大量图标。如果菜单中的每个图标都通过 `<img>` 元素引用一个 SVG 文件，或者使用 CSS `background`\
    \ 属性来应用，这可能会产生许多不必要的请求。与光栅图像一样，我们可以将多个 SVG 文件合并成一个单一文件，并应用它来代替单个文件。这样做的好处是所有图像只需一次\
    \ HTTP 请求，并且这个 SVG Sprite 可以使用 gzip 进行压缩，从而进一步减少带宽消耗。为了实现这些改进，我们可以引入一个名为 `grunt-svg-sprite`\
    \ 的新插件。Listing 5-21 展示了 `grunt-svg-sprite` 的一些示例配置。\n\n***Listing 5-21***. `grunt-svg-sprite`\
    \ 配置\n\n```\nsvgsprite: {\n  app : {\n    options: {\n      render: {\n      \
    \  scss: {\n          dest: '../../build/styles/_font.scss'\n        },\n    \
    \    css: false\n      },\n      spritedir: '',\n      padding: 35,\n      layout:\
    \ 'vertical'\n    },\n    src: 'build/svg/',\n    dest: 'app/img/'\n  }\n}\n```\n\
    \nListing 5-21 中概述的配置将生成一个 SVG Sprite 和一个配套的 SCSS 文件。为了实现这一点，`render` 选项被设置为包含\
    \ SCSS 文件的目标路径。需要注意的是，此路径是相对于由 `dest` 选项定义的目标目录的。另外，要禁用 CSS 输出，需要将 `css` 选项设置为\
    \ `false`。定义的下一个选项是 `spritedir`，它阻止 sprite 被放置在一个专用文件夹中。在我们的示例中，生成的 sprite 将输出在\
    \ `dest` 文件夹的根目录下。`padding` 选项与 `grunt-spritesmith` 的 `padding` 选项相同，它控制每个图标周围的间距。提供的最后一个选项是\
    \ `layout`，它控制每个图标在 SVG Sprite 中的布局方式。它接受 `vertical`、`horizontal` 或 `diagonal`\
    \ 这几个值。\n\n通过将导入语句添加到 `main.scss` 文件的顶部，可以轻松地将 SVG Sprite 集成到我们现有的 SASS 工作流中，如\
    \ Listing 5-22 所示。\n\n***Listing 5-22***. 将 SVG Sprite 添加到 SASS 文件\n\n```\n@import\
    \ 'font';\n```\n\n编译后的 CSS 现在将包含新的 CSS 选择器，每个选择器对应 sprite 中包含的一个图标。要使用这些图标之一，我们可以创建\
    \ HTML，如 Listing 5-23 所示。\n\n***Listing 5-23***. 演示如何使用 SVG Sprite\n\n```\n<div\
    \ class=\"svg-circle\"></div>\n```\n\nListing 5-23 中的 HTML 会将 CSS `background`\
    \ 属性应用于 `div` 元素，该元素会渲染出与原始 `circle.svg` 文件相对应的图标。\n\n## 生成图标字体\n"
- fmt: "在结束本章之前，我们将探究如何使用 `Grunt` 生成网页字体，以支持 Internet Explorer 9 及更高版本的可缩放图标。图标字体已成为为页面应用图标的一种流行方式，它既适用于标准像素密度屏幕，也适用于更高像素密度的显示器。有许多网站提供免费资源，例如\
    \ `Font Awesome`；然而，选择大型图标字体可能会对用户体验产生负面影响，因为图标可能需要很长时间下载，而整份字体中只有一小部分被使用。最佳方法是创建一种仅包含应用程序或网站将使用的图标，从而节省宝贵的带宽。`Grunt`\
    \ 有一个插件可用于从一系列 `SVG` 文件创建字体。该插件名为 `grunt-webfont`。[清单 5-24](#part0012.html#list24)\
    \ 演示了 `grunt-webfont` 的示例配置。\n\n[***Listing 5-24***](#part0012.html#_list24).\
    \ `grunt-webfont` 配置\n\n```\nwebfont: {\n  icons: {\n    options: {\n      font:\
    \ 'custom',\n      stylesheet: 'scss',\n      relativeFontPath: '../fonts',\n\
    \      htmlDemo: false\n    },\n    destCss: 'build/styles/',\n    src: 'build/svg/**/*.svg',\n\
    \    dest: 'app/fonts'\n  }\n}\n```\n\n[清单 5-24](#part0012.html#list24) 中的配置定义了许多选项，类似于\
    \ `grunt-spritesmith`，因为 `grunt-webfont` 能够以几乎相同的方式生成 `CSS`、`SCSS` 或 `LESS`。第一个选项定义要生成的字体名称。其次，生成的\
    \ `CSS` 类型由 `stylesheet` 选项控制。此选项接受 `css`、`less`、`sass` 和 `scss` 值。下一个选项 `relativeFontPath`\
    \ 控制 `CSS` 输出中定义的字体路径。默认情况下，`grunt-webfont` 会生成一个用于加载字体的演示 `HTML` 文件。将此选项设置为 `false`\
    \ 可阻止生成 `HTML` 演示文件。`CSS` 的位置可以通过设置 `destCss` 选项来控制。`destCss` 选项接受生成的 `CSS` 文件放置的目录。我们配置中的最后两个选项决定哪些\
    \ `SVG` 文件包含在我们的字体中，以及生成的字体的放置位置。\n\n当插件创建字体时，它会输出已为给定字体选择的字形数量。如[图 5-7](#part0012.html#Fig7)\
    \ 所示。\n\n![9781484200148_Fig05-07.jpg](images/00038.jpeg)\n\n[Figure 5-7](#part0012.html#_Fig7).\
    \ `grunt-webfont` 示例输出\n\n## 总结\n\n在本章中，我介绍了如何利用 `Grunt` 来执行生成网站优化视觉资源的重复且耗时的任务。在本章前半部分，我们了解了各种用于处理栅格图像的插件，然后转向了基于矢量的图形，如\
    \ `SVG`。本章重点讨论了通过合并和压缩视觉资源来减轻页面重量，旨在提升生产环境中应用程序的性能。\n\n下一章将重点介绍使用 `Grunt` 创建一个用于在本地查看和测试应用程序的\
    \ `Web` 服务器。\n\n# 第 6 章\n\n![image](images/00005.jpeg)\n\n## 使用 Grunt 进行测试和本地开发\n\
    \n在前几章中，我们专注于如何自动化构建过程，以优化我们的资源并确保它们达到特定的质量标准。在本章中，我们将重点介绍使用 `Grunt` 设置本地 `Web`\
    \ 服务器。设置完成后，我们将探索使用本地 `Web` 服务器在无头浏览器和实际浏览器中执行测试。为了进一步确保我们正在构建的软件符合现代开发的最佳实践，我们将把开发环境暴露到互联网上，从而让我们能够自动化运行性能测试。\n\
    \n### 设置本地服务器\n\n由于 `Grunt` 是构建在 `npm` 环境之上的，设置本地 `Web` 服务器非常简单，因为有众多可用的 `npm`\
    \ 包可以用于创建它们。更简单的是，有许多 `Grunt` 插件可以自动化启动本地 `Web` 服务器。有一些插件可以启动服务器，使用流行的 `Web` 框架，如\
    \ `Flash (Python)`、`Sinatra (Ruby)` 和 `Express (Node)`。在本章中，我们将使用 `grunt-contrib-connect`。这个插件封装了\
    \ `npm` 包 `connect` 和 `connect-livereload`，为静态发布提供了一个多功能的本地开发环境。在此上下文中，静态发布指的是将资源动态生成为静态文件，以便在开发或生产环境中使用的过程。\n\
    \n首先，我们必须将 `grunt-contrib-connect` 添加到我们的项目中。与所有 `Grunt` 插件一样，这只需一个简单的 `npm install`\
    \ 命令，如[清单 6-1](#part0013.html#list1) 所示。\n\n[***Listing 6-1***](#part0013.html#_list1).\
    \ 安装 `grunt-contrib-connect`\n\n```\nnpm install grunt-contrib-connect --save-dev\n\
    ```\n\n一旦插件成功添加到项目后，我们接下来通过在 `Gruntfile.js` 文件中定义配置来配置我们的本地 Web 服务器。[清单 6-2](#part0013.html#list2)\
    \ 提供了设置一个简单 `HTTP` 服务器的示例配置。我们将在本章后面探讨设置 `HTTPS` 服务器。[清单 6-2](#part0013.html#list2)\
    \ 中的配置将启动一个运行在 `8000` 端口、响应任何主机名、根目录为应用程序文件夹 `app` 的本地 `Web` 服务器。要启动 Web 服务器，你必须运行\
    \ `grunt`，如[清单 6-3](#part0013.html#list3) 所示，并且你应该在终端中看到与[图 6-1](#part0013.html#Fig1)\
    \ 类似的输出。如果你现在打开浏览器并尝试访问配置在 `8000` 端口上的 Web 服务器（访问 `http://localhost:8000`），你会发现\
    \ Web 服务器不可用。你可能已经注意到，一旦 Web 服务器启动，`Grunt` 就会退出。当 `Grunt` 退出时，`connect` Web 服务器也会关闭。`grunt-contrib-connect`\
    \ 可以与其他插件（如 `grunt-contrib-jasmine`）结合使用，以自动化运行测试。测试运行完毕后，Web 服务器可以关闭。然而，在本地开发或在浏览器中调试问题时，保持\
    \ Web 服务器运行会很方便。我们现在将更新配置，以允许我们持续运行服务器。\n\n[***Listing 6-2***](#part0013.html#_list2).\
    \ 配置 `Connect` 以运行本地 `Web` 服务器\n\n```\nconnect: {\n    server: {\n      options:\
    \ {\n        port: 8000,\n        protocol: 'http',\n        hostname: '*',\n\
    \        base: './app'\n      }\n    }\n  }\n```\n\n![9781484200148_Fig06-01.jpg](images/00039.jpeg)\n\
    \n[Figure 6-1](#part0013.html#_Fig1). 连接、启动和停止本地 `Web` 服务器\n\n[***Listing 6-3***](#part0013.html#_list3).\
    \ 使用 `grunt-contrib-connect` 启动一个 `Web` 服务器\n\n```\ngrunt connect:server\n```\n\
    \n### 保持服务器运行\n\n为了允许我们运行一个不会立即退出的服务器，我们必须修改配置以包含 `keepalive` 选项。在[清单 6-4](#part0013.html#list4)\
    \ 中，我们为另一个可用于本地开发的 `Web` 服务器定义了一个额外配置。\n\n[***Listing 6-4***](#part0013.html#_list4).\
    \ 配置 `connect` 以运行一个用于开发的本地 `Web` 服务器\n\n```\nconnect: {\n    dev: {\n      options:\
    \ {\n        port: 8001,\n        protocol: 'http',\n        hostname: '*',\n\
    \        base: './app',\n        keepalive: true\n      }\n    }\n  }\n```"
  raw: 'Before concluding this chapter, we will investigate how Grunt can be used
    to generate web fonts to support scalable icons for Internet Explorer 9 and later
    versions. Icon fonts have become a popular approach to applying icons to pages
    that works for both standard pixel density screens and higher pixel density displays.
    There are a number of sites that offer free resources, such as Font Awesome; however,
    choosing a large icon font can have a negative impact on a user’s experience,
    as the icon can take a long time to download and only a small percentage of the
    whole font is used. The optimum approach is to create a font that contains only
    the icons that your application or site will use and save valuable bandwidth.
    Grunt has a plug-in available for creating a font from a series of SVG files.
    The plug-in is called grunt-webfont. [Listing 5-24](#part0012.html#list24) demonstrates
    a sample configuration for grunt-webfont.


    [***Listing 5-24***](#part0012.html#_list24). grunt-webfont Configuration


    ```

    webfont: {

      icons: {

        options: {

          font: ''custom'',

          stylesheet: ''scss'',

          relativeFontPath: ''../fonts'',

          htmlDemo: false

        },

        destCss: ''build/styles/'',

        src: ''build/svg/**/*.svg'',

        dest: ''app/fonts''

      }

    }

    ```


    The configuration in [Listing 5-24](#part0012.html#list24) defines a number of
    options similar to those of grunt-spritesmith, as grunt-webfont is capable of
    producing CSS, SCSS, or LESS in much the same way. The first option defines the
    name of the font to be produced. Second, the type of CSS produced is controlled
    by the stylesheet option. This accepts values of css, less, sass, and scss. The
    next option, relativeFontPath, controls the path to the font defined in CSS output.
    By default, grunt-webfont produces a demonstration HTML file that loads the font.
    Setting this option to false prevents the HTML demonstration file from being generated.
    The location of the CSS can be controlled by setting the option destCss. The destCss
    option accepts the directory in which the generated CSS will be placed. The final
    two options in our configuration determine which SVG files are included in our
    font and the location in which the generated font is placed.


    As the plug-in creates the font, it outputs the number of glyphs that have been
    selected for a given font. This is shown in [Figure 5-7](#part0012.html#Fig7).


    ![9781484200148_Fig05-07.jpg](images/00038.jpeg)


    [Figure 5-7](#part0012.html#_Fig7). grunt-webfont sample output


    Summary


    In this chapter, I’ve covered how Grunt can be utilized to perform the repetitive
    and time-consuming tasks of generating optimized visual assets for web sites.
    In the first half the chapter, we looked at a variety of plug-ins for working
    raster images, before moving on to vector-based graphics such as SVG. This chapter
    has focused heavily on reducing page weight through combining and compressing
    visual assets, in an aim to booster performance in our production applications.


    The next chapter will focus on using Grunt to create a web server for viewing
    and testing our applications locally.


    CHAPTER 6


    ![image](images/00005.jpeg)


    Using Grunt for Testing and Local Development


    In previous chapters, we’ve concentrated on how to automate the build process,
    to optimize our assets and ensure they meet certain quality standards. In this
    chapter, we will focus on using Grunt to set up a local web server. Once set up,
    we’ll explore using our local web server to perform tests that run in headless
    and actual browsers. To further ensure that the software we’re building meets
    best practices of modern development, we’ll expose our development environment
    to the Internet, which will allow us to automate the running of performance tests.


    Setting Up a Local Server


    As Grunt is built on top of the npm environment, setting up local web servers
    is trivial, as there are a number of npm packages available for creating them.
    Making it even easier, there are a number of Grunt plug-ins available to automate
    the starting of local web servers. There are plug-ins for starting servers, using
    popular web frameworks such as Flash (Python), Sinatra (Ruby), and Express (Node).
    In this chapter, we will be using grunt-contrib-connect. This plug-in wraps the
    npm packages connect and connect-livereload to provide a versatile local development
    environment for static publishing. Static publishing, in this context, refers
    to the process of dynamically generating assets to a static file for use in development
    or production.


    To get started, we must first add grunt-contrib-connect to our project. As with
    all Grunt plug-ins, this is a simple npm install command, as shown in [Listing
    6-1](#part0013.html#list1).


    [***Listing 6-1***](#part0013.html#_list1). Installing grunt-contrib-connect


    ```

    npm install grunt-contrib-connect --save-dev

    ```


    Once the plug-in has successfully been added to the project, we next configure
    our local web server, by defining configuration in our Gruntfile.js file. [Listing
    6-2](#part0013.html#list2) provides a sample configuration for setting up a simple
    HTTP server. We will explore setting up an HTTPS server later in the chapter.
    The configuration in [Listing 6-2](#part0013.html#list2) will start a local web
    server running on port 8000, responding to any hostname, with the root of the
    web server being our application folder, called app. To start the web server,
    you have to run grunt, as shown in [Listing 6-3](#part0013.html#list3), and you
    should see a similar output in the terminal as in [Figure 6-1](#part0013.html#Fig1).
    If you now open your browser and try to access a web server configured on port
    8000 (visiting http://localhost:8000), you will find that the web server is unavailable.
    You may have noticed that once the web server starts, Grunt exits. As Grunt exits,
    the connect web server is also shut down. grunt-contrib-connect can be used in
    conjunction with other plug-ins, such as grunt-contrib-jasmine, to automate running
    tests. Once the tests have been run, the web server can be shut down. However,
    when developing locally or debugging an issue in the browser, it is handy to keep
    the web server running. We will now update our configuration, to allow us to keep
    our server running continuously.


    [***Listing 6-2***](#part0013.html#_list2). Configuring Connect to Run a Local
    Web Server


    ```

    connect: {

        server: {

          options: {

            port: 8000,

            protocol: ''http'',

            hostname: ''*'',

            base: ''./app’

          }

        }

      }

    ```


    ![9781484200148_Fig06-01.jpg](images/00039.jpeg)


    [Figure 6-1](#part0013.html#_Fig1). Connecting, starting, and stopping a local
    web server


    [***Listing 6-3***](#part0013.html#_list3). Starting a Web Server with grunt-contrib-connect


    ```

    grunt connect:server

    ```


    Keeping the Server Running


    To allow us to run a server that does not exit immediately, we have to modify
    our configuration to include the option keepalive. In [Listing 6-4](#part0013.html#list4),
    we define an additional configuration for another web server that can be run for
    local development.


    [***Listing 6-4***](#part0013.html#_list4). Configuring connect to Run a Local
    Web Server for Development


    ```

    connect: {

        dev: {

          options: {

            port: 8001,

            protocol: ''http'',

            hostname: ''*'',

            base: ''./app'',

            keepalive: true

          }

        }

      }

    ```'
  trans: "\n在结束本章之前，我们将探究如何使用 `Grunt` 生成网页字体，以支持 Internet Explorer 9 及更高版本的可缩放图标。图标字体已成为为页面应用图标的一种流行方式，它既适用于标准像素密度屏幕，也适用于更高像素密度的显示器。有许多网站提供免费资源，例如\
    \ `Font Awesome`；然而，选择大型图标字体可能会对用户体验产生负面影响，因为图标可能需要很长时间下载，而整份字体中只有一小部分被使用。最佳方法是创建一种仅包含应用程序或网站将使用的图标，从而节省宝贵的带宽。`Grunt`\
    \ 有一个插件可用于从一系列 `SVG` 文件创建字体。该插件名为 `grunt-webfont`。清单 5-24 演示了 `grunt-webfont`\
    \ 的示例配置。\n\n***清单 5-24***. `grunt-webfont` 配置\n\n```\nwebfont: {\n  icons: {\n\
    \    options: {\n      font: 'custom',\n      stylesheet: 'scss',\n      relativeFontPath:\
    \ '../fonts',\n      htmlDemo: false\n    },\n    destCss: 'build/styles/',\n\
    \    src: 'build/svg/**/*.svg',\n    dest: 'app/fonts'\n  }\n}\n```\n\n清单 5-24\
    \ 中的配置定义了许多选项，类似于 `grunt-spritesmith`，因为 `grunt-webfont` 能够以几乎相同的方式生成 `CSS`、`SCSS`\
    \ 或 `LESS`。第一个选项定义要生成的字体名称。其次，生成的 `CSS` 类型由 `stylesheet` 选项控制。此选项接受 `css`、`less`、`sass`\
    \ 和 `scss` 值。下一个选项 `relativeFontPath` 控制 `CSS` 输出中定义的字体路径。默认情况下，`grunt-webfont`\
    \ 会生成一个用于加载字体的演示 `HTML` 文件。将此选项设置为 `false` 可阻止生成 `HTML` 演示文件。`CSS` 的位置可以通过设置 `destCss`\
    \ 选项来控制。`destCss` 选项接受生成的 `CSS` 文件放置的目录。我们配置中的最后两个选项决定哪些 `SVG` 文件包含在我们的字体中，以及生成的字体的放置位置。\n\
    \n当插件创建字体时，它会输出已为给定字体选择的字形数量。如图 5-7 所示。\n\n![9781484200148_Fig05-07.jpg](img/00038.jpeg)\n\
    \n图 5-7. `grunt-webfont` 示例输出\n\n## 总结\n\n在本章中，我介绍了如何利用 `Grunt` 来执行生成网站优化视觉资源的重复且耗时的任务。在本章前半部分，我们了解了各种用于处理栅格图像的插件，然后转向了基于矢量的图形，如\
    \ `SVG`。本章重点讨论了通过合并和压缩视觉资源来减轻页面重量，旨在提升生产环境中应用程序的性能。\n\n下一章将重点介绍使用 `Grunt` 创建一个用于在本地查看和测试应用程序的\
    \ `Web` 服务器。\n\n# 第 6 章\n\n![image](img/00005.jpeg)\n\n## 使用 Grunt 进行测试和本地开发\n\
    \n在前几章中，我们专注于如何自动化构建过程，以优化我们的资源并确保它们达到特定的质量标准。在本章中，我们将重点介绍使用 `Grunt` 设置本地 `Web`\
    \ 服务器。设置完成后，我们将探索使用本地 `Web` 服务器在无头浏览器和实际浏览器中执行测试。为了进一步确保我们正在构建的软件符合现代开发的最佳实践，我们将把开发环境暴露到互联网上，从而让我们能够自动化运行性能测试。\n\
    \n### 设置本地服务器\n\n由于 `Grunt` 是构建在 `npm` 环境之上的，设置本地 `Web` 服务器非常简单，因为有众多可用的 `npm`\
    \ 包可以用于创建它们。更简单的是，有许多 `Grunt` 插件可以自动化启动本地 `Web` 服务器。有一些插件可以启动服务器，使用流行的 `Web` 框架，如\
    \ `Flash (Python)`、`Sinatra (Ruby)` 和 `Express (Node)`。在本章中，我们将使用 `grunt-contrib-connect`。这个插件封装了\
    \ `npm` 包 `connect` 和 `connect-livereload`，为静态发布提供了一个多功能的本地开发环境。在此上下文中，静态发布指的是将资源动态生成为静态文件，以便在开发或生产环境中使用的过程。\n\
    \n首先，我们必须将 `grunt-contrib-connect` 添加到我们的项目中。与所有 `Grunt` 插件一样，这只需一个简单的 `npm install`\
    \ 命令，如清单 6-1 所示。\n\n***清单 6-1***. 安装 `grunt-contrib-connect`\n\n```\nnpm install\
    \ grunt-contrib-connect --save-dev\n```\n\n一旦插件成功添加到项目后，我们接下来通过在 `Gruntfile.js`\
    \ 文件中定义配置来配置我们的本地 Web 服务器。清单 6-2 提供了设置一个简单 `HTTP` 服务器的示例配置。我们将在本章后面探讨设置 `HTTPS`\
    \ 服务器。清单 6-2 中的配置将启动一个运行在 `8000` 端口、响应任何主机名、根目录为应用程序文件夹 `app` 的本地 `Web` 服务器。要启动\
    \ Web 服务器，你必须运行 `grunt`，如清单 6-3 所示，并且你应该在终端中看到与图 6-1 类似的输出。如果你现在打开浏览器并尝试访问配置在\
    \ `8000` 端口上的 Web 服务器（访问 `http://localhost:8000`），你会发现 Web 服务器不可用。你可能已经注意到，一旦\
    \ Web 服务器启动，`Grunt` 就会退出。当 `Grunt` 退出时，`connect` Web 服务器也会关闭。`grunt-contrib-connect`\
    \ 可以与其他插件（如 `grunt-contrib-jasmine`）结合使用，以自动化运行测试。测试运行完毕后，Web 服务器可以关闭。然而，在本地开发或在浏览器中调试问题时，保持\
    \ Web 服务器运行会很方便。我们现在将更新配置，以允许我们持续运行服务器。\n\n***清单 6-2***. 配置 `Connect` 以运行本地 `Web`\
    \ 服务器\n\n```\nconnect: {\n    server: {\n      options: {\n        port: 8000,\n\
    \        protocol: 'http',\n        hostname: '*',\n        base: './app'\n  \
    \    }\n    }\n  }\n```\n\n![9781484200148_Fig06-01.jpg](img/00039.jpeg)\n\n图\
    \ 6-1. 连接、启动和停止本地 `Web` 服务器\n\n***清单 6-3***. 使用 `grunt-contrib-connect` 启动一个 `Web`\
    \ 服务器\n\n```\ngrunt connect:server\n```\n\n### 保持服务器运行\n\n为了允许我们运行一个不会立即退出的服务器，我们必须修改配置以包含\
    \ `keepalive` 选项。在清单 6-4 中，我们为另一个可用于本地开发的 `Web` 服务器定义了一个额外配置。\n\n***清单 6-4***.\
    \ 配置 `connect` 以运行一个用于开发的本地 `Web` 服务器\n\n```\nconnect: {\n    dev: {\n      options:\
    \ {\n        port: 8001,\n        protocol: 'http',\n        hostname: '*',\n\
    \        base: './app',\n        keepalive: true\n      }\n    }\n  }\n```\n"
- fmt: 'Running the preceding task should produce an output like that demonstrated
    in [Figure 6-2](#part0013.html#Fig2). It is important to note that in our second
    web server, we’ve configured it to run on port 8001. This will allow us to later
    run our tests against our server on port 8000, while allowing our development
    server to continue to run. As expected, if you try to bind two web servers to
    the same port number, the second will fail to start ([Figure 6-3](#part0013.html#Fig3)).
    This is important to remember later, when we have tests running in the background
    when a file changes.


    ![9781484200148_Fig06-02.jpg](images/00040.jpeg)


    [Figure 6-2](#part0013.html#_Fig2). Running a local web server indefinitely


    ![9781484200148_Fig06-03.jpg](images/00041.jpeg)


    [Figure 6-3](#part0013.html#_Fig3). Attempting to run two web servers on the same
    port number


    If you now visit `http://localhost:8001` in your browser, you should see our application
    running. To stop the web server, we have to press `Ctrl+C`.


    A common development pattern is to set up a development server with a Grunt task
    called `serve`. This is the pattern adopted by the Yeoman team and can be found
    in many of the generators for projects, such as Backbone.js. The `serve` task
    typically builds all the development assets, launches a web server, and then opens
    a browser for the application. [Listing 6-5](#part0013.html#list5) contains the
    configuration for a sample `serve` task.


    The task defined in [Listing 6-5](#part0013.html#list5) is a little verbose for
    demonstration purposes. As your project matures, it is best to start to break
    down tasks into groups, as it communicates to other team members what each stage
    of the build is achieving without having to know the details of each individual
    stage. We’ll be exploring how to optimize your build process in the next chapter.


    [***Listing 6-5***](#part0013.html#_list5). Sample `serve` Task for Building and
    Launching a Development Environment


    ```

    grunt.registerTask(''serve'', [

      ''clean'',

      ''useminPrepare'',

      ''sass'',

      ''bowerInstall'',

      ''autoprefixer'',

        ''jshint'',

      ''modernizr'',

      ''handlebars'',

      ''imagemin'',

      ''uncss'',

      ''copy'',

      ''cssmin'',

      ''concat'',

      ''requirejs'',

      ''rev'',

      ''usemin'',

      ''connect:dev''

    ]);

    ```


    ## Automated Browser Launching


    One step missing from the task defined in [Listing 6-5](#part0013.html#list5)
    is the automated opening of the browser. This can be achieved by either using
    `grunt-open` or `grunt-contrib-connect`. For our current workflow, we will keep
    things simple and use `grunt-contrib-connect`. As our workflow becomes more advanced,
    we’ll swap to use `grunt-open`.


    [Listing 6-6](#part0013.html#_list6) has an updated configuration for our development
    server that will automatically open our application after the web server has been
    started.


    [***Listing 6-6***](#part0013.html#_list6). Using `grunt-contrib-connect` to Launch
    the Browser After the Web Server Starts


    ```

    connect: {

      dev: {

        options: {

          port: 8001,

          protocol: ''http'',

          hostname: ''*'',

          base: ''./app'',

          keepalive: true,

          open: true

        }

      }

    }

    ```


    Adding the option `open` and setting the value to `true` will lead to your default
    browser automatically opening your application immediately after the web server
    has started.


    ## Logging Requests to Our Server


    With the current configuration, we cannot see requests being sent to our web server,
    because logging is not enabled by default. While developing locally, it can be
    handy to see which requests have been made successfully, the HTTP response code,
    and the time taken to generate the response. Fortunately, `grunt-contrib-connect`
    has this feature available. To enable logging, we have to set the `debug` option
    to `true`, as shown in [Listing 6-7](#part0013.html#list7). [Figure 6-4](#part0013.html#Fig4)
    provides a sample output from our application for the initial page load.


    [***Listing 6-7***](#part0013.html#_list7). Adding `debug` Option to Development
    Server Configuration


    ```

    dev: {

      options: {

        port: 8001,

        protocol: ''http'',

        hostname: ''*'',

        base: ''./app'',

        keepalive: true,

        open: true,

        debug: true

      }

    }

    ```


    ![9781484200148_Fig06-04.jpg](images/00042.jpeg)


    [Figure 6-4](#part0013.html#_Fig4). `grunt-contrib-connect` logging requests sent
    to web server


    ## Extending Our Server with Compressed Responses


    Now that we have our web server running, automatically opening and logging each
    request to our terminal, let’s explore extending our web server with new features.
    As `grunt-contrib-connect` wraps the Node module `connect`, at the time of writing,
    version 2.x, we can extend our connect server with all the available middleware
    plug-ins ([https://github.com/senchalabs/connect/wiki](https://github.com/senchalabs/connect/wiki)).
    There is middleware available for features such as BasicAuth, OAuth, and caching.
    In our example, we’ll look to use one of the built-in middleware features: compression.
    This will dynamically server gzipped content, if the client sends the correct
    headers in the request. As `grunt-contrib-connect` wraps version 2.x of `connect`,
    the compression middleware is part of `connect`. In the latest version of `connect`,
    the core middleware features have been migrated to their own modules.


    [Listing 6-8](#part0013.html#_list8) modifies our existing development web server
    configuration to support compression of our server responses.


    [***Listing 6-8***](#part0013.html#_list8). Adding Middleware to Support Compression


    ```

    dev: {

      options: {

        port: 8001,

        protocol: ''http'',

        hostname: ''*'',

        base: ''./app'',

        keepalive: true,

        open: true,

        debug: true,

        middleware: function(connect, options, middlewares) {

          middlewares.unshift(connect.compress());

          return middlewares;

        }

      }

    }

    ```


    To add middleware, we define a `middleware` option and provide a function that
    modifies the existing set of middleware modules, by adding the built-in `compress`
    middleware. Each request that is sent to the web server will now pass through
    this middleware.


    With the new middleware added to the web server, we should confirm that the responses
    are being compressed when requested. To test whether this feature is working as
    expected, we can use the command-line tool `curl` to return the number of bytes
    for each request. [Figure 6-5](#part0013.html#Fig5) demonstrates two `curl` commands
    used to test the size of the response. The `curl` command does not send the `Accept-Encoding:
    gzip,deflate` header, and the response is not compressed. The second `curl` command
    adds the `Accept-Encoding` header to the request, and the web server responds
    correctly with a compressed response.


    ![9781484200148_Fig06-05.jpg](images/00043.jpeg)


    [Figure 6-5](#part0013.html#_Fig5). Testing whether our middleware has been loaded
    as expected


    At this point, we have a robust local development server and another test server
    ready for integration with a test runner. We have the ability to run our application
    locally and even compress the response, as we’d want in production. In the next
    chapter, I will introduce the ability to automatically reload assets in the browser
    each time a file is modified on disk, without needing the ability to reload or
    refresh the browser. Next, we will start to automate testing our application in
    a variety of ways: unit, integration, accessibility, and performance.


    ## Testing


    In addition to running a local development server, we can automate the running
    of tests using Grunt. There is no denying the benefits of having a good suite
    of tests for an application. Tests can help prevent issues being released to production,
    act as a communication tool between team members, reduce risk when making changes
    to a complex application, and they are repeatable. A suite of automated tests
    can also dramatically reduce the time needed to verify an application required
    to run across multiple devices, as the test suite can be run in parallel on several
    devices. This is particularly relevant for responsive web applications.'
