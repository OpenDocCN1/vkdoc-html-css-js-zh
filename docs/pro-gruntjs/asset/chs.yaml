- '# 关于作者


  **詹姆斯·克莱尔**是英国卡迪夫 BBC 的首席网络开发人员。在 BBC，詹姆斯供职于 BBC 新闻部旗下的 BBC 旅游团队，担任技术负责人，负责在多个平台上交付旅游产品的下一个迭代版本。


  在加入 BBC 之前，詹姆斯曾在卡迪夫的软件公司工作，为英国皇家海军、Investec 资产管理公司和 UNISON 等各类客户提供数字解决方案。尽管詹姆斯是一名前端专家，对网络性能充满热情，但他也使用
  PHP、Scala、Objective C、Java、PHP、Ruby 和 Node 构建过应用程序。他是当地社区的活跃贡献者，常在技术聚会上就云技术、浏览器性能和开发者工具等主题发表演讲。


  詹姆斯热爱技术写作，曾合著 Yeoman 项目的第一个 CodeLab，并在 .NET 杂志上发表教程。除了对技术的兴趣，他还喜欢与妻子一起旅行和骑自行车。


