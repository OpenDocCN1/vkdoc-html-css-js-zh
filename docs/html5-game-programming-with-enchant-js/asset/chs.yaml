  \ Internet Explorer 在与 `enchant.js` 库或其相关网站交互时的稳定性。\n\n在你常用的浏览器中打开 [`http://code.9leap.net`](http://code.9leap.net)，然后点击位于用户名和密码输入框下方的\"\
  注册\"链接，见图 1-6。（若显示日语界面，请向下滚动并点击\"切换至英语\"）。\n\n![A978-1-4302-4744-9_1_Fig6_HTML.jpg](img/A978-1-4302-4744-9_1_Fig6_HTML.jpg)\n\
