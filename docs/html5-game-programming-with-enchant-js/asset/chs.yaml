  \ 类\n  - 速度调整，动画\n  - `Pit` 类状态机更新\n  - 升级 `Pit` 类\n  - 版本创建\n  - 打地鼠 (Whack-A-Mole)\n\
  \  - 敲击状态\n- **规则细化**\n  - 规则设计主题\n  - `Droid` 角色帧草图\n\n### E, F\n- **enchant.js**\n\
  \  - 异步进程\n  - 层叠样式表 (CSS)\n  - 碰撞检测\n    - `intersect()` 方法\n    - 方法\n    - `within()`\
  \ 方法\n  - 核心类\n    - `Core` 类\n    - `Entity` 类\n    - 事件\n    - `Game` 对象\n   \
  \ - `Group` 类\n    - 标签\n    - 地图\n    - `Node` 类\n    - `Scene` 对象\n    - 精灵\n\
