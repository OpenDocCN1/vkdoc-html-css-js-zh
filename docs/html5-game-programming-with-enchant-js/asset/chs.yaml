  \n*献给德里克、爸爸和帕蒂。“只要一直游下去就行。”——电影《海底总动员》*\n\n**关于作者**\n\n\n![A978-1-4302-4744-9_BookFrontmatter_Fig1_HTML.jpg](img/A978-1-4302-4744-9_BookFrontmatter_Fig1_HTML.jpg)\n\
  \n布兰登·麦金尼斯是东京尤比奎特斯娱乐公司秋叶原研究中心`enchant.js`技术推广专员，拥有网页开发背景。他有着非同寻常的过往，曾参与歌剧演唱，并为最终幻想系列游戏原作曲者植松伸夫担任口译。在不进行网页开发或向用户推广`enchant.js`时，他喜欢花时间创作和录制音乐，并在东京各地探险。\n\
  \n![A978-1-4302-4744-9_BookFrontmatter_Fig2_HTML.jpg](img/A978-1-4302-4744-9_BookFrontmatter_Fig2_HTML.jpg)\n\
  \n伏见龙平从电子通信大学辍学，并于 2005 年被日本政府认定为天才程序员/超级创作者。他于 2008 年至 2010 年在九州大学任教，自 2003 年起担任尤比奎特斯娱乐公司总裁兼首席执行官。他居住在秋叶原，爱好包括品酒。\n\
  \n古川秀和是尤比奎特斯娱乐公司的技术文档工程师，在日本出版过多本关于移动开发和游戏的畅销书籍。\n\n![A978-1-4302-4744-9_BookFrontmatter_Fig3_HTML.jpg](img/A978-1-4302-4744-9_BookFrontmatter_Fig3_HTML.jpg)\n\
  \n伏见良平目前在东京大学工学部学习。他是尤比奎特斯娱乐公司`enchant.js`开发团队负责人，虽然来自冈山，但目前居住在东京。\n\n田中凉是东京大学理学部信息科学专业的学生。她开发了`enchant.js`的核心部分。\n\
  \n凯文·克拉策在德国长大，目前正在慕尼黑工业大学攻读信息学硕士学位。他曾以开发者和软件架构师的身份参与多个软件项目，其中包括`enchant.js`。他目前居住在慕尼黑，为尤比奎特斯娱乐公司从事移动端和网页端开发工作。\n\
  \n## 关于技术审校\n\n![A978-1-4302-4744-9_BookFrontmatter_Fig4_HTML.jpg](img/A978-1-4302-4744-9_BookFrontmatter_Fig4_HTML.jpg)\n\
  \n福阿德·霍斯穆德是加州州立理工大学福布斯计算机工程教授，教授交互式娱乐工程等课程。他拥有加州大学圣克鲁兹分校计算机科学博士学位。福阿德是非营利组织全球游戏创作节公司的官员，并自\
  \ 2009 年全球游戏创作节起担任首席技术专家。\n\n福阿德的研究兴趣包括人工智能、自然语言处理、机器学习以及交互式娱乐与系统。\n\n## 引言\n\n\
  如果你正在读这本书，毫无疑问你对为网页制作游戏有一定兴趣。作为在该领域有些经验的人，我有资格告诉你：你来对地方了。\n\n在过去的十年里，网页游戏发生了巨大变化。虽然网页游戏的核心概念往往随时间缓慢演变，但我们用于创建游戏工具的更新换代则快得多。在当今的网页上，即使在浏览器中完成简单的游戏相关任务，也需要编写大量代码。\n\
  \n开源游戏引擎`enchant.js`解决了这个问题，它大幅减少了编写游戏所需的代码量，并包含多个后备和兼容性函数，这些函数在后台运行，无需你做任何特殊处理，就能确保游戏在多种浏览器上流畅运行。该引擎在其原产国日本已成为非常流行的工具，并且在西方程序员中的使用也日益增多。\n\
  \n如果你是个网页编程新手，别担心！我们将一步步引导你了解`enchant.js`的工作原理、JavaScript（网页通用脚本语言——为`enchant.js`所使用）以及`enchant.js`游戏的基本元素。接着，我们会深入到更高级的主题。我们会涵盖游戏的所有必要元素，包括场景、精灵、交互性等等。此外，我们为每个概念都提供了教程。在本书的第二部分，我们将向你展示如何创建数款游戏，包括一个打地鼠游戏（2D\
  \ 和 3D 版）以及一款经典的街机风格太空射击游戏。\n\n虽然书中的某些代码示例链接到免费编程环境`code.9leap.net`上可运行的版本，但本书中的所有代码示例都可以在\
  \ Apress 网站（[`www.apress.com`](http://www.apress.com)）上通过搜索本书标题并进入页面源代码区域找到。\n\n\
  学习游戏编程是一段充满乐趣和刺激的冒险，能带来愉快的回报。如果你对库有任何疑问，请随时通过我们的官方`enchant.js`子版块（[`reddit.com/r/enchantjs`](http://reddit.com/r/enchantjs)）、[`enchantjs.com`](http://enchantjs.com)或我们的\
  \ Facebook 页面（搜索“enchant.js”）联系我们。我们的用户社区每天都在壮大，既有全新的游戏程序员，也有经验丰富的老手。\n\n祝你在游戏编程之旅中好运！\n\
  \n布兰登·麦金尼斯\n`enchant.js`技术推广专员\n\n## 致谢\n\n我首先要感谢安娜米卡·潘丘，她是世界上最耐心的协调编辑。在我撰写本书期间，她提供了专业的指导和支持。没有她的指引，这一切绝无可能实现。她的邮件总是充满激励和鼓舞，尤其在我为了赶章节截止日期而熬夜到凌晨的许多个夜晚。安娜，你的鼓励让整个过程变得更容易接受。谢谢你。\n\
