- "# 1. 开始使用 enchant.js 开发\n\n## 摘要\n\n`enchant.js` 框架由东京的 Ubiquitous Entertainment\
  \ Inc. (UEI) 秋叶原研究中心开发，最初于 2011 年 4 月发布。自那时起，它就在日本广受欢迎，并拥有越来越多来自其他国家的粉丝。`enchant.js`\
  \ 框架是一个基于 HTML5 和 JavaScript 的游戏引擎及独立代码库，使您能够开发可在 PC、Mac、iPhone、iPad 和 Android 设备上运行的应用程序。虽然使用该引擎创建的游戏应用可以在多种不同类型的设备上运行，但大多数应用都是针对智能手机使用而创建和优化的。\n\
  \n近年来，Adobe Flash 作为交互式平台的衰落，促使现代网络游戏开发者转向其他基于浏览器的普适平台，例如 HTML5 和 JavaScript，以便为其用户创建基于浏览器的体验。然而，虽然\
  \ JavaScript 最初被设计为一种非专业开发人员也能使用的语言，但如今用于在浏览器中创作游戏的 JavaScript 的复杂性，通常需要投入大量时间才能有效学习和使用。作为一个开源游戏库，`enchant.js`\
  \ 通过为开发者提供游戏创作功能来降低这种复杂性，这显著缩短了您编写基于浏览器的游戏的学习曲线，并提高了您的游戏开发速度。\n\n通过本书，您可以快速轻松地开始创建和发布游戏。如果您是编程新手，也不必担心。我们将引导您了解所有基础知识，让您能够快速上手并运行。如果您处于中级水平，我们也为您提供高级内容。我们描述了\
  \ `enchant.js` 框架的不同部分，并创建了几个游戏，包括诸如《打地鼠》和街机射击游戏等经典游戏，在此过程中让您熟悉 `enchant.js` 库所提供的全部功能。\n\
  \n## 访问 enchant.js 网站\n\n为了快速入门 `enchant.js`，请查看三个主要的 `enchant.js` 网站。每个网站都有特定的功能，可以帮助您更快速、更轻松地创建和分享游戏。\n\
  \n*   [`http://enchantjs.com`](http://enchantjs.com)：下载 `enchant.js` 代码库、查找资源并阅读编程技巧\n\
  *   [`http://code.9leap.net`](http://code.9leap.net)：在基于云的在线环境中开发、编辑和测试游戏\n*   [`http://9leap.net`](http://9leap.net)：上传、游玩和分享游戏\n\
  \n主要的 `enchant.js` 网站是您可以了解该库并下载源代码以开发自己游戏的地方。您也可以在 [`code.9leap.net`](http://code.9leap.net)\
  \ 的在线环境中开发游戏，以获得更流畅的体验。开发完游戏后，您可以将其发布到 [`9leap.net`](http://9leap.net)。图 1-1 展示了这些网站的基本关系。\n\
  \n![A978-1-4302-4744-9_1_Fig1_HTML.jpg](img/A978-1-4302-4744-9_1_Fig1_HTML.jpg)\n\
  \n图 1-1. 网站之间的关系\n\n### enchantjs.com\n\n`enchant.js` 的官方网站 [`http://enchantjs.com`](http://enchantjs.com/)\
  \ 提供了关于该库的参考信息、教程、技巧和资源。该网站会定期更新，发布来自 `enchant.js` 开发者关于新版本和功能的文章，并且完全支持日文和英文双语。网站的默认语言是英文。如果日文版出现而您希望显示英文版，请使用屏幕右侧的国旗图标将语言切换回英文。图\
  \ 1-2 展示了 `enchant.js` 的主页。\n\n![A978-1-4302-4744-9_1_Fig2_HTML.jpg](img/A978-1-4302-4744-9_1_Fig2_HTML.jpg)\n\
  \n图 1-2. [enchantjs.com](http://enchantjs.com) 主页\n\n### code.9leap.net\n\n在 [`http://code.9leap.net`](http://code.9leap.net/)\
  \ 网站上，您可以直接在网络浏览器中进行 HTML/JavaScript 的编辑、测试和分享。[`code.9leap.net`](http://code.9leap.net)\
  \ 网站支持导入 `enchant.js`，并且可以轻松上传到 [`9leap.net`](http://9leap.net)，从而使得从编程到发布的整个游戏开发周期都能在浏览器中完成。它可以在\
  \ PC、Mac 或 iPad 等设备上使用。\n\n图 1-3 展示了 [`code.9leap.net`](http://code.9leap.net) 的登录页面。在本书出版时，该网站仍处于测试开发阶段。\n\
  \n![A978-1-4302-4744-9_1_Fig3_HTML.jpg](img/A978-1-4302-4744-9_1_Fig3_HTML.jpg)\n\
  \n图 1-3. [`code.9leap.net`](http://code.9leap.net) 登录页面\n\n### 9leap.net\n\n位于 [`http://global.9leap.net`](http://global.9leap.net/)\
  \ 的 9leap 网站由 UEI 和 D2 Communications ([`www.d2c.co.jp/en`](http://www.d2c.co.jp/en))\
  \ 托管，其创建目的是发现和推广年轻开发者。该网站允许您上传、游玩和分享游戏。9leap 网站包含大量由像您这样的开发者使用 `enchant.js` 创建的游戏。在开始创建您自己的游戏之前，不妨先试试网站上的部分游戏，以感受一下\
  \ `enchant.js`。图 1-4 展示了 9leap 的主页。\n\n![A978-1-4302-4744-9_1_Fig4_HTML.jpg](img/A978-1-4302-4744-9_1_Fig4_HTML.jpg)\n\
  \n图 1-4. [`9leap.net`](http://9leap.net) 主页\n\n您还可以在该网站上参加游戏开发比赛。比赛的决赛入围者将赢得诸如最新\
  \ PC 和 Mac 电脑、书店礼品卡等奖励。此外，作为 9leap 项目的一部分，UEI 定期在日本举办 9leap 游戏编程训练营，并开始在美国也举办此类训练营。通常，这些训练营以游戏编程研讨会开始，并提供指导，帮助参与者创建自己的简单游戏。更多信息，请参阅\
  \ [enchantjs.com](http://enchantjs.com) 网站。\n\n## 兼容性与版本\n\n以下浏览器和设备支持 `enchant.js`：\n\
  \n*   Internet Explorer (IE) 9.0 及更高版本\n*   适用于 Mac OS X、Windows 和 Linux 的 Chrome\
  \ 10 及更高版本\n*   适用于 Mac OS X 和 Windows 的 Safari 5 及更高版本\n*   适用于 Mac OS X 和 Windows\
  \ 的 Firefox 3.6 及更高版本\n*   适用于 iPhone 和 iPad 的 iOS 4 及更高版本\n*   Android 2.1 及更高版本\n\
  \n表 1-1 展示了 `enchant.js` 的主要版本。在本书出版时，`enchant.js` 的最新版本是 0.6.2 版。\n\n表 1-1. `enchant.js`\
  \ 的近期版本及新增功能\n\n| 版本 | 新增功能 |\n| --- | --- |\n| 0.6.2 (当前) | • 提升在 Android 上的性能\
  \ • 改进的键绑定 |\n| 0.6.1 | • 改进的 WebAudio • 改进的时间线 |\n| 0.6.0 | • WebAudio API • DOM/Canvas\
  \ 渲染 • 动画引擎 • 核心类 |\n| 0.5.2 | • 基于时间的动画 (`tl.enchant.js`) |\n| 0.5.1 | • 错误修复 |\n\
  | 0.5.0 | • iPhone 上的声音支持 • 支持旋转和缩放属性 • Canvas 支持 • ElapsedTime 支持 |\n\n**注意**：从\
  \ 0.6.1 版本开始，`enchant.js` 采用 MIT 许可证授权。关于使用 `enchant.js` 创建的代码的企业用途，请联系 Ubiquitous\
  \ Entertainment ([`http://global.uei.co.jp/`](http://global.uei.co.jp/)) 进行咨询。\n\
  \n\n\n## enchant.js 的特性\n\nenchant.js 旨在简化游戏编程，并具备多项特性，让无论是专家还是新手开发者都能更轻松地创建游戏。该库的主要特性包括面向对象的方法论、处理游戏代码的特定方式、通过插件实现的扩展性，以及其内容库。\n\
  \n### 面向对象编程\n\n面向对象编程（OOP）是一种强调被操作对象而非操作过程的方法论。为了说明这个概念，enchant.js 中每个能在屏幕上显示的图形都是一个对象。屏幕上实际可见的部分是另一个对象（称为显示对象树）的组成部分。通过向显示对象树发出加入图形对象的命令，该图形对象就会在屏幕上变为可见。\n\
  \n清单 1-1 展示了创建一个玩家对象和一个敌人角色对象，并通过在显示对象树中注册来将其显示在屏幕上的过程。现在，你无需担心这段代码的具体工作原理。我们在此提供一个代码示例，只是为了让你快速了解\
  \ OOP 的实际应用。稍后我们会详细讲解代码示例。\n\n**清单 1-1.** 使用面向对象编程创建两个对象并将其添加到屏幕\n\n```\n// 玩家对象创建\n\
  var player = new Sprite(32, 32);\nplayer.image = game.assets['player.png'];\n\n\
  // 敌人角色对象创建\nvar enemy = new Sprite(32, 32);\nenemy.image = game.assets['enemy.png'];\n\
  \n// 在显示对象树中注册\nvar scene = game.currentScene;\nscene.addChild(player);\nscene.addChild(enemy);\n\
  ```\n\n### 异步处理\n\n异步处理是一种独立于主代码集运行的处理方式。可以把它想象成多任务处理。如果计算机正在接收要逐条运行的命令，然后在第一组命令仍在运行时，又开始接收运行其他命令的指令，这就是异步处理的一个例子。\n\
  \n由用户或其他程序发起的操作或事件由 enchant.js 异步处理。当用户未发出任何命令时，程序会静待而不做任何事，而不是在后台持续运行代码。此外，当用户被迫等待程序完成处理时，这种异步特性使得可以同时发出其他命令。\n\
  \n清单 1-2 展示了指定在特定事件发生时运行的代码段。这被称为事件处理。在此代码示例中，我们在每一帧中处理玩家对象，并处理触摸事件。具体来说，每绘制一帧，我们都希望运行（或如开发者有时所说的“执行”）某些代码。当玩游戏的用户点击或“触摸”角色时，我们希望执行不同的代码。我们在第\
  \ 3 章中详细介绍了这个过程。\n\n**清单 1-2.** 创建、设置和处理角色的异步处理\n\n```\n// 玩家（角色）对象创建\nvar player\
  \ = new Sprite(32, 32);\n\n// 每一帧中对角色的处理\nplayer.addEventListener(Event.ENTER_FRAME,\
  \ function() {\n        ...\n});\n\n// 处理触摸事件\nplayer.addEventListener(Event.TOUCH_START,\
  \ function(e) {\n        var x = e.localX;\n        var y = e.localY;\n        ...\n\
  });\n```\n\n### 插件扩展性\n\n你可以通过各种插件扩展 enchant.js 的功能，以增加更多功能。例如，有些插件允许你开发支持 D-pad\
  \ 和模拟摇杆等设备的游戏，或创建看起来像漫画书的互动游戏。我们将在本书的后续章节中向你展示如何使用其中几个插件。\n\n我们在此不提供所有 enchant.js\
  \ 插件的详尽列表，因为你可以在 [enchantjs.com](http://enchantjs.com) 网站上找到该列表以及每个插件的详细信息。你可以从该网站下载这些插件（参见\
  \ enchant.js 下载包）。\n\n### 图像和声音\n\n如果你是一名独立游戏开发者，为角色、怪物、场景等寻找图像可能是一项挑战。由于 enchant.js\
  \ 附带了一系列免版税（适用于非商业游戏）的原创游戏图像，以及来自 UEI 先前游戏发布的素材，你可以使用图像库省去为自己的游戏创建图像的工作。图像包含在主要的\
  \ enchant.js 包中。图 1-5 展示了可用角色图像中的几个示例。\n\n![A978-1-4302-4744-9_1_Fig5_HTML.jpg](img/A978-1-4302-4744-9_1_Fig5_HTML.jpg)\n\
  \n**图 1-5.** enchant.js 包中的角色图像示例\n\n你也可以从 [enchantjs.com](http://enchantjs.com)\
  \ 的下载页面下载一个单独于主库之外的 zip 文件中的声音。例如，你可以包含背景音乐、爆炸声、激光射击声、枪声，以及当角色拾取物品时可能用到的哔哔声等。\n\n\
  ## JavaScript、HTML5 和 CSS\n\n现代网站通常由三种类型的代码组合构建：JavaScript、HTML5 和层叠样式表（CSS）。通常，HTML\
  \ 提供核心内容，CSS 用于样式化和格式化内容，而 JavaScript 用于与页面元素交互并提供动画效果。我们在本章中简要介绍了 HTML5 和 CSS，但本书总体上主要关注\
  \ JavaScript，因为 enchant.js 游戏正是用这种语言编写的。\n\n### JavaScript\n\nJavaScript 是一种面向对象的解释型编程语言，最初是为了向网页添加交互性和动态效果而开发的。清单\
  \ 1-3 展示了一个 JavaScript 示例。你可能听说过一种叫做 Java 的编程语言，但它与 JavaScript 完全不同。JavaScript 保证可以在所有主流网络浏览器上运行，而无需安装任何额外软件。如果你以前从未见过\
  \ JavaScript，请不要担心！我们将在第 2 章中详细讲解。\n\n**清单 1-3.** 在屏幕上显示“Hello， World!”的 JavaScript\
  \ 示例\n\n```\ndocument.write('<p>Hello, World!</p>');\n```\n\n\n\n### HTML 与 HTML5\n\
  \n`HTML` 是超文本标记语言的缩写，是一种用于描述网络上文本的标记语言。在 `enchant.js` 中，`HTML` 用于加载 JavaScript 并控制智能手机上的某些浏览器操作（例如缩放）。示例如清单\
  \ 1-4 所示。如果你打开一个普通的文本文件，在其中输入清单 1-4 的代码，并将其保存为 `\"index.html\"`，那么该文件就可以被浏览器打开。浏览器将显示\
  \ \"Hello World! This is the content part of an HTML page.\" 这段文字。\n\n清单 1-4. 在浏览器中显示内容的\
  \ HTML 示例\n\n```\n<!DOCTYPE html>\n<html>\n        <head>\n                <meta\
  \ charset=\"utf-8\">\n                <meta name=\"viewport\" content=\"width=device-width,\
  \ user-scalable=no\">\n                <meta name=\"apple-mobile-web-app-capable\"\
  \ content=\"yes\">\n                <meta name=\"apple-mobile-web-app-status-bar-style\"\
  \ content=\"black-translucent\">\n                <title>HelloWorld</title>\n  \
  \              <style type=\"text/css\">\n                        body {\n     \
  \                           margin: 0;\n                        }\n            \
  \    </style>\n        </head>\n        <body>\n<p>Hello World! This is the content\
  \ part of an HTML page.</p>\n        </body>\n</html>\n```\n\n`HTML5` 是 `HTML` 多项新特性的统称。表\
  \ 1-2 展示了主要特性的示例。\n\n表 1-2. HTML5 新特性\n\n| 新 HTML 特性 | 描述 |\n| --- | --- |\n| `<canvas>`\
  \ 元素 | 支持绘制二维图形 |\n| `<audio>` 元素 | 允许播放音频 |\n| `<video>` 元素 | 支持视频播放 |\n| 应用缓存\
  \ | 允许离线执行应用程序 |\n| 跨域消息传递 | 允许在域之间传输信息 |\n| `XMLHttpRequest` 第二版 | |\n| Web 存储\
  \ | 使用客户端保存数据 |\n| SQL 数据库 | |\n| 索引数据库 | |\n| Web Workers | 支持后台处理以改善用户体验 |\n|\
  \ 服务器发送事件 | 允许与服务器进行双向通信 |\n| Web Sockets | |\n| 文件 API | 允许访问本地文件 |\n\n在 `enchant.js`\
  \ 中，`HTML5` 功能并非直接使用，而是通过 `enchant.js` 库来调用。本书不详细讨论 `HTML` 和 `HTML5`。\n\n### CSS\n\
  \n`CSS` 代表层叠样式表，它与 `HTML` 一起用于定义网页的外观，例如颜色、文本和大小。`HTML` 也可以用于指定网页的外观，但其正确的用途是指定内容，并使用\
  \ `CSS` 来定义该内容的外观。使用 `CSS` 尤其能简化动态网页的编辑。清单 1-5 展示了如何将网页 `body` 元素的背景更改为灰色并指定字体。\n\
  \n清单 1-5. 更改网页背景并指定字体\n\n```\nbody { background-color: #DDDDDD; font: 30px sans-serif;\
  \ }\n```\n\n在 `enchant.js` 中，`CSS` 功能并非直接使用，而是通过 `enchant.js` 库来调用。本书不详细讨论 `CSS`。\n\
  \n## 在屏幕上显示 \"Hello World!\"\n\n作为我们的第一个 `enchant.js` 应用，我们将展示如何编写一个非常简单的程序，创建一个显示\
  \ \"Hello World!\" 的标签。此练习的目的是以一种简单的方式向你展示 `enchant.js` 游戏的各要素是如何组合在一起的。稍后我们将创建更复杂的游戏。\n\
  \n访问 `enchantjs.com` 并点击下载按钮，下载最新的 `enchant.js` 包（非开发版）。解压文件后，打开一个文本编辑器，复制并粘贴清单\
  \ 1-6 中所示的代码，并将文件保存为 `\"index.html\"`，存放在 `enchant.js` 包解压到的文件夹内。\n\n清单 1-6. Index.html：加载\
  \ enchant.js 和主游戏代码\n\n```\n<!DOCTYPE html>\n<html>\n        <head>\n          \
  \      <meta charset=\"utf-8\">\n                <title>HelloWorld</title>\n   \
  \             <script type=\"text/javascript\" src=\"enchant.js\"></script>\n  \
  \              <script type=\"text/javascript\" src=\"main.js\"></script>\n    \
  \    </head>\n        <body>\n        </body>\n</html>\n```\n\n该代码将文件指定为 `HTML`\
  \ 文件，告知浏览器我们使用的字符编码是 `UTF-8`（`enchant.js` 即采用此编码编写），为其设置标题为 `\"HelloWorld\"`，然后指示它从名为\
  \ `\"main.js\"` 的文件中加载我们的游戏代码，我们接下来将创建这个文件。\n\n在文本编辑器中创建一个新文件，复制并粘贴清单 1-7 中所示的代码，并将文件保存为\
  \ `\"main.js\"`，存放在同一个文件夹内。\n\n清单 1-7. 简单的 enchant.js 应用，在屏幕上显示 \"Hello World!\"\
  \n\n```\nenchant();\n\nvar game;\n\nwindow.onload = function(){\n             game\
  \ = new Core(320, 320);\n             game.onload = function(){\n              \
  \               sign = new Label();\n                             sign.text = \"\
  Hello World!\";\n                             game.rootScene.addChild(sign);\n \
  \            };\n             game.start();\n};\n```\n\n清单 1-7 中的代码指示 `enchant.js`\
  \ 通过 `enchant();` 命令启动，创建游戏并指定游戏屏幕的尺寸。页面完全加载后，我们指定指令，创建一个名为 `sign` 的新标签，将文本设置为 `\"\
  Hello World!\"`，然后将其添加到游戏屏幕中。最后，通过 `game.start()` 执行这些指令。\n\n现在，如果你在浏览器中打开 `index.html`，应该会在屏幕上看到\
  \ \"Hello World!\" 字样。在此示例中，使用的文件只有 `enchant.js`、`index.html` 和 `main.js`。\n\n这是一个非常基础的示例，但从中你可以看到，`enchant.js`\
  \ 由 `index.html` 加载，而 `index.html` 也加载了我们在 `main.js` 中编写的游戏代码。下一个示例将更具图形化特性，并将向你介绍在线编程环境\
  \ `code.9leap.net`。\n\n## 创建一只滑冰的熊\n\n作为我们的第二个 `enchant.js` 应用，我们将制作一只熊从屏幕左侧滑到右侧，并针对在智能手机上的显示进行优化。你可以在\
  \ `http://code.9leap.net/codes/show/19822` 找到我们创建的代码示例。\n\n正如我们之前提到的，`code.9leap.net`\
  \ 准备了使用 `enchant.js` 编写游戏代码所需的所有必要元素。对于这个应用，我们将使用 `code.9leap.net`，并带你完成所有必要的步骤。请注意，`code.9leap.net`\
  \ 仍处于测试阶段，可能与本节中显示的截图略有不同。\n\n以下步骤概述了在 `code.9leap.net` 上创建 `enchant.js` 应用的整个开发流程。我们将在接下来的小节中详细说明每个步骤。\n\
  \n- 开始创建你的应用\n- 导入 `enchant.js` 库\n- 编辑源代码\n- 预览你的结果\n- 完成源代码编辑\n\n\n\n## 应用程序入门指南\n\
  \n在 [`code.9leap.net`](http://code.9leap.net) 上开发游戏的第一步是创建一个账户。以下步骤将向你展示如何创建账户。如果你已拥有账户，可以跳过此步，直接登录并进入项目创建环节。\n\
