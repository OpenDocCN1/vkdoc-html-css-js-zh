  \ 所示。我们已经创建了小熊，但除非我们将其添加到游戏的根场景或称主场景中，否则它仍然不会显示在屏幕上。将这段代码输入到你已在清单 1-16 中输入代码的后面，仍然放在`game.onload`的花括号内。\n\
  \n清单 1-17. 将小熊添加到游戏的根场景中\n\n```\ngame.rootScene.addChild(bear);\n```\n\n在 `game.onload`\
  \ 的花括号下方，但仍在 `window.onload` 的花括号内，启动游戏。参见清单 1-18。\n\n清单 1-18. 启动游戏\n\n```\ngame.start();\n\
  ```\n\n检查你的代码。你的代码应与清单 1-19 所示相符。你可以忽略注释（以双斜杠开头的行）。如果全部匹配，点击右上角的“运行”按钮，你就能看到小熊在屏幕上滑行！\n\
  \n清单 1-19. 让小熊滑过屏幕\n\n```\n//初始化 enchant.js\nenchant();\n\n//此处的代码将在 HTML 文件完全加载后执行\n\
