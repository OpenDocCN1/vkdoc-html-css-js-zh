  \ 和 `</script>` 之间的所有内容都应被视为代码行。当 `src=` 包含在 script 标签中时，它会告诉浏览器从 `index.html` 之外的文件加载代码行。移除这两行代码后，你的\
  \ `<script>` 标签应与清单 1-9 一致。\n\n**清单 1-9.** 加载 `enchant.js`、插件和游戏代码的脚本标签\n\n```\n\
