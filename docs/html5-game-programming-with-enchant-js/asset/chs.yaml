  \n**清单 6-59.** 每帧移动背景\n\n```\nthis.addEventListener('enterframe', function(){\n\
  \  this.x--;\n});\n```\n\n在事件监听器内部，`this.x--;` 下方，通过输入清单 6-60 中的代码，编写一条语句，当背景完全滚动过去时重置`Background`的位置。如果背景的\
