  请记住，`enchant.js` 中的插件也是库，因此它们也需要自己的 `script` 标签来加载。这就是为什么你会在下面的代码清单中看到诸如 `tl.enchant.js`\
  \ 等文件的引用行。\n\n要添加 `enchant.js` 库，请执行以下操作：\n\n移除包含 `nineleap.enchant.js` 和 `tl.enchant.js`\
