  \n创建一个事件监听器，让小熊每帧向右移动三个像素，如清单 1-16 所示。我们稍后会详细讨论事件监听器，但现在只需知道这段代码是告诉程序每帧都要移动小熊。将这段代码添加到你在清单\
  \ 1-16 中输入的代码之后，仍然放在 `game.onload` 的花括号内。\n\n清单 1-16. 创建事件监听器来移动小熊\n\n```\nbear.addEventListener(Event.ENTER_FRAME,\
