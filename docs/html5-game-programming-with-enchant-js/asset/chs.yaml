  \ 上查看和分支。\n\n#### 随机排列洞穴\n\n在开发游戏时，尝试不同的方法会很有帮助。例如，为了研究它对游戏的影响，你可能想让敲击机器人游戏中的洞穴随机出现在屏幕上，而不是整齐排列成\
  \ 4x4 网格。清单 5-9 和图 5-6 展示了实现这一效果的修改。\n\n**清单 5-9.** 随机放置洞穴\n\n```\ngame.onload =\
