  \ = \"\";\n```\n\n通过输入清单 2-36 中的代码，为原型创建一个显示其信息的函数。\n\n**清单 2-36.** 创建原型函数\n\n```\n\
  Software.prototype.output = function() {\n    document.write(this.name + \" is written\
  \ in \" + this.language + \"<BR />\");\n};\n```\n\n输入清单 2-37 中的代码，创建一个新的对象 `accounting`，作为\
  \ `Software` 原型的实例；指定其属性的值；然后调用其函数以在屏幕上显示信息。\n\n**清单 2-37.** 创建会计对象\n\n```\nvar\
  \ accounting = new Software();\naccounting.name = \"Spreadsheet Master\";\naccounting.language\
  \ = \"Java\";\naccounting.output();\n```\n\n点击运行。你会看到一条消息，说 Spreadsheet Master 是用\
  \ Java 编写的。尝试在 `accounting` 对象下方创建另一个对象，并调用 `output()` 函数。如果遇到问题，请查看 [`http://code.9leap.net/codes/show/19835`](http://code.9leap.net/codes/show/19835)\
  \ 获取可运行的示例。\n\n**注意：** 以上面的代码为例，以 `accounting` 作为对象名称，你可以随时通过输入类似 `accounting.secondLanguage\
  \ = \"C++\";` 的内容来为该对象添加属性。这里，`secondLanguage` 之前并未用 `var` 或其他方式声明过。这是一种即时声明。函数也可以类似的方式添加到对象中，例如\
  \ `accounting.showLanguage = function() {document.write(this.language)};`。\n\n##\
  \ 小结\n\n恭喜！如果你已经通读了本节内容，并在 code.9leap.net 上操作了示例代码，那么你现在应该已经理解了变量、运算符、字符串、数组、函数和原型。这些是\
  \ JavaScript 以及当前许多面向对象语言的构建块。理解这些基础知识为你学习如何在 enchant.js 中编写自己的 HTML5 游戏奠定了基础。\n\
  \n在第 3 章中，我们将深入探讨 enchant.js 库，并学习精灵、场景、标签、曲面等内容。这些是 enchant.js 提供的基本功能。随着我们学习第\
