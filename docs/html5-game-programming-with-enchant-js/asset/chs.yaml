  \ 找到可运行的代码示例。\n\n\n\n#### 让敌人沿弧线移动\n\n目前敌人都是直线移动，这让游戏虽然容易上手，但略显简单。为了让游戏更有趣，我们让敌人沿弧线移动。具体做法是：根据敌人创建位置，创建一个指定方向应向上或向下变化的变量（`theta`），然后在每一帧中轻微改变方向。请按以下步骤操作：\n\
  \n每个敌人都需要一个用于改变方向的变量。通过将`initialize`函数的起始行修改为代码清单 6-40 所示的内容，创建一个作为`Enemy`创建时传入参数的变量（`theta`）。\n\
  \n**代码清单 6-40 添加`theta`变量**\n\n```\ninitialize: function(x, y, theta){\n```\n\n\
  尽管方向是以单位圆的方式指定的，但对于除`0`或`Math.PI`以外的具体角度值，使用度数处理会更方便。我们将向`theta`传入一个角度值，因此需要在`this.direction\
  \ = 0;`这一行之前，输入代码清单 6-41 中的代码将其转换为弧度。\n\n**代码清单 6-41 将`theta`转换为弧度**\n\n```\nthis.theta\
  \ = theta * Math.PI / 180;\n```\n\n在`Enemy`类的`enterframe`事件监听器中，在`this.addEventListener('enterframe',\
  \ function(){`这一行下方直接输入代码清单 6-42 中的代码，让`theta`在每一帧改变`Enemy`的方向。\n\n**代码清单 6-42 递增`Enemy`方向**\n\
  \n```\nthis.direction += this.theta;\n```\n\n现在敌人可以接受`theta`值，并在每一帧改变方向，但我们还需要指定敌人的创建方式来真正利用这个功能。为此，将游戏`rootScene`的`enterframe`事件监听器中的`if`语句修改为代码清单\
  \ 6-43 所示的内容。如果敌人在屏幕上半部分创建，它将向上弧线移动（方向角每帧增加 1）；如果在屏幕下半部分创建，则向下弧线移动（方向角每帧减少 1）。\n\
  \n**代码清单 6-43 创建沿弧线移动的敌人**\n\n```\nif(rand(100) < 10){\n    // 随机创建敌人\n    var y\
  \ = rand(320);\n    if (y < 160) {\n        theta = 1;\n    } else {\n        theta\
  \ = -1;\n    }\n    var enemy = new Enemy(320, y, theta);\n    enemy.key = game.frame;\n\
  \    enemies[game.frame] = enemy;\n}\n```\n\n![A978-1-4302-4744-9_6_Fig3_HTML.jpg](img/A978-1-4302-4744-9_6_Fig3_HTML.jpg)\n\
