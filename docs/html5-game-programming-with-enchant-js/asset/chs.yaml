  \n\n\n### 限制机器人出现次数\n\n添加计分功能后，游戏看起来已接近完成。然而，我们的机器人出现得过于频繁，以至于只需快速点击同一位置就能获得高分。机器人源源不断地出现，剥夺了玩家具有挑战性的游戏体验。\n\
  \n让我们修改游戏，让机器人只出现 30 次。这样修改会迫使玩家在机器人 30 次出现中尽可能多地击中它。请按以下步骤操作：\n\n创建一个变量来记录机器人的总数和机器人最大出现次数，然后通过复制清单\
  \ 5-13 中的粗体部分来实现它们。\n\n**清单 5-13 限制机器人出现次数**\n\n```javascript\nenchant();\n\n//生成随机数的函数\n\
  rand = function(n){\n    return Math.floor(Math.random()*n);\n}\n\n//机器人出现次数\nmaxDroid\
  \ = 30;\n\n//机器人总数\ntotalDroid = 16;\n\n//定义洞穴类\nPit = Class.create(Sprite,{\n \
  \   initialize:function(x,y){\n        //调用精灵类（超类）构造函数\n        enchant.Sprite.call(this,48,48);\n\
  \        this.image = game.assets['mogura.png'];\n        this.x = x;\n        this.y\
  \ = y;\n        //定义每帧运行的事件监听器\n        this.addEventListener('enterframe',this.tick);\n\
  \        //定义机器人被击中时的事件监听器\n        this.addEventListener('touchstart',this.hit);\n\
  \        //初始设置机器人模式为 2（等待）\n        this.mode = 2;\n        //设置下一个模式为 0（出现）\n\
  \        this.nextMode = 0;\n        //等待随机帧数（0-99）\n        this.waitFor =    game.frame+rand(100);\n\
  \        //存储机器人是否已被击中的信息\n        this.currentlyWhacked = false;\n    },\n    tick:function(){\n\
  \        //每两帧改变一次状态\n        //return 会终止函数\n        if(game.frame%2!=0)return;\n\
  \        switch(this.mode){\n            //机器人正在从洞穴中出现\n            case 0:\n  \
  \              this.frame++;\n                if(this.frame>=4) {\n            \
  \        //出现后切换到模式 2（等待）\n                    this.mode=2;\n                  \
  \  //模式 2 之后的下一个模式是模式 1（隐藏）\n                    this.nextMode=1;\n            \
  \        //设置随机等待时间（0 ~ 99 帧）\n                    this.waitFor = game.frame+rand(100);\n\
  \                }\n                break;\n            //机器人即将躲进洞穴\n          \
  \  case 1:\n                this.frame--;\n                //如果机器人已隐藏...\n     \
  \           if(this.frame<=0){\n                    //切换到模式 2（等待）\n            \
  \        this.mode=2;\n                    //下一个模式应为模式 0（出现）\n                 \
  \   this.nextMode=0;\n                    //设置随机等待时间（0 ~ 99 帧）\n               \
  \     this.waitFor = game.frame+rand(100);\n                    //重置标志，因为被击中的机器人消失了\n\
  \                    this.currentlyWhacked = false;\n                    //减少机器人最大出现次数\n\
  \                    maxDroid--;\n                    //如果超出次数，机器人不应再出现\n      \
  \              if(maxDroid<=0) {\n                        this.mode=3;\n       \
  \                 if(maxDroid <= -1*totalDroid + 1) {\n                        \
  \    game.end(scoreLabel.score, scoreLabel.text);\n                        }\n \
  \                   }\n                }\n                break;\n            //机器人正在等待\n\
  \            case 2:\n                //如果游戏当前帧大于设置的等待帧...\n                if(game.frame>this.waitFor){\n\
  \                    //转换到下一个模式\n                    this.mode = this.nextMode;\n\
  \                }\n                break;\n        }\n    },\n    //击中机器人\n   \
  \ hit:function(){\n        //如果机器人已被击中则不执行任何操作\n        if(this.currentlyWhacked)return;\n\
  \        //仅在机器人至少出现一半时\n        if(this.frame>=2){\n            //设置标志，表示机器人已被击中\n\
  \            this.currentlyWhacked = true;\n            //被击中后的机器人\n           \
  \ this.frame=5;\n            //切换到等待模式\n            this.mode=2;\n            this.nextMode=1;\n\
  \            //等待帧数固定为 10\n            this.waitFor = game.frame+10;\n         \
  \   //增加分数\n            scoreLabel.add(1);\n        }\n    }\n});\n\n//计分类定义，继承\
  \ Label 类\nScoreLabel = Class.create(Label,{\n    initialize:function(x,y){\n  \
  \      //调用 Label 类构造函数\n        enchant.Label.call(this,\"SCORE:0\");\n       \
  \ this.x=x;\n        this.y=y;\n        this.score = 0;\n    },\n    //增加分数\n  \
  \  add:function(pts){\n        this.score+=pts;\n        //更新显示的分数\n        this.text=\"\
  SCORE:\"+this.score;\n    }\n});\n\n//初始化\nwindow.onload = function(){\n    game\
  \ = new Game(320, 320);\n    //加载机器人图像\n    game.preload('mogura.png');\n    game.onload\
  \ = function(){\n        //显示计分\n        scoreLabel=new ScoreLabel(5,5);\n     \
  \   game.rootScene.addChild(scoreLabel);\n        //以 4x4 矩阵排列洞穴\n        for(var\
  \ y=0;y<4;y++){\n            for(var x=0;x<4;x++){\n                var pit = new\
  \ Pit(x*48+20,y*48+20);\n                game.rootScene.addChild(pit);\n       \
  \     }\n        }\n    }\n    game.start();\n};\n```\n\n你可以在[`code.9leap.net`](http://code.9leap.net)（[`http://code.9leap.net/codes/show/23778`](http://code.9leap.net/codes/show/23778)）找到此次修改的源代码。\n\
  \n目前，我们的打机器人游戏已经完成。不过，还有很多其他方式来制作打地鼠类型的游戏。你可以打移动的地鼠，或者添加地鼠速度变化和洞穴位置变化的关卡，当然你也可以对抗机器人以外的其他东西，或者让它们从洞穴以外的其它地方出现（比如传送门）。通过改变规则和主题，可以创造出无限多的变化。\n\
  \n现在轮到你了。发挥你的创造力，尝试创作出属于你的独特杰作。游戏完成后，尝试将其上传到[`http://9leap.net`](http://9leap.net/)。如果遇到问题，请参阅第\
  \ 1 章了解上传游戏的相关信息。\n\n\n\n## 结论\n\n在本章中，我们聚焦于使用 `enchant.js` 设计游戏的过程。我们审视了游戏设计不可打破的规则，回顾了游戏开发流程，甚至设计了一个可完整运行的大头锤（打地鼠）游戏。在下一章中，我们将深入研究游戏领域最经典的原型之一：街机射击游戏，并逐步讲解如何使用\
  \ `enchant.js` 创建此类游戏。\n\n"
- "# 6. 创建街机射击游戏\n\n## 摘要\n\n在第 5 章中，我们探讨了游戏设计，并创建了我们自己的打地鼠（或者我应该说打安卓机器人？）游戏。在本章中，我们将研究另一种游戏：街机射击游戏，它比打地鼠游戏更为复杂。\n\
  \n在这款街机射击游戏中，我们包含了多个有助于提升游戏趣味性的特性：背景音乐、非玩家角色（如好人和坏人）、爆炸效果、滚动背景等等。整合所有这些元素需要在游戏设计方面进行周密的规划，因为我们创建的所有类都必须彼此交互。例如，从玩家飞船射出的一发子弹应该导致敌人消失。除了介绍街机射击游戏是如何设计和编码的之外，我们还引入了几个新主题，包括指示器、等级和旋转。\n\
  \n## 步骤摘要\n\n探索游戏并进行设置 — 搭建游戏基础 — 创建玩家飞船 — 创建射击类 — 创建玩家射击类并使飞船开火 — 创建敌人 — 创建敌人射击类并使敌人开火\
  \ — 让敌人沿弧形移动 — 爆炸效果 — 添加滚动背景 — 添加生命指示器\n\n## 构建街机射击游戏\n\n让我们从能制作的最简单的街机射击游戏版本开始，然后逐步增加复杂性。我们在本节中编写的游戏是一个简单的射击游戏。当玩家触摸屏幕时，飞船会移动到触摸位置，并在玩家持续触摸屏幕时不断射出子弹。敌机出现在屏幕的另一侧并向玩家飞船射击。如果玩家飞船被击中，游戏结束。每当玩家消灭一艘敌机，其得分就会增加。游戏的目标是在被击中前获得尽可能高的分数。\n\
  \n在第 5 章中，我们的方法是先编写一段简短精炼的代码，然后在持续开发的过程中对其进行改进，并在每次迭代时试玩游戏。这里我们也采用同样的方法，但由于街机射击游戏比打地鼠游戏更复杂，所以步骤要多得多。\n\
  \n### 探索游戏并进行设置\n\n如果在开始编码前先试玩一下我们将要编写的游戏，你会对其运作方式有更清晰的认识。请执行以下操作来熟悉游戏并设置好编码环境：\n\
  \n-   在 [`http://9leap.net/games/1034`](http://9leap.net/games/1034) 上多次试玩该游戏，以熟悉我们将要制作的游戏。特别注意观察敌人是如何随机出现的，以及当屏幕上有大量敌方子弹时游戏会变得多么困难。由于具有可重玩性，该游戏在\
  \ [`9leap.net`](http://9leap.net) 上非常受欢迎。由于敌人是随机生成的，每次的游戏体验都不同。\n-   在 [`http://code.9leap.net/codes/show/29839`](http://code.9leap.net/codes/show/29839)\
  \ 上 Fork 这个模板。该模板包含了你所需的必要图像文件。\n\n### 搭建游戏基础\n\n和往常一样，最好先从最简单的游戏元素开始，然后再添加更复杂的元素。在这里，我们设置\
  \ `Core` 对象，设置背景，并创建一个分数。请执行以下操作进行设置：\n\n1.  初始化 `enchant.js` 库，并将代码清单 6-1 中的代码复制到空白模板中来创建\
  \ `Core` 实体。鉴于本节内容的复杂性，我们使用注释对代码段进行标记，以便在后续章节中引用它们。\n\n**代码清单 6-1.** 街机射击游戏的基础框架\n\
  \n```\nenchant();\n\n//Class Definitions\n\nwindow.onload = function() {\n     \
  \   game = new Core(320, 320);\n        //Game Properties\n        game.fps = 24;\n\
  \        game.onload = function() {\n        };\n        game.start();\n};\n```\n\
  \n2.  在 `game.onload` 函数中输入代码清单 6-2 中的代码，创建黑色背景。这会将 `rootScene` 的 `backgroundColor`\
  \ 属性设置为黑色。\n\n**代码清单 6-2.** 创建黑色背景\n\n```\n//In-Game Variables and Properties\n\
  game.rootScene.backgroundColor = 'black';\n```\n\n`rootScene` 的 `backgroundColor`\
  \ 属性可以接受所有标准颜色的名称和颜色的十六进制值（例如，红色的 `#FF0000`）。\n\n3.  点击运行。屏幕应该会变成黑色。\n4.  在“//Game\
  \ Properties”部分添加代码清单 6-3 中的代码，为玩家得分创建游戏变量。稍后，当敌机被玩家飞船的子弹击中时，我们将让这个变量的值增加。\n\n**代码清单\
  \ 6-3.** 创建分数变量\n\n```\ngame.score = 0;\n```\n\n5.  在“//In-game Variables and Properties”部分添加代码清单\
  \ 6-4 中的代码，创建 `ScoreLabel` 并将其添加到 `rootScene`。`(8,8)` 指定了标签的左上角位置，即位于游戏画面左上角向右 8\
  \ 像素、向下 8 像素处。稍后，我们将在每一帧用 `game.score` 的值更新 `ScoreLabel` 的值。\n\n**代码清单 6-4.** 创建分数标签并添加到\
  \ rootScene\n\n```\nscoreLabel = new ScoreLabel(8, 8);\ngame.rootScene.addChild(scoreLabel);\n\
  ```\n\n`ScoreLabel` 类是一个名为 `ui.enchant.js` 的插件的一部分，该插件包含在 [`enchantjs.com`](http://enchantjs.com/)\
  \ 的下载包中。如果你之前从 `code.9leap.net` Fork 了该项目，它也已经包含在内。如果没有，则需要确保在继续之前，已将 `<script src='/static/enchant.js-latest/plugins/ui.enchant.js'></script>`\
  \ 这行代码添加到你的 `index.html` 文件中。\n\n6.  点击运行。`ScoreLabel` 应该会出现在屏幕顶部，显示“`SCORE:`”字样。\n\
  \n如果在代码中遇到任何问题，你可以在 [`http://code.9leap.net/codes/show/29841`](http://code.9leap.net/codes/show/29841)\
  \ 找到一个完整运行的示例。\n\n\n\n### 创建玩家飞船\n\n下一步是创建玩家飞船，我们将以类的形式实现。请按以下步骤操作：\n\n在 `//Class\
  \ Definitions` 部分输入代码清单 6-5，为玩家创建类定义。简要说明一下，`enchant.Sprite` 声明表示新类是 `Sprite` 类的扩展，这意味着\
  \ `Sprite` 类的所有属性和方法也适用于 `Player` 类。所有写在 `initialize` 函数中的内容都将在 `Player` 对象创建时执行。\n\
  \n**代码清单 6-5. Player 类**\n\n```\n// Player class\nvar Player = enchant.Class.create(enchant.Sprite,\
  \ {\n        initialize: function(x, y){\n        }\n});\n```\n\n在 `//Game Properties`\
  \ 部分添加代码清单 6-6，预加载游戏所需的所有图片 `graphic.png`。图 6-1 展示了该图片。\n\n**代码清单 6-6. 预加载图片**\n\
  \n```\ngame.preload('graphic.png');\n```\n\n在 `Player` 类的 `initialize` 函数中输入代码清单\
  \ 6-7，将其定义为 16x16 像素的 `Sprite` 类实例，并指定 `graphic.png` 作为其图像。\n\n![A978-1-4302-4744-9_6_Fig1_HTML.jpg](img/A978-1-4302-4744-9_6_Fig1_HTML.jpg)\n\
  \n**图 6-1. Graphic.png**\n\n**代码清单 6-7. 指定尺寸与图像**\n\n```\nenchant.Sprite.call(this,\
  \ 16, 16);\nthis.image = game.assets['graphic.png'];\n```\n\n在刚添加的代码下方直接输入代码清单 6-8，将\
  \ `Player` 的位置设为创建时指定的坐标，并设置 `frame`。\n\n**代码清单 6-8. 设置位置与帧**\n\n```\nthis.x = x;\n\
  this.y = y;\nthis.frame = 0;\n```\n\n在 `//Game Properties` 部分添加代码清单 6-9，创建一个变量用于追踪屏幕是否被触摸。该变量将在后续创建的触摸事件监听器中使用，并用于判断是否应该从飞船发射子弹。\n\
  \n**代码清单 6-9. 追踪触摸状态**\n\n```\ngame.touched = false;\n```\n\n回到 `initialize` 函数，输入代码清单\
  \ 6-10，添加事件监听器，当 `touchstart` 事件发生时将 `Player` 移动到触摸事件的 Y 坐标位置。同时将 `game.touched`\
  \ 变量设为 `true`。注意 `player.y = e.y;` 和 `game.touched = true;` 之间不需要换行，分号即可区分命令。\n\n\
  **代码清单 6-10. 添加触摸开始事件监听器**\n\n```\ngame.rootScene.addEventListener('touchstart',\n\
  \                function(e){ player.y = e.y; game.touched = true; });\n```\n\n\
  在其下方，添加 `touchend` 和 `touchmove` 事件监听器，以处理玩家所有可能的交互操作，输入代码清单 6-11。\n\n**代码清单 6-11.\
  \ 附加事件监听器**\n\n```\ngame.rootScene.addEventListener('touchend',\n              \
  \  function(e){ player.y = e.y; game.touched = false; });\ngame.rootScene.addEventListener('touchmove',\n\
