  \ `rootScene`**\n\n```\ngame.rootScene.addChild(this);\n```\n\n在 `//In-game Variables\
  \ and Properties` 部分添加代码清单 6-13，创建 `Player` 实例。由于上一步的设置，该实例会自动添加到 `rootScene`。\n\
  \n**代码清单 6-13. 创建 `Player` 实例**\n\n```\nplayer = new Player(0, 152);\n```\n\n点击运行。飞船将出现在屏幕上。点击并按住鼠标，飞船会跟随光标在屏幕上上下移动。\n\
  \n如果本节遇到问题，可在此处查看可运行的代码示例：[`http://code.9leap.net/codes/show/29845`](http://code.9leap.net/codes/show/29845)。\n\
  \n### 创建射击类\n\n本游戏将有两种弹药类型：玩家飞船发射的弹药和敌方发射的弹药。两种类型使用相同的图像，因此我们先创建一个通用的 `Shoot` 类。请按以下步骤操作：\n\
  \n在 `//Player Class` 定义下方输入代码清单 6-14，创建基础的 `Shoot` 类。该类应包含两个函数：`initialize` 和 `remove`，并扩展\
  \ `Sprite` 类。创建 `Shoot` 类的实例时，需要传入三个参数：X 坐标、Y 坐标和方向。\n\n**代码清单 6-14. 创建射击类**\n\n\
  ```\n// Shoot class\nvar Shoot = enchant.Class.create(enchant.Sprite, {\n      \
  \  initialize: function(x, y, direction){\n        },\n        remove: function(){\n\
  \        }\n});\n```\n\n在 `Shoot` 类的 `initialize` 函数中输入代码清单 6-15，将其定义为 16x16 像素的\
  \ `Sprite` 类实例，并创建和赋值所需的变量。接下来将使用 `moveSpeed` 变量控制移动速度，以便后续轻松调整弹药速度。\n\n**代码清单 6-15.\
  \ 射击类的实例变量**\n\n```\nenchant.Sprite.call(this, 16, 16);\nthis.image = game.assets['graphic.png'];\n\
  this.x = x;\nthis.y = y;\nthis.frame = 1;\nthis.direction = direction;\nthis.moveSpeed\
  \ = 10;\n```\n\n在 `this.movespeed = 10;` 下方直接输入代码清单 6-16，创建 `enterframe` 事件监听器以控制移动。此处添加的代码将在每个帧周期被\
  \ `Shoot` 实例执行。\n\n**代码清单 6-16. 创建 `enterframe` 事件监听器**\n\n```\nthis.addEventListener('enterframe',\
  \ function(){\n                });\n```\n\n我们将在下一节为这个事件监听器添加具体代码。\n\n\n\n### 使用\
  \ `Cos` 和 `Sin` 控制方向\n\n我们创建了 `Shoot` 类来接收方向参数，但目前还不知道传入的值代表什么方向。同时我们也添加了一个事件监听器来处理移动，但还不清楚如何根据方向进行移动。那么该如何实现呢？答案就是调用\
  \ `cosine` 和 `sine` 函数（通常简写为 `cos` 和 `sin`）。\n\n要理解这些函数，首先需要了解基于**单位圆**的方向表示方法，如图\
  \ 6-2 所示。\n\n![A978-1-4302-4744-9_6_Fig2_HTML.jpg](img/A978-1-4302-4744-9_6_Fig2_HTML.jpg)\n\
  \n**图 6-2.** 单位圆\n\n单位圆使用弧度来表示方向。一弧度等于圆的半径长度，并沿圆周排列。圆中的 `pi` 符号是一个数学常数，等于圆的周长除以直径（约等于\
  \ 3.14）。这有什么用呢？因为 `cos` 和 `sin` 函数只接收弧度值，而左右两个主要方向分别对应 `pi` 和 `0`（或 `2 * pi`）。\n\
  \n假设你想从圆心画一条长度为 1 的线段。给定一个用 `pi` 表示的方向后，`cos` 和 `sin` 会分别返回该线段终点的 x 和 y 坐标。例如，如果我们想从该点向右移动\
  \ 1 个单位，就需要将 `pi` 传递给 `cos`，以确定沿 x 轴需要移动多少距离才能到达目标位置（-1）。同时也要将 `pi` 传递给 `sin`，以确定沿\
  \ y 轴需要移动多少距离（0）。\n\n这就是通过代码处理移动的原理。我们基于 `pi` 选择一个方向，然后使用 `cos` 和 `sin` 计算出每一帧精灵需要移动的距离。\n\
  \n在你刚刚创建的事件监听器中，输入清单 6-17 中的代码，指定 `Shoot` 类的实例如何根据 `cos` 和 `sin` 进行移动。将计算结果乘以 `moveSpeed`\
  \ 可以对弹药速度进行后续调整（如有需要）。\n\n**清单 6-17.** 使用 `Cos` 和 `Sin` 控制移动\n\n```\nthis.x += this.moveSpeed\
  \ * Math.cos(this.direction);\nthis.y += this.moveSpeed * Math.sin(this.direction);\n\
  ```\n\n在 `enterframe` 事件监听器中，于刚刚添加的代码下方输入清单 6-18 中的代码，指定当 `Shoot` 类的实例超出游戏屏幕边界较远时，调用\
  \ `remove` 函数进行移除。我们可以将调用 `remove` 函数前允许的 X 和 Y 最小值设为 0，但使用 `–this.width` 和 `–this.height`\
  \ 可以确保弹药不会以不自然的方式消失在屏幕边缘。暂时无需担心 `remove` 函数的具体定义。\n\n**清单 6-18.** 调用 `remove` 函数\n\
