- "# 2. JavaScript 基础\n\n## 摘要\n\n正如我们在第 1 章中所述，`enchant.js` 是用 JavaScript 编程语言编写的。当你使用\
  \ `enchant.js` 开发游戏时，需要用 JavaScript 语言编写命令和其他代码，因此在深入接触 `enchant.js` 游戏之前，我们需要先学习简单的\
  \ JavaScript 知识。如果你已经熟悉 JavaScript，可以直接跳过本章。\n\nJavaScript 是用于网页脚本编写的主要编程语言。与大多数需要安装到计算机上才能运行的软件应用程序编程语言不同，JavaScript\
  \ 代码运行在客户端浏览器中。鉴于 `enchant.js` 以及使用 `enchant.js` 编写的游戏都是用 JavaScript 创建的，因此理解 JavaScript\
  \ 的基本概念至关重要。如果你是编程新手，学习这些基础知识将让你受益匪浅，因为它们恰好也是面向对象语言的基本构建块，并且是学习其他流行编程语言（如 Java 和\
  \ C++）的有用起点。\n\n编程语言的语法，即语言元素的具体书写方式，被称为句法。在本章中，你将通过在 `code.9leap.net` 网站上编写代码，学习\
  \ JavaScript 的构建块、它们的语法和功能。我们将逐步引导你完成整个过程，并通过一系列简单的代码项目解释每个构建块。\n\n## 本章概要\n\n在本章中，我们将向你展示如何执行以下操作：\n\
  \n- 声明变量\n- 为变量赋值\n- 变量相加\n- 检查变量的值\n- 用自身操作变量\n- 用递增操作变量\n- 比较变量\n- 查看两个变量的相似程度\n\
  - 操作比较结果\n- 使用 `If` 语句实现逻辑判断\n- 创建对象\n- 使用 `While` 和 `For` 循环语句更高效地工作\n- 用 `Break`\
  \ 中断循环\n- 用 `Continue` 跳过循环迭代\n- 生成随机数\n- 使用 `Switch` 定义场景\n- 在数组中存储编号数据\n- 在关联数组中存储非编号数据\n\
  - 使用函数节省时间\n- 查看变量的作用域\n- 使用原型制作对象蓝图\n\n## 声明变量\n\n变量是存放值的容器，在大多数情况下，可以随时用新值更新变量，因此得名“变量”。它们的值会“变化”，所以称为“变量”。使用变量而非具体值的好处在于变量的动态特性。如果你在计算中使用变量，然后稍后更改该变量的值，下次执行相同计算时将会使用新值。\n\
  \n要使用变量，首先必须使用 `var` 语句声明它，该语句告诉应用程序在内存中为变量预留一个位置。在 JavaScript 中，任何单条语句的末尾都必须加上分号（`;`）。\n\
  \n要声明三个名为 `num0`、`num1` 和 `sum` 的变量，请执行以下操作：\n\n1. 访问 [`http://code.9leap.net`](http://code.9leap.net/)\
  \ 并登录，如果还没有账号请注册。\n2. 访问 [`http://code.9leap.net/codes/show/26854`](http://code.9leap.net/codes/show/26854)，然后点击\
  \ Fork 按钮复制空白 JavaScript 模板。\n3. 通过修改屏幕左上角 `code.9leap` 标志右侧的字段来更改项目标题。选择诸如“声明变量”之类的合适名称。（对于以后所有复制此代码的示例，请以这种方式更改标题，以便跟踪你的各个项目。）\n\
  4. 输入如清单 2-1 所示的代码。\n\n**清单 2-1.** 声明变量\n\n```\nvar num0;\nvar num1;\nvar sum;\n\
  ```\n\n### 变量命名\n\n变量名称中可以使用以下字符：\n\n- 字母（A–Z, a–z）\n- 数字（但不能作为变量名的第一个字符）\n- 下划线（`_`）\n\
  \n表 2-1 列出了 JavaScript 中不能用作变量名的保留字。\n\n**表 2-1.** JavaScript 中的保留字\n\n| `break`\
  \ | `do` | `if` | `switch` | `typeof` |\n| --- | --- | --- | --- | --- |\n| `case`\
  \ | `else` | `in` | `this` | `var` |\n| `catch` | `false` | `instanceof` | `throw`\
  \ | `void` |\n| `continue` | `finally` | `new` | `true` | `while` |\n| `default`\
  \ | `for` | `null` | `try` | `with` |\n| `delete` | `function` | `return` | | |\n\
  \n表 2-2 列出了当前尚未使用但未来很可能用到的词。建议在命名变量时避免使用它们。\n\n**表 2-2.** 保留供将来使用的词\n\n| `abstract`\
  \ | `double` | `goto` | `native` | `static` |\n| --- | --- | --- | --- | --- |\n\
  | `boolean` | `enum` | `implements` | `package` | `super` |\n| `byte` | `export`\
  \ | `import` | `private` | `synchronized` |\n| `char` | `extends` | `int` | `protected`\
  \ | `throws` |\n| `class` | `final` | `interface` | `public` | `transient` |\n|\
  \ `const` | `float` | `long` | `short` | `volatile` |\n| `debugger` | | | | |\n\n\
  你不能使用 JavaScript 中预定义的任何其他词，例如 `String`、`true` 等。有关完整列表，请参阅 [`www.javascripter.net/faq/reserved.htm`](http://www.javascripter.net/faq/reserved.htm)。\n\
  \n## 为变量赋值\n\n声明变量后，就可以为其赋值。要为 `num0` 和 `num1` 赋值，请执行以下操作：\n\n在你输入的清单 2-1 代码下方，输入如清单\
  \ 2-2 所示的代码。\n\n**清单 2-2.** 为变量赋值\n\n```\nnum0 = 100;\nnum1 = 200;\n```\n\n> **注意：**\
  \ 可以通过 `var num3 = 400;` 同时声明变量并为其赋值。\n\n## 变量相加\n\n变量可以代替数字进行算术运算。如果使用变量进行算术运算，将使用变量的当前值进行计算。要将\
  \ `num0` 和 `num1` 相加并将结果赋给 `sum`，请执行以下操作：\n\n在你输入的清单 2-2 代码下方，输入如清单 2-3 所示的代码。\n\
  \n**清单 2-3.** 变量相加\n\n```\nsum = num0 + num1;\n```\n\n### 基本算术运算符\n\n你不仅限于对变量或数字进行加法运算。所有基本的算术运算都可以执行。表\
  \ 2-3 显示了基本运算符。\n\n**表 2-3.** 基本算术运算符\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n\
  | `+` | 加法 | `a + b`（将 `a` 和 `b` 相加） |\n| `–` | 减法 | `a – b`（从 `a` 中减去 `b`） |\n\
  | `*` | 乘法 | `a * b`（将 `a` 和 `b` 相乘） |\n| `/` | 除法 | `a / b`（用 `a` 除以 `b`） |\n|\
  \ `%` | 取余 | `a % b`（`a` 除以 `b` 的余数。换句话说，`7 % 4 = 3`，因为 4 在 7 中容纳一次，余数为 3。） |\n\n\
  运算符具有优先级：乘法和除法优先于加法和减法。如果要改变运算顺序，即先计算计算式的特定部分，请使用括号，如清单 2-4 所示。你无需复制此代码，仅作参考。\n\n\
  **清单 2-4.** 使用括号改变运算顺序\n\n```\nvar result0 = 1 + 2 * 3;                //result0\
  \ 将为 7\nvar result1 = (1 + 2) * 3;              //result1 将为 9\n```\n\n\n\n## 检查变量值\n\
  \n要查看 `sum` 的值，请按以下步骤操作：\n\n在当前代码下方，输入代码清单 2-5 中所示的代码。`document.write()` 命令能指示程序在屏幕上显示括号内的内容，并使用加号将各值组合（或称拼接）在一起，以展示最终结果。像这样的命令被称为方法，可以通过方法名末尾的括号来识别。`write`\
  \ 前的句点表明它是 `document` 对象的一个方法，`document` 是一套预定义的代码，使 JavaScript 能够访问浏览器窗口。我们稍后将更详细地介绍对象。\n\
  \n**代码清单 2-5.** 在屏幕上显示 sum 的值\n\n```\ndocument.write(\"总金额 = \" + sum);\n```\n\n\
  点击“运行”按钮。（此后我们将简单地称之为“运行”。）预览区域应显示“总金额 = 300”。\n\n如果你想将自己的代码与完成的示例进行核对，可以在 [`http://code.9leap.net/codes/show/19823`](http://code.9leap.net/codes/show/19823)\
  \ 找到一个示例。\n\n## 数据类型\n\n为什么我们在代码清单 2-5 中，必须为 `document.write()` 内部的内容加上引号？这是因为 `document.write()`\
  \ 只接受字符串类型的值。字符串用于存储文本字符序列，是 JavaScript 中五种基本（或称原始）数据类型之一。其中三种数据类型——数字（number）、字符串（string）和布尔值（Boolean）——用于存储数据，而另外两种则用于指定变量的当前状态。表\
  \ 2-4 展示了这五种数据类型。\n\n**表 2-4.** 基本数据类型\n\n| 类型 | 赋值方式 | 使用示例 |\n| --- | --- | ---\
  \ |\n| `Number` | 十进制 | `var num = 10;` |\n| | 八进制（在数值前加 0） | `var num = 011;` |\n\
  | | 十六进制（在数值前加 0x） | `var num = 0x9A;` |\n| | 浮点数，十进制（使用句点[.]） | `var fnum = 3.1415;`\
  \ |\n| | 浮点数，指数形式（使用句点[.]和 E） | `var fnum = -3.1E12;` |\n| `Boolean` | `true` 或\
  \ `false` | `var flag = true;` |\n| `String` | 由双引号或单引号包围的字符串 | `var str = \"character\
  \ string\";` |\n| | | `var str = 'character string';` |\n| `null` | 对象已知存在，但没有值\
  \ | `var obj = null;` |\n| `undefined` | 对象不存在、不返回值或尚未初始化 | |\n\n除了基本数据类型，JavaScript\
  \ 中还有复杂数据类型：\n\n*   **对象（Object）：** 对象是多个基本数据类型和/或其他对象的集合，通常是预定义的或由开发者定义的。如果你要创建一个保龄球游戏，你很可能会有多个表示保龄球瓶的对象，以及另一个表示保龄球的对象。\n\
  *   **数组（Array）：** 数组是一组有索引且有序的数据。在保龄球游戏的例子中，你的保龄球瓶对象都可以存储在一个单独的数组中。添加到数组中的每个项目都会被分配一个编号，从\
  \ 0 开始，每添加一个项目就增加 1。\n*   **关联数组（Associative array）：** 关联数组是一组名称化数据的集合，这些数据不按特定顺序组合。与普通数组不同，关联数组可以将一个项目与任何其他值或项目配对。设想一下，假设我们的保龄球游戏是一个\
  \ 3D 游戏，保龄球瓶上方悬挂着几盏灯。可以使用关联数组将每个保龄球瓶与特定的灯链接起来。\n*   **函数（Function）：** 函数执行定义好的计算或一段代码。在保龄球游戏的例子中，如果保龄球与球瓶接触，可以使用一个函数来使保龄球瓶倒下。\n\
  \n我们稍后将更详细地介绍这些复杂数据类型。\n\n**注意**\n\n在 C/C++ 和 Java 等编程语言中，变量具有静态数据类型（如 `integer`\
  \ 或 `string`），不能将一种数据类型的值赋给不同数据类型的变量。换句话说，如果你有一个 `integer` 类型的变量，就不能将一个字符串赋给该变量。\n\
  \n在 JavaScript 中，情况并非如此。任何数据类型的值都可以赋给一个变量，并且一个完全不同数据类型的值随后也可以重新赋给同一个变量。一个名为 `foo`\
  \ 的变量可以先通过 `foo = 10;` 赋值为一个数字，然后紧接着下一行可以写 `foo = \"bar\";` 来给同一个变量赋一个字符串值。这种灵活性是\
  \ JavaScript 的一大优点，但缺点是，有时在执行计算时需要格外小心。我们稍后会看到这方面的例子。\n\n## 利用自身操作变量\n\n许多游戏中都有一个分数，在玩家得分时会不断更新。要更新这个分数，必须增加存储该分数的变量。请按以下步骤操作来了解具体做法：\n\
  \n清除你写到代码清单 2-5 的代码。输入代码清单 2-6 中所示的代码。\n\n**代码清单 2-6.** 通过引用自身来操作变量\n\n```\nvar\
  \ score = 10;\nscore = score + 20;\ndocument.write(score);\n```\n\n点击“运行”。预览屏幕应显示“30”。\n\
  \n将 `score = score + 20;` 替换为 `score += 20;`\n\n再次点击“运行”。结果相同。步骤 4 使用了一种自引用运算的缩写形式，称为复合赋值运算符。\n\
  \n### 复合赋值运算符\n\n复合赋值运算符是在对变量进行赋值的同时执行另一项运算的运算符。表 2-5 展示了这些有用的运算符。\n\n**表 2-5.**\
  \ 复合赋值运算符\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| `+=` | 加法 | `a += 10`（等价于\
  \ `a = a + 10`） |\n| `-=` | 减法 | `a -= 10`（等价于 `a = a - 10`） |\n| `*=` | 乘法 | `a\
  \ *= 10`（等价于 `a = a * 10`） |\n| `/=` | 除法 | `a /= 10`（等价于 `a = a / 10`） |\n| `%=`\
  \ | 取余 | `a %= 10`（等价于 `a = a % 10`） |\n\n## 使用递增操作操作变量\n\n当变量需要增加 1 时，可以使用一个更简化的运算符。请按以下步骤操作来观察其效果：\n\
  \n清除你当前的代码。输入代码清单 2-7 中的代码。\n\n**代码清单 2-7.** 声明并递增一个变量\n\n```\nvar num = 1;\nnum++;\n\
  document.write(num);\n```\n\n点击“运行”。预览屏幕应显示“2”，表明 `++` 将 `num` 的值增加了 1。\n\n清除你当前的代码。输入代码清单\
  \ 2-8 中的代码。\n\n**代码清单 2-8.** 在语句中递增一个变量\n\n```\nvar num = 1;\ndocument.write(num++);\n\
  num = 1;\ndocument.write(++num);\n```\n\n点击“运行”。屏幕先显示“1”，然后显示“2”。在像 `document.write()`\
  \ 这样的语句中，如果递增运算符（`++`）在变量后面，那么 `document.write()` 语句会先执行；如果运算符出现在变量前面，运算符会在 `document.write()`\
  \ 之前执行。\n\n**注意**\n\n递增运算符的相反运算是递减运算符（`--`）。递减运算符的工作方式与递增运算符完全相同，区别在于它会对所附着的变量执行减\
  \ 1 操作。\n\n\n\n## 比较变量\n\nJavaScript 包含一些被称为关系运算符的命令，用于比较两个值，并根据比较结果返回布尔值 `true`\
  \ 或 `false`。请执行以下操作来直观感受它们：\n\n清除当前代码。输入代码清单 2-9 中的代码。\n\n**代码清单 2-9.** 比较值\n\n\
  ```\nvar num0 = 4;\nvar num1 = 7;\ndocument.write(num0 >= num1);\ndocument.write(num0\
  \ < num1);\ndocument.write(num0 === num1);\n```\n\n点击“运行”。屏幕首先显示 `false`，因为 4 不小于等于\
  \ 7；然后显示 `true`，因为 4 小于 7；最后再次显示 `false`，因为 4 不等于 7。\n\n表 2-6 列出了可用的关系运算符。\n\n**表\
  \ 2-6.** 关系运算符\n\n| 运算符 | 描述 | 示例 |\n| --- | --- | --- |\n| `==` | 相等 | `a == b`\
  \ |\n| `===` | 严格相等 | `a === b` |\n| `!=` | 不相等 | `a != b` |\n| `!==` | 严格不相等 |\
  \ `a !== b` |\n| `>` | 大于 | `a > b` |\n| `>=` | 大于等于 | `a >= b` |\n| `<` | 小于 |\
  \ `a < b` |\n| `<=` | 小于等于 | `a <= b` |\n\n### 了解两个值有多相似\n\n通过以下操作，看看相等（`==`）和严格相等（`===`）关系运算符的区别：\n\
  \n清除当前代码。输入代码清单 2-10 中的代码。\n\n**代码清单 2-10.** 不同的相等运算符\n\n```\nvar num0 = 4;\nvar\
  \ num1 = \"4\";\ndocument.write(num0 == num1);\ndocument.write(num0 === num1);\n\
  ```\n\n点击“运行”。屏幕首先显示 `true`，因为如果被比较的两个值中有一个是字符串，`==` 运算符会临时将所有值转换为字符串。这被称为类型转换。然后屏幕显示\
  \ `false`，因为 `===` 运算符不会进行类型转换。要判定为相等，被比较的值必须具有相同的数据类型。\n\n> **注意：** 与相等运算符相对的是不相等运算符（`!=`\
  \ 和 `!==`），它们执行的操作几乎完全相同。但是，`!=` 运算符会进行类型转换，而 `!==` 运算符则不会。\n\n### 操作比较结果\n\n有时你需要操作比较的结果（`true`/`false`）。要了解如何操作这些比较，请执行以下操作：\n\
  \n清除你的代码。输入代码清单 2-11 中的代码。\n\n**代码清单 2-11.** 操作比较结果\n\n```\ndocument.write(!(4 >\
  \ 3));\ndocument.write((4 < 7) && (5 < 13));\ndocument.write((4 > 5) || (4 < 5));\n\
  ```\n\n点击“运行”。\n\n屏幕首先显示 `false`，因为语句 (`4 > 3`) 的结果为 `true`，而 `!` 逻辑运算符将其后的布尔值（`true`/`false`）取反，使其变为\
  \ `false`。然后屏幕显示 `true`，因为 (`4 < 7`) 和 (`5 < 13`) 的结果都为 `true`。`&&`（“与”）逻辑运算符仅当其两侧的语句结果都为\
  \ `true` 时才返回 `true`。最后，屏幕再次显示 `true`，因为在 (`4 > 5`) 和 (`4 < 5`) 中，有一个结果为 `true`。`||`（“或”）运算符在其两侧至少有一个语句结果为\
  \ `true` 时，返回 `true`。表 2-7 列出了逻辑运算符。\n\n**表 2-7.** 逻辑运算符\n\n| 运算符 | 描述 | 示例 |\n\
  | --- | --- | --- |\n| `!` | 若 a 为 `true`，则结果为 `false`；若 a 为 `false`，则结果为 `true`\
  \ | `!a` |\n| `&&` | 若 a 和 b 均为 `true`，则结果为 `true`，否则为 `false` | `a && b` |\n| `\\\
  |\\|` | 若 a 或 b 为 `true`，则结果为 `true`，否则为 `false` | `a \\|\\| b` |\n\n## 使用 If 语句实现逻辑判断\n\
