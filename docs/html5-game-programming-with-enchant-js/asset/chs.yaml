  \n图 1-9.\n\n\"派生\"弹窗\n\n第二次点击\"派生\"后，会显示一个源代码编辑界面，其中已预填了代码。如代码清单 1-8 所示，这段代码使用 `enchant.js`\
  \ 显示字符串\"Hello,Bear\"，类似于我们在前一小节创建\"Hello World!\"程序的方式。\n\n代码清单 1-8. 在屏幕上显示\"Hello,Bear\"\
  \n\n```\nenchant(); //启动 enchant.js 的神奇命令\n\nwindow.onload = function() {\n\ngame\
  \ = new Game();\n\ngame.onload = function() {                    // 准备游戏\n\nhello\
  \ = new Label(\"Hello,Bear\");     // 创建一个带有文本\"Hello,Bear\"的新标签\n\nhello.x = 10;\
  \                                     // 将标签向右放置 10 像素（0 始终表示左边界）\n\nhello.y = 150;\
  \                                    // 将标签向下放置 150 像素（0 始终表示上边界）\n\ngame.rootScene.addChild(hello);\
  \ // 在活动屏幕上显示标签\n\n}\n\ngame.start(); // 开始游戏\n\n}\n```\n\n就像我们之前的例子一样，这段代码在屏幕上创建了一个标签。在这里，我们将标签放置得更靠近屏幕中央，并将文本指定为\"\
