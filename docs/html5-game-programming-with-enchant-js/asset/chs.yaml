  ```\n\n\n### 添加生命条\n\n目前，玩家只要被击中一次就会死亡。如果至少被击中三次才倒下，似乎会更公平。考虑到这一点，让我们添加一些功能，让玩家拥有多条生命，并在死亡前能承受几次攻击。请执行以下操作来实现：\n\
  \n在 `game.onload` 函数中，位于 `//游戏内变量与属性` 部分下方，添加一个变量作为 `Core` 对象（`game`）的一部分，用于追踪玩家的生命值。输入代码清单\
  \ 6-63 中的代码。\n\n**代码清单 6-63. 创建生命变量**\n\n```\ngame.life = 3;\n```\n\n我们现在初始化了一个变量，表示玩家剩余的命数。因为我们是在\
  \ `game.onload` 内部使用 `game.life` 作为变量名（使用 `game.` 前缀使其成为此处名为 `game` 的 `Core` 对象的一部分），所以可以从游戏内的任何位置引用它。\n\
  \n重写 `EnemyShoot` 类，使其在玩家被敌人子弹击中时，将生命值减少 1。请将类修改为与代码清单 6-64 中的代码一致。你应该删除 `game.end(game.score,\
  \ \"SCORE: \" + game.score);` 这一行，并将其替换为粗体部分的代码。\n\n**代码清单 6-64. 被击中时减少生命**\n\n\
  ```\n// 敌人子弹类\nvar EnemyShoot = enchant.Class.create(Shoot, { // 继承子弹类\ninitialize:\
  \ function(x, y){\nShoot.call(this, x, y, Math.PI);\nthis.addEventListener('enterframe',\
  \ function(){\nif(player.within(this, 8)){         // 子弹击中玩家\ngame.life--;\n}\n\
  });\n}\n});\n```\n\n在 `game.life--;` 下方，但仍位于 `if` 语句内部，编写另一个 `if` 语句，以便当玩家生命值小于或等于\
  \ 0 时结束游戏。输入代码清单 6-65 中的代码。\n\n**代码清单 6-65. 生命值为 0 时结束游戏**\n\n```\nif(game.life<=0)\n\
  game.end(game.score, \"SCORE: \" + game.score);\n```\n\n我们已经重写了游戏逻辑，使得玩家被击中时生命值减少\
  \ 1，当生命值降为 0 时游戏结束。我们可以创建一个类来显示生命值，但屏幕上需要添加的东西并不多，因此在这种情况下，更高效的做法是直接在 `game.onload`\
  \ 中创建指示器。\n\n我们将使用 `ui.enchant.js` 插件提供的 `MutableText` 类来制作生命指示器。`MutableText` 类与\
  \ `Label` 类非常相似，但它不是使用计算机上已安装的字体在屏幕上创建文本，而是像 `Sprite` 一样，使用精灵表中的文字图像来生成文本。\n\n注意\n\
  \n`ScoreLabel` 类是 `MutableText` 类的扩展，行为方式类似。\n\n如果我们在这里使用常规的 `Label` 类，由于会使用系统字体，显示效果会相当简陋。通过使用\
  \ `MutableText`，你可以使用更好看的字体，并且由于使用图像而非系统字体，可以确保文字在各种浏览器或操作系统上运行时看起来都一致。\n\n在 `game.onload`\
  \ 函数内，位于 `player = new Player(0, 152);` 这一行下方，通过输入代码清单 6-66 中的代码，创建一个 `MutableText`\
  \ 的新实例。第一个参数（`8`）指定新实例左上角的 X 位置，第二个参数（`320 – 32`）指定 Y 位置，第三个参数（`game.width`）指定标签的宽度，第四个参数指定要显示的文本。\n\
  \n**代码清单 6-66. 创建 `lifeLabel`**\n\n```\ngame.onload = function() {\n//游戏内变量与属性\n\
  background = new Background();\ngame.life = 3;\nscoreLabel = new ScoreLabel(8, 8);\n\
  game.rootScene.addChild(scoreLabel);\nplayer = new Player(0, 152);\nenemies = [];\n\
  // 显示生命\nlifeLabel = new MutableText(8, 320 - 32, game.width, \"\");\n```\n\n在 `lifeLabel\
  \ = new MutableText(8, 320 – 32, game.width, \"\");` 这一行下方，但仍位于 `game.onload` 函数内部，创建一个事件监听器，用于更新\
  \ `lifeLabel` 的文本，使其显示与玩家剩余生命数量相等的“O”。输入代码清单 6-67 中的代码。\n\n**代码清单 6-67. 显示命数**\n\
  \n```\nlifeLabel.addEventListener('enterframe', function(){\nthis.text = \"LIFE\
  \ \" + \"OOOOOOOOO\".substring(0, game.life);\n});\n```\n\n因为我们在 `enterframe` 事件监听器中定义了\
  \ `lifeLabel` 的文本，所以生命条会在每一帧都更新。\n\n让我们来看看 `\"OOOOOOOOO\".substring(0, game.life);`\
  \ 这部分。这里的“O”代表游戏中的一条命。`\"OOOOOOOOO\"` 是一个 JavaScript 字符串对象，因此我们可以直接调用应用于该字符串的方法。通过使用\
  \ `substring()` 方法，我们可以从字符串的开头提取文本到指定的位置。\n\n需要注意的是，`substring()` 方法的第二个参数表示子字符串应提取字符的结束位置（但不包含此位置）。请记住，字符串和数组中的位置引用是从\
  \ 0 开始的。这意味着如果 `game.life` 等于 3，并且使用 `\"OOOOOOOOO\".substring(0, game.life);` 处理子字符串，那么子字符串将返回位置\
  \ 0、位置 1 和位置 2 的字符，但在到达位置 3 之前会停止。\n\n这就是为什么游戏开始时有三条命，在游戏中显示为三个“O”（`\"LIFE 000\"\
  `）。随着生命值减少，它会显示 `\"LIFE OO\"`，然后变成 `\"LIFE O\"`。\n\n如你所见，enchant.js 允许你轻松创建游戏指示器，而无需创建一个全新的类。\n\
  \n最后，在事件监听器下方，通过输入代码清单 6-68 中的代码，将 `lifeLabel` 添加到 `rootScene`。\n\n**代码清单 6-68.\
  \ 将 `lifeLabel` 添加到 `rootScene`**\n\n```\ngame.rootScene.addChild(lifeLabel);\n\
  ```\n\n![A978-1-4302-4744-9_6_Fig8_HTML.jpg](img/A978-1-4302-4744-9_6_Fig8_HTML.jpg)\n\
  \n图 6-8. 带有生命条的街机射击游戏\n\n点击运行。生命条将如图 6-8 所示显示。\n\n如果你在本节遇到问题，可以在 [`http://code.9leap.net/codes/show/30801`](http://code.9leap.net/codes/show/30801)\
  \ 找到完整的可工作代码示例。\n\n### 总结\n\n希望你能看到，最终射击程序的整体流程与我们本章前面看到的简单原型并没有太大的不同。实际上，`Background`\
  \ 类和其他许多类与我们在本章开始时检查的原型完全一样。\n\n正如我们在第 5 章的“打地鼠”示例中看到的，通过逐步重写和改进原型，可以开发出一个功能完整且复杂的游戏。\n\
  \n在本章中，我们探索了一个射击游戏的开发过程，了解了如何为子弹、敌人和玩家创建类，以及如何处理子弹与敌人或玩家飞船之间的碰撞检测。然后，我们研究了更高级的概念，这些概念可用于改进基础游戏，包括爆炸效果、生命条等。\n\
