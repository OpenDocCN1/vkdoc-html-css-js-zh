  \n图 1-25. 上传后的游戏出现在游戏上传/编辑界面\n\n## 结论\n\n在本章中，我们介绍了 enchant.js 的基本特性，并展示了 enchant.js\
  \ 游戏如何融入网页结构。我们简要介绍了 JavaScript、HTML5 和 CSS，以及如何在 `code.9leap.net` 上开始编写游戏代码。最后，我们探讨了如何通过\
