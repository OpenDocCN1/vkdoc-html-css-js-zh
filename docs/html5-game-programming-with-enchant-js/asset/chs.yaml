  \ ) 查看这一步的结果。\n\n\n\n#### 让机器人随机出现\n\n根据我们目前的代码，如果复制了多个地洞，所有机器人都会在同一时间出现。我们需要让机器人的出现时间随机化。目前只有模式\
  \ `0`（出现）和模式 `1`（隐藏），因此我们需要添加一个模式，用于在两个阶段之间等待随机时长，具体操作如下：\n\n通过使用清单 5-5 中的代码重新定义\
  \ `Pit` 类，对该类进行升级，使其在出现和隐藏之间产生随机的时间间隔。\n\n```\n//生成随机数的函数\nrand = function(n){\n\
  return Math.floor(Math.random()*n);\n}\n//定义地洞类\nPit = Class.create(Sprite,{\ninitialize:function(x,y){\n\
  //调用 Sprite 类（父类）的构造函数\nenchant.Sprite.call(this,48,48);\nthis.image = game.assets[’mogura.png’];\n\
  this.x = x;\nthis.y = y;\n//定义每帧都会执行的事件监听器\nthis.addEventListener(’enterframe’,this.tick);\n\
  //初始时设置机器人模式为 2（等待）\nthis.mode = 2;\n//设置下一个模式为 0（出现）\nthis.nextMode = 0;\n//等待一个随机数量的帧（0-99）\n\
  this.waitFor =    game.frame+rand(100);\n},\ntick:function(){\n//只在每隔一帧改变帧数\n//return\
  \ 语句会结束函数\nif(game.frame%2!=0)return;\nswitch(this.mode){\n//机器人正从地洞中冒出\ncase 0:\n\
  this.frame++;\nif(this.frame>=4) {\n//出现后切换到模式 2（等待）\nthis.mode=2;\n//模式 2 之后要进入的模式是模式\
  \ 1（隐藏）\nthis.nextMode=1;\n//设置 0 到 99 帧的随机等待时间\nthis.waitFor = game.frame+rand(100);\n\
  }\nbreak;\n//机器人正要躲入地洞\ncase 1:\nthis.frame--;\n//如果机器人已隐藏...\nif(this.frame<=0){\n\
  //切换到模式 2（等待）\nthis.mode=2;\n//下一个模式应为模式 0（出现）\nthis.nextMode=0;\n//设置 0 到 99 帧的随机等待时间\n\
  this.waitFor = game.frame+rand(100);\n}\nbreak;\n//机器人正在等待\ncase 2:\n//如果游戏的当前帧大于设定的等待帧数...\n\
  if(game.frame>this.waitFor){\n//转换到下一个模式\nthis.mode = this.nextMode;\n}\nbreak;\n\
  }\n}\n});\n```\n\n我们添加了一个名为 `rand()` 的函数用于生成随机数，并创建了一个新的模式：模式 `2`（等待）。\n\n从游戏启动以来经过的帧数存储在\
  \ `game.frame` 中。当 `waitFor` 中设定的帧数到达后，我们便会切换到下一个模式。通过将这个模式插入到模式 `0`（出现）和模式 `1`（隐藏）之间，就可以随机化机器人出现和隐藏之间的时间。\n\
  \n如果遇到任何问题，请查看 [`http://code.9leap.net/codes/show/23731`](http://code.9leap.net/codes/show/23731)\
  \ 上的代码。\n\n#### 实现敲击机器人\n\n到目前为止，我们已经设置了机器人朋友随机出现和隐藏的功能。现在让我们来创建他被玩家点击时的处理逻辑。对于所谓的“敲击”事件，我们使用一个\
  \ `touchstart` 事件监听器（事件监听器在第 2 章中介绍过）。请执行以下步骤来实现：\n\n通过添加清单 5-6 中加粗部分的代码，修改 `Pit`\
  \ 类。\n\n```\n//定义地洞类\nPit = Class.create(Sprite,{\ninitialize:function(x,y){\n//调用\
  \ Sprite 类（父类）的构造函数\nenchant.Sprite.call(this,48,48);\nthis.image = game.assets[’mogura.png’];\n\
  this.x = x;\nthis.y = y;\n//定义每帧都会执行的事件监听器\nthis.addEventListener(’enterframe’,this.tick);\n\
  //定义机器人被敲击时的事件监听器\nthis.addEventListener(’touchstart’,this.hit);\n//初始时设置机器人模式为\
  \ 2（等待）\nthis.mode = 2;\n//设置下一个模式为 0（出现）\nthis.nextMode = 0;\n//等待一个随机数量的帧（0-99）\n\
  this.waitFor =    game.frame+rand(100);\n},\ntick:function(){\n//只在每隔一帧改变帧数\n//return\
  \ 语句会结束函数\nif(game.frame%2!=0)return;\nswitch(this.mode){\n//机器人正从地洞中冒出\ncase 0:\n\
  this.frame++;\nif(this.frame>=4) {\n//出现后切换到模式 2（等待）\nthis.mode=2;\n//模式 2 之后要进入的模式是模式\
  \ 1（隐藏）\nthis.nextMode=1;\n//设置 0 到 99 帧的随机等待时间\nthis.waitFor = game.frame+rand(100);\n\
  }\nbreak;\n//机器人正要躲入地洞\ncase 1:\nthis.frame--;\n//如果机器人已隐藏...\nif(this.frame<=0){\n\
  //切换到模式 2（等待）\nthis.mode=2;\n//下一个模式应为模式 0（出现）\nthis.nextMode=0;\n//设置 0 到 99 帧的随机等待时间\n\
  this.waitFor = game.frame+rand(100);\n}\nbreak;\n//机器人正在等待\ncase 2:\n//如果游戏的当前帧大于设定的等待帧数...\n\
  if(game.frame>this.waitFor){\n//转换到下一个模式\nthis.mode = this.nextMode;\n}\nbreak;\n\
  }\n},\n//敲击机器人\nhit:function(){\n//只有当机器人至少露出半张脸时\nif(this.frame>=2){\n//被敲击后的机器人\n\
  this.frame=5;\n//切换到等待模式\nthis.mode=2;\nthis.nextMode=1;\n//等待帧数固定为 10\nthis.waitFor\
  \ = game.frame+10;\n}\n}\n});\n```\n\n请注意我们刚刚添加的新函数 `hit`。如果你在机器人至少露出半张脸时点击它，就会播放被敲击的动画。\n\
  \n在被敲击的机器人帧显示了十帧之后，机器人会再次切换到模式 `1`（隐藏）。这种在实现其他功能的同时切换状态的程序被称为状态机。\n\n如果你的代码出现了意外的行为，可以查看该步骤的结果，网址为\
  \ [`http://code.9leap.net/codes/show/23739`](http://code.9leap.net/codes/show/23739)。\n\
  \n现在，我们已经创建了一个打地鼠游戏的基本要素——在这个游戏里，你要欺负我们的机器人朋友。不过，我们仍然有一个问题：如果你不断地敲击机器人，它的脸就会卡在被敲击的状态。\n\
  \n\n\n#### 防止连续敲击机器人\n\n我们需要确保机器人被敲击后，无法再次击中它，使其保持在被击打状态。为此，我们给 `Pit` 类添加一个新属性来实现，具体操作如下：\n\
  \n更新 `Pit` 类，添加清单 5-7 中的粗体部分。\n\n**清单 5-7.** 防止循环击打动画\n\n```\n//Define a class for\
  \ holes\nPit = Class.create(Sprite,{\n  initialize:function(x,y){\n    //Call the\
  \ Sprite class (super class) constructor\n    enchant.Sprite.call(this,48,48);\n\
  \    this.image = game.assets['mogura.png'];\n    this.x = x;\n    this.y = y;\n\
  \n    //Defines an event listener to run every frame\n    this.addEventListener('enterframe',this.tick);\n\
  \n    //Defines an event listener for when the Droid gets whacked\n    this.addEventListener('touchstart',this.hit);\n\
  \n    //Set the Droid mode to 2 (waiting) in the beginning.\n    this.mode = 2;\n\
  \n    //Set the next mode as 0 (appearing)\n    this.nextMode = 0;\n\n    //wait\
  \ for a random number (0-99) of frames\n    this.waitFor =    game.frame+rand(100);\n\
  \n    //stores info on whether or not the Droid\n    //has already been whacked\n\
  \    this.currentlyWhacked = false;\n  },\n\n  tick:function(){\n    //only change\
  \ the frame every other frame\n    //the return call ends the function\n    if(game.frame%2!=0)return;\n\
  \n    switch(this.mode){\n      //Droid is appearing from the hole\n      case 0:\n\
  \        this.frame++;\n        if(this.frame>=4) {\n          //switch to Mode\
  \ 2 (waiting) after appearing\n          this.mode=2;\n          //the mode to go\
  \ to after Mode 2 is Mode 1 (hide)\n          this.nextMode=1;\n          //Set\
  \ a random waiting time for 0 ∼ 99 frames\n          this.waitFor = game.frame+rand(100);\n\
  \        }\n        break;\n\n      //Droid is going to hide in the hole\n     \
  \ case 1:\n        this.frame--;\n        //if Droid is hidden...\n        if(this.frame<=0){\n\
  \          //Switch to Mode 2 (waiting)\n          this.mode=2;\n          //The\
  \ next mode should be Mode 0 (appear)\n          this.nextMode=0;\n          //Set\
  \ a random waiting time for 0 ∼ 99 frames\n          this.waitFor = game.frame+rand(100);\n\
  \          //reset flag as the whacked Droid disappears\n          this.currentlyWhacked\
  \ = false;\n        }\n        break;\n\n      //Droid is waiting\n      case 2:\n\
  \        //if the game's current frame is greater than\n        //the set frame\
  \ to wait for...\n        if(game.frame>this.waitFor){\n          //Make a transition\
  \ to the next mode\n          this.mode = this.nextMode;\n        }\n        break;\n\
  \    }\n  },\n\n  //Whack Droid\n  hit:function(){\n    //Do nothing if the Droid\
  \ has already been whacked\n    if(this.currentlyWhacked)return;\n\n    //only when\
  \ Droid has appeared at least half-way\n    if(this.frame>=2){\n      //Set the\
  \ flag so we know he's been whacked\n      this.currentlyWhacked = true;\n     \
  \ //Droid after being whacked\n      this.frame=5;\n      //Switch to waiting mode\n\
  \      this.mode=2;\n      this.nextMode=1;\n      //Number of frames to wait is\
  \ fixed at 10\n      this.waitFor = game.frame+10;\n    }\n  }\n});\n```\n\n这里，我们添加了\
  \ `currentlyWhacked` 属性，这是一个标志，用于指示机器人是否已被敲击。当机器人被创建时，该属性设置为 `false`。每当机器人被敲击时，该属性被设置为\
  \ `true`，并开始隐藏动画序列。机器人消失后，该标志被重置为 `false`，因为新的机器人将从洞中钻出。这样，我们就避免了机器人被连续敲击的情况。\n\n\
  如果你在编写与示例匹配的代码时遇到问题，可以查看 [`code.9leap.net/codes/show/23740`](http://code.9leap.net/codes/show/23740)\
  \ 上的代码。\n\n#### 复制洞穴\n\n我们已经几乎完成了只有一个洞穴的敲击机器人游戏的基础构建。你可能会想：“我们费这么大劲就只做了一个洞？”通过像这样创建一个类，我们眨眼间就能完成整个游戏。请执行以下操作来复制洞穴：\n\
