  \n## 增强游戏功能\n\n目前，我们的游戏已经是一个可运行的作品。我们本可以就此打住，转而开发另一个游戏，但让我们探讨几种通过添加功能让游戏更具吸引力的方法。\n\
  \n我们将在原始游戏的基础上进行多项增强，接下来的章节将逐一说明实现方式。\n\n### 爆炸效果\n\n首先，我们来添加爆炸效果。目前，敌机被击毁后只是直接消失。让我们通过添加爆炸效果来增加一些视觉冲击。\n\
