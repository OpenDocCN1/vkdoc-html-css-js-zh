  \n虽然在作者列表中未列名，但埃里克·麦克弗做了大量的翻译工作，将本书的原始日文版翻译过来。我不仅非常感激他大大减少了我在整理本书出版资料时所需的翻译工作量，更因为他介绍我加入尤比奎特斯娱乐公司，我才得以在东京生活和工作。言语无法表达我的感激之情，埃里克。毫无疑问，你改变了我的人生。致所有读者：埃里克目前在新加坡攻读电影导演硕士学位，我坚信我们终有一天会在银幕上看到他的杰作，这些作品将为日本文化提供令人耳目一新的全新视角。去[`ericmcever.com`](http://ericmcever.com)看看他的电影吧！\n\
