  \ 也是如此。\n\n### 编辑源代码\n\n要编辑源代码，请从资源下拉列表中选择 `main.js`。此时屏幕应如图 1-12 所示。\n\n![A978-1-4302-4744-9_1_Fig12_HTML.jpg](img/A978-1-4302-4744-9_1_Fig12_HTML.jpg)\n\
