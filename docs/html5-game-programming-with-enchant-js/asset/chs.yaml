  \ 5，因为精灵图显示的总序列长度为 5 帧。此时结果很可能带有小数（如 4.42），因此用`Math.floor`向下取整，将结果赋值给爆炸的当前帧。这样爆炸就能在\
  \ 20 帧内平滑播放，并且只需将`duration`的值从 20 改为其他数字即可调整播放速度。\n\n**代码清单 6-50 为`frame`赋值**\n\n\
