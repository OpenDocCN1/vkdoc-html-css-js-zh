  \ 找到可运行的代码示例。\n\n## 创建 `enemyShoot` 类并使敌人能够射击\n\n到目前为止，游戏还没有失败的可能，这不太有挑战性。让我们创建一个用于敌人弹药的类，并使敌人能够向飞船开火以提高游戏难度。请执行以下操作：\n\
