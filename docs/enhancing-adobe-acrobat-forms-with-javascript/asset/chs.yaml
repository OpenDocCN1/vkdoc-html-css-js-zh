  \ 作为修饰符用于不区分大小写的匹配，然后使用 `.replace` 方法将 `.pdf` 设为空白。您还要求脚本将此文件的名称添加到页面左下角，字号为 12，垂直数值或位置为\
  \ 18。同时将字体设置为红色，不透明度为 40%。在此情况下，1 等于 100%，0.1 等于 10%。如果您只希望文本默认为黑色，可以移除 `aColor`\
  \ 和 `nOpacity` 这两行。\n\n彩色的版本应类似图 15-11 所示，但具体取决于您如何命名文件。\n\n有关正则表达式的更多信息，请访问以下页面：\n\
