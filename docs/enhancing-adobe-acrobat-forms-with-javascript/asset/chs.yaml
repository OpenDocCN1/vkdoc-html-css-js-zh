  这里，我最初选择了“鼠标释放 - 重置表单”操作，你可以在第 2 章和第 4 章中了解如何执行此操作。但是，没有预设的方法来设置字段焦点，因此改为将触发器设置为“获得焦点”，然后选择“运行\
