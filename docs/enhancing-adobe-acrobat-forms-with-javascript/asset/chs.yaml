  \ = color.black;\n}\n}\n```\n\n或者，在“动作”选项卡中针对单个字段，可以编写如下代码：\n\n```\nvar f = this.getField(\"\
  myButton\");\nf.strokeColor = color.blue;\nf.fillColor = color.red;\nf.textColor\
  \ = color.black;\n```\n\n在这种情况下，一旦点击按钮（鼠标释放），就会应用此格式。\n\n关于旋转、文本对齐和高亮属性的其他格式选项，可在此处找到：\n\
