  \  打印（“可见时”、“从不”或“始终”）\n    *   导出（“可见时”、“从不”或“始终”）\n*   图层非常适合用于覆盖图，例如显示房间或楼层的可选布局。当你创建交互式\
  \ PDF 时，可以从诸如 Adobe InDesign 之类的程序分离并导出图层。\n*   与其他操作不同，图层操作可能设置起来比较棘手，最好只保留一两个图层。\n\
