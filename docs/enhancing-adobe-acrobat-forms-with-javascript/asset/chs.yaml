  \n![](img/449379_2_En_11_Fig2_HTML.jpg)\n\n一个页面的截图包含 2 列，分别用于显示发送方和接收方账户的详细信息。其中有一行，每个账户各包含\
  \ 3 个复选框（分别对应支票、储蓄和货币市场专业账户），并且支票账户的复选框处于选中状态。\n\n图 11-2\n\n支票账户转储蓄账户或货币市场专业账户是可实现的转账操作\n\
  \n在图 11-2 中的选择不会触发警告，因为您是将资金从支票账户转至储蓄账户。但是，如果您尝试从储蓄账户转至储蓄账户，则会收到一条警告。\n\n这种类型的转账会触发警告提示。您必须单击`OK`，然后单选按钮将自动重置为空白状态。\n\
  \n如果您尝试从支票账户转至支票账户，或从货币市场专业账户转至货币市场专业账户，也会收到警告。\n\n图 11-4 展示了按钮在表单编辑模式下的设置方式。\n\n\
  ![](img/449379_2_En_11_Fig4_HTML.jpg)\n\n一个页面的截图包含一张表格，该表格有 2 列，分别用于显示发送方和接收方账户的详细信息，每个账户各包含\
  \ 3 个单选按钮（分别对应支票、储蓄和货币市场专业账户）。\n\n图 11-4\n\n单选按钮布局：左侧是`发件人`组，右侧是`收件人`组\n\n如前所述，单选按钮必须始终分组才能正常工作；它们在`常规`选项卡上需要具有相同的名称。它们可以在`选项`选项卡上具有不同的值或单选按钮选项，但它们必须属于同一个组。请参考图\
  \ 11-5。\n\n![](img/449379_2_En_11_Fig5_HTML.jpg)\n\n一张截图左侧显示了第 1 页的展开视图。其中包含`发件人`和`收件人`的单选按钮组。右侧显示了第\
  \ 1 页的展开视图，并进一步展开了`发件人`和`收件人`组，其中包含了用于支票、储蓄和`货币市场`的选项。\n\n图 11-5\n\n`准备表单`工具展示了单选按钮组在折叠和展开时的状态，正如`字段`面板右侧所示。\n\
