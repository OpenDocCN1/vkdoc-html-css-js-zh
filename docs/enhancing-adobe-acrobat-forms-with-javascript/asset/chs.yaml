  \ 7 章中提到的那样对数字进行向上或向下取整。\n\n### 使用日期文本字段的复选框变体\n\n如第 2 章所述，如果复选框在“常规”选项卡上被赋予相同的名称，它们可以充当单选按钮。然后必须在“选项”选项卡上更改值。\n\
