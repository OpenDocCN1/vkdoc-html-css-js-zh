  \ 20-44。\n\n![](img/449379_2_En_20_Fig44_HTML.jpg)\n\n三张截图展示了在工作表中构建公式的步骤：选择所需的行字段，以及日期、逻辑和数学函数。其中有一个空白区域用于输入包含函数的公式，并且“检查语法”按钮被高亮显示。\n\
  \n**图 20-44** — 使用对话框添加公式\n\n点击字段或函数旁边的加号键，可以将该项添加到公式中。此外，还有一些额外的运算符，你可以通过点击来进行字段的加、减、乘、除，以及大于或小于等其他条件操作。当然，你也可以直接手动输入文本。\n\
