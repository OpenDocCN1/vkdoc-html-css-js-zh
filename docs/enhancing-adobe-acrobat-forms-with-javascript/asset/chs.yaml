  \ 1`”至“`6`”和“`预填`”。\n\n**图 20-15**  \n用于“`文本域`”设置的“`常规`”选项卡，称为“`参与者角色`”\n\n其他可以设置的字段包括复选框、单选按钮和下拉列表。在“`常规`”选项卡上，这些字段类型将变灰并禁用，因此您无法对其进行编辑。此外，对于单选按钮，您将无法更改“`参与者角色`”和“`签署人电子邮件`”设置。请参阅图\
  \ 20-16。\n\n![](img/449379_2_En_20_Fig16_HTML.jpg)\n\n两张屏幕截图展示了“`常规`”选项卡下的选项，顶部带有复选框、单选按钮和下拉列表图标。它们分别显示名称为\
  \ `dropdown 1` 及相应工具提示，以及第二个截图中的 `group 1` 和 `radio 1`，以及禁用的字段类型、参与者角色和签署人电子邮件。\n\
  \n**图 20-16**  \n复选框、单选按钮和下拉列表在“`常规`”选项卡中能够设置的字段有限制\n\n没有列表框或按钮、图像或条形码字段可用。但是，在“`准备工具`”区域，您仍然可以选择字段（双击即可编辑）的选项。您也可以编辑文本和图像，以及添加文本框。请参阅图\
