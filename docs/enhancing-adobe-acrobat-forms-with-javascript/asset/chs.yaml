  \n## JavaScript 与 Acrobat 文档级操作\n\n在 Acrobat Pro 中，要使表单中的某个字段产生事件或动作，需要遵循以下公式：\n\
  \n触发器 + 选择动作 = 结果\n\n除了知道触发的内容，您还需要知道结果将流向何处。对于表单、数据或需要从字段（文本、下拉列表、复选框、单选按钮等）获取的值，这些数据的集合将被存入最终字段作为所需的结果。无论使用值、简化字段表示法还是\
  \ JavaScript，了解这些字段的确切名称都至关重要。如果您不知道确切名称，将无法获得结果，表单也会失效。为避免字段混淆，每个字段都必须具有唯一的名称。\n\
  \n命名规则的例外是单选按钮组，它们作为一个整体工作；但是，它们的组必须具有不同的名称。对于所有其他字段，一个表单中不能有两个或多个名为`Sum1`的字段才能独立运行；它们应该命名为`Sum1`、`Sum2`等。\n\
  \n请按照提供的表单示例完成后续章节的课程。名称中包含“End”的 PDF 文件是最终结果。\n\n## 总结\n\nJavaScript 可以添加到多个区域；这完全取决于您计划使用哪种表单字段，或者您打算将\
  \ JavaScript 添加到整个文档。在下一章中，您将看到如何利用 SFN 和 JavaScript 的知识来改进用于创建计算的表单。\n\n"
