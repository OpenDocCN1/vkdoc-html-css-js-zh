  \ 4-51 所示。\n\n![](img/449379_2_En_4_Fig51_HTML.jpg)\n\n一张书签属性页面的截图，有“外观”和“动作”两个选项卡，其中“动作”选项卡被选中。有一个下拉菜单用于选择动作为`设置图层可见性`，后面跟着一个“添加”按钮。它有一个动作框，后面跟着“编辑”和“删除”两个按钮。\n\
  \n**图 4-51**  \n书签动作属性\n\n请注意，动作`转到本文档中的页面`已经添加。但是，你还需要添加`设置图层可见性`动作。点击`添加`后，会出现一个信息警告，提醒你图层的当前状态将成为此书签显示的状态。如果你对图层可见性不满意，请点击`取消`，并在应用动作并选择`确定`之前将图层设置为正确的状态。请参考图\
  \ 4-52。\n\n![](img/449379_2_En_4_Fig52_HTML.jpg)\n\n一张页面的截图，显示来自 Adobe Acrobat 的警告消息，内容为：所选动作的目标图层状态将设置为当前状态，后面跟着一个“确定”按钮和一个“取消”按钮。页面底部有一个动作框，其中包含一个`设置图层可见性`的动作。\n\
  \n**图 4-52**  \n在`动作`选项卡上为设置图层可见性显示的书签动作警告属性\n\n现在，你的书签应该能够根据设置的状态显示或隐藏图层。与任何动作一样，可以选中它，然后点击`动作`选项卡上的`删除`按钮将其移除。你也可以对其他书签重复此操作。\n\
  \n\n\n### 使用按钮\n\n与书签类似，您也可以使用按钮。请参考图 4-53。不过，当其他图层可见时，您可能希望隐藏某些按钮和图层以减少杂乱。此外，您可能还希望通过一个按钮将所有图层重置为关闭或隐藏状态。您可以查看文件，了解最终效果。以下列表显示了在“鼠标释放”触发器上应用于每个按钮的设置。与书签一样，在设置每个按钮的图层可见性之前，请确保图层处于您想要的状态。完成后，务必测试您的文件。\n\
  \n![](img/449379_2_En_4_Fig53_HTML.jpg)\n\n一个页面的截图显示了三个按钮，用于显示平面图、供应商编号和隐藏图层，其中显示平面图的第一个按钮已被选中。它包含一个操作列表，并且“鼠标释放”操作已被选中。\n\
  \n**图 4-53**  \n应用于按钮的设置示例\n\n![](img/449379_2_En_4_Fig54_HTML.jpg)\n\n一个页面的截图显示了来自\
  \ Adobe Acrobat 的警告消息，内容为：所选操作的目标图层将被设置为当前状态，随后是两个按钮（确定和取消），其中“确定”按钮已被选中。\n\n**图\
  \ 4-54**  \n这是在设置图层可见性时出现的信息提示\n\n- **显示平面图按钮**：设置图层可见性。您可以选择：显示 – 显示供应商编号 和 显示\
  \ – 隐藏图层按钮。\n- **显示供应商编号按钮**：设置图层可见性。\n- **隐藏图层按钮**：设置图层可见性。您可以选择：隐藏 – 显示供应商编号 和\
  \ 隐藏 – 隐藏图层按钮。\n- 在初始状态下，“常规”选项卡上的“显示平面图按钮”设置为“表单域可见”，而其他两个按钮设置为“隐藏”。\n- 在“图层”窗格中，只有标题图层设置为“打开”；所有其他图层都设置为“关闭”。\n\
  - 在将图层可见性操作添加到每个按钮之前，仅打开您希望显示的图层。单击“确定”以确认设置。请参考图 4-54。\n\n之后，如果您想重新排列操作顺序，可以使用“按钮属性”对话框中的向上和向下按钮，将“设置图层可见性”操作置于最后。您可以在文件\
  \ `Floor_planLayout_2023_End.pdf` 中查看我的顺序。\n\n在您自己的项目中，完成按钮的设置后，请将图层恢复为默认设置，保存文件并关闭。\n\
  \n## 总结\n\n本章涵盖了大量与可应用于表单域和非表单项目（如图层、书签、按钮、页面和超链接）的操作相关的主题。如您所见，Acrobat Pro 在导航以及控制如何查看或隐藏域方面提供了诸多选项。\n\
  \n目前为止，您尚未添加任何自定义 JavaScript，仅使用了 Acrobat“操作”选项卡自带的设置。不过，在本书的下一部分，您将学习如何运行自己的 JavaScript，以及这对您在表单域中输入的内容有何影响。\n\
  \n在继续学习本书后续内容之前，请花些时间自行练习这些操作，并尝试将它们应用到自己的一些项目中。\n\n"
