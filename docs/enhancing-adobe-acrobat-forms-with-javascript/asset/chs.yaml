  \ Pro 用户共享这些操作或命令，他们也可以使用该代码。请花点时间，使用你的操作向导工具向 PDF 文档添加一些新操作。\n\n"
- '# 16. 多状态复选框


  **本章目标：** 当文档空间有限时，能够将多个状态合并到一个字段中通常很有帮助。例如，假设你有一个表单，希望能在其中将设置从空白更改为复选标记（表示“是”），或更改为
  X 或叉号标记（表示“否”或“错误”）。或者，你可能拥有代表不同级别的多个符号。随着填写表单的用户技能提升，他们需要按特定顺序频繁更新其状态。在本章中，你将学习如何使用按钮字段创建一种多状态复选框。


  稍后，你还将了解如何一次选中多个复选框。




  ## 多状态复选框的问题


  如果空间足够大，你可以用单选按钮实现以下效果：


  你喜欢我们的新闻简报吗？ • `是` ❍ `否` ❍ `未决定`


  ```

  • 等级 1  ❍ 等级 2  ❍ 等级 3

  ```


  正如你在 Acrobat 中所发现的，单选按钮以组的形式出现，你只能选择其中一个选项。它们也只呈现两种状态（`开` • 或 `关` ❍）；没有第三个或第四个选项。


  你也可以使用复选框来节省空间。`是`可以表示已勾选，而`否`则表示未勾选。然而，这同样没有第三个选项，填写表单的人可能不确定未勾选究竟表示`否`还是`未决定`。


  你喜欢我们的新闻简报吗？ ❏ `是` ❏ `否` 或 ✓ `是` ✓ `否（我喜欢，但是……）`。


  ✓ `等级 1` ✓ `等级 2` ❏ `等级 3`。这里我可能希望别人知道我现在是等级 2，但这占用了很多空间。


  为了节省空间，一个更直观的复选框提示方式如下：


  你喜欢我们的新闻简报吗？


  *   ❏ - 这表示我尚未回答

  *   ✔ - 这表示是的，我喜欢

  *   ✘ - 这表示不，我不喜欢

  *   或当前等级

  *   ❶

  *   ❷

  *   ❸


  使用 Acrobat 复选框，你可以选择多个选项。但遗憾的是，它们无法具备三种或更多状态，只能处于开或关。


  实现多状态目标的最佳方法是使用按钮字段和 JavaScript 动作来模拟复选框。请参考图 16-1。


  ![](img/449379_2_En_16_Fig1_HTML.jpg)


  一张屏幕截图展示了准备表单图标，以及添加选项卡、一个复选框和一个确定按钮。


  **图 16-1** *用于使按钮看起来像复选框的“准备表单”工具*


  > **注意**

  > 如果你想在本课程中同步操作或查看最终结果，请从引言中的链接下载第 16 章的文件。标有“Start”的文件是未包含代码的文件，标有“End”的文件是最终结果。你还会找到包含原始
  MS Word 和 PDF 文件的文件夹，以便进行编辑，以及一个包含原始脚本的文件夹，以便将其添加到你自己的 PDF 表单中。

  >

  > 如果你是从原始 PDF 创建表单，请参考第 1 章的“表单回顾”部分。

  >

  > 请记住，要查看字段的属性，你必须选择**准备表单**工具；只有这样才能右键单击或双击字段来查看其属性。


  让我们从修改按钮的**外观**选项卡开始，使其看起来像一个复选框。如果需要填充特定区域，你也可以进一步调整其大小。请参考本章文件夹中的文件 `TMC_mineralchecklist_End.pdf`。查看名为
