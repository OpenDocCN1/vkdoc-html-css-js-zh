  \n*图 1-52 — 更多菜单中的 JavaScript 选项*\n\n## 本章小结\n\n本章介绍了表单字段的基础知识、其选项卡以及各个选项卡中的属性，还介绍了如何排列选项卡顺序以及在`准备表单`工具右侧面板中找到的其他设置。下一章将介绍可以应用于字段的基本动作。\n\
  \n"
- "# 2. 动作入门\n\n**章节目标：** 在回顾了基本表单属性之后，您将通过仔细研究可以在每个字段的各个选项卡中应用的几种自动或预编程动作类型，来开始学习\
  \ JavaScript。在本章中，您将处理表单，并了解如何应用动作。\n\n## 开始\n\n如果您想在本课中跟着操作或查看最终结果，请从引言中提到的链接下载第\
  \ 2 章的文件。标有“开始”的文件是不包含代码的文件，标有“结束”的文件是最终结果。您还会找到一个包含原始 MS Word 和 PDF 文件的文件夹（如果您想编辑它们），以及一个包含原始脚本（`.txt`）的文件夹（如果您想将它们添加到自己的\
  \ PDF 表单中）。\n\n> **注意**  \n> 要查看字段的属性，您必须选择`准备表单`工具。只有这样您才能右键单击或双击某个字段以查看其属性。如果您是从一个不包含表单字段的原始\
  \ PDF 创建表单，请参阅第 1 章的“表单回顾”部分。\n\n您可以将动作应用于所有表单字段。正如您将在第 4 章及后续章节中更详细地看到的那样，动作可以触发各种事件，例如警告框，或使字段显示最终计算结果，或使按钮重置表单中的字段。然而，某些动作在某些表单字段上比其他字段效果更好。例如，将动作应用于单选按钮可能会产生一些非常特定的计算，但如果您想对这些值进行求和，使用复选框或文本框可能是更好的选择。\n\
  \n如果页面上有字段，您可以通过单击`准备表单`工具，然后在编辑模式下右键单击该字段并从菜单中选择`属性`，或直接双击该字段来打开并查看其属性。这些示例中的文本框在`动作`选项卡上不包含任何信息，并且是空白的。但是，您很快会看到，字段内的其他选项卡和其他字段类型确实包含会导致事件发生的信息。请参见图\
  \ 2-1。\n\n![](img/449379_2_En_2_Fig1_HTML.jpg)\n\n*图 2-1 — 文本字段属性对话框中的“动作”选项卡*\n\
  \n在这里，您可以看到可以添加动作和触发器的众多区域之一，我将在稍后更详细地讨论它。\n\n\n\n## 评分表单值平均与求和：处理文本字段\n\n我们来看看几种结合使用文本框、单选按钮和复选框进行平均与求和计算的方法。\n\
  \n假设您想创建一个调查问卷，了解客户对您的客服或互动是否有任何疑虑。您可以创建一个评分表单来帮助确定需要改进的地方。在 PDF 表单 `TMC_Customer\
  \ Survey_Start.pdf`（如图 [2-2] 所示）的第 1 页上，您可以看到该表单未设置格式的外观。然而，在最终的“End”表单中，此调查中的评分字段是文本字段，其格式设置为“数字”而非“无”，以确保客户只能输入数字，不能输入字母。\n\
  \n![](img/449379_2_En_2_Fig2_HTML.jpg)\n\n电气石矿业公司的一页。客户的完整姓名、日期以及客户公司名称是表单中的必填信息。有\
  \ 6 个评分因素和进一步的评论区域。`重置评论` 和 `打印` 是评论区域下方表单上的两个按钮。\n\n**图 2-2** 客户调查表示例以及本页和其他页面使用的表单工具（文本字段、复选框和单选按钮）\n\
  \n为确保客户在字段中输入正确的信息，限制其选项非常重要。您可以通过从“选择格式类别”下拉菜单中选择来更改格式。\n\n图 [2-3] 提供了“文本字段属性”对话框中“格式”选项卡所使用的格式示例。在此示例中，我右键单击了一个名为“1\
  \ Sales Rep Helpfulness”的文本字段，并在“格式”选项卡的“选择格式类别”列表中将其从“无”设置为“数字”。默认情况下，“小数位数”将设置为\
  \ 2。但是，如果您需要数字不含小数（如此示例所示），则将其设置为 0。否则，我将其他列表保留在默认设置：分隔符样式（`1,234.56`）、货币符号（无）和符号位置（禁用），以及“负数样式”选项中的“显示括号”和“使用红色文本”保持禁用。请参考图\
  \ [2-3]。\n\n![](img/449379_2_En_2_Fig3_HTML.png)\n\n一个文本字段属性对话框。格式类别选择了“无”选项。相比之下，分隔符样式为\
  \ `1,234.56`，下方对话框中的格式类别为“数字”，小数位数设置为 0。\n\n**图 2-3** 客户调查文件第 1 页上每个评分文本字段的格式设置\n\
