  \n**图 15-13** 操作与命令选项\n\n### 创建和管理自定义命令\n\n自定义命令允许你预先配置命令（例如水印、页眉或页脚），以减少每次设置命令所需的时间。这可以节省重复性任务的时间。在本例中，如果你执行\
