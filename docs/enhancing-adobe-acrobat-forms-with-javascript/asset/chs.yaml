  `Stamp`（图章）工具。请参考图 3-13。


  然后保存文件，并通过电子邮件将文件发送给客户端，或者将其发布在您的网站上。


  如果您需要打印文档（`File`（文件）➤ `Print`（打印）），请在 `Print`（打印）对话框中的 `Comments & Forms`（注释和表单）下选择
  `Document and Stamps`（文档和图章）或 `Document and Markups`（文档和标记）选项。如果您只选择 `Document`（文档）或
