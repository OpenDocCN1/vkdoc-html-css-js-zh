  \n\n#### 添加度数符号和设置格式范围\n\n同样地，你无需局限于仅使用货币符号；正如我们在第 16 章中看到的，还有许多可用的 **Unicode**\
  \ 符号。我发现一个很有用的符号是度数符号。它主要有两种应用场景：输入温度或角度。过去，我只能确保在表单外部添加度数符号。但现在，你可以在输入数字时将其作为表单字段的一部分。接下来的示例使用红色文本表示负值样式。\n\
  \n以下代码展示了如何在文档级 *JavaScript* 中实现。请参考图 18-15。\n\n![](img/449379_2_En_18_Fig15_HTML.jpg)\n\
  \n文档 *JavaScript* 的对话框。脚本名称为 degree format。在下方框的列表中选中了 Degree format。下方列中有一个编辑器，其中包含用于度数格式的函数代码。突出显示了“关闭”按钮。\n\
  \n**图 18-15**  \n对话框中的文档 *JavaScript*（用于度数）\n\n请看 `degreeFormat` 脚本：\n\n```\nfunction\
  \ degreeFormat() {\nvar aFormatFields = new Array(\"Degree0\", \"Degree1\", \"Degree2\"\
  );\nvar nDecimal = \"2\"; // 小数位数\nvar separStyle = \"1\"; // 分隔符样式\nvar negativeStyle\
  \ = \"1\"; // 负值显示样式\nvar currencyStyle = \"0\"; // 货币样式\nvar symCurrency = \"\\\
  \"\\u00b0\\\"\"; // 度数符号\nvar symCurrencyPrepend = \"false\"; // 是否前置（在数字前添加）货币符号的逻辑值\n\
  var strFormat = nDecimal + \", \" + separStyle + \", \" + negativeStyle + \", \"\
  \ + currencyStyle +\", \" + symCurrency + \", \" + symCurrencyPrepend;\nfor (i =\
  \ 0; i < aFormatFields.length; i++) {\nthis.getField(aFormatFields[i]).setAction(\"\
  Format\", \"AFNumber_Format(\" + strFormat + \")\");\nthis.getField(aFormatFields[i]).setAction(\"\
  Keystroke\", \"AFNumber_Keystroke(\"+ strFormat + \")\");\n} // 结束 for 循环\nreturn;\n\
  } // 结束自定义格式函数\n```\n\n或者，如果你只想给一两个字段添加度数符号，可以在文档 *JavaScript* 中编写一个较短的版本，如脚本 `degreeFormat2`\
  \ 所示：\n\n```\nfunction degreeFormat2()\n{\nAFNumber_Format (2,1,1,0,\"\\u00b0\"\
  ,false);\nAFNumber_Keystroke(2,1,1,0,\"\\u00b0\",false);\n}\n```\n\n在任一示例中，转到选择文本字段，然后将格式设置为“自定义”，并添加对函数名称的引用，就像之前看到的那样。对于简短的示例，你需要逐个设置每个字段，但你可能会发现这更简单，因为你只需将这行代码复制粘贴到每个字段的“自定义格式脚本”框中即可。请注意，如果你更改了负数的样式设置，当输入负数时颜色可能最初不符合预期，此时需检查“外观”面板，因为它可能被设置为红色文本颜色，你需要将其调整回黑色。请参考图\
  \ 18-16。\n\n![](img/449379_2_En_18_Fig16_HTML.jpg)\n\n文本字段属性对话框，选中了“格式”选项卡。已选择“自定义格式”类别。自定义格式脚本框中写入了\
  \ *degreeFormat2* 代码。旁边有一个“编辑”按钮。\n\n**图 18-16**  \n在“格式”选项卡上设置自定义 *JavaScript*\n\
  \n然后，你可以在文档 *JavaScript* 中设置自定义范围，例如“如果小于 0”或“大于 360”，并显示警告。\n\n```\nfunction customval(){\n\
  if (event.value 360 ){\napp.beep(0);\napp.alert(\"无效输入：度数值必须在 0 到 360 之间。\");\n\
  event.rc = false;\n}\n}\n```\n> **注意：** 添加 `app.beep` 方法是可选的，因为无论是否添加，警告消息都会发出提示音。\n\
  \n然后，你可以将其添加到每个字段的“验证”选项卡中，作为自定义验证脚本，并引用函数 `customval();`。请参考图 18-17。\n\n![](img/449379_2_En_18_Fig17_HTML.jpg)\n\
  \n文本字段属性对话框，展开了“验证”选项卡。启用了“运行自定义验证脚本”，并在框中输入了 `customval();`。突出显示了“编辑”按钮。下方高亮的矩形框中显示文本：27.00\
  \ degrees。\n\n**图 18-17**  \n带有自定义验证引用的“验证”选项卡\n\n你必须在“验证”选项卡上执行此操作的原因是，“字段值在范围内”选项将无法使用。如果不需要范围限制，则无需将其应用于“验证”选项卡。如果输入不正确，字段将在退出警告后自动重置。\n\
  \n你可以参考图 18-17 和我的文件 `Degree_FormatExamples.pdf`。\n\n> **注意：** 在我的示例中，我使用了较长的描述来说明各种格式变量，以便于理解。但是，你可能会在网上找到其他文档，其中的变量名称写法如下：\n\
  > \n> `AFNumber_Format(nDec, sepStyle, negStyle, currStyle, strCurrency, bCurrencyPrepend);`\
  \  \n> `AFNumber_Keystoke(nDec, sepStyle, negStyle, currStyle, strCurrency, bCurrencyPrepend);`\n\
  > \n> 这两种变量名称写法都有效，但请确保在函数其余部分匹配变量名称。\n> \n> 其他不那么常用的 `AF` 格式和按键事件，你可能需要自行研究，包括\
  \ `AFDate_Format(cFormat)`、`AFTime_Format(pft)`、`AFPercent_Format(nDec, sepStyle)`\
  \ 和 `AFSpecial_Format(psf)`。\n\n### 选项 2：联系专业人士\n\n虽然“数字格式”示例既快速又能消除错误，但如果还有一种更快的方式，甚至包含对话框，那就更好了。幸运的是，经过大量研究，我找到了一位\
  \ JavaScript 开发者，他投入了大量时间来解决这个问题。\n\n他叫 **Gilad Denneboom**（用户名 **Try67**）。他在自己的网站上为\
  \ Acrobat 创建了一个扩展程序，名为“将格式应用于多个文本字段”。你可以在此获取：[`https://www.try67.com/tool/acrobat-apply-format-to-multiple-text-fields`](https://www.try67.com/tool/acrobat-apply-format-to-multiple-text-fields)。\n\
  \n图 18-18 展示了它的界面。\n\n![](img/449379_2_En_18_Fig18_HTML.jpg)\n\n批量格式数字字段对话框。小数位数选为\
  \ 2。货币符号选为美元。其他选项是分隔符样式和自定义货币符号。\n\n**图 18-18**  \n“批量格式数字字段”对话框\n\n他的格式化工具还允许你批量格式化以下类型：\n\
  \n*   百分比\n*   日期\n*   时间\n*   特殊\n\n如果你认为自己会经常进行此类格式化，我认为他售价 60 美元的产品是值得的。\n\n\
  他还有其他产品，例如 [`www.try67.com/tool/acrobat-mass-edit-fields-actions`](https://www.try67.com/tool/acrobat-mass-edit-fields-actions)\
  \ 提供的“Acrobat 批量编辑字段操作”。这个工具甚至允许你通过他的对话框将格式应用于“验证”和“计算”等选项卡区域。\n\n在购买之前，如果你对这些程序有疑问，例如哪个产品最好、它是否适用于你的\
  \ Acrobat Pro 版本、或者如何安装，请先咨询他。他非常乐于助人；在我撰写本书时，他帮我解答了几个问题。他也经常在 Adobe 和 Acrobat 用户论坛中回答问题。\n\
  \n## 本章小结\n\n在本章中，你了解了如何使用数字格式对多个文本字段进行格式化。虽然你可以轻松地为一个文档设置数字格式，但如果必须创建大量包含数字的表单，找到最佳方案就很重要。你的选择是：自行操作或联系专业人士。\n\
  \n\n\n"
- "# 19. 数字签名与条形码\n\n**章节目标：** 我尚未深入讨论 JavaScript 中的两种表单字段：数字签名和条形码。因此，本章将重点介绍它们。首先，让我们看看它们以及其他字段与安全性的关系。\n\
  \n**注意：** 如果你想跟着本课程一起操作或查看最终结果，请从引言中的链接下载第 19 章的文件。标有“开始”的是不含代码的文件，标有“结束”的是最终结果。如果你希望将这些文件添加到自己的\
  \ PDF 表单中，你还会找到包含原始文件和脚本的文件夹。\n\n如果你是从原始 PDF 创建表单，请参考第 1 章中的“表单回顾”部分。\n\n请记住，要查看字段的属性，你必须选择“准备表单”工具；只有这样你才能右键单击或双击某个字段来查看其属性。\n\
  \n## 数字签名与安全性\n\n可以对文本字段添加基本的安全性。请参阅文件 `TMC_Password_Access_Example_End.pdf` 中的示例。参考图\
  \ 19-1 和图 19-2。\n\n**图 19-2** — 输入正确的密码即可解锁字段并显示按钮。你也可以将所有字段重置为只读状态。\n\n![](img/449379_2_En_19_Fig2_HTML.jpg)\n\
  \n**图 19-1** — 如果你不知道密码，就无法解锁字段并显示允许你添加文件位置链接的按钮。\n\n![](img/449379_2_En_19_Fig1_HTML.jpg)\n\
  \n在你在 `Text1Password` 字段中输入密码并点击提交按钮之前，除密码字段和复选框之外的所有文本字段，在“常规”选项卡上都设置为只读状态。\n\n\
  `Text1Password` 字段在“选项”选项卡上设置有“密码”属性，如图 19-3 所示。此设置将只显示一系列星号（`***`）；实际文本将保持隐藏状态。没有其他\
  \ JavaScript 代码直接应用于此字段。\n\n**图 19-3** — “选项”选项卡上设置了“密码”属性，以便隐藏实际文本。\n\n![](img/449379_2_En_19_Fig3_HTML.jpg)\n\
  \n以下是“操作”选项卡上提交按钮在选择了“鼠标释放”触发器和“运行 JavaScript”后的 JavaScript 代码：\n\n```javascript\n\
  //提交密码按钮\nvar b=this.getField(\"Text1Password\");\nvar c=this.getField(\"Text2\"\
  );\nvar file1=this.getField(\"SubmitFile\");\nvar btn1=this.getField(\"Submitfilebtn\"\
  );\nvar d=this.getField(\"Reset\");\nif(b.value==\"password\"){\nc.readonly =false;\n\
  file1.readonly=false;\nbtn1.display=display.visible;\nd.display=display.visible;\n\
  app.alert(\"字段已解锁\",3,0);\n}\nelse{\napp.alert(\"密码错误\");\nb.value=\"\";\n}\n```\n\
  \n只有当你输入值为 `password` 时，你才能访问其他字段和按钮。点击提交按钮后，如果值正确，只读字段（`Text2`、`SubmitFile.1`、`SubmitFile.2`、`SubmitFile.3`）将变为可编辑状态，并且隐藏的按钮（`SubmitFilebtn.1`、`SubmitFilebtn.2`、`SubmitFilebtn.3`\
  \ 和 `Reset`）将显示。你还会收到一个提示，表明字段已解锁。请注意，在此示例中，你不需要命名末尾带有句点和数字的所有按钮或字段；只要它们在句点之前具有相同的起始名称，它们就被包含为一种数组对象的一部分。\n\
  \n但是，如果你输入了错误的值并点击提交，你将收到一个密码错误的提示，并且该字段将重置自身，因此你必须重试。参考图 19-4。\n\n**图 19-4** —\
  \ 如果密码不正确，密码字段将恢复为空白。\n\n![](img/449379_2_En_19_Fig4_HTML.jpg)\n\n\n\n## 通过复选框切换密码显示\n\
  \n然而，有些人在输入密码时，当看到密码显示为星号（`***`）会感到困难。为了帮助他们，你可以添加一个复选框，让他们可以开启或关闭密码的显示。这样，他们就能在点击提交按钮之前检查自己输入的密码是否正确。\n\
  \n对于名为`Check Box1`的复选框字段，我在“动作”选项卡中输入了以下代码，并选择了“鼠标松开”触发器：\n\n```javascript\n// Show/Hide\
  \ the password\nif(event.target.value != \"Off\"){\n    this.getField(\"Text1Password\"\
  ).password=false;\n}\nelse{\n    this.getField(\"Text1Password\").password=true;\n\
  }\n```\n\n如同`readonly`属性一样，`password`是另一个可以像布尔值`true`和`false`一样访问的属性。在这个例子中，如果`!=\
  \ \"Off\"`或复选框被勾选（即开启），则将`password`设为`false`以显示实际文本。当复选框未被勾选时，将其设为`true`以显示密码设置。请参考图\
  \ 19-5。\n\n![复选框属性窗口截图。动作选项卡被选中。一个栏中有文本“密码”，且“视图”复选框被勾选。下方的栏中显示星号，且“视图”复选框未被勾选。](img/449379_2_En_19_Fig5_HTML.jpg)\n\
  \n**图 19-5**  \n使用“动作”选项卡上的代码通过复选框动作来隐藏和显示密码\n\n如果密码输入正确，一旦“重置”按钮变为可见，你就可以重置表单、将文本字段设置为只读，并隐藏某些按钮。请参考图\
  \ 19-6。\n\n![按钮属性对话框。动作选项卡被选中。鼠标松开触发器用于执行菜单项动作。密码输入框中显示星号，提交和重置按钮位于对话框顶部。](img/449379_2_En_19_Fig6_HTML.jpg)\n\
  \n**图 19-6**  \n“重置”按钮在“动作”选项卡上有两个动作\n\n对于“鼠标松开”事件上的“重置”按钮，除了使用“重置表单”动作来重置表单的五个文本字段和复选框之外，你还可以在编辑器中为“运行\
  \ JavaScript”动作添加以下代码：\n\n```javascript\n// Reset Password Field with check box\
  \ setting, File Fields and Button\nvar b=this.getField(\"Text1Password\");\nvar\
  \ c=this.getField(\"Text2\");\nvar file1=this.getField(\"SubmitFile\");\nvar btn1=this.getField(\"\
  Submitfilebtn\");\nvar d=this.getField(\"Reset\");\nif(b.value==\"\"){\n    c.readonly\
  \ =true;\n    file1.readonly =true;\n    btn1.display =display.hidden;\n    app.alert(\"\
  Fields are Locked again\",3,0);\n    d.display= display.hidden;\n    b.password\
  \ = true;\n}\n```\n\n这不仅会锁定（设为只读）、隐藏、重置字段和密码属性，你还会收到一个提示消息，说明字段已被再次锁定。请参考图 19-7。\n\
  \n![JavaScript 警告弹窗。信息按钮指示字段已被再次锁定。确定按钮高亮显示在边框处。](img/449379_2_En_19_Fig7_HTML.jpg)\n\
  \n**图 19-7**  \n重置时，字段再次被锁定后出现的提示\n\n> **注意**  \n> 在提示对话框中点击“确定”后，“重置”按钮会隐藏，并且密码会被重置。这些是条件语句中必须满足的最后几项。当你在设置代码顺序时，如果注意到代码没有按预期顺序激活，这一点需要始终牢记。在这种情况下，你可能需要在“动作”选项卡或编辑器中将某行代码或某个动作上移或下移到另一个动作的上方或下方，才能使其按预期运行。\n\
  \n在这些示例中，我们使用了“锁定”一词来指代一个被设为只读的字段。这与我们在对话框中通过勾选“锁定”复选框来锁定字段属性是不同的。请参考图 19-6 的左下角。当此选项被勾选时，你仍然可以在字段中输入文本，但当你查看属性和选项卡时，它们会显示为灰色，你无法更改包括“动作”选项卡在内的任何属性。如果你发现任何字段不再允许你编辑属性，请确保取消勾选“锁定”复选框。\n\
  \n虽然这不属于安全性的一部分，但你可以在“动作”选项卡上为“提交文件”按钮的“鼠标松开”触发器和“运行 JavaScript”设置添加以下代码：\n\n```javascript\n\
  Submitfilebtn.1\n// Additional Script for Submit a File Button\nvar file1 = this.getField(\"\
  SubmitFile.1\");\nfile1.browseForFileToSubmit();\n\nSubmitfilebtn.2\nvar file2 =\
  \ this.getField(\"SubmitFile.2\");\nfile2.browseForFileToSubmit();\n\nSubmitfilebtn.3\n\
  var file3 = this.getField(\"SubmitFile.3\");\nfile3.browseForFileToSubmit();\n```\n\
  \n与这些按钮对应的文本字段在“选项”选项卡中添加了“字段用于文件选择”设置。当点击“提交文件”按钮时，会打开一个对话框，允许你输入计算机硬盘上特定文件位置的文本路径。如果没有为按钮设置这些动作，也没有在“选项”选项卡上为这些特定文本字段进行设置，则“打开”对话框将不会出现。请参考图\
  \ 19-8。\n\n![文本字段属性对话框。选项选项卡已展开，并选择了左对齐。“字段用于文件选择”已勾选。文件位置 1、文件位置 2、文件位置 3 以及提交按钮分别位于用于输入文件位置的每个空间上方。](img/449379_2_En_19_Fig8_HTML.png)\n\
  \n**图 19-8**  \n“选项”选项卡上的属性，这些属性使得该字段能够与“提交文件”按钮配合使用\n\n请注意，此示例中的“重置文件字段”按钮可以在你工作时重置三个文件字段中的文本，但这不具备安全性。请参考图\
  \ 19-2。\n\nJavaScript 虽然可以用于一些基本的安全操作，但在加密方面并不总是最安全或最可靠的解决方案，因为如果你拥有 Acrobat Pro\
  \ 并且没有设置额外的密码安全措施，这些区域很容易被访问。\n\n\n\n### 使用数字签名与其他 Adobe 安全工具\n\n关于签名与安全，我推荐阅读丽莎·弗里德玛（Lisa\
  \ Fridsma）和布丽·金西尔德（Brie Gyncild）所著的 *Adobe Acrobat DC Classroom in a Book*，尤其是其中关于签名与安全的章节。我认为该书提供了关于安全加密签名的最新\
  \ PDF 信息，这些签名适用于需要专业认证和身份识别的公司。同样，如果你需要证书或任何类似的安全服务，也可以联系 Adobe。\n\n虽然与本主题无关，但如果你在工作流程中涉及安全，建议进一步了解\
  \ Adobe 中位于`表单与签名`和`保护与标准化`下的某些工具。这些工具包括`证书`、`填写与签名`、`保护`和`编辑`。还有其他电子签名表单选项，我们将在第\
  \ 20 章中进一步讨论。请参考图 19-9。\n\n![](img/449379_2_En_19_Fig9_HTML.jpg)\n\n所示的 14 个工具属于表单与签名、保护与标准化选项。包括：请求电子签名、填写与签名、准备表单、证书、批量发送、添加电子签名品牌、收款、保护、编辑、PDF\
  \ 标准、优化 PDF、打印制作和无障碍。\n\n**图 19-9** 其他 Adobe 安全工具\n\n请注意，虽然这些工具不直接与 JavaScript 配合使用，但如果你的表单是为视障人士准备的，你可能需要使用`无障碍`工具来准备表单字段以及其他阅读选项。这是一个更高级的话题，并非本书必备。你可以访问\
  \ [`helpx.adobe.com/cn/acrobat/using/create-verify-pdf-accessibility.html`](https://helpx.adobe.com/cn/acrobat/using/create-verify-pdf-accessibility.html)\
  \ 了解有关无障碍、标签和阅读顺序的更多信息。请参考图 19-10。\n\n![](img/449379_2_En_19_Fig10_HTML.png)\n\n\
  一个用于从无障碍菜单设置阅读顺序的对话框。各种格式选项采用拖放格式。选项包括：文本、图形、表单字段、图形、标题、公式、单元格、注释和伪像。\n\n**图 19-10**\
  \ 显示与表单字段相关部分选项的无障碍工具\n\n然而，在本章中，由于表单不需要高级别的安全，我在本章文件夹中包含了一个文件（`TMC_Signature_Agreement_End.pdf`），该文件对数字签名启用了\
  \ JavaScript，你可以自行探索。此文件结合使用了签名字段和按钮，以实现以下功能：\n\n-   当你在字段中输入签名时，使与签名相关的文本字段变为只读，然后你可以点击`提交给主管`按钮。\n\
  -   点击按钮时显示或隐藏字段。\n-   通过点击特定按钮重置部分或整个表单。\n\n在`数字签名属性`字段的`employee.signature`中，请花一点时间查看该字段的`签名后`选项卡。该选项卡仅在配置了数字\
  \ ID 后才对数字签名可用。与其他文本字段不同，数字签名没有`格式`、`验证`和`计算`选项卡，因此你可以添加操作的唯一位置是`操作`和`签名后`选项卡。你也可以使用全局文档\
  \ JavaScript 区域进行格式化。请参考图 19-11、19-12 和 19-13。\n\n![](img/449379_2_En_19_Fig13_HTML.jpg)\n\
  \n一个用于插入员工签名的空白字段截图。在下面的数字签名属性对话框中，“签名后”选项卡已被选中。此处选择了“对字段签名时执行此脚本”选项。其他选项处于禁用状态。“关闭”按钮已高亮显示。\n\
  \n**图 19-13** 当选中“对字段签名时执行此脚本”时，数字签名属性显示在“签名后”选项卡上的情况\n\n\n\n## 数字签名属性与示例\n\n数字签名属性窗口截图。已选中“已签名”选项卡，并勾选了“标记为只读”选项。从下拉列表中选择了“仅这些字段”选项。\n\
  \n**图 19-12**  \n数字签名示例，在“已签名”选项卡上设置为“标记为只读”，并从列表中选择“仅这些字段”。\n\n插入员工和主管详细信息的表格格式截图。收集的详细信息包括姓名、信息、签名和日期。“提交给主管”按钮位于表格下方。表格下方显示了一个带有“添加”选项的“准备表单”图标。\n\
  \n**图 19-11**  \n在“准备表单”工具中找到的数字签名示例\n\n基本上，当员工填写一个签名并点击“提交给主管”按钮时，下一个签名就会对下一级主管可用。该示例与使用字段和按钮组合进行显示和隐藏的方法相同。虽然这是一种低级安全性，但它提供了一种确保文件按正确顺序签署的方法。它还对谁可以重置哪些字段进行了限制。这种方法比简单地选择“标记为只读”更精确。\n\
  \n以下是一些用于签名和按钮的代码示例。\n\n以下内容可以应用于“已签名”选项卡上的数字签名字段`employee.signature`：\n\n```javascript\n\
