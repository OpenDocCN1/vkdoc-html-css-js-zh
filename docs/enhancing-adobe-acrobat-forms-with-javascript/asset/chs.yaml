  \ `setFocus();` 的示例，届时文本框内容过满时，您需要使用另一个字段来继续输入文本。\n\n## 本章小结\n\n在本章中，您了解了使用“计算”选项卡向表单字段添加计算的三种方法。\n\
  \n*   值\n*   简化域表示法 (SFN)\n*   自定义计算脚本 (JavaScript)\n\n虽然每个示例都逐渐变得更加复杂，但随着您向 JavaScript\
  \ 迈进，更广泛的可能性也随之打开。\n\n您还了解了将 JavaScript 添加到“验证”选项卡如何使我们能够查看“总计”字段何时被使用以及何时未被使用。为客户提供准确的表单信息更新非常重要。\n\
