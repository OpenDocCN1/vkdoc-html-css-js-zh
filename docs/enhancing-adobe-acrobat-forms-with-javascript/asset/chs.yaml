  \n**注意：** 如果您希望在水印末尾保留 `.pdf`，请移除命令 `.replace(/\\.pdf$/i, \"\")`，仅保留 `cText: this.documentFileName`。\n\
  \n正则表达式的另一种写法是 `this.documentFileName.replace(/\\.[^/.]+$/, \"\"),`。\n\n这使用了元字符和量词，用于搜索字符串的开头并匹配结尾。这将匹配不以\
