  \n图 11-25：复选框属性对话框的“选项”选项卡\n\n以下是针对勾选、圆形、交叉、菱形、方形和星形样式的样式格式代码示例：\n\n```\n//勾选\n\
  f.style = style.ch;\n//交叉\nf.style = style.cr;\n//菱形\nf.style = style.di;\n//圆形\n\
