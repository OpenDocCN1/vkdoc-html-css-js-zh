  \ 5 个选项卡，其中“外观”选项卡已被选中。该页面提供了边框和颜色的详细设置，包括边框颜色、线条粗细、填充颜色和线条样式，以及文本的详细设置，包括字体大小、文本颜色和字体。\n\
  \n图 11-24：单选按钮属性对话框的“外观”选项卡\n\n### 按钮的格式设置及以下属性如何受影响\n\n有关确切的编码说明，请参阅第 10 章。与文本框一样，你可以设置\
