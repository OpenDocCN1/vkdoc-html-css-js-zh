  **图 3-13** 带有 `Add Stamp`（添加图章）子工具的 `Comment`（评论）工具


  现在您的评论列表中有一个图章评论。您可以在此处通过双击评论，为评论添加更多关于图章的信息，然后点击 `Post`（发布）。如果需要删除页面上的二维码图章，只需选中它，然后按键盘上的
  `Delete` 按钮，或者右键单击并从弹出列表中选择 `Delete`。如果需要撤销删除，也可以使用 `Ctrl/Cmd+Z`。


  您可以按需要将此二维码图章添加到文档中的多个位置。完成后，点击 `Close`（关闭）按钮退出 `Stamp`（图章）或 `Comment`（评论）工具。请参考图
