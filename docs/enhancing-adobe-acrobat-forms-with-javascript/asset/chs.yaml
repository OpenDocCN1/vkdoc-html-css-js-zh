  \ 20-12。\n\n![](img/449379_2_En_20_Fig12_HTML.jpg)\n\n屏幕截图显示了**字段类型**下的下拉列表，其中**文本**选项已被选中。其他选项包括：**签名**、**签名块**、**姓名缩写**、**职务**、**公司**、**姓名**、**电子邮件**和**日期**。\n\
  \n**图 20-12** — 下拉列表中常规选项卡的字段类型选项\n\n\n\n与其从列表中选择，不如直接在“`准备表单`”子工具区域中找到这些相同的域选项图标，同时还有用于下拉列表、复选框和单选按钮的附加图标，我们稍后将对此进行进一步讨论。请参阅图\
