  \ 7 行。*\n\n**图 6-14** 在表单中重置焦点字段\n\n在这个例子中，我本可以使用 JavaScript 进行计算；但在这个案例中，我只是使用值。这与创建焦点字段无关；相反，请参考“操作”选项卡上的重置按钮属性。请参考图\
