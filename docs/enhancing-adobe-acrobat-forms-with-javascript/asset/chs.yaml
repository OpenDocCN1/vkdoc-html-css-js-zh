  \n**图 4-23**  \n在平面图示例中，当你选择一个图层并从 `Options` 菜单中选择，或在导航面板中右键点击该图层时，所看到的图层属性\n\n\
  与某些按钮导航设置相比，图层操作的构建可能稍微复杂一些。我建议使用像 InDesign 这样的程序来创建你的初始图层布局，并将其导出为交互式 PDF，正如你在\
