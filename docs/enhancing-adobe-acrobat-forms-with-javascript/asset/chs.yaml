  Button5\");\nif(event.value==\"password\"){\n//其余代码\n```\n\n你可以看到 `if/else` 语句的重复出现，这同样可以应用于触发警告的单选按钮。然而，处理起来会变得越来越复杂。花些时间查看\
  \ `PDF_Puzzles` 文件中的这部分内容，观察代码是如何重复自身，但对于每个单选按钮又略有不同，以便满足条件且互不冲突。\n\n以下是一个单选按钮操作的示例：\n\
  \n```\nvar g = this.getField(\"Group4\");\ng.readonly= true;\n//冲突修正\nvar one= this.getField(\"\
  Group5\");\nvar one1= this.getField(\"Group6\");\nvar sec = event.target;\nvar msg=\"\
  已选择第一种颜色\";\nif (one.value==\"Yellow1\"){\napp.alert(msg);\none.value=\"Yellow1\"\
  ;\none.readonly = true;\nsec.value=\"\";\nsec.readonly = false;\n}\n//冲突修正 2\nelse\
  \ if (one1.value==\"Blue1\"){\napp.alert(msg);\none1.value=\"Blue1\";\none1.readonly\
  \ = true;\nsec.value=\"\";\nsec.readonly = false;\n}\n```\n\n你可以查看其他八个单选按钮，了解每个“操作”选项卡上的代码如何变化。最后，在简短的游戏结束后，你应该默认重置单选按钮，并且还需要使用“操作”选项卡上的以下代码来设置“重置单选按钮\
  \ 2”：\n\n```\nvar a = this.getField(\"Group4\");\nvar b = this.getField(\"Group5\"\
  );\nvar c = this.getField(\"Group6\");\na.readonly=false;\nb.readonly=false;\nc.readonly=false;\n\
  ```\n\n我希望这能激发你创建自己的 PDF 安全游戏。\n\n### 条形码\n\n最后，关于条形码，当它引用表单中的各个字段时，此自定义 JavaScript\
  \ 会影响条形码的视觉显示方式。扫描条形码时，此信息会被软件程序收集并输入到数据库中以供日后查看。如果你计划购买条形码读取器/扫描仪或传真机以配合 Acrobat\
  \ PDF 文件使用，请先联系公司，询问其读取器能解读哪些类型的与 PDF 条形码相关的 JavaScript 代码。该公司或许能提供文档，或允许你在购买前测试扫描仪。此外，要参考\
  \ Adobe 的条形码纸质表单解决方案，你可能需要直接联系 Adobe。请参考图 19-18。\n\n![](img/449379_2_En_19_Fig18_HTML.png)\n\
