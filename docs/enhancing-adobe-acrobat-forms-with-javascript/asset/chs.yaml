  \ this.pageNum = 7;\n        break;\n    case \"M 公司\":\n        this.pageNum =\
  \ 8;\n        break;\n    case \"S 公司\":\n        this.pageNum = 9;\n        break;\n\
  \    case \"测验\":\n        this.pageNum = 10;\n        break;\n    case \"关闭文档\"\
  :\n        CloseWarning();\n        break;\n    //可选\n    default:\n        app.alert(\"\
  此处未找到。\");\n        break;\n}\n```\n\n该脚本帮助你导航 `app.popUpMenu`。关联语法帮助你导航到所需的页面。请记住，`5`\
