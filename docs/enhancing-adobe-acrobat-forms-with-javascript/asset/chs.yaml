  \ | 无图标 | 4 | 恢复默认 ![](img/449379_2_En_8_Figi_HTML.jpg) 确定按钮边框高亮显示。 |\n\n要实现这个警报示例，你需要将其*全局*添加，这意味着它将成为整个文档的一部分。当文档打开时，你希望看到这个警报。\n\
  \n为此，你需要转到“工具”菜单中的“JavaScript 工具”。请参考图 8-2 和图 8-3。\n\n![](img/449379_2_En_8_Fig2_HTML.jpg)\n\
  \n一个带有两个花括号的图标。底部写着文字“Javascript”。文字下方是一个带有下拉菜单的“添加”按钮。\n\n**图 8-2** JavaScript\
  \ 工具\n\n## 创建文档级 JavaScript\n\n现在，你需要从 JavaScript 菜单（图 8-3）中选择“文档级 JavaScripts”。如需查看，请参考本章文件夹中的\
  \ `Newsletter_2_End.pdf` 文件。如果你想练习，可以使用 `Newsletter_2_Start.pdf` 文件。\n\n![](img/449379_2_En_8_Fig3_HTML.jpg)\n\
  \n菜单栏的截图，包含以下选项：debug、debugger、document JavaScripts、all JavaScripts 和 document actions。\n\
  \n**图 8-3** JavaScript 菜单\n\n当你首次开始为文档创建 JavaScript 时，“文档级 JavaScripts”对话框将显示为空白。尚未创建任何\
  \ JavaScript，因此你需要遵循以下步骤：\n\n1. 输入脚本名称。请参考图 8-4。在本示例中，我输入了 `welcome`。\n\n   ![](img/449379_2_En_8_Fig4_HTML.jpg)\n\
  \n   文档级 JavaScripts 的对话框。有一个空白区域用于输入脚本名称。对话框下方的提示显示脚本名称为 `welcome`。\n\n   **图 8-4**\
  \ “文档级 JavaScripts”对话框\n\n2. 点击右侧的“添加”按钮。请参考图 8-5。\n\n   ![](img/449379_2_En_8_Fig5_HTML.jpg)\n\
  \n   一个标记为“添加”的矩形按钮图标。\n\n   **图 8-5** “添加”按钮\n\n3. 在本示例中，进入“JavaScript 编辑器”对话框后，你可以高亮显示并删除默认文本，然后输入以下脚本：\n\
  \n   ```\n   //Welcome Message on start\n   app.alert(\"Welcome to our Newsletter!\"\
  ,3,0);\n   ```\n\n   如前所述，带有 `//` 的第一行是注释。它与代码的功能无关，只是提醒代码的用途。\n\n   实际代码如下所示：\n\
  \n   ```\n   app.alert(\"Welcome to our Newsletter!\",3,0);\n   ```\n\n   这段代码调用了一个警报消息。在\
  \ `app.alert()` 中，你可以输入自定义文本（本例中为 `\"Welcome to our Newsletter!\"`）。然后，你可以选择希望显示的图标和按钮类型，它们之间用逗号分隔。请参考图\
  \ 8-6。\n   - `3` 表示警报图标类型（本例中为状态/信息）。请参考表 8-1。\n   - `0` 表示按钮类型（本例中为确定按钮）。\n\n \
  \  ![](img/449379_2_En_8_Fig6_HTML.jpg)\n\n   创建和编辑 JavaScript 函数的对话框截图，函数名为 `welcome`。它包含一个\
  \ JavaScript 编辑器，其中包含一组用于启动时欢迎消息的代码。底部有确定、取消和转到按钮。\n\n   **图 8-6** 已移除的代码以及输入到 JavaScript\
  \ 编辑器中的新代码和消息\n\n   根据警报类型的不同，你可能选择其他选项。\n\n4. 输入完成后，点击编辑器中的“确定”按钮，然后点击“关闭”退出“文档级\
  \ JavaScripts”对话框。点击“关闭”按钮退出 JavaScript 工具。然后保存你的工作。\n\n5. 关闭 PDF 并再次打开后，警报应会弹出。点击消息上的“确定”按钮，文档即可打开。\n\
  \n\n\n## 查看器版本与验证警报\n\n假设您希望确保客户的 Reader 版本足够新，能够完成某些特定任务。\n\n您可以创建并添加自己的查看器验证脚本，例如\
  \ `viewerVersion`。请参考图 8-7。此示例也见于文件 `Newsletter_2_End.pdf` 中的 `JavaScript 工具` >\
  \ `文档 JavaScript`。\n\n![](img/449379_2_En_8_Fig7_HTML.jpg)\n\n*一个标题为“文档 JavaScript”的对话框。脚本名称高亮显示为查看器版本。底部的一个矩形框内显示了一组针对\
  \ Acrobat 版本的代码。有四个按钮：关闭、添加、编辑和删除。*\n\n**图 8-7** — 显示新闻稿 PDF 中使用的三个脚本的“文档 JavaScript”对话框\n\
  \n```\n// 检查 Acrobat 版本\nif (typeof(app.viewerVersion)!=\"undefined\")\nif (app.viewerVersion\
  \ <7.5){\nvar msg = \"您必须使用 Adobe Acrobat 或 Adobe Reader 7.5 或更高版本来填写此表单。\";\napp.alert(msg,1,0);\n\
  }\n```\n\n这段代码确保当文档在 Reader 中打开时，代码会与客户的软件交互，根据条件语句进行自我检查，如果版本低于 7.5，则使用 `1`（警告）来提醒客户，表明他们将难以完成此表单（见表\
  \ 8-1）。客户随后会知道他们需要升级。然后点击`确定`，即 `(0)`。见图 8-8。\n\n![](img/449379_2_En_8_Fig8_HTML.jpg)\n\
  \n*JavaScript 窗口对话框的截图。其中说明应使用 Adobe Reader 7.5 或更高版本来填写表单。*\n\n**图 8-8** — 显示的警告，让查看者知道他们需要升级软件才能完成表单\n\
  \n您也可以创建并添加一个 `viewerType` 验证。\n\n```\nif (typeof(app.viewerType)!=\"undefined\"\
  )\nif (app.viewerType == \"Reader\")\n{\nvar msg = \"您必须使用 Acrobat Standard、Acrobat\
  \ Pro 或 Acrobat Pro Extended 版本来完成此表单。\";\napp.alert(msg,1,0);\n}\n```\n\n如果客户使用的是\
  \ Reader 而非 Acrobat Pro，由于程序员已知的某些设置问题，他们可能无法完成此表单。如果您使用的是 Acrobat Pro，此警告将被忽略。\n\
  \n完成后，点击`确定`并保存您的工作。点击`编辑`按钮检查代码，如果不想进行更改，则点击`取消`。然后点击`关闭`退出对话框。就您自己的操作而言，在使用“文档\
  \ JavaScript”对话框时，如果出现错误，您可以点击`删除`按钮并重新创建该操作。请参考图 8-7。\n\n> **注意：** 如果您认为客户可能会使用其他\
  \ Reader 或 PDF 程序打开他们的文件，您可能需要修改代码以反映这一点。请记住，浏览器之类的程序可能会破坏表单中的 JavaScript，因此请先与客户或同事一起测试警报。同时请记住，不要将版本设置得太高，因为大多数客户使用较旧版本的\
  \ Acrobat Pro 或 Reader 就能完成表单。目前，我使用的是 23.0 版本。然而，您的客户可能使用的是 18.0 版本，并且可以毫无问题地完成表单或查看文档，因此请相应地调整此警告，不要故意设置过高以引起困扰。\n\
  \n### 文档动作\n\n其他类型的全局警报可能需要在另一个区域进行设置。从 JavaScript 工具中，选择`文档动作`。请参考图 8-9。\n\n![](img/449379_2_En_8_Fig9_HTML.jpg)\n\
  \n*菜单栏的截图，包含以下选项：调试、调试器、文档 JavaScript、所有 JavaScript 和文档动作。*\n\n**图 8-9** — JavaScript\
  \ 工具菜单\n\n在这个 `Newsletter_2_End.pdf` 文件中，您可以看到两个文档动作。您之所以知道这一点，是因为每个已创建的动作旁边都有一个圆点。您可以通过点击`编辑`按钮来编辑选定的动作。`编辑全部`按钮会显示文档中当前所有的动作，而不仅仅是文档动作。如果您需要退出该对话框并返回到“文档动作”对话框，请点击`取消`。请参考图\
  \ 8-10。\n\n![](img/449379_2_En_8_Fig10_HTML.jpg)\n\n*一个标题为“文档动作”的对话框截图，其中包含关闭、保存和打印文档的选项列表。JavaScript\
  \ 的执行代表了一种用于应用警报的代码。*\n\n**图 8-10** — 文档动作对话框\n\n#### 文档关闭时\n\n当文档关闭时，您可能想添加一句友好的告别语，以感谢客户花时间阅读新闻稿。点击`编辑`按钮查看或输入以下代码：\n\
  \n```\napp.alert(\"感谢您查看我们的新闻稿！\",3,0);\n```\n\n完成后点击`确定`按钮退出 JavaScript 编辑器。如果您想提交所做的任何更改，请点击`确定`退出“文档动作”对话框。\n\
  \n此脚本类似于欢迎问候语；但是，您需要将其输入到此部分中，以便在文档关闭时生效。\n\n#### 文档打印时\n\n您可以输入类似这样的消息，在客户端点击`文件`\
  \ → `打印`对话框中的`打印`后，文档打印前显示：\n\n```\nvar msg = \"希望您找到了需要的内容。\"\napp.alert(msg,3,1);\n\
  ```\n\n> **注意：** 在这种情况下，消息被写成一个单独的变量 `var msg`。\n\n我本可以将其写成一行：\n\n`app.alert(\"\
  希望您找到了需要的内容。\",3,1);`\n\n结果是一样的。\n\n然而，如果您认为消息较长或可能多次使用该消息，了解另一种写法是件好事。这样更容易访问。\n\
  \n以下是此区域可用的其他文档选项：\n\n*   **保存前**: 消息在保存前出现。\n*   **保存后**: 消息在保存后出现。\n*   **打印后**:\
  \ 消息在文档打印后出现。\n\n完成后，点击`确定`按钮退出对话框，关闭 JavaScript 工具，并保存您的工作。\n\n在接下来的章节中，您将进一步深入研究全局文档\
  \ JavaScript，因为您可以访问此区域来处理各种表单字段，以避免代码重复。\n\n\n\n## 带按钮的警报\n\n并非所有警报都需要全局触发。有时你希望警报仅在按下按钮或文本框输入错误时出现。要查看此按钮，请参考图\
  \ 8-11 和 `Newsletter_2_End.pdf` 的第 4 页。\n\n![](img/449379_2_En_8_Fig11_HTML.jpg)\n\
  \n一张显示“警报信息”标签的矩形按钮截图。\n\n**图 8-11**  Newsletter PDF 中的警报信息按钮\n\n你可以在“准备表单”区域或“富媒体”区域创建按钮。请参考图\
  \ 8-12。\n\n![](img/449379_2_En_8_Fig12_HTML.jpg)\n\n一张截图展示了两个图标，分别标注为“准备表单”和“富媒体”。每个图标都包含一个“添加”下拉菜单。\n\
  \n**图 8-12**  在“准备表单”或“富媒体”工具中均可找到按钮\n\n接着，你可以在“按钮属性”对话框的“动作”选项卡中，使用“运行 JavaScript”操作为按钮添加一个警报动作。在本例中，我使用了\
  \ `Mouse Up`（鼠标释放）作为触发设置。请参考图 8-13。\n\n![](img/449379_2_En_8_Fig13_HTML.jpg)\n\n\
  一张“按钮属性”对话框的截图。它有 5 个选项卡，其中“动作”选项卡被选中。它表明已选择“鼠标释放”作为触发动作来运行 JavaScript。底部的 JavaScript\
  \ 编辑器包含一组用于“消息警报”按钮的代码。\n\n**图 8-13**  在“按钮属性”对话框的“动作”选项卡中运行 JavaScript 动作。文本已输入到\
  \ JavaScript 编辑器中\n\n与之前一样，你设置 `Mouse Up` 作为触发器，并选择 `Run a JavaScript` 动作。然后点击“添加”按钮并输入以下文本：\n\
  \n```\n//消息警报按钮\nvar msg = \"这是我的第一个 JavaScript 警报消息\";\napp.alert(msg,3,0);\n```\n\
  \n点击 `OK` 退出编辑器，点击 `Close` 退出按钮属性界面，再次点击 `Close` 退出工具，然后保存你的工作。\n\n图 8-14 展示了点击按钮时产生的警报。稍后你将了解这类警报。\n\
  \n![](img/449379_2_En_8_Fig14_HTML.jpg)\n\n一张 JavaScript 窗口的对话框截图。文本显示：“这是我的第一个\
  \ JavaScript 警报消息”。\n\n**图 8-14**  点击时产生的警报消息\n\n在第 10 章中，我们将学习如何创建一个使用 JavaScript\
  \ 打印特定页面的按钮。如果你在寻找有关警报播放不同声音或 `app.beep();` 的信息：共有四种类型；但你应该知道，这些选项在 macOS 和 UNIX\
  \ 系统上会被忽略。由于它们是可选的，因此我不会将它们添加到代码中，而是让默认声音播放。\n\n## 添加评论备注、签名和时间戳\n\n如你所见，按钮非常适合警报，但你也可以使用它们向页面添加非表单和表单项目。\n\
  \n例如，你可能希望鼓励客户在审校完成后对特定页面添加评论。你可以添加一个按钮。请参见 `Project_Comment` PDF 文件中“开始”和“结束”页面上的按钮。请参考图\
  \ 8-15 和图 8-16。\n\n![](img/449379_2_En_8_Fig16_HTML.jpg)\n\n一张“按钮属性”对话框的截图。它有 4\
  \ 个选项卡，其中“动作”选项卡被选中。它表明已选择“鼠标释放”作为运行 JavaScript 动作的触发器。\n\n**图 8-16**  “按钮属性”对话框“动作”选项卡上的\
  \ `运行 JavaScript` 动作\n\n![](img/449379_2_En_8_Fig15_HTML.jpg)\n\n一张显示“添加评论”标签的矩形按钮截图。\n\
  \n**图 8-15**  一个用于向页面添加评论或便签的按钮\n\n与之前一样，要实现此功能，你需要在“动作”选项卡上为按钮选择 `Mouse Up` 触发器，然后选择\
  \ `Run a JavaScript`。点击“添加”按钮。请参考图 8-16 和图 8-17。\n\n![](img/449379_2_En_8_Fig17_HTML.jpg)\n\
  \n一张用于创建和编辑 JavaScript 的 JavaScript 编辑器截图。其中包含一段用于添加评论的代码片段。\n\n**图 8-17**  输入到\
  \ JavaScript 编辑器中的文本\n\n这次你需要输入以下代码：\n\n```\n//添加评论/便签\nvar annot = this.addAnnot({\n\
  page: this.pageNum,\ntype: \"Text\",\nrect: [187, 168, 487, 243],\nstrokeColor:\
  \ color.yellow\n});\n```\n\n这里的代码写法略有不同。评论或有时被称为注释的对象，其属性中不具备直接添加 JavaScript 的能力，因此如果你想要包含颜色或位置等特定自定义设置，就必须间接添加动作——本例中通过按钮点击来实现。以下是其含义：当按钮被点击时，它会调用\
  \ `addAnnot` 或注释/评论。一个评论便签将被添加到按钮所在的页面 `this.pageNum` 上。\n\n这将允许你添加文本。评论的类型将被设置为页面上特定的坐标位置。这个评论的图标颜色为黄色，但评论本身的填充颜色可能不同。然后用户可以在评论区域输入一些文本并发布，当你打开页面时，它就会显示出来。请参考图\
  \ 8-18。\n\n![](img/449379_2_En_8_Fig18_HTML.jpg)\n\n一张截图显示了一条来自“未定义用户”的评论，内容为“这看起来很棒”。对话框底部有一个“发布”按钮。另一张截图展示了底部的评论。\n\
  \n**图 8-18**  客户点击按钮并输入文字后产生的评论\n\n在本例中，客户显示为 `Undefined`（未定义）。不过，他们稍后可以通过右键点击评论并在“常规属性”中设置新的作者名称来更改此项。请参考图\
  \ 8-19。\n\n![](img/449379_2_En_8_Fig19_HTML.jpg)\n\n一组两个对话框。上方的对话框显示评论下的上下文菜单并高亮显示了“属性”选项。下方的对话框显示“便签属性”，包含用于输入作者名称、主题以及修改日期的文本框。\n\
  \n**图 8-19**  使用“属性”对话框后更改便签的作者名称\n\n同样，你可以添加一行代码来预先设置作者名称。请参考以下代码清单中的粗体部分。评论区域的结果请参考图\
  \ 8-20。\n\n![](img/449379_2_En_8_Fig20_HTML.jpg)\n\n\n\n### 排版后的内容\n\n截图显示了作者姓名\
  \ John Smith，以及时间指示：2:43 PM，还有评论图标。\n\n图 8-20\n\n使用 JavaScript 修改便签的作者名称\n\n```\n\
  //添加评论/便签\nvar annot = this.addAnnot({\npage: this.pageNum,\ntype: \"Text\",\nauthor:\
  \ \"John Smith\",\nrect: [187, 168, 487, 243],\nstrokeColor: color.yellow\n});\n\
  ```\n\n`Rect`属性（在此例中也被称为*数组*）指的是定义注释在页面上位置的矩形坐标。\n\n颜色可以为`strokeColor`设置格式，从`color.yellow`到`color.red`或其他已知颜色。你将在第\
  \ 10 章中了解其他类型的颜色格式。不过，我在此只想指出，你并不局限于便签类型的注释或`Text`类型。\n\n例如，你可以将`Type`更改为其他选项，包括`Circle`、`Stamp`和`PolyLine`。\n\
  \n你可以在此在线资源代码参考指南中查阅其他注释选项，并了解注释类型和属性，以获取更多详情和适用于你的项目的编码示例：\n\n[`https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html#annotation`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html#annotation)\n\
  \n[`https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsdevguide/JS_Dev_RMA.html?highlight=annotation`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsdevguide/JS_Dev_RMA.html?highlight=annotation)\n\
  \n**提示**\n\n如果你不确定使用哪种`Type`设置，请确保将注释名称与“注释”工具中的实际注释进行比较。例如，在代码中，`Type`设置为`StrikeOut`将与注释“删除线”相同。`Caret`与“在光标处插入文本”相同，而`Ink`与使用绘图工具相同。请注意，像`Squiggly`这样的类型与注释云没有直接对应关系，可能表现为带下划线的文本。对于`Cloud`类型，你可以改用`Polygon`；不过，你可能需要修改代码中的额外属性，才能使其在页面上正确显示。\n\
  \n## 签名域与时间戳\n\n使用按钮还可以做的一件事是添加表单域和时间戳。请参考“项目注释”PDF“结束”文件的第 2 页以及图 8-21。\n\n![](img/449379_2_En_8_Fig21_HTML.jpg)\n\
  \n截图显示了一个矩形按钮，上面标注着“签名域和时间戳”。\n\n图 8-21\n\n签名域与时间戳按钮\n\n有时，你希望一个按钮同时做两件事，这是一种加快处理速度的方法。同样，在`Trigger`设置为`Mouse\
  \ Up`的情况下，你可以在“动作”选项卡中选择“运行 JavaScript”。请参考图 8-22。\n\n![](img/449379_2_En_8_Fig22_HTML.jpg)\n\
  \n两个不同对话框的截图。上方截图显示了按钮属性，指示“动作”选项卡下的设置。触发器已选择“鼠标松开”来运行 JavaScript。下方截图显示了在 JavaScript\
  \ 编辑器下用于添加签名域的一段代码片段。\n\n图 8-22\n\n使用“动作”选项卡为时间戳按钮添加的 JavaScript\n\n两个脚本都位于同一个“JavaScript\
  \ 编辑器”对话框中。请参考图 8-22 和图 8-23 查看点击按钮后的结果。\n\n![](img/449379_2_En_8_Fig23_HTML.jpg)\n\
  \n截图显示了签名域。它表示一个矩形空白区域，上方有一段文字，写着“此页面已于 2023 年 1 月 26 日查看”。\n\n图 8-23\n\n生成的签名域\n\
  \n本节中的签名代码如下所示：\n\n```\n//自动添加签名域\nvar c = this.addField({\ncName: \"clientSignature\"\
  ,\ncFieldType: \"signature\",\nnPageNum: this.pageNum,\noCoords: [35,74,176,112]\n\
  })\n```\n\n第一部分使用`var c`添加字段来控制签名放置的位置。该字段被命名为`clientSignature`以便于识别，因为所有字段都需要一个唯一的名称。字段类型为`signature`，仅用于签名，不适用于以下类型：\n\
  \n*   **文本**：`cFieldType`：\"`text`\"\n*   **按钮**：`cFieldType`：\"`button`\"\n*  \
  \ **下拉列表**：`cFieldType`：\"`combobox`\"\n*   **列表框**：`cFieldType`：\"`listbox`\"\n\
  *   **复选框**：`cFieldType`：\"`checkbox`\"\n*   **单选按钮**：`cFieldType`：\"`radiobutton`\"\
  \n\n同样，我还为此页面设置了属性来放置该字段及其坐标。这些坐标可能与“位置”选项卡中的设置有关，默认情况下单位为“点”（大约），可能需要根据`cFieldType`以及你希望字段放置的位置进行调整。根据`cFieldType`的类型，如果你计划添加多个不同类型的字段，需要确保每个字段都有唯一的`cName`，并相应地调整`oCoords:\
  \ [left, bottom, right, top]`。\n\n*   你可以参考此链接：\n*   [`https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsdevguide/JS_Dev_AcrobatForms.html`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsdevguide/JS_Dev_AcrobatForms.html)\n\
  \n在`this.addField()`之后，为了进一步设置新字段的颜色格式（我们将在第 10 章中更详细地探讨），我们需要执行另一步骤，使默认颜色不再是透明。在本例中，你接下来需要将刚创建的字段作为新变量获取，然后在这种情况下将颜色格式应用于边框。所有这些都可以在同一个\
  \ JavaScript 动作中完成。要查看此示例，请参考文件`Project_Comment_End_2.pdf`。\n\n```\nvar b = this.getField(\"\
  clientSignature\");\nb.strokeColor = color.red;\n```\n\n以下是“此页面已于 2023 年 1 月 26\
  \ 日查看”的时间戳代码：\n\n\n\n```javascript\n//script that creates the text field\n{\nvar\
  \ r = [200, 200, 400, 300];\nvar i = this.pageNum;\nvar f = this.addField(String(\"\
  completeDate.\"+i),\"text\",i,r);\nf.textSize = 10;\nf.alignment = \"right\";\n\
  f.textColor = color.blue;\nf.fillColor = color.transparent;\nf.textfont = font.HelvB;\n\
  f.strokeColor = color.transparent;\nf.value = String(\"This page was reviewed on:\
  \ \" + util.printd(\"mmm dd, yyyy\", new Date()));\nf.readonly = true;\n}\n```\n\
  \n接下来，时间戳实际上是一个名为 `completeDate.1` 的文本字段，当用户单击按钮时，它会被添加到页面中，并显示今天的日期。文本框中绑定了多种属性，这些属性也会出现在签名域所在的同一页面上。这些属性包括：文本大小、对齐方式、文本颜色、背景填充颜色、字体类型以及描边或边框颜色等。然后，使用\
  \ `“mmm dd, yyyy”` 的日期格式将新日期戳印在页面上。并且，通过代码在“常规”选项卡中将此文本字段设置为只读。如果与实际选项卡相比，此处的定位或\
  \ `var r` 是一个以点为单位的近似位置。\n\n> **注意：** 你可以将其颜色设置为蓝色或红色，也可以选择不同的字体。现在，这段文本（“此页面审核日期：日期”）已被锁定，因为\
  \ `readonly` 被设置为了 `true`。如果你希望将来能以某种方式编辑此文本，可以将其设置为 `false`。这就是所谓的*布尔表达式*；它只能为\
  \ `true` 或 `false`。你将在第 9 章中看到一种通过复选框为文本字段设置 `readonly` 的方法。\n\n你将在第 10 章中了解使用 JavaScript\
  \ 格式化文本和字段的其他原因。\n\n虽然这是一个更高级的话题，但作为最后的说明，我将提及你还可以使用按钮来添加其他非表单项目，包括水印、书签和超链接。你可以在以下页面找到关于水印话题的更多信息：\n\
  \n[`https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsdevguide/JS_Dev_PDFCreation.html?highlight=watermark#adding-watermarks-and-backgrounds`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsdevguide/JS_Dev_PDFCreation.html?highlight=watermark#adding-watermarks-and-backgrounds)\n\
  \n## 总结\n\n在本章中，你为文档添加了一些全局警报，也为按钮添加了一些警报。你还发现，可以使用按钮来创建评论/便签、签名域和时间戳。正如你所看到的，警报对于非表单文档很有用，而按钮则用于添加注释。\n\
  \n在下一章中，你将了解警报如何为表单提供帮助。\n\n"
- "# 9. 使用悬停文本和警报为客户创建帮助\n\n**章节目标：** 你将学习一些有用的方法，为客户端的表单添加警报，以便他们知道何时输入了正确的信息，从而避免错误。\n\
  \n在第 4 章中，你学会了如何使用按钮创建一个小型帮助菜单，该菜单可以隐藏和显示关于客户订单代码的提示。但是，如果你需要更详细的文本，这种方法可能并非总是最佳解决方案。幸运的是，在\
  \ Acrobat 中，还有几种其他方法可以帮助你为客户创建帮助。此外，我们还将探讨如何使用 JavaScript 隐藏和显示文件、在其他字段中复制输入文本，以及使用复选框以便客户端可以将一个或多个字段设置为只读，并且也能重置字段。\n\
  \n> **注意：** 如果你想在本课中同步操作或查看最终结果，请从引言中的链接下载第 9 章的文件。标有“开始”的文件是未包含代码的文件，标有“结束”的文件是最终结果。如果你想将这些文件添加到自己的\
  \ PDF 表单中，你还会找到包含原始文件和脚本的文件夹。\n\n如果你是从原始 PDF 创建表单，请参考第 1 章中的“表单审查”部分。\n\n请记住，要查看字段的属性，你必须选择“准备表单”工具；只有这样，你才能右键单击或双击某个字段来查看其属性。\n\
  \n如果你想练习接下来的三个示例，可以复制一份 `TMC_OrderForm_Start.pdf` 文件。\n\n## 悬停方法\n\n我们先来看一下悬停方法。请参考图\
  \ 9-1。\n\n![图 9-1：屏幕截图显示一个亮色阴影框，内含文字“您的全名是什么？”，其后是一个用于输入客户全名的文本框。还有另一个框指示数据格式为月、日、年，其后是一个用于输入日期的文本框。](img/449379_2_En_9_Fig1_HTML.jpg)\n\
  \n> **图 9-1：** 当鼠标悬停在文本字段上时，上方红色文本框中会显示不同的信息，为客户提供提示。\n\n在此示例中（参见文件 `TMC_OrderForm_End_rollover.pdf`），你可以看到，当客户将鼠标移动到某个字段上时，表单右上角的红色框会显示一个有用的提示，以便他们在不确定时知道该输入什么。当客户需要知道如何输入正确的日期格式时，这非常有用。提示总是受欢迎的。\n\
  \n当客户将鼠标移出该字段时，它又会变为空白，直到下一个字段被悬停。客户现在知道该输入什么了，这样当表单返回给你时，错误就可以避免。\n\n在此示例中，当你检查以下字段时，它们都通过一个文档级\
  \ JavaScript 在全局范围内以及在这些字段内部被控制：\n\n- 客户全名\n- 日期\n- 订单代码\n- 客户公司名称\n\n红色帮助框 `txtHelp`\
  \ 内部没有 JavaScript；但是，所有字段都在全局范围内引用了它。然而，在“常规”选项卡中，它被设置为（只读），以便用户无法更改文本。\n\n首先，让我们看一下全局或文档级\
  \ JavaScript。在 JavaScript 工具中，选择“文档级 JavaScript”。请参考图 9-2 和图 9-3。\n\n![图 9-2：JavaScript\
  \ 工具及其子工具](img/449379_2_En_9_Fig2_HTML.jpg)\n\n![图 9-3：文档级 JavaScript 对话框](img/449379_2_En_9_Fig3_HTML.jpg)\n\
  \n> **图 9-3：** 文档级 JavaScript 对话框的屏幕截图，包含一个用于输入脚本名称的文本框，后面跟着关闭、添加、编辑和删除四个选项。对话框底部有几行代码，包含函数\
  \ `HelpExit`。\n\n你可以看到这里有两个文档级 JavaScript。\n\n`HelpExit` 是一个全局函数，用于控制那些将访问红色帮助字段\
  \ `txtHelp` 的字段。\n\n当用户离开该字段时，它会返回为空白状态。\n\n```javascript\nfunction HelpExit()\n\
  {\nvar helpText = this.getField(\"txtHelp\");\nhelpText.value =\"\";\n}\n```\n\n\
  另一个 JavaScript 是 `helpText`；此函数包含一个数组。\n\n```javascript\nvar gHelpText = [ // 创建一个变量，gHelpText\n\
  \"您的全名是什么？\", //字符串#0\n\"mm/dd/yyyy\", //字符串#1\n\"您的客户代码在通过电子邮件发送给您的表格上。\", //字符串#2\n\
  \"请问您的公司名称是什么？\" //字符串#3\n]\n```\n\n数组用方括号 `[]` 编写，稍后你会看到更多。它包含自身内部的多个变量或字符串，每个之间用逗号分隔。然后，此表单中的其他字段可以访问这些变量字符串。在前面的代码示例中，我使用了注释（`//`）将它们从\
  \ 0 到 3 进行了编号，以便我知道它们的顺序。\n\n\n\nJavaScript 似乎主要支持索引型的类列表对象，而非关联数组。这些索引数组可以嵌套（即数组中可包含数组）。本章中，你学习了基本索引类型（数组字面量），尽管数组中不包含实际数字，但根据顺序你仍可以通过\
  \ 0 到 3 的数字或字符串引用进行调用。在第 12 章和第 13 章中，你将看到更复杂的嵌套数组或列表对象及其语法示例，这些示例使用单词而非数字进行索引；这些数组/对象字面量将被嵌套，以便信息能够流入其他字段。更多详情请参考此页面：\
  \  \n[`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)\n\
  \n现在，我们来看一个需要帮助的字段：`Customer Full Name`。\n\n以红色方框中显示“帮助信息”的四个字段为例，它们都包含以下两个`JavaScript`。请参考图\
  \ 9-4。\n\n![](img/449379_2_En_9_Fig4_HTML.jpg)\n\n一个标题为“文本字段属性”的对话框截图。它包含 8 个选项卡，其中“动作”选项卡被选中。它有两个下拉菜单，分别用于选择触发条件（鼠标释放）和动作（运行一个\
  \ JavaScript）。它指出了在鼠标进入和离开时的两个动作。\n\n**图 9-4**  \n在“动作”选项卡中选择“鼠标进入时运行 JavaScript”和“鼠标离开时运行\
  \ JavaScript”\n\n-   当鼠标或光标进入时，运行一个 JavaScript。\n-   当鼠标或光标离开时，运行一个 JavaScript。\n\
  \n### 鼠标进入\n\n鼠标进入设置的 JavaScript 如下：\n\n```\nvar helpText = this.getField(\"txtHelp\"\
  );\nhelpText.value = gHelpText[0];\n```\n\n当鼠标进入`Customer Full Name`字段时，JavaScript\
  \ 被要求从文档级 JavaScript `helpText`函数数组`gHelpText`中获取一些文本。对于数组，数字 0 始终代表数组中的第一个项，例如：\n\
  \n```\n0 = \"What's your full name?\"\n1 = \"mm/dd/yyyy\"\n2 = \"Your customer code\
  \ is on the form that was emailed to you.\"\n3 = \"What's your Company Name?\"\n\
  ```\n\n以此类推，如果数组中有更多项的话。\n\n对于`[0]`，它将获取字符串“What's your full name?”并将此文本放入`txtHelp`字段。\n\
  \n对于日期字段，你可以看到代码相同，只是访问的数组索引号不同。这次的鼠标进入设置是`[1]`。订单代码字段是`[2]`，客户公司名称字段是`[3]`。\n\n\
  ```\nvar helpText = this.getField(\"txtHelp\");\nhelpText.value = gHelpText[1];\n\
  ```\n\n在你自己的项目中，如果有一个额外的字段，你可以向文档级 JavaScript 中添加另一个字符串，但在调用时，你需要为其指定索引号`[4]`。这就是为什么我在之前的代码中添加了注释，以便当我有大量文本字符串时能够进行追踪。\n\
  \n### 鼠标离开\n\n鼠标离开的 JavaScript 代码对于四个字段都是相同的。\n\n```\nHelpExit();\n```\n\n当鼠标或光标离开红色帮助框时，它变为空白。\n\
  \n如果出于某种原因你需要更改此函数内部的某些代码，像这样编写全局文档级 JavaScript 会很有帮助。任何附加了此函数的字段现在都会执行新的动作，而无需你手动逐个更改。\n\
  \n在这种情况下，它们离开时都遵循之前的代码，红色的`txtHelp`框恢复到空白状态。\n\n```\nfunction HelpExit()\n{\n  \
  \  var helpText = this.getField(\"txtHelp\");\n    helpText.value = \"\";\n}\n```\n\
  \n### 更长的数组示例（可选）\n\n前面示例中的代码对于此表单的需求来说简洁高效。但是，如果你想要将数组的实际字符串分解为文档级 JavaScript 中`gHelpText`的对象，可以输入以下内容：\n\
  \n```\nvar gHelpText = new Array();\n//spans\n//String#0\ngHelpText[0] = new Object();\n\
  gHelpText[0].text = \"What's your full name?\";\n//String#1\ngHelpText[1] = new\
  \ Object();\ngHelpText[1].text = \"mm/dd/yyyy\";\n//String#2\ngHelpText[2] = new\
  \ Object();\ngHelpText[2].text = \"Your customer code is on the form that was emailed\
  \ to you.\";\n//String#3\ngHelpText[3] = new Object();\ngHelpText[3].text = \"What's\
  \ your Company Name?\";\n```\n\n这种方法虽然更长，但如果你计划使用 JavaScript 为字体添加特定的颜色或对齐格式（我们将在第\
  \ 10 章中详细讨论），它会很有用。但是，在每个字段的鼠标进入事件中，你需要在代码最后一行末尾添加`.text`属性。请参见粗体部分。\n\n```\nvar\
  \ helpText = this.getField(\"txtHelp\");\nhelpText.value = gHelpText[0].text;\n\
  ```\n\n这可以确保文本显示在红色框`txtHelp`中。否则，所有示例都将显示单词`[Object]`。你还需要确保索引号与字符串匹配。如果需要查看示例，请参考文件`TMC_OrderForm_End_rollover_longArray.pdf`。\n\
  \n### 额外的非自定义 JavaScript 复选框示例\n\n如同第 4 章中的表单一样，有关于“收货地址”隐藏和显示文本字段的示例。如果你不记得其工作原理，请回顾此区域。\n\
  \n\n\n### 如何使用 JavaScript 显示和隐藏字段\n\n不过，如果你愿意，也可以改用 JavaScript 来控制这一区域。请参考文件 `TMC_OrderForm_End_rollover.pdf`、复选框字段\
  \ `Check Box7` 以及名为 `Hide and Clear Fields` 的按钮。请参见图 9-5。\n\n![](img/449379_2_En_9_Fig5_HTML.jpg)\n\
  \n截图中显示一个用于“不同送货地址”的未选中复选框，其后跟着一个用于隐藏和清除字段的按钮。鼠标松开时所触发的动作表明将运行一个 JavaScript 脚本。\n\
  \n**图 9-5** 送货地址复选框与按钮示例查看\n\n对于复选框，你可以进入“动作”选项卡，添加“鼠标松开”触发器，并运行包含以下代码的 JavaScript：\n\
  \n```\n//Show Fields and button\nthis.getField(\"First Name_2\").display = display.visible;\n\
  this.getField(\"Last Name_2\").display = display.visible;\nthis.getField(\"Address_2\"\
  ).display = display.visible;\nthis.getField(\"City_2\").display = display.visible;\n\
  this.getField(\"Province_2\").display = display.visible;\nthis.getField(\"Country_2\"\
  ).display = display.visible;\nthis.getField(\"Postal Code_2\").display = display.visible;\n\
  this.getField(\"Hide and Clear Fields\").display = display.visible;\n```\n\n通过将\
  \ `display` 属性设置为 `display.visible`，你希望显示的每个字段（包括按钮）都会出现。\n\n然后，对于按钮“Hide and Clear\
  \ Fields”，在“动作”选项卡的“鼠标松开”事件中，你可以运行包含以下代码的 JavaScript：\n\n```\n//Reset Fields\nthis.resetForm([\"\
  Check Box7\",\"First Name_2\", \"Last Name_2\", \"Address_2\", \"City_2\", \"Province_2\"\
  , \"Country_2\", \"Postal Code_2\"]);\n// Hide Fields and Button\nthis.getField(\"\
  First Name_2\").display = display.hidden;\nthis.getField(\"Last Name_2\").display\
  \ = display.hidden;\nthis.getField(\"Address_2\").display = display.hidden;\nthis.getField(\"\
  City_2\").display = display.hidden;\nthis.getField(\"Province_2\").display = display.hidden;\n\
  this.getField(\"Country_2\").display = display.hidden;\nthis.getField(\"Postal Code_2\"\
  ).display = display.hidden;\nthis.getField(\"Hide and Clear Fields\").display =\
  \ display.hidden;\n```\n\n你之前已经见过重置代码，在此例中，我还确保将复选框重置回初始状态。不过，这次在代码中，我将要隐藏的每个字段（包括按钮）的\
  \ `display` 属性设置为 `display.hidden`。这是一种保持代码条理清晰的好方法。\n\n或者，你也可以完全移除按钮，仅使用复选框，在取消选中时隐藏并重置这些字段。你可以在我的文件\
  \ `TMC_OrderForm_End_rollover_2.pdf` 中看到这种替代方案。\n\n如果只使用复选框，你可以键入以下 JavaScript 代码。请注意，在本例中，我将所有变量组织在代码顶部，以避免重复输入字段名称，从而保持代码整洁。在\
  \ `if` 分支中，我使字段可见；在 `else` 分支中，重置后，我隐藏了字段。\n\n```\nvar checkbox = this.getField(\"\
  Check Box7\");\nvar fn= this.getField(\"First Name_2\");\nvar ln = this.getField(\"\
  Last Name_2\");\nvar address = this.getField(\"Address_2\");\nvar city = this.getField(\"\
  City_2\");\nvar province = this.getField(\"Province_2\");\nvar country = this.getField(\"\
  Country_2\");\nvar postalCode = this.getField(\"Postal Code_2\");\nif (event.target.value\
  \ !=\"Off\"){\n//Show the fields and button\nfn.display = display.visible;\nln.display\
  \ = display.visible;\naddress.display = display.visible;\ncity.display = display.visible;\n\
  province.display = display.visible;\ncountry.display = display.visible;\npostalCode.display\
  \ = display.visible;\n}\nelse{\n//Reset Fields\nthis.resetForm([\"Check Box7\",\"\
  First Name_2\", \"Last Name_2\", \"Address_2\", \"City_2\", \"Province_2\", \"Country_2\"\
  , \"Postal Code_2\"]);\n// Hide Fields and Button\nfn.display = display.hidden;\n\
  ln.display = display.hidden;\naddress.display = display.hidden;\ncity.display =\
  \ display.hidden;\nprovince.display = display.hidden;\ncountry.display = display.hidden;\n\
  postalCode.display = display.hidden;\n}\n```\n\n注意，这里不再需要额外的按钮。取而代之的是，复选框的“运行 JavaScript”动作中包含了重置代码。请参见图\
  \ 9-5。在 `else` 条件下，我先重置表单字段，然后再隐藏它们。在这种情况下，重置时不能仅对字段变量调用，因此必须确保你的代码拼写正确。请记住，在你自己的项目中，退出编辑器后要点击“确定”。关闭属性面板，预览并测试你的表单，以确保正确的字段被重置。然后保存文件。\n\
  \n\n\n## 默认文本方法\n\n对于某些表单来说，悬停提示是个好方法，但在其他情况下可能效果不佳，例如字段位于页面底部或表单跨越多页时。与网络表单类似，有时默认文本会直接显示在实际字段内。你可以在“选项”选项卡中为字段添加默认文本。然而，当用户点击该字段时，文本并不会消失；它会保留下来。用户必须先选中文本，然后手动删除。这对于只想直接开始输入的用户来说，可能会变得笨拙且令人沮丧。请参考图\
  \ 9-6。请自行在“选项”选项卡中，将这段文本添加到一个空白文本字段并进行测试。\n\n![](img/449379_2_En_9_Fig6_HTML.jpg)\n\
  \n文本字段属性页面的截图显示了 8 个选项卡，其中“选项”选项卡被选中。它有一个下拉菜单用于选择左对齐，一个用于输入默认值的方框，后跟几个复选框，其中“拼写检查”和“滚动长文本”复选框被选中。\n\
  \n**图 9-6**  \n在“选项”选项卡中为文本字段添加默认文本\n\n除了添加默认文本，你还可以在“格式”选项卡中使用此脚本创建自定义格式。请参考图 9-7\
  \ 和图 9-8 以及文件 `TMC_OrderForm_End _default_text.pdf`。\n\n![](img/449379_2_En_9_Fig8_HTML.jpg)\n\
  \n截图显示了两个用于输入客户全名的文本框。方框 1 显示了文本“您的全名是什么？”。方框 2 中有一个条目“John Smith”。\n\n**图 9-8**\
  \  \n自定义默认文本（顶部）与输入的文本（底部）\n\n![](img/449379_2_En_9_Fig7_HTML.jpg)\n\n文本字段属性页面的截图显示了\
  \ 8 个选项卡，其中“格式”选项卡被选中。它有一个下拉菜单用于选择“自定义”格式类别，后跟几行自定义格式脚本，以及一个位于方框右侧的“编辑”按钮。\n\n**图\
  \ 9-7**  \n在“格式”选项卡中添加自定义脚本\n\n在本练习中，你可以参考“客户全名”字段。\n\n```\n// 自定义格式脚本\nif (!event.value){\n\
  event.value = \"您的全名是什么？\";\nevent.target.textColor = color.gray;\n}\nelse{\nevent.target.textColor\
  \ = color.black;\n}\n```\n\n图 9-8 展示了其差异。\n\n在此示例中，只要字段中为空，默认文本就会显示为灰色，当字段被点击并输入新文本时，默认文本会消失。新输入的文本将显示为黑色。我将同样的代码应用到了“客户公司名称”字段，并修改了`event.value`以反映该字段的默认文本。\n\
  \n```\n// 自定义格式脚本\nif (!event.value){\nevent.value = \"您的公司名称是什么？\";\nevent.target.textColor\
  \ = color.gray;\n}\nelse{\nevent.target.textColor = color.black;\n}\n```\n\n无需对这些字段应用任何其他\
  \ JavaScript 操作或文档操作。\n\n对于某些文本框来说，这是一个好方法。然而，对于其他一些框，比如说明文本比字段长，或者必须格式化为日期、数字或字符组合的框，使用这种自定义格式可能并非理想选择。在这些情况下，你或许仍希望像之前介绍的悬停提示方法那样，使用文档操作。在此文件中，我保留了这些字段的原样。现在，让我们看看针对这些情况的其他选项。\n\
  \n**注意**\n\n当添加感叹号时，`if (!event.value)` 变为布尔类型，即一个真/假判断语句（如果否定）。在默认文本的这种情况中，如果文本字段中没有输入任何值，这就是你当前应填充的内容。如果没有这个感叹号，默认文本将不会被填充。\n\
  \n## 提示框方法\n\n是否还有其他方法可以让提示信息随着用户在表单中填写字段而移动？是的，可以通过提示框来实现。提示框的另一个很酷的特性是，如果你正确设置它们，你可以在其中输入文本，然后该文本将被传输到正确的表单字段。请参考图\
  \ 9-9 以及文件 `TMC_OrderForm_End_alert.pdf`。\n\n![](img/449379_2_En_9_Fig9_HTML.jpg)\n\
  \n截图显示了两个 JavaScript 窗口警告消息。1：一行文字“输入您的名字和姓氏”，后跟一个输入姓名的方框和一个“确定”按钮。2：一条包含已输入姓名和注册说明的消息。\n\
  \n**图 9-9**  \n在提示框中输入文本，当用户点击“确定”然后跳出该字段时，文本便会输入到字段中\n\n在此示例中（请参阅“提示结束版 PDF”文件），没有全局文档\
  \ JavaScript，因此我们可以暂时跳过该部分。\n\n同样，这里有四个文本字段：\n\n*   客户全名\n*   日期\n*   订单代码\n*  \
  \ 客户公司名称\n\n这次没有红色的 `txtHelp` 字段；你将使用提示框来完成这项工作，因为在表单下方看到一个红色框会显得很奇怪。现在，我们将逐一查看每个字段，并进一步探索其代码。\n\
  \n\n\n### 客户全名\n\n这次你将仅在每个字段运行一个 JavaScript。无需担心退出函数，因为警告框会替你处理，稍后你就会看到。在本例中，使用“获得焦点”（On\
  \ Focus）触发器，当任何人点击进入文本字段时便会激活。请参考图 9-10。\n\n![](img/449379_2_En_9_Fig10_HTML.jpg)\n\
  \n一张文本字段属性的截图，共有 8 个选项卡，其中“动作”选项卡被选中。它有两个下拉菜单，用于选择触发器为“获得焦点”以及动作“运行 JavaScript”，其后是一个动作列表、一个删除按钮和一个关闭按钮。\n\
  \n**图 9-10** 在“动作”选项卡中运行 JavaScript 动作\n\n以下是在 JavaScript 编辑器中添加到“运行 JavaScript”动作的代码，如图\
  \ 9-10 所示：\n\n```\nvar t = event.target; // 目标字段\nvar cResponse = app.response({\n\
  cQuestion: \"输入您的姓名，先名后姓\",\ncTitle: \"姓名\",\ncDefault: \"未添加姓名\",\ncLabel: \"输入您的姓名\"\
  });\n{\nif (cResponse == null){ // 如果选择了“取消”\napp.alert (\"您已取消添加姓名。\");\ncResponse\
  \ = \"\";\n}\nelse{\napp.alert(\"您输入的姓名是：\\\"\"+cResponse+\"\\\" \\n\\n 跳出该字段以注册您的姓名\"\
  ,3);\n}\n}\nt.value = cResponse; // 将对话框中的数据放置到目标字段\n```\n\n在图 9-11 中，你可以看到 alert\
  \ 或 `app.response` 创建了一条描述信息，其中包含问题（`cQuestion`）、标题（`cTitle`）、默认文本（`cDefault`）和标签（`cLabel`）等属性或参数，以及一个供用户按提示输入姓名的空格，并替换掉默认文本。\n\
  \n![](img/449379_2_En_9_Fig11_HTML.jpg)\n\n一张 JavaScript 窗口名称警告信息的截图。它包含一行提示文字“输入您的名和姓”，其后是一个用于输入姓名的框和一个确定按钮。\n\
  \n**图 9-11** JavaScript 帮助响应消息窗口\n\n> **说明：** 你也可以选择设置密码（`bPassword`）参数，如果设为 true，则会显示\
  \ * 或圆点来遮盖用户的响应。默认情况下，该参数是关闭的或设为 false。\n\n如果用户点击“取消”按钮，会出现一条内容如下的警告或应用提示：“您已取消添加姓名。”点击该消息的“确定”后，文本字段将恢复为空白。请参考图\
  \ 9-12。\n\n![](img/449379_2_En_9_Fig12_HTML.jpg)\n\n一张 JavaScript 窗口警告信息的截图，显示一条消息：“您已取消添加姓名。”页面右下角有一个“确定”按钮。\n\
  \n**图 9-12** 用户在前一个窗口中点击“取消”时的 JavaScript 警告\n\n如果用户输入姓名并点击“确定”，他们会看到以下应用提示：“您输入的姓名是：[客户姓名]”\
  \ 或代码行 `\\\"+cResponse+\\\"`。如图 9-13 所示，他们点击该消息的“确定”。一旦客户跳出该字段进入下一个字段，他们的姓名即被确认，如代码行\
  \ `t.value = cResponse` 所示。\n\n本例代码中的 `3` 指的是图标更改为状态/信息图标，而在之前的 alert 中未添加该参数或使用的是默认值\
  \ 0。另外，本例和之前的示例中代码里都没有为按钮指定数字，但在这两种情况下，按钮默认都是 0 或“确定”按钮。因此，在本例中，你也可以写成 `3,0`，结果相同。你可以在第\
  \ 8 章的“警告类型”一节中查看这些设置。请参考图 9-13。\n\n![](img/449379_2_En_9_Fig13_HTML.jpg)\n\n一张\
  \ JavaScript 窗口警告信息的截图，显示一条消息：“您输入的姓名是：Jennifer Harder，跳出该字段以注册您的姓名。”页面右下角有一个“确定”按钮。\n\
  \n**图 9-13** 用户在前一个窗口中点击“确定”后的 JavaScript 确认信息\n\n如果您的 Tab 键顺序设置正确，您应该会继续进入下一个字段以处理该流程。\n\
  \n请注意，`app.response` 的显示方式与 `app.alert` 略有不同。使用 `app.response` 时，本例中的默认按钮是“确定”和“取消”，没有警告图标。然而，它可以与\
  \ app.alert 协同工作，为用户创建一连串的提示。\n\n让我们进入下一个字段。请注意，您再次使用了 `if/else` 条件来获得两种可能的应答。\n\
  \n### 日期\n\n“日期”字段的行为方式类似。但是，请务必确保该字段的格式已设置为与本例中的文本匹配，例如：“mm/dd/yyyy”。请参考图 9-14。\n\
  \n![](img/449379_2_En_9_Fig14_HTML.jpg)\n\n一张标题为“文本字段属性”的对话框截图。它有 8 个选项卡，其中“格式”选项卡被选中。日期的格式类别被选择为“月/日/年”格式。\n\
  \n**图 9-14** “格式”选项卡上的“日期选项”菜单\n\n现在转到“动作”选项卡，你会看到我使用了与“客户全名”字段相同的设置，只是根据需求修改了文本。请参考图\
  \ 9-15 和图 9-16。\n\n![](img/449379_2_En_9_Fig16_HTML.jpg)\n\n一张对话框截图，显示 JavaScript\
  \ 窗口日期的警告信息。消息内容为：“按月份、日期和年份格式输入日期”，其后是一个用于输入日期的框。页面底部有一个“确定”按钮。\n\n**图 9-16** 日期字段的\
  \ JavaScript 帮助消息\n\n![](img/449379_2_En_9_Fig15_HTML.jpg)\n\n一张标题为“文本字段属性”的对话框截图。它有\
  \ 8 个选项卡，其中“动作”选项卡被选中。触发器被选择为“获得焦点”，用于运行 JavaScript 动作。右侧有一个“添加”按钮。\n\n**图 9-15**\
  \ 在“动作”选项卡上为“日期”字段运行 JavaScript 动作\n\n以下是代码：\n\n```\nvar t = event.target; // 目标字段\n\
  var cResponse = app.response({\ncQuestion: \"输入日期，格式为 mm / dd / yyyy\",\ncTitle:\
  \ \"日期\",\ncDefault: \"未添加日期\",\ncLabel: \"输入日期\"});\n{\nif ( cResponse == null){\
  \ // 如果选择了“取消”\napp.alert (\"您已取消添加日期。\");\ncResponse = \"\";\n}\nelse{\napp.alert(\"\
  您输入的日期是：\\\"\"+cResponse+\"\\\" \\n\\n 跳出该字段以注册日期\",3);\n}\n}\nt.value = cResponse;\
  \ // 将对话框中的数据放置到目标字段\n```\n\n我们可以看到类似的事件模式如何展开。在这个字段中，必须添加一个日期。您点击提示框的“确定”，然后按 Tab\
  \ 键进入下一个字段以确认响应。但请记住，近年来 Acrobat 通过“日期选择器”使输入日期变得更加容易，因此您可以选择使用或不使用此提示。无论如何，如果您未输入正确的日期格式，仍然会出现额外的提示，并且即使您跳出该字段，该字段也会保持空白，直到您输入正确的日期格式。关于这一点，您可以在本章稍后的“最终思考”部分看到我的评论。\n\
  \n\n\n### 客户订单代码\n\n客户订单代码的构建方式与日期相同，只是代码略有不同。请参考图 9-17 查看结果。\n\n![JavaScript 窗口警告信息的两个截图。1.\
  \ 客户订单代码有一个用于输入 16 位代码编号的文本框，后面跟着一个确定按钮。2. 消息确认了代码编号，并指示了注册卡号的说明。](img/449379_2_En_9_Fig17_HTML.jpg)\n\
  \n**图 9-17**  \n客户订单代码的 JavaScript 帮助消息以及确认消息\n\n客户订单代码的功能类似，您本可以将格式设置为 `Number`。但是，由于您可能希望在代码中包含字母和数字，因此在“**格式**”选项卡上将格式设置保留为\
  \ `None`。在“**动作**”选项卡上，将“`触发器`”设置为“`On Focus`”，然后选择“`运行 JavaScript`”。请参考图 9-15。\n\
  \n```\n// Customer Code or Credit Card Example\nvar t = event.target; // the target\
  \ field\nvar cResponse = app.response({\ncQuestion: \"Type your Customer Order Code\
  \ number using numbers/letters only and without dashes\",\ncTitle: \"Customer Order\
  \ Code\",\ncLabel: \"Type your 16 digit code number\"});\n{\nif ( cResponse == null){\
  \ // if Cancel is selected\napp.alert (\"You cancelled adding your code.\");\ncResponse\
  \ = \"\";\n}\nelse {\nif (cResponse.length != 16){\napp.alert(\"Type the complete\
  \ number/letters without dashes or there may be more or less than 16 digits.\");\n\
  cResponse = \"\";}\nelse{\napp.alert(\"You typed your Order Code number as: \\\"\
  \"+cResponse+\"\\\" \\n\\n Tab out of the field to register the card number\",3);}\n\
  }\n}\nt.value = cResponse; // places the data from the dialog to the target field\n\
  ```\n\n请注意外层的 `else` 条件语句是如何执行其自身的 `if/else` 条件检查，以确保字段中包含 16 个字符。如果不符合，则警报会提醒您输入时不带破折号，或者输入的字符不是\
  \ 16 个，并且该字段将变为空白。对于您自己的项目，您可以决定调整消息内容。否则，如果正好有 16 个字符，则当您跳出该字段时，这些字符将在字段中得到确认。\n\
  \n### 客户公司名称\n\n此代码与客户的“全名”字段类似，也添加到“**动作**”选项卡中。请参考图 9-10。请参考图 9-18 查看警报应该如何显示。\n\
  \n![JavaScript 窗口警告信息的两个截图。1. 它显示了一个用于输入公司名称的文本框，后面跟着一个确定按钮。2. 它确认了输入的公司名称，并指示跳出该字段以注册公司名称。](img/449379_2_En_9_Fig18_HTML.jpg)\n\
  \n**图 9-18**  \n公司名称的 JavaScript 帮助消息以及确认消息\n\n```\n// Company name\nvar t = event.target;\
  \ // the target field\nvar cResponse = app.response({\ncQuestion: \"Type your Company’s\
  \ Name\",\ncTitle: \"Company Name\",\ncDefault: \"Company Name not added\",\ncLabel:\
  \ \"Type your Company name\"});\n{\nif ( cResponse == null){ // if Cancel is selected\n\
  app.alert (\"You cancelled adding your Company’s name.\");\ncResponse = \"\";\n\
  }\nelse{\napp.alert(\"You typed your Company name as: \\\"\"+cResponse+\"\\\" \\\
  n\\n Tab out of the field to register your Company’s name\",3);}\n}\nt.value = cResponse;\
  \ // places the data from the dialog to the target field\n```\n\n有关 `app.response`\
  \ 及其与 `app.alert` 配合使用的更多详细信息，请参考以下页面：[`https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html?highlight=response#response`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html?highlight=response#response)\n\
  \n## 如何将文本复制到多个字段并将字段设为只读\n\n在某些情况下，您可能希望在一个字段中输入的文本在其他字段中重复出现，或者您希望允许客户自行将某个字段设置为只读。这可能包括文本、日期，甚至是计算结果。让我们首先看看如何实现文本复制。请参考文件\
  \ `TMC_PartOrderForm_Duplicate_End.pdf` 和图 9-19。\n\n![公司零件订单表的屏幕截图。该表单有用于客户全名、日期、客户订单代码和客户公司名称的文本框。它有一个包含\
  \ 5 列（零件号、描述、数量、单价和金额）的表格，后跟订单摘要。](img/449379_2_En_9_Fig19_HTML.jpg)\n\n**图 9-19**\
  \  \n一个包含可将文本复制到父字段中的字段的表单\n\n在此示例中，如果我在 `Customers Full Name` 字段中键入内容，则第 1 页和第\
  \ 2 页下方设置为只读的其他字段将填入我键入的任何文本。有时，当您创建两个同名的文本字段时，这可能会起作用，这样当您在一个字段中键入内容时，另一个字段会接收相同的文本。请参考图\
  \ 9-20。\n\n![文本字段属性页面的屏幕截图，该页面有 8 个选项卡，其中选择了常规选项卡。它有一个用于输入名称的文本框，后跟常见属性的设置，包括表单字段和方向。](img/449379_2_En_9_Fig20_HTML.jpg)\n\
  \n**图 9-20**  \n两个字段在“常规”选项卡上具有相同的名称。但在字段面板中，它们的名称会略有不同以进行区分。但是，它们现在都设置为只读\n\n我发现，像这样创建文本字段绝不是一个好主意，因为它可能导致错误，尤其是因为一个字段不能设置为只读；由于它们是链接的，它们要么都是只读的，要么都不是。请参考图\
  \ 9-20。\n\n要使一个字段为只读而另一个字段用于输入，字段必须具有不同的名称。您可以像我做的那样重命名一个字段来实现这一点。我将一个字段从 `Customers\
  \ Full Name` 更改为 `Customers Full Name#1`。请参考图 9-21。\n\n![页面的两个截图。两者都选择了“常规”选项卡，并指示了客户全名和常见属性的部分。常见属性显示了表单字段和方向的详细信息。第二个截图中的名称为\
  \ customer's full name hashtag 1。](img/449379_2_En_9_Fig21_HTML.jpg)\n\n**图 9-21**\
  \  \n当两个字段在“常规”选项卡上具有不同的名称时，它们可以独立运行，您可以将其中一个设置为只读\n\n然而，我们仍然希望 `Customers Full\
  \ Name` 字段中的文本流向 `Customers Full Name#1`。\n\n在这种情况下，对于 `Customers Full Name#1`，您可以将“**格式**”选项卡上的“**格式**”设置保留为\
  \ `None`，因为它实际上不是一个数字，但它会有一个值。然后，您可以转到“**计算**”选项卡，查看添加的以下代码或自定义计算脚本。请参考图 9-22。\n\
  \n![文本字段属性页面的屏幕截图，该页面有 8 个选项卡，其中选择了计算选项卡。选择了自定义计算脚本的单选按钮。有几行代码用于获取客户全名。](img/449379_2_En_9_Fig22_HTML.jpg)\n\
  \n**图 9-22**  \n“计算”选项卡上的自定义计算脚本\n\n在 JavaScript 编辑器中，我键入了以下内容：\n\n```\nevent.value\
  \ = this.getField(\"Customers Full Name\").value;\n```\n\n现在，原始字段的值将等于设置为只读字段的值，从而防止客户在链接或重复字段中键入内容。\n\
  \n\n\n您可以按照以下方式对链接的日期甚至数学计算进行处理。这些链接的只读字段也可以位于其他页面上，例如`Customers Full Name#2`字段，它也通过`Calculate`选项卡引用相同的代码。\n\
  \n您可以在`Date#1`和`Date#2`字段中看到这一点；它们的代码引用了`Date`字段。只需确保所有字段的格式设置为相同的日期格式。\n\n```\n\
  event.value = this.getField(\"Date\").value;\n```\n\n或者，对于`Total#1`和`Total#2`字段，您可以链接到`Total`字段，以实时重复该计算输入。在这种情况下，这些字段的格式已设置为`Number`。\n\
  \n```\nevent.value = this.getField(\"Total\").value;\n```\n\n### 使用 JavaScript 将字段设置为只读\n\
  \n最后，如果您有一个希望客户端通过复选框锁定或设置为只读的字段，您可以使用之前用于显示和隐藏字段的代码。我以`Customer Order Code`字段为例进行说明。请参考图\
  \ 9-23。\n\n![](img/449379_2_En_9_Fig23_HTML.jpg)\n\n截图包含两个用于输入客户订单代码的区域。两者都有 16\
  \ 个格子，内容为相同的订单代码。底部的订单代码已勾选，设置为只读。\n\n**图 9-23** 使用复选框将字段设置为只读\n\n对于`Actions`选项卡上的`Check\
  \ Box2`复选框，使用`Mouse Up`触发器和`Run a JavaScript`设置，您可以输入以下内容：\n\n```\nif(event.target.value\
  \ !=\"Off\"){\nthis.getField(\"Customer Order Code\").readonly=true;\n}\nelse{\n\
  this.getField(\"Customer Order Code\").readonly=false;\n}\n```\n\n这再次设置了一个真假条件语句。如果`event.target.value`不等于`\"\
  Off\"`（即选中或开启状态），条件为真，字段被设置为只读。否则，条件为假，字段不是只读，客户端可以编辑该字段。\n\n在您自己的项目中，如果您希望在启用复选框时也将更多字段设置为只读，可以在`if`和`else`条件中引用更多字段。只需确保将它们分别设置为`true`和`false`即可。\n\
  \n## 最终思考\n\n如您所见，有多种方法可以帮助客户填写表单。并非所有字段都需要提供帮助。有些字段是明确且不言自明的。然而，如果您的客户不熟悉某个词语，或者由于英语水平有限需要翻译，这可能是一种可行的解决方法。如果表单只有一页，使用滚动提示可能就足够了。但是，对于两页或更多页且帮助信息分布在不同位置的表单，我建议使用警报方法。虽然这些表单提供了多种警报，但找到最适合客户需求的平衡点至关重要，这样既能提供信息，又不会让他们感到不知所措。\n\
  \n**注意**\n\nAdobe Acrobat 现在（自 2017 年起）提供了一个日期弹出菜单。当文本字段格式设置为日期，或者您添加了一个日期字段时，可以使用日期选择器。由于用户选择日期后会自动格式化，因此为日期添加警报方法是可选的。在这种情况下，如果您发现警报代码干扰了表单的流程，可以选择修改或完全移除它。请参考图\
  \ 9-24。但是，如果字段格式设置为时间，由于没有实际的“时间选择器”，此时使用此警报来提示格式将会很有用。\n\n![](img/449379_2_En_9_Fig24_HTML.jpg)\n\
  \n截图显示了一个从日历中选择日期的下拉菜单。它有一个日历弹出窗口，日期显示为 01、斜杠、13、斜杠、2023。\n\n**图 9-24** 在 Acrobat\
  \ 中添加日期字段时出现的日期选择器弹出菜单\n\n## 总结\n\n在本章中，您学习了三种可能的方法，用于在客户处理文本字段时创建帮助信息。您了解了如何修改代码以隐藏、显示和重置字段。您还了解了如何在多个字段中重用文档\
  \ JavaScript，以及如何对文本字段应用自定义格式。\n\n最后，我们探讨了如何为多个字段复制文本，以及如何使用 JavaScript 使字段变为只读。\n\
  \n在下一章中，您将了解根据输入的数字或用户输入，有哪些其他选项可用于修改字段内的文本。\n\n"
- "# 10. 使用 JavaScript 进行各种类型的格式化\n\n在上一章中，您了解了如何创建各种警报来帮助客户发现输入了错误信息。\n\n**章节目标：**\
  \ 在本章中，您将探索如何全局或单独地修改各种字段的外观，使其符合您选择的格式。您还将根据选中的单选按钮或复选框来修改结果值的外观。以下是您将要解决的其他主题：\n\
  \n*   创建允许标签跨越多行的按钮\n*   当多行文本字段空间不足时，允许客户输入的文本流入另一个文本字段\n*   使用 JavaScript 和按钮仅打印一页或一定范围的页面，而不是打印整个文档\n\
  *   创建一个用于通过电子邮件提交 PDF 的基本按钮\n\n\n\n## 为文本字段添加全局格式\n\n通过表单，使用“外观”和“选项”选项卡上的属性可以非常轻松地完成字体或字段颜色的格式化。请参考图\
  \ 10-1。\n\n![图 10-1](img/449379_2_En_10_Fig1_HTML.png)\n*图 10-1：显示格式化选项的“外观”和“选项”选项卡*\n\
  \n这两个选项卡适用于大多数字段，尽管其中的属性会根据字段类型而有所不同。在本章的示例中，我们讨论的是文本字段。但是，你在此处学到的大部分内容也可以应用于其他字段类型。你还将学习如何使用\
  \ JavaScript 访问这些属性。\n\n在其他情况下，你可能希望所有字段具有相同的颜色或字体。你可以选中所有字段（用选框拖拽覆盖所有字段），然后右键单击“属性”，并在“外观”选项卡中设置各种新属性。请参考图\
  \ 10-2。\n\n![图 10-2](img/449379_2_En_10_Fig2_HTML.jpg)\n*图 10-2：同时高亮显示多个字段时的“外观”选项卡*\n\
  \n然而，这可能会导致错误，并且可能无法获得预期结果，尤其是当你忘记选中某些内容时。\n\n**注意：** 如果你想在本课程中同步操作或查看最终结果，请从引言中的链接下载第\
  \ 10 章的文件。标有“开始”的文件是不包含代码的文件，标有“结束”的文件是最终结果。如果你希望将这些脚本添加到自己的 PDF 表单中，你将找到一个包含原始脚本的文件夹。\n\
  \n如果你是从原始 PDF 创建表单，请参考第 1 章中的“表单审查”部分。\n\n请记住，要查看字段的属性，必须选择“准备表单”工具；只有这样，你才能右键单击或双击字段来查看其属性。\n\
  \n使用 JavaScript，你可以快速更改颜色。要执行全局操作，你需要在 JavaScript 工具中进入文档级 JavaScript。请参阅本章文件夹中的文件\
  \ `TMC_Customer Survey_End_Part2_global.pdf`。格式化代码请参考图 10-3。\n\n![图 10-3](img/449379_2_En_10_Fig3_HTML.jpg)\n\
  *图 10-3：JavaScript 工具和文档级 JavaScript 对话框*\n\n以下是一个名为 `fieldsRed` 的 JavaScript 脚本。我添加了以下代码：\n\
  \n```\n// Script to set the font and size of text fields or another field format\
  \ globally\nfor (var i = 0; i < numFields; i++) {\n// Get a reference to the current\
  \ field\nvar f = getField(getNthFieldName(i));\n// If it's a text field, set the\
  \ font and font size or another format like stroke color\nif (f.type == \"text\"\
  ) {\nf.strokeColor = color.red;\n}\n}\n```\n\n要仅查找文本字段并为其应用红色描边颜色，请使用 JavaScript\
  \ 的 `for()` 循环。请参考图 10-4 查看结果。\n\n![图 10-4](img/449379_2_En_10_Fig4_HTML.jpg)\n\
  *图 10-4：在代码中添加 `for()` 循环后对字段的影响*\n\n在 Acrobat JavaScript 中，循环并不常见，除非你想影响多个字段。最常用的是\
  \ `for()` 循环。JavaScript 中还有其他的循环，如 `for in`、`for of`、`while` 和 `do while`。为简化起见，我们只关注\
  \ `for()` 循环，如 `fieldsRed` 代码所示。\n\n这个 `for()` 循环包含三条语句。\n\n```\n\"var i = 0; i\
  \ < numFields; i++\"\n```\n\n变量 `var i = 0;` 在循环（代码块）开始之前执行。与第 9 章前面介绍的数组示例一样，字段\
  \ 0 是起点。\n\n`i < numFields;` 定义了运行循环（代码块）的条件。`var i` 小于（`<`）`numFields`。你的表单可能非常大。由于不知道有多少个字段，因此使用\
  \ `numFields` 而非实际数字。你希望循环持续进行，直到到达表单的末尾。\n\n`i++` 每次在循环（代码块）执行之后执行。这使循环持续进行，直到到达末尾。\n\
  \n中间部分充当控制逻辑：\n\n```\nvar f = getField(getNthFieldName(i));\n// If it's a text field,\
  \ set the font and font size or another format like stroke color\nif (f.type ==\
  \ \"text\") {\nf.strokeColor = color.red;\n}\n```\n\n当字段数量被收集后，你使用条件 `if` 语句检查它们是否确实是文本字段。如果是，则可以将红色描边颜色应用于该字段。请注意文档中按钮字段是如何没有应用红色描边的；它们在循环过程中被排除了。\n\
  \n要格式化其他类型的字段而非文本，请格式化以下行：\n\n- `if (f.type == \"checkbox\")`\n- `if (f.type ==\
  \ \"radiobutton\")`\n- `if (f.type == \"button\")`\n- `if (f.type == \"signature\"\
  )`\n- `if (f.type == \"combobox\")`\n- `if (f.type == \"listbox\")`\n\n或者使用此循环，如果你想将描边颜色更改为蓝色，可以更改此行：\n\
  \n```\nf.strokeColor = color.blue;\n```\n\n所有原本具有红色描边的字段将立即变为蓝色，并且你无需担心选中所有字段的问题。\n\
  \n### 颜色属性\n\n表 10-1 中定义了你可以尝试的其他颜色。对于色彩空间，T = 透明，G = 灰度，RGB = 红、绿、蓝，CMYK = 青、品红、黄、黑。0\
  \ = 0% 颜色，1 = 100% 颜色。\n\n*表 10-1：颜色属性*\n\n| 颜色对象 | 关键字 | 等效 JavaScript |\n| ---\
  \ | --- | --- |\n| 透明 | `color.transparent` | `[ \"T\" ]` |\n| 黑色 | `color.black`\
  \ | `[ \"G\", 0 ]` 或 `[ \"RGB\", 0,0,0 ]` 或 `[ \"CMYK\", 0,0,0,1 ]` |\n| 白色 | `color.white`\
  \ | `[ \"G\", 1 ]` 或 `[ \"RGB\", 1,1,1]` |\n| 红色 | `color.red` | `[ \"RGB\", 1,0,0\
  \ ]` |\n| 绿色 | `color.green` | `[ \"RGB\", 0,1,0 ]` |\n| 蓝色 | `color.blue` | `[\
  \ \"RGB\", 0,0,1 ]` |\n| 青色 | `color.cyan` | `[ \"CMYK\", 1,0,0,0 ]` |\n| 品红 | `color.magenta`\
  \ | `[ \"CMYK\", 0,1,0,0 ]` |\n| 黄色 | `color.yellow` | `[ \"CMYK\", 0,0,1,0 ]` |\n\
  | 深灰色 | `color.dkGray` | `[ \"G\", 0.25 ]` |\n| 灰色 | `color.gray` | `[ \"G\", 0.5\
  \ ]` |\n| 浅灰色 | `color.ltGray` | `[ \"G\", 0.75 ]` |\n\n某些颜色（如橙色或紫色）可能没有可以直接使用的关键字。在这种情况下，你需要计算出等效的\
  \ JavaScript。例如，对于橙色，你可以使用 `[ \"CMYK\", 0,0.5,1,0 ]`，在这种情况下，将品红设置为 50%，黄色设置为 100%。对于紫色，你可以编写\
  \ `[ \"CMYK\", 0.60,0.80,0,0 ]`，将青色设置为 60%，品红设置为 80%，或者尝试以类似方式使用数字找出 `\"RGB\"` 等效值。请记住，对于灰度或\
  \ `\"G\"`，较浅的颜色对应较大的数字。\n\n\n\n## 数组与格式化属性变量示例\n\n字段和注释（批注）都可以通过全局自定义字段属性来以多种方式受到影响。\n\
  \n例如，在第 9 章的数组文本中，您可以在 PDF 文档中分解出您想要针对的属性。\n\n```\nvar gHelpText = new Array();\n\
  //spans\n//String#0\ngHelpText[0] = new Object();\ngHelpText[0].text = \"What's\
  \ your full name?\";\ngHelpText[0].textColor = color.blue;\ngHelpText[0].textFont\
  \ = font.Times;\ngHelpText[0].textSize = 16;\ngHelpText[0].alignment = \"center\"\
  ;\n```\n\n然而，要让这种格式生效并关联到数组的其他部分是很困难的，因为格式（如颜色）不会传递给字段，而只会作为文本字符串传递。\n\n在这种情况下，更好的做法是将这些新属性中的大部分添加到`txtHelp`字段的“格式”选项卡中，作为针对该字段的自定义格式。请参考图\
  \ 10-5。另请参考文件`TMC_OrderForm_End_rollover_format.pdf`。\n\n![](img/449379_2_En_10_Fig5_HTML.jpg)\n\
  \n一个文本字段属性窗口的截图，其中“格式”选项卡已展开。其中包含一个用于格式类别的下拉菜单、一个自定义格式脚本列表以及自定义击键脚本。页面底部有一个带边框的方框，其中包含文本“What\
  \ is your full name?”。\n\n图 10-5\n\n“文本字段属性”对话框的“格式”选项卡及自定义格式脚本\n\n通过 JavaScript\
  \ 代码，您可以控制该字段的以下属性：填充、描边、边框样式和描边宽度，以及字体属性（如颜色、文本字体或字体系列），以及大小和对齐方式。\n\n```\n//Field\
  \ Fill\nevent.target.fillColor = color.gray;\nevent.target.strokeColor = color.red;\n\
  event.target.borderStyle = border.b;\nevent.target.lineWidth = 2;\n//Fonts\nevent.target.textColor\
  \ = color.white;\nevent.target.textFont =font.Times;\n//fontFamily for Rich Text\
  \ only\nevent.target.textSize = 14;\n//Rich Text\nevent.target.richText = true;\n\
  event.target.alignment = \"center\";\n```\n\n但是，当您想要使用格式控制多个字段时，就需要回到文档 JavaScript\
  \ 中，再次使用`for ()`循环来格式化这些字段，或者在本例中，将这些属性添加到变量`f`中。\n\n这里我们可以看到如何将其添加到循环中以及最终结果。请参考图\
  \ 10-6 和文件`TMC_Customer Survey_End_Part2_global_format2.pdf`。再次，我使用了名为`fieldsRed`的文档\
  \ JavaScript，但在脚本中添加了更多格式。\n\n![](img/449379_2_En_10_Fig6_HTML.jpg)\n\n一个文档 JavaScript\
  \ 的截图，显示了脚本名称“fields red”的详细信息，以及页面右侧的一个“关闭”选项卡。其中包含几行代码，用于设置文本字段的字体和大小以及其他格式，后面跟着字段，以及客户的全名“John\
  \ Smith”和日期。\n\n图 10-6\n\nJavaScript 工具、“文档 JavaScript”对话框和字段\n\n```\n// Script\
  \ to set the font and size of text fields and other formatting\nfor (var i = 0;\
  \ i < numFields; i++) {\n// Get a reference to the current field\nvar f = getField(getNthFieldName(i));\n\
  // If it's a text field, set the font and font size and other formatting\nif (f.type\
  \ == \"text\") {\n//Field Fill\nf.fillColor = color.gray;\nf.strokeColor = color.red;\n\
  f.borderStyle = border.b;\nf.lineWidth = 2;\n//Fonts\nf.textColor = color.white;\n\
  f.textFont = font.Times;\n//f.fontFamily = [\"Times\",\"monospace\"];\nf.textSize\
  \ = 14;\nf.richText = true;\nf.alignment = \"center\"\n}\n}\n```\n\n**注：** 我们将在本章后面看到其他格式化示例，并解析\
  \ JavaScript 中的某些属性，包括什么是富文本格式。\n\n## 多行按钮\n\n您可能希望添加到表单中的另一种格式是使按钮的文本显示在两行或多行上。没有这种格式的按钮，当您在“选项”面板中输入标签时，文本通常只显示在一行上。没有自动的方法可以让文本分布在两行上，如图\
  \ 10-7 所示。\n\n![](img/449379_2_En_10_Fig7_HTML.jpg)\n\n一个包含文本“reset comments”的文本框截图。\n\
  \n图 10-7\n\n一个文本显示在一行上的重置按钮\n\n这个按钮会变得越来越长。一个办法是让文本变小。不幸的是，这样文本会变得难以阅读。您可以创建一个图标图形，但如果需要快速更改文本，文本将无法编辑。请参考图\
  \ 10-8，查看文件`TMC_Customer Survey_Start_Part2_global.pdf`中按钮`MyButton`的当前属性。\n\n![](img/449379_2_En_10_Fig8_HTML.jpg)\n\
  \n按钮属性的 2 个截图。1 中“外观”选项卡已展开，包含边框和颜色的详细信息，以及文本（包括颜色、粗细、样式、大小和字体）。2 中“选项”选项卡已展开，包含布局和行为的下拉菜单，以及图标和标签的详细信息。\n\
  \n图 10-8\n\n“按钮属性”对话框的“外观”和“选项”选项卡，显示标签“Reset Comments”\n\nJavaScript 再次提供了一个解决方案。请参考图\
  \ 10-9 和文件`TMC_Customer Survey_End_Part2_global.pdf`。\n\n![](img/449379_2_En_10_Fig9_HTML.jpg)\n\
  \n一个截图显示按钮属性，其中“动作”选项卡已展开。它有一个用于选择触发器和动作的下拉菜单，后面跟着一个动作列表和一个用于重置注释的文本框。它有一个用于 JavaScript\
  \ 编辑器的弹出窗口，其中包含一组 2 行代码，用于创建和编辑 JavaScript 脚本。\n\n图 10-9\n\n运行 JavaScript 以使按钮上的文本变为多行\n\
  \n除了使用“重置表单”动作来重置注释字段之外，这还为按钮添加了一个 JavaScript 脚本，在“鼠标释放”触发器上执行。\n\n以下是编辑器中的代码：\n\
  \n```\nthis.getField(\"MyButton\").buttonSetCaption(\"Reset\\n Comments\");\n```\n\
  \n只需这一行代码就能实现您所需的功能。在“常规”选项卡中调用按钮的名称`MyButton`，并告诉它您希望设置一个与“选项”选项卡上标签相同的标题。要将单词分成两行，请使用不可见字符`\\\
  n`。它的另一个名称是*元字符*。基本上，这意味着换行，因此单词*Comments*会移到第二行。当按钮需要多行文本时，这非常方便。\n\n**注：** 您可能已经注意到，在第\
  \ 9 章中创建警告框并需要换行时，您使用了元字符`\\n`。在第 11 章中，您将了解一些正则表达式，其中元字符可以与其他模式结合使用。\n\n\n\n##\
  \ 多行文本\n\n按钮并非唯一需要多行输入的字段。需要大量文本的字段（例如评论）也可以设置为多行。如果你已经掌握了表单基础知识，就会知道只需在“选项”选项卡中选中多行复选框，即可将文本字段设为多行。请参见图\
  \ 10-10 示例。\n\n![](img/449379_2_En_10_Fig10_HTML.jpg)\n\n文本字段属性截图，其中展开了“选项”选项卡。该选项卡包含一个用于对齐方式的下拉菜单，以及用于拼写检查和多行功能的复选框。下方有两个很小的文本框（此文本框文字过小），其后是三个复选框，分别用于拼写检查、多行和滚动长文本。\n\
  \n图 10-10\n\n在“选项”选项卡中，选中“多行”复选框，以便输入更多文本，然后勾选“滚动长文本”以获得滚动框。\n\n创建文本评论字段时，一旦字段被填满，其末尾会出现一个加号符号。请参见图\
  \ 10-10。\n\n对于评论，如果你希望在电脑上阅读，可以勾选“滚动长文本”复选框。\n\n虽然这便于在电脑上阅读，但打印时，你可能看不到框内包含的全部文本。\n\
  \n遗憾的是，Acrobat 没有可扩展的文本字段框。如果你的表单要求客户撰写冗长的陈述，而页面末尾的空间又很小，这就会成为一个问题。\n\n以下是解决方法：创建第二页，并允许文本流入第二个评论文本字段。\n\
  \n这次我们将不使用“操作”选项卡，而是在“格式”选项卡上添加自定义格式。请参见图 10-11。\n\n![](img/449379_2_En_10_Fig11_HTML.jpg)\n\
  \n文本字段属性截图，其中“格式”选项卡被高亮显示。该选项卡包含一个用于选择格式类别的下拉菜单，以及两个框，分别用于自定义格式脚本和自定义按键脚本。每个框在页面右侧都有一个“编辑”选项卡。\n\
  \n图 10-11\n\n已应用的“自定义按键脚本”设置\n\n你可以在文件 `TMC_Customer Survey_End_Part2_global.pdf`\
  \ 中查看示例。\n\n在第 1 页的第一个字段 `Comments1` 中（该字段已在“选项”选项卡中启用了“检查拼写”和“多行”功能，但禁用了“滚动长文本”，图\
  \ 10-10），我将以下代码放入“格式”选项卡（图 10-11）：\n\n**自定义格式脚本**\n\n```\nevent.target.textColor\
  \ = [\"RGB\",0,0,1];\n```\n\n我本不需要编写这行代码，但我想展示如何调整文本颜色，正如之前在帮助文本示例中看到的那样。我希望此 `textColor`\
  \ 与其他字段不同。因为我仅针对这一个字段，所以原本也可以直接在“外观”选项卡中设置。请参见图 10-12。\n\n![](img/449379_2_En_10_Fig12_HTML.jpg)\n\
  \n文本选项卡截图，其中包含一个字号下拉菜单（已选 12）、一个文本颜色框（已选蓝色），以及一个字体下拉菜单（已选 Helvetica）。\n\n图 10-12\n\
  \n“外观”选项卡显示已设置的字号、文本颜色和字体\n\n然而，在本章稍后部分以及第 11 章中，你将看到更复杂的示例，在这些示例中，这并非总是理想的做法；那时，使用\
  \ JavaScript 设置格式颜色会是更好的选择。\n\n**自定义按键脚本**\n\n```\nif ( event.fieldFull || event.willCommit\
  \ )\nthis.getField(\"Comments2\").setFocus();\n```\n\n此代码允许用户在字段中输入。当脚本检测到文本字段已满或即将提交时，它会将焦点移至名为\
  \ `Comments2` 的下一个文本框字段。`willCommit` 用于在数据提交前验证当前的按键事件。请参阅 [`opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html#willcommit`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html#willcommit)。\n\
  \n这里，正如在第 6 章中一样，我们再次看到了 `setFocus()` 的另一种用途——这次是将焦点移动到一个新字段。\n\n如果出于某种原因需要第三个框，你可以在\
  \ `Comments2` 框的“格式自定义按键脚本”中添加以下代码行：\n\n```\n//第二框转到第三框（如需要）\nvar t2=this.getField(\"\
  Comments2\");\nif (event.fieldFull)\n{\nthis.getField(\"Comments3\").setFocus();\n\
  }\n```\n\n此示例中的变量 `t2` 是可选的，因为我们是在 `Comments2` 字段（或者说在此“事件”中）操作，但在处理多个字段时，你可能希望引用该变量以跟踪当前所在的字段，或者只是添加注释（`//`）。\n\
  \n最后一个字段 `Comments3` 不需要任何 JavaScript，其“格式”选项卡可设置为“无”。请参见图 10-13。\n\n![](img/449379_2_En_10_Fig13_HTML.jpg)\n\
  \n文本字段属性页面截图，包含常规、外观、位置、选项、操作、格式、验证和计算等选项卡，其中“格式”选项卡被高亮显示。该选项卡有一个用于选择格式类别的下拉菜单，目前选中的是“无”。\n\
  \n图 10-13\n\n在“格式”选项卡中，类别被设置为“无”\n\n然后，你可以在“操作”选项卡上修改“重置评论”按钮，使其重置全部三个字段。\n\n此示例是一个很好的变通方案。但需注意：这种流转方法仅适用于直接向字段中键入内容。我发现粘贴文本并不总能自动流入第二个及后续的框中。在其他情况下，你可能更希望客户在评论（便签）中键入内容，然后稍后单独打印该评论。\n\
  \n\n\n## 使用复选框和文本字段实现复杂格式\n\n在图 10-14 中，您可以看到如何使用复选框进行加减评分。与单选按钮一样，这无需 JavaScript\
  \ 即可实现。请参阅文件 `TMC_Customer Survey_End_Part2b.pdf` 的第 1 页。\n\n![](img/449379_2_En_10_Fig14_HTML.jpg)\n\
  \n一个页面截图显示了 12 个用于描述已完成项目整体感受的复选框。其中一个已选中的选项写着：“我没有获得积极的体验”。右侧有两个高亮显示的最终结果框，一个值为\
  \ 0，另一个值为 -6。\n\n**图 10-14** – 根据评分改变选框字体样式和颜色的调查表\n\n您需要做的只是在“选项”选项卡中为复选框赋予正值或负值。请参考图\
  \ 10-15。\n\n![](img/449379_2_En_10_Fig15_HTML.jpg)\n\n两张复选框属性页面的截图显示有“常规”、“外观”、“位置”、“选项”和“操作”选项卡。图\
  \ 1 和图 2 中，“选项”选项卡被高亮显示，其中包含复选框样式的下拉菜单和导出值的输入框，第一个的导出值为 1，第二个为 -6。\n\n**图 10-15**\
  \ – “选项”选项卡中设置为正负导出值的复选框属性\n\n在文本字段 `Final Result_4` 的“计算”选项卡中，您可以使用求和（`+`）值将它们全部相加。请参考图\
  \ 10-16。\n\n![](img/449379_2_En_10_Fig16_HTML.jpg)\n\n一个页面截图显示了一个值为 0 的最终结果文本框。还有一个文本字段属性窗口，其中有\
  \ 8 个选项卡，“计算”选项卡被高亮显示。窗口中有两个选项，其中第二个“值”选项被选中，表示将某些字段的值进行求和。\n\n**图 10-16** – 在“文本字段属性”窗口的“计算”选项卡中将值设置为求和（`+`）\n\
  \n然而，有时您可能需要提醒自己评分即将变为负数。\n\n您可以先在“外观”选项卡上设置选框字段和文本的格式，而无需使用 JavaScript。但遗憾的是，如果数值从正数变为负数，其外观不会自动改变，除非您在“验证”选项卡部分添加条件脚本。请参考图\
  \ 10-17。\n\n![](img/449379_2_En_10_Fig17_HTML.jpg)\n\n一个文本字段属性页面的截图显示有“常规”、“外观”、“位置”、“选项”、“操作”、“格式”、“验证”和“计算”选项卡，其中“验证”选项卡被高亮显示。窗口中有两个关于字段值验证和范围的选项，以及几行用于自定义验证脚本的代码。\n\
  \n**图 10-17** – 带有自定义验证脚本的“验证”选项卡\n\n以下为代码：\n\n```\n//get negative number\nif (event.value\
  \ > 0){\n//for text color.black\nevent.target.textColor =[\"RGB\",0,0,0];\n// textFont\n\
  event.target.textFont = font.Times;\n//Size\nevent.target.textSize = 11;\n//for\
  \ field color.none\nevent.target.strokeColor = [\"T\"];\nevent.target.fillColor\
  \ = color.transparent;\n//left, center, right\nevent.target.alignment =\"left\"\
  ;\n}\nelse{\nevent.target.textColor = [\"RGB\",1,0,0];\n// textFont\nevent.target.textFont\
  \ = font.Helv;\n//Size\nevent.target.textSize = 14;\n//for field color.red\nevent.target.strokeColor\
  \ = [\"RGB\",1,0,0];\n//fill of field\nevent.target.fillColor = color.yellow;\n\
  // Borders 0=none, 1=thin, 2=medium, 3 = thick\nevent.target.lineWidth = 2;\n//\
  \ Border Style border.s= solid, border.b= beveled, border.d = dashed, border.i =\
  \ inset, border.u = underline\nevent.target.borderStyle = border.d;\n//left, center,\
  \ right\nevent.target.alignment =\"center\";\n}\n```\n\n虽然这乍一看可能很复杂，但实际上并非如此。您只是在数值变化时更改格式。请参考图\
  \ 10-18。\n\n![](img/449379_2_En_10_Fig18_HTML.jpg)\n\n一个页面截图显示有文字“最终结果 1”，随后是一个值为\
  \ -6 的最终结果框。该框带有虚线边框，且文字高亮显示。\n\n**图 10-18** – 文本和字段格式根据数值变化\n\n以下是简化的分解代码：\n\n\
  ```\nif (event.value > 0){\n// Change my formatting\n}\nelse {\n//Change my formatting\
  \ to something else\n}\n```\n\n当数值大于（`>`）0 时，请将字体、颜色和字段的格式更改为定义的样式。当数值小于（`<`）0 时，则将其更改为其他定义的样式。\n\
  \n在文本字段中可能受影响的格式属性及其示例如下：\n\n**填充颜色**或 `fillColor`：字段的填充色\n\n```\nevent.target.fillColor\
  \ = color.transparent;\nevent.target.fillColor = color.yellow;\n```\n\n**描边颜色**或\
  \ `strokeColor`：字段的描边\n\n```\nevent.target.strokeColor = [\"T\"]; // transparent\n\
  event.target.strokeColor = [\"RGB\",1,0,0]; // red\n```\n\n**边框宽度**或 `lineWidth`：字段的边框宽度\n\
  \n```\n// Borders 0=none, 1=thin, 2=medium, 3 = thick\nevent.target.lineWidth =2;\n\
  ```\n\n**边框样式**或 `borderStyle`：字段的边框样式\n\n```\n// Border Style border.s= solid,\
  \ border.b= beveled, border.d = dashed, border.i = inset, border.u = underline\n\
  event.target.borderStyle = border.d;\n```\n\n对于文本，您可以随后设置以下属性。\n\n**文本颜色**或 `textColor`：影响文本的颜色。您可以使用\
  \ `color.black` 或 `[\"RGB\",0,0,0]`。\n\n```\nevent.target.textColor = [\"RGB\",0,0,0];\n\
  event.target.textColor = [\"RGB\",1,0,0];\n//this is a red color\n```\n\n**文本字体**或\
  \ `textFont`：\n\n```\nevent.target.textFont =font.Times;\nevent.target.textFont\
  \ =font.Helv;\n```\n\n> **注意**：对于粗斜体、斜体或粗体字体样式，请使用如下方式：\n> \n> `event.target.textFont=font.TimesBI;`\
  \ 或 `font.HelvBI;`\n> \n> `event.target.textFont=font.TimesI;` 或 `font.HelvI;`\n\
  > \n> `event.target.textFont=font.TimesB;` 或 `font.HelvB;`\n> \n> 其他字体包括：`font.Times`（Times）、`font.Cour`（Courier）、`font.Symbol`（Symbol\
  \ 字体）和 `font.ZapfD`（Zapf Dingbats 字体）。其中一些字体在名称末尾添加 B、I 或 BI 后，可呈现粗体、斜体或粗斜体样式。\n\
  \n同样，如果您知道确切的字体名称，也可以使用字体系列来获取该字体。例如，在富文本上下文中，您可以像下面这样编写代码，以便根据用户计算机上可用的字体来更改字体。在此示例中，一旦在文档\
  \ JavaScript 中键入代码，您必须在“选项”选项卡中选中“允许富文本格式”复选框，如图 10-19 所示。\n\n```\nf = this.getField(\"\
  Text1\");\nstyle = f.defaultStyle;\n// If Times is not found on the user's system,\
  \ use a monospace font. The field must be set for Rich Text.\nstyle.fontFamily =\
  \ [\"Times\", \"monospace\" ];\nf.defaultStyle = style;\n```\n\n**文本大小**或 `textSize`：更改文本大小\n\
  \n```\nevent.target.textSize = 11;\nevent.target.textSize = 14;\n```\n\n**文本对齐**或字段内的对齐方式\n\
  \n```\n//left, center, right\nevent.target.alignment =\"left\";\nevent.target.alignment\
  \ =\"center\";\n```\n\n您不必在一个字段中使用所有这些属性。但是，在使用`if/else`条件语句时，您需要确保在大多数情况下都有开或关状态（当`if`格式如此，则`else`格式如彼）。\n\
  \n请注意，您可以使用相同的代码来影响在文本框中输入值的单选按钮，就像我在使用字段 `Final Result_3` 时所做的那样。我只是稍微更改了颜色。请参阅文件\
  \ `TMC_Customer Survey_End_Part2b.pdf` 的第 1 页。\n\n请记住，如果您像之前的示例中那样在 `for()` 循环中设置全局变量，则无需编写\
  \ `event.target`。相反，在创建变量后，您可以像这样直接应用属性：\n\n```\nf.alignment =\"center\";\n```\n\
  \n\n\n## 文本字段与评论的富文本格式\n\n还有其他格式，但这些都属于富格式范畴，即使你在文本字段中勾选了“富格式”，或者像下面这样通过 JavaScript\
  \ 设置：\n\n```\nevent.target.richText = true;\n```\n\n在使用某些 PDF 工具（例如注释或评论，但不包括没有额外脚本的表单字段）时，还可以使用以下一些其他格式：\n\
  \n**字体系列**或 `fontFamily`：可用于带有富文本的文本字段，但当你试图确保用户字体在所有电脑上都能像之前展示的那样相似显示时，它也可以用于一个数组（列出多种字体）。它还可以用于注释中的文本。\n\
  \n```\nstyle.fontFamily = [\"Times\", \"monospace\"];\n```\n\n**字体样式**或 `fontStyle`：有两种样式：正常和斜体。\n\
  \n```\nexample[0].fontStyle = \"italic\";\n```\n\n**字体拉伸**或 `fontStretch`：有几种样式可供选择：正常（默认）、超压缩、极压缩、压缩、半压缩、半扩展、扩展、极扩展和超扩展。\n\
  \n```\nexample[0].fontStretch = \"expanded\";\n```\n\n**字体粗细**或 `fontWeight`：它替代了粗体字的作用。正常指\
  \ 700 以下，粗体指 700 以上。可选值为 100、200、300、400、500、600、700、800 和 900。默认值为 400。它与字体拉伸结合使用时效果最好。\n\
  \n```\nexample[0].fontWeight = 400;\n```\n\n`strikethrough`：在文字上画一条线。值可以是 true 或\
  \ false。\n\n```\nexample[0].strikethrough = true;\nexample[0].strikethrough = false;\n\
  ```\n\n`subscript`：文本被设置为下标，字号减小，基线降低。\n\n```\nexample[0].subscript = true;\nexample[0].subscript\
  \ = false;\n```\n\n`superscript`：文本被设置为上标，字号减小，基线升高。\n\n```\nexample[0].superscript\
  \ = true;\nexample[0].superscript = false;\n```\n\n`underline`：文本被添加下划线。\n\n```\n\
  example[0].underline = true;\nexample[0].underline = false;\n```\n\n`rotation`：用于旋转字段或字段内的文本方向。此属性不常用。在向客户展示前，请务必先在\
  \ Reader 中测试，因为它可能产生意想不到的结果。你可能使用的数值取决于旋转角度，如 0、45、90、180 或 270。在文本字段中，如果需要旋转一个字段，请使用“常规”选项卡中名为“方向”的设置。\n\
  \n```\nevent.target.rotation = 0;\nevent.target.rotation = 90;\n```\n\n然而，有一种方法可以通过在文本字段中添加少量额外代码和一个数组来解决这个富格式问题。\n\
  \n对于文本字段，你可以在文本字段的“选项”选项卡中设置“允许富文本格式”。请参考图 10-19。\n\n![](img/449379_2_En_10_Fig19_HTML.jpg)\n\
  \n一张文本字段属性的截图，有 8 个选项卡，其中“选项”选项卡被高亮显示。它有一个用于对齐的下拉菜单、一个用于默认值的文本框，以及几个复选框，其中“拼写检查”和“富文本格式”已被选中。\n\
  \n图 10-19\n\n使用“选项”选项卡设置允许富文本格式的选项\n\n然后，在你的“格式”选项卡的“自定义格式脚本”字段中，添加以下 JavaScript\
  \ 以获取丰富值。请参考图 10-20。\n\n![](img/449379_2_En_10_Fig20_HTML.jpg)\n\n一张文本字段属性的截图，有常规、外观、位置、选项、动作、格式、验证和计算选项卡，其中“格式”选项卡被高亮显示。它有一个用于格式类别的下拉菜单，以及用于自定义格式脚本的选项，后面跟着一个包含文本和富格式的文本框。\n\
  \n图 10-20\n\n使用“格式”选项卡进行富文本的自定义格式化\n\n```\nvar str = event.value;\nif(event.value){\n\
  var RichFormat = new Array();\nRichFormat [0] = new Object();\nRichFormat [0].text\
  \ = str;\nRichFormat [0].fontStyle = \"italic\";\nevent.richValue = RichFormat;\n\
  }\nelse{\nevent.value =\"\";\n}\n```\n\n现在，你自己尝试将代码中的 `fontStyle` 替换为其他仅能通过富文本创建的选项，例如下划线（Underline）或删除线（Strike\
  \ Through）。\n\n或者，尝试通过向数组中添加元素来影响文本的某些部分。\n\n```\nvar str = event.value;\nif(event.value){\n\
  var RichFormat = new Array();\nRichFormat [0] = new Object();\nRichFormat [0].text\
  \ = \"$\";\nRichFormat [1] = new Object();\nRichFormat [1].text = str + \"$\";\n\
  RichFormat [1].fontStyle = \"italic\";\nevent.richValue = RichFormat;\n}\nelse{\n\
  event.value =\"\";\n}\n```\n\n你可以参考我的示例文件 `Rich_Text_example.pdf` 和 `example2.pdf`。\n\
  \n### 评论示例\n\n此时你可以回到第 8 章，处理评论和时间戳的示例。你在这里学到的大部分内容都可以应用到时间戳（它是一个文本字段）上，并且你可以回顾我在按钮的“动作”选项卡上使用的属性格式。请参考本章中名为\
  \ `Project_Comment_End_format2.pdf` 的示例文件。参见第 2 页。\n\n然而，对于“动作”选项卡上按钮的评论或注释，你可以在鼠标松开触发器中更新以下“运行\
  \ JavaScript”代码，该代码将添加和更改默认图标，并为评论中预设的文本添加颜色、对齐方式以及一些富文本格式。\n\n```\nvar annot =\
  \ this.addAnnot({\npage: this.pageNum,\ntype: \"Text\",\nauthor: \"John Smith\"\
  ,\npoint: [72,500],\npopupRect: [72, 500,6*72,500-2*72],\npopupOpen: true,\nnoteIcon:\
  \ \"Help\",\nstrokeColor: color.yellow,\nstrokeFill: color.red\n});\nvar spans =\
  \ new Array();\nspans[0] = new Object();\nspans[0].text = \"You're doing a great\
  \ job!\\r\";\nspans[0].textColor = color.blue;\nspans[0].textSize = 18;\nspans[0].textFont\
  \ = font.Helv;\nspans[0].alignment = \"left\";\nspans[1] = new Object();\nspans[1].text\
  \ = \"You have learned a lot!\\r\";\nspans[1].textColor = color.red;\nspans[1].textSize\
  \ = 20;\nspans[1].alignment = \"center\";\nspans[2] = new Object();\nspans[2].text\
  \ = \"This is the end of the comment.\";\nspans[2].textColor = color.green;\nspans[2].fontStyle\
  \ = \"italic\";\nspans[2].underline = true;\nspans[2].alignment = \"right\";\n//\
  \ Now give the rich field a rich value\nannot.richContents = spans;\n```\n\n请参考图\
  \ 10-21 了解它在评论窗格中的显示效果。文本中的代码 `\\r` 用于将文本格式化为换行。请注意，绿色在某些背景上可能不太清晰易读，因此在使用彩色文本和与有色觉障碍（如色盲或视力受限）的客户打交道时，需要留意这一点。另请注意，评论在被移动或压缩后，有时右对齐的文本会恢复为左对齐。\n\
  \n![](img/449379_2_En_10_Fig21_HTML.jpg)\n\n一张评论页面的截图，有一个带文本的框用于添加评论。它包含来自 John\
  \ Smith 的 3 行不同颜色文本的评论，时间为 10 小时 31 分，内容为：你做得很好，你学了很多，以及一条带下划线的“这是评论的结尾”。\n\n图 10-21\n\
  \n应用于评论的自定义格式\n\n你可以在此处找到其他类似的注释示例：\n\n[`https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html#annotation`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html#annotation)\n\
  \n\n\n#### 关于使用文本进行格式化的最终思考\n\n作为使用 `textFont` 进行格式化的最后一点说明，编写下面这行代码的另一种方式是\n\n\
  ```\nevent.target.textFont=font.Helv;\n```\n\n将实际名称放在引号中，就像这样：\n\n```\nevent.target.textFont=\"\
  Helvetica\";\n```\n\n在这里，样式通过连字符添加：\n\n```\nevent.target.textFont=\"Helvetica-Bold\"\
  ;\n```\n\n斜体的另一个名称是伪斜体（oblique），样式可以这样编写：\n\n```\nevent.target.textFont=\"Helvetica-Oblique\"\
  ;\n```\n\n两种样式通常可以合并在一起：\n\n```\nevent.target.textFont=\"Helvetica-BoldOblique\"\
  ;\n```\n\n对于不常见的名称，这里有更好的方法：\n\n```\nevent.target.textFont=\"MinionPro-Regular\"\
  ;\n```\n\n以下代码可以让您访问不太传统的样式：\n\n```\nevent.target.textFont=\"Arial-Black\";\nevent.target.textFont=\"\
  ArialNarrow\";\n```\n\n并非所有样式都使用连字符。请参考您电脑的控制面板区域，并搜索 *字体* 以获取正确的字体名称。例如，`MinionPro-Italic`\
  \ 写作为 `MinionPro-It`。当您双击字体进行预览并定位到预览框左上角的字体名称时，可以发现这一点。参考图 10-22。\n\n![](img/449379_2_En_10_Fig22_HTML.jpg)\n\
  预览框的屏幕截图显示，顶部有 Minion Pro It、OpenType 字样，其左侧有一个字母 A 的字体。接着是“打印”和“安装”两个选项，其中“打印”选项被选中。页面底部有一行文字，显示为：字体名称，Minion\
  \ Pro。\n\n图 10-22\n\n在代码中使用字体之前，请确切知道其名称\n\n当您输入错误的名称时，将无法获得所需的字体或字体样式。同时，请注意您客户的电脑可能没有安装所有专用字体，因此请坚持使用安全的名称，例如\
  \ `Times`、`Courier`、`Arial` 或 `Helvetica`，以避免文本字段出现字体问题。\n\n有关使用 `event.target`\
  \ 的进一步讨论，请参考第 16 章。\n\n## 静默打印\n\n需要使用什么样的 JavaScript 才能通过表单中的 `Print` 按钮打印文档中的单个页面或页面范围？\n\
  \n参考图 10-23 来了解如何使用按钮打印文档中的所有页面。也请回顾第 2 章。\n\n![](img/449379_2_En_10_Fig23_HTML.jpg)\n\
  按钮属性页面的屏幕截图显示了 5 个选项卡：常规、外观、位置、选项和动作，其中“动作”选项卡被选中。它有一个“添加操作”区域，带有下拉菜单用于选择触发器和动作，下方是一个动作列表。\n\
  \n图 10-23\n\n“动作”选项卡上的“执行菜单项”操作。选择 `文件` ➤ `打印` 以打印文档\n\n关于此表单的另一个特性，即文件 `TMC_Customer\
  \ Survey_End_Part2b.pdf` 中的静默打印。在大多数情况下，当您想在 Acrobat 中打印文档时，只需转到菜单并选择 `文件` ➤ `打印`。如第\
  \ 2 章所示，您可以通过按钮和“动作”选项卡来完成。但是，此操作会打印整个文档，这可能不是您想要的结果。也许您只想打印表单页面本身，这可能是一页或一个页码范围。参考图\
  \ 10-24。\n\n![](img/449379_2_En_10_Fig24_HTML.jpg)\n按钮属性页面的屏幕截图显示了 5 个选项卡：常规、外观、位置、选项和动作，其中“动作”选项卡被选中。它有一个“添加操作”区域，带有下拉菜单用于选择触发器和动作，其中“运行\
  \ JavaScript”操作被选中。\n\n图 10-24\n\n使用按钮和“动作”选项卡运行 JavaScript 以打印特定页面\n\n以下是可以用来在按钮的“动作”选项卡上执行操作的代码：\n\
  \n```\n// 静默打印当前页面\nthis.print(false, this.pageNum, this.pageNum);\n```\n\n当您将代码添加到按钮时，只有该按钮所在的页面会被打印。\n\
  \n如果用户收到如图 10-25 所示的消息，他们只需单击“是”按钮继续，或单击“否”取消打印。\n\n![](img/449379_2_En_10_Fig25_HTML.jpg)\n\
  Adobe Acrobat 的一个消息窗口屏幕截图。它有一条警告消息，内容为“此文档正尝试打印，是否允许？”，后面跟着“是”和“否”两个选项，其中“是”被选中。\n\
  \n图 10-25\n\n单击按钮时，Acrobat 弹出关于打印的警报消息\n\n当您需要打印此表单页面及其下方的页面时，将代码更改为以下内容：\n\n```\n\
  // 静默打印当前页面及其下方范围内的页面\nthis.print(false, this.pageNum, this.pageNum+1);\n```\n\n\
  如果范围内的页面更多，则 `this.pageNum+1` 变为 `this.pageNum+2`，依此类推。只需确保按钮下方的当前页面数量与您设置的范围相匹配，否则当您尝试打印时会出错。\n\
  \n再次强调，这就像是一个数组：\n\n```\nthis.pageNum (0) = 第 1 页\nthis.pageNum+1 = 第 2 页\nthis.pageNum+2\
  \ = 第 3 页\n```\n\n依此类推。\n\n> **注意**\n>\n> 请注意，在使用此代码时，您的客户可能已将其默认打印机设置为 Adobe PDF。如果是这种情况，他们将被带到“将文件另存为\
  \ PDF”对话框，并能够将文件保存为 PDF，以便稍后使用 `文件` ➤ `打印` 打印。如果不是，他们将直接发送到打印机。另一种选择是将代码中的设置从 `false`\
  \ 改为 `true`。这将允许打开 `打印` 对话框，用户便可以重置打印机并查看页码范围。\n\n\n\n## 使用电子邮件提交按钮的选项\n\n如果您或您的客户习惯使用\
  \ Adobe Acrobat 提交表单，本章讨论的最后一个主题是如何在 Acrobat 表单中添加用于电子邮件的提交按钮。请参考图 10-26。您可以在文件\
  \ `TMC_OrderForm_End_rollover_format_2.pdf` 中看到此按钮的示例。\n\n![](img/449379_2_En_10_Fig26_HTML.jpg)\n\
  \n一张带边框的突出显示按钮的截图。按钮内包含文字“提交”。\n\n图 10-26\n\n名为“提交”的发送电子邮件按钮\n\n以下链接也将为您提供有关如何编写代码的进一步帮助。请参考“mailDoc\
  \ 的 Doc 方法”部分。\n\n[`https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/doc.html`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/doc.html)\n\
  \n我将仅指出此类按钮的基本起始代码。您也可以参考我的文件，但需要用自己的代码替换其中的某些行。\n\n在本例中，对于提交按钮，您可以在“提交表单”对话框的“操作”选项卡上使用操作，而不是运行\
  \ JavaScript（本例中是在“鼠标释放”触发器上运行）。请参考图 10-27。\n\n![](img/449379_2_En_10_Fig27_HTML.jpg)\n\
  \n一张按钮属性对话框的截图，其中“操作”选项卡已被选中。它有一个“添加操作”的区域，带有下拉菜单用于选择触发器和操作，其中选择了“运行 JavaScript”操作。另外有一个\
