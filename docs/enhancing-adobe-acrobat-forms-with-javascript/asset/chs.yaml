  \ 1 页、第 2 页，以及分布和跟踪、高亮字段、排序选项卡和 Tab 键顺序。\n\n\n\n## 字段刷新\n\n字段可以留空且不激活，也可以包含脚本，在进入字段或点击触发器时启动相应操作。例如，字段可以执行菜单项或导入表单数据。在\
