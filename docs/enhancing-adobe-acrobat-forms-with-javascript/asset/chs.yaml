  \ Adobe InDesign 文件（`.indd`）的文件夹（如果你想编辑它们），以及一个包含原始脚本的文件夹（如果你想将它们添加到自己的 PDF 表单中）。\n\
  \n请记住，要查看字段的属性，你必须选择“准备表单”工具；只有这样，你才能右键单击或双击一个字段来查看其属性。\n\n![](img/449379_2_En_14_Fig1_HTML.jpg)\
  \  \n*图 14-1 —— PDF 文件中的弹出菜单示例*\n\n## 弹出菜单示例\n\n在本示例中，你将使用一个与 `if/else` 类似的条件语句。这个语句编写起来更简单，被称为\
  \ `switch case break` 或 `switch` 语句。与之前的示例一样，它非常适合用来遍历关联语法及其在方括号（`[]`）内的对象。首先，添加一个名为\
  \ `CloseWarning` 的文档级 JavaScript。请参考图 14-2。\n\n![](img/449379_2_En_14_Fig2_HTML.jpg)\
  \  \n*图 14-2 —— 对话框中含有关闭警告信息的文档级 JavaScript*\n\n现在，将以下 JavaScript 添加到编辑器中，或单击“编辑”以查看“结束”示例中的脚本：\n\
  \n```\n// 全局关闭警告\nfunction CloseWarning(){\n    var btn = app.alert(\"你确定要退出吗？\"\
  ,2,2);\n    if (btn == 4){\n        this.closeDoc();\n    }\n}\n```\n\n这段 JavaScript\
  \ 在下来菜单中创建了一个用于关闭文档的选项。根据你想让它在关联语法中出现的位置，它基于数字来确定。在本例中，我选择了 `4`，因为它是索引为 `0–4` 的列表中的第五个项目，但你可能需要在你的列表中调整这个数字。你还可以在第\
  \ 1 页的“操作”选项卡上，通过选择“鼠标释放”触发器和“运行 JavaScript”，将一个警报消息附加到按钮字段 `btn`。请参考图 14-3 查看“选项”和“操作”选项卡的设置。\n\
