  对话框中免费新闻通讯 PDF 文件的文档级 JavaScript


  我添加了以下代码：


  ```

  //Set Title Enteries

  var oArray = {

  Investment: [ ["-"], ["How to Make a Million in Mining"],

  ["Investing Wisely in Jade"], ["Playing the Market with Lead"],

  ["Investing in Bonds and Silver"]],

  Mining: [ ["-"], ["Gold Today"], ["Silver Futures"], ["Copper Watch"],["Stake the
  Claim"]],

  Gold:  [ ["-"], ["Global Annual Gold Festival"],

  ["Gold Watch"], ["All that Glitters"],

  ["Fool''s Gold"]],

  "Tourmaline Mining":  [ ["-"], ["Tourmaline Queen"],

  ["Waltermelon Gem"], ["Pick and Shovel"],

  ["Rocks and Gems"]],

  };

  function SetTitleEntries(){

  if(event.willCommit){

  var list = oArray[event.value];

  if( (list != null) && (list.length > 0) ){

  this.getField("ListTitles").setItems(list);

  }

  else{

  this.getField("ListTitles").clearItems();

  }

  }

  }

  ```


  请注意，如同之前的下拉列表示例一样，您使用了一个名为 `oArray` 的关联语法/对象，来包含 `cboNewsletters` 下拉字段中的所有下拉项，以及将放入名为
  `ListTitles` 的列表框字段中的子项。根据下拉列表中的选择，不同的子选择项会出现在列表框中。关联语法中的名称必须与“选项”标签中输入的下拉列表名称相匹配，这一点非常重要。这些名称是
  `Investment`、`Mining`、`Gold` 和 `Tourmaline Mining`。否则，可能会产生错误，并且这些字段将无法正常工作。务必仔细检查您的工作，以避免错误。


  与第 12 章一样，当关联语法中的名称由两个单词组成时，请务必为其加上引号，例如 `Tourmaline Mining`；如果是一个单词，则无需引号，例如 `Mining`。但是，将出现在方括号
  `[]` 中以及随后出现在列表框中的标题，无论何种情况都应用引号括起来。如果下拉列表中没有选中任何项目（或者在此情况下选择的是 `0`，在“选项”标签中由上横线
  `-` 表示），则列表框将被清空。


  复选框 `chkYes` 应用了一个脚本来显示和隐藏字段。您也可以使用无脚本操作来进行显示和隐藏。然而，在某些情况下，您需要编写 JavaScript 来确认在执行开启和关闭操作时，是否获得了期望的结果——在本例中，即当“选项”标签中的
  `event.target.value` 设置为 `Yes` 时。请参考图 13-17。


  以下代码添加在“操作”标签的“鼠标释放”事件上：


  ```

  //Check Box JavaScript

  var topicFld = this.getField("cboNewsletters");

  var clistT = this.getField("ListTitles");

  if (event.target.value == "Yes"){

  topicFld.display = display.visible;

  clistT.display = display.visible;

  }

  else {

  topicFld.display = display.hidden;

  clistT.display = display.hidden;

  }

  ```


