  \ 11-6。\n\n![](img/449379_2_En_11_Fig6_HTML.jpg)\n\n2 个单选按钮属性页面的截图，每个页面都有 5 个选项卡：`常规`、`外观`、`位置`、`选项`和`动作`。第一个截图包含用于名称、工具提示和通用属性的输入框。第二个截图包含用于按钮样式的下拉菜单和用于单选按钮选项的输入框。\n\
  \n\n\n### 图 11-6\n“常规”和“选项”选项卡中 `from.group` 内单选按钮的设置。唯一的区别是单选按钮的选择。\n\n在左侧，`from.group`\
  \ 单选按钮不包含任何操作。请参考图 11-7。\n\n![](img/449379_2_En_11_Fig7_HTML.jpg)\n\n这是一个单选按钮属性页面的截图，包含“常规”、“外观”、“位置”、“选项”和“操作”共\
  \ 5 个选项卡，其中“操作”选项卡处于选中状态。页面上有一个用于添加操作的框，其中包含下拉菜单，用于选择触发器和操作。\n\n### 图 11-7\n“操作”选项卡中\
  \ `from.group` 内单选按钮的设置。未应用任何操作。\n\n然而，`to.group` 单选按钮包含一个操作，因为它们是第二个选择，当该选择与第一个选择匹配时，可能会触发警告，也可能不会触发警告。在“鼠标释放”时，我选择了“运行\
  \ JavaScript”。请参考图 11-8。\n\n![](img/449379_2_En_11_Fig8_HTML.jpg)\n\n这是一个单选按钮属性页面的截图，包含\
  \ 5 个选项卡，“操作”选项卡处于选中状态。页面上有一个用于添加操作的框，其中包含下拉菜单，用于选择触发器和操作。还有一个用于 JavaScript 编辑器的弹出窗口，其中包含几行代码，用于创建和编辑\
  \ JavaScript。\n\n### 图 11-8\n“操作”选项卡中 `to.group` 内单选按钮的设置。该代码用于从 Checking 账户向 Checking\
  \ 账户转账。\n\n在我的“结束”示例中，我在 JavaScript 编辑器中键入了以下代码：\n\n```\n//to.group radio button\
  \ 1 checking\nvar rfrom = this.getField(\"from.group\");\nvar rtrans = event.target;\n\
  var msg = \"You cannot transfer funds from Checking to Checking\";\nif (rfrom.value\
  \ == \"checking\"){\napp.alert(msg);\nrfrom.value = \"\";\nrtrans.value = \"\";\n\
  }\n```\n\n这里有两个变量：`rfrom` 和 `rtrans`。第一个变量 `var rfrom` 代表整个单选按钮组 `from.group`。第二个变量\
  \ `var rtrans` 代表当前字段，该字段是 `to.group` 的一部分，并且选项为 checking。编写了一个警告消息变量，当两个选择完全匹配时，该消息会显示：\n\
  \n```\nvar msg = \"You cannot transfer funds from Checking to Checking\";\n```\n\
  \n一旦点击警告的“确定”按钮，`if` 语句还会重置这两个变量：\n\n```\nrfrom.value = \"\";\nrtrans.value = \"\
  \";\n```\n\n它们会重置为空白，就像从未被选中一样。\n\n> **注意：** 我在警告中使用了错误图标和“确定”按钮（图 11-3），如第 8 章所示。两者的代码都是\
  \ `0`，因此作为默认值，它们被省略在代码之外，但你可以编写 `app.alert(msg,0,0);`，效果是一样的。\n\n可以为 `to.group`\
  \ 中的 Savings 和 Money Market Pro 单选按钮编写类似的代码，如下所示：\n\n**Savings 代码**\n\n```\n//to.group\
  \ radio button 2 savings\nvar rfrom = this.getField(\"from.group\");\nvar rtrans\
  \ = event.target;\nvar msg = \"You cannot transfer funds from Savings to Savings\"\
  ;\nif (rfrom.value == \"savings\"){\napp.alert(msg);\nrfrom.value = \"\";\nrtrans.value\
  \ = \"\";\n}\n```\n\n**Money Market Pro 代码**\n\n```\n//to.group radio button 3 mm\n\
  var rfrom = this.getField(\"from.group\");\nvar rtrans = event.target;\nvar msg\
  \ = \"You cannot transfer funds from Money Market Pro to Money Market Pro\";\nif\
  \ (rfrom.value == \"mm\"){\napp.alert(msg);\nrfrom.value = \"\";\nrtrans.value =\
  \ \"\";\n}\n```\n\n在这种情况下，只有消息和 `rfrom` 的值发生了改变。\n\n如您所见，当两个字段的选择匹配时，可以触发一个警告。\n\
  \n但是请注意，在此文件中，如果您意外地先选择了与 `from.group` 同名的 `to.group` 单选按钮，则不会触发警告。如果您不确定客户将按什么顺序输入数据，这一点需要考虑。在这种情况下，为\
  \ `from.group` 中的每个单选按钮的“操作”选项卡（图 11-7）添加类似的 JavaScript 代码将是一个好主意。\n\n以下是 Checking\
  \ 的代码可能的样子；您可以通过更改变量名、字段、值和消息，将其改编为 Savings 和 Money Market Pro 单选按钮。请参考文件 `TMC_AccountTansfer_End_2.pdf`。\n\
  \n**对于 Checking 单选按钮：**\n\n```\n//from.group radio button 1 checking\nvar rto =\
  \ this.getField(\"to.group\");\nvar rtrans = event.target;\nvar msg = \"You cannot\
  \ transfer funds from Checking to Checking\";\nif (rto.value == \"checking\"){\n\
  app.alert(msg);\nrto.value = \"\";\nrtrans.value = \"\";\n}\n```\n\n**对于 Savings\
  \ 单选按钮：**\n\n```\n//from.group radio button 2 savings\nvar rto = this.getField(\"\
  to.group\");\nvar rtrans = event.target;\nvar msg = \"You cannot transfer funds\
  \ from Savings to Savings\";\nif (rto.value == \"savings\"){\napp.alert(msg);\n\
  rto.value = \"\";\nrtrans.value = \"\";\n}\n```\n\n**对于 Money Market Pro 单选按钮：**\n\
  \n```\n//from.group radio button 3 mm\nvar rto = this.getField(\"to.group\");\n\
  var rtrans = event.target;\nvar msg = \"You cannot transfer funds from Money Market\
  \ Pro to Money Market Pro\";\nif (rto.value == \"mm\"){\napp.alert(msg);\nrto.value\
  \ = \"\";\nrtrans.value = \"\";\n}\n```\n\n\n\n### 使用单选按钮的另一种方式（无警告弹窗）\n\n除了弹出警告窗口外，另一种防止客户误点错误单选按钮的方法是将某个单选按钮在其对立选项被选中时设为只读。这样做的问题在于，单选按钮是成组操作的，因此如果其中一个被设置为只读，组内的其他按钮也会同样变为只读，这并非你期望的结果。次优的选择是显示或隐藏选中的单选按钮，使客户没有机会点击它。该按钮会被完全移除，客户必须从剩下的两个转账选项中选择一个。此示例同样假设你的客户会按从左到右的顺序填写表单。请参考图\
  \ 11-9。\n\n![](img/449379_2_En_11_Fig9_HTML.jpg)\n\n一张页面截图，显示了一个包含两列的表格，用于填写发送方和接收方账户的详细信息。发送方账户有\
  \ 3 个按钮，分别对应支票账户、储蓄账户和货币市场专业账户，其中支票账户被选中。接收方账户有 3 个选项，但没有支票账户按钮。\n\n**图 11-9** 从可用选项中移除一个单选按钮\n\
  \n请参考文件 `TMC_AccountTransfer_End_show_hide.pdf` 查看实际效果。\n\n在本示例中，我从“操作”选项卡上名为 `to.group`\
  \ 的组中的所有单选按钮中移除了所有 JavaScript 代码，然后为 `from.group` 中的每个单选按钮应用了一段代码。\n\n对于“支票账户”按钮的“鼠标释放”事件，我选择了“运行\
  \ JavaScript”。\n\n```\n//checking\nvar checkingTo = this.getField(\"to.group.0\"\
  );\nvar savingsTo = this.getField(\"to.group.1\");\nvar mmTo = this.getField(\"\
  to.group.2\");\nif(event.target.value !=\"Off\"){\ncheckingTo.display = display.hidden;\n\
  savingsTo.display = display.visible;\nmmTo.display = display.visible;\n}\n```\n\n\
  你在第 9 章使用复选框来控制字段显示和隐藏时，见过类似的代码。然而，控制单选按钮的显示和隐藏操作起来要更棘手一些。它们喜欢使用 `if` 条件语句，但不使用\
  \ `else`，因为它们在一个组内联动，并非独立地进行显示和隐藏。另一个单选按钮需要设置下一个条件。\n\n因此，在这段针对“支票账户”单选按钮的代码中，我设置了每个按钮的所有变量。你可以通过在每个单选按钮的字段名后添加一个点和一个数字（类似于数组）来区分它们，此处数字为\
  \ 0 到 2。\n\n然后，在 `if` 条件语句中（当单选按钮被激活或不是“关”状态时），设置你想要显示或隐藏的字段。在此例中，我想隐藏其他“支票账户”单选按钮\
  \ `checkingTo`，因此我将其 display 属性设置为 hidden。\n\n接着，我将相同的代码添加到了 `from.group` 中的其他每个单选按钮上，并修改了代码中关于\
  \ display 的行。例如，对于 `savingsTo`，请查看以下代码中加粗的更改部分：\n\n```\n//savings\nvar checkingTo\
  \ = this.getField(\"to.group.0\");\nvar savingsTo = this.getField(\"to.group.1\"\
  );\nvar mmTo = this.getField(\"to.group.2\");\nif(event.target.value !=\"Off\"){\n\
  checkingTo.display = display.visible;\nsavingsTo.display = display.hidden;\nmmTo.display\
  \ = display.visible;\n}\n```\n\n然后，对于“货币市场专业账户”，当你在编辑器中粘贴代码时，只需更改前一段代码的如下部分：\n\n\
  ```\nif(event.target.value !=\"Off\"){\ncheckingTo.display = display.visible;\n\
  savingsTo.display = display.visible;\nmmTo.display = display.hidden;\n}\n```\n\n\
  最后，为了将所有单选按钮重置为可见状态，我在表单上使用了一个“重置”按钮，并选择了“重置表单”操作来重置所有字段。同时，我确保添加了“显示/隐藏字段”操作，并在“显示/隐藏字段”对话框中确保\
  \ `to.group` 单选按钮被设置为“显示”。请参考图 11-10。\n\n![](img/449379_2_En_11_Fig10_HTML.png)\n\
  \n一张按钮属性页面的截图，其中“操作”选项卡被选中，包含两个下拉菜单用于选择触发器和操作。它显示了一个“显示或隐藏字段”页面，包含“显示”和“隐藏”两个选项，其中“显示”被选中。页面左侧有若干选项，其中\
  \ `to.group` 被选中。\n\n**图 11-10** 使用“操作”选项卡和“显示/隐藏”对话框在重置时显示所有单选按钮\n\n请记住，在此示例中，如果你的客户在\
  \ `from.group` 之前先对 `to.group` 做出了选择，那么隐藏的单选按钮仍然会被选中。不过，字段的隐藏应该会促使你的客户在看到错误的选择消失后，选择其他可见的选项。或者，对于\
  \ `from.group` 中的每个单选按钮，你可以在底部的 `if` 条件语句中添加 `this.resetForm([“to.group”]);`。\n\n\
  ```\nif(event.target.value !=\"Off\"){\ncheckingTo.display = display.visible;\n\
  savingsTo.display = display.visible;\nmmTo.display = display.hidden;\nthis.resetForm([\"\
  to.group\"]);\n}\n```\n\n这样会重置或清空 `to.group`，以便你现在可以首先在 `from.group` 中输入正确的选项。如果你想查看此操作的示例，请参考文件\
  \ `TMC_AccountTransfer_End_show_hide_2.pdf`。\n\n\n\n## 使用单选按钮更改运费\n\n正如你在之前的项目中所见，复选框和单选按钮可用于调整文本框中的数值。我们来看另一个如何将其应用于价格的例子。请参阅文件\
  \ `InvoiceForm_Shipping_Change_End.pdf`，并参考图 11-11。\n\n![](img/449379_2_En_11_Fig11_HTML.jpg)\n\
  \n两张发票截图，每张截图上的折扣、总额、省税、联邦税、运费和总计数值均相同。第一页有 Loomis、UPS 和 FedEx 三个按钮，其中 Loomis 被选中。第二页选中了\
  \ FedEx 选项。\n\n图 11-11 — 使用单选按钮调整运费的发票表单\n\n这些数值会根据你的输入而变化。如果你选择不同的公司，比如 FedEx，运费会再次改变。请注意本节后面关于刷新字段的说明。\n\
  \n这是如何实现的？\n\n该表单的大部分设置与大多数发票表单类似，字段结合使用了数值和简化的字段表示法 (SFN)，很少用到 JavaScript。但是，此示例包含一个名为\
  \ `discount` 的新字段，以及左下角分组为 `shipChoice` 的单选按钮。\n\n`discount` 字段仅格式化为带有货币符号美元符号的数字，并未对其应用任何操作。请参考图\
  \ 11-12。\n\n![](img/449379_2_En_11_Fig12_HTML.jpg)\n\n文本框属性页面的截图，共有 8 个选项卡，其中“格式”选项卡被选中。它包含一个用于选择格式类别、小数位数、分隔符样式、货币符号、符号位置和负数样式的下拉菜单。\n\
  \n图 11-12 — `discount` 字段在“格式”选项卡上被格式化为数字\n\n然而，一旦你开始使用单选按钮，你将调用 `discount`、`Total`\
  \ 和 `Shipping` 字段。这些单选按钮构成一个组，每个按钮在“选项”选项卡上都有自己的选择。请参考图 11-13。\n\n![](img/449379_2_En_11_Fig13_HTML.jpg)\n\
  \n页面截图显示 `shipChoice` 的展开视图。它有 Loomis、UPS 和 FedEx 三个按钮。还有一个包含 5 个选项卡的单选按钮属性页面，其中“选项”选项卡被突出显示。它包括一个用于选择按钮样式的下拉菜单和一个用于输入单选按钮选项的框。\n\
  \n图 11-13 — 单选组 `shipChoice` 以及“选项”选项卡上的单选按钮属性\n\n“准备表单”工具右侧的“字段”面板显示了单选按钮的分组方式。然后，你在“操作”选项卡的“鼠标松开”触发器上为每个单选按钮添加\
  \ JavaScript。请参考图 11-14。\n\n![](img/449379_2_En_11_Fig14_HTML.jpg)\n\n单选按钮属性截图，包含“常规”、“外观”、“位置”、“选项”和“操作”5\
  \ 个选项卡，其中“操作”选项卡被选中。它有一个用于添加操作的框、一个用于选择触发器的下拉菜单，以及一个用于选择操作的框。\n\n图 11-14 — “操作”选项卡上的“单选按钮属性”对话框，其中操作为“运行\
  \ JavaScript”\n\n每个单选按钮都有类似的代码，如下所示：\n\n```\n//运费价格\nvar oShip = this.getField(\"\
  Shipping\");\nvar oSub = this.getField(\"Total\");\nvar oDiscount = this.getField(\"\
  discount\");\nif(oSub.value <200)\nvar oRate = (oSub.value - oDiscount.value)*.25;\n\
  else\nvar oRate =0;\noShip.value = oRate;\n```\n\n该代码的含义是：如果折扣前或折扣后的 `Total` 字段值小于\
  \ 200 美元，则添加运费（即 `Total * .25`）以得出运费价格。但是，如果价格超过 200 美元，或者即使有折扣（`else` 语句），运费也为\
  \ 0 美元，即免运费。\n\n请注意，`Total` 字段自身有一个计算，关联到一个名为“Sub total”的隐藏字段。添加此隐藏字段是为了在刷新单选按钮时，能够准确地将折扣计入运费和总计金额。请参考图\
  \ 11-15。\n\n![](img/449379_2_En_11_Fig15_HTML.jpg)\n\n一张发票截图，包含数量、价格、小计、折扣、税费、运费属性，以及一个隐藏的总计列。还有一个用于计算数值的文本框属性页面，后面跟着一个用于小计的简化字段表示法公式。\n\
  \n图 11-15 — 隐藏的 `subTotal` 文本框使用数值求和 (+) 来累加所有字段。然后 `Total` 字段在后面使用这些值，并通过单选按钮计算折扣，以得出实际的总计金额\n\
  \n如你所见，你可以像这样将这段 JavaScript 应用于“操作”选项卡上其他快递公司的单选按钮：\n\n```\nvar oShip = this.getField(\"\
  Shipping\");\nvar oSub = this.getField(\"Total\");\nvar oDiscount = this.getField(\"\
  discount\");\nif(oSub.value <200)\nvar oRate = (oSub.value - oDiscount.value)*.17;\n\
  else\nvar oRate =0;\noShip.value = oRate;\n```\n\n你可以将价格从这样：\n\n```\nvar oRate =\
  \ (oSub.value - oDiscount.value)*.17;\n```\n\n更改为这样：\n\n```\nvar oRate = (oSub.value\
  \ - oDiscount.value)*.13;\n```\n\n或者，你可以将金额限制从这样：\n\n```\nif (oSub.value <200)\n\
  ```\n\n更改为这样：\n\n```\nif (oSub.value <300)\n```\n\n这取决于快递公司的偏好。\n\n注意\n\n你也可以在代码的条件部分添加花括号（`{\
  \ }`）。\n\n```\nif(oSub.value <200){\nvar oRate = (oSub.value - oDiscount.value)*.17;\n\
  }\nelse{\nvar oRate =0;\n}\noShip.value = oRate;\n```\n\n注意\n\n在这个例子中，这是一个简单且不复杂的条件脚本，我省略了一些花括号对。JavaScript\
  \ 有时允许你这样做以简化代码。但是，在其他情况下，如果你省略了它们，可能会收到错误警告，或者脚本将无法正常运行。如果你不确定，或者希望保持代码的准确性，我建议在复杂的示例中保留花括号以避免混淆。正如你所见，`oShip.value\
  \ =oRate;` 这行代码位于条件语句之外，但如果没有花括号，你可能无法意识到这一点。如果你需要查看这段代码在每个单选按钮中是怎样的，请参考我的文件 `InvoiceForm_Shipping_Change_End_2.pdf`。\n\
  \n你为每个单选按钮添加的最后一个功能是，允许用户再次点击同一个单选按钮时重置/刷新运费，而不是必须点击另一个单选按钮（鼠标按下 ➤ 重置表单）。请仅为 `Shipping`\
  \ 字段勾选此选项。此外，在此示例中，我还为用户添加了一个便签注释，以便他们在填写表单时知道可以刷新运费。请参考图 11-16。\n\n![](img/449379_2_En_11_Fig16_HTML.png)\n\
