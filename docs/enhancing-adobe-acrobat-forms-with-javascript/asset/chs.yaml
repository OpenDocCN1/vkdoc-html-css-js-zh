  } // 结束自定义格式函数\n```\n\n\n\n#### 无价格脚本\n\n以下是无价格脚本：\n\n```javascript\nfunction PFCustom_Format2()\
  \ {\n// 需要应用自定义格式和按键事件的字段数组\nvar aFormatFields2 = new Array(\"Addition1\", \"Subtraction1\"\
