  \n```javascript\n//Submit to Supervisor button\nvar a = this.getField(\"supervisor\"\
  );\na.display = display.visible;\n```\n\n然后，我向该按钮添加了一个额外的鼠标松开时的显示/隐藏字段操作，以隐藏名为`employee1.resetForm`的按钮。\n\
