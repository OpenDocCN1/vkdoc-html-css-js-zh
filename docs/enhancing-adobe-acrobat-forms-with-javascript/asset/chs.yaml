- "# 15. 操作向导与 JavaScript\n\n第四部分包含一组额外的课程，我将其添加在书的末尾，面向那些更高级的 JavaScript 用户。\n\n\
  **本章目标：** 操作向导是 Adobe Acrobat Pro 中提供的另一个工具。借助它，你可以创建可以保存并随后在多个 PDF 文件中重复使用的任务或重复性操作（图\
  \ 15-1）。\n\n![](img/449379_2_En_15_Fig1_HTML.jpg)\n\n操作向导图标的截图，带有“添加”选项。下方包含子工具，例如新建动作、管理动作、更多动作\
  \ Web、新建自定义命令和管理自定义命令。\n\n图 15-1\n\n这些是您可以在“操作向导”工具菜单中找到的子工具\n\n\n\n## 使用动作向导\n\n\
  动作向导已预置了一些可用动作。然而，当您点击左上角的“新建动作”按钮时，会弹出“创建新动作”对话框，您可以通过从可用工具列表中选择一个工具来创建新动作，这些工具与您在“表单属性”对话框的“动作”选项卡中看到的类似。并且与该选项卡一样，当您从“转到”或“更多工具”部分选择`执行\
  \ JavaScript` 或`文档 JavaScript`时，可以创建 JavaScript 动作。\n\n**注意**\n\n如果您想跟随本课内容进行操作，或查看最终结果，请从引言中的链接下载第\
  \ 15 章的文档。您将找到一个包含原始脚本和`.sequ`文件的文件夹，如果您想将它们添加到自己的动作向导文件中，可以参考这些文件，稍后我会解释如何在管理动作时进行导入。对于这些示例，您可以使用我的两个代码略有不同的文件，命名为\
  \ `Watermark - Without PDF Extension.sequ` 和 `New Watermark-Without PDF Exentsion.sequ`，或者根据本章说明自行构建。\n\
