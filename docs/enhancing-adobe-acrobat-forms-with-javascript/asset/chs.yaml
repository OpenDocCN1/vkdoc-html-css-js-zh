  \ 的单选按钮示例，以及如何更改时间数据\n\n单选按钮和文本框也可以用于另一个类似的示例，你可能需要切换时间计算方式，特别是针对两个日期之间时间的毫秒转换做出某些更改。关于时间格式和日期格式，你可以参考第\
  \ 7 章。但是，在本示例中，请查看文件 `Acrobat Format Time_Date_radio_End.pdf` 和 图 11-17。\n\n![](img/449379_2_En_11_Fig17_HTML.jpg)\n\
  \n一张标题为“Acrobat 格式计算时间示例”的页面的屏幕截图，其中包含一个用于时间计算的表格，有 4 列，分别为格式、开始日期、结束日期和总计。它有几个用于选择时间单位的单选按钮，其中毫秒选项已被选中。\n\
  \n**图 11-17** 使用单选按钮更改右侧 `TotalDate` 字段中的时间转换\n\n本文档使用了一个全局文档级 JavaScript，以便我能够通过引用两个字段\
  \ `StartingDate` 和 `EndingDate` 的输入值的单选按钮来控制更改，然后总和会被添加到 `TotalDate` 字段中。\n\n在这个文档级\
  \ JavaScript 的示例中，我创建了一个名为 `TimeDateDiff` 的函数。请参考图 11-18。\n\n![](img/449379_2_En_11_Fig18_HTML.jpg)\n\
  \n一张屏幕截图显示了“文档 JavaScript”的添加选项。它有一个用于“文档 JavaScript”的弹出窗口，其中包含一个输入脚本名称的框，标记为“时间日期差”，后面跟着一组代码。页面右侧有几个选项，并且“关闭”选项已被选中。\n\
  \n**图 11-18** 将文档级 JavaScript 添加到文件中\n\nJavaScript 代码如下：\n\n```\nfunction TimeDateDiff(){\n\
  var sStart = getField(\"StartingDate\").value;\nvar sEnd = getField(\"EndingDate\"\
  ).value;\nvar dStart, dEnd, diff;\nif(sStart && sEnd) {\ndStart = util.scand(\"\
  mm/dd/yyyy HH:MM:ss tt\", sStart);\ndEnd = util.scand(\"mm/dd/yyyy HH:MM:ss tt\"\
  , sEnd);\nif ( dEnd < dStart)  {\napp.alert ( \"结束日期必须在开始日期之后，不能在此之前。\");\nevent.value\
  \ = \"\";\nthis.resetForm([\"StartingDate\", \"EndingDate\"]);\n}\nelse{\nvar TimeCov\
  \ = getField(\"Time\").value;\n//diff = (dEnd.getTime() - dStart.getTime())/86400000;\n\
  diff = (dEnd.getTime() - dStart.getTime())/TimeCov;\nevent.value = diff;\n}\n}\n\
  else\n{\nevent.value = \"\";\n}\n}\n```\n\n这段代码与第 7 章中的代码类似。但是，这次我是从一个名为 `Time`\
  \ 的单选按钮组中获取我的时间计算值。请参考图 11-19。\n\n![](img/449379_2_En_11_Fig19_HTML.jpg)\n\n一张页面的屏幕截图，其中有\
  \ 6 个用于选择时间单位的单选按钮，包括周、天、小时、分钟、秒和毫秒，并且毫秒选项已被选中。页面右侧是时间按钮的展开视图，带有 6 个不同的数值。\n\n**图\
  \ 11-19** 单选按钮组 `Time` 及其值\n\n这些按钮不包含任何 JavaScript；但是，我已在“选项”选项卡上为单选按钮选项设置了它们的值。请参考图\
  \ 11-20。\n\n![](img/449379_2_En_11_Fig20_HTML.jpg)\n\n一张单选按钮属性页面的屏幕截图，其中有 5 个选项卡：常规、外观、位置、选项和操作，其中“选项”选项卡已被选中。它有一个用于选择按钮样式的下拉菜单、一个用于输入单选按钮选项的框，以及两个用于按钮的复选框。\n\
