  \ 的“导航面板”/“缩略图”区域访问。图层也是如此。\n\n## 可能间接影响便签或标记工具的其他非表单操作\n\n最后，我要在这里以及稍后的第 8 章（关于时间戳）中指出的一个问题是，非表单或表单按钮，当用自定义\
  \ JavaScript 进行编程时，可以设置为更改已放置注释或图章的外观。但是，虽然图章、注释、标记工具和测量工具在右键点击时确实具有你可以访问的属性，但它们没有\
  \ `Actions` 选项卡。因此，如果没有先通过按钮或表单字段应用某个间接触发器，它们本身无法应用任何操作。\n\n\n\n## 动作触发器\n\n在从“动作”选项卡选择动作之前，首先要选择一个触发器。\n\
  \n`触发器 + 选择动作 = 你想要的结果`\n\n数字表单中最常用的触发器是`鼠标弹起`，如图 4-24 所示。\n\n![](img/449379_2_En_4_Fig24_HTML.jpg)\n\
  \n页面截图显示有五个选项卡，分别为常规、外观、位置、选项和动作，其中动作选项卡已被选中。其中包含一个添加动作的区块，带有一个用于选择触发器的下拉菜单。该菜单有多个选项，其中“鼠标弹起”选项被选中。\n\
  \n**图 4-24** 可选择的各类动作触发器\n\n以下是对此触发器的说明，以及您可能会遇到的几个其他动作：\n\n- **鼠标弹起**：当鼠标单击后释放按钮时触发。这是最常用的按钮触发器，因为它让用户有最后一次机会将指针拖离按钮，从而不会激活该动作。\n\
  - **鼠标按下**：当鼠标按钮被按下（未释放）时触发。在大多数情况下，`鼠标弹起`是首选的触发器，因为按下时不给用户任何改变主意的机会。虽然对于带有复选框的按钮来说这可能不太明显，但此触发器可能反应过快。\n\
  - **鼠标进入**：当指针进入字段或播放区域时触发。\n- **鼠标退出**：当指针离开字段或播放区域时触发。\n- **接收焦点时（仅限媒体剪辑）**：当链接区域通过鼠标操作或按\
  \ Tab 键获得焦点时触发。这也称为`获得焦点`。\n- **失去焦点时（仅限媒体剪辑）**：当焦点移动到另一个链接区域时触发。这也称为`失去焦点`。\n\n\
  书签和超链接是例外情况；它们没有可用的触发器。假设您会用鼠标或手指点击链接，并执行跳转到该页面或 URL 的动作。然而，如前所述，页面确实具有页面打开时或页面关闭时的可选触发器。\n\
  \n有关其他媒体剪辑触发器的更多详细信息，请参考以下 Adobe 页面：[`https://helpx.adobe.com/acrobat/using/applying-actions-scripts-pdfs.html`](https://helpx.adobe.com/acrobat/using/applying-actions-scripts-pdfs.html)。\n\
  \n## 选择无需编码的动作\n\n有许多动作可供您选择。如图 4-25 所示，一旦您选择了触发器，就可以设定当您单击`添加`按钮时执行所选动作。退出对话框后，应用于该按钮的动作将使您能够跳转到另一个页面或打印文档中的所有页面等。\n\
  \n![](img/449379_2_En_4_Fig25_HTML.jpg)\n\n页面截图显示有五个选项卡，其中动作选项卡被选中。其中包含一个添加动作的区块，带有两个下拉菜单，一个用于选择触发器（已选中“鼠标弹起”选项），另一个用于选择动作（已选中“执行菜单项”选项）。\n\
  \n**图 4-25** 可选择的各类动作\n\n稍后您将了解一些特定动作。不过，请先花点时间回顾一下一些可选动作，如下所列：\n\n![](img/449379_2_En_4_Fig26_HTML.jpg)\n\
  \n页面截图显示“文章”下方的选项以及文章 1 的图标。它有一个弹出窗口，用于选择文章，其中包含一个文章标题列表，文章 1 已被选中。弹出窗口底部有一个“确定”按钮。\n\
  \n**图 4-26** “选择文章”对话框及 PDF 中的文章缩略图\n\n- **执行菜单项**：执行指定的菜单命令作为动作。此区域至少有 50 个菜单项选项。\n\
  - **转到 3D/多媒体视图**：跳转到指定的 3D 视图。这些 3D 注释视图必须已存在于文档中。这更适用于处理非表单按钮。\n- **转到页面视图**：跳转到当前文档中指定的目标位置。使用滚动条、鼠标和缩放工具选择目标视图，然后按对话框中的`设置链接`按钮来创建链接目标。\n\
  - **导入表单数据**：从另一个文件导入表单数据，并将其放入当前活动表单中。所选文件为`FDF`格式。\n- **多媒体操作（Acrobat 9 及更高版本）**：对文件中的多媒体对象或注释执行指定动作（例如播放声音文件）。必须先向文件中添加多媒体对象，然后才能在对话框中为其指定动作。\n\
  - **打开文件**：启动并打开与 PDF 位于同一文件夹中的链接文件。如果您分发的 PDF 文件包含指向另一个文件的链接，读者需要拥有该链接文件的原生应用程序才能成功打开它。您可能需要以注释等形式添加关于目标文件打开首选项的信息。\n\
  - **打开 Web 链接**：跳转到互联网上指定的 URL 目标。您可以使用 `HTTP`、`HTTPS`、`FTP` 和 `mailto` 协议来定义链接。\n\
  - **播放声音**：播放指定的 `WAV` 或 `AIFF` 格式的声音文件。该声音以跨平台格式嵌入到 PDF 文档中。\n- **播放媒体（兼容 Acrobat\
  \ 5、Acrobat 6 及更高版本）**：播放指定以 Acrobat 5 或 6 兼容格式创建的 `QuickTime` 或 `AVI` 影片。指定的影片必须嵌入在\
  \ PDF 文档中。如果文档中没有此类媒体，则不会创建该动作。\n- **阅读文章**：遵循活动文档中的文章线索或文章框。它们使用`编辑 PDF` 工具创建。要执行此动作，左侧窗格的文章缩略图中必须存在一篇文章。选择`视图\
  \ ➤ 显示/隐藏 ➤ 导航窗格 ➤ 文章`。请参考图 4-26。\n\n![](img/449379_2_En_4_Fig27_HTML.jpg)\n\n动作页面截图显示有鼠标进入和鼠标退出两个选项，每个选项都有显示或隐藏字段的操作。鼠标进入的第一个选项被选中。页面底部有四个按钮，其中“删除”按钮被选中。\n\
  \n**图 4-27** 设置显示和隐藏字段动作顺序的示例\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您的格式要求，将给定的英文文本翻译成中文。\n\
  \n\n- **重置表单**：清除表单中先前输入的数据。您可以通过“选择要重置的字段”对话框来控制要重置的字段，如第 2 章所示。\n\n- **运行 JavaScript**：运行指定的\
  \ JavaScript。这需要 JavaScript 执行一些自定义操作，这些操作需在“JavaScript 编辑器”中输入。\n\n- **设置图层可见性**：确定哪些图层设置处于活动状态。在添加此操作之前，请为当前状态指定适当的图层设置。这将与图层属性配合使用，我们将在本章后面看到。\n\
  \n- **显示/隐藏字段**：在 PDF 文档中切换显示或隐藏某个字段。此选项在表单字段中特别有用。例如，如果您希望鼠标指针悬停在按钮上时弹出一个对象，您可以设置一个操作，在“鼠标进入”触发器上显示一个字段，并在“鼠标离开”时隐藏该字段。请注意，在这种情况下，您的“操作”选项卡上将存在两个操作。然后，您需要将操作在列表中上下移动，如果需要更正，还需要逐一编辑它们。请参考图\
  \ 4-27。\n\n![](img/449379_2_En_4_Fig28_HTML.jpg)\n\n“提交表单选择”页面的截图。它有一个用于输入链接 URL\
