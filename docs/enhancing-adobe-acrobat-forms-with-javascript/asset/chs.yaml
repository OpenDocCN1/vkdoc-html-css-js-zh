  \ Web 表单，我们将在下一工具中看到这一点。\n\n\n\n## 什么是网页表单？\n\n另一个直接涉及表单的工具是新建“创建网页表单”工具。网页表单类似于我们之前创建的“请求电子签名协议”表单。它们需要签名，并且这些表单可以嵌入到你的网站中，或通过电子邮件中的链接发送，以便多人可以访问该表单或文档。我们无需使用\
  \ Acrobat Pro 构建整个表单，而是可以继续在 Acrobat 主页上在线构建它。现在，我们将简要概述网页表单的创建过程。这使你能够将表单添加到网站，并共享链接以在线收集数据。当你在未选定特定表单的情况下选择“创建网页表单”选项时，也可以通过“准备表单”工具访问此区域。请参见图\
  \ 20-27。\n\n![](img/449379_2_En_20_Fig27_HTML.jpg)\n\n一张窗口截图，显示了“创建网页表单”和“准备表单”图标。它提供了通过将表单添加到用户网站并共享链接以在线收集数据来创建网页表单的选项。“在\
  \ Web 应用中打开”按钮处于选中状态。\n\n**图 20-27**\n\n你可以使用“准备表单”工具中的此选项，或从工具本身开始，从头创建一个网页表单。\n\
  \n如果你已登录账户，当你点击此工具或“在 Web 应用中打开”按钮时，它将带你进入 `acrobat.adobe.com`，你可以在此上传你之前创建的现有表单之一。请参见图\
  \ 20-28。\n\n![](img/449379_2_En_20_Fig28_HTML.png)\n\n一个页面标题为“创建网页表单”，并显示了向网页表单添加文件的第一步。其中包含以下内容：表单名称、添加文件、需要完成表单的参与者、以及添加密码。\n\
  \n**图 20-28**\n\n创建网页表单及相关设置。\n\n首先，你可以为表单命名。请参见图 20-29。\n\n![](img/449379_2_En_20_Fig29_HTML.jpg)\n\
  \n一张用于填写表单名称的空白字段截图。字段中较浅颜色的文字为“time sheet”。\n\n**图 20-29**\n\n通过命名开始创建网页表单。\n\n\
  然后，你从电脑中选择要添加的一个或多个文件。请参见图 20-30。\n\n![](img/449379_2_En_20_Fig30_HTML.jpg)\n\n\
