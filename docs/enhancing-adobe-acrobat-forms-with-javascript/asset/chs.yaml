  \n**图 20-21**\n\n在测试文件上启动电子签名请求。\n\n根据您单击的按钮，这两个选项的布局和顺序略有不同。因此，这里提供一些进一步资源的链接，以便您在您的`Acrobat\
  \ Pro`版本外观与我的略有不同时，继续此流程：\n\n-   [`https://helpx.adobe.com/acrobat/using/creating-distributing-pdf-forms.html`](https://helpx.adobe.com/acrobat/using/creating-distributing-pdf-forms.html)\n\
  -   [`https://helpx.adobe.com/acrobat/using/send-for-signature.html`](https://helpx.adobe.com/acrobat/using/send-for-signature.html)\n\
  \n单击“下一步”（图 20-21）后，您将进入下一步，指定填写和签名的位置。也可以通过之前找到的名为“指定签名位置”的按钮访问此相同步骤。然后，您将继续处理表单，根据需要调整收件人设置并添加和编辑字段。可以右键单击字段，然后从弹出菜单中选择“编辑”选项。接着，单击右侧面板中的“发送”按钮进行发送，并跟踪进度以及接收确认通知。这将创建一种\
  \ Web 表单协议，您可以在您的`Adobe Acrobat`主页上根据需要取消和在线删除它，或继续在线编辑。它们也可以作为模板保存，用于其他项目。我们将在本章后面部分更详细地研究其中一些与在线使用\
  \ Web 表单编辑字段相关的步骤。您在下一节中学到的内容也可以应用于“请求电子签名”工具。请参考图 20-22。\n\n![](img/449379_2_En_20_Fig22_HTML.jpg)\n\
  \n> 屏幕截图显示签署文档的第二步。它呈现一份员工信息表，带有管理员签名选项，并列出签名字段下的下拉菜单，其中包含签名、缩写、签名块和印章选项。底部有一个选中的“发送”按钮。\n\
  \n**图 20-22**\n\n在测试文件上启动电子签名请求，并指定填写和签名的位置以及审核字段。\n\n如果需要在不保存更改的情况下进行编辑，可以单击此工具右上角的“关闭”按钮。\n\
  \n如前所述，诸如“填写和签名”和“证书”之类的工具通常与常规的`Acrobat`表单一起使用以完成签名过程。但是，也有一些新的相关工具，例如“创建 Web 表单”（我们接下来将简要介绍），以及其他在线选项，如“批量发送”、“添加电子签名品牌”和“收款”。请参考图\
