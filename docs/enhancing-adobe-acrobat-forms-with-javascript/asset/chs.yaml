  ```\n\n### 单选按钮和复选框的格式设置\n\n有关确切的编码说明，请参阅第 10 章。与文本框一样，你可以设置 `strokeColor`、`fillColor`、`lineWidth`、`borderStyle`、`textSize`\
  \ 和 `textColor`。但是，不能使用任何富文本格式，也不能设置 `textFont`，因为它已设置为默认的 Adobe Pi 字体。不过，你可以使用文档\
  \ JavaScript 更改复选框或单选按钮的样式。请参见图 11-25，了解这些选项在“选项”选项卡上是如何显示的。\n\n![](img/449379_2_En_11_Fig25_HTML.jpg)\n\
