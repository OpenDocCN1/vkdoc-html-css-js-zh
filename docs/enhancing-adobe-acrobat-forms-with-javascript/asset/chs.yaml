  \ JavaScript 编辑器中的代码\n\n以下是 `this.mailDoc()` 的代码和消息窗口。在这种情况下，如果您要抄送某人，您需要编辑电子邮件地址，以及编辑主题行和消息内容。\n\
  \n```javascript\nthis.mailDoc({\nbUI: false,\ncTo: \"tmcZZZ@gmail.com\",\ncCC: \"\
  JSmith2289@gmail.com\",\ncSubject: \"我的文档\",\ncMsg: \"John，附件是我最新的 PDF 表单。\"\n});\n\
  ```\n\n注意\n\n根据 Adobe 的说法，在 Windows 上，客户端计算机必须将其默认邮件程序配置为支持 MAPI 才能使用此方法。\n\n然后，您需要单击“确定”关闭\
  \ JavaScript 编辑器，关闭“属性”对话框，并关闭“准备表单”工具。保存您的文件并测试按钮。\n\n当用户单击“提交”按钮时，将弹出一个标题为“发送电子邮件”的对话框。请参考图\
  \ 10-28。\n\n![](img/449379_2_En_10_Fig28_HTML.jpg)\n\n一张发送电子邮件页面的截图。它有两个发送选项：使用默认电子邮件应用程序或使用网络邮件，其中第一个选项被选中。有一个复选框用于记住选择。页面底部有“继续”和“取消”按钮，并且“继续”按钮被选中。\n\
  \n图 10-28\n\n“发送电子邮件”对话框\n\n然后，用户为“发送方式”设置选择电子邮件类型，可以是“默认电子邮件应用程序 (Microsoft Outlook)”，也可以是“使用网络邮件”，例如\
  \ Gmail 或用户可以设置并记住选择的其它账户。请参考图 10-29。\n\n![](img/449379_2_En_10_Fig29_HTML.jpg)\n\
  \n两张添加新 Gmail 账户和网络邮件账户页面的截图。第一张有一个输入电子邮件地址的框，后跟一个示例，以及一个“确定”按钮。第二张有用于输入电子邮件地址、密码、传入\
  \ IMAP、传出 SMTP 的框，以及一个“添加”按钮。\n\n图 10-29\n\n用户可以通过各种对话框选择并设置自己的网络账户\n\n添加电子邮件地址并点击“继续”（图\
  \ 10-28）后，如果是 Gmail 账户，Adobe Acrobat 会要求您登录您的账户，然后会在所选账户的指定草稿文件夹中创建一条消息。\n\n对于 Microsoft，如果您的账户已设置好，用户将看到一条新消息，其中已附加了\
  \ PDF 文件，并且主题行和消息内容也已设置好。他们只需编辑消息并发送 PDF 文件即可。\n\n请注意，如果文档中只需要少量签名，并非所有客户都愿意使用此流程提交表单。在这种情况下，使用\
  \ Adobe Sign 创建和分发用于电子签名的电子表单并要求在线签署可能更好。如果您同时处理多个客户且每个客户都需要相同的表单，这可能更高效。我们将在第 19\
  \ 章和第 20 章中进一步讨论电子签名。\n\n## 本章小结\n\n如您所见，有许多有用的方法可以通过 JavaScript 自定义表单以满足您的需求。\n\
  \n- 自定义文本\n- 字段\n- 用于添加注释、打印和通过电子邮件发送表单的按钮\n\n正如您在本章中所见，有许多选项可用于格式化表单字段和非表单项目。有时使用自定义格式，而其他时候“验证”选项卡是更好的选择。您可以全局添加\
  \ JavaScript 以影响多个字段，或使用“操作”选项卡仅影响单个字段。我建议在进入第三部分之前花些时间回顾本章。将其中一些 JavaScript 添加到您自己的表单中，并发现富文本如何改变您的字段以及注释。\n\
  \n在第二部分的大部分内容中，您主要学习了如何向文本字段、按钮和复选框添加 JavaScript。然而，正如您将在第三部分中看到的，一旦您开始向单选按钮、复选框、下拉列表和列表框添加\
  \ JavaScript，PDF 表单可能会变得复杂。\n\n"
