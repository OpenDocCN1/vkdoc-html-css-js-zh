  \n如果您将诸如 `5` 和 `10` 这样的数字输入到 `Object1MoreComplex` 和 `Object2MoreComplex` 字段中，那么在\
  \ `TotalMoreComplex` 字段中应该得到以下答案：\n\n* `(5*2) + (10-7) = 13`\n\n请注意，当您已经在一个文本字段中输入了数字时，除法运算效果最好。\n\
  \n但是，您可能会注意到，使用 SFN 来计算最小值或最大值这样的运算要复杂一些，因此我让这些字段保留了未计算的状态。\n\n\n\n## JavaScript\
  \ 自定义计算脚本\n\n我们将介绍的最后一种方法是自定义计算脚本，它位于 Acrobat 计算选项卡示例页面的第三部分。图 6-8 显示了选中 `TotalSum_3`\
  \ 字段的“编辑”按钮后的“自定义计算脚本”。\n\n![](img/449379_2_En_6_Fig8_HTML.jpg)\n\n自定义计算脚本复选框的屏幕截图，其中包含几行代码，后面跟着一个用于创建和编辑\
  \ JavaScript 的“JavaScript 编辑器”对话框。该对话框包含两个表格，其列分别为“示例”、“对象 1”和“对象 2”以及“总计”，并且表格\
  \ 1 的第 2 到第 4 列条目已被选中。\n\n**图 6-8** 在“计算”选项卡中输入自定义计算脚本\n\n要将此代码输入编辑器，必须首先单击**编辑**按钮。然后即可输入代码。完成后，单击**确定**退出。随后，单击“属性”对话框上的**关闭**按钮，接着单击**预览**按钮并测试表单。\n\
  \n就 JavaScript 而言，你会再次看到代码设置方式上的相似之处和不同之处。要将字段转换成 JavaScript 语言，你需要使用变量来保存这些字段。变量充当信息容器。在\
  \ JavaScript 中，`variable` 这个词使用其缩写形式 `var`。在 `var` 后面添加一个名称。\n\n在本例中，为简单起见，我们使用名称\
  \ `a`。这个名为 `a` 的变量将保存输入到文本字段 `Object1Sum_3` 中的任何值。变量首次命名后，就不需要再附带 `var` 这个词，并且可以在脚本中的任何位置直接使用\
  \ `a`。为了确保输入的数字能正确传递，需要添加 `this.getField`，它的意思是“获取此字段中的数据”，在本例中是从字段 `Object1Sum_3`\
  \ 中获取。将字段名称放在圆括号 `()` 和直引号 `\"\"` 中。在变量的末尾，使用分号 (`;`) 表示该变量语句的结束。\n\n对第二个变量 `b`\
  \ 重复相同的步骤，它使用字段 `Object2Sum_3`。它们是你要用来为当前字段 `TotalSum_3` 计算最终输入值的两个字段。\n\n```javascript\n\
  var a = this.getField(\"Object1Sum_3\");\nvar b = this.getField(\"Object2Sum_3\"\
  );\n```\n\n这是脚本的最后一部分：\n\n```javascript\nevent.value = a.value + b.value;\n```\n\
  \n这与 SFN 示例类似。但是，你需要在每个变量的末尾添加 `.value`，以提醒 Acrobat 你希望获取每个字段的值，并将最终值相加得到最终字段的结果。在最终字段\
  \ `TotalSum_3` 中，加法运算发生的事件结果就是最终值。需要注意的是，最终字段不需要变量名，因为 Acrobat 将脚本包含在了最终字段的内部。同样，用分号结束这一行。\n\
  \n同一个脚本的另一种变体是，如果你不想分别编写变量，可以将它们合并起来，写成这样：\n\n```javascript\nevent.value = this.getField(\"\
  Object1Sum_3\").value + this.getField(\"Object2Sum_3\").value;\n```\n\n然而，当涉及更多变量，或者你在计算中多次使用某个字段时，这是编写代码的最佳方式吗？或者，更好的做法是将所有变量集中放在一处，以便在需要快速更改代码中表单字段的名称时能够方便地访问？\n\
  \n例如，哪一个更易于修改？\n\n```javascript\nevent.value = ((this.getField(\"Object1Sum_3\"\
  ).value + this.getField(\"Object2Sum_3\").value)) * ((this.getField(\"Object1Sum_3\"\
  ).value - this.getField(\"Object2Sum_3\").value));\n```\n\n或者写成这样：\n\n```javascript\n\
  var a = this.getField(\"Object1Sum_3\");\nvar b = this.getField(\"Object2Sum_3\"\
  );\nevent.value = (a.value + b.value) * (a.value - b.value);\n```\n\n就变量的命名而言，变量名可以长于一个字母（比如\
  \ `a`）。你可以赋予它们更具含义的名称，例如 `age` 或 `sum`。在最终示例中，可以这样写：\n\n```javascript\nevent.value\
  \ = age.value + sum.value;\n```\n\n但是，请确保将代码前面部分的变量改为 `var age` 和 `var sum`，以便代码能够正常运行。\n\
  \n以下是在 Acrobat Pro 中使用变量时需要记住的其他几点：\n\n- 所有 JavaScript 变量必须使用唯一的名称进行标识。\n- 字段名称可以包含字母、数字和下划线。\n\
  - 变量名必须以字母开头，但你引用的字段以数字开头是可以的。\n- 名称区分大小写（`y` 和 `Y` 是不同的变量）。\n- 保留字（如 JavaScript\
  \ 关键字）不能用作名称。最好不要创建像 `var event` 这样的变量，因为 `event` 是在最终事件中使用的 JavaScript 关键字。例如，`event.value\
  \ = age.value + event.value;` 可能无法正常工作，因为 `event.value` 已经被使用过一次。\n- 如前所述，与 SFN\
  \ 一样，确保你的变量以及通常的字段名保持为一个单词，而不是多个分开的单词。但是，只要字段名放在直引号内，包含空格也是可以的。\n- 如果你使用的是现代 JavaScript，请注意不能将声明\
  \ `var` 替换为 `let`，否则会遇到错误。请仅使用 `var`。\n- 在 `value`、`SFN` 和“自定义计算脚本”按钮选项之间切换时需要谨慎。当你选择其他选项时，将会清除你刚刚输入的代码，因此工作时要始终将\
  \ JavaScript 代码备份在 `.txt` 文件中。此外，如果不小心删除了代码，请不要保存我的“End”文件；只需不保存更改直接关闭即可。\n\n> **注意：**\
  \ 另外请记住，在编写包围字段名的引号时，如果你需要更大的空间，可以使用 Notepad++ 或 Dreamweaver 之类的程序来编写代码，如第 5 章所述。像\
  \ MS Word 这样的程序可能会尝试将双引号替换成对话中使用的引号（也称为*弯引号*），而你应该使用“中性”或直引号。这可能会混淆 Acrobat JavaScript\
  \ 编辑器，导致错误并使你无法退出对话框。\n\n至此，如果你需要一些关于“计算”选项卡的基础知识，可以参考此页面：\n\n[`helpx.adobe.com/acrobat/using/manage-form-field-properties.html`](https://helpx.adobe.com/acrobat/using/manage-form-field-properties.html)\n\
  \n\n\n## 关于“计算”选项卡的最终思考\n\n让我们回顾一下。您已经了解了三种加法运算方式：`value`、`SFN` 以及 JavaScript 自定义计算脚本。那么，哪一种适合您的项目呢？您是否在所有情况下都需要使用\
  \ Acrobat JavaScript？\n\n在大多数简单的计算项目中，我建议在表单的不同部分使用 `value` 或 `SFN`。但是，如果您已经查看了文件\
  \ “Acrobat Calculate Tab Examples ”中的“End”示例，您会发现 `value` 和 `SFN` 并不能同等地解决所有问题。`value`\
  \ 不能进行减法或除法运算。`SFN` 无法找出最小值或最大值。在这种情况下，您可能必须在表单中组合使用这两种计算方法。\n\n**注意**\n\nJavaScript\
  \ 可以完成所有这些计算以及许多其他计算。此外，正如您将在第 12 章中看到的，当 JavaScript 变得更复杂时，将 `value` 和 `SFN` 与\
  \ JavaScript 混用并不总是一个好主意，因为这可能导致某些字段无法正确响应。一致的编码方法对于表单计算的顺畅运行至关重要。另请参阅本章后面的“设置字段计算顺序”部分。\n\
  \n例如，在 `FieldTotalMinimum_3` 字段中，我使用了以下自定义计算脚本：\n\n```javascript\nvar q = this.getField(\"\
  Object1Minimum_3\");\nvar r = this.getField(\"Object2Minimum_3\");\nevent.value=Math.min(q.value,r.value);\n\
  ```\n\n您可以使用 JavaScript 数学公式 `Math.min` 来获取最小值，这与使用 `value` 的示例类似。您可以使用 `Math.max`\
  \ 来获取最大值。还有一些其他数学公式无法通过 `value` 或 `SFN` 使用，但可以通过 JavaScript 实现：\n\n*   `Math.abs(x)`：返回\
  \ `x` 的绝对值。\n\n*   `Math.acos(x)`：返回 `x` 的反余弦值（以弧度为单位）。但是，您应输入一个介于 -1 和 1 之间的数字以避免引发错误。在本书的后续部分，您可能会希望进一步探索使用“验证”选项卡设置限制的方法。\n\
  \n*   `Math.asin(x)`：返回 `x` 的反正弦值（以弧度为单位）。但是，您应输入一个介于 -1 和 1 之间的数字以避免引发错误。\n\n*\
  \   `Math.atan(x)`：返回 `x` 的反正切值，其数值介于 -PI/2 和 PI/2 弧度之间。\n\n*   `Math.atan2(y,x)`：返回其参数商的反正切值。\n\
  \n*   `Math.ceil(x)`：返回 `x` 向上取整后的最接近整数。\n\n*   `Math.cos(x)`：返回 `x` 的余弦值（`x` 以弧度为单位）。\n\
  \n*   `Math.exp(x)`：返回 `E`^`x` 的值，其中 `E` 是欧拉数。\n\n*   `Math.floor(x)`：返回 `x` 向下取整后的最接近整数。\n\
  \n*   `Math.log(x)`：返回 `x` 的自然对数（底数为 `E`）。\n\n*   `Math.PI`：给出圆周率 ∏ 的公式。\n\n*  \
  \ `Math.pow(x,y)`：返回 `x` 的 `y` 次幂的值。\n\n*   `Math.random()`：返回一个介于 0 和 1 之间的随机数。\n\
  \n*   `Math.round(x)`：将 `x` 四舍五入到最接近的整数。示例：向上舍入小计金额。\n\n*   `Math.sin(x)`：返回 `x`\
  \ 的正弦值（`x` 以弧度为单位）。\n\n*   `Math.sqrt(x)`：返回 `x` 的平方根。\n\n*   `Math.tan(x)`：返回一个角度的正切值。\n\
  \n您可以在以下页面查看和测试许多其他 `Math` 对象：\n\n```\nhttps://www.w3schools.com/jsref/jsref_obj_math.asp\n\
  https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Math\n\
  ```\n\n在这种情况下，`x` 或 `y` 应写为 `(x.value)` 或 `(x.value,y.value)`。\n\n### 用于显示零的 JavaScript\
  \ 脚本验证\n\n没有 JavaScript，您在表单中无法做到的最后一件事是格式化数字 0。有时在表单上，如果前两个字段没有添加任何计算，您不希望显示 0，而希望它保持空白。请参见图\
  \ 6-9。\n\n![](img/449379_2_En_6_Fig9_HTML.jpg)\n\n一张包含两列表格的截图，示例列为对象 1、对象 2 和总计。其中包含选中了“验证”选项卡的文本字段属性页面的截图，随后是\
  \ 3 个复选框，其中“运行自定义验证脚本”复选框被选中，并附有几行代码。\n\n**图 6-9** — 在“总计”字段的“验证”选项卡中添加验证脚本。添加脚本前后的对比。\n\
  \n这样看起来更好。如果需要参考，请查看 `TotalSum_3` 字段的“验证”选项卡，并参见图 6-9。\n\n除了“计算”选项卡脚本之外，您还可以在“验证”选项卡中输入以下内容：\n\
  \n```javascript\n// 文本字段的自定义验证脚本\nif (event.value == 0) event.value = \"\";\n```\n\
  \n在文本字段 `TotalSum_3` 中，这个脚本以一条注释开头，解释了我们正在做什么。\n\n双斜杠（`//`）始终用于开始注释。注释可以写在 JavaScript\
  \ 的任何位置，并且不会影响计算。可以将它们视为有用的提醒。\n\n这是另一种可用于编写较长、段落式注释的方法：\n\n```javascript\n/* 这种类型的注释适用于大段文本\
  \ */\n```\n\n不过，由于 Acrobat 提供的空间较小，我通常更喜欢使用 `//`。\n\n\n\n#### 最后一行代码\n\n这就是所谓的*条件语句*，稍后你将详细了解它。本质上它表示：“如果另外两个字段未输入任何值或只输入了零（两者均为空或都包含零），则最终值字段也留空。”\n\
  \n```\nif (event.value == 0) event.value = \"\";\n```\n\n**最后一点：** 如果在减法或带负数的加法中使用了此脚本，并且需要看到\
  \ 0（例如：`5-5=0`），你可能看不到这个 `0`。如果只有在字段填写完整时才需要显示 0，你可以使用更复杂且更严格的验证。\n\n`==` 并非严格相等运算符比较。像\
  \ `5-5=0` 这样的结果可能无法正常显示，`0-0=0` 或 `0x5=0` 也可能无法正常工作，因为该验证将 `0` 和空白字段视为相同。\n\n`===`\
  \ 是严格相等运算符比较，因此现在像 `5-5=0`、`0-0=0` 或 `0x5=0` 这样的结果都能正常工作，因为验证将 `0` 和空白字段视为*不*相同，并会在结果字段中放入一个\
  \ `0`。你可以编写以下代码来保留这个 `0`：\n\n```\nif (event.value === 0) event.value = \"\";\n```\n\
  \n然而，Acrobat 似乎表现怪异，无法达到预期的效果，即当一个值字段已添加但另一个尚未输入值时，最终字段保持空白。请参考图 6-10。\n\n![](img/449379_2_En_6_Fig10_HTML.jpg)\n\
  \n三个文本框的截图。框 1 的值为 0.00，框 2 无输入，框 3 的值为 0.00。\n\n图 6-10\n\n验证在这些字段中未能按预期工作\n\n因此，这是你可以在我的文件\
  \ `AcrobatCalculateTabExamples_End_option2validate.pdf` 中看到的替代代码：\n\n```\n//求和验证，确保实际计算结果中的\
  \ 0 不会缺失\nif (a.value !== a.defaultValue && b.value !== b.defaultValue) {\nevent.value\
  \ = a.value*1 + b.value*1 ;\n} else {\nevent.value =\"\" ;\n}\n```\n\n这段代码允许你在其他字段没有数值时将字段留空。但是，如果两个字段都输入了零值（`&&`），即使最终结果为\
  \ `0`，它也会保留这个 `0`。在此例中，你使用了 `!==`（严格不等于），它与严格相等运算符比较 `===` 类似，但作用相反，它将当前值与默认值进行比较。如果最初在其他两个值字段中均未找到值（即默认值），则\
  \ `event.value` 将保持空白。此示例中的数值先各自乘以 1，然后再相加。注意你使用了另一个条件语句 `if/else`。请参考图 6-11。\n\n\
  ![](img/449379_2_En_6_Fig11_HTML.jpg)\n\n两个包含 4 列表格的截图，例如对象 1、对象 2 和总计，两表的第 1 列输入均为求和。表\
  \ 1 的第 2 列输入为 0，其他列为空。表 2 的第 2 列和第 3 列值为 0，第 4 列值为 0.00。\n\n图 6-11\n\n当两个字段都有值时，验证在这些字段中按预期工作\n\
  \n有关其他相等与不等运算符及比较，请参考以下页面：\n\n[`https://www.w3schools.com/js/js_comparisons.asp`](https://www.w3schools.com/js/js_comparisons.asp)\n\
  \n[`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators)\n\
  \n注意\n\n在减法示例中，请转到“验证”选项卡，将名为 `TotalSubtract_3` 的 PDF 字段中的以下代码：\n\n`event.value\
  \ = a.value*1 + b.value*1;`\n\n更改为：\n\n`event.value = f.value*1 - g.value*1;`\n\n\
  为了使代码正确运行，“验证”选项卡上的变量值必须与整个代码中“计算”选项卡上的变量值匹配，因此请参考该字段的选项卡进行比较。例如，在代码中，必须将 `a.value`\
  \ 变量替换为 `f.value`，将 `b.value` 变量替换为 `g.value`。对于以 `a.defaultValue` 或 `b.defaultValue`\
  \ 结尾的变量，同样的变量替换也适用。\n\n查看完表单后，点击预览右上角的“关闭”按钮以关闭“准备表单”工具。如果不确定此按钮的样子，请参考第 1 章的“表单审查”部分。仅当你进行了编辑时，才保存“开始”文件的副本。\n\
  \n##### 下拉列表替代方案\n\n如第 2 章所述，在此示例中，你可以将一些文本字段替换为下拉列表用于计算。虽然它们与文本字段类似，但我发现如果你希望客户使用非常特定的值，这种方法是一个很好的替代方案；它消除了对每个下拉列表进行验证的需要，因为值已经预设好了。你不应将最后的文本字段（只读）替换为下拉列表。尽管“验证”和“计算”选项卡确实适用于下拉列表，但最终结果实际上只有一个值。在第\
  \ 12 章中，你将看到如何在需要时使用 JavaScript 将多个结果放入一个下拉列表中。请参考图 6-12。\n\n![](img/449379_2_En_6_Fig12_HTML.jpg)\n\
  \n一个包含 4 列表格的截图，例如对象 1、对象 2 和总计。它有 7 行，分别用于和、积、差、商、平均值、最小值和最大值。对象 1、对象 2 和总计的列输入均为\
  \ 0。\n\n图 6-12\n\n使用下拉列表填充字段进行计算\n\n注意\n\n对于下拉列表，我将“验证”选项卡上的“字段值未经验证”字段留空，因为我使用的是特定数值。与文本字段不同，下拉列表始终有值，绝不会出现空值。请参考本章文件夹中包含下拉列表的文件\
  \ `AcrobatCalculateTabExamples_End_option2DDown.pdf`。\n\n#### 设置字段计算顺序\n\n稍后，当你使用多个需要进行计算的字段时，可以使用“准备表单”工具右侧的选项，从“更多”列表中设置字段计算顺序。请参考图\
  \ 6-13。\n\n![](img/449379_2_En_6_Fig13_HTML.jpg)\n\n一个显示“更多”工具图标、随后是“准备表单进行电子签名”图标以及“设置字段计算顺序”选项卡的截图。它有一个对话框，其中包含计算字段的选项列表，当前选中了“总和计算”。\n\
  \n图 6-13\n\n从“更多”菜单打开的“计算字段”对话框\n\n当更多字段包含计算或被其他字段访问时，如果你发现某个计算未按你期望的顺序出现，能够通过在列表中向上或向下移动字段来设置顺序至关重要。这也是检查是否遗漏了某些本应使用“计算”选项卡的字段的好方法。在后续章节中构建更复杂的表单时，请将这一点与“显示选项卡编号顺序”功能牢记在心。\n\
  \n\n\n## 重置焦点字段\n\n在表单或任何一组表单字段中进行计算时，可能会遇到需要重置字段的情况。此外，您可能希望表单用户点击重置按钮后，能返回到特定字段；通常这是表单中的第一个字段。这可以通过\
  \ JavaScript 实现。重置后，光标会被放置在活动字段中，用户就可以开始再次输入，而无需面对所有字段都处于非激活状态、不知从哪个字段开始输入的困扰。\n\
