  \ `Ctrl/Cmd++` 或 `Ctrl/Cmd+-`，以及 `视图 ➤ 缩放` 菜单。\n\n## 重置按钮和打印按钮的基本操作触发器\n\n按钮可以添加许多基本操作，你将在第\
  \ 4 章及后续章节中看到。不过，本节课我们重点介绍表单中常用的两个操作：`重置`和`打印`操作。如果需要跟着操作，请查看 `TMC_Customer Survey_End.pdf`\
  \ 文件的第 1 页。\n\n\n\n### 重置按钮\n\n如果客户在多个字段中填错了信息，或者希望清除整个表单，而不必逐个选中每个字段再按下`Delete`或`Backspace`键，那么在表单中添加一个`清除`或`重置`按钮会很有帮助。图\
