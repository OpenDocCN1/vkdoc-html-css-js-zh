  \ 20-20 和图 20-21。\n\n![](img/449379_2_En_20_Fig20_HTML.png)\n\n> 列表的屏幕截图展示了以下图标下的编辑选项：对齐、居中、匹配大小和分布，以及更多工具选项。它显示“字段”选项下的列表，其中“请求电子签名”按钮已被选中。\n\
  \n**图 20-20**\n\n也可以在表单编辑模式下启动电子签名请求。\n\n最初，您将进入“填写和签名”工具。但是，添加收件人并单击“更多选项”按钮后，您将进入“请求电子签名”工具。请参考图\
