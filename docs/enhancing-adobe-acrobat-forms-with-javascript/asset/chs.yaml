  \n**图 18-12**\n\n格式类别设置为“无”\n\n为什么会这样？\n\n要使表单正常工作，在这种情况下，你需要刷新格式。每个函数只需要执行一次，这样访问其函数的其他字段（使用关联语法）才能正常工作。如果你对函数进行了重大更改，请始终记住需要刷新才能影响其他字段。例如，选择一个你确信属于`PFCustom_Format`函数的字段，在本例中是一个带有价格符号的字段。例如字段`Addition0`。选择“格式”选项卡上的“自定义”，而不是“数字”格式类别。请参考图\
