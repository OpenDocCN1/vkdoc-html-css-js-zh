  \n在第 4 页，你可以看到通过选择一个具有数字值的单词，“最终结果”文本字段会获取该信息，并将其与已计算的值相加或求平均值。\n\n## 结合文本字段使用复选框或单选按钮进行求和与求平均值\n\
