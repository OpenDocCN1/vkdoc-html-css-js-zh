  \ Acrobat`工具。包括：请求电子签名、填写和签名、准备表单、证书、创建 Web 表单、批量发送、添加电子签名品牌和收款。\n\n**图 20-23**\n\
  \n“表单和签名”部分中的工具概览。\n\n在“准备表单”工具中处理表单时，如果任何时候您发现这不是您想要创建的表单类型，请使用右侧的“更多”下拉菜单，恢复到像过去章节中那样创建`Acrobat`表单。请参考图\
