  \n**图 20-40** 在右侧窗格中查看各种字段选项。\n\n## 在表单中使用 JavaScript\n\n那么，这种表单是否允许你使用 JavaScript\
  \ 呢？\n\n虽然在你上传或添加表单时，最初似乎无法编写任何自定义的 JavaScript 或代码，但一旦表单上线并进入“准备表单”阶段，你可以通过右键单击单个字段，然后从弹出菜单中选择该选项来进行编辑，就像你之前使用“请求电子签名”工具时一样。然后，你可以设置各种验证设置以及参与者可能需要填写的条件，以完成表单。请参考图\
  \ 20-41。\n\n![](img/449379_2_En_20_Fig41_HTML.png)\n\n一张“总工时”字段下编辑选项的截图。其中第 1 行显示为：分配给、字段类型、值类型、默认值、工具提示、验证、条件、外观和工具，并突出显示了\
  \ `OK` 按钮。\n\n**图 20-41** 右键单击字段并选择“编辑”即可查看该字段的属性。\n\n当你从弹出菜单中选择 `Edit` 时，其他选项包括\
  \ `Copy`、`Clone` 和 `Delete`。\n\n选择“编辑”选项后，你可以设置属性。这些属性可能包括设置验证或各种类型的条件，这些条件会导致字段显示、隐藏、启用或禁用。你还可以在“工具”选项卡上调整字段的外观，以复制、克隆或删除某个字段选项。请参考图\
  \ 20-42。\n\n![](img/449379_2_En_20_Fig42_HTML.png)\n\n一张验证设置下的截图，其中有一个下拉列表，并突出显示了\
  \ `None`。还包括条件和外观的设置。\n\n**图 20-42**\n\n\n\n## 文本字段可用的各种属性\n\n然而，在计算示例中上传 Acrobat\
