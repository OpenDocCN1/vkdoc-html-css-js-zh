  > 在本书中，你看到过使用 `event.value`、`event.target.value` 甚至 `event.target.textColor` 的例子。什么时候适合使用
  `event.target` 或者仅仅使用 `event`？对于 `event.value`，它代表文本字段的新输入值，这个值总是在变化；但当我们说 `event.target.value`
  或 `event.target.textColor` 时，我们正在定位一个属性，该属性现在将代表字段的当前或设定值。这可以应用于单选按钮或复选框的情况，其中已经设置了导出值为开或关，然后被调用。例如，如果我们想在某个特定复选框的**鼠标释放**触发器上改变其颜色（基于开或关状态），我们会使用以下
  JavaScript 代码。

  >

  > ```

  > if (event.target.value !="Off"){

  > event.target.fillColor=color.red;

  > }

  > else{

  > event.target.fillColor=color.green;

  > }

  > ```

  >

  > 使用 `event.target.textColor`，你可以通过条件语句改变属性。当状态为开（非 Off）时，颜色为红色；当状态为关（Off）时，颜色为绿色。但在另一个涉及文本字段的例子中，输入文本总是在变化，你可以将字段设置为**数字格式**，然后在**验证**选项卡上添加以下自定义验证代码，以便在数字为负数或正数时将其颜色从黑色切换为红色。这里我们使用了
  `event.value`：

  >

  > ```

  > event.target.textColor = event.value < 0 ? color.red : color.black;

  > ```


  学习何时使用 `event.target.value` 的最佳方法是参考 Acrobat 在线参考文档，并尝试本书中的不同示例。




  在我们的项目中继续推进，随着每次点击满足一个`if/else`条件，您将切换至下一状态，并循环回到初始状态。


