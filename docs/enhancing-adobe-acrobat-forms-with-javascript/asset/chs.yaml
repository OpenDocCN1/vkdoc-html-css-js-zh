  \n图 19-18\n\n条形码字段属性位于“准备表单”工具中。当你选择条形码字段时，可能会看到此处显示的警报。你可以在“值”选项卡的“自定义计算脚本”字段中添加或编辑\
  \ JavaScript。\n\n条形码的 JavaScript 在“操作”或“值”选项卡中输入。与其他表单字段不同，条形码字段没有“外观”选项卡，因此不允许使用\
  \ `.type` 格式化或通过脚本进行复制。更改条形码的类型需要在“选项”选项卡的符号系统中进行；但是，如果你考虑在文档或表单中添加与非表单相关的二维码或条形码，请参考本书的第\
  \ 3 章。请参考图 19-19。\n\n![](img/449379_2_En_19_Fig19_HTML.png)\n\n一个显示“选项”选项卡的条形码字段属性对话框。使用的符号系统是插入二维码。解码条件是文档或手持扫描仪。底部有一个带有标签“条形码\
  \ 1”的二维码。\n\n图 19-19\n\n“条形码字段属性”对话框的“选项”选项卡，符号系统选项设置为二维码\n\n你可以在 [`https://helpx.adobe.com/acrobat/using/pdf-barcode-form-fields.html`](https://helpx.adobe.com/acrobat/using/pdf-barcode-form-fields.html)\
  \ 找到关于 Acrobat PDF 条形码的更多信息。\n\n## 本章小结\n\n在本章中，你了解了使用文本字段、复选框、单选按钮、签名域和条形码的基本安全性。带有\
  \ JavaScript 的签名域可用于基本的安全目的；然而，除非与其他安全 ID 和证书结合使用，否则它们并非最安全的 PDF 选项。正确使用条形码需要条形码读取器或扫描仪。\n\
