- '# 3\. 创建二维码自定义图章


  **章节目标：** 在本章中，您将使用 Adobe Acrobat 的图章工具创建一个自定义的二维码图章。


  您可能已经打开并查看过包含图章、批注以及客户修改和批准的 PDF 文件。实现这些批注查看功能的应用程序很可能是 Adobe Acrobat Reader 或 Acrobat
  Pro。对许多计算机用户而言，Reader 已成为行业标准，仅仅因为它是一个任何人都可以在 macOS 或 Windows 平台上下载的免费软件。


  当您与客户一起审阅文件时，Acrobat Pro 允许您查看 PDF 文档并添加批注。


  如第 1 章所述，Acrobat Pro 还允许您使用“准备表单”工具创建条形码和二维码。但是，条形码和二维码中生成的信息仅适用于周围的表单字段，而不适用于文档中其他地方的特定文本（参见图
  3-1）。目前，使用“批注”工具，您无法生成可能想要用作批注或图章的自定义二维码，因此本章将向您介绍一种解决此问题的方法。


  ![](img/449379_2_En_3_Fig1_HTML.jpg)


  一张条形码字段属性的截图，包含 5 个选项卡，其中“选项”选项卡被选中。它有两个下拉菜单，分别用于选择符号体系（已选为 QR 码）和解码条件（文档和手持扫描仪）。页面右下角有一个
  QR 码。


  图 3-1 “条形码字段属性”对话框，其中显示了从“选项”选项卡的“符号体系”列表创建的 QR 码示例


  注意


  如果您想在本课中同步操作或查看最终结果，请从引言中提到的链接下载第 3 章的文件。如果您想编辑，您会找到原始的 Adobe InDesign 文件、QR 图片和
  PDF 文件。有关此主题的更多详细信息，请参阅本章后面的“创建 QR 码”部分。


  请记住，要查看字段的属性，您必须选择“准备表单”工具。只有这样，您才能右键单击或双击字段来查看其属性。


  ## 自定义您的 QR 码图章


  将 QR 码放在名片、简历和新闻简报上已变得流行；这些代码可以被智能手机读取。然而，Acrobat 只允许您创建适用于表单的 QR 码。对于您的简历或信笺抬头，您可能希望
  QR 码包含您公司网站的 URL 或只是一些文本。解决方案是构建您自己的自定义 QR 码图章，您可以将其放置在在线 PDF 中供客户查看。以下练习将向您展示如何操作。


  注意


  如果您计划将 QR 码用于专业印刷材料，请始终将其放入原始文档（MS Word 或 Adobe InDesign Creative Cloud 2014 或更高版本）中，而不是像我接下来将要演示的那样使用
  Acrobat 图章工具。虽然图章图像在您的家用电脑上打印效果良好，但当发送给某些专业打印机时，根据布局是否需要更改，它可能无法正常打印。有关如何在 MS Word
  中执行此操作的详细信息，请参阅本章末尾的“最后思考”部分。您也可以在本章中参考文件 `QRCode_Resume_Chapter3_End.pdf`。


  ## 创建 QR 码


  要么使用 InDesign CC 2014 或更高版本（一种允许您生成 QR 码的设计软件）创建 QR 码，要么请贵公司的平面设计师为您创建一个。要处理图像，请使用诸如
  Adobe Photoshop 之类的程序创建一个新文档，该文档为灰度模式，宽度为 200px，高度为 200px，分辨率为 72 像素/英寸，并且是 8 位的。如果您要在
  InDesign 中制作彩色图章，该图形也可以采用 RGB 颜色模式。有关在 InDesign 中生成 QR 码的步骤链接，请参阅“摘要”部分。


  从 InDesign 中选择“编辑” ➤ “复制”，然后在 Photoshop 中选择“编辑” ➤ “粘贴”，如果代码在画布上显得太小或太大，请使用该应用程序缩放您的代码。通过单击“选项”面板中的复选标记来确认更改。确保使用“图层”面板菜单拼合图像；然后将文件以
  JPEG 格式保存到您的计算机并单击“确定”。之后，使用智能手机的“相机”应用对其进行测试，以确保其正常工作。参见图 3-2。


