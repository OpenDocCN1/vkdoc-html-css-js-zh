  “验证”和“计算”选项卡上的文本字段属性设置\n\n同样，像 `Text5` 和 `Text6` 这样的字段也可以在“验证”选项卡上应用脚本，与特定按钮交互，以锁定按钮或将其设置为只读或解锁。请参考图\
  \ 19-17。\n\n![](img/449379_2_En_19_Fig17_HTML.jpg)\n\n提供了 4 个空白区域用于输入密码，旁边的按钮用于锁定或解锁密码。\n\
  \n图 19-17\n\n使用文本字段根据输入内容锁定或解锁\n\n```\nvar b = this.getField(\"Button4\");\nif(event.value==2){\n\
