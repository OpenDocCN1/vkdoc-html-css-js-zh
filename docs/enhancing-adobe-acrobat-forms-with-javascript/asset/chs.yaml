- "# 引言\n\n欢迎踏上这段激动人心的旅程的第一步，本书名为*《用 JavaScript 增强 Adobe Acrobat 表单》*。\n\n我学习 Adobe\
  \ 软件的旅程始于 20 多年前上大学时。当时我在不列颠哥伦比亚省温哥华参加了一个为期两年的平面传播课程。在学习使用 QuarkXPress 以及后来的 Adobe\
  \ InDesign 设置文档进行打印排版的过程中，我创建了 PDF 文件。那时，我只把 PDF 看作是文件格式转换中的一个过渡环节，从排版到印刷机的下一步工序。我从未想过，在\
  \ Adobe Acrobat 中还能用 PDF 文件做其他事情。\n\n毕业几年后，在为一位客户做自由职业工作时，我开始研究 Acrobat 的功能，以发现该程序还能提供什么。2008\
  \ 年，我决定学习更多关于网页设计的知识，并提高我在 Adobe 软件中的排版技能。在兰加拉学院继续教育部完成了三个网页设计证书课程后，我意识到自己想帮助学生更多地了解\
  \ Adobe 软件。在旅途中，我曾多次阅读不同的计算机书籍，并感到：“好吧，我完成了这个教程或项目，但这与我的现实世界以及我试图实现的目标有什么关系呢？”2011\
  \ 年，我成为兰加拉学院的一名助教，这让我有机会编写自己的课程，向学生介绍 Adobe Acrobat。在编写过程中，我意识到关于 Acrobat 可以讲的内容远比我在三个晚上的课程中能呈现的多得多。那时，我看着\
  \ Acrobat 菜单中一个让我困惑的图标，它叫`JavaScript`。\n\nAcrobat 里的`JavaScript`？它在那里做什么？那时我所知道的唯一`JavaScript`是通过构建网站了解的。在那之前，我曾使用\
  \ LiveCycle Designer、MS Word 和 Acrobat 构建过一些基本的模板表单，但我从未在 Acrobat 程序中使用过`JavaScript`。我开始思考`JavaScript`如何能改善我的表单。\n\
  \n这就是我开始为学生们编写一本关于 Acrobat 和`JavaScript`的书的想法的起源和过程。经过多年的研究，查看 Adobe 和 Acrobat 论坛，并研究用户在尝试将`JavaScript`添加到\
  \ Acrobat 时所提出的问题和关切，我得出了以下结论：\n\n- 用户正在寻找简单的解决方案来编程他们将在现实世界中使用的 Acrobat 表单。许多人都在寻找相同的答案。\n\
  - 当文档不以简化的方式编写时，普通用户就会感到畏惧。他们会回避使用`JavaScript`菜单，最终放弃并忽略这个工具。对他们来说，`JavaScript`编码就像一门外语，而没学过网页设计课程的普通人完全不知道它是什么意思，也不知道代码应该插入到哪里，因为表单字段的属性对话框看起来一点也不像一个网页。\n\
  - 在某个时候，与他人分享你关于 Acrobat 和`JavaScript`所学到的东西是很重要的，不要把你的想法留给自己。这正是产生创新想法的原因。然而，这些想法需要被组织起来，以便用户能够快速找到解决方案并理解它。而且这些想法需要保持更新。\n\
  \n在我为本书第一版整理笔记后不久，Adobe 推出了最新版本：Acrobat DC。我看到程序的布局发生了变化，并且没有一本书来指导用户如何在这种新格式中添加`JavaScript`。我完成了我的高级\
  \ Adobe 课程初稿，并得到了学院课程协调员的批准。2016 年，我意识到如果这本书出版，我就能接触到更广泛的读者，于是我联系了 Apress。他们看到了我的愿景，这就是这本书如何到你手中的原因。\n\
  \n2022 年 10 月，Acrobat 在最新版本中从其名称中移除了对 Document Cloud（DC）的引用；请参阅`https://helpx.adobe.com/acrobat/using/whats-new.html`。这就是第二版标题中删除“DC”的原因。\n\
  \n较新版本的 Adobe Acrobat 也依赖于 Web 表单，这是我们在第`20`章中将讨论的一个新主题。\n\n\n\n## 理解 Acrobat 及其表单如何与\
  \ JavaScript 协作\n\n如果您当前正在使用 Adobe Acrobat Pro DC 或更早版本，是时候升级到新版 Adobe Acrobat Pro\
  \ 了，本书将全程使用该版本。您既可以通过 Adobe 单独购买 Adobe Acrobat Pro 作为独立程序，也可以订阅 Creative Cloud 并每月付费，享受所有令人激动的\
  \ Adobe 程序。请参考以下链接，检查您计算机的操作系统是否满足升级所需的系统要求：\n\n*   [`https://helpx.adobe.com/creative-cloud/system-requirements.html`](https://helpx.adobe.com/creative-cloud/system-requirements.html)\n\
  *   [`https://helpx.adobe.com/acrobat/system-requirements.html`](https://helpx.adobe.com/acrobat/system-requirements.html)\n\
  \n请务必遵循在线说明和教程来安装和使用 Acrobat 及 Creative Cloud。\n\n如果您已通过 Creative Cloud 订阅在机器上安装了\
  \ Adobe Acrobat Pro，您可能会注意到 Acrobat Pro 窗口左上角显示的是“32 位”，即使版本号是 22.0 或更高，而最新版本实际上是\
  \ 64 位。即使定期更新，您的版本也可能不会自动切换。\n\n我发现将此应用程序从 32 位改为 64 位的最佳方法是从 Creative Cloud Desktop\
  \ 卸载该应用程序，然后重新安装。参见图 I-1。\n\n![](img/449379_2_En_BookFrontmatter_Fig1_HTML.jpg)\n\
  \nCreative Cloud 桌面窗口的截图。在“应用程序”页面下，显示已安装的最新版 Acrobat 应用程序，接着是带有 Adobe Acrobat Pro\
  \ 64 位的已禁用安装选项。右侧是包含“管理插件”、“了解更多”和“卸载”选项的下拉菜单。\n\n**图 I-1** 重新安装 Acrobat 将使其更改为\
  \ 64 位版本\n\n更改为 64 位版本的好处是，如果您使用较新的计算机，在打开较大文件时可以确保更好的性能、安全性和内存使用。自 2023 年 1 月起，Adobe\
  \ 已逐步停止对 32 位系统的支持；参见 [`https://helpx.adobe.com/acrobat/kb/end-of-support-acrobat-reader-32-bit-os.html`](https://helpx.adobe.com/acrobat/kb/end-of-support-acrobat-reader-32-bit-os.html)。\n\
  \n如果您是 Adobe Acrobat 的新手，我建议您首先阅读 Lisa Fridsma 所著的 *Adobe Acrobat Classroom in a\
  \ Book*。她的书会让您对新版 Acrobat 的功能以及一些表单基础知识有一个基本了解。不过，那本书并未详细讲解与 JavaScript 协作时的表单内容。我认为我的书是它的续篇，面向中高级用户，帮助他们将表单提升到新水平。\n\
  \nAdobe Acrobat Pro 允许您在任何 PDF 文件中添加表单字段，我将在第 1 章中进一步说明。它甚至能与之前在 Adobe InDesign\
  \ CC 中将文件导出为交互式 PDF 时创建的现有表单字段配合使用。然而，重要的是您的客户要在 Acrobat Pro、Standard 或 Acrobat\
  \ Reader 中查看并交互这些表单。其他 PDF 阅读器以及一些较旧版本的浏览器，在保存文档时可能会损坏 JavaScript 程序，因此在向客户发送表单时请牢记这一点。请确保您的客户拥有最新版本的免费\
  \ Acrobat Reader，并且他们的浏览器也是最新的。\n\n某些用户可能无法与 JavaScript 交互的另一个原因是，他们可能已在 Acrobat\
  \ 应用程序中通过“编辑 ➤ 首选项 ➤ 类别 ➤ JavaScript”禁用了 JavaScript 的使用。\n\n参见图 I-2，了解您的 JavaScript\
  \ 首选项在 Adobe Acrobat Pro 中应如何显示。\n\n![](img/449379_2_En_BookFrontmatter_Fig2_HTML.jpg)\n\
  \n窗口截图中，首选项下有一系列类别，其中 JavaScript 选项被选中。JavaScript 页面在 JavaScript、安全性、调试器和编辑器下有启用和禁用选项。下方是“确定”和“取消”按钮。\n\
  \n**图 I-2** Acrobat Pro“首选项”菜单，用于启用和禁用 JavaScript 及安全功能\n\n以下是对某些设置的 Adobe 网站解释。更多信息请参见\
  \ [`https://helpx.adobe.com/acrobat/using/javascripts-pdfs-security-risk.html`](https://helpx.adobe.com/acrobat/using/javascripts-pdfs-security-risk.html)。\n\
  \n*   **启用 Acrobat JavaScript**：取消选中可完全禁用 JavaScript，或通过 API 限制 JavaScript。此设置默认已启用。\n\
  *   **启用菜单项 JavaScript 执行特权**：此项允许通过单击菜单项执行 JavaScript。关闭时，可以通过菜单执行特权 JavaScript\
  \ 调用。无论此框是否选中，通过菜单项执行非特权 JavaScript 调用都不会被阻止。此设置默认已禁用。\n*   **启用全局对象安全策略**：此项允许通过\
  \ API 全局使用 JavaScript，或信任包含 JavaScript 的特定文档。此设置默认已启用。\n\n请注意，您不会使用任何可能造成安全风险的 JavaScript，因此在使用您下载的文件时，对于这些章节，您可以将“JavaScript\
  \ 安全性”区域保留为默认设置。不过，我将在第 5 章中向您展示如何使用“首选项”对话框启用 JavaScript 调试器。\n\n在大多数情况下，Adobe\
  \ Acrobat 会在 PDF 中自动检测大多数表单字段可以添加的位置，但这并非一门完美的科学。作为作者，您需要自行编辑和测试表单，在构建表单并添加 JavaScript\
  \ 代码时排查错误。\n\n## 本书内容概览\n\n*《用 JavaScript 增强 Adobe Acrobat 表单》*涵盖了最新、真实的工作示例，您可以轻松下载、练习并根据自己的项目进行编辑。本书使用的截图来自\
  \ Adobe Acrobat Pro，因此以前版本的用户也能运用这些技巧。本书还展示了您可能遇到的各种表单问题的解决方法和替代方案。JavaScript 并不可怕。善用它将使您充满力量，改进您的\
  \ PDF 文档！\n\n\n\n## 学习内容\n\n你将学习如何在本书中完成以下操作：\n\n- 使用表单元素创建计算、评分表单和二维码印章\n- 理解用于\
  \ Acrobat 的简化字段标记和基础 JavaScript\n- 使用按钮进行导航\n- 创建包含下拉列表和列表框，并与复选框和单选按钮等其他表单字段相结合的复杂表单\n\
  - 使用“动作向导”和 JavaScript\n- 改进表单导航和表单打印\n- 实现多种类型的提示和自定义验证，以改善客户端输入的数据并避免错误\n- 获取关于\
  \ Adobe Sign 及其与在线 Acrobat 表单关系的新信息\n\n**注意**  \n你可以在 [`www.apress.com/9781484228920`](http://www.apress.com/9781484228920)\
  \ 找到本书的项目文件。\n\n## 致谢\n\n由于他们的耐心和建议，我要感谢以下人员，因为没有他们，我永远无法写出这本书：\n\n- 我的父母，他们鼓励我阅读厚重的计算机教材，这些书最终激励我编写自己的书籍\n\
  - 我的父亲，在我提交提案之前审阅了初稿\n- 我在兰加拉学院的课程协调员 Raymond Chow，他给了我教授晚间课程的机会，并让我能够找到新颖且富有创意的方法来教授软件\n\
  - 我的各位自由职业客户，我通过他们的项目学到了很多，并对表单及表单布局进行了更深入的研究\n\n我还要感谢 Apress 的 Spandana Chatterjee\
  \ 和 Mark Powers，他们向我展示了如何编排一本专业的教材，并指出即使你认为已经写完了所有内容，也仍有更多内容需要补充。同时，感谢技术审稿人给予的鼓励评价，以及\
  \ Apress 团队的其他成员参与本书的出版，让我的梦想再次成为现实。我深感感激与幸运。\n\n## 关于作者 | 关于技术审稿人\n\n"
- '# 第一部分：基础表单改进


  '
- "# 1. 表单基础入门\n\n**章节目标：** 在向 PDF 字段添加 JavaScript 之前，创建正确的表单需要花费时间和仔细规划。因此，熟悉每个表单工具及其相关属性非常重要。本章将快速概述表单、字段、属性和选项卡，为后续章节奠定基础。如果你对这些主题已经驾轻就熟，可以直接跳到第\
  \ 2 章。\n\n## 表单回顾\n\n每个表单字段都包含其属性，可以通过右键点击表单字段来访问。这些属性按选项卡进行组织。每个表单字段的属性略有不同，因此选项卡也不同。\n\
  \n在本书中，你将通过多种不同的 PDF 表单和文档进行学习，这些文档都来自一家虚构的公司——Tourmaline Mining Corporation。\n\n\
  除了第 1 章和第 5 章，其余每章都附带一个 `.txt` 文件中的 JavaScript 代码以及可供打开和对比的 PDF 文件。你可以查看最终的 PDF\
  \ 文件，也可以使用起始的 PDF 文件并跟随章节中的注释进行操作。你可以在引言中找到这些文件的链接，然后找到对应的章节项目文件夹。\n\n**注意**  \n\
  请注意，本书使用的 PDF 文件应仅在 Adobe Acrobat Pro、Acrobat Reader 或更早版本的 Acrobat DC 中打开，不要在网页浏览器或任何其他\
  \ PDF 创建/阅读程序中打开。已知其他 PDF 阅读器会损坏 Acrobat PDF 文件中的 JavaScript 代码，从而导致计算功能失效。\n\n\
  打开 Acrobat Pro 后，请务必检查 **编辑** ➤ **首选项** ➤ **表单** 中的设置。参考图 1-1。它们应设置为图 1-2 所示的默认设置。\n\
  \n![](img/449379_2_En_1_Fig2_HTML.png)\n\n截图显示了一个首选项侧面板，列出了“类别”下的选项，其中“表单”被高亮显示。下方的对话框包含带有复选框的常规设置、高亮颜色选项以及设置为“关闭”的自动完成功能。底部有一个“确定”按钮。\n\
  \n**图 1-2**  \n在首选项中找到的“表单”工具的默认设置\n\n![](img/449379_2_En_1_Fig1_HTML.jpg)\n\n截图左侧显示\
  \ Acrobat 图标，右侧显示带有省略号的“打开”按钮。\n\n**图 1-1**  \n通过你的 Creative Cloud 桌面应用打开 Acrobat\
  \ Pro\n\n在这种情况下，所有 **常规** 复选框均已启用。\n\n- 自动计算字段值\n- 修改字段时自动调整 Tab 键顺序\n- 显示焦点矩形\n\
  - 显示文本字段溢出指示器\n- 创建或编辑表单字段时显示字段预览\n- 自动检测表单字段\n- 在“准备表单”中自动启用文本编辑\n\n**高亮颜色** 的复选框已启用，用于显示字段的边框悬停颜色。浅蓝色是高亮字段的颜色，红色是必填字段的高亮颜色。\n\
  \n**自动完成** 设置为 `关闭`，下方有一段说明文字解释该设置的含义。列表中的其他选项为 `基本` 或 `高级`。\n\n此时，如果这些是你的设置，你可以点击\
  \ **取消** 并 **退出**，或者将你的设置调整为与我的一致并点击 **确定**。这些首选项不会随表单保存，但将有助于你在工作中与表单进行交互。\n\n\
  如果你正在使用 `管理条码参数`，请在本章稍后的内容以及第 19 章中参考此主题。\n\n本书假定你熟悉如何填写基本表单，或者过去曾使用过 PDF 表单。如果你不确定如何在\
  \ Acrobat Pro 中使用 `准备表单` 工具及其字段自动检测功能，本节将提供一个复习指导。\n\n先在纸上手绘你的表单，或者在 MS Word、Adobe\
  \ Illustrator 或 Adobe InDesign 中创建基本结构，然后确定你希望表单执行和完成哪些步骤。接着规划如何实现你的目标。你希望表单执行的操作是否可行？你是否需要简化表单？或者你是否需要进一步学习表单主题来创建你想要的内容？在开始添加交互性之前，请务必在构建表单时与你的团队或客户进行协商。\n\
  \n\n\n## 创建交互式 PDF 表单\n\n除了 Adobe InDesign 程序外，你无法在 Acrobat 之外组装表单的交互式字段，因此你需要制作一个\
  \ PDF 来完成此操作。在准备制作 PDF 之前，请继续在布局程序（如 MS Word）中组装表单，直到它看起来符合要求。然后保存 MS Word 文件（`.doc`\
  \ 或 `.docx`）。接着创建 PDF。例如，在 MS Word 的情况下，我可以使用`Acrobat`选项卡快速创建 PDF，或使用`文件 > 打印`选项卡。请参考图\
  \ 1-3。\n\n![MS Word 窗口截图，显示了 Acrobat 选项卡下的选项以及打印对话框](img/449379_2_En_1_Fig3_HTML.jpg)\n\
  \n*图 1-3 使用 MS Word 功能区的 Acrobat 选项卡或打印设置创建您的 PDF*\n\n一张 MS Word 窗口的截图，列出了`Acrobat`选项卡下的选项以及打印对话框。它包括：份数为\
  \ 1，打印机选择了 Adobe PDF，以及其他打印机属性。\n\n---\n\n## 使用 Acrobat Pro 添加交互性\n\n一旦你有了最终的 PDF，请在\
  \ Acrobat Pro 中打开它，并按照以下步骤添加交互性：\n\n![Acrobat 页面截图，高亮显示了左侧的工具选项卡和一个搜索栏](img/449379_2_En_1_Fig4_HTML.jpg)\n\
  \n*图 1-4 准备表单工具的位置*\n\n一张 Acrobat 页面的截图，高亮显示了左侧带有搜索栏的工具选项卡，以及右侧的“准备表单”工具，其中包括一个带下拉菜单的“添加”选项卡。\n\
  \n### 步骤一：启动准备表单工具\n\n1.  单击`工具`选项卡，然后点击`准备表单`工具，该工具位于`表单与签名`部分（见图 1-4）。\n\n![页面截图，左侧面板高亮显示单个文件，右侧显示文档标题为\
  \ TMC 客户调查](img/449379_2_En_1_Fig5_HTML.jpg)\n\n*图 1-5 首次创建新表单时的“准备表单”工具*\n\n一张截图展示了一个页面，左侧面板高亮显示“单个文件”，右侧显示一个标题为“TMC\
  \ 客户调查”的文档，下方有“更改文件”选项和一个“开始”按钮。底部还有一个“新文件”图标，并带有“选择文件”选项。\n\n### 步骤二：选择源文件并设置选项\n\
  \n1.  无论是否已打开 PDF 表单，你都可以使用此工具。在该工具中，选择（本例中）`单个文件`，找到你的文件（如果缩略图不正确，你可以更改文件），并确保`表单字段自动检测`功能已开启。**不要**选择“此文档需要签名”，我们将在第\
  \ 20 章更详细地探讨该选项（图 1-5）。\n\n![“另存为 PDF”对话框截图，列出了“文件”下的选项，并选中了“您的计算机”](img/449379_2_En_1_Fig6_HTML.jpg)\n\
  \n*图 1-6 自动检测完成后将新的 PDF 表单保存到文件夹中*\n\n一张“另存为 PDF”对话框的截图，列出了“文件”下的选项，并选中了“您的计算机”。它包括文件选项、保存在“最近文件夹”中，以及一个高亮显示的用于选择不同文件夹的按钮。\n\
  \n### 步骤三：开始检测并保存\n\n1.  单击`开始`。Acrobat 将扫描文件中的字段；如果检测到任何字段，它将创建这些字段。然而，其检测并非完美，因此你可能需要在之后添加、删除或编辑某些字段。\n\
  \n2.  添加完字段后，将文件另存为一个新的 PDF（`Ctrl/Cmd + S`）。选择将文件保存到你的计算机上，然后选择一个文件夹来保存该文件。确保`转换为`选项处于禁用状态。新的\
  \ PDF 现在就是一个交互式表单。请参考图 1-6。\n\n> **注意**\n>\n> 现在，使用“准备表单”工具，你还可以通过另外三种方式创建 PDF 表单；请参考图\
  \ 1-5：直接通过扫描仪、使用`创建新文档`选项创建一个空白新文档，或者使用`创建 Web 表单`。我们将在第 20 章探讨该选项。\n\n## 后续操作\n\
  \n现在，你可以开始为每个字段的属性添加格式和操作。在对表单进行测试，并请他人在其电脑上测试后，再通过电子邮件发送给你的客户。始终在主磁盘或 USB 驱动器上保留备份，以防主计算机出现故障。此外，制作一份\
  \ PDF 及所有代码的打印件，以便日后在其他项目中参考。在本书中，我在每章的`.txt`文件中放置了一份代码副本以供参考。\n\n一旦字段被保存到表单中，你可以随时使用`准备表单`工具打开这些字段；你无需对该表单再次运行自动检测。请参考图\
  \ 1-7。\n\n你可以通过切换右上角的`预览/编辑`按钮（图 1-7）部分退出`准备表单`区域。要完全退出`准备表单`工具，你必须点击右上角的`关闭`按钮（图\
  \ 1-7）。\n\n![Adobe Acrobat 文件页面截图，显示了一份已准备的表单](img/449379_2_En_1_Fig7_HTML.jpg)\n\
