  \ 3 章中更详细地介绍它们。\n\n### 属性回顾\n\n每个表单字段都包含可在表单编辑模式下轻松访问的属性。只需右键单击要编辑的字段，然后从弹出列表中选择**属性**（图\
  \ 1-24）。然后在对话框中将出现的各个选项卡中选择要处理的属性。\n\n![一个截图显示了一个字段框，包含消息、客户全名、一个名称字段，以及一个包含高亮显示的属性、上移、下移、重命名字段、设置为必填字段和添加新字段选项的弹出列表。](img/449379_2_En_1_Fig24_HTML.jpg)\n\
  \n**图 1-24** 右键单击字段以显示其属性\n\n可以为每个字段设置各种属性，具体取决于选择的字段，因为属性的数量会有所不同。这些属性使用选项卡组织成不同的部分。请参见图\
  \ 1-25 至 1-32。属性可以输入文本、勾选或取消勾选。当您退出该字段并移动到“属性”对话框中的另一个字段时，或当您单击**关闭**按钮时，设置会立即应用。但是，在您保存\
  \ PDF 文件之前，这些设置不会完全保存。\n\n回顾一下，要处理表单字段，您必须处于“准备表单”工具的编辑模式。您可以通过右上角的**预览**按钮切换开关以及每个字段名称的显示来判断您是否处于编辑模式。现在，您可以一次编辑单个字段或多个字段。\n\
  \n使用选择工具，单击一个字段，按住 `Shift` 键单击多个字段，或拖出一个选框环绕多个字段，然后右键单击并从菜单中选择**属性**。\n\n> **注意:**\
  \ 如果您一次选择了多个字段，则根据所选字段的类型，您可能无法访问所有选项卡。如果您选择了多个字段，您在选项卡属性中输入的内容将应用于所有选中的字段。\n\n\
  现在您将进入表单的“属性”对话框。您可以在每个选项卡内更改属性；完成后，单击**关闭**按钮关闭对话框，并保存您的 PDF 文件以确认更改。\n\n以下各节简要介绍了本章前面列出的与表单字段相关的属性。\n\
  \n#### 文本框字段属性和日期字段属性对话框\n\n文本字段和日期字段有八个选项卡来组织其属性。文本字段和日期字段之间的唯一区别在于，日期字段的格式类别预设为**日期**，而文本字段的格式类别预设为**无**。请注意，两者的对话框标题都是“文本字段属性”。请参见图\
  \ 1-25。\n\n![两个标题为“测试字段属性”的截图。1. 列出了“常规”选项卡下的选项，包含名称、工具提示和通用属性。2. 列出了“格式”选项卡下的选项，类别选择了“日期”，并显示一个日历。](img/449379_2_En_1_Fig25_HTML.png)\n\
  \n**图 1-25** 文本字段和日期属性\n\n#### 下拉列表属性对话框\n\n“下拉列表属性”对话框也有八个选项卡来组织属性。这些选项卡的名称与文本字段属性相同，并包含许多等效属性；但是，如果您将“文本字段属性”对话框中的**选项**选项卡与“下拉列表属性”对话框中的**选项**选项卡进行比较，它们看起来会有所不同，因为下拉菜单旨在容纳带有导出值的多个项目，而文本字段只能容纳一个默认值。\n\
  \n虽然这是一个选项，但**计算**选项卡很少与下拉列表一起使用。请参见图 1-26。\n\n![一个标题为“下拉列表属性”的截图，列出了“常规”选项卡下的选项：名称为“1\
  \ S R”，工具提示为“销售代表帮助程度”，通用属性中表单字段为“可见”，方向为“0 度”。右下角有一个“关闭”按钮。](img/449379_2_En_1_Fig26_HTML.jpg)\n\
  \n**图 1-26** “下拉列表属性”对话框\n\n#### 列表框属性对话框\n\n列表框属性的作用类似于下拉列表。但是，只有六个选项卡来组织属性。与下拉列表一样，它们可以有多个导出值。与下拉列表不同，您可以一次选择多个值。请参见图\
  \ 1-27。\n\n![一个标题为“列表框属性”的截图，列出了“常规”选项卡下的选项：名称为“quality list”，工具提示为“quality”，通用属性中表单字段为“可见”，方向为“0\
  \ 度”。](img/449379_2_En_1_Fig27_HTML.jpg)\n\n**图 1-27** “列表框属性”对话框\n\n\n好的，作为高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n\n#### 复选框属性对话框\n\n“复选框属性”对话框包含五个选项卡用于组织其属性。复选框可以设置为选中或未选中状态。您无法在复选框中输入文本，但可以为其分配一个词语或数值。与其他所有属性一样，您可以通过“外观”和“选项”选项卡更改其外观和颜色。复选框可以单独使用，也可以成组使用。请参考图\
  \ 1-28。\n\n![](img/449379_2_En_1_Fig28_HTML.jpg)\n\n一张标题为“复选框属性”的截图，列出了“常规”选项卡下的选项，其中名称为“已满足”，工具提示为“已满足”，通用属性为表单字段可见，方向为\
  \ 0 度。\n\n图 1-28 — 复选框属性对话框\n\n#### 单选按钮属性对话框\n\n“单选按钮属性”对话框与“复选框属性”对话框类似，包含五个选项卡用于组织其属性。单选按钮必须成对、成组或超过两个以上出现，且可以设置为选中或未选中状态。当一个被选中时，其他所有按钮都处于未选中状态。您无法在单选按钮中输入文本，但可以为其分配一个词语或数值。与其他所有属性一样，您可以通过“外观”和“选项”选项卡更改其外观和颜色。您可以拥有多个单选按钮组，但每个组中必须始终至少有两个按钮。请参考图\
  \ 1-29。\n\n![](img/449379_2_En_1_Fig29_HTML.jpg)\n\n一张标题为“单选按钮属性”的截图，列出了“常规”选项卡下的选项，其中名称为“组\
  \ 1.0”，工具提示为“选项 1”，通用属性为表单字段可见，方向为 0 度。\n\n图 1-29 — 单选按钮属性对话框\n\n#### 按钮属性和图像属性对话框\n\
  \n按钮属性和图像属性完全相同，唯一的区别在于图像属性在“操作”选项卡中有一段用于允许导入图像的小代码。详细信息请参见第 17 章。两者都包含五个选项卡，并且每个选项卡中的属性都相同。按钮可以有两个以上的状态；然而，一旦应用了\
  \ JavaScript，图像按钮的操作就独立于常规按钮属性。请参考图 1-30。\n\n![](img/449379_2_En_1_Fig30_HTML.jpg)\n\
  \n一张标题为“按钮属性”的截图，列出了“常规”选项卡下的选项，其中名称为“打印 3”，工具提示为“打印”，通用属性为表单字段可见，方向为 0 度。\n\n图\
  \ 1-30 — 按钮属性对话框\n\n#### 数字签名属性对话框\n\n数字签名用于使用存储在客户计算机上的数字签名签署电子 PDF 表单。数字签名字段看起来类似于文本字段，但它只有五个选项卡来组织其属性，并且专门指定用于签名。第\
  \ 19 章提供了关于数字签名及其配套工具的更多详细信息。请参考图 1-31。\n\n![](img/449379_2_En_1_Fig31_HTML.jpg)\n\
  \n一张标题为“数字签名属性”的截图，列出了“常规”选项卡下的选项，其中名称为“供应商签名”，工具提示为“供应商签名”，以及通用属性。\n\n图 1-31 —\
  \ 数字签名属性对话框\n\n#### 条形码属性对话框\n\n条形码字段属性被组织在五个选项卡中。条形码的主要目的是创建一个可扫描的条形码，该条形码与输入其周围各个字段中的信息相关联。第\
  \ 19 章提供了关于条形码的更多详细信息。请参考图 1-32。\n\n![](img/449379_2_En_1_Fig32_HTML.jpg)\n\n一张标题为“条形码字段属性”的截图，列出了“常规”选项卡下的选项，其中名称为“条形码\
  \ 6”，工具提示为“条形码”，以及通用属性。\n\n图 1-32 — 条形码字段属性对话框\n\n### 选项卡复习\n\n如前所述，所有表单字段都有相似的选项卡，如下所列。\n\
  \n以下是“常规”选项卡中的选项：\n\n-   **名称**：这是字段的名称。\n-   **工具提示**：这为字段添加了一种辅助功能文本，以便有视觉障碍的用户可以扫描该字段并了解其用途。它也是一种为那些不知道在该字段中输入文本目的的用户提供有用提示的方式。\n\
  -   **通用属性**：此表单字段指示它是可见、隐藏、可见但不打印，还是隐藏但可打印。此属性不适用于条形码。\n-   **方向**：此设置将字段的角度调整为\
  \ 0、90、180 或 270 度。此属性不适用于条形码。\n-   **只读**：您可以阅读其中的文本，但无法修改它。此属性不适用于条形码；默认情况下条形码是只读的。\n\
  -   **必填**：此字段为填写表单所必需。如果该字段未填写，可能会出现错误消息。此属性不适用于按钮、列表框、图像字段和条形码。\n\n以下是“外观”选项卡中的选项（不适用于条形码）：\n\
  \n-   **边框和颜色**：以下是具体设置：\n    -   **边框颜色**：这是字段周围边框的颜色。可将其设置为某种颜色或无颜色。\n-   **线条粗细**：这是边框的粗细：细、中或粗。\n\
  -   **填充颜色**：这是字段的填充颜色。可将其设置为某种颜色或无颜色。设置颜色会遮挡字段后面的背景。\n-   **线条样式**：这是字段周围线条的样式：实线、虚线、浮雕、内陷或下划线。\n\
  -   **文本**：这是字体大小（不适用于签名）、文本颜色和字体（不适用于复选框或单选按钮）。设置为 `Auto` 大小将根据用户键入的内容自动调整字体大小以适合文本框。\n\
  \n以下是“位置”选项卡中的选项（适用于所有字段）：\n\n-   **单位**：以下是字段大小和位置的度量单位：点、派卡、毫米、厘米和英寸。\n-   **位置单位**：选项包括左、右、上、下、宽度和高度。\n\
  -   如果您不希望在对属性对话框中的其他位置设置进行调整时改变框的大小，请勾选“更改位置时不更改高度和宽度”。在对话框中输入宽度和高度的数字将被禁用。取消勾选该复选框可能会导致表单字段在随其他位置设置移动时发生缩放。\n\
  \n以下是“选项”选项卡中的选项（不适用于数字签名；这些选项仅用于文本和日期字段）：\n\n-   **对齐**：这将文本左对齐、居中对齐或右对齐。\n-  \
  \ **默认值**：这提供了用户在字段中键入之前在该字段中显示的临时或默认文本。\n-   **字段用于文件选择**：这允许用户输入文件的文本链接信息。它不适用于日期字段。当禁用“检查拼写”和“多行”，并启用“滚动长文本”时，此选项可用。\n\
  -   **密码**：这将创建 `***` 以遮盖实际文本。它不适用于日期字段。当禁用“检查拼写”和“多行”时，此选项可用。\n-   **检查拼写**：选中后，这将指示用户输入的数据中是否存在拼写错误。\n\
  -   **多行**：这允许您在字段中输入多行文本。它不适用于日期字段。\n-   **滚动长文本**：如果文本内容超出字段的处理能力，将出现滚动条。\n- \
  \  **允许富文本格式**：这允许用户将文本设为粗体或斜体。它不适用于日期字段。\n-   **字符限制**：启用后，这通过设置一个具体数字来限制字段中允许的字符数。\n\
  \n\n\n*   **字符梳（Comb）**：启用后，可在字符间创建分隔线，便于后续阅读和比对（参见第 4 章）。字符会分散排列。输入数字时此功能尤为实用。但必须先禁用此选项卡中的其他设置，才能调整字符梳的数量。\n\
  \n以下仅适用于列表框和下拉列表的选项：\n\n*   **项目（Item）**：输入列表中要显示的项目名称或选项。\n*   **导出值（Export value）**：输入导出值的字母或数字。可填写也可留空。\n\
  *   **项目列表（Item List）**：列出所有项目。高亮显示的项目为列表默认选中项。\n*   **添加、删除、上移、下移按钮（Add, Delete,\
  \ Up, Down buttons）**：未选中“排序项目”时，用于添加、删除或调整项目在列表中的顺序。\n*   **排序项目（Sort items）**：按字母或数字顺序排序。\n\
  *   **允许用户输入自定义文本（Allow user to enter custom text）**：允许用户自行输入文本。此选项不适用于列表框。\n* \
  \  **检查拼写（Check spelling）**：用户输入文本时，指示是否存在拼写错误。此选项不适用于列表框。\n*   **立即提交选中值（Commit\
  \ selected value immediately）**：选中后，该值可能与另一个字段的值交互。否则，用户必须等到焦点移出该字段并点击另一个表单字段后才能生效。此功能不适用于多选列表框。\n\
  *   **多选（Multiple selection）**：仅允许在列表框中选择多个项目。\n\n以下仅适用于复选框和单选按钮的选项：\n\n*   **样式（Style）**：样式包括勾选、圆圈、十字、菱形、方形和星形。大小在“外观”面板中由文本区域决定。\n\
  *   **导出值（Export value）**：字段的值。仅适用于复选框。\n*   **单选按钮选项（Radio button choice）**：与导出值相同。组中的单选按钮在“常规”选项卡中必须同名，但在“选项”选项卡中可以有不同的导出值。\n\
  *   **复选框默认选中（Check box is checked by default）**：设置表单打开时该复选框为选中状态。\n*   **（单选）按钮默认选中（(Radio)\
  \ button is checked by default）**：表单打开时，该按钮显示为填充状态。\n*   **具有相同名称和选项的（单选）按钮同时选中（(Radio)\
  \ buttons with the same name and choice are selected in unison）**：这是使同一组中的两个或多个单选按钮同时显示为选中状态的唯一方法。\n\
  \n以下仅适用于按钮和图像字段的选项：\n\n*   **布局（Layout）**：为图标和标签添加布局（参见第 4 章）。\n*   **高级按钮（Advanced\
  \ button）**：为图标按钮创建更高级的布局（参见第 4 章）。\n*   **行为（Behavior）**：改变按钮的状态。选项包括无、推入、轮廓和反色（参见第\
  \ 4 章）。\n*   **图标和标签状态（Icon and label state）**：\n    *   **状态（State）**：设置按钮在向上、向下和悬停状态下的外观。\n\
  *   **标签（Label）**：设置按钮上的文本名称。\n*   **图标（Icon）**：所选图标的缩略图。\n    *   **选择图标（Choose\
  \ icon）**：允许您选择一个图标。\n*   **清除（Clear）**：从字段中清除图标。\n\n以下仅适用于条形码的选项：\n\n*   **编码类型（Symbology）**：有不同类型的条形码可用。\n\
  *   **压缩编码条形码的数据（Compress data encoding barcode）**：数据在编码前进行压缩。\n*   **解码条件（Decode\
  \ condition）**：自定义设置，用于管理条形码参数（参见图 1-2 中的“首选项”），例如条形码如何被扫描器等设备解码。\n*   **设置（Settings）**：该条形码的设置。\n\
  \n以下是“动作”选项卡中的选项（适用于所有表单字段；更多信息见第 4 和第 5 章）：\n\n*   **添加动作（Add an action）**：选择进入字段时触发动作的事件。\n\
  *   **选择动作（Select action）**：选择触发何种动作或事件。\n*   **添加按钮（Add button）**：添加动作并打开多个对话框，用于编辑动作，提交后这些动作将显示在“动作”区域中。\n\
  \n\n\n- **上移按钮**：用于调整操作的顺序。\n- **下移按钮**：用于调整操作的顺序。\n- **编辑按钮**：在原始对话框或 JavaScript\
  \ 编辑器中编辑该操作。\n- **删除按钮**：删除触发器下的选定操作或多个操作。\n\n以下是“格式”选项卡中的选项（适用于文本字段、日期字段和下拉列表；详细说明请参考第\
  \ 6 章和第 7 章）：\n\n- **无**：适用于无实际数值的文本和数字。\n- **数字**：设置数字格式，包括是否显示小数位数、分隔符样式、货币符号、符号位置，以及使用括号和红色文本表示的负数样式。\n\
  - **百分比**：设置百分比格式，包括小数位数和分隔符样式。\n- **日期**：设置日期选项的格式。\n- **时间**：设置时间选项的格式。\n- **特殊**：设置邮政编码、电话号码、社会保险号和任意掩码选项的格式。\n\
  - **自定义**：创建可编辑的自定义选项脚本，称为“格式”和“按键”。\n\n以下是“验证”选项卡中的选项（适用于文本字段、日期字段和下拉列表）：\n\n-\
  \ **不验证字段值**：该字段不需要验证。\n- **字段值在范围内**：选项包括“从数字”和“到数字”，例如数字 1–5。\n- **运行自定义验证脚本**：可编辑\
  \ JavaScript 脚本。\n\n以下是“计算”选项卡中的选项（适用于文本字段、日期字段和下拉列表）：\n\n- **不计算值**：仅在用户需要输入默认文本时使用此选项。\n\
  - **值是以下字段的（总和、乘积、平均值、最小值、最大值）**：使用“选取”按钮选择字段。\n- **简化字段表示法**：点击“编辑”按钮可在 JavaScript\
  \ 编辑器中输入脚本。\n- **自定义计算脚本**：点击“编辑”按钮可在 JavaScript 编辑器中输入脚本。\n\n以下是“选择更改”选项卡中的选项（仅适用于列表框）：\n\
  \n- **不执行任何操作（如果无需操作）**：此选项允许不执行任何操作。不会触发任何脚本，仅进行选择。\n- **执行此脚本**：添加自定义脚本。点击“编辑”可在\
  \ JavaScript 编辑器中输入脚本。\n\n以下是“签名”选项卡中的选项（仅适用于数字签名字段；请参考第 19 章）：\n\n- **签名时不发生任何操作**：不执行任何操作。\n\
  \n以下设置或选项仅兼容 Acrobat 6.0 及更高版本。\n\n- **标记为只读**：可以选择所有字段或特定字段，以在签名填写时触发或防止某些字段变为只读，从而避免对已签名文档的进一步更改。使用“选取”按钮选择字段。\n\
  - **在字段被签名时执行此脚本**：点击“编辑”可在 JavaScript 编辑器中输入脚本。\n\n以下是“值”选项卡中的选项（仅适用于条形码字段；更多信息请参考第\
  \ 19 章）：\n\n- **使用制表符分隔或 XML 编码**：此选项与“选取”按钮配合使用，用于选择字段。\n- **包含字段名称**：当编码设置为制表符分隔时可用。\n\
  - **自定义计算脚本**：点击“编辑”可在 JavaScript 编辑器中输入脚本。\n- **“已发布表单的引用”将作为链接显示在对话框的字段中**：例如，它可能类似于“File//C/Users”这样的文本行，指向计算机上的某个位置。\n\
