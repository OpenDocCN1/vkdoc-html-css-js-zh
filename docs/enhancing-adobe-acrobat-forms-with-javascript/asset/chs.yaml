  \n## 使用正则表达式进行文本字段验证\n\n在此表单（参见文件 `InvoiceForm_Shipping_Change_End_defaulttext.pdf`）中，另一个可以尝试的功能是电话验证脚本。请参见图\
  \ 11-26 和“电话号码”文本字段。\n\n![](img/449379_2_En_11_Fig26_HTML.jpg)\n\n这是一个测试字段属性的截图，包含\
  \ 8 个选项卡，其中“验证”选项卡已被选中。它已选择“不验证字段值”选项，随后是自定义验证脚本的几行代码。页面底部有一个窗口，显示“无效的电话号码”。\n\n\
  图 11-26：在“验证”选项卡上进行电话文本字段验证，以及输入错误时产生的警告\n\n如果客户未以正确方式在文本字段中键入内容，则会发出警告，并且文本将显示为红色。正确的格式在图\
  \ 11-27 中以黑色文本显示。\n\n![](img/449379_2_En_11_Fig27_HTML.jpg)\n\n一个页面截图包含一个用于输入电话号码的框，数字为\
  \ 55，后面是一个用于输入 10 位数字 999 999 999 的电话号码框。\n\n图 11-27：上方：错误输入的信息显示为红色。下方：电话文本字段中正确输入的信息显示为黑色\n\
  \n点击警告中的“确定”按钮后，文本字段中的文本变为红色，并且直到用户输入正确格式后，才会恢复为黑色。\n\n\n\n### 电话验证\n\n以下 JavaScript\
  \ 代码需添加到字段的“验证”选项卡下的“运行自定义验证脚本”中（如图 11-26 所示）：\n\n```\nvar rgexTele = /^[(]{0,1}[0-9]{3}[)]{0,1}[-\\\
  s\\.]{0,1}[0-9]{3}[-\\s\\.]{0,1}[0-9]{4}$/;\nif(rgexTele.test(event.value)){\nevent.target.textColor\
  \ = color.black; //将文本颜色改为黑色\n{\nelse{\nevent.target.textColor = [\"RGB\",1,0,0];\
  \ //将文本颜色改为红色\napp.alert(\"无效的电话号码\");\n}\n```\n\n为了实现这一功能，你将使用一种称为*正则表达式*的 JavaScript\
  \ 形式。在创建多行按钮时，你已经见过一个简单的例子，即使用 `\\n`（换行符），并且在第 10 章中创建了一个元字符。当你将多个元字符组合在一起时，就创建了一个模式，而字符的这种组合就构成了正则表达式。这一次，你将使用一个更复杂的正则表达式。\n\
  \n```\n/^[(]{0,1}[0-9]{3}[)]{0,1}[-\\s\\.]{0,1}[0-9]{3}[-\\s\\.]{0,1}[0-9]{4}$/\n\
  ```\n\n表达式的这一部分表示，`{0,1}` 量词后面的代码必须匹配以下内容：\n\n-   第一部分中，括号内的三位数字，范围从 0 到 9，这些数字可以用短横线（`-`）、空格（`\\\
  s`）或点号（`.`）分隔。这些数字可以包含在括号内。\n-   第二部分中，三位数字，范围从 0 到 9，这些数字可以用短横线、空格或点号分隔。\n-   最后一部分中，四位数字，范围从\
  \ 0 到 9。\n-   脱字符（`/^`）表示数据的开始，而美元符号（`$/`）表示数据的结束。\n\n以下示例是可接受的：\n\n- `(123) 456-7890`\n\
  - `123-456-7890`\n- `123.456.7890`\n- `123 456 7890`\n- `1234567890`\n\n这段代码甚至允许没有空格的情况。但是，任何多于或少于\
  \ 10 位数字的情况都是不可接受的，并且不能使用字母。\n\n如果你不想编写这段代码，可以使用“特殊电话号码”或“任意掩码”格式。请参考图 11-28。\n\n\
  ![](img/449379_2_En_11_Fig28_HTML.jpg)\n\n文本字段属性页面的截图，显示了 8 个选项卡，其中“格式”选项卡被选中。它有一个下拉菜单用于选择格式类别为“特殊”，随后是一个特殊选项列表，包含邮政编码、邮政编码+4、电话号码、社会安全号码和任意掩码。\n\
  \n图 11-28\n\n可以使用“特殊电话号码”格式\n\n然而，这样做将无法获得自定义的数字和颜色格式，这些格式用于区分正确和错误的输入。因此，请将格式设置为“无”，并在“验证”选项卡（图\
  \ 11-26）中输入以下代码：\n\n```\nvar rgexTele = /^[(]{0,1}[0-9]{3}[)]{0,1}[-\\s\\.]{0,1}[0-9]{3}[-\\\
  s\\.]{0,1}[0-9]{4}$/;\nif(rgexTele.test(event.value)){\nevent.target.textColor =\
  \ color.black; //将文本颜色改为黑色\n{\nelse{\nevent.target.textColor = [\"RGB\",1,0,0];\
  \ //将文本颜色改为红色\napp.alert(\"无效的电话号码\");\n}\n```\n\n如果输入的文本经过测试与正则表达式格式匹配，则保持为黑色。如果不匹配（`else`），则发出警告提示，并将文本颜色改为红色，直到输入被更正并匹配正则表达式。\n\
  \n有很多好用的正则表达式，我建议你去探索一下；我将在本章后面提供一些链接。\n\n注意\n\n根据 Adobe 文档，格式设置“特殊 > 任意掩码”允许你使用一些基本的正则表达式，例如：\n\
  \n- `A`：仅接受字母（A–Z，a–z）\n- `X`：接受空格和可打印字符，包括标准键盘上的所有字符，以及范围在 32–126 和 128–255 内的\
  \ ANSI 字符\n- `O`：接受字母数字字符（A–Z，a–z 和 0–9）\n- `9`：仅接受数字字符（0–9）\n\n例如，掩码设置 `AAA-–q#999`\
  \ 接受输入 `BRT--q#123`。这里的 `q#` 不会改变，并且必须完全一致。或者，如果设置 `OOO@XXX`，则接受输入 `v12@2up`。但是，正如你将看到的，结合\
  \ JavaScript 的正则表达式提供了更广泛的可能性。\n\n更多示例，你可以查看文件 `TMC_FieldValidationsEnd.pdf`。请参考图\
  \ 11-29。\n\n![](img/449379_2_En_11_Fig29_HTML.jpg)\n\n一个标题为“带有正则表达式的字段验证”的页面截图。它有一个包含\
  \ 9 行的表格，分别用于日期、日期哈希 2、姓名、序列哈希、地址、电子邮件、URL 或网址、电话和电话哈希 2。其中姓名、序列哈希和电话的行有输入项。\n\n\
  图 11-29\n\n可以添加正则表达式的文本字段示例\n\n### 姓名验证\n\n如果你想在同一个字段中输入名字和姓氏，请使用此脚本。请参考名为“姓名”的字段。代码输入到“验证”选项卡中。请参考图\
  \ 11-30。\n\n![](img/449379_2_En_11_Fig30_HTML.jpg)\n\n文本字段属性页面的截图，显示了 8 个选项卡，其中“验证”选项卡被选中。它有\
  \ 3 个复选框，分别对应“不验证字段值”、“字段值范围”和“验证脚本”。第三个选项“运行自定义验证脚本”被选中，其下方显示了几行代码。\n\n图 11-30\n\
  \n在“验证”选项卡上运行自定义验证脚本\n\n```\n// 自定义姓名验证\nvar re = /^[A-Z][a-z]+ [A-Z][a-z]+$/;\n\
  if(event.value !=\"\"){\nif (re.test(event.value)== false){\napp.alert(\"这看起来不是有效的姓名。我需要输入名字和姓氏。\"\
  );\nevent.rc = false;\n}\n}\n```\n\n注意\n\n以下是正则表达式元字符的基本示例：\n\n- `[abc]`：查找括号之间的任何字符。\n\
  - `[A-Z]`：查找从大写 A 到大写 Z 的任何字符。\n- `[a-z]`：查找从小写 a 到小写 z 的任何字符。\n- `[A-z]`：查找从大写\
  \ A 到小写 z 的任何字符。\n- `[0-9]`：查找括号之间的任何数字。\n- `.`：查找单个字符，除了换行符或行终止符。\n- `\\d`：查找一个数字。\n\
  - `\\n`：查找一个换行符。\n- `\\s`：查找一个空白字符。\n- `\\w`：查找一个单词字符。\n\n有关正则表达式的更详细信息，请访问以下任一网站：\n\
  \n- [`www.w3schools.com/jsref/jsref_obj_regexp.asp`](http://www.w3schools.com/jsref/jsref_obj_regexp.asp)\n\
  - [`https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Guide/Regular_Expressions`](https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Guide/Regular_Expressions)\n\
  - [`https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Guide/Regular_Expressions/Quantifiers`](https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Guide/Regular_Expressions/Quantifiers)\n\
  \n在这个“姓名”字段中，名称需要一个包含大写字母后跟小写字母的名字和姓氏，以及名字之间的空格，就像 John Smith 一样，正如你在代码中分隔名字的（`+`）后面看到的空白。如果用户输入\
  \ JS 或仅输入 J，他们将收到错误提示“这看起来不是有效的姓名。我需要输入名字和姓氏。”当他们在错误提示上点击“确定”按钮时，该字段将恢复为空白（`event.rc\
  \ = false;`）并重置验证。他们必须重试，并且不会处理进一步的信息。或者，如果之前输入了正确格式的文本，它将在提示后恢复为该文本。\n\n代码 `event.rc`\
  \ 用作一种重置方式，可与正则表达式的验证配合使用。在这种情况下，因为它被设置为 `false`，输入数据被拒绝，因为格式不正确。如果字段中没有用户输入的文本，则不会发生错误。\n\
  \n请注意，我们将在本章后面查看添加到该字段的“格式”选项卡上的一些额外格式；请参考“关于字段格式的最终思考”部分。\n\n\n\n### 账号编号验证\n\n\
  如果你想创建一个字段，要求用户必须输入特定的账号或序列号，可使用此脚本。请参考图 11-29 和图 11-30，了解应在哪里输入名为`Serial`的字段代码。\n\
  \n```\n//账号编号\n//A6BF-479X-2139\nvar re = /^[A-Z]\\d[A-Z]{2}-\\d{3}[A-Z]-\\d{4}$/;\n\
  //如果字段为空，则阻止提示\nif(event.value !=\"\"){\nif (re.test(event.value)== false){\napp.alert(\"\
  抱歉，这不是有效的账号编号。\\n 示例：A6BF-479X-2139\");\nevent.rc = false;\n}\n}\n```\n\n在此字段中，代码必须包含一个大写字母、一个数字、两个大写字母，然后是连字符、三位数字、一个大写字母、另一个连字符，最后是四位数字。该格式必须正确，否则将出现错误提示，该字段将返回空白。\n\
  \n### 电子邮件与 URL 验证\n\n如果你想创建一个字段，要求用户必须输入电子邮件或 URL，并搜索单词字符（`\\w`）和字面量（`*`），请使用以下脚本。请参考图\
  \ 11-29 和图 11-30，了解应在哪里为`Email`和`URLWeb`字段输入代码。\n\n```\n//电子邮件\nvar re = /^\\w+([\\\
  .-]?\\w+)*@\\w+([\\.-]?\\w+)*(\\.\\w{2,3})+$/;\n//如果字段为空，则阻止提示\nif(event.value !=\"\
  \"){\nif (re.test(event.value)== false){\napp.alert(\"抱歉，这不是有效的电子邮件地址。\");\nevent.rc\
  \ = false;\n}\n}\n```\n\n如你所见，此代码与其他代码类似，但这次你需要使用以下格式来检查电子邮件名称和`@`符号。因此，`jennifer@email.com`是有效的，但如果缺少`@`符号，则会触发提示。如果要创建针对\
  \ URL 网站的验证，你需要将代码调整为类似以下内容，并在花括号`{}`中添加额外的量词，全部写在一行：\n\n```\nvar re = /^(http:\\\
  /\\/www\\.|https:\\/\\/www\\.|http:\\/\\/|https:\\/\\/)[a-z0-9]+\n([\\-\\.]{1}[a-z0-9]+)*\\\
  .[a-z]{2,5}(:[0-9]{1,5})?(\\/.*)?$/;\n```\n\n然后，你可以添加一个提示来反映是否出现错误。例如，`http://www.mysite.com`是有效的，但如果\
  \ URL 的某一部分缺失，则会收到警告。\n\n```\napp.alert(\"抱歉，这不是有效的 URL 地址。\");\n```\n\n在这两个示例中，使用了诸如`{2,3}`、`{2,5}`和`{1,5}`之类的量词来帮助表达式验证和匹配。此示例允许你排除`www`，但不能排除`http://`或`https://`。\n\
  \n### 另一个包含两个变量的电话和日期示例\n\n如果你想创建一个字段，要求用户输入有两种格式选项的电话号码或日期，请使用此脚本。请参考图 11-29 和图\
  \ 11-30 了解代码输入位置。字段`Telephone`使用了我们之前讨论过的正则表达式。而字段`Telephone 2`具有新的警告提示消息和验证，如图\
  \ 11-31 所示。\n\n![](img/449379_2_En_11_Fig31_HTML.jpg)\n\n截图显示一个警告窗口，消息内容为：“抱歉，这不是有效的\
  \ 7 位或 10 位电话号码”，下方有一个“确定”按钮。\n\n**图 11-31**  \n电话号码输入错误时显示的警告提示\n\n```\n//电话号码验证提示\n\
  var re7Digits = /^(\\d{3})-(\\d{4})$/;\nvar re10Digits = /^(\\d{3})-(\\d{3})-(\\\
  d{4})$/;\n//如果字段为空，则阻止提示\nif(event.value !=\"\"){\nif (re7Digits.test(event.value)==\
  \ false && re10Digits.test(event.value)== false){\napp.alert(\"抱歉，这不是有效的 7 位或 10\
  \ 位电话号码。\");\nevent.rc = false;\n}\n}\n```\n\n最后一个示例处理了输入带有连字符分隔的 7 位或 10 位代码的选项。虽然不如第一个电话示例复杂，但它展示了如何在一个验证中包含两个格式选项。通过使用`&&`（逻辑与），你要求判断两个条件是否为假或真。如果为真，则不会出现警告提示；如果为假，则会发出警告，并且字段将重置为空白。\n\
  \n你也可以将此示例用于日期文本字段。你可以将变量设置为类似如下格式，对应`mm/dd/yyyy`或`mm/dd/yy`：\n\n```\nvar re6Date\
  \ = /^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{2})$/;\nvar re8Date = /^(\\d{1,2})\\/(\\d{1,2})\\\
  /(\\d{4})$/;\n```\n\n对条件语句中的变量名稍作调整，使其匹配，并同时修改`app.alert`中的文本。请参考`Date 2`字段。用户输入日期时会有两个选项（`12/31/05`或`12/31/2005`）。但是请注意，如果这些数据要进入数据库，可能会引起错误，因此在设置替代日期输入之前，请先与数据库管理人员核实。此选项也不会对数字限制进行验证检查，例如不能处理输入第\
  \ 13 个月或检查闰年等特定月份的准确天数。使用相同格式的更精确的示例如下，将变量限制为 12 个月和 31 天，以及 1900 年代到 2000 年代：\n\
  \n```\nvar re6Date = /^(0[1-9]|1[012])\\/(0[1-9]|[12][0-9]|3[01])\\/(\\d{2})$/;\n\
  var re8Date = /^(0[1-9]|1[012])\\/(0[1-9]|[12][0-9]|3[01])\\/(19|20)\\d\\d$/;\n\
  ```\n\n但是，请记住，你仍然可以输入`02/30/2023`这样的内容，这并非实际存在的日期。因此，对于这种复杂情况以及其他复杂案例，可能需要考虑在脚本中进行超出本书范围的进一步复杂验证。如果你希望自行探索此日期的示例及进一步的修改建议，可以参考我的文件`Complex_Validation_Dates.pdf`。\n\
  \n**注意：**  \n随着 Acrobat Pro 的更新，你也可以将日期字段的格式设置为`Date`，以访问弹出菜单。如果需要查看此表单中的`Date`字段，请参考第\
  \ 1 章。但是，当你有两个备选日期选项时，请参考`Date 2`字段。你必须将“格式”选项卡设置为`None`，并将代码放在“验证”选项卡上。这样做将无法访问弹出菜单。此外，正如刚才提到的，为日期创建准确的正则表达式以避免错误可能很复杂，因此这是需要首先考虑的事项。\n\
  \n你可能会在一些代码示例中遇到的最后一个正则表达式是`(g)`，在进行全局搜索时，它有时会作为标志附加到表达式末尾。在前面的示例中，代码在没有它的情况下也能工作，因为我们只处理一个字段，而这个附加属性指示是否应针对字符串中的所有可能匹配项测试该正则表达式。文件`TMC_FieldValidationsEnd_2.pdf`展示了将`(g)`应用于代码的相同示例，供参考。\n\
  \n以下是用于名字和姓氏的示例：\n\n```\nvar re = /^[A-Z][a-z]+ [A-Z][a-z]+$/g;\n```\n\n\n\n## 格式化字段的最终思考\n\
  \n如你所见，如果设置了正确的警告和验证，就可以避免输入和选择中的错误。当你消除了表单中的不确定性，无论对自己还是对客户都能提供帮助。\n\n如果你计划使用第\
  \ 9 章中的灰色默认文本方法，并将其与本例中介绍的正则表达式示例结合使用，只需在\"格式\"选项卡上添加此自定义格式即可轻松实现。（请参见文件 `InvoiceForm_Shipping_Change_End_defaulttext.pdf`\
  \ 和 `TMC_FieldValidationsEnd.pdf` 中的示例。）请参考图 11-32；在此示例中，我使用的是\"姓名\"字段。\n\n![](img/449379_2_En_11_Fig32_HTML.jpg)\n\
  \n文本字段属性页面截图显示有 8 个选项卡，其中选择了\"格式\"选项卡。它有一个下拉菜单，可将格式类别选为\"自定义\"，后面是特殊选项，包括用于自定义格式脚本和自定义按键脚本的几行代码。\n\
  \n**图 11-32**\n\n如果你想使用\"格式\"选项卡添加默认文本，可以添加自定义格式脚本\n\n```\nif (!event.value){ event.value\
  \ = \"What is your First and Last Name?\";\nevent.target.textColor = color.gray;\n\
  }else{\nevent.target.textColor = color.black;\n}\n```\n\n如果尚未应用本章前面介绍的每个字段的验证代码，请务必使用。请参考图\
  \ 11-33；在此示例中，我使用的是\"姓名\"字段。\n\n![](img/449379_2_En_11_Fig33_HTML.jpg)\n\n文本字段属性页面截图显示有\
  \ 8 个选项卡，其中选择了\"验证\"选项卡。它有 3 个复选框，分别用于\"字段值未验证\"、\"字段值范围\"和\"自定义验证脚本\"。第三个选项\"运行自定义验证脚本\"\
  已被选中，后面跟着几行代码。\n\n**图 11-33**\n\n在\"验证\"选项卡上运行自定义验证脚本\n\n但是，对于该字段中的电话号码验证，需要对自定义格式脚本进行小幅调整，使其能够处理三种颜色而非两种颜色，并且仍然可以显示警报消息。请参考图\
  \ 11-34。\n\n![](img/449379_2_En_11_Fig34_HTML.jpg)\n\n文本字段属性页面截图显示有 8 个选项卡，其中选择了\"\
  格式\"选项卡。它有一个下拉菜单，可将格式类别选为\"自定义\"，后面是自定义选项，包括用于自定义格式脚本的几行代码。页面右侧有一个\"编辑\"按钮。\n\n\
  **图 11-34**\n\n在\"格式\"选项卡上更改自定义格式脚本\n\n以下是自定义格式代码：\n\n```\nvar rgexTele = /^[(]{0,1}[0-9]{3}[)]{0,1}[-\\\
  s\\.]{0,1}[0-9]{3}[-\\s\\.]{0,1}[0-9]{4}$/;\nif (!event.value){\nevent.value = \"\
  示例: 999-999-9999\";\nevent.target.textColor = color.gray;\n}\nelse if(rgexTele.test(event.value)){\n\
  event.target.textColor = color.black;\n}\nelse{\nevent.target.textColor = [\"RGB\"\
  ,1,0,0]; //将文本更改为红色\n}\n```\n\n> **注意：** 对包含两个变量的电话号码使用此方法时要谨慎，因为它可能导致问题，并且可能无法正确显示。另外，当字段格式设置为\"\
  日期\"时，不要使用默认文本，以避免在 Acrobat 中出现错误和警告；当字段格式设置为\"日期\"时，它无法接受任何其他文本。\n\n## 总结\n\n在本章中，你学习了为单选按钮和文本字段添加验证的几种方法。你还了解了将验证与格式化结合使用的多种方式，从而创建出能够在客户选择或输入错误信息时发出警报的字段，以及如何隐藏指定的单选按钮。\n\
  \n除了向客户发出警告外，单选按钮还可以在发票或订单表单中用于调整运费。它们还可以用于刷新或重置值，以便客户看到正确的信息。\n\n然后，你了解了一些可以应用于按钮、单选按钮和复选框的额外格式化方法，这些方法是通过文档级\
  \ JavaScript 实现的。\n\n最后，你还探索了多种正则表达式，它们可以在\"文本字段属性\"对话框的\"格式\"和\"验证\"选项卡中使用，而不仅仅是依赖\
  \ Acrobat 自带的格式化选项（例如\"特殊\"）。\n\n在下一章中，你将学习如何处理下拉列表。你将看到它们如何与文本字段以及其他下拉列表进行交互。\n\
  \n"
- "# 第 12 章：使用下拉列表\n\n到目前为止，你已经了解了如何使用 JavaScript 改进文本框、按钮、单选按钮和复选框。然而，还有其他类型的字段也可以实现动态效果。\n\
  \n**本章目标：** 你将学习如何将 JavaScript 与下拉列表（也称为*组合框*）结合使用，从而确保信息被准确输入或计算，避免客户输入错误信息。\n\n\
  > **注意：** 如果你想在本课中同步操作或查看最终结果，请从引言中的链接下载第 12 章 的文件。标有\"Start\"的文件是未包含代码的初始文件，标有\"\
  End\"的文件是最终结果。你还会找到包含原始 MS Word 和 PDF 文件的文件夹（如果你想编辑它们），以及一个包含原始脚本的文件夹（如果你想将它们添加到自己的\
  \ PDF 表单中）。\n\n如果你是从原始的 PDF 文件创建表单，请参考第 1 章中的\"表单审查\"部分。\n\n请记住，要查看字段的属性，你必须选择\"\
  准备表单\"工具；只有在此之后，你才能右键单击或双击一个字段来查看其属性。\n\n\n\n## 当前技能申请表\n\n在小公司中，雇主可能希望让员工向人力资源部提交一份表格，告知其当前的技能组合。在此示例中，员工从下拉列表中选择其部门名称，其姓名和其他一些信息会自动填入。如果其部门不在列表中，他们仍可在各个文本字段中自行输入这些信息。请参阅文件\
  \ `TMC_RequestForm_End.pdf`。参考图 12-1。\n\n![](img/449379_2_En_12_Fig1_HTML.jpg)\n\
  \n页面呈现了多个文本字段。从下拉列表中选择的部门名称“会计”会自动预先填入部门联系人、部门职位、部门电子邮件、部门编号和部门电话号码。\n\n**图 12-1**\
  \  \n当前技能申请表项目\n\n此自动操作包含两部分：一个文档级 JavaScript 和一个附加到下拉列表的脚本。首先介绍文档级 JavaScript。参考图\
  \ 12-2 和图 12-3。\n\n![](img/449379_2_En_12_Fig3_HTML.jpg)\n\n文档级 JavaScript 对话框的截图，脚本名称为\
  \ set select values。它有一个选定的关闭按钮。下方编辑器中已输入代码。\n\n**图 12-3**  \n文档级 JavaScript 对话框，其中通过“添加”按钮输入了脚本\
  \ `SetSelectValues`\n\n![](img/449379_2_En_12_Fig2_HTML.jpg)\n\n带有“添加”选项的 JavaScript\
  \ 图标和文档级 JavaScript 工具的截图。\n\n**图 12-2**  \n进入 JavaScript 工具并选择文档级 JavaScript 子工具\n\
  \n我创建的文档级 JavaScript 名为 `SetSelectValues`。我在编辑器中输入了以下代码：\n\n```\n//全局文档 SetSelectValues\
  \ 脚本\n// 将所有预填充数据放入单一数据结构\nvar DeptInfo = { Accounting:{ contact: \"Kathy Jones\"\
  ,\ntitle: \"Chief Officer\",\nemail: \"accounting@tmc.com\",\ndeptnum: \"tmc1434\"\
  ,\ndeptphone: \"999-999-9922\"},\nEngineering:{ contact: \"Frank R. Smith\",\ntitle:\
  \ \"Senior Specialist\",\nemail: \"engineering@tmc.com\",\ndeptnum: \"tmc1435\"\
  ,\ndeptphone: \"999-999-9921\" },\n\"Graphic Department\":{ contact: \"Nancy Smith\"\
  ,\ntitle: \"Artwork Planner\",\nemail: \"graphics@tmc.com\",\ndeptnum: \"tmc1436\"\
  ,\ndeptphone: \"999-999-9923\" },\nITSupport:{ contact: \"Troy Carson\",\ntitle:\
  \ \"Official Coder\",\nemail: \"it@tmc.com\",\ndeptnum: \"tmc1437\",\ndeptphone:\
  \ \"999-999-9927\" },\nMarketing:{ contact: \"Janice Walker\",\ntitle: \"Marketing\
  \ Advisor \",\nemail: \"marketing@tmc.com\",\ndeptnum: \"tmc1438\",\ndeptphone:\
  \ \"999-999-9925\" },\n\"Mine Site Safety\":{ contact: \"Rick James\",\ntitle: \"\
  Safety Officer\",\nemail: \"mss@tmc.com\",\ndeptnum: \"tmc1439\",\ndeptphone: \"\
  999-999-9924\"},\n};\nfunction SetSelectValues(cDeptName)\n{\nthis.getField(\"DeptContact\"\
  ).value = DeptInfo[cDeptName].contact;\nthis.getField(\"DeptTitle\").value = DeptInfo[cDeptName].title;\n\
  this.getField(\"DeptEmail\").value = DeptInfo[cDeptName].email;\nthis.getField(\"\
  DeptNumber\").value = DeptInfo[cDeptName].deptnum;\nthis.getField(\"DeptPhone\"\
  ).value = DeptInfo[cDeptName].deptphone;\n}\n```\n\n`SetSelectValues` 是一个函数，它调用名为\
  \ `DeptInfo` 的数组变量。请记住，数组/对象字面量是一种可以容纳多条信息的复杂变量。在上述数组中，共有六个部门。\n\n- 会计\n- 工程\n-\
  \ 图形设计部\n- IT 支持\n- 市场部\n- 矿场安全部\n\n每个部门都有五个需要填写的文本字段。\n\n- 联系人\n- 职位\n- 电子邮件\n\
  - 部门编号\n- 部门电话号码\n\n从某种意义上说，这变成了数组中的数组，即*嵌套数组*，如果有更多部门或拥有额外联系信息的员工，可以继续向此数组添加内容。\n\
  \n**注意**  \n虽然这种数组是通过索引访问的，但它看起来类似于第 9 章中提到的关联数组。就 JavaScript 而言，当指代方括号 `[ ]` 中的这些对象字面量时，更贴切的术语是*关联语法*。在此例中，它使用的是\
  \ `[cDeptName]`。然而，JavaScript 数组必须依赖数字索引，但作为对象，它们可以拥有命名索引。它不是使用索引或数字 0 到 3 来调用变量，而是使用文字来调用信息或对象字面量/变量。它也是嵌套的，因为它可以在一个对象字面量中包含另一个对象字面量。在本章后面，您将看到另一个也是嵌套的示例。\n\
  \n最后一部分，函数 `SetSelectValues` 现在必须从关联语法或对象中提取这些部分，以便从下拉列表中选择一个选项时，正确的信息或值能够按顺序过滤到文本字段中。\n\
  \n请注意每个字段如何调用名为 `cDeptName` 的项；然而，您在全局函数中任何地方都看不到它作为变量或关联语法的一部分。这是什么？`cDeptName`\
  \ 指的是下拉字段 `DepartmentNames`。参考图 12-4。\n\n![](img/449379_2_En_12_Fig4_HTML.jpg)\n\
  \n多个文本字段的截图，包含部门名称、部门联系人、部门职位、部门电子邮件、部门编号和部门电话。其中“部门名称”被高亮显示。\n\n**图 12-4**  \n\
  “准备表单”工具视图中的下拉列表和文本字段\n\n对于此下拉列表字段，我在“下拉选项”选项卡上勾选了“允许用户输入自定义文本”。这样，如果某个部门不在列表中，用户可以自行输入信息。同时勾选“立即提交所选值”，以便在松开下拉选择后，文本立即填充到其他字段。可以视情况勾选“检查拼写”框。在此例中，我们可能不想按字母顺序对项目排序，因此我保持其为未选中状态。参考图\
  \ 12-5。\n\n![](img/449379_2_En_12_Fig5_HTML.jpg)\n\n下拉属性对话框的截图，列出了“选项”选项卡下的项目、导出值、带有下拉列表的项目列表，以及已启用的选项：允许用户输入自定义文本、检查拼写和立即提交所选值。\n\
  \n**图 12-5**  \n文档级 JavaScript 中引用的“下拉属性”对话框的“选项”选项卡\n\n现在，在同一字段中，转到“格式”选项卡。参考图\
  \ 12-6。\n\n![](img/449379_2_En_12_Fig6_HTML.jpg)\n\n下拉属性对话框的截图，列出了“格式”选项卡下的选项，其中选择格式类别为“自定义”、自定义格式脚本和自定义按键脚本。这些脚本都有“编辑”按钮。\n\
  \n**图 12-6**  \n包含自定义设置和自定义按键脚本的“格式”选项卡\n\n在“格式”选项卡的“自定义按键脚本”部分输入以下 JavaScript：\n\
  \n```\n// 自定义格式脚本\nif( event.willCommit ){\nif(event.value == \" \"){\nthis.resetForm([\"\
  DeptContact\",\"DeptTitle\",\"DeptEmail\",\"DeptNumber\",\n\"DeptPhone\"]);\n}\n\
  else{\nSetSelectValues(event.value);\n}\n}\n```\n\n因此，您已创建此字段并将 JavaScript 应用到了自定义按键脚本区域（见图\
  \ 12-6）。该脚本会“提交”，因为这在“选项”选项卡上也已勾选（见图 12-5），并且会执行以下两项操作之一：\n\n- 如果您将下拉列表设为空白，则所有文本字段将变为空白或包含\
  \ `\" \"`。该列表将重置这些表单字段。\n- 否则（`else`），它将与文档级 JavaScript 中的函数 `SetSelectValues` 建立连接，以便信息或值能够传递到文本字段中。\n\
  \n\n\n若没有此功能触发器，下拉字段将无法将任何数据放入下拉列表中。请注意，如果在下拉列表中将选择项重新设置为空白信息，则字段会立即自动重置为空白，因为下拉列表是`willCommit`事件的一部分。如前所述，那些在列表中找不到自己信息的人，可以按需在空白文本区域或其下方的其他文本字段中输入自己的数据，或者你也可以在\"\
  常规\"选项卡中将这些字段设置为只读。\n\n> **注意：** 文本字段未应用任何 JavaScript 代码。\n\n## 零件订购表\n\n有时，客户必须浏览多个项目，再浏览多个子项目，才能找到他们正在寻找的确切信息或项目。例如，在零售工作环境中，可能有不止一种类型的螺丝、不止一种尺寸的\
  \ T 恤或不止一种颜色的产品。几乎在任何工作中，你都能找到有多种变体的项目，而这些变体的价格可能因尺寸和材料而异。\n\n零件订购表是这种场景的简化示例。请参阅\
  \ `TMC_PartsOrderForm_End.pdf` 文件。参考图 12-7。\n\n![](img/449379_2_En_12_Fig7_HTML.jpg)\n\
  \n一个包含表格的页面，该表格有 7 列，标题为：序号、标签、名称、描述、单价、数量和小计，并在最后一列下方有合计、折扣后小计、税额、运费和总计，以及一个额外的备注框。\n\
  \n**图 12-7** — 零件订购表项目中的下拉列表\n\n这次表单包含两个关联的下拉列表：名称 (`Row1.item`) 和描述 (`Row1.Description`)。至少有这样的五组设置。参考图\
  \ 12-8。\n\n![](img/449379_2_En_12_Fig8_HTML.jpg)\n\n一个包含名称和描述下拉列表的截图。名称包括钻头、润滑剂、齿轮和采矿设备，而描述包括小、中、大和超大。\n\
  \n**图 12-8** — 当前项目中两个关联的下拉列表\n\n一旦用户选择了名称，他们就可以选择描述。选择描述后，当用户跳出该字段时，零件的价格就会被设定。参考图\
  \ 12-9。\n\n![](img/449379_2_En_12_Fig9_HTML.jpg)\n\n一个表格有五列，标题为：序号、标签、名称、描述和单价，其对应的属性值为：名称为钻头，描述为小，价格为$19.95。\n\
  \n**图 12-9** — 描述下拉列表更改了价格字段\n\n客户只需决定他想购买多少个零件，订购表的价格和总计就会开始自动填充。用户稍后还可以添加折扣、税费和运费。我们稍后会查看这些字段。参考图\
  \ 12-10。\n\n![](img/449379_2_En_12_Fig10_HTML.jpg)\n\n一个包含表格的页面，该表格有 7 列，标题为：序号、标签、名称、描述、单价、数量（为\
  \ 3）和小计（为$59.85），以及合计、折扣后小计、税额、运费和总计（为$59.85）。\n\n**图 12-10** — 当客户输入数量时，这会改变总价\n\
  \n让我们深入看看。再次，你需要创建一些全局文档 JavaScript。参考图 12-11。\n\n![](img/449379_2_En_12_Fig11_HTML.jpg)\n\
  \n一个页面，顶部有 JavaScript 图标，包含添加选项卡和文档 JavaScript 工具。它包括文档 JavaScript 对话框，脚本名称为`set\
  \ each value`，并且`set each value`包含添加项目和计算行合计。关闭按钮被高亮显示。\n\n**图 12-11** — 影响项目中对话框内各个字段的文档\
  \ JavaScript 对话框设置\n\n如你所见，随着在其他行中增加另一个关联下拉列表及相关下拉列表，需要更多的 JavaScript 代码。\n\n你需要做的第一件事是创建你的关联语法/对象字面量数组和`addItems`函数。每个关联语法（`oArray`或`Object`）用一个逗号和方括号`[]`分隔。\n\
  \n\n\n```\n// 全局文档 addItems（添加项目）\nvar oArray = {\n钻头: [ [\"-\",\"无\"], [\"小号\"\
  ,19.95], [\"中号\",29.95], [\"大号\",39.95], [\"特大号\",44.95]],\n润滑剂: [ [\"-\",\"无\"\
  ], [\"油\",69.95], [\"油脂\",49.95], [\"超级顺滑\",79.95],[\"普通\",139.95]],\n齿轮:  [ [\"\
  -\",\"无\"], [\"小号\",149.95], [\"中号\",159.95], [\"大号\",219.95], [\"特大号\",339.95]],\n\
  采矿装备:[ [\"-\",\"无\"], [\"安全帽\",39.95], [\"镐\",29.95], [\"斧\",19.95],[\"铲\",49.95]]\n\
  };\nfunction SetDescriptionEntries(){\nif(event.willCommit){\nvar cRowName = event.target.name.split(\"\
  .\").shift();\nvar list = oArray[event.value];\nif( (list != null) && (list.length\
  \ > 0) ){\nthis.getField(cRowName + \".Description\").setItems(list);\n}\nelse{\n\
  this.getField(cRowName + \".Description\").clearItems();\n}\nthis.getField(cRowName\
  \ + \".Each\").value = 0;\n}\n}\n```\n\n## 备注\n\n如果出于某种原因需要在另一个页面上添加一组独立的下拉列表，则必须创建另一个文档级\
  \ JavaScript（如`addItems2`），然后更改关联语法/对象名称以及函数名称，以避免冲突或从错误的对象中调用项目。\n\n在之前的单一下拉列表示例中，你需要从下拉列表的项目中获取数据并将其复制到其他文本字段。一旦数组将项目粘贴到下拉列表（`Row1.item`），这次你需要将子项目复制到另一个名为\
  \ `Row1.Description` 的下拉列表。同样，如果名称下拉列表或项目中未找到任何值，则描述值将保持空白或被清除，并且没有可用选项。在此示例中，对于数组（`oArray`），关联语法分为四个项目名称，该语法的一部分随后将填充那些名称中包含“Row”或变量`cRowName`的字段。在此示例中，以下四个项目将以`cRowName`开头，填充与之对应的下拉列表`Row1.item`。它们分别是：\n\
  \n*   钻头\n*   润滑剂\n*   齿轮\n*   采矿装备\n\n`name`或（项目）的关联语法或对象的每个部分都会分为另一个用于子项目`Description`的下拉列表，以及一个包含每个项目单价的文本字段`Row1.Each`。你很快就会看到如何使用下一个函数来分离所调用的价格。\n\
  \n然后，你需要将`SetEachValue`函数添加为单独的文档级 JavaScript（图 12-11）。\n\n```\nfunction SetEachValue(){\n\
  if(!event.willCommit){\nvar cRowName = event.target.name.split(\".\").shift();\n\
  var nSelection = 0;\nif(!isNaN(event.changeEx))\nnSelection = event.changeEx;\n\
  this.getField(cRowName + \".Each\").value = nSelection;\n}\n}\n```\n\n这些字段的名称类似于`Row1.item`、`Row2.item`等。使用这种顺序或模式，文档级\
  \ JavaScript 可以通过函数轻松调用每个项目。由于此类表单非常复杂，因此使用有序且有意义的名称至关重要。\n\n如果事件不提交，由于感叹号（`!`）的覆盖，则该值将为\
  \ 0。这可以处理对象数组中任何缺失的数字。如果输入的是非数字（`NaN`）如单词，则该值将保持为 0。否则，函数 `SetDescriptionEntries()`（我们之前看到的）将输入在关联语法中找到的每个项目的价格/单价，并在每次新选择时更改。\n\
  \n`event.changeEx` 通常与列表菜单和组合框一起使用，以辅助更改选择。有关更多详细信息，请参阅此链接：\n[`https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html?highlight=changeex#event-properties`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsapiref/JS_API_AcroJS.html?highlight=changeex#event-properties)\n\
  \n每个项目的价格设置是从`description`下拉列表中选择的。描述和价格使用`split`方法拆分到各自的字段中，该方法从变量`cRowName`或项目处开始拆分，以将数组分解为包含名称中点（`\"\
  .\"`）的各个字段。你可以在调用的方法 `.split()` 和 `.shift()` 中看到这一点。`shift`方法移除对象关联示例 `[\"Oil\"\
  ,69.95]` 中的第一个项目，只留下价格，该价格现在将进入名为 `Row1.Each` 的每个项目单价字段。\n\n还有其他方法可用于向关联语法添加或移除元素或对象字面量。以下为您提供几个供参考：\n\
  \n*   `pop()`：移除数组的最后一个元素，并返回剩余元素（示例：`[\"Oil\",69.95]` => `Oil`）\n*   `push()`：向数组末尾添加一个新元素，并返回新的数组长度\n\
  *   `unshift()`：向数组开头添加新元素，并返回新的数组长度\n*   `splice()`：在数组任意位置添加/移除元素\n*   `join()`：将数组的所有元素连接成一个字符串\n\
  \n此外，由于每个元素都用逗号分隔，这也有助于进行移位和排序。\n\n有关这些方法及其更多功能的详细信息，请访问以下链接：\n\n*   [`www.w3schools.com/js/js_array_methods.asp`](http://www.w3schools.com/js/js_array_methods.asp)\n\
  *   [`www.w3schools.com/jsref/jsref_split.asp`](http://www.w3schools.com/jsref/jsref_split.asp)\n\
  *   [`www.w3schools.com/jsref/jsref_obj_array.asp`](http://www.w3schools.com/jsref/jsref_obj_array.asp)\n\
  *   [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array)\n\
  \n我在此处文档级 JavaScript 中创建了`SetEachValue`函数，因为我将多次使用它，并且希望能够根据我拥有的下拉列表数量，按需多次调用它。此外，我不必为每个字段重写此代码，这可能会导致错误。\n\
  \n最后一个文档级 JavaScript 函数（图 12-11）用于计算行的项目总计（`calculateRowTotal`）。但是，这不是小计或最终总计字段，只有在将所有多个项目加总后才能确定。请参考文件\
  \ `TMC_PartsOrderForm_End.pdf`。\n\n```\n// 全局文档 calculateRowTotal（计算行总计）\nfunction\
  \ CalculateRowTotal()\n{\nvar cRowName = event.target.name.split(\".\").shift();\n\
  event.value = this.getField(cRowName + \".Each\").value * this.getField(cRowName\
  \ + \".Qty\").value;\n}\n```\n\n该函数再次使用了`split`和`shift`方法。但是，只有价格（`.Each`）与数量字段（`.Qty`）相乘，以便现在计算出行的总价（`.ItemTotal`）。\n\
  \n与`SetEachValue()`函数一样，此函数也将被多次使用，这就是为什么要在“文档级 JavaScript”工具中创建它的原因。每当你认为某个函数会被多次使用时，最好在“文档级\
  \ JavaScript”工具中设置好它，以便后续调用。\n\n现在，你将查看零件订单表单的第一行，以了解所有内容是如何组合在一起的。我们将跳过标签字段，该字段格式化为“无”，因为它不是项目的一部分。请参考图\
  \ 12-12。\n\n![零件订单表单中的第一行](img/449379_2_En_12_Fig12_HTML.jpg)\n\n一个包含七列的表格，标题为序号、标签、名称、描述、单价、数量和项目总计，其中一行有对应的数据，并为名称和描述提供了下拉列表。\n\
  \n图 12-12\n\n\n\n## 设置第一个下拉列表\n\n第一个下拉列表 `Row1.item` 的设置如图 12-13 所示，以便它能够引用名为 `oArray`\
  \ 的关联语法/对象。在“选项”选项卡上，不要在“项目名称”或“导出值”字段中输入任何内容；这些字段需要保持空白，然后由文档 JavaScript 填充，如“结束”示例所示。\n\
  \n![]\n\n图 12-13：第一个下拉列表的“选项”选项卡上的下拉列表属性\n\n在“格式”选项卡的“自定义击键脚本”区域，调用在文档 JavaScript\
  \ 的`addItems`脚本中找到的`SetDescriptionEntries`函数。该函数引用了关联语法对象`oArray`，并用信息填充下一个下拉字段\
  \ `Row1.Description` 和文本字段 `Row1.Each`。当需要时，根据`.item`下拉列表中选择的内容，将数据传输到`.Description`下拉列表和`.Each`字段。请参考图\
  \ 12-14。\n\n![]\n\n图 12-14：第一个下拉列表（`.item`）中带有自定义击键脚本的“下拉列表属性”对话框的“格式”选项卡\n\n```\n\
  // Format Custom Keystroke for Name\nSetDescriptionEntries();\n```\n\n对于所有其他的名称项目下拉列表，可以重复这些步骤，以便在“选项”选项卡上引用“格式”选项卡并填充下拉列表。要了解如何在其他下拉字段中使用相同的函数，请参考图\
  \ 12-15。在我的“结束”文件中，可以右键单击该字段，然后从弹出菜单中查看属性。\n\n![]\n\n图 12-15：需要相同选项和格式设置的下拉字段，通过右键单击字段并从菜单中选择“属性”来访问\n\
  \n## 设置描述下拉列表\n\n描述下拉列表 `Row1.Description` 保持空白，并且不在其“选项”选项卡上预设任何内容。JavaScript 将为您完成这项工作。请参考图\
  \ 12-16。\n\n![]\n\n图 12-16：第一行第二个下拉列表的“下拉列表属性”对话框的“选项”选项卡\n\n现在在“格式”选项卡的“自定义击键脚本”区域调用`SetEachValue`函数，以将值获取到每个字段（`.Each`）的价格中，并且可以将其添加到其他（`.Description`）字段中。请记住，如果价格被排除在关联语法之外或者是文本，则价格将显示为\
  \ 0 或$0.00。请参考图 12-17。\n\n![]\n\n图 12-17：第二个下拉列表（`.Description`）的自定义击键脚本\n\n```\n\
  // Format Custom Keystroke for Description\nSetEachValue();\n```\n\n此代码被输入到每个描述下拉列表中。请参考图\
  \ 12-18。\n\n![]\n\n图 12-18：需要相同选项和格式设置的下拉字段\n\n## 设置价格字段\n\n名为 `Row1.Each` 的每个字段的价格中没有\
  \ JavaScript。其设置来自前一个下拉列表（`.Description`）中的`SetEachValue`函数。但是，该文本字段已格式化为数字，保留两位小数，并带有货币符号。请注意，货币符号未添加到文档\
  \ JavaScript 中；只添加了数字。这些字段在“常规”选项卡上设置为只读。请参考图 12-19。\n\n![]\n\n图 12-19：为（`.Each`）在“格式”选项卡上设置为“数字”的文本字段属性\n\
  \n## 设置数量字段\n\n对于数量列 `Row1.Qty` 也是如此。它不包含 JavaScript。只需将其格式化为数字，不带货币符号，并将小数位数设置为\
  \ 0。此字段稍后将被引用，但未设置为只读。请参考图 12-20。\n\n![]\n\n图 12-20：为（`.Qty`）在“格式”选项卡上设置为不带货币符号的“数字”的“文本字段属性”对话框\n\
  \n## 设置项目总计字段\n\n最后一个字段 `Row1.itemTotal`（格式化为数字，保留两位小数并带有货币符号，如图 12-19 所示），现在在“计算”选项卡上作为自定义计算脚本，将“单价”和“数量”字段的信息相乘。同样，该计算函数是从文档\
  \ JavaScript 部分引用的，并且可以应用于多个字段。请参考图 12-21。\n\n![]\n\n图 12-21：为（`.itemTotal`）在“计算”选项卡的自定义计算脚本中设置的文本字段属性\n\
  \n```\n// Calculate Script Items\nCalculateRowTotal();\n```\n\n我在“常规”选项卡上将 `itemTotal`\
  \ 字段设置为只读。\n\n## 设置最终计算字段\n\n现在确保您的字段：小计、折扣、税费、运费和总计，都按照图 12-19 中的方式格式化为数字，保留两位小数并带有货币符号。小计和总计应在“常规”选项卡上设置为只读，以防止客户端覆盖数字。请参考图\
  \ 12-22。\n\n![]\n\n图 12-22：项目中需要在预览和编辑模式下计算的最终文本字段\n\n\n\n在过去的发票表单中，您使用过`value`或简化域表示法来操作这些字段。在这里，您可能想使用这些选项来累加`subTotal`和最终的`Total`字段。请参考图\
  \ 12-23。\n\n![文本字段属性对话框截图，显示“计算”选项卡下的选项，其中启用的值为“行的总和”及简化域表示法](img/449379_2_En_12_Fig23_HTML.jpg)\n\
  \n**图 12-23**\n\n在“计算”选项卡上，对于基本场景，`SubTotal`和`Total`的计算不需要使用 JavaScript。\n\n虽然前面的示例可以工作，但我发现它们有些小问题，而且刷新效果不佳。我们不希望表单用户因输入无法顺畅工作而感到沮丧和困惑。最终，我发现需要用\
  \ JavaScript 进行所有加减运算，这样表单才能顺畅运行。在`Subtotal`字段中，我将以下脚本放入“计算”选项卡的“自定义计算脚本”字段中。请参考图\
  \ 12-24。\n\n![文本字段属性对话框截图，显示“计算”选项卡下的选项，其中启用了自定义计算脚本，包含行项目总额的变量，并高亮了关闭按钮](img/449379_2_En_12_Fig24_HTML.jpg)\n\
  \n**图 12-24**\n\n`SubTotal`字段的“计算”选项卡上的文本字段属性\n\n```\n// Subtotal Script\nvar a\
  \ = this.getField(\"Row1.itemTotal\");\nvar b = this.getField(\"Row2.itemTotal\"\
  );\nvar c = this.getField(\"Row3.itemTotal\");\nvar d = this.getField(\"Row4.itemTotal\"\
  );\nvar f = this.getField(\"Row5.itemTotal\");\nevent.value = a.value + b.value\
  \ + c.value + d.value + f.value;\n```\n\n如您所见，这类似于您在前面的课程（如第 6 章）中尝试过的示例。对于`Total`字段，请参考图\
  \ 12-25。\n\n![文本字段属性对话框截图，显示“计算”选项卡下的选项，其中启用了自定义计算脚本，包含小计、折扣、税费和运费的变量，禁用的按钮为“值不计算”、“值是字段”及简化域表示法](img/449379_2_En_12_Fig25_HTML.jpg)\n\
  \n**图 12-25**\n\n`Total`字段的“计算”选项卡上的文本字段属性\n\n然后，对于“总计”或`Total`字段，我使用了以下自定义计算脚本：\n\
  \n```\n// Total Script\nvar g = this.getField(\"SubTotal\");\nvar h = this.getField(\"\
  Discount\");\nvar j = this.getField(\"Tax\");\nvar k = this.getField(\"Shipping\"\
  );\nevent.value = g.value - h.value + j.value + k.value;\n```\n\n对于这个基础示例，这是对我而言效果最好的方法。\n\
  \n请记住，如果您的字段没有按正确顺序跳转，请务必像在前面的章节中所做的那样，使用“准备表单”菜单中的“更多”来检查您的“Tab 键顺序”编号和“字段计算顺序”。反复测试表单对于获得正确的计算至关重要。当客户在复杂计算中出错时，您还需要添加一个“重置”按钮供他们使用。\n\
  \n## 使用选择日期和折扣的下拉列表\n\n格式化为日期的下拉列表可以触发对特定或当前价格的折扣。\n\n在此示例中，在文件`Discount_End.pdf`中，用户可以输入一个价格，然后从下拉列表中选择一个日期，以查看折扣百分比以及价格折扣。然后他们将看到新的最终价格。在此示例中，您不需要使用文档级\
  \ JavaScript。请参考图 12-26。\n\n![页面显示了自定义价格、带有下拉列表的折扣日期、折扣百分比、价格折扣和最终价格，其对应值分别为 500.00\
  \ 美元、2023 年 9 月 3 日、25.00%、125.00 美元和 375.00 美元](img/449379_2_En_12_Fig26_HTML.jpg)\n\
  \n**图 12-26**\n\n根据设定的日期计算价格折扣\n\n对于您自己的项目，如果您要计算某些商品的价格（这些商品通常有一个固定价格，但在销售日期会贬值），这个功能可能会很有用。\n\
  \n此示例中的下拉列表包含一些设定的日期，每个日期在“选项”选项卡上都被赋予了一个导出值百分比。例如，0.25 代表 25%。请参考图 12-27。\n\n![带有折扣日期的文本字段截图，以及下拉列表属性对话框截图，显示“选项”选项卡，其中项目为\
  \ 2023 年 9 月 3 日、导出值为 0.25、项目列表从下拉列表中选择了 2023 年 9 月 3 日，并启用了“提交选定的值”](img/449379_2_En_12_Fig27_HTML.jpg)\n\
  \n**图 12-27**\n\n在“选项”选项卡上添加项目日期和值，并选择“提交选定的值”\n\n然后，我在“格式”选项卡上将类别设置为“日期”，并确保选择了与我在“选项”选项卡上输入和添加项目时相似的格式。请参考图\
  \ 12-28。\n\n![下拉列表属性对话框截图，显示“格式”选项卡下的选项，其中格式类别选择为“日期”，且从下拉列表中选择了日期格式为“mm/dd/yyyy”](img/449379_2_En_12_Fig28_HTML.jpg)\n\
  \n**图 12-28**\n\n在“格式”选项卡上将您的下拉列表字段格式化为日期\n\n> **注意：** 只有文本字段可以使用日期选择器，下拉列表格式化为日期后不能使用，因为我们只是从列表中选取一个日期。\n\
  \n接下来的三个文本字段设置为“只读”。`DiscountPercent`字段格式化为“百分比”。然后，`PriceDiscount`和`GrandTotal`字段都格式化为“数字”，并带有货币符号和两位小数。对于这三个字段，我在“计算”选项卡上设置了自定义计算脚本。这样我就能查看下拉列表`DiscountDate`中选项的导出值。请参考图\
  \ 12-29。\n\n![文本字段属性对话框截图，显示“计算”选项卡下的选项，其中启用了自定义计算脚本。脚本框中输入了`event.value = this.getField(\"\
  DiscountDate\").value;`](img/449379_2_En_12_Fig29_HTML.jpg)\n\n**图 12-29**\n\n在“计算”选项卡上设置自定义计算脚本\n\
  \n对于`DiscountPercent`文本字段，您可以通过调用`DiscountDate`的值来获取日期值。\n\n```\nevent.value = this.getField(\"\
  DiscountDate\").value;\n```\n\n对于`PriceDiscount`文本字段，您可以将当前价格乘以折扣日期值。\n\n```\nevent.value\
  \ = this.getField(\"CurrentPrice\").value * this.getField(\"DiscountDate\").value;\n\
  ```\n\n对于`GrandTotal`文本字段，您可以从当前价格中减去价格折扣。\n\n```\nevent.value = this.getField(\"\
  CurrentPrice\").value - this.getField(\"PriceDiscount\").value;\n```\n\n## 总结\n\n\
  在制作包含多个下拉列表的复杂表单时，最好先在纸上或绘图程序中规划好，并决定您想要做什么。您可能需要一个数组、带对象字面量的关联语法或一个全局函数，但请先全部写下来。\n\
  \n一旦您构建好表单（类似于我所做的），请确保数字区域已正确格式化为“数字”或“自定义”，然后添加 JavaScript。测试表单，或者让其他人也测试一下。在客户使用之前找出所有问题至关重要。这里的重点是避免客户出错和感到沮丧，并在处理表单中的字段时获得您想要的结果。\n\
  \n\n\n### 加载冗长的单个下拉菜单或列表菜单\n\n虽然不如之前的示例复杂，但有时你可能只需要加载一个包含 30 个或更多项目的单个下拉列表，而这些项目不会影响表单中的其他字段或菜单。请参阅此示例中的\
  \ `Load Single Menu` 文件夹。参考文件 `TMC_LoadDropDown_end.pdf`。\n\n将这些内容输入到下拉菜单或列表框菜单中可能需要大量操作：你必须选择\
  \ `选项` 选项卡，输入项目名称，输入导出值，然后为每个项目单击 `添加` 按钮。此外，你可能希望在多个经常更改的菜单中使用相同的信息（请参阅文件 `Time_Sheet_End_multiload.pdf`）。为了在冗长的单个菜单上节省时间，我额外包含了这些文件，在这些文件中，我将下拉列表（组合框）或列表框的所有代码都放入了全局文档\
  \ JavaScript 区域。我将此函数命名为 `LoadOptions`。你可以在以下页面查看代码，并且在提供的文本文件以及 `Scripts` 文件夹中也可以找到它。与往常一样，请确保字段名称与\
  \ JavaScript 中编写的名称一致，以便连接能够正常工作。请参阅图 12-30。\n\n![](img/449379_2_En_12_Fig30_HTML.jpg)\n\
  \n显示 **JavaScript** 图标的屏幕截图，其中包含“添加选项”和“文档 JavaScript”工具。它包括文档 JavaScript 对话框，脚本名称为“load\
  \ options”，以及“load options”框和一个带有代码的编辑器。旁边的下拉列表突出显示了“选择矿物”选项。\n\n**图 12-30**\n\n\
  文档 JavaScript 对话框中的 `LoadOptions` 脚本以及引用的下拉列表将加载项目和值\n\n以下代码被添加到文件 `TMC_LoadDropDown_end.pdf`\
  \ 的文档 JavaScript 工具中的编辑器：\n\n```\n// define array of entries and export values for\
  \ drop-down array\n// define array of minerals and abbreviations\nvar aMinerals\
  \ = new Array([\"Select Mineral\", \"\"],\n[\"Diamond\", \"DI\"],\n[\"Emerald\"\
  , \"EM\"],\n[\"Garnet\", \"GA\"],\n[\"Opal\", \"OP\"],\n[\"Ruby\", \"RB\"],\n[\"\
  Sapphire\", \"SP\"]);\n// function to load a combo/list box with an array of values\n\
  function LoadOptions(oField, aValues) {\nvar bResult = false;\n// load array of\
  \ values into field object\nif(oField.type != \"combobox\" && oField.type != \"\
  listbox\") {\napp.alert(\"Load Options function requires a combobox or listbox\"\
  , 0, 0);\nbResult = false;\n}\nelse{\noField.setItems(aValues); // set values\n\
  bResult = true;\n}\nreturn bResult;\n} // end LoadOptions\n// load the data - comment\
  \ out the following two lines after updating when only doing array changes to reset\n\
  LoadOptions(this.getField('Dropdown1'), aMinerals);\nLoadOptions(this.getField('ListBox1'),\
  \ aMinerals);\n```\n\n前面的示例仅适用于在同一个表单中加载下拉列表或列表框的列表项和导出值。如果你尝试将其加载到另一种类型的表单字段中，将会收到错误警报。这些字段引用的是名为\
  \ `aMinerals` 的数组。还要注意，如果你想加载并获取一个字段，可以使用单直引号（`''`）而不是双直引号（`\"\"`）。如果你检查字段的 `选项`\
  \ 选项卡，可以验证数组的 `oField` 和 `aValues` 是否正在加载和设置。\n\n如果你没有使用列表框，可以注释掉那一行，或者添加更多的 `LoadOptions`\
  \ 函数（如果其他命名的下拉字段需要可能经常更改的相同对象字面量）。请记住为所有下拉列表或列表框字段指定不同的名称。\n\n我们将在下一章中更详细地讨论列表框。\n\
  \n### 使用 JavaScript 更改下拉列表自定义格式的技巧\n\n与文本字段类似，你可以使用 `外观` 选项卡属性，或者使用 `文档 JavaScript`\
  \ 对话框、`动作` 选项卡，或 `格式` 选项卡设置为 `自定义` 和自定义格式脚本区域来格式化大多数下拉列表组合框。\n\n与文本字段一样，该字段可用的属性是第\
  \ 10 章中提到的那些，包括 `fillColor`、`strokeColor`、`lineWidth`、`borderStyle`、`textColor`、`textFont`、`textSize`\
  \ 和 `rotation`。你不能使用 `fontFamily`，因为它用于富文本字段设置或注释中。此外，你也不能使用对齐方式来居中文本；默认情况下它将保持左对齐。不过，对于包含多个单词的项目，你可以在文本中添加空格，甚至在代码的早期行中添加一个\
  \ `\\t` 来添加制表符空格，如下所示：\n\n```\n[\"\\tDiamond\", \"DI\"],\n```\n\n然而，经过实验，我发现这似乎只影响用户跳出（tab\
  \ out）后的列表框和下拉列表（组合框），在选中时无效。`\\n` 也是如此。如果你尝试添加新行，必须跳出该字段才能正确显示。你还需要调整下拉列表的高度以适应这种情况。\n\
  \n```\n[\"\\tDiamond\\nMineral\", \"DI\"],\n```\n\n此外，似乎即使尝试在自定义 `格式` 区域调整代码，富文本（即使用户在列表中输入了自定义内容，或者无法格式化）也会在调试器中引发错误。有关更多详细信息，请参考此链接：\n\
  \n[`https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsdevguide/JS_Dev_AcrobatForms.html#44065`](https://opensource.adobe.com/dc-acrobat-sdk-docs/library/jsdevguide/JS_Dev_AcrobatForms.html#44065)\n\
  \n## 本章小结\n\n在本章中，在处理下拉列表和文本框时，你遇到了一些复杂的 JavaScript。你学习了嵌套关联/对象字面量如何像数组一样工作，以及如何从这些关联语法函数中提取信息。你还了解了文档\
  \ JavaScript 的好处，以及在一个位置编写脚本如何节省时间，从而不必在多个位置进行多次编辑；你只需引用该脚本或其他字段即可。\n\n在下一章中，你将更详细地研究可能是最被低估的字段之一：列表框。你刚刚看到，与下拉列表一样，你可以使用文档\
  \ JavaScript 将文本加载到列表框中。但是，它们不如下拉列表紧凑，那么你还能用它们做什么呢？\n\n"
- '# 13. 使用列表框


  **章节目标：** 你将探索的最后一种主要表单字段类型是列表框。根据我的经验，列表框是最被低估的表单字段。虽然它们可能不如下拉列表紧凑，但它们对于帮助组织优先事项列表非常有用。让我们探索在各种项目中使用列表框的一些想法。请参阅图
  13-1。


  **注意**


  如果你想在本课程中一起操作或查看最终结果，请从引言中的链接下载第 13 章的文件。标记为“开始”的文件是没有代码的文件，标记为“结束”的文件是最终结果。你还可以找到包含原始
  MS Word 和 PDF 文件的文件夹（如果你想要编辑它们），以及一个包含原始脚本的文件夹（如果你想要将它们添加到自己的 PDF 表单中）。


  如果你正在从一份不包含表单字段的原始 PDF 创建表单，请参阅第 1 章中的“表单回顾”部分。


