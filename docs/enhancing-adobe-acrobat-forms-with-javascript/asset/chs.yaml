- "# 11. 文本框、提示框和单选按钮的验证\n\n第三部分的 JavaScript 变得更加复杂，因为多个表单字段需要协同工作。\n\n正如您在之前的示例中所看到的，为避免错误，您需要创建警告或提示，以便客户输入正确的信息。\n\
  \n**本章目标：** 文本框并非唯一可以应用提示或选项的字段项。您也可以使用单选按钮。在本章中，您将学习如何操作。\n\n注意\n\n如果您想跟着本课练习或查看最终结果，请从引言中的链接下载第\
  \ 11 章的文件。标有“开始”的文件是未包含代码的文件，标有“结束”的文件是最终结果。如果您想编辑它们，您还会找到包含原始 MS Word 和 PDF 文件的文件夹，以及一个包含原始脚本的文件夹（如果您想将它们添加到您自己的\
  \ PDF 表单中）。\n\n如果您是从原始 PDF 创建表单，请参考第 1 章中的“表单回顾”部分。\n\n请记住，要查看字段的属性，必须选择“准备表单”工具；只有这样才能右键单击或双击字段以查看其属性。\n\
  \n\n\n## 转账示例\n\n转账示例是验证如何应用于其属性对话框中没有`Validate`选项卡的字段的一个绝佳示例。请参考图 11-1。\n\n![](img/449379_2_En_11_Fig1_HTML.jpg)\n\
