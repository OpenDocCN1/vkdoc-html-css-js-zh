- "# 20. 什么是电子签名表单和网页表单？\n\n**章节目标：** 在本章中，我们将探讨 Acrobat Pro 中一些较新的表单工具，以及它们与前几章讨论的\
  \ JavaScript 表单之间的关系。\n\n虽然本章并非专门介绍使用 JavaScript 的 Acrobat 表单，但了解 Acrobat 中的其他新增可选工具以及可与应用程序连接以创建各种电子表单的外部链接仍然很重要。我们将研究两个相关的示例以及您可以在\
  \ Adobe Acrobat 官网上找到的其他资源。请参考图 20-1 和图 20-2。\n\n一张窗口截图，显示了“表单和签名”下的 Adobe Acrobat\
  \ 工具。包括`请求电子签名`、`填写和签名`、`准备表单`、`证书`、`创建网页表单`、`批量发送`、`添加电子签名品牌`和`收款`。\n\n**图 20-2**\
  \ – 工具“表单和签名”部分中的新表单工具\n\n一张 Adobe Acrobat 工具栏截图，显示了“主页”和“工具”选项。在“工具”选项下方有一个搜索栏。\n\
  \n**图 20-1** – Acrobat Pro 工具选项卡\n\n> **注意：** 要完成本章的作业，请务必从前言中的链接下载第 20 章的文件夹。\n\
  \n您也可以通过主菜单中的`电子签名`下拉列表找到本章讨论的一些选项。这些设置的外观可能会因您使用的 Acrobat Pro 版本而异。您可以参考以下页面了解更多详情：`https://helpx.adobe.com/acrobat/using/send-for-signature-new-experience-a.html`。请参考图\
  \ 20-3。\n\n一张窗口截图，展示了`电子签名`工具下的一个下拉列表。列表中包含`请求电子签名`、`自己填写和签名`、`创建网页表单`、`批量发送`、`添加电子签名品牌`、`收款`、`准备协议`和`管理所有协议`。\n\
  \n**图 20-3** – 主菜单`电子签名`下拉选项\n\n## 快速了解请求电子签名及相关资源\n\n电子签名是一种数字或电子签名，您可以利用它让客户在线签署表单。在某些情况下，客户无需与其它表单字段交互，只需签署文档的数字签名部分即可。在这些情况下，当签名的重要性超过其他字段的需求，且您需要通过电子邮件以表单形式安全地收集多个签名时，电子签名表单是一个非常有用的工具。\n\
  \n在第 19 章中，我们简要探讨了`准备表单`工具中数字签名字段的重要性。请参考图 20-4。\n\n一张字段名称弹出框的截图。它显示了一个空白字段，准备添加`签名\
  \ 1`。一条注释写道：“添加数字签名，从属性视图中添加签名选项。” 包含一个“必填字段”复选框，以及一个“所有属性”链接。\n\n**图 20-4** – 常规表单允许您添加数字签名\n\
  \n对于此类表单字段，我们可以在其属性区域的`操作`和`已签名`选项卡中应用 JavaScript。请参考图 20-5。\n\n一张数字签名属性对话框的截图。它显示了“已签名”选项卡下的选项。“签名后无反应”选项已被选中。\n\
  \n**图 20-5** – 显示`已签名`选项卡的数字签名属性对话框\n\n正如我们在前几章中所了解到的，其他表单字段，例如文本字段、下拉列表、单选按钮和复选框，都可以在其属性对话框的不同选项卡中添加操作。\n\
  \n然而，如前所述，有些类型的表单更侧重于收集数字签名，而非进行计算或仅输入文本。这些被称为电子签名或电子签名请求。\n\n使用我们过去使用的 Acrobat\
  \ 表单时，通常需要借助其他工具来完成签名过程，例如`填写和签名`和`证书`。请参考图 20-6。\n\n两张截图，分别显示`填写和签名`工具图标及其下方的“打开”按钮，以及`证书`工具图标及其下方的“添加”按钮。\n\
  \n**图 20-6** – 表单工具`填写和签名`与`证书`\n\n您可以在以下页面了解更多信息：\n\n`https://helpx.adobe.com/acrobat/using/signing-pdfs.html`\n\
  \n`https://helpx.adobe.com/acrobat/kb/certificate-signatures.html`\n\n`https://helpx.adobe.com/acrobat/using/securing-pdfs-certificates.html`\n\
  \n然而，随着表单构建流程越来越侧重于多个客户或参与者的签名，`准备表单`工具已添加了特定类型的表单字段，以便独立于我们在本书中讨论的传统 Acrobat 表单来构建此类表单。请参考图\
  \ 20-7。\n\n一张`准备表单`工具图标及其下方的“添加”按钮的截图。\n\n**图 20-7** – `准备表单`工具\n\n在选择`准备表单`工具后，当您选定一个\
  \ PDF 文件并勾选“此文档需要签名”选项，然后单击`开始`按钮时，即可启用此类表单及其选项。并且，与之前的示例一样，请确保表单字段自动检测功能处于`开启`状态。请参考图\
  \ 20-8。\n\n一张窗口截图，显示了一个待扫描以开始文件的文档，位于“单个文件”选项下。已勾选“此文档需要签名”选项并选中了`开始`按钮。\n\n**图\
  \ 20-8**\n\n\n\n## 为单个选定文件准备表单工具设置\n\n请注意，如果文件中已存在某些字段，系统可能会提示您先另存一份文档副本，然后再继续添加字段。\n\
  \n但是，如果您从一个没有字段的单个文件开始，选择**新建**并从头开始创建一个空白文档，或创建一个新表单，则系统不会要求您先保存文件。在这种情况下，您只需在完成表单字段调整后再保存文件。请参考图\
  \ 20-9。\n\n![](img/449379_2_En_20_Fig9_HTML.jpg)\n\n屏幕截图显示一个窗口，其中有一个空白区域，用于在**新建**选项下创建文档。同时选中了**本文档需要签名**选项和**开始**按钮。\n\
  \n**图 20-9** — 为新的空白文件准备表单工具设置\n\n> **注意：** **扫描仪**选项适用于您直接处理当前放在扫描仪平板上的扫描文档的情况。我们将在本章的“什么是\
  \ Web 表单”部分介绍**创建 Web 表单**选项。请参考图 20-9。\n\n在本例中，我将使用一个在 Word 中创建，然后转换为 PDF 并添加了表单字段的工时表。如果您想比较常规\
  \ PDF 表单与需要签名的表单，我还提供了原始 Word 和 PDF 表单。您可以打开名为 `Timesheet_End.pdf` 和 `Timesheet_esign_End.pdf`\
  \ 的文件，并根据练习需要重命名它们。打开新文件，点击**准备表单**工具，逐个查看每个示例中的字段。不过，目前重点是电子签名表单。请参考图 20-10。\n\n\
  ![](img/449379_2_En_20_Fig10_HTML.jpg)\n\n屏幕截图显示一个窗口，其中呈现了**准备表单**工具图标，下方有一个**添加**按钮。它显示了一个名为**图尔玛琳矿业公司每周项目工时表**的表格。该表格列出了员工信息，底部有备注、**管理员签名**和日期字段。\n\
  \n**图 20-10** — 准备表单工具以及一个包含签名和其他字段的 PDF 工时表\n\n这些表单字段的属性将仅限于签名分配。如果您从头开始构建此表单并要求签名，则无法在属性中添加自定义\
  \ JavaScript 或任何形式的操作。您可以通过右键单击字段并从弹出列表中选择**属性**来打开此对话框。请参考图 20-11。\n\n![](img/449379_2_En_20_Fig11_HTML.png)\n\
  \n**文本字段属性**对话框的屏幕截图显示了**常规**选项卡下的选项。它显示了名称和工具提示为**employee's name**、字段类型、参与者角色、签名者电子邮件以及带有表单字段和方向选项的常见属性。**关闭**按钮位于底部。\n\
  \n**图 20-11** — 文本字段属性对话框的常规选项卡\n\n在**文本字段属性**对话框中，您只能使用**常规**、**外观**、**位置**和**选项**选项卡。\n\
  \n这里没有用于创建计算、添加验证或向文本字段添加自定义操作的设置。**外观**、**位置**和**选项**选项卡中的属性与创建常规 Acrobat 表单时找到的属性相同。\n\
