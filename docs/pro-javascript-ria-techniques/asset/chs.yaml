  \ | **限制** |\n| --- | --- |\n| `<a>` | 不能包含其他 `<a>` 标签 |\n| `<pre>` | 不能包含 `<img>`、`<object>`、`<big>`、`<small>`、`<sub>`\
  \ 或 `<sup>` 元素 |\n| `<button>` | 不能包含 `<input>`、`<select>`、`<textarea>`、`<label>`、`<button>`、`<form>`、`<fieldset>`、`<iframe>`\
