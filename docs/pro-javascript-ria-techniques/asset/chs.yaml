- '# 呈现


  到目前为止，本书展示了如何根据最佳实践来开发代码，以及如何调整代码以从 Web 应用中获得卓越的性能和响应性。在这本书的第三部分（也是最后一部分），我将带你进入用户界面的领域，向你介绍相关技术和第三方可复用组件，这些将帮助你构建一个外观更美观、行为更出色的
  RIA。或许你还会受到启发，开发自己的可复用组件，并与 Web 开发社区的其他成员分享！


