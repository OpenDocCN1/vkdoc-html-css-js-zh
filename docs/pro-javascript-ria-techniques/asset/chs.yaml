  现在，您已通过 JavaScript 向页面添加了新控件，您需要在`Listing 7-3`的 HTML 页面中引用的`my-example.css`文件中设置\
  \ CSS。请注意，您通过`Listing 7-4`中的 JavaScript 创建的播放头控件由页面上的以下 HTML 代码生成：\n\n```\n<div\
  \ id=\"playhead\">\n  <div id=\"playhead- position\"></div>\n</div>\n```\n\n使用 CSS\
  \ 将其样式设置为类似进度条的效果，详见第 5 章。\n\n构建好示例页面的基本框架后，您就可以使用可重用组件在页面中嵌入视频文件，并将页面上的控件与视频文件的播放处理连接起来。我们将介绍两种基于\
  \ Adobe Flash Player 的可重用组件：YouTube Chromeless Player 和 JW FLV Player。\n\n**使用 YouTube\
  \ Chromeless Player**\n\n迄今为止，最流行的视频上传和分享网站是谷歌旗下的 YouTube 网站（http://www.youtube.com/）。通过此服务将您的视频文件托管在谷歌的分布式\
  \ CDN 上，通常能比您自己托管获得更好的性能，正如您在第 4 章中所了解的那样。\n\n一直以来，您都可以将标准的 YouTube 播放器嵌入到您自己的网站中，但谷歌最近为开发者提供了一个新版本的播放器。这个版本被称为\
  \ YouTube Chromeless Player，它移除了所有默认的播放控件，仅保留视频本身。这使您能够创建自己的自定义控件，通过公开的 JavaScript\
  \ API 来操控 YouTube 视频。图 7-3 展示了带有自定义控件的 YouTube Chromeless Player 示例。\n\n■**注意**\
  \ 应用程序的*chrome*被定义为主要关注点周围的控件和其他元素。在这种情况下，*Chromeless*表示视频本身周围没有任何控件。\n\n**图 7-3.**\
  \ 页面上带有自定义 HTML 控件的 YouTube Chromeless Player\n\n使用 Chromeless Player 的要求是 Flash\
  \ Player 版本 8 或更高，并且自然也需要 JavaScript。YouTube Chromeless Player 的完整参考信息可在以下网址获得：\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，对给定的英文文本进行翻译。\n\n译文如下：\n\n\n[`code.google.com/intl/en/apis/youtube/chromeless_player_reference.html`](http://code.google.com/intl/en/apis/youtube/chromeless_player_reference.html)\n\
  \n与大多数第三方组件（它们将所有必需的代码封装在自己的 JavaScript API 中）不同，YouTube Chromeless Player 不包含用于将\
  \ Flash 影片组件实际放置到页面中的代码。相反，Google 推荐使用一个名为 `SWFObject` 的第三方 JavaScript 组件，该组件也方便地托管在\
  \ Google 的 CDN 上。\n\n### SWFObject 组件\n\n`SWFObject` 是一个 JavaScript 组件，允许你在页面中嵌入\
  \ Flash 影片文件。它还提供了检测当前安装的 Flash Player 插件版本的功能，从而允许你仅当用户浏览器中存在特定版本的播放器时，才嵌入需要该版本的影片文件。它还克服了\
  \ IE 浏览器中一个恼人的许可限制，即必须先点击 Flash 内容才能播放。\n\n你可以[从其项目主页 http://code](http://code.google.com/p/swfobject/).google.com/p/swfobject/\
  \ 下载 `SWFObject` 组件。该组件也由 Google 直接托管在 http://ajax.googleapis.com/ajax/libs/swfobject/2.1/swfobject.js。在撰写本文时，该组件的当前版本是\
  \ 2.1。\n\n使用 `SWFObject` 组件在页面中嵌入 Flash 文件与使用任何其他第三方组件非常相似。首先，将组件的 JavaScript API\
  \ 包含在 `<head>` 标签内，或 HTML 的底部、`<body>` 标签结束之前：\n\n```html\n<script type=\"text/javascript\"\
  \ src=\"http://ajax.googleapis.com/ajax/libs/swfobject/2.1/swfobject.js\" />\n```\n\
  \n在页面中嵌入 Flash 影片文件就像从 HTML 页面引用以下 JavaScript 代码一样简单：\n\n```javascript\n//  指定要显示的\
  \ Flash 影片的 URL\nvar movieURL = \"my-movie.swf\";\n\n// 指定要替换 HTML 页面上的哪个标签。在此例中，id\
  \ 属性值为 movie 的标签将被替换\nvar tagIDToReplace = \"movie\";\n\n// 指定 Flash 影片的尺寸 - 320px\
  \ x 240px\nvar width = 320;\nvar height = 240;\n\n// 指定显示此影片所需的 Flash 版本。使用旧版本插件的用户将看不到\
  \ Flash 影片，且 HTML 标签不会被替换\nvar flashVersionRequired = \"8\";\nvar expressInstallURL\
  \ = null; // 可以安全地忽略此项\n\n// 指定要传递给 Flash 影片的任何变量\nvar flashVars = {}; // 同样，此项可以忽略\n\
  \n// 指定 Flash 影片的参数\nvar parameters = {\n    // 允许 Flash 和 JavaScript 之间进行通信\n \
  \   allowScriptAccess: \"always\"\n};\n\n// 指定生成的 HTML 标签（用于在页面上嵌入 Flash 影片）的一些属性\n\
  var attributes = {\n    id: \"flash-movie\"\n};\n\n// 在页面上嵌入 Flash 影片\nswfobject.embedSWF(movieURL,\
  \ tagIDToReplace, width, height, \n                   flashVersionRequired, expressInstallURL,\
  \ flashVars, parameters, attributes);\n```\n\n`SWFObject` JavaScript 代码在压缩后大小约为\
  \ 12KB，并且在几乎所有支持 JavaScript 和 Flash 的浏览器中都能很好地工作。\n\n现在你已经了解了如何利用 `SWFObject` 组件在页面中嵌入任何\
  \ Flash 影片文件，接下来让我们看看如何借助此组件实现 YouTube Chromeless Player。\n\n### YouTube Chromeless\
  \ Player 的实现\n\nYouTube Chromeless Player 由两个 Flash 影片文件组成：\n\n*   `apiplayer.swf`：包含播放视频文件的实际功能。\n\
  *   `cl.swf`：为第一个 Flash 文件提供一个封装器，提供安全限制，并暴露播放器的 API 函数以供 JavaScript 访问。直接访问此封装\
  \ Flash 文件的 URL 是 [`www.youtube.com/apiplayer?enablejsapi=1`](http://www.youtube.com/apiplayer?enablejsapi=1)。\n\
  \n要为示例页面实现 YouTube Chromeless Player，请在\n\n\n\n"
- "# SWFObject JavaScript 库集成\n\n在*清单 7-3* 中代码的末尾处，引入 SWFObject JavaScript 库文件，然后将*清单\
  \ 7-5*中的代码添加到 `my-example.js`（即*清单 7-3*中引用的 JavaScript 文件）中。这会为你的页面添加视频播放功能，并让你页面上的控件能够控制电影文件的播放。\n\
  \n**清单 7-5.** *使用 YouTube 无铬播放器显示视频教程*\n\n```\n$.onDomReady(function() {\n\n// 要将播放器嵌入到我们的页面中，只需使用\n\
  \n// SWFObject 将 YouTube 播放器嵌入到页面中\n\nvar movieURL = \"http://www.youtube.com/apiplayer?enablejsapi=1\"\
  ;\n\nvar tagIDToReplace = \"movie\";\n\nvar width = 320;\n\nvar height = 240;\n\n\
  var flashVersionRequired = \"8\";\n\nvar expressInstallURL = null;\n\nvar flashVars\
  \ = null;\n\nvar parameters = {\n\nallowScriptAccess: \"always\"\n\n};\n\nvar attributes\
  \ = {\n\nid: \"flash-movie\"\n\n};\n\n// 实际将视频播放器嵌入到页面中\n\nswfobject.embedSWF(movieURL,\
  \ tagIDToReplace, width, height,\n\nflashVersionRequired, expressInstallURL, flashVars,\
  \ parameters, attributes);\n```\n\n现在我们已经将播放器嵌入到页面中；接下来需要让它指向我们想要播放的视频文件。可以想见，我们只能链接到由\
  \ YouTube 服务本身托管的视频。我们使用播放器的 `loadVideoById()` 方法，根据分配给每个视频的唯一标识符来加载视频。当 YouTube\
  \ 播放器准备好进行交互时，会调用一个名为 `onYouTubePlayerReady` 的特定函数。我们通过将自定义的初始化代码添加到一个同名函数中，来绑定此事件。\n\
  \n```\nfunction onYouTubePlayerReady() {\n\n// 我们之前使用 SWFObject 创建了 id 为 flash-movie\
  \ 的元素\n\nvar youTubePlayer = document.getElementById(\"flash-movie\");\n\n// 这是我们要显示的视频对应的唯一\
  \ YouTube 标识符\n\nvar videoID = \"u1zgFlCw8Aw\";\n\n// 从开头开始播放视频\n\nvar startTime\
  \ = 0;\n\n// 将视频加载到播放器中\n\nyouTubePlayer.loadVideoById(videoID, startTime);\n\n\
  // 让我们将页面上的控件连接到视频\n\n// 播放器。先从播放/暂停按钮开始。当\n\n// 按下此按钮时，如果视频处于暂停状态，我们想开始播放；\n\n\
  // 如果视频正在播放，则将其暂停。YouTube\n\n// JavaScript API 中的 playVideo() 和 pauseVideo() 方法\n\
  \n// 相当不言自明。我们只需要检测视频是否正在播放，\n\n// 以便切换我们的逻辑。实现方式是使用\n\n// getPlayerState() 方法，该方法返回一个数字，\n\
  \n// 表示播放器的当前状态，即电影是正在播放、暂停、缓冲还是其他状态。\n\nvar playPauseControl = document.getElementById(\"\
  play-pause\");\n\n$.Events.add(playPauseControl, \"click\", function() {\n\nvar\
  \ playingState = 1;\n\nvar pausedState = 2;\n\nvar currentPlayerState = youTubePlayer.getPlayerState();\n\
  \nif (currentPlayerState == playingState) {\n\nyouTubePlayer.pauseVideo();\n\n}\
  \ else if (currentPlayerState == pausedState) {\n\nyouTubePlayer.playVideo();\n\n\
  }\n\n});\n```\n\n现在我们可以随心所欲地播放和暂停视频了。接下来，让我们显示电影的时长，该时长将显示在示例页面中视频的旁边。只有当视频关联的元数据加载完成后，才能获取到此信息；根据谷歌的说法，这发生在视频开始播放之后。因此，我们将编写代码等待视频开始播放，当视频开始播放时，获取时长值并将其写入浏览器。我们可以监听播放器状态变化事件，并编写代码在该事件触发时更新页面上的时长值。\n\
  \n```\nyouTubePlayer.addEventListener(\"onStateChange\", function(newState) {\n\n\
  var playingState = 1;\n\nif (newState == playingState) {\n\n// 如果视频正在播放，获取\n\n//\
  \ 电影的时长，使其更用户\n\n// 友好，并将其显示在页面上\n\nvar durationField = document.getElementById(\"\
  duration\");\n\nvar durationInSeconds = youTubePlayer.getDuration();\n```\n\n\n\n\
  ```javascript\nvar durationInMinutes = durationInSeconds / 60;\n\nvar durationFullMinutes\
  \ = Math.ceil(durationInMinutes);\n\nvar durationRemainder = durationInMinutes -\
  \ Math.floor(durationInMinutes);\n\nvar durationRemainderInSeconds = durationRemainder\
  \ * 60;\n\nvar durationText = \"Duration: \" + durationFullMinutes + \"m \" + durationRemainderInSeconds\
  \ + \"s\";\n\ndurationField.innerHTML = durationText;\n```\n\n现在我们需要连接播放进度条控件，以便向用户展示影片的播放进度，这里使用第\
  \ 5 章介绍过的进度控制技术。\n\n每隔一秒钟执行一次以下例程：\n\n```javascript\nwindow.setInterval(function()\
  \ {\n  // 计算当前播放位置在影片总时长中所占的百分比\n  var playheadPosition = document.getElementById(\"\
  playhead-position\");\n  var currentPlaybackPositionInSeconds = youTubePlayer.getCurrentTime();\n\
  \  var durationInSeconds = youTubePlayer.getDuration();\n  var playbackPositionAsPercentage\
  \ = (currentPlaybackPositionInSeconds / durationInSeconds) * 100;\n\n  // 更新进度条的宽度以反映这个百分比\n\
  \  playheadPosition.style.width = playbackPositionAsPercentage + \"%\";\n}, 1000);\
  \ // 每 1000 毫秒（即 1 秒）执行一次\n```\n\n至此，你已经创建了视频教程页面，该页面能够显示 YouTube 服务中的视频，并通过自定义页面控件与之交互。完整的\
  \ JavaScript API 还包含本例未使用到的额外功能。有关此 API 的更多详细信息，请参阅文档：[`code.google.com/intl/en/apis/youtube/js_api_reference.html`](http://code.google.com/intl/en/apis/youtube/js_api_reference.html)。\n\
  \n## YouTube Chromeless Player 评估\n\nGoogle 的 YouTube Chromeless Player 提供了一种简单实用的方式，可以自定义\
  \ YouTube 上传视频的回放设计，以匹配你网站的整体风格。由于视频片段、JavaScript API 和 Flash 电影包装器都直接链接自 Google\
  \ 的服务器，因此性能相当出色。此外，Google 能够动态更新软件以修复错误并添加新功能，而你无需对代码做任何修改。支持该播放器所需下载到浏览器的文件大小也出奇地小。\n\
  \n最明显的限制是你的视频文件必须托管在 YouTube 上，鉴于你想呈现的内容类型，这可能并不合适。YouTube 徽标会以叠加层的形式出现在播放中的视频片段上方，这可能同样会被视为不恰当或分散注意力。JavaScript\
  \ API 也相当基础，仅提供了控制视频播放所需的最基本功能。\n\n简而言之，只要你不介意通过 YouTube 托管视频，并且只需要基本的播放功能，Google\
  \ 的 Chromeless Player 很可能是你网站嵌入视频播放的最佳选择。\n\n### JW FLV Player\n\n开发者 Jeroen Wijering\
  \ 的 Flash Video（FLV 格式）可复用视频播放器组件，目前已推出第四版，是一款成熟、文档完善且广泛使用的第三方组件，用于在网页中嵌入视频。请访问项目主页[`www.longtailvideo.com/players/jw-flv-player/`](http://www.longtailvideo.com/players/jw-flv-player/)并将组件文件下载到你的电脑。\n\
  \n### JW FLV Player 实现\n\n与 YouTube Chromeless Player 类似，JW FLV Player 通过 Flash\
  \ Player 向页面提供其 JavaScript API。此外，你需要像之前讨论的那样，使用 SWFObject 将此 Flash 文件嵌入到页面中。\n\n\
  要在示例页面中实现 JW FLV Player，首先将 SWFObject 库添加到代码清单 7-3 中，放在`<body>`标签结束之前：\n\n```html\n\
  <script type=\"text/javascript\" src=\"http://ajax.googleapis.com/ajax/libs/swfobject/2.1/swfobject.js\"\
  \ />\n```\n\n\n\n```javascript\n// 接下来，在 `my- example.js` 文件中，使用清单 7-6 中的代码将 JW\
  \ FLV 播放器嵌入到页面中。\n\n// **清单 7-6.** 使用 JW FLV 媒体播放器的视频教程页面\n\n$.onDomReady(function()\
  \ {\n\n// JW FLV 播放器以 `player.swf` 形式呈现，\n// 该文件从项目网站下载\n\nvar movieURL = \"player.swf\"\
  ;\nvar tagIDToReplace = \"movie\";\nvar width = 320;\nvar height = 240;\nvar flashVersionRequired\
  \ = \"8\";\nvar expressInstallURL = null;\n\n// 指定我们想要显示的视频文件，并\n// 指示播放器立即开始播放，\n\
  // 不在 Flash 影片中显示播放器的默认控件\n\nvar flashVars = {\nfile: \"my- video.flv\",\nautostart:\
  \ \"true\",\ncontrolbar: \"none\",\nicons: \"false\"\n};\n\nvar parameters = {\n\
  allowScriptAccess: \"always\"\n};\n\nvar attributes = {\nid: \"flash- movie\"\n\
  };\n\n// 将媒体播放器嵌入到页面中\nswfobject.embedSWF(movieURL, tagIDToReplace, width, height,\
  \ ➥\nflashVersionRequired, expressInstallURL, flashVars, parameters, attributes);\n\
  \n// 一旦播放器初始化完成，它会调用\n// 页面上一个名为 `playerReady` 的函数。我们编写\n// 代码来连接我们的控件，通过将我们的\n\
  // 代码添加到一个同名的函数中\n\nfunction playerReady(playerInstance) {\n// playerInstance 是一个表示页面上媒体播放器的对象。\n\
  // 其 id 表示 HTML 中页面元素的 id\n\nvar myJWPlayer = document.getElementById(playerInstance[\"\
  id\"]);\nvar playPauseControl = document.getElementById(\"play- pause\");\n\n$.Events.add(playPauseControl,\
  \ \"click\", function() {\n// 当用户点击播放/暂停按钮时，\n// 向播放器发送 PLAY 事件，该事件\n// 将播放模式在播放和暂停之间切换\n\
  myJWPlayer.sendEvent(\"PLAY\");\n});\n\n// 播放器允许我们编写代码来钩住\n// Flash 组件本身触发的某些事件。\n\
  // 在此，我们分配一个名为 `setDuration` 的函数\n// （稍后定义），当组件触发 `LOADED` 事件时\n// 调用该函数（该事件在视频文件加载完成时触发），\n\
  // 我们将用它来填充页面上的时长元素\n\nmyJWPlayer.addModelListener(\"LOADED\", \"setDuration\");\n\
  \n// 稍后定义的 `setPlayheadPosition` 函数\n// 将在播放器组件内部触发 `TIME` 事件时被调用\n// （该事件以固定间隔发生，每\
  \ 100 毫秒一次），\n// 我们可以利用它来更新进度条\n\nmyJWPlayer.addModelListener(\"TIME\", \"setPlayheadPosition\"\
  );\n}\n});\n\n// `setDuration` 方法将在视频文件加载完成时由 Flash\n// 组件调用，并向其传递一个对象字面量，该字面量包含\n\
  // 触发该事件的页面上播放器的 id\n\nfunction setDuration(options) {\nvar durationField = document.getElementById(\"\
  duration\");\n\n// 使用传递给此函数的 id 查找播放器组件\nvar myJWPlayer = document.getElementById(options.id);\n\
  \n// 获取播放器组件的当前状态，并\n// 据此确定视频文件的时长\nvar durationInSeconds = myJWPlayer.getConfig().duration;\n\
  \n// 使时长更易于用户阅读\nvar durationInMinutes = durationInSeconds / 60;\nvar durationFullMinutes\
  \ = Math.ceil(durationInMinutes);\nvar durationRemainder = durationInMinutes - Math.floor(durationInMinutes);\n\
  var durationRemainderInSeconds = durationRemainder * 60;\nvar durationText = \"\
  时长: \" + durationFullMinutes + \"分 \" + durationRemainderInSeconds + \"秒\";\n\n\
  // 将时长输出到页面上的元素中\ndurationField.innerHTML = durationText;\n}\n\n// `setPlayheadPosition`\
  \ 方法将由 Flash 组件每 100 毫秒\n// 调用一次，并向其传递一个对象字面量，该字面量包含\n// 视频中的当前播放位置以及视频的总时长\n\n\
  function setPlayheadPosition(options) {\nvar playheadPosition = document.getElementById(\"\
  playhead- position\");\n\n// 获取视频中的当前播放位置，表示为\n// 总时长的百分比\nvar currentPlaybackPositionInSeconds\
  \ = options.position;\n```\n\n\n\n`var durationInSeconds = options.duration;`\n\n\
  `var playbackPositionAsPercentage = (currentPlaybackPositionInSeconds / durationInSeconds)\
  \ * 100;`\n\n```javascript\n// 根据之前计算出的百分比，\n// 将页面上的进度条移动到正确位置\nplayheadPosition.style.width\
  \ = playbackPositionAsPercentage + \"%\";\n```\n\n至此，您的视频教程页面已准备就绪，其中嵌入了 JW FLV\
  \ 播放器，所有控件均已连接并正常运行，如前文图 7-2 所示的示例。\n\n## JW FLV 播放器功能集\n\nJW FLV 播放器提供了示例中未包含的若干额外功能：\n\
  \n- **播放列表支持**：JW FLV 播放器支持以 XML 格式指定的播放列表文件。您可以指定一个外部文件，其中包含您希望在播放器中显示的影片文件列表的详细信息，播放器将依次播放每个文件。如果您希望在自己的自定义控件中显示所有视频的列表，也可以通过\
  \ API 访问该播放列表。您甚至可以动态加载播放列表文件，这在您不希望刷新整个页面来加载一组新的视频文件呈现给用户的 Web 应用场景中非常有用。\n\n-\
  \ **渐进式下载**：托管在任何 Web 服务器上的标准影片文件将进行渐进式下载和播放；也就是说，影片会部分下载，并在整个影片下载完成之前开始播放。播放期间，影片的其余部分将在后台继续下载。\n\
  \n- **HTTP 流媒体**：JW FLV 播放器也支持 HTTP 流媒体。这需要您编写少量额外的代码在服务器端运行。使用此功能，最终用户可以直接跳转到视频的任意位置，无论该位置是否已下载到本地计算机。有关如何在自己的服务器上实现此功能的详细信息，请参阅\
  \ JW FLV 播放器项目主页。\n\n- **无障碍支持**：如前所述，Web 应用的无障碍访问是一个重要课题，尤其在多媒体领域。JW FLV 播放器支持隐藏式字幕（字幕）和隐藏式音频描述，后者是一种额外的音轨，用于为视障人士提供场景中无法仅通过标准音轨分辨的动作指导。字幕使用\
  \ W3C 的定时文本格式进行描述，该格式基于 XML，用于描述要显示的字幕文本、其开始时间和结束时间。\n\n- **插件支持**：如果 JW FLV 播放器组件不能满足您的所有需求，其架构支持添加插件以提供额外功能。还可以通过使用\
  \ API 的 JavaScript 访问插件，这对于发现播放器在特定方面存在不足的开发人员来说极具吸引力。\n\n除了这些功能外，开发人员还在不断添加新功能。您需要随时了解该组件的变化，它旨在成为满足您所有视频播放需求的一站式解决方案。\n\
  \n## JW FLV 播放器评估\n\nJW FLV 播放器是一个功能极其丰富、稳定且成熟的组件，可让您轻松地在 Web 应用中嵌入视频和视频播放列表。如果您需要的不仅仅是简单地在页面中嵌入一个\
  \ YouTube 影片，那么它将是您的最佳选择。\n\n该组件在非营利性网站中可免费使用，但用于商业用途则需要购买商业许可。许可费用相当低廉，物超所值。还有一个高级选项，允许您在最多\
  \ 50 个不同的网站和 Web 应用中使用该组件。\n\n在文件大小方面，包含并公开 JavaScript API 的 Flash 组件大小为 44KB。这使其比\
  \ YouTube Chromeless 播放器要大，因此请谨慎选择使用哪个组件。\n\n\n"
- "# 浏览器兼容性\n\n浏览器兼容性非常好。只要最终用户的浏览器安装了 Flash Player 插件，该组件就可以毫无困难地运行。\n\n### 未来：HTML\
  \ 5 中的音频与视频\n\n撰写本文时，新的 HTML 5 推荐标准仍处于草案阶段。但这并未阻止浏览器厂商挑选一些更有趣的特性纳入自家浏览器，以在竞争中获得优势。HTML\
  \ 5 中备受关注的领域之一，是在浏览器中实现原生音频和视频播放，无需依赖 JavaScript、Flash 或任何其他外部插件。\n\n> **注：** 本次规范更新中，HTML\
  \ 5 新增的其他功能还包括：直接在页面上绘制图形、允许离线存储 Web 应用程序数据（当用户网络连接断开时，你仍希望继续运行 RIA）、元素拖放、浏览器历史记录管理以及实时文档编辑（允许开发者构建原生富文本文档编辑器）。\n\
  \n## `<audio>` 和 `<video>` 标签\n\n原生音频和视频支持的实现基于两个新提出的 HTML 标签：`<audio>` 和 `<video>`。在这些标签内放置内容，提供了一种有用的机制，用于向不支持这些标签的浏览器显示替代内容。当某个特性不受支持时提供备用内容的能力，普遍适用于\
  \ HTML 5。\n\n让我们看看如何使用`<video>`标签。`<audio>`标签非常类似。以下是用于在浏览器中原生显示视频文件的 HTML 5 代码：\n\
  \n```\n<video id=\"my-video\" src=\"/my-video.mp4\" type=\"video/mp4\" autoplay=\"\
  true\">\n    抱歉，您的浏览器不支持原生播放视频文件。\n</video>\n```\n\n`<video>` 标签接受多个可选属性：\n\n- `src`：视频文件的源\
  \ URL。\n- `type`：要显示的视频文件的 MIME 类型。\n- `autoplay`：布尔设置，决定页面加载后是否自动播放视频文件。\n- `width`\
  \ 和 `height`：设置影片的尺寸。\n- `controls`：布尔设置，决定是否显示浏览器的默认控件（播放、暂停等）或将其关闭。\n- `loop`：布尔设置，决定影片播放完毕后是否从头开始重新播放。\n\
  - `poster`：视频文件加载期间显示的图像文件 URL。这通常应该是影片本身的静止帧，以便在最终用户选择播放前提供预览。播放发生后，海报帧在页面刷新前不会再次显示。\n\
  \n由于该标签可能包含其他内容和页面元素作为备用方案，你完全可以考虑通过嵌入在`<video>`标签内的标签来提供基于 Adobe Flash 的视频播放，如下例所示：\n\
  \n```\n<video id=\"my-video\" src=\"/my-video.mp4\" type=\"video/mp4\" autoplay=\"\
  true\">\n    <div id=\"my-backup-video\">\n        <p>抱歉，您的浏览器无法显示我们的视频文件，但您可以\n\
  \        <a href=\"/myVideo.mp4\">将文件下载到您的计算机</a>\n        进行观看。</p>\n    </div>\n\
  </video>\n```\n\n通过 JavaScript，你可以判断 API 是否支持`<video>`标签。如果不支持，则像往常一样通过 Flash 组件加载视频文件。这样，优先选择浏览器的原生视频显示方式，如果不存在则回退到\
  \ Flash Player，如果备用组件不受支持或 JavaScript 被禁用，则进一步回退到下载链接，如上述代码示例所示。这种方法提供了良好的可访问性。\n\
  \n## JavaScript API\n\nHTML 5 增加了一个 JavaScript API，并支持这些标签。该 API 允许你通过 JavaScript\
  \ 控制播放，或设计和构建自己的控件来操作播放中的音频或视频的播放和反馈属性。\n\n可用的方法类似于我们在本章中介绍的第三方多媒体组件所提供的方法，例如 `play()`、`pause()`\
  \ 和 `load()`。此外，还有一系列由播放文件设置的动态属性，允许你获取当前播放位置、媒体的大小和时长，以及其他可用作向用户反馈的信息。\n\nAPI 的完整构成还包括一组事件，你可以通过\
  \ JavaScript 钩入每个事件。这些事件在响应特定情况时触发，例如播放的启动和停止。甚至还有一个在播放期间定期触发的事件，用于更新你开发的任何用户界面组件，以向最终用户显示播放位置。\n\
  \n## 当前采用水平\n\n目前，对`<audio>`和`<video>`标签的支持在 Safari 3.1 及以上版本、Google Chrome、Opera\
  \ 9.5 及以上版本（仅视频播放，不含音频）以及 Firefox 3.5 及以上版本中有限可用。虽然这并未构成按市场份额计算的大部分已安装浏览器，但它确实为这些标签及其关联的\
  \ JavaScript API 提供了一个有用的测试平台。这使开发者有机会在更广泛采用之前，解决错误和实现细节。\n\n这些早期采用者之间存在争议的一点是音频和视频文件格式以及支持的编解码器。对于哪种是最佳格式，每家厂商都有自己的偏好，并试图将其强加为采用的标准。标准制定机构希望采用一种开源编解码器，但这似乎遭到了一些认为自家编解码器更优越的厂商的反对。就目前情况而言，你会发现在不同浏览器中使用这些标签支持的格式各不相同，因此广泛使用还为时过早。你可以在\
  \ [`www.whatwg.org/specs/web-apps/current-work/`](http://www.whatwg.org/specs/web-apps/current-work/)\
  \ 上阅读最新的进展。\n\n### 总结\n\n本章回顾了几个第三方音频和视频播放器组件，它们使用了 Adobe 的 Flash Player 浏览器插件。你了解了如何在自己的网页中使用这些组件来播放和处理多媒体文件。我们还展望了浏览器对原生音频和视频播放支持的未来。现在，你应该能够在自己的页面中实现多媒体播放，在页面上构建自己的控件，并通过每个第三方组件暴露的\
  \ JavaScript API 从这些控件控制媒体的播放。\n\n在下一章中，我们将探讨使用 JavaScript 自定义页面中的表单控件，为表单的填写提供比原生\
  \ HTML 控件更友好的用户界面。\n\n## 第 8 章：表单控件\n\n表单通常构成任何 Web 应用程序的主要部分。表单可以鼓励用户提交反馈、提供搜索功能、让用户向在线数据库添加信息等等。通过表单，你邀请最终用户向你提供某些信息，以便他们自己获得一些回报。表单是网站交互性最强的部分之一，也是经常让用户感到沮丧的部分。正确构建和布局表单及表单字段对你的应用程序至关重要。\n\
  \n本章将指导你自定义现有的 HTML 表单字段，并向你展示如何添加新类型的控件。你将看到如何构建对最终用户来说更易于理解、视觉上更令人愉悦的表单。\n\n###\
  \ 自定义现有表单控件\n\n\n\n"
- "# 表单字段的丰富多样性\n\nHTML 中提供的表单字段种类繁多，几乎可以收集你在网站上执行某些流程或提供特定功能时所需的全部用户信息。你可能习惯用 CSS\
  \ 来美化表单字段，并且可能注意到某些表单控件对特定样式没有响应。例如，尝试修改 `<select>` 下拉元素的边框样式，在不同的浏览器中会得到不同的效果——有些浏览器会应用样式，而另一些则会忽略。\n\
  \n样式方面存在一些问题，因为浏览器中使用的表单字段通常直接取自操作系统本身提供的等效表单字段。这类控件通常只能通过修改操作系统的主题或样式来改变。\n\n随着时间的推移，浏览器厂商迫于压力，尝试让开发者对这类控件的样式拥有更多控制权。但遗憾的是，浏览器之间的支持程度参差不齐，因此对诸如\
  \ `<select>` 框这类控件进行样式修改，在每种浏览器中可能不会产生相同的效果。\n\n简而言之，在美化某些控件时，一些棘手的问题依然存在。在这里，我们将正面应对这些问题，并探讨一些解决方案——使用\
  \ CSS 并偶尔结合 JavaScript——这些方案能在尽可能多的浏览器中生效。让我们从表单按钮开始。\n\n#### 按钮\n\n你在浏览网页时可能每天都会用到按钮，点击它们来保存你在表单中输入的数据、从数据库中删除条目、通过网络邮件客户端发送电子邮件等等。\n\
  \n**249**\n\n![图片 25](img/index-274_1.png)\n\n![图片 26](img/index-274_2.png)\n\n\
  **250**\n\n第 8 章 ■ 表单控件\n\n按钮通常通过标签 `<input type=\"submit\">`、`<input type=\"reset\"\
  >`、`<input type=\"button\">` 和 `<input type=\"image\">` 渲染到页面上。前三种按钮类型使用操作系统或浏览器的默认样式进行渲染。这样做的目的是在页面与操作系统或浏览器的用户界面之间提供一定的设计一致性。`<input\
  \ type=\"image\">` 按钮类型会渲染位于指定 URL 的图片，并在用户点击该图片时提交其所在的表单。\n\n## 按钮样式自定义\n\n过去，浏览器对提交、重置和按钮输入类型的\
  \ CSS 支持有些参差不齐。例如，早期版本的 Safari 完全不支持修改默认样式。但之后情况有所稳定，如今几乎所有浏览器都完全支持 CSS 样式。然而，即使在今天，要精确匹配所有不同浏览器中按钮内文本的位置仍然很棘手。\n\
  \n许多富互联网应用中常见的按钮设计会使用圆角和阴影，如图 8-1 所示。假设你想调整这种按钮，使其大小取决于其所含文本的大小。这样一来，如果用户在浏览器中调整文本大小，自定义按钮内的文本也会随之调整大小，而不会丢失应用到其背景上的样式，这对于可访问性非常有利。\n\
  \n**图 8-1.** *自定义提交按钮*\n\n为了以能够根据按钮内含文本量水平调整每个按钮大小的方式构建此控件，你需要在 `<input>` 元素周围添加一个额外元素：\n\
  \n```\n<div class=\"button\">\n  <input type=\"submit\" value=\"保存为草稿\" />\n</div>\n\
  ```\n\n然后，你可以结合使用 CSS 的 `background-position` 属性与一张非常宽的图片（如图 8-2 所示），作为两个元素的背景。你将显示图片左半部分的一部分作为外层元素的背景，并将图片的右半部分作为\
  \ `<input>` 元素本身的背景。\n\n**图 8-2.** *用于提交按钮背景的宽图*\n\n使用上述 HTML 和宽图生成此自定义提交按钮的 CSS\
  \ 如下所示：\n\n```\n.button {\n  /* 将背景固定在外层元素的左上角 */\n  background: url(button-bg.png)\
  \ 左上不重复;\n```\n\n\n```markdown\n![图片 27](img/index-275_1.png)\n\n# 第 8 章 ■ 表单控件\n\
  \n**251**\n\n```css\n/* 强制在背景左侧显示 14 像素 */\npadding-left: 14px;\n/* 强制元素仅根据内容调整宽度\
  \ */\nfloat: left;\n/* 背景图片的高度 */\nheight: 50px;\n}\n\n.button input {\n/* 将背景固定到输入元素的右上角\
  \ */\nbackground: url(button-bg.png) top right no-repeat;\n/* 右侧圆角及阴影占 23 像素 */\n\
  /* 底部阴影高度占 9 像素 */\npadding: 0 23px 9px 0;\nfont-size: 1.7em; /* em 单位允许用户调整文本大小\
  \ */\nheight: 50px; /* 背景图片的高度 */\noverflow: visible; /* 修复 IE 浏览器中的奇怪渲染错误 */\n\
  border: 0; /* 移除输入元素周围的默认边框 */\nmargin: 0; /* 移除输入元素周围的默认外边距 */\n}\n```\n\n你可以看到，能够移除按钮元素的默认样式，并按照自己页面的设计和布局进行修改，同时仍使用浏览器自带的按钮文本。\n\
  \n## 图片型表单按钮的替代方案\n\n你知道 `<input type=\"image\">` 元素允许你指定一个图片 URL，并将该图片作为表单按钮使用。假设你的网站中用了多个这样的图片。这种情况下，使用第\
  \ 4 章介绍的 CSS 精灵技术会更高效。你可以将这些独立的图片合并成一个文件，然后通过 CSS 类名来选择精灵图中正确的部分显示在页面元素中。\n\n图 8-3\
  \ 展示了一个包含四个自定义按钮（确定、取消、后退、前进）的精灵图示例。\n\n**图 8-3.** *包含四个用作按钮的图片的 CSS 精灵*\n\n另一个改进是使用\
  \ `<input type=\"submit\">` 标签，而非 `<input type=\"image\">`。这样，如果用户的浏览器不支持 CSS，或由于某种原因手动禁用了\
  \ CSS，页面上仍会显示一个标准的提交按钮——这是渐进增强原则的实际应用。\n\n**252**\n\n## 第 8 章 ■ 表单控件\n\n下面我们逐步讲解如何使用这项技术。每个按钮需要两个\
  \ HTML 元素：`<input>` 标签本身和一个包装器标签（理论上可以是任意块级元素）。本例中，我们将使用 `<div>` 标签。HTML 代码如下：\n\
  \n```html\n<div class=\"sprite ok\">\n  <input type=\"submit\" value=\"确定\" />\n\
  </div>\n<div class=\"sprite cancel\">\n  <input type=\"submit\" value=\"取消\" />\n\
  </div>\n<div class=\"sprite back\">\n  <input type=\"submit\" value=\"后退\" />\n\
  </div>\n<div class=\"sprite forward\">\n  <input type=\"submit\" value=\"前进\" />\n\
  </div>\n```\n\n注意，每个按钮在外层元素上使用了不同的 CSS 类名，并且按钮的 `value` 属性已正确设置。这样，不支持 CSS 的浏览器用户也能访问到标准的提交按钮。\n\
  \n接下来，你需要编写 CSS 来实现期望的效果。先从应用于每个包装器元素的 `.sprite` 类开始：\n\n```css\n.sprite {\n  background-image:\
  \ url(button-sprite.png);\n  background-repeat: no-repeat;\n  width: 85px;\n  height:\
  \ 39px;\n  overflow: hidden;\n}\n```\n\n这里，我们将背景图片设置为精灵图，并禁止其重复。同时强制宽高与精灵图中单个按钮图片的尺寸一致，而非整个精灵图的尺寸。\n\
  \n最后，将 `overflow` 属性设置为 `hidden`，这意味着任何超出该元素宽高边界的内容都将被裁剪掉且不显示。设置这个属性的原因稍后就会明了。\n\
  \n接下来，为每个按钮设置背景位置，使其在各自元素中显示正确的按钮图片，如下所示：\n\n```css\n.sprite.ok {\n  background-position:\
  \ 0 0;\n}\n```\n\n**253**\n\n```css\n.sprite.cancel {\n  background-position: -85px\
  \ 0;\n}\n\n.sprite.back {\n  background-position: 0 -39px;\n}\n\n.sprite.forward\
  \ {\n  background-position: -85px -39px;\n}\n```\n\n\n最后，既然你已经解决了正确按钮的显示问题，现在需要对`<input>`标签应用一些\
  \ CSS 处理，以隐藏其文本内容，同时仍然允许它被选中：\n\n```css\n.sprite input {\n  padding: 0;\n  margin:\
  \ 0;\n  border: 0;\n  background: transparent;\n  display: block;\n  height: 39px;\n\
  \  font-size: 0;\n  text-align: right;\n  width: 500px;\n}\n```\n\n这段样式首先重置了`margin`、`padding`和`border`属性。这些属性的值确保背景是透明的，以便透出下方按钮的图像，并强制元素的高度与图像匹配，从而使整个区域可被选中。\n\
  \n样式的最后三行用于确保元素的默认文本不会显示在按钮图像上方。你可以利用这样一个事实：任何超出周围元素范围的元素部分都会被裁剪掉并不显示——这要归功于外部元素上的`overflow:\
  \ hidden`样式属性。你只需让`<input>`元素比包装元素宽得多，并将文本（尽量缩小以占用更少空间）对齐到元素右侧即可。\n\n这意味着文本位于元素隐藏的部分中，从而在所有浏览器中保持按钮按你预期的方式显示。\n\
  \n#### 文本字段\n\n普通文本字段接受多种不同格式的数据。它是 HTML 中最常见的表单字段。由于这种类型的字段非常灵活，一个关注点是如何对用户输入的内容进行一定控制。在某些情况下，你应该运用一点智慧，配合一点\
  \ JavaScript，来确保输入了正确的数据。例如，你可能希望限制字段只接受数字，或只接受电子邮件地址中允许的字符。我们将研究如何实施这两种限制。\n\n\
  ## 第 8 章：表单控件\n\n### 纯数字文本字段\n\n本示例演示如何样式化一个文本字段，在 JavaScript 可用的情况下，该字段将只接受数字输入。让我们先创建一个新的`<input\
  \ type=\"text\">`元素，并为其分配一个`numerical`类：\n\n```html\n<form action=\"get\" action=\"\
  /\" id=\"form\">\n  <input type=\"text\" class=\"numerical\" />\n  <input type=\"\
  submit\" value=\"save\" />\n</form>\n```\n\n现在，你可以编写 JavaScript，使其仅应用于具有此特定类的元素：\n\
  \n```javascript\n$.onDomReady(function() {\n  // 监听表单内的按键事件\n  $.Events.add(document.getElementById(\"\
  form\"), \"keypress\", \n    function(e) {\n      // 按键是否发生在类名为 numerical 的字段内\n\
  \      if (e.target.className == \"numerical\") {\n        // 以下正则表达式匹配所有非数字字符\n\
  \        if (e.key.match(/[⁰-9]/g)) {\n          // 如果按下的不是数字键，则取消按键事件\n       \
  \   e.preventDefault();\n        }\n      }\n    }\n  );\n});\n```\n\n这段 JavaScript\
  \ 代码会等待 DOM 准备好被访问，然后开始监听页面上`<form>`标签范围内发生的按键事件。如果这些事件之一发生在类名为`numerical`的元素上（在此例中即文本字段），则使用正则表达式检查按下的键是否为数字。如果不是数字，则通过有效阻止浏览器事件来防止其被写入字段。\n\
  \n如果按下的键对应的是数字，则没有问题；事件将被允许继续执行，字符被写入字段。\n\n通过更改此例程中使用的正则表达式，你可以限制字段中允许的字符。让我们看看这如何与另一种文本字段配合使用。\n\
  \n### 电子邮件地址字段\n\n假设你有一个类设置为`email`的字段，并且你想限制可以输入到此字段的字符仅为电子邮件地址中允许的字符。HTML 如下所示：\n\
  \n```html\n<input type=\"text\" class=\"email\" />\n```\n\n你可以简单地修改上一节中所示的代码来处理这种情况。\n\
  \n\n\n# 第 8 章 ■ 表单控件\n\n**255**\n\n```javascript\n$.onDomReady(function() {\n\n\
  $.Events.add(document.getElementById(\"form\"), \"keypress\", ➥\n\nfunction(e) {\n\
  \nswitch(e.target.className) {\n\ncase \"numerical\":\n\nif (e.key.match(/[⁰- 9]/g))\
  \ {\n\ne.preventDefault();\n\n}\n\nbreak;\n\ncase \"email\":\n\n// 以下正则表达式匹配电子邮件地址中不允许的所有字符\n\
  \nif (e.key.match(/[^a-zA-Z0-9@!#$%&'*+- \\/=?^_{}~.]+/g)) {\n\ne.preventDefault();\n\
  \n}\n\nbreak;\n\n}\n\n});\n\n});\n```\n\n如你所见，这段代码与上一节中的 JavaScript 几乎相同，只是使用了不同的正则表达式。现在，对于电子邮件地址允许的字符列表之外的每个字符，你都取消\
  \ `keypress` 事件。你可以使用这种方法来添加新的限制。只需使用适当的正则表达式来匹配你想要施加的限制类型即可。\n\n不要忘记，有些用户的浏览器可能未启用\
  \ JavaScript。对于这些用户，你必须添加适当的服务器端验证，这样如果发送回服务器的值包含原本会通过 JavaScript 限制的字符，就不会被保存。\n\
  \n#### 文件上传控件\n\n文件上传控件在 HTML 中是相当独特的，因为它通常会在页面上添加两个关联的表单控件：一个文本字段和一个按钮。但 Safari\
  \ 浏览器是个例外，其中文本字段被替换为文本标签；在这种情况下，文件名是不可编辑的。\n\n因此，文件上传控件通常由两个截然不同的表单元素组成，它们通过一个标签添加，并且无法分离。使用\
  \ CSS 对此控件进行设计尤其困难，因为相同的样式会同时应用于这两个元素。例如，仅使用 CSS 为按钮设置自定义图像样式并不直接。\n\n值得庆幸的是，有一种技术可以让你对文件上传控件应用自定义样式。其缺点是该控件的文本字段部分实际上被移除了——它被替换为一个文本标签，就像在\
  \ Safari 中一样。就个人而言，我认为这是一个完全可以接受的限制，因为实际上没有多少用户会直接在字段中键入文件位置。大多数人更倾向于浏览到合适的文件位置。\n\
  \n这里，我将向你展示如何使用这种技术，基于图 8-4 所示的设计来构建你自己的文件上传控件。\n\n![Image 28](img/index-280_1.png)\n\
  \n**256** 第 8 章 ■ 表单控件\n\n**图 8-4.** *一个自定义的文件上传控件*\n\n在控件的 HTML 中，你将文件上传字段包裹在一个\
  \ `<div>` 标签中，并在上传字段旁边添加另一个 `<div>` 元素，你将使用 JavaScript 用这个元素来表示所选文件的文件名。实际上，由于你需要使用\
  \ JavaScript 来动态显示文本标签中的值，因此整个自定义控件仅在启用 JavaScript 时应用才有意义。其他用户应该看到默认浏览器样式的上传字段。以下是实现此设计的\
  \ HTML：\n\n```html\n<form method=\"post\" action=\"/\" id=\"form\" enctype=\"multipart/form-data\"\
  >\n\n<div class=\"file\" id=\"uploader\">\n\n<input type=\"file\" id=\"file-upload\"\
  \ />\n\n<div class=\"file-label\"></div>\n\n</div>\n\n<input type=\"submit\" value=\"\
  保存\" />\n\n</form>\n```\n\n为了确保此控件的 CSS 仅在启用 JavaScript 时应用，你将使用 JavaScript 动态地向\
  \ `<div class=\"file\" id=\"uploader\">` 元素添加一个新的 `active` 类：\n\n```javascript\n\
  $.CSS.addClass(document.getElementById(\"uploader\"), \"active\");\n```\n\n然后，你将所有\
  \ CSS 编写为继承自这个新的类名：\n\n```css\ndiv.file.active {\n\nposition: relative;\n\nbackground:\
  \ url(file-upload.png) top left no-repeat;\n\n/* 背景图片的尺寸 */\n\nwidth: 288px;\n\n\
  height: 39px;\n\n}\n\ndiv.file.active .file-label {\n\n/* 定位在背景之上 */\n\nposition:\
  \ absolute;\n\ntop: 0;\n\nleft: 10px;\n\n/* 只占用图片文本标签部分的宽度 */\n\nwidth: 175px;\n\
  \nheight: 100%;\n\noverflow: hidden;\n\nz-index: 1;\n\nfont-size: 1.4em;\n\n/* 确保文本精确定位，垂直居中\
  \ */\n\nline-height: 31px;\n\n}\n```\n\n![Image 29](img/index-281_1.png)\n\n**257**\
  \ 第 8 章 ■ 表单控件\n\n```css\ndiv.file.active input {\n\nposition: absolute;\n\n/* 在\
  \ Firefox 中使文件输入控件透明 */\n\n-moz-opacity: 0;\n\n/* 在 IE 8 中应用透明度 */\n\n-ms-filter:\"\
  progid:DXImageTransform.Microsoft.Alpha(Opacity=0)\";\n\n/* 在 IE 7 及以下版本中应用透明度 */\n\
  \nfilter: alpha(opacity=0);\n\n/* 在其他支持透明度的浏览器中应用透明度，例如 Safari、Opera */\n\nopacity:\
  \ 0;\n\n/* 将透明文件输入控件定位在背景和文件标签之上 */\n\nz-index: 2;\n\n/* 如果未设置此边框，Opera 将不会应用透明度\
  \ */\n\nborder: 0;\n\n/* 填满外部包装元素标记的可用空间 */\n\nwidth: 100%;\n\nheight: 100%;\n\n\
  }\n```\n\n图 8-5 展示了这些样式规则如何分三个阶段应用于元素，从原生文件上传控件开始，以最终的自定义控件结束：\n\n- 首先，你将代表整个文件上传控件的图片设置为包装元素的背景图片，并将其大小设置为与图片尺寸相匹配。\n\
  - 然后，你将文件标签定位在背景上方的一个图层中，并设置其文本样式（图 8-5 的第二阶段）。\n- 最后，你对原生文件上传控件应用一些样式规则，使其透明，这样用户可以直接看到下面的背景图片和文件标签，但仍然允许元素本身可点击（图\
  \ 8-5 的第三阶段）。\n\n**图 8-5.** *自定义文件上传控件的三个阶段*\n\n这是一个相当惊人的现象，它在所有现代浏览器中都能正常工作。由于目前无法在所有浏览器中使用\
  \ CSS 3 的 `opacity` 属性来设置透明度，你必须采用每个浏览器自己的实现方式，使用一组规则来针对每个现代浏览器的透明度设置能力。在控件现在不可见的情况下，你将其定位在背景和文件标签之上，并确保它占据包装元素的完整宽度和高度。\n\
  \n剩下的就是编写 JavaScript 代码，将 CSS 类 `active` 应用到包装元素，并确保当用户使用该控件选择文件时，文本标签得到更新。\n\n\
  **258** 第 8 章 ■ 表单控件\n\n```javascript\n$.onDomReady(function() {\n\n// 在 id 为 form\
  \ 的 <form> 标签内查找所有 class 为 file 的字段\n\nvar fileUploadFields = $.Elements.getElementsByClassName(\"\
  file\", ➥\n\ndocument.getElementById(\"form\"));\n\nfor (var index, length = fileUploadFields.length;\
  \ index < length; index++) {\n\nvar fileUpload = fileUploadFields[index];\n\n//\
  \ 向文件上传字段添加 active 类\n\n$.CSS.addClass(fileUpload, \"active\");\n\n}\n\n// 当某些浏览器事件触发时，我们将调用\
  \ setFileLabel 函数\n\nvar setFileLabel = function(e) {\n\nif (e.target.type == \"\
  file\") {\n\n// 找到最近的文本标签以在其中显示文件名\n\nvar fileLabel = $.Elements.getElementsByClassName(\
  \ ➥\n\n\"file-label\", e.target.parentNode)[0];\n\n// 从上传字段获取文件名\n\nvar file = e.target.value;\n\
  \n// 在文件名标签中仅显示 19 个字符的文本\n\nvar numberOfChars = 19;\n\nif (file.length > numberOfChars)\
  \ {\n\n// 如果文件名超过 19 个字符，则截断它\n\nfile = file.substr(0, 4) + \" ... \" + ➥\n\nfile.substr(file.length\
  \ - numberOfChars + 4, file.length)\n\n}\n\n// 将文件名写入标签元素\n\nfileLabel.innerHTML\
  \ = file;\n\n}\n\n}\n\n// 监听控件上的 change 事件并设置标签文本\n\n$.Events.add(document.getElementById(\"\
  file-upload\"), \"change\", ➥\n\nsetFileLabel);\n\n// 监听控件上的 mouseout 事件并设置标签文本\
  \ - 用于\n\n// Internet Explorer，它不会在应该触发时触发 change 事件\n\n$.Events.add(document.getElementById(\"\
  file-upload\"), \"mouseout\", ➥\n\nsetFileLabel);\n\n});\n```\n\n\n\n\n该脚本分为两部分。第一部分会查找表单中所有\
  \ `<div class=\"file\">` 元素，并为它们应用 CSS 类 `active`。这使你之前编写的 CSS 规则能够应用到这些元素上。代码的第二部分监听上传字段内发生的\
  \ `change` 和 `mouseout` 事件，并在这些事件触发时调用一个方法。该方法从上传字段获取文件名，并将其值填入文本标签中，如果文件名过长无法在可用空间中完整显示，则进行截断处理。\n\
  \n## 第 8 章：表单控件\n\n监听 `change` 事件对你来说可能并不意外，因为你希望知道上传字段中的值何时发生变化。然而，使用 `mouseout`\
  \ 事件可能显得有些奇怪。问题在于，某些旧版浏览器在选择文件时不会触发 `change` 事件，而是触发 `mouseout` 事件。因此，你需要同时监听这两个事件，以确保实现正确的跨浏览器兼容性。\n\
  \n### 添加新型表单控件\n\n标准的 HTML 表单控件通常足以处理将用户数据传入应用程序的需求。但在某些情况下，你可能希望使用一些更直观的控件，或者操作系统中有但\
  \ HTML 并未暴露出来的控件。好消息是，借助少量 JavaScript 和偶尔使用的 Flash，你几乎可以为表单构建任何类型的自定义用户界面。\n\n实现这一惊人壮举的方法是隐藏表单中已存在的字段，然后提供一个用于修改这些字段值的新界面。当用户与你提供的新控件交互时，你在幕后更新隐藏字段。这确保了所有数据都能像往常一样通过\
  \ HTML 表单字段发送到服务器，从而降低了出错或丢失数据的风险。\n\n在本节中，你将看到如何运用此技术来构建两种 HTML 本身不原生支持的表单控件。在本章稍后部分，我将介绍一些第三方可重用的表单控件组件。\n\
  \n#### 用于日期选择的日历小部件\n\n标准的 HTML 表单可能通过文本框来允许日期选择，其输入内容会根据特定的日期格式（例如 `DD-MM-YY` 格式）进行验证。或者，表单可能提供一组三个选择框——分别对应日、月、年——并要求用户从每个选择框中选取合适的值来组成所需日期。\n\
  \n为用户提供一个熟悉的日历界面来选择日期，难道不是更直观吗？如今，许多酒店和航班预订网站都可以找到此类小部件。有些实现得很好，但有些则远不尽如人意。\n\n\
  例如，许多现有的日历小部件要求用户点击日历图标才能弹出日历，或者当用户点击页面上的常规日期选择字段时会直接显示日历。虽然这种机制节省了网站布局中的页面空间，但可能会让最终用户感到沮丧。一些日历小部件要求用户点击某个特定按钮才能关闭它，而不是在用户与其他字段交互时自动关闭。还有一些日历小部件会不恰当地弹在其他页面控件之上，导致这些控件无法使用。\n\
  \n稍微思考并考虑一下你的用户可能如何与控件交互，会带来巨大的回报。请记住，你的目标是提供一种愉悦的、几乎不易察觉的用户体验。必须避免任何可能导致最终用户受挫的因素。考虑到这一点，让我们看看如何构建一个更直观的控件：一个包含所有必要逻辑和\
  \ HTML 的可重用日历小部件。\n\n示例日历控件将连接到三个 `<select>` 标签，但其界面外观如图 8-6 所示。在查看此控件的代码之前，我们先定义它的行为方式：\n\
  \n![图 8-6](img/index-284_1.png)\n\n\n\n\n# 表单控件\n\n- 页面开发者可以根据其网站的设计需要，对日历进行样式设置和定位。\n\
  - 控件可以在页面开发者选择的时间进行实例化。\n- 同一页面上可以存在多个实例，且它们之间不会相互干扰。\n- 月份和日期名称应可本地化，但默认使用英文。\n\
  - 页面开发者可以钩入日历小部件内发生的事件，并从中提取有用信息。例如，开发者可能希望知道何时选中了新的日期，以及该新日期是什么。\n\n**图 8-6.**\
  \ 连接到三个`<select>`框的自定义日历表单控件\n\n为了创建可实例化的小部件对象，你需要使用一个构造函数类。如第 2 章所述，在面向对象编程中，类就像是代码行为方式的定义。对象是该类的一个特定实例，每个创建的对象相互独立，但它们都共享实例化它们的类的所有能力。\n\
  \n在内部，我们的部件将包含与它在浏览器中的呈现相关的代码：HTML 渲染和用户事件（如鼠标点击）的关联。部件中还包含与维护日历当前状态以及涉及日期和月份的计算相关的代码。你希望保持数据和显示代码的这种逻辑分离，确保两者之间没有交叉。\n\
  \n观察者模式（在第 2 章中介绍）提供了一种保持这种区分的实用方法。你有一部分代码与数据存储和操作相关。当这部分代码执行了显示部分可能希望了解的操作时，它会触发一个预定名称的事件。\n\
  \n你告诉你的显示相关代码监听某些事件何时被触发。当它们被触发时，可以在显示部分内执行代码，获取传递给事件的任何相关数据，并使用它来改变显示。同样的技术也适用于相反的情况。\n\
  \n例如，当用户点击更改选中的日期时，数据存储代码需要知道这一点。数据存储代码监听由此点击触发的事件。新日期的值可以随事件一起传递，并且数据存储代码可以根据需要进行更新。\n\
  \n这种模式允许两个或多个不同的代码块在同一系统内共存，而不会在两者之间产生混乱的交叉引用。单个方法充当调解器，定义允许的事件列表，并允许每个代码块在系统中触发或监听这些事件中的任何一个。\n\
  \n## 创建日期的实用方法\n\n为了操作和格式化原生 JavaScript 的`Date`对象，使其显示对用户更友好，你需要一些新的实用方法。让我们通过将这些方法添加到你在第\
  \ 2 章开始编写的`$` JavaScript 库中，使其可重用。清单 8-1 展示了你将用来使日历小部件更易于使用的实用方法。在库的最后一行将其作为单例实例化之前，将此代码添加到库中。\n\
  \n**清单 8-1.** 使用日期实用方法扩展`$` JavaScript 库\n\n```\n// 将 padZero 方法添加到 Utils 命名空间。该方法返回传入数字的字符串\n\
  // 形式。如果数字小于 10，则会在结果字符串的开头额外添加一个 0\n$.prototype.Utils.padZero = function(number)\
  \ {\n  return (number < 10 ? \"0\" : \"\") + number.toString();\n}\n\n// 创建一个名为\
  \ Date 的新命名空间，用于存放所有与日期相关的实用方法\n$.prototype.Date = {\n  // copy 方法复制一个 Date 对象并返回副本。通常，\n\
  \  // 在 JavaScript 中，Date 作为对单个对象的引用传递，因此\n  // 无法进行普通变量复制——每个副本始终指向\n  // 同一个对象。此方法创建一个新的\
  \ Date 对象，\n  // 并从现有对象获取精确的日期和时间\n```\n\n\n\n```javascript\ncopy: function(date)\
  \ {\n    var newDate = new Date();\n    newDate.setTime(date.valueOf());\n    return\
  \ newDate;\n},\n\n// add 方法接受一个现有的 Date 对象，并为其添加指定数量的天数、\n// 月数和年数，返回结果 Date 对象\n\
  add: function(date, options) {\n    // options 对象字面量包含三个属性——day、month 和\n    //\
  \ year——分别表示要添加到输入 Date 对象中的数量\n    var daysToAdd = options.day || 0;\n    var monthsToAdd\
  \ = options.month || 0;\n    var yearsToAdd = options.year || 0;\n\n    // 创建一个新的\
  \ Date 对象，并向其添加指定的天数、月数和年数\n    var date = this.copy(date);\n    var initialDay\
  \ = date.getDate();\n    var initialMonth = date.getMonth();\n    var initialYear\
  \ = date.getFullYear();\n\n    date.setFullYear(initialYear + yearsToAdd);\n   \
  \ date.setMonth(initialMonth + monthsToAdd);\n    date.setDate(initialDay + daysToAdd);\n\
  \n    // 返回结果 Date 对象\n    return date;\n},\n\n// matchDay 方法用于判断传入的两个 Date 对象是否具有相同的日期数——例如，\n\
  // 传入 5 月 28 日和 6 月 28 日将返回 true，因为两者的日期数相同\nmatchDay: function(date1, date2) {\n\
  \    return date1.getDate() == date2.getDate();\n},\n\n// matchMonth 方法用于判断传入的两个\
  \ Date 对象是否发生在同一个月和同一年\nmatchMonth: function(date1, date2) {\n    return ((date1.getMonth()\
  \ == date2.getMonth()) && (date1.getFullYear() == date2.getFullYear()));\n},\n\n\
  // match 方法根据输入的两个 Date 对象是否代表完全相同的日期返回 true 或 false\nmatch: function(date1, date2)\
  \ {\n    return this.matchDay(date1, date2) && this.matchMonth(date1, date2);\n\
  },\n\n// format 方法将日期返回为用户友好的格式化字符串\nformat: function(date, formatDefinition, dayName,\
  \ monthName) {\n    var d = date.getDate();                // 一位或两位数字的日\n    var\
  \ dd = $.Utils.padZero(d);           // 两位数字的日\n    var dddd = dayName;        \
  \            // 星期几的全称\n    var ddd = dddd.substr(0, 3);           // 星期几的简称\n \
  \   var m = date.getMonth();               // 一位或两位数字的月\n    var mm = $.Utils.padZero(m);\
  \           // 两位数字的月\n    var mmmm = monthName;                  // 月份的全称\n   \
  \ var mmm = mmmm.substr(0, 3);           // 月份的简称\n    var yy = $.Utils.padZero(date.getYear());\
  \   // 两位数字的年份\n    var yyyy = date.getFullYear();             // 四位数字的年份\n    var\
  \ tttt = date.getTime();                 // 以时间表示的日期\n\n    return $.Utils.replaceText(formatDefinition,\
  \ {\n        d: d,\n        dd: dd,\n        ddd: ddd,\n        dddd: dddd,\n  \
  \      m: m,\n        mm: mm,\n        mmm: mmm,\n        mmmm: mmmm,\n        yy:\
  \ yy,\n        yyyy: yyyy,\n        tttt: tttt\n    })\n},\n\n// getStartOfFirstWeekInMonthSquare\
  \ 方法返回表示月份网格第一天的 Date 对象。\n// 这通常是该月第一天之前的一天，在 JavaScript 中这一天的星期是星期日，从而\n// 使日历能够显示适合整齐月份网格的日期，包括发生在上个月的日期\n\
  getStartOfFirstWeekInMonthSquare: function(date) {\n    date = this.copy(date);\n\
  \    date.setDate(1);                         // 月份的第一天\n    date.setDate(1 - date.getDay());\
  \         // 回溯到本周开始的星期日\n    return date;\n},\n\n// getEndOfWeekInMonthSquare 方法返回能适应输入日期参数所代表的月份周围\n\
  // 整齐月份网格的最后日期\ngetEndOfWeekInMonthSquare: function(date, weeksInSquare) {\n   \
  \ var DAYS_IN_WEEK = 7;\n    date = this.copy(date);\n    date.setDate(1);\n   \
  \ date = this.add(date, {\n        month: 1\n    });\n    // 回溯到该月的最后一天\n    date.setDate(date.getDate()\
  \ - 1);\n    // 向前查找到月份网格的最后一天\n    var numberOfDaysToEndOfWeek = (DAYS_IN_WEEK\
  \ - 1) - date.getDay();\n    date = this.add(date, {\n        day: numberOfDaysToEndOfWeek\n\
  \    });\n    return date;\n}\n}\n```\n\n## 构建日历\n\n清单 8-2 展示了如何使用观察者模式、清单 8-1 中的工具方法以及两个完全独立的代码块来构建日历控件：一个用于数据操作和存储，另一个用于用户界面和交互代码。将此代码保存到名为\
  \ `calendar.js` 的文件中。\n\n\n\n# **清单 8-2.** *日历自定义表单控件*\n\n```javascript\n// 创建代表日历表单控件的构造函数。输入内容包含在选项对象字面量中，\n\
  // 该对象应包含三个属性：\n// - destinationElement：页面中用于插入日历表单控件的 DOM 元素\n// - selectedDate：一个\
  \ JavaScript Date 对象，代表日历上默认选中的日期\n// - strings：一个对象字面量，包含允许日历表单控件本地化的文本字符串，\n//\
  \   包括月份和日期的名称，以及用于更改当前显示月份的“上一月”和“下一月”\n//   按钮标签的文本\nvar Calendar = function(options)\
  \ {\n\n    // 根据观察者模式，存储日历支持的事件列表\n    this.eventType = {\n        // 日历实例化后将触发\
  \ INITIALIZE 事件\n        INITIALIZE: 0,\n        // 实例化后，当前选中日期确定后将触发 READY 事件\n\
  \        READY: 1,\n        // 日历控件渲染到页面后立即触发 HTML_RENDERED 事件\n        HTML_RENDERED:\
  \ 2,\n        // 当用户希望向前显示当前显示月份的下一个月时，\n        // 触发 INCREMENT_DISPLAY_MONTH 事件\n\
  \        INCREMENT_DISPLAY_MONTH: 3,\n        // 当用户希望向后显示当前显示月份的上一个月时，\n      \
  \  // 触发 DECREMENT_DISPLAY_MONTH 事件\n        DECREMENT_DISPLAY_MONTH: 4,\n     \
  \   // 当前显示月份值改变后触发 MONTH_CHANGED 事件，\n        // 以便更新用户界面以反映新月份\n        MONTH_CHANGED:\
  \ 5,\n        // 当用户希望从日历控件中选择新日期时触发 DATE_SELECTED 事件。\n        // 新的日期值会随事件一起传递\n\
  \        DATE_SELECTED: 6\n    }\n\n    // 自实例化函数 initialize 会创建系统中两个代码块的实例，\n \
  \   // 并触发系统的第一个事件 INITIALIZE 事件以启动后续流程\n    var initialize = function(options)\
  \ {\n\n        // 数据存储和操作代码将由稍后定义的 Data 代码块表示。\n        // 我们实例化该代码块，但无需将其赋值给这里的变量，\n\
  \        // 因为它完全独立自包含。\n        new this.Data(options, this);\n\n        // 用户界面和交互代码将包含在同样稍后定义的\
  \ UI 代码块中\n        new this.UI(options, this);\n\n        // 现在代码块和事件列表已初始化，触发 INITIALIZE\
  \ 事件。\n        // Data 和 UI 代码块可以监听此事件并采取适当行动来初始化自身代码\n        this.fire(this.eventType.INITIALIZE);\n\
  \n    }.call(this, options);\n}\n\n// 为日历添加对观察者模式中 listen 和 fire 事件的支持\nCalendar.prototype\
  \ = new $.Observer;\n\n// Data 代码块是一个构造函数，包含用于存储和操作日历内部数据的代码，\n// 主要代表当前选中的日期和日历控件上当前显示的月份。\n\
  // 实例化时，日历的对象字面量输入会与父对象 Calendar 类的引用一起传入，\n// 代码块可以通过该引用使用事件列表和 Observer 方法 listen\
  \ 与 fire。\nCalendar.prototype.Data = function(options, thisCalendar) {\n\n    //\
  \ 存储三个属性：实例化 Data 的主 Calendar 实例、当前选中的日期\n    // 以及当前显示的月份\n    this.thisCalendar\
  \ = this;\n    this.selectedDate = null;\n    this.displayMonth = null;\n\n    //\
  \ 我们创建 getter 和 setter 方法来保护这些属性，确保写入合理的数据\n\n    // getDisplayMonth 方法返回控件内当前显示月份的\
  \ JavaScript Date 对象的副本\n    this.getDisplayMonth = function() {\n        return\
  \ $.Date.copy(this.displayMonth);\n    }\n```\n\n\n\n```javascript\n// setDisplayMonth\
  \ 方法用于将当前显示月份设置为传入的月份（如果存在），\n// 如果未提供参数，则将其设置为当前日期\nthis.setDisplayMonth = function(date)\
  \ {\n  this.displayMonth = $.Date.copy(date) || new Date();\n  \n  // 对于此变量，我们只关心月份，而不关心具体日期。\n\
  \  // 将日期设置为当月 1 日，以避免在月份切换时出现问题\n  this.displayMonth.setDate(1);\n  \n  // 通过返回\
  \ this 支持方法链式调用\n  return this;\n};\n```\n\n```javascript\n// getSelectedDate 方法返回\
  \ JavaScript Date 对象的副本，\n// 该副本表示日历上当前选中的日期\nthis.getSelectedDate = function()\
  \ {\n  return $.Date.copy(this.selectedDate);\n};\n```\n\n```javascript\n// setSelectedDate\
  \ 方法将当前选中日期设置为传入方法的值（如果提供了参数）。\n// 如果未提供，则改用当前日期\nthis.setSelectedDate = function(date)\
  \ {\n  this.selectedDate = $.Date.copy(date) || new Date();\n  return this;\n};\n\
  ```\n\n```javascript\n// getCalendarInstance 方法返回对实例化 Data 代码块的主 Calendar 实例的引用。\n\
  // 我们需要此引用才能访问整个系统中使用的观察者模式方法和事件列表\nthis.getCalendarInstance = function() {\n  return\
  \ this.thisCalendar;\n};\n```\n\n```javascript\n// setCalendarInstance 方法将当前 Calendar\
  \ 对象实例设置为传入方法的值。\n// 如果未传入值，则改用当前对象作用域\nthis.setCalendarInstance = function(thisCalendar)\
  \ {\n  this.thisCalendar = thisCalendar || this;\n  return this;\n};\n```\n\n```javascript\n\
  // getter 和 setter 方法完成后，我们定义系统所需的方法来操作日期\n\n// incrementDisplayMonth 方法为 displayMonth\
  \ 属性增加一个月，\n// 然后触发 MONTH_CHANGED 事件，通知整个日历控件该值已更改，\n// 以便代码在需要时对该事件做出响应\nthis.incrementDisplayMonth\
  \ = function() {\n  this.setDisplayMonth($.Date.add(this.getDisplayMonth(), {\n\
  \    month: 1\n  }));\n  \n  var thisCalendar = this.getCalendarInstance();\n  var\
  \ eventType = thisCalendar.eventType;\n  \n  // 将新的显示月份和当前选中日期传递给日历控件中\n  // 监听\
  \ MONTH_CHANGED 事件的任何代码块\n  thisCalendar.fire(eventType.MONTH_CHANGED, {\n    displayMonth:\
  \ this.getDisplayMonth(),\n    selectedDate: this.getSelectedDate()\n  });\n};\n\
  ```\n\n```javascript\n// decrementDisplayMonth 方法从 displayMonth 属性中减去一个月，\n// 然后触发\
  \ MONTH_CHANGED 事件，通知其他代码块显示月份已更改\nthis.decrementDisplayMonth = function() {\n \
  \ this.setDisplayMonth($.Date.add(this.getDisplayMonth(), {\n    month: -1\n  }));\n\
  \  \n  var thisCalendar = this.getCalendarInstance();\n  var eventType = thisCalendar.eventType;\n\
  \  \n  thisCalendar.fire(eventType.MONTH_CHANGED, {\n    displayMonth: this.getDisplayMonth(),\n\
  \    selectedDate: this.getSelectedDate()\n  });\n};\n```\n\n```javascript\n// addObservers\
  \ 方法在日历控件中触发某些事件时（无论是当前代码块触发\n// 还是其他代码块触发），分配要执行的函数\nthis.addObservers = function()\
  \ {\n  var self = this;\n  var thisCalendar = this.getCalendarInstance();\n  var\
  \ eventType = thisCalendar.eventType;\n  \n  // 监听 INITIALIZE 事件被触发，然后立即触发 READY\
  \ 事件，\n  // 并将当前要显示的月份和当前选中日期传递给它。\n  // 主 Calendar 实例在实例化此代码块后，将触发 INITIALIZE 事件\n\
  \  thisCalendar.listen(eventType.INITIALIZE, function() {\n    thisCalendar.fire(eventType.READY,\
  \ {\n      displayMonth: self.getDisplayMonth(),\n      selectedDate: self.getSelectedDate()\n\
  \    });\n  });\n  \n  // 监听 INCREMENT_DISPLAY_MONTH 事件被触发，并在触发时相应地\n  // 增加 displayMonth\
  \ 属性中存储的日期\n  thisCalendar.listen(eventType.INCREMENT_DISPLAY_MONTH, function()\
  \ {\n    self.incrementDisplayMonth();\n  });\n  \n  // 监听 DECREMENT_DISPLAY_MONTH\
  \ 事件被触发，并进行相应递减\n};\n```\n\n\n### 排版后的内容\n\n```javascript\n// displayMonth date\
  \ property when it occurs\nthisCalendar.listen(eventType.DECREMENT_DISPLAY_MONTH,\
  \ function() {\n    self.decrementDisplayMonth();\n});\n\n// Listen for the DATE_SELECTED\
  \ event and store the passed in JavaScript\n// Date object as the newly selected\
  \ date and update the displayMonth\n// property according to the month of the newly\
  \ selected date\nthisCalendar.listen(eventType.DATE_SELECTED, function(selectedDate)\
  \ {\n    self.setSelectedDate(selectedDate);\n    self.setDisplayMonth(selectedDate);\n\
  });\n\nreturn this;\n```\n\n### 第 8 章 ■ 表单控件\n\n**269**\n\n```javascript\n// 初始化\
  \ Data 代码块，存储传入的属性并开始监听系统中触发的事件\nvar initialize = function(options, thisCalendar)\
  \ {\n    this\n        .setCalendarInstance(thisCalendar)\n        .setSelectedDate(options.selectedDate)\n\
  \        .setDisplayMonth(options.selectedDate)\n        .addObservers();\n}.call(this,\
  \ options, thisCalendar);\n```\n\n```javascript\n// UI 代码块是一个构造函数，包含用于显示页面可视日历控件并允许与其交互的代码。\n\
  // 该代码块与先前定义的 Data 代码块完全分离，但根据观察者模式，\n// 它依赖于控件内触发的同一组事件\nCalendar.prototype.UI\
