  \ 元素 |\n\n## 将最佳实践付诸实践\n\n所以，你正坐在电脑前，准备按照最佳实践编写一个 HTML 页面。那么，你该如何着手呢？\n\n请记住，你的目标是编写一致且易于其他开发者理解的代码，并最终构建出一个标记正确、可供最终用户访问的网页。\n\
  \n让我们一起来看看一些指导原则和规则，它们应该能帮助你遵循最佳实践。\n\n### 编写整洁有序的代码\n\n代码缩进能增强代码的可读性。根据代码的分组或嵌套层级对代码段进行缩进，会使你的代码更易于阅读和理解。请记住，这里的目标之一就是便于其他开发者进行维护。就像你在客人到来前会整理客厅一样，你也应该保持代码整洁，以备不时之需。\n\
  \n应使用制表符（Tab）来进行缩进，而不是空格。这既能提高可维护性和可读性，又能减少页面的整体体积。在你的开发环境中，你可以配置制表符的间距，使其映射到特定数量的字符空格。\n\
  \n通常情况下，两个、四个或八个字符的空格对于可读性来说已经足够。\n\n位于其他标签内部的代码块应该进行缩进。每嵌套一层，代码就应该向内缩进一个制表符。那些仅包含显示文本内容或内联元素的标签，其内容无需相对于父级进行缩进。请看下面的示例，它展示了一些典型的间距设置。\n\
  \n```\n<div id=\"container\">\n    <p>A paragraph of content</p>\n    <table>\n\
  \        <tr>\n            <th>Name</th>\n            <th>Value</th>\n        </tr>\n\
  \        <tr>\n            <td>Red</td>\n            <td>ff0000</td>\n        </tr>\n\
  \    </table>\n</div>\n```\n\n### 减少注释\n\n我相信你见过很多网站上散落着 HTML 注释的例子。它们遵循以下格式：\n\n\
  ```\n<!-- comment goes here -->\n```\n\n通常，它们被用来标记页面中特定标签或部分的开始和结束。\n\n虽然这在试图确定后端生成的代码对你的前端输出做了什么时可能有用，但大多数开发环境和内置的浏览器开发工具都允许你定位内容块和部分的起始点与结束点，因此这种注释的使用方式有些多余。\n\
  \n在 HTML 中包含大量注释意味着终端用户必须先通过网络下载更多的标记数据到他们的浏览器，然后才能看到可与之交互的页面。我建议尽量避免使用 HTML 注释，以下情况除外：\n\
  \n- 当某些标记的使用方式在日后可能会让查看你代码的其他开发者感到困惑时。注释可以提供解释并避免混淆。\n- 当它能使特定浏览器产生特定行为时。比如在 IE\
  \ 中的条件注释，我们接下来就会看到。\n\n### 为 IE 使用条件注释\n\n从 IE 5 及以上版本（仅限 Windows）开始，微软添加了一个非常有用的功能，称为*条件注释*。其思路是，如果开发者需要编写专门针对某个特定\
  \ IE 版本或针对 IE 本身的代码，可以通过一种特殊格式的注释标签来实现，而无需使用 JavaScript 或服务器端浏览器检测。对于所有其他浏览器而言，此标签的内容显示为标准注释，因此会被忽略。\n\
  \n以下是一个针对 IE 6 及以上版本的条件注释示例：\n\n```\n<!--[if gte IE 6]>\n<p>You are browsing with\
  \ Internet Explorer version 6 or above.</p>\n<![endif]-->\n```\n\n下面这个条件注释仅针对 IE\
  \ 用户：\n\n```\n<!--[if IE]>\n<p>You are using Internet Explorer browser.</p>\n<![endif]-->\n\
  ```\n\n最后一个示例，这个条件注释针对的是版本低于 7 的 IE：\n\n```\n<!--[if lt IE 7]>\n<p>You are using\
  \ a version of Internet Explorer older than version 7.</p>\n<![endif]-->\n```\n\n\
  在条件注释中，`lt` 表示小于，`gt` 表示大于，`lte` 表示小于或等于，`gte` 表示大于或等于。\n\n这项技术在导入外部样式表时发挥了重要作用。考虑以下代码，它通常位于\
  \ XHTML 文档的 `<head>` 块内。它有条件地为 IE 6 用户加载一个外部样式表。\n\n```\n<link rel=\"stylesheet\"\
  \ href=\"master.css\" type=\"text/css\" />\n<!--[if IE 6]>\n<link rel=\"stylesheet\"\
  \ href=\"master.ie6.css\" type=\"text/css\" />\n<![endif]-->\n```\n\n大多数浏览器在读取这段代码时，会看到一个指向单个样式表\
  \ `master.css` 的引用，后面跟着一条注释（位于 `<!--` 和 `-->` 注释标记之间），它们会忽略这条注释。IE 6 是个例外。因为它识别出一个条件注释块的开始，该块指定其中的代码应仅由该特定\
  \ IE 版本读取，因此它会选择读取并解析该注释内的代码。\n\n这使得开发者可以为所有符合标准的浏览器维护一个主样式表。但是，对于那些特定 IE 版本不配合的情况，他们可以包含一个指向较小样式表的引用，该样式表只包含针对那些出现问题的元素进行样式修复的代码。将来，当\
  \ IE 6 成为遥远的记忆时，开发者只需删除该条件注释及其内部的代码，即可从他们的网站中移除所有特定于版本的代码或样式。\n\n### 正确设置 `<html>`\
  \ 标签\n\n在每个 HTML 文档的 DTD 声明之后，是 `<html>` 标签，它包裹着文档的其余内容。\n\n对于 HTML 文档，可以只保留标签本身，不指定任何属性；但在\
  \ XHTML 的情况下，必须包含某些属性。请看这个来自 XHTML 文档的示例：\n\n```\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  \ xml:lang=\"en-GB\" lang=\"en-GB\" dir=\"ltr\">\n```\n\n这个示例包含以下组成部分：\n\n`xmlns`：该属性定义了文档中自定义标签的命名空间（这是必需的，尽管目前在实际应用中很少使用）。\n\
  \n`xml:lang` 和 `lang`：这些属性指定了整个文档的语言，例如 `en` 代表英语（通常还包括地区区域设置，如 `en-GB` 代表大不列颠）。当文档中特定内容的语言发生变化时，例如使用了法语表达\
  \ *c'est la vie*，则此文本必须用标签包裹起来进行标记。在许多情况下，你会使用 `<span>` 标签，并为该元素设置 `xml:lang` 和\
  \ `lang` 属性。在前面的例子中，这个属性的值将是 `fr-FR`。\n\n`dir`：这指定了文档内内容的文本方向。对于大多数西方语言，该值将为 `ltr`（从左到右）。但是，如果内容的文本方向发生变化，你应该通过在包裹该内容的标签上设置\
  \ `dir` 属性来注明这一点。唯一可能的另一个值是 `rtl`（从右到左）。\n\n### 指定内容类型\n\n建议向浏览器或用户代理指定文档的内容类型，以防其无法直接从文件本身读取该信息，因为这可以减少假设，并确保内容以其编写时的格式可读。使用\
  \ HTML 文件 `<head>` 部分中的 `<meta>` 标签来完成此操作，如下例所示。\n\n\n\n```html\n<meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=utf-8\" /> 在这行代码中，浏览器被告知内容类型采用`UTF-8`字符集。\n\
  \n这一特定字符集非常灵活，因为全世界大多数字符都可以直接插入到文档中，而无需转换为 HTML 实体代码。这对于标准英文字母以外的字符尤其有用。\n\n## 第\
  \ 1 章 ▸ 夯实基础\n\n### 设置页面标题\n\n`<title>`标签是任何文档必不可少的组成部分。它应是一个用尽可能少的词语描述文档的单一标题。该标题在搜索引擎结果中用作页面链接的文本，并在浏览器窗口顶部显示。\n\
  \n考虑到这一点，你可能决定在页面标题中透露一些关于页面在网站结构中位置的其他信息，为那些通过谷歌搜索偶然发现你页面的人提供一些上下文。以下格式在可读且相当简洁的同时，似乎足以传达这些信息：\n\
  \n`<title> *页面标题* - *章节名称* - *网站名称*</title>`\n\n在此示例中，`*页面标题*`几乎总是与页面的主标题（通常包含在文档的`<h1>`标签中）一致。当然，你可以在各值之间使用任何你喜欢的分隔符；顺序才是关键部分。\n\
  \n明智的做法是确保网站中每个不同的页面在其章节内都有一个唯一的页面标题，这样在搜索引擎结果或站点地图中就不会出现同名的重复结果。\n\n### 分离表现、内容和行为\n\
  \n将文档内容与实现其设计和布局的代码分离开来非常重要。这种分离程度让你能够轻松进行样式更改，而无需修改标记。你甚至可以相当简单地用另一种布局替换网站的整体布局，而不会影响其内容。\n\
  \n你应该避免在标记中使用内联样式（通过许多标签的`style`属性设置），因为这会使页面的维护变得极其困难。开发人员应知道在样式表文件中查找与样式和布局相关的所有内容，而在\
  \ HTML 文档中查找与内容相关的所有内容。两者绝不应混杂。你还应将所有 JavaScript 代码放在 HTML 文档之外。\n\n相反，在 HTML 中，应通过使用`<link>`标签引用样式表，使用`<script>`标签引用\
  \ JavaScript 代码。在 HTML 标签中添加`class`和`id`属性应是连接这些文件的唯一方法；`style`属性和 JavaScript 事件处理程序不应与你的内容混杂。\n\
  \n你可以根据你希望这些样式在哪种设备上显示来引用样式表文件。例如，你可能希望为打印机和屏幕包含单独的样式表，如下例所示：\n\n```html\n<link\
  \ rel=\"stylesheet\" href=\"master.css\" media=\"screen\" />\n<link rel=\"stylesheet\"\
  \ href=\"master-print.css\" media=\"print\" />\n```\n\n当在`<link>`标签上指定了`media`属性时，只有当该属性包含值`print`时，打印机才会读取样式表；只有当该属性包含值`screen`时，屏幕才会读取样式表。这使你能够根据呈现介质不同地设置内容样式。例如，在打印机上，你可能只需要页面基本内容。你可以创建隐藏导航、页眉和页脚的样式，只保留主要内容体，这通常是大多数打印你页面的人离开浏览器时想要阅读的内容。\n\
  \n### 为整个文档添加包装元素\n\n在页面的`<body>`标签内，你通常希望为整个页面添加某些布局样式。你很快会发现，仅将样式应用于`<body>`标签不足以完成你想要执行的所有定位和布局。作为解决方案，我建议你在页面内容周围添加一个“包装”元素（通常是一个`<div>`标签），并将额外的布局样式放在该元素内，而不是直接使用`<body>`标签本身。\n\
  \n`<div>`标签仅定义了一个内容块，不会为其中的内容增加额外含义。使用`id`属性为该元素设置一个合适的名称，以便关联 CSS 样式，如下所示：\n\n\
  ```html\n<body>\n    <div id=\"page\">\n        ...\n    </div>\n</body>\n```\n\n\
  如果你的设计非常简单，也许可以仅使用`<body>`标签。不过还是建议添加一个包装元素，因为你永远不知道你的设计将来会如何变化。\n\n### 帮助 CSS 和\
  \ JavaScript 定位特定页面\n\n我提倡的一种做法是：为网站中每个页面的`<body>`标签添加一个唯一的`id`属性。\n\n假设你为一个多页面网站创建了通用样式，并且你希望在一个特定页面上略微不同地应用某一特定样式。在这种情况下，你需要创建一个例外规则。如果网站上的每个页面都有一个唯一的`id`属性，你就可以创建一个仅针对这一个页面的样式。\n\
  \n想象一下，你希望网站上所有段落文本都以白底黑字显示，但在首页上，你希望它反转：黑底白字。首页将拥有一个唯一的`id`属性，如下所示：\n\n```html\n\
  <body id=\"homepage\">\n```\n\n而段落文本的样式将如下所示：\n\n```css\np {\n    background:white;\n\
  \    color:black;\n}\n\n#homepage p {\n    background:black;\n    color:white;\n\
  }\n```\n\n此外，通过以这种方式使用`id`属性，你可以使用 JavaScript 的`document.getElementById`方法轻松获取对特定页面的引用：\n\
  \n```javascript\nvar homepage = document.getElementById(\"homepage\");\n```\n\n\
  ### 保持一致地命名 ID 和 Class 属性\n\n你应该将正文内容的每个逻辑部分或块包装在各自的`<div>`标签中，并使用合理的、与上下文相关的值作为它们的`id`属性。某些元素在大多数页面和网站中是通用的，包括导航、页眉和页脚。在可能的情况下，这些类型的元素应在页面和项目间保持一致，以利于未来的维护。这使开发人员即使处理不熟悉的页面也能识别元素。\n\
  \n考虑使用类似以下的`id`属性值：\n\n```html\n<div id=\"header\">\n<div id=\"content\">\n<div\
  \ id=\"aside\">\n<div id=\"footer\">\n<div id=\"navigation\">\n```\n\n你应该根据`id`或`class`属性所包含的内容类型来命名它们的值，而不是根据它们使用的任何样式。例如，这种形式：\n\
  \n```html\n<p class=\"error\">\n```\n\n比这种形式更好：\n\n```html\n<p class=\"red-text\"\
  >\n```\n\n> **提示：** 在`id`和`class`属性值中使用连字符（`-`）分隔单词使它们更易于阅读。\n\n用与内容相关的信息标记`class`属性意味着，当你的网站设计师更改页面的特定部分时，你无需更改标记；只需要修改样式表即可。这也意味着\
  \ HTML 文档本身仅作为对其中内容的描述而独立存在，而不是依赖于任何外部文件、样式或代码。\n\n### 正确排列内容顺序\n\n确保文档中内容的顺序正确与确保内容被正确的标签标记同样重要。请记住，你需要确保当页面被朗读时，最重要的页面内容——页面的主体或主题——被首先朗读，而不那么重要的内容——例如导航链接和版权信息——被最后朗读。屏幕阅读器软件严格按照源代码顺序朗读文档内容，这意味着标记中先出现的内容会被首先朗读。\n\
  \n\n\n# 构建坚实基础\n\n为了让屏幕阅读器用户以最有意义的方式获取内容，你应按以下顺序组织标记语言的 `<body>` 内容：\n\n-   页面标题\n\
  -   简短跳转链接列表（页面内锚点链接），帮助读者直接跳至页面后续内容\n-   主体内容\n-   侧边内容（边栏、相关内容或上下文相关链接）\n-   主导航\n\
  -   页脚与版权信息\n\n你可以使用 CSS 修改页面的视觉布局，使其符合设计需求。本章后续的“样式无障碍指南”部分将对此进行说明。\n\n## 将前景图像与背景图像分离\n\
  \n区分页面中与内容直接相关的图像和与布局或模板相关的图像非常重要。与页面内容直接相关的图像——如图表、图示、宠物照片等——应使用 `<img>` 标签进行标记。所有其他图像，包括公司徽标和图标，则应在样式表文件中通过背景图片引用。这提供了另一种区分页面布局与相关内容的方式。\n\
  \n问问自己：“如果我只打印页面的主体内容，这张图像会显得格格不入吗？还是与内容上下文相关？”实践中，你会发现大多数图像文件将通过 CSS 引用，而非使用 `<img>`\
  \ 标签标记。\n\n在确实使用 `<img>` 标签的情况下，请记得使用 `alt` 属性，为因故无法在浏览器中查看图像的用户描述图像内容。如果图像较为复杂（如曲线图或图表），可能需要更详细的说明。此时可考虑使用\
  \ `longdesc` 属性，指向包含图像所传达信息深度描述的页面 URL。\n\n## 正确使用表格\n\n直到几年前，使用 HTML `<table>`\
  \ 标签进行页面组件定位仍属常见做法。`<table>` 标签应仅用于表示表格数据，绝不可用于定位页面内容；CSS 完全足以胜任内容定位和页面布局的任务。\n\n\
  你可以通过多种方式为表格数据添加额外的语义信息，所有这些方法都能提升表格内信息的可访问性，因此值得实施。简而言之，这些方法包括：\n\n-   在起始 `<table>`\
  \ 标签后使用 `<caption>` 标签为表格添加标题。请注意，如果不希望显示标题内容，可随时通过样式表隐藏此标签内容，但为页面添加尽可能多的语义数据始终是明智之举。\n\
  -   使用 `<table>` 标签的 `summary` 属性，提供表格内容及其目标的简要概述。该属性可被朗读出来，以概括表格内容。\n-   使用 `<thead>`、`<tbody>`\
  \ 和 `<tfoot>` 标签，将表格的头部、主体和底部区域分组。请注意这些标签必须按特定顺序放置：先放 `<thead>` 和 `<tfoot>`，再放 `<tbody>`。这样浏览器可以在其余内容仍在加载时，先显示表格的头部行和底部行。\n\
  -   使用 `<th>` 标签标记表头单元格，使用 `<td>` 标记实际数据单元格。\n-   为每个表头单元格赋予唯一的 `id` 属性值。然后，为每个数据单元格将其\
  \ `headers` 属性值设为关联表头单元格 `id` 值的逗号分隔列表。\n\n以下是运用所有这些标记技术的表格示例：\n\n```\n<table summary=\"\
  表格显示本课程学生的平均年龄为 26 岁\">\n  <caption>本课程注册学生及其年龄表</caption>\n  <thead>\n    <tr>\n\
  \      <th id=\"student-name\">学生姓名</th>\n      <th id=\"age\">年龄</th>\n    </tr>\n\
  \  </thead>\n  <tfoot>\n    <tr>\n```\n\n\n\n<th id=\"average-age\">平均年龄</th>\n\n\
  <td headers=\"age, average-age\">26</td>\n\n</tr>\n</tfoot>\n<tbody>\n<tr>\n<td\
  \ headers=\"student-name\">约翰·刘易斯</td>\n<td headers=\"age\">24</td>\n</tr>\n...\n\
  <tr>\n<td headers=\"student-name\">彼得·琼斯</td>\n<td headers=\"age\">28</td>\n</tr>\n\
  </tbody>\n</table>\n\n## 优化表单\n\n你应使用 `<fieldset>` 标签将逻辑上相关的表单区域分组，每个 `<fieldset>`\
  \ 内包含一个 `<legend>` 标签，为该字段组提供标题。例如，信用卡申请表可能包含个人信息、信用记录和银行详情等部分。在这种情况下，可以创建三个 `<fieldset>`\
  \ 标签，并分别设置 `<legend>` 标签为“个人信息”、“信用记录”和“银行详情”，示例如下：\n\n```\n<form method=\"get\"\
  \ action=\"/\">\n  <fieldset>\n    <legend>个人信息</legend>\n    ...\n  </fieldset>\n\
  \  <fieldset>\n    <legend>信用记录</legend>\n    ...\n  </fieldset>\n  <fieldset>\n\
  \    <legend>银行详情</legend>\n    ...\n  </fieldset>\n  <input type=\"submit\" value=\"\
  保存\" />\n</form>\n```\n\n确保表单中每个具有关联文本标签的字段都已使用 `<label>` 标签标记。该标签需使用 `for` 属性，其值应与关联字段的\
  \ `id` 属性值一致。在默认浏览器行为下，该设置可使 `<label>` 标签变为可点击区域，从而将表单焦点移至关联字段，用户在选择标签时即可与相应字段交互。为了更灵活地对表单字段及其关联标签应用样式规则，请在每个字段周围添加\
  \ `<div>` 包装标签，以便通过样式表定位字段并设置间距及其他视觉属性。示例如下：\n\n```\n<div class=\"field\">\n  <label\
  \ for=\"first-name\">名字</label>\n  <input type=\"text\" id=\"first-name\" name=\"\
  first-name\" />\n</div>\n```\n\n需特别关注 `<fieldset>` 内 `<legend>` 和 `<label>` 标签中使用的文字。当这些字段标签被某些屏幕阅读软件朗读时，`<legend>`\
  \ 标签内的文字会作为前缀附加到 `<label>` 标签的文字前，为听众提供额外上下文。你必须确保朗读时这些内容对听众而言是清晰合理的。\n\n## 避免使用框架\n\
  \n你应不惜一切代价避免使用框架集。它们会使网站的内容和布局难以维护，在小屏幕设备（如手机）上使用起来很麻烦，并且给不使用鼠标作为主要输入方式的终端用户浏览内容造成困难。\n\
  \n内联框架（使用 `<iframe>` 标签）应尽量少用，甚至不用。它们可能让终端用户感到困惑，且缺乏单页 HTML 文档固有的无障碍特性。\n\n## 网页内容无障碍指南\n\
  \n如果你不熟悉网页内容无障碍指南（WCAG），请阅读 W3C 的推荐标准，访问 [`www.w3.org/TR/WCAG20/`](http://www.w3.org/TR/WCAG20/)。这些指南定义了网页无障碍合规性的三个不同等级：A、AA\
  \ 和 AAA，其中 AAA 代表最高级别的无障碍内容。\n\n无障碍指南不仅涉及技术层面，还涉及创意设计、文案撰写和信息架构，这些共同为终端用户提供完整的体验。AAA\
  \ 合规性是任何网站开发者追求的终极目标，应始终努力达成。然而，AA 合规性通常可以实现，对于受时间或设计限制的开发者来说是一个理想的中间标准。遵循本章指南，你将通过技术手段为提供最优质的无障碍体验迈出坚实一步，但你必须了解不同用户如何与网页交互，因此我鼓励你阅读\
  \ WCAG 文档。\n\n## 别被访问键迷惑\n\n\n\n# 关于快捷键与网页可访问性的注意事项\n\n## 避免使用 `accesskey`\n\n曾被誉为网页绝佳增强功能的\
  \ `accesskey` 是键盘快捷键，允许用户跳转到页面上的特定内容或外部页面。然而，现代观点已将其否定，你应该避免使用 `accesskey`。\n\n\
  键盘快捷键对不使用鼠标的最终用户非常有用。事实上，这些用户通常已在操作系统中设置了他们自己的快捷键。不幸的是，`accesskey` 常常与用户定义的键盘快捷键冲突。当用户认为他们正在使用自己的快捷键，但实际上却触发了\
  \ `accesskey` 快捷键，或反之亦然时，他们会感到困惑。\n\n`accesskey` 也可能令人困惑，因为不同网站通常使用不同的键来执行相同的操作。这意味着最终用户必须为每个访问的网站熟悉一套不同的快捷键。这在计算机软件世界中是不被期望的，因为在软件中，某些键盘快捷键通常执行相同的操作，无论程序是什么。\n\
  \n可访问性的黄金法则之一是减少最终用户的困惑。因此，我们必须认为 `accesskey` 理论虽好，但实践不佳。\n\n## 不要被 `tabindex` 迷惑\n\
  \n另一个你应该避免的所谓可访问性增强是 `tabindex`。它设置当用户按下键盘上的 `Tab` 键时，链接、表单字段等元素变为活跃的顺序。不幸的是，无法仅为单个字段添加\
  \ `tabindex`。如果你为一个元素指定了 `tabindex`，则必须为每个元素都指定；否则，你将无法控制 `Tab` 键的跳转顺序。维护的艰巨任务及其对可访问性的有限影响，使这一特性成为败笔。\n\
  \n更好的解决方案是确保你的文档结构良好，将重要内容放在页面顶部，并在源代码中按你希望的 `Tab` 键跳转顺序指定链接和表单字段。然后，你可以使用样式表将这些元素定位到屏幕上所需的视觉位置或顺序。\n\
  \n## 不要依赖插件\n\n从定义上讲，浏览器插件本身并不具备可访问性。由于它不是浏览器的一部分，绝不能假设用户拥有任何特定插件。如果最终用户没有特定的插件（例如\
  \ Adobe 的 Flash Player），则应提供替代内容，如本章前面所述。\n\n将整个网页封装在 Flash 影片中是不明智的，尽管这在网络上很常见。影片中的内容对某些浏览器的用户以及没有插件的用户来说是不可访问的，并且对大多数搜索引擎不可见。相反，考虑在页面上使用\
  \ Flash 组件——例如在 Flash 影片容器中显示的电影预告片，或对导航栏进行特殊的创意处理。然后确保没有插件的用户能够通过其他方式访问内容。例如，你可以包含电影预告片的文字转录，或一个没有创意处理的纯文本导航栏。通过这种方式，你可以在不牺牲可访问性的前提下创建美观、智能的网页。\n\
  \n## 尽可能添加额外语义\n\n一些开放标准正在兴起，用于为文档标记中的某些内容块添加额外含义。其中一种标准称为 *微格式*（microformats）。微格式是在网页中表示人、事件、标签等内容的\
  \ HTML 代码块。它们既可供人类阅读，也可供机器阅读，并且只需为某些属性分配某些值即可。\n\n例如，`hCard` 微格式用于标记地址卡片信息，类似于常用于在计算机软件之间交换地址信息的\
  \ `vCard` 格式。以下是一个使用 `hCard` 微格式标记姓名、网站 URL 和移动电话号码的示例：\n\n```html\n<div class=\"\
  vcard\">\n```\n\n\n\n# [<a class=\"url fn\" href=\"http://www.denodell.com/\">](http://www.denodell.com/)\n\
  \n丹·奥德尔\n\n</a>\n\n<span class=\"tel\">\n\n<span class=\"type\">手机</span>\n\n<span\
  \ class=\"value\">+441234567890</span>\n\n</span>\n\n</div>\n\n实际使用的标签并不重要。真正起作用的，是那些能被专门构建的软件（包括某些现有网页浏览器）识别的属性名称。利用样式表规则，可以隐藏页面上不想显示的任何内容片段，并将其作为标记中的纯语义数据保留下来。\n\
  \n**提示** 还有其他微格式可用于标记日历事件（`hCalendar`）、内容评论（`hReview`）等。在本书撰写期间，新的微格式也在不断被推荐。请关注最新进展，并查看更多示例，[详情请访问\
  \ http://microformats.org/。](http://microformats.org/)\n\n**30**\n\n## 第 1 章 ■ 奠定坚实基础\n\
  \n### 最佳格式化实践：CSS\n\n作为开发者，你很可能打开过别人编写的样式表文件，并在心里嘀咕：“这让我怎么理解？”一旦你将所有布局样式与文档的标记分离，你就会发现，构建一个页面或网站所需的样式定义数量有多庞大！\n\
  \n正是由于布局页面所需的样式定义数量庞大，如果不遵循一些明智的 CSS 文件和样式结构指南，维护布局很快就会变得繁琐。\n\n### 关于设计的像素级完美还原\n\
  \n作为开发者，我们应当始终努力将页面构建得与源创意设计尽可能像素级匹配。然而，有时为了这种像素级一致性所付出的努力，并不值得从中获得的视觉提升。\n\n以表单字段为例。我已经记不清遇到过多少份创意设计，其中展示了带有自定义设计手柄的`<select>`下拉框（*手柄*是指下拉框边缘向下的箭头）。过去尝试对这些下拉框进行样式设计的同仁们——相信我，我也试过——都发现了浏览器之间巨大的差异。\n\
  \n似乎浏览器越现代化，我们对原生控件的控制权就越大。但这对于大多数人来说并无帮助。许多人仍然需要支持像 IE 6 这样的老旧浏览器——无论其表单控件看起来多么古老。\n\
  \n解决方案是采取“尽力而为”的方法。对于支持控件样式的浏览器，提供自定义样式的表单控件；对于无法渲染出预期效果的老旧浏览器，则需要务实对待。\n\n所有主流浏览器都允许你设置背景色、文字颜色、字体和行高（不过高度设置在不同浏览器中可能产生不同效果，因此需要一些实验）。但并非所有浏览器都允许你指定边框样式或颜色，或自定义下拉框手柄的外观。你应提前让客户知晓这一点。否则，你将不得不相应调整设计，以在不同浏览器上实现完全一致的外观。\n\
  \n根据经验以及充分的常识，我们知道大多数终端用户只在机器上运行一个浏览器。此外，大多数用户并不会仔细审视设计元素。通常，他们不会发现某个`<select>`框的边框与页面上其他表单字段不匹配。终端用户主要关心的是，能否快速从你的页面获取所需信息。\n\
  \n以下是几条经验法则，用于判断在使用相同 CSS 时，跨浏览器差异应在何处划定界限：\n\n- 如果为某种设计效果花费的开发时间与视觉提升不成比例，你可以舍弃该页面的某些设计元素。\n\
  - 如果未来为支持该布局而对代码库进行修改所需的维护工作过于繁重，你可以舍弃该页面的某些设计元素。\n\n\n# 第一章：夯实基础\n\n## W3C CSS\
  \ 标准\n\n早在 1996 年，W3C 就向开发者推荐了`CSS 1.0`。目前大约 99%的常用浏览器都普遍支持该标准。\n\n`CSS 2.1`是当前的推荐标准，虽然它尚未在所有浏览器中得到普遍支持（目前仅限于最常用浏览器中的`Firefox\
  \ 3`、`Safari 3`、`IE 8`、`Opera 9.5`和`Google Chrome`版本），但这 99%的浏览器中都能找到部分支持。CSS 定位（在`CSS\
  \ 2.1`成为推荐标准之前也称为 CSS-P）功能已得到支持，可以实现元素在页面上的绝对定位（相对于浏览器窗口左上角）和相对定位（相对于其包含元素）。\n\n\
  目前正在寻求推荐的是`CSS 3`（尽管它已经处于这个阶段很长时间，因为不断有新的增补建议被提出）。迄今为止，`Safari 3`对`CSS 3`的支持最好，但`Firefox`和`Opera`的最新版本对其支持程度也在不断提高。只要你能确保在尽可能多的浏览器中充分呈现你的设计，就不必害怕使用`CSS\
  \ 2.1`和`CSS 3`的样式规则。\n\n## 样式表指南\n\n通过遵循 CSS 最佳实践，你可以实现使网页完全可访问且代码易于维护的主要目标。本节介绍的指南将帮助你为未来可能需要的任何变更准备好样式表，同时确保满足最终用户的需求。\n\
  \n### 分离通用样式规则\n\n最好在每个页面中只包含渲染该页面所需的 CSS 样式规则。包含未使用的额外样式规则会导致浏览器在识别并丢弃这些数据之前，需要下载和解析额外的数据。然而，必须牢记两点：可维护性和对浏览器工作原理的理解。\n\
  \n考虑一个致力于提供最新体育比分的网站，它由四个页面组成。首页向访问者介绍网站宗旨，并提供指向其他页面的链接。其他页面包括体育比分页面、新闻更新页面和常见问题解答（FAQ）页面。根据上述指南，每个页面上的样式规则应仅包含渲染该特定页面所需的规则。\n\
  \n现在考虑这些网页在屏幕上的外观。大多数网站都有跨页面存在的组件，例如包含网站徽标和导航的页眉部分，以及包含版权信息的页脚。此外，大多数网站设计都基于布局模板，因此每个页面都符合同样的大致尺寸，并采用设计者指定的网格布局。\n\
  \n试想一下，如果网站的四个页面各自对应一个样式表文件，且页眉、页脚和通用页面布局的样式在这四个文件中重复，那么维护这些样式将是一场噩梦。\n\n需要一种更合理的方法来确保可维护性并避免样式规则重复。\n\
  \n所有主流网络浏览器都力求为用户提供最快、最愉悦的浏览体验，并为此采用了许多方法。其中一种方法称为*缓存*，它涉及将用于显示网页的所有 HTML、图像、样式表、JavaScript\
  \ 文件和其他静态资源的副本，本地存储在最终用户的硬盘上。这意味着当用户点击浏览器的后退按钮或重新访问某个页面时，浏览器只需在硬盘上查找即可检索显示页面所需的数据。这避免了通过相对较慢的互联网连接再次下载这些资源，从而使页面显示速度比以前快得多。\n\
  \n在简单情况下，例如网站徽标图片，当用户访问首页时会被下载一次。只要每个页面都指向网络服务器上相同的图片文件，并且该图片在此期间未更新，网络浏览器就会从其硬盘缓存中获取该图片，而不是浪费时间重新下载。我们可以将同样的原理应用于样式表。\n\
  \n假设你为网站创建了一个样式表，其中仅包含通用页面布局和所有页面共有的通用组件的样式。你在每个页面中都引用这个相同的文件。当最终用户首次访问网站上的某个页面（通常是首页）时，网络浏览器会下载此文件一次；之后在后续页面访问中，浏览器将使用已下载的文件。这加快了页面的渲染速度，因为无需花费时间下载不必要的文件。这还有一个额外的好处，即将所有整个网站通用的页面样式集中在一个文件中，从而避免了页面间样式规则的重复。\n\
  \n你可以将特定页面的样式规则放置在各自独立的文件中，这样每个页面将引用两个外部样式表：一个网站通用，一个页面独有。\n\n### 理解层叠与优先级\n\n讨论样式表时，有两个重要的术语：*层叠*和*优先级*。层叠（CSS\
  \ 缩写中的字母 C）用于描述样式以叠加方式应用的过程。优先级则描述了特定样式在页面上应用的实例级别。\n\n组织样式规则最合理的方式是从编写通用样式开始，然后随着进度逐渐增加样式的优先级。通常，样式越通用，样式表文件就越高效。尽量避免过度指定样式规则。没有必要列出应用于你所设样式元素的每个标签、ID\
  \ 或类——保持简洁明了。\n\n例如，考虑一个 HTML 页面，其`<body>`标签包含以下标记：\n\n```html\n<body>\n  <div id=\"\
  page\">\n    <div id=\"header\">\n      <h1>我的页面标题</h1>\n    </div>\n    ...\n \
  \ </div>\n</body>\n```\n\n与其对标题标签应用样式时指定如下：\n\n```css\nbody #page #header h1 {\n\
  }\n```\n\n不如指定更简单的样式：\n\n```css\n#header h1 {\n}\n```\n\n由于你知道 HTML 中所有`id`属性值必须是唯一的，因此页面上只能有一个`id`值为`header`的元素，所以在样式规则中指定其父级元素是多余的。你也不需要指定`body`标签选择器，因为根据定义，你能够应用样式的唯一标签都在`<body>`标签内。此外，在前面的新样式规则中，你可以将`header`保留为页面的一个独立组件，不受其父元素的限制。如果你决定将`<div\
  \ id=\"header\">`标签在标记中移动，并将其放置在不同的父元素内，你知道样式规则会以相同的方式应用于它。\n\n让我们考虑另一个例子。假设你想要两个文本段落以相同的字体显示，仅在大小和颜色上有所不同。以下是\
  \ HTML：\n\n```html\n<body>\n  <div id=\"page\">\n    <p>那只敏捷的棕色狐狸跳过了懒狗。</p>\n  \
  \  <div class=\"alternative\">\n      <p>五个拳击巫师快速跳跃。</p>\n    </div>\n  </div>\n\
  </body>\n```\n\n现在来看样式规则：\n\n```css\n#page p {\n  font-family: Verdana, Arial, Helvetica,\
  \ sans-serif;\n  font-size: 1.3em;\n  color: #000;\n}\n\n#page div.alternative p\
  \ {\n  color: #f00;\n  font-size: 1em;\n}\n```\n\n最通用的样式规则（即前面代码中两个规则中的前者）中描述的样式将应用于`<div\
  \ id=\"page\">`标签内的所有段落标签。而后一个样式规则则应用于`<div class=\"alternative\">`标签内更具体的段落标签。\n\
  \n这种叠加效应就是我们所说的*层叠*。\n\n\n\n## 同样值得关注的 `!important` 关键字\n\n同样值得关注的是 `!important`\
  \ 关键字。你可以将其添加至任意样式的末尾，强制该规则在更具体的层面上优先于其他所有规则。你可以在前面的示例中添加这个关键字，如下所示：\n\n```css\n\
  #page p {\n  font-family: Verdana, Arial, Helvetica, sans-serif;\n  font-size: 1.3em;\n\
  \  color: #000 !important;\n}\n\n#page div.alternative p {\n  color: #f00;\n  font-size:\
  \ 1em;\n}\n```\n\n由于更通用样式的颜色已被标记为 `!important`，其样式将优先于该样式更具体的实例。在此例中，颜色 `#000` 会应用于示例页面中的所有段落文本。\n\
  \n在许多情况下，使用 `!important` 关键字来强制执行错误的优先级是不恰当的，这通常是样式表结构设计不佳的迹象。日后需要返回样式表文件找出为什么指定样式未能生效，既浪费时间又令人头疼。如果你发现需要频繁使用\
  \ `!important` 关键字，请考虑重构你的样式，以确保正确的规则能应用于目标元素。在某些情况下，这可能意味着需要在页面上添加一点额外标记，以确保样式能够以正确的方式应用。但这总比拥有一个结构糟糕、样式规则混乱的样式表要好。\n\
  \n## 考虑打印机\n\n在构建网站样式表时，大多数开发者（虽然很少是故意的）会忽略打印机。当用户点击浏览器工具栏上的打印按钮时，了解哪些内容会被打印、哪些不会是很重要的。有三点你需要考虑：\n\
  \n-   **宽幅内容**：宽度超过打印页面宽度的内容通常会被截断——根本不会打印出来。有些浏览器允许按比例缩放内容以适应打印页面，但这可能导致文本难以阅读，具体取决于你网站布局的宽度。\n\
  -   **背景图像和颜色**：由于你只应将与该页面内容直接相关的图形作为前景图像包含进来，所有其他图像（例如标志）都应该作为背景图像。在很多情况下，页面上的所有图像实际上都是背景图像，通过外部\
  \ CSS 样式表文件指定。大多数浏览器不会打印这些背景图像和颜色。这是浏览器厂商为节省墨水、只打印必要内容（即页面文本内容）所采取的明智举措。如前所述，在大多数情况下，用户打印网页是为了阅读其主要正文内容——无论是火车时刻表、书评还是银行对账单。很少有网站访问者希望打印出的页面与屏幕显示完全一致。对于那些希望如此的人，通常可以在浏览器的隐藏首选项设置中启用打印背景图像和颜色，但这些选项默认很少是开启的。\n\
  -   **文本颜色**：大多数办公室环境中的用户只能使用激光打印机，通常只能打印黑白内容。大多数家庭用户拥有能够进行全彩、照片级打印的喷墨打印机。考虑到最低共同标准，如果你有黑白打印机，请用它测试打印你的页面；或者选择只用黑色墨水在喷墨打印机上打印。当考虑背景图像时，文本颜色也会发挥作用。假设你的网页在深色背景上使用白色文本。由于背景颜色不会打印，你将得到打印在洁白纸张上的白色文本。当然，打印机没有白色墨水可打印，因此用户实际上会得到一张空白页！\n\
  \n打印出来的网页通常会显示大片的空白区域，那里曾经是背景图像和颜色，有时还会有些内容被切掉，一些浅色文本完全丢失。这几乎不可能是用户希望在打印页面上看到的结果。\n\
  \n你不想成为用户沮丧的源头，因此应该通过指定一个仅供打印机读取的样式表来规避这些限制，使用以下标记：\n\n```html\n<link rel=\"stylesheet\"\
  \ href=\"master-print.css\" media=\"print\" />\n```\n\n在这个仅用于打印的样式表中，你需要最小化打印页面上可能出现的空白区域，移除不必要的组件，并确保最终打印的文章中没有内容被截断或隐藏。例如，你可以通过应用以下样式规则来移除导航：\n\
  \n```css\n#navigation {\n  display: none;\n}\n```\n\n你可能需要指定一个字体颜色，例如黑色，以覆盖页面上所有其他的文本颜色。这可以通过以下样式规则实现：\n\
  \n```css\n* {\n  color: #000 !important;\n}\n```\n\n这会将黑色（十六进制表示为 `#000000`，简写为\
  \ `#000`）应用于页面上的所有元素（`*` 通配符用于定位页面上所有元素）。\n\n请注意样式规则末尾使用的 `!important` 关键字。正如我前面提到的，这是一个危险的关键字，因为它强制该样式比文档中的任何其他样式都更重要。然而，它在打印机样式表中非常有用，因为它允许你覆盖由主样式表指定的页面上任何元素的字体颜色，而无需考虑其特异性级别。\n\
  \n## 格式化你的样式规则\n\n以下示例展示了一种久经考验、可读性良好的样式规则布局：\n\n```css\n.module-heading,\n.module-subheading\
  \ {\n  background: #333;\n  color: #f00;\n  float: left; /* 内联注释 */\n}\n```\n\n\
  在这个样式规则中，使用了多个样式选择器，将该样式规则应用于具有两个不同 CSS 类的页面元素。样式选择器被放在单独的行上，而不是放在同一行（这可能会造成混淆）。样式规则在最后一个\
  \ CSS 类名所在行的末尾开始，并在所有样式规则之后另起一行结束。样式规则本身相对于样式定义缩进一个制表位。在每个样式属性名称后的冒号与其对应值之间有一个空格。\n\
  \n每个样式属性独占一行，并且每行以分号结束。\n\n如果需要为某个样式规则提供注释以协助未来的开发或维护，此注释应紧跟在规则本身所在行的分号之后。\n\n为了保持样式规则的一致性，你可以选择按样式属性名称的字母顺序排序，或者根据样式属性的类型（文本、颜色、布局等）排序，或者根据适合你的应用的任何其它分组方式排序。\n\
  \n## 为单个页面元素应用多个类名\n\n正如本章前面提到的，在 HTML 标记中指定的 CSS 类名应该描述元素内容所代表的信息，而不是该内容应如何显示。\n\
  \n你可能希望对同一元素应用多个类名，以避免重复你的样式规则。在你的标记中，这可以通过简单地用空格字符分隔每个 CSS 类来实现，如下例所示：\n\n```html\n\
  <div class=\"article main-article\">\n  <p>Hello, world.</p>\n</div>\n```\n\n为 `article`\
  \ 和 `main-article` 类编写的样式规则将从左到右应用于 `<div>` 标签，因此 `main-article` 样式规则中指定的样式将优先于\
  \ `article` 样式规则中的样式。\n\n如果你需要为以这种方式包含多个类的元素应用特殊样式，以下 CSS 选择器语法将允许你做到这一点：\n\n```css\n\
  div.article.main-article p {\n  color: #0f0;\n}\n```\n\n此样式规则应用于其父标签为 `<div class=\"\
  article main-article\">` 的 `<p>` 标签。请注意 CSS 类名之间没有空格字符。\n\n## 重置浏览器的默认样式\n\n\n\n\
  默认情况下，网页浏览器会自带一组默认的样式规则，用于对未设置样式的页面进行渲染。这包括字体、字号、行高、颜色，以及在不同元素和标签上程度各异的填充（padding）和外边距（margin）。\n\
  \n为了让自己的样式有一个公平的起点，我建议你重置浏览器的默认样式。这样可以将对每个元素的精确控制权移交给自己的样式表，从而在不同浏览器之间提供更高的一致性。\n\
  \n在最简单的情况下，以下样式规则会将所有页面元素的外边距和填充都归零，以便你在样式规则中为每个需要指定间距的元素单独设置自己的外边距和填充间距：\n\n```\n\
  * {\n  margin: 0;\n  padding: 0;\n}\n```\n\nCSS 样式大师 Eric Meyer 提供了一份非常全面的重置样式表，它能彻底消除不同浏览器默认样式规则之间的差异（http://meyerweb.com/eric/tools/css/reset/）。其当前版本如清单\
  \ 1-1 所示。\n\n## 打下坚实基础\n\n**清单 1-1.** Eric Meyer 的通用跨浏览器样式重置\n\n```\n/* v1.0 | 20080212\
  \ */\n\nhtml, body, div, span, applet, object, iframe,\nh1, h2, h3, h4, h5, h6,\
  \ p, blockquote, pre,\na, abbr, acronym, address, big, cite, code,\ndel, dfn, em,\
  \ font, img, ins, kbd, q, s, samp,\nsmall, strike, strong, sub, sup, tt, var,\n\
  b, u, i, center,\ndl, dt, dd, ol, ul, li,\nfieldset, form, label, legend,\ntable,\
  \ caption, tbody, tfoot, thead, tr, th, td {\n  margin: 0;\n  padding: 0;\n  border:\
  \ 0;\n  outline: 0;\n  font-size: 100%;\n  vertical-align: baseline;\n  background:\
  \ transparent;\n}\n\nbody {\n  line-height: 1;\n}\n\nol, ul {\n  list-style: none;\n\
  }\n\nblockquote, q {\n  quotes: none;\n}\n\nblockquote:before, blockquote:after,\n\
  q:before, q:after {\n  content: '';\n  content: none;\n}\n\n/* 记住要定义焦点样式！ */\n:focus\
  \ {\n  outline: 0;\n}\n\n/* 记住要以某种方式突出显示插入的内容！ */\nins {\n  text-decoration: none;\n\
  }\n\ndel {\n  text-decoration: line-through;\n}\n\n/* 表格在标记中仍需 cellspacing=\"0\"\
  \ */\ntable {\n  border-collapse: collapse;\n  border-spacing: 0;\n}\n```\n\nEric\
  \ Meyer 花费了大量时间研究和测试每个主流浏览器对 CSS 的支持，他的重置样式就是这项辛勤劳动所结出的备受赞誉的果实。\n\n无论你选择使用本节开头展示的简单外边距/填充重置代码，清单\
  \ 1-1 中 Eric Meyer 的完整“重置一切”代码，还是通过快速搜索网络找到的其他替代方案，你都应该在主站点 CSS 文件的最开始、在应用任何其他样式规则之前，指定这些重置样式。\n\
  \n## 掌握简写样式规则\n\n某些样式可以合并或缩短，在可能的情况下，你应该使用这些版本来减小 CSS 文件的体积，并减少从 Web 服务器到浏览器通过网络传输的数据量。\n\
  \n举一个简单的例子，元素上的某些外边距和填充值可以使用冗长的方式指定：\n\n```\np {\n  margin-top: 5px;\n  margin-right:\
  \ 7px;\n  margin-bottom: 5px;\n  margin-left: 7px;\n  padding-top: 6px;\n  padding-right:\
  \ 3px;\n  padding-bottom: 6px;\n  padding-left: 3px;\n}\n```\n\n或者使用简写方式：\n\n```\n\
  p {\n  margin: 5px 7px 5px 7px;\n  padding: 6px 3px 6px 3px;\n}\n```\n\n请注意，`margin`、`padding`\
  \ 和 `border` 的简写值顺序始终如下：\n\n- 上\n- 右\n- 下\n- 左\n\n当 `margin-top` 和 `margin-bottom`\
  \ 的值相同，并且 `margin-left` 和 `margin-right` 的值也相同时，可以应用进一步的简写形式，如下所示：\n\n```\np {\n\
  \  margin: 5px 7px; /* 上下 5px，左右 7px */\n  padding: 6px 3px;\n}\n```\n\n其他样式——例如\
  \ `font`、`color` 和 `background`——也有各自的简写形式。第四章（专注于提升 CSS 文件性能）提供了关于这些样式简写形式的更多细节。\n\
  \n## 样式无障碍指南\n\n到目前为止，你应该知道，作为 Web 开发者，我们主要关注点之一是无障碍性——确保我们的内容对所有人都可用，无论他们使用何种浏览器、设备或输入方式。主要重点是确保语义化标记，正如本章前面所讨论的，但你还必须确保样式表支持这一原则。不同尺寸和分辨率显示器的用户应该能够清晰地查看你的页面内容。\n\
  \n### 向支持 CSS 的浏览器隐藏内容\n\n如果你不希望某些标记中的标签内容显示在屏幕上，可以使用样式表在视觉上隐藏这些内容。回想一下本章前面的电影评论网站示例，当时你希望确保文本出现在\
  \ HTML 中，这样当内容被朗读出来或在没有应用样式的情况下被阅读时，用户能理解评论者对那部电影的评分。现在是时候应用你的 CSS 了。你希望显示一个代表五星好评中四颗星的图片，而不是显示那段文本。\n\
  \n以这种方式隐藏文本应使用 `text-indent` 样式属性，选择能将文本定位到浏览器视口左边缘之外的值，使其不再可见，如下所示：\n\n```\ndiv#hide-me\
  \ {\n  text-indent: -9999px;\n}\n```\n\n使用任何其他样式属性来隐藏文本都会产生不幸的副作用，即通过 Freedom Scientific\
  \ 公司（http://www.freedomscientific.com/）制造的流行 JAWS 屏幕阅读器软件，该文本将变得无法阅读。\n\n### 移动内容块以保持正确的标记源码顺序\n\
  \n在本章前面，你了解到标记中内容块的顺序应该是：当页面被朗读时，最相关的页面内容排在前面，次要内容（包括导航和版权信息）排在最后。当然，这种顺序可能不符合你网站的视觉外观，在视觉上你很可能希望导航链接出现在主体内容上方。\n\
  \n如果你的标记中有两个块级元素按顺序排列，而你更希望后一个内容先出现在浏览器中，你可以使用样式属性 `float` 来重新排列这两个内容块。请看以下 HTML\
  \ 代码片段：\n\n```\n<div id=\"body\">\n  ...\n</div>\n\n<div id=\"navigation\">\n  ...\n\
  </div>\n```\n\n默认情况下，`<div id=\"body\">` 标签会出现在 `<div id=\"navigation\">` 标签之前，但你可以使用\
  \ `float` 样式属性反转此顺序，如下所示：\n\n```\n#body {\n  float: right;\n}\n\n#navigation {\n\
  \  float: left;\n}\n```\n\n你可能还需要考虑使用绝对定位和相对定位的组合，在页面内重新定位内容块，以实现你需要的布局。\n\n###\
  \ 使用相对字体大小\n\n有些网站访问者——可能是视力受损者，或者只是将屏幕分辨率设置得较高——可能会调整浏览器中的基础字体大小，以便以最佳方式查看网站。所有主流浏览器都具备此功能。作为开发者，除了考虑网页的设计标准，我们还必须考虑最终用户的需求。\n\
  \n为了应对字体大小调整的可能性，你应该在样式表中使用相对单位。这样，当浏览器的基础字体大小改变时，页面文本也会按比例改变。`em` 单位就是这样一个相对单位，`%`（百分比）也是。你绝对不**应该**在样式表中使用\
  \ `px`（像素）或 `pt`（点）值来指定字体大小，因为这些值不会根据最终用户的需求进行缩放。\n\n\n\n为了在使用相对字体大小单位时更简便地计算字号，可以尝试将\
  \ `<body>` 标签元素的默认字体大小设置为 `62.5%`。在默认浏览器设置下，此比例会使 `1em` 在视觉上等同于 `10px`。这样一来，每个 `0.1em`\
  \ 的增量就对应着 `1px` 的视觉增加，因此 `1.1em` 视觉上等于 `11px`，`1.2em` 相当于 `12px`。在处理那些通常以像素为单位计量字体大小的创意设计时，这个技巧极为实用。以下是一些示例：\n\
  \n```\nbody {\n  font-size: 62.5%; /* 重置字体大小，使 1em 在视觉上等同于 10px */\n}\n\nul li {\n\
  \  font-size: 1.1em; /* 视觉上等同于 11px */\n}\n\nh2 {\n  font-size: 1.5em; /* 视觉上等同于\
  \ 15px */\n}\n```\n\n## 注释块\n\n为了便于维护并帮助其他开发者理解你的样式表，明智的做法是将逻辑相关的样式规则分组并组织在样式表文件中。在每组规则前添加一个注释，描述这组样式的用途，并使用一致的符号格式，例如：\n\
  \n```\n/* ---------------------------------------------------------------- --\n\
  \   表单样式\n   根据商定设计，用于显示表单控件的样式组\n*/\n```\n\n应仅在必要时添加内联注释，置于样式规则本身旁边以澄清特定规则。例如，当某个样式规则是为了处理特定浏览器中的边缘情况而添加时，有必要注明这一点，这样未来的开发者就不会认为该规则多余，并在不了解其初衷的情况下将其删除。\n\
  \n在每个样式表文件的最顶部，可以考虑包含一个开头的注释部分，详细说明该文件的作者、文件中样式规则的目的，并按照它们出现的顺序列出文件中的所有逻辑组，使用一致的格式。以下是一个描述整个样式表文件及其用途的注释块格式示例：\n\
  \n```\n/* ---------------------------------------------------------------- --\n\
  \   文件名 common.css\n   作者 Den Odell me@denodell.com\n   描述 网站基本页面布局和默认样式\n   内容\n\
  \   - 重置样式\n   - 页面分栏布局\n   - 表单控件样式\n   调色板\n   #777 中灰色\n   #aaa 浅灰色\n   #a3d60a\
  \ 网站通用绿色\n*/\n```\n\n包含这样一个注释块可以让开发者一目了然地查看文件是否包含他们正在寻找的代码。对于你的通用网站样式表来说，列出网站中使用的一些关键颜色可能是个明智之举。这样开发者就能轻松找到这些颜色，并在需要时复制粘贴这些值。\n\
  \n## 浏览器兼容性解决方案\n\n如果需要包含额外的样式来定位特定版本的 IE，应该使用本章前面描述的条件注释技术，为这些样式包含一个单独的样式表文件。\n\
  \n**注意** 请避免使用那些设置异常样式值，或使用反斜杠、注释和其他奇怪字符组合来混淆和迷惑某些浏览器的 hack。如果无法避免使用某个 hack，务必添加清晰的注释，说明为什么选择保留它以及它的用途，以警告未来可能查看该样式表文件的其他开发者。\n\
  \n在 IE 6 或更早版本中使用 PNG-24 图像时，图像文件的透明部分会显示为灰色/浅蓝色，而不是透明。不幸的是，微软直到 IE 7 版本才引入对此文件格式透明度的支持。不过，你可以使用一个变通方案，使简单的\
  \ PNG-24 图像能够在页面上作为背景或前景图像显示。\n\n假设你在主样式表中定义了以下样式规则：\n\n```\n#header {\n  background:\
  \ url(my-image.png) no-repeat;\n}\n```\n\n在使用条件注释引用的 IE 6 专用样式表文件中，可以包含类似如下的样式规则：\n\
  \n```\n#header {\n  background: transparent none;\n  filter: progid:DXImageTransform.Microsoft.AlphaImageLoader(src='my-image.png',\
  \ sizingMethod='scale');\n}\n```\n\n这条 IE 6 专用的样式规则会隐藏原始样式表中指定的背景图像，转而使用微软特定的 DirectX\
  \ 滤镜来引用同一个图像文件。该滤镜能够正确显示图像的透明部分，并将其放置在原背景图像所在的位置。然而，这项技术存在若干限制，包括不支持背景定位和平铺，因此使用时需谨慎。\n\
  \n## 本地化考量\n\n网站面向未来设计的最重要的一个方面，就是要考虑到网站可能需要以其他语言或针对特定国家/地区的版本呈现。不仅网站的文字内容会有所不同，而且样式表的部分内容也极有可能需要作出一些调整。例如，你可能需要替换包含某种语言内嵌文本的图像文件，或者调整其他特定于地区的样式，甚至可能意味着需要为某些文字改变文本方向。\n\
  \n为了确保这种面向未来的设计，从一开始就应该在主要样式表文件中包含所有与地区无关的样式，并包含一个单独的样式表文件来提供特定于区域设置的样式规则，这些规则会按区域覆盖主样式表。这样一来，添加对新语言和区域设置的支持就变得很容易，因为这只是一个从现有区域特定文件创建新样式表文件，并替换其中样式以适应新区域和/或语言的问题。\n\
  \n## 组织文件夹、文件和资源\n\n一个简单但可扩展的文件夹结构为将来添加内容和资源提供了良好的基础，而不会给开发者的维护工作带来更多负担。以下部分提供了一些组织文件夹、文件和资源的指南。\n\
  \n#### 可读的 URL\n\n应创建与项目站点地图相对应的文件夹，这样 HTML 页面和服务器端脚本存储在文件夹中，其 URL 就会变得合理、可读且有意义。通常，每个文件夹中的默认页面或索引页面可以在\
  \ Web 服务器配置中指定，这样仅通过文件夹名称即可请求 URL，并默认加载该索引文件。\n\n还应该尝试以类似的方式用文件夹反映站点地图的层次结构，这样 URL\
  \ 本身也呈现出层次结构。某些搜索引擎可能会将 URL 中的文本以及页面内容作为搜索条件。\n\n例如，这个 URL：\n\n`http://www.mywebsite.com/news/`\n\
  \n比这个更简洁、更易读且更易于记忆：\n\n`http://www.mywebsite.com/news.php`\n\n同样，URL 的各个部分应反映站点地图和合理的层次结构，如下例所示：\n\
  \n`http://www.mywebsite.com/music/rock/`\n\n### 文件和文件夹命名\n\n命名文件夹和文件时，应使用小写字母数字字符，并\n\
  \n\n\n# 文件命名与组织结构\n\n每个单词使用连字符分隔以提高可读性。避免使用英文字母、数字或连字符以外的字符。在代码中引用这些文件夹和文件时，请确保大小写一致为小写，因为某些\
  \ Web 服务器操作系统（如 Unix、Linux 和 Mac OS X）是区分大小写的。此外，切勿使用空格字符或为 URL 保留的字符（包括`&`、`#`或`?`）来命名文件夹或文件，否则您可能会发现它们无法在不同\
  \ Web 浏览器中一致引用。\n\n一个经常出现的需求是向最终用户提供本地化到其语言的网站内容。如果在构建网站之后才执行此本地化任务，可能会造成严重破坏，因为它可能需要您重写或重构`HTML`、`CSS`和`JavaScript`文件来支持它。您应该将与特定区域、语言或区域设置相关的资源分组到各自的文件夹中，并以区域设置命名（例如，指定为语言和位置，如美国英语使用`en-us`）。将非特定区域设置的资源存储在此文件夹结构的同一级别。\n\
  \n> **提示**：考虑使用`XML`文件、内容管理服务器或服务器端资源文件，将本地化内容直接提供给脚本生成的标记。这将使维护任务比编辑静态`HTML`页面的副本更简单。\n\
  \n#### 文件编码\n\n所有基于文本的文件都应使用`UTF-8`编码类型，因为这允许在文件中直接使用扩展字符和非英文字符集，无需特殊的控制字符和`ASCII`代码。\n\
  \n在实践中，从一开始就以`UTF-8`格式创建文件要比以后转换它们容易得多。如果您需要将文件从其他编码格式转换为`UTF-8`，请备份现有文件，并使用开发环境的文件属性对话框将文档格式设置为适当的编码类型。这可能会影响文件中已有某些字符的编码，因此请使用备份文件将字符从备份复制并粘贴到新编码的`UTF-8`文件中。\n\
  \n在某些情况下，`UTF-8`编码文件开头的字节顺序标记（`BOM`）可能会导致服务器端技术（如`PHP`）出现问题。在对要由这些技术处理的文件进行编码时，如果开发环境的文件属性对话框中存在此选项，请确保移除`BOM`。\n\
  \n#### 组织资源\n\n考虑是否将所有静态资源文件（样式表、图像、脚本、音频和视频，不包括`HTML`）放在一个公共文件夹中是值得的。这在逻辑上将客户端代码与网站的结构及其内容分开，避免了网站文档树根目录的混乱。以下目录结构是遵循此方法的示例，并且也考虑到了本地化：\n\
  \n```\n/assets\n  /images\n    /en-gb\n    /fr-fr\n  /scripts\n    /third-party\n\
  \  /styles\n    /en-gb\n    /fr-fr\n  /flash\n  /documents\n    /en-gb\n    /fr-fr\n\
  \  /video\n    /en-gb\n    /fr-fr\n  /audio\n    /en-gb\n    /fr-fr\n```\n\n## 图像指南\n\
  \n将上下文相关的图像分组到具有有意义名称的文件夹中，以便更容易找到它们。这些名称可能与项目的站点地图或它们在页面上的内容或用途相关联。\n\n选择文件大小最小且同时保持最佳质量的图像格式。谨慎使用压缩。理想的结果是，在距离屏幕约\
  \ 0.5 米（约 1.5 英尺）处，图像与人眼几乎无法区分。\n\n对于某些类型的图像，`PNG`文件格式通常会产生更小的文件大小。`PNG`是一种无损格式，并允许为支持该功能的\
  \ Web 浏览器提供 Alpha 透明度（不幸的是，`IE 6`默认不支持，但您可以尝试应用本章前面描述的工作区）。然而，许多图像处理程序在图像文件中包含额外的伽马信息。不幸的是，此伽马信息在不同浏览器中的解释方式不同，这意味着可能会出现奇怪的图像伪影和颜色。\n\
  \n幸运的是，有几种工具可以在不影响最终图像质量的情况下从`PNG`文件中移除这些伽马信息，这还有一个额外的好处是减少了图像的文件大小（因为移除了额外信息）。`Smush\
  \ it`（[`www.smushit.com/`](http://www.smushit.com/)）就是这样一种基于 Web 的工具，用于移除这些额外信息。\n\
  \n有关选择最佳图像格式以实现最忠实再现图形并确保最小文件大小的更多详细信息，请参见第 4 章。\n\n## 多媒体指南\n\n应使用无处不在的`Adobe Flash\
  \ Player`插件来显示视频，直到所有浏览器都包含自己的内置编解码器。提供所显示电影文件的下载链接，最好是多种格式，以便没有`Flash`插件的用户可以下载电影文件以供离线观看。\n\
  \n对所有音频使用`MP3`存储类型，并利用`Adobe`的`Flash Player`将其呈现给最终用户。应为没有`Flash`插件的用户提供`MP3`文件的下载链接。\n\
  \n第 7 章提供了关于在页面中包含多媒体组件的更多细节。\n\n### 设置开发环境\n\n考虑如何开展项目也很重要，无论您是单独工作还是作为团队的一部分。在本节中，我们将了解可以使用哪些工具以现代、有效的方式编写文件、存储文件和测试页面。\n\
  \n#### 编写文件：集成开发环境\n\n使用 Windows 的`Notepad`或 Mac OS X 的`TextEdit`为 Web 编写客户端代码的日子已经一去不复返了。现代网站需要大量分布在多个文件和文件夹中的代码，因此需要一种有效的方法来导航这些文件夹和编辑这些文件。桌面应用程序开发人员长期以来一直使用集成开发环境（`IDE`）来编写、维护和调试代码。现在，Web\
  \ 开发人员也到了效仿的时候了。每个`IDE`都略有不同，选择最适合您个人需求的`IDE`确实是一个品味问题。\n\n在 Web 开发社区中越来越受欢迎的一个`IDE`，也是我的个人最爱，是`Aptana\
  \ Studio`（[`www.aptana.com/`](http://www.aptana.com/)）。此`IDE`建立在`Eclipse`之上，`Eclipse`是\
  \ Java 开发人员最流行、最成熟的开发环境之一。它允许您将项目文件存储在一起；支持`HTML`、`CSS`和`JavaScript`文件的语法高亮；甚至包含一个内置的\
  \ Web 服务器，用于测试代码而无需部署到单独的 Web 托管基础设施。文件可以在您的计算机和`FTP`或`SFTP`服务器之间同步，并且`Aptana`确保在执行同步时不会在不应覆盖的情况下覆盖文件。`Eclipse`中相同的插件架构受支持，因此已为该`IDE`开发的大量扩展和附件可在`Aptana`中使用，使其不仅仅是一个基本软件包。\n\
  \n其他在开发者中流行的`IDE`包括：\n\n*   适用于 Windows 系统的`Notepad++`（[`notepad-plus.sourceforge.net/`](http://notepad-plus.sourceforge.net/)）\n\
  *   适用于 Windows 系统的`Microsoft Visual Web Developer`（[`www.microsoft.com/express/vwd/`](http://www.microsoft.com/express/vwd/)）\n\
  *   适用于 Mac OS X 系统的`TextMate`（[`macromates.com/`](http://macromates.com/)）\n\n\n\
  \n• Coda ([`www.panic.com/coda/)`](http://www.panic.com/coda/)（适用于 Mac OS X 系统）\
  \  \n• Adobe Dreamweaver ([`www.adobe.com/products/dreamweaver/)`](http://www.adobe.com/products/dreamweaver/)（适用于\
  \ Windows 和 Mac OS X 系统）\n\n研究这些集成开发环境，尝试使用它们，然后找出最适合你的那一款。\n\n## 第 1 章 ■ 奠定坚实基础\n\
  \n**47**\n\n■**注意** 要警惕任何试图自动为你编写代码的集成开发环境。作为开发者，你需要对自己的技能充满信心，并有意识地关注项目中添加的所有代码。\n\
  \n#### 存储文件：版本控制系统\n\n我在本章前面提出的指导原则之一是，定期清理文件夹结构和文件中不再相关或不再需要的内容。这样做的结果是得到一个整洁、精简的项目，其中只包含构建网站所需的代码。这固然很好，但如果你不小心删除了以后需要的某些代码或文件怎么办？这时版本控制系统就派上用场了。\n\
  \n版本控制系统会存储文件和文件夹的修订版本及备份，让你能够回退到之前的某个时间点并恢复丢失的代码。此类系统还能管理团队协作，因此多名开发者可以同时处理同一个文件。版本控制系统会管理将每位开发者所做的更改合并到一个文件或中央存储位置的过程。\n\
  \nSubversion ([`subversion.tigris.org/)`](http://subversion.tigris.org/) 是一个流行的开源版本控制系统，广泛应用于个人和专业开发环境。你将系统的服务器部分部署在可通过\
  \ URL 访问的 Web 服务器上，开发者则使用 Subversion 客户端工具访问该 Web 服务器，将代码的本地副本下载到自己的计算机上进行处理。修改文件就像编辑文件一样简单。当开发者确信他们已完成正在开发的功能后，便会将代码\
  \ `commit`（提交）回服务器，服务器会处理文件的合并以及备份副本的创建。\n\nSubversion 对于开发者来说似乎出奇地简单，这大概就是为什么它在相对较短的时间内被如此迅速地采用的原因。当然，免费的特性也使其对个人用户和专业人士都触手可及。\n\
  \n如果你想利用 Subversion，不一定非要自己搭建服务器。\n\n有几家公司提供在线存储代码的服务，每次更改都会安全地备份。例如，[Beanstalk\
  \ (http://beanstalkapp.com/)](http://beanstalkapp.com/) 会根据你的需求提供不同的定价模式，但也提供有限的免费存储方案（撰写本文时最高为\
  \ 20MB），如果你正在处理一个相对较小的项目，这可能就足够了。谷歌有自己的 Subversion 托管系统，称为 Google Code ([`code.google.com/hosting/)`](http://code.google.com/hosting/)，它是免费的，并且还包含一个维基和错误跟踪系统。另一个开源在线存储库是\
  \ [GitHub (http://github.com/)](http://github.com/)，它提供各种定价方案，包括针对较小项目的免费服务。该服务使用\
  \ GIT 技术，而非 Subversion，但这两种版本控制系统在结构和设置上实际上非常相似。\n\n同样，研究这些系统，看看哪个最适合你。\n\n请记住，无论项目规模大小，如果你不使用版本控制系统，随时都面临着丢失宝贵代码的风险。\n\
  \n#### 测试页面：浏览器与开发工具\n\n既然你已经决定了要使用哪个集成开发环境和版本控制系统来处理文件，现在需要考虑你的测试环境了。测试和代码验证对作为专业\
  \ Web 开发者的你至关重要。\n\n**48**\n\n第 1 章 ■ 奠定坚实基础\n\n你需要确保你构建的网站在所有主流的桌面 Web 浏览器（目前包括\
  \ IE 6、7、8；Firefox 2 和 3；Opera 9.5 及以上版本；Safari 3 及以上版本；以及 Google Chrome）以及尽可能多的移动设备上都能正常运行。当然，我在本章认可的原则应该意味着你的网站在这些浏览器以及更多环境中都能工作。但要确切地知道并解决\
  \ HTML、CSS 和 JavaScript 实现中的细微差异，唯一的方法就是在尽可能多的浏览器和系统中彻底测试你编写的所有代码。\n\n请确保在你的机器上安装了所有你能获取的\
  \ Web 浏览器。有些浏览器不支持在同一台机器上运行多个版本，因此你可能会考虑使用虚拟机技术，在内存中运行操作系统的第二个副本。对于 Windows 用户，[Microsoft\
  \ Virtual PC](http://www.microsoft.com/windows/products/winfamily/virtualpc/) 是理想的选择。它是免费的，而且微软甚至通过其网站提供定期更新的、预装了不同版本\
  \ IE 的虚拟机镜像，以辅助你的测试。对于 Mac OS X 用户，[VMware (http://www.vmware.com/)](http://www.vmware.com/)\
  \ 和 [Parallels (http://www.parallels.com/)](http://www.parallels.com/) 是你的最佳选择。\n\
  \n如果你无法运行此类虚拟化系统，或许可以使用浏览器测试网站的服务，例如 [BrowserShots (http://www.browsershots.org/)](http://www.browsershots.org/)。该网站会使用不同机器上的各种\
  \ Web 浏览器运行你提供的 URL，并将结果截图发送给你以供对比。这种替代方案当然不理想，但作为后备或次要选择还是不错的。\n\n不同的浏览器拥有不同的开发工具供你在页面的\
  \ HTML、CSS 和 JavaScript 输出中探查调试。有些工具甚至允许你即时修改代码并立即看到结果。黄金标准是 [Mozilla Firefox 的\
  \ Firebug 插件 (http://getfirebug.com/)](http://getfirebug.com/)。我见过的每一位 Web 开发者都对其推崇备至，用它来检查哪些样式应用到了页面元素上，以及在任意时刻其\
  \ JavaScript 中变量的值是多少。当页面出现错误时，Firebug 控制台会指出这些错误，并显示这些错误在代码中发生在哪一行。如果你在调试 JavaScript\
  \ 错误，可以查看错误发生之前的函数调用列表，这有助于你追踪错误。\n\nInternet Explorer Developer Toolbar 插件可用于 IE\
  \ 6 和 7。与 Firebug 相比，该工具相形见绌，但它确实能让你看到哪些样式应用到了哪些页面元素上。IE 8 有自己内置的开发工具，其功能介于 Developer\
  \ Toolbar 和 Firebug 之间。对于调试 IE 中的 JavaScript 问题，微软的 Visual Web Developer IDE 是一个非常实用的工具。它能够连接到\
  \ Windows 机器上运行 IE 的内部进程。当 JavaScript 错误发生时，Visual Web Developer 允许你查看错误发生之前调用的所有操作和代码的完整列表，包括指向错误发生位置的链接。这对于探查变量值和调试问题非常有帮助。\n\
  \nOpera、Safari 和 Google Chrome 都有各自内置的开发工具。在撰写本文时，这些工具中的大多数似乎尚未完全具备完整功能，但它们正在逐步变得像\
  \ Firebug 一样强大。\n\n你应该下载每个浏览器及其相关的开发工具，并学习如何使用它们。\n\n\n\n# 打下坚实基础\n\n`tools`，这样一来，当那些难以捉摸的浏览器特定\
  \ Bug 冒头时，你就能快速有效地定位问题根源并将其扼杀在摇篮里。\n\n关于测试，最后一点提醒：不要拖到最后一刻才进行。那些能按时交付且不让开发者痛苦的项目，都是从一开始，并贯穿整个开发过程，就在多种不同浏览器中进行测试的，以确保最终产品是最佳、兼容性最强的网站。\n\
  \n## 小结\n\n本章阐述了使用经过验证的、行之有效的当前理念（即**最佳实践**）的重要性，以及如何在选择适用于自身项目的指导方针时运用判断力。我们探讨了\
  \ HTML、CSS、文件结构和开发环境，回顾了编写和维护代码的智能、现代且高效的技术。现在你知道了，采用这些最佳实践的全部目的，是为了确保你创建的页面能够被任何人完全无障碍地访问，无论他们使用何种浏览器、设备或输入方式。你还需要确保你编写的代码在未来易于阅读、理解和更新。\n\
  \n下一章将引导你学习 JavaScript 的最佳实践。内容涵盖如何构建你的客户端代码，使其同样易于阅读、理解和更新，无论代码库的规模大小如何。这将帮助你基于可靠、可扩展的代码规范，构建强大的富互联网应用（RIA）。\n\
  \n## 第 2 章：面向富互联网应用的 JavaScript\n\n在上一章中，我解释了如何为你的网站代码打下坚实的基础，包括让你的页面在除 HTML 之外无需任何前端技术的情况下也能完全可访问和可操作。我还说明了构成你网站的其他组成部分——样式表、图片、插件等——是构建在\
  \ HTML 基础之上的层次，用于为页面应用视觉布局和设计，并为网站访问者提供更自然的体验。\n\n本章的重点是 JavaScript，我们在页面中使用它来简化最终用户的任务、对他们的操作做出反应，并努力让他们在网上的时光更顺畅、更友好。在本章中，你将基于已有的\
  \ JavaScript 知识，学习如何以可扩展、灵活且可维护的方式组织代码；运用面向对象编程原则；以及克服跨浏览器实现差异。接着，你将学习构建 RIA 的技术，最后，还将了解如何为代码编写自动化测试，使其更加健壮。\n\
  \n这将是一章理论性较强的章节，但其中充满了有用且重要的信息，所以让我们开始吧！\n\n### 编码风格指南\n\n作为 Web 开发者，你可以通过以一致的方式组织和构建你的\
  \ JavaScript 代码，编写代码来解决你的问题或达成目标，而不使代码过度复杂化，从而简化日常编码体验。遵循一些指导方针，可以使你的代码更干净、更清晰、更易于管理、更易于理解、文档更完善，并且更易于阅读。\n\
  \n#### 使用一致的格式\n\n正如你在上一章中看到的，可读代码的标志——无论是 HTML、CSS 还是 JavaScript——都是统一的格式。例如，JavaScript\
  \ 函数体内的内容应该相对于函数名和花括号缩进一个制表符空间。每条语句应以分号结束，并且每条语句应独占一行，以确保良好的可读性，如下例所示：\n\n```javascript\n\
  function myFunction() {\n    alert(\"Hello, world\");\n    return true;\n}\n```\n\
  \n类似地，逻辑代码块和循环体内的内容也应该缩进。一条经验法则是，一对花括号（`{` 和 `}`）内的内容应相对于这些花括号缩进，如下例所示：\n\n```javascript\n\
  if (x == y) {\n    alert(\"We have a match!\");\n} else {\n    alert(\"We have a\
  \ problem!\");\n}\n```\n\n然而，在能使代码更易于阅读的地方，你可能希望使用额外的缩进，如下面代码中的 `case` 语句：\n\n```javascript\n\
  switch (prompt(\"What is your favorite fruit?\", \"banana\")) {\n    case \"banana\"\
  :\n        alert(\"Well done. Bananas are full of potassium.\");\n        break;\n\
  \    case \"mango\":\n        alert(\"Exotic and tasty!\");\n        break;\n  \
  \  default:\n        alert(\"That's not to my taste, but keep it up to get your\
  \ 5-a-day.\");\n        break;\n}\n```\n\n### 使用花括号和圆括号\n\n花括号（`{}`）和圆括号（`()`）在\
  \ JavaScript 中广泛用于划分代码块，并减少长语句中的混乱。应尽可能使用它们，以最大限度地减少潜在缺陷并提高可读性，这两者都将有助于未来的代码维护。\n\
  \n下面的例子展示了一段移除花括号和圆括号以缩短代码的 JavaScript 例程。\n\n```javascript\nvar result = 0;\nif\
  \ (confirm(\"Would you like to do some math?\"))\n    result = 10 / 2 * 100 % 30;\n\
  alert(\"OK, the result is: \" + result);\n```\n\n这在语言语法上是完全有效的，但它使得逻辑稍微难以理解。\n\n\
  下面的形式则不那么令人困惑，因此是一种更稳定、更易读、更易于维护的代码例程。\n\n```javascript\nvar result = 0;\nif (confirm(\"\
  Would you like to do some math?\")) {\n    result = ((10 / 2) * 100) % 30;\n}\n\
  alert(\"OK, the result is: \" + result);\n```\n\n注意，使用这种格式，你可以确定 `alert` 语句何时执行。并且你可以看到，当使用圆括号将操作分组时，数学计算例程变得多么易于理解。\n\
  \n### 用大小写增加含义\n\n几条关于变量和函数名大小写的简单规则，能让你一眼就看出它们在代码中的用途。以下是几条你应该在自己的代码中遵循的常见大小写准则：\n\
  \n-   大多数变量和函数名以小写字母开头。\n-   对象构造函数名以大写字母开头。（本章后面的“对象、类和构造函数”部分会讨论对象构造函数。）\n-  \
  \ 使用*驼峰命名法*，其中每个新单词以大写字母开头，所有其他字符为小写，以标记新单词的开始。\n-   使用全大写字符表示常量——即在代码生命周期内不应改变的值。\n\
  \n下面的代码展示了每种大小写类型的例子：\n\n```javascript\n// 对象构造函数 – 含义详见本章后面\nvar Calendar = function()\
  \ {\n    // 常量使用大写\n    var DAYS_IN_ONE_WEEK = 7;\n\n    // 变量或函数名以小写字符开头\n    var\
  \ count;\n    function add() {\n    }\n\n    // 变量和函数名中的新单词使用驼峰命名\n    var currentDate;\n\
  \    function doSomethingWithCurrentDate() {\n    }\n}\n```\n\n### 使用描述性变量和函数名\n\
  \n为变量和函数选择恰当的名称是构建易于理解的代码库的基础之一。命名变量和函数时，要让它们体现其用途和目的。如果较长的名称能传达信息，不要害怕使用它们。\n\n\
  想象一下，你只看到代码中的变量名和函数名，而没有任何逻辑或值，你能一眼看出它们的用途吗？如果不能，那就是时候开始重命名了。\n\n以下是一些描述性变量和函数名的例子：\n\
  \n```javascript\nvar currentDate;\nfunction setCurrentDate() {\n}\n\nvar userName;\n\
  function updateUserName() {\n}\n```\n\n你还应避免使用所谓的*魔术数字*，即计算中用到的、看似凭空出现的数字。以下例子展示了魔术数字的使用：\n\
  \n\n\n`var daysInAYear = 52 * 7;` // 稍加思考，你就能算出来\n\n`var seatsOnThePlane = 25 *\
  \ 6;` // 但这又意味着什么呢？\n\n这些数字从何而来，它们代表什么含义？你应该力求消除代码中所有的疑惑。将含义明确表达出来，这样开发者就不需要逐行审视代码才能理解。下面的版本为前一个示例中使用的数字常量添加了定义。\n\
  \n```\nvar WEEKS_IN_A_YEAR = 52;\nvar DAYS_IN_A_WEEK = 7;\nvar daysInAYear = WEEKS_IN_A_YEAR\
  \ * DAYS_IN_A_WEEK; // 忽略闰年\n\nvar SEAT_ROWS_ON_PLANE = 25;\nvar SEATS_PER_ROW =\
  \ 6;\nvar seatsOnThePlane = SEAT_ROWS_ON_PLANE * SEATS_PER_ROW; // 啊，清晰多了！\n```\n\
  \n注意到一切突然变得多么清晰了吗？\n\n#### 保持函数块简短\n\n一个函数应该只做一件事，并且把它做好。尽量避免将不相关的代码合并到一个函数中，如下例所示：\n\
  \n```\nfunction feedbackOnUsersFavoriteFruit() {\n    var favoriteFruit = prompt(\"\
  What is your favorite fruit?\", \"None\");\n    var score = 0;\n    switch (favoriteFruit.toLowerCase())\
  \ {\n        case \"banana\":\n            score = 6;\n            break;\n    \
  \    case \"apple\":\n            score = 4;\n            break;\n        default:\n\
  \            break;\n    }\n    if (score > 5) {\n        alert(\"You picked one\
  \ of my favorites too!\");\n    } else if (score > 0) {\n        alert(\"Credit\
  \ for choosing a fruit, at least!\");\n    } else {\n        alert(\"Not sure about\
  \ your choice of fruit!\");\n    }\n}\n```\n\n每个函数越简单，测试和调试就越容易。如果你的函数需要连续执行多个逻辑上不同的操作，请将一个大函数拆分成多个小函数，分别执行每个任务，如下例所示：\n\
  \n```\nfunction getFavoriteFruit() {\n    return prompt(\"What is your favorite\
  \ fruit?\", \"None\");\n}\n\nfunction getFruitScore(fruit) {\n    var score = 0;\n\
  \    switch (favoriteFruit.toLowerCase()) {\n        case \"banana\":\n        \
  \    score = 6;\n            break;\n        case \"apple\":\n            score\
  \ = 4;\n            break;\n        default:\n            break;\n    }\n    return\
  \ score;\n}\n\nfunction getMessageByScore(score) {\n    var message = \"\";\n  \
  \  if (score > 5) {\n        message = \"You picked one of my favorites too!\";\n\
  \    } else if (score > 0) {\n        message = \"Credit for choosing a fruit, at\
  \ least!\";\n    } else {\n        message = \"Not sure about your choice of fruit!\"\
  ;\n    }\n    return message;\n}\n\nfunction feedbackOnUsersFavoriteFruit() { //\
  \ 保留原函数名\n    var favoriteFruit = getFavoriteFruit();\n    var score = getFruitScore(favoriteFruit);\n\
  \    alert(getMessageByScore(score));\n}\n```\n\n尽可能让每个函数只执行一个逻辑动作，根据需要接收输入并产生输出。\n\
  \n## 使用 ScriptDoc 格式的注释作为文档\n\n与其在代码中嵌入大量内联注释，不如确保变量和函数命名准确，并且代码块简短且不言自明。\n\n在代码中布满大量内联注释，反而会降低它们被实际阅读的可能性。\n\
  \n你应该为你编写的每个函数提供文档，方法是在函数之前添加一个注释块，定义函数的功能、预期的输入参数、产生的输出类型，以及一些使用示例。这类注释块具有以下优势：\n\
  \n-   确保所有开发者都理解一个函数应该（和不应该）做什么。\n-   帮助你判断一个函数何时执行了过多操作，正如上一节所讨论的那样。如果函数的描述特别复杂，就表明它应该被拆分成几个更小的函数。\n\
  -   通过注明函数应能接受的输入范围或类型，有助于定义你可以对该函数执行何种测试。\n-   在你的代码中提供视觉分隔。\n\n你应该使用开放的 ScriptDoc\
  \ 格式（`http://www.scriptdoc.org/`）来记录你的代码。这种格式的设计使其可以跨编程语言使用。由于格式和结构是预定义的，你可以使用诸如\
  \ `Aptana` 之类的软件。\n\n\n\n\n[Studio](http://www.aptana.com/) 能够根据代码中特殊格式的注释块，自动生成可读性强的文档。\n\
  \n以下示例展示了如何记录整个 JavaScript 文件的功能。该注释应作为 JavaScript 文件中的第一项内容，以便开发者理解文件中包含的函数的目的。\n\
  \n```\n/**\n * @projectDescription 本文件包含执行日期对象操作的代码\n *\n * @author Den Odell me@denodell.com\n\
  \ * @version 1.0\n */\n```\n\n以下示例展示了如何采用 ScriptDoc 格式记录文件中的函数：\n\n```\n/**\n *\
  \ 对数字进行平方运算，并将结果四舍五入为最接近的整数\n *\n * 示例：\n * square(2.5); => 6\n * square(2); =>\
  \ 4\n *\n * @param {Float} number 需要被平方的数字\n * @return {Integer} 返回输入值平方后的四舍五入结果\n\
  \ */\nfunction square(number) {\n    return Math.round(number * number);\n}\n```\n\
  \n我鼓励你熟悉 ScriptDoc 网站上的规范说明，以及用于正确描述和记录函数的具体选项。使用该规范将极大提升代码的可理解性，并能生成有用的文档，供将来可能要与你的代码协作的其他开发者参考。\n\
  \n#### 用 TODO 标记剩余任务\n\n编码时养成一个有用的习惯：使用包含 `TODO` 一词的注释来标记代码中未完成的部分，示例如下：\n\n```\n\
  function checkPasswordStrength(password) {\n    // TODO: 完善此函数，检查所提供的密码强度\n    return\
  \ true;\n}\n```\n\n这使你之后可以在代码库中搜索该关键词，快速定位任何需要完成的部分。\n\n## 专业级 JavaScript 编程\n\n\
  现在我们已经回顾了 JavaScript 文件中关于格式、文档和清晰度的一些基本准则，接下来让我们了解一些 JavaScript 编码原则。专业人士遵循这些实践，使他们的\
  \ JavaScript 代码健壮、可扩展，并建立在对要解决问题的扎实理解之上。\n\n#### 避免解决不存在的问题\n\n编写 JavaScript 代码时，只编写解决当前问题所需的代码。例如，假设你想编写一段\
  \ JavaScript 代码，允许网站用户登录个人资料页面，并在用户提供有效凭证时动态刷新页面部分内容。要解决这个问题，你不需要编写能在网站任何页面刷新任何内容的代码——至少在当前尚未成为需求或成为新问题解决方案之前不需要。遵循这一准则，你的代码可以用更短的时间完成，因为你只构建完成任务所需的确切代码，而不是试图构建通常在实践中可靠性较低的通用、过度复杂的代码。之后，当你需要解决不同的问题，并认为已有代码可以改写来完成任务时，那才是重写它的时机。\n\
  \n#### 使用文档对象模型\n\n作为 JavaScript 语言的扩展，W3C 推荐了文档对象模型（DOM），该模型标准化了 Web 开发者与渲染页面中\
  \ HTML 元素交互的方式。该语言中增加了通过元素的 `id` 属性或标签名称定位页面元素的方法，支持动态操作元素的属性、CSS 样式属性，甚至移除或添加整个元素。DOM\
  \ 推荐标准将 HTML 页面中的所有内容定义为通用名称 `node`。页面中可以存在五种类型的节点，如下所示，它们都是页面组件的 JavaScript 表示形式：\n\
  \n- **文档节点**：代表 HTML 页面的最顶层节点，实际上对应于 `<html>` 元素。\n\n\n# 节点类型与 DOM 操作\n\n## 节点类型\n\
  \n- **元素节点**（`Element node`）：页面上的每个 HTML 标签都表示为一个元素节点。\n- **属性节点**（`Attribute node`）：标签的每个属性，例如`<a>`标签相关的`href`属性，都表示为一个属性节点。每个属性始终与一个元素节点关联。\n\
  - **文本节点**（`Text node`）：开闭标签之间的文本，例如`<p>`和`</p>`之间的文本，表示为一个文本节点。每个文本节点与一个元素节点关联。\n\
  - **注释节点**（`Comment node`）：HTML 注释表示为一个注释节点。\n\n每个元素节点内部可能包含其他元素节点，称为**子节点**。根据\
  \ XHTML 的结构，`<html>`元素有两个子节点：`<head>`和`<body>`。\n\n以下示例展示了带有两个子节点的 HTML `<body>`元素：\n\
  \n```html\n<body>\n<h1>My Page Title</h1>\n<img id=\"chart-image\" src=\"my-chart.jpg\"\
  \ alt=\"My chart\" />\n</body>\n```\n\n第一个子节点（表示`<h1>`标签）下有一个文本节点，包含文本“My Page Title”。请注意，元素内的文本不被视为元素本身的一部分，而是它的子节点。\n\
  \n`<body>`标签的第二个子节点是另一个元素节点（表示`<img>`标签），包含两个属性节点（分别表示`src`和`alt`中存储的值）。从`<h1>`标签的角度来看，`<body>`标签被称为它的**父节点**，而`<img>`标签被称为它的**兄弟节点**，因为它们在文档层级中处于同一级别。\n\
  \n## 查找元素节点\n\n可以通过两种方法直接在文档中查找元素节点，以下示例演示了这两种方法：\n\n```javascript\n// 返回表示 id 属性为\
  \ chart-image 的标签的元素节点\nvar img = document.getElementById(\"chart-image\");\n\n\
  // 返回元素节点数组，所有节点均为 <body> 标签\nvar bodyTag = document.getElementByTagName(\"body\"\
  );\n\n// 返回第一个 <body> 标签内 id 属性为 chart-image 的元素\nvar img = bodyTags[0].getElementById(\"\
  chart-image\");\n```\n\n> **注意**：某些浏览器提供了两种新的元素定位方法，但尚未普及。这些方法是`querySelectorAll()`（基于\
  \ CSS 3 选择器定位元素节点）和`getElementsByClassName()`（基于 CSS 类名定位元素节点）。\n\n## 操作元素与内容\n\n\
  一旦找到元素，你很可能想对其执行某些操作。可能是更改其文本或任何属性；也可能是完全从页面中移除该元素，或者在其前后或内部添加新元素。DOM 提供了处理所有这些情况的方法。\n\
  \n### 动态修改 CSS 属性\n\n读取和修改 CSS 样式属性就像在找到的元素上使用`style`对象一样简单。以下演示了如何读取`color` CSS\
  \ 属性并修改`margin-left` CSS 属性：\n\n```javascript\nvar navigationEleemnt = document.getElementById(\"\
  navigation\");\n\nif (navigationElement.style.color == \"black\") {\n    navigationElement.style.marginLeft\
  \ = \"50px\";\n}\n```\n\n> **注意**：在 CSS 样式属性名中使用连字符分隔单词的名称，在 JavaScript 中改用驼峰命名法引用。\n\
  \n### 操作元素及其内容\n\n通过 DOM 设置元素内容的最简单（并且在许多浏览器中最快速）的方法是使用元素的`innerHTML`属性。该属性将元素内部所有内容的\
  \ HTML 代码表示为一个字符串，可以读取或设置为你想要的任何内容。以下是如何读取和设置元素`innerHTML`值的示例：\n\n```javascript\n\
  var pTag = document.getElementsByTagName(\"p\")[0]; // 页面上的第一个 <p> 标签\nalert(pTag.innerHTML);\
  \ // 输出标签当前的 HTML 字符串内容\n\npTag.innerHTML = \"<b>New HTML contents!</b>\"; // 重写标签的\
  \ HTML\n\nalert(pTag.innerHTML); // 输出 \"<b>New HTML contents!</b>\"，页面上标签的内容现在以粗体显示\n\
  ```\n\n\n\n尽管这种方法快速简便，但存在引入错误的风险，例如因设置未正确闭合的 HTML 而导致渲染错误。操作元素最稳健的方式是使用内置的 DOM 节点操作方法，这些方法会根据页面当前的\
  \ `DOCTYPE`，始终以正确的格式将 HTML 代码添加到页面中。\n\n以下示例演示了如何使用 `createElement()` 方法创建新的元素节点。我们可以通过\
  \ `appendChild()` 方法将这个新元素插入到页面中，该方法会创建一个新的水平线元素，并将其附加到 `<body>` 标签所包含的节点列表末尾。它将在\
  \ HTML 页面的底部显示出来。\n\n```\nvar horizontalRule = document.createElement(\"hr\"); //\
  \ 目前仅存在于内存中\nvar bodyTag = document.getElementsByTagName(\"body\")[0];\nbodyTag.appendChild(horizontalRule);\
  \ // 使 <hr> 标签显示在页面上\n```\n\n相反地，从页面中移除元素只需在要移除元素的父元素上调用 `removeChild()` 方法，如下所示：\n\
  \n```\nvar horizontalRule = document.getElementsByTagName(\"hr\")[0];\n// 上述 <hr>\
  \ 标签必须是 <body> 标签的直接子元素\nvar bodyTag = document.getElementsByTagName(\"body\")[0];\n\
  bodyTag.removeChild(horizontalRule); // 该元素从页面消失\n```\n\n我仅向你展示了少数几个 DOM 方法。我建议你熟悉\
  \ DOM。它是通过 JavaScript 访问页面内容的统一方式。Mozilla 维护了一个实用的在线资源，其中包含大量示例和说明，网址为 [`developer.mozilla.org/en/Gecko_DOM_Reference`](https://developer.mozilla.org/en/Gecko_DOM_Reference)。\n\
  \n## 不要混淆 JavaScript 和 HTML\n\n正如我在前一章中指出的，你绝不应该将 JavaScript 代码内联到 HTML 代码中。如果你发现自己正在\
  \ HTML 中使用像 `onclick`、`onmouseover` 这样的属性，请立即停止！使用可用的 DOM 方法来定位元素，并将你的代码应用于这些元素。这可以将你的行为代码与内容分离开来，并且使你能够在不严重影响另一方的情况下对各自进行修改。\n\
  \n某些浏览器不支持 JavaScript。一些用户倾向于关闭它。一些用户的工作环境默认禁用了 JavaScript。这些用户不应该需要下载他们所访问页面的所有\
  \ JavaScript 代码，因为这会使页面体积增大，却对他们没有任何益处。\n\n你应该致力于将所有 JavaScript 代码放在外部文件中，并通过 HTML\
  \ 代码中的 `<script>` 标签进行引用，这样不使用 JavaScript 的用户只需下载他们需要的内容，而其他浏览器则通过引用 URL 下载该文件。这也允许浏览器在本地缓存外部文件，这样如果多个页面引用了该文件，它只需下载一次，后续每次请求都从本地副本加载。\n\
  \n#### 将样式与代码分离\n\n你会发现，有时你想要通过 JavaScript 影响页面上元素的某些样式属性。也许你想显示或隐藏页面的一部分，或者当用户执行某个操作时对某些元素应用新的配色方案。请尽可能将样式规则分离到\
  \ CSS 中，然后使用 DOM 来切换你想要更改的元素上正在使用的 CSS 类名；浏览器随后会为你处理样式属性的更改。通过这种方式，你在显示样式和行为代码之间建立了更松散的联系。\n\
  \n通过让 CSS 文件负责设计和布局，JavaScript 负责交互和行为，你就知道应该去哪个文件中查找或进行修改。你还可以使用 CSS 创建全新的设计，而无需修改\
  \ HTML 或 JavaScript 代码。\n\n\n\n# 动态属性修改的例外情况\n\n当您需要动态修改某些无法预先知道具体数值的属性时，此规则存在例外情况，例如根据鼠标从初始位置移动的距离来改变组件的宽度。在这种情况下，可编码的数值太多，无法在\
  \ CSS 中穷尽所有选项。因此，应仅通过 JavaScript 修改 `width` 属性，而同一元素的其他所有样式则应在 CSS 文件中定义。\n\n####\
  \ 链式函数调用\n\n*链式调用*指在其他方法的结果上执行方法，从而节省冗余代码行。以下示例通过依次执行多个方法（每个方法都作用于前一个调用的结果）来演示这一点。最终返回的值是链中最后一个方法的结果。\n\
  \n```\n// 获取 <body> 标签内 id 为 \"horizontal-rule\" 的元素的宽度\nvar hrTagWidth = document.getElementsByTagName(\"\
  body\")[0]\n    .getElementById(\"horizontal-rule\").style.width;\n```\n\n#### 编写健壮代码\n\
  \n编写代码时，某些方法调用可能并不总能返回代码其余部分所依赖的值。如果出现这种情况，就会导致 JavaScript 错误，代码也会停止执行。专业的 JavaScript\
  \ 开发人员会在对方法的返回值执行进一步操作之前，检查这些值是否为所需格式。\n\n以下示例演示了这一实践，其中使用 DOM 查找了一个元素。\n\n```\n\
  var horizontalRule = document.getElementById(\"horizontal-rule\");\n\nif (horizontalRule)\
  \ { // 如果元素存在，则...\n    horizontalRule.parentNode.removeChild(horizontalRule); //\
  \ ...移除该节点\n}\n```\n\n此代码检查元素是否实际存在——即其值不为 `null` 或 `undefined`。如果对一个稍后从 HTML 中移除的元素执行操作，则会发生错误，代码执行将停止。\n\
  \n## 优雅处理致命异常错误\n\nJavaScript 语言（与许多其他语言一样）的一个有用特性是，能够将您有理由怀疑可能引发异常（即强制代码停止执行的那类错误）的语句组包装在\
  \ `try/catch` 代码块中，从而以优雅的方式处理错误。`try` 部分中的代码会执行；`catch` 部分中的代码仅在 `try` 部分代码导致错误时执行。如果没有发生错误，则忽略\
  \ `catch` 部分中的代码。以下是一个 `try/catch` 结构的示例，该结构在代码执行出错时向用户发出警报，而不会因此异常导致 JavaScript\
  \ 代码执行停止。\n\n```\ntry {\n    // 以下代码无效，通常会导致异常\n    document.getElementById(\"horizontal-rule\"\
  ).propertyName.toString();\n} catch (error) {\n    alert(\"发生了一个错误。\");\n}\n```\n\
  \n请注意 `catch` 块如何暴露一个变量，我将其命名为 `error`。此变量包含有关所发生错误的信息。在以下代码中，我尝试找出所发生错误的类型，以便向最终用户或开发者提供更有用的消息。\n\
  \n```\ntry {\n    // varx 不是语言中的关键字，因此会抛出 SyntaxError 异常\n    varx x = 0;\n} catch\
  \ (error) {\n    // 有六种基本的异常类型，均在此描述\n    if (error instanceof TypeError) {\n  \
  \      // 使用的变量类型不符合预期\n    } else if (error instanceof SyntaxError) {\n       \
  \ alert(error.message); // 输出描述异常的消息\n    } else if (error instanceof RangeError)\
  \ {\n        // 数值变量已超出其允许范围\n    } else if (error instanceof EvalError) {\n   \
  \     // JavaScript 的 eval() 函数被错误使用\n    } else if (error instanceof ReferenceError)\
  \ {\n        // 使用了无效的引用\n    } else if (error instanceof URIError) {\n        //\
  \ encodeURI() 或 decodeURI() 函数被错误使用\n    }\n}\n```\n\n## 定义自定义异常\n\n\n\n### 处理 JavaScript\
  \ 中的自定义异常\n\n除了捕获和处理内置的 JavaScript 异常外，你还可以定义自己的异常类型，并随时在代码中强制触发这些异常。以下示例展示了如何在特定情况下定义并抛出自定义错误。\n\
  \n```javascript\n// 定义一种新的错误类型\nvar domObjectNotFoundException = new Error(\"DOM\
  \ 对象未找到\");\n\nfunction getDOMObjectById(id) {\n  var domObject = document.getElementById(id);\n\
  \n  if (!domObject) {\n    // 如果 DOM 对象不存在，则抛出自定义错误类型的异常\n    throw domObjectNotFoundException;\n\
  \  }\n\n  return domObject;\n}\n\ntry {\n  // 假设我们试图对一个不存在的元素进行操作\n  getDOMObjectById(\"\
  this-id-is-not-on-the-page\").style.width = \"100px\";\n} catch (error) {\n  if\
  \ (error instanceof domObjectNotFoundException) {\n    alert(error.message); //\
  \ 输出 \"DOM 对象未找到！\"\n  } else {\n    // 捕获其他类型的错误\n  }\n}\n```\n\n### `finally`\
  \ 块\n\n作为常见的 `try/catch` 块结构的扩展，你可以添加一个由 `finally` 关键字标识的额外代码块。`finally` 关键字允许你添加一组额外的语句来执行，无论是否发生异常，以便将相关代码组织在一起。在以下示例中，无论\
  \ DOM 对象是否被找到，都会调用最后的 `alert` 语句。\n\n```javascript\ntry {\n  getDOMObjectById(\"\
  this-id-is-not-on-the-page\").style.width = \"100px\";\n} catch (error) {\n  alert(error.message);\n\
  } finally {\n  alert(\"就这些了，各位！\");\n}\n```\n\n### 编写具备本地化意识的代码\n\n本地化是已构建好的 RIA\
  \ 应用中较为常见的需求之一。想象一下，你构建了一个大型动态 Web 应用，却发现自己需要重构所有代码，才能对其中使用的文本字符串进行本地化处理。\n\n将文本字符串分离到变量中，并将它们集中放在代码中的某个位置。这样，后续如果需要，你就可以轻松地覆盖它们的值。采用这种方法，在后续需要向\
  \ JavaScript 代码中添加特定区域文本字符串时，能为你节省宝贵的时间。\n\n你可以考虑将这些变量移到一个单独的文件中——或许每种语言一个文件——这样\
  \ HTML 页面就能引用它所需的特定语言文件，而应用的其他部分则正常使用这些变量。这将语言选择工作转移到了 HTML 页面，这似乎是个明智的选择，因为页面内容中已经包含了语言相关的文本。\n\
  \n### 面向对象的 JavaScript\n\n自诞生之初，JavaScript 编码已经取得了长足进步，如今许多前端 Web 开发者发现自己以一种与传统软件工程师并无二致的方式编写复杂代码。随着时间的推移，开发者们通过应用一些传统程序员所使用的面向对象原则，力求减少错误、提高代码复用性并简化代码理解。\n\
  \n通过将相关代码分组到可复用的组件（即*对象*）中，每个组件拥有自己的变量和函数，你可以促进代码复用，并提供一层抽象，帮助你和你的同事更好地理解代码。曾经 JavaScript\
  \ 文件是长长一串函数列表，彼此间关联甚少且难以导航的日子已经一去不复返了。\n\n> **注意**：JavaScript 最初并非设计为面向对象的编程语言，若将其视为此类语言可能会导致一些困惑。部分面向对象代码设计原则确实适用，但并非全部。如果你熟悉这些原则在其他语言中的用法，请仔细阅读本节内容，以便理解其中的差异。\n\
  \n本节将帮助你养成使用面向对象原则和技术编写 JavaScript 代码的习惯，就像专业开发者所做的那样。\n\n\n\n#### 对象、类与构造函数\n\n\
  面向对象编程的两个重要概念是对象和类。接下来你将了解它们的含义，以及它们与 JavaScript 语言的关系。\n\n## 什么是对象？\n\n*对象*是一种特殊类型的数据，其中包含函数和变量。JavaScript\
  \ 内置了多个核心对象，包括 `Math`、`Array` 和 `String`。这些对象提供了一组函数，用于对特定类型的数据执行操作。以下展示了调用这些对象方法的一些示例。\n\
  \n```\nalert(Math.round(9.9)); // 输出 '10'\n\nvar cityList = new Array(\"New York\"\
  , \"London\", \"Stockholm\");\nvar sortedCityList = cityList.sort(); // \"London\"\
  , \"New York\", \"Stockholm\"\n\nalert(sortedCityList.join()); // 输出字符串 \"London,\
  \ New York, Stockholm\"\n```\n\n请注意，你可以通过在对象名称和要调用的方法名称之间使用点号（`.`）来访问对象中的方法。\n\n\
  ## 什么是类？\n\n*类*是对对象的定义。除了作为创建对象的基础之外，它本身永远不会在代码中使用。在 JavaScript 中定义类就像编写一个函数一样简单。以下示例展示了使用\
  \ `function` 关键字定义类的两种方法。\n\n```\nfunction EmailMessage() { // 定义了一个名为 EmailMessage\
  \ 的类\n}\n\nvar EmailMessage = function() { // 定义同一个类的另一种方法\n}\n```\n\n这两种定义类的方式都是有效的。你可以根据自己的喜好选择任何一种方式在代码中使用。\n\
  \n## 作为类实例的对象\n\n再看一下使用对象的示例：\n\n```\nalert(Math.round(9.9));\n\nvar cityList =\
  \ new Array(\"New York\", \"London\", \"Stockholm\");\nvar sortedCityList = cityList.sort();\n\
  \nalert(sortedCityList.join());\n```\n\n观察 `Math` 对象和 `Array` 对象在用法上的区别。请注意，`Math`\
  \ 对象可以直接使用，但 `Array` 对象前面需要使用 `new` 关键字。`Array` 对象定义了一个与数组列表相关函数的模板，根据我们之前的定义，这使它成为一个类。\n\
  \n要从一个类中创建可在代码中使用的内容，你需要使用 `new` 关键字，它会创建该类的一个*实例*。实际上，这允许你创建一个或多个对象，每个对象都包含类中定义的所有函数和变量，并且它们之间互不干扰。以下展示了几个将对象创建为类实例的示例。\n\
  \n```\nvar oceans = new Array(\"Atlantic\", \"Pacific\", \"Indian\", \"Arctic\"\
  , \"Antarctic\");\nvar myMessage = new EmailMessage(); // 使用之前定义的类\nvar anotherMessage\
  \ = new EmailMessage(); // 独立于上面的 myMessage\n```\n\n## 构造函数\n\n*构造函数*是一段可选的代码，在使用\
  \ `new` 关键字从类创建对象的瞬间执行。在 JavaScript 中，只需向定义类的函数中添加代码即可实现，如下所示：\n\n```\nvar EmailMessage\
  \ = function() {\n  // 实例化类时应执行的操作\n  alert(\"新消息已创建。\");\n}\n\nvar myMessage =\
  \ new EmailMessage(); // 输出 \"新消息已创建。\"\nvar anotherMessage = new EmailMessage();\
  \ // 输出 \"新消息已创建。\"\n```\n\n就像 JavaScript 语言中的普通函数可以传递参数供函数内部使用一样，类的构造函数也可以传递参数。以下是一个接受一个参数的类构造函数：\n\
  \n```\nvar EmailMessage = function(message) {\n  alert(message);\n}\n\n// 输出 \"\
  Return to sender\"\nvar myMessage = new EmailMessage(\"Return to sender\");\n```\n\
  \n## 属性\n\n在面向对象术语中，*属性*是存储在对象内部的变量。属性在类中使用 `this` 关键字定义，然后可供从该类实例化的每个对象使用。以下示例展示了如何在类中定义属性，以及如何从对象实例访问这些属性。\n\
  \n```\nvar EmailMessage = function() {\n```\n\n\n\n`this.subject = \"\";` // 使用\
  \ `this` 关键字为类分配属性\n\n```\nvar myMessage = new EmailMessage();\nmyMessage.subject\
  \ = \"Check this out...\"; // 为属性赋值\nvar anotherMessage = new EmailMessage();\n\
  anotherMessage.subject = \"Have you seen this before?\";\nalert(myMessage.subject);\
  \ // 输出 \"Check this out...\"\nalert(anotherMessage.subject); // 输出 \"Have you seen\
  \ this before?\"\n```\n\n在类中使用 `this` 关键字来引用实例化对象的作用域，稍后将对此进行更详细的讨论。\n\n## 方法\n\n\
  属性定义了与类或对象关联的变量，而方法则定义了所有对象实例均可使用的可执行函数。下面的示例演示了如何向类添加方法，以及如何从该类实例化的对象中执行该方法。\n\n\
  ```\nvar EmailMessage = function(subject) {\n    this.subject = subject;\n    this.send\
  \ = function() {\n        alert(\"Message '\" + this.subject + \"' sent!\");\n \
  \   }\n}\nvar myMessage = new EmailMessage(\"Dear John...\");\nmyMessage.send();\
  \ // 输出 \"Message 'Dear John...' sent!\"\n```\n\n## `prototype` 关键字\n\n在类定义之外，向类分配属性和方法的另一种方式是，在类定义后，针对类名使用\
  \ `prototype` 关键字。下面演示如何以这种方式向类添加属性和方法：\n\n```\nvar EmailMessage = function(subject)\
  \ {\n    this.subject = subject;\n}\nEmailMessage.prototype.from = \"\"; // 动态地向类分配新属性\n\
  EmailMessage.prototype.send = function() { // 动态地分配新方法\n    alert(\"Message from\
  \ \" + this.from + \" sent!\"); // 'this' 的行为仍如常\n}\nvar myMessage = new EmailMessage(\"\
  My new website\");\nmyMessage.from = \"me@denodell.com\";\nmyMessage.send(); //\
  \ 输出 \"Message from me@denodell.com sent!\"\n```\n\n除了允许你在类定义后向其添加额外的属性和方法外，你还可以使用\
  \ `prototype` 关键字向已从这些类创建的对象分配新的属性和方法。这允许你动态地为已存在的对象实例添加新功能。下面的示例演示了这一原理。\n\n```\n\
  var EmailMessage = function(subject) {\n    this.subject = subject;\n}\n// 从 EmailMessage\
  \ 类实例化一个对象\nvar myMessage = new EmailMessage(\"Coming to visit...\");\n// 向类添加一个新方法\n\
  EmailMessage.prototype.send = function() {\n    alert(\"Message sent!\");\n}\n//\
  \ 这个新方法存在于该方法添加之前创建的对象上！\nmyMessage.send(); // 输出 \"Message sent!\"\n```\n\n## 单例\n\
  \n单例是一种在你的代码中始终只有一个实例的类，例如 JavaScript 语言本身中的 `Math` 对象。你无法创建此对象的新实例，但它确实包含可以在代码中利用的属性和方法。\n\
  \n代码清单 2-1 演示了如何创建单例。\n\n**代码清单 2-1.** *创建单例*\n\n```\nvar User = function() {\n\
  \    this.username = \"\";\n    this.password = \"\";\n    this.login = function()\
  \ {\n        return true;\n    }\n}\n// 创建 User 类的一个实例，并将其存储在与最初定义该类时相同的变量中。\n//\
  \ 原始类现已从代码中移除，只留下了它的单个对象实例\nUser = new User();\n// 对 User 的单个实例进行方法调用示例\nUser.login();\n\
  // 自实例化类的示例\nvar Inbox = new function() {\n    this.messageCount = 0;\n    this.refresh\
  \ = function() {\n        return true;\n    }\n}();\n// new 关键字和大括号强制该函数立即执行，\n\
  // 这意味着 Inbox 变量现在包含的是单个对象实例，而不是类\n// 对 Inbox 的单个实例进行方法调用示例\nInbox.refresh();\n\
  ```\n\n现在你已经熟悉了如何创建具有属性和方法的类。接下来，让我们转向面向对象编程的一个重要方面：继承。\n\n\n\n#### 继承：从现有类创建新类\n\
  \n**继承**允许你创建从其他类派生的类，从而以某种方式对该类进行特化。原始类称为*父类*，从中派生出的新类称为*子类*。\n\nJavaScript 中的继承同样是使用\
  \ `prototype` 关键字来执行的。在定义了子类之后，将父类赋值给子类的 `prototype`，这样父类的属性和方法就会立即对子类可用。\n\n然后，子类可以根据需要覆盖或扩展父类的任何方法或属性。清单\
  \ 2-2 演示了如何使用 JavaScript 执行基本继承。\n\n**清单 2-2.** *JavaScript 中的基本继承*\n\n```\nvar\
  \ EmailMessage = function(subject) {\n  this.subject = subject;\n  this.send = function()\
  \ {\n    alert(\"Message '\" + this.subject + \"' sent!\");\n  }\n}\n\n// 创建一个新的空类\n\
  var EventInvitation = function() {};\n\n// 继承 EmailMessage 类的属性和方法\nEventInvitation.prototype\
  \ = new EmailMessage();\n\n// EventInvitation 认为自己就是 EmailMessage 类，因此修正这一点...\n\
  EventInvitation.prototype.constructor = EventInvitation;\n\n// 为 EventInvitation\
  \ 类的所有实例定义主题\nEventInvitation.prototype.subject = \"You are cordially invited to...\"\
  ;\n\n// 创建 EventInvitation 类的一个实例\nvar myEventInvitation = new EventInvitation();\n\
  \n// 输出 \"Message 'You are cordially invited to...' sent!\"\nmyEventInvitation.send();\n\
  ```\n\n## 封装：每个类各司其职\n\n当使用继承来创建现有类的变体或特化时，父类的所有属性和方法都对子类可用。你不需要在子类中声明或定义任何额外的东西就能使用父类的属性和方法。这被称为**封装**。子类只需包含那些在父类属性方法基础之上新增的属性和方法的定义。\n\
  \n## 多态：重定义继承的属性和方法\n\n你已经看到，在创建继承自父类的新子类时，子类拥有父类的所有属性和方法。现在假设你希望子类包含一个与父类同名的方法，并在子类中执行该方法内的代码，而不是使用父类的方法。这就是**多态**。清单\
  \ 2-3 演示了多态，其中子类包含一个与其继承的父类同名的方法。\n\n**清单 2-3.** *多态实战：替换父类的方法*\n\n```\nvar EmailMessage\
  \ = function(subject) {\n  this.subject = subject;\n  this.send = function() {\n\
  \    alert(\"Email message sent!\");\n  }\n}\n\n// 让 EventInvitation 类继承自 EmailMessage\n\
  var EventInvitation = function() {};\nEventInvitation.prototype = new EmailMessage(\"\
  You are cordially invited to...\");\nEventInvitation.prototype.constructor = EventInvitation;\n\
  \n// 重写继承来的 send 方法\nEventInvitation.prototype.send = function() {\n  alert(\"Event\
  \ invitation sent!\");\n}\n\nvar myEmailMessage = new EmailMessage(\"A new email\
  \ coming your way.\");\nvar myEventInvitation = new EventInvitation();\nmyEmailMessage.send();\
  \ // 输出 \"Email message sent!\"\nmyEventInvitation.send(); // 输出 \"Event invitation\
  \ sent!\"\n```\n\n现在假设你想重写子类中的一个方法，使其在父类方法的基础上执行额外的代码。也就是说，不是替换父类的方法，而是希望以某种方式扩展它，同时仍然使用父类提供的同名方法。清单\
  \ 2-4 演示了这一原理。\n\n> **注意** 任何你想要像清单 2-4 那样扩展的方法或属性，都必须在父类中使用 `prototype` 关键字声明；否则，它们将无法从子类内部找到。\n\
  \n**清单 2-4.** *多态实战：扩展父类的方法*\n\n```\nvar EmailMessage = function(subject) {\n  this.subject\
  \ = subject;\n}\n\n// 我们希望以后能扩展这个方法，\n// 因此它必须使用 prototype 关键字进行声明\nEmailMessage.prototype.send\
  \ = function() {\n  alert(\"Email message sent!\");\n}\n\n// 让 EventInvitation 类继承自\
  \ EmailMessage\nvar EventInvitation = function() {};\nEventInvitation.prototype\
  \ = new EmailMessage(\"You are cordially invited to...\");\nEventInvitation.constructor.prototype\
  \ = EventInvitation;\n\n// 重写继承来的 send 方法\nEventInvitation.prototype.send = function()\
  \ {\n  // 为 EventInvitation 的 send 方法添加代码\n  alert(\"Event invitation sent!\");\n\
  \  // 找到并执行 EmailMessage 类中的 send 方法\n  // this.constructor.prototype 指向 EmailMessage\
  \ 类\n  this.constructor.prototype.send.call(this);\n}\n\nvar myEmailMessage = new\
  \ EmailMessage(\"A new email coming your way.\");\nvar myEventInvitation = new EventInvitation();\n\
  \n// 输出 \"Email message sent!\"\nmyEmailMessage.send();\n\n// 先输出 \"Event invitation\
  \ sent!\"，然后输出 \"Email message sent!\"\nmyEventInvitation.send();\n```\n\n## `this`\
  \ 关键字\n\n构建任何基于对象的 RIA 的一个基本部分，是理解 JavaScript 中的 `this` 关键字。在本章的代码示例中，你已经在将属性和方法与类关联时，以及在子类内部调用父类方法时，看到了它的使用。了解如何正确使用这个强大的关键字将提升你的编码技能，并让你更好地掌握\
  \ JavaScript 语言本身。\n\n`this` 关键字指向包含它的函数的**所有者**。如果它出现在类的方法中，则指向类本身，或者更准确地说，指向代码执行时创建的类的对象实例。在类的上下文之外，`this`\
  \ 通常指向页面的全局 `window` 对象。请看清单 2-5，它展示了一些 `this` 关键字在不同上下文中基于同一个函数运行时的示例。\n\n**清单\
  \ 2-5.** *`this` 关键字实战*\n\n```\nvar showSubject = function() {\n  // 输出与这个函数拥有相同所有者的\
  \ subject 属性\n  alert(this.subject);\n}\n\n// 输出 \"undefined\"，因为 this 关键字指向全局 window\
  \ 对象，\n// 而它没有名为 subject 的变量\nshowSubject();\n\n// 设置一个全局的 subject 属性\nthis.subject\
  \ = \"Global subject\";\n\n// 现在属性已被设置，输出 \"Global subject\"\nshowSubject();\n\n\
  // 定义 EmailMessage 类\nvar EmailMessage = function(subject) {\n  this.subject = subject;\n\
  }\n\n// 复制并将 showSubject 函数赋给 EmailMessage 类，\n// 使 EmailMessage 类成为该函数的所有者。\n//\
  \ 注意函数名后没有圆括号，这表示复制的是函数的代码而非立即执行它\nEmailMessage.prototype.showSubject = showSubject;\n\
  \n// 创建该类的一个新实例\nvar myEmailMessage = new EmailMessage(\"I am the subject.\");\n\
  \n// 输出 \"I am the subject.\"，因为该函数的所有者是该类\nmyEmailMessage.showSubject();\n\n//\
  \ 再次输出 \"Global subject\" 以演示 this 没有被丢失\nshowSubject();\n\n// 现在让我们向类中添加另一个方法，以不同方式调用\
  \ showSubject\nEmailMessage.prototype.outputSubject = function() {\n  showSubject();\n\
  }\n\n// 输出 \"Global subject\"，因为此方法调用的函数\n// 是与 window 对象关联的\nmyEmailMessage.outputSubject();\n\
  ```\n\n如果你希望调用一个函数或方法，并确保 `this` 关键字指向特定的对象，可以使用 `call()` 或 `apply()` 方法。\n\n\n\n\
  # 使用 `apply` 和 `call` 实现不同的对象引用\n\n当你需要强制函数内部的 `this` 关键字指向一个与默认引用不同的对象时，有两个函数可以做到这一点：`apply()`\
  \ 和 `call()`。两者在实现上的区别非常细微。`apply()` 期望你传递给函数的任何参数都以数组形式提供，而 `call()` 则不需要。清单 2-6\
  \ 展示了这两个函数的实际应用，它们改变了一组可重用函数中 `this` 关键字的值。\n\n**清单 2-6.** 使用 `apply` 和 `call` 改变\
  \ `this` 关键字的值\n\n```\nvar showSubject = function() {\n    alert(this.subject);\n\
  }\n\nvar setSubjectAndFrom = function(subject, from) {\n    this.subject = subject;\n\
  \    this.from = from;\n}\n\n// 针对全局 window 对象执行\nshowSubject(); // 输出 \"undefined\"\
  \nsetSubjectAndFrom(\"Global subject\", \"me@denodell.com\");\nshowSubject(); //\
  \ 输出 \"Global subject\"\n\n// 创建 EmailMessage 类\nvar EmailMessage = function() {\n\
  \    this.subject = \"\";\n    this.from = \"\";\n};\n\n// 实例化类\nvar myEmailMessage\
  \ = new EmailMessage();\n\n// 执行 setSubjectAndFrom 函数，强制函数内的 this 关键字\n// 指向 myEmailMessage\
  \ 而非 window 对象。参数\n// 在作为拥有者的对象之后以序列形式传递，将 subject 设置为\n// \"New subject\"，并将 from\
  \ 属性设置为 \"den@denodell.com\"\nsetSubjectAndFrom.call(myEmailMessage, \"New subject\"\
  , \"den@denodell.com\");\n\n// 作为演示，我们现在使用 apply 代替 call 来做同样的事情；\n// 与 call 不同，apply\
  \ 期望参数以数组形式提供。\n// 你可以在代码中自由使用 apply 或 call\nsetSubjectAndFrom.apply(myEmailMessage,\
  \ [ \"New subject\", \"den@denodell.com\" ]);\n\n// 输出 \"New subject\"\nshowSubject.call(myEmailMessage);\n\
  ```\n\n## 属性和方法的访问权限\n\n大多数编程语言允许你定义对象中特定属性或方法在整个应用程序范围内的访问级别。到目前为止，所有示例中创建的类的属性和方法都是公开可用的，也就是说，它们可以从代码库中的任何位置访问。创建类的新实例允许对该实例中的任何属性进行读写访问，并允许执行任何方法。\n\
  \n但是，如果你要为类创建一个只在类内部可用的属性或方法（称为*私有*）呢？或者，假设你想从类定义外部对私有属性进行只读访问；你可以称之为*特权*属性。\n\n\
  > **注意：** 不要在此处将 *public*、*private* 和 *privileged* 这些术语与其他语言中的类似名称混淆。在此上下文中，我们仅讨论从类外部对类内部属性和方法的访问。\n\
  \n清单 2-7 演示了类属性的不同类型访问方式。\n\n**清单 2-7.** 限制对类属性和方法的访问\n\n```\nvar EmailMessage =\
  \ function(subject) {\n    // 公开可访问的属性和方法\n    this.subject = subject;\n    this.send\
  \ = function() {\n        alert(\"Message sent!\");\n    }\n\n    // 私有属性和方法。\n\
  \    // 使用 var 而非 this 关键字来设置属性意味着该\n    // 变量的作用域被限制在其所在的函数内部，并且\n    // 无法从外部访问\n\
  \    var messageHeaders = \"\";\n    var addEncryption = function() {\n        //\
  \ TODO：添加加密方法\n        return true;\n    }\n\n    // 保护属性，使其从类外部只读，\n    // 通过创建私有属性和公共方法实现\n\
  \    var messageSize = 1024;\n    this.getMessageSize = function() {\n        alert(messageSize);\n\
  \    }\n}\n\nvar myEmailMessage = new EmailMessage(\"Save these dates...\");\nalert(myEmailMessage.subject);\
  \ // 输出 \"Save these dates...\"\nmyEmailMessage.send(); // 输出 \"Message sent!\"\n\
  ```\n\n\n```javascript\n// 输出 \"undefined\"，因为 messageHeaders 不是一个公开可见的属性\nalert(myEmailMessage.messageHeaders);\n\
  \n// 由于该方法不存在，会引发异常\ntry {\n    myEmailMessage.addEncryption();\n} catch (e) {\n\
  \    alert(\"该方法在公开范围内不存在！\");\n}\n```\n\n```\n// 输出 \"undefined\"，因为 messageSize\
  \ 在类外部无法访问\nalert(myEmailMessage.messageSize);\n\n// 输出 \"1024\"，即私有变量 messageSize\
  \ 的值\nmyEmailMessage.getMessageSize();\n```\n\n#### 对象字面量与 JavaScript 对象表示法\n\n\
  JavaScript 语言中的**对象字面量**本质上是一个列表或集合，包含任意数量的属性名称及其对应的值。对象字面量的值可以是字符串、整数、浮点数、布尔值、数组、函数，甚至是其他对象字面量，并以特定格式表示。\n\
  \n对象字面量的格式通常被称为 JavaScript 对象表示法（JSON）。\n\n对象字面量的开始和结束由花括号`{`和`}`表示。花括号内列表中的每个项用逗号分隔，每个名称与其值之间用冒号分隔。\n\
  \n在语言中，对象字面量用于将相关属性和方法分组在一起，类似于类的用法。然而，对象字面量只有一个实例，并且在创建时无法像类定义那样执行任何代码语句。清单 2-8\
  \ 展示了一个包含多种类型值的对象字面量。\n\n**清单 2-8.** *包含多种类型值的对象字面量*\n\n```javascript\nvar earth\
  \ = {\n    name: \"Terra Firma\",      // 字符串\n    planet: true,             //\
  \ 布尔值\n    moons: 1,                 // 整数\n    diameter: 12756.36,       // 浮点数（小数）\n\
  \    oceans: [\"大西洋\", \"太平洋\", \"印度洋\", \"北冰洋\", \"南极海\"], // 数组\n    poles: {\
  \                  // 嵌套的对象字面量\n        north: \"北极\",\n        south: \"南极\"\n\
  \    },\n    setDiameter: function(diameter) {   // 函数\n        this.diameter =\
  \ diameter;       // this 关键字指向 earth 变量\n    }\n}\n\n// 使用点号表示法访问对象的属性\nalert(earth.diameter);\
  \          // 输出 \"12756.36\"\nearth.setDiameter(12756.37);\nalert(earth.diameter);\
  \          // 输出 \"12756.37\"\n```\n\n只要在实例化单例时不需要执行任何特定代码，您就可以使用对象字面量创建单例。\n\n\
  ### 在创建类时使用对象字面量\n\n对象字面量表示法可以与`prototype`关键字一起使用来设置类的定义，如下所示：\n\n```javascript\n\
  var EmailMessage = function() {};\nEmailMessage.prototype = {\n    subject: \"\"\
  ,\n    from: \"\",\n    send: function() {\n        alert(\"消息已发送！\");\n    }\n\
  }\n\nvar myEmailMessage = new EmailMessage();\n\n// 正常访问属性和方法\nmyEmailMessage.subject\
  \ = \"过来参加派对……\";\n```\n\n这种格式的局限性在于，您可能需要编写额外的代码来初始化类中的属性。\n\n### 将对象字面量用作函数的输入\n\
  \n当您编写一个需要多个参数的函数时，应考虑接受一个对象字面量作为该函数的输入。这样可以用一个参数替换所有参数；通过点号表示法从单个参数中提取值。以这种方式使用对象字面量通常会使代码更易于阅读和理解，因为对象字面量中的每个属性值都有名称，为提供给函数的参数提供了上下文。\n\
  \n清单 2-9 演示了两个行为相同的函数，但一个接受多个参数，另一个只接受一个参数。\n\n**清单 2-9.** *对象字面量作为函数的输入*\n\n```javascript\n\
  // 使用特定顺序的多个参数\nvar sendEmail = function(to, from, subject, body) {\n    alert(\"\
  消息 '\" + subject + \"' 来自 '\" + from + \"' 已发送至 '\" + to + \"'！\");\n}\n\n// 调用函数时参数必须按正确顺序排列。\n\
  // 输出 \"消息 'Dinner this week?' 来自 'me@denodell.com' 已发送至 'you@denodell.com'！\"\n\
  sendEmail(\"you@denodell.com\", \"me@denodell.com\", \"Dinner this week?\", \"Do\
  \ you want to come over for dinner this week? Let me know.\");\n\n// 同样的函数，但使用单个包含命名属性的对象字面量参数\n\
  var sendEmail = function(message) {\n    alert(\"消息 '\" + message.subject + \"'\
  \ 来自 '\" + message.from + \"' 已发送至 '\" + message.to + \"'！\");\n}\n\n// 一个包含命名属性值的对象字面量参数，无特定顺序\n\
  // 输出 \"消息 'Dinner this week?' 来自 'me@denodell.com' 已发送至 'you@denodell.com'！\"\n\
  sendEmail({\n    from: 'me@denodell.com',\n    to: 'you@denodell.com',\n    subject:\
  \ 'Dinner this week?',\n    body: 'Do you want to come over for dinner this week?\
  \ Let me know.'\n});\n```\n\n### 创建命名空间和层次结构\n\n在全局的`window`对象中创建过多的变量通常被称为**污染全局作用域**。这种做法很危险，因为您定义的变量可能与网站上运行的第三方脚本使用的变量重名。JavaScript\
  \ 不会在变量被这样覆盖时发出警告，因此您可能依赖的值已被外部不可控因素覆盖。\n\n解决这个问题的方法是在全局作用域中创建一个单独的变量，作为对象字面量或单例，包含应用程序的所有代码。这在许多编程语言中被称为**命名空间**。您可以在该全局对象内创建其他对象字面量或单例，以维护命名空间的层次结构，将相关代码分组在一起。以下是一个命名空间层次结构的示例：\n\
  \n```javascript\nvar MyCompany = new function(){\n    this.MyClient = {        \
  \         // 对象字面量\n        WebMail: function() {        // 构造函数\n            alert(\"\
  正在创建 WebMail 应用程序……\");\n        }\n    };\n}();    // 创建 MyCompany 作为单例\n\n// 现在可以通过点号表示法访问层次结构。\n\
  // 输出 \"正在创建 WebMail 应用程序……\"\nvar myWebMail = new MyCompany.MyClient.WebMail();\n\
  ```\n\n### 库与框架\n\n近年来，为了简化动态网页和富互联网应用程序（RIA）的开发，已经编写了几个开源的 JavaScript 库。它们主要的存在目的是平滑不同浏览器在\
  \ JavaScript 实现上的不一致性，并帮助开发者编写更少的代码来实现目标。\n\n不幸的是，不同浏览器在支持 JavaScript 的某些方面存在差异——并非所有浏览器都支持使用相同的方法执行相同的操作。一些主要的差异点包括：\n\
  \n- 处理用户与页面交互时发生的事件\n- 从 Web 服务器加载远程内容\n- 检测 DOM 何时初始化完毕并可用\n- 确定哪些 CSS 样式应用到了特定元素\n\
  \nJavaScript 库通过填补缺失的功能和修复不正确的实现来消除这些差异。\n\n此外，许多 JavaScript 库还包含额外的实用方法，以简化常见任务，例如使用\
  \ CSS 3 选择器表示法定位页面元素。许多库也开始增加对吸引人的过渡效果的支持，使页面上一种样式过渡到另一种样式时更平滑。\n\n> **提示：** 关于\
  \ CSS 3 选择器表示法的指南，请访问 [`www.w3.org/TR/css3-selectors/`](http://www.w3.org/TR/css3-selectors/#selectors)。请注意，选择器列表目前仍是尚未完成的工作。\n\
  \n\n在构建丰富互联网应用程序（RIA）时，你应该使用一个 JavaScript 库。没有跨浏览器兼容性处理的平滑过渡，你将难以生存，而额外的实用方法将帮助你更高效地编码。\n\
  \n**选择库**\n\n有多个开源 JavaScript 库可供选择。目前，一些最流行的库包括 jQuery（[`jquery.com/`](http://jquery.com/)）、Dojo（[`www.dojotoolkit.org/`](http://www.dojotoolkit.org/)）、Prototype（[`www.prototypejs.org/`](http://www.prototypejs.org/)）、MooTools（[`mootools.net/`](http://mootools.net/)）、Yahoo!\
  \ 用户界面库（YUI）（[`developer.yahoo.com/yui/`](http://developer.yahoo.com/yui/)）以及 Ext\
  \ JS（[`extjs.com/`](http://extjs.com/)）。这些库中有许多拥有大量支持额外功能的三方插件。\n\n在调研和选择 JavaScript\
  \ 库时，请考虑以下标准：\n\n*不扩展 JavaScript 对象*：选择一个不严重依赖扩展原生 JavaScript 对象（如 `Function`、`String`、`Array`\
  \ 等）的库。如果你发现某个库允许你在这些对象上调用不属于 JavaScript 语言的方法或更改属性，请务必谨慎。语言未来的新增内容可能会破坏这些方法和属性，其他第三方\
  \ JavaScript 库也可能以不同的方式覆盖相同的方法。\n\n*文档完善*：选择一个文档完善，并且在发布新版本前运行了大量测试用例的库。\n\n*社区活跃*：选择一个拥有活跃开发者和用户社区的库。你遇到的任何问题，更有可能之前已经被解决了。如果没有，你的问题更有可能得到处理，并且库也会因此做出必要的修改。\n\
  \n*没有内存泄漏*：选择一个不会泄漏内存的库。这又回到了前面提到的测试用例。\n\n*小巧高效*：选择一个不大且不臃肿的库。小巧不一定意味着更好，但这确实意味着你代码的用户在能使用你的网站之前，需要下载更少的\
  \ JavaScript。\n\n**79**\n\n*拥有自己的命名空间*：选择一个不会污染全局作用域的库。确保该库位于其自己的命名空间内。\n\n*允许标准\
  \ JavaScript 语法*：最后，选择一个允许你以预期方式编写 JavaScript 的库。警惕那些强迫你花费大量时间学习如何使用其模式（仿佛它是一种完全不同的语言）的库。请记住，你是一名\
  \ JavaScript 程序员，而不是库程序员。\n\n并非每个库都满足所有这些标准。你应该仔细研究可用的库，以便在构建 RIA 时，对自己将要依赖的库做出明智的决定。\n\
  \n**构建一个 JavaScript 库**\n\n为了理解库所解决的问题类型，特别是关于跨浏览器兼容性的问题，并展示一个遵循上一节中大部分指南的库，让我们来构建一个基础\
  \ JavaScript 库。这个库将作为本书中许多代码示例的基础。\n\n运用本章讨论的面向对象编程原则，我们创建一个类来描述我们的 JavaScript 库，并将其简称为\
  \ `$`：\n\n```javascript\nvar $ = function() {};\n```\n\n这不仅是该语言中函数或变量名的有效名称，实际上，由于其长度短（意味着代码更短），它经常被用作代表\
  \ JavaScript 库全局命名空间的名称。它的使用最初源于 Ruby 和 PHP 编程语言中。\n\n**检测 DOM 何时可用**\n\n\n\n# JavaScript\
  \ DOM 就绪与事件处理\n\nJavaScript 程序员的一个主要困扰是，当执行的脚本需要访问 DOM 时，DOM 有时尚未可用。如果脚本被引用在 HTML\
  \ 页面的 `<head>` 部分，它将在该页面的 `<body>` 加载之前执行，这意味着此时它将无法定位页面元素。以前，开发者会将整个代码添加到 `window.onload`\
  \ 事件中，这意味着它将在整个页面（包括任何外部图片、CSS 和 JavaScript 文件）加载完成后才执行。页面上的图片越多，用户等待脚本执行的时间就越长。\n\
  \n最终，一些浏览器厂商与 W3C 共同引入了 `DOMContentLoaded` 事件，该事件在页面元素加载完成并可通过 JavaScript 访问时触发。此事件在\
  \ `window.onload` 事件之前触发，也在外部文件完成加载之前触发，这意味着开发者可以让脚本针对 DOM 执行，而无需等待整个页面内容加载完成。\n\
  \n不幸的是，`DOMContentLoaded` 事件尚未在所有常见浏览器中实现，尤其是 IE 6、7 和 8。为了平滑这种不一致性，并在支持该事件的浏览器中提供支持，在不支持的浏览器中提供变通方案，你需要编写自己的方法，在\
  \ DOM 准备好使用时执行你的代码。清单 2-10 展示了在你的 `$` 库中，在所有浏览器中实现此行为的一种方法。\n\n**清单 2-10.** *在 DOM\
  \ 准备好访问时执行代码*\n\n```\n$.prototype.onDomReady = function(callback){ // callback 应为一个函数\n\
  \    if (document.addEventListener) {\n        // 如果浏览器支持 DOMContentLoaded 事件，\n\
  \        // 则在该事件触发时将回调函数分配给其执行\n        document.addEventListener(\"DOMContentLoaded\"\
  , callback, false);\n    } else {\n        if(document.body && document.body.lastChild){\n\
  \            // 如果 DOM 已可访问，则执行回调函数\n            callback();\n        } else {\n\
  \            // 重新执行当前函数（由 arguments.callee 表示），\n            // 等待一个短暂的纳秒时间，以免锁定浏览器\n\
  \            return setTimeout(arguments.callee, 0);\n        }\n    }\n}\n\n//\
  \ 使用示例\n// 将 $ 库对象实例化为页面使用的单例\n$ = new $();\n// 当 DOM 可访问时，输出“DOM 已就绪！”\n$.onDomReady(function()\
  \ {\n    alert(\"DOM 已就绪！\");\n});\n```\n\n## 浏览器中的事件处理\n\n当某些操作（如超链接点击和表单提交）发生时，JavaScript\
  \ 事件会在浏览器内触发，你可以编写代码在这些时刻执行。问题在于，在 IE 6 和 7 与其他浏览器之间，为这些事件分配函数的方式有所不同。不仅如此，确定事件发生的页面元素以及事件的其他属性（如鼠标位置）的方法，在这些浏览器之间也有所不同。\n\
  \n清单 2-11 展示了如何向你的 `$` 库添加方法，以平滑这些不一致性。\n\n**清单 2-11.** *编写方法以标准化浏览器中的事件处理*\n\n\
  ```\n// 向 $ 库添加新的命名空间，用于存放所有与事件相关的代码，\n// 使用对象字面量表示法一次性添加多个方法\n$.prototype.Events\
  \ = {\n    // add 方法允许我们为特定元素上发生指定类型的事件时分配要执行的函数\n    add: function (element, eventType,\
  \ callback) {\n        // 存储 this 的当前值，以便在子函数中使用\n        var self = this;\n   \
  \     eventType = eventType.toLowerCase();\n        if (element.addEventListener)\
  \ {\n            // 如果 W3C 的事件监听器方法可用，则使用该方法\n            element.addEventListener(eventType,\
  \ function(e){\n                // 执行回调函数，并向其传递一个标准化后的事件对象 e\n                //\
  \ standardize 方法将在稍后定义\n                callback(self.standardize(e));\n       \
  \     }, false);\n        } else if (element.attachEvent) {\n```\n\n\n```javascript\n\
  // 否则，使用 Internet Explorer 专有的事件处理器\nelement.attachEvent(\"on\" + eventType, function()\
