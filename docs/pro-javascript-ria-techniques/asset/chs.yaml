- "# PersistJS\n\n`PersistJS` [(http://pablotron.org/software/persist-js/)](http://pablotron.org/software/persist-js/)\
  \ 是一个开源的本地数据存储库，它持续更新以支持更新的浏览器和技术。除了支持我们在本章中探讨的技术外，该库还支持 `Gears`。\n\n`Gears` 是谷歌开发的一个浏览器插件，它提供了一个\
  \ `SQLite` 数据库用于离线数据存储。它还提供了一种方法，可以将密集的 JavaScript 例程卸载到最终用户机器上的独立工作进程中，以提升性能。该插件可从\
  \ [`gears.google.com/`](http://gears.google.com/) 下载，并支持多种[浏览器](http://gears.google.com/)。它默认内置于谷歌的\
  \ Chrome 浏览器中。\n\n### 总结\n\n本章涵盖了通过 Web 应用程序在用户机器上存储数据的不同技术。它提供了一个跨浏览器的 API，用于在本地数据存储中存储、检索和删除数据。使用本地数据存储可以提供更好的用户体验，因为如果网络连接中断或浏览器软件崩溃，数据仍然是安全的。数据可以留在用户计算机上，直到可以发送到服务器，然后被删除。\n\
  \n在下一章中，我们将探讨一些高级 Ajax 技术，用于从存储在 Web 服务器上的非文本文件中提取隐藏信息。\n\n## 第 10 章：二进制 Ajax\n\n\
  到目前为止，你应该已经熟悉了使用 Ajax 技术在浏览器和 Web 服务器之间检索和发送基于文本的数据。本章将解释如何通过 JavaScript 动态检索存储在其他类型文件（如图像、音频和视频）中的数据。这允许你提取这些文件中存储的信息，以供\
  \ Web 应用程序使用。\n\n### 纯文本文件 vs. 二进制文件\n\n所有文件——无论是文本、图像、音频还是其他类型的数据——都按照指定的格式以数据的形式存储在计算机的文件系统中。计算机软件程序，如\
  \ Microsoft Word 或 Apple iTunes，只加载符合它们预期特定格式的文件，并将它们转换为对该软件用户更有用的内容。\n\n计算机文件数据存储为\
  \ 8 位十六进制字节的长序列，每个字节可以表示从 0 到 255 的值（以 16 进制表示），通常以常见的十六进制表示法表示为 `0x00` 到 `0xFF`。文本字符在文件中存储为\
  \ `0x20` 到 `0x7E` 范围内的十六进制字节，而仅包含该范围内数据字节的计算机文件被称为*纯文本文件*。HTML、样式表和 JavaScript 文件都是纯文本文件。包含该范围之外数据字节的文件被称为*二进制文件*。图像和\
  \ Flash 组件就是二进制文件的例子。\n\n为了区分一种二进制文件类型与另一种，并确保该文件的格式符合预期类型，每种文件类型都有自己的规范，由负责创建该数据文件格式的个人或组织编写。该规范描述了数据在文件中的存储和格式化方式。\n\
  \n通常，二进制文件会有一个头部（header）部分，其中包含描述文件主体部分中实际数据的信息。在图像文件中，这个头部信息可能包含图像的宽度、高度和分辨率。在\
  \ MP3 音乐文件中，这可能包含存储在文件中的艺术家、曲目和音乐流派名称。\n\n### 使用 Ajax 读取二进制文件\n\n第 2 章展示了在 Web 应用程序中为托管在\
  \ Web 服务器上的纯文本文件发起 Ajax 请求所需的代码。为了演示如何检索二进制文件，让我们扩展该代码以发起对二进制文件的请求。\n\n### 331\n\
  \n### 332\n\n**第 10 章 ■ 二进制 Ajax**\n\n> **注意：** 与对纯文本文件的 Ajax 请求一样，你无法请求托管在非当前运行\
  \ JavaScript 代码的服务器上的文件。\n\n\n\n二进制文件通常比纯文本文件大得多，因此你需要告知服务器仅返回所请求文件中的特定部分数据。你很可能需要读取存储在文件开头的标头数据。因此，仅接收文件的第一部分比接收整个文件更有意义。幸运的是，你可以利用\
  \ `Range` HTTP 请求标头来指定要接收的文件大小。例如，以下 `Range` 标头指示服务器仅返回所请求文件的前 1,024 字节：\n\n```\n\
  Range: bytes=0-1024\n```\n\n并非所有 Web 服务器都支持 `Range` 标头，因此在使用它之前，你必须检查其是否受支持。这可以通过对要读取内容的文件发起\
  \ `HEAD` 请求来实现。`HEAD` 请求仅返回当请求文件内容时通常会随附的 HTTP 响应标头，而不返回实际文件内容。然后你检查 `Accept-Ranges`\
  \ HTTP 响应标头是否存在且其值为 `bytes`，这表明 Web 服务器支持此功能。一旦确认支持此功能，你可以发送实际的 `GET` 请求来获取二进制文件，并提供\
  \ `Range` 请求标头。\n\n清单 10-1 展示了需要添加到 `$` JavaScript 库中现有 Ajax 方法中的代码（该库从第 2 章开始构建），以支持使用跨浏览器\
  \ Ajax 连接器对象进行连接和数据检索。注意请求二进制文件与请求纯文本文件之间的相似之处。\n\n**清单 10-1.** 配置二进制连接器\n\n```\n\
  // The method configureBinaryConnector takes three input parameters:\n// - A cross-browser\
  \ Ajax connector object\n// - An optional length to specify how much data the server\
  \ should\n//   return, in bytes\n// - A callback function to pass the downloaded\
  \ binary data to\n\n$.prototype.Remote.configureBinaryConnector = function(input)\
  \ {\n    // Create fallback values for each of the inputs in case they are not specified\n\
  \    var connector = input.connector || this.getConnector();\n    var length = input.length\
  \ || -1;\n    var callback = input.callback || function() {};\n\n    // By default,\
  \ Firefox will attempt to convert the binary data received into a\n    // different\
  \ format if it is of a known type. We will force Firefox to believe\n    // the\
  \ data is of an unknown type, so it does not perform any conversion on the\n   \
  \ // raw binary data returned by the server\n\n    if (connector.overrideMimeType)\
  \ {\n        connector.overrideMimeType(\"text/plain; charset=x-user-defined\");\n\
  \    }\n\n    // If a length has been specified, set the HTTP Range request header\
  \ to return\n    // only the specified amount of data from the start of the file\
  \ - otherwise we\n    // would have to download the entire file, which would slow\
  \ down any\n    // processing we wish to perform upon it\n    if (length > -1) {\n\
  \        connector.setRequestHeader(\"Range\", \"bytes=0-\" + length);\n    }\n\n\
  \    // Internet Explorer returns the binary data in the connector.responseBody\n\
  \    // property. Other browsers return it in the connector.responseText property\n\
  \    if (typeof connector.onload != \"undefined\") {\n        // The connector.onload\
  \ event handler exists within the W3C XmlHttpRequest\n        // object but not\
  \ Microsoft's XMLHTTP ActiveX object.\n        connector.onload = function(){\n\
  \            // HTTP status 200 means the file downloaded successfully in its\n\
  \            // entirety, and 206 means that the portion of the file specified with\n\
  \            // the HTTP Range request header was returned successfully\n      \
  \      if (connector.status == 200 || connector.status == 206) {\n             \
  \   // In those browsers that support connector.onload, the binary data\n      \
  \          // from the file is returned in connector.responseText\n            \
  \    var binaryData = connector.responseText;\n\n                // Wrap the data\
  \ in a BinaryReader object, which we will define\n                // later, which\
  \ will expose methods and properties for interacting\n                // with the\
  \ data within the binary file.\n                // The this keyword refers to $.Remote\n\
  \                var binaryReader = new this.BinaryReader(binaryData);\n```\n\n\n\
  \n// 执行传入到此例程的回调函数，并将新的 `binaryReader` 对象作为参数传递给它\n`callback(binaryReader);`\n\n\
  `}`\n\n`}`\n\n`} else {`\n\n// `connector.onload` 事件处理器不存在，因此这应该是 Internet Explorer\
  \ 浏览器——在这种情况下，我们将改用跨浏览器 Ajax 的 `onreadystatechange` 事件处理器\n\n**第 10 章 ■ 二进制 Ajax**\
  \ **334**\n\n`connector.onreadystatechange = function() {`\n\n`if (connector.readyState\
  \ == 4) {`\n\n`if (connector.status == 200 || connector.status == 206) {`\n\n//\
  \ 请求的文件或文件部分已成功返回。在 Internet Explorer 中，二进制数据通过 `connector.responseBody` 属性返回\n\n\
  `var binaryData = connector.responseBody;`\n\n// 创建一个新的 `BinaryReader` 构造函数实例（稍后定义），该实例允许从整个二进制文件中查找数据块。\n\
  \n// `this` 关键字指向 `$.Remote`\n\n`var binaryReader = new this.BinaryReader(binaryData);`\n\
  \n// 执行传入例程的回调函数，传递 `binaryReader` 对象实例，以允许回调访问文件中的数据\n\n`callback(binaryData);`\n\
  \n`}`\n\n`}`\n\n`}`\n\n`}`\n\n`}`\n\n现在你可以配置跨浏览器连接对象，使其能够接收二进制数据。清单 10-2 展示了如何通过\
  \ JavaScript 请求一个二进制文件或文件的一部分。将此代码添加到你的 `$` JavaScript 库中。\n\n**注意：** 遗憾的是，在撰写本文时，Opera\
  \ 浏览器无法从此例程可用的形式返回 Ajax 请求中的二进制数据。在围绕此代码构建 Web 应用程序时，请牢记这一点。所有其他现代浏览器，包括 IE 6，都将以可用形式返回数据。\n\
  \n**清单 10-2.** 使用 Ajax 加载完整的或部分二进制文件\n\n// `loadBinary` 方法从指定的 URL 加载一个二进制文件，并执行一个回调函数，将返回的原始二进制数据传递给它。如果指定了可选的\
  \ `length` 参数，则仅下载文件的一部分，大小不超过该参数指定的字节数\n\n**第 10 章 ■ 二进制 Ajax** **335**\n\n`$.prototype.Remote.loadBinary\
  \ = function(request) {`\n\n`var url = request.url || \"\";`\n\n`var length = request.length\
  \ || -1;`\n\n`var callback = request.callback || function() {};`\n\n// 此处的 `this`\
  \ 关键字指向 `$.Remote` 命名空间\n\n`var self = this;`\n\n`if (length > -1) {`\n\n// 如果指定了数据长度，意味着只应下载文件的一部分，则执行一个\
  \ HTTP HEAD 请求，该请求仅返回 HTTP 响应头\n\n`self.load({`\n\n`url: url,`\n\n`type: \"HEAD\"\
  ,`\n\n`callback: function() {`\n\n// 创建一个新的 Ajax 连接器对象并打开连接\n\n`var connector =\
  \ self.getConnector();`\n\n`connector.open(\"GET\", url, true);`\n\n// 通过测试 HTTP\
  \ `Accept-Ranges` 响应头的值，判断 Web 服务器是否支持 HTTP Range 头\n\n`if (this.getResponseHeader(\"\
  Accept-Ranges\") == \"bytes\") {`\n\n// 如果 Web 服务器支持数据范围选择，则检查指定的长度是否超过文件中所有数据的长度\n\
  \n`var fileLength = this.getResponseHeader(\"Content-Length\");`\n\n`if (length\
  \ > parseInt(fileLength, 10)) {`\n\n`length = parseInt(fileLength, 10);`\n\n`}`\n\
  \n// 配置新的连接器，使其指定要从文件中检索的数据长度。然后将此数据传递给回调函数\n\n`self.configureBinaryConnector({`\n\
  \n`connector: connector,`\n\n`length: length,`\n\n`callback: callback`\n\n`});`\n\
  \n`} else {`\n\n**第 10 章 ■ 二进制 Ajax** **336**\n\n// Web 服务器不支持数据范围选择，因此在配置新连接器时，我们将省略指定长度，以便文件中的所有数据都传递给回调函数\n\
  \n`self.configureBinaryConnector({`\n\n`connector: connector,`\n\n`callback: callback`\n\
  \n`});`\n\n`}`\n\n// 使用新连接器对象中配置的设置，发起对二进制文件的请求\n\n`connector.send(\"\");`\n\n`}`\n\
  \n`});`\n\n`} else {`\n\n// 如果没有指定长度，则加载整个二进制文件并将其传递给回调函数\n\n\n\n```javascript\n\
  var connector = this.getConnector();\nconnector.open(\"GET\", url, true);\nthis.configureBinaryConnector({\n\
  \  connector: connector,\n  callback: callback\n});\nconnector.send(\"\");\n```\n\
  \n现在，你可以请求二进制文件并返回文件中的原始数据。接下来，你需要能够读取文件中你感兴趣的具体部分。清单 10-3 展示了一个新的构造函数，你可以用它来读取和提取返回的二进制文件中的特定数据。请将此代码添加到你的\
  \ JavaScript 库中。\n\n**清单 10-3.** 二进制文件读取器\n\n```javascript\n// Internet Explorer\
  \ 不允许我们返回二进制数据中的某些信息。\n// 为了解决这个问题，我们必须在页面中编写两个 VBScript\n//（微软自己的脚本格式）函数：IEgetByte\
  \ 和 IEgetLength，\n// 当需要时，我们将从 JavaScript 代码中调用它们。\n// 这些函数通过 document.writeln 添加到页面中，并包裹在\
  \ Internet Explorer\n// 的条件注释中，这样其他浏览器就不会读取它们。\n\ndocument.writeln(\n  '<!-- [if\
  \ IE]>' +\n  '<script type=\"text/vbscript\">\\r\\n' +\n  '  Function IEgetByte(data,\
  \ position)\\r\\n' +\n  '    IEgetByte = AscB(MidB(data,position + 1, 1))\\r\\n'\
  \ +\n  '  End Function\\r\\n' +\n  '  Function IEgetLength(data)\\r\\n' +\n  ' \
  \   IEgetLength = LenB(data)\\r\\n' +\n  '  End Function\\r\\n' +\n  '</script>'\
  \ +\n  '<![endif]-->'\n);\n```\n\n`BinaryReader` 构造函数接收原始二进制数据作为输入，并包含帮助从原始数据中以不同格式提取数据的方法。\n\
  \n```javascript\n$.prototype.Remote.BinaryReader = function(data) {\n  // 将数据输入存储到此构造函数的属性中\n\
  \  this.data = data;\n\n  // isBigEndian 属性表示正在处理的二进制数据是采用标准的十六进制格式（也称为“大端”格式）\n\
  \  // —— 例如数字 8 在 4 字节数据中表示为 00000008 ——\n  // 还是采用相反的格式（也称为“小端”格式）\n  // —— 例如数字\
  \ 8 表示为 08000000。\n  // true 表示数据是大端格式，这是常见格式\n  this.isBigEndian = true;\n\n  //\
  \ 添加一个 setter 方法，以便在需要时更改 isBigEndian 属性的值\n  this.setIsBigEndian = function(isBigEndian)\
  \ {\n    this.isBigEndian = isBigEndian;\n  };\n\n  // getLength 方法返回二进制数据的字节长度\n\
  \  this.getLength = function() {\n    // 除了 Internet Explorer 之外，所有浏览器中二进制数据都表示为字符串。\n\
  \    // 标准浏览器将直接返回字符串的 length 属性，\n    // IE 将使用之前声明的 VBScript 函数来计算二进制数据的长度\n \
  \   return (typeof this.data == \"string\") ? this.data.length : IEgetLength(data);\n\
  \  };\n\n  // getByte 方法返回位于距离数据开头指定字节位置处的单个字节数据\n  this.getByte = function(position)\
  \ {\n    // 标准浏览器将使用 charCodeAt 函数返回一个 Unicode 值，\n    // 该值表示存储在指定位置的数据，然后将其转换为十六进制值。\n\
  \    // 这在 Internet Explorer 中不起作用，它必须使用自己的 VBScript 函数\n    // 从数据中提取所需的字节\n  \
  \  return (typeof this.data == \"string\") ?\n      (this.data.charCodeAt(position)\
  \ & 0xFF) : IEgetByte(data, position);\n  };\n\n  // getChar 方法返回存储在指定位置处的字节所表示的\
  \ ASCII 字符\n  this.getChar = function(position) {\n    return String.fromCharCode(this.getByte(position));\n\
  \  };\n\n  // getString 方法返回从指定位置开始并持续指定长度的数据所表示的 ASCII 字符串\n  this.getString =\
  \ function(position, length) {\n    // 创建一个数组来存储字符串的每个字符\n    var chars = [];\n\n\
  \    // 从指定位置开始，获取指定长度内每个字节处存储的字符，并将其添加到字符数组中\n    for (var index = position, end\
  \ = position + length; index < end; index++) {\n      chars.push(this.getChar(index));\n\
  \    }\n\n    // 返回将字符数组连接成一个字符串的结果\n    return chars.join(\"\");\n  };\n\n  //\
  \ getHex 方法返回一个字符串，表示从指定位置开始并持续指定长度的十六进制数据\n  this.getHex = function(position, length)\
  \ {\n    // 创建一个数组来存储每个单独的十六进制字符串\n    var result = [];\n\n    // 获取每个字节的值并将其转换为\
  \ base 16（十六进制），\n    // 然后将其转换为 2 个字符的字符串并添加到输出数组中\n    for (var index = position,\
  \ end = position + length; index < end; index++) {\n      var newByte = this.getByte(index).toString(16).toUpperCase();\n\
  \      result.push((newByte.length == 1) ? \"0\" + newByte : newByte);\n    }\n\n\
  \    // 如果数据不是以标准的大端格式存储，则反转数组顺序，\n    // 这将为我们提供小端格式的数据\n    if (!this.isBigEndian)\
  \ {\n      result.reverse();\n    }\n\n    // 返回将十六进制字符数组连接成一个字符串的结果\n    return\
  \ result.join(\"\");\n  };\n\n  // getNumber 方法执行 getHex 方法，并将其结果\n  // 从 base 16\
  \ 值转换为标准整数数字\n  this.getNumber = function(position, length) {\n    return parseInt(this.getHex(position,\
  \ length), 16);\n  };\n};\n```\n\n所以，现在你已经拥有了从服务器请求二进制文件所需的代码，并且根据你所读取的特定类型二进制文件的规范，你能够从这些文件中提取感兴趣的数据。接下来，让我们看一下如何针对一种特定类型的二进制文件（包含照片的文件）执行此操作。\n\
  \n### 从照片文件中提取图像数据\n\n假设作为 web 应用程序的一部分，你希望从数码相机拍摄的照片图像文件中提取信息，例如照片的拍摄时间和尺寸。大多数用数码相机拍摄的照片都将此信息存储在拍摄时生成的\
  \ JPEG 图像文件的头部部分。只要你知道描述数据如何存储在文件中的规范，你就可以使用你的二进制 Ajax 文件读取器（清单 10-3）来提取这些信息。对于照片文件，此数据以可交换图像文件（EXIF）格式存储。\n\
  \n在提取图像文件中存储的数据之前，你需要了解数据在文件中的结构。这始终遵循非常严格的格式规范，因此数据被错误表示或与不同文件格式混淆的可能性为零。\n\n###\
  \ 理解 EXIF 格式\n\nEXIF 格式描述了额外信息如何存储在 JPEG 图像文件中。有关此规范的有用描述可以在网上找到，网址为 `http://park2.wakwak.com/~tsuruzoh/Computer/Digicams/exif-e.html`。\n\
  \n### JPEG 和 EXIF 头部\n\n一个 JPEG 文件在其中的 EXIF 数据开始之前可能包含任意数据量。EXIF 数据的开始由以下十六进制表示的数据标记（为清晰起见添加了额外空格）：\n\
  \n```\nFFE1 ssss 4578 6966 0000\n```\n\n其中 `ssss` 表示文件中 EXIF 数据块的大小（十六进制数）。序列 `4578\
  \ 6966` 表示字符串 `\"Exif\"`。\n\n文件中的下一个点标志着 EXIF 数据本身的开始。文件中的以下 2 字节数据要么是 `4949`（字符串\
  \ `II`），要么是 `4D4D`（字符串 `MM`）。这表示剩余 EXIF 数据中十六进制字节的对齐方式。如果此格式指定为 `MM`，则其余数据采用标准的十六进制表示法；例如，数字\
  \ 8 在 2 字节的十六进制代码中表示为 `0008`。如果此格式为 `II`，则每个字节顺序相反；例如，数字 8 将表示为 `0800`。\n\n\n\n\
  紧随该字节对齐指示符之后的是数据 `002A`（若使用反向格式则为 `2A00`），这是数字 `42` 的十六进制表示，但实际上并未用于任何特定用途。（有趣的是，数字\
  \ `42` 之所以被选中，是因为据作家道格拉斯·亚当斯所说，它代表了“生命、宇宙和一切”这个问题的答案）。接下来的 4 字节数字表示从 EXIF 数据起始位置到你想提取的实际图像信息数据之间的字节数。\n\
  \n### 图像文件目录与标签\n\nEXIF 图像信息存储在称为图像文件目录（IFD）的数据块中。每个目录包含一个或多个标签，这些标签代表了图像信息数据本身，其数据结构与表\
  \ 10-1 所示一致。\n\n**表 10-1.** *图像文件目录结构*\n\n| **数据长度** | **数据类型** | **含义** |\n|----------------|---------------|----------------|\n\
  | 2 字节 | 数字 | 该目录中包含的标签数量 |\n| 12 字节 ✕ 标签数量 | 标签 | 图像信息数据 |\n| 4 字节 | 数字 | 从 EXIF\
  \ 数据起始位置到序列中下一个 IFD 的距离 |\n\n存储在 IFD 中的每个标签都具有相同的数据结构，与表 10-2 所示一致。\n\n**表 10-2.**\
  \ *图像文件目录标签结构*\n\n| **数据长度** | **数据类型** | **含义** |\n|----------------|---------------|----------------|\n\
  | 2 字节 | 十六进制 | 指示存储在此标签中的图像数据的代码 |\n| 2 字节 | 数字 | 存储在此标签中的图像数据的格式 |\n| 4 字节 | 数字\
  \ | 存储在此标签中的图像数据的长度 |\n| 4 字节 | 混合类型 | 如果数据长度不超过 4 字节，则为图像数据本身；如果数据长度超过 4 字节，则为一个指向文件其他位置图像数据的查找数字\
  \ |\n\n以下是一个标签的示例，采用标准（MM）十六进制格式（为清晰起见，添加了空格）：\n\n```\nA002 0004 00000001 00000640\n\
  ```\n\n标签 `A002` 表示当前文件中图像的宽度。格式 `0004` 表示数据以 4 字节数字形式存储。图像数据的长度为 `00000001`，这表示仅有一个\
  \ 4 字节数字需要表示。由于数据长度不超过 4 字节，该数据本身存储在最后的 4 字节序列 `00000640` 中。这代表以十六进制格式存储的数字 `1,600`。通过此标签，你可以了解到当前文件中存储的图像宽度为\
  \ `1,600` 像素。你可以在线查找 EXIF 标签的完整列表：[`www.sno.phy.queensu.ca/~phil/exiftool/TagNames/EXIF.html。`](http://www.sno.phy.queensu.ca/~phil/exiftool/TagNames/EXIF.html)\n\
  \n### 使用 JavaScript 读取 EXIF 数据\n\n现在你已经了解了 JPEG 图像文件内 EXIF 格式数据的存储方式，可以编写自己的构造函数了。清单\
  \ 10-4 展示了一个 EXIF 数据读取器，它将二进制数据转换成一个包含该数据所表示的图像信息的对象。将此代码保存为单独的文件，命名为 `exif-reader.js`。\n\
  \n**清单 10-4.** *EXIF 数据读取器*\n\n```javascript\n// ExifData 构造函数仅接收一个 BinaryReader\
  \ 对象作为输入，并\n// 返回一个包含其二进制数据中存储的图像信息的对象\n\nvar ExifReader = function(data) {\n  \
  \  // 创建一个对象字面量，其中包含存储在主图像数据 IFD 中的\n    // 一系列标签 ID\n    var MainImageTags = {\n\
  \        // 公司名称。例如：尼康、摩托罗拉、苹果等\n        \"010F\": \"Make\",\n        // 相机型号。例如：D80、iPhone\
  \ 等\n        \"0110\": \"Model\",\n        // 拍摄图像时相机的角度，精确到 90°\n        \"0112\"\
  : \"Orientation\",\n        // 图像的 X 轴分辨率。例如：72\n        \"011A\": \"XResolution\"\
  ,\n        // 图像的 Y 轴分辨率。例如：72\n        \"011B\": \"YResolution\",\n        // 一个表示分辨率数据存储单位的数值\n\
  \        \"0128\": \"ResolutionUnit\",\n        // 用于在拍摄后处理图像的软件包名称。例如：Adobe Photoshop\n\
  \        \"0131\": \"Software\",\n        // 拍摄图像的日期和时间\n        \"0132\": \"DateTime\"\
  ,\n        // 用于在拍摄后处理图像的计算操作系统。例如：Mac OS X\n    };\n};\n```\n\n\n```javascript\n\
  \"013C\": \"主机计算机\",\n\n// 表示进一步图像数据位置的值\n\"8769\": \"Exif 偏移量\",\n\n// 表示经纬度数据位置的值，该数据标记了图像拍摄地点\n\
  \"8825\": \"GPS 偏移量\"\n\n// 为简洁起见，省略了大量其他标签\n}\n\n// 创建一个对象字面量，包含一组表示图像附加信息数据的标签\
  \ ID\nvar 扩展数据标签 = {\n\n// 拍摄照片时相机的 F 档位\n// 例如：F2.8\n\"829D\": \"光圈值\",\n\n// 表示图像数据色彩配置的值\n\
  \"A001\": \"色彩空间\",\n\n// 图像的宽度，例如：800\n\"A002\": \"图像宽度\",\n\n// 图像的高度，例如：600\n\
  \"A003\": \"图像高度\"\n\n// 为简洁起见，省略了大量其他标签\n}\n\n// 创建一个对象字面量，包含一组表示图像拍摄经纬度的标签 ID\n\
