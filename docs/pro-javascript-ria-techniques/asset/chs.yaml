  \ 类包含我们绘制和\n            // 测量画布上文本所需的方法。在使用这些方法之前的第一步是\n            // 声明一个该对象的实例，并将其\n\
  \            // 与我们的画布关联起来。\n            Graphics graphics = Graphics.FromImage(canvas);\n\
  \n            // 在编写任何文本之前，我们需要定义字体。ASP.NET 定义了\n            // 两种字体集合：系统上安装的字体和\n\
  \            // 可以从文件中动态加载以供临时使用的私有字体集合。\n            // 我们需要使用的是后者，因此我们\n     \
  \       // 创建一个新的私有字体集合，并使用我们之前声明的\n            // TrueType 字体的文件位置将字体添加到其中。\n \
  \           PrivateFontCollection myFonts = new PrivateFontCollection();\n     \
  \       myFonts.AddFontFile(Server.MapPath(fontFileLocation));\n\n            //\
  \ 单个字体总是与字体系列相关联，字体系列是\n            // 一组彼此关联的字体集合。这些系列\n            // 包含同一字体的变体，例如同一字体的粗体或斜体版本。\n\
  \            // 现在我们已经将字体添加到私有字体集合中，\n            // 它存储在其系列组中，该系列组已在\n        \
  \    // 字体文件中定义并被 ASP.NET 自动提取。\n            // 要获得我们可以在代码中使用的字体引用，我们必须通过\n    \
  \        // 其字体系列来访问它。我们知道我们只添加了一种字体，\n            // 它只能属于一个字体系列，因此我们可以在\n    \
  \        // 代码中获取这个字体系列。\n            FontFamily myFontFamily = myFonts.Families(0);\n\
  \n            // 现在我们可以创建对该系列中特定字体的引用，\n            // 使用所需的尺寸，我们选择以像素为单位进行测量。\n\
  \            Font myFont = new Font(myFontFamily, size, FontStyle.Regular, GraphicsUnit.Pixel);\n\
  \n            // 现在我们有了文本和字体的定义，我们需要测量\n            // 当文本写入画布时将占用的空间。我们\n     \
  \       // 使用 MeasureString 方法来实现这一点，向其传递要渲染的\n            // 文本和字体定义，它会返回\n   \
  \         // 渲染后文本的宽度和高度尺寸。\n            int width = Convert.ToInt32(graphics.MeasureString(text,\
  \ myFont).Width);\n            int height = Convert.ToInt32(graphics.MeasureString(text,\
  \ myFont).Height);\n\n            // 确定了渲染文本的宽度和高度后，我们现在\n            // 需要使用这些尺寸重新创建画布，并为最终图像指定一个\n\
  \            // 颜色深度（本例中为 24 位 RGB）。\n            canvas = new Bitmap(width, height,\
  \ PixelFormat.Format24bppRgb);\n            graphics = Graphics.FromImage(canvas);\n\
  \n            // 我们已经创建了最终的画布，因此可以开始构建\n            // 最终的图像了。让我们首先使用我们之前定义为白色的\n\
  \            // 背景颜色填充画布。\n            graphics.Clear(backgroundColor);\n\n    \
  \        // 现在，在将文本写入画布之前，我们需要\n            // 生成一个 ASP.NET 画笔概念的实例，用于\n       \
  \     // 绘制文本。我们现在不想使用太花哨的东西，所以我们将\n            // 实例化一个纯色画笔，使用我们之前分配的前景文本颜色。\n\
  \            SolidBrush brush = new SolidBrush(color);\n\n            // 好了，现在所有设置都已准备好，我们可以使用选定的字体\n\
  \            // 将文本绘制到画布上。以下代码使用我们的画笔\n            // 将文本绘制到画布上，从画布区域的左上角开始。\n \
  \           int topLeftCornerX = 0;\n            int topLeftCornerY = 0;\n     \
  \       graphics.DrawString(text, myFont, brush, topLeftCornerX, topLeftCornerY,\
  \ StringFormat.GenericTypographic);\n\n            // 我们的画布已经准备好显示，因此下一步是\n    \
  \        // 实际将其作为 PNG 格式的图像绘制到屏幕上。在此之前，\n            // 我们首先向浏览器发送正确的内容类型头，\n \
  \           // 以便它将数据显示为图像，最后我们释放\n            // 画布占用的应用程序内存，供 Web 服务器的其余部分使用。\n\
  \            Response.ContentType = \"image/png\";\n            canvas.Save(Response.OutputStream,\
  \ ImageFormat.Png);\n            canvas.Dispose();\n        }\n    }\n}\n```\n\n\
  将 Web 窗体连接到新的后台代码文件后，你应该能够在 HTML 和 CSS 代码中使用以下图像 URL 格式，以你预定义的字体动态生成图像：\n\n```\n\
  /generate-image.aspx?text=News\n```\n\n## 在 Java/JSP 中动态生成图像\n\n\n\n"
- '# 生成包含自定义字体文本的 JSP 图像


  你可能有一个支持 Java 的 Web 服务器，用于创建和运行 JSP 页面。在这种情况下，动态文本图像生成的过程与 PHP 和 ASP.NET 类似：创建一个空白画布，使用指定的字体将文本绘制到画布上，然后以正确的内容类型将该画布发送到浏览器。


  将 **清单 6-3** 中的代码输入到一个新的 JSP 文件中，并将其保存为 `generate-image.jsp`。


  **208**


  第 6 章 ■ 精美的排版


  **清单 6-3.** *在 JSP 中生成包含自定义字体文本的图像*


  ```

  <%


  // 首先，我们从查询字符串中获取 text 参数的值，该值将用作要在图像中渲染的文本。

  String text = request.getParameter("text");


  // 接下来，我们将声明一些变量供后续代码使用，用于存储字体文件位置、所需的文本尺寸，

  // 以及文本和画布的前景色与背景色。

  String fontFileLocation = "font-file-location.ttf";

  float size = 24f;

  Color color = Color.BLACK;

  Color backgroundColor = Color.WHITE;


  // 现在变量已定义完毕，让我们创建一个对象实例来表示我们想要使用的字体，

  // 该字体将从服务器文件系统中获取，然后设置所需的尺寸。

  Font font = Font.createFont(Font.TRUETYPE_FONT, ➥

  new java.io.FileInputStream(fontFileLocation));

  font = font.deriveFont(size);


  // 在创建画布并将文本绘制到其上之前，我们首先通过使用一个临时容器来测量

  // 以所选字体绘制的文本尺寸，从而确定画布所需的大小。

  FontRenderContext fontRenderContext = new FontRenderContext();

  TextLayout textLayout = new TextLayout(text, font, fontRenderContext);

  Rectangle2D dimensions = textLayout.getBounds();

  int width = (int)Math.ceil(dimensions.getWidth());

  int height = (int)Math.ceil(dimensions.getHeight());


  // 现在，我们已经确定了画布所需的宽度和高度，可以创建空白画布，并指定高色深。

  BufferedImage canvas = new BufferedImage(width, height, ➥

  BufferedImage.TYPE_INT_RGB);


  // 在此空白画布上绘图所需的方法包含在 Java 的 Graphics2D 类中。

  // 在使用这些方法之前，我们必须先将该对象的一个实例与我们的画布关联起来。

  Graphics2D graphics = canvas.createGraphics();


