  script loaded and available!\");\n\n});\n```\n\n\n\n## 第 4 章：性能调优\n\n在第 2 章中，我介绍了在页面的整个\
  \ DOM 初始化完毕并可访问后立即执行 JavaScript 代码的能力。这发生在整个页面加载完成之前，因为它只考虑 HTML 已加载，而不考虑任何引用的外部资源（如图片）。通过编写代码使其在此事件触发时执行，如清单\
