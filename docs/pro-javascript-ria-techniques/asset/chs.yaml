  ### 在 HTML 中指定 SVG


  使用 SVG 创建独立的图像文件是可行的，但这种方法无法提供动态渲染功能。通过直接在 HTML 页面中定义图像，你可以利用 DOM 与画布中的各个元素进行动态交互。


  `清单 11-2` 展示了如何使用 XHTML 描述图 11-1 的图像，无需任何外部图像文件引用。


  你必须以 `.xhtml` 扩展名保存`清单 11-2` 中所示的文件，这样才能强制浏览器同时使用其 XML 和 HTML 解析器来渲染页面，而不仅仅是使用其
  HTML 解析器。XML 解析器包含渲染 SVG 所需的代码，并且浏览器只有在绝对确定页面内容是 XML 时，才会使用其 XML 解析器。这可以通过指定文件扩展名为
  `.xhtml`，或确保 Web 服务器发送 MIME 类型为 `application/xhtml+xml` 来描述文件内容来实现。实际上，应该使用这种 MIME
  类型来发送所有 XHTML 文件内容，而不是像普通 HTML 文档那样使用常见的 `text/html` MIME 类型。不使用它的唯一原因是 IE 不识别此
  MIME 类型，并拒绝渲染页面。


