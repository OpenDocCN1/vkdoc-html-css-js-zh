  $color_hex['blue'] = 0x00;\n$color = ImageColorAllocate($image, $color_hex['red'],\
  \ $color_hex['green'], $color_hex['blue']);\n```\n\n`// 在将文本渲染到画布之前，我们需要计算字体的基线`\n\
