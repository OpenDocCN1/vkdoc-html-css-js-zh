  | 500 服务器内部错误 | 最常见的状态码，表示服务器上发生了一般性错误。通常发生在请求的 URL 是服务器端脚本，且该脚本在运行时出错的情况下。 |\n\
  | 501 未实现 | 服务器无法理解或支持所请求的 HTTP 操作。 |\n| 502 网关错误 | 在客户端和目标服务器之间传递消息的代理服务器出现问题，意味着目标服务器无法理解请求，或无法确保能给出客户端可正确接收的响应。\
