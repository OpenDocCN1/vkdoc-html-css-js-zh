  **11**


  但如果`JavaScript`被禁用了呢？你需要确保你的 HTML 代码结构能使用户被带到一个包含登录表单的独立页面。提交这个表单会将数据回发到服务器，导致页面刷新，而服务器端代码会根据用户状态（成功登录或未登录）来决定发送哪个页面。通过这种方式，两种场景在功能上是等效的，尽管它们的用户流程和创意处理可能不同。


  再举一个例子，假设你有一个页面，其中包含一个用于收集在线预订系统付款信息的表单。在这个表单中，根据所选信用卡的类型，你可能希望某些字段仅在用户选择信用卡（如图
  1-3 所示）时显示，而不是借记卡（如图 1-4 所示）。例如，“发卡行号”字段仅适用于借记卡，也许你还想仅对某些发卡机构的卡片显示“有效起始日期”字段。你可能还希望让用户无法提交不正确的日期，例如
  2 月 30 日。


  作为 Web 开发者，我们使用`JavaScript`来实现这一点。当用户在浏览器中执行某些操作时，`JavaScript`会触发事件，我们能够分配代码在这些事件触发时执行。我们甚至有能力取消事件，这意味着，例如，如果用户试图提交一个表单，如果我们认为该表单因未通过某些验证测试而不适合提交，我们可以取消该提交。


  我们使用`JavaScript`来“监听”卡类型字段的变化。当用户选择一个不同的单选按钮选项时，此事件被触发。当此事件被触发时，我们可以执行一段代码，根据所选的卡类型显示或隐藏所需的字段。


  **图 1-3.** *显示信用卡字段的支付卡表单*


  ![Image 12](img/index-36_1.png)


  **12**


  第 1 章 ■ 构建坚实基础


  **图 1-4.** *显示借记卡字段的支付卡表单*


  我们还会监听表单的`submit`事件，当它触发时，我们会运行一个小型的`JavaScript`程序来检查日期字段是否包含有效值。如果我们认为输入的值不合格，我们可以强制表单提交失败。


  现在，如果有人使用不支持`JavaScript`的浏览器访问你的网页会发生什么？她使用单选按钮选择了卡类型，但页面没有任何变化。实际上，为了实现对页面外观的改变，表单必须提交到服务器，以让服务器执行你之前使用`JavaScript`进行的那种处理。


  在可用性方面，你可能会觉得要求用户在选择了卡类型后立即提交表单很奇怪，因为字段已经显示在下方了。在这种情况下，组织页面的理想方式可能是让所有字段都存在于页面的
  HTML 中，并简单地允许用户填写其卡上可用的信息。当他们最终提交表单时，服务器上的处理程序可以验证他们的卡数据，检查他们是否输入了有效日期，如果存在错误，则重新加载页面并显示错误消息。


  ### 一致地命名和组织文件夹与文件


  通过建立关于文件夹、文件及其内容命名的规则和约定，你为自己和其他开发者查找文件和代码简化了任务。一致的命名约定使维护和添加新功能的工作更加简单，确保开发者始终知道如何命名他们的资产。请参阅本章后面的“结构化你的文件夹、文件和资产”一节，了解一些你可能采用的目录结构示例。


  ### 维护整洁的代码库


  你应该确保与项目关联的文件和代码恰好是网站工作所需的——不多不少。随着时间的推移，某些文件可能被其他文件取代，某些 CSS 样式规则或`JavaScript`文件也可能被其他规则或文件取代。


  我建议你在开发过程中定期从代码库中清除所有冗余的文件、文件夹和代码。这可以减小项目规模，有助于其他开发者理解代码，并确保你网站的最终用户不会下载从未使用过的文件，从而消耗他们可能需要付费的带宽。



  好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。



  '
- '# 避免意外删除导致的问题


  为避免文件被意外删除，或因之后需要已删除文件而陷入困境，您应考虑使用源代码管理系统。


  此类系统会为项目文件的更改保留备份，并确保您可以随时恢复到特定文件夹或文件的先前版本——即使是已删除的文件。有关更多信息，请参阅本章后面的“存储文件：版本控制系统”一节。


  '
- '# 为性能而设计代码


  您的网站访问者，无论他们是否意识到这一点，都期望在网页上获得响应迅速的用户界面。如果点击了一个按钮，用户期望看到某种反应，以表明他们的操作已被识别并正在处理中。


  `HTML`、`CSS` 和 `JavaScript` 代码在浏览器中运行，并依赖于最终用户机器或设备的性能。您的代码需要轻量且高效，以便快速下载、正确显示并即时响应。本书第
  2 部分将重点介绍性能，并解释如何让您的代码变得更轻、更精、更快，从而造福最终用户。


  '
- '# 不要为技术而技术


  在更广泛的 Web 开发社区中，您经常会听到关于新技术的炒作，声称它们能以某种方式让您的网页变得更好。最近，这种炒作主要集中在异步 JavaScript 和 XML（Ajax）技术上，该技术是指在浏览器中使用
  JavaScript 与服务器通信，从而减少页面刷新频率。这成为了 Web 开发人员在任何新项目中都喜欢使用的技术。


  问题在于，构建的网站仅能通过 Ajax 技术工作，完全依赖于 JavaScript。那些浏览器不具备此功能的用户——例如使用移动网页浏览器的用户、在办公环境中受限制的用户、因残疾而有特殊浏览器需求的用户，以及搜索引擎爬虫等外部机器人——将无法访问通常通过超链接和按钮连接在一起的
  HTML 页面提供的信息。相反，一些拥有功能强大的浏览器的用户发现，如果他们长时间停留在某些严重依赖 Ajax 技术的网站上，他们的浏览器最终会变慢或失去响应。一些急于赶上新潮流的
  Web 开发人员，忘记以防止浏览器内存泄漏的方式进行编码。


  将您的网站建立在可靠的基础和稳固的原则之上，在决定新技术是否适合您的项目之前，确保对其进行测试并将其推向可用的极限。


  您将在第 2 章中了解 Ajax 技术，并在第 4 章中了解如何处理浏览器中的内存泄漏。


  '
- "# 标记最佳实践：语义化 HTML\n\n`HTML` 或 `XHTML` 构成了每个网页的基本基础。从技术上讲，这些是唯一需要被所有网络浏览器和用户代理支持的\
  \ Web 标准。在这里，*语义* 一词指的是应用正确的标签来匹配内容背后的含义（根据字典，*语义* 一词的字面意思是 *意义*）。\n\n尽可能多地了解 `HTML`/`XHTML`\
  \ 标签和属性将使您处于有利位置。确保您的内容使用完全适合其涵盖内容的标签进行标记：表格数据使用表格标签，章节标题使用标题标签，依此类推。\n\n您能给内容赋予的意义越多，Web\
  \ 浏览器、搜索引擎爬虫和其他软件就越能按照预期的方式解释您的内容。\n\n建议您在页面的标记中包含所有语义信息，即使您选择使用 CSS 样式规则在浏览器中视觉上隐藏某些元素。一个有用的指导原则是，您应该根据如果大声朗读时的效果来编写标记。想象一下，标签名称被朗读出来，然后是标签的内容。事实上，这正是大多数屏幕阅读器浏览器的工作方式，它们为有视觉障碍的人提供网页的音频描述。\n\
  \n例如，假设您为电影评论建立了一个网站，并且想要显示一张图片来表示该电影获得了五颗星中的四颗。现在考虑一下您希望如何大声朗读这些信息——比如，“评为五颗星中的四颗星”。假设您将此文本放在\
  \ HTML 中，以便所有人都能访问。但您不希望此文本显示在页面上；您只想显示四颗星的图片。这就是 CSS 发挥作用的地方。您可以向包含此文本的标签应用一个 class\
  \ 属性，并使用 CSS 定位这个 class，以指定隐藏文本并根据指定大小显示图像。以适用于所有浏览器（包括屏幕阅读器）的方式隐藏部分文本的样式规则，将在本章后面的“格式最佳实践：CSS”部分中介绍。页面此部分的\
  \ HTML 可能如下所示：\n\n```\n<div class=\"rated-four-out-of-five\">\n  这部电影被评为五颗星中的四颗星。\n\
  </div>\n```\n\n## 学习 HTML 标签\n\n如果您是一位经验丰富的 Web 开发人员，曾参与过多个网站项目，并且一直以语义化的方式标记内容，那么您应该已经熟悉了大量的标签：`<h1>`、`<h2>`、`<p>`、`<img>`、`<ul>`\
  \ 和 `<li>`，仅举几例。然而，一些不太常见的标签很少出现在开发人员的脑海中。缺少这些标签，您将面临以错误方式标记文档的风险，从而错失为用户、搜索引擎和其他人增加内容意义的机会。\n\
  \n以下是一些为浏览器或最终用户增加重要含义，但经常被遗忘的标签：\n\n-   `<abbr>`：缩写，用于将内联文本标记为缩写。在许多浏览器中，将鼠标悬停在文本上会显示完整的版本。\n\
  \    `<abbr title=\"等\">etc.</abbr>`\n\n-   `<acronym>`：首字母缩写词，用于将内联文本标记为首字母缩写词。在许多浏览器中，将鼠标悬停在文本上会显示完整的版本。\n\
  \    `<acronym title=\"万维网\">WWW</acronym>`\n\n-   `<address>`：页面的联系信息。乍一看，您可能认为此标签应用于标记页面上列出的邮政地址。然而，这是对该标签的错误使用。它只应用于标记页面作者的联系信息。（当然，邮政地址可以是该信息的一部分。）\n\
  \    ```\n    <address>\n      作者：Den Odell<br />\n      <a href=\"mailto:me@denodell.com\"\
  >给作者发送电子邮件</a>\n    </address>\n    ```\n\n-   `<blockquote>`：长引用。关于块引用经常被忽略的一个重要点是，该标签只能包含块级元素。因此，引用本身至少必须用段落或其他块级元素括起来。\n\
  \    ```\n    <blockquote>\n      <p>如果音乐是爱情的食粮，那就继续演奏吧，<br />\n      给我过量，直到饱足，<br\
  \ />\n      让食欲反胃，然后消亡。</p>\n    </blockquote>\n    ```\n\n-   `<ins>` 和 `<del>`：插入和删除的副本。`<del>`\
  \ 用于显示一段内容已被删除。`<ins>` 用于显示另一段内容已被插入到页面中。例如，这些标签可能用于博客文章，其中作者在发表后返回文章并对其进行编辑以更改特定句子。这些标签可以以语义化的方式显示这一点。通常，`<del>`\
  \ 标签内的内容在浏览器中会显示为带有删除线。\n    ```\n    英国有 <del>5000</del> <ins>6000</ins> 万居民\n\
  \    ```\n\n在编写页面代码时，请牢记这些标签。看看您是否能发现将它们融入标记中，以表达内容正确含义的机会。\n\n\n\n"
- '# 夯实基础


  **提示：** 开发时请手边备一份标签和属性参考列表，并定期复习。


  一个优秀的 XHTML 标签和属性在线资源可访问 [`www.w3schools.com/tags/`](http://www.w3schools.com/tags/)。


  '
- '# 第 1 章：夯实基础


  ## 从文档类型定义开始


  每个 HTML 或 XHTML 页面都应从文档类型定义（DTD，即 DOCTYPE）开始。它必须出现在页面中任何其他 HTML 标签之前。DTD 指明了页面内容所遵循的
  HTML 标准，这对任何解析页面内容的软件都是至关重要的信息。例如，如果浏览器知道文档其余内容是 XHTML，它就会假设每个标签都已闭合，标签和属性的大小写保持一致，且标签嵌套正确，因为这些正是
  XHTML 文档的规则。


  DTD 并非标准标签，因此无需闭合。示例如下：


  ```

  <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

  ```


  此 DTD 声明页面其余内容为 XHTML 1.0 过渡版格式，并告知内容阅读器可访问哪个 URL 以获取相应的规范。


  如果省略 DTD，浏览器就可能自行猜测使用何种标准，这可能会导致一些奇怪的渲染错误。


  ### DOCTYPE 切换


  微软 IE 浏览器早期版本（包括 5.5 版本及之前）引发的一大严重投诉是，它不会按照 W3C 推荐的规范来渲染某些样式。具体来说，*盒模型*（它决定了浏览器应如何将
  CSS 宽度和高度属性应用于同时包含内边距的块级元素）就与 W3C 推荐规范及其他浏览器的实现不一致。


  在 IE 6 发布时，微软开发人员面临一个困境：要么采用正确的实现，但这会破坏所有为旧版浏览器设计的现有页面渲染；要么维持原状，迫使所有开发者为 IE 使用与其他浏览器不同的样式表。显然，两种选择都不理想。作为解决方案，他们内置了两种渲染方法，并提出一种方式，通过文档开头的
  DTD 在这两种方法之间进行切换。


  如果开发者在 DTD 中省略了 URL 部分，浏览器就会进入*怪异模式*——即 IE 中最初不正确的盒模型渲染方式。如果提供了包含完整 URL 的 DTD，浏览器则进入*标准模式*，遵循
  W3C 规范。这样，开发者就可以为自己的网站选择使用哪种渲染方法。


  ### DTD 的选择


  作为开发者，我们希望推动整个网络对标准的使用，无论是在我们的代码中，还是在用于解释代码的软件中。然而，我们必须认识到，仅仅采用 W3C 的最新推荐并不总是最明智之举。我们必须考虑当前支持该推荐的浏览器所占的比例。


  在本书出版之时，以下 DTD 选择获得了全面的跨浏览器支持，并受到推荐：


  - HTML 4.01 严格版

  - HTML 4.01 过渡版

  - HTML 4.01 框架版

  - XHTML 1.0 严格版

  - XHTML 1.0 过渡版

  - XHTML 1.0 框架版


  HTML 4.01 是 HTML 4 的精简版本，强调结构而非表现。除非有充分的理由使用其他版本，否则应将 HTML 4.01 严格版作为默认 DTD。它将以最严格、最符合标准的方式渲染文档。


  HTML 4.01 过渡版包含 HTML 4.01 严格版的所有元素和属性，但额外增加了表现性属性、已废弃的元素和链接目标。如果需要与遗留代码集成，则应使用 HTML
  4.01 过渡版。


  HTML 4.01 框架版包含 HTML 4.01 过渡版的所有元素和属性，但增加了对框架集的支持。除非在无法避免使用框架集的情况下，否则不应使用。


  稍后将讨论到，XHTML 本质上是采用 XML 格式的 HTML。它可以被 XML 解析器读取，并可使用可扩展样式表语言转换（XSLT）转换为任何其他基于文本的形式。


  ### DTD 验证


  选择了一个 DTD 来描述你的文档，并不意味着你编写的标记就符合该 DTD 中包含的规范。为避免错误，你应该通过 HTML 验证器运行你的页面，它会检查页面是否符合你指定的
  DTD。


  最好的验证器之一是 W3C 提供的在线工具，网址为 [`validator.w3.org/`](http://validator.w3.org/)。你可以通过公开可访问的
  URL 运行验证，上传你的 HTML 文件，或直接将标记输入到网站上的文本字段中。在 W3C 验证器网站上点击 `Check` 按钮即可运行验证。任何生成的错误都会按照文档源代码顺序列出。


  ## XHTML 中的“X”从何而来？


  由于 XHTML 本质上是应用了 XML 规则的 HTML，因此其规则与 XML 相同：


  - 所有标签必须格式良好。

  - 所有元素和属性名称应统一采用小写或大写，因为 XML 是区分大小写的。许多人发现小写更容易阅读。

  - 属性值必须用引号括起来并提供。即使是简单的数值也必须加引号。在属性作为布尔型开/关值的情况下（例如，`<input>` 元素的 `checked` 和 `disabled`
  属性），该值应设置为与属性名相同，如下例所示：


  ```

  <input checked="checked" type="checkbox" name="item1" id="item1" value="1" />

  ```


  与 HTML 不同，XHTML 是格式良好的——每个打开的标签都必须关闭。这意味着浏览器解析 XHTML 比解析 HTML 更简单，因此它也适合用于处理器速度慢、内存小的移动应用。专门针对移动用途，有
  XHTML 移动版概要（现在称为 XHTML Basic），它是完整 XHTML 的一个子集。


  事实上，XHTML 的通用可转换性和可读性使其也适合其他 Web 服务和计算机程序访问和解析，这意味着它具有令人难以置信的多功能性，因此强烈推荐使用。本书其余部分的所有示例都将优先使用
  XHTML 而非 HTML。


  ### 格式良好的文档


  当所有元素都有闭合标签或自闭合，并且所有元素都相对于其他元素正确嵌套时，XHTML 文档就是格式良好的。也就是说，任何被打开的标签都必须在其父标签闭合之前闭合。


  以下是正确嵌套标签的示例：


  ```

  <p>

  这是一个包含<em>强调</em>文本的段落。

  </p>

  ```


  以下示例展示了错误的嵌套：


  ```

  <p>

  这是一个包含<em>强调</p>文本的段落。

  </em>

  ```


  在 XHTML 文档中，没有内部内容的元素，如 `<br />` 和 `<img />`，必须自闭合。在标签名的最后一个字符和标签末尾的斜杠之间应放置一个空格。已知省略此空格会导致某些旧版浏览器（包括
  Netscape 4）出现渲染问题。


  ### 元素限制


  XHTML 对元素的嵌套确实施加了一些限制。例如，行内元素不能直接放置在 `<body>` 元素内部，而必须完全嵌套在块级元素内部。块级元素不能放置在行内元素内部。某些元素（如
  `<ins>` 和 `<del>`）根据其内部内容被视为既是块级又是行内元素。值得通过查阅你的 HTML 来注意这些元素具体是哪些。




