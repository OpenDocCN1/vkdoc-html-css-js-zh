  $left = abs($upperRightCornerY - $lowerRightCornerY) - $lowerLeftCornerY;\n```\n\
  \n`// 将文本渲染到画布上。`\n\n```php\nImageTTFText($image, $size, $angle, $left, $top, $color,\
  \ $fontFilename, $text);\n```\n\n`// 最后，我们使用 ImagePNG 函数将画布以 PNG 图像文件的形式绘制到屏幕上，`\n\
