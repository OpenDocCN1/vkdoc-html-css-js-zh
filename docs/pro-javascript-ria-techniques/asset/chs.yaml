  \n## 第 8 章 ■ 表单控件\n\n### SWFUpload 评估\n\n`SWFUpload` 组件允许您上传多个文件（尽管一次只能上传一个）到服务器端脚本，并支持随时取消上传，且无需刷新页面。它可以限制文件类型和大小。通过组件下载包中提供的一个插件，该组件能够测量文件当前的以及平均的上传速度，并允许您将这些信息传递给页面，以便让用户随时了解情况。正如您所预期的，`SWFUpload`\
  \ 不提供自己的用户界面，而是要求您（页面开发者）自行构建，并通过组件触发的 JavaScript 事件连接到该组件。简而言之，与 HTML 提供的默认文件上传控件相比，`SWFUpload`\
  \ 组件为上传多个文件或单个大文件提供了更优雅、更友好的解决方案。\n\n该组件要求最终用户的浏览器安装 Flash Player 9 或更高版本，并且启用了\
  \ JavaScript。在尝试将组件包含到页面之前，您可能希望使用第 7 章介绍的 `SWFObject` 组件，通过 JavaScript 检测是否安装了正确版本的\
  \ Flash Player。\n\n必须包含在页面中的 JavaScript 文件在压缩后大小为 19KB。向页面暴露其功能的 Flash 文件大小为 12KB。这两个文件大小对于在\
  \ Web 应用程序中使用都是非常可接受的，并且在服务器上使用 gzip 压缩将进一步减小这些文件的大小。\n\n#### TinyMCE：富文本编辑\n\n\
  HTML 自带的 `<textarea>` 元素允许用户以比标准文本输入框更自由的方式输入文本，但它只允许输入纯文本。您可能希望为用户提供一种输入带样式和格式的文本，甚至是图片的方法。例如，大多数博客发布者希望编写可以使用粗体、斜体和下划线样式强调的文本，并且能够将图像放到他们博客文章中的特定位置。幸运的是，我们可以利用第三方组件将标准的\
  \ `<textarea>` 转换为一个完全可编辑的富文本区域，其中的内容被转换为标准 XHTML，并以这种格式保存回 HTML 表单中。当稍后重新加载页面时，内容会从\
  \ XHTML 中读取并转换回富文本显示。\n\n该领域的领先组件是 `TinyMCE`，您可以在 [`tinymce.moxiecode.com/`](http://tinymce.moxiecode.com/)\
  \ 找到它。图 8-8 显示了该组件在页面上的一个示例。\n\n**图 8-8.** *使用“简单”按钮主题显示的 TinyMCE 富文本控件*\n\n###\
  \ TinyMCE 使用示例\n\n在页面中实现 `TinyMCE` 组件非常简单。请看清单 8-7 中的 HTML 代码，其中包含一个可以用富文本组件替换的\
  \ `<textarea>` 元素。\n\n**清单 8-7.** *在 HTML 页面上使用 TinyMCE 富文本编辑器*\n\n```\n<!DOCTYPE\
  \ html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
  >\n<html lang=\"en\" xml:lang=\"en\">\n<head>\n<meta http-equiv=\"Content-Type\"\
  \ content=\"text/html; charset=utf-8\" />\n<title>富文本示例</title>\n</head>\n<body>\n\
  <h1>富文本示例</h1>\n<form method=\"post\" action=\"/\" id=\"form\">\n<div>\n<!-- 创建一个\
  \ <textarea> 字段，稍后我们将通过 JavaScript 用富文本编辑器替换它 -->\n<textarea id=\"freetext\" name=\"\
  freetext\"></textarea>\n<input type=\"submit\" value=\"保存\" />\n</div>\n</form>\n\
  <!-- 将 TinyMCE 控件的 JavaScript 文件包含在其默认安装路径下 -->\n<script type=\"text/javascript\"\
  \nsrc=\"tinymce/jscripts/tiny_mce/tiny_mce.js\"></script>\n<!-- 以下脚本在实际的 Web 应用程序中理想情况下应放在外部文件中。为了简单起见，包含在页面中\
  \ -->\n<script type=\"text/javascript\">\n// 指示 TinyMCE 替换页面上所有的 <textarea> 标签为\n\
  // 富文本编辑器控件，使用默认的高级主题按钮\n// 集合，其中包含组件提供的几乎所有功能的按钮。\n// 这些功能包括粗体、斜体、下划线和删除线文本样式；图像、超链接、表格和列表支持；\n\
  // 以及支持多级撤销和重做，以防\n// 用户犯错\ntinyMCE.init({\nmode : \"textareas\",\ntheme : \"advanced\"\
  \n});\n```\n\n```\n// 如果您只想替换页面上的单个 <textarea> 实例，\n// 而不是全部，以下代码允许您通过元素的 id 属性选择要替换的具体元素。简单按钮集合\n\
  // 主题包含简单文本编辑和多级\n// 撤销的控件，而不是高级主题中令人眼花缭乱的按钮选择\n//\n// tinyMCE.init({\n// mode :\
  \ \"exact\",\n// elements: \"freetext\",\n// theme : \"simple\"\n// });\n</script>\n\
  </body>\n</html>\n```\n\n### TinyMCE 功能特性\n\n`TinyMCE` 组件的完整功能列表非常庞大。它包括插入表格、拼写检查以及从调色板中选择颜色的支持。您还可以自定义控件中按钮的显示顺序。\n\
  \n`TinyMCE` 具有插件架构，允许开发者为编辑器添加自己的按钮以提供特定行为，或自定义现有按钮的行为方式。项目主页上直接提供两个此类插件（均需支付许可费用）：\n\
  \n- **MCImageManager**：此插件提供了一个丰富的图形用户界面，用于通过与 PHP 或 ASP.NET 后端集成来选择和处理图像。它支持预览缩略图；上传新图像；删除现有图像；以及裁剪、调整大小和旋转图像。\n\
  - **MCFileManager**：此插件提供了一个用户界面，用于管理服务器上的文件，通过 PHP 或 ASP.NET 后端托管。它允许用户添加、删除和重命名文件。\n\
  \n这两个插件可以集成在一起，提供一整套图像和文件操作工具，以视觉上令人愉悦的方式向最终用户开放——非常适合内容管理系统或博客工具。\n\n### TinyMCE\
  \ 评估\n\n`TinyMCE` 提供了一种干净、不引人注目的方法，可以将 HTML 中的标准 `<textarea>` 表单标签替换为能够进行富文本编辑的自定义控件。富文本字段的内容被转换为\
  \ HTML 标签，这些标签存储在 `<textarea>` 本身中，以便与表单的其他部分一起提交。当稍后重新打开表单进行编辑时，这些 HTML 标签会在编辑器控件内重新转换为富文本。\n\
  \n`TinyMCE` 组件很大——其所有部分加起来占用 2MB 的磁盘空间。幸运的是，\n\n\n## 第 8 章：表单控件\n\n并非所有内容都需要同时加载。简单主题的初始加载大小为\
  \ 170KB，高级主题则为 218KB。同一页面上的编辑器多实例无需额外下载。\n\n显然，这些数据量很大，远远超过本书讨论的其他第三方组件的体积。开发者已意识到这一点，并为\
  \ PHP、ASP.NET、JSP 和 ColdFusion 提供了部分服务器端脚本。这些是 gzip 风格的压缩脚本，用于缩减尚未采用此压缩方式的服务器上的下载时间。\n\
  \n总而言之，TinyMCE 富文本编辑器无疑是该领域的最佳选择；但这需要付出代价：下载体积。我的建议是谨慎使用该控件，并确保服务器启用 gzip 压缩以帮助缩短加载时间。\n\
  \n### 表单验证\n\n任何关于 HTML 表单的章节如果不提及表单验证都是不完整的。所有表单验证都必须由表单提交后运行的服务器端脚本处理。然而，为了获得更好的用户体验，你应该在表单提交前通过\
  \ JavaScript 复制后端应用的相同验证规则，这样用户无需等待服务器处理脚本后再刷新页面来显示验证结果。\n\n当用户尝试提交表单时，应通过 JavaScript\
  \ 进行表单验证。逐个字段的验证可在每个字段失去焦点时执行。\n\n通过挂钩页面`<form>`标签的`submit`事件，你可以指定验证代码，检查必填字段、特定格式字段等，并在验证失败时阻止事件完成。如果验证成功，则应允许事件继续执行，并将表单提交给服务器。\n\
  \n> **注意**：务必使用表单的`submit`事件，而不是连接到表单提交按钮的`click`事件。这是因为有多种方式可以提交表单，包括按回车键。此类情况不会被`click`事件捕获，因此坚持使用表单的`submit`事件，这样会更安全。\n\
  \n如果表单包含必填和非必填字段的混合，请务必标记所有必填字段。如果表单上的所有字段都是必填的，则有理由不明确指出这一点。在许多情况下，在字段名称旁边加一个星号（`*`），并在表单上方用一行文字说明标记此方式的字段为必填，就足以标识必填字段了。\n\
  \n最后，如果表单验证失败，你应该决定验证错误消息在页面上的显示方式：要么在一个地方（表单顶部或底部）列出所有错误，要么在表单上每个验证失败的字段旁边显示。无论哪种情况，在构建这些消息的\
  \ HTML 代码时，你应该为每条消息使用`<label>`标签，并使用其`for`属性将该消息关联到相关的表单字段。\n\n这不仅有利于可访问性，还意味着用户可以简单地点击错误消息，直接跳转到与之相关的字段，这是`<label>`标签常见的浏览器行为。\n\
  \n### 总结\n\n本章首先演示了自定义现有 HTML 表单控件以适配你自己 Web 应用程序设计和布局的创新方法。然后深入探讨了构建新的用户界面来替换现有\
  \ HTML 表单字段，以提供更好的用户体验。接着，介绍了一系列基于 JavaScript 和 Flash 的第三方插件，这些插件提供了 HTML 默认不支持的额外功能。现在，你应该能够按照自己的意愿设计\
  \ Web 应用程序中的表单，并在现有控件无法为你希望收集的数据类型提供合适用户体验时替换它们。\n\n不要害怕为最终用户更乐意使用的表单控件提出新想法。如果你编写了任何代码，请尝试将其打包为可重用的代码，并提供给\
  \ Web 开发社区的其他成员，这样我们都可以从彼此的灵感和创造力中受益。\n\n在下一章中，我们将探讨如何为 Web 应用程序编写额外代码，以应对浏览器与 Web\
  \ 服务器之间的连接中断或电源故障。你将学习如何在将数据发送到服务器之前，在用户本地机器上存储数据。\n\n---\n\n## 第 9 章：离线存储——当网络中断时\n\
  \n我们都经历过这种情况。你花了 20 分钟在 Web 邮件客户端中完善一封重要的电子邮件，终于准备发送了——然后砰的一声！——它发送不出去了。你再试一次，仍然不行。然后你意识到网络连接已断开，无法再访问互联网。你该怎么办？此时，我们中的许多人会尝试将文本复制粘贴到计算机本地存储的文档中，这样相对安全。如果必须重启浏览器，或者更糟的是系统崩溃，你应该能够找回它。\n\
  \n这是大多数 RIA 的问题所在：它们的可靠性完全取决于其所运行环境的网络连接和浏览器的可靠性。如果由于某种原因，浏览器和服务器之间的网络连接不可用，我们需要某种方式将重要信息存储在用户计算机或设备上。\n\
  \n在本章中，我们将研究在不同浏览器中可用于本地存储内容的方法。你将看到如何在自己的 RIA 中有效组合使用这些方法来保存数据、回读数据和删除数据，并确保跨浏览器支持。\n\
  \n### 使用 Cookie 存储数据\n\n实际上，自 Web 浏览器早期以来，开发人员就可以通过 cookie 的形式进行本地数据存储。cookie 是存储在用户计算机上并与特定网站域名相关联的小型文本文件，大小上限为\
  \ 4KB。这增加了一层安全性，因为一个站点只能访问与其域名关联的 cookie。\n\n在大多数 Web 浏览器中，cookie 可以由 Web 服务器设置，也可以通过\
  \ JavaScript 设置。它们通常用于存储小量数据，例如用户登录某个网站的 ID 或用户名，以便用户自动登录。\n\n浏览器内部管理 cookie，并且通常通过其设置或偏好窗口提供方法来让用户查看和删除\
  \ cookie。用户也可以完全禁用 cookie。然而，实际上，由于如此多的网站依赖 cookie，包括所有需要用户登录的网站，完全禁用 cookie 的情况很少发生。\n\
  \n### 创建 Cookie\n\n每个 cookie 在创建时都会被赋予一个名称，并且任何必要的文本值都存储在其中。当需要该 cookie 时，会根据其名称进行查找并返回值，前提是与该\
  \ cookie 关联的域名与执行脚本的网站域名匹配。\n\n每个 cookie 都有一个`expiry`（过期）日期属性，用于定义 cookie 应存储多长时间。\n\
  \n\n\n在浏览器自动清除之前，该数据被允许存在。对于许多应用程序，Cookie 的过期时间会被设置为创建时间之后的很多年，这样数据就能保留在用户的机器上，而无需重新创建。\n\
  \n对于某些应用程序，可能需要将值设置为仅在用户访问网站期间有效。这种类型的 Cookie 被称为*会话 Cookie*，因为一旦浏览器会话结束，该 Cookie\
  \ 就会被删除。如果没有为 Cookie 分配过期日期，则会创建一个会话 Cookie，这意味着它只会在当前浏览会话期间存在。将 Cookie 的过期日期设置为一个已经过去的日期，将会从浏览器中永久删除该\
  \ Cookie。\n\n正如我之前提到的，你必须指定与 Cookie 关联的域名，以提供一定的安全性。托管在其他域名上的网站都不应该能够访问该 Cookie。除此之外，你还可以指定一个`path`值，那么该\
  \ Cookie 将仅在你的网站结构中该目录内有效。通常，这个值被设置为指向网站的根目录，以便所有页面都能访问该 Cookie。但是，你可能决定你的 Cookie\
  \ 仅在你网站的某个特定部分相关；在这种情况下，你需要更改`path`值以指向该目录。\n\n清单 9-1 展示了如何通过 JavaScript 设置 Cookie、读回其值以及删除它。\n\
  \n将代码添加到你的`$`JavaScript 库中（从第 2 章开始），放在实例化该库的文件的最后一行之前。\n\n**清单 9-1.** *设置和读取 Cookie\
  \ 值*\n\n```javascript\n// 在 $ 库中为存储相关代码创建一个新的命名空间\n\n$.prototype.Storage = {}\n\n\
  // 创建一个 Cookies 命名空间，用于存储与 Cookie 相关的存储方法\n\n$.prototype.Storage.Cookies = {\n\n\
  // set 方法在本地机器上设置一个具有给定名称和值的 Cookie\n\nset: function(input) {\n\n// 期望输入一个对象字面量，包含\
  \ name、value、expiry 和 path 属性\n\nvar name = input.name || \"\";\n\nvar value = input.value\
  \ || \"\";\n\n// 如果提供了过期日期，则获取其字符串值用于设置 Cookie。\n// 如果没有提供过期日期，则默认设置为 10 年后\n\n\
  var tenYearsAhead = new Date();\n\ntenYearsAhead.setFullYear(tenYearsAhead.getFullYear()\
  \ + 10);\n\n// 使用输入的过期日期，或默认设置为未来 10 年的日期\n\nvar expiry = (input.expiry ? input.expiry.toUTCString()\
  \ : \n\ntenYearsAhead.toUTCString());\n\n// 如果没有给出路径，则默认设置为站点根目录\n\nvar path = input.path\
  \ || \"/\";\n\n// Cookie 以特殊格式的字符串进行设置。域名将自动分配给正在访问的站点的当前域名\n\nvar cookieFormat\
  \ = \"{name}={value}; expires={expiry}; path={path}\";\n\n// 通过将格式化字符串赋值给 document.cookie\
  \ 来创建新 Cookie\n\ndocument.cookie = $.Utils.replaceText(cookieFormat, {\n\n// 使用\
  \ escape 方法确保非字母数字字符被编码，并且不会破坏生成的格式化 Cookie 字符串\n\nname: escape(name),\n\nvalue:\
  \ escape(value),\n\nexpiry: expiryDate,\n\npath: path\n\n});\n\n},\n\n// get 方法通过名称检索之前存储的\
  \ Cookie 值\n\nget: function(name) {\n\n// document.cookie 是一个字符串，自动包含当前正在访问的站点域和路径下所有有效的\
  \ Cookie\n\n// 使用针对 document.cookie 运行的正则表达式定位 Cookie\n\nvar cookieFinder = new\
  \ RegExp(\"(^|;) ?\" + name + \"=([^;]*)(;|$)\");\n\nvar cookie = document.cookie.match(cookieFinder);\n\
  \nvar value = \"\";\n\nif (cookie) {\n\n// 如果找到了 Cookie，则使用正则表达式找到的值\n\nvalue =\
  \ unescape(cookie[2]);\n\n}\n\nreturn value;\n\n},\n\n// remove 方法通过名称删除现有的 Cookie\n\
  \nremove: function(name) {\n\n// 通过将过期日期重置为当前时间之前的任何时间来删除 Cookie\n\nvar expiryDate\
  \ = new Date();\n\n```\n\n\n\n// 将时钟回拨\n\n`expiryDate.setTime(expiryDate.getTime()\
  \ - 1);`\n\n// 让先前定义的 set 方法重置 cookie 的过期时间，\n\n// 从而删除该 cookie\n\n```\nthis.set({\n\
  \  name: escape(name),\n  expiry: expiryDate\n});\n```\n\n`清单 9-2` 演示了如何在页面自定义的\
  \ JavaScript 代码中使用`清单 9-1`创建的方法，来创建、查找和删除 cookie。\n\n**清单 9-2.** 使用 `$` 库创建、查找和删除\
  \ Cookie\n\n```\n// 创建一个默认将在 10 年后过期的新 cookie\n$.Storage.Cookies.set({\n  name:\
  \ \"email\",\n  value: \"me@denodell.com\"\n});\n\n// 输出我们刚才创建的名为 \"email\" 的 cookie\
  \ 的值。\n// 即使浏览器重启，数据仍会保留\nalert($.Storage.Cookies.get(\"email\"));\n\n// 删除 \"email\"\
  \ cookie\n$.Storage.Cookies.remove(\"email\");\n\n// 输出空字符串，因为该 cookie 已不存在\nalert($.Storage.Cookies.get(\"\
  email\"));\n```\n\n### Cookie 的缺点\n\nCookie 提供了一种简单、跨浏览器的方式，可在浏览器中存储少量基于文本的数据以供后续检索。不过，它们也有缺点。\n\
  \n当浏览器请求位于特定域名下的页面或文件时，它也会将与该域名关联的完整 cookie 内容随请求一并发送。\n\n这是设计使然，它允许网页服务器读取用户机器上存储的\
  \ cookie，并根据其值个性化响应内容。你在 cookie 中存储的数据越多，这些请求的体积就越大，直到达到 4KB 的最大限制。这可能听起来不多，但请记住，无论所请求文件的类型是什么，cookie\
  \ 都会被发送。例如，如果你的页面由一个 HTML 文件、两个 CSS 文件、两个 JavaScript 文件和二十张图片组成，那么每个文件请求都会将 cookie\
  \ 数据发送到服务器，这意味着额外发送给服务器的数据量最多可达 100KB（25 个请求 × 4KB cookie 大小）。\n\n你可能会想，为什么这种机制会存在，因为它可能会导致大量数据无缘无故地被发送到服务器。不幸的是，它是目前唯一有保证的方法，以确保当服务器希望利用这些\
  \ cookie 数据来修改图片、脚本、HTML 页面或其他文件时，服务器能够获取到该 cookie。这绝非什么优雅的解决方案，但却是最简便的方法，也是 HTTP\
  \ 规范在加入 cookie 支持时所采用的方式。\n\n还要记住，许多用户使用的是异步连接，这意味着他们从浏览器到服务器的上传速度远低于从服务器到浏览器的下载速度。因此，传输这些额外\
  \ cookie 数据所花费的时间可能会对性能产生重大影响。在第 4 章中，我解释了一种解决此问题的变通方案，即将你的图片和外部资源托管在与 HTML 文件所在域名不同的第二个域名下。尽管如此，当你考虑到这里的主要目标是本地存储数据，以防不可预见的网络连接中断和不幸的浏览器崩溃时，每次\
  \ HTML 请求都发送 cookie 数据似乎还是有些多此一举。\n\n### 使用 Internet Explorer 的数据存储\n\n微软在其 IE 浏览器中（从版本\
  \ 5 开始）引入了自己的方法，允许通过 JavaScript Web 应用将内容存储在用户机器上，这种方式使用了所谓的 `userData` 数据存储。此实现涉及在特定类型的\
  \ DOM 元素上使用属性节点来存储数据，通过添加和移除属性来添加和移除数据。数据通过在 DOM 元素上调用 `save()` 方法来持久化，并通过 `load()`\
  \ 方法进行回读。这些元素是通过 DOM 元素关联的、IE 特有的 `userData` 行为添加的。数据存储本身在 IE 内部实际上是以 XML 为基础结构表示的。\n\
  \n\n\n微软对您站点中每个页面施加了 64KB 的基本存储限制，且每个域最多可存储 640KB 数据。其安全限制与 Cookie 存储类似：任何域都无法访问其他域的数据，并且可以通过在数据存储中添加可选的过期时间来在指定时间后移除数据。然而，与\
  \ Cookie 不同，过期时间适用于整个数据存储，而非单条数据。此外，不存在仅持续当前会话时长的数据存储概念。依我之见，应忽略过期时间选项，让浏览器或用户手动删除数据。\n\
  \n清单 9-3 展示了如何在 IE 中使用 `userData` 机制来获取、设置和删除数据。\n\n请将此代码添加到您的 `$` JavaScript 库中，位于文件末尾库被实例化之前的位置。\n\
  \n**清单 9-3.** *使用 Internet Explorer 的 `userData` 机制设置、获取和删除数据*\n\n```javascript\n\
  // 添加一个 UserData 命名空间，用于存放微软 userData 特有的方法\n\n$.prototype.Storage.UserData = {\n\
  \n    // 引用一个用于存储数据的元素\n\n    storageElement:null,\n\n    // 通过使用不同的名称，数据可以存储在不同的数据存储中。我们\n\
  \    // 希望所有数据都在同一个地方，因此选择一个名称并固定使用它\n    dataStore: \"data- store\",\n\n    //\
  \ 在使用任何数据之前，我们需要初始化 DOM 元素\n    initialize: function() {\n        // 数据存储在 DOM 元素内，因此我们来创建一个以供使用\n\
  \        this.storageElement = $.Elements.create(\"span\");\n\n        // behavior\
  \ 属性使 DOM 元素能够加载\n        // 数据并将其保存到数据存储中\n        this.storageElement.addBehavior('#default#userdata');\n\
  \n        // 我们不希望此元素在页面上可见，因此将其隐藏\n        this.storageElement.style.display =\
  \ 'none';\n\n        // 将新的 DOM 元素添加到页面末尾\n        document.body.appendChild(this.storageElement);\n\
  \n        // 从数据存储中加载任何先前存储的数据，将数据填充到\n        // 元素的属性中\n        this.storageElement.load(this.dataStore);\n\
  \    },\n\n    // set 方法将给定名称的数据值保存到数据存储中\n    set: function(input) {\n        //\
  \ 期望输入为一个对象字面量，包含 name 和 value\n        var name = input.name || \"\";\n       \
  \ var value = input.value || \"\";\n\n        // 将数据名称和值保存到 DOM 元素\n        this.storageElement.setAttribute(name,\
  \ value);\n\n        // 将 DOM 元素中的当前数据提交到数据存储中\n        this.storageElement.save(this.dataStore);\n\
  \    },\n\n    // get 方法从数据存储中返回给定属性名称的先前存储的值\n    get: function(name) {\n     \
  \   // 返回给定名称的属性值，如果不存在则返回空字符串\n        return this.storageElement.getAttribute(name)\
  \ || \"\";\n    },\n\n    // remove 方法从数据存储中永久删除数据名称及其关联值\n    remove: function(name)\
  \ {\n        // 从用于存储数据的 DOM 元素中移除给定名称的属性\n        this.storageElement.removeAttribute(name);\n\
  \n        // 提交对数据存储所做的更改，以便指定数据被\n        // 永久删除\n        this.storageElement.save(this.dataStore);\n\
  \    }\n}\n```\n\n清单 9-4 展示了如何使用 JavaScript 以及在清单 9-3 中创建的方法在您自己的页面中创建、查找和删除数据。\n\
  \n**清单 9-4.** *在 Internet Explorer 中创建、查找和删除 `userData`*\n\n```javascript\n// 初始化\
  \ userData 存储\n$.Storage.UserData.initialize();\n\n// 将电子邮件地址保存到数据存储中\n$.Storage.UserData.set({\n\
  \    name: \"email\",\n    value: \"me@denodell.com\"\n});\n\n// 输出我们之前创建的 \"email\"\
  \ 值。\n// 浏览器重启后，数据仍会存在\nalert($.Storage.UserData.get(\"email\"));\n\n// 从数据存储中永久删除\
  \ \"email\" 数据值\n$.Storage.UserData.remove(\"email\");\n\n// 由于数据已不存在，因此输出空字符串\n\
  alert($.Storage.UserData.get(\"email\"));\n```\n\n\n\n"
- "# 第 9 章 ■ 离线存储——当灯火熄灭时\n\n`userData`技术提供了一种实用机制，用于离线存储比使用 Cookie 更大容量的文本数据。与 Cookie\
  \ 不同，这些数据不会随服务器请求传递，从而实现了永久数据存储的优势且无需额外开销。IE 5 及以上版本支持该技术，不过 IE 8 现已支持一种基于 WHATWG\
  \ 本地存储 API 的新技术，可提供更大的存储潜力。\n\n## 数据存储 API 介绍\n\n如第 7 章所述，WHATWG 组织一直积极推动 HTML 5\
  \ 标准的制定——这是与富互联网应用构建相关的语言更新版本。该标准的部分功能已开始被最新浏览器版本支持。我们关注的是其中一组用于实现离线存储的 API，可通过\
  \ JavaScript 访问。接下来逐一介绍各数据存储 API。\n\n### 本地存储 API\n\n第一个 API 称为本地存储。默认情况下，多数浏览器为各站点分配\
  \ 5MB 的本地存储空间，不过用户可在各支持浏览器的设置中调整此配置。这比使用 Cookie 或 IE 特有的`userData`机制可用的存储空间要大得多。与这两类方法相同，本地存储\
  \ API 会将存储数据与当前网站运行的域名关联，为保存数据提供必需的安全保障。\n\n使用该 API 时，无法像 Cookie 那样限制同一网站不同目录下的数据访问权限，更重要的是，无法为数据设置过期时间。这意味着数据存续期将由浏览器及其支持的用户设置控制，最终用户可据此管理以自己名义保存的数据。与目前讨论的所有方法一样，数据仅能以字符串形式存储。\n\
  \n截至撰写本文时，IE 8 及以上版本、Safari 3.1 及以上版本、Google Chrome 2 及以上版本、Firefox 3.5 及以上版本均支持本地存储\
  \ API。\n\n清单 9-5 展示了在 JavaScript 库中实现本地存储 API 的简洁性。请在文件末尾实例化库之前，将这段代码添加到库中。\n\n\
  **清单 9-5.** *使用本地存储 API 设置、获取和删除数据*\n\n```\n// 添加 LocalStorage 命名空间以集中管理本地存储 API\
  \ 代码\n$.prototype.Storage.LocalStorage = {\n\n  // set 方法通过本地存储 API 存储指定名称的值\n \
  \ set: function(input) {\n\n    // 期望输入对象字面量，包含要设置的名称和值\n    var name = input.name\
  \ || \"\";\n    var value = input.value || \"\";\n\n    // 使用顶层 localStorage 对象保存数据\n\
  \    localStorage.setItem(name, value);\n  },\n\n  // get 方法通过名称检索之前存储的值\n  get:\
  \ function(name) {\n\n    // 如果请求的项目不存在则返回空字符串；否则\n    // 从 localStorage 对象获取值\n\
  \    return localStorage.getItem(name) || \"\";\n  },\n\n  // remove 方法从 localStorage\
  \ 对象中删除之前存储的值\n  remove: function(name) {\n\n    // 从 localStorage 中移除项目\n    localStorage.removeItem(name);\n\
  \  }\n}\n```\n\n清单 9-6 展示了如何在页面 JavaScript 中使用清单 9-5 定义的方法，在本地计算机上存储、检索和删除数据。\n\n\
  **清单 9-6.** *使用本地存储 API 存储、检索和移除数据*\n\n```\n// 保存电子邮件地址\n$.Storage.LocalStorage.set({\n\
  \  name: \"email\",\n  value: \"me@denodell.com\"\n});\n\n// 输出之前保存的\"email\"值\n\
  // 浏览器重启后数据仍然存在\nalert($.Storage.LocalStorage.get(\"email\"));\n\n// 永久删除\"email\"\
  数据值\n$.Storage.LocalStorage.remove(\"email\");\n\n// 由于\"email\"数据已不存在，输出空字符串\n\
  ```\n\n\n\n`alert($.Storage.LocalStorage.get(\"email\"));`\n\n### Mozilla 全局存储 API\n\
  \n在 WHATWG 定义本地存储 API 之前，Mozilla 开发者为了实现相同目的——在用户本地计算机或设备上存储数据，曾自行实现了一个类似但明显不同的存储\
  \ API。他们将其称为 *DOM 存储*或*全局存储*，该 API 提供的方法在存储、检索和删除数据的方式上与本地存储 API 几乎相同。其默认数据大小限制同样是\
  \ 5MB。该技术与本地存储 API 的唯一实现差异在于：全局存储对象必须指定数据的存储域，尽管实际上该域必须与当前代码运行的域相同。\n\n**316**\n\
  第 9 章■离线存储——当灯光熄灭时\n\n`代码清单 9-7` 演示了如何使用 Mozilla 全局存储 API 在本地计算机或设备上存储、检索和删除数据。请将此代码添加到您的\
  \ `$` JavaScript 库中（位于库文件末尾实例化之前的位置）。\n\n**代码清单 9-7.** *使用全局存储 API 设置、获取和删除数据*\n\
  \n```\n// 添加 GlobalStorage 命名空间以包含所有全局存储 API 相关方法\n\n$.prototype.Storage.GlobalStorage\
  \ = {\n\n  dataStore: null,\n\n  // 若浏览器支持全局存储 API，initialize 方法用于定位要使用的数据存储\n\n\
  \  initialize: function() {\n\n    // 数据存储本身是 globalStorage 数组的一个索引，该索引始终为当前站点域名\n\
  \n    if (globalStorage) {\n\n      this.dataStore = globalStorage[location.host];\n\
  \n    }\n\n  },\n\n  // set 方法将给定名称的值存储到全局存储 API 中\n\n  set: function(input) {\n\
  \n    // 期望输入为对象字面量，包含要设置的 name 和 value\n\n    var name = input.name || \"\";\n\n\
  \    var value = input.value || \"\";\n\n    // 使用 globalStorage 提供的数据存储保存数据\n\n\
  \    this.dataStore.setItem(name, value);\n\n  },\n\n  // get 方法通过名称检索之前存储的值\n\n\
  \  get: function(name) {\n\n    // 若请求的项目不存在则返回空字符串；否则从数据存储中定位\n\n    return this.dataStore.getItem(name)\
  \ || \"\";\n\n  },\n\n  // remove 方法通过名称从数据存储中永久删除之前存储的值\n\n  remove: function(name)\
  \ {\n\n    // 使用全局存储 API 的 removeItem 方法从数据存储中删除项目\n\n    this.dataStore.removeItem(name);\n\
  \n  }\n\n}\n```\n\n**317**\n第 9 章■离线存储——当灯光熄灭时\n\n`代码清单 9-8` 演示了如何在您自己的页面中通过 JavaScript\
  \ 使用这些方法，通过全局存储 API 在本地计算机或设备上存储、检索和删除数据。\n\n**代码清单 9-8.** *使用全局存储 API 存储、检索和删除数据*\n\
  \n```\n// 初始化 GlobalStorage 以供使用\n\n$.Storage.GlobalStorage.initialize();\n\n//\
  \ 保存一个电子邮件地址\n\n$.Storage.GlobalStorage.set({\n\n  name: \"email\",\n\n  value:\
  \ \"me@denodell.com\"\n\n});\n\n// 输出我们之前创建的 \"email\" 值。\n// 即使浏览器重启，数据依然存在\n\n\
  alert($.Storage.GlobalStorage.get(\"email\"));\n\n// 永久删除 \"email\" 数据值\n\n$.Storage.GlobalStorage.remove(\"\
  email\");\n\n// 由于 \"email\" 数据已不存在，输出空字符串\n\nalert($.Storage.GlobalStorage.get(\"\
  email\"));\n```\n\n### 客户端数据库存储 API\n\n新兴的 HTML 5 推荐标准中包含第二个存储实现 API，其功能比我们之前探讨的本地存储\
  \ API 更加完善。客户端数据库存储 API 允许 Web 开发者在浏览器内实现的 SQLite 数据库中存储数据。\n\n**注意** SQLite 是一个开源软件库，实现了一个无需服务器或任何预配置即可使用的数据库。使用标准结构化查询语言\
  \ (SQL) 命令与数据库通信，根据需要保存和检索数据。请参阅项目网站 (http://www.sqlite.org/lang.html)。\n\n\n\n"
- "# SQLite 离线数据存储\n\n有关 SQLite 支持的 SQL 命令的完整列表，请参阅 [sqlite.org/lang.html](http://www.sqlite.org/lang.html)。\n\
  \n通过使用数据库来存储离线数据，开发者可以在数据库表中表示数据结构，而不是通过文本字符串——而文本字符串是目前唯一跨浏览器可行的数据存储选项。数据库还支持存储二进制数据（例如图像文件），为可能需要存储和随时检索任意类型数据的\
  \ Web 应用提供了更灵活的解决方案。\n\n要让所有浏览器都支持通过 JavaScript 访问本地数据库这一标准，还需要一些时间。目前，该 API 和数据库系统仅在桌面版\
  \ Safari 3.1 以及 iPhone 上的 Safari 浏览器中可用。当规范更加完善后，其他浏览器也会跟进。\n\n**318**\n\n## 第 9\
  \ 章 ■ 离线存储——当灯光熄灭时\n\n出于安全考虑，每个数据库都被锁定到创建它的域名。每个站点可以根据需要创建任意数量的数据库，并包含任意数量的表和行。目前，在\
  \ Safari 3.1 中，每个域名的默认存储空间为 5MB。通过浏览器偏好设置，用户可以为每个域名或全局（适用于所有站点）选择本地数据库大小，最小 1MB，最大\
  \ 500MB。\n\n作为性能优化措施，对数据库执行的事务和操作使用 SQL 语言编写，并且异步执行。命令执行完成后，会传递一个回调函数来执行。在此期间，其余代码可以继续执行，这意味着大型复杂的数据库事务不会阻止浏览器和\
  \ Web 应用正常响应用户的需求。\n\n`Listing 9-9` 演示了如何使用客户端数据库存储 API 在本地机器的 SQLite 数据库中获取、设置和删除文本值。将此代码添加到你的\
  \ JavaScript 库中，在库实例化之前。请注意，与客户端数据库存储 API 所能实现的所有功能相比，这只是一个相当有限的用法。\n\n**`Listing\
  \ 9-9`.** *使用数据库存储 API 获取、设置和删除数据*\n\n```\n// 添加一个 DBStorage 命名空间来包含所有客户端数据库存储相关方法\n\
  \n$.prototype.Storage.DBStorage = {\n\n    // 每个域名可以有多个数据库，但在此示例中我们定义一个供整个应用使用\n\
  \n    databaseName: \"data_store\",\n\n    databaseDesc: \"Data store\",\n\n   \
  \ // 指定我们使用的 SQLite 数据库版本，以防未来版本更改方法\n\n    sqlLiteDBVersion: \"1.0\",\n\n    //\
  \ 5MB 存储空间 = 5120 字节。这是 SQLite 数据库的默认最大大小\n\n    FIVE_MB: 5120,\n\n    // 定义一个用于存储数据的数据库表名\n\
  \n    tableName: \"data-store\",\n\n    // 定义一个属性来存储数据库引用\n\n    database: null,\n\
  \n    // initialize 方法在数据库中创建表来存储名称和值数据（如果表不存在）\n\n    // name 成为主键\n\n    initialize:\
  \ function() {\n\n        // 打开 SQLite 数据库\n\n        this.database = openDatabase(this.databaseName,\n\
  \n            this.sqlLiteDBVersion, this.databaseDesc, this.FIVE_MB);\n\n     \
  \   // 构建用于在数据库中创建表的 SQL 命令\n\n        var command = \"CREATE TABLE IF NOT EXISTS\
  \ {tableName} (name \" +\n\n            \"TEXT UNIQUE NOT NULL PRIMARY KEY, value\
  \ TEXT NOT NULL)\";\n\n        command = $.Utils.replaceText(command, {\n\n    \
  \        tableName: this.tableName\n\n        });\n\n        // 执行 SQL 命令\n\n  \
  \      this.execute(command);\n\n    },\n\n    // execute 方法对数据库执行给定的 SQL 命令，\n\n\
  \    // 在命令完成后执行可选的回调函数，并将事务结果传递给回调函数\n\n    execute: function(command, callback)\
  \ {\n\n        callback = callback || function() {};\n\n    }\n```\n\n**319**\n\n\
  \n\n```javascript\n// 执行所提供的 SQL 命令，然后执行回调函数\nthis.database.transaction(function(db)\
  \ {\n    db.executeSql(command, [], callback);\n});\n},\n\n// get 方法根据名称键在数据库中执行查找，并将找到的值（若有）传入所提供的回调函数\n\
  get: function(name, callback) {\n    // 生成通过名称在数据库中定位值的命令\n    var command = \"\
  SELECT value FROM {tableName} WHERE name = {name}\";\n    command = $.Utils.replaceText(command,\
  \ {\n        tableName: this.tableName,\n        name: name\n    });\n\n    // 执行\
  \ SQL 命令\n    this.execute(command, function(db, result) {\n        var value =\
  \ \"\";\n\n        // 在返回的 SQL 数据的第一行中定位值\n        if (result.rows.length > 0) {\n\
  \            value = result.rows.item(0)['value'];\n        }\n\n        // 执行回调方法，传入找到的值（若有）\n\
  \        callback(value);\n    });\n\n    // 返回空值，以防有调用方法期望从此方法获取返回值——按理说不应有代码期望此返回值，\n\
  \    // 但为保险起见，我们在此提供返回值\n    return null;\n},\n\n// set 方法将值按名称存储到数据库中\nset: function(input)\
  \ {\n    // 期望输入为一个对象字面量，包含要设置的名称和值\n    var name = input.name || \"\";\n    var\
  \ value = input.value || \"\";\n    var self = this;\n\n    // 检查数据库中是否已存在该名称对应的值\n\
  \    this.get(name, function(value) {\n        // 默认情况下，我们将值插入数据库，因此指定执行插入操作的命令\n\
  \        var command = \"INSERT INTO {tableName} (name, value) VALUES ➥ ({name},\
  \ {value})\";\n\n        // 如果数据库中已存在该名称对应的值，则改为执行 SQL 更新命令\n        if (value !=\
  \ \"\") {\n            command = \"UPDATE {tableName} SET value = {value} WHERE\
  \ ➥ name = {name}\";\n        }\n\n        command = $.Utils.replaceText(command,\
  \ {\n            tableName: self.tableName,\n            name: name,\n         \
  \   value: value\n        });\n\n        // 执行 SQL 命令，将数据保存到数据库中\n        this.execute(command);\n\
  \    });\n},\n\n// remove 方法从数据库中删除名称及对应的值\nremove: function(name) {\n    // 生成从数据库中删除值的\
  \ SQL 命令\n    var command = \"DELETE FROM {tableName} WHERE name = {name}\";\n \
  \   command = $.Utils.replaceText(command, {\n        tableName: this.tableName,\n\
  \        name: name\n    });\n\n    // 执行命令，从数据库中移除该条目\n    this.execute(command);\n\
  }\n}\n```\n\n清单 9-10 展示了如何在页面中利用 JavaScript，通过位于用户本地计算机或存储设备上的 SQLite 数据库来存储、检索和删除文本值。\n\
  \n请注意，在检索数据时，你需要使用回调函数。由于数据库是异步操作的，要获知数据何时已被定位，唯一的方法就是告诉该方法在数据找到后应该执行哪些代码。\n\n**清单\
  \ 9-10.** *使用数据库存储 API 设置、获取和删除数据*\n\n```javascript\n// 初始化客户端数据库\n$.Storage.DBStorage.initialize();\n\
  \n// 保存一个电子邮件地址\n$.Storage.DBStorage.set({\n    name: \"email\",\n    value: \"\
  me@denodell.com\"\n});\n\n// 输出我们之前创建的\"email\"值。\n// 浏览器重启后，该数据仍将保留\n$.Storage.DBStorage.get(\"\
  email\", function(value) {\n    alert(value);\n});\n\n// 永久删除\"email\"数据值\n$.Storage.DBStorage.remove(\"\
  email\");\n\n// 由于\"email\"数据已不复存在，因此输出空字符串\n$.Storage.DBStorage.get(\"email\",\
  \ function(value) {\n    alert(value);\n});\n```\n\n### 使用 Flash 共享对象存储数据\n\n如果你的最终用户已安装\
  \ Adobe Flash Player 插件（版本 8 或更高），则可以使用另一种数据存储技术。通过一个特别构建的影片文件，你可以通过简单的 API 向 JavaScript\
  \ 公开所谓的*Flash 本地共享对象*（通常称为*Flash cookie*），以便 JavaScript 在本地存储数据。\n\n\n- 与浏览器 cookie\
  \ 不同，本地共享对象（local shared objects）允许每个域在用户机器上存储 100KB 的数据，并且这些值不会随 HTTP 请求发送到服务器。用户可以更改此存储量，尽管许多人选择保留默认设置。正如您所料，作为一种安全措施，从一个域设置的数据无法被任何其他域访问。\n\
  \n我已经构建了必要的 Flash 影片文件，该文件可从本书的详细信息页面（位于 `Apress` 网站（`http://www.apress.com/`））以及本书其余源代码一起获取，也可从我自己的网站（`http://www.denodell.com/`）下载，以供您在自己的\
  \ RIA 中使用。请使用第 7 章介绍的 `SWFObject` 组件将 Flash 影片放置在您的页面上。\n\n该 Flash 影片文件公开了三个方法，这些方法可以针对页面上的影片实例进行调用：`get()`、`set()`\
  \ 和 `remove()`。清单 9-11 显示了要添加到您的 `$` JavaScript 库中以使用 Flash cookie 的代码。将代码添加到 `$`\
  \ 库文件的末尾，在其实例化之前。\n\n**清单 9-11.** *使用 Flash 本地共享对象获取、设置和删除数据*\n\n```javascript\n\
  // 创建一个 Flash 命名空间，用于包含所有与 Flash cookie 相关的存储方法\n$.prototype.Storage.Flash = {\n\
  \n    // 用于存储页面上 Flash 影片元素引用的对象\n    flashComponent: null,\n\n    // 初始化方法将内部的\
  \ flashComponent 对象设置为从页面传入的对象\n    // 使用 SWFObject 来加载页面上的影片。\n    // 第 7 章展示了如何使用\
  \ SWFObject 嵌入 Flash 影片\n    initialize: function(flashComponent) {\n        this.flashComponent\
  \ = flashComponent;\n    },\n\n    // set 方法通过名称将一个值存储到 Flash 共享对象中\n    set: function(input)\
  \ {\n        // 期望输入一个对象字面量，包含要设置的名称和值\n        var name = input.name || \"\";\n\
  \        var value = input.value || \"\";\n        // 使用 Flash 影片对象内的 set 方法保存数据\n\
  \        this.flashComponent.set(name, value);\n    },\n\n    // get 方法通过名称检索先前存储的值\n\
  \    get: function(name) {\n        // 如果请求的值不存在，则返回空字符串\n        return this.flashComponent.get(name)\
  \ || \"\";\n    },\n\n    // remove 方法从 Flash 共享对象中删除给定名称的值\n    remove: function(name)\
  \ {\n        this.flashComponent.remove(name);\n    }\n}\n```\n\n清单 9-12 显示了如何使用清单\
  \ 9-11 中的方法，通过 JavaScript 使用 Flash 本地共享对象在本地计算机或设备上存储、检索和删除数据。\n\n**清单 9-12.** *使用\
  \ Flash 本地共享对象存储、检索和删除数据*\n\n```javascript\n// 通过引用页面上包含 Flash 存储文件的 DOM 元素来初始化\
  \ Flash 共享对象\n// 您可以在我网站上找到此文件：[`www.denodell.com/`](http://www.denodell.com/)\n\
  $.Storage.Flash.initialize(document.getElementById(\"flash-object\"));\n\n// 保存一个电子邮件地址\n\
  $.Storage.Flash.set({\n    name: \"email\",\n    value: \"me@denodell.com\"\n});\n\
  \n// 输出我们之前创建的 \"email\" 值。\n// 浏览器重启后，数据仍然存在\nalert($.Storage.Flash.get(\"email\"\
  ));\n\n// 永久删除 \"email\" 数据值\n$.Storage.Flash.remove(\"email\");\n\n// 输出空字符串，因为\
  \ \"email\" 数据不再存在\nalert($.Storage.Flash.get(\"email\"));\n```\n\n### 创建跨浏览器本地数据存储\
  \ API\n\n到目前为止，在本章中，您已经了解了如何使用几种不同的技术从本地用户计算机或设备存储和检索文本字符串。每种技术在允许存储的数据量以及不同浏览器对其支持级别方面各不相同。为了在您的\
  \ RIA 中处理本地存储，您可以设置一个用于跨浏览器支持的单一 API，该 API 包含所有可用的技术，并使用其中最佳的一种。\n\n\n\n## 第 9 章：离线存储——当网络中断时\n\
  \n首先，让我们按优先顺序整理不同的存储技术，从存储空间最大且最符合标准实践的技术开始，到存储空间最小且最不推荐的技术结束：\n\n- **本地存储 API**：推荐使用，因为它已成为既定标准，使用简单，且在最新浏览器版本中获得了相当广泛的支持。默认提供\
  \ 5MB 存储空间。\n- **客户端数据库存储 API**：一项新兴标准，由于其通用性，若非目前规范仍存在较大变动风险，本应是最优选择。默认提供 5MB 存储空间。\n\
  - **Mozilla 全局存储 API**：对于 Firefox 2 和 3 用户来说是一个不错的备选方案，这些用户的浏览器尚不支持本地存储 API，但支持这个非常相似的\
  \ API。默认提供 5MB 存储空间。\n- **IE 的`userData`机制**：IE 5 至 7 版本不支持上述任何推荐方法，但提供了这种无需任何插件即可在本地存储数据的机制。默认提供\
  \ 64KB 存储空间。\n- **Flash 本地共享对象**：对于浏览器不支持任何更优方法的用户，可以利用无处不在的 Flash Player 插件在本地存储数据，而无需依赖\
  \ Cookie。默认提供 100KB 存储空间。\n- **Cookie**：绝对是最不推荐的选择。Cookie 文件空间极其有限，而且其数据会随每次 HTTP\
  \ 请求发送到服务器，Cookie 越大，对连接的阻塞就越严重。默认提供 4KB 存储空间。\n\n根据这些信息，你可以创建三个通用方法——`get()`、`set()`和`remove()`——它们会优先选择最优技术，当首选技术不可用时，则会一直降级到简单的\
  \ Cookie。清单 9-13 展示了一个跨浏览器的本地存储 API，你可以使用本章给出的代码将其实现到你的`$` JavaScript 库中。请注意，由于其中一种技术（客户端数据库\
  \ API）在检索数据时需要提供回调函数，因此本 API 需要为所有技术都采用这种实践方式。\n\n**清单 9-13.** 跨浏览器本地数据存储 API\n\n\
  ```\n// 存储对技术代码对象的引用，通过初始化方法设置\n$.prototype.Storage.dataStore = null;\n\n// 初始化方法选择用于本地数据存储的技术。它接受一个参数来指定页面上的\
  \ Flash 元素，\n// 以便支持 Flash 共享对象。如果未提供此参数，则不会尝试使用 Flash 来存储数据\n$.prototype.Storage.initialize\
  \ = function(flashElement) {\n    // 按优先顺序依次尝试\n    if (window.localStorage) {\n\
  \        // 如果本地存储 API 可用，将 dataStore 指向我们之前创建的本地存储 API 命名空间\n        this.dataStore\
  \ = $.Storage.LocalStorage;\n    } else if (window.openDatabase) {\n        // 如果支持客户端数据库\
  \ API，将 dataStore 分配给 DBStorage 命名空间并初始化\n        this.dataStore = $.Storage.DBStorage;\n\
  \        this.dataStore.initialize();\n    } else if (window.globalStorage) {\n\
  \        // 如果支持全局存储 API，将 dataStore 指向相应的命名空间\n        this.dataStore = $.Storage.GlobalStorage;\n\
  \        this.dataStore.initialize();\n    } else if (window.ActiveXObject) {\n\
  \        // 如果存在 Internet Explorer 的 userData 机制，则初始化该机制以供使用\n        this.dataStore\
  \ = $.Storage.UserData;\n        this.dataStore.initialize();\n    } else if (flashElement)\
  \ {\n        // 如果支持 Flash 8，则将 dataStore 设置为使用 Flash 共享对象\n        this.dataStore\
  \ = $.Storage.Flash;\n        this.dataStore.initialize(flashElement);\n    } else\
  \ {\n        // 如果所有方法都失败，则使用 Cookie\n        this.dataStore = $.Storage.Cookies;\n\
  \    }\n};\n\n// get 方法检索先前存储的值，并将其传递给\n```\n\n\n```javascript\n// 指定的回调函数。由于在客户端数据库\
  \ API 中使用了回调技术，\n// 我们必须在整个过程中都使用它\n\n$.prototype.Storage.get = function(name, callback)\
  \ {\n  // 实际上，只有客户端数据库 API 这一个对象将回调参数\n  // 作为数据检索过程的一部分。dataStore 中指定的其他命名空间\n\
  \  // 会忽略该参数\n  var value = this.dataStore.get(name, callback);\n\n  // 如果返回了一个值（客户端数据库\
  \ API 不会返回值），\n  // 则执行回调函数，并将找到的值传递给它。\n  if (value && callback) {\n    callback(value);\n\
  \  }\n};\n\n// set 方法用于将值存储到指定的名称下\n$.prototype.Storage.set = function(name, value)\
  \ {\n  // 所有不同的技术都接受相同的输入来设置数据，因此这个\n  // 通用方法相当简单\n  this.dataStore.set(name, value);\n\
  };\n\n// remove 方法通过指定的名称永久删除数据\n$.prototype.Storage.remove = function(name) {\n\
  \  // 每种技术都接受相同的输入来删除数据\n  this.dataStore.remove(name);\n};\n```\n\n清单 9-14 展示了如何使用新的跨浏览器离线数据存储\
  \ API，在页面上的本地计算机或设备中存储、检索和删除数据。\n\n**清单 9-14.** *使用跨浏览器 API 获取、设置和删除数据*\n\n```javascript\n\
  // 执行代码，决定在当前浏览器中使用哪种技术。\n// 在此情况下，没有向 initialize 方法提供参数，\n// 这意味着不会使用 Flash 来存储数据\n\
  $.Storage.initialize();\n\n// 使用先前选择的技术保存电子邮件地址\n$.Storage.set({\n  name: \"email\"\
  ,\n  value: \"me@denodell.com\"\n});\n\n// 输出之前保存的\"email\"值。\n// 即使重启浏览器，数据仍会保留\n\
  $.Storage.get(\"email\", function(value) {\n  alert(value);\n});\n\n// 永久删除\"email\"\
  数据值\n$.Storage.remove(\"email\");\n\n// 由于\"email\"数据已不存在，输出空字符串\n$.Storage.get(\"\
  email\", function(value) {\n  alert(value);\n});\n```\n\n正如在前几章中所见，从本地数据源存储和检索数据比从远程\
  \ Web 服务器访问数据更快。这就是为什么需要确保文件被缓存到浏览器中，从而只需下载一次。通过让 Web 应用程序将用户数据存储在本地数据存储中，并从那里访问数据，你可以在后台执行\
  \ Ajax 操作，并允许用户仅与数据存储中的预存数据进行交互，从而提升应用程序的感知响应速度。这样一来，用户就无需单击按钮通过 Ajax 提交表单，然后等待服务器响应才能进行\
  \ Web 应用程序的下一步操作。\n\n清单 9-13 中的跨浏览器 API 可以实现在 Web 邮件客户端中，使正在撰写的新邮件能够按固定时间间隔自动保存，无需用户干预。\n\
  \n如果网络连接中断，用户可以继续撰写邮件，邮件内容会随着撰写过程被本地存储，直到服务器连接恢复。如果浏览器崩溃，邮件内容也能够恢复——用户不会丢失邮件内容（从而也不会失去耐心）。清单\
  \ 9-15 展示了一个如何在 HTML 页面中实现此行为的简单示例。\n\n**清单 9-15.** *将正在撰写的电子邮件保存到本地存储*\n\n```html\n\
