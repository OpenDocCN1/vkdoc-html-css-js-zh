  **表 3-6.** *表示需要重定向的 HTTP 状态码*


  | 状态码 | 描述 |

  | ----------- | ----------- |

  | 301 Moved Permanently | 所请求的 URL 已被永久移动，客户端不应再尝试使用该 URL，即将其列入黑名单。客户端在未来所有请求中应使用响应消息中返回的
  URL。 |

  | 302 Found | 所请求的 URL 已被临时移动，可通过响应消息中给出的 URL 访问。不进行黑名单操作，因为这只是临时重定向。 |

  | 304 Not Modified | 所请求的 URL 之前已被请求过，并且自上次请求以来未发生更改。客户端应改用所请求 URL 文件的本地缓存副本，以节省带宽并更快地向最终用户提供文件。
  |


  #### 400+（客户端错误）


  HTTP 状态码在 400–499 范围内，表示发送给服务器的请求消息中存在错误，导致服务器无法返回所请求的文件。这表明错误在于客户端，而非服务器。表 3-7
  显示了此范围内的常见状态码。


  **表 3-7.** *表示客户端请求消息错误的 HTTP 状态码*


  | 状态码 | 描述 |

  | ----------- | ----------- |

  | 400 Bad Request | 请求消息格式不符合预期，因此服务器无法理解。 |

  | 401 Unauthorized | 服务器期望请求中附带用户名和密码以访问服务器的受限区域，但缺少这些详细信息。 |

  | 403 Forbidden | 服务器拒绝响应客户端的请求。例如，这可能是因为请求机器的 IP 地址已被 |




