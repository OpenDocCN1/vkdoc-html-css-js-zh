  ### 使用向量标记语言绘图


  早在 1998 年，微软向 W3C 提交了自己的基于 XML 的矢量图形格式提案，称为向量标记语言（VML），以供考虑作为推荐标准。由于 Adobe、Sun 和其他公司也在提交他们自己的类似格式，W3C
  决定开发一种统一的格式供所有人使用，这最终在 2002 年成为了 SVG 推荐标准，正如前一节所讨论的那样。不幸的是，对于 Web 开发者来说，微软的开发者选择不采用
  SVG——并且在 IE 8 中仍然没有采用——而是继续开发和完善他们的 VML 格式。


  从版本 5 开始，所有 IE 版本都支持 VML，但其他任何浏览器都不支持。一个跨浏览器的矢量图形库需要同时支持 SVG 和 VML，才能成为开发者的可行解决方案。


  VML 与 SVG 有着显著的相似之处，并且支持几乎相同的功能。然而，VML 更简洁的格式使其文件大小比使用 SVG 表示相同图像的等效文件更小。有趣的是，VML
  元素使用 CSS 进行定位，并且不需要一个单一的元素作为画布来包围它们。标签可以直接添加到页面的任何位置。`清单 11-4` 展示了在图 11-1 中的图像如何在
  HTML 页面中使用 VML 表示。


  **清单 11-4.** *在 HTML 页面中描述的简单 VML 图像*


  ```

  <!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"

  ["http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">](http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd)

  [<html lang="en" xml:lang="en">](http://www.w3.org/1999/xhtml)

  <head>

  <title>SVG Demo</title>

  <!-- 要在页面中使用 VML，请使用 <style> 元素来启用其行为 -->

  <style>v\: * {behavior:url(#default#VML); display: inline-block;}</style>

  <!-- 接下来，声明 VML 命名空间以匹配该行为 -->

  <xml:namespace ns="urn:schemas-microsoft-com:vml" prefix="v" />

  </head>

  <body>

  <h1>SVG Demo</h1>

  <v:rect style=''position: absolute; top: 20px; left: 20px; width: 200px;

  height: 200px'' fillcolor="#000000">

  <v:fill method="linear sigma" color2="#cccccc" angle="90"

  type="gradient" />

  </v:rect>

