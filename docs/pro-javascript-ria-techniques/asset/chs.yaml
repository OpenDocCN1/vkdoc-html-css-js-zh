  strokewidth="3px" />

  <!-- VML 文本不能直接写入页面；它必须被另一个形状包围。这里，我们创建一个矩形来容纳文本 -->

  <v:rect style="top=460px; left=200px; width=500; height=100">

  <v:textbox ><span style="font-size: 50px; font-weight: bold;

  color: #333333;">Text Example</span></v:textbox>

  </v:rect>

  </body>

  </html>

  ```


  ### 使用可重用绘图库构建动态图形


  到目前为止，你已经了解了现代浏览器如何支持基于 XML 的矢量图形，但这




  '
- "# IE 浏览器使用的语法与其他浏览器不同。为了在网页应用中使用矢量图形，你需要一种简单的方法来指定能被两种不同模型支持的矢量图形。我们通常需要使用 JavaScript\
  \ 库来消除跨浏览器的不一致性，如第 2 章所述。在这种情况下，我们可以使用由开发者 **Dmitry Baranovskiy** 构建的可重用 JavaScript\
  \ 库 **Raphaël**。\n\n`Raphaël` 通过一个简单统一的 JavaScript API，简化了以跨浏览器方式创建自定义矢量图形的过程。该库会根据浏览器选择合适的矢量图形绘制技术：SVG\
  \ 或 VML。你可以从项目主页 [`raphaeljs.com/`](http://raphaeljs.com/) 下载该库，该网站还提供了许多组件的运行示例。该库组件压缩后的代码体积为\
  \ 53KB。\n\n正如你所见，使用 SVG 和 VML 创建的每个图形对象也都是 DOM 对象，这意味着你可以像处理任何其他页面元素一样，为它们添加事件处理器或动态修改现有的图形元素。\n\
  \n举个例子，假设你想用折线图向网页应用的最终用户展示一组数据。这些数据是不断变化的——也许你正使用 Ajax 每 30 秒从服务器获取一次新数据。你希望在数据到达时，图表能反映出这些变化。图\
  \ 11-2 展示了用户可能看到的界面。点击“获取新数据”链接，模拟从服务器接收新数据并更新图表的过程。将鼠标悬停在图表上的每个点时，该点会高亮显示并显示其精确数值。\n\
  \n![Image 35](img/index-388_1.png)\n\n**364**\n\n## 第 11 章 ■ 在浏览器中绘图\n\n**图 11-2.**\
  \ *动态更新图表*\n\n`清单 11-5` 展示了如何使用 `Raphaël` JavaScript 库在 HTML 页面中动态构建图 11-2 所示的图表，以确保跨浏览器兼容性。\n\
