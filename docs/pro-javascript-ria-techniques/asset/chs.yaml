  - **视图**，包含与构建和管理用户界面相关的代码\n- **控制器**，充当桥梁，包含通过事件驱动机制将模型和视图连接起来的代码\n\n控制器将模型和视图连接在一起，而模型和视图彼此无关——完全独立。图\
