  \ |\n\n#### 消息如何传输\n\n现在我们已经介绍了 Web 通信消息的语言，接下来需要了解这些消息如何在浏览器和目标服务器之间实际传输。消息需要从浏览器所在位置传输到\
  \ Web 服务器所在位置，再返回，这个过程可能跨越全球。本节将解释这些消息如何从源头到达目的地而不会在途中丢失。\n\n### IP 地址：互联网的电话号码\n\
  \n浏览器创建其 HTTP 请求消息后，需要将其发送给 Web 服务器。因此，首要任务是定位该 Web 服务器。以清单 3-1 中的 HTTP 请求消息为例，Web\
  \ 服务器的域名`www.google.com`必须先转换为互联网协议（IP）地址，然后才能被定位。这种地址看起来像是一系列由点号（`.`）分隔的数字。例如`www.google.com`可能对应`209.85.171.99`。IP\
  \ 地址帮助浏览器及其他连接互联网的系统找到将消息路由到目标 Web 服务器所需的信息。IP 地址就像是服务器的电话号码。\n\n为了将人类可读的域名（也称为*主机名*）转换为数字序列，您的浏览器必须连接到一个在线数据库，称为域名系统（DNS）或*名称服务器*，其中包含主机名及其关联的数字\
  \ IP 地址信息。名称服务器的主要作用有两个：\n\n**128**\n\n- 人类可读的主机名比数字序列更容易记忆。\n- 主机名和 IP 地址可以独立更新。\n\
  \n例如，Google 可以将其 Web 服务器迁移到世界另一端的另一台机器上，IP 地址也会随之改变。无需通过主机名来传达这一地址变更，Google 只需在\
  \ DNS 数据库中更新 IP 地址，让其指向新位置的 IP 地址即可。这使得系统对最终用户透明。\n\n在深入探讨 DNS 系统的工作原理之前，理解 URL\
  \ 的各个组成部分很重要。以 URL `www.google.com`为例，让我们用分隔点将地址划分，并依次查看每个部分，从最后一个开始逆向分析。\n\n- **com**：任何网址最右侧的部分称为*顶级域*。您可能见过`.net`、`.org`等。DNS\
  \ 系统首先使用 URL 的这一部分，将地址列表过滤为仅包含此顶级域内的地址。\n- **google**：URL 的中间部分告诉 DNS 服务器在其`.com`\
  \ URL 列表中定位`google`条目。系统实质上是过滤可用的 URL。\n- **www**：URL 的第一部分涉及要访问的`google.com`站点下的特定服务器或子域。同样，列表已被有效过滤为仅包含该域下的服务器。\n\
  \n不要认为只有一个 DNS 服务器在积极处理来自全世界所有浏览器和联网设备的 IP 地址查询请求。目前存在 13 个根级 DNS 系统（每个系统由一组服务器集群组成以应对流量负载），不过公司或组织可以向其内部网络提供这些系统的本地副本，以加快查询过程。\n\
  \n根级 DNS 系统负责处理 URL 的顶级域和服务器部分，仅查找这一级别的 IP 地址。此后，请求被转发到该域的服务器——在本示例中，即`google.com`的\
  \ DNS 服务器。\n\nDNS 数据库中的每条记录不仅包含 IP 地址，还包含域所有者的联系信息以及一些关键服务器的地址，包括本地名称服务器。\n\n大多数组织至少在其网络上拥有自己的主用和备用名称服务器（Google\
  \ 目前拥有四个名称服务器）。如果第一个服务器出现问题，请求将被重定向到第二个服务器，从而降低查询失败的可能性。根级 DNS 系统将`www.google.com/`的请求传递给\
  \ Google 的本地名称服务器，然后这些服务器返回名为`www`的本地服务器的确切 IP 地址，最终返回目标 Web 服务器的最终 IP 地址。\n\n###\
  \ 数据包：数据块\n\n互联网上计算机之间发送的通信消息由称为*数据包*的小数据块组成。一个请求通常由多个数据包构成。\n\n采用发送数据包而非一次性发送整个数据消息的主要原因是为了减少网络问题的影响。如果某个数据包未能送达，可以重新发送直到成功接收，而无需重新发送整个数据消息。此外，对于性能较低的计算机系统，较小的数据包比大的更易于管理，因为每个数据包仅需占用少量可用内存即可处理。\n\
  \n**129**\n\n### 路由与路由器：互联网的交换台\n\n\n\n一旦你的浏览器知道了最终目标服务器的 IP 地址，它就需要连接到该目标，以便向其发送请求消息并等待响应数据。被称为*路由器*的设备位于互联网上的每个主要流量枢纽处，负责执行连接和全球数据包的路由。这些设备维护着本地的*路由表*，其中包含关于如何将数据包从当前位置最佳地引导到更靠近\
  \ Web 服务器位置的信息，直到数据包到达目的地。\n\n你可以使用计算机上已内置的软件，亲自查看数据是如何在你的浏览器和目标服务器之间路由的。如果你是 Microsoft\
  \ Windows 用户，请加载命令提示符。为此，请选择“开始” ➤ “运行”。在出现的框中，键入`cmd`，然后按 Enter 键。在命令提示符窗口中，键入以下命令并按\
  \ Enter 键：\n\n```\ntracert www.google.com\n```\n\n如果你是 Apple Mac 用户，请从`Applications/Utilities`文件夹中加载终端应用程序。在出现的窗口中，键入以下命令并按\
  \ Enter 键：\n\n```\ntraceroute www.google.com\n```\n\n你将看到类似于以下内容：\n\n```\nTracing\
  \ route to www.l.google.com [64.233.183.103]\nover a maximum of 30 hops:\n  1  \
  \   6 ms    <1 ms    <1 ms  10.0.1.1\n  2     2 ms     5 ms     5 ms  gw1.A218.priv.bahnhof.se\
  \ [85.24.240.1]\n  3   642 ms     *       15 ms  hsb-A218.c3750- stortorget.bahnhof.net\
  \ [85.24.152.50]\n  4     4 ms     3 ms     4 ms  stortorget-mmo.c7600- limhamn.bahnhof.net\n\
  \                                 [85.24.151.29]\n  5     4 ms    17 ms     6 ms\
  \  c7600-limhamn.mlm- rr1.bahnhof.net [85.24.151.202]\n  6     4 ms    14 ms   \
  \  1 ms  82.96.55.41\n  7    56 ms   200 ms   205 ms  v1315-r84.tc-cr1- r69.sto.se.p80.net\
  \ [82.96.1.61]\n  8    28 ms    11 ms    15 ms  72.14.198.177\n  9    15 ms    10\
  \ ms    10 ms  209.85.252.186\n 10    33 ms    35 ms    33 ms  209.85.252.192\n\
  \ 11    51 ms    35 ms    36 ms  66.249.95.132\n 12    38 ms    37 ms     *    72.14.233.79\n\
  \ 13    39 ms    45 ms    48 ms  216.239.43.34\n 14     *       42 ms  3402 ms \
  \ nf-in- f103.google.com [64.233.183.103]\nTrace complete.\n```\n\n这是测试数据块从你的计算机移动到`www.google.com`服务器的可视化表示。在响应第一行的方括号内，你可以看到通过\
  \ DNS 查找找到的 IP 地址。紧随其后的是几个服务器的列表，第一个是你的计算机，最后一个是位于`google.com`的目标服务器。中间是路由器设备，它们负责接收这些数据并将其在全球范围内传输，以确保数据到达目的地。你应该能看到，前几项对应于你的互联网服务提供商（ISP）所拥有的服务器。\n\
  \n你可能会注意到，路由器不一定选择地理上最近的位置。这是因为在全球范围内传输数据最有效的路径可能是跨越县、国家和大陆边界。\n\n#### HTML 页面的加载顺序\n\
  \n一旦浏览器收到页面请求的响应，它就会获取响应中提供的 HTML 标记并进行显示。本节将解释这是如何执行的，以及重新定位页面中某些 HTML 标签对其加载时间的影响。\n\
  \n一个 HTML 文档包含两个主要部分：头部（head）和主体（body），分别由`<head>`和`<body>`标签表示。浏览器通常会在响应消息中的数据仍在下载时就开始构建页面，从`<head>`部分开始，然后进入`<body>`部分。头部部分可能包含以下任何标签：`<style>`、`<link>`、`<script>`、`<meta>`、`<title>`和`<base>`。\n\
  \n除`<script>`之外的所有这些标签都只允许在`<head>`部分内，不允许在其他地方出现。这个规则告诉你，浏览器在渲染 HTML 的`<body>`部分之前需要了解些什么。如果你依次查看每个标签的描述，就应该明白为什么需要在处理`<body>`标记之前预先了解这些信息：\n\
  \n-   `<style>`：包含 CSS 样式定义，以便以自定义设计在页面上布局 HTML。浏览器需要知道如何在屏幕上显示标签之前进行布局，以防止出现难看的渲染效果。否则，浏览器会在应用自定义样式之前以默认样式绘制标签。`<style>`标签确保永远不会发生这种情况。\n\
  -   `<link>`：链接到外部数据。当引用外部样式表时，浏览器出于与需要知道`<style>`标签中的样式相同的原因，需要了解这些链接。当它适用于链接到站点内的其他文档时，它仅表示头部信息，与页面的主要内容分开。\n\
  -   `<meta>`：提供定义页面内容但独立于页面内容本身的数据。示例包括指定页面的关键字和描述，以供搜索引擎爬虫使用。也可以使用此标签执行与某些 HTTP\
  \ 响应消息头值相同的操作——例如，为内容设置到期日期或指定内容类型。\n-   `<title>`：指定页面的标题。这是出现在浏览器窗口标题、书签链接、搜索引擎结果和其他位置中的文本。\n\
  -   `<base>`：允许页面开发者为页面内容中指定的所有链接、图像和其他 URL 规定一个基础 URL。例如，如果`<base>`标签设置为指向`http://www.google.com/`，并且页面中的一个链接仅指定为`logo.gif`，那么浏览器将要查找的完整\
  \ URL 将是这两个 URL 的组合：`http://www.google.com/logo.gif`。\n\n一旦浏览器读取了`<head>`部分并下载了其中所有必要的外部链接文件，它就可以开始顺序地、一个标签一个标签地读取和解析\
  \ HTML 文档的主体部分了。\n\n### 页面性能\n\n页面性能的一个重要方面是将该页面下载到 Web 浏览器所需的时间。如果你发现页面加载时间过长，可以尝试找出导致性能不佳的原因。\n\
  \n#### 查看页面性能\n\n有两个工具对于查看页面及其内容的实时下载时间非常有用：\n\n-   最流行的工具是 Firefox 的 Firebug 插件。可以从`http://www.getfirebug.com/`下载\
  \ Firebug。\n-   另一个选项是 Safari 4 中的网络时间线工具。要启用此功能，请打开浏览器的偏好设置页面，单击“高级”选项卡，然后勾选“在菜单栏中显示开发菜单”选项。然后，你可以通过选择“开发”\
  \ ➤ “显示 Web 检查器”并选择“资源”选项卡来访问网络时间线工具。\n\n这两个工具都允许你查看服务器响应请求消息所需的时间，以及下载文件所需的时间。\n\
  \n图 3-2 展示了使用 Firebug 插件查看 Google 首页各个组件加载时间的可视化效果。结果中显示了两条垂直线：第一条标记了 DOM 可通过 JavaScript\
  \ 访问的时间点，第二条标记了页面（包括其所有外部引用）完成下载的时间。图 3-3 展示了使用 Safari 的网络时间线工具加载 Google 首页组件的情况。\n\
  \n**图 3-2.** *使用 Firebug 插件查看页面加载时间*\n\n\n\n### 图 3-3. *使用 Safari 的网络时间线工具查看页面加载时间*\n\
  \n我建议你在构建页面时，安装并使用这两个工具（之一或全部）进行测试，以便找出 Web 应用性能中的瓶颈所在。\n\n#### 识别性能中的潜在瓶颈\n\n我们都希望浏览器能始终以最高效率加载页面请求：尽可能快地下载每一点数据，并在接收到每一块数据时立即将其渲染到屏幕上。不幸的是，实际情况并非总是如此。\n\
  \n在本节中，我将揭示一些可能导致页面加载效率低下的潜在瓶颈。目前，我不会提供这些缺陷的解决方案或变通方法；但请放心，在后续章节中，我会向你展示如何尽可能多地解决这些问题。\n\
  \n#### 引擎马力\n\n本章前面部分，我们探讨了存在于 Web 浏览器中的渲染引擎和 JavaScript 引擎，它们负责将 HTML、CSS 和 JavaScript\
  \ 格式的简单文件转换为功能完整、可交互的网页。不同浏览器的引擎基于不同的底层代码构建，因此它们具有不同的性能特征，这并不令人意外。\n\n通常，随着新版本的发布，浏览器制造商会修改底层代码以增强引擎性能，从而提升引擎效率。这使得当前主流\
  \ Web 浏览器的性能比以往任何一代都要好上数倍。\n\n一般来说，终端用户使用的浏览器版本越旧，他们所经历的渲染和 JavaScript 性能就越差。\n\n\
  #### 用户的上传速度\n\n大多数用户通过 ISP（互联网服务提供商）以非对称连接的方式接入互联网。这意味着大多数用户可用的下载带宽远大于上传带宽；这两种连接速度并不相同。\n\
  \n带宽与下载或上传数据所需的速度成正比。\n\n你可能会想，请求一个网页时需要从你的计算机上传哪些数据。事实上，从被请求页面链接的每一个外部文件——每张图片、每个样式表和\
  \ JavaScript 文件——在下载之前，都需要构建一个新的 HTTP 请求消息并发送到服务器。如果你的页面链接了大量外部文件（无论这些文件大小如何），你可能会发现用户的网络连接达到了上传限制，并且需要等待之前的请求发送完毕后，才能发送新的请求。互联网速度一直在提升，所以这个问题正在缓解，但仍值得对页面进行调整，以减少那些连接速度较慢的用户（例如移动用户）所遇到的困扰。\n\
  \n#### 并行连接限制\n\n许多浏览器都对可同时与每台服务器建立的连接数量设置了内部限制。一个现代 RIA（丰富互联网应用）页面，尤其是设计复杂的页面，可能包含超过\
  \ 50 个外部文件引用需要加载才能完整渲染。对并行连接数量的限制，显然会限制页面下载并显示给用户的速度。\n\nHTTP 1.1 规范建议同时连接数限制为同时下载两个文件。Opera\
  \ 和 Safari 浏览器将此限制提高到四个。IE 8 则将其提高到同时下载六个。这些限制显然会制约浏览器的性能。如果所有文件都能同时下载，页面就能更快地呈现给最终用户。\n\
  \n#### 图片格式的选择\n\n历史上，Web 上盛行三种图片格式：GIF、JPEG 和 PNG。这些格式彼此差异巨大。在为页面编码图片时，如果选择了错误的格式，或采用了低效的压缩设置，就可能导致图片文件体积超出必要大小。由于大多数网页中图片的数量远超其他类型的文件，因此文件格式的选择应作为首要关注点。\n\
  \n#### 不必要的内容\n\n文件体积越大，下载到浏览器所需等待的时间就越长。在构建标记时，请确保没有引用不必要的样式表或 JavaScript 文件，也没有在页面中包含大段的注释。包含了不必要的代码，就意味着你冒着将永远不会使用的数据下载到用户浏览器的风险，这会增加完整页面渲染所需的时间。\n\
  \n#### 缓存设置\n\n一些 Web 开发人员选择在其 Web 浏览器中禁用所有缓存，以便始终拥有自己文件的最新副本进行测试。然而，大多数终端用户会保持其缓存设置为默认值，这通常意味着决定哪些内容被缓存以及缓存多久的规则，取决于传输内容的\
  \ Web 服务器的响应头。调整服务器，使其仅发送与先前类似请求相比有所更改的内容，可以确保浏览器需要接收的数据更少，从而为最终用户带来更快的体验。\n\n####\
  \ 未压缩的文本文件与多余空白\n\n在构建和编写基于文本的 HTML、样式表和 JavaScript 文件时，空白字符的使用可能很重要。制表符间距、换行符、空格和注释有助于使代码更易于阅读、理解和维护。\n\
  \n每个制表符、换行符和空格字符都是浏览器有效渲染页面所不需要的数据。如果你能移除这些不必要的数据，文件大小将会减小，从而下载速度也会更快。\n\n大多数浏览器和服务器都支持压缩算法，通常是\
  \ `gzip` 和 `deflate`，这些算法在传输时会压缩数据大小并移除所有不必要的字符，然后在接收端解压数据。如果没有压缩，文件体积会比实际需要的大，页面下载时间也会受到不利影响。\n\
  \n### 总结\n\n本章描述了从 Web 服务器请求页面并将其发送到浏览器，然后将该响应转换为网页的过程，并重点指出了若干对此过程的速度和效率产生不利影响的因素。\n\
  \n在下一章中，我将揭示如何通过对 Web 服务器和代码进行特定更改，从而显著提升 Web 应用的性能，为你的最终用户提供更好的体验。\n\n---\n\n##\
  \ 第 4 章：性能调优\n\n上一章解释了浏览器和 Web 服务器如何通过消息相互通信，以及这些消息如何在网络中寻路到达正确的目的地。你还了解到，不同 Web\
  \ 浏览器的性能因其渲染引擎和 JavaScript 引擎的不同而各异。\n\n在本章中，我们将探讨如何让网页尽快“活起来”，以便访客能在他们的浏览器中使用它。研究表明，用户不会注意到良好的性能，但他们确实会因糟糕的性能而感到不快。人们期望网页在发出请求后就能立即加载。我们凭什么给他们低于预期的体验呢？这里的关键是效率——在最短的时间内将最多的数据下载到浏览器。\n\
  \n### 性能真的是一个问题吗？\n\n\n\n"
- '# 性能调优


  在当今这个通信速度不断提高、宽带和光纤连接日益普及、家用电脑性能不断增强的时代，你可能会问自己，我们是否还需要注重效率。毕竟，如果你家里的宽带速度现在是 4 Mbps，而去年是
  2 Mbps，那么一个 12 个月前构建的网页现在加载速度肯定会是当时的两倍。虽然性能确实会有所提升，但不幸的是，这种提升并不总是与连接速度的增长成正比。将下载速度翻倍并不能将交付时间减半。基于这种假设来构建
  RIA（富互联网应用）会忽视更宏观的全球通信图景，并可能对某些用户产生负面影响。


  前一章指出了某些瓶颈，这些瓶颈会阻碍网页及其资源被最高效地交付到浏览器进行显示：


  -   用户的上传速度，通常远低于其下载速度

  -   网络浏览器施加的并行连接数限制，这限制了在任意时间内从任何单一服务器加载的数据量

  -   图片的文件格式选择

  -   包含不必要的内容

  -   低效的缓存设置

  -   文本文件中包含被浏览器忽略的空白字符数据


  这些因素中的任何一个或它们的任意组合，都会限制网页在浏览器中渲染的速度。


  例如，考虑一个 20KB 的 HTML 页面，它引用了一个 10KB 的 CSS 文件、一个 15KB 的 JavaScript 文件以及 25 个每个 5KB
  的外部图片。总计下来，需要下载到浏览器的数据量为 170KB。一条 2 Mbps 的家庭 ISP 连接理论上可以在大约 1.5 秒内下载 170KB 的数据，但在实际测试中，这样一个页面所需的下载时间要长得多，乐观估计也要
  3 到 4 秒。


  每个文件都需要被单独请求，每个请求都包括浏览器形成一个 HTTP 请求消息，将其发送到服务器，并等待服务器执行任何脚本，然后返回包含所请求数据的 HTTP 响应消息。在这个例子中，这个过程会发生
  28 次。


  你已经知道浏览器会施加一个并行连接数限制，根据浏览器的不同，会同时下载两到八个文件。假设最坏的情况，即 IE 6 和 7 中存在的情况，在接收到第一个文件（即包含所有其他文件请求的
  HTML 文件）之后，文件将分多达 14 个独立的批次进行下载，每个批次都伴随着请求/响应连接的时间开销，这个开销通常约为 150 毫秒。因此，在这些浏览器中，这会给页面的总加载时间增加大约
  2 秒。所以，看似只需 1.5 秒就能到达最终用户的内容，实际花费的时间可能是这个数字的两倍还多。


  因此，性能和效率是非常相关的主题，尤其是对于那些使用受限浏览器或网络连接缓慢的用户而言。这些用户包括在移动设备上运行浏览器的用户，以及使用拨号连接的用户。


  近来，移动设备所具备的原始计算能力的提升，使得许多制造商能够提供功能完备的网页浏览器。这些浏览器显示的网页几乎与它们在台式电脑上的显示效果一模一样。流行的移动浏览器包括
  `Opera`、`IE`，以及基于 `WebKit` 渲染引擎的特定变种，例如苹果 iPhone 上的 `Safari` 和谷歌 Android 设备上的 `Google
  Chrome`。


  尽管移动设备可能能够像台式电脑一样显示网站，但它们确实存在一些限制。例如，iPhone 的本地缓存只能存储大小不超过 25KB 的项目。如果你网站的所有页面都包含一个
  JavaScript 文件，并且该文件大于 25KB，那么 iPhone 将被迫在每次请求页面时都重新下载该文件。




  '
- '# 性能优化


  通常，设备越小，其提供给浏览器缓存的内存和磁盘空间就越有限。在台式电脑上，可以在多个页面请求之间下载和存储的文件，在移动设备上需要随每个页面重新下载。因此，你需要考虑效率，以惠及这些设备上的用户。


  同时也要认识到，虽然在许多西方国家，宽带连接的数量已经超过了拨号调制解调器连接，但在世界其他许多地区，拨号连接仍然占主导地位。在拨号速度下，一个`100KB`网页和一个`1024KB`网页的加载差异是几秒钟。考虑到全球仍有数百万用户在使用拨号连接，你需要让你的代码更高效。


  既然你已经理解了为什么让你的网页更精简、更高效如此重要，那么让我们来看看如何实现这一目标。


  ### 调整 Web 服务器以提升性能


  有三个部分协同工作，将网站交付给最终用户：Web 服务器、Web 浏览器以及两者之间的物理连接。物理连接几乎不受你的控制，但在大多数情况下，你可以控制另外两个组件。因此，你需要对两者进行调优，以为网站访问者提供最佳性能。让我们首先看看
  Web 服务器，以及在幕后可以做些什么来让网站加载更快。


  > **提示** 关于此处介绍的指南的更多信息，请参阅雅虎关于加速网站的最佳实践指南，网址为：`http://developer.yahoo.com/performance/rules.html`。


  ### 为外部资源使用独立的域名


  如果你打算在你的网站中使用 HTTP Cookie，那么你应该考虑为你的 Web 应用程序设置第二个域名。


  Cookie——保存到用户计算机的小型文本文件——随着每个页面请求发送到 Web 服务器，正如你在前一章中所见。这些对于页面请求很重要，这样 Web 服务器就可以根据
  Cookie 中的数据组装自定义的 HTML。例如，如果你登录到一个网站，Cookie 可能包含你的登录标识符，服务器随后可以使用它向你显示一个个性化的主页。


  通常，你只根据 Cookie 数据自定义 HTML，但问题在于数据会随每种文件类型的请求（无论是 HTML 还是其他类型）一起发送。这意味着在绝大多数情况下，Cookie
  数据由浏览器发送，然后被服务器忽略。Cookie 数据是基于正在访问的网站的域名由浏览器自动发送的；你无法根据文件类型覆盖此行为。


  一个解决方案是使用不同的域名。通过为一个网站创建两个独立的域名，你可以选择从一个域名托管所有图片、样式表、JavaScript 文件和其他外部资源，而从另一个域名托管所有
  HTML 文件。通过将 Cookie 数据仅保存到托管 HTML 文件的域名，你可以确保在请求任何其他文件类型时，Cookie 数据不会发送到服务器。这使得 HTTP
  请求消息中发送的数据更小，从而使其能更快地到达 Web 服务器。


  此技术仅推荐在你依赖 Cookie 数据存储在用户浏览器中的情况下使用。在其他情况下，为了定位第二个域名的 IP 地址而进行的额外 DNS 查找，实际上会导致最终用户性能变差，因此应谨慎使用此技术。


  ### 使用内容分发网络（CDN）


  互联网是一个复杂的庞然大物——一个由节点连接而成的巨大且不断扩展的网络——有时很难相信数据在你的计算机和远程服务器之间远距离传输的速度。然而，通常来说，数据需要传输的距离越远，它必须经过的计算机和路由器就越多，才能到达目的地。旅程中的每一站都可能增加传输时间。连接这些点的电缆的质量和类型也会影响从浏览器请求页面到
  Web 服务器在响应中发送数据之间的时间。这种速度差异意味着，从世界各地连接到你的 RIA 的用户，无法以相同的速度访问数据。


  有几家公司在全球多个地点建立了自己的服务器，并提供了一项服务，将你的代码复制到所有这些地点。这缩短了浏览器与 Web 服务器之间的距离，从而显著提高了响应时间。这些本地服务器安装通常被称为
  **内容分发网络**（CDN）。


  通过将你的文件托管在其中一个 CDN 上，你可以在物理上让文件更接近最终用户，从而真正提升性能。谷歌广泛采用了这种方法，其网站的运行速度充分证明了其优势。该技术也大量应用于视频和媒体文件的托管，在这些场景中，即时播放对网站所有者来说至关重要。


  [EdgeCast (`http://www.edgecast.com/`)](http://www.edgecast.com/) 和 [Akamai (`http://www.akamai.com/`)](http://www.akamai.com/)
  等公司为中小型及大型企业提供此服务。对于规模较小、更具个人色彩的网站来说，它们的成本可能有点令人望而却步。谷歌为个人用户提供了几个选择，允许他们在其网络上免费托管某些文件。视频文件可以通过谷歌的
  YouTube 服务 (`http://www.youtube.com/`) 托管；小型页面组件可以通过 iGoogle (`http://www.google.com/ig/`)
  小部件托管服务托管；而某些流行的 JavaScript 库则可以通过谷歌的 Ajax APIs 服务托管，稍后在“通过 CDN 访问 JavaScript 库”部分会有更详细的描述。这三种解决方案都是免费的，并允许你利用谷歌全球分布的服务器网络。


  ### 分块向浏览器发送 HTML


  大多数 Web 服务器并非向最终用户提供静态的 HTML 文件。通常，用户请求一个文件，这会导致服务器执行某些操作。该操作的结果是拼装出一个最终的 HTML 文件，然后发送给用户。这些操作通常使用服务器端脚本语言编写，例如
  `PHP`、`ASP.NET` 或 `JSP`（Java Server Pages）。


  在向服务器发出查看页面的请求后，浏览器在服务器拼装要发回的 HTML 代码时会处于等待状态。如果你能尽快获取到最终 HTML 的某一部分，那么浏览器就可以在等待服务器发送剩余
  HTML 页面的同时，开始加载外部资源（例如样式表）。这意味着，与浏览器必须等待整个 HTML 页面作为一个大块一次性发送相比，整个页面能更早地准备好供最终用户交互。


  当 HTML 页面被组装时，它被存储在服务器的内存缓冲区中，直到页面组装完成，然后缓冲区中的内容被清空到 HTTP 响应消息中。


  可以在服务器端代码中按需将此缓冲区中的内容刷新到 HTTP 响应流中，这会导致到目前为止已生成的 HTML 被发送到浏览器。如果你在页面的战术性节点执行此缓冲区刷新操作，浏览器就能更早地获得要渲染的
  HTML，最终用户也能更早地在屏幕上看到内容。换句话说，你获得了性能提升。


  其中一个清空内存缓冲区的战术性节点是在页面 `<head>` 标签的结束位置之后，即在包含了样式表和脚本引用之后。




  '
- '# 性能调优


  ## 将 `<head>` 部分抢先发送给浏览器


  `<head>`标签和`<body>`标签开始之前。由于服务器上的大部分繁重工作通常是在页面`<body>`中的元素上执行的，`<head>`部分在页面形成阶段通常会更早地准备好发送。通过提前将`<head>`部分交给浏览器，它可以在浏览器接收其余
  HTML 页面的同时加载样式表和其他外部资源。


  服务器默认不执行此操作的原因很简单：服务器不知道您何时希望在页面上执行此操作。如果在页面中错误的位置执行命令——例如在标签中间或在结束标签之前——可能会导致渲染错误。在选择使用此技术时请谨慎，但我强烈建议您尽可能使用它。


  > **注意**：某些版本的 IE 浏览器存在一个已知限制：浏览器在接收到前 256 字节的页面数据之前不会显示任何输出。如果正在写入的`<head>`部分中字符少于
  256 个，则在页面开始处刷新缓冲区不会对此浏览器产生性能提升效果。


  让我们看看如何使用三种常见语言（`PHP`、`C#`和`JSP`）实现此技术。


  ### 使用 PHP 刷新缓冲区


  如果您的服务器端代码是用`PHP`编写的，您可以在页面中调用一个指令来在您选择的位置刷新缓冲区。只需在页面的`<head>`部分结束和`<body>`部分开始之间执行以下代码：


  ```html

  </head>

  <?php flush(); ?>

  <body>

  ```


  ### 使用 ASP.NET/C#刷新缓冲区


  如果您的服务器运行的是微软的`ASP.NET`和`C#`语言，有一个指令可以按需刷新缓冲区。在页面的`<head>`结束和`<body>`开始之间执行以下代码：


  ```html

  </head>

  <% Response.Flush(); %>

  <body>

  ```


  ### 使用 JSP 刷新缓冲区


  如果您的服务器端脚本语言是`JSP`，有一个等效的命令可以在您选择的位置刷新缓冲区。在页面的`<head>`部分结束和`<body>`部分开始之间执行以下代码：


  ```html

  </head>

  <% response.flushBuffer(); %>

  <body>

  ```


  ## 自定义 HTTP 标头以强制浏览器缓存


  在任何性能讨论中，缓存主题都会多次出现。一旦某些资源已下载到最终用户的浏览器，您不希望该浏览器在后续页面请求或再次访问站点时再次下载这些资源，除非它们已更改。


  除了直接从用户计算机获取文件（而不是重新下载）带来的明显性能优势外，这还减轻了 Web 服务器的负载，如果某天突然出现意外的流量增长（这通常被称为*Digg 效应*，来源于流行的链接提交和评分网站`http://www.digg.com/`），这会非常有用。


  您可以通过在 Web 服务器的 HTTP 响应中随文件一起发送特定的标头内容，来强制浏览器保留已下载文件的副本。您可以利用以下两个标头：


  - `Expires`：明确告知浏览器下载的文件在某个日期和时间之前有效，因此在此日期之前无需重新下载。

  - `Cache-Control`：可用于告知浏览器以及位于 Web 服务器和浏览器之间的任何代理服务器缓存特定文件。


  `Expires`标头值是一个完整日期，标志着在此日期之后，浏览器的任何后续请求都应直接发送到服务器以获取新副本：


  ```

  Expires: Thu, 15 Apr 2010 20:00:00 GMT

  Cache-Control: Public

  ```


  使用`Cache-Control`允许您将数据存储在更靠近最终用户的位置。这意味着，例如，如果通过某个特定`ISP`访问您页面的一个用户请求了您的页面，数据可以缓存到代理服务器上，这样来自同一`ISP`的第二个用户将从物理上更近的代理服务器获取数据（假设两者共享同一代理服务器）。您已经看到浏览器和服务器之间的物理距离会影响性能，因此在可能的情况下，这是期望的效果。


  `Cache-Control`标头值包含四个可能的值之一：


  - `Private`：代理服务器不应缓存此文件，但可以存储在浏览器缓存中。此值通常设置在某些包含针对特定用户个性化内容的 HTML 文件上。

  - `Public`：共享缓存（包括代理服务器上的缓存）将保留所请求文件的副本。代理服务器随后会将后续请求发送给浏览器，而无需直接从 Web 服务器发出请求。这是尽可能多的文件的理想值，因为它为最终用户带来了最佳性能。

  - `No-cache`：响应中发送的文件不应在当前会话之外被缓存。在另一个会话中将从服务器下载新副本。

  - `No-store`：响应中发送的文件绝不应被缓存。同一会话中的后续请求将导致服务器发回整个全新的页面副本。


  理想情况下，您希望为静态组件（如`JavaScript`文件、样式表和其他外部资源）设置`Expires`标头，同时将`Cache-Control`值设置为`Public`。某些动态
  HTML 文件或为`Ajax`请求返回数据的页面应将其`Cache-Control`标头值设置为更合适的值，例如`No-cache`。


  一个技巧是为所有静态组件将`Expires`标头设置为未来很远的日期，比如几年后，这样一旦下载，这些文件将永远不会再从服务器请求，从而显著提升后续页面访问的性能。当然，当您进行更改时，仍然需要一种将文件更新发送给最终用户的方法。这可以通过在被请求文件的`URL`的文件名、域名或文件夹名中添加版本号来实现。这个新的`URL`不会与浏览器缓存中的任何内容匹配，从而强制浏览器从服务器获取新版本。然后，您将新文件的`Expires`标头设置为未来足够远的时间，这样一旦下载，就永远不会再从服务器请求该文件。


  要使用此技术，请为每个 Web 应用程序版本创建一个文件夹或文件，每次向服务器发送新代码版本时递增版本号。在这里，您可以看到以两种不同方式嵌入到文件请求中的版本号，两者都执行请求全新文件的任务：


  ```

  /v1.0.1/assets/styles/mysite.css

  /assets/styles/mysite-v1.0.1.css

  ```


  您会发现，通过巧妙使用此功能，可以对性能产生巨大影响。此功能正越来越受欢迎，并被许多大型网站（包括`Yahoo!`）使用。请查阅您的特定 Web 服务器的手册，了解如何为您的站点设置`Expires`和`Cache-Control`标头。


  ## 压缩服务器输出


  可能最大的单一 Web 服务器性能提升可以通过在将基于文本的内容（`HTML`、样式表和`JavaScript`文件）发送到浏览器之前对其进行压缩来实现，让浏览器在显示数据之前解压缩数据。压缩涉及以不同、更高效的方式编码数据。在某些情况下，压缩可以将文件大小减少多达原始大小的
  70%。两种流行的压缩算法是`gzip`和`deflate`，这些在前一章中提到过。




  '
- '# 性能调优


  这项技术的妙处在于，在服务器上启用它非常简单。几乎所有现代网页浏览器都支持它。不支持压缩技术的浏览器将从服务器接收未压缩的数据，因此数据绝不会丢失。


  如果您的网络服务器默认未启用此功能，应尽快启用它。您会立即注意到它的效果，最终用户也会有所感受。


  在服务器上压缩数据，与直接返回未压缩文件相比，确实会增加服务器的 CPU 负载。这种增加通常不足以引起任何问题，但如果您的服务器硬件资源有限，则值得注意。


  **注意：** 某些非常古老的浏览器会向服务器宣称它们支持压缩内容，但实际上并不支持。一些压缩服务器组件足够智能，不会向这些浏览器发送压缩数据。在实践中，这并不足以构成值得真正担忧的问题。


  让我们来看看如何在三种主流服务器上启用压缩：Apache、微软 Internet 信息服务 (IIS) 和 Tomcat。


  ## 在 Apache 网络服务器中启用压缩


  如果您运行的是 Apache 网络服务器 1.3 版本，则应安装并启用 `mod_gzip` 模块，该模块可在 [`sourceforge.net/projects/mod-gzip/`](http://sourceforge.net/projects/mod-gzip/)
  在线获取。如果您运行的是 Apache 2.*x* 版本，则应配置 `mod_deflate` 模块，该模块已包含在 Apache 安装包中。关于 `mod_deflate`
  的完整说明可以在线查阅 [`httpd.apache.org/docs/2.0/mod/mod_deflate.html`](http://httpd.apache.org/docs/2.0/mod/mod_deflate.html)。基本配置非常简单，只需在您的
  `apache.confd` 文件中输入以下内容：


  ```

  AddOutputFilterByType DEFLATE text/html text/plain text/xml text/javascript text/json

  ```


  ## 在 IIS 中启用压缩


  如果您运行的是微软 IIS 7 版本，某些文件会默认压缩。但是，您应该通过执行以下命令（从服务器命令行）为所有文件启用压缩：


  ```

  appcmd set config -section:urlCompression /doDynamicCompression:true

  ```


  不幸的是，在微软 IIS 6 版本中启用 gzip 压缩并非如此简单。这里不列出所有详尽步骤，而是请您参考以下说明来启用这个出色的性能特性：[`www.wwwcoder.com/main/parentid/170/site/3669/68/default.aspx`](http://www.wwwcoder.com/main/parentid/170/site/3669/68/default.aspx)。


  ## 在 Tomcat 中启用压缩


  在 Tomcat 中启用同类型的压缩与其他技术一样简单。以下是将要添加到您的 `server.xml` 文件中的一行代码：


  ```

  compression="on"

  ```


  现在，我们已经了解了一些重要的网络服务器更改，用以提高内容进入浏览器时的速度。接下来，让我们看看在前端（浏览器本身内部）可以做些什么，以确保您的页面尽可能快地加载。


  '
- '# 为性能调整 HTML


  您可以实现的大部分性能改进都可以通过更改前端代码来完成。我们将从每个网页的基础部分开始讨论前端性能：即标记文档的 HTML。


  您可能想知道如何精简一个可能已经是应用程序中最小的文件之一，但请相信我，这是可行的，而且是值得的。HTML 页面是下载所有其他资源的关键。它包含了所有用于布局和行为的外部文件的引用，因此，HTML
  加载得越快，它就越不会成为下载其他资源的瓶颈。除此之外，您还可以调整 HTML 以利用某些浏览器行为，从而更快地将页面显示在屏幕上。


  在本书的第 1 部分，我建议了一些 HTML 的最佳实践，其中一些本身就对性能友好。这些包括：编写格式良好的 XHTML，以防止浏览器猜测每个标签的结束位置；以及分别使用
  `<link href="">` 和 `<script src="">` 标签引用外部的样式表和 JavaScript 文件，以利用浏览器缓存。在此，我们将探讨通过更改
  HTML 内容来提高浏览器性能的其他方法。


  ## 使用 HTML Tidy 缩减 HTML 文件大小


  当您的网页浏览器读取您的 HTML 文件时，它会解析文件中包含的标签，并将其转换为内部对象，然后根据您的样式表对这些对象应用布局和设计。请注意，此解析步骤只关注
  HTML 中的标签，而忽略这些标签周围的任何格式或间距，但标签内部（如段落标签内的文本）除外。尽管看起来是空白，每个空白字符（单个空格、制表符或换行符）在您的
  HTML 文件中都代表一个字节的数据。对于一个大型 HTML 文档，将所有冗余空格加起来，可能会发现总文件大小的 25% 左右都被浏览器实际上会忽略的冗余数据占据。如果您能够移除这些空格字符，就可以减小文件大小，从而使
  HTML 文件更快地加载到浏览器中。


  您并不希望从您日常工作的原始 HTML 中移除空白字符，因为那样会使维护变得极其困难（您将无法确定标签的嵌套关系）。您应该将没有空白的文件副本部署到在线网络服务器上，同时保留完整的
  HTML 源代码用于开发。


  一个能够自动剥离这些不必要空白字符以及 HTML 注释（对最终用户无益）的工具叫做 HTML Tidy。它最初由 W3C 组织的 Dave Raggett 开发，现在由开源社区维护并持续改进。您可以在自己的电脑上运行这个工具，或者，如果您与其他开发人员一起工作并设置了自动化构建环境，则可以自动化运行该工具处理源代码
  HTML，并覆盖生成的用于部署的 zip 或包文件中的同名文件。关于这个优秀工具的更多细节，可以在 [`tidy.sourceforge.net/`](http://tidy.sourceforge.net/)
  找到。


  ## 在 HTML 末尾引用 JavaScript 文件


  常见的网站开发实践和大多数教程都告诉您，应该在 HTML 文档的 `<head>` 部分引用外部的 JavaScript 文件。但是，通过在标记的最后、即 `</body>`
  标签之前引用这些文件，您可以提高页面的性能。


  在正常情况下，当您的网页被加载和渲染时，浏览器会同时下载多个文件，例如样式表和图片。但当浏览器遇到引用的外部 JavaScript 文件时，情况并非如此。在这种情况下，浏览器通常会阻塞任何其他页面组件的下载，直到该
  JavaScript 代码被加载并执行完毕。由于 JavaScript 可以通过 DOM 动态改变网页内容，因此这条规则对于确保这些操作按照开发者指定的顺序发生非常重要。如果两个外部
  JavaScript 文件被读取，并且下载速度较快的第二个脚本在第一个之前执行，这是不可接受的。


  请查看以下代码，它展示了一个简单 HTML 页面的 `<body>` 内容：


  ```html

  <body>

  <h1>JavaScript 内容阻塞测试</h1>

  <img src="image1.jpg" alt="" />

  <script type="text/javascript">

  document.write((new Date()).toString());

  </script>

  <img src="image2.jpg" alt="" />

  </body>

  ```


  当典型的浏览器遇到这段代码时，它会开始逐个标签地渲染页面。




  时间，从 `<h1>` 标签开始。当遇到 `<img>` 标签时，浏览器开始下载所引用的图片文件，并按照源代码顺序继续处理下一个标签。下一个标签是 `<script>`
  标签，因此浏览器暂时停止解析，读取并执行该标签的内容，然后才继续加载下一个标签中引用的图片。


  由于 JavaScript 在操作 HTML 页面布局和内容方面非常强大，如果在脚本执行期间页面其余部分继续渲染，你可能会遇到基于页面下载速度以及浏览器渲染和
  JavaScript 引擎性能的意外行为。你永远无法保证脚本在你每次刷新页面时都会在同一时间执行。为了让编写脚本时获得预期的可靠行为，浏览器在解释和执行脚本时暂停渲染页面的剩余部分几乎是必不可少的。


  假设为了便于维护并利用浏览器对这些文件的本地磁盘缓存，你已经将所有脚本移入外部文件。如果你在 HTML 文档的 `<head>` 中引用这些外部文件，浏览器将在读取和执行这些脚本时暂停下载和渲染页面的任何其他部分。由于浏览器在处理
  `<body>` 标签之前会先读取 `<head>` 标签的内容，这将减慢页面向用户渲染的速度。显然，脚本越大，用户等待访问页面的时间就越长。只需将外部脚本引用移到
  HTML 文件的末尾，即紧邻 `</body>` 标签之前，你就可以避免阻碍页面其余部分的下载和渲染，从而为最终用户提升性能。


  **注意** 一些较新版本的浏览器在等待 JavaScript 文件下载时不再暂停下载其他资源，但这些脚本的执行始终按照 HTML 文档中指定的顺序进行。


  **减少 HTTP 请求数量**


  由于网络几乎总是网页性能的最大瓶颈，因此从任何网页引用的组件和外部文件越少，浏览器与服务器之间用于获取这些文件的通信就越少。你可以使用两种主要技术来实现减少来自服务器的文件请求数量的目标：合理规划项目结构和尽可能合并文件。


  良好的划分与结构


  首先，你需要确保外部样式表、脚本和资源具有合理的结构，确保在每个页面上只加载渲染该页面所必需的代码。例如，你可能希望将所有通用样式规则分组到一个样式表文件中，然后再为任何页面或组件特定的样式规则准备额外的样式表文件。通用样式表文件将在第一次被请求时下载并缓存，而来自网站内不同页面的对该文件的后续请求将使用本地缓存的副本，从而在后续页面上节省下载时间。


  合并文件


  根据基本经验，文件越少，HTTP 请求越少，页面渲染速度越快。每个文件除了 HTTP 头部（隐藏在文件开头）之外，还有自己的头部部分。对于文本文件（如 HTML
  文件、样式表或 JavaScript 文件），这个头部部分通常不包含太多信息；但对于其他类型的文件，它可能包含大量额外信息。例如，摄影图片文件的隐藏头部可能包含版权信息和相机设置。找到合并相关文件的方法将减少文件头部的大小以及浏览器与服务器通信的请求次数。这可能会增加首次请求时下载单个文件所需的时间，但会减少总体下载的数据量。如果你的脚本是分散的，你可以将多个独立的
  JavaScript 文件合并成一个文件。同样的方法也适用于样式表文件。


  这也会减少 HTML 文件中的代码量，因为你需要引用的外部文件会更少。如果你与其他开发人员合作，并且可以使用自动化发布管理工具，你应该能够将其配置为自动将所有
  CSS 文件和所有 JavaScript 文件分别合并成两个单一文件。


  关于此技术的一个警告是，它可能与上一节中关于确保文件可缓存的建议相矛盾。你不想在每个不同的页面请求时都向浏览器重复下载相同的代码，因为这会导致从服务器请求比必要更多的数据。请记住选择一条路径，这条路径能够实现最少的浏览器与服务器通信，并最大程度地使用本地缓存文件。通常，我会引用以下文件：


  -   两个外部样式表文件：一个全站通用文件和一个页面特定文件

  -   两个外部 JavaScript 文件：一个用于平滑跨浏览器不一致性并添加有用实用方法的 JavaScript 库文件，以及一个站点特定代码文件


  如果你在网站中引用了多个第三方 JavaScript 文件，请将它们全部合并到一个文件中，以便在首次下载后从缓存中加载它们。


  **不要从首页加载所有资源**


  你的首页通常是访问者访问你网站时看到的第一个页面。你需要通过页面布局和性能给访客留下良好的印象。如果渲染你的首页到可用状态需要 10 秒钟，访客很可能不想继续浏览你的网站，因为他们可能会认为每个页面都需要那么长时间才能加载。理想情况下，一旦服务器开始发送第一个响应，你的网页应在大约
  4 秒内加载完毕。为 Akamai 进行的一项近期研究（[`www.akamai.com/`](http://www.akamai.com/)）表明，75% 的用户不会返回加载时间超过
  4 秒的网站，并且页面加载时间是他们在网上遇到的主要挫折来源之一——这恰恰是你试图避免的情况。


  通常，首页是网站上访问最频繁的页面，并且通常只有相当小比例的用户会从该页面进入网站深处。这些用户可能已经失去兴趣、意外访问了错误页面，或者希望他们已经从首页获取了所有需要的信息，因此无需进一步深入网站。




  '
- '# 性能调优


  你可能会决定，为了加速网站其他页面的加载速度，从首页加载整个网站的所有 CSS 和 JavaScript 文件。这些文件随后会存储在浏览器缓存中，因此后续页面请求会更快。不幸的是，用这种方式加重网站入口页的负担，会导致下载大量不必要的数据，从而拖慢网站最重要页面的渲染速度。在首页上，只引用你绝对需要的内容即可，因为从性能角度来看，首页比其他任何页面都更需要做到完美。


  ## 减少域名查询次数


  如前一章所述，DNS 数据库将常见的域名（例如 `www.google.com`）与 IP 地址（例如 `216.239.51.99`）关联起来，网络设备使用这些
  IP 地址将数据从你浏览器所在的位置，路由到你想访问的网络服务器所在的另一个位置。


  每当你的 HTML、CSS 或 JavaScript 中引用的某个文件，向位于不同域名的文件发出请求时，你的浏览器都需要执行一次 DNS 查询，以找到新域名的
  IP 地址并访问它。每次这样的查询都需要时间，大约在 20 到 120 毫秒之间。因此，在最坏的情况下，如果你从八个不同的域名请求文件，仅查询本身就可能需要 1
  秒钟才能完成。考虑到你试图在约 4 秒内下载所有资源并让页面正常运行，这已经是非常长的时间了。


  实际上，浏览器会将 DNS 查询结果缓存一段时间，以帮助提高后续文件请求的性能。然而，这个缓存信息的有效时长因浏览器而异。例如，在 IE 中，这个查询结果通常会被缓存
  30 分钟。在 Firefox 中，查询结果仅缓存 1 分钟。这些数值都是名义上的、完全任意的，由浏览器制造商自行决定。


  通过跨多个域名引用文件，你会给页面带来性能开销。另一方面，为了避免 HTTP cookie 随所有文件请求一起发送，将某些资产放在与 HTML 代码本身不同的域名下是有利的。因此，你需要找到一个折中方案。建议用于文件托管的独立域名不要超过两到四个。超过这个数量，DNS
  查询的开销相对于其本意带来的性能提升而言，就成了过重的性能负担。


  > **注意：** 你可以将所有文件引用指向多个域名的已解析 IP 地址，以避免执行 DNS 查询。这种技术的缺点是不够灵活或难以维护——如果你想将服务器迁移到其他
  ISP 或位置，就需要更新所有页面。DNS 提供了一种便捷且必要的重定向服务。你只需更新域名数据库中的指针，而不必更新和重新部署所有页面。


  ## 跨域名拆分组件


  HTTP 1.1 规范中有一项建议，涉及浏览器从同一域名同时并行下载文件的数量：建议限制为两个并发文件。一些浏览器严格遵守这一限制；另一些浏览器则允许从同一域名同时下载超过两个文件。表
  4-1 显示了最常见浏览器中每个域名允许的并发下载数以及允许的总并发下载数。


  **表 4-1.** *各浏览器并发文件下载数量*


  | 浏览器 | 每个域名并发下载数 | 最大并发下载数 |

  |---------|---------------------------------------|--------------------------------|

  | Internet Explorer 6 | | |

  | Internet Explorer 7 | | |

  | Internet Explorer 8 | | |

  | Firefox 2 | | |

  | Firefox 3 | | |

  | Opera 9.6 | | |

  | Google Chrome | | |

  | Safari 3 | | |

  | Safari 4 Beta | | |


  你可以看到，浏览器在*每个域名*的并发请求数量上是有限制的。因此，我们可以设置另一个域名，将其 DNS 记录指向与第一个域名相同的 IP 地址——因为限制是按域名而非
  IP 地址来的——这样两个域名都引用同一台服务器上的相同代码。


  通过以这种方式在可用域名之间分配资源，你可以为页面带来潜在的巨大性能提升。但不要忘了前一节讨论的建议限制：使用两到四个独立域名，以避免 DNS 查询带来的性能负担。


  > **提示：** 你的域名不必是顶级域名，可以是子域名（例如 `http://assets.mydomain.com/`），这样你无需向域名注册商购买新的域名。


  ## 避免链接重定向


  如前一章所述，HTTP 重定向通常发生在浏览器请求一个在服务器上已不存在的文件时。在这种情况下，Web 服务器通常会提供一个重定向消息，指向所请求文件的新位置。


  在这种场景下，浏览器与服务器的通信量翻倍。首先，浏览器请求缺失的文件，服务器返回正确的位置。然后，浏览器向正确的 URL 再次请求该文件，服务器返回文件内容。


  由于 Web 应用程序中最大的性能瓶颈之一是浏览器与服务器之间的通信网络，因此增加特定文件请求的流量相当于降低了应用程序的性能。此外，大多数浏览器不会缓存服务器提供的重定向信息，因此，如果你请求的路径例如是
  `http://google.com/`，而该服务器将所有流量重定向到 `http://www.google.com/`，那么该页面的所有外部文件引用都会发生一次重定向，这可能会给页面加载时间带来巨大的性能损耗。如果你知道服务器上某个文件的位置已经改变，并且你正在通过旧
  URL 访问该文件，请务必修改链接以指向文件的新位置。


  你可能在不知情的情况下链接到了重定向。许多开发者添加链接时，末尾没有包含斜杠字符（`/`），例如 `http://www.google.com`。省略这个尾部斜杠会导致许多
  Web 服务器发出 HTTP 重定向消息，指向包含该斜杠的 URL：`http://www.google.com/`。为了提高链接的响应速度，请在所有不直接指向文件名的链接末尾添加斜杠字符。


  ## 减少 HTML 元素数量


  页面上的 HTML 元素数量不仅影响 HTML 下载到浏览器所需的时间，还会影响 JavaScript 代码的性能，以及浏览器渲染引擎将 CSS 应用到页面上的速度。


  对性能尤其造成负担的是 HTML 结构的嵌套层级。嵌套越复杂、越深，浏览器的渲染引擎就需要做更多工作来理解结构。一个轻量级的结构，嵌套深度仅有三到四层，相比深层结构会提供更好的性能。


  页面中的每个 HTML 元素都会通过 DOM 呈现给 JavaScript。浏览器自身会根据页面上的元素创建 DOM 引用，并且这些引用被组织成与 HTML 结构相匹配的层级结构。




  文档的结构越复杂，或元素越多，浏览器生成`DOM`的过程就越长，通过`JavaScript`访问单个元素所需的时间也越长。


  在构建`HTML`时，请仔细考虑每个标签。思考它是否真的有必要存在。如果你引入它仅仅是为了实现布局效果，应尽可能尝试通过`CSS`达到相同的目的。如果你引入了稍后要用`JavaScript`填充的虚拟元素，请考虑使用`JavaScript`创建这些元素并通过`DOM`将它们注入到页面中。


  ## 不要引用不存在的文件


  正如你已经看到的，未返回预期响应的`HTTP`请求是浪费资源的；它们占用了`Web`服务器和浏览器的资源，却收效甚微。


  在审查网站性能时，我经常观察到某些资源的请求返回`HTTP 404`错误，这意味着所请求的文件在服务器上不存在。在许多情况下，这些请求的文件是`CSS`类中引用的背景图片，而图片文件本身已被移除——这是开发过程中遗留的问题。由于背景图片不像前景图片那样容易被注意到，它们经常在`CSS`文件中被无意中保留引用。浏览器仍然会请求这些图片，而服务器则会返回`404`错误。


  对于某些网站，开发者或`Web`服务器会创建一个自定义错误页面，该页面通常与网站其他部分的设计和布局相匹配。这对用户来说很棒，因为这类页面通常包含指向他们本想访问但输错`URL`的页面的链接，从而改善了他们的网站体验。然而，通常`HTTP
  404`错误的`HTML`代码会被返回，但不会显示。浏览器必须为每个错误的文件请求下载此错误页面的`HTML`。它不会只缓存一次并在每次不同请求时使用，因为每个失败资源的`URL`都会不同。浏览器随后会尝试将`HTML`解释为图片、样式表或`JavaScript`文件并失败。这种特定情况会增加大量不必要的性能开销。为避免这种情况，请审计你的页面，检查每一个被引用的文件以确保其存在。


  别忘了，浏览器一次只能请求有限数量的文件。将这一限制浪费在没有任何实际收益的请求上，会降低`Web`应用程序的性能。


  > **注意**：如果页面请求的`JavaScript`文件在服务器上不存在，并且服务器返回了错误页面而不是请求的文件，浏览器将在等待错误页面内容下载时暂停对页面的解析。这会加剧引用不存在文件的影响。


  ## 减小`HTTP Cookie`的大小


  从浏览器发送到服务器的每个`HTTP`请求消息中都包含与该域名关联的`HTTP cookie`数据。这样做是为了让客户端（通过`JavaScript`）和服务器（通过任何后端处理）都能访问这些信息，以便为特定用户定制网站。显然，这些数据会占用请求消息中的空间。由于每个被请求的文件都会携带这些数据，因此它会增加大量很少被使用的额外信息，通常只有返回`HTML`文档的页面才会用到。


  通过确保`cookie`中存储的数据量较小，可以减少每个`HTTP`请求消息中发送的数据量，并且服务器能更快地收到消息。


  考虑在`HTTP cookie`中仅包含一个简单的唯一用户标识符，并将其他信息存储在服务器的数据库中，使用该唯一标识符作为键来查找这些额外信息。


