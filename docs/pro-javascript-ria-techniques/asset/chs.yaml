  ```\n\n![图片 31](img/index-305_1.png)\n\n# 第 8 章 ■ 表单控件\n\n**281**\n\n作为这个例子的扩展，你可以在一个页面上放置两个日历小部件，并编写代码实现：选中其中一个的日期会强制改变另一个。为此，你需要监听第一个日历实例触发的某个事件，并利用该事件在第二个日历上触发相应事件。\n\
