  \n```javascript\n// 使用示例\n// 将库实例化为单例，以便在页面中使用\n$ = new $();\n\n// 点击页面任意位置将输出鼠标指针的当前坐标\n\
  $.Events.add(document.body, \"click\", function(e) {\n  alert(\"鼠标点击的位置：'x'坐标为 \"\
  \ + e.pageX + \"，'y'坐标为 \"+ e.pageY);\n});\n```\n\n## 使用 Ajax 按需加载内容\n\n大多数 RIA\
  \ 的一个基本功能是无需刷新页面即可直接与 Web 服务器通信。这使得 Web 应用程序的行为更像桌面应用程序，可以在后台加载和保存数据，并独立地更新页面的各个部分。\n\
  \n`异步 JavaScript 和 XML`（简称 Ajax）通常是指通过 JavaScript 从远程 Web 服务器下载或发送内容的实践。尽管名称中提到了\
  \ XML，但该技术实际上并不依赖 XML 格式的数据进行通信；实际上，任何类型的内容都可以传输或接收。术语*异步*意味着，在加载内容时，脚本的其余部分仍可继续执行——代码不会停下来等待内容加载完成后再继续。\n\
  \n> **注意** 作为一种安全措施，使用 Ajax 技术时，浏览器只允许你访问与当前执行代码的页面位于同一域名下的内容。许多开发者通过在其 Web 服务器上包含一个服务器端脚本来解决这个限制，当向该脚本传递一个\
  \ URL 作为查询字符串参数时，它会加载该 URL 的内容并将其传递回页面上的 Ajax 请求。\n\n别忘了在编写代码时，如果你通过此技术提供了执行操作或加载某些内容的方法，那么在相关情况下，同样的操作必须能够仅通过\
  \ HTML 完成。例如，如果你正在创建一个 Web 邮件客户端，你应该先构建一个能够通过 HTML 正常运行的应用程序，然后再添加 JavaScript 和\
  \ Ajax 技术，将其转变为 RIA。\n\n让我们在你的`$`库中添加一些 JavaScript 方法，用于处理浏览器与 Web 服务器之间的交互。如代码中的注释所述，有几个跨浏览器障碍需要克服。清单\
  \ 2-12 演示了如何以跨浏览器的方式动态加载内容。\n\n## **86**\n第 2 章 ■ 面向富互联网应用的 JavaScript\n\n**清单 2-12.**\
  \ *使用 Ajax 动态加载内容*\n\n```javascript\n// 在$库中定义一个名为 Remote 的新命名空间，用于存储\n// 我们的 Ajax\
  \ 方法\n$.prototype.Remote = {\n  // getConnector 方法返回用于通过 JavaScript 执行\n  // 动态浏览器-服务器通信的基础对象\n\
  ```\n\n```javascript\ngetConnector: function() {\n\n    var connectionObject = null;\n\
  \n    if (window.XMLHttpRequest) {\n\n        // 如果 W3C 支持的请求对象可用，则使用该对象\n\n   \
  \     connectionObject = new XMLHttpRequest();\n\n    } else if (window.ActiveXObject)\
  \ {\n\n        // 否则，如果 IE 专有对象可用，则使用该对象\n\n        connectionObject = new ActiveXObject('Microsoft.XMLHTTP');\n\
  \n    }\n\n    // 两个对象包含几乎相同的属性和方法\n\n    // 因此只需返回当前浏览器支持的正确对象即可\n\n    return\
