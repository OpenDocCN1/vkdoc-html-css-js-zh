  \n#### 滑块控件\n\n你可能想添加到表单中的另一个有用控件是滑块。与列表相比，这类控件能为选择数值提供一种更具视觉描述性的方法。它适用于数值以等量递增且位于固定范围内的场景。\n\
  \n为了演示如何为表单构建滑块控件，我们将逐步创建图 8-7 所示的滑块。该滑块上方是一个 `<select>` 下拉框，作为多媒体播放页面的音量选择器。该列表包含\
  \ 11 个选项，代表从 0 到 100、步进为 10 的数值，其中 0 由“静音”选项表示，100 由“最大”选项表示。\n\n**图 8-7.** *一个滑块和与其连接的\
  \ `<select>` 下拉框，共同表示音量控件*\n\n`<select>` 下拉框下方的滑块控件提供了另一种设置音量的方式。用户可以沿着控件左右点击并拖动三角形手柄元素，手柄会吸附到控件顶部显示数值正下方的位置。当用户释放鼠标按钮时，程序会获取选中的数值并更新\
  \ `<select>` 下拉框以与之匹配。反之，如果用户从下拉框中选择了一个数值，滑块应更新到正确的位置。\n\n### 构建滑块\n\n与上一节构建日历小部件的方式类似，你将使用观察者模式来构建滑块控件。你将创建两个完全独立的代码块：一个用于管理和操作数据，另一个用于管理页面上显示的小部件。两者仅通过发布的事件相互连接，这些事件由主滑块控件构造函数管理。清单\
