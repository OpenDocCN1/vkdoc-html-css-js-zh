- '# HTTP 方法概述


  -   `GET`：从指定资源请求数据。这是 Web 上最常用的操作。

  -   `POST`：将数据发送回服务器，数据包含在请求消息本身中。此操作通常用于将 HTML 表单中的数据发送回服务器进行处理。


  ## HTTP 请求方法


  | 动作 | 描述 |

  |--------|-------------|

  | `HEAD` | 与 `GET` 相同，区别在于所请求的 HTML 页面的正文不会随响应一起发送回。如果你只需要知道响应附带的元数据，而不是响应本身，或者你只是想证明特定
  URL 上的资源确实存在，可以使用此方法。 |

  | `PUT` | 用于更新服务器上的 URL 资源，在许多方面与 `POST` 类似，但仅当服务器允许对所请求的 URL 进行操作时才有效。 |

  | `DELETE` | 如果服务器允许对请求的 URL 进行操作，则从服务器删除该特定 URL 上的资源。例如，你无法删除谷歌的主页。 |

  | `TRACE` | 将服务器接收到的请求发送回发送方。这可用于显示客户端和服务器之间连接链中添加、更改或删除了哪些服务器或服务。 |

  | `OPTIONS` | 返回特定 URL 上所有其他可用操作的列表，例如 `DELETE` 和 `PUT`。如果你将 URL 作为通配符 (`*`) 发送，则响应将包含
  Web 服务器软件支持的操作列表。 |


  ## 示例 HTTP 请求


  代码清单 3-1 中的示例 HTTP 请求以如下方式开始：


  ```

  GET / HTTP/1.1

  ```


  它执行一个 `GET` 请求，以便服务器返回所请求页面的 HTML 标记。此处指定的页面为 `/`，表示正在访问的网站的根目录。`HTTP/1.1` 表示此请求中所用语言的版本号。


  ### 请求头


  **Host: `www.google.com`**


  如果你不在消息中同时发送要访问的服务器的域名，那么指定要访问的 URL 为 `/`（根目录）是没有用的。HTTP 请求消息的 `Host` 头指明了该域名。


  **User-Agent:** `Mozilla/5.0 (Windows; U; Windows NT 5.1; en-GB; rv:1.9.0.3) Gecko/2008092417
  Firefox/3.0.3 (.NET CLR 3.5.30729)`


  *User agent* 指的是用于访问网页的 Web 浏览器或软件。请求消息中的这个头条目不仅指定了浏览器名称及其版本号，还指定了浏览器运行的操作系统信息（本例中为
  `Windows NT 5.1`，表示 Windows XP）、操作系统中设置的当前区域设置（`en-GB`，表示英国英语），以及浏览器或操作系统选择添加的任何其他数据。在代码清单
  3-1 中，包含了 .NET 公共语言运行时 (`CLR`) 的版本。通过发送这些信息，服务器可以选择以任何方式使用这些信息——要么将其存储在日志文件中供后续统计分析，要么根据请求数据的浏览器软件类型，用不同的
  HTML 标记进行响应。例如，如果服务器检测到用户代理来自移动设备，则可以在响应中发送更适合此类设备的简化版普通网站标记。不过在实践中，最好不要依赖这些数据，因为它很容易被伪造和篡改。


  **Accept:** `text/html,application/xhtml+xml,application/xml;`


  `Accept` 头包含浏览器接受的**多用途互联网邮件扩展** (`MIME`) 类型列表——这意味着浏览器知道如何将这些类型解释为人类可读的内容。MIME
  类型 `text/html` 表示 HTML，`application/xhtml+xml` 表示 XHTML（尽管在撰写本文时某些 Web 浏览器不识别此类型），而
  `application/xml` 表示 XML 内容。


  **Accept-Language:** `en-gb,en;`


  与 `Accept` 头类似，`Accept-Language` 头告知服务器浏览器中当前配置的语言和区域设置。然后，服务器可以根据此信息决定是否将特定语言或区域设置的数据发送回浏览器。在代码清单
  3-1 中，有两个值：`en-gb` 表示英语和英国区域设置，备用为 `en`，仅表示英语语言，无特定地理区域设置。当然，如果正在访问的网站只有一种语言版本，或者网站开发者希望在不做任何假设的情况下将此选择权交给用户，服务器可能会选择忽略此信息。


  **Accept-Encoding:** `gzip,deflate`


  浏览器支持的特定内容编码类型通过 `Accept-Encoding` 头发送。如果服务器无法支持此列表中传递的编码类型，它将使用自己的标准编码。但是，如果它能够支持其中一种或多种编码类型，则允许将数据压缩后发送给浏览器，确信浏览器能够支持另一端的解压缩。压缩允许用更少的数据表示相同的内容，这意味着浏览器将更快地收到响应。


  代码清单 3-1 中指定了两种不同的压缩算法：`gzip` 和 `deflate`。两种压缩算法都能产生有效的结果，尽管纯文本文件（包括 HTML、CSS 和
  JavaScript 文件）的压缩效率远高于二进制文件（如图像）。这是因为纯文本文件通常包含大量空白字符，这些字符可以被非常高效地压缩。


  **Accept-Charset:** `ISO-8859-1,utf-8;`


  浏览器理解的字符集（即世界各种字母和符号的数据编码）在 `Accept-Charset` 请求头中声明。`ISO-8859-1` 字符集通常称为 Latin-1，可以表示大多数欧洲字符，包括带重音的字母。`UTF-8`
  字符集较新，能够存储几乎所有世界语言的表示形式，使其用途极为广泛且强烈推荐使用。


  **Keep-Alive:** `300`


  `Keep-Alive` 头的值指定了客户端和服务器之间保持连接打开的持续时间（以秒为单位）。此持久打开的连接将用于后续的请求和响应，而不是每次都打开一个新连接。通过保持连接打开，无需每次都重新建立连接，这既耗时又消耗网络资源。代码清单
  3-1 中指定的连接允许保持打开 300 秒，即 5 分钟。


  **Connection:** `keep-alive`


  `Connection` 头指定了此请求的首选连接类型。对于 `HTTP/1.1` 协议，`keep-alive` 是最常见的连接类型。


  **Cookie:** `PREF=ID=64637ffc707d92f4:TM=1222191214:LM=...`


  HTTP cookie 是存储在您计算机上的基于文本的小型数据片段。Cookie 由您访问的网站放置，以便网站能够存储和检索数据，从而为您提供个性化体验。例如，您可能访问
  `http://www.google.com/` 并登录 Gmail 服务。登录过程会在您的机器上存储一个包含标识符值的 Cookie，Google 可以在您后续访问时检索该值以自动登录。


  每个 HTTP 请求消息都会发送与正在访问的特定域名（网站地址）关联的、存储在计算机上的任何 Cookie。在代码清单 3-1 中，代表用户 Google 登录信息的标识符存储在
  Cookie 中，并发送给服务器以自动将用户登录到其帐户。Cookie 可以让用户的生活稍微便利一些。但它们会随每个请求一起发送，因此应保持较小的体积。


