  <stop offset="1" stop-color="#cccccc" />

  </linearGradient>

  <rect x="20" y="20" width="200" height="200" fill="url(#gradient)" />

  <rect x="220" y="220" rx="20" ry="20" width="250" height="100"

  style="fill**:**#330000**;** "/>

  <circle cx="350" cy="120" r="50" stroke="#336699"

