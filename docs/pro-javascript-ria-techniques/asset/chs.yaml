  ```\n/generate-image.php?text=News\n```\n\n## 在 ASP.NET (C#) 中动态生成图像\n\n正如你可能知道的，ASP.NET\
  \ 平台支持多种编码语言。在下面的例子中，我选择使用 C# 语言，尽管将其转换为其他语言应该也相当容易，因为不同语言之间的 API 对象和方法几乎是相同的。\n\
  \n创建一个名为 `generate-image.aspx` 的新 ASPX Web 窗体，然后将代码清单 6-2 中的代码添加到自动生成的后台代码文件 `generate-image.aspx.cs`\
  \ 中。\n\n**代码清单 6-2.** *使用 C# 以自定义字体生成包含文本的图像*\n\n```csharp\nnamespace CustomImage\n\
  {\n    using System;\n    using System.Drawing;\n    using System.Drawing.Text;\n\
