- '# 现在你应当能使用以下图片 URL 格式，在 HTML 和 CSS 中利用自定义字体动态生成图片：


  `/generate-image.jsp?text=News`


  ## 扩展服务端脚本代码例程


  清单 6-1、6-2 和 6-3 中的三个代码示例展示了使用自定义字体在图片中显示文本的基本例程结构。这些代码仍有很大的改进空间。以下是你在选择增强这些例程时可以考虑的一些建议：


  - **防御性编码**：你几乎肯定需要为例程添加一些错误检查代码，以确保查询字符串参数确实被提供。通过消除代码中的假设，可以提升代码的稳定性。


  - **缓存所有生成的图片**：为了提升性能，你应当考虑将每个生成的图片画布保存到磁盘上，或许可以使用与所渲染文本相似的文件名。这样一来，当未来再次请求相同的标题时，你可以检查该图片是否已经生成并存在于磁盘上。通过这种方式加载预计算的图片，可以节省大量的服务器处理能力和时间。


  - **考虑文本换行**：某些需要替换的较长标题可能无法适应浏览器中 Web 应用的布局尺寸。在这种情况下，你需要具备在自定义的字符限制之前的最后一个单词边界处进行文本换行的能力。


  - **添加文本平滑**：PHP、ASP.NET 和 Java 中的某些图形库允许你设置文本的平滑程度，即反锯齿效果。对字体进行平滑处理有助于避免文本边缘出现锯齿和低质量的效果。


  - **添加其他查询字符串参数**：你可能希望某些标题以粗体、斜体、下划线形式显示，甚至使用不同的颜色或替代字体。为何不考虑通过额外查询字符串参数传递给例程，并根据这些参数值来改变文本属性？这比为了应对不同用途而重复代码要好得多。


  ### 使用 Flash 生成自定义字体文本


  Adobe 的 Flash Player 是一款外部浏览器插件，几乎安装在所有最终用户的浏览器中。例外情况包括某些移动浏览器和较旧的浏览器。最新版本的安装统计数据可在
  Adobe 网站 [`www.adobe.com/products/player_census/flashplayer/version_penetration.html`](http://www.adobe.com/products/player_census/flashplayer/version_penetration.html)
  上获取。


  在没有必要的情况下，你必须谨慎使用 Flash Player 或任何其他类型的插件。仅在需要提供浏览器本身不具备的功能时使用它，并且即便如此，也只有在为没有安装该插件的用户提供合适的备用内容时方可使用。使用
  Flash Player 以内嵌字体显示标题正好符合这一要求。如果插件不存在，你可以回退到使用不同但合适的字体来显示相同的标题文本。


  Flash 支持在电影文件中嵌入字体，甚至允许你指定要嵌入字体集中的哪些字符。这意味着你无需为每个电影嵌入所有字符，从而可以节省文件大小。例如，如果你仅向英语观众提供文本，你可以阻止所有扩展字符嵌入到
  Flash 电影中。


  最简单的方法是创建一个包含嵌入字体和动态文本图层的 Flash 电影。然后，该电影将期望从 HTML 接收一个包含待渲染文本的变量，通常通过电影 URL 自身的查询字符串传递给
  Flash。Flash 电影会简单地接收传入的文本，并用提供的文本填充其文本图层，随后使用页面上的嵌入字体进行渲染。


  ### 使用矢量图形生成文本


  许多主流浏览器都支持在浏览器窗口内绘制矢量图形。




  '
- "# 矢量图形与可重用自定义字体组件\n\n将矢量图形视为由线条和曲线构成视觉图像的普通图片。\n\n与其定义图像中的像素，不如从头描述如何通过这些形状来形成一张图片。\n\
  \n通过这种方式描述图像，可以使图像具有分辨率独立性和尺寸独立性。由于你始终知道如何根据描述图像构建方式的数据从头开始生成图像，因此只需改变一个矢量（例如宽度），图像就会自动适应新的空间而不会损失质量。实际上，大多数字体都是在其关联的字体文件中这样描述的，因此调整文本大小不会导致质量损失。在浏览器中绘制字体的方式与在字体文件中创建字体的方式相同，这为在`CSS`中嵌入实际所需字体提供了一种极佳的替代方案，如前所述。\n\
  \n以下浏览器支持各种形式的矢量图形绘制：\n\n- Firefox 1.5 及以上版本\n- IE 6 及以上版本\n- Opera 9 及以上版本\n- Safari\
  \ 3.0 及以上版本（包括 iPhone）\n- Google Chrome\n\n如你所见，这涵盖了当今市场上的大多数浏览器。使用矢量图形是一种极具吸引力且可行的技术，用于以自定义字体呈现文本。我将在第\
  \ 11 章中讨论浏览器内绘制这一主题。\n\n### 使用可重用的自定义字体组件\n\n到目前为止，你应该已经认识到可重用脚本的有用性。正如你所期望的，有一些现成的组件可以以跨浏览器友好的方式将自定义字体标题应用到你的页面中。那些经历过应用本章讨论的技术所带来的痛苦，并成功走出困境的开发者们，已经将他们编写的代码打包，并免费提供给我们在自己的\
  \ RIA（富互联网应用）中使用。\n\n在本节中，我们将介绍一些较流行的预打包组件：`Text2PNG`、`Scalable Inman Flash Replacement`、`Facelift\
  \ Image Replacement`和`Typeface.js`。我建议你研究每一个组件，找到适合你需求的组件，并在你自己的 Web 应用程序中尝试使用。\n\
  \n### Text2PNG\n\n通过使用`Text2PNG`组件（[`text2png.com/`](http://text2png.com/)），你可以将页面上的文本替换为使用所选字体渲染的图像。你可以选择替换特定的文本实例、替换特定标签中的文本，或者替换所有文本。\n\
  \n`Text2PNG`组件通过 Web 服务器动态生成图像。你可以选择自行托管代码的服务器端部分，或者调用托管在开发者服务器上的代码。如果你自行托管代码，在运行\
  \ PHP 4.3 或更高版本的服务器上，你可以使用上传到服务器上特定文件夹的自定义字体。否则，你将仅限于使用开发者服务器上安装的约 200 种预定义字体。\n\
  \n#### Text2PNG 使用示例\n\n在你的页面中设置该组件，只需包含预编写的`JavaScript`代码；编写你的`CSS`以分配你希望使用的字体、颜色和大小；并添加几行你自己的`JavaScript`代码来对你选择的文本执行图像替换。\n\
  \n为了表示图 6-1 示例中的标题，你可以编写以下`HTML`代码，其中`text_script.js`是提供的组件`JavaScript`文件：\n\n```html\n\
  <!DOCTYPE html PUBLIC \"- //W3C//DTD XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
  >\n<html lang=\"en\" xml:lang=\"en\">\n<head>\n    <title>Text2PNG 示例</title>\n\
  \    <link rel=\"stylesheet\" src=\"myExample.css\" type=\"text/css\" />\n</head>\n\
  <body>\n    <h1 id=\"title\">新闻</h1>\n    <h2 id=\"news-headline\">新产品发布：人体传送器</h2>\n\
  \    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>\n    <script\
  \ src=\"text_script.js\" type=\"text/javascript\"></script>\n    <script src=\"\
  my-example.js\" type=\"text/javascript\"></script>\n</body>\n</html>\n```\n\n\n\n\
  在引用的 CSS 文件`my-example.css`中，首先指定你要使用的自定义字体，然后列出大多数浏览器默认字体列表中的可接受后备字体：\n\n```css\n\
  h1 {\n  font-family: 'Sketchy Rockwell', Arial, Helvetica, sans-serif;\n  font-size:\
  \ 1.6em;\n}\n\nh2#news-headline {\n  font-family: 'Silom', Times New Roman, serif;\n\
  \  font-size: 1.3em;\n}\n```\n\n在你的 JavaScript 文件`my-example.js`中，定义你希望用自定义字体文本图像替换的标题、文本或页面部分。有以下三种方法可用：\n\
  \n-   `replace()`：允许你替换单个元素的内容。\n-   `replaceTags()`：允许你替换所有指定命名标签的内容。\n-   `replaceAll()`：允许你替换所有子元素内的内容。\n\
  \n让我们逐一了解每种方法。\n\n> **注意**：请确保在通过 JavaScript 读取 DOM 之后（使用你在第 2 章开始的`$` JavaScript\
  \ 库的`$.onDomReady()`事件）再调用任何 JavaScript 方法。如果你在页面生命周期中过早调用这些文本替换方法，将不会有文本被替换，甚至可能在浏览器中生成\
  \ JavaScript 错误，并向最终用户显示（这是不可接受的！）。\n\n## 替换单个元素\n\n我们首先掌握的方法是`replace()`，它会从页面元素的全部文本内容创建一个\
  \ PNG 图像文件。指定标签内的任何子元素或 HTML 标签都将被移除，替换为文本的图像表示。使用示例 HTML，你可以通过以下方法调用来替换`<h2 id=\"\
  news-headline\">`标签内的标题文本：\n\n```javascript\ntext2png.replace(\"news-headline\"\
  );\n```\n\n此方法期望接收一个表示要替换元素`id`属性的字符串（如上例所示），或一个 DOM 元素，如下所示：\n\n```javascript\n\
  text2png.replace(document.getElementById(\"news-headline\"));\n```\n\n两种方式执行相同的功能，具体使用哪种取决于你。\n\
  \n替换多个特定页面元素与向`replace()`方法传递额外参数一样简单，每个要替换的元素对应一个参数。假设你想替换之前的`<h2 id=\"news-headline\"\
  >`元素，以及另一个页面元素`<h1 id=\"title\">`中的文本。这可以通过一次方法调用完成，如下所示：\n\n```javascript\ntext2png.replace(\"\
  news-headline\", \"title\");\n```\n\n## 替换特定命名标签内的所有内容\n\nText2PNG 内置的`replaceTags()`方法执行与`replace()`方法相同类型的替换，但它会替换所有具有给定标签名的元素。假设像前面的\
  \ HTML 示例一样，你想将页面中的所有`<h1>`和`<h2>`标题标签替换为其文本图像等效项。为此，只需使用`replaceTags()`方法，如下所示：\n\
  \n```javascript\ntext2png.replaceTags(\"h1\", \"h2\");\n```\n\n此方法将替换当前页面上所有指定标签的文本内容，无论每种标签有多少个。这是一种快速便捷的执行替换的方式。传递给此函数的参数数量没有限制，因此你可以选择只替换单个标签的内容，或多个标签的内容。\n\
  \n## 替换所有子元素的内容\n\n`replaceAll()`方法提供了一种简单的方法来替换传递给方法调用的元素下方所有嵌套 HTML 元素的内容。举个例子，假设你的\
  \ HTML 文档中有一个项目符号列表，如下所示：\n\n```html\n<ul id=\"list\">\n  <li>Faster and more efficient</li>\n\
  \  <li>Smaller and lighter</li>\n  <li>Beautiful and elegant</li>\n</ul>\n```\n\n\
  要将其图像等效项替换每个`<li>`标签内的文本，请使用`replaceAll()`方法，并向其传递外围元素的`id`属性值。这样，所有子元素的文本将一次性被替换：\n\
  \n```javascript\ntext2png.replaceAll('list');\n```\n\n此方法也支持多个参数。例如，如果你有两个列表，`<ul\
  \ id=\"list\">`和`<ul id=\"other-list\">`，你可以通过对`replaceAll()`方法的单个调用来替换两组子节点的文本，如下所示：\n\
  \n```javascript\ntext2png.replaceAll(\"list\", \"other-list\");\n```\n\n## 使用 Text2PNG\
  \ 应用额外的文本格式\n\nText2PNG 的`replace()`、`replaceTags()`和`replaceAll()`方法每个都接受一个可选的最终参数，该参数指定为一个\
  \ JSON 对象，用于设置生成文本图像的某些格式属性。在可能的情况下，Text2PNG 将尝试从应用于原始文本的 CSS 中推导出图像的显示格式（在文本被替换之前）。如果没有应用\
  \ CSS 属性，它接着会尝试从传递给方法调用的`options`对象中建立格式（如果设置了的话）。如果这些都不适用，则内部设置默认值以在需要时提供后备格式。\n\
  \n以下示例展示了如何将页面上的所有`<h2>`标签替换为其文本图像等效项，并在此过程中应用一些额外的格式选项：\n\n```javascript\ntext2png.replaceTags(\"\
  h2\", {\n  opacity: 50,\n  bold: 1\n});\n```\n\n应用于生成文本的完整选项列表和 CSS 规则可以在项目网站（[`www.text2png.com/`](http://www.text2png.com/)）的文档中找到。\n\
  \n## Text2PNG 评估\n\nText2PNG 组件最初吸引我的地方之一是它能够从被替换文本的 CSS 中读取并评估应将哪些样式应用于生成的图像。对我来说，样式和视觉信息应存储在我的\
  \ CSS 样式定义中，无论我是否使用 JavaScript 来执行替换，这都完全合理。\n\n通过在我元素的`font-family` CSS 属性中指定我想使用的自定义字体以及一系列替代字体，我以常规方式使用\
  \ CSS。极少数情况下，我的最终用户可能在其浏览器中禁用了 JavaScript，但恰好在其计算机上安装了我指定的自定义字体；在这种情况下，字体将按我预期显示，并且不会进行图像替换。\n\
  \n国际语言通过 UTF-8 字符集得到支持，前提是所使用的自定义字体中存在这些字符。目前存在的唯一限制是仅支持从左到右阅读的文本，因此排除了阿拉伯语和希伯来语等语言。\n\
  \n在使用第三方脚本时，性能始终是我主要关心的问题之一，我很高兴地报告，Text2PNG 的开发者在这方面已做到无微不至。开发者声称在使用其组件的过程中只会发生五个\
  \ HTTP 请求，这包括从最初加载脚本到将最终图像传输回浏览器的全过程。\n\n无论发生了多少次替换，只有一张图像被发送回浏览器，因为脚本使用了 CSS 精灵技术（在第\
  \ 4 章中描述）来将所有要使用自定义字体显示的文本合并到一个图像文件中。不幸的是，CSS 精灵技术目前不适用于 IE 6 或 Opera。然而，返回给所有浏览器的图像都在服务器和浏览器中进行了缓存，其过期日期设置为从图像首次生成之日起十年以后。\n\
  \n大多数浏览器都支持此组件，包括 IE 6 及以上版本、Firefox 2 及以上版本、Safari 3 及以上版本以及 Google Chrome。列表中缺少\
  \ Opera 浏览器。\n\n当 JavaScript 尝试读取应用于页面元素的`font-family`样式时...\n\n\n\nOpera 只会将实际应用的字体返回给脚本。由于自定义字体很可能不存在于用户的机器上，Opera\
  \ 只会返回实际应用的后备字体名称。由于该组件需要能够读取自定义字体的名称，才能请求服务器用该字体在图像中渲染文本，因此在 Opera 中会出现问题。希望未来的\
  \ Opera 更新能解决这个问题，使其用户不再受到影响。话虽如此，由于这纯粹是一种视觉效果，只要存在合适的后备字体，用自定义字体显示相同的文本实际上并非必要，而是可以被视为“锦上添花”。\n\
  \n## 可伸缩的 Inman Flash 替换技术\n\n可伸缩的 Inman Flash 替换技术（`sIFR`）组件最初由 Shaun Inman（[`shauninman.com/`](http://shauninman.com/)）设计，因其灵活性、可复用性以及应用于现有页面的速度而广受欢迎。\n\
  \n该组件依赖于本章前面讨论的 Adobe Flash 技术。要使用它，您必须根据提供的模板创建一个自定义 Flash 电影文件，并将您希望显示的自定义字体以及所需的任何特定扩展字符嵌入到该电影中。创建好\
  \ Flash 电影文件后，在您的页面中引用提供的 JavaScript 和 CSS 文件，然后通过开发者脚本提供的 JavaScript API 执行您需要的特定文本替换操作。\n\
  \n在撰写本文时，`sIFR` 组件的当前完整发布版本是 2.0.7，其输出端的 Flash 电影文件兼容 Flash Player 版本 6（该插件的当前发布版本是\
  \ 10）。另一条独立的开发路线已由 Shaun Inman 授权给另一位开发者 Mark Wubben。`sIFR` 的此版本目前处于早期测试阶段，将成为该组件的第\
  \ 3 版，兼容 Flash Player 版本 8 及以上，使 Web 开发人员能够利用更高版本 Flash Player 中提供的许多排版和文本样式改进。\n\
  \n`sIFR` 第 2 版的完整文档和下载详情可在 [`wiki.novemberborn.net/sifr/`](http://wiki.novemberborn.net/sifr/)\
  \ 找到，第 3 版的信息则在 [`wiki.novemberborn.net/sifr3/`](http://wiki.novemberborn.net/sifr3/)。\n\
  \n### sIFR 使用示例\n\n让我们以图 6-1 所示的页面为目标，使用 `sIFR` 第 3 版来演示一个示例。在 HTML 文件中链接必要的样式表和\
  \ JavaScript 文件，即可引入该组件，如下所示：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML\
  \ 1.0 Strict//EN\"\n \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\">\n<html\
  \ lang=\"en\" xml:lang=\"en\" xmlns=\"http://www.w3.org/1999/xhtml\">\n<head>\n\
  <title>sIFR 3 示例</title>\n<link rel=\"stylesheet\" src=\"sifr.css\" type=\"text/css\"\
  \ />\n</head>\n<body>\n  <h1>新闻</h1>\n  <h2 id=\"news-headline\">新产品发布：人体传送器</h2>\n\
  \  <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>\n  <script\
  \ src=\"sifr.js\" type=\"text/javascript\"></script>\n  <script src=\"sifr-config.js\"\
  \ type=\"text/javascript\"></script>\n</body>\n</html>\n```\n\n假设您已经下载了该组件，并按照说明将所需字体导出到自定义的\
  \ Flash 文件中，那么您现在必须在脚本中引用这些电影文件，以便在页面中使用它们。在组件提供的 `sifr-config.js` 文件中附加几行代码，以引用您嵌入字体的\
  \ Flash 文件：\n\n```\nvar silom = {\n  src: 'silom.swf'\n};\n\nvar sketchyRockwell\
  \ = {\n  src: 'sketchy-rockwell.swf'\n};\n```\n\n请注意，`src` 属性包含 Flash 文件的 URL，该路径是相对于其所在页面的。\n\
  \n在执行任何文本替换之前，下一步是将您的 Flash 电影文件加载到浏览器中。这是为了避免每次替换时都重新加载电影文件。执行此操作，请在 `sifr-config.js`\
  \ 中附加以下代码行：\n\n```\nsIFR.activate(silom, sketchyRockwell);\n```\n\n现在，您就可以实际执行文本替换了。这通过调用\
  \ `sIFR.replace()` 函数来实现，将您的字体分配给您希望替换的页面标签或元素：\n\n```\nsIFR.replace(sketchyRockwell,\
  \ {\n  selector: 'h1'\n});\n\nsIFR.replace(silom, {\n  selector: 'h2'\n});\n```\n\
  \n内置在 `sIFR` 中的选择器引擎相当灵活。除了可以使用逗号分隔多个选择器来同时执行特定字体的多次替换外，您还可以使用以下任意基于 CSS 选择器的选择格式来选择特定的标签和元素：\n\
  \n- `h1`\n- `h1 > em`\n- `h1 em`\n- `.foo`\n- `h1.foo`\n- `#bar`\n- `h1#bar`\n-\
  \ `h1#bar.foo`\n- `#bar.foo`\n- `.foo.baz`\n\n在完成所有必需的文本替换后，您可能需要调整大小，因为在某些情况下，`sIFR`\
  \ 组件无法设置正确的字体大小。如有必要，编辑 `sifr.css` 文件，在文件的 `@screen` 部分末尾附加以下代码：\n\n```\n.sIFR-active\
  \ h1 {\n  visibility: hidden;\n  font-family: Verdana;\n  line-height: 1em;\n  font-size:\
  \ 24px;\n}\n```\n\n当 `sIFR` 脚本初始化时，`.sIFR-active` 类会被添加到页面的 `<body>` 元素中，因此该 CSS\
  \ 规则只有在初始化后才能生效。将文本的 `visibility` 属性设置为 `hidden`，以便在文本替换发生后不再显示原始页面文本。在规则末尾设置显示所用的字体大小。请记住，只有在执行上一步替换时出现显示问题，才需要设置此样式以及除\
  \ `visibility` 之外的任何其他样式。\n\n### 使用 sIFR 应用额外文本格式\n\nAdobe Flash 支持 CSS 的一个子集，这使得您可以通过常规样式表来设置某些文本格式。CSS\
  \ 类 `.sIFR-root` 应用于每个 Flash 电影，允许您自定义电影本身及其内容的样式。由于 `sIFR` 组件（作为 Flash 技术）会保留对被替换元素的任何子元素的引用，因此这些子元素也可以通过\
  \ CSS 在 Flash 电影内部直接设置样式。\n\n例如，假设您正在替换一个列表项元素 `<li>`，并且该标签包含文本和一个嵌套的链接元素 `<a>`。该链接本身也会被传递到\
  \ Flash 电影中，使其继续保持可点击状态，并可以与其余文本设置不同的样式。仅凭这一能力，这种方法就优于许多其他文本替换方法。\n\n默认情况下，自定义的\
  \ Flash 电影文件支持粗体、斜体、下划线和普通文本。字距和行距属性可以通过 JavaScript 和 CSS 配置进行必要的调整。还可以通过进一步自定义\
  \ Flash 电影文件以包含这些效果，或通过 Flash Player 8 及以上版本内置的一系列滤镜来实现额外的文本效果，`sIFR` 使这些滤镜可通过 JavaScript\
  \ 进行配置。这些滤镜包括为文本添加阴影、模糊文本、在文本周围添加发光效果等等。请参阅完整的 `sIFR` 第 3 版文档，了解可用效果列表以及如何在页面中使用它们。\n\
  \n### sIFR 评估\n\n`sIFR` 组件在替换页面上的少数几个标题时效果良好，并且如果您希望使用不同的大小和样式，它也非常灵活。但是，如果您需要在页面上替换超过五到六个标题，则不建议使用此组件。在这种情况下，性能会明显下降，因为浏览器内存被推向极限，导致页面变慢并显著影响页面加载时间。\n\
  \n\n\n\n此组件支持 IE 6 及以上版本、Firefox 2 及以上版本、Safari 2 及以上版本、Google Chrome 和 Opera 9.5\
  \ 及以上版本。一个明显的需求是最终用户的浏览器必须安装 Flash Player 插件。如果检测不到该插件，则不会进行任何替换，并显示原始的浏览器文本，因此您无需担心\
  \ JavaScript 受支持但 Flash 不受支持的情况。\n\n此组件的性能随着每个版本的发布而不断提升。众所周知，Flash 会消耗大量浏览器内存。开发人员已确保导出的每个\
  \ Flash 影片都具有较低的刷新率，以进一步改善这一状况。Flash 影片文件会被缓存在浏览器中，因此它们只需要下载一次，随后即可在后续页面中从缓存中自由重复使用。默认情况下，每个影片文件会消耗约\
  \ 50KB 到 60KB 的磁盘空间，如果文件内嵌入了额外字符，空间占用会更大。经过压缩后，sIFR 版本 3 的 JavaScript 文件本身大小约为 32KB。JavaScript\
  \ 和 Flash 的组合重量使其成为较大的第三方文字替换组件之一。\n\n此组件已经存在了几年，因此可以认为它相当成熟、稳定且支持良好。未来的开发将重点放在，在其他方面，能够将该代码搭载到其他\
  \ JavaScript 库上，包括 jQuery 和 Prototype。这意味着，未来代码重复将减少，并且如果您已经在代码中使用了这些库之一，该组件的 JavaScript\
  \ 体积将大大减小。\n\n再次强调，如果您希望替换的不仅仅是少数几个标题，绝对不要使用此技术，因为对性能的影响可能会让您的最终用户感到相当困扰。\n\n##\
  \ 第 6 章：精美的排版\n\n## Facelift Image Replacement\n\n一个新的组件，Facelift Image Replacement（FLIR，发音为“fleer”），与之前讨论的\
  \ Text2PNG 组件有相似之处。两者都使用服务器端图像生成技术，依赖 PHP 服务器将图像传送到请求的网页。\n\n一个显著的区别是，使用 Text2PNG，您可以免费使用开发者自己的服务器来执行生成操作，但使用\
  \ FLIR，这项服务需要付费（诚然，这个费用仅为每月 1 美元）。\n\n要在您自己的服务器上启动并运行该组件，需要安装 PHP。此外，为了支持某些扩展效果，还需要安装\
  \ ImageMagick（http://www.imagemagick.org/）。\n\n### FLIR 示例\n\n从其在线主页 [`facelift.mawhorter.net/`](http://facelift.mawhorter.net/)\
  \ 下载 FLIR 组件，并将文件安装到您的 Web 服务器上。接下来，将您的 TrueType 字体文件复制到服务器，并在 `config-flir.php`\
  \ 文件中创建一个引用，将字体文件与 CSS `font-family` 值关联起来（文件中提供了一些示例以帮助您入门）。然后，设置您的 HTML 文件，引用\
  \ FLIR 组件的 JavaScript 文件，并包含您自己的 JavaScript 文件以及您自己的 CSS 文件：\n\n```\n<!DOCTYPE html\
  \ PUBLIC \"- //W3C//DTD XHTML 1.0 Strict//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
  >\n<html lang=\"en\" xml:lang=\"en\">\n<head>\n<title>FLIR 示例</title>\n<link rel=\"\
  stylesheet\" src=\"my-example.css\" type=\"text/css\" />\n</head>\n<body>\n<h1>新闻</h1>\n\
  <h2 id=\"news-headline\">新产品发布：人体传送器</h2>\n<p>Lorem ipsum dolor sit amet, consectetur\
  \ adipiscing elit...</p>\n<script src=\"$.js\" type=\"text/javascript\"></script>\n\
  <script src=\"flir.js\" type=\"text/javascript\"></script>\n<script src=\"my-example.js\"\
  \ type=\"text/javascript\"></script>\n</body>\n</html>\n```\n\n现在，配置 FLIR 仅替换您选择的页面元素。在您自己的\
  \ JavaScript 文件 `my-example.js` 中使用以下代码开始：\n\n```\n$.onDomReady(function() {\n \
  \  FLIR.init({\n      path: '/path-to-flir/'\n   });\n   FLIR.auto();\n});\n```\n\
  \n默认情况下，当调用 `FLIR.auto()` 方法时，FLIR 会替换所有标题标签 `<h1>` 到 `<h5>`。但是，可以通过传入一个与您希望替换的元素相对应的\
  \ CSS 选择器数组来覆盖此功能。在此示例中，您可以使用以下代码仅替换您希望使用自定义字体的两个标题：\n\n```\nFLIR.auto(['h1', 'h2#news-headline']);\n\
  ```\n\n默认情况下，FLIR 使用与 Text2PNG 组件相同的技术来确定您希望应用于文本的字体：它会检查您应用于被替换元素的 `font-family`\
  \ CSS 值。然后，使用您在 `config-flir.php` 中的配置，将此 `font-family` 值与服务器上的字体文件关联起来，并在替换后显示正确的字体。\n\
  \n要执行单个替换，或更好地控制显示的文本样式，您可以使用 `FLIR.replace()` 方法，它接受一个可选的参数来定义文本样式。以下是如何对 HTML\
  \ 示例中的 `<h2 id=\"news-headline\">` 标签执行简单的单个替换：\n\n```\nFLIR.replace('h2#news-headline');\n\
  ```\n\n要为生成的文本图像设置更多样式选项，您可以将一个 `FLIRStyle` 对象作为附加参数添加到 `FLIR.replace()` 方法中——在此例中，用于指定所需的确切字体以及让文本多行换行：\n\
  \n```\nFLIR.replace( 'h2#news-headline', new FLIRStyle({\n   cFont: 'silom',\n \
  \  mode: 'wrap'\n}));\n```\n\n有关 `FLIRStyle` 选项的完整列表，请参阅 FLIR 网站上的文档。\n\nFLIR 还拥有一个支持插件的架构，目前有两个可用的\
  \ FLIR 插件：`FancyFonts` 和 `QuickEffects`。这些插件让您可以通过 JavaScript，对替换后的文本使用安装在 Web 服务器上的\
  \ ImageMagick PHP 组件。更多关于使用这些插件或添加您自己插件的详细信息，可以在该组件的网站上找到。\n\n### FLIR 评估\n\n如您所见，FLIR\
  \ 组件与 Text2PNG 组件类似。由于两者都使用相同的 JavaScript 技术来读取应用于页面元素的当前样式，因此它们支持的浏览器也相同：IE 6 及以上版本、Firefox\
  \ 2 及以上版本、Safari 3 及以上版本和 Google Chrome。与 Text2PNG 一样，目前不支持 Opera 浏览器。在其他浏览器中，将显示默认的浏览器文本，仅使用通过\
  \ CSS 确定的备用 `font-family` 值。\n\n此组件的性能评分略低于 Text2PNG，因为 FLIR 不支持 CSS 精灵；每个被替换的标题图像都会单独下载。这意味着可能增加多个\
  \ HTTP 请求和响应，从而降低完成页面的显示速度。（显然，如果支持 CSS 精灵图像，此组件可以得到极大改进，这可能会在未来的版本中添加。）\n\nFLIR\
  \ 的易用性值得称赞。在自定义 CSS `font-family` 字体名称与服务器上的特定 TrueType 字体文件之间建立直接链接非常轻松。默认的替换机制会替换最标准的\
  \ HTML 标题标签，这捕获并简化了大多数开发人员对此类组件的期望。请记住，像这样的第三方组件设置和使用越容易，后续的维护任务通常也越简单。\n\n为您的页面提供\
  \ FLIR 支持的 JavaScript 包含文件，经过压缩后大小约为 16KB。服务器生成的每个图像大小不一，但平均每个图像通常约为 2KB，这使得此组件相对轻量。\n\
  \nFLIR 是一个相当年轻的组件。这未必是一个问题，但它可能意味着\n\n\n\n\n该社区支持将较为有限，直到其存在时间更长一些，并解决更多漏洞为止。\n\n\
  总体而言，该组件运用了一些巧妙的想法来生成样式精美的标题。\n\n然而，其性能并非最佳。此外，它要求你的网络服务器运行 PHP。\n\n## Typeface.js\n\
  \n免费的 Typeface.js 组件（http://typeface.neocracy.org/）是近期加入在线自定义字体文本渲染工具集的新成员。目前它仍应被视为一个进行中的项目，但基于本章前面介绍的矢量图形技术，它展示出作为一款简单组件的前景。\n\
  \n字体文件从 TrueType 格式转换为一个 JavaScript 文件，该文件描述了字体的各种字形和属性。随后，这些信息通过 JavaScript 程序转换为矢量，并绘制在页面上，以替代你想要替换的文本。你可以使用该项目网站上的工具将字体文件转换为\
  \ JavaScript 格式。\n\n### Typeface.js 使用示例\n\n让我们用图 6-1 中的标题来演练本章中一直在做的相同示例。从 HTML\
  \ 开始：\n\n```\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Strict//EN\"\n\"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd\"\
  >\n<html lang=\"en\" xml:lang=\"en\">\n<head>\n<title>Typeface.js 示例</title>\n<link\
  \ rel=\"stylesheet\" src=\"my-example.css\" type=\"text/css\" />\n</head>\n<body>\n\
  <h1>新闻</h1>\n<h2 id=\"news-headline\">新产品发布：人类传送器</h2>\n<p>Lorem ipsum dolor sit\
  \ amet, consectetur adipiscing elit...</p>\n<script src=\"typeface-0.11.js\" type=\"\
  text/javascript\"></script>\n<script src=\"sketchy-rockwell.typeface.js\" type=\"\
  text/javascript\"></script>\n<script src=\"silom.typeface.js\" type=\"text/javascript\"\
  ></script>\n</body>\n</html>\n```\n\n包含您自己的样式表文件 `my-example.css`，以定义您的字体和其他样式：\n\
  \n```css\nh1 {\nfont-family: 'Sketchy Rockwell', Arial, Helvetica, sans-serif;\n\
  font-size: 1.6em;\n}\n\nh2#news-headline {\nfont-family: 'Silom', Times New Roman,\
  \ serif;\nfont-size: 1.3em;\n}\n```\n\n你可能想知道为什么你没有像处理本章讨论的其他第三方组件那样，包含一个单独的 JavaScript\
  \ 文件来初始化 Typeface.js 脚本并执行特定的替换操作。默认情况下，Typeface.js 会替换所有标题标签（`<h1>` 到 `<h6>`），这些标签的文本已通过\
  \ CSS 指定使用通过 Typeface.js 网站生成的 JavaScript 字体描述文件加载的自定义字体。请记住，矢量与分辨率和尺寸无关，可以在不损失质量的情况下调整大小。这意味着通过单个\
  \ JavaScript 文件中的字体表示，所有尺寸的文本都能得到支持。如果字体是以这种方式描述的，Typeface.js 将用基于矢量的渲染来替换文本，以显示你的自定义字体。如果未指定自定义字体，则不会发生替换。\n\
  \n现在，假设你想要替换 HTML 中不在标题标签内的某些文本。谢天谢地，你仍然不需要编写任何 JavaScript 来实现这一点。假设你的页面上有一个段落标签内的文本想要替换：\n\
  \n```html\n<p class=\"coming-soon\">该产品即将推出！</p>\n```\n\n通过该元素的 CSS 属性 `font-family`\
  \ 设置你想要显示的自定义字体名称，并确保包含对该字体 JavaScript 表示的引用。\n\n要告诉 Typeface.js 执行替换，只需将 CSS 类名\
  \ `typeface-js` 添加到该元素，如下所示：\n\n```html\n<p class=\"coming-soon typeface-js\">该产品即将推出！</p>\n\
  ```\n\n一旦页面加载完毕，替换操作就会执行。\n\n通过 CSS 样式启用功能，你避免了需要一个单独的 JavaScript 文件来包含执行此替换的代码。\n\
  \n### Typeface.js 评估\n\nTypeface.js 是一个较新的组件，使用了相当先进的浏览器技术。矢量绘制技术非常适合表示 TrueType\
  \ 字体文件，因为后者本身就是矢量定义。然而，浏览器性能是当前影响该技术采用的主要问题。\n\n浏览器支持情况相当不错，包括 IE 6 及以上版本、Safari\
  \ 2 及以上版本、Firefox 1.5 及以上版本以及 Google Chrome。请注意，Opera 再次从支持列表中缺席，原因与本章涵盖的其他组件（除了\
  \ sIFR）相同。\n\n在大多数浏览器中，矢量绘制性能明显较差，尤其是在 IE 6 和 7 中。\n\n在矢量图形的浏览器性能全面改善之前，我建议使用 Typeface.js\
  \ 进行文本替换时，每页限制在五到六次左右。超过这个数量，你就有可能激怒最终用户。\n\nTypeface.js 的 JavaScript 文件压缩后大约为 10KB，每个字体定义文件预计约\
  \ 60KB 到 70KB。由于该组件仅为最终用户带来微小的视觉变化却需要相当沉重的下载负担，请谨慎选择。\n\n该组件以及另一个使用相同技术且非常相似的组件——Cufón（http://wiki.github.com/sorccu/cufon/about/），将是未来几个月或几年内值得关注的焦点。随着浏览器变得更加强大，Web\
  \ 开发者可以利用的能力也随之增加，从而帮助我们改善最终用户的体验。\n\n### 总结\n\n本章介绍了几种不同的技术，并评估了一系列第三方组件，这些组件允许你在网页上使用浏览器本身不直接支持的自定义字体显示文本。现在，你应该能够自行决定哪种技术最适合你和你的\
  \ Web 应用程序。利用该技术为你的网页添加美观的排版文本，同时尽量减少对网站性能、可访问性和可维护性的影响。当然，如果这些技术或组件都不适合你，请随意尝试自己发明的其他技术。如果你创造出有效的东西，请与\
  \ Web 开发社区的其他成员分享你的经验，这样我们都能从中受益。\n\n在下一章中，我们将研究用于在 Web 应用程序中显示和控制音频与视频播放的不同方法和组件。\n\
  \n## 第 7 章：多媒体播放\n\n利用互联网向消费者广播音频和视频的愿望几乎与 Web 本身的历史一样悠久。多媒体浏览器插件（通常局限于某些制造商开发的特定音频和视频格式）以及向这些插件提供内容的流媒体服务器已经存在多年。近年来，许多\
  \ Web 开发者已经摒弃了特定格式的插件，转而选择使用 Adobe Flash Player 浏览器插件，这很大程度上归功于其高普及率。Flash Player\
  \ 宣称在联网浏览器中的安装用户基数约为 99%（根据 Adobe 自身在 http://www.adobe.com/products/player_census/flashplayer/\
  \ 的统计数据），并且可用于 Windows、Mac、Solaris 和 Linux 平台。\n\n\n\nFlash Player 能够显示视频和播放音频。视频最常采用\
  \ Flash 视频（FLV）文件格式，音频则最常使用流行的 MP3 格式。Flash Player 插件版本 10 还增加了对 H.264 的支持，这是一种现代化的视频压缩标准，旨在生成更小的视频文件，同时适用于移动设备和桌面电脑。H.264\
  \ 被广泛认为是当前可用的最佳视频压缩方法之一。关于该压缩格式的简要概述可在苹果公司的网站上找到（[`www.apple.com/quicktime/technologies/h264/`](http://www.apple.com/quicktime/technologies/h264/)）。\n\
  \n本章首先讨论如何处理多媒体内容的可访问性这一重要主题。接着介绍一些利用 Flash Player 插件的预置音频和视频播放器组件。最后，我们将展望浏览器原生支持音频和视频的未来。\n\
  \n### 处理可访问性\n\n作为网页开发者，我们最重要的考量之一是为页面内容提供充分的访问途径，这当然也适用于多媒体内容。你的最终用户可能正在通过基于文本的浏览器或移动浏览器浏览网页，或者他们可能没有安装\
  \ Flash Player 或未启用 JavaScript。你需要向这些用户提供一些相关的内容来代替视频组件。同样地，对于那些有听力障碍，或者身处无法收听音频的环境中（比如耳机忘在家里了）的用户，你需要提供音频轨道的替代方案。\n\
  \n大多数第三方组件使用 JavaScript 来将网页上特定标签的内容替换为所需的多媒体内容：\n\n```\n<div id=\"replace-with-multimedia-\
  \ component\"></div>\n```\n\n这个标签在 HTML 中提供了一个有用的位置，用于存储关于视频或音频的额外信息。它可以包含多媒体文件的元数据、描述，甚至是音频内容的完整文字稿。这些信息可以被那些浏览器不支持该组件的用户读取，也可以被抓取网页以建立索引的搜索引擎读取。\n\
  \n在被替换的标签内，你还可以包含一个指向组件所呈现的原始音频和视频文件的下载链接。这为那些在没有 JavaScript 或 Flash Player 插件的情况下浏览页面的用户提供了一个备选方案，使他们能够看到和听到你的多媒体内容。\n\
  \n另一个可访问性选项是为视频添加字幕。许多 Flash 多媒体组件支持显示字幕。这些字幕可以在一个单独的文件中描述，该文件包含内容的文字稿以及文字对应的音频时间戳。W3C\
  \ 为字幕文件定义了一项推荐标准，称为 Timed Text，你可以在 [`www.w3.org/AudioVideo/TT/`](http://www.w3.org/AudioVideo/TT/)\
  \ 上了解更多信息。\n\n### 使用可复用的音频播放组件\n\n绝大多数第三方多媒体组件侧重于视频而非音频。然而，你可能需要单独播放音频，例如为广播网站或在线音乐商店。\n\
  \n在这里，我们将介绍一个功能完备、开箱即用的音频组件，它提供了为网页添加音频播放功能所需的一切。然后，我们将会回顾一些尝试在不使用 Flash Player\
  \ 的情况下强制浏览器播放音频文件的实验。\n\n> **注意** 对于那些热衷于在网页上播放声音的人，有一点要提醒：不要过度使用！背景音和音效有其存在的意义，但过度或不当使用可能会使用户不愿使用你的应用。请记住，我们的目标不是激怒网页应用的用户，而是给他们带来愉悦的浏览体验。\n\
  \n### SoundManager 组件\n\n网页开发者兼狂热音乐爱好者 Scott Schiller 开发了 SoundManager，这是一个即插即用的组件，它利用\
  \ Flash Player 插件第 8 版，通过 JavaScript API 暴露其声音播放能力。\n\n为了演示该组件的使用，让我们为一个假设的、销售 MP3\
  \ 音频轨道的在线音乐商店创建一个示例页面，如图 7-1 所示。在这个示例中，你将提供播放音频轨道简短片段的功能，以吸引听者付费下载完整歌曲。当用户点击每首曲目的标题时，你将使用\
  \ SoundManager 组件来提供这些音频样本。\n\n**图 7-1.** *在线 MP3 商店示例，具备试听曲目功能*\n\n首先，访问 SoundManager\
  \ [项目网站 http://www.schillmania.com/projects/soundmanager2/](http://www.schillmania.com/projects/soundmanager2/)\
  \ 并下载该组件的文件。最重要的文件是 Flash 影片文件（它仅仅向 JavaScript 暴露了 Flash 声音播放器的 API）和 JavaScript\
  \ API（你将在自己的 JavaScript 代码中使用它来播放页面上的声音文件）。\n\n接下来，构建页面的 HTML 代码，如代码清单 7-1 所示。\n\
  \n**代码清单 7-1.** *在线 MP3 商店示例的 HTML 标记*\n\n```\n<!DOCTYPE html PUBLIC \"- //W3C//DTD\
  \ XHTML 1.0 Strict//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1- strict.dtd\"\
  >\n[<html lang=\"en\" xml:lang=\"en\">](http://www.w3.org/1999/xhtml)\n<head>\n\
  <title>SoundManager 示例</title>\n<link rel=\"stylesheet\" href=\"my-example.css\"\
  \ type=\"text/css\" />\n</head>\n<body>\n<h1>在线商店</h1>\n<p>点击曲目标题试听简短预览。</p>\n<table>\n\
  <thead>\n<tr>\n<th>曲目标题</th>\n<th>艺术家</th>\n<th>购买</th>\n</tr>\n</thead>\n<tbody>\n\
  <tr>\n<td id=\"track1\">Ghost Town</td>\n<td>Phil And The Spectres</td>\n<td><a\
  \ href=\"/pay?id=1\">立即购买 $0.99</a></td>\n</tr>\n<tr>\n<td id=\"track2\">Higgs Boson</td>\n\
  <td>The Large Hadron Colliders</td>\n<td><a href=\"/pay?id=2\">立即购买 $0.99</a></td>\n\
  </tr>\n</tbody>\n</table>\n<!- - 包含我们的 $ JavaScript 库 -- >\n<script src=\"$.js\"\
  \ type=\"text/javascript\"></script>\n<!- - 包含 SoundManager 组件，它将我们的页面与音频播放组件连接起来\
  \ -- >\n<script src=\"soundmanager2.js\" type=\"text/javascript\"></script>\n<!-\
  \ - 包含我们稍后编写的用于播放音频文件的自定义脚本 -- >\n<script src=\"my- example.js\" type=\"text/javascript\"\
  ></script>\n</body>\n</html>\n```\n\nSoundManager 将在 DOM 加载完成后尽快执行其所有初始化。初始化完成后，SoundManager\
  \ 会触发其 `onload()` 事件，你可以在代码中挂钩该事件来设置你的音频。将代码清单 7-2 所示的代码添加到一个名为 `my-example.js`\
  \ 的文件中。\n\n**代码清单 7-2.** *在线 MP3 商店示例的 JavaScript 代码*\n\n```\n// 在 SoundManager\
  \ 组件初始化后执行此代码，以避免产生任何时序错误\nsoundManager.onload = function() {\n  // 定义我们稍后要播放的两个音频轨道\n\
  \  var track1 = soundManager.createSound({\n    // 此轨道的内部标识符\n    id: \"track- one\"\
  ,\n    // MP3 文件的位置\n    url: \"/track1.mp3\",\n    // 音量级别，范围为 0 到 100\n    volume:\
  \ 50\n  });\n  var track2 = soundManager.createSound({\n    id: \"track- two\",\n\
  \    url: \"/track2.mp3\",\n    volume: 50\n  });\n  $.Events.add(document.getElementById(\"\
  track1\"), \"click\", function() {\n    // 当用户点击 id 为 track1 的 HTML 元素时，播放第一个 MP3\
  \ 文件\n    track1.play();\n    // SoundManager 的其他方法包括：stop(), pause(), resume(),\n\
  \    // setVolume(x) 和 mute()\n  });\n  $.Events.add(document.getElementById(\"\
  track2\"), \"click\", function() {\n    // 当用户点击 id 为 track2 的 HTML 元素时，播放第二个 MP3\
  \ 文件\n    track2.play();\n  });\n}\n```\n\n这是一个简单的示例，但展示了 SoundManager 组件的易用性。\n\
  \n\n\n"
- "# SoundManager 组件\n\n您可能希望扩展此示例，以便在音频播放时，播放图标切换为暂停图标，而在暂停时，播放图标重新出现。此外，目前可以同时播放多个音频轨道。您可以选择添加一些防御性编码技术来防止这种情况发生。\n\
  \n## SoundManager 功能集\n\n`SoundManager` 组件功能丰富，提供了在网页上播放音频轨道所需的一切。通过 JavaScript\
  \ API，您可以读取音频的许多动态设置属性，包括文件的时长和大小、在任何时刻已加载的比例、当前播放的音频位置，以及音频当前是正在播放还是已暂停。\n\n在创建\
  \ `SoundManager` 对象时，您还可以自行配置某些属性，包括：\n\n- 音频是否应流式播放（边加载边播放）\n- 其音量\n- 其在立体声场中的声像位置\n\
  - 其默认起始位置\n- 音频是应自动播放，还是仅加载然后等待用户交互后再播放\n\n每个 `SoundManager` 对象随后会暴露事件，您可以挂钩这些事件，在音频的某些属性发生变化时执行特定代码，例如音频开始播放、暂停、恢复或完成加载时。您甚至可以挂钩在音频播放期间定期调用的事件。例如，您可以编写代码，根据音频的当前播放位置来更新页面中可见进度条的位置。\n\
  \n`SoundManager` 还为安装了 Flash Player 9 或更高版本的最终用户提供了额外的功能，允许显示源自正在播放曲目的波形和均衡器数据。这意味着，如果需要，您可以向用户提供更多的视觉反馈。\n\
  \n## SoundManager 评估\n\n最初的 `SoundManager` 组件自 2004 年起可用，其当前版本自 2007 年起可用。这赋予了产品一定的成熟度；有足够的时间让任何错误浮出水面并被修复，并且在此期间该组件已在许多网站上使用。\n\
  \n正如所料，除非您的最终用户正在运行 JavaScript 并且已安装 Flash Player 8 或更高版本，否则该组件将无法工作。浏览器支持非常好，包括\
  \ IE 6 及以上版本、Firefox 1.5 及以上版本、Safari 1.3 及以上版本、Opera 9.5 及以上版本以及 Google Chrome。\n\
  \n性能可以认为是相当不错的，尽管一些较旧的浏览器/机器配置报告称，在执行某些方法到从 Flash Player 获得响应之间存在明显的延迟。这被认为与 Adobe\
  \ 自己的 Flash 到 JavaScript 的连接接口有关，而不是开发人员具体编码的问题。您很可能不会注意到任何性能缺陷，除非您选择利用 Flash Player\
  \ 9 特有的功能。众所周知，这种额外的功能会给最终用户的 CPU 带来很大负担，导致页面明显变慢。因此，您应尽可能避开此功能以避免问题。\n\n您应该了解 `SoundManager`\
  \ 的一些已知限制，这些限制直接源于 Flash Player 8 的限制：\n\n- 加载声音文件的方法仅支持 MP3 文件格式。无论如何，我建议使用这种文件格式，但这可能意味着在页面中使用此组件之前，您需要将音频重新编码为此格式。\n\
  - 循环播放音频轨道存在一个问题。如果您有一个希望循环播放的轨道，您会发现在轨道结束与重新开始播放之间存在明显的音频间隙。目前，此问题没有解决方法，因此请注意。\n\
  \n就文件大小而言，该组件相当轻量。该组件的 JavaScript 部分压缩后为 24KB。如果您选择在服务器上使用 gzip 压缩，如第 4 章所述，您会发现当文件下载到最终用户的浏览器时，其大小实际上变为\
  \ 6KB。执行实际音频播放的 Flash 电影文件只有 4KB，不过如果您想使用 Flash Player 9 特有的功能，则会使用另一个 8KB 的文件来替代它。\n\
  \n总的来说，我对这个组件的评价非常高，因为它几乎支持您可能需要的所有音频播放情况。您可以在页面内构建播放按钮，并让这些按钮触发音频播放。您可以设置音量、声像和其他设置。您还可以构建一个页面组件，用于向最终用户反馈正在播放音频中播放头的位置，并允许他们通过点击组件内的鼠标或按下键盘上的某些预定义键来跳转到音频中的新位置。\n\
  \n### 无需 Flash 播放音频文件\n\n目前，浏览器对原生播放音频的支持相当差。在本章后面，我们将探讨未来支持原生音频和视频播放 HTML 标签的提议。现在，让我们看看开发者\
  \ Reinier Zwitserloot 进行的一些实验，这些实验旨在仅使用 JavaScript 在浏览器中实现音频播放。伙计们，这里没有 Flash Player！\n\
  \n他在以下 URL 中写下了他的笔记并展示了演示：[`www.zwitserloot.com/files/soundkit/soundcheck.html`](http://www.zwitserloot.com/files/soundkit/soundcheck.html)。您会发现三个测试，每个测试都包含用于开始和停止测试的“播放”和“停止”按钮：\n\
  \n- 第一个测试使用 JavaScript 在页面上动态添加一个 `<iframe>`，指向一个外部 HTML 文件，该文件仅包含一个链接到未压缩 WAV 音频格式文件的\
  \ `<embed>` 标签。\n- 第二个测试使用 JavaScript 直接在页面中动态添加一个链接到 WAV 文件的 `<embed>` 标签。其关联的“停止”按钮会从页面中移除该元素；再次单击“播放”按钮会将其添加回页面。该\
  \ DOM 元素在 JavaScript 中一直存在，并通过这两个按钮在页面中添加和移除。\n- 第三个测试与第二个类似，不同之处在于，当单击“播放”按钮时，每次都会创建一个新的\
  \ DOM 对象，而不是重用现有的对象。\n\n测试结果很有趣。总的来说，它们证明，由于不同浏览器的结果不同，围绕该技术构建一个可重用的、跨浏览器的组件的空间不大。\n\
  \n- 在 Opera 中，三个测试均未播放任何声音。\n- 在 Safari 中，所有测试都成功开始音频播放；但是，第一个测试在听到音频反馈之前有轻微延迟，并且一旦开始，第二个和第三个测试无法停止音频播放。\n\
  - 在 Firefox 中运行第一个测试会产生相同的延迟，之后才能听到或停止音频；但是，在该浏览器的所有三个测试案例中，两个按钮均按预期工作。\n- IE 6\
  \ 拒绝使用第一种技术播放任何声音。第二个测试成功，除了在音频停止后单击“播放”会产生意外结果，即从上一次停止的位置重新开始播放音频。第三个测试在 IE 6 中按预期工作。\n\
  \nReinier Zwitserloot 还指出，除 Opera 外，所有浏览器都可以同时播放多个声音，并且 MP3、WAV 和 MIDI 音频格式似乎都受支持。\n\
  \n\n\n理想情况下，开发人员希望在浏览器中本地播放音频，从而避免对外部 Flash 播放器组件的需求。Reiner 的实验突显了这种支持的不稳定性。在本章末尾，我们将探讨一项关于浏览器内原生音频播放的拟议标准，该标准正获得一些浏览器厂商的支持。目前，在浏览器中播放音频文件的解决方案仍依赖于\
  \ Flash 播放器插件。\n\n**使用可重用的视频播放组件**\n\n网页中的视频播放现已十分普遍，因此了解如何为您的 Web 应用程序添加此类功能至关重要。在这里，我们将介绍两个第三方可重用组件，它们允许您借助\
  \ Flash 播放器插件在页面中嵌入视频文件。\n\n正如本章前面所述，请不要忘记那些可能未安装 Flash 播放器插件或禁用了 JavaScript 的用户的可访问性。提供备用内容也能让搜索引擎蜘蛛有内容可读取和索引。\n\
  \n■**注意** 页面上的每个 Flash 组件都会占用用户一定比例的 CPU 时间，而页面中包含多个组件会加剧这种影响。请注意您在页面上包含的 Flash\
  \ 组件数量，不要过度。请记住，它在您的开发机器上可能运行良好，但您的最终用户可能没有那么幸运地拥有一台性能强大的机器。\n\n此外，也请不要忘记用户的网络速度也可能对每个组件的下载时间产生不利影响。\n\
  \n为了演示这些组件，我们创建一个简单的示例。假设您正在构建一个网站中的帮助页面，该页面播放关于如何安装特定产品的视频教程。此页面提供了一个视频播放组件，其中包含自定义的播放按钮和反馈控件，其外观旨在匹配自定义设计。图\
  \ 7-2 展示了最终页面的布局。\n\n**图 7-2.** 带有视频播放和自定义控件的视频教程页面\n\n`Listing 7-3`展示了此页面的 HTML\
  \ 标记，您可以稍后调整它以适应具体的实现。\n\n**`Listing 7-3`.** 视频教程页面的 HTML 标记\n\n```\n<!DOCTYPE html\
