  任何一个代码块都可以从系统中移除，而不会在浏览器中引发任何错误。这对于 MVC 模式来说是做不到的，因为其控制器需要模型和视图始终可用才能无误运行。


  你还可以在应用代码之外触发和监听事件。例如，页面中的任何代码都可以监听 `WebMail.EVENT.MESSAGE_DELETE` 事件，并添加自己的代码，以便在
  Web 邮件应用中触发该事件时执行。因此，你可以使用观察者模式创建更小的模块，这些模块组合成更大的应用，而应用本身也可以使用观察者模式。这使得该模式极为强大、通用且易于维护。


  ### 测试与测试驱动开发


  你应该在编写代码的同时对其进行测试，最好是逐行或逐个函数地进行测试。


  不要整天只写代码而不测试。始终进行测试，并在尽可能多的不同浏览器上进行测试，这样你才能对自己的代码和编码技能充满信心。


  *测试驱动开发*是一个深受程序员欢迎的概念。其总体原则是，当你准备编写一个新函数时，首先创建该函数的基本骨架，定义其输入和输出。然后立即为该函数编写一系列测试用例，预测一组输入对应的输出。测试用例编写完毕后，你再返回函数并编写能够通过这些测试用例的代码。这是一种合理的开发方法，因为它确保测试成为首要任务，并保证每个函数健壮且不易出错。




  测试框架的存在是为了确保无论您向代码库中编写的函数提供何种合理输入集，都能获得合理的输出。通过了解函数在一系列预定条件下的工作方式，您可以确信在代码中使用该函数时，它会按预期工作。


  Yahoo! 发布了一个非常有用的 JavaScript 测试框架，名为 YUI Test（[`developer.yahoo.com/yui/yuitest/`](http://developer.yahoo.com/yui/yuitest/)）。YUI
  Test 是 Yahoo! UI JavaScript 库的一部分，但如果您使用其他 JavaScript 库，它也能很好地工作。它允许您编写和运行有效的测试用例，并在错误发生时检测并记录它们。测试用例可以分组到更大的测试套件中，以提供一次运行多个测试的简单方法。在我使用过的其他测试框架中，这个框架的独特之处在于它支持测试异步方法调用，这使您能够测试
  Ajax 回调方法。它还在大多数常用浏览器中提供了 DOM 事件模拟。


  要使用 YUI Test，首先创建一个引用 YUI Test JavaScript 文件和您要测试的 JavaScript 代码的测试页面。然后，在页面的`<script>`标签内，多次调用您代码中的一个函数，并传入不同的输入。您告诉测试框架每个输入对应的预期输出，框架会记录函数调用的实际输出是否与您的预测匹配。任何与预测不匹配的输出都会被标记为错误。清单
  2-23 展示了一个为与 YUI Test 框架一起运行而编写的简单测试套件。


  ■**注意** 编写测试用例时，请确保测试“边缘”情况——那些在典型使用中可能不会出现，但在特殊情况下可能发生的情况，例如当需要输入数据但数据缺失时。


