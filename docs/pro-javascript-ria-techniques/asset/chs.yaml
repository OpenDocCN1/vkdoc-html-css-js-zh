  这种方法并不是特别跨浏览器友好。IE 不识别 `.xhtml` 文件扩展名或 `application/xhtml+xml` MIME 类型。尽管 IE 不支持
  SVG，你仍然希望你的 XHTML 页面能在该浏览器中加载。因此需要另一种解决方案。


