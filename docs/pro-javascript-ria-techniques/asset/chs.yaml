  h2\")[0]);\n// 创建播放/暂停控件元素，<div id=\"play- pause\">，插入在\n// <div id=\"controls\"\
  >标签内\nvar playPauseControl = $.Elements.create(\"div\");\nplayPauseControl.id =\
