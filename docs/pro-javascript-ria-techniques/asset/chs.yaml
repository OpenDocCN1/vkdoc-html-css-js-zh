- '# 第一部分：最佳实践


  在本书的第一部分，我将介绍一些经过验证的构建富互联网应用程序（RIA）指南。应用这些指南，你将能够构建一个可扩展的网站结构基础——从只有几行代码的单个页面，扩展到成千上万个页面和数千行代码。我将向你展示如何以明智且务实的方式遵循最佳实践，使得应用程序的维护和漏洞修复工作——无论是在构建期间还是将来——都不再令人望而生畏。


  ## 第 1 章：奠定坚实基础


  如果你正在阅读本书，很可能你曾体验过构建并发布网站所带来的成就感。也许你是独自完成了这个项目；也许你是作为团队的一员构建了它。它可能是一个简单的网站，只有几个页面，用于在互联网上为自己建立一个面向少数朋友的形象；或者它可能是一个前沿的富互联网应用程序（RIA），具有社交网络功能，面向数百万潜在用户。无论如何，祝贺你完成了项目！你值得感到自豪。


  回想项目开始之时，结合你后来获得的知识和经验，我打赌你至少能想到一件事——如果当初采用不同的做法，就能让你免于撞墙般的痛苦。如果你刚刚进入 Web 开发行业，你可能会后悔没有保留文件早期版本的备份，因为一次意外的断电让你花费了宝贵的时间来恢复修改。或者，你可能会后悔当初决定依赖那个第三方软件库——它在项目开始时看似能胜任任务，但很快就被证明是浪费时间和精力。在我自己的职业生涯中，我恰好经历过这些情况，并从中走出来，变得稍微明智了一些。我从这些错误中吸取了教训，并将这些新知识反馈到下一个项目中。


  基于我的经验以及我从他人那里学到的东西，我开发了一套有效且明智的 Web 开发方法。这套方法，再加上一些巧妙的技巧，应该能将那些“撞墙”时刻降到最低，并确保从项目一开始到你的下一个网站或应用程序上线，一切都能顺利推进。


  ### 最佳实践概述


  首先，我们来思考一下“最佳实践”这个术语的含义。如果你从事开发行业时间较长，你肯定经常听到这个词被用来为某种特定的编码技术或方法辩护。然而，这是一个有点沉重的短语，应谨慎对待。我来解释一下原因。


  #### 谁给“最佳实践”加上了“最佳”？




  '
- '# Web 开发格局


  Web 开发的格局正在不断变化。浏览器的流行度此消彼长，它们之间的功能采纳也并非总是同步，而我们用于构建网站在此类浏览器中显示的技术仍相当不成熟，不断经历着修订和更新。在一个不断变化的环境中，我们现在可能认为是最佳实践解决方案的东西，六个月后可能就会被淘汰。


  使用*最佳*一词，意味着存在用于比较的基准，或者已经采用了某种科学测试来进行区分。然而，此类测试很少进行。您应谨慎考虑任何被标榜为*最佳实践*的技术、技术和组件。请自行评估，判断它们是否符合一套标准，这套标准能惠及作为开发人员的您、网站的最终用户，以及（如果相关的话）您为之开展工作的客户。


  我在本章中阐述的指南、规则和技术，都是我亲身尝试过，并能证明其适用于真实世界 Web 开发的。我认为它们是当前我们所能拥有的最好方法。当然，当您读到本书时，其中一些可能已变得无关紧要，因此我给您的建议是及时了解行业的变化。阅读杂志、订阅博客、与其他开发者交流，并在网络上搜寻知识。我会在我的个人[网站
  http://www.denodell.com/](http://www.denodell.com/) 上维护一份我推荐的全面资源列表，为您提供一个起点。


  通过紧跟这些最佳实践的变化，您应该能够保持在 Web 开发行业的前沿，拥有一套工具和技术，帮助您提高日常工作的效率、建设性和回报。


  最后，在构建网站时，不要害怕审查、重写或重构您编写的代码。没有人能在无需修改代码的情况下从零开始构建一个网站。千万不要相信您在网络上，或本书或其他任何书籍中看到的任何代码示例是一次就能完美工作的。话虽如此，知识和经验能让事情变得更容易，所以抓住每一次机会练习，成为您能做到的最好的
  Web 开发者。


  ## 谁将从最佳实践中受益？


  事实是，每个人都应该能从您的代码中应用的最佳实践中受益。


  请看下面的列表，并使用这些标准来评估您遇到的任何指南、技术或技术，判断它们是否适合您的网站。


  ### Web 开发者


  最佳实践从自身做起。一个对您和您的 Web 开发者同事都有效的网站结构和代码，将使您们的工作变得轻松许多，并减少因编码不良可能带来的痛苦。


  -   我的代码是否遵循万维网联盟的建议？

  -   如果专有技术或插件不可用，我的网站是否仍可使用？

  -   我的代码能否通过测试和验证？

  -   我的代码是否易于理解、结构良好且易于维护？

  -   是否可以在无需大量不必要工作的情况下，向网站添加额外页面、部分和资源？

  -   我的代码能否在不增加大量额外工作的情况下，针对不同语言和地区进行本地化？


  ### 搜索引擎和其他自动化系统


  信不信由你，很大一部分网站流量来自自动化机器和脚本，例如搜索引擎、屏幕抓取工具和网站分析工具。为这些机器人进行设计与为任何其他用户群体一样重要。


  -   根据用于查找它的合理搜索词，我的代码能否在搜索引擎结果中恰当地显示？

  -   我的代码能否被出于任何原因希望读取或解析其内容的机器或脚本简单而容易地读取？


  ### 最终用户


  您代码最重要的用户是您的网站访问者，因此让您的代码为他们有效工作是第一要务。


  -   我的代码是否能在任何 Web 浏览器或设备上使用和访问，无论其年代、屏幕尺寸或输入方式如何？

  -   如果我的网站由屏幕阅读器软件朗读，其内容和顺序对听众来说是否有意义？

  -   我能否确信，当以我未预料到的某种方式使用时，我的代码不会表现出错误行为或显示错误消息？

  -   使用合适的搜索词时，我的网站能否通过搜索引擎或其他在线工具被找到？

  -   我的用户能否轻松访问网站的本地化版本（如果提供的话）？


  ## 通用最佳实践


  如果您和大多数开发者一样，您可能希望尽可能多的时间用于构建吸引人的用户界面组件和外观精美的网站，而不是因为一个糟糕的架构决策而重构您的代码库。保持代码的良好维护非常重要。如果没有合理的结构和可读性，随着时间的推移，维护代码将变得越来越困难。请记住，本章的所有指南都是为了尽可能让您（即开发者）的工作变得轻松而制定的。


  ### 明确项目目标


  以下是在编码网页时需要牢记的两件最重要的事情：


  -   最终用户会想如何使用它？

  -   其他开发者会想如何对其进行更改？


  请记住，最终用户可能不是人类。如果您检查现有网站的服务器请求日志，您会发现许多网站访问者实际上是搜索引擎蜘蛛、RSS 阅读器或其他能够读取原始页面内容并将其转换为其他内容的在线服务。


  随着诸如 RSS 馈送等自动内容联合变得越来越普遍，这种基于机器的访问在未来几年可能会变得更加广泛。例如，来自流行的知识共享站点[维基百科 (http://www.wikipedia.org/)](http://www.wikipedia.org/)
  的内容已经被用于网络的其他地方，包括在[谷歌地图 (http://maps.google.com/)](http://maps.google.com/) 中，根据每篇文章所描述内容的地理位置放置文章。


  雅虎！和其他搜索引擎公司一段时间以来一直在推动 Web 开发者在页面中加入额外的上下文特定标记，以便他们能更好地理解内容，并可能在搜索引擎中以不同方式呈现结果。例如，食谱可以附带图片和食材一起呈现；电影相关结果可以包含评论和您附近上映该电影的影院列表。像这样将您的代码与其他开发者的代码在线连接起来的可能性是巨大的。通过以正确的方式标记您的内容，您能确保整个系统以合理、连贯、互联的方式组合在一起，这有助于用户更快地找到他们正在寻找的信息。


  至于确保其他开发者（包括您自己，在长时间中断后重新回到项目时，仅为了保持思路清晰）能理解您的代码，您需要考虑通常的网站维护任务可能是什么。这些通常分为以下四类：


  -   对现有页面进行修改

  -   添加新页面

  -   重新设计或修改页面布局

  -   为需要其他语言页面或特定区域/国家版本的最终用户提供支持


  通过预先思考这些任务，您可以减少需要重构代码或重新排列、拆分文件的可能性，从而使维护工作变得更加容易。欢迎回到清晰的思路！


