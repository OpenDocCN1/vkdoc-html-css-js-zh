  \ 中的注释——这些注释仅对开发者有用，对浏览器或最终用户则毫无意义。\n\n`CSSTidy` 是一个命令行工具，因此如果您的开发环境支持，可以将其配置为自动开发/发布流程的一部分自动运行。要了解有关此[工具及其下载的更多信息，请访问\
  \ http://csstidy.sourceforge.net/](http://csstidy.sourceforge.net/)。\n\n## 不要使用\
  \ `@import` 命令\n\n您可以通过两种方式在 HTML 文件中引用外部样式表文件：使用 HTML 的 `<link>` 标签，或者在样式表文件或 HTML\
  \ 的 `<style>` 标签内使用 `@import` 指令，如下例所示：\n\n```html\n<style type=\"text/css\">\n\
  @import url(\"filename.css\")\n</style>\n```\n\n在许多浏览器中，这两种方法的行为是相同的。然而，某些版本的 IE\
  \ 在使用 `@import` 方法时，行为会略有不同。它们实际上会等到整个页面被读取并渲染完成后，才加载并应用来自 `@import` 指令的外部引用。因此，应避免使用\
  \ `@import` 方法。请使用 `<link>` 标签将外部样式表与您的 HTML 文件关联。\n\n## 加速表格布局\n\n众所周知，渲染 HTML\
  \ 表格对浏览器来说是一项非常耗费资源的任务。通常会有四级或更多级别的标签嵌套，仅解析这些标签就需要花费时间。然后，浏览器需要计算每个表格单元格的宽度，它会根据表格中每个单元格内容的宽度来智能地进行计算。这意味着浏览器通常需要读取整个表格的数据，然后才能正确地渲染它。在加载缓慢的页面上，当您看到\
  \ HTML 表格逐步加载到页面时，可能会观察到表格的布局在变化——某些列的宽度会发生改变——因为数据仍在下载中，只有当所有数据完成下载后，表格的最终尺寸才会确定。\n\
  \nCSS 的 `table-layout: fixed` 样式规则减少了浏览器为渲染 HTML 表格时必须进行的这种持续计算和重新评估工作。其用法如下：\n\n\
  ```css\ntable {\n  table-layout: fixed;\n}\n```\n\n`table-layout: fixed` 规则会“固定”表格布局，这意味着渲染引擎将仅根据表格标题行中单元格的数据来计算表格单元格的宽度。由于它无需再进行任何额外的单元格宽度计算，因此渲染长表格所需的时间得以缩短。\n\
  \n请确保通过 CSS 样式规则为表格标题行中的单元格设置了宽度。无论表格其余单元格的内容如何，这些宽度设置将自动应用于表格中对应的每一列。\n\n## 避免在\
  \ IE 中使用 CSS 滤镜和表达式\n\nIE 引入了几个新的 CSS 属性和额外的布局功能，这些是 IE 专属的，其他浏览器并未采用。其中两个这样的样式属性是\
  \ CSS 滤镜（允许开发者访问微软的一些原生 DirectX 绘图组件）和 CSS 表达式（允许在原本静态的样式规则中实现动态脚本功能）。\n\n如果您曾尝试在\
  \ IE 6 中为透明 PNG 图片提供支持，\n\n\n\n"
- "# 提升性能的技巧\n\n## 使用 AlphaImageLoader 的注意事项\n\n在不原生支持透明 PNG 的环境中，您可能遇到过并使用过一种特定的\
  \ CSS 滤镜`AlphaImageLoader`：\n\n```css\n.image {\n    filter: progid:DXImageTransform.Microsoft.AlphaImageLoader(src='image.png',\
  \ sizingMethod='scale');\n}\n```\n\n尽管这个滤镜确实能完成任务，但它存在一些严重的性能缺陷：\n\n- 在加载引用的透明 PNG\
  \ 时，浏览器实际上会锁定，在此期间不会继续渲染页面的任何部分，也不会下载任何其他资源。\n- 您可能期望一个滤镜图像的结果会像其他文件一样被缓存，但通过 CSS\
  \ 滤镜引用的图像不会被缓存。以这种方式加载的每个透明 PNG，无论之前是否已加载，每次刷新页面时都会被重新下载。\n\n## 使用简写属性值\n\nCSS 包含许多用于布局基于盒模型的结构以及设置此类结构中页面文本排版性质的相似和相关样式属性。在多种情况下，可以将多条样式规则合并为一条样式规则，从而节省文件大小并改善下载时间，同时不会牺牲可维护性或可扩展性。这里我们将介绍颜色、外边距、内边距、边框、背景、字体和列表的简写形式。\n\
  \n**第 4 章 ■ 性能调优**\n\n### 颜色\n\n在样式规则中使用十六进制值来指定颜色属性，因为这些值通常比大多数命名颜色和等效的 RGB 表示法占用更少的空间。如果使用命名颜色值，请限制在\
  \ HTML 4.01 规范中定义的 16 种颜色（[`www.w3.org/TR/REC-html40/types.html#h-6.5`](http://www.w3.org/TR/REC-html40/types.html#h-6.5)）。\n\
  \n十六进制颜色值通常这样指定：\n\n```css\nbody {\n    color: #000000;\n}\n```\n\n此示例将 HTML`<body>`标签的文本颜色设置为黑色，在十六进制中表示为`#000000`。在这种颜色表示法中，井号（`#`）后面的前两个字符表示该颜色的红色分量，第二组两个字符表示绿色分量，最后两个字符表示蓝色分量，因此格式为`#rrggbb`。\n\
  \n浏览器支持某些十六进制值的更短表示法，其中每个颜色分量的两位十六进制值完全相同。这些通常被称为*网页安全*颜色值。上面的样式规则可以用这种更短的形式表示：\n\
  \n```css\nbody {\n    color: #000;\n}\n```\n\n表 4-2 列出了一些颜色、它们的等效十六进制值以及它们的等效简写十六进制值（如果可用）。\n\
  \n**表 4-2.** *部分十六进制颜色值*\n\n| 颜色 | 十六进制 | 简写 |\n|------|---------|------|\n| 黑色\
  \ | `#000000` | `#000` |\n| 浅蓝色 | `#336699` | `#369` |\n| 绿色 | `#00ff00` | `#0f0`\
  \ |\n| 白色 | `#ffffff` | `#fff` |\n| 深灰色 | `#121212` | — |\n| 绯红色 | `#dc143c` | —\
  \ |\n\n### 外边距和内边距\n\n您可能熟悉 CSS 用于外边距和内边距的属性。`margin`是元素周围的空间，`padding`是元素边界框与其内容之间的空间。您也可能知道，您可以独立地将这些样式规则应用于元素的每一侧，或者一次性应用于元素的所有侧。\n\
  \n假设您想使用 CSS 为每个 HTML 段落标签应用 10 像素的外边距。您可以用以下代码片段中显示的两种可能方式之一来指定：\n\n```css\np.four-rules\
  \ {\n    margin-top: 10px;\n    margin-right: 10px;\n    margin-bottom: 10px;\n\
  \    margin-left: 10px;\n}\n\np.one-rule {\n    margin: 10px;\n}\n```\n\n注意第二个样式规则如何将四行代码合并为一行，而结果不变。\n\
  \n现在假设您想对元素的四个不同侧应用不同的外边距大小。以下是当影响基于盒模型元素的某些属性时，如何将多条样式规则合并为单条规则：\n\n```css\n/*\
  \ 给元素的顶部应用 10px 内边距，右侧 5px，底部 20px，左侧 0 像素 */\npadding: 10px 5px 20px 0;\n```\n\n\
  \n\n/* 将顶部外边距设为 10px，左右设为 5px，底部设为 15px */\n\n`margin: 10px 5px 15px;`\n\n/* 将元素顶部和底部的外边距设为\
  \ 10px，左右设为 5px */\n\n`margin: 10px 5px;`\n\n/* 将元素所有边的内边距设为 10px */\n\n`padding:\
  \ 10px;`\n\n## 边框\n\nCSS 提供了大量属性用于为页面元素设置边框样式。简单来说，边框由三种样式属性组成：宽度、边框样式（如 `solid`\
  \ 或 `dotted`）和颜色。通过特定的 CSS 样式属性，你可以为元素的每一侧应用不同的样式。例如，`border-top-width` 指定元素上方边框的宽度，`border-bottom-color`\
  \ 指定应用于元素底部边框的颜色。\n\n为元素的每一侧逐一使用这些属性相当繁琐。相反，应使用以下代码展示的简写技巧来为元素应用边框样式。\n\n```\n/*\
  \ 为元素每一侧应用 1px 宽、实线、黑色的边框 */\nborder: 1px solid #000;\n\n/* 仅将相同的边框样式应用于元素的顶部 */\n\
  border-top: 1px solid #000;\n\n/* 将顶部边框宽度设为 2px，左右边框设为 3px，底部边框设为 1px */\nborder-width:\
  \ 2px 3px 1px;\n```\n\n```\n/* 将顶部和底部边框设为黑色，左右边框设为红色 (#f00) */\nborder-color: #000\
  \ #f00;\n```\n\n## 背景\n\n多个 CSS 样式属性与元素内背景的显示和定位有关：\n\n- `background-color`：设置元素的基础背景颜色。\n\
  - `background-image`：应用一个背景图像，该图像将位于元素背景颜色之上。\n- `background-repeat`：允许你指定背景图像是否应在可用空间内平铺，以及如果平铺，应水平、垂直还是双向平铺。\n\
  - `background-attachment`：指定背景图像是随页面或元素滚动，还是在元素首次渲染时保持其位置固定。\n- `background-position`：将背景图像附加到元素内的特定位置，例如附着在元素的右下角，或距离元素左边缘\
  \ 25 像素的位置。\n\n无需单独为这些 CSS 属性每个都指定值，你可以通过一个单一的 `background` CSS 简写属性同时指定它们，如下所示：\n\
  \n```\n/*\n对简写 background 属性使用以下格式。\nbackground: color image repeat attachment position;\n\
  */\n\n/*\n图片 image1.jpg 应出现在元素左上角位置 (0, 0) 处，\n不应在任何方向上平铺，并且应随页面正常滚动。\n图片下方应显示红色背景，填满元素的尺寸。\n\
  */\np {\n  background: #f00 url(image1.jpg) no-repeat scroll 0 0;\n}\n```\n\n##\
  \ 字体\n\n存在一种简写表示法，用于将字体格式化样式规则合并为单一规则。你可以组合以下单独的字体样式：\n\n- `font-style`：指定 `normal`、`italic`\
  \ 或 `oblique` 文本样式。\n- `font-variant`：指定 `normal` 或 `small-caps` 字母文本样式。\n- `font-weight`：指定文本的粗细，启用\
  \ `bold` 或 `light` 文本样式。\n- `font-size`：指定文本中字符的大小。\n- `line-height`：指定每行文本应占用的高度。\n\
  - `font-family`：指定用于显示文本的字型。\n\n下面的示例展示了如何将这些单独的样式属性组合成一个单一的样式规则。\n\n```\n/*\n对简写\
  \ font 样式使用以下格式。注意斜线 (/) 字符的位置，\n位于字号和行高属性之间。同时请注意，字体族值可以有多个，\n用逗号分隔，以便在首选字体不可用时提供后备字体。\n\
  font: style variant weight size/line-height family\n*/\np {\n  font: italic small-caps\
  \ bold 1.2em/1.8em Arial, Helvetica, sans-serif;\n}\n```\n\n## 列表\n\n\n\n"
- "# 无序列表样式组合\n\n为简洁起见，无序列表的样式也可以组合成单个样式规则。以下三个独立的样式属性可以合并：\n\n- `list-style-type`：指定用于标记列表项的项目符号类型。\n\
  - `list-style-position`：指定项目符号相对于列表的位置，可以位于文本流中，或使用间距分隔成单独的列。\n- `list-style-image`：指定一个可选的图像文件，用于表示项目符号。如果该图像不存在或未指定，则改用\
  \ `list-style-type` 属性中的项目符号类型。\n\n以下展示了如何将这些样式组合成单个样式规则，用于自定义无序列表。\n\n```\nli {\n\
  \  /*\n    使用以下格式作为列表样式的简写形式。\n    list-style: type position image;\n  */\n  list-style:\
  \ circle inside url(mybullet.gif);\n}\n```\n\n## 使用 CSS Sprite 技术\n\n现在，你将学习一项称为*CSS\
  \ Sprite*的技术，它能够减少富互联网应用中图像文件的数量和大小。这将减少 HTTP 请求的数量和大小（如你所知，这是大多数网站最大的性能瓶颈之一），并且通常也会减少页面上表示这些图像所需的样式规则数量。\n\
  \nCSS Sprite 技术涉及将视觉上相关的图像文件合并到一个文件中。它借鉴了早期电子游戏图形中使用的精灵技术，并且近年来在一些计算机操作系统中被用于将一组图标图像存储在一个文件中。\n\
  \n假设你使用四个大小相同的独立图像文件来表示控制网站多媒体播放的四个按钮：播放、快退、快进和停止。以下是你通常如何使用 CSS 引用这些文件，并将它们与页面元素关联起来的方法：\n\
  \n```\n/* 每个按钮元素有两个类：control 和一个特定按钮的样式 */\n.control {\n  /* 每个图标是 100 像素见方 */\n\
  \  width: 100px;\n  height: 100px;\n  /* 如果按钮通过 CSS 显示为图标，则应隐藏按钮元素内的任何文本 */\n  text-indent:\
  \ -10000px;\n}\n.play {\n  background-image: url(play.png);\n}\n.rewind {\n  background-image:\
  \ url(rewind.png);\n}\n.forward {\n  background-image: url(forward.png);\n}\n.stop\
  \ {\n  background-image: url(stop.png);\n}\n```\n\n图 4-1 展示了如何使用标准图形软件包将这四张独立的图像合并成一个图像文件。每张单独的图像尺寸为\
  \ 100 像素宽、100 像素高，生成的图像尺寸为 200 像素宽、200 像素高。\n\nCSS Sprite 技术涉及指定较大图像文件中 100 像素见方的部分，该部分包含你希望在元素中显示的特定按钮图标。以下示例演示了如何使用\
  \ CSS 样式规则实现这一点，通过在元素尺寸内移动背景图像来显示所需的图像部分。\n\n![Image 16](img/index-181_1.png)\n\n\
  **图 4-1.** *四张相关图像合并成一个图像文件*\n\n```\n.control {\n  /* 每个按钮控制元素的尺寸固定为 100 像素见方 */\n\
  \  width: 100px;\n  height: 100px;\n  text-indent: -10000px;\n  /* 引用单个合并图像文件 */\n\
  \  background-image: url(combined-image.png);\n}\n.play {\n  /* 显示 100 像素见方区域，从背景的左上角开始。\n\
  \     这对应于图 4-1 图像中的“播放”图标 */\n  background-position: 0 0;\n}\n.rewind {\n  /* 将背景图像向左移动\
  \ 100 像素，使“快退”图像\n     位于元素的左上角位置，正好适合 100 像素的显示方块。 */\n  background-position: -100px\
  \ 0;\n}\n.forward {\n  /* 将背景图像向上移动 100 像素，使“快进”图像\n     位于元素左上角的 100 像素方块内 */\n\
  \  background-position: 0 -100px;\n}\n.stop {\n  /* 将背景图像向左移动 100 像素并向上移动 100 像素，\n\
  \     使“停止”图像在 100 像素的显示方块内可见 */\n  background-position: -100px -100px;\n}\n```\n\
  \n通过在元素内移动背景图像，你能够精确显示希望呈现的图像部分。你将四个独立的图像减少为一个，并且只向 CSS 样式规则中添加了一行代码。由于单个合并图像通常比几个独立图像更小，并且导致更少的\
  \ HTTP 请求，因此这项技术通常能为最终用户带来显著的性能提升。\n\n> **注意** 在开始将整个图像库合并成一个文件以使用此技术之前，请停下来思考一下你所合并图像文件的上下文。为了可维护性，建议只合并相关的图像，例如视觉尺寸相似的图标。为了进一步简化维护，请使用支持图层的图形软件包（如\
  \ Adobe Photoshop），如果你需要对其中某个独立图像进行更改，可以利用图层重新导出你的 sprite 图像文件。\n\n所以，CSS Sprite\
  \ 技术是一个极好的性能助推器。通过减少 HTTP 请求的数量，你对服务器连接速度和浏览器内并行连接限制的依赖减少了。然而，合并图像的方式会影响性能。因此，你需要确保以最佳方式做到这一点。\n\
  \n以下是一些优化 CSS Sprite 图像的方法：\n\n- **避免使用单个庞大的 Sprite 图像文件**：由于你将较小的图像合并到单个较大的图像中，结果文件大小通常虽然小于各部件总和，但无疑会比它所替代的任何单个文件都大。较大的文件下载时间更长，因此用户需要等待才能在浏览器中看到任何图像。目标是让最终用户能够以创纪录的速度加载和显示网页，因此请仔细考虑你的\
  \ CSS Sprite 图像。你需要将它们分割成几个经过精心构建的图像文件，而不是一个包罗万象的庞然大物。\n\n- **明智且高效地使用空间**：Sprite\
  \ 图像中各个图像之间的巨大空白区域，其效率不如空白较少的图像。与其他类型的文件一样，你不希望存储永远不会使用的额外图像数据。请尽可能紧密地打包组成主 Sprite\
  \ 图像的各个图像，以最大限度地减少浪费的空间。选择尺寸相似的组件图像，以获得最佳的贴合度并减少 Sprite 图像中的空白区域。你可以将各个图像排列成正方形网格，或使用水平或垂直对齐的图像序列。你可能会认为图像的对齐方式对文件大小没有影响，但实际上，当图像在单个水平行中对齐时，可能实现更小的文件大小。\n\
  \n- **考虑维护任务**：存储在单个文件中的单个图像，比存储在单个文件中的一组图像更容易更新和维护。在编辑大型 Sprite 图像时，必须注意不要更改正在编辑的单个图像周围的图像，因为此类更改可能会被忽视。如果你使用允许保存带有单独图层和分隔网格线的图像的图形软件（如\
  \ Adobe Photoshop），则应将每个独立的图像放置在不同的图层中，并与这些固定的网格线对齐。请将此主文件与你的图像一起保留备份，并在进行任何更改时以\
  \ PNG 格式（本章稍后讨论）导出你的 Sprite 图像。\n\n## 避免低效的 CSS 选择器\n\n\n\n"
- '# CSS 选择器与性能优化


  `CSS`选择器为浏览器提供了一种机制，用于将样式规则应用到页面上。通常，浏览器在创建页面元素时，会搜索要应用于该元素的样式规则，将元素的标签名、`id`属性和`class`属性与样式规则列表进行比较。然后，浏览器根据文档中其他`CSS`选择器可能的继承值，搜索要应用的样式规则，并合并结果，优先考虑更具体的样式规则或文档中靠后出现的规则。浏览器实际上需要执行一系列搜索来定位要应用于某个元素的样式，每次搜索都需要一定的时间才能完成。诚然，这些搜索在几毫秒内就能完成，但通过编写避免不必要搜索的样式规则，可以加快这一过程。


  确保你的`CSS`选择器的长度仅足以将样式规则应用到元素上。如果你发现自己将一长串标签名、`id`和`class`名称链接到单个选择器中，很可能你应该寻找一种不同且更精简的方法。


  避免指定包含标签名的选择器，因为这些选择器通常会导致耗时最长的样式规则搜索。相反，应通过位于父元素上的适当`id`属性来过滤选择器。搜索过程无需尝试查找应用于其他任何`id`属性的样式规则，从而提高了返回结果的速度。


  以下根据大多数浏览器采用的样式规则搜索机制，展示了有效和无效`CSS`选择器的示例。


  ```css

  /* 无效的选择器 - 在代码中避免使用这些 */

  table tbody tr td { ... }

  #body #content #results a { ... }

  form div#field label { ... }


  /* 更有效的选择器 */

  #header .title { ... }

  #results a { ... }

  #field .label { ... }

  ```


