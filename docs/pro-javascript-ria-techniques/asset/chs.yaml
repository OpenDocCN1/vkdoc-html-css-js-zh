  值得庆幸的是，有一种解决方案允许你编写标准的 HTML 页面，同时仍然在你的 Web 应用程序中创建 SVG 图像，那就是使用 JavaScript 动态地将
  SVG 元素添加到页面中，确保使用浏览器的 XML 解析器来创建这些元素。`清单 11-3` 展示了使用 JavaScript 动态创建 SVG 元素来呈现图
