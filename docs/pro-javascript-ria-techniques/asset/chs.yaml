  ### 总结


  本章解释了如何使用 Ajax 技术加载二进制文件。你已经了解了如何根据已知的数据格式规范从这些文件中定位和提取信息。你将这一原理应用于数码相机拍摄的照片，从而能够从文件本身提取有关这些图像的信息，例如照片的拍摄时间和地点。现在，你应该能够应用本章所学的技术，从任何其他类型的二进制文件（包括音乐和电影文件）中提取存储的信息，以帮助你构建自己的富互联网应用程序
  (RIA)。


  在下一章中，你将学习如何根据页面上的数据，在浏览器中动态绘制图形，而无需使用 `<img>` 标签。


