  上面的代码创建了一个单例，代表了浏览器中一个 Web 邮件客户端的雏形。其数据专属代码和用户界面专属代码彼此互不了解。然而，它们都知道为自身使用而创建的预定义事件列表，以及每个事件需要传递的变量。随后，Web
