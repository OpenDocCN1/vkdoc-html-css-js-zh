  重用已经编写好的代码来解决您作为 RIA 开发者面临的问题是非常明智的。您在 JavaScript 库中已经看到了这一点。同样，允许他人重用您编写的代码也是对
  Web 开发社区的回馈。


  以下是在应用程序中使用第三方脚本的一些指南：


