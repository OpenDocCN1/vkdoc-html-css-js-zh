- "# 第 11 章 ■ 在浏览器中绘图\n\n**作**为 Web 应用程序的一部分，你可能希望动态渲染图表、图形或实时数据的其他可视化表示。当然，你可以将数据发送到服务器并由其生成所需的图像，但当浏览器本身就能完成绘图工作时，何必费此周折？现有方法允许你完全使用前端代码在当前的浏览器中渲染图形元素。\n\
  \n本章介绍当今浏览器中可用的两种独立技术，它们让你能够在浏览器中绘制矢量图形：可缩放矢量图形 (SVG) 和矢量标记语言 (VML)。我们还将研究一个第三方跨浏览器组件，它允许你在自己的\
  \ RIA 中，酌情使用其中任一技术来绘制图表、图形和其他图形。最后，你将学习用于在页面上渲染图形的 HTML 5 新标签。\n\n### 创建可缩放矢量图形\n\
  \n如前一章所述，GIF、JPG 和 PNG 格式的标准图像图形文件以二进制数据存储。它们被设计为以不大于原始版本的尺寸显示。这类图像在放大或调整大小时会损失图像质量。\n\
  \n相比之下，矢量图形是可以缩放和调整大小而不会损失图像质量的图像。这是通过描述图像的组成部分来实现的：线条、形状、颜色、渐变以及其他元素，它们共同构成最终的图形。字体文件是矢量图形的一个例子。字体可以调整到任意大小而不会损失质量。每次调整字体大小时，其外观都会根据构成每个字符的一系列线条和形状重新计算。\n\
  \n可缩放矢量图形 (SVG) 是 W3C 的推荐标准 (http://www.w3.org/Graphics/SVG/)。\n\n\n\n[SVG](http://www.w3.org/Graphics/SVG/)\
  \ 是一种特定的 XML 格式，可用于描述在浏览器中显示的二维矢量图形。`SVG` 对于图形内容，就像 `XHTML` 对于文本内容一样。\n\n事实上，与 `XHTML`\
  \ 类似，`SVG` 与其他浏览器技术（如 `CSS` 和 `JavaScript` 的 `DOM`）协同工作，使开发者能够创建动态且交互式的图形。\n\n`SVG`\
  \ 的诞生是为了让浏览器和开发者能够原生支持创建那些以前只能用 Adobe 的 `Flash Player` 插件才能实现的图形内容。目前，`Firefox 1.5`\
  \ 及以上版本、`Safari 3` 及以上版本、`Opera 9.5` 及以上版本以及 `Google Chrome` 浏览器都内置了 `SVG` 支持。`SVG`\
  \ 在 Web 上的使用相当有限，主要是因为在 `IE` 浏览器中缺乏支持，以及 `Flash Player` 等插件的普及。\n\n`SVG` 数据可以直接内联放置在\
  \ `XHTML` 页面中，或者作为具有 `.svg` 扩展名的图像文件，通过页面上的 `<img>` 标签进行引用，就像其他图像一样。`<svg>` 标签包围着描述图像的内容，并像一个画布一样来容纳绘图。\n\
  \n在这个画布内部，你可以利用大量的标签来定义你想要显示的图像。除了绘制简单的形状和线条，你还可以加载外部图像文件、渲染文本，以及为 `SVG` 画布内的任何元素应用渐变。\n\
  \n**创建 SVG 图像文件**\n\n首先，让我们看一个简单的独立 `SVG` 图像文件。清单 11-1 展示了一个 `SVG` 图像文件的 XML 风格内容，它创建了一个渐变、一些形状、一条线以及一些文本。将此代码保存到名为\
  \ `my-vector.svg` 的文件中，并在支持 `SVG` 渲染的浏览器中打开它。\n\n你应该会看到如图 11-1 所示的页面。\n\n**清单 11-1.**\
  \ 一个简单的 SVG 图像文件\n\n```\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg\
  \ PUBLIC \"-//W3C//DTD SVG 1.1//EN\" ➥\n\"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\"\
  >\n<!-- 我们指定了此处所示的自定义 SVG DOCTYPE，以增加标签支持 -->\n<!-- 首先，我们使用 <svg> 标签定义一个用于绘图的画布\
  \ -->\n<svg width=\"1024\" height=\"768\" version=\"1.1\" ➥\nxmlns=\"http://www.w3.org/2000/svg\"\
  >\n    <!-- 定义一个渐变。此渐变仅被定义，暂时不会显示。x1 和 y1\n    表示渐变的起始位置，x2 和 y2 表示渐变的结束位置。在\n \
  \   <linearGradient> 标签内的 <stop> 标签指明了使用的颜色\n    以及它们在渐变路径上发生变化的点 -->\n    <linearGradient\
  \ id=\"gradient\" gradientUnits=\"userSpaceOnUse\" ➥\n    x1=\"0\" y1=\"0\" x2=\"\
  200\" y2=\"0\">\n        <stop offset=\"0\" stop-color=\"#000000\" />\n        <stop\
  \ offset=\"1\" stop-color=\"#cccccc\" />\n    </linearGradient>\n    <!-- 绘制一个正方形，起始位置由\
  \ x 和 y 表示。用之前通过 id 引用的\n    渐变来填充其内容 -->\n    <rect x=\"20\" y=\"20\" width=\"\
  200\" height=\"200\" fill=\"url(#gradient)\" />\n    <!-- 在位置 x, y 处绘制一个带圆角的矩形，圆角半径由\
  \ rx 和 ry 属性\n    表示。注意使用了 style 属性，该属性对元素应用样式，就像在 XHTML 中一样 -->\n    <rect x=\"\
  220\" y=\"220\" rx=\"20\" ry=\"20\" width=\"250\" height=\"100\" ➥\n    style=\"\
  fill:#330000;\"/>\n    <!-- 绘制一个圆，半径由 r 属性表示。我们使用 stroke 和 stroke-width\n    属性定义圆形周围的边框\
  \ -->\n    <circle cx=\"350\" cy=\"120\" r=\"50\" stroke=\"#336699\" ➥\n    stroke-width=\"\
  25\" fill=\"#003300\" />\n    <!-- 从位置 x1, y1 到位置 x2, y2 绘制一条线。直到你为其应用一个\n    stroke-width\
  \ 边框之后，你才能真正看到该线条，这里我们通过在\n    <line> 标签上使用 style 属性来实现 -->\n    <line x1=\"20\"\
  \ y1=\"20\" x2=\"320\" y2=\"320\" ➥\n    style=\"stroke:#cccccc;stroke-width:3\"\
  />\n    <!-- 在画布上以固定大小和颜色书写文本 -->\n    <g font-size=\"50\" font-weight=\"bold\"\
  \ fill=\"#333333\">\n        <text x=\"200\" y=\"460\">文本示例</text>\n    </g>\n</svg>\n\
  ```\n\n\n\n"
