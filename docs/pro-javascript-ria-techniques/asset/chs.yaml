  ## 关于作者


  **登·奥德尔**是一位拥有专业 JavaScript 技能的多领域 Web 开发者。他是 Web 标准和可访问性的倡导者，尤其热衷于用户界面开发。


  作为伦敦 AKQA 数字服务机构的前端技术架构师，登为包括法拉利、耐克和诺基亚在内的众多客户构建和设计了多个大型网站及富互联网应用。他现居瑞典，在那里运用自己的技术专长和对音乐的热爱，帮助唱片公司和艺术家发展他们的网络形象。


  在业余时间，登会组织夜店活动，在欧洲各地的俱乐部播放唱片，并且对数码摄影有着敏锐的鉴赏力。


