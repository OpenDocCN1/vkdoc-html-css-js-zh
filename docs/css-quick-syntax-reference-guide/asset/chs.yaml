- "# 1. 使用 CSS\n\n将 CSS 插入 HTML 文档有三种方式：使用内部样式表、内联样式或外部样式表。内部样式表适用于单个页面，内联样式适用于单个元素，而外部样式表则可能应用于整个网站。\n\
  \n## 内部样式表\n\n当单个文档需要拥有自己独特的样式时，内部样式表非常有用。该样式表通过`<style>`元素嵌入到网页文档的`<head>`部分中。此元素是样式表规则的容器，且应将其`type`属性设置为`\"\
  text/css\"`。\n\n```\n<style type=\"text/css\">\n  p { color: red; }\n</style>\n\
  ```\n\n## 内联样式\n\n可以通过使用`style`属性为单个元素分配样式，从而设置内联样式。它是一个通用属性，可包含在任何 HTML 起始标签中，其值是将应用于该元素的\
  \ CSS 声明，这些声明之间用分号隔开。无需指定选择器，因为这些声明隐式地属于当前元素。\n\n```\n<p style=\"color: green\"\
  >Green text</p>\n```\n\n这种方法应谨慎使用，因为它将样式与内容混合在一起，从而使得未来的修改更加繁琐。在将样式移出到外部样式表之前，它作为一种快速测试样式的方法很有用。\n\
  \n## 外部样式表\n\n包含 CSS 最常见的方式是通过外部样式表。样式表规则被放置在一个扩展名为`.css`的独立文本文件中。然后，通过网页头部中的`<link>`元素来引用此样式表。`rel`（关联）属性必须设置为`\"\
  stylesheet\"`，并且`type`属性可以（可选地）设置为`\"text/css\"`。样式表的位置通过`href`属性指定。\n\n```\n<link\
  \ rel=\"stylesheet\" type=\"text/css\" href=\"MyStyle.css\">\n```\n\n另一种不太常见的包含外部样式表的方式是在`<style>`元素内部使用\
  \ CSS 的`@import`函数。为了使此函数生效，它必须放置在任何其他规则之前。\n\n```\n<style type=\"text/css\">\n\
  \  @import url(\"MyStyle.css\");\n</style>\n```\n\n使用外部样式表通常是首选，因为它将 CSS 与 HTML\
  \ 文档完全分离。这样一来，就可以快速为整个网站创建一致的外观，并且只需编辑一个 CSS 文档即可更改其外观。它还具有性能优势，因为外部样式表会被缓存，因此只需下载一次——即在访客浏览您网站的第一个页面时。\n\
  \n## 测试环境\n\n为了实验 CSS，您可以使用简单的文本编辑器，例如 Windows 中的记事本（位于“开始 ➤ 程序 ➤ 附件 ➤ 记事本”）或 Mac\
  \ 上的文本编辑（位于“访达 ➤ 应用程序 ➤ 文本编辑”）。在编辑器中新建一个文档，并键入下面这条单独的样式规则。该规则会将网页文档的背景颜色变为红色。\n\n\
  ```\nbody { background: red; }\n```\n\n将文件保存为`MyStyle.css`，然后打开另一个空白文档。这个新文档将成为使用您刚刚创建的外部样式表的\
  \ HTML 文件。在该文档中写入以下 HTML 标记，其中包含对样式表的引用以及 HTML 5 网页文档所需的最少标记：\n\n```\n<!DOCTYPE\
  \ html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\">\n    <title>示例</title>\n\
  \    <link rel=\"stylesheet\" href=\"MyStyle.css\">\n  </head>\n  <body>\n    <p>此页面是红色的</p>\n\
  \  </body>\n</html>\n```\n\n继续操作，将此文本文件保存为`MyPage.html`，放到与 CSS 文件相同的文件夹中。至此，您已经创建了一个可以测试\
  \ CSS 的简单环境。要查看页面，请使用您的网络浏览器打开`MyPage.html`。您将会看到背景确实因样式表中的规则而变为红色。\n\n## 查看源代码\n\
  \n当浏览器处于打开状态时，您可以通过在 PC 上按`Ctrl+U`或在 Mac 上按`Cmd+U`来查看构成页面的 HTML 标记。这个快捷键在所有主流浏览器中都有效，包括\
  \ Chrome、Firefox 和 Internet Explorer (IE)。您也可以通过右键点击页面并选择“查看源代码”来找到查看源代码窗口。在 Firefox\
  \ 和 Chrome 中，样式表是可点击的，允许您查看应用于网页的外部样式表规则。（请注意，在 Chrome 中，您需要右键点击样式表并选择打开它，因为这个文件存储在您的本地机器上。）\n\
  \n像这样查看网页的源代码是向其他 Web 开发者学习的好方法。每当您在网页上发现一个有趣的元素——无论它是用 HTML、CSS 还是 JavaScript 创建的——页面源代码都会揭示它是如何创建的。\n\
  \n## 注释\n\nCSS 中的注释是通过使用 C 风格的符号（`/* */`）创建的。放置在`/*`和`*/`之间的所有内容都会被浏览器忽略，即使分隔符跨越多行。\n\
  \n```\n/* 多行\n   注释 */\n```\n\n注释的主要用途是向开发者（包括未来的您）阐明代码。它们也可以通过划分样式表的不同区域或提供关于文件的元数据（例如作者姓名）来提高可读性。\n\
  \n```\n/*\n* 元数据\n*/\n\n/*** 部分标题 ***/\np { margin-top: -1px; } /* 说明 */\n```\n\n\
  注释对于临时停用声明或整个样式规则以进行测试也很有用。\n\n```\np { /* color: white; */ }\n```\n\n## 空白\n\n\
  空白指的是空格、制表符和换行符。您可以自由地使用空白来格式化您的样式表，使其更易于阅读。一种常见的格式化惯例是将声明拆分成多行。\n\n```\n.fruit\
  \ {\n  color: red;\n  margin: 1px;\n}\n```\n\n另一种流行的惯例是将规则的声明保留在一行中，只有当声明过多时才将它们拆分成多行。\n\
  \n```\n.fruit       { color: red;   margin: 1px; }\n.fruit.apple { color: green;\
  \ margin: 2px; }\n```\n\n您使用的格式取决于个人偏好。选择对您有意义的方式，并力求保持一致。\n\n"
- "# 2. 分组\n\n为了使样式表简短且易于编辑，相似的规则可以组合在一起。这种分组提供了几种指定一组相关规则的方法。例如，您可以通过以下各节描述的四种不同方式为两个标题元素设置文本为红色、背景为黑色。\n\
  \n## 未分组的规则\n\n每个规则可以单独编写，这允许您对每个选定的元素应用单独的样式规则。\n\n```\nh1 { color: red; }\nh1\
  \ { background: black; }\nh2 { color: red; }\nh2 { background: black; }\n```\n\n\
  ## 分组选择器\n\n可以将选择器用逗号分隔来进行分组。这种分组将使声明应用于多个选择器。\n\n```\nh1, h2 { color: red; }\n\
  h1, h2 { background: black; }\n```\n\n## 分组声明\n\n可以将声明用分号分隔来进行分组。声明块内的所有样式都将应用于选择器。\n\
  \n```\nh1 {\n  color: red;\n  background: black;\n}\n\nh2 {\n  color: red;\n  background:\
  \ black;\n}\n```\n\n## 分组选择器和声明\n\n可以同时组合选择器和声明，从而形成一个单独的规则。\n\n```\nh1, h2 {\n\
  \  color: red;\n  background: black;\n}\n```\n\n应尽可能地对规则进行分组，以使代码更加简洁。它具有性能优势，因为简洁的规则减小了样式表的大小，从而使\
  \ CSS 文件加载更快。此外，将属性仅指定在一个地方也很方便，以防将来需要修改它们。另外，对具有相似样式的选择器进行分组有助于更容易地在它们之间保持一致性。\n\
  \n\n\n"
- '# 3. 类选择器与 ID 选择器


  类选择器和 ID 选择器定义的规则仅适用于选定的 HTML 元素集。它们允许你标识单个元素或元素组，而无需为元素类型的所有实例设置样式。


  ## 类选择器


  类选择器用于标识一组元素。它通过句点符（`.`）后跟类名来识别。类可以是可应用于任何元素的通用类。


  ```

  /* 选择任何类名为 myclass 的元素 */

  .myclass {}

  ```


  选择器也可以是一个只能应用于一种元素类型的特定类。特定类通过在句点符前声明元素名称来定义。


  ```

  /* 选择任何类名为 myclass 的 <p> 元素 */

  p.myclass {}

  ```


  特定类使得标识类在何处使用更加容易；通用类则允许更大的代码复用性。


  ### 类示例


  例如，假设某些元素内的文本需要着色，但不是所有该元素实例都需要。第一步是添加一个指定了颜色属性的通用类规则。


  ```

  .info { color: green; }

  ```


  该规则规定，任何 `class` 属性值为 `"info"` 的元素都将采用此样式。


  ```

  <p class="info">绿色</p>

  ```


  如果某个类规则只被一种元素类型使用，它可以被定义为特定类。这样做能让阅读样式表的任何人更容易理解该样式用于何处。


  ```

  p.warn { color: orange; }

  ```


  特定类规则与通用类规则以相同方式应用于文档，但它只会为指定类型的元素设置样式。


  ```

  <p class="warn">橙色</p>

  ```


  通过用空格分隔每个类名，可以将多个类规则应用于单个元素，这使得类规则非常灵活。


  ```

  <p class="style1 style2"></p>

  ```


  ## ID 选择器


  ID 选择器用于标识单个唯一元素。虽然它的工作方式与类选择器非常相似，但它使用的是井号符（`#`）而不是句点符，并且使用的是 `id` 属性而不是 `class`
  属性。与 `class` 属性一样，`id` 是一个通用属性，可以应用于几乎任何 HTML 元素。它为文档中的元素提供了唯一标识符。


  ```

  /* 选择 id 设置为 myid 的元素 */

  #myid {}

  ```


  与类选择器一样，ID 选择器可以通过元素进行限定。但是，由于一个给定 ID 应该只有一个元素，这种额外的限定通常被认为是不必要的。


  ```

  /* 选择 id 设置为 myid 的 <p> 元素 */

  p#myid {}

  ```


  ### ID 示例


  以下 ID 选择器将匹配文档中 `id` 属性设置为该 ID 的唯一元素。因此，如果样式意图只应用于单个元素实例，可以使用此选择器代替类选择器，因为这能更清晰地表明规则的使用位置。


  ```

  #err { color: red; }

  ```


  ID 规则通过使用 `id` 属性应用于元素。由于 `id` 属性必须唯一，每个 ID 选择器在每个网页上只能用于一个元素。因此，ID 选择器隐式地指定了该样式在任何页面上只使用一次。


  ```

  <p id="err">红色</p>

  ```


  ## 类与 ID 使用指南


  在许多情况下，使用类是 CSS 中选择元素的首选方法，因为类既灵活又可复用。另一方面，ID 通常用于网站的结构元素，例如 `#content` 和 `#footer`，以突出这些元素具有独特作用。


  '
- '# 4. 属性选择器


  属性选择器允许根据元素的属性及其属性值向元素添加样式。


  ## 属性选择器


  属性选择器将匹配使用了指定属性的元素，无论其属性值为何。


  ```

  input[type] {}

  ```


  此选择器仅匹配使用了 `type` 属性的 input 元素，例如以下元素：


  ```

  <input type="text">

  ```


  ## 属性值选择器


  `[attribute=value]` 选择器将同时根据属性和属性值进行匹配。


  ```

  input[type="submit"] {}

  ```


  那些 `type` 属性设置为 `submit` 的 input 元素将匹配此规则，如下例所示：


  ```

  <input type="submit">

  ```


  ## 语言属性选择器


  语言属性选择器用于匹配 `lang` 属性。


  ```

  p[lang|="en"] {}

  ```


  此选择器将匹配任何 `lang` 属性值以“en”开头的元素，例如“en-US”。请注意，此类语言代码不区分大小写。


  ```

  <p lang="en">英语</p>

  <p lang="en-US">美式英语</p>

  ```


  ## 分隔值选择器


  `[attribute~=value]` 选择器将应用于其属性值在以空格分隔的单词列表中包含给定单词的元素。


  ```

  input[value~="word"] {}

  ```


  此规则将选中以下两个元素。该单词需要大小写完全匹配；例如，该选择器不会定位“Word”或“words”。


  ```

  <input type="text" value="word">

  <input type="text" value="word word2">

  ```


  ## 值子串选择器


  `[attribute*=value]` 选择器匹配属性值包含指定子串的元素。


  ```

  p[title*="para"] {}

  ```


  `title` 属性包含“para”的段落元素将匹配此规则。


  ```

  <p title="my paragraph"></p>

  ```


  ## 值开头选择器


  `[attribute^=value]` 选择器匹配每个属性值以指定字符串开头的元素。


  ```

  p[title^="first"] {}

  ```


  `title` 属性值以“first”开头的段落将应用此规则。


  ```

  <p title="first paragraph"></p>

  ```


  ## 值结尾选择器


  `[attribute$=value]` 选择器匹配属性值以指定字符串结尾的元素。


  ```

  p[title$="1"] {}

  ```


  在以下代码中，`title` 属性的值以“1”结尾，因此将匹配此规则：


  ```

  <p title="paragraph 1"></p>

  ```


  '
- "# 5. 伪选择器\n\n伪类和伪元素是可以附加到选择器上使其更具体的关键字。它们很容易识别，因为前面总是带有一个冒号。\n\n## 伪元素\n\n伪元素可以对元素的部分进行样式设置。CSS\
  \ 中有四个伪元素，如下述各节所述。\n\n### first-letter 和 first-line\n\n伪元素 `:first-letter` 和 `:first-line`\
  \ 可以将样式应用于元素的第一个字母和第一行。它们仅适用于段落等块级元素。\n\n```\np:first-letter { font-size: 120%;\
  \ }\np:first-line   { font-weight: bold; }\n```\n\n上述第一个规则使段落中的首字母比其他文本大 20%。第二个规则使段落中的第一行文本加粗。\n\
  \n### before 和 after\n\n顾名思义，`:before` 和 `:after` 伪元素可以定位元素之前和之后的位置。它们与 `content`\
  \ 属性一起使用，可在元素之前或之后插入内容。\n\n```\np:before { content: \"之前\"; }\np:after  { content:\
  \ \"之后\"; }\n```\n\n这些规则使以下段落显示为“之前中间之后”：\n\n```\n<p>中间</p>\n```\n\n`content` 属性很特殊，因为它只能与这两个伪元素一起使用。它也是唯一打破内容（HTML）和设计（CSS）之间界限的属性。请记住，只有当一段内容的存在归结于设计决策时，才应打破这条界限。例如，`content`\
  \ 属性可用于在元素之前添加图标，这可以通过使用 `url` 函数来实现。\n\n```\np.bullet:before { content: url(my-bullet.png);\
  \ }\n```\n\n\n\n## 伪类\n\n伪类允许根据元素之间的关系以及 HTML 文档中未包含的信息来设置样式。大多数伪类可分为三类：动态伪类、结构伪类和用户界面伪类。\n\
  \n### 动态伪类\n\n第一类伪类用于在链接或其他交互元素的状态发生改变时为其应用样式。这类伪类共有五个，全部在 CSS 2 中引入。\n\n#### `:link`\
  \ 和 `:visited`\n\n动态伪类 `:link` 和 `:visited` 仅能应用于锚点元素（`<a>`）。`:link` 伪类匹配指向尚未访问页面的链接，而\
  \ `:visited` 匹配已访问过的链接。\n\n```css\na:link    {} /* 未访问的链接 */\na:visited {} /* 已访问的链接\
  \ */\n```\n\n#### `:active` 和 `:hover`\n\n另一个伪类是 `:active`，它匹配正在被激活的元素，例如通过鼠标点击激活。这对于为锚点元素设置样式最有用，但也可以应用于任何元素。\n\
  \n```css\na:active {} /* 激活的链接 */\n```\n\n当用户将鼠标等指向设备移动到所选元素上时，会应用带有 `:hover` 伪类的选择器。它常用于创建链接悬停效果。\n\
  \n```css\na:hover {} /* 悬停的链接 */\n```\n\n当这四种伪类应用于同一个选择器时，需要按正确的顺序出现。具体来说，`:hover`\
  \ 伪类必须位于 `:link` 和 `:visited` 之后，并且要使 `:active` 生效，它必须出现在 `:hover` 之后。可以使用短语 \"\
  love and hate\" 来帮助记忆构成正确顺序的首字母。\n\n```css\na:link    {} /* L */\na:visited {} /*\
  \ V */\na:hover   {} /* H */\na:active  {} /* A */\n```\n\n#### `:focus`\n\n最后一个动态伪类是\
  \ `:focus`，它可用于能够获得焦点的元素，例如表单中的 `<input>` 元素。`:active` 和 `:focus` 的区别在于，`:active`\
  \ 仅在点击过程中持续，而 `:focus` 会一直持续到元素失去焦点。\n\n```css\ninput:focus {}\n```\n\nIE 浏览器直到版本\
  \ 8 才支持 `:focus` 伪类。\n\n### 结构伪类\n\n结构伪类根据元素与其他元素的关系来定位元素。CSS 2 在此类别中仅包含一个结构伪类 `:first-child`，而\
  \ CSS 3 引入了大量新的结构伪类。所有主流浏览器（IE7 及更低版本除外）都支持这些 CSS 3 结构伪类。\n\n#### `:first-child`\n\
  \n`:first-child` 伪类匹配所选元素的第一个子元素。\n\n```css\np:first-child {} /* 第一个段落子元素 */\n```\n\
  \n在以下示例中，此规则适用于第一个锚点元素：\n\n```html\n<p>\n  <span>第一个子元素</span>\n  <span>文本</span>\n\
  </p>\n```\n\n#### `:last-child`\n\n`:last-child` 伪类表示所选元素的最后一个子元素。\n\n```css\np:last-child\
  \ {} /* 最后一个段落子元素 */\n```\n\n此规则针对以下段落元素的最后一个子元素。\n\n```html\n<p>\n  <em>文本</em>\n\
  \  <em>最后一个子元素</em>\n</p>\n```\n\n#### `:only-child`\n\n`:only-child` 伪类匹配没有兄弟元素的元素。\n\
  \n```css\np:only-child {} /* 无兄弟元素的子元素 */\n```\n\n此规则应用于以下第一个 `<strong>` 元素，因为它是该段落的唯一子元素。第二个段落元素有两个子元素，因此其中没有一个被此规则选中。\n\
  \n```html\n<p>\n  <strong>唯一子元素</strong>\n</p>\n<p>\n  <strong>文本</strong>\n  <em>文本</em>\n\
  </p>\n```\n\n#### `:only-of-type`\n\n顾名思义，`:only-of-type` 选择器仅在选择元素没有相同类型的兄弟元素时才匹配该元素。\n\
  \n```css\np:only-of-type {} /* 唯一的 <p> 元素 */\n```\n\n以下段落被此规则选中，因为它是其父元素中唯一的段落元素。\n\
  \n```html\n<div>\n  <h1>文本</h1>\n  <p>唯一类型</p>\n</div>\n```\n\n#### `:first-of-type`\n\
  \n`:first-of-type` 伪类匹配属于所选类型的第一个子元素。\n\n```css\np:first-of-type {} /* 第一个 <p> 元素\
  \ */\n```\n\n它匹配以下标记中的第一个段落元素：\n\n```html\n<div>\n  <h1>文本</h1>\n  <p>首个类型</p>\n\
  \  <p>文本</p>\n</div>\n```\n\n#### `:last-of-type`\n\n特定类型的最后一个兄弟元素可以使用 `:last-of-type`\
  \ 伪类来选择。\n\n```css\nstrong:last-of-type {} /* 最后一个 <strong> 元素 */\n```\n\n此规则适用于其兄弟元素中的最后一个\
  \ `<strong>` 元素。\n\n```html\n<div>\n  <strong>文本</strong>\n  <strong>最后类型</strong>\n\
  </div>\n```\n\n#### `:nth-child`\n\n`:nth-child(an + b)` 伪类在子元素被分成每 `a` 个元素一组后，匹配每组的第\
  \ `b` 个子元素。\n\n```css\np:nth-child(1)    {} /* 第一个子元素 */\np:nth-child(2n)   {} /*\
  \ 偶数子元素 */\np:nth-child(2n+1) {} /* 奇数子元素 */\n```\n\n这些规则适用于以下 HTML 标记：\n\n```html\n\
  <p>\n  <span>第一个且奇数</span>\n  <span>偶数</span>\n  <span>奇数</span>\n</p>\n```\n\n\
  匹配奇数与偶数子元素是一种常见操作，因此也可以使用关键字 `odd` 和 `even` 来匹配表格中的每隔一行。\n\n```css\ntr:nth-child(even)\
  \ {} /* 偶数表格行 */\ntr:nth-child(odd)  {} /* 奇数表格行 */\n```\n\n如上所示，`:nth-child()`\
  \ 的参数可以是一个整数、关键字 `even` 或 `odd`，或者形如 `an+b` 的表达式。在表达式形式中，关键字 `n` 是一个计数器，会遍历所有子元素。计数器可以为负数；在这种情况下，迭代会反向进行。它可用于选择特定数量的前几个子元素。\n\
  \n```css\np:nth-child(-n+3) {} /* 前三个子元素 */\n```\n\n与 `:nth-child()` 一起使用的数学逻辑和参数同样适用于接下来的三个伪类，它们都以\
  \ `:nth` 开头。\n\n#### `:nth-of-type`\n\n`:nth-of-type(an + b)` 伪类在相同类型的兄弟元素被分成每 `a`\
  \ 个元素一组后，匹配所选类型的第 `b` 个元素。\n\n```css\np:nth-of-type(2)    {} /* 第二个段落兄弟元素 */\np:nth-of-type(2n)\
  \   {} /* 偶数段落兄弟元素 */\np:nth-of-type(2n+1) {} /* 奇数段落兄弟元素 */\n```\n\n此伪类的行为类似于 `:nth-child`，但它是匹配指定元素的相同类型的兄弟元素，而不是匹配指定元素的子元素。\n\
  \n```html\n<div>\n  <em>文本</em>\n  <p>奇数</p>\n  <p>第二个且偶数</p>\n  <p>奇数</p>\n</div>\n\
  ```\n\n与其他 `:nth` 伪类类似，可以使用关键字 `odd` 和 `even` 来匹配索引为奇数或偶数的相同类型兄弟元素。\n\n```css\n\
  p:nth-of-type(even) {} /* 偶数段落兄弟元素 */\np:nth-of-type(odd)  {} /* 奇数段落兄弟元素 */\n```\n\
  \n#### `:nth-last-of-type`\n\n`:nth-last-of-type(an + b)` 伪类匹配所选类型的元素，该元素之后还有 `an+b`\
  \ 个相同类型的元素。其行为等同于 `:nth-of-type` 伪类，区别在于元素计数是从底部开始而不是从顶部开始。\n\n```css\np:nth-last-of-type(3)\
  \    {} /* 倒数第三个段落 */\np:nth-last-of-type(-n+2) {} /* 最后两个段落 */\n```\n\n这两个规则适用于以下示例。由于\
  \ `<em>` 元素不是指定类型（本例中为段落），因此不计算在内。\n\n```html\n<div>\n  <p>倒数第三</p>\n  <p>最后两个</p>\n\
  \  <p>最后两个</p>\n  <em>文本</em>\n</div>\n```\n\n#### `:nth-last-child`\n\n`:nth-last-child(an\
  \ + b)` 伪类表示在其之后有 `an+b` 个兄弟元素的任何元素。其行为与 `:nth-child` 相同，不同之处在于它是从底部元素开始而不是从顶部元素开始。\n\
  \n```css\np:nth-last-child(3)    {} /* 倒数第三个子元素 */\np:nth-last-child(-n+2) {} /*\
  \ 最后两个子元素 */\n```\n\n这两个规则适用于以下示例中的子元素：\n\n```html\n<div>\n  <p>倒数第三</p>\n  <p>最后两个</p>\n\
  \  <p>最后两个</p>\n</div>\n```\n\n\n\n"
- '# empty


  `:empty` 伪类匹配没有任何内容的选定元素。


  `p:empty {} /* 空段落 */`


  如果元素没有子元素、文本或除注释外的空白字符，则视为空元素。上述规则适用于以下两个段落：


  `<p></p>`


  `<p><!-- 这也是空元素 --></p>`


  '
- "# root\n\n`:root` 伪类匹配文档树中的顶层元素。在 HTML 文档中，它始终是 `<html>` 元素。\n\n`:root {} /* 根元素\
  \ */`\n\n当 CSS 与其他语言（如 XML）一起使用时，该伪类尤其有用，因为在这些语言中，根元素可能会发生变化。除 IE8 及更低版本外，所有主流浏览器均支持\
  \ `:root` 伪类。\n\n### 用户界面伪类\n\nCSS 3 引入了一些用户界面伪类，用于根据交互元素的当前状态为其设置样式。\n\n### enabled\
  \ 和 disabled\n\n`:enabled` 和 `:disabled` 伪类匹配选定类型中处于启用或禁用状态的任何元素。它们仅适用于可处于启用或禁用状态的交互元素，例如表单元素。\n\
  \n`input:enabled  { background: green; }`\n\n`input:disabled { background: red;\
  \ }`\n\n以下表单包含一个启用和一个禁用的输入元素，它们受这两条规则影响：\n\n`<form>`\n\n  `<input type=\"text\"\
  \ name=\"enabled\">`\n\n  `<input type=\"text\" name=\"disabled\" disabled>`\n\n\
  `</form>`\n\n除 IE8 及更低版本外，所有主流浏览器均支持这两个伪类。\n\n### checked\n\n`:checked` 伪类匹配处于选中状态的元素。它仅可用于复选框、单选按钮和\
  \ `<option>` 元素。\n\n`input[type=\"checkbox\"]:checked {}`\n\n此规则匹配网页上任何选中的复选框。\n\
  \n`<form>`\n\n  `<input type=\"checkbox\">`\n\n`</form>`\n\n除 IE8 及更早版本外，所有主流浏览器均支持\
  \ `:checked` 伪类。\n\n### valid 和 invalid\n\n`:valid` 和 `:invalid` 伪类用于在用户填写表单时向其提供反馈。现代浏览器可以根据表单元素的输入类型执行基本字段验证，并且结合这些伪类，结果可用于设置输入元素的样式。\n\
  \n`input:valid   { background: green; }`\n\n`input:invalid { background: red; }`\n\
  \n这里给出了两个字段，一个是必填项，一个是可选项。第一个字段在输入电子邮件地址之前一直保持无效状态。第二个字段是可选的，因此如果留空则视为有效。\n\n`<form>`\n\
  \n  `<input type=\"email\" required>`\n\n  `<input type=\"email\">`\n\n`</form>`\n\
  \n请注意，这些伪类绝不能替代使用 JavaScript 或 PHP 等进行的正确表单验证。这两个伪类的浏览器支持情况为 Chrome 10+、Firefox\
  \ 4+、IE10+、Safari 5+ 和 Opera 10+。\n\n### required 和 optional\n\n设置了 `required` 属性的表单字段由\
  \ `:required` 伪类匹配。相关的 `:optional` 伪类则相反：它匹配未设置 `required` 属性的输入元素。\n\n`input:required\
  \ { color: red; }`\n\n`input:optional { color: gray; }`\n\n以下表单包含一个必填和一个可选的输入元素，它们受前述样式影响：\n\
  \n`<form>`\n\n  `<input type=\"email\" required>`\n\n  `<input type=\"url\">`\n\n\
  `</form>`\n\n与 `:valid` 和 `:invalid` 伪类类似，对 `:required` 和 `:optional` 的支持仅限于 Chrome\
  \ 10+、Firefox 4+、IE10+、Safari 5+ 和 Opera 10+。\n\n### 其他伪类\n\n有些伪类不属于上述任何类别，即 `:target`、`:lang`\
  \ 和 `:not` 伪类。\n\n### target\n\n`:target` 伪类可以为通过 `id` 链接定位到的元素设置样式。它对于突出显示文档中的目标部分很有用。\n\
  \n`:target { font-weight: bold; } /* 目标元素 */`\n\n当点击以下页面内部链接时，此规则将应用于该锚点元素。浏览器还会滚动到该元素所在位置。\n\
  \n`<a href=\"#my-target\" id=\"my-target\">页面内部链接</a>`\n\n除 IE8 及更早版本外，所有主流浏览器均支持此伪类。\n\
  \n### lang\n\n`:lang()` 伪类匹配被确定为使用参数指定语言编写的元素。\n\n`p:lang(en) {}`\n\n此伪类适用于面向英语受众的段落元素，例如以下段落：\n\
  \n`<p lang=\"en\">English</p>`\n\n请注意，此伪类的行为与语言属性选择器类似。不同之处在于，`:lang` 伪类还会在语言设置于祖先元素上，或以其他方式（例如通过页面\
  \ HTTP 头部或 `<meta>` 标签）设置时匹配元素。\n\n`<body lang=\"fr\">`\n\n  `<p>French</p>`\n\n\
  `</body>`\n\n### not\n\n否定伪类 `:not` 匹配未由指定选择器定位到的元素。\n\n`p:not(.first) { font-weight:\
  \ bold; }`\n\n此示例规则选择未使用 `first` 类的段落。\n\n`<p class=\"first\">不加粗</p>`\n\n`<p>加粗</p>`\n\
  \n除 IE8 及更早版本外，所有主流浏览器均支持 `:not` 伪类。\n\n"
- "# 关系选择器\n\n关系选择器根据元素与其他元素的关系来匹配元素。要理解这些选择器，认识到网页文档中的元素如何相互关联非常重要。\n\n## HTML 层级\n\
  \nHTML 文档可以可视化为以 `<html>` 元素为根的树状结构。每个元素都位于此树的某处，并且每个元素要么是另一个元素的父元素，要么是子元素。位于另一个元素上方的任何元素称为祖先，直接上方的元素称为父元素。类似地，位于另一个元素下方的元素称为后代，直接下方的元素称为子元素。相应地，与另一个元素共享相同父元素的元素称为兄弟元素。考虑以下简单的\
  \ HTML 5 文档：\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\"\
  >\n    <title>示例</title>\n  </head>\n  <body>\n    <h1>标题</h1>\n    <p>段落</p>\n\
  \  </body>\n</html>\n```\n\n在此示例中，`<h1>` 和 `<p>` 是兄弟元素，因为它们共享同一个父元素。它们的父元素是 `<body>`，并且与\
  \ `<html>` 一起，它们都是这两个兄弟元素的祖先。相应地，这两个兄弟元素是 `<body>` 的子元素，并且是 `<body>` 和 `<html>`\
  \ 的后代。此简单文档的层级结构如图 6-1 所示。\n\n![A978-1-4302-6491-0_6_Fig1_HTML.jpg](img/A978-1-4302-6491-0_6_Fig1_HTML.jpg)\n\
  \n图 6-1. 示例 HTML 层级结构\n\n## 继承\n\n继承是 CSS 中另一个重要概念。它使得某些样式不仅应用于指定的元素，还应用于其所有后代元素。例如，`color`\
  \ 属性是可继承的；而 `border` 属性则不可继承。这种默认的继承行为通常是期望的，使得继承非常直观。任何属性也可以显式地赋予 `inherit` 值，以使用其父元素对该属性所具有的相同值。\n\
  \n```\n/* 继承父元素的边框 */\np { border: inherit; }\n```\n\n继承使你可以在需要为所有后代元素应用相同样式时，将该样式应用于共同的祖先元素。与将样式应用于每个需要该特定样式的后代元素相比，此过程更加方便且易于维护。例如，如果整个文档的文本需要设置为特定颜色，你可以将样式应用于\
  \ `<body>` 元素，它是所有可见元素的共同祖先。\n\n```\n/* 将文档文本颜色设置为灰色 */\nbody { color: gray; }\n\
  ```\n\n既然你已经了解了 HTML 层级结构和继承概念，接下来可以讨论 CSS 的关系选择器了。\n\n\n\n## 相邻选择器\n\n相邻兄弟选择器用于选择紧跟在第一个元素之后的第二个元素。\n\
  \n`div+p { color: red; }`\n\n该选择器会匹配紧跟在 `<div>` 元素后面的段落。\n\n`<div>不是红色</div>`\n\n\
  `<p>红色</p>`\n\n`<p>不是红色</p>`\n\n## 后代选择器\n\n后代选择器用于匹配某个元素的子元素或孙元素。当你想仅当某个元素位于另一个元素内部时才对其应用样式时，这个选择器非常有用。\n\
  \n`div p { background: gray; }`\n\n上述规则适用于以下段落，因为它源自一个 `<div>` 元素：\n\n`<div>`\n\
  \  `<p>灰色</p>`\n`</div>`\n\n## 直接子元素选择器\n\n直接子元素选择器用于匹配其第二个元素，前提是该元素是其第一个元素的直接子元素。\n\
  \n`div > span { color: green; }`\n\n当应用于以下标记时，此规则会将第二个 `<span>` 元素着色为绿色。第一个 `<span>`\
  \ 元素不会被着色，因为它不是 `<div>` 的直接子元素。\n\n`<div>`\n  `<p>`\n    `<span>不是绿色</span>`\n \
  \ `</p>`\n  `<span>绿色</span>`\n`</div>`\n\n## 通用兄弟选择器\n\nCSS 3 新增了通用兄弟选择器，它匹配的第二个元素必须前面有第一个类型的兄弟元素。\n\
  \n`h1~p { color: blue; } `\n\n在下面的示例中，最后两个段落会被选中，因为它们前面有 `<h1>` 元素，并且共享同一个父元素：\n\
  \n`<p>不是蓝色</p>`\n\n`<h1>不是蓝色</h1>`\n\n`<p>蓝色</p>`\n\n`<p>蓝色</p>`\n\n虽然这是一个 CSS 3\
  \ 选择器，但它得到所有主流浏览器的支持，包括 Chrome 2+、Firefox、IE7+、Safari 3.1+ 和 Opera 9.2+。\n\n"
- '# 7. 特指度


  当多个规则应用于同一个元素并且指定了相同的属性时，会有一个优先级方案来决定哪个规则优先。简而言之，CSS 会优先考虑选择器最具体的规则。


  ## 选择器特指度


  计算特指度有一些基本规则。权重为 0 的最低特指度由通用选择器（`*`）赋予，它匹配文档中的所有元素。


  `* { color: red; } /* 0 */`


  类型选择器的权重为 1，因此一个包含两个类型选择器的选择器，其特指度为 2。


  `p { color: blue; } /* 1 */`


  `body p { color: gold; } /* 2 */`


  类选择器的权重为 10，伪类和属性选择器也是如此。当这些选择器包含一个类型选择器时，总权重为 11。


  `.a { color: lime; } /* 10 */`


  `p:first-child { color: navy; } /* 11 */`


  `p[class=a] { color: teal; } /* 11 */`


  伪元素不计入任何特指度，除非是伪元素前缀的选择器所增加的特指度。


  `p:first-letter { color: white; } /* 1 */`


  ID 选择器的权重为 100，因此一个 ID 规则会覆盖大多数其他冲突样式。


  `#i { color: aqua; } /* 100 */`


  内联样式的权重为 1000，甚至超过 ID 规则。


  `<p style="color: black;">文本</p>`


  要覆盖所有其他冲突样式，包括定义为内联样式的样式，可以将声明声明为 `!important`。请注意，`!important` 修饰符应用于单个声明，而非整个规则。


  `p { color: red !important; }`


  如果两个冲突规则之间的特指度相同，则由层叠决定应用哪个规则。


  ## 层叠


  在 CSS 中，多个样式表可以影响文档的呈现。此特性被称为层叠（CSS 中的“C”代表层叠），因为浏览器会合并所有样式表以在应用样式之前解决任何冲突。


  网页文档可以拥有来自三个不同来源的样式表：浏览器、网站设计者和阅读文档的用户。设计者的样式表通常具有最高优先级，其次是用户的个人样式表（如果有的话），然后是浏览器的默认样式表。


  ## 设计者样式


  如前所述，网页设计者有三种方式包含 CSS 规则：内联样式、内部样式表和外部样式表。在这三者中，内联样式的优先级最高，其次是内部样式表，然后是外部样式表。


  如果网页包含多个具有冲突规则（相同特指度）的外部样式表，则 HTML 标记中最后包含的样式表具有更高的优先级。在样式表内部也是如此。如果选择器相同，最后声明的属性才生效。


  `p { color: orange; } /* 被覆盖 */`


  `p { color: silver; } /* 主导 */`


  对于继承的样式，元素自身的样式优先级高于从其祖先继承的样式。


  `p { color: orange; } /* 主导 */`


  `body { color: silver; }`


  ## 特指度指南


  如本章所示，元素的样式可以在许多不同的位置以不同的优先级指定。层叠特性赋予了 CSS 很大的灵活性，但如果管理不当，也可能导致不必要的复杂性。


  通常，您希望保持较低的特指度，以便更容易了解哪些规则会优先。这样，您可以通过调整样式规则出现的顺序来利用层叠机制，而不是通过使用 ID 和 `!important`
  来不必要地增加特指度以覆盖冲突样式。


  '
- "# 8. 颜色\n\n在 CSS 中，有几种不同的方法可以指定颜色，以下各节将进行描述。\n\n## 命名表示法\n\n只需键入该颜色的通用名称即可设置颜色。\n\
  \n`p { color: red; } /* 将段落颜色设置为红色 */`\n\nHTML 和 CSS 颜色规范包含了 140 个预定义的颜色名称，例如 `white`、`lime`\
  \ 和 `olive`。这些颜色都得到了主流浏览器的支持。\n\n## 十六进制表示法\n\n对于完整的调色板，可以分别设置颜色的红色、绿色和蓝色分量。每个颜色分量由一个两位十六进制数组成，整个六位数前面加上一个井号（`#RRGGBB`）。十六进制意味着基数为\
  \ 16 的计数，因此有效数字是 0 到 9 以及 A 到 F。每个红-绿-蓝对的取值范围可以从 00 到 FF，即十进制表示法中的 0-255。总共有 1600\
  \ 万种可用颜色。\n\n`p { color: #FF0000; } /* 红色:255, 绿色:0, 蓝色:0 */`\n\n尽管这种颜色表示法是最晦涩的，但它也是最常见的，因为它精确、简洁且浏览器支持良好。发现颜色十六进制值的一个简单方法是使用图形软件（如\
  \ Adobe Photoshop 或 Paint.NET）中的取色器工具。\n\n## 短十六进制表示法\n\n十六进制表示法有一种短形式，其中颜色仅使用三位十六进制数字而不是六位数字来指定。通过将每个数字重复一次，可以将这种表示法转换为十六进制表示法。\n\
  \n`p { color: #f00; } /* 等同于 #ff0000 */`\n\n当不需要长十六进制表示法提供的完整精度时，短十六进制表示法是一种有用的快捷方式。\n\
  \n## RGB 表示法\n\n`rgb()` 函数允许将颜色值指定为红色、绿色和蓝色颜色分量的三个强度值。该值可以是 0 到 255 之间的整数，也可以是百分比。\n\
  \n`p { color: rgb(255, 0, 0); }`\n\n`p { color: rgb(100%, 0%, 0%); }`\n\nRGB 表示法允许与十六进制表示法相同的颜色精度。使用哪种表示法取决于个人偏好，但十六进制表示法通常更受青睐，因为它更短，并且可以轻松地从图像编辑器中复制，例如。\n\
  \n\n\n## RGBA 表示法\n\nCSS 3 引入了 RGBA 表示法，增加了一个用于指定颜色透明度的 alpha 值。该 alpha 值为介于 0.0（完全透明）和\
  \ 1.0（完全不透明）之间的数值。\n\n```\n/* 红色，透明度 50% */\np { color: rgba(100%, 0%, 0%, 0.5);\
  \ }\n```\n\nChrome、Firefox 3+、IE9+、Safari 和 Opera 10+ 均支持 RGBA 颜色值。若浏览器不支持，该规则将被忽略，因此可以像下方示例这样设置一个备用颜色值：\n\
  \n```\np {\n  color: rgb(100%, 0%, 0%); /* 备用值 */\n  color: rgba(100%, 0%, 0%, 0.5);\n\
  }\n```\n\n不支持 RGBA 的浏览器会忽略第二条声明，继续应用不透明版本的颜色。\n\n## HSL 表示法\n\n颜色值可以通过 `hsl()` 函数来设置（该名称代表色相、饱和度和明度）。色相是色环上从\
  \ 0 到 360 的角度值，其中 0 和 360 为红色，120 为绿色，240 为蓝色。饱和度以百分比表示，0% 为灰色，100% 为纯色。明度同样以百分比表示，范围从\
  \ 0%（黑色）到 100%（亮色）。\n\n```\np { color: hsl(0, 100%, 100%); }\n```\n\n尽管 HSL 颜色比\
  \ RGB 颜色更直观，颜色值也更容易调整，但在 IE8 的使用率下降到网站无需再支持它之前，不应使用 HSL。HSL 属于 CSS 3 中的值，受 Chrome、Firefox、IE9+、Safari\
  \ 和 Opera 10+ 支持。\n\n## HSLA 表示法\n\n与 RGB 类似，HSL 表示法也可以扩展一个用于指定透明度的 alpha 值。\n\n\
  ```\n/* 红色，透明度 50% */\np { color: hsla(0, 100%, 100%, 0.5); }\n```\n\nChrome、Firefox\
  \ 3+、IE9+、Safari 和 Opera 10+ 均支持 HSLA，这与 RGBA 函数的支持情况相同。\n\n"
- '# 单位


  在指定属性值的大小时，有多个单位可供选择。


  ## 绝对单位


  长度的绝对单位包括厘米（`cm`）、毫米（`mm`）和英寸（`in`）。尽管这些单位旨在不论屏幕分辨率如何都保持一致的外观，但实际情况并非总是如此，因为浏览器并不总能获知显示介质的精确物理尺寸。


  ```

  .one-cm { font-size: 1cm; }

  .one-mm { font-size: 1mm; }

  .one-in { font-size: 1in; }

  ```


  当输出介质的尺寸已知时（例如用于打印到纸张的内容），这些单位非常有用。不建议在屏幕显示中使用这些单位，因为屏幕尺寸可能差异很大。


  ## 印刷单位


  点（`pt`）和派卡（`pc`）是印刷单位。根据定义，1 英寸等于 72 点，1 派卡等于 12 点。与绝对单位类似，印刷单位最适用于打印样式表，而非屏幕显示。


  ```

  .one-point { font-size: 1pt; }

  .one-pica  { font-size: 1pc; }

  ```


  ## 相对单位


  长度的相对单位包括像素（`px`）和百分比（`%`）。百分比是与该属性父元素值成比例的单位；像素相对于所用显示设备上的物理像素而言。


  ```

  .one-pixel   { font-size: 1px; }

  .one-percent { font-size: 1%; }

  ```


  对于屏幕显示而言，像素和百分比是 CSS 中最有用的两种单位。像素是固定尺寸的，因此可以非常精确地控制网页文档中的布局。另一方面，百分比对于定义文本内容的字体大小非常有用，因为文本保持可缩放性，这对于小屏幕设备和无障碍访问非常重要。当文本是设计的一部分且需要与其他元素匹配时，可以使用像素来设置尺寸，以获得更好的控制。现代浏览器都支持整页缩放，这使得基于像素的字体大小更易被接受。请注意，对于高分辨率屏幕，一个
  CSS 像素会渲染为多个屏幕像素。例如，Apple Retina 显示屏会将所有像素尺寸以实际大小的两倍进行渲染。


  ## 字体相对单位


  另外两个相对度量单位是 em 高度（`em`）和 ex 高度（`ex`）。Em 高度与字体大小相同；ex 高度约为字体大小的一半。


  ```

  .one-ex { font-size: 1ex; }

  .one-em { font-size: 1em; }

  ```


  与百分比类似，em 高度是一种良好的相对单位，常用于设置网页文档文本的字体大小。两者都尊重用户在浏览器中选择的字体大小，并且在小屏幕设备上比基于像素的字体大小更易于阅读。


  CSS 3 引入了两个额外的字体相对单位：`rem` 和 `ch`。根 em 高度（`rem`）单位相对于根元素（`<html>`）的字体大小。它可以用来替代
  `em`，以防止元素的字体大小受到其祖先元素字体大小变化的影响。


  ```

  .one-rem { font-size: 1rem; }

  ```


  字符单位（`ch`）测量元素字体中字符零（0）的宽度。该单位非常适用于定义包含文本的盒子的宽度，因为它大致对应了该盒子内能容纳的字符数量。


  ```

  /* 相同宽度 */

  <div style="width: 5ch;"></div>

  <div>00000</div>

  ```


  `ch` 单位仅受 Chrome 27+、Firefox 19+ 和 IE9+ 支持，因此应仅在提供备用方案的情况下使用。`rem` 单位的支持稍好一些，适用于
  Chrome 4+、Firefox 3.6+、IE9+、Safari 4.1+ 和 Opera 11.6+。


  ## 视口单位


  视口宽度（`vw`）和视口高度（`vh`）单位允许元素相对于视口（即可见的文档部分）来设置尺寸。每个单位代表当前视口的一个百分比值。


  ```

  width:  50vw; /* 视口宽度的 50% */

  height: 25vh; /* 视口高度的 25% */

  ```


  另外两个视口单位是 `vmin` 和 `vmax`，分别给出视口尺寸的最小值或最大值。


  ```

  width:  1vmin; /* 1vh 或 1vw，取较小值 */

  height: 1vmax; /* 1vh 或 1vw，取较大值 */

  ```


  Chrome 26+、Firefox 19+、IE11+、Safari 6.1+ 和 Opera 15+ 均支持视口单位。`vh`、`vw` 和 `vmin`
  单位的支持范围比 `vmax` 更广，可追溯到 Chrome 20+、IE9+ 和 Safari 6.0。在 IE9 和 IE10 中，`vmin` 被称为 `vm`。


  ## 单位值


  可以使用小数来设置长度。某些属性也允许长度为负值。


  ```

  p { font-size: 0.394in; } /* 小数值 */

  p { margin: -1px; } /* 负值 */

  ```


  请注意，如果单位前有空格或未指定单位（零值除外），则规则无效。在零后包含单位是可选的，但省略它是一种良好的做法。


  ```

  p { font-size: 1ex; }  /* 正确 */

  p { font-size: 0; }    /* 正确 */

  p { font-size: 0ex; }  /* 正确 */

  p { font-size: 1 ex; } /* 无效 */

  p { font-size: 1; }    /* 无效 */

  ```


  当 CSS 声明包含错误时，浏览器会忽略它。规则中的其他有效声明仍然生效。


