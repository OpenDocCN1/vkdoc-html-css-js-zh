- "# CSS 属性\n\n本书的其余章节将介绍 CSS 中可用的众多属性。在这些章节中，将使用形式化表示法给出可能的属性值，如下所示：\n\n```\ntext-shadow\
  \ : inherit | none | <offset-x> <offset-y> [<blur-radius>] [<color>]\n```\n\n这种表示法意味着\
  \ `text-shadow` 属性可以有三种不同类型中的一种值。默认值列在首位；这里默认值是 `inherit`。由于 `inherit` 关键字可为任何属性设置，除非它是默认值，否则不包含在内。第二个值\
  \ `none` 也是一个关键字。它是此属性的初始值，可用于禁用继承的属性效果。\n\n该表示法中的第三个选项包含一组四个值——两个必需值，两个可选值——如方括号（`[]`）所示。尖括号（`<>`）表示它们不是关键字；它们是其他值类型。在此示例中，它们是三个长度值和一个颜色值。遵循此表示法，以下声明展示了\
  \ `text-shadow` 属性的一个有效示例用法：\n\n```\ntext-shadow: 1px 1px 1px red;\n```\n\n\n\n\
  ## 通用关键字\n\n除了 `inherit`，你在 CSS 中可能还会遇到另外两个通用属性关键字：`initial` 和 `unset`。这两个通用关键字均在\
  \ CSS 3 中引入，并且可以设置在任何属性上。\n\n`initial` 关键字将属性的初始值（由 CSS 规范定义）应用到元素上。该关键字在 Chrome\
  \ 1+、Firefox 19+、Safari 1.2+ 以及 Opera 15+ 中受到支持，但目前在任何版本的 IE 中均不受支持。由于缺乏 IE 支持，此关键字的实用性有限。建议显式地为特定属性指定其初始值以进行重置。\n\
  \n第三个通用关键字是 `unset`，它是 `initial` 和 `inherit` 关键字的组合。如果属性有继承值，它会将属性重置为其继承值；否则，它会将属性设置为初始值。目前，对\
  \ `unset` 关键字的支持仅限于 Firefox 27+。在所有主流浏览器支持此关键字之前，不应使用它。\n\n## 怪异模式\n\n当 HTML 和 CSS\
  \ 被万维网联盟（W3C）标准化后，网页浏览器不能简单地遵从标准，因为这样做会破坏大多数已存在的网站。浏览器转而创建了两种独立的渲染模式：一种用于符合标准的新网站，另一种用于旧的遗留网站（怪异模式）。\n\
  \n在标准模式下，浏览器会尽力根据 HTML 和 CSS 规范来渲染页面。浏览器使用 `doctype`（文档类型声明）的唯一目的就是决定采用标准模式还是怪异模式。在网页文档开头处使用有效的\
  \ `doctype`（例如下面看到的 HTML 5 doctype）可以确保页面以标准模式渲染：\n\n```\n<!DOCTYPE html>\n<html>\
  \ ... </html>\n```\n\n这个 doctype 会触发所有主流浏览器（甚至可以追溯到 IE6）的标准模式。\n\n## 供应商前缀\n\n许多浏览器在某个新\
  \ CSS 属性的规范稳定之前，就早早地开始引入该属性。因为这些实现是实验性的，所以它们的属性名称包含一个供应商前缀，以表明该规范将来可能会发生变化。\n\n\
  主要的供应商前缀包括：用于 Firefox 的 `-moz`；用于 Internet Explorer 的 `-ms`；用于 Opera 的 `-o`；以及用于\
  \ Chrome、Safari、Android 和 iOS 的 `-webkit`。最近的 Opera 版本也与 `-o` 前缀并行实现了 `-webkit`\
  \ 前缀。例如，可以通过使用以下供应商前缀来提高对 CSS 3 `border-radius` 属性的支持。注意，无前缀版本应始终放在最后。\n\n```\n\
  .round {\n  /* Safari 3-4, iOS 1-3.2, Android 1.6-2.0 */\n  -webkit-border-radius:\
  \ 3px;\n  /* Firefox 1-3.6 */\n  -moz-border-radius: 3px;\n  /* Opera 10.5+, IE9+,\
  \ Safari 5+, Chrome 1+,\n     Firefox 4+, iOS 4+, Android 2.1+ */\n  border-radius:\
  \ 3px;\n}\n```\n\n随着时间的推移，新属性的规范会变得稳定，浏览器会逐渐放弃供应商前缀。再过一段时间，网络用户会放弃旧浏览器转而使用新版本，对供应商前缀的需求便会减少。`border-radius`\
  \ 属性已经经历了这个过程，现在鼓励开发者弃用这些前缀，以便让全世界的 Web 开发者更轻松一些。\n\n## 渐进增强\n\n在决定是否使用最新的 CSS 特性时，重要的是要考虑没有它时你的网站会是什么样子。如果该特性能够增强你网站的外观（例如\
  \ CSS 3 的 `border-radius` 属性），你可能会想开始使用它，即使只有一小部分访问者能看到它。时间会站在你这一边，随着人们抛弃旧浏览器，越来越多的访问者能够看到这个特性，从而增强他们在你网站上的体验。这就是渐进增强的本质。\n\
  \n另一方面，如果你的网站依赖该特性，而没有它时网站看起来会出问题，那么你需要仔细考虑该特性的支持程度，以及是否有你可以利用的后备方案或脚本来提高支持率，例如\
  \ HTML5 Polyfills 网站上列出的那些。¹ 在 CSS 中实现相同效果的方法通常有很多种，因此为网站的关键元素（如布局）选择一种所有主流浏览器都很好支持的方法是一个好主意。\n\
  \n脚注 1\n\n[`http://html5polyfill.com`](http://html5polyfill.com/)\n\n"
- "# 11. 文本\n\n文本属性用于格式化文本内容的视觉外观。\n\n## color\n\n`color` 属性通过使用某种颜色表示法来设置文本的颜色。默认情况下，其值设置为\
  \ `inherit`，意味着它继承父元素的颜色。\n\n```\ncolor : inherit | <color>\n```\n\n所有主流浏览器的初始值都是黑色。在下面的示例规则中，段落将被设置为蓝色：\n\
  \n```\np { color: #00f; }\n```\n\n## text-transform\n\n`text-transform` 控制文本的大小写。可能的取值如下所列，其中\
  \ `none` 为初始值：\n\n```\ntext-transform : inherit | none | uppercase | lowercase |\
  \ capitalize\n```\n\n此属性可以将文本转换为大写或小写字母。`capitalize` 值会将每个单词的首字母大写。此属性默认继承，因此可以使用\
  \ `none` 值来移除继承的 `text-transform` 效果。\n\n```\ntext-transform: none; /* 移除效果 */\n\
  ```\n\n## text-decoration\n\n可以使用 `text-decoration` 属性为文本添加一个或多个视觉效果。\n\n```\ntext-decoration\
  \ : none | underline + overline + line-through + blink\n```\n\n若要添加多个装饰效果，请用空格分隔这些值（如之前使用“`+`”号所示）。以下规则为应用此类的文本内容添加了上划线和下划线：\n\
  \n```\n.highlight { text-decoration: underline overline; }\n```\n\n此属性不会继承，但它的效果会以类似于继承的方式渲染到后代行内元素上。\n\
  \n## text-indent\n\n块级元素中第一行文本可以使用 `text-indent` 属性进行缩进。它可以设置为一个度量单位或父元素宽度的百分比。也可以通过使用负值来实现反向缩进。\n\
  \n```\ntext-indent (块级) : inherit | <length> | <percentage>\n```\n\n以下示例将段落元素的第一行缩进一个\
  \ em 的宽度：\n\n```\np { text-indent: 1em; }\n```\n\n## text-align\n\n块级元素的文本内容可以使用\
  \ `text-align` 属性进行对齐。此属性可以替代 HTML 中已废弃的 `align` 属性的用法。\n\n```\ntext-align (块级)\
  \ : inherit | left | center | right | justify\n```\n\n文本和行内元素可以左对齐、右对齐或居中对齐。`justify`\
  \ 值还会拉伸每一行，以使左右边距看起来都整齐。\n\n```\np { text-align: justify; }\n```\n\n`text-align`\
  \ 属性会继承，因此需要在子元素中显式更改它，以恢复默认的左对齐。\n\n## direction\n\n文本的书写方向可以使用 `direction` 属性进行切换。\n\
  \n```\ndirection (块级) : inherit | ltr | rtl\n```\n\n默认值是 `ltr`，表示从左到右。可以将其更改为 `rtl`，以使块级元素内的文本内容从右向左排列。这表明文本应从右向左阅读，例如希伯来语或阿拉伯语文本。\n\
  \n```\n<p style=\"direction: rtl\">\n  从右到左对齐\n</p>\n```\n\n此属性会继承，因此可以在 `<body>`\
  \ 元素上设置一次，使其应用于整个网页。\n\n\n\n## `text-shadow`\n\n可以使用 `text-shadow` 属性为文本添加阴影效果。\n\
  \n`text-shadow : inherit | none | <offset-x> <offset-y>` `[<blur-radius>] [<color>]`\n\
  \n阴影通过两个偏移值来定义，后跟两个可选值：模糊半径和颜色。X 和 Y 偏移量指定为相对于文本的长度值。正值会使阴影向右和向下移动；负值则使其向左和向上移动。\n\
  \n通过设置模糊半径可以添加模糊效果，这会使阴影边缘拉伸并淡出。该属性的最后一个可选值是阴影的颜色。如果未指定颜色值，大多数浏览器会以与文本相同的颜色渲染阴影。以下示例样式会在\
  \ `<h1>` 元素的右上角显示一个略微模糊的灰色阴影：\n\n`h1 { text-shadow: 1px -1px 1px gray; }`\n\n`text-shadow`\
  \ 是一个 CSS 3 属性，受大多数主流浏览器支持，包括 Chrome 2+、Firefox 3.5+、IE10+、Safari 1.2+ 和 Opera 9.5+。\n\
  \n## `box-shadow`\n\n除了文本，还可以使用 `box-shadow` 属性为块级元素添加阴影效果。\n\n`box-shadow (block)\
  \ : inherit | none | [inset]` `<offset-x> <offset-y>`\n\n`[<blur-radius>] [<spread-radius>\
  \ [<color>]]`\n\n盒阴影的值与 `text-shadow` 的值相同——有两个例外。可以指定第四个长度值 `spread-radius` 来放大或缩小阴影。此值是可选的，若未指定则默认为\
  \ 0，阴影与元素大小相同。例如，以下类规则会在任何使用此类的块级元素的右下角显示一个模糊的灰色阴影：\n\n`.drop-shadow { box-shadow:\
  \ 3px 3px 3px 6px #ccc; }`\n\n`box-shadow` 属性独有的第二个值是 `inset` 关键字。如果存在，阴影将显示在框内部，而不是作为外部投影。\n\
  \n`.inset-shadow { box-shadow: inset 3px 3px 3px 6px #ccc; }`\n\n`box-shadow` 是一个\
  \ CSS 3 属性，已在 Chrome 10+、Firefox 4+、IE9+、Safari 5.1+ 和 Opera 10.5+ 中实现。可以使用 `-webkit`\
  \ 和 `-moz` 前缀来扩展支持，如下所示：\n\n```\n.drop-shadow\n{\n  /* Chrome 1-5, Safari 2-5.1+\
  \ */\n  -webkit-box-shadow: 3px 3px 5px 6px #ccc;\n  /* Firefox 3.5-3.6 */\n  -moz-box-shadow:\
  \ 3px 3px 5px 6px #ccc;\n  box-shadow: 3px 3px 5px 6px #ccc;\n}\n```\n\n"
- "# 12. 间距\n\n以下属性涉及元素之间的间距。它们默认都会被继承。\n\n## `line-height`\n\n`line-height` 设置行与行之间的距离。初始值为\
  \ `normal`，通常渲染为字体大小的 120%。行高也可以设置为一个长度值、当前字体大小的百分比，或一个与当前字体大小相乘的无量纲数字。\n\n`line-height\
  \ : inherit | normal | <length> | <percentage> | <number>`\n\n`line-height` 属性可继承，因此设置\
  \ `line-height` 的首选方式是使用无量纲数字。将 `line-height` 设置为长度或百分比，可能会对使用不同字体大小的子元素产生意想不到的结果，因为继承的行高是固定的，而不是相对于子元素字体大小的。\n\
  \n```\n/* 行高是字体大小的 1.5 倍 */\nline-height: 1.5;\n```\n\n行高对可替换行内元素（如 `<img>`）没有影响。当用于非替换行内元素时，它会按预期设置行高。对于块级元素，`line-height`\
  \ 设置元素内部行框的最小高度。\n\n## `word-spacing` 和 `letter-spacing`\n\n`word-spacing` 设置单词之间的间距，`letter-spacing`\
  \ 设置单个字符之间的间距。这两个属性都允许使用负值。\n\n`word-spacing : inherit | normal | <length>`\n\n\
  `letter-spacing : inherit | normal | <length>`\n\n以下规则在段落内的字母之间创建 3 像素的间距，在单词之间创建\
  \ 5 像素的间距：\n\n```\np {\n  letter-spacing: 3px;\n  word-spacing: 5px;\n}\n```\n\n\
  ## `white-space`\n\n`white-space` 属性改变块级元素内空白字符的处理方式。\n\n`white-space (block) :\
  \ inherit | normal | nowrap |` pre | pre-wrap | pre-line\n\n在 HTML 中，多个空白字符通常会被合并为一个字符，并且文本会根据需要换行以填满包含它的块级元素的宽度。\n\
  \n```\n/* 换行文本，并折叠换行符、空格和制表符 */\np { white-space: normal; }\n```\n\n将 `white-space`\
  \ 设置为 `nowrap` 会阻止文本换行，除非遇到换行标签 `<br>`。`pre`（预格式化）值也会阻止换行，但它会保留所有空白字符。其行为与 HTML\
  \ 中的 `<pre>` 元素相同。\n\n`pre-wrap` 和 `pre-line` 值都允许文本正常换行，`pre-wrap` 会保留空白字符序列，而\
  \ `pre-line` 则会折叠它们。`pre-line` 与 `normal` 的区别在于，`pre-line` 会保留换行符。请注意，IE 浏览器直到版本\
  \ 8 才支持最后这两个值。\n\n"
- '# 13. 字体


  字体属性可用于更改字体的各个方面以及加载自定义字体。它们可以应用于任何元素，并且都可以继承。


  ## `font-family`


  `font-family` 设置字体的字型。其值可以是特定的字体名称，例如 `times` 或 `verdana`；也可以是通用字体系列名称，例如 `sans-serif`、`serif`
  或 `monospace`。


  `font-family : inherit | <family-names> | <generic-families>`


  该属性的值是一个包含一个或多个字体名称的优先级列表。如果浏览器无法获取第一种字体，它将使用下一种字体，依此类推。


  `font-family: "Times New Roman", times, serif;`


  建议在列表末尾使用一个字体系列名称，以确保至少在所有浏览器中字体系列保持一致。请注意，如果字体名称包含空格，则必须用双引号括起来，如上一个示例所示。


  ## `font-size`


  `font-size` 设置字体的大小。该值可以是任何度量单位，或是父元素字体大小的百分比。还有一些预定义的值，如下所列：


  `font-size : inherit | <length> | <percentage> |`

              `smaller | larger | xx-small | x-small |`

              `small | medium | large | x-large | xx-large`


  `larger` 和 `smaller` 值是相对于父元素字体大小的；其他预定义值指的是绝对大小。初始尺寸是 `medium`，对于普通文本来说是 1 em（16
  像素）。


  ## `font-style`


  `font-style` 使文本倾斜。根据规范，`italic` 是正常字体的草书伴生字型，而 `oblique` 是正常字体的倾斜形式。然而，对于大多数字体，这两种字型的渲染方式往往是相同的。


  `font-style : inherit | normal | italic | oblique`


  ## `font-variant`


  `font-variant` 可用于使用小型大写字母显示文本，而不是小写字母。`small-caps` 值会以小于常规大写字母的大写字母呈现文本。


  `font-variant : inherit | normal | small-caps`


  ## `font-weight`


  `font-weight` 设置字体的粗细。`bolder` 和 `lighter` 值相对于父元素设置粗细，数值则指定绝对粗细。`bold` 的值等于 700，`normal`
  等同于 400。


  `font-weight : inherit | normal | bold | bolder |`

                `lighter | 100 | 200 | ... | 900`


  即使可以指定多个粗细值，但大多数字体只有一种粗体类型，如下面的示例渲染所示：


  ```

  lighter normal bold bolder 100 200 300 400 500 600 700 800 900

  ```




  '
- "# 字体\n\n有一个便捷的简写属性`font`，它能够在一个声明中设置所有字体属性。\n\n```\nfont : inherit | <font-style>\
  \ + <font-variant> +\n       <font-weight> + <font-size> / <line-height> +\n   \
  \    <font-family>\n```\n\n这些属性必须按照上述顺序指定。只要保持此顺序，任何一个属性都可以省略（除了**必须**指定的`font-size`和`font-family`）。如果某个属性被省略，则会使用该属性的默认值，即继承父级的值。以下示例向段落元素应用了四个字体属性：\n\
  \n```\np { font: italic 50%/125% Verdana; }\n```\n\n这个字体声明在一个声明中设置了`font-style`、`font-size`、`line-height`和`font-family`属性。由于未包含`font-variant`和`font-weight`，使用此声明的一个副作用是它们都会被重新设置为`normal`。\n\
  \n"
- "# 自定义字体\n\n只有字体安装在用于查看网站的设备上时，才能看到所选字体。如果需要非标准字体，可以使用`@font-face`规则从在线位置加载字体。\n\
  \n```\n@font-face {\n  font-family: MyFont;\n  src: url(myfont.ttf);\n}\n```\n\n\
  此规则创建了一个名为`MyFont`的字体，并提供了一个浏览器可以从中下载该字体的 URL。有了这个规则，自定义字体就可以像任何标准字体一样使用。\n\n```\n\
  p { font-family: \"MyFont\", arial, sans-serif; }\n```\n\n这种使用`@font-face`规则的方式在\
  \ Chrome 5+、Firefox 3.5+、IE9+、Safari 3.1+ 和 Opera 10+ 中受支持。如果浏览器不支持自定义字体，则会回退到列表中的下一个标准字体。\n\
  \n"
- "# 背景\n\n背景属性可以添加背景效果。这些属性均不继承，并且可以应用于任何元素。\n\n## background-color\n\n元素背景的颜色通过`background-color`属性设置。默认情况下，其值设置为`transparent`。\n\
  \n```\nbackground-color : transparent | <color>\n```\n\n即使使用了背景图像，最好也设置一个背景颜色。这样，万一出于任何原因背景图像不可用，也能有一个后备颜色。\n\
  \n```\nbackground-color: #ccc;\n```\n\n## background-image\n\n`background-image`通过`url`函数指定要用作背景的图像。\n\
  \n```\nbackground-image : none | url(<url>)\n```\n\n使用`url`函数定义的图像位置可以是绝对路径，也可以是相对于\
  \ CSS 文件位置的相对路径。\n\n```\n/* 相对路径 */\nbackground-image: url(../images/myimg.jpg);\n\
  \n/* 绝对路径 */\nbackground-image: url(http://mydomain.com/images/myimg.jpg);\n```\n\
  \n## background-repeat\n\n默认情况下，背景图像在水平和垂直方向上都会重复。可以通过`background-repeat`属性更改此行为，使背景仅水平重复（`repeat-x`）、仅垂直重复（`repeat-y`）或完全不重复（`no-repeat`）。\n\
  \n```\nbackground-repeat : repeat | repeat-x | repeat-y | no-repeat\n```\n\n## background-attachment\n\
  \n当在浏览器中滚动视口时，背景图像通常与页面的其余部分一起滚动。此行为由`background-attachment`属性决定，其初始值为`scroll`。如果该值设置为`fixed`，则背景的位置将相对于视口，使得背景即使在页面滚动时也保持原位。\n\
  \n```\nbackground-attachment : scroll | fixed | local\n```\n\nCSS 3 为该属性引入了第三个值`local`，它将背景相对于元素内容而非整个视口固定。使用此值时，背景仅在该元素本身滚动时（通过使用`overflow`属性实现）才随元素内容滚动。对此值的支持是在\
  \ Chrome 4+、Firefox 25+、IE9+、Safari 5+ 和 Opera 10.5+ 中引入的。\n\n## background-position\n\
  \n`background-position`属性用于定位背景图像，一个值用于垂直放置，另一个用于水平放置。它们都可以设置为长度值或元素大小的百分比，并且允许使用负值。此属性还有一些预定义值，包括：用于垂直放置的`top`、`center`和`bottom`；以及用于水平放置的`left`、`center`和`right`。\n\
  \n```\nbackground-position : <length> <length> | <percentage> <percentage> |\n \
  \                     top/center/bottom + left/center/right\n```\n\n默认情况下，背景图像定位在其父元素内边距区域的左上角。给出的任何长度值都会使背景图像相对于这些边缘移动。例如，以下属性将背景向下偏移\
  \ 5 像素，向右偏移 10 像素：\n\n```\nbackground-position: 5px 10px;\n```\n\nCSS 3 增加了一种四值语法，允许选择图像将相对于元素的哪一侧进行定位。使用这种语法，下一个示例中的背景将相对于元素的右下角而非左上角进行定位。\n\
  \n```\nbackground-position: bottom 5px right 5px;\n```\n\n这种四值语法仅在 Chrome 25+、Firefox\
  \ 13+、IE9+、Safari 5.28+ 和 Opera 10.5+ 中受支持。\n\n## background-size\n\n背景图像的大小通常与图像的实际大小相同。可以通过`background-size`属性更改此大小，该属性允许将背景重新调整为以像素指定的尺寸，或相对于背景定位区域的百分比。\n\
  \n```\nbackground-size (1-2) : auto | <length> | <percentage> | cover | contain\n\
  ```\n\n使用两个值时，第一个值确定图像的宽度，第二个值确定其高度。\n\n```\nbackground-size: 150% 100%;\n```\n\n\
  单个值仅定义图像的宽度。高度随后会隐式设置为`auto`，从而保持图像的宽高比。\n\n```\nbackground-size: 150%;\n```\n\n\
  `contain`和`cover`关键字用于调整背景大小以填充父容器，同时保持宽高比。`cover`值确保图像完全覆盖背景定位区域，而`contain`则确保背景被包含在该区域内。它们之间的区别如图\
  \ 14-1 所示。\n\n![A978-1-4302-6491-0_14_Fig1_HTML.jpg](img/A978-1-4302-6491-0_14_Fig1_HTML.jpg)\n\
  \n图 14-1. 使用`cover`和`contain`关键字调整大小的背景\n\n此属性是在 CSS 3 中添加的，并在 Chrome 4+、Firefox\
  \ 4+、IE9+、Safari 5+ 和 Opera 10.5+ 中受支持。使用`-webkit`和`-moz`前缀可将支持扩展到 Chrome 1+、Safari\
  \ 3+ 和 Firefox 3.6+ 等版本。\n\n## background-clip\n\n背景图像或颜色的绘制区域可以通过`background-clip`属性设置。\n\
  \n```\nbackground-clip : border-box | padding-box | content-box\n```\n\n背景通常延伸到边框的外边缘（`border-box`），并渲染在任何可见边框的后面。值为`padding-box`则会将背景绘制在元素的内边距区域内。第三个可能的值`content-box`会将背景绘制在内容区域内。使用以下声明，背景将被裁剪到内容的外边缘：\n\
  \n```\nbackground-clip: content-box;\n```\n\n`background-clip`在 Chrome 1+、Firefox\
  \ 4+、IE9+、Safari 3+ 和 Opera 12+ 中受支持。\n\n\n\n## `background-origin`\n\n`background-origin`属性决定了背景图像或颜色的起始点。\n\
  \n`background-origin : padding-box | border-box | content-box`\n\n背景图像通常从元素内边距区域的左上角（`padding-box`）开始渲染。可以更改此行为，使背景从边框区域的左上角（`border-box`）或内容区域的左上角（`content-box`）开始。\n\
  \n`background-origin`属性通常与`background-clip`一起使用，以同时更改背景的起始点和裁剪区域。以下声明将两者都设置为内容区域：\n\
  \n`background-origin: content-box;`\n\n`background-clip: content-box;`\n\n`background-origin`属性是\
  \ CSS 3 属性，适用于 Chrome 4+、Firefox 4+、IE9+、Opera 10.5+和 Safari 5+。如下一个示例所示，所有版本的 Firefox\
  \ 和 Chrome 以及 Safari 4 都支持带有`-moz`和`-webkit`前缀的写法。请注意，Firefox 在版本 4 之前使用`padding`和`border`作为值；当时没有用于指定内容框作为起点的值。\n\
  \n```\n/* Chrome 1-3, Safari 4 */\n-webkit-background-origin: border-box;\n/* Firefox\
  \ 1-3.6 */\n-moz-background-origin: border;\nbackground-origin: border-box;\n```\n\
  \n## `background`\n\n`background`属性是用于在单个声明中设置所有背景属性的简写形式。\n\n`background : <background-color>\
  \ + <background-image> + <background-repeat> + <background-attachment> + <background-position>\
  \ + <background-size> + <background-clip> + <background-origin>`\n\n值的顺序无关紧要，因为它们之间没有歧义。可以省略任何一个值，但请记住，使用此属性时，省略的属性将被重置为默认值。\n\
  \n`background: url(bg.png) no-repeat fixed right bottom;`\n\n在大多数情况下，当设置多个单独属性时，优先使用诸如这样的简写属性。它比使用等效的长写属性性能更好，更易于维护，如下所示：\n\
  \n```\nbackground-image: url(bg.png);\nbackground-repeat: no-repeat;\nbackground-attachment:\
  \ fixed;\nbackground-position: right bottom;\n```\n\n## 多重背景\n\n通过以逗号分隔的列表指定属性值，可以将多个背景应用于同一元素。列表中的第一个背景显示在最上层，每个后续背景仅通过其上方堆叠背景的透明区域可见。\n\
  \n```\nbackground-image: url(bg1.png), url(bg2.png);\nbackground-repeat: no-repeat,\
  \ repeat-y;\nbackground-attachment: fixed, fixed;\nbackground-position: right bottom,\
  \ top left;\n```\n\n简写属性也可以与多重背景一起使用，方式如下：\n\n```\nbackground: url(bg1.png) no-repeat\
  \ fixed right bottom,\n            url(bg2.png) repeat-y fixed top left;\n```\n\n\
  对多重背景的支持在 CSS 3 中引入，并已包含在 Chrome 4+、Firefox 3.6+、IE9+、Safari 3.1+和 Opera 10.5+浏览器中。可以为不支持多重背景的旧浏览器提供回退图像。\n\
  \n```\nbackground-image: bg.png; /* 回退 */\nbackground-image: bg1.png, bg2.png;\n\
  ```\n\n"
- "# 15. 渐变\n\n渐变是一种颜色填充，可以从一种颜色平滑过渡到另一种颜色。渐变函数在 CSS 3 中引入，根据规范，可以在任何需要图像的地方使用，但它们主要与`background`或`background-image`属性一起使用，以创建背景渐变。\n\
  \n## 线性渐变\n\n`linear-gradient()`函数定义了一个从一种颜色平滑过渡到另一种颜色的渐变。\n\n`linear-gradient([<angle>\
  \ | to <side-or-corner>] {, <color stop> [stop position]} (2-`∞`) )`\n\n在其最简单的形式中，线性渐变由两种颜色组成，从上到下均匀分布。在图\
  \ 15-1 中，渐变从灰色开始，在底部过渡为黑色。\n\n```\n.mygradient {\n  background-image: linear-gradient(gray,\
  \ black);\n}\n```\n\n![A978-1-4302-6491-0_15_Fig1_HTML.jpg](img/A978-1-4302-6491-0_15_Fig1_HTML.jpg)\n\
  \n图 15-1. 简单线性渐变\n\n渐变的角度可以通过使用关键字`to`后跟渐变的终点方向来设置：`top`、`right`、`bottom`、`left`或它们的任意组合。示例如图\
  \ 15-2 所示。\n\n```\nlinear-gradient(to bottom right, gray, black);\n```\n\n![A978-1-4302-6491-0_15_Fig2_HTML.jpg](img/A978-1-4302-6491-0_15_Fig2_HTML.jpg)\n\
  \n图 15-2. 右下角线性渐变\n\n可以使用`deg`单位指定更精确的角度，其中`0deg`等同于`to top`。角度按顺时针方向递增，并允许负角度。\n\
  \n```\nlinear-gradient(0deg,   gray, black); /* 向上 */\nlinear-gradient(90deg,  gray,\
  \ black); /* 向右 */\nlinear-gradient(180deg, gray, black); /* 向下 */\nlinear-gradient(-90deg,\
  \ gray, black); /* 向左 */\n```\n\n可以在起始颜色和结束颜色之间添加额外的颜色停止点。任何颜色停止点后都可以跟一个停止位置，指定为百分比或长度值。如果未指定停止位置，则颜色均匀分布。在以下情况下，白色设置为\
  \ 25%，而不是其默认位置 50%。图 15-3 展示了此代码的结果。\n\n```\nlinear-gradient(gray, white 25%, black);\n\
  ```\n\n![A978-1-4302-6491-0_15_Fig3_HTML.jpg](img/A978-1-4302-6491-0_15_Fig3_HTML.jpg)\n\
  \n图 15-3. 具有多个颜色停止点的渐变\n\n到目前为止描述的标准语法支持 Chrome 26+、Firefox 16+、IE10+、Safari 6.1+和\
  \ Opera 12.1+。遗留语法可以与`-moz`、`-webkit`和`-o`前缀一起使用，以将支持范围扩展到 Firefox 3.6、Chrome 1、Safari\
  \ 4 和 Opera 11.1。\n\n```\n.linear-gradient\n{\n  background-color: red; /* 回退颜色\
  \ */\n  /* Chrome 1-9, Safari 4-5 */\n  background: -webkit-gradient(linear, left\
  \ top, right top, from(red), to(orange));\n  /* Chrome 10-25, Safari 5.1-6.1 */\n\
  \  background: -webkit-linear-gradient(left, red, orange);\n  /* Firefox 3.6-15\
  \ */\n  background: -moz-linear-gradient(left, red, orange);\n  /* Opera 11.1-12.1\
  \ */\n  background: -o-linear-gradient(left, red, orange);\n  /* 标准语法 */\n  background:\
  \ linear-gradient(to right, red, orange);\n}\n```\n\n\n\n## 径向渐变\n\n径向渐变是从中心点向外过渡的渐变。在\
  \ CSS 中，这类渐变使用 `radial-gradient()` 函数定义。\n\n`radial-gradient([<形状> + <尺寸>] [at <位置>]`\
  \ `{, <色标> [停止位置]} {2-`∞`} )`\n\n要创建径向渐变，至少必须定义两个色标。图 15-4 中的径向渐变从中心的灰色开始，逐渐过渡到黑色。\n\
  \n`radial-gradient(gray, black);`\n\n![A978-1-4302-6491-0_15_Fig4_HTML.jpg](img/A978-1-4302-6491-0_15_Fig4_HTML.jpg)\n\
  \n图 15-4. 简单的径向渐变\n\n与 `linear-gradient()` 一样，允许使用两个以上的色标，并且它们后面可以跟随一个长度或百分比值，用于指示颜色的停止位置。示例如图\
  \ 15-5 所示。\n\n`radial-gradient(black 25%, white, black 75%);`\n\n![A978-1-4302-6491-0_15_Fig5_HTML.jpg](img/A978-1-4302-6491-0_15_Fig5_HTML.jpg)\n\
  \n图 15-5. 设置了停止位置的径向渐变\n\n径向渐变的形状可以是 `ellipse`（椭圆）或 `circle`（圆形）。默认形状是 `ellipse`，它允许渐变自动扩展以匹配元素的高度和宽度，如图\
  \ 15-5 所示。另一种 `circle` 值（如图 15-6 所示）则强制渐变呈圆形，无论元素的形状如何。\n\n`radial-gradient(circle,\
  \ black 25%, white, black 75%);`\n\n![A978-1-4302-6491-0_15_Fig6_HTML.jpg](img/A978-1-4302-6491-0_15_Fig6_HTML.jpg)\n\
  \n图 15-6. 圆形径向渐变\n\n对于椭圆，可以使用两个长度值；对于圆形，则使用一个值，来设置渐变的水平半径和垂直半径。对于椭圆，它们也可以是相对于元素尺寸的百分比值，如图\
  \ 15-7 所示。\n\n`radial-gradient(75% 25%, gray, black);`\n\n![A978-1-4302-6491-0_15_Fig7_HTML.jpg](img/A978-1-4302-6491-0_15_Fig7_HTML.jpg)\n\
  \n图 15-7. 调整尺寸后的径向渐变\n\n如果不需要如此精确，可以使用以下预定义的关键字来设置尺寸：`closest-side`、`closest-corner`、`farthest-side`\
  \ 或 `farthest-corner`。这些值指定渐变是受限于距离原点最近还是最远的元素边或角（见图 15-8）。例如，`farthest-side` 值会调整渐变尺寸，使其最后一个颜色结束于元素距离原点最远的那一侧。\n\
  \n`radial-gradient(farthest-side, gray, black);`\n\n![A978-1-4302-6491-0_15_Fig8_HTML.jpg](img/A978-1-4302-6491-0_15_Fig8_HTML.jpg)\n\
  \n图 15-8. 尺寸关键字\n\n径向渐变的原点默认位于中心。可以通过在关键字 `at` 后指定渐变原点的位置来改变它，其位置指定方式与 `background-position`\
  \ 属性相同。先指定水平位置，可选地后接垂直位置。位置可以使用关键字（`left`、`center`、`right + top`、`center` 和 `bottom`）、长度值、百分比值或其组合来设置。图\
  \ 15-9 给出了一个示例，其中渐变原点被移到了元素的右下角。\n\n`radial-gradient(at right bottom, gray, black);`\n\
  \n![A978-1-4302-6491-0_15_Fig9_HTML.jpg](img/A978-1-4302-6491-0_15_Fig9_HTML.jpg)\n\
  \n图 15-9. 右下角原点\n\n当 `radial-gradient()` 函数与 `-moz`、`-webkit` 和 `-o` 等浏览器厂商前缀一起使用时，其对浏览器的支持情况与\
  \ `linear-gradient()` 大致相同。与 `linear-gradient()` 一样，径向渐变的语法也经历了一些修订。以下是跨浏览器完整语法的示例：\n\
  \n```\n.radial-gradient\n{\nbackground-color: red; /* 备用颜色 */\n/* Chrome 1-9, Safari\
  \ 4-5 */\nbackground: -webkit-gradient(radial, center center, 0px, center center,\
  \ 100%, color-stop(0%,red), color-stop(100%,orange));\n/* Chrome 10-25, Safari 5.1-6.1\
  \ */\nbackground: -webkit-radial-gradient(center, ellipse cover, red 0%, orange\
  \ 100%);\n/* Firefox 3.6-16 */\nbackground: -moz-radial-gradient(center, ellipse\
  \ cover, red 0%, orange 100%);\n/* Opera 11.6-12.1 */\nbackground: -o-radial-gradient(center,\
  \ ellipse cover, red 0%, orange 100%);\n/* 标准语法 */\nbackground: radial-gradient(ellipse\
  \ at center, red 0%, orange 100%);\n}\n```\n\n## 重复渐变\n\n线性渐变和径向渐变本身不会重复渐变图案，因为它们会自然地拉伸以填充定义它们的元素。有两个额外的函数用于创建重复渐变：`repeating-linear-gradient()`\
  \ 和 `repeating-radial-gradient()`。\n\n为了实现线性渐变的重复，使用 `repeating-linear-gradient()`\
  \ 函数。此函数的参数与 `linear-gradient()` 相同。\n\n`repeating-linear-gradient([<角度> | to <边或角>]`\
  \ `{, <色标> [停止位置]} (2-`∞`) )`\n\n重复线性渐变会无限重复色标。渐变的大小由最后一个色标决定。为避免生硬的过渡，图 15-10 中的起始颜色在末尾处被重复了一次。\n\
  \n`repeating-linear-gradient(-45deg, white 0, black 10%, white 20%);`\n\n![A978-1-4302-6491-0_15_Fig10_HTML.jpg](img/A978-1-4302-6491-0_15_Fig10_HTML.jpg)\n\
  \n图 15-10. 重复线性渐变\n\n径向渐变的重复函数也与非重复版本共享相同的语法。图 15-11 所示的示例演示了重复函数。请注意，与之前的示例相比，此渐变具有锐利的颜色过渡。\n\
  \n`repeating-radial-gradient(black, black 5%, white 5%, white 10%)`\n\n![A978-1-4302-6491-0_15_Fig11_HTML.jpg](img/A978-1-4302-6491-0_15_Fig11_HTML.jpg)\n\
  \n图 15-11. 重复径向渐变\n\n定义渐变的语法明显比许多其他 CSS 特性更复杂。因此，使用在线工具以图形方式设计所需的渐变通常是更好的选择。可以在\
  \ `Colorzilla.com` 上找到这样的工具。¹ 除了符合标准规范的渐变代码外，它还提供了实现最大浏览器兼容性所必需的带有厂商前缀的版本。\n\n脚注\
  \ 1\n\n`http://www.colorzilla.com/gradient-editor`\n\n"
- '# 16. 盒模型


  所谓的 CSS 盒模型描述了一个 HTML 元素所占用的空间。在这个模型中，每个元素由四个盒子组成：内容（content）、内边距（padding）、边框（border）和外边距（margin），如图
  16-1 所示。


  ![A978-1-4302-6491-0_16_Fig1_HTML.jpg](img/A978-1-4302-6491-0_16_Fig1_HTML.jpg)


  图 16-1. CSS 盒模型


  围绕内容的三个盒子（内边距、边框、外边距）在元素的顶部、右侧、底部和左侧可以有不同的尺寸。这些尺寸中的任意一个或全部也可以设置为零。




  ## 行内元素与块级元素


  HTML 主要有两类元素：块级元素和行内元素。盒模型对这两类元素的适用方式不同，因此理解它们的区别至关重要。行内元素的例子包括`<a>`、`<strong>`
  和 `<em>`，而 `<p>`、`<h1>` 和 `<form>` 则是块级元素。


  行内元素与文本内容一同流动，并根据需要自动换行以适应其容器的宽度。它们不能包含块级元素，但 `<a>` 元素除外，它可以包裹任何类型的元素。


  块级元素可以同时包含块级元素和行内元素（见图 16-2）。它们通过在自身周围创建一个水平扩展的虚拟盒子来中断文本流，使得每个块级元素前后看起来都像有换行符。由于这些特性，块级元素也被称为盒子或容器。


  ![A978-1-4302-6491-0_16_Fig2_HTML.jpg](img/A978-1-4302-6491-0_16_Fig2_HTML.jpg)


  图 16-2.


  块级元素与行内元素


  行内元素和块级元素周围的盒子具有不同的特性。块级元素可以操作盒模型中的所有属性，包括内容区域的宽度和高度，以及边框、内边距和外边距。如果没有设置宽度，块级元素会在水平方向上扩展到其包含元素所允许的最大宽度。


  行内元素的限制更多，它无法设置垂直方向的外边距（顶部或底部），也无法改变其行内盒子的宽度或高度。对于行内元素，最小高度可以通过 `line-height` 属性设置，但其宽度和高度会自动调整以适应元素所包含的内容。


  行内元素中有一个子类，称为可替换行内元素，它们使用外部对象，例如 `<img>`、`<video>` 和 `<object>`；以及表单元素，例如 `<input>`
  和 `<textarea>`。对于这些行内元素，所有盒模型属性都可以像块级元素一样进行操控。


  ### Span 与 Div


  使用 `<span>` 和 `<div>` 元素是为网页文档添加结构的一种通用方式。这些元素本身没有关联的样式，这使得它们特别适合与类选择器和 ID 选择器配合使用。这两者的区别在于：`<span>`
  是行内元素，而 `<div>` 是块级元素。


  `<span>行内</span>`


  `<div>块级</div>`


  作为一个行内元素，`<span>` 主要用于为文本片段添加样式。它不能用于设置块级元素的样式，因为根据 HTML 规范，块级元素不允许放在行内元素内部。


  `<span style="color: red;">红色文本</span>`


  相比之下，`<div>` 用于为其他块级元素和行内元素创建带样式的容器。这些自定义容器通常构成了网页的布局。由于它是块级元素，`<div>` 允许操控元素的所有盒子属性（宽度、高度、内边距、边框和外边距）。


  `<div class="a">`


    `<div class="b">块级中的块级</div>`


  `</div>`


