- "# 17. 边框\n\n边框属性用于格式化元素周围的边框。它们可以应用于任何元素，并且不会继承。\n\n## border-style\n\n要使元素的边框可见，必须将\
  \ `border-style` 属性设置为除 `none`（默认值）之外的其他值。\n\n`border-style (1-4) | border-top-style\
  \ |`\n\n`border-right-style | border-bottom-style |`\n\n`border-left-style :`\n\n\
    `none | dashed | dotted | double | groove |`\n\n  `hidden | inset | outset | ridge\
  \ | solid`\n\n实线边框样式是最常用的，但如图 17-1 所示，还有其他几种显示边框的选项。`hidden` 值会移除边框，与 `none` 同义，不同之处在于它还会隐藏具有合并边框的表格中的共享边框。\n\
  \n![A978-1-4302-6491-0_17_Fig1_HTML.jpg](img/A978-1-4302-6491-0_17_Fig1_HTML.jpg)\n\
  \n图 17-1.\n\nborder-style 外观\n\n`border-style` 属性是可以设置一到四个值的多个属性之一。当指定的值少于四个时，`border-style`\
  \ 的值会重复，如图 17-2 所示。\n\n![A978-1-4302-6491-0_17_Fig2_HTML.jpg](img/A978-1-4302-6491-0_17_Fig2_HTML.jpg)\n\
  \n图 17-2.\n\n1 到 4 值语法解释\n\n根据这些规则，以下声明是等效的，都会在元素的顶部和底部显示实线边框：\n\n`border-style:\
  \ solid none solid none;`\n\n`border-style: solid none solid;`\n\n`border-style:\
  \ solid none;`\n\n要使所有边框的样式相同，只需指定一个样式值。\n\n`border-style: solid;`\n\n`border-style`\
  \ 属性有四个子属性，也可以用来分别设置各边边框的样式。\n\n`border-top-style:    dotted;`\n\n`border-right-style:\
  \  dashed;`\n\n`border-bottom-style: ridge;`\n\n`border-left-style:   inset;`\n\n\
  ## border-width\n\n`border-width` 属性用于控制边框的宽度，可以使用长度单位或预定义值之一来设置：`thin`、`medium`\
  \ 或 `thick`。初始值为 `medium`，通常渲染为 3 像素。\n\n`border-width (1-4) | border-top-width\
  \ |`\n\n`border-right-width | border-bottom-width |`\n\n`border-left-width :`\n\n\
  \  `<length> | thin | medium | thick`\n\n与 `border-style` 类似，该属性可以有一到四个值，并有四个子属性用于单独设置各边的边框宽度。\n\
  \n```\n/* 快捷属性 */\nborder-width: thin medium;\n\n/* 完整属性 */\nborder-top-width: \
  \   thin;\nborder-right-width:  medium;\nborder-bottom-width: thin;\nborder-left-width:\
  \   medium;\n```\n\n宽度为零表示不显示边框。该值与将边框样式设置为 `none` 效果相同。\n\n## border-color\n\n\
  `border-color` 用于设置边框的颜色。CSS 没有指定默认的边框颜色，但大多数浏览器将其渲染为灰色。该属性可以有一到四个值，并有四个子属性用于单独设置各边的边框颜色。\n\
  \n`border-color (1-4) | border-top-color |`\n\n`border-right-color | border-bottom-color\
  \ |`\n\n`border-left-color :`\n\n  `<color> | transparent`\n\n将颜色设置为 `transparent`\
  \ 会使边框不可见，而不会改变布局。\n\n`border-color: transparent;`\n\n## border\n\n`border` 属性可以在一个声明中同时设置边框的宽度、样式和颜色。它是控制边框最常用的属性。\n\
  \n`border | border-top | border-right |`\n\n`border-bottom | border-left :`\n\n\
  \  `<border-width> + <border-style> + <border-color>`\n\n这些值可以按任意顺序设置，因为它们之间没有歧义。也可以省略其中任意一个值。\n\
  \n`border: 1px solid black;`\n\n`border` 属性有四个子属性，用于分别指定四个边的边框设置。\n\n`border-top:\
  \    1px solid red;`\n\n`border-right:  1px solid blue;`\n\n`border-bottom: 1px\
  \ solid aqua;`\n\n`border-left:   1px solid lime;`\n\n\n\n## `border-radius`\n\n\
  边框的角可以使用`border-radius`属性或其四个子属性来设置为圆角。\n\n`border-radius (1-4) | border-top-left-radius\
  \ |`\n`border-top-right-radius | border-bottom-right-radius |`\n`border-bottom-left-radius\
  \ :`\n  `<length> | <percentage> [ / <length> | <percentage> ]`\n\n`border-radius`属性可以接受一到四个值。每个半径值可以通过使用圆形半径的一个值或椭圆形半径的两个值来设置。该值可以是长度或百分比。如果使用百分比，则相对于容器的尺寸。下面的示例在图\
  \ 17-3 中展示：\n\n```\n.a { border-radius: 5px; }\n.b { border-radius: 5px 20px; }\n\
  .c { border-radius: 50%; }\n.d { border-radius: 30px/10px; }\n```\n\n![A978-1-4302-6491-0_17_Fig3_HTML.jpg](img/A978-1-4302-6491-0_17_Fig3_HTML.jpg)\n\
  \n图 17-3.\n边框半径示例\n\n四个边各自的半径可以使用`border-radius`的四个子属性来设置。以下示例渲染效果与图 17-3 中的第二个框相同：\n\
  \n```\nborder-top-left-radius:     5px;\nborder-top-right-radius:    20px;\nborder-bottom-right-radius:\
  \ 5px;\nborder-bottom-left-radius:  20px;\n```\n\n`border-radius`是一个得到良好支持的 CSS3\
  \ 属性。为了增加对旧版浏览器的支持，可以使用`-webkit`和`-moz`浏览器前缀。\n\n```\n.round {\n  /* Safari 3-4\
  \ */\n  -webkit-border-radius: 5px;\n  /* Firefox 1-3.6 */\n  -moz-border-radius:\
  \ 5px;\n  /* Opera 10.5, IE9, Safari 5, Chrome 1, Firefox 4 */\n  border-radius:\
  \ 5px;\n}\n```\n\n"
- "# 18. 轮廓\n\n轮廓是绘制在元素周围、边框边缘外侧的一条线。它通常表现为围绕交互元素的虚线，以显示哪个元素获得了焦点。虽然与边框类似，但轮廓的不同之处在于它不占用盒模型中的任何空间。此外，与边框不同，轮廓的所有四个边必须保持一致。轮廓属性可以应用于任何元素，且它们都不具有继承性。\n\
  \n## `outline-style`\n\n轮廓的样式通过`outline-style`属性设置。要显示轮廓，需要将值设置为`none`（默认值）以外的其他值。\n\
  \n```\noutline-style : none | solid | dotted | dashed | double |\n             \
  \   groove | ridge | inset | outset\n```\n\n此属性允许与`border-style`相同的值，但`hidden`不是有效的`outline-style`值。它们的渲染效果也相同，如图\
  \ 18-1 所示。\n\n![A978-1-4302-6491-0_18_Fig1_HTML.jpg](img/A978-1-4302-6491-0_18_Fig1_HTML.jpg)\n\
  \n图 18-1.\n轮廓样式外观\n\n## `outline-width`\n\n轮廓的厚度通过`outline-width`属性指定。与`border-width`属性类似，其值可以是指定的长度，也可以是关键字`thin`、`medium`或`thick`。\n\
  \n```\noutline-width : <length> | thin | medium | thick\n```\n\nCSS 并未指定这三个关键字的数字厚度，但它们通常分别渲染为`1px`、`3px`和`5px`。与`border-width`一样，此属性的初始值为`medium`。\n\
  \n## `outline-color`\n\n轮廓的颜色可以通过`outline-color`属性更改。除了标准的颜色表示法外，关键字`invert`也是此属性的有效值。\n\
  \n```\noutline-color : invert | <color>\n```\n\n为了确保适当的对比度，规范建议默认值为`invert`，它会将轮廓设置为其下方颜色的反色。然而，只有\
  \ IE8+ 和 Opera 7+ 实际支持此值，因此并不常用。\n\n## `outline`\n\n`outline`是一个简写属性，用于在单个声明中设置上述所有轮廓属性。\n\
  \n```\noutline : <outline-width> + <outline-style> + <outline-color>\n```\n\n值可以按任意顺序指定，因为它们之间没有歧义。其中任何一个值都可以省略。\n\
  \n```\noutline: thin solid red;\n```\n\n这与单独设置所有属性的效果相同，但语法更便捷：\n\n```\noutline-width:\
  \ thin;\noutline-style: solid;\noutline-color: red;\n```\n\n## `outline-offset`\n\
  \n轮廓与边框边缘之间的间距可以通过 CSS3 引入的`outline-offset`属性来设置。\n\n```\noutline-offset : <length>\n\
  ```\n\n以下声明将轮廓向外移动 3 像素。允许使用负值，这会将轮廓向内移动到元素内部。\n\n```\noutline-offset: 3px;\n```\n\
  \n虽然此属性在 IE 中不受支持，但它在所有其他主流浏览器中均有效。\n\n"
- "# 19. 外边距和内边距\n\n外边距和内边距用于调整元素的位置并在其周围创建空间。\n\n## 内边距\n\n内边距是元素内容与其边框之间的空间。它通过此处显示的内边距属性进行设置。这些属性不具有继承性，并且可以应用于任何元素。\n\
  \n```\npadding (1-4) | padding-top | padding-right |\npadding-bottom | padding-left\
  \ :\n  <length> | <percentage>\n```\n\n有四个属性用于单独设置每一边的内边距。在以下示例中，垂直（顶部、底部）内边距将为\
  \ 10 像素，水平（右侧、左侧）内边距将为零。\n\n```\npadding-top:    10px;\npadding-right:  0;\npadding-bottom:\
  \ 10px;\npadding-left:   0;\n```\n\n这些声明可以使用`padding`属性缩短为单个声明。内边距值随后按顺时针顺序指定：上、右、下、左。\n\
  \n```\npadding: 10px 0 10px 0;\n```\n\n与许多与盒模型相关的其他属性一样，`padding`属性可以设置一至四个值，这些值对应于元素盒子的各边。当少于四个值时，内边距会按图\
  \ 19-1 所示重复。\n\n![A978-1-4302-6491-0_19_Fig1_HTML.jpg](img/A978-1-4302-6491-0_19_Fig1_HTML.jpg)\n\
  \n图 19-1.\n1 至 4 值语法解释\n\n例如，如果指定了两个值，则第一个值设置顶部和底部的内边距，第二个值设置右侧和左侧的内边距。这使得编写上一个示例的方式更加简短。\n\
  \n```\npadding: 10px 0;\n```\n\n请记住，内边距是元素背景的一部分，并受背景属性的影响，而外边距始终是透明的。\n\n## 外边距\n\
  \n外边距是元素边框周围的空间，通过下面列出的外边距属性进行设置。这些属性不具有继承性，并且可以应用于任何元素，但垂直外边距不影响非替换行内元素除外。\n\n\
  ```\nmargin (1-4) | margin-top | margin-right |\nmargin-bottom | margin-left:\n\
  \  <length> | <percentage> | auto\n```\n\n外边距和内边距都可以使用百分比值，这些值相对于包含元素的宽度和高度。与内边距不同，外边距可以为负值，这允许元素区域重叠。`auto`关键字让浏览器自动计算外边距。\n\
  \n与外边距和内边距属性类似，`margin`属性可以设置一至四个值。例如，在以下声明中，上下外边距将为`1cm`，左右外边距将为`0`：\n\n```\nmargin:\
  \ 1cm 0;\n```\n\n`margin`属性也有四个子属性，它们提供了一种更详细的方法来设置四个边各自的外边距。\n\n```\nmargin-top:\
  \    1cm;\nmargin-right:  0;\nmargin-bottom: 1cm;\nmargin-left:   0;\n```\n\n相邻盒子的上下外边距会共享，因此两个盒子之间的垂直距离不是外边距之和，而是两个外边距中较大的一个。因此，以下两个`<div>`盒子之间的距离将仅为\
  \ 10 像素：\n\n```\n<div style=\"margin-bottom: 5px;\">顶部盒子</div>\n<div style=\"margin-top:\
  \ 10px;\">底部盒子</div>\n```\n\n\n\n"
- "# 20. 尺寸\n\n尺寸属性控制元素的大小及其最小和最大尺寸。这些属性不具有继承性，且只能应用于块级元素和可替换内联元素。\n\n## width 和 height\n\
  \n元素内容区域的宽度和高度可以通过 `width` 和 `height` 属性来设置。这两个属性可以赋予长度值或百分比值，其中百分比是相对于父元素的尺寸而言的。\n\
  \n`width | height : auto | <length> | <percentage>`\n\n块级元素通常会伸展至其容器的边缘。相比之下，元素的高度会收缩以适应其内容。通过使用\
  \ `width` 和 `height` 属性，可以改变这些默认行为。在下面的示例中，应用了该类的元素具有 100 像素的宽度和 50 像素的高度。像这样设置尺寸后，无论页面如何调整大小，该元素都会保持该尺寸。\n\
  \n```\n.mybox {\n  width: 100px;\n  height: 50px;\n}\n```\n\n## min-width 和 min-height\n\
  \n`min-width` 和 `min-height` 属性设置元素的最小尺寸。元素的宽度和高度仍然会扩展以适应内容，但元素不会收缩到低于指定的最小尺寸，这最小尺寸不包括内边距、边框或外边距。\n\
  \n`min-width | min-height : <length> | <percentage>`\n\n这些属性的有效值是长度和百分比，其中百分比是相对于包含块的尺寸而言的。例如，以下类使元素至少占据可用宽度和高度的一半：\n\
  \n```\n.half {\n  min-width: 50%;\n  min-height: 50%;\n}\n```\n\n## max-width 和\
  \ max-height\n\n元素内容区域的最大尺寸通过 `max-width` 和 `max-height` 属性来设置。它们可以设置为长度值或百分比值，以及关键字\
  \ `none` 来清除之前设置的值。\n\n`max-width | max-height : none | <length> | <percentage>`\n\
  \n通过同时设置最大和最小宽度，你可以定义一个元素宽度可变动的区间。使用以下类的块级元素在空间允许时会扩展到 500 像素。当水平空间受限时，该元素允许收缩到不低于\
  \ 200 像素。\n\n```\n.mybox {\n  max-width: 500px;\n  min-width: 200px;\n}\n```\n\n\
  `max-width` 属性优先级高于 `min-width`。然而，对于高度属性则相反，因为 `min-height` 优先级高于 `max-height`。因此，使用以下类的元素高度为\
  \ 5 em，除非其内容需要更多高度。在这种情况下，元素会垂直扩展，直到其允许的最大值 20 em。\n\n```\n.mybox {\n  max-height:\
  \ 20em;\n  min-height: 5em;\n}\n```\n\n请记住，固定的 `width` 和 `height` 属性不应与 `min-` 和\
  \ `max-` 属性一起使用。所有主流浏览器都支持这四个 `min-` 和 `max-` 属性，包括 Chrome 1+、Firefox 1+、IE7+、Safari\
  \ 1+ 和 Opera 8+。它们常与媒体规则一起使用，以创建在不同屏幕尺寸下都能良好运行的流式布局。\n\n## box-sizing\n\n尺寸属性通常指的是内容区域，而不是内边距或边框区域。因此，要知道一个元素在盒模型中实际占据的宽度或高度，必须考虑其周围的内边距和边框。\n\
  \n```\n/* 100 像素宽的元素 */\n.mybox {\n  padding: 3px;\n  border: 2px solid red;\n \
  \ width: 90px;\n}\n```\n\nCSS 3 引入了 `box-sizing` 属性，允许网页开发者选择如何计算宽度和高度。默认值是 `content-box`，这意味着尺寸属性仅指内容区域。另一种\
  \ `border-box` 值则在测量中包含内边距和边框。\n\n`box-sizing : content-box | border-box`\n\n通过将盒模型尺寸计算方式更改为\
  \ `border-box`，你可以更轻松地创建网格布局，因为不再需要考虑内边距和边框的大小。\n\n```\n/* 100 像素宽的元素 */\n.mybox\
  \ {\n  box-sizing: border-box;\n  padding: 3px;\n  border: 2px solid red;\n  width:\
  \ 100px;\n}\n```\n\n`border-box` 属性不具有继承性，但可以使用通配选择器将其应用于网站上的所有元素。为了增加浏览器兼容性，应使用\
  \ `-webkit` 和 `-moz` 前缀。\n\n```\n/* 对所有元素使用 border-box */\n* {\n  /* Chrome 1-8,\
  \ Safari 3-5 */\n  -webkit-box-sizing: border-box;\n  /* Firefox 1-28*/\n  -moz-box-sizing:\
  \ border-box;\n  /* Chrome 9+, Firefox 29+, IE8+, Safari 5.1+, Opera 9.5+ */\n \
  \ box-sizing: border-box;\n}\n```\n\n`box-sizing` 属性的浏览器支持已经非常好，所有主流浏览器现在都支持它。因此，许多新网站已开始采用此属性来简化其布局的网格计算。\n\
  \n"
- "# 21. 定位\n\n定位属性可以改变元素的显示方式和位置。它们可以实现对网页布局的非常精确的控制。\n\n## position\n\n使用 `position`\
  \ 属性，元素可以以四种不同的方式进行定位。将 `position` 属性设置为除 `static` 之外的任何值的元素被称为已定位元素。\n\n`position\
  \ : static | relative | absolute | fixed`\n\n已定位元素可以通过 `top`、`left`、`right` 和 `bottom`\
  \ 属性进行移动，这些属性可用于在页面上的任意位置定位元素，也可以水平和垂直地调整它们的大小。它们允许正的或负的长度值和百分比值，其中百分比是相对于包含块的尺寸而言的。\n\
  \n`top | right | bottom | left (已定位元素) : auto | <length> | <percentage>`\n\n###\
  \ static\n\n默认情况下，`position` 属性的值为 `static`。此值意味着该元素出现在页面流中的常规位置，并且不受 `top`、`left`、`right`\
  \ 或 `bottom` 定位属性的影响。\n\n```\n/* 未定位的元素 */\n.static { position: static; }\n```\n\
  \n由于 `position` 属性不具有继承性，且 `static` 是默认值，因此无需显式地将 `position` 属性设置为 `static`。\n\n\
  ### relative\n\n将 `position` 值更改为 `relative` 意味着该元素可以相对于其在页面流中的正常位置进行定位。例如，要将选定的元素显示在其正常位置下方\
  \ 20 像素处，可以使用以下声明：\n\n```\n/* 将元素向下移动 20 像素 */\n.relative {\n  position: relative;\n\
  \  top: 20px;\n}\n```\n\n相对定位的元素被认为是正常页面流的一部分，因此其他元素不会移动来填补该元素留下的空白。\n\n通过使用元素的外边距也可以实现将元素相对于其正常位置移动的效果。除非有特定需要使该元素成为已定位元素（例如它将作为绝对定位子元素的容器），否则这种解决方案通常是更可取的。\n\
  \n```\n/* 将元素向下移动 20 像素 */\nmargin-bottom: -20px;\n```\n\n请记住，更改外边距会影响布局并填补空白，而相对定位则不会。\n\
  \n### absolute\n\n`position` 值 `absolute` 会将元素从任何包含元素中分离出来，并允许它相对于其最近的已定位祖先元素进行定位，如果没有已定位的祖先元素，则相对于文档主体。\n\
  \n```\n/* 将元素放置在左上角 */\n.absolute {\n  position: absolute;\n  top: 0;\n  left: 0;\n\
  }\n```\n\n### fixed\n\n固定定位的元素是相对于屏幕视口进行定位的。当页面滚动时，它不会移动。与绝对定位元素类似，固定定位的元素不会在正常页面流中预留任何空间。\n\
  \n```\n/* 将元素放置在右下角 */\n.fixed {\n  position: absolute;\n  bottom: 0;\n  right:\
  \ 0;\n}\n```\n\n\n\n## `overflow`\n\n`overflow` 属性决定了块级元素如何处理内容溢出。其默认值为 `visible`，意味着超出元素内容区域的文本和子元素将是可见的。将该值设置为\
  \ `hidden` 会隐藏溢出的内容，而使用 `scroll` 值则会使元素的块变得可滚动，以容纳溢出的内容。`auto` 值与 `scroll` 类似，但滚动条仅在必要时才出现。\n\
  \n`overflow (块级元素) : visible | hidden | scroll | auto`\n\n此属性控制水平和垂直方向上的溢出行为。另外两个属性\
  \ `overflow-x` 和 `overflow-y` 可用于区分水平或垂直溢出的处理方式。这两个属性的值与 `overflow` 属性的值相同。\n\n\
  ```\noverflow: hidden;   /* 隐藏所有溢出 */\noverflow-x: hidden; /* 隐藏水平溢出 */\noverflow-y:\
  \ hidden; /* 隐藏垂直溢出 */\n```\n\n## `clip`\n\n如果将元素定位为 `absolute` 或 `fixed`，则 `clip`\
  \ 属性可将其裁剪为一个矩形。它使用名为 `rect()` 的 CSS 函数来指定裁剪区域。\n\n`clip (absolute | fixed) :`  \n\
  \  `auto | rect(<上>, <右>, <下>, <左>)`\n\n`rect()` 需要四个长度值，每个值之间用逗号分隔。这些值是相对于元素的左上角而言的。图\
  \ 21-1 所示的示例从应用该属性的元素中裁剪并显示一个 200 x 400 像素的区域。\n\n```\n.myclip {\n  position: absolute;\n\
  \  clip: rect(100px, 500px, 300px, 100px);\n}\n```\n\n![A978-1-4302-6491-0_21_Fig1_HTML.jpg](img/A978-1-4302-6491-0_21_Fig1_HTML.jpg)\
  \  \n图 21-1. 阴影区域被移除\n\n关键字 `auto` 可用于右侧或底部的值，分别表示元素的完整宽度或高度。此关键字也是 `clip` 属性的默认值，这意味着元素不会被裁剪。\n\
  \n```\n/* 从左侧和顶部移除 100px */\nclip: rect(100px, auto, auto, 100px);\n/* 无裁剪 */\n\
  clip: auto;\n```\n\n为了支持 IE7 及更低版本，需要省略 `rect()` 函数中的逗号。所有主流浏览器都支持这种非标准语法。\n\n```\n\
  /* 向后兼容 IE4-7 的语法 */\nclip: rect(100px 500px 300px 100px);\n```\n\n## `z-index`\n\
  \n相互重叠的定位元素通常根据它们在 Web 文档中的顺序进行分层。这种自然的堆叠顺序可以通过 `z-index` 属性来改变。\n\n`z-index (已定位元素)\
  \ : auto | <整数>`\n\n`z-index` 属性接受正整数或负整数作为其值，表示堆叠顺序。值较高的元素位于值较低的元素前面，如下例所示：\n\n\
  ```\n<img src=\"ace-of-hearts.png\" style=\"\n  position: absolute;\n  left: 0;\n\
  \  top: 0;\n  z-index: 1;\">\n<img src=\"ace-of-spades.png\" style=\"\n  position:\
  \ absolute;\n  left: 100px;\n  top: 100px;\n  z-index: 0;\">\n```\n\n在这个如图 21-2\
  \ 所示的示例中，红心 A 因为其较高的堆叠顺序而被层叠在黑桃 A 之上。\n\n![A978-1-4302-6491-0_21_Fig2_HTML.jpg](img/A978-1-4302-6491-0_21_Fig2_HTML.jpg)\
  \  \n图 21-2. 自定义堆叠顺序\n\n## `vertical-align`\n\n可以使用 `vertical-align` 属性来控制文本和内联元素在一行内的垂直对齐方式。此属性也可用于表格单元格元素。\n\
  \n`vertical-align (内联 | 表格单元格) :`  \n  `baseline | <长度> | <百分比> | top | middle |`\
  \  \n  `bottom | text-top | text-bottom | super | sub`\n\n默认情况下，文本和内联元素（如图像）的底部在基线上对齐，基线是所有字母所在的一条隐形线。值\
  \ `top` 和 `bottom` 分别将图像与行的顶部和底部对齐。不太直观的是 `middle` 值，它将图像的中间与父元素中小写字母的中间对齐。这些常见对齐值的渲染效果如图\
  \ 21-3 所示。\n\n![A978-1-4302-6491-0_21_Fig3_HTML.jpg](img/A978-1-4302-6491-0_21_Fig3_HTML.jpg)\
  \  \n图 21-3. 常见的垂直对齐值\n\n`vertical-align` 还有两个较少使用的值：`text-bottom` 和 `text-top`。`text-bottom`\
  \ 值将元素的底部与文本的底部对齐。与之相反，`text-top` 值将元素的顶部与文本的顶部对齐。还有 `sub` 和 `super` 值，它们分别将元素对齐到下标和上标位置。使用这些值的结果如图\
  \ 21-4 所示。\n\n![A978-1-4302-6491-0_21_Fig4_HTML.jpg](img/A978-1-4302-6491-0_21_Fig4_HTML.jpg)\
  \  \n图 21-4. 其他垂直对齐值\n\n元素还可以通过长度值或百分比值来提升（正值）或降低（负值）。百分比和长度值都从基线开始计算；百分比值是相对于行高而言的。\n\
  \n```\n/* 将文本段对齐到常规文本下方 5 像素处 */\n常规 <span style=\"vertical-align: -5px;\">降低</span>\n\
  ```\n\n当应用于表格单元格元素 `<th>` 和 `<td>` 时，`vertical-align` 属性的行为类似于 HTML 中已弃用的 `valign`\
  \ 属性。表格单元格的有效值为 `baseline`、`bottom`、`middle` 和 `top`。其他值（包括长度和百分比）不应与表格单元格一起使用。\n\
  \n`top` 值将单元格的上内边距边缘与行的顶部对齐。同样，`bottom` 值将单元格的下内边距边缘与行的底部对齐。更值得注意的是，`baseline` 值对齐单元格的内容，使其与进行基线对齐的其他单元格共享相同的基线。\n\
  \n与默认值为 `baseline` 的内联元素相反，表格单元格元素通常居中对齐。对于表格单元格，`middle` 值的行为更直观，它将单元格的内边距框在行中居中对齐，从而使单元格的内容看起来居中。\n\
  \n在以下示例中，表格单元格元素垂直对齐到底部：\n\n```\n<table>\n  <tr>\n    <td style=\"vertical-align:\
  \ bottom;\">底部</td>\n  </tr>\n</table>\n```\n\n## 居中\n\n在 CSS 中有几种方法可以使元素居中。一种常见的方法是使用值为\
  \ `center` 的 `text-align` 属性。\n\n```\n.text-center { text-align: center; }\n```\n\
  \n通过将此属性应用于包含元素，其中的文本将居中对齐。\n\n```\n<p class=\"text-center\">居中文本</p>\n```\n\n这种方法适用于文本和内联元素，但不适用于块级元素。要使块级元素居中，可以将左右外边距设置为\
  \ `auto`，这会使水平外边距相等，从而使块居中。\n\n```\n.box-center { margin: 0 auto; }\n```\n\n请记住，要使块级元素看起来居中，其宽度必须是固定的，不能是弹性的；否则，它会占据所有可用宽度。\n\
  \n```\n<div style=\"width: 50px; height: 50px;\n            border: 1px solid black;\"\
  \n     class=\"box-center\"></div>\n```\n\n对于垂直居中，将内容对齐到中间的最简单方法是在父元素上使用 `vertical-align`\
  \ 属性，并将其值设置为 `middle`。这种行为仅在表格单元格元素中按预期工作，因此需要将容器更改为表格单元格，如以下使用 `display` 属性的示例所示：\n\
  \n```\n<div style=\"vertical-align: middle;\n            display: table-cell;\n\
  \            min-height: 100px;\">居中</div>\n```\n\n"
- '# 22. 分类


  分类属性指定了元素的显示方式以及是否可见。




  '
- "# 显示（display）\n\n`display`属性决定了包围元素的盒子类型。它可以使任何元素显示为内联、块级或其他任何类型。每个元素都有一个默认的`display`值，该值取决于元素的类型。\n\
  \n`display : none | inline | block | list-item | inline-block |`\n`inline-table\
  \ | table | table-cell | table-row |`\n`table-column | table-column-group | table-footer-group\
  \ |`\n`table-header-group | table-row-group | flex | inline-flex |`\n`grid | inline-grid\
  \ | run-in`\n\n大多数 HTML 元素显示为内联或块级；其他元素具有特殊的显示属性，例如`<li>`元素的`list-item`和`<td>`、`<th>`元素的`table-cell`。通过使用`display`属性，任何元素都可以被更改为渲染为这些或其他任何元素类型。例如，以下链接被渲染为块级元素而不是内联元素：\n\
  \n`<a href=\"#\" style=\"display: block;\">块级链接</a>`\n\n`display`最有用的值之一是`inline-block`，它结合了块级和内联元素的特性。`inline-block`元素类似于内联元素，但不同之处在于它也可以像块级元素一样操作盒子模型的宽度、高度和垂直边距属性。这些特性与可替换的内联元素（如`<img>`和`<button>`）相同。因此，这些元素在\
  \ HTML5 中被正式重新定义为`inline-block`元素。\n\n`inline-block`的一个常见应用是将列表项元素（`<li>`）制作成适合水平导航菜单的样式。请注意，将列表项元素的显示类型从`list-item`更改为`inline-block`会自动移除列表标记。\n\
  \n```\nli {\n    display: inline-block;\n    width: 100px;\n    background: #ccc;\n\
  }\n```\n\n应用此规则后，以下标记会渲染出三个并排的灰色背景框，如图 22-1 所示。\n\n```\n<ul>\n    <li>项目一</li>\n\
  \    <li>项目二</li>\n    <li>项目三</li>\n</ul>\n```\n\n![A978-1-4302-6491-0_22_Fig1_HTML.jpg](img/A978-1-4302-6491-0_22_Fig1_HTML.jpg)\n\
  \n图 22-1. `inline-block`值演示\n\n另一个有用的`display`值是`none`。它完全隐藏一个元素，使页面渲染得像该元素不存在一样。\n\
  \n```\n.removed { display: none; }\n```\n\n"
- '# 可见性（visibility）


  `visibility`属性可以通过将其值设置为`hidden`来隐藏元素，而无需移除其占用的空间。


  `visibility (block) : inherit | visible | hidden | collapse`


  `collapse`值旨在仅用于某些表格元素：行（`<tr>`）、列（`<col>`）、列组（`<colgroup>`）以及行组（`<thead>`、`<tbody>`和`<tfoot>`）。根据规范，`collapse`应移除隐藏的元素（如同`display:
  none`）并使该空间可供其他元素使用。遗憾的是，并非所有主流浏览器都遵循此值的规范。将`display`属性设置为`none`会带来更一致的浏览器行为，因此应优先使用。


  '
- "# 不透明度（opacity）\n\n`opacity`属性可以使元素及其内容透明。\n\n`opacity : <number>`\n\n使用 0.0 到\
  \ 1.0 之间的十进制值来设置透明度。值为 1 时，元素不透明；值为 0 时，元素完全透明（不可见）。\n\n```\n.half-transparent {\
  \ opacity: 0.5; }\n```\n\nChrome 1+、Firefox 1+、IE9+、Safari 1.2+ 和 Opera 9+ 支持此 CSS3\
  \ 属性。使用以下滤镜可以极大地增强 IE 支持：\n\n```\n.half-transparent {\n    filter: alpha(opacity=50);\
  \ /* IE5-8 */\n    opacity: 0.5;\n}\n```\n\n"
- "# 浮动（float）\n\n`float`属性将一个元素从其包含元素中分离出来，使其浮动在其上方，可以向左或向右浮动。它旨在使文本环绕图像，但也常用于制作布局。浮动一个内联元素会自动将其更改为块级元素。\n\
  \n`float : none | left | right`\n\n要使文本和其他内联内容环绕图像，您可以将其向左或向右浮动。\n\n`<img style=\"\
  float: left;\" src=\"myimage.png\" alt=\"\">`\n\n对于布局，浮动允许块级元素水平排列。例如，可以使用以下类创建盒子网格：\n\
  \n```\n.box {\n    float: left;\n    width: 100px;\n    height: 100px;\n    margin:\
  \ 0 1em;\n    background: #ccc;\n    border-radius: 10px;\n}\n```\n\n这个类使盒子水平堆叠，而不是垂直堆叠（块级元素的正常行为）（参见图\
  \ 22-2）。\n\n```\n<div class=\"box\"></div>\n<div class=\"box\"></div>\n<div class=\"\
  box\"></div>\n```\n\n![A978-1-4302-6491-0_22_Fig2_HTML.jpg](img/A978-1-4302-6491-0_22_Fig2_HTML.jpg)\n\
  \n图 22-2. 浮动的盒子\n\n使用浮动的一个副作用是，任何跟随这些浮动盒子的元素也会水平排列。`clear`属性旨在停止这种行为。\n\n"
- "# 清除（clear）\n\n`clear`属性用于清除元素左侧、右侧或两侧的浮动元素。\n\n`clear (block) : none | left |\
  \ right | both`\n\n此属性通常被赋予一个与属性同名的独立类。\n\n`.clear { clear: both; }`\n\n一个带有`clear`类的空`div`容器通常放置在浮动元素之后。这个清除元素会移动到浮动元素的下方，而不是出现在它们旁边。\n\
  \n`<div class=\"clear\"></div>`\n\n由于浮动布局往往复杂且脆弱，它们通常已被其他布局方法所取代，例如使用定位属性。\n\n在前面给出的盒子对齐示例中，一个更好的替代方案是将盒子改为`inline-block`元素。这可以完成相同的任务，同时无需清除浮动元素。\n\
  \n```\n.box {\n    display: inline-block;\n    width: 100px;\n    height: 100px;\n\
  \    margin: 0 1em;\n    background: #ccc;\n    border-radius: 10px;\n}\n```\n\n"
- '# 光标（cursor）


  `cursor`属性指定用户将鼠标悬停在元素上时看到的光标。默认值是`auto`，意味着浏览器决定使用什么光标。标准光标值及其外观可见于表 22-1。


  表 22-1. 标准光标值


  ![A978-1-4302-6491-0_22_Fig3_HTML.jpg](img/A978-1-4302-6491-0_22_Fig3_HTML.jpg)


  除了这些值之外，还可以使用`url`函数定义自定义光标。如果此光标不可用，可以在自定义光标之后指定一个通用光标，用逗号分隔。


  `cursor: url(new.cur), pointer;`


  '
- '# 23. 列表（List）


  CSS 列表属性处理列表元素，特别是`<ul>`、`<ol>`和`<li>`元素。




  ## `list-style-type`


  列表在每个列表项元素（`<li>`）前显示一个标记。该标记的外观可通过 `list-style-type` 属性修改。对于无序列表（`<ul>`），每个列表项的标记方式相同。此处列出预定义的圆点值可供使用，默认值为
  `disc`（实心圆）：


  `list-style-type : inherit | disc | circle | square | none`


  在有序列表（`<ol>`）中，每个列表项前会显示一个数字字符以表明其在序列中的位置。所有主流浏览器均支持以下数字类型，初始值为 `decimal`：


  `list-style-type : inherit | decimal | none | upper-alpha | lower-alpha | upper-roman
  | lower-roman | lower-greek | lower-latin | armenian | georgian | decimal-leading-zero`


  以下示例为两个列表元素指定了新的列表样式。虽然可以让 `<ul>` 显示有序标记，让 `<ol>` 显示无序标记，但这不是好的做法。


  ```

  ul { list-style-type: square; } /* ▅ */

  ol { list-style-type: upper-roman; } /* I, II, III, ... */

  ```


  标记的颜色与列表元素的文本颜色相同。请记住，任何元素都可以通过将其 display 类型改为 `list-item` 来显示列表标记。


  ## `list-style-image`


  作为预定义标记的替代方案，可使用 `list-style-image` 属性来将自定义图像作为列表圆点。


  `list-style-image : inherit | none | url(<url>)`


  图像路径需写在 CSS 的 `url` 函数中。


  `list-style-image: url(my-bullet.png)`


  该属性会覆盖 `list-style-type` 属性选定的任何标记类型。尽管如此，最好还是指定一个 `list-style-type` 作为后备方案，以防自定义圆点图像因任何原因不可用。


  ## `list-style-position`


  列表标记通常位于元素框外部。`list-style-position` 提供了一个替代方案：将圆点放置在元素框内部。


  `list-style-position : inherit | outside | inside`


  选择 `outside` 会使每行文本与第一行文本的开头对齐，而 `inside` 则会使后续的文本行在标记下方换行。`inside` 值还会在视觉上缩进标记，如图
  23-1 所示。


  ![A978-1-4302-6491-0_23_Fig1_HTML.jpg](img/A978-1-4302-6491-0_23_Fig1_HTML.jpg)


  图 23-1. 外部和内部标记放置


  '
- "# `list-style`\n\n`list-style` 是用于设置所有列表属性的简写属性。值可以按任意顺序设置，因为它们之间没有歧义。任何一个值也可以省略，此时将使用该属性的默认值。\n\
  \n`list-style : <list-style-type> + <list-style-image> + <list-style-position>`\n\
  \n在以下示例中，设置了 `list-style` 的 `type` 和 `position` 值，这些值会继承给列表项。\n\n```\n<ul style=\"\
  list-style: inside square;\">\n  <li>苹果</li>\n  <li>橙子</li>\n  <li>梨</li>\n</ul>\n\
  ```\n\n请记住，列表属性不仅可以样式化列表容器 `<ul>` 和 `<ol>`，还可以样式化单个列表项 `<li>`。\n\n"
- "# 计数器\n\n在 CSS 中，可以使用 `counter-increment` 和 `counter-reset` 属性自动为元素编号。`counter-reset`\
  \ 属性指定计数器的名称，后面可跟计数器的初始值，默认值为零。\n\n```\n/* 创建一个名为 chapter 的计数器 */\nbody { counter-reset:\
  \ chapter; }\n```\n\n`counter-increment` 属性接受计数器的名称，后面可跟一个可选数字。该数字设定元素每次出现时计数器的增量，默认值为\
  \ 1。\n\n```\n/* 在每个 <h1> 处递增计数器 */\nh1:before { counter-increment: chapter; }\n\
  ```\n\n创建计数器的最后一步是使用 CSS 的 `counter()` 函数来显示它，该函数参数为计数器的名称。在此示例中，章节编号会显示在 `<h1>`\
  \ 元素之前：\n\n```\n/* 递增并显示计数器 */\nh1:before {\n  content: \"第 \" counter(chapter)\
  \ \" 章 - \";\n  counter-increment: chapter;\n}\n```\n\n现在，计数器会在 `<h1>` 元素前添加章节编号。\n\
  \n```\n<h1>第一章</h1>  <!-- 第 1 章 - 第一章 -->\n<h1>第二章</h1> <!-- 第 2 章 - 第二章 -->\n<h1>第三章</h1>\
  \  <!-- 第 3 章 - 第三章 -->\n```\n\n可以添加另一个计数器来为 `<h2>` 子标题编号。此计数器会在每个 `<h1>` 元素处重置为零：\n\
  \n```\nh2:before {\n  content: counter(chapter) \".\" counter(section) \" \";\n\
  \  counter-increment: section;\n}\nh1 { counter-reset: section; }\n```\n\n以下示例展示了计数器的显示方式：\n\
  \n```\n<h1>标题</h1> <!-- 第 1 章 - 标题 -->\n<h2>子标题</h2>  <!-- 1.1 子标题 -->\n<h2>子标题</h2>\
  \  <!-- 1.2 子标题 -->\n<h1>标题</h1> <!-- 第 2 章 - 标题 -->\n<h2>子标题</h2>  <!-- 2.1 子标题\
  \ -->\n```\n\n### 嵌套计数器\n\nCSS 计数器可以任意层级地嵌套。这些嵌套的计数器可以使用名为 `counters()` 的 CSS 函数进行组合和显示。该函数的第一个参数是计数器名称，第二个参数是分隔每个计数器的字符串。\n\
  \n```\nul { counter-reset: item; }\nli:before {\n  content: counters(item, \".\"\
  ) \" \";\n  counter-increment: item;\n}\n```\n\n这些规则适用于以下无序列表（注意，每个嵌套列表都会自动创建一个新的计数器实例）：\n\
  \n```\n<ul>\n  <li>项目</li>   <!-- 1 项目 -->\n  <li>项目</li>   <!-- 2 项目 -->\n  <ul>\n\
  \    <li>项目</li> <!-- 2.1 项目 -->\n    <li>项目</li> <!-- 2.2 项目 -->\n  </ul>\n</ul>\n\
  ```\n\n所有主流浏览器均支持计数器，包括所有版本的 Chrome、Firefox、Safari、Opera 以及 IE8+。\n\n"
- "# 24. 表格\n\nCSS 拥有许多专门用于表格元素的属性。这些属性可以控制浏览器如何渲染表格数据。\n\n## `border-spacing`\n\n\
  相邻表格单元格边框之间的距离可以通过 `border-spacing` 属性进行更改，该属性相当于 HTML 中的 `cellspacing` 属性。W3C 定义此属性的初始值为\
  \ 0，但大多数浏览器默认将其渲染为 2px。\n\n`border-spacing : inherit | <length> [<length>]`\n\n\
  此属性可以指定一个或两个长度值。当指定两个值时，第一个值设置水平间距，第二个值设置垂直间距。\n\n```\n.spacing {\n  border-spacing:\
  \ 5px 10px;\n}\n```\n\n`border-spacing` 是表格的属性，而非单元格的属性，因此它应用于 `<table>` 元素，如下例所示：\n\
  \n```\n<table class=\"spacing\">\n  <caption>我的表格</caption>\n  <tr>\n    <td>第 1\
  \ 行第 1 列</td>\n    <td>第 1 行第 2 列</td>\n  </tr>\n  <tr>\n    <td>第 2 行第 1 列</td>\n\
  \    <td>第 2 行第 2 列</td>\n  </tr>\n</table>\n```\n\n该表格如图 24-1 所示，其中 `<td>` 元素应用了实线边框。\n\
  \n![A978-1-4302-6491-0_24_Fig1_HTML.jpg](img/A978-1-4302-6491-0_24_Fig1_HTML.jpg)\n\
  \n图 24-1. 示例表格\n\n表格单元格有边框和内边距，但没有外边距；取而代之的是 `border-spacing`。内边距与其他元素的工作方式相同，行为类似于\
  \ HTML 中的 `cellpadding` 属性。\n\n## `border-collapse`\n\n`border-collapse` 属性决定表格边框是合并为单一边框还是分离的。\n\
  \n`border-collapse : inherit | separate | collapse`\n\n通常，表格单元格有自己的独立边框，并通过 `border-spacing`\
  \ 属性设置的距离分隔。如果将边框设置为合并（collapse），则单元格共享边框，并且会忽略 `border-spacing` 属性的任何值。\n\n```\n\
  table { border-collapse: collapse; }\n```\n\n\n\n## `caption-side`\n\n`<caption>`元素为表格提供标题。其位置可通过`caption-side`属性更改。\n\
  \n`caption-side : inherit | top | bottom`\n\n标题通常显示在顶部，但也可以通过`caption-side`属性将其置于表格下方。此属性适用于`<caption>`元素，但由于继承性，也可以为`<table>`元素设置。\n\
  \n```\ncaption { caption-side: bottom; }\n```\n\n## `empty-cells`\n\n无内容的表格单元格通常仍会显示其边框和背景。此行为可通过`empty-cells`属性更改。\n\
  \n`empty-cells : inherit | show | hide`\n\n将此属性值设为`hide`将隐藏单元格的边框和背景。表格的布局不受影响。\n\
  \n## `table-layout`\n\n`table-layout`属性决定表格单元格的宽度应为固定还是灵活。与其他表格属性不同，`table-layout`不具继承性。\n\
  \n`table-layout : auto | fixed`\n\n此属性初始值为`auto`，意味着表格单元格的宽度会自动扩展以适应其内容，即使这会导致超出其设置宽度。若要强制执行表格的指定宽度，可将`table-layout`设为`fixed`。此时水平布局仅取决于表格的设定宽度，而非单元格内容。\n\
  \n```\n/* 强制表格宽度 */\n.fixed { table-layout: fixed; }\n```\n\n固定表格布局还有一个额外好处：浏览器能更快地渲染表格，因为一旦接收到第一行，浏览器就能获知表格的尺寸。\n\
  \n"
- "# 25. 媒体\n\nCSS 提供了一种根据观看文档的设备来呈现不同文档内容的方法。此类条件样式规则被放置在一个媒体规则内，该规则由`@media`、一个限定作用域的表达式以及一组包含条件样式规则的花括号组成。\n\
  \n```\n@media screen {\n  /* 仅限屏幕设备 */\n}\n```\n\n## 媒体类型\n\nCSS 2 中引入的媒体类型条件，列出了以下有效值，包括用于定位所有设备类型的默认值`all`：\n\
  \n`all | aural | braille | handheld | print | projection | screen | tty | tv | embossed`\n\
  \n不幸的是，媒体类型并不能提供太多关于设备的信息，因此很少按其预期目的使用。现代智能手机、平板电脑、笔记本电脑和台式电脑都自识别为`screen`类型。如今媒体类型条件的主要用途是区分屏幕显示文档和打印文档，以实现更友好的打印文档格式。\n\
  \n```\n/* 仅限打印 */\n@media print\n{\n  /* 隐藏导航 */\n  #navigation { display: none;\
  \ }\n  /* 在 h1 元素前分页 */\n  h1 { page-break-before: always; }\n}\n```\n\n媒体规则通常放置在样式表的底部，这允许级联覆盖先前定义的规则。如果样式表包含大量条件规则，则最好将它们移至单独的样式表中，该样式表在主要样式表之后引入。媒体条件随后可通过`<link>`元素上的`media`属性指定。\n\
  \n`<link rel=\"stylesheet\" media=\"print\" href=\"myprint.css\">`\n\n此样式表包含了打印条件，因此仅在文档发送到打印媒体时应用。请记住，即使媒体条件为假，浏览器仍会下载样式表。\n\
  \n## 媒体查询\n\nCSS 3 更进一步，允许媒体规则定位设备的能力而不仅仅是设备类型。它引入了大量可被定位的媒体特性，如下表所示。除`orientation`、`grid`和`scan`外，所有这些特性都可以加上`min-`或`max-`前缀来定义约束条件。\n\
  \n`width | height | device-width | device-height | aspect-ratio | device-aspect-ratio\
  \ | resolution | orientation | color | color-index | monochrome`\n\n最重要的媒体特性`min-width`和`max-width`允许您创建响应式设计，使网站布局根据设备浏览器的视口而变化。\n\
  \n媒体查询结合了媒体类型以及由一个或多个媒体特性构成的条件。例如，以下媒体查询内的规则仅当在最小宽度为 600 像素的屏幕媒体上时才被应用：\n\n`@media\
  \ screen and (min-width: 600px) {}`\n\n媒体查询不区分大小写，并且要求条件周围有括号。此处看到的`and`运算符用于组合媒体类型和媒体特性，但它也可以组合多个媒体特性：\n\
  \n`@media (max-width: 500px) and (min-aspect-ratio: 1/1) {}`\n\n如果查看设备的宽度最大为 500\
  \ 像素且至少具有 1:1 的宽高比（方形或横向视口），则此媒体查询为真。请注意，这里省略了媒体类型，因此该规则适用于所有媒体类型。\n\n## 逻辑运算符\n\
  \n除了逻辑的`and`运算符，媒体查询还可以包括逻辑的`not`和`only`运算符以及逻辑的`or`操作。逗号（`,`）用作`or`运算符来分隔多个查询组。如果屏幕宽度至少为\
  \ 700 像素，或设备处于横屏模式，则以下媒体规则为真：\n\n`@media (min-width: 700px), (orientation: landscape)\
  \ {}`\n\n`not`运算符用于否定整个媒体查询。它不能否定单个特性。例如，以下媒体规则仅当设备屏幕宽度不为 800 像素时应用：\n\n`@media\
  \ not screen and (device-width: 800px) {}`\n\n`only`运算符被添加用于向旧版浏览器隐藏媒体查询。根据规范，不支持媒体查询的浏览器会将以下规则解释为应用于`only`媒体类型，这是无效的，从而导致条件样式规则被忽略。\n\
  \n```\n/* 在旧版浏览器中不应用 */\n@media only screen and (min-width: 600px) {}\n```\n\n遗憾的是，IE6–IE8\
  \ 未能正确实现该规范。因此，即使省略了`only`关键字，媒体查询也会被忽略，而非像预期那样将媒体规则应用于所有屏幕设备。\n\n```\n/* 在 IE 6-8\
  \ 中不应用 */\n@media screen and (min-width : 600px) {}\n```\n\n请注意，`not`和`only`运算符都需要使用明确的媒体类型，而逻辑`or`（`,`）和逻辑`and`运算符则不需要。\n\
  \n媒体查询的支持已在所有主流浏览器中广泛普及。例如，`min-width`和`max-width`查询在 Chrome 1+、Firefox 3.5+、IE9+、Safari\
  \ 4+和 Opera 8+中都得到支持。\n\n## 测试媒体查询\n\n测试您的媒体查询非常重要，以确保您的网站在尽可能多的设备上显示良好。最新的网络浏览器都会在浏览器环境发生变化时（例如调整窗口大小时）重新评估媒体查询。您只需调整浏览器窗口大小，即可测试您的设计如何响应不同的设备尺寸。在测试过程中，一个有用的网站是\
  \ ProtoFluid，¹它允许您查看网站在许多平板电脑和智能手机设备上的外观。\n\n\n\n## 响应式设计指南\n\n设计响应式布局时，最简单的方法通常是从移动端布局开始，先定义其在没有任何媒体查询规则下的外观。当你扩大视口时，注意观察布局在何时开始失去良好效果。这就是你需要修改布局中那些视觉上崩坏或失去作用的部分的断点。这种改动可能包括增加第二列，或改为更高级的导航菜单。你可以使用\
  \ `min-width` 和 `max-width` 媒体特性来定义这些断点，随着视口变大覆盖样式，如下例所示。继续使用这种寻找断点的方法，直到达到足够高的分辨率。根据你的布局，你可能只需要定义少数几个断点。\n\
  \n```\n@media (min-width: 800px) {\n  body { background: red; }\n}\n@media (min-width:\
  \ 401px) and (max-width: 799px) {\n  body { background: green; }\n}\n@media (max-width:\
  \ 400px) {\n  body { background: blue; }\n}\n```\n\n脚注 1\n\n[`http://protofluid.com`](http://protofluid.com/)\n\
  \n"
- "# 最佳实践\n\n现在你已经理解了 CSS 的基础知识。本章作为最后一章，将退一步来审视样式表开发的良好编码实践与标准。遵循这些指南可以帮助你编写易于维护、复用和扩展的健壮\
  \ CSS 代码。\n\n## 可复用的代码\n\n管理样式表的一个关键思想是避免重复代码。类（Classes）有助于实现这一目标，因为它们是可复用的，并且可以通过不同方式组合，从而为你提供易于演进的灵活设计。\n\
  \n每当你发现页面元素共享样式属性时，就应该考虑组合这些重复的模式。这使得代码更易于复用和更新，同时也有助于保持网站样式的一致性。思考以下简单示例：\n\n```\n\
  .module {\n  width: 200px;\n  border: 1px solid #ccc;\n  border-radius: 3px;\n}\n\
  .widget {\n  width: 300px;\n  border: 1px solid #ccc;\n  border-radius: 3px;\n}\n\
  ```\n\n这两个类有两个共同的样式，可以被移入第三个类以避免不必要的重复。这个过程使得类更具通用性，因此也更易于复用。\n\n```\n.box-border\
  \ {\n  border: 1px solid #ccc;\n  border-radius: 3px;\n}\n.module { width: 200px;\
  \ }\n.widget { width: 300px; }\n```\n\n在优化类以实现复用时，考虑其粒度非常重要。目标是找到介于过宽和过窄之间的类。过宽的类会导致不必要的重复；过窄的类则会使设计难以更改。\n\
  \n## 全局修饰符\n\n有些样式属性非常常用。与其将这些样式添加到每个其他类中，有时更好的做法是创建一个包含该单一样式的通用类，然后将其应用于需要它的元素。例如，将元素向左或向右浮动就是这样一个常见操作。这些样式非常适合用作全局修饰符。\n\
  \n```\n.left  { float: left; }\n.right { float: right; }\n```\n\n当你希望一个元素向右或向左浮动时，可以简单地将这些类之一添加到该元素上：\n\
  \n`<div class=\"left\">...</div>`\n\n当只需要单个样式属性时，诸如此类的全局修饰符非常有用。但是，你应该避免组合多个这样的修饰符，因为如果所有页面元素都由如此小的类构成，调整设计将会变得困难。\n\
  \n## 样式表结构\n\n通过组织样式表，你可以让自己和其他开发者更容易快速理解 CSS 的结构。网站规模越大，参与的开发者越多，保持良好组织的需求就越大。但无论网站规模大小，始终保持样式表结构良好总是一个好习惯。\n\
  \n样式表的顶部通常包含有关文件及其作者的信息。这些元数据应包括作者的姓名和联系方式。这样，如果对文档有任何疑问，当前负责该网站的开发者就知道该问谁。其他可能有用的元数据包括文件的创建日期、最后修改日期、版本号、标题和描述。\n\
  \n```\n/*\n * 标题：我的主题\n * 版本：1.2.3\n * 作者：我的名字\n */\n```\n\n至于样式规则，它们应该被分组到不同的章节中，每个章节都应带有辨识度高的注释标签。这种分组和标签能使你更快地找到所需内容。所需的章节取决于网站本身，以下是一些示例章节：\n\
  \n```\n/* === 标准化 === */\n/* === 主要布局 === */\n/* === 二级布局 === */\n/* === 三级布局 ===\
  \ */\n/* === 导航 === */\n/* === 文本相关 === */\n/* === 链接和图片 === */\n/* === 通用样式 ===\
  \ */\n/* === 通用类 === */\n/* === 杂项 === */\n```\n\n章节名称后的等号有助于在视觉上将各章节与其他注释区分开来。它们也充当了一个标记，你可以通过搜索来轻松遍历各个章节。\n\
  \n对于大型样式表，可以在元数据下方列出章节名称作为目录，这有助于开发者快速了解文件的组织方式。\n\n```\n/* 目录\n* ----------------\n\
  * 标准化\n* 主要布局 (body, 主要 divs)\n* 二级布局 (header, footer, sidebar)\n* 三级布局 (页面区域)\n\
  * 导航 (菜单)\n* 文本相关 (段落, 标题, 列表)\n* 链接和图片\n* 通用样式 (表单, 表格等)\n* 通用类 (.clear, .center\
  \ 等)\n* 杂项\n*/\n```\n\n在每个章节内，你应该先声明最通用的规则，然后依次是特异性递增的规则。你的元素可以继承样式，并且在需要时更容易覆盖特定样式。\n\
  \n另一个需要考虑的是如何组织规则内的属性。一种流行的方法是根据类型对属性进行分组。你不必像下例那样为每个组添加标签，但如果能在整个样式表中保持分组顺序的一致性，将有助于你更快地扫描规则以查找特定属性。\n\
  \n```\n.myclass {\n  /* 定位 */\n  position: absolute;\n  top: 0;\n  right: 0;\n \
  \ /* 盒模型 */\n  display: inline-block;\n  width: 100px;\n  height: 100px;\n  /* 颜色\
  \ */\n  background: #ccc;\n  color: #fff;\n  /* 文本 */\n  font-size: 1em;\n  line-height:\
  \ 1.2;\n  text-align: right;\n  /* 其他 */\n  cursor: pointer;\n}\n```\n\n请记住，这些只是指南；选择一种适合你的结构，并力求保持一致。\n\
  \n\n\n## 命名约定\n\n为类和 ID 命名时，阐明其预期用途会很有帮助。这种结构化命名约定意味着，名称应描述该类或 ID 的用途，而不是它的外观或其在网页文档中的位置。\n\
  \n这种命名约定的好处在于，它能让更改网站外观变得更加容易。例如，将一个 ID 容器命名为 `#main-content` 比命名为 `#center-column-500px`\
  \ 更好。除了能直观理解该 ID 的用途外，第一个名称在你日后可能需要调整其应用元素的位置或大小时，更具通用性。\n\n```\n#main-content {\n\
  \  width: 500px;\n  margin: 0 auto; /* 居中 */\n}\n```\n\n名称应具有语义性，但也不能语义性过强以至于限制了它的复用。例如，将一个类命名为\
  \ `.header-top-margin` 就没有命名为 `.small-top-margin`（或 `.small-tm`）来得灵活。日后回想起这个类主要用于页眉区域是很容易的；例如，你可以在网页浏览器中查看页面源代码时，使用搜索功能来搜索该类名。\n\
  \n```\n.small-top-margin { margin-top: 1em; }\n```\n\n除了传达预期用途外，类名还可以展示其与其他类之间的关系。例如，如果一个容器类名为\
  \ `.post`，那么该容器的标题可以命名为 `.post-title`，以表明该类应仅在应用了 `.post` 类的元素内部使用。\n\n```\n.post\
  \ {\n  margin: 1em 0;\n}\n\n.post-title {\n  font-size: 1.2em;\n}\n```\n\n标题类本来也可以写成\
  \ `.post.title`，以确保 `.title` 类只能在使用了 `.post` 类的容器内部使用。然而，`.post-title` 这种命名方式有助于避免命名冲突，并且不会增加特异性，因此这种命名约定通常是更可取的。注意，规则之间的关系通过缩进得到了进一步的强调，这能显著提高代码的可读性。\n\
  \n## 规范化\n\n不同的浏览器对某些元素的渲染会略有不同，这主要是由于其默认样式表的差异。为了获得一个共同的基准线，通常会包含一组规则来规范化这些浏览器之间的不一致性，并设置合理的默认值。这方面最流行的选择是\
  \ GitHub 上的 `Normalize.css` 项目。¹ 通过在样式表顶部包含这些规则（或根据网站需求包含其子集），你就能在所有浏览器中拥有一个一致的起点，并在此基础上进行构建。`Normalize.css`\
  \ 样式表包含了大量的注释，解释了它所解决的每一个浏览器不一致性问题。\n\n## 调试\n\n有许多有用的调试工具可以极大地简化网页开发者的工作。Firefox\
  \ 的 Firebug 扩展是这些工具中最强大的之一。它允许你在任何网页上实时编辑和调试 CSS、HTML 和 JavaScript，以供测试之用。你还可以自由开启或关闭样式，并找出精确应用于所选元素的样式。要了解更多关于\
  \ Firebug 的信息，请访问 Firebug 官方网站。²\n\n与 Firebug 类似的功能在 Chrome 上可通过内置于浏览器中的 Chrome\
  \ 开发者工具实现。你可以使用快捷键 `Ctrl+Shift+I`（Windows）或 `Cmd+Opt+I`（Mac）调出 DevTools 窗口。或者，你也可以右键点击页面上的某个元素，然后选择“检查元素”，从而在元素检查模式下调出相同的窗口。\n\
  \n## 验证\n\n检查你的 CSS 是否符合 W3C 标准是一个好习惯。不规范的代码可能会导致你的网站在不同浏览器中出现意料之外的显示效果。此外，拥有无错代码也是一个高质量网站的象征。\n\
  \nW3C 提供了它自己的在线 CSS 验证工具。³ 它会检查提交的页面，并返回页面上发现的任何错误和警告，供你修正。它还有一个类似的用于验证 HTML 文档的工具，⁴\
  \ 这样做同样重要。为了让验证更加便捷，你可以下载一个为你检查页面代码的浏览器插件，例如 Chrome、Firefox 和 Opera 上可用的 Web Developer\
  \ 插件。⁵\n\n## 单一样式表\n\n出于性能考虑，最好将网站的样式规则包含在一个单一的外部样式表中。这样做可以最大限度地减少加载网站所需的 HTTP 请求数量，同时允许\
  \ CSS 文件被缓存，以便访问者的浏览器只需下载一次。\n\n在大型网站的开发过程中，通常更倾向于将样式规则分散到几个更易于管理的 CSS 文件中。为了两全其美，这些开发文件可以在网站的构建过程中合并成一个单一的文件。Bundle\
  \ 工具就是为此目的而设计的一个有用工具。⁶ 当你的网站设计稳定后，该工具还可用于压缩你的 CSS。\n\n## 代码压缩\n\n代码压缩是指从代码中移除不必要的字符以减小其大小的过程。当压缩一个\
  \ CSS 文件时，空白字符会被移除，并且规则会被优化和重组以加快加载速度。这种压缩可以极大地减小文件大小，从而以牺牲代码可读性为代价来提高网站性能。由于可读性降低，最好使用未压缩的样式表进行工作，并在每次更新\
  \ CSS 文件时重复进行压缩步骤。压缩可以自动完成（例如，使用前面提到的 Bundle 工具），也可以使用像 Clean CSS 这样的在线工具手动完成。⁷\n\
  \n压缩工具无法完成的一项优化是查找并移除未使用的 CSS 规则。一个有助于你执行此任务的有用 Firefox 插件是 Dust-Me Selectors。⁸\
  \ 这个插件可以逐个测试页面，也可以扫描整个网站以查找未使用的选择器。\n\n## 跨浏览器测试\n\n即使你的代码经过了规范化和验证，不同浏览器（尤其是旧版本）在渲染网页时仍可能存在一些差异。因此，有必要在你希望网站支持的所有浏览器版本中进行测试。\n\
  \n为了简化这一测试过程，你可以使用 BrowserStack，⁹ 这是一个用于检查浏览器兼容性的在线工具。它可以向你展示你的网站在你选择的不同版本浏览器上的显示效果。你还可以查看你的网站在移动设备和平板电脑上的显示效果。\n\
  \n## 脚注\n\n1. [`http://necolas.github.io/normalize.css/`](http://necolas.github.io/normalize.css/)\n\
  2. [`https://getfirebug.com`](https://getfirebug.com/)\n3. [`http://jigsaw.w3.org/css-validator/`](http://jigsaw.w3.org/css-validator/)\n\
  4. [`http://validator.w3.org`](http://validator.w3.org/)\n5. [`http://chrispederick.com/work/web-developer/`](http://chrispederick.com/work/web-developer/)\n\
  6. [`https://github.com/ServiceStack/Bundler`](https://github.com/ServiceStack/Bundler)\n\
  7. [`www.cleancss.com`](http://www.cleancss.com/)\n8. [`www.sitepoint.com/dustmeselectors/`](http://www.sitepoint.com/dustmeselectors/)\n\
  9. [`www.browserstack.com/screenshots`](http://www.browserstack.com/screenshots)\n\
  \n\n\n"
