    Mikael Olsson is a professional programmer, web entrepreneur, and author. He works
    for an R&D company in Finland, at which he specializes in software development.
    In his spare time, he writes books and creates web sites that summarize various
    fields of interest. The books Mikael writes are focused on teaching their subjects
    in the most efficient way possible, by explaining only what is relevant and practical
    without any unnecessary repetition or theory. The portal to his online businesses
    and other web sites is [`www.siforia.com`](http://www.siforia.com/) .


    About the Technical Reviewer


    ![A978-1-4302-6491-0_BookFrontmatter_Fig2_HTML.jpg](A978-1-4302-6491-0_BookFrontmatter_Fig2_HTML.jpg)
    Victor Sumner is a Senior Software Engineer at Desire2Learn Inc., helping to build
    and maintain an integrated learning platform. As a self-taught developer, he is
    always interested in emerging technologies and enjoys working on and solving problems
    that are outside his comfort zone.


    When not at the office, Victor has a number of hobbies, including photography,
    horseback riding, and gaming. He lives in Ontario, Canada, with his wife, Alicia,
    and their two children.


    Introduction


    CSS, which stands for Cascading Style Sheets, is a stylistic language that defines
    how web pages are presented. It complements HTML, which is the language used for
    describing the structure of web site content. Because HTML predates CSS, it includes
    a number of limited stylistic elements and attributes, but they have largely been
    deprecated in favor of the much greater design control offered by CSS.


    One of the main features of CSS is that it enables the complete separation of
    a web site''s presentation from its content. This separation reduces the complexity
    and repetition associated with including stylistic information in the structural
    content. Furthermore, this separation makes it easy to enforce site-wide consistency
    in the presentation of a web site because the entire look and feel of a site can
    be controlled from a single style sheet document.


    As one of the core languages of the Web, CSS is used today by almost all web sites
    to enhance the web experience. It has been a revolution in the World Wide Web
    and is a must-learn language for anyone working with web design. Like HTML, the
    CSS language is easy to learn and use, as is shown in this book.'
