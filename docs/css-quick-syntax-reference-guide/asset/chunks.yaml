    \ [<color>]]`\n\nThe values for the box shadow are the same as for `text-shadow`—with\
    \ two exceptions. A fourth length value, `spread-radius`, can be specified to\
    \ grow or shrink the shadow. This value is optional and is 0 if left unspecified,\
    \ rendering the shadow in the same size as the element. As an example, the following\
    \ class rule displays a blurry gray shadow to the bottom right of any block element\
    \ using this class:\n\n`.drop-shadow { box-shadow: 3px 3px 3px 6px #ccc; }`\n\n\
