- fmt: "# 1. Using CSS\n\nThere are three ways to insert CSS into an HTML document:\
    \ by using an internal style sheet, inline styles, or an external style sheet.\
    \ An internal style sheet applies to a single page, an inline style to a single\
    \ element, and an external style sheet to potentially an entire web site.\n\n\
    ## Internal style sheet\n\nAn internal style sheet is useful when a single document\
    \ needs to have its own unique styling. The style sheet is then embedded within\
    \ the `<head>` section of the web document using the `<style>` element. This element\
    \ is a container for style sheet rules and should have its `type` attribute set\
    \ to `\"text/css\"`.\n\n```\n<style type=\"text/css\">\n  p { color: red; }\n\
    </style>\n```\n\n## Inline style\n\nStyling can be assigned to an individual element\
    \ by using the `style` attribute to set an inline style. It is a generic attribute\
    \ that can be included in any HTML start tag, and its value is the CSS declarations\
    \ that will be applied to the element, separated by semicolons. There is no need\
    \ to specify a selector because the declarations implicitly belong to the current\
    \ element.\n\n```\n<p style=\"color: green\">Green text</p>\n```\n\nThis approach\
    \ should be used sparingly because it mixes style with content and therefore makes\
    \ future changes more cumbersome. It can be useful as a quick way to test styles\
    \ before they are moved out to an external style sheet.\n\n## External style sheet\n\
    \nThe most common way to include CSS is through an external style sheet. The style\
    \ sheet rules are placed in a separate text file with a `.css` file extension.\
    \ This style sheet is then referenced using the `<link>` element in the web page\
    \ header. The `rel` (relationship) attribute must be set to `\"stylesheet\"` and\
    \ the meta `type` attribute can optionally be set to `\"text/css\"`. The location\
    \ of the style sheet is specified with the `href` attribute.\n\n```\n<link rel=\"\
    stylesheet\" type=\"text/css\" href=\"MyStyle.css\">\n```\n\nAnother less common\
    \ way to include an external style sheet is to use the CSS `@import` function\
    \ from inside of the `<style>` element. For this function to work, it must be\
    \ placed before any other rules.\n\n```\n<style type=\"text/css\">\n  @import\
    \ url(\"MyStyle.css\");\n</style>\n```\n\nUsing an external style sheet is often\
    \ preferred because it completely separates CSS from the HTML document. It is\
    \ then possible to quickly create a consistent look for an entire web site and\
    \ to change its appearance just by editing a single CSS document. It also has\
    \ performance benefits because external style sheets are cached and therefore\
    \ need to be downloaded only once—for the first page a visitor views at your site.\n\
    \n## Testing environment\n\nTo experiment with CSS, you can use a simple text\
    \ editor such as Notepad in Windows (found under Start ➤ Programs ➤ Accessories\
    \ ➤ Notepad) or TextEdit on a Mac (found under Finder ➤ Applications ➤ TextEdit).\
    \ Type the following single style rule into a new document in the editor. The\
    \ rule will color the background of a web document red.\n\n```\nbody { background:\
    \ red; }\n```\n\nSave the file as `MyStyle.css` and then open another empty document.\
    \ This new document will become the HTML file that uses the external style sheet\
    \ you just created. Write the following HTML markup into the document, which includes\
    \ a reference to the style sheet along with the minimal markup for an HTML 5 web\
    \ document:\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\"\
    >\n    <title>Example</title>\n    <link rel=\"stylesheet\" href=\"MyStyle.css\"\
    >\n  </head>\n  <body>\n    <p>This page is red</p>\n  </body>\n</html>\n```\n\
    \nGo ahead and save this text file as `MyPage.html` in the same folder as the\
    \ CSS file. You have now created a simple environment in which you can test CSS.\
    \ To view the page, open `MyPage.html` with your web browser. You will see that\
    \ the background is indeed colored red because of the rule in the style sheet.\n\
    \n## View source\n\nWhile you have the browser opened, you can view the HTML markup\
    \ that makes up the page by pressing `Ctrl+U` on a PC or `Cmd+U` on a Mac. This\
    \ shortcut works in all major browsers, including Chrome, Firefox, and Internet\
    \ Explorer (IE). You can also find the view source window by right-clicking on\
    \ the page and selecting “View Source”. In Firefox and Chrome, the style sheet\
    \ is clickable, allowing you to view the external style sheet rules that apply\
    \ to the web page. (Note that in Chrome, you have to right-click the style sheet\
    \ and select to open it because this file is stored on your local machine.)\n\n\
    Viewing the source code of web pages like this provides a great way to learn from\
    \ other web developers. Whenever you find an interesting element on a web page—whether\
    \ it is created with HTML, CSS or JavaScript—the page source will reveal how it\
    \ was created.\n\n## Comments\n\nComments in CSS are created by using the C-style\
    \ notation (`/* */`). Everything placed between `/*` and `*/` will be ignored\
    \ by browsers, even if the delimiters span multiple lines.\n\n```\n/* Multi-line\n\
    \   Comment */\n```\n\nThe main use of comments is to clarify the code to developers,\
    \ including you in the future. They can also be used to improve readability by\
    \ delimiting sections of the style sheet or providing meta data about the file,\
    \ such as the author’s name.\n\n```\n/*\n* Meta data\n*/\n\n/*** Section heading\
    \ ***/\np { margin-top: -1px; } /* clarification */\n```\n\nComments are also\
    \ useful for temporarily deactivating declarations or entire style rules for testing\
    \ purposes.\n\n```\np { /* color: white; */ }\n```\n\n## Whitespace\n\nWhitespace\
    \ refers to spaces, tabs, and new lines. You are free to format your style sheets\
    \ however you like with whitespace to make them easier to read. One common formatting\
    \ convention is to split declarations across multiple lines.\n\n```\n.fruit {\n\
    \  color: red;\n  margin: 1px;\n}\n```\n\nAnother popular convention is to keep\
    \ a rule’s declarations in a single line and split the declarations into multiple\
    \ lines only when they become too numerous.\n\n```\n.fruit       { color: red;\
    \   margin: 1px; }\n.fruit.apple { color: green; margin: 2px; }\n```\n\nThe formatting\
    \ you use is a matter of preference. Choose the one that makes sense to you and\
    \ aim to keep it consistent.\n\n# 2. Grouping\n\nTo keep style sheets short and\
    \ easy to edit, similar rules can be grouped together. This grouping offers several\
    \ ways to specify a set of related rules. For example, you can color the text\
    \ red and the background black for two header elements in four different ways,\
    \ as described in the following sections.\n\n## Ungrouped rules\n\nEach rule can\
    \ be written separately, which allows you to apply individual style rules to each\
    \ selected element.\n\n```\nh1 { color: red; }\nh1 { background: black; }\nh2\
    \ { color: red; }\nh2 { background: black; }\n```\n\n## Grouped selectors\n\n\
    The selectors can be grouped together by separating them with a comma. This grouping\
    \ will make the declaration apply to multiple selectors.\n\n```\nh1, h2 { color:\
    \ red; }\nh1, h2 { background: black; }\n```\n\n## Grouped declarations\n\nThe\
    \ declarations can be grouped together by separating them with a semicolon. All\
    \ styles within the declaration block will be applied to the selector.\n\n```\n\
    h1 {\n  color: red;\n  background: black;\n}\n\nh2 {\n  color: red;\n  background:\
    \ black;\n}\n```\n\n## Grouped selectors and declarations\n\nBoth the selectors\
    \ and declarations can be combined, resulting in a single rule.\n\n```\nh1, h2\
    \ {\n  color: red;\n  background: black;\n}\n```\n\nRules should be grouped whenever\
    \ possible to make the code more concise. It has a performance benefit because\
    \ concise rules reduce the size of the style sheet, which makes the CSS file load\
    \ more quickly. Moreover, it is convenient to specify the properties in only one\
    \ place, in case they have to be changed later. Additionally, grouping selectors\
    \ with similar styles makes it easier to maintain consistency between them."
  raw: '# 1. Using CSS


    There are three ways to insert CSS into an HTML document: by using an internal
    style sheet, inline styles, or an external style sheet. An internal style sheet
    applies to a single page, an inline style to a single element, and an external
    style sheet to potentially an entire web site.


    ## Internal style sheet


    An internal style sheet is useful when a single document needs to have its own
    unique styling. The style sheet is then embedded within the `<head>` section of
    the web document using the `<style>` element. This element is a container for
    style sheet rules and should have its `type` attribute set to `"text/css"`.


    `<style type="text/css">`


      `p { color: red; }`


    `</style>`


    ## Inline style


    Stylingcan be assigned to an individual element by using the `style` attribute
    to set an inline style. It is a generic attribute that can be included in any
    HTML start tag, and its value is the CSS declarations that will be applied to
    the element, separated by semicolons. There is no need to specify a selector because
    the declarations implicitly belong to the current element.


    `<p style="color: green">Green text</p>`


    This approach should be used sparingly because it mixes style with content and
    therefore makes future changes more cumbersome. It can be useful as a quick way
    to test styles before they are moved out to an external style sheet.


    ## External style sheet


    The most common way to include CSS is through an external style sheet. The style
    sheet rules are placed in a separate text file with a `.css` file extension. This
    style sheet is then referenced using the `<link>` element in the web page header.
    The `rel` (relationship) attribute must be set to `"stylesheet"` and the meta
    `type` attribute can optionally be set to `"text/css"`. The location of the style
    sheet is specified with the `href` attribute.


    `<link rel="stylesheet" type="text/css" href="MyStyle.css">`


    Another less common way to include an external style sheet is to use the CSS `@import`
    function from inside of the `<style>` element. For this function to work, it must
    be placed before any other rules.


    `<style type="text/css">`


      `@import url("MyStyle.css");`


    `</style>`


    Using an external style sheet is often preferred because it completely separates
    CSS from the HTML document. It is then possible to quickly create a consistent
    look for an entire web site and to change its appearance just by editing a single
    CSS document. It also has performance benefits because external style sheets are
    cached and therefore need to be downloaded only once—for the first page a visitor
    views at your site.


    ## Testing environment


    To experiment with CSS, you can use a simple text editor such as Notepad in Windows
    (found under Start ➤ Programs ➤ Accessories ➤ Notepad) or TextEdit on a Mac (found
    under Finder ➤ Applications ➤ TextEdit). Type the following single style rule
    into a new document in the editor. The rule will color the background of a web
    document red.


    `body { background: red; }`


    Save the file as “MyStyle.css” and then open another empty document. This new
    document will become the HTML file that uses the external style sheet you just
    created. Write the following HTML markup into the document, which includes a reference
    to the style sheet along with the minimal markup for a HTML 5 web document:


    `<!DOCTYPE html>`


    `<html>`


      `<head>`


        `<meta charset="UTF-8">`


        `<title>Example</title>`


        `<link rel="stylesheet" href="MyStyle.css">`


      `</head>`


      `<body>`


        `<p>This page is red</p>`


      `</body>`


    `</html>`


    Go ahead and save this text file as “MyPage.html” in the same folder as the CSS
    file. You have now created a simple environment in which you can test CSS. To
    view the page, open MyPage.html with your web browser. You will see that the background
    is indeed colored red because of the rule in the style sheet.


    ## View source


    While you have the browser opened, you can view the HTML markup that makes up
    the page by pressing Ctrl+U on a PC or Cmd+U on a Mac. This shortcut works in
    all major browsers, including Chrome, Firefox, and Internet Explorer (IE). You
    can also find the view source window by right-clicking on the page and selecting
    “View Source”. In Firefox and Chrome, the style sheet is clickable, allowing you
    to view the external style sheet rules that apply to the web page. (Note that
    in Chrome, you have to right-click the style sheet and select to open it because
    this file is stored on your local machine.)


    Viewing the source code of web pages like this provides a great way to learn from
    other web developers. Whenever you find an interesting element on a web page—whether
    it is created with HTML, CSS or JavaScript—the page source will reveal how it
    was created.


    ## Comments


    Comments in CSS are created by using the C-style notation (`/* */`). Everything
    placed between `/*` and `*/` will be ignored by browsers, even if the delimiters
    span multiple lines.


    `/* Multi-line`


       `Comment */`


    The main use of comments is to clarify the code to developers, including you in
    the future. They can also be used to improve readability by delimiting sections
    of the style sheet or providing meta data about the file, such as the author’s
    name.


    `/*`


    `* Meta data`


    `*/`


    `/*** Section heading ***/`


    `p { margin-top: -1px; } /* clarification */`


    Comments are also useful for temporarily deactivating declarations or entire style
    rules for testing purposes.


    `p { /* color: white; */ }`


    ## Whitespace


    Whitespacerefers to spaces, tabs, and new lines. You are free to format your style
    sheets however you like with whitespace to make them easier to read. One common
    formatting convention is to split declarations across multiple lines.


    `.fruit {`


      `color: red;`


      `margin: 1px;`


    `}`


    Another popular convention is to keep a rule’s declarations in a single line and
    split the declarations into multiple lines only when they become too numerous.


    `.fruit       { color: red;   margin: 1px; }`


    `.fruit.apple { color: green; margin: 2px; }`


    The formatting you use is a matter of preference. Choose the one that makes sense
    to you and aim to keep it consistent.


    # 2. Grouping


    To keep style sheets short and easy to edit, similar rules can be grouped together.
    This grouping offers several ways to specify a set of related rules. For example,
    you can color the text red and the background black for two header elements in
    four different ways, as described in the following sections.


    ## Ungrouped rules


    Each rule can be written separately, which allows you to apply individual style
    rules to each selected element.


    `h1 { color: red; }`


    `h1 { background: black; }`


    `h2 { color: red; }`


    `h2 { background: black; }`


    ## Grouped selectors


    The selectors can be grouped together by separating them with a comma. This grouping
    will make the declaration apply to multiple selectors.


    `h1, h2 { color: red; }`


    `h1, h2 { background: black; }`


    ## Grouped declarations


    The declarations can be grouped together by separating them with a semicolon.
    All styles within the declaration block will be applied to the selector.


    `h1 {`


      `color: red;`


      `background: black;`


    `}`


    `h2 {`


      `color: red;`


      `background: black;`


    `}`


    ## Grouped selectors and declarations


    Both the selectors and declarations can be combined, resulting in a single rule.


    `h1, h2 {`


      `color: red;`


      `background: black;`


    `}`


    Rules should be grouped whenever possible to make the code more concise. It has
    a performance benefit because concise rules reduce the size of the style sheet,
    which makes the CSS file load more quickly. Moreover, it is convenient to specify
    the properties in only one place, in case they have to be changed later. Additionally,
    grouping selectors with similar styles makes it easier to maintain consistency
    between them.'
  trans: "\n# 1. 使用 CSS\n\n将 CSS 插入 HTML 文档有三种方式：使用内部样式表、内联样式或外部样式表。内部样式表适用于单个页面，内联样式适用于单个元素，而外部样式表则可能应用于整个网站。\n\
    \n## 内部样式表\n\n当单个文档需要拥有自己独特的样式时，内部样式表非常有用。该样式表通过`<style>`元素嵌入到网页文档的`<head>`部分中。此元素是样式表规则的容器，且应将其`type`属性设置为`\"\
    text/css\"`。\n\n```\n<style type=\"text/css\">\n  p { color: red; }\n</style>\n\
    ```\n\n## 内联样式\n\n可以通过使用`style`属性为单个元素分配样式，从而设置内联样式。它是一个通用属性，可包含在任何 HTML 起始标签中，其值是将应用于该元素的\
    \ CSS 声明，这些声明之间用分号隔开。无需指定选择器，因为这些声明隐式地属于当前元素。\n\n```\n<p style=\"color: green\"\
    >Green text</p>\n```\n\n这种方法应谨慎使用，因为它将样式与内容混合在一起，从而使得未来的修改更加繁琐。在将样式移出到外部样式表之前，它作为一种快速测试样式的方法很有用。\n\
    \n## 外部样式表\n\n包含 CSS 最常见的方式是通过外部样式表。样式表规则被放置在一个扩展名为`.css`的独立文本文件中。然后，通过网页头部中的`<link>`元素来引用此样式表。`rel`（关联）属性必须设置为`\"\
    stylesheet\"`，并且`type`属性可以（可选地）设置为`\"text/css\"`。样式表的位置通过`href`属性指定。\n\n```\n\
    <link rel=\"stylesheet\" type=\"text/css\" href=\"MyStyle.css\">\n```\n\n另一种不太常见的包含外部样式表的方式是在`<style>`元素内部使用\
    \ CSS 的`@import`函数。为了使此函数生效，它必须放置在任何其他规则之前。\n\n```\n<style type=\"text/css\">\n\
    \  @import url(\"MyStyle.css\");\n</style>\n```\n\n使用外部样式表通常是首选，因为它将 CSS 与 HTML\
    \ 文档完全分离。这样一来，就可以快速为整个网站创建一致的外观，并且只需编辑一个 CSS 文档即可更改其外观。它还具有性能优势，因为外部样式表会被缓存，因此只需下载一次——即在访客浏览您网站的第一个页面时。\n\
    \n## 测试环境\n\n为了实验 CSS，您可以使用简单的文本编辑器，例如 Windows 中的记事本（位于“开始 ➤ 程序 ➤ 附件 ➤ 记事本”）或\
    \ Mac 上的文本编辑（位于“访达 ➤ 应用程序 ➤ 文本编辑”）。在编辑器中新建一个文档，并键入下面这条单独的样式规则。该规则会将网页文档的背景颜色变为红色。\n\
    \n```\nbody { background: red; }\n```\n\n将文件保存为`MyStyle.css`，然后打开另一个空白文档。这个新文档将成为使用您刚刚创建的外部样式表的\
    \ HTML 文件。在该文档中写入以下 HTML 标记，其中包含对样式表的引用以及 HTML 5 网页文档所需的最少标记：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\">\n    <title>示例</title>\n\
    \    <link rel=\"stylesheet\" href=\"MyStyle.css\">\n  </head>\n  <body>\n   \
    \ <p>此页面是红色的</p>\n  </body>\n</html>\n```\n\n继续操作，将此文本文件保存为`MyPage.html`，放到与 CSS\
    \ 文件相同的文件夹中。至此，您已经创建了一个可以测试 CSS 的简单环境。要查看页面，请使用您的网络浏览器打开`MyPage.html`。您将会看到背景确实因样式表中的规则而变为红色。\n\
    \n## 查看源代码\n\n当浏览器处于打开状态时，您可以通过在 PC 上按`Ctrl+U`或在 Mac 上按`Cmd+U`来查看构成页面的 HTML 标记。这个快捷键在所有主流浏览器中都有效，包括\
    \ Chrome、Firefox 和 Internet Explorer (IE)。您也可以通过右键点击页面并选择“查看源代码”来找到查看源代码窗口。在 Firefox\
    \ 和 Chrome 中，样式表是可点击的，允许您查看应用于网页的外部样式表规则。（请注意，在 Chrome 中，您需要右键点击样式表并选择打开它，因为这个文件存储在您的本地机器上。）\n\
    \n像这样查看网页的源代码是向其他 Web 开发者学习的好方法。每当您在网页上发现一个有趣的元素——无论它是用 HTML、CSS 还是 JavaScript\
    \ 创建的——页面源代码都会揭示它是如何创建的。\n\n## 注释\n\nCSS 中的注释是通过使用 C 风格的符号（`/* */`）创建的。放置在`/*`和`*/`之间的所有内容都会被浏览器忽略，即使分隔符跨越多行。\n\
    \n```\n/* 多行\n   注释 */\n```\n\n注释的主要用途是向开发者（包括未来的您）阐明代码。它们也可以通过划分样式表的不同区域或提供关于文件的元数据（例如作者姓名）来提高可读性。\n\
    \n```\n/*\n* 元数据\n*/\n\n/*** 部分标题 ***/\np { margin-top: -1px; } /* 说明 */\n```\n\
    \n注释对于临时停用声明或整个样式规则以进行测试也很有用。\n\n```\np { /* color: white; */ }\n```\n\n## 空白\n\
    \n空白指的是空格、制表符和换行符。您可以自由地使用空白来格式化您的样式表，使其更易于阅读。一种常见的格式化惯例是将声明拆分成多行。\n\n```\n.fruit\
    \ {\n  color: red;\n  margin: 1px;\n}\n```\n\n另一种流行的惯例是将规则的声明保留在一行中，只有当声明过多时才将它们拆分成多行。\n\
    \n```\n.fruit       { color: red;   margin: 1px; }\n.fruit.apple { color: green;\
    \ margin: 2px; }\n```\n\n您使用的格式取决于个人偏好。选择对您有意义的方式，并力求保持一致。\n\n# 2. 分组\n\n为了使样式表简短且易于编辑，相似的规则可以组合在一起。这种分组提供了几种指定一组相关规则的方法。例如，您可以通过以下各节描述的四种不同方式为两个标题元素设置文本为红色、背景为黑色。\n\
    \n## 未分组的规则\n\n每个规则可以单独编写，这允许您对每个选定的元素应用单独的样式规则。\n\n```\nh1 { color: red; }\n\
    h1 { background: black; }\nh2 { color: red; }\nh2 { background: black; }\n```\n\
    \n## 分组选择器\n\n可以将选择器用逗号分隔来进行分组。这种分组将使声明应用于多个选择器。\n\n```\nh1, h2 { color: red;\
    \ }\nh1, h2 { background: black; }\n```\n\n## 分组声明\n\n可以将声明用分号分隔来进行分组。声明块内的所有样式都将应用于选择器。\n\
    \n```\nh1 {\n  color: red;\n  background: black;\n}\n\nh2 {\n  color: red;\n \
    \ background: black;\n}\n```\n\n## 分组选择器和声明\n\n可以同时组合选择器和声明，从而形成一个单独的规则。\n\n```\n\
    h1, h2 {\n  color: red;\n  background: black;\n}\n```\n\n应尽可能地对规则进行分组，以使代码更加简洁。它具有性能优势，因为简洁的规则减小了样式表的大小，从而使\
    \ CSS 文件加载更快。此外，将属性仅指定在一个地方也很方便，以防将来需要修改它们。另外，对具有相似样式的选择器进行分组有助于更容易地在它们之间保持一致性。\n"
- fmt: '# 3. Class and id selectors


    Class and id selectors define rules that apply to only a selected set of HTML
    elements. They allow you to identify individual elements, or groups of elements,
    without having to style all instances of the element type.


    ## Class selector


    The class selector is used to identify a group of elements. It is recognized by
    the period sign (`.`), followed by a class name. The class can be a general class
    that can be applied to any element.


    ```

    /* Selects any element with class name myclass */

    .myclass {}

    ```


    The selector can also be a specific class that can be applied to only one type
    of element. The specific class is defined by declaring the element’s name before
    the period sign.


    ```

    /* Selects any <p> element with class name myclass */

    p.myclass {}

    ```


    Specific classes make it easier to identify where the class is used; general classes
    allow for greater code reuse.


    ### Class example


    For example, suppose that the text inside of some elements should be colored,
    but not for all instances of the elements. The first step then is to add a general
    class rule with a color property specified.


    ```

    .info { color: green; }

    ```


    This rule says that any element whose `class` attribute has the value of `"info"`
    will have this style.


    ```

    <p class="info">Green</p>

    ```


    If a class rule will be used by only a single element type, it can instead be
    defined as a specific class. Doing so makes it easier for anyone reading the style
    sheet to understand where the style is used.


    ```

    p.warn { color: orange; }

    ```


    A specific class rule is applied to the document in the same way as a general
    class rule, but it will style elements of only the specified type.


    ```

    <p class="warn">Orange</p>

    ```


    More than one class rule can be applied to a single element by separating each
    class name with a space, which makes class rules very versatile.


    ```

    <p class="style1 style2"></p>

    ```


    ## Id selector


    The id selector is used to identify a single unique element. Although it works
    much like the class selector, it uses a pound sign (`#`) instead of a period and
    the `id` attribute instead of the `class` attribute. Like the `class` attribute,
    the `id` is a generic attribute that can be applied to virtually any HTML element.
    It provides a unique identifier for an element within a document.


    ```

    /* Selects the element with id set to myid */

    #myid {}

    ```


    Like class selectors, id selectors can be qualified with an element. However,
    because there should be only one element with a given id, this additional qualifier
    is often considered unnecessary.


    ```

    /* Selects the <p> element with id set to myid */

    p#myid {}

    ```


    ### Id example


    The following id selector will match the one and only element in the document
    whose `id` attribute is set to that id. This selector can therefore be used instead
    of the class selector if a style is intended to be applied to only a single element
    instance because this makes it clearer where the rule is used.


    ```

    #err { color: red; }

    ```


    An id rule is applied to an element using the `id` attribute. Because the `id`
    attribute has to be unique, each id selector can be used on only one element per
    web page. Therefore, the id selector implicitly specifies that the style is used
    only once on any one page.


    ```

    <p id="err">Red</p>

    ```


    ## Class and id guidelines


    In many instances, using classes is the preferred method of selecting elements
    in CSS because classes are both flexible and reusable. Ids, on the other hand,
    are often used for structural elements of a site, such as `#content` and `#footer`,
    to highlight that those elements serve a unique role.


    # 4. Attribute selectors


    Attribute selectors allow style to be added to elements based on their attributes
    and attribute values.


    ## Attribute selector


    The attribute selector will match elements that use the specified attribute, regardless
    of its value.


    ```

    input[type] {}

    ```


    This selector will match only input elements that use the `type` attribute, such
    as the following element:


    ```

    <input type="text">

    ```


    ## Attribute value selector


    The `[attribute=value]` selector will match by both attribute and value.


    ```

    input[type="submit"] {}

    ```


    Input elements that have their `type` attribute set to `submit` will be matched
    by this rule, as in the following example:


    ```

    <input type="submit">

    ```


    ## Language attribute selector


    The language attribute selector is used to match the `lang` attribute.


    ```

    p[lang|="en"] {}

    ```


    This selector will match any elements whose `lang` attribute value begins with
    “en”, such as “en-US”. Note that language codes such as these are case insensitive.


    ```

    <p lang="en">English</p>

    <p lang="en-US">American English</p>

    ```


    ## Delimited value selector


    The `[attribute~=value]` selector will apply to elements whose attribute value
    contains the given word among a space-separated list of words.


    ```

    input[value~="word"] {}

    ```


    This rule will select both of the following elements. The word needs to be an
    exact case-sensitive match; for example, the selector will not target “Word” or
    “words”.


    ```

    <input type="text" value="word">

    <input type="text" value="word word2">

    ```


    ## Value substring selector


    The `[attribute*=value]` selector matches elements whose attribute value contains
    the specified substring.


    ```

    p[title*="para"] {}

    ```


    Paragraph elements with a `title` containing “para” will be matched by this rule.


    ```

    <p title="my paragraph"></p>

    ```


    ## Value start selector


    The `[attribute^=value]` selector matches every element whose attribute value
    begins with the specified string.


    ```

    p[title^="first"] {}

    ```


    Paragraphs with a `title` value starting with “first” will have this rule applied.


    ```

    <p title="first paragraph"></p>

    ```


    ## Value end selector


    The `[attribute$=value]` selector matches an element if its attribute value ends
    with the specified string.


    ```

    p[title$="1"] {}

    ```


    In the following code, the value of the `title` attribute ends with “1” and will
    therefore be matched by this rule:


    ```

    <p title="paragraph 1"></p>

    ```


    # 5. Pseudo selectors


    The pseudo-classes and pseudo-elements are keywords that can be appended to selectors
    to make them more specific. They are easy to recognize because they are always
    preceded by a colon.


    ## Pseudo-elements


    The pseudo-elements enable parts of an element to be styled. There are four of
    them in CSS, as discussed in the following sections.


    ### first-letter and first-line


    The pseudo-elements `:first-letter` and `:first-line` can apply styles to the
    first letter and the first line of an element. They work only on block elements
    such as paragraphs.


    ```

    p:first-letter { font-size: 120%; }

    p:first-line   { font-weight: bold; }

    ```


    The preceding first rule makes the initial letter in a paragraph render 20% larger
    than other text. The second rule makes the first line of text in a paragraph bold.


    ### before and after


    As their names indicate, the `:before` and `:after` pseudo-elements can target
    the location before and after an element. They are used together with the `content`
    property to insert content before or after an element.


    ```

    p:before { content: "Before"; }

    p:after  { content: "After"; }

    ```


    These rules make the following paragraph display as “BeforeMiddleAfter”:


    ```

    <p>Middle</p>

    ```


    The `content` property is special in that it can be used only together with these
    two pseudo-elements. It is also the only property that breaks the line between
    content (HTML) and design (CSS). Keep in mind that this line should be broken
    only when the presence of a piece of content comes down to a design decision.
    For example, the `content` property can be used to add an icon before an element,
    which can be done using the `url` function.


    ```

    p.bullet:before { content: url(my-bullet.png); }

    ```'
  raw: '# 3. Class and id selectors


    Class and id selectors define rules that apply to only a selected set of HTML
    elements. They allow you to identify individual elements, or groups of elements,
    without having to style all instances of the element type.


    ## Class selector


    The class selector is used to identify a group of elements. It is recognized by
    the period sign (`.`), followed by a class name. The class can be a general class
    that can be applied to any element.


    `/* Selects any element with class name myclass */`


    `.myclass {}`


    The selector can also be a specific class that can be applied to only one type
    of element. The specific class is defined by declaring the element’s name before
    the period sign.


    `/* Selects any <p> element with class name myclass */`


    `p.myclass {}`


    Specific classes make it easier to identify where the class is used; general classes
    allow for greater code reuse.


    ### Class example


    For example, suppose that the text inside of some elements should be colored,
    but not for all instances of the elements. The first step then is to add a general
    class rule with a color property specified.


    `.info { color: green; }`


    This rule says that any element whose `class` attribute has the value of `"info"`
    will have this style.


    `<p class="info">Green</p>`


    If a class rule will be used by only a single element type, it can instead be
    defined as a specific class. Doing so makes it easier for anyone reading the style
    sheet to understand where the style is used.


    `p.warn { color: orange; }`


    A specific class rule is applied to the document in the same way as a general
    class rule, but it will style elements of only the specified type.


    `<p class="warn">Orange</p>`


    More than one class rule can be applied to a single element by separating each
    class name with a space, which makes class rules very versatile.


    `<p class="style1 style2"></p>`


    ## Id selector


    The id selector is used to identify a single unique element. Although it works
    much like the class selector, it uses a pound sign (`#`) instead of a period and
    the `id` attribute instead of the `class` attribute. Like the `class` attribute,
    the `id` is a generic attribute that can be applied to virtually any HTML element.
    It provides a unique identifier for an element within a document.


    `/* Selects the element with id set to myid */`


    `#myid {}`


    Like class selectors, id selectors can be qualified with an element. However,
    because there should be only one element with a given id, this additional qualifier
    is often considered unnecessary.


    `/* Selects the <p> element with id set to myid */`


    `p#myid {}`


    ### Id example


    The following id selector will match the one and only element in the document
    whose `id` attribute is set to that id. This selector can therefore be used instead
    of the class selector if a style is intended to be applied to only a single element
    instance because this makes it clearer where the rule is used.


    `#err { color: red; }`


    An id rule is applied to an element using the `id` attribute. Because the `id`
    attribute has to be unique, each id selector can be used on only one element per
    web page. Therefore, the id selector implicitly specifies that the style is used
    only once on any one page.


    `<p id="err">Red</p>`


    ## Class and id guidelines


    In many instances, using classes is the preferred method of selecting elements
    in CSS because classes are both flexible and reusable. Ids, on the other hand,
    are often used for structural elements of a site, such as `#content` and `#footer`,
    to highlight that those elements serve a unique role.


    # 4. Attribute selectors


    Attribute selectors allow style to be added to elements based on their attributes
    and attribute values.


    ## Attribute selector


    The attribute selector will match elements that use the specified attribute, regardless
    of its value.


    `input[type] {}`


    This selector will match only input elements that use the `type` attribute, such
    as the following element:


    `<input type="text">`


    ## Attribute value selector


    The `[attribute=value]` selector will match by both attribute and value.


    `input[type="submit"] {}`


    Input elements that have their `type` attribute set to `submit` will be matched
    by this rule, as in the following example:


    `<input type="submit">`


    ## Language attribute selector


    The language attribute selector is used to match the `lang` attribute.


    `p[lang|="en"] {}`


    This selector will match any elements whose `lang` attribute value begins with
    “en”, such as “en-US”. Note that language codes such as these are case insensitive.


    `<p lang="en">English</p>`


    `<p lang="en-US">American English</p>`


    ## Delimited value selector


    The `[attribute∼=value]` selector will apply to elements whose attribute value
    contains the given word among a space-separated list of words.


    `input[value∼="word"] {}`


    This rule will select both of the following elements. The word needs to be an
    exact case-sensitive match; for example, the selector will not target “Word” or
    “words”.


    `<input type="text" value="word">`


    `<input type="text" value="word word2">`


    ## Value substring selector


    The `[attribute*=value]` selector matches elements whose attribute value contains
    the specified substring.


    `p[title*="para"] {}`


    Paragraph elements with a `title` containing “para” will be matched by this rule.


    `<p title="my paragraph"></p>`


    ## Value start selector


    The `[attribute^=value]` selector matches every element whose attribute value
    begins with the specified string.


    `p[title^="first"] {}`


    Paragraphs with a `title` value starting with “first” will have this rule applied.


    `<p title="first paragraph"></p>`


    ## Value end selector


    The `[attribute$=value]` selector matches an element if its attribute value ends
    with the specified string.


    `p[title$="1"] {}`


    In the following code, the value of the `title` attribute ends with “1” and will
    therefore be matched by this rule:


    `<p title="paragraph 1"></p>`


    # 5. Pseudo selectors


    The pseudo-classes and pseudo-elements are keywords that can be appended to selectors
    to make them more specific. They are easy to recognize because they are always
    preceded by a colon.


    ## Pseudo-elements


    The pseudo-elements enable parts of an element to be styled. There are four of
    them in CSS, as discussed in the following sections.


    ### first-letter and first-line


    The pseudo-elements `:first-letter` and `:first-line` can apply styles to the
    first letter and the first line of an element. They work only on block elements
    such as paragraphs.


    `p:first-letter { font-size: 120%; }`


    `p:first-line   { font-weight: bold; }`


    The preceding first rule makes the initial letter in a paragraph render 20% larger
    than other text. The second rule makes the first line of text in a paragraph bold.


    ### before and after


    As their names indicate, the `:before` and `:after` pseudo-elements can target
    the location before and after an element. They are used together with the `content`
    property to insert content before or after an element.


    `p:before { content: "Before"; }`


    `p:after  { content: "After"; }`


    These rules make the following paragraph display as “BeforeMiddleAfter”:


    `<p>Middle</p>`


    The `content` property is special in that it can be used only together with these
    two pseudo-elements. It is also the only property that breaks the line between
    content (HTML) and design (CSS). Keep in mind that this line should be broken
    only when the presence of a piece of content comes down to a design decision.
    For example, the `content` property can be used to add an icon before an element,
    which can be done using the `url` function.


    `p.bullet:before { content: url(my-bullet.png); }`'
