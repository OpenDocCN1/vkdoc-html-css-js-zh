    \ is to inherit the parent’s value. The following example applies four font properties\
    \ to the paragraph element:\n\n```\np { font: italic 50%/125% Verdana; }\n```\n\
    \nThis font declaration sets the `font-style`, `font-size`, `line-height`, and\
    \ `font-family` properties in one declaration. Because `font-variant` and `font-weight`\
    \ are not included, a side effect of using this declaration is that they are both\
    \ re-set to `normal`.\n\n# Custom fonts\n\nSelected fonts can be seen only if\
    \ the font is installed on the device used to view the web site. If a nonstandard\
    \ font is needed, a `@font-face` rule can be used to load the font from an online\
    \ location.\n\n```\n@font-face {\n  font-family: MyFont;\n  src: url(myfont.ttf);\n\
    }\n```\n\nThis rule creates a font named `MyFont` and provides a URL from which\
    \ the browser can download it. With this rule in place, the custom font can be\
    \ used just like any standard font.\n\n```\np { font-family: \"MyFont\", arial,\
    \ sans-serif; }\n```\n\nThis use of the `@font-face` rule is supported in Chrome\
    \ 5+, Firefox 3.5+, IE9+, Safari 3.1+, and Opera 10+. If the browser does not\
    \ support the custom font, it reverts to the next standard font in the list.\n\
    \n# Background\n\nThe background properties can add background effects. None of\
    \ these properties inherits and they can be applied to any elements.\n\n## background-color\n\
    \nThe color of an element’s background is set with the `background-color` property.\
    \ By default, its value is set to `transparent`.\n\n```\nbackground-color : transparent\
    \ | <color>\n```\n\nEven if a background image is used, it is a good idea to set\
    \ a background color. That way, there is a fallback color in case the background\
    \ image is unavailable for any reason.\n\n```\nbackground-color: #ccc;\n```\n\n\
    ## background-image\n\n`background-image` specifies an image to use as a background\
    \ with the `url` function.\n\n```\nbackground-image : none | url(<url>)\n```\n\
    \nThe image location defined with the `url` function can be either absolute or\
    \ relative to the location of the CSS file.\n\n```\n/* Relative path */\nbackground-image:\
    \ url(../images/myimg.jpg);\n\n/* Absolute path */\nbackground-image: url(http://mydomain.com/images/myimg.jpg);\n\
    ```\n\n## background-repeat\n\nBy default, the background image repeats itself\
    \ both horizontally and vertically. It can be changed with the `background-repeat`\
    \ property to make the background repeat only horizontally (`repeat-x`), only\
    \ vertically (`repeat-y`), or not at all (`no-repeat`).\n\n```\nbackground-repeat\
    \ : repeat | repeat-x | repeat-y | no-repeat\n```\n\n## background-attachment\n\
    \nWhen the viewport is scrolled in a browser, a background image normally follows\
    \ along with the rest of the page. This behavior is determined by the `background-attachment`\
    \ property, whose initial value is `scroll`. If the value is set to `fixed`, the\
    \ position of the background is instead relative to the viewport, making the background\
    \ stay in place even as the page is scrolled.\n\n```\nbackground-attachment :\
    \ scroll | fixed | local\n```\n\nCSS 3 introduced a third value for this property,\
    \ `local`, which fixes the background relative to the element’s content instead\
    \ of the whole viewport. With this value, the background scrolls along with the\
    \ element’s content only when that element is scrolled (achieved by using the\
    \ `overflow` property). Support for this value was introduced in Chrome 4+, Firefox\
    \ 25+, IE9+, Safari 5+, and Opera 10.5+.\n\n## background-position\n\nThe `background-position`\
    \ property is used to position a background image, with one value for vertical\
    \ placement and another for horizontal. They can both be set to a length or a\
    \ percentage of the element’s size, and negative values are allowed. There are\
    \ also some predefined values for this property, including: `top`, `center`, and\
    \ `bottom` for vertical placement; and `left`, `center`, and `right` for horizontal\
    \ placement.\n\n```\nbackground-position : <length> <length> | <percentage> <percentage>\
    \ |\n                      top/center/bottom + left/center/right\n```\n\nBy default,\
    \ a background image is positioned to the top left of its parent element’s padding\
    \ area. Any length values given move the background image relative to these edges.\
    \ For example, the following property offsets the background 5 pixels down and\
    \ 10 pixels to the right:\n\n```\nbackground-position: 5px 10px;\n```\n\nCSS 3\
    \ added a four-value syntax, allowing a choice of which side of the element the\
    \ image will be positioned relative to. Using this syntax, the background in the\
    \ next example is positioned relative to the bottom right instead of the top left\
    \ of the element.\n\n```\nbackground-position: bottom 5px right 5px;\n```\n\n\
    This four-value syntax is supported only in Chrome 25+, Firefox 13+, IE9+, Safari\
    \ 5.28+, and Opera 10.5+.\n\n## background-size\n\nThe size of a background image\
    \ is normally the same as the actual size of the image. It can be changed with\
    \ the `background-size` property, which allows the background to be resized to\
    \ a dimension specified in pixels or as a percentage relative to the background\
    \ positioning area.\n\n```\nbackground-size (1-2) : auto | <length> | <percentage>\
    \ | cover | contain\n```\n\nWith two values, the first value determines the width\
    \ of the image and the second value its height.\n\n```\nbackground-size: 150%\
    \ 100%;\n```\n\nA single value defines only the width of the image. The height\
    \ is then implicitly set to `auto`, preserving the aspect ratio of the image.\n\
    \n```\nbackground-size: 150%;\n```\n\nThe `contain` and `cover` keywords size\
    \ the background to fill the parent container while maintaining the aspect ratio.\
    \ The `cover` value ensures that the image completely covers the background positioning\
    \ area, whereas `contain` makes sure that the background is contained within the\
    \ area. Their difference is illustrated in Figure 14-1.\n\n![A978-1-4302-6491-0_14_Fig1_HTML.jpg](A978-1-4302-6491-0_14_Fig1_HTML.jpg)\n\
    \nFigure 14-1. Backgrounds sized with `cover` and `contain` keywords\n\nThis property\
    \ was added in CSS 3 and is supported in Chrome 4+, Firefox 4+, IE9+, Safari 5+,\
    \ and Opera 10.5+. Use of the `-webkit` and `-moz` prefixes expand support to\
    \ Chrome 1+, Safari 3+, and Firefox 3.6+.\n\n## background-clip\n\nThe painting\
    \ area of a background image or color can be set with the `background-clip` property.\n\
    \n```\nbackground-clip : border-box | padding-box | content-box\n```\n\nThe background\
    \ normally extends to the outside edge of the border (`border-box`) and renders\
    \ behind any visible border. A value of `padding-box` instead draws the background\
    \ within the element’s padding. The third possible value, `content-box`, draws\
    \ the background within the content area. Using the following declaration, the\
    \ background is clipped to the outside edge of the content:\n\n```\nbackground-clip:\
    \ content-box;\n```\n\n`background-clip` is supported in Chrome 1+, Firefox 4+,\
    \ IE9+, Safari 3+, and Opera 12+."
  raw: '## font


    There is a convenient shorthand property named `font` that sets all the font properties
    in one declaration.


    `font : inherit | <font-style> + <font-variant> +`


           `<font-weight> + <font-size> / <line-height> +`


           `<font-family>`


    The properties must be specified in the order listed previously. As long as this
    order is kept, either one of the properties can be left out (except for `font-size`
    and `font-family`, which are mandatory). If a property is left out, the default
    value for that property is used, which is to inherit the parent’s value. The following
    example applies four font properties to the paragraph element:


    `p { font: italic 50%/125% Verdana; }`


    This font declaration sets the `font-style`, `font-size`, `line-height`, and `font-family`
    properties in one declaration. Because `font-variant` and `font-weight` are not
    included, a side effect of using this declaration is that they are both re-set
    to normal.


    ## Custom fonts


    Selected fonts can be seen only if the font is installed on the device used to
    view the web site. If a nonstandard font is needed, a `@font-face` rule can be
    used to load the font from an online location.


    `@font-face {`


      `font-family: MyFont;`


      `src: url(myfont.ttf);`


    `}`


    This rule creates a font named `MyFont` and provides a URL from which the browser
    can download it. With this rule in place, the custom font can be used just like
    any standard font.


    `p { font-family: "MyFont", arial, sans-serif; }`


    This use of the `@font-face` rule is supported in Chrome 5+, Firefox 3.5+, IE9+,
    Safari 3.1+, and Opera 10+. If the browser does not support the custom font, it
    reverts to the next standard font in the list.


    # 14. Background


    The background properties can add background effects. None of these properties
    inherits and they can be applied to any elements.


    ## background-color


    The color of an element’s background is set with the `background-color` property.
    By default, its value is set to `transparent`.


    `background-color : transparent | <color>`


    Even if a background image is used, it is a good idea to set a background color.
    That way, there is a fallback color in case the background image is unavailable
    for any reason.


    `background-color: #ccc;`


    ## background-image


    `background-` `image` specifies an image to use as a background with the `url`
    function.


    `background-image : none | url(<url>)`


    The image location defined with the `url` function can be either absolute or relative
    to the location of the CSS file.


    `/* Relative path */`


    `background-image: url(../images/myimg.jpg);`


    `/* Absolute path */`


    `background-image: url(` `http://mydomain.com/images/myimg.jpg` `);`


    ## background-repeat


    By default, the background image repeats itself both horizontally and vertically.
    It can be changed with the `background-repeat` property to make the background
    repeat only horizontally (`repeat-x`), only vertically (`repeat-y`), or not at
    all (`no-repeat`).


    `background-repeat : repeat | repeat-x | repeat-y | no-repeat`


    ## background-attachment


    When the viewport is scrolled in a browser, a background image normally follows
    along with the rest of the page. This behavior is determined by the `background-attachment`
    property, whose initial value is `scroll`. If the value is set to `fixed`, the
    position of the background is instead relative to the viewport, making the background
    stay in place even as the page is scrolled.


    `background-attachment : scroll | fixed | local`


    CSS 3 introduced a third value for this property, `local`, which fixes the background
    relative to the element’s content instead of the whole viewport. With this value,
    the background scrolls along with the element’s content only when that element
    is scrolled (achieved by using the `overflow` property). Support for this value
    was introduced in Chrome 4+, Firefox 25+, IE9+, Safari 5+, and Opera 10.5+.


    ## background-position


    The `background-position` property is used to position a background image, with
    one value for vertical placement and another for horizontal. They can both be
    set to a length or a percentage of the element’s size, and negative values are
    allowed. There are also some predefined values for this property, including: `top`,
    `center`, and `bottom` for vertical placement; and `left`, `center`, and `right`
    for horizontal placement.


    `background-position : <length> <length> | <percentage> <percentage> |`


                          `top/center/bottom + left/center/right`


    By default, a background image is positioned to the top left of its parent element’s
    padding area. Any length values given move the background image relative to these
    edges. For example, the following property offsets the background 5 pixels down
    and 10 pixels to the right:


    `background-position: 5px 10px;`


    CSS 3 added a four-value syntax, allowing a choice of which side of the element
    the image will be positioned relative to. Using this syntax, the background in
    the next example is positioned relative to the bottom right instead of the top
    left of the element.


    `background-position: bottom 5px right 5px;`


    This four-value syntax is supported only in Chrome 25+, Firefox 13+, IE9+, Safari
    5.28+, and Opera 10.5+.


    ## background-size


    The size of a background image is normally the same as the actual size of the
    image. It can be changed with the `background-size` property, which allows the
    background to be resized to a dimension specified in pixels or as a percentage
    relative to the background positioning area.


    `background-size (1-2) : auto | <length> | <percentage> | cover | contain`


    With two values, the first value determines the width of the image and the second
    value its height.


    `background-size: 150% 100%;`


    A single value defines only the width of the image. The height is then implicitly
    set to `auto`, preserving the aspect ratio of the image.


    `background-size: 150%;`


    The `contain` and `cover` keywords size the background to fill the parent container
    while maintaining the aspect ratio. The `cover` value ensures that the image completely
    covers the background positioning area, whereas `contain` makes sure that the
    background is contained within the area. Their difference is illustrated in Figure
    [14-1](#A978-1-4302-6491-0_14_Chapter.html#Fig1).


    ![A978-1-4302-6491-0_14_Fig1_HTML.jpg](A978-1-4302-6491-0_14_Fig1_HTML.jpg)


    Figure 14-1.


    Backgrounds sized with cover and contain keywords


    This property was added in CSS 3 and is supported in Chrome 4+, Firefox 4+, IE9+,
    Safari 5+, and Opera 10.5+. Use of the `-webkit` and `-moz` prefixes expand support
    to Chrome 1+, Safari 3+, and Firefox 3.6+.


    ## background-clip


    The painting area of a background image or color can be set with the `background-clip`
    property.


    `background-clip : border-box | padding-box | content-box`


    The background normally extends to the outside edge of the border (`border-box`)
    and renders behind any visible border. A value of `padding-box` instead draws
    the background within the element’s padding. The third possible value, `content-box`,
    draws the background within the content area. Using the following declaration,
    the background is clipped to the outside edge of the content:


    `background-clip: content-box;`


    `background-clip` is supported in Chrome 1+, Firefox 4+, IE9+, Safari 3+, and
    Opera 12+.'
  trans: "\n# 字体\n\n有一个便捷的简写属性`font`，它能够在一个声明中设置所有字体属性。\n\n```\nfont : inherit | <font-style>\
    \ + <font-variant> +\n       <font-weight> + <font-size> / <line-height> +\n \
    \      <font-family>\n```\n\n这些属性必须按照上述顺序指定。只要保持此顺序，任何一个属性都可以省略（除了**必须**指定的`font-size`和`font-family`）。如果某个属性被省略，则会使用该属性的默认值，即继承父级的值。以下示例向段落元素应用了四个字体属性：\n\
    \n```\np { font: italic 50%/125% Verdana; }\n```\n\n这个字体声明在一个声明中设置了`font-style`、`font-size`、`line-height`和`font-family`属性。由于未包含`font-variant`和`font-weight`，使用此声明的一个副作用是它们都会被重新设置为`normal`。\n\
    \n# 自定义字体\n\n只有字体安装在用于查看网站的设备上时，才能看到所选字体。如果需要非标准字体，可以使用`@font-face`规则从在线位置加载字体。\n\
    \n```\n@font-face {\n  font-family: MyFont;\n  src: url(myfont.ttf);\n}\n```\n\
    \n此规则创建了一个名为`MyFont`的字体，并提供了一个浏览器可以从中下载该字体的 URL。有了这个规则，自定义字体就可以像任何标准字体一样使用。\n\n\
    ```\np { font-family: \"MyFont\", arial, sans-serif; }\n```\n\n这种使用`@font-face`规则的方式在\
    \ Chrome 5+、Firefox 3.5+、IE9+、Safari 3.1+ 和 Opera 10+ 中受支持。如果浏览器不支持自定义字体，则会回退到列表中的下一个标准字体。\n\
    \n# 背景\n\n背景属性可以添加背景效果。这些属性均不继承，并且可以应用于任何元素。\n\n## background-color\n\n元素背景的颜色通过`background-color`属性设置。默认情况下，其值设置为`transparent`。\n\
    \n```\nbackground-color : transparent | <color>\n```\n\n即使使用了背景图像，最好也设置一个背景颜色。这样，万一出于任何原因背景图像不可用，也能有一个后备颜色。\n\
    \n```\nbackground-color: #ccc;\n```\n\n## background-image\n\n`background-image`通过`url`函数指定要用作背景的图像。\n\
    \n```\nbackground-image : none | url(<url>)\n```\n\n使用`url`函数定义的图像位置可以是绝对路径，也可以是相对于\
    \ CSS 文件位置的相对路径。\n\n```\n/* 相对路径 */\nbackground-image: url(../images/myimg.jpg);\n\
    \n/* 绝对路径 */\nbackground-image: url(http://mydomain.com/images/myimg.jpg);\n```\n\
    \n## background-repeat\n\n默认情况下，背景图像在水平和垂直方向上都会重复。可以通过`background-repeat`属性更改此行为，使背景仅水平重复（`repeat-x`）、仅垂直重复（`repeat-y`）或完全不重复（`no-repeat`）。\n\
    \n```\nbackground-repeat : repeat | repeat-x | repeat-y | no-repeat\n```\n\n##\
    \ background-attachment\n\n当在浏览器中滚动视口时，背景图像通常与页面的其余部分一起滚动。此行为由`background-attachment`属性决定，其初始值为`scroll`。如果该值设置为`fixed`，则背景的位置将相对于视口，使得背景即使在页面滚动时也保持原位。\n\
    \n```\nbackground-attachment : scroll | fixed | local\n```\n\nCSS 3 为该属性引入了第三个值`local`，它将背景相对于元素内容而非整个视口固定。使用此值时，背景仅在该元素本身滚动时（通过使用`overflow`属性实现）才随元素内容滚动。对此值的支持是在\
    \ Chrome 4+、Firefox 25+、IE9+、Safari 5+ 和 Opera 10.5+ 中引入的。\n\n## background-position\n\
    \n`background-position`属性用于定位背景图像，一个值用于垂直放置，另一个用于水平放置。它们都可以设置为长度值或元素大小的百分比，并且允许使用负值。此属性还有一些预定义值，包括：用于垂直放置的`top`、`center`和`bottom`；以及用于水平放置的`left`、`center`和`right`。\n\
    \n```\nbackground-position : <length> <length> | <percentage> <percentage> |\n\
    \                      top/center/bottom + left/center/right\n```\n\n默认情况下，背景图像定位在其父元素内边距区域的左上角。给出的任何长度值都会使背景图像相对于这些边缘移动。例如，以下属性将背景向下偏移\
    \ 5 像素，向右偏移 10 像素：\n\n```\nbackground-position: 5px 10px;\n```\n\nCSS 3 增加了一种四值语法，允许选择图像将相对于元素的哪一侧进行定位。使用这种语法，下一个示例中的背景将相对于元素的右下角而非左上角进行定位。\n\
    \n```\nbackground-position: bottom 5px right 5px;\n```\n\n这种四值语法仅在 Chrome 25+、Firefox\
    \ 13+、IE9+、Safari 5.28+ 和 Opera 10.5+ 中受支持。\n\n## background-size\n\n背景图像的大小通常与图像的实际大小相同。可以通过`background-size`属性更改此大小，该属性允许将背景重新调整为以像素指定的尺寸，或相对于背景定位区域的百分比。\n\
    \n```\nbackground-size (1-2) : auto | <length> | <percentage> | cover | contain\n\
    ```\n\n使用两个值时，第一个值确定图像的宽度，第二个值确定其高度。\n\n```\nbackground-size: 150% 100%;\n```\n\
    \n单个值仅定义图像的宽度。高度随后会隐式设置为`auto`，从而保持图像的宽高比。\n\n```\nbackground-size: 150%;\n```\n\
    \n`contain`和`cover`关键字用于调整背景大小以填充父容器，同时保持宽高比。`cover`值确保图像完全覆盖背景定位区域，而`contain`则确保背景被包含在该区域内。它们之间的区别如图\
    \ 14-1 所示。\n\n![A978-1-4302-6491-0_14_Fig1_HTML.jpg](img/A978-1-4302-6491-0_14_Fig1_HTML.jpg)\n\
    \n图 14-1. 使用`cover`和`contain`关键字调整大小的背景\n\n此属性是在 CSS 3 中添加的，并在 Chrome 4+、Firefox\
    \ 4+、IE9+、Safari 5+ 和 Opera 10.5+ 中受支持。使用`-webkit`和`-moz`前缀可将支持扩展到 Chrome 1+、Safari\
    \ 3+ 和 Firefox 3.6+ 等版本。\n\n## background-clip\n\n背景图像或颜色的绘制区域可以通过`background-clip`属性设置。\n\
    \n```\nbackground-clip : border-box | padding-box | content-box\n```\n\n背景通常延伸到边框的外边缘（`border-box`），并渲染在任何可见边框的后面。值为`padding-box`则会将背景绘制在元素的内边距区域内。第三个可能的值`content-box`会将背景绘制在内容区域内。使用以下声明，背景将被裁剪到内容的外边缘：\n\
    \n```\nbackground-clip: content-box;\n```\n\n`background-clip`在 Chrome 1+、Firefox\
    \ 4+、IE9+、Safari 3+ 和 Opera 12+ 中受支持。\n"
- fmt: "## `background-origin`\n\n`background-origin`属性决定了背景图像或颜色的起始点。\n\n`background-origin\
    \ : padding-box | border-box | content-box`\n\n背景图像通常从元素内边距区域的左上角（`padding-box`）开始渲染。可以更改此行为，使背景从边框区域的左上角（`border-box`）或内容区域的左上角（`content-box`）开始。\n\
    \n`background-origin`属性通常与`background-clip`一起使用，以同时更改背景的起始点和裁剪区域。以下声明将两者都设置为内容区域：\n\
    \n`background-origin: content-box;`\n\n`background-clip: content-box;`\n\n`background-origin`属性是CSS\
    \ 3属性，适用于Chrome 4+、Firefox 4+、IE9+、Opera 10.5+和Safari 5+。如下一个示例所示，所有版本的Firefox和Chrome以及Safari\
    \ 4都支持带有`-moz`和`-webkit`前缀的写法。请注意，Firefox在版本4之前使用`padding`和`border`作为值；当时没有用于指定内容框作为起点的值。\n\
    \n```\n/* Chrome 1-3, Safari 4 */\n-webkit-background-origin: border-box;\n/*\
    \ Firefox 1-3.6 */\n-moz-background-origin: border;\nbackground-origin: border-box;\n\
    ```\n\n## `background`\n\n`background`属性是用于在单个声明中设置所有背景属性的简写形式。\n\n`background\
    \ : <background-color> + <background-image> + <background-repeat> + <background-attachment>\
    \ + <background-position> + <background-size> + <background-clip> + <background-origin>`\n\
    \n值的顺序无关紧要，因为它们之间没有歧义。可以省略任何一个值，但请记住，使用此属性时，省略的属性将被重置为默认值。\n\n`background: url(bg.png)\
    \ no-repeat fixed right bottom;`\n\n在大多数情况下，当设置多个单独属性时，优先使用诸如这样的简写属性。它比使用等效的长写属性性能更好，更易于维护，如下所示：\n\
    \n```\nbackground-image: url(bg.png);\nbackground-repeat: no-repeat;\nbackground-attachment:\
    \ fixed;\nbackground-position: right bottom;\n```\n\n## 多重背景\n\n通过以逗号分隔的列表指定属性值，可以将多个背景应用于同一元素。列表中的第一个背景显示在最上层，每个后续背景仅通过其上方堆叠背景的透明区域可见。\n\
    \n```\nbackground-image: url(bg1.png), url(bg2.png);\nbackground-repeat: no-repeat,\
    \ repeat-y;\nbackground-attachment: fixed, fixed;\nbackground-position: right\
    \ bottom, top left;\n```\n\n简写属性也可以与多重背景一起使用，方式如下：\n\n```\nbackground: url(bg1.png)\
    \ no-repeat fixed right bottom,\n            url(bg2.png) repeat-y fixed top left;\n\
    ```\n\n对多重背景的支持在CSS 3中引入，并已包含在Chrome 4+、Firefox 3.6+、IE9+、Safari 3.1+和Opera 10.5+浏览器中。可以为不支持多重背景的旧浏览器提供回退图像。\n\
    \n```\nbackground-image: bg.png; /* fallback */\nbackground-image: bg1.png, bg2.png;\n\
    ```\n\n# 15. 渐变\n\n渐变是一种颜色填充，可以从一种颜色平滑过渡到另一种颜色。渐变函数在CSS 3中引入，根据规范，可以在任何需要图像的地方使用，但它们主要与`background`或`background-image`属性一起使用，以创建背景渐变。\n\
    \n## 线性渐变\n\n`linear-gradient()`函数定义了一个从一种颜色平滑过渡到另一种颜色的渐变。\n\n`linear-gradient([<angle>\
    \ | to <side-or-corner>] {, <color stop> [stop position]} (2-`∞`) )`\n\n在其最简单的形式中，线性渐变由两种颜色组成，从上到下均匀分布。在图[15-1](#A978-1-4302-6491-0_15_Chapter.html#Fig1)中，渐变从灰色开始，在底部过渡为黑色。\n\
    \n```\n.mygradient {\n  background-image: linear-gradient(gray, black);\n}\n```\n\
    \n![A978-1-4302-6491-0_15_Fig1_HTML.jpg](A978-1-4302-6491-0_15_Fig1_HTML.jpg)\n\
    \n图15-1. 简单线性渐变\n\n渐变的角度可以通过使用关键字`to`后跟渐变的终点方向来设置：`top`、`right`、`bottom`、`left`或它们的任意组合。示例如图[15-2](#A978-1-4302-6491-0_15_Chapter.html#Fig2)所示。\n\
    \n```\nlinear-gradient(to bottom right, gray, black);\n```\n\n![A978-1-4302-6491-0_15_Fig2_HTML.jpg](A978-1-4302-6491-0_15_Fig2_HTML.jpg)\n\
    \n图15-2. 右下角线性渐变\n\n可以使用`deg`单位指定更精确的角度，其中`0deg`等同于`to top`。角度按顺时针方向递增，并允许负角度。\n\
    \n```\nlinear-gradient(0deg,   gray, black); /* to top */\nlinear-gradient(90deg,\
    \  gray, black); /* to right */\nlinear-gradient(180deg, gray, black); /* to bottom\
    \ */\nlinear-gradient(-90deg, gray, black); /* to left */\n```\n\n可以在起始颜色和结束颜色之间添加额外的颜色停止点。任何颜色停止点后都可以跟一个停止位置，指定为百分比或长度值。如果未指定停止位置，则颜色均匀分布。在以下情况下，白色设置为25%，而不是其默认位置50%。图[15-3](#A978-1-4302-6491-0_15_Chapter.html#Fig3)展示了此代码的结果。\n\
    \n```\nlinear-gradient(gray, white 25%, black);\n```\n\n![A978-1-4302-6491-0_15_Fig3_HTML.jpg](A978-1-4302-6491-0_15_Fig3_HTML.jpg)\n\
    \n图15-3. 具有多个颜色停止点的渐变\n\n到目前为止描述的标准语法支持Chrome 26+、Firefox 16+、IE10+、Safari 6.1+和Opera\
    \ 12.1+。遗留语法可以与`-moz`、`-webkit`和`-o`前缀一起使用，以将支持范围扩展到Firefox 3.6、Chrome 1、Safari\
    \ 4和Opera 11.1。\n\n```\n.linear-gradient\n{\n  background-color: red; /* fallback\
    \ color */\n  /* Chrome 1-9, Safari 4-5 */\n  background: -webkit-gradient(linear,\
    \ left top, right top, from(red), to(orange));\n  /* Chrome 10-25, Safari 5.1-6.1\
    \ */\n  background: -webkit-linear-gradient(left, red, orange);\n  /* Firefox\
    \ 3.6-15 */\n  background: -moz-linear-gradient(left, red, orange);\n  /* Opera\
    \ 11.1-12.1 */\n  background: -o-linear-gradient(left, red, orange);\n  /* Standard\
    \ syntax */\n  background: linear-gradient(to right, red, orange);\n}\n```"
  raw: '## background-origin


    The `background-origin` property determines the starting point of a background
    image or color.


    `background-origin : padding-box | border-box | content-box`


    A background image is ordinarily rendered starting from the top left of the element’s
    padding area (`padding-box`). It can be changed so that the background either
    starts at the top-left edge of the border area (`border-box`) or the content area
    (`content-box`).


    The `background-origin` property is often used together with `background-clip`
    to change both the starting point and clipping area of the background. The following
    declarations set both of them to the content area:


    `background-origin: content-box;`


    `background-clip: content-box;`


    The `background-origin` property is a CSS 3 property that works in Chrome 4+,
    Firefox 4+, IE9+, Opera 10.5+, and Safari 5+. All versions of Firefox and Chrome,
    along with Safari 4, are supported with the `-moz` and `-webkit` prefixes, as
    seen in the next example. Note that Firefox used the values `padding` and `border`
    prior to version 4; there were no values for specifying the content box as the
    origin.


    `/* Chrome 1-3, Safari 4 */`


    `-webkit-background-origin: border-box;`


    `/* Firefox 1-3.6 */`


    `-moz-background-origin: border;`


    `background-origin: border-box;`


    ## background


    The `background` property is a shortcut for setting all background properties
    in a single declaration.


    `background : <background-color> + <background-image> +`


                 `<background-repeat> + <background-attachment> +`


                 `<background-position> + <background-size> +`


                 `<background-clip> + <background-origin>`


    The order of the values is irrelevant because there is no ambiguity between them.
    Any one of the values can be left out, but keep in mind that those omitted properties
    are reset to their defaults when using this property.


    `background: url(bg.png) no-repeat fixed right bottom;`


    In most cases, it is preferable to use shorthand properties such as this one when
    setting more than one of the individual properties. It has better performance
    and is easier to maintain than using the equivalent longhand properties seen here:


    `background-image: url(bg.png);`


    `background-repeat: no-repeat;`


    `background-attachment: fixed;`


    `background-position: right bottom;`


    ## Multiple backgrounds


    More than one background can be applied to the same element by specifying the
    property values in a comma-separated list. The first background in the list appears
    at the top, and each successive background is visible only through transparent
    areas of the backgrounds stacked on top of it.


    `background-image: url(bg1.png), url(bg2.png);`


    `background-repeat: no-repeat, repeat-y;`


    `background-attachment: fixed, fixed;`


    `background-position: right bottom, top left;`


    The shorthand property can also be used with multiple backgrounds in the following
    way:


    `background: url(bg1.png) no-repeat fixed right bottom,`


                `url(bg2.png) repeat-y fixed top left;`


    Support for multiple backgrounds was added in CSS 3 and has been included in browsers
    since Chrome 4+, Firefox 3.6+, IE9+, Safari 3.1+, and Opera 10.5+. A fallback
    image can be provided for older browsers that do not support multiple backgrounds.


    `background-image: bg.png; /* fallback */`


    `background-image: bg1.png, bg2.png;`


    # 15. Gradients


    A gradient is a color fill that blends smoothly from one color to another. Introduced
    in CSS 3, the gradient functions can be used anywhere an image is required according
    to specification, but they are mainly used together with the `background` or `background-image`
    properties to create a background gradient.


    ## Linear gradients


    The `linear-gradient()` function defines a gradient that provides a smooth transition
    from one color to another.


    `linear-gradient([<angle> | to <side-or-corner>]`


    `{, <color stop> [stop position]} (2-`∞`) )`


    In its simplest form, the linear gradient consists of two colors with an even
    spread from top to bottom. In Figure [15-1](#A978-1-4302-6491-0_15_Chapter.html#Fig1),
    the gradient starts as gray and transitions into black at the bottom.


    `.mygradient {`


      `background-image: linear-gradient(gray, black);`


    `}`


    ![A978-1-4302-6491-0_15_Fig1_HTML.jpg](A978-1-4302-6491-0_15_Fig1_HTML.jpg)


    Figure 15-1.


    Simple linear gradient


    The angle for the gradient can be set by using the keyword `to`, followed by the
    destination in which the gradient will end: `top`, `right`, `bottom`, `left`,
    or any combination thereof. An example is shown in Figure [15-2](#A978-1-4302-6491-0_15_Chapter.html#Fig2).


    `linear-gradient(to bottom right, gray, black);`


    ![A978-1-4302-6491-0_15_Fig2_HTML.jpg](A978-1-4302-6491-0_15_Fig2_HTML.jpg)


    Figure 15-2.


    Bottom-right linear gradient


    More-precise angles can be specified by using the `deg` unit, with 0 `deg` being
    the same as `to top`. The degrees proceed clockwise, and negative angles are allowed.


    `linear-gradient(0deg,   gray, black); /* to top */`


    `linear-gradient(90deg,  gray, black); /* to right */`


    `linear-gradient(180deg, gray, black); /* to bottom */`


    `linear-gradient(-90deg, gray, black); /* to left */`


    Additional color stops can be added between the starting and ending colors. Any
    color stop can be followed by a stop position specified as either a percentage
    or a length value. If no stop position is specified, the colors are evenly distributed.
    In the following case, white is set at 25 percent, instead of its default position
    of 50 percent. Figure [15-3](#A978-1-4302-6491-0_15_Chapter.html#Fig3) illustrates
    the result of this code.


    `linear-gradient(gray, white 25%, black);`


    ![A978-1-4302-6491-0_15_Fig3_HTML.jpg](A978-1-4302-6491-0_15_Fig3_HTML.jpg)


    Figure 15-3.


    Gradient with multiple color stops


    The standard syntax described so far is supported in Chrome 26+, Firefox 16+,
    IE10+, Safari 6.1+, and Opera 12.1+. Legacy syntaxes can be used together with
    the `-moz`, `-webkit`, and `-o` prefixes to expand support down to Firefox 3.6,
    Chrome 1, Safari 4, and Opera 11.1.


    `.linear-gradient`


    `{`


      `background-color: red; /* fallback color */`


      `/* Chrome 1-9, Safari 4-5 */`


      `background: -webkit-gradient(linear, left top, right top, from(red), to(orange));`


      `/* Chrome 10-25, Safari 5.1-6.1 */`


      `background: -webkit-linear-gradient(left, red, orange);`


      `/* Firefox 3.6-15 */`


      `background: -moz-linear-gradient(left, red, orange);`


      `/* Opera 11.1-12.1 */`


      `background: -o-linear-gradient(left, red, orange);`


      `/* Standard syntax */`


      `background: linear-gradient(to right, red, orange);`


    `}`'
