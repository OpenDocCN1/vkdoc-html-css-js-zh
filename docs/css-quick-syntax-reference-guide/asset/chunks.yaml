- fmt: '# Radial gradients


    A radial gradient transitions outward from a central point. In CSS, these gradients
    are defined with the `radial-gradient()` function.


    `radial-gradient([<shape> + <size>] [at <position>]` `{, <color stop> [stop position]}
    {2-`∞`} )`


    To create a radial gradient, at least two color stops must be defined. The radial
    gradient in Figure 15-4 starts as gray in the center and fades to black.


    `radial-gradient(gray, black);`


    ![A978-1-4302-6491-0_15_Fig4_HTML.jpg](A978-1-4302-6491-0_15_Fig4_HTML.jpg)


    Figure 15-4. Simple radial gradient


    Like `linear-gradient()`, more than two color stops are allowed and they can optionally
    be followed by a length or percentage value, indicating the stop position of the
    color. An example is shown in Figure 15-5.


    `radial-gradient(black 25%, white, black 75%);`


    ![A978-1-4302-6491-0_15_Fig5_HTML.jpg](A978-1-4302-6491-0_15_Fig5_HTML.jpg)


    Figure 15-5. Radial gradient with set stop positions


    The shape of the radial gradient can be either an `ellipse` or a `circle`. The
    default shape is `ellipse`, which allows the gradient to spread itself to match
    both the height and width of the element, as shown in Figure 15-5. The alternative
    `circle` value, illustrated in Figure 15-6, forces the gradient to be circular,
    regardless of the shape of the element.


    `radial-gradient(circle, black 25%, white, black 75%);`


    ![A978-1-4302-6491-0_15_Fig6_HTML.jpg](A978-1-4302-6491-0_15_Fig6_HTML.jpg)


    Figure 15-6. Circular radial gradient


    Two length values for the ellipsis or a single value for the circle can be used
    to set the horizontal and vertical radius of the gradient. For the ellipsis, they
    can also be percentage values that are relative to the dimensions of the element,
    as in the example shown in Figure 15-7.


    `radial-gradient(75% 25%, gray, black);`


    ![A978-1-4302-6491-0_15_Fig7_HTML.jpg](A978-1-4302-6491-0_15_Fig7_HTML.jpg)


    Figure 15-7. Resized radial gradient


    If less precision is needed, the size can be set by using one of the predefined
    keywords: `closest-side`, `closest-corner`, `farthest-side`, or `farthest-corner`.
    These values specify whether the gradient is contained by the sides or corners
    of the element nearest to or farthest away from the origin (see Figure 15-8).
    For example, the `farthest-side` value sizes the gradient so that its last color
    ends at the farthest side of the element away from its origin.


    `radial-gradient(farthest-side, gray, black);`


    ![A978-1-4302-6491-0_15_Fig8_HTML.jpg](A978-1-4302-6491-0_15_Fig8_HTML.jpg)


    Figure 15-8. Size keywords


    The origin of a radial gradient is centered by default. It can be changed by specifying
    the position of the gradient’s origin with the keyword `at` followed by a position
    specified in the same way as for the `background-position` property. The horizontal
    position is specified first, optionally followed by the vertical position. The
    position can be set with keywords (`left`, `center`, `right + top`, `center`,
    and `bottom`), length values, percentage values, or a combination thereof. An
    example is given in Figure 15-9, in which the gradient origin is moved to the
    bottom right of the element.


    `radial-gradient(at right bottom, gray, black);`


    ![A978-1-4302-6491-0_15_Fig9_HTML.jpg](A978-1-4302-6491-0_15_Fig9_HTML.jpg)


    Figure 15-9. Bottom-right origin


    Support for the `radial-gradient()` function is largely the same as for `linear-gradient()`
    when used together with the `-moz`, `-webkit`, and `-o` vendor prefixes. Like
    `linear-gradient()`, the syntax for the radial gradient has gone through some
    revisions. An example of a full cross-browser syntax is shown here:


    ```

    .radial-gradient

    {

    background-color: red; /* fallback color */

    /* Chrome 1-9, Safari 4-5 */

    background: -webkit-gradient(radial, center center, 0px, center center, 100%,
    color-stop(0%,red), color-stop(100%,orange));

    /* Chrome 10-25, Safari 5.1-6.1 */

    background: -webkit-radial-gradient(center, ellipse cover, red 0%, orange 100%);

    /* Firefox 3.6-16 */

    background: -moz-radial-gradient(center, ellipse cover, red 0%, orange 100%);

    /* Opera 11.6-12.1 */

    background: -o-radial-gradient(center, ellipse cover, red 0%, orange 100%);

    /* Standard syntax */

    background: radial-gradient(ellipse at center, red 0%, orange 100%);

    }

    ```


    # Repeating gradients


    Linear and radial gradients do not allow gradient patterns to repeat because they
    naturally stretch to fill the element on which they are defined. Two additional
    functions are used for creating repeating gradients: `repeating-linear-gradient()`
    and `repeating-radial-gradient()`.


    For the purpose of repeating a linear gradient, the `repeating-linear-gradient()`
    function is used. The arguments for this function are the same as for `linear-gradient()`.


    `repeating-linear-gradient([<angle> | to <side-or-corner>]` `{, <color stop> [stop
    position]} (2-`∞`) )`


    A repeating linear gradient repeats the color stops infinitely. The size of the
    gradient is determined by the final color stop. To avoid sharp transitions, the
    starting color in Figure 15-10 is repeated at the end.


    `repeating-linear-gradient(-45deg, white 0, black 10%, white 20%);`


    ![A978-1-4302-6491-0_15_Fig10_HTML.jpg](A978-1-4302-6491-0_15_Fig10_HTML.jpg)


    Figure 15-10. Repeating linear gradient


    The repeating function for the radial gradient also shares the same syntax as
    the nonrepeating version. The example shown in Figure 15-11 illustrates the repeating
    function. Note that this gradient has sharp color transitions in contrast with
    the previous example.


    `repeating-radial-gradient(black, black 5%, white 5%, white 10%)`


    ![A978-1-4302-6491-0_15_Fig11_HTML.jpg](A978-1-4302-6491-0_15_Fig11_HTML.jpg)


    Figure 15-11. Repeating radial gradient


    The syntax for defining gradients is notably more complex than many other CSS
    features. For this reason, it can be preferable to use an online tool to graphically
    design the desired gradient. One such tool can be found on `Colorzilla.com`.[¹](#A978-1-4302-6491-0_15_Chapter.html#Fn1)
    In addition to the standard compliant gradient code, it also provides the prefixed
    versions necessary for maximum browser compatibility.


    Footnotes [1](#A978-1-4302-6491-0_15_Chapter.html#Fn1_source)


    `http://www.colorzilla.com/gradient-editor`


    # 16. Box model


    The so-called box model of CSS describes the space that is taken up by an HTML
    element. In this model, each element consists of four boxes: content, padding,
    border, and margin, as illustrated in Figure 16-1.


    ![A978-1-4302-6491-0_16_Fig1_HTML.jpg](A978-1-4302-6491-0_16_Fig1_HTML.jpg)


    Figure 16-1. CSS box model


    Each of the three boxes surrounding the content can have different sizes on the
    top, right, bottom, and left of the element. Any or all of these sizes can also
    be set to zero.'
  raw: '## Radial gradients


    A radial gradient transitions outward from a central point. In CSS, these gradients
    are defined with the `radial-gradient()` function.


    `radial-gradient([<shape> + <size>] [at <position>]`


    `{, <color stop> [stop position]} {2-`∞`} )`


    To create a radial gradient, at least two color stops must be defined. The radial
    gradient in Figure [15-4](#A978-1-4302-6491-0_15_Chapter.html#Fig4) starts as
    gray in the center and fades to black.


    `radial-gradient(gray, black);`


    ![A978-1-4302-6491-0_15_Fig4_HTML.jpg](A978-1-4302-6491-0_15_Fig4_HTML.jpg)


    Figure 15-4.


    Simple radial gradient


    Like `linear-gradient()`, more than two color stops are allowed and they can optionally
    be followed by a length or percentage value, indicating the stop position of the
    color. An example is shown in Figure [15-5](#A978-1-4302-6491-0_15_Chapter.html#Fig5).


    `radial-gradient(black 25%, white, black 75%);`


    ![A978-1-4302-6491-0_15_Fig5_HTML.jpg](A978-1-4302-6491-0_15_Fig5_HTML.jpg)


    Figure 15-5.


    Radial gradient with set stop positions


    The shape of the radial gradient can be either an `ellipse` or a `circle`. The
    default shape is `ellipsis`, which allows the gradient to spread itself to match
    both the height and width of the element, as shown in Figure [15-5](#A978-1-4302-6491-0_15_Chapter.html#Fig5).
    The alternative `circle` value, illustrated in Figure [15-6](#A978-1-4302-6491-0_15_Chapter.html#Fig6),
    forces the gradient to be circular, regardless of the shape of the element.


    `radial-gradient(circle, black 25%, white, black 75%);`


    ![A978-1-4302-6491-0_15_Fig6_HTML.jpg](A978-1-4302-6491-0_15_Fig6_HTML.jpg)


    Figure 15-6.


    Circular radial gradient


    Two length values for the ellipsis or a single value for the circle can be used
    to set the horizontal and vertical radius of the gradient. For the ellipsis, they
    can also be percentage values that are relative to the dimensions of the element,
    as in the example shown in Figure [15-7](#A978-1-4302-6491-0_15_Chapter.html#Fig7).


    `radial-gradient(75% 25%, gray, black);`


    ![A978-1-4302-6491-0_15_Fig7_HTML.jpg](A978-1-4302-6491-0_15_Fig7_HTML.jpg)


    Figure 15-7.


    Resized radial gradient


    If less precision is needed, the size can be set by using one of the predefined
    keywords: `closest-side`, `closest-corner`, `farthest-side`, or `farthest-corner`.
    These values specify whether the gradient is contained by the sides or corners
    of the element nearest to or farthest away from the origin (see Figure [15-8](#A978-1-4302-6491-0_15_Chapter.html#Fig8)).
    For example, the `farthest-side` value sizes the gradient so that its last color
    ends at the farthest side of the element away from its origin.


    `radial-gradient(farthest-side, gray, black);`


    ![A978-1-4302-6491-0_15_Fig8_HTML.jpg](A978-1-4302-6491-0_15_Fig8_HTML.jpg)


    Figure 15-8.


    Size keywords


    The origin of a radial gradient is centered by default. It can be changed by specifying
    the position of the gradient’s origin with the keyword `at` followed by a position
    specified in the same way as for the `background-position` property. The horizontal
    position is specified first, optionally followed by the vertical position. The
    position can be set with keywords (`left`, `center`, `right + top`, `center`,
    and `bottom`), length values, percentage values, or a combination thereof. An
    example is given in Figure [15-9](#A978-1-4302-6491-0_15_Chapter.html#Fig9), in
    which the gradient origin is moved to the bottom right of the element.


    `radial-gradient(at right bottom, gray, black);`


    ![A978-1-4302-6491-0_15_Fig9_HTML.jpg](A978-1-4302-6491-0_15_Fig9_HTML.jpg)


    Figure 15-9.


    Bottom-right origin


    Support for the `radial-gradient()` function is largely the same as for `linear-gradient()`
    when used together with the `-moz`, `-webkit`, and `-o` vendor prefixes. Like
    `linear-gradient()`, the syntax for the radial gradient has gone through some
    revisions. An example of a full cross-browser syntax is shown here:


    `.radial-gradient`


    `{`


    `background-color: red; /* fallback color */`


    `/* Chrome 1-9, Safari 4-5 */`


    `background: -webkit-gradient(radial, center center, 0px, center center, 100%,
    color-stop(0%,red), color-stop(100%,orange));`


    `/* Chrome 10-25, Safari 5.1-6.1 */`


    `background: -webkit-radial-gradient(center, ellipse cover, red 0%, orange 100%);`


    `/* Firefox 3.6-16 */`


    `background: -moz-radial-gradient(center, ellipse cover, red 0%, orange 100%);`


    `/* Opera 11.6-12.1 */`


    `background: -o-radial-gradient(center, ellipse cover, red 0%, orange 100%);`


    `/* Standard syntax */`


    `background: radial-gradient(ellipse at center, red 0%, orange 100%);`


    `}`


    ## Repeating gradients


    Linear and radial gradients do not allow gradient patterns to repeat because they
    naturally stretch to fill the element on which they are defined. Two additional
    functions are used for creating repeating gradients: `repeating-linear-gradient()`
    and `repeating-radial-gradient()`.


    For the purpose of repeating a linear gradient, the `repeating-linear-gradient()`
    function is used. The arguments for this function are the same as for `linear-gradient()`.


    `repeating-linear-gradient([<angle> | to <side-or-corner>]`


                              `{, <color stop> [stop position]} (2-`∞`) )`


    A repeating linear gradient repeats the color stops infinitely. The size of the
    gradient is determined by the final color stop. To avoid sharp transitions, the
    starting color in Figure [15-10](#A978-1-4302-6491-0_15_Chapter.html#Fig10) is
    repeated at the end.


    `repeating-linear-gradient(-45deg, white 0, black 10%, white 20%);`


    ![A978-1-4302-6491-0_15_Fig10_HTML.jpg](A978-1-4302-6491-0_15_Fig10_HTML.jpg)


    Figure 15-10.


    Repeating linear gradient


    The repeating function for the radial gradient also shares the same syntax as
    the nonrepeating version. The example shown in Figure [15-11](#A978-1-4302-6491-0_15_Chapter.html#Fig11)
    illustrates the repeating function. Note that this gradient has sharp color transitions
    in contrast with the previous example.


    `repeating-radial-gradient(black, black 5%, white 5%, white 10%)`


    ![A978-1-4302-6491-0_15_Fig11_HTML.jpg](A978-1-4302-6491-0_15_Fig11_HTML.jpg)


    Figure 15-11.


    Repeating radial gradient


    The syntax for defining gradients is notably more complex than many other CSS
    features. For this reason, it can be preferable to use an online tool to graphically
    design the desired gradient. One such tool can be found on `Colorzilla.com`.[¹](#A978-1-4302-6491-0_15_Chapter.html#Fn1)
    In addition to the standard compliant gradient code, it also provides the prefixed
    versions necessary for maximum browser compatibility.


    Footnotes [1](#A978-1-4302-6491-0_15_Chapter.html#Fn1_source)


    `http://www.colorzilla.com/gradient-editor`


    # 16. Box model


    The so-called box model of CSS describes the space that is taken up by an HTML
    element. In this model, each element consists of four boxes: content, padding,
    border, and margin, as illustrated in Figure [16-1](#A978-1-4302-6491-0_16_Chapter.html#Fig1).


    ![A978-1-4302-6491-0_16_Fig1_HTML.jpg](A978-1-4302-6491-0_16_Fig1_HTML.jpg)


    Figure 16-1.


    CSS box model


    Each of the three boxes surrounding the content can have different sizes on the
    top, right, bottom, and left of the element. Any or all of these sizes can also
    be set to zero.'
  trans: '

    # 径向渐变


    径向渐变是从中心点向外过渡的渐变。在 CSS 中，这类渐变使用 `radial-gradient()` 函数定义。


    `radial-gradient([<形状> + <尺寸>] [at <位置>]` `{, <色标> [停止位置]} {2-`∞`} )`


    要创建径向渐变，至少必须定义两个色标。图 15-4 中的径向渐变从中心的灰色开始，逐渐过渡到黑色。


    `radial-gradient(gray, black);`


    ![A978-1-4302-6491-0_15_Fig4_HTML.jpg](img/A978-1-4302-6491-0_15_Fig4_HTML.jpg)


    图 15-4. 简单的径向渐变


    与 `linear-gradient()` 一样，允许使用两个以上的色标，并且它们后面可以跟随一个长度或百分比值，用于指示颜色的停止位置。示例如图 15-5
    所示。


    `radial-gradient(black 25%, white, black 75%);`


    ![A978-1-4302-6491-0_15_Fig5_HTML.jpg](img/A978-1-4302-6491-0_15_Fig5_HTML.jpg)


    图 15-5. 设置了停止位置的径向渐变


    径向渐变的形状可以是 `ellipse`（椭圆）或 `circle`（圆形）。默认形状是 `ellipse`，它允许渐变自动扩展以匹配元素的高度和宽度，如图
    15-5 所示。另一种 `circle` 值（如图 15-6 所示）则强制渐变呈圆形，无论元素的形状如何。


    `radial-gradient(circle, black 25%, white, black 75%);`


    ![A978-1-4302-6491-0_15_Fig6_HTML.jpg](img/A978-1-4302-6491-0_15_Fig6_HTML.jpg)


    图 15-6. 圆形径向渐变


    对于椭圆，可以使用两个长度值；对于圆形，则使用一个值，来设置渐变的水平半径和垂直半径。对于椭圆，它们也可以是相对于元素尺寸的百分比值，如图 15-7 所示。


    `radial-gradient(75% 25%, gray, black);`


    ![A978-1-4302-6491-0_15_Fig7_HTML.jpg](img/A978-1-4302-6491-0_15_Fig7_HTML.jpg)


    图 15-7. 调整尺寸后的径向渐变


    如果不需要如此精确，可以使用以下预定义的关键字来设置尺寸：`closest-side`、`closest-corner`、`farthest-side` 或
    `farthest-corner`。这些值指定渐变是受限于距离原点最近还是最远的元素边或角（见图 15-8）。例如，`farthest-side` 值会调整渐变尺寸，使其最后一个颜色结束于元素距离原点最远的那一侧。


    `radial-gradient(farthest-side, gray, black);`


    ![A978-1-4302-6491-0_15_Fig8_HTML.jpg](img/A978-1-4302-6491-0_15_Fig8_HTML.jpg)


    图 15-8. 尺寸关键字


    径向渐变的原点默认位于中心。可以通过在关键字 `at` 后指定渐变原点的位置来改变它，其位置指定方式与 `background-position` 属性相同。先指定水平位置，可选地后接垂直位置。位置可以使用关键字（`left`、`center`、`right
    + top`、`center` 和 `bottom`）、长度值、百分比值或其组合来设置。图 15-9 给出了一个示例，其中渐变原点被移到了元素的右下角。


    `radial-gradient(at right bottom, gray, black);`


    ![A978-1-4302-6491-0_15_Fig9_HTML.jpg](img/A978-1-4302-6491-0_15_Fig9_HTML.jpg)


    图 15-9. 右下角原点


    当 `radial-gradient()` 函数与 `-moz`、`-webkit` 和 `-o` 等浏览器厂商前缀一起使用时，其对浏览器的支持情况与 `linear-gradient()`
    大致相同。与 `linear-gradient()` 一样，径向渐变的语法也经历了一些修订。以下是跨浏览器完整语法的示例：


    ```

    .radial-gradient

    {

    background-color: red; /* 备用颜色 */

    /* Chrome 1-9, Safari 4-5 */

    background: -webkit-gradient(radial, center center, 0px, center center, 100%,
    color-stop(0%,red), color-stop(100%,orange));

    /* Chrome 10-25, Safari 5.1-6.1 */

    background: -webkit-radial-gradient(center, ellipse cover, red 0%, orange 100%);

    /* Firefox 3.6-16 */

    background: -moz-radial-gradient(center, ellipse cover, red 0%, orange 100%);

    /* Opera 11.6-12.1 */

    background: -o-radial-gradient(center, ellipse cover, red 0%, orange 100%);

    /* 标准语法 */

    background: radial-gradient(ellipse at center, red 0%, orange 100%);

    }

    ```


    # 重复渐变


    线性渐变和径向渐变本身不会重复渐变图案，因为它们会自然地拉伸以填充定义它们的元素。有两个额外的函数用于创建重复渐变：`repeating-linear-gradient()`
    和 `repeating-radial-gradient()`。


    为了实现线性渐变的重复，使用 `repeating-linear-gradient()` 函数。此函数的参数与 `linear-gradient()` 相同。


    `repeating-linear-gradient([<角度> | to <边或角>]` `{, <色标> [停止位置]} (2-`∞`) )`


    重复线性渐变会无限重复色标。渐变的大小由最后一个色标决定。为避免生硬的过渡，图 15-10 中的起始颜色在末尾处被重复了一次。


    `repeating-linear-gradient(-45deg, white 0, black 10%, white 20%);`


    ![A978-1-4302-6491-0_15_Fig10_HTML.jpg](img/A978-1-4302-6491-0_15_Fig10_HTML.jpg)


    图 15-10. 重复线性渐变


    径向渐变的重复函数也与非重复版本共享相同的语法。图 15-11 所示的示例演示了重复函数。请注意，与之前的示例相比，此渐变具有锐利的颜色过渡。


    `repeating-radial-gradient(black, black 5%, white 5%, white 10%)`


    ![A978-1-4302-6491-0_15_Fig11_HTML.jpg](img/A978-1-4302-6491-0_15_Fig11_HTML.jpg)


    图 15-11. 重复径向渐变


    定义渐变的语法明显比许多其他 CSS 特性更复杂。因此，使用在线工具以图形方式设计所需的渐变通常是更好的选择。可以在 `Colorzilla.com` 上找到这样的工具。¹
    除了符合标准规范的渐变代码外，它还提供了实现最大浏览器兼容性所必需的带有厂商前缀的版本。


    脚注 1


    `http://www.colorzilla.com/gradient-editor`


    # 16. 盒模型


    所谓的 CSS 盒模型描述了一个 HTML 元素所占用的空间。在这个模型中，每个元素由四个盒子组成：内容（content）、内边距（padding）、边框（border）和外边距（margin），如图
    16-1 所示。


    ![A978-1-4302-6491-0_16_Fig1_HTML.jpg](img/A978-1-4302-6491-0_16_Fig1_HTML.jpg)


    图 16-1. CSS 盒模型


    围绕内容的三个盒子（内边距、边框、外边距）在元素的顶部、右侧、底部和左侧可以有不同的尺寸。这些尺寸中的任意一个或全部也可以设置为零。

    '
- fmt: "# Inline and block\n\nHTML has two primary categories of elements: block and\
    \ inline. The box model applies differently to these two kinds of elements, so\
    \ it is important to know the difference between them. Examples of inline elements\
    \ include `<a>`, `<strong>` and `<em>`, while `<p>`, `<h1>`, and `<form>` are\
    \ block elements.\n\nInline elements flow along with text content and are split\
    \ as necessary to fit the width of their container. They may not contain block\
    \ elements, with the exception of the `<a>` element, which can wrap any type of\
    \ element.\n\nBlock elements can contain both block and inline elements (see Figure\
    \ [16-2](#A978-1-4302-6491-0_16_Chapter.html#Fig2)). They break the flow of text\
    \ by creating a virtual box around themselves that expand horizontally, making\
    \ it appear as if there are line breaks before and after each block element. Because\
    \ of these properties, block elements are also referred to as boxes or containers.\n\
    \n![A978-1-4302-6491-0_16_Fig2_HTML.jpg](A978-1-4302-6491-0_16_Fig2_HTML.jpg)\n\
    \nFigure 16-2.\n\nBlock and inline elements\n\nThe boxes surrounding inline and\
    \ block elements have different features. A block element can manipulate all properties\
    \ in the box model, including the width and height of the content area, as well\
    \ as the border, padding, and margin. If no width is set, a block element expands\
    \ horizontally to the maximum allowed by the containing element.\n\nAn inline\
    \ element is more limited in that it cannot set the vertical margins (top or bottom).\
    \ It also cannot change the width or height of its inline box. For an inline element,\
    \ the minimum height can be set with the `line-height` property, but the width\
    \ and height adjust automatically to fit the content that the element holds.\n\
    \nThere is a subcategory of inline elements, called replaced inline elements,\
    \ that use external objects such as `<img>`, `<video>`, and `<object>`; and form\
    \ elements such as `<input>` and `<textarea>`. With these inline elements, all\
    \ box properties can be manipulated the same way as block elements.\n\n## Span\
    \ and div\n\nUsing the `<span>` and `<div>` elements is a generic way of adding\
    \ structure to a web document. These elements have no styles associated with them,\
    \ which makes them especially well-suited to work with class and id selectors.\
    \ The difference between the two is that `<span>` is an inline element whereas\
    \ `<div>` is a block element.\n\n`<span>Inline</span>`\n\n`<div>Block</div>`\n\
    \nAs an inline element, `<span>` is mainly used to add styling to sections of\
    \ text. It cannot be used for styling block elements because such elements are\
    \ not allowed inside of inline elements according to the HTML specification.\n\
    \n`<span style=\"color: red;\">Red text</span>`\n\nIn contrast, `<div>` is used\
    \ to create styled containers for other block and inline elements. These custom\
    \ containers are often what make up the layout of a web page. Because it is a\
    \ block element, `<div>` allows all the element’s box attributes to be manipulated\
    \ (width, height, padding, border, and margin).\n\n`<div class=\"a\">`\n\n  `<div\
    \ class=\"b\">Block within a block</div>`\n\n`</div>`\n\n# 17. Border\n\nThe border\
    \ properties are used to format the border around elements. They can be applied\
    \ to any element and they do not inherit.\n\n## border-style\n\nTo make the border\
    \ visible around an element, the `border-style` property has to be set to a value\
    \ other than `none`, which is the default value.\n\n`border-style (1-4) | border-top-style\
    \ |`\n\n`border-right-style | border-bottom-style |`\n\n`border-left-style :`\n\
    \n  `none | dashed | dotted | double | groove |`\n\n  `hidden | inset | outset\
    \ | ridge | solid`\n\nThe solid border style is the one most commonly used, but\
    \ there are several other options for displaying a border, as seen in Figure [17-1](#A978-1-4302-6491-0_17_Chapter.html#Fig1).\
    \ The `hidden` value removes the border and is synonymous with `none`, except\
    \ that it also hides shared borders in tables with collapsed borders.\n\n![A978-1-4302-6491-0_17_Fig1_HTML.jpg](A978-1-4302-6491-0_17_Fig1_HTML.jpg)\n\
    \nFigure 17-1.\n\nborder-style appearances\n\nThe `border-style` property is one\
    \ of several properties that can be set with one to four values. When fewer than\
    \ four values are specified, the `border-style` value is duplicated, as shown\
    \ in Figure [17-2](#A978-1-4302-6491-0_17_Chapter.html#Fig2).\n\n![A978-1-4302-6491-0_17_Fig2_HTML.jpg](A978-1-4302-6491-0_17_Fig2_HTML.jpg)\n\
    \nFigure 17-2.\n\n1-to-4-value syntax explained\n\nGiven these rules, the following\
    \ declarations are synonymous and display a solid border on the top and bottom\
    \ of an element:\n\n`border-style: solid none solid none;`\n\n`border-style: solid\
    \ none solid;`\n\n`border-style: solid none;`\n\nTo render all border sides in\
    \ the same style, only a single style value needs to be specified.\n\n`border-style:\
    \ solid;`\n\nThe `border-style` property has four subproperties that can also\
    \ be used to target each border side’s style.\n\n`border-top-style:    dotted;`\n\
    \n`border-right-style:  dashed;`\n\n`border-bottom-style: ridge;`\n\n`border-left-style:\
    \   inset;`\n\n## border-width\n\nThe `border-width` property, which controls\
    \ the width of borders, can be set with a unit of length or with one of the predefined\
    \ values: `thin`, `medium`, or `thick`. The initial value is `medium`, which is\
    \ typically rendered as 3 pixels.\n\n`border-width (1-4) | border-top-width |`\n\
    \n`border-right-width | border-bottom-width |`\n\n`border-left-width :`\n\n  `<length>\
    \ | thin | medium | thick`\n\nAs with `border-style`, this property can have one\
    \ to four values and has four subproperties for setting the individual borders’\
    \ width.\n\n```\n/* Shortcut property */\nborder-width: thin medium;\n\n/* Full-length\
    \ properties */\nborder-top-width:    thin;\nborder-right-width:  medium;\nborder-bottom-width:\
    \ thin;\nborder-left-width:   medium;\n```\n\nA width of zero means that no border\
    \ is displayed. This value has the same effect as setting the style of the border\
    \ to `none`.\n\n## border-color\n\n`border-color` sets the color of the border.\
    \ CSS does not specify what the default border color should be, but most browsers\
    \ render it gray. This property can have from one to four values and has four\
    \ subproperties for setting the individual borders’ color.\n\n`border-color (1-4)\
    \ | border-top-color |`\n\n`border-right-color | border-bottom-color |`\n\n`border-left-color\
    \ :`\n\n  `<color> | transparent`\n\nSetting the color to transparent makes the\
    \ border invisible without changing the layout.\n\n`border-color: transparent;`\n\
    \n## border\n\nThe `border` property can set the width, style and color border\
    \ properties in a single declaration. It is the most commonly used property for\
    \ controlling the border.\n\n`border | border-top | border-right |`\n\n`border-bottom\
    \ | border-left :`\n\n  `<border-width> + <border-style> + <border-color>`\n\n\
    The values can be set in any order because there is no ambiguity between them.\
    \ Either one of the values can also be omitted.\n\n`border: 1px solid black;`\n\
    \nThe `border` property has four subproperties for specifying the border settings\
    \ for each of the four sides.\n\n`border-top:    1px solid red;`\n\n`border-right:\
    \  1px solid blue;`\n\n`border-bottom: 1px solid aqua;`\n\n`border-left:   1px\
    \ solid lime;`"
  raw: '## Inline and block


    HTML has two primary categories of elements: block and inline. The box model applies
    differently to these two kinds of elements, so it is important to know the difference
    between them. Examples of inline elements include `<a>`, `<strong>` and `<em>`,
    while `<p>`, `<h1>`, and `<form>` are block elements.


    Inline elements flow along with text content and are split as necessary to fit
    the width of their container. They may not contain block elements, with the exception
    of the `<a>` element, which can wrap any type of element.


    Block elements can contain both block and inline elements (see Figure [16-2](#A978-1-4302-6491-0_16_Chapter.html#Fig2)).
    They break the flow of text by creating a virtual box around themselves that expand
    horizontally, making it appear as if there are line breaks before and after each
    block element. Because of these properties, block elements are also referred to
    as boxes or containers.


    ![A978-1-4302-6491-0_16_Fig2_HTML.jpg](A978-1-4302-6491-0_16_Fig2_HTML.jpg)


    Figure 16-2.


    Block and inline elements


    The boxes surrounding inline and block elements have different features. A block
    element can manipulate all properties in the box model, including the width and
    height of the content area, as well as the border, padding, and margin. If no
    width is set, a block element expands horizontally to the maximum allowed by the
    containing element.


    An inline element is more limited in that it cannot set the vertical margins (top
    or bottom). It also cannot change the width or height of its inline box. For an
    inline element, the minimum height can be set with the `line-height` property,
    but the width and height adjust automatically to fit the content that the element
    holds.


    There is a subcategory of inline elements, called replaced inline elements, that
    use external objects such as `<img>`, `<video>`, and `<object>`; and form elements
    such as `<input>` and `<textarea>`. With these inline elements, all box properties
    can be manipulated the same way as block elements.


    ## Span and div


    Using the `<span>` and `<div>` elements is a generic way of adding structure to
    a web document. These elements have no styles associated with them, which makes
    them especially well-suited to work with class and id selectors. The difference
    between the two is that `<span>` is an inline element whereas `<div>` is a block
    element.


    `<span>Inline</span>`


    `<div>Block</div>`


    As an inline element, `<span>` is mainly used to add styling to sections of text.
    It cannot be used for styling block elements because such elements are not allowed
    inside of inline elements according to the HTML specification.


    `<span style="color: red;">Red text</span>`


    In contrast, `<div>` is used to create styled containers for other block and inline
    elements. These custom containers are often what make up the layout of a web page.
    Because it is a block element, `<div>` allows all the element’s box attributes
    to be manipulated (width, height, padding, border, and margin).


    `<div class="a">`


      `<div class="b">Block within a block</div>`


    `</div>`


    # 17. Border


    The border properties are used to format the border around elements. They can
    be applied to any element and they do not inherit.


    ## border-style


    To make the border visible around an element, the `border-style` property has
    to be set to a value other than `none`, which is the default value.


    `border-style (1-4) | border-top-style |`


    `border-right-style | border-bottom-style |`


    `border-left-style :`


      `none | dashed | dotted | double | groove |`


      `hidden | inset | outset | ridge | solid`


    The solid border style is the one most commonly used, but there are several other
    options for displaying a border, as seen in Figure [17-1](#A978-1-4302-6491-0_17_Chapter.html#Fig1).
    The `hidden` value removes the border and is synonymous with `none`, except that
    it also hides shared borders in tables with collapsed borders.


    ![A978-1-4302-6491-0_17_Fig1_HTML.jpg](A978-1-4302-6491-0_17_Fig1_HTML.jpg)


    Figure 17-1.


    border-style appearances


    The `border-style` property is one of several properties that can be set with
    one to four values. When fewer than four values are specified, the `border-style`
    value is duplicated, as shown in Figure [17-2](#A978-1-4302-6491-0_17_Chapter.html#Fig2).


    ![A978-1-4302-6491-0_17_Fig2_HTML.jpg](A978-1-4302-6491-0_17_Fig2_HTML.jpg)


    Figure 17-2.


    1-to-4-value syntax explained


    Given these rules, the following declarations are synonymous and display a solid
    border on the top and bottom of an element:


    `border-style: solid none solid none;`


    `border-style: solid none solid;`


    `border-style: solid none;`


    To render all border sides in the same style, only a single style value needs
    to be specified.


    `border-style: solid;`


    The `border-style` property has four subproperties that can also be used to target
    each border side’s style.


    `border-top-style:    dotted;`


    `border-right-style:  dashed;`


    `border-bottom-style: ridge;`


    `border-left-style:   inset;`


    ## border-width


    The `border-width` property, which controls the width of borders, can be set with
    a unit of length or with one of the predefined values: `thin`, `medium`, or `thick`.
    The initial value is `medium`, which is typically rendered as 3 pixels.


    `border-width (1-4) | border-top-width |`


    `border-right-width | border-bottom-width |`


    `border-left-width :`


      `<length> | thin | medium | thick`


    As with `border-style`, this property can have one to four values and has four
    subproperties for setting the individual borders’ width.


    `/* Shortcut property */`


    `border-width: thin medium;`


    `/* Full-length properties */`


    `border-top-width:    thin;`


    `border-right-width:  medium;`


    `border-bottom-width: thin;`


    `border-left-width:   medium;`


    A width of zero means that no border is displayed. This value has the same effect
    as setting the style of the border to `none`.


    ## border-color


    `border-color` sets the color of the border. CSS does not specify what the default
    border color should be, but most browsers render it gray. This property can have
    from one to four values and has four subproperties for setting the individual
    borders’ color.


    `border-color (1-4) | border-top-color |`


    `border-right-color | border-bottom-color |`


    `border-left-color :`


      `<color> | transparent`


    Setting the color to transparent makes the border invisible without changing the
    layout.


    `border-color: transparent;`


    ## border


    The `border` property can set the width, style and color border properties in
    a single declaration. It is the most commonly used property for controlling the
    border.


    `border | border-top | border-right |`


    `border-bottom | border-left :`


      `<border-width> + <border-style> + <border-color>`


    The values can be set in any order because there is no ambiguity between them.
    Either one of the values can also be omitted.


    `border: 1px solid black;`


    The `border` property has four subproperties for specifying the border settings
    for each of the four sides.


    `border-top:    1px solid red;`


    `border-right:  1px solid blue;`


    `border-bottom: 1px solid aqua;`


    `border-left:   1px solid lime;`'
  trans: "\n# 行内元素与块级元素\n\nHTML 主要有两类元素：块级元素和行内元素。盒模型对这两类元素的适用方式不同，因此理解它们的区别至关重要。行内元素的例子包括`<a>`、`<strong>`\
    \ 和 `<em>`，而 `<p>`、`<h1>` 和 `<form>` 则是块级元素。\n\n行内元素与文本内容一同流动，并根据需要自动换行以适应其容器的宽度。它们不能包含块级元素，但\
    \ `<a>` 元素除外，它可以包裹任何类型的元素。\n\n块级元素可以同时包含块级元素和行内元素（见图 16-2）。它们通过在自身周围创建一个水平扩展的虚拟盒子来中断文本流，使得每个块级元素前后看起来都像有换行符。由于这些特性，块级元素也被称为盒子或容器。\n\
    \n![A978-1-4302-6491-0_16_Fig2_HTML.jpg](img/A978-1-4302-6491-0_16_Fig2_HTML.jpg)\n\
    \n图 16-2.\n\n块级元素与行内元素\n\n行内元素和块级元素周围的盒子具有不同的特性。块级元素可以操作盒模型中的所有属性，包括内容区域的宽度和高度，以及边框、内边距和外边距。如果没有设置宽度，块级元素会在水平方向上扩展到其包含元素所允许的最大宽度。\n\
    \n行内元素的限制更多，它无法设置垂直方向的外边距（顶部或底部），也无法改变其行内盒子的宽度或高度。对于行内元素，最小高度可以通过 `line-height`\
    \ 属性设置，但其宽度和高度会自动调整以适应元素所包含的内容。\n\n行内元素中有一个子类，称为可替换行内元素，它们使用外部对象，例如 `<img>`、`<video>`\
    \ 和 `<object>`；以及表单元素，例如 `<input>` 和 `<textarea>`。对于这些行内元素，所有盒模型属性都可以像块级元素一样进行操控。\n\
    \n## Span 与 Div\n\n使用 `<span>` 和 `<div>` 元素是为网页文档添加结构的一种通用方式。这些元素本身没有关联的样式，这使得它们特别适合与类选择器和\
    \ ID 选择器配合使用。这两者的区别在于：`<span>` 是行内元素，而 `<div>` 是块级元素。\n\n`<span>行内</span>`\n\n\
    `<div>块级</div>`\n\n作为一个行内元素，`<span>` 主要用于为文本片段添加样式。它不能用于设置块级元素的样式，因为根据 HTML 规范，块级元素不允许放在行内元素内部。\n\
    \n`<span style=\"color: red;\">红色文本</span>`\n\n相比之下，`<div>` 用于为其他块级元素和行内元素创建带样式的容器。这些自定义容器通常构成了网页的布局。由于它是块级元素，`<div>`\
    \ 允许操控元素的所有盒子属性（宽度、高度、内边距、边框和外边距）。\n\n`<div class=\"a\">`\n\n  `<div class=\"\
    b\">块级中的块级</div>`\n\n`</div>`\n\n# 17. 边框\n\n边框属性用于格式化元素周围的边框。它们可以应用于任何元素，并且不会继承。\n\
    \n## border-style\n\n要使元素的边框可见，必须将 `border-style` 属性设置为除 `none`（默认值）之外的其他值。\n\n\
    `border-style (1-4) | border-top-style |`\n\n`border-right-style | border-bottom-style\
    \ |`\n\n`border-left-style :`\n\n  `none | dashed | dotted | double | groove |`\n\
    \n  `hidden | inset | outset | ridge | solid`\n\n实线边框样式是最常用的，但如图 17-1 所示，还有其他几种显示边框的选项。`hidden`\
    \ 值会移除边框，与 `none` 同义，不同之处在于它还会隐藏具有合并边框的表格中的共享边框。\n\n![A978-1-4302-6491-0_17_Fig1_HTML.jpg](img/A978-1-4302-6491-0_17_Fig1_HTML.jpg)\n\
    \n图 17-1.\n\nborder-style 外观\n\n`border-style` 属性是可以设置一到四个值的多个属性之一。当指定的值少于四个时，`border-style`\
    \ 的值会重复，如图 17-2 所示。\n\n![A978-1-4302-6491-0_17_Fig2_HTML.jpg](img/A978-1-4302-6491-0_17_Fig2_HTML.jpg)\n\
    \n图 17-2.\n\n1 到 4 值语法解释\n\n根据这些规则，以下声明是等效的，都会在元素的顶部和底部显示实线边框：\n\n`border-style:\
    \ solid none solid none;`\n\n`border-style: solid none solid;`\n\n`border-style:\
    \ solid none;`\n\n要使所有边框的样式相同，只需指定一个样式值。\n\n`border-style: solid;`\n\n`border-style`\
    \ 属性有四个子属性，也可以用来分别设置各边边框的样式。\n\n`border-top-style:    dotted;`\n\n`border-right-style:\
    \  dashed;`\n\n`border-bottom-style: ridge;`\n\n`border-left-style:   inset;`\n\
    \n## border-width\n\n`border-width` 属性用于控制边框的宽度，可以使用长度单位或预定义值之一来设置：`thin`、`medium`\
    \ 或 `thick`。初始值为 `medium`，通常渲染为 3 像素。\n\n`border-width (1-4) | border-top-width\
    \ |`\n\n`border-right-width | border-bottom-width |`\n\n`border-left-width :`\n\
    \n  `<length> | thin | medium | thick`\n\n与 `border-style` 类似，该属性可以有一到四个值，并有四个子属性用于单独设置各边的边框宽度。\n\
    \n```\n/* 快捷属性 */\nborder-width: thin medium;\n\n/* 完整属性 */\nborder-top-width:\
    \    thin;\nborder-right-width:  medium;\nborder-bottom-width: thin;\nborder-left-width:\
    \   medium;\n```\n\n宽度为零表示不显示边框。该值与将边框样式设置为 `none` 效果相同。\n\n## border-color\n\n\
    `border-color` 用于设置边框的颜色。CSS 没有指定默认的边框颜色，但大多数浏览器将其渲染为灰色。该属性可以有一到四个值，并有四个子属性用于单独设置各边的边框颜色。\n\
    \n`border-color (1-4) | border-top-color |`\n\n`border-right-color | border-bottom-color\
    \ |`\n\n`border-left-color :`\n\n  `<color> | transparent`\n\n将颜色设置为 `transparent`\
    \ 会使边框不可见，而不会改变布局。\n\n`border-color: transparent;`\n\n## border\n\n`border` 属性可以在一个声明中同时设置边框的宽度、样式和颜色。它是控制边框最常用的属性。\n\
    \n`border | border-top | border-right |`\n\n`border-bottom | border-left :`\n\n\
    \  `<border-width> + <border-style> + <border-color>`\n\n这些值可以按任意顺序设置，因为它们之间没有歧义。也可以省略其中任意一个值。\n\
    \n`border: 1px solid black;`\n\n`border` 属性有四个子属性，用于分别指定四个边的边框设置。\n\n`border-top:\
    \    1px solid red;`\n\n`border-right:  1px solid blue;`\n\n`border-bottom: 1px\
    \ solid aqua;`\n\n`border-left:   1px solid lime;`\n"
- fmt: "# `border-radius`\n\nThe corners of the border can be rounded using the `border-radius`\
    \ property or its four subproperties.\n\n`border-radius (1-4) | border-top-left-radius\
    \ |`\n`border-top-right-radius | border-bottom-right-radius |`\n`border-bottom-left-radius\
    \ :`\n  `<length> | <percentage> [ / <length> | <percentage> ]`\n\nThe `border-radius`\
    \ property can have from one to four values. Each radius value can be set by using\
    \ either one value for a circle radius or two values for an elliptical radius.\
    \ The value can be either a length or a percentage. If a percentage is used, it\
    \ is relative to the container’s dimensions. The examples that follow are illustrated\
    \ in Figure [17-3](#A978-1-4302-6491-0_17_Chapter.html#Fig3):\n\n```\n.a { border-radius:\
    \ 5px; }\n.b { border-radius: 5px 20px; }\n.c { border-radius: 50%; }\n.d { border-radius:\
    \ 30px/10px; }\n```\n\n![A978-1-4302-6491-0_17_Fig3_HTML.jpg](A978-1-4302-6491-0_17_Fig3_HTML.jpg)\n\
    \nFigure 17-3.\nBorder-radius examples\n\nThe radius for each of the four edges\
    \ can be set using the four subproperties of `border-radius`. The following example\
    \ renders the same as the second box in Figure [17-3](#A978-1-4302-6491-0_17_Chapter.html#Fig3):\n\
    \n```\nborder-top-left-radius:     5px;\nborder-top-right-radius:    20px;\nborder-bottom-right-radius:\
    \ 5px;\nborder-bottom-left-radius:  20px;\n```\n\n`border-radius` is a well-supported\
    \ CSS 3 property. To add support for older browsers, the `-webkit` and `-moz`\
    \ browser prefixes can be used.\n\n```\n.round {\n  /* Safari 3-4 */\n  -webkit-border-radius:\
    \ 5px;\n  /* Firefox 1-3.6 */\n  -moz-border-radius: 5px;\n  /* Opera 10.5, IE9,\
    \ Safari 5, Chrome 1, Firefox 4 */\n  border-radius: 5px;\n}\n```\n\n# 18. Outline\n\
    \nThe outline is a line drawn around an element, outside the border edge. It is\
    \ typically rendered as a dotted line around interactive elements to show which\
    \ element has focus. Although similar to the border, the outline differs in that\
    \ it does not take up any space in the box model. Furthermore, unlike the border,\
    \ all four sides of the outline must be the same. The outline properties can be\
    \ applied to any element, and none of them inherits.\n\n## `outline-style`\n\n\
    The style of the outline is set with the `outline-style` property. To display\
    \ the outline, the value needs to be set to something other than `none`, which\
    \ is the default.\n\n```\noutline-style : none | solid | dotted | dashed | double\
    \ |\n                groove | ridge | inset | outset\n```\n\nThis property allows\
    \ the same values as `border-style`, except that `hidden` is not a valid `outline-style`.\
    \ They are also rendered the same, as illustrated in Figure [18-1](#A978-1-4302-6491-0_18_Chapter.html#Fig1).\n\
    \n![A978-1-4302-6491-0_18_Fig1_HTML.jpg](A978-1-4302-6491-0_18_Fig1_HTML.jpg)\n\
    \nFigure 18-1.\nOutline-style appearances\n\n## `outline-width`\n\nThe thickness\
    \ of the outline is specified with the `outline-width` property. Like the `border-width`\
    \ property, its value can be a specified length or one of the keywords `thin`,\
    \ `medium`, or `thick`.\n\n```\noutline-width : <length> | thin | medium | thick\n\
    ```\n\nCSS does not specify the numerical thickness of these three keywords, but\
    \ they typically render as `1px`, `3px`, and `5px`, respectively. Like `border-width`,\
    \ the initial value for this property is `medium`.\n\n## `outline-color`\n\nThe\
    \ color of the outline can be changed with the `outline-color` property. In addition\
    \ to the standard color notations, the keyword `invert` is also a valid value\
    \ for this property.\n\n```\noutline-color : invert | <color>\n```\n\nTo ensure\
    \ proper contrast, the specification suggests that the default value be `invert`,\
    \ which sets the outline to the opposite of the color underneath. However, only\
    \ IE8+ and Opera 7+ actually support this value, so it is not commonly used.\n\
    \n## `outline`\n\n`outline` is a shorthand property for setting all the preceding\
    \ outline properties in a single declaration.\n\n```\noutline : <outline-width>\
    \ + <outline-style> + <outline-color>\n```\n\nThe values can be specified in any\
    \ order because there is no ambiguity between them. Either one of them can be\
    \ left out.\n\n```\noutline: thin solid red;\n```\n\nThis has the same effect\
    \ as setting all the individual properties, but with a more convenient syntax:\n\
    \n```\noutline-width: thin;\noutline-style: solid;\noutline-color: red;\n```\n\
    \n## `outline-offset`\n\nThe space between the outline and the border edge can\
    \ be set with the `outline-offset` property introduced in CSS 3.\n\n```\noutline-offset\
    \ : <length>\n```\n\nThe following declaration moves the outline 3 pixels outward.\
    \ Negative values are allowed, which instead move the outline inside the element.\n\
    \n```\noutline-offset: 3px;\n```\n\nAlthough this property is not supported in\
    \ IE, it works in all other major browsers.\n\n# 19. Margin and padding\n\nMargins\
    \ and padding are used to adjust the position of an element and to create space\
    \ around it.\n\n## Padding\n\nPadding is the space between an element’s content\
    \ and its border. It is set using the padding properties shown here. These properties\
    \ do not inherit and can be applied to any element.\n\n```\npadding (1-4) | padding-top\
    \ | padding-right |\npadding-bottom | padding-left :\n  <length> | <percentage>\n\
    ```\n\nThere are four properties for setting the padding on each side individually.\
    \ In the following example, the vertical (top, bottom) margins will be 10 pixels,\
    \ and the horizontal (right, left) margins will be zero.\n\n```\npadding-top:\
    \    10px;\npadding-right:  0;\npadding-bottom: 10px;\npadding-left:   0;\n```\n\
    \nThese declarations can be shortened to a single declaration using the `padding`\
    \ property. The padding values are then specified in clockwise order: top, right,\
    \ bottom, and left.\n\n```\npadding: 10px 0 10px 0;\n```\n\nLike many other properties\
    \ related to the box model, the `padding` property can be set with one to four\
    \ values that correspond to the edges of the element’s box. With fewer than four\
    \ values, the padding is repeated as is shown in Figure [19-1](#A978-1-4302-6491-0_19_Chapter.html#Fig1).\n\
    \n![A978-1-4302-6491-0_19_Fig1_HTML.jpg](A978-1-4302-6491-0_19_Fig1_HTML.jpg)\n\
    \nFigure 19-1.\n1-to-4-value syntax explained\n\nFor instance, if two values are\
    \ specified, the first value sets the top and bottom padding, and the second value\
    \ sets the right and left padding. This gives an even shorter way of writing the\
    \ previous example.\n\n```\npadding: 10px 0;\n```\n\nKeep in mind that the padding\
    \ is part of the element’s background and is affected by the background properties,\
    \ whereas the margin is always transparent.\n\n## Margin\n\nThe margin is the\
    \ space around an element’s border and is set using the margin properties listed\
    \ as follows. These properties are not inherited and can be applied to any element,\
    \ with the exception that vertical margins do not affect nonreplaced inline elements.\n\
    \n```\nmargin (1-4) | margin-top | margin-right |\nmargin-bottom | margin-left:\n\
    \  <length> | <percentage> | auto\n```\n\nMargin and padding can both use percentage\
    \ values, which are relative to the width and height of the containing element.\
    \ In contrast with padding, margins can be negative, which allows for element\
    \ areas to overlap. The `auto` keyword lets the browser automatically calculate\
    \ the margin.\n\nLike the padding and border properties, the `margin` property\
    \ can be set with one to four values. For example, in the following declaration,\
    \ the top-bottom margins will be `1cm`, and the right-left margins will be `0`:\n\
    \n```\nmargin: 1cm 0;\n```\n\nThe `margin` property also has four subproperties,\
    \ which provide a more verbose method for setting the margin on each of the four\
    \ sides.\n\n```\nmargin-top:    1cm;\nmargin-right:  0;\nmargin-bottom: 1cm;\n\
    margin-left:   0;\n```\n\nTop and bottom margins are shared between adjacent boxes,\
    \ so the vertical distance between two boxes is not the sum of the margins, but\
    \ only the greater of the two margins. Because of this, the distance between the\
    \ two following `<div>` boxes will be only 10 pixels:\n\n```\n<div style=\"margin-bottom:\
    \ 5px;\">Top box</div>\n<div style=\"margin-top: 10px;\">Bottom box</div>\n```"
  raw: '## border-radius


    The corners of the border can be rounded using the `border-radius` property or
    its four subproperties.


    `border-radius (1-4) | border-top-left-radius |`


    `border-top-right-radius | border-bottom-right-radius |`


    `border-bottom-left-radius :`


      `<length> | <percentage> [ / <length> | <percentage> ]`


    The `border-radius` property can have from one to four values. Each radius value
    can be set by using either one value for a circle radius or two values for an
    elliptical radius. The value can be either a length or a percentage. If a percentage
    is used, it is relative to the container’s dimensions. The examples that follow
    are illustrated in Figure [17-3](#A978-1-4302-6491-0_17_Chapter.html#Fig3):


    `.a { border-radius: 5px; }`


    `.b { border-radius: 5px 20px; }`


    `.c { border-radius: 50%; }`


    `.d { border-radius: 30px/10px; }`


    ![A978-1-4302-6491-0_17_Fig3_HTML.jpg](A978-1-4302-6491-0_17_Fig3_HTML.jpg)


    Figure 17-3.


    Border-radius examples


    The radius for each of the four edges can be set using the four subproperties
    of `border-radius`. The following example renders the same as the second box in
    Figure [17-3](#A978-1-4302-6491-0_17_Chapter.html#Fig3):


    `border-top-left-radius:     5px;`


    `border-top-right-radius:    20px;`


    `border-bottom-right-radius: 5px;`


    `border-bottom-left-radius:  20px;`


    `border-radius` is a well-supported CSS 3 property. To add support for older browsers,
    the `-webkit` and `-moz` browser prefixes can be used.


    `.round {`


      `/* Safari 3-4 */`


      `-webkit-border-radius: 5px;`


      `/* Firefox 1-3.6 */`


      `-moz-border-radius: 5px;`


      `/* Opera 10.5, IE9, Safari 5, Chrome 1, Firefox 4 */`


      `border-radius: 5px;`


    `}`


    # 18. Outline


    The outline is a line drawn around an element, outside the border edge. It is
    typically rendered as a dotted line around interactive elements to show which
    element has focus. Although similar to the border, the outline differs in that
    it does not take up any space in the box model. Furthermore, unlike the border,
    all four sides of the outline must be the same. The outline properties can be
    applied to any element, and none of them inherits.


    ## outline-style


    The style of the outline is set with the `outline-style` property. To display
    the outline, the value needs to be set to something other than `none`, which is
    the default.


    `outline-style : none | solid | dotted | dashed | double |`


                    `groove | ridge | inset | outset`


    This property allows the same values as `border-style`, except that `hidden` is
    not a valid `outline-style`. They are also rendered the same, as illustrated in
    Figure [18-1](#A978-1-4302-6491-0_18_Chapter.html#Fig1).


    ![A978-1-4302-6491-0_18_Fig1_HTML.jpg](A978-1-4302-6491-0_18_Fig1_HTML.jpg)


    Figure 18-1.


    Outline-style appearances


    ## outline-width


    The thickness of the outline is specified with the `outline-width` property. Like
    the `border-width` property, its value can be a specified length or one of the
    keywords `thin`, `medium`, or `thick`.


    `outline-width : <length> | thin | medium | thick`


    CSS does not specify the numerical thickness of these three keywords, but they
    typically render as 1px, 3px, and 5px, respectively. Like `border-width`, the
    initial value for this property is `medium`.


    ## outline-color


    The color of the outline can be changed with the `outline-color` property. In
    addition to the standard color notations, the keyword `invert` is also a valid
    value for this property.


    `outline-color : invert | <color>`


    To ensure proper contrast, the specification suggests that the default value be
    `invert`, which sets the outline to the opposite of the color underneath. However,
    only IE8+ and Opera 7+ actually support this value, so it is not commonly used.


    ## outline


    `outline` is a shorthand property for setting all the preceding outline properties
    in a single declaration.


    `outline : <outline-width> + <outline-style> + <outline-color>`


    The values can be specified in any order because there is no ambiguity between
    them. Either one of them can be left out.


    `outline: thin solid red;`


    This has the same effect as setting all the individual properties, but with a
    more convenient syntax:


    `outline-width: thin;`


    `outline-style: solid;`


    `outline-color: red;`


    ## outline-offset


    The space between the outline and the border edge can be set with the `outline-offset`
    property introduced in CSS 3.


    `outline-offset : <length>`


    The following declaration moves the outline 3 pixels outward. Negative values
    are allowed, which instead move the outline inside the element.


    `outline-offset: 3px;`


    Although this property is not supported in IE, it works in all other major browsers.


    # 19. Margin and padding


    Margins and padding are used to adjust the position of an element and to create
    space around it.


    ## Padding


    Padding is the space between an element’s content and its border. It is set using
    the padding properties shown here. These properties do not inherit and can be
    applied to any element.


    `padding (1-4) | padding-top | padding-right |`


    `padding-bottom | padding-left :`


      `<length> | <percentage>`


    There are four properties for setting the padding on each side individually. In
    the following example, the vertical (top, bottom) margins will be 10 pixels, and
    the horizontal (right, left) margins will be zero.


    `padding-top:    10px;`


    `padding-right:  0;`


    `padding-bottom: 10px;`


    `padding-left:   0;`


    These declarations can be shortened to a single declaration using the `padding`
    property. The padding values are then specified in clockwise order: top, right,
    bottom, and left.


    `padding: 10px 0 10px 0;`


    Like many other properties related to the box model, the `padding` property can
    be set with one to four values that correspond to the edges of the element’s box.
    With fewer than four values, the padding is repeated as is shown in Figure [19-1](#A978-1-4302-6491-0_19_Chapter.html#Fig1).


    ![A978-1-4302-6491-0_19_Fig1_HTML.jpg](A978-1-4302-6491-0_19_Fig1_HTML.jpg)


    Figure 19-1.


    1-to-4-value syntax explained


    For instance, if two values are specified, the first value sets the top and bottom
    padding, and the second value sets the right and left padding. This gives an even
    shorter way of writing the previous example.


    `padding: 10px 0;`


    Keep in mind that the padding is part of the element’s background and is affected
    by the background properties, whereas the margin is always transparent.


    ## Margin


    The margin is the space around an element’s border and is set using the margin
    properties listed as follows. These properties are not inherited and can be applied
    to any element, with the exception that vertical margins do not affect nonreplaced
    inline elements.


    `margin (1-4) | margin-top | margin-right |`


    `margin-bottom | margin-left:`


      `<length> | <percentage> | auto`


    Margin and padding can both use percentage values, which are relative to the width
    and height of the containing element. In contrast with padding, margins can be
    negative, which allows for element areas to overlap. The `auto` keyword lets the
    browser automatically calculate the margin.


    Like the padding and border properties, the `margin` property can be set with
    one to four values. For example, in the following declaration, the top-bottom
    margins will be 1 cm, and the right-left margins will be 0:


    `margin: 1cm 0;`


    The `margin` property also has four subproperties, which provide a more verbose
    method for setting the margin on each of the four sides.


    `margin-top:    1cm;`


    `margin-right:  0;`


    `margin-bottom: 1cm;`


    `margin-left:   0;`


    Top and bottom margins are shared between adjacent boxes, so the vertical distance
    between two boxes is not the sum of the margins, but only the greater of the two
    margins. Because of this, the distance between the two following `<div>` boxes
    will be only 10 pixels:


    `<div style="margin-bottom: 5px;">Top box</div>`


    `<div style="margin-top: 10px;">Bottom box</div>`'
  trans: "\n# `border-radius`\n\n边框的角可以使用`border-radius`属性或其四个子属性来设置为圆角。\n\n`border-radius\
    \ (1-4) | border-top-left-radius |`\n`border-top-right-radius | border-bottom-right-radius\
    \ |`\n`border-bottom-left-radius :`\n  `<length> | <percentage> [ / <length> |\
    \ <percentage> ]`\n\n`border-radius`属性可以接受一到四个值。每个半径值可以通过使用圆形半径的一个值或椭圆形半径的两个值来设置。该值可以是长度或百分比。如果使用百分比，则相对于容器的尺寸。下面的示例在图\
    \ 17-3 中展示：\n\n```\n.a { border-radius: 5px; }\n.b { border-radius: 5px 20px;\
    \ }\n.c { border-radius: 50%; }\n.d { border-radius: 30px/10px; }\n```\n\n![A978-1-4302-6491-0_17_Fig3_HTML.jpg](img/A978-1-4302-6491-0_17_Fig3_HTML.jpg)\n\
    \n图 17-3.\n边框半径示例\n\n四个边各自的半径可以使用`border-radius`的四个子属性来设置。以下示例渲染效果与图 17-3 中的第二个框相同：\n\
    \n```\nborder-top-left-radius:     5px;\nborder-top-right-radius:    20px;\nborder-bottom-right-radius:\
    \ 5px;\nborder-bottom-left-radius:  20px;\n```\n\n`border-radius`是一个得到良好支持的 CSS3\
    \ 属性。为了增加对旧版浏览器的支持，可以使用`-webkit`和`-moz`浏览器前缀。\n\n```\n.round {\n  /* Safari 3-4\
    \ */\n  -webkit-border-radius: 5px;\n  /* Firefox 1-3.6 */\n  -moz-border-radius:\
    \ 5px;\n  /* Opera 10.5, IE9, Safari 5, Chrome 1, Firefox 4 */\n  border-radius:\
    \ 5px;\n}\n```\n\n# 18. 轮廓\n\n轮廓是绘制在元素周围、边框边缘外侧的一条线。它通常表现为围绕交互元素的虚线，以显示哪个元素获得了焦点。虽然与边框类似，但轮廓的不同之处在于它不占用盒模型中的任何空间。此外，与边框不同，轮廓的所有四个边必须保持一致。轮廓属性可以应用于任何元素，且它们都不具有继承性。\n\
    \n## `outline-style`\n\n轮廓的样式通过`outline-style`属性设置。要显示轮廓，需要将值设置为`none`（默认值）以外的其他值。\n\
    \n```\noutline-style : none | solid | dotted | dashed | double |\n           \
    \     groove | ridge | inset | outset\n```\n\n此属性允许与`border-style`相同的值，但`hidden`不是有效的`outline-style`值。它们的渲染效果也相同，如图\
    \ 18-1 所示。\n\n![A978-1-4302-6491-0_18_Fig1_HTML.jpg](img/A978-1-4302-6491-0_18_Fig1_HTML.jpg)\n\
    \n图 18-1.\n轮廓样式外观\n\n## `outline-width`\n\n轮廓的厚度通过`outline-width`属性指定。与`border-width`属性类似，其值可以是指定的长度，也可以是关键字`thin`、`medium`或`thick`。\n\
    \n```\noutline-width : <length> | thin | medium | thick\n```\n\nCSS 并未指定这三个关键字的数字厚度，但它们通常分别渲染为`1px`、`3px`和`5px`。与`border-width`一样，此属性的初始值为`medium`。\n\
    \n## `outline-color`\n\n轮廓的颜色可以通过`outline-color`属性更改。除了标准的颜色表示法外，关键字`invert`也是此属性的有效值。\n\
    \n```\noutline-color : invert | <color>\n```\n\n为了确保适当的对比度，规范建议默认值为`invert`，它会将轮廓设置为其下方颜色的反色。然而，只有\
    \ IE8+ 和 Opera 7+ 实际支持此值，因此并不常用。\n\n## `outline`\n\n`outline`是一个简写属性，用于在单个声明中设置上述所有轮廓属性。\n\
    \n```\noutline : <outline-width> + <outline-style> + <outline-color>\n```\n\n\
    值可以按任意顺序指定，因为它们之间没有歧义。其中任何一个值都可以省略。\n\n```\noutline: thin solid red;\n```\n\n\
    这与单独设置所有属性的效果相同，但语法更便捷：\n\n```\noutline-width: thin;\noutline-style: solid;\n\
    outline-color: red;\n```\n\n## `outline-offset`\n\n轮廓与边框边缘之间的间距可以通过 CSS3 引入的`outline-offset`属性来设置。\n\
    \n```\noutline-offset : <length>\n```\n\n以下声明将轮廓向外移动 3 像素。允许使用负值，这会将轮廓向内移动到元素内部。\n\
    \n```\noutline-offset: 3px;\n```\n\n虽然此属性在 IE 中不受支持，但它在所有其他主流浏览器中均有效。\n\n# 19.\
    \ 外边距和内边距\n\n外边距和内边距用于调整元素的位置并在其周围创建空间。\n\n## 内边距\n\n内边距是元素内容与其边框之间的空间。它通过此处显示的内边距属性进行设置。这些属性不具有继承性，并且可以应用于任何元素。\n\
    \n```\npadding (1-4) | padding-top | padding-right |\npadding-bottom | padding-left\
    \ :\n  <length> | <percentage>\n```\n\n有四个属性用于单独设置每一边的内边距。在以下示例中，垂直（顶部、底部）内边距将为\
    \ 10 像素，水平（右侧、左侧）内边距将为零。\n\n```\npadding-top:    10px;\npadding-right:  0;\npadding-bottom:\
    \ 10px;\npadding-left:   0;\n```\n\n这些声明可以使用`padding`属性缩短为单个声明。内边距值随后按顺时针顺序指定：上、右、下、左。\n\
    \n```\npadding: 10px 0 10px 0;\n```\n\n与许多与盒模型相关的其他属性一样，`padding`属性可以设置一至四个值，这些值对应于元素盒子的各边。当少于四个值时，内边距会按图\
    \ 19-1 所示重复。\n\n![A978-1-4302-6491-0_19_Fig1_HTML.jpg](img/A978-1-4302-6491-0_19_Fig1_HTML.jpg)\n\
    \n图 19-1.\n1 至 4 值语法解释\n\n例如，如果指定了两个值，则第一个值设置顶部和底部的内边距，第二个值设置右侧和左侧的内边距。这使得编写上一个示例的方式更加简短。\n\
    \n```\npadding: 10px 0;\n```\n\n请记住，内边距是元素背景的一部分，并受背景属性的影响，而外边距始终是透明的。\n\n## 外边距\n\
    \n外边距是元素边框周围的空间，通过下面列出的外边距属性进行设置。这些属性不具有继承性，并且可以应用于任何元素，但垂直外边距不影响非替换行内元素除外。\n\n\
    ```\nmargin (1-4) | margin-top | margin-right |\nmargin-bottom | margin-left:\n\
    \  <length> | <percentage> | auto\n```\n\n外边距和内边距都可以使用百分比值，这些值相对于包含元素的宽度和高度。与内边距不同，外边距可以为负值，这允许元素区域重叠。`auto`关键字让浏览器自动计算外边距。\n\
    \n与外边距和内边距属性类似，`margin`属性可以设置一至四个值。例如，在以下声明中，上下外边距将为`1cm`，左右外边距将为`0`：\n\n```\n\
    margin: 1cm 0;\n```\n\n`margin`属性也有四个子属性，它们提供了一种更详细的方法来设置四个边各自的外边距。\n\n```\nmargin-top:\
    \    1cm;\nmargin-right:  0;\nmargin-bottom: 1cm;\nmargin-left:   0;\n```\n\n\
    相邻盒子的上下外边距会共享，因此两个盒子之间的垂直距离不是外边距之和，而是两个外边距中较大的一个。因此，以下两个`<div>`盒子之间的距离将仅为 10 像素：\n\
    \n```\n<div style=\"margin-bottom: 5px;\">顶部盒子</div>\n<div style=\"margin-top:\
    \ 10px;\">底部盒子</div>\n```\n"
- fmt: "# 20. Dimension\n\nThe dimension properties control the size of an element,\
    \ as well as its minimum and maximum dimensions. They do not inherit and can be\
    \ applied only to block elements and replaced inline elements.\n\n## width and\
    \ height\n\nThe width and height of an element’s content area can be set with\
    \ the `width` and `height` properties. These two properties can be assigned with\
    \ either a length or a percentage value, where the percentage is relative to the\
    \ parent element’s dimensions.\n\n`width | height : auto | <length> | <percentage>`\n\
    \nA block element normally stretches out to the edges of its container. In contrast,\
    \ the element’s height collapses to fit its content. With the `width` and `height`\
    \ properties, these default behaviors can be changed. In the following example,\
    \ elements applying the class have a width of 100 pixels and a height of 50 pixels.\
    \ After the dimensions have been set like this, the element keeps that size, no\
    \ matter how the page is resized.\n\n```\n.mybox {\n  width: 100px;\n  height:\
    \ 50px;\n}\n```\n\n## min-width and min-height\n\nThe `min-width` and `min-height`\
    \ properties set the minimum dimensions of an element. The element’s width and\
    \ height still expand to fit the content, but the element does not collapse below\
    \ the specified minimum dimensions, which does not include padding, borders, or\
    \ margins.\n\n`min-width | min-height : <length> | <percentage>`\n\nValid values\
    \ for these properties are lengths and percentages, where percentage is relative\
    \ to the dimensions of the containing block. For example, the following class\
    \ makes an element take up at least half of the available width and height:\n\n\
    ```\n.half {\n  min-width: 50%;\n  min-height: 50%;\n}\n```\n\n## max-width and\
    \ max-height\n\nThe maximum dimensions of an element’s content area are set with\
    \ the `max-width` and `max-height` properties. They can be set with a length or\
    \ percentage value, as well as the keyword `none` to clear a previously set value.\n\
    \n`max-width | max-height : none | <length> | <percentage>`\n\nBy setting both\
    \ the maximum and minimum width, you can define an interval for the way the width\
    \ of an element can vary. A block element using the following class expands to\
    \ fill 500 pixels if it can. When horizontal space is limited, the element is\
    \ allowed to shrink down to no fewer than 200 pixels.\n\n```\n.mybox {\n  max-width:\
    \ 500px;\n  min-width: 200px;\n}\n```\n\nThe `max-width` property has priority\
    \ over `min-width`. However, it is the other way around with the height properties\
    \ because `min-height` has priority over `max-height`. Thus, an element using\
    \ the following class has a height of 5 em, unless its content requires more height.\
    \ In that case, the element expands vertically up to its maximum allowed value\
    \ of 20 em.\n\n```\n.mybox {\n  max-height: 20em;\n  min-height: 5em;\n}\n```\n\
    \nKeep in mind that the fixed `width` and `height` properties should not be used\
    \ together with the `min-` and `max-` properties. The four `min-` and `max-` properties\
    \ are supported by all major browsers, including Chrome 1+, Firefox 1+, IE7+,\
    \ Safari 1+, and Opera 8+. They are popularly used together with media rules for\
    \ creating fluid layouts that work well across different screen sizes.\n\n## box-sizing\n\
    \nThe dimension properties normally refer to the content area, not the padding\
    \ or border area. Therefore, to know the actual width or height that an element\
    \ occupies in the box model, the surrounding padding and border have to be taken\
    \ into account.\n\n```\n/* 100 pixels wide element */\n.mybox {\n  padding: 3px;\n\
    \  border: 2px solid red;\n  width: 90px;\n}\n```\n\nCSS 3 introduced the `box-sizing`\
    \ property to allow web developers a choice of how widths and heights are calculated.\
    \ The default value is `content-box`, which means the dimension properties refer\
    \ only to the content area. The alternative `border-box` value includes the padding\
    \ and borders in these measurements.\n\n`box-sizing : content-box | border-box`\n\
    \nBy changing the box sizing to `border-box`, you can create a grid layout more\
    \ easily because you no longer need to take the padding and border sizes into\
    \ account.\n\n```\n/* 100 pixel wide element */\n.mybox {\n  box-sizing: border-box;\n\
    \  padding: 3px;\n  border: 2px solid red;\n  width: 100px;\n}\n```\n\nThe `border-box`\
    \ property does not inherit, but it can be applied to all elements on the website\
    \ using the universal selector. To increase browser support, the `-webkit` and\
    \ `-moz` prefixes should be used.\n\n```\n/* Use border-box for all elements */\n\
    * {\n  /* Chrome 1-8, Safari 3-5 */\n  -webkit-box-sizing: border-box;\n  /* Firefox\
    \ 1-28*/\n  -moz-box-sizing: border-box;\n  /* Chrome 9+, Firefox 29+, IE8+, Safari\
    \ 5.1+, Opera 9.5+ */\n  box-sizing: border-box;\n}\n```\n\nBrowser support for\
    \ the `box-sizing` property has become so good that all major browsers now support\
    \ it. As such, many new websites have started to employ this property to simplify\
    \ the grid calculations for their layouts.\n\n# 21. Positioning\n\nThe positioning\
    \ properties can change how and where elements are displayed. They enable very\
    \ precise control over the web page layout.\n\n## position\n\nElements can be\
    \ positioned in four different ways using the `position` property. An element\
    \ with the `position` property set to anything but `static` is known as a positioned\
    \ element.\n\n`position : static | relative | absolute | fixed`\n\nA positioned\
    \ element can be moved with the `top`, `left`, `right`, and `bottom` properties,\
    \ which can be used to position elements anywhere on the page and also to resize\
    \ them horizontally and vertically. They allow both positive and negative length\
    \ and percentage values, with the percentage being relative to the dimensions\
    \ of the containing block.\n\n`top | right | bottom | left (positioned) : auto\
    \ | <length> | <percentage>`\n\n### static\n\nBy default, the `position` property\
    \ has the value `static`. This value means that the element appears in its regular\
    \ position in the page flow and is not affected by the `top`, `left`, `right`,\
    \ or `bottom` positioning properties.\n\n```\n/* Not positioned element */\n.static\
    \ { position: static; }\n```\n\nBecause the `position` property is not inherited,\
    \ and `static` is the default, there is no need to explicitly set the `position`\
    \ property to `static`.\n\n### relative\n\nChanging the `position` value to `relative`\
    \ means that the element can be positioned relative to its normal position in\
    \ the page flow. For example, to display a selected element 20 pixels below its\
    \ normal position, the following declarations are used:\n\n```\n/* Move element\
    \ 20 pixels down */\n.relative {\n  position: relative;\n  top: 20px;\n}\n```\n\
    \nRelatively positioned elements are considered part of the normal page flow,\
    \ so other elements do not move to fill in the gap left by the element.\n\nThe\
    \ effect of moving an element relative to its normal position can also be achieved\
    \ by using the element’s margin. This solution is often preferable unless there\
    \ is a specific need to make the element positioned, such as whether it will be\
    \ a container for an absolutely positioned child element.\n\n```\n/* Move element\
    \ 20 pixels down */\nmargin-bottom: -20px;\n```\n\nKeep in mind that changing\
    \ the margin affects the layout and fills in gaps, whereas relative positioning\
    \ does not.\n\n### absolute\n\nThe `position` value `absolute` detaches the element\
    \ from any containing elements and allows it to be positioned relative to its\
    \ nearest positioned ancestor or to the document body if there are none.\n\n```\n\
    /* Place element in upper left corner */\n.absolute {\n  position: absolute;\n\
    \  top: 0;\n  left: 0;\n}\n```\n\n### fixed\n\nA fixed element is positioned relative\
    \ to the screen viewport. It does not move when the page is scrolled. Similar\
    \ to absolutely positioned elements, fixed elements do not reserve any space in\
    \ the normal page flow.\n\n```\n/* Place element in bottom right corner */\n.fixed\
    \ {\n  position: absolute;\n  bottom: 0;\n  right: 0;\n}\n```"
  raw: '# 20. Dimension


    The dimension properties control the size of an element, as well as its minimum
    and maximum dimensions. They do not inherit and can be applied only to block elements
    and replaced inline elements.


    ## width and height


    The width and height of an element’s content area can be set with the `width`
    and `height` properties. These two properties can be assigned with either a length
    or a percentage value, where the percentage is relative to the parent element’s
    dimensions.


    `width | height : auto | <length> | <percentage>`


    A block element normally stretches out to the edges of its container. In contrast,
    the element’s height collapses to fit its content. With the `width` and `height`
    properties, these default behaviors can be changed. In the following example,
    elements applying the class have a width of 100 pixels and a height of 50 pixels.
    After the dimensions have been set like this, the element keeps that size, no
    matter how the page is resized.


    `.mybox {`


      `width: 100px;`


      `height: 50px;`


    `}`


    ## min-width and min-height


    The `min-width` and `min-height` properties set the minimum dimensions of an element.
    The element’s width and height still expand to fit the content, but the element
    does not collapse below the specified minimum dimensions, which does not include
    padding, borders, or margins.


    `min-width | min-height : <length> | <percentage>`


    Valid values for these properties are lengths and percentages, where percentage
    is relative to the dimensions of the containing block. For example, the following
    class makes an element take up at least half of the available width and height:


    `.half {`


      `min-width: 50%;`


      `min-height: 50%;`


    `}`


    ## max-width and max-height


    The maximum dimensions of an element’s content area are set with the `max-width`
    and `max-height` properties. They can be set with a length or percentage value,
    as well as the keyword `none` to clear a previously set value.


    `max-width | max-height : none | <length> | <percentage>`


    By setting both the maximum and minimum width, you can define an interval for
    the way the width of an element can vary. A block element using the following
    class expands to fill 500 pixels if it can. When horizontal space is limited,
    the element is allowed to shrink down to no fewer than 200 pixels.


    `.mybox {`


      `max-width: 500px;`


      `min-width: 200px;`


    `}`


    The `max-width` property has priority over `min-width`. However, it is the other
    way around with the height properties because `min-height` has priority over `max-height`.
    Thus, an element using the following class has a height of 5 em, unless its content
    requires more height. In that case, the element expands vertically up to its maximum
    allowed value of 20 em.


    `.mybox {`


      `max-height: 20em;`


      `min-height: 5em;`


    `}`


    Keep in mind that the fixed `width` and `height` properties should not be used
    together with the `min-` and `max-` properties. The four `min-` and `max-` properties
    are supported by all major browsers, including Chrome 1+, Firefox 1+, IE7+, Safari
    1+, and Opera 8+. They are popularly used together with media rules for creating
    fluid layouts that work well across different screen sizes.


    ## box-sizing


    The dimension properties normally refer to the content area, not the padding or
    border area. Therefore, to know the actual width or height that an element occupies
    in the box model, the surrounding padding and border have to be taken into account.


    `/* 100 pixels wide element */`


    `.mybox {`


      `padding: 3px;`


      `border: 2px solid red;`


      `width: 90px;`


    `}`


    CSS 3 introduced the `box-sizing` property to allow web developers a choice of
    how widths and heights are calculated. The default value is `content-box`, which
    means the dimension properties refer only to the content area. The alternative
    `border-box` value includes the padding and borders in these measurements.


    `box-sizing : content-box | border-box`


    By changing the box sizing to `border-box`, you can create a grid layout more
    easily because you no longer need to take the padding and border sizes into account.


    `/* 100 pixel wide element */`


    `.mybox {`


      `box-sizing: border-box;`


      `padding: 3px;`


      `border: 2px solid red;`


      `width: 100px;`


    `}`


    The `border-box` property does not inherit, but it can be applied to all elements
    on the website using the universal selector. To increase browser support, the
    `-webkit` and `-moz` prefixes should be used.


    `/* Use border-box for all elements */`


    `* {`


      `/* Chrome 1-8, Safari 3-5 */`


      `-webkit-box-sizing: border-box;`


      `/* Firefox 1-28*/`


      `-moz-box-sizing: border-box;`


      `/* Chrome 9+, Firefox 29+, IE8+, Safari 5.1+, Opera 9.5+ */`


      `box-sizing: border-box;`


    `}`


    Browser support for the `box-sizing` property has become so good that all major
    browsers now support it. As such, many new websites have started to employ this
    property to simplify the grid calculations for their layouts.


    # 21. Positioning


    The positioning properties can change how and where elements are displayed. They
    enable very precise control over the web page layout.


    ## position


    Elements can be positioned in four different ways using the `position` property.
    An element with the `position` property set to anything but `static` is known
    as a positioned element.


    `position : static | relative | absolute | fixed`


    A positioned element can be moved with the `top`, `left`, `right`, and `bottom`
    properties, which can be used to position elements anywhere on the page and also
    to resize them horizontally and vertically. They allow both positive and negative
    length and percentage values, with the percentage being relative to the dimensions
    of the containing block.


    `top | right | bottom | left (positioned) :`


      `auto | <length> | <percentage>`


    ### static


    By default, the `position` property has the value `static`. This value means that
    the element appears in its regular position in the page flow and is not affected
    by the `top`, `left`, `right`, or `bottom` positioning properties.


    `/* Not positioned element */`


    `.static { position: static; }`


    Because the `position` property is not inherited, and `static` is the default,
    there is no need to explicitly set the `position` property to `static`.


    ### relative


    Changing the `position` value to `relative`means that the element can be positioned
    relative to its normal position in the page flow. For example, to display a selected
    element 20 pixels below its normal position, the following declarations are used:


    `/* Move element 20 pixels down */`


    `.relative {`


      `position: relative;`


      `top: 20px;`


    `}`


    Relatively positioned elements are considered part of the normal page flow, so
    other elements do not move to fill in the gap left by the element.


    The effect of moving an element relative to its normal position can also be achieved
    by using the element’s margin. This solution is often preferable unless there
    is a specific need to make the element positioned, such as whether it will be
    a container for an absolutely positioned child element.


    `/* Move element 20 pixels down */`


    `margin-bottom: -20px;`


    Keep in mind that changing the margin affects the layout and fills in gaps, whereas
    relative positioning does not.


    ### absolute


    The `position` value `absolute`detaches the element from any containing elements
    and allows it to be positioned relative to its nearest positioned ancestor or
    to the document body if there are none.


    `/* Place element in upper left corner */`


    `.absolute {`


      `position: absolute;`


      `top: 0;`


      `left: 0;`


    `}`


    ### fixed


    A fixed element is positioned relative to the screen viewport. It does not move
    when the page is scrolled. Similar to absolutely positioned elements, fixed elements
    do not reserve any space in the normal page flow.


    `/* Place element in bottom right corner */`


    `.fixed {`


      `position: absolute;`


      `bottom: 0;`


      `right: 0;`


    `}`'
  trans: "\n# 20. 尺寸\n\n尺寸属性控制元素的大小及其最小和最大尺寸。这些属性不具有继承性，且只能应用于块级元素和可替换内联元素。\n\n##\
    \ width 和 height\n\n元素内容区域的宽度和高度可以通过 `width` 和 `height` 属性来设置。这两个属性可以赋予长度值或百分比值，其中百分比是相对于父元素的尺寸而言的。\n\
    \n`width | height : auto | <length> | <percentage>`\n\n块级元素通常会伸展至其容器的边缘。相比之下，元素的高度会收缩以适应其内容。通过使用\
    \ `width` 和 `height` 属性，可以改变这些默认行为。在下面的示例中，应用了该类的元素具有 100 像素的宽度和 50 像素的高度。像这样设置尺寸后，无论页面如何调整大小，该元素都会保持该尺寸。\n\
    \n```\n.mybox {\n  width: 100px;\n  height: 50px;\n}\n```\n\n## min-width 和 min-height\n\
    \n`min-width` 和 `min-height` 属性设置元素的最小尺寸。元素的宽度和高度仍然会扩展以适应内容，但元素不会收缩到低于指定的最小尺寸，这最小尺寸不包括内边距、边框或外边距。\n\
    \n`min-width | min-height : <length> | <percentage>`\n\n这些属性的有效值是长度和百分比，其中百分比是相对于包含块的尺寸而言的。例如，以下类使元素至少占据可用宽度和高度的一半：\n\
    \n```\n.half {\n  min-width: 50%;\n  min-height: 50%;\n}\n```\n\n## max-width\
    \ 和 max-height\n\n元素内容区域的最大尺寸通过 `max-width` 和 `max-height` 属性来设置。它们可以设置为长度值或百分比值，以及关键字\
    \ `none` 来清除之前设置的值。\n\n`max-width | max-height : none | <length> | <percentage>`\n\
    \n通过同时设置最大和最小宽度，你可以定义一个元素宽度可变动的区间。使用以下类的块级元素在空间允许时会扩展到 500 像素。当水平空间受限时，该元素允许收缩到不低于\
    \ 200 像素。\n\n```\n.mybox {\n  max-width: 500px;\n  min-width: 200px;\n}\n```\n\
    \n`max-width` 属性优先级高于 `min-width`。然而，对于高度属性则相反，因为 `min-height` 优先级高于 `max-height`。因此，使用以下类的元素高度为\
    \ 5 em，除非其内容需要更多高度。在这种情况下，元素会垂直扩展，直到其允许的最大值 20 em。\n\n```\n.mybox {\n  max-height:\
    \ 20em;\n  min-height: 5em;\n}\n```\n\n请记住，固定的 `width` 和 `height` 属性不应与 `min-`\
    \ 和 `max-` 属性一起使用。所有主流浏览器都支持这四个 `min-` 和 `max-` 属性，包括 Chrome 1+、Firefox 1+、IE7+、Safari\
    \ 1+ 和 Opera 8+。它们常与媒体规则一起使用，以创建在不同屏幕尺寸下都能良好运行的流式布局。\n\n## box-sizing\n\n尺寸属性通常指的是内容区域，而不是内边距或边框区域。因此，要知道一个元素在盒模型中实际占据的宽度或高度，必须考虑其周围的内边距和边框。\n\
    \n```\n/* 100 像素宽的元素 */\n.mybox {\n  padding: 3px;\n  border: 2px solid red;\n\
    \  width: 90px;\n}\n```\n\nCSS 3 引入了 `box-sizing` 属性，允许网页开发者选择如何计算宽度和高度。默认值是 `content-box`，这意味着尺寸属性仅指内容区域。另一种\
    \ `border-box` 值则在测量中包含内边距和边框。\n\n`box-sizing : content-box | border-box`\n\n\
    通过将盒模型尺寸计算方式更改为 `border-box`，你可以更轻松地创建网格布局，因为不再需要考虑内边距和边框的大小。\n\n```\n/* 100 像素宽的元素\
    \ */\n.mybox {\n  box-sizing: border-box;\n  padding: 3px;\n  border: 2px solid\
    \ red;\n  width: 100px;\n}\n```\n\n`border-box` 属性不具有继承性，但可以使用通配选择器将其应用于网站上的所有元素。为了增加浏览器兼容性，应使用\
    \ `-webkit` 和 `-moz` 前缀。\n\n```\n/* 对所有元素使用 border-box */\n* {\n  /* Chrome 1-8,\
    \ Safari 3-5 */\n  -webkit-box-sizing: border-box;\n  /* Firefox 1-28*/\n  -moz-box-sizing:\
    \ border-box;\n  /* Chrome 9+, Firefox 29+, IE8+, Safari 5.1+, Opera 9.5+ */\n\
    \  box-sizing: border-box;\n}\n```\n\n`box-sizing` 属性的浏览器支持已经非常好，所有主流浏览器现在都支持它。因此，许多新网站已开始采用此属性来简化其布局的网格计算。\n\
    \n# 21. 定位\n\n定位属性可以改变元素的显示方式和位置。它们可以实现对网页布局的非常精确的控制。\n\n## position\n\n使用 `position`\
    \ 属性，元素可以以四种不同的方式进行定位。将 `position` 属性设置为除 `static` 之外的任何值的元素被称为已定位元素。\n\n`position\
    \ : static | relative | absolute | fixed`\n\n已定位元素可以通过 `top`、`left`、`right` 和\
    \ `bottom` 属性进行移动，这些属性可用于在页面上的任意位置定位元素，也可以水平和垂直地调整它们的大小。它们允许正的或负的长度值和百分比值，其中百分比是相对于包含块的尺寸而言的。\n\
    \n`top | right | bottom | left (已定位元素) : auto | <length> | <percentage>`\n\n###\
    \ static\n\n默认情况下，`position` 属性的值为 `static`。此值意味着该元素出现在页面流中的常规位置，并且不受 `top`、`left`、`right`\
    \ 或 `bottom` 定位属性的影响。\n\n```\n/* 未定位的元素 */\n.static { position: static; }\n```\n\
    \n由于 `position` 属性不具有继承性，且 `static` 是默认值，因此无需显式地将 `position` 属性设置为 `static`。\n\
    \n### relative\n\n将 `position` 值更改为 `relative` 意味着该元素可以相对于其在页面流中的正常位置进行定位。例如，要将选定的元素显示在其正常位置下方\
    \ 20 像素处，可以使用以下声明：\n\n```\n/* 将元素向下移动 20 像素 */\n.relative {\n  position: relative;\n\
    \  top: 20px;\n}\n```\n\n相对定位的元素被认为是正常页面流的一部分，因此其他元素不会移动来填补该元素留下的空白。\n\n通过使用元素的外边距也可以实现将元素相对于其正常位置移动的效果。除非有特定需要使该元素成为已定位元素（例如它将作为绝对定位子元素的容器），否则这种解决方案通常是更可取的。\n\
    \n```\n/* 将元素向下移动 20 像素 */\nmargin-bottom: -20px;\n```\n\n请记住，更改外边距会影响布局并填补空白，而相对定位则不会。\n\
    \n### absolute\n\n`position` 值 `absolute` 会将元素从任何包含元素中分离出来，并允许它相对于其最近的已定位祖先元素进行定位，如果没有已定位的祖先元素，则相对于文档主体。\n\
    \n```\n/* 将元素放置在左上角 */\n.absolute {\n  position: absolute;\n  top: 0;\n  left:\
    \ 0;\n}\n```\n\n### fixed\n\n固定定位的元素是相对于屏幕视口进行定位的。当页面滚动时，它不会移动。与绝对定位元素类似，固定定位的元素不会在正常页面流中预留任何空间。\n\
    \n```\n/* 将元素放置在右下角 */\n.fixed {\n  position: absolute;\n  bottom: 0;\n  right:\
    \ 0;\n}\n```\n"
- fmt: "# `overflow`\n\nThe `overflow` property decides how content overflow is handled\
    \ for block elements. It defaults to `visible`, meaning that text and child elements\
    \ that expand beyond the element’s content area are visible. Setting the value\
    \ to `hidden` hides the overflowing content, and with the `scroll` value the element’s\
    \ block becomes scrollable to accommodate the overflowed content. The `auto` value\
    \ is similar to `scroll`, but the scrollbars then appear only when necessary.\n\
    \n`overflow (block) : visible | hidden | scroll | auto`\n\nThis property controls\
    \ the behavior of both horizontal and vertical overflow. Two additional properties,\
    \ `overflow-x` and `overflow-y`, can be used to differentiate between how horizontal\
    \ or vertical overflow is handled. The values for these two properties are the\
    \ same as for the `overflow` property.\n\n```\noverflow: hidden;   /* hide all\
    \ overflow */\noverflow-x: hidden; /* hide horizontal overflow */\noverflow-y:\
    \ hidden; /* hide vertical overflow */\n```\n\n# `clip`\n\nThe `clip` property\
    \ can crop an element into a rectangle if it is positioned as either absolute\
    \ or fixed. It uses a CSS function called `rect()` to specify the clipping region.\n\
    \n`clip (absolute | fixed) :`  \n  `auto | rect(<top>, <right>, <bottom>, <left>)`\n\
    \n`rect()` requires four length values, each separated by commas. These values\
    \ are relative to the top-left corner of the element. The example shown in Figure\
    \ 21-1 cuts out and displays a 200 x 400 pixel region from the element to which\
    \ it is applied.\n\n```\n.myclip {\n  position: absolute;\n  clip: rect(100px,\
    \ 500px, 300px, 100px);\n}\n```\n\n![A978-1-4302-6491-0_21_Fig1_HTML.jpg](A978-1-4302-6491-0_21_Fig1_HTML.jpg)\
    \  \nFigure 21-1. Shaded region is removed\n\nThe keyword `auto` can be used as\
    \ a value for the right or bottom side to refer to the full width or height of\
    \ the element, respectively. This keyword is also the default value for the `clip`\
    \ property, which then means that the element is not clipped.\n\n```\n/* Remove\
    \ 100px from left and top */\nclip: rect(100px, auto, auto, 100px);\n/* No clipping\
    \ */\nclip: auto;\n```\n\nTo support IE7 and below, the commas in the `rect()`\
    \ function need to be left out. This nonstandard syntax is supported in all major\
    \ browsers.\n\n```\n/* Backwards compatible IE4-7 syntax */\nclip: rect(100px\
    \ 500px 300px 100px);\n```\n\n# `z-index`\n\nPositioned elements that overlap\
    \ each other are normally layered according to their order in the web document.\
    \ This natural stacking order can be altered with the `z-index` property.\n\n\
    `z-index (positioned) : auto | <integer>`\n\nThe `z-index` property takes a positive\
    \ or negative integer as its value, indicating the stacking order. Elements with\
    \ a higher value are in front of elements with a lower value, as in the following\
    \ example:\n\n```\n<img src=\"ace-of-hearts.png\" style=\"\n  position: absolute;\n\
    \  left: 0;\n  top: 0;\n  z-index: 1;\">\n<img src=\"ace-of-spades.png\" style=\"\
    \n  position: absolute;\n  left: 100px;\n  top: 100px;\n  z-index: 0;\">\n```\n\
    \nIn this example, shown in Figure 21-2, the ace of hearts is layered on top of\
    \ the ace of spades because of its higher stacking order.\n\n![A978-1-4302-6491-0_21_Fig2_HTML.jpg](A978-1-4302-6491-0_21_Fig2_HTML.jpg)\
    \  \nFigure 21-2. Customized stacking order\n\n# `vertical-align`\n\nThe vertical\
    \ alignment of text and inline elements within a line can be controlled with the\
    \ `vertical-align` property. This property can also be used on table cell elements.\n\
    \n`vertical-align (inline | table-cell) :`  \n  `baseline | <length> | <percentage>\
    \ | top | middle |`  \n  `bottom | text-top | text-bottom | super | sub`\n\nBy\
    \ default, the bottom of text and inline elements, such as images, align at the\
    \ baseline, which is the invisible line on which all letters sit. The values `top`\
    \ and `bottom` align the image to the top and bottom of the line, respectively.\
    \ Less intuitive is the value `middle`, which aligns the middle of the image with\
    \ the middle of lowercase letters in the parent. The rendering of these common\
    \ alignment values is illustrated in Figure 21-3.\n\n![A978-1-4302-6491-0_21_Fig3_HTML.jpg](A978-1-4302-6491-0_21_Fig3_HTML.jpg)\
    \  \nFigure 21-3. Common vertical alignment values\n\nTwo less–commonly used values\
    \ for `vertical-align` are `text-bottom` and `text-top`. The `text-bottom` value\
    \ aligns the bottom of the element with the bottom of the text. Opposite of it,\
    \ the `text-top` value aligns the top of the element with the top of the text.\
    \ There is also the `sub` and `super` values, which align the element to subscript\
    \ and superscript positions, respectively. The result of using these values is\
    \ shown in Figure 21-4.\n\n![A978-1-4302-6491-0_21_Fig4_HTML.jpg](A978-1-4302-6491-0_21_Fig4_HTML.jpg)\
    \  \nFigure 21-4. Other vertical alignment values\n\nElements can also be raised\
    \ (positive value) or lowered (negative value) with either a length or percentage\
    \ value. Both percentage and length values start at the baseline; the percentage\
    \ value is relative to the line height.\n\n```\n/* Align text segment 5 pixels\
    \ below normal text */\nNormal <span style=\"vertical-align: -5px;\">Lowered</span>\n\
    ```\n\nWhen applied to table cell elements `<th>` and `<td>`, the `vertical-align`\
    \ property behaves as the deprecated `valign` attribute in HTML. Valid values\
    \ for table cells are `baseline`, `bottom`, `middle`, and `top`. Other values,\
    \ including lengths and percentages, should not be used with table cells.\n\n\
    The `top` value aligns the cell’s top padding edge with the top of the row. Likewise,\
    \ `bottom` aligns the cell’s bottom padding edge with the bottom of the row. More\
    \ notably, the `baseline` value aligns the cell’s content so that it shares the\
    \ same baseline as other cells that are baseline-aligned.\n\nIn contrast with\
    \ inline elements that default to `baseline`, table cell elements are normally\
    \ aligned in the middle. For table cells, the `middle` value behaves in a more\
    \ intuitive way by aligning the cell’s padding box in the middle of the row, making\
    \ the cell’s content appear centered.\n\nIn the following example, the table cell\
    \ element is vertically aligned at the bottom:\n\n```\n<table>\n  <tr>\n    <td\
    \ style=\"vertical-align: bottom;\">Bottom</td>\n  </tr>\n</table>\n```\n\n# Centering\n\
    \nThere are several ways to center elements in CSS. A common method is to use\
    \ the `text-align` property with the value `center`.\n\n```\n.text-center { text-align:\
    \ center; }\n```\n\nBy applying this property to the containing element, text\
    \ within it is center-aligned.\n\n```\n<p class=\"text-center\">Centered text</p>\n\
    ```\n\nThis method works for text and inline elements, but not for block elements.\
    \ To center block elements, the left and right margins can be set to `auto`, which\
    \ makes the horizontal margins equally large, causing the block to be centered.\n\
    \n```\n.box-center { margin: 0 auto; }\n```\n\nKeep in mind that for a block element\
    \ to appear centered, its width must be fixed and not flexible; otherwise, it\
    \ takes up all the available width.\n\n```\n<div style=\"width: 50px; height:\
    \ 50px;\n            border: 1px solid black;\"\n     class=\"box-center\"></div>\n\
    ```\n\nFor vertical centering, the easiest way to align content to the middle\
    \ is to use the `vertical-align` property on the parent element with its value\
    \ set to `middle`. This behavior only works as expected for table cell elements,\
    \ so the container needs to be changed into one, as in the following example using\
    \ the `display` property:\n\n```\n<div style=\"vertical-align: middle;\n     \
    \       display: table-cell;\n            min-height: 100px;\">Centered</div>\n\
    ```\n\n# 22. Classification\n\nThe classification properties specify how an element\
    \ is displayed and whether it is visible."
  raw: '## overflow


    The `overflow` propertydecides how content overflow is handled for block elements.
    It defaults to `visible`, meaning that text and child elements that expand beyond
    the element’s content area are visible. Setting the value to `hidden` hides the
    overflowing content, and with the `scroll` value the element’s block becomes scrollable
    to accommodate the overflowed content. The `auto` value is similar to `scroll`,
    but the scrollbars then appear only when necessary.


    `overflow (block) : visible | hidden | scroll | auto`


    This property controls the behavior of both horizontal and vertical overflow.
    Two additional properties, `overflow-x` and `overflow-y`, can be used to differentiate
    between how horizontal or vertical overflow is handled. The values for these two
    properties are the same as for the `overflow` property.


    `overflow: hidden;   /* hide all overflow */`


    `overflow-x: hidden; /* hide horizontal overflow */`


    `overflow-y: hidden; /* hide vertical overflow */`


    ## clip


    The `clip` propertycan crop an element into a rectangle if it is positioned as
    either absolute or fixed. It uses a CSS function called `rect()` to specify the
    clipping region.


    `clip (absolute | fixed) :`


      `auto | rect(<top>, <right>, <bottom>, <left>)`


    `rect()` requires four length values, each separated by commas. These values are
    relative to the top-left corner of the element. The example shown in Figure [21-1](#A978-1-4302-6491-0_21_Chapter.html#Fig1)
    cuts out and displays a 200 x 400 pixel region from the element to which it is
    applied.


    `.myclip {`


      `position: absolute;`


      `clip: rect(100px, 500px, 300px, 100px);`


    `}`


    ![A978-1-4302-6491-0_21_Fig1_HTML.jpg](A978-1-4302-6491-0_21_Fig1_HTML.jpg)


    Figure 21-1.


    Shaded region is removed


    The keyword `auto` can be used as a value for the right or bottom side to refer
    to the full width or height of the element, respectively. This keyword is also
    the default value for the `clip` property, which then means that the element is
    not clipped.


    `/* Remove 100px from left and top */`


    `clip: rect(100px, auto, auto, 100px);`


    `/* No clipping */`


    `clip: auto;`


    To support IE7 and below, the commas in the `rect()` function need to be left
    out. This nonstandard syntax is supported in all major browsers.


    `/* Backwards compatible IE4-7 syntax */`


    `clip: rect(100px 500px 300px 100px);`


    ## z-index


    Positioned elements that overlap each other are normally layered according to
    their order in the web document. This natural stacking order can be altered with
    the `z-index` property.


    `z-index (positioned) : auto | <integer>`


    The `z-index` property takes a positive or negative integer as its value, indicating
    the stacking order. Elements with a higher value are in front of elements with
    a lower value, as in the following example:


    `<img src="ace-of-hearts.png" style="`


      `position: absolute;`


      `left: 0;`


      `top: 0;`


      `z-index: 1;">`


    `<img src="ace-of-spades.png" style="`


      `position: absolute;`


      `left: 100px;`


      `top: 100px;`


      `z-index: 0;">`


    In this example, shown in Figure [21-2](#A978-1-4302-6491-0_21_Chapter.html#Fig2),
    the ace of hearts is layered on top of the ace of spades because of its higher
    stacking order.


    ![A978-1-4302-6491-0_21_Fig2_HTML.jpg](A978-1-4302-6491-0_21_Fig2_HTML.jpg)


    Figure 21-2.


    Customized stacking order


    ## vertical-align


    The vertical alignment of text and inline elements within a line can be controlled
    with the `vertical-align` property. This property can also be used on table cell
    elements.


    `vertical-align (inline | table-cell) :`


      `baseline | <length> | <percentage> | top | middle |`


      `bottom | text-top | text-bottom | super | sub`


    By default, the bottom of text and inline elements, such as images, align at the
    baseline, which is the invisible line on which all letters sit. The values `top`
    and `bottom` align the image to the top and bottom of the line, respectively.
    Less intuitive is the value `middle`, which aligns the middle of the image with
    the middle of lowercase letters in the parent. The rendering of these common alignment
    values is illustrated in Figure [21-3](#A978-1-4302-6491-0_21_Chapter.html#Fig3).


    ![A978-1-4302-6491-0_21_Fig3_HTML.jpg](A978-1-4302-6491-0_21_Fig3_HTML.jpg)


    Figure 21-3.


    Common vertical alignment values


    Two less–commonly used values for `vertical-align` are `text-bottom` and `text-top`.
    The `text-bottom`value aligns the bottom of the element with the bottom of the
    text. Opposite of it, the `text-top` value aligns the top of the element with
    the top of the text. There is also the `sub` and `super` values, which align the
    element to subscript and superscript positions, respectively. The result of using
    these values is shown in Figure [21-4](#A978-1-4302-6491-0_21_Chapter.html#Fig4).


    ![A978-1-4302-6491-0_21_Fig4_HTML.jpg](A978-1-4302-6491-0_21_Fig4_HTML.jpg)


    Figure 21-4.


    Other vertical alignment values


    Elements can also be raised (positive value) or lowered (negative value) with
    either a length or percentage value. Both percentage and length values start at
    the baseline; the percentage value is relative to the line height.


    `/* Align text segment 5 pixels below normal text */`


    `Normal <span style="vertical-align: -5px;">Lowered</span>`


    When applied to table cell elements `<th>` and `<td>`, the `vertical-align` property
    behaves as the deprecated `valign` attribute in HTML. Valid values for table cells
    are `baseline`, `bottom`, `middle`, and `top`. Other values, including lengths
    and percentages, should not be used with table cells.


    The `top` value aligns the cell’s top padding edge with the top of the row. Likewise,
    `bottom` aligns the cell’s bottom padding edge with the bottom of the row. More
    notably, the `baseline` value aligns the cell’s content so that it shares the
    same baseline as other cells that are baseline-aligned.


    In contrast with inline elements that default to `baseline`, table cell elements
    are normally aligned in the middle. For table cells, the `middle` value behaves
    in a more intuitive way by aligning the cell’s padding box in the middle of the
    row, making the cell’s content appear centered.


    In the following example, the table cell element is vertically aligned at the
    bottom:


    `<table>`


      `<tr>`


        `<td style="vertical-align: bottom;">Bottom</td>`


      `</tr>`


    `</table>`


    ## Centering


    There are several ways to center elements in CSS. A common method is to use the
    `text-align` property with the value `center`.


    `.text-center { text-align: center; }`


    By applying this property to the containing element, text within it is center-aligned.


    `<p class="text-center">Centered text</p>`


    This method works for text and inline elements, but not for block elements. To
    center block elements, the left and right margins can be set to `auto`, which
    makes the horizontal margins equally large, causing the block to be centered.


    `.box-center { margin: 0 auto; }`


    Keep in mind that for a block element to appear centered, its width must be fixed
    and not flexible; otherwise, it takes up all the available width.


    `<div style="width: 50px; height: 50px;`


                `border: 1px solid black;"`


         `class="box-center"></div>`


    For vertical centering, the easiest way to align content to the middle is to use
    the `vertical-align` property on the parent element with its value set to `middle`.
    This behavior only works as expected for table cell elements, so the container
    needs to be changed into one, as in the following example using the `display`
    property:


    `<div style="vertical-align: middle;`


                `display: table-cell;`


                `min-height: 100px;">Centered</div>`


    # 22. Classification


    The classification properties specify how an element is displayed and whether
    it is visible.'
  trans: "\n# `overflow`\n\n`overflow` 属性决定了块级元素如何处理内容溢出。其默认值为 `visible`，意味着超出元素内容区域的文本和子元素将是可见的。将该值设置为\
    \ `hidden` 会隐藏溢出的内容，而使用 `scroll` 值则会使元素的块变得可滚动，以容纳溢出的内容。`auto` 值与 `scroll` 类似，但滚动条仅在必要时才出现。\n\
    \n`overflow (块级元素) : visible | hidden | scroll | auto`\n\n此属性控制水平和垂直方向上的溢出行为。另外两个属性\
    \ `overflow-x` 和 `overflow-y` 可用于区分水平或垂直溢出的处理方式。这两个属性的值与 `overflow` 属性的值相同。\n\n\
    ```\noverflow: hidden;   /* 隐藏所有溢出 */\noverflow-x: hidden; /* 隐藏水平溢出 */\noverflow-y:\
    \ hidden; /* 隐藏垂直溢出 */\n```\n\n# `clip`\n\n如果将元素定位为 `absolute` 或 `fixed`，则 `clip`\
    \ 属性可将其裁剪为一个矩形。它使用名为 `rect()` 的 CSS 函数来指定裁剪区域。\n\n`clip (absolute | fixed) :`\
    \  \n  `auto | rect(<上>, <右>, <下>, <左>)`\n\n`rect()` 需要四个长度值，每个值之间用逗号分隔。这些值是相对于元素的左上角而言的。图\
    \ 21-1 所示的示例从应用该属性的元素中裁剪并显示一个 200 x 400 像素的区域。\n\n```\n.myclip {\n  position:\
    \ absolute;\n  clip: rect(100px, 500px, 300px, 100px);\n}\n```\n\n![A978-1-4302-6491-0_21_Fig1_HTML.jpg](img/A978-1-4302-6491-0_21_Fig1_HTML.jpg)\
    \  \n图 21-1. 阴影区域被移除\n\n关键字 `auto` 可用于右侧或底部的值，分别表示元素的完整宽度或高度。此关键字也是 `clip` 属性的默认值，这意味着元素不会被裁剪。\n\
    \n```\n/* 从左侧和顶部移除 100px */\nclip: rect(100px, auto, auto, 100px);\n/* 无裁剪 */\n\
    clip: auto;\n```\n\n为了支持 IE7 及更低版本，需要省略 `rect()` 函数中的逗号。所有主流浏览器都支持这种非标准语法。\n\n\
    ```\n/* 向后兼容 IE4-7 的语法 */\nclip: rect(100px 500px 300px 100px);\n```\n\n# `z-index`\n\
    \n相互重叠的定位元素通常根据它们在 Web 文档中的顺序进行分层。这种自然的堆叠顺序可以通过 `z-index` 属性来改变。\n\n`z-index (已定位元素)\
    \ : auto | <整数>`\n\n`z-index` 属性接受正整数或负整数作为其值，表示堆叠顺序。值较高的元素位于值较低的元素前面，如下例所示：\n\
    \n```\n<img src=\"ace-of-hearts.png\" style=\"\n  position: absolute;\n  left:\
    \ 0;\n  top: 0;\n  z-index: 1;\">\n<img src=\"ace-of-spades.png\" style=\"\n \
    \ position: absolute;\n  left: 100px;\n  top: 100px;\n  z-index: 0;\">\n```\n\n\
    在这个如图 21-2 所示的示例中，红心 A 因为其较高的堆叠顺序而被层叠在黑桃 A 之上。\n\n![A978-1-4302-6491-0_21_Fig2_HTML.jpg](img/A978-1-4302-6491-0_21_Fig2_HTML.jpg)\
    \  \n图 21-2. 自定义堆叠顺序\n\n# `vertical-align`\n\n可以使用 `vertical-align` 属性来控制文本和内联元素在一行内的垂直对齐方式。此属性也可用于表格单元格元素。\n\
    \n`vertical-align (内联 | 表格单元格) :`  \n  `baseline | <长度> | <百分比> | top | middle\
    \ |`  \n  `bottom | text-top | text-bottom | super | sub`\n\n默认情况下，文本和内联元素（如图像）的底部在基线上对齐，基线是所有字母所在的一条隐形线。值\
    \ `top` 和 `bottom` 分别将图像与行的顶部和底部对齐。不太直观的是 `middle` 值，它将图像的中间与父元素中小写字母的中间对齐。这些常见对齐值的渲染效果如图\
    \ 21-3 所示。\n\n![A978-1-4302-6491-0_21_Fig3_HTML.jpg](img/A978-1-4302-6491-0_21_Fig3_HTML.jpg)\
    \  \n图 21-3. 常见的垂直对齐值\n\n`vertical-align` 还有两个较少使用的值：`text-bottom` 和 `text-top`。`text-bottom`\
    \ 值将元素的底部与文本的底部对齐。与之相反，`text-top` 值将元素的顶部与文本的顶部对齐。还有 `sub` 和 `super` 值，它们分别将元素对齐到下标和上标位置。使用这些值的结果如图\
    \ 21-4 所示。\n\n![A978-1-4302-6491-0_21_Fig4_HTML.jpg](img/A978-1-4302-6491-0_21_Fig4_HTML.jpg)\
    \  \n图 21-4. 其他垂直对齐值\n\n元素还可以通过长度值或百分比值来提升（正值）或降低（负值）。百分比和长度值都从基线开始计算；百分比值是相对于行高而言的。\n\
    \n```\n/* 将文本段对齐到常规文本下方 5 像素处 */\n常规 <span style=\"vertical-align: -5px;\">降低</span>\n\
    ```\n\n当应用于表格单元格元素 `<th>` 和 `<td>` 时，`vertical-align` 属性的行为类似于 HTML 中已弃用的 `valign`\
    \ 属性。表格单元格的有效值为 `baseline`、`bottom`、`middle` 和 `top`。其他值（包括长度和百分比）不应与表格单元格一起使用。\n\
    \n`top` 值将单元格的上内边距边缘与行的顶部对齐。同样，`bottom` 值将单元格的下内边距边缘与行的底部对齐。更值得注意的是，`baseline`\
    \ 值对齐单元格的内容，使其与进行基线对齐的其他单元格共享相同的基线。\n\n与默认值为 `baseline` 的内联元素相反，表格单元格元素通常居中对齐。对于表格单元格，`middle`\
    \ 值的行为更直观，它将单元格的内边距框在行中居中对齐，从而使单元格的内容看起来居中。\n\n在以下示例中，表格单元格元素垂直对齐到底部：\n\n```\n\
    <table>\n  <tr>\n    <td style=\"vertical-align: bottom;\">底部</td>\n  </tr>\n\
    </table>\n```\n\n# 居中\n\n在 CSS 中有几种方法可以使元素居中。一种常见的方法是使用值为 `center` 的 `text-align`\
    \ 属性。\n\n```\n.text-center { text-align: center; }\n```\n\n通过将此属性应用于包含元素，其中的文本将居中对齐。\n\
    \n```\n<p class=\"text-center\">居中文本</p>\n```\n\n这种方法适用于文本和内联元素，但不适用于块级元素。要使块级元素居中，可以将左右外边距设置为\
    \ `auto`，这会使水平外边距相等，从而使块居中。\n\n```\n.box-center { margin: 0 auto; }\n```\n\n请记住，要使块级元素看起来居中，其宽度必须是固定的，不能是弹性的；否则，它会占据所有可用宽度。\n\
    \n```\n<div style=\"width: 50px; height: 50px;\n            border: 1px solid\
    \ black;\"\n     class=\"box-center\"></div>\n```\n\n对于垂直居中，将内容对齐到中间的最简单方法是在父元素上使用\
    \ `vertical-align` 属性，并将其值设置为 `middle`。这种行为仅在表格单元格元素中按预期工作，因此需要将容器更改为表格单元格，如以下使用\
    \ `display` 属性的示例所示：\n\n```\n<div style=\"vertical-align: middle;\n          \
    \  display: table-cell;\n            min-height: 100px;\">居中</div>\n```\n\n# 22.\
    \ 分类\n\n分类属性指定了元素的显示方式以及是否可见。\n"
- fmt: "# display\n\n`display`属性决定了包围元素的盒子类型。它可以使任何元素显示为内联、块级或其他任何类型。每个元素都有一个默认的`display`值，该值取决于元素的类型。\n\
    \n`display : none | inline | block | list-item | inline-block |`\n`inline-table\
    \ | table | table-cell | table-row |`\n`table-column | table-column-group | table-footer-group\
    \ |`\n`table-header-group | table-row-group | flex | inline-flex |`\n`grid | inline-grid\
    \ | run-in`\n\n大多数HTML元素显示为内联或块级；其他元素具有特殊的显示属性，例如`<li>`元素的`list-item`和`<td>`、`<th>`元素的`table-cell`。通过使用`display`属性，任何元素都可以被更改为渲染为这些或其他任何元素类型。例如，以下链接被渲染为块级元素而不是内联元素：\n\
    \n`<a href=\"#\" style=\"display: block;\">Block link</a>`\n\n`display`最有用的值之一是`inline-block`，它结合了块级和内联元素的特性。`inline-block`元素类似于内联元素，但不同之处在于它也可以像块级元素一样操作盒子模型的宽度、高度和垂直边距属性。这些特性与可替换的内联元素（如`<img>`和`<button>`）相同。因此，这些元素在HTML5中被正式重新定义为`inline-block`元素。\n\
    \n`inline-block`的一个常见应用是将列表项元素（`<li>`）制作成适合水平导航菜单的样式。请注意，将列表项元素的显示类型从`list-item`更改为`inline-block`会自动移除列表标记。\n\
    \n```\nli {\n    display: inline-block;\n    width: 100px;\n    background: #ccc;\n\
    }\n```\n\n应用此规则后，以下标记会渲染出三个并排的灰色背景框，如图[22-1](#A978-1-4302-6491-0_22_Chapter.html#Fig1)所示。\n\
    \n```\n<ul>\n    <li>Item one</li>\n    <li>Item two</li>\n    <li>Item three</li>\n\
    </ul>\n```\n\n![A978-1-4302-6491-0_22_Fig1_HTML.jpg](A978-1-4302-6491-0_22_Fig1_HTML.jpg)\n\
    \nFigure 22-1. `inline-block`值演示\n\n另一个有用的`display`值是`none`。它完全隐藏一个元素，使页面渲染得像该元素不存在一样。\n\
    \n```\n.removed { display: none; }\n```\n\n# visibility\n\n`visibility`属性可以通过将其值设置为`hidden`来隐藏元素，而无需移除其占用的空间。\n\
    \n`visibility (block) : inherit | visible | hidden | collapse`\n\n`collapse`值旨在仅用于某些表格元素：行（`<tr>`）、列（`<col>`）、列组（`<colgroup>`）以及行组（`<thead>`、`<tbody>`和`<tfoot>`）。根据规范，`collapse`应移除隐藏的元素（如同`display:\
    \ none`）并使该空间可供其他元素使用。遗憾的是，并非所有主流浏览器都遵循此值的规范。将`display`属性设置为`none`会带来更一致的浏览器行为，因此应优先使用。\n\
    \n# opacity\n\n`opacity`属性可以使元素及其内容透明。\n\n`opacity : <number>`\n\n使用0.0到1.0之间的十进制值来设置透明度。值为1时，元素不透明；值为0时，元素完全透明（不可见）。\n\
    \n```\n.half-transparent { opacity: 0.5; }\n```\n\nChrome 1+、Firefox 1+、IE9+、Safari\
    \ 1.2+ 和 Opera 9+ 支持此CSS3属性。使用以下滤镜可以极大地增强IE支持：\n\n```\n.half-transparent {\n \
    \   filter: alpha(opacity=50); /* IE5-8 */\n    opacity: 0.5;\n}\n```\n\n# float\n\
    \n`float`属性将一个元素从其包含元素中分离出来，使其浮动在其上方，可以向左或向右浮动。它旨在使文本环绕图像，但也常用于制作布局。浮动一个内联元素会自动将其更改为块级元素。\n\
    \n`float : none | left | right`\n\n要使文本和其他内联内容环绕图像，您可以将其向左或向右浮动。\n\n`<img style=\"\
    float: left;\" src=\"myimage.png\" alt=\"\">`\n\n对于布局，浮动允许块级元素水平排列。例如，可以使用以下类创建盒子网格：\n\
    \n```\n.box {\n    float: left;\n    width: 100px;\n    height: 100px;\n    margin:\
    \ 0 1em;\n    background: #ccc;\n    border-radius: 10px;\n}\n```\n\n这个类使盒子水平堆叠，而不是垂直堆叠（块级元素的正常行为）（参见图[22-2](#A978-1-4302-6491-0_22_Chapter.html#Fig2)）。\n\
    \n```\n<div class=\"box\"></div>\n<div class=\"box\"></div>\n<div class=\"box\"\
    ></div>\n```\n\n![A978-1-4302-6491-0_22_Fig2_HTML.jpg](A978-1-4302-6491-0_22_Fig2_HTML.jpg)\n\
    \nFigure 22-2. 浮动的盒子\n\n使用浮动的一个副作用是，任何跟随这些浮动盒子的元素也会水平排列。`clear`属性旨在停止这种行为。\n\n\
    # clear\n\n`clear`属性用于清除元素左侧、右侧或两侧的浮动元素。\n\n`clear (block) : none | left | right\
    \ | both`\n\n此属性通常被赋予一个与属性同名的独立类。\n\n`.clear { clear: both; }`\n\n一个带有`clear`类的空`div`容器通常放置在浮动元素之后。这个清除元素会移动到浮动元素的下方，而不是出现在它们旁边。\n\
    \n`<div class=\"clear\"></div>`\n\n由于浮动布局往往复杂且脆弱，它们通常已被其他布局方法所取代，例如使用定位属性。\n\n\
    在前面给出的盒子对齐示例中，一个更好的替代方案是将盒子改为`inline-block`元素。这可以完成相同的任务，同时无需清除浮动元素。\n\n```\n\
    .box {\n    display: inline-block;\n    width: 100px;\n    height: 100px;\n  \
    \  margin: 0 1em;\n    background: #ccc;\n    border-radius: 10px;\n}\n```\n\n\
    # cursor\n\n`cursor`属性指定用户将鼠标悬停在元素上时看到的光标。默认值是`auto`，意味着浏览器决定使用什么光标。标准光标值及其外观可见于表[22-1](#A978-1-4302-6491-0_22_Chapter.html#Tab1)。\n\
    \nTable 22-1. 标准光标值\n\n![A978-1-4302-6491-0_22_Fig3_HTML.jpg](A978-1-4302-6491-0_22_Fig3_HTML.jpg)\n\
    \n除了这些值之外，还可以使用`url`函数定义自定义光标。如果此光标不可用，可以在自定义光标之后指定一个通用光标，用逗号分隔。\n\n`cursor: url(new.cur),\
    \ pointer;`\n\n# 23. List\n\nCSS列表属性处理列表元素，特别是`<ul>`、`<ol>`和`<li>`元素。"
  raw: '## display


    The `display` property determines the kind of box that surrounds an element. It
    can make any element appear as inline, block, or any other type. Every element
    has a default display value that depends on what type of element it is.


    `display : none | inline | block | list-item | inline-block |`


    `inline-table | table | table-cell | table-row |`


    `table-column | table-column-group | table-footer-group |`


    `table-header-group | table-row-group | flex | inline-flex |`


    `grid | inline-grid | run-in`


    Most HTML elements display as either inline or block; others have special display
    properties, such as `list-item` for the `<li>` element and `table-cell` for the
    `<td>` and `<th>` elements. By using the `display` property, any element can be
    changed to be rendered as these or any other element type. For instance, the following
    link is rendered as a block element instead of an inline element:


    `<a href="#" style="display: block;">Block link</a>`


    One of the more useful values for `display` is `inline-block`, which combines
    features of both block and inline. An `inline-block` element is like an inline
    element, except that it can also manipulate the width, height, and vertical margin
    properties of the box model as a block element does. These features are the same
    as those of replaced inline elements, such as `<img>` and `<button>`. As such,
    these elements were formally redefined as `inline-block` elements in HTML5.


    A common application of `inline-block` is to make list item elements (`<li>`)
    suitable for horizontal navigation menus. Note that changing the display type
    of the list item element from `list-item` to `inline-block` automatically removes
    the list marker.


    `li {`


    `display: inline-block;`


    `width: 100px;`


    `background: #ccc;`


    `}`


    With this rule in place, the following markup renders three boxes with gray backgrounds
    next to each other, as illustrated in Figure [22-1](#A978-1-4302-6491-0_22_Chapter.html#Fig1).


    `<ul>`


    `<li>Item one</li>`


    `<li>Item two</li>`


    `<li>Item three</li>`


    `</ul>`


    ![A978-1-4302-6491-0_22_Fig1_HTML.jpg](A978-1-4302-6491-0_22_Fig1_HTML.jpg)


    Figure 22-1.


    The inline-block value demonstrated


    Another useful `display` value is `none`. It completely hides an element, making
    the page render as if the element did not exist.


    `.removed { display: none; }`


    ## visibility


    The `visibility` property can hide an element without removing the space it occupies
    by setting the property''s value to `hidden`.


    `visibility (block) : inherit | visible | hidden | collapse`


    The `collapse` value is meant to be used only on certain table elements: rows
    (`<tr>`), columns (`<col>`), column groups (`<colgroup>`), and row groups (`<thead>`,
    `<tbody>`, and `<tfoot>`). According to specification, `collapse` should remove
    the hidden element (same as `display: none`) and make the space available for
    other elements to claim. Regrettably, not all major browsers follow the specification
    for this value. Setting the `display` property to `none` results in more consistent
    browser behavior and should be used instead.


    ## opacity


    The `opacity` property can make an element and its content transparent.


    `opacity : <number>`


    A decimal value between 0.0 and 1.0 is used to set the transparency. With a value
    of 1, the element is opaque; 0 renders the element fully transparent, or invisible.


    `.half-transparent { opacity: 0.5; }`


    Support for this CSS 3 property is included in Chrome 1+, Firefox 1+, IE9+, Safari
    1.2+, and Opera 9+. IE support can be greatly enhanced using the following filter:


    `.half-transparent {`


    `filter: alpha(opacity=50); /* IE5-8 */`


    `opacity: 0.5;`


    `}`


    ## float


    The `float` property detaches an element from its containing element and makes
    it float on top of it, either to the left or right side. It is intended for wrapping
    text around images, but is also commonly used for making layouts. Floating an
    inline element automatically changes it into a block element.


    `float : none | left | right`


    To have text and other inline content wrap around an image, you can float it to
    the left or right.


    `<img style="float: left;" src="myimage.png" alt="">`


    As for layouts, floats allow block elements to be lined up horizontally. For instance,
    a grid of boxes can be created with the following class:


    `.box {`


    `float: left;`


    `width: 100px;`


    `height: 100px;`


    `margin: 0 1em;`


    `background: #ccc;`


    `border-radius: 10px;`


    `}`


    This class makes boxes stack up horizontally instead of vertically, which is the
    normal behavior for block elements (see Figure [22-2](#A978-1-4302-6491-0_22_Chapter.html#Fig2)).


    `<div class="box"></div>`


    `<div class="box"></div>`


    `<div class="box"></div>`


    ![A978-1-4302-6491-0_22_Fig2_HTML.jpg](A978-1-4302-6491-0_22_Fig2_HTML.jpg)


    Figure 22-2.


    Floated boxes


    A side effect of using floats is that any element that follows these floated boxes
    also lines up horizontally. The `clear` property is designed to stop this behavior.


    ## clear


    The `clear` property is used to clear floating elements from the left, right,
    or both sides of an element.


    `clear (block) : none | left | right | both`


    This property is commonly given its own class that has the same name as the property.


    `.clear { clear: both; }`


    An empty `div` container with the `clear` class is typically placed after the
    floated elements. This cleared element is moved below the floating elements instead
    of appearing next to them.


    `<div class="clear"></div>`


    Because floated layouts tend to be complex and fragile, they have generally been
    superseded by other layout methods, such as the use of the positioning properties.


    In the box-aligning example given earlier, a better alternative is to change the
    box to an `inline-block` element. This accomplishes the same task, while removing
    the need to clear the floated elements.


    `.box {`


    `display: inline-block;`


    `width: 100px;`


    `height: 100px;`


    `margin: 0 1em;`


    `background: #ccc;`


    `border-radius: 10px;`


    `}`


    ## cursor


    The `cursor` property specifies what cursor users see when they hover over an
    element. The default value is `auto`, meaning that the browser decides what cursor
    to use. Standard cursor values and their appearance can be seen in Table [22-1](#A978-1-4302-6491-0_22_Chapter.html#Tab1).


    Table 22-1.


    Standard cursor values


    ![A978-1-4302-6491-0_22_Fig3_HTML.jpg](A978-1-4302-6491-0_22_Fig3_HTML.jpg)


    In addition to these values, custom cursors can be defined using the `url` function.
    If this cursor is not available, a generic cursor can be specified after the custom
    one, separated by a comma.


    `cursor: url(new.cur), pointer;`


    # 23. List


    The CSS list properties deal with the list elements, specifically the `<ul>`,
    `<ol>`, and `<li>` elements.'
  trans: "\n# 显示（display）\n\n`display`属性决定了包围元素的盒子类型。它可以使任何元素显示为内联、块级或其他任何类型。每个元素都有一个默认的`display`值，该值取决于元素的类型。\n\
    \n`display : none | inline | block | list-item | inline-block |`\n`inline-table\
    \ | table | table-cell | table-row |`\n`table-column | table-column-group | table-footer-group\
    \ |`\n`table-header-group | table-row-group | flex | inline-flex |`\n`grid | inline-grid\
    \ | run-in`\n\n大多数 HTML 元素显示为内联或块级；其他元素具有特殊的显示属性，例如`<li>`元素的`list-item`和`<td>`、`<th>`元素的`table-cell`。通过使用`display`属性，任何元素都可以被更改为渲染为这些或其他任何元素类型。例如，以下链接被渲染为块级元素而不是内联元素：\n\
    \n`<a href=\"#\" style=\"display: block;\">块级链接</a>`\n\n`display`最有用的值之一是`inline-block`，它结合了块级和内联元素的特性。`inline-block`元素类似于内联元素，但不同之处在于它也可以像块级元素一样操作盒子模型的宽度、高度和垂直边距属性。这些特性与可替换的内联元素（如`<img>`和`<button>`）相同。因此，这些元素在\
    \ HTML5 中被正式重新定义为`inline-block`元素。\n\n`inline-block`的一个常见应用是将列表项元素（`<li>`）制作成适合水平导航菜单的样式。请注意，将列表项元素的显示类型从`list-item`更改为`inline-block`会自动移除列表标记。\n\
    \n```\nli {\n    display: inline-block;\n    width: 100px;\n    background: #ccc;\n\
    }\n```\n\n应用此规则后，以下标记会渲染出三个并排的灰色背景框，如图 22-1 所示。\n\n```\n<ul>\n    <li>项目一</li>\n\
    \    <li>项目二</li>\n    <li>项目三</li>\n</ul>\n```\n\n![A978-1-4302-6491-0_22_Fig1_HTML.jpg](img/A978-1-4302-6491-0_22_Fig1_HTML.jpg)\n\
    \n图 22-1. `inline-block`值演示\n\n另一个有用的`display`值是`none`。它完全隐藏一个元素，使页面渲染得像该元素不存在一样。\n\
    \n```\n.removed { display: none; }\n```\n\n# 可见性（visibility）\n\n`visibility`属性可以通过将其值设置为`hidden`来隐藏元素，而无需移除其占用的空间。\n\
    \n`visibility (block) : inherit | visible | hidden | collapse`\n\n`collapse`值旨在仅用于某些表格元素：行（`<tr>`）、列（`<col>`）、列组（`<colgroup>`）以及行组（`<thead>`、`<tbody>`和`<tfoot>`）。根据规范，`collapse`应移除隐藏的元素（如同`display:\
    \ none`）并使该空间可供其他元素使用。遗憾的是，并非所有主流浏览器都遵循此值的规范。将`display`属性设置为`none`会带来更一致的浏览器行为，因此应优先使用。\n\
    \n# 不透明度（opacity）\n\n`opacity`属性可以使元素及其内容透明。\n\n`opacity : <number>`\n\n使用 0.0\
    \ 到 1.0 之间的十进制值来设置透明度。值为 1 时，元素不透明；值为 0 时，元素完全透明（不可见）。\n\n```\n.half-transparent\
    \ { opacity: 0.5; }\n```\n\nChrome 1+、Firefox 1+、IE9+、Safari 1.2+ 和 Opera 9+ 支持此\
    \ CSS3 属性。使用以下滤镜可以极大地增强 IE 支持：\n\n```\n.half-transparent {\n    filter: alpha(opacity=50);\
    \ /* IE5-8 */\n    opacity: 0.5;\n}\n```\n\n# 浮动（float）\n\n`float`属性将一个元素从其包含元素中分离出来，使其浮动在其上方，可以向左或向右浮动。它旨在使文本环绕图像，但也常用于制作布局。浮动一个内联元素会自动将其更改为块级元素。\n\
    \n`float : none | left | right`\n\n要使文本和其他内联内容环绕图像，您可以将其向左或向右浮动。\n\n`<img style=\"\
    float: left;\" src=\"myimage.png\" alt=\"\">`\n\n对于布局，浮动允许块级元素水平排列。例如，可以使用以下类创建盒子网格：\n\
    \n```\n.box {\n    float: left;\n    width: 100px;\n    height: 100px;\n    margin:\
    \ 0 1em;\n    background: #ccc;\n    border-radius: 10px;\n}\n```\n\n这个类使盒子水平堆叠，而不是垂直堆叠（块级元素的正常行为）（参见图\
    \ 22-2）。\n\n```\n<div class=\"box\"></div>\n<div class=\"box\"></div>\n<div class=\"\
    box\"></div>\n```\n\n![A978-1-4302-6491-0_22_Fig2_HTML.jpg](img/A978-1-4302-6491-0_22_Fig2_HTML.jpg)\n\
    \n图 22-2. 浮动的盒子\n\n使用浮动的一个副作用是，任何跟随这些浮动盒子的元素也会水平排列。`clear`属性旨在停止这种行为。\n\n# 清除（clear）\n\
    \n`clear`属性用于清除元素左侧、右侧或两侧的浮动元素。\n\n`clear (block) : none | left | right | both`\n\
    \n此属性通常被赋予一个与属性同名的独立类。\n\n`.clear { clear: both; }`\n\n一个带有`clear`类的空`div`容器通常放置在浮动元素之后。这个清除元素会移动到浮动元素的下方，而不是出现在它们旁边。\n\
    \n`<div class=\"clear\"></div>`\n\n由于浮动布局往往复杂且脆弱，它们通常已被其他布局方法所取代，例如使用定位属性。\n\n\
    在前面给出的盒子对齐示例中，一个更好的替代方案是将盒子改为`inline-block`元素。这可以完成相同的任务，同时无需清除浮动元素。\n\n```\n\
    .box {\n    display: inline-block;\n    width: 100px;\n    height: 100px;\n  \
    \  margin: 0 1em;\n    background: #ccc;\n    border-radius: 10px;\n}\n```\n\n\
    # 光标（cursor）\n\n`cursor`属性指定用户将鼠标悬停在元素上时看到的光标。默认值是`auto`，意味着浏览器决定使用什么光标。标准光标值及其外观可见于表\
    \ 22-1。\n\n表 22-1. 标准光标值\n\n![A978-1-4302-6491-0_22_Fig3_HTML.jpg](img/A978-1-4302-6491-0_22_Fig3_HTML.jpg)\n\
    \n除了这些值之外，还可以使用`url`函数定义自定义光标。如果此光标不可用，可以在自定义光标之后指定一个通用光标，用逗号分隔。\n\n`cursor: url(new.cur),\
    \ pointer;`\n\n# 23. 列表（List）\n\nCSS 列表属性处理列表元素，特别是`<ul>`、`<ol>`和`<li>`元素。\n"
- fmt: "# `list-style-type`\n\nLists are rendered with a marker shown before each\
    \ list item element (`<li>`). The appearance of this marker can be changed using\
    \ the `list-style-type` property. For an unordered list (`<ul>`), each list item\
    \ is marked in the same way. The predefined bullet values shown here can be used,\
    \ with `disc` (a filled circle) as the default value:\n\n`list-style-type : inherit\
    \ | disc | circle | square | none`\n\nIn an ordered list (`<ol>`), each list item\
    \ is marked with a numeric character to show its position in the sequence. All\
    \ major browsers support the following numeric types, with `decimal` as the initial\
    \ value:\n\n`list-style-type : inherit | decimal | none | upper-alpha | lower-alpha\
    \ | upper-roman | lower-roman | lower-greek | lower-latin | armenian | georgian\
    \ | decimal-leading-zero`\n\nThe following example assigns a new list style for\
    \ the two list elements. It is possible to make the `<ul>` display ordered markers\
    \ and the `<ol>` to display unordered markers, but this is not good practice.\n\
    \n```\nul { list-style-type: square; } /* ▅ */\nol { list-style-type: upper-roman;\
    \ } /* I, II, III, ... */\n```\n\nThe color of the marker is the same as the text\
    \ color of the list element. Keep in mind that any element can be made to display\
    \ list markers by changing its display type to `list-item`.\n\n# `list-style-image`\n\
    \nAs an alternative to the predefined markers, using the `list-style-image` property\
    \ allows a custom image to be used as the list bullet.\n\n`list-style-image :\
    \ inherit | none | url(<url>)`\n\nThe image path is specified inside of the CSS\
    \ `url` function.\n\n`list-style-image: url(my-bullet.png)`\n\nThis property overshadows\
    \ any marker type selected with the `list-style-type` property. Even so, it is\
    \ a good idea to specify a `list-style-type` as a fallback in case the custom\
    \ bullet image is unavailable for any reason.\n\n# `list-style-position`\n\nThe\
    \ list marker is normally positioned outside of the element box. `list-style-position`\
    \ provides an alternative: to place the bullet inside of the element box.\n\n\
    `list-style-position : inherit | outside | inside`\n\nSelecting `outside` aligns\
    \ each line of text with the start of the first line, whereas `inside` causes\
    \ successive lines of text to wrap underneath the marker. The `inside` value also\
    \ visually indents the marker, as shown in Figure [23-1](#A978-1-4302-6491-0_23_Chapter.html#Fig1).\n\
    \n![A978-1-4302-6491-0_23_Fig1_HTML.jpg](A978-1-4302-6491-0_23_Fig1_HTML.jpg)\n\
    \nFigure 23-1. Outside and inside marker placement\n\n# `list-style`\n\n`list-style`\
    \ is the shorthand property for setting all the list properties. The values can\
    \ be set in any order because there is no ambiguity between them. Any one of the\
    \ values can also be omitted, in which case the default value for that property\
    \ is used.\n\n`list-style : <list-style-type> + <list-style-image> + <list-style-position>`\n\
    \nIn the following example, the `type` and `position` values of the `list-style`\
    \ are set, which are inherited to the list items.\n\n```\n<ul style=\"list-style:\
    \ inside square;\">\n  <li>Apple</li>\n  <li>Orange</li>\n  <li>Pear</li>\n</ul>\n\
    ```\n\nKeep in mind that list properties can not only style the list containers\
    \ `<ul>` and `<ol>` but also style an individual list item `<li>`.\n\n# Counters\n\
    \nElements can be numbered automatically in CSS using the `counter-increment`\
    \ and `counter-reset` properties. The `counter-reset` property specifies the name\
    \ of the counter. It is optionally followed by the counter’s initial value, which\
    \ is zero by default.\n\n```\n/* Create a counter named chapter */\nbody { counter-reset:\
    \ chapter; }\n```\n\nThe `counter-increment` property takes the counter’s name\
    \ followed by an optional number. The number, which sets how much the counter\
    \ is incremented for every occurrence of the element, is 1 by default.\n\n```\n\
    /* Increment the counter at each <h1> */\nh1:before { counter-increment: chapter;\
    \ }\n```\n\nThe final step of creating a counter is to display it by using the\
    \ CSS `counter()` function with the name of the counter as its argument. In this\
    \ example, the chapter number is shown before the `<h1>` elements:\n\n```\n/*\
    \ Increment and display the counter */\nh1:before {\n  content: \"Chapter \" counter(chapter)\
    \ \" - \";\n  counter-increment: chapter;\n}\n```\n\nThe counter now adds the\
    \ chapter number before `<h1>` elements.\n\n```\n<h1>First</h1>  <!-- Chapter\
    \ 1 - First -->\n<h1>Second</h1> <!-- Chapter 2 - Second -->\n<h1>Third</h1> \
    \ <!-- Chapter 3 - Third -->\n```\n\nAnother counter can be added to also enumerate\
    \ `<h2>` subheadings. This counter is here reset to zero at every `<h1>` element:\n\
    \n```\nh2:before {\n  content: counter(chapter) \".\" counter(section) \" \";\n\
    \  counter-increment: section;\n}\nh1 { counter-reset: section; }\n```\n\nThe\
    \ following example illustrates how the counters are displayed:\n\n```\n<h1>Head</h1>\
    \ <!-- Chapter 1 - Head -->\n<h2>Sub</h2>  <!-- 1.1 Sub -->\n<h2>Sub</h2>  <!--\
    \ 1.2 Sub -->\n<h1>Head</h1> <!-- Chapter 2 - Head -->\n<h2>Sub</h2>  <!-- 2.1\
    \ Sub -->\n```\n\n## Nesting counters\n\nCSS counters can be nested any number\
    \ of levels deep. These nested counters can be combined and displayed using a\
    \ CSS function called `counters()`. The function’s first argument is the counter\
    \ name, and the second is a string that separates each counter.\n\n```\nul { counter-reset:\
    \ item; }\nli:before {\n  content: counters(item, \".\") \" \";\n  counter-increment:\
    \ item;\n}\n```\n\nThese rules apply to the following unordered lists (note that\
    \ a new counter instance is automatically created for every nested list):\n\n\
    ```\n<ul>\n  <li>item</li>   <!-- 1 item -->\n  <li>item</li>   <!-- 2 item -->\n\
    \  <ul>\n    <li>item</li> <!-- 2.1 item -->\n    <li>item</li> <!-- 2.2 item\
    \ -->\n  </ul>\n</ul>\n```\n\nCounters are supported in all major browsers, including\
    \ all versions of Chrome, Firefox, Safari, and Opera, as well as IE8+.\n\n# 24.\
    \ Table\n\nCSS has a number of properties that are used specifically with table\
    \ elements. These properties offer control over how browsers render tabular data.\n\
    \n## `border-spacing`\n\nThe distance between the borders of adjacent table cells\
    \ can be changed with the `border-spacing` property, which is the CSS equivalent\
    \ of the `cellspacing` attribute in HTML. W3C defines the initial value for this\
    \ property as 0, but most browsers render it as 2px by default.\n\n`border-spacing\
    \ : inherit | <length> [<length>]`\n\nThis property can be specified with either\
    \ one or two length values. With two values, the first one sets the horizontal\
    \ spacing, and the second one sets the vertical spacing.\n\n```\n.spacing {\n\
    \  border-spacing: 5px 10px;\n}\n```\n\n`border-spacing` is a property of the\
    \ table, not the cells, so it is applied to the `<table>` element as in the following\
    \ example:\n\n```\n<table class=\"spacing\">\n  <caption>My Table</caption>\n\
    \  <tr>\n    <td>1st cell, 1st row</td>\n    <td>2nd cell, 1st row</td>\n  </tr>\n\
    \  <tr>\n    <td>1st cell, 2nd row</td>\n    <td>2nd cell, 2nd row</td>\n  </tr>\n\
    </table>\n```\n\nThis table is illustrated in Figure [24-1](#A978-1-4302-6491-0_24_Chapter.html#Fig1),\
    \ with a solid border applied to the `<td>` elements.\n\n![A978-1-4302-6491-0_24_Fig1_HTML.jpg](A978-1-4302-6491-0_24_Fig1_HTML.jpg)\n\
    \nFigure 24-1. Example table\n\nTable cells have borders and padding, but they\
    \ do not have any margins; they have `border-spacing` instead. Padding works the\
    \ same as for other elements and behaves like the `cellpadding` attribute in HTML.\n\
    \n## `border-collapse`\n\nThe `border-collapse` property determines whether the\
    \ table borders are collapsed into a single border or separated.\n\n`border-collapse\
    \ : inherit | separate | collapse`\n\nNormally, table cells have their own distinct\
    \ borders and are separated by the distance set with the `border-spacing` property.\
    \ If the borders are set to collapse instead, the cells share borders, and any\
    \ value for the `border-spacing` property is ignored.\n\n```\ntable { border-collapse:\
    \ collapse; }\n```"
  raw: '## list-style-type


    Lists are rendered with a marker shown before each list item element (`<li>`).
    The appearance of this marker can be changed using the `list-style-type` property.
    For an unordered list (`<ul>`), each list item is marked in the same way. The
    predefined bullet values shown here can be used, with `disc` (a filled circle)
    as the default value:


    `list-style-type : inherit | disc | circle | square | none`


    In an ordered list (`<ol>`), each list item is marked with a numeric character
    to show its position in the sequence. All major browsers support the following
    numeric types, with `decimal` as the initial value:


    `list-style-type : inherit | decimal | none | upper-alpha | lower-alpha |                   upper-roman
    |`


    `lower-roman | lower-greek | lower-latin |                   armenian | georgian
    |`


    `decimal-leading-zero`


    The following example assigns a new list style for the two list elements. It is
    possible to make the `<ul>` display ordered markers and the `<ol>` to display
    unordered markers, but this is not good practice.


    `ul { list-style-type: square; } /*` ▅ `*/`


    `ol { list-style-type: upper-roman; } /* I, II, III,` ... `*/`


    The color of the marker is the same as the text color of the list element. Keep
    in mind that any element can be made to display list markers by changing its display
    type to `list-item`.


    ## list-style-image


    As an alternative to the predefined markers, using the `list-style-image` property
    allows a custom image to be used as the list bullet.


    `list-style-image : inherit | none | url(<url>)`


    The image path is specified inside of the CSS `url` function.


    `list-style-image: url(my-bullet.png)`


    This property overshadows any marker type selected with the `list-style-type`
    property. Even so, it is a good idea to specify a `list-style-type` as a fallback
    in case the custom bullet image is unavailable for any reason.


    ## list-style-position


    The list marker is normally positioned outside of the element box. `list-style-position`
    provides an alternative: to place the bullet inside of the element box.


    `list-style-position : inherit | outside | inside`


    Selecting `outside` aligns each line of text with the start of the first line,
    whereas `inside` causes successive lines of text to wrap underneath the marker.
    The `inside` value also visually indents the marker, as shown in Figure [23-1](#A978-1-4302-6491-0_23_Chapter.html#Fig1).


    ![A978-1-4302-6491-0_23_Fig1_HTML.jpg](A978-1-4302-6491-0_23_Fig1_HTML.jpg)


    Figure 23-1.


    Outside and inside marker placement


    ## list-style


    `list-style`is the shorthand property for setting all the list properties. The
    values can be set in any order because there is no ambiguity between them. Any
    one of the values can also be omitted, in which case the default value for that
    property is used.


    `list-style : <list-style-type> + <list-style-image> + <list-style-position>`


    In the following example, the `type` and `position` values of the `list-style`
    are set, which are inherited to the list items.


    `<ul style="list-style: inside square;">`


    `<li>Apple</li>`


    `<li>Orange</li>`


    `<li>Pear</li>`


    `</ul>`


    Keep in mind that list properties can not only style the list containers `<ul>`
    and `<ol>` but also style an individual list item `<li>`.


    ## Counters


    Elements can be numbered automatically in CSS using the `counter-increment` and
    `counter-reset` properties. The `counter-reset` property specifies the name of
    the counter. It is optionally followed by the counter’s initial value, which is
    zero by default.


    `/* Create a counter named chapter */`


    `body { counter-reset: chapter; }`


    The `counter-increment` property takes the counter’s name followed by an optional
    number. The number, which sets how much the counter is incremented for every occurrence
    of the element, is 1 by default.


    `/* Increment the counter at each <h1> */`


    `h1:before { counter-increment: chapter; }`


    The final step of creating a counter is to display it by using the CSS `counter()`
    function with the name of the counter as its argument. In this example, the chapter
    number is shown before the `<h1>` elements:


    `/* Increment and display the counter */`


    `h1:before {`


    `content: "Chapter " counter(chapter) " - ";`


    `counter-increment: chapter;`


    `}`


    The counter now adds the chapter number before `<h1>` elements.


    `<h1>First</h1>  <!-- Chapter 1 - First -->`


    `<h1>Second</h1> <!-- Chapter 2 - Second -->`


    `<h1>Third</h1>  <!-- Chapter 3 - Third -->`


    Another counter can be added to also enumerate `<h2>` subheadings. This counter
    is here reset to zero at every `<h1>` element:


    `h2:before {`


    `content: counter(chapter) "." counter(section) " ";`


    `counter-increment: section;`


    `}`


    `h1 { counter-reset: section; }`


    The following example illustrates how the counters are displayed:


    `<h1>Head</h1> <!-- Chapter 1 - Head -->`


    `<h2>Sub</h2>  <!-- 1.1 Sub -->`


    `<h2>Sub</h2>  <!-- 1.2 Sub -->`


    `<h1>Head</h1> <!-- Chapter 2 - Head -->`


    `<h2>Sub</h2>  <!-- 2.1 Sub -->`


    ## Nesting counters


    CSS counters can be nested any number of levels deep. These nested counters can
    be combined and displayed using a CSS function called `counters()`. The function’s
    first argument is the counter name, and the second is a string that separates
    each counter.


    `ul { counter-reset: item; }`


    `li:before {`


    `content: counters(item, ".") " ";`


    `counter-increment: item;`


    `}`


    These rules apply to the following unordered lists (note that a new counter instance
    is automatically created for every nested list):


    `<ul>`


    `<li>item</li>   <!-- 1 item -->`


    `<li>item</li>   <!-- 2 item -->`


    `<ul>`


    `<li>item</li> <!-- 2.1 item -->`


    `<li>item</li> <!-- 2.2 item -->`


    `</ul>`


    `</ul>`


    Counters are supported in all major browsers, including all versions of Chrome,
    Firefox, Safari, and Opera, as well as IE8+.


    # 24. Table


    CSS has a number of properties that are used specifically with table elements.
    These properties offer control over how browsers render tabular data.


    ## border-spacing


    The distance between the borders of adjacent table cells can be changed with the
    `border-spacing` property, which is the CSS equivalent of the `cellspacing` attribute
    in HTML. W3C defines the initial value for this property as 0, but most browsers
    render it as 2px by default.


    `border-spacing : inherit | <length> [<length>]`


    This property can be specified with either one or two length values. With two
    values, the first one sets the horizontal spacing, and the second one sets the
    vertical spacing.


    `.spacing {`


    `border-spacing: 5px 10px;`


    `}`


    `border-spacing` is a property of the table, not the cells, so it is applied to
    the `<table>` element as in the following example:


    `<table class="spacing">`


    `<caption>My Table</caption>`


    `<tr>`


    `<td>1st cell, 1st row</td>`


    `<td>2nd cell, 1st row</td>`


    `</tr>`


    `<tr>`


    `<td>1st cell, 2nd row</td>`


    `<td>2nd cell, 2nd row</td>`


    `</tr>`


    `</table>`


    This table is illustrated in Figure [24-1](#A978-1-4302-6491-0_24_Chapter.html#Fig1),
    with a solid border applied to the `<td>` elements.


    ![A978-1-4302-6491-0_24_Fig1_HTML.jpg](A978-1-4302-6491-0_24_Fig1_HTML.jpg)


    Figure 24-1.


    Example table


    Table cells have borders and padding, but they do not have any margins; they have
    `border-spacing` instead. Padding works the same as for other elements and behaves
    like the `cellpadding` attribute in HTML.


    ## border-collapse


    The `border-collapse` property determines whether the table borders are collapsed
    into a single border or separated.


    `border-collapse : inherit | separate | collapse`


    Normally, table cells have their own distinct borders and are separated by the
    distance set with the `border-spacing` property. If the borders are set to collapse
    instead, the cells share borders, and any value for the `border-spacing` property
    is ignored.


    `table { border-collapse: collapse; }`'
  trans: "\n# `list-style-type`\n\n列表在每个列表项元素（`<li>`）前显示一个标记。该标记的外观可通过 `list-style-type`\
    \ 属性修改。对于无序列表（`<ul>`），每个列表项的标记方式相同。此处列出预定义的圆点值可供使用，默认值为 `disc`（实心圆）：\n\n`list-style-type\
    \ : inherit | disc | circle | square | none`\n\n在有序列表（`<ol>`）中，每个列表项前会显示一个数字字符以表明其在序列中的位置。所有主流浏览器均支持以下数字类型，初始值为\
    \ `decimal`：\n\n`list-style-type : inherit | decimal | none | upper-alpha | lower-alpha\
    \ | upper-roman | lower-roman | lower-greek | lower-latin | armenian | georgian\
    \ | decimal-leading-zero`\n\n以下示例为两个列表元素指定了新的列表样式。虽然可以让 `<ul>` 显示有序标记，让 `<ol>`\
    \ 显示无序标记，但这不是好的做法。\n\n```\nul { list-style-type: square; } /* ▅ */\nol { list-style-type:\
    \ upper-roman; } /* I, II, III, ... */\n```\n\n标记的颜色与列表元素的文本颜色相同。请记住，任何元素都可以通过将其\
    \ display 类型改为 `list-item` 来显示列表标记。\n\n# `list-style-image`\n\n作为预定义标记的替代方案，可使用\
    \ `list-style-image` 属性来将自定义图像作为列表圆点。\n\n`list-style-image : inherit | none |\
    \ url(<url>)`\n\n图像路径需写在 CSS 的 `url` 函数中。\n\n`list-style-image: url(my-bullet.png)`\n\
    \n该属性会覆盖 `list-style-type` 属性选定的任何标记类型。尽管如此，最好还是指定一个 `list-style-type` 作为后备方案，以防自定义圆点图像因任何原因不可用。\n\
    \n# `list-style-position`\n\n列表标记通常位于元素框外部。`list-style-position` 提供了一个替代方案：将圆点放置在元素框内部。\n\
    \n`list-style-position : inherit | outside | inside`\n\n选择 `outside` 会使每行文本与第一行文本的开头对齐，而\
    \ `inside` 则会使后续的文本行在标记下方换行。`inside` 值还会在视觉上缩进标记，如图 23-1 所示。\n\n![A978-1-4302-6491-0_23_Fig1_HTML.jpg](img/A978-1-4302-6491-0_23_Fig1_HTML.jpg)\n\
    \n图 23-1. 外部和内部标记放置\n\n# `list-style`\n\n`list-style` 是用于设置所有列表属性的简写属性。值可以按任意顺序设置，因为它们之间没有歧义。任何一个值也可以省略，此时将使用该属性的默认值。\n\
    \n`list-style : <list-style-type> + <list-style-image> + <list-style-position>`\n\
    \n在以下示例中，设置了 `list-style` 的 `type` 和 `position` 值，这些值会继承给列表项。\n\n```\n<ul style=\"\
    list-style: inside square;\">\n  <li>苹果</li>\n  <li>橙子</li>\n  <li>梨</li>\n</ul>\n\
    ```\n\n请记住，列表属性不仅可以样式化列表容器 `<ul>` 和 `<ol>`，还可以样式化单个列表项 `<li>`。\n\n# 计数器\n\n在 CSS\
    \ 中，可以使用 `counter-increment` 和 `counter-reset` 属性自动为元素编号。`counter-reset` 属性指定计数器的名称，后面可跟计数器的初始值，默认值为零。\n\
    \n```\n/* 创建一个名为 chapter 的计数器 */\nbody { counter-reset: chapter; }\n```\n\n`counter-increment`\
    \ 属性接受计数器的名称，后面可跟一个可选数字。该数字设定元素每次出现时计数器的增量，默认值为 1。\n\n```\n/* 在每个 <h1> 处递增计数器\
    \ */\nh1:before { counter-increment: chapter; }\n```\n\n创建计数器的最后一步是使用 CSS 的 `counter()`\
    \ 函数来显示它，该函数参数为计数器的名称。在此示例中，章节编号会显示在 `<h1>` 元素之前：\n\n```\n/* 递增并显示计数器 */\nh1:before\
    \ {\n  content: \"第 \" counter(chapter) \" 章 - \";\n  counter-increment: chapter;\n\
    }\n```\n\n现在，计数器会在 `<h1>` 元素前添加章节编号。\n\n```\n<h1>第一章</h1>  <!-- 第 1 章 - 第一章 -->\n\
    <h1>第二章</h1> <!-- 第 2 章 - 第二章 -->\n<h1>第三章</h1>  <!-- 第 3 章 - 第三章 -->\n```\n\n\
    可以添加另一个计数器来为 `<h2>` 子标题编号。此计数器会在每个 `<h1>` 元素处重置为零：\n\n```\nh2:before {\n  content:\
    \ counter(chapter) \".\" counter(section) \" \";\n  counter-increment: section;\n\
    }\nh1 { counter-reset: section; }\n```\n\n以下示例展示了计数器的显示方式：\n\n```\n<h1>标题</h1>\
    \ <!-- 第 1 章 - 标题 -->\n<h2>子标题</h2>  <!-- 1.1 子标题 -->\n<h2>子标题</h2>  <!-- 1.2\
    \ 子标题 -->\n<h1>标题</h1> <!-- 第 2 章 - 标题 -->\n<h2>子标题</h2>  <!-- 2.1 子标题 -->\n```\n\
    \n## 嵌套计数器\n\nCSS 计数器可以任意层级地嵌套。这些嵌套的计数器可以使用名为 `counters()` 的 CSS 函数进行组合和显示。该函数的第一个参数是计数器名称，第二个参数是分隔每个计数器的字符串。\n\
    \n```\nul { counter-reset: item; }\nli:before {\n  content: counters(item, \"\
    .\") \" \";\n  counter-increment: item;\n}\n```\n\n这些规则适用于以下无序列表（注意，每个嵌套列表都会自动创建一个新的计数器实例）：\n\
    \n```\n<ul>\n  <li>项目</li>   <!-- 1 项目 -->\n  <li>项目</li>   <!-- 2 项目 -->\n  <ul>\n\
    \    <li>项目</li> <!-- 2.1 项目 -->\n    <li>项目</li> <!-- 2.2 项目 -->\n  </ul>\n</ul>\n\
    ```\n\n所有主流浏览器均支持计数器，包括所有版本的 Chrome、Firefox、Safari、Opera 以及 IE8+。\n\n# 24. 表格\n\
    \nCSS 拥有许多专门用于表格元素的属性。这些属性可以控制浏览器如何渲染表格数据。\n\n## `border-spacing`\n\n相邻表格单元格边框之间的距离可以通过\
    \ `border-spacing` 属性进行更改，该属性相当于 HTML 中的 `cellspacing` 属性。W3C 定义此属性的初始值为 0，但大多数浏览器默认将其渲染为\
    \ 2px。\n\n`border-spacing : inherit | <length> [<length>]`\n\n此属性可以指定一个或两个长度值。当指定两个值时，第一个值设置水平间距，第二个值设置垂直间距。\n\
    \n```\n.spacing {\n  border-spacing: 5px 10px;\n}\n```\n\n`border-spacing` 是表格的属性，而非单元格的属性，因此它应用于\
    \ `<table>` 元素，如下例所示：\n\n```\n<table class=\"spacing\">\n  <caption>我的表格</caption>\n\
    \  <tr>\n    <td>第 1 行第 1 列</td>\n    <td>第 1 行第 2 列</td>\n  </tr>\n  <tr>\n \
    \   <td>第 2 行第 1 列</td>\n    <td>第 2 行第 2 列</td>\n  </tr>\n</table>\n```\n\n该表格如图\
    \ 24-1 所示，其中 `<td>` 元素应用了实线边框。\n\n![A978-1-4302-6491-0_24_Fig1_HTML.jpg](img/A978-1-4302-6491-0_24_Fig1_HTML.jpg)\n\
    \n图 24-1. 示例表格\n\n表格单元格有边框和内边距，但没有外边距；取而代之的是 `border-spacing`。内边距与其他元素的工作方式相同，行为类似于\
    \ HTML 中的 `cellpadding` 属性。\n\n## `border-collapse`\n\n`border-collapse` 属性决定表格边框是合并为单一边框还是分离的。\n\
    \n`border-collapse : inherit | separate | collapse`\n\n通常，表格单元格有自己的独立边框，并通过 `border-spacing`\
    \ 属性设置的距离分隔。如果将边框设置为合并（collapse），则单元格共享边框，并且会忽略 `border-spacing` 属性的任何值。\n\n```\n\
    table { border-collapse: collapse; }\n```\n"
- fmt: "## `caption-side`\n\n`<caption>`元素为表格提供标签。其位置可通过`caption-side`属性更改。\n\n`caption-side\
    \ : inherit | top | bottom`\n\n标题通常显示在顶部，但也可以通过`caption-side`属性将其置于表格下方。此属性适用于`<caption>`元素，但由于继承性，也可以为`<table>`元素设置。\n\
    \n```\ncaption { caption-side: bottom; }\n```\n\n## `empty-cells`\n\n无内容的表格单元格通常仍会显示其边框和背景。此行为可通过`empty-cells`属性更改。\n\
    \n`empty-cells : inherit | show | hide`\n\n将此属性值设为`hide`将隐藏单元格的边框和背景。表格的布局不受影响。\n\
    \n## `table-layout`\n\n`table-layout`属性决定表格单元格的宽度应为固定还是灵活。与其他表格属性不同，`table-layout`不具继承性。\n\
    \n`table-layout : auto | fixed`\n\n此属性初始值为`auto`，意味着表格单元格的宽度会自动扩展以适应其内容，即使这会导致超出其设置宽度。若要强制执行表格的指定宽度，可将`table-layout`设为`fixed`。此时水平布局仅取决于表格的设定宽度，而非单元格内容。\n\
    \n```\n/* Enforce table width */\n.fixed { table-layout: fixed; }\n```\n\n固定表格布局还有一个额外好处：浏览器能更快地渲染表格，因为一旦接收到第一行，浏览器就能获知表格的尺寸。\n\
    \n# 25. 媒体\n\nCSS提供了一种根据观看文档的设备来呈现不同文档内容的方法。此类条件样式规则被放置在一个媒体规则内，该规则由`@media`、一个限定作用域的表达式以及一组包含条件样式规则的花括号组成。\n\
    \n```\n@media screen {\n  /* screen devices only */\n}\n```\n\n## 媒体类型\n\nCSS\
    \ 2中引入的媒体类型条件，列出了以下有效值，包括用于定位所有设备类型的默认值`all`：\n\n`all | aural | braille | handheld\
    \ | print | projection | screen | tty | tv | embossed`\n\n不幸的是，媒体类型并不能提供太多关于设备的信息，因此很少按其预期目的使用。现代智能手机、平板电脑、笔记本电脑和台式电脑都自识别为`screen`类型。如今媒体类型条件的主要用途是区分屏幕显示文档和打印文档，以实现更友好的打印文档格式。\n\
    \n```\n/* Print only */\n@media print\n{\n  /* Hide navigation */\n  #navigation\
    \ { display: none; }\n  /* Start h1 elements on a new page */\n  h1 { page-break-before:\
    \ always; }\n}\n```\n\n媒体规则通常放置在样式表的底部，这允许级联覆盖先前定义的规则。如果样式表包含大量条件规则，则最好将它们移至单独的样式表中，该样式表在主要样式表之后引入。媒体条件随后可通过`<link>`元素上的`media`属性指定。\n\
    \n`<link rel=\"stylesheet\" media=\"print\" href=\"myprint.css\">`\n\n此样式表包含了打印条件，因此仅在文档发送到打印媒体时应用。请记住，即使媒体条件为假，浏览器仍会下载样式表。\n\
    \n## 媒体查询\n\nCSS 3更进一步，允许媒体规则定位设备的能力而不仅仅是设备类型。它引入了大量可被定位的媒体特性，如下表所示。除`orientation`、`grid`和`scan`外，所有这些特性都可以加上`min-`或`max-`前缀来定义约束条件。\n\
    \n`width | height | device-width | device-height | aspect-ratio | device-aspect-ratio\
    \ | resolution | orientation | color | color-index | monochrome`\n\n最重要的媒体特性`min-width`和`max-width`允许您创建响应式设计，使网站布局根据设备浏览器的视口而变化。\n\
    \n媒体查询结合了媒体类型以及由一个或多个媒体特性构成的条件。例如，以下媒体查询内的规则仅当在最小宽度为600像素的屏幕媒体上时才被应用：\n\n`@media\
    \ screen and (min-width: 600px) {}`\n\n媒体查询不区分大小写，并且要求条件周围有括号。此处看到的`and`运算符用于组合媒体类型和媒体特性，但它也可以组合多个媒体特性：\n\
    \n`@media (max-width: 500px) and (min-aspect-ratio: 1/1) {}`\n\n如果查看设备的宽度最大为500像素且至少具有1:1的宽高比（方形或横向视口），则此媒体查询为真。请注意，这里省略了媒体类型，因此该规则适用于所有媒体类型。\n\
    \n## 逻辑运算符\n\n除了逻辑的`and`运算符，媒体查询还可以包括逻辑的`not`和`only`运算符以及逻辑的`or`操作。逗号（`,`）用作`or`运算符来分隔多个查询组。如果屏幕宽度至少为700像素，或设备处于横屏模式，则以下媒体规则为真：\n\
    \n`@media (min-width: 700px), (orientation: landscape) {}`\n\n`not`运算符用于否定整个媒体查询。它不能否定单个特性。例如，以下媒体规则仅当设备屏幕宽度不为800像素时应用：\n\
    \n`@media not screen and (device-width: 800px) {}`\n\n`only`运算符被添加用于向旧版浏览器隐藏媒体查询。根据规范，不支持媒体查询的浏览器会将以下规则解释为应用于`only`媒体类型，这是无效的，从而导致条件样式规则被忽略。\n\
    \n```\n/* Not applied in older browsers */\n@media only screen and (min-width:\
    \ 600px) {}\n```\n\n遗憾的是，IE6–IE8未能正确实现该规范。因此，即使省略了`only`关键字，媒体查询也会被忽略，而非像预期那样将媒体规则应用于所有屏幕设备。\n\
    \n```\n/* Not applied in IE 6-8 */\n@media screen and (min-width : 600px) {}\n\
    ```\n\n请注意，`not`和`only`运算符都需要使用明确的媒体类型，而逻辑`or`（`,`）和逻辑`and`运算符则不需要。\n\n媒体查询的支持已在所有主流浏览器中广泛普及。例如，`min-width`和`max-width`查询在Chrome\
    \ 1+、Firefox 3.5+、IE9+、Safari 4+和Opera 8+中都得到支持。\n\n## 测试媒体查询\n\n测试您的媒体查询非常重要，以确保您的网站在尽可能多的设备上显示良好。最新的网络浏览器都会在浏览器环境发生变化时（例如调整窗口大小时）重新评估媒体查询。您只需调整浏览器窗口大小，即可测试您的设计如何响应不同的设备尺寸。在测试过程中，一个有用的网站是ProtoFluid，¹它允许您查看网站在许多平板电脑和智能手机设备上的外观。"
  raw: '## caption-side


    The `<caption>` element provides a label for a table. Its position can be changed
    using the `caption-side` property.


    `caption-side : inherit | top | bottom`


    A caption is ordinarily displayed at the top, but it can also be positioned below
    the table using the `caption-side` property. This property applies to the `<caption>`
    element, but it can also be set for the `<table>` element because it inherits.


    `caption { caption-side: bottom; }`


    ## empty-cells


    A table cell without any content normally still displays its border and background.
    This behavior can be changed with the `empty-cells` property.


    `empty-cells : inherit | show | hide`


    Setting the value for this property to `hide` causes the cell’s border and background
    to be hidden. The layout of the table is not affected.


    ## table-layout


    The `table-layout` property determines whether the width of table cells should
    be fixed or flexible. Unlike the other table properties, `table-layout` is not
    inherited.


    `table-layout : auto | fixed`


    This property is initially set to `auto`, which means that the width of table
    cells automatically expands to fit their content, even if that means going beyond
    their set width. To enforce a table''s specified width, the `table-layout` can
    instead be set to `fixed`. The horizontal layout then depends only on the table''s
    set width, not on the content of the cells.


    `/* Enforce table width */`


    `.fixed { table-layout: fixed; }`


    A fixed table layout has the added benefit that the browser can render the table
    more quickly because it knows the dimension of the table as soon as the first
    row is received.


    # 25. Media


    CSS provides a way to present documents differently, depending on the device on
    which they are viewed. Such conditional style rules are placed within a media
    rule, which consists of `@media`, followed by an expression that limits the scope
    and a set of curly brackets that encloses the conditional style rules.


    `@media screen {`


    `/* screen devices only */`


    `}`


    ## Media types


    The media type condition, which was introduced in CSS 2, lists the following valid
    values, including the default value `all` for targeting all device types:


    `all | aural | braille | handheld | print | projection | screen | tty | tv | embossed`


    Unfortunately, the media type does not tell much about the device, so it is seldom
    used for its intended purpose. Modern smartphones, tablets, laptops, and desktop
    computers all identify themselves as `screen` types. The main use of the media
    type condition today is to differentiate between onscreen and printed documents
    to enable more print–friendly document formatting.


    `/* Print only */`


    `@media print`


    `{`


    `/* Hide navigation */`


    `#navigation { display: none; }`


    `/* Start h1 elements on a new page */`


    `h1 { page-break-before: always; }`


    `}`


    Media rules are typically placed at the bottom of the style sheet, which allows
    the cascade to override the rules defined earlier. If the style sheet contains
    a lot of conditional rules, it might be preferable to move them to a separate
    style sheet that is included after the primary style sheet. The media condition
    can then be specified with the `media` attribute on the `<link>` element.


    `<link rel="stylesheet" media="print" href="myprint.css">`


    This style sheet contains the print condition, so it is applied only when the
    document is sent to print media. Keep in mind that browsers still download a style
    sheet, even if its media condition is false.


    ## Media queries


    CSS 3 went a step farther by allowing media rules to target the capabilities of
    the device, not just its type. It introduced a wide range of media features that
    can be targeted, as seen in the following list. All these features, except for
    `orientation`, `grid`, and `scan`, can be prefixed with `min-` or `max-` to define
    constraints.


    `width | height | device-width | device-height | aspect-ratio | device-aspect-ratio
    | resolution | orientation | color | color-index | monochrome`


    The most important media features, `min-width` and `max-width`, allow you to create
    responsive designs in which the site layout changes based on the viewport of the
    device’s browser.


    A media query combines a media type and a condition consisting of one or more
    media features. For example, the rules within the following media query are applied
    only when viewed on screen-based media with a minimum width of 600 pixels:


    `@media screen and (min-width: 600px) {}`


    Media queries are case-insensitive, and parentheses around the condition are required.
    The `and` operator seen here is used to combine the media type and the media feature,
    but it can also combine multiple media features together:


    `@media (max-width: 500px) and (min-aspect-ratio: 1/1) {}`


    This media query is true if the viewing device has a max width of 500 pixels and
    at least a 1:1 aspect ratio (square or landscape viewport). Notice that the media
    type is left out here, so the rule applies to all media types.


    ## Logical operators


    In addition to the logical `and` operator, media queries can include the logical
    `not` and `only` operators as well as the logical `or` operation. The comma (`,`)
    is used as the `or` operator to separate groups of multiple queries. The following
    media rule is true if either the screen is at least 700 pixels wide or if the
    device is in landscape mode:


    `@media (min-width: 700px), (orientation: landscape) {}`


    The `not` operator is used to negate an entire media query. It cannot negate an
    individual feature. For example, the following media rule applies only if the
    device screen is not 800 pixels wide:


    `@media not screen and (device-width: 800px) {}`


    The `only` operator was added to hide media queries from older browsers. According
    to the specification, browsers that do not support media queries should interpret
    the following rule as being applied to the `only` media type, which is invalid
    and thereby causes the conditional style rules to be ignored.


    `/* Not applied in older browsers */`


    `@media only screen and (min-width: 600px) {}`


    Regrettably, IE6–IE8 did not implement the specification correctly. The media
    query is therefore ignored even if the `only` keyword is left out, instead of
    then applying the media rule to all screen-based devices.


    `/* Not applied in IE 6-8 */`


    `@media screen and (min-width : 600px) {}`


    Note that both the `not` and `only` operators require the use of an explicit media
    type, whereas the logical `or` (`,`) and logical `and` operators do not.


    Support for media queries has become widespread in all major browsers. The `min-width`
    and `max-width` queries, for example, are supported in Chrome 1+, Firefox 3.5+,
    IE9+, Safari 4+, and Opera 8+.


    ## Testing media queries


    It is important to test your media queries to make sure that your site looks good
    in as many devices as possible. The latest web browsers all re-evaluate media
    queries as the browser environment is changed (when the window is resized, for
    example). You can test how your design responds to different device dimensions
    just by resizing your browser window. A useful site that can help you during this
    testing process is ProtoFluid,[¹](#A978-1-4302-6491-0_25_Chapter.html#Fn1) which
    allows you to see how your site will look on many tablet and smartphone devices.'
  trans: "\n## `caption-side`\n\n`<caption>`元素为表格提供标题。其位置可通过`caption-side`属性更改。\n\n\
    `caption-side : inherit | top | bottom`\n\n标题通常显示在顶部，但也可以通过`caption-side`属性将其置于表格下方。此属性适用于`<caption>`元素，但由于继承性，也可以为`<table>`元素设置。\n\
    \n```\ncaption { caption-side: bottom; }\n```\n\n## `empty-cells`\n\n无内容的表格单元格通常仍会显示其边框和背景。此行为可通过`empty-cells`属性更改。\n\
    \n`empty-cells : inherit | show | hide`\n\n将此属性值设为`hide`将隐藏单元格的边框和背景。表格的布局不受影响。\n\
    \n## `table-layout`\n\n`table-layout`属性决定表格单元格的宽度应为固定还是灵活。与其他表格属性不同，`table-layout`不具继承性。\n\
    \n`table-layout : auto | fixed`\n\n此属性初始值为`auto`，意味着表格单元格的宽度会自动扩展以适应其内容，即使这会导致超出其设置宽度。若要强制执行表格的指定宽度，可将`table-layout`设为`fixed`。此时水平布局仅取决于表格的设定宽度，而非单元格内容。\n\
    \n```\n/* 强制表格宽度 */\n.fixed { table-layout: fixed; }\n```\n\n固定表格布局还有一个额外好处：浏览器能更快地渲染表格，因为一旦接收到第一行，浏览器就能获知表格的尺寸。\n\
    \n# 25. 媒体\n\nCSS 提供了一种根据观看文档的设备来呈现不同文档内容的方法。此类条件样式规则被放置在一个媒体规则内，该规则由`@media`、一个限定作用域的表达式以及一组包含条件样式规则的花括号组成。\n\
    \n```\n@media screen {\n  /* 仅限屏幕设备 */\n}\n```\n\n## 媒体类型\n\nCSS 2 中引入的媒体类型条件，列出了以下有效值，包括用于定位所有设备类型的默认值`all`：\n\
    \n`all | aural | braille | handheld | print | projection | screen | tty | tv |\
    \ embossed`\n\n不幸的是，媒体类型并不能提供太多关于设备的信息，因此很少按其预期目的使用。现代智能手机、平板电脑、笔记本电脑和台式电脑都自识别为`screen`类型。如今媒体类型条件的主要用途是区分屏幕显示文档和打印文档，以实现更友好的打印文档格式。\n\
    \n```\n/* 仅限打印 */\n@media print\n{\n  /* 隐藏导航 */\n  #navigation { display: none;\
    \ }\n  /* 在 h1 元素前分页 */\n  h1 { page-break-before: always; }\n}\n```\n\n媒体规则通常放置在样式表的底部，这允许级联覆盖先前定义的规则。如果样式表包含大量条件规则，则最好将它们移至单独的样式表中，该样式表在主要样式表之后引入。媒体条件随后可通过`<link>`元素上的`media`属性指定。\n\
    \n`<link rel=\"stylesheet\" media=\"print\" href=\"myprint.css\">`\n\n此样式表包含了打印条件，因此仅在文档发送到打印媒体时应用。请记住，即使媒体条件为假，浏览器仍会下载样式表。\n\
    \n## 媒体查询\n\nCSS 3 更进一步，允许媒体规则定位设备的能力而不仅仅是设备类型。它引入了大量可被定位的媒体特性，如下表所示。除`orientation`、`grid`和`scan`外，所有这些特性都可以加上`min-`或`max-`前缀来定义约束条件。\n\
    \n`width | height | device-width | device-height | aspect-ratio | device-aspect-ratio\
    \ | resolution | orientation | color | color-index | monochrome`\n\n最重要的媒体特性`min-width`和`max-width`允许您创建响应式设计，使网站布局根据设备浏览器的视口而变化。\n\
    \n媒体查询结合了媒体类型以及由一个或多个媒体特性构成的条件。例如，以下媒体查询内的规则仅当在最小宽度为 600 像素的屏幕媒体上时才被应用：\n\n`@media\
    \ screen and (min-width: 600px) {}`\n\n媒体查询不区分大小写，并且要求条件周围有括号。此处看到的`and`运算符用于组合媒体类型和媒体特性，但它也可以组合多个媒体特性：\n\
    \n`@media (max-width: 500px) and (min-aspect-ratio: 1/1) {}`\n\n如果查看设备的宽度最大为 500\
    \ 像素且至少具有 1:1 的宽高比（方形或横向视口），则此媒体查询为真。请注意，这里省略了媒体类型，因此该规则适用于所有媒体类型。\n\n## 逻辑运算符\n\
    \n除了逻辑的`and`运算符，媒体查询还可以包括逻辑的`not`和`only`运算符以及逻辑的`or`操作。逗号（`,`）用作`or`运算符来分隔多个查询组。如果屏幕宽度至少为\
    \ 700 像素，或设备处于横屏模式，则以下媒体规则为真：\n\n`@media (min-width: 700px), (orientation: landscape)\
    \ {}`\n\n`not`运算符用于否定整个媒体查询。它不能否定单个特性。例如，以下媒体规则仅当设备屏幕宽度不为 800 像素时应用：\n\n`@media\
    \ not screen and (device-width: 800px) {}`\n\n`only`运算符被添加用于向旧版浏览器隐藏媒体查询。根据规范，不支持媒体查询的浏览器会将以下规则解释为应用于`only`媒体类型，这是无效的，从而导致条件样式规则被忽略。\n\
    \n```\n/* 在旧版浏览器中不应用 */\n@media only screen and (min-width: 600px) {}\n```\n\n\
    遗憾的是，IE6–IE8 未能正确实现该规范。因此，即使省略了`only`关键字，媒体查询也会被忽略，而非像预期那样将媒体规则应用于所有屏幕设备。\n\n\
    ```\n/* 在 IE 6-8 中不应用 */\n@media screen and (min-width : 600px) {}\n```\n\n请注意，`not`和`only`运算符都需要使用明确的媒体类型，而逻辑`or`（`,`）和逻辑`and`运算符则不需要。\n\
    \n媒体查询的支持已在所有主流浏览器中广泛普及。例如，`min-width`和`max-width`查询在 Chrome 1+、Firefox 3.5+、IE9+、Safari\
    \ 4+和 Opera 8+中都得到支持。\n\n## 测试媒体查询\n\n测试您的媒体查询非常重要，以确保您的网站在尽可能多的设备上显示良好。最新的网络浏览器都会在浏览器环境发生变化时（例如调整窗口大小时）重新评估媒体查询。您只需调整浏览器窗口大小，即可测试您的设计如何响应不同的设备尺寸。在测试过程中，一个有用的网站是\
    \ ProtoFluid，¹它允许您查看网站在许多平板电脑和智能手机设备上的外观。\n"
- fmt: "# Responsive design guidelines\n\nWhen designing a responsive layout, it is\
    \ often easiest to start with the mobile layout first and define how it looks\
    \ without any media rules. As you expand the viewport, notice when this layout\
    \ ceases to look good. This is the breakpoint at which you should change the part\
    \ of the layout that visually breaks or ceases to be useful. This change might\
    \ include adding a second column or changing to a more advanced navigation menu.\
    \ You define these breakpoints using the `min-width` and `max-width` media features\
    \ to override styles as the viewport gets larger, as shown in the following example.\
    \ Continue this method of finding breakpoints until you reach a high enough resolution.\
    \ Depending on your layout, you might need to define only a few breakpoints.\n\
    \n```\n@media (min-width: 800px) {\n  body { background: red; }\n}\n@media (min-width:\
    \ 401px) and (max-width: 799px) {\n  body { background: green; }\n}\n@media (max-width:\
    \ 400px) {\n  body { background: blue; }\n}\n```\n\nFootnotes [1](#A978-1-4302-6491-0_25_Chapter.html#Fn1_source)\n\
    \n[`http://protofluid.com`](http://protofluid.com/)\n\n# Best practices\n\nYou\
    \ now have an understanding of the fundamentals of CSS. This final chapter takes\
    \ a step back to look at good coding practices and standards for style sheet development.\
    \ Following these guidelines can help you write robust CSS code that is easy to\
    \ maintain, reuse, and extend upon.\n\n## Reusable code\n\nA key idea to a manageable\
    \ style sheet is to avoid duplicate code. Classes help achieve this goal because\
    \ they are reusable and can be combined in different ways, giving you a flexible\
    \ design that is easy to evolve.\n\nAny time you find page items that share style\
    \ properties, you should consider combining those repeating patterns. This makes\
    \ it easier to reuse and update the code as well as to maintain style consistency\
    \ on the site. Consider the following simple example:\n\n```\n.module {\n  width:\
    \ 200px;\n  border: 1px solid #ccc;\n  border-radius: 3px;\n}\n.widget {\n  width:\
    \ 300px;\n  border: 1px solid #ccc;\n  border-radius: 3px;\n}\n```\n\nThese classes\
    \ have two styles in common that can be moved into a third class to avoid unnecessary\
    \ repetition. This process makes the classes more generic and therefore more reusable.\n\
    \n```\n.box-border {\n  border: 1px solid #ccc;\n  border-radius: 3px;\n}\n.module\
    \ { width: 200px; }\n.widget { width: 300px; }\n```\n\nWhen optimizing classes\
    \ for reuse, it is important to consider their size. The goal is to find the middle\
    \ ground between classes that are not too broad or too narrow. Too-broad classes\
    \ lead to unnecessary repetition; too-narrow classes make it difficult to change\
    \ the design.\n\n## Global modifiers\n\nThere are certain style properties that\
    \ are very commonly used. Instead of adding these styles to every other class,\
    \ it is sometimes better to create a general class with that single style, which\
    \ you can then apply to the elements that need it. For example, floating elements\
    \ to the left or right is such a common operation. These styles are well suited\
    \ as global modifiers.\n\n```\n.left  { float: left; }\n.right { float: right;\
    \ }\n```\n\nWhen you want an element floated to the right or left, you can simply\
    \ add one of these classes to the element:\n\n`<div class=\"left\">...</div>`\n\
    \nGlobal modifiers such as these can be very useful when just a single style property\
    \ is needed. However, you should avoid combining several of them because it can\
    \ become difficult to adjust your design if all page items are composed of such\
    \ small classes.\n\n## Style sheet structure\n\nBy organizing your style sheets,\
    \ you can make it easier for yourself and other developers to quickly understand\
    \ the structure of your CSS. The larger a site becomes, and the more developers\
    \ are involved, the greater is the need to keep things well-organized. But it\
    \ is good practice to always keep your style sheets well-structured, regardless\
    \ of the size of the web site.\n\nThe top portion of a style sheet usually includes\
    \ information about the file and its author. This metadata should include the\
    \ author’s name and contact information. This way, if any questions come up about\
    \ the document, the developer currently working on the site knows whom to ask.\
    \ Other potentially useful metadata includes the file’s creation date, last modified\
    \ date, version number, title, and description.\n\n```\n/*\n * Title: My Theme\n\
    \ * Version: 1.2.3\n * Author: My Name\n */\n```\n\nAs for the style rules, they\
    \ should be grouped into sections, and each section should be labeled with a distinguishing\
    \ comment. This grouping and labeling enables you to find what you need much more\
    \ quickly. The sections you need depend on the site, but here are some example\
    \ sections:\n\n```\n/* === Normalization === */\n/* === Primary layout === */\n\
    /* === Secondary layout === */\n/* === Tertiary layout === */\n/* === Navigation\
    \ === */\n/* === Text-related === */\n/* === Links and images === */\n/* === General\
    \ styles === */\n/* === General classes === */\n/* === Miscellaneous === */\n\
    ```\n\nThe equal signs after the section name help visually distinguish the sections\
    \ from other comments. They also act as a marker that you can search for to easily\
    \ traverse the sections.\n\nWith large style sheets, the section names can be\
    \ listed as a table of contents below the metadata, which makes it easier for\
    \ developers to get an overview of how the file is organized.\n\n```\n/* Table\
    \ of Contents\n* -----------------\n* Normalization\n* Primary layout (body, primary\
    \ divs)\n* Secondary layout (header, footer, sidebar)\n* Tertiary layout (page\
    \ regions)\n* Navigation (menus)\n* Text-related (paragraphs, headings, lists)\n\
    * Links and images\n* General styles (forms, tables, etc.)\n* General classes\
    \ (.clear, .center, etc.)\n* Miscellaneous\n*/\n```\n\nWithin each section, you\
    \ should declare your most generic rules first, followed by rules with increasing\
    \ specificity. Your elements can inherit styles, and it is easier for you to override\
    \ specific styles when needed.\n\nAnother thing to consider is how to structure\
    \ properties within a rule. A popular approach is to group the properties according\
    \ to type. You do not have to label the groups as in the following example, but\
    \ it helps if you keep the groups in the same order throughout your style sheet.\
    \ Doing so enables you to more quickly scan through the rules in search of specific\
    \ properties.\n\n```\n.myclass {\n  /* Positioning */\n  position: absolute;\n\
    \  top: 0;\n  right: 0;\n  /* Box model */\n  display: inline-block;\n  width:\
    \ 100px;\n  height: 100px;\n  /* Color */\n  background: #ccc;\n  color: #fff;\n\
    \  /* Text */\n  font-size: 1em;\n  line-height: 1.2;\n  text-align: right;\n\
    \  /* Other */\n  cursor: pointer;\n}\n```\n\nKeep in mind that these are only\
    \ guidelines; choose a structure that works for you and aim to keep it consistent."
  raw: '## Responsive design guidelines


    When designing a responsive layout, it is often easiest to start with the mobile
    layout first and define how it looks without any media rules. As you expand the
    viewport, notice when this layout ceases to look good. This is the breakpoint
    at which you should change the part of the layout that visually breaks or ceases
    to be useful. This change might include adding a second column or changing to
    a more advanced navigation menu. You define these breakpoints using the `min-width`
    and `max-width` media features to override styles as the viewport gets larger,
    as shown in the following example. Continue this method of finding breakpoints
    until you reach a high enough resolution. Depending on your layout, you might
    need to define only a few breakpoints.


    `@media (min-width: 800px) {`


    `body { background: red; }`


    `}`


    `@media (min-width: 401px) and (max-width: 799px) {`


    `body { background: green; }`


    `}`


    `@media (max-width: 400px) {`


    `body { background: blue; }`


    `}`


    Footnotes [1](#A978-1-4302-6491-0_25_Chapter.html#Fn1_source)


    [`http://protofluid.com`](http://protofluid.com/)


    # 26. Best practices


    You now have an understanding of the fundamentals of CSS. This final chapter takes
    a step back to look at good coding practices and standards for style sheet development.
    Following these guidelines can help you write robust CSS code that is easy to
    maintain, reuse, and extend upon.


    ## Reusable code


    A key idea to a manageable style sheet is to avoid duplicate code. Classes help
    achieve this goal because they are reusable and can be combined in different ways,
    giving you a flexible design that is easy to evolve.


    Any time you find page items that share style properties, you should consider
    combining those repeating patterns. This makes it easier to reuse and update the
    code as well as to maintain style consistency on the site. Consider the following
    simple example:


    `.module {`


    `width: 200px;`


    `border: 1px solid #ccc;`


    `border-radius: 3px;`


    `}`


    `.widget {`


    `width: 300px;`


    `border: 1px solid #ccc;`


    `border-radius: 3px;`


    `}`


    These classes have two styles in common that can be moved into a third class to
    avoid unnecessary repetition. This process makes the classes more generic and
    therefore more reusable.


    `.box-border {`


    `border: 1px solid #ccc;`


    `border-radius: 3px;`


    `}`


    `.module { width: 200px; }`


    `.widget { width: 300px; }`


    When optimizing classes for reuse, it is important to consider their size. The
    goal is to find the middle ground between classes that are not too broad or too
    narrow. Too-broad classes lead to unnecessary repetition; too-narrow classes make
    it difficult to change the design.


    ## Global modifiers


    There are certain style properties that are very commonly used. Instead of adding
    these styles to every other class, it is sometimes better to create a general
    class with that single style, which you can then apply to the elements that need
    it. For example, floating elements to the left or right is such a common operation.
    These styles are well suited as global modifiers.


    `.left  { float: left; }`


    `.right { float: right; }`


    When you want an element floated to the right or left, you can simply add one
    of these classes to the element:


    `<div class="left">`...`</div>`


    Global modifiers such as these can be very useful when just a single style property
    is needed. However, you should avoid combining several of them because it can
    become difficult to adjust your design if all page items are composed of such
    small classes.


    ## Style sheet structure


    By organizing your style sheets, you can make it easier for yourself and other
    developers to quickly understand the structure of your CSS. The larger a site
    becomes, and the more developers are involved, the greater is the need to keep
    things well-organized. But it is good practice to always keep your style sheets
    well-structured, regardless of the size of the web site.


    The top portion of a style sheet usually includes information about the file and
    its author. This metadata should include the author’s name and contact information.
    This way, if any questions come up about the document, the developer currently
    working on the site knows whom to ask. Other potentially useful metadata includes
    the file’s creation date, last modified date, version number, title, and description.


    `/*`


    `* Title: My Theme`


    `* Version: 1.2.3`


    `* Author: My Name`


    `*/`


    As for the style rules, they should be grouped into sections, and each section
    should be labeled with a distinguishing comment. This grouping and labeling enables
    you to find what you need much more quickly. The sections you need depend on the
    site, but here are some example sections:


    `/* === Normalization === */`


    `/* === Primary layout === */`


    `/* === Secondary layout === */`


    `/* === Tertiary layout === */`


    `/* === Navigation === */`


    `/* === Text-related === */`


    `/* === Links and images === */`


    `/* === General styles === */`


    `/* === General classes === */`


    `/* === Miscellaneous === */`


    The equal signs after the section name help visually distinguish the sections
    from other comments. They also act as a marker that you can search for to easily
    traverse the sections.


    With large style sheets, the section names can be listed as a table of contents
    below the metadata, which makes it easier for developers to get an overview of
    how the file is organized.


    `/* Table of Contents`


    `-----------------`


    `Normalization`


    `Primary layout (body, primary divs)`


    `Secondary layout (header, footer, sidebar)`


    `Tertiary layout (page regions)`


    `Navigation (menus)`


    `Text-related (paragraphs, headings, lists)`


    `Links and images`


    `General styles (forms, tables, etc.)`


    `General classes (.clear, .center, etc.)`


    `Miscellaneous`


    `*/`


    Within each section, you should declare your most generic rules first, followed
    by rules with increasing specificity. Your elements can inherit styles, and it
    is easier for you to override specific styles when needed.


    Another thing to consider is how to structure properties within a rule. A popular
    approach is to group the properties according to type. You do not have to label
    the groups as in the following example, but it helps if you keep the groups in
    the same order throughout your style sheet. Doing so enables you to more quickly
    scan through the rules in search of specific properties.


    `.myclass {`


    `/* Positioning */`


    `position: absolute;`


    `top: 0;`


    `right: 0;`


    `/* Box model */`


    `display: inline-block;`


    `width: 100px;`


    `height: 100px;`


    `/* Color */`


    `background: #ccc;`


    `color: #fff;`


    `/* Text */`


    `font-size: 1em;`


    `line-height: 1.2;`


    `text-align: right;`


    `/* Other */`


    `cursor: pointer;`


    `}`


    Keep in mind that these are only guidelines; choose a structure that works for
    you and aim to keep it consistent.'
  trans: "\n# 响应式设计指南\n\n设计响应式布局时，最简单的方法通常是从移动端布局开始，先定义其在没有任何媒体查询规则下的外观。当你扩大视口时，注意观察布局在何时开始失去良好效果。这就是你需要修改布局中那些视觉上崩坏或失去作用的部分的断点。这种改动可能包括增加第二列，或改为更高级的导航菜单。你可以使用\
    \ `min-width` 和 `max-width` 媒体特性来定义这些断点，随着视口变大覆盖样式，如下例所示。继续使用这种寻找断点的方法，直到达到足够高的分辨率。根据你的布局，你可能只需要定义少数几个断点。\n\
    \n```\n@media (min-width: 800px) {\n  body { background: red; }\n}\n@media (min-width:\
    \ 401px) and (max-width: 799px) {\n  body { background: green; }\n}\n@media (max-width:\
    \ 400px) {\n  body { background: blue; }\n}\n```\n\n脚注 1\n\n[`http://protofluid.com`](http://protofluid.com/)\n\
    \n# 最佳实践\n\n现在你已经理解了 CSS 的基础知识。本章作为最后一章，将退一步来审视样式表开发的良好编码实践与标准。遵循这些指南可以帮助你编写易于维护、复用和扩展的健壮\
    \ CSS 代码。\n\n## 可复用的代码\n\n管理样式表的一个关键思想是避免重复代码。类（Classes）有助于实现这一目标，因为它们是可复用的，并且可以通过不同方式组合，从而为你提供易于演进的灵活设计。\n\
    \n每当你发现页面元素共享样式属性时，就应该考虑组合这些重复的模式。这使得代码更易于复用和更新，同时也有助于保持网站样式的一致性。思考以下简单示例：\n\n\
    ```\n.module {\n  width: 200px;\n  border: 1px solid #ccc;\n  border-radius: 3px;\n\
    }\n.widget {\n  width: 300px;\n  border: 1px solid #ccc;\n  border-radius: 3px;\n\
    }\n```\n\n这两个类有两个共同的样式，可以被移入第三个类以避免不必要的重复。这个过程使得类更具通用性，因此也更易于复用。\n\n```\n.box-border\
    \ {\n  border: 1px solid #ccc;\n  border-radius: 3px;\n}\n.module { width: 200px;\
    \ }\n.widget { width: 300px; }\n```\n\n在优化类以实现复用时，考虑其粒度非常重要。目标是找到介于过宽和过窄之间的类。过宽的类会导致不必要的重复；过窄的类则会使设计难以更改。\n\
    \n## 全局修饰符\n\n有些样式属性非常常用。与其将这些样式添加到每个其他类中，有时更好的做法是创建一个包含该单一样式的通用类，然后将其应用于需要它的元素。例如，将元素向左或向右浮动就是这样一个常见操作。这些样式非常适合用作全局修饰符。\n\
    \n```\n.left  { float: left; }\n.right { float: right; }\n```\n\n当你希望一个元素向右或向左浮动时，可以简单地将这些类之一添加到该元素上：\n\
    \n`<div class=\"left\">...</div>`\n\n当只需要单个样式属性时，诸如此类的全局修饰符非常有用。但是，你应该避免组合多个这样的修饰符，因为如果所有页面元素都由如此小的类构成，调整设计将会变得困难。\n\
    \n## 样式表结构\n\n通过组织样式表，你可以让自己和其他开发者更容易快速理解 CSS 的结构。网站规模越大，参与的开发者越多，保持良好组织的需求就越大。但无论网站规模大小，始终保持样式表结构良好总是一个好习惯。\n\
    \n样式表的顶部通常包含有关文件及其作者的信息。这些元数据应包括作者的姓名和联系方式。这样，如果对文档有任何疑问，当前负责该网站的开发者就知道该问谁。其他可能有用的元数据包括文件的创建日期、最后修改日期、版本号、标题和描述。\n\
    \n```\n/*\n * 标题：我的主题\n * 版本：1.2.3\n * 作者：我的名字\n */\n```\n\n至于样式规则，它们应该被分组到不同的章节中，每个章节都应带有辨识度高的注释标签。这种分组和标签能使你更快地找到所需内容。所需的章节取决于网站本身，以下是一些示例章节：\n\
    \n```\n/* === 标准化 === */\n/* === 主要布局 === */\n/* === 二级布局 === */\n/* === 三级布局\
    \ === */\n/* === 导航 === */\n/* === 文本相关 === */\n/* === 链接和图片 === */\n/* === 通用样式\
    \ === */\n/* === 通用类 === */\n/* === 杂项 === */\n```\n\n章节名称后的等号有助于在视觉上将各章节与其他注释区分开来。它们也充当了一个标记，你可以通过搜索来轻松遍历各个章节。\n\
    \n对于大型样式表，可以在元数据下方列出章节名称作为目录，这有助于开发者快速了解文件的组织方式。\n\n```\n/* 目录\n* ----------------\n\
    * 标准化\n* 主要布局 (body, 主要 divs)\n* 二级布局 (header, footer, sidebar)\n* 三级布局 (页面区域)\n\
    * 导航 (菜单)\n* 文本相关 (段落, 标题, 列表)\n* 链接和图片\n* 通用样式 (表单, 表格等)\n* 通用类 (.clear, .center\
    \ 等)\n* 杂项\n*/\n```\n\n在每个章节内，你应该先声明最通用的规则，然后依次是特异性递增的规则。你的元素可以继承样式，并且在需要时更容易覆盖特定样式。\n\
    \n另一个需要考虑的是如何组织规则内的属性。一种流行的方法是根据类型对属性进行分组。你不必像下例那样为每个组添加标签，但如果能在整个样式表中保持分组顺序的一致性，将有助于你更快地扫描规则以查找特定属性。\n\
    \n```\n.myclass {\n  /* 定位 */\n  position: absolute;\n  top: 0;\n  right: 0;\n\
    \  /* 盒模型 */\n  display: inline-block;\n  width: 100px;\n  height: 100px;\n  /*\
    \ 颜色 */\n  background: #ccc;\n  color: #fff;\n  /* 文本 */\n  font-size: 1em;\n\
    \  line-height: 1.2;\n  text-align: right;\n  /* 其他 */\n  cursor: pointer;\n}\n\
    ```\n\n请记住，这些只是指南；选择一种适合你的结构，并力求保持一致。\n"
- fmt: "## Naming conventions\n\nIt is helpful to name classes and ids in a way that\
    \ clarifies their intended use. This structural naming convention means that the\
    \ name should describe what the class or id is used for instead of what it looks\
    \ like or where it is used in the web document.\n\nThe advantage of this naming\
    \ convention is that it becomes easier to change the look of your web site. For\
    \ example, naming an id container `#main-content` is better than naming it `#center-column-500px`.\
    \ In addition to intuitively understanding the use of the id, the first name is\
    \ more versatile in case you later need to adjust the position or size of the\
    \ element it is applied to.\n\n```\n#main-content {\n  width: 500px;\n  margin:\
    \ 0 auto; /* centered */\n}\n```\n\nNames should be semantic, but not so semantic\
    \ that they limit reuse. For instance, naming a class `.header-top-margin` is\
    \ not as flexible as naming the class `.small-top-margin` (or `.small-tm`). To\
    \ later recall that the class is mainly used in the header is easy enough; for\
    \ example, you can search for the class name using the search function when viewing\
    \ the page source in a web browser.\n\n```\n.small-top-margin { margin-top: 1em;\
    \ }\n```\n\nIn addition to conveying intended use, the class name can also show\
    \ its relationships to other classes. For example, if a container class is called\
    \ `.post`, the title for that container can be named `.post-title` to show that\
    \ the class should be used only within an element applying the `.post` class.\n\
    \n```\n.post {\n  margin: 1em 0;\n}\n\n.post-title {\n  font-size: 1.2em;\n}\n\
    ```\n\nThe title class could also have been written as `.post.title` to ensure\
    \ that the `.title` class can be used only within a container using the `.post`\
    \ class. However, the `.post-title` name helps avoid naming conflicts and does\
    \ not increase specificity, so that naming convention is often preferable. Notice\
    \ that the relationship between the rules is further emphasized using indentation,\
    \ which can significantly improve the code’s readability.\n\n## Normalization\n\
    \nDifferent browsers render some elements slightly differently, mainly because\
    \ of variations in their default style sheets. To get a shared baseline, it is\
    \ common to include a group of rules that normalize these browser inconsistencies\
    \ and set reasonable defaults. The most popular choice for this is the GitHub\
    \ `Normalize.css` project.[¹](#A978-1-4302-6491-0_26_Chapter.html#Fn1) By including\
    \ these rules at the top of your style sheet (or a subset of them per your site’s\
    \ requirements), you have a consistent starting point across all browsers from\
    \ which you can build. The `Normalize.css` style sheet includes ample comments\
    \ that explain each browser inconsistency that it resolves.\n\n## Debugging\n\n\
    There are many useful debugging tools available that can significantly simplify\
    \ your work as a web developer. The Firebug extension for Firefox is one of the\
    \ most powerful of these tools. It allows you to edit and debug CSS, HTML, and\
    \ JavaScript live on any web page for testing purposes. You can also toggle styles\
    \ on and off, as well as discover exactly which styles apply to a selected element.\
    \ To learn more about Firebug, visit the official Firebug web site.[²](#A978-1-4302-6491-0_26_Chapter.html#Fn2)\n\
    \nFunctionalities similar to Firebug are available on Chrome through the Chrome\
    \ Developer Tools that come built in to the browser. You can bring up the DevTools\
    \ window with the shortcut `Ctrl+Shift+I` on Windows or `Cmd+Opt+I` on Mac. Alternatively,\
    \ you can right-click on an element on the page and select Inspect Element to\
    \ bring up the same window in element inspection mode.\n\n## Validation\n\nIt\
    \ is a good idea to check that your CSS complies with the W3C standard. Improper\
    \ code may cause unexpected results in how your site appears in different browsers.\
    \ Moreover, having error-free code is a sign of a quality web site.\n\nThe W3C\
    \ provides its own online tool for validating CSS.[³](#A978-1-4302-6491-0_26_Chapter.html#Fn3)\
    \ It checks a submitted page and returns any errors and warnings found on the\
    \ page for you to fix. It also has a similar tool for validating HTML documents,[⁴](#A978-1-4302-6491-0_26_Chapter.html#Fn4)\
    \ which is just as important to do. To make validation even more convenient, you\
    \ can download a browser plug-in that checks the page’s code for you, such as\
    \ the Web Developer plug-in available on Chrome, Firefox, and Opera.[⁵](#A978-1-4302-6491-0_26_Chapter.html#Fn5)\n\
    \n## Single style sheet\n\nFor performance reasons, it is best to include a site’s\
    \ style rules in a single external style sheet. Doing so minimizes the number\
    \ of HTTP requests necessary to load the web site, while allowing the CSS file\
    \ to be cached so that the visitor’s browser has to download it only once.\n\n\
    During development of a large site, it is often preferable to separate style rules\
    \ into several more-manageable CSS files. To have the best of both worlds, these\
    \ development files can be combined into a single file as part of the site’s build\
    \ process. One useful tool for this purpose is Bundle.[⁶](#A978-1-4302-6491-0_26_Chapter.html#Fn6)\
    \ When your site design has become stable, this tool can also be used to minify\
    \ your CSS.\n\n## Minification\n\nMinification is the process of removing unnecessary\
    \ characters from code to reduce its size. When a CSS file is minified, whitespace\
    \ characters are removed, and the rules are optimized and restructured to load\
    \ more quickly. This compression can greatly reduce the size of the file, which\
    \ improves site performance at the cost of code readability. Because of the reduced\
    \ readability, it is preferable to work with the uncompressed style sheet and\
    \ have the minification step repeated whenever the CSS file is updated. Minification\
    \ can be done automatically (for example, by using the Bundle tool mentioned earlier)\
    \ or manually with an online tool such as Clean CSS.[⁷](#A978-1-4302-6491-0_26_Chapter.html#Fn7)\n\
    \nOne optimization that minification tools cannot do is to find and remove unused\
    \ CSS rules. A useful Firefox plug-in that can help you perform this task is Dust-Me\
    \ Selectors.[⁸](#A978-1-4302-6491-0_26_Chapter.html#Fn8) This plug-in can test\
    \ pages individually and also scan through an entire site in search of unused\
    \ selectors.\n\n## Cross-browser testing\n\nEven with your code normalized and\
    \ validated, there can still be some differences in the way a web page is rendered\
    \ in various browsers, especially in older versions. It is therefore necessary\
    \ to test your site in all the browser versions you want your site to support.\n\
    \nTo make this testing process easier, you can use BrowserStack,[⁹](#A978-1-4302-6491-0_26_Chapter.html#Fn9)\
    \ which is an online tool for checking browser compatibility. It shows you how\
    \ your site will look on different versions of the browsers you select. You can\
    \ also see how your site will look on mobile devices and tablets.\n\n## Footnotes\n\
    \n1. [`http://necolas.github.io/normalize.css/`](http://necolas.github.io/normalize.css/)\n\
    2. [`https://getfirebug.com`](https://getfirebug.com/)\n3. [`http://jigsaw.w3.org/css-validator/`](http://jigsaw.w3.org/css-validator/)\n\
    4. [`http://validator.w3.org`](http://validator.w3.org/)\n5. [`http://chrispederick.com/work/web-developer/`](http://chrispederick.com/work/web-developer/)\n\
    6. [`https://github.com/ServiceStack/Bundler`](https://github.com/ServiceStack/Bundler)\n\
    7. [`www.cleancss.com`](http://www.cleancss.com/)\n8. [`www.sitepoint.com/dustmeselectors/`](http://www.sitepoint.com/dustmeselectors/)\n\
    9. [`www.browserstack.com/screenshots`](http://www.browserstack.com/screenshots)"
  raw: '## Naming conventions


    It is helpful to name classes and ids in a way that clarifies their intended use.
    This structural naming convention means that the name should describe what the
    class or id is used for instead of what it looks like or where it is used in the
    web document.


    The advantage of this naming convention is that it becomes easier to change the
    look of your web site. For example, naming an id container `#main-content` is
    better than naming it `#center-column-500px`. In addition to intuitively understanding
    the use of the id, the first name is more versatile in case you later need to
    adjust the position or size of the element it is applied to.


    `#main-content {`


    `width: 500px;`


    `margin: 0 auto; /* centered */`


    `}`


    Names should be semantic, but not so semantic that they limit reuse. For instance,
    naming a class `.header-top-margin` is not as flexible as naming the class `.small-top-margin`
    (or `.small-tm`). To later recall that the class is mainly used in the header
    is easy enough; for example, you can search for the class name using the search
    function when viewing the page source in a web browser.


    `.small-top-margin { margin-top: 1em; }`


    In addition to conveying intended use, the class name can also show its relationships
    to other classes. For example, if a container class is called `.post`, the title
    for that container can be named `.post-title` to show that the class should be
    used only within an element applying the `.post` class.


    `.post {`


    `margin: 1em 0;`


    `}`


    `.post-title {`


    `font-size: 1.2em;`


    `}`


    The title class could also have been written as `.post.title` to ensure that the
    `.title` class can be used only within a container using the `.post` class. However,
    the `.post-title` name helps avoid naming conflicts and does not increase specificity,
    so that naming convention is often preferable. Notice that the relationship between
    the rules is further emphasized using indentation, which can significantly improve
    the code’s readability.


    ## Normalization


    Different browsers render some elements slightly differently, mainly because of
    variations in their default style sheets. To get a shared baseline, it is common
    to include a group of rules that normalize these browser inconsistencies and set
    reasonable defaults. The most popular choice for this is the GitHub `Normalize.css`
    project.[¹](#A978-1-4302-6491-0_26_Chapter.html#Fn1) By including these rules
    at the top of your style sheet (or a subset of them per your site’s requirements),
    you have a consistent starting point across all browsers from which you can build.
    The `Normalize.css` style sheet includes ample comments that explain each browser
    inconsistency that it resolves.


    ## Debugging


    There are many useful debugging tools available that can significantly simplify
    your work as a web developer. The Firebug extension for Firefox is one of the
    most powerful of these tools. It allows you to edit and debug CSS, HTML, and JavaScript
    live on any web page for testing purposes. You can also toggle styles on and off,
    as well as discover exactly which styles apply to a selected element. To learn
    more about Firebug, visit the official Firebug web site.[²](#A978-1-4302-6491-0_26_Chapter.html#Fn2)


    Functionalities similar to Firebug are available on Chrome through the Chrome
    Developer Tools that come built in to the browser. You can bring up the DevTools
    window with the shortcut Ctrl+Shift+I on Windows or Cmd+Opt+I on Mac. Alternatively,
    you can right-click on an element on the page and select Inspect Element to bring
    up the same window in element inspection mode.


    ## Validation


    It is a good idea to check that your CSS complies with the W3C standard. Improper
    code may cause unexpected results in how your site appears in different browsers.
    Moreover, having error-free code is a sign of a quality web site.


    The W3C provides its own online tool for validating CSS.[³](#A978-1-4302-6491-0_26_Chapter.html#Fn3)
    It checks a submitted page and returns any errors and warnings found on the page
    for you to fix. It also has a similar tool for validating HTML documents,[⁴](#A978-1-4302-6491-0_26_Chapter.html#Fn4)
    which is just as important to do. To make validation even more convenient, you
    can download a browser plug-in that checks the page’s code for you, such as the
    Web Developer plug-in available on Chrome, Firefox, and Opera.[⁵](#A978-1-4302-6491-0_26_Chapter.html#Fn5)


    ## Single style sheet


    For performance reasons, it is best to include a site’s style rules in a single
    external style sheet. Doing so minimizes the number of HTTP requests necessary
    to load the web site, while allowing the CSS file to be cached so that the visitor’s
    browser has to download it only once.


    During development of a large site, it is often preferable to separate style rules
    into several more-manageable CSS files. To have the best of both worlds, these
    development files can be combined into a single file as part of the site’s build
    process. One useful tool for this purpose is Bundle.[⁶](#A978-1-4302-6491-0_26_Chapter.html#Fn6)
    When your site design has become stable, this tool can also be used to minify
    your CSS.


    ## Minification


    Minification is the process of removing unnecessary characters from code to reduce
    its size. When a CSS file is minified, whitespace characters are removed, and
    the rules are optimized and restructured to load more quickly. This compression
    can greatly reduce the size of the file, which improves site performance at the
    cost of code readability. Because of the reduced readability, it is preferable
    to work with the uncompressed style sheet and have the minification step repeated
    whenever the CSS file is updated. Minification can be done automatically (for
    example, by using the Bundle tool mentioned earlier) or manually with an online
    tool such as Clean CSS.[⁷](#A978-1-4302-6491-0_26_Chapter.html#Fn7)


    One optimization that minification tools cannot do is to find and remove unused
    CSS rules. A useful Firefox plug-in that can help you perform this task is Dust-Me
    Selectors.[⁸](#A978-1-4302-6491-0_26_Chapter.html#Fn8) This plug-in can test pages
    individually and also scan through an entire site in search of unused selectors.


    ## Cross-browser testing


    Even with your code normalized and validated, there can still be some differences
    in the way a web page is rendered in various browsers, especially in older versions.
    It is therefore necessary to test your site in all the browser versions you want
    your site to support.


    To make this testing process easier, you can use BrowserStack,[⁹](#A978-1-4302-6491-0_26_Chapter.html#Fn9)
    which is an online tool for checking browser compatibility. It shows you how your
    site will look on different versions of the browsers you select. You can also
    see how your site will look on mobile devices and tablets.


