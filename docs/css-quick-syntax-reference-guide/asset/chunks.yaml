  raw: '## RGBA notation


    CSS 3 introduced the RGBA notation, adding an alpha value for specifying the color
    transparency. This alpha value is a number between 0.0 (fully transparent) and
    1.0 (fully opaque).


    `/* Red with 50% transparency */`


    `p { color: rgba(100%, 0%, 0%, 0.5); }`


    RGBA color values are supported in Chrome, Firefox 3+, IE9+, Safari, and Opera
    10+. If support is not present, the rule is ignored, so a fallback color value
    can be set as shown here:


    `p {`


      `color: rgb(100%, 0%, 0%); /* fallback */`


      `color: rgba(100%, 0%, 0%, 0.5);`


    `}`


    A browser that does not support RGBA ignores the second declaration and continues
    to apply the opaque version.


    ## HSL notation


    A color value can be set with the `hsl()` function (which stands for hue, saturation,
    and lightness). Hue is a degree on a color circle from 0 to 360, where 0 and 360
    are red, 120 is green, and 240 is blue. Saturation is a percentage value, with
    0% giving a shade of gray and 100% giving the full color. Lightness is also specified
    as a percentage, from 0% (black) to 100% (bright).


    `p { color: hsl(0, 100%, 100%); }`


    Although HSL colors are more intuitive than RGB colors, and the color values are
    easier to tweak, HSL should not be used until IE8 usage declines to a point when
    it is no longer necessary for web sites to support it. HSL is a CSS 3 value and
    is supported in Chrome, Firefox, IE9+, Safari, and Opera 10+.


    ## HSLA notation


    Similar to RGB, the HSL notation can be extended with an alpha value for specifying
    the transparency.


    `/* Red with 50% transparency */`


    `p { color: hsla(0, 100%, 100%, 0.5); }`


    HSLA is supported in Chrome, Firefox 3+, IE9+, Safari, and Opera 10+, which is
    the same as the RGBA function.


    # 9. Units


    There are several units to choose from when specifying the size of a property’s
    value.


    ## Absolute units


    The absolute units of length are centimeter (`cm`), millimeter (`mm`), and inch
    (`in`). Although these units are meant to look the same regardless of the screen
    resolution, it is not always the case because web browsers do not always know
    the exact physical size of the display medium.


    `.one-cm { font-size: 1cm; }`


    `.one-mm { font-size: 1mm; }`


    `.one-in { font-size: 1in; }`


    These units are mainly useful when the size of the output medium is known, such
    as for content that will be printed to paper. They are not recommended for screen
    displays because the screen sizes can vary a lot.


    ## Typographical units


    Points (`pt`) and picas (`pc`) are typographical units. By definition, there are
    72 points to an inch and 12 points to one pica. Like the absolute units, the typographical
    units are most useful for print style sheets, not for onscreen use.


    `.one-point { font-size: 1pt; }`


    `.one-pica  { font-size: 1pc; }`


    ## Relative units


    The relative units of length are pixel (`px`) and percentage (`%`). A percentage
    is a unit proportional to the parent’s value for that property; a pixel is relative
    to the physical pixel on the display device used.


    `.one-pixel   { font-size: 1px; }`


    `.one-percent { font-size: 1%; }`


    Pixels and percentages are two of the most useful units in CSS for onscreen displays.
    Pixels are fixed size, so they allow very precise control over the layout in a
    web document. Percentages, on the other hand, are useful for defining font sizes
    for text content because the text remains scalable, which is important for small
    devices and accessibility purposes. When the text is part of the design and needs
    to match other elements, it can be sized in pixels for greater control. Modern
    browsers all support full-page zooming, which has made pixel–based font sizes
    more acceptable. Note that for high-resolution screens, a CSS pixel renders as
    multiple screen pixels. For example, the Apple Retina display renders all pixel
    dimensions at twice their actual size.


    ## Font-relative units


    Two additional relative measures are em-height (`em`) and ex-height (`ex`). Em-height
    is the same as the font-size; ex-height is about half the font-size.


    `.one-ex { font-size: 1ex; }`


    `.one-em { font-size: 1em; }`


    Like percentage, em-height is a good relative unit that is commonly used for setting
    the font size of web document text. They both respect the user’s choice of font
    size in their browser and are easier to read on small-screen devices than pixel–based
    font sizes.


    CSS 3 introduced two additional font-relative units: `rem` and `ch`. The root
    em-height (`rem`) unit is relative to the font-size of the root element (`<html>`).
    It can be used instead of `em` to prevent the element’s font size from being affected
    by changes to the font size of its ancestor elements.


    `.one-rem { font-size: 1rem; }`


    The character unit (`ch`) measures the width of the character zero (0) for the
    element’s font. It can be useful for defining the width of a box containing text
    because the unit roughly corresponds to the number of characters that fit within
    that box.


    `/* Same width */`


    `<div style="width: 5ch;"></div>`


    `<div>00000</div>`


    The `ch` unit is supported only in Chrome 27+, Firefox 19+, and IE9+, so it should
    be used only with a fallback. The `rem` unit has slightly better support and works
    in Chrome 4+, Firefox 3.6+, IE9+, Safari 4.1+, and Opera 11.6+.


    ## Viewport units


    Viewport width (`vw`) and viewport height (`vh`) units allow elements to be dimensioned
    relative to the viewport, meaning the visible portion of the document. Each unit
    represents a percentage of the current viewport.


    `width:  50vw; /* 50% of viewport width */`


    `height: 25vh; /* 25% of viewport height */`


    Two additional viewport units are `vmin` and `vmax`, which give the minimum or
    maximum value of the viewport’s dimension.


    `width:  1vmin; /* 1vh or 1vw, whichever is smallest */`


    `height: 1vmax; /* 1vh or 1vw, whichever is largest */`


    Chrome 26+, Firefox 19+, IE11+, Safari 6.1+, and Opera 15+ all support the viewport
    units. The `vh`, `vw`, and `vmin` units have greater support than `vmax`, going
    back to Chrome 20+, IE9+, and Safari 6.0\. In IE9 and IE10, `vmin` is instead
    called `vm`.


    ## Unit values


    It is possible to set length using decimals. Some properties also allow negative
    values for length.


    `p { font-size: 0.394in; } /* decimal value */`


    `p { margin: -1px; } /* negative value */`


    Note that a rule does not work if there is a space before the unit or if no unit
    is specified—except for the value zero. Including a unit after zero is optional,
    but it is good practice to omit it.


    `p { font-size: 1ex; }  /* correct */`


    `p { font-size: 0; }    /* correct */`


    `p { font-size: 0ex; }  /* correct */`


    `p { font-size: 1 ex; } /* invalid */`


    `p { font-size: 1; }    /* invalid */`


    Whenever a CSS declaration contains an error, it is ignored by the browser. Any
    other valid declarations in the rule still apply.


    # 10. CSS Properties


    The remaining chapters of this book cover the multitude of properties available
    in CSS. In these chapters, possible property values are given using a formal notation,
    such as the one shown here:


    `text-shadow : inherit | none | <offset-x> <offset-y> [<blur-radius>] [<color>]`


    This notation means that the `text-shadow` property can have one of three different
    kinds of values. The default value is listed first; in this case, it is `inherit`.
    Because the `inherit` keyword can be set for any property, it is not included
    unless it is the default value. The second value, `none`, is also a keyword. It
    is the initial value for this property and can be applied to disable an inherited
    property effect.


    The third option in this notation includes a set of four values—two required ones
    and two optional ones—as indicated by the square brackets (`[]`). The angle brackets
    (`<>`) show that they are not keywords; they are other value types. In this case,
    they are three length values and a color value. Following this notation, the following
    declaration shows a valid example use of the `text-shadow` property:


    `text-shadow: 1px 1px 1px red;`'
  trans: "\n# RGBA 表示法\n\nCSS 3 引入了 RGBA 表示法，增加了一个用于指定颜色透明度的 alpha 值。该 alpha 值为介于\
    \ 0.0（完全透明）和 1.0（完全不透明）之间的数值。\n\n```\n/* 红色，透明度 50% */\np { color: rgba(100%,\
    \ 0%, 0%, 0.5); }\n```\n\nChrome、Firefox 3+、IE9+、Safari 和 Opera 10+ 均支持 RGBA 颜色值。若浏览器不支持，该规则将被忽略，因此可以像下方示例这样设置一个备用颜色值：\n\
    \n```\np {\n  color: rgb(100%, 0%, 0%); /* 备用值 */\n  color: rgba(100%, 0%, 0%,\
    \ 0.5);\n}\n```\n\n不支持 RGBA 的浏览器会忽略第二条声明，继续应用不透明版本的颜色。\n\n# HSL 表示法\n\n颜色值可以通过\
    \ `hsl()` 函数来设置（该名称代表色相、饱和度和明度）。色相是色环上从 0 到 360 的角度值，其中 0 和 360 为红色，120 为绿色，240\
    \ 为蓝色。饱和度以百分比表示，0% 为灰色，100% 为纯色。明度同样以百分比表示，范围从 0%（黑色）到 100%（亮色）。\n\n```\np { color:\
    \ hsl(0, 100%, 100%); }\n```\n\n尽管 HSL 颜色比 RGB 颜色更直观，颜色值也更容易调整，但在 IE8 的使用率下降到网站无需再支持它之前，不应使用\
    \ HSL。HSL 属于 CSS 3 中的值，受 Chrome、Firefox、IE9+、Safari 和 Opera 10+ 支持。\n\n# HSLA\
    \ 表示法\n\n与 RGB 类似，HSL 表示法也可以扩展一个用于指定透明度的 alpha 值。\n\n```\n/* 红色，透明度 50% */\np\
    \ { color: hsla(0, 100%, 100%, 0.5); }\n```\n\nChrome、Firefox 3+、IE9+、Safari 和\
    \ Opera 10+ 均支持 HSLA，这与 RGBA 函数的支持情况相同。\n\n# 单位\n\n在指定属性值的大小时，有多个单位可供选择。\n\n##\
    \ 绝对单位\n\n长度的绝对单位包括厘米（`cm`）、毫米（`mm`）和英寸（`in`）。尽管这些单位旨在不论屏幕分辨率如何都保持一致的外观，但实际情况并非总是如此，因为浏览器并不总能获知显示介质的精确物理尺寸。\n\
    \n```\n.one-cm { font-size: 1cm; }\n.one-mm { font-size: 1mm; }\n.one-in { font-size:\
    \ 1in; }\n```\n\n当输出介质的尺寸已知时（例如用于打印到纸张的内容），这些单位非常有用。不建议在屏幕显示中使用这些单位，因为屏幕尺寸可能差异很大。\n\
    \n## 印刷单位\n\n点（`pt`）和派卡（`pc`）是印刷单位。根据定义，1 英寸等于 72 点，1 派卡等于 12 点。与绝对单位类似，印刷单位最适用于打印样式表，而非屏幕显示。\n\
    \n```\n.one-point { font-size: 1pt; }\n.one-pica  { font-size: 1pc; }\n```\n\n\
    ## 相对单位\n\n长度的相对单位包括像素（`px`）和百分比（`%`）。百分比是与该属性父元素值成比例的单位；像素相对于所用显示设备上的物理像素而言。\n\
    \n```\n.one-pixel   { font-size: 1px; }\n.one-percent { font-size: 1%; }\n```\n\
    \n对于屏幕显示而言，像素和百分比是 CSS 中最有用的两种单位。像素是固定尺寸的，因此可以非常精确地控制网页文档中的布局。另一方面，百分比对于定义文本内容的字体大小非常有用，因为文本保持可缩放性，这对于小屏幕设备和无障碍访问非常重要。当文本是设计的一部分且需要与其他元素匹配时，可以使用像素来设置尺寸，以获得更好的控制。现代浏览器都支持整页缩放，这使得基于像素的字体大小更易被接受。请注意，对于高分辨率屏幕，一个\
    \ CSS 像素会渲染为多个屏幕像素。例如，Apple Retina 显示屏会将所有像素尺寸以实际大小的两倍进行渲染。\n\n## 字体相对单位\n\n另外两个相对度量单位是\
    \ em 高度（`em`）和 ex 高度（`ex`）。Em 高度与字体大小相同；ex 高度约为字体大小的一半。\n\n```\n.one-ex { font-size:\
    \ 1ex; }\n.one-em { font-size: 1em; }\n```\n\n与百分比类似，em 高度是一种良好的相对单位，常用于设置网页文档文本的字体大小。两者都尊重用户在浏览器中选择的字体大小，并且在小屏幕设备上比基于像素的字体大小更易于阅读。\n\
    \nCSS 3 引入了两个额外的字体相对单位：`rem` 和 `ch`。根 em 高度（`rem`）单位相对于根元素（`<html>`）的字体大小。它可以用来替代\
    \ `em`，以防止元素的字体大小受到其祖先元素字体大小变化的影响。\n\n```\n.one-rem { font-size: 1rem; }\n```\n\
    \n字符单位（`ch`）测量元素字体中字符零（0）的宽度。该单位非常适用于定义包含文本的盒子的宽度，因为它大致对应了该盒子内能容纳的字符数量。\n\n```\n\
    /* 相同宽度 */\n<div style=\"width: 5ch;\"></div>\n<div>00000</div>\n```\n\n`ch` 单位仅受\
    \ Chrome 27+、Firefox 19+ 和 IE9+ 支持，因此应仅在提供备用方案的情况下使用。`rem` 单位的支持稍好一些，适用于 Chrome\
    \ 4+、Firefox 3.6+、IE9+、Safari 4.1+ 和 Opera 11.6+。\n\n## 视口单位\n\n视口宽度（`vw`）和视口高度（`vh`）单位允许元素相对于视口（即可见的文档部分）来设置尺寸。每个单位代表当前视口的一个百分比值。\n\
    \n```\nwidth:  50vw; /* 视口宽度的 50% */\nheight: 25vh; /* 视口高度的 25% */\n```\n\n另外两个视口单位是\
    \ `vmin` 和 `vmax`，分别给出视口尺寸的最小值或最大值。\n\n```\nwidth:  1vmin; /* 1vh 或 1vw，取较小值 */\n\
    height: 1vmax; /* 1vh 或 1vw，取较大值 */\n```\n\nChrome 26+、Firefox 19+、IE11+、Safari\
    \ 6.1+ 和 Opera 15+ 均支持视口单位。`vh`、`vw` 和 `vmin` 单位的支持范围比 `vmax` 更广，可追溯到 Chrome 20+、IE9+\
    \ 和 Safari 6.0。在 IE9 和 IE10 中，`vmin` 被称为 `vm`。\n\n## 单位值\n\n可以使用小数来设置长度。某些属性也允许长度为负值。\n\
    \n```\np { font-size: 0.394in; } /* 小数值 */\np { margin: -1px; } /* 负值 */\n```\n\
    \n请注意，如果单位前有空格或未指定单位（零值除外），则规则无效。在零后包含单位是可选的，但省略它是一种良好的做法。\n\n```\np { font-size:\
    \ 1ex; }  /* 正确 */\np { font-size: 0; }    /* 正确 */\np { font-size: 0ex; }  /*\
    \ 正确 */\np { font-size: 1 ex; } /* 无效 */\np { font-size: 1; }    /* 无效 */\n```\n\
    \n当 CSS 声明包含错误时，浏览器会忽略它。规则中的其他有效声明仍然生效。\n\n# CSS 属性\n\n本书的其余章节将介绍 CSS 中可用的众多属性。在这些章节中，将使用形式化表示法给出可能的属性值，如下所示：\n\
    \n```\ntext-shadow : inherit | none | <offset-x> <offset-y> [<blur-radius>] [<color>]\n\
    ```\n\n这种表示法意味着 `text-shadow` 属性可以有三种不同类型中的一种值。默认值列在首位；这里默认值是 `inherit`。由于 `inherit`\
    \ 关键字可为任何属性设置，除非它是默认值，否则不包含在内。第二个值 `none` 也是一个关键字。它是此属性的初始值，可用于禁用继承的属性效果。\n\n\
    该表示法中的第三个选项包含一组四个值——两个必需值，两个可选值——如方括号（`[]`）所示。尖括号（`<>`）表示它们不是关键字；它们是其他值类型。在此示例中，它们是三个长度值和一个颜色值。遵循此表示法，以下声明展示了\
    \ `text-shadow` 属性的一个有效示例用法：\n\n```\ntext-shadow: 1px 1px 1px red;\n```\n"
- fmt: "# Generic keywords\n\nIn addition to `inherit`, there are two other generic\
    \ property keywords you might come across in CSS: `initial` and `unset`. Both\
    \ generic keywords were introduced in CSS 3 and can be set on any properties.\n\
    \nThe `initial` keyword applies a property’s initial value to an element, as defined\
    \ by the CSS specification. It is supported in Chrome 1+, Firefox 19+, Safari\
    \ 1.2+, and Opera 15+, but it is currently not supported in any version of IE.\
    \ Because of the lack of IE support, the usefulness of this keyword is limited.\
    \ It is recommended to instead explicitly specify the initial value for a given\
    \ property to reset it.\n\nThe third generic keyword is `unset`, which is a combination\
    \ of the `initial` and `inherit` keywords. It resets the property to its inherited\
    \ value, if there is one; otherwise, it sets the property to the initial value.\
    \ At this moment, support for the `unset` keyword is limited to Firefox 27+. Until\
    \ all major browsers adapt this keyword, it should not be used.\n\n# Quirks mode\n\
    \nWhen HTML and CSS became standardized by the World Wide Web Consortium (W3C),\
    \ web browsers could not just comply with the standards because doing so would\
    \ break most web sites already in existence. Browsers instead created two separate\
    \ rendering modes: one for new standard compliant sites and one for old legacy\
    \ sites (quirks mode).\n\nIn full standards mode, the browser does its best to\
    \ render the page in accordance with HTML and CSS specifications. Browsers use\
    \ the doctype for the sole purpose of deciding between full standards mode and\
    \ quirks mode. A valid doctype at the start of a web document, such as the HTML\
    \ 5 doctype seen following, ensures that the page is rendered in full standards\
    \ mode:\n\n```\n<!DOCTYPE html>\n<html> ... </html>\n```\n\nThis doctype triggers\
    \ full standards mode in all major browsers, dating back as far as IE6.\n\n# Vendor\
    \ prefixes\n\nMany browsers begin incorporating new CSS properties long before\
    \ their specification becomes stable. Because these implementations are experimental,\
    \ their property names include a vendor prefix to indicate that the specification\
    \ could potentially change in the future.\n\nThe major vendor prefixes include\
    \ `-moz` for Firefox; `-ms` for Internet Explorer; `-o` for Opera; and `-webkit`\
    \ for Chrome, Safari, Android, and iOS. Recent versions of Opera also implement\
    \ the `-webkit` prefix in parallel with the `-o` prefix. For example, support\
    \ for the CSS 3 `border-radius` property can be increased by using the following\
    \ vendor prefixes. Note that the unprefixed version should always be included\
    \ last.\n\n```\n.round {\n  /* Safari 3-4, iOS 1-3.2, Android 1.6-2.0 */\n  -webkit-border-radius:\
    \ 3px;\n  /* Firefox 1-3.6 */\n  -moz-border-radius: 3px;\n  /* Opera 10.5+, IE9+,\
    \ Safari 5+, Chrome 1+,\n     Firefox 4+, iOS 4+, Android 2.1+ */\n  border-radius:\
    \ 3px;\n}\n```\n\nAs time goes on, the new property’s specification becomes stable,\
    \ and browsers drop the vendor prefix. Given more time, web users abandon old\
    \ browsers in favor of new versions, and the need for vendor prefixes diminishes.\
    \ This has already occurred for the `border-radius` property, and developers are\
    \ now encouraged to drop the prefixes, making things a little easier for web developers\
    \ worldwide.\n\n# Progressive enhancement\n\nWhen deciding whether to use a recent\
    \ CSS feature, it is important to consider how your site will look without it.\
    \ If the feature enhances the appearance of your site, such as the CSS 3 `border-radius`\
    \ property, you might want to start using the feature, even when it is viewable\
    \ by only a small percentage of your visitors. Time works in your favor, and as\
    \ people abandon old browsers, a greater number of your visitors can see the feature,\
    \ which enhances their experience on your site. This is the essence of progressive\
    \ enhancement.\n\nOn the other hand, if your site depends on the feature and appears\
    \ broken without it, you need to carefully consider how well supported the feature\
    \ is and whether there are fallbacks or scripts you can make use of to increase\
    \ this support, such as those listed on HTML5 Polyfills.[¹](#A978-1-4302-6491-0_10_Chapter.html#Fn1)\
    \ There are often many ways to achieve the same result in CSS, so it is a good\
    \ idea to choose a method that is well supported by all major browsers for the\
    \ key elements of your site, such as the layout.\n\nFootnotes [1](#A978-1-4302-6491-0_10_Chapter.html#Fn1_source)\n\
    \n[`http://html5polyfill.com`](http://html5polyfill.com/)\n\n# 11. Text\n\nThe\
    \ text properties serve to format the visual appearance of text content.\n\n##\
    \ color\n\nThe `color` property sets the color of text by using either one of\
    \ the color notations. By default, its value is set to `inherit`, meaning that\
    \ it inherits the color of its parent element.\n\n```\ncolor : inherit | <color>\n\
    ```\n\nThe initial value is black for all major browsers. In the following example\
    \ rule, paragraphs are colored blue:\n\n```\np { color: #00f; }\n```\n\n## text-transform\n\
    \n`text-transform` controls text casing. Possible values are listed as follows,\
    \ with `none` as the initial value:\n\n```\ntext-transform : inherit | none |\
    \ uppercase | lowercase | capitalize\n```\n\nThis property enables text to be\
    \ converted into either uppercase or lowercase letters. The `capitalize` value\
    \ capitalizes the first letter of each word. This property inherits by default,\
    \ so the `none` value can be used to remove an inherited `text-transform` effect.\n\
    \n```\ntext-transform: none; /* remove effect */\n```\n\n## text-decoration\n\n\
    One or more visual effects to text can be added with the `text-decoration` property.\n\
    \n```\ntext-decoration : none | underline + overline + line-through + blink\n\
    ```\n\nTo add multiple decorations, separate the values with spaces (indicated\
    \ by the “`+`” sign, shown previously). The following rule adds a line above and\
    \ below text content that is affected by this class:\n\n```\n.highlight { text-decoration:\
    \ underline overline; }\n```\n\nThis property does not inherit, but its effect\
    \ renders across descendent inline elements in a way that is similar to inheritance.\n\
    \n## text-indent\n\nThe first line of text in a block element can be indented\
    \ with the `text-indent` property. It can be set to a unit of measure or a percentage\
    \ of the parent element’s width. Text can also be indented backward by using a\
    \ negative value.\n\n```\ntext-indent (block) : inherit | <length> | <percentage>\n\
    ```\n\nThe following example indents the first line of paragraph elements by one\
    \ em:\n\n```\np { text-indent: 1em; }\n```\n\n## text-align\n\nThe text content\
    \ of a block element can be aligned with the `text-align` property. This property\
    \ can replace usages of the deprecated `align` attribute in HTML.\n\n```\ntext-align\
    \ (block) : inherit | left | center | right | justify\n```\n\nText and inline\
    \ elements can be aligned to the left, aligned to the right, or centered. The\
    \ `justify` value also stretches each line so that both the right and left margins\
    \ appear straight.\n\n```\np { text-align: justify; }\n```\n\nThe `text-align`\
    \ property inherits, so it needs to be explicitly changed in child elements to\
    \ restore default left alignment.\n\n## direction\n\nThe writing direction of\
    \ text can be switched with the `direction` property.\n\n```\ndirection (block)\
    \ : inherit | ltr | rtl\n```\n\nThe default value is `ltr`, meaning left-to-right.\
    \ It can be changed to `rtl` to make text content within a block element flow\
    \ to the right. It indicates that the text is supposed to be read from right-to-left,\
    \ as in Hebrew or Arabic text, for example.\n\n```\n<p style=\"direction: rtl\"\
    >\n  Aligned from right-to-left\n</p>\n```\n\nThis property does inherit, so it\
    \ can be set once for the `<body>` element to apply to the whole web page."
  raw: '## Generic keywords


    In addition to `inherit`, there are two other generic property keywords you might
    come across in CSS: `initial` and `unset`. Both generic keywords were introduced
    in CSS 3 and can be set on any properties.


    The `initial` keyword applies a property’s initial value to an element, as defined
    by the CSS specification. It is supported in Chrome 1+, Firefox 19+, Safari 1.2+,
    and Opera 15+, but it is currently not supported in any version of IE. Because
    of the lack of IE support, the usefulness of this keyword is limited. It is recommended
    to instead explicitly specify the initial value for a given property to reset
    it.


    The third generic keyword is `unset`, which is a combination of the `initial`
    and `inherit` keywords. It resets the property to its inherited value, if there
    is one; otherwise, it sets the property to the initial value. At this moment,
    support for the `unset` keyword is limited to Firefox 27+. Until all major browsers
    adapt this keyword, it should not be used.


    ## Quirks mode


    When HTML and CSS became standardized by the World Wide Web Consortium (W3C),
    web browsers could not just comply with the standards because doing so would break
    most web sites already in existence. Browsers instead created two separate rendering
    modes: one for new standard compliant sites and one for old legacy sites (quirks
    mode).


    In full standards mode, the browser does its best to render the page in accordance
    with HTML and CSS specifications. Browsers use the doctype for the sole purpose
    of deciding between full standards mode and quirks mode. A valid doctype at the
    start of a web document, such as the HTML 5 doctype seen following, ensures that
    the page is rendered in full standards mode:


    `<!DOCTYPE html>`


    `<html> ... </html>`


    This doctype triggers full standards mode in all major browsers, dating back as
    far as IE6.


    ## Vendor prefixes


    Many browsers begin incorporating new CSS properties long before their specification
    becomes stable. Because these implementations are experimental, their property
    names include a vendor prefix to indicate that the specification could potentially
    change in the future.


    The major vendor prefixes include `-moz` for Firefox; `-ms` for Internet Explorer;
    `-o` for Opera; and `-webkit` for Chrome, Safari, Android, and iOS. Recent versions
    of Opera also implement the `-webkit` prefix in parallel with the `-o` prefix.
    For example, support for the CSS 3 `border-radius` property can be increased by
    using the following vendor prefixes. Note that the unprefixed version should always
    be included last.


    `.round {`


      `/* Safari 3-4, iOS 1-3.2, Android 1.6-2.0 */`


      `-webkit-border-radius: 3px;`


      `/* Firefox 1-3.6 */`


      `-moz-border-radius: 3px;`


      `/* Opera 10.5+, IE9+, Safari 5+, Chrome 1+,`


         `Firefox 4+, iOS 4+, Android 2.1+ */`


      `border-radius: 3px;`


    `}`


    As time goes on, the new property’s specification becomes stable, and browsers
    drop the vendor prefix. Given more time, web users abandon old browsers in favor
    of new versions, and the need for vendor prefixes diminishes. This has already
    occurred for the `border-radius` property, and developers are now encouraged to
    drop the prefixes, making things a little easier for web developers worldwide.


    ## Progressive enhancement


    When deciding whether to use a recent CSS feature, it is important to consider
    how your site will look without it. If the feature enhances the appearance of
    your site, such as the CSS 3 `border-radius` property, you might want to start
    using the feature, even when it is viewable by only a small percentage of your
    visitors. Time works in your favor, and as people abandon old browsers, a greater
    number of your visitors can see the feature, which enhances their experience on
    your site. This is the essence of progressive enhancement.


    On the other hand, if your site depends on the feature and appears broken without
    it, you need to carefully consider how well supported the feature is and whether
    there are fallbacks or scripts you can make use of to increase this support, such
    as those listed on HTML5 Polyfills.[¹](#A978-1-4302-6491-0_10_Chapter.html#Fn1)
    There are often many ways to achieve the same result in CSS, so it is a good idea
    to choose a method that is well supported by all major browsers for the key elements
    of your site, such as the layout.


    Footnotes [1](#A978-1-4302-6491-0_10_Chapter.html#Fn1_source)


    [`http://html5polyfill.com`](http://html5polyfill.com/)


    # 11. Text


    The text properties serve to format the visual appearance of text content.


    ## color


    The `color` propertysets the color of text by using either one of the color notations.
    By default, its value is set to `inherit`, meaning that it inherits the color
    of its parent element.


    `color : inherit | <color>`


    The initial value is black for all major browsers. In the following example rule,
    paragraphs are colored blue:


    `p { color: #00f; }`


    ## text-transform


    `text-transform` controls text casing. Possible values are listed as follows,
    with `none` as the initial value:


    `text-transform : inherit | none | uppercase |` `lowercase | capitalize`


    This property enables text to be converted into either uppercase or lowercase
    letters. The `capitalize` value capitalizes the first letter of each word. This
    property inherits by default, so the `none` value can be used to remove an inherited
    `text-transform` effect.


    `text-transform: none; /* remove effect */`


    ## text-decoration


    One or more visual effects to text can be added with the `text-decoration` property.


    `text-decoration : none | underline + overline +` `line-through + blink`


    To add multiple decorations, separate the values with spaces (indicated by the
    “`+`” sign, shown previously). The following rule adds a line above and below
    text content that is affected by this class:


    `.highlight { text-decoration: underline overline; }`


    This property does not inherit, but its effect renders across descendent inline
    elements in a way that is similar to inheritance.


    ## text-indent


    The first line of text in a block element can be indented with the `text-indent`
    property. It can be set to a unit of measure or a percentage of the parent element’s
    width. Text can also be indented backward by using a negative value.


    `text-indent (block) : inherit | <length> | <percentage>`


    The following example indents the first line of paragraph elements by one em:


    `p { text-indent: 1em; }`


    ## text-align


    The text content of a block element can be aligned with the `text-align` property.
    This property can replace usages of the deprecated `align` attribute in HTML.


    `text-align (block) : inherit | left | center | right | justify`


    Text and inline elements can be aligned to the left, aligned to the right, or
    centered. The `justify` value also stretches each line so that both the right
    and left margins appear straight.


    `p { text-align: justify; }`


    The `text-align` property inherits, so it needs to be explicitly changed in child
    elements to restore default left alignment.


    ## direction


    The writing direction of text can be switched with the `direction` property.


    `direction (block) : inherit | ltr | rtl`


    The default value is `ltr`, meaning left-to-right. It can be changed to `rtl`
    to make text content within a block element flow to the right. It indicates that
    the text is supposed to be read from right-to-left, as in Hebrew or Arabic text,
    for example.


    `<p style="direction: rtl">`


      `Aligned from right-to-left`


    `</p>`


    This property does inherit, so it can be set once for the `<body>` element to
    apply to the whole web page.'
  trans: "\n# 通用关键字\n\n除了 `inherit`，你在 CSS 中可能还会遇到另外两个通用属性关键字：`initial` 和 `unset`。这两个通用关键字均在\
    \ CSS 3 中引入，并且可以设置在任何属性上。\n\n`initial` 关键字将属性的初始值（由 CSS 规范定义）应用到元素上。该关键字在 Chrome\
    \ 1+、Firefox 19+、Safari 1.2+ 以及 Opera 15+ 中受到支持，但目前在任何版本的 IE 中均不受支持。由于缺乏 IE 支持，此关键字的实用性有限。建议显式地为特定属性指定其初始值以进行重置。\n\
    \n第三个通用关键字是 `unset`，它是 `initial` 和 `inherit` 关键字的组合。如果属性有继承值，它会将属性重置为其继承值；否则，它会将属性设置为初始值。目前，对\
    \ `unset` 关键字的支持仅限于 Firefox 27+。在所有主流浏览器支持此关键字之前，不应使用它。\n\n# 怪异模式\n\n当 HTML 和\
    \ CSS 被万维网联盟（W3C）标准化后，网页浏览器不能简单地遵从标准，因为这样做会破坏大多数已存在的网站。浏览器转而创建了两种独立的渲染模式：一种用于符合标准的新网站，另一种用于旧的遗留网站（怪异模式）。\n\
    \n在标准模式下，浏览器会尽力根据 HTML 和 CSS 规范来渲染页面。浏览器使用 `doctype`（文档类型声明）的唯一目的就是决定采用标准模式还是怪异模式。在网页文档开头处使用有效的\
    \ `doctype`（例如下面看到的 HTML 5 doctype）可以确保页面以标准模式渲染：\n\n```\n<!DOCTYPE html>\n<html>\
    \ ... </html>\n```\n\n这个 doctype 会触发所有主流浏览器（甚至可以追溯到 IE6）的标准模式。\n\n# 供应商前缀\n\n\
    许多浏览器在某个新 CSS 属性的规范稳定之前，就早早地开始引入该属性。因为这些实现是实验性的，所以它们的属性名称包含一个供应商前缀，以表明该规范将来可能会发生变化。\n\
    \n主要的供应商前缀包括：用于 Firefox 的 `-moz`；用于 Internet Explorer 的 `-ms`；用于 Opera 的 `-o`；以及用于\
    \ Chrome、Safari、Android 和 iOS 的 `-webkit`。最近的 Opera 版本也与 `-o` 前缀并行实现了 `-webkit`\
    \ 前缀。例如，可以通过使用以下供应商前缀来提高对 CSS 3 `border-radius` 属性的支持。注意，无前缀版本应始终放在最后。\n\n```\n\
    .round {\n  /* Safari 3-4, iOS 1-3.2, Android 1.6-2.0 */\n  -webkit-border-radius:\
    \ 3px;\n  /* Firefox 1-3.6 */\n  -moz-border-radius: 3px;\n  /* Opera 10.5+, IE9+,\
    \ Safari 5+, Chrome 1+,\n     Firefox 4+, iOS 4+, Android 2.1+ */\n  border-radius:\
    \ 3px;\n}\n```\n\n随着时间的推移，新属性的规范会变得稳定，浏览器会逐渐放弃供应商前缀。再过一段时间，网络用户会放弃旧浏览器转而使用新版本，对供应商前缀的需求便会减少。`border-radius`\
    \ 属性已经经历了这个过程，现在鼓励开发者弃用这些前缀，以便让全世界的 Web 开发者更轻松一些。\n\n# 渐进增强\n\n在决定是否使用最新的 CSS\
    \ 特性时，重要的是要考虑没有它时你的网站会是什么样子。如果该特性能够增强你网站的外观（例如 CSS 3 的 `border-radius` 属性），你可能会想开始使用它，即使只有一小部分访问者能看到它。时间会站在你这一边，随着人们抛弃旧浏览器，越来越多的访问者能够看到这个特性，从而增强他们在你网站上的体验。这就是渐进增强的本质。\n\
    \n另一方面，如果你的网站依赖该特性，而没有它时网站看起来会出问题，那么你需要仔细考虑该特性的支持程度，以及是否有你可以利用的后备方案或脚本来提高支持率，例如\
    \ HTML5 Polyfills 网站上列出的那些。¹ 在 CSS 中实现相同效果的方法通常有很多种，因此为网站的关键元素（如布局）选择一种所有主流浏览器都很好支持的方法是一个好主意。\n\
    \n脚注 1\n\n[`http://html5polyfill.com`](http://html5polyfill.com/)\n\n# 11. 文本\n\
    \n文本属性用于格式化文本内容的视觉外观。\n\n## color\n\n`color` 属性通过使用某种颜色表示法来设置文本的颜色。默认情况下，其值设置为\
    \ `inherit`，意味着它继承父元素的颜色。\n\n```\ncolor : inherit | <color>\n```\n\n所有主流浏览器的初始值都是黑色。在下面的示例规则中，段落将被设置为蓝色：\n\
    \n```\np { color: #00f; }\n```\n\n## text-transform\n\n`text-transform` 控制文本的大小写。可能的取值如下所列，其中\
    \ `none` 为初始值：\n\n```\ntext-transform : inherit | none | uppercase | lowercase\
    \ | capitalize\n```\n\n此属性可以将文本转换为大写或小写字母。`capitalize` 值会将每个单词的首字母大写。此属性默认继承，因此可以使用\
    \ `none` 值来移除继承的 `text-transform` 效果。\n\n```\ntext-transform: none; /* 移除效果 */\n\
    ```\n\n## text-decoration\n\n可以使用 `text-decoration` 属性为文本添加一个或多个视觉效果。\n\n```\n\
    text-decoration : none | underline + overline + line-through + blink\n```\n\n\
    若要添加多个装饰效果，请用空格分隔这些值（如之前使用“`+`”号所示）。以下规则为应用此类的文本内容添加了上划线和下划线：\n\n```\n.highlight\
    \ { text-decoration: underline overline; }\n```\n\n此属性不会继承，但它的效果会以类似于继承的方式渲染到后代行内元素上。\n\
    \n## text-indent\n\n块级元素中第一行文本可以使用 `text-indent` 属性进行缩进。它可以设置为一个度量单位或父元素宽度的百分比。也可以通过使用负值来实现反向缩进。\n\
    \n```\ntext-indent (块级) : inherit | <length> | <percentage>\n```\n\n以下示例将段落元素的第一行缩进一个\
    \ em 的宽度：\n\n```\np { text-indent: 1em; }\n```\n\n## text-align\n\n块级元素的文本内容可以使用\
    \ `text-align` 属性进行对齐。此属性可以替代 HTML 中已废弃的 `align` 属性的用法。\n\n```\ntext-align (块级)\
    \ : inherit | left | center | right | justify\n```\n\n文本和行内元素可以左对齐、右对齐或居中对齐。`justify`\
    \ 值还会拉伸每一行，以使左右边距看起来都整齐。\n\n```\np { text-align: justify; }\n```\n\n`text-align`\
    \ 属性会继承，因此需要在子元素中显式更改它，以恢复默认的左对齐。\n\n## direction\n\n文本的书写方向可以使用 `direction` 属性进行切换。\n\
    \n```\ndirection (块级) : inherit | ltr | rtl\n```\n\n默认值是 `ltr`，表示从左到右。可以将其更改为\
    \ `rtl`，以使块级元素内的文本内容从右向左排列。这表明文本应从右向左阅读，例如希伯来语或阿拉伯语文本。\n\n```\n<p style=\"direction:\
    \ rtl\">\n  从右到左对齐\n</p>\n```\n\n此属性会继承，因此可以在 `<body>` 元素上设置一次，使其应用于整个网页。\n"
- fmt: "# `text-shadow`\n\nA shadow effect can be added to text with the `text-shadow`\
    \ property.\n\n`text-shadow : inherit | none | <offset-x> <offset-y>` `[<blur-radius>]\
    \ [<color>]`\n\nThe shadow is defined using two offset values, followed by two\
    \ optional values for the blur radius and color. The x and y offsets are specified\
    \ as length values relative to the text. Positive values move the shadow right\
    \ and down; negative values move it left and up.\n\nA blur effect can be added\
    \ by setting a blur radius, which makes the shadow stretch and fade at the edges.\
    \ The final optional value for the property is the color of the shadow. If no\
    \ color value is specified, most browsers render the shadow in the same color\
    \ as the text. The following example style causes a slightly blurred gray shadow\
    \ to appear at the top right of `<h1>` elements:\n\n`h1 { text-shadow: 1px -1px\
    \ 1px gray; }`\n\n`text-shadow` is a CSS 3 property that is supported by most\
    \ major browsers, including Chrome 2+, Firefox 3.5+, IE10+, Safari 1.2+, and Opera\
    \ 9.5+.\n\n# `box-shadow`\n\nIn addition to text, a shadow effect can be added\
    \ to block elements with the `box-shadow` property.\n\n`box-shadow (block) : inherit\
