    # 3. 类选择器与 ID 选择器


    类选择器和 ID 选择器定义的规则仅适用于选定的 HTML 元素集。它们允许你标识单个元素或元素组，而无需为元素类型的所有实例设置样式。


    ## 类选择器


    类选择器用于标识一组元素。它通过句点符（`.`）后跟类名来识别。类可以是可应用于任何元素的通用类。


    ```

    /* 选择任何类名为 myclass 的元素 */

    .myclass {}

    ```


    选择器也可以是一个只能应用于一种元素类型的特定类。特定类通过在句点符前声明元素名称来定义。


    ```

    /* 选择任何类名为 myclass 的 <p> 元素 */

    p.myclass {}

    ```


    特定类使得标识类在何处使用更加容易；通用类则允许更大的代码复用性。


    ### 类示例


    例如，假设某些元素内的文本需要着色，但不是所有该元素实例都需要。第一步是添加一个指定了颜色属性的通用类规则。


    ```

    .info { color: green; }

    ```


    该规则规定，任何 `class` 属性值为 `"info"` 的元素都将采用此样式。


    ```

    <p class="info">绿色</p>

    ```


    如果某个类规则只被一种元素类型使用，它可以被定义为特定类。这样做能让阅读样式表的任何人更容易理解该样式用于何处。


    ```

    p.warn { color: orange; }

    ```


    特定类规则与通用类规则以相同方式应用于文档，但它只会为指定类型的元素设置样式。


    ```

    <p class="warn">橙色</p>

    ```


    通过用空格分隔每个类名，可以将多个类规则应用于单个元素，这使得类规则非常灵活。


    ```

    <p class="style1 style2"></p>

    ```


    ## ID 选择器


    ID 选择器用于标识单个唯一元素。虽然它的工作方式与类选择器非常相似，但它使用的是井号符（`#`）而不是句点符，并且使用的是 `id` 属性而不是 `class`
    属性。与 `class` 属性一样，`id` 是一个通用属性，可以应用于几乎任何 HTML 元素。它为文档中的元素提供了唯一标识符。


    ```

    /* 选择 id 设置为 myid 的元素 */

    #myid {}

    ```


    与类选择器一样，ID 选择器可以通过元素进行限定。但是，由于一个给定 ID 应该只有一个元素，这种额外的限定通常被认为是不必要的。


    ```

    /* 选择 id 设置为 myid 的 <p> 元素 */

    p#myid {}

    ```


    ### ID 示例


    以下 ID 选择器将匹配文档中 `id` 属性设置为该 ID 的唯一元素。因此，如果样式意图只应用于单个元素实例，可以使用此选择器代替类选择器，因为这能更清晰地表明规则的使用位置。


    ```

    #err { color: red; }

    ```


    ID 规则通过使用 `id` 属性应用于元素。由于 `id` 属性必须唯一，每个 ID 选择器在每个网页上只能用于一个元素。因此，ID 选择器隐式地指定了该样式在任何页面上只使用一次。


    ```

    <p id="err">红色</p>

    ```


    ## 类与 ID 使用指南


    在许多情况下，使用类是 CSS 中选择元素的首选方法，因为类既灵活又可复用。另一方面，ID 通常用于网站的结构元素，例如 `#content` 和 `#footer`，以突出这些元素具有独特作用。


    # 4. 属性选择器


    属性选择器允许根据元素的属性及其属性值向元素添加样式。


    ## 属性选择器


    属性选择器将匹配使用了指定属性的元素，无论其属性值为何。


    ```

    input[type] {}

    ```


    此选择器仅匹配使用了 `type` 属性的 input 元素，例如以下元素：


    ```

    <input type="text">

    ```


    ## 属性值选择器


    `[attribute=value]` 选择器将同时根据属性和属性值进行匹配。


    ```

    input[type="submit"] {}

    ```


    那些 `type` 属性设置为 `submit` 的 input 元素将匹配此规则，如下例所示：


    ```

    <input type="submit">

    ```


    ## 语言属性选择器


    语言属性选择器用于匹配 `lang` 属性。


    ```

    p[lang|="en"] {}

    ```


    此选择器将匹配任何 `lang` 属性值以“en”开头的元素，例如“en-US”。请注意，此类语言代码不区分大小写。


    ```

    <p lang="en">英语</p>

    <p lang="en-US">美式英语</p>

    ```


    ## 分隔值选择器


    `[attribute~=value]` 选择器将应用于其属性值在以空格分隔的单词列表中包含给定单词的元素。


    ```

    input[value~="word"] {}

    ```


    此规则将选中以下两个元素。该单词需要大小写完全匹配；例如，该选择器不会定位“Word”或“words”。


    ```

    <input type="text" value="word">

    <input type="text" value="word word2">

    ```


    ## 值子串选择器


    `[attribute*=value]` 选择器匹配属性值包含指定子串的元素。


    ```

    p[title*="para"] {}

    ```


    `title` 属性包含“para”的段落元素将匹配此规则。


    ```

    <p title="my paragraph"></p>

    ```


    ## 值开头选择器


    `[attribute^=value]` 选择器匹配每个属性值以指定字符串开头的元素。


    ```

    p[title^="first"] {}

    ```


    `title` 属性值以“first”开头的段落将应用此规则。


    ```

    <p title="first paragraph"></p>

    ```


    ## 值结尾选择器


    `[attribute$=value]` 选择器匹配属性值以指定字符串结尾的元素。


    ```

    p[title$="1"] {}

    ```


    在以下代码中，`title` 属性的值以“1”结尾，因此将匹配此规则：


    ```

    <p title="paragraph 1"></p>

    ```


    # 5. 伪选择器


    伪类和伪元素是可以附加到选择器上使其更具体的关键字。它们很容易识别，因为前面总是带有一个冒号。


    ## 伪元素


    伪元素可以对元素的部分进行样式设置。CSS 中有四个伪元素，如下述各节所述。


    ### first-letter 和 first-line


    伪元素 `:first-letter` 和 `:first-line` 可以将样式应用于元素的第一个字母和第一行。它们仅适用于段落等块级元素。


    ```

    p:first-letter { font-size: 120%; }

    p:first-line   { font-weight: bold; }

    ```


    上述第一个规则使段落中的首字母比其他文本大 20%。第二个规则使段落中的第一行文本加粗。


    ### before 和 after


    顾名思义，`:before` 和 `:after` 伪元素可以定位元素之前和之后的位置。它们与 `content` 属性一起使用，可在元素之前或之后插入内容。


    ```

    p:before { content: "之前"; }

    p:after  { content: "之后"; }

    ```


    这些规则使以下段落显示为“之前中间之后”：


    ```

    <p>中间</p>

    ```


    `content` 属性很特殊，因为它只能与这两个伪元素一起使用。它也是唯一打破内容（HTML）和设计（CSS）之间界限的属性。请记住，只有当一段内容的存在归结于设计决策时，才应打破这条界限。例如，`content`
    属性可用于在元素之前添加图标，这可以通过使用 `url` 函数来实现。


    ```

    p.bullet:before { content: url(my-bullet.png); }

    ```

