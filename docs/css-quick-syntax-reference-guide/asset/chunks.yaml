- fmt: "# Pseudo-classes\n\nPseudo-classes permit styling based on element relationships\
    \ and on information not found in the HTML document. Most of them fall into three\
    \ categories: dynamic, structural, and user interface pseudo-classes.\n\n## Dynamic\
    \ pseudo-classes\n\nThe first category of pseudo-classes is used to apply styles\
    \ to links or other interactive elements when their state is changed. There are\
    \ five of them, all of which were introduced in CSS 2.\n\n### `:link` and `:visited`\n\
    \nThe dynamic pseudo-classes `:link` and `:visited` can be applied only to the\
    \ anchor element (`<a>`). The `:link` pseudo-class matches links to pages that\
    \ have not been viewed, whereas `:visited` matches links that have been viewed.\n\
    \n```css\na:link    {} /* unvisited links */\na:visited {} /* visited links */\n\
    ```\n\n### `:active` and `:hover`\n\nAnother pseudo-class is `:active`, which\
    \ matches elements as they are being activated, for example by a mouse click.\
    \ This is most useful for styling anchor elements, but it can be applied to any\
    \ element.\n\n```css\na:active {} /* activated links */\n```\n\nA selector with\
    \ the `:hover` pseudo-class appended to it is applied when the user moves a pointing\
    \ device, such as a mouse, over the selected element. It is popularly used to\
    \ create link roll-over effects.\n\n```css\na:hover {} /* hovered links */\n```\n\
    \nThese four pseudo-classes need to appear in the proper order when applied to\
    \ the same selector. Specifically, the `:hover` pseudo-class must come after `:link`\
    \ and `:visited`, and for `:active` to work it must appear after `:hover`. The\
    \ phrase “love and hate” can be used as a reminder for the initial letters that\
    \ make up the correct order.\n\n```css\na:link    {} /* L */\na:visited {} /*\
    \ V */\na:hover   {} /* H */\na:active  {} /* A */\n```\n\n### `:focus`\n\nThe\
    \ last dynamic pseudo-class is `:focus`, which can be used on elements that can\
    \ receive focus, such as the form `<input>` element. The difference between `:active`\
    \ and `:focus` is that `:active` lasts only for the duration of the click, whereas\
    \ `:focus` lasts until the element loses focus.\n\n```css\ninput:focus {}\n```\n\
    \nBrowser support for the `:focus` pseudo-class in IE was not added until version\
    \ 8.\n\n## Structural pseudo-classes\n\nThe structural pseudo-classes target elements\
    \ based on their relation with other elements. CSS 2 included only one structural\
    \ pseudo-class in this category, `:first-child`, whereas CSS 3 introduced a wide\
    \ array of new ones. The CSS 3 structural pseudo-classes are supported in all\
    \ major browsers, except for IE7 and below.\n\n### `:first-child`\n\nThe `:first-child`\
    \ pseudo-class matches the first child of the selected element.\n\n```css\np:first-child\
    \ {} /* first paragraph child */\n```\n\nIn the following example, this rule applies\
    \ to the first anchor element:\n\n```html\n<p>\n  <span>First child</span>\n \
    \ <span>Text</span>\n</p>\n```\n\n### `:last-child`\n\nThe `:last-child` pseudo-class\
    \ represents the last child of the selected element.\n\n```css\np:last-child {}\
    \ /* last paragraph child */\n```\n\nThis rule targets the last child of the following\
    \ paragraph element.\n\n```html\n<p>\n  <em>Text</em>\n  <em>Last child</em>\n\
    </p>\n```\n\n### `:only-child`\n\nThe `:only-child` pseudo-class matches elements\
    \ that do not have any siblings.\n\n```css\np:only-child {} /* children without\
    \ siblings */\n```\n\nThis rule is applied to the following first `<strong>` element\
    \ because it is the only child of the paragraph. The second paragraph element\
    \ has two children, so none of them is targeted by this rule.\n\n```html\n<p>\n\
    \  <strong>Only child</strong>\n</p>\n<p>\n  <strong>Text</strong>\n  <em>Text</em>\n\
    </p>\n```\n\n### `:only-of-type`\n\nAs its name implies, the `:only-of-type` selector\
    \ matches the selected element only if it does not have any siblings of the same\
    \ type.\n\n```css\np:only-of-type {} /* only <p> element */\n```\n\nThe following\
    \ paragraph is targeted by this rule because it is the only paragraph element\
    \ of its parent.\n\n```html\n<div>\n  <h1>Text</h1>\n  <p>Only of type</p>\n</div>\n\
    ```\n\n### `:first-of-type`\n\nThe `:first-of-type` pseudo-class matches the first\
    \ child element that is of the selected type.\n\n```css\np:first-of-type {} /*\
    \ first <p> element */\n```\n\nIt matches the first paragraph element in the following\
    \ markup:\n\n```html\n<div>\n  <h1>Text</h1>\n  <p>First of type</p>\n  <p>Text</p>\n\
    </div>\n```\n\n### `:last-of-type`\n\nThe last sibling of a specific type can\
    \ be selected with the `:last-of-type` pseudo-class.\n\n```css\nstrong:last-of-type\
    \ {} /* last <strong> element */\n```\n\nThis rule applies to the last `<strong>`\
    \ element among its siblings.\n\n```html\n<div>\n  <strong>Text</strong>\n  <strong>Last\
    \ of type</strong>\n</div>\n```\n\n### `:nth-child`\n\nThe `:nth-child(an + b)`\
    \ pseudo-class matches every `b` child element after the children have been divided\
    \ into groups of `a` elements.\n\n```css\np:nth-child(1)    {} /* first child\
    \ */\np:nth-child(2n)   {} /* even children */\np:nth-child(2n+1) {} /* odd children\
    \ */\n```\n\nThese rules apply to the following HTML markup:\n\n```html\n<p>\n\
    \  <span>First and odd</span>\n  <span>Even</span>\n  <span>Odd</span>\n</p>\n\
    ```\n\nMatching odd and even children is a common operation, so the keywords `odd`\
    \ and `even` can also be used to match every other row in a table, for example.\n\
    \n```css\ntr:nth-child(even) {} /* even table rows */\ntr:nth-child(odd)  {} /*\
    \ odd table rows */\n```\n\nAs shown, the argument to `:nth-child()` can be an\
    \ integer, the keywords `even` or `odd`, or an expression in the form of `an+b`.\
    \ In the expression form, the keyword `n` is a counter that iterates through all\
    \ the child elements. The counter might be negative; in that case, the iteration\
    \ occurs backward. It can be used to select a specific number of first children.\n\
    \n```css\np:nth-child(-n+3) {} /* first three children */\n```\n\nThe math and\
    \ arguments used together with `:nth-child()` are also valid for the next three\
    \ pseudo-classes, all of which start with `:nth`.\n\n### `:nth-of-type`\n\nThe\
    \ `:nth-of-type(an + b)` pseudo-class matches the `b`th element of the selected\
    \ type after the siblings of that type have been divided into groups of `a` elements.\n\
    \n```css\np:nth-of-type(2)    {} /* second paragraph sibling */\np:nth-of-type(2n)\
    \   {} /* even paragraph siblings */\np:nth-of-type(2n+1) {} /* odd paragraph\
    \ siblings */\n```\n\nThe behavior of this pseudo-class is similar to `:nth-child`,\
    \ but it matches siblings of the same type of the specified element instead of\
    \ matching children of the specified element.\n\n```html\n<div>\n  <em>Text</em>\n\
    \  <p>Odd</p>\n  <p>Second and even</p>\n  <p>Odd</p>\n</div>\n```\n\nSimilar\
    \ to the other `:nth` pseudo-classes, the keywords `odd` and `even` can be used\
    \ to match siblings of the same type whose index is odd or even.\n\n```css\np:nth-of-type(even)\
    \ {} /* even paragraph siblings */\np:nth-of-type(odd)  {} /* odd paragraph siblings\
    \ */\n```\n\n### `:nth-last-of-type`\n\nThe `:nth-last-of-type(an + b)` pseudo-class\
    \ matches the element of the selected type that has `an+b` elements of that same\
    \ type after it. This behavior is equivalent to the `:nth-of-type` pseudo-class,\
    \ except that elements are counted starting from the bottom instead of the top.\n\
    \n```css\np:nth-last-of-type(3)    {} /* third last paragraph */\np:nth-last-of-type(-n+2)\
    \ {} /* last two paragraphs */\n```\n\nThese two rules apply to the following\
    \ example. The `<em>` element is not counted because it is not of the specified\
    \ type—in this case, paragraph.\n\n```html\n<div>\n  <p>Third last</p>\n  <p>Last\
    \ two</p>\n  <p>Last two</p>\n  <em>Text</em>\n</div>\n```\n\n### `:nth-last-child`\n\
    \nThe `:nth-last-child(an + b)` pseudo-class represents any element that has `an+b`\
    \ siblings after it. Its behavior is the same as `:nth-child`, except that it\
    \ starts with the bottom element instead of the top one.\n\n```css\np:nth-last-child(3)\
    \    {} /* third last child */\np:nth-last-child(-n+2) {} /* last two children\
    \ */\n```\n\nThese two rules apply to the child elements in the following example:\n\
    \n```html\n<div>\n  <p>Third last</p>\n  <p>Last two</p>\n  <p>Last two</p>\n\
    </div>\n```"
  raw: '## Pseudo-classes


    Pseudo-classes permit styling based on element relationships and on information
    not found in the HTML document. Most of them fall into three categories: dynamic,
    structural, and user interface pseudo-classes.


    ### Dynamic pseudo-classes


    The first category of pseudo-classes is used to apply styles to links or other
    interactive elements when their state is changed. There are five of them, all
    of which were introduced in CSS 2.


    #### link and visited


    The dynamic pseudo-classes `:link` and `:visited` can be applied only to the anchor
    element (`<a>`). The `:link` pseudo-class matches links to pages that have not
    been viewed, whereas `:visited` matches links that have been viewed.


    `a:link    {} /* unvisited links */`


    `a:visited {} /* visited links */`


    #### active and hover


    Another pseudo-class is `:active`, which matches elements as they are being activated,
    for example by a mouse click. This is most useful for styling anchor elements,
    but it can be applied to any element.


    `a:active {} /* activated links */`


    A selector with the `:hover` pseudo-class appended to it is applied when the user
    moves a pointing device, such as a mouse, over the selected element. It is popularly
    used to create link roll-over effects.


    `a:hover {} /* hovered links */`


    These four pseudo-classes need to appear in the proper order when applied to the
    same selector. Specifically, the `:hover` pseudo-class must come after `:link`
    and `:visited`, and for `:active` to work it must appear after `:hover`. The phrase
    “love and hate” can be used as a reminder for the initial letters that make up
    the correct order.


    `a:link    {} /* L */`


    `a:visited {} /* V */`


    `a:hover   {} /* H */`


    `a:active  {} /* A */`


    #### focus


    The last dynamic pseudo-class is `:focus`, which can be used on elements that
    can receive focus, such as the form `<input>` element. The difference between
    `:active` and `:focus` is that `:active` lasts only for the duration of the click,
    whereas `:focus` lasts until the element loses focus.


    `input:focus {}`


    Browser support for the `:focus` pseudo-class in IE was not added until version
    8.


    ## Structural pseudo-classes


    The structural pseudo-classes target elements based on their relation with other
    elements. CSS 2 included only one structural pseudo-class in this category, `:first-child`,
    whereas CSS 3 introduced a wide array of new ones. The CSS 3 structural pseudo-classes
    are supported in all major browsers, except for IE7 and below.


    ### first-child


    The `:firs`t-child pseudo-class matches the first child of the selected element.


    `p:first-child {} /* first paragraph child */`


    In the following example, this rule applies to the first anchor element:


    `<p>`


      `<span>First child</span>`


      `<span>Text</span>`


    `</p>`


    ### last-child


    The `:last-child` pseudo-class represents the last child of the selected element.


    `p:last-child {} /* last paragraph child */`


    This rule targets the last child of the following paragraph element.


    `<p>`


      `<em>Text</em>`


      `<em>Last child</em>`


    `</p>`


    ### only-child


    The `:only-child` pseudo-class matches elements that do not have any siblings.


    `p:only-child {} /* children without siblings */`


    This rule is applied to the following first `<strong>` element because it is the
    only child of the paragraph. The second paragraph element has two children, so
    none of them is targeted by this rule.


    `<p>`


      `<strong>Only child</strong>`


    `</p>`


    `<p>`


      `<strong>Text</strong>`


      `<em>Text</em>`


    `</p>`


    ### only-of-type


    As its name implies, the `:only-of-type` selector matches the selected element
    only if it does not have any siblings of the same type.


    `p:only-of-type {} /* only <p> element */`


    The following paragraph is targeted by this rule because it is the only paragraph
    element of its parent.


    `<div>`


      `<h1>Text</h1>`


      `<p>Only of type</p>`


    `</div>`


    ### first-of-type


    The `:first-of-type` pseudo-class matches the first child element that is of the
    selected type.


    `p:first-of-type {} /* first <p> element */`


    It matches the first paragraph element in the following markup:


    `<div>`


      `<h1>Text</h1>`


      `<p>First of type</p>`


      `<p>Text</p>`


    `</div>`


    ### last-of-type


    The last sibling of a specific type can be selected with the `:last-of-type` pseudo-class.


    `strong:last-of-type {} /* last <strong> element */`


    This rule applies to the last `<strong>` element among its siblings.


    `<div>`


      `<strong>Text</strong>`


      `<strong>Last of type</strong>`


    `</div>`


    ### nth-child


    The `:nth-child(an + b)` pseudo-class matches every `b` child element after the
    children have been divided into groups of `a` elements.


    `p:nth-child(1)    {} /* first child */`


    `p:nth-child(2n)   {} /* even children */`


    `p:nth-child(2n+1) {} /* odd children */`


    These rules apply to the following HTML markup:


    `<p>`


      `<span>First and odd</span>`


      `<span>Even</span>`


      `<span>Odd</span>`


    `</p>`


    Matching odd and even children is a common operation, so the keywords `odd` and
    `even` can also be used to match every other row in a table, for example.


    `tr:nth-child(even) {} /* even table rows */`


    `tr:nth-child(odd)  {} /* odd table rows */`


    As shown, the argument to `:nth-child()` can be an integer, the keywords `even`
    or `odd`, or an expression in the form of `an+b`. In the expression form, the
    keyword `n` is a counter that iterates through all the child elements. The counter
    might be negative; in that case, the iteration occurs backward. It can be used
    to select a specific number of first children.


    `p:nth-child(-n+3) {} /* first three children */`


    The math and arguments used together with `:nth-child()` are also valid for the
    next three pseudo-classes, all of which start with `:nth`.


    ### nth-of-type


    The `:nth-of-type(an + b)` pseudo-class matches the `b`th element of the selected
    type after the siblings of that type have been divided into groups of `a` elements.


    `p:nth-of-type(2)    {} /* second paragraph sibling */`


    `p:nth-of-type(2n)   {} /* even paragraph siblings */`


    `p:nth-of-type(2n+1) {} /* odd paragraph siblings */`


    The behavior of this pseudo-class is similar to `:nth-child`, but it matches siblings
    of the same type of the specified element instead of matching children of the
    specified element.


    `<div>`


      `<em>Text</em>`


      `<p>Odd</p>`


      `<p>Second and even</p>`


      `<p>Odd</p>`


    `</div>`


    Similar to the other `:nth` pseudo-classes, the keywords `odd` and `even` can
    be used to match siblings of the same type whose index is odd or even.


    `p:nth-of-type(even) {} /* even paragraph siblings */`


    `p:nth-of-type(odd)  {} /* odd paragraph siblings */`


    ### nth-last-of-type


    The `:nth-last-of-type(an + b)` pseudo-class matches the element of the selected
    type that has `an+b` elements of that same type after it. This behavior is equivalent
    to the `:nth-of-type` pseudo-class, except that elements are counted starting
    from the bottom instead of the top.


    `p:nth-last-of-type(3)    {} /* third last paragraph */`


    `p:nth-last-of-type(-n+2) {} /* last two paragraphs */`


    These two rules apply to the following example. The `<em>` element is not counted
    because it is not of the specified type—in this case, paragraph.


    `<div>`


      `<p>Third last</p>`


      `<p>Last two</p>`


      `<p>Last two</p>`


      `<em>Text</em>`


    `</div>`


    ### nth-last-child


    The `:nth-last-child(an + b)` pseudo-class represents any element that has `an+b`
    siblings after it. Its behavior is the same as `:nth-child`, except that it starts
    with the bottom element instead of the top one.


    `p:nth-last-child(3)    {} /* third last child */`


    `p:nth-last-child(-n+2) {} /* last two children */`


    These two rules apply to the child elements in the following example:


    `<div>`


      `<p>Third last</p>`


      `<p>Last two</p>`


      `<p>Last two</p>`


    `</div>`'
  trans: "\n# 伪类\n\n伪类允许根据元素之间的关系以及 HTML 文档中未包含的信息来设置样式。大多数伪类可分为三类：动态伪类、结构伪类和用户界面伪类。\n\
    \n## 动态伪类\n\n第一类伪类用于在链接或其他交互元素的状态发生改变时为其应用样式。这类伪类共有五个，全部在 CSS 2 中引入。\n\n### `:link`\
    \ 和 `:visited`\n\n动态伪类 `:link` 和 `:visited` 仅能应用于锚点元素（`<a>`）。`:link` 伪类匹配指向尚未访问页面的链接，而\
    \ `:visited` 匹配已访问过的链接。\n\n```css\na:link    {} /* 未访问的链接 */\na:visited {} /*\
    \ 已访问的链接 */\n```\n\n### `:active` 和 `:hover`\n\n另一个伪类是 `:active`，它匹配正在被激活的元素，例如通过鼠标点击激活。这对于为锚点元素设置样式最有用，但也可以应用于任何元素。\n\
    \n```css\na:active {} /* 激活的链接 */\n```\n\n当用户将鼠标等指向设备移动到所选元素上时，会应用带有 `:hover`\
    \ 伪类的选择器。它常用于创建链接悬停效果。\n\n```css\na:hover {} /* 悬停的链接 */\n```\n\n当这四种伪类应用于同一个选择器时，需要按正确的顺序出现。具体来说，`:hover`\
    \ 伪类必须位于 `:link` 和 `:visited` 之后，并且要使 `:active` 生效，它必须出现在 `:hover` 之后。可以使用短语 \"\
    love and hate\" 来帮助记忆构成正确顺序的首字母。\n\n```css\na:link    {} /* L */\na:visited {}\
    \ /* V */\na:hover   {} /* H */\na:active  {} /* A */\n```\n\n### `:focus`\n\n\
    最后一个动态伪类是 `:focus`，它可用于能够获得焦点的元素，例如表单中的 `<input>` 元素。`:active` 和 `:focus` 的区别在于，`:active`\
    \ 仅在点击过程中持续，而 `:focus` 会一直持续到元素失去焦点。\n\n```css\ninput:focus {}\n```\n\nIE 浏览器直到版本\
    \ 8 才支持 `:focus` 伪类。\n\n## 结构伪类\n\n结构伪类根据元素与其他元素的关系来定位元素。CSS 2 在此类别中仅包含一个结构伪类\
    \ `:first-child`，而 CSS 3 引入了大量新的结构伪类。所有主流浏览器（IE7 及更低版本除外）都支持这些 CSS 3 结构伪类。\n\n\
    ### `:first-child`\n\n`:first-child` 伪类匹配所选元素的第一个子元素。\n\n```css\np:first-child\
    \ {} /* 第一个段落子元素 */\n```\n\n在以下示例中，此规则适用于第一个锚点元素：\n\n```html\n<p>\n  <span>第一个子元素</span>\n\
    \  <span>文本</span>\n</p>\n```\n\n### `:last-child`\n\n`:last-child` 伪类表示所选元素的最后一个子元素。\n\
    \n```css\np:last-child {} /* 最后一个段落子元素 */\n```\n\n此规则针对以下段落元素的最后一个子元素。\n\n```html\n\
    <p>\n  <em>文本</em>\n  <em>最后一个子元素</em>\n</p>\n```\n\n### `:only-child`\n\n`:only-child`\
    \ 伪类匹配没有兄弟元素的元素。\n\n```css\np:only-child {} /* 无兄弟元素的子元素 */\n```\n\n此规则应用于以下第一个\
    \ `<strong>` 元素，因为它是该段落的唯一子元素。第二个段落元素有两个子元素，因此其中没有一个被此规则选中。\n\n```html\n<p>\n\
    \  <strong>唯一子元素</strong>\n</p>\n<p>\n  <strong>文本</strong>\n  <em>文本</em>\n</p>\n\
    ```\n\n### `:only-of-type`\n\n顾名思义，`:only-of-type` 选择器仅在选择元素没有相同类型的兄弟元素时才匹配该元素。\n\
    \n```css\np:only-of-type {} /* 唯一的 <p> 元素 */\n```\n\n以下段落被此规则选中，因为它是其父元素中唯一的段落元素。\n\
    \n```html\n<div>\n  <h1>文本</h1>\n  <p>唯一类型</p>\n</div>\n```\n\n### `:first-of-type`\n\
    \n`:first-of-type` 伪类匹配属于所选类型的第一个子元素。\n\n```css\np:first-of-type {} /* 第一个 <p>\
    \ 元素 */\n```\n\n它匹配以下标记中的第一个段落元素：\n\n```html\n<div>\n  <h1>文本</h1>\n  <p>首个类型</p>\n\
    \  <p>文本</p>\n</div>\n```\n\n### `:last-of-type`\n\n特定类型的最后一个兄弟元素可以使用 `:last-of-type`\
    \ 伪类来选择。\n\n```css\nstrong:last-of-type {} /* 最后一个 <strong> 元素 */\n```\n\n此规则适用于其兄弟元素中的最后一个\
    \ `<strong>` 元素。\n\n```html\n<div>\n  <strong>文本</strong>\n  <strong>最后类型</strong>\n\
    </div>\n```\n\n### `:nth-child`\n\n`:nth-child(an + b)` 伪类在子元素被分成每 `a` 个元素一组后，匹配每组的第\
    \ `b` 个子元素。\n\n```css\np:nth-child(1)    {} /* 第一个子元素 */\np:nth-child(2n)   {}\
    \ /* 偶数子元素 */\np:nth-child(2n+1) {} /* 奇数子元素 */\n```\n\n这些规则适用于以下 HTML 标记：\n\n\
    ```html\n<p>\n  <span>第一个且奇数</span>\n  <span>偶数</span>\n  <span>奇数</span>\n</p>\n\
    ```\n\n匹配奇数与偶数子元素是一种常见操作，因此也可以使用关键字 `odd` 和 `even` 来匹配表格中的每隔一行。\n\n```css\ntr:nth-child(even)\
    \ {} /* 偶数表格行 */\ntr:nth-child(odd)  {} /* 奇数表格行 */\n```\n\n如上所示，`:nth-child()`\
    \ 的参数可以是一个整数、关键字 `even` 或 `odd`，或者形如 `an+b` 的表达式。在表达式形式中，关键字 `n` 是一个计数器，会遍历所有子元素。计数器可以为负数；在这种情况下，迭代会反向进行。它可用于选择特定数量的前几个子元素。\n\
    \n```css\np:nth-child(-n+3) {} /* 前三个子元素 */\n```\n\n与 `:nth-child()` 一起使用的数学逻辑和参数同样适用于接下来的三个伪类，它们都以\
    \ `:nth` 开头。\n\n### `:nth-of-type`\n\n`:nth-of-type(an + b)` 伪类在相同类型的兄弟元素被分成每\
    \ `a` 个元素一组后，匹配所选类型的第 `b` 个元素。\n\n```css\np:nth-of-type(2)    {} /* 第二个段落兄弟元素\
    \ */\np:nth-of-type(2n)   {} /* 偶数段落兄弟元素 */\np:nth-of-type(2n+1) {} /* 奇数段落兄弟元素\
    \ */\n```\n\n此伪类的行为类似于 `:nth-child`，但它是匹配指定元素的相同类型的兄弟元素，而不是匹配指定元素的子元素。\n\n```html\n\
    <div>\n  <em>文本</em>\n  <p>奇数</p>\n  <p>第二个且偶数</p>\n  <p>奇数</p>\n</div>\n```\n\
    \n与其他 `:nth` 伪类类似，可以使用关键字 `odd` 和 `even` 来匹配索引为奇数或偶数的相同类型兄弟元素。\n\n```css\np:nth-of-type(even)\
    \ {} /* 偶数段落兄弟元素 */\np:nth-of-type(odd)  {} /* 奇数段落兄弟元素 */\n```\n\n### `:nth-last-of-type`\n\
    \n`:nth-last-of-type(an + b)` 伪类匹配所选类型的元素，该元素之后还有 `an+b` 个相同类型的元素。其行为等同于 `:nth-of-type`\
    \ 伪类，区别在于元素计数是从底部开始而不是从顶部开始。\n\n```css\np:nth-last-of-type(3)    {} /* 倒数第三个段落\
    \ */\np:nth-last-of-type(-n+2) {} /* 最后两个段落 */\n```\n\n这两个规则适用于以下示例。由于 `<em>`\
    \ 元素不是指定类型（本例中为段落），因此不计算在内。\n\n```html\n<div>\n  <p>倒数第三</p>\n  <p>最后两个</p>\n\
    \  <p>最后两个</p>\n  <em>文本</em>\n</div>\n```\n\n### `:nth-last-child`\n\n`:nth-last-child(an\
    \ + b)` 伪类表示在其之后有 `an+b` 个兄弟元素的任何元素。其行为与 `:nth-child` 相同，不同之处在于它是从底部元素开始而不是从顶部元素开始。\n\
    \n```css\np:nth-last-child(3)    {} /* 倒数第三个子元素 */\np:nth-last-child(-n+2) {}\
    \ /* 最后两个子元素 */\n```\n\n这两个规则适用于以下示例中的子元素：\n\n```html\n<div>\n  <p>倒数第三</p>\n\
    \  <p>最后两个</p>\n  <p>最后两个</p>\n</div>\n```\n"
- fmt: "# empty\n\nThe `:empty` pseudo-class matches selected elements that do not\
    \ have any content.\n\n`p:empty {} /* empty paragraphs */`\n\nAn element is considered\
    \ empty if it has no child elements, text, or whitespace except for comments.\
    \ The preceding rule applies to the following two paragraphs:\n\n`<p></p>`\n\n\
    `<p><!-- also empty --></p>`\n\n# root\n\nThe `:root` pseudo-class matches the\
    \ topmost element in the document tree. In HTML documents, it is always the `<html>`\
    \ element.\n\n`:root {} /* root element */`\n\nThis pseudo-class is mainly useful\
    \ when CSS is used with other languages, such as XML, in which the root element\
    \ can vary. All major browsers support the `:root` pseudo-class, except for IE8\
    \ and below.\n\n## User interface pseudo-classes\n\nCSS 3 introduced a number\
    \ of user interface pseudo-classes that are used to style interactive elements\
    \ based on their current state.\n\n### enabled and disabled\n\nThe `:enabled`\
    \ and `:disabled` pseudo-classes match any element of the selected type that is\
    \ either enabled or disabled. They apply only to interactive elements that can\
    \ be in either an enabled or disabled state, such as form elements.\n\n`input:enabled\
    \  { background: green; }`\n\n`input:disabled { background: red; }`\n\nThe following\
    \ form contains one enabled and one disabled input element, which are affected\
    \ by these two rules:\n\n`<form>`\n\n  `<input type=\"text\" name=\"enabled\"\
    >`\n\n  `<input type=\"text\" name=\"disabled\" disabled>`\n\n`</form>`\n\nThese\
    \ two pseudo-classes are supported by all major browsers except for IE8 and below.\n\
    \n### checked\n\nThe `:checked` pseudo-class matches elements that are in a selected\
    \ state. It can be used only on check box, radio button, and `<option>` elements.\n\
    \n`input[type=\"checkbox\"]:checked {}`\n\nThis rule matches any check boxes that\
    \ are selected on the web page.\n\n`<form>`\n\n  `<input type=\"checkbox\">`\n\
    \n`</form>`\n\nAll major browsers support the `:checked` pseudo-class, except\
    \ for IE8 and earlier versions.\n\n### valid and invalid\n\nThe `:valid` and `:invalid`\
    \ pseudo-classes are used to provide feedback to users when they are filling out\
    \ forms. Modern browsers can perform a basic field validation based on the input\
    \ type of a form element and, together with these pseudo-classes, the result can\
    \ be used to style the input element.\n\n`input:valid   { background: green; }`\n\
    \n`input:invalid { background: red; }`\n\nTwo fields are given here, one required\
    \ and one optional. The first field remains invalid until an e-mail is entered\
    \ into the field. The second field is optional and is therefore valid if left\
    \ empty.\n\n`<form>`\n\n  `<input type=\"email\" required>`\n\n  `<input type=\"\
    email\">`\n\n`</form>`\n\nNote that these pseudo-classes are in no way a substitution\
    \ for proper form validation, using JavaScript or PHP, for example. Browser support\
    \ for these two pseudo-classes exists in Chrome 10+, Firefox 4+, IE10+, Safari\
    \ 5+, and Opera 10+.\n\n### required and optional\n\nA form field with the `required`\
    \ attribute set is matched by the `:required` pseudo-class. The related `:optional`\
    \ pseudo-class does the opposite: it matches input elements that do not have the\
    \ `required` attribute set.\n\n`input:required { color: red; }`\n\n`input:optional\
    \ { color: gray; }`\n\nThe following form contains one required and one optional\
    \ input element, which is targeted by the previous styles:\n\n`<form>`\n\n  `<input\
    \ type=\"email\" required>`\n\n  `<input type=\"url\">`\n\n`</form>`\n\nLike the\
    \ `:valid` and `:invalid` pseudo-classes, support for `:required` and `:optional`\
    \ is limited to Chrome 10+, Firefox 4+, IE10+, Safari 5+, and Opera 10+.\n\n##\
    \ Other pseudo-classes\n\nSome pseudo-classes do not fit into any of the earlier\
    \ categories, namely the `:target`, `:lang`, and `:not` pseudo-classes.\n\n###\
    \ target\n\nThe `:target` pseudo-class can style an element that is targeted through\
    \ an `id` link. It can be useful for highlighting a targeted section of the document.\n\
    \n`:target { font-weight: bold; } /* targeted element */`\n\nWhen the following\
    \ internal page link is followed, this rule is applied to the anchor element.\
    \ The browser also scrolls down to that element.\n\n`<a href=\"#my-target\" id=\"\
    my-target\">In page link</a>`\n\nThis pseudo-class is supported in all major browsers,\
    \ except IE8 and earlier versions.\n\n### lang\n\nThe pseudo-class `:lang()` matches\
    \ elements determined to be in the language provided by the argument.\n\n`p:lang(en)\
    \ {}`\n\nThis pseudo-class applies to paragraph elements that are intended for\
    \ an English audience, such as the following paragraph:\n\n`<p lang=\"en\">English</p>`\n\
    \nNote that the behavior of this pseudo-class is similar to the language attribute\
    \ selector. The difference is that the `:lang` pseudo-class also matches elements\
    \ if the language is set on an ancestor element, or in some other way such as\
    \ through the page HTTP header or `<meta>` tag.\n\n`<body lang=\"fr\">`\n\n  `<p>French</p>`\n\
    \n`</body>`\n\n### not\n\nThe negation pseudo-class `:not` matches elements that\
    \ are not targeted by the specified selector.\n\n`p:not(.first) { font-weight:\
    \ bold; }`\n\nThis example rule selects paragraphs that are not using the `first`\
    \ class.\n\n`<p class=\"first\">Not bold</p>`\n\n`<p>Bold</p>`\n\nThe `:not` pseudo-class\
    \ is supported in all major browsers, except IE8 and earlier versions.\n\n# Relationship\
    \ selectors\n\nRelationship selectors match elements based on their relation with\
    \ other elements. To understand these selectors, it is important to recognize\
    \ how elements in a web document are related to each other.\n\n## HTML hierarchy\n\
    \nAn HTML document can be visualized as a tree with the `<html>` element as the\
    \ root. Each element fits somewhere on this tree, and every element is either\
    \ a parent or a child of another element. Any element above another one is called\
    \ an ancestor, and the element directly above is the parent. Similarly, an element\
    \ below another one is called a descendant, and the one directly below is a child.\
    \ In turn, an element sharing the same parent as another element is called a sibling.\
    \ Consider the following simple HTML 5 document:\n\n```\n<!DOCTYPE html>\n<html>\n\
    \  <head>\n    <meta charset=\"UTF-8\">\n    <title>Example</title>\n  </head>\n\
    \  <body>\n    <h1>Heading</h1>\n    <p>Paragraph</p>\n  </body>\n</html>\n```\n\
    \nIn this example, `<h1>` and `<p>` are sibling elements because they share the\
    \ same parent. Their parent element is `<body>`, and together with `<html>`, they\
    \ are both ancestors to the sibling elements. In turn, the two sibling elements\
    \ are child elements of `<body>` and descendants of both `<body>` and `<html>`.\
    \ The hierarchy of this simple document is illustrated in Figure [6-1](#A978-1-4302-6491-0_6_Chapter.html#Fig1).\n\
    \n![A978-1-4302-6491-0_6_Fig1_HTML.jpg](A978-1-4302-6491-0_6_Fig1_HTML.jpg)\n\n\
    Figure 6-1. Example HTML hierarchy\n\n## Inheritance\n\nInheritance is another\
    \ important concept in CSS. It makes certain styles apply not only to the specified\
    \ element but also to all its descendant elements. For example, the `color` property\
    \ is inherited; the `border` property is not. This default inheritance is usually\
    \ the intended behavior, making inheritance very intuitive. Any property can also\
    \ explicitly be given the value `inherit` to use the same value as the one the\
    \ parent element has for that property.\n\n```\n/* Inherit parent's border */\n\
    p { border: inherit; }\n```\n\nInheritance enables you to apply a style to a common\
    \ ancestor whenever you find a place in which every descendant element needs that\
    \ same style. This process is more convenient and maintainable than applying the\
    \ style to every descendant element that needs that specific style. For example,\
    \ if the text for an entire document needs to be set to a particular color, you\
    \ can apply the style to the `<body>` element, which is the common ancestor for\
    \ all visible elements.\n\n```\n/* Set document text color to gray */\nbody {\
    \ color: gray; }\n```\n\nNow that you have an understanding of the HTML hierarchy\
    \ and the inheritance concept, the relationship selectors of CSS can be discussed."
  raw: '### empty


    The `:empty` pseudo-class matches selected elements that do not have any content.


    `p:empty {} /* empty paragraphs */`


    An element is considered empty if it has no child elements, text, or whitespace
    except for comments. The preceding rule applies to the following two paragraphs:


    `<p></p>`


    `<p><!-- also empty --></p>`


    ### root


    The `:root` pseudo-class matches the topmost element in the document tree. In
    HTML documents, it is always the `<html>` element.


    `:root {} /* root element */`


    This pseudo-class is mainly useful when CSS is used with other languages, such
    as XML, in which the root element can vary. All major browsers support the `:root`
    pseudo-class, except for IE8 and below.


    ## User interface pseudo-classes


    CSS 3 introduced a number of user interface pseudo-classes that are used to style
    interactive elements based on their current state.


    ### enabled and disabled


    The `:enabled` and `:disabled` pseudo-classes match any element of the selected
    type that is either enabled or disabled. They apply only to interactive elements
    that can be in either an enabled or disabled state, such as form elements.


    `input:enabled  { background: green; }`


    `input:disabled { background: red; }`


    The following form contains one enabled and one disabled input element, which
    are affected by these two rules:


    `<form>`


      `<input type="text" name="enabled">`


      `<input type="text" name="disabled" disabled>`


    `</form>`


    These two pseudo-classes are supported by all major browsers except for IE8 and
    below.


    ### checked


    The `:checked` pseudo-class matches elements that are in a selected state. It
    can be used only on check box, radio button, and `<option>` elements.


    `input[type="checkbox"]:checked {}`


    This rule matches any check boxes that are selected on the web page.


    `<form>`


      `<input type="checkbox">`


    `</form>`


    All major browsers support the `:checked` pseudo-class, except for IE8 and earlier
    versions.


    ### valid and invalid


    The `:valid` and `:invalid` pseudo-classes are used to provide feedback to users
    when they are filling out forms. Modern browsers can perform a basic field validation
    based on the input type of a form element and, together with these pseudo-classes,
    the result can be used to style the input element.


    `input:valid   { background: green; }`


    `input:invalid { background: red; }`


    Two fields are given here, one required and one optional. The first field remains
    invalid until an e-mail is entered into the field. The second field is optional
    and is therefore valid if left empty.


    `<form>`


      `<input type="email" required>`


      `<input type="email">`


    `</form>`


    Note that these pseudo-classes are in no way a substitution for proper form validation,
    using JavaScript or PHP, for example. Browser support for these two pseudo-classes
    exists in Chrome 10+, Firefox 4+, IE10+, Safari 5,+ and Opera 10+.


    ### required and optional


    A form field with the `required` attribute set is matched by the `:required` pseudo-class.
    The related `:optional` pseudo-class does the opposite: it matches input elements
    that do not have the `required` attribute set.


    `input:required { color: red; }`


    `input:optional { color: gray; }`


    The following form contains one required and one optional input element, which
    is targeted by the previous styles:


    `<form>`


      `<input type="email" required>`


      `<input type="url">`


    `</form>`


    Like the `:valid` and `:invalid` pseudo-classes, support for `:required` and `:optional`
    is limited to Chrome 10+, Firefox 4+, IE10+, Safari 5+, and Opera 10+.


    ## Other pseudo-classes


    Some pseudo-classes do not fit into any of the earlier categories, namely the
    `:target`, `:lang`, and `:not` pseudo-classes.


    ### target


    The `:target` pseudo-class can style an element that is targeted through an `id`
    link. It can be useful for highlighting a targeted section of the document.


    `:target { font-weight: bold; } /* targeted element */`


    When the following internal page link is followed, this rule is applied to the
    anchor element. The browser also scrolls down to that element.


    `<a href="#my-target" id="my-target">In page link</a>`


    This pseudo-class is supported in all major browsers, except IE8 and earlier versions.


    ### lang


    The pseudo-class `:lang()` matches elements determined to be in the language provided
    by the argument.


    `p:lang(en) {}`


    This pseudo-class applies to paragraph elements that are intended for an English
    audience, such as the following paragraph:


    `<p lang="en">English</p>`


    Note that the behavior of this pseudo-class is similar to the language attribute
    selector. The difference is that the `:lang` pseudo-class also matches elements
    if the language is set on an ancestor element, or in some other way such as through
    the page HTTP header or `<meta>` tag.


    `<body lang="fr">`


      `<p>French</p>`


    `</body>`


    ### not


    The negation pseudo-class `:not` matches elements that are not targeted by the
    specified selector.


    `p:not(.first) { font-weight: bold; }`


    This example rule selects paragraphs that are not using the `first` class.


    `<p class="first">Not bold</p>`


    `<p>Bold</p>`


    The `:not` pseudo-class is supported in all major browsers, except IE8 and earlier
    versions.


    # 6. Relationship selectors


    Relationship selectors match elements based on their relation with other elements.
    To understand these selectors, it is important to recognize how elements in a
    web document are related to each other.


    ## HTML hierarchy


    An HTML document can be visualized as a tree with the `<html>` element as the
    root. Each element fits somewhere on this tree, and every element is either a
    parent or a child of another element. Any element above another one is called
    an ancestor, and the element directly above is the parent. Similarly, an element
    below another one is called a descendant, and the one directly below is a child.
    In turn, an element sharing the same parent as another element is called a sibling.
    Consider the following simple HTML 5 document:


    `<!DOCTYPE html>`


    `<html>`


      `<head>`


        `<meta charset="UTF-8">`


        `<title>Example</title>`


      `</head>`


      `<body>`


        `<h1>Heading</h1>`


        `<p>Paragraph</p>`


      `</body>`


    `</html>`


    In this example, `<h1>` and `<p>` are sibling elements because they share the
    same parent. Their parent element is `<body>`, and together with `<html>`, they
    are both ancestors to the sibling elements. In turn, the two sibling elements
    are child elements of `<body>` and descendants of both `<body>` and `<html>`.
    The hierarchy of this simple document is illustrated in Figure [6-1](#A978-1-4302-6491-0_6_Chapter.html#Fig1).


    ![A978-1-4302-6491-0_6_Fig1_HTML.jpg](A978-1-4302-6491-0_6_Fig1_HTML.jpg)


    Figure 6-1.


    Example HTML hierarchy


    ## Inheritance


    Inheritance is another important concept in CSS. It makes certain styles apply
    not only to the specified element but also to all its descendant elements. For
    example, the `color` property is inherited; the `border` property is not. This
    default inheritance is usually the intended behavior, making inheritance very
    intuitive. Any property can also explicitly be given the value `inherit` to use
    the same value as the one the parent element has for that property.


    `/* Inherit parent''s border */`


    `p { border: inherit; }`


    Inheritance enables you to apply a style to a common ancestor whenever you find
    a place in which every descendant element needs that same style. This process
    is more convenient and maintainable than applying the style to every descendant
    element that needs that specific style. For example, if the text for an entire
    document needs to be set to a particular color, you can apply the style to the
    `<body>` element, which is the common ancestor for all visible elements.


    `/* Set document text color to gray */`


    `body { color: gray; }`


    Now that you have an understanding of the HTML hierarchy and the inheritance concept,
    the relationship selectors of CSS can be discussed.'
  trans: "\n# empty\n\n`:empty` 伪类匹配没有任何内容的选定元素。\n\n`p:empty {} /* 空段落 */`\n\n如果元素没有子元素、文本或除注释外的空白字符，则视为空元素。上述规则适用于以下两个段落：\n\
    \n`<p></p>`\n\n`<p><!-- 这也是空元素 --></p>`\n\n# root\n\n`:root` 伪类匹配文档树中的顶层元素。在 HTML\
    \ 文档中，它始终是 `<html>` 元素。\n\n`:root {} /* 根元素 */`\n\n当 CSS 与其他语言（如 XML）一起使用时，该伪类尤其有用，因为在这些语言中，根元素可能会发生变化。除\
    \ IE8 及更低版本外，所有主流浏览器均支持 `:root` 伪类。\n\n## 用户界面伪类\n\nCSS 3 引入了一些用户界面伪类，用于根据交互元素的当前状态为其设置样式。\n\
    \n### enabled 和 disabled\n\n`:enabled` 和 `:disabled` 伪类匹配选定类型中处于启用或禁用状态的任何元素。它们仅适用于可处于启用或禁用状态的交互元素，例如表单元素。\n\
    \n`input:enabled  { background: green; }`\n\n`input:disabled { background: red;\
    \ }`\n\n以下表单包含一个启用和一个禁用的输入元素，它们受这两条规则影响：\n\n`<form>`\n\n  `<input type=\"text\"\
    \ name=\"enabled\">`\n\n  `<input type=\"text\" name=\"disabled\" disabled>`\n\
    \n`</form>`\n\n除 IE8 及更低版本外，所有主流浏览器均支持这两个伪类。\n\n### checked\n\n`:checked` 伪类匹配处于选中状态的元素。它仅可用于复选框、单选按钮和\
    \ `<option>` 元素。\n\n`input[type=\"checkbox\"]:checked {}`\n\n此规则匹配网页上任何选中的复选框。\n\
    \n`<form>`\n\n  `<input type=\"checkbox\">`\n\n`</form>`\n\n除 IE8 及更早版本外，所有主流浏览器均支持\
    \ `:checked` 伪类。\n\n### valid 和 invalid\n\n`:valid` 和 `:invalid` 伪类用于在用户填写表单时向其提供反馈。现代浏览器可以根据表单元素的输入类型执行基本字段验证，并且结合这些伪类，结果可用于设置输入元素的样式。\n\
    \n`input:valid   { background: green; }`\n\n`input:invalid { background: red;\
    \ }`\n\n这里给出了两个字段，一个是必填项，一个是可选项。第一个字段在输入电子邮件地址之前一直保持无效状态。第二个字段是可选的，因此如果留空则视为有效。\n\
    \n`<form>`\n\n  `<input type=\"email\" required>`\n\n  `<input type=\"email\"\
    >`\n\n`</form>`\n\n请注意，这些伪类绝不能替代使用 JavaScript 或 PHP 等进行的正确表单验证。这两个伪类的浏览器支持情况为\
    \ Chrome 10+、Firefox 4+、IE10+、Safari 5+ 和 Opera 10+。\n\n### required 和 optional\n\
    \n设置了 `required` 属性的表单字段由 `:required` 伪类匹配。相关的 `:optional` 伪类则相反：它匹配未设置 `required`\
    \ 属性的输入元素。\n\n`input:required { color: red; }`\n\n`input:optional { color: gray;\
    \ }`\n\n以下表单包含一个必填和一个可选的输入元素，它们受前述样式影响：\n\n`<form>`\n\n  `<input type=\"email\"\
    \ required>`\n\n  `<input type=\"url\">`\n\n`</form>`\n\n与 `:valid` 和 `:invalid`\
    \ 伪类类似，对 `:required` 和 `:optional` 的支持仅限于 Chrome 10+、Firefox 4+、IE10+、Safari 5+\
    \ 和 Opera 10+。\n\n## 其他伪类\n\n有些伪类不属于上述任何类别，即 `:target`、`:lang` 和 `:not` 伪类。\n\n\
    ### target\n\n`:target` 伪类可以为通过 `id` 链接定位到的元素设置样式。它对于突出显示文档中的目标部分很有用。\n\n`:target\
    \ { font-weight: bold; } /* 目标元素 */`\n\n当点击以下页面内部链接时，此规则将应用于该锚点元素。浏览器还会滚动到该元素所在位置。\n\
    \n`<a href=\"#my-target\" id=\"my-target\">页面内部链接</a>`\n\n除 IE8 及更早版本外，所有主流浏览器均支持此伪类。\n\
    \n### lang\n\n`:lang()` 伪类匹配被确定为使用参数指定语言编写的元素。\n\n`p:lang(en) {}`\n\n此伪类适用于面向英语受众的段落元素，例如以下段落：\n\
    \n`<p lang=\"en\">English</p>`\n\n请注意，此伪类的行为与语言属性选择器类似。不同之处在于，`:lang` 伪类还会在语言设置于祖先元素上，或以其他方式（例如通过页面\
    \ HTTP 头部或 `<meta>` 标签）设置时匹配元素。\n\n`<body lang=\"fr\">`\n\n  `<p>French</p>`\n\
    \n`</body>`\n\n### not\n\n否定伪类 `:not` 匹配未由指定选择器定位到的元素。\n\n`p:not(.first) { font-weight:\
    \ bold; }`\n\n此示例规则选择未使用 `first` 类的段落。\n\n`<p class=\"first\">不加粗</p>`\n\n`<p>加粗</p>`\n\
    \n除 IE8 及更早版本外，所有主流浏览器均支持 `:not` 伪类。\n\n# 关系选择器\n\n关系选择器根据元素与其他元素的关系来匹配元素。要理解这些选择器，认识到网页文档中的元素如何相互关联非常重要。\n\
    \n## HTML 层级\n\nHTML 文档可以可视化为以 `<html>` 元素为根的树状结构。每个元素都位于此树的某处，并且每个元素要么是另一个元素的父元素，要么是子元素。位于另一个元素上方的任何元素称为祖先，直接上方的元素称为父元素。类似地，位于另一个元素下方的元素称为后代，直接下方的元素称为子元素。相应地，与另一个元素共享相同父元素的元素称为兄弟元素。考虑以下简单的\
    \ HTML 5 文档：\n\n```\n<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\"\
    >\n    <title>示例</title>\n  </head>\n  <body>\n    <h1>标题</h1>\n    <p>段落</p>\n\
    \  </body>\n</html>\n```\n\n在此示例中，`<h1>` 和 `<p>` 是兄弟元素，因为它们共享同一个父元素。它们的父元素是 `<body>`，并且与\
    \ `<html>` 一起，它们都是这两个兄弟元素的祖先。相应地，这两个兄弟元素是 `<body>` 的子元素，并且是 `<body>` 和 `<html>`\
    \ 的后代。此简单文档的层级结构如图 6-1 所示。\n\n![A978-1-4302-6491-0_6_Fig1_HTML.jpg](img/A978-1-4302-6491-0_6_Fig1_HTML.jpg)\n\
    \n图 6-1. 示例 HTML 层级结构\n\n## 继承\n\n继承是 CSS 中另一个重要概念。它使得某些样式不仅应用于指定的元素，还应用于其所有后代元素。例如，`color`\
    \ 属性是可继承的；而 `border` 属性则不可继承。这种默认的继承行为通常是期望的，使得继承非常直观。任何属性也可以显式地赋予 `inherit` 值，以使用其父元素对该属性所具有的相同值。\n\
    \n```\n/* 继承父元素的边框 */\np { border: inherit; }\n```\n\n继承使你可以在需要为所有后代元素应用相同样式时，将该样式应用于共同的祖先元素。与将样式应用于每个需要该特定样式的后代元素相比，此过程更加方便且易于维护。例如，如果整个文档的文本需要设置为特定颜色，你可以将样式应用于\
    \ `<body>` 元素，它是所有可见元素的共同祖先。\n\n```\n/* 将文档文本颜色设置为灰色 */\nbody { color: gray; }\n\
    ```\n\n既然你已经了解了 HTML 层级结构和继承概念，接下来可以讨论 CSS 的关系选择器了。\n"
- fmt: "# Adjacent selector\n\nThe adjacent sibling selector selects the second element\
    \ if it comes directly after the first element.\n\n`div+p { color: red; }`\n\n\
    This selector matches paragraphs that follow `<div>` elements.\n\n`<div>Not red</div>`\n\
    \n`<p>Red</p>`\n\n`<p>Not red</p>`\n\n# Descendent selector\n\nThe descendent\
    \ selector matches an element if it is the child or grandchild of another element.\
    \ It is useful when you want to apply a style to an element only when it resides\
    \ within another element.\n\n`div p { background: gray; }`\n\nThe preceding rule\
    \ applies to the following paragraph because it descends from a `<div>` element:\n\
    \n`<div>`\n  `<p>Gray</p>`\n`</div>`\n\n# Direct child selector\n\nThe direct\
    \ child selector matches its second element if it is the immediate descendant\
    \ of its first element.\n\n`div > span { color: green; }`\n\nWhen applied to the\
    \ following markup, this rule will color the second `<span>` element green. The\
    \ first `<span>` element is not colored because it is not a direct child of `<div>`.\n\
    \n`<div>`\n  `<p>`\n    `<span>Not green</span>`\n  `</p>`\n  `<span>Green</span>`\n\
    `</div>`\n\n# General sibling selector\n\nCSS 3 added the general sibling selector,\
    \ which matches the second element only if it is preceded by a sibling element\
    \ of the first type.\n\n`h1~p { color: blue; }`\n\nIn the following example, the\
    \ last two paragraphs are selected because they are preceded by `<h1>` and all\
    \ share the same parent:\n\n`<p>Not blue</p>`\n\n`<h1>Not blue</h1>`\n\n`<p>Blue</p>`\n\
    \n`<p>Blue</p>`\n\nAlthough it is a CSS 3 selector, it is supported by all major\
    \ browsers, including Chrome 2+, Firefox, IE7+, Safari 3.1+, and Opera 9.2+.\n\
    \n# 7. Specificity\n\nWhen more than one rule applies to the same element and\
    \ they specify the same property, there is a priority scheme that determines which\
    \ rule is given precedence. In short, CSS gives priority to the rule that has\
    \ the most specific selector.\n\n## Selector specificity\n\nThere are some basic\
    \ rules for calculating specificity. The lowest specificity with the weight of\
    \ 0 is given by the universal selector (`*`), which matches all elements in the\
    \ document.\n\n`* { color: red; } /* 0 */`\n\nThe type selectors have the weight\
    \ of 1, so a selector containing two type selectors has a specificity of 2.\n\n\
    `p { color: blue; } /* 1 */`\n\n`body p { color: gold; } /* 2 */`\n\nA class selector\
    \ has the weight of 10, as do pseudo classes and attribute selectors. When these\
    \ selectors include a type selector, they have a total weight of 11.\n\n`.a {\
    \ color: lime; } /* 10 */`\n\n`p:first-child { color: navy; } /* 11 */`\n\n`p[class=a]\
    \ { color: teal; } /* 11 */`\n\nThe pseudo elements do not count for any specificity,\
    \ except for the specificity added by the selector the pseudo element is prefixed\
    \ with.\n\n`p:first-letter { color: white; } /* 1 */`\n\nId selectors have a weight\
    \ of 100, so an id rule overrides most other conflicting styles.\n\n`#i { color:\
    \ aqua; } /* 100 */`\n\nInline styles have a weight of 1000 and outweigh even\
    \ id rules.\n\n`<p style=\"color: black;\">Text</p>`\n\nTo override all other\
    \ conflicting styles, including those defined as inline styles, a declaration\
    \ can be declared as `!important`. Note that the `!important` modifier is applied\
    \ to individual declarations, not entire rules.\n\n`p { color: red !important;\
    \ }`\n\nIf the specificity between two conflicting rules is the same, the cascade\
    \ is what determines which rule is applied.\n\n## Cascade\n\nIn CSS, more than\
    \ one style sheet can influence a document’s presentation. This feature is known\
    \ as cascading (the “C” part of CSS) because the browser merges all style sheets\
    \ to resolve any conflicts before the styles are applied.\n\nWeb documents can\
    \ have style sheets that come from three different sources: the browser, site\
    \ designer and user reading the document. The designer’s style sheet usually has\
    \ the highest priority, followed by the user’s personal style sheet (if any) and\
    \ then the browser’s default one.\n\n## Designer styles\n\nAs discussed earlier,\
    \ web designers have three ways to include CSS rules: inline styles, internal\
    \ style sheets, and external style sheets. Among these three, inline styles are\
    \ given the highest precedence, followed by internal style sheets and then external\
    \ style sheets.\n\nIf the web page includes more than one external style sheet\
    \ with conflicting rules (same specificity), the style sheet that is included\
    \ last in the HTML markup is given precedence. This is also true within a style\
    \ sheet. If the selectors are the same, the property declared last is the one\
    \ that counts.\n\n`p { color: orange; } /* overridden */`\n\n`p { color: silver;\
    \ } /* dominant */`\n\nFor inherited styles, an element’s own style has priority\
    \ over style inherited from its ancestors.\n\n`p { color: orange; } /* dominant\
    \ */`\n\n`body { color: silver; }`\n\n## Specificity guidelines\n\nAs shown in\
    \ this chapter, the style of an element can be specified in many different places\
    \ and with different priorities. The cascading feature gives a lot of flexibility\
    \ to CSS, but it can also result in unnecessary complexity if not managed well.\n\
    \nIn general, you want to keep specificity low to make it easier to know which\
    \ rules will take precedence. This way, you can allow the cascade to work for\
    \ you by adjusting the order in which your style rules appear, instead of needlessly\
    \ increasing the specificity with id and `!important` to override conflicting\
    \ styles.\n\n# 8. Colors\n\nThere are several different ways to specify a color\
    \ in CSS, which are described in the following sections.\n\n## Named notation\n\
    \nColors can be set by simply typing the common name of that color.\n\n`p { color:\
    \ red; } /* color paragraphs red */`\n\nThe HTML and CSS color specification includes\
    \ 140 predefined color names, such as `white`, `lime`, and `olive`. These colors\
    \ are all supported by the major browsers.\n\n## Hexadecimal notation\n\nFor the\
    \ full palette, the red, green, and blue components of the color can be set individually.\
    \ Each color component consists of a two-digit hexadecimal number, and the whole\
    \ six-digit number is prefixed by a hash sign (`#RRGGBB`). Hexadecimal means base-16\
    \ counting, so valid digits are 0 through 9 and A through F. Each red-green-blue\
    \ pair can range from 00 to FF, or 0-255 in decimal notation. All in all, there\
    \ are 16 million available colors.\n\n`p { color: #FF0000; } /* red:255, green:0,\
    \ blue:0 */`\n\nAlthough this color notation is the most obfuscated one, it is\
    \ also the most common one because of its precision, conciseness, and browser\
    \ support. An easy way to discover the hexadecimal value of a color is to use\
    \ the color picker tool from graphics software such as Adobe Photoshop or Paint.NET.\n\
    \n## Short hexadecimal notation\n\nThere is a short form of the hexadecimal notation\
    \ in which the color is specified using only three hexadecimal digits instead\
    \ of six. This notation can be converted to the hexadecimal notation by duplicating\
    \ each digit.\n\n`p { color: #f00; } /* same as #ff0000 */`\n\nThe short hexadecimal\
    \ notation is a useful shortcut when the full precision provided by the longer\
    \ hexadecimal notation is not needed.\n\n## RGB notation\n\nThe `rgb()` function\
    \ allows a color value to be specified as three intensity values for the color\
    \ components red, green, and blue. The value can be either an integer between\
    \ 0 and 255 or a percentage.\n\n`p { color: rgb(255, 0, 0); }`\n\n`p { color:\
    \ rgb(100%, 0%, 0%); }`\n\nThe RGB notation allows the same color precision as\
    \ the hexadecimal notation. The notation used comes down to a matter of preference,\
    \ but the hexadecimal notation is often preferred because it is shorter and can\
    \ easily be copied from an image editor, for example."
  raw: '## Adjacent selector


    The adjacent sibling selector selects the second element if it comes directly
    after the first element.


    `div+p { color: red; }`


    This selector matches paragraphs that follow `<div>` elements.


    `<div>Not red</div>`


    `<p>Red</p>`


    `<p>Not red</p>`


    ## Descendent selector


    The descendent selector matches an element if it is the child or grandchild of
    another element. It is useful when you want to apply a style to an element only
    when it resides within another element.


    `div p { background: gray; }`


    The preceding rule applies to the following paragraph because it descends from
    a `<div>` element:


    `<div>`


      `<p>Gray</p>`


    `</div>`


    ## Direct child selector


    The direct child selector matches its second element if it is the immediate descendant
    of its first element.


    `div > span { color: green; }`


    When applied to the following markup, this rule will color the second `<span>`
    element green. The first `<span>` element is not colored because it is not a direct
    child of `<div>`.


    `<div>`


      `<p>`


        `<span>Not green</span>`


      `</p>`


      `<span>Green</span>`


    `</div>`


    ## General sibling selector


    CSS 3 added the general sibling selector, which matches the second element only
    if it is preceded by a sibling element of the first type.


    `h1∼p { color: blue; }`


    In the following example, the last two paragraphs are selected because they are
    preceded by `<h1>` and all share the same parent:


    `<p>Not blue</p>`


    `<h1>Not blue</h1>`


    `<p>Blue</p>`


    `<p>Blue</p>`


    Although it is a CSS 3 selector, it is supported by all major browsers, including
    Chrome 2+, Firefox, IE7+, Safari 3.1+, and Opera 9.2+.


    # 7. Specificity


    When more than one rule applies to the same element and they specify the same
    property, there is a priority scheme that determines which rule is given precedence.
    In short, CSS gives priority to the rule that has the most specific selector.


    ## Selector specificity


    There are some basic rules for calculating specificity. The lowest specificity
    with the weight of 0 is given by the universal selector (`*`), which matches all
    elements in the document.


    `* { color: red; } /* 0 */`


    The type selectors have the weight of 1, so a selector containing two type selectors
    has a specificity of 2.


    `p { color: blue; } /* 1 */`


    `body p { color: gold; } /* 2 */`


    A class selector has the weight of 10, as do pseudo classes and attribute selectors.
    When these selectors include a type selector, they have a total weight of 11.


    `.a { color: lime; } /* 10 */`


    `p:first-child { color: navy; } /* 11 */`


    `p[class=a] { color: teal; } /* 11 */`


    The pseudo elements do not count for any specificity, except for the specificity
    added by the selector the pseudo element is prefixed with.


    `p:first-letter { color: white; } /* 1 */`


    Id selectors have a weight of 100, so an id rule overrides most other conflicting
    styles.


    `#i { color: aqua; } /* 100 */`


    Inline styles have a weight of 1000 and outweigh even id rules.


    `<p style="color: black;">Text</p>`


    To override all other conflicting styles, including those defined as inline styles,
    a declaration can be declared as `!important`. Note that the `!important` modifier
    is applied to individual declarations, not entire rules.


    `p { color: red !important; }`


    If the specificity between two conflicting rules is the same, the cascade is what
    determines which rule is applied.


    ## Cascade


    In CSS, more than one style sheet can influence a document’s presentation. This
    feature is known as cascading (the “C” part of CSS) because the browser merges
    all style sheets to resolve any conflicts before the styles are applied.


    Web documents can have style sheets that come from three different sources: the
    browser, site designer and user reading the document. The designer’s style sheet
    usually has the highest priority, followed by the user’s personal style sheet
    (if any) and then the browser’s default one.


    ## Designer styles


    As discussed earlier, web designers have three ways to include CSS rules: inline
    styles, internal style sheets, and external style sheets. Among these three, inline
    styles are given the highest precedence, followed by internal style sheets and
    then external style sheets.


    If the web page includes more than one external style sheet with conflicting rules
    (same specificity), the style sheet that is included last in the HTML markup is
    given precedence. This is also true within a style sheet. If the selectors are
    the same, the property declared last is the one that counts.


    `p { color: orange; } /* overridden */`


    `p { color: silver; } /* dominant */`


    For inherited styles, an element’s own style has priority over style inherited
    from its ancestors.


    `p { color: orange; } /* dominant */`


    `body { color: silver; }`


    ## Specificity guidelines


    As shown in this chapter, the style of an element can be specified in many different
    places and with different priorities. The cascading feature gives a lot of flexibility
    to CSS, but it can also result in unnecessary complexity if not managed well.


    In general, you want to keep specificity low to make it easier to know which rules
    will take precedence. This way, you can allow the cascade to work for you by adjusting
    the order in which your style rules appear, instead of needlessly increasing the
    specificity with id and `!important` to override conflicting styles.


    # 8. Colors


    There are several different ways to specify a color in CSS, which are described
    in the following sections.


    ## Named notation


    Colors can be set by simply typing the common name of that color.


    `p { color: red; } /* color paragraphs red */`


    The HTML and CSS color specification includes 140 predefined color names, such
    as `white`, `lime`, and `olive`. These colors are all supported by the major browsers.


    ## Hexadecimal notation


    For the full palette, the red, green, and blue components of the color can be
    set individually. Each color component consists of a two-digit hexadecimal number,
    and the whole six-digit number is prefixed by a hash sign (`#RRGGBB`). Hexadecimal
    means base-16 counting, so valid digits are 0 through 9 and A through F. Each
    red-green-blue pair can range from 00 to FF, or 0-255 in decimal notation. All
    in all, there are 16 million available colors.


    `p { color: #FF0000; } /* red:255, green:0, blue:0 */`


    Although this color notation is the most obfuscated one, it is also the most common
    one because of its precision, conciseness, and browser support. An easy way to
    discover the hexadecimal value of a color is to use the color picker tool from
    graphics software such as Adobe Photoshop or Paint.NET.


    ## Short hexadecimal notation


    There is a short form of the hexadecimal notation in which the color is specified
    using only three hexadecimal digits instead of six. This notation can be converted
    to the hexadecimal notation by duplicating each digit.


    `p { color: #f00; } /* same as #ff0000 */`


    The short hexadecimal notation is a useful shortcut when the full precision provided
    by the longer hexadecimal notation is not needed.


    ## RGB notation


    The `rgb()` function allows a color value to be specified as three intensity values
    for the color components red, green, and blue. The value can be either an integer
    between 0 and 255 or a percentage.


    `p { color: rgb(255, 0, 0); }`


    `p { color: rgb(100%, 0%, 0%); }`


    The RGB notation allows the same color precision as the hexadecimal notation.
    The notation used comes down to a matter of preference, but the hexadecimal notation
    is often preferred because it is shorter and can easily be copied from an image
    editor, for example.'
  trans: "\n# 相邻选择器\n\n相邻兄弟选择器用于选择紧跟在第一个元素之后的第二个元素。\n\n`div+p { color: red; }`\n\n\
    该选择器会匹配紧跟在 `<div>` 元素后面的段落。\n\n`<div>不是红色</div>`\n\n`<p>红色</p>`\n\n`<p>不是红色</p>`\n\
    \n# 后代选择器\n\n后代选择器用于匹配某个元素的子元素或孙元素。当你想仅当某个元素位于另一个元素内部时才对其应用样式时，这个选择器非常有用。\n\n\
    `div p { background: gray; }`\n\n上述规则适用于以下段落，因为它源自一个 `<div>` 元素：\n\n`<div>`\n\
    \  `<p>灰色</p>`\n`</div>`\n\n# 直接子元素选择器\n\n直接子元素选择器用于匹配其第二个元素，前提是该元素是其第一个元素的直接子元素。\n\
    \n`div > span { color: green; }`\n\n当应用于以下标记时，此规则会将第二个 `<span>` 元素着色为绿色。第一个 `<span>`\
    \ 元素不会被着色，因为它不是 `<div>` 的直接子元素。\n\n`<div>`\n  `<p>`\n    `<span>不是绿色</span>`\n\
    \  `</p>`\n  `<span>绿色</span>`\n`</div>`\n\n# 通用兄弟选择器\n\nCSS 3 新增了通用兄弟选择器，它匹配的第二个元素必须前面有第一个类型的兄弟元素。\n\
    \n`h1~p { color: blue; } `\n\n在下面的示例中，最后两个段落会被选中，因为它们前面有 `<h1>` 元素，并且共享同一个父元素：\n\
    \n`<p>不是蓝色</p>`\n\n`<h1>不是蓝色</h1>`\n\n`<p>蓝色</p>`\n\n`<p>蓝色</p>`\n\n虽然这是一个 CSS\
    \ 3 选择器，但它得到所有主流浏览器的支持，包括 Chrome 2+、Firefox、IE7+、Safari 3.1+ 和 Opera 9.2+。\n\n\
    # 7. 特指度\n\n当多个规则应用于同一个元素并且指定了相同的属性时，会有一个优先级方案来决定哪个规则优先。简而言之，CSS 会优先考虑选择器最具体的规则。\n\
    \n## 选择器特指度\n\n计算特指度有一些基本规则。权重为 0 的最低特指度由通用选择器（`*`）赋予，它匹配文档中的所有元素。\n\n`* { color:\
    \ red; } /* 0 */`\n\n类型选择器的权重为 1，因此一个包含两个类型选择器的选择器，其特指度为 2。\n\n`p { color: blue;\
    \ } /* 1 */`\n\n`body p { color: gold; } /* 2 */`\n\n类选择器的权重为 10，伪类和属性选择器也是如此。当这些选择器包含一个类型选择器时，总权重为\
    \ 11。\n\n`.a { color: lime; } /* 10 */`\n\n`p:first-child { color: navy; } /*\
    \ 11 */`\n\n`p[class=a] { color: teal; } /* 11 */`\n\n伪元素不计入任何特指度，除非是伪元素前缀的选择器所增加的特指度。\n\
    \n`p:first-letter { color: white; } /* 1 */`\n\nID 选择器的权重为 100，因此一个 ID 规则会覆盖大多数其他冲突样式。\n\
    \n`#i { color: aqua; } /* 100 */`\n\n内联样式的权重为 1000，甚至超过 ID 规则。\n\n`<p style=\"\
    color: black;\">文本</p>`\n\n要覆盖所有其他冲突样式，包括定义为内联样式的样式，可以将声明声明为 `!important`。请注意，`!important`\
    \ 修饰符应用于单个声明，而非整个规则。\n\n`p { color: red !important; }`\n\n如果两个冲突规则之间的特指度相同，则由层叠决定应用哪个规则。\n\
    \n## 层叠\n\n在 CSS 中，多个样式表可以影响文档的呈现。此特性被称为层叠（CSS 中的“C”代表层叠），因为浏览器会合并所有样式表以在应用样式之前解决任何冲突。\n\
    \n网页文档可以拥有来自三个不同来源的样式表：浏览器、网站设计者和阅读文档的用户。设计者的样式表通常具有最高优先级，其次是用户的个人样式表（如果有的话），然后是浏览器的默认样式表。\n\
    \n## 设计者样式\n\n如前所述，网页设计者有三种方式包含 CSS 规则：内联样式、内部样式表和外部样式表。在这三者中，内联样式的优先级最高，其次是内部样式表，然后是外部样式表。\n\
    \n如果网页包含多个具有冲突规则（相同特指度）的外部样式表，则 HTML 标记中最后包含的样式表具有更高的优先级。在样式表内部也是如此。如果选择器相同，最后声明的属性才生效。\n\
    \n`p { color: orange; } /* 被覆盖 */`\n\n`p { color: silver; } /* 主导 */`\n\n对于继承的样式，元素自身的样式优先级高于从其祖先继承的样式。\n\
    \n`p { color: orange; } /* 主导 */`\n\n`body { color: silver; }`\n\n## 特指度指南\n\n\
    如本章所示，元素的样式可以在许多不同的位置以不同的优先级指定。层叠特性赋予了 CSS 很大的灵活性，但如果管理不当，也可能导致不必要的复杂性。\n\n通常，您希望保持较低的特指度，以便更容易了解哪些规则会优先。这样，您可以通过调整样式规则出现的顺序来利用层叠机制，而不是通过使用\
    \ ID 和 `!important` 来不必要地增加特指度以覆盖冲突样式。\n\n# 8. 颜色\n\n在 CSS 中，有几种不同的方法可以指定颜色，以下各节将进行描述。\n\
    \n## 命名表示法\n\n只需键入该颜色的通用名称即可设置颜色。\n\n`p { color: red; } /* 将段落颜色设置为红色 */`\n\n\
    HTML 和 CSS 颜色规范包含了 140 个预定义的颜色名称，例如 `white`、`lime` 和 `olive`。这些颜色都得到了主流浏览器的支持。\n\
    \n## 十六进制表示法\n\n对于完整的调色板，可以分别设置颜色的红色、绿色和蓝色分量。每个颜色分量由一个两位十六进制数组成，整个六位数前面加上一个井号（`#RRGGBB`）。十六进制意味着基数为\
    \ 16 的计数，因此有效数字是 0 到 9 以及 A 到 F。每个红-绿-蓝对的取值范围可以从 00 到 FF，即十进制表示法中的 0-255。总共有 1600\
    \ 万种可用颜色。\n\n`p { color: #FF0000; } /* 红色:255, 绿色:0, 蓝色:0 */`\n\n尽管这种颜色表示法是最晦涩的，但它也是最常见的，因为它精确、简洁且浏览器支持良好。发现颜色十六进制值的一个简单方法是使用图形软件（如\
    \ Adobe Photoshop 或 Paint.NET）中的取色器工具。\n\n## 短十六进制表示法\n\n十六进制表示法有一种短形式，其中颜色仅使用三位十六进制数字而不是六位数字来指定。通过将每个数字重复一次，可以将这种表示法转换为十六进制表示法。\n\
    \n`p { color: #f00; } /* 等同于 #ff0000 */`\n\n当不需要长十六进制表示法提供的完整精度时，短十六进制表示法是一种有用的快捷方式。\n\
    \n## RGB 表示法\n\n`rgb()` 函数允许将颜色值指定为红色、绿色和蓝色颜色分量的三个强度值。该值可以是 0 到 255 之间的整数，也可以是百分比。\n\
    \n`p { color: rgb(255, 0, 0); }`\n\n`p { color: rgb(100%, 0%, 0%); }`\n\nRGB 表示法允许与十六进制表示法相同的颜色精度。使用哪种表示法取决于个人偏好，但十六进制表示法通常更受青睐，因为它更短，并且可以轻松地从图像编辑器中复制，例如。\n"
- fmt: "# RGBA notation\n\nCSS 3 introduced the RGBA notation, adding an alpha value\
    \ for specifying the color transparency. This alpha value is a number between\
    \ 0.0 (fully transparent) and 1.0 (fully opaque).\n\n```\n/* Red with 50% transparency\
    \ */\np { color: rgba(100%, 0%, 0%, 0.5); }\n```\n\nRGBA color values are supported\
    \ in Chrome, Firefox 3+, IE9+, Safari, and Opera 10+. If support is not present,\
    \ the rule is ignored, so a fallback color value can be set as shown here:\n\n\
    ```\np {\n  color: rgb(100%, 0%, 0%); /* fallback */\n  color: rgba(100%, 0%,\
    \ 0%, 0.5);\n}\n```\n\nA browser that does not support RGBA ignores the second\
    \ declaration and continues to apply the opaque version.\n\n# HSL notation\n\n\
    A color value can be set with the `hsl()` function (which stands for hue, saturation,\
    \ and lightness). Hue is a degree on a color circle from 0 to 360, where 0 and\
    \ 360 are red, 120 is green, and 240 is blue. Saturation is a percentage value,\
    \ with 0% giving a shade of gray and 100% giving the full color. Lightness is\
    \ also specified as a percentage, from 0% (black) to 100% (bright).\n\n```\np\
    \ { color: hsl(0, 100%, 100%); }\n```\n\nAlthough HSL colors are more intuitive\
    \ than RGB colors, and the color values are easier to tweak, HSL should not be\
    \ used until IE8 usage declines to a point when it is no longer necessary for\
    \ web sites to support it. HSL is a CSS 3 value and is supported in Chrome, Firefox,\
    \ IE9+, Safari, and Opera 10+.\n\n# HSLA notation\n\nSimilar to RGB, the HSL notation\
    \ can be extended with an alpha value for specifying the transparency.\n\n```\n\
    /* Red with 50% transparency */\np { color: hsla(0, 100%, 100%, 0.5); }\n```\n\
    \nHSLA is supported in Chrome, Firefox 3+, IE9+, Safari, and Opera 10+, which\
    \ is the same as the RGBA function.\n\n# Units\n\nThere are several units to choose\
    \ from when specifying the size of a property's value.\n\n## Absolute units\n\n\
    The absolute units of length are centimeter (`cm`), millimeter (`mm`), and inch\
    \ (`in`). Although these units are meant to look the same regardless of the screen\
    \ resolution, it is not always the case because web browsers do not always know\
    \ the exact physical size of the display medium.\n\n```\n.one-cm { font-size:\
    \ 1cm; }\n.one-mm { font-size: 1mm; }\n.one-in { font-size: 1in; }\n```\n\nThese\
    \ units are mainly useful when the size of the output medium is known, such as\
    \ for content that will be printed to paper. They are not recommended for screen\
    \ displays because the screen sizes can vary a lot.\n\n## Typographical units\n\
    \nPoints (`pt`) and picas (`pc`) are typographical units. By definition, there\
    \ are 72 points to an inch and 12 points to one pica. Like the absolute units,\
    \ the typographical units are most useful for print style sheets, not for onscreen\
    \ use.\n\n```\n.one-point { font-size: 1pt; }\n.one-pica  { font-size: 1pc; }\n\
    ```\n\n## Relative units\n\nThe relative units of length are pixel (`px`) and\
    \ percentage (`%`). A percentage is a unit proportional to the parent's value\
    \ for that property; a pixel is relative to the physical pixel on the display\
    \ device used.\n\n```\n.one-pixel   { font-size: 1px; }\n.one-percent { font-size:\
    \ 1%; }\n```\n\nPixels and percentages are two of the most useful units in CSS\
    \ for onscreen displays. Pixels are fixed size, so they allow very precise control\
    \ over the layout in a web document. Percentages, on the other hand, are useful\
    \ for defining font sizes for text content because the text remains scalable,\
    \ which is important for small devices and accessibility purposes. When the text\
    \ is part of the design and needs to match other elements, it can be sized in\
    \ pixels for greater control. Modern browsers all support full-page zooming, which\
    \ has made pixel-based font sizes more acceptable. Note that for high-resolution\
    \ screens, a CSS pixel renders as multiple screen pixels. For example, the Apple\
    \ Retina display renders all pixel dimensions at twice their actual size.\n\n\
    ## Font-relative units\n\nTwo additional relative measures are em-height (`em`)\
    \ and ex-height (`ex`). Em-height is the same as the font-size; ex-height is about\
    \ half the font-size.\n\n```\n.one-ex { font-size: 1ex; }\n.one-em { font-size:\
    \ 1em; }\n```\n\nLike percentage, em-height is a good relative unit that is commonly\
    \ used for setting the font size of web document text. They both respect the user's\
    \ choice of font size in their browser and are easier to read on small-screen\
    \ devices than pixel-based font sizes.\n\nCSS 3 introduced two additional font-relative\
    \ units: `rem` and `ch`. The root em-height (`rem`) unit is relative to the font-size\
    \ of the root element (`<html>`). It can be used instead of `em` to prevent the\
    \ element's font size from being affected by changes to the font size of its ancestor\
    \ elements.\n\n```\n.one-rem { font-size: 1rem; }\n```\n\nThe character unit (`ch`)\
    \ measures the width of the character zero (0) for the element's font. It can\
    \ be useful for defining the width of a box containing text because the unit roughly\
    \ corresponds to the number of characters that fit within that box.\n\n```\n/*\
