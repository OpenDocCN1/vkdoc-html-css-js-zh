    The `ch` unit is supported only in Chrome 27+, Firefox 19+, and IE9+, so it should\
    \ be used only with a fallback. The `rem` unit has slightly better support and\
    \ works in Chrome 4+, Firefox 3.6+, IE9+, Safari 4.1+, and Opera 11.6+.\n\n##\
    \ Viewport units\n\nViewport width (`vw`) and viewport height (`vh`) units allow\
    \ elements to be dimensioned relative to the viewport, meaning the visible portion\
    \ of the document. Each unit represents a percentage of the current viewport.\n\
    \n```\nwidth:  50vw; /* 50% of viewport width */\nheight: 25vh; /* 25% of viewport\
    \ height */\n```\n\nTwo additional viewport units are `vmin` and `vmax`, which\
    \ give the minimum or maximum value of the viewport's dimension.\n\n```\nwidth:\
    \  1vmin; /* 1vh or 1vw, whichever is smallest */\nheight: 1vmax; /* 1vh or 1vw,\
