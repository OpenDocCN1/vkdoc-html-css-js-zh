    \nMikael Olsson is a professional programmer, web entrepreneur, and author. He\
    \ works for an R&D company in Finland, at which he specializes in software development.\
    \ In his spare time, he writes books and creates web sites that summarize various\
    \ fields of interest. The books Mikael writes are focused on teaching their subjects\
    \ in the most efficient way possible, by explaining only what is relevant and\
    \ practical without any unnecessary repetition or theory. The portal to his online\
