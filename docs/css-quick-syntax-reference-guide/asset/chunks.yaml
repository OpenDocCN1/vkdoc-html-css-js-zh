    \ 5px 6px #ccc;\n}\n```\n\n# 12. Spacing\n\nThe following properties deal with\
    \ the space between elements. They are all inherited by default.\n\n## `line-height`\n\
    \n`line-height` sets the distance between lines. The initial value is `normal`,\
    \ which is typically rendered as 120% of the font size. The line height can also\
    \ be set to a length, a percentage of the current font size, or a dimensionless\
    \ number that is multiplied with the current font size.\n\n`line-height : inherit\
    \ | normal | <length> | <percentage> | <number>`\n\nThe `line-height` property\
    \ inherits, so the preferred way to set `line-height` is by using a dimensionless\
    \ number. Setting `line-height` as a length or percentage can have unexpected\
    \ results for child elements that use different font sizes because the inherited\
    \ line height is then fixed instead of relative to the child element’s font size.\n\
    \n```\n/* Line height is 1.5 times font size */\nline-height: 1.5;\n```\n\nLine\
    \ height has no effect on replaced inline elements such as `<img>`. When used\
    \ on non–replaced inline elements, it sets the line height as expected. For block\
    \ elements, `line-height` sets the minimal height of line boxes within the element.\n\
    \n## `word-spacing` and `letter-spacing`\n\n`word-spacing` sets the spacing between\
    \ words, and `letter-spacing` sets the spacing between individual characters.\
    \ Negative values are allowed for both of these properties.\n\n`word-spacing :\
    \ inherit | normal | <length>`\n\n`letter-spacing : inherit | normal | <length>`\n\
    \nThe following rule creates a 3-pixel distance between letters and a 5-pixel\
    \ distance between words inside a paragraph:\n\n```\np {\n  letter-spacing: 3px;\n\
    \  word-spacing: 5px;\n}\n```\n\n## `white-space`\n\nThe `white-space` property\
    \ changes the way whitespace characters inside of a block element are handled.\n\
    \n`white-space (block) : inherit | normal | nowrap |` pre | pre-wrap | pre-line\n\
    \nMultiple whitespace characters are normally collapsed into a single character\
    \ in HTML, and text is wrapped as necessary to fill the width of the containing\
    \ block element.\n\n```\n/* Wrap text and collapse newlines, spaces and tabs */\n\
    p { white-space: normal; }\n```\n\nSetting whitespace to `nowrap` prevents text\
    \ from wrapping for anything other than the line break tag `<br>`. The `pre` (preformatted)\
    \ value also prevents wrapping, but it also preserves all whitespace characters.\
    \ Its behavior is the same as the `<pre>` element in HTML.\n\nBoth the `pre-wrap`\
    \ and `pre-line` values allow text to wrap as normal, with `pre-wrap` preserving\
    \ sequences of whitespace and `pre-line` collapsing them. The difference between\
    \ `pre-line` and `normal` is that `pre-line` preserves newline characters. Note\
    \ that the support for these last two values in IE was not added until version\
    \ 8.\n\n# 13. Font\n\nThe font properties can be used to change aspects of the\
    \ font and to load custom fonts. They can be applied to any element and they all\
    \ inherit.\n\n## `font-family`\n\n`font-family` sets the face of the font. Its\
    \ value can be a specific font name such as `times` or `verdana`; or a generic\
    \ family name such as `sans-serif`, `serif`, or `monospace`.\n\n`font-family :\
    \ inherit | <family-names> | <generic-families>`\n\nThe value for this property\
    \ is a prioritized list of one or more font names. If a browser does not have\
    \ access to the first font, it uses the next font and so on.\n\n`font-family:\
    \ \"Times New Roman\", times, serif;`\n\nIt is recommended to end the list with\
    \ a family name to make sure that at least the font family is consistent across\
    \ browsers. Note that if a font name includes spaces, it must be surrounded by\
    \ double quotes, as in the previous example.\n\n## `font-size`\n\n`font-size`\
    \ sets the size of the font. The value can be any unit of measure or a percentage\
    \ of the parent’s font size. There are also a couple of predefined values, as\
    \ listed here:\n\n`font-size : inherit | <length> | <percentage> |`\n            `smaller\
    \ | larger | xx-small | x-small |`\n            `small | medium | large | x-large\
    \ | xx-large`\n\nThe `larger` and `smaller` values are relative to the parent’s\
    \ font size; the other predefined values refer to absolute sizes. The initial\
    \ size is `medium`, which is 1 em (16 pixels) for normal text.\n\n## `font-style`\n\
    \n`font-style` makes the text slanted. According to specifications, `italic` is\
    \ a cursive companion face to the normal face, and `oblique` is a slanted form\
    \ of the normal face. Both faces tend to be rendered the same way for most fonts,\
    \ however.\n\n`font-style : inherit | normal | italic | oblique`\n\n## `font-variant`\n\
    \n`font-variant` can be used to display text using small caps instead of lowercase\
    \ letters. A value of `small-caps` renders text in uppercase letters that are\
    \ smaller than regular uppercase letters.\n\n`font-variant : inherit | normal\
    \ | small-caps`\n\n## `font-weight`\n\n`font-weight` sets the thickness of the\
    \ font. The `bolder` and `lighter` values set the thickness relative to the parent\
    \ element, and the numeric values specify absolute weights. The value of `bold`\
    \ is equal to 700, and `normal` is the same as 400.\n\n`font-weight : inherit\
    \ | normal | bold | bolder |`\n              `lighter | 100 | 200 | ... | 900`\n\
    \nEven if several weight values can be specified, most fonts have only one type\
    \ of bold, as shown in the following example rendering:\n\n```\nlighter normal\
    \ bold bolder 100 200 300 400 500 600 700 800 900\n```"
  raw: '## text-shadow


    A shadow effect can be added to text with the `text-shadow` property.


    `text-shadow : inherit | none | <offset-x> <offset-y>` `[<blur-radius>] [<color>]`


    The shadow is defined using two offset values, followed by two optional values
    for the blur radius and color. The x and y offsets are specified as length values
    relative to the text. Positive values move the shadow right and down; negative
    values move it left and up.


    A blur effect can be added by setting a blur radius, which makes the shadow stretch
    and fade at the edges. The final optional value for the property is the color
    of the shadow. If no color value is specified, most browsers render the shadow
    in the same color as the text. The following example style causes a slightly blurred
    gray shadow to appear at the top right of `<h1>` elements:


    `h1 { text-shadow: 1px -1px 1px gray; }`


    `text-shadow` is a CSS 3 property that is supported by most major browsers, including
    Chrome 2+, Firefox 3.5+, IE10+, Safari 1.2+, and Opera 9.5+.


    ## box-shadow


    In addition to text, a shadow effect can be added to block elements with the `box-shadow`
    property.


    `box-shadow (block) : inherit | none | [inset]` `<offset-x> <offset-y>`


    `[<blur-radius>] [<spread-radius> [<color>]]`


    The values for the box shadow are the same as for `text-shadow`—with two exceptions.
    A fourth length value, `spread-radius`, can be specified to grow or shrink the
    shadow. This value is optional and is 0 if left unspecified, rendering the shadow
    in the same size as the element. As an example, the following class rule displays
    a blurry gray shadow to the bottom right of any block element using this class:


    `.drop-shadow { box-shadow: 3px 3px 3px 6px #ccc; }`


    The second value unique to the `box-shadow` property is the `inset` keyword. If
    present, the shadow displays inside the box instead of as a drop shadow on the
    outside.


    `.inset-shadow { box-shadow: inset 3px 3px 3px 6px #ccc; }`


    `box-shadow` is a CSS 3 property and is implemented in Chrome 10+, Firefox 4+,
    IE9+, Safari 5.1+, and Opera 10.5+. Support can be expanded using the `-webkit`
    and `-moz` prefixes, as shown here:


    `.drop-shadow`


    `{`


      `/* Chrome 1-5, Safari 2-5.1+ */`


      `-webkit-box-shadow: 3px 3px 5px 6px #ccc;`


      `/* Firefox 3.5-3.6 */`


      `-moz-box-shadow: 3px 3px 5px 6px #ccc;`


      `box-shadow: 3px 3px 5px 6px #ccc;`


    `}`


    # 12. Spacing


    The following properties deal with the space between elements. They are all inherited
    by default.


    ## line-height


    `line-height` sets the distance between lines. The initial value is `normal`,
    which is typically rendered as 120% of the font size. The line height can also
    be set to a length, a percentage of the current font size, or a dimensionless
    number that is multiplied with the current font size.


    `line-height : inherit | normal | <length> | <percentage> | <number>`


    The `line-height` property inherits, so the preferred way to set `line-height`
    is by using a dimensionless number. Setting `line-height` as a length or percentage
    can have unexpected results for child elements that use different font sizes because
    the inherited line height is then fixed instead of relative to the child element’s
    font size.


    `/* Line height is 1.5 times font size */`


    `line-height: 1.5;`


    Line height has no effect on replaced inline elements such as `<img>`. When used
    on non–replaced inline elements, it sets the line height as expected. For block
    elements, `line-height` sets the minimal height of line boxes within the element.


    ## word-spacing and letter-spacing


    `word-spacing` sets the spacing between words, and `letter-spacing` sets the spacing
    between individual characters. Negative values are allowed for both of these properties.


    `word-spacing : inherit | normal | <length>`


    `letter-spacing : inherit | normal | <length>`


    The following rule creates a 3-pixel distance between letters and a 5-pixel distance
    between words inside a paragraph:


    `p {`


      `letter-spacing: 3px;`


      `word-spacing: 5px;`


    `}`


    ## white-space


    The `white-space` property changes the way whitespace characters inside of a block
    element are handled.


    `white-space (block) : inherit | normal | nowrap |` pre | pre-wrap | pre-line


    Multiple whitespace characters are normally collapsed into a single character
    in HTML, and text is wrapped as necessary to fill the width of the containing
    block element.


    `/* Wrap text and collapse newlines, spaces and tabs */`


    `p { white-space: normal; }`


    Setting whitespace to `nowrap` prevents text from wrapping for anything other
    than the line break tag `<br>`. The `pre` (preformatted) value also prevents wrapping,
    but it also preserves all whitespace characters. Its behavior is the same as the
    `<pre>` element in HTML.


    Both the `pre-wrap` and `pre-line` values allow text to wrap as normal, with `pre-wrap`
    preserving sequences of whitespace and `pre-line` collapsing them. The difference
    between `pre-line` and `normal` is that `pre-line` preserves newline characters.
    Note that the support for these last two values in IE was not added until version
    8.


    # 13. Font


    The font properties can be used to change aspects of the font and to load custom
    fonts. They can be applied to any element and they all inherit.


    ## font-family


    `font-family` sets the face of the font. Its value can be a specific font name
    such as `times` or `verdana`; or a generic family name such as `sans-serif`, `serif`,
    or `monospace`.


    `font-family : inherit | <family-names> | <generic-families>`


    The value for this property is a prioritized list of one or more font names. If
    a browser does not have access to the first font, it uses the next font and so
    on.


    `font-family: "Times New Roman", times, serif;`


    It is recommended to end the list with a family name to make sure that at least
    the font family is consistent across browsers. Note that if a font name includes
    spaces, it must be surrounded by double quotes, as in the previous example.


    ## font-size


    `font-size` sets the size of the font. The value can be any unit of measure or
    a percentage of the parent’s font size. There are also a couple of predefined
    values, as listed here:


    `font-size : inherit | <length> | <percentage> |`


                `smaller | larger | xx-small | x-small |`


                `small | medium | large | x-large | xx-large`


    The `larger` and `smaller` values are relative to the parent’s font size; the
    other predefined values refer to absolute sizes. The initial size is `medium`,
    which is 1 em (16 pixels) for normal text.


    ## font-style


    `font-style` makes the text slanted. According to specifications, `italic` is
    a cursive companion face to the normal face, and `oblique` is a slanted form of
    the normal face. Both faces tend to be rendered the same way for most fonts, however.


    `font-style : inherit | normal | italic | oblique`


    ## font-variant


    `font-variant` can be used to display text using small caps instead of lowercase
    letters. A value of `small-caps` renders text in uppercase letters that are smaller
    than regular uppercase letters.


    `font-variant : inherit | normal | small-caps`


    ## font-weight


    `font-weight` sets the thickness of the font. The `bolder` and `lighter` values
    set the thickness relative to the parent element, and the numeric values specify
    absolute weights. The value of `bold` is equal to 700, and `normal` is the same
    as 400.


    `font-weight : inherit | normal | bold | bolder |`


                  `lighter | 100 | 200 | ... | 900`


    Even if several weight values can be specified, most fonts have only one type
    of bold, as shown in the following example rendering:


    `lighter normal` `bold bolder` `100 200 300 400 500` `600 700 800 900`'
