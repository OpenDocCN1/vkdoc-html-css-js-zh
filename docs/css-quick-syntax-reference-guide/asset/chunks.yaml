    \n## 献词\n\n## 关于作者\n\n![A978-1-4302-6491-0_BookFrontmatter_Fig1_HTML.jpg](img/A978-1-4302-6491-0_BookFrontmatter_Fig1_HTML.jpg)\n\
    \n米凯尔·奥尔森是一名专业程序员、网络创业者兼作家。他在芬兰一家研发公司工作，专门从事软件开发。业余时间，他著书立说并创建网站，总结各领域的兴趣爱好。米凯尔所著的书籍专注于以最高效的方式传授知识，只讲解相关且实用的内容，避免任何不必要的重复或理论。他的在线业务及其他网站的门户是\
    \ [`www.siforia.com`](http://www.siforia.com/)。\n\n## 关于技术审校\n\n![A978-1-4302-6491-0_BookFrontmatter_Fig2_HTML.jpg](img/A978-1-4302-6491-0_BookFrontmatter_Fig2_HTML.jpg)\n\
    \n维克多·萨姆纳是 Desire2Learn 公司的高级软件工程师，负责构建和维护一个集成学习平台。作为一名自学成才的开发者，他对新兴技术始终充满兴趣，乐于处理并解决自己舒适区之外的难题。工作之余，维克多拥有多项爱好，包括摄影、骑马和游戏。他与妻子艾丽西亚及两个孩子居住在加拿大安大略省。\n\
    \n## 引言\n\nCSS，全称为层叠样式表（Cascading Style Sheets），是一种定义网页展示效果的样式语言。它是对 HTML 的补充，而\
    \ HTML 是用于描述网站内容结构的语言。由于 HTML 的出现早于 CSS，因此它包含了一些有限的样式元素和属性，但这些大多已被弃用，转而采用 CSS\
    \ 提供的更强大的设计控制能力。\n\nCSS 的主要特点之一是能够将网站的展示与其内容完全分离。这种分离减少了将样式信息包含在结构内容中带来的复杂性和重复性。此外，这种分离使得在整个网站中强制执行展示上的一致性变得容易，因为整个站点的外观和感觉都可以通过单个样式表文档来控制。\n\
    \n作为 Web 的核心语言之一，如今几乎所有网站都使用 CSS 来增强网络体验。它给万维网带来了革命性的变化，是任何从事网页设计工作的人必须学习的语言。与\
    \ HTML 一样，CSS 语言易于学习和使用，本书将为您展示这一点。\n"
- fmt: '# CSS versions


    The CSS language is under ongoing development by the World Wide Web Consortium
    (W3C), which is the international standards organization for the Internet. The
    W3C writes the specifications that web browsers implement to display web pages
    consistently in compliance with those specifications. Each new specification extends
    the language with new features while maintaining backward compatibility.


    The first specification, CSS level 1 (or CSS 1), became a W3C recommendation in
    1996. In 1998, CSS 2 was finalized, extending CSS 1 with additional features.
    Because all widely used web browsers currently implement the features of both
    these specifications, it is seldom necessary to make a distinction between them,
    and this book does so only when relevant.


    Since 1998, the W3C has been working on CSS 3. Unlike the two earlier levels of
    CSS, this level became considerably larger and was therefore split into several
    separate specifications called modules. This split allowed the modules to mature
    independently at their own pace. As a result of the ongoing development, support
    for CSS 3 varies. Some features are stable and have widespread browser support;
    other features are supported only by the latest browser versions or are not supported
    at all. This book focuses mainly on the CSS 3 features that are supported in the
    major browsers at the time of writing.


    # Rule structure


    CSS is commonly used within a style sheet document, which consists of a list of
    rules. For example, a rule to color all paragraph elements red is shown here:


    `p { color: red; }`


    This rule has two parts: a selector and a declaration block. The selector is the
    link between the HTML document and the style sheet that specifies the element
    to which the rule is applied. In this case, it is the type selector `p` that applies
    to all paragraph elements (`<p>`). Any HTML element can be used as a type selector
    in this way.


    The declaration block, which is enclosed within curly braces, defines the styling
    applied to the selected elements. The block can contain one or more declarations,
    each of which is made up of a style property followed by a colon and a valid value
    for that property. Each declaration is terminated with a semicolon, although this
    is optional for the last one.


    `p { color: red; background: black }`


    Although the last semicolon is not necessary, it is a good practice to include
    it because it is easy to forget the missing semicolon when you add more styles
    to the rule. Another general practice is to use lowercase letters when writing
    CSS, even though selectors and properties are case-insensitive.


    To summarize, a style rule consists of a selector and one or more declarations,
    each comprising one or more property-value pairs. This structure is illustrated
    here:


