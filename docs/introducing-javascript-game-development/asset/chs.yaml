- "# 2. 理解路径\n\nGraeme Stuart¹\n\n(1) 英国莱斯特郡马基特哈伯勒\n\n第 1 章介绍了在画布上绘制的一些基本方法。本章提供一个后续练习，更深入地探讨画布坐标系，并探索如何构建路径。这些概念对于理解画布和设计你自己的绘图代码至关重要。我们还将开始为代码增添更多结构。复杂的代码可能难以理解——增加结构是控制复杂性的主要方法。将代码结构化为函数，可以开发出使用这些函数的更简洁的代码。本章介绍函数，并讲解重构过程，这是管理任何复杂程度代码所必需的关键技能。\n\
  \n## 组织你的文件\n\n首先，我们将以更传统的方式组织 HTML 文档。在第 1 章中，我们只是将样式信息包含在`<style>`元素中。为了去除杂乱并使样式可重用，我们将把样式移动到一个单独的文件中。创建一个名为`exercise2.html`的文件，并从清单\
  \ 2-1 所示的基本模板开始。\n\n```\n<!doctype html>\n<html>\n  <head>\n    <title>在画布上绘制更多图形</title>\n\
  \    <link rel=\"stylesheet\" href=\"styles.css\">\n  </head>\n  <body>\n    <h1>在画布上绘制更多图形</h1>\n\
  \    <canvas id=\"asteroids\" width=\"400\" height=\"400\"></canvas>\n    <script>\n\
  \      var canvas = document.getElementById(\"asteroids\");\n      var context =\
  \ canvas.getContext(\"2d\");\n      // 网格绘制代码写在这里\n    </script>\n  </body>\n</html>\n\
  ```\n\n*清单 2-1 一个基本模板*\n\n我们添加了一个指向名为`styles.css`的外部样式表的`<link>`元素。创建`styles.css`文件，并添加清单\
  \ 2-2 中的规则。两个文件应保存在同一文件夹中。通常，最好有一个专门存放这两个文件的文件夹。\n\n```\nbody {\n  text-align: center;\n\
  \  font-family: sans-serif;\n}\ncanvas {\n  background-color: black;\n}\n```\n\n\
  *清单 2-2 一个标准样式表*\n\n在浏览器中加载`exercise2.html`。我们有一个空白画布，所以让我们在上面画点东西。\n\n## 画布网格系统\n\
  \n\n\n我们在第 1 章中看到，`canvas` 拥有一个坐标系。原点 `(0, 0)` 位于左上角。`canvas` 的宽度为 `canvas.width`\
  \ 像素，高度为 `canvas.height` 像素。让我们通过绘制一个网格来让这些坐标可视化。首先，设置描边颜色和线宽。在 `<script>` 标签中，注释\
  \ `\"Grid drawing code goes here\"` 之后添加以下代码行：  \n`context.strokeStyle = \"#00FF00\"\
  ;`  \n`context.lineWidth = 0.25;`\n\n现在，我们使用 `for` 循环以 10 像素为步长，将 `x` 坐标从 0 递增到画布宽度，并在每次迭代中绘制垂直网格线。在循环中，我们将当前路径位置移动到画布顶部（对应\
  \ x 坐标处），并画一条直线直达画布底部。保持 `x` 坐标在 `context.moveTo` 和 `context.lineTo` 调用之间不变，确保每次都能得到一条垂直线：\n\
  \n```\nfor(var x = 0; x < canvas.width; x += 10) {\n  context.moveTo(x, 0);\n  context.lineTo(x,\
  \ canvas.height);\n}\n```\n\n如果你刷新页面，什么也不会绘制。因为我们仍然只是在构建路径，还没有要求将其绘制出来。对水平网格线重复相同的模式：\n\
  \n```\nfor(var y = 0; y < canvas.height; y += 10) {\n  context.moveTo(0, y);\n \
  \ context.lineTo(canvas.width, y);\n}\n```\n\n同样，我们依次从画布左侧（`x = 0`）到右侧（`x = canvas.width`）绘制每条水平线。`y`\
  \ 坐标从 0 开始，每次迭代增加 10 像素，直到达到 `canvas.height`。实际上，直到我们调用 `context.stroke()` 时，才会在画布上绘制任何内容：\n\
  \n```\ncontext.stroke();\n```\n\n然后，这将把路径绘制到画布上，如图 2-1 所示。\n\n![A455241_1_En_2_Fig1_HTML.jpg](img/A455241_1_En_2_Fig1_HTML.jpg)\n\
  **图 2-1** 基本网格图案\n\n我们希望有一个主/辅网格系统，以便轻松定位坐标。为此，需要每第五条线更粗一些。但按照当前的做法，我们无法控制线宽。我们在代码末尾调用的\
  \ `context.stroke` 方法会将当前的描边样式和线宽应用于整个当前路径。这意味着所有线条都将具有相同的宽度。如果我们希望给它们不同的宽度，就需要将绘制分成多个路径，每个路径对应一条线。为此，我们需要在循环内同时调用\
  \ `context.beginPath` 和 `context.stroke`。注意不要删除任何初始模板代码，将网格绘制代码（注释 `\"Grid drawing\
  \ code goes here\"` 之后的所有内容）替换为清单 2-3 中的代码。\n\n```\ncontext.strokeStyle = \"#00FF00\"\
  ;\nfor(var x = 0; x < canvas.width; x += 10) {\n  context.beginPath();\n  context.moveTo(x,\
  \ 0);\n  context.lineTo(x, canvas.height);\n  context.lineWidth = (x % 50 == 0)\
  \ ? 0.5 : 0.25;\n  context.stroke();\n}\nfor(var y = 0; y < canvas.height; y +=\
  \ 10) {\n  context.beginPath();\n  context.moveTo(0, y);\n  context.lineTo(canvas.width,\
  \ y);\n  context.lineWidth = (y % 50 == 0) ? 0.5 : 0.25;\n  context.stroke();\n\
  }\n```\n**清单 2-3** 改变线宽\n\n现在，在每个循环中，我们都调用 `context.beginPath` 来启动一个新路径并丢弃所有之前的路径数据。我们像之前一样绘制线条，然后使用三元运算符设置线宽。三元运算符是一种紧凑的单行\
  \ `if` 语句，形式为 `result = boolean ? value_if_true : value_if_false`。这里我们设置线宽，所以如果当前的\
  \ `x` 或 `y` 坐标能被 50 整除（通过取模运算符 `x % 50 == 0` 确定），我们就使线条更粗一些。最后，我们在循环内调用 `context.stroke`，依次绘制每条线。生成的网格如图\
  \ 2-2 所示。\n\n![A455241_1_En_2_Fig2_HTML.gif](img/A455241_1_En_2_Fig2_HTML.gif)\n\
  **图 2-2** 主/辅网格线\n\n为了完成我们的画布坐标纸，还需要一些轴线。因为我们不能在画布外绘制，所以要在边缘处挤一些标签。首先，需要设置填充颜色，以便使用\
  \ `canvas.fillText`。在脚本中，循环上方添加以下代码行：\n\n`context.fillStyle = \"#009900\";`\n\n\
  现在，在每个循环中，我们将在主（较粗）网格线旁边绘制一个标签。在 `x` 坐标循环的末尾添加这一行：\n\n`if(x % 50 == 0 ) {context.fillText(x,\
  \ x, 10);}`\n\n类似地，在 `y` 坐标循环的末尾添加等效的代码行：\n\n`if(y % 50 == 0 ) {context.fillText(y,\
  \ 0, y + 10);}`\n\n结果如图 2-3 所示。\n\n![A455241_1_En_2_Fig3_HTML.jpg](img/A455241_1_En_2_Fig3_HTML.jpg)\n\
  **图 2-3** 主网格标签\n\n现在，坐标系的工作原理应该非常清晰了。每条较粗的线旁边都绘制了一个坐标值。原点明显位于左上角，我们已准备好在这个网格之上进行绘制。\n\
  \n## 及早重构，频繁重构\n\n\n\n现在我们有了一个潜在有用的功能模块（一个显示坐标的网格），就应该立即考虑如何使其可复用。与其将原始代码复制到每个脚本中，不如将代码重构为一个函数，并将其放入代码库（一个独立的\
  \ JavaScript 文件）中。一旦将函数放入库中，我们只需在 HTML 文档中引入该库，然后调用该函数即可。任何可以简化为可复用函数的代码，都是放入库中的候选对象。一个好的经验法则是：加载一个库除了定义函数之外，不应产生任何副作用。通常情况下，库中包含相关的功能集合。\n\
  \n在这个例子中，让我们创建一个名为 `drawing.js` 的空文件，并在 HTML 的 `<head>` 元素中添加对该文件的链接。你的 `<head>`\
  \ 元素现在看起来应该是这样的：\n\n```html\n<head>\n  <title>更多 Canvas 绘图</title>\n  <link rel=\"\
  stylesheet\" href=\"styles.css\">\n  <script src=\"drawing.js\"></script>\n</head>\n\
  ```\n\n现在，让我们将网格代码转换成一个便捷的函数，并将其放入 `drawing.js` 库中，如清单 2-4 所示。\n\n```javascript\n\
  function draw_grid(ctx, minor, major, stroke, fill) {\n  minor = minor || 10;\n\
  \  major = major || minor * 5;\n  stroke = stroke || \"#00FF00\";\n  fill = fill\
  \ || \"#009900\";\n  ctx.save();\n  ctx.strokeStyle = stroke;\n  ctx.fillStyle =\
  \ fill;\n  let width = ctx.canvas.width, height = ctx.canvas.height\n  for(var x\
  \ = 0; x < width; x += minor) {\n    ctx.beginPath();\n    ctx.moveTo(x, 0);\n \
  \   ctx.lineTo(x, height);\n    ctx.lineWidth = (x % major == 0) ? 0.5 : 0.25;\n\
  \    ctx.stroke();\n    if(x % major == 0 ) {ctx.fillText(x, x, 10);}\n  }\n  for(var\
  \ y = 0; y < height; y += minor) {\n    ctx.beginPath();\n    ctx.moveTo(0, y);\n\
  \    ctx.lineTo(width, y);\n    ctx.lineWidth = (y % major == 0) ? 0.5 : 0.25;\n\
  \    ctx.stroke();\n    if(y % major == 0 ) {ctx.fillText(y, 0, y + 10);}\n  }\n\
  \  ctx.restore();\n}\n```\n\n**清单 2-4** `draw_grid` 函数\n\n我们在这里并没有做太多改动，但结果却是一个健壮的库函数。我们的函数名为\
  \ `draw_grid`，它接受五个参数。第一个参数 `ctx` 是 Canvas 上下文，这允许我们使用该函数，在合适的上下文中绘制到任何 Canvas 上。为了获取\
  \ Canvas 的高度和宽度，我们将 Canvas 对象作为 `ctx` 参数的一个属性来访问。为了提高效率，我们将宽度和高度存储为变量。第二和第三个参数分别是次要距离和主要距离。第四和第五个参数分别是描边颜色和填充颜色。\n\
  \n我们还在绘图代码的开头添加了对 `context.save()` 的调用，并在结尾添加了对 `context.restore()` 的调用。它们会保存和恢复\
  \ Canvas 的状态，例如 `context.lineWidth`、`context.strokeStyle` 和 `context.fillStyle`。以这种方式使用它们，可以确保函数执行完毕后，Canvas\
  \ 恢复到其原始状态。在编写绘图代码时，这是一个好习惯。它可以避免副作用，并允许调用代码保持对 Canvas 上下文的控制。\n\n请注意，我们已尽力使该函数尽可能通用。除了希望使用提供的上下文绘制网格之外，它对客户端代码没有任何假设。我们可以使用这个函数在许多不同的\
  \ Canvas 上绘制许多不同的网格。函数的哪些方面应该是可配置的，取决于具体情况。提供灵活性（多个参数）必须与简化接口（减少参数）的好处相平衡。默认参数是一种很好的折衷方案。\n\
  \n在这个例子中，我们通过将 `minor` 默认设置为 10，将 `major` 设置为 `minor` 值的 5 倍来提供默认值。我们还为颜色设置了默认值。这些默认值仅在未提供值时使用，这是通过或运算符\
  \ (`||`) 实现的。`minor` 的值被设置为其自身或默认值，这仅在 `minor` 的值计算结果为 `false` 时适用（`undefined` 值就会如此）。值得注意的是，这种语法有其缺陷。例如，如果调用代码试图将默认参数设置为\
  \ `0` 或其他计算结果为 `false` 的值，则该值将被忽略，并使用默认值。\n\n将这个新的 `draw_grid` 函数移入我们的 `drawing.js`\
  \ 库中，会使我们的主脚本缩短很多。我们可以从 HTML 文档中移除所有网格绘制代码，并用一行代码替换：\n\n```javascript\ndraw_grid(context);\n\
  ```\n\n我们现在可以轻松地创建自定义网格。尝试试验这些参数：\n\n```javascript\n// 试试这个进行对比\ndraw_grid(context,\
  \ 15, 45, 'red', 'yellow');\n// 或者试试这个\ndraw_grid(context, 5, 30, 'white', 'red');\n\
  ```\n\n## 使用路径进行绘图\n\n\n\n在 Canvas 上绘图需要理解路径的概念。正如我们之前所见，可以通过依次调用多个绘制方法来构建路径。一旦路径被指定，我们可以调用\
  \ `context.fill`，使用当前的 `context.fillStyle` 填充封闭区域；或者调用 `context.stroke`，使用当前的 `context.strokeStyle`\
  \ 和 `context.lineWidth` 以线条形式绘制路径。\n\n我们还了解到，路径不必是连续的；可以通过调用 `context.moveTo` 来中断路径。当从一个路径切换到另一个路径时，需要调用\
  \ `context.beginPath` 以丢弃旧的路径数据并开始一个新的路径。\n\n让我们在我们新的网格上绘制一些线条，以确认我们理解了坐标系统。在调用\
  \ `draw_grid` 之后，添加清单 2-5 中的内容。\n\n```\ncontext.beginPath();\ncontext.strokeStyle\
  \ = \"#FFFFFF\";\ncontext.fillStyle = \"#00FF00\";\ncontext.lineWidth = 2;\ncontext.moveTo(50,\
  \ 50);\ncontext.lineTo(150, 250);\ncontext.lineTo(250, 170);\ncontext.stroke();\n\
  context.fillText(\"(50, 50)\", 30, 40);\ncontext.fillText(\"(150, 250)\", 130, 260);\n\
  context.fillText(\"(250, 170)\", 255, 175);\n```\n\n**清单 2-5 一些线条**\n\n代码绘制了两条白线。当绘制第一条线时，我们指定从点\
  \ `(50, 50)` 开始，并画一条线到 `(150, 250)`。我们绘制第二条线时未指定起始位置，这条线是作为路径的延续而绘制的。然后我们绘制了点的坐标，以便清晰地看到当前情况。图\
  \ 2-4 展示了结果。请注意，坐标可以从网格标签中读取。\n\n![A455241_1_En_2_Fig4_HTML.jpg](img/A455241_1_En_2_Fig4_HTML.jpg)\n\
  \n**图 2-4 线条默认是连接的**\n\n现在，我们知道刚刚定义的路径（由两条直线组成）仍然存在于内存中。如果我们添加对 `context.fill` 的调用，应该能够填充该形状。但当形状没有完全封闭时会发生什么呢？在你的脚本末尾添加以下代码行来找出答案：\n\
  \n```\ncontext.fill();\n```\n\n图 2-5 展示了结果。\n\n![A455241_1_En_2_Fig5_HTML.jpg](img/A455241_1_En_2_Fig5_HTML.jpg)\n\
  \n**图 2-5 填充路径时，如有必要，会添加一条直线**\n\n路径会以从路径起点到终点的最短可能路径进行填充。如果我们向脚本中添加一个新的 `context.lineTo`，我们将填充一个不同的形状。我们甚至可以填充线条交叉的形状。在适当的位置（在描边线条之前）添加以下代码行：\n\
  \n```\ncontext.lineTo(320, 280);\n```\n\n图 2-6 展示了结果。\n\n![A455241_1_En_2_Fig6_HTML.jpg](img/A455241_1_En_2_Fig6_HTML.jpg)\n\
  \n**图 2-6 向路径添加一条线**\n\n在不填充的情况下，路径会扩展出一个新的点。图 2-7 显示，如果我们添加 `context.fill` 命令，该形状将再次以一条直线进行填充。\n\
  \n![A455241_1_En_2_Fig7_HTML.jpg](img/A455241_1_En_2_Fig7_HTML.jpg)\n\n**图 2-7 在线条交叉时进行填充**\n\
  \n我们也可以使用 `context.closePath` 以编程方式闭合路径。这将在当前路径位置到最近的开放端点之间添加一条直线。移除对 `context.fill`\
  \ 的调用，并在最后一次调用 `context.stroke` 之前添加对 `context.closePath` 的调用。图 2-8 展示了结果。\n\n![A455241_1_En_2_Fig8_HTML.jpg](img/A455241_1_En_2_Fig8_HTML.jpg)\n\
  \n**图 2-8 闭合路径**\n\n我们看到，在最初绘制网格线时，路径可以被中断。通过调用 `context.moveTo`，我们可以有效地“拾起”“笔”并将其移动到另一个位置。通过结合使用\
  \ `context.closePath`，我们可以快速且轻松地一起绘制多个闭合形状。在你的脚本末尾添加清单 2-6 中的代码。\n\n```\ncontext.beginPath()\n\
  context.moveTo(50, 250);\ncontext.lineTo(50, 350);\ncontext.lineTo(150, 350);\n\
  context.closePath();\ncontext.moveTo(230, 360);\ncontext.lineTo(270, 360);\ncontext.lineTo(270,\
  \ 310);\ncontext.closePath();\ncontext.moveTo(250, 50);\ncontext.lineTo(370, 50);\n\
  context.lineTo(370, 100);\ncontext.closePath();\ncontext.strokeStyle = \"#FFFF00\"\
  ;\ncontext.fillStyle = \"#000000\";\ncontext.fill();\ncontext.stroke();\n```\n\n\
  **清单 2-6 闭合形状**\n\n研究这段代码，看看会发生什么。图 2-9 展示了结果。每次我们调用 `context.moveTo` 时，都是在设置路径的当前原点。这是\
  \ `context.closePath` 将返回的位置。这允许我们只调用一次 `context.fill` 和 `context.stroke` 来绘制多个填充的、闭合的形状。另请注意，我们在定义路径之后才设置了绘制样式。它们可以在调用\
  \ `context.fill` 和 `context.stroke` 之前的任何时间设置。\n\n![A455241_1_En_2_Fig9_HTML.jpg](img/A455241_1_En_2_Fig9_HTML.jpg)\n\
  \n**图 2-9 填充、闭合、中断的路径**\n\n\n\n## 为路径添加曲线\n\n除了使用 `context.lineTo`，还有多种方式可以为路径添加内容。想要绘制曲线而非直线，一个简单的方法是使用替代方法\
  \ `context.quadraticCurveTo`。它与 `context.lineTo` 非常相似，但除了终点坐标外，还需要一个控制点的坐标。线条会向控制点方向弯曲。请用清单\
  \ 2-7 中的代码替换上一段路径的构建代码。\n\n```\ncontext.beginPath()\ncontext.moveTo(50, 250);\n\
  context.quadraticCurveTo(25, 300, 50, 350);\ncontext.quadraticCurveTo(100, 375,\
  \ 150, 350);\ncontext.closePath();\ncontext.moveTo(230, 360);\ncontext.quadraticCurveTo(255,\
  \ 340, 270, 360);\ncontext.quadraticCurveTo(255, 340, 270, 310);\ncontext.closePath();\n\
  context.moveTo(250, 50);\ncontext.quadraticCurveTo(310, 60, 370, 50);\ncontext.quadraticCurveTo(400,\
  \ 75, 370, 100);\ncontext.closePath();\ncontext.strokeStyle = \"#FFFF00\";\ncontext.fillStyle\
  \ = \"#000000\";\ncontext.fill();\ncontext.stroke();\n```\n\n**清单 2-7** 添加曲线\n\n\
  现在，填充的形状由曲线构成，如图 2-10 所示。\n\n![A455241_1_En_2_Fig10_HTML.jpg](img/A455241_1_En_2_Fig10_HTML.jpg)\n\
  \n**图 2-10** 二次曲线\n\n为了获得更多控制，我们可以使用贝塞尔曲线进行绘制。将网格绘制代码后的前三次 `context.lineTo` 调用替换为\
  \ `context.bezierCurveTo`，即可用贝塞尔曲线重新绘制白色路径，如清单 2-8 所示。\n\n```\n<script>\n  var canvas\
  \ = document.getElementById(\"asteroids\");\n  var context = canvas.getContext(\"\
  2d\");\n  draw_grid(context)\n  context.beginPath();\n  context.strokeStyle = \"\
  #FFFFFF\";\n  context.fillStyle = \"#00FF00\";\n  context.lineWidth = 2;\n  context.moveTo(50,\
  \ 50);\n  context.bezierCurveTo(0, 0, 80, 250, 150, 250);\n  context.bezierCurveTo(250,\
  \ 250, 250, 250, 250, 170);\n  context.bezierCurveTo(250, 50, 400, 350, 320, 280);\n\
  \  context.closePath();\n  // context.fill();\n  context.stroke();\n  context.fillText(\"\
  (50, 50)\", 30, 40);\n  context.fillText(\"(150, 250)\", 130, 260);\n  context.fillText(\"\
  (250, 170)\", 255, 175);\n  context.beginPath()\n  context.moveTo(50, 250);\n  context.quadraticCurveTo(25,\
  \ 300, 50, 350);\n  context.quadraticCurveTo(100, 375, 150, 350);\n  context.closePath();\n\
  \  context.moveTo(230, 360);\n  context.quadraticCurveTo(255, 340, 270, 360);\n\
  \  context.quadraticCurveTo(255, 340, 270, 310);\n  context.closePath();\n  context.moveTo(250,\
  \ 50);\n  context.quadraticCurveTo(310, 160, 370, 50);\n  context.quadraticCurveTo(400,\
  \ 75, 370, 100);\n  context.closePath();\n  context.strokeStyle = \"#FFFF00\";\n\
  \  context.fillStyle = \"#000000\";\n  context.fill();\n  context.stroke();\n</script>\n\
  ```\n\n**清单 2-8** 贝塞尔曲线\n\n贝塞尔曲线需要两个控制点坐标和终点坐标。生成的路径是一条经过每个指定终点的曲线。图 2-11 展示了最终结果。贝塞尔曲线能用相对简单的路径实现平滑的弯曲和转向。\n\
  \n![A455241_1_En_2_Fig11_HTML.jpg](img/A455241_1_En_2_Fig11_HTML.jpg)\n\n**图 2-11**\
  \ 贝塞尔曲线\n\n## 本章小结\n\n在本章中，我们更深入地了解了 Canvas 接口的运作方式。我们学习了坐标系的工作原理，并详细探讨了路径的创建和修改方法。我们研究了在点之间绘制线条的各种方式。这些都是在\
  \ Canvas 上绘图时手头的基本工具。我还介绍了 JavaScript 函数，并提出了“尽早重构，频繁重构”的代码组织方法。本章继续教授了一些基础知识，并演示了这一切是如何运作的。第\
  \ 3 章将应用你学到的知识来创建一幅更有目的性的画作，并再次探讨函数。\n\n© Graeme Stuart 2017  \nGraeme Stuart, 《JavaScript\
  \ 游戏开发入门》  \n`doi.org/10.1007/978-1-4842-3252-1_3`\n\n"
- "# 3. 按设计绘图\n\nGraeme Stuart¹  \n(1) 英国莱斯特郡马基特哈伯勒\n\n在第 2 章中，我们在画布上随意涂鸦，弄得有些凌乱。这次，我们将尝试渲染一个熟悉的设计。本章将要学习的技能是前几章所学内容的延伸，不过在本章中，我们将在每一步操作中展示更明确的意图。如果本章有一个核心信息，那就是：勤加练习，对每一步都充满信心，同时慢慢增加复杂性。到目前为止，我们学到的内容虽然相当简单，但都是基础技能。重复练习并逐步增加一点复杂性，是巩固和拓展所学知识的有效方法。让我们从头开始整个过程，但把上一章的工具库代码带过来。请尝试按照以下说明操作，在需要之前不要向前查看代码示例：\n\
  \n1.  创建一个名为 `exercise3` 的新文件夹，并将第 2 章的 `drawing.js` 文件复制到该文件夹中。\n2.  创建一个名为 `exercise3.html`\
  \ 的新文件，并设置一个标准的 HTML 模板。\n3.  在 `<head>` 元素中添加对 `drawing.js` 工具库的引用。\n4.  在 `<body>`\
  \ 元素中添加一个 `<canvas>` 元素用于显示场景。\n5.  添加一个包含必要 JavaScript 代码的 `<script>` 元素，以创建对 Canvas\
  \ 上下文的引用，并通过调用 `draw_grid` 函数在画布上绘制一个空白网格，该函数应通过引用工具库代码而可用。\n\n\n\n## 吃豆人\n\n大家对\
  \ 1980 年南梦宫经典游戏《吃豆人》应该都不陌生。这位同名主角画起来相当简单——就是一个被切掉一块楔形的黄色实心圆。我们可以通过绘制一条弧线、再画一条连接到弧线圆心的直线，然后填充路径（路径会自动闭合）来画出它。\n\
  \n唯一的难点在于选择起始角和终止角。想象一支从圆心出发、指向右侧的箭头。这就是零角度（零弧度）。增大角度会让我们箭头顺时针方向旋转。`π`弧度的角度是半圆，指向左侧。`2π`弧度的角度是完整的一圈，箭头重新指向右侧。如图\
  \ 3-1 所示。\n\n![A455241_1_En_3_Fig1_HTML.jpg](img/A455241_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1 一个圆内有 `2π` 弧度（顺时针方向）\n\n要让我们的吃豆人面向右侧，需要让弧线从超过 0（零）的某个弧度数开始，并在距离 `2π` 同样角度处结束。张开嘴的总角度大概略小于四分之一圈（小于\
  \ `0.5π` 弧度），所以我们选择从 `0.2π` 弧度（稍微指向右下方）开始，到 `1.8π` 弧度（稍微指向右上方）结束。请按清单 3-1 所示更新你的代码。\n\
  \n```html\n<!doctype html>\n<html>\n  <head>\n    <title>Pacmania</title>\n    <link\
  \ rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"></script>\n\
  \  </head>\n  <body>\n    <h1>Pac-man</h1>\n    <canvas id=\"pacmania\" width=\"\
  400\" height=\"400\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
  pacmania\").getContext(\"2d\");\n      draw_grid(context);\n      context.beginPath();\n\
  \      context.arc(200, 200, 150, 0.2 * Math.PI, 1.8 * Math.PI);\n      context.lineTo(200,\
  \ 200);\n      context.fillStyle = \"yellow\";\n      context.fill();\n    </script>\n\
  \  </body>\n</html>\n```\n\n清单 3-1 一个简单的吃豆人\n\n这段代码除了几行新内容外应该都很熟悉。我们使用了 `context.arc`\
  \ 方法来绘制一条半径为 150 像素的弧线，圆心位于点 `(200, 200)`，从 `0.2π` 弧度开始，沿顺时针方向一直延伸到 `1.8π` 弧度。为了切出楔形部分，我们画了一条线连接到圆心。然后我们将填充样式设为黄色并填充路径——结果如图\
  \ 3-2 所示。`context.arc` 方法还可以接受一个可选的最终布尔参数，用于指定逆时针方向绘制。这在较复杂的路径中使用弧线时会很方便。\n\n![A455241_1_En_3_Fig2_HTML.jpg](img/A455241_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2 吃豆人就是一个被切掉一块楔形的圆\n\n## 创建函数\n\n但是吃豆人要吃小圆点，为此它需要在移动的过程中张开和闭合嘴巴，所以我们需要能够画出带有不同大小楔形切口的吃豆人。将你的代码重构为一个绘制吃豆人的函数，并将你的\
  \ `draw_pacman` 函数移到 `drawing.js` 库中。\n\n你的函数需要接受四个参数。前两个参数是 `x` 和 `y` 坐标。第三个参数是半径。第四个参数是一个介于\
  \ 0 和 1 之间的值，表示嘴巴从完全闭合（0）到完全张开（1）的“张开”程度。另外，为了让你的吃豆人能画在较浅色的背景上，请在你的函数中调用 `context.closePath`\
  \ 和 `context.stroke` 来为吃豆人绘制黑色轮廓。这是一个创建你自己函数的机会。\n\n## 随机化\n\n调用 `Math` 对象的 `random`\
  \ 方法（即调用 `Math.random()`）会生成一个介于 0 和 1 之间的随机数。一旦你有了自己的函数，就用一行代码替换掉旧的吃豆人绘制代码，通过你的函数来绘制一个随机化的吃豆人，如下所示：\n\
  \n```\ndraw_pacman(context, 200, 200, 150, Math.random());\n```\n\n刷新页面几次，看看随机化的嘴巴角度。我们使用\
  \ `Math.random` 来生成一个 0 到 1 之间的随机数。当我们定义函数时，我们指定嘴巴角度可以作为这个范围内的一个参数传入。因此，只要函数正确绘制了吃豆人，我们就应该能绘制出一个嘴巴角度随机化的吃豆人。\n\
  \n在另一种实现中，我们可以让随机数乘以 `0.2π`，以创建在零（0）两侧用于绘制嘴巴的角度。这样每次浏览器重新加载时，都会生成一个新的随机数，并以新的嘴巴角度调用绘图函数。请慢慢来，在继续之前确保你理解了正在做的事情。一旦掌握了窍门，这些东西就很简单了。\n\
  \n现在我们有了一个函数，可以用它在画布上到处绘制吃豆人。尝试一个简单的循环来绘制一些随机的东西。这里我们使用一个 `do while` 循环来绘制随机的吃豆人，直到生成的随机数大于\
  \ `0.9`。`do while` 循环至少会执行一次，所以我们总能至少看到一个吃豆人。当随机数大于 `0.9` 时，循环结束。参见清单 3-2。\n\n```javascript\n\
  var min_radius = 5;\nvar max_radius = 50;\ndo {\n  let x = context.canvas.width\
  \ * Math.random();\n  let y = context.canvas.height * Math.random();\n  let radius\
  \ = min_radius + (max_radius - min_radius) * Math.random();\n  draw_pacman(context,\
  \ x, y, radius, Math.random());\n} while(Math.random() < 0.9);\n```\n\n清单 3-2 在循环中随机化\n\
  \n很明显，我们对坐标、半径以及嘴巴角度都进行了随机化。请注意，为了提高可读性，我们定义了一些变量（`min_radius`、`max_radius`、`x`、`y`\
  \ 和 `radius`）。这些语句本可以直接作为参数传入函数，就像我们对嘴巴参数所做的那样。将代码拆分成简单的语句可以提高清晰度，并使得代码能够适应屏幕显示。\n\
  \n图 3-3 显示了你应该看到的结果。最终的画布就是吃豆人狂热。请注意我们添加到图形上的黑色轮廓是如何帮助我们区分重叠的吃豆人的。\n\n![A455241_1_En_3_Fig3_HTML.jpg](img/A455241_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3 多个随机位置的吃豆人\n\n## 总结\n\n在本章中，我们通过一个简单但熟悉的例子回顾了路径和函数。请注意，我们最终在脚本中只用了很少的代码，但由于我们使用函数抽象掉了实际单个绘图任务的细节，它却完成了相当复杂的绘图。我还介绍了随机化和循环——这些是重要的概念，我们将在以后大量使用。\n\
  \n尝试对我们所做的内容进行实验。选取另一个你熟悉的形状来绘制。创建一个函数并决定应该提供哪些参数。在循环中将输入随机化，以创建你自己的复杂场景。\n\n© Graeme\
  \ Stuart 2017\n\nGraeme Stuart, 介绍 JavaScript 游戏开发, [`doi.org/10.1007/978-1-4842-3252-1_4`](https://doi.org/10.1007/978-1-4842-3252-1_4)\n\
  \n"
- "# 4. 绘制宇宙飞船\n\nGraeme Stuart¹\n\n(1) 英国莱斯特郡马基特哈伯勒\n\n好的，让我们更认真一点，开始着手处理我们的游戏元素。经典和现代版《爆破彗星》游戏中的宇宙飞船都是基于一个简单的等腰三角形。在本章中，我们将绘制宇宙飞船，并使用二次曲线来定制我们的飞船设计。\n\
  \n我们希望我们的飞船能近似于一个具有给定半径的圆，因为稍后我们将使用“圆对圆”碰撞检测。因此，我们需要定位圆边缘上的点。使用角度和距离（极坐标）是指定我们想要点的明显方法，但要绘制到画布上，我们需要使用\
  \ `x` 和 `y` 值（笛卡尔坐标）。我们需要解决这个问题。\n\n\n\n## 基础三角学\n\n三角学将在本书中出现多次，因此现在理清概念是个好主意。我们将使用一个非常简单的子集，它使我们能够根据角度和距离计算\
  \ x 和 y 坐标。图 4-1 展示了基本原理。直角三角形最长的边是圆心与圆周上一点之间的直线。如果我们改变角度，这将以可预测的方式影响 x 和 y 坐标。![A455241_1_En_4_Fig1_HTML.jpg](img/A455241_1_En_4_Fig1_HTML.jpg)\
  \ 图 4-1 角度 θ 的正弦和余弦\n\n基本上，你现在只需要知道，正弦和余弦函数可以根据距离（半径）和方向（角度）计算出 (x, y) 坐标。在 JavaScript\
  \ 中，`Math` 对象有两个对应的方法：`Math.sin(θ)` 和 `Math.cos(θ)`。利用它们，我们可以计算任意给定角度 θ 相对于圆心的 x\
  \ 和 y 坐标。要将角度和距离转换为 x 和 y 坐标，只需将这些值乘以所需的距离（圆的半径）。在我们的图中，蓝色虚线表示 y 坐标的值，计算公式为 `r ×\
  \ Math.sin(θ)`。红色虚线表示 x 坐标的值，计算公式为 `r × Math.cos(θ)`。\n\n## 基础飞船\n\n让我们实践一下。我们将使用一个函数，在画布上以特定位置和特定半径绘制一艘飞船。请记住，我们希望飞船尽可能完美地填充一个圆形。首先，创建一个名为\
  \ `exercise4` 的新文件夹，复制样式表（`styles.css`）和 `drawing.js` 库，并添加一个新文件 `exercise4.html`，其中包含代码清单\
  \ 4-1 中的代码。\n\n```\n<!doctype html>\n<html>\n  <head>\n    <title>绘制一艘太空飞船</title>\n\
  \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
  ></script>\n  </head>\n  <body>\n    <h1>绘制一艘太空飞船</h1>\n    <canvas id=\"asteroids\"\
  \ width=\"400\" height=\"400\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
  asteroids\").getContext(\"2d\");\n      draw_grid(context);\n      draw_ship(context,\
  \ 200, 200, 150, {guide: true});\n    </script>\n  </body>\n</html>\n```\n\n代码清单\
  \ 4-1 绘制飞船的模板\n\n该模板加载了样式表和库，并包含一个简单的三行脚本。脚本创建了对上下文的引用，绘制了网格，然后通过调用新的 `draw_ship`\
  \ 函数并传入一些参数来绘制我们的飞船。第一个参数是上下文，第二个和第三个是 x 和 y 坐标，第四个是包含飞船的圆的半径。最后一个参数略有不同——它包含一个对象，我们稍后会讨论它。\n\
  \n我们的第一个版本的 `draw_ship` 函数如代码清单 4-2 所示。将其添加到 `drawing.js` 库中。\n\n```\nfunction draw_ship(ctx,\
  \ x, y, radius, options) {\n  options = options || {};\n  ctx.save();\n  // 可选地绘制一个显示碰撞半径的引导线\n\
  \  if(options.guide) {\n    ctx.strokeStyle = \"white\";\n    ctx.fillStyle = \"\
  rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth = 0.5;\n    ctx.beginPath();\n    ctx.arc(x,\
  \ y, radius, 0, 2 * Math.PI);\n    ctx.stroke();\n    ctx.fill();\n  }\n  // 设置一些默认值\n\
  \  ctx.lineWidth = options.lineWidth || 2;\n  ctx.strokeStyle = options.stroke ||\
  \ \"white\";\n  ctx.fillStyle = options.fill || \"black\";\n  let angle = (options.angle\
  \ || 0.5 * Math.PI) / 2;\n  // 用三条线绘制飞船\n  ctx.beginPath();\n  ctx.moveTo(x + radius,\
  \ y);\n  ctx.lineTo(\n    x + Math.cos(Math.PI - angle) * radius,\n    y + Math.sin(Math.PI\
  \ - angle) * radius\n  );\n  ctx.lineTo(\n    x + Math.cos(Math.PI + angle) * radius,\n\
  \    y + Math.sin(Math.PI + angle) * radius\n  );\n  ctx.closePath();\n  ctx.fill();\n\
  \  ctx.stroke();\n  ctx.restore();\n}\n```\n\n代码清单 4-2 绘制基础飞船\n\n结果是一艘基础飞船。在浏览器中加载该模板，你应该会看到类似图\
  \ 4-2 的内容。![A455241_1_En_4_Fig2_HTML.jpg](img/A455241_1_En_4_Fig2_HTML.jpg) 图 4-2\
  \ 一个简单的三角形飞船\n\n该函数的核心使用 `context.moveTo` 和 `context.lineTo` 绘制三条线构成一个三角形。它设置了上下文的一些参数，然后填充形状并描边轮廓。但除此之外，它还做了很多事情。这里有一些新东西需要解释。\n\
  \n## 使用对象字面量\n\n注意，我们定义了一个第五个参数：`options`。这是一个可选参数；我们可以看出这一点，因为如果它未定义，则会被设置为一个空对象（`{}`）。`options`\
  \ 参数允许设置飞船的多个可选属性。这些选项使用点号表示法引用，例如 `options.stroke` 或 `options.fill`。如果它们未定义，则会提供默认值。\n\
  \n> **注意** 对象非常有用，将在后面的章节中广泛使用。这里我介绍对象字面量 `{}`，它用作简单的键：值存储。对象字面量被指定为包含多个键：值对的花括号，用逗号分隔。键可以是任何能转换为有效\
  \ JavaScript 字符串的内容。值可以是任何内容。空对象被指定为一对花括号（`{}`）。\n\n更新你的 `exercise4.html` 文件，使用设置了不同选项的\
  \ `draw_ship` 函数，如代码清单 4-3 所示。\n\n```\n<script>\n  var context = document.getElementById(\"\
  asteroids\").getContext(\"2d\");\n  draw_grid(context);\n  draw_ship(context, 200,\
  \ 200, 125, {guide: true});\n  draw_ship(context, 75, 75, 50, {stroke: 'gold', fill:\
  \ 'purple'});\n  draw_ship(context, 325, 325, 50, {angle: 0.8 * Math.PI, guide:\
  \ true});\n  draw_ship(context, 75, 325, 50, {angle: 0.3 * Math.PI, guide: true});\n\
  \  draw_ship(context, 325, 75, 50, {lineWidth: 8, fill: 'blue'});\n</script>\n```\n\
  \n代码清单 4-3 设置飞船选项\n\n结果如图 4-3 所示。注意，我们可以创建一个具有简单接口的函数，并且通过允许默认值，也可以实现更详细的接口。![A455241_1_En_4_Fig3_HTML.jpg](img/A455241_1_En_4_Fig3_HTML.jpg)\
  \ 图 4-3 许多飞船\n\n飞船的三个角位于圆的半径上。飞船的前部位于 `(x + radius, y)`，即圆的右侧。飞船的后角由飞船机头的角度决定。角度变量由这行代码设置：`let\
  \ angle = (options.angle || 0.5 * Math.PI) / 2;` 它默认为 `0.5π / 2`。一个完整的圆有 `2π` 弧度，因此\
  \ `0.25π` 弧度是 45 度（一个圆的八分之一）。\n\n飞船的后角由以下代码绘制：\n\n```\nctx.lineTo(\n  x + Math.cos(Math.PI\
  \ - angle) * radius,\n  y + Math.sin(Math.PI - angle) * radius\n);\nctx.lineTo(\n\
  \  x + Math.cos(Math.PI + angle) * radius,\n  y + Math.sin(Math.PI + angle) * radius\n\
  );\n```\n\n将每个坐标乘以 `radius` 确保我们始终在圆上（距离中心固定距离）。因此，我们正在找到圆上对应于角度 `Math.PI - angle`\
  \ 和 `Math.PI + angle` 的点。一个角位于 `Math.PI` 之前 45 度的圆上，另一个位于 `Math.PI` 之后 45 度。因为 `Math.PI`\
  \ 是半个圆，它指向飞船的后部，两个角分别位于其两侧。\n\n看一下图 4-3 并仔细思考，直到你明白发生了什么。请记住，引导圆显示了检测碰撞的位置。小行星周围也会有类似的圆，当这些圆接触时，就会检测到碰撞。对于我们的飞船，正面碰撞将是准确的，后角碰撞也是如此，但飞船和圆之间的大片区域会过早地检测到碰撞。这是我们稍后将尝试改进的地方。\n\
  \n## 变换画布上下文\n\n\n\n注意我们已经将飞船绘制成朝右的形状。这是因为 `0` 弧度角指向正右方。那么如何旋转飞船呢？我们需要围绕飞船自身的中心进行旋转，并在游戏中以所有角度绘制它。手动计算所有坐标将变得冗长乏味。一种便捷的方法是转换画布上下文，而不是转换图形本身。旋转上下文始终围绕当前上下文的原点进行。\n\
  \n尝试绘制一些旋转后的飞船——将你的 `exercise4.html` 脚本替换为清单 4-4 所示的内容。\n\n```javascript\nvar context\
  \ = document.getElementById(\"asteroids\").getContext(\"2d\");\ncontext.lineWidth\
  \ = 0.5;\ncontext.strokeStyle = \"white\";\nlet x = context.canvas.width * 0.9;\n\
  let y = 0;\nlet radius = context.canvas.width * 0.1;\ndraw_grid(context);\nfor(let\
  \ r = 0; r <= 0.5 * Math.PI; r += 0.05 * Math.PI) {\n  context.save()\n  context.rotate(r);\n\
  \  draw_ship(context, x, y, radius, {guide: true});\n  context.beginPath();\n  context.moveTo(0,\
  \ 0);\n  context.lineTo(x, 0);\n  context.stroke();\n  context.restore()\n}\n```\n\
  \n清单 4-4 旋转画布上下文\n\n旋转上下文正如其字面含义：想象你手持一支笔放在纸上，然后实际上是在旋转纸张，绘制我们的飞船（使其朝右），最后将纸放回原位。这使得我们能够将飞船绘制成任意朝向。重要的是，旋转是围绕画布原点进行的，根据我们的网格坐标，原点位于左上角。现在想象一下，固定纸张的左上角，并围绕该角旋转纸张。\n\
  \n在每次迭代中，我们保存上下文、旋转它、绘制飞船和一条线，然后恢复上下文到初始状态。这意味着旋转总是应用于未旋转的上下文，因为每次以不同角度绘制飞船时，我们都会旋转一个更大的角度。由于我们是绕原点旋转，飞船始终与左上角保持相同的距离。在每次迭代中，我们还从原点绘制一条线到飞船中心。这条线也会被旋转，但原点始终保持在左上角。图\
  \ 4-4 展示了结果。\n\n![A455241_1_En_4_Fig4_HTML.jpg](img/A455241_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4 绕原点旋转\n\n在我们的游戏中，我们需要围绕飞船的中心点旋转，而不是画布的左上角。为此，我们需要在旋转之前移动上下文原点。关键在于，当我们旋转画布时，它是围绕原点旋转的，因此如果我们移动原点，就可以控制旋转。在我们的游戏中，我们将存储飞船的位置和角度。在绘制飞船之前，我们会平移和旋转上下文。这意味着我们将始终在新的原点进行绘制，因此需要调整飞船绘制函数，移除坐标参数，并始终在\
  \ `(0, 0)` 处绘制。将所有对 `x` 和 `y` 的引用替换为 `0`（零），如清单 4-5 所示。\n\n```javascript\nfunction\
  \ draw_ship(ctx, radius, options) {\n  options = options || {};\n  ctx.save();\n\
  \  if(options.guide) {\n    ctx.strokeStyle = \"white\";\n    ctx.fillStyle = \"\
  rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth = 0.5;\n    ctx.beginPath();\n    ctx.arc(0,\
  \ 0, radius, 0, 2 * Math.PI);\n    ctx.stroke();\n    ctx.fill();\n  }\n  ctx.lineWidth\
  \ = options.lineWidth || 2;\n  ctx.strokeStyle = options.stroke || \"white\";\n\
  \  ctx.fillStyle = options.fill || \"black\";\n  let angle = (options.angle || 0.5\
  \ * Math.PI) / 2;\n  ctx.beginPath();\n  ctx.moveTo(radius, 0);\n  ctx.lineTo(\n\
  \    Math.cos(Math.PI - angle) * radius,\n    Math.sin(Math.PI - angle) * radius\n\
  \  );\n  ctx.lineTo(\n    Math.cos(Math.PI + angle) * radius,\n    Math.sin(Math.PI\
  \ + angle) * radius\n  );\n  ctx.closePath();\n  ctx.fill();\n  ctx.stroke();\n\
  \  ctx.restore();\n}\n```\n\n清单 4-5 在当前原点绘制\n\n现在，通过在绘制飞船于 `(0, 0)` 点之前，平移画布（调用\
  \ `context.translate`）并旋转画布（调用 `context.rotate`），我们可以在任意位置绘制飞船。当这样变换画布时，我们必须小心地保存和恢复画布状态——否则我们会丢失跟踪。在清单\
  \ 4-6 中，我们旋转和平移了画布但没有恢复它，导致旋转和平移累积，产生了一个漂亮但非预期的螺旋图案，如图 4-5 所示。\n\n```javascript\n\
  let t = context.canvas.width / 20;\nlet r = Math.PI / 500;\ncontext.translate(0,\
  \ t);\nfor(let i = 0; i <= 50; i ++) {\n  context.rotate(i * r);\n  draw_ship(context,\
  \ t, {guide: true, lineWidth: 1});\n  context.translate(t, 0);\n}\n```\n\n清单 4-6\
  \ 组合旋转与平移\n\n![A455241_1_En_4_Fig5_HTML.jpg](img/A455241_1_En_4_Fig5_HTML.jpg)\n\
  \n图 4-5 丢失画布状态跟踪\n\n更好的方法是维护变量（即 `x`、`y` 和 `angle`）来确定飞船的位置和角度。这样，我们可以保存未变换的上下文、应用变换、绘制飞船，最后恢复上下文。这使我们能够将飞船绘制在任意位置并指向任意方向。清单\
  \ 4-7 在一个嵌套循环中遍历 `x` 和 `y` 位置，并在每个位置绘制一艘小飞船。每艘飞船都以一个稍大的角度绘制。注意，在 `save()` 和 `restore()`\
  \ 调用之间的代码非常通用。实际起作用的是控制我们变量的代码。图 4-6 展示了飞船整齐排列的结果。\n\n```javascript\nlet x, y, angle\
  \ = 0;\nlet w = context.canvas.width, h = context.canvas.height\nfor(y = h/20; y\
  \ < h; y += h/10) {\n  for(x = w/20; x < w; x += w/10) {\n    context.save();\n\
  \    context.translate(x, y);\n    context.rotate(angle);\n    draw_ship(context,\
  \ w/30, {guide: true, lineWidth: 1});\n    context.restore();\n    angle = (angle\
  \ + 0.0075 * Math.PI);\n  }\n}\n```\n\n清单 4-7 控制变量\n\n![A455241_1_En_4_Fig6_HTML.jpg](img/A455241_1_En_4_Fig6_HTML.jpg)\n\
  \n图 4-6 使用画布变换进行受控的飞船绘制\n\n\n\n飞船的外观看起来不错，但略显方正。下一步是掌控曲线。幸运的是，这非常简单。首先要做的是找出一条我们想将其变为曲线的直线。飞船的后部显然是首选。对于二次曲线，我们需要一个控制点来“拉”动直线，使其变成曲线。在本例中，该点将位于飞船后部的中轴线上，其\
  \ `y` 坐标为 0。确定这一点后，我们就可以将一条 `context.lineTo` 调用转换为 `context.quadraticCurveTo` 调用。请按清单\
  \ 4-8 所示，更新你的 `draw_ship` 函数。\n\n```javascript\nfunction draw_ship(ctx, radius,\
  \ options) {\n  options = options || {};\n  let angle = (options.angle || 0.5 *\
  \ Math.PI) / 2;\n  // this is new\n  let curve = options.curve || 0.5;\n  ctx.save();\n\
  \  if(options.guide) {\n    ctx.strokeStyle = \"white\";\n    ctx.fillStyle = \"\
  rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth = 0.5;\n    ctx.beginPath();\n    ctx.arc(0,\
  \ 0, radius, 0, 2 * Math.PI);\n    ctx.stroke();\n    ctx.fill();\n  }\n  ctx.lineWidth\
  \ = options.lineWidth || 2;\n  ctx.strokeStyle = options.stroke || \"white\";\n\
  \  ctx.fillStyle = options.fill || \"black\";\n  ctx.beginPath();\n  ctx.moveTo(radius,\
  \ 0);\n  ctx.lineTo(\n    Math.cos(Math.PI - angle) * radius,\n    Math.sin(Math.PI\
  \ - angle) * radius\n  );\n  // here we have added a control point based on the\
  \ curve variable\n  ctx.quadraticCurveTo(radius * curve - radius, 0,\n    Math.cos(Math.PI\
  \ + angle) * radius,\n    Math.sin(Math.PI + angle) * radius\n  );\n  ctx.closePath();\n\
  \  ctx.fill();\n  ctx.stroke();\n  // a new guide line and circle show the control\
  \ point\n  if(options.guide) {\n    ctx.strokeStyle = \"white\";\n    ctx.lineWidth\
  \ = 0.5;\n    ctx.beginPath();\n    ctx.moveTo(-radius, 0);\n    ctx.lineTo(0, 0);\n\
  \    ctx.stroke();\n    ctx.beginPath();\n    ctx.arc(radius * curve - radius, 0,\
  \ radius/50, 0, 2 * Math.PI);\n    ctx.stroke();\n  }\n  ctx.restore();\n}\n```\n\
  \n**清单 4-8** 使用二次曲线\n\n我们添加了一个名为 `curve` 的可选变量，其默认值为 0.5。在绘制飞船后部两个角之间的线条时，我们现在使用二次曲线而非直线。该曲线的控制点位于飞船的中轴线上。如果\
  \ `curve` 的值为 0，则控制点位于圆的半径上；如果 `curve` 的值设为 1，则控制点位于圆的中心。\n\n现在，为了测试该函数，我们将随机化这个新参数，并在画布中心绘制一艘大型飞船。每次刷新页面（例如，按\
  \ `Ctrl+R`），都会选择一个新值，并且画布会更新：\n\n```javascript\ncontext.translate(200, 200);\ndraw_ship(context,\
  \ 150, {curve: Math.random(), guide: true});\n```\n\n我们还添加了一段新的辅助线代码，用于在飞船顶部绘制控制点。我们在控制点的位置绘制一个实心圆点，以帮助展示曲线是如何构建的。此外，我们还绘制了一条线，以显示控制点的潜在范围（介于\
  \ 0 和 1 之间）。请注意，曲线不一定穿过该点，而是朝向它绘制。\n\n你应该能看到类似图 4-7 的效果。\n\n![A455241_1_En_4_Fig7_HTML.jpg](img/A455241_1_En_4_Fig7_HTML.jpg)\n\
  \n**图 4-7** 添加曲线\n\n尝试手动设置 `curve` 的值。低于 0 和高于 1 的值在一定范围内也是有效的。请确保你理解这里发生了什么。如前所述，飞船应尽可能靠近圆的边缘绘制，以便碰撞检测更准确。尽管我们对形状要求不严格，但其位置和大小应尽可能与圆匹配。\n\
  \n我们将为飞船设计添加的最终修饰是将其侧边绘制成二次曲线。实现方法有多种，这里我们将在飞船两侧与后部相对的位置各放置一个控制点。我们将以参数的形式指定其在圆中的位置。该位置（从\
  \ 0 到 1，对应圆心到半径）决定了控制点将放置的地方。数值越大，侧边越向外拉，从而填充圆内更多的空间；数值越小，侧边越向内收。\n\n清单 4-9 展示了最终代码。\n\
  \n```javascript\nfunction draw_ship(ctx, radius, options) {\n  options = options\
  \ || {};\n  let angle = (options.angle || 0.5 * Math.PI) / 2;\n  // Now we have\
  \ two curve arguments\n  let curve1 = options.curve1 || 0.25;\n  let curve2 = options.curve2\
  \ || 0.75;\n  ctx.save();\n  if(options.guide) {\n    ctx.strokeStyle = \"white\"\
  ;\n    ctx.fillStyle = \"rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth = 0.5;\n    ctx.beginPath();\n\
  \    ctx.arc(0, 0, radius, 0, 2 * Math.PI);\n    ctx.stroke();\n    ctx.fill();\n\
  \  }\n  ctx.lineWidth = options.lineWidth || 2;\n  ctx.strokeStyle = options.stroke\
  \ || \"white\";\n  ctx.fillStyle = options.fill || \"black\";\n  ctx.beginPath();\n\
  \  ctx.moveTo(radius, 0);\n  // here we have the three curves\n  ctx.quadraticCurveTo(\n\
  \    Math.cos(angle) * radius * curve2,\n    Math.sin(angle) * radius * curve2,\n\
  \    Math.cos(Math.PI - angle) * radius,\n    Math.sin(Math.PI - angle) * radius\n\
  \  );\n  ctx.quadraticCurveTo(-radius * curve1, 0,\n    Math.cos(Math.PI + angle)\
  \ * radius,\n    Math.sin(Math.PI + angle) * radius\n  );\n  ctx.quadraticCurveTo(\n\
  \    Math.cos(-angle) * radius * curve2,\n    Math.sin(-angle) * radius * curve2,\n\
  \    radius, 0\n  );\n  ctx.fill();\n  ctx.stroke();\n  // the guide drawing code\
  \ is getting complicated\n  if(options.guide) {\n    ctx.strokeStyle = \"white\"\
  ;\n    ctx.fillStyle = \"white\";\n    ctx.lineWidth = 0.5;\n    ctx.beginPath();\n\
  \    ctx.moveTo(\n      Math.cos(-angle) * radius,\n      Math.sin(-angle) * radius\n\
  \    );\n    ctx.lineTo(0, 0);\n    ctx.lineTo(\n      Math.cos(angle) * radius,\n\
  \      Math.sin(angle) * radius\n    );\n    ctx.moveTo(-radius, 0);\n    ctx.lineTo(0,\
  \ 0);\n    ctx.stroke();\n    ctx.beginPath();\n    ctx.arc(\n      Math.cos(angle)\
  \ * radius * curve2,\n      Math.sin(angle) * radius * curve2,\n      radius/40,\
  \ 0, 2 * Math.PI\n    );\n    ctx.fill();\n    ctx.beginPath();\n    ctx.arc(\n\
  \      Math.cos(-angle) * radius * curve2,\n      Math.sin(-angle) * radius * curve2,\n\
  \      radius/40, 0, 2 * Math.PI\n    );\n    ctx.fill();\n    ctx.beginPath();\n\
  \    ctx.arc(radius * curve1 - radius, 0, radius/50, 0, 2 * Math.PI);\n    ctx.fill();\n\
  \  }\n  ctx.restore();\n}\n```\n\n**清单 4-9** 曲线飞船\n\n改动实际上非常小——我们只是添加了一些控制点，并使用前面描述的简单三角函数进行计算。大部分新增代码实际上都用于绘制控制点！请专注于主代码中的改动。我们将\
  \ `options.curve` 值改成了 `options.curve1` 和 `options.curve2`。剩下的两次 `context.lineTo`\
  \ 调用已被转换为 `context.quadraticCurveTo` 调用，并指定了控制点。\n\n同样，调用它非常简单：\n\n```javascript\n\
  context.translate(200, 200);\ndraw_ship(context, 150, {\n  curve1: Math.random(),\n\
  \  curve2: Math.random(),\n  guide: true\n});\n```\n\n尝试一下，你应该能得到类似图 4-8 的效果。刷新页面（`Ctrl+R`），每次都应该能看到不同的随机变体。\n\
  \n![A455241_1_En_4_Fig8_HTML.jpg](img/A455241_1_En_4_Fig8_HTML.jpg)\n\n**图 4-8**\
  \ 全曲线飞船\n\n尝试清单 4-10 中的代码，看看我们能用新方法绘制出哪些替代飞船。最终你应该会得到类似图 4-9 的效果。\n\n```javascript\n\
  var context = document.getElementById(\"asteroids\").getContext(\"2d\");\ndraw_grid(context);\n\
  let c1 = 0, c2 = 0;\nfor(c1=0.1; c1<1; c1+=0.2) {\n  for(c2=0.1; c2<1; c2+=0.2)\
  \ {\n    context.save();\n    context.translate(context.canvas.width * c1, context.canvas.height\
  \ * c2)\n    context.rotate(-Math.PI/2);\n    draw_ship(context, context.canvas.width\
  \ / 12, {curve1: c1, curve2: c2, guide : true});\n    context.restore();\n  }\n\
  }\n```\n\n**清单 4-10** 绘制多种变体\n\n![A455241_1_En_4_Fig9_HTML.jpg](img/A455241_1_En_4_Fig9_HTML.jpg)\n\
  \n**图 4-9** 一系列备选飞船\n\n现在我们拥有一个完整、完全可配置的飞船绘制函数，只需导入我们的 `drawing.js` 库即可在游戏中使用。通过定义自己的函数来增加结构，可以使复杂代码更易于理解。\n\
  \n\n\n## 总结\n\n本章对第 [3](https://example.org/A455241_1_En_3_Chapter.xhtml) 章中的思路进行了重要延伸。我们绘制了更复杂的形状，并将设计从简单的三角形发展为曲线优美的图形。我们学习了如何平移和旋转画布。这些概念将在后续内容中非常重要，因此你一定要确保已充分理解它们。它们让我们能够以极其灵活的方式调用绘图函数。一个关键发现是：随着绘图函数变得越来越复杂，我们调用该函数的代码却几乎没有任何变化。这正是一般情况下我们管理复杂性的方式——将诸如“绘制一艘飞船”这样的想法抽象成函数，并在需要“绘制飞船”时随时调用该函数。尝试自行开发\
  \ `draw_ship` 函数。保留辅助圆代码，并尽可能贴近边缘进行绘制。如果超出边缘一点，会有影响吗？© Graeme Stuart 2017 Graeme\
  \ Stuart《Introducing JavaScript Game Development》[`doi.org/10.1007/978-1-4842-3252-1_5`](https://doi.org/10.1007/978-1-4842-3252-1_5)\n\
  \n"
- "# 5. 绘制小行星\n\nGraeme Stuart^(1 ) (1) 英国莱斯特郡马基特哈伯勒 与飞船类似，为了碰撞检测，小行星也可近似为一个圆形。然而，小行星应该是不规则形状，且每个都应独一无二。为此，我们将广泛使用\
  \ `Math.random` 方法来定义小行星的形状。\n\n## 绘制基本形状\n\n\n好的，作为高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n作为第一次尝试，我们将把小行星划分为多个线段，并从每个线段到下一个线段绘制一条直线。为此，我们可以逐步旋转画布，并在关闭路径之前在每个步骤绘制一条直线。我们希望点到原点的距离有一些随机性。我们可以在循环中管理旋转。我们可以在每一步旋转相同的量：即`2π`弧度除以线段数量。然后，我们在圆周附近（原点正右侧）选取一个随机点。旋转的原点将是小行星的中心，因此尽管我们将笔保持在圆的右侧，但我们的绘图会在笔下方旋转。通过这种方式，我们一次绘制一个线段，最终应能关闭路径。\n\
  \n将清单 5-1 中的函数添加到`drawing.js`中。\n\n```\nfunction draw_asteroid(ctx, radius, segments,\
  \ options) {\n  options = options || {};\n  ctx.strokeStyle = options.stroke ||\
  \ \"white\";\n  ctx.fillStyle = options.fill || \"black\";\n  ctx.save();\n  ctx.beginPath();\n\
  \  for(let i = 0; i < segments; i++) {\n    ctx.rotate(2 * Math.PI / segments);\n\
  \    ctx.lineTo(radius, 0);\n  }\n  ctx.closePath();\n  ctx.fill();\n  ctx.stroke();\n\
  \  if(options.guide) {\n    ctx.lineWidth = 0.5;\n    ctx.beginPath();\n    ctx.arc(0,\
  \ 0, radius, 0, 2 * Math.PI);\n    ctx.stroke();\n  }\n  ctx.restore();\n}\n```\n\
  \n*清单 5-1 绘制基本形状*\n\n该函数接受四个参数：用于绘制的上下文、小行星的半径、线段数量以及一组可选的选项。它开始一条路径，然后一次旋转画布一个线段，为每个线段添加一条直线到路径中。随后路径被关闭，完成绘制。如果请求了辅助圆，则将其绘制为一个简单的圆形。请注意，在调用`context.beginPath`方法后，路径的起点位置尚未确定。在这种情况下，添加到路径中的第一条直线不会被绘制，而是被视为移动。因此，当绘制完最后一个线段时，会缺少一条直线，需要关闭路径。\n\
  \n创建一个新文件`exercise5.html`，并像之前一样进行设置，但使用新的标题和标题。像之前的练习一样绘制一个网格，并添加清单 5-2 中的代码。\n\
  \n```\nlet context = document.getElementById(\"asteroids\").getContext(\"2d\");\n\
  draw_grid(context);\nlet segments = 1\nfor(let x=0.25; x<1; x+= 0.5) {\n  for(let\
  \ y=0.25; y<1; y+= 0.5) {\n    segments += 2;\n    context.save();\n    context.translate(context.canvas.width\
  \ * x, context.canvas.height * y);\n    draw_asteroid(context, 60, segments, {guide:\
  \ true});\n    context.restore();\n  }\n}\n```\n\n*清单 5-2 一些规则形状*\n\n这将在画布上绘制四个小行星，如图\
  \ 5-1 所示。请注意，小行星的角点位于辅助圆上。\n\n![A455241_1_En_5_Fig1_HTML.jpg](img/A455241_1_En_5_Fig1_HTML.jpg)\n\
  \n*图 5-1 无随机化的规则小行星*\n\n添加随机化相当简单。我们只需更改`context.lineTo`命令的`x`坐标，在每个线段中为半径添加一点随机噪声。我们如何做到这一点，决定了我们能将小行星形状保持在辅助圆附近的程度。一种简单的方法是将半径乘以一个随机数——这会在线段位置（从小行星中心即`0`到整个半径即`radius`）之间引入巨大变化。清单\
  \ 5-3 展示了在编写这些示例时尝试过的三种添加随机性的方法。\n\n```\n// 一种过于简单的方法 - 我们不需要完全随机\nctx.lineTo(radius\
  \ * Math.random(), 0);\n\n// 好多了，只有一点随机\nctx.lineTo(radius * 0.8 + radius * 0.4\
  \ * Math.random(), 0);\n\n// 这种方法简洁、可配置，并使半径保持在合理范围内\nctx.lineTo(radius + radius\
  \ * options.noise * (Math.random() - 0.5), 0);\n```\n\n*清单 5-3 添加随机性*\n\n这些示例揭示了一些要求。在第一个示例中，随机小行星可能包含原点处的点；这不是我们想要的。为了避免这种情况，我们指定一部分始终保留的半径（例如\
  \ 80%），并且只对剩余部分进行随机化。在第二个示例中，随机小行星的点始终位于碰撞圆内，而绝不会超出它。我们希望随机化“跨越”指定的半径，而不是总是侵蚀它，使小行星变小。为此，我们生成一个介于`-0.5`和`+0.5`之间的数字，并使用它来随机化绘图。此外，第二个示例不可配置，因此我们引入了一个配置参数，可以在`options`参数中指定。最后一个示例通过指定一个介于`0`（无随机化）和`1`（大量随机化）之间的`noise`参数来展示这种方法。该值乘以一个介于`-0.5`和`0.5`之间的随机数，以限制随机化的效果。例如，`noise`值为`0.2`可以导致任何介于原始半径的\
  \ 90% 和 110% 之间的半径。指定`noise`因子为`0.1`将允许半径在给定值的 95% 到 105% 之间变化。\n\n更新您的函数以接受一个`noise`参数。然后使用清单\
  \ 5-4 中的代码绘制 25 个小行星。\n\n```\nvar segments = 15, noise = 0.4;\nfor(let x=0.1; x<1;\
  \ x+= 0.2) {\n  for(let y=0.1; y<1; y+= 0.2) {\n    context.save();\n    context.translate(context.canvas.width\
  \ * x, context.canvas.height * y);\n    draw_asteroid(context, context.canvas.width\
  \ / 12, segments, {noise: noise, guide: true});\n    context.restore();\n  }\n}\n\
  ```\n\n*清单 5-4 绘制一些不同的小行星*\n\n在这里，我们像以前一样遍历`x`和`y`坐标，并在每个位置绘制一个小行星。结果如图 5-2 所示。尝试通过更改所提供变量的初始值来试验线段数量和噪声级别。您还可以通过递增或随机化它们来更改每个循环中的值。对于具有大量线段的小行星，您注意到了什么？\n\
  \n![A455241_1_En_5_Fig2_HTML.jpg](img/A455241_1_En_5_Fig2_HTML.jpg)\n\n*图 5-2 25\
  \ 个小行星（segments = 15，noise = 0.2）*\n\n这些小行星看起来非常不错！请注意，在图 5-2 中，我们还添加了两个新的辅助圆，以显示配置的噪声的内外范围。这留作练习。请在您的函数中实现这一点，使用比主辅助圆更细的线宽。\n\
  \n\n\n## 存储形状数据\n\n在我们的游戏中，需要让每个小行星持续存在，直到被击毁或游戏结束。按目前情况来看，函数无法实现这一点——它每次被调用时都会随机生成小行星的形状。绘制单个小行星时，需要存储并使用形状数据（一组随机数）。每个小行星都需要有自己的形状数据。实现这一目标的第一步是在函数外部生成随机形状数据，并将其作为函数参数传入。让我们来尝试一下。\n\
  \n```\nfunction draw_asteroid(ctx, radius, shape, options) {\n    options = options\
  \ || {};\n    ctx.strokeStyle = options.stroke || \"white\";\n    ctx.fillStyle\
  \ = options.fill || \"black\";\n    ctx.save();\n    ctx.beginPath();\n    for(let\
  \ i = 0; i < shape.length; i++) {\n        ctx.rotate(2 * Math.PI / shape.length);\n\
  \        ctx.lineTo(radius + radius * options.noise * shape[i], 0);\n    }\n   \
  \ ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n    if(options.guide) {\n\
  \        ctx.lineWidth = 0.5;\n        ctx.beginPath();\n        ctx.arc(0, 0, radius,\
  \ 0, 2 * Math.PI);\n        ctx.stroke();\n        ctx.beginPath();\n        ctx.lineWidth\
  \ = 0.2;\n        ctx.arc(0, 0, radius + radius * options.noise, 0, 2 * Math.PI);\n\
  \        ctx.stroke();\n        ctx.beginPath();\n        ctx.arc(0, 0, radius -\
  \ radius * options.noise, 0, 2 * Math.PI);\n        ctx.stroke();\n    }\n    ctx.restore();\n\
  }\n```\n\n清单 5-5 传入形状数据\n\n实际上我们只做了很少的改动。主要区别在于，现在我们接受的是 `shape` 参数，而不是 `segments`\
  \ 参数。`shape` 可以是任意数字数组，但假设这些数字的取值范围在 -0.5 到 +0.5 之间。之前引用 `segments` 变量的地方，现在我们改用\
  \ `shape.length`。之前生成随机数的地方，现在我们使用 `shape` 数组中对应元素的值（`shape[i]`）。我们还添加了额外的辅助圆，用于指示\
  \ `noise` 参数的值。\n\n要使用这个新函数，我们必须先生成形状数据，然后只需将其传入函数以替换 `segments` 参数即可。请尝试清单 5-6\
  \ 中的代码。\n\n```\nvar segments = 15, noise = 0;\nvar shape = [];\nfor(var i = 0; i\
  \ < segments; i++) {\n    shape.push(2 * (Math.random() - 0.5));\n}\nfor(let y=0.1;\
  \ y<1; y+= 0.2) {\n    for(let x=0.1; x<1; x+= 0.2) {\n        context.save();\n\
  \        context.translate(context.canvas.width * x, context.canvas.height * y);\n\
  \        draw_asteroid(context, context.canvas.width / 16, shape, {noise: noise,\
  \ guide: true});\n        context.restore();\n        noise += 0.025;\n    }\n}\n\
  ```\n\n清单 5-6 对不同噪点使用相同形状\n\n在本例中，我们生成形状数据，然后绘制一组 25 个小行星，它们形状相同，但 `noise` 参数值逐渐增大（见图\
  \ 5-3）。`noise` 从 0 开始，以 0.125 的步长递增至 0.6。尝试用代码做些实验。\n\n![A455241_1_En_5_Fig3_HTML.jpg](img/A455241_1_En_5_Fig3_HTML.jpg)\n\
  \n图 5-3 对增加的噪点使用相同形状\n\n现在我们有了一个函数，可以根据可配置的噪点级别绘制小行星。使用该函数的客户端代码负责生成小行星形状、设置大小以及选择合适的噪点级别。函数非常适合处理繁琐的细节，并将重要决策权交给更高级别的代码。\n\
  \n## 本章小结\n\n在本章中，我们重复了设计游戏中所需对象的过程。同时还引入了一个新概念。如果我们想要绘制一个在场景中旋转的小行星，就需要存储其形状数据。使用与单个对象关联的数据是一个重要的概念。理解编写代码是一个创造性的问题解决过程同样重要。本书中的代码示例只是用来演示概念的范例。这些代码并非一气呵成，而是经过数周的打磨和完善才形成的。清单\
  \ 5-3 展示了代码如何随时间演变——简而言之，就是从尽可能简单的版本开始，如果设计不适用于当前需求，则进行调整。当你自己编写代码时，明智的做法是预料到这将是一个困难但回报丰厚的过程。熟能生巧。目前，练习的一个好方法是对提供的示例进行扩展。尝试使用不同的方法绘制小行星。添加一个可作为可选参数传入的新参数。以一种有趣的方式展示你的小行星。\n\
  \n"
- '# 第二部分

  ## 动画


  使用 HTML Canvas 实现动画相当简单。我们只需要反复清除画布并绘制场景，每一步都更新场景即可。如果重复这个过程，并以每秒约 60 帧的速度绘制场景，那么我们就实现了动画效果。我们需要清晰定义场景中每个元素在每一步如何更新，确保将更新场景的代码与绘制场景的代码分开。接下来的章节将演示如何通过简单的游戏循环来控制动画，我们将学习设计游戏元素的扎实的面向对象方法的基础知识。最后，我们将使用一种简单的继承方法，为我们的"小行星"游戏克隆体开发一些必要的游戏元素。©
  Graeme Stuart 2017 Graeme Stuart《Introducing JavaScript Game Development》 `doi.org/10.1007/978-1-4842-3252-1_6`


  '
- "# 第 6 章 基本动画\n\nGraeme Stuart (1) (1) 英国莱斯特郡马基特哈伯勒\n\n在前几章中，我们学习了在画布上绘图的基本原理。现在我们有了一些经验，可以把注意力转向如何让场景动起来。动画相当简单——只需每秒多次绘制一个变化的场景。在本章中，我们将以一种非常简单的方式学习如何实现这一点，以理解其基础原理。当绘制飞船和小行星时，我们需要关于它们位置、大小、形状等数据。这些数据将用于平移和旋转上下文，使所有元素出现在正确的位置。为了制作场景动画，我们每帧更新数据，并随着数据的变化反复重绘场景。\n\
  \n\n\n## 从简单开始\n\n我们先从一个非常简单的场景入手：一个移动的圆形。这个圆形在画布上有一个位置（`x` 和 `y` 坐标），我们将移动这个位置。按常规方式新建一个文件夹：复制\
  \ `drawing.js` 库和样式表。新建一个文件 `exercise6.html`，其中的代码如代码清单 6-1 所示。\n\n```html\n<!doctype\
  \ html>\n<html>\n  <head>\n    <title>动画</title>\n    <link rel=\"stylesheet\" href=\"\
  styles.css\">\n    <script src=\"drawing.js\"></script>\n  </head>\n  <body>\n \
  \   <h1>动画</h1>\n    <canvas id=\"asteroids\" width=\"300\" height=\"300\"></canvas>\n\
  \    <script>\n      var context = document.getElementById(\"asteroids\").getContext(\"\
  2d\");\n      context.strokeStyle = \"white\";\n      context.lineWidth = 1.5;\n\
  \      var x = 0, y = context.canvas.height / 2;\n      function frame() {\n   \
  \     context.clearRect(0, 0, context.canvas.width, context.canvas.height);\n  \
  \      draw(context);\n        update();\n      }\n      function update() {\n \
  \       x += 1;\n      }\n      function draw(ctx) {\n        draw_grid(ctx);\n\
  \        ctx.beginPath();\n        ctx.arc(x, y, 40, 0, 2 * Math.PI);\n        ctx.fill();\n\
  \        ctx.stroke();\n      }\n      setInterval(frame, 1000.0/60.0); // 60 帧每秒\n\
  \    </script>\n  </body>\n</html>\n```\n\n**代码清单 6-1** 一个移动的圆形\n\n这段代码的大部分内容我们都很熟悉，但有几个新地方值得注意。首先，我们将\
  \ `x` 和 `y` 坐标存储为全局变量。我们还把代码重构为一系列函数：`frame`、`update` 和 `draw`。`frame` 函数做了三件不同的事：它使用\
  \ `context.clearRect` 方法清除画布，然后调用 `draw` 函数（该函数在位置 `x`、`y` 处绘制一个圆形），接着调用 `update`\
  \ 函数（该函数将 `x` 坐标向右移动一个像素）。最后一个新内容是调用 `setInterval`，它会安排 `frame` 函数每秒被调用 60 次。\n\n\
  结果就是，每次调用 `frame` 函数时，它都会清除画布、绘制网格、在当前位置绘制圆形，并将位置向右移动。`setInterval` 调用中传入要调用的函数（`frame`）以及调用之间的时间间隔（以毫秒为单位，即\
  \ `1000.0 / 60.0`）。因此，`frame` 函数每隔六十分之一秒被调用一次，圆形以每秒 60 像素的速度向右移动。\n\n一旦圆形移动到画布边界之外，它就不可见了，但\
  \ `x` 的值仍在不断递增。尝试修改 `update` 函数来改变圆形的行为。这里有几个简单的想法：\n\n- 将 `x` 坐标增加一个不同的值（例如 `5`）\n\
  - 同时也增加 `y` 坐标\n- 递减坐标值\n- 将 `y` 坐标设为随机数（介于 `0` 和画布高度之间）\n\n## 一个更复杂的例子\n\n我们把重点放在\
  \ `update` 函数上，为圆形增加一些更复杂的行为。例如，可以添加一个重力效果，让圆形向下加速。在 `x` 和 `y` 定义之后添加一行，定义我们需要的变量：\n\
  \n```js\nvar yspeed = 0, gravity = 0.1;\n```\n\n像这样更新你的 `update` 函数：\n\n```js\n\
  function update() {\n  x += 1;\n  y += yspeed;\n  yspeed += gravity;\n}\n```\n\n\
  这里我们根据 `yspeed` 移动 `y` 坐标，并将 `yspeed` 增加 `gravity` 的值。圆形很快就会加速冲出画布底部。我们来让圆形在碰到屏幕底部时弹起来。弹跳其实就是改变运动方向，就像这样：\n\
  \n```js\nfunction update() {\n  x += 1;\n  y += yspeed;\n  yspeed += gravity;\n\
  \  if(y >= context.canvas.height) { // 如果碰到了底部\n    yspeed *= -1;              \
  \    // 改为向上运动\n  }\n}\n```\n\n如果希望每次弹跳都损失一点能量，则乘以一个小于 `-1` 的数（例如 `-0.8`）。\n\n**注意**\
  \ 这里需要小心。考虑一下，如果 `yspeed` 为 `+10`（像素/帧），而 `y` 坐标刚好比画布高度少 `1` 像素，会发生什么情况：\n\n1. `y`\
  \ 坐标增加到超出画布高度 `9` 像素，`yspeed` 更新为 `-8`。\n2. `y` 坐标减少到超出画布高度 `1` 像素，`yspeed` 被设置为\
  \ `+6.4`。\n\n\n\n## 排版后的文本\n\n由于 `yspeed` 在每一帧中都会更新（反转并缩小），位置永远不会低于画布高度。要解决此问题，请确保在每次反转\
  \ `yspeed` 时，将圆移动到画布高度。现在，我们希望看到圆在画布上水平“环绕”。将以下行添加到你的 `update` 函数中：\n\n```\nif(x\
  \ <= 0 || x >= context.canvas.width) {\n  x = (x + context.canvas.width) % context.canvas.width;\n\
  }\n```\n\n现在我们可以更进一步，添加更多变量，并选择绘制一个吃豆人（Pac-Man）而不是一个球。这展示了将更新和绘制代码分离，并拥有便捷绘图函数的好处。更新你的代码以反映列表\
  \ 6-2。\n\n```\n<!doctype html>\n<html>\n  <head>\n    <title>Animation</title>\n\
  \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
  ></script>\n  </head>\n  <body>\n    <h1>Animation</h1>\n    <canvas id=\"asteroids\"\
  \ width=\"300\" height=\"300\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
  asteroids\").getContext(\"2d\");\n      context.strokeStyle = \"white\";\n     \
  \ context.lineWidth = 1.5;\n      let x = 0, y = context.canvas.height / 5, radius\
  \ = 20;\n      let xspeed = 1.5, yspeed = 0, gravity = 0.1;\n      let mouth = 0;\n\
  \      function frame() {\n        context.clearRect(0, 0, context.canvas.width,\
  \ context.canvas.height);\n        draw(context);\n        update();\n      }\n\
  \      function update() {\n        x += xspeed;\n        y += yspeed;\n       \
  \ yspeed += gravity;\n        if(y >= context.canvas.height - radius) {\n      \
  \    y = context.canvas.height - radius; // add an extra radius\n          yspeed\
  \ *= -0.6;                          // reverse and slow down\n          xspeed *=\
  \ 0.95;                          // just slow down a bit\n        }\n        if(x\
  \ <= 0 || x >= context.canvas.width) {\n          x = (x + context.canvas.width)\
  \ % context.canvas.width;\n        }\n        mouth = Math.abs(Math.sin(6 * Math.PI\
  \ * x / (context.canvas.width)));\n      }\n      function draw(ctx) {\n       \
  \ draw_grid(ctx);\n        // draw a simple circle\n        ctx.beginPath();\n \
  \       ctx.arc(x, y, radius, 0, 2 * Math.PI);\n        ctx.fill();\n        ctx.stroke();\n\
  \        // or try this instead\n        // ctx.save();\n        // ctx.translate(x,\
  \ y);\n        // draw_pacman(ctx, radius, mouth);\n        // ctx.restore();\n\
  \      }\n      setInterval(frame, 1000.0/60.0); // 60 fps\n    </script>\n  </body>\n\
  </html>\n```\n\n**列表 6-2** 弹跳球/吃豆人\n\n我们在这里大展拳脚，通过追踪另一个变量来控制嘴巴的角度。`mouth` 角度现在与\
  \ `x` 坐标绑定，并遵循正弦波，吃豆人每次穿过画布时，嘴巴会开合六次。嘴巴的位置与 `x` 坐标的位置紧密相关。这只是为了好玩。你可以随意按自己喜欢的方式更新\
  \ `mouth` 变量。\n\n请注意，其他主要变化涉及添加 `xspeed` 变量和 `radius`，以及调整让物体从画布底部弹起的代码。我们不再让物体陷入画布一半的位置。`draw_pacman`\
  \ 函数需要更新，以便在上下文原点进行绘制，如列表 6-3 所示。\n\n```\nfunction draw_pacman(ctx, radius, mouth)\
  \ {\n  angle = 0.2 * Math.PI * mouth;\n  ctx.save();\n  ctx.fillStyle = \"yellow\"\
  ;\n  ctx.strokeStyle = \"black\";\n  ctx.lineWidth = 0.5;\n  ctx.beginPath();\n\
  \  ctx.arc(0, 0, radius, angle, -angle);\n  ctx.lineTo(0, 0);\n  ctx.closePath()\n\
  \  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n}\n```\n\n**列表 6-3** 在原点绘制吃豆人\n\
  \n为了明确这里发生了什么，我们可以反向跟踪代码。对 `setInterval` 的调用导致 `frame` 每秒被调用 60 次。对 `frame` 的重复调用会清除画布、调用\
  \ `update`，然后调用 `draw`。`update` 函数更新变量 `x`、`y`、`yspeed`、`xspeed` 和 `mouth`。`draw`\
  \ 函数使用这些变量渲染圆形（或吃豆人），以确定其位置和嘴巴角度。最终结果是圆形/吃豆人在画布上弹跳。你应该会看到类似于图 6-1 的效果。试着移除对 `context.clearRect`\
  \ 的调用，看看为什么需要保留它。\n\n![A455241_1_En_6_Fig1_HTML.jpg](img/A455241_1_En_6_Fig1_HTML.jpg)\n\
  \n**图 6-1** 吃豆人在画布上大快朵颐\n\n## 小结\n\n在本章中，我们了解了动画的基本原理：我们逐帧渲染场景，并控制与游戏元素相关的数据。将绘制场景和更新数据这两个基本任务分离成两个不同的函数，是保持结构化方法的第一步。我们如何管理这些数据，是游戏在开发过程中能否增加复杂性的关键方面。需要说明的是，基于\
  \ `setInterval` 进行动画制作并非最佳实践。现代浏览器实现了一种专门用于在 Web 上进行动画制作的机制。我们应该迅速转向使用 `window.requestAnimationFrame`\
  \ 方法来控制我们的游戏循环。那么，让我们开始吧。\n\n© Graeme Stuart 2017  \nGraeme Stuart, *Introducing\
  \ JavaScript Game Development*  \n`doi.org/10.1007/978-1-4842-3252-1_7`\n\n"
- "# 7. 让小行星动起来\n\nGraeme Stuart<sup>1</sup>\n\n(1) 英国莱斯特郡马基特哈伯勒\n\n在本章中，我们将为代码引入一些关键结构。前几章介绍了需要存储与游戏元素相关的数据。本章将介绍如何使用对象来解决由此带来的复杂性爆炸问题。对象是一个很好的解决方案，因为它们能使数据和代码紧密相连。既然我们现在可以实现动画，就可以开始构建游戏的主要部分了。我们将首先让一些小行星出现在屏幕上，并漂浮移动。小行星在太空中漂浮，它们会一直运动，直到被击中或游戏结束。它们的速度和旋转是随机初始化的，并且永远不会改变。\n\
  \n## 稳固的游戏循环\n\n\n\n`window.requestAnimationFrame` API 允许开发者专门请求浏览器绘制动画的下一帧。它受益于许多优化，例如按系统刷新率工作，并确保渲染与浏览器自身的重绘周期同步。它还能在页面最小化或选择了其他浏览器标签页时避免渲染帧，从而节省处理能力和电池续航。在本练习中，我们将实现一个稳健的游戏循环来控制一颗动画化的小行星。\n\
  \n创建一个新文件夹，并复制`drawing.js`库和样式表。复制上一个示例中的模板，将文件另存为`exercise7.html`。重命名页面标题和页眉，并用清单\
  \ 7-1 中的代码替换脚本。\n\n```javascript\nvar context = document.getElementById(\"asteroids\"\
  ).getContext(\"2d\");\n// asteroid shape\nvar segments = 24;\nvar shape = [];\n\
  for(var i = 0; i < segments; i++) {\n  shape.push(Math.random() - 0.5);\n}\nvar\
  \ radius = 50;\nvar noise = 0.2;\n// asteroid state\nvar x = context.canvas.width\
  \ * Math.random();\nvar y = context.canvas.height * Math.random();\nvar angle =\
  \ 0;\n// asteroid movement\nvar x_speed = context.canvas.width * (Math.random()\
  \ - 0.5);\nvar y_speed = context.canvas.height * (Math.random() - 0.5);\nvar rotation_speed\
  \ = 2 * Math.PI * (Math.random() - 0.5);\n```\n\n**清单 7-1** 设置一颗小行星\n\n这段代码定义了我们在此动画中使用的全局变量。`context`\
  \ 的访问方式与往常一样。我们定义了用于存储小行星段数的变量，并设置了小行星的形状数据。我们还将半径存储为变量，并定义了小行星的噪声值。从之前绘制小行星的示例来看，这些内容应该都相当不言自明。小行星被赋予了随机的位置，其角度初始化为\
  \ 0（因为其形状本身是随机的）。它还获得了决定其速度的 `x_speed` 和 `y_speed`。`rotation_speed` 变量也是随机化的，指示小行星旋转的速度和方向。这些移动变量都通过\
  \ `Math.random() – 0.5` 随机化为正值或负值。\n\n现在，添加清单 7-2 中的 `draw` 函数来渲染场景。\n\n```javascript\n\
  function draw(ctx, guide) {\n  if(guide) {\n    draw_grid(ctx);\n  }\n  ctx.save();\n\
  \  ctx.translate(x, y);\n  ctx.rotate(angle);\n  draw_asteroid(ctx, radius, shape,\
  \ {\n    guide: guide,\n    noise: noise\n  });\n  ctx.restore();\n}\n```\n\n**清单\
  \ 7-2** 绘制场景的函数\n\n我们引入了一个新的 `guide` 参数，因为我们希望能够为整个场景切换网格、引导线以及其他辅助元素的显示。首先，我们绘制网格，但仅当\
  \ `guide` 参数设置为 `true` 时才绘制。然后，在 `save` 和 `restore` 调用之间，我们准备上下文，并使用存储的参数调用 `draw_asteroid`。小行星的选项被构建为一个新的对象字面量，直接传递给\
  \ `draw_asteroid` 函数。小行星的状态由全局变量决定，这些变量在 `update` 函数中持续变化，从而决定了小行星的行为。\n\n添加清单 7-3\
  \ 中的 `update` 函数。\n\n```javascript\nfunction update(elapsed) {\n  if(x - radius\
  \ + elapsed * x_speed > context.canvas.width) {x = -radius;}\n  if(x + radius +\
  \ elapsed * x_speed < 0) {x = context.canvas.width + radius;}\n  if(y - radius +\
  \ elapsed * y_speed > context.canvas.height) {y = -radius;}\n  if(y + radius + elapsed\
  \ * y_speed < 0) {y = context.canvas.height + radius;}\n  x += elapsed * x_speed;\n\
  \  y += elapsed * y_speed;\n  angle = (angle + elapsed * rotation_speed) % (2 *\
  \ Math.PI);\n}\n```\n\n**清单 7-3** 更新小行星变量的函数\n\n我们在这里看到的第一个不同点是，`update` 函数接收一个参数。这表示自上一帧渲染以来经过的时间（以秒为单位）。它允许我们即使在性能和刷新率下降时也能保持一致的游戏速度。我们的\
  \ `x_speed` 和 `y_speed` 变量以像素/秒为单位定义。我们可以通过将这些值乘以经过的时间，来计算每帧移动小行星的精确像素数。`update`\
  \ 函数中的大部分代码确保小行星在画布上正确地环绕。当它完全移出某一边缘时，它会无缝地移动到对侧边缘之外。画布的每个边缘都用 `if` 语句进行检查。如果小行星即将越过边缘，其位置就会被翻转到对侧边缘。最后一行增加\
  \ `angle` 变量。\n\n至此，我们终于可以实现实际的游戏循环了。将清单 7-4 中的代码添加到你的脚本中。\n\n```javascript\nvar\
  \ previous, elapsed;\nfunction frame(timestamp) {\n  context.clearRect(0, 0, context.canvas.width,\
  \ context.canvas.height);\n  if (!previous) previous = timestamp;\n  elapsed = timestamp\
  \ - previous;\n  update(elapsed / 1000);\n  draw(context, true);\n  previous = timestamp;\n\
  \  window.requestAnimationFrame(frame);\n}\nwindow.requestAnimationFrame(frame);\n\
  ```\n\n**清单 7-4** 游戏循环\n\n这里我们引入了更多的全局变量，定义了 `frame` 函数，并调用了一次 `window.requestAnimationFrame`。脚本中的最后一行触发了第一帧，并开始了无限循环。`frame`\
  \ 函数是回调函数，它被传递给 `window.requestAnimationFrame`。其主要任务与上一个练习中一样：调用 `update` 和 `draw`\
  \ 函数。`requestAnimationFrame` API 规定，回调函数将接收一个参数，其中包含精确到至少 1 毫秒的时间戳。我们利用这个时间戳来计算当前帧与上一帧之间的经过时间。为此，我们存储了一个全局变量来保存上一次\
  \ `timestamp` 参数的值。在第一次调用时，上一次的时间戳尚未设置，因此我们将其初始化为当前时间戳，经过时间则为 0（零）。在后续帧中，上一次的时间戳是已知的，`elapsed`\
  \ 时间就是从上一帧被计算和绘制以来实际经过的时间。`frame` 函数中的最后一行是调用 `window.requestAnimationFrame`，并将\
  \ `frame` 函数本身作为参数传递。这个调用是向浏览器发出的请求：“当您准备好时，请运行此函数。”它只是将该函数添加到一个将在页面刷新期间被调用的函数列表中。因此，虽然它看起来像递归，但实际上并不是。`frame`\
  \ 函数并没有直接调用自己。这个调用确保一旦一帧完成，下一帧就会被排队等待渲染。浏览器通常会尝试达到每秒 60 帧，只要对 `update` 和 `draw`\
  \ 的调用不会花费太长时间，这通常是可以实现的。\n\n请仔细研究 `frame` 函数，确保你理解每一行代码。从现在开始，我们将在每个练习以及最终的游戏中都使用该函数的一个版本。你应该会看到类似图\
  \ 7-1 所示的效果。\n\n![A455241_1_En_7_Fig1_HTML.jpg](img/A455241_1_En_7_Fig1_HTML.jpg)\n\
  \n**图 7-1** 漂浮在太空中的动画小行星\n\n这个练习让一颗小行星动了起来。如果我们想在游戏中包含两颗小行星该怎么办？那又该如何做？如果是五颗或十颗小行星呢？\n\
  \n\n\n## 重构为简单对象\n\n在前面的代码中，我们将与小行星相关的所有数据都保存在全局作用域中。小行星的形状、位置和速度在脚本顶部被声明为简单变量。这种做法可扩展性很差——想象一下要为十颗小行星管理这些数据。我们需要某种结构。我们可以使用对象来表示游戏元素。对象可以存储与特定游戏对象相关的数据集合。将`segments`和`rotation_speed`之间的变量声明替换为清单\
  \ 7-5 中的代码。\n\n```javascript\nvar asteroid = {\n    segments: 24,\n    shape: [],\n\
  \    radius: 50,\n    noise: 0.5,\n    x: context.canvas.width * Math.random(),\n\
  \    y: context.canvas.height * Math.random(),\n    angle: 0,\n    x_speed: context.canvas.width\
  \ * (Math.random() - 0.5),\n    y_speed: context.canvas.height * (Math.random()\
  \ - 0.5),\n    rotation_speed: 2 * Math.PI * (Math.random() - 0.5)\n};\n```\n\n\
  清单 7-5 对象字面量\n\n这里我们定义了一个名为`asteroid`的单一对象，并将变量存储在其中。JavaScript 对象允许将相关变量存储在一起。语法很直观。我们在花括号之间指定逗号分隔的\
  \ `key: value` 对。对象属性可以通过点语法（`asteroid.radius`）或带字符串索引的方括号（`asteroid[\"radius\"\
  ]`）来访问。我们可以像往常一样将数据赋给对象参数。用清单 7-6 中的代码随机化`asteroid.shape`数组。\n\n```javascript\n\
  for(var i = 0; i < asteroid.segments; i++) {\n    asteroid.shape.push(Math.random()\
  \ - 0.5);\n}\n```\n\n清单 7-6 生成形状\n\n现在我们需要升级`draw`函数，使其使用新对象中的数据。将`draw`函数替换为清单\
  \ 7-7 中的代码。\n\n```javascript\nfunction draw(ctx, guide) {\n    if(guide) {\n   \
  \     draw_grid(ctx);\n    }\n    ctx.save();\n    ctx.translate(asteroid.x, asteroid.y);\n\
  \    ctx.rotate(asteroid.angle);\n    draw_asteroid(ctx, asteroid.radius, asteroid.shape,\
  \ {\n        noise: asteroid.noise,\n        guide: guide\n    });\n    ctx.restore();\n\
  }\n```\n\n清单 7-7 使用对象数据\n\n对`update`函数执行相同操作。只要变量已被移入`asteroid`对象，就添加前缀来访问数据。刷新页面，动画应该像之前一样正常工作。如果没有任何反应，请检查控制台中的错误消息——这些消息应该足够清晰，便于调试代码。如果你遗漏了某个变量，它会提示“未捕获的引用错误”，并指出是哪个变量以及代码中哪一行出了问题。\n\
  \n**注意** 大多数浏览器都内置了开发者工具。通常可以通过按`F12`键访问，但具体细节请查阅浏览器文档。JavaScript 控制台是一个非常有用的工具——它显示错误消息，并允许你直接与程序交互。\n\
  \n现在在浏览器控制台中输入`asteroid`并按回车键。你应该会看到命令被执行时的所有小行星参数。所有小行星数据都保存在一个对象中。这很好。但对于我们的目的来说，对象字面量语法还是相当笨拙。如果有更简洁的方法来创建小行星，我们就可以大大简化代码。\n\
  \n## 使用对象构造函数\n\n对象构造函数是创建多个相似对象的好方法，而且容易创建。只需定义一个函数，并在函数内部将数据赋给特殊的`this`关键字。清单\
  \ 7-8 是一个方便的对象构造函数，用于创建与前例类似的小行星。将其放入新的库文件`objects.js`中，并在页面的`<head>`元素中添加一个新的`<script>`元素。\n\
  \n```javascript\nfunction Asteroid(segments, radius, noise) {\n    this.x = context.canvas.width\
  \ * Math.random();\n    this.y = context.canvas.height * Math.random();\n    this.angle\
  \ = 0;\n    this.x_speed = context.canvas.width * (Math.random() - 0.5);\n    this.y_speed\
  \ = context.canvas.height * (Math.random() - 0.5);\n    this.rotation_speed = 2\
  \ * Math.PI * (Math.random() - 0.5);\n    this.radius = radius;\n    this.noise\
  \ = noise;\n    this.shape = [];\n    for(let i = 0; i < segments; i++) {\n    \
  \    this.shape.push(Math.random() - 0.5);\n    }\n}\n```\n\n清单 7-8 一个对象构造函数\n\n\
  为了在代码中识别构造函数，通常建议（但非强制）将其首字母大写。这里我们将构造函数命名为`Asteroid`。我们在函数内将所有变量赋给了`this`关键字的属性。注意我们接受了三个参数：`segments`（分段数）、`radius`（半径）和`noise`（噪声）。其他变量要么是随机定义的，要么有默认值，要么由提供的参数推导得出。我们甚至没有将`segments`参数存储为属性，它仅用于在`shape`属性中分配正确数量的元素。要使用构造函数创建对象实例，必须使用`new`关键字，如下所示：\n\
  \n```javascript\nvar asteroid = new Asteroid(24, 50, 0.2);\n```\n\n用上述单行代码替换对象字面量，更新你的代码。确保在页面中包含了构造函数函数的链接。看着你的小行星在深邃太空中不可阻挡地继续它的旅程。满意地发现，你的代码现在组织得比以前好多了。但然后呢？我们为什么要费心这样组织代码？\n\
  \n\n\n## 扩展小行星原型\n\nJavaScript 是一个基于原型的系统。所有通过构造函数创建的对象都将共享同一个原型。JavaScript 中对象的一个巨大优势在于，我们在该原型上定义的任何属性或方法都将对我们对象类型的所有实例可用。这就是我们能够轻松绘制和更新多个小行星的途径。假设我们创建了一个包含许多小行星的数组。如果在\
  \ `Asteroid.prototype` 上定义了 `update` 和 `draw` 函数，我们就能通过一次方法调用来更新或绘制任意一颗小行星。遍历我们的\
  \ `Asteroid` 对象并调用相应的方法将变得非常简单，而关于小行星行为的所有智能逻辑都将集中放置在 `Asteroid.prototype` 上的一处位置。\n\
  \n清单 7-9 展示了 `Asteroid.prototype` 上的一个 `update` 函数。将此函数添加到 `objects.js` 中，确保在构造函数定义之后添加。\n\
  \n```\nAsteroid.prototype.update = function(elapsed) {\n  if(this.x - this.radius\
  \ + elapsed * this.x_speed > context.canvas.width) {\n    this.x = -this.radius;\n\
  \  }\n  if(this.x + this.radius + elapsed * this.x_speed < 0) {\n    this.x = context.canvas.width\
  \ + this.radius;\n  }\n  if(this.y - this.radius + elapsed * this.y_speed > context.canvas.height)\
  \ {\n    this.y = -this.radius;\n  }\n  if(this.y + this.radius + elapsed * this.y_speed\
  \ < 0) {\n    this.y = context.canvas.height + this.radius;\n  }\n  this.x += elapsed\
  \ * this.x_speed;\n  this.y += elapsed * this.y_speed;\n  this.angle = (this.angle\
  \ + this.rotation_speed * elapsed) % (2 * Math.PI);\n}\n```\n\n**清单 7-9** 一个原型方法\n\
  \n这与我们最初的 `update` 函数几乎相同，只是现在引用了对象的实例属性。现在，我们可以用清单 7-10 中简单的一行代码来替换全局的 `update`\
  \ 函数。\n\n```\nfunction update(elapsed) {\n  asteroid.update(elapsed);\n}\n```\n\n\
  **清单 7-10** 简化的 `update` 函数\n\n刷新页面应该会看到小行星仍在运行。除了代码质量之外，一切都没有改变。现在，以同样的方式将清单 7-11\
  \ 中的 `draw` 函数添加到 `Asteroid.prototype` 上。\n\n```\nAsteroid.prototype.draw = function(ctx,\
  \ guide) {\n  ctx.save();\n  ctx.translate(this.x, this.y);\n  ctx.rotate(this.angle);\n\
  \  draw_asteroid(ctx, this.radius, this.shape, {\n    guide: guide,\n    noise:\
  \ this.noise\n  });\n  ctx.restore();\n}\n```\n\n**清单 7-11** 另一个原型方法\n\n同样，我们只是将现有代码转移到函数中，并指定了实例变量。我们还指定了两个参数：上下文\
  \ `ctx` 和可选的 `guide`。我们的全局 `draw` 函数现在如清单 7-12 所示。\n\n```\nfunction draw(ctx, guide)\
  \ {\n  if(guide) {\n    draw_grid(ctx);\n  }\n  asteroid.draw(ctx, guide);\n}\n\
  ```\n\n**清单 7-12** 简化的 `draw` 函数\n\n变化不大。我们只是将所有绘制小行星的代码替换为对前面函数的单一调用。`guide` 的绘制仍然保留，因为这是一个全局关注点，与单个小行星无关。\n\
  \n## 处理多个小行星\n\n现在，基本的小行星“类”已经完成，我们可以尝试处理多个小行星实例了。根据清单 7-13 更新你的代码。\n\n```\nvar\
  \ asteroids = [\n  new Asteroid(24, 50, 0.2),\n  new Asteroid(24, 50, 0.5),\n  new\
  \ Asteroid(5, 50, 0.2)\n];\n\nfunction draw(ctx, guide) {\n  if(guide) {\n    draw_grid(ctx);\n\
  \  }\n  asteroids.forEach(function(asteroid) {\n    asteroid.draw(context, guide);\n\
  \  });\n}\n\nfunction update(elapsed) {\n  asteroids.forEach(function(asteroid)\
  \ {\n    asteroid.update(elapsed);\n  });\n}\n```\n\n**清单 7-13** 三个小行星\n\n我们将 `asteroid`\
  \ 变量替换成了一个 `Asteroid` 对象数组。在我们的 `draw` 函数中，我们将对 `asteroid.draw` 函数的调用替换为一个循环，该循环会对\
  \ `asteroids` 数组中的每个项调用 `draw` 方法。最后，我们以类似的方式替换了对 `asteroid.update` 函数的调用。\n\n图\
  \ 7-2 显示了结果。刷新页面，看看你创造出来的这三个截然不同的小行星吧！\n\n![A455241_1_En_7_Fig2_HTML.jpg](img/A455241_1_En_7_Fig2_HTML.jpg)\n\
  \n**图 7-2** 三个漂浮的小行星\n\n## 总结\n\n在本章中，我们重构了代码结构。现在，我们将小行星数据的存储与更新，以及小行星在画布上的渲染都整合到一个新的对象类型中。我们在代码中运用的逻辑与之前几乎相同。我们没有改变小行星的绘制或更新方式；我们只是为代码增加了结构。这种额外的结构使我们能够通过简单地调用构造函数来创建小行星。然后，我们可以非常方便地在小行星对象上调用方法。\n\
  \n在清单 7-13 中，一些小的改动使我们能够并行地向场景中添加任意数量的小行星。如果没有这次重构，管理起来将会困难得多。\n\n© Graeme Stuart\
  \ 2017  \nGraeme Stuart, *《JavaScript 游戏开发入门》*  \n[`doi.org/10.1007/978-1-4842-3252-1_8`](https://doi.org/10.1007/978-1-4842-3252-1_8)\n\
  \n"
- "# 8. 实践对象\n\nGraeme Stuart¹\n\n(1) 英国莱斯特郡马基特哈伯勒\n\n面向对象方法的好处现在应该很清楚了。我们可以通过简单直观的\
  \ API 来设计我们的对象（`Asteroid`、`Ship` 等）。我们的对象会跟踪自己的状态，并在我们要求时（在其 `update` 函数中）更新自身。通过简单的函数调用（它们的\
  \ `draw` 函数），它们也能轻松地绘制到画布的正确位置。游戏循环本身可以依次更新所有对象，然后绘制它们。我们应该能够毫不费力地阅读高级代码。所有繁杂的细节都委托给了对象本身。在本章中，我们将通过一个熟悉的示例来实践这种使用对象的方式。\n\
  \n## 为什么使用对象？\n\n现代开发实践中一个重要的点是，实现的效率与我们生成代码的清晰度之间通常需要权衡。对于像这样一个简单的游戏，低端机器的计算能力已经绰绰有余，我们应该将注意力集中在使代码易于理解上。虽然实现的效率非常重要，并且我们应该始终默认追求高效，但我们不应让这一点影响代码的整体设计。事实上，我们有时可能会主动选择牺牲效率来换取清晰度。通过将底层代码推入对象（并将这些代码移入库模块），我们将底层的实现细节隐藏起来。这样，我们的顶层作用域（当前我们在全局作用域中编码）就变得易于理解，并且可以专注于更高级别的游戏逻辑。我们可以在无需思考小行星行为如何实现或小行星如何绘制的情况下处理这些代码，从而保持关注点分离，并使我们能够专注于手头的任务。\n\
  \n\n\n## 被鬼魂追逐的吃豆人\n\n在接下来的几章中，我们将深入编写小行星游戏的代码。不过在此之前，我们先花点时间回顾一下游戏设计，看看上一章应用的原理如何应用到另一个涉及吃豆人的伪游戏中。我们将为吃豆人定义行为，并创建一个新对象来表示追逐吃豆人的鬼魂。吃豆人可以在画布上水平和垂直移动，并且会像之前的吃豆人和小行星示例一样环绕画布边界。偶尔，他会随机决定向左或向右转（顺时针或逆时针方向）。他将被鬼魂追逐。鬼魂的优势在于能够向任意方向移动，并且会被编程为径直朝吃豆人逼近。我们将通过让吃豆人速度更快来确保鬼魂难以得手。\n\
  \n创建一个名为 `exercise8` 的新文件夹，将常见的库和样式表复制到新文件夹中。添加一个名为 `exercise8.html` 的新模板，并像之前一样包含指向\
  \ `drawing.js` 和 `objects.js` 的链接。从列表 8-1 中的代码开始。这段代码实例化了一个 `PacMan` 对象，在各自的函数中更新和绘制它，并通过主游戏循环函数\
  \ `frame` 控制一切。\n\n```html\n<!doctype html>\n<html>\n  <head>\n    <title>动画</title>\n\
  \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
  ></script>\n    <script src=\"objects.js\"></script>\n  </head>\n  <body>\n    <h1>动画</h1>\n\
  \    <canvas id=\"pacman\" width=\"300\" height=\"300\"></canvas>\n    <script>\n\
  \      var context = document.getElementById(\"pacman\").getContext(\"2d\");\n \
  \     pacman = new PacMan(150, 150, 20, 120);\n      function draw(ctx, guide) {\n\
  \        pacman.draw(ctx);\n      }\n      function update(elapsed) {\n        pacman.update(elapsed,\
  \ 300, 300);\n      }\n      var previous, elapsed;\n      function frame(timestamp)\
  \ {\n        context.clearRect(0, 0, context.canvas.width, context.canvas.height);\n\
  \        if (!previous) previous = timestamp;\n        elapsed = timestamp - previous;\n\
  \        update(elapsed / 1000);\n        draw(context, true);\n        previous\
  \ = timestamp;\n        window.requestAnimationFrame(frame);\n      }\n      window.requestAnimationFrame(frame);\n\
  \    </script>\n  </body>\n</html>\n```\n\n**列表 8-1** 一个简单模板\n\n## `PacMan` 对象\n\
  \n现在我们需要在 `objects.js` 中定义 `PacMan` 构造函数。吃豆人很简单：我们通过参数设置其半径和速度。我们将其初始位置设为画布中心。在内部，吃豆人拥有\
  \ `x_speed` 和 `y_speed`（初始时向右移动）。他还拥有一个用于确定朝向的 `angle` 属性，以及一个记录嘴巴在咀嚼周期中位置的 `mouth_angle`\
  \ 属性。将列表 8-2 添加到你的 `objects.js` 库中。注意没有提供默认值。\n\n```javascript\nfunction PacMan(x,\
  \ y, radius, speed) {\n  this.x = x;\n  this.y = y;\n  this.radius = radius;\n \
  \ this.speed = speed;\n  this.angle = 0;\n  this.x_speed = speed;\n  this.y_speed\
  \ = 0;\n  this.time = 0;\n  this.mouth = 0;\n}\n```\n\n**列表 8-2** `PacMan` 构造函数\n\
  \n`PacMan.prototype.draw` 方法应该看起来很熟悉。它与 `Asteroid` 的相同。将列表 8-3 添加到构造函数之后。\n\n```javascript\n\
  PacMan.prototype.draw = function(ctx) {\n  ctx.save();\n  ctx.translate(this.x,\
  \ this.y);\n  ctx.rotate(this.angle);\n  draw_pacman(ctx, this.radius, this.mouth);\n\
  \  ctx.restore();\n}\n```\n\n**列表 8-3** `PacMan.prototype.draw` 方法\n\n现在，在我们编写 `PacMan.prototype.update`\
  \ 函数中吃豆人的行为之前，我们需要几个辅助函数。我们需要的主要辅助函数是一个能让吃豆人向左或向右旋转 90 度的函数。列表 8-4 展示了这个新函数；将其添加到你的库中。\n\
  \n```javascript\nPacMan.prototype.turn = function(direction) {\n  if(this.y_speed)\
  \ {\n    // 如果我们在垂直移动\n    // 设置水平速度并应用方向\n    this.x_speed = -direction * this.y_speed;\n\
  \    // 清除垂直速度并旋转\n    this.y_speed = 0;\n    this.angle = this.x_speed > 0 ? 0\
  \ : Math.PI;\n  } else {\n    // 如果我们在水平移动\n    // 设置垂直速度并应用方向\n    this.y_speed\
  \ = direction * this.x_speed;\n    // 清除水平速度并旋转\n    this.x_speed = 0;\n    this.angle\
  \ = this.y_speed > 0 ? 0.5 * Math.PI : 1.5 * Math.PI;\n  }\n}\n```\n\n**列表 8-4**\
  \ `PacMan.prototype.turn` 方法\n\n此函数依赖于一个限制条件：我们的吃豆人只能在水平和垂直方向上移动。也就是说，我们依赖于 `x_speed`\
  \ 或 `y_speed` 其中一个始终为 0 的事实。函数首先测试我们是垂直移动还是水平移动。然后相应地改变移动方向，并调整角度，使吃豆人始终面朝正确的方向。该函数接受一个参数，用于选择是左转还是右转。为了使\
  \ API 更清晰，我们可以添加几个中间方法，如列表 8-5 所示。\n\n```javascript\nPacMan.prototype.turn_left\
  \ = function() {\n  this.turn(-1);\n}\n\nPacMan.prototype.turn_right = function()\
  \ {\n  this.turn(1);\n}\n```\n\n**列表 8-5** 辅助方法使 API 更友好\n\n有了这些方法，我们无需记住辅助函数的 API\
  \ 规则，只需调用相应的函数即可让吃豆人左转或右转。现在，我们可以在 `PacMan.prototype.update` 函数中以非常清晰的方式使用这些函数，保持代码简洁明了。添加列表\
  \ 8-6 中的代码。\n\n```javascript\nPacMan.prototype.update = function(elapsed, width,\
  \ height) {\n  // 平均每 100 帧执行一次\n  if(Math.random() <= 0.01) {\n    if(Math.random()\
  \ < 0.5) {\n      this.turn_left();\n    } else {\n      this.turn_right();\n  \
  \  }\n  }\n  if(this.x - this.radius + elapsed * this.x_speed > width) {\n    this.x\
  \ = -this.radius;\n  }\n  if(this.x + this.radius + elapsed * this.x_speed < 0)\
  \ {\n    this.x = width + this.radius;\n  }\n  if(this.y - this.radius + elapsed\
  \ * this.y_speed > height) {\n    this.y = -this.radius;\n  }\n  if(this.y + this.radius\
  \ + elapsed * this.y_speed < 0) {\n    this.y = height + this.radius;\n  }\n  this.x\
  \ += this.x_speed * elapsed;\n  this.y += this.y_speed * elapsed;\n  this.time +=\
  \ elapsed;\n  this.mouth = Math.abs(Math.sin(2 * Math.PI * this.time));\n}\n```\n\
  \n**列表 8-6** `PacMan.prototype.update` 方法\n\n第一个代码块平均每 100 帧才运行一次。它随机选择调用 `turn_left`\
  \ 或 `turn_right` 函数。这会控制 `x_speed` 和 `y_speed` 属性以及 `angle` 属性。接下来的四个代码块应该与前面提到的\
  \ `Asteroid.prototype.update` 函数类似。在每个块中，我们检查是否即将穿过画布的某条边。如果确实穿过了边界，我们就将吃豆人定位到画布的对侧。完成移动后，我们像往常一样更新\
  \ `x` 和 `y` 坐标。注意我们已经去除了对全局上下文的任何依赖。我们接受 `width` 和 `height` 参数，并用它们来确定 `x` 和 `y`\
  \ 属性在何处环绕。最后，我们有两行代码更新 `mouth` 值，该值决定了嘴巴张开的程度。第一行通过已流逝的时间累加 `time`。第二行将 `mouth`\
  \ 更新为 `time` 值的正弦绝对值。这会使 `mouth` 以正弦波形式变化，让嘴巴每秒张开和闭合两次。\n\n创建一个全局的 `PacMan` 对象，并更新你的全局\
  \ `draw` 和 `update` 函数来绘制和更新它。当你用浏览器打开文件时，应该能看到吃豆人在咀嚼并随机转弯。图 8-1 展示了结果。\n\n![A455241_1_En_8_Fig1_HTML.jpg](img/A455241_1_En_8_Fig1_HTML.jpg)\n\
  \n**图 8-1** 吃豆人咀嚼和转弯\n\n## 鬼魂对象\n\n\n\n幽灵会沿着直线直接向 Pac-Man 移动。它们会有不同的颜色和不同的速度。它们不需要环绕画布，因为它们总是向\
  \ Pac-Man 移动。由于 Pac-Man 会环绕画布，它们会转身跟随他。绘制 Pac-Man 幽灵相当棘手。这里有一个基本方法。将代码清单 8-7 复制到`drawing.js`中。\n\
  \n```javascript\nfunction draw_ghost(ctx, radius, options) {  \n  options = options\
  \ || {}  \n  var feet = options.feet || 4;  \n  var head_radius = radius * 0.8;\
  \  \n  var foot_radius = head_radius / feet;  \n  ctx.save();  \n  ctx.strokeStyle\
  \ = options.stroke || \"white\";  \n  ctx.fillStyle = options.fill || \"red\"; \
  \ \n  ctx.lineWidth = options.lineWidth || radius * 0.05;  \n  ctx.beginPath();\
  \  \n  for(foot = 0; foot < feet; foot++) {  \n    ctx.arc(  \n      (2 * foot_radius\
  \ * (feet - foot)) - head_radius - foot_radius,  \n      radius - foot_radius, \
  \ \n      foot_radius, 0, Math.PI  \n     );  \n  }  \n  ctx.lineTo(-head_radius,\
  \ radius - foot_radius);  \n  ctx.arc(0, head_radius - radius, head_radius, Math.PI,\
  \ 2 * Math.PI);  \n  ctx.closePath();  \n  ctx.fill();  \n  ctx.stroke();  \n  ctx.restore();\
  \  \n}\n```\n\n**代码清单 8-7 绘制幽灵**\n\n我们绘制一系列倒置的半圆作为“脚”，然后绘制一条线连接到头部，再绘制另一个半圆作为头部。然后闭合路径完成绘制。计算所有这些元素的位置很棘手，但一旦完成，一切就能正常工作，你可以忘记它。图\
  \ 8-2 显示了一个带有眼睛的幽灵。\n\n![A455241_1_En_8_Fig2_HTML.jpg](img/A455241_1_En_8_Fig2_HTML.jpg)\n\
  \n**图 8-2 一个带有五个“脚”的大红色幽灵**\n\n尝试为你的幽灵添加眼睛。可以使用填充的黑色圆形，但用白色圆形内嵌黑色圆形会更有特色。对于`Ghost`构造函数，我们指定半径、速度和颜色作为参数。将代码清单\
  \ 8-8 复制到你的`objects.js`文件中。\n\n```javascript\nfunction Ghost(x, y, radius, speed,\
  \ colour) {  \n  this.x = x;  \n  this.y = y;  \n  this.radius = radius;  \n  this.speed\
  \ = speed;  \n  this.colour = colour;  \n}\n```\n\n**代码清单 8-8 Ghost 构造函数**\n\n我们简单地将给定的参数存储为属性——不提供默认值。代码清单\
  \ 8-9 中的`Ghost.prototype.draw`方法也很熟悉。我们将上下文变换到正确的位置，并调用`draw_ghost`函数，根据需要传入颜色属性。将其复制到构造函数之后的`objects.js`文件中。\n\
  \n```javascript\nGhost.prototype.draw = function(ctx) {  \n  ctx.save();  \n  ctx.translate(this.x,\
  \ this.y);  \n  draw_ghost(ctx, this.radius, {  \n    fill: this.colour  \n  });\
  \  \n  ctx.restore();  \n}\n```\n\n**代码清单 8-9 `Ghost.prototype.draw`方法**\n\n代码清单\
  \ 8-10 中的`Ghost.prototype.update`方法定义了幽灵的行为。我们引入一个名为`target`的额外参数。该方法计算幽灵与目标之间的角度，然后设置`x_speed`和`y_speed`属性，使幽灵以给定速度向目标移动。然后更新幽灵坐标以反映速度。\n\
  \n```javascript\nGhost.prototype.update = function(target, elapsed) {  \n  var angle\
  \ = Math.atan2(target.y - this.y, target.x - this.x);  \n  var x_speed = Math.cos(angle)\
  \ * this.speed;  \n  var y_speed = Math.sin(angle) * this.speed;  \n  this.x +=\
  \ x_speed * elapsed;  \n  this.y += y_speed * elapsed;  \n}\n```\n\n**代码清单 8-10\
  \ `Ghost.prototype.update`方法**\n\n在全局作用域中实例化一个包含四个`Ghost`对象的数组。将它们的位置初始化为画布上的随机位置。在`draw`和`update`函数中遍历每个幽灵，并调用相应的幽灵方法。你应该会看到幽灵在画布上追逐\
  \ Pac-Man，如图 8-3 所示。\n\n![A455241_1_En_8_Fig3_HTML.jpg](img/A455241_1_En_8_Fig3_HTML.jpg)\n\
  \n**图 8-3 幽灵追逐 Pac-Man**\n\n最终你应该得到类似代码清单 8-11 所示的代码。\n\n```html\n<!doctype html>\
  \  \n<html>  \n  <head>  \n    <title>Animation</title>  \n    <link rel=\"stylesheet\"\
  \ href=\"styles.css\">  \n    <script src=\"drawing.js\"></script>  \n    <script\
  \ src=\"objects.js\"></script>  \n  </head>  \n  <body>  \n    <h1>Animation</h1>\
  \  \n    <canvas id=\"pacman\" width=\"300\" height=\"300\"></canvas>  \n    <script>\
  \  \n      let context = document.getElementById(\"pacman\").getContext(\"2d\");\
  \  \n      let pacman = new PacMan(150, 150, 20, 120);  \n      let ghosts = [ \
  \ \n        new Ghost(Math.random() * 300, Math.random() * 300, 20, 70, 'red'),\
  \  \n        new Ghost(Math.random() * 300, Math.random() * 300, 20, 60, 'pink'),\
  \  \n        new Ghost(Math.random() * 300, Math.random() * 300, 20, 50, 'cyan'),\
  \  \n        new Ghost(Math.random() * 300, Math.random() * 300, 20, 40, 'orange')\
  \  \n      ]  \n      function draw(ctx, guide) {  \n        pacman.draw(ctx); \
  \ \n        ghosts.forEach(function(ghost) {  \n          ghost.draw(context, guide);\
  \  \n        });  \n      }  \n      function update(elapsed) {  \n        pacman.update(elapsed,\
  \ 300, 300);  \n        ghosts.forEach(function(ghost) {  \n          ghost.update(pacman,\
  \ elapsed);  \n        });  \n      }  \n      var previous, elapsed;  \n      function\
  \ frame(timestamp) {  \n        context.clearRect(0, 0, context.canvas.width, context.canvas.height);\
  \  \n        if (!previous) previous = timestamp;  \n        elapsed = timestamp\
  \ - previous;  \n        update(elapsed / 1000);  \n        draw(context, true);\
  \  \n        previous = timestamp;  \n        window.requestAnimationFrame(frame);\
  \  \n      }  \n      window.requestAnimationFrame(frame);  \n    </script>  \n\
  \  </body>  \n</html>\n```\n\n**代码清单 8-11 控制 Pac-Man 和幽灵**\n\n## 总结\n\n希望本章在一定程度上建立了清晰的模式。屏幕上需要的“东西”必须在每一帧中进行更新和绘制。我们可以通过定义带有构造函数的对象，并在对象原型上定义用于绘制和更新的方法，以非常有组织的方式做到这一点。这使得我们的全局`draw`和`update`函数非常简单——它们只需依次绘制和更新每个对象。练习够了！让我们继续开发我们的游戏。在下一章中，我们将继续为构建坚实的对象基础设施迈出几步。©\
  \ Graeme Stuart 2017 Graeme Stuart《Introducing JavaScript Game Development》`doi.org/10.1007/978-1-4842-3252-1_9`\n\
  \n"
- "# 9. 继承\n\nGraeme Stuart^（1） （1）英国莱斯特郡 Market Harborough\n\n在本章中，我们将开始构建 Asteroids\
  \ 游戏的最终版本。我们需要对象来描述小行星和我们的飞船，最终还需要对象来描述我们的炮弹，飞船将使用这些炮弹来摧毁小行星。在这种情况下，这些对象将共享一些共同特性，这使得它们成为继承的良好候选。继承是面向对象软件工程中的一个重要概念，因为它允许将潜在的复杂逻辑表达一次，并在多个对象类型中复用。我们将以惯用的方式——通过实践来学习。\n\
  \n\n\n## 设置模板\n\n首先，创建一个名为 `exercise9` 的新文件夹，将库文件和样式表复制到该文件夹中，并将清单 9-1 中的模板保存为 `exercise9.html`。和往常一样，我们将复用\
  \ `drawing.js` 和 `objects.js` 这两个库，分别用于存放绘图代码和对象定义。\n\n```html\n<!doctype html>\n\
  <html>\n  <head>\n    <title>继承</title>\n    <link rel=\"stylesheet\" href=\"styles.css\"\
  >\n    <script src=\"drawing.js\"></script>\n    <script src=\"objects.js\"></script>\n\
  \  </head>\n  <body>\n    <h1>继承</h1>\n    <canvas id=\"asteroids\" width=\"600\"\
  \ height=\"600\"></canvas>\n    <script>\n      'use strict';\n      var context\
  \ = document.getElementById(\"asteroids\").getContext(\"2d\");\n      function draw(ctx)\
  \ {\n        draw_grid(context);\n      }\n      function update(elapsed) {\n  \
  \    }\n      var previous;\n      function frame(timestamp) {\n        if (!previous)\
  \ previous = timestamp;\n        var elapsed = timestamp - previous;\n        context.clearRect(0,\
  \ 0, context.canvas.width, context.canvas.height);\n        update(elapsed/1000);\n\
  \        draw(context);\n        previous = timestamp;\n        window.requestAnimationFrame(frame);\n\
  \      }\n      window.requestAnimationFrame(frame);\n    </script>\n  </body>\n\
  </html>\n```\n\n清单 9-1 `exercise9.html` 结果应该是一个空白网格。我们增加了网格的尺寸以适配游戏。请注意，动画每秒绘制 60\
  \ 帧，只是每一帧的内容都相同。\n\n## 牛顿运动定律\n\n任何试图构建太空中漂浮物体模型的尝试，都应符合经典力学的三条基本定律：\n\n1. 除非受到外力作用，否则空间中物体的速度将保持不变。\n\
  2. 物体所受的力等于其质量乘以由此产生的加速度。\n3. 当一个物体推动另一个物体时，它也会受到大小相等、方向相反的反作用力。\n\n在创建 `Asteroid`\
  \ 对象时，我们按照牛顿第一定律对其行为进行了编码。`Asteroid` 实例存储了它们的速度，并简单地以该速度持续运动。由于没有外力作用，这正是小行星的行为方式。在我们的游戏中，玩家操控的是一艘漂浮在太空中的飞船。飞船的编码也需要遵循牛顿第一定律。事实上，游戏中的所有元素（除非你实现了某种激光，欢迎尝试）都应符合经典力学的这三条基本定律。\n\
  \n## 通用质量类\n\n\n\n## 将经典力学编码到 `Mass` 类中\n\n在本练习中，我们将把经典力学定律编码到一个通用 `Mass` 类中，并扩展该\
  \ `Mass` 类，以创建我们的 `Asteroid`（小行星）和 `Ship`（飞船）类。\n\n基础 `Mass` 类存储位置（`x` 和 `y` 坐标）以及速度（`x_speed`\
  \ 和 `y_speed`）。它还包含一个角度（`angle`）和一个旋转速度（`rotation_speed`）。将清单 9-2 所示的构造函数添加到你的 `objects.js`\
  \ 文件中。\n\n```\nfunction Mass(x, y, mass, radius, angle, x_speed, y_speed, rotation_speed)\
  \ {\n  this.x = x;\n  this.y = y;\n  this.mass = mass || 1;\n  this.radius = radius\
  \ || 50;\n  this.angle = angle || 0;\n  this.x_speed = x_speed || 0;\n  this.y_speed\
  \ = y_speed || 0;\n  this.rotation_speed = rotation_speed || 0;\n}\n```\n\n参数列表很长，因为我们不希望有复杂的默认行为。一个质量体需要所有这些参数才能正常运行。虽然为大多数参数提供了默认值，但在典型使用中，这些默认值不太可能被依赖。在大多数情况下，它们具有合理的默认值\
  \ 0，因此质量体默认是静止的。默认质量值为 1，半径为 50。`(x, y)` 坐标是必需的参数，否则 `Mass` 对象将位于画布原点，这会造成混淆。\n\n\
  清单 9-3 中的 `update` 方法负责执行牛顿第一定律。我们还用它来在质量体移动出画布边缘时将其回绕到画布中。将此方法复制到你的构造函数下方。\n\n\
  ```\nMass.prototype.update = function(elapsed, ctx) {\n  this.x += this.x_speed\
  \ * elapsed;\n  this.y += this.y_speed * elapsed;\n  this.angle += this.rotation_speed\
  \ * elapsed;\n  this.angle %= (2 * Math.PI);\n  if(this.x - this.radius > ctx.canvas.width)\
  \ {\n    this.x = -this.radius;\n  }\n  if(this.x + this.radius < 0) {\n    this.x\
  \ = ctx.canvas.width + this.radius;\n  }\n  if(this.y - this.radius > ctx.canvas.height)\
  \ {\n    this.y = -this.radius;\n  }\n  if(this.y + this.radius < 0) {\n    this.y\
  \ = ctx.canvas.height + this.radius;\n  }\n}\n```\n\n这应该是一种熟悉的模式，因为它与原始小行星的 `update`\
  \ 函数非常相似。一个区别是，这次我们将上下文（context）作为参数，因为这段代码现在位于 `objects.js` 库中，并且（或者应该）不了解我们主作用域中的画布或上下文。\n\
  \n我们通过清单 9-4 中简单的 `Mass.prototype.push` 方法来实现牛顿第二定律。用角度、力和经过的时间调用此方法，会将力应用于质量体，产生与质量成反比的加速度。将其添加到你的库中。\n\
  \n```\nMass.prototype.push = function(angle, force, elapsed) {\n  this.x_speed +=\
  \ elapsed * (Math.cos(angle) * force) / this.mass;\n  this.y_speed += elapsed *\
  \ (Math.sin(angle) * force) / this.mass;\n}\n```\n\n清单 9-5 中非常相似的 `Mass.prototype.twist`\
  \ 方法对角度执行相同的操作。正力使质量体顺时针旋转，负力使质量体逆时针旋转。同样，将其添加到你不断增长的代码库中。\n\n```\nMass.prototype.twist\
  \ = function(force, elapsed) {\n  this.rotation_speed += elapsed * force / this.mass;\n\
  }\n```\n\n我们还将添加清单 9-6 中所示的一对方法。这些方法计算 `Mass` 的速度和运动角度，之后会很有用。\n\n```\nMass.prototype.speed\
  \ = function() {\n  return Math.sqrt(Math.pow(this.x_speed, 2) + Math.pow(this.y_speed,\
  \ 2));\n}\n\nMass.prototype.movement_angle = function() {\n  return Math.atan2(this.y_speed,\
  \ this.x_speed);\n}\n```\n\n为了测试我们的父类 `Mass`，我们需要一个 `draw` 方法。该方法会在任何子类中被重写。添加清单\
  \ 9-7 中的方法。\n\n```\nMass.prototype.draw = function(c) {\n  c.save();\n  c.translate(this.x,\
  \ this.y);\n  c.rotate(this.angle);\n  c.beginPath();\n  c.arc(0, 0, this.radius,\
  \ 0, 2 * Math.PI);\n  c.lineTo(0, 0);\n  c.strokeStyle = \"#FFFFFF\";\n  c.stroke();\n\
  \  c.restore();\n}\n```\n\n我们简单地绘制一个圆和一条指向圆心的线，以指示 `Mass` 的位置、半径和角度。要测试这一点，实例化一个\
  \ `Mass` 对象，并定义全局的 `update` 和 `draw` 函数来驱动你的质量体。遵循清单 9-8 中的代码。\n\n```\nvar mass\
  \ = new Mass(context.canvas.width/2, context.canvas.height/2, 10, 20);\n\nfunction\
  \ draw() {\n  context.clearRect(0, 0, context.canvas.width, context.canvas.height);\n\
  \  draw_grid(context);\n  mass.draw(context);\n}\n\nfunction update(elapsed) {\n\
  \  mass.update(elapsed, context);\n}\n```\n\n刷新浏览器会显示我们的 `Mass` 对象静静地停留在画布中央，如图\
  \ 9-1 所示。它的 `x_speed`、`y_speed` 和 `rotation_speed` 均为 0（零），因此不会移动。当我们在全局的 `update`\
  \ 和 `draw` 方法中调用对象函数时，我们就将这些对象链接到了游戏循环中。我们有时会将这种将对象链接到游戏的工作称为管道代码或挂接对象。\n\n![A455241_1_En_9_Fig1_HTML.jpg](img/A455241_1_En_9_Fig1_HTML.jpg)\n\
  \n打开浏览器的开发者工具（在 Google Chrome 中按 F12），然后导航至 JavaScript 控制台，这使你可以与网页进行交互。在本例中，因为我们在全局作用域中定义变量，所以可以直接访问它们并调用方法。在控制台中输入\
  \ `mass`，你应该会看到打印出的 `mass` 变量。试着输入 `mass.twist(Math.PI, 10)`。这会施加一个扭转力，我们会看到质量体旋转。再次调用该方法会加速旋转。调用\
  \ `mass.push(0.75 * Math.PI, 10, 10)` 也是如此。质量体因推力而加速。在命令行上对此进行一些实验。思考一下，你可以定义任何你喜欢的方法，并对自己画布游戏拥有终极控制权。\n\
  \n## 一种简单的继承方法\n\n为了让我们的 `Asteroid` 类继承 `Mass` 的行为，我们需要操作对象原型。将清单 9-9 所示的函数放置在 `objects.js`\
  \ 的顶部，位于 `Mass` 构造函数之前。\n\n```\nfunction extend(ChildClass, ParentClass) {\n  var\
  \ parent = new ParentClass();\n  ChildClass.prototype = parent;\n  ChildClass.prototype.super\
  \ = parent.constructor;\n  ChildClass.prototype.constructor = ChildClass;\n}\n```\n\
  \n该函数模拟类并实现了一种简单的继承机制。要使用父类的属性和方法扩展子类，只需用两个类对象调用此函数即可。函数的第一行创建了父类的一个实例。子类的原型被替换为该实例。第三行提供了一种从子类构造函数内调用父类构造函数的方法。最后，子类原型的构造函数（即父类实例）被设置回子类。这种原型操作允许子类构造函数通过\
  \ `super` 方法将参数传递给父类构造函数。它不处理任何添加到原型上的额外方法。如果这些方法需要调用父类实现，则需要手动进行，我们稍后会看到这一点。\n\n\
  \n\n## 小行星\n\n清单 9-10 展示了我们如何创建 `Asteroid` 类作为 `Mass` 类的扩展。用清单 9-10 替换 `object.js`\
  \ 库中现有的 `Asteroid` 定义。\n\n```\nfunction Asteroid(mass, x, y, x_speed, y_speed, rotation_speed)\
  \ {\n  var density = 1; // kg per square pixel\n  var radius = Math.sqrt((mass /\
  \ density) / Math.PI);\n  this.super(mass, radius, x, y, 0, x_speed, y_speed, rotation_speed);\n\
  \  this.circumference = 2 * Math.PI * this.radius;\n  this.segments = Math.ceil(this.circumference\
  \ / 15);\n  this.segments = Math.min(25, Math.max(5, this.segments));\n  this.noise\
  \ = 0.2;\n  this.shape = [];\n  for(var i = 0; i < this.segments; i++) {\n    this.shape.push(2\
  \ * (Math.random() - 0.5));\n  }\n}\nextend(Asteroid, Mass);\n\nAsteroid.prototype.draw\
  \ = function(ctx, guide) {\n  ctx.save();\n  ctx.translate(this.x, this.y);\n  ctx.rotate(this.angle);\n\
  \  draw_asteroid(ctx, this.radius, this.shape, {\n    noise: this.noise,\n    guide:\
  \ guide\n  });\n  ctx.restore();\n}\n```\n\n清单 9-10 Asteroid 类\n\n`Asteroid` 构造器与我们之前的示例大致相同，但做了一些微小的改进。它接受六个参数，其中最重要的是质量（mass）和坐标\
  \ `(x, y)`。我们还允许设置速度和旋转速度，稍后拆分小行星时会用到这些参数。\n\n在内部，小行星根据给定的质量，基于固定的密度值计算出半径值。如果你想要更大或更小的小行星，调整密度值即可实现。然后我们调用\
  \ `this.super`，从 `extend` 函数可以看出，它是对父类构造器 `Mass` 的引用。通过调用它，我们设置了对象的 mass、radius、x、y、angle、x_speed、y_speed\
  \ 和 rotation_speed 属性。\n\n最后一步是设置小行星的形状。为此，我们首先计算周长，并用它来设置段数，以便较大的小行星拥有更多细节。我们确保段数至少为\
  \ 5，最多不超过 25。我们将噪声（noise）设置为 0.2，并像之前一样设置随机形状。\n\n定义完构造器后，我们调用 `extend` 函数，并传入子类\
  \ `Asteroid` 和父类 `Mass`。这就是将 `Asteroid.super` 设置为 `Mass` 构造器的过程——关键在于，它还将 `Asteroid.prototype`\
  \ 设置为 `Mass` 的一个实例。\n\n`Asteroid.prototype.draw` 方法并无新奇之处。它与我们之前的小行星示例相比没有变化。请注意，我们不需要定义\
  \ `Asteroid.prototype.update` 方法，因为从 `Mass` 继承来的方法已经满足所有需求。\n\n在画布中心创建一个质量随机的 `Asteroid`\
  \ 实例，如清单 9-11 所示。\n\n```\nvar asteroid = new Asteroid(\n  10000,\n  Math.random()\
  \ * context.canvas.width,\n  Math.random() * context.canvas.height\n);\n```\n\n\
  清单 9-11 实例化一个小行星\n\n连接 update 和 draw 函数并刷新浏览器。现在在浏览器控制台中再次使用我们的 `asteroid.push`\
  \ 和 `asteroid.twist` API 进行实验。注意，更大、更重的小行星需要更大的力才能获得相同的加速度。图 9-2 展示了一颗小行星。\n\n![A455241_1_En_9_Fig2_HTML.jpg](img/A455241_1_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2 一颗类似的小行星，但这次继承了质量属性\n\n尝试创建一个小行星列表（记得将 update 和 draw 函数连接到小行星对象上）。使用浏览器控制台依次推动和旋转每个小行星。\n\
  \n## 飞船\n\n现在我们可以对飞船进行同样的操作。飞船就像小行星一样，是漂浮在太空中的一个质量体。将清单 9-12 中的代码添加到你的库中。\n\n```\n\
  function Ship(x, y) {\n  this.super(x, y, 10, 20, 1.5 * Math.PI);\n}\nextend(Ship,\
  \ Mass);\n\nShip.prototype.draw = function(c, guide) {\n  c.save();\n  c.translate(this.x,\
  \ this.y);\n  c.rotate(this.angle);\n  c.strokeStyle = \"white\";\n  c.lineWidth\
  \ = 2;\n  c.fillStyle = \"black\";\n  draw_ship(c, this.radius, {\n    guide: guide\n\
  \  });\n  c.restore();\n}\n```\n\n清单 9-12 Ship 类\n\n在你的 `exercise9.html` 文件中，添加一些代码来正确设置你的小行星和飞船。尝试自动推动和旋转小行星，让它们漂浮到太空中。在画布正中央实例化一艘飞船。清单\
  \ 9-13 展示了一种方法。\n\n```\nvar asteroids = [];\nfor (let i=0; i<4; i++) {\n  let asteroid\
  \ = new Asteroid(\n    Math.random() * context.canvas.width,\n    Math.random()\
  \ * context.canvas.height,\n    2000 + Math.random() * 8000\n  );\n  asteroid.push(Math.random()\
  \ * 2 * Math.PI, 2000, 60);\n  asteroid.twist((Math.random()-0.5) * 500, 60);\n\
  \  asteroids.push(asteroid);\n}\n\nvar ship = new Ship(context.canvas.width / 2,\
  \ context.canvas.height / 2);\n```\n\n清单 9-13 设置一个简单场景\n\n我们现在有了一组小行星，每一颗都已被施加了推动和旋转以使其启动。我们还在画布中央有一艘飞船。将所有游戏元素连接到\
  \ update 和 draw 函数以激活它们。尝试在浏览器控制台中推动和旋转飞船。图 9-3 展示了你应该能够生成的场景。\n\n![A455241_1_En_9_Fig3_HTML.jpg](img/A455241_1_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3 飞船和小行星都继承了质量属性\n\n现在让我们摆弄一下飞船。将全局 update 函数修改为清单 9-14 所示，然后刷新浏览器。\n\n```\n\
  function update(elapsed) {\n  // 如果几乎停止，就转向\n  if(Math.abs(ship.speed()) < 15) {\n\
  \    ship.angle += Math.PI * 2 * 0.01;\n  }\n  // 如果速度较快，就转向以减速\n  if(Math.abs(ship.speed())\
  \ > 100) {\n    ship.angle = ship.movement_angle() + Math.PI;\n  }\n  // 朝其指向的方向推动（推进器？）\n\
  \  ship.push(ship.angle, 1000, elapsed)\n\n  asteroids.forEach(function(asteroid)\
  \ {\n    asteroid.update(elapsed, context);\n  })\n\n  ship.update(elapsed, context);\n\
  }\n```\n\n清单 9-14 摆弄飞船\n\n这里我们实现了一套简单的指令来控制飞船。我们让飞船一直向前加速（仿佛飞船的推进器一直开启）。如果飞船速度超过每秒\
  \ 100 像素，我们就调头面向相反方向。当速度较慢时，我们增加飞船的角度。这开始看起来像一款游戏了。\n\n## 总结\n\n在本章中，你学习了如何定义通用功能并在多个游戏元素之间共享。我们在父类\
  \ `Mass` 上实现了方法，任何需要根据基本运动定律漂浮的具有质量的对象都可以继承这些方法。我们还尝试了开发一个场景。我们开发对象的这种结构化方式使得一切变得简单。它让我们能够编写非常简单的代码来初始化游戏元素，决定它们的初始行为，并将它们“接入”游戏循环以放置在画布上。这是一种强大的方法。\n\
  \n将对象的实现细节推送到其定义中，意味着我们在编写代码时可以轻松切换上下文，并专注于开发更复杂的功能，而不会被细节所拖累。在清单 9-14 中对飞船的操作展示了我们如何尝试在全局更新循环中控制游戏元素。但对于对象更本质的行为，我们应该将代码放置在对象定义中。在更仔细地研究飞船行为之前，我们需要探讨如何通过键盘获取用户输入来控制我们的游戏。\n\
  \n\n\n"
- '# 第三部分

  ## 构建游戏


  我们已经定义了主要的游戏对象，并让它们漂浮在太空中。现在需要添加游戏逻辑。就我们的《小行星》克隆版而言，我们需要让飞船在与小行星碰撞时能够承受伤害，并在摧毁小行星时累积分数。我们还需要让玩家能够以某种方式射击小行星，并实现“游戏结束”状态和游戏关卡。在进入游戏玩法方面之前，我们还将了解如何接受用户交互，以便能够控制飞船。


