    \n## About the Author\n\n**Graeme Stuart**\n\n![A455241_1_En_BookFrontmatter_Figb_HTML.jpg](OEBPS/Images/A455241_1_En_BookFrontmatter_Figb_HTML.jpg)\n\
    \nis a self-taught developer with 15 years of experience building data analysis\
    \ tools and web-based applications using JavaScript, Ruby, and Python. He has\
    \ a PhD in energy management, and much of his programming skill was originally\
    \ developed to that end. He taught JavaScript games programming to first-year\
    \ undergraduates for a while, and this book is the result. He now mostly uses\
    \ complexity science to encourage a deep understanding of agile approaches to\
    \ software engineering and to justify his outlandish research ambitions.\n\n##\
    \ About the Technical Reviewer\n\n**Aditya Shankar**\n\n![A455241_1_En_BookFrontmatter_Figc_HTML.jpg](OEBPS/Images/A455241_1_En_BookFrontmatter_Figc_HTML.jpg)\n\
    \nstarted programming in 1993 when he was first introduced to the world of computers.\
    \ With no access to the Internet or online tutorials at the time, he wrote his\
    \ first game in GW-BASIC by painstakingly retyping code from a book he found at\
    \ the local library. After graduating from the Indian Institute of Technology\
    \ Madras in 2001, he spent nearly a decade working as a software consultant, developing\
    \ trading and analytics systems for investment banks and large Fortune 100 companies,\
    \ before eventually leaving his corporate life behind so he could focus on doing\
    \ what he loved. A self-confessed technology geek, he has spent his time since\
    \ then working on his own projects and experimenting with every new language and\
    \ technology that he could, including HTML5. During this time, he became well\
    \ known for singlehandedly re-creating the famous RTS game Command and Conquer,\
    \ as well as Commandos: Behind Enemy Lines, entirely in HTML5. Apart from programming,\
    \ Aditya is passionate about billiards, salsa dancing, fitness, and personal development.\
    \ He maintains a personal website where he writes articles on game programming,\
    \ personal development, and billiards, and shares his popular game demos. When\
    \ he's not busy writing or working on his own projects, Aditya does consulting\
    \ work with companies to help them launch new software products and games."
