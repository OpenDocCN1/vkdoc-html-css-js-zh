    \  ship.push(ship.angle, 1000, elapsed)\n\n  asteroids.forEach(function(asteroid)\
    \ {\n    asteroid.update(elapsed, context);\n  })\n\n  ship.update(elapsed, context);\n\
    }\n```\n\n清单 9-14 摆弄飞船\n\n这里我们实现了一套简单的指令来控制飞船。我们让飞船一直向前加速（仿佛飞船的推进器一直开启）。如果飞船速度超过每秒\
    \ 100 像素，我们就调头面向相反方向。当速度较慢时，我们增加飞船的角度。这开始看起来像一款游戏了。\n\n## 总结\n\n在本章中，你学习了如何定义通用功能并在多个游戏元素之间共享。我们在父类\
    \ `Mass` 上实现了方法，任何需要根据基本运动定律漂浮的具有质量的对象都可以继承这些方法。我们还尝试了开发一个场景。我们开发对象的这种结构化方式使得一切变得简单。它让我们能够编写非常简单的代码来初始化游戏元素，决定它们的初始行为，并将它们“接入”游戏循环以放置在画布上。这是一种强大的方法。\n\
    \n将对象的实现细节推送到其定义中，意味着我们在编写代码时可以轻松切换上下文，并专注于开发更复杂的功能，而不会被细节所拖累。在清单 9-14 中对飞船的操作展示了我们如何尝试在全局更新循环中控制游戏元素。但对于对象更本质的行为，我们应该将代码放置在对象定义中。在更仔细地研究飞船行为之前，我们需要探讨如何通过键盘获取用户输入来控制我们的游戏。\n"
- fmt: "# Part III\n## Building the Game\n\nWe’ve defined our main game objects and\
    \ set them floating in space. Now we need to add the game logic. In the case of\
    \ our Asteroids clone, we need to enable the ship to take damage when it collides\
    \ with asteroids and to accrue score when it destroys asteroids. We’ll also enable\
    \ the player to shoot asteroids somehow and implement a “game over” state and\
    \ game levels. Before we get into the gameplay aspects, we’ll also find out how\
    \ to accept user interaction so the ship can be controlled.\n\n# 10. Simple Keyboard\
    \ Interaction\n\nNow that we have our main game objects in place, we need to hand\
    \ some control over to the user. In this chapter we’ll do this using keyboard\
    \ events. In JavaScript, you can use many events to control your program. We use\
    \ events by defining an event handler (a function) that will be called with the\
    \ event object as an argument when the event is triggered. In this case, we’ll\
    \ be using keyboard events—in particular, the `keyDown` and `keyUp` events. These\
    \ are called when keys are pressed and released. The event object contains information\
    \ about which key triggered the event.\n\n## Controlling Pac-Man\n\nLet’s demonstrate\
    \ how to use keyboard events with a simple example. Take a copy of your `exercise8`\
    \ folder and save it as `exercise10`. We’ll upgrade the example to take user input.\
    \ First, we need to add a few methods to our `PacMan` model. Add the new methods\
    \ shown in Listing 10-1 to your `PacMan` object.\n\n```\nPacMan.prototype.move_right\
    \ = function() {\n  this.x_speed = this.speed;\n  this.y_speed = 0;\n  this.angle\
    \ = 0;\n}\n\nPacMan.prototype.move_down = function() {\n  this.x_speed = 0;\n\
    \  this.y_speed = this.speed;\n  this.angle = 0.5 * Math.PI;\n}\n\nPacMan.prototype.move_left\
    \ = function() {\n  this.x_speed = -this.speed;\n  this.y_speed = 0;\n  this.angle\
    \ = Math.PI;\n}\n\nPacMan.prototype.move_up = function() {\n  this.x_speed = 0;\n\
    \  this.y_speed = -this.speed;\n  this.angle = 1.5 * Math.PI;\n}\n```\n\n**Listing\
    \ 10-1** Add Controls to PacMan\n\nNow run the code in your browser and try typing\
    \ `pacman.move_up()` in the console. You’ll see that you have some control over\
    \ Pac-Man’s movements. Now we need to hook up an event handler for the `keyDown`\
    \ event. Add the code in Listing 10-2 to the end of your HTML script.\n\n```\n\
    window.onkeydown = function(e) {\n  let key = e.key || e.keyCode;\n  switch(key)\
    \ {\n    case \"ArrowLeft\":\n    case 37: // left arrow keyCode\n      pacman.move_left();\n\
    \      break;\n    case \"ArrowUp\":\n    case 38: // up arrow keyCode\n     \
    \ pacman.move_up();\n      break;\n    case \"ArrowRight\":\n    case 39: // right\
    \ arrow keyCode\n      pacman.move_right();\n      break;\n    case \"ArrowDown\"\
    :\n    case 40: // down arrow keyCode\n      pacman.move_down();\n      break;\n\
    \  }\n}\n```\n\n**Listing 10-2** Handle the `onkeydown` Event\n\nNow refresh the\
    \ browser, and you should be able to control Pac-Man by pressing the arrow keys!\
    \ The handler is triggered on every key press with an event object as the argument.\
    \ The event attribute `event.key` contains a string representation for the key\
    \ that was pressed. In some browsers (including Safari at the time of writing),\
    \ the `event.key` attribute isn’t supported, so we fall back to a deprecated API\
    \ using `event.keyCode`. This is irritating but necessary if you want to support\
    \ the most common browsers. For a list of `keyCode`s, see [http://keycode.info](http://keycode.info).\
    \ Note that the original behavior of occasionally changing direction is still\
    \ included in the `PacMan.prototype.update` method. Remove it to give yourself\
    \ full control over Pac-Man. You can remove quite a lot of code.\n\nThis approach\
    \ has a serious problem. The arrow keys already have a function in most browsers.\
    \ Imagine your canvas is part of a larger page with content below it. It’s normal\
    \ and expected that the arrow keys can be used to scroll the page down to see\
    \ that content. But because we placed the event handler on the main window object,\
    \ we’re overriding this behavior, and now the arrow keys won’t scroll the page.\
    \ A more polite approach is to add the handler just to the canvas element. This\
    \ requires the focus to be set to the canvas element in order for the key presses\
    \ to be handled by our code. If the canvas doesn’t have the focus, the handler\
    \ isn’t triggered.\n\nFirst, we need to give our canvas a `tabindex` attribute.\
    \ Without this, you can’t set the focus on the canvas. Edit your `<canvas>` element,\
    \ as shown in Listing 10-3.\n\n```\n<canvas id=\"pacman\" width=\"300\" height=\"\
    300\" tabindex=\"1\"></canvas>\n```\n\n**Listing 10-3** Handle the `onkeydown`\
    \ Event\n\nNow, we could simply change the reference from `window.onkeydown` to\
    \ `context.canvas.onkeydown`. Alternatively, we can define our handler as a function,\
    \ as shown in Listing 10-4.\n\n```\nfunction keydown_handler(e) {\n  let key =\
    \ e.key || e.keyCode;\n  let nothing_handled = false;\n  switch(key) {\n    case\
    \ \"ArrowLeft\":\n    case 37: // left arrow keyCode\n      pacman.move_left();\n\
    \      break;\n    case \"ArrowUp\":\n    case 38: // up arrow keyCode\n     \
    \ pacman.move_up();\n      break;\n    case \"ArrowRight\":\n    case 39: // right\
    \ arrow keyCode\n      pacman.move_right();\n      break;\n    case \"ArrowDown\"\
    :\n    case 40: // down arrow keyCode\n      pacman.move_down();\n      break;\n\
    \    default:\n      nothing_handled = true;\n  }\n  if(!nothing_handled) e.preventDefault();\n\
    }\n```\n\n**Listing 10-4** An Event Handler Function\n\nNotice that we’ve ensured\
    \ that we’re overriding only the keys we want to use. We’re using the `default`\
    \ case to set the `nothing_handled` variable when no keys are being handled. Notice\
    \ also the additional call to `e.preventDefault()` only applies when something\
    \ has been handled by our code. This call stops the default behavior of the event\
    \ (for example, scrolling the window) from happening. This means that standard\
    \ key combinations (such as `Ctrl+R` to refresh the page) aren’t blocked. We only\
    \ block default behavior for our chosen keys.\n\nNow we can connect it in a more\
    \ general way with the `addEventListener` method. This will only apply when a\
    \ key is pressed and the canvas has the focus. Listing 10-5 connects the `keydown`\
    \ event to our handler function.\n\n```\ncontext.canvas.addEventListener(\"keydown\"\
    , keydown_handler);\ncontext.canvas.focus();\n```\n\n**Listing 10-5** Add an Event\
    \ Listener and Set the Focus on the Canvas\n\nWe also set the focus on the canvas\
    \ programmatically so there’s no need to click the canvas. We can unset the focus\
    \ by clicking away from the canvas with the mouse or by using `Tab` to cycle around\
    \ all the selectable elements in the page. To get a visual indication of whether\
    \ the canvas has the focus, update your `styles.css` file as shown in Listing\
    \ 10-6.\n\n```\nbody {\n  text-align: center;\n  font-family: sans-serif;\n}\n\
    \ncanvas {\n  background-color: black;\n  border: 10px solid white;\n}\n\ncanvas:focus\
    \ {\n  border: 10px solid grey;\n}\n```\n\n**Listing 10-6** Highlight the Canvas\
    \ on Focus\n\nNow if we click anywhere else on the page, our canvas will lose\
    \ focus, and normal key handling will resume. If we then click the canvas, we\
    \ get control of the game, and the page no longer scrolls. We should also be able\
    \ to refresh the page with `Ctrl+R` while the canvas has the focus. Nice.\n\n\
    ## Summary\n\nThis short chapter has introduced the event handling API. You learned\
    \ how to define an event handler and get information from the event object. We\
    \ also discussed how to connect events to handler functions. These concepts will\
    \ be used extensively in our game. In the next chapter, we’ll take control of\
    \ our ship."
  raw: '# Part III

    Building the Game


    Building the Game We’ve defined our main game objects and set them floating in
    space. Now we need to add the game logic. In the case of our Asteroids clone,
    we need to enable the ship to take damage when it collides with asteroids and
    to accrue score when it destroys asteroids. We’ll also enable the player to shoot
    asteroids somehow and implement a “game over” state and game levels. Before we
    get into the gameplay aspects, we’ll also find out how to accept user interaction
    so the ship can be controlled.© Graeme Stuart 2017 Graeme StuartIntroducing JavaScript
    Game Development [https://doi.org/10.1007/978-1-4842-3252-1_10](#A455241_1_En_10_Chapter.xhtml)


    # 10. Simple Keyboard Interaction


    Graeme Stuart^(1 ) (1) Market Harborough, Leicestershire, UK   Now that we have
    our main game objects in place, we need to hand some control over to the user.
    In this chapter we’ll do this using keyboard events. In JavaScript, you can use
    many events to control your program. We use events by defining an event handler
    (a function) that will be called with the event object as an argument when the
    event is triggered. In this case, we’ll be using keyboard events—in particular,
    the keyDown and keyUp events. These are called when keys are pressed and released.
    The event object contains information about which key triggered the event.


    ## Controlling Pac-Man


    Let’s demonstrate how to use keyboard events with a simple example. Take a copy
    of your exercise8 folder and save it as exercise10\. We’ll upgrade the example
    to take user input. First, we need to add a few methods to our PacMan model. Add
    the new methods shown in Listing [10-1](#A455241_1_En_10_Chapter.xhtml#Par3) to
    your PacMan object. PacMan.prototype.move_right = function() {   this.x_speed
    = this.speed;   this.y_speed = 0;   this.angle = 0; } PacMan.prototype.move_down
    = function() {   this.x_speed = 0;   this.y_speed = this.speed;   this.angle =
    0.5 * Math.PI; } PacMan.prototype.move_left = function() {   this.x_speed = -this.speed;
      this.y_speed = 0;   this.angle = Math.PI; } PacMan.prototype.move_up = function()
    {   this.x_speed = 0;   this.y_speed = -this.speed;   this.angle = 1.5 * Math.PI;
    } Listing 10-1 Add Controls to PacMan Now run the code in your browser and try
    typing pacman.move_up() in the console. You’ll see that you have some control
    over Pac-Man’s movements. Now we need to hook up an event handler for the keyDown
    event. Add the code in Listing [10-2](#A455241_1_En_10_Chapter.xhtml#Par5) to
    the end of your HTML script. window.onkeydown = function(e) {   let key = e.key
    || e.keyCode;   switch(key) {     case "ArrowLeft":     case 37: // left arrow
    keyCode       pacman.move_left();       break;     case "ArrowUp":     case 38:
    // up arrow keyCode       pacman.move_up();       break;     case "ArrowRight":
        case 39: // right arrow keyCode       pacman.move_right();       break;     case
    "ArrowDown":     case 40: // down arrow keyCode       pacman.move_down();       break;
      } } Listing 10-2 Handle the onkeydown Event Now refresh the browser, and you
    should be able to control Pac-Man by pressing the arrow keys! The handler is triggered
    on every key press with an event object as the argument. The event attribute event.key
    contains a string representation for the key that was pressed. In some browsers
    (including Safari at the time of writing), the event.key attribute isn’t supported,
    so we fall back to a deprecated API using event.keyCode. This is irritating but
    necessary if you want to support the most common browsers. For a list of keyCodes,
    see [http://keycode.info](http://keycode.info) . Note that the original behavior
    of occasionally changing direction is still included in the PacMan.prototype.update
    method. Remove it to give yourself full control over Pac-Man. You can remove quite
    a lot of code. This approach has a serious problem. The arrow keys already have
    a function in most browsers. Imagine your canvas is part of a larger page with
    content below it. It’s normal and expected that the arrow keys can be used to
    scroll the page down to see that content. But because we placed the event handler
    on the main window object, we’re overriding this behavior, and now the arrow keys
    won’t scroll the page. A more polite approach is to add the handler just to the
    canvas element. This requires the focus to be set to the canvas element in order
    for the key presses to be handled by our code. If the canvas doesn’t have the
    focus, the handler isn’t triggered . First, we need to give our canvas a tabindex
    attribute. Without this, you can’t set the focus on the canvas. Edit your <canvas>
    element, as shown in Listing [10-3](#A455241_1_En_10_Chapter.xhtml#Par10). <canvas
    id="pacman" width="300" height="300" tabindex="1"></canvas> Listing 10-3 Handle
    the onkeydown Event Now, we could simply change the reference from window.onkeydown
    to context.canvas.onkeydown. Alternatively, we can define our handler as a function,
    as shown in Listing [10-4](#A455241_1_En_10_Chapter.xhtml#Par12). function keydown_handler(e)
    {   let key = e.key || e.keyCode;   let nothing_handled = false;   switch(key)
    {     case "ArrowLeft":     case 37: // left arrow keyCode       pacman.move_left();
          break;     case "ArrowUp":     case 38: // up arrow keyCode       pacman.move_up();
          break;     case "ArrowRight":     case 39: // right arrow keyCode       pacman.move_right();
          break;     case "ArrowDown":     case 40: // down arrow keyCode       pacman.move_down();
          break;     default:       nothing_handled = true;   }   if(!nothing_handled)
    e.preventDefault(); } Listing 10-4 An Event Handler Function Notice that we’ve
    ensured that we’re overriding only the keys we want to use. We’re using the default
    case to set the nothing_handled variable when no keys are being handled. Notice
    also the additional call to e.preventDefault() only applies when something has
    been handled by our code. This call stops the default behavior of the event (for
    example, scrolling the window) from happening. This means that standard key combinations
    (such as Ctrl+R to refresh the page) aren’t blocked. We only block default behavior
    for our chosen keys. Now we can connect it in a more general way with the addEventListener
    method. This will only apply when a key is pressed and the canvas has the focus.
    Listing [10-5](#A455241_1_En_10_Chapter.xhtml#Par15) connects the keydown event
    to our handler function. context.canvas.addEventListener("keydown", keydown_handler);
    context.canvas.focus(); Listing 10-5 Add an Event Listener and Set the Focus on
    the Canvas We also set the focus on the canvas programmatically so there’s no
    need to click the canvas. We can unset the focus by clicking away from the canvas
    with the mouse or by using Tab to cycle around all the selectable elements in
    the page. To get a visual indication of whether the canvas has the focus, update
    your styles.css file as shown in Listing [10-6](#A455241_1_En_10_Chapter.xhtml#Par17).
    body {   text-align: center;   font-family: sans-serif; } canvas {   background-color:
    black;   border: 10px solid white; } canvas:focus {   border: 10px solid grey;
    } Listing 10-6 Highlight the Canvas on Focus Now if we click anywhere else on
    the page, our canvas will lose focus, and normal key handling will resume. If
    we then click the canvas, we get control of the game, and the page no longer scrolls.
    We should also be able to refresh the page with Ctrl+R while the canvas has the
    focus. Nice.


    ## Summary


    This short chapter has introduced the event handling API. You learned how to define
    an event handler and get information from the event object. We also discussed
    how to connect events to handler functions. These concepts will be used extensively
    in our game. In the next chapter, we’ll take control of our ship.© Graeme Stuart 2017
    Graeme StuartIntroducing JavaScript Game Development [https://doi.org/10.1007/978-1-4842-3252-1_11](#A455241_1_En_11_Chapter.xhtml)'
  trans: "\n# 第三部分\n## 构建游戏\n\n我们已经定义了主要的游戏对象，并让它们漂浮在太空中。现在需要添加游戏逻辑。就我们的《小行星》克隆版而言，我们需要让飞船在与小行星碰撞时能够承受伤害，并在摧毁小行星时累积分数。我们还需要让玩家能够以某种方式射击小行星，并实现“游戏结束”状态和游戏关卡。在进入游戏玩法方面之前，我们还将了解如何接受用户交互，以便能够控制飞船。\n\
    \n# 10. 简单的键盘交互\n\n现在主要的游戏对象已经就位，我们需要将部分控制权交给用户。在本章中，我们将使用键盘事件来实现这一点。在 JavaScript\
    \ 中，你可以使用许多事件来控制程序的运行。我们通过定义一个事件处理函数来使用事件，当事件被触发时，该函数会以事件对象作为参数被调用。在本例中，我们将使用键盘事件——特别是\
    \ `keyDown` 和 `keyUp` 事件。这些事件在按下和释放按键时被调用。事件对象包含了关于哪个按键触发了事件的信息。\n\n## 控制吃豆人\n\
    \n让我们用一个简单的例子来演示如何使用键盘事件。复制你的 `exercise8` 文件夹，并另存为 `exercise10`。我们将升级该示例以接受用户输入。首先，我们需要向\
    \ `PacMan` 模型添加几个方法。将清单 10-1 所示的新方法添加到你的 `PacMan` 对象中。\n\n```\nPacMan.prototype.move_right\
    \ = function() {\n  this.x_speed = this.speed;\n  this.y_speed = 0;\n  this.angle\
    \ = 0;\n}\n\nPacMan.prototype.move_down = function() {\n  this.x_speed = 0;\n\
    \  this.y_speed = this.speed;\n  this.angle = 0.5 * Math.PI;\n}\n\nPacMan.prototype.move_left\
    \ = function() {\n  this.x_speed = -this.speed;\n  this.y_speed = 0;\n  this.angle\
    \ = Math.PI;\n}\n\nPacMan.prototype.move_up = function() {\n  this.x_speed = 0;\n\
    \  this.y_speed = -this.speed;\n  this.angle = 1.5 * Math.PI;\n}\n```\n\n**清单\
    \ 10-1** 为吃豆人添加控制功能\n\n现在在浏览器中运行代码，并尝试在控制台中输入 `pacman.move_up()`。你会看到你已经可以对吃豆人的运动进行一些控制了。现在我们需要为\
    \ `keyDown` 事件连接一个事件处理函数。将清单 10-2 中的代码添加到你的 HTML 脚本末尾。\n\n```\nwindow.onkeydown\
    \ = function(e) {\n  let key = e.key || e.keyCode;\n  switch(key) {\n    case\
    \ \"ArrowLeft\":\n    case 37: // 左箭头键的 keyCode\n      pacman.move_left();\n \
    \     break;\n    case \"ArrowUp\":\n    case 38: // 上箭头键的 keyCode\n      pacman.move_up();\n\
    \      break;\n    case \"ArrowRight\":\n    case 39: // 右箭头键的 keyCode\n     \
    \ pacman.move_right();\n      break;\n    case \"ArrowDown\":\n    case 40: //\
    \ 下箭头键的 keyCode\n      pacman.move_down();\n      break;\n  }\n}\n```\n\n**清单\
    \ 10-2** 处理 `onkeydown` 事件\n\n现在刷新浏览器，你应该可以通过按方向键来控制吃豆人了！每次按键时，处理函数都会被触发，并传入一个事件对象作为参数。事件属性\
    \ `event.key` 包含了所按按键的字符串表示形式。在某些浏览器（包括撰写本书时的 Safari）中，不支持 `event.key` 属性，因此我们需要回退到使用\
    \ `event.keyCode` 的已弃用 API。这虽然令人烦恼，但如果你希望支持大多数常见浏览器，则是必要的。有关 `keyCode` 的列表，请参见\
    \ [`keycode.info`](http://keycode.info)。请注意，原先偶尔改变方向的行为仍包含在 `PacMan.prototype.update`\
    \ 方法中。请将其移除，以便让你完全控制吃豆人。你可以移除相当多的代码。\n\n这种方法有一个严重的问题。在大多数浏览器中，方向键已经有其功能。想象一下，你的画布是一个更大页面的一部分，页面下方还有其他内容。正常情况下，我们期望使用方向键可以向下滚动页面以查看这些内容。但因为我们将事件处理函数放在了主窗口对象上，我们覆盖了这种行为，现在方向键将无法滚动页面。一种更礼貌的方法是将处理函数仅添加到画布元素上。这要求焦点设置在画布元素上，以便我们的代码能够处理按键事件。如果画布没有焦点，则处理函数不会被触发。\n\
    \n首先，我们需要给画布一个 `tabindex` 属性。没有这个属性，你将无法将焦点设置在画布上。编辑你的 `<canvas>` 元素，如清单 10-3\
    \ 所示。\n\n```\n<canvas id=\"pacman\" width=\"300\" height=\"300\" tabindex=\"1\"\
    ></canvas>\n```\n\n**清单 10-3** 处理 `onkeydown` 事件\n\n现在，我们可以简单地将引用从 `window.onkeydown`\
    \ 更改为 `context.canvas.onkeydown`。或者，我们可以将处理函数定义为一个函数，如清单 10-4 所示。\n\n```\nfunction\
    \ keydown_handler(e) {\n  let key = e.key || e.keyCode;\n  let nothing_handled\
    \ = false;\n  switch(key) {\n    case \"ArrowLeft\":\n    case 37: // 左箭头键的 keyCode\n\
    \      pacman.move_left();\n      break;\n    case \"ArrowUp\":\n    case 38:\
    \ // 上箭头键的 keyCode\n      pacman.move_up();\n      break;\n    case \"ArrowRight\"\
    :\n    case 39: // 右箭头键的 keyCode\n      pacman.move_right();\n      break;\n \
    \   case \"ArrowDown\":\n    case 40: // 下箭头键的 keyCode\n      pacman.move_down();\n\
    \      break;\n    default:\n      nothing_handled = true;\n  }\n  if(!nothing_handled)\
    \ e.preventDefault();\n}\n```\n\n**清单 10-4** 一个事件处理函数\n\n请注意，我们确保只覆盖了我们想要使用的按键。我们使用\
    \ `default` 分支来在没有处理任何按键时设置 `nothing_handled` 变量。同时注意，仅当我们的代码处理了某些事情时，才额外调用 `e.preventDefault()`。这个调用会阻止事件的默认行为（例如，滚动窗口）发生。这意味着标准按键组合（例如刷新页面的\
    \ `Ctrl+R`）不会被阻止。我们只对我们选择的按键阻止默认行为。\n\n现在，我们可以使用 `addEventListener` 方法以更通用的方式连接它。这仅当按下按键且画布拥有焦点时才会生效。清单\
    \ 10-5 将 `keydown` 事件连接到我们的处理函数。\n\n```\ncontext.canvas.addEventListener(\"keydown\"\
    , keydown_handler);\ncontext.canvas.focus();\n```\n\n**清单 10-5** 添加事件监听器并将焦点设置在画布上\n\
    \n我们还通过编程方式将焦点设置在画布上，这样就不需要点击画布了。我们可以通过用鼠标点击画布以外的位置，或者使用 `Tab` 键在页面所有可选中元素间循环，来取消焦点设置。为了直观地指示画布是否拥有焦点，请更新你的\
    \ `styles.css` 文件，如清单 10-6 所示。\n\n```\nbody {\n  text-align: center;\n  font-family:\
    \ sans-serif;\n}\n\ncanvas {\n  background-color: black;\n  border: 10px solid\
    \ white;\n}\n\ncanvas:focus {\n  border: 10px solid grey;\n}\n```\n\n**清单 10-6**\
    \ 在焦点状态下高亮画布\n\n现在，如果我们点击页面上的任何其他位置，画布将失去焦点，正常的按键处理将恢复。如果我们随后点击画布，我们将获得游戏的控制权，并且页面将不再滚动。当画布拥有焦点时，我们也应该能够使用\
    \ `Ctrl+R` 刷新页面。很好。\n\n## 本章小结\n\n本章简短地介绍了事件处理 API。你学习了如何定义事件处理函数以及如何从事件对象中获取信息。我们还讨论了如何将事件连接到处理函数。这些概念将在我们的游戏中广泛使用。在下一章中，我们将控制我们的飞船。\n"
- fmt: "# 11. Controlling the Ship\n\nGraeme Stuart (1) Market Harborough, Leicestershire,\
    \ UK\n\nIn this chapter we’ll finally implement user control of the ship. This\
    \ is where all the hard work in setting up our objects will begin to pay off.\
    \ At the end of this chapter you’ll be able to fly the ship gracefully around\
    \ the canvas and even shoot projectiles from the nose of the ship. As with the\
    \ Pac-Man example, we’ll need to add some properties to our `Ship` class so we\
    \ can use keyboard events to control the ship. The ship remains a mass floating\
    \ in space, so we only want to use the `Mass.prototype.push` and `Mass.prototype.twist`\
    \ methods to do the actual moving. Copy `exercise9.html` and all related files\
    \ (`styles.css` and the libraries `drawing.js` and `objects.js`) into a new folder\
    \ and rename the HTML file as `exercise11.html`. Remove all the ship-controlling\
    \ stuff from the global `update` function.\n\n## Thruster Control\n\nStarting\
    \ simply, the ship needs a thruster. When the thruster is on, the ship will be\
    \ pushed forwards. When the thruster is off, the ship will behave as normal. Update\
    \ the `Ship` constructor with the code in Listing 11-1.\n\n```\nfunction Ship(x,\
    \ y, power) {\n  this.super(x, y, 10, 20, 1.5 * Math.PI);\n  this.thruster_power\
    \ = power;\n  this.thruster_on = false;\n}\n```\n\nListing 11-1: Ship Thruster\
    \ Properties\n\nWe’ve added two properties to the ship. The `thruster_power` property\
    \ determines how much force is applied to the ship when the thruster is on. The\
    \ `thruster_on` property determines whether the thruster is on. The thruster is\
    \ initialized to off (that is, `thrusters_on` is set to `false`). We also make\
    \ the ship mass and size configurable. Update the ship instantiation in `exercise11.html`\
    \ to match Listing 11-2.\n\n```\nvar ship = new Ship(context.canvas.width / 2,\
    \ context.canvas.height / 2, 1000);\n```\n\nListing 11-2: Create a Nice Ship\n\
    \nNow we need to add a `Ship.prototype.update` method because the standard `Mass.prototype.update`\
    \ method isn't good enough any more. We want to push the ship in the direction\
    \ it’s pointing using the correct power, but only if `this.thruster_on` is `true`.\
    \ So, we call the `this.push` method with the angle (`this.angle`) and `this.thruster_power`\
    \ multiplied by the Boolean value `this.thruster_on`, as shown in Listing 11-3.\
    \ Boolean values are cast automatically to 1 or 0, so the result is exactly what\
    \ we need to calculate the force and apply it over the elapsed time.\n\n```\n\
    Ship.prototype.update = function(elapsed) {\n  this.push(this.angle, this.thruster_on\
    \ * this.thruster_power, elapsed);\n  Mass.prototype.update.apply(this, arguments);\n\
    }\n```\n\nListing 11-3: The Ship.prototype.update Method\n\nWe then call the `Mass.prototype.update`\
    \ method. We can’t call it on the `this` keyword because we’ve overwritten the\
    \ method on the `Ship.prototype`. Consequently, we need to use `function.apply`\
    \ to call the `Mass.prototype.update` method, passing in our `this` keyword to\
    \ reference the ship instance and the `arguments` list passed into the function.\
    \ This is a generic way to call methods of a parent class when the child class\
    \ has overridden them.\n\nNow that we’ve adapted the behavior of the ship, we\
    \ should be able to refresh the browser and turn on the thrusters via the console.\
    \ Type `ship.thruster_on = true` into the console and check that the ship responds\
    \ correctly.\n\nWe can add some visual feedback on the thruster state by updating\
    \ the `draw_ship` function. First, we should pass the `ship.thruster_on` property\
    \ into the call to `draw_ship`, as shown in Listing 11-4.\n\n```\nShip.prototype.draw\
    \ = function(c, guide) {\n  c.save();\n  c.translate(this.x, this.y);\n  c.rotate(this.angle);\n\
    \  draw_ship(c, this.radius, {\n    guide: guide,\n    thruster: this.thruster_on\n\
    \  });\n  c.restore();\n}\n```\n\nListing 11-4: The Ship.prototype.draw Method\n\
    \nNow add the code snippet in Listing 11-5 into the `draw_ship` function before\
    \ the ship is drawn. We draw a simple filled red curve with a yellow outline and\
    \ we put this before the ship is drawn so that the ship will hide the overlap\
    \ and it appears neat.\n\n```\nif(options.thruster) {\n  ctx.save();\n  ctx.strokeStyle\
    \ = \"yellow\";\n  ctx.fillStyle = \"red\";\n  ctx.lineWidth = 3;\n  ctx.beginPath();\n\
    \  ctx.moveTo(\n    Math.cos(Math.PI + angle * 0.8) * radius / 2,\n    Math.sin(Math.PI\
    \ + angle * 0.8) * radius / 2\n  )\n  ctx.quadraticCurveTo(-radius * 2, 0,\n \
    \   Math.cos(Math.PI - angle * 0.8) * radius / 2,\n    Math.sin(Math.PI - angle\
    \ * 0.8) * radius / 2\n  );\n  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n\
    }\n```\n\nListing 11-5: Addition to the draw_ship Function\n\nNow, setting the\
    \ `ship.thruster_on` property to `true` will make the ship move and will also\
    \ draw a filled red curve at the rear of the ship. Figure 11-1 shows the result\
    \ of turning the thruster on via the browser console.\n\n![A455241_1_En_11_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_11_Fig1_HTML.jpg)\n\
    \nFigure 11-1: Thruster indicator\n\nWe’ll complete this first step with a pair\
    \ of event handlers, one for `keydown` and one for `keyup`. First, add the helper\
    \ function to do the actual ship control, as shown in Listing 11-6.\n\n```\nfunction\
    \ key_handler(e, value) {\n  var nothing_handled = false;\n  switch(e.key || e.keyCode)\
    \ {\n    case \"ArrowUp\":\n    case 38: // up arrow\n      ship.thruster_on =\
    \ value;\n      break;\n    default:\n      nothing_handled = true;\n  }\n  if(!nothing_handled)\
    \ e.preventDefault();\n}\n```\n\nListing 11-6: Control the Ship Thruster\n\nThis\
    \ function takes an event and a value as arguments. If the key that triggered\
    \ the event is the up arrow (`\"ArrowUp\"` or `38`), then it sets the `ship.thruster_on`\
    \ property to whatever value is passed to it.\n\nFinally, we connect the event\
    \ handler function to event listeners on the canvas, as shown in Listing 11-7.\n\
    \n```\ncontext.canvas.addEventListener(\"keydown\", function(e) {\n  key_handler(e,\
    \ true);\n}, true);\ncontext.canvas.addEventListener(\"keyup\", function(e) {\n\
    \  key_handler(e, false);\n}, true);\n```\n\nListing 11-7: Event Handlers to Do\
    \ the Job\n\nFinally, we also need to set the `tabindex` of the canvas and call\
    \ `canvas.focus()`, as in the preceding exercise. Once we’ve done this, we should\
    \ find that pressing and releasing the up arrow controls the thruster!"
  raw: '# 11. Controlling the Ship


    Graeme Stuart^(1 ) (1) Market Harborough, Leicestershire, UK   In this chapter
    we’ll finally implement user control of the ship. This is where all the hard work
    in setting up our objects will begin to pay off. At the end of this chapter you’ll
    be able to fly the ship gracefully around the canvas and even shoot projectiles
    from the nose of the ship. As with the Pac-Man example, we’ll need to add some
    properties to our ship class so we can use keyboard events to control the ship.
    The ship remains a mass floating in space, so we only want to use the Mass.prototype.push
    and Mass.prototype.twist methods to do the actual moving. Copy exercise9.html
    and all related files (styles.css and the libraries drawing.js and objects.js)
    into a new folder and rename the HTML file as exercise11.html. Remove all the
    ship-controlling stuff from the global update function.


    ## Thruster Control


    Starting simply, the ship needs a thruster. When the thruster is on, the ship
    will be pushed forwards. When the thruster is off, the ship will behave as normal.
    Update the Ship constructor with the code in Listing [11-1](#A455241_1_En_11_Chapter.xhtml#Par4).
    function Ship(x, y, power) {   this.super(x, y, 10, 20, 1.5 * Math.PI);   this.thruster_power
    = power;   this.thruster_on = false; } Listing 11-1 Ship Thruster Properties We’ve
    added two properties to the ship. The thruster_power property determines how much
    force is applied to the ship when the thruster is on. The thruster_on property
    determines whether the thruster is on. The thruster is initialized to off (that
    is, thrusters_on is set to false). We also make the ship mass and size configurable.
    Update the ship instantiation in exercise11.html to match Listing [11-2](#A455241_1_En_11_Chapter.xhtml#Par6).
    var ship = new Ship(context.canvas.width / 2, context.canvas.height / 2, 1000);
    Listing 11-2 Create a Nice Ship Now we need to add a Ship.prototype.update method
    because the standard Mass.prototype.update method isn''t good enough any more.
    We want to push the ship in the direction it’s pointing using the correct power,
    but only if this.thruster_on is true. So, we call the this.push method with the
    angle (this.angle) and this.thruster_power multiplied by the Boolean value this.thruster_on,
    as shown in Listing [11-3](#A455241_1_En_11_Chapter.xhtml#Par8). Boolean values
    are cast automatically to 1 or 0, so the result is exactly what we need to calculate
    the force and apply it over the elapsed time. Ship.prototype.update = function(elapsed)
    {   this.push(this.angle, this.thruster_on * this.thruster_power, elapsed);   Mass.prototype.update.apply(this,
    arguments); } Listing 11-3 The Ship.prototype.update Method We then call the Mass.prototype.update
    method. We can’t call it on the this keyword because we’ve overwritten the method
    on the Ship.prototype. Consequently, we need to use function.apply to call the
    Mass.prototype.update method, passing in our this keyword to reference the ship
    instance and the arguments list passed into the function. This is a generic way
    to call methods of a parent class when the child class has overridden them. Now
    that we’ve adapted the behavior of the ship, we should be able to refresh the
    browser and turn on the thrusters via the console. Type ship.thruster_on = true
    into the console and check that the ship responds correctly. We can add some visual
    feedback on the thruster state by updating the draw_ship function. First, we should
    pass the ship.thruster_on property into the call to draw_ship, as shown in Listing
    [11-4](#A455241_1_En_11_Chapter.xhtml#Par12). Ship.prototype.draw = function(c,
    guide) {   c.save();   c.translate(this.x, this.y);   c.rotate(this.angle);   draw_ship(c,
    this.radius, {     guide: guide,     thruster: this.thruster_on   });   c.restore();
    } Listing 11-4 The Ship.prototype.draw Method Now add the code snippet in Listing
    [11-5](#A455241_1_En_11_Chapter.xhtml#Par14) into the draw_ship function before
    the ship is drawn. We draw a simple filled red curve with a yellow outline and
    we put this before the ship is drawn so that the ship will hide the overlap and
    it appears neat. if(options.thruster) {   ctx.save();   ctx.strokeStyle = "yellow";
      ctx.fillStyle = "red";   ctx.lineWidth = 3;   ctx.beginPath();   ctx.moveTo(
        Math.cos(Math.PI + angle * 0.8) * radius / 2,     Math.sin(Math.PI + angle
    * 0.8) * radius / 2   )   ctx.quadraticCurveTo(-radius * 2, 0,     Math.cos(Math.PI
    - angle * 0.8) * radius / 2,     Math.sin(Math.PI - angle * 0.8) * radius / 2
      );   ctx.fill();   ctx.stroke();   ctx.restore(); } Listing 11-5 Addition to
    the draw_ ship Function Now, setting the ship.thruster_on property to true will
    make the ship move and will also draw a filled red curve at the rear of the ship.
    Figure [11-1](#A455241_1_En_11_Chapter.xhtml#Fig1) shows the result of turning
    the thruster on via the browser console. ![A455241_1_En_11_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_11_Fig1_HTML.jpg)
    Figure 11-1 Thruster indicator We’ll complete this first step with a pair of event
    handlers, one for keydown and one for keyup. First, add the helper function to
    do the actual ship control, as shown in Listing [11-6](#A455241_1_En_11_Chapter.xhtml#Par17).
    function key_handler(e, value) {   var nothing_handled = false;   switch(e.key
    || e.keyCode) {     case "ArrowUp":     case 38: // up arrow       ship.thruster_on
    = value;       break;     default:       nothing_handled = true;   }   if(!nothing_handled)
    e.preventDefault(); } Listing 11-6 Control the Ship Thruster This function takes
    an event and a value as arguments. If the key that triggered the event is the
    up arrow ("ArrowUp" or 38), then it sets the ship.thruster_on property to whatever
    value is passed to it. Finally, we connect the event handler function to event
    listeners on the canvas, as shown in Listing [11-7](#A455241_1_En_11_Chapter.xhtml#Par19).
    context.canvas.addEventListener("keydown", function(e) {   key_handler(e, true);
    }, true); context.canvas.addEventListener("keyup", function(e) {   key_handler(e,
    false); }, true); Listing 11-7 Event Handlers to Do the Job Finally, we also need
    to set the tabindex of the canvas and call canvas.focus(), as in the preceding
    exercise. Once we’ve done this, we should find that pressing and releasing the
    up arrow controls the thruster!'
  trans: "\n# 11. 控制飞船\n\n格雷姆·斯图尔特 (1) 英国莱斯特郡马基特哈伯勒\n\n在本章中，我们最终将实现对飞船的用户控制。这正是我们之前所有建立对象工作的回报开始显现的时刻。本章结束时，你将能够优雅地在画布上驾驶飞船，甚至从飞船的头部发射弹丸。与吃豆人示例类似，我们需要为`Ship`类添加一些属性，以便通过键盘事件控制飞船。飞船依然是在太空中漂浮的质量体，因此我们只想使用`Mass.prototype.push`和`Mass.prototype.twist`方法来执行实际的移动操作。将`exercise9.html`及其所有相关文件（`styles.css`以及库文件`drawing.js`和`objects.js`）复制到一个新文件夹中，并将\
    \ HTML 文件重命名为`exercise11.html`。从全局`update`函数中移除所有控制飞船的代码。\n\n## 推进器控制\n\n从简单入手，飞船需要一个推进器。当推进器开启时，飞船将被向前推动。当推进器关闭时，飞船行为将恢复正常。用代码清单\
    \ 11-1 中的代码更新`Ship`构造函数。\n\n```\nfunction Ship(x, y, power) {\n  this.super(x,\
    \ y, 10, 20, 1.5 * Math.PI);\n  this.thruster_power = power;\n  this.thruster_on\
    \ = false;\n}\n```\n\n*代码清单 11-1：飞船推进器属性*\n\n我们为飞船添加了两个属性。`thruster_power`属性决定了推进器开启时施加在飞船上的力的大小。`thruster_on`属性则决定推进器是否开启。推进器初始化为关闭状态（即`thrusters_on`被设为`false`）。我们还使飞船的质量和大小变得可配置。更新`exercise11.html`中的飞船实例化代码，使其与代码清单\
    \ 11-2 一致。\n\n```\nvar ship = new Ship(context.canvas.width / 2, context.canvas.height\
    \ / 2, 1000);\n```\n\n*代码清单 11-2：创建一艘漂亮的飞船*\n\n现在我们需要添加一个`Ship.prototype.update`方法，因为标准的`Mass.prototype.update`方法已不再适用。我们希望在`this.thruster_on`为`true`时，用正确的推力沿飞船指向的方向推动飞船。因此，我们调用`this.push`方法，传入角度（`this.angle`）以及布尔值`this.thruster_on`乘以`this.thruster_power`的结果，如代码清单\
    \ 11-3 所示。布尔值会自动转换为 1 或 0，因此计算结果正是我们计算力并在经过时间内施加该力所需的值。\n\n```\nShip.prototype.update\
    \ = function(elapsed) {\n  this.push(this.angle, this.thruster_on * this.thruster_power,\
    \ elapsed);\n  Mass.prototype.update.apply(this, arguments);\n}\n```\n\n*代码清单\
    \ 11-3：Ship.prototype.update 方法*\n\n然后我们调用`Mass.prototype.update`方法。我们不能直接在`this`关键字上调用它，因为我们已经覆盖了`Ship.prototype`上的该方法。因此，我们需要使用`function.apply`来调用`Mass.prototype.update`方法，传入我们的`this`关键字以引用飞船实例，并传入函数接收到的`arguments`参数列表。这是一种在子类重写了父类方法后，调用父类方法的通用方式。\n\
    \n现在我们已经调整了飞船的行为，应该能够刷新浏览器并通过控制台开启推进器了。在控制台中输入`ship.thruster_on = true`，并检查飞船是否响应正确。\n\
    \n我们可以通过更新`draw_ship`函数来添加一些关于推进器状态的视觉反馈。首先，我们应该将`ship.thruster_on`属性传入对`draw_ship`的调用中，如代码清单\
    \ 11-4 所示。\n\n```\nShip.prototype.draw = function(c, guide) {\n  c.save();\n \
    \ c.translate(this.x, this.y);\n  c.rotate(this.angle);\n  draw_ship(c, this.radius,\
    \ {\n    guide: guide,\n    thruster: this.thruster_on\n  });\n  c.restore();\n\
    }\n```\n\n*代码清单 11-4：Ship.prototype.draw 方法*\n\n现在将代码清单 11-5 中的代码片段添加到`draw_ship`函数中，位置在绘制飞船之前。我们绘制一个简单的红色填充曲线，带有黄色轮廓，并将此代码放在绘制飞船之前，这样飞船会遮挡住重叠部分，使其看起来更整洁。\n\
    \n```\nif(options.thruster) {\n  ctx.save();\n  ctx.strokeStyle = \"yellow\";\n\
    \  ctx.fillStyle = \"red\";\n  ctx.lineWidth = 3;\n  ctx.beginPath();\n  ctx.moveTo(\n\
    \    Math.cos(Math.PI + angle * 0.8) * radius / 2,\n    Math.sin(Math.PI + angle\
    \ * 0.8) * radius / 2\n  )\n  ctx.quadraticCurveTo(-radius * 2, 0,\n    Math.cos(Math.PI\
    \ - angle * 0.8) * radius / 2,\n    Math.sin(Math.PI - angle * 0.8) * radius /\
    \ 2\n  );\n  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n}\n```\n\n*代码清单 11-5：对\
    \ draw_ship 函数的补充*\n\n现在，将`ship.thruster_on`属性设为`true`将使飞船移动，并会在飞船尾部绘制一个红色填充曲线。图\
    \ 11-1 显示了通过浏览器控制台开启推进器的结果。\n\n![A455241_1_En_11_Fig1_HTML.jpg](img/A455241_1_En_11_Fig1_HTML.jpg)\n\
    \n*图 11-1：推进器指示器*\n\n我们将通过一对事件处理器来完成这第一步，一个用于`keydown`，一个用于`keyup`。首先，添加用于实际控制飞船的辅助函数，如代码清单\
    \ 11-6 所示。\n\n```\nfunction key_handler(e, value) {\n  var nothing_handled = false;\n\
    \  switch(e.key || e.keyCode) {\n    case \"ArrowUp\":\n    case 38: // 上箭头\n\
    \      ship.thruster_on = value;\n      break;\n    default:\n      nothing_handled\
    \ = true;\n  }\n  if(!nothing_handled) e.preventDefault();\n}\n```\n\n*代码清单 11-6：控制飞船推进器*\n\
    \n此函数接收一个事件和一个值作为参数。如果触发事件的键是上箭头（`\"ArrowUp\"`或`38`），那么它将`ship.thruster_on`属性设置为传递给它的任何值。\n\
    \n最后，我们将事件处理函数连接到画布上的事件监听器，如代码清单 11-7 所示。\n\n```\ncontext.canvas.addEventListener(\"\
    keydown\", function(e) {\n  key_handler(e, true);\n}, true);\ncontext.canvas.addEventListener(\"\
    keyup\", function(e) {\n  key_handler(e, false);\n}, true);\n```\n\n*代码清单 11-7：执行任务的事件处理器*\n\
    \n最后，我们还需要像上一个练习那样设置画布的`tabindex`并调用`canvas.focus()`。完成这些之后，我们应该会发现按下和释放上箭头键可以控制推进器了！\n"
- fmt: "## Steering\n\nThe real fun begins when we hook up the steering. Update the\
    \ `Ship` constructor to reflect Listing [11-8](#A455241_1_En_11_Chapter.xhtml#Par22).\n\
    \n```javascript\nfunction Ship(x, y, power) {\n  this.super(x, y, 10, 20, 1.5\
    \ * Math.PI);\n  this.thruster_power = power;\n  this.steering_power = power /\
    \ 20;\n  this.right_thruster = false;\n  this.left_thruster = false;\n  this.thruster_on\
    \ = false;\n}\nextend(Ship, Mass);\n```\n\nListing 11-8: Add Steering Properties\n\
    \nNow use the new properties to twist the ship at every frame, as shown in the\
    \ `Ship.prototype.update` method in Listing [11-9](#A455241_1_En_11_Chapter.xhtml#Par24).\
    \ We take the difference between `this.right_thruster` and `this.left_thruster`\
    \ to determine the twisting force to apply. If both are on or neither is on, the\
    \ result is zero. Otherwise, it’s either –1 or +1. This is multiplied by the steering\
    \ force.\n\n```javascript\nShip.prototype.update = function(elapsed, c) {\n  this.push(this.angle,\
    \ this.thruster_on * this.thruster_power, elapsed);\n  this.twist((this.right_thruster\
    \ - this.left_thruster) * this.steering_power, elapsed);\n  Mass.prototype.update.apply(this,\
    \ arguments);\n}\n```\n\nListing 11-9: Twist the Ship with Thrusters\n\nFinally,\
    \ update the `key_handler` function to respond to left and right arrows, as shown\
    \ in Listing [11-10](#A455241_1_En_11_Chapter.xhtml#Par26).\n\n```javascript\n\
    function key_handler(e, value) {\n  var nothing_handled = false;\n  switch(e.key\
    \ || e.keyCode) {\n    case \"ArrowUp\":\n    case 38: // up arrow\n      ship.thruster_on\
    \ = value;\n      break;\n    case \"ArrowLeft\":\n    case 37: // left arrow\n\
    \      ship.left_thruster = value;\n      break;\n    case \"ArrowRight\":\n \
    \   case 39: // right arrow\n      ship.right_thruster = value;\n      break;\n\
    \    case \"g\":\n    case 71: //g\n      if(value) guide = !guide;\n    default:\n\
    \      nothing_handled = true;\n  }\n  if(!nothing_handled) e.preventDefault();\n\
    }\n```\n\nListing 11-10: Control Thrusters with Arrow Keys\n\nRefresh the browser\
    \ and give it a try. Now it feels a lot like a working game! Fly around the canvas\
    \ in triumph as you learn how to control the ship. Notice we’ve added a response\
    \ to the `G` key that toggles a new `guide` variable. Have a go at implementing\
    \ this. You’ll need to define the global `guide` variable and initialize it to\
    \ `true`. You’ll also need to pass it into the `draw` methods of your asteroids\
    \ and ship and use it to determine whether the grid is drawn.\n\n## Shooting"
