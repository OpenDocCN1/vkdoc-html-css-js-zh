  trans: '

    ## 总结


    本章对第 [3](https://example.org/A455241_1_En_3_Chapter.xhtml) 章中的思路进行了重要延伸。我们绘制了更复杂的形状，并将设计从简单的三角形发展为曲线优美的图形。我们学习了如何平移和旋转画布。这些概念将在后续内容中非常重要，因此你一定要确保已充分理解它们。它们让我们能够以极其灵活的方式调用绘图函数。一个关键发现是：随着绘图函数变得越来越复杂，我们调用该函数的代码却几乎没有任何变化。这正是一般情况下我们管理复杂性的方式——将诸如“绘制一艘飞船”这样的想法抽象成函数，并在需要“绘制飞船”时随时调用该函数。尝试自行开发
    `draw_ship` 函数。保留辅助圆代码，并尽可能贴近边缘进行绘制。如果超出边缘一点，会有影响吗？© Graeme Stuart 2017 Graeme
    Stuart《Introducing JavaScript Game Development》[`doi.org/10.1007/978-1-4842-3252-1_5`](https://doi.org/10.1007/978-1-4842-3252-1_5)


    # 5. 绘制小行星


    Graeme Stuart^(1 ) (1) 英国莱斯特郡马基特哈伯勒 与飞船类似，为了碰撞检测，小行星也可近似为一个圆形。然而，小行星应该是不规则形状，且每个都应独一无二。为此，我们将广泛使用
    `Math.random` 方法来定义小行星的形状。


    ## 绘制基本形状

    '
- fmt: "作为第一次尝试，我们将把小行星划分为多个线段，并从每个线段到下一个线段绘制一条直线。为此，我们可以逐步旋转画布，并在关闭路径之前在每个步骤绘制一条直线。我们希望点到原点的距离有一些随机性。我们可以在循环中管理旋转。我们可以在每一步旋转相同的量：即`2π`弧度除以线段数量。然后，我们在圆周附近（原点正右侧）选取一个随机点。旋转的原点将是小行星的中心，因此尽管我们将笔保持在圆的右侧，但我们的绘图会在笔下方旋转。通过这种方式，我们一次绘制一个线段，最终应能关闭路径。\n\
    \n将清单[5-1](#A455241_1_En_5_Chapter.xhtml#Par5)中的函数添加到`drawing.js`中。\n\n```\nfunction\
    \ draw_asteroid(ctx, radius, segments, options) {\n  options = options || {};\n\
    \  ctx.strokeStyle = options.stroke || \"white\";\n  ctx.fillStyle = options.fill\
    \ || \"black\";\n  ctx.save();\n  ctx.beginPath();\n  for(let i = 0; i < segments;\
    \ i++) {\n    ctx.rotate(2 * Math.PI / segments);\n    ctx.lineTo(radius, 0);\n\
    \  }\n  ctx.closePath();\n  ctx.fill();\n  ctx.stroke();\n  if(options.guide)\
    \ {\n    ctx.lineWidth = 0.5;\n    ctx.beginPath();\n    ctx.arc(0, 0, radius,\
    \ 0, 2 * Math.PI);\n    ctx.stroke();\n  }\n  ctx.restore();\n}\n```\n\n*清单 5-1\
    \ 绘制基本形状*\n\n该函数接受四个参数：用于绘制的上下文、小行星的半径、线段数量以及一组可选的选项。它开始一条路径，然后一次旋转画布一个线段，为每个线段添加一条直线到路径中。随后路径被关闭，完成绘制。如果请求了辅助圆，则将其绘制为一个简单的圆形。请注意，在调用`context.beginPath`方法后，路径的起点位置尚未确定。在这种情况下，添加到路径中的第一条直线不会被绘制，而是被视为移动。因此，当绘制完最后一个线段时，会缺少一条直线，需要关闭路径。\n\
    \n创建一个新文件`exercise5.html`，并像之前一样进行设置，但使用新的标题和标题。像之前的练习一样绘制一个网格，并添加清单[5-2](#A455241_1_En_5_Chapter.xhtml#Par9)中的代码。\n\
    \n```\nlet context = document.getElementById(\"asteroids\").getContext(\"2d\"\
    );\ndraw_grid(context);\nlet segments = 1\nfor(let x=0.25; x<1; x+= 0.5) {\n \
    \ for(let y=0.25; y<1; y+= 0.5) {\n    segments += 2;\n    context.save();\n \
    \   context.translate(context.canvas.width * x, context.canvas.height * y);\n\
    \    draw_asteroid(context, 60, segments, {guide: true});\n    context.restore();\n\
    \  }\n}\n```\n\n*清单 5-2 一些规则形状*\n\n这将在画布上绘制四个小行星，如图[5-1](#A455241_1_En_5_Chapter.xhtml#Fig1)所示。请注意，小行星的角点位于辅助圆上。\n\
    \n![A455241_1_En_5_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_5_Fig1_HTML.jpg)\n\
    \n*图 5-1 无随机化的规则小行星*\n\n添加随机化相当简单。我们只需更改`context.lineTo`命令的`x`坐标，在每个线段中为半径添加一点随机噪声。我们如何做到这一点，决定了我们能将小行星形状保持在辅助圆附近的程度。一种简单的方法是将半径乘以一个随机数——这会在线段位置（从小行星中心即`0`到整个半径即`radius`）之间引入巨大变化。清单[5-3](#A455241_1_En_5_Chapter.xhtml#Par12)展示了在编写这些示例时尝试过的三种添加随机性的方法。\n\
    \n```\n// 一种过于简单的方法 - 我们不需要完全随机\nctx.lineTo(radius * Math.random(), 0);\n\n//\
    \ 好多了，只有一点随机\nctx.lineTo(radius * 0.8 + radius * 0.4 * Math.random(), 0);\n\n\
    // 这种方法简洁、可配置，并使半径保持在合理范围内\nctx.lineTo(radius + radius * options.noise * (Math.random()\
    \ - 0.5), 0);\n```\n\n*清单 5-3 添加随机性*\n\n这些示例揭示了一些要求。在第一个示例中，随机小行星可能包含原点处的点；这不是我们想要的。为了避免这种情况，我们指定一部分始终保留的半径（例如\
    \ 80%），并且只对剩余部分进行随机化。在第二个示例中，随机小行星的点始终位于碰撞圆内，而绝不会超出它。我们希望随机化“跨越”指定的半径，而不是总是侵蚀它，使小行星变小。为此，我们生成一个介于`-0.5`和`+0.5`之间的数字，并使用它来随机化绘图。此外，第二个示例不可配置，因此我们引入了一个配置参数，可以在`options`参数中指定。最后一个示例通过指定一个介于`0`（无随机化）和`1`（大量随机化）之间的`noise`参数来展示这种方法。该值乘以一个介于`-0.5`和`0.5`之间的随机数，以限制随机化的效果。例如，`noise`值为`0.2`可以导致任何介于原始半径的\
    \ 90% 和 110% 之间的半径。指定`noise`因子为`0.1`将允许半径在给定值的 95% 到 105% 之间变化。\n\n更新您的函数以接受一个`noise`参数。然后使用清单[5-4](#A455241_1_En_5_Chapter.xhtml#Par16)中的代码绘制\
    \ 25 个小行星。\n\n```\nvar segments = 15, noise = 0.4;\nfor(let x=0.1; x<1; x+= 0.2)\
    \ {\n  for(let y=0.1; y<1; y+= 0.2) {\n    context.save();\n    context.translate(context.canvas.width\
    \ * x, context.canvas.height * y);\n    draw_asteroid(context, context.canvas.width\
    \ / 12, segments, {noise: noise, guide: true});\n    context.restore();\n  }\n\
    }\n```\n\n*清单 5-4 绘制一些不同的小行星*\n\n在这里，我们像以前一样遍历`x`和`y`坐标，并在每个位置绘制一个小行星。结果如图[5-2](#A455241_1_En_5_Chapter.xhtml#Fig2)所示。尝试通过更改所提供变量的初始值来试验线段数量和噪声级别。您还可以通过递增或随机化它们来更改每个循环中的值。对于具有大量线段的小行星，您注意到了什么？\n\
    \n![A455241_1_En_5_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_5_Fig2_HTML.jpg)\n\
    \n*图 5-2 25 个小行星（segments = 15，noise = 0.2）*\n\n这些小行星看起来非常不错！请注意，在图[5-2](#A455241_1_En_5_Chapter.xhtml#Fig2)中，我们还添加了两个新的辅助圆，以显示配置的噪声的内外范围。这留作练习。请在您的函数中实现这一点，使用比主辅助圆更细的线宽。"
  raw: 'As a first stab, we’ll divide our circle into segments and draw a straight
    line from each segment to the next. We can do that by rotating the canvas in steps
    and drawing a line at each step before closing the path. We’ll want some randomness
    in the distance of the point from the origin. We can manage the rotation in a
    loop. We can rotate the same amount at every step: this is 2π radians divided
    by the number of segments. We can then pick a random point near the circumference,
    directly to the right of the origin. The origin of the rotation will be the center
    of the asteroid, so although we keep our pen to the right of the circle, our drawing
    rotates under the pen. In this way, we draw our asteroid, one segment at a time
    and we should be able to close the path at the end. Add the function from Listing
    [5-1](#A455241_1_En_5_Chapter.xhtml#Par5) into drawing. js . function draw_asteroid(ctx,
    radius, segments, options) {   options = options || {};   ctx.strokeStyle = options.stroke
    || "white";   ctx.fillStyle = options.fill || "black";   ctx.save();   ctx.beginPath();
      for(let i = 0; i < segments; i++) {     ctx.rotate(2 * Math.PI / segments);
        ctx.lineTo(radius, 0);   }   ctx.closePath();   ctx.fill();   ctx.stroke();
      if(options.guide) {     ctx.lineWidth = 0.5;     ctx.beginPath();     ctx.arc(0,
    0, radius, 0, 2 * Math.PI);     ctx.stroke();   }   ctx.restore(); } Listing 5-1
    Drawing Basic Shapes The function takes four arguments : the context with which
    to draw, the radius of the asteroid, the number of segments, and an optional set
    of options. It begins a path and proceeds to rotate the canvas one segment at
    a time, adding a line to the path for each segment. The path is then closed off,
    which completes the drawing. If a guide is requested, it’s drawn as a simple circle.
    Note that the position of the start of the path isn’t established after the context.beginPath
    method call. Under these circumstances, the first line to be added to the path
    isn’t drawn but is treated as a move. So, by the time the last segment is drawn,
    there’s one line missing and the path needs to be closed. Create a new file exercise5.html
    and set it up as before but with a new title and heading. Draw a grid as in the
    previous exercises and add the code from Listing [5-2](#A455241_1_En_5_Chapter.xhtml#Par9).
    let context = document.getElementById("asteroids").getContext("2d"); draw_grid(context);
    let segments = 1 for(let x=0.25; x<1; x+= 0.5) {   for(let y=0.25; y<1; y+= 0.5)
    {     segments += 2;     context.save();     context.translate(context.canvas.width
    * x, context.canvas.height * y);     draw_asteroid(context, 60, segments, {guide:
    true});    context.restore();  } } Listing 5-2 Some Regular Shapes This draws
    four asteroids to the canvas, as in Figure [5-1](#A455241_1_En_5_Chapter.xhtml#Fig1).
    Notice that the corners of the asteroids are located on the guide circles. ![A455241_1_En_5_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_5_Fig1_HTML.jpg)
    Figure 5-1 Regular asteroids with no randomization To add randomization is fairly
    simple. We simply change the x-coordinate of the context.lineTo command, adding
    a bit of random noise to the radius in each segment. How we do this determines
    how close we can keep to the guide circles. A simple approach would be to multiply
    the radius by a random number—that would add huge variation in the segment positions
    between 0 (the center of the asteroid) and the full radius. Listing [5-3](#A455241_1_En_5_Chapter.xhtml#Par12)
    shows three approaches to adding randomness that were attempted when writing these
    examples. //A simplistic approach - we don''t want totally random ctx.lineTo(radius
    * Math.random(), 0); //This is much better, only a bit random ctx.lineTo(radius
    * 0.8 + radius * 0.4 * Math.random(), 0); //This is neat, configurable and keeps
    the radius about right ctx.lineTo(radius + radius * options.noise * (Math.random()
    - 0.5), 0); Listing 5-3 Adding Randomness There are requirements that those examples
    expose. In the first example, a random asteroid could include points at the origin;
    that’s not what we want. To avoid this, we specify a portion of the radius that
    will always remain intact (for example, 80%) and only randomize the remainder.
    In the second example, a random asteroid will always have points within the collision
    circle and never outside it. We want the randomization to “straddle” the specified
    radius rather than always eating into it, making the asteroid smaller. To do that,
    we generate a number between –0.5 and +0.5 and randomize the drawing using this.
    Also, the second example isn’t configurable, so we introduce the use of a configuration
    parameter that can be specified in the options argument. The final example shows
    this approach achieved by specifying a noise parameter between 0 (no randomization)
    and 1 (lots of randomization). This value is multiplied by a random number between
    –0.5 and 0.5 to limit the effect of the randomization. For example, a noise value
    of 0.2 can lead to any radius between 90% and 110% of the original radius. Specifying
    a noise factor of 0.1 would allow the radius to vary between 95% and 105% of the
    given value. Update your function to take a noise argument . Then draw 25 asteroids
    using the code in Listing [5-4](#A455241_1_En_5_Chapter.xhtml#Par16). var segments
    = 15, noise = 0.4; for(let x=0.1; x<1; x+= 0.2) {   for(let y=0.1; y<1; y+= 0.2)
    {     context.save();     context.translate(context.canvas.width * x, context.canvas.height
    * y);     draw_asteroid(context, context.canvas.width / 12, segments, {noise:
    noise, guide: true});     context.restore();   } } Listing 5-4 Drawing Some Different
    Asteroids Here we loop over the x- and y-coordinates as before and draw an asteroid
    at each location. The result is shown in Figure [5-2](#A455241_1_En_5_Chapter.xhtml#Fig2).
    Try experimenting with the number of segments and the noise level by changing
    the initial values of the provided variables. You can also change the values in
    each loop by incrementing or randomizing them. What do you notice about asteroids
    with large numbers of segments? ![A455241_1_En_5_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_5_Fig2_HTML.jpg)
    Figure 5-2 25 asteroids (segments = 15, noise = 0.2) These asteroids look pretty
    good! Notice in Figure [5-2](#A455241_1_En_5_Chapter.xhtml#Fig2) that we’ve also
    added two new guide circles to show the inner and outer extent of the configured
    noise. This is left as an exercise. Implement this in your function using a thinner
    line width than the main guide circle.'
  trans: "好的，作为高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n作为第一次尝试，我们将把小行星划分为多个线段，并从每个线段到下一个线段绘制一条直线。为此，我们可以逐步旋转画布，并在关闭路径之前在每个步骤绘制一条直线。我们希望点到原点的距离有一些随机性。我们可以在循环中管理旋转。我们可以在每一步旋转相同的量：即`2π`弧度除以线段数量。然后，我们在圆周附近（原点正右侧）选取一个随机点。旋转的原点将是小行星的中心，因此尽管我们将笔保持在圆的右侧，但我们的绘图会在笔下方旋转。通过这种方式，我们一次绘制一个线段，最终应能关闭路径。\n\
    \n将清单 5-1 中的函数添加到`drawing.js`中。\n\n```\nfunction draw_asteroid(ctx, radius, segments,\
    \ options) {\n  options = options || {};\n  ctx.strokeStyle = options.stroke ||\
    \ \"white\";\n  ctx.fillStyle = options.fill || \"black\";\n  ctx.save();\n  ctx.beginPath();\n\
    \  for(let i = 0; i < segments; i++) {\n    ctx.rotate(2 * Math.PI / segments);\n\
    \    ctx.lineTo(radius, 0);\n  }\n  ctx.closePath();\n  ctx.fill();\n  ctx.stroke();\n\
    \  if(options.guide) {\n    ctx.lineWidth = 0.5;\n    ctx.beginPath();\n    ctx.arc(0,\
    \ 0, radius, 0, 2 * Math.PI);\n    ctx.stroke();\n  }\n  ctx.restore();\n}\n```\n\
    \n*清单 5-1 绘制基本形状*\n\n该函数接受四个参数：用于绘制的上下文、小行星的半径、线段数量以及一组可选的选项。它开始一条路径，然后一次旋转画布一个线段，为每个线段添加一条直线到路径中。随后路径被关闭，完成绘制。如果请求了辅助圆，则将其绘制为一个简单的圆形。请注意，在调用`context.beginPath`方法后，路径的起点位置尚未确定。在这种情况下，添加到路径中的第一条直线不会被绘制，而是被视为移动。因此，当绘制完最后一个线段时，会缺少一条直线，需要关闭路径。\n\
    \n创建一个新文件`exercise5.html`，并像之前一样进行设置，但使用新的标题和标题。像之前的练习一样绘制一个网格，并添加清单 5-2 中的代码。\n\
    \n```\nlet context = document.getElementById(\"asteroids\").getContext(\"2d\"\
    );\ndraw_grid(context);\nlet segments = 1\nfor(let x=0.25; x<1; x+= 0.5) {\n \
    \ for(let y=0.25; y<1; y+= 0.5) {\n    segments += 2;\n    context.save();\n \
    \   context.translate(context.canvas.width * x, context.canvas.height * y);\n\
    \    draw_asteroid(context, 60, segments, {guide: true});\n    context.restore();\n\
    \  }\n}\n```\n\n*清单 5-2 一些规则形状*\n\n这将在画布上绘制四个小行星，如图 5-1 所示。请注意，小行星的角点位于辅助圆上。\n\
    \n![A455241_1_En_5_Fig1_HTML.jpg](img/A455241_1_En_5_Fig1_HTML.jpg)\n\n*图 5-1\
    \ 无随机化的规则小行星*\n\n添加随机化相当简单。我们只需更改`context.lineTo`命令的`x`坐标，在每个线段中为半径添加一点随机噪声。我们如何做到这一点，决定了我们能将小行星形状保持在辅助圆附近的程度。一种简单的方法是将半径乘以一个随机数——这会在线段位置（从小行星中心即`0`到整个半径即`radius`）之间引入巨大变化。清单\
    \ 5-3 展示了在编写这些示例时尝试过的三种添加随机性的方法。\n\n```\n// 一种过于简单的方法 - 我们不需要完全随机\nctx.lineTo(radius\
    \ * Math.random(), 0);\n\n// 好多了，只有一点随机\nctx.lineTo(radius * 0.8 + radius * 0.4\
    \ * Math.random(), 0);\n\n// 这种方法简洁、可配置，并使半径保持在合理范围内\nctx.lineTo(radius + radius\
    \ * options.noise * (Math.random() - 0.5), 0);\n```\n\n*清单 5-3 添加随机性*\n\n这些示例揭示了一些要求。在第一个示例中，随机小行星可能包含原点处的点；这不是我们想要的。为了避免这种情况，我们指定一部分始终保留的半径（例如\
    \ 80%），并且只对剩余部分进行随机化。在第二个示例中，随机小行星的点始终位于碰撞圆内，而绝不会超出它。我们希望随机化“跨越”指定的半径，而不是总是侵蚀它，使小行星变小。为此，我们生成一个介于`-0.5`和`+0.5`之间的数字，并使用它来随机化绘图。此外，第二个示例不可配置，因此我们引入了一个配置参数，可以在`options`参数中指定。最后一个示例通过指定一个介于`0`（无随机化）和`1`（大量随机化）之间的`noise`参数来展示这种方法。该值乘以一个介于`-0.5`和`0.5`之间的随机数，以限制随机化的效果。例如，`noise`值为`0.2`可以导致任何介于原始半径的\
    \ 90% 和 110% 之间的半径。指定`noise`因子为`0.1`将允许半径在给定值的 95% 到 105% 之间变化。\n\n更新您的函数以接受一个`noise`参数。然后使用清单\
    \ 5-4 中的代码绘制 25 个小行星。\n\n```\nvar segments = 15, noise = 0.4;\nfor(let x=0.1;\
    \ x<1; x+= 0.2) {\n  for(let y=0.1; y<1; y+= 0.2) {\n    context.save();\n   \
    \ context.translate(context.canvas.width * x, context.canvas.height * y);\n  \
    \  draw_asteroid(context, context.canvas.width / 12, segments, {noise: noise,\
    \ guide: true});\n    context.restore();\n  }\n}\n```\n\n*清单 5-4 绘制一些不同的小行星*\n\
    \n在这里，我们像以前一样遍历`x`和`y`坐标，并在每个位置绘制一个小行星。结果如图 5-2 所示。尝试通过更改所提供变量的初始值来试验线段数量和噪声级别。您还可以通过递增或随机化它们来更改每个循环中的值。对于具有大量线段的小行星，您注意到了什么？\n\
    \n![A455241_1_En_5_Fig2_HTML.jpg](img/A455241_1_En_5_Fig2_HTML.jpg)\n\n*图 5-2\
    \ 25 个小行星（segments = 15，noise = 0.2）*\n\n这些小行星看起来非常不错！请注意，在图 5-2 中，我们还添加了两个新的辅助圆，以显示配置的噪声的内外范围。这留作练习。请在您的函数中实现这一点，使用比主辅助圆更细的线宽。\n"
- fmt: "# Storing Shape Data\n\nIn our game we’ll need to have individual asteroids\
    \ persist until they’re shot or the game ends. As it stands, our function can’t\
    \ do this. It randomizes the asteroid shape every time it’s called. The shape\
    \ data (an array of random numbers) needs to be stored and used when drawing the\
    \ individual asteroids. Each asteroid needs its own shape data. A first step towards\
    \ doing this would be to generate the random shape data outside the function and\
    \ pass it in as a function argument. Let’s try it.\n\n```\nfunction draw_asteroid(ctx,\
    \ radius, shape, options) {\n    options = options || {};\n    ctx.strokeStyle\
    \ = options.stroke || \"white\";\n    ctx.fillStyle = options.fill || \"black\"\
    ;\n    ctx.save();\n    ctx.beginPath();\n    for(let i = 0; i < shape.length;\
    \ i++) {\n        ctx.rotate(2 * Math.PI / shape.length);\n        ctx.lineTo(radius\
    \ + radius * options.noise * shape[i], 0);\n    }\n    ctx.closePath();\n    ctx.fill();\n\
    \    ctx.stroke();\n    if(options.guide) {\n        ctx.lineWidth = 0.5;\n  \
    \      ctx.beginPath();\n        ctx.arc(0, 0, radius, 0, 2 * Math.PI);\n    \
    \    ctx.stroke();\n        ctx.beginPath();\n        ctx.lineWidth = 0.2;\n \
    \       ctx.arc(0, 0, radius + radius * options.noise, 0, 2 * Math.PI);\n    \
    \    ctx.stroke();\n        ctx.beginPath();\n        ctx.arc(0, 0, radius - radius\
    \ * options.noise, 0, 2 * Math.PI);\n        ctx.stroke();\n    }\n    ctx.restore();\n\
    }\n```\n\nListing 5-5 Taking Shape Data\n\nWe’ve actually made very few changes.\
    \ The main difference is that we now take a `shape` argument rather than a `segments`\
    \ argument. The `shape` can be any array of numbers, but the numbers are assumed\
    \ to vary between –0.5 and +0.5. Where we previously referenced the `segments`\
    \ variable, we now use `shape.length`. Where we generated random numbers, we now\
    \ use the value of the appropriate element in the `shape` array (`shape[i]`).\
    \ We’ve also added the extra guide circles indicating the value of `noise`.\n\n\
    To use the new function, we must generate our shape data and then we can simply\
    \ pass it into the function to replace the `segments` argument. Try the code in\
    \ Listing [5-6](#A455241_1_En_5_Chapter.xhtml#Par24).\n\n```\nvar segments = 15,\
    \ noise = 0;\nvar shape = [];\nfor(var i = 0; i < segments; i++) {\n    shape.push(2\
    \ * (Math.random() - 0.5));\n}\nfor(let y=0.1; y<1; y+= 0.2) {\n    for(let x=0.1;\
    \ x<1; x+= 0.2) {\n        context.save();\n        context.translate(context.canvas.width\
    \ * x, context.canvas.height * y);\n        draw_asteroid(context, context.canvas.width\
    \ / 16, shape, {noise: noise, guide: true});\n        context.restore();\n   \
    \     noise += 0.025;\n    }\n}\n```\n\nListing 5-6 Using the Same Shape with\
    \ Different Noise\n\nIn this case, we generate the shape data and then draw a\
    \ set of 25 asteroids with the same shape but with increasing value for the `noise`\
    \ argument (see Figure [5-3](#A455241_1_En_5_Chapter.xhtml#Fig3)). `noise` starts\
    \ at 0 and increases in 0.125 steps to 0.6. Try experimenting with the code.\n\
    \n![A455241_1_En_5_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_5_Fig3_HTML.jpg)\n\
    \nFigure 5-3 Using the same shape with increasing noise\n\nWe now have a function\
    \ that can draw our asteroids according to a configurable noise level. The client\
    \ code that uses the function is responsible for generating the asteroid shape,\
    \ setting the size, and selecting an appropriate noise level. Functions are great\
    \ for handling the nitty-gritty detail and pushing the important decisions up\
    \ to higher-level code.\n\n## Summary\n\nIn this chapter we’ve repeated the process\
    \ of designing an item we’ll need in our game. We’ve also introduced something\
    \ else. If we’re going to draw an asteroid spinning across our scene, we’ll need\
    \ to store data about its shape. The use of data that’s tied to the individual\
    \ item is an important concept. It’s also important to understand that writing\
    \ code is a creative, problem-solving process. The code examples in this book\
    \ serve as examples to demonstrate the concepts. The code didn’t appear fully\
    \ formed, but each example was sculpted and perfected over many weeks. Listing\
    \ [5-3](#A455241_1_En_5_Chapter.xhtml#Par12) shows how a piece of code has developed\
    \ over time—in short, by starting as simple as possible and adapting the design\
    \ if it doesn’t work for what you’re doing. When you write code of your own, it’s\
    \ wise to expect it to be a difficult but rewarding experience. Mastery comes\
    \ with practice. For now, a good way to practice is to elaborate on the examples\
    \ provided. Try drawing an asteroid using a different approach. Add a new parameter\
    \ that can be passed as an optional argument. Display your asteroids in an interesting\
    \ way.\n\n# Part II\n## Animation\n\nAnimation is fairly easy to do with the HTML\
    \ canvas. All we need to do is clear the canvas and draw the scene repeatedly,\
    \ updating the scene at every step. If we repeat this process and draw the scene\
    \ at around 60 times per second, then we are animating. We need to clearly define\
    \ how each element of the scene updates at each step, making sure we keep the\
    \ code that updates the scene separate from the code that draws the scene. The\
    \ following chapters demonstrate how to control an animation with a simple game\
    \ loop, and we will learn the fundamentals of a solid object-oriented approach\
    \ to designing our game elements. Finally, we will develop some of the game elements\
    \ necessary for our Asteroids game clone using a simple approach to inheritance.©\
    \ Graeme Stuart 2017 Graeme Stuart Introducing JavaScript Game Development [https://doi.org/10.1007/978-1-4842-3252-1_6](#A455241_1_En_6_Chapter.xhtml)\n\
    \n# 6. Basic Animation\n\nGraeme Stuart (1) (1) Market Harborough, Leicestershire,\
    \ UK\n\nIn previous chapters we’ve looked at the nuts and bolts of drawing to\
    \ the canvas. Now that we have a bit of experience, we can turn our attention\
    \ to animating a scene. Animation is quite easy—simply draw a changing scene multiple\
    \ times per second. In this chapter we’ll learn to do this in a very simplistic\
    \ way in order to understand the basics. When drawing ships and asteroids, we\
    \ need data about their location, size, shape, and so on. This data will be used\
    \ to translate and rotate the context so everything appears in the right place.\
    \ To animate a scene, we update the data each frame and redraw the scene over\
    \ and over as the data changes."
