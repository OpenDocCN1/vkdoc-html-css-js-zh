    function Asteroid(mass, x, y, x_speed, y_speed, rotation_speed) {   var density
    = 1; // kg per square pixel   var radius = Math.sqrt((mass / density) / Math.PI);
      this.super(mass, radius, x, y, 0, x_speed, y_speed, rotation_speed);   this.circumference
    = 2 * Math.PI * this.radius;   this.segments = Math.ceil(this.circumference /
    15);   this.segments = Math.min(25, Math.max(5, this.segments));   this.noise
    = 0.2;   this.shape = [];   for(var i = 0; i < this.segments; i++) {     this.shape.push(2
    * (Math.random() - 0.5));   } } extend(Asteroid, Mass); Asteroid.prototype.draw
    = function(ctx, guide) {   ctx.save();   ctx.translate(this.x, this.y);   ctx.rotate(this.angle);
      draw_asteroid(ctx, this.radius, this.shape, {     noise: this.noise,     guide:
    guide   });   ctx.restore(); } Listing 9-10 The Asteroid Class The Asteroid constructor
    is much the same as our previous example, with a few minor enhancements. It takes
    six arguments, the most important being the mass and the (x, y) coordinates. We
    also allow for the velocity and rotation speed to be set, which we’ll use later
    when we split asteroids. Internally, the asteroid calculates a radius value from
    the given mass based on a fixed density value. If you want larger or smaller asteroids,
    tweaking the density value is the way to do it. We then call this.super, which
    we can see from the extend function is a reference to the parent class constructor,
    Mass. By calling this, we set the mass, radius, x, y, angle, x_speed, y_speed,
    and rotation_speed properties of our object. The final steps are to set the asteroid
    shape. To do this, we first calculate the circumference and use this to set the
    number of segments so that larger asteroids have more detail. We make sure the
    number of segments is at least 5 and no more than 25\. We set the noise to 0.2
    and set the random shape as before. After we define the constructor, we call the
    extend function and pass in the child class, Asteroid, and the parent class, Mass.
    This is what sets Asteroid.super to the Mass constructor—and, critically, it sets
    the Asteroid.prototype to an instance of Mass. The Asteroid.prototype.draw method
    holds no surprises. It’s unchanged from our previous asteroid example. Notice
    we don’t need to define an Asteroid.prototype.update method because the one we
    inherit from Mass does everything we need. Create an instance of Asteroid in the
    center of the canvas with randomized mass, as shown in Listing [9-11](#A455241_1_En_9_Chapter.xhtml#Par39).
    var asteroid = new Asteroid(   10000,   Math.random() * context.canvas.width,
      Math.random() * context.canvas.height ); Listing 9-11 Instantiate an Asteroid
