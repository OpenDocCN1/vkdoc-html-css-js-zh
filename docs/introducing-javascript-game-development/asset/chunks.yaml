    ## Summary


    In this chapter, we’ve looked more closely at the way the canvas interface operates.
    We saw how the coordinates system works and explored in detail how paths are created
    and modified. We looked at various ways to draw lines between points. These are
    the basic tools at our disposal when we want to draw things on the canvas. I also
    introduced JavaScript functions and suggested a refactor early, refactor often
    approach to structuring code. This chapter has continued teaching you some basics
    and demonstrating how it all works. Chapter [3](#A455241_1_En_3_Chapter.xhtml)
    puts what you’ve learned to work to create a more intentional drawing, and looks
    at functions again.© Graeme Stuart 2017 Graeme StuartIntroducing JavaScript Game
    Development [https://doi.org/10.1007/978-1-4842-3252-1_3](#A455241_1_En_3_Chapter.xhtml)


    # 3. Drawing to a Design


    Graeme Stuart^(1 ) (1) Market Harborough, Leicestershire, UK   In Chapter [2](#A455241_1_En_2_Chapter.xhtml)
    we scribbled on the canvas and made a bit of a mess. This time we’ll try to render
    a familiar design. The skills we will look at in this chapter are developments
    of what you’ve learned in previous chapters, though in this chapter we’ll be demonstrating
    clearer intent with what we do. If this chapter has a message, it’s this: practice
    and become confident at each step, slowly adding complexity all the while. The
    things we’ve learned so far are pretty simple but are fundamental skills nonetheless.
    Repeating and adding a little bit more complexity is a useful way to practice
    and elaborate on what we have learned. Let’s start the whole process from scratch
    but bring forward our library code from the previous chapter. Try to follow these
    instructions without checking forwards to the code example until you need to:


    1.  1. Create a new folder called exercise3 and copy the drawing.js file from
    Chapter [2](#A455241_1_En_2_Chapter.xhtml) into the new folder.  

    2.  2. Create a new file called exercise3.html and set up a standard HTML template.
     

    3.  3. Add a reference to the drawing.js library in the <head> element.  

    4.  4. In the <body> element, add a <canvas> element to display our scene.  

    5.  5. Add a <script> element with the necessary JavaScript code to create a reference
    to a canvas context and to draw a blank grid to the canvas by calling the draw_grid
    function, which should be available via the reference to our library code.'
  trans: "\n# 为路径添加曲线\n\n除了使用 `context.lineTo`，还有多种方式可以为路径添加内容。想要绘制曲线而非直线，一个简单的方法是使用替代方法\
    \ `context.quadraticCurveTo`。它与 `context.lineTo` 非常相似，但除了终点坐标外，还需要一个控制点的坐标。线条会向控制点方向弯曲。请用清单\
    \ 2-7 中的代码替换上一段路径的构建代码。\n\n```\ncontext.beginPath()\ncontext.moveTo(50, 250);\n\
    context.quadraticCurveTo(25, 300, 50, 350);\ncontext.quadraticCurveTo(100, 375,\
    \ 150, 350);\ncontext.closePath();\ncontext.moveTo(230, 360);\ncontext.quadraticCurveTo(255,\
    \ 340, 270, 360);\ncontext.quadraticCurveTo(255, 340, 270, 310);\ncontext.closePath();\n\
    context.moveTo(250, 50);\ncontext.quadraticCurveTo(310, 60, 370, 50);\ncontext.quadraticCurveTo(400,\
    \ 75, 370, 100);\ncontext.closePath();\ncontext.strokeStyle = \"#FFFF00\";\ncontext.fillStyle\
    \ = \"#000000\";\ncontext.fill();\ncontext.stroke();\n```\n\n**清单 2-7** 添加曲线\n\
    \n现在，填充的形状由曲线构成，如图 2-10 所示。\n\n![A455241_1_En_2_Fig10_HTML.jpg](img/A455241_1_En_2_Fig10_HTML.jpg)\n\
    \n**图 2-10** 二次曲线\n\n为了获得更多控制，我们可以使用贝塞尔曲线进行绘制。将网格绘制代码后的前三次 `context.lineTo` 调用替换为\
    \ `context.bezierCurveTo`，即可用贝塞尔曲线重新绘制白色路径，如清单 2-8 所示。\n\n```\n<script>\n  var\
    \ canvas = document.getElementById(\"asteroids\");\n  var context = canvas.getContext(\"\
    2d\");\n  draw_grid(context)\n  context.beginPath();\n  context.strokeStyle =\
    \ \"#FFFFFF\";\n  context.fillStyle = \"#00FF00\";\n  context.lineWidth = 2;\n\
    \  context.moveTo(50, 50);\n  context.bezierCurveTo(0, 0, 80, 250, 150, 250);\n\
    \  context.bezierCurveTo(250, 250, 250, 250, 250, 170);\n  context.bezierCurveTo(250,\
    \ 50, 400, 350, 320, 280);\n  context.closePath();\n  // context.fill();\n  context.stroke();\n\
    \  context.fillText(\"(50, 50)\", 30, 40);\n  context.fillText(\"(150, 250)\"\
    , 130, 260);\n  context.fillText(\"(250, 170)\", 255, 175);\n  context.beginPath()\n\
    \  context.moveTo(50, 250);\n  context.quadraticCurveTo(25, 300, 50, 350);\n \
    \ context.quadraticCurveTo(100, 375, 150, 350);\n  context.closePath();\n  context.moveTo(230,\
    \ 360);\n  context.quadraticCurveTo(255, 340, 270, 360);\n  context.quadraticCurveTo(255,\
    \ 340, 270, 310);\n  context.closePath();\n  context.moveTo(250, 50);\n  context.quadraticCurveTo(310,\
    \ 160, 370, 50);\n  context.quadraticCurveTo(400, 75, 370, 100);\n  context.closePath();\n\
    \  context.strokeStyle = \"#FFFF00\";\n  context.fillStyle = \"#000000\";\n  context.fill();\n\
    \  context.stroke();\n</script>\n```\n\n**清单 2-8** 贝塞尔曲线\n\n贝塞尔曲线需要两个控制点坐标和终点坐标。生成的路径是一条经过每个指定终点的曲线。图\
    \ 2-11 展示了最终结果。贝塞尔曲线能用相对简单的路径实现平滑的弯曲和转向。\n\n![A455241_1_En_2_Fig11_HTML.jpg](img/A455241_1_En_2_Fig11_HTML.jpg)\n\
    \n**图 2-11** 贝塞尔曲线\n\n## 本章小结\n\n在本章中，我们更深入地了解了 Canvas 接口的运作方式。我们学习了坐标系的工作原理，并详细探讨了路径的创建和修改方法。我们研究了在点之间绘制线条的各种方式。这些都是在\
    \ Canvas 上绘图时手头的基本工具。我还介绍了 JavaScript 函数，并提出了“尽早重构，频繁重构”的代码组织方法。本章继续教授了一些基础知识，并演示了这一切是如何运作的。第\
    \ 3 章将应用你学到的知识来创建一幅更有目的性的画作，并再次探讨函数。\n\n© Graeme Stuart 2017  \nGraeme Stuart,\
    \ 《JavaScript 游戏开发入门》  \n`doi.org/10.1007/978-1-4842-3252-1_3`\n\n# 3. 按设计绘图\n\
    \nGraeme Stuart¹  \n(1) 英国莱斯特郡马基特哈伯勒\n\n在第 2 章中，我们在画布上随意涂鸦，弄得有些凌乱。这次，我们将尝试渲染一个熟悉的设计。本章将要学习的技能是前几章所学内容的延伸，不过在本章中，我们将在每一步操作中展示更明确的意图。如果本章有一个核心信息，那就是：勤加练习，对每一步都充满信心，同时慢慢增加复杂性。到目前为止，我们学到的内容虽然相当简单，但都是基础技能。重复练习并逐步增加一点复杂性，是巩固和拓展所学知识的有效方法。让我们从头开始整个过程，但把上一章的工具库代码带过来。请尝试按照以下说明操作，在需要之前不要向前查看代码示例：\n\
    \n1.  创建一个名为 `exercise3` 的新文件夹，并将第 2 章的 `drawing.js` 文件复制到该文件夹中。\n2.  创建一个名为 `exercise3.html`\
    \ 的新文件，并设置一个标准的 HTML 模板。\n3.  在 `<head>` 元素中添加对 `drawing.js` 工具库的引用。\n4.  在 `<body>`\
    \ 元素中添加一个 `<canvas>` 元素用于显示场景。\n5.  添加一个包含必要 JavaScript 代码的 `<script>` 元素，以创建对\
    \ Canvas 上下文的引用，并通过调用 `draw_grid` 函数在画布上绘制一个空白网格，该函数应通过引用工具库代码而可用。\n"
- fmt: "# Pac-Man\n\nWe should all be familiar with the 1980 Namco classic game Pac-Man.\
    \ The eponymous hero is pretty simple to draw—a filled yellow circle with a wedge\
    \ cut out. We can draw him by drawing an arc, drawing a line to the center of\
    \ the arc, and filling the path so it automatically closes the path.\n\nThe only\
    \ tricky part is choosing the start and end angles. Imagine an arrow starting\
    \ in the center of a circle, pointing to the right. This is the zero angle (zero\
    \ radians). Increasing the angle moves our arrow in a clockwise direction. An\
    \ angle of `π` radians is half a circle, pointing to the left. An angle of `2π`\
    \ radians is a full turn and our arrow points to the right again. This is shown\
    \ in Figure 3-1.\n\n![A455241_1_En_3_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_3_Fig1_HTML.jpg)\n\
    \nFigure 3-1 There are `2π` radians (clockwise) in a circle\n\nTo make our Pac-Man\
    \ face right, we need to start the arc some number of radians past 0 (zero) and\
    \ finish the arc the same angle before `2π`. The total, open-mouth angle is perhaps\
    \ a little less than a quarter turn (less than `0.5π` radians), so let’s go for\
    \ starting at `0.2π` radians (pointing slightly down to the right) and ending\
    \ at `1.8π` radians (pointing slightly up to the right). Update your code as shown\
    \ in Listing 3-1.\n\n```html\n<!doctype html>\n<html>\n  <head>\n    <title>Pacmania</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
    ></script>\n  </head>\n  <body>\n    <h1>Pac-man</h1>\n    <canvas id=\"pacmania\"\
    \ width=\"400\" height=\"400\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
    pacmania\").getContext(\"2d\");\n      draw_grid(context);\n      context.beginPath();\n\
    \      context.arc(200, 200, 150, 0.2 * Math.PI, 1.8 * Math.PI);\n      context.lineTo(200,\
    \ 200);\n      context.fillStyle = \"yellow\";\n      context.fill();\n    </script>\n\
    \  </body>\n</html>\n```\n\nListing 3-1 A Simple Pac-Man\n\nThis code should be\
    \ familiar except for a few new lines. We’re using the `context.arc` method to\
    \ draw an arc with a radius of 150 pixels, centered at point `(200, 200)`, beginning\
    \ at `0.2π` radians, all the way around in a clockwise direction to `1.8π` radians.\
    \ To cut the wedge out, we draw a line to the center. We then set the fill style\
    \ to yellow and fill the path—the result is shown in Figure 3-2. The `context.arc`\
    \ method can optionally take a final Boolean parameter for drawing counterclockwise.\
    \ This can be convenient when using arcs in more complicated paths.\n\n![A455241_1_En_3_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_3_Fig2_HTML.jpg)\n\
    \nFigure 3-2 Pac-Man is just a circle with a wedge cut out\n\n## Create a Function\n\
    \nBut Pac-Man eats pellets, and to do that he opens and closes his mouth as he\
    \ moves along, so we need to be able to draw him with different-sized wedges cut\
    \ out. Refactor your code into a function that draws Pac-Man and move your `draw_pacman`\
    \ function into the `drawing.js` library.\n\nYour function will need to take four\
    \ arguments. The first two arguments are the `x`- and `y`-coordinates. The third\
    \ argument is the radius. The fourth argument is a value between 0 and 1 representing\
    \ how \"open\" the mouth is from fully closed (0) to fully open (1). Also, so\
    \ that your Pac-Man can be drawn onto lighter backgrounds, call `context.closePath`\
    \ and `context.stroke` within your function to draw a black outline around your\
    \ Pac-Man. This is a chance to create your own function.\n\n## Randomization\n\
    \nCalling the `random` method of the `Math` object (that is, calling `Math.random()`)\
    \ generates a randomized number between 0 and 1. Once you have your function,\
    \ replace the old Pac-Man drawing code with a single line to draw a randomized\
    \ Pac-Man via your function, like so:\n\n```\ndraw_pacman(context, 200, 200, 150,\
    \ Math.random());\n```\n\nRefresh the page a few times to see the randomized mouth\
    \ angle. We’re using `Math.random` to generate a random number between 0 and 1.\
    \ When we defined our function, we specified that the mouth angle could be passed\
    \ in as an argument in this range. So, as long as the function draws the Pac-Man\
    \ correctly, we should be drawing a Pac-Man with a randomized mouth angle.\n\n\
    In another implementation, we could have the random number be multiplied by `0.2π`\
    \ to create the angle on either side of zero (0) that would be used for drawing\
    \ the mouth. Each time the browser is reloaded, then, a new random number would\
    \ be generated, and the drawing function would be called with a new mouth angle.\
    \ Take your time and make sure you understand what you’re doing before continuing.\
    \ This stuff is easy once you get the hang of it.\n\nNow we have a function, and\
    \ we can use it to draw Pac-Mans all over our canvas. Try a simple loop to draw\
    \ some random stuff. Here we’re using a `do while` loop to draw random Pac-Mans\
    \ until a random number is generated that’s greater than `0.9`. The `do while`\
    \ loop always executes at least once, so we should always see at least one Pac-Man\
    \ drawn. When the random number is greater than `0.9`, the loop ends. See Listing\
    \ 3-2.\n\n```javascript\nvar min_radius = 5;\nvar max_radius = 50;\ndo {\n  let\
    \ x = context.canvas.width * Math.random();\n  let y = context.canvas.height *\
    \ Math.random();\n  let radius = min_radius + (max_radius - min_radius) * Math.random();\n\
    \  draw_pacman(context, x, y, radius, Math.random());\n} while(Math.random() <\
    \ 0.9);\n```\n\nListing 3-2 Randomizing in a Loop\n\nIt is clear that we have\
    \ randomized the coordinates and the radius as well as the mouth angle. Notice\
    \ that for readability we’ve defined a number of variables (`min_radius`, `max_radius`,\
    \ `x`, `y`, and `radius`). These statements could have been passed directly into\
    \ the function as arguments, as we’ve done for the mouth argument. Splitting the\
    \ code up into simple statements improves clarity and allows the code to fit on\
    \ the screen.\n\nFigure 3-3 shows what you should see. The resultant canvas is\
    \ Pac-mania. Notice how the black outline we added to the drawing helps us to\
    \ distinguish overlapping Pac-Mans.\n\n![A455241_1_En_3_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_3_Fig3_HTML.jpg)\n\
    \nFigure 3-3 Multiple, random Pac-Mans\n\n## Summary\n\nIn this chapter we reviewed\
    \ paths and functions with a simple but familiar example. Notice how we ended\
    \ up with a small piece of code in our script but that it does some fairly complex\
    \ drawing thanks to our use of functions to abstract away the details of the actual\
    \ individual drawing tasks. I also introduced randomization and loops—important\
    \ concepts we’ll make use of extensively later on.\n\nTry experimenting with what\
    \ we’ve done. Pick another familiar shape to draw. Create a function and decide\
    \ what arguments should be made available. Randomize the inputs in a loop to create\
    \ your own complex scene.\n\n© Graeme Stuart 2017\n\nGraeme Stuart, Introducing\
    \ JavaScript Game Development, [https://doi.org/10.1007/978-1-4842-3252-1_4](https://doi.org/10.1007/978-1-4842-3252-1_4)\n\
    \n# 4. Drawing a Spaceship\n\nGraeme Stuart^(1)\n\n(1) Market Harborough, Leicestershire,\
    \ UK\n\nOkay, let’s get a bit more serious and start work on our game elements.\
    \ The spaceship in both the classic and modern Asteroids games is based on a simple\
    \ isosceles triangle. In this chapter, we’ll draw the spaceship and develop the\
    \ design using quadratic curves to customize our ship.\n\nWe want our ship to\
    \ approximate to a circle with a given radius because later we will use \"circle\
    \ to circle\" collision detection. So, we’re interested in locating points on\
    \ the edge of a circle. Using angles and distances (polar coordinates) is the\
    \ obvious way to specify the points we want, but to draw to the canvas, we need\
    \ to use `x` and `y` values (Cartesian coordinates). We’ll need to get over this."
  raw: '## Pac-Man


    We should all be familiar with the 1980 Namco classic game Pac-Man. The eponymous
    hero is pretty simple to draw—a filled yellow circle with a wedge cut out. We
    can draw him by drawing an arc, drawing a line to the center of the arc, and filling
    the path so it automatically closes the path. The only tricky part is choosing
    the start and end angles. Imagine an arrow starting in the center of a circle,
    pointing to the right. This is the zero angle (zero radians). Increasing the angle
    moves our arrow in a clockwise direction. An angle of π radians is half a circle,
    pointing to the left. An angle of 2π radians is a full turn and our arrow points
    to the right again. This is shown in Figure [3-1](#A455241_1_En_3_Chapter.xhtml#Fig1).
    ![A455241_1_En_3_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_3_Fig1_HTML.jpg) Figure
    3-1 There are 2π radians (clockwise) in a circle To make our Pac-Man face right,
    we need to start the arc some number of radians past 0 (zero) and finish the arc
    the same angle before 2π. The total, open-mouth angle is perhaps a little less
    than a quarter turn (less than 0.5π radians), so let’s go for starting at 0.2π
    radians (pointing slightly down to the right) and ending at 1.8π radians (pointing
    slightly up to the right). Update your code as shown in Listing [3-1](#A455241_1_En_3_Chapter.xhtml#Par13).
    <!doctype html> <html>   <head>     <title>Pacmania</title>     <link rel="stylesheet"
    href="styles.css">     <script src="drawing.js"></script>   </head>   <body>     <h1>Pac-man</h1>
        <canvas id="pacmania" width="400" height="400"></canvas>     <script>       var
    context = document.getElementById("pacmania").getContext("2d");       draw_grid(context);
          context.beginPath();       context.arc(200, 200, 150, 0.2 * Math.PI, 1.8
    * Math.PI);       context.lineTo(200, 200);       context.fillStyle = "yellow";
          context.fill();     </script>   </body> </html> Listing 3-1 A Simple Pac-Man
    This code should be familiar except for a few new lines. We’re using the context.arc
    method to draw an arc with a radius of 150 pixels, centered at point (200, 200),
    beginning at 0.2π radians, all the way around in a clockwise direction to 1.8π
    radians. To cut the wedge out, we draw a line to the center. We then set the fill
    style to yellow and fill the path—the result is shown in Figure [3-2](#A455241_1_En_3_Chapter.xhtml#Fig2).
    The context.arc method can optionally take a final Boolean parameter for drawing
    counterclockwise. This can be convenient when using arcs in more complicated paths.
    ![A455241_1_En_3_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_3_Fig2_HTML.jpg) Figure
    3-2 Pac-Man is just a circle with a wedge cut out


    ## Create a Function


    But Pac-Man eats pellets, and to do that he opens and closes his mouth as he moves
    along, so we need to be able to draw him with different-sized wedges cut out.
    Refactor your code into a function that draws Pac-Man and move your draw_pacman
    function into the drawing.js library. Your function will need to take four arguments.
    The first two arguments are the x- and y-coordinates. The third argument is the
    radius. The fourth argument is a value between 0 and 1 representing how “open”
    the mouth is from fully closed (0) to fully open (1). Also, so that your Pac-Man
    can be drawn onto lighter backgrounds, call context.closePath and context.stroke
    within your function to draw a black outline around your Pac-Man. This is a chance
    to create your own function.


    ## Randomization


    Calling the random method of the Math object (that is, calling Math.random())
    generates a randomized number between 0 and 1\. Once you have your function, replace
    the old Pac-Man drawing code with a single line to draw a randomized Pac-Man via
    your function, like so: draw_pacman(context, 200, 200, 150, Math.random()); Refresh
    the page a few times to see the randomized mouth angle. We’re using Math. random
    to generate a random number between 0 and 1\. When we defined our function, we
    specified that the mouth angle could be passed in as an argument in this range.
    So, as long as the function draws the Pac-Man correctly, we should be drawing
    a Pac-Man with a randomized mouth angle. In another implementation, we could have
    the random number be multiplied by 0.2π to create the angle on either side of
    zero (0) that would be used for drawing the mouth. Each time the browser is reloaded,
    then, a new random number would be generated, and the drawing function would be
    called with a new mouth angle. Take your time and make sure you understand what
    you’re doing before continuing. This stuff is easy once you get the hang of it.
    Now we have a function, and we can use it to draw Pac-Mans all over our canvas.
    Try a simple loop to draw some random stuff. Here we’re using a do while loop
    to draw random Pac-Mans until a random number is generated that’s greater than
    0.9\. The do while loop always executes at least once, so we should always see
    at least one Pac-Man drawn. When the random number is greater than 0.9, the loop
    ends. See Listing [3-2](#A455241_1_En_3_Chapter.xhtml#Par24). var min_radius =
    5; var max_radius = 50; do {   let x = context.canvas.width * Math.random();   let
    y = context.canvas.height * Math.random();   let radius = min_radius + (max_radius
    - min_radius) * Math.random();   draw_pacman(context, x, y, radius, Math.random());
    } while(Math.random() < 0.9); Listing 3-2 Randomizing in a Loop It is clear that
    we have randomized the coordinates and the radius as well as the mouth angle.
    Notice that for readability we’ve defined a number of variables (min_radius, max_radius,
    x, y, and radius). These statements could have been passed directly into the function
    as arguments, as we’ve done for the mouth argument. Splitting the code up into
    simple statements improves clarity and allows the code to fit on the screen. Figure [3-3](#A455241_1_En_3_Chapter.xhtml#Fig3)
    shows what you should see. The resultant canvas is Pac-mania. Notice how the black
    outline we added to the drawing helps us to distinguish overlapping Pac-Mans .
    ![A455241_1_En_3_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_3_Fig3_HTML.jpg) Figure
    3-3 Multiple, random Pac-Mans


    ## Summary


    In this chapter we reviewed paths and functions with a simple but familiar example.
    Notice how we ended up with a small piece of code in our script but that it does
    some fairly complex drawing thanks to our use of functions to abstract away the
    details of the actual individual drawing tasks. I also introduced randomization
    and loops—important concepts we’ll make use of extensively later on. Try experimenting
    with what we’ve done. Pick another familiar shape to draw. Create a function and
    decide what arguments should be made available. Randomize the inputs in a loop
    to create your own complex scene.© Graeme Stuart 2017 Graeme StuartIntroducing
    JavaScript Game Development [https://doi.org/10.1007/978-1-4842-3252-1_4](#A455241_1_En_4_Chapter.xhtml)


    # 4. Drawing a Spaceship


    Graeme Stuart^(1 ) (1) Market Harborough, Leicestershire, UK   Okay, let’s get
    a bit more serious and start work on our game elements. The spaceship in both
    the classic and modern Asteroids games is based on a simple isosceles triangle.
    In this chapter, we’ll draw the spaceship and develop the design using quadratic
    curves to customize our ship. We want our ship to approximate to a circle with
    a given radius because later we will use “circle to circle” collision detection.
    So, we’re interested in locating points on the edge of a circle. Using angles
    and distances (polar coordinates) is the obvious way to specify the points we
    want, but to draw to the canvas, we need to use x and y values (Cartesian coordinates).
    We’ll need to get over this.'
  trans: "\n# 吃豆人\n\n大家对 1980 年南梦宫经典游戏《吃豆人》应该都不陌生。这位同名主角画起来相当简单——就是一个被切掉一块楔形的黄色实心圆。我们可以通过绘制一条弧线、再画一条连接到弧线圆心的直线，然后填充路径（路径会自动闭合）来画出它。\n\
    \n唯一的难点在于选择起始角和终止角。想象一支从圆心出发、指向右侧的箭头。这就是零角度（零弧度）。增大角度会让我们箭头顺时针方向旋转。`π`弧度的角度是半圆，指向左侧。`2π`弧度的角度是完整的一圈，箭头重新指向右侧。如图\
    \ 3-1 所示。\n\n![A455241_1_En_3_Fig1_HTML.jpg](img/A455241_1_En_3_Fig1_HTML.jpg)\n\
    \n图 3-1 一个圆内有 `2π` 弧度（顺时针方向）\n\n要让我们的吃豆人面向右侧，需要让弧线从超过 0（零）的某个弧度数开始，并在距离 `2π` 同样角度处结束。张开嘴的总角度大概略小于四分之一圈（小于\
    \ `0.5π` 弧度），所以我们选择从 `0.2π` 弧度（稍微指向右下方）开始，到 `1.8π` 弧度（稍微指向右上方）结束。请按清单 3-1 所示更新你的代码。\n\
    \n```html\n<!doctype html>\n<html>\n  <head>\n    <title>Pacmania</title>\n  \
    \  <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
    ></script>\n  </head>\n  <body>\n    <h1>Pac-man</h1>\n    <canvas id=\"pacmania\"\
    \ width=\"400\" height=\"400\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
    pacmania\").getContext(\"2d\");\n      draw_grid(context);\n      context.beginPath();\n\
    \      context.arc(200, 200, 150, 0.2 * Math.PI, 1.8 * Math.PI);\n      context.lineTo(200,\
    \ 200);\n      context.fillStyle = \"yellow\";\n      context.fill();\n    </script>\n\
    \  </body>\n</html>\n```\n\n清单 3-1 一个简单的吃豆人\n\n这段代码除了几行新内容外应该都很熟悉。我们使用了 `context.arc`\
    \ 方法来绘制一条半径为 150 像素的弧线，圆心位于点 `(200, 200)`，从 `0.2π` 弧度开始，沿顺时针方向一直延伸到 `1.8π` 弧度。为了切出楔形部分，我们画了一条线连接到圆心。然后我们将填充样式设为黄色并填充路径——结果如图\
    \ 3-2 所示。`context.arc` 方法还可以接受一个可选的最终布尔参数，用于指定逆时针方向绘制。这在较复杂的路径中使用弧线时会很方便。\n\n\
    ![A455241_1_En_3_Fig2_HTML.jpg](img/A455241_1_En_3_Fig2_HTML.jpg)\n\n图 3-2 吃豆人就是一个被切掉一块楔形的圆\n\
    \n## 创建函数\n\n但是吃豆人要吃小圆点，为此它需要在移动的过程中张开和闭合嘴巴，所以我们需要能够画出带有不同大小楔形切口的吃豆人。将你的代码重构为一个绘制吃豆人的函数，并将你的\
    \ `draw_pacman` 函数移到 `drawing.js` 库中。\n\n你的函数需要接受四个参数。前两个参数是 `x` 和 `y` 坐标。第三个参数是半径。第四个参数是一个介于\
    \ 0 和 1 之间的值，表示嘴巴从完全闭合（0）到完全张开（1）的“张开”程度。另外，为了让你的吃豆人能画在较浅色的背景上，请在你的函数中调用 `context.closePath`\
    \ 和 `context.stroke` 来为吃豆人绘制黑色轮廓。这是一个创建你自己函数的机会。\n\n## 随机化\n\n调用 `Math` 对象的 `random`\
    \ 方法（即调用 `Math.random()`）会生成一个介于 0 和 1 之间的随机数。一旦你有了自己的函数，就用一行代码替换掉旧的吃豆人绘制代码，通过你的函数来绘制一个随机化的吃豆人，如下所示：\n\
    \n```\ndraw_pacman(context, 200, 200, 150, Math.random());\n```\n\n刷新页面几次，看看随机化的嘴巴角度。我们使用\
    \ `Math.random` 来生成一个 0 到 1 之间的随机数。当我们定义函数时，我们指定嘴巴角度可以作为这个范围内的一个参数传入。因此，只要函数正确绘制了吃豆人，我们就应该能绘制出一个嘴巴角度随机化的吃豆人。\n\
    \n在另一种实现中，我们可以让随机数乘以 `0.2π`，以创建在零（0）两侧用于绘制嘴巴的角度。这样每次浏览器重新加载时，都会生成一个新的随机数，并以新的嘴巴角度调用绘图函数。请慢慢来，在继续之前确保你理解了正在做的事情。一旦掌握了窍门，这些东西就很简单了。\n\
    \n现在我们有了一个函数，可以用它在画布上到处绘制吃豆人。尝试一个简单的循环来绘制一些随机的东西。这里我们使用一个 `do while` 循环来绘制随机的吃豆人，直到生成的随机数大于\
    \ `0.9`。`do while` 循环至少会执行一次，所以我们总能至少看到一个吃豆人。当随机数大于 `0.9` 时，循环结束。参见清单 3-2。\n\n\
    ```javascript\nvar min_radius = 5;\nvar max_radius = 50;\ndo {\n  let x = context.canvas.width\
    \ * Math.random();\n  let y = context.canvas.height * Math.random();\n  let radius\
    \ = min_radius + (max_radius - min_radius) * Math.random();\n  draw_pacman(context,\
    \ x, y, radius, Math.random());\n} while(Math.random() < 0.9);\n```\n\n清单 3-2\
    \ 在循环中随机化\n\n很明显，我们对坐标、半径以及嘴巴角度都进行了随机化。请注意，为了提高可读性，我们定义了一些变量（`min_radius`、`max_radius`、`x`、`y`\
    \ 和 `radius`）。这些语句本可以直接作为参数传入函数，就像我们对嘴巴参数所做的那样。将代码拆分成简单的语句可以提高清晰度，并使得代码能够适应屏幕显示。\n\
    \n图 3-3 显示了你应该看到的结果。最终的画布就是吃豆人狂热。请注意我们添加到图形上的黑色轮廓是如何帮助我们区分重叠的吃豆人的。\n\n![A455241_1_En_3_Fig3_HTML.jpg](img/A455241_1_En_3_Fig3_HTML.jpg)\n\
    \n图 3-3 多个随机位置的吃豆人\n\n## 总结\n\n在本章中，我们通过一个简单但熟悉的例子回顾了路径和函数。请注意，我们最终在脚本中只用了很少的代码，但由于我们使用函数抽象掉了实际单个绘图任务的细节，它却完成了相当复杂的绘图。我还介绍了随机化和循环——这些是重要的概念，我们将在以后大量使用。\n\
    \n尝试对我们所做的内容进行实验。选取另一个你熟悉的形状来绘制。创建一个函数并决定应该提供哪些参数。在循环中将输入随机化，以创建你自己的复杂场景。\n\n\
    © Graeme Stuart 2017\n\nGraeme Stuart, 介绍 JavaScript 游戏开发, [`doi.org/10.1007/978-1-4842-3252-1_4`](https://doi.org/10.1007/978-1-4842-3252-1_4)\n\
    \n# 4. 绘制宇宙飞船\n\nGraeme Stuart¹\n\n(1) 英国莱斯特郡马基特哈伯勒\n\n好的，让我们更认真一点，开始着手处理我们的游戏元素。经典和现代版《爆破彗星》游戏中的宇宙飞船都是基于一个简单的等腰三角形。在本章中，我们将绘制宇宙飞船，并使用二次曲线来定制我们的飞船设计。\n\
    \n我们希望我们的飞船能近似于一个具有给定半径的圆，因为稍后我们将使用“圆对圆”碰撞检测。因此，我们需要定位圆边缘上的点。使用角度和距离（极坐标）是指定我们想要点的明显方法，但要绘制到画布上，我们需要使用\
    \ `x` 和 `y` 值（笛卡尔坐标）。我们需要解决这个问题。\n"
- fmt: "# Basic Trigonometry\n\nTrigonometry is going to come up a few times in this\
    \ book, so it's a good idea to be clear about it now. We'll be using a very simple\
    \ subset that allows us to calculate the x- and y-coordinates from angles and\
    \ distances. Figure [4-1](#A455241_1_En_4_Chapter.xhtml#Fig1) shows the basic\
    \ principle. The longest edge of a right-angled triangle is the straight line\
    \ between the centre of a circle and a point on the circumference. If we change\
    \ the angle, this affects the x- and y-coordinates in a predictable way. ![A455241_1_En_4_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig1_HTML.jpg)\
    \ Figure 4-1 Sine and cosine of an angle, θ\n\nBasically all you will need to\
    \ know for now is that the sine and cosine functions allow the (x, y) coordinates\
    \ to be calculated from a distance (a radius) and a direction (an angle). In JavaScript,\
    \ there are two corresponding methods of the `Math` object: `Math.sin(θ)` and\
    \ `Math.cos(θ)`. With these, we can calculate the x- and y-coordinates relative\
    \ to the center of the circle for any given angle, θ. To convert an angle and\
    \ a distance to x- and y-coordinates, simply multiply these values by the distance\
    \ you need (the radius of the circle). In our diagram, the blue dotted line shows\
    \ the value of the y-coordinate, calculated as `r × Math.sin(θ)`. The red dotted\
    \ line shows the value of the x-coordinate, calculated as `r × Math.cos(θ)`.\n\
    \n## A Basic Ship\n\nLet's put this to work. We'll use a function to draw a ship\
    \ to the canvas at a specific position, with a specific radius. Remember, we want\
    \ our ship to fill a circle as completely as possible. To start, create a new\
    \ folder called `exercise4`, copy through the stylesheet (`styles.css`) and `drawing.js`\
    \ library, and add a new file `exercise4.html` with the code from Listing [4-1](#A455241_1_En_4_Chapter.xhtml#Par9).\n\
    \n```\n<!doctype html>\n<html>\n  <head>\n    <title>Drawing a spaceship</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
    ></script>\n  </head>\n  <body>\n    <h1>Drawing a spaceship</h1>\n    <canvas\
    \ id=\"asteroids\" width=\"400\" height=\"400\"></canvas>\n    <script>\n    \
    \  var context = document.getElementById(\"asteroids\").getContext(\"2d\");\n\
    \      draw_grid(context);\n      draw_ship(context, 200, 200, 150, {guide: true});\n\
    \    </script>\n  </body>\n</html>\n```\n\nListing 4-1 Template for Drawing a\
    \ Ship\n\nThe template loads the stylesheet and library and includes a simple\
    \ three-line script. The script creates a reference to the context, draws the\
    \ grid, and then draws our ship by calling the new `draw_ship` function with some\
    \ arguments. The first argument is the context, the second and third are the x-\
    \ and y-coordinates, and the fourth is the radius of the circle that contains\
    \ the ship. The final argument is a bit different—it contains an object, which\
    \ we'll get to later.\n\nOur first version of the `draw_ship` function is shown\
    \ in Listing [4-2](#A455241_1_En_4_Chapter.xhtml#Par12). Add this to the `drawing.js`\
    \ library.\n\n```\nfunction draw_ship(ctx, x, y, radius, options) {\n  options\
    \ = options || {};\n  ctx.save();\n  // optionally draw a guide showing the collision\
    \ radius\n  if(options.guide) {\n    ctx.strokeStyle = \"white\";\n    ctx.fillStyle\
    \ = \"rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth = 0.5;\n    ctx.beginPath();\n\
    \    ctx.arc(x, y, radius, 0, 2 * Math.PI);\n    ctx.stroke();\n    ctx.fill();\n\
    \  }\n  // set some default values\n  ctx.lineWidth = options.lineWidth || 2;\n\
    \  ctx.strokeStyle = options.stroke || \"white\";\n  ctx.fillStyle = options.fill\
    \ || \"black\";\n  let angle = (options.angle || 0.5 * Math.PI) / 2;\n  // draw\
    \ the ship in three lines\n  ctx.beginPath();\n  ctx.moveTo(x + radius, y);\n\
    \  ctx.lineTo(\n    x + Math.cos(Math.PI - angle) * radius,\n    y + Math.sin(Math.PI\
    \ - angle) * radius\n  );\n  ctx.lineTo(\n    x + Math.cos(Math.PI + angle) *\
    \ radius,\n    y + Math.sin(Math.PI + angle) * radius\n  );\n  ctx.closePath();\n\
    \  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n}\n```\n\nListing 4-2 Drawing\
    \ a Basic Ship\n\nThe result is a basic ship. Load the template in your browser,\
    \ and you should see something like Figure [4-2](#A455241_1_En_4_Chapter.xhtml#Fig2).\
    \ ![A455241_1_En_4_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig2_HTML.jpg) Figure\
    \ 4-2 A simple triangle ship\n\nThe core of the function uses `context.moveTo`\
    \ and `context.lineTo` to draw three lines forming a triangle. It sets a few parameters\
    \ on the context and then fills the shape and strokes the outline. But it does\
    \ a lot of other stuff too. There are a few new things here that require explanation.\n\
    \n## Using Object Literals\n\nNotice we've defined a fifth argument: `options`.\
    \ This is an optional argument; we can see this because it's set to an empty object\
    \ (`{}`) if it's undefined. The `options` argument allows multiple optional aspects\
    \ of the ship to be set. These options are referenced using dotted notation, such\
    \ as `options.stroke` or `options.fill`. If they're not defined, default values\
    \ are provided.\n\n> **Note** Objects are extremely useful and will be used extensively\
    \ in later sections. Here I introduce the object literal `{}` used as a simple\
    \ key: value store. Object literals are specified as curly braces containing several\
    \ key: value pairs, separated by commas. Keys can be anything that converts to\
    \ a valid JavaScript string. Values can be anything. Empty objects are specified\
    \ as a pair of curly braces (`{}`).\n\nUpdate your `exercise4.html` file to use\
    \ the `draw_ship` function with different options set, as shown in Listing [4-3](#A455241_1_En_4_Chapter.xhtml#Par19).\n\
    \n```\n<script>\n  var context = document.getElementById(\"asteroids\").getContext(\"\
    2d\");\n  draw_grid(context);\n  draw_ship(context, 200, 200, 125, {guide: true});\n\
    \  draw_ship(context, 75, 75, 50, {stroke: 'gold', fill: 'purple'});\n  draw_ship(context,\
    \ 325, 325, 50, {angle: 0.8 * Math.PI, guide: true});\n  draw_ship(context, 75,\
    \ 325, 50, {angle: 0.3 * Math.PI, guide: true});\n  draw_ship(context, 325, 75,\
    \ 50, {lineWidth: 8, fill: 'blue'});\n</script>\n```\n\nListing 4-3 Setting the\
    \ Ship Options\n\nThe result is shown in Figure [4-3](#A455241_1_En_4_Chapter.xhtml#Fig3).\
    \ Note how we can create a function that has a simple interface, and by allowing\
    \ default values, a more detailed interface is also possible. ![A455241_1_En_4_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig3_HTML.jpg)\
    \ Figure 4-3 Lots of ships\n\nThe three corners of the ship are positioned on\
    \ the radius of the circle. The front of the ship is positioned at `(x + radius,\
    \ y)`, to the right of the circle. The rear corners of the ship are determined\
    \ by the angle of the ship's nose. The angle variable is set by this line: `let\
    \ angle = (options.angle || 0.5 * Math.PI) / 2;` It defaults to `0.5π / 2`. There\
    \ are `2π` radians in a full circle, so `0.25π` radians is 45 degrees (an eighth\
    \ of a circle).\n\nThe rear corners of the ship are drawn by this code:\n\n```\n\
    ctx.lineTo(\n  x + Math.cos(Math.PI - angle) * radius,\n  y + Math.sin(Math.PI\
    \ - angle) * radius\n);\nctx.lineTo(\n  x + Math.cos(Math.PI + angle) * radius,\n\
    \  y + Math.sin(Math.PI + angle) * radius\n);\n```\n\nMultiplying each coordinate\
    \ by `radius` ensures we're always on the circle (a fixed distance from the middle).\
    \ So, we're finding the points on the circle that correspond to the angle `Math.PI\
    \ - angle` and `Math.PI + angle`. One corner is positioned on the circle 45 degrees\
    \ before `Math.PI`, and one is 45 degrees after `Math.PI`. Because `Math.PI` is\
    \ half a circle, it points to the rear of the ship, and the two corners are positioned\
    \ on either side of that.\n\nLook at Figure [4-3](#A455241_1_En_4_Chapter.xhtml#Fig3)\
    \ and think carefully about this until you can see what is going on. Remember,\
    \ the guide circle shows where collisions will be detected. Asteroids will have\
    \ similar circles around them, and when the circles touch, a collision will be\
    \ detected. With our ship, head-on collisions will be accurate, as will those\
    \ with the rear corners, but there are large areas between the ship and the circle\
    \ that will detect collisions too soon. This is something we'll try to improve\
    \ later.\n\n## Transforming the Canvas Context"
  raw: '## Basic Trigonometry


    Trigonometry is going to come up a few times in this book, so its a good idea
    to be clear about it now. We’ll be using a very simple subset that allows us to
    calculate the x- and y-coordinates from angles and distances. Figure [4-1](#A455241_1_En_4_Chapter.xhtml#Fig1)
    shows the basic principle. The longest edge of a right-angled triangle is the
    straight line between the centre of a circle and a point on the circumference.
    If we change the angle, this affects the x- and y-coordinates in a predictable
    way. ![A455241_1_En_4_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig1_HTML.jpg)
    Figure 4-1 Sine and cosine of an angle, θ Basically all you will need to know
    for now is that the sine and cosine functions allow the (x, y) coordinates to
    be calculated from a distance (a radius) and a direction (an angle). In JavaScript
    , there are two corresponding methods of the Math object: Math.sin(θ) and Math.cos(θ).
    With these, we can calculate the x- and y-coordinates relative to the center of
    the circle for any given angle, θ. To convert an angle and a distance to x- and
    y-coordinates, simply multiply these values by the distance you need (the radius
    of the circle). In our diagram, the blue dotted line shows the value of the y-coordinate,
    calculated as r × Math.sin(θ). The red dotted line shows the value of the x-coordinate,
    calculated as r × Math.cos(θ).


    ## A Basic Ship


    Let’s put this to work. We’ll use a function to draw a ship to the canvas at a
    specific position, with a specific radius. Remember, we want our ship to fill
    a circle as completely as possible. To start, create a new folder called exercise4,
    copy through the stylesheet (styles.css) and drawing.js library , and add a new
    file exercise4.html with the code from Listing [4-1](#A455241_1_En_4_Chapter.xhtml#Par9).
    <!doctype html> <html>   <head>     <title>Drawing a spaceship</title>     <link
