      <body>     <h1>Drawing a spaceship</h1>     <canvas id="asteroids" width="400"
    height="400"></canvas>     <script>       var context = document.getElementById("asteroids").getContext("2d");
          draw_grid(context);       draw_ship(context, 200, 200, 150, {guide: true});
        </script>   </body> </html> Listing 4-1 Template for Drawing a Ship The template
    loads the stylesheet and library and includes a simple three-line script . The
    script creates a reference to the context, draws the grid, and then draws our
    ship by calling the new draw_ship function with some arguments. The first argument
    is the context, the second and third are the x- and y-coordinates, and the fourth
    is the radius of the circle that contains the ship. The final argument is a bit
    different—it contains an object, which we’ll get to later. Our first version of
    the draw_ship function is shown in Listing [4-2](#A455241_1_En_4_Chapter.xhtml#Par12).
    Add this to the drawing.js library. function draw_ship(ctx, x, y, radius, options)
    {   options = options || {};   ctx.save();   // optionally draw a guide showing
    the collision radius   if(options.guide) {     ctx.strokeStyle = "white";     ctx.fillStyle
    = "rgba(0, 0, 0, 0.25)";     ctx.lineWidth = 0.5;     ctx.beginPath();     ctx.arc(x,
    y, radius, 0, 2 * Math.PI);     ctx.stroke();     ctx.fill();   }   // set some
    default values   ctx.lineWidth = options.lineWidth || 2;   ctx.strokeStyle = options.stroke
    || "white";   ctx.fillStyle = options.fill || "black";   let angle = (options.angle
    || 0.5 * Math.PI) / 2;   // draw the ship in three lines   ctx.beginPath();   ctx.moveTo(x
    + radius, y);   ctx.lineTo(     x + Math.cos(Math.PI - angle) * radius,     y
    + Math.sin(Math.PI - angle) * radius   );   ctx.lineTo(     x + Math.cos(Math.PI
    + angle) * radius,     y + Math.sin(Math.PI + angle) * radius   );   ctx.closePath();
      ctx.fill();   ctx.stroke();   ctx.restore(); } Listing 4-2 Drawing a Basic Ship
    The result is a basic ship . Load the template in your browser, and you should
    see something like Figure [4-2](#A455241_1_En_4_Chapter.xhtml#Fig2). ![A455241_1_En_4_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig2_HTML.jpg)
    Figure 4-2 A simple triangle ship The core of the function uses context.moveTo
    context.lineTo to draw three lines forming a triangle. It sets a few parameters
    on the context and then fills the shape and strokes the outline. But it does a
    lot of other stuff too. There are a few new things here that require explanation.


    ## Using Object Literals


    Notice we’ve defined a fifth argument: options. This is an optional argument;
    we can see this because it’s set to an empty object ({}) if it’s undefined. The
    options argument allows multiple optional aspects of the ship to be set. These
    options are referenced using dotted notation, such as options.stroke or options.fill.
    If they’re not defined, default values are provided. Note Objects are extremely
    useful and will be used extensively in later sections. Here I introduce the object
    literal {} used as a simple key: value store. Object literals are specified as
    curly braces containing several key: value pairs, separated by commas. Keys can
    be anything that converts to a valid JavaScript string. Values can be anything.
    Empty objects are specified as a pair of curly braces ({}). Update your exercise4.html
