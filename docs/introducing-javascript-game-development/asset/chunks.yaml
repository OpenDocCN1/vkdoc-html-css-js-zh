    as it develops. I should be clear that animating based on setInterval is not best
    practice. Modern browsers implement a mechanism specifically designed for animating
    on the web. We should quickly move to using the window.requestAnimationFrame method
    to control our game loop. So let’s do it.© Graeme Stuart 2017 Graeme StuartIntroducing
