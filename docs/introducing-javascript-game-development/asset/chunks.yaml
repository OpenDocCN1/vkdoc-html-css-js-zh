    the value of π via the Math.PI method. We’ll use the built-in JavaScript Math
    object extensively in later chapters. The remaining method calls are all either
    context.moveTo or context.lineTo until we finally call context.stroke to draw
    the path. The context.moveTo and context.lineTo methods both take two arguments,
    and in both cases these are the (x, y) coordinates specifying a location on the
    canvas in pixels. They each do exactly what you would expect. To move the “pen”
    to a location without drawing a line, call context.moveTo. To draw a line from
    the current location to the given location, call context.lineTo. Follow the code
    line by line and see how each line of code is necessary to draw the stick figure
    shown in Figure [1-6](#A455241_1_En_1_Chapter.xhtml#Fig6). Try removing or editing
    some of the lines to see what happens. Play around until you can predict the effect
