  trans: "\n# 总结\n\n我们为游戏添加了新的功能。现在我们可以四处飞行并摧毁小行星。与此同时，我们也为代码增加了显著的复杂性——在 `update`\
    \ 和 `draw` 函数中，我们现在管理着游戏本身。我们检测碰撞并对碰撞后果进行编码。这里的主要经验是，新代码始终应该在结构中有其专属的位置。我们在本章开头重构了代码，为新增的复杂逻辑创建了一个安放之处。我们并非必须这样做，但这样做了会带来许多微小的好处并简化工作。这些函数本身在\
    \ `game` 对象内部提供了结构。当阅读这些函数时，我们能够理解发生了什么。将复杂代码直接声明在全局作用域中，始终是一个信号，表明应该考虑通过重构来增加结构。©\
    \ Graeme Stuart 2017 Graeme Stuart 著《JavaScript 游戏开发入门》[`doi.org/10.1007/978-1-4842-3252-1_13`](https://doi.org/10.1007/978-1-4842-3252-1_13)\n\
    \n# 13. 绝地求生\n\nGraeme Stuart^(1 ) (1) 英国莱斯特郡马基特哈伯勒\n\n我们的游戏已接近完成。本章中，我们将添加最后的润色。我们将添加一个“游戏结束”状态，当生命值降为零时结束游戏。接着，我们将添加无需重新加载页面即可重新开始游戏的功能。最后，我们将添加关卡，让我们能够持续游玩，难度逐渐增加，得分倍率也随之提高。请将你的代码复制到一个新文件夹中，这是最后一次了。保存一份\
    \ `exercise12.html` 文件的副本，并将其重命名为 `exercise13.html`。\n\n## 游戏结束\n\n当飞船生命值耗尽时，没有任何反应。我们需要修改这一点，让游戏结束。我们将通过设置一个\
    \ `game_over` 属性来表示游戏已结束。首先，我们需要在 `AsteroidsGame` 构造函数中添加该属性：`this.game_over =\
    \ false;` 现在，当处于“游戏结束”状态时，我们希望显示剩余的小行星仍在太空中移动，但其他所有元素都可以停止更新，并且不会被绘制出来。在 `AsteroidsGame.prototype.update`\
    \ 方法中，在完成小行星更新之后、飞船和发射物更新之前，添加以下几行代码：\n\n```\nif(this.ship.health <= 0) {\n  this.game_over\
    \ = true;\n  return;\n}\n```\n\n这里，如果飞船生命值降为零，我们设置“游戏结束”状态。同时我们从该方法返回，因此此行之后的代码都不会被处理。类似地，在\
    \ `AsteroidsGame.prototype.draw` 方法中，在绘制完小行星之后、绘制飞船之前，添加以下几行代码：\n\n```\nif(this.game_over)\
    \ {\n  return;\n}\n```\n\n这样可以确保游戏结束时我们不会绘制飞船。小行星将继续漂浮。刷新浏览器并尝试一下。如果你失去所有生命值，你的飞船将消失，剩余的小行星将傲慢地庆祝它们的胜利。任何希望始终显示的内容应放在包含\
    \ `return` 语句的 `if` 块之前。任何仅在“游戏结束”状态下显示的内容应放在 `if` 块内部，并在 `return` 语句之前。任何仅在游戏运行期间显示的内容应放在\
    \ `if` 块之后。我们需要告知用户游戏结束。按清单 13-1 所示进行修改。\n\n```\nif(this.game_over) {\n  this.message.draw(this.c,\
    \ \"游戏结束\", \"按空格键重新开始\");\n  return;\n}\n```\n\n**清单 13-1** 发送消息\n\n现在将清单 13-2\
    \ 中的 `Message` 对象添加到 `objects.js` 中。\n\n```\nfunction Message(x, y, options) {\n\
    \  options = options || {};\n  this.x = x;\n  this.y = y;\n  this.main_pt = options.main_pt\
    \ || 28;\n  this.sub_pt = options.sub_pt || 18;\n  this.fill = options.fill ||\
    \ \"white\";\n  this.textAlign = options.align || 'center';\n}\n\nMessage.prototype.draw\
    \ = function(c, main, sub) {\n  c.save();\n  c.fillStyle = this.fill;\n  c.textAlign\
    \ = this.textAlign;\n  c.font = this.main_pt + \"pt Arial\";\n  c.fillText(main,\
    \ this.x, this.y);\n  c.font = this.sub_pt + \"pt Arial\";\n  c.fillText(sub,\
    \ this.x, this.y + this.main_pt);\n  c.restore();\n}\n```\n\n**清单 13-2** 传递消息\n\
    \n最后，更新游戏对象构造函数以设置消息对象：`this.message = new Message(this.canvas.width / 2, this.canvas.height\
    \ * 0.4);` 现在刷新页面，欣赏一下当你生命值耗尽时出现的精美“游戏结束”消息。你应该能看到类似图 13-1 的画面。\n\n![A455241_1_En_13_Fig1_HTML.jpg](img/A455241_1_En_13_Fig1_HTML.jpg)\n\
    \n**图 13-1** 引入风险\n\n## 重新开始游戏\n\n我们需要处理空格键按下事件以重置游戏。我们将实现一个 `reset_game` 方法，因此需要更新\
    \ `AsteroidsGame.prototype.key_handler` 方法，当按下空格键且 `game_over` 属性被设置时，调用此方法。\n\
    \n```\ncase \" \":\ncase 32: //空格键\n  if(this.game_over) {\n    this.reset_game();\n\
    \  } else {\n    this.ship.trigger = value;\n  }\n  break;\n```\n\n**清单 13-3**\
    \ 使用空格键重新开始游戏\n\n现在，我们需要将游戏构造函数划分为两部分：一部分是只需执行一次的初始化操作，可以保留在构造函数中；另一部分是每次游戏重新启动时都需要调用的操作。我们现在在构造函数末尾调用\
    \ `AsteroidsGame.prototype.reset_game` 方法，如清单 13-4 所示。\n\n```\nvar AsteroidsGame\
    \ = function(id) {\n  this.canvas = document.getElementById(id);\n  this.c = this.canvas.getContext(\"\
    2d\");\n  this.canvas.focus();\n  this.guide = false;\n  this.ship_mass = 10;\n\
    \  this.ship_radius = 15;\n  this.asteroid_mass = 10000; // 小行星质量\n  this.asteroid_push\
    \ = 5000000; // 单帧内施加的最大力\n  this.mass_destroyed = 500;\n  this.health_indicator\
    \ = new Indicator(\"health\", 5, 5, 100, 10);\n  this.score_indicator = new NumberIndicator(\"\
    score\", this.canvas.width - 10, 5);\n  this.message = new Message(this.canvas.width\
    \ / 2, this.canvas.height * 0.4);\n  this.canvas.addEventListener(\"keydown\"\
    , this.keyDown.bind(this), true);\n  this.canvas.addEventListener(\"keyup\", this.keyUp.bind(this),\
    \ true);\n  window.requestAnimationFrame(this.frame.bind(this));\n  this.reset_game();\n\
    }\n\nAsteroidsGame.prototype.reset_game = function() {\n  this.game_over = false;\n\
    \  this.score = 0;\n  this.ship = new Ship(\n    this.canvas.width / 2,\n    this.canvas.height\
    \ / 2,\n    1000, 200\n  );\n  this.projectiles = [];\n  this.asteroids = [];\n\
    \  this.asteroids.push(this.moving_asteroid());\n}\n```\n\n**清单 13-4** 分离出 `AsteroidsGame.prototype.reset_game`\
    \ 方法\n\n这仅仅是对现有代码的一次简单重组。尝试刷新浏览器并耗尽所有生命值。现在按下空格键会调用我们的新方法，游戏重新开始了！太棒了。\n"
- fmt: "## Implementing Levels\n\nCurrently, when we destroy all the asteroids, nothing\
    \ happens. We just keep floating around in empty space with nothing to do. What\
    \ we want to happen is that we progress to the next level and more asteroids appear.\
    \ As the levels progress, we should face more and more asteroids. First things\
    \ first: add a `level` property to the game. We set the level in the new `reset_game`\
    \ method: `this.level = 1` We also want a level indicator, so add one in the constructor,\
    \ based on Listing [13-5](#A455241_1_En_13_Chapter.xhtml#Par28). `this.level_indicator\
    \ = new NumberIndicator(\"level\", this.canvas.width / 2, 5, { align: \"center\"\
    \ });` Listing 13-5 A Level Indicator Don’t forget to draw it to the canvas in\
    \ the `AsteroidsGame.prototype.draw` method: `this.level_indicator.draw(this.c,\
    \ this.level);` Now we need to update the level property when the asteroids array\
    \ is empty. Add this to the beginning of the `AsteroidsGame.prototype.update`\
    \ method: `if(this.asteroids.length == 0) { this.level_up(); }` The new `AsteroidsGame.prototype.level_up`\
    \ method will increment the `level` property and set up more asteroids. Add the\
    \ new method shown in Listing [13-6](#A455241_1_En_13_Chapter.xhtml#Par34).\n\n\
    ```\nAsteroidsGame.prototype.level_up = function() {\n  this.level += 1;\n  for(var\
    \ i = 0; i < this.level; i++) {\n    this.asteroids.push(this.moving_asteroid());\n\
    \  }\n}\n```\n\nListing 13-6 The `AsteroidsGame.prototype.level_up` Method Now\
    \ we can tidy up our `AsteroidsGame.prototype.reset_game` method by initializing\
    \ the level to 0 and calling `level_up`. Listing [13-7](#A455241_1_En_13_Chapter.xhtml#Par36)\
    \ shows the new method.\n\n```\nAsteroidsGame.prototype.reset_game = function()\
    \ {\n  this.score = 0;\n  this.level = 0;\n  this.game_over = false;\n  this.ship\
    \ = new Ship(\n    this.canvas.width / 2,\n    this.canvas.height / 2\n  );\n\
    \  this.projectiles = [];\n  this.asteroids = [];\n  this.level_up();\n}\n```\n\
    \nListing 13-7 A Tidy `AsteroidsGame.prototype.reset_game` Method Refresh the\
    \ browser and play your fully featured game. When all the asteroids are destroyed,\
    \ they’re replaced with a larger batch. The game starts out easy but quickly gets\
    \ harder. Once you lose all your health, the “game over” state shows, and the\
    \ game restarts when the spacebar is pressed. Sit back and contemplate what you’ve\
    \ done. By my calculations, you now have over 700 lines of code and a really solid,\
    \ extendable game. The code is beautifully organized, and adding features such\
    \ as a particle system for explosions and thruster trails, powerups, and sounds\
    \ would be easy.\n\n## Summary\n\nIn this chapter we’ve refined our game into\
    \ a complete user experience by introducing states. Our game previously had two\
    \ dead-ends. If the player was killed, the game continued as if nothing had happened.\
    \ If the player destroyed the last asteroid, the game simply continued with nothing\
    \ to shoot at. By adding a “game over” state, we introduced jeopardy. By adding\
    \ a level system and bringing more asteroids into the game, we introduced ambition\
    \ and potential. There are now no longer any states in the game where the user\
    \ gets stuck. Of course, the game is still very simple, and other than challenging\
    \ friends to achieve the highest score there’s little long-term playability here.\
    \ That situation can be improved by introducing features such as powerups (especially\
    \ if rare powerups enable progression in later levels). You could also make improvements\
    \ such as a scoreboard to record precisely who the best player is, which can make\
    \ the game more attractive. The look and feel of the game can be improved by adding\
    \ a snazzy particle system for the thruster trails and explosions when asteroids\
