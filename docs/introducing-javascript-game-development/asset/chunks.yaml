    just like an asteroid. Add the code in Listing [9-12](#A455241_1_En_9_Chapter.xhtml#Par43)
    to your library. function Ship(x, y) {   this.super(x, y, 10, 20, 1.5 * Math.PI);
    } extend(Ship, Mass); Ship.prototype.draw = function(c, guide) {   c.save();   c.translate(this.x,
    this.y);   c.rotate(this.angle);   c.strokeStyle = "white";   c.lineWidth = 2;
      c.fillStyle = "black";   draw_ship(c, this.radius, {     guide: guide   });
      c.restore(); } Listing 9-12 The Ship Class In your exercise9.html file, add
    some code to set up your asteroids and ship properly. Try to automatically push
