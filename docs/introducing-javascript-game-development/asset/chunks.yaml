    Figure 1-7 The finished poster


    ## Summary


    In this chapter we’ve had a very quick run-through of the basic technologies we’ll
    be using to create our game. We’ve created our first HTML document and viewed
    it in the browser, we’ve styled our document, and we’ve written code to manipulate
    our canvas element. We’ve seen that the HTML <canvas> element has a programmable
    interface, and we’ve used HTML <script> elements with JavaScript code to draw
    to the canvas. We’ve been introduced to some of the methods available in the canvas
    context and used them to render a motivational poster to the canvas. And we’ve
    seen that the interface gives us tools for drawing lines and filling shapes and
    that we can control the thickness of lines and the color of lines and shapes.
    We learned a little about the coordinate system and how paths are constructed.
    In Chapter [2](#A455241_1_En_2_Chapter.xhtml), we’ll expand on this and try to
    get a deeper understanding of how to master the art of drawing what we want on
    the HTML canvas.© Graeme Stuart 2017 Graeme StuartIntroducing JavaScript Game
    Development [https://doi.org/10.1007/978-1-4842-3252-1_2](#A455241_1_En_2_Chapter.xhtml)


    # 2. Understanding Paths


    Graeme Stuart^(1 ) (1) Market Harborough, Leicestershire, UK   Chapter [1](#A455241_1_En_1_Chapter.xhtml)
    introduced some of the basic methods for drawing to the canvas. This chapter presents
    a follow-up exercise that looks more closely at the canvas coordinate system and
    explores how to construct paths. These concepts are critical to understanding
    the canvas and designing your own drawing code. We’ll also start to add a bit
    more structure to our code. Complex code can be difficult to comprehend—adding
    structure is the main way to keep the complexity under control. Structuring code
    into functions allows the development of simpler code that uses those functions.
    This chapter introduces functions and goes through the process of refactoring,
    a crucial skill that’s necessary to manage code of any complexity.


    ## Organizing Your Files


    To get started, we are going to organize our HTML document in a more traditional
    way. In Chapter [1](#A455241_1_En_1_Chapter.xhtml), we simply included the styling
    information in a <style> element. To remove clutter and make the styles reusable,
    we’re going to move the styles into a separate file. Create a file called exercise2.html
    and start with the basic template shown in Listing [2-1](#A455241_1_En_2_Chapter.xhtml#Par4).
    <!doctype html> <html>   <head>     <title>More drawing to canvas</title>     <link
    rel="stylesheet" href="styles.css">   </head>   <body>     <h1>More drawing to
    canvas</h1>     <canvas id="asteroids" width="400" height="400"></canvas>     <script>
          var canvas = document.getElementById("asteroids");       var context = canvas.getContext("2d");
          // Grid drawing code goes here     </script>   </body> </html> Listing 2-1
    A Basic Template We’ve added a <link> element that refers to an external stylesheet
    called styles.css. Create the styles.css file and add the rules from Listing [2-2](#A455241_1_En_2_Chapter.xhtml#Par6).
    Both files should be saved in the same folder. It’s usually a good idea to have
    a folder exclusively for these two files. body {   text-align: center;   font-family:
    sans-serif; }   canvas {   background-color: black; } Listing 2-2 A Standard Stylesheet
    Load exercise2.html into your browser. We have a blank canvas, so let’s put something
    on it.


    ## The Canvas Grid System'
  trans: "\n# 更多图形与线条\n\n在画布上绘制图形相当简单。难点在于决定绘制什么以及如何设计。清单 1-7 包含了一段用于绘制简单火柴人的代码。请将其粘贴到脚本的末尾。\n\
    \n```\ncontext.strokeStyle = '#FFFFFF';\ncontext.lineWidth = 2;\ncontext.beginPath();\n\
    context.arc(200, 140, 20, 0, Math.PI * 2);\ncontext.moveTo(200, 160);\ncontext.lineTo(200,\
    \ 220);\ncontext.moveTo(180, 300);\ncontext.lineTo(185, 260);\ncontext.lineTo(200,\
    \ 220);\ncontext.lineTo(215, 260);\ncontext.lineTo(220, 300);\ncontext.moveTo(240,\
    \ 130);\ncontext.lineTo(225, 170);\ncontext.lineTo(200, 170);\ncontext.lineTo(175,\
    \ 180);\ncontext.lineTo(170, 220);\ncontext.stroke();\n```\n\n*清单 1-7 一个火柴人*\n\
    \n脚本首先将描边颜色设置为白色，线宽设置为 2 像素。接着，我们遇到了`context`对象的两个新方法。`context.beginPath()`方法用于开始一条新路径或重置当前路径。我们需要调用它，因为之前绘制矩形时留下的路径仍然处于激活状态。如果不调用它（可以尝试将其注释掉），那么我们会继续之前的路径，一条线将从矩形连接到我们绘制的第一个圆形。你将在第\
    \ 2 章中了解更多关于路径的内容。\n\n圆形是使用`context.arc()`方法绘制的。该方法可用于绘制任意圆形或圆弧。它接受五个参数，如下所示：第一对参数是圆心的`(x,\
    \ y)`坐标（以像素为单位）。第三个参数是圆的半径，第四个和第五个参数是圆弧的起始角度和结束角度（以弧度为单位）。要绘制一个完整的圆，这些角度应为`0`和`2π`。我们通过`Math.PI`属性访问`π`的值。在后续章节中，我们将大量使用\
    \ JavaScript 内置的`Math`对象。\n\n其余的方法调用要么是`context.moveTo()`，要么是`context.lineTo()`，直到最后调用`context.stroke()`来绘制路径。`context.moveTo()`和`context.lineTo()`方法都接受两个参数，且这些参数都是指定画布上某个位置的`(x,\
    \ y)`坐标（以像素为单位）。它们各自的作用正如你所料。要将“笔”移动到某个位置而不画线，请调用`context.moveTo()`。要从当前位置画一条线到指定位置，请调用`context.lineTo()`。逐行阅读代码，看看每一行代码对于绘制图\
    \ 1-6 中所示的火柴人是如何必要的。尝试删除或编辑某些行，看看会发生什么。不断尝试，直到你能预测修改的效果。\n\n![A455241_1_En_1_Fig6_HTML.jpg](img/A455241_1_En_1_Fig6_HTML.jpg)\n\
    \n*图 1-6 圆形和线条*\n\n最后，通过在脚本中对`context.lineWidth`和`context.strokeStyle`进行最近更改之前的位置，添加清单\
    \ 1-8 中的代码，来完成励志海报。\n\n```\nlet msg2 = \"its quite easy\";\ncontext.font = \"\
    24px Arial\";\ncontext.fillText(msg2, canvas.width / 2, 330);\ncontext.strokeText(msg2,\
    \ canvas.width / 2, 330);\n```\n\n*清单 1-8 一条励志信息*\n\n最终图像应如图 1-7 所示。注意，在代码中插入新行的位置会产生影响。如果你将新代码放在上下文更改之后，文本轮廓将使用更粗的白色线条绘制。\n\
    \n![A455241_1_En_1_Fig7_HTML.jpg](img/A455241_1_En_1_Fig7_HTML.jpg)\n\n*图 1-7\
    \ 完成的海报*\n\n## 总结\n\n在本章中，我们快速浏览了将用于创建游戏的基本技术。我们创建了第一个 HTML 文档并在浏览器中查看了它，对文档进行了样式设置，并编写了代码来操作画布元素。我们看到\
    \ HTML `<canvas>`元素具有可编程接口，并且我们使用了带有 JavaScript 代码的 HTML `<script>`元素来在画布上绘制。我们了解了画布上下文中可用的一些方法，并使用它们将一张励志海报渲染到画布上。我们还看到，该接口为我们提供了绘制线条和填充形状的工具，并且我们可以控制线条的粗细以及线条和形状的颜色。我们学习了一些关于坐标系以及路径如何构建的知识。在第\
    \ 2 章中，我们将对此进行扩展，并尝试更深入地理解如何在 HTML 画布上掌握绘制我们想要的内容的艺术。\n\n© Graeme Stuart 2017\
    \  \nGraeme Stuart  \n*《JavaScript 游戏开发入门》*  \n`doi.org/10.1007/978-1-4842-3252-1_2`\n\
    \n# 2. 理解路径\n\nGraeme Stuart¹\n\n(1) 英国莱斯特郡马基特哈伯勒\n\n第 1 章介绍了在画布上绘制的一些基本方法。本章提供一个后续练习，更深入地探讨画布坐标系，并探索如何构建路径。这些概念对于理解画布和设计你自己的绘图代码至关重要。我们还将开始为代码增添更多结构。复杂的代码可能难以理解——增加结构是控制复杂性的主要方法。将代码结构化为函数，可以开发出使用这些函数的更简洁的代码。本章介绍函数，并讲解重构过程，这是管理任何复杂程度代码所必需的关键技能。\n\
    \n## 组织你的文件\n\n首先，我们将以更传统的方式组织 HTML 文档。在第 1 章中，我们只是将样式信息包含在`<style>`元素中。为了去除杂乱并使样式可重用，我们将把样式移动到一个单独的文件中。创建一个名为`exercise2.html`的文件，并从清单\
    \ 2-1 所示的基本模板开始。\n\n```\n<!doctype html>\n<html>\n  <head>\n    <title>在画布上绘制更多图形</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n  </head>\n  <body>\n    <h1>在画布上绘制更多图形</h1>\n\
    \    <canvas id=\"asteroids\" width=\"400\" height=\"400\"></canvas>\n    <script>\n\
    \      var canvas = document.getElementById(\"asteroids\");\n      var context\
    \ = canvas.getContext(\"2d\");\n      // 网格绘制代码写在这里\n    </script>\n  </body>\n\
    </html>\n```\n\n*清单 2-1 一个基本模板*\n\n我们添加了一个指向名为`styles.css`的外部样式表的`<link>`元素。创建`styles.css`文件，并添加清单\
    \ 2-2 中的规则。两个文件应保存在同一文件夹中。通常，最好有一个专门存放这两个文件的文件夹。\n\n```\nbody {\n  text-align:\
    \ center;\n  font-family: sans-serif;\n}\ncanvas {\n  background-color: black;\n\
    }\n```\n\n*清单 2-2 一个标准样式表*\n\n在浏览器中加载`exercise2.html`。我们有一个空白画布，所以让我们在上面画点东西。\n\
    \n## 画布网格系统\n"
- fmt: "我们在第 [1](#A455241_1_En_1_Chapter.xhtml) 章中看到，`canvas` 拥有一个坐标系。原点 `(0, 0)`\
    \ 位于左上角。`canvas` 的宽度为 `canvas.width` 像素，高度为 `canvas.height` 像素。让我们通过绘制一个网格来让这些坐标可视化。首先，设置描边颜色和线宽。在\
    \ `<script>` 标签中，注释 `\"Grid drawing code goes here\"` 之后添加以下代码行：  \n`context.strokeStyle\
    \ = \"#00FF00\";`  \n`context.lineWidth = 0.25;`\n\n现在，我们使用 `for` 循环以 10 像素为步长，将\
    \ `x` 坐标从 0 递增到画布宽度，并在每次迭代中绘制垂直网格线。在循环中，我们将当前路径位置移动到画布顶部（对应 x 坐标处），并画一条直线直达画布底部。保持\
    \ `x` 坐标在 `context.moveTo` 和 `context.lineTo` 调用之间不变，确保每次都能得到一条垂直线：\n\n```\nfor(var\
    \ x = 0; x < canvas.width; x += 10) {\n  context.moveTo(x, 0);\n  context.lineTo(x,\
    \ canvas.height);\n}\n```\n\n如果你刷新页面，什么也不会绘制。因为我们仍然只是在构建路径，还没有要求将其绘制出来。对水平网格线重复相同的模式：\n\
    \n```\nfor(var y = 0; y < canvas.height; y += 10) {\n  context.moveTo(0, y);\n\
    \  context.lineTo(canvas.width, y);\n}\n```\n\n同样，我们依次从画布左侧（`x = 0`）到右侧（`x = canvas.width`）绘制每条水平线。`y`\
    \ 坐标从 0 开始，每次迭代增加 10 像素，直到达到 `canvas.height`。实际上，直到我们调用 `context.stroke()` 时，才会在画布上绘制任何内容：\n\
    \n```\ncontext.stroke();\n```\n\n然后，这将把路径绘制到画布上，如图 [2-1](#A455241_1_En_2_Chapter.xhtml#Fig1)\
    \ 所示。\n\n![A455241_1_En_2_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig1_HTML.jpg)\n\
    **图 2-1** 基本网格图案\n\n我们希望有一个主/辅网格系统，以便轻松定位坐标。为此，需要每第五条线更粗一些。但按照当前的做法，我们无法控制线宽。我们在代码末尾调用的\
    \ `context.stroke` 方法会将当前的描边样式和线宽应用于整个当前路径。这意味着所有线条都将具有相同的宽度。如果我们希望给它们不同的宽度，就需要将绘制分成多个路径，每个路径对应一条线。为此，我们需要在循环内同时调用\
    \ `context.beginPath` 和 `context.stroke`。注意不要删除任何初始模板代码，将网格绘制代码（注释 `\"Grid drawing\
    \ code goes here\"` 之后的所有内容）替换为清单 [2-3](#A455241_1_En_2_Chapter.xhtml#Par20) 中的代码。\n\
    \n```\ncontext.strokeStyle = \"#00FF00\";\nfor(var x = 0; x < canvas.width; x\
    \ += 10) {\n  context.beginPath();\n  context.moveTo(x, 0);\n  context.lineTo(x,\
    \ canvas.height);\n  context.lineWidth = (x % 50 == 0) ? 0.5 : 0.25;\n  context.stroke();\n\
    }\nfor(var y = 0; y < canvas.height; y += 10) {\n  context.beginPath();\n  context.moveTo(0,\
    \ y);\n  context.lineTo(canvas.width, y);\n  context.lineWidth = (y % 50 == 0)\
    \ ? 0.5 : 0.25;\n  context.stroke();\n}\n```\n**清单 2-3** 改变线宽\n\n现在，在每个循环中，我们都调用\
    \ `context.beginPath` 来启动一个新路径并丢弃所有之前的路径数据。我们像之前一样绘制线条，然后使用三元运算符设置线宽。三元运算符是一种紧凑的单行\
    \ `if` 语句，形式为 `result = boolean ? value_if_true : value_if_false`。这里我们设置线宽，所以如果当前的\
    \ `x` 或 `y` 坐标能被 50 整除（通过取模运算符 `x % 50 == 0` 确定），我们就使线条更粗一些。最后，我们在循环内调用 `context.stroke`，依次绘制每条线。生成的网格如图\
    \ [2-2](#A455241_1_En_2_Chapter.xhtml#Fig2) 所示。\n\n![A455241_1_En_2_Fig2_HTML.gif](OEBPS/Images/A455241_1_En_2_Fig2_HTML.gif)\n\
    **图 2-2** 主/辅网格线\n\n为了完成我们的画布坐标纸，还需要一些轴线。因为我们不能在画布外绘制，所以要在边缘处挤一些标签。首先，需要设置填充颜色，以便使用\
    \ `canvas.fillText`。在脚本中，循环上方添加以下代码行：\n\n`context.fillStyle = \"#009900\";`\n\n\
    现在，在每个循环中，我们将在主（较粗）网格线旁边绘制一个标签。在 `x` 坐标循环的末尾添加这一行：\n\n`if(x % 50 == 0 ) {context.fillText(x,\
    \ x, 10);}`\n\n类似地，在 `y` 坐标循环的末尾添加等效的代码行：\n\n`if(y % 50 == 0 ) {context.fillText(y,\
    \ 0, y + 10);}`\n\n结果如图 [2-3](#A455241_1_En_2_Chapter.xhtml#Fig3) 所示。\n\n![A455241_1_En_2_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig3_HTML.jpg)\n\
    **图 2-3** 主网格标签\n\n现在，坐标系的工作原理应该非常清晰了。每条较粗的线旁边都绘制了一个坐标值。原点明显位于左上角，我们已准备好在这个网格之上进行绘制。\n\
    \n## 及早重构，频繁重构"
  raw: 'We saw in Chapter [1](#A455241_1_En_1_Chapter.xhtml) that the canvas has a
    coordinates system. The origin (0, 0) is in the top-left corner. The canvas is
    canvas.width pixels wide and canvas.height pixels high. Let’s make these coordinates
    visible by drawing a grid. Start by setting the stroke color and line width. Add
    the following lines into your <script> tag after the comment "Grid drawing code
    goes here": context.strokeStyle = "#00FF00"; context.lineWidth = 0.25; Now we
    use a for loop to increment the x-coordinate from 0 to the canvas width in 10-pixel
    steps, drawing the vertical grid lines in each iteration. Within the loop we move
    the current path position to the top of the canvas at our x-coordinate and draw
    a line all the way to the bottom of the canvas. Keeping the x-coordinate unchanged
    between the context.moveTo and context.lineTo calls ensures we get a vertical
    line each time: for(var x = 0; x < canvas.width; x += 10) {   context.moveTo(x,
    0);   context.lineTo(x, canvas.height); } If you refresh the page, nothing is
    drawn. That’s because we’re still only building a path and haven’t yet asked for
    it to be drawn. Repeat the same pattern with the horizontal grid lines: for(var
    y = 0; y < canvas.height; y += 10) {   context.moveTo(0, y);   context.lineTo(canvas.width,
    y); } Again, we’re drawing each horizontal line in turn from the left of the canvas
    (x = 0) to the right (x = canvas.width). The y-coordinate starts at 0 and increases
    by 10 pixels each iteration until it reaches canvas.height. Nothing is actually
    drawn to the canvas until we call context.stroke() : context.stroke(); This then
    draws the path onto the canvas, as shown in Figure [2-1](#A455241_1_En_2_Chapter.xhtml#Fig1).
    ![A455241_1_En_2_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig1_HTML.jpg) Figure
    2-1 A basic grid pattern We’d like to have a major/minor grid system so we can
    easily pick out coordinates. To do this we need every fifth line to be thicker.
    But as we currently do it, we have no control over the line width. The context.stroke
    method we call at the end of the code applies the current stroke style and line
    width to the entire current path. This means all the lines will have the same
    width. If we want to give them different widths, we need to split the drawing
    into multiple paths, one for each line. To do that, we need to call both context.beginPath
    and context.stroke within our loops. Being careful not to remove any of the initial
    template code, replace the grid drawing code (everything after the comment "Grid
    drawing code goes here") with the code in Listing [2-3](#A455241_1_En_2_Chapter.xhtml#Par20).
    context.strokeStyle = "#00FF00"; for(var x = 0; x < canvas.width; x += 10) {   context.beginPath();
      context.moveTo(x, 0);   context.lineTo(x, canvas.height);   context.lineWidth
    = (x % 50 == 0) ? 0.5 : 0.25;   context.stroke(); } for(var y = 0; y < canvas.height;
    y += 10) {   context.beginPath();   context.moveTo(0, y);   context.lineTo(canvas.width,
    y);   context.lineWidth = (y % 50 == 0) ? 0.5 : 0.25;   context.stroke(); } Listing
    2-3 Altering Line Thickness Now, within each loop we’re calling context.beginPath
    to start a new path and discard any previous path data. We draw the line as before
    and then set the line width using a ternary operator . The ternary operator is
    a compact one-line if statement of the form result = boolean ? value_if_true :
    value_if_false. Here we’re setting the line width, so if the current x or y coordinate
    is divisible by 50 (determined using the modulo operator, x % 50 == 0), we make
    the line width a bit thicker. Finally, we call context.stroke within the loop
    to draw each line in turn. The resulting grid is shown in Figure [2-2](#A455241_1_En_2_Chapter.xhtml#Fig2).
    ![A455241_1_En_2_Fig2_HTML.gif](OEBPS/Images/A455241_1_En_2_Fig2_HTML.gif) Figure
    2-2 Major/minor grid lines To complete our canvas graph paper, we need some axes.
    Because we can’t draw outside of the canvas, we’ll squeeze some labels in at the
    edges. First, we need to set a fill color so we can use canvas.fillText. Add the
    following line to your script, above the loops: context.fillStyle = "#009900";
    Now, within each loop we’ll draw a label next to the major (thicker) grid lines.
    Add this line at the end of the x-coordinate loop: if(x % 50 == 0 ) {context.fillText(x,
    x, 10);} Similarly, add the equivalent line at the end of the y-coordinate loop
    : if(y % 50 == 0 ) {context.fillText(y, 0, y + 10);} The result is shown in Figure
    [2-3](#A455241_1_En_2_Chapter.xhtml#Fig3). ![A455241_1_En_2_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig3_HTML.jpg)
    Figure 2-3 Major grid labels Now it should be very clear how the coordinates system
    works. Each of the thicker lines has a coordinate value drawn next to it. The
    origin is clearly in the top-left corner, and we’re ready to draw on top of our
    grid.


    ## Refactor Early, Refactor Often'
