- fmt: "Now that we have a potentially useful piece of functionality (a grid showing\
    \ coordinates) we should immediately think about making it reusable. Rather than\
    \ copying the raw code into every script, we can refactor the code into a function\
    \ and include it in a code library (a separate JavaScript file). Once we have\
    \ the function in a library, we can simply include the library in our HTML document\
    \ and call the function. Any code that can be reduced to simple reusable functions\
    \ is a candidate for placing in a library. A good rule of thumb is that loading\
    \ a library should have no side effects other than defining functions. Typically\
    \ libraries contain related functionality.\n\nIn this case, let’s create an empty\
    \ file called `drawing.js` and place a link to the file in our html `<head>` element.\
    \ Your `<head>` element should now look something like this:\n\n```html\n<head>\n\
    \  <title>More drawing to canvas</title>\n  <link rel=\"stylesheet\" href=\"styles.css\"\
    >\n  <script src=\"drawing.js\"></script>\n</head>\n```\n\nNow let’s convert the\
    \ grid code into a handy function and place it in our `drawing.js` library, as\
    \ shown in Listing [2-4](#A455241_1_En_2_Chapter.xhtml#Par35).\n\n```javascript\n\
    function draw_grid(ctx, minor, major, stroke, fill) {\n  minor = minor || 10;\n\
    \  major = major || minor * 5;\n  stroke = stroke || \"#00FF00\";\n  fill = fill\
    \ || \"#009900\";\n  ctx.save();\n  ctx.strokeStyle = stroke;\n  ctx.fillStyle\
    \ = fill;\n  let width = ctx.canvas.width, height = ctx.canvas.height\n  for(var\
    \ x = 0; x < width; x += minor) {\n    ctx.beginPath();\n    ctx.moveTo(x, 0);\n\
    \    ctx.lineTo(x, height);\n    ctx.lineWidth = (x % major == 0) ? 0.5 : 0.25;\n\
    \    ctx.stroke();\n    if(x % major == 0 ) {ctx.fillText(x, x, 10);}\n  }\n \
    \ for(var y = 0; y < height; y += minor) {\n    ctx.beginPath();\n    ctx.moveTo(0,\
    \ y);\n    ctx.lineTo(width, y);\n    ctx.lineWidth = (y % major == 0) ? 0.5 :\
    \ 0.25;\n    ctx.stroke();\n    if(y % major == 0 ) {ctx.fillText(y, 0, y + 10);}\n\
    \  }\n  ctx.restore();\n}\n```\n\n**Listing 2-4** `draw_grid` function\n\nWe haven’t\
    \ made many changes here, but the result is a robust library function. Our function,\
    \ called `draw_grid`, takes five arguments. The first argument `ctx` is a canvas\
    \ context, which allows us to use the function to draw onto any canvas using a\
    \ suitable context. In order to find the canvas height and width, we access the\
    \ canvas object as a property of the `ctx` argument. We’ve stored the width and\
    \ height as variables for efficiency. The second and third arguments are the minor\
    \ and major distances. The fourth and fifth arguments are the stroke and fill\
    \ colors.\n\nWe’ve also added a call to `context.save()` at the beginning of the\
    \ drawing code and a call to `context.restore()` at the end. These save and restore\
    \ canvas state such as `context.lineWidth`, `context.strokeStyle`, and `context.fillStyle`.\
    \ Using them in this way ensures that the canvas is restored to its original state\
    \ after the function is done. This is good practice when writing drawing code.\
    \ It avoids side effects and allows the calling code to keep control of the canvas\
    \ context.\n\nNotice that we’ve tried to make the function as general purpose\
    \ as possible. It makes no assumptions about what the client code wants other\
    \ than it wants to draw a grid with the provided context. We can use this function\
    \ to draw many different grids on many different canvases. Which aspects of a\
    \ function should be configurable depends on the circumstances. Providing flexibility\
    \ (multiple arguments) must be balanced with the benefits of a simpler interface\
    \ (fewer arguments). Default parameters are a good way to compromise.\n\nIn this\
    \ case, we’ve provided defaults by setting `minor` to 10 by default, and `major`\
    \ to 5 times the `minor` value. We’ve also set the colors to default values. These\
    \ defaults are only used if no values are provided, which is achieved through\
    \ an or operator (`||`). The value of `minor` is set to itself or the default\
    \ value, which only applies if the value of `minor` evaluates to `false` (which\
    \ `undefined` values do). It’s worth noting that this syntax has drawbacks. If,\
    \ for example, the calling code tries to set a default parameter to 0 or some\
    \ other value that resolves to `false`, then it will be ignored and the default\
    \ will be used.\n\nMoving this new `draw_grid` function into our `drawing.js`\
    \ library makes our main script much shorter. We can remove all the grid drawing\
    \ code from our HTML document and replace it with a one-liner:\n\n```javascript\n\
    draw_grid(context);\n```\n\nWe can now easily make custom grids. Try experimenting\
    \ with the arguments:\n\n```javascript\n// try this for comparison\ndraw_grid(context,\
    \ 15, 45, 'red', 'yellow');\n// or this\ndraw_grid(context, 5, 30, 'white', 'red');\n\
    ```\n\n## Working with Paths"
  raw: 'Now that we have a potentially useful piece of functionality (a grid showing
    coordinates) we should immediately think about making it reusable. Rather than
    copying the raw code into every script, we can refactor the code into a function
    and include it in a code library (a separate JavaScript file). Once we have the
    function in a library, we can simply include the library in our HTML document
    and call the function. Any code that can be reduced to simple reusable functions
    is a candidate for placing in a library. A good rule of thumb is that loading
    a library should have no side effects other than defining functions. Typically
    libraries contain related functionality. In this case, let’s create an empty file
    called drawing.js and place a link to the file in our html <head> element. Your
    <head> element should now look something like this: <head>   <title>More drawing
    to canvas</title>   <link rel="stylesheet" href="styles.css">   <script src="drawing.js"></script>
    </head> Now let’s convert the grid code into a handy function and place it in
    our drawing.js library, as shown in Listing [2-4](#A455241_1_En_2_Chapter.xhtml#Par35).
    function draw_grid(ctx, minor, major, stroke, fill) {   minor = minor || 10;   major
    = major || minor * 5;   stroke = stroke || "#00FF00";   fill = fill || "#009900";
      ctx.save();   ctx.strokeStyle = stroke;   ctx.fillStyle = fill;   let width
    = ctx.canvas.width, height = ctx.canvas.height   for(var x = 0; x < width; x +=
    minor) {     ctx.beginPath();     ctx.moveTo(x, 0);     ctx.lineTo(x, height);
        ctx.lineWidth = (x % major == 0) ? 0.5 : 0.25;     ctx.stroke();     if(x
    % major == 0 ) {ctx.fillText(x, x, 10);}   }   for(var y = 0; y < height; y +=
    minor) {     ctx.beginPath();     ctx.moveTo(0, y);     ctx.lineTo(width, y);
        ctx.lineWidth = (y % major == 0) ? 0.5 : 0.25;     ctx.stroke();     if(y
    % major == 0 ) {ctx.fillText(y, 0, y + 10);}   }   ctx.restore(); } Listing 2-4
    draw_grid function We haven’t made many changes here, but the result is a robust
    library function. Our function, called draw_ grid , takes five arguments. The
    first argument ctx is a canvas context, which allows us to use the function to
    draw onto any canvas using a suitable context. In order to find the canvas height
    and width, we access the canvas object as a property of the ctx argument. We’ve
    stored the width and height as variables for efficiency. The second and third
    arguments are the minor and major distances. The fourth and fifth arguments are
    the stroke and fill colors. We’ve also added a call to context.save() at the beginning
    of the drawing code and a call to context.restore() at the end. These save and
    restore canvas state such as context.lineWidth, context.strokeStyle, and context.fillStyle.
    Using them in this way ensures that the canvas is restored to its original state
    after the function is done. This is good practice when writing drawing code. It
    avoids side effects and allows the calling code to keep control of the canvas
    context. Notice that we’ve tried to make the function as general purpose as possible.
    It makes no assumptions about what the client code wants other than it wants to
    draw a grid with the provided context. We can use this function to draw many different
    grids on many different canvases. Which aspects of a function should be configurable
    depends on the circumstances. Providing flexibility (multiple arguments) must
    be balanced with the benefits of a simpler interface (fewer arguments). Default
    parameters are a good way to compromise. In this case, we’ve provided defaults
    by setting minor to 10 by default, and major to 5 times the minor value. We’ve
    also set the colors to default values. These defaults are only used if no values
    are provided, which is achieved through an or operator (||). The value of minor
    is set to itself or the default value, which only applies if the value of minor
    evaluates to false (which undefined values do). It’s worth noting that this syntax
    has drawbacks. If, for example, the calling code tries to set a default parameter
    to 0 or some other value that resolves to false, then it will be ignored and the
    default will be used. Moving this new draw_grid function into our drawing.js library
    makes our main script much shorter. We can remove all the grid drawing code from
    our HTML document and replace it with a one-liner: draw_grid(context); We can
    now easily make custom grids . Try experimenting with the arguments: // try this
    for comparison draw_grid(context, 15, 45, ''red'', ''yellow''); // or this draw_grid(context,
    5, 30, ''white'', ''red'');


    ## Working with Paths'
  trans: "\n现在我们有了一个潜在有用的功能模块（一个显示坐标的网格），就应该立即考虑如何使其可复用。与其将原始代码复制到每个脚本中，不如将代码重构为一个函数，并将其放入代码库（一个独立的\
    \ JavaScript 文件）中。一旦将函数放入库中，我们只需在 HTML 文档中引入该库，然后调用该函数即可。任何可以简化为可复用函数的代码，都是放入库中的候选对象。一个好的经验法则是：加载一个库除了定义函数之外，不应产生任何副作用。通常情况下，库中包含相关的功能集合。\n\
    \n在这个例子中，让我们创建一个名为 `drawing.js` 的空文件，并在 HTML 的 `<head>` 元素中添加对该文件的链接。你的 `<head>`\
    \ 元素现在看起来应该是这样的：\n\n```html\n<head>\n  <title>更多 Canvas 绘图</title>\n  <link rel=\"\
    stylesheet\" href=\"styles.css\">\n  <script src=\"drawing.js\"></script>\n</head>\n\
    ```\n\n现在，让我们将网格代码转换成一个便捷的函数，并将其放入 `drawing.js` 库中，如清单 2-4 所示。\n\n```javascript\n\
    function draw_grid(ctx, minor, major, stroke, fill) {\n  minor = minor || 10;\n\
    \  major = major || minor * 5;\n  stroke = stroke || \"#00FF00\";\n  fill = fill\
    \ || \"#009900\";\n  ctx.save();\n  ctx.strokeStyle = stroke;\n  ctx.fillStyle\
    \ = fill;\n  let width = ctx.canvas.width, height = ctx.canvas.height\n  for(var\
    \ x = 0; x < width; x += minor) {\n    ctx.beginPath();\n    ctx.moveTo(x, 0);\n\
    \    ctx.lineTo(x, height);\n    ctx.lineWidth = (x % major == 0) ? 0.5 : 0.25;\n\
    \    ctx.stroke();\n    if(x % major == 0 ) {ctx.fillText(x, x, 10);}\n  }\n \
    \ for(var y = 0; y < height; y += minor) {\n    ctx.beginPath();\n    ctx.moveTo(0,\
    \ y);\n    ctx.lineTo(width, y);\n    ctx.lineWidth = (y % major == 0) ? 0.5 :\
    \ 0.25;\n    ctx.stroke();\n    if(y % major == 0 ) {ctx.fillText(y, 0, y + 10);}\n\
    \  }\n  ctx.restore();\n}\n```\n\n**清单 2-4** `draw_grid` 函数\n\n我们在这里并没有做太多改动，但结果却是一个健壮的库函数。我们的函数名为\
    \ `draw_grid`，它接受五个参数。第一个参数 `ctx` 是 Canvas 上下文，这允许我们使用该函数，在合适的上下文中绘制到任何 Canvas\
    \ 上。为了获取 Canvas 的高度和宽度，我们将 Canvas 对象作为 `ctx` 参数的一个属性来访问。为了提高效率，我们将宽度和高度存储为变量。第二和第三个参数分别是次要距离和主要距离。第四和第五个参数分别是描边颜色和填充颜色。\n\
    \n我们还在绘图代码的开头添加了对 `context.save()` 的调用，并在结尾添加了对 `context.restore()` 的调用。它们会保存和恢复\
    \ Canvas 的状态，例如 `context.lineWidth`、`context.strokeStyle` 和 `context.fillStyle`。以这种方式使用它们，可以确保函数执行完毕后，Canvas\
    \ 恢复到其原始状态。在编写绘图代码时，这是一个好习惯。它可以避免副作用，并允许调用代码保持对 Canvas 上下文的控制。\n\n请注意，我们已尽力使该函数尽可能通用。除了希望使用提供的上下文绘制网格之外，它对客户端代码没有任何假设。我们可以使用这个函数在许多不同的\
    \ Canvas 上绘制许多不同的网格。函数的哪些方面应该是可配置的，取决于具体情况。提供灵活性（多个参数）必须与简化接口（减少参数）的好处相平衡。默认参数是一种很好的折衷方案。\n\
    \n在这个例子中，我们通过将 `minor` 默认设置为 10，将 `major` 设置为 `minor` 值的 5 倍来提供默认值。我们还为颜色设置了默认值。这些默认值仅在未提供值时使用，这是通过或运算符\
    \ (`||`) 实现的。`minor` 的值被设置为其自身或默认值，这仅在 `minor` 的值计算结果为 `false` 时适用（`undefined`\
    \ 值就会如此）。值得注意的是，这种语法有其缺陷。例如，如果调用代码试图将默认参数设置为 `0` 或其他计算结果为 `false` 的值，则该值将被忽略，并使用默认值。\n\
    \n将这个新的 `draw_grid` 函数移入我们的 `drawing.js` 库中，会使我们的主脚本缩短很多。我们可以从 HTML 文档中移除所有网格绘制代码，并用一行代码替换：\n\
    \n```javascript\ndraw_grid(context);\n```\n\n我们现在可以轻松地创建自定义网格。尝试试验这些参数：\n\n```javascript\n\
    // 试试这个进行对比\ndraw_grid(context, 15, 45, 'red', 'yellow');\n// 或者试试这个\ndraw_grid(context,\
    \ 5, 30, 'white', 'red');\n```\n\n## 使用路径进行绘图\n"
- fmt: '在 Canvas 上绘图需要理解路径的概念。正如我们之前所见，可以通过依次调用多个绘制方法来构建路径。一旦路径被指定，我们可以调用 `context.fill`，使用当前的
    `context.fillStyle` 填充封闭区域；或者调用 `context.stroke`，使用当前的 `context.strokeStyle` 和
    `context.lineWidth` 以线条形式绘制路径。


    我们还了解到，路径不必是连续的；可以通过调用 `context.moveTo` 来中断路径。当从一个路径切换到另一个路径时，需要调用 `context.beginPath`
    以丢弃旧的路径数据并开始一个新的路径。


    让我们在我们新的网格上绘制一些线条，以确认我们理解了坐标系统。在调用 `draw_grid` 之后，添加清单 [2-5](#A455241_1_En_2_Chapter.xhtml#Par47)
    中的内容。


    ```

    context.beginPath();

    context.strokeStyle = "#FFFFFF";

    context.fillStyle = "#00FF00";

    context.lineWidth = 2;

    context.moveTo(50, 50);

    context.lineTo(150, 250);

    context.lineTo(250, 170);

    context.stroke();

    context.fillText("(50, 50)", 30, 40);

    context.fillText("(150, 250)", 130, 260);

    context.fillText("(250, 170)", 255, 175);

    ```


    **清单 2-5 一些线条**


    代码绘制了两条白线。当绘制第一条线时，我们指定从点 `(50, 50)` 开始，并画一条线到 `(150, 250)`。我们绘制第二条线时未指定起始位置，这条线是作为路径的延续而绘制的。然后我们绘制了点的坐标，以便清晰地看到当前情况。图
    [2-4](#A455241_1_En_2_Chapter.xhtml#Fig4) 展示了结果。请注意，坐标可以从网格标签中读取。


    ![A455241_1_En_2_Fig4_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig4_HTML.jpg)


    **图 2-4 线条默认是连接的**


    现在，我们知道刚刚定义的路径（由两条直线组成）仍然存在于内存中。如果我们添加对 `context.fill` 的调用，应该能够填充该形状。但当形状没有完全封闭时会发生什么呢？在你的脚本末尾添加以下代码行来找出答案：


    ```

    context.fill();

    ```


    图 [2-5](#A455241_1_En_2_Chapter.xhtml#Fig5) 展示了结果。


    ![A455241_1_En_2_Fig5_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig5_HTML.jpg)


    **图 2-5 填充路径时，如有必要，会添加一条直线**


    路径会以从路径起点到终点的最短可能路径进行填充。如果我们向脚本中添加一个新的 `context.lineTo`，我们将填充一个不同的形状。我们甚至可以填充线条交叉的形状。在适当的位置（在描边线条之前）添加以下代码行：


    ```

    context.lineTo(320, 280);

    ```


    图 [2-6](#A455241_1_En_2_Chapter.xhtml#Fig6) 展示了结果。


    ![A455241_1_En_2_Fig6_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig6_HTML.jpg)


    **图 2-6 向路径添加一条线**


    在不填充的情况下，路径会扩展出一个新的点。图 [2-7](#A455241_1_En_2_Chapter.xhtml#Fig7) 显示，如果我们添加 `context.fill`
    命令，该形状将再次以一条直线进行填充。


    ![A455241_1_En_2_Fig7_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig7_HTML.jpg)


    **图 2-7 在线条交叉时进行填充**


    我们也可以使用 `context.closePath` 以编程方式闭合路径。这将在当前路径位置到最近的开放端点之间添加一条直线。移除对 `context.fill`
    的调用，并在最后一次调用 `context.stroke` 之前添加对 `context.closePath` 的调用。图 [2-8](#A455241_1_En_2_Chapter.xhtml#Fig8)
    展示了结果。


    ![A455241_1_En_2_Fig8_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig8_HTML.jpg)


    **图 2-8 闭合路径**


    我们看到，在最初绘制网格线时，路径可以被中断。通过调用 `context.moveTo`，我们可以有效地“拾起”“笔”并将其移动到另一个位置。通过结合使用
    `context.closePath`，我们可以快速且轻松地一起绘制多个闭合形状。在你的脚本末尾添加清单 [2-6](#A455241_1_En_2_Chapter.xhtml#Par59)
    中的代码。


    ```

    context.beginPath()

    context.moveTo(50, 250);

    context.lineTo(50, 350);

    context.lineTo(150, 350);

    context.closePath();

    context.moveTo(230, 360);

    context.lineTo(270, 360);

    context.lineTo(270, 310);

    context.closePath();

    context.moveTo(250, 50);

    context.lineTo(370, 50);

    context.lineTo(370, 100);

    context.closePath();

    context.strokeStyle = "#FFFF00";

    context.fillStyle = "#000000";

    context.fill();

    context.stroke();

    ```


    **清单 2-6 闭合形状**


    研究这段代码，看看会发生什么。图 [2-9](#A455241_1_En_2_Chapter.xhtml#Fig9) 展示了结果。每次我们调用 `context.moveTo`
    时，都是在设置路径的当前原点。这是 `context.closePath` 将返回的位置。这允许我们只调用一次 `context.fill` 和 `context.stroke`
    来绘制多个填充的、闭合的形状。另请注意，我们在定义路径之后才设置了绘制样式。它们可以在调用 `context.fill` 和 `context.stroke`
    之前的任何时间设置。


    ![A455241_1_En_2_Fig9_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig9_HTML.jpg)


    **图 2-9 填充、闭合、中断的路径**'
  raw: 'Drawing on canvases requires an understanding of paths. As we saw earlier,
    a path can be constructed by calling several drawing methods in turn. Once a path
    has been specified, we can either call context.fill to fill the enclosed areas
    using the current context.fillStyle or we can call context.stroke to draw the
    path as a line using the current context.strokeStyle and context.lineWidth. We’ve
    also seen that paths don’t need to be contiguous; they can be interrupted by calls
    to context.moveTo. When transferring from one path to another, it’s necessary
    to call context.beginPath in order to discard the old path data and start a fresh
    path. Let’s draw some lines on our new grid to confirm that we understand the
    coordinates system. Add the content of Listing [2-5](#A455241_1_En_2_Chapter.xhtml#Par47)
    after your call to draw_grid. context.beginPath(); context.strokeStyle = "#FFFFFF";
    context.fillStyle = "#00FF00"; context.lineWidth = 2; context.moveTo(50, 50);
    context.lineTo(150, 250); context.lineTo(250, 170); context.stroke(); context.fillText("(50,
    50)", 30, 40); context.fillText("(150, 250)", 130, 260); context.fillText("(250,
    170)", 255, 175); Listing 2-5 Some Lines The code draws two white lines. When
    we draw the first line, we specify that we want to start at (50, 50) and draw
    a line to (150, 250). We draw the second line without specifying a start position.
    The line is drawn as a continuation of the path. We then draw the point coordinates
    so we can see what’s going on clearly. Figure [2-4](#A455241_1_En_2_Chapter.xhtml#Fig4)
    shows the result. Note that the coordinates can be read from the grid labels .
    ![A455241_1_En_2_Fig4_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig4_HTML.jpg) Figure
    2-4 Lines are joined by default Now, we know that the path we’ve just defined,
    which consists of two straight lines, is still in memory. If we add a call to
    context.fill we should be able to fill the shape. But what happens when the shape
    isn’t completely enclosed? Add the line to the end of your script to find out:
    context.fill(); Figure [2-5](#A455241_1_En_2_Chapter.xhtml#Fig5) shows what happens.
    ![A455241_1_En_2_Fig5_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig5_HTML.jpg) Figure
    2-5 Filling a path adds a straight line if necessary The path is filled with the
    shortest possible route from the beginning of the path to the end. If we add a
    new context.lineTo to the script, we’ll fill a different shape. We can even fill
    shapes where the lines cross over. Add the following line in the appropriate place
    (before we stroke the line): context.lineTo(320, 280); Figure [2-6](#A455241_1_En_2_Chapter.xhtml#Fig6)
    shows the result. ![A455241_1_En_2_Fig6_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig6_HTML.jpg)
    Figure 2-6 Adding a line to the path Without filling, the path is extended with
    a new point. Figure [2-7](#A455241_1_En_2_Chapter.xhtml#Fig7) shows that if we
    add the context.fill command, the shape is filled with a straight line once again.
    ![A455241_1_En_2_Fig7_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig7_HTML.jpg) Figure
    2-7 Filling when the lines cross We can also close a path programmatically using
    context.closePath. This will add a line from the current path position to the
    most recent open end. Remove the call to context.fill and add a call to context.closePath
    before the last call to context.stroke. Figure [2-8](#A455241_1_En_2_Chapter.xhtml#Fig8)
    shows what happens. ![A455241_1_En_2_Fig8_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig8_HTML.jpg)
    Figure 2-8 Closing the path We saw that paths can be interrupted when we first
    drew the grid lines. We can effectively “pick up” the “pen” and move it to another
    position by calling context.moveTo. By combining this with context.closePath,
    we can quickly and easily draw several closed shapes together. Add the code in
    Listing [2-6](#A455241_1_En_2_Chapter.xhtml#Par59) to the end of your script .
    context.beginPath() context.moveTo(50, 250); context.lineTo(50, 350); context.lineTo(150,
    350); context.closePath(); context.moveTo(230, 360); context.lineTo(270, 360);
    context.lineTo(270, 310); context.closePath(); context.moveTo(250, 50); context.lineTo(370,
    50); context.lineTo(370, 100); context.closePath(); context.strokeStyle = "#FFFF00";
    context.fillStyle = "#000000"; context.fill(); context.stroke(); Listing 2-6 Closed
    Shapes Study that code and see what happens. Figure [2-9](#A455241_1_En_2_Chapter.xhtml#Fig9)
    shows the result. Each time we call context.moveTo, we’re setting the current
    origin of the path. This is the position that context.closePath will return to.
    This allows us to call context.fill and context.stroke once for drawing multiple
    filled, closed shapes. Also note that we set the drawing styles after we’ve defined
    the path. They can be set at any time before the calls to context.fill and context.stroke.
    ![A455241_1_En_2_Fig9_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig9_HTML.jpg) Figure
    2-9 Filled, closed, interrupted paths'
  trans: '

    在 Canvas 上绘图需要理解路径的概念。正如我们之前所见，可以通过依次调用多个绘制方法来构建路径。一旦路径被指定，我们可以调用 `context.fill`，使用当前的
    `context.fillStyle` 填充封闭区域；或者调用 `context.stroke`，使用当前的 `context.strokeStyle` 和
    `context.lineWidth` 以线条形式绘制路径。


    我们还了解到，路径不必是连续的；可以通过调用 `context.moveTo` 来中断路径。当从一个路径切换到另一个路径时，需要调用 `context.beginPath`
    以丢弃旧的路径数据并开始一个新的路径。


    让我们在我们新的网格上绘制一些线条，以确认我们理解了坐标系统。在调用 `draw_grid` 之后，添加清单 2-5 中的内容。


    ```

    context.beginPath();

    context.strokeStyle = "#FFFFFF";

    context.fillStyle = "#00FF00";

    context.lineWidth = 2;

    context.moveTo(50, 50);

    context.lineTo(150, 250);

    context.lineTo(250, 170);

    context.stroke();

    context.fillText("(50, 50)", 30, 40);

    context.fillText("(150, 250)", 130, 260);

    context.fillText("(250, 170)", 255, 175);

    ```


    **清单 2-5 一些线条**


    代码绘制了两条白线。当绘制第一条线时，我们指定从点 `(50, 50)` 开始，并画一条线到 `(150, 250)`。我们绘制第二条线时未指定起始位置，这条线是作为路径的延续而绘制的。然后我们绘制了点的坐标，以便清晰地看到当前情况。图
    2-4 展示了结果。请注意，坐标可以从网格标签中读取。


    ![A455241_1_En_2_Fig4_HTML.jpg](img/A455241_1_En_2_Fig4_HTML.jpg)


    **图 2-4 线条默认是连接的**


    现在，我们知道刚刚定义的路径（由两条直线组成）仍然存在于内存中。如果我们添加对 `context.fill` 的调用，应该能够填充该形状。但当形状没有完全封闭时会发生什么呢？在你的脚本末尾添加以下代码行来找出答案：


    ```

    context.fill();

    ```


    图 2-5 展示了结果。


    ![A455241_1_En_2_Fig5_HTML.jpg](img/A455241_1_En_2_Fig5_HTML.jpg)


    **图 2-5 填充路径时，如有必要，会添加一条直线**


    路径会以从路径起点到终点的最短可能路径进行填充。如果我们向脚本中添加一个新的 `context.lineTo`，我们将填充一个不同的形状。我们甚至可以填充线条交叉的形状。在适当的位置（在描边线条之前）添加以下代码行：


    ```

    context.lineTo(320, 280);

    ```


    图 2-6 展示了结果。


    ![A455241_1_En_2_Fig6_HTML.jpg](img/A455241_1_En_2_Fig6_HTML.jpg)


    **图 2-6 向路径添加一条线**


    在不填充的情况下，路径会扩展出一个新的点。图 2-7 显示，如果我们添加 `context.fill` 命令，该形状将再次以一条直线进行填充。


    ![A455241_1_En_2_Fig7_HTML.jpg](img/A455241_1_En_2_Fig7_HTML.jpg)


    **图 2-7 在线条交叉时进行填充**


    我们也可以使用 `context.closePath` 以编程方式闭合路径。这将在当前路径位置到最近的开放端点之间添加一条直线。移除对 `context.fill`
    的调用，并在最后一次调用 `context.stroke` 之前添加对 `context.closePath` 的调用。图 2-8 展示了结果。


    ![A455241_1_En_2_Fig8_HTML.jpg](img/A455241_1_En_2_Fig8_HTML.jpg)


    **图 2-8 闭合路径**


    我们看到，在最初绘制网格线时，路径可以被中断。通过调用 `context.moveTo`，我们可以有效地“拾起”“笔”并将其移动到另一个位置。通过结合使用
    `context.closePath`，我们可以快速且轻松地一起绘制多个闭合形状。在你的脚本末尾添加清单 2-6 中的代码。


    ```

    context.beginPath()

    context.moveTo(50, 250);

    context.lineTo(50, 350);

    context.lineTo(150, 350);

    context.closePath();

    context.moveTo(230, 360);

    context.lineTo(270, 360);

    context.lineTo(270, 310);

    context.closePath();

    context.moveTo(250, 50);

    context.lineTo(370, 50);

    context.lineTo(370, 100);

    context.closePath();

    context.strokeStyle = "#FFFF00";

    context.fillStyle = "#000000";

    context.fill();

    context.stroke();

    ```


    **清单 2-6 闭合形状**


    研究这段代码，看看会发生什么。图 2-9 展示了结果。每次我们调用 `context.moveTo` 时，都是在设置路径的当前原点。这是 `context.closePath`
    将返回的位置。这允许我们只调用一次 `context.fill` 和 `context.stroke` 来绘制多个填充的、闭合的形状。另请注意，我们在定义路径之后才设置了绘制样式。它们可以在调用
    `context.fill` 和 `context.stroke` 之前的任何时间设置。


    ![A455241_1_En_2_Fig9_HTML.jpg](img/A455241_1_En_2_Fig9_HTML.jpg)


    **图 2-9 填充、闭合、中断的路径**

