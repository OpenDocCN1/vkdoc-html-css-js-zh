  raw: 'JavaScript is a great tool for building games and game-like systems. The web
    provides a perfect means to put your creations into the hands of millions of waiting
    users. Of course, other technology stacks are also available; there’s great benefit
    to be had from gaining experience with multiple languages and systems. Hopefully,
    some of the key points I’ve covered in this book will prove useful to you in the
    future, whatever path you choose. You’ve been through a long process and I hope
    you’ve learned a few things about structuring code and the kinds of logic necessary
    for building games. This puts you in a good position to open a blank text file
    and get creative with your own project. If I were to offer any parting advice,
    it would be this: try to view software engineering as a process of managing complexity.
    Any non-trivial software will be complex. It’s important to design our code one
    step at a time, gradually building the complexity and restructuring all the time
    as we go. This means starting with no structure and only adding functions and
    classes and inheritance when you’re sure they will help. When we create new code,
    we need the freedom to be creative. Too much structure in the early stages will
    limit the options and reduce the chance for us to find good solutions. The real
    trick is balancing this with the absolute necessity of building structure to enable
    the complexity to grow. We should allow structure to emerge naturally by a process
    of trial and error. Adding structure should simplify the code that uses that structure.
    It should create an interface you can use effectively for the problem at hand.
    I want to mention some pointers you can use to get started. Write code into global
    scope while you experiment. Always start simple. Identify the components you’ll
    need (in our case, we started with asteroids and a ship) and develop them one
    at a time. Try to start with the individual behavior of the simplest components
    and don’t worry about how they’ll interact until later. Only add structure such
    as functions and objects when the code looks good. Don’t change code inside functions
    and objects too often. Study messy code and try to simplify it. Add more functions
    to break up large pieces of code into smaller pieces. Experimentation is important.
    Once you have something you’re happy with, add structure to crystalize the component
    down into the functionality it provides. Move good code into libraries—quality
    control is important. Build all your low-level components in this way. At each
    stage, move your best code from the global scope into function and objects, and
    move your best functions and objects into libraries. Refactor early, refactor
    often. Develop your instincts by confidently experimenting with how you do things
    (always save a copy just in case). Use version control and commit every incremental
    improvement. Experiment with your components to see what they can do. Once your
    objects are stable, start to consider their interactions. Compose component interactions
    experimentally. Once you’re happy, build more structure—perhaps a master object.
    Refactor again and improve the structure of your components to meet the needs
    you’re identifying. Great developers manage the interplay between chaos and order.
    True mastery comes when we develop instincts that can guide us towards structures
    at multiple levels that are helpful rather than harmful to the whole. These instincts
    can only come with practice. Remember, code doesn’t appear fully formed with perfect
    structure. Blindly copying structure from examples in a book won’t help you to
    understand how those examples came about. The secret is to have a goal in mind
    while you experiment. Develop your instincts by experimenting with many different
    structures until you hit upon one you consider to be good for your current goal.
    Do this enough times, and it will become easier. With that, I have to leave it.
    Thank you for taking the time to read my book. If you liked it, tell someone about
    it. If you didn’t like it, tell me about it. GraemeIndex A Animation Bouncing
