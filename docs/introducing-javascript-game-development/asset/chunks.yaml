    \n**格雷姆·斯图尔特**\n\n![A455241_1_En_BookFrontmatter_Figb_HTML.jpg](img/A455241_1_En_BookFrontmatter_Figb_HTML.jpg)\n\
    \n是一位自学成才的开发者，拥有 15 年使用 JavaScript、Ruby 和 Python 构建数据分析工具和网络应用的经验。他拥有能源管理博士学位，其大部分编程技能最初是为了实现这个目标而开发的。他曾在一段时间内向大学一年级本科生教授\
    \ JavaScript 游戏编程，本书正是由此而来。现在，他主要利用复杂性科学来鼓励对软件工程敏捷方法的深入理解，并证明他那些不寻常的研究雄心是合理的。\n\
    \n## 关于技术审校者\n\n**阿迪亚·香卡**\n\n![A455241_1_En_BookFrontmatter_Figc_HTML.jpg](img/A455241_1_En_BookFrontmatter_Figc_HTML.jpg)\n\
    \n于 1993 年开始编程，那时他第一次接触到计算机世界。当时无法访问互联网或在线教程，他通过在当地图书馆找到的一本书上吃力地重新输入代码，用 GW-BASIC\
    \ 编写了他的第一个游戏。2001 年从印度理工学院马德拉斯分校毕业后，他作为软件顾问工作了近十年，为投资银行和大型财富 100 强公司开发交易和分析系统，最终离开企业生活，以便专注于自己热爱的事业。作为一名自认的技术极客，从那时起，他一直致力于自己的项目，并尝试每一种他能接触到的新语言和技术，包括\
    \ HTML5。在此期间，他因单枪匹马地完全使用 HTML5 重制了著名的即时战略游戏《命令与征服》以及《盟军敢死队：深入敌后》而声名远扬。除了编程，阿迪亚还热衷于台球、萨尔萨舞、健身和个人发展。他维护着一个个人网站，在上面撰写关于游戏编程、个人发展和台球的文章，并分享他广受欢迎的游戏演示。当阿迪亚不忙于写作或处理自己的项目时，他会为一些公司提供咨询服务，帮助他们推出新的软件产品和游戏。\n"
- fmt: "# Part I: Drawing\n\nThe HTML `<canvas>` element, true to its name, provides\
    \ a blank canvas on which we can draw our game. Drawing is a fundamental aspect\
    \ of working with the HTML `<canvas>` element, so in these first few chapters\
    \ we will explore how drawing works and learn the fundamentals necessary to draw\
    \ our own designs with simple lines and fills. We will also develop some of the\
    \ game elements necessary for our Asteroids game clone.\n\n# 1. HTML5 and the\
    \ Canvas Element\n\nThis chapter introduces some of the basics of HTML, CSS, and\
    \ JavaScript. These are the core web technologies, and we’ll use them for developing\
    \ our game throughout this book. In order to follow along, you’ll need a text\
    \ editor to generate text files and a web browser to view the results with. You\
    \ won’t be learning everything there is to know about these technologies. We’ll\
    \ focus on just enough to draw some stuff on an HTML `<canvas>` element. We’ll\
    \ work with the HTML `<canvas>` element throughout this book, so pay attention.\n\
    \n## HTML Primer\n\nHTML (HyperText Markup Language) documents describe content\
    \ on the web. When you access a web page, you’re typically downloading and viewing\
    \ an HTML document. HTML is a way to organize and add semantic meaning to multimedia\
    \ content (text, images, videos, and more) and to link between documents in a\
    \ “web” of information. HTML5 is the current version of the HTML standard. The\
    \ standard was originally developed in the early 1990s and has evolved a little\
    \ since then. The modern standard allows for the extremely rich experience of\
    \ the modern World Wide Web.\n\nWe’ll be working with the HTML `<canvas>` element,\
    \ so let’s create our first HTML document and add a `<canvas>` element to it.\
    \ Create a file called `exercise1.html` and type in the basic HTML template shown\
    \ in Listing 1-1.\n\n```\n<!doctype html>\n<html>\n  <head>\n    <title>This is\
    \ an HTML canvas</title>\n  </head>\n  <body>\n    <h1>This is an HTML canvas</h1>\n\
    \    <canvas id=\"asteroids\" width=\"400\" height=\"400\"></canvas>\n  </body>\n\
    </html>\n```\n\n*Listing 1-1* A Basic HTML Template\n\nListing 1-1 begins with\
    \ a `<!doctype html>` declaration. The doctype declaration is always the first\
    \ thing in an HTML document. It’s an instruction to the web browser about what\
    \ version of HTML the page is written in. In the past, using doctype was complex\
    \ because there were many versions of HTML to choose from. With HTML5, the declaration\
    \ is reduced to simply specifying that we’re using HTML.\n\nAfter the doctype,\
    \ the main `<html>` element is opened. Note that it’s closed at the end of the\
    \ file with an `</html>` closing tag. Everything in between the opening and closing\
    \ `<html>` tags is said to be within the `<html>` element. There should be nothing\
    \ more in an HTML file than a doctype and an `<html>` element with content.\n\n\
    Within the `<html>` element there are two nested elements: `<head>` and `<body>`.\
    \ The `<head>` element is used to describe details about the document, such as\
    \ the `<title>` to be displayed in a browser tab. It often also contains links\
    \ to stylesheets or JavaScript files that specifies how the contents are to be\
    \ rendered and how they behave.\n\nThe `<body>` element contains the content of\
    \ the document and in this case includes a level one header `<h1>` and a `<canvas>`\
    \ element. The `<canvas>` element provides a JavaScript API (application programmable\
    \ interface) for drawing simple shapes and lines. It’s this API that we will use\
    \ to render our game.\n\n## Drawing to the Canvas\n\n`<script>` elements contain\
    \ JavaScript code that’s executed by the browser. Add the `<script>` shown in\
    \ Listing 1-2 into your document `<body>` after the `<canvas>` element.\n\n```\n\
    <script>\n  var canvas = document.getElementById(\"asteroids\");\n  var context\
    \ = canvas.getContext(\"2d\");\n  context.strokeStyle = 'dimgrey';\n  context.lineWidth\
    \ = 5;\n  context.rect(75, 75, 250, 250);\n  context.stroke();\n  // this is a\
    \ comment, it has no effect!!!\n</script>\n```\n\n*Listing 1-2* A Simple Script\n\
    \nYou’ll need to reload the page in order for the script to run. The script runs\
    \ line by line once the page is loaded. The first line calls the `getElementById`\
    \ method on the global `document` object. The `document` object is defined automatically\
    \ and provides a programmable interface into the entire HTML document. The document\
    \ is loaded into memory as a tree-like structure often referred to as the DOM\
    \ (Document Object Model). In this case we’re using `getElementById` to get a\
    \ reference to the `<canvas>` element within the DOM using the `id` value we specified\
    \ in the HTML.\n\nThe second line in the script generates a reference to a canvas\
    \ context. Canvas contexts provide an API for drawing. In this case, we’re accessing\
    \ the `\"2d\"` canvas context. It has a variety of methods for drawing lines and\
    \ shapes on the canvas and for transforming the canvas. Other canvas contexts\
    \ are available but are outside of the scope of this book.\n\nThe third and fourth\
    \ lines of the script set some properties of the context. Setting `context.strokeStyle`\
    \ affects the color of the line, here we set it to the built in `'dimgrey'` color.\
    \ Setting `context.lineWidth` affects the thickness of the line, and here we set\
    \ it to five pixels wide. When we set properties of the canvas context, they remain\
    \ in force until we change them. All future lines we draw will be five pixels\
    \ wide and `'dimgrey'` until we tell the canvas context otherwise.\n\nThe fifth\
    \ line specifies a rectangle using the `context.rect` method. The `(x, y)` pixel\
    \ coordinates of the origin of the rectangle is specified in the first two arguments\
    \ (`75` and `75`). The pixel width and height of the rectangle are specified in\
    \ the last two arguments (`250` and `250`). Most canvas operations involving lengths\
    \ are specified in pixels (and angles are in radians). Note that this line specifies\
    \ the rectangle but doesn’t draw it. The rectangle specification is stored in\
    \ memory as a structure known as a path. We’ll talk more about paths later.\n\n\
    The final active line tells the context to draw the stored path using the current\
    \ values of the context properties (`lineWidth` and `strokeStyle`). Open the file\
    \ in your browser and you’ll see the rectangle has been drawn on the canvas, as\
    \ shown in Figure 1-1.\n\n![A455241_1_En_1_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig1_HTML.jpg)\n\
    \n*Figure 1-1* A rectangle (actually, a square)\n\nThe final line of the script\
    \ is actually a comment. Comments begin with double forward slashes (`//`) and\
    \ are ignored by the browser when running the code. Comments are useful for annotating\
    \ your code but also for quickly removing lines of code while keeping the ability\
    \ to uncomment them again later by removing the slashes."
