    Object constructors are a great way to create multiple similar objects and they’re
    easy to create. Simply define a function and assign data to a special this keyword
    when inside the function. Listing [7-8](#A455241_1_En_7_Chapter.xhtml#Par35) is
    a handy object constructor for creating asteroids just like in the previous example.
    Place this in a new library file objects.js and add a new <script> element into
    the <head> element of the page. function Asteroid(segments, radius, noise) {   this.x
    = context.canvas.width * Math.random();   this.y = context.canvas.height * Math.random();
      this.angle = 0;   this.x_speed = context.canvas.width * (Math.random() - 0.5);
      this.y_speed = context.canvas.height * (Math.random() - 0.5);   this.rotation_speed
    = 2 * Math.PI * (Math.random() - 0.5);   this.radius = radius;   this.noise =
    noise;   this.shape = [];   for(let i = 0; i < segments; i++) {     this.shape.push(Math.random()
    - 0.5);   } } Listing 7-8 An Object Constructor It’s good practice but not obligatory
    to capitalize object constructors in order to identify them in code. In this case
    we’ve called the constructor Asteroid. We’ve assigned all the variables to properties
    of the this keyword within the function. Notice that we take three arguments:
    the number of segments, radius, and noise. All the other variables are defined
    randomly, have default values, or are derived from the provided arguments. We
    don’t even store the segments argument as a property. It is only used to allocate
    the correct number of items in the shape property. To use a constructor to create
    an instance of an object, we must use the new keyword, like so: var asteroid =
    new Asteroid(24, 50, 0.2); Update your code by replacing the object literal with
    the preceding one-liner. Make sure you include the link to the constructor function
    in your page. See your asteroid continue inexorably on its journey though deep
    space. Feel satisfied that your code is now far better organized than it was.
    But so what? Why do we bother with organizing code like this?'
  trans: "\n## 重构为简单对象\n\n在前面的代码中，我们将与小行星相关的所有数据都保存在全局作用域中。小行星的形状、位置和速度在脚本顶部被声明为简单变量。这种做法可扩展性很差——想象一下要为十颗小行星管理这些数据。我们需要某种结构。我们可以使用对象来表示游戏元素。对象可以存储与特定游戏对象相关的数据集合。将`segments`和`rotation_speed`之间的变量声明替换为清单\
    \ 7-5 中的代码。\n\n```javascript\nvar asteroid = {\n    segments: 24,\n    shape:\
    \ [],\n    radius: 50,\n    noise: 0.5,\n    x: context.canvas.width * Math.random(),\n\
    \    y: context.canvas.height * Math.random(),\n    angle: 0,\n    x_speed: context.canvas.width\
    \ * (Math.random() - 0.5),\n    y_speed: context.canvas.height * (Math.random()\
    \ - 0.5),\n    rotation_speed: 2 * Math.PI * (Math.random() - 0.5)\n};\n```\n\n\
    清单 7-5 对象字面量\n\n这里我们定义了一个名为`asteroid`的单一对象，并将变量存储在其中。JavaScript 对象允许将相关变量存储在一起。语法很直观。我们在花括号之间指定逗号分隔的\
    \ `key: value` 对。对象属性可以通过点语法（`asteroid.radius`）或带字符串索引的方括号（`asteroid[\"radius\"\
    ]`）来访问。我们可以像往常一样将数据赋给对象参数。用清单 7-6 中的代码随机化`asteroid.shape`数组。\n\n```javascript\n\
    for(var i = 0; i < asteroid.segments; i++) {\n    asteroid.shape.push(Math.random()\
    \ - 0.5);\n}\n```\n\n清单 7-6 生成形状\n\n现在我们需要升级`draw`函数，使其使用新对象中的数据。将`draw`函数替换为清单\
    \ 7-7 中的代码。\n\n```javascript\nfunction draw(ctx, guide) {\n    if(guide) {\n \
    \       draw_grid(ctx);\n    }\n    ctx.save();\n    ctx.translate(asteroid.x,\
    \ asteroid.y);\n    ctx.rotate(asteroid.angle);\n    draw_asteroid(ctx, asteroid.radius,\
    \ asteroid.shape, {\n        noise: asteroid.noise,\n        guide: guide\n  \
    \  });\n    ctx.restore();\n}\n```\n\n清单 7-7 使用对象数据\n\n对`update`函数执行相同操作。只要变量已被移入`asteroid`对象，就添加前缀来访问数据。刷新页面，动画应该像之前一样正常工作。如果没有任何反应，请检查控制台中的错误消息——这些消息应该足够清晰，便于调试代码。如果你遗漏了某个变量，它会提示“未捕获的引用错误”，并指出是哪个变量以及代码中哪一行出了问题。\n\
    \n**注意** 大多数浏览器都内置了开发者工具。通常可以通过按`F12`键访问，但具体细节请查阅浏览器文档。JavaScript 控制台是一个非常有用的工具——它显示错误消息，并允许你直接与程序交互。\n\
    \n现在在浏览器控制台中输入`asteroid`并按回车键。你应该会看到命令被执行时的所有小行星参数。所有小行星数据都保存在一个对象中。这很好。但对于我们的目的来说，对象字面量语法还是相当笨拙。如果有更简洁的方法来创建小行星，我们就可以大大简化代码。\n\
    \n## 使用对象构造函数\n\n对象构造函数是创建多个相似对象的好方法，而且容易创建。只需定义一个函数，并在函数内部将数据赋给特殊的`this`关键字。清单\
    \ 7-8 是一个方便的对象构造函数，用于创建与前例类似的小行星。将其放入新的库文件`objects.js`中，并在页面的`<head>`元素中添加一个新的`<script>`元素。\n\
    \n```javascript\nfunction Asteroid(segments, radius, noise) {\n    this.x = context.canvas.width\
    \ * Math.random();\n    this.y = context.canvas.height * Math.random();\n    this.angle\
    \ = 0;\n    this.x_speed = context.canvas.width * (Math.random() - 0.5);\n   \
    \ this.y_speed = context.canvas.height * (Math.random() - 0.5);\n    this.rotation_speed\
    \ = 2 * Math.PI * (Math.random() - 0.5);\n    this.radius = radius;\n    this.noise\
    \ = noise;\n    this.shape = [];\n    for(let i = 0; i < segments; i++) {\n  \
    \      this.shape.push(Math.random() - 0.5);\n    }\n}\n```\n\n清单 7-8 一个对象构造函数\n\
    \n为了在代码中识别构造函数，通常建议（但非强制）将其首字母大写。这里我们将构造函数命名为`Asteroid`。我们在函数内将所有变量赋给了`this`关键字的属性。注意我们接受了三个参数：`segments`（分段数）、`radius`（半径）和`noise`（噪声）。其他变量要么是随机定义的，要么有默认值，要么由提供的参数推导得出。我们甚至没有将`segments`参数存储为属性，它仅用于在`shape`属性中分配正确数量的元素。要使用构造函数创建对象实例，必须使用`new`关键字，如下所示：\n\
    \n```javascript\nvar asteroid = new Asteroid(24, 50, 0.2);\n```\n\n用上述单行代码替换对象字面量，更新你的代码。确保在页面中包含了构造函数函数的链接。看着你的小行星在深邃太空中不可阻挡地继续它的旅程。满意地发现，你的代码现在组织得比以前好多了。但然后呢？我们为什么要费心这样组织代码？\n"
- fmt: "# Extending the Asteroid Prototype\n\nJavaScript is a prototype-based system.\
    \ All objects created with our constructor will share a common prototype. A huge\
    \ benefit of objects in JavaScript is that any properties or methods we define\
    \ on that prototype will be available to all instances of our object type. This\
    \ is our route to drawing and updating multiple asteroids with ease. Let's say\
    \ we create a lot of asteroids, in an array. If we define an `update` and `draw`\
    \ function on the `Asteroid.prototype`, we'll be able to update or draw any asteroid\
    \ with a single method call. Looping over our `Asteroid` objects and calling the\
    \ appropriate methods will be trivial, and all the intelligence about how an asteroid\
    \ behaves will be located in one place on the `Asteroid.prototype`.\n\nListing\
    \ 7-9 shows an `update` function on the `Asteroid.prototype`. Add the function\
    \ into `objects.js`, making sure to add it after the constructor is defined.\n\
    \n```\nAsteroid.prototype.update = function(elapsed) {\n  if(this.x - this.radius\
    \ + elapsed * this.x_speed > context.canvas.width) {\n    this.x = -this.radius;\n\
    \  }\n  if(this.x + this.radius + elapsed * this.x_speed < 0) {\n    this.x =\
    \ context.canvas.width + this.radius;\n  }\n  if(this.y - this.radius + elapsed\
    \ * this.y_speed > context.canvas.height) {\n    this.y = -this.radius;\n  }\n\
    \  if(this.y + this.radius + elapsed * this.y_speed < 0) {\n    this.y = context.canvas.height\
    \ + this.radius;\n  }\n  this.x += elapsed * this.x_speed;\n  this.y += elapsed\
    \ * this.y_speed;\n  this.angle = (this.angle + this.rotation_speed * elapsed)\
    \ % (2 * Math.PI);\n}\n```\n\n**Listing 7-9** A Prototype Method\n\nThis is almost\
    \ identical to our original `update` function except now we're referring to the\
    \ instance properties of the object. For now, we can replace our global `update`\
    \ function with the simple one-liner from Listing 7-10.\n\n```\nfunction update(elapsed)\
    \ {\n  asteroid.update(elapsed);\n}\n```\n\n**Listing 7-10** A Simplified `update`\
    \ Function\n\nRefreshing the page should show our asteroid is still going. Nothing\
    \ has changed except our code quality. Now add the `draw` function from Listing\
    \ 7-11 to the `Asteroid.prototype` in the same way.\n\n```\nAsteroid.prototype.draw\
    \ = function(ctx, guide) {\n  ctx.save();\n  ctx.translate(this.x, this.y);\n\
    \  ctx.rotate(this.angle);\n  draw_asteroid(ctx, this.radius, this.shape, {\n\
    \    guide: guide,\n    noise: this.noise\n  });\n  ctx.restore();\n}\n```\n\n\
    **Listing 7-11** Another Prototype Method\n\nAgain, we're simply transferring\
    \ existing code into the function and specifying the instance variables. We've\
    \ also specified two arguments: a context, `ctx`, and the optional `guide`. Our\
    \ global `draw` function now looks like Listing 7-12.\n\n```\nfunction draw(ctx,\
    \ guide) {\n  if(guide) {\n    draw_grid(ctx);\n  }\n  asteroid.draw(ctx, guide);\n\
    }\n```\n\n**Listing 7-12** A Simplified `draw` Function\n\nThis hasn't changed\
    \ much. We just replaced all the asteroid drawing code with a single call to the\
    \ preceding function. The `guide` drawing is still here as it's a global concern\
    \ and not related to this individual asteroid.\n\n# Working with Multiple Asteroids\n\
    \nNow that our basic Asteroid \"class\" is complete, we can try working with multiple\
    \ asteroid instances. Update your code in line with Listing 7-13.\n\n```\nvar\
    \ asteroids = [\n  new Asteroid(24, 50, 0.2),\n  new Asteroid(24, 50, 0.5),\n\
    \  new Asteroid(5, 50, 0.2)\n];\n\nfunction draw(ctx, guide) {\n  if(guide) {\n\
    \    draw_grid(ctx);\n  }\n  asteroids.forEach(function(asteroid) {\n    asteroid.draw(context,\
    \ guide);\n  });\n}\n\nfunction update(elapsed) {\n  asteroids.forEach(function(asteroid)\
    \ {\n    asteroid.update(elapsed);\n  });\n}\n```\n\n**Listing 7-13** Three Asteroids\n\
    \nWe've replaced the `asteroid` variable with an array of `Asteroid` objects.\
    \ In our `draw` function, we replace the call to the `asteroid.draw` function\
    \ with a loop that calls `draw` on each item in the `asteroids` array. Finally,\
    \ we replace the call to the `asteroid.update` function in a similar way.\n\n\
    Figure 7-2 shows the result. Refresh the page and behold the three quite different\
    \ asteroids you've brought into being!\n\n![A455241_1_En_7_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_7_Fig2_HTML.jpg)\n\
    \n**Figure 7-2** Three asteroids floating about\n\n# Summary\n\nIn this chapter\
    \ we transformed the structure of our code. We now store and update asteroid data\
    \ and render the asteroid to the canvas all within a new object type. The logic\
    \ we employ in the code is pretty much identical to before. We haven't changed\
    \ the way the asteroid is drawn or updated; we've simply added structure to the\
    \ code. This additional structure allows us to create asteroids with a simple\
    \ call to a constructor. We can then call methods on the asteroid objects in a\
    \ very convenient way.\n\nIn Listing 7-13, a few small changes allowed us to add\
    \ any number of asteroids to our scene in parallel. Without the restructuring,\
    \ this would have been much more difficult to manage.\n\n© Graeme Stuart 2017\
    \  \nGraeme Stuart, *Introducing JavaScript Game Development*  \n[https://doi.org/10.1007/978-1-4842-3252-1_8](https://doi.org/10.1007/978-1-4842-3252-1_8)\n\
    \n# 8. Practicing Objects\n\nGraeme Stuart^(1)\n\n(1) Market Harborough, Leicestershire,\
    \ UK\n\nThe benefits of the object-oriented approach should be clear by now. We\
    \ can design our objects (`Asteroid`, `Ship`, and so on) with a simple and intuitive\
    \ API. Our objects track their own state and update themselves when we ask them\
    \ to (in their `update` functions). They can also easily be drawn to the canvas\
    \ in the correct position with a simple function call (their `draw` functions).\
    \ The game loop itself can update all our objects in turn and then draw them all.\
    \ We should be able to read the high-level code without too much trouble. All\
    \ the nitty-gritty details are delegated to the objects themselves. In this chapter,\
    \ we'll practice using objects in this way with a familiar example.\n\n## Why\
    \ Objects?\n\nIt's an important point of modern development practice that there's\
    \ often a trade-off between the efficiency of an implementation and the clarity\
    \ of the code we produce. With the computing power available in low-end machines\
    \ being more than enough for a simple game like this, we should focus our attention\
    \ on making our code easily understandable. Although efficiency of an implementation\
    \ is very important, and we should always strive to be efficient by default, we\
    \ shouldn't allow this to affect the overall design of our code. Indeed, we may\
    \ actively choose to sacrifice efficiency for clarity on occasion. By pushing\
    \ the low-level code into objects (and moving this code into library modules),\
    \ we keep the low-level implementation details out of sight. Our top-level scope\
    \ (we're currently coding in the global scope) is then easy to follow and can\
    \ focus on the higher-level game logic. We can work on this code without needing\
    \ to think about how the asteroid behavior is implemented or how asteroids are\
    \ drawn, maintaining a separation of concerns and allowing us to focus on the\
    \ job at hand."
  raw: '## Extending the Asteroid Prototype


    JavaScript is a prototype-based system. All objects created with our constructor
    will share a common prototype. A huge benefit of objects in JavaScript is that
    any properties or methods we define on that prototype will be available to all
    instances of our object type. This is our route to drawing and updating multiple
    asteroids with ease. Let’s say we create a lot of asteroids, in an array. If we
    define an update and draw function on the Asteroid.prototype, we’ll be able to
    update or draw any asteroid with a single method call. Looping over our Asteroid
    objects and calling the appropriate methods will be trivial, and all the intelligence
    about how an asteroid behaves will be located in one place on the Asteroid.prototype.
    Listing [7-9](#A455241_1_En_7_Chapter.xhtml#Par43) shows an update function on
    the Asteroid.prototype. Add the function into objects.js, making sure to add it
    after the constructor is defined. Asteroid.prototype.update = function(elapsed)
    {   if(this.x - this.radius + elapsed * this.x_speed > context.canvas.width) {
        this.x = -this.radius;   }   if(this.x + this.radius + elapsed * this.x_speed
    < 0) {     this.x = context.canvas.width + this.radius;   }   if(this.y - this.radius
    + elapsed * this.y_speed > context.canvas.height) {     this.y = -this.radius;
      }   if(this.y + this.radius + elapsed * this.y_speed < 0) {     this.y = context.canvas.height
    + this.radius;   }   this.x += elapsed * this.x_speed;   this.y += elapsed * this.y_speed;
      this.angle = (this.angle + this.rotation_speed * elapsed) % (2 * Math.PI); }
    Listing 7-9 A Prototype Method This is almost identical to our original update
    function except now we’re referring to the instance properties of the object.
    For now, we can replace our global update function with the simple one-liner from
    Listing [7-10](#A455241_1_En_7_Chapter.xhtml#Par45). function update(elapsed)
    {   asteroid.update(elapsed); } Listing 7-10 A Simplified update Function Refreshing
    the page should show our asteroid is still going. Nothing has changed except our
    code quality. Now add the draw function from Listing [7-11](#A455241_1_En_7_Chapter.xhtml#Par47)
    to the Asteroid.prototype in the same way. Asteroid.prototype.draw = function(ctx,
    guide) {   ctx.save();   ctx.translate(this.x, this.y);   ctx.rotate(this.angle);
      draw_asteroid(ctx, this.radius, this.shape, {     guide: guide,     noise: this.noise
      });   ctx.restore(); } Listing 7-11 Another Prototype Method Again, we’re simply
    transferring existing code into the function and specifying the instance variables.
    We’ve also specified two arguments: a context, ctx, and the optional guide. Our
    global draw function now looks like Listing [7-12](#A455241_1_En_7_Chapter.xhtml#Par49).
    function draw(ctx, guide) {   if(guide) {     draw_grid(ctx);   }   asteroid.draw(ctx,
    guide); } Listing 7-12 A Simplified draw Function This hasn’t changed much. We
    just replaced all the asteroid drawing code with a single call to the preceding
    function. The guide drawing is still here as it’s a global concern and not related
    to this individual asteroid .


    ## Working with Multiple Asteroids


    Now that our basic Asteroid “class” is complete, we can try working with multiple
    asteroid instances. Update your code in line with Listing [7-13](#A455241_1_En_7_Chapter.xhtml#Par52).
    var asteroids = [   new Asteroid(24, 50, 0.2),   new Asteroid(24, 50, 0.5),   new
    Asteroid(5, 50, 0.2) ]; function draw(ctx, guide) {   if(guide) {     draw_grid(ctx);
      }   asteroids.forEach(function(asteroid) {     asteroid.draw(context, guide);
      }); } function update(elapsed) {   asteroids.forEach(function(asteroid) {     asteroid.update(elapsed);
      }); } Listing 7-13 Three Asteroids We’ve replaced the asteroid variable with
    an array of Asteroid objects. In our draw function, we replace the call to the
    asteroid.draw function with a loop that calls draw on each item in the asteroids
    array. Finally, we replace the call to the asteroid.update function in a similar
    way. Figure [7-2](#A455241_1_En_7_Chapter.xhtml#Fig2) shows the result. Refresh
    the page and behold the three quite different asteroids you’ve brought into being!
    ![A455241_1_En_7_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_7_Fig2_HTML.jpg) Figure
    7-2 Three asteroids floating about


    ## Summary


    In this chapter we transformed the structure of our code. We now store and update
    asteroid data and render the asteroid to the canvas all within a new object type.
    The logic we employ in the code is pretty much identical to before. We haven''t
    changed the way the asteroid is drawn or updated; we’ve simply added structure
    to the code. This additional structure allows us to create asteroids with a simple
    call to a constructor. We can then call methods on the asteroid objects in a very
    convenient way. In Listing [7-13](#A455241_1_En_7_Chapter.xhtml#Par52), a few
    small changes allowed us to add any number of asteroids to our scene in parallel.
    Without the restructuring, this would have been much more difficult to manage.© Graeme
    Stuart 2017 Graeme StuartIntroducing JavaScript Game Development [https://doi.org/10.1007/978-1-4842-3252-1_8](#A455241_1_En_8_Chapter.xhtml)


    # 8. Practicing Objects


    Graeme Stuart^(1 ) (1) Market Harborough, Leicestershire, UK   The benefits of
    the object-oriented approach should be clear by now. We can design our objects
    (Asteroid, Ship, and so on) with a simple and intuitive API. Our objects track
    their own state and update themselves when we ask them to (in their update functions).
    They can also easily be drawn to the canvas in the correct position with a simple
    function call (their draw functions). The game loop itself can update all our
    objects in turn and then draw them all. We should be able to read the high-level
    code without too much trouble. All the nitty-gritty details are delegated to the
    objects themselves. In this chapter, we’ll practice using objects in this way
    with a familiar example.


    ## Why Objects?


    It’s an important point of modern development practice that there’s often a trade-off
    between the efficiency of an implementation and the clarity of the code we produce.
    With the computing power available in low-end machines being more than enough
    for a simple game like this, we should focus our attention on making our code
    easily understandable. Although efficiency of an implementation is very important,
    and we should always strive to be efficient by default, we shouldn’t allow this
    to affect the overall design of our code. Indeed, we may actively choose to sacrifice
    efficiency for clarity on occasion. By pushing the low-level code into objects
    (and moving this code into library modules), we keep the low-level implementation
    details out of sight. Our top-level scope (we’re currently coding in the global
    scope) is then easy to follow and can focus on the higher-level game logic. We
    can work on this code without needing to think about how the asteroid behavior
    is implemented or how asteroids are drawn, maintaining a separation of concerns
    and allowing us to focus on the job at hand.'
  trans: "\n# 扩展小行星原型\n\nJavaScript 是一个基于原型的系统。所有通过构造函数创建的对象都将共享同一个原型。JavaScript 中对象的一个巨大优势在于，我们在该原型上定义的任何属性或方法都将对我们对象类型的所有实例可用。这就是我们能够轻松绘制和更新多个小行星的途径。假设我们创建了一个包含许多小行星的数组。如果在\
