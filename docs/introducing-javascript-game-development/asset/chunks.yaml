      }   // If Its going fast, turn around to slow down   if(Math.abs(ship.speed())
    > 100) {     ship.angle = ship.movement_angle() + Math.PI;   }   // push in the
    direction its pointing (thrusters?)   ship.push(ship.angle, 1000, elapsed)   asteroids.forEach(function(asteroid)
    {     asteroid.update(elapsed, context);   })   ship.update(elapsed, context);
    } Listing 9-14 Playing with the Ship Here we’re implementing a simple set of instructions
    to control the ship. We accelerate the ship forward all the time (as if the ship’s
    thrusters were on). If the ship speed gets above 100 pixels per second, we turn
    around to face the opposite direction. When we’re travelling slowly, we increase
    the ship’s angle. This is beginning to look like a game.


    ## Summary


    In this chapter, you’ve learned how to define common functionality and share it
    between multiple game elements. We implemented methods on the parent Mass class
    that can be inherited by any massive objects we need to float around according
    to the basic laws of motion. We also played with developing a scene. The structured
    way we’ve developed our objects makes it easy. It allows us to write very simple
    code to initialize game elements, decide on their initial behavior, and “hook
