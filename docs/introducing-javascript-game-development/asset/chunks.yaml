  trans: "\n# 第一部分：绘制图形\n\n顾名思义，HTML `<canvas>` 元素提供了一块空白的画布，我们可以在上面绘制游戏。绘制是与 HTML\
    \ `<canvas>` 元素打交道的基本技能，因此在最初的几章中，我们将探索绘制的工作原理，并学习用简单的线条和填充来绘制我们自己设计所必需的基础知识。我们还将开发一些\
    \ *Asteroids* 游戏克隆所需的游戏元素。\n\n# 1. HTML5 与 Canvas 元素\n\n本章介绍 HTML、CSS 和 JavaScript\
    \ 的一些基础知识。这些是核心的 Web 技术，在本书中我们将使用它们来开发游戏。为了能够跟着操作，你需要一个文本编辑器来生成文本文件，以及一个网络浏览器来查看结果。你不需要学习这些技术涉及的所有内容。我们只专注于足够在\
    \ HTML `<canvas>` 元素上绘制一些内容的知识。因为整本书都会用到 HTML `<canvas>` 元素，所以请密切关注。\n\n## HTML\
    \ 入门\n\nHTML（超文本标记语言）文档用于描述网络上的内容。当你访问一个网页时，通常是在下载并查看一个 HTML 文档。HTML 是一种组织多媒体内容（文本、图像、视频等）并赋予其语义含义，以及在信息“网络”中链接文档的方式。HTML5\
    \ 是当前 HTML 标准的版本。该标准最初开发于 20 世纪 90 年代初，此后经历了一些演变。现代标准使得万维网拥有了极其丰富的体验。\n\n我们将使用\
    \ HTML `<canvas>` 元素，所以让我们创建第一个 HTML 文档并向其中添加一个 `<canvas>` 元素。创建一个名为 `exercise1.html`\
    \ 的文件，并输入如列表 1-1 所示的基本 HTML 模板。\n\n```\n<!doctype html>\n<html>\n  <head>\n  \
    \  <title>这是一个 HTML 画布</title>\n  </head>\n  <body>\n    <h1>这是一个 HTML 画布</h1>\n\
    \    <canvas id=\"asteroids\" width=\"400\" height=\"400\"></canvas>\n  </body>\n\
    </html>\n```\n\n*列表 1-1* 一个基本 HTML 模板\n\n列表 1-1 以 `<!doctype html>` 声明开头。文档类型声明始终是\
    \ HTML 文档中的第一个内容。它告诉网页浏览器当前页面所基于的 HTML 版本。过去，使用文档类型声明很复杂，因为有许多 HTML 版本可供选择。对于\
    \ HTML5，该声明简化为仅指定我们正在使用 HTML。\n\n文档类型声明之后，主 `<html>` 元素被打开。请注意，它在文件末尾使用 `</html>`\
    \ 闭合标签来关闭。开始和结束 `<html>` 标签之间的所有内容都被认为是在 `<html>` 元素内部。一个 HTML 文件中除了文档类型声明和包含内容的\
    \ `<html>` 元素之外，不应再有其他内容。\n\n在 `<html>` 元素内部，有两个嵌套元素：`<head>` 和 `<body>`。`<head>`\
    \ 元素用于描述文档的详细信息，例如将在浏览器标签页中显示的 `<title>`。它通常还包含指向样式表或 JavaScript 文件的链接，这些文件规定了内容的渲染方式以及它们的行为。\n\
    \n`<body>` 元素包含文档的内容，在这个例子中，它包括一个一级标题 `<h1>` 和一个 `<canvas>` 元素。`<canvas>` 元素提供了一个用于绘制简单形状和线条的\
    \ JavaScript API（应用程序编程接口）。我们将使用这个 API 来渲染我们的游戏。\n\n## 在画布上绘制\n\n`<script>` 元素包含由浏览器执行的\
    \ JavaScript 代码。将列表 1-2 中所示的 `<script>` 添加到文档的 `<body>` 中，放在 `<canvas>` 元素之后。\n\
    \n```\n<script>\n  var canvas = document.getElementById(\"asteroids\");\n  var\
    \ context = canvas.getContext(\"2d\");\n  context.strokeStyle = 'dimgrey';\n \
    \ context.lineWidth = 5;\n  context.rect(75, 75, 250, 250);\n  context.stroke();\n\
    \  // 这是一个注释，它没有任何效果！！！\n</script>\n```\n\n*列表 1-2* 一个简单的脚本\n\n你需要重新加载页面才能让脚本运行。页面加载后，脚本会逐行执行。第一行调用全局\
    \ `document` 对象上的 `getElementById` 方法。`document` 对象是自动定义的，它提供了对整个 HTML 文档的可编程接口。文档被加载到内存中，形成一种树形结构，通常被称为\
    \ DOM（文档对象模型）。在本例中，我们使用 `getElementById` 通过我们在 HTML 中指定的 `id` 值来获取对 DOM 中 `<canvas>`\
    \ 元素的引用。\n\n脚本中的第二行生成一个对画布上下文的引用。画布上下文提供了用于绘制的 API。在这里，我们访问的是 `\"2d\"` 画布上下文。它提供了多种在画布上绘制线条和形状以及变换画布的方法。还有其他画布上下文可用，但超出了本书的范围。\n\
    \n脚本的第三行和第四行设置了上下文的一些属性。设置 `context.strokeStyle` 会影响线条的颜色，这里我们将其设置为内置颜色 `'dimgrey'`。设置\
    \ `context.lineWidth` 会影响线条的粗细，这里我们将其设置为五个像素宽。当我们设置画布上下文的属性时，这些属性会一直有效，直到我们再次更改它们。在我们另行通知画布上下文之前，我们之后绘制的所有线条都将是五个像素宽且为\
    \ `'dimgrey'` 颜色。\n\n第五行使用 `context.rect` 方法指定了一个矩形。矩形原点的像素坐标 `(x, y)` 在前两个参数（`75`\
    \ 和 `75`）中指定。矩形的像素宽度和高度在后两个参数（`250` 和 `250`）中指定。大多数涉及长度的画布操作都以像素为单位（角度以弧度为单位）。请注意，这一行仅指定了矩形，但并未绘制它。矩形定义被作为一个称为路径的结构存储在内存中。我们稍后会详细讨论路径。\n\
    \n最后一行有效代码告诉上下文使用上下文属性（`lineWidth` 和 `strokeStyle`）的当前值来绘制存储的路径。在浏览器中打开该文件，你会看到矩形已绘制在画布上，如图\
    \ 1-1 所示。\n\n![A455241_1_En_1_Fig1_HTML.jpg](img/A455241_1_En_1_Fig1_HTML.jpg)\n\
    \n*图 1-1* 一个矩形（实际上是正方形）\n\n脚本的最后一行实际上是一个注释。注释以双斜杠（`//`）开头，浏览器在运行代码时会忽略它们。注释对于注解代码很有用，也可以用于快速移除代码行，同时保留以后通过删除斜杠来取消注释的能力。\n"
- fmt: "# Style the Page to Highlight the Canvas\n\nGreat so far, but we can’t see\
    \ the edges of the canvas on the page because the page and canvas are both white.\
    \ Insert the `<style>` element from Listing [1-3](#A455241_1_En_1_Chapter.xhtml#Par20)\
    \ into the `<header>` element after the `<title>` element and reload the page.\n\
    \n```\n<style media=\"screen\">\n  body {\n    text-align: center;\n    font-family:\
    \ sans-serif;\n  }\n  canvas {\n    background-color: black;\n  }\n</style>\n\
    ```\n\nListing 1-3 Styling the Canvas\n\nStyles allow us to control how the content\
    \ of the document looks when it’s rendered by the browser. In this case, we’re\
    \ specifying that we want the `<body>` element to be centrally aligned with a\
    \ sans-serif font (this applies to all child elements of the body element, as\
    \ `font-family` is inherited by default). We’re also specifying that `<canvas>`\
    \ elements should be drawn with a black background color. After reloading the\
    \ page, you should see something similar to Figure [1-2](#A455241_1_En_1_Chapter.xhtml#Fig2).\n\
    \n![A455241_1_En_1_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2 A 250 × 250 “rectangle” in a 400 × 400 canvas. The top-left corner\
    \ is at point (75, 75). This allows us to see exactly where the canvas edges are\
    \ and understand that the rectangle is positioned as specified within the canvas.\
    \ I won’t cover styles much more in this book, but they’re a very powerful technology\
    \ providing exquisite control over how to render HTML content.\n\n## Experiment\
    \ with `fillStyle`\n\nSetting the `context.fillStyle` determines the color to\
    \ use when filling drawn shapes (including fonts). Try setting the fill style\
    \ to a light grey (for example, `context.fillStyle = 'lightgrey'`). Reloading\
    \ the page does nothing. That’s because we haven’t asked the context to fill the\
    \ path. To fill the path it’s necessary to call the `context.fill` method. Go\
    \ ahead and add the call at the end of the script, just like the call to `context.stroke`.\
    \ Also, swap the values of `fillStyle` and `strokeStyle` to create a dark square\
    \ with a light border for more contrast. Your page should look like Figure [1-3](#A455241_1_En_1_Chapter.xhtml#Fig3).\n\
    \n![A455241_1_En_1_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3 A dark square with a light border\n\nNow let’s change the shape of\
    \ the rectangle so we can create a motivational poster. Replace the rectangle\
    \ coordinates with those shown in Listing [1-4](#A455241_1_En_1_Chapter.xhtml#Par26).\
    \ Notice that we can access the `canvas.width` and `canvas.height` attributes\
    \ and use them to calculate the size of our rectangle.\n\n```\n<script>\n  var\
    \ canvas = document.getElementById(\"asteroids\");\n  var context = canvas.getContext(\"\
    2d\");\n  context.strokeStyle = 'lightgrey';\n  context.fillStyle = 'dimgrey';\n\
    \  context.lineWidth = 5;\n  context.rect(75, 50, canvas.width - 150, canvas.height\
    \ - 100);\n  context.stroke();\n  context.fill();\n</script>\n```\n\nListing 1-4\
    \ Changing the Rectangle Color, Shape, and Position\n\n## Rendering Text\n\nThe\
    \ canvas treats text a lot like a collection of shapes. The outline can be drawn\
    \ with the `context.strokeText` method, or text can be filled with the `context.fillText`\
    \ method. Both methods must be passed a text string and the (x, y) coordinates\
    \ (in pixels) at which to render the text. Before rendering text it’s useful to\
    \ change the font from the default using `context.font`. Add the two lines in\
    \ Listing [1-5](#A455241_1_En_1_Chapter.xhtml#Par29) to your script.\n\n```\n\
    context.font = \"34px Arial\";\ncontext.fillText(\"2D Drawing\", 110, 100);\n\
    ```\n\nListing 1-5 Write Some Text\n\nIt seems like nothing has happened, but\
    \ actually, the text has been drawn. The problem is that the `fillStyle` is still\
    \ set to the same color as the filled rectangle. The text color and the background\
    \ color are the same, so nothing visibly changes. Edit your script to add a second\
    \ call to `context.fillStyle`. Set it to a contrasting (light) color (for example,\
    \ `'lightgrey'`). Make sure your new line is positioned after the previous call\
    \ to `context.fill` and before your call to `context.fillText`. Refresh the page\
    \ and admire the fruits of your hard work—you should have something similar to\
    \ Figure [1-4](#A455241_1_En_1_Chapter.xhtml#Fig4).\n\n![A455241_1_En_1_Fig4_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4 Use `fillText` to render text\n\nTry using `context.strokeText` instead—it\
    \ has exactly the same API (it takes the same arguments in the same order) as\
    \ `context.fillText`. Notice that the text is rendered as an outline but that\
    \ the line width is still set to 5 pixels. Add another call to `context.lineWidth`\
    \ and choose a suitable thickness. Note that you can use non-integer values such\
    \ as `0.5`. Update your code to match Listing [1-6](#A455241_1_En_1_Chapter.xhtml#Par33).\n\
    \n```\n<script>\n  var canvas = document.getElementById(\"asteroids\");\n  var\
    \ context = canvas.getContext(\"2d\");\n  context.strokeStyle = 'lightgrey';\n\
    \  context.fillStyle = 'dimgrey';\n  context.lineWidth = 5;\n  context.rect(75,\
    \ 50, canvas.width - 150, canvas.height - 100);\n  context.stroke();\n  context.fill();\n\
    \  context.font = \"34px Arial\";\n  context.strokeStyle = '#FF2222';\n  context.fillStyle\
    \ = '#FFAAAA';\n  context.lineWidth = 0.75;\n  context.textAlign=\"center\";\n\
    \  let msg = \"2D Drawing\"\n  context.fillText(msg, canvas.width / 2, 100);\n\
    \  context.strokeText(msg, canvas.width / 2, 100);\n</script>\n```\n\nListing\
    \ 1-6 Some Fancy Text\n\nThe changes are all in the second half of the script.\
    \ We set the familiar `context` properties to some sensible values (note the use\
    \ of hexadecimal color codes). We then set a new property `context.textAlign`\
    \ to the value `\"center\"`. This tells the context to use the central point in\
    \ the text as the “anchor.” So, when we actually render the text, the central\
    \ point in the text is positioned at the x-coordinate we provide rather than the\
    \ default leftmost point. The final few lines set a message variable and draw\
    \ the text. First we fill it and then we draw an outline (experiment with swapping\
    \ the order of these method calls). This is just the same as before except this\
    \ time we’re calculating the x-coordinate rather than specifying a literal value\
    \ (such as `110`, as before). In this case, we’re aligning the text centrally\
    \ on the horizontal axis so we divide the width by 2. See Figure [1-5](#A455241_1_En_1_Chapter.xhtml#Fig5).\n\
    \n![A455241_1_En_1_Fig5_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig5_HTML.jpg)\n\
    \nFigure 1-5 Fancy, centred text"
  raw: '## Style the Page to Highlight the Canvas


    Great so far, but we can’t see the edges of the canvas on the page because the
    page and canvas are both white. Insert the <style> element from Listing [1-3](#A455241_1_En_1_Chapter.xhtml#Par20)
    into the <header> element after the <title> element and reload the page. <style
    media="screen">   body {     text-align: center;     font-family: sans-serif;
      }   canvas {     background-color: black;   } </style> Listing 1-3 Styling the
    Canvas Styles allow us to control how the content of the document looks when it’s
    rendered by the browser. In this case, we’re specifying that we want the <body>
    element to be centrally aligned with a sans-serif font (this applies to all child
    elements of the body element, as font-family is inherited by default). We’re also
    specifying that <canvas> elements should be drawn with a black background color.
    After reloading the page, you should see something similar to Figure [1-2](#A455241_1_En_1_Chapter.xhtml#Fig2).
    ![A455241_1_En_1_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig2_HTML.jpg) Figure
    1-2 A 250 × 250 “rectangle” in a 400 × 400 canvas. The top-left corner is at point
    (75, 75). This allows us to see exactly where the canvas edges are and understand
    that the rectangle is positioned as specified within the canvas. I won’t cover
    styles much more in this book, but they’re a very powerful technology providing
    exquisite control over how to render HTML content.


    ## Experiment with fillStyle


    Setting the context.fillStyle determines the color to use when filling drawn shapes
    (including fonts). Try setting the fill style to a light grey (for example, context.fillStyle
    = ''lightgrey''). Reloading the page does nothing. That’s because we haven’t asked
    the context to fill the path. To fill the path it’s necessary to call the context.fill
    method. Go ahead and add the call at the end of the script, just like the call
    to context.stroke. Also, swap the values of fillStyle and strokeStyle to create
    a dark square with a light border for more contrast. Your page should look like
    Figure [1-3](#A455241_1_En_1_Chapter.xhtml#Fig3). ![A455241_1_En_1_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig3_HTML.jpg)
    Figure 1-3 A dark square with a light border Now let’s change the shape of the
    rectangle so we can create a motivational poster. Replace the rectangle coordinates
    with those shown in Listing [1-4](#A455241_1_En_1_Chapter.xhtml#Par26). Notice
    that we can access the canvas.width and canvas.height attributes and use them
    to calculate the size of our rectangle. <script>   var canvas = document.getElementById("asteroids");
      var context = canvas.getContext("2d");   context.strokeStyle = ''lightgrey'';
      context.fillStyle = ''dimgrey'';   context.lineWidth = 5;   context.rect(75,
    50, canvas.width - 150, canvas.height - 100);   context.stroke();   context.fill();
    </script> Listing 1-4 Changing the Rectangle Color, Shape, and Position


    ## Rendering Text


    The canvas treats text a lot like a collection of shapes. The outline can be drawn
    with the context.strokeText method, or text can be filled with the context.fillText
    method. Both methods must be passed a text string and the (x, y) coordinates (in
    pixels) at which to render the text. Before rendering text it’s useful to change
    the font from the default using context.font. Add the two lines in Listing [1-5](#A455241_1_En_1_Chapter.xhtml#Par29)
    to your script. context.font = "34px Arial"; context.fillText("2D Drawing", 110,
    100); Listing 1-5 Write Some Text It seems like nothing has happened, but actually,
    the text has been drawn. The problem is that the fillStyle is still set to the
    same color as the filled rectangle. The text color and the background color are
    the same, so nothing visibly changes. Edit your script to add a second call to
    context.fillStyle. Set it to a contrasting (light) color (for example, ''lightgrey'').
    Make sure your new line is positioned after the previous call to context.fill
    and before your call to context.fillText. Refresh the page and admire the fruits
    of your hard work—you should have something similar to Figure [1-4](#A455241_1_En_1_Chapter.xhtml#Fig4).
    ![A455241_1_En_1_Fig4_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig4_HTML.jpg) Figure
    1-4 Use fillText to render text Try using context.strokeText instead—it has exactly
    the same API (it takes the same arguments in the same order) as context.fillText.
    Notice that the text is rendered as an outline but that the line width is still
    set to 5 pixels. Add another call to context.lineWidth and choose a suitable thickness.
    Note that you can use non-integer values such as 0.5\. Update your code to match
    Listing [1-6](#A455241_1_En_1_Chapter.xhtml#Par33). <script>   var canvas = document.getElementById("asteroids");
      var context = canvas.getContext("2d");   context.strokeStyle = ''lightgrey'';
      context.fillStyle = ''dimgrey'';   context.lineWidth = 5;   context.rect(75,
    50, canvas.width - 150, canvas.height - 100);   context.stroke();   context.fill();
      context.font = "34px Arial";   context.strokeStyle = ''#FF2222'';   context.fillStyle
    = ''#FFAAAA'';   context.lineWidth = 0.75;   context.textAlign="center";   let
    msg = "2D Drawing"   context.fillText(msg, canvas.width / 2, 100);   context.strokeText(msg,
    canvas.width / 2, 100); </script> Listing 1-6 Some Fancy Text The changes are
    all in the second half of the script. We set the familiar context properties to
    some sensible values (note the use of hexadecimal color codes). We then set a
    new property context.textAlign to the value "center". This tells the context to
    use the central point in the text as the “anchor.” So, when we actually render
    the text, the central point in the text is positioned at the x-coordinate we provide
    rather than the default leftmost point. The final few lines set a message variable
    and draw the text. First we fill it and then we draw an outline (experiment with
    swapping the order of these method calls). This is just the same as before except
    this time we’re calculating the x-coordinate rather than specifying a literal
    value (such as 110, as before). In this case, we’re aligning the text centrally
    on the horizontal axis so we divide the width by 2\. See Figure [1-5](#A455241_1_En_1_Chapter.xhtml#Fig5).
    ![A455241_1_En_1_Fig5_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig5_HTML.jpg) Figure
    1-5 Fancy, centred text'
  trans: "\n# 为页面设置样式以突出画布\n\n目前进展顺利，但由于页面和画布都是白色，我们无法在页面上看到画布的边缘。将代码清单 1-3 中的`<style>`元素插入到`<header>`元素中`<title>`元素之后，然后重新加载页面。\n\
    \n```\n<style media=\"screen\">\n  body {\n    text-align: center;\n    font-family:\
    \ sans-serif;\n  }\n  canvas {\n    background-color: black;\n  }\n</style>\n\
    ```\n\n**代码清单 1-3 为画布设置样式**\n\n样式允许我们控制文档内容在浏览器渲染时的外观。在此例中，我们指定希望`<body>`元素居中对齐，并使用无衬线字体（这适用于\
    \ body 元素的所有子元素，因为`font-family`默认会被继承）。我们还指定了`<canvas>`元素应使用黑色背景绘制。重新加载页面后，你应该会看到与图\
    \ 1-2 类似的内容。\n\n![A455241_1_En_1_Fig2_HTML.jpg](img/A455241_1_En_1_Fig2_HTML.jpg)\n\
    \n**图 1-2** 一个 400×400 画布中的 250×250“矩形”。其左上角位于点(75, 75)。这让我们能看清画布的边界，并理解矩形是按照指定位置放置在画布中的。本书不会过多介绍样式，但它们是一项非常强大的技术，能对\
    \ HTML 内容的渲染方式进行精细控制。\n\n## 尝试 `fillStyle`\n\n设置 `context.fillStyle` 决定了填充绘制形状（包括字体）时使用的颜色。尝试将填充样式设置为浅灰色（例如，`context.fillStyle\
    \ = 'lightgrey'`）。重新加载页面不会有任何变化。这是因为我们还没有要求上下文填充路径。要填充路径，必须调用 `context.fill` 方法。继续在脚本末尾添加对该方法的调用，就像调用\
    \ `context.stroke` 一样。同时，调换 `fillStyle` 和 `strokeStyle` 的值，创建一个深色方块并搭配浅色边框，以增强对比度。你的页面应该看起来像图\
    \ 1-3 所示。\n\n![A455241_1_En_1_Fig3_HTML.jpg](img/A455241_1_En_1_Fig3_HTML.jpg)\n\
    \n**图 1-3** 带浅色边框的深色方块\n\n现在，让我们改变矩形的形状，以便制作一张激励海报。将矩形坐标替换为代码清单 1-4 中显示的值。注意，我们可以访问\
    \ `canvas.width` 和 `canvas.height` 属性，并用它们来计算矩形的大小。\n\n```\n<script>\n  var canvas\
    \ = document.getElementById(\"asteroids\");\n  var context = canvas.getContext(\"\
    2d\");\n  context.strokeStyle = 'lightgrey';\n  context.fillStyle = 'dimgrey';\n\
    \  context.lineWidth = 5;\n  context.rect(75, 50, canvas.width - 150, canvas.height\
    \ - 100);\n  context.stroke();\n  context.fill();\n</script>\n```\n\n**代码清单 1-4\
    \ 改变矩形的颜色、形状和位置**\n\n## 渲染文本\n\n画布将文本视为一系列形状。轮廓可以通过 `context.strokeText` 方法绘制，文本则可以通过\
    \ `context.fillText` 方法填充。这两个方法都必须传入一个文本字符串以及渲染文本的 (x, y) 坐标（以像素为单位）。在渲染文本之前，使用\
    \ `context.font` 更改默认字体是很有用的。将代码清单 1-5 中的两行代码添加到你的脚本中。\n\n```\ncontext.font =\
    \ \"34px Arial\";\ncontext.fillText(\"2D Drawing\", 110, 100);\n```\n\n**代码清单\
    \ 1-5 写入一些文本**\n\n看起来好像什么都没发生，但实际上文本已经被绘制了。问题在于 `fillStyle` 仍然设置为与填充矩形相同的颜色。文本颜色和背景颜色相同，因此视觉上没有变化。编辑你的脚本，添加第二次对\
    \ `context.fillStyle` 的调用。将其设置为对比色（浅色）（例如 `'lightgrey'`）。确保新行位于先前调用 `context.fill`\
    \ 的代码之后，以及调用 `context.fillText` 的代码之前。刷新页面，欣赏你辛勤工作的成果——你应该会得到与图 1-4 类似的效果。\n\n\
    ![A455241_1_En_1_Fig4_HTML.jpg](img/A455241_1_En_1_Fig4_HTML.jpg)\n\n**图 1-4**\
    \ 使用 `fillText` 渲染文本\n\n尝试改用 `context.strokeText` —— 它的 API 与 `context.fillText`\
    \ 完全相同（按相同顺序接受相同参数）。请注意，文本会被渲染为轮廓，但线宽仍设置为 5 像素。再添加一次对 `context.lineWidth` 的调用，并选择合适的粗细。注意，你可以使用非整数值，例如\
    \ `0.5`。更新你的代码，使其与代码清单 1-6 一致。\n\n```\n<script>\n  var canvas = document.getElementById(\"\
    asteroids\");\n  var context = canvas.getContext(\"2d\");\n  context.strokeStyle\
    \ = 'lightgrey';\n  context.fillStyle = 'dimgrey';\n  context.lineWidth = 5;\n\
    \  context.rect(75, 50, canvas.width - 150, canvas.height - 100);\n  context.stroke();\n\
    \  context.fill();\n  context.font = \"34px Arial\";\n  context.strokeStyle =\
    \ '#FF2222';\n  context.fillStyle = '#FFAAAA';\n  context.lineWidth = 0.75;\n\
    \  context.textAlign=\"center\";\n  let msg = \"2D Drawing\"\n  context.fillText(msg,\
    \ canvas.width / 2, 100);\n  context.strokeText(msg, canvas.width / 2, 100);\n\
    </script>\n```\n\n**代码清单 1-6 一些炫酷的文本**\n\n所有更改都在脚本的后半部分。我们将熟悉的 `context` 属性设置成了合理的值（注意使用了十六进制颜色代码）。然后，我们将新属性\
    \ `context.textAlign` 设置为 `\"center\"`。这告诉上下文使用文本的中心点作为“锚点”。因此，当我们实际渲染文本时，文本的中心点会定位在我们提供的\
    \ x 坐标处，而不是默认的最左侧点。最后几行代码设置了一个消息变量并绘制了文本。我们先填充文本，然后绘制轮廓（可以尝试调换这两个方法调用的顺序）。这与之前相同，只是这次我们计算了\
    \ x 坐标，而不是指定字面值（例如之前的 `110`）。在这个例子中，我们在水平轴上居中文本，因此将宽度除以 2。见图 1-5。\n\n![A455241_1_En_1_Fig5_HTML.jpg](img/A455241_1_En_1_Fig5_HTML.jpg)\n\
    \n**图 1-5** 居中显示的炫酷文本\n"
- fmt: "# More Shapes and Lines\n\nDrawing to the canvas is pretty simple. The tricky\
    \ part is deciding what to draw and designing it. Listing [1-7](#A455241_1_En_1_Chapter.xhtml#Par36)\
    \ includes some code for a simple stick figure waving. Paste it in at the end\
    \ of your script.\n\n```\ncontext.strokeStyle = '#FFFFFF';\ncontext.lineWidth\
    \ = 2;\ncontext.beginPath();\ncontext.arc(200, 140, 20, 0, Math.PI * 2);\ncontext.moveTo(200,\
    \ 160);\ncontext.lineTo(200, 220);\ncontext.moveTo(180, 300);\ncontext.lineTo(185,\
    \ 260);\ncontext.lineTo(200, 220);\ncontext.lineTo(215, 260);\ncontext.lineTo(220,\
    \ 300);\ncontext.moveTo(240, 130);\ncontext.lineTo(225, 170);\ncontext.lineTo(200,\
    \ 170);\ncontext.lineTo(175, 180);\ncontext.lineTo(170, 220);\ncontext.stroke();\n\
    ```\n\n*Listing 1-7 A Stick Figure*\n\nThe script starts by setting the stroke\
    \ color to white and the line width to 2 pixels. Then we see two new methods of\
    \ the `context` object. The `context.beginPath()` method begins a new path or\
    \ resets the current path. We need to call this because we already had an active\
    \ path left over from when we drew the original rectangle. If we don’t call it\
    \ (try commenting it out), then we continue the original path, and a line will\
    \ be drawn from the rectangle to our first circle. You’ll learn more about paths\
    \ in Chapter [2](#A455241_1_En_2_Chapter.xhtml).\n\nThe circle is drawn using\
    \ the `context.arc()` method. This method can be used to draw any circle or portion\
    \ of a circle. The method takes five arguments, as follows: the first pair of\
    \ arguments includes the `(x, y)` coordinates (in pixels) of the center of the\
    \ circle. The third argument is the radius of the circle, and the fourth and fifth\
    \ arguments are the starting angle and finishing angle of the arc (measured in\
    \ radians). To draw a full circle, these angles should be `0` and `2π`. We access\
    \ the value of `π` via the `Math.PI` property. We’ll use the built-in JavaScript\
    \ `Math` object extensively in later chapters.\n\nThe remaining method calls are\
    \ all either `context.moveTo()` or `context.lineTo()` until we finally call `context.stroke()`\
    \ to draw the path. The `context.moveTo()` and `context.lineTo()` methods both\
    \ take two arguments, and in both cases these are the `(x, y)` coordinates specifying\
    \ a location on the canvas in pixels. They each do exactly what you would expect.\
    \ To move the “pen” to a location without drawing a line, call `context.moveTo()`.\
    \ To draw a line from the current location to the given location, call `context.lineTo()`.\
    \ Follow the code line by line and see how each line of code is necessary to draw\
    \ the stick figure shown in Figure [1-6](#A455241_1_En_1_Chapter.xhtml#Fig6).\
    \ Try removing or editing some of the lines to see what happens. Play around until\
    \ you can predict the effect of a change.\n\n![A455241_1_En_1_Fig6_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig6_HTML.jpg)\n\
    \n*Figure 1-6 Circles and lines*\n\nFinally, complete the motivational poster\
    \ by adding the code in Listing [1-8](#A455241_1_En_1_Chapter.xhtml#Par42) to\
    \ your script before the recent changes to `context.lineWidth` and `context.strokeStyle`.\n\
    \n```\nlet msg2 = \"its quite easy\";\ncontext.font = \"24px Arial\";\ncontext.fillText(msg2,\
    \ canvas.width / 2, 330);\ncontext.strokeText(msg2, canvas.width / 2, 330);\n\
    ```\n\n*Listing 1-8 A Motivational Message*\n\nThe final image should appear like\
    \ Figure [1-7](#A455241_1_En_1_Chapter.xhtml#Fig7). Note how the position in the\
    \ code where you insert the new lines makes a difference. If you place the new\
    \ code after the context changes, the text outline will be drawn with a thicker,\
    \ white line.\n\n![A455241_1_En_1_Fig7_HTML.jpg](OEBPS/Images/A455241_1_En_1_Fig7_HTML.jpg)\n\
    \n*Figure 1-7 The finished poster*\n\n## Summary\n\nIn this chapter we’ve had\
    \ a very quick run-through of the basic technologies we’ll be using to create\
    \ our game. We’ve created our first HTML document and viewed it in the browser,\
    \ we’ve styled our document, and we’ve written code to manipulate our canvas element.\
    \ We’ve seen that the HTML `<canvas>` element has a programmable interface, and\
    \ we’ve used HTML `<script>` elements with JavaScript code to draw to the canvas.\
    \ We’ve been introduced to some of the methods available in the canvas context\
    \ and used them to render a motivational poster to the canvas. And we’ve seen\
    \ that the interface gives us tools for drawing lines and filling shapes and that\
    \ we can control the thickness of lines and the color of lines and shapes. We\
    \ learned a little about the coordinate system and how paths are constructed.\
    \ In Chapter [2](#A455241_1_En_2_Chapter.xhtml), we’ll expand on this and try\
    \ to get a deeper understanding of how to master the art of drawing what we want\
    \ on the HTML canvas.\n\n© Graeme Stuart 2017  \nGraeme Stuart  \n*Introducing\
    \ JavaScript Game Development*  \n[https://doi.org/10.1007/978-1-4842-3252-1_2](#A455241_1_En_2_Chapter.xhtml)\n\
    \n# 2. Understanding Paths\n\nGraeme Stuart^(1)\n\n(1) Market Harborough, Leicestershire,\
    \ UK\n\nChapter [1](#A455241_1_En_1_Chapter.xhtml) introduced some of the basic\
    \ methods for drawing to the canvas. This chapter presents a follow-up exercise\
    \ that looks more closely at the canvas coordinate system and explores how to\
    \ construct paths. These concepts are critical to understanding the canvas and\
    \ designing your own drawing code. We’ll also start to add a bit more structure\
    \ to our code. Complex code can be difficult to comprehend—adding structure is\
    \ the main way to keep the complexity under control. Structuring code into functions\
    \ allows the development of simpler code that uses those functions. This chapter\
    \ introduces functions and goes through the process of refactoring, a crucial\
    \ skill that’s necessary to manage code of any complexity.\n\n## Organizing Your\
    \ Files\n\nTo get started, we are going to organize our HTML document in a more\
    \ traditional way. In Chapter [1](#A455241_1_En_1_Chapter.xhtml), we simply included\
    \ the styling information in a `<style>` element. To remove clutter and make the\
    \ styles reusable, we’re going to move the styles into a separate file. Create\
    \ a file called `exercise2.html` and start with the basic template shown in Listing\
    \ [2-1](#A455241_1_En_2_Chapter.xhtml#Par4).\n\n```\n<!doctype html>\n<html>\n\
    \  <head>\n    <title>More drawing to canvas</title>\n    <link rel=\"stylesheet\"\
    \ href=\"styles.css\">\n  </head>\n  <body>\n    <h1>More drawing to canvas</h1>\n\
    \    <canvas id=\"asteroids\" width=\"400\" height=\"400\"></canvas>\n    <script>\n\
    \      var canvas = document.getElementById(\"asteroids\");\n      var context\
    \ = canvas.getContext(\"2d\");\n      // Grid drawing code goes here\n    </script>\n\
    \  </body>\n</html>\n```\n\n*Listing 2-1 A Basic Template*\n\nWe’ve added a `<link>`\
    \ element that refers to an external stylesheet called `styles.css`. Create the\
    \ `styles.css` file and add the rules from Listing [2-2](#A455241_1_En_2_Chapter.xhtml#Par6).\
    \ Both files should be saved in the same folder. It’s usually a good idea to have\
    \ a folder exclusively for these two files.\n\n```\nbody {\n  text-align: center;\n\
    \  font-family: sans-serif;\n}\ncanvas {\n  background-color: black;\n}\n```\n\
    \n*Listing 2-2 A Standard Stylesheet*\n\nLoad `exercise2.html` into your browser.\
    \ We have a blank canvas, so let’s put something on it.\n\n## The Canvas Grid\
    \ System"
