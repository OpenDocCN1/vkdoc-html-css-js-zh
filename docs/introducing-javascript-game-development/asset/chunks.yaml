    ```\n\n清单 9-13 设置一个简单场景\n\n我们现在有了一组小行星，每一颗都已被施加了推动和旋转以使其启动。我们还在画布中央有一艘飞船。将所有游戏元素连接到\
    \ update 和 draw 函数以激活它们。尝试在浏览器控制台中推动和旋转飞船。图 9-3 展示了你应该能够生成的场景。\n\n![A455241_1_En_9_Fig3_HTML.jpg](img/A455241_1_En_9_Fig3_HTML.jpg)\n\
    \n图 9-3 飞船和小行星都继承了质量属性\n\n现在让我们摆弄一下飞船。将全局 update 函数修改为清单 9-14 所示，然后刷新浏览器。\n\n\
    ```\nfunction update(elapsed) {\n  // 如果几乎停止，就转向\n  if(Math.abs(ship.speed())\
    \ < 15) {\n    ship.angle += Math.PI * 2 * 0.01;\n  }\n  // 如果速度较快，就转向以减速\n  if(Math.abs(ship.speed())\
