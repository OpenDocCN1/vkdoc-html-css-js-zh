    50, {angle: 0.8 * Math.PI, guide: true});   draw_ship(context, 75, 325, 50, {angle:
    0.3 * Math.PI, guide: true});   draw_ship(context, 325, 75, 50, {lineWidth: 8,
    fill: ''blue''}); </script> Listing 4-3 Setting the Ship Options The result is
    shown in Figure [4-3](#A455241_1_En_4_Chapter.xhtml#Fig3). Note how we can create
    a function that has a simple interface, and by allowing default values, a more
