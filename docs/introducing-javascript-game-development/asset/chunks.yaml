    ## The Ghost Object'
  trans: "\n# 被鬼魂追逐的吃豆人\n\n在接下来的几章中，我们将深入编写小行星游戏的代码。不过在此之前，我们先花点时间回顾一下游戏设计，看看上一章应用的原理如何应用到另一个涉及吃豆人的伪游戏中。我们将为吃豆人定义行为，并创建一个新对象来表示追逐吃豆人的鬼魂。吃豆人可以在画布上水平和垂直移动，并且会像之前的吃豆人和小行星示例一样环绕画布边界。偶尔，他会随机决定向左或向右转（顺时针或逆时针方向）。他将被鬼魂追逐。鬼魂的优势在于能够向任意方向移动，并且会被编程为径直朝吃豆人逼近。我们将通过让吃豆人速度更快来确保鬼魂难以得手。\n\
    \n创建一个名为 `exercise8` 的新文件夹，将常见的库和样式表复制到新文件夹中。添加一个名为 `exercise8.html` 的新模板，并像之前一样包含指向\
    \ `drawing.js` 和 `objects.js` 的链接。从列表 8-1 中的代码开始。这段代码实例化了一个 `PacMan` 对象，在各自的函数中更新和绘制它，并通过主游戏循环函数\
    \ `frame` 控制一切。\n\n```html\n<!doctype html>\n<html>\n  <head>\n    <title>动画</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
    ></script>\n    <script src=\"objects.js\"></script>\n  </head>\n  <body>\n  \
    \  <h1>动画</h1>\n    <canvas id=\"pacman\" width=\"300\" height=\"300\"></canvas>\n\
    \    <script>\n      var context = document.getElementById(\"pacman\").getContext(\"\
    2d\");\n      pacman = new PacMan(150, 150, 20, 120);\n      function draw(ctx,\
    \ guide) {\n        pacman.draw(ctx);\n      }\n      function update(elapsed)\
    \ {\n        pacman.update(elapsed, 300, 300);\n      }\n      var previous, elapsed;\n\
    \      function frame(timestamp) {\n        context.clearRect(0, 0, context.canvas.width,\
    \ context.canvas.height);\n        if (!previous) previous = timestamp;\n    \
    \    elapsed = timestamp - previous;\n        update(elapsed / 1000);\n      \
    \  draw(context, true);\n        previous = timestamp;\n        window.requestAnimationFrame(frame);\n\
    \      }\n      window.requestAnimationFrame(frame);\n    </script>\n  </body>\n\
    </html>\n```\n\n**列表 8-1** 一个简单模板\n\n## `PacMan` 对象\n\n现在我们需要在 `objects.js` 中定义\
    \ `PacMan` 构造函数。吃豆人很简单：我们通过参数设置其半径和速度。我们将其初始位置设为画布中心。在内部，吃豆人拥有 `x_speed` 和 `y_speed`（初始时向右移动）。他还拥有一个用于确定朝向的\
    \ `angle` 属性，以及一个记录嘴巴在咀嚼周期中位置的 `mouth_angle` 属性。将列表 8-2 添加到你的 `objects.js` 库中。注意没有提供默认值。\n\
    \n```javascript\nfunction PacMan(x, y, radius, speed) {\n  this.x = x;\n  this.y\
    \ = y;\n  this.radius = radius;\n  this.speed = speed;\n  this.angle = 0;\n  this.x_speed\
    \ = speed;\n  this.y_speed = 0;\n  this.time = 0;\n  this.mouth = 0;\n}\n```\n\
    \n**列表 8-2** `PacMan` 构造函数\n\n`PacMan.prototype.draw` 方法应该看起来很熟悉。它与 `Asteroid`\
    \ 的相同。将列表 8-3 添加到构造函数之后。\n\n```javascript\nPacMan.prototype.draw = function(ctx)\
    \ {\n  ctx.save();\n  ctx.translate(this.x, this.y);\n  ctx.rotate(this.angle);\n\
    \  draw_pacman(ctx, this.radius, this.mouth);\n  ctx.restore();\n}\n```\n\n**列表\
    \ 8-3** `PacMan.prototype.draw` 方法\n\n现在，在我们编写 `PacMan.prototype.update` 函数中吃豆人的行为之前，我们需要几个辅助函数。我们需要的主要辅助函数是一个能让吃豆人向左或向右旋转\
    \ 90 度的函数。列表 8-4 展示了这个新函数；将其添加到你的库中。\n\n```javascript\nPacMan.prototype.turn =\
    \ function(direction) {\n  if(this.y_speed) {\n    // 如果我们在垂直移动\n    // 设置水平速度并应用方向\n\
    \    this.x_speed = -direction * this.y_speed;\n    // 清除垂直速度并旋转\n    this.y_speed\
    \ = 0;\n    this.angle = this.x_speed > 0 ? 0 : Math.PI;\n  } else {\n    // 如果我们在水平移动\n\
    \    // 设置垂直速度并应用方向\n    this.y_speed = direction * this.x_speed;\n    // 清除水平速度并旋转\n\
    \    this.x_speed = 0;\n    this.angle = this.y_speed > 0 ? 0.5 * Math.PI : 1.5\
    \ * Math.PI;\n  }\n}\n```\n\n**列表 8-4** `PacMan.prototype.turn` 方法\n\n此函数依赖于一个限制条件：我们的吃豆人只能在水平和垂直方向上移动。也就是说，我们依赖于\
    \ `x_speed` 或 `y_speed` 其中一个始终为 0 的事实。函数首先测试我们是垂直移动还是水平移动。然后相应地改变移动方向，并调整角度，使吃豆人始终面朝正确的方向。该函数接受一个参数，用于选择是左转还是右转。为了使\
    \ API 更清晰，我们可以添加几个中间方法，如列表 8-5 所示。\n\n```javascript\nPacMan.prototype.turn_left\
    \ = function() {\n  this.turn(-1);\n}\n\nPacMan.prototype.turn_right = function()\
    \ {\n  this.turn(1);\n}\n```\n\n**列表 8-5** 辅助方法使 API 更友好\n\n有了这些方法，我们无需记住辅助函数的\
    \ API 规则，只需调用相应的函数即可让吃豆人左转或右转。现在，我们可以在 `PacMan.prototype.update` 函数中以非常清晰的方式使用这些函数，保持代码简洁明了。添加列表\
    \ 8-6 中的代码。\n\n```javascript\nPacMan.prototype.update = function(elapsed, width,\
    \ height) {\n  // 平均每 100 帧执行一次\n  if(Math.random() <= 0.01) {\n    if(Math.random()\
    \ < 0.5) {\n      this.turn_left();\n    } else {\n      this.turn_right();\n\
    \    }\n  }\n  if(this.x - this.radius + elapsed * this.x_speed > width) {\n \
    \   this.x = -this.radius;\n  }\n  if(this.x + this.radius + elapsed * this.x_speed\
    \ < 0) {\n    this.x = width + this.radius;\n  }\n  if(this.y - this.radius +\
    \ elapsed * this.y_speed > height) {\n    this.y = -this.radius;\n  }\n  if(this.y\
    \ + this.radius + elapsed * this.y_speed < 0) {\n    this.y = height + this.radius;\n\
    \  }\n  this.x += this.x_speed * elapsed;\n  this.y += this.y_speed * elapsed;\n\
    \  this.time += elapsed;\n  this.mouth = Math.abs(Math.sin(2 * Math.PI * this.time));\n\
    }\n```\n\n**列表 8-6** `PacMan.prototype.update` 方法\n\n第一个代码块平均每 100 帧才运行一次。它随机选择调用\
    \ `turn_left` 或 `turn_right` 函数。这会控制 `x_speed` 和 `y_speed` 属性以及 `angle` 属性。接下来的四个代码块应该与前面提到的\
    \ `Asteroid.prototype.update` 函数类似。在每个块中，我们检查是否即将穿过画布的某条边。如果确实穿过了边界，我们就将吃豆人定位到画布的对侧。完成移动后，我们像往常一样更新\
    \ `x` 和 `y` 坐标。注意我们已经去除了对全局上下文的任何依赖。我们接受 `width` 和 `height` 参数，并用它们来确定 `x` 和 `y`\
    \ 属性在何处环绕。最后，我们有两行代码更新 `mouth` 值，该值决定了嘴巴张开的程度。第一行通过已流逝的时间累加 `time`。第二行将 `mouth`\
    \ 更新为 `time` 值的正弦绝对值。这会使 `mouth` 以正弦波形式变化，让嘴巴每秒张开和闭合两次。\n\n创建一个全局的 `PacMan` 对象，并更新你的全局\
    \ `draw` 和 `update` 函数来绘制和更新它。当你用浏览器打开文件时，应该能看到吃豆人在咀嚼并随机转弯。图 8-1 展示了结果。\n\n![A455241_1_En_8_Fig1_HTML.jpg](img/A455241_1_En_8_Fig1_HTML.jpg)\n\
    \n**图 8-1** 吃豆人咀嚼和转弯\n\n## 鬼魂对象\n"
- fmt: "幽灵会沿着直线直接向Pac-Man移动。它们会有不同的颜色和不同的速度。它们不需要环绕画布，因为它们总是向Pac-Man移动。由于Pac-Man会环绕画布，它们会转身跟随他。绘制Pac-Man幽灵相当棘手。这里有一个基本方法。将代码清单[8-7](#A455241_1_En_8_Chapter.xhtml#Par26)复制到`drawing.js`中。\n\
    \n```javascript\nfunction draw_ghost(ctx, radius, options) {  \n  options = options\
    \ || {}  \n  var feet = options.feet || 4;  \n  var head_radius = radius * 0.8;\
    \  \n  var foot_radius = head_radius / feet;  \n  ctx.save();  \n  ctx.strokeStyle\
    \ = options.stroke || \"white\";  \n  ctx.fillStyle = options.fill || \"red\"\
    ;  \n  ctx.lineWidth = options.lineWidth || radius * 0.05;  \n  ctx.beginPath();\
    \  \n  for(foot = 0; foot < feet; foot++) {  \n    ctx.arc(  \n      (2 * foot_radius\
    \ * (feet - foot)) - head_radius - foot_radius,  \n      radius - foot_radius,\
    \  \n      foot_radius, 0, Math.PI  \n     );  \n  }  \n  ctx.lineTo(-head_radius,\
    \ radius - foot_radius);  \n  ctx.arc(0, head_radius - radius, head_radius, Math.PI,\
    \ 2 * Math.PI);  \n  ctx.closePath();  \n  ctx.fill();  \n  ctx.stroke();  \n\
    \  ctx.restore();  \n}\n```\n\n**代码清单8-7 绘制幽灵**\n\n我们绘制一系列倒置的半圆作为“脚”，然后绘制一条线连接到头部，再绘制另一个半圆作为头部。然后闭合路径完成绘制。计算所有这些元素的位置很棘手，但一旦完成，一切就能正常工作，你可以忘记它。图[8-2](#A455241_1_En_8_Chapter.xhtml#Fig2)显示了一个带有眼睛的幽灵。\n\
    \n![A455241_1_En_8_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_8_Fig2_HTML.jpg)\n\
    \n**图8-2 一个带有五个“脚”的大红色幽灵**\n\n尝试为你的幽灵添加眼睛。可以使用填充的黑色圆形，但用白色圆形内嵌黑色圆形会更有特色。对于`Ghost`构造函数，我们指定半径、速度和颜色作为参数。将代码清单[8-8](#A455241_1_En_8_Chapter.xhtml#Par30)复制到你的`objects.js`文件中。\n\
    \n```javascript\nfunction Ghost(x, y, radius, speed, colour) {  \n  this.x = x;\
    \  \n  this.y = y;  \n  this.radius = radius;  \n  this.speed = speed;  \n  this.colour\
    \ = colour;  \n}\n```\n\n**代码清单8-8 Ghost构造函数**\n\n我们简单地将给定的参数存储为属性——不提供默认值。代码清单[8-9](#A455241_1_En_8_Chapter.xhtml#Par32)中的`Ghost.prototype.draw`方法也很熟悉。我们将上下文变换到正确的位置，并调用`draw_ghost`函数，根据需要传入颜色属性。将其复制到构造函数之后的`objects.js`文件中。\n\
    \n```javascript\nGhost.prototype.draw = function(ctx) {  \n  ctx.save();  \n \
    \ ctx.translate(this.x, this.y);  \n  draw_ghost(ctx, this.radius, {  \n    fill:\
    \ this.colour  \n  });  \n  ctx.restore();  \n}\n```\n\n**代码清单8-9 `Ghost.prototype.draw`方法**\n\
    \n代码清单[8-10](#A455241_1_En_8_Chapter.xhtml#Par34)中的`Ghost.prototype.update`方法定义了幽灵的行为。我们引入一个名为`target`的额外参数。该方法计算幽灵与目标之间的角度，然后设置`x_speed`和`y_speed`属性，使幽灵以给定速度向目标移动。然后更新幽灵坐标以反映速度。\n\
    \n```javascript\nGhost.prototype.update = function(target, elapsed) {  \n  var\
    \ angle = Math.atan2(target.y - this.y, target.x - this.x);  \n  var x_speed =\
    \ Math.cos(angle) * this.speed;  \n  var y_speed = Math.sin(angle) * this.speed;\
    \  \n  this.x += x_speed * elapsed;  \n  this.y += y_speed * elapsed;  \n}\n```\n\
    \n**代码清单8-10 `Ghost.prototype.update`方法**\n\n在全局作用域中实例化一个包含四个`Ghost`对象的数组。将它们的位置初始化为画布上的随机位置。在`draw`和`update`函数中遍历每个幽灵，并调用相应的幽灵方法。你应该会看到幽灵在画布上追逐Pac-Man，如图[8-3](#A455241_1_En_8_Chapter.xhtml#Fig3)所示。\n\
    \n![A455241_1_En_8_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_8_Fig3_HTML.jpg)\n\
    \n**图8-3 幽灵追逐Pac-Man**\n\n最终你应该得到类似代码清单[8-11](#A455241_1_En_8_Chapter.xhtml#Par37)所示的代码。\n\
    \n```html\n<!doctype html>  \n<html>  \n  <head>  \n    <title>Animation</title>\
    \  \n    <link rel=\"stylesheet\" href=\"styles.css\">  \n    <script src=\"drawing.js\"\
    ></script>  \n    <script src=\"objects.js\"></script>  \n  </head>  \n  <body>\
    \  \n    <h1>Animation</h1>  \n    <canvas id=\"pacman\" width=\"300\" height=\"\
    300\"></canvas>  \n    <script>  \n      let context = document.getElementById(\"\
    pacman\").getContext(\"2d\");  \n      let pacman = new PacMan(150, 150, 20, 120);\
    \  \n      let ghosts = [  \n        new Ghost(Math.random() * 300, Math.random()\
    \ * 300, 20, 70, 'red'),  \n        new Ghost(Math.random() * 300, Math.random()\
    \ * 300, 20, 60, 'pink'),  \n        new Ghost(Math.random() * 300, Math.random()\
    \ * 300, 20, 50, 'cyan'),  \n        new Ghost(Math.random() * 300, Math.random()\
    \ * 300, 20, 40, 'orange')  \n      ]  \n      function draw(ctx, guide) {  \n\
    \        pacman.draw(ctx);  \n        ghosts.forEach(function(ghost) {  \n   \
    \       ghost.draw(context, guide);  \n        });  \n      }  \n      function\
    \ update(elapsed) {  \n        pacman.update(elapsed, 300, 300);  \n        ghosts.forEach(function(ghost)\
    \ {  \n          ghost.update(pacman, elapsed);  \n        });  \n      }  \n\
    \      var previous, elapsed;  \n      function frame(timestamp) {  \n       \
    \ context.clearRect(0, 0, context.canvas.width, context.canvas.height);  \n  \
    \      if (!previous) previous = timestamp;  \n        elapsed = timestamp - previous;\
    \  \n        update(elapsed / 1000);  \n        draw(context, true);  \n     \
    \   previous = timestamp;  \n        window.requestAnimationFrame(frame);  \n\
    \      }  \n      window.requestAnimationFrame(frame);  \n    </script>  \n  </body>\
    \  \n</html>\n```\n\n**代码清单8-11 控制Pac-Man和幽灵**\n\n## 总结\n\n希望本章在一定程度上建立了清晰的模式。屏幕上需要的“东西”必须在每一帧中进行更新和绘制。我们可以通过定义带有构造函数的对象，并在对象原型上定义用于绘制和更新的方法，以非常有组织的方式做到这一点。这使得我们的全局`draw`和`update`函数非常简单——它们只需依次绘制和更新每个对象。练习够了！让我们继续开发我们的游戏。在下一章中，我们将继续为构建坚实的对象基础设施迈出几步。©\
    \ Graeme Stuart 2017 Graeme Stuart《Introducing JavaScript Game Development》[https://doi.org/10.1007/978-1-4842-3252-1_9](#A455241_1_En_9_Chapter.xhtml)\n\
    \n# 9. 继承\n\nGraeme Stuart^（1） （1）英国莱斯特郡Market Harborough\n\n在本章中，我们将开始构建Asteroids游戏的最终版本。我们需要对象来描述小行星和我们的飞船，最终还需要对象来描述我们的炮弹，飞船将使用这些炮弹来摧毁小行星。在这种情况下，这些对象将共享一些共同特性，这使得它们成为继承的良好候选。继承是面向对象软件工程中的一个重要概念，因为它允许将潜在的复杂逻辑表达一次，并在多个对象类型中复用。我们将以惯用的方式——通过实践来学习。"
  raw: 'The ghosts will move in a straight line directly towards Pac-Man. They will
    be different colors and have different speeds. They won’t need to wrap around
    the canvas because they’ll always be moving towards Pac-Man. Because Pac-Man wraps
    around the canvas, they turn around to follow him. Drawing Pac-Man ghosts is pretty
    tricky. Here is a basic approach. Copy Listing [8-7](#A455241_1_En_8_Chapter.xhtml#Par26)
    into drawing.js. function draw_ghost(ctx, radius, options) {   options = options
    || {}   var feet = options.feet || 4;   var head_radius = radius * 0.8;   var
    foot_radius = head_radius / feet;   ctx.save();   ctx.strokeStyle = options.stroke
    || "white";   ctx.fillStyle = options.fill || "red";   ctx.lineWidth = options.lineWidth
    || radius * 0.05;   ctx.beginPath();   for(foot = 0; foot < feet; foot++) {     ctx.arc(
          (2 * foot_radius * (feet - foot)) - head_radius - foot_radius,       radius
    - foot_radius,       foot_radius, 0, Math.PI      );   }   ctx.lineTo(-head_radius,
    radius - foot_radius);   ctx.arc(0, head_radius - radius, head_radius, Math.PI,
    2 * Math.PI);   ctx.closePath();   ctx.fill();   ctx.stroke();   ctx.restore();
    } Listing 8-7 Drawing a Ghost We draw a series of upside-down half-circles for
    the “feet,” draw a line up to the head, and draw another half-circle for the head.
    Then we close the path to finish. Working out the positioning of all this stuff
    is tricky, but once you have it, everything works and you can forget about it.
    Figure [8-2](#A455241_1_En_8_Chapter.xhtml#Fig2) shows a ghost with added eyes.
    ![A455241_1_En_8_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_8_Fig2_HTML.jpg) Figure
    8-2 A big red ghost with five “feet” Try adding eyes to your ghost. Filled black
    circles will do, but white circles with black circles inside them gives more character.
    For the Ghost constructor, we specify the radius, speed, and colour as arguments.
    Copy Listing [8-8](#A455241_1_En_8_Chapter.xhtml#Par30) into your objects.js file.
    function Ghost(x, y, radius, speed, colour) {   this.x = x;   this.y = y;   this.radius
    = radius;   this.speed = speed;   this.colour = colour; } Listing 8-8 Ghost Constructor
    We simply store the given arguments as properties—no default values are provided.
    The Ghost.prototype.draw method in Listing [8-9](#A455241_1_En_8_Chapter.xhtml#Par32)
    is again familiar. We transform the context to the correct location and call the
    draw_ghost function, passing in the colour attribute as required. Copy it into
    your objects.js file after the constructor. Ghost.prototype.draw = function(ctx)
    {   ctx.save();   ctx.translate(this.x, this.y);   draw_ghost(ctx, this.radius,
    {     fill: this.colour   });   ctx.restore(); } Listing 8-9 The Ghost. prototype.draw
    Method The Ghost.prototype.update method in Listing [8-10](#A455241_1_En_8_Chapter.xhtml#Par34)
    defines the ghost behavior. We take an extra argument called target. The method
    calculates the angle between the ghost and the target and then sets the x_speed
    and y_speed properties so the ghost moves towards the target at its given speed.
    The ghost coordinates are then updated to reflect the velocity. Ghost.prototype.update
    = function(target, elapsed) {   var angle = Math.atan2(target.y - this.y, target.x
    - this.x);   var x_speed = Math.cos(angle) * this.speed;   var y_speed = Math.sin(angle)
    * this.speed;   this.x += x_speed * elapsed;   this.y += y_speed * elapsed; }
    Listing 8-10 The Ghost. prototype.update Method Instantiate an array of four Ghost
    objects in the global scope. Initialize their positions to random locations on
    the canvas. Loop over each ghost in the draw and update functions and call the
    appropriate ghost method. You should see the ghosts chasing Pac-Man all over the
    canvas, as in Figure [8-3](#A455241_1_En_8_Chapter.xhtml#Fig3). ![A455241_1_En_8_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_8_Fig3_HTML.jpg)
    Figure 8-3 Ghosts chasing Pac-Man You should end up with something like the code
    shown in Listing [8-11](#A455241_1_En_8_Chapter.xhtml#Par37). <!doctype html>
    <html>   <head>     <title>Animation</title>     <link rel="stylesheet" href="styles.css">
        <script src="drawing.js"></script>     <script src="objects.js"></script>
      </head>   <body>     <h1>Animation</h1>     <canvas id="pacman" width="300"
    height="300"></canvas>     <script>       let context = document.getElementById("pacman").getContext("2d");
          let pacman = new PacMan(150, 150, 20, 120);       let ghosts = [         new
    Ghost(Math.random() * 300, Math.random() * 300, 20, 70, ''red''),         new
    Ghost(Math.random() * 300, Math.random() * 300, 20, 60, ''pink''),         new
    Ghost(Math.random() * 300, Math.random() * 300, 20, 50, ''cyan''),         new
    Ghost(Math.random() * 300, Math.random() * 300, 20, 40, ''orange'')       ]       function
    draw(ctx, guide) {         pacman.draw(ctx);         ghosts.forEach(function(ghost)
    {           ghost.draw(context, guide);         });       }       function update(elapsed)
    {         pacman.update(elapsed, 300, 300);         ghosts.forEach(function(ghost)
    {           ghost.update(pacman, elapsed);         });       }       var previous,
    elapsed;       function frame(timestamp) {         context.clearRect(0, 0, context.canvas.width,
    context.canvas.height);         if (!previous) previous = timestamp;         elapsed
    = timestamp - previous;         update(elapsed / 1000);         draw(context,
    true);         previous = timestamp;         window.requestAnimationFrame(frame);
          }       window.requestAnimationFrame(frame);     </script>   </body> </html>
    Listing 8-11 Control ling Pac-Man and Ghosts


    ## Summary


    Hopefully this chapter has gone some ways towards establishing a clear pattern
    here. The “things” we want on the screen must all be updated and drawn in every
    frame. We can do this in a very organized way by defining objects with constructors
    and defining methods on the object prototype for drawing and updating. This makes
    our global draw and update functions very straightforward—they simply draw and
    update each object in turn. Enough practice! Let’s get back to working on our
    game. In the next chapter, we’ll make another few steps towards building a solid
    infrastructure of objects.© Graeme Stuart 2017 Graeme StuartIntroducing JavaScript
    Game Development [https://doi.org/10.1007/978-1-4842-3252-1_9](#A455241_1_En_9_Chapter.xhtml)


    # 9. Inheritance


    Graeme Stuart^(1 ) (1) Market Harborough, Leicestershire, UK   In this chapter
    we’ll begin to build our final version of the Asteroids game. We’ll need objects
    to describe asteroids and our ship and we will eventually need objects for our
    projectiles too, which the ship will use to destroy asteroids. In this case, the
    objects will all share some common features, and this makes them good candidates
    for inheritance. Inheritance is an important concept in object-oriented software
    engineering because it allows for potentially complex logic to be expressed once
    and used across multiple object types. We’ll learn this in the usual way—by doing.'
  trans: "\n幽灵会沿着直线直接向 Pac-Man 移动。它们会有不同的颜色和不同的速度。它们不需要环绕画布，因为它们总是向 Pac-Man 移动。由于\
    \ Pac-Man 会环绕画布，它们会转身跟随他。绘制 Pac-Man 幽灵相当棘手。这里有一个基本方法。将代码清单 8-7 复制到`drawing.js`中。\n\
    \n```javascript\nfunction draw_ghost(ctx, radius, options) {  \n  options = options\
    \ || {}  \n  var feet = options.feet || 4;  \n  var head_radius = radius * 0.8;\
    \  \n  var foot_radius = head_radius / feet;  \n  ctx.save();  \n  ctx.strokeStyle\
    \ = options.stroke || \"white\";  \n  ctx.fillStyle = options.fill || \"red\"\
    ;  \n  ctx.lineWidth = options.lineWidth || radius * 0.05;  \n  ctx.beginPath();\
    \  \n  for(foot = 0; foot < feet; foot++) {  \n    ctx.arc(  \n      (2 * foot_radius\
    \ * (feet - foot)) - head_radius - foot_radius,  \n      radius - foot_radius,\
    \  \n      foot_radius, 0, Math.PI  \n     );  \n  }  \n  ctx.lineTo(-head_radius,\
    \ radius - foot_radius);  \n  ctx.arc(0, head_radius - radius, head_radius, Math.PI,\
    \ 2 * Math.PI);  \n  ctx.closePath();  \n  ctx.fill();  \n  ctx.stroke();  \n\
    \  ctx.restore();  \n}\n```\n\n**代码清单 8-7 绘制幽灵**\n\n我们绘制一系列倒置的半圆作为“脚”，然后绘制一条线连接到头部，再绘制另一个半圆作为头部。然后闭合路径完成绘制。计算所有这些元素的位置很棘手，但一旦完成，一切就能正常工作，你可以忘记它。图\
    \ 8-2 显示了一个带有眼睛的幽灵。\n\n![A455241_1_En_8_Fig2_HTML.jpg](img/A455241_1_En_8_Fig2_HTML.jpg)\n\
    \n**图 8-2 一个带有五个“脚”的大红色幽灵**\n\n尝试为你的幽灵添加眼睛。可以使用填充的黑色圆形，但用白色圆形内嵌黑色圆形会更有特色。对于`Ghost`构造函数，我们指定半径、速度和颜色作为参数。将代码清单\
    \ 8-8 复制到你的`objects.js`文件中。\n\n```javascript\nfunction Ghost(x, y, radius, speed,\
    \ colour) {  \n  this.x = x;  \n  this.y = y;  \n  this.radius = radius;  \n \
    \ this.speed = speed;  \n  this.colour = colour;  \n}\n```\n\n**代码清单 8-8 Ghost\
    \ 构造函数**\n\n我们简单地将给定的参数存储为属性——不提供默认值。代码清单 8-9 中的`Ghost.prototype.draw`方法也很熟悉。我们将上下文变换到正确的位置，并调用`draw_ghost`函数，根据需要传入颜色属性。将其复制到构造函数之后的`objects.js`文件中。\n\
    \n```javascript\nGhost.prototype.draw = function(ctx) {  \n  ctx.save();  \n \
    \ ctx.translate(this.x, this.y);  \n  draw_ghost(ctx, this.radius, {  \n    fill:\
    \ this.colour  \n  });  \n  ctx.restore();  \n}\n```\n\n**代码清单 8-9 `Ghost.prototype.draw`方法**\n\
    \n代码清单 8-10 中的`Ghost.prototype.update`方法定义了幽灵的行为。我们引入一个名为`target`的额外参数。该方法计算幽灵与目标之间的角度，然后设置`x_speed`和`y_speed`属性，使幽灵以给定速度向目标移动。然后更新幽灵坐标以反映速度。\n\
    \n```javascript\nGhost.prototype.update = function(target, elapsed) {  \n  var\
    \ angle = Math.atan2(target.y - this.y, target.x - this.x);  \n  var x_speed =\
    \ Math.cos(angle) * this.speed;  \n  var y_speed = Math.sin(angle) * this.speed;\
    \  \n  this.x += x_speed * elapsed;  \n  this.y += y_speed * elapsed;  \n}\n```\n\
    \n**代码清单 8-10 `Ghost.prototype.update`方法**\n\n在全局作用域中实例化一个包含四个`Ghost`对象的数组。将它们的位置初始化为画布上的随机位置。在`draw`和`update`函数中遍历每个幽灵，并调用相应的幽灵方法。你应该会看到幽灵在画布上追逐\
    \ Pac-Man，如图 8-3 所示。\n\n![A455241_1_En_8_Fig3_HTML.jpg](img/A455241_1_En_8_Fig3_HTML.jpg)\n\
    \n**图 8-3 幽灵追逐 Pac-Man**\n\n最终你应该得到类似代码清单 8-11 所示的代码。\n\n```html\n<!doctype html>\
    \  \n<html>  \n  <head>  \n    <title>Animation</title>  \n    <link rel=\"stylesheet\"\
    \ href=\"styles.css\">  \n    <script src=\"drawing.js\"></script>  \n    <script\
    \ src=\"objects.js\"></script>  \n  </head>  \n  <body>  \n    <h1>Animation</h1>\
    \  \n    <canvas id=\"pacman\" width=\"300\" height=\"300\"></canvas>  \n    <script>\
    \  \n      let context = document.getElementById(\"pacman\").getContext(\"2d\"\
    );  \n      let pacman = new PacMan(150, 150, 20, 120);  \n      let ghosts =\
    \ [  \n        new Ghost(Math.random() * 300, Math.random() * 300, 20, 70, 'red'),\
    \  \n        new Ghost(Math.random() * 300, Math.random() * 300, 20, 60, 'pink'),\
    \  \n        new Ghost(Math.random() * 300, Math.random() * 300, 20, 50, 'cyan'),\
    \  \n        new Ghost(Math.random() * 300, Math.random() * 300, 20, 40, 'orange')\
    \  \n      ]  \n      function draw(ctx, guide) {  \n        pacman.draw(ctx);\
    \  \n        ghosts.forEach(function(ghost) {  \n          ghost.draw(context,\
    \ guide);  \n        });  \n      }  \n      function update(elapsed) {  \n  \
    \      pacman.update(elapsed, 300, 300);  \n        ghosts.forEach(function(ghost)\
    \ {  \n          ghost.update(pacman, elapsed);  \n        });  \n      }  \n\
    \      var previous, elapsed;  \n      function frame(timestamp) {  \n       \
    \ context.clearRect(0, 0, context.canvas.width, context.canvas.height);  \n  \
    \      if (!previous) previous = timestamp;  \n        elapsed = timestamp - previous;\
    \  \n        update(elapsed / 1000);  \n        draw(context, true);  \n     \
    \   previous = timestamp;  \n        window.requestAnimationFrame(frame);  \n\
    \      }  \n      window.requestAnimationFrame(frame);  \n    </script>  \n  </body>\
    \  \n</html>\n```\n\n**代码清单 8-11 控制 Pac-Man 和幽灵**\n\n## 总结\n\n希望本章在一定程度上建立了清晰的模式。屏幕上需要的“东西”必须在每一帧中进行更新和绘制。我们可以通过定义带有构造函数的对象，并在对象原型上定义用于绘制和更新的方法，以非常有组织的方式做到这一点。这使得我们的全局`draw`和`update`函数非常简单——它们只需依次绘制和更新每个对象。练习够了！让我们继续开发我们的游戏。在下一章中，我们将继续为构建坚实的对象基础设施迈出几步。©\
    \ Graeme Stuart 2017 Graeme Stuart《Introducing JavaScript Game Development》`doi.org/10.1007/978-1-4842-3252-1_9`\n\
    \n# 9. 继承\n\nGraeme Stuart^（1） （1）英国莱斯特郡 Market Harborough\n\n在本章中，我们将开始构建 Asteroids\
    \ 游戏的最终版本。我们需要对象来描述小行星和我们的飞船，最终还需要对象来描述我们的炮弹，飞船将使用这些炮弹来摧毁小行星。在这种情况下，这些对象将共享一些共同特性，这使得它们成为继承的良好候选。继承是面向对象软件工程中的一个重要概念，因为它允许将潜在的复杂逻辑表达一次，并在多个对象类型中复用。我们将以惯用的方式——通过实践来学习。\n"
- fmt: "# Set Up a Template\n\nTo start, create a new folder called `exercise9`, copy\
    \ the library files and stylesheet into the new folder, and save the template\
    \ in Listing [9-1](#A455241_1_En_9_Chapter.xhtml#Par3) as `exercise9.html`. As\
    \ usual, we’ll reuse our `drawing.js` and `objects.js` libraries, where we place\
    \ our drawing code and object definitions respectively.\n\n```html\n<!doctype\
    \ html>\n<html>\n  <head>\n    <title>Inheritance</title>\n    <link rel=\"stylesheet\"\
    \ href=\"styles.css\">\n    <script src=\"drawing.js\"></script>\n    <script\
    \ src=\"objects.js\"></script>\n  </head>\n  <body>\n    <h1>Inheritance</h1>\n\
    \    <canvas id=\"asteroids\" width=\"600\" height=\"600\"></canvas>\n    <script>\n\
    \      'use strict';\n      var context = document.getElementById(\"asteroids\"\
    ).getContext(\"2d\");\n      function draw(ctx) {\n        draw_grid(context);\n\
    \      }\n      function update(elapsed) {\n      }\n      var previous;\n   \
    \   function frame(timestamp) {\n        if (!previous) previous = timestamp;\n\
    \        var elapsed = timestamp - previous;\n        context.clearRect(0, 0,\
    \ context.canvas.width, context.canvas.height);\n        update(elapsed/1000);\n\
    \        draw(context);\n        previous = timestamp;\n        window.requestAnimationFrame(frame);\n\
    \      }\n      window.requestAnimationFrame(frame);\n    </script>\n  </body>\n\
    </html>\n```\n\nListing 9-1 `exercise9.html` The result should be a blank grid.\
    \ We’ve increased the size of the grid to accommodate our game. Note that the\
    \ animation is drawing a frame 60 times per second, it’s just that the frame is\
    \ the same each time.\n\n## Newton’s Laws of Motion\n\nAny attempt to produce\
    \ a model of objects floating in space should comply with all three basic laws\
    \ of classical mechanics:\n\n1. A mass in space will keep going with the same\
    \ velocity unless a force acts upon it.\n2. The force applied to an object is\
    \ equal to the mass of the object multiplied by the resultant acceleration.\n\
    3. When one mass pushes another, it will be pushed back with equal and opposite\
    \ force.\n\nWhen we created our `Asteroid` object, we coded its behavior in line\
    \ with Newton’s first law. The `Asteroid` instances store their velocity and simply\
    \ keep moving at that velocity. With no forces acting upon them, this is what\
    \ asteroids do. In our game, we’re piloting a ship floating in space. The ship\
    \ will also need to be coded to obey Newton’s first law. In fact, everything in\
    \ the game (unless we’ve implemented some kind of laser, which you’re welcome\
    \ to try) should comply with all three basic laws of classical mechanics.\n\n\
    ## A General-Purpose Mass Class"
