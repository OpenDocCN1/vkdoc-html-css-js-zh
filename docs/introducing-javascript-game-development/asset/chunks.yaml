    context.canvas.height,     2000 + Math.random() * 8000   );   asteroid.push(Math.random()
    * 2 * Math.PI, 2000, 60);   asteroid.twist((Math.random()-0.5) * 500, 60);   asteroids.push(asteroid);
    } var ship = new Ship(context.canvas.width / 2, context.canvas.height / 2); Listing
    9-13 Set Up a Simple Scene We now have a set of asteroids, each of which has been
    given a push and a twist to get them started. We also have a ship in the middle
