    To start, create a new folder called exercise9, copy the library files and stylesheet
    into the new folder, and save the template in Listing [9-1](#A455241_1_En_9_Chapter.xhtml#Par3)
    as exercise9.html. As usual, we’ll reuse our drawing.js and objects.js libraries,
    where we place our drawing code and object definitions respectively. <!doctype
    html> <html>   <head>     <title>Inheritance</title>     <link rel="stylesheet"
    href="styles.css">     <script src="drawing.js"></script>     <script src="objects.js"></script>
      </head>   <body>     <h1>Inheritance</h1>     <canvas id="asteroids" width="600"
    height="600"></canvas>     <script>       ''use strict'';       var context =
    document.getElementById("asteroids").getContext("2d");       function draw(ctx)
    {         draw_grid(context);       }       function update(elapsed) {       }
          var previous;       function frame(timestamp) {         if (!previous) previous
    = timestamp;         var elapsed = timestamp - previous;         context.clearRect(0,
    0, context.canvas.width, context.canvas.height);         update(elapsed/1000);
            draw(context);         previous = timestamp;         window.requestAnimationFrame(frame);
          }       window.requestAnimationFrame(frame);     </script>   </body> </html>
    Listing 9-1 exercise9.html The result should be a blank grid . We’ve increased
    the size of the grid to accommodate our game. Note that the animation is drawing
    a frame 60 times per second, it’s just that the frame is the same each time.


    ## Newton’s Laws of Motion


    Any attempt to produce a model of objects floating in space should comply with
    all three basic laws of classical mechanics:


    1.  1. A mass in space will keep going with the same velocity unless a force acts
    upon it.  

    2.  2. The force applied to an object is equal to the mass of the object multiplied
    by the resultant acceleration.  

    3.  3. When one mass pushes another, it will be pushed back with equal and opposite
    force.  


    When we created our Asteroid object, we coded its behavior in line with Newton’s
    first law. The Asteroid instances store their velocity and simply keep moving
    at that velocity. With no forces acting upon them, this is what asteroids do.
    In our game, we’re piloting a ship floating in space. The ship will also need
    to be coded to obey Newton’s first law. In fact, everything in the game (unless
    we’ve implemented some kind of laser, which you’re welcome to try) should comply
    with all three basic laws of classical mechanics.


    ## A General-Purpose Mass Class'
  trans: "\n# 设置模板\n\n首先，创建一个名为 `exercise9` 的新文件夹，将库文件和样式表复制到该文件夹中，并将清单 9-1 中的模板保存为\
    \ `exercise9.html`。和往常一样，我们将复用 `drawing.js` 和 `objects.js` 这两个库，分别用于存放绘图代码和对象定义。\n\
    \n```html\n<!doctype html>\n<html>\n  <head>\n    <title>继承</title>\n    <link\
    \ rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"></script>\n\
    \    <script src=\"objects.js\"></script>\n  </head>\n  <body>\n    <h1>继承</h1>\n\
    \    <canvas id=\"asteroids\" width=\"600\" height=\"600\"></canvas>\n    <script>\n\
    \      'use strict';\n      var context = document.getElementById(\"asteroids\"\
    ).getContext(\"2d\");\n      function draw(ctx) {\n        draw_grid(context);\n\
    \      }\n      function update(elapsed) {\n      }\n      var previous;\n   \
    \   function frame(timestamp) {\n        if (!previous) previous = timestamp;\n\
    \        var elapsed = timestamp - previous;\n        context.clearRect(0, 0,\
    \ context.canvas.width, context.canvas.height);\n        update(elapsed/1000);\n\
    \        draw(context);\n        previous = timestamp;\n        window.requestAnimationFrame(frame);\n\
    \      }\n      window.requestAnimationFrame(frame);\n    </script>\n  </body>\n\
    </html>\n```\n\n清单 9-1 `exercise9.html` 结果应该是一个空白网格。我们增加了网格的尺寸以适配游戏。请注意，动画每秒绘制\
    \ 60 帧，只是每一帧的内容都相同。\n\n## 牛顿运动定律\n\n任何试图构建太空中漂浮物体模型的尝试，都应符合经典力学的三条基本定律：\n\n1.\
    \ 除非受到外力作用，否则空间中物体的速度将保持不变。\n2. 物体所受的力等于其质量乘以由此产生的加速度。\n3. 当一个物体推动另一个物体时，它也会受到大小相等、方向相反的反作用力。\n\
    \n在创建 `Asteroid` 对象时，我们按照牛顿第一定律对其行为进行了编码。`Asteroid` 实例存储了它们的速度，并简单地以该速度持续运动。由于没有外力作用，这正是小行星的行为方式。在我们的游戏中，玩家操控的是一艘漂浮在太空中的飞船。飞船的编码也需要遵循牛顿第一定律。事实上，游戏中的所有元素（除非你实现了某种激光，欢迎尝试）都应符合经典力学的这三条基本定律。\n\
    \n## 通用质量类\n"
- fmt: "# Encoding Classical Mechanics into a `Mass` Class\n\nIn this exercise we’ll\
    \ encode the laws of classical mechanics into a general-purpose `Mass` class and\
    \ extend this `Mass` class to produce our `Asteroid` and `Ship` classes.\n\nThe\
    \ basic `Mass` class stores a position (`x` and `y` coordinates) and a velocity\
    \ (`x_speed` and `y_speed`). It also has an `angle` and a `rotation_speed`. Add\
    \ the constructor shown in Listing [9-2](#A455241_1_En_9_Chapter.xhtml#Par11)\
    \ to your `objects.js` file.\n\n```\nfunction Mass(x, y, mass, radius, angle,\
    \ x_speed, y_speed, rotation_speed) {\n  this.x = x;\n  this.y = y;\n  this.mass\
    \ = mass || 1;\n  this.radius = radius || 50;\n  this.angle = angle || 0;\n  this.x_speed\
    \ = x_speed || 0;\n  this.y_speed = y_speed || 0;\n  this.rotation_speed = rotation_speed\
    \ || 0;\n}\n```\n\nThe list of arguments is long because we don’t want any complex\
    \ default behavior. All the parameters are required for a mass to properly operate.\
    \ Default values are provided for most parameters, but in typical usage they’re\
    \ not likely to be relied upon. They have sensible default values of 0 in most\
    \ cases, so the mass is stationary by default. A mass value of 1 and a radius\
    \ of 50 is also provided by default. The (`x`, `y`) coordinates are required arguments\
    \ because otherwise the `Mass` object will be located at the canvas origin, which\
    \ is confusing.\n\nThe `update` method in Listing [9-3](#A455241_1_En_9_Chapter.xhtml#Par14)\
    \ is responsible for enforcing Newton’s first law. We also use it to wrap the\
    \ `Mass` around the canvas if it moves off the canvas edge. Copy it under your\
    \ constructor.\n\n```\nMass.prototype.update = function(elapsed, ctx) {\n  this.x\
    \ += this.x_speed * elapsed;\n  this.y += this.y_speed * elapsed;\n  this.angle\
    \ += this.rotation_speed * elapsed;\n  this.angle %= (2 * Math.PI);\n  if(this.x\
    \ - this.radius > ctx.canvas.width) {\n    this.x = -this.radius;\n  }\n  if(this.x\
    \ + this.radius < 0) {\n    this.x = ctx.canvas.width + this.radius;\n  }\n  if(this.y\
    \ - this.radius > ctx.canvas.height) {\n    this.y = -this.radius;\n  }\n  if(this.y\
    \ + this.radius < 0) {\n    this.y = ctx.canvas.height + this.radius;\n  }\n}\n\
    ```\n\nThis should be a familiar pattern because it’s much like the `update` function\
    \ of the original asteroid. One difference is that this time we take the context\
    \ as an argument because this code now sits in the `objects.js` library and has\
    \ (or should have) no knowledge of the canvas or context in our main scope.\n\n\
    We implement Newton’s second law with the simple `Mass.prototype.push` method\
    \ shown in Listing [9-4](#A455241_1_En_9_Chapter.xhtml#Par17). Calling this method\
    \ with an angle, a force, and an elapsed time will apply the force to the mass,\
    \ causing acceleration that is inversely proportional to the mass. Add it to your\
    \ library.\n\n```\nMass.prototype.push = function(angle, force, elapsed) {\n \
    \ this.x_speed += elapsed * (Math.cos(angle) * force) / this.mass;\n  this.y_speed\
    \ += elapsed * (Math.sin(angle) * force) / this.mass;\n}\n```\n\nThe very similar\
    \ `Mass.prototype.twist` method shown in Listing [9-5](#A455241_1_En_9_Chapter.xhtml#Par19)\
    \ does the same thing for angles. Positive forces rotate the mass clockwise, and\
    \ negative forces rotate the mass counterclockwise. Again, add it to your growing\
    \ code base.\n\n```\nMass.prototype.twist = function(force, elapsed) {\n  this.rotation_speed\
    \ += elapsed * force / this.mass;\n}\n```\n\nWe’ll also add the pair of methods\
    \ shown in Listing [9-6](#A455241_1_En_9_Chapter.xhtml#Par21). These calculate\
    \ the speed and angle of movement of a `Mass` and will be useful later.\n\n```\n\
    Mass.prototype.speed = function() {\n  return Math.sqrt(Math.pow(this.x_speed,\
    \ 2) + Math.pow(this.y_speed, 2));\n}\n\nMass.prototype.movement_angle = function()\
    \ {\n  return Math.atan2(this.y_speed, this.x_speed);\n}\n```\n\nTo test out our\
    \ parent `Mass` class, we need a `draw` method. This will be overridden in any\
    \ child classes. Add the method in Listing [9-7](#A455241_1_En_9_Chapter.xhtml#Par23).\n\
    \n```\nMass.prototype.draw = function(c) {\n  c.save();\n  c.translate(this.x,\
    \ this.y);\n  c.rotate(this.angle);\n  c.beginPath();\n  c.arc(0, 0, this.radius,\
    \ 0, 2 * Math.PI);\n  c.lineTo(0, 0);\n  c.strokeStyle = \"#FFFFFF\";\n  c.stroke();\n\
    \  c.restore();\n}\n```\n\nWe simply draw a circle and a line to the center to\
    \ indicate the position, radius, and angle of the `Mass`. To test this out, instantiate\
    \ a `Mass` object and define the global `update` and `draw` functions to drive\
    \ your mass. Follow the code in Listing [9-8](#A455241_1_En_9_Chapter.xhtml#Par25).\n\
    \n```\nvar mass = new Mass(context.canvas.width/2, context.canvas.height/2, 10,\
    \ 20);\n\nfunction draw() {\n  context.clearRect(0, 0, context.canvas.width, context.canvas.height);\n\
    \  draw_grid(context);\n  mass.draw(context);\n}\n\nfunction update(elapsed) {\n\
    \  mass.update(elapsed, context);\n}\n```\n\nRefreshing your browser displays\
    \ our `Mass` object sitting static in the middle of the canvas, as shown in Figure\
    \ [9-1](#A455241_1_En_9_Chapter.xhtml#Fig1). It has 0 (zero) `x_speed`, `y_speed`,\
    \ and `rotation_speed`, so it’s not moving. When we call our object functions\
    \ from the global `update` and `draw` methods, we’re linking the objects into\
    \ the game loop. We will sometimes refer to this job of linking objects into the\
    \ game as plumbing code or hooking up the objects.\n\n![A455241_1_En_9_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_9_Fig1_HTML.jpg)\n\
    \nOpen your browser’s developer tools (press F12 in Google Chrome) and navigate\
    \ to the JavaScript console, which enables you to interact with the web page.\
    \ In this case, because we’re defining our variables in the global scope, we can\
    \ access them and call methods directly. Type `mass` into the console, and you\
    \ should see the `mass` variable printed out. Try typing `mass.twist(Math.PI,\
    \ 10)`. This applies a twisting force, and we see the mass rotate. Calling the\
    \ method again accelerates the rotation. The same applies to calling `mass.push(0.75\
    \ * Math.PI, 10, 10)`. The mass is accelerated by the push. Experiment with this\
    \ on the command line for a bit. Contemplate the fact that you can define any\
    \ method you like and have ultimate power over your own canvas game.\n\n## A Simple\
    \ Approach to Inheritance\n\nIn order for our `Asteroid` class to inherit the\
    \ behavior of a `Mass`, we’ll need to manipulate the object prototypes. Place\
    \ the function shown in Listing [9-9](#A455241_1_En_9_Chapter.xhtml#Par30) at\
    \ the top of `objects.js`, above your `Mass` constructor.\n\n```\nfunction extend(ChildClass,\
    \ ParentClass) {\n  var parent = new ParentClass();\n  ChildClass.prototype =\
    \ parent;\n  ChildClass.prototype.super = parent.constructor;\n  ChildClass.prototype.constructor\
    \ = ChildClass;\n}\n```\n\nThis function emulates classes and implements a simple\
    \ inheritance mechanism. To extend a child class with the properties and methods\
    \ of a parent class, simply call this function with the two class objects. The\
    \ first line of the function creates an instance of the parent class. The child\
    \ class prototype is replaced with this instance. The third line sorts out a way\
    \ to call the parent constructor from within the child constructor. Finally, the\
    \ constructor of the child class prototype (which is the parent class instance)\
    \ is set back to the child class. This prototype manipulation allows for a child\
    \ class constructor to pass parameters to the parent constructor via the `super`\
    \ method. It doesn’t handle any extra methods added to the prototype. If these\
    \ need to call the parent implementation, they need to do it manually, as we’ll\
    \ see later."
  raw: 'In this exercise we’ll encode the laws of classical mechanics into a general-purpose
    Mass class and extend this Mass class to produce our Asteroid and Ship classes.
    The basic Mass class stores a position (x and y coordinates) and a velocity (x_speed
    and y_speed). It also has an angle and a rotation_speed. Add the constructor shown
    in Listing [9-2](#A455241_1_En_9_Chapter.xhtml#Par11) to your objects.js file.
    function Mass(x, y, mass, radius, angle, x_speed, y_speed, rotation_speed) {   this.x
    = x;   this.y = y;   this.mass = mass || 1;   this.radius = radius || 50;   this.angle
    = angle || 0;   this.x_speed = x_speed || 0;   this.y_speed = y_speed || 0;   this.rotation_speed
    = rotation_speed || 0; } Listing 9-2 The Mass Constructor The list of arguments
    is long because we don’t want any complex default behavior. All the parameters
    are required for a mass to properly operate. Default values are provided for most
    parameters, but in typical usage they’re not likely to be relied upon. They have
    sensible default values of 0 in most cases, so the mass is stationary by default.
    A mass value of 1 and a radius of 50 is also provided by default. The (x, y) coordinates
    are required arguments because otherwise the Mass object will be located at the
    canvas origin, which is confusing. The update method in Listing [9-3](#A455241_1_En_9_Chapter.xhtml#Par14)
    is responsible for enforcing Newton’s first law. We also use it to wrap the Mass
    around the canvas if it moves off the canvas edge. Copy it under your constructor.
    Mass.prototype.update = function(elapsed, ctx) {   this.x += this.x_speed * elapsed;
      this.y += this.y_speed * elapsed;   this.angle += this.rotation_speed * elapsed;
      this.angle %= (2 * Math.PI);   if(this.x - this.radius > ctx.canvas.width) {
        this.x = -this.radius;   }   if(this.x + this.radius < 0) {     this.x = ctx.canvas.width
    + this.radius;   }   if(this.y - this.radius > ctx.canvas.height) {     this.y
    = -this.radius;   }   if(this.y + this.radius < 0) {     this.y = ctx.canvas.height
    + this.radius;   } } Listing 9-3 The Mass.prototype.update Method This should
    be a familiar pattern because it’s much like the update function of the original
    asteroid. One difference is that this time we take the context as an argument
    because this code now sits in the objects.js library and has (or should have)
    no knowledge of the canvas or context in our main scope. We implement Newton’s
    second law with the simple Mass.prototype. push method shown in Listing [9-4](#A455241_1_En_9_Chapter.xhtml#Par17).
    Calling this method with an angle, a force, and an elapsed time will apply the
    force to the mass, causing acceleration that is inversely proportional to the
    mass. Add it to your library. Mass.prototype.push = function(angle, force, elapsed)
    {   this.x_speed += elapsed * (Math.cos(angle) * force) / this.mass;   this.y_speed
    += elapsed * (Math.sin(angle) * force) / this.mass; } Listing 9-4 The Mass.prototype.push
    Method The very similar Mass.prototype.twist method shown in Listing [9-5](#A455241_1_En_9_Chapter.xhtml#Par19)
    does the same thing for angles. Positive forces rotate the mass clockwise, and
    negative forces rotate the mass counterclockwise. Again, add it to your growing
    code base. Mass.prototype.twist = function(force, elapsed) {   this.rotation_speed
    += elapsed * force / this.mass; } Listing 9-5 The Mass.prototype. twist Method
    We’ll also add the pair of methods shown in Listing [9-6](#A455241_1_En_9_Chapter.xhtml#Par21).
    These calculate the speed and angle of movement of a Mass and will be useful later.
    Mass.prototype.speed = function() {   return Math.sqrt(Math.pow(this.x_speed,
    2) + Math.pow(this.y_speed, 2)); } Mass.prototype.movement_angle = function()
    {   return Math.atan2(this.y_speed, this.x_speed); } Listing 9-6 Other Useful
    Methods To test out our parent Mass class, we need a draw method. This will be
    overridden in any child classes. Add the method in Listing [9-7](#A455241_1_En_9_Chapter.xhtml#Par23).
    Mass.prototype.draw = function(c) {   c.save();   c.translate(this.x, this.y);
      c.rotate(this.angle);   c.beginPath();   c.arc(0, 0, this.radius, 0, 2 * Math.PI);
      c.lineTo(0, 0);   c.strokeStyle = "#FFFFFF";   c.stroke();   c.restore(); }
    Listing 9-7 A Placeholder Mass.prototype. draw Method We simply draw a circle
    and a line to the center to indicate the position, radius, and angle of the Mass.
    To test this out, instantiate a Mass object and define the global update and draw
    functions to drive your mass. Follow the code in Listing [9-8](#A455241_1_En_9_Chapter.xhtml#Par25).
    var mass = new Mass(context.canvas.width/2, context.canvas.height/2, 10, 20);
    function draw() {   context.clearRect(0, 0, context.canvas.width, context.canvas.height);
      draw_grid(context);   mass.draw(context); } function update(elapsed) {   mass.update(elapsed,
    context); } Listing 9-8 A Simple Test Refreshing your browser displays our Mass
    object sitting static in the middle of the canvas, as shown in Figure [9-1](#A455241_1_En_9_Chapter.xhtml#Fig1).
    It has 0 (zero) x_speed, y_speed, and rotation_speed, so it’s not moving. When
    we call our object functions from the global update and draw methods, we’re linking
    the objects into the game loop. We will sometimes refer to this job of linking
    objects into the game as plumbing code or hooking up the objects. ![A455241_1_En_9_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_9_Fig1_HTML.jpg)
    Figure 9-1 An abstract mass rendered as a circle with a line Open your browser’s
    developer tools (press F12 in Google Chrome) and navigate to the JavaScript console,
    which enables you to interact with the web page. In this case, because we’re defining
    our variables in the global scope, we can access them and call methods directly.
    Type mass into the console, and you should see the mass variable printed out.
    Try typing mass.twist(Math.PI, 10). This applies a twisting force, and we see
    the mass rotate. Calling the method again accelerates the rotation. The same applies
    to calling mass.push(0.75 * Math.PI, 10, 10). The mass is accelerated by the push.
    Experiment with this on the command line for a bit. Contemplate the fact that
    you can define any method you like and have ultimate power over your own canvas
    game.


    ## A Simple Approach to Inheritance


    In order for our Asteroid class to inherit the behavior of a Mass, we’ll need
    to manipulate the object prototypes. Place the function shown in Listing [9-9](#A455241_1_En_9_Chapter.xhtml#Par30)
    at the top of objects.js, above your Mass constructor. function extend(ChildClass,
    ParentClass) {   var parent = new ParentClass();   ChildClass.prototype = parent;
      ChildClass.prototype.super = parent.constructor;   ChildClass.prototype.constructor
    = ChildClass; } Listing 9-9 The extend Method This function emulates classes and
    implements a simple inheritance mechanism. To extend a child class with the properties
    and methods of a parent class, simply call this function with the two class objects.
    The first line of the function creates an instance of the parent class. The child
    class prototype is replaced with this instance. The third line sorts out a way
    to call the parent constructor from within the child constructor. Finally, the
    constructor of the child class prototype (which is the parent class instance)
    is set back to the child class. This prototype manipulation allows for a child
    class constructor to pass parameters to the parent constructor via the super method.
    It doesn’t handle any extra methods added to the prototype. If these need to call
    the parent implementation, they need to do it manually, as we’ll see later.'
  trans: "\n# 将经典力学编码到 `Mass` 类中\n\n在本练习中，我们将把经典力学定律编码到一个通用 `Mass` 类中，并扩展该 `Mass`\
    \ 类，以创建我们的 `Asteroid`（小行星）和 `Ship`（飞船）类。\n\n基础 `Mass` 类存储位置（`x` 和 `y` 坐标）以及速度（`x_speed`\
    \ 和 `y_speed`）。它还包含一个角度（`angle`）和一个旋转速度（`rotation_speed`）。将清单 9-2 所示的构造函数添加到你的\
    \ `objects.js` 文件中。\n\n```\nfunction Mass(x, y, mass, radius, angle, x_speed,\
    \ y_speed, rotation_speed) {\n  this.x = x;\n  this.y = y;\n  this.mass = mass\
    \ || 1;\n  this.radius = radius || 50;\n  this.angle = angle || 0;\n  this.x_speed\
    \ = x_speed || 0;\n  this.y_speed = y_speed || 0;\n  this.rotation_speed = rotation_speed\
    \ || 0;\n}\n```\n\n参数列表很长，因为我们不希望有复杂的默认行为。一个质量体需要所有这些参数才能正常运行。虽然为大多数参数提供了默认值，但在典型使用中，这些默认值不太可能被依赖。在大多数情况下，它们具有合理的默认值\
    \ 0，因此质量体默认是静止的。默认质量值为 1，半径为 50。`(x, y)` 坐标是必需的参数，否则 `Mass` 对象将位于画布原点，这会造成混淆。\n\
    \n清单 9-3 中的 `update` 方法负责执行牛顿第一定律。我们还用它来在质量体移动出画布边缘时将其回绕到画布中。将此方法复制到你的构造函数下方。\n\
    \n```\nMass.prototype.update = function(elapsed, ctx) {\n  this.x += this.x_speed\
    \ * elapsed;\n  this.y += this.y_speed * elapsed;\n  this.angle += this.rotation_speed\
    \ * elapsed;\n  this.angle %= (2 * Math.PI);\n  if(this.x - this.radius > ctx.canvas.width)\
    \ {\n    this.x = -this.radius;\n  }\n  if(this.x + this.radius < 0) {\n    this.x\
    \ = ctx.canvas.width + this.radius;\n  }\n  if(this.y - this.radius > ctx.canvas.height)\
    \ {\n    this.y = -this.radius;\n  }\n  if(this.y + this.radius < 0) {\n    this.y\
    \ = ctx.canvas.height + this.radius;\n  }\n}\n```\n\n这应该是一种熟悉的模式，因为它与原始小行星的 `update`\
    \ 函数非常相似。一个区别是，这次我们将上下文（context）作为参数，因为这段代码现在位于 `objects.js` 库中，并且（或者应该）不了解我们主作用域中的画布或上下文。\n\
    \n我们通过清单 9-4 中简单的 `Mass.prototype.push` 方法来实现牛顿第二定律。用角度、力和经过的时间调用此方法，会将力应用于质量体，产生与质量成反比的加速度。将其添加到你的库中。\n\
    \n```\nMass.prototype.push = function(angle, force, elapsed) {\n  this.x_speed\
    \ += elapsed * (Math.cos(angle) * force) / this.mass;\n  this.y_speed += elapsed\
    \ * (Math.sin(angle) * force) / this.mass;\n}\n```\n\n清单 9-5 中非常相似的 `Mass.prototype.twist`\
    \ 方法对角度执行相同的操作。正力使质量体顺时针旋转，负力使质量体逆时针旋转。同样，将其添加到你不断增长的代码库中。\n\n```\nMass.prototype.twist\
    \ = function(force, elapsed) {\n  this.rotation_speed += elapsed * force / this.mass;\n\
    }\n```\n\n我们还将添加清单 9-6 中所示的一对方法。这些方法计算 `Mass` 的速度和运动角度，之后会很有用。\n\n```\nMass.prototype.speed\
    \ = function() {\n  return Math.sqrt(Math.pow(this.x_speed, 2) + Math.pow(this.y_speed,\
    \ 2));\n}\n\nMass.prototype.movement_angle = function() {\n  return Math.atan2(this.y_speed,\
    \ this.x_speed);\n}\n```\n\n为了测试我们的父类 `Mass`，我们需要一个 `draw` 方法。该方法会在任何子类中被重写。添加清单\
    \ 9-7 中的方法。\n\n```\nMass.prototype.draw = function(c) {\n  c.save();\n  c.translate(this.x,\
    \ this.y);\n  c.rotate(this.angle);\n  c.beginPath();\n  c.arc(0, 0, this.radius,\
    \ 0, 2 * Math.PI);\n  c.lineTo(0, 0);\n  c.strokeStyle = \"#FFFFFF\";\n  c.stroke();\n\
    \  c.restore();\n}\n```\n\n我们简单地绘制一个圆和一条指向圆心的线，以指示 `Mass` 的位置、半径和角度。要测试这一点，实例化一个\
    \ `Mass` 对象，并定义全局的 `update` 和 `draw` 函数来驱动你的质量体。遵循清单 9-8 中的代码。\n\n```\nvar mass\
    \ = new Mass(context.canvas.width/2, context.canvas.height/2, 10, 20);\n\nfunction\
    \ draw() {\n  context.clearRect(0, 0, context.canvas.width, context.canvas.height);\n\
    \  draw_grid(context);\n  mass.draw(context);\n}\n\nfunction update(elapsed) {\n\
    \  mass.update(elapsed, context);\n}\n```\n\n刷新浏览器会显示我们的 `Mass` 对象静静地停留在画布中央，如图\
    \ 9-1 所示。它的 `x_speed`、`y_speed` 和 `rotation_speed` 均为 0（零），因此不会移动。当我们在全局的 `update`\
    \ 和 `draw` 方法中调用对象函数时，我们就将这些对象链接到了游戏循环中。我们有时会将这种将对象链接到游戏的工作称为管道代码或挂接对象。\n\n![A455241_1_En_9_Fig1_HTML.jpg](img/A455241_1_En_9_Fig1_HTML.jpg)\n\
    \n打开浏览器的开发者工具（在 Google Chrome 中按 F12），然后导航至 JavaScript 控制台，这使你可以与网页进行交互。在本例中，因为我们在全局作用域中定义变量，所以可以直接访问它们并调用方法。在控制台中输入\
    \ `mass`，你应该会看到打印出的 `mass` 变量。试着输入 `mass.twist(Math.PI, 10)`。这会施加一个扭转力，我们会看到质量体旋转。再次调用该方法会加速旋转。调用\
    \ `mass.push(0.75 * Math.PI, 10, 10)` 也是如此。质量体因推力而加速。在命令行上对此进行一些实验。思考一下，你可以定义任何你喜欢的方法，并对自己画布游戏拥有终极控制权。\n\
    \n## 一种简单的继承方法\n\n为了让我们的 `Asteroid` 类继承 `Mass` 的行为，我们需要操作对象原型。将清单 9-9 所示的函数放置在\
    \ `objects.js` 的顶部，位于 `Mass` 构造函数之前。\n\n```\nfunction extend(ChildClass, ParentClass)\
    \ {\n  var parent = new ParentClass();\n  ChildClass.prototype = parent;\n  ChildClass.prototype.super\
    \ = parent.constructor;\n  ChildClass.prototype.constructor = ChildClass;\n}\n\
    ```\n\n该函数模拟类并实现了一种简单的继承机制。要使用父类的属性和方法扩展子类，只需用两个类对象调用此函数即可。函数的第一行创建了父类的一个实例。子类的原型被替换为该实例。第三行提供了一种从子类构造函数内调用父类构造函数的方法。最后，子类原型的构造函数（即父类实例）被设置回子类。这种原型操作允许子类构造函数通过\
    \ `super` 方法将参数传递给父类构造函数。它不处理任何添加到原型上的额外方法。如果这些方法需要调用父类实现，则需要手动进行，我们稍后会看到这一点。\n"
- fmt: "# Asteroids\n\nListing [9-10](#A455241_1_En_9_Chapter.xhtml#Par33) shows how\
    \ we create the `Asteroid` class as an extension of the `Mass` class. Replace\
    \ the existing `Asteroid` definition in your `object.js` library with Listing\
    \ [9-10](#A455241_1_En_9_Chapter.xhtml#Par33).\n\n```\nfunction Asteroid(mass,\
    \ x, y, x_speed, y_speed, rotation_speed) {\n  var density = 1; // kg per square\
    \ pixel\n  var radius = Math.sqrt((mass / density) / Math.PI);\n  this.super(mass,\
    \ radius, x, y, 0, x_speed, y_speed, rotation_speed);\n  this.circumference =\
    \ 2 * Math.PI * this.radius;\n  this.segments = Math.ceil(this.circumference /\
    \ 15);\n  this.segments = Math.min(25, Math.max(5, this.segments));\n  this.noise\
    \ = 0.2;\n  this.shape = [];\n  for(var i = 0; i < this.segments; i++) {\n   \
    \ this.shape.push(2 * (Math.random() - 0.5));\n  }\n}\nextend(Asteroid, Mass);\n\
    \nAsteroid.prototype.draw = function(ctx, guide) {\n  ctx.save();\n  ctx.translate(this.x,\
    \ this.y);\n  ctx.rotate(this.angle);\n  draw_asteroid(ctx, this.radius, this.shape,\
    \ {\n    noise: this.noise,\n    guide: guide\n  });\n  ctx.restore();\n}\n```\n\
    \nListing 9-10 The Asteroid Class\n\nThe `Asteroid` constructor is much the same\
    \ as our previous example, with a few minor enhancements. It takes six arguments,\
    \ the most important being the mass and the `(x, y)` coordinates. We also allow\
    \ for the velocity and rotation speed to be set, which we’ll use later when we\
    \ split asteroids.\n\nInternally, the asteroid calculates a radius value from\
    \ the given mass based on a fixed density value. If you want larger or smaller\
    \ asteroids, tweaking the density value is the way to do it. We then call `this.super`,\
    \ which we can see from the `extend` function is a reference to the parent class\
    \ constructor, `Mass`. By calling this, we set the mass, radius, x, y, angle,\
    \ x_speed, y_speed, and rotation_speed properties of our object.\n\nThe final\
    \ steps are to set the asteroid shape. To do this, we first calculate the circumference\
    \ and use this to set the number of segments so that larger asteroids have more\
    \ detail. We make sure the number of segments is at least 5 and no more than 25.\
    \ We set the noise to 0.2 and set the random shape as before.\n\nAfter we define\
    \ the constructor, we call the `extend` function and pass in the child class,\
    \ `Asteroid`, and the parent class, `Mass`. This is what sets `Asteroid.super`\
    \ to the `Mass` constructor — and, critically, it sets the `Asteroid.prototype`\
    \ to an instance of `Mass`.\n\nThe `Asteroid.prototype.draw` method holds no surprises.\
    \ It’s unchanged from our previous asteroid example. Notice we don’t need to define\
    \ an `Asteroid.prototype.update` method because the one we inherit from `Mass`\
    \ does everything we need.\n\nCreate an instance of `Asteroid` in the center of\
    \ the canvas with randomized mass, as shown in Listing [9-11](#A455241_1_En_9_Chapter.xhtml#Par39).\n\
    \n```\nvar asteroid = new Asteroid(\n  10000,\n  Math.random() * context.canvas.width,\n\
    \  Math.random() * context.canvas.height\n);\n```\n\nListing 9-11 Instantiate\
    \ an Asteroid\n\nHook up the update and draw functions and refresh your browser.\
    \ Now experiment again in the browser console with our `asteroid.push` and `asteroid.twist`\
    \ API. Notice that larger, heavy asteroids need more force to give the same acceleration.\
    \ Figure [9-2](#A455241_1_En_9_Chapter.xhtml#Fig2) shows an asteroid.\n\n![A455241_1_En_9_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_9_Fig2_HTML.jpg)\n\
    \nFigure 9-2 A similar asteroid but this time inheriting from mass\n\nTry creating\
    \ a list of asteroids (remember to hook up the update and draw functions to the\
    \ asteroid objects). Use the browser console to push and twist each of the asteroids\
    \ in turn.\n\n## The Ship\n\nNow we can do the same thing with the ship. The ship\
    \ is a mass floating in space just like an asteroid. Add the code in Listing [9-12](#A455241_1_En_9_Chapter.xhtml#Par43)\
    \ to your library.\n\n```\nfunction Ship(x, y) {\n  this.super(x, y, 10, 20, 1.5\
    \ * Math.PI);\n}\nextend(Ship, Mass);\n\nShip.prototype.draw = function(c, guide)\
    \ {\n  c.save();\n  c.translate(this.x, this.y);\n  c.rotate(this.angle);\n  c.strokeStyle\
    \ = \"white\";\n  c.lineWidth = 2;\n  c.fillStyle = \"black\";\n  draw_ship(c,\
    \ this.radius, {\n    guide: guide\n  });\n  c.restore();\n}\n```\n\nListing 9-12\
    \ The Ship Class\n\nIn your `exercise9.html` file, add some code to set up your\
    \ asteroids and ship properly. Try to automatically push and twist the asteroids\
    \ to send them floating off into space. Instantiate a ship right in the middle\
    \ of the canvas. Listing [9-13](#A455241_1_En_9_Chapter.xhtml#Par45) shows one\
    \ approach.\n\n```\nvar asteroids = [];\nfor (let i=0; i<4; i++) {\n  let asteroid\
    \ = new Asteroid(\n    Math.random() * context.canvas.width,\n    Math.random()\
    \ * context.canvas.height,\n    2000 + Math.random() * 8000\n  );\n  asteroid.push(Math.random()\
    \ * 2 * Math.PI, 2000, 60);\n  asteroid.twist((Math.random()-0.5) * 500, 60);\n\
    \  asteroids.push(asteroid);\n}\n\nvar ship = new Ship(context.canvas.width /\
    \ 2, context.canvas.height / 2);\n```\n\nListing 9-13 Set Up a Simple Scene\n\n\
    We now have a set of asteroids, each of which has been given a push and a twist\
    \ to get them started. We also have a ship in the middle of the canvas. Plumb\
    \ all the game elements to the update and draw functions to activate them. Try\
    \ pushing and twisting the ship in the browser console. Figure [9-3](#A455241_1_En_9_Chapter.xhtml#Fig3)\
    \ shows the kind of scene you should be able to produce.\n\n![A455241_1_En_9_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_9_Fig3_HTML.jpg)\n\
    \nFigure 9-3 The ship and the asteroid both inherit from mass\n\nNow let’s play\
    \ with the ship. Change your global update function as shown in Listing [9-14](#A455241_1_En_9_Chapter.xhtml#Par48)\
    \ and refresh your browser.\n\n```\nfunction update(elapsed) {\n  // if its nearly\
    \ stopped, turn\n  if(Math.abs(ship.speed()) < 15) {\n    ship.angle += Math.PI\
    \ * 2 * 0.01;\n  }\n  // If Its going fast, turn around to slow down\n  if(Math.abs(ship.speed())\
    \ > 100) {\n    ship.angle = ship.movement_angle() + Math.PI;\n  }\n  // push\
    \ in the direction its pointing (thrusters?)\n  ship.push(ship.angle, 1000, elapsed)\n\
    \n  asteroids.forEach(function(asteroid) {\n    asteroid.update(elapsed, context);\n\
    \  })\n\n  ship.update(elapsed, context);\n}\n```\n\nListing 9-14 Playing with\
    \ the Ship\n\nHere we’re implementing a simple set of instructions to control\
    \ the ship. We accelerate the ship forward all the time (as if the ship’s thrusters\
    \ were on). If the ship speed gets above 100 pixels per second, we turn around\
    \ to face the opposite direction. When we’re travelling slowly, we increase the\
    \ ship’s angle. This is beginning to look like a game.\n\n## Summary\n\nIn this\
    \ chapter, you’ve learned how to define common functionality and share it between\
    \ multiple game elements. We implemented methods on the parent `Mass` class that\
    \ can be inherited by any massive objects we need to float around according to\
    \ the basic laws of motion. We also played with developing a scene. The structured\
    \ way we’ve developed our objects makes it easy. It allows us to write very simple\
    \ code to initialize game elements, decide on their initial behavior, and “hook\
    \ them up” to our game loop to place them on the canvas. This is a powerful approach.\n\
    \nPushing the implementation details of our objects into their definitions means\
    \ we can easily switch contexts when writing code and can focus on developing\
    \ more complexity without getting bogged down in detail. Playing with the ship\
    \ in Listing [9-14](#A455241_1_En_9_Chapter.xhtml#Par48) shows how we can experiment\
    \ with controlling our game elements in the global update loop. But for behavior\
    \ that’s more intrinsic to our object, we should place code in the object definition.\
    \ Before we look closer at the ship behavior, we need to look into how we can\
    \ take user inputs via the keyboard to control our game."
  raw: '## Asteroids


    Listing [9-10](#A455241_1_En_9_Chapter.xhtml#Par33) shows how we create the Asteroid
