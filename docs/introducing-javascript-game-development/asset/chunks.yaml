  trans: "\n## 转向\n\n当我们连接转向系统后，真正的乐趣就开始了。更新 `Ship` 构造函数，使其与清单 11-8 保持一致。\n\n```javascript\n\
    function Ship(x, y, power) {\n  this.super(x, y, 10, 20, 1.5 * Math.PI);\n  this.thruster_power\
    \ = power;\n  this.steering_power = power / 20;\n  this.right_thruster = false;\n\
    \  this.left_thruster = false;\n  this.thruster_on = false;\n}\nextend(Ship, Mass);\n\
    ```\n\n清单 11-8：添加转向属性\n\n现在，利用这些新属性在每一帧中旋转飞船，如清单 11-9 中 `Ship.prototype.update`\
    \ 方法所示。我们通过计算 `this.right_thruster` 与 `this.left_thruster` 的差值来确定施加的扭转力。如果两者同时开启或同时关闭，结果为零。否则，结果为\
    \ –1 或 +1。该值再乘以转向力。\n\n```javascript\nShip.prototype.update = function(elapsed,\
    \ c) {\n  this.push(this.angle, this.thruster_on * this.thruster_power, elapsed);\n\
    \  this.twist((this.right_thruster - this.left_thruster) * this.steering_power,\
    \ elapsed);\n  Mass.prototype.update.apply(this, arguments);\n}\n```\n\n清单 11-9：利用推进器旋转飞船\n\
    \n最后，更新 `key_handler` 函数，使其响应左箭头和右箭头按键，如清单 11-10 所示。\n\n```javascript\nfunction\
    \ key_handler(e, value) {\n  var nothing_handled = false;\n  switch(e.key || e.keyCode)\
    \ {\n    case \"ArrowUp\":\n    case 38: // 上箭头\n      ship.thruster_on = value;\n\
    \      break;\n    case \"ArrowLeft\":\n    case 37: // 左箭头\n      ship.left_thruster\
    \ = value;\n      break;\n    case \"ArrowRight\":\n    case 39: // 右箭头\n    \
    \  ship.right_thruster = value;\n      break;\n    case \"g\":\n    case 71: //g\n\
    \      if(value) guide = !guide;\n    default:\n      nothing_handled = true;\n\
    \  }\n  if(!nothing_handled) e.preventDefault();\n}\n```\n\n清单 11-10：使用方向键控制推进器\n\
    \n刷新浏览器并尝试运行。现在它感觉更像一个能运行的游戏了！当你学习如何操控飞船时，尽情在画布上驰骋吧。请注意，我们还增加了对 `G` 键的响应，用于切换一个新的\
    \ `guide` 变量。请尝试实现这个功能。你需要定义一个全局 `guide` 变量并将其初始化为 `true`。此外，还需要将其传入小行星和飞船的 `draw`\
    \ 方法，并用它来决定是否绘制网格。\n\n## 射击\n"
- fmt: "为了发射子弹，我们需要引入一个新的`Projectile`类。与`Asteroid`和`Ship`一样，`Projectile`类继承自`Mass`。我们从飞船前方发射子弹，希望它们能击中小行星。将清单[11-11](#A455241_1_En_11_Chapter.xhtml#Par30)中的基本`Projectile`类添加到你的`objects.js`库中。从构造函数开始——这与小行星非常相似，只是提供了一个新的`lifetime`参数并将其保存到一个属性中。我们还创建了一个`life`属性并将其初始化为`1.0`。\n\
    \n```\nfunction Projectile(mass, lifetime, x, y, x_speed, y_speed, rotation_speed)\
    \ {\n  var density = 0.001; // low density means we can see very light projectiles\n\
    \  var radius = Math.sqrt((mass / density) / Math.PI);\n  this.super(mass, radius,\
    \ x, y, 0, x_speed, y_speed, rotation_speed);\n  this.lifetime = lifetime;\n \
    \ this.life = 1.0;\n}\nextend(Projectile, Mass);\n```\n\n*清单 11-11 Projectile\
    \ 构造函数*\n\n请注意，我们还使用了`extend(Projectile, Mass)`。`Projectile`类的特殊行为在于，它被实例化时带有一个有限的`lifetime`，并且当该生命周期结束后，它将从游戏中移除。这避免了累积不断增长的、会耗尽系统资源的子弹数量。清单[11-12](#A455241_1_En_11_Chapter.xhtml#Par32)展示了子弹如何从初始值`1.0`开始更新其自身的剩余生命属性，在每个帧中按经过的时间比例递减。除此之外，它是一个密度非常低的简单`Mass`。\n\
    \n```\nProjectile.prototype.update = function(elapsed, c) {\n  this.life -= (elapsed\
    \ / this.lifetime);\n  Mass.prototype.update.apply(this, arguments);\n}\n```\n\
    \n*清单 11-12 `Projectile.prototype.update` 方法*\n\n如清单[11-13](#A455241_1_En_11_Chapter.xhtml#Par34)所示，绘制函数非常熟悉。唯一需要注意的是，我们将`this.life`传递给了绘制函数。\n\
    \n```\nProjectile.prototype.draw = function(c, guide) {\n  c.save();\n  c.translate(this.x,\
    \ this.y);\n  c.rotate(this.angle);\n  draw_projectile(c, this.radius, this.life,\
    \ guide);\n  c.restore();\n}\n```\n\n*清单 11-13 `Projectile.prototype.draw` 方法*\n\
    \n在你的`drawing.js`库中实现一个`draw_projectile`函数。以清单[11-14](#A455241_1_En_11_Chapter.xhtml#Par36)为模板，我们使用`life`参数来设置填充颜色。记得调用`context.beginPath()`。\n\
    \n```\nfunction draw_projectile(ctx, radius, lifetime) {\n  ctx.save();\n  ctx.fillStyle\
    \ = \"rgb(100%, 100%, \" + (100 * lifetime) + \"%)\";\n  // *****************************************\n\
    \  // **         your code goes here         **\n  // **    draw a path to fill\
    \ the radius   **\n  // *****************************************\n  ctx.fill();\n\
    \  ctx.restore();\n}\n```\n\n*清单 11-14 绘制子弹的模板*\n\n既然我们已经有了子弹，就需要一个机制将它们添加到游戏数据中，并将它们连接到游戏循环。这在很大程度上是符合预期的。我们初始化一个空的子弹数组，如清单[11-15](#A455241_1_En_11_Chapter.xhtml#Par38)所示。\n\
    \n```\nvar asteroid = new Asteroid(\n  10000,\n  Math.random() * context.canvas.width,\n\
    \  Math.random() * context.canvas.height\n);\nasteroid.push(Math.random() * 2\
    \ * Math.PI, 1000, 60);\nasteroid.twist(Math.random() * 100, 60);\nvar ship =\
    \ new Ship(10, 15, context.canvas.width / 2, context.canvas.height / 2, 1000,\
    \ 200);\nvar projectiles = []; // new array\n```\n\n*清单 11-15 为子弹添加一个空数组*\n\n\
    然后，我们像往常一样绘制子弹，如清单[11-16](#A455241_1_En_11_Chapter.xhtml#Par40)所示。\n\n```\nfunction\
    \ draw() {\n  if(guide) {\n    draw_grid(context);\n  }\n  asteroid.draw(context,\
    \ guide);\n  projectiles.forEach(function(p) {\n    p.draw(context);\n  });\n\
    \  ship.draw(context, guide);\n}\n```\n\n*清单 11-16 在 `draw` 函数中连接子弹*\n\n清单[11-17](#A455241_1_En_11_Chapter.xhtml#Par42)中的`update`函数有一些出乎意料的地方。我们按照预期，在数组上使用`forEach`循环更新子弹。然后我们检查`projectile.life`的值。如果该值小于或等于`0`，我们就在`projectiles`数组上调用`array.prototype.splice`方法来移除已死亡的子弹。这会移除对该子弹的所有引用，并且它会被从内存中删除。\n\
    \n```\nfunction update(elapsed) {\n  asteroid.update(elapsed, context);\n  ship.update(elapsed,\
    \ context);\n  projectiles.forEach(function(projectile, i, projectiles) {\n  \
    \  projectile.update(elapsed, context);\n    if(projectile.life <= 0) {\n    \
    \  projectiles.splice(i, 1);\n    }\n  });\n  if(ship.trigger) {\n    projectiles.push(ship.projectile(elapsed));\n\
    \  }\n}\n```\n\n*清单 11-17 在 `update` 函数中连接子弹*\n\n在循环之后，我们检查一个新的属性：`ship.trigger`。如果它被设置了，我们就将一个新的子弹推入`projectiles`数组。我们通过调用`ship.projectile`并传入经过的时间`elapsed`来获取子弹。让我们在新的`Ship.prototype.projectile`方法中创建这些新子弹。我们之所以将这个方法添加到`Ship`类，有多种原因——主要是因为它让飞船生成子弹这件事在逻辑上说得通。从实践角度来看，我们需要访问飞船的一些属性，以便创建具有正确行为的子弹。或者，你也可以通过将飞船实例传递给另一个函数来完成此操作。清单[11-18](#A455241_1_En_11_Chapter.xhtml#Par45)中包含了代码。\n\
    \n```\nShip.prototype.projectile = function(elapsed) {\n  var p = new Projectile(0.025,\
    \ 1,\n    this.x + Math.cos(this.angle) * this.radius,\n    this.y + Math.sin(this.angle)\
    \ * this.radius,\n    this.x_speed,\n    this.y_speed,\n    this.rotation_speed\n\
    \  );\n  p.push(this.angle, this.weapon_power, elapsed);\n  this.push(this.angle\
    \ + Math.PI, this.weapon_power, elapsed);\n  return p;\n}\n```\n\n*清单 11-18 使用\
    \ `Ship.prototype.projectile` 方法创建子弹*\n\n第一个表达式创建了一个新的`Projectile`并将其赋值给变量`p`。它是用一个固定的`0.025`质量创建的（与飞船相比非常轻，这很重要）。`lifetime`参数设置为`1`秒。坐标`(x,\
    \ y)`经过计算，将子弹放置在飞船的前方。子弹的速度`(x_speed, y_speed)`及旋转速度`rotation_speed`被初始化为与飞船相同。接下来的两个表达式确保我们遵守牛顿第三定律。我们使用由飞船的一个新属性`weapon_power`决定的力，沿着飞船指向的方向推动子弹。然后我们用同样的力反推飞船。因此，子弹的质量相对于飞船的质量非常小，这一点很重要。当我们对两者施加相同的力时，子弹获得的加速度远大于飞船。\n\
    \n新属性`weapon_power`必须存在于飞船上。在`Ship`构造函数中创建它，如清单[11-19](#A455241_1_En_11_Chapter.xhtml#Par48)所示。确保在实例化飞船时也为`weapon_power`提供一个值（为了以防万一，我给出了一个默认值）。\n\
    \n```\nfunction Ship(mass, radius, x, y, power, weapon_power) {\n  this.super(mass,\
    \ radius, x, y, 1.5 * Math.PI);\n  this.thruster_power = power;\n  this.steering_power\
    \ = this.thruster_power / 20;\n  this.right_thruster = false;\n  this.left_thruster\
    \ = false;\n  this.thruster_on = false;\n  this.weapon_power = weapon_power ||\
    \ 200;\n}\nextend(Ship, Mass);\n```\n\n*清单 11-19 更新 Ship 构造函数*\n\n`Ship.prototype.projectile`方法的最后一行返回我们的子弹，以便我们可以将其添加到`projectiles`数组中，就像之前在全局`update`函数中展示的那样。现在，如果`ship.trigger`被设置为`true`，我们将创建新的子弹并从飞船前方发射出去。一旦子弹存活了一秒钟，它就会被从游戏中移除。\n\
    \n最后一步很简单。我们更新`key_handler`，将空格键连接到`ship.trigger`属性，如清单[11-20](#A455241_1_En_11_Chapter.xhtml#Par51)所示。\n\
    \n```\nfunction key_handler(e, value) {\n  var nothing_handled = false;\n  switch(e.key\
    \ || e.keyCode) {\n    case \"ArrowUp\":\n    case 38: // up arrow\n      ship.thruster_on\
    \ = value;\n      break;\n    case \"ArrowLeft\":\n    case 37: // left arrow\n\
    \      ship.left_thruster = value;\n      break;\n    case \"ArrowRight\":\n \
    \   case 39: // right arrow\n      ship.right_thruster = value;\n      break;\n\
    \    case \" \":\n    case 32: //spacebar\n      ship.trigger = value;\n     \
    \ break;\n    case \"g\":\n      if(value) guide = !guide;\n    default:\n   \
    \   nothing_handled = true;\n  }\n  if(!nothing_handled) e.preventDefault();\n\
    }\n```\n\n*清单 11-20 连接键处理函数*\n\n花点时间研究一下这是如何工作的，并确保你理解了它。当按下空格键时，`ship.trigger`变为`true`。由此，我们在每一帧都会向数组中添加新的子弹。当子弹的生命周期结束时，它们会从数组中被移除。图[11-2](#A455241_1_En_11_Chapter.xhtml#Fig2)显示了结果。\n\
    \n![A455241_1_En_11_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_11_Fig2_HTML.jpg)\n\
    *图 11-2 发射一连串的子弹*\n\n刷新浏览器并尝试一下。注意，飞船正如预期那样被子弹反推回去。我们正以极快的速度（每帧一个）创建子弹。为了增加游戏挑战性并控制游戏中的子弹数量，我们应该对此进行限制。向全局`update`函数添加一个新的限制；用清单[11-21](#A455241_1_En_11_Chapter.xhtml#Par55)中的代码替换现有的条件语句。\n\
    \n```\nif(ship.trigger && ship.loaded) {\n  projectiles.push(ship.projectile(elapsed));\n\
    }\n```\n\n*清单 11-21 限制子弹创建速度*\n\n这里我们指定，飞船的武器必须先装填才能开火。使用清单[11-22](#A455241_1_En_11_Chapter.xhtml#Par57)中的新代码更新你的`Ship`构造函数。\n\
    \n```\nthis.loaded = false;\nthis.weapon_reload_time = 0.25; // seconds\nthis.time_until_reloaded\
    \ = this.weapon_reload_time;\n```\n\n*清单 11-22 再次更新 Ship 构造函数*\n\n我们将飞船武器初始化为未装填状态。我们定义了武器重新装填所需的时间。我们还设置了一个属性来记录距离武器装填完成还有多少时间。\n\
    \n现在将清单[11-23](#A455241_1_En_11_Chapter.xhtml#Par59)中的几行代码添加到`Ship.prototype.update`方法中。\n\
    \n```\n// reload as necessary\nthis.loaded = this.time_until_reloaded === 0;\n\
    if(!this.loaded) {\n  this.time_until_reloaded -= Math.min(elapsed, this.time_until_reloaded);\n\
    }\n```\n\n*清单 11-23 控制装填时间*\n\n这段简单的代码控制了`ship.loaded`属性。当`this.time_until_reloaded`属性等于`0`时，它将为`true`。而该属性在每个帧中又按经过的时间递减。如果经过的时间大于`this.time_until_reloaded`属性，则它将被设置为`0`。仅此一项就可以确保，我们首次发射武器前，必须等待`this.weapon_reload_time`中指定的`0.25`秒。一旦武器开火，我们需要将`this.time_until_reloaded`属性重置为`this.weapon_reload_time`的值。将这一行添加到`Ship.prototype.projectile`方法中返回子弹的那一行之前：\n\
    \n```\nthis.time_until_reloaded = this.weapon_reload_time;\n```\n\n现在刷新页面并观看！你应该会得到类似于图[11-3](#A455241_1_En_11_Chapter.xhtml#Fig3)的效果。\n\
    \n![A455241_1_En_11_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_11_Fig3_HTML.jpg)\n\
    *图 11-3 射击现在受到武器装填时间的限制*\n\n现在飞船正以你通过`this.weapon_reload_time`指定的速率进行射击。如果你更改该属性，射速将相应调整。这是一个很好的目标，可以通过提升道具来减少武器装填时间。此外，增加子弹的`lifetime`属性也可能是一个好主意，以为玩家提供具体的优势。\n\
    \n作为练习，实现一个可以通过向下箭头键触发的反向推进器。思考如何将其与现有机制集成。看看我们如何在`Ship.prototype.update`方法中结合使用`ship.left_thruster`和`ship.right_thruster`。尝试使用`ship.retro_on`属性来复制此功能。除非你真的很想（如果这样，你可能也想绘制左、右推进器），否则不必担心绘制反向推进器的外观。"
  raw: 'To shoot, we need to introduce a new Projectile class. The Projectile class
    inherits from Mass just like Asteroid and Ship. We throw projectiles out from
    the front of the ship and hope they hit asteroids. Add the basic Projectile class
    from Listing [11-11](#A455241_1_En_11_Chapter.xhtml#Par30) into your objects.js
    library. Start with the constructor—this is very similar to an asteroid except
    that a new lifetime argument is provided and saved to a property. We also create
    a life property and initialize it to 1.0. function Projectile(mass, lifetime,
    x, y, x_speed, y_speed, rotation_speed) {   var density = 0.001; // low density
    means we can see very light projectiles   var radius = Math.sqrt((mass / density)
    / Math.PI);   this.super(mass, radius, x, y, 0, x_speed, y_speed, rotation_speed);
      this.lifetime = lifetime;   this.life = 1.0; } extend(Projectile, Mass); Listing
    11-11 The Projectile Constructor Notice we also extend from Mass. The Projectile
    class has special behavior in that it’s instantiated with a finite lifetime and
    will be removed from the game when that lifetime has run its course. This avoids
    accumulating an ever-growing number of projectiles that would drain system resources.
    Listing [11-12](#A455241_1_En_11_Chapter.xhtml#Par32) shows that the projectile
    updates its own remaining life property from the initial 1.0 by decrementing it
    at each frame proportional to the elapsed time. Otherwise, it’s a simple Mass
    with a very low density. Projectile.prototype.update = function(elapsed, c) {
      this.life -= (elapsed / this.lifetime);   Mass.prototype.update.apply(this,
    arguments); } Listing 11-12 The Projectile.prototype.update Method As shown in
    Listing [11-13](#A455241_1_En_11_Chapter.xhtml#Par34), drawing is very familiar.
    The only thing to note is that we pass this.life to the drawing function. Projectile.prototype.draw
    = function(c, guide) {   c.save();   c.translate(this.x, this.y);   c.rotate(this.angle);
      draw_projectile(c, this.radius, this.life, guide);   c.restore(); } Listing
    11-13 The Projectile.prototype.draw Method Implement a draw_projectile function
    in your drawing.js library. Using Listing [11-14](#A455241_1_En_11_Chapter.xhtml#Par36)
    as a template, we use the life argument to set the fill color. Remember to call
    context.beginPath(). function draw_projectile(ctx, radius, lifetime) {   ctx.save();
      ctx.fillStyle = "rgb(100%, 100%, " + (100 * lifetime) + "%)";   // *****************************************
      // **         your code goes here         **   // **    draw a path to fill
    the radius   **   // *****************************************   ctx.fill();   ctx.restore();
    } Listing 11-14 Template for Drawing a Projectile Now that we have projectiles,
    we need a mechanism for adding them to the game data and for hooking them up to
    the game loop. Mostly this is as expected. We initialize an empty array of projectiles,
    as shown in Listing [11-15](#A455241_1_En_11_Chapter.xhtml#Par38). var asteroid
    = new Asteroid(   10000,   Math.random() * context.canvas.width,   Math.random()
    * context.canvas.height ); asteroid.push(Math.random() * 2 * Math.PI, 1000, 60);
    asteroid.twist(Math.random() * 100, 60); var ship = new Ship(10, 15, context.canvas.width
    / 2, context.canvas.height / 2, 1000, 200); var projectiles = []; // new array
    Listing 11-15 Add an Empty Array for Projectiles Then we draw projectiles in the
    usual way, as shown in Listing [11-16](#A455241_1_En_11_Chapter.xhtml#Par40).
    function draw() {   if(guide) {     draw_grid(context);   }   asteroid.draw(context,
    guide);   projectiles.forEach(function(p) {     p.draw(context);   });   ship.draw(context,
    guide); } Listing 11-16 Hook Up Projectiles in the draw Function The update function
    in Listing [11-17](#A455241_1_En_11_Chapter.xhtml#Par42) has a few surprises.
    We update the projectiles as expected in a forEach loop over the array. Then we
    check the value of projectile.life. If the value is 0 or less, we call the array.prototype.splice
    method on our projectiles array to remove the dead projectile. This removes all
    references to the projectile, and it gets removed from memory. function update(elapsed)
    {   asteroid.update(elapsed, context);   ship.update(elapsed, context);   projectiles.forEach(function(projectile,
    i, projectiles) {     projectile.update(elapsed, context);     if(projectile.life
    <= 0) {       projectiles.splice(i, 1);     }   });   if(ship.trigger) {     projectiles.push(ship.projectile(elapsed));
      } } Listing 11-17 Hook Up Projectiles in the update Function After the loop,
    we check a new property: ship.trigger. If it’s set, we push a new projectile onto
    the projectiles array. We get the projectile by calling ship.projectile and passing
    in the elapsed time. Let’s create the new projectiles in the new Ship.prototype.projectile
    method. We add this method to the Ship class for a number of reasons—mainly because
    it makes sense for the ship to generate projectiles. From a practical point of
    view, we need to access some of the ship’s properties in order to create a projectile
    with the correct behavior. Alternatively, you could do this by passing the ship
    instance to another function. Listing [11-18](#A455241_1_En_11_Chapter.xhtml#Par45)
    has the code. Ship.prototype.projectile = function(elapsed) {   var p = new Projectile(0.025,
    1,     this.x + Math.cos(this.angle) * this.radius,     this.y + Math.sin(this.angle)
    * this.radius,     this.x_speed,     this.y_speed,     this.rotation_speed   );
      p.push(this.angle, this.weapon_power, elapsed);   this.push(this.angle + Math.PI,
    this.weapon_power, elapsed);   return p; } Listing 11-18 Create Projectiles with
    the Ship.prototype. projectile Method The first expression creates a new Projectile
    and assigns it to the variable, p. It’s created with a fixed mass of 0.025 (very
    light compared to the ship, this is important). The lifetime argument is set to
    1 second. The (x, y) coordinates are calculated to place the projectile at the
    front of the ship. The (x_speed, y_speed) velocity of the projectile is initialized
    to that of the ship, as is the rotation_speed. The next two expressions ensure
    that we adhere to Newton’s third law. We push the projectile in the direction
    the ship is pointing in with the force determined by a new property of the ship,
    weapon_power. Then we push the ship back with the same force. So, it’s important
    that the mass of the projectile is very small relative to the mass of the ship.
    When we apply the same force to both, the projectile is accelerated much more
    than the ship. The new property weapon_power must exist on the ship. Create it
    in the Ship constructor function, as shown in Listing [11-19](#A455241_1_En_11_Chapter.xhtml#Par48).
    Make sure you also give the ship a value for weapon_power when you instantiate
    it (I’ve given it a default value just in case). function Ship(mass, radius, x,
    y, power, weapon_power) {   this.super(mass, radius, x, y, 1.5 * Math.PI);   this.thruster_power
    = power;   this.steering_power = this.thruster_power / 20;   this.right_thruster
    = false;   this.left_thruster = false;   this.thruster_on = false;   this.weapon_power
    = weapon_power || 200; } extend(Ship, Mass); Listing 11-19 Update the Ship Constructor
    The final line of the Ship.prototype.projectile method returns our projectile
    so we can add it to our projectiles array as shown earlier in the global update
    function. Now if ship.trigger is set to true, we’ll create new projectiles and
    fire them out from the front of the ship. Once the projectile has been alive for
    one second, it’s removed from play. The last step is simple. We update our key_handler
    to connect the spacebar to the ship.trigger property, as shown in Listing [11-20](#A455241_1_En_11_Chapter.xhtml#Par51).
    function key_handler(e, value) {   var nothing_handled = false;   switch(e.key
    || e.keyCode) {     case "ArrowUp":     case 38: // up arrow       ship.thruster_on
    = value;       break;     case "ArrowLeft":     case 37: // left arrow       ship.left_thruster
    = value;       break;     case "ArrowRight":     case 39: // right arrow       ship.right_thruster
    = value;       break;     case " ":     case 32: //spacebar       ship.trigger
    = value;       break;     case "g":       if(value) guide = !guide;     default:
          nothing_handled = true;   }   if(!nothing_handled) e.preventDefault(); }
    Listing 11-20 Hooking Up the key_ handler Take the time to study how this works
    and make sure you understand it. When the spacebar is pressed, ship.trigger becomes
    true. From this we’re adding new projectiles into our array on every frame. Projectiles
    are removed from the array when their lifetime is up. Figure [11-2](#A455241_1_En_11_Chapter.xhtml#Fig2)
    shows the result. ![A455241_1_En_11_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_11_Fig2_HTML.jpg)
    Figure 11-2 Shooting a stream of projectiles Refresh your browser and try it out.
    Notice that the ship is being pushed back by the projectiles as intended. We’re
    creating projectiles at an extremely fast rate, one per frame. We should throttle
    this in order to make the game more challenging and keep down the number of projectiles
    in play. Add a new restriction to the global update function; replace the existing
    conditional statement with the code from Listing [11-21](#A455241_1_En_11_Chapter.xhtml#Par55).
    if(ship.trigger && ship.loaded) {   projectiles.push(ship.projectile(elapsed));
    } Listing 11-21 Throttle the Projectile Creation Here we’re specifying that the
    ship’s weapon must be loaded before it can be fired. Update your Ship constructor
    with the new code in Listing [11-22](#A455241_1_En_11_Chapter.xhtml#Par57). this.loaded
    = false; this.weapon_reload_time = 0.25; // seconds this.time_until_reloaded =
    this.weapon_reload_time; Listing 11-22 Update the Ship Constructor Again We’re
    initializing the ship weapon to be not loaded. We’re defining the time it will
    take for the weapon to reload. And we’re setting a property to record how much
    time there is left until the weapon is reloaded. Now add the few lines of Listing
    [11-23](#A455241_1_En_11_Chapter.xhtml#Par59) to the Ship.prototype.update method.
    // reload as necessary this.loaded = this.time_until_reloaded === 0; if(!this.loaded)
    {   this.time_until_reloaded -= Math.min(elapsed, this.time_until_reloaded); }
    Listing 11-23 Control the Reload Time This simple piece of code controls the ship.loaded
    property. It will be true whenever the this.time_until_reloaded property is equal
    to 0\. This, in turn, is decremented every frame by the elapsed time. If the elapsed
    time is greater than the this.time_until_reloaded property, then it will be set
    to 0\. This alone will ensure that we must wait the 0.25 seconds specified in
    this.weapon_reload_time before we can fire the weapon the first time. Once the
    weapon is fired, we need to reset the this.time_until_reloaded property to the
    value of this.weapon_reload_time. Add this line to the Ship.prototype.projectile
    method before the line that returns the projectile: this.time_until_reloaded =
    this.weapon_reload_time; Now refresh the page and behold! You should have something
    like Figure [11-3](#A455241_1_En_11_Chapter.xhtml#Fig3). ![A455241_1_En_11_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_11_Fig3_HTML.jpg)
    Figure 11-3 Shooting is now restricted by the weapon reload time The ship is now
    shooting at the rate you prescribed with this.weapon_reload_time. If you change
    the property, the rate of fire will adjust accordingly. This is a good target
    for a powerup to decrease the weapon reload time. Also perhaps the projectile
    lifetime property might be a good one to increase to give a concrete advantage
    to the player. For practice, implement a retro-thruster that can be triggered
    with the down arrow key. Think about how to integrate it with the existing mechanism.
    Look at how we combine ship.left_thruster and ship.right_thruster in the Ship.prototype.update
    method. Try to replicate this using a ship.retro_on property. Don’t worry about
    drawing the retro-thrusters unless you really want to (in which case, you may
    want to draw the left and right thrusters too).'
  trans: "```markdown\n为了发射子弹，我们需要引入一个新的`Projectile`类。与`Asteroid`和`Ship`一样，`Projectile`类继承自`Mass`。我们从飞船前方发射子弹，希望它们能击中小行星。将清单\
    \ 11-11 中的基本`Projectile`类添加到你的`objects.js`库中。从构造函数开始——这与小行星非常相似，只是提供了一个新的`lifetime`参数并将其保存到一个属性中。我们还创建了一个`life`属性并将其初始化为`1.0`。\n\
    \n```\nfunction Projectile(mass, lifetime, x, y, x_speed, y_speed, rotation_speed)\
    \ {\n  var density = 0.001; // low density means we can see very light projectiles\n\
    \  var radius = Math.sqrt((mass / density) / Math.PI);\n  this.super(mass, radius,\
    \ x, y, 0, x_speed, y_speed, rotation_speed);\n  this.lifetime = lifetime;\n \
    \ this.life = 1.0;\n}\nextend(Projectile, Mass);\n```\n\n*清单 11-11 Projectile\
    \ 构造函数*\n\n请注意，我们还使用了`extend(Projectile, Mass)`。`Projectile`类的特殊行为在于，它被实例化时带有一个有限的`lifetime`，并且当该生命周期结束后，它将从游戏中移除。这避免了累积不断增长的、会耗尽系统资源的子弹数量。清单\
    \ 11-12 展示了子弹如何从初始值`1.0`开始更新其自身的剩余生命属性，在每个帧中按经过的时间比例递减。除此之外，它是一个密度非常低的简单`Mass`。\n\
    \n```\nProjectile.prototype.update = function(elapsed, c) {\n  this.life -= (elapsed\
    \ / this.lifetime);\n  Mass.prototype.update.apply(this, arguments);\n}\n```\n\
    \n*清单 11-12 `Projectile.prototype.update` 方法*\n\n如清单 11-13 所示，绘制函数非常熟悉。唯一需要注意的是，我们将`this.life`传递给了绘制函数。\n\
    \n```\nProjectile.prototype.draw = function(c, guide) {\n  c.save();\n  c.translate(this.x,\
    \ this.y);\n  c.rotate(this.angle);\n  draw_projectile(c, this.radius, this.life,\
    \ guide);\n  c.restore();\n}\n```\n\n*清单 11-13 `Projectile.prototype.draw` 方法*\n\
    \n在你的`drawing.js`库中实现一个`draw_projectile`函数。以清单 11-14 为模板，我们使用`life`参数来设置填充颜色。记得调用`context.beginPath()`。\n\
    \n```\nfunction draw_projectile(ctx, radius, lifetime) {\n  ctx.save();\n  ctx.fillStyle\
    \ = \"rgb(100%, 100%, \" + (100 * lifetime) + \"%)\";\n  // *****************************************\n\
    \  // **         your code goes here         **\n  // **    draw a path to fill\
    \ the radius   **\n  // *****************************************\n  ctx.fill();\n\
    \  ctx.restore();\n}\n```\n\n*清单 11-14 绘制子弹的模板*\n\n既然我们已经有了子弹，就需要一个机制将它们添加到游戏数据中，并将它们连接到游戏循环。这在很大程度上是符合预期的。我们初始化一个空的子弹数组，如清单\
    \ 11-15 所示。\n\n```\nvar asteroid = new Asteroid(\n  10000,\n  Math.random() *\
    \ context.canvas.width,\n  Math.random() * context.canvas.height\n);\nasteroid.push(Math.random()\
    \ * 2 * Math.PI, 1000, 60);\nasteroid.twist(Math.random() * 100, 60);\nvar ship\
    \ = new Ship(10, 15, context.canvas.width / 2, context.canvas.height / 2, 1000,\
    \ 200);\nvar projectiles = []; // new array\n```\n\n*清单 11-15 为子弹添加一个空数组*\n\n\
    然后，我们像往常一样绘制子弹，如清单 11-16 所示。\n\n```\nfunction draw() {\n  if(guide) {\n    draw_grid(context);\n\
    \  }\n  asteroid.draw(context, guide);\n  projectiles.forEach(function(p) {\n\
    \    p.draw(context);\n  });\n  ship.draw(context, guide);\n}\n```\n\n*清单 11-16\
    \ 在 `draw` 函数中连接子弹*\n\n清单 11-17 中的`update`函数有一些出乎意料的地方。我们按照预期，在数组上使用`forEach`循环更新子弹。然后我们检查`projectile.life`的值。如果该值小于或等于`0`，我们就在`projectiles`数组上调用`array.prototype.splice`方法来移除已死亡的子弹。这会移除对该子弹的所有引用，并且它会被从内存中删除。\n\
    \n```\nfunction update(elapsed) {\n  asteroid.update(elapsed, context);\n  ship.update(elapsed,\
    \ context);\n  projectiles.forEach(function(projectile, i, projectiles) {\n  \
    \  projectile.update(elapsed, context);\n    if(projectile.life <= 0) {\n    \
    \  projectiles.splice(i, 1);\n    }\n  });\n  if(ship.trigger) {\n    projectiles.push(ship.projectile(elapsed));\n\
    \  }\n}\n```\n\n*清单 11-17 在 `update` 函数中连接子弹*\n\n在循环之后，我们检查一个新的属性：`ship.trigger`。如果它被设置了，我们就将一个新的子弹推入`projectiles`数组。我们通过调用`ship.projectile`并传入经过的时间`elapsed`来获取子弹。让我们在新的`Ship.prototype.projectile`方法中创建这些新子弹。我们之所以将这个方法添加到`Ship`类，有多种原因——主要是因为它让飞船生成子弹这件事在逻辑上说得通。从实践角度来看，我们需要访问飞船的一些属性，以便创建具有正确行为的子弹。或者，你也可以通过将飞船实例传递给另一个函数来完成此操作。清单\
    \ 11-18 中包含了代码。\n\n```\nShip.prototype.projectile = function(elapsed) {\n  var\
    \ p = new Projectile(0.025, 1,\n    this.x + Math.cos(this.angle) * this.radius,\n\
    \    this.y + Math.sin(this.angle) * this.radius,\n    this.x_speed,\n    this.y_speed,\n\
    \    this.rotation_speed\n  );\n  p.push(this.angle, this.weapon_power, elapsed);\n\
    \  this.push(this.angle + Math.PI, this.weapon_power, elapsed);\n  return p;\n\
    }\n```\n\n*清单 11-18 使用 `Ship.prototype.projectile` 方法创建子弹*\n\n第一个表达式创建了一个新的`Projectile`并将其赋值给变量`p`。它是用一个固定的`0.025`质量创建的（与飞船相比非常轻，这很重要）。`lifetime`参数设置为`1`秒。坐标`(x,\
    \ y)`经过计算，将子弹放置在飞船的前方。子弹的速度`(x_speed, y_speed)`及旋转速度`rotation_speed`被初始化为与飞船相同。接下来的两个表达式确保我们遵守牛顿第三定律。我们使用由飞船的一个新属性`weapon_power`决定的力，沿着飞船指向的方向推动子弹。然后我们用同样的力反推飞船。因此，子弹的质量相对于飞船的质量非常小，这一点很重要。当我们对两者施加相同的力时，子弹获得的加速度远大于飞船。\n\
    \n新属性`weapon_power`必须存在于飞船上。在`Ship`构造函数中创建它，如清单 11-19 所示。确保在实例化飞船时也为`weapon_power`提供一个值（为了以防万一，我给出了一个默认值）。\n\
    \n```\nfunction Ship(mass, radius, x, y, power, weapon_power) {\n  this.super(mass,\
    \ radius, x, y, 1.5 * Math.PI);\n  this.thruster_power = power;\n  this.steering_power\
    \ = this.thruster_power / 20;\n  this.right_thruster = false;\n  this.left_thruster\
    \ = false;\n  this.thruster_on = false;\n  this.weapon_power = weapon_power ||\
    \ 200;\n}\nextend(Ship, Mass);\n```\n\n*清单 11-19 更新 Ship 构造函数*\n\n`Ship.prototype.projectile`方法的最后一行返回我们的子弹，以便我们可以将其添加到`projectiles`数组中，就像之前在全局`update`函数中展示的那样。现在，如果`ship.trigger`被设置为`true`，我们将创建新的子弹并从飞船前方发射出去。一旦子弹存活了一秒钟，它就会被从游戏中移除。\n\
    \n最后一步很简单。我们更新`key_handler`，将空格键连接到`ship.trigger`属性，如清单 11-20 所示。\n\n```\nfunction\
    \ key_handler(e, value) {\n  var nothing_handled = false;\n  switch(e.key || e.keyCode)\
    \ {\n    case \"ArrowUp\":\n    case 38: // up arrow\n      ship.thruster_on =\
    \ value;\n      break;\n    case \"ArrowLeft\":\n    case 37: // left arrow\n\
    \      ship.left_thruster = value;\n      break;\n    case \"ArrowRight\":\n \
    \   case 39: // right arrow\n      ship.right_thruster = value;\n      break;\n\
    \    case \" \":\n    case 32: //spacebar\n      ship.trigger = value;\n     \
    \ break;\n    case \"g\":\n      if(value) guide = !guide;\n    default:\n   \
    \   nothing_handled = true;\n  }\n  if(!nothing_handled) e.preventDefault();\n\
    }\n```\n\n*清单 11-20 连接键处理函数*\n\n花点时间研究一下这是如何工作的，并确保你理解了它。当按下空格键时，`ship.trigger`变为`true`。由此，我们在每一帧都会向数组中添加新的子弹。当子弹的生命周期结束时，它们会从数组中被移除。图\
    \ 11-2 显示了结果。\n\n![A455241_1_En_11_Fig2_HTML.jpg](img/A455241_1_En_11_Fig2_HTML.jpg)\n\
    *图 11-2 发射一连串的子弹*\n\n刷新浏览器并尝试一下。注意，飞船正如预期那样被子弹反推回去。我们正以极快的速度（每帧一个）创建子弹。为了增加游戏挑战性并控制游戏中的子弹数量，我们应该对此进行限制。向全局`update`函数添加一个新的限制；用清单\
    \ 11-21 中的代码替换现有的条件语句。\n\n```\nif(ship.trigger && ship.loaded) {\n  projectiles.push(ship.projectile(elapsed));\n\
    }\n```\n\n*清单 11-21 限制子弹创建速度*\n\n这里我们指定，飞船的武器必须先装填才能开火。使用清单 11-22 中的新代码更新你的`Ship`构造函数。\n\
    \n```\nthis.loaded = false;\nthis.weapon_reload_time = 0.25; // seconds\nthis.time_until_reloaded\
    \ = this.weapon_reload_time;\n```\n\n*清单 11-22 再次更新 Ship 构造函数*\n\n我们将飞船武器初始化为未装填状态。我们定义了武器重新装填所需的时间。我们还设置了一个属性来记录距离武器装填完成还有多少时间。\n\
    \n现在将清单 11-23 中的几行代码添加到`Ship.prototype.update`方法中。\n\n```\n// reload as necessary\n\
    this.loaded = this.time_until_reloaded === 0;\nif(!this.loaded) {\n  this.time_until_reloaded\
    \ -= Math.min(elapsed, this.time_until_reloaded);\n}\n```\n\n*清单 11-23 控制装填时间*\n\
    \n这段简单的代码控制了`ship.loaded`属性。当`this.time_until_reloaded`属性等于`0`时，它将为`true`。而该属性在每个帧中又按经过的时间递减。如果经过的时间大于`this.time_until_reloaded`属性，则它将被设置为`0`。仅此一项就可以确保，我们首次发射武器前，必须等待`this.weapon_reload_time`中指定的`0.25`秒。一旦武器开火，我们需要将`this.time_until_reloaded`属性重置为`this.weapon_reload_time`的值。将这一行添加到`Ship.prototype.projectile`方法中返回子弹的那一行之前：\n\
    \n```\nthis.time_until_reloaded = this.weapon_reload_time;\n```\n\n现在刷新页面并观看！你应该会得到类似于图\
    \ 11-3 的效果。\n\n![A455241_1_En_11_Fig3_HTML.jpg](img/A455241_1_En_11_Fig3_HTML.jpg)\n\
    *图 11-3 射击现在受到武器装填时间的限制*\n\n现在飞船正以你通过`this.weapon_reload_time`指定的速率进行射击。如果你更改该属性，射速将相应调整。这是一个很好的目标，可以通过提升道具来减少武器装填时间。此外，增加子弹的`lifetime`属性也可能是一个好主意，以为玩家提供具体的优势。\n\
    \n作为练习，实现一个可以通过向下箭头键触发的反向推进器。思考如何将其与现有机制集成。看看我们如何在`Ship.prototype.update`方法中结合使用`ship.left_thruster`和`ship.right_thruster`。尝试使用`ship.retro_on`属性来复制此功能。除非你真的很想（如果这样，你可能也想绘制左、右推进器），否则不必担心绘制反向推进器的外观。\n\
    ```"
- fmt: '## Summary


    In this chapter we added a lot of controllable properties to our ship object.
    We connected event listeners to allow us to control the ship’s movement. We’ve
    introduced a projectile object and triggered projectile generation via a function
    on the ship. We call this function when the spacebar is pressed but only once
    every quarter-second. We also managed the projectiles population so they’re destroyed
    after one second in play. This chapter has been a very quick addition of new functionality.
    If you encounter any problems, go through the chapter again carefully until you’re
    crystal clear on what has happened.© Graeme Stuart 2017 Graeme StuartIntroducing
    JavaScript Game Development [https://doi.org/10.1007/978-1-4842-3252-1_12](#A455241_1_En_12_Chapter.xhtml)


    # 12. Collision Detection


    Graeme Stuart^(1) (1) Market Harborough, Leicestershire, UK


    In this chapter we’ll look at detecting collisions between objects. Now that we’re
    in control of the ship and shooting projectiles, we should think about taking
    damage and scoring points. These require that we detect collisions between ship
    and asteroids for damage and between projectiles and asteroids for scoring points.
    We’ll use a simple circle-to-circle collision detection, so all our objects must
    approximate to circles. It’s very simple to calculate: first, you need to calculate
    the distance between the centers of the two circles. If that distance is less
    than the sum of the circle radii, then the circles are overlapping.


    ## A Quick Refactor'
