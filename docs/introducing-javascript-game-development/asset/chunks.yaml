    before the recent changes to context.lineWidth and context.strokeStyle. let msg2
    = "its quite easy"; context.font = "24px Arial"; context.fillText(msg2, canvas.width
    / 2, 330); context.strokeText(msg2, canvas.width / 2, 330); Listing 1-8 A Motivational
    Message The final image should appear like Figure [1-7](#A455241_1_En_1_Chapter.xhtml#Fig7).
    Note how the position in the code where you insert the new lines makes a difference.
    If you place the new code after the context changes, the text outline will be
