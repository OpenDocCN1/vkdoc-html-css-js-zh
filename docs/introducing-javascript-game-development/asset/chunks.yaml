            ctx.beginPath();         ctx.arc(x, y, 40, 0, 2 * Math.PI);         ctx.fill();
            ctx.stroke();       }       setInterval(frame, 1000.0/60.0); // 60 fps
        </script>   </body> </html> Listing 6-1 A Moving Circle The code is mostly
    familiar, but there are a few new things to notice. First, we’re storing the x-
