    \ `Asteroid` 对象并调用相应的方法将变得非常简单，而关于小行星行为的所有智能逻辑都将集中放置在 `Asteroid.prototype` 上的一处位置。\n\
    \n清单 7-9 展示了 `Asteroid.prototype` 上的一个 `update` 函数。将此函数添加到 `objects.js` 中，确保在构造函数定义之后添加。\n\
    \n```\nAsteroid.prototype.update = function(elapsed) {\n  if(this.x - this.radius\
    \ + elapsed * this.x_speed > context.canvas.width) {\n    this.x = -this.radius;\n\
    \  }\n  if(this.x + this.radius + elapsed * this.x_speed < 0) {\n    this.x =\
    \ context.canvas.width + this.radius;\n  }\n  if(this.y - this.radius + elapsed\
    \ * this.y_speed > context.canvas.height) {\n    this.y = -this.radius;\n  }\n\
    \  if(this.y + this.radius + elapsed * this.y_speed < 0) {\n    this.y = context.canvas.height\
    \ + this.radius;\n  }\n  this.x += elapsed * this.x_speed;\n  this.y += elapsed\
    \ * this.y_speed;\n  this.angle = (this.angle + this.rotation_speed * elapsed)\
    \ % (2 * Math.PI);\n}\n```\n\n**清单 7-9** 一个原型方法\n\n这与我们最初的 `update` 函数几乎相同，只是现在引用了对象的实例属性。现在，我们可以用清单\
    \ 7-10 中简单的一行代码来替换全局的 `update` 函数。\n\n```\nfunction update(elapsed) {\n  asteroid.update(elapsed);\n\
    }\n```\n\n**清单 7-10** 简化的 `update` 函数\n\n刷新页面应该会看到小行星仍在运行。除了代码质量之外，一切都没有改变。现在，以同样的方式将清单\
    \ 7-11 中的 `draw` 函数添加到 `Asteroid.prototype` 上。\n\n```\nAsteroid.prototype.draw\
    \ = function(ctx, guide) {\n  ctx.save();\n  ctx.translate(this.x, this.y);\n\
    \  ctx.rotate(this.angle);\n  draw_asteroid(ctx, this.radius, this.shape, {\n\
    \    guide: guide,\n    noise: this.noise\n  });\n  ctx.restore();\n}\n```\n\n\
    **清单 7-11** 另一个原型方法\n\n同样，我们只是将现有代码转移到函数中，并指定了实例变量。我们还指定了两个参数：上下文 `ctx` 和可选的 `guide`。我们的全局\
    \ `draw` 函数现在如清单 7-12 所示。\n\n```\nfunction draw(ctx, guide) {\n  if(guide) {\n\
    \    draw_grid(ctx);\n  }\n  asteroid.draw(ctx, guide);\n}\n```\n\n**清单 7-12**\
    \ 简化的 `draw` 函数\n\n变化不大。我们只是将所有绘制小行星的代码替换为对前面函数的单一调用。`guide` 的绘制仍然保留，因为这是一个全局关注点，与单个小行星无关。\n\
    \n# 处理多个小行星\n\n现在，基本的小行星“类”已经完成，我们可以尝试处理多个小行星实例了。根据清单 7-13 更新你的代码。\n\n```\nvar\
    \ asteroids = [\n  new Asteroid(24, 50, 0.2),\n  new Asteroid(24, 50, 0.5),\n\
    \  new Asteroid(5, 50, 0.2)\n];\n\nfunction draw(ctx, guide) {\n  if(guide) {\n\
    \    draw_grid(ctx);\n  }\n  asteroids.forEach(function(asteroid) {\n    asteroid.draw(context,\
    \ guide);\n  });\n}\n\nfunction update(elapsed) {\n  asteroids.forEach(function(asteroid)\
    \ {\n    asteroid.update(elapsed);\n  });\n}\n```\n\n**清单 7-13** 三个小行星\n\n我们将\
    \ `asteroid` 变量替换成了一个 `Asteroid` 对象数组。在我们的 `draw` 函数中，我们将对 `asteroid.draw` 函数的调用替换为一个循环，该循环会对\
    \ `asteroids` 数组中的每个项调用 `draw` 方法。最后，我们以类似的方式替换了对 `asteroid.update` 函数的调用。\n\n\
    图 7-2 显示了结果。刷新页面，看看你创造出来的这三个截然不同的小行星吧！\n\n![A455241_1_En_7_Fig2_HTML.jpg](img/A455241_1_En_7_Fig2_HTML.jpg)\n\
    \n**图 7-2** 三个漂浮的小行星\n\n# 总结\n\n在本章中，我们重构了代码结构。现在，我们将小行星数据的存储与更新，以及小行星在画布上的渲染都整合到一个新的对象类型中。我们在代码中运用的逻辑与之前几乎相同。我们没有改变小行星的绘制或更新方式；我们只是为代码增加了结构。这种额外的结构使我们能够通过简单地调用构造函数来创建小行星。然后，我们可以非常方便地在小行星对象上调用方法。\n\
    \n在清单 7-13 中，一些小的改动使我们能够并行地向场景中添加任意数量的小行星。如果没有这次重构，管理起来将会困难得多。\n\n© Graeme Stuart\
    \ 2017  \nGraeme Stuart, *《JavaScript 游戏开发入门》*  \n[`doi.org/10.1007/978-1-4842-3252-1_8`](https://doi.org/10.1007/978-1-4842-3252-1_8)\n\
    \n# 8. 实践对象\n\nGraeme Stuart¹\n\n(1) 英国莱斯特郡马基特哈伯勒\n\n面向对象方法的好处现在应该很清楚了。我们可以通过简单直观的\
    \ API 来设计我们的对象（`Asteroid`、`Ship` 等）。我们的对象会跟踪自己的状态，并在我们要求时（在其 `update` 函数中）更新自身。通过简单的函数调用（它们的\
    \ `draw` 函数），它们也能轻松地绘制到画布的正确位置。游戏循环本身可以依次更新所有对象，然后绘制它们。我们应该能够毫不费力地阅读高级代码。所有繁杂的细节都委托给了对象本身。在本章中，我们将通过一个熟悉的示例来实践这种使用对象的方式。\n\
    \n## 为什么使用对象？\n\n现代开发实践中一个重要的点是，实现的效率与我们生成代码的清晰度之间通常需要权衡。对于像这样一个简单的游戏，低端机器的计算能力已经绰绰有余，我们应该将注意力集中在使代码易于理解上。虽然实现的效率非常重要，并且我们应该始终默认追求高效，但我们不应让这一点影响代码的整体设计。事实上，我们有时可能会主动选择牺牲效率来换取清晰度。通过将底层代码推入对象（并将这些代码移入库模块），我们将底层的实现细节隐藏起来。这样，我们的顶层作用域（当前我们在全局作用域中编码）就变得易于理解，并且可以专注于更高级别的游戏逻辑。我们可以在无需思考小行星行为如何实现或小行星如何绘制的情况下处理这些代码，从而保持关注点分离，并使我们能够专注于手头的任务。\n"
- fmt: "# Pac-Man Chased by Ghosts\n\nIn the next few chapters we’ll get stuck into\
    \ coding the asteroid game in detail. Before we do that, though, we’ll spend a\
    \ bit of time reviewing our game design and see how the principles we applied\
    \ in the previous chapter can be applied to another pseudo-game involving Pac-Man.\
    \ We’ll define behaviors for our Pac-Man and create a new object to represent\
    \ the Pac-Man ghosts. Pac-Man will be allowed to move horizontally and vertically\
    \ across the canvas and will wrap around the canvas as in the previous Pac-Man\
    \ and Asteroids examples. Occasionally, he’ll randomly decide to turn left or\
    \ right (clockwise or anti-clockwise). He’ll be pursued by ghosts. The ghosts\
    \ will have the advantage of being able to move in any direction and will be programmed\
    \ to head straight for Pac-Man. We’ll ensure the ghosts have a hard time by making\
    \ Pac-Man faster.\n\nCreate a new folder called `exercise8` and copy the usual\
    \ libraries and stylesheets into the new folder. Add a new template called `exercise8.html`,\
    \ and include a link to `drawing.js` and `objects.js` as before. Begin with the\
    \ code in Listing [8-1](#A455241_1_En_8_Chapter.xhtml#Par8). This instantiates\
    \ a `PacMan` object, updates it and draws it in the respective functions and controls\
    \ everything with the main game loop function, `frame`.\n\n```html\n<!doctype\
    \ html>\n<html>\n  <head>\n    <title>Animation</title>\n    <link rel=\"stylesheet\"\
    \ href=\"styles.css\">\n    <script src=\"drawing.js\"></script>\n    <script\
    \ src=\"objects.js\"></script>\n  </head>\n  <body>\n    <h1>Animation</h1>\n\
    \    <canvas id=\"pacman\" width=\"300\" height=\"300\"></canvas>\n    <script>\n\
    \      var context = document.getElementById(\"pacman\").getContext(\"2d\");\n\
    \      pacman = new PacMan(150, 150, 20, 120);\n      function draw(ctx, guide)\
    \ {\n        pacman.draw(ctx);\n      }\n      function update(elapsed) {\n  \
    \      pacman.update(elapsed, 300, 300);\n      }\n      var previous, elapsed;\n\
    \      function frame(timestamp) {\n        context.clearRect(0, 0, context.canvas.width,\
    \ context.canvas.height);\n        if (!previous) previous = timestamp;\n    \
    \    elapsed = timestamp - previous;\n        update(elapsed / 1000);\n      \
    \  draw(context, true);\n        previous = timestamp;\n        window.requestAnimationFrame(frame);\n\
    \      }\n      window.requestAnimationFrame(frame);\n    </script>\n  </body>\n\
    </html>\n```\n\n**Listing 8-1** A Simple Template\n\n## The `PacMan` Object\n\n\
    Now we need to define the `PacMan` constructor in `objects.js`. Pac-Man is pretty\
    \ simple: we’ll allow his radius and speed to be configurable with arguments.\
    \ We initialize his location to the center of the canvas. Internally, Pac-Man\
    \ has `x_speed` and `y_speed` (initially he’s moving to the right). He also has\
    \ an `angle` property that determines the direction he’s pointing and a `mouth_angle`\
    \ property to record where his mouth is in its chomping cycle. Add Listing [8-2](#A455241_1_En_8_Chapter.xhtml#Par10)\
    \ to your `objects.js` library. Note that no default values are provided.\n\n\
    ```javascript\nfunction PacMan(x, y, radius, speed) {\n  this.x = x;\n  this.y\
    \ = y;\n  this.radius = radius;\n  this.speed = speed;\n  this.angle = 0;\n  this.x_speed\
    \ = speed;\n  this.y_speed = 0;\n  this.time = 0;\n  this.mouth = 0;\n}\n```\n\
    \n**Listing 8-2** The `PacMan` Constructor\n\nThe `PacMan.prototype.draw` method\
    \ should look fairly familiar. It’s the same as that for `Asteroid`. Add Listing\
    \ [8-3](#A455241_1_En_8_Chapter.xhtml#Par12) after the constructor.\n\n```javascript\n\
    PacMan.prototype.draw = function(ctx) {\n  ctx.save();\n  ctx.translate(this.x,\
    \ this.y);\n  ctx.rotate(this.angle);\n  draw_pacman(ctx, this.radius, this.mouth);\n\
    \  ctx.restore();\n}\n```\n\n**Listing 8-3** The `PacMan.prototype.draw` Method\n\
    \nNow, before we code the behavior of our Pac-Man in the `PacMan.prototype.update`\
    \ function, we need a few helper functions. The main helper function we need is\
    \ one that will turn our Pac-Man through 90 degrees, either left or right. Listing\
    \ [8-4](#A455241_1_En_8_Chapter.xhtml#Par14) shows the new function; add it to\
    \ your library.\n\n```javascript\nPacMan.prototype.turn = function(direction)\
    \ {\n  if(this.y_speed) {\n    // if we are travelling vertically\n    // set\
    \ the horizontal speed and apply the direction\n    this.x_speed = -direction\
    \ * this.y_speed;\n    // clear the vertical speed and rotate\n    this.y_speed\
    \ = 0;\n    this.angle = this.x_speed > 0 ? 0 : Math.PI;\n  } else {\n    // if\
    \ we are travelling horizontally\n    // set the vertical speed and apply the\
    \ direction\n    this.y_speed = direction * this.x_speed;\n    // clear the horizontal\
    \ speed and rotate\n    this.x_speed = 0;\n    this.angle = this.y_speed > 0 ?\
    \ 0.5 * Math.PI : 1.5 * Math.PI;\n  }\n}\n```\n\n**Listing 8-4** The `PacMan.prototype.turn`\
    \ Method\n\nThis function relies on the restriction that our Pac-Man can only\
    \ move on the horizontal and vertical. That is, we rely on the fact that either\
    \ the `x_speed` or the `y_speed` will always be 0. The first thing the function\
    \ does is test whether we’re moving vertically or horizontally. It then changes\
    \ the direction of travel accordingly and moves the angle so Pac-Man always faces\
    \ in the correct direction. The function takes an argument that’s used to select\
    \ whether it’s a left turn or a right turn. To make the API clearer, we can add\
    \ a few intermediate methods, as shown in Listing [8-5](#A455241_1_En_8_Chapter.xhtml#Par17).\n\
    \n```javascript\nPacMan.prototype.turn_left = function() {\n  this.turn(-1);\n\
    }\n\nPacMan.prototype.turn_right = function() {\n  this.turn(1);\n}\n```\n\n**Listing\
    \ 8-5** Supporting Methods Make the API Nice\n\nWith these, we don’t need to remember\
    \ the helper function API rules, we can simply call the appropriate function to\
    \ turn Pac-Man left or right. Now we can use the functions in a very clear way\
    \ in our `PacMan.prototype.update` function, keeping the code clear and concise.\
    \ Add the code from Listing [8-6](#A455241_1_En_8_Chapter.xhtml#Par19).\n\n```javascript\n\
    PacMan.prototype.update = function(elapsed, width, height) {\n  // an average\
    \ of once per 100 frames\n  if(Math.random() <= 0.01) {\n    if(Math.random()\
    \ < 0.5) {\n      this.turn_left();\n    } else {\n      this.turn_right();\n\
    \    }\n  }\n  if(this.x - this.radius + elapsed * this.x_speed > width) {\n \
    \   this.x = -this.radius;\n  }\n  if(this.x + this.radius + elapsed * this.x_speed\
    \ < 0) {\n    this.x = width + this.radius;\n  }\n  if(this.y - this.radius +\
    \ elapsed * this.y_speed > height) {\n    this.y = -this.radius;\n  }\n  if(this.y\
    \ + this.radius + elapsed * this.y_speed < 0) {\n    this.y = height + this.radius;\n\
    \  }\n  this.x += this.x_speed * elapsed;\n  this.y += this.y_speed * elapsed;\n\
    \  this.time += elapsed;\n  this.mouth = Math.abs(Math.sin(2 * Math.PI * this.time));\n\
    }\n```\n\n**Listing 8-6** The `PacMan.prototype.update` Method\n\nThe first code\
    \ block only runs, on average, once per 100 frames. It randomly chooses either\
    \ the `turn_left` or `turn_right` functions to call. This controls the `x_speed`\
    \ and `y_speed` properties as well as the `angle` property. The next four code\
    \ blocks should be familiar from the `Asteroid.prototype.update` function mentioned\
    \ earlier. In each block we check to see if we’re about to cross one edge of the\
    \ canvas. If we do cross the edge, then we’re positioned on the opposite side\
    \ of the canvas. With this move done, we update the `x` and `y` coordinates as\
    \ usual. Notice we’ve removed any reliance on the global context object. We take\
    \ `width` and `height` arguments and use these to determine where the `x` and\
    \ `y` attributes will wrap. Finally, we have two lines that update the `mouth`\
    \ value, which determines how open the mouth is. The first line increments the\
    \ `time` by the elapsed time. The second line updates the `mouth` to the absolute\
    \ value of the sine of the `time` value. This causes `mouth` to progress in a\
    \ sine wave that opens and shuts the mouth twice per second.\n\nCreate a global\
    \ `PacMan` object and update your global `draw` and `update` functions to draw\
    \ and update it. You should see when you open the file in your browser that Pac-Man\
    \ is chomping away and taking random turns. Figure [8-1](#A455241_1_En_8_Chapter.xhtml#Fig1)\
    \ shows the result.\n\n![A455241_1_En_8_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_8_Fig1_HTML.jpg)\n\
    \n**Figure 8-1** Pac-Man snapping and turning\n\n## The Ghost Object"
