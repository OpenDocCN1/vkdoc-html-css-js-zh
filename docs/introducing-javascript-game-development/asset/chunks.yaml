  trans: '

    ## 总结


    在本章中，我们为飞船对象添加了大量可控属性。我们绑定了事件监听器，从而能够控制飞船的移动。我们引入了一个投射物对象，并通过飞船上的函数触发投射物的生成。当按下空格键时，我们会调用这个函数，但每四分之一秒仅限一次。我们还对投射物群体进行了管理，使它们在游戏场景中持续一秒钟后便被销毁。本章非常快速地新增了这些功能。如果你遇到任何问题，请仔细重读本章，直到对已发生的内容了然于胸。
    © Graeme Stuart 2017 Graeme Stuart《Introducing JavaScript Game Development》`doi.org/10.1007/978-1-4842-3252-1_12`


    # 12. 碰撞检测


    Graeme Stuart¹ (1) 英国莱斯特郡马基特哈伯勒


    本章我们将探讨如何检测对象之间的碰撞。现在我们已经能够控制飞船并发射投射物，接下来需要考虑承受伤害和获取分数的问题。这要求我们检测飞船与小行星之间的碰撞（涉及伤害），以及投射物与小行星之间的碰撞（涉及得分）。我们将采用简单的圆形碰撞检测方法，因此所有对象都必须近似为圆形。计算方法非常简单：首先，你需要计算两个圆心之间的距离。如果该距离小于两个圆半径之和，那么这两个圆就是重叠的。


    ## 快速重构

    '
- fmt: "# 排版后的内容\n\n我们将增加复杂性，因此首先将现有功能封装到一个`AsteroidsGame`类中。这有很多优点，主要好处是整理全局作用域。我们希望尽可能保持全局作用域清晰，以便游戏能够与页面上可能存在的其他代码良好协作。以这种方式保持代码整洁迫使我们保持组织性，并允许我们以可控的方式增加复杂性。\n\
    \n创建一个新文件夹，并将样式表以及`drawing.js`和`objects.js`库复制过来。添加一个名为`exercise12.html`的新文件。让我们从编写我们希望能够使用的代码开始。清单[12-1](#A455241_1_En_12_Chapter.xhtml#Par5)展示了我们可能想要的工作方式。\n\
    \n```html\n<!doctype html>\n<html>\n  <head>\n    <title>Asteroids</title>\n \
    \   <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
    ></script>\n    <script src=\"objects.js\"></script>\n    <script src=\"game.js\"\
    ></script>\n  </head>\n  <body>\n    <h1>Asteroids</h1>\n    <canvas id=\"asteroids\"\
    \ width=\"600\" height=\"600\" tabindex=\"1\"></canvas>\n    <script>\n      'use\
    \ strict';\n      var game = new AsteroidsGame(\"asteroids\");\n    </script>\n\
    \  </body>\n</html>\n```\n\n**清单 12-1** 我们的游戏作为一行代码\n\n在创建`AsteroidsGame`类之前考虑它，是确保我们构建良好接口的有用方法。游戏实际上需要什么信息？它真正需要的只是知道在哪里绘制自己。我们希望游戏在给定的画布上运行，因此我们将画布元素的`id`属性传递给游戏构造函数。一个页面上可能有多个游戏和/或多个画布。注意页面头部有一个名为`game.js`的新脚本元素。我们将在这里编写新对象的代码。\n\
    \n当然，现在这还不行。我们的任务是获取上一个练习中的代码，并将其全部放入新库中的`AsteroidsGame`类中。我们已经定义了API的一个元素。让我们通过创建`AsteroidsGame`构造函数来编码到这个接口。将清单[12-2](#A455241_1_En_12_Chapter.xhtml#Par8)中的代码放入新的`game.js`文件中。\n\
    \n```javascript\nvar AsteroidsGame = function(id) {\n  this.canvas = document.getElementById(id);\n\
    \  this.c = this.canvas.getContext(\"2d\");\n  this.canvas.focus();\n  this.guide\
    \ = false;\n  this.ship_mass = 10;\n  this.ship_radius = 15;\n  this.asteroid_mass\
    \ = 5000;   // Mass of asteroids\n  this.asteroid_push = 500000; // max force\
    \ to apply in one frame\n  this.ship = new Ship(\n    this.canvas.width / 2,\n\
    \    this.canvas.height / 2,\n    1000, 200\n  );\n  this.projectiles = [];\n\
    \  this.asteroids = [];\n  this.asteroids.push(this.moving_asteroid());\n  this.canvas.addEventListener(\"\
    keydown\", this.keyDown.bind(this), true);\n  this.canvas.addEventListener(\"\
    keyup\", this.keyUp.bind(this), true);\n  window.requestAnimationFrame(this.frame.bind(this));\n\
    }\n```\n\n**清单 12-2** `AsteroidsGame`构造函数\n\n构造函数接受一个参数：我们想要在其上绘制游戏的画布元素的`id`属性。我们使用它来创建对画布的引用。我们还提取了对2D画布上下文的引用，并将其存储为`this.c`以便于访问。然后我们将焦点设置在画布上，以便按键能够正确注册（如果运行多个画布和多个游戏，这可能最好留给调用代码处理）。然后我们设置一些属性，这些属性以前要么是全局变量，要么是代码中出现的“魔法数字”。这些在创建飞船和小行星时将会很有用。\n\
    \n然后我们创建一个新的飞船，并将`projectiles`和`asteroids`属性设置为空数组。通过调用新的`AsteroidsGame.prototype.moving_asteroid`辅助方法，我们将一个移动的小行星添加到`asteroids`数组中。最后，我们连接一些事件处理代码并启动游戏循环。注意，我们将这些回调函数“绑定”到游戏实例。\n\
    \n这仍然不行。让我们逐步构建必要的代码。在`AsteroidsGame.prototype.moving_asteroid`中，我们创建一个小行星，推动它，旋转它，然后返回它。我们使用另外两个辅助方法来实现：`AsteroidsGame.prototype.new_asteroid`和`AsteroidsGame.prototype.push_asteroid`。实现如清单[12-3](#A455241_1_En_12_Chapter.xhtml#Par13)所示。\n\
    \n```javascript\nAsteroidsGame.prototype.moving_asteroid = function(elapsed) {\n\
    \  var asteroid = this.new_asteroid();\n  this.push_asteroid(asteroid, elapsed);\n\
    \  return asteroid;\n}\n\nAsteroidsGame.prototype.new_asteroid = function() {\n\
    \  return new Asteroid(\n    this.canvas.width * Math.random(),\n    this.canvas.height\
    \ * Math.random(),\n    this.asteroid_mass\n  );\n}\n\nAsteroidsGame.prototype.push_asteroid\
    \ = function(asteroid, elapsed) {\n  elapsed = elapsed || 0.015;\n  asteroid.push(2\
    \ * Math.PI * Math.random(), this.asteroid_push, elapsed);\n  asteroid.twist(\n\
    \    (Math.random() - 0.5) * Math.PI * this.asteroid_push * 0.02,\n    elapsed\n\
    \  );\n}\n```\n\n**清单 12-3** 创建小行星的辅助方法\n\n`AsteroidsGame.prototype.new_asteroid`方法简单地使用`asteroid_mass`属性在随机位置创建一个小行星。`AsteroidsGame.prototype.push_asteroid`辅助方法使用`asteroid_push`属性作为力来推动和旋转小行星。它会在提供的经过时间上推动。如果没有提供经过时间，则假设标准帧率为60\
    \ fps（每秒帧数）。\n\n它仍然不行。清单[12-4](#A455241_1_En_12_Chapter.xhtml#Par16)中显示的事件处理函数是`AsteroidsGame.prototype.key_handler`函数的简单包装器，它取代了旧的`key_handler`函数。在函数内部，我们引用`this.ship`而不是仅仅`ship`。同时注意添加了向下箭头处理程序，以及使用G键切换`this.guide`属性。\n\
    \n```javascript\nAsteroidsGame.prototype.keyDown = function(e) {\n  this.key_handler(e,\
    \ true);\n}\n\nAsteroidsGame.prototype.keyUp = function(e) {\n  this.key_handler(e,\
    \ false);\n}\n\nAsteroidsGame.prototype.key_handler = function(e, value) {\n \
    \ var nothing_handled = false;\n  switch(e.key || e.keyCode) {\n    case \"ArrowLeft\"\
    :\n    case 37: // left arrow\n      this.ship.left_thruster = value;\n      break;\n\
    \    case \"ArrowUp\":\n    case 38: // up arrow\n      this.ship.thruster_on\
    \ = value;\n      break;\n    case \"ArrowRight\":\n    case 39: // right arrow\n\
    \      this.ship.right_thruster = value;\n      break;\n    case \"ArrowDown\"\
    :\n    case 40:\n      this.ship.retro_on = value;\n      break;\n    case \"\
    \ \":\n    case 32: //spacebar\n      this.ship.trigger = value;\n      break;\n\
    \    case \"g\":\n    case 71: // g for guide\n      if(value) this.guide = !this.guide;\n\
    \      break;\n    default:\n      nothing_handled = true;\n  }\n  if(!nothing_handled)\
    \ e.preventDefault();\n}\n```\n\n**清单 12-4** 按键事件处理方法\n\n构造函数中的最后一行以`AsteroidsGame.prototype.frame`方法作为回调调用了`window.requestAnimationFrame`。清单[12-5](#A455241_1_En_12_Chapter.xhtml#Par18)取代了旧的全局`frame`函数，做的事情大致相同，主要区别在于我们调用了`this.update`和`this.draw`，并将前一个时间戳存储为`this.previous`。\n\
    \n```javascript\nAsteroidsGame.prototype.frame = function(timestamp) {\n  if (!this.previous)\
    \ this.previous = timestamp;\n  var elapsed = timestamp - this.previous;\n  this.update(elapsed\
    \ / 1000);\n  this.draw();\n  this.previous = timestamp;\n  window.requestAnimationFrame(this.frame.bind(this));\n\
    }\n```\n\n**清单 12-5** `AsteroidsGame.prototype.frame`方法\n\n注意，`this.frame`函数在传递给`window.requestAnimationFrame`时被绑定到游戏实例。这强制在调用`frame`函数时将`this`关键字设置为游戏实例。\n\
    \n清单[12-6](#A455241_1_En_12_Chapter.xhtml#Par21)中的`AsteroidsGame.prototype.update`方法控制所有游戏元素。它更新所有小行星、飞船和所有抛射体。它控制死亡抛射体的移除，以及在飞船已装弹且扳机扣下时创建新的抛射体。它不包含新内容，但我们现在总是引用游戏对象的属性。\n\
    \n```javascript\nAsteroidsGame.prototype.update = function(elapsed) {\n  this.ship.compromised\
    \ = false;\n  this.asteroids.forEach(function(asteroid) {\n    asteroid.update(elapsed,\
    \ this.c);\n  }, this);\n  this.ship.update(elapsed, this.c);\n  this.projectiles.forEach(function(p,\
    \ i, projectiles) {\n    p.update(elapsed, this.c);\n    if(p.life <= 0) {\n \
    \     projectiles.splice(i, 1);\n    }\n  }, this);\n  if(this.ship.trigger &&\
    \ this.ship.loaded) {\n    this.projectiles.push(this.ship.projectile(elapsed));\n\
    \  }\n}\n```\n\n**清单 12-6** `AsteroidsGame.prototype.update`方法\n\n`AsteroidsGame.prototype.update`方法多次调用`Array.prototype.forEach`方法。该方法接受两个参数：一个为数组中每个元素调用的回调函数，以及一个用于设置回调函数内部`this`关键字的值。注意，我们将`this`作为第二个参数传递，以便在回调函数内部可以正确地将游戏实例引用为`this`。你可以在所有对`Array.prototype.forEach`的调用中看到这一点。\n\
    \n清单[12-7](#A455241_1_En_12_Chapter.xhtml#Par24)中显示的`AsteroidsGame.prototype.draw`方法负责绘制整个游戏。它绘制所有小行星、飞船和所有抛射体。它还使用了`Array.prototype.forEach`并将`this`作为第二个参数传递，与`AsteroidsGame.prototype.update`中一样。\n\
    \n```javascript\nAsteroidsGame.prototype.draw = function() {\n  this.c.clearRect(0,\
    \ 0, this.canvas.width, this.canvas.height);\n  if(this.guide) {\n    draw_grid(this.c);\n\
    \    this.asteroids.forEach(function(asteroid) {\n      draw_line(this.c, asteroid,\
    \ this.ship);\n    }, this);\n  }\n  this.asteroids.forEach(function(asteroid)\
    \ {\n    asteroid.draw(this.c, this.guide);\n  }, this);\n  this.ship.draw(this.c,\
    \ this.guide);\n  this.projectiles.forEach(function(p) {\n    p.draw(this.c);\n\
    \  }, this);\n}\n```\n\n**清单 12-7** `AsteroidsGame.prototype.draw`方法\n\n该方法与上一个例子中的`draw`函数相当相似。它可选地绘制网格，并使用新的`draw_line`函数在小行星和飞船之间绘制线条。仅当设置了`this.guide`属性时才执行此操作。`draw_line`函数位于`drawing.js`中，如清单[12-8](#A455241_1_En_12_Chapter.xhtml#Par27)所示。将该函数添加到你的`drawing.js`库中。\n\
    \n```javascript\nfunction draw_line(ctx, obj1, obj2) {\n  ctx.save();\n  ctx.strokeStyle\
    \ = \"white\";\n  ctx.lineWidth = 0.5;\n  ctx.beginPath();\n  ctx.moveTo(obj1.x,\
    \ obj1.y);\n  ctx.lineTo(obj2.x, obj2.y);\n  ctx.stroke();\n  ctx.restore();\n\
    }\n```\n\n**清单 12-8** `draw_line`函数\n\n现在我们有了一个全面的`AsteroidsGame`类，它可以在任何画布上运行游戏。我们已经将其连接到键盘事件，并通过自己的事件循环逐帧运行。没有代码在`AsteroidsGame`类之外触发。我们使用了一些非常简单的辅助函数。这一切都相当直接。刷新页面以查看游戏是否按预期运行。尝试按下G键切换`guide`属性。"
  raw: 'We’re going to add complexity, so we’ll start by wrapping existing functionality
    into an AsteroidsGame class. This has many advantages, the main one being to tidy
    up our global scope. We want to keep the global scope as clear as possible so
    our game can work well with other code that may be on the page. Keeping our code
    tidy in this way forces us to be organized and allows us to increase the complexity
    in a manageable way. Create a new folder and copy our stylesheet and the drawing.js
    and objects.js libraries across. Add a new file called exercise12.html. Let’s
    start by writing the code we’d like to be able to work with. Listing [12-1](#A455241_1_En_12_Chapter.xhtml#Par5)
    shows how we might want to work. <!doctype html> <html>   <head>     <title>Asteroids</title>
        <link rel="stylesheet" href="styles.css">     <script src="drawing.js"></script>
        <script src="objects.js"></script>     <script src="game.js"></script>   </head>
      <body>     <h1>Asteroids</h1>     <canvas id="asteroids" width="600" height="600"
    tabindex="1"></canvas>     <script>       ''use strict'';       var game = new
    AsteroidsGame("asteroids");     </script>   </body> </html> Listing 12-1 Our Game
    as a One-Liner Thinking about our AsteroidsGame class before we create it is a
    useful way to ensure that we build a good interface. What information does the
    game actually need? All it really needs is to know where to draw itself. We want
    our game to run on a given canvas, so we pass in the canvas element’s id attribute
    into the game constructor. There may be multiple games and/or multiple canvases
    on a page. Notice there’s a new script element in the page head called game.js.
    This is where we’ll code up our new object. Now, of course, this doesn''t work.
    Our job is to take the code from the previous exercise and put it all into an
    AsteroidsGame class in the new library. We’ve already defined an element of the
    API. Let’s code to this interface by creating the AsteroidsGame constructor. Place
    the code from Listing [12-2](#A455241_1_En_12_Chapter.xhtml#Par8) into the new
    game.js file. var AsteroidsGame = function(id) {   this.canvas = document.getElementById(id);
      this.c = this.canvas.getContext("2d");   this.canvas.focus();   this.guide =
    false;   this.ship_mass = 10;   this.ship_radius = 15;   this.asteroid_mass =
    5000;   // Mass of asteroids   this.asteroid_push = 500000; // max force to apply
    in one frame   this.ship = new Ship(     this.canvas.width / 2,     this.canvas.height
    / 2,     1000, 200   );   this.projectiles = [];   this.asteroids = [];   this.asteroids.push(this.moving_asteroid());
      this.canvas.addEventListener("keydown", this.keyDown.bind(this), true);   this.canvas.addEventListener("keyup",
    this.keyUp.bind(this), true);   window.requestAnimationFrame(this.frame.bind(this));
    } Listing 12-2 The AsteroidsGame Constructor The constructor takes one argument:
    the id attribute of the canvas element we want to draw our game onto. We use this
    to create a reference to a canvas. We also extract a reference to the 2D canvas
    context and store it as this.c for easy access. We then set the focus on the canvas
    so key presses will register properly (this might be better left to the calling
    code if many canvases and many games are running). We then set some properties
    that were previously either global variables or were “magic numbers” that appeared
    in the code. These will be useful when we create ships and asteroids . Then we
    create a new ship and set the projectiles and asteroids properties to blank arrays.
    We add a single moving asteroid into the asteroids array by calling the new AsteroidsGame.prototype.moving_asteroid
    helper method. Finally, we connect some event handler code and start the game
    loop. Notice we “bind” these callback functions to the game instance. This still
    doesn''t work. Let’s build out the necessary code piece by piece. In AsteroidsGame.prototype.moving_asteroid,
    we create an asteroid, push it, twist it, and return it. We do this using two
    more helper methods: AsteroidsGame.prototype.new_asteroid and AsteroidsGame.prototype.push_asteroid.
    The implementation is shown in Listing [12-3](#A455241_1_En_12_Chapter.xhtml#Par13).
    AsteroidsGame.prototype.moving_asteroid = function(elapsed) {   var asteroid =
    this.new_asteroid();   this.push_asteroid(asteroid, elapsed);   return asteroid;
    } AsteroidsGame.prototype.new_asteroid = function() {   return new Asteroid(     this.canvas.width
    * Math.random(),     this.canvas.height * Math.random(),     this.asteroid_mass
      ); } AsteroidsGame.prototype.push_asteroid = function(asteroid, elapsed) {   elapsed
    = elapsed || 0.015;   asteroid.push(2 * Math.PI * Math.random(), this.asteroid_push,
    elapsed);   asteroid.twist(     (Math.random() - 0.5) * Math.PI * this.asteroid_push
    * 0.02,     elapsed   ); } Listing 12-3 Helper Methods for Creating Asteroids
    The AsteroidsGame.prototype.new_asteroid method simply creates an asteroid in
    a random position with the asteroid_mass property. The AsteroidsGame.prototype.push_asteroid
    helper method pushes and twists an asteroid using the asteroid_push property as
    the force. It pushes over the provided elapsed time. If no elapsed time is provided,
    it assumes a standard frame at 60 fps (frames per second). It still doesn’t work.
    The event handler functions shown in Listing [12-4](#A455241_1_En_12_Chapter.xhtml#Par16)
    are simple wrappers for the AsteroidsGame.prototype.key_handler function, which
    replaces the old key_handler function. Inside it, we refer to this.ship rather
    than just ship. Notice also the addition of a down arrow handler and the use of
    the G key to toggle the this.guide property. AsteroidsGame.prototype.keyDown =
    function(e) {   this.key_handler(e, true); } AsteroidsGame.prototype.keyUp = function(e)
    {   this.key_handler(e, false); } AsteroidsGame.prototype.key_handler = function(e,
    value) {   var nothing_handled = false;   switch(e.key || e.keyCode) {     case
    "ArrowLeft":     case 37: // left arrow       this.ship.left_thruster = value;
          break;     case "ArrowUp":     case 38: // up arrow       this.ship.thruster_on
    = value;       break;     case "ArrowRight":     case 39: // right arrow       this.ship.right_thruster
    = value;       break;     case "ArrowDown":     case 40:       this.ship.retro_on
    = value;       break;     case " ":     case 32: //spacebar       this.ship.trigger
    = value;       break;     case "g":     case 71: // g for guide       if(value)
    this.guide = !this.guide;       break;     default:       nothing_handled = true;
      }   if(!nothing_handled) e.preventDefault(); } Listing 12-4 The Key Event Handling
    Methods The final line in the constructor calls window.requestAnimationFrame with
    the AsteroidsGame.prototype.frame method as the callback. Listing [12-5](#A455241_1_En_12_Chapter.xhtml#Par18)
    replaces the old global frame function and does much the same, the main difference
    being that we call this.update and this.draw and store the previous timestamp
    as this.previous. AsteroidsGame.prototype.frame = function(timestamp) {   if (!this.previous)
    this.previous = timestamp;   var elapsed = timestamp - this.previous;   this.update(elapsed
    / 1000);   this.draw();   this.previous = timestamp;   window.requestAnimationFrame(this.frame.bind(this));
    } Listing 12-5 The AsteroidsGame.prototype. frame Method Notice that the this.frame
    function is bound to the game instance when passed into window.requestAnimationFrame.
    This forces the this keyword to be set to the game instance when the frame function
    is called. The AsteroidsGame.prototype.update method in Listing [12-6](#A455241_1_En_12_Chapter.xhtml#Par21)
    controls all the game elements. It updates all the asteroids, the ship, and all
    the projectiles. It controls the removal of dead projectiles and the creation
    of new projectiles when the ship is loaded and the trigger is pulled. It contains
    nothing new, but we’re now always referencing attributes of our game object. AsteroidsGame.prototype.update
    = function(elapsed) {   this.ship.compromised = false;   this.asteroids.forEach(function(asteroid)
    {     asteroid.update(elapsed, this.c);   }, this);   this.ship.update(elapsed,
    this.c);   this.projectiles.forEach(function(p, i, projectiles) {     p.update(elapsed,
    this.c);     if(p.life <= 0) {       projectiles.splice(i, 1);     }   }, this);
      if(this.ship.trigger && this.ship.loaded) {     this.projectiles.push(this.ship.projectile(elapsed));
      } } Listing 12-6 The AsteroidsGame.prototype.update Method The AsteroidsGame.prototype.
    update method makes many calls to the Array.prototype.forEach method. The method
    takes two arguments: a callback function called for each element in the array
    and a value to set the value of the this keyword available within the callback
    function. Notice that we’re passing this as the second argument so that within
    the callback function we can correctly refer to the game instance as this from
    within the callback. You can see this happening in all the calls to Array.prototype.forEach.
    The AsteroidsGame.prototype.draw method shown in Listing [12-7](#A455241_1_En_12_Chapter.xhtml#Par24)
    is in charge of drawing the whole game. It draws all the asteroids, the ship,
    and all the projectiles. It also makes use of Array.prototype.forEach and passes
    this as the second argument, as in AsteroidsGame.prototype.update. AsteroidsGame.prototype.draw
    = function() {   this.c.clearRect(0, 0, this.canvas.width, this.canvas.height);
      if(this.guide) {     draw_grid(this.c);     this.asteroids.forEach(function(asteroid)
    {       draw_line(this.c, asteroid, this.ship);     }, this);   }   this.asteroids.forEach(function(asteroid)
    {     asteroid.draw(this.c, this.guide);   }, this);   this.ship.draw(this.c,
    this.guide);   this.projectiles.forEach(function(p) {     p.draw(this.c);   },
    this); } Listing 12-7 The AsteroidsGame.prototype. draw Method The method is fairly
    similar to the draw function in the last example. It optionally draws the grid
    and draws lines between asteroids and the ship using the new draw_line function.
    It only does this if the this.guide property is set. The draw_line function is
    in drawing.js and is shown in Listing [12-8](#A455241_1_En_12_Chapter.xhtml#Par27).
    Add the function to your drawing.js library. function draw_line(ctx, obj1, obj2)
    {   ctx.save();   ctx.strokeStyle = "white";   ctx.lineWidth = 0.5;   ctx.beginPath();
      ctx.moveTo(obj1.x, obj1.y);   ctx.lineTo(obj2.x, obj2.y);   ctx.stroke();   ctx.restore();
    } Listing 12-8 The draw_line Function Now we have a comprehensive AsteroidsGame
    class that can be used to run a game on any canvas. We’ve hooked it up to keyboard
    events and run it frame by frame with its own event loop. There’s no code triggered
    outside of the AsteroidsGame class. We make use of some very simple helper functions.
    It’s all pretty straightforward. Refresh the page to see if the game is working
    as expected. Try toggling the guide property by pressing the G key.'
  trans: "\n# 排版后的内容\n\n我们将增加复杂性，因此首先将现有功能封装到一个`AsteroidsGame`类中。这有很多优点，主要好处是整理全局作用域。我们希望尽可能保持全局作用域清晰，以便游戏能够与页面上可能存在的其他代码良好协作。以这种方式保持代码整洁迫使我们保持组织性，并允许我们以可控的方式增加复杂性。\n\
    \n创建一个新文件夹，并将样式表以及`drawing.js`和`objects.js`库复制过来。添加一个名为`exercise12.html`的新文件。让我们从编写我们希望能够使用的代码开始。清单\
    \ 12-1 展示了我们可能想要的工作方式。\n\n```html\n<!doctype html>\n<html>\n  <head>\n    <title>Asteroids</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
    ></script>\n    <script src=\"objects.js\"></script>\n    <script src=\"game.js\"\
    ></script>\n  </head>\n  <body>\n    <h1>Asteroids</h1>\n    <canvas id=\"asteroids\"\
    \ width=\"600\" height=\"600\" tabindex=\"1\"></canvas>\n    <script>\n      'use\
    \ strict';\n      var game = new AsteroidsGame(\"asteroids\");\n    </script>\n\
    \  </body>\n</html>\n```\n\n**清单 12-1** 我们的游戏作为一行代码\n\n在创建`AsteroidsGame`类之前考虑它，是确保我们构建良好接口的有用方法。游戏实际上需要什么信息？它真正需要的只是知道在哪里绘制自己。我们希望游戏在给定的画布上运行，因此我们将画布元素的`id`属性传递给游戏构造函数。一个页面上可能有多个游戏和/或多个画布。注意页面头部有一个名为`game.js`的新脚本元素。我们将在这里编写新对象的代码。\n\
    \n当然，现在这还不行。我们的任务是获取上一个练习中的代码，并将其全部放入新库中的`AsteroidsGame`类中。我们已经定义了 API 的一个元素。让我们通过创建`AsteroidsGame`构造函数来编码到这个接口。将清单\
    \ 12-2 中的代码放入新的`game.js`文件中。\n\n```javascript\nvar AsteroidsGame = function(id)\
    \ {\n  this.canvas = document.getElementById(id);\n  this.c = this.canvas.getContext(\"\
    2d\");\n  this.canvas.focus();\n  this.guide = false;\n  this.ship_mass = 10;\n\
    \  this.ship_radius = 15;\n  this.asteroid_mass = 5000;   // Mass of asteroids\n\
    \  this.asteroid_push = 500000; // max force to apply in one frame\n  this.ship\
    \ = new Ship(\n    this.canvas.width / 2,\n    this.canvas.height / 2,\n    1000,\
    \ 200\n  );\n  this.projectiles = [];\n  this.asteroids = [];\n  this.asteroids.push(this.moving_asteroid());\n\
    \  this.canvas.addEventListener(\"keydown\", this.keyDown.bind(this), true);\n\
    \  this.canvas.addEventListener(\"keyup\", this.keyUp.bind(this), true);\n  window.requestAnimationFrame(this.frame.bind(this));\n\
    }\n```\n\n**清单 12-2** `AsteroidsGame`构造函数\n\n构造函数接受一个参数：我们想要在其上绘制游戏的画布元素的`id`属性。我们使用它来创建对画布的引用。我们还提取了对\
    \ 2D 画布上下文的引用，并将其存储为`this.c`以便于访问。然后我们将焦点设置在画布上，以便按键能够正确注册（如果运行多个画布和多个游戏，这可能最好留给调用代码处理）。然后我们设置一些属性，这些属性以前要么是全局变量，要么是代码中出现的“魔法数字”。这些在创建飞船和小行星时将会很有用。\n\
    \n然后我们创建一个新的飞船，并将`projectiles`和`asteroids`属性设置为空数组。通过调用新的`AsteroidsGame.prototype.moving_asteroid`辅助方法，我们将一个移动的小行星添加到`asteroids`数组中。最后，我们连接一些事件处理代码并启动游戏循环。注意，我们将这些回调函数“绑定”到游戏实例。\n\
    \n这仍然不行。让我们逐步构建必要的代码。在`AsteroidsGame.prototype.moving_asteroid`中，我们创建一个小行星，推动它，旋转它，然后返回它。我们使用另外两个辅助方法来实现：`AsteroidsGame.prototype.new_asteroid`和`AsteroidsGame.prototype.push_asteroid`。实现如清单\
    \ 12-3 所示。\n\n```javascript\nAsteroidsGame.prototype.moving_asteroid = function(elapsed)\
    \ {\n  var asteroid = this.new_asteroid();\n  this.push_asteroid(asteroid, elapsed);\n\
    \  return asteroid;\n}\n\nAsteroidsGame.prototype.new_asteroid = function() {\n\
    \  return new Asteroid(\n    this.canvas.width * Math.random(),\n    this.canvas.height\
    \ * Math.random(),\n    this.asteroid_mass\n  );\n}\n\nAsteroidsGame.prototype.push_asteroid\
    \ = function(asteroid, elapsed) {\n  elapsed = elapsed || 0.015;\n  asteroid.push(2\
    \ * Math.PI * Math.random(), this.asteroid_push, elapsed);\n  asteroid.twist(\n\
    \    (Math.random() - 0.5) * Math.PI * this.asteroid_push * 0.02,\n    elapsed\n\
    \  );\n}\n```\n\n**清单 12-3** 创建小行星的辅助方法\n\n`AsteroidsGame.prototype.new_asteroid`方法简单地使用`asteroid_mass`属性在随机位置创建一个小行星。`AsteroidsGame.prototype.push_asteroid`辅助方法使用`asteroid_push`属性作为力来推动和旋转小行星。它会在提供的经过时间上推动。如果没有提供经过时间，则假设标准帧率为\
    \ 60 fps（每秒帧数）。\n\n它仍然不行。清单 12-4 中显示的事件处理函数是`AsteroidsGame.prototype.key_handler`函数的简单包装器，它取代了旧的`key_handler`函数。在函数内部，我们引用`this.ship`而不是仅仅`ship`。同时注意添加了向下箭头处理程序，以及使用\
    \ G 键切换`this.guide`属性。\n\n```javascript\nAsteroidsGame.prototype.keyDown = function(e)\
    \ {\n  this.key_handler(e, true);\n}\n\nAsteroidsGame.prototype.keyUp = function(e)\
    \ {\n  this.key_handler(e, false);\n}\n\nAsteroidsGame.prototype.key_handler =\
    \ function(e, value) {\n  var nothing_handled = false;\n  switch(e.key || e.keyCode)\
    \ {\n    case \"ArrowLeft\":\n    case 37: // left arrow\n      this.ship.left_thruster\
    \ = value;\n      break;\n    case \"ArrowUp\":\n    case 38: // up arrow\n  \
    \    this.ship.thruster_on = value;\n      break;\n    case \"ArrowRight\":\n\
    \    case 39: // right arrow\n      this.ship.right_thruster = value;\n      break;\n\
    \    case \"ArrowDown\":\n    case 40:\n      this.ship.retro_on = value;\n  \
    \    break;\n    case \" \":\n    case 32: //spacebar\n      this.ship.trigger\
    \ = value;\n      break;\n    case \"g\":\n    case 71: // g for guide\n     \
    \ if(value) this.guide = !this.guide;\n      break;\n    default:\n      nothing_handled\
    \ = true;\n  }\n  if(!nothing_handled) e.preventDefault();\n}\n```\n\n**清单 12-4**\
    \ 按键事件处理方法\n\n构造函数中的最后一行以`AsteroidsGame.prototype.frame`方法作为回调调用了`window.requestAnimationFrame`。清单\
    \ 12-5 取代了旧的全局`frame`函数，做的事情大致相同，主要区别在于我们调用了`this.update`和`this.draw`，并将前一个时间戳存储为`this.previous`。\n\
    \n```javascript\nAsteroidsGame.prototype.frame = function(timestamp) {\n  if (!this.previous)\
    \ this.previous = timestamp;\n  var elapsed = timestamp - this.previous;\n  this.update(elapsed\
    \ / 1000);\n  this.draw();\n  this.previous = timestamp;\n  window.requestAnimationFrame(this.frame.bind(this));\n\
    }\n```\n\n**清单 12-5** `AsteroidsGame.prototype.frame`方法\n\n注意，`this.frame`函数在传递给`window.requestAnimationFrame`时被绑定到游戏实例。这强制在调用`frame`函数时将`this`关键字设置为游戏实例。\n\
    \n清单 12-6 中的`AsteroidsGame.prototype.update`方法控制所有游戏元素。它更新所有小行星、飞船和所有抛射体。它控制死亡抛射体的移除，以及在飞船已装弹且扳机扣下时创建新的抛射体。它不包含新内容，但我们现在总是引用游戏对象的属性。\n\
    \n```javascript\nAsteroidsGame.prototype.update = function(elapsed) {\n  this.ship.compromised\
    \ = false;\n  this.asteroids.forEach(function(asteroid) {\n    asteroid.update(elapsed,\
    \ this.c);\n  }, this);\n  this.ship.update(elapsed, this.c);\n  this.projectiles.forEach(function(p,\
    \ i, projectiles) {\n    p.update(elapsed, this.c);\n    if(p.life <= 0) {\n \
    \     projectiles.splice(i, 1);\n    }\n  }, this);\n  if(this.ship.trigger &&\
    \ this.ship.loaded) {\n    this.projectiles.push(this.ship.projectile(elapsed));\n\
    \  }\n}\n```\n\n**清单 12-6** `AsteroidsGame.prototype.update`方法\n\n`AsteroidsGame.prototype.update`方法多次调用`Array.prototype.forEach`方法。该方法接受两个参数：一个为数组中每个元素调用的回调函数，以及一个用于设置回调函数内部`this`关键字的值。注意，我们将`this`作为第二个参数传递，以便在回调函数内部可以正确地将游戏实例引用为`this`。你可以在所有对`Array.prototype.forEach`的调用中看到这一点。\n\
    \n清单 12-7 中显示的`AsteroidsGame.prototype.draw`方法负责绘制整个游戏。它绘制所有小行星、飞船和所有抛射体。它还使用了`Array.prototype.forEach`并将`this`作为第二个参数传递，与`AsteroidsGame.prototype.update`中一样。\n\
    \n```javascript\nAsteroidsGame.prototype.draw = function() {\n  this.c.clearRect(0,\
    \ 0, this.canvas.width, this.canvas.height);\n  if(this.guide) {\n    draw_grid(this.c);\n\
    \    this.asteroids.forEach(function(asteroid) {\n      draw_line(this.c, asteroid,\
    \ this.ship);\n    }, this);\n  }\n  this.asteroids.forEach(function(asteroid)\
    \ {\n    asteroid.draw(this.c, this.guide);\n  }, this);\n  this.ship.draw(this.c,\
    \ this.guide);\n  this.projectiles.forEach(function(p) {\n    p.draw(this.c);\n\
    \  }, this);\n}\n```\n\n**清单 12-7** `AsteroidsGame.prototype.draw`方法\n\n该方法与上一个例子中的`draw`函数相当相似。它可选地绘制网格，并使用新的`draw_line`函数在小行星和飞船之间绘制线条。仅当设置了`this.guide`属性时才执行此操作。`draw_line`函数位于`drawing.js`中，如清单\
    \ 12-8 所示。将该函数添加到你的`drawing.js`库中。\n\n```javascript\nfunction draw_line(ctx, obj1,\
    \ obj2) {\n  ctx.save();\n  ctx.strokeStyle = \"white\";\n  ctx.lineWidth = 0.5;\n\
    \  ctx.beginPath();\n  ctx.moveTo(obj1.x, obj1.y);\n  ctx.lineTo(obj2.x, obj2.y);\n\
    \  ctx.stroke();\n  ctx.restore();\n}\n```\n\n**清单 12-8** `draw_line`函数\n\n现在我们有了一个全面的`AsteroidsGame`类，它可以在任何画布上运行游戏。我们已经将其连接到键盘事件，并通过自己的事件循环逐帧运行。没有代码在`AsteroidsGame`类之外触发。我们使用了一些非常简单的辅助函数。这一切都相当直接。刷新页面以查看游戏是否按预期运行。尝试按下\
    \ G 键切换`guide`属性。\n"
- fmt: "# Ship vs. Asteroids\n\nNow we need to do some actual collision detection.\
    \ We’ll detect collisions between the circles that approximate the ship and the\
    \ asteroids. When the circle around the ship contacts the circle around an asteroid,\
    \ we’ll set a new `compromised` property on the ship. When the ship is in the\
    \ `compromised` state, it loses health. The first thing to do is to initialize\
    \ the required properties in the `Ship` constructor. Update your constructor,\
    \ as shown in Listing [12-9](#A455241_1_En_12_Chapter.xhtml#Par31).\n\n```\nfunction\
    \ Ship(x, y, power, weapon_power) {\n    this.super(x, y, 10, 20, 1.5 * Math.PI);\n\
    \    this.thruster_power = power;\n    this.steering_power = this.thruster_power\
    \ / 20;\n    this.right_thruster = false;\n    this.left_thruster = false;\n \
    \   this.thruster_on = false;\n    this.retro_on = false;\n    this.weapon_power\
    \ = weapon_power;\n    this.loaded = false;\n    this.weapon_reload_time = 0.25;\
    \ // seconds\n    this.time_until_reloaded = this.weapon_reload_time;\n    this.compromised\
    \ = false;\n    this.max_health = 2.0;\n    this.health = this.max_health;\n}\n\
    ```\n\nListing 12-9 Initialize the `compromised` and `health` Properties in the\
    \ Ship Constructor\n\nWe can also update the `Ship.prototype.draw` method to indicate\
    \ (when the guide is turned on) whether the ship is in the `compromised` state.\
    \ This is shown in Listing [12-10](#A455241_1_En_12_Chapter.xhtml#Par33).\n\n\
    ```\nShip.prototype.draw = function(c, guide) {\n    c.save();\n    c.translate(this.x,\
    \ this.y);\n    c.rotate(this.angle);\n    if(guide && this.compromised) {\n \
    \       c.save();\n        c.fillStyle = \"red\";\n        c.beginPath();\n  \
    \      c.arc(0, 0, this.radius, 0, 2 * Math.PI);\n        c.fill();\n        c.restore();\n\
    \    }\n    draw_ship(c, this.radius, {\n        guide: guide,\n        thruster:\
    \ this.thruster_on\n    });\n    c.restore();\n}\n```\n\nListing 12-10 Draw a\
    \ Red Circle When `compromised`\n\nWe could have placed this in the `draw_ship`\
    \ function and added an argument. That would probably be neater, but would take\
    \ longer to describe, so I’ll leave it as an optional exercise.\n\nNow we need\
    \ a general purpose collision function to test for collisions between any two\
    \ objects. The objects must have (`x`, `y`) coordinates and `radius` properties.\
    \ Add the functions in Listing [12-11](#A455241_1_En_12_Chapter.xhtml#Par36) at\
    \ the top of `game.js`.\n\n```\nfunction collision(obj1, obj2) {\n    return distance_between(obj1,\
    \ obj2) < (obj1.radius + obj2.radius);\n}\n\nfunction distance_between(obj1, obj2)\
    \ {\n    return Math.sqrt(Math.pow(obj1.x - obj2.x, 2) + Math.pow(obj1.y - obj2.y,\
    \ 2));\n}\n```\n\nListing 12-11 Collision Detection\n\nCollision between circles\
    \ is simple: the circles intersect if the distance between their centers is smaller\
    \ than the sum of their radii. We also split out the distance calculation into\
    \ its own function.\n\nTo implement collision detection, we need the game to check\
    \ each asteroid against the ship for collisions and to set the `ship.compromised`\
    \ property accordingly. Listing [12-12](#A455241_1_En_12_Chapter.xhtml#Par39)\
    \ shows the implementation.\n\n```\nAsteroidsGame.prototype.update = function(elapsed)\
    \ {\n    this.ship.compromised = false;\n    this.asteroids.forEach(function(asteroid)\
    \ {\n        asteroid.update(elapsed, this.c);\n        if(collision(asteroid,\
    \ this.ship)) {\n            this.ship.compromised = true;\n        }\n    },\
    \ this);\n    this.ship.update(elapsed, this.c);\n    this.projectiles.forEach(function(p,\
    \ i, projectiles) {\n        p.update(elapsed, this.c);\n        if(p.life <=\
    \ 0) {\n            projectiles.splice(i, 1);\n        }\n    }, this);\n    if(this.ship.trigger\
    \ && this.ship.loaded) {\n        this.projectiles.push(this.ship.projectile(elapsed));\n\
    \    }\n}\n```\n\nListing 12-12 Update `compromised` Property\n\nWe set the `ship.compromised`\
    \ property to `false` and then, as we loop over each asteroid, if a collision\
    \ is detected we set it to `true`. Notice that we also move things around to ensure\
    \ we test for collisions before we update the asteroids and the ship.\n\nRefresh\
    \ the page and admire the results. Press G to turn on the guide and you should\
    \ see that if we hit the asteroid with our ship, a red circle appears under the\
    \ ship!\n\n![A455241_1_En_12_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_12_Fig1_HTML.jpg)\n\
    \nFigure 12-1 Collision detection\n\n## Taking Damage\n\nNow let’s update things\
    \ so the ship takes damage when it’s `compromised`. Effectively, we’re giving\
    \ the ship a collision time limit (`max_health`—let’s say 2 seconds). This value\
    \ will be a property of the ship, so the `health` property can be topped up at\
    \ any time.\n\n```\nShip.prototype.update = function(elapsed, c) {\n    this.push(this.angle,\n\
    \        (this.thruster_on - this.retro_on) * this.thruster_power, elapsed\n \
    \   );\n    this.twist(\n        (this.right_thruster - this.left_thruster) *\
    \ this.steering_power, elapsed\n    );\n    this.loaded = this.time_until_reloaded\
    \ === 0;\n    if(!this.loaded) {\n        this.time_until_reloaded -= Math.min(elapsed,\
    \ this.time_until_reloaded);\n    }\n    if(this.compromised) {\n        this.health\
    \ -= Math.min(elapsed, this.health);\n    }\n    Mass.prototype.update.apply(this,\
    \ arguments);\n}\n```\n\nListing 12-13 Drain Health\n\nNotice how similar this\
    \ is to the reload time. Also notice how the retro-thruster is implemented.\n\n\
    Now we can’t see the ship’s health, so let’s draw it onto the canvas. Add the\
    \ following to the end of `AsteroidsGame.prototype.draw`:\n\n```\nthis.c.save();\n\
    this.c.font = \"18px arial\";\nthis.c.fillStyle = \"white\";\nthis.c.fillText(\"\
    health: \" + this.ship.health.toFixed(1), 10, this.canvas.height - 10);\nthis.c.restore();\n\
    ```\n\nNow refresh the page and admire your new health indicator. Try hitting\
    \ an asteroid and watch your health deplete. But we can do better than this! We’re\
    \ JavaScript ninjas by now.\n\nAdd the code from Listing [12-14](#A455241_1_En_12_Chapter.xhtml#Par48)\
    \ to the end of `objects.js`.\n\n```\nfunction Indicator(label, x, y, width, height)\
    \ {\n    this.label = label + \": \";\n    this.x = x;\n    this.y = y;\n    this.width\
    \ = width;\n    this.height = height;\n}\n\nIndicator.prototype.draw = function(c,\
    \ max, level) {\n    c.save();\n    c.strokeStyle = \"white\";\n    c.fillStyle\
    \ = \"white\";\n    c.font = this.height + \"pt Arial\";\n    var offset = c.measureText(this.label).width;\n\
    \    c.fillText(this.label, this.x, this.y + this.height - 1);\n    c.beginPath();\n\
    \    c.rect(offset + this.x, this.y, this.width, this.height);\n    c.stroke();\n\
    \    c.beginPath();\n    c.rect(offset + this.x, this.y, this.width * (max / level),\
    \ this.height);\n    c.fill();\n    c.restore()\n}\n```\n\nListing 12-14 Indicator\
    \ Class\n\nThe new `Indicator` constructor takes a `label`, a position (`x`, `y`),\
    \ and a size (`width`, `height`) as its arguments. Think of it as a rectangle\
    \ with a label. It has a `draw` method that takes a context and two values: the\
    \ `max` and the `level`. It works out how wide the label will be and writes the\
    \ label in (just below) the specified position. It measures how wide the label\
    \ is so it can draw an empty rectangle of the specified size to the right of the\
    \ label. It also draws a filled rectangle inside the empty rectangle that’s sized\
    \ according to the given `level` as a proportion of `max`.\n\nAt the end of the\
    \ `AsteroidGame` constructor, add the following property:\n\n```\nthis.health_indicator\
    \ = new Indicator(\"health\", 5, 5, 100, 10);\n```\n\nTo draw the indicator, add\
    \ the following to the `AsteroidGame.prototype.draw` method. This should replace\
    \ our first attempt:\n\n```\nthis.health_indicator.draw(this.c, this.ship.health,\
    \ this.ship.max_health);\n```\n\nNow we’re seriously impressed. Collide with the\
    \ asteroid to see your health drop, as shown in Figure [12-2](#A455241_1_En_12_Chapter.xhtml#Fig2).\n\
    \n![A455241_1_En_12_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_12_Fig2_HTML.jpg)\n\
    \nFigure 12-2 Health indicator\n\n## Asteroid vs. Projectile"
