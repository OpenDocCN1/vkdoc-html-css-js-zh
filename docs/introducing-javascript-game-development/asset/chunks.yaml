  trans: "\nJavaScript 是一款构建游戏及类游戏系统的出色工具。Web 提供了绝佳的方式，能让你将作品交付给数百万翘首以待的用户。当然，其他技术栈也同样可行；掌握多种语言和系统能带来巨大的好处。希望我在本书中涵盖的一些关键点能对你未来的发展有所帮助，无论你选择哪条道路。你已经经历了一个漫长的过程，我希望你学到了关于代码结构以及构建游戏所需逻辑的一些知识。这为你打开一个空白文本文件，并着手创建自己的项目奠定了良好基础。如果要说一些临别建议，那就是：尝试将软件工程视为一个管理复杂性的过程。任何有一定规模的软件都会很复杂。重要的是要一步步地设计代码，逐步构建复杂性，并在这个过程中持续进行重构。这意味着要从没有结构开始，只有在你确信函数、类和继承会有所帮助时才去添加它们。当我们创建新代码时，需要自由发挥的空间来激发创造力。在早期阶段过多的结构会限制选择，并减少我们找到优秀解决方案的机会。真正的诀窍在于，要在这种自由与构建结构以使复杂性能够增长这一绝对必要性之间取得平衡。我们应该允许结构通过试错的过程自然地浮现出来。添加的结构应该能简化使用该结构的代码。它应该能为你处理当前问题创建一个有效的接口。我想提一些你可以着手开始的指导方针。在实验阶段，将代码写在全局作用域中。始终从简单开始。识别你需要的组件（在我们的例子中，我们从陨石和飞船开始），并逐个开发它们。尝试先从最简单组件的独立行为开始，稍后再考虑它们如何交互。只有当代码看起来不错时，才添加诸如函数和对象之类的结构。不要过于频繁地修改函数和对象内部的代码。研究混乱的代码并尝试简化它。添加更多函数，将大块代码分解成更小的片段。实验很重要。一旦你对某些内容感到满意，就添加结构，将该组件固化，提炼成它所提供的功能。将优秀的代码移入库中——质量控制很重要。通过这种方式构建你所有的底层组件。在每个阶段，将你最好的代码从全局作用域移至函数和对象中，并将你最好的函数和对象移入库中。尽早重构，经常重构。通过自信地试验你的做事方式来培养你的直觉（请确保总是保存一个副本以备不时之需）。使用版本控制，并提交每一个增量改进。对你的组件进行实验，看看它们能做什么。一旦你的对象稳定下来，就开始考虑它们的交互。通过实验来组合组件的交互。一旦你感到满意，就构建更多的结构——也许是一个主控对象。再次重构并改进你的组件结构，以满足你正在识别的需求。优秀的开发者能够驾驭混沌与秩序之间的相互作用。真正的精通来自于我们培养出的直觉，这种直觉能在多个层面上引导我们走向对整个系统有益而非有害的结构。这些直觉只能通过实践来获得。请记住，代码不会以完美的结构凭空出现。盲目地复制书中的例子结构，并不能帮助你理解这些例子是如何产生的。秘诀在于，在实验时要有一个目标。通过尝试许多不同的结构来培养你的直觉，直到你找到一个你认为当前目标足够优秀的结构。这样做得足够多，就会变得更容易。到此，我不得不停笔了。感谢你花时间阅读我的书。如果你喜欢它，请把它推荐给朋友；如果你不喜欢，请告诉我你的意见。\n\
