    \ making the experience richer and more immersive. The improvements just mentioned\
    \ are just suggestions but would make excellent projects for an enthusiastic and\
    \ creative reader to develop their knowledge further.\n\n## Conclusions"
  raw: '## Implementing Levels


    Currently, when we destroy all the asteroids, nothing happens. We just keep floating
    around in empty space with nothing to do. What we want to happen is that we progress
    to the next level and more asteroids appear. As the levels progress, we should
    face more and more asteroids. First things first: add a level property to the
    game. We set the level in the new reset_game method: this.level = 1 We also want
    a level indicator, so add one in the constructor, based on Listing [13-5](#A455241_1_En_13_Chapter.xhtml#Par28).
    this.level_indicator = new NumberIndicator("level", this.canvas.width / 2, 5,
    {   align: "center" }); Listing 13-5 A Level Indicator Don’t forget to draw it
    to the canvas in the AsteroidsGame.prototype.draw method: this.level_indicator.draw(this.c,
    this.level); Now we need to update the level property when the asteroids array
    is empty. Add this to the beginning of the AsteroidsGame.prototype.update method:
    if(this.asteroids.length == 0) {   this.level_up(); } The new AsteroidsGame.prototype.level_up
    method will increment the level property and set up more asteroids. Add the new
    method shown in Listing [13-6](#A455241_1_En_13_Chapter.xhtml#Par34). AsteroidsGame.prototype.level_up
    = function() {   this.level += 1;   for(var i = 0; i < this.level; i++) {     this.asteroids.push(this.moving_asteroid());
      } } Listing 13-6 The AsteroidsGame.prototype.level_up Method Now we can tidy
    up our AsteroidsGame.prototype.reset_game method by initializing the level to
    0 and calling level_up. Listing [13-7](#A455241_1_En_13_Chapter.xhtml#Par36) shows
    the new method. AsteroidsGame.prototype.reset_game = function() {   this.score
    = 0;   this.level = 0;   this.game_over = false;   this.ship = new Ship(     this.canvas.width
    / 2,     this.canvas.height / 2   );   this.projectiles = [];   this.asteroids
    = [];   this.level_up(); } Listing 13-7 A Tidy AsteroidsGame.prototype.reset_game
    Method Refresh the browser and play your fully featured game. When all the asteroids
    are destroyed, they’re replaced with a larger batch. The game starts out easy
    but quickly gets harder. Once you lose all your health, the “game over” state
    shows, and the game restarts when the spacebar is pressed. Sit back and contemplate
    what you’ve done. By my calculations, you now have over 700 lines of code and
    a really solid, extendable game. The code is beautifully organized, and adding
    features such as a particle system for explosions and thruster trails, powerups,
    and sounds would be easy.


    ## Summary


    In this chapter we’ve refined our game into a complete user experience by introducing
    states. Our game previously had two dead-ends. If the player was killed, the game
    continued as if nothing had happened. If the player destroyed the last asteroid,
    the game simply continued with nothing to shoot at. By adding a “game over” state,
    we introduced jeopardy. By adding a level system and bringing more asteroids into
    the game, we introduced ambition and potential. There are now no longer any states
    in the game where the user gets stuck. Of course, the game is still very simple,
    and other than challenging friends to achieve the highest score there’s little
    long-term playability here. That situation can be improved by introducing features
    such as powerups (especially if rare powerups enable progression in later levels).
    You could also make improvements such as a scoreboard to record precisely who
    the best player is, which can make the game more attractive. The look and feel
    of the game can be improved by adding a snazzy particle system for the thruster
    trails and explosions when asteroids are hit. Finally, adding sounds can make
    a huge difference to a game like this, making the experience richer and more immersive.
    The improvements just mentioned are just suggestions but would make excellent
    projects for an enthusiastic and creative reader to develop their knowledge further.


    ## Conclusions'
  trans: "\n## 实现关卡\n\n目前，当我们摧毁所有小行星后，游戏没有任何反应。我们只是漂浮在空旷的太空中，无事可做。我们期望的是能够进入下一关卡，并出现更多小行星。随着关卡推进，我们应面对越来越多的小行星。首先，为游戏添加一个\
    \ `level` 属性。我们在新的 `reset_game` 方法中设置关卡等级：`this.level = 1` 此外，我们还需要一个关卡指示器，因此根据代码清单\
    \ 13-5 在构造函数中添加一个。`this.level_indicator = new NumberIndicator(\"level\", this.canvas.width\
    \ / 2, 5, { align: \"center\" });` 代码清单 13-5 关卡指示器 别忘了在 `AsteroidsGame.prototype.draw`\
    \ 方法中将其绘制到画布上：`this.level_indicator.draw(this.c, this.level);` 现在，我们需要在 `asteroids`\
    \ 数组为空时更新等级属性。在 `AsteroidsGame.prototype.update` 方法的开头添加以下代码：`if(this.asteroids.length\
    \ == 0) { this.level_up(); }` 新的 `AsteroidsGame.prototype.level_up` 方法将递增 `level`\
    \ 属性并生成更多小行星。添加代码清单 13-6 所示的新方法。\n\n```\nAsteroidsGame.prototype.level_up = function()\
    \ {\n  this.level += 1;\n  for(var i = 0; i < this.level; i++) {\n    this.asteroids.push(this.moving_asteroid());\n\
    \  }\n}\n```\n\n代码清单 13-6 `AsteroidsGame.prototype.level_up` 方法 现在，我们可以通过将等级初始化为\
    \ 0 并调用 `level_up` 来整理 `AsteroidsGame.prototype.reset_game` 方法。代码清单 13-7 展示了新的方法。\n\
    \n```\nAsteroidsGame.prototype.reset_game = function() {\n  this.score = 0;\n\
    \  this.level = 0;\n  this.game_over = false;\n  this.ship = new Ship(\n    this.canvas.width\
    \ / 2,\n    this.canvas.height / 2\n  );\n  this.projectiles = [];\n  this.asteroids\
    \ = [];\n  this.level_up();\n}\n```\n\n代码清单 13-7 整洁的 `AsteroidsGame.prototype.reset_game`\
    \ 方法 刷新浏览器，试玩你完整的游戏吧。当所有小行星被摧毁后，它们会被更大的一批所取代。游戏开始时很简单，但会迅速变难。一旦你失去所有生命值，“游戏结束”状态就会显示，按下空格键后游戏会重新开始。坐下来，回顾一下你所做的一切。据我估算，你现在已有超过\
    \ 700 行代码，并且拥有一个非常扎实、可扩展的游戏。代码组织得非常好，添加诸如用于爆炸和推进器尾迹的粒子系统、道具以及音效等功能将非常容易。\n\n##\
    \ 总结\n\n在本章中，我们通过引入状态机制，将游戏完善为完整的用户体验。我们的游戏之前有两个死胡同。如果玩家被击杀，游戏会像什么都没发生一样继续。如果玩家摧毁了最后一颗小行星，游戏只是继续，没有目标可以射击。通过添加“游戏结束”状态，我们引入了风险。通过添加关卡系统并让更多小行星进入游戏，我们引入了进取心和潜力。现在游戏中不再存在让玩家卡死的状态了。当然，游戏仍然非常简单，除了与朋友挑战最高分之外，长期可玩性不高。这种情况可以通过引入诸如道具（尤其是当稀有道具能够帮助在后期关卡中推进时）等功能来改善。你还可以进行改进，例如添加一个记分板来精确记录谁是最高分得主，这能让游戏更具吸引力。通过为推进器尾迹和被击中时的小行星爆炸添加炫酷的粒子系统，可以改善游戏的外观和感觉。最后，为此类游戏添加音效可以带来巨大变化，使体验更丰富、更具沉浸感。刚才提到的改进只是建议，但对于热情且有创造力的读者来说，这些将是进一步拓展知识的优秀项目。\n\
    \n## 结论\n"
- fmt: "JavaScript 是一款构建游戏及类游戏系统的出色工具。Web 提供了绝佳的方式，能让你将作品交付给数百万翘首以待的用户。当然，其他技术栈也同样可行；掌握多种语言和系统能带来巨大的好处。希望我在本书中涵盖的一些关键点能对你未来的发展有所帮助，无论你选择哪条道路。你已经经历了一个漫长的过程，我希望你学到了关于代码结构以及构建游戏所需逻辑的一些知识。这为你打开一个空白文本文件，并着手创建自己的项目奠定了良好基础。如果要说一些临别建议，那就是：尝试将软件工程视为一个管理复杂性的过程。任何有一定规模的软件都会很复杂。重要的是要一步步地设计代码，逐步构建复杂性，并在这个过程中持续进行重构。这意味着要从没有结构开始，只有在你确信函数、类和继承会有所帮助时才去添加它们。当我们创建新代码时，需要自由发挥的空间来激发创造力。在早期阶段过多的结构会限制选择，并减少我们找到优秀解决方案的机会。真正的诀窍在于，要在这种自由与构建结构以使复杂性能够增长这一绝对必要性之间取得平衡。我们应该允许结构通过试错的过程自然地浮现出来。添加的结构应该能简化使用该结构的代码。它应该能为你处理当前问题创建一个有效的接口。我想提一些你可以着手开始的指导方针。在实验阶段，将代码写在全局作用域中。始终从简单开始。识别你需要的组件（在我们的例子中，我们从陨石和飞船开始），并逐个开发它们。尝试先从最简单组件的独立行为开始，稍后再考虑它们如何交互。只有当代码看起来不错时，才添加诸如函数和对象之类的结构。不要过于频繁地修改函数和对象内部的代码。研究混乱的代码并尝试简化它。添加更多函数，将大块代码分解成更小的片段。实验很重要。一旦你对某些内容感到满意，就添加结构，将该组件固化，提炼成它所提供的功能。将优秀的代码移入库中——质量控制很重要。通过这种方式构建你所有的底层组件。在每个阶段，将你最好的代码从全局作用域移至函数和对象中，并将你最好的函数和对象移入库中。尽早重构，经常重构。通过自信地试验你的做事方式来培养你的直觉（请确保总是保存一个副本以备不时之需）。使用版本控制，并提交每一个增量改进。对你的组件进行实验，看看它们能做什么。一旦你的对象稳定下来，就开始考虑它们的交互。通过实验来组合组件的交互。一旦你感到满意，就构建更多的结构——也许是一个主控对象。再次重构并改进你的组件结构，以满足你正在识别的需求。优秀的开发者能够驾驭混沌与秩序之间的相互作用。真正的精通来自于我们培养出的直觉，这种直觉能在多个层面上引导我们走向对整个系统有益而非有害的结构。这些直觉只能通过实践来获得。请记住，代码不会以完美的结构凭空出现。盲目地复制书中的例子结构，并不能帮助你理解这些例子是如何产生的。秘诀在于，在实验时要有一个目标。通过尝试许多不同的结构来培养你的直觉，直到你找到一个你认为当前目标足够优秀的结构。这样做得足够多，就会变得更容易。到此，我不得不停笔了。感谢你花时间阅读我的书。如果你喜欢它，请把它推荐给朋友；如果你不喜欢，请告诉我你的意见。\n\
