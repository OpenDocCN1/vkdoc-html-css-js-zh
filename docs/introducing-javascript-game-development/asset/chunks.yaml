  trans: "\n# 从简单开始\n\n我们先从一个非常简单的场景入手：一个移动的圆形。这个圆形在画布上有一个位置（`x` 和 `y` 坐标），我们将移动这个位置。按常规方式新建一个文件夹：复制\
    \ `drawing.js` 库和样式表。新建一个文件 `exercise6.html`，其中的代码如代码清单 6-1 所示。\n\n```html\n<!doctype\
    \ html>\n<html>\n  <head>\n    <title>动画</title>\n    <link rel=\"stylesheet\"\
    \ href=\"styles.css\">\n    <script src=\"drawing.js\"></script>\n  </head>\n\
    \  <body>\n    <h1>动画</h1>\n    <canvas id=\"asteroids\" width=\"300\" height=\"\
    300\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
    asteroids\").getContext(\"2d\");\n      context.strokeStyle = \"white\";\n   \
    \   context.lineWidth = 1.5;\n      var x = 0, y = context.canvas.height / 2;\n\
    \      function frame() {\n        context.clearRect(0, 0, context.canvas.width,\
    \ context.canvas.height);\n        draw(context);\n        update();\n      }\n\
    \      function update() {\n        x += 1;\n      }\n      function draw(ctx)\
    \ {\n        draw_grid(ctx);\n        ctx.beginPath();\n        ctx.arc(x, y,\
    \ 40, 0, 2 * Math.PI);\n        ctx.fill();\n        ctx.stroke();\n      }\n\
    \      setInterval(frame, 1000.0/60.0); // 60 帧每秒\n    </script>\n  </body>\n\
    </html>\n```\n\n**代码清单 6-1** 一个移动的圆形\n\n这段代码的大部分内容我们都很熟悉，但有几个新地方值得注意。首先，我们将 `x`\
    \ 和 `y` 坐标存储为全局变量。我们还把代码重构为一系列函数：`frame`、`update` 和 `draw`。`frame` 函数做了三件不同的事：它使用\
    \ `context.clearRect` 方法清除画布，然后调用 `draw` 函数（该函数在位置 `x`、`y` 处绘制一个圆形），接着调用 `update`\
    \ 函数（该函数将 `x` 坐标向右移动一个像素）。最后一个新内容是调用 `setInterval`，它会安排 `frame` 函数每秒被调用 60 次。\n\
    \n结果就是，每次调用 `frame` 函数时，它都会清除画布、绘制网格、在当前位置绘制圆形，并将位置向右移动。`setInterval` 调用中传入要调用的函数（`frame`）以及调用之间的时间间隔（以毫秒为单位，即\
    \ `1000.0 / 60.0`）。因此，`frame` 函数每隔六十分之一秒被调用一次，圆形以每秒 60 像素的速度向右移动。\n\n一旦圆形移动到画布边界之外，它就不可见了，但\
    \ `x` 的值仍在不断递增。尝试修改 `update` 函数来改变圆形的行为。这里有几个简单的想法：\n\n- 将 `x` 坐标增加一个不同的值（例如 `5`）\n\
    - 同时也增加 `y` 坐标\n- 递减坐标值\n- 将 `y` 坐标设为随机数（介于 `0` 和画布高度之间）\n\n## 一个更复杂的例子\n\n我们把重点放在\
    \ `update` 函数上，为圆形增加一些更复杂的行为。例如，可以添加一个重力效果，让圆形向下加速。在 `x` 和 `y` 定义之后添加一行，定义我们需要的变量：\n\
    \n```js\nvar yspeed = 0, gravity = 0.1;\n```\n\n像这样更新你的 `update` 函数：\n\n```js\n\
    function update() {\n  x += 1;\n  y += yspeed;\n  yspeed += gravity;\n}\n```\n\
    \n这里我们根据 `yspeed` 移动 `y` 坐标，并将 `yspeed` 增加 `gravity` 的值。圆形很快就会加速冲出画布底部。我们来让圆形在碰到屏幕底部时弹起来。弹跳其实就是改变运动方向，就像这样：\n\
    \n```js\nfunction update() {\n  x += 1;\n  y += yspeed;\n  yspeed += gravity;\n\
    \  if(y >= context.canvas.height) { // 如果碰到了底部\n    yspeed *= -1;            \
    \      // 改为向上运动\n  }\n}\n```\n\n如果希望每次弹跳都损失一点能量，则乘以一个小于 `-1` 的数（例如 `-0.8`）。\n\
    \n**注意** 这里需要小心。考虑一下，如果 `yspeed` 为 `+10`（像素/帧），而 `y` 坐标刚好比画布高度少 `1` 像素，会发生什么情况：\n\
    \n1. `y` 坐标增加到超出画布高度 `9` 像素，`yspeed` 更新为 `-8`。\n2. `y` 坐标减少到超出画布高度 `1` 像素，`yspeed`\
    \ 被设置为 `+6.4`。\n"
- fmt: "# 排版后的文本\n\nThe position then never gets below the canvas height because `yspeed`\
    \ is updated (reversed and shrunk) in every frame. To fix this problem, make sure\
    \ the circle is moved to the canvas height whenever `yspeed` is reversed. Now\
    \ we would like to see the circle “wrap” around the canvas horizontally. Add the\
    \ following lines to your `update` function:\n\n```\nif(x <= 0 || x >= context.canvas.width)\
    \ {\n  x = (x + context.canvas.width) % context.canvas.width;\n}\n```\n\nNow we\
    \ can take this a bit further by adding more variables and optionally drawing\
    \ a Pac-Man instead of a ball. This shows the benefit of keeping the updating\
    \ and drawing code separate and having handy drawing functions available. Update\
    \ your code to reflect Listing [6-2](#A455241_1_En_6_Chapter.xhtml#Par29).\n\n\
    ```\n<!doctype html>\n<html>\n  <head>\n    <title>Animation</title>\n    <link\
    \ rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"></script>\n\
    \  </head>\n  <body>\n    <h1>Animation</h1>\n    <canvas id=\"asteroids\" width=\"\
    300\" height=\"300\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
    asteroids\").getContext(\"2d\");\n      context.strokeStyle = \"white\";\n   \
    \   context.lineWidth = 1.5;\n      let x = 0, y = context.canvas.height / 5,\
    \ radius = 20;\n      let xspeed = 1.5, yspeed = 0, gravity = 0.1;\n      let\
    \ mouth = 0;\n      function frame() {\n        context.clearRect(0, 0, context.canvas.width,\
    \ context.canvas.height);\n        draw(context);\n        update();\n      }\n\
    \      function update() {\n        x += xspeed;\n        y += yspeed;\n     \
    \   yspeed += gravity;\n        if(y >= context.canvas.height - radius) {\n  \
    \        y = context.canvas.height - radius; // add an extra radius\n        \
    \  yspeed *= -0.6;                          // reverse and slow down\n       \
    \   xspeed *= 0.95;                          // just slow down a bit\n       \
    \ }\n        if(x <= 0 || x >= context.canvas.width) {\n          x = (x + context.canvas.width)\
    \ % context.canvas.width;\n        }\n        mouth = Math.abs(Math.sin(6 * Math.PI\
    \ * x / (context.canvas.width)));\n      }\n      function draw(ctx) {\n     \
    \   draw_grid(ctx);\n        // draw a simple circle\n        ctx.beginPath();\n\
    \        ctx.arc(x, y, radius, 0, 2 * Math.PI);\n        ctx.fill();\n       \
    \ ctx.stroke();\n        // or try this instead\n        // ctx.save();\n    \
    \    // ctx.translate(x, y);\n        // draw_pacman(ctx, radius, mouth);\n  \
    \      // ctx.restore();\n      }\n      setInterval(frame, 1000.0/60.0); // 60\
    \ fps\n    </script>\n  </body>\n</html>\n```\n\n**Listing 6-2** A Bouncing Ball/Pac-Man\n\
    \nWe’ve gone to town here by keeping track of another variable to control the\
    \ mouth angle. The `mouth` angle is now tied to the `x` coordinate and follows\
    \ a sine wave that opens and closes the mouth six times each time Pac-Man crosses\
    \ the canvas. The mouth position is tightly tied to the position in the `x` coordinate.\
    \ This is just for fun. Feel free to update the `mouth` variable however you like.\n\
    \nNotice the other major changes relate to adding an `xspeed` variable and a `radius`\
    \ and also adapting the code that bounces our item off the bottom of the canvas.\
    \ We no longer sink halfway through the canvas. The `draw_pacman` function will\
    \ need to be updated to draw at the context origin, as in Listing [6-3](#A455241_1_En_6_Chapter.xhtml#Par33).\n\
    \n```\nfunction draw_pacman(ctx, radius, mouth) {\n  angle = 0.2 * Math.PI * mouth;\n\
    \  ctx.save();\n  ctx.fillStyle = \"yellow\";\n  ctx.strokeStyle = \"black\";\n\
    \  ctx.lineWidth = 0.5;\n  ctx.beginPath();\n  ctx.arc(0, 0, radius, angle, -angle);\n\
    \  ctx.lineTo(0, 0);\n  ctx.closePath()\n  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n\
    }\n```\n\n**Listing 6-3** Draw Pac-Man at the Origin\n\nTo clarify what’s going\
    \ on here, we can follow the code in the other direction. The call to `setInterval`\
    \ is causing `frame` to be called 60 times per second. The repeated calls to `frame`\
    \ clear the canvas, call `update`, and then call `draw`. The `update` function\
    \ updates the variables `x`, `y`, `yspeed`, `xspeed`, and `mouth`. The `draw`\
    \ function renders the circle (or Pac-Man) using the variables to determine its\
    \ position and mouth angle. The end result is that the circle/Pac-Man bounces\
    \ across the canvas. You should see something like Figure [6-1](#A455241_1_En_6_Chapter.xhtml#Fig1).\
    \ Try removing the call to `context.clearRect` to see why it needs to be there.\n\
    \n![A455241_1_En_6_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_6_Fig1_HTML.jpg)\n\
    \n**Figure 6-1** Pac-Man chomping his way across the canvas\n\n## Summary\n\n\
    In this chapter we looked at the basic principles of animation: we render a scene\
    \ frame by frame and control the data associated with our game elements. Dividing\
    \ these two basic tasks of drawing the scene and updating the data into two distinct\
    \ functions is the first step in maintaining a structured approach. How we manage\
    \ this data is a critical aspect of how our game will be able to grow in complexity\
    \ as it develops. I should be clear that animating based on `setInterval` is not\
    \ best practice. Modern browsers implement a mechanism specifically designed for\
    \ animating on the web. We should quickly move to using the `window.requestAnimationFrame`\
    \ method to control our game loop. So let’s do it.\n\n© Graeme Stuart 2017  \n\
    Graeme Stuart, *Introducing JavaScript Game Development*  \n[https://doi.org/10.1007/978-1-4842-3252-1_7](#A455241_1_En_7_Chapter.xhtml)\n\
    \n# 7. Animating Asteroids\n\nGraeme Stuart<sup>1</sup>\n\n(1) Market Harborough,\
    \ Leicestershire, UK\n\nIn this chapter we’re going to introduce some critical\
    \ structure into our code. The previous few chapters introduced the requirement\
    \ to store data tied to our game elements. This chapter introduces the use of\
    \ objects as a solution to the explosion in complexity this brings. Objects are\
    \ a great solution because they enable data and code to be intimately connected.\
    \ Now that we can animate, we can start to build out the main parts of the game.\
    \ We’ll start by getting some asteroids on the screen, floating about. Asteroids\
    \ float in space, and they keep going until they’re shot or the game ends. Their\
    \ velocity and rotation are randomly initialized and never changes.\n\n## A Solid\
    \ Game Loop"
