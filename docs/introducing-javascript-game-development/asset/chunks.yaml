  trans: "\n# 基础三角学\n\n三角学将在本书中出现多次，因此现在理清概念是个好主意。我们将使用一个非常简单的子集，它使我们能够根据角度和距离计算 x\
    \ 和 y 坐标。图 4-1 展示了基本原理。直角三角形最长的边是圆心与圆周上一点之间的直线。如果我们改变角度，这将以可预测的方式影响 x 和 y 坐标。![A455241_1_En_4_Fig1_HTML.jpg](img/A455241_1_En_4_Fig1_HTML.jpg)\
    \ 图 4-1 角度 θ 的正弦和余弦\n\n基本上，你现在只需要知道，正弦和余弦函数可以根据距离（半径）和方向（角度）计算出 (x, y) 坐标。在 JavaScript\
    \ 中，`Math` 对象有两个对应的方法：`Math.sin(θ)` 和 `Math.cos(θ)`。利用它们，我们可以计算任意给定角度 θ 相对于圆心的\
    \ x 和 y 坐标。要将角度和距离转换为 x 和 y 坐标，只需将这些值乘以所需的距离（圆的半径）。在我们的图中，蓝色虚线表示 y 坐标的值，计算公式为\
    \ `r × Math.sin(θ)`。红色虚线表示 x 坐标的值，计算公式为 `r × Math.cos(θ)`。\n\n## 基础飞船\n\n让我们实践一下。我们将使用一个函数，在画布上以特定位置和特定半径绘制一艘飞船。请记住，我们希望飞船尽可能完美地填充一个圆形。首先，创建一个名为\
    \ `exercise4` 的新文件夹，复制样式表（`styles.css`）和 `drawing.js` 库，并添加一个新文件 `exercise4.html`，其中包含代码清单\
    \ 4-1 中的代码。\n\n```\n<!doctype html>\n<html>\n  <head>\n    <title>绘制一艘太空飞船</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
    ></script>\n  </head>\n  <body>\n    <h1>绘制一艘太空飞船</h1>\n    <canvas id=\"asteroids\"\
    \ width=\"400\" height=\"400\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
    asteroids\").getContext(\"2d\");\n      draw_grid(context);\n      draw_ship(context,\
    \ 200, 200, 150, {guide: true});\n    </script>\n  </body>\n</html>\n```\n\n代码清单\
    \ 4-1 绘制飞船的模板\n\n该模板加载了样式表和库，并包含一个简单的三行脚本。脚本创建了对上下文的引用，绘制了网格，然后通过调用新的 `draw_ship`\
    \ 函数并传入一些参数来绘制我们的飞船。第一个参数是上下文，第二个和第三个是 x 和 y 坐标，第四个是包含飞船的圆的半径。最后一个参数略有不同——它包含一个对象，我们稍后会讨论它。\n\
    \n我们的第一个版本的 `draw_ship` 函数如代码清单 4-2 所示。将其添加到 `drawing.js` 库中。\n\n```\nfunction\
    \ draw_ship(ctx, x, y, radius, options) {\n  options = options || {};\n  ctx.save();\n\
    \  // 可选地绘制一个显示碰撞半径的引导线\n  if(options.guide) {\n    ctx.strokeStyle = \"white\"\
    ;\n    ctx.fillStyle = \"rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth = 0.5;\n  \
    \  ctx.beginPath();\n    ctx.arc(x, y, radius, 0, 2 * Math.PI);\n    ctx.stroke();\n\
    \    ctx.fill();\n  }\n  // 设置一些默认值\n  ctx.lineWidth = options.lineWidth || 2;\n\
    \  ctx.strokeStyle = options.stroke || \"white\";\n  ctx.fillStyle = options.fill\
    \ || \"black\";\n  let angle = (options.angle || 0.5 * Math.PI) / 2;\n  // 用三条线绘制飞船\n\
    \  ctx.beginPath();\n  ctx.moveTo(x + radius, y);\n  ctx.lineTo(\n    x + Math.cos(Math.PI\
    \ - angle) * radius,\n    y + Math.sin(Math.PI - angle) * radius\n  );\n  ctx.lineTo(\n\
    \    x + Math.cos(Math.PI + angle) * radius,\n    y + Math.sin(Math.PI + angle)\
    \ * radius\n  );\n  ctx.closePath();\n  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n\
    }\n```\n\n代码清单 4-2 绘制基础飞船\n\n结果是一艘基础飞船。在浏览器中加载该模板，你应该会看到类似图 4-2 的内容。![A455241_1_En_4_Fig2_HTML.jpg](img/A455241_1_En_4_Fig2_HTML.jpg)\
    \ 图 4-2 一个简单的三角形飞船\n\n该函数的核心使用 `context.moveTo` 和 `context.lineTo` 绘制三条线构成一个三角形。它设置了上下文的一些参数，然后填充形状并描边轮廓。但除此之外，它还做了很多事情。这里有一些新东西需要解释。\n\
    \n## 使用对象字面量\n\n注意，我们定义了一个第五个参数：`options`。这是一个可选参数；我们可以看出这一点，因为如果它未定义，则会被设置为一个空对象（`{}`）。`options`\
    \ 参数允许设置飞船的多个可选属性。这些选项使用点号表示法引用，例如 `options.stroke` 或 `options.fill`。如果它们未定义，则会提供默认值。\n\
    \n> **注意** 对象非常有用，将在后面的章节中广泛使用。这里我介绍对象字面量 `{}`，它用作简单的键：值存储。对象字面量被指定为包含多个键：值对的花括号，用逗号分隔。键可以是任何能转换为有效\
    \ JavaScript 字符串的内容。值可以是任何内容。空对象被指定为一对花括号（`{}`）。\n\n更新你的 `exercise4.html` 文件，使用设置了不同选项的\
    \ `draw_ship` 函数，如代码清单 4-3 所示。\n\n```\n<script>\n  var context = document.getElementById(\"\
    asteroids\").getContext(\"2d\");\n  draw_grid(context);\n  draw_ship(context,\
    \ 200, 200, 125, {guide: true});\n  draw_ship(context, 75, 75, 50, {stroke: 'gold',\
    \ fill: 'purple'});\n  draw_ship(context, 325, 325, 50, {angle: 0.8 * Math.PI,\
    \ guide: true});\n  draw_ship(context, 75, 325, 50, {angle: 0.3 * Math.PI, guide:\
    \ true});\n  draw_ship(context, 325, 75, 50, {lineWidth: 8, fill: 'blue'});\n\
    </script>\n```\n\n代码清单 4-3 设置飞船选项\n\n结果如图 4-3 所示。注意，我们可以创建一个具有简单接口的函数，并且通过允许默认值，也可以实现更详细的接口。![A455241_1_En_4_Fig3_HTML.jpg](img/A455241_1_En_4_Fig3_HTML.jpg)\
    \ 图 4-3 许多飞船\n\n飞船的三个角位于圆的半径上。飞船的前部位于 `(x + radius, y)`，即圆的右侧。飞船的后角由飞船机头的角度决定。角度变量由这行代码设置：`let\
    \ angle = (options.angle || 0.5 * Math.PI) / 2;` 它默认为 `0.5π / 2`。一个完整的圆有 `2π`\
    \ 弧度，因此 `0.25π` 弧度是 45 度（一个圆的八分之一）。\n\n飞船的后角由以下代码绘制：\n\n```\nctx.lineTo(\n  x\
    \ + Math.cos(Math.PI - angle) * radius,\n  y + Math.sin(Math.PI - angle) * radius\n\
    );\nctx.lineTo(\n  x + Math.cos(Math.PI + angle) * radius,\n  y + Math.sin(Math.PI\
    \ + angle) * radius\n);\n```\n\n将每个坐标乘以 `radius` 确保我们始终在圆上（距离中心固定距离）。因此，我们正在找到圆上对应于角度\
    \ `Math.PI - angle` 和 `Math.PI + angle` 的点。一个角位于 `Math.PI` 之前 45 度的圆上，另一个位于 `Math.PI`\
    \ 之后 45 度。因为 `Math.PI` 是半个圆，它指向飞船的后部，两个角分别位于其两侧。\n\n看一下图 4-3 并仔细思考，直到你明白发生了什么。请记住，引导圆显示了检测碰撞的位置。小行星周围也会有类似的圆，当这些圆接触时，就会检测到碰撞。对于我们的飞船，正面碰撞将是准确的，后角碰撞也是如此，但飞船和圆之间的大片区域会过早地检测到碰撞。这是我们稍后将尝试改进的地方。\n\
    \n## 变换画布上下文\n"
- fmt: "注意我们已经将飞船绘制成朝右的形状。这是因为 `0` 弧度角指向正右方。那么如何旋转飞船呢？我们需要围绕飞船自身的中心进行旋转，并在游戏中以所有角度绘制它。手动计算所有坐标将变得冗长乏味。一种便捷的方法是转换画布上下文，而不是转换图形本身。旋转上下文始终围绕当前上下文的原点进行。\n\
    \n尝试绘制一些旋转后的飞船——将你的 `exercise4.html` 脚本替换为清单 [4-4](#A455241_1_En_4_Chapter.xhtml#Par32)\
    \ 所示的内容。\n\n```javascript\nvar context = document.getElementById(\"asteroids\"\
    ).getContext(\"2d\");\ncontext.lineWidth = 0.5;\ncontext.strokeStyle = \"white\"\
    ;\nlet x = context.canvas.width * 0.9;\nlet y = 0;\nlet radius = context.canvas.width\
    \ * 0.1;\ndraw_grid(context);\nfor(let r = 0; r <= 0.5 * Math.PI; r += 0.05 *\
    \ Math.PI) {\n  context.save()\n  context.rotate(r);\n  draw_ship(context, x,\
    \ y, radius, {guide: true});\n  context.beginPath();\n  context.moveTo(0, 0);\n\
    \  context.lineTo(x, 0);\n  context.stroke();\n  context.restore()\n}\n```\n\n\
    清单 4-4 旋转画布上下文\n\n旋转上下文正如其字面含义：想象你手持一支笔放在纸上，然后实际上是在旋转纸张，绘制我们的飞船（使其朝右），最后将纸放回原位。这使得我们能够将飞船绘制成任意朝向。重要的是，旋转是围绕画布原点进行的，根据我们的网格坐标，原点位于左上角。现在想象一下，固定纸张的左上角，并围绕该角旋转纸张。\n\
    \n在每次迭代中，我们保存上下文、旋转它、绘制飞船和一条线，然后恢复上下文到初始状态。这意味着旋转总是应用于未旋转的上下文，因为每次以不同角度绘制飞船时，我们都会旋转一个更大的角度。由于我们是绕原点旋转，飞船始终与左上角保持相同的距离。在每次迭代中，我们还从原点绘制一条线到飞船中心。这条线也会被旋转，但原点始终保持在左上角。图\
    \ [4-4](#A455241_1_En_4_Chapter.xhtml#Fig4) 展示了结果。\n\n![A455241_1_En_4_Fig4_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig4_HTML.jpg)\n\
    \n图 4-4 绕原点旋转\n\n在我们的游戏中，我们需要围绕飞船的中心点旋转，而不是画布的左上角。为此，我们需要在旋转之前移动上下文原点。关键在于，当我们旋转画布时，它是围绕原点旋转的，因此如果我们移动原点，就可以控制旋转。在我们的游戏中，我们将存储飞船的位置和角度。在绘制飞船之前，我们会平移和旋转上下文。这意味着我们将始终在新的原点进行绘制，因此需要调整飞船绘制函数，移除坐标参数，并始终在\
    \ `(0, 0)` 处绘制。将所有对 `x` 和 `y` 的引用替换为 `0`（零），如清单 [4-5](#A455241_1_En_4_Chapter.xhtml#Par37)\
    \ 所示。\n\n```javascript\nfunction draw_ship(ctx, radius, options) {\n  options\
    \ = options || {};\n  ctx.save();\n  if(options.guide) {\n    ctx.strokeStyle\
    \ = \"white\";\n    ctx.fillStyle = \"rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth\
    \ = 0.5;\n    ctx.beginPath();\n    ctx.arc(0, 0, radius, 0, 2 * Math.PI);\n \
    \   ctx.stroke();\n    ctx.fill();\n  }\n  ctx.lineWidth = options.lineWidth ||\
    \ 2;\n  ctx.strokeStyle = options.stroke || \"white\";\n  ctx.fillStyle = options.fill\
    \ || \"black\";\n  let angle = (options.angle || 0.5 * Math.PI) / 2;\n  ctx.beginPath();\n\
    \  ctx.moveTo(radius, 0);\n  ctx.lineTo(\n    Math.cos(Math.PI - angle) * radius,\n\
    \    Math.sin(Math.PI - angle) * radius\n  );\n  ctx.lineTo(\n    Math.cos(Math.PI\
    \ + angle) * radius,\n    Math.sin(Math.PI + angle) * radius\n  );\n  ctx.closePath();\n\
    \  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n}\n```\n\n清单 4-5 在当前原点绘制\n\n\
    现在，通过在绘制飞船于 `(0, 0)` 点之前，平移画布（调用 `context.translate`）并旋转画布（调用 `context.rotate`），我们可以在任意位置绘制飞船。当这样变换画布时，我们必须小心地保存和恢复画布状态——否则我们会丢失跟踪。在清单\
    \ [4-6](#A455241_1_En_4_Chapter.xhtml#Par39) 中，我们旋转和平移了画布但没有恢复它，导致旋转和平移累积，产生了一个漂亮但非预期的螺旋图案，如图\
    \ [4-5](#A455241_1_En_4_Chapter.xhtml#Fig5) 所示。\n\n```javascript\nlet t = context.canvas.width\
    \ / 20;\nlet r = Math.PI / 500;\ncontext.translate(0, t);\nfor(let i = 0; i <=\
    \ 50; i ++) {\n  context.rotate(i * r);\n  draw_ship(context, t, {guide: true,\
    \ lineWidth: 1});\n  context.translate(t, 0);\n}\n```\n\n清单 4-6 组合旋转与平移\n\n![A455241_1_En_4_Fig5_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig5_HTML.jpg)\n\
    \n图 4-5 丢失画布状态跟踪\n\n更好的方法是维护变量（即 `x`、`y` 和 `angle`）来确定飞船的位置和角度。这样，我们可以保存未变换的上下文、应用变换、绘制飞船，最后恢复上下文。这使我们能够将飞船绘制在任意位置并指向任意方向。清单\
    \ [4-7](#A455241_1_En_4_Chapter.xhtml#Par42) 在一个嵌套循环中遍历 `x` 和 `y` 位置，并在每个位置绘制一艘小飞船。每艘飞船都以一个稍大的角度绘制。注意，在\
    \ `save()` 和 `restore()` 调用之间的代码非常通用。实际起作用的是控制我们变量的代码。图 [4-6](#A455241_1_En_4_Chapter.xhtml#Fig6)\
    \ 展示了飞船整齐排列的结果。\n\n```javascript\nlet x, y, angle = 0;\nlet w = context.canvas.width,\
    \ h = context.canvas.height\nfor(y = h/20; y < h; y += h/10) {\n  for(x = w/20;\
    \ x < w; x += w/10) {\n    context.save();\n    context.translate(x, y);\n   \
    \ context.rotate(angle);\n    draw_ship(context, w/30, {guide: true, lineWidth:\
    \ 1});\n    context.restore();\n    angle = (angle + 0.0075 * Math.PI);\n  }\n\
    }\n```\n\n清单 4-7 控制变量\n\n![A455241_1_En_4_Fig6_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig6_HTML.jpg)\n\
    \n图 4-6 使用画布变换进行受控的飞船绘制"
  raw: 'Notice we’ve drawn the ship facing right. That’s because the 0 radians angle
    points to the right. But how do we rotate the ship? We’re going to need to rotate
    the ship around its own center and draw it at all angles in our game. Calculating
    all the coordinates would be long-winded and boring. A convenient way to make
    rotation easier is to transform the context rather than the drawing. Rotating
    the context always happens around the current context origin. Try drawing some
    rotated ships—replace your exercise4.html script as shown in Listing [4-4](#A455241_1_En_4_Chapter.xhtml#Par32).
    var context = document.getElementById("asteroids").getContext("2d"); context.lineWidth
    = 0.5; context.strokeStyle = "white"; let x = context.canvas.width * 0.9; let
    y = 0; let radius = context.canvas.width * 0.1; draw_grid(context); for(let r
    = 0; r <= 0.5 * Math.PI; r += 0.05 * Math.PI) {   context.save()   context.rotate(r);
      draw_ship(context, x, y, radius, {guide: true});   context.beginPath();   context.moveTo(0,
    0);   context.lineTo(x, 0);   context.stroke();   context.restore() } Listing
    4-4 Rotating the Canvas context Rotating the context is just like it sounds. Imaging
    holding a pen over some paper and literally rotating the paper around, drawing
    our ship, pointing to the right, and then returning the paper back to its original
    position. This allows us to draw our ship pointing in any direction we want. Importantly,
    the rotation happens around the canvas origin, which, as we know from our grid
    labels, is the top-left corner. Now imagine holding the top-left corner of your
    paper still and rotating the paper around it. In each iteration we save the context,
    rotate it, draw the ship and a line, and then restore the context back to its
    original state. This means the rotation is always applied to the un-rotated context
    because we’re rotating by a larger angle each time we draw the ship at a different
    angle. Because we’re rotating about the origin, the ship is always the same distance
    away from the top-left corner. In each iteration we also draw a line from the
    origin to the center of the ship. This line is also rotated, but the origin remains
    in the top-left corner. Figure [4-4](#A455241_1_En_4_Chapter.xhtml#Fig4) shows
    the result. ![A455241_1_En_4_Fig4_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig4_HTML.jpg)
    Figure 4-4 Rotating about the origin In our game, we need to rotate the ship about
    its central point, not the top-left corner of the canvas. To do that we need to
    move the context origin before we rotate it. Crucially, when we rotate the canvas,
    it rotates around the origin, so if we move the origin then we can control the
    rotation. In our game, we’ll store the ship position and the ship angle. We will
    translate and rotate the context before drawing the ship. This means we’ll always
    be drawing to the new origin, so we’ll need to adjust the ship drawing function
    to remove the coordinates and just draw at (0, 0) every time. Replace all references
    to x and y with 0 (zero), as shown in Listing [4-5](#A455241_1_En_4_Chapter.xhtml#Par37).
    function draw_ship(ctx, radius, options) {   options = options || {};   ctx.save();
      if(options.guide) {     ctx.strokeStyle = "white";     ctx.fillStyle = "rgba(0,
    0, 0, 0.25)";     ctx.lineWidth = 0.5;     ctx.beginPath();     ctx.arc(0, 0,
    radius, 0, 2 * Math.PI);     ctx.stroke();     ctx.fill();   }   ctx.lineWidth
    = options.lineWidth || 2;   ctx.strokeStyle = options.stroke || "white";   ctx.fillStyle
    = options.fill || "black";   let angle = (options.angle || 0.5 * Math.PI) / 2;
      ctx.beginPath();   ctx.moveTo(radius, 0);   ctx.lineTo(     Math.cos(Math.PI
    - angle) * radius,     Math.sin(Math.PI - angle) * radius   );   ctx.lineTo(     Math.cos(Math.PI
    + angle) * radius,     Math.sin(Math.PI + angle) * radius   );   ctx.closePath();
      ctx.fill();   ctx.stroke();   ctx.restore(); } Listing 4-5 Draw at the Current
    Origin We can now draw the ship in any position we like by translating the canvas
    (using calls to context.translate) and rotating the canvas (with context.rotate)
    before drawing the ship at point (0, 0). When transforming the canvas like this,
    we must be careful to save and restore the canvas state—otherwise we can lose
    track. In Listing [4-6](#A455241_1_En_4_Chapter.xhtml#Par39) we rotate and translate
    the canvas without restoring it, and the rotations and translations accumulate
    to produce a nice but unintentional spiral, as shown in Figure [4-5](#A455241_1_En_4_Chapter.xhtml#Fig5).
    let t = context.canvas.width / 20; let r = Math.PI / 500; context.translate(0,
    t); for(let i = 0; i <= 50; i ++) {   context.rotate(i * r);   draw_ship(context,
    t, {guide: true, lineWidth: 1});   context.translate(t, 0); } Listing 4-6 Combining
    Rotate and Translate ![A455241_1_En_4_Fig5_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig5_HTML.jpg)
    Figure 4-5 Losing track of the canvas state A better approach is to maintain variables
    (that is, x, y, and angle) that determine the position and angle of the ship.
    In this way, we can save the untransformed context, apply the transformations,
    draw the ship, and finally restore the context. This allows us to draw the ship
    in any location and pointing in any direction we choose. Listing [4-7](#A455241_1_En_4_Chapter.xhtml#Par42)
    loops over x and y positions in a nested loop and draws a small ship in each position.
    Each ship is drawn with a slightly bigger angle. Notice that the code within the
    save and restore calls is very generic. It’s the code that controls our variables
    that is doing the work. Figure [4-6](#A455241_1_En_4_Chapter.xhtml#Fig6) shows
    the ships all lined up obediently. let x, y, angle = 0; let w = context.canvas.width,
    h = context.canvas.height for(y = h/20; y < h; y += h/10) {   for(x = w/20; x
    < w; x += w/10) {     context.save();     context.translate(x, y);     context.rotate(angle);
        draw_ship(context, w/30, {guide: true, lineWidth: 1});     context.restore();
        angle = (angle + 0.0075 * Math.PI);   } } Listing 4-7 Controlling Variables
    ![A455241_1_En_4_Fig6_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig6_HTML.jpg) Figure
    4-6 Controlled ship drawing using canvas transformations


    ## Adding Some Curves'
