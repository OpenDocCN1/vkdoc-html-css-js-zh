    [9-14](#A455241_1_En_9_Chapter.xhtml#Par48) shows how we can experiment with controlling
    our game elements in the global update loop. But for behavior that’s more intrinsic
    to our object, we should place code in the object definition. Before we look closer
    at the ship behavior, we need to look into how we can take user inputs via the
    keyboard to control our game.'
