    Figure 4-3 Lots of ships The three corners of the ship are positioned on the radius
    of the circle. The front of the ship is positioned at (x + radius, y), to the
    right of the circle. The rear corners of the ship are determined by the angle
    of the ship’s nose. The angle variable is set by this line: let angle = (options.angle
    || 0.5 * Math.PI) / 2; It defaults to 0.5π /2\. There are 2π radians in a full
    circle, so 0.25π radians is 45 degrees (an eighth of a circle). The rear corners
    of the ship are drawn by this code: ctx.lineTo(   x + Math.cos(Math.PI - angle)
    * radius,   y + Math.sin(Math.PI - angle) * radius ); ctx.lineTo(   x + Math.cos(Math.PI
    + angle) * radius,   y + Math.sin(Math.PI + angle) * radius ); Multiplying each
    coordinate by radius ensures we’re always on the circle (a fixed distance from
    the middle). So, we’re finding the points on the circle that correspond to the
    angle Math.PI - angle and Math.PI + angle. One corner is positioned on the circle
    45 degrees before Math.PI, and one is 45 degrees after Math.PI. Because Math.PI
    is half a circle, it points to the rear of the ship, and the two corners are positioned
    on either side of that. Look at Figure [4-3](#A455241_1_En_4_Chapter.xhtml#Fig3)
    and think carefully about this until you can see what is going on. Remember, the
    guide circle shows where collisions will be detected. Asteroids will have similar
    circles around them, and when the circles touch, a collision will be detected.
    With our ship, head-on collisions will be accurate, as will those with the rear
    corners, but there are large areas between the ship and the circle that will detect
