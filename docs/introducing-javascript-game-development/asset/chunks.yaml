    this.thruster_on   });   c.restore(); } Listing 12-10 Draw a Red Circle When compromised
    We could have placed this in the draw_ship function and added an argument. That
    would probably be neater, but would take longer to describe, so I’ll leave it
    as an optional exercise. Now we need a general purpose collision function to test
    for collisions between any two objects. The objects must have (x, y) coordinates
    and radius properties. Add the functions in Listing [12-11](#A455241_1_En_12_Chapter.xhtml#Par36)
    at the top of game.js. function collision(obj1, obj2) {   return distance_between(obj1,
    obj2) < (obj1.radius + obj2.radius); } function distance_between(obj1, obj2) {
      return Math.sqrt(Math.pow(obj1.x - obj2.x, 2) + Math.pow(obj1.y - obj2.y, 2));
    } Listing 12-11 Collision Detection Collision between circles is simple: the circles
    intersect if the distance between their centers is smaller than the sum of their
    radii. We also split out the distance calculation into its own function. To implement
    collision detection, we need the game to check each asteroid against the ship
    for collisions and to set the ship.compromised property accordingly. Listing [12-12](#A455241_1_En_12_Chapter.xhtml#Par39)
    shows the implementation. AsteroidsGame.prototype.update = function(elapsed) {
      this.ship.compromised = false;   this.asteroids.forEach(function(asteroid) {
        asteroid.update(elapsed, this.c);     if(collision(asteroid, this.ship)) {
          this.ship.compromised = true;     }   }, this);   this.ship.update(elapsed,
    this.c);   this.projectiles.forEach(function(p, i, projectiles) {     p.update(elapsed,
    this.c);     if(p.life <= 0) {       projectiles.splice(i, 1);     }   }, this);
      if(this.ship.trigger && this.ship.loaded) {     this.projectiles.push(this.ship.projectile(elapsed));
      } } Listing 12-12 Update compromised Property We set the ship.compromised property
    to false and then, as we loop over each asteroid, if a collision is detected we
    set it to true. Notice that we also move things around to ensure we test for collisions
    before we update the asteroids and the ship. Refresh the page and admire the results.
    Press G to turn on the guide and you should see that if we hit the asteroid with
    our ship, a red circle appears under the ship! ![A455241_1_En_12_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_12_Fig1_HTML.jpg)
    Figure 12-1 Collision detection


    ## Taking Damage


    Now let’s update things so the ship takes damage when it’s compromised. Effectively,
    we’re giving the ship a collision time limit (max_health—let’s say 2 seconds).
    This value will be a property of the ship, so the health property can be topped
    up at any time. Ship.prototype.update = function(elapsed, c) {   this.push(this.angle,
        (this.thruster_on - this.retro_on) * this.thruster_power,      elapsed   );
      this.twist(     (this.right_thruster - this.left_thruster) * this.steering_power, elapsed
      );   this.loaded = this.time_until_reloaded === 0;   if(!this.loaded) {     this.time_until_reloaded
    -= Math.min(elapsed, this.time_until_reloaded);   }   if(this.compromised) {     this.health
    -= Math.min(elapsed, this.health);   }   Mass.prototype.update.apply(this, arguments);
    } Listing 12-13 Drain Health Notice how similar this is to the reload time. Also
    notice how the retro-thruster is implemented. Now we can’t see the ship’s health,
    so let’s draw it onto the canvas. Add the following to the end of AsteroidsGame.prototype.
    draw :   this.c.save();   this.c.font = "18px arial";   this.c.fillStyle = "white";
      this.c.fillText("health: " + this.ship.health.toFixed(1), 10, this.canvas.height
    - 10);   this.c.restore(); Now refresh the page and admire your new health indicator.
    Try hitting an asteroid and watch your health deplete. But we can do better than
    this! We’re JavaScript ninjas by now. Add the code from Listing [12-14](#A455241_1_En_12_Chapter.xhtml#Par48)
    to the end of objects.js. function Indicator(label, x, y, width, height) {   this.label
    = label + ": ";   this.x = x;   this.y = y;   this.width = width;   this.height
    = height; } Indicator.prototype.draw = function(c, max, level) {   c.save();   c.strokeStyle
    = "white";   c.fillStyle = "white";   c.font = this.height + "pt Arial";   var
    offset = c.measureText(this.label).width;   c.fillText(this.label, this.x, this.y
    + this.height - 1);   c.beginPath();   c.rect(offset + this.x, this.y, this.width,
    this.height);   c.stroke();   c.beginPath();   c.rect(offset + this.x, this.y,
    this.width * (max / level), this.height);   c.fill();   c.restore() } Listing
    12-14 Indicator Class The new Indicator constructor takes a label, a position
    (x, y), and a size (width, height) as its arguments. Think of it as a rectangle
    with a label. It has a draw method that takes a context and two values: the max
    and the level. It works out how wide the label will be and writes the label in
    (just below) the specified position. It measures how wide the label is so it can
    draw an empty rectangle of the specified size to the right of the label. It also
    draws a filled rectangle inside the empty rectangle that’s sized according to
    the given level as a proportion of max. At the end of the AsteroidGame constructor,
    add the following property: this.health_indicator = new Indicator("health", 5,
    5, 100, 10); To draw the indicator, add the following to the AsteroidGame.prototype.draw
    method. This should replace our first attempt: this.health_indicator.draw(this.c,
    this.ship.health, this.ship.max_health); Now we’re seriously impressed. Collide
    with the asteroid to see your health drop, as shown in Figure [12-2](#A455241_1_En_12_Chapter.xhtml#Fig2).
    ![A455241_1_En_12_Fig2_HTML.jpg](OEBPS/Images/A455241_1_En_12_Fig2_HTML.jpg) Figure
    12-2 Health indicator


    ## Asteroid vs. Projectile'
  trans: "\n# 飞船 vs 小行星\n\n现在我们需要进行实际的碰撞检测。我们将检测代表飞船和小行星的圆形之间的碰撞。当飞船周围的圆与某颗小行星周围的圆接触时，我们会在飞船上设置一个新的\
    \ `compromised`（受损）属性。当飞船处于 `compromised` 状态时，它会持续损失生命值。首先要做的是在 `Ship` 构造函数中初始化所需的属性。请按照清单\
    \ 12-9 所示更新你的构造函数。\n\n```\nfunction Ship(x, y, power, weapon_power) {\n    this.super(x,\
    \ y, 10, 20, 1.5 * Math.PI);\n    this.thruster_power = power;\n    this.steering_power\
    \ = this.thruster_power / 20;\n    this.right_thruster = false;\n    this.left_thruster\
    \ = false;\n    this.thruster_on = false;\n    this.retro_on = false;\n    this.weapon_power\
    \ = weapon_power;\n    this.loaded = false;\n    this.weapon_reload_time = 0.25;\
    \ // 秒\n    this.time_until_reloaded = this.weapon_reload_time;\n    this.compromised\
    \ = false;\n    this.max_health = 2.0;\n    this.health = this.max_health;\n}\n\
    ```\n\n清单 12-9 在飞船构造函数中初始化 `compromised` 和 `health` 属性\n\n我们还可以更新 `Ship.prototype.draw`\
    \ 方法，以指示（在开启引导模式时）飞船是否处于 `compromised` 状态。如清单 12-10 所示。\n\n```\nShip.prototype.draw\
    \ = function(c, guide) {\n    c.save();\n    c.translate(this.x, this.y);\n  \
    \  c.rotate(this.angle);\n    if(guide && this.compromised) {\n        c.save();\n\
    \        c.fillStyle = \"red\";\n        c.beginPath();\n        c.arc(0, 0, this.radius,\
    \ 0, 2 * Math.PI);\n        c.fill();\n        c.restore();\n    }\n    draw_ship(c,\
    \ this.radius, {\n        guide: guide,\n        thruster: this.thruster_on\n\
    \    });\n    c.restore();\n}\n```\n\n清单 12-10 当 `compromised` 时绘制一个红色圆圈\n\n我们本可以将此功能放在\
    \ `draw_ship` 函数中并添加一个参数。这样做可能会更简洁，但描述起来会花费更长时间，所以我将其留作可选练习。\n\n现在我们需要一个通用的碰撞函数来检测任意两个对象之间的碰撞。这些对象必须具有（`x`，\
    \ `y`）坐标和 `radius` 属性。在 `game.js` 的顶部添加清单 12-11 中的函数。\n\n```\nfunction collision(obj1,\
    \ obj2) {\n    return distance_between(obj1, obj2) < (obj1.radius + obj2.radius);\n\
    }\n\nfunction distance_between(obj1, obj2) {\n    return Math.sqrt(Math.pow(obj1.x\
    \ - obj2.x, 2) + Math.pow(obj1.y - obj2.y, 2));\n}\n```\n\n清单 12-11 碰撞检测\n\n圆形之间的碰撞很简单：如果两个圆心之间的距离小于它们半径之和，则圆相交。我们还将距离计算单独提取为一个函数。\n\
    \n为了实现碰撞检测，我们需要让游戏检查每颗小行星与飞船是否发生碰撞，并相应地设置 `ship.compromised` 属性。清单 12-12 展示了具体实现。\n\
    \n```\nAsteroidsGame.prototype.update = function(elapsed) {\n    this.ship.compromised\
    \ = false;\n    this.asteroids.forEach(function(asteroid) {\n        asteroid.update(elapsed,\
    \ this.c);\n        if(collision(asteroid, this.ship)) {\n            this.ship.compromised\
    \ = true;\n        }\n    }, this);\n    this.ship.update(elapsed, this.c);\n\
    \    this.projectiles.forEach(function(p, i, projectiles) {\n        p.update(elapsed,\
    \ this.c);\n        if(p.life <= 0) {\n            projectiles.splice(i, 1);\n\
    \        }\n    }, this);\n    if(this.ship.trigger && this.ship.loaded) {\n \
    \       this.projectiles.push(this.ship.projectile(elapsed));\n    }\n}\n```\n\
    \n清单 12-12 更新 `compromised` 属性\n\n我们将 `ship.compromised` 属性设置为 `false`，然后在遍历每颗小行星时，如果检测到碰撞，就将其设置为\
    \ `true`。注意，我们还调整了执行顺序，确保在更新小行星和飞船之前进行碰撞检测。\n\n刷新页面并欣赏结果。按 G 键开启引导模式，你应该会看到，如果我们的飞船撞到小行星，飞船下方会出现一个红色圆圈！\n\
    \n![A455241_1_En_12_Fig1_HTML.jpg](img/A455241_1_En_12_Fig1_HTML.jpg)\n\n图 12-1\
    \ 碰撞检测\n\n## 承受伤害\n\n现在让我们更新代码，使飞船在 `compromised` 状态下承受伤害。实际上，我们是为飞船设定一个碰撞时间限制（`max_health`——假设为\
    \ 2 秒）。该值将是飞船的一个属性，因此 `health` 属性可以随时被补满。\n\n```\nShip.prototype.update = function(elapsed,\
    \ c) {\n    this.push(this.angle,\n        (this.thruster_on - this.retro_on)\
    \ * this.thruster_power, elapsed\n    );\n    this.twist(\n        (this.right_thruster\
    \ - this.left_thruster) * this.steering_power, elapsed\n    );\n    this.loaded\
    \ = this.time_until_reloaded === 0;\n    if(!this.loaded) {\n        this.time_until_reloaded\
    \ -= Math.min(elapsed, this.time_until_reloaded);\n    }\n    if(this.compromised)\
    \ {\n        this.health -= Math.min(elapsed, this.health);\n    }\n    Mass.prototype.update.apply(this,\
    \ arguments);\n}\n```\n\n清单 12-13 消耗生命值\n\n注意这与装弹时间的相似之处。还要注意反向推进器的实现方式。\n\n现在我们看不到飞船的生命值，所以让我们把它绘制在画布上。在\
    \ `AsteroidsGame.prototype.draw` 的末尾添加以下代码：\n\n```\nthis.c.save();\nthis.c.font\
    \ = \"18px arial\";\nthis.c.fillStyle = \"white\";\nthis.c.fillText(\"health:\
    \ \" + this.ship.health.toFixed(1), 10, this.canvas.height - 10);\nthis.c.restore();\n\
    ```\n\n现在刷新页面，欣赏你新的生命值指示器。尝试撞击一颗小行星，观察你的生命值如何减少。但我们可以做得更好！我们现在已经是 JavaScript 忍者了。\n\
    \n将清单 12-14 中的代码添加到 `objects.js` 的末尾。\n\n```\nfunction Indicator(label, x, y,\
    \ width, height) {\n    this.label = label + \": \";\n    this.x = x;\n    this.y\
    \ = y;\n    this.width = width;\n    this.height = height;\n}\n\nIndicator.prototype.draw\
    \ = function(c, max, level) {\n    c.save();\n    c.strokeStyle = \"white\";\n\
    \    c.fillStyle = \"white\";\n    c.font = this.height + \"pt Arial\";\n    var\
    \ offset = c.measureText(this.label).width;\n    c.fillText(this.label, this.x,\
    \ this.y + this.height - 1);\n    c.beginPath();\n    c.rect(offset + this.x,\
    \ this.y, this.width, this.height);\n    c.stroke();\n    c.beginPath();\n   \
    \ c.rect(offset + this.x, this.y, this.width * (max / level), this.height);\n\
    \    c.fill();\n    c.restore()\n}\n```\n\n清单 12-14 指示器类\n\n新的 `Indicator` 构造函数接受一个\
    \ `label`（标签）、一个位置 (`x`、`y`) 和一个尺寸 (`width`、`height`) 作为参数。可以将其视为一个带标签的矩形。它有一个\
    \ `draw` 方法，该方法接受一个上下文以及两个数值：`max`（最大值）和 `level`（当前值）。它会计算出标签的宽度，并在指定位置（正下方）写入标签。它测量标签的宽度，以便在标签右侧绘制一个指定大小的空心矩形。它还会在空心矩形内部绘制一个填充矩形，该填充矩形的大小根据给定的\
    \ `level` 占 `max` 的比例确定。\n\n在 `AsteroidGame` 构造函数的末尾，添加以下属性：\n\n```\nthis.health_indicator\
    \ = new Indicator(\"health\", 5, 5, 100, 10);\n```\n\n要绘制指示器，请将以下代码添加到 `AsteroidGame.prototype.draw`\
    \ 方法中。这将替换我们第一次尝试的代码：\n\n```\nthis.health_indicator.draw(this.c, this.ship.health,\
    \ this.ship.max_health);\n```\n\n现在我们真的被震撼了。与小行星碰撞，看看你的生命值下降，如图 12-2 所示。\n\n![A455241_1_En_12_Fig2_HTML.jpg](img/A455241_1_En_12_Fig2_HTML.jpg)\n\
    \n图 12-2 生命值指示器\n\n## 小行星 vs 射弹\n"
- fmt: "下一步是检测小行星与炮弹之间的碰撞。如果击中小行星，我们将扣除部分质量，分裂小行星，并增加得分。目前我们每摧毁一个质量单位计为1分。每次命中将移除500个单位质量并获得500分。我们将这些新值作为`AsteroidsGame`的属性添加到构造函数中：`this.mass_destroyed\
    \ = 500; this.score = 0;`。为了实现碰撞检测并在小行星被击中时触发分裂，我们需要在`AsteroidsGame.prototype.update`方法中添加一些逻辑。清单[12-15](#A455241_1_En_12_Chapter.xhtml#Par58)展示了新的方法：\n\
    \n```\nAsteroidsGame.prototype.update = function(elapsed) {\n  this.ship.compromised\
    \ = false;\n  this.asteroids.forEach(function(asteroid) {\n    asteroid.update(elapsed,\
    \ this.c);\n    if(collision(asteroid, this.ship)) {\n      this.ship.compromised\
    \ = true;\n    }\n  }, this);\n  this.ship.update(elapsed, this.c);\n  this.projectiles.forEach(function(p,\
    \ i, projectiles) {\n    p.update(elapsed, this.c);\n    if(p.life <= 0) {\n \
    \     projectiles.splice(i, 1);\n    } else {\n      this.asteroids.forEach(function(asteroid,\
    \ j) {\n        if(collision(asteroid, p)) {\n          projectiles.splice(i,\
    \ 1);\n          this.asteroids.splice(j, 1);\n          this.split_asteroid(asteroid,\
    \ elapsed);\n        }\n      }, this);\n    }\n  }, this);\n  if(this.ship.trigger\
    \ && this.ship.loaded) {\n    this.projectiles.push(this.ship.projectile(elapsed));\n\
    \  }\n}\n```\n\n**清单12-15 命中时触发小行星分裂**\n\n在`if(p.life <= 0)`块中添加`else`子句，确保我们只测试游戏中当前存活的炮弹。对于每个存活的炮弹，我们遍历所有（已更新过的）小行星并检测碰撞。如果检测到碰撞，我们从游戏中移除该小行星和炮弹。然后，我们调用一个新的辅助方法`split_asteroid`，并将受损的小行星传入。\n\
    \n这个新的辅助方法需要创建子小行星并相应更新得分。它需要从父小行星中移除适当的质量，生成两个总质量正确的子小行星，并给它们施加一个推力使其分离。清单[12-16](#A455241_1_En_12_Chapter.xhtml#Par61)展示了一个基本实现。\n\
    \n```\nAsteroidsGame.prototype.split_asteroid = function(asteroid, elapsed) {\n\
    \  asteroid.mass -= this.mass_destroyed;\n  this.score += this.mass_destroyed;\n\
    \  var split = 0.25 + 0.5 * Math.random(); // 不均匀分裂\n  var ch1 = asteroid.child(asteroid.mass\
    \ * split);\n  var ch2 = asteroid.child(asteroid.mass * (1 - split));\n  [ch1,\
    \ ch2].forEach(function(child) {\n    if(child.mass < this.mass_destroyed) {\n\
    \      this.score += child.mass;\n    } else {\n      this.push_asteroid(child,\
    \ elapsed);\n      this.asteroids.push(child);\n    }\n  }, this);\n}\n```\n\n\
    **清单12-16 分裂小行星**\n\n该函数做了很多工作。首先，它从给定的小行星中移除部分质量并为游戏增加分数。然后，它确定一个（大致均匀的）分裂比例，用于在两个新小行星之间分配质量。创建两个小行星，每个小行星的总质量由原始小行星的剩余质量和分裂比例决定。我们使用`Asteroid.child`辅助方法来创建与父小行星具有相同属性（位置、速度等）的小行星。对于每个新的子小行星，我们给它施加推力并将其添加到游戏中。\n\
    \n我们为小行星设置了最小尺寸，因为太小的小行星很难被击中，并且在受到推力时往往会高速飞行。如果子小行星太小，就不会被添加到游戏中——其质量会直接转化为分数。\n\
    \n新的子小行星是使用另一个辅助方法`Asteroid.child`创建的。该方法简单地用与父小行星相同的速度、旋转角度和位置来初始化新的小行星。清单[12-17](#A455241_1_En_12_Chapter.xhtml#Par65)展示了该函数。\n\
    \n```\nAsteroid.prototype.child = function(mass) {\n  return new Asteroid(\n \
    \   this.x, this.y, mass,\n    this.x_speed, this.y_speed,\n    this.rotation_speed\n\
    \  )\n}\n```\n\n**清单12-17 生成子小行星**\n\n现在，刷新你的浏览器并射击小行星！为了在每一帧都能看到碰撞检测的比较结果，我们在炮弹和小行星之间绘制连线。更新`AsteroidsGame.prototype.draw`方法中的`if(this.guide)`块。在现有的小行星循环内嵌套一个炮弹循环，并调用现有的`draw_line`函数。按下G键切换指南模式并射击，即可看到新的参考线。你应该会看到类似图[12-3](#A455241_1_En_12_Chapter.xhtml#Fig3)的效果。\n\
    \n![Figure 12-3](OEBPS/Images/A455241_1_En_12_Fig3_HTML.jpg)\n\n**图12-3 炮弹击碎小行星**\n\
    \n本练习中我们要做的最后一件事是添加一个得分指示器和一个帧率指示器。得分和帧率应以数字形式呈现，因此我们将清单[12-18](#A455241_1_En_12_Chapter.xhtml#Par69)中的新`NumberIndicator`类添加到`objects.js`文件中。\n\
    \n```\nfunction NumberIndicator(label, x, y, options) {\n  options = options ||\
    \ {}\n  this.label = label + \": \";\n  this.x = x;\n  this.y = y;\n  this.digits\
    \ = options.digits || 0;\n  this.pt = options.pt || 10;\n  this.align = options.align\
    \ || 'end';\n}\nNumberIndicator.prototype.draw = function(c, value) {\n  c.save();\n\
    \  c.fillStyle = \"white\";\n  c.font = this.pt + \"pt Arial\";\n  c.textAlign\
    \ = this.align;\n  c.fillText(\n    this.label + value.toFixed(this.digits),\n\
    \    this.x, this.y + this.pt - 1\n  );\n  c.restore();\n}\n```\n\n**清单12-18 `NumberIndicator`**\n\
    \n该类允许我们为指示器指定标签和位置。它还接收一个可选的`options`参数，该参数可以覆盖默认值。`options.digits`属性设置要显示的小数位数（默认为0），`options.pt`属性设置字体大小（默认为10磅），`options.align`属性决定文本对齐方式。它有一个`draw`方法，接受两个参数：一个用于绘制的画布上下文（canvas\
    \ context），以及要显示的值。它简单地打印标签和用冒号分隔的值。\n\n与`Indicator`类一样，`NumberIndicator`类避免了在我们的主`AsteroidsGame`类中编写底层绘图代码。这避免了杂乱，有助于我们组织代码并跟踪每个部分的功能。我们还将两次使用它，这避免了重复相似的代码（重复代码是不好的）。\n\
    \n我们需要在`AsteroidsGame`构造函数中添加几行代码，如清单[12-19](#A455241_1_En_12_Chapter.xhtml#Par72)所示。\n\
    \n```\nthis.score_indicator = new NumberIndicator(\"score\",\n  this.canvas.width\
    \ - 10, 5\n);\nthis.fps_indicator = new NumberIndicator(\"fps\",\n  this.canvas.width\
    \ - 10,\n  this.canvas.height - 15,\n  {digits: 2}\n);\n```\n\n**清单12-19 一些指示器**\n\
    \n然后我们更新`AsteroidsGame.prototype.draw`方法，如清单[12-20](#A455241_1_En_12_Chapter.xhtml#Par74)所示。我们仅在指南模式开启时显示帧率。\n\
    \n```\nAsteroidsGame.prototype.draw = function() {\n  this.c.clearRect(0, 0, this.canvas.width,\
    \ this.canvas.height);\n  if(this.guide) {\n    draw_grid(this.c);\n    this.asteroids.forEach(function(asteroid)\
    \ {\n      draw_line(this.c, asteroid, this.ship);\n      this.projectiles.forEach(function(p)\
    \ {\n        draw_line(this.c, asteroid, p);\n      }, this);\n    }, this);\n\
    \    this.fps_indicator.draw(this.c, this.fps);\n  }\n  this.asteroids.forEach(function(asteroid)\
    \ {\n    asteroid.draw(this.c, this.guide);\n  }, this);\n  this.ship.draw(this.c,\
    \ this.guide);\n  this.projectiles.forEach(function(p) {\n    p.draw(this.c);\n\
    \  }, this);\n  this.health_indicator.draw(this.c, this.ship.health, this.ship.max_health);\n\
    \  this.score_indicator.draw(this.c, this.score);\n}\n```\n\n**清单12-20 更多指示器**\n\
    \n最后需要做的是计算帧率。在`AsteroidsGame.prototype.frame`方法中添加一行代码，如清单[12-21](#A455241_1_En_12_Chapter.xhtml#Par76)所示。\n\
    \n```\nAsteroidsGame.prototype.frame = function(timestamp) {\n  if (!this.previous)\
    \ this.previous = timestamp;\n  var elapsed = timestamp - this.previous;\n  this.fps\
    \ = 1000 / elapsed;\n  this.update(elapsed / 1000);\n  this.draw();\n  this.previous\
    \ = timestamp;\n  window.requestAnimationFrame(this.frame.bind(this));\n}\n```\n\
    \n**清单12-21 计算帧率**\n\n就是这样！刷新页面，欣赏你的新得分指示器。图[12-4](#A455241_1_En_12_Chapter.xhtml#Fig4)展示了你应该看到的效果。注意，摧毁所有小行星后，你的得分等于一颗小行星的质量。所有的质量都已转化为分数。你还可以切换指南模式并欣赏新的帧率指示器。\n\
    \n![Figure 12-4](OEBPS/Images/A455241_1_En_12_Fig4_HTML.jpg)\n\n**图12-4 显示得分和帧率**"
  raw: 'The next step is to detect collisions between asteroids and projectiles. If
    an asteroid is hit, we’ll take away some mass, split the asteroid, and add some
    score. We’ll treat every unit of mass destroyed as one point for now. We’ll remove
    500 units of mass for each hit and award 500 points. We’ll add these new values
    as properties of AsteroidsGame in the constructor: this.mass_destroyed = 500;
    this.score = 0; To implement the collision detection and trigger asteroids to
    split when they’re hit, we need to add some logic to our AsteroidsGame.prototype.update
    method. Listing [12-15](#A455241_1_En_12_Chapter.xhtml#Par58) shows the new method:
    AsteroidsGame.prototype.update = function(elapsed) {   this.ship.compromised =
    false;   this.asteroids.forEach(function(asteroid) {     asteroid.update(elapsed,
    this.c);     if(collision(asteroid, this.ship)) {       this.ship.compromised
    = true;     }   }, this);   this.ship.update(elapsed, this.c);   this.projectiles.forEach(function(p,
    i, projectiles) {     p.update(elapsed, this.c);     if(p.life <= 0) {       projectiles.splice(i,
    1);     } else {       this.asteroids.forEach(function(asteroid, j) {         if(collision(asteroid,
    p)) {           projectiles.splice(i, 1);           this.asteroids.splice(j, 1);
              this.split_asteroid(asteroid, elapsed);         }       }, this);     }
      }, this);   if(this.ship.trigger && this.ship.loaded) {     this.projectiles.push(this.ship.projectile(elapsed));
      } } Listing 12-15 Trigger an Asteroid to Split When Hit The addition of an else
    clause to the if(p.life <= 0) block ensures that we only test projectiles that
    are currently live in the game. For every live projectile, we loop over all the
    asteroids (which have already been updated) and test for collisions. If a collision
    is detected, we remove the asteroid and the projectile from play. Then we call
    a new helper method, split_asteroid, passing in the damaged asteroid. The new
    helper method needs to create new child asteroids and update the score accordingly.
    It needs to remove the appropriate mass from the parent asteroid, generate two
    child asteroids with the correct total mass, and give each of them a push so they
    separate out. Listing [12-16](#A455241_1_En_12_Chapter.xhtml#Par61) shows a basic
    implementation. AsteroidsGame.prototype.split_asteroid = function(asteroid, elapsed)
    {   asteroid.mass -= this.mass_destroyed;   this.score += this.mass_destroyed;
      var split = 0.25 + 0.5 * Math.random(); // split unevenly   var ch1 = asteroid.child(asteroid.mass
    * split);   var ch2 = asteroid.child(asteroid.mass * (1 - split));   [ch1, ch2].forEach(function(child)
    {     if(child.mass < this.mass_destroyed) {       this.score += child.mass;     }
    else {       this.push_asteroid(child, elapsed);       this.asteroids.push(child);
        }   }, this); } Listing 12-16 Split an Asteroid The function does quite a
    lot. First, it removes some mass from the given asteroid and adds some score to
    the game. It then determines a (more or less even) split ratio used to distribute
    mass between the two new asteroids. Two asteroids are created, and the total mass
    of each is determined by the remaining mass of the original asteroid and the split
    ratio. We use the Asteroid.child helper method to create asteroids with the same
    properties (position, speed, and so on) as the parent. For each new child asteroid,
    we give it a push and add it to the game. We’ve implemented a minimum size for
    asteroids because tiny asteroids are very difficult to hit and they tend to fly
    around at high speeds when pushed. If a child asteroid is too small, it’s not
    added to the game—its mass is simply added to the score. The new child asteroids
    are created using another helper method: Asteroid.child. This simply initializes
    new asteroids with the same velocity, rotation, and position as their parent.
    Listing [12-17](#A455241_1_En_12_Chapter.xhtml#Par65) shows the function. Asteroid.prototype.child
    = function(mass) {   return new Asteroid(     this.x, this.y, mass,     this.x_speed,
    this.y_speed,     this.rotation_speed   ) } Listing 12-17 Spawn child Asteroids
    Now refresh your browser and shoot some asteroids! In order to see the collision
    detection comparisons at every frame, we now draw lines between projectiles and
    asteroids. Update the if(this.guide) block in the AsteroidsGame.prototype.draw
    method. Add a loop over the projectiles nested within the existing loop over asteroids
    and call the existing draw_line function. Toggle the guides with the G key and
    shoot to see the new guide lines. You should end up seeing something like Figure
    [12-3](#A455241_1_En_12_Chapter.xhtml#Fig3). ![A455241_1_En_12_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_12_Fig3_HTML.jpg)
    Figure 12-3 Projectiles break asteroids The final thing we’ll do in this exercise
    is add a score indicator and a frame rate indicator. The score and frame rate
    should be presented as numbers, so we’ll add the new NumberIndicator class from
    Listing [12-18](#A455241_1_En_12_Chapter.xhtml#Par69) to our objects.js file.
    function NumberIndicator(label, x, y, options) {   options = options || {}   this.label
    = label + ": ";   this.x = x;   this.y = y;   this.digits = options.digits ||
    0;   this.pt = options.pt || 10;   this.align = options.align || ''end''; } NumberIndicator.prototype.draw
    = function(c, value) {   c.save();   c.fillStyle = "white";   c.font = this.pt
    + "pt Arial";   c.textAlign = this.align;   c.fillText(     this.label + value.toFixed(this.
    digits),     this.x, this.y + this.pt - 1   );   c.restore(); } Listing 12-18
    NumberIndicator The class allows us to specify a label and position for our indicator.
    It also takes an optional options argument that overrides default values. The
    options.digits attribute sets the number of decimal places to present (default
    is 0), the options.pt attribute sets the font size (default is 10 points), and
    the options.align attribute determines the text alignment. It has a draw method
    that takes two arguments, a canvas context on which to draw, and the value to
    show. It simply prints the label and the value separated by a colon. Like the
    Indicator class, the NumberIndicator class avoids the need for low-level drawing
    code in our main AsteroidsGame class. This avoids clutter and helps us to organize
    our code and keep track of what everything does. We’re also going to use it twice,
    which avoids repeating similar code (which is bad). We need to add a couple of
    lines in our AsteroidsGame constructor, as shown in Listing [12-19](#A455241_1_En_12_Chapter.xhtml#Par72).
    this.score_indicator = new NumberIndicator("score",   this.canvas.width - 10,
    5 ); this.fps_indicator = new NumberIndicator("fps",   this.canvas.width - 10,
      this.canvas.height - 15,   {digits: 2} ); Listing 12-19 Some Indicators Then
    we update our AsteroidsGame.prototype.draw method, as shown in Listing [12-20](#A455241_1_En_12_Chapter.xhtml#Par74).
    We only show the frame rate when the guide is on. AsteroidsGame.prototype.draw
    = function() {   this.c.clearRect(0, 0, this.canvas.width, this.canvas.height);
      if(this.guide) {     draw_grid(this.c);     this.asteroids.forEach(function(asteroid)
    {       draw_line(this.c, asteroid, this.ship);       this.projectiles.forEach(function(p)
    {         draw_line(this.c, asteroid, p);       }, this);     }, this);     this.fps_indicator.draw(this.c,
    this.fps);   }   this.asteroids.forEach(function(asteroid) {     asteroid.draw(this.c,
    this.guide);   }, this);   this.ship.draw(this.c, this.guide);   this.projectiles.forEach(function(p)
    {     p.draw(this.c);   }, this);   this.health_indicator.draw(this.c, this.ship.health,
    this.ship.max_health);   this.score_indicator.draw(this.c, this.score); } Listing
    12-20 Some More Indicators The last thing we need is to calculate the frame rate.
    Add a line to the AsteroidsGame.prototype.frame method, as shown in Listing [12-21](#A455241_1_En_12_Chapter.xhtml#Par76).
    AsteroidsGame.prototype.frame = function(timestamp) {   if (!this.previous) this.previous
    = timestamp;   var elapsed = timestamp - this.previous;   this.fps = 1000 / elapsed;
      this.update(elapsed / 1000);   this.draw();   this.previous = timestamp;   window.requestAnimationFrame(this.frame.bind(this));
    } Listing 12-21 Calculating the Frame Rate That’s it! Refresh the page and enjoy
    your new score indicator. Figure [12-4](#A455241_1_En_12_Chapter.xhtml#Fig4) shows
    what you should see. Notice that destroying all the asteroids leaves you with
    a score equal to the mass of one asteroid. All the mass has been converted to
    score. You can also toggle the guide and admire the new fps indicator. ![A455241_1_En_12_Fig4_HTML.jpg](OEBPS/Images/A455241_1_En_12_Fig4_HTML.jpg)
    Figure 12-4 Score and frame rate indicated'
  trans: "\n下一步是检测小行星与炮弹之间的碰撞。如果击中小行星，我们将扣除部分质量，分裂小行星，并增加得分。目前我们每摧毁一个质量单位计为 1 分。每次命中将移除\
    \ 500 个单位质量并获得 500 分。我们将这些新值作为`AsteroidsGame`的属性添加到构造函数中：`this.mass_destroyed\
    \ = 500; this.score = 0;`。为了实现碰撞检测并在小行星被击中时触发分裂，我们需要在`AsteroidsGame.prototype.update`方法中添加一些逻辑。清单\
    \ 12-15 展示了新的方法：\n\n```\nAsteroidsGame.prototype.update = function(elapsed) {\n\
    \  this.ship.compromised = false;\n  this.asteroids.forEach(function(asteroid)\
    \ {\n    asteroid.update(elapsed, this.c);\n    if(collision(asteroid, this.ship))\
    \ {\n      this.ship.compromised = true;\n    }\n  }, this);\n  this.ship.update(elapsed,\
    \ this.c);\n  this.projectiles.forEach(function(p, i, projectiles) {\n    p.update(elapsed,\
    \ this.c);\n    if(p.life <= 0) {\n      projectiles.splice(i, 1);\n    } else\
    \ {\n      this.asteroids.forEach(function(asteroid, j) {\n        if(collision(asteroid,\
    \ p)) {\n          projectiles.splice(i, 1);\n          this.asteroids.splice(j,\
    \ 1);\n          this.split_asteroid(asteroid, elapsed);\n        }\n      },\
    \ this);\n    }\n  }, this);\n  if(this.ship.trigger && this.ship.loaded) {\n\
    \    this.projectiles.push(this.ship.projectile(elapsed));\n  }\n}\n```\n\n**清单\
    \ 12-15 命中时触发小行星分裂**\n\n在`if(p.life <= 0)`块中添加`else`子句，确保我们只测试游戏中当前存活的炮弹。对于每个存活的炮弹，我们遍历所有（已更新过的）小行星并检测碰撞。如果检测到碰撞，我们从游戏中移除该小行星和炮弹。然后，我们调用一个新的辅助方法`split_asteroid`，并将受损的小行星传入。\n\
    \n这个新的辅助方法需要创建子小行星并相应更新得分。它需要从父小行星中移除适当的质量，生成两个总质量正确的子小行星，并给它们施加一个推力使其分离。清单 12-16\
    \ 展示了一个基本实现。\n\n```\nAsteroidsGame.prototype.split_asteroid = function(asteroid,\
    \ elapsed) {\n  asteroid.mass -= this.mass_destroyed;\n  this.score += this.mass_destroyed;\n\
    \  var split = 0.25 + 0.5 * Math.random(); // 不均匀分裂\n  var ch1 = asteroid.child(asteroid.mass\
    \ * split);\n  var ch2 = asteroid.child(asteroid.mass * (1 - split));\n  [ch1,\
    \ ch2].forEach(function(child) {\n    if(child.mass < this.mass_destroyed) {\n\
    \      this.score += child.mass;\n    } else {\n      this.push_asteroid(child,\
    \ elapsed);\n      this.asteroids.push(child);\n    }\n  }, this);\n}\n```\n\n\
    **清单 12-16 分裂小行星**\n\n该函数做了很多工作。首先，它从给定的小行星中移除部分质量并为游戏增加分数。然后，它确定一个（大致均匀的）分裂比例，用于在两个新小行星之间分配质量。创建两个小行星，每个小行星的总质量由原始小行星的剩余质量和分裂比例决定。我们使用`Asteroid.child`辅助方法来创建与父小行星具有相同属性（位置、速度等）的小行星。对于每个新的子小行星，我们给它施加推力并将其添加到游戏中。\n\
    \n我们为小行星设置了最小尺寸，因为太小的小行星很难被击中，并且在受到推力时往往会高速飞行。如果子小行星太小，就不会被添加到游戏中——其质量会直接转化为分数。\n\
    \n新的子小行星是使用另一个辅助方法`Asteroid.child`创建的。该方法简单地用与父小行星相同的速度、旋转角度和位置来初始化新的小行星。清单 12-17\
    \ 展示了该函数。\n\n```\nAsteroid.prototype.child = function(mass) {\n  return new Asteroid(\n\
    \    this.x, this.y, mass,\n    this.x_speed, this.y_speed,\n    this.rotation_speed\n\
    \  )\n}\n```\n\n**清单 12-17 生成子小行星**\n\n现在，刷新你的浏览器并射击小行星！为了在每一帧都能看到碰撞检测的比较结果，我们在炮弹和小行星之间绘制连线。更新`AsteroidsGame.prototype.draw`方法中的`if(this.guide)`块。在现有的小行星循环内嵌套一个炮弹循环，并调用现有的`draw_line`函数。按下\
    \ G 键切换指南模式并射击，即可看到新的参考线。你应该会看到类似图 12-3 的效果。\n\n![Figure 12-3](img/A455241_1_En_12_Fig3_HTML.jpg)\n\
    \n**图 12-3 炮弹击碎小行星**\n\n本练习中我们要做的最后一件事是添加一个得分指示器和一个帧率指示器。得分和帧率应以数字形式呈现，因此我们将清单\
    \ 12-18 中的新`NumberIndicator`类添加到`objects.js`文件中。\n\n```\nfunction NumberIndicator(label,\
    \ x, y, options) {\n  options = options || {}\n  this.label = label + \": \";\n\
    \  this.x = x;\n  this.y = y;\n  this.digits = options.digits || 0;\n  this.pt\
    \ = options.pt || 10;\n  this.align = options.align || 'end';\n}\nNumberIndicator.prototype.draw\
    \ = function(c, value) {\n  c.save();\n  c.fillStyle = \"white\";\n  c.font =\
    \ this.pt + \"pt Arial\";\n  c.textAlign = this.align;\n  c.fillText(\n    this.label\
    \ + value.toFixed(this.digits),\n    this.x, this.y + this.pt - 1\n  );\n  c.restore();\n\
    }\n```\n\n**清单 12-18 `NumberIndicator`**\n\n该类允许我们为指示器指定标签和位置。它还接收一个可选的`options`参数，该参数可以覆盖默认值。`options.digits`属性设置要显示的小数位数（默认为\
    \ 0），`options.pt`属性设置字体大小（默认为 10 磅），`options.align`属性决定文本对齐方式。它有一个`draw`方法，接受两个参数：一个用于绘制的画布上下文（canvas\
    \ context），以及要显示的值。它简单地打印标签和用冒号分隔的值。\n\n与`Indicator`类一样，`NumberIndicator`类避免了在我们的主`AsteroidsGame`类中编写底层绘图代码。这避免了杂乱，有助于我们组织代码并跟踪每个部分的功能。我们还将两次使用它，这避免了重复相似的代码（重复代码是不好的）。\n\
    \n我们需要在`AsteroidsGame`构造函数中添加几行代码，如清单 12-19 所示。\n\n```\nthis.score_indicator =\
    \ new NumberIndicator(\"score\",\n  this.canvas.width - 10, 5\n);\nthis.fps_indicator\
    \ = new NumberIndicator(\"fps\",\n  this.canvas.width - 10,\n  this.canvas.height\
    \ - 15,\n  {digits: 2}\n);\n```\n\n**清单 12-19 一些指示器**\n\n然后我们更新`AsteroidsGame.prototype.draw`方法，如清单\
    \ 12-20 所示。我们仅在指南模式开启时显示帧率。\n\n```\nAsteroidsGame.prototype.draw = function()\
    \ {\n  this.c.clearRect(0, 0, this.canvas.width, this.canvas.height);\n  if(this.guide)\
    \ {\n    draw_grid(this.c);\n    this.asteroids.forEach(function(asteroid) {\n\
    \      draw_line(this.c, asteroid, this.ship);\n      this.projectiles.forEach(function(p)\
    \ {\n        draw_line(this.c, asteroid, p);\n      }, this);\n    }, this);\n\
    \    this.fps_indicator.draw(this.c, this.fps);\n  }\n  this.asteroids.forEach(function(asteroid)\
    \ {\n    asteroid.draw(this.c, this.guide);\n  }, this);\n  this.ship.draw(this.c,\
    \ this.guide);\n  this.projectiles.forEach(function(p) {\n    p.draw(this.c);\n\
    \  }, this);\n  this.health_indicator.draw(this.c, this.ship.health, this.ship.max_health);\n\
    \  this.score_indicator.draw(this.c, this.score);\n}\n```\n\n**清单 12-20 更多指示器**\n\
    \n最后需要做的是计算帧率。在`AsteroidsGame.prototype.frame`方法中添加一行代码，如清单 12-21 所示。\n\n```\n\
    AsteroidsGame.prototype.frame = function(timestamp) {\n  if (!this.previous) this.previous\
    \ = timestamp;\n  var elapsed = timestamp - this.previous;\n  this.fps = 1000\
    \ / elapsed;\n  this.update(elapsed / 1000);\n  this.draw();\n  this.previous\
    \ = timestamp;\n  window.requestAnimationFrame(this.frame.bind(this));\n}\n```\n\
    \n**清单 12-21 计算帧率**\n\n就是这样！刷新页面，欣赏你的新得分指示器。图 12-4 展示了你应该看到的效果。注意，摧毁所有小行星后，你的得分等于一颗小行星的质量。所有的质量都已转化为分数。你还可以切换指南模式并欣赏新的帧率指示器。\n\
    \n![Figure 12-4](img/A455241_1_En_12_Fig4_HTML.jpg)\n\n**图 12-4 显示得分和帧率**\n"
- fmt: "# Summary\n\nWe’ve added functionality to our game. We can now fly around\
    \ destroying asteroids. And we’ve added significant complexity to our code—in\
    \ the `update` and `draw` functions, we’re now managing the game itself. We detect\
    \ collisions and encode the consequences of collisions. The main lesson here is\
    \ that new code should always have a place of its own in the structure. We refactored\
    \ our code at the beginning of the chapter to create a home for our newly composed\
    \ complexity. We didn’t have to do that, but it brings many small benefits and\
    \ simplifications. The functions themselves provide structure within the `game`\
    \ object. When we read through our functions, it’s possible to understand what’s\
    \ going on. Having complex code declared directly in the global scope is always\
    \ a sign that a refactoring to add structure should be considered.© Graeme Stuart\
    \ 2017 Graeme StuartIntroducing JavaScript Game Development [https://doi.org/10.1007/978-1-4842-3252-1_13](https://doi.org/10.1007/978-1-4842-3252-1_13)\n\
    \n# 13. Death or Glory\n\nGraeme Stuart^(1 ) (1) Market Harborough, Leicestershire,\
    \ UK  \n\nOur game is nearly finished. In this chapter we’ll add the finishing\
    \ touches. We’ll add a “game over” state that will end the game when our health\
    \ reduces to zero. We’ll then add the ability to restart the game without reloading\
    \ the page. Finally, we’ll add levels that will allow us to play the game continuously,\
    \ with increasing difficulty and an increasing score multiplier. Copy your code\
    \ into a new folder for the final time. Save a copy of your `exercise12.html`\
    \ file and rename it to `exercise13.html`.\n\n## Game Over\n\nWhen the ship runs\
    \ out of health, nothing happens. We need to change it so the game ends. We’ll\
    \ indicate the game has ended by setting a `game_over` property. First, we need\
    \ to add the property to our `AsteroidsGame` constructor: `this.game_over = false;`\
    \ Now, when we’re in our “game over” state, we want to show the remaining asteroids\
    \ still moving through space, but everything else can stop updating and won’t\
    \ be drawn. Add the following lines into the `AsteroidsGame.prototype.update`\
    \ method, just after we finish updating the asteroids, before the ship and projectiles\
    \ are updated:\n\n```\nif(this.ship.health <= 0) {\n  this.game_over = true;\n\
    \  return;\n}\n```\n\nHere we’re setting the “game over” state if the ship’s health\
    \ drops to 0. We also return from the method so nothing beyond this line will\
    \ be processed. Similarly, in the `AsteroidsGame.prototype.draw` method, add the\
    \ following lines after we’ve drawn the asteroids and before we draw the ship:\n\
    \n```\nif(this.game_over) {\n  return;\n}\n```\n\nThis ensures that we don’t draw\
    \ the ship when the game is up. The asteroids will continue to float about. Refresh\
    \ your browser and try it. If you lose all your health, your ship will disappear,\
    \ and the remaining asteroids will arrogantly celebrate their victory. Anything\
    \ you want to show all the time should be above the `if` block containing the\
    \ `return` statement. Anything you want to show only during “game over” state\
    \ should be placed inside the `if` block and before the `return` statement. Anything\
    \ you want to show only during a running game should be placed after the `if`\
    \ block. We need to tell the user the game is over. Change it as shown in Listing\
    \ 13-1.\n\n```\nif(this.game_over) {\n  this.message.draw(this.c, \"GAME OVER\"\
    , \"Press space to play again\");\n  return;\n}\n```\n\n**Listing 13-1** Send\
    \ a Message\n\nNow add the `Message` object from Listing 13-2 into `objects.js`.\n\
    \n```\nfunction Message(x, y, options) {\n  options = options || {};\n  this.x\
    \ = x;\n  this.y = y;\n  this.main_pt = options.main_pt || 28;\n  this.sub_pt\
    \ = options.sub_pt || 18;\n  this.fill = options.fill || \"white\";\n  this.textAlign\
    \ = options.align || 'center';\n}\n\nMessage.prototype.draw = function(c, main,\
    \ sub) {\n  c.save();\n  c.fillStyle = this.fill;\n  c.textAlign = this.textAlign;\n\
    \  c.font = this.main_pt + \"pt Arial\";\n  c.fillText(main, this.x, this.y);\n\
    \  c.font = this.sub_pt + \"pt Arial\";\n  c.fillText(sub, this.x, this.y + this.main_pt);\n\
    \  c.restore();\n}\n```\n\n**Listing 13-2** Deliver a Message\n\nFinally, update\
    \ the game object constructor to set up the message object: `this.message = new\
    \ Message(this.canvas.width / 2, this.canvas.height * 0.4);` Now refresh the page\
    \ and admire the nice “GAME OVER” message that appears when you run out of health.\
    \ You should see something like Figure 13-1.\n\n![A455241_1_En_13_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_13_Fig1_HTML.jpg)\n\
    \n**Figure 13-1** Introducing jeopardy\n\n## Restarting the Game\n\nWe need to\
    \ handle a spacebar press to reset the game. We’ll implement a `reset_game` method\
    \ so we need to update the `AsteroidsGame.prototype.key_handler` method to call\
    \ this if the `game_over` property is set when the spacebar is pressed.\n\n```\n\
    case \" \":\ncase 32: //spacebar\n  if(this.game_over) {\n    this.reset_game();\n\
    \  } else {\n    this.ship.trigger = value;\n  }\n  break;\n```\n\n**Listing 13-3**\
    \ Restarting the Game with the Spacebar\n\nNow we need to divide the game constructor\
    \ into one-off things that can remain in the constructor and things that need\
    \ to be called every time the game restarts. We now call the `AsteroidsGame.prototype.reset_game`\
    \ method at the end of the constructor, as shown in Listing 13-4.\n\n```\nvar\
    \ AsteroidsGame = function(id) {\n  this.canvas = document.getElementById(id);\n\
    \  this.c = this.canvas.getContext(\"2d\");\n  this.canvas.focus();\n  this.guide\
    \ = false;\n  this.ship_mass = 10;\n  this.ship_radius = 15;\n  this.asteroid_mass\
    \ = 10000; // Mass of asteroids\n  this.asteroid_push = 5000000; // max force\
    \ to apply in one frame\n  this.mass_destroyed = 500;\n  this.health_indicator\
    \ = new Indicator(\"health\", 5, 5, 100, 10);\n  this.score_indicator = new NumberIndicator(\"\
    score\", this.canvas.width - 10, 5);\n  this.message = new Message(this.canvas.width\
    \ / 2, this.canvas.height * 0.4);\n  this.canvas.addEventListener(\"keydown\"\
    , this.keyDown.bind(this), true);\n  this.canvas.addEventListener(\"keyup\", this.keyUp.bind(this),\
    \ true);\n  window.requestAnimationFrame(this.frame.bind(this));\n  this.reset_game();\n\
    }\n\nAsteroidsGame.prototype.reset_game = function() {\n  this.game_over = false;\n\
    \  this.score = 0;\n  this.ship = new Ship(\n    this.canvas.width / 2,\n    this.canvas.height\
    \ / 2,\n    1000, 200\n  );\n  this.projectiles = [];\n  this.asteroids = [];\n\
    \  this.asteroids.push(this.moving_asteroid());\n}\n```\n\n**Listing 13-4** Separate\
    \ out the `AsteroidsGame.prototype.reset_game` Method\n\nThis is just a simple\
    \ reorganization of preexisting code. Try refreshing the browser and losing all\
    \ your health. Pressing space now calls our new method, and the game restarts!\
    \ Nice."
  raw: '## Summary


    We’ve added functionality to our game. We can now fly around destroying asteroids.
    And we’ve added significant complexity to our code—in the update and draw functions,
    we’re now managing the game itself. We detect collisions and encode the consequences
    of collisions. The main lesson here is that new code should always have a place
    of its own in the structure. We refactored our code at the beginning of the chapter
    to create a home for our newly composed complexity. We didn’t have to do that,
    but it brings many small benefits and simplifications. The functions themselves
    provide structure within the game object. When we read through our functions,
    it’s possible to understand what’s going on. Having complex code declared directly
    in the global scope is always a sign that a refactoring to add structure should
    be considered.© Graeme Stuart 2017 Graeme StuartIntroducing JavaScript Game Development
    [https://doi.org/10.1007/978-1-4842-3252-1_13](#A455241_1_En_13_Chapter.xhtml)


