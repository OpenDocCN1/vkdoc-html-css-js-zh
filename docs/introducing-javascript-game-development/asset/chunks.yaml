- fmt: "# Adding Curves to a Path\n\nThere are many other ways to add to a path besides\
    \ `context.lineTo`. A simple way to make your drawings curvy rather than straight\
    \ is to use the alternative `context.quadraticCurveTo` method. It’s very similar\
    \ to `context.lineTo` but requires the coordinates of a control point as well\
    \ as of the end point. The line will curve towards the control point. Replace\
    \ the construction of the last path with the code from Listing 2-7.\n\n```\ncontext.beginPath()\n\
    context.moveTo(50, 250);\ncontext.quadraticCurveTo(25, 300, 50, 350);\ncontext.quadraticCurveTo(100,\
    \ 375, 150, 350);\ncontext.closePath();\ncontext.moveTo(230, 360);\ncontext.quadraticCurveTo(255,\
    \ 340, 270, 360);\ncontext.quadraticCurveTo(255, 340, 270, 310);\ncontext.closePath();\n\
    context.moveTo(250, 50);\ncontext.quadraticCurveTo(310, 60, 370, 50);\ncontext.quadraticCurveTo(400,\
    \ 75, 370, 100);\ncontext.closePath();\ncontext.strokeStyle = \"#FFFF00\";\ncontext.fillStyle\
    \ = \"#000000\";\ncontext.fill();\ncontext.stroke();\n```\n\n**Listing 2-7** Adding\
    \ Curves\n\nThe filled shapes are now made with curves, as shown in Figure 2-10.\n\
    \n![A455241_1_En_2_Fig10_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig10_HTML.jpg)\n\
    \n**Figure 2-10** Quadratic curves\n\nFor more control, we can draw with Bezier\
    \ curves. Redraw the white path with Bezier curves by replacing the first three\
    \ calls to `context.lineTo` after the grid drawing code with `context.bezierCurveTo`,\
    \ as in Listing 2-8.\n\n```\n<script>\n  var canvas = document.getElementById(\"\
    asteroids\");\n  var context = canvas.getContext(\"2d\");\n  draw_grid(context)\n\
    \  context.beginPath();\n  context.strokeStyle = \"#FFFFFF\";\n  context.fillStyle\
    \ = \"#00FF00\";\n  context.lineWidth = 2;\n  context.moveTo(50, 50);\n  context.bezierCurveTo(0,\
    \ 0, 80, 250, 150, 250);\n  context.bezierCurveTo(250, 250, 250, 250, 250, 170);\n\
    \  context.bezierCurveTo(250, 50, 400, 350, 320, 280);\n  context.closePath();\n\
    \  // context.fill();\n  context.stroke();\n  context.fillText(\"(50, 50)\", 30,\
    \ 40);\n  context.fillText(\"(150, 250)\", 130, 260);\n  context.fillText(\"(250,\
    \ 170)\", 255, 175);\n  context.beginPath()\n  context.moveTo(50, 250);\n  context.quadraticCurveTo(25,\
    \ 300, 50, 350);\n  context.quadraticCurveTo(100, 375, 150, 350);\n  context.closePath();\n\
    \  context.moveTo(230, 360);\n  context.quadraticCurveTo(255, 340, 270, 360);\n\
    \  context.quadraticCurveTo(255, 340, 270, 310);\n  context.closePath();\n  context.moveTo(250,\
    \ 50);\n  context.quadraticCurveTo(310, 160, 370, 50);\n  context.quadraticCurveTo(400,\
    \ 75, 370, 100);\n  context.closePath();\n  context.strokeStyle = \"#FFFF00\"\
    ;\n  context.fillStyle = \"#000000\";\n  context.fill();\n  context.stroke();\n\
    </script>\n```\n\n**Listing 2-8** Bezier Curves\n\nBezier curves take the coordinates\
    \ of two control points plus the end point. The resultant path is a curve which\
    \ passes through each of the specified end points. Figure 2-11 shows the final\
    \ result. Bezier curves allow for smooth twisting and turning with relatively\
    \ simple paths.\n\n![A455241_1_En_2_Fig11_HTML.jpg](OEBPS/Images/A455241_1_En_2_Fig11_HTML.jpg)\n\
    \n**Figure 2-11** Bezier curves\n\n## Summary\n\nIn this chapter, we’ve looked\
    \ more closely at the way the canvas interface operates. We saw how the coordinates\
    \ system works and explored in detail how paths are created and modified. We looked\
    \ at various ways to draw lines between points. These are the basic tools at our\
    \ disposal when we want to draw things on the canvas. I also introduced JavaScript\
    \ functions and suggested a refactor early, refactor often approach to structuring\
    \ code. This chapter has continued teaching you some basics and demonstrating\
    \ how it all works. Chapter 3 puts what you’ve learned to work to create a more\
    \ intentional drawing, and looks at functions again.\n\n© Graeme Stuart 2017 \
    \ \nGraeme Stuart, *Introducing JavaScript Game Development*  \n[https://doi.org/10.1007/978-1-4842-3252-1_3](#)\n\
    \n# 3. Drawing to a Design\n\nGraeme Stuart^(1)  \n(1) Market Harborough, Leicestershire,\
    \ UK\n\nIn Chapter 2 we scribbled on the canvas and made a bit of a mess. This\
    \ time we’ll try to render a familiar design. The skills we will look at in this\
    \ chapter are developments of what you’ve learned in previous chapters, though\
    \ in this chapter we’ll be demonstrating clearer intent with what we do. If this\
    \ chapter has a message, it’s this: practice and become confident at each step,\
    \ slowly adding complexity all the while. The things we’ve learned so far are\
    \ pretty simple but are fundamental skills nonetheless. Repeating and adding a\
    \ little bit more complexity is a useful way to practice and elaborate on what\
    \ we have learned. Let’s start the whole process from scratch but bring forward\
    \ our library code from the previous chapter. Try to follow these instructions\
    \ without checking forwards to the code example until you need to:\n\n1. Create\
    \ a new folder called `exercise3` and copy the `drawing.js` file from Chapter\
    \ 2 into the new folder.\n2. Create a new file called `exercise3.html` and set\
    \ up a standard HTML template.\n3. Add a reference to the `drawing.js` library\
    \ in the `<head>` element.\n4. In the `<body>` element, add a `<canvas>` element\
    \ to display our scene.\n5. Add a `<script>` element with the necessary JavaScript\
    \ code to create a reference to a canvas context and to draw a blank grid to the\
    \ canvas by calling the `draw_grid` function, which should be available via the\
    \ reference to our library code."
