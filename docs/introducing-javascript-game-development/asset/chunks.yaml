    In our game we’ll need to have individual asteroids persist until they’re shot
    or the game ends. As it stands, our function can’t do this. It randomizes the
    asteroid shape every time it’s called. The shape data (an array of random numbers)
    needs to be stored and used when drawing the individual asteroids. Each asteroid
    needs its own shape data. A first step towards doing this would be to generate
    the random shape data outside the function and pass it in as a function argument.
    Let’s try it. function draw_asteroid(ctx, radius, shape, options) {   options
    = options || {};   ctx.strokeStyle = options.stroke || "white";   ctx.fillStyle
    = options.fill || "black";   ctx.save();   ctx.beginPath();   for(let i = 0; i
    < shape.length; i++) {     ctx.rotate(2 * Math.PI / shape.length);     ctx.lineTo(radius
    + radius * options.noise * shape[i], 0);   }   ctx.closePath();   ctx.fill();
      ctx.stroke();   if(options.guide) {     ctx.lineWidth = 0.5;     ctx.beginPath();
        ctx.arc(0, 0, radius, 0, 2 * Math.PI);     ctx.stroke();     ctx.beginPath();
        ctx.lineWidth = 0.2;     ctx.arc(0, 0, radius + radius * options.noise, 0,
    2 * Math.PI);     ctx.stroke();     ctx.beginPath();     ctx.arc(0, 0, radius
    - radius * options.noise, 0, 2 * Math.PI);     ctx.stroke();   }   ctx.restore();
    } Listing 5-5 Taking Shape Data We’ve actually made very few changes. The main
    difference is that we now take a shape argument rather than a segments argument.
    The shape can be any array of numbers, but the numbers are assumed to vary between
    –0.5 and +0.5\. Where we previously referenced the segments variable, we now use
    shape.length. Where we generated random numbers, we now use the value of the appropriate
    element in the shape array (shape[i]). We’ve also added the extra guide circles
    indicating the value of noise. To use the new function, we must generate our shape
    data and then we can simply pass it into the function to replace the segments
    argument . Try the code in Listing [5-6](#A455241_1_En_5_Chapter.xhtml#Par24).
    var segments = 15, noise = 0; var shape = []; for(var i = 0; i < segments; i++)
    {   shape.push(2 * (Math.random() - 0.5)); } for(let y=0.1; y<1; y+= 0.2) {   for(let
    x=0.1; x<1; x+= 0.2) {     context.save();     context.translate(context.canvas.width
    * x, context.canvas.height * y);     draw_asteroid(context, context.canvas.width
    / 16, shape, {noise: noise, guide: true});     context.restore();     noise +=
    0.025;   } } Listing 5-6 Using the Same Shape with Different Noise In this case,
    we generate the shape data and then draw a set of 25 asteroids with the same shape
    but with increasing value for the noise argument (see Figure [5-3](#A455241_1_En_5_Chapter.xhtml#Fig3)).
    noise starts at 0 and increases in 0.125 steps to 0.6\. Try experimenting with
    the code. ![A455241_1_En_5_Fig3_HTML.jpg](OEBPS/Images/A455241_1_En_5_Fig3_HTML.jpg)
    Figure 5-3 Using the same shape with increasing noise We now have a function that
    can draw our asteroids according to a configurable noise level. The client code
    that uses the function is responsible for generating the asteroid shape, setting
    the size, and selecting an appropriate noise level. Functions are great for handling
    the nitty-gritty detail and pushing the important decisions up to higher-level
    code.


    ## Summary


    In this chapter we’ve repeated the process of designing an item we’ll need in
    our game. We’ve also introduced something else. If we’re going to draw an asteroid
    spinning across our scene, we’ll need to store data about its shape. The use of
    data that’s tied to the individual item is an important concept. It’s also important
    to understand that writing code is a creative, problem-solving process. The code
    examples in this book serve as examples to demonstrate the concepts. The code
    didn’t appear fully formed, but each example was sculpted and perfected over many
    weeks. Listing [5-3](#A455241_1_En_5_Chapter.xhtml#Par12) shows how a piece of
    code has developed over time—in short, by starting as simple as possible and adapting
    the design if it doesn’t work for what you’re doing. When you write code of your
    own, it’s wise to expect it to be a difficult but rewarding experience. Mastery
    comes with practice. For now, a good way to practice is to elaborate on the examples
    provided. Try drawing an asteroid using a different approach. Add a new parameter
    that can be passed as an optional argument. Display your asteroids in an interesting
    way.


    # Part II

    Animation


    Animation Animation is fairly easy to do with the HTML canvas. All we need to
    do is clear the canvas and draw the scene repeatedly, updating the scene at every
    step. If we repeat this process and draw the scene at around 60 times per second,
    then we are animating. We need to clearly define how each element of the scene
    updates at each step, making sure we keep the code that updates the scene separate
    from the code that draws the scene. The following chapters demonstrate how to
    control an animation with a simple game loop, and we will learn the fundamentals
    of a solid object-oriented approach to designing our game elements. Finally, we
    will develop some of the game elements necessary for our Asteroids game clone
    using a simple approach to inheritance.© Graeme Stuart 2017 Graeme StuartIntroducing
    JavaScript Game Development [https://doi.org/10.1007/978-1-4842-3252-1_6](#A455241_1_En_6_Chapter.xhtml)


    # 6. Basic Animation


    Graeme Stuart^(1 ) (1) Market Harborough, Leicestershire, UK   In previous chapters
    we’ve looked at the nuts and bolts of drawing to the canvas. Now that we have
    a bit of experience, we can turn our attention to animating a scene. Animation
    is quite easy—simply draw a changing scene multiple times per second. In this
    chapter we’ll learn to do this in a very simplistic way in order to understand
    the basics. When drawing ships and asteroids, we need data about their location,
    size, shape, and so on. This data will be used to translate and rotate the context
    so everything appears in the right place. To animate a scene, we update the data
    each frame and redraw the scene over and over as the data changes.'
  trans: "\n# 存储形状数据\n\n在我们的游戏中，需要让每个小行星持续存在，直到被击毁或游戏结束。按目前情况来看，函数无法实现这一点——它每次被调用时都会随机生成小行星的形状。绘制单个小行星时，需要存储并使用形状数据（一组随机数）。每个小行星都需要有自己的形状数据。实现这一目标的第一步是在函数外部生成随机形状数据，并将其作为函数参数传入。让我们来尝试一下。\n\
    \n```\nfunction draw_asteroid(ctx, radius, shape, options) {\n    options = options\
    \ || {};\n    ctx.strokeStyle = options.stroke || \"white\";\n    ctx.fillStyle\
    \ = options.fill || \"black\";\n    ctx.save();\n    ctx.beginPath();\n    for(let\
    \ i = 0; i < shape.length; i++) {\n        ctx.rotate(2 * Math.PI / shape.length);\n\
    \        ctx.lineTo(radius + radius * options.noise * shape[i], 0);\n    }\n \
    \   ctx.closePath();\n    ctx.fill();\n    ctx.stroke();\n    if(options.guide)\
    \ {\n        ctx.lineWidth = 0.5;\n        ctx.beginPath();\n        ctx.arc(0,\
    \ 0, radius, 0, 2 * Math.PI);\n        ctx.stroke();\n        ctx.beginPath();\n\
    \        ctx.lineWidth = 0.2;\n        ctx.arc(0, 0, radius + radius * options.noise,\
    \ 0, 2 * Math.PI);\n        ctx.stroke();\n        ctx.beginPath();\n        ctx.arc(0,\
    \ 0, radius - radius * options.noise, 0, 2 * Math.PI);\n        ctx.stroke();\n\
    \    }\n    ctx.restore();\n}\n```\n\n清单 5-5 传入形状数据\n\n实际上我们只做了很少的改动。主要区别在于，现在我们接受的是\
    \ `shape` 参数，而不是 `segments` 参数。`shape` 可以是任意数字数组，但假设这些数字的取值范围在 -0.5 到 +0.5 之间。之前引用\
    \ `segments` 变量的地方，现在我们改用 `shape.length`。之前生成随机数的地方，现在我们使用 `shape` 数组中对应元素的值（`shape[i]`）。我们还添加了额外的辅助圆，用于指示\
    \ `noise` 参数的值。\n\n要使用这个新函数，我们必须先生成形状数据，然后只需将其传入函数以替换 `segments` 参数即可。请尝试清单 5-6\
    \ 中的代码。\n\n```\nvar segments = 15, noise = 0;\nvar shape = [];\nfor(var i = 0;\
    \ i < segments; i++) {\n    shape.push(2 * (Math.random() - 0.5));\n}\nfor(let\
    \ y=0.1; y<1; y+= 0.2) {\n    for(let x=0.1; x<1; x+= 0.2) {\n        context.save();\n\
    \        context.translate(context.canvas.width * x, context.canvas.height * y);\n\
    \        draw_asteroid(context, context.canvas.width / 16, shape, {noise: noise,\
    \ guide: true});\n        context.restore();\n        noise += 0.025;\n    }\n\
    }\n```\n\n清单 5-6 对不同噪点使用相同形状\n\n在本例中，我们生成形状数据，然后绘制一组 25 个小行星，它们形状相同，但 `noise`\
    \ 参数值逐渐增大（见图 5-3）。`noise` 从 0 开始，以 0.125 的步长递增至 0.6。尝试用代码做些实验。\n\n![A455241_1_En_5_Fig3_HTML.jpg](img/A455241_1_En_5_Fig3_HTML.jpg)\n\
    \n图 5-3 对增加的噪点使用相同形状\n\n现在我们有了一个函数，可以根据可配置的噪点级别绘制小行星。使用该函数的客户端代码负责生成小行星形状、设置大小以及选择合适的噪点级别。函数非常适合处理繁琐的细节，并将重要决策权交给更高级别的代码。\n\
    \n## 本章小结\n\n在本章中，我们重复了设计游戏中所需对象的过程。同时还引入了一个新概念。如果我们想要绘制一个在场景中旋转的小行星，就需要存储其形状数据。使用与单个对象关联的数据是一个重要的概念。理解编写代码是一个创造性的问题解决过程同样重要。本书中的代码示例只是用来演示概念的范例。这些代码并非一气呵成，而是经过数周的打磨和完善才形成的。清单\
    \ 5-3 展示了代码如何随时间演变——简而言之，就是从尽可能简单的版本开始，如果设计不适用于当前需求，则进行调整。当你自己编写代码时，明智的做法是预料到这将是一个困难但回报丰厚的过程。熟能生巧。目前，练习的一个好方法是对提供的示例进行扩展。尝试使用不同的方法绘制小行星。添加一个可作为可选参数传入的新参数。以一种有趣的方式展示你的小行星。\n\
    \n# 第二部分\n## 动画\n\n使用 HTML Canvas 实现动画相当简单。我们只需要反复清除画布并绘制场景，每一步都更新场景即可。如果重复这个过程，并以每秒约\
    \ 60 帧的速度绘制场景，那么我们就实现了动画效果。我们需要清晰定义场景中每个元素在每一步如何更新，确保将更新场景的代码与绘制场景的代码分开。接下来的章节将演示如何通过简单的游戏循环来控制动画，我们将学习设计游戏元素的扎实的面向对象方法的基础知识。最后，我们将使用一种简单的继承方法，为我们的\"\
    小行星\"游戏克隆体开发一些必要的游戏元素。© Graeme Stuart 2017 Graeme Stuart《Introducing JavaScript\
    \ Game Development》 `doi.org/10.1007/978-1-4842-3252-1_6`\n\n# 第 6 章 基本动画\n\n\
    Graeme Stuart (1) (1) 英国莱斯特郡马基特哈伯勒\n\n在前几章中，我们学习了在画布上绘图的基本原理。现在我们有了一些经验，可以把注意力转向如何让场景动起来。动画相当简单——只需每秒多次绘制一个变化的场景。在本章中，我们将以一种非常简单的方式学习如何实现这一点，以理解其基础原理。当绘制飞船和小行星时，我们需要关于它们位置、大小、形状等数据。这些数据将用于平移和旋转上下文，使所有元素出现在正确的位置。为了制作场景动画，我们每帧更新数据，并随着数据的变化反复重绘场景。\n"
- fmt: "# Start Simple\n\nLet’s start off with a very simple scene: a single moving\
    \ circle. The circle has a position on the canvas (`x`- and `y`-coordinates),\
    \ which we will move. Create a new folder in the usual way: copy over the `drawing.js`\
    \ library and stylesheet. Create a new file `exercise6.html` with the code in\
    \ Listing [6-1](#A455241_1_En_6_Chapter.xhtml#Par4).\n\n```html\n<!doctype html>\n\
    <html>\n  <head>\n    <title>Animation</title>\n    <link rel=\"stylesheet\" href=\"\
    styles.css\">\n    <script src=\"drawing.js\"></script>\n  </head>\n  <body>\n\
    \    <h1>Animation</h1>\n    <canvas id=\"asteroids\" width=\"300\" height=\"\
    300\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
    asteroids\").getContext(\"2d\");\n      context.strokeStyle = \"white\";\n   \
    \   context.lineWidth = 1.5;\n      var x = 0, y = context.canvas.height / 2;\n\
    \      function frame() {\n        context.clearRect(0, 0, context.canvas.width,\
    \ context.canvas.height);\n        draw(context);\n        update();\n      }\n\
    \      function update() {\n        x += 1;\n      }\n      function draw(ctx)\
    \ {\n        draw_grid(ctx);\n        ctx.beginPath();\n        ctx.arc(x, y,\
    \ 40, 0, 2 * Math.PI);\n        ctx.fill();\n        ctx.stroke();\n      }\n\
    \      setInterval(frame, 1000.0/60.0); // 60 fps\n    </script>\n  </body>\n\
    </html>\n```\n\nListing 6-1 A Moving Circle\n\nThe code is mostly familiar, but\
    \ there are a few new things to notice. First, we’re storing the `x`- and `y`-coordinates\
    \ as global variables. We’ve also restructured our code into a series of functions:\
    \ `frame`, `update`, and `draw`. The `frame` function does three distinct things.\
    \ It clears the canvas using the `context.clearRect` method. Then it calls the\
    \ `draw` function, which draws a circle at position `x`, `y`, and it calls the\
    \ `update` function, which moves the `x`-coordinate one pixel to the right. The\
    \ final new thing is the call to `setInterval`, which schedules the `frame` function\
    \ to be called 60 times per second.\n\nThe result is that each time the `frame`\
    \ function is called, it clears the canvas, draws a grid, draws a circle at the\
    \ current position, and moves the position to the right. The call to `setInterval`\
    \ passes in the function to be called (`frame`) and the time interval in milliseconds\
    \ between calls (`1000.0 / 60.0`). So, the `frame` function is called every sixtieth\
    \ of a second, and the circle moves to the right at 60 pixels per second.\n\n\
    Once the circle moves beyond the end of the canvas, it’s no longer visible, but\
    \ the value of `x` continues to increment. Try experimenting with the `update`\
    \ function to change the behavior of our circle. Here are a few simple ideas:\n\
    \n- Increment the `x` coordinate by a different value (for example, `5`)\n- Increment\
    \ the `y` coordinate as well\n- Decrement the coordinates\n- Set the `y` coordinate\
    \ to a random number (between `0` and the canvas height)\n\n## A More Complicated\
    \ Example\n\nLet’s focus on the `update` function and give our circle some more\
    \ complicated behavior. For example, we can add a gravity effect to make the circle\
    \ accelerate downwards. Add a line after the `x` and `y` definitions to define\
    \ the variables we’ll need:\n\n```js\nvar yspeed = 0, gravity = 0.1;\n```\n\n\
    Update your `update` function like so:\n\n```js\nfunction update() {\n  x += 1;\n\
    \  y += yspeed;\n  yspeed += gravity;\n}\n```\n\nHere we’re moving the `y` coordinate\
    \ according to the `yspeed` and incrementing `yspeed` by the value of `gravity`.\
    \ The circle accelerates off the bottom of the canvas pretty quickly. Let’s make\
    \ the circle bounce when it hits the bottom of the screen. Bouncing is simply\
    \ switching the direction of travel, like this:\n\n```js\nfunction update() {\n\
    \  x += 1;\n  y += yspeed;\n  yspeed += gravity;\n  if(y >= context.canvas.height)\
    \ { // if you hit the bottom\n    yspeed *= -1;                  // move up instead\
    \ of down\n  }\n}\n```\n\nIf you want to lose a bit of energy on every bounce,\
    \ then multiply by less than `-1` (for example, `-0.8`).\n\n**Note** Be careful\
    \ about this. Consider what would happen if the `yspeed` were `+10` (pixels per\
    \ frame) and the `y` coordinate were just `1` pixel short of the canvas height.\n\
    \n1. The `y` coordinate increases to `9` pixels beyond the canvas height, and\
    \ `yspeed` is updated to `-8`.\n2. The `y` coordinate decreases to `1` pixel beyond\
    \ the canvas height, and `yspeed` is set to `+6.4`."
