    \ + 0.0075 * Math.PI);\n  }\n}\n```\n\n清单 4-7 控制变量\n\n![A455241_1_En_4_Fig6_HTML.jpg](img/A455241_1_En_4_Fig6_HTML.jpg)\n\
    \n图 4-6 使用画布变换进行受控的飞船绘制\n"
- fmt: "飞船的外观看起来不错，但略显方正。下一步是掌控曲线。幸运的是，这非常简单。首先要做的是找出一条我们想将其变为曲线的直线。飞船的后部显然是首选。对于二次曲线，我们需要一个控制点来“拉”动直线，使其变成曲线。在本例中，该点将位于飞船后部的中轴线上，其\
    \ `y` 坐标为 0。确定这一点后，我们就可以将一条 `context.lineTo` 调用转换为 `context.quadraticCurveTo`\
    \ 调用。请按清单 [4-8](#A455241_1_En_4_Chapter.xhtml#Par44) 所示，更新你的 `draw_ship` 函数。\n\
    \n```\nfunction draw_ship(ctx, radius, options) {\n  options = options || {};\n\
    \  let angle = (options.angle || 0.5 * Math.PI) / 2;\n  // this is new\n  let\
    \ curve = options.curve || 0.5;\n  ctx.save();\n  if(options.guide) {\n    ctx.strokeStyle\
    \ = \"white\";\n    ctx.fillStyle = \"rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth\
    \ = 0.5;\n    ctx.beginPath();\n    ctx.arc(0, 0, radius, 0, 2 * Math.PI);\n \
    \   ctx.stroke();\n    ctx.fill();\n  }\n  ctx.lineWidth = options.lineWidth ||\
    \ 2;\n  ctx.strokeStyle = options.stroke || \"white\";\n  ctx.fillStyle = options.fill\
    \ || \"black\";\n  ctx.beginPath();\n  ctx.moveTo(radius, 0);\n  ctx.lineTo(\n\
    \    Math.cos(Math.PI - angle) * radius,\n    Math.sin(Math.PI - angle) * radius\n\
    \  );\n  // here we have added a control point based on the curve variable\n \
    \ ctx.quadraticCurveTo(radius * curve - radius, 0,\n    Math.cos(Math.PI + angle)\
    \ * radius,\n    Math.sin(Math.PI + angle) * radius\n  );\n  ctx.closePath();\n\
    \  ctx.fill();\n  ctx.stroke();\n  // a new guide line and circle show the control\
    \ point\n  if(options.guide) {\n    ctx.strokeStyle = \"white\";\n    ctx.lineWidth\
    \ = 0.5;\n    ctx.beginPath();\n    ctx.moveTo(-radius, 0);\n    ctx.lineTo(0,\
    \ 0);\n    ctx.stroke();\n    ctx.beginPath();\n    ctx.arc(radius * curve - radius,\
    \ 0, radius/50, 0, 2 * Math.PI);\n    ctx.stroke();\n  }\n  ctx.restore();\n}\n\
    ```\n\n**清单 4-8** 使用二次曲线\n\n我们添加了一个名为 `curve` 的可选变量，其默认值为 0.5。在绘制飞船后部两个角之间的线条时，我们现在使用二次曲线而非直线。该曲线的控制点位于飞船的中轴线上。如果\
    \ `curve` 的值为 0，则控制点位于圆的半径上；如果 `curve` 的值设为 1，则控制点位于圆的中心。\n\n现在，为了测试该函数，我们将随机化这个新参数，并在画布中心绘制一艘大型飞船。每次刷新页面（例如，按\
    \ `Ctrl+R`），都会选择一个新值，并且画布会更新：\n\n```\ncontext.translate(200, 200);\ndraw_ship(context,\
    \ 150, {curve: Math.random(), guide: true});\n```\n\n我们还添加了一段新的辅助线代码，用于在飞船顶部绘制控制点。我们在控制点的位置绘制一个实心圆点，以帮助展示曲线是如何构建的。此外，我们还绘制了一条线，以显示控制点的潜在范围（介于\
    \ 0 和 1 之间）。请注意，曲线不一定穿过该点，而是朝向它绘制。\n\n你应该能看到类似图 [4-7](#A455241_1_En_4_Chapter.xhtml#Fig7)\
    \ 的效果。\n\n![A455241_1_En_4_Fig7_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig7_HTML.jpg)\n\
    \n**图 4-7** 添加曲线\n\n尝试手动设置 `curve` 的值。低于 0 和高于 1 的值在一定范围内也是有效的。请确保你理解这里发生了什么。如前所述，飞船应尽可能靠近圆的边缘绘制，以便碰撞检测更准确。尽管我们对形状要求不严格，但其位置和大小应尽可能与圆匹配。\n\
    \n我们将为飞船设计添加的最终修饰是将其侧边绘制成二次曲线。实现方法有多种，这里我们将在飞船两侧与后部相对的位置各放置一个控制点。我们将以参数的形式指定其在圆中的位置。该位置（从\
    \ 0 到 1，对应圆心到半径）决定了控制点将放置的地方。数值越大，侧边越向外拉，从而填充圆内更多的空间；数值越小，侧边越向内收。\n\n清单 [4-9](#A455241_1_En_4_Chapter.xhtml#Par53)\
    \ 展示了最终代码。\n\n```\nfunction draw_ship(ctx, radius, options) {\n  options = options\
    \ || {};\n  let angle = (options.angle || 0.5 * Math.PI) / 2;\n  // Now we have\
    \ two curve arguments\n  let curve1 = options.curve1 || 0.25;\n  let curve2 =\
    \ options.curve2 || 0.75;\n  ctx.save();\n  if(options.guide) {\n    ctx.strokeStyle\
    \ = \"white\";\n    ctx.fillStyle = \"rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth\
    \ = 0.5;\n    ctx.beginPath();\n    ctx.arc(0, 0, radius, 0, 2 * Math.PI);\n \
    \   ctx.stroke();\n    ctx.fill();\n  }\n  ctx.lineWidth = options.lineWidth ||\
    \ 2;\n  ctx.strokeStyle = options.stroke || \"white\";\n  ctx.fillStyle = options.fill\
    \ || \"black\";\n  ctx.beginPath();\n  ctx.moveTo(radius, 0);\n  // here we have\
    \ the three curves\n  ctx.quadraticCurveTo(\n    Math.cos(angle) * radius * curve2,\n\
    \    Math.sin(angle) * radius * curve2,\n    Math.cos(Math.PI - angle) * radius,\n\
    \    Math.sin(Math.PI - angle) * radius\n  );\n  ctx.quadraticCurveTo(-radius\
    \ * curve1, 0,\n    Math.cos(Math.PI + angle) * radius,\n    Math.sin(Math.PI\
    \ + angle) * radius\n  );\n  ctx.quadraticCurveTo(\n    Math.cos(-angle) * radius\
    \ * curve2,\n    Math.sin(-angle) * radius * curve2,\n    radius, 0\n  );\n  ctx.fill();\n\
    \  ctx.stroke();\n  // the guide drawing code is getting complicated\n  if(options.guide)\
    \ {\n    ctx.strokeStyle = \"white\";\n    ctx.fillStyle = \"white\";\n    ctx.lineWidth\
    \ = 0.5;\n    ctx.beginPath();\n    ctx.moveTo(\n      Math.cos(-angle) * radius,\n\
    \      Math.sin(-angle) * radius\n    );\n    ctx.lineTo(0, 0);\n    ctx.lineTo(\n\
    \      Math.cos(angle) * radius,\n      Math.sin(angle) * radius\n    );\n   \
    \ ctx.moveTo(-radius, 0);\n    ctx.lineTo(0, 0);\n    ctx.stroke();\n    ctx.beginPath();\n\
    \    ctx.arc(\n      Math.cos(angle) * radius * curve2,\n      Math.sin(angle)\
    \ * radius * curve2,\n      radius/40, 0, 2 * Math.PI\n    );\n    ctx.fill();\n\
    \    ctx.beginPath();\n    ctx.arc(\n      Math.cos(-angle) * radius * curve2,\n\
    \      Math.sin(-angle) * radius * curve2,\n      radius/40, 0, 2 * Math.PI\n\
    \    );\n    ctx.fill();\n    ctx.beginPath();\n    ctx.arc(radius * curve1 -\
    \ radius, 0, radius/50, 0, 2 * Math.PI);\n    ctx.fill();\n  }\n  ctx.restore();\n\
    }\n```\n\n**清单 4-9** 曲线飞船\n\n改动实际上非常小——我们只是添加了一些控制点，并使用前面描述的简单三角函数进行计算。大部分新增代码实际上都用于绘制控制点！请专注于主代码中的改动。我们将\
    \ `options.curve` 值改成了 `options.curve1` 和 `options.curve2`。剩下的两次 `context.lineTo`\
    \ 调用已被转换为 `context.quadraticCurveTo` 调用，并指定了控制点。\n\n同样，调用它非常简单：\n\n```\ncontext.translate(200,\
    \ 200);\ndraw_ship(context, 150, {\n  curve1: Math.random(),\n  curve2: Math.random(),\n\
    \  guide: true\n});\n```\n\n尝试一下，你应该能得到类似图 [4-8](#A455241_1_En_4_Chapter.xhtml#Fig8)\
    \ 的效果。刷新页面（`Ctrl+R`），每次都应该能看到不同的随机变体。\n\n![A455241_1_En_4_Fig8_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig8_HTML.jpg)\n\
    \n**图 4-8** 全曲线飞船\n\n尝试清单 [4-10](#A455241_1_En_4_Chapter.xhtml#Par59) 中的代码，看看我们能用新方法绘制出哪些替代飞船。最终你应该会得到类似图\
    \ [4-9](#A455241_1_En_4_Chapter.xhtml#Fig9) 的效果。\n\n```\nvar context = document.getElementById(\"\
    asteroids\").getContext(\"2d\");\ndraw_grid(context);\nlet c1 = 0, c2 = 0;\nfor(c1=0.1;\
    \ c1<1; c1+=0.2) {\n  for(c2=0.1; c2<1; c2+=0.2) {\n    context.save();\n    context.translate(context.canvas.width\
    \ * c1, context.canvas.height * c2)\n    context.rotate(-Math.PI/2);\n    draw_ship(context,\
    \ context.canvas.width / 12, {curve1: c1, curve2: c2, guide : true});\n    context.restore();\n\
    \  }\n}\n```\n\n**清单 4-10** 绘制多种变体\n\n![A455241_1_En_4_Fig9_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig9_HTML.jpg)\n\
    \n**图 4-9** 一系列备选飞船\n\n现在我们拥有一个完整、完全可配置的飞船绘制函数，只需导入我们的 `drawing.js` 库即可在游戏中使用。通过定义自己的函数来增加结构，可以使复杂代码更易于理解。"
  raw: 'The ship is looking nice, but it’s a bit boxy. The next step is to take control
    of the curves. Luckily, that’s really simple. The first thing to do is identify
    a straight line that we want to turn into a curve. The rear of the ship is the
    obvious first choice. Now, for a quadratic curve we need a single control point
    that will “pull” the straight line into a curve. In this case, it will be a point
    towards the back of the ship on the central line of the ship, where the y-coordinate
    is 0\. With this decided, we can convert one context.lineTo call to a context.quadraticCurveTo
    call. Update your draw_ship function , as shown in Listing [4-8](#A455241_1_En_4_Chapter.xhtml#Par44).
    function draw_ship(ctx, radius, options) {   options = options || {};   let angle
    = (options.angle || 0.5 * Math.PI) / 2;   // this is new   let curve = options.curve
    || 0.5;   ctx.save();   if(options.guide) {     ctx.strokeStyle = "white";     ctx.fillStyle
    = "rgba(0, 0, 0, 0.25)";     ctx.lineWidth = 0.5;     ctx.beginPath();     ctx.arc(0,
    0, radius, 0, 2 * Math.PI);     ctx.stroke();     ctx.fill();   }   ctx.lineWidth
    = options.lineWidth || 2;   ctx.strokeStyle = options.stroke || "white";   ctx.fillStyle
    = options.fill || "black";   ctx.beginPath();   ctx.moveTo(radius, 0);   ctx.lineTo(
        Math.cos(Math.PI - angle) * radius,     Math.sin(Math.PI - angle) * radius
      );   // here we have added a control point based on the curve variable   ctx.quadraticCurveTo(radius
    * curve - radius, 0,     Math.cos(Math.PI + angle) * radius,     Math.sin(Math.PI
    + angle) * radius   );   ctx.closePath();   ctx.fill();   ctx.stroke();   // a
    new guide line and circle show the control point   if(options.guide) {     ctx.strokeStyle
    = "white";     ctx.lineWidth = 0.5;     ctx.beginPath();     ctx.moveTo(-radius,
    0);     ctx.lineTo(0, 0);     ctx.stroke();     ctx.beginPath();     ctx.arc(radius
    * curve - radius, 0, radius/50, 0, 2 * Math.PI);     ctx.stroke();   }   ctx.restore();
    } Listing 4-8 Using Quadratic Curves We’ve added a new optional variable called
    curve. The default value is 0.5\. When we draw the line between the rear corners
    of the ship, we now use a quadratic curve rather than a straight line. The control
    point for the curve is on the central axis of the ship. If the value of curve
    is 0, then the control point in on the radius of the circle. If the value of curve
    is set to 1, then the control point is the center of the circle. Now, to test
    the function we’ll randomize the new argument and draw a large ship in the center
    of the canvas. Each time the page is refreshed (for example, by pressing Ctrl+R),
    a new value will be selected, and the canvas will update: context.translate(200,
    200); draw_ship(context, 150, {curve: Math.random(), guide: true}); We also add
    a new section of guide code to draw the control point on top of the ship. We draw
    a filled dot at the position of the control point to help show how the curve is
    constructed. We also draw a line to show the potential extent of the control point
    (between 0 and 1). Notice that the curve doesn’t necessarily pass through the
    dot but is drawn towards it. You should see something like Figure [4-7](#A455241_1_En_4_Chapter.xhtml#Fig7).
    ![A455241_1_En_4_Fig7_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig7_HTML.jpg) Figure
    4-7 Adding a curve Try setting the value of curve manually. Values below 0 and
    above 1 are valid up to a point. Make sure you understand what’s happening here.
    As noted before, the ship should be drawn as close to the circle edge as possible
    so that collisions are more accurate. Though we’re relaxed about the shape, we
    want its position and size to match the circle as closely as possible. The final
    embellishment we’ll add to the spaceship design is to draw the sides as quadratic
    curves. This can be done in many ways, here we’ll place a control point on either
    side of the ship at opposite points to the rear corners. We’ll specify the position
    in the circle as an argument. This is the position (from 0 to 1, center to radius)
    at which the control point will be placed. Larger numbers will pull the sides
    out so they fill more of the space inside the circle, smaller numbers will pull
    the sides inwards. Listing [4-9](#A455241_1_En_4_Chapter.xhtml#Par53) shows the
    final code . function draw_ship(ctx, radius, options) {   options = options ||
    {};   let angle = (options.angle || 0.5 * Math.PI) / 2;   // Now we have two curve
    arguments   let curve1 = options.curve1 || 0.25;   let curve2 = options.curve2
    || 0.75;   ctx.save();   if(options.guide) {     ctx.strokeStyle = "white";     ctx.fillStyle
    = "rgba(0, 0, 0, 0.25)";     ctx.lineWidth = 0.5;     ctx.beginPath();     ctx.arc(0,
    0, radius, 0, 2 * Math.PI);     ctx.stroke();     ctx.fill();   }   ctx.lineWidth
    = options.lineWidth || 2;   ctx.strokeStyle = options.stroke || "white";   ctx.fillStyle
    = options.fill || "black";   ctx.beginPath();   ctx.moveTo(radius, 0);   // here
    we have the three curves   ctx.quadraticCurveTo(     Math.cos(angle) * radius
    * curve2,     Math.sin(angle) * radius * curve2,     Math.cos(Math.PI - angle)
    * radius,     Math.sin(Math.PI - angle) * radius   );   ctx.quadraticCurveTo(-radius
    * curve1, 0,     Math.cos(Math.PI + angle) * radius,     Math.sin(Math.PI + angle)
    * radius   );   ctx.quadraticCurveTo(     Math.cos(-angle) * radius * curve2,
        Math.sin(-angle) * radius * curve2,     radius, 0   );   ctx.fill();   ctx.stroke();
      // the guide drawing code is getting complicated   if(options.guide) {     ctx.strokeStyle
    = "white";     ctx.fillStyle = "white";     ctx.lineWidth = 0.5;     ctx.beginPath();
        ctx.moveTo(       Math.cos(-angle) * radius,       Math.sin(-angle) * radius
        );     ctx.lineTo(0, 0);     ctx.lineTo(       Math.cos(angle) * radius,       Math.sin(angle)
    * radius     );     ctx.moveTo(-radius, 0);     ctx.lineTo(0, 0);     ctx.stroke();
        ctx.beginPath();     ctx.arc(       Math.cos(angle) * radius * curve2,       Math.sin(angle)
    * radius * curve2,       radius/40, 0, 2 * Math.PI     );     ctx.fill();     ctx.beginPath();
        ctx.arc(       Math.cos(-angle) * radius * curve2,       Math.sin(-angle)
    * radius * curve2,       radius/40, 0, 2 * Math.PI     );     ctx.fill();     ctx.beginPath();
        ctx.arc(radius * curve1 - radius, 0, radius/50, 0, 2 * Math.PI);     ctx.fill();
      }   ctx.restore(); } Listing 4-9 Curvy Ships The changes are actually quite
    small—we’re only adding some control points calculated using simple trigonometry
    as described earlier. The majority of the additional code is actually for drawing
    the control points! Focus on the changes in the main code. We’ve changed the options.curve
    value into options.curve1 and options.curve2. The two remaining calls to context.lineTo
    have been converted to calls to context.quadraticCurveTo and have specified the
    control points. Again, calling it is straightforward: context.translate(200, 200);
    draw_ship(context, 150, {   curve1: Math.random(),   curve2: Math.random(),   guide:
    true }); Try this and you should get something like Figure [4-8](#A455241_1_En_4_Chapter.xhtml#Fig8).
    Refresh the page (Ctrl+R) and you should see random variants drawn each time .
    ![A455241_1_En_4_Fig8_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig8_HTML.jpg) Figure
    4-8 A fully curved spaceship Try the code in Listing [4-10](#A455241_1_En_4_Chapter.xhtml#Par59)
    to check out some of the alternative ships we can draw with our new method . You
    should end up with something like Figure [4-9](#A455241_1_En_4_Chapter.xhtml#Fig9).
    var context = document.getElementById("asteroids").getContext("2d"); draw_grid(context);
    let c1 = 0, c2 = 0; for(c1=0.1; c1<1; c1+=0.2) {   for(c2=0.1; c2<1; c2+=0.2)
    {     context.save();     context.translate(context.canvas.width * c1, context.canvas.height
    * c2)     context.rotate(-Math.PI/2);     draw_ship(context, context.canvas.width
    / 12, {curve1: c1, curve2: c2, guide : true});     context.restore();   } } Listing
    4-10 Drawing Multiple Variations ![A455241_1_En_4_Fig9_HTML.jpg](OEBPS/Images/A455241_1_En_4_Fig9_HTML.jpg)
    Figure 4-9 A series of alternative spaceships Now we have a complete, fully configurable
    ship drawing function we can use in our game by simply importing our drawing.js
    library. Adding structure by defining your own functions makes complex code far
    easier to comprehend.'
