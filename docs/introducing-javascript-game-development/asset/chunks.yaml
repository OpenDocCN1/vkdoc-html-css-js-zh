  trans: "\n# 排版后的文本\n\n由于 `yspeed` 在每一帧中都会更新（反转并缩小），位置永远不会低于画布高度。要解决此问题，请确保在每次反转\
    \ `yspeed` 时，将圆移动到画布高度。现在，我们希望看到圆在画布上水平“环绕”。将以下行添加到你的 `update` 函数中：\n\n```\nif(x\
    \ <= 0 || x >= context.canvas.width) {\n  x = (x + context.canvas.width) % context.canvas.width;\n\
    }\n```\n\n现在我们可以更进一步，添加更多变量，并选择绘制一个吃豆人（Pac-Man）而不是一个球。这展示了将更新和绘制代码分离，并拥有便捷绘图函数的好处。更新你的代码以反映列表\
    \ 6-2。\n\n```\n<!doctype html>\n<html>\n  <head>\n    <title>Animation</title>\n\
    \    <link rel=\"stylesheet\" href=\"styles.css\">\n    <script src=\"drawing.js\"\
    ></script>\n  </head>\n  <body>\n    <h1>Animation</h1>\n    <canvas id=\"asteroids\"\
    \ width=\"300\" height=\"300\"></canvas>\n    <script>\n      var context = document.getElementById(\"\
    asteroids\").getContext(\"2d\");\n      context.strokeStyle = \"white\";\n   \
    \   context.lineWidth = 1.5;\n      let x = 0, y = context.canvas.height / 5,\
    \ radius = 20;\n      let xspeed = 1.5, yspeed = 0, gravity = 0.1;\n      let\
    \ mouth = 0;\n      function frame() {\n        context.clearRect(0, 0, context.canvas.width,\
    \ context.canvas.height);\n        draw(context);\n        update();\n      }\n\
    \      function update() {\n        x += xspeed;\n        y += yspeed;\n     \
    \   yspeed += gravity;\n        if(y >= context.canvas.height - radius) {\n  \
    \        y = context.canvas.height - radius; // add an extra radius\n        \
    \  yspeed *= -0.6;                          // reverse and slow down\n       \
    \   xspeed *= 0.95;                          // just slow down a bit\n       \
    \ }\n        if(x <= 0 || x >= context.canvas.width) {\n          x = (x + context.canvas.width)\
    \ % context.canvas.width;\n        }\n        mouth = Math.abs(Math.sin(6 * Math.PI\
    \ * x / (context.canvas.width)));\n      }\n      function draw(ctx) {\n     \
    \   draw_grid(ctx);\n        // draw a simple circle\n        ctx.beginPath();\n\
    \        ctx.arc(x, y, radius, 0, 2 * Math.PI);\n        ctx.fill();\n       \
    \ ctx.stroke();\n        // or try this instead\n        // ctx.save();\n    \
    \    // ctx.translate(x, y);\n        // draw_pacman(ctx, radius, mouth);\n  \
    \      // ctx.restore();\n      }\n      setInterval(frame, 1000.0/60.0); // 60\
    \ fps\n    </script>\n  </body>\n</html>\n```\n\n**列表 6-2** 弹跳球/吃豆人\n\n我们在这里大展拳脚，通过追踪另一个变量来控制嘴巴的角度。`mouth`\
    \ 角度现在与 `x` 坐标绑定，并遵循正弦波，吃豆人每次穿过画布时，嘴巴会开合六次。嘴巴的位置与 `x` 坐标的位置紧密相关。这只是为了好玩。你可以随意按自己喜欢的方式更新\
    \ `mouth` 变量。\n\n请注意，其他主要变化涉及添加 `xspeed` 变量和 `radius`，以及调整让物体从画布底部弹起的代码。我们不再让物体陷入画布一半的位置。`draw_pacman`\
    \ 函数需要更新，以便在上下文原点进行绘制，如列表 6-3 所示。\n\n```\nfunction draw_pacman(ctx, radius, mouth)\
    \ {\n  angle = 0.2 * Math.PI * mouth;\n  ctx.save();\n  ctx.fillStyle = \"yellow\"\
    ;\n  ctx.strokeStyle = \"black\";\n  ctx.lineWidth = 0.5;\n  ctx.beginPath();\n\
    \  ctx.arc(0, 0, radius, angle, -angle);\n  ctx.lineTo(0, 0);\n  ctx.closePath()\n\
    \  ctx.fill();\n  ctx.stroke();\n  ctx.restore();\n}\n```\n\n**列表 6-3** 在原点绘制吃豆人\n\
    \n为了明确这里发生了什么，我们可以反向跟踪代码。对 `setInterval` 的调用导致 `frame` 每秒被调用 60 次。对 `frame` 的重复调用会清除画布、调用\
    \ `update`，然后调用 `draw`。`update` 函数更新变量 `x`、`y`、`yspeed`、`xspeed` 和 `mouth`。`draw`\
    \ 函数使用这些变量渲染圆形（或吃豆人），以确定其位置和嘴巴角度。最终结果是圆形/吃豆人在画布上弹跳。你应该会看到类似于图 6-1 的效果。试着移除对 `context.clearRect`\
    \ 的调用，看看为什么需要保留它。\n\n![A455241_1_En_6_Fig1_HTML.jpg](img/A455241_1_En_6_Fig1_HTML.jpg)\n\
    \n**图 6-1** 吃豆人在画布上大快朵颐\n\n## 小结\n\n在本章中，我们了解了动画的基本原理：我们逐帧渲染场景，并控制与游戏元素相关的数据。将绘制场景和更新数据这两个基本任务分离成两个不同的函数，是保持结构化方法的第一步。我们如何管理这些数据，是游戏在开发过程中能否增加复杂性的关键方面。需要说明的是，基于\
    \ `setInterval` 进行动画制作并非最佳实践。现代浏览器实现了一种专门用于在 Web 上进行动画制作的机制。我们应该迅速转向使用 `window.requestAnimationFrame`\
    \ 方法来控制我们的游戏循环。那么，让我们开始吧。\n\n© Graeme Stuart 2017  \nGraeme Stuart, *Introducing\
    \ JavaScript Game Development*  \n`doi.org/10.1007/978-1-4842-3252-1_7`\n\n# 7.\
    \ 让小行星动起来\n\nGraeme Stuart<sup>1</sup>\n\n(1) 英国莱斯特郡马基特哈伯勒\n\n在本章中，我们将为代码引入一些关键结构。前几章介绍了需要存储与游戏元素相关的数据。本章将介绍如何使用对象来解决由此带来的复杂性爆炸问题。对象是一个很好的解决方案，因为它们能使数据和代码紧密相连。既然我们现在可以实现动画，就可以开始构建游戏的主要部分了。我们将首先让一些小行星出现在屏幕上，并漂浮移动。小行星在太空中漂浮，它们会一直运动，直到被击中或游戏结束。它们的速度和旋转是随机初始化的，并且永远不会改变。\n\
    \n## 稳固的游戏循环\n"
- fmt: "`window.requestAnimationFrame` API 允许开发者专门请求浏览器绘制动画的下一帧。它受益于许多优化，例如按系统刷新率工作，并确保渲染与浏览器自身的重绘周期同步。它还能在页面最小化或选择了其他浏览器标签页时避免渲染帧，从而节省处理能力和电池续航。在本练习中，我们将实现一个稳健的游戏循环来控制一颗动画化的小行星。\n\
    \n创建一个新文件夹，并复制`drawing.js`库和样式表。复制上一个示例中的模板，将文件另存为`exercise7.html`。重命名页面标题和页眉，并用清单\
    \ [7-1](#A455241_1_En_7_Chapter.xhtml#Par5) 中的代码替换脚本。\n\n```javascript\nvar context\
    \ = document.getElementById(\"asteroids\").getContext(\"2d\");\n// asteroid shape\n\
    var segments = 24;\nvar shape = [];\nfor(var i = 0; i < segments; i++) {\n  shape.push(Math.random()\
    \ - 0.5);\n}\nvar radius = 50;\nvar noise = 0.2;\n// asteroid state\nvar x = context.canvas.width\
    \ * Math.random();\nvar y = context.canvas.height * Math.random();\nvar angle\
    \ = 0;\n// asteroid movement\nvar x_speed = context.canvas.width * (Math.random()\
    \ - 0.5);\nvar y_speed = context.canvas.height * (Math.random() - 0.5);\nvar rotation_speed\
    \ = 2 * Math.PI * (Math.random() - 0.5);\n```\n\n**清单 7-1** 设置一颗小行星\n\n这段代码定义了我们在此动画中使用的全局变量。`context`\
    \ 的访问方式与往常一样。我们定义了用于存储小行星段数的变量，并设置了小行星的形状数据。我们还将半径存储为变量，并定义了小行星的噪声值。从之前绘制小行星的示例来看，这些内容应该都相当不言自明。小行星被赋予了随机的位置，其角度初始化为\
    \ 0（因为其形状本身是随机的）。它还获得了决定其速度的 `x_speed` 和 `y_speed`。`rotation_speed` 变量也是随机化的，指示小行星旋转的速度和方向。这些移动变量都通过\
    \ `Math.random() – 0.5` 随机化为正值或负值。\n\n现在，添加清单 [7-2](#A455241_1_En_7_Chapter.xhtml#Par9)\
    \ 中的 `draw` 函数来渲染场景。\n\n```javascript\nfunction draw(ctx, guide) {\n  if(guide)\
    \ {\n    draw_grid(ctx);\n  }\n  ctx.save();\n  ctx.translate(x, y);\n  ctx.rotate(angle);\n\
    \  draw_asteroid(ctx, radius, shape, {\n    guide: guide,\n    noise: noise\n\
    \  });\n  ctx.restore();\n}\n```\n\n**清单 7-2** 绘制场景的函数\n\n我们引入了一个新的 `guide` 参数，因为我们希望能够为整个场景切换网格、引导线以及其他辅助元素的显示。首先，我们绘制网格，但仅当\
    \ `guide` 参数设置为 `true` 时才绘制。然后，在 `save` 和 `restore` 调用之间，我们准备上下文，并使用存储的参数调用 `draw_asteroid`。小行星的选项被构建为一个新的对象字面量，直接传递给\
    \ `draw_asteroid` 函数。小行星的状态由全局变量决定，这些变量在 `update` 函数中持续变化，从而决定了小行星的行为。\n\n添加清单\
    \ [7-3](#A455241_1_En_7_Chapter.xhtml#Par12) 中的 `update` 函数。\n\n```javascript\n\
    function update(elapsed) {\n  if(x - radius + elapsed * x_speed > context.canvas.width)\
    \ {x = -radius;}\n  if(x + radius + elapsed * x_speed < 0) {x = context.canvas.width\
    \ + radius;}\n  if(y - radius + elapsed * y_speed > context.canvas.height) {y\
    \ = -radius;}\n  if(y + radius + elapsed * y_speed < 0) {y = context.canvas.height\
    \ + radius;}\n  x += elapsed * x_speed;\n  y += elapsed * y_speed;\n  angle =\
    \ (angle + elapsed * rotation_speed) % (2 * Math.PI);\n}\n```\n\n**清单 7-3** 更新小行星变量的函数\n\
    \n我们在这里看到的第一个不同点是，`update` 函数接收一个参数。这表示自上一帧渲染以来经过的时间（以秒为单位）。它允许我们即使在性能和刷新率下降时也能保持一致的游戏速度。我们的\
    \ `x_speed` 和 `y_speed` 变量以像素/秒为单位定义。我们可以通过将这些值乘以经过的时间，来计算每帧移动小行星的精确像素数。`update`\
    \ 函数中的大部分代码确保小行星在画布上正确地环绕。当它完全移出某一边缘时，它会无缝地移动到对侧边缘之外。画布的每个边缘都用 `if` 语句进行检查。如果小行星即将越过边缘，其位置就会被翻转到对侧边缘。最后一行增加\
    \ `angle` 变量。\n\n至此，我们终于可以实现实际的游戏循环了。将清单 [7-4](#A455241_1_En_7_Chapter.xhtml#Par16)\
    \ 中的代码添加到你的脚本中。\n\n```javascript\nvar previous, elapsed;\nfunction frame(timestamp)\
    \ {\n  context.clearRect(0, 0, context.canvas.width, context.canvas.height);\n\
    \  if (!previous) previous = timestamp;\n  elapsed = timestamp - previous;\n \
    \ update(elapsed / 1000);\n  draw(context, true);\n  previous = timestamp;\n \
    \ window.requestAnimationFrame(frame);\n}\nwindow.requestAnimationFrame(frame);\n\
    ```\n\n**清单 7-4** 游戏循环\n\n这里我们引入了更多的全局变量，定义了 `frame` 函数，并调用了一次 `window.requestAnimationFrame`。脚本中的最后一行触发了第一帧，并开始了无限循环。`frame`\
    \ 函数是回调函数，它被传递给 `window.requestAnimationFrame`。其主要任务与上一个练习中一样：调用 `update` 和 `draw`\
    \ 函数。`requestAnimationFrame` API 规定，回调函数将接收一个参数，其中包含精确到至少 1 毫秒的时间戳。我们利用这个时间戳来计算当前帧与上一帧之间的经过时间。为此，我们存储了一个全局变量来保存上一次\
    \ `timestamp` 参数的值。在第一次调用时，上一次的时间戳尚未设置，因此我们将其初始化为当前时间戳，经过时间则为 0（零）。在后续帧中，上一次的时间戳是已知的，`elapsed`\
    \ 时间就是从上一帧被计算和绘制以来实际经过的时间。`frame` 函数中的最后一行是调用 `window.requestAnimationFrame`，并将\
    \ `frame` 函数本身作为参数传递。这个调用是向浏览器发出的请求：“当您准备好时，请运行此函数。”它只是将该函数添加到一个将在页面刷新期间被调用的函数列表中。因此，虽然它看起来像递归，但实际上并不是。`frame`\
    \ 函数并没有直接调用自己。这个调用确保一旦一帧完成，下一帧就会被排队等待渲染。浏览器通常会尝试达到每秒 60 帧，只要对 `update` 和 `draw`\
    \ 的调用不会花费太长时间，这通常是可以实现的。\n\n请仔细研究 `frame` 函数，确保你理解每一行代码。从现在开始，我们将在每个练习以及最终的游戏中都使用该函数的一个版本。你应该会看到类似图\
    \ [7-1](#A455241_1_En_7_Chapter.xhtml#Fig1) 所示的效果。\n\n![A455241_1_En_7_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_7_Fig1_HTML.jpg)\n\
    \n**图 7-1** 漂浮在太空中的动画小行星\n\n这个练习让一颗小行星动了起来。如果我们想在游戏中包含两颗小行星该怎么办？那又该如何做？如果是五颗或十颗小行星呢？"
  raw: 'The window.requestAnimationFrame API allows developers to specifically make
    a request of the browser to draw the next frame of an animation. It benefits from
    many optimizations, such as working at the refresh rate of the system and ensuring
    rendering is synchronized with the browser’s own repaint cycle. It also benefits
    from not rendering frames when the page is minimized or when another browser tab
    is selected. This saves processing power and battery life. In this exercise, we’ll
    implement a robust game loop to control an animated asteroid. Create a new folder
    and copy the drawing.js library and the stylesheet. Copy the template from the
    previous example and save the file as exercise7.html. Rename the page title and
    header and replace the script with the code from Listing [7-1](#A455241_1_En_7_Chapter.xhtml#Par5).
    var context = document.getElementById("asteroids").getContext("2d"); // asteroid
    shape var segments = 24; var shape = []; for(var i = 0; i < segments; i++) {   shape.push(Math.random()
    - 0.5); } var radius = 50; var noise = 0.2; // asteroid state var x = context.canvas.width
    * Math.random(); var y = context.canvas.height * Math.random(); var angle = 0;
    // asteroid movement var x_speed = context.canvas.width * (Math.random() - 0.5);
    var y_speed = context.canvas.height * (Math.random() - 0.5); var rotation_speed
    = 2 * Math.PI * (Math.random() - 0.5); Listing 7-1 Setting Up an Asteroid This
    code defines the global variables we’re using for this animation. The context
    is accessed as usual. We define variables to store the number of segments in the
    asteroid, and we set up the asteroid shape data. We also store the radius as a
    variable and the asteroid noise. All this should be fairly self-explanatory from
    the previous asteroid drawing example. The asteroid is given a randomized position,
    and its angle is initialized to 0 (since its shape is randomized anyway). It’s
    also given an x_speed and a y_speed, which determine its velocity. The rotation_speed
    variable is also randomized, indicating how fast the asteroid should spin and
    in what direction. These movement variables are all randomized to be either positive
    or negative using Math.random() – 0.5. Now add the draw function from Listing
    [7-2](#A455241_1_En_7_Chapter.xhtml#Par9) to render the scene. function draw(ctx,
    guide) {   if(guide) {     draw_grid(ctx);   }   ctx.save();   ctx.translate(x,
    y);   ctx.rotate(angle);   draw_asteroid(ctx, radius, shape, {     guide: guide,
        noise: noise   });   ctx.restore(); } Listing 7-2 A Function to Draw the Scene
    We’re taking a new guide argument because we want to be able to switch the grid
    and guide lines as well as our other guides on and off for the whole scene. First
    we draw the grid, but only if the guide argument is set to true. Then between
    save and restore calls we prepare the context and call draw_asteroid with our
    stored parameters. The asteroid options are constructed as a new object literal
    which is passed directly into the draw_asteroid function. The state of the asteroid
    is determined by the global variables, which are continuously changed in the update
    function. This determines the asteroid’s behavior. Add the update function from
    Listing [7-3](#A455241_1_En_7_Chapter.xhtml#Par12). function update(elapsed) {
      if(x - radius + elapsed * x_speed > context.canvas.width) {x = -radius;}   if(x
    + radius + elapsed * x_speed < 0) {x = context.canvas.width + radius;}   if(y
    - radius + elapsed * y_speed > context.canvas.height) {y = -radius;}   if(y +
    radius + elapsed * y_speed < 0) {y = context.canvas.height + radius;}   x += elapsed
    * x_speed;   y += elapsed * y_speed;   angle = (angle + elapsed * rotation_speed)
    % (2 * Math.PI); } Listing 7-3 A Function to Update the Asteroid Variables The
    first difference we see here is that the update function receives an argument.
    This represents the elapsed time (in seconds) since the last frame was rendered.
    It allows us to maintain consistent game speed even if performance and refresh
    rate fall. Our x_speed and y_speed variables are defined in units of pixels per
    second. We can calculate the exact number of pixels to move our asteroid each
    frame by multiplying these values by the elapsed time. Most of the code in the
    update function ensures that the asteroid wraps correctly around the canvas. When
    it goes completely off one edge, it’s moved seamlessly to just beyond the opposite
    edge. Each edge of the canvas is checked with an if statement. If the asteroid
    is about to pass over the edge, then its position is flipped to the opposite edge.
    The last line increments the angle variable. With this, we can finally implement
    the actual game loop . Add the code from Listing [7-4](#A455241_1_En_7_Chapter.xhtml#Par16)
    to your script. var previous, elapsed; function frame(timestamp) {   context.clearRect(0,
    0, context.canvas.width, context.canvas.height);   if (!previous) previous = timestamp;
      elapsed = timestamp - previous;   update(elapsed / 1000);   draw(context, true);
      previous = timestamp;   window.requestAnimationFrame(frame); } window.requestAnimationFrame(frame);
    Listing 7-4 The Game Loop Here we introduce some more global variables , define
    the frame function, and make a call to window.requestAnimationFrame. The last
    line in the script triggers the first frame and begins the infinite loop. The
    frame function is the callback, which is passed to window.requestAnimationFrame.
    Its main job is just like in the previous exercise: to call the update and draw
    functions. The requestAnimationFrame API specifies that the callback will be passed
    a single argument containing a timestamp accurate to at least 1 ms. We make use
    of this timestamp to calculate the elapsed time between this frame and the previous
    frame. To do that, we store a global variable containing the previous value of
    the timestamp argument. On the first invocation the previous timestamp isn’t set,
    so we initialize it to the given timestamp, and the elapsed time is 0 (zero).
    In subsequent frames the previous timestamp is known, and the elapsed time is
    indeed the time that has elapsed since the previous frame was calculated and drawn.
    The last line in the frame function is a call to window.requestAnimationFrame
    with the frame function itself as an argument. This call is a request to the browser
    to “please run this function when you’re ready to do so.” It simply adds the function
    to a list of functions that will be called during the page refresh. So, although
    it looks like a recursion, it isn’t. The frame function isn’t calling itself directly.
    This call ensures that once a frame has completed, the next frame is queued for
    rendering. The browser will usually try to achieve 60 frames per second, and as
    long as the calls to update and draw don’t take too long to run this will usually
    be achieved. Study the frame function and make sure you understand every line.
    We’ll use a version of this function in every exercise from now on and in the
    final game. You should see something like Figure [7-1](#A455241_1_En_7_Chapter.xhtml#Fig1).
    ![A455241_1_En_7_Fig1_HTML.jpg](OEBPS/Images/A455241_1_En_7_Fig1_HTML.jpg) Figure
    7-1 An animated asteroid floating in space This exercise has animated an asteroid.
    What if we wanted to include two asteroids in our game? How would we do it? What
    about five or ten asteroids?'
  trans: "\n`window.requestAnimationFrame` API 允许开发者专门请求浏览器绘制动画的下一帧。它受益于许多优化，例如按系统刷新率工作，并确保渲染与浏览器自身的重绘周期同步。它还能在页面最小化或选择了其他浏览器标签页时避免渲染帧，从而节省处理能力和电池续航。在本练习中，我们将实现一个稳健的游戏循环来控制一颗动画化的小行星。\n\
    \n创建一个新文件夹，并复制`drawing.js`库和样式表。复制上一个示例中的模板，将文件另存为`exercise7.html`。重命名页面标题和页眉，并用清单\
    \ 7-1 中的代码替换脚本。\n\n```javascript\nvar context = document.getElementById(\"asteroids\"\
    ).getContext(\"2d\");\n// asteroid shape\nvar segments = 24;\nvar shape = [];\n\
    for(var i = 0; i < segments; i++) {\n  shape.push(Math.random() - 0.5);\n}\nvar\
    \ radius = 50;\nvar noise = 0.2;\n// asteroid state\nvar x = context.canvas.width\
    \ * Math.random();\nvar y = context.canvas.height * Math.random();\nvar angle\
    \ = 0;\n// asteroid movement\nvar x_speed = context.canvas.width * (Math.random()\
    \ - 0.5);\nvar y_speed = context.canvas.height * (Math.random() - 0.5);\nvar rotation_speed\
    \ = 2 * Math.PI * (Math.random() - 0.5);\n```\n\n**清单 7-1** 设置一颗小行星\n\n这段代码定义了我们在此动画中使用的全局变量。`context`\
    \ 的访问方式与往常一样。我们定义了用于存储小行星段数的变量，并设置了小行星的形状数据。我们还将半径存储为变量，并定义了小行星的噪声值。从之前绘制小行星的示例来看，这些内容应该都相当不言自明。小行星被赋予了随机的位置，其角度初始化为\
    \ 0（因为其形状本身是随机的）。它还获得了决定其速度的 `x_speed` 和 `y_speed`。`rotation_speed` 变量也是随机化的，指示小行星旋转的速度和方向。这些移动变量都通过\
    \ `Math.random() – 0.5` 随机化为正值或负值。\n\n现在，添加清单 7-2 中的 `draw` 函数来渲染场景。\n\n```javascript\n\
    function draw(ctx, guide) {\n  if(guide) {\n    draw_grid(ctx);\n  }\n  ctx.save();\n\
    \  ctx.translate(x, y);\n  ctx.rotate(angle);\n  draw_asteroid(ctx, radius, shape,\
    \ {\n    guide: guide,\n    noise: noise\n  });\n  ctx.restore();\n}\n```\n\n\
    **清单 7-2** 绘制场景的函数\n\n我们引入了一个新的 `guide` 参数，因为我们希望能够为整个场景切换网格、引导线以及其他辅助元素的显示。首先，我们绘制网格，但仅当\
    \ `guide` 参数设置为 `true` 时才绘制。然后，在 `save` 和 `restore` 调用之间，我们准备上下文，并使用存储的参数调用 `draw_asteroid`。小行星的选项被构建为一个新的对象字面量，直接传递给\
    \ `draw_asteroid` 函数。小行星的状态由全局变量决定，这些变量在 `update` 函数中持续变化，从而决定了小行星的行为。\n\n添加清单\
    \ 7-3 中的 `update` 函数。\n\n```javascript\nfunction update(elapsed) {\n  if(x - radius\
    \ + elapsed * x_speed > context.canvas.width) {x = -radius;}\n  if(x + radius\
    \ + elapsed * x_speed < 0) {x = context.canvas.width + radius;}\n  if(y - radius\
    \ + elapsed * y_speed > context.canvas.height) {y = -radius;}\n  if(y + radius\
    \ + elapsed * y_speed < 0) {y = context.canvas.height + radius;}\n  x += elapsed\
    \ * x_speed;\n  y += elapsed * y_speed;\n  angle = (angle + elapsed * rotation_speed)\
    \ % (2 * Math.PI);\n}\n```\n\n**清单 7-3** 更新小行星变量的函数\n\n我们在这里看到的第一个不同点是，`update`\
    \ 函数接收一个参数。这表示自上一帧渲染以来经过的时间（以秒为单位）。它允许我们即使在性能和刷新率下降时也能保持一致的游戏速度。我们的 `x_speed`\
    \ 和 `y_speed` 变量以像素/秒为单位定义。我们可以通过将这些值乘以经过的时间，来计算每帧移动小行星的精确像素数。`update` 函数中的大部分代码确保小行星在画布上正确地环绕。当它完全移出某一边缘时，它会无缝地移动到对侧边缘之外。画布的每个边缘都用\
    \ `if` 语句进行检查。如果小行星即将越过边缘，其位置就会被翻转到对侧边缘。最后一行增加 `angle` 变量。\n\n至此，我们终于可以实现实际的游戏循环了。将清单\
    \ 7-4 中的代码添加到你的脚本中。\n\n```javascript\nvar previous, elapsed;\nfunction frame(timestamp)\
    \ {\n  context.clearRect(0, 0, context.canvas.width, context.canvas.height);\n\
    \  if (!previous) previous = timestamp;\n  elapsed = timestamp - previous;\n \
    \ update(elapsed / 1000);\n  draw(context, true);\n  previous = timestamp;\n \
    \ window.requestAnimationFrame(frame);\n}\nwindow.requestAnimationFrame(frame);\n\
    ```\n\n**清单 7-4** 游戏循环\n\n这里我们引入了更多的全局变量，定义了 `frame` 函数，并调用了一次 `window.requestAnimationFrame`。脚本中的最后一行触发了第一帧，并开始了无限循环。`frame`\
    \ 函数是回调函数，它被传递给 `window.requestAnimationFrame`。其主要任务与上一个练习中一样：调用 `update` 和 `draw`\
    \ 函数。`requestAnimationFrame` API 规定，回调函数将接收一个参数，其中包含精确到至少 1 毫秒的时间戳。我们利用这个时间戳来计算当前帧与上一帧之间的经过时间。为此，我们存储了一个全局变量来保存上一次\
    \ `timestamp` 参数的值。在第一次调用时，上一次的时间戳尚未设置，因此我们将其初始化为当前时间戳，经过时间则为 0（零）。在后续帧中，上一次的时间戳是已知的，`elapsed`\
    \ 时间就是从上一帧被计算和绘制以来实际经过的时间。`frame` 函数中的最后一行是调用 `window.requestAnimationFrame`，并将\
    \ `frame` 函数本身作为参数传递。这个调用是向浏览器发出的请求：“当您准备好时，请运行此函数。”它只是将该函数添加到一个将在页面刷新期间被调用的函数列表中。因此，虽然它看起来像递归，但实际上并不是。`frame`\
    \ 函数并没有直接调用自己。这个调用确保一旦一帧完成，下一帧就会被排队等待渲染。浏览器通常会尝试达到每秒 60 帧，只要对 `update` 和 `draw`\
    \ 的调用不会花费太长时间，这通常是可以实现的。\n\n请仔细研究 `frame` 函数，确保你理解每一行代码。从现在开始，我们将在每个练习以及最终的游戏中都使用该函数的一个版本。你应该会看到类似图\
    \ 7-1 所示的效果。\n\n![A455241_1_En_7_Fig1_HTML.jpg](img/A455241_1_En_7_Fig1_HTML.jpg)\n\
    \n**图 7-1** 漂浮在太空中的动画小行星\n\n这个练习让一颗小行星动了起来。如果我们想在游戏中包含两颗小行星该怎么办？那又该如何做？如果是五颗或十颗小行星呢？\n"
- fmt: "## Refactoring into Simple Objects\n\nIn the preceding code we keep all the\
    \ data associated with the asteroid in the global scope. The shape, position,\
    \ and velocity of the asteroid are declared as simple variables at the top of\
    \ the script. This doesn't scale well—imagine managing this data for ten asteroids.\
    \ What we need is some structure. We can use objects to represent a game element.\
    \ Objects can store a collection of data related to a given game object. Replace\
    \ the variable declarations between `segments` and `rotation_speed` with the code\
    \ from Listing [7-5](#A455241_1_En_7_Chapter.xhtml#Par24).\n\n```javascript\n\
    var asteroid = {\n    segments: 24,\n    shape: [],\n    radius: 50,\n    noise:\
    \ 0.5,\n    x: context.canvas.width * Math.random(),\n    y: context.canvas.height\
    \ * Math.random(),\n    angle: 0,\n    x_speed: context.canvas.width * (Math.random()\
    \ - 0.5),\n    y_speed: context.canvas.height * (Math.random() - 0.5),\n    rotation_speed:\
    \ 2 * Math.PI * (Math.random() - 0.5)\n};\n```\n\nListing 7-5 An Object Literal\n\
    \nHere we’re defining a single object called `asteroid` and storing our variables\
    \ inside it. JavaScript objects allow related variables to be stored together.\
    \ The syntax is straightforward. We specify comma-separated `key: value` pairs\
    \ between curly braces. Object properties can then be accessed either with dotted\
    \ syntax (`asteroid.radius`) or with square brackets and a string index (`asteroid[\"\
    radius\"]`). We can assign data to object parameters as normal. Randomize the\
    \ `asteroid.shape` array with the code in Listing [7-6](#A455241_1_En_7_Chapter.xhtml#Par27).\n\
    \n```javascript\nfor(var i = 0; i < asteroid.segments; i++) {\n    asteroid.shape.push(Math.random()\
    \ - 0.5);\n}\n```\n\nListing 7-6 Getting in Shape\n\nNow we need to upgrade our\
    \ draw function to use data from the new object. Replace the `draw` function with\
    \ the code in Listing [7-7](#A455241_1_En_7_Chapter.xhtml#Par29).\n\n```javascript\n\
    function draw(ctx, guide) {\n    if(guide) {\n        draw_grid(ctx);\n    }\n\
    \    ctx.save();\n    ctx.translate(asteroid.x, asteroid.y);\n    ctx.rotate(asteroid.angle);\n\
    \    draw_asteroid(ctx, asteroid.radius, asteroid.shape, {\n        noise: asteroid.noise,\n\
    \        guide: guide\n    });\n    ctx.restore();\n}\n```\n\nListing 7-7 Use\
    \ the Object Data\n\nDo the same to the `update` function. Wherever a variable\
    \ has been moved into the `asteroid` object, add the prefix to access the data.\
    \ Refresh the page, and the animation should work as before. If nothing happens,\
    \ check the console for error messages—they should be clear enough to debug your\
    \ code. If you miss a variable, then it will complain of an “uncaught reference\
    \ error” and should tell you which variable and on which line in the code the\
    \ problem was found.\n\n**Note** Most browsers feature built-in developer tools.\
    \ These can usually be accessed by pressing `F12`, but see your browser documentation\
    \ for details. The JavaScript console is an extremely useful tool—it shows error\
    \ messages and allows you to interact directly with your program.\n\nNow type\
    \ the word `asteroid` in the browser console and press Enter. You should see the\
    \ asteroid parameters as they were the moment your command was handled. All the\
    \ asteroid data is held in a single object. This is good. But the object literal\
    \ syntax is pretty unwieldy for our purposes. If there were a neater way to create\
    \ asteroids, we could simplify our code considerably.\n\n## Using Object Constructors\n\
    \nObject constructors are a great way to create multiple similar objects and they’re\
    \ easy to create. Simply define a function and assign data to a special `this`\
    \ keyword when inside the function. Listing [7-8](#A455241_1_En_7_Chapter.xhtml#Par35)\
    \ is a handy object constructor for creating asteroids just like in the previous\
    \ example. Place this in a new library file `objects.js` and add a new `<script>`\
    \ element into the `<head>` element of the page.\n\n```javascript\nfunction Asteroid(segments,\
    \ radius, noise) {\n    this.x = context.canvas.width * Math.random();\n    this.y\
    \ = context.canvas.height * Math.random();\n    this.angle = 0;\n    this.x_speed\
    \ = context.canvas.width * (Math.random() - 0.5);\n    this.y_speed = context.canvas.height\
    \ * (Math.random() - 0.5);\n    this.rotation_speed = 2 * Math.PI * (Math.random()\
    \ - 0.5);\n    this.radius = radius;\n    this.noise = noise;\n    this.shape\
    \ = [];\n    for(let i = 0; i < segments; i++) {\n        this.shape.push(Math.random()\
    \ - 0.5);\n    }\n}\n```\n\nListing 7-8 An Object Constructor\n\nIt’s good practice\
    \ but not obligatory to capitalize object constructors in order to identify them\
    \ in code. In this case we’ve called the constructor `Asteroid`. We’ve assigned\
    \ all the variables to properties of the `this` keyword within the function. Notice\
    \ that we take three arguments: the number of `segments`, `radius`, and `noise`.\
    \ All the other variables are defined randomly, have default values, or are derived\
    \ from the provided arguments. We don’t even store the `segments` argument as\
    \ a property. It is only used to allocate the correct number of items in the `shape`\
    \ property. To use a constructor to create an instance of an object, we must use\
    \ the `new` keyword, like so:\n\n```javascript\nvar asteroid = new Asteroid(24,\
    \ 50, 0.2);\n```\n\nUpdate your code by replacing the object literal with the\
    \ preceding one-liner. Make sure you include the link to the constructor function\
    \ in your page. See your asteroid continue inexorably on its journey though deep\
    \ space. Feel satisfied that your code is now far better organized than it was.\
    \ But so what? Why do we bother with organizing code like this?"
