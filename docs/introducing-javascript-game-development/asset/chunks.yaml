    180); context.lineTo(170, 220); context.stroke(); Listing 1-7 A Stick Figure The
    script starts by setting the stroke color to white and the line width to 2 pixels.
    Then we see two new methods of the context object. The context.beginPath method
    begins a new path or resets the current path. We need to call this because we
    already had an active path left over from when we drew the original rectangle.
    If we don’t call it (try commenting it out), then we continue the original path,
    and a line will be drawn from the rectangle to our first circle. You’ll learn
    more about paths in Chapter [2](#A455241_1_En_2_Chapter.xhtml). The circle is
    drawn using the context.arc method. This method can be used to draw any circle
    or portion of a circle. The method takes five arguments, as follows: the first
    pair of arguments includes the (x, y) coordinates (in pixels) of the center of
    the circle. The third argument is the radius of the circle, and the fourth and
    fifth arguments are the starting angle and finishing angle of the arc (measured
