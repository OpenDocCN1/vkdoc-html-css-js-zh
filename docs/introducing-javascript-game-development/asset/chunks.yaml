    \ `Ctrl+R`），都会选择一个新值，并且画布会更新：\n\n```javascript\ncontext.translate(200, 200);\n\
    draw_ship(context, 150, {curve: Math.random(), guide: true});\n```\n\n我们还添加了一段新的辅助线代码，用于在飞船顶部绘制控制点。我们在控制点的位置绘制一个实心圆点，以帮助展示曲线是如何构建的。此外，我们还绘制了一条线，以显示控制点的潜在范围（介于\
    \ 0 和 1 之间）。请注意，曲线不一定穿过该点，而是朝向它绘制。\n\n你应该能看到类似图 4-7 的效果。\n\n![A455241_1_En_4_Fig7_HTML.jpg](img/A455241_1_En_4_Fig7_HTML.jpg)\n\
    \n**图 4-7** 添加曲线\n\n尝试手动设置 `curve` 的值。低于 0 和高于 1 的值在一定范围内也是有效的。请确保你理解这里发生了什么。如前所述，飞船应尽可能靠近圆的边缘绘制，以便碰撞检测更准确。尽管我们对形状要求不严格，但其位置和大小应尽可能与圆匹配。\n\
    \n我们将为飞船设计添加的最终修饰是将其侧边绘制成二次曲线。实现方法有多种，这里我们将在飞船两侧与后部相对的位置各放置一个控制点。我们将以参数的形式指定其在圆中的位置。该位置（从\
    \ 0 到 1，对应圆心到半径）决定了控制点将放置的地方。数值越大，侧边越向外拉，从而填充圆内更多的空间；数值越小，侧边越向内收。\n\n清单 4-9 展示了最终代码。\n\
    \n```javascript\nfunction draw_ship(ctx, radius, options) {\n  options = options\
    \ || {};\n  let angle = (options.angle || 0.5 * Math.PI) / 2;\n  // Now we have\
    \ two curve arguments\n  let curve1 = options.curve1 || 0.25;\n  let curve2 =\
    \ options.curve2 || 0.75;\n  ctx.save();\n  if(options.guide) {\n    ctx.strokeStyle\
    \ = \"white\";\n    ctx.fillStyle = \"rgba(0, 0, 0, 0.25)\";\n    ctx.lineWidth\
    \ = 0.5;\n    ctx.beginPath();\n    ctx.arc(0, 0, radius, 0, 2 * Math.PI);\n \
    \   ctx.stroke();\n    ctx.fill();\n  }\n  ctx.lineWidth = options.lineWidth ||\
    \ 2;\n  ctx.strokeStyle = options.stroke || \"white\";\n  ctx.fillStyle = options.fill\
    \ || \"black\";\n  ctx.beginPath();\n  ctx.moveTo(radius, 0);\n  // here we have\
    \ the three curves\n  ctx.quadraticCurveTo(\n    Math.cos(angle) * radius * curve2,\n\
    \    Math.sin(angle) * radius * curve2,\n    Math.cos(Math.PI - angle) * radius,\n\
    \    Math.sin(Math.PI - angle) * radius\n  );\n  ctx.quadraticCurveTo(-radius\
    \ * curve1, 0,\n    Math.cos(Math.PI + angle) * radius,\n    Math.sin(Math.PI\
    \ + angle) * radius\n  );\n  ctx.quadraticCurveTo(\n    Math.cos(-angle) * radius\
    \ * curve2,\n    Math.sin(-angle) * radius * curve2,\n    radius, 0\n  );\n  ctx.fill();\n\
    \  ctx.stroke();\n  // the guide drawing code is getting complicated\n  if(options.guide)\
    \ {\n    ctx.strokeStyle = \"white\";\n    ctx.fillStyle = \"white\";\n    ctx.lineWidth\
    \ = 0.5;\n    ctx.beginPath();\n    ctx.moveTo(\n      Math.cos(-angle) * radius,\n\
    \      Math.sin(-angle) * radius\n    );\n    ctx.lineTo(0, 0);\n    ctx.lineTo(\n\
    \      Math.cos(angle) * radius,\n      Math.sin(angle) * radius\n    );\n   \
    \ ctx.moveTo(-radius, 0);\n    ctx.lineTo(0, 0);\n    ctx.stroke();\n    ctx.beginPath();\n\
    \    ctx.arc(\n      Math.cos(angle) * radius * curve2,\n      Math.sin(angle)\
    \ * radius * curve2,\n      radius/40, 0, 2 * Math.PI\n    );\n    ctx.fill();\n\
    \    ctx.beginPath();\n    ctx.arc(\n      Math.cos(-angle) * radius * curve2,\n\
    \      Math.sin(-angle) * radius * curve2,\n      radius/40, 0, 2 * Math.PI\n\
    \    );\n    ctx.fill();\n    ctx.beginPath();\n    ctx.arc(radius * curve1 -\
    \ radius, 0, radius/50, 0, 2 * Math.PI);\n    ctx.fill();\n  }\n  ctx.restore();\n\
    }\n```\n\n**清单 4-9** 曲线飞船\n\n改动实际上非常小——我们只是添加了一些控制点，并使用前面描述的简单三角函数进行计算。大部分新增代码实际上都用于绘制控制点！请专注于主代码中的改动。我们将\
    \ `options.curve` 值改成了 `options.curve1` 和 `options.curve2`。剩下的两次 `context.lineTo`\
    \ 调用已被转换为 `context.quadraticCurveTo` 调用，并指定了控制点。\n\n同样，调用它非常简单：\n\n```javascript\n\
    context.translate(200, 200);\ndraw_ship(context, 150, {\n  curve1: Math.random(),\n\
    \  curve2: Math.random(),\n  guide: true\n});\n```\n\n尝试一下，你应该能得到类似图 4-8 的效果。刷新页面（`Ctrl+R`），每次都应该能看到不同的随机变体。\n\
    \n![A455241_1_En_4_Fig8_HTML.jpg](img/A455241_1_En_4_Fig8_HTML.jpg)\n\n**图 4-8**\
    \ 全曲线飞船\n\n尝试清单 4-10 中的代码，看看我们能用新方法绘制出哪些替代飞船。最终你应该会得到类似图 4-9 的效果。\n\n```javascript\n\
    var context = document.getElementById(\"asteroids\").getContext(\"2d\");\ndraw_grid(context);\n\
    let c1 = 0, c2 = 0;\nfor(c1=0.1; c1<1; c1+=0.2) {\n  for(c2=0.1; c2<1; c2+=0.2)\
    \ {\n    context.save();\n    context.translate(context.canvas.width * c1, context.canvas.height\
    \ * c2)\n    context.rotate(-Math.PI/2);\n    draw_ship(context, context.canvas.width\
    \ / 12, {curve1: c1, curve2: c2, guide : true});\n    context.restore();\n  }\n\
    }\n```\n\n**清单 4-10** 绘制多种变体\n\n![A455241_1_En_4_Fig9_HTML.jpg](img/A455241_1_En_4_Fig9_HTML.jpg)\n\
    \n**图 4-9** 一系列备选飞船\n\n现在我们拥有一个完整、完全可配置的飞船绘制函数，只需导入我们的 `drawing.js` 库即可在游戏中使用。通过定义自己的函数来增加结构，可以使复杂代码更易于理解。\n"
- fmt: '## Summary


    This chapter has developed the ideas from Chapter [3](#A455241_1_En_3_Chapter.xhtml)
    significantly. We’ve drawn a more complicated shape and developed the design from
    a simple triangle into a curvy delight. We’ve learned about translating and rotating
    the canvas. These will be important concepts later on, so you need to be sure
    you understand them pretty well. They allow us to work with our drawing function
    in an extremely flexible way. A crucial observation is that as our drawing function
    becomes more and more complicated, the code with which we call our drawing function
    hardly changes at all. This is how we manage complexity in general, by abstracting
    ideas such as draw a ship into functions and calling the function whenever we
    need to “draw a ship.” Try developing your own `draw_ship` function. Keep the
    guide circle code and try to draw as close to the edges as you can. Does it matter
    if you go over the edges a bit?© Graeme Stuart 2017 Graeme StuartIntroducing JavaScript
    Game Development [https://doi.org/10.1007/978-1-4842-3252-1_5](#A455241_1_En_5_Chapter.xhtml)


    # 5. Drawing an Asteroid


    Graeme Stuart^(1 ) (1) Market Harborough, Leicestershire, UK Asteroids, like ships,
    can be approximated to a circle for the purposes of collision detection. However,
    they should be irregular shapes, and each one should be unique. To achieve this
    we’ll make extensive use of the `Math.random` method to define the shape of our
    asteroids.


    ## Drawing Basic Shapes'
