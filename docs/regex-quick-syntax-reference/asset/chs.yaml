- '# 8. 前瞻与后顾


  像 `^`、`$` 和 `\b` 边界字符这样的锚点，是基于特殊条件过滤匹配结果的零宽断言。这些条件限制了匹配结果中首字符或末字符的位置。我们现在要做类似的事情，但这次，我们将限制表达式中某些字符相对于字符串中其他字符的位置。*前瞻*和*后顾*是两种能够实现这一点的零宽断言。


  为简单起见，本章将仅限于兼容 PCRE 的语言和 Perl 6。




  '
- '# 前瞻断言


  *前瞻断言*会匹配字符，但匹配成功后会将操作回退。前瞻断言分为两种类型：*肯定型*和*否定型*。


  当我们的匹配项**必须紧跟在**某个特定模式之后时，我们使用肯定型前瞻断言。


  当我们的匹配项**不应紧跟**某个特定模式时，我们使用*否定型前瞻断言*。表 8-1 展示了其语法。


  **表 8-1** 前瞻断言语法


  | 前瞻断言类型 | PCRE 语法 | Perl 6 语法 |

  | --- | --- | --- |

  | 肯定型 | `(?=pattern)` | `<?before pattern>` |

  | 否定型 | `(?!pattern)` | `<!before pattern>` |

  | 单词边界 | `\b` | `>>` |


  这些语法可能不太美观，尤其是在否定断言的情况下。不过，依我的经验来看，只要多用用就会习惯的。在此之前，请随身携带你的速查手册。


  与 `(?:pattern)` 类似，前瞻断言不会捕获子字符串。


  由于前瞻断言可以包含任何字面量或元字符，因此在前瞻断言内部定义的捕获组将会捕获匹配到的字符串。事实上，这是捕获前瞻断言值的唯一方法。


  `/a(?=.c)b/` 中的前瞻断言 `(?=.c)` 会按以下方式匹配字符串 `abc`：


  1.  首先读取 `a`。

  2.  然后进入前瞻断言，记下索引 1（指向 `abc` 中的字符 `b`）。

  3.  在前瞻断言内部，我们匹配了任意字符 `b`。

  4.  在前瞻断言内部，我们匹配了字符 `c`。

  5.  由于前瞻断言成功，我们成功退出该结构，并回退到字符串中的位置 1。

  6.  我们匹配字符串中的字符 `b`。

  7.  正则表达式匹配成功，返回从位置 0 开始的子字符串 `ab`。单词边界的作用类似于肯定型前瞻断言。


  **示例 1**：使用 PCRE 方言，在字符串中匹配 `list`、`lost` 或 `lust`，要求匹配的字符串必须结束一个非空白字符序列。


  **解决方案：**


  我们只需在匹配序列的末尾使用一个单词边界锚点即可。


  ```

  /l[iou]st\b/

  ```


  **示例 2**：假设以下锦标赛分类数据以 JavaScript 模板字面量的形式给出：


  ```

  const classification = `

  1st D.Okada (5) 97Pts

  2nd J.Newtown (27) 78Pts

  `;

  ```


  创建一个正则表达式来匹配所有分数。一个分数是文本 `Pt` 前面的一个非负整数。


  **解决方案：**


  `/\d+/` 可以匹配由数字序列组成的正整数。由于我们需要匹配所有分数，因此必须对表达式应用 `g` 修饰符：`/\d+/g`。让我们列出表达式中的所有数字。


  ```

  > let regex = /\d+/g;

  > let result = null;

  > while ( result = regex.exec( classification ) ) {

  console.log( result[0] );

  }

  ```


  现在，我们应用一个前瞻断言来仅匹配分数。前瞻断言语法是 `(?=Pt)`。


  ```

  > regex = /\d+(?=Pt)/g;

  > while ( result = regex.exec( classification ) ) {

  console.log( result[0] );

  }

  ```


  '
- '# 后顾断言


  *后顾断言*是前瞻断言的镜像。它从正则表达式的位置向后移动，检查指定模式是否匹配后顾断言*之前*的字符串。如果后顾断言匹配成功，则回退匹配。其语法如表 8-2
  所示。


  **表 8-2** 后顾断言语法


  | 后顾断言类型 | PCRE 语法 | Perl 6 语法 |

  | --- | --- | --- |

  | 肯定型 | `(?<=pattern)` | `<?after pattern>` |

  | 否定型 | `(?<!pattern)` | `<!after pattern>` |

  | 单词边界 | `\b` | `<<` |


  与前瞻断言不同，后顾断言结构通常受到限制。具体的限制因实现而异。


  大多数方言只允许固定长度的模式，并排除重复修饰符和字符集。但这并非普遍规则，例如，Java 就允许固定范围的重复修饰符。


  **示例 3**：使用 PCRE，在非空白字符序列中匹配 `list`、`lost`、`lust`，要求它们位于非空白字符序列的开头。


  **解决方案：**


  这一次，单词边界锚点被放在匹配字符串的 `l` 之前。


  ```

  PCRE:    /\bl[iou]st/

  ```


  '
- "# 总结\n\n*前瞻断言*会向前查找字符，但在匹配成功后回退所有操作。  \n*后顾断言*会向后查找字符，并在匹配成功后回退所有操作。  \n单词边界锚点可以作为前瞻断言或后顾断言，指示非空白字符序列的开始或结束。\n\
  \n"
- '# 9. 维护正则表达式


  在行业中，编写和维护正则表达式常常令人心生畏惧。这是因为随着表达式变得庞大，阅读难度也随之增加。


  这让我想起了健身房里的一个词 *Fluessigkeitsliebhaberei*，意思是“热爱流体”。就这么一个词，毫无意义。德语单词很长，有时非常长。


  *Rindfleischetikettierungsueberwachungsaufgabenuebertragungsgesetz* 是另一个例子。大多数读者习惯于阅读短单词。然后突然出现这样一个长词，我们所有的速读技巧都派不上用场了。


  软件开发人员习惯于阅读代码。但代码通常包含大量空白字符。下面的 PCRE 表达式就像是一个超长的德语单词：


  ```

  /^(?=.*[A-Z].*[A-Z])(?=.*[!@#$&*])(?=.*[0-9].*[0-9])(?=.*[a-z].*[a-z]).{8,}$/

  ```


  这远不是我见过的最糟糕的正则表达式，但要解读它仍然需要时间。如果我们能给它周围添加一些空白字符呢？


  默认情况下，只有 Perl 6 允许使用空白字符进行格式化。不幸的是，在其他方言中，空白字符是匹配自身的字面量字符。


  不过，也并非无计可施。在本章中，我们将把那些看似无法阅读、杂乱无章的正则表达式转化为可维护的代码。我们将探讨创建可维护正则表达式的可行方案。




  '
- '# 扩展模式


  PCRE 及部分 ERE 语言支持扩展模式。其语法如下：


  ```

  /(?x) 正则       # 注释行 1

  主体       # 注释行 2

  处于       # 注释行 3

  扩展       # 注释行 4

  模式       # 注释行 5

  /

  ```


  在扩展模式下，空白字符不匹配任何内容，仅用于格式化。井号（`#`）表示注释的开始，持续到行尾。


  `(?x)` 应位于正则表达式的开头。你不能在表达式中间才开启扩展模式。实际上，`(?x)` 是一个正则标志或修饰符。在某些方言或正则库中，除了使用 `/a/i`，你也可以使用
  `/(i)a/` 这种结构。将正则修饰符置于前方的优势在于可读性。当表达式较长时，阅读者更希望在阅读表达式本身之前先了解其修饰符。


  我强烈推荐开启扩展模式。回顾以下表达式：


  ```

  /^(?=.*[A-Z].*[A-Z])(?=.*[!@#$&*])(?=.*[0-9].*[0-9])(?=.*[a-z].*[a-z]).{8,}$/

  ```


  以下是同一表达式的扩展模式等效形式：


  ```

  /(?x)

  ^                  # 起始锚点

  (?=.*[A-Z].*[A-Z]) # 至少两个大写字母

  (?=.*[!@#$&*])     # 且至少一个特殊字符

  (?=.*[0-9].*[0-9]) # 且至少两个数字

  (?=.*[a-z].*[a-z]) # 且至少两个小写字母

  .{8,}              # 字符串长度至少为 8 个字符

  $                  # 结束锚点

  /

  ```


  信不信由你，这与前面的单行表达式是相同的。


  遗憾的是，并非所有方言都支持扩展模式。例如，在 EMACS 和 VIM 中就没有。在 JavaScript 中也不支持扩展模式，但你可以使用 XRegExp 库^((53))
  来开启扩展模式。


  ```

  const regex = new XRegExp( ''                                   \

  ^                   # 起始锚点                             \

  (?=.*[A-Z].*[A-Z])  # 至少两个大写字母                     \

  (?=.*[!@#$&*])      # 且至少一个特殊字符                    \

  (?=.*\\d.*\\d)      # 且至少两个数字                       \

  (?=.*[a-z].*[a-z])  # 且至少两个小写字母                    \

  .{8,}               # 字符串长度至少为 8 个字符             \

  $                   # 结束锚点                             \

  '');

  ```


  使用 `XRegExp` 构造函数时，不要忘记转义反斜杠。为了说明这一点，我使用了 `\\d` 而不是 `[0-9]`。


  即使没有扩展模式，如果你能跳出常规思维，也可以让你的代码更易于维护。例如，使用 JavaScript 的 `RegExp` 构造函数并结合 JavaScript
  语法，你可以编写出易于阅读的代码。


  ```

  const regex = new RegExp(

  ''^''                  + // 起始锚点

  ''(?=.*[A-Z].*[A-Z])'' + // 至少两个大写字母

  ''(?=.*[!@#$&*])''     + // 且至少一个特殊字符

  ''(?=.*\\d.*\\d)''     + // 且至少两个数字

  ''(?=.*[a-z].*[a-z])''   + // 且至少两个小写字母

  ''.{8,}''               + // 字符串长度至少为 8 个字符

  ''$''                    // 结束锚点

  );

  ```


  '
- '# 正则子程序


  少数正则方言提供了子程序。子程序类似于编程语言中的函数。如果你不将整个表达式写成一个整体，而是将表达式的某些部分抽象为子程序，那么你的正则表达式将更具可读性。你的表达式也会更加
  DRY（不要重复自己）。毕竟，在同一个表达式中复制粘贴同一个子程序三四次，并不易于维护。


  子程序在表达式中的任何位置被调用时都会执行。如果子程序匹配成功，则正则表达式的执行继续正常进行。如果子程序匹配失败，则会发生回溯。


  ## PCRE 子程序


  在 PCRE 的情况下，请查阅你的正则宿主语言的文档。并非所有 PCRE 语言都支持子程序。例如，在 JavaScript 中，我建议使用 XRegExp 库来增强正则表达式的表达能力。


  ```

  var time = XRegExp.build(''(?x)^ {{hours}} ({{minutes}}) $'', {

  hours: XRegExp.build(''{{h12}} : | {{h24}}'', {

  h12: /1[0-2]|0?[1-9]/,

  h24: /2[0-3]|[01][0-9]/

  }, ''x''),

  minutes: /^[0-5][0-9]$/

  });

  ```


  `{{hours}}`、`{{minutes}}`、`{{h12}}` 和 `{{h24}}` 这些占位符会在各自的位置插入子表达式。


  XRegExp 的子程序看起来有点复杂。通用的 PCRE 子程序语法则相对易读一些。


  ```

  (?(DEFINE)

  (?

  # 子程序 1 的主体

  )

  (?

  # 子程序 2 的主体

  )

  )

  ```


  表达式中的 `DEFINE` 部分从不匹配任何内容。它用于声明你的子程序。


  在表达式中使用 `(?&SUBROUTINE1)` 来匹配它。


  让我们看一个示例，匹配一个货币符号和一个可能包含整数部分和小数部分的价格。我们假设小数部分最多可以有两位数字。


  ```

  /(?x) (?&货币) (?&价格)

  (?(DEFINE)

  (? [\$\€] )

  (?    \d++ \.?+ \d{0,2} )

  )

  /

  ```


  ## Perl 6 子程序


  Perl 6 的子程序语法比 PCRE 语法更简洁，但其工作方式与 PCRE 版本大致相同。


  你可以通过以下方式声明 Perl 6 子程序：


  ```

  /

  :my regex 子程序 1 {

  # 子程序 1 的主体

  }

  :my regex 子程序 2 {

  # 子程序 2 的主体

  }

  /

  ```


  你可以在 Perl 6 表达式中使用 `<子程序 1>` 来调用子程序。


  让我们重写你在"PCRE 子程序"部分看到的同一个货币示例。


  ```

  /(?x) (?&货币) (?&价格)

  (?(DEFINE)

  (?  [\$\€] )

  (?     \d++ \.?+ \d**0..2 )

  )

  /

  ```


  ## 扩展模式、子程序和抽象化


  *抽象化* 是指识别可重用代码并将其提取到一处。我们可以创建子程序来抽象正则表达式中重复的功能片段，并且可以根据需要多次重用它们。子程序对于编写可维护的 DRY
  正则表达式至关重要。


  借助扩展模式的优势，你就能告别冗长且难以维护的正则谜题。你甚至可以清晰无比地编写长达数千字符的正则表达式。想象一下，在阅读本书之前，你可能会连一个 20 字符的表达式都读起来费劲。


  '
- '# 命名捕获组


  在 PCRE 中，我们使用 `\1`、`\2` 等来提取捕获组的值。捕获组的编号基于其左括号从左到右出现的顺序。


  现在我们正竭尽全力使正则表达式易于维护。试想一下，如果有人决定在正则表达式中添加一对括号，会发生什么？你是否遇到过这种情况？如果是，你就知道这有多不方便了。一个更改可能会影响表达式中所有捕获组的引用。这违背了可维护性的原则，因为表达式内部括号的位置与处理捕获组值的正则表达式周边代码之间存在*紧耦合*。


  本节的首要目标是固定捕获组的名称。次要目标是让这些名称具有语义含义。


  如果你的方言支持命名捕获，请使用它们以提高可维护性。


  ## EMACS 命名捕获组


  EMACS 使得固定捕获组的编号成为可能：`\(?1: .* \)`。这个名称没有语义，因为我们仍然必须依赖数字。




  ### PCRE 命名捕获组


  在 PCRE 中，我们可以为捕获组使用专有名称：`(?<VARIABLE_NAME> .* )`。在支持命名捕获组的语言中，可以在正则表达式周围的代码中使用这些名称来提取这些捕获组。


  例如，在 Python 中，我们已经学到 `match.group( 1 )` 会返回第一个捕获组的值。除了数字，我们也可以传递命名捕获组的名称。`match.group(
  ''VARIABLE_NAME'' )` 会提取名称为 `VARIABLE_NAME` 的捕获组。


  在 JavaScript 中，ES2018 引入了命名捕获组。让我们来解决在捕获组章节中看到的例子，它匹配了标签的价格和货币符号。这次，我们的解决方案将是可维护的，因为我们将使用命名捕获组。


  **练习 1**：假设我们想要从以下格式的字符串中提取货币符号、数字价格以及带有货币符号的完整价格：


  ```

  Price: €19.00

  ```


  匹配此字符串的正则表达式如下：


  ```

  /^Price: [€\$]\d\d\.\d\d$/

  ```


  我们必须对美元符号进行转义，因为 `$` 是一个元字符，表示字符串结尾或行尾锚点。我们还必须对点号进行转义，因为它是一个元字符，表示任意一个字符。


  在添加一些括号来捕获我们想要的值之后，正则表达式如下：


  ```

  /^Price: (([€\$])(\d\d\.\d\d))$/

  ```


  我们有三组捕获组来访问数据，如表 9-1 所示。


  | 捕获组编号 | 数据 |

  | --- | --- |

  | 1 | 完整价格 |

  | 2 | 货币符号 |

  | 3 | 数字价格 |


  从可维护性的角度来看，使用索引 `1`、`2` 和 `3` 来引用这些捕获组并不是一个好主意。


  例如，想象一下，需求发生了变化，`Price` 可能是多语言的，你必须以出现的语言捕获价格文本。


  ```

  /^(Price|Preis): (([€\$])(\d\d\.\d\d))$/

  ```


  瞧。捕获组 `1`、`2` 和 `3` 分别变成了 `2`、`3` 和 `4`。你必须重写所有处理这些值的代码。


  这就是为什么对编号捕获组感到厌倦是一种健康的感觉。让我们使用捕获组来提高代码的可维护性。我们的捕获组将如表 9-2 所示。


  | 捕获组编号 | 数据 |

  | --- | --- |

  | `<fullPrice>` | 完整价格 |

  | `<currency>` | 货币符号 |

  | `<numPrice>` | 数字价格 |


  我们将使用语法 `(?<name>content)` 来匹配捕获组名称中的 `content`。


  ```

  /^Price: (?(?[€\$])(?\d\d\.\d\d))$/

  ```


  要创建一个命名捕获组，我们只需在左括号后写一个问号，然后将捕获组名称放在尖括号中。


  这样就完成了。让我们执行这个解决方案。


  ```

  console.table(

  /^Price: (?(?[€\$])(?\d\d\.\d\d))$/

  .exec(''Price: $15.99'')

  .groups

  )

  > (index)   Value

  currency  "$"

  numPrice  "15.99"

  fullPrice "$15.99"

  ```


  尽管你仍然可以用数字索引 `1`、`2` 和 `3` 来引用捕获组，但如果你访问 `groups` 属性，也可以使用它们的标签名称。


  最后但同样重要的是，可以使用格式 `\k<groupName>` 对捕获组名称进行反向引用。


  命名捕获组使你的表达式更具可维护性。这就是它们的目的。


  ### Perl 6 命名捕获组


  语法是 `$<VARIABLE_NAME>=( .* )`。你可以在代码中使用 `$<VARIABLE_NAME>` 来检索其值。


  ## 案例研究：用于 JavaScript 的 XRegExp 库


  XRegExp 是一个强大的库，它使 JavaScript 正则表达式更具表现力和可维护性。如果你经常需要使用正则表达式（这里没有双关语），那么我强烈建议在你的应用程序中包含
  XRegExp。


  你可以在 `xregexp.com` 上阅读该库的文档，并从 GitHub 克隆它。^(⁵⁴) 你也可以使用命令 `npm i xregexp` 从 `npm`
  安装 XRegExp。


  让我们选择后者，在一个空文件夹中使用 `npm` 在本地安装 XRegExp。


  现在安装完成，我们可以打开文本编辑器（我使用的是 `atom.io`），在根目录下创建一个空的 `.js` 文件，并引入 XRegExp 库。


  ```

  let XRegExp = require(''xregexp'');

  ```


  让我们通过创建一个简单的表达式来测试该库。


  ```

  let regex = XRegExp(''(?i)^[ab]*$'');

  XRegExp.exec( ''aAbB'', regex );

  ```


  在这个例子中，你可以看到一个 XRegExp 特性：前导修饰符。这个特性使修饰符更容易阅读，因为你无需滚动到正则表达式的末尾来识别修饰符标志。


  执行程序时，你可以看到大写字母和小写字母都被匹配到了。


  让我们继续讨论可维护性。创建可维护正则表达式的一个必要条件是能够在表达式周围添加一些空格。我们可以使用 `x` 标志关闭对空白字符的求值。这意味着我们可以以任意方式格式化表达式的标记，而不改变其含义。如你所见，起始锚点、主循环和结束锚点现在位于不同的行中，执行后，该模式仍然正确地匹配了字符串。


  ```

  let XRegExp = require(''xregexp'');

  let regex = XRegExp(`(?ix)

  ^

  [ab]*

  $

  `);

  let result = XRegExp.exec( ''aAbB'', regex );

  console.log( result );

  ```


  我们已经关闭了空白字符，但我们还可以做更多。我们可以插入一些注释，使表达式更具语义。想想看。有些表达式很长，为什么不逐个标记地解释它们呢？


  ```

  let XRegExp = require(''xregexp'');

  let regex = XRegExp(`(?ix)

  ^      # 起始锚点

  [ab]*  # 任意数量的 a, b, A, B 字符

  $      # 结束锚点

  `);

  let result = XRegExp.exec( ''aAbB'', regex );

  console.log( result );

  ```


  添加注释后，解决方案仍然有效。


  既然我们已经了解了扩展格式，让我们通过添加一些子模式来进一步提高表达式的可维护性。


  要添加子模式，我们必须使用 XRegExp 的 `build` 方法，并指定一个对象，其中子模式名称作为键，要插入的值作为值。


  ```

  let XRegExp = require(''xregexp'');

  let regex = XRegExp.build(`(?ix)

  ^             # 起始锚点

  {{charLoop}}  # 任意数量的 a, b, A, B 字符

  $             # 结束锚点

  `, {

  charLoop: /[ab]*/

  } );

  console.log( XRegExp.exec( ''abAB'', regex ) );

  ```


  你可以看到正则表达式构建正确。


  实际上，如果你使用正则表达式的 `source` 属性，你可以看到组装好的正则表达式。


  ```

  console.log( regex.source() )

  ```


  这些子模式类似于子程序，在创建较大的正则表达式时通常非常有用。


  这是对 XRegExp 库的简短介绍。你已经看到了如何增强正则表达式的可维护性，此外还有更多可用特性。有趣的是，ES2018 的许多更新都基于 XRegExp
  中已有的特性，因此从这种意义上说，XRegExp 是一个创新者。Unicode 转义、`dotall` 标志和命名捕获组在 XRegExp 库中都已可用，这也是我们在本章中使用它们的原因之一。




  '
- '# 总结


  本章的内容锦上添花。你应该为自己感到自豪，因为现在你不仅理解正则表达式，还能编写可维护的表达式。凭借这些技能，在正则表达式的使用上，你已经跻身顶尖 1% 的软件开发者之列。


  你已经学习了以下能够提高代码可维护性的技巧：


  -   使用扩展模式来添加空白和注释

  -   使用子程序在代码中创建具名抽象结构

  -   使用具名捕获组让捕获组的提取更具可维护性


  在下一章中，你将学习如何优化你的正则表达式。


  '
- '# 10. 优化正则表达式


  你已经学会了所有优化正则表达式执行的工具；因此，本章将作为你目前所学知识的总结。


  你了解到正则表达式的执行可以通过两种类型的自动机来建模：确定性和非确定性的有限状态自动机。


  非确定性自动机的执行时间可以按其步骤数进行指数级衡量。这种复杂性源于回溯的需要。


  从非确定性自动机创建确定性有限状态自动机也具有指数级复杂度。


  在大多数执行环境中，正则表达式虚拟机遵循非确定性模型。这是因为匹配成功可能比匹配失败快得多。我们可能只需 `n` 步就能匹配输入，其中 `n` 是输入的大小。如果我们让执行变成确定性的，状态空间可能会爆炸，最终可能导致
  `O(2^n)` 的复杂度。


  使用非确定性模型会带来一些后果。在优化正则表达式时，我们将利用这些后果。


  ## 优化技术总结


  由于复杂性源于回溯，优化技术的预期目标就是尽量减少回溯。我们将考虑几种实现方法：


  -   使字符类更具体

  -   重复字符类循环

  -   使用占有量词修饰符

  -   使用原子组

  -   重构以实现优化


  某些编译器会对你的正则表达式执行自动优化。一般的规则是，大多数情况下需要你自己来处理。


  ## 使字符类更具体


  我们的敌人是 `.*` 模式，因为在最坏的情况下，你可能最终需要回溯的次数等同于输入的长度。


  例如，假设你想要捕获微模板标签 `${` 和 `}` 之间的标识符名称。在这个例子中，我们假设要查找形式为 `${ id }` 的模式，其中 `id` 不能包含空白字符。以下扩展的
  PCRE 表达式可以做到这一点：


  ```

  /(?x)

  \$\{  # 匹配开始标签 ${

  \s*   # 贪婪地匹配所有空白

  (.+?) # 最小匹配我们的标识符

  \s*   # 贪婪地匹配所有剩余的空白

  \}    # 匹配结束标签

  /

  ```


  注意扩展模式 `(?x)`。记住，以 `(?x)` 开头的正则表达式会使空白字符不匹配自身，并允许你在表达式中放置注释，注释以 `#` 字符开头，直到遇到换行符。


  由于我们要查找标识符字符，我们可以确定这些字符既不是空白字符，也不是右花括号。因此，在这里使用任意字符类是一种奢侈的做法。我们可以通过将 `.+?` 更改为更具体的字符类
  `[^\s\}]` 来使表达式更具确定性。


  ```

  /(?x)

  \$\{        # 匹配开始标签 ${

  \s*         # 贪婪地匹配所有空白

  ([^\s\}]+)  # 贪婪匹配我们的标识符

  \s*         # 贪婪地匹配所有剩余的空白

  \}          # 匹配结束标签

  /

  ```


  注意，现在我们可以使用贪婪量词修饰符了，因为使用贪婪还是懒惰已经无关紧要。事实上，最佳选择是直接使用占有量词修饰符，但我们也先别太急于求成。


  ### 提示


  使用分支结构或字符类时，分支结构中所有可能的选择都不能以紧随其后的字符作为开头。


  避免使用 `[xy]*x`。请更好地理解需求，因为几乎总是有更简单的解决方案：`/[xy]*x/` 会匹配输入中只包含 `x` 和 `y` 字符且以 `x` 结尾的子串。如果我们只是检查是否存在这样的模式，检查
  `/y*x/` 就足够了。


  如果我们的任务是验证 `/^[xy]*x$/`，请使用 `/^(y*+x)*+$/`。我们以占有方式匹配任意数量的 `y` 字符，后跟一个 `x`。我们尽可能多地查找这种模式。由于我们到处都使用了占有匹配，这个表达式中完全没有回溯。为了能够使用占有量词循环，我们必须通过将
  `x` 从字符集 `[xy]` 中分离出来，从而消除该字符集。


  ## 重复字符类循环


  避免重复相同的字符类循环，无论你使用的是贪婪版本还是懒惰版本。


  ```

  /(?x)

  \$\{   # 匹配开始标签 ${

  \s*    # 贪婪地匹配所有空白

  (.+?)  # 最小匹配我们的标识符

  \s*    # 贪婪地匹配所有剩余的空白

  \}     # 匹配结束标签

  /

  ```


  在这里，`(\s*)(.+?)(\s*)` 是麻烦的根源。如果由于任何原因，我们在输入字符串中找不到 `}` 字符，正则表达式将陷入回溯地狱，它会尝试每一种可能的组合，将空白字符序列分配到某个
  `\s*` 模式或 `.+?` 模式中。


  你已经见过一个消除这种回溯地狱的可行解决方案。


  ```

  /(?x)

  \$\{        # 匹配开始标签 ${

  \s*         # 贪婪地匹配所有空白

  ([^\s\}]+)  # 贪婪匹配我们的标识符

  \s*         # 贪婪地匹配所有剩余的空白

  \}          # 匹配结束标签

  /

  ```


  通过使中间的字符类与其他两个字符类不同，我们不会允许正则表达式虚拟机进行无谓的“堂吉诃德风车大战”，去试图确定我们的空白字符应该属于哪里。


  为了完全消除所有回溯，我们可以使用下一种技巧。


  ## 尽可能使用占有量词修饰符


  占有量词修饰符根据定义从不回溯；它们直接匹配失败。作为消除回溯的代价，我们通过根本不探索回溯分支来限制状态空间。


  ```

  /(?x)

  \$\{        # 匹配开始标签 ${

  \s*+        # 贪婪地匹配所有空白（占有）

  ([^\s\}]+)  # 贪婪匹配我们的标识符

  \s*+        # 贪婪地匹配所有剩余的空白（占有）

  \}          # 匹配结束标签

  /

  ```


  这里，正则表达式引擎甚至不会尝试对 `\s*+` 模式进行回溯。这是因为我们作为人类知道，如果不存在 `}`，那么如何匹配空白字符都无关紧要。因此，我们可以简单地加速匹配失败的过程。


  记住发现添加占有量词修饰符机会的规则：


  -   如果紧跟占有量词循环之后的字符，与该循环内部模式的第一个字符互斥，那么你可以考虑使用占有量词循环。




  '
- '# 使用原子组


  不仅循环会低效回溯，多选结构也会。我们可能已经匹配了某个多选分支中的一个节点，结果发现稍后又要检查同一字符，尝试匹配同一多选结构的其他分支。


  我可以用个人生活中的一个简单例子来说明原子组。我这个人经常丢三落四。有时我在家里找东西。比如，假设我正在找手机。我会查看`桌子`、我的`口袋`，还有`厨房`。


  一旦找到手机，我会检查是否有预约。我周二有预约。如果日期不匹配，我就不再需要手机了。


  以下正则表达式首先匹配我找手机，然后检查日期：


  ```

  /(?>table|pocket|kitchen) --> Tuesday/

  ```


  假设在`Wednesday`我在口袋里找到了手机，然后发现今天是`Thursday`，所以我必须回溯。于是我回头再去`kitchen`找手机。这完全没道理！一旦我找到了手机，停止寻找手机才是合理的。这正是原子组要解决的问题。


  例如，假设你想要精确匹配`list`、`lost`或`lust`。在 PCRE 中：


  ```

  /^(list|lost|lust)$/

  ```


  假设我们尝试匹配文本`lists`。我们从多选结构的第一个分支开始，完全匹配了`list`。由于我们本应解析完序列但还剩下一个`s`字符，于是我们回溯。现在我们回到了起点，字符串是`lists`，我们尝试用`lost`来匹配它。消耗了`l`字符后，我们不得不回溯。在第三个分支中，同样的情况发生了：我们匹配了`l`字符，结果发现需要的不是`u`而是`i`。


  这一次，我们侥幸避免了不必要的回溯成本。但想象一下，如果回溯操作是嵌套的呢？如果在`l`字符的位置有一个复杂的子表达式会怎样？我们可能会浪费大量资源。


  这就是为什么用占有式的方式来处理这个多选结构是完全合理的。PCRE 和 Perl 6 都支持创建原子组，也称为占有式分组。在占有式分组中，如果任何一个分支匹配成功，执行过程不会回溯去尝试另一个分支。如果我们试图回溯到占有式分组中，表达式会自动匹配失败。一旦你离开了一个占有式分组，就不能再回溯进去。


  ```

  PCRE:    /(?> a|b)/

  Perl 6:  / [ a|b ]: /

  ```


  注意在 Perl 6 中，冒号在循环和多选结构中是一致的。从这个意义上说，Perl 6 似乎比 PCRE 更简洁。在大多数编程语言中，我们仍然要处理 PCRE
  语法，所以如果你想使用占有式分组，就必须习惯 PCRE 的语法。


  如果你曾经写过 Prolog 程序，那么占有式分组就像截断（`!`）操作。它从定理证明树中裁剪执行分支。


  - 当“或”结构中的所有备选项互斥时，请使用占有式分组。


  让我们完成上一个例子的执行。我们尝试用正则表达式匹配`lists`。


  ```

  /^(?> list|lost|lust)$/

  ```


  我们在第一个分支并匹配了`list`。我们离开了占有式多选结构。还剩一个`s`字符，而由于我们本应位于字符串末尾，所以我们回溯。由于我们不能回溯到占有式分组中，这个正则表达式无法匹配`lists`。问题解决了。


  '
- '# 重构优化


  我们在首次介绍`list`、`lost`、`lust`示例时，就已经见识过这种优化技巧的实际应用。我们可以提取出表达式开头和结尾的公共字符。这个正则表达式


  ```

  /^(list|lost|lust)$/

  ```


  变成了下面这样：


  ```

  /^l(i|o|u)st$/

  ```


  匹配也变得更加高效，因为回溯之后，我们不必一次又一次地匹配同一个字符。


  一旦你的多选结构每个分支都只有一个字符，你就可以使用字符集来提高效率。


  ```

  /^l[iou]st$/

  ```


  '
- '# 优化技术限制非确定性执行


  优化技术归根结底就是削减执行树中的执行路径。你可以优化一个表达式，直到它变成确定性的。


  创造正则表达式确定性执行计划的必要条件是：


  - 提取多选结构中的所有前缀

  - 让你的所有循环和多选结构变为占有式


  '
- '# 总结


  学会了如何编写可维护的正则表达式之后，接下来的任务是编写高效的正则表达式。我介绍了以下优化技巧：


  - 让字符类更具体

  - 重复字符类循环

  - 使用占有式重复修饰符

  - 使用原子组

  - 重构以优化


  所有这些优化技巧都旨在让你正则表达式的执行更加具有确定性。


  '
- '# 11. 使用正则表达式解析 HTML 代码和 URL 查询字符串


  在本章中，我们将使用 JavaScript 解析 HTML 文档并处理 URL 的查询字符串。


  ## 解析 HTML 标签


  **练习 1**：假设给定了一个 HTML 文档。使用正则表达式提取所有`<td>`标签，并将其内容打印到控制台。你可以假设`<td>`标签内包含任何内容（包括换行符）。`<td>`标签可能含有属性。


  **示例输入：**


  ```javascript

  const table = `


  text 1

  text 2


  text trés


  text 4 first line

  text 4 second line


  `;

  ```


  **解决方案：**


  在处理多行正则表达式时，值得使用新的 ES2018 `s`（`dotall`）标志，将整个文本视为单行。由于需要匹配多个表格单元格，我们肯定需要使用 `g` 标志将正则表达式声明为全局匹配。


  ```javascript

  /.*/gs.exec( table )

  ```


  我们还添加想要匹配的开始和结束标签。注意，匹配表格单元格元素有四种不同的选择：`<td>`、`<Td>`、`<tD>` 和 `<TD>`。通过使用 `i` 标志将正则表达式声明为不区分大小写，我们可以用一个表达式匹配所有情况，无需任何多选结构或字符集。当匹配结束标签
  `</td>` 时，请确保转义斜杠。


  ```javascript

  /.*/gis.exec( table )

  ```


  执行此表达式后，你会发现三个表格单元格被作为一个结果返回了。造成这个错误的原因有几个。


  - 首先，`.*` 是贪婪的，它会匹配所有字符，包括其他 `</td>` 标志和 `<td>` 标志。只有在逐字符回溯并解除最后一个 `</td>` 标签的字符循环后，匹配到的字符串才会减少。

  - 其次，`<td class="first">` 不会被这个正则表达式匹配，因为根据我们的表达式，在 `<td>` 标签的 `d` 之后必须紧跟一个大于号。


  我们可以轻松解决这两个问题。


  对于第一个问题，我们可以通过在其后添加一个 `?` 来让贪婪的 `.*` 循环变为懒惰模式。这种机制会尝试进行最小匹配。另一种解决方案是将 `.` 改为 `[^<]`，但这种方案意味着我们不能在
  `<td>` 内部嵌套标签，所以这并非一个好主意。


  第二个问题可以通过匹配 `td` 和 `>` 之间的所有字符来解决。在这种情况下，我们知道要匹配的字符与 `>` 不同。因此，我们在 `[^>]*` 循环中匹配任意数量的非大于号字符。


  ```javascript

  /]*>.*?/gis.exec( table )

  ```


  我们还需要一个更改：我们必须捕获标签的内容，以便访问并将其打印到控制台。


  ```javascript

  let regex = /]*>(.*?)/gis

  let contents = '''';

  while ( contents = regex.exec( table ) ) {

  console.log( contents[1] );

  }

  ```


  注意，最后一个表格单元格的内容被捕获为`undefined`。




  '
- "# 处理 URL 的查询字符串\n\n**练习 2**：创建一个正则表达式，将 URL 的查询字符串转换为一个键值对对象，使得如下形式：\n\n```\n?key1=value1&key2=value2&...&keyN=valueN\n\
  ```\n\n变成：\n\n```\n{\nkey1: 'value1',\nkey2: 'value2',\n...\nkeyN: 'valueN'\n}\n\
  ```\n\n你可以假设文本以问号开头。键的长度均为正数。值的长度可为非负数。等号始终存在。\n\n**解决方案：**\n\n首先，我们需要读取一个问号或一个与号，后跟任意长度的、非等号字符列表。我们需要捕获与号之后的字符。\n\
  \n```\n/?&+/g\n```\n\n接着匹配一个等号，后跟任意数量的非与号字符。我们需要捕获这些字符。\n\n```\n/?&+=([^&]*)/g\n\
  ```\n\n每个键最终位于捕获组 1 中，每个值最终位于捕获组 2 中。由于表达式是全局的，我们将逐一匹配键值对。\n\n现在，我们将使用 JavaScript\
  \ 创建结果对象。\n\n```javascript\nlet queryParameters = {};\nlet queryString = '?key1=value1&key2=value2&key3=&key4=value4';\n\
  let regex = /?&+=([^&]*)/g;\nlet result = null;\nwhile ( result = regex.exec( queryString\
  \ ) ) {\n    queryParameters[ result[1] ] = result[2];\n}\nconsole.log( queryParameters\
  \ );\n```\n\n"
