- '# 构建表达式


  正则表达式写在起始斜杠和结束斜杠字符之间：`/re/`。


  如你在第 1 章所见，此表达式匹配包含 `re` 的字符串。


  某些编程语言允许或要求你使用不同的表示法。例如，在 JavaScript 中，你可以使用以下形式定义正则表达式 `/re/`：


  ```

  > const regex = new RegExp( ''re'' );

  > regex

  /re/

  ```


  在 PHP 和 Python 中，你必须使用字符串或原始字符串将正则表达式传递给函数。以下是一个 Python 示例：


  ```

  import re

  regex = re.compile(r"xy+")

  ```


  除非要处理特定语言中的特定示例，否则本书将坚持使用 `/re/` 表示法。


  ## 字面字符与元字符


  正则表达式中的*字面字符*匹配自身。表达式 `/a/` 匹配任何包含字符 `a` 的字符串。


  例如，表达式 `/a/` 匹配字符串 `"andrea"`，因为该字符串的第一个和最后一个字母都是 `a`。匹配通常伴随执行过程中的简化。在执行时，正则引擎只定位字符串的第一个字符，即
  `a`。由于该字符与表达式匹配，匹配完成；无需读取字符串的其余部分。


  表达式 `/a/` 不匹配字符串 `"ABCDEA"`，因为在读取整个字符串后，我们没有找到任何小写字符 `a`。


  所有大小写字母字符和所有数字字符都可用作字面字符。根据正则表达式方言的不同，某些其他字符也可用于匹配自身。例如，`!`、`%`、`=` 和 `_` 在大多数方言中都可作为字面字符使用。


  `.`, `*`, `^`, `$`, `[` 和 `]` 等字符在几乎所有方言中都不是字面字符。它们是*元字符*。元字符负责表示一种操作，类似于编程语言中的关键字。表
  2-1 描述了元字符。


  表 2-1


  元字符


  | 元字符 | 语义 |

  | --- | --- |

  | `.` | 任意字符 |

  | `*` | 重复：匹配任意次数 |

  | `^` | 两种语义：(1) 否定，(2) 锚点，匹配字符串或行的开头 |

  | `$` | 锚点，匹配字符串或行的结尾 |

  | `[]` | 字符集 |


  在编程语言系列 PCRE 中，保留了更多字符，如表 2-2 所示。


  表 2-2


  PCRE 元字符


  | PCRE 元字符 | 语义 |

  | --- | --- |

  | `&#124;` | 可选执行（或） |

  | `?` | 表达式中的可选部分 |

  | `+` | 至少匹配一次 |

  | `{}` | 指定表达式必须匹配字符串次数的范围 |

  | `()` | 分组字符 (1) 或提取子串 (2) |


  在 VIM 和 EMACS 中，你必须对字符 `|`、`?`、`{`、`}`、`(` 和 `)` 进行转义，才能将它们用作运算符。


  如果你想使用任何保留字符，必须使用反斜杠对其进行转义。


  空白字符的处理较为复杂。在自由文本中搜索模式时，输入你想要查找的确切空白字符通常并不方便。不幸的是，在大多数方言中，一个空格匹配一个空格，`\n` 字符匹配换行符，`\t`
  字符匹配制表符。这种处理方式的问题在于，搜索表达式中确切的空白字符变得至关重要。


  这种方法让我想起自己一次奇怪的前端经历。我创建了一个帮助用户解析 CSV 文件的用户界面。在该界面中，有一个用于输入 CSV 分隔符的字段。有一次，一位管理员打电话给我。他向我展示，他在文本字段中粘贴了一个制表符空白字符，因此他的
  CSV 分隔符变成了制表符。不幸的是，输入字段被修剪了，制表符无法保存，因为输入字段必须至少包含一个空白字符。


  空白字符往往是一团乱麻。


  稍后你将了解到，可以在正则表达式末尾添加标志。这些标志可能会影响你对空白字符的处理方式。


  在某些情况下，输入字符串会被拆分为多行，正则表达式需要匹配每一行。在其他情况下，输入字符串可能包含换行符，这些换行符可以被正则表达式匹配。这意味着某些标志可能会改变匹配换行符的行为。


  Perl 6 方言对空白字符的处理方式与任何其他方言完全不同。Perl 6 忽略正则表达式中的所有空白字符，这使得空白字符不像在其他方言中那样令人费解。稍后你将看到，忽略空白字符的好处是，你可以以任何想要的方式格式化正则表达式。当空白字符无关紧要时，以下是等价的：


  ```

  /first second third/

  /

  first

  second

  third

  /

  ```


  正则表达式中的一个空白字符匹配被测试字符串中的任意空白字符序列。


  某些 PCRE 正则表达式的 `x` 或扩展模式标志会开启相同的格式化模式。请注意，此标志并非在所有 PCRE 语言中都可用。


  ```

  /(?x)

  first

  second

  third

  /

  ```


  总结一下，要小心空白字符的异常情况。避免在正则表达式中使用空白字符。一旦我介绍了命名字符类，你将很快学会如何正确处理空白字符。


  ## 任意字符类


  在某些情况下，你会查找任意字符。枚举所有可能的字符确实没有意义。


  在所有正则表达式方言中，`.` 符号表示一个任意字符。例如，`/..e/` 表示一个以 `e` 结尾的三字母序列。


  不幸的是，在不同的方言中，`.` 字符的定义不同，因为它可能包含也可能不包含换行符。


  *   Perl 6 遵循 BRE 和 ERE 定义的命令行正则格式。换句话说，`.` 表示任何字符，包括换行符。

  *   在 PCRE 语言家族所代表的所有其他语言中，`.` 字符表示除换行符外的任何字符。因此，必须显式指定匹配换行符。EMACS 和 VIM 遵循此方法。


  出于可维护性考虑，建议显式指定你感兴趣匹配的字符类型。你将在第 6 章学习如何做到这一点。在此之前，使用 `[.\n]` 可以确保你将换行符与任意字符类一起包含在内。


  ## 基本连接


  在所有编程语言中，三个必要的控制元素是*顺序*、*选择*和*迭代*。连接负责顺序执行。


  你已经在多处使用了连接。首先，在第 1 章定义 `/re/` 正则表达式时使用了它。你将 `/re/` 解读为：匹配字符 `r`，*然后*匹配字符 `e`。


  在构建正则表达式时，你可以连接任意正则表达式序列。


  ## 可选执行


  现在你已经知道如何进行顺序执行，接下来我们进入选择。让我们回忆一下第 1 章中的示例，如下所示：


  ```

  BRE:              不支持 or 运算符

  EMACS,VIM:        /0\|1\|2/

  ERE,PCRE,Perl 6:  /0|1|2/

  ```


  你已经了解到 `|` 或 `\|` 运算符指定了可选路径。`/0|1|2/` 匹配一个为 `0` *或* `1` *或* `2` 的字符。


  以下是一些示例：


  *   `/java|php|perl/` 匹配包含 `java` *或* `php` *或* `perl` 的字符串。

  *   `/....|a|the/` 匹配任何长度至少为四个字符的字符串，*或*包含字符 `a`，*或*包含子串 `the`。


  管道运算符在正则表达式中的所有运算符中优先级最低。




  '
- '# 运算符优先级与括号


  连接运算的优先级高于选择运算。你可以将连接运算视为乘法，将选择运算视为加法。在表达式`/a`|`the/`中无需使用括号，因为连接运算的优先级更高。同理，计算`1
  + 2 * 3 = 1 + 6 = 7`时也不需要括号。


  有时你需要覆盖默认的优先级规则，此时括号就派上了用场。你可以使用括号对低优先级的表达式进行分组。


  例如，表达式`/list`|`lost`|`lust/`可以简化为`/l(i`|`o`|`u)st/`。你可以使用任意数量的嵌套括号进行分组。


  在 VIM 和 EMACS 中，不要忘记对括号进行转义。


  为完整起见，需注意括号的用法可能产生重载。括号将用于从正则表达式中*捕获*子字符串。你将在后续阶段探索这一用例。


  括号是元字符，不会消耗正则表达式测试字符串中的任何字符。还有许多其他命令也不会在字符串内部进行遍历。例如，下一节你将学习到同样不消耗字符的定位起始锚点和结束锚点。


  '
- '# 定位起始锚点和结束锚点


  在某些方言（如 JavaScript）中，`^`和`$`符号表示待匹配字符串的起始和结束。而在其他环境（如 EMACS 和 VIM）中，`^`和`$`符号表示待匹配行的起始和结束。


  在 BRE、ERE、多数基于 PCRE 的语言以及 Perl 6 中：


  * `/^x/` 匹配以`x`开头的字符串。

  * `/x$/` 匹配以`x`结尾的字符串。

  * `/^x$/` 匹配只包含字符`''x''`的字符串。


  在某些基于 PCRE 的语言中，上述字符仅表示行的边界断言。例如在 Ruby 中：


  * `/^x/` 匹配以`x`开头的行。

  * `/x$/` 匹配以`x`结尾的行。

  * `/\Ax/` 匹配以`x`开头的字符串。

  * `/x\z/` 匹配以`x`结尾的字符串。


  当`^`和`$`对行边界进行限制时，在多数基于 PCRE 的语言中，对于包含多行的字符串，你可以分别使用`\A`和`\z`或`\Z`字符。


  这不是通用规则，因为在 JavaScript 中，`\A`表示字面字符`A`。JavaScript 使用单词边界断言`\b`来测试单词的起始或结束。


  * `/\bx/` 匹配以`x`开头的单词。

  * `/x\b/` 匹配以`x`结尾的单词。


  此外，在 JavaScript 中，多行修饰符`m`会重新定义`^`和`$`，使其分别匹配行的起始和结束。你将在下一章学习多行修饰符。


  在 EMACS 中：


  * ``/\`x/`` 匹配以`x`开头的字符串。

  * `/^x/` 匹配以`x`开头的行。

  * `/x\''/` 匹配以`x`结尾的字符串。

  * `/x$/` 匹配以`x`结尾的行。


  在 VIM 中：


  * `/\%^x/` 匹配以`x`开头的字符串。

  * `/^x/` 匹配以`x`开头的行。

  * `/x\%$/` 匹配以`x`结尾的字符串。

  * `/x$/` 匹配以`x`结尾的行。


  在 Perl 6 中：


  * `/^x/` 匹配以`x`开头的字符串。

  * `/x$/` 匹配以`x`结尾的字符串。

  * `/^^x/` 匹配以`x`开头的行。

  * `/x$$/` 匹配以`x`结尾的行。


  你可以得出结论：定位起始锚点和结束锚点字符在不同方言中的行为可能完全不同。在依赖这些断言前，务必查阅文档并测试你的代码。


  **练习 1**：在 JavaScript 中，`/^list`|`lost`|`lust$/`会匹配以下哪些字符串？为什么？


  * `list,`

  * `lostlist,`

  * `listlist,`

  * `lustlist?`


  **解答**：令人惊讶的答案是，前三个字符串都能匹配。以下是验证结果：


  ```

  > ''list''.match( /^list|lost|lust$/ )

  ["list", index: 0, input: "list"]

  > ''lostlist''.match( /^list|lost|lust$/ )

  ["lost", index: 0, input: "lostlist"]

  > ''listlist''.match( /^list|lost|lust$/ )

  ["list", index: 0, input: "listlist"]

  > ''lustlist''.match( /^list|lost|lust$/ )

  null

  ```


  你可能错误地认为该正则表达式只匹配字符串`''list''`、`''lost''`和`''lust''`，而非其他内容，因为字符串的起始和结束都被锚定了。


  如果你期望只有`list`能匹配该正则表达式，请回忆选择运算一节中的内容：管道运算符在正则表达式中是所有运算符中优先级最低的。


  `|`运算符优先级最低，这意味着`^`和`$`的绑定优先级更高。如果使用括号来突出自然优先级，你会得到以下表达式：


  ```

  /(^list)|lost|(lust$)/

  ```


  该表达式解读如下：匹配任何满足以下任一条件的字符串：


  * 以`list`开头

  * 包含`lost`

  * 以`lust`结尾


  第二个字符串`''lostlist''`能匹配，因为它包含`lost`。第三个字符串`''listlist''`能匹配，因为它以`list`开头。


  第四个字符串`''lustlist''`不匹配，因为它不以`list`开头，不包含`lost`，也不以`lust`结尾。


  如果你想将匹配范围限定为仅`list`、`lost`和`lust`，则必须使用括号。


  ```

  /^(list|lost|lust)$/

  ```


  添加括号后，只有第一个字符串能匹配该表达式。


  ```

  > ''list''.match( /^(list|lost|lust)$/ )

  ["list", index: 0, input: "list"]

  > ''lostlist''.match( /^(list|lost|lust)$/ )

  null

  > ''listlist''.match( /^(list|lost|lust)$/ )

  null

  > ''lustlist''.match( /^(list|lost|lust)$/ )

  null

  ```


  当将锚点字符与`|`一起使用时，务必使用括号标明你预期的优先级，即使你的意图显而易见，甚至括号的使用是冗余的。这样，你的表达式将更易于维护。


  '
- '# 修饰符


  可以为正则表达式添加不同的修饰符，以改变表达式的解释和执行方式。修饰符通常写在表达式结尾之后。


  坏消息是，不同的正则表达式实现带有不同的修饰符。好消息是，在使用某种语言之前，你可以查找并熟悉该语言中可用的修饰符。


  表 2-3 展示了一些修饰符的示例。


  **表 2-3** 修饰符


  | 修饰符 | 语义 |

  | --- | --- |

  | `g` | 全局匹配，在首次匹配后不会停止返回。 |

  | `m` | 多行匹配，使`^`和`$`匹配行的起始和结束，而非整个字符串的起始和结束。 |

  | `s` | 单行模式。字符`.`匹配所有字符，包括`\n`。 |

  | `i` | 不区分大小写匹配。 |

  | `x` | 忽略空白字符。此选项启用自由间距模式。 |

  | `u` | 使用完整 Unicode 匹配。 |


  这些标志并非通用。例如，`x`标志在 JavaScript 中不可用。`g`标志在 PHP 中不可用，因为全局模式只能通过调用不同的匹配器函数来访问。


  让我们在 JavaScript 控制台中查看不区分大小写模式的效果：


  ```

  > /re/.test( ''Regex'' );

  false

  > /re/i.test( ''Regex'' );

  true

  ```


  不区分大小写模式将字符串视为不区分大小写，使序列`Re`与正则表达式`/re/i`匹配。


  目前，你可以认为`/re/i`与`/(r`|`R)(e`|`E)/`是等价的。这并不完全准确，原因有二，且会影响效率：


  * 稍后你将学习一种更优的方式来表示字符集，例如表示集合`{r, R}`中的字符。

  * 你将学习括号用于捕获子字符串的次要功能，这可能会大幅降低正则表达式的速度。


  在本节中不必担心性能问题。重点在于掌握正确的语法。




  ## 总结


  本章介绍了一些基本构建块，使你能够理解和构建基本正则表达式。


  你将学习如何编写正则表达式、可以使用哪些字符作为字面量字符，以及如何使用元字符。本章还介绍了拼接和选择执行，即逐个匹配字符或将它们作为备选方案进行匹配。引入了
  `.` 字符作为任意一个字符的简写。


  最后，我将字符串或行的开头和结尾锚定，并预览了一些修饰符。在下一章中，你将运用其中部分修饰符，在许多不同的编程语言中执行基于 PCRE 的正则表达式。


  '
- '# 3. 执行正则表达式


  正则表达式可以在不同的编程语言和文本编辑器中使用。由于在不同环境中测试代码很重要，本章将介绍如何在自己的环境中构造和执行正则表达式。


  不必担心记住所有语言的细节。本章目标是探索和尝试正则表达式。你无需给自己施加压力去记忆我尚未详细解释的语言元素。一旦你接触到某个你可能还不理解功能的详细解释，回忆本章所读内容将加深你对这种语言结构的熟悉程度。


  首先，你将深入学习 JavaScript 中的正则表达式，以便在浏览器中试验正则表达式。然后你将有机会使用一些网站在许多其他编程语言中执行正则表达式。


  再次重申，本章的心态是“无压力，开心玩。”


  ## JavaScript 中的正则表达式


  使用 JavaScript 正则表达式进行实验很容易，因为 JavaScript 在所有浏览器中都可访问。


  我将使用 Chrome 开发者工具来执行正则表达式。每行开头的 `>` 符号表示输入。返回值和控制台日志会在输入行之后打印。由于我们在控制台中实验，我将使用全局变量。显然，在源代码中，建议使用
  `let` 和 `const`。


  构造正则表达式有两种方式。在字面量形式中，正则模式可以写在两个斜杠（`/`）之间，并可在末尾添加一些全局修饰符。在对象形式中，你可以使用 `RegExp` 构造函数来创建正则表达式。这两种形式是等效的。


  ```

  > new RegExp( ''xy+'' )

  /xy+/

  ```


  `xy+` 模式匹配包含一个 `x` 字符后跟至少一个 `y` 字符的字符串。


  JavaScript 正则表达式是对象。


  ```

  > typeof /xy+/

  "object"

  ```


  构造函数允许在运行时编译表达式。例如，你可以使用可视化编辑器构建正则模式，根据可视化编辑器组装字符串，然后在运行时将其作为参数传递给 `RegExp` 构造函数。


  ### RegExp 方法


  JavaScript 中正则表达式有许多用例。通过检查正则表达式的公共接口（它描述了可在 `RegExp` 对象上执行的方法），可以识别这些用例。


  - `exec` 执行搜索，返回匹配信息。

  - `test` 执行搜索，返回一个布尔值指示是否找到匹配。

  - `toString` 将正则表达式转换为字符串。


  ```

  > /xy+/.exec( ''yyxyy'' );

  {0: "xyy", index: 2, input: "yyxyy", length: 1}

  > /xy+/.test( ''yyxyy'' );

  true

  > /xy+/.toString()

  "/xy+/"

  ```


  注意，`exec` 返回的是*最长*匹配 `xyy`，而不是最短匹配 `xy`。这是因为 `y+` 结构像一个循环，会匹配尽可能多的 `y` 字符。换句话说，`y+`
  结构是贪婪的。你将在第 5 章了解 `+` 元字符的行为。


  请注意，在前面的 `test` 示例中，从查找匹配的角度来看，`xy+` 搜索表达式等同于使用 `xy`。这是因为定位*一个* `y` 字符意味着你也能定位*至少一个*。因此，在
  `test` 方法中，`/xy+/` 和 `/xy/` 的行为相同。在其他方法中，`y+` 会找到最长的 `y` 字符序列。


  ### 接受正则表达式的字符串方法


  某些字符串方法接受正则表达式作为参数。


  - `match` 在字符串中执行搜索，返回下一个匹配的信息。这类似于 `RegExp` 对象的 `exec` 方法，只是交换了对象和参数的位置。

  - `search` 在字符串中执行搜索，返回下一个匹配的索引。如果字符串中找不到该正则模式，则返回的索引为 `-1`。

  - `replace` 在字符串中执行搜索并替换第一个匹配。

  - `split` 根据指定的正则模式将字符串分割成子字符串。


  以下是一些示例：


  ```

  > s = ''xyyzxyzz'';

  > s.match( /xy+/ );

  { 0: "xyy", index: 0, input: "xyyzxyzz", length: 1 }

  > s.search( /xy+/ )；


  > s.replace( /xy+/, ''U'' )

  "Uzxyzz"

  > s

  "xyyzxyzz"

  > s.split( /xy+/ )

  ["", "z", "zz"]

  ```


  请注意，`replace` 不会修改原始字符串；它只返回一个经过替换的新字符串。


  字符串的 `split` 方法具有多态性，它既接受字符串也接受正则表达式。在后一种情况下，字符串会根据可能的最长匹配进行分割。


  ### 正则表达式修饰符


  `RegExp` 构造函数的第二个参数是应用于正则表达式的标志列表。这些标志被称为*修饰符*。例如，对于不区分大小写的搜索，可以应用 `i` 标志。


  ```

  > x = new RegExp( ''x'' )

  /x/

  > xX = new RegExp( ''x'', ''i'' )

  /x/i

  > x.test( ''XY'' )

  false

  > xX.test( ''XY'' )

  true

  ```


  表 3-1 描述了 JavaScript 中可用的修饰符。


  **表 3-1 JavaScript 修饰符**


  | 修饰符 | 描述 |

  | --- | --- |

  | `i` | 不区分大小写匹配。大写和小写无关紧要。 |

  | `g` | 全局匹配。你尝试查找所有匹配，而不是仅返回第一个匹配。正则表达式的内部状态会存储最后一个匹配的位置，并从上次匹配结束的位置继续匹配。 |

  | `m` | 多行匹配。它将 `^` 和 `$` 字符视为匹配测试字符串每一行的开头和结尾。换行符由 `\n` 或 `\r` 确定。 |

  | `u` | Unicode 搜索。正则模式被视为 Unicode 序列。 |

  | `y` | 粘性搜索。 |

  | `s` | 单行匹配。`.` 字符也会匹配换行符，例如 `\r` 和 `\n`。在 ES2018 及更新版本中可用。 |


  单行匹配是 ES2018 中添加到 JavaScript 正则引擎的一种结构。本章将不涉及这个标志。让我们为其余标志执行几个示例。


  ### 全局匹配


  让我们构建一个全局匹配的示例。我们将找到所有 `x` 字符的序列。


  ```

  > regex = /x+/g;

  > str = ''yxxxyxyxx'';

  > regex.exec( str )

  {0: ''xxx'', index: 1, input: ''yxxxyxyxx'' }

  > regex.lastIndex


  > regex.exec( str )

  { 0: "x", index: 5, input: "yxxxyxyxx" }

  > regex.exec( str )

  { 0: "xx", index: 7, input: "yxxxyxyxx" }

  > regex.exec( str )

  null

  > str.match( /x+/ )

  {0: ''xxx'', index: 1, input: ''yxxxyxyxx'' }

  > str.match( /x+/g )

  ["xxx", "x", "xx"]

  ```


  在 `exec` 示例中，可以看到三个匹配项被逐一返回。在第三个匹配之后，返回 `null`。全局正则表达式的 `lastIndex` 属性存储了需要恢复执行的位置。


  你已经了解到，使用字符串匹配时，返回值类似于第一次执行 `regex.exec`。然而，当使用全局正则参数时，返回值是一个按顺序包含*所有*匹配项的数组。




  '
- '# 多行匹配


  让我们来执行一个多行匹配的示例。正则表达式


  ```

  > xRow = /^x+$/m

  ```


  定义了一个可能包含多行的字符串，其中每一行只能包含小写字母 `x`，并且每行必须至少包含一个 `x` 字符。`^` 字符表示每一行必须以指定的正则表达式序列开头。`$`
  字符表示每一行必须以指定的正则表达式序列结尾。


  `match` 函数显示字符串的第一行符合所有指定条件。


  ```

  ''xx\nxXx\nxxxx''.match( xRow )

  ["xx", index: 0, input: "xxxXxxxxx"]

  ```


  如果你想要获取所有匹配结果，需要在正则表达式中添加全局标志。以下表达式匹配了字符串的第一行和第三行，而忽略了第二行：


  ```

  ''xx\nxXx\nxxxx''.match( /^x+$/mg )

  ["xx", "xxxx"]

  ```


  如果没有使用标志位，换行符会被视为空白字符。由于空白字符不等于 `x`，因此该字符串不匹配该正则表达式。


  ```

  ''xx\nxXx\nxxxx''.match( /^x+$/ )

  null

  ```


  如你所见，如果没有多行标志，`^` 和 `$` 字符表示整个字符串只能包含由模式 `x+` 指定的字符。


  '
- '# ES6 Unicode 正则表达式


  在 ES6 中，你可以指定要匹配的 Unicode 字符。一个 Unicode 字符会被视为一个字符，无论该字符占用多少个字节。


  ```

  > ''x''.codePointAt( 0 ).toString( 16 )

  "78"

  ```


  字符 `x` 的十六进制代码是 `78`。在 JavaScript 中对应的 Unicode 字符是 `\u{78}`。然而，包含此 Unicode 字符的正则表达式却无法匹配该字符本身。


  ```

  > /\u{78}/.test( ''x'' )

  false

  ```


  这就是为什么你需要 `u` 标志。


  ```

  > /\u{78}/u.test( ''x'' )

  true

  ```


  Unicode 字符的另一个问题是它们所占的字节数可能不同。例如，`''\u{2ABCD}''` 是一个无法用 4 个字节表示的 Unicode 字符。


  让我们构建一个正则表达式，检查相应字符串是否恰好包含一个字符。你可以使用任意字符符号 `.` 来实现。你可以指定字符串以此字符开头，以此字符结尾，并且中间没有其他内容：`/^.$/`。


  让我们测试在什么条件下字符串 `''\u{2ABCD}''` 能匹配这个正则表达式：`/^.$/`。由于本书无法处理较长的 Unicode 字符，我将同时提供截图（见图
  3-1）和代码。代码中的 Unicode 字符将显示为一个矩形。


  ![../images/470763_1_En_3_Chapter/470763_1_En_3_Fig1_HTML.jpg](img/470763_1_En_3_Fig1_HTML.jpg)


  图 3-1 JavaScript 正则表达式的 Unicode 标志


  ```

  > /^.$/.test( ''▯'' )

  false

  > /^.$/u.test( ''▯'' )

  true

  > /^.$/.test( ''\u{2ABCD}'' )

  false

  > /^.$/u.test( ''\u{2ABCD}'' )

  true

  ```


  我们可以得出结论，旧版 JavaScript 正则引擎将 `''\u{2ABCD}''` 解释为两个字符的序列。然而，使用 `u` 标志后，这个长的 Unicode
  字符会被识别为单个字符。


  '
- '# 粘性匹配


  在匹配之后，`y` 标志会将正则表达式的 `lastIndex` 属性设置为上一次匹配序列之后的第一个字符。如果正则表达式上一次执行没有匹配到任何结果，`lastIndex`
  会被设置为 `0`。


  这会对正则表达式的内部状态产生改变。务必注意这个副作用！当 `y` 标志开启时，正则表达式开头会自动添加一个 `^`。这意味着在 `lastIndex` 位置上的字符必须与正则表达式的起始位置匹配。


  示例如下：


  ```

  > regExp = /ab+/y

  /ab+/y

  > ''ababbabbb''.match( regExp )

  { 0:"ab", index: 0, input: "ababbabbb" }

  > regExp.lastIndex


  > ''ababbabbb''.match( regExp )

  { 0: "abb", index: 2, input: "ababbabbb" }

  > regExp.lastIndex


  > ''ababbabbb''.match( regExp )

  { 0:"abbb", index: 5, input: "ababbabbb" }

  > regExp.lastIndex


  > ''ababbabbb''.match( regExp )

  null

  > regExp.lastIndex


  > ''ababbabbb''.match( regExp )

  { 0: "ab", index: 0, input: "ababbabbb" }

  > regExp.lastIndex


  // ...

  ```


  '
- '# 总结


  JavaScript 中的正则表达式有一些值得尝试的独特特性。其中一些特性是 JavaScript 正则表达式虚拟机所独有的。其他特性则与其他语言通用。


  这里我没有过多关注正则表达式模式的确切语法，因为你将在后续阶段学习具体的规则。一些字符，比如 `+`（至少一次）元字符，用于预先展示大多数语言中正则表达式的功能。


  你已经了解到正则表达式在 JavaScript 中是对象，并且它们也被集成到一些 `String` 方法中。


  `RegExp` 的公共接口允许测试字符串、查找第一个匹配项、查找所有匹配项、替换子字符串，甚至分割字符串。


  为了实现这些用例中的一部分，你可以使用一些修饰符，例如全局 `g` 修饰符、粘性 `y` 修饰符或多行 `m` 修饰符。


  还有两个修饰符使得字符串处理更加便捷：`i` 使得字符串不区分大小写，而 `u` 则使 JavaScript 正则表达式虚拟机能够正确处理 Unicode 字符。


  '
- '# 其他基于 PCRE 的正则表达式环境


  JavaScript 正则表达式以及大多数编程语言的正则表达式执行环境都基于 PCRE 方言。我们现在将探讨如何在一些最流行的语言中执行正则表达式。


  鉴于大多数语言执行正则表达式不如 JavaScript 那样简单，我们将使用一些工具，使得在浏览器中执行和测试正则表达式成为可能。


  当你需要一种快速生成匹配正则表达式的代码的解决方案时，可以前往 `regex101.com` 的代码生成器。^(²)




  ### PHP


  PHP 提供了用于处理正则表达式的全局函数。这些函数以以下前缀开头：


  - `preg_` 匹配 Perl PCRE 语法

  - `ereg_` 基于 ERE 方言

  - `mb_ereg` 同样基于 ERE 方言，且能处理 Unicode 字符


  我们在这里只讨论 PCRE 语法。


  在 PHP 中，有些修饰符与 JavaScript 相同，而另一些则不同。


  - `i` 表示不区分大小写，与 JavaScript 中相同。

  - `m` 表示多行模式，与 JavaScript 中相同。

  - `u` 表示 Unicode 匹配，与 JavaScript 中相同。

  - `s` 使 `.` 字符匹配包括换行符在内的所有字符，与 ES2018 中相同。

  - `x` 开启自由间距模式以提高可读性。自由间距模式会忽略正则表达式字符之间的空白字符。


  请参考 PHP 手册的 PCRE 部分（^(³)）以获取所有 PCRE 正则函数的文档。


  你可以使用许多在线沙盒工具（例如 `writephponline.com`^(⁴) 或 Joodle PHP 在线编辑器^(⁵)）在线执行 PHP 代码。


  你可以使用 `preg_match` 从字符串中返回第一个匹配项。


  ```

  preg_match(''/xy+/'', ''xyxyyxyyy'', $matches, PREG_OFFSET_CAPTURE);

  print_r($matches);

  ```


  结果如下所示：


  ```

  Array ( [0] => Array ( [0] => xy [1] => 0 ) )

  ```


  这是一个包含一个元素的数组，该元素描述了匹配结果。匹配描述符本身也是一个数组，其中索引 0 包含匹配到的序列，索引 1 包含匹配结果中第一个字符的位置。


  `preg_match_all` 返回所有匹配项，因此它类似于 JavaScript 中的 `g` 标志。请记住，PHP 没有 `g` 修饰符，因此全局匹配功能是通过
  PCRE 正则表达式封装器的公共接口来实现的。


  ```

  preg_match_all(''/xy+/'', ''xyxyyxyyy'', $matches, PREG_OFFSET_CAPTURE);

  print_r($matches);

  ```


  结果包含所有匹配项。


  ```

  Array (

  [0] => Array (

  [0] => Array ( [0] => xy   [1] => 0 )

  [1] => Array ( [0] => xyy  [1] => 2 )

  [2] => Array ( [0] => xyyy [1] => 5 )

  )

  )

  ```


  尽管 `preg_` 函数充当 Perl 5 风格正则表达式的封装器，但在 Perl 语法上仍有一些细微差异。更多详情请查阅 `php.net` 上关于 PCRE
  模式差异的文档^(⁶)。


  ### Python


  现在我们将使用 `python.org` 的交互式 shell^(⁷) 开始熟悉 Python 中的正则表达式。`re` 这一 Python 模块为你提供了对
  PCRE 风格正则表达式的支持。你可以通过 `import re` 导入此模块。


  ```

  >>> import re

  ```


  `re` 模块的 `compile` 方法会根据提供给它的模式字符串编译一个正则表达式。使用你已有的 PCRE 知识，你已经可以编写许多模式字符串了。


  ```

  >>> regex = re.compile(r"xy+")

  ```


  注意字符串前面的 `r`。在 Python 中，这表示一个原始字符串。虽然在之前的例子中可以省略这个 `r`，但在一般情况下，使用原始字符串可以省去大量转义字符的工作。


  已编译正则表达式的 `search` 方法会在其字符串参数中搜索匹配项。


  ```

  >>> regex.search( "QxyxyyQ" )

  ```


  你可以通过一些方法获取关于结果的更多信息。


  ```

  >>> result = regex.search( "QxyyxyQ" )

  >>> result.group(), result.start(), result.end(), result.span()

  (''xyy'', 1, 4, (1, 4))

  ```


  `group` 方法以其最长形式返回第一个匹配项。可以使用 `start`、`end` 和 `span` 方法获取匹配项的第一个字符和匹配项之后的第一个字符。


  已编译正则表达式的 `match` 方法容易引起误解，因为它是从字符串的*起始位置*开始寻找匹配。


  ```

  >>> regex.match( "QxyxyyQ" )

  None

  >>> regex.match( "xyxyyQ" )


  ```


  从技术上讲，`match` 是多余的，因为你可以使用 `^` 字符来匹配字符串的开头。


  ```

  >>> re.compile( "^xy+" ).search( "xyxyyQ" )


  ```


  我解释了 `match` 方法，目的是让你避免将其与 `search` 混淆。


  并不一定非要编译正则表达式，因为 `match` 和 `search` 方法也可以通过 `re` 模块作为函数直接调用，这些函数接受一个正则表达式字符串和一个普通字符串作为参数。


  ```

  >>> re.search( ''^xy+'', ''xyyyyxyQ'' )


  ```


  还可以枚举与搜索表达式匹配的所有结果。`findall` 和 `finditer` 方法可以实现这个功能。


  ```

  >>> re.findall( ''xy+'', ''QxyxyyQxyyyQ'' )

  [''xy'', ''xyy'', ''xyyy'']

  >>> iterator = re.finditer( ''xy+'', ''QxyxyyQxyyyQ'' )

  >>> for matchNum, match in enumerate(iterator):

  ...     print ( match.group(), match.span() )

  ...

  xy (1, 3)

  xyy (3, 6)

  xyyy (7, 11)

  ```


  在第一个例子中，我们将所有匹配项枚举到了一个数组中。在第二个例子中，我们创建了一个迭代器并开始遍历它，逐一打印结果。


  现在你已经掌握了足够的知识来理解 `regex101.com`^(⁸) 生成的示例代码。


  ```

  import re

  regex = r"ab+"

  test_str = "ababb"

  matches = re.finditer(regex, test_str)

  for matchNum, match in enumerate(matches):

  matchNum = matchNum + 1

  print ("Match {matchNum} was found at {start}-{end}: {match}"

  .format(

  matchNum = matchNum,

  start = match.start(),

  end = match.end(),

  match = match.group()

  )

  )

  for groupNum in range(0, len(match.groups())):

  groupNum = groupNum + 1

  print ("Group {groupNum} found at {start}-{end}: {group}"

  .format(

  groupNum = groupNum,

  start = match.start(groupNum),

  end = match.end(groupNum),

  group = match.group(groupNum)

  )

  )

  ```


  请注意，我对代码中的长行进行了格式化。由于本书的宽度有限，这一改动是合理的，而且编写过长的代码行也不是一个好习惯。


  这段代码会输出以下内容：


  ```

  Match 1 was found at 0-2: ab

  Match 2 was found at 2-5: abb

  ```


  在这个例子中，关于分组的内部循环没有执行。你在后面学习使用捕获组提取子字符串时，还会回到这段代码上。


  更多信息请参考 Python 的正则表达式文档^(⁹)。


