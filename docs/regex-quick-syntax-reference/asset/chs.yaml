- '# 固定范围匹配


  假设我们想匹配至少出现两次、至多出现五次的字符 `a`。不同的正则方言对此有不同的实现方式，如表 5-3 所示。


  表 5-3：匹配字符 `a` 至少两次，至多五次


  | 方言 | 表示法 |

  | --- | --- |

  | `BRE`, `EMACS` | `/a\{2,5\}/` |

  | `VIM` | `/a\{2,5}/` |

  | `ERE`, `PCRE` | `/a{2,5}/` |

  | `Perl 6` | `/ a ** 2..5 /` |


  在大多数编程语言中，我们使用 `PCRE` 方言：`/a{2,5}/`。请根据你自己的使用场景来关注。


  有限状态机的形式看起来比较冗长，因为我们需要展开每一种可能。匹配二到五次意味着我们必须为匹配两次、三次、四次和五次分别构建一条路径，如图 5-7 所示。


  ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig7_HTML.jpg](img/470763_1_En_5_Fig7_HTML.jpg)


  图 5-7：`/a{2,5}/`


  在实践中，大多数正则引擎将这个重复修饰符表示为 `*`（星号）。星号被解释为*任意次数*的匹配，并使用内部计数器来满足所需条件。


  请注意，可以省略范围的最大值。要匹配至少两个 `a` 字符，你必须使用表 5-4 中所示的表示法。


  表 5-4：匹配至少两个 `a` 字符


  | 方言 | 表示法 |

  | --- | --- |

  | `BRE`, `EMACS` | `/a\{2,\}/` |

  | `VIM` | `/a\{2,}/` |

  | `ERE`, `PCRE` | `/a{2,}/` |

  | `Perl 6` | `/ a ** 2..* /` |


  注意，除了 `Perl 6` 之外，所有方言中最大值都被简单地省略了，而在 `Perl 6` 中，`*` 表示任意值。


  `/a{2,}/` 的有限状态机形式比属于有界重复修饰符的 FSM 要简单得多。事实上，这个机器等价于表达式 `/aaa*/` 的 FSM，如图 5-8 所示。


  ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig8_HTML.jpg](img/470763_1_En_5_Fig8_HTML.jpg)


  图 5-8：`/a{2,}/`


  理论上，上限是无界的。在实践中，这个上限取决于正则虚拟机的实现。上限限制可能是一个像 `256` 这样的低数值。在其他语言中，这个值是 `32767`，这比 2
  字节无符号整数的最大值小一。在使用具有较大上限的正则表达式时要小心。


  另外请注意，在某些语言（如 `Python`）中，实际最大限制是无穷大，但如果这个限制太大，你可能会很容易遇到溢出错误。


  ## 精确循环 `n` 次


  让我们看看所有方言中表达式 `/aa/` 的简写形式，如表 5-5 所示。


  表 5-5：`/aa/` 的简写形式


  | 方言 | 表示法 |

  | --- | --- |

  | `BRE`, `EMACS` | `/a\{2\}/` |

  | `VIM` | `/a\{2}/` |

  | `ERE`, `PCRE` | `/a{2}/` |

  | `Perl 6` | `/ a ** 2 /` |


  这意味着我们精确地循环两次字符 `a`。当有一个复杂的表达式而不是 `a`，或者重复次数远大于 `2` 时，这个简写形式实际上比原版 `/aa/` 更简洁。


  属于这个循环的有限状态机非常简单，如图 5-9 所示。


  ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig9_HTML.jpg](img/470763_1_En_5_Fig9_HTML.jpg)


  图 5-9：`/aa/`


  如你所见，该状态机匹配了 `/aa/` 的 FSM。


  ## 贪婪重复修饰符


  你已经在表 5-1 中看到了贪婪重复修饰符的元字符。


  所有这类重复修饰符默认都是*贪婪*的。这意味着重复修饰符会从匹配字符串中消耗尽可能多的字符，然后逐字符回溯。


  举一个极端的例子，假设我们使用正则表达式 `/^.*list$/` 来匹配字符串 `''The lost list''`。


  由于 `*` 重复修饰符是贪婪的，`.*` 首先会消耗整个字符串，然后发现我们处于字符串末尾，并且还需要匹配字符 `l`。匹配失败时，我们进行回溯。


  重复修饰符以贪婪的方式消耗字符，并尽可能少地回溯。因此，我们只回溯一个字符。回溯后，`.*` 匹配 `The lost lis`，下一个要消耗的字符是 `t`。由于
  `t` 不等于 `l`，我们再次回溯。


  现在 `.*` 变成 `The lost li`，我们尝试将 `s` 与 `l` 匹配。这行不通，所以继续回溯。


  现在 `.*` 变成 `The lost l`，我们尝试将 `i` 与 `l` 匹配。这行不通，所以继续回溯。


  现在 `.*` 变成 `The lost` ，我们尝试将 `l` 与 `l` 匹配。这次匹配成功，所以我们继续用正则表达式模式的剩余部分匹配字符串的剩余部分。由于我们成功匹配了整个字符串并到达了末尾，我们成功退出正则匹配。


  在这个例子中，我们只回溯了四次。但想象一下，如果我们有数兆字节的文本，一个 `.*` 结构可能会在评估正则表达式剩余部分之前读取整个文件。因此，使用 `.*`
  之类的结构要格外小心。几乎总有一种更优的方式来描述一个模式。


  引入回溯是因为我们的状态机是非确定性的。在 `/^.*list$/` 中，每一步，只要我们处于 `.*` 循环中并且即将遇到一个 `l` 字符，我们就必须决定是匹配一个
  `.` 字符还是匹配一个 `l`。正是这种非确定性导致了回溯。


  对抗回溯的一种方法是使非确定性状态机变得确定。这可能需要对输入的大小执行指数级别的步骤。只有极少数正则虚拟机会这样做，因为这种努力通常得不偿失。


  另一种解决方案是使用按照不同策略进行匹配和回溯的循环。




  '
- '# 懒惰重复修饰符


  你已经看到贪婪有时会导致性能不佳。但你尚未了解的是贪婪与正确性之间的关系。贪婪有时会导致错误的结果。


  例如，假设你想在 JavaScript 中创建一个全局正则表达式，用于匹配西班牙语文本中的*所有*问句。在西班牙语中，问句的语法如下：


  ```

  ¿?

  ```


  假设文本中没有换行符，那么使用以下正则表达式来匹配一个句子是合理的：


  ```

  let regex = /¿.+\?/g

  ```


  让我们在几个问句上测试这个正则表达式。


  ```

  let text = ''¿Tienes animals en casa? ¿Dónde está la biblioteca?'';

  > text.match( regex );

  ["¿Tienes animals en casa? ¿Dónde está la biblioteca?"]

  ```


  哎呀，好像哪里不对劲。两个问句被作为一个结果返回了。为什么呢？


  这是因为我们的 `.+` 重复修饰符是贪婪的！`.+` 并不关心后面会出现 `\?` 字符。我们把问号当成了一个任意字符。


  正因如此，大多数方言中的重复修饰符都提供了*懒惰*版本。


  懒惰重复修饰符会匹配*最少*的、绝对必要的字符，即尽可能少地执行重复修饰符主体中的内容。当表达式匹配失败而需要回溯时，我们不再是移除字符，而是添加字符。


  懒惰重复修饰符的语法如下：在 EMACS、PCRE 和 Perl 6 中，我们只需在重复修饰符后面加上一个问号（`?`）。


  * `a*?` 匹配零个或多个 `a` 字符，并尝试尽可能少地匹配 `a` 字符。

  * `a+?` 匹配一个或多个 `a` 字符，并尝试尽可能少地匹配 `a` 字符。

  * `a??` 匹配零个或一个 `a` 字符，首先尝试不匹配 `a` 字符。

  * `a{1,2}?` 尝试匹配一次或两次 `a` 字符，首先尝试匹配一次。在 Perl 6 中，等效的语法是 `a **? 1..2`。


  让我们来看看 JavaScript 的例子：


  ```

  let regex = /¿.+?\?/g

  let text = ''¿Tienes animals en casa? ¿Dónde está la biblioteca?'';

  text.match( regex );

  ```


  返回值正确地匹配了两个句子。


  ```

  (2) ["¿Tienes animals en casa?", "¿Dónde está la biblioteca?"]

  ```


  请注意，无论你是想使用贪婪还是懒惰的重复修饰符，限制搜索空间都是有意义的。我们可以将重复修饰符后面的第一个字符，排除在重复序列内部可能出现的第一个字符之外。这意味着我们最好将
  `\?` 字符从任意的 `.` 字符类中排除掉。我们可以通过定义 `[^\?]` 字符集来实现排除。可以将其理解为“除了问号之外的任意字符”。


  ```

  regex = /¿[^\?]+\?/g;

  > text.match( regex )

  (2) ["¿Tienes animals en casa?", "¿Dónde está la biblioteca?"]

  ```


  ### 提示


  始终尝试让重复修饰符主体内部序列的第一个字符与重复修饰符之后的第一个字符互斥，以避免非确定性分支和回溯。


  现在，我们得到了两个独立的句子，作为全局正则表达式的两个单独匹配。为了进一步练习懒惰重复修饰符，让我们用 `/^.*?list$/` 来匹配文本 `The lost
  list`。


  * `.*` 匹配了 `The`，然后我们尝试在 `lost list` 上匹配 `list$`。我们确实从字符串中消耗了 `l`，但紧接着字母 `o` 与模式中的
  `i` 不匹配，因此我们回溯。

  * `.*` 匹配了 `The lost`。现在我们尝试用 `list` 来匹配 `list$` 模式。匹配成功。不再需要回溯。


  在这个例子中，结果是一样的，但回溯操作的次数更少。


  你可能会问，什么时候值得使用懒惰重复修饰符，什么时候值得使用贪婪重复修饰符？答案并不显而易见。


  * 你可能出于正确性考虑而选择使用其中一种。例如，西班牙语问句的例子。每当需要匹配一个有开始标志和结束标志、且表达式可能不会嵌套的模式时，使用最小化循环是正确的。

  * 当正确性无关紧要时，你有时可以凭直觉判断使用哪种模式。请记住，匹配成功总是比匹配失败更省时；因此，值得为更快的匹配进行优化。


  ## 占有重复修饰符


  占有重复修饰符的执行方式与贪婪重复修饰符相同，但有一个例外：一旦占有结构回溯，它就会失败。占有重复修饰符不是仅仅回溯一次迭代，而是完全放弃，撤销所有迭代。我们要么贪婪地匹配尽可能多的占有循环迭代，要么完全不匹配任何迭代。


  占有重复修饰符在 PCRE 和 Perl 6 中可用。


  在大多数 PCRE 语言中，我们在相应的贪婪重复修饰符符号后添加一个 `+` 来表示其为占有模式，从而产生 `a*+`、`a++`、`a?+`、`a{1,2}+`
  这样的循环。


  在 Perl 6 中，我们在重复修饰符后添加一个 `:`：`a*:`、`a+:`、`a?:`、`a **: 1..2`。


  有些语言（如 JavaScript）没有占有重复修饰符。但仍然可以使用我们尚未了解的结构来模拟它们。写下这个表达式：`(?=(a+))\1`。一旦你了解了什么是正向先行断言以及捕获组是如何工作的，你可以验证表达式
  `(?=(a+))\1` 等价于 `a++`，前提是该表达式前面没有其他左括号。不过，这种等价并不是完全严格的，因为引入了一个捕获组来构造占有重复修饰符。这个引入的捕获组可能会使其后面的其他捕获组的编号发生偏移。


  *我鼓励你在 regex101.com 上尝试使用占有重复修饰符。* ^(³⁶) *如果你使用属于 PHP (PCRE) 语法的正则调试器，你可以看到逐步执行的匹配过程。*


  例如，表达式 `/a++b/` 匹配任何包含序列 `ab` 的字符串。模式 `a++` 匹配 `a` 字符，然后匹配 `b`。


  表达式 `/a++a/` 永远不会匹配任何字符串。这是因为 `a++` 是占有模式，它会在尝试匹配另一个 `a` 字符之前消耗掉所有 `a` 字符。由于永远找不到这个
  `a` 字符，正则引擎会完全回溯并失败。与 `/a+a/` 不同，在 `/a++a/` 中我们不能只回溯一个字符。因此，没有任何字符串能匹配正则表达式 `/a++a/`。


  根据经验法则，我们可以得出结论：我们试图在占有重复修饰符中匹配的序列的第一个字符，永远不能出现在该重复修饰符本身之后。否则，我们将永远无法得到匹配结果。




  '
- '# 总结


  大多数编程语言都实现了*顺序*、*选择*和*迭代*结构。虽然顺序和选择在正则表达式中显而易见，但迭代的方式却多种多样。你已经学会了迭代模式的五种基本方法。`+`
  符号表示匹配一个字符或序列至少一次。`?` 符号表示最多匹配一次，而 `*` 符号表示匹配任意次数。我们还可以通过指定允许出现次数的**最小值**和**最大值**来制定基数限制。此外，我们还能将序列重复恰好指定的次数。


  你还使用了 `[ab]` 这种记法来选择 `a` 字符*或* `b` 字符。我将在下一章通过引入*字符集*来扩展这一概念。


  通用重复修饰符是**贪婪**的：它们会尝试匹配尽可能多的字符。*回溯*幅度是最小的；每次回溯尝试中，你只会从匹配到的字符串中移除一个字符。


  你可以在重复修饰符的末尾添加一个 `?` 来获得**懒惰**重复修饰符，它会进行最小匹配，并在每次回溯后逐个增加匹配的字符数。


  你可以在重复修饰符的末尾添加一个 `+` 来获得**占有**重复修饰符，它会进行最大匹配，并在任何回溯尝试中直接失败。


  脚注 1


  '
- '# 6. 字符集与字符类


  前一章介绍了有限状态机，以使正则表达式更易于理解。在本章中，你将学习创建更复杂有限状态机所需的工具，以便使用正则表达式执行高级模式匹配任务。


  我们将基于第 2 章的内容进行构建，假设你已经知道如何处理字面字符、连接、*或*运算符、点号字符、用括号进行的分组操作、锚定的开始和结束以及修饰符。


  ## 字符集


  字符集匹配包含集合中任意字符的字符串。


  在 Perl 6 中，字符集被列举在 `<[` 和 `]>` 之间。


  在所有其他方言中，包括所有其他编程语言和文本编辑器，我们使用方括号：`[` 和 `]`。


  包含至少一个二进制数字的字符串的字符集如下：


  -   在 Perl 6 中：`/<[01]>/`

  -   在所有其他方言中：`/[01]/`


  表达式 `[01]` 匹配一个 `0` *或* 一个 `1` 字符。


  由于我已经介绍了*或*运算符，很容易得出结论，上述字符集等价于以下内容：


  -   在 EMACS 和 VIM 中：`/0\|1/`

  -   在 ERE、Perl 6 和 PCRE（包括所有编程语言）中：`/0|1/`


  正则表达式引擎倾向于使用位掩码构建集合的内部表示。因此，检查字符集通常与匹配单个字符一样高效。


  在有限状态机表示中，连接两个状态的边只有一条，如图 6-1 所示。


  ![../images/470763_1_En_6_Chapter/470763_1_En_6_Fig1_HTML.jpg](img/470763_1_En_6_Fig1_HTML.jpg)


  图 6-1


  `/[01]/`


  我使用了 `[01]` 字符集记法来表示位掩码。


  ## 字符集范围


  假设你的下一个任务是表示一个八进制数字和一个十六进制数字。在 PCRE 中，利用你已经掌握的知识，你可以使用以下语法：


  -   对于八进制数字：`/[01234567]/`

  -   对于十六进制数字：`/[0123456789abcdefABCDEF]/`


  在大多数方言中，正则表达式允许你使用 `-` 字符来定义范围。只有 Perl 6 不同，你必须使用 `..` 字符。^(³⁷)


  因此，八进制数字变成如下形式：


  -   在 Perl 6 中：`/<[0..7]>/`

  -   在所有其他方言中：`/[0-7]/`


  范围 `0-7` 等价于 `01234567`。


  乍一看，编写十六进制数字的任务似乎稍微复杂一些。编写 `/[0-9]|[a-f]|[A-F]/` 是完全有效的，但语法看起来过于复杂。


  回顾范围与其枚举的等价关系，我们可以得出以下结论：


  -   `0123456789` 等价于 `0-9`。

  -   `abcdef` 等价于 `a-f`。

  -   `ABCDEF` 等价于 `A-F`。


  因此，`0123456789abcdefABCDEF` 等价于 `0-9a-fA-F`。所以，十六进制数字变成如下形式：


  -   在 Perl 6 中：`/<[0..9a..fA..F]>/`

  -   在所有其他方言中：`/[0-9a-fA-F]/`


  ## 字符集的排除


  你已经看到，在大多数正则表达式解释器中，字符集是由位掩码表示的。现在你将了解如何反转这些位。


  在 Perl 6 中，在左括号前放置一个 `-` 会反转字符集。这个减号元字符也可以用在字符集类前面。更多关于字符类的细节，请参见下一节。


  在所有其他方言中，反转字符是 `^` 运算符，它被放置在括号内、字符枚举、范围或类的前面。


  例如，不是十六进制数字的字符定义如下：


  -   在 Perl 6 中：`/<-[0..9a..fA..F]>/`

  -   在所有其他方言中：`/[⁰-9a-fA-F]/`




  '
- '# 字符集类


  好消息是，正则表达式方言允许我们指定字符集类，例如数字、空白字符或字母数字字符。坏消息是每种方言的实现方式各不相同。


  例如，PHP 文档列举了 PHP 中可用的字符类。


  这简化了源自字符集范围的十六进制字符示例，使其变为 `/[[:xdigit:]]/`。请注意双层方括号。外层方括号表示我们定义了一个字符集。内层方括号属于命名字符类语法。


  一条经验法则是：始终使用命名字符类，而不是范围和枚举，因为命名类能使表达式在未来更易于阅读和维护。


  **练习 1**：编写 PHP 代码，将字符串 `''Aa5h''` 与字符集类表达式 `/[[:xdigit:]]/` 进行匹配。使用 `https://regex101.com`
  生成的输出来确定结果。你可以通过服务 `www.writephponline.com/` 在线运行代码。


  **解法：**


  ```

  $re = ''/[[:xdigit:]]/'';

  $str = ''Aa5h'';

  preg_match_all($re, $str, $matches, PREG_SET_ORDER, 0);

  // 打印整个匹配结果

  var_dump($matches);

  ```


  执行后，我们得到以下响应：


  ```

  array(3) {

  [0]=> array(1) { [0]=> string(1) "A" }

  [1]=> array(1) { [0]=> string(1) "a" }

  [2]=> array(1) { [0]=> string(1) "5" }

  }

  ```


  这意味着正则表达式成功匹配了大写和小写的字母数字，以及数字。由于 `h` 不是十六进制数字，因此没有返回匹配结果。


  **练习 2**：编写一个 Perl 6 的正则表达式，检查字符串是否包含十六进制字符，其中字母数字只能是大写形式。查阅 Perl 6 文档，研究如何在 Perl
  6 中编写正则表达式，并使用服务 `tio.run` 执行代码。


  **解法：**


  根据文档，代码如下所示：


  ```

  if ''XXaAXX'' ~~ m// {

  say "匹配到的字符：" ~ $/;

  say "匹配前的字符串：" ~ $/.prematch;

  say "匹配后的字符串：" ~ $/.postmatch;

  say "匹配开始索引：" ~ $/.from;

  say "匹配结束索引：" ~ $/.to;

  }

  ```


  我们将使用测试字符串 `''xxaAXX''`，并期望我们的正则表达式只匹配索引 3 处的大写 `A` 字符，而不匹配索引 2 处的小写 `a` 字符。


  正则表达式 `/<+xdigit -lower>/` 定义了一个字符集，包含所有十六进制字符并排除小写字母。我本可以使用缩写 `:Ll` 来表示 `lower`
  类。这样正则表达式会变为 `/\+xdigit -:Ll/`。


  条件的语法与文档中的等价，只是消息更加详细。使用 `tio.run` 执行代码后，我们得到以下输出：


  ```

  匹配到的字符：A

  匹配前的字符串：XXa

  匹配后的字符串：XX

  匹配开始索引：3

  匹配结束索引：4

  ```


  每种编程语言都有其字符类的文档。我们在 Perl 6 的例子中看到，某些语言有冗余的表示法，具体来说，一种是更具语义性的（`lower`），另一种是更简短的（`Ll`）。


  在 JavaScript 中，字符类是转义序列。有关更多详细信息，请参阅 `developer.mozilla.org` 上的文档。


  **练习 3**：在 JavaScript 中表述 Perl 6 正则表达式 `/<+xdigit -lower>/`。


  **解法：**


  JavaScript 没有十六进制数字类。因此，我们将简单地使用十进制数字类 `\d` 和范围 `A-F`。


  得到的正则表达式是 `/[\dA-F]/`。


  请始终查阅文档以了解准确的类名，因为它们在每种语言中都不同。一些经验法则仍然适用，例如：


  *   `\d` 表示一个数字（`[0-9]`）。

  *   `\D` 表示一个非数字字符（`[⁰-9]`）。

  *   `\s` 表示空白字符（在 EMACS 中为 `\s-`；`[\t\r\n\f]`）。

  *   `\S` 表示一个非空白字符（在 EMACS 中为 `\S-`；`[ ^\t\r\n\f]`）。

  *   `\w` 表示通常用于标识符的字符（`[0-9a-zA-Z_]`）。

  *   `\W` 表示一个非标识符字符。


  '
- '# 连接高级语言结构


  我们已经介绍了一些连接正则表达式字符的基本用例。例如，表达式 `/re/` 意味着我们必须依次匹配字符 `r` 和字符 `e`。


  连接适用于任何正则子表达式。因此，表达式


  ```

  /\d.[^a-z][^a-z]/

  ```


  在 PCRE 中是有效的。它匹配四个字符：一个数字、一个任意字符和两个非小写字母的字符。


  特殊字符需要特别注意。假设我们想要搜索表达式 `[(1+2)*3]²`。如果我们在 JavaScript Chrome 开发者工具中，将字符串 `''[(1+2)*3]²''`
  与正则表达式 `/[(1+2)*3]²/` 进行匹配，注定会失败。


  ```

  > ''[(1+2)*3]²''.match( /[(1+2)*3]²/ )

  null

  ```


  原因是我们必须转义所有特殊字符。


  ```

  ''[(1+2)*3]²''.match( /\[\(1\+2\)\*3\]\²/ )

  ["[(1+2)*3]²", index: 0, input: "[(1+2)*3]²"]

  ```


  如果我错了请纠正我，但转义似乎毫无可读性。某些语言如 Perl 和 PHP 提供了特殊字符 `\Q` 和 `\E`，用于写入未转义的任意字符。凡写在 `\Q`
  和 `\E` 之间的内容，都将按顺序逐个字符进行匹配。


  例如，PHP 实现如下所示：


  ```

  $re = ''/\Q[(1+2)*3]²\E/'';

  $str = ''[(1+2)*3]²'';

  preg_match_all($re, $str, $matches, PREG_SET_ORDER, 0);

  // 打印整个匹配结果

  var_dump($matches);

  ```


  输出如下：


  ```

  array(1) { [0]=> array(1) { [0]=> string(11) "[(1+2)*3]²" } }

  ```


  由于 JavaScript 中没有此功能，我们有以下选项：


  *   使用扩展库，例如 xregexp。

  *   使用能自动完成繁琐工作的转义函数。


  以下是一个示例（你可以在网上找到）：


  ```

  RegExp.escape = function(text) {

  return text.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, "\\$&");

  }

  ```


  '
- '# 总结


  在本章中，你学习了使用正则表达式语法中一些更高级的元素。


  * 字符集

  * 字符集范围

  * 字符集排除

  * 字符集类


  我以一些使用你已经了解的语言结构连接正则子字符串的示例结束了本章。




  '
- "# 从正则表达式中提取子串\n\n你在第 1 章中了解了许多正则表达式的不同用例。让我重复其中一些用例：\n\n- 测试字符串是否匹配搜索表达式\n- 在字符串中查找某些字符\n\
  - 替换字符串中与正则表达式匹配的子串\n- 处理和格式化用户输入\n- 从服务器日志、配置文件和文本文件中提取信息\n- 验证 Web 应用程序和终端中的输入\n\
  \n许多用例要求我们查找字符串中的*子串*，并将其提取、重新排序、删除或替换。\n\n正则表达式通过子串提取的形式为我们提供了一些帮助来执行这些任务。\n\n\
  当我介绍字面字符和元字符时，我提到括号有两种语义：对字符进行分组和提取子串。即使在第 2 章关于正则表达式运算符优先级和括号的部分，我也提到过我们会使用括号进行子串提取。让我们来学习这个重要的用例。\n\
  \n## 定义捕获组\n\n当正则表达式子串`x`位于括号内，如`(x)`，它就是一个*捕获组*。捕获组不能在字符类内部定义。\n\n捕获组的值会被捕获，并且可以在正则表达式内部或使用你所使用的编程语言的\
  \ API 进行检索。只有当正则表达式匹配过程中到达了右括号时，才能进行检索。\n\n在除 Perl 6 之外的所有语言中，捕获组的标识符是一个正整数，由表达式中左括号的位置决定。\n\
  \n**练习 1**：让我们确定以下 PCRE 正则表达式中的捕获组：\n\n```\n/^a(b|c(d|(e))(f))$/\n```\n\n**解答：**\n\
  \n表 7-1 显示了解答。\n\n| 捕获组编号 | 子串模式                   |\n|-----------|---------------------------|\n\
  | 1         | `b\\|c(d\\|(e))(f)`          |\n| 2         | `d\\|(e)`          \
  \         |\n| 3         | `e`                        |\n| 4         | `f`     \
  \                   |\n\n捕获组编号由左括号的位置决定。\n\n```\n/^a(b|c(d|(e))(f))$/\n^   ^  ^\
  \   ^\n|   |  |   |\n1   2  3   4\n```\n\n## Perl 6 捕获组\n\n在 Perl 6 中，捕获组的编号方式不同。捕获组编号从零开始。捕获组标识符以嵌套分层的方式递增。\n\
  \n在最顶层，有一个标识符为`0`的捕获组。\n\n```\n/^a(b|c(d|(e))(f))$/\n^\n|\n0\n```\n\n在捕获组`0`内部，下一层有两个捕获组：`0.0`和`0.1`。捕获组编号如下开始：\n\
  \n```\n/^a(b|c(d|(e))(f))$/\n^      ^\n|      |\n0.0    0.1\n```\n\n在捕获组`0.0`内部，还有另一个捕获组。\n\
  \n| Perl 6 捕获组编号 | 子串模式                   |\n|------------------|---------------------------|\n\
  | 0                | `b\\|c(d\\|(e))(f)`          |\n| 0.0              | `d\\|(e)`\
  \                   |\n| 0.0.0            | `e`                        |\n| 0.1\
  \              | `f`                        |\n\n```\n/^a(b|c(d|(e))(f))$/\n^\n\
  |\n0.0.0\n```\n\n## 捕获子串的检索\n\n请查阅你正在使用的编程语言的文档。作为示例，我们将用以下语言检索子串：\n\n- JavaScript\n\
  - PHP\n- Python\n- Perl 5\n\n我们将使用与之前相同的示例。假设我们想从如下格式的字符串中检索货币、数字价格值以及带货币的完整价格：\n\
  \n```\nPrice: €19.00\n```\n\n匹配此字符串的正则表达式如下：\n\n```\n/^Price: [€\\$]\\d\\d\\.\\\
  d\\d$/\n```\n\n我们必须对作为货币的美元符号进行转义，因为`$`是一个表示字符串结尾或行尾锚点的元字符。我们还必须对点号进行转义，因为它是一个表示任意单个字符的元字符。\n\
  \n让我们为需要捕获的子串添加一些括号。\n\n```\n/^Price: (([€\\$])(\\d\\d\\.\\d\\d))$/\n```\n\n添加的捕获组包含如表\
  \ 7-3 所示的数据。\n\n| 捕获组编号 | 数据         |\n|-----------|--------------|\n| 1      \
  \   | 完整价格      |\n| 2         | 货币符号      |\n| 3         | 数字价格      |\n\n让我们探索这三个捕获组的检索。\n\
  \n### JavaScript\n\nAPI 的工作方式如下：\n\n- `regex.exec( str )`\n- `str.match( regex )`\n\
  \n这些方法在匹配`str`时返回`regex`中定义的所有捕获组。\n\n```javascript\nconst regex = /^Price: (([€\\\
  $])(\\d\\d\\.\\d\\d))$/;\nconst str = 'Price: €19.00';\nconst matches = regex.exec(\
  \ str );\n// str.match( regex ); // 效果相同\nconsole.table( matches );\n```\n\n输出结果为：\n\
  \n```\n(index) Value\n0       \"Price: €19.00\"\n1       \"€19.00\"\n2       \"\
  €\"\n3       \"19.00\"\nindex   0\ninput   \"Price: €19.00\"\n```\n\n顺便提一下，如果你还不了解`console.table`，可以查看我关于[console\
  \ API](http://www.zsoltnagy.eu/understanding-the-console-api-in-javascript-7-tips-for-smoother-debugging/)的文章。\n\
  \n### PHP\n\n我们将使用`preg_match_all( $regex, $str, $result )`。PHP 会在`$result`数组中返回所有捕获组。\n\
  \n```php\n$regex = \"/^Price: ((€|\\$)(\\d\\d\\.\\d\\d))$/\";\n$str = \"Price: €19.00\"\
  ;\npreg_match_all($regex, $str, $result);\nprint_r($result);\n```\n\n执行代码，例如在[PHP\
  \ Sandbox](http://sandbox.onlinephpfunctions.com/)中。结果如下：\n\n```\nArray\n(\n[0]\
  \ => Array\n(\n[0] => Price: €19.00\n)\n[1] => Array\n(\n[0] => €19.00\n)\n[2] =>\
  \ Array\n(\n[0] => €\n)\n[3] => Array\n(\n[0] => 19.00\n)\n)\n```\n\n### Python\n\
  \n让我们回忆一下首次用 Python 测试正则表达式时看到的代码，并将正确的`regex`和`test_str`值放入其中。\n\n```python\nimport\
  \ re\nregex = r\"^Price: ((€|\\$)(\\d\\d\\.\\d\\d))$\"\ntest_str = \"Price: €19.00\"\
  \nmatches = re.finditer(regex, test_str)\nfor matchNum, match in enumerate(matches,\
  \ start=1):\n    print (\"Match {matchNum} was found at {start}-{end}: {match}\"\
  \n           .format(matchNum=matchNum, start=match.start(),\n                 \
  \  end=match.end(), match=match.group()))\n    for groupNum in range(0, len(match.groups())):\n\
  \        groupNum = groupNum + 1\n        print (\"Group {groupNum} found at {start}-{end}:\
  \ {group}\"\n               .format(groupNum=groupNum, start=match.start(groupNum),\n\
  \                       end=match.end(groupNum), group=match.group(groupNum)))\n\
  ```\n\n我们将此代码粘贴到[Python shell](https://www.python.org/shell/)中后，结果便可见。\n\n```\n\
  Match 1 was found at 0-13: Price: €19.00\nGroup 1 found at 7-13: €19.00\nGroup 2\
  \ found at 7-8: €\nGroup 3 found at 8-13: 19.00\n```\n\n如你所见，捕获组可以通过`match`对象访问。\n\
  \n是的，这就是最初介绍同一 Python 代码时所承诺的伏笔。最初，相同的代码未能在表达式中找到任何捕获组，但现在你可以看到内部的`for`循环逐个打印出了捕获组。\n\
  \n### Perl 5\n\n我们已经看到可以使用`=~`运算符执行简单匹配。\n\n```perl\nif ( \"Price: €19.00\" =~ /^Price:\
  \ ((€|\\$)(\\d\\d\\.\\d\\d))$/ ) {\n    print \"Match\";\n}\n```\n\n我们已经看到了一些变量，它们为我们提供了匹配的一些上下文，例如：\n\
  \n```perl\nif ( \"Price: €19.00\" =~ /^Price: ((€|\\$)(\\d\\d\\.\\d\\d))$/ ) {\n\
  \    print \"String before the match: \", $`, \"\\n\";\n    print \"String after\
  \ the match:\", $', \"\\n\";\n    print \"Matched string:\", $&, \"\\n\";\n}\n```\n\
  \n类似地，每个捕获组都有以`$1`、`$2`、`$3`等形式定义的变量。\n\n```perl\nif ( \"Price: €19.00\" =~ /^Price:\
  \ ((€|\\$)(\\d\\d\\.\\d\\d))$/ ) {\n    print \"String before the match: \", $`,\
  \ \"\\n\";\n    print \"String after the match:\", $', \"\\n\";\n    print \"Matched\
  \ string:\", $&, \"\\n\";\n    print \"First capture group:\", $1, \"\\n\";\n  \
  \  print \"Second capture group:\", $2, \"\\n\";\n    print \"Third capture group:\"\
  , $3, \"\\n\";\n}\n```\n\n执行结果如下：\n\n```\nString before the match:\nString after\
  \ the match:\nMatched string:Price: €19.00\nFirst capture group: €19.00\nSecond\
  \ capture group: €\nThird capture group:19.00\n```\n\n\n\n"
- '# 在正则表达式中复用捕获子串


  假设我们要提取被任意多个高亮字符包围的价格。以下字符串都应该能够匹配：


  ```

  ****€19.00****

  *-*€19.00*-*

  --€19.00--

  ```


  以下输入则无效：


  ```

  €19.00     // 没有高亮字符

  *€19.00**  // 前后长度不匹配

  **€19.00-- // 字符序列不匹配

  ++€19.00++ // 字符未被接受

  ```


  假设价格范围在 `1.00` 到 `9999.99` 欧元之间，我们从组装正则表达式开始，如表 7-4 所示。


  **表 7-4**

  组装一个匹配价格标签的正则表达式


  | 构建的正则表达式 | 说明 |

  | --- | --- |

  | `/^$/` | 我们要匹配整个字符串，而不仅仅是子串。 |

  | `/^[\*-]+$/` | 我们从任意多个高亮字符开始。 |

  | `/^[\*-]+`€`\.$/` | 我们在表达式中加入欧元符号和转义后的点字符。 |

  | `/^[\*-]+`€`\d{1,4}\.\d{2}$/` | 然后添加数字，确保小数点后始终有两位数字。 |


  现在我们陷入了困境。使用目前学到的构造方法，无法继续组装正则表达式。


  这时，我们需要知道欧元符号之前精确匹配了什么内容。复用之前捕获的子串就派上用场了，如表 7-5 所示。


  **表 7-5**

  使用反向引用匹配价格标签


  | 构建的正则表达式 | 说明 |

  | --- | --- |

  | `/^([\*-]+)`€`\d{1,4}\.\d{2}$/` | 捕获需要重复的子串 |

  | `/^([\*-]+)`€`\d{1,4}\.\d{2}\1$/` | 使用 `\1` 访问并插入捕获组 `1` 中精确匹配的子串 |


  让我们在 Chrome 开发者工具控制台中使用 JavaScript 测试这个正则表达式。


  ```

  /^([\*-]+)€\d{1,4}\.\d{2}\1$/.exec( ''****€19.00****'' )

  > {

  0: "****€19.00****",

  1: "****",

  index: 0,

  input: "****€19.00****"

  }

  ```


  `\1` 被称为*反向引用*。反向引用会重新匹配字符组中已经匹配过的相同字符。


  **示例**：创建一个兼容 PCRE 的正则表达式，用于检测由四个字母组成的回文^(⁵⁰)单词。


  **解决方案：**


  我们需要使用常规的开始和结束锚点，后跟两个任意字符。由于需要捕获这些字符，我们将其放在括号中。然后，通过反向使用顺序，使用反向引用 `\2` 和 `\1` 来交换这些字符的位置。


  ```

  /^(.)(.)\2\1$/

  ```


  在 Perl 6 中，反向引用是通过在捕获组编号前加上 `$` 符号来定义的变量。示例如下：`$0`。


  始终测试你的反向引用。当反向引用不存在时，错误行为会因环境而异。


  ## 捕获组与性能


  不幸的是，括号的语义被重载了。这在性能方面可能很危险。


  当我们学习正则表达式的基础知识时，我们了解到括号的自然语义是覆盖运算符的优先级。但是，请注意以下几点：


  无论是否需要，每组括号都会创建一个捕获组。由于捕获组的开销较大，维护捕获组的额外开销会增加表达式的执行时间，从而影响正则表达式的性能。


  维护捕获组的开销可能很大。在读取字符或进行回溯时，正则表达式引擎必须从活动捕获组中添加或删除字符。


  为了避免性能损失，可以定义不创建捕获组的括号。这些括号仅用于覆盖优先级，如表 7-6 所示。


  **表 7-6**

  非捕获括号


  | 语言 | 非捕获括号 |

  | --- | --- |

  | EMACS | `/(?:exp)/` |

  | ERE, PCRE | `/(?:exp)/` |

  | Perl 6 | `/ [exp] /` |

  | VIM | `/\%(exp)/` |


  在大多数编程语言和 EMACS 中，起始括号后的 `?:` 将组定义为非捕获组。在 Perl 6 中，早期语言的字符集语法被用于此目的。这是因为 Perl 6
  是一种新语言，并且时间证明，相比字符集，我们更常需要非捕获括号。


  VIM 提出了一些奇怪的符号，事后看来我觉得这些符号非常不合逻辑。但在这些符号被发明的时候，它们一定是非常创新的。


  ## 捕获组的扩展


  一些基于 PCRE 的语言提供了更多功能。


  Ruby 和 Perl 支持相对于当前捕获组的反向引用。语法因实现而异。Ruby 中的一个示例如 `((.)\k<-1>)+`，其中反向引用是 `\k<-1>`，表示该反向引用之前的捕获组。


  在某些语言中，*前向引用*使得引用一个未来的捕获组成为可能。示例如下：`(\3\2(.)(.))*`。


  捕获组编号的一个问题是可维护性。即使在提取之后，变量 `$1`、`$2` 等也不具有足够的语义。Python 通过在正则表达式中允许使用名称标签来解决这个问题。示例如下：`(?P<name>value)`。在
  ES2018（2018 年版的 JavaScript）中，命名捕获组也以 `(?<name>value)` 的形式出现。


  ## 总结


  在本章中，你学习了创建捕获组的基础知识，并了解了捕获组编号的规则。你还学会了在四种不同的语言中检索捕获的字符串。


  由于捕获组的维护开销可能较大，你了解了定义非捕获括号以避免性能损失的方法。


  脚注 1 2 3 4


