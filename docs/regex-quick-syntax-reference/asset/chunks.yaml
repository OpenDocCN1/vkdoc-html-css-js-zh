    \ [13](#470763_1_En_3_Chapter.xhtml#Fn13_source) [14](#470763_1_En_3_Chapter.xhtml#Fn14_source)\
    \ [15](#470763_1_En_3_Chapter.xhtml#Fn15_source) [16](#470763_1_En_3_Chapter.xhtml#Fn16_source)\
