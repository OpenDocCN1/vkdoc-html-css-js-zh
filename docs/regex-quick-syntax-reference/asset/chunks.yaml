    # 扩展模式


    PCRE 及部分 ERE 语言支持扩展模式。其语法如下：


    ```

    /(?x) 正则       # 注释行 1

    主体       # 注释行 2

    处于       # 注释行 3

    扩展       # 注释行 4

    模式       # 注释行 5

    /

    ```


    在扩展模式下，空白字符不匹配任何内容，仅用于格式化。井号（`#`）表示注释的开始，持续到行尾。


    `(?x)` 应位于正则表达式的开头。你不能在表达式中间才开启扩展模式。实际上，`(?x)` 是一个正则标志或修饰符。在某些方言或正则库中，除了使用 `/a/i`，你也可以使用
    `/(i)a/` 这种结构。将正则修饰符置于前方的优势在于可读性。当表达式较长时，阅读者更希望在阅读表达式本身之前先了解其修饰符。


    我强烈推荐开启扩展模式。回顾以下表达式：


    ```

    /^(?=.*[A-Z].*[A-Z])(?=.*[!@#$&*])(?=.*[0-9].*[0-9])(?=.*[a-z].*[a-z]).{8,}$/

    ```


    以下是同一表达式的扩展模式等效形式：


    ```

    /(?x)

    ^                  # 起始锚点

    (?=.*[A-Z].*[A-Z]) # 至少两个大写字母

    (?=.*[!@#$&*])     # 且至少一个特殊字符

    (?=.*[0-9].*[0-9]) # 且至少两个数字

    (?=.*[a-z].*[a-z]) # 且至少两个小写字母

    .{8,}              # 字符串长度至少为 8 个字符

    $                  # 结束锚点

    /

    ```


    信不信由你，这与前面的单行表达式是相同的。


    遗憾的是，并非所有方言都支持扩展模式。例如，在 EMACS 和 VIM 中就没有。在 JavaScript 中也不支持扩展模式，但你可以使用 XRegExp
    库^((53)) 来开启扩展模式。


    ```

    const regex = new XRegExp( ''                                   \

    ^                   # 起始锚点                             \

    (?=.*[A-Z].*[A-Z])  # 至少两个大写字母                     \

    (?=.*[!@#$&*])      # 且至少一个特殊字符                    \

    (?=.*\\d.*\\d)      # 且至少两个数字                       \

    (?=.*[a-z].*[a-z])  # 且至少两个小写字母                    \

    .{8,}               # 字符串长度至少为 8 个字符             \

    $                   # 结束锚点                             \

    '');

    ```


    使用 `XRegExp` 构造函数时，不要忘记转义反斜杠。为了说明这一点，我使用了 `\\d` 而不是 `[0-9]`。


    即使没有扩展模式，如果你能跳出常规思维，也可以让你的代码更易于维护。例如，使用 JavaScript 的 `RegExp` 构造函数并结合 JavaScript
    语法，你可以编写出易于阅读的代码。


    ```

    const regex = new RegExp(

    ''^''                  + // 起始锚点

    ''(?=.*[A-Z].*[A-Z])'' + // 至少两个大写字母

    ''(?=.*[!@#$&*])''     + // 且至少一个特殊字符

    ''(?=.*\\d.*\\d)''     + // 且至少两个数字

    ''(?=.*[a-z].*[a-z])''   + // 且至少两个小写字母

    ''.{8,}''               + // 字符串长度至少为 8 个字符

    ''$''                    // 结束锚点

    );

    ```


    # 正则子程序


    少数正则方言提供了子程序。子程序类似于编程语言中的函数。如果你不将整个表达式写成一个整体，而是将表达式的某些部分抽象为子程序，那么你的正则表达式将更具可读性。你的表达式也会更加
    DRY（不要重复自己）。毕竟，在同一个表达式中复制粘贴同一个子程序三四次，并不易于维护。


    子程序在表达式中的任何位置被调用时都会执行。如果子程序匹配成功，则正则表达式的执行继续正常进行。如果子程序匹配失败，则会发生回溯。


    ## PCRE 子程序


    在 PCRE 的情况下，请查阅你的正则宿主语言的文档。并非所有 PCRE 语言都支持子程序。例如，在 JavaScript 中，我建议使用 XRegExp
    库来增强正则表达式的表达能力。


    ```

    var time = XRegExp.build(''(?x)^ {{hours}} ({{minutes}}) $'', {

    hours: XRegExp.build(''{{h12}} : | {{h24}}'', {

    h12: /1[0-2]|0?[1-9]/,

    h24: /2[0-3]|[01][0-9]/

    }, ''x''),

    minutes: /^[0-5][0-9]$/

    });

    ```


    `{{hours}}`、`{{minutes}}`、`{{h12}}` 和 `{{h24}}` 这些占位符会在各自的位置插入子表达式。


    XRegExp 的子程序看起来有点复杂。通用的 PCRE 子程序语法则相对易读一些。


    ```

    (?(DEFINE)

    (?

    # 子程序 1 的主体

    )

    (?

    # 子程序 2 的主体

    )

    )

    ```


    表达式中的 `DEFINE` 部分从不匹配任何内容。它用于声明你的子程序。


    在表达式中使用 `(?&SUBROUTINE1)` 来匹配它。


    让我们看一个示例，匹配一个货币符号和一个可能包含整数部分和小数部分的价格。我们假设小数部分最多可以有两位数字。


    ```

    /(?x) (?&货币) (?&价格)

    (?(DEFINE)

    (? [\$\€] )

    (?    \d++ \.?+ \d{0,2} )

    )

    /

    ```


    ## Perl 6 子程序


    Perl 6 的子程序语法比 PCRE 语法更简洁，但其工作方式与 PCRE 版本大致相同。


    你可以通过以下方式声明 Perl 6 子程序：


    ```

    /

    :my regex 子程序 1 {

    # 子程序 1 的主体

    }

    :my regex 子程序 2 {

    # 子程序 2 的主体

    }

    /

    ```


    你可以在 Perl 6 表达式中使用 `<子程序 1>` 来调用子程序。


    让我们重写你在"PCRE 子程序"部分看到的同一个货币示例。


    ```

    /(?x) (?&货币) (?&价格)

    (?(DEFINE)

    (?  [\$\€] )

    (?     \d++ \.?+ \d**0..2 )

    )

    /

    ```


    ## 扩展模式、子程序和抽象化


    *抽象化* 是指识别可重用代码并将其提取到一处。我们可以创建子程序来抽象正则表达式中重复的功能片段，并且可以根据需要多次重用它们。子程序对于编写可维护的 DRY
    正则表达式至关重要。


    借助扩展模式的优势，你就能告别冗长且难以维护的正则谜题。你甚至可以清晰无比地编写长达数千字符的正则表达式。想象一下，在阅读本书之前，你可能会连一个 20 字符的表达式都读起来费劲。


    # 命名捕获组


    在 PCRE 中，我们使用 `\1`、`\2` 等来提取捕获组的值。捕获组的编号基于其左括号从左到右出现的顺序。


    现在我们正竭尽全力使正则表达式易于维护。试想一下，如果有人决定在正则表达式中添加一对括号，会发生什么？你是否遇到过这种情况？如果是，你就知道这有多不方便了。一个更改可能会影响表达式中所有捕获组的引用。这违背了可维护性的原则，因为表达式内部括号的位置与处理捕获组值的正则表达式周边代码之间存在*紧耦合*。


    本节的首要目标是固定捕获组的名称。次要目标是让这些名称具有语义含义。


    如果你的方言支持命名捕获，请使用它们以提高可维护性。


    ## EMACS 命名捕获组


    EMACS 使得固定捕获组的编号成为可能：`\(?1: .* \)`。这个名称没有语义，因为我们仍然必须依赖数字。

    '
- fmt: '### PCRE Named Capture Groups


    In PCRE, we can use proper names for capture groups: `(?<VARIABLE_NAME> .* )`.
    In the languages allowing named capture groups, it is possible to use these names
    in the code surrounding the regular expression to extract these capture groups.


    For instance, in Python, we have learned that `match.group( 1 )` gives us the
    value of the first capture group. Instead of the number, we can also pass the
    name of a named capture group. `match.group( ''VARIABLE_NAME'' )` extracts the
    capture group with the name `VARIABLE_NAME`.


    In JavaScript, ES2018 comes with named capture groups. Let’s solve the example
    we saw in the Capture Groups section, where we matched the price and the currency
    symbol of a label. This time, our solution will be maintainable because we will
    use named capture groups.


    **Exercise 1**: Suppose we would like to retrieve the currency, the numeric price
    value, and the full price with a currency symbol in a string of the following
    format:


    ```

    Price: €19.00

    ```


    The regular expression matching this string is as follows:


    ```

    /^Price: [€\$]\d\d\.\d\d$/

    ```


    We have to escape the dollar sign as a currency symbol, because `$` is a meta
    character denoting an end-of-string or end-of-line anchor. We also have to escape
    the dot because it is a meta character denoting one arbitrary character.


    After adding some parentheses to capture the values we want, the regular expression
    looks like this:


    ```

    /^Price: (([€\$])(\d\d\.\d\d))$/

    ```


    We have three capture groups to access the data, as shown in Table [9-1](#470763_1_En_9_Chapter.xhtml#Tab1).


    | Capture Group Number | Data |

    | --- | --- |

    | 1 | Full price |

    | 2 | Currency symbol |

    | 3 | Numeric price |


    From a maintainability point of view, using the indices `1`, `2`, and `3` to refer
    to these capture groups is not a brilliant idea.


    Imagine, for instance, that requirements change such that `Price` may be multilingual,
    and you have to capture the price text in the language it appears in.


    ```

    /^(Price|Preis): (([€\$])(\d\d\.\d\d))$/

    ```


    Bingo. Capture groups `1`, `2`, and `3` became `2`, `3`, and `4`, respectively.
    You have to rewrite all your code processing these values.


    This is why getting fed up with numbered capture groups is a healthy feeling.
    Let’s use capture groups to increase the maintainability of the code. Our capture
    groups will look like Table [9-2](#470763_1_En_9_Chapter.xhtml#Tab2).


    | Capture Group Number | Data |

    | --- | --- |

    | `<fullPrice>` | Full price |

    | `<currency>` | Currency symbol |

    | `<numPrice>` | Numeric price |


    We will use the syntax `(?<name>content)` to match `content` in the capture group
    name.


    ```

    /^Price: (?(?[€\$])(?\d\d\.\d\d))$/

    ```


    To create a named capture group, all we need to do is write a question mark after
    the start of the parentheses and then put the capture group name inside greater-than
    and less-than symbols.


    And we are done. Let’s execute the solution.


    ```

    console.table(

    /^Price: (?(?[€\$])(?\d\d\.\d\d))$/

    .exec(''Price: $15.99'')

    .groups

    )

    > (index)   Value

    currency  "$"

    numPrice  "15.99"

    fullPrice "$15.99"

    ```


    Although you can still refer to the captured groups with their numeric indices
    `1`, `2`, and `3`, you can also use their label names if you access the `groups`
    property.


    Last, but not least, it is possible to formulate a backreference on the capture
    group name using the format `\k<groupName>`.


    Named capture groups make your expressions more maintainable. That’s their purpose.


    ### Perl 6 Named Capture Groups


    The syntax is `$<VARIABLE_NAME>=( .* )`. You can retrieve its value using `$<VARIABLE_NAME>`
    in your code.


    ## Case Study: XRegExp Library for JavaScript


    XRegExp is a powerful library that makes JavaScript regular expressions more expressive
    and more maintainable. If you need regular expressions on a regular basis, no
    pun intended, then I highly recommend including XRegExp in your application.


    You can read the documentation of the library on `xregexp.com`, and you can clone
    it from GitHub.^([^(54)](#fn54)) You can also install XRegExp from `npm`, using
    the command `npm i xregexp`.


    Let’s do the latter and install XRegExp using `npm` locally in an empty folder.


    Now that the installation is done, we can open our text editor, in my case `atom.io`;
    create an empty `.js` file in the root, and require the XRegExp library.


    ```

    let XRegExp = require(''xregexp'');

    ```


    Let’s test-drive the library by creating a simple expression.


    ```

    let regex = XRegExp(''(?i)^[ab]*$'');

    XRegExp.exec( ''aAbB'', regex );

    ```


    In this example, you can see an XRegExp feature, leading modifiers. This feature
    makes modifiers easier to read because you don’t have to scroll down to the end
    of a regular expression to identify the modifier flags.


    When executing the program, you can see that the uppercase letters as well as
    the lowercase letters were matched.


    Let’s continue talking about maintainability. A necessary condition for creating
    maintainable regexes is the ability to add some spacing around the expression.
    We can turn off the evaluation of whitespace characters with the `x` flag. This
    means we can format tokens of our expressions in any way we like, without changing
    its meaning. As you can see, the start anchor, the main loop, and the end anchor
    are now in different lines, and after execution, the pattern is still matched
    against the string correctly.


    ```

    let XRegExp = require(''xregexp'');

    let regex = XRegExp(`(?ix)

    ^

    [ab]*

    $

    `);

    let result = XRegExp.exec( ''aAbB'', regex );

    console.log( result );

    ```


    We have whitespaces turned off, but we can do more. We can insert some comments
    to make the expression more semantic. Just think about it. Some expressions are
    long, so why not explain them token by token?


    ```

    let XRegExp = require(''xregexp'');

    let regex = XRegExp(`(?ix)

    ^      # start anchor

    [ab]*  # any number of a, b, A, B characters

    $      # end anchor

    `);

    let result = XRegExp.exec( ''aAbB'', regex );

    console.log( result );

    ```


    After the comments have been added, the solution is still working.


    Now that we are aware of the extended format, let’s increase the maintainability
    of the expression even further by adding some subpatterns.


    To add a subpattern, we have to use the `build` method of XRegExp and specify
    an object with the subpattern names as keys, and the values to be inserted as
    values.


    ```

    let XRegExp = require(''xregexp'');

    let regex = XRegExp.build(`(?ix)

    ^             # start anchor

    {{charLoop}}  # any number of a, b, A, B characters

    $             # end anchor

    `, {

    charLoop: /[ab]*/

    } );

    console.log( XRegExp.exec( ''abAB'', regex ) );

    ```


    You can see the regex was built correctly.


    In fact, if you use the source property of the regex, you can see the assembled
    regular expression.


    ```

    console.log( regex.source() )

    ```


    These subpatterns work like subroutines, and they are useful in general when it
    comes to creating larger regular expressions.


    This was a short introduction to the XRegExp library. You have seen the maintainability
    enhancements of regexes, and there are some more features that are available to
    you. Interestingly, many of the ES2018 updates were based on features already
    available in XRegExp, so XRegExp was an innovator in this sense. The Unicode escapes,
    the `dotall` flag, and the named capture groups were all available in the XRegExp
    library, which was one reason why we used them in this chapter.'
