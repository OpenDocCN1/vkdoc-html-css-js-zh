    \ [23](#470763_1_En_3_Chapter.xhtml#Fn23_source)\n\n# Visualizing Regex Execution\
    \ Using Finite State Machines\n\nA regular expression is converted into code executed\
    \ in a virtual machine. This virtual machine runs on the virtual machine of the\
    \ host language or editor.\n\nAbstract models are helpful for understanding how\
    \ regular expressions are executed. Although these models often neglect optimization\
    \ techniques implemented by regex engines, they still give you valuable information\
    \ on how regexes work.\n\n## Regular Expressions Are Finite State Machines\n\n\
    The easiest way to visualize a regular expression is with a finite state machine.^([^(25)](#fn25))\
    \ A finite state machine (FSM) is a directed acyclic graph^([^(26)](#fn26)) with\
    \ a dedicated initial state and a dedicated end state. The FSM representation\
    \ of a regular expression is as follows:\n\n- The edges (arrows) represent characters\
    \ we read from the input stream.\n- The nodes represent an internal state of the\
    \ regular expression.\n\nFor instance, the regular expression `/ab/` can be represented\
    \ with the finite state machine shown in Figure 4-1.\n\n![../images/470763_1_En_4_Chapter/470763_1_En_4_Fig1_HTML.jpg](images/470763_1_En_4_Chapter/470763_1_En_4_Fig1_HTML.jpg)\n\
    \n**Figure 4-1** `/ab/`\n\n`/ab/` first matches the character `a` and then the\
    \ character `b`. Imagine we are reading the text `aabc` and want to figure out\
    \ if this string matches the regular expression `/ab/`.\n\nLet’s place a token\
    \ on the start node.\n\n1. After reading the first `a` character, we move the\
    \ token through the arrow denoted by the `a` state. The token is now in the intermediate\
    \ state.\n2. After reading the second `a`, there is no arrow starting in the intermediate\
    \ state; therefore, we move back to the start state. In this state, we try reading\
    \ `a` again. As there is an `a` arrow originating from the start state, we move\
    \ to the intermediate state again.\n3. After reading the `b` character, we move\
    \ our token from the intermediate state to the match state. Given that we have\
    \ reached the match state, the string *matches* the regular expression.\n\nNotice\
    \ the match has been determined without reading the last character in the sequence.\n\
    \nEach character in the regular expression is an instruction executed in sequence.\
    \ These instructions are matching tasks. Our goal is to reach the match node in\
    \ any way possible. From the perspective of determining a match, it does not matter\
    \ how many times we reach the match state, as long as we reach it at least once.\n\
    \n## Backtracking\n\nIn some cases, we are stuck in an intermediate node of the\
    \ finite state automaton. To avoid getting stuck, we are entitled to continue\
    \ execution by using *backtracking*. Backtracking happens once you fail to reach\
    \ the match node, and you cannot move anywhere from a node.\n\n*When we backtrack\
    \ in a finite state automaton, we move backward on the edges until we reach a\
    \ node that has forward edges that we haven’t tried yet.* If you have ever read\
    \ a Fighting Fantasy gamebook, where you explore the Deathtrap Dungeon, for instance,\
    \ you might remember how you backtracked from one path of the maze to another.\
    \ The same thing happens in a regular expression.\n\nAs you move forward, you\
    \ mark the edges you have visited. As you move back, you only try edges that you\
    \ haven’t marked before.\n\nWhile moving backward on an edge, we also move back\
    \ our caret pointing at the upcoming character of the input string, *unreading*\
    \ the character on the edge.\n\nOne special form of backtracking is when we move\
    \ back to the starting node. In this case, we have another move in our arsenal:\
    \ moving a character forward in the input string and attempting to start a new\
    \ match.\n\nFor instance, when matching the string `\"abaa\"` with the regex `/aa/`,\
    \ we first read the character `a`. Then we backtrack because we cannot move forward\
    \ after the first character. After backtracking, we move the caret forward, leaving\
    \ the string `\"baa\"` to match against `/aa/`. As we cannot match the character\
    \ `b` against `a`, we move the caret forward again. We now have the string `\"\
    aa\"` to match against `/aa/`. This matching will obviously succeed without any\
    \ further backtracking.\n\nTo understand backtracking more deeply, let’s explore\
    \ the differences between deterministic and nondeterministic regular expression\
    \ modeling."
