- fmt: '# Formulating an Expression


    A regular expression is written inside a starting slash and an ending slash character:
    `/re/`.


    As you saw in Chapter [1](#470763_1_En_1_Chapter.xhtml), this expression matches
    strings containing `re`.


    Some programming languages allow you or require you to use a different notation.
    For instance, in JavaScript, you may use the following form to define the regular
    expression `/re/`:


    ```

    > const regex = new RegExp( ''re'' );

    > regex

    /re/

    ```


    In PHP and Python, you have to use strings or raw strings to pass a regular expression
    to a function. Here’s a Python example:


    ```

    import re

    regex = re.compile(r"xy+")

    ```


    Unless dealing with a specific example in a specific language, I will stick to
    the `/re/` notation in this book.


    ## Literal Characters and Meta Characters


    A regex *literal character* matches itself. The expression `/a/` matches any string
    that contains the `a` character.


    For instance, the expression `/a/` matches the string `"andrea"` because both
    the first and last letters of the string are `a`. Matching often comes with simplifications
    in execution. During execution, the regex engine locates only the first character
    of the string, which is an `a`. Given the character matches the expression, you
    are done; there is no need to read the rest of the string.


    The expression `/a/` does not match the string `"ABCDEA"` because after reading
    the whole string, we did not find a single `a` character.


    All lowercase and uppercase alphabetical characters and all numerical characters
    are available as literal characters. Depending on the regex dialect, some other
    characters can also be used to match themselves. For instance, `!`, `%`, `=`,
    and `_` are available in most dialects as literal characters.


    Characters such as `.`, `*`, `^`, `$`, `[`, and `]` are not literal characters
    in almost any dialect. They are *meta characters*. A meta character is responsible
    for denoting an operation similarly to a keyword in a programming language. Table
    [2-1](#470763_1_En_2_Chapter.xhtml#Tab1) describes meta characters.


    Table 2-1


    Meta Characters


    | Meta Character | Semantics |

    | --- | --- |

    | `.` | Arbitrary character |

    | `*` | Iteration: match any number of times |

    | `^` | Two semantics: (1) negation, (2) anchor matching the start of the string
    or line |

    | `$` | Anchor matching the end of the string or line |

    | `[]` | Character sets |


    In PCRE, the language family of programming languages, even more characters are
    reserved, as shown in Table [2-2](#470763_1_En_2_Chapter.xhtml#Tab2).


    Table 2-2


    PCRE Meta Characters


    | PCRE Meta Character | Semantics |

    | --- | --- |

    | `&#124;` | Alternative execution (or) |

    | `?` | Optional parts in the expression |

    | `+` | Match at least once |

    | `{}` | Specify a range for the number of times an expression has to match the
    string |

    | `()` | Grouping characters (1), or extracting substrings (2) |


    In VIM and EMACS, you have to escape the characters `|`, `?`, `{`, `}`, `(`, and
    `)` to use them as operators.


    If you want to use any of the reserved characters, you have to escape them with
    a backslash.


    The treatment of whitespaces is complicated. When searching for patterns in free
    text, it is rarely convenient to enter the exact whitespace you are looking for.
    Unfortunately in most dialects, a space matches a space, the `\n` character matches
    a newline, and the `\t` character matches a tab. The problem with this approach
    is that the exact whitespace characters become important in the search expression.


    This approach reminds me of a weird front-end experience of mine. I created a
    user interface to help users parse CSV files. In the user interface, there was
    a field for entering the CSV separator character. Once an administrator called
    me. He showed me that he pasted a tab whitespace character in a text field so
    that his CSV separator became a tab. Unfortunately, the input field got trimmed,
    and the tab character could not be saved because the input field had to contain
    at least one whitespace character.


    Whitespace characters are often a mess.


    You will learn later that you can add flags to the end of a regular expression.
    These flags may influence how you treat whitespace characters.


    In some cases, the input string is split into lines, and regular expressions are
    expected to match each line. In other cases, input strings may contain newline
    characters, and these newlines can be matched by the regular expression. This
    implies that some flags may change the behavior of matching newline characters.


    The Perl 6 dialect handles whitespaces completely differently than any other dialect.
    Perl 6 ignores all whitespace characters in a regular expression, making whitespaces
    less of a riddle than in other dialects. You will see later that ignoring whitespaces
    comes with the benefit that you can format regular expressions in any way you
    want. The following are equivalent when whitespaces don’t matter:


    ```

    /first second third/

    /

    first

    second

    third

    /

    ```


    A whitespace character in a regular expression matches any sequence of whitespaces
    in the tested string.


    The `x`, or extended mode, flag of some PCRE regular expressions turns the same
    formatting mode on. Note that this flag is not available in all PCRE languages.


    ```

    /(?x)

    first

    second

    third

    /

    ```


    As a summary, be careful with whitespace anomalies. Avoid using whitespaces in
    regular expressions. You will soon find out how to handle whitespaces properly,
    once I introduce named character classes.


    ## Arbitrary Character Class


    In some cases, you will look for an arbitrary character. Creating an enumeration
    of all possible characters does not really make sense.


    In all regular expression dialects, the `.` symbol denotes one arbitrary character.
    For instance, `/..e/` denotes a three-letter sequence ending with `e`.


    Unfortunately, in different dialects, the `.` character is defined differently
    because it may or may not include the newline character.


    *   Perl 6 follows the command-line regex format defined by BRE and ERE. In other
    words, a `.` represents any character, including the newline.

    *   In all other languages represented by the PCRE language family, a `.` character
    represents any character except the newline. Therefore, matching the newline character
    has to be explicitly specified. EMACS and VIM follow this approach.


    For maintainability reasons, it is advised to explicitly specify the type of character
    you are interested in matching. You will learn how to do this in Chapter [6](#470763_1_En_6_Chapter.xhtml).
    Until then, using `[.\n]` makes sure you include the newline character together
    with the arbitrary character class.


    ## Basic Concatenation


    In all programming languages, the three necessary control elements are *sequencing*,
    *selection*, and *iteration*. Concatenation is responsible for sequencing.


    You have already used concatenation in several places. First you used it in Chapter
    [1](#470763_1_En_1_Chapter.xhtml) when you defined the `/re/` regular expression.
    You read `/re/` as follows: match the character `r` and *then* match the character
    `e`.


    When constructing regular expressions, you can concatenate any regular expression
    sequences.


    ## Alternative Execution


    Now that you know how to do sequencing, let’s move on to selection. Let’s recall
    the example from Chapter [1](#470763_1_En_1_Chapter.xhtml), shown here:


    ```

    BRE:              or operator is not supported

    EMACS,VIM:        /0\|1\|2/

    ERE,PCRE,Perl 6:  /0|1|2/

    ```


    You have already learned that the `|` or `\|` operator specifies alternative paths.
    `/0|1|2/` matches a character that is a `0` *or* a `1` *or* a `2`.


    Here are some examples:


    *   `/java|php|perl/` matches strings containing `java` *or* `php` *or* `perl`.

    *   `/....|a|the/` matches any string that is at least four characters long *or*
    contains the character `a` *or* contains the substring `the`.


    The pipe operator has the lowest precedence out of all the operators in regular
    expressions.'
