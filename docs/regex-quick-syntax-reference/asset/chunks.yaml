- fmt: '# Fixed-Range Matching


    Suppose we want to match the `a` character at least twice and at most `5` times.
    Different dialects support this in different ways, as shown in Table [5-3](#470763_1_En_5_Chapter.xhtml#Tab3).


    Table 5-3: Matching the character `a` at least twice, and at most 5 times


    | Dialect | Notation |

    | --- | --- |

    | `BRE`, `EMACS` | `/a\{2,5\}/` |

    | `VIM` | `/a\{2,5}/` |

    | `ERE`, `PCRE` | `/a{2,5}/` |

    | `Perl 6` | `/ a ** 2..5 /` |


    In most programming languages, we use the `PCRE` dialect: `/a{2,5}/`. Focus on
    your own use cases.


    The finite state machine form looks verbose because we have to expand every option.
    Matching two to five times means we have to construct a route for matching twice,
    three times, four times, and five times, as shown in Figure [5-7](#470763_1_En_5_Chapter.xhtml#Fig7).


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig7_HTML.jpg](images/470763_1_En_5_Chapter/470763_1_En_5_Fig7_HTML.jpg)


    Figure 5-7: `/a{2,5}/`


    In practice, most regex engines represent this repeat modifier as an `*`(asterisk).
    An asterisk is interpreted as *any number of times* match and use internal counters
    to meet the required conditions.


    Note that it is possible to leave out the maximum value of the range. To match
    at least two `a` characters, you have to use the notation shown in Table [5-4](#470763_1_En_5_Chapter.xhtml#Tab4).


    Table 5-4: Matching at least two `a` characters


    | Dialect | Notation |

    | --- | --- |

    | `BRE`, `EMACS` | `/a\{2,\}/` |

    | `VIM` | `/a\{2,}/` |

    | `ERE`, `PCRE` | `/a{2,}/` |

    | `Perl 6` | `/ a ** 2..* /` |


    Notice the maximum amount is simply left out in all dialects except `Perl 6`,
    where an `*` denotes the arbitrary value.


    The finite state machine form of `/a{2,}/` is a lot less complex than the FSM
    belonging to the bounded repeat modifier. In fact, this machine is equivalent
    to the FSM belonging to the expression `/aaa*/`, as shown in Figure [5-8](#470763_1_En_5_Chapter.xhtml#Fig8).


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig8_HTML.jpg](images/470763_1_En_5_Chapter/470763_1_En_5_Fig8_HTML.jpg)


    Figure 5-8: `/a{2,}/`


    In theory, the upper limit is unbounded. In practice, this upper limit depends
    on the implementation of the regex virtual machine. The upper limit restriction
    may be a low value like `256`. In other languages, this value is `32767`, which
    is one less than the maximum value of a 2-byte-long unsigned integer. Be careful
    when using regular expressions with big upper limits.


    Also note, in some languages like `Python`, the real maximum limit is infinity,
    but you may easily get an overflow error if this limit is too big.


    ## Loop Exactly `n` Times


    Let’s examine the shorthand for the expression `/aa/` in all dialects, as shown
    in Table [5-5](#470763_1_En_5_Chapter.xhtml#Tab5).


    Table 5-5: Shorthand for `/aa/`


    | Dialect | Notation |

    | --- | --- |

    | `BRE`, `EMACS` | `/a\{2\}/` |

    | `VIM` | `/a\{2}/` |

    | `ERE`, `PCRE` | `/a{2}/` |

    | `Perl 6` | `/ a ** 2 /` |


    This means we loop through the `a` character exactly twice. When there is a complex
    expression instead of `a` or the number of repetitions is a lot more than `2`,
    the shorthand actually becomes shorter than the original version of `/aa/`.


    The finite state machine belonging to this loop is straightforward, as shown in
    Figure [5-9](#470763_1_En_5_Chapter.xhtml#Fig9).


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig9_HTML.jpg](images/470763_1_En_5_Chapter/470763_1_En_5_Fig9_HTML.jpg)


    Figure 5-9: `/aa/`


    As you can see, the state machine matches the FSM of `/aa/`.


    ## Greedy Repeat Modifiers


    You have already seen the meta characters for greedy repeat modifiers in Table
    [5-1](#470763_1_En_5_Chapter.xhtml#Tab1).


    All these repeat modifiers are *greedy* by default. This means the repeat modifiers
    consume as many characters from the matched string as possible and backtrack character
    by character.


    As an extreme example, suppose we are matching the string `''The lost list''`
    using the regular expression `/^.*list$/`.


    As the `*` repeat modifier is greedy, `.*` consumes the whole string first, just
    to conclude that we are at the end of the string and we have yet to match the
    character `l`. In case of a failure, we backtrack.


    Repeat modifiers consume characters in a greedy way, and they backtrack as little
    as possible. Therefore, we backtrack just one character. After the backtracking,
    `.*` matches `The lost lis`, and the next character to be consumed is `t`. As
    `t` is not equal to `l`, we backtrack.


    Now `.*` becomes `The lost li`, and we are trying to match `s` against `l`. This
    doesn’t work, so we backtrack.


    Now `.*` becomes `The lost l`, and we are trying to match `i` against `l`. This
    doesn’t work, so we backtrack.


    Now `.*` becomes `The lost` , and we are trying to match `l` against `l`. This
    succeeds, so we continue matching the rest of the string with the rest of the
    regex pattern. As we succeed matching the whole string and we reach the end, we
    exit the regex matching with success.


    In this example, we just backtracked four times. But imagine if we had megabytes
    of text; one `.*` construct may read the whole file before evaluating the rest
    of the regular expression. Therefore, proceed with `.*`-like constructs with caution.
    There is almost always a more optimal way to describe a pattern.


    Backtracking is introduced because our state machine is nondeterministic. In `/^.*list$/`,
    in each step, as long as we are in the `.*` loop and an `l` character is coming,
    we have to decide whether we are matching a `.` character or we are matching an
    `l`. This is the nondeterminism that causes backtracking.


    One way to combat backtracking is to make the nondeterministic state machine deterministic.
    This may require an exponential number of steps with respect to the size of the
    input. Only a few regex virtual machines do this because the effort rarely pays
    off.


    Another solution is to use loops that match and backtrack according to a different
    strategy.'
