    | `/^([\*-]+)`€`\d{1,4}\.\d{2}$/` | Capture the substring that has to be repeated
    |

    | `/^([\*-]+)`€`\d{1,4}\.\d{2}\1$/` | Access and insert the exact substring matched
    in capture group `1` using `\1` |


    Let’s test our regular expression in JavaScript using the Chrome Developer Tools
    console.


    ```

    /^([\*-]+)€\d{1,4}\.\d{2}\1$/.exec( ''****€19.00****'' )

    > {

    0: "****€19.00****",

    1: "****",

    index: 0,

    input: "****€19.00****"

    }

    ```


    `\1` is called a *backreference*. A backreference rematches the same characters
    already matched in a character group.


    **Example**: Create a PCRE-compatible regular expression that detects four-letter
    palindrome^([^(50)](#fn50)) words.


    **Solution:**


    We need to use the usual start and end anchors, followed by two arbitrary characters.
    As we need to capture these characters, we put them in parentheses. Then we need
    to swap these characters by including them backward, using the backreferences
    `\2` and `\1`.


    ```

    /^(.)(.)\2\1$/

    ```


    In Perl 6, backreferences are variables defined by writing a `$` sign in front
    of the capture group number. Here’s an example: `$0`.


    Always test your backreferences. Whenever they don’t exist, the erroneous behavior
    differs from environment to environment.


    ## Capture Groups and Performance


    Unfortunately, the semantics of parentheses are overloaded. This can be dangerous
    when it comes to performance.


    When we learn the basics of regular expressions, we learn the natural semantics
    of parentheses, which is to override the precedence of operators. However, be
    aware of the following:


    Every set of parentheses creates a capture group, regardless of whether we need
    them. As capture groups are expensive, the performance of our regular expression
    is affected by adding the overhead of maintaining the capture groups to the execution
    time of the expression.


    The overhead of maintaining the capture groups can be expensive. The regex engine
    has to add and remove characters from active capture groups while reading a character
    or backtracking.


    To avoid the performance penalty, it is possible to define parentheses that do
    not create capture groups. These parentheses are only there for overriding precedence,
    as shown in Table [7-6](#470763_1_En_7_Chapter.xhtml#Tab6).


    Table 7-6


    Non-capturing parentheses


    | Language | No-Capture Parentheses |

    | --- | --- |

    | EMACS | `/(?:exp)/` |

    | ERE,PCRE | `/(?:exp)/` |

    | Perl 6 | `/ [exp] /` |

    | VIM | `/\%(exp)/` |


    In most programming languages and in EMACS, `?:` after the start parentheses defines
    the group to be noncapturing. In Perl 6, the character set syntax of earlier languages
    is used for this purpose. This is because Perl 6 is a new language, and time has
    proven that we need noncapturing parentheses more often than character sets.


    VIM came up with some weird notation that I find highly illogical in hindsight.
    Back when the notation was invented, it must have been innovative.


    ## Extensions to Capture Groups


    Some PCRE-based languages offer even more features.


    Ruby and Perl support backreferences relative to the capture group we are in.
    The syntax differs from implementation to implementation. An example in Ruby looks
    like `((.)\k<-1>)+`, where the backreference is `\k<-1>`, indicating the capture
    group just before the backreference.


    In some languages, *forward references* make it possible to reference to a future
    capture group. Here’s an example: `(\3\2(.)(.))*`.


    One problem with capture group numbering is maintainability. Even after the extraction,
    the variables `$1`, `$2`, and so on, are not too semantic. Python addresses this
    problem by allowing a name tag in a regular expression. Here’s an example: `(?P<name>value)`.
    In ES2018, the 2018 version of JavaScript, named capture groups also appear in
    the form `(?<name>value)`.


    ## Summary


    In this chapter, you learned the basics of creating capture groups and learned
    the rules of capture group numbering. You also retrieved captured strings in four
    different languages.


    As capture groups may be expensive to maintain, you looked at a way to define
    noncapturing parentheses to avoid the performance penalty.


    Footnotes [1](#470763_1_En_7_Chapter.xhtml#Fn1_source)   [2](#470763_1_En_7_Chapter.xhtml#Fn2_source)
      [3](#470763_1_En_7_Chapter.xhtml#Fn3_source)   [4](#470763_1_En_7_Chapter.xhtml#Fn4_source)


    # 8. Lookahead and Lookbehind


    Anchors such as `^`, `$`, and the `\b` boundary character are zero-length assertions
    that filter matches based on special conditions. These conditions restrict the
    position of the first or last character of the match. We will now do something
    similar, but this time, we will restrict the position of some characters in the
    expression with respect to other characters in the string. *Lookahead* and *Lookbehind*
    are two zero-length assertions that accomplish this.


    For the sake of simplicity, we will restrict this chapter to PCRE-compatible languages
    and Perl 6.'
  trans: '

    # 在正则表达式中复用捕获子串


    假设我们要提取被任意多个高亮字符包围的价格。以下字符串都应该能够匹配：


    ```

    ****€19.00****

    *-*€19.00*-*

    --€19.00--

    ```


    以下输入则无效：


    ```

    €19.00     // 没有高亮字符

    *€19.00**  // 前后长度不匹配

    **€19.00-- // 字符序列不匹配

    ++€19.00++ // 字符未被接受

    ```


    假设价格范围在 `1.00` 到 `9999.99` 欧元之间，我们从组装正则表达式开始，如表 7-4 所示。


    **表 7-4**

    组装一个匹配价格标签的正则表达式


    | 构建的正则表达式 | 说明 |

    | --- | --- |

    | `/^$/` | 我们要匹配整个字符串，而不仅仅是子串。 |

    | `/^[\*-]+$/` | 我们从任意多个高亮字符开始。 |

    | `/^[\*-]+`€`\.$/` | 我们在表达式中加入欧元符号和转义后的点字符。 |

    | `/^[\*-]+`€`\d{1,4}\.\d{2}$/` | 然后添加数字，确保小数点后始终有两位数字。 |


    现在我们陷入了困境。使用目前学到的构造方法，无法继续组装正则表达式。


    这时，我们需要知道欧元符号之前精确匹配了什么内容。复用之前捕获的子串就派上用场了，如表 7-5 所示。


    **表 7-5**

    使用反向引用匹配价格标签


    | 构建的正则表达式 | 说明 |

    | --- | --- |

    | `/^([\*-]+)`€`\d{1,4}\.\d{2}$/` | 捕获需要重复的子串 |

    | `/^([\*-]+)`€`\d{1,4}\.\d{2}\1$/` | 使用 `\1` 访问并插入捕获组 `1` 中精确匹配的子串 |


    让我们在 Chrome 开发者工具控制台中使用 JavaScript 测试这个正则表达式。


    ```

    /^([\*-]+)€\d{1,4}\.\d{2}\1$/.exec( ''****€19.00****'' )

    > {

    0: "****€19.00****",

    1: "****",

    index: 0,

    input: "****€19.00****"

    }

    ```


    `\1` 被称为*反向引用*。反向引用会重新匹配字符组中已经匹配过的相同字符。


    **示例**：创建一个兼容 PCRE 的正则表达式，用于检测由四个字母组成的回文^(⁵⁰)单词。


    **解决方案：**


    我们需要使用常规的开始和结束锚点，后跟两个任意字符。由于需要捕获这些字符，我们将其放在括号中。然后，通过反向使用顺序，使用反向引用 `\2` 和 `\1`
    来交换这些字符的位置。


    ```

    /^(.)(.)\2\1$/

    ```


    在 Perl 6 中，反向引用是通过在捕获组编号前加上 `$` 符号来定义的变量。示例如下：`$0`。


    始终测试你的反向引用。当反向引用不存在时，错误行为会因环境而异。


    ## 捕获组与性能


    不幸的是，括号的语义被重载了。这在性能方面可能很危险。


    当我们学习正则表达式的基础知识时，我们了解到括号的自然语义是覆盖运算符的优先级。但是，请注意以下几点：


    无论是否需要，每组括号都会创建一个捕获组。由于捕获组的开销较大，维护捕获组的额外开销会增加表达式的执行时间，从而影响正则表达式的性能。


    维护捕获组的开销可能很大。在读取字符或进行回溯时，正则表达式引擎必须从活动捕获组中添加或删除字符。


    为了避免性能损失，可以定义不创建捕获组的括号。这些括号仅用于覆盖优先级，如表 7-6 所示。


    **表 7-6**

    非捕获括号


    | 语言 | 非捕获括号 |

    | --- | --- |

    | EMACS | `/(?:exp)/` |

    | ERE, PCRE | `/(?:exp)/` |

    | Perl 6 | `/ [exp] /` |

    | VIM | `/\%(exp)/` |


    在大多数编程语言和 EMACS 中，起始括号后的 `?:` 将组定义为非捕获组。在 Perl 6 中，早期语言的字符集语法被用于此目的。这是因为 Perl
    6 是一种新语言，并且时间证明，相比字符集，我们更常需要非捕获括号。


    VIM 提出了一些奇怪的符号，事后看来我觉得这些符号非常不合逻辑。但在这些符号被发明的时候，它们一定是非常创新的。


    ## 捕获组的扩展


    一些基于 PCRE 的语言提供了更多功能。


    Ruby 和 Perl 支持相对于当前捕获组的反向引用。语法因实现而异。Ruby 中的一个示例如 `((.)\k<-1>)+`，其中反向引用是 `\k<-1>`，表示该反向引用之前的捕获组。


    在某些语言中，*前向引用*使得引用一个未来的捕获组成为可能。示例如下：`(\3\2(.)(.))*`。


    捕获组编号的一个问题是可维护性。即使在提取之后，变量 `$1`、`$2` 等也不具有足够的语义。Python 通过在正则表达式中允许使用名称标签来解决这个问题。示例如下：`(?P<name>value)`。在
    ES2018（2018 年版的 JavaScript）中，命名捕获组也以 `(?<name>value)` 的形式出现。


    ## 总结


    在本章中，你学习了创建捕获组的基础知识，并了解了捕获组编号的规则。你还学会了在四种不同的语言中检索捕获的字符串。


    由于捕获组的维护开销可能较大，你了解了定义非捕获括号以避免性能损失的方法。


    脚注 1 2 3 4


    # 8. 前瞻与后顾


    像 `^`、`$` 和 `\b` 边界字符这样的锚点，是基于特殊条件过滤匹配结果的零宽断言。这些条件限制了匹配结果中首字符或末字符的位置。我们现在要做类似的事情，但这次，我们将限制表达式中某些字符相对于字符串中其他字符的位置。*前瞻*和*后顾*是两种能够实现这一点的零宽断言。


    为简单起见，本章将仅限于兼容 PCRE 的语言和 Perl 6。

    '
- fmt: '# Lookahead


    A *lookahead* matches characters but reverts the actions upon success. There are
    two types of lookaheads: *positive* and *negative*.


    We use a positive lookahead if our match has to be followed by a certain pattern.


    We use a *negative lookahead* if our match *should not be followed by* a certain
    pattern. Table [8-1](#470763_1_En_8_Chapter.xhtml#Tab1) shows the syntax.


    **Table 8-1** Syntax for Lookahead


    | Lookahead Type | PCRE Syntax | Perl 6 Syntax |

    | --- | --- | --- |

    | Positive | `(?=pattern)` | `<?before pattern>` |

    | Negative | `(?!pattern)` | `<!before pattern>` |

    | Word boundary | `\b` | `>>` |


    The syntax may not be too pleasing to the eye, especially in the case of the negative
    assertion. However, my experience is that you will get used to it if you use it.
    Until then, keep your cheat sheet with you.


    Lookaheads do not capture substrings, similarly to `(?:pattern)`.


    As the lookahead may contain any literal or meta character, capture groups defined
    inside a lookahead will capture the matched string. In fact, this is the only
    way to capture the value of the lookahead.


    The lookahead `(?=.c)` in `/a(?=.c)b/` matches the string `abc` as follows:


    1. First we read `a`.

    2. Then we enter the lookahead, memorizing the index 1 pointing at character `b`
    of `abc`.

    3. We match the character `b` as an arbitrary character inside the lookahead.

    4. We match the character `c` in the lookahead.

    5. As the lookahead succeeds, we exit from the lookahead construct with success
    and revert to position 1 in the string.

    6. We match character `b` in the string.

    7. The regex matching succeeds, and the substring `ab` starting at position 0
    is returned. Word boundaries work like a positive lookahead.


    **Example 1**: Using the PCRE dialect, match `list`, `lost`, or `lust` in a string
    such that the matched string should end a nonwhitespace character sequence.


    **Solution:**


    We can simply use a word boundary anchor at the end of the matched sequence.


    ```

    /l[iou]st\b/

    ```


    **Example 2**: Suppose the following championship classification is given in the
    form of a JavaScript template literal:


    ```

    const classification = `

    1st D.Okada (5) 97Pts

    2nd J.Newtown (27) 78Pts

    `;

    ```


    Create a regular expression that matches all scores. A score is a non-negative
    integer in front of the text `Pt`.


    **Solution:**


    `/\d+/` matches positive integers in the form of sequences of digits.


    As we need all matches, we have to apply the `g` modifier to the expression: `/\d+/g`.
    Let’s list all the numbers from the expression.


    ```

    > let regex = /\d+/g;

    > let result = null;

    > while ( result = regex.exec( classification ) ) {

    console.log( result[0] );

    }

    ```


    Let’s apply a lookahead to match the scores only. The lookahead syntax is `(?=Pt)`.


    ```

    > regex = /\d+(?=Pt)/g;

    > while ( result = regex.exec( classification ) ) {

    console.log( result[0] );

    }

    ```


    # Lookbehind


    A *lookbehind* is the mirror image of a lookahead. It walks backward from the
    regular expression and checks whether the specified pattern matches the string
    *before* the lookbehind. If the lookbehind match succeeds, the match is reverted.
    The syntax is shown in Table [8-2](#470763_1_En_8_Chapter.xhtml#Tab2).


    **Table 8-2** Lookbehind Syntax


    | Lookbehind Type | PCRE Syntax | Perl 6 Syntax |

    | --- | --- | --- |

    | Positive | `(?<=pattern)` | `<?after pattern>` |

    | Negative | `(?<!pattern)` | `<!after pattern>` |

    | Word boundary | `\b` | `<<` |


    Opposed to lookahead, lookbehind constructs are often restricted. Restrictions
    differ from implementation to implementation.


    Most dialects only allow patterns of fixed lengths and exclude repeat modifiers,
    as well as character sets. This is not universally true because Java, for instance,
    allows fixed-range repeat modifiers.


    **Example 3**: Using PCRE, match `list`, `lost`, `lust` inside nonwhitespace character
    sequences in case they start the nonwhitespace sequence.


    **Solution:**


    This time the word boundary anchor is placed before the `l` of the matched strings.


    ```

    PCRE:    /\bl[iou]st/

    ```


    # Summary


    A *lookahead* matches characters looking forward but reverts all actions upon
    success.


    A *lookbehind* matches characters looking backward and reverts all actions upon
    success.


    A word boundary anchor may work as a lookahead or as a lookbehind indicating the
    start or end of a nonwhitespace character sequence.


    # 9. Maintaining Regular Expressions


    There is a common fear in the industry of writing and maintaining regular expressions.
    This is because as an expression becomes bigger, reading it gets harder.


    This reminds me of the word *Fluessigkeitsliebhaberei* in my gym. It means the
    act of loving fluids. In one word. Complete nonsense. German words are long. Sometimes
    very long.


    *Rindfleischetikettierungsueberwachungsaufgabenuebertragungsgesetz* is another
    example. Most readers are used to reading short words. Then comes a long word
    like this out of the blue, and we can throw all our speed-reading experience out
    of the window.


    Software developers are used to reading code. But code normally contains a lot
    of whitespaces. The following PCRE expression is just like a very long German
    word:


    ```

    /^(?=.*[A-Z].*[A-Z])(?=.*[!@#$&*])(?=.*[0-9].*[0-9])(?=.*[a-z].*[a-z]).{8,}$/

    ```


    It is by far not the worst regex I have seen, but it takes time for me to interpret
    it. What if we could add some whitespaces around it?


    Only Perl 6 allows whitespaces for formatting by default. Unfortunately, whitespaces
    in other dialects are literal characters that match themselves.


    Not everything is lost, though. In this chapter, we will turn seemingly nonsense
    regular expressions that are impossible to read into maintainable code. We will
    investigate the possible solutions for creating maintainable regular expressions.'
