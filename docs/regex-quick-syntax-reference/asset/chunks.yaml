- fmt: '# Reusing Captured Substrings Within a Regex


    Suppose we are interested in extracting a price in between any positive number
    of highlighter characters. The following strings should all be matches:


    ```

    ****€19.00****

    *-*€19.00*-*

    --€19.00--

    ```


    The following inputs are invalid:


    ```

    €19.00     // no highlighter

    *€19.00**  // length before and after don''t match

    **€19.00-- // character sequences don''t match

    ++€19.00++ // not accepted characters

    ```


    Let’s start with the assembly of the regular expression assuming that the price
    ranges between `1.00` and `9999.99` euros, as shown in Table [7-4](#470763_1_En_7_Chapter.xhtml#Tab4).


    **Table 7-4**

    Assembling a regular expression matching a price label


    | Constructed Regex | Explanation |

    | --- | --- |

    | `/^$/` | We are matching for the whole string, not just substrings. |

    | `/^[\*-]+$/` | We start with any number of highlighter characters. |

    | `/^[\*-]+`€`\.$/` | We place the euro sign and the escaped dot character in
    the expression. |

    | `/^[\*-]+`€`\d{1,4}\.\d{2}$/` | Then we add the digits, making sure that there
    are always two digits after the decimal point. |


    We are now stuck. Continuing with the assembly of the regular expression is not
    possible with the constructs you have learned so far.


    This is where we need to know what was exactly matched before the euro sign. This
    is when reusing a previously captured substring becomes useful, as shown in Table
    [7-5](#470763_1_En_7_Chapter.xhtml#Tab5).


    **Table 7-5**

    Using a backreference to match a price label


    | Constructed Regex | Explanation |

    | --- | --- |

    | `/^([\*-]+)`€`\d{1,4}\.\d{2}$/` | Capture the substring that has to be repeated
    |

    | `/^([\*-]+)`€`\d{1,4}\.\d{2}\1$/` | Access and insert the exact substring matched
    in capture group `1` using `\1` |


    Let’s test our regular expression in JavaScript using the Chrome Developer Tools
    console.


    ```

    /^([\*-]+)€\d{1,4}\.\d{2}\1$/.exec( ''****€19.00****'' )

    > {

    0: "****€19.00****",

    1: "****",

    index: 0,

    input: "****€19.00****"

    }

    ```


    `\1` is called a *backreference*. A backreference rematches the same characters
    already matched in a character group.


    **Example**: Create a PCRE-compatible regular expression that detects four-letter
    palindrome^([^(50)](#fn50)) words.


    **Solution:**


    We need to use the usual start and end anchors, followed by two arbitrary characters.
    As we need to capture these characters, we put them in parentheses. Then we need
    to swap these characters by including them backward, using the backreferences
    `\2` and `\1`.


    ```

    /^(.)(.)\2\1$/

    ```


    In Perl 6, backreferences are variables defined by writing a `$` sign in front
    of the capture group number. Here’s an example: `$0`.


    Always test your backreferences. Whenever they don’t exist, the erroneous behavior
    differs from environment to environment.


    ## Capture Groups and Performance


    Unfortunately, the semantics of parentheses are overloaded. This can be dangerous
    when it comes to performance.


    When we learn the basics of regular expressions, we learn the natural semantics
    of parentheses, which is to override the precedence of operators. However, be
    aware of the following:


    Every set of parentheses creates a capture group, regardless of whether we need
    them. As capture groups are expensive, the performance of our regular expression
    is affected by adding the overhead of maintaining the capture groups to the execution
    time of the expression.


    The overhead of maintaining the capture groups can be expensive. The regex engine
    has to add and remove characters from active capture groups while reading a character
    or backtracking.


    To avoid the performance penalty, it is possible to define parentheses that do
    not create capture groups. These parentheses are only there for overriding precedence,
    as shown in Table [7-6](#470763_1_En_7_Chapter.xhtml#Tab6).


    **Table 7-6**

    Non-capturing parentheses


    | Language | No-Capture Parentheses |

    | --- | --- |

    | EMACS | `/(?:exp)/` |

    | ERE,PCRE | `/(?:exp)/` |

    | Perl 6 | `/ [exp] /` |

    | VIM | `/\%(exp)/` |


    In most programming languages and in EMACS, `?:` after the start parentheses defines
    the group to be noncapturing. In Perl 6, the character set syntax of earlier languages
    is used for this purpose. This is because Perl 6 is a new language, and time has
    proven that we need noncapturing parentheses more often than character sets.


    VIM came up with some weird notation that I find highly illogical in hindsight.
    Back when the notation was invented, it must have been innovative.


    ## Extensions to Capture Groups


    Some PCRE-based languages offer even more features.


    Ruby and Perl support backreferences relative to the capture group we are in.
    The syntax differs from implementation to implementation. An example in Ruby looks
    like `((.)\k<-1>)+`, where the backreference is `\k<-1>`, indicating the capture
    group just before the backreference.


    In some languages, *forward references* make it possible to reference to a future
    capture group. Here’s an example: `(\3\2(.)(.))*`.


    One problem with capture group numbering is maintainability. Even after the extraction,
    the variables `$1`, `$2`, and so on, are not too semantic. Python addresses this
    problem by allowing a name tag in a regular expression. Here’s an example: `(?P<name>value)`.
    In ES2018, the 2018 version of JavaScript, named capture groups also appear in
    the form `(?<name>value)`.


    ## Summary


    In this chapter, you learned the basics of creating capture groups and learned
    the rules of capture group numbering. You also retrieved captured strings in four
    different languages.


    As capture groups may be expensive to maintain, you looked at a way to define
    noncapturing parentheses to avoid the performance penalty.


    Footnotes [1](#470763_1_En_7_Chapter.xhtml#Fn1_source) [2](#470763_1_En_7_Chapter.xhtml#Fn2_source)
    [3](#470763_1_En_7_Chapter.xhtml#Fn3_source) [4](#470763_1_En_7_Chapter.xhtml#Fn4_source)


    # 8. Lookahead and Lookbehind


    Anchors such as `^`, `$`, and the `\b` boundary character are zero-length assertions
    that filter matches based on special conditions. These conditions restrict the
    position of the first or last character of the match. We will now do something
    similar, but this time, we will restrict the position of some characters in the
    expression with respect to other characters in the string. *Lookahead* and *Lookbehind*
    are two zero-length assertions that accomplish this.


    For the sake of simplicity, we will restrict this chapter to PCRE-compatible languages
    and Perl 6.'
