  trans: "\n# 处理 URL 的查询字符串\n\n**练习 2**：创建一个正则表达式，将 URL 的查询字符串转换为一个键值对对象，使得如下形式：\n\
    \n```\n?key1=value1&key2=value2&...&keyN=valueN\n```\n\n变成：\n\n```\n{\nkey1: 'value1',\n\
    key2: 'value2',\n...\nkeyN: 'valueN'\n}\n```\n\n你可以假设文本以问号开头。键的长度均为正数。值的长度可为非负数。等号始终存在。\n\
    \n**解决方案：**\n\n首先，我们需要读取一个问号或一个与号，后跟任意长度的、非等号字符列表。我们需要捕获与号之后的字符。\n\n```\n/?&+/g\n\
    ```\n\n接着匹配一个等号，后跟任意数量的非与号字符。我们需要捕获这些字符。\n\n```\n/?&+=([^&]*)/g\n```\n\n每个键最终位于捕获组\
    \ 1 中，每个值最终位于捕获组 2 中。由于表达式是全局的，我们将逐一匹配键值对。\n\n现在，我们将使用 JavaScript 创建结果对象。\n\n\
    ```javascript\nlet queryParameters = {};\nlet queryString = '?key1=value1&key2=value2&key3=&key4=value4';\n\
    let regex = /?&+=([^&]*)/g;\nlet result = null;\nwhile ( result = regex.exec(\
    \ queryString ) ) {\n    queryParameters[ result[1] ] = result[2];\n}\nconsole.log(\
    \ queryParameters );\n```\n\n## 索引\n\n### A\n\n任意字符\n\n### B\n\n回溯\n\n### C, D,\
    \ E\n\n字符类、字符集、类、连接、从 `[01]` 中排除、表达式范围\n\n### F, G\n\n有限状态机 (FSMs)、`/ab/`、自动生成正则表达式、回溯、基本正则表达式简化、确定性与非确定性、正则表达式建模、成功匹配、可视化正则表达式执行\n\
    \n### H, I\n\nHTML 标签，解析\n\n### J, K\n\nJavaScript 正则表达式、ES6 Unicode 正则表达式、全局匹配、多行匹配、正则修饰符、`RegExp`\
    \ 方法、粘性匹配、字符串方法\n\n### L\n\n字面量字符、前瞻、字符串分数、字符串 `abc`、语法、后顾、字符串语法、使用 `PCRE`\n\n\
    ### M, N\n\n维护、正则表达式、扩展模式、具名捕获组、`EMACS`、`PCRE`、`Perl 6`、紧耦合、正则子程序、扩展模式、子程序与抽象、`PCRE`\
    \ 子程序、`Perl 6` 子程序、递归与循环引用、`XRegExp`、元字符、修饰符\n\n### O\n\n优化、字符类、确定性模型、限制非确定性执行以最小化回溯、非确定性模型、占有性重复修饰符、重构重复字符类循环、使用原子组\n\
    \n### P\n\nPerl 兼容正则表达式 (`PCRE`)、执行环境、编程语言：`C#`、`C++`、`Golang`、`Java`、`Perl 5`、`PHP`、`Python`、`R`、`Ruby`\n\
    \n### Q\n\n`URL` 的查询字符串、查询字符串\n\n### R\n\n正则表达式语法 101、构建表达式、备选执行、锚定起始与结束、任意字符类、连接、字面量与元字符、修饰符、运算符优先级与括号、正则表达式、遇到的挫折、命令式、重要性、JavaScript、语言家族、搜索模式、重复修饰符、回溯、分支、固定范围匹配、贪婪、懒惰循环、恰好\
    \ `n` 次、循环、匹配任意次数、匹配至少一个字符、匹配至多一次、占有性\n\n### S, T, U, V, W, X, Y, Z\n\n简单正则表达式\
    \ (`SRE`)、子字符串提取、捕获组、扩展与性能、`Perl 6`、捕获子字符串的检索、数据、JavaScript、`Perl 5`、`PHP`、`Python`、在正则表达式内重用捕获的子字符串、脚注\
    \ 1、2、3、4、5、6、7\n"
