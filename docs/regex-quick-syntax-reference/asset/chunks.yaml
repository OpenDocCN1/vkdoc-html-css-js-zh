  raw: '## Processing the Query String of a URL


    **Exercise 2**: Create a regex that transforms the query string of a URL into
    an object of key-value pairs such that


    ```

    ?key1=value1&key2=value2&...&keyN=valueN

    ```


    becomes the following:


    ```

    {

    key1: ''value1'',

    key2: ''value2'',

    ...

    keyN: ''valueN''

    }

    ```


    You can assume the text starts with a question mark.


    The lengths of the keys are all positive. The lengths of the values are non-negative.
    The equation sign is always present.


    **Solution:**


    First we have to read a question mark or an ampersand, followed by an arbitrary
    list of characters of positive length that are not equation signs. We have to
    capture the characters after the ampersand.


    ```

    /[?&]([^=])+/g

    ```


    Then we match an equation sign, followed by any number of characters that are
    not ampersands. We have to capture these characters.


    ```

    /[?&]([^=])+=([^&]*)/g

    ```


    Each key ends up in capture group 1, and each value ends up in capture group 2\.
    As the expression is global, we will match the key-value pairs one by one.


    We will now create the result object using JavaScript.


    ```

    let queryParameters = {};

    let queryString = ''?key1=value1&key2=value2&key3=&key4=value4'';

    let regex = /[?&]([^=]+)+=([^&]*)/g;

    let result = null;

    while ( result = regex.exec( queryString ) ) {

    queryParameters[ result[1] ] = result[2];

    }

    console.log( queryParameters );

    ```


