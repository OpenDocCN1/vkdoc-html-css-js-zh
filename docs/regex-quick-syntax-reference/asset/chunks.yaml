    # 5. Repeat Modifiers


    In Chapter [1](#470763_1_En_1_Chapter.xhtml), I explained that regular expressions
    are imperative. Imperative languages come with control structures. When developing
    software using a programming language, we use the following control structures:


    *   *Branching*: In most programming languages, we use `if` statements and switches.
    In regular expressions, we branch off using the `|` metasyntax character or using
    character sets. An `|` structure vaguely corresponds to an `if-else` structure,
    and a character set vaguely corresponds to a `switch` statement. An example of
    character sets is `[ab]`. Read it like `a|b`. In other words, choose either `a`
    or `b`.


    *   *Loops*: In most programming languages, we use loops such as the `for` loop
    or the `while` loop. *Repeat modifiers* are similar structures to loops in regular
    expressions.


    Table [5-1](#470763_1_En_5_Chapter.xhtml#Tab1) describes the repeat modifiers
    that are available to use.


    Table 5-1


    Repeat Modifiers


    | Repeat Modifier (PCRE) | Description |

    | --- | --- |

    | `+` | Match at least once |

    | `?` | Match at most once |

    | `*` | Match any number of times |

    | `{min,max}` | Match at least `min` times, and at most `max` times |

    | `{n}` | Match exactly `n` times |


    Table [5-1](#470763_1_En_5_Chapter.xhtml#Tab1) shows the PCRE syntax only. There
    are some differences in other dialects. We will tackle those differences in the
    description of each repeat modifier.'
  trans: '

    # 成功的匹配比失败的匹配更廉价


    你在前几节中已经看到，正则表达式成功匹配的速度往往比返回失败要快。这是因为失败意味着我们必须尝试所有可能的执行路径。


    由于成功比失败更廉价，在设计正则表达式时，请始终为成功制定条件。失败往往会消耗更多资源。


    # 自动生成正则表达式 FSM


    将正则表达式可视化有助于你理解其工作原理以及如何进行简化。在你将正则表达式的执行模型牢记于心之前，可以随身携带一个笔记本，为你遇到的每个正则表达式构建一个有限状态机。如果你想节省时间，也可以使用一些在线服务。


    [`http://ivanzuzak.info/noam/webapps/fsm_simulator/`](http://ivanzuzak.info/noam/webapps/fsm_simulator/)
    模拟了正则表达式匹配给定字符串的执行过程。它不仅为你创建自动机，还会逐字符展示匹配算法的执行过程。遗憾的是，这个自动机的语言受到限制，因为我们只能拼接字符串、使用*或*运算符，以及使用
    Kleene（`*`）运算符来表示任意次数的重复。我们也可以使用括号进行分组。使用加号代替竖线有点不方便，因为在这个特殊方言中，加号表示可选执行，而不是“至少一次”的重复修饰符。虽然存在这种语义上的困难，但该软件会向你展示三种不同类型的简化自动机，可用于匹配字符串。本书中的结构已经非常接近
    *eNFA* 结构。


    [`http://ivanzuzak.info/noam/webapps/regex_simplifier/`](http://ivanzuzak.info/noam/webapps/regex_simplifier/)
    向你展示了如何简化正则表达式。例如，包含单词 *list*、*lost* 和 *lust* 的表达式可以按如下方式简化：


    ```

    输入: list+lost+lust

    R1   list+lost+lust

    规则 (ab+ac) => a(b+c)

    R2   l(ist+ost)+lust

    规则 (ab+ac) => a(b+c)

    R3   l((ist+ost)+ust)

    规则 (ab+cb) => (a+c)b

    R4   l(((is+os)t)+ust)

    规则 (a) => a

    R5   l((is+os)t+ust)

    规则 (ab+cb) => (a+c)b

    R6   l(((is+os)+us)t)

    规则 (ab+cb) => (a+c)b

    R7   l((((i+o)s)+us)t)

    规则 (a) => a

    R8   l(((i+o)s+us)t)

    规则 (ab+cb) => (a+c)b

    R9   l((((i+o)+u)s)t)

    规则 ab(cd) => abcd

    R10  l(((i+o)+u)s)t

    规则 ab(cd) => abcd

    R11  l((i+o)+u)st

    规则 (a+(b+c)) => a+b+c

    R12  l(i+o+u)st

    ```


    [`https://regexper.com/`](https://regexper.com/) 可以根据 JavaScript 正则表达式构建执行图。例如，在线查看一个复杂
    JavaScript 正则表达式的表示。如果你研究这张图，就可以轻松反向推断出每个元字符的含义。如果这个正则表达式让你感到畏惧，别担心，因为我们大家阅读像这样的表达式时都会遇到困难。


    这种图形化表示与有限状态自动机关系不大，因为在 regexper 的图中，边不消耗字符。在这张图中，节点消耗字符，而边可以以非确定性的方式被选中。还要注意，边可能有条件，例如
    *1..3 次* 或 *1+ 次*。这些边的 FSM 表示可能完全不同。这是为了便于理解而做的简化。


    [`https://www.debuggex.com/`](https://www.debuggex.com/) 使用与 regexper 相同的格式，其界面可以帮助你可视化正则表达式如何逐字符匹配字符串。你可以使用
    JavaScript、Python 和通用的 PCRE 语法。


    [`https://regexr.com/`](https://regexr.com/) 为你提供 JavaScript 以及通用 PCRE 语法的文字说明和速查表。


    [`https://regex101.com/`](https://regex101.com/) 是另一个用于测试正则表达式是否匹配字符串的便捷工具。PCRE
    (PHP)、JavaScript、Python 和 GoLang 都可用。该工具还可以为 C#、Java、Ruby、Rust 和 Perl 5 生成代码。


    [`http://qfsm.sourceforge.net/download.html`](http://qfsm.sourceforge.net/download.html)
    是我最喜欢的有限状态机设计工具。你可以方便地可视化和模拟有限状态机。


    # 总结


    在本章中，你学习了使用有限状态机可视化简单正则表达式执行的基础知识。我们得出结论，状态机的执行可以是确定性的，也可以是非确定性的，这取决于正则表达式被简化的方式。


    确定性执行可以使用确定性有限自动机进行可视化。构建这个自动机的代价较高，但在执行时间上，判断正则表达式是否匹配字符串的代价较低。


    非确定性执行可以使用非确定性有限自动机进行可视化。构建这个自动机的代价较低，但在执行时间上，判断正则表达式是否匹配字符串的代价较高。


    由于在运行时，成功总是比失败更廉价，我们倾向于使用非确定性执行，以避免在优化上浪费过多时间。


    在本章结束时，我们讨论了一些优化正则表达式的简单思路，以及一些用于可视化、测试、简化或调试正则表达式的工具。


    到目前为止，你仅使用了正则表达式的一个有限子集。在下一章中，你将用重复修饰符来扩展这个子集。


    脚注


    # 5. 重复修饰符


    在第 1 章中，我解释过正则表达式是命令式的。命令式语言带有控制结构。在使用编程语言开发软件时，我们使用以下控制结构：


    *   *分支*：在大多数编程语言中，我们使用 `if` 语句和 switch 语句。在正则表达式中，我们使用元语法字符 `|` 或字符集来实现分支。`|`
    结构大致对应于 `if-else` 结构，而字符集大致对应于 `switch` 语句。字符集的一个例子是 `[ab]`。可以将其理解为 `a|b`。换句话说，选择
    `a` 或 `b`。


    *   *循环*：在大多数编程语言中，我们使用诸如 `for` 循环或 `while` 循环这样的结构。*重复修饰符* 类似于正则表达式中的循环结构。


    表 5-1 描述了可供使用的重复修饰符。


    **表 5-1 重复修饰符**


    | 重复修饰符 (PCRE) | 描述 |

    | --- | --- |

    | `+` | 至少匹配一次 |

    | `?` | 最多匹配一次 |

    | `*` | 匹配任意次数 |

    | `{min,max}` | 至少匹配 `min` 次，最多匹配 `max` 次 |

    | `{n}` | 精确匹配 `n` 次 |


    表 5-1 仅展示了 PCRE 语法。在其他方言中存在一些差异。我们将在每个重复修饰符的描述中处理这些差异。

