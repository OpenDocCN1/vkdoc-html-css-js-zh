- fmt: '# Frustrations with Regular Expressions Arise from Lack of Taking Action


    According to many software developers, regular expressions are:


    - Hard to understand

    - Hard to write

    - Hard to modify

    - Hard to test

    - Hard to debug


    As I mentioned in the introduction of this chapter, lack of understanding often
    comes with blame. We tend to blame regular expressions for these five problems.


    To figure out why this blaming exists, let’s discover the journey of a regular
    developer, no pun intended, with regexes. Many of us default to this journey of
    discovery when it comes to playing around with something we don’t know well. With
    regular expressions, the task seems too easy: we just have to create a short expression,
    right? Well, oftentimes, this point of view is very wrong.


    Trial and error oftentimes takes more time than getting the pain handled and getting
    the lack of knowledge cured. Yet, most developers work with trial and error over
    and over again. After all, why bother learning the complex mechanics of regular
    expressions if you could simply copy and paste a small snippet? Learning the ins
    and outs of regular expressions seems to be too hard at first glance anyway.


    Therefore, my mission is to show you that:


    - Learning regular expressions is a lot easier than you thought

    - Knowing regular expressions is fun

    - Knowing regular expressions is beneficial in many areas of your software developer
    career


    You can still easily master regular expressions to the extent that they will do
    exactly what you intended them to do. This mastery comes from understanding the
    right theory and getting a lot of practice.


    ## Regular Expressions Are Imperative


    Regular expressions are widely misunderstood. Whenever you hear that regular expressions
    are *declarative*, run from that tutorial or blog as far as you can. Regexes are
    an imperative language. If you want to understand regexes as declarative, chances
    are you will fail.


    By definition, regexes specify a search pattern. Although this is a true statement,
    it is easy to misinterpret it because you are not specifying a declarative structure.
    In the real world, you specify a sequence of instructions acting like a function
    in an imperative programming language. You use commands and loops, you pass arguments
    to your regex, you may pass arguments around inside your regex, you return a result,
    and you may even cause side effects.


    Learning regular expressions as an imperative language comes with a big advantage.
    If you have dealt with at least one programming language in your life, chances
    are, you know almost everything to understand regular expressions. You are just
    not yet proficient in the regex syntax. As soon as you familiarize yourself with
    this weird language, everything will fall into place.


    ## The Language Family of Regular Expressions


    When I talk about regular expressions, in practice I mean a family of different
    dialects. Similarly to genetics, regular expressions keep evolving, and new mutations
    surface on a regular basis. Although the principles stay the same in most languages,
    every single dialect brings something different.


    Standardization of regular expressions began with *BRE* (Basic Regular Expressions)
    inside the POSIX standard 1003.2. This standard is used in the editors `ed` and
    `sed`, as well as in the `grep` command.


    The first major evolution of regular expressions came with the *ERE* (Extended
    Regular Expressions) syntax. This syntax is used in, for example, `egrep` and
    `notepad++`.


    For completeness, I will also mention the *SRE* (Simple Regular Expressions) dialect,
    which has been deprecated in favor of BRE.


    Some editors such as EMACS and VIM have their own dialects. In the case of VIM,
    the dialect can be customized with flags, and this technique provides even more
    variations. These dialects are built on top of ERE.


    The regular expressions used in most programming languages are based on the *PCRE*
    (Perl Compatible Regular Expressions) dialect. Each programming language has its
    own abbreviations and differences. These programming languages include PHP, JavaScript,
    Java, C#, C++, Python, R, Perl up to version 5, and more.


    To make matters more complex, Perl 6 comes with a completely different set of
    rules for regular expressions. The Perl 6 syntax is often easier to read, but
    in exchange, you have to learn a different language.


    As an example, let’s write a regex for matching strings that contain at least
    one non-numeric character.


    | Dialect | Expression |

    | --- | --- |

    | BRE, ERE, EMACS, VIM, PCRE | `/[^0123456789]/` |

    | Perl 6 | `/<-[0123456789]><-[0123456789]>/` |


    As you can see, in this specific example, all dialects but Perl 6 look identical.
    Without getting lost in the details too much, let’s understand what this expression
    means in BRE, ERE, EMACS, VIM, and PCRE.


    - `[0123456789]` matches one single character from the character set of digits.

    - `^` inside an enumeration negates the character list. This means `[^0123456789]`
    matches any character that’s not a digit.

    - As the regular expression may match any character of the test string, a match
    is determined as soon as you find at least one character in the test string that’s
    not a digit. Therefore, `123.45` matches the regular expression, while `000` does
    not.


    The Perl 6 syntax works in the same way; the syntax is just different.


    Let’s now write a regular expression that matches the `0`, `1`, or `2` character,
    using the `or` operator of regular expressions.


    ```

    BRE:               or operator is not supported

    ERE,PCRE,Perl 6:   /0|1|2/

    EMACS,VIM:         /0\|1\|2/

    ```


    An equivalent BRE expression would be `/[012]/`, using a character set. You will
    study character sets in detail in Chapter [6](#470763_1_En_6_Chapter.xhtml).


    As studying six groups and many different variations would take a long time, I
    highly recommend you stick to one specific dialect and practice your skills focusing
    on the one and only dialect you use in practice. You can come back to study other
    dialects later. When it comes to the PCRE dialect, different languages give you
    different variations. I have personally found it beneficial to build and execute
    regular expressions in multiple programming languages. This way, I had an easier
    time solidifying my regex knowledge from different angles.


    ## Summary


    In this chapter, I defined a regular expression as a finite character sequence
    defining a search pattern. As an example, you saw a test execution of a simple
    JavaScript regular expression in the console. Although the tested regular expression
    was simple, oftentimes people have a hard time constructing and understanding
    regular expressions. This is because regular expressions represent a compact imperative
    language, and therefore, they are often not intuitive to understand. To make matters
    more complicated, regular expressions consist of multiple languages, which means
    that the JavaScript syntax is completely different than the syntax used in Perl
    6.


