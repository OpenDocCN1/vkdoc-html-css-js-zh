    \ C++ compiler. You can use either `onlinegdb.com`^([^(23)](#fn23)) or `cpp.sh`^([^(24)](#fn24)).\n\
    \nLet’s see a simple regex matching:\n\n```cpp\n#include \n#include \nusing namespace\
    \ std;\nint main()\n{\nregex r( \"ab+\" );\ncout << regex_search( \"XabbabX\"\
    , r );\nreturn 0;\n}\n```\n\nWe can define a regular expression using `regex r(\
    \ regexString )`. We can then use the `r` variable in the `regex_search` function\
    \ accepting a string and a regular expression. The return value of `regex_search`\
    \ is `1` if a match was found, `0` otherwise.\n\nIf you are interested in getting\
    \ all matches one by one, you need to use an `sregex_iterator`. This iterator\
    \ is defined over a string and a regular expression, and it emits the matches\
    \ one by one.\n\n```cpp\n#include \n#include \nusing namespace std;\nint main()\n\
    {\nregex r( \"ab+\" );\nstring str = \"XabbabX\";\nsregex_iterator iter(str.begin(),\
    \ str.end(), r),\niter_end;\nsmatch nextMatch;\nfor ( ;iter != iter_end; ++iter\
    \ ) {\ncout << (*iter).str() << \"\\n\";\n}\nreturn 0;\n}\n```\n\nAt each point\
    \ in time, `iter` points at a regex match. `*iter` gives you the contents at the\
    \ location specified by `iter`. You can get the matched token itself via the `str()`\
    \ getter method.\n\nAs you can see, you need to know quite a lot of C++ to interpret\
    \ regular expressions. If you don’t know C++, you can still execute your regular\
    \ expressions using these code snippets. If you do know C++, this code will be\
    \ a piece of cake for you.\n\n## Summary\n\nAlthough this chapter just scratched\
    \ the surface, you can see that in most programming languages, regular expressions\
    \ are easy to execute. Although the exact specifications vary, they are similar\
    \ in nature. I highly recommend playing around with them so that you get a feel\
    \ for how you can execute regexes in languages other than your own programming\
    \ language.\n\nFootnotes [1](#470763_1_En_3_Chapter.xhtml#Fn1_source) [2](#470763_1_En_3_Chapter.xhtml#Fn2_source)\
    \ [3](#470763_1_En_3_Chapter.xhtml#Fn3_source) [4](#470763_1_En_3_Chapter.xhtml#Fn4_source)\
