- fmt: '### Java


    You will now see how to write a simple Java class that can execute some regular
    expression matching.


    If you don’t want to install the Java development environment on your machine,
    you can run Java code using `tio.run`^([(12)](#fn12)) or `compilejava.net`^([(13)](#fn13)).


    Let’s see the source code first:


    - `java.util.regex` contains a `Matcher` and a `Pattern` utility. `Pattern` compiles
    a regular expression, and `Matcher` creates an object to match a pattern with
    a string.

    - You can iterate on the matcher object using its `find` method to locate the
    upcoming target.

    - The details of the match can be accessed through the matcher object. The getter
    functions `group()`, `start()`, and `end()` return the matched string, the start
    index of the match, and the index of the first character after the match, respectively.


    ```

    import java.util.regex.Matcher;

    import java.util.regex.Pattern;

    public class Main {

    public static void main( String args[] ) {

    final String regex = "xy+";

    final String string = "QxyxyyQxyyyQ";

    final Pattern pattern = Pattern.compile(regex);

    final Matcher matcher = pattern.matcher(string);

    while (matcher.find()) {

    System.out.println(

    "Full match: " + matcher.group() + "(" +

    matcher.start() + "," + matcher.end() + ")"

    );

    }

    }

    }

    ```


    The result of the execution is as follows:


    ```

    Full match: xy(1,3)

    Full match: xyy(3,6)

    Full match: xyyy(7,11)

    ```


    ### R


    In the R language, using regular expressions is quite straightforward.


    You can use the `grep` function to filter the list of strings according to the
    regular expression matching it. `value = TRUE` means that you are interested in
    the filtered string values. `FALSE` means you are interested in the indices of
    the returned values.


    ```

    grep("ab+", strings, value = TRUE)

    grep("^ab+", strings, value = TRUE)

    grep("ab+", strings, value = FALSE)

    grep("^ab+", strings, value = FALSE)

    ```


    Let’s create a couple of strings.


    ```

    (strings <- c("XabbbbX", "abb", "aaa", "a", "Abbb", "XabX"))

    ```


    The returned values are as follows:


    ```

    [1] "XabbbbX" "abb" "XabX"

    [1] "abb"

    [1] 1 2 6

    [1] 2

    ```


    The function `regexpr` gives more information about the matches, as shown here:


    ```

    regexpr("ab+", strings)

    [1] 2 1 -1 -1 -1 2

    attr(,"match.length")

    [1] 5 3 -1 -1 -1 2

    ```


    The first line contains the indices of the first matched character in each string.


    You could also use `regmatches` to display the matched substrings. First you have
    to save the matches in a constant and then use this constant as the second argument
    of the `regmatches` function.


    ```

    matches <- regexpr("ab+", strings)

    regmatches( strings, matches )

    ```


    The return value is as follows:


    ```

    [1] "abbbb" "abb" "ab"

    ```


    For more information, consult the R manual.^([(14)](#fn14))


    ### C#


    The generated C# code of `regex101.com`^([(15)](#fn15)) executes smoothly and
    shows how easy it is to use regular expressions in C#.


    `System.Text.RegularExpressions` gives you regex support.


    Similarly to Java, you have to create a class and a static `Main` function as
    the entry point of the application.


    In the `Main` function, you have to define a pattern and a string. Regex101 defined
    these in the variables `pattern` and `input`, respectively. `Regex.Matches` enumerates
    all matches for you one by one. Each match is stored in an object of type `Match`.
    A `Match` object has a `Value` and an `Index` field.


    ```

    using System;

    using System.Text.RegularExpressions;

    public class Example

    {

    public static void Main()

    {

    string pattern = @"ab+";

    string input = @"ababb";

    foreach (Match m in Regex.Matches(input, pattern))

    {

    Console.WriteLine("''{0}'' found at index {1}.", m.Value, m.Index);

    }

    }

    }

    ```


    After executing this code in `dotnetfiddle.net`^([(16)](#fn16)), for example,
    the following text is written to the console:


    ```

    ''xy'' found at index 0.

    ''xyy'' found at index 2.

    ```


    ### Ruby


    Let’s test-drive the basics of Ruby regular expressions in an online Ruby console
    such as `repl.it`^([(17)](#fn17)).


    ```

    > /ab+/ =~ ''XabbabX''

    => 1

    ```


    Regex matching is done using the `=~` operator. The return value of a regex matching
    is the first character of the match. When there is no match, `nil` is returned.


    ```

    > /ab+/ =~ ''XX''

    => nil

    ```


    You can also use the `match` method of regular expressions. The return value of
    a match is a `MatchData` object containing the first match.


    ```

    > /ab+/.match( ''XabbabX'' )

    => #<MatchData "abb">

    ```


    You can get the matched string by querying `$&`.


    ```

    > $&

    => "abb"

    ```


    Let’s execute the match once more and access some more data on the matched result.


    ```

    > result = /ab+/.match( ''XabbabX'' )

    => #<MatchData "abb">

    > result[0]

    => "abb"

    > result.pre_match

    => "X"

    > result.post_match

    => "abX"

    ```


    If you are interested in an array of all matches, you can use the `scan` method
    of strings.


    ```

    > ''XabbabX''.scan( /ab+/ )

    => ["abb", "ab"]

    ```


    Similarly to the C# code, the Ruby code generated by `regex101.com`^([(18)](#fn18))
    is also straightforward to interpret.


    - `re` contains the regular expression, while `str` is the string you attempt
    to match.

    - By using the `str.scan` method, you get an array. You can iterate on the array
    and print all matches.


    ```

    re = /xy+/

    str = ''xyxxyyy''

    # Print the match result

    str.scan(re) do |match|

    puts match.to_s

    end

    ```


    Check out the Ruby Regular Expression documentation^([(19)](#fn19)) if you are
    interested in learning more about Ruby regexes.


    ### Golang


    Use the Go Playground^([(20)](#fn20)) to execute Golang code.


    Let’s generate some regex tester code using `regex101.com`^([(21)](#fn21)).


    ```

    package main

    import (

    "regexp"

    "fmt"

    )

    func main() {

    var re = regexp.MustCompile(`ab+`)

    var str = `ababb`

    for i, match := range re.FindAllString(str, -1) {

    fmt.Println(match, "found at index", i)

    }

    }

    ```


    In the code, we created the regular expression `ab+` and the string `ababb`.


    The regex method `FindAllStrings` finds all substrings matching the regular expression.
    We can then print out the matched substring as well as its index.


    We can use some other Golang features to match regular expressions.


    ```

    package main

    import (

    "regexp"

    "fmt"

    )

    func main() {

    var re = regexp.MustCompile(`ab+`)

    var str = `ababb`

    // re.MatchString returns a boolean indicating if there is a match

    fmt.Println( re.MatchString(str) )

    // re.FindString returns a string containing the first match

    fmt.Println( re.FindString(str) )

    // re.FindAllString collects all matches in an array

    // Important: FindAllString is written in singular

    fmt.Println( re.FindAllString(str, -1) )

    }

    ```


    The Golang Regexp Documentation^([(22)](#fn22)) contains more information on the
    `regexp` package.'
