  trans: "\n# 前瞻断言\n\n*前瞻断言*会匹配字符，但匹配成功后会将操作回退。前瞻断言分为两种类型：*肯定型*和*否定型*。\n\n当我们的匹配项**必须紧跟在**某个特定模式之后时，我们使用肯定型前瞻断言。\n\
    \n当我们的匹配项**不应紧跟**某个特定模式时，我们使用*否定型前瞻断言*。表 8-1 展示了其语法。\n\n**表 8-1** 前瞻断言语法\n\n|\
    \ 前瞻断言类型 | PCRE 语法 | Perl 6 语法 |\n| --- | --- | --- |\n| 肯定型 | `(?=pattern)` |\
    \ `<?before pattern>` |\n| 否定型 | `(?!pattern)` | `<!before pattern>` |\n| 单词边界\
    \ | `\\b` | `>>` |\n\n这些语法可能不太美观，尤其是在否定断言的情况下。不过，依我的经验来看，只要多用用就会习惯的。在此之前，请随身携带你的速查手册。\n\
    \n与 `(?:pattern)` 类似，前瞻断言不会捕获子字符串。\n\n由于前瞻断言可以包含任何字面量或元字符，因此在前瞻断言内部定义的捕获组将会捕获匹配到的字符串。事实上，这是捕获前瞻断言值的唯一方法。\n\
    \n`/a(?=.c)b/` 中的前瞻断言 `(?=.c)` 会按以下方式匹配字符串 `abc`：\n\n1.  首先读取 `a`。\n2.  然后进入前瞻断言，记下索引\
    \ 1（指向 `abc` 中的字符 `b`）。\n3.  在前瞻断言内部，我们匹配了任意字符 `b`。\n4.  在前瞻断言内部，我们匹配了字符 `c`。\n\
    5.  由于前瞻断言成功，我们成功退出该结构，并回退到字符串中的位置 1。\n6.  我们匹配字符串中的字符 `b`。\n7.  正则表达式匹配成功，返回从位置\
    \ 0 开始的子字符串 `ab`。单词边界的作用类似于肯定型前瞻断言。\n\n**示例 1**：使用 PCRE 方言，在字符串中匹配 `list`、`lost`\
    \ 或 `lust`，要求匹配的字符串必须结束一个非空白字符序列。\n\n**解决方案：**\n\n我们只需在匹配序列的末尾使用一个单词边界锚点即可。\n\n\
    ```\n/l[iou]st\\b/\n```\n\n**示例 2**：假设以下锦标赛分类数据以 JavaScript 模板字面量的形式给出：\n\n```\n\
    const classification = `\n1st D.Okada (5) 97Pts\n2nd J.Newtown (27) 78Pts\n`;\n\
    ```\n\n创建一个正则表达式来匹配所有分数。一个分数是文本 `Pt` 前面的一个非负整数。\n\n**解决方案：**\n\n`/\\d+/` 可以匹配由数字序列组成的正整数。由于我们需要匹配所有分数，因此必须对表达式应用\
    \ `g` 修饰符：`/\\d+/g`。让我们列出表达式中的所有数字。\n\n```\n> let regex = /\\d+/g;\n> let result\
    \ = null;\n> while ( result = regex.exec( classification ) ) {\nconsole.log( result[0]\
    \ );\n}\n```\n\n现在，我们应用一个前瞻断言来仅匹配分数。前瞻断言语法是 `(?=Pt)`。\n\n```\n> regex = /\\d+(?=Pt)/g;\n\
    > while ( result = regex.exec( classification ) ) {\nconsole.log( result[0] );\n\
    }\n```\n\n# 后顾断言\n\n*后顾断言*是前瞻断言的镜像。它从正则表达式的位置向后移动，检查指定模式是否匹配后顾断言*之前*的字符串。如果后顾断言匹配成功，则回退匹配。其语法如表\
    \ 8-2 所示。\n\n**表 8-2** 后顾断言语法\n\n| 后顾断言类型 | PCRE 语法 | Perl 6 语法 |\n| --- | ---\
    \ | --- |\n| 肯定型 | `(?<=pattern)` | `<?after pattern>` |\n| 否定型 | `(?<!pattern)`\
    \ | `<!after pattern>` |\n| 单词边界 | `\\b` | `<<` |\n\n与前瞻断言不同，后顾断言结构通常受到限制。具体的限制因实现而异。\n\
    \n大多数方言只允许固定长度的模式，并排除重复修饰符和字符集。但这并非普遍规则，例如，Java 就允许固定范围的重复修饰符。\n\n**示例 3**：使用\
    \ PCRE，在非空白字符序列中匹配 `list`、`lost`、`lust`，要求它们位于非空白字符序列的开头。\n\n**解决方案：**\n\n这一次，单词边界锚点被放在匹配字符串的\
    \ `l` 之前。\n\n```\nPCRE:    /\\bl[iou]st/\n```\n\n# 总结\n\n*前瞻断言*会向前查找字符，但在匹配成功后回退所有操作。\
    \  \n*后顾断言*会向后查找字符，并在匹配成功后回退所有操作。  \n单词边界锚点可以作为前瞻断言或后顾断言，指示非空白字符序列的开始或结束。\n\n\
    # 9. 维护正则表达式\n\n在行业中，编写和维护正则表达式常常令人心生畏惧。这是因为随着表达式变得庞大，阅读难度也随之增加。\n\n这让我想起了健身房里的一个词\
    \ *Fluessigkeitsliebhaberei*，意思是“热爱流体”。就这么一个词，毫无意义。德语单词很长，有时非常长。\n\n*Rindfleischetikettierungsueberwachungsaufgabenuebertragungsgesetz*\
    \ 是另一个例子。大多数读者习惯于阅读短单词。然后突然出现这样一个长词，我们所有的速读技巧都派不上用场了。\n\n软件开发人员习惯于阅读代码。但代码通常包含大量空白字符。下面的\
    \ PCRE 表达式就像是一个超长的德语单词：\n\n```\n/^(?=.*[A-Z].*[A-Z])(?=.*[!@#$&*])(?=.*[0-9].*[0-9])(?=.*[a-z].*[a-z]).{8,}$/\n\
    ```\n\n这远不是我见过的最糟糕的正则表达式，但要解读它仍然需要时间。如果我们能给它周围添加一些空白字符呢？\n\n默认情况下，只有 Perl 6 允许使用空白字符进行格式化。不幸的是，在其他方言中，空白字符是匹配自身的字面量字符。\n\
    \n不过，也并非无计可施。在本章中，我们将把那些看似无法阅读、杂乱无章的正则表达式转化为可维护的代码。我们将探讨创建可维护正则表达式的可行方案。\n"
- fmt: '# Extended Mode


    PCRE and some ERE languages allow an extended mode. The syntax is as follows:


    ```

    /(?x) regex      # comment line 1

    body       # comment line 2

    in         # comment line 3

    extended   # comment line 4

    mode       # comment line 5

    /

    ```


    In extended mode, whitespaces do not match anything; they are just there for formatting.
    The hash character (`#`) indicates the start of a comment, lasting until the end
    of the line.


    `(?x)` should be the first thing in the regular expression. You cannot just turn
    extended mode on in the middle of the expression. The construct `(?x)` is actually
    a regex flag or modifier. In some dialects or regex libraries, instead of writing
    `/a/i`, you can use the construct `/(i)a/`. The advantage of placing regex modifiers
    at the front is readability. When an expression is long, readers prefer knowing
    the modifiers before reading the expression itself.


    I highly recommend turning on extended mode. Recall the following expression:


    ```

    /^(?=.*[A-Z].*[A-Z])(?=.*[!@#$&*])(?=.*[0-9].*[0-9])(?=.*[a-z].*[a-z]).{8,}$/

    ```


    The following is the extended mode equivalent of the same expression:


    ```

    /(?x)

    ^                  # Start anchor

    (?=.*[A-Z].*[A-Z]) # At least two upper case letters

    (?=.*[!@#$&*])     # AND at least one special character

    (?=.*[0-9].*[0-9]) # AND at least two digits

    (?=.*[a-z].*[a-z]) # AND at least two lower case letters

    .{8,}              # String is at least 8 characters long

    $                  # End anchor

    /

    ```


    Believe it or not, this is the same expression as the previous one-liner.


    Unfortunately, not all dialects have extended mode. For instance, in EMACS and
    VIM, you don’t have it. In JavaScript, extended mode is not available either,
    but you can use the XRegExp library^([(53)](#fn53)) to turn on extended mode.


    ```

    const regex = new XRegExp( ''                                   \

    ^                   # Start anchor                         \

    (?=.*[A-Z].*[A-Z])  # At least two upper case letters      \

    (?=.*[!@#$&*])      # AND at least one special character   \

    (?=.*\\d.*\\d)      # AND at least two digits              \

    (?=.*[a-z].*[a-z])  # AND at least two lower case letters  \

    .{8,}               # String is at least 8 characters long \

    $                   # End anchor                          \

    '');

    ```


    Don’t forget to escape backslashes when you use the `XRegExp` constructor. To
    illustrate this, I used `\\d` instead of `[0-9]`.


    Even without extended mode, if you think outside the box, you can make your code
    more maintainable. For instance, using the `RegExp` constructor of JavaScript
    and using the syntax of the JavaScript language, you can write code that is easy
    to read.


    ```

    const regex = new RegExp(

    ''^''                  + // Start anchor

    ''(?=.*[A-Z].*[A-Z])'' + // At least two upper case letters

    ''(?=.*[!@#$&*])''     + // AND at least one special character

    ''(?=.*\\d.*\\d)''     + // AND at least two digits

    ''(?=.*[a-z].*[a-z])''   + // AND at least two lower case letters

    ''.{8,}''               + // String is at least 8 characters long

    ''$''                    // End anchor

    );

    ```


    # Regex Subroutines


    A few regex dialects provide subroutines. Subroutines are like functions in programming
    languages. Your regex becomes more readable if you don’t specify the whole expression
    as one chunk and instead you abstract some pieces of the expression into subroutines.
    Your expression also becomes more DRY (Don’t Repeat Yourself). After all, copying
    and pasting the same subroutine three or four times in an expression is not too
    maintainable.


    A subroutine is executed whenever it is called from any point of the expression.
    If the subroutine is matched, execution of the regular expression is followed
    as usual. If the subroutine is not matched, backtracking takes place.


    ## PCRE Subroutines


    Check out the documentation of your regex host language in the case of PCRE. Not
    all PCRE languages support subroutines. In the case of JavaScript, for instance,
    I suggest using the XRegExp library to enhance the expressive power of your regular
    expressions.


    ```

    var time = XRegExp.build(''(?x)^ {{hours}} ({{minutes}}) $'', {

    hours: XRegExp.build(''{{h12}} : | {{h24}}'', {

    h12: /1[0-2]|0?[1-9]/,

    h24: /2[0-3]|[01][0-9]/

    }, ''x''),

    minutes: /^[0-5][0-9]$/

    });

    ```


    The `{{hours}}`, `{{minutes}}`, `{{h12}}`, and `{{h24}}` placeholders insert subexpressions
    in their own place.


    XRegExp subroutines look a bit complex. The generic PCRE subroutine syntax is
    a bit easier to read.


    ```

    (?(DEFINE)

    (?

    # body of SUBROUTINE1

    )

    (?

    # body of SUBROUTINE2

    )

    )

    ```


    The `DEFINE` section of an expression never matches anything. It is used to declare
    your subroutines.


    Use `(?&SUBROUTINE1)` inside your expression to match it.


    Let’s see an example matching a currency symbol and a price that may contain a
    whole part and a fractional part. We assume that there is room for up to two digits
    in the fractional part.


    ```

    /(?x) (?&CURRENCY) (?&PRICE)

    (?(DEFINE)

    (? [\$\€] )

    (?    \d++ \.?+ \d{0,2} )

    )

    /

    ```


    ## Perl 6 Subroutines


    The Perl 6 syntax for subroutines is cleaner than the PCRE syntax, but it works
    more or less in the same way as the PCRE version.


    You can declare Perl 6 subroutines in the following way:


    ```

    /

    :my regex SUBROUTINE1 {

    # body of SUBROUTINE1

    }

    :my regex SUBROUTINE2 {

    # body of SUBROUTINE2

    }

    /

    ```


    You can call a subroutine inside your Perl 6 expression with `<SUBROUTINE1>`.


    Let’s rewrite the same currency example you saw in the "PCRE Subroutines" section.


    ```

    /(?x) (?&CURRENCY) (?&PRICE)

    (?(DEFINE)

    (?  [\$\€] )

    (?     \d++ \.?+ \d**0..2 )

    )

    /

    ```


    ## Extended Mode, Subroutines, and Abstractions


    *Abstraction* is the act of identifying reusable code and extracting this code
    out to one place. We can create subroutines to abstract repeated pieces of functionality
    in our regular expressions, and we can reuse them as many times as we want. Subroutines
    are essential in writing maintainable DRY regular expressions.


    With the benefits of extended mode, you will be able to say goodbye to long, unmaintainable
    regex riddles. You could even consider writing regular expressions that are thousands
    of characters long with full clarity. Just imagine, before you picked up this
    book, you might have had trouble reading a 20-character expression.


    # Named Capture Groups


    In PCRE, we extract the values of capture groups with `\1`, `\2`, and so on. The
    number of the capture group is based on the order of the opening parenthesis belonging
    to the capture group from left to right.


    We are now doing our best to make our regular expressions maintainable. Just imagine
    what happens if someone decides to add a pair of parentheses in our regular expression.
    Has this ever happened to you? If yes, you know how inconvenient it is. One change
    may affect the reference of all your capture groups in the expression. This goes
    against the principles of maintainability because there is *tight coupling* between
    the position of the parentheses inside the expression and the code surrounding
    the regular expression, geared at processing the value of the capture groups.


    Our primary goal in this section is to fix the name of the capture groups. Our
    secondary goal is to make these names semantic.


    If named captures exist in your dialect, use them for better maintainability.


    ## EMACS Named Capture Groups


    EMACS makes it possible to fix the number of the capture group: `\(?1: .* \)`.
    This name is not semantic, as we still have to stick to numbers.'
