- fmt: "# Substring Extraction from Regular Expressions\n\nYou read about many different\
    \ use cases of regular expressions in Chapter [1](#470763_1_En_1_Chapter.xhtml).\
    \ Let me repeat some of these use cases:\n\n- To test whether a string matches\
    \ a search expression\n- To find some characters in a string\n- To replace substrings\
    \ in a string matching a regex\n- To process and format user input\n- To extract\
    \ information from server logs, configuration files, and text files\n- To validate\
    \ input in web applications and in the terminal\n\nMany of the use cases require\
    \ that we find a *substring* of a string and extract it, reorder it, remove it,\
    \ or replace it.\n\nRegular expressions provide us with some help to perform these\
    \ tasks in the form of substring extraction.\n\nWhen I introduced literal characters\
    \ and meta characters, I said that parentheses had two semantics: grouping characters\
    \ and extracting substrings. Even in the section on regex operator precedence\
    \ and parentheses in Chapter [2](#470763_1_En_2_Chapter.xhtml), I mentioned that\
    \ we would use parentheses for substring extraction. Let’s learn this important\
    \ use case.\n\n## Defining Capture Groups\n\nWhen the regular expression substring\
    \ `x` is in parentheses, as in `(x)`, it is a *capture group*. Capture groups\
    \ cannot be defined inside character classes.\n\nThe value of capture groups is\
    \ captured and can be retrieved either inside the regular expression or using\
    \ the API of the programming language you are using. Retrieval is possible only\
    \ whenever the closing parenthesis in the regular expression matching process\
    \ has been reached.\n\nIn all languages except Perl 6, the identifier of a capture\
    \ group is a positive integer determined by the position of the opening parenthesis\
    \ in the expression.\n\n**Exercise 1**: Let’s determine the capture groups in\
    \ the following PCRE regular expression:\n\n```\n/^a(b|c(d|(e))(f))$/\n```\n\n\
    **Solution:**\n\nTable 7-1 shows the solution.\n\n| Capture Group Number | Substring\
    \ Pattern            |\n|---------------------|------------------------------|\n\
    | 1                   | `b\\|c(d\\|(e))(f)`             |\n| 2               \
    \    | `d\\|(e)`                      |\n| 3                   | `e`         \
    \                  |\n| 4                   | `f`                           |\n\
    \nThe capture group number is determined by the position of the opening parenthesis.\n\
    \n```\n/^a(b|c(d|(e))(f))$/\n^   ^  ^   ^\n|   |  |   |\n1   2  3   4\n```\n\n\
    ## Perl 6 Capture Groups\n\nIn Perl 6, capture group numbering is different. Capture\
    \ group numbering starts with zero. The capture group identifier increases in\
    \ a nested hierarchical way.\n\nOn the top level, there is one capture group with\
    \ the identifier `0`.\n\n```\n/^a(b|c(d|(e))(f))$/\n^\n|\n0\n```\n\nInside capture\
    \ group `0`, there are two capture groups on the next level: `0.0` and `0.1`.\
    \ The capture group numbering starts like this:\n\n```\n/^a(b|c(d|(e))(f))$/\n\
    ^      ^\n|      |\n0.0    0.1\n```\n\nInside the capture group `0.0`, there is\
    \ one more capture group.\n\n| Perl 6 Capture Group Number | Substring Pattern\
    \            |\n|----------------------------|------------------------------|\n\
    | 0                           | `b\\|c(d\\|(e))(f)`             |\n| 0.0     \
    \                    | `d\\|(e)`                      |\n| 0.0.0             \
    \          | `e`                           |\n| 0.1                         |\
    \ `f`                           |\n\n```\n/^a(b|c(d|(e))(f))$/\n^\n|\n0.0.0\n\
    ```\n\n## Retrieval of Captured Substrings\n\nCheck out the documentation of the\
    \ programming language you are using. As an example, we will retrieve substrings\
    \ in the following languages:\n\n- JavaScript\n- PHP\n- Python\n- Perl 5\n\nWe\
    \ will use the same example as earlier. Suppose we want to retrieve the currency,\
    \ the numeric price value, and the full price with currency in a string in this\
    \ format:\n\n```\nPrice: €19.00\n```\n\nThe regular expression matching this string\
    \ is as follows:\n\n```\n/^Price: [€\\$]\\d\\d\\.\\d\\d$/\n```\n\nWe have to escape\
    \ the dollar sign as a currency because `$` is a meta character denoting an end-of-string\
    \ or end-of-line anchor. We also have to escape a dot because it is a meta character\
    \ denoting one arbitrary character.\n\nLet’s add some parentheses for the substrings\
    \ we have to capture.\n\n```\n/^Price: (([€\\$])(\\d\\d\\.\\d\\d))$/\n```\n\n\
    The added capture groups contain the data shown in Table 7-3.\n\n| Capture Group\
    \ Number | Data          |\n|---------------------|---------------|\n| 1     \
    \               | Full price    |\n| 2                    | Currency symbol |\n\
    | 3                    | Numeric price |\n\nLet’s explore the retrieval of the\
    \ three capture groups.\n\n### JavaScript\n\nThe API works as follows:\n\n- `regex.exec(\
    \ str )`\n- `str.match( regex )`\n\nThese return all the capture groups defined\
    \ in `regex` when matching `str`.\n\n```javascript\nconst regex = /^Price: (([€\\\
    $])(\\d\\d\\.\\d\\d))$/;\nconst str = 'Price: €19.00';\nconst matches = regex.exec(\
    \ str );\n// str.match( regex ); // does the same\nconsole.table( matches );\n\
    ```\n\nThe output is:\n\n```\n(index) Value\n0       \"Price: €19.00\"\n1    \
    \   \"€19.00\"\n2       \"€\"\n3       \"19.00\"\nindex   0\ninput   \"Price:\
    \ €19.00\"\n```\n\nAs a side note, if you don’t yet know `console.table`, check\
    \ out my article on [the console API](http://www.zsoltnagy.eu/understanding-the-console-api-in-javascript-7-tips-for-smoother-debugging/).\n\
    \n### PHP\n\nWe will use `preg_match_all( $regex, $str, $result )`. PHP returns\
    \ all the capture groups inside the `$result` array.\n\n```php\n$regex = \"/^Price:\
    \ ((€|\\$)(\\d\\d\\.\\d\\d))$/\";\n$str = \"Price: €19.00\";\npreg_match_all($regex,\
    \ $str, $result);\nprint_r($result);\n```\n\nExecute the code, for example, in\
    \ the [PHP Sandbox](http://sandbox.onlinephpfunctions.com/). The result is as\
    \ follows:\n\n```\nArray\n(\n[0] => Array\n(\n[0] => Price: €19.00\n)\n[1] =>\
    \ Array\n(\n[0] => €19.00\n)\n[2] => Array\n(\n[0] => €\n)\n[3] => Array\n(\n\
    [0] => 19.00\n)\n)\n```\n\n### Python\n\nLet’s recall the code we saw when we\
    \ first tested regular expressions with Python, and let’s place the correct `regex`\
    \ and `test_str` values in there.\n\n```python\nimport re\nregex = r\"^Price:\
    \ ((€|\\$)(\\d\\d\\.\\d\\d))$\"\ntest_str = \"Price: €19.00\"\nmatches = re.finditer(regex,\
    \ test_str)\nfor matchNum, match in enumerate(matches, start=1):\n    print (\"\
    Match {matchNum} was found at {start}-{end}: {match}\"\n           .format(matchNum=matchNum,\
    \ start=match.start(),\n                   end=match.end(), match=match.group()))\n\
    \    for groupNum in range(0, len(match.groups())):\n        groupNum = groupNum\
    \ + 1\n        print (\"Group {groupNum} found at {start}-{end}: {group}\"\n \
    \              .format(groupNum=groupNum, start=match.start(groupNum),\n     \
    \                  end=match.end(groupNum), group=match.group(groupNum)))\n```\n\
    \nOnce we paste this code in the [Python shell](https://www.python.org/shell/),\
    \ the result becomes visible.\n\n```\nMatch 1 was found at 0-13: Price: €19.00\n\
    Group 1 found at 7-13: €19.00\nGroup 2 found at 7-8: €\nGroup 3 found at 8-13:\
    \ 19.00\n```\n\nAs you can see, the capture groups are accessible via the `match`\
    \ object.\n\nYes, this was the promised foreshadowing from the first introduction\
    \ of the same Python code. Originally, the same code didn’t find any capture groups\
    \ in the expression, but now you can see that the inner `for` loop prints out\
    \ the capture groups one by one.\n\n### Perl 5\n\nWe have seen that a simple match\
    \ can be executed using the `=~` operator.\n\n```perl\nif ( \"Price: €19.00\"\
    \ =~ /^Price: ((€|\\$)(\\d\\d\\.\\d\\d))$/ ) {\n    print \"Match\";\n}\n```\n\
    \nWe have already seen a few variables that provide us with some context to the\
    \ match, such as the following:\n\n```perl\nif ( \"Price: €19.00\" =~ /^Price:\
    \ ((€|\\$)(\\d\\d\\.\\d\\d))$/ ) {\n    print \"String before the match: \", $`,\
    \ \"\\n\";\n    print \"String after the match:\", $', \"\\n\";\n    print \"\
    Matched string:\", $&, \"\\n\";\n}\n```\n\nSimilarly, there are variables defined\
    \ for each capture group in the form of `$1`, `$2`, `$3`, and so on.\n\n```perl\n\
    if ( \"Price: €19.00\" =~ /^Price: ((€|\\$)(\\d\\d\\.\\d\\d))$/ ) {\n    print\
    \ \"String before the match: \", $`, \"\\n\";\n    print \"String after the match:\"\
    , $', \"\\n\";\n    print \"Matched string:\", $&, \"\\n\";\n    print \"First\
    \ capture group:\", $1, \"\\n\";\n    print \"Second capture group:\", $2, \"\\\
    n\";\n    print \"Third capture group:\", $3, \"\\n\";\n}\n```\n\nThe result of\
    \ the execution is as follows:\n\n```\nString before the match:\nString after\
    \ the match:\nMatched string:Price: €19.00\nFirst capture group: €19.00\nSecond\
    \ capture group: €\nThird capture group:19.00\n```"
  raw: '# 7. Substring Extraction from Regular Expressions


    You read about many different use cases of regular expressions in Chapter [1](#470763_1_En_1_Chapter.xhtml).
    Let me repeat some of these use cases:


    *   To test whether a string matches a search expression


    *   To find some characters in a string


    *   To replace substrings in a string matching a regex


    *   To process and format user input


    *   To extract information from server logs, configuration files, and text files


    *   To validate input in web applications and in the terminal


    Many of the use cases require that we find a *substring* of a string and extract
    it, reorder it, remove it, or replace it.


    Regular expressions provide us with some help to perform these tasks in the form
    of substring extraction.


    When I introduced literal characters and meta characters, I said that parentheses
    had two semantics: grouping characters and extracting substrings. Even in the
    section on regex operator precedence and parentheses in Chapter [2](#470763_1_En_2_Chapter.xhtml),
    I mentioned that we would use parentheses for substring extraction. Let’s learn
    this important use case.


    ## Defining Capture Groups


    When the regular expression substring `x` is in parentheses, as in `(x)`, it is
    a *capture group*. Capture groups cannot be defined inside character classes.


    The value of capture groups is captured and can be retrieved either inside the
    regular expression or using the API of the programming language you are using.
    Retrieval is possible only whenever the closing parenthesis in the regular expression
    matching process has been reached.


    In all languages except Perl 6, the identifier of a capture group is a positive
    integer determined by the position of the opening parenthesis in the expression.


    **Exercise 1**: Let’s determine the capture groups in the following PCRE regular
    expression:


    ```

    /^a(b|c(d|(e))(f))$/

    ```


    **Solution:**


    Table [7-1](#470763_1_En_7_Chapter.xhtml#Tab1) shows the solution.


    Table 7-1


    Solution for Exercise 1


    | Capture Group Number | Substring Pattern |

    | --- | --- |

    | 1 | `b&#124;c(d&#124;(e))(f)` |

    | 2 | `d&#124;(e)` |

    | 3 | `e` |

    | 4 | `f` |


    The capture group number is determined by the position of the opening parenthesis.


    ```

    /^a(b|c(d|(e))(f))$/

    ^   ^  ^   ^

    |   |  |   |

    1   2  3   4

    ```


    ## Perl 6 Capture Groups


    In Perl 6, capture group numbering is different. Capture group numbering starts
    with zero. The capture group identifier increases in a nested hierarchical way.


    On the top level, there is one capture group with the identifier `0`.


    ```

    /^a(b|c(d|(e))(f))$/

    ^

    |


    ```


    Inside capture group `0`, there are two capture groups on the next level: `0.0`
    and `0.1`. The capture group numbering starts like this:


    ```

    /^a(b|c(d|(e))(f))$/

    ^      ^

    |      |

    0.0    0.1

    ```


    Inside the capture group `0.0`, there is one more capture group.


    Table 7-2


    Perl 6 capture group numbering


    | Perl 6 Capture Group Number | Substring Pattern |

    | --- | --- |

    | 0 | `b&#124;c(d&#124;(e))(f)` |

    | 0.0 | `d&#124;(e)` |

    | 0.0.0 | `e` |

    | 0.1 | `f` |


    ```

    /^a(b|c(d|(e))(f))$/

    ^

    |

    0.0.0

    ```


    ## Retrieval of Captured Substrings


    Check out the documentation of the programming language you are using. As an example,
    we will retrieve substrings in the following languages:


    *   JavaScript


    *   PHP


    *   Python


    *   Perl 5


    We will use the same example as earlier. Suppose we want to retrieve the currency,
    the numeric price value, and the full price with currency in a string in this
    format:


    ```

    Price: €19.00

    ```


    The regular expression matching this string is as follows:


    ```

    /^Price: [€\$]\d\d\.\d\d$/

    ```


    We have to escape the dollar sign as a currency because `$` is a meta character
    denoting an end-of-string or end-of-line anchor. We also have to escape a dot
    because it is a meta character denoting one arbitrary character.


    Let’s add some parentheses for the substrings we have to capture.


    ```

    /^Price: (([€\$])(\d\d\.\d\d))$/

    ```


    The added capture groups contain the data shown in Table [7-3](#470763_1_En_7_Chapter.xhtml#Tab3).


    Table 7-3


    Data for Capture Groups


    | Capture Group Number | Data |

    | --- | --- |

    | 1 | Full price |

    | 2 | Currency symbol |

    | 3 | Numeric price |


    Let’s explore the retrieval of the three capture groups.


    ### JavaScript


    The API works as follows:


    *   `regex.exec( str )`


    *   `str.match( regex )`


    These return all the capture groups defined in `regex` when matching `str`.


    ```

    const regex = /^Price: (([€\$])(\d\d\.\d\d))$/;

    const str = ''Price: €19.00'';

    const matches = regex.exec( str );

    // str.match( regex ); // does the same

    console.table( matches );

    (index) Value

    0       "Price: €19.00"

    1       "€19.00"

    2       "€"

    3       "19.00"

    index   0

    input   "Price: €19.00"

    ```


    As a side note, if you don’t yet know `console.table`, check out my article on
    [the console API](http://www.zsoltnagy.eu/understanding-the-console-api-in-javascript-7-tips-for-smoother-debugging/).^([^(47)](#fn47))


    ### PHP


    We will use `preg_match_all( $regex, $str, $result )`. PHP returns all the capture
    groups inside the `$result` array.


    ```

    $regex = "/^Price: ((€|\$)(\d\d\.\d\d))$/";

    $str = "Price: €19.00";

    preg_match_all($regex, $str, $result);

    print_r($result);

    ```


    Execute the code, for example, in the [PHP Sandbox](http://sandbox.onlinephpfunctions.com/).^([^(48)](#fn48))
    The result is as follows:


    ```

    Array

    (

    [0] => Array

    (

    [0] => Price: €19.00

    )

    [1] => Array

    (

    [0] => €19.00

    )

    [2] => Array

    (

    [0] => €

    )

    [3] => Array

    (

    [0] => 19.00

    )

    )

    ```


    ### Python


    Let’s recall the code we saw when we first tested regular expressions with Python,
    and let’s place the correct `regex` and `test_str` values in there.


    ```

    import re

    regex = r"^Price: ((€|\$)(\d\d\.\d\d))$"

    test_str = "Price: €19.00"

    matches = re.finditer(regex, test_str)

    for matchNum, match in enumerate(matches):

    matchNum = matchNum + 1

    print ("Match {matchNum} was found at {start}-{end}: {match}"

    .format(

    matchNum = matchNum,

    start = match.start(),

    end = match.end(),

    match = match.group()

    )

    )

    for groupNum in range(0, len(match.groups())):

    groupNum = groupNum + 1

    print ("Group {groupNum} found at {start}-{end}: {group}"

    .format(

    groupNum = groupNum,

    start = match.start(groupNum),

    end = match.end(groupNum),

    group = match.group(groupNum)

    )

    )

    ```


    Once we paste this code in the [Python shell](https://www.python.org/shell/),^([^(49)](#fn49))
    the result becomes visible.


    ```

    Match 1 was found at 0-13: Price: €19.00

    Group 1 found at 7-13: €19.00

    Group 2 found at 7-8: €

    Group 3 found at 8-13: 19.00

    ```


    As you can see, the capture groups are accessible via the `match` object.


    Yes, this was the promised foreshadowing from the first introduction of the same
    Python code. Originally, the same code didn’t find any capture groups in the expression,
    but now you can see that the inner `for` loop prints out the capture groups one
    by one.


    ### Perl 5


    We have seen that a simple match can be executed using the `=~`operator.


    ```

    if ( "Price: €19.00" =~ /^Price: ((€|\$)(\d\d\.\d\d))$/ ) {

    print "Match";

    }

    ```


    We have already seen a few variables that provide us with some context to the
    match, such as the following:


    ```

    if ( "Price: €19.00" =~ /^Price: ((€|\$)(\d\d\.\d\d))$/ ) {

    print "String before the match: ", $`, "\n";

    print "String after the match:", $'', "\n";

    print "Matched string:", $&, "\n";

    }

    ```


    Similarly, there are variables defined for each capture group in the form of `$1`,
    `$2`, `$3`, and so on.


    ```

    if ( "Price: €19.00" =~ /^Price: ((€|\$)(\d\d\.\d\d))$/ ) {

    print "String before the match: ", $`, "\n";

    print "String after the match:", $'', "\n";

    print "Matched string:", $&, "\n";

    print "First capture group:", $1, "\n";

    print "Second capture group:", $2, "\n";

    print "Third capture group:", $3, "\n";

    }

    ```


    The result of the execution is as follows:


    ```

    String before the match:

    String after the match:

    Matched string:Price: €19.00

    First capture group: €19.00

    Second capture group: €

    Third capture group:19.00

    ```'
