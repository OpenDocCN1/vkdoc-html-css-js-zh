    \ the shortest match. They are designed to return the first match in the execution\
    \ sequence."
  trans: "\n# 确定性与非确定性正则表达式建模\n\n在大多数正则表达式方言中，`|`（管道符）表示*或*操作。在 EMACS 和 VIM 中，需要对管道符进行转义，得到\
    \ `\\|` 操作符。在 BRE 中，不支持*或*操作。在所有其他方言中，*或*操作符就是普通的管道符。本章我们将采用后一种表示法。\n\n`/a|b/`\
    \ 是一个正则表达式，它匹配字符 `a` 或字符 `b`。此正则表达式的有限状态机表示如图 4-2 所示。\n\n![../images/470763_1_En_4_Chapter/470763_1_En_4_Fig2_HTML.jpg](img/470763_1_En_4_Fig2_HTML.jpg)\n\
    \n图 4-2\n\n`/a|b/`\n\n在实践中，正则表达式的实现可能会通过使用位掩码来表示一组可能的匹配，从而简化此自动机，如图 4-3 所示。\n\n\
    ![../images/470763_1_En_4_Chapter/470763_1_En_4_Fig3_HTML.jpg](img/470763_1_En_4_Fig3_HTML.jpg)\n\
    \n图 4-3\n\n`/a|b/`\n\n位掩码表示简化了图形，尤其是在复杂情况下。\n\n让我们考虑一些更复杂的情况，在这些情况下，简化并不明显。\n\n\
    这是一个表达式，如图 4-4 所示：`/list|lost|lust/`。\n\n最直观的自动机构造方式如下：我们针对*或*操作符的每个操作数进行分支，并尝试按顺序匹配字符。\n\
    \n![../images/470763_1_En_4_Chapter/470763_1_En_4_Fig4_HTML.jpg](img/470763_1_En_4_Fig4_HTML.jpg)\n\
    \n图 4-4\n\n`/list|lost|lust/`\n\n在执行过程中，我们必须尝试每个分支。当一个分支失败时，我们进行回溯。例如，在序列 `lossless`\
    \ 中，我们尝试以下步骤：\n\n*   由于第一个字符是 `l`，我们尝试在所有三个分支中匹配它。\n    *   在第一个分支上，我们检查第二个字符，它是\
    \ `o`。由于无法在此分支中前进，我们进行回溯。\n*   在第二个分支上，第二个和第三个字符 `o` 和 `s` 都与后续箭头上的字符匹配。但是，第四个字符应该是\
    \ `t` 而不是 `s`，所以我们进行回溯。\n*   在第三个分支上，我们检查第二个字符，它仍然是 `o`。因为我们需要 `u` 才能前进，所以我们进行回溯。\n\
    *   第二个、第三个和第四个字符与从*起始*节点出发的任何箭头都不匹配。\n*   第五个字符又是 `l`。我们尝试在所有三个分支中匹配它。\n    *\
    \   在第一个分支上，`e != i`，所以我们回溯。\n    *   在第二个分支上，`e != o`，所以我们回溯。\n    *   在第三个分支上，`e\
    \ != u`，所以我们回溯。\n*   其余字符（`e`、`s` 和 `s`）与从起始节点出发的任何边都不匹配。\n*   由于没有更多字符需要读取，并且我们尚未到达*匹配*状态，因此返回失败。\n\
    \n每次当我们从同一个节点可以向多个方向移动时，我们就采取了一次非确定性操作。前面的自动机是一个*非确定性有限自动机*（NFA^(²⁷)）。\n\n许多正则表达式解释器使用这种非确定性形式，而不考虑任何编译时优化。一些正则表达式解释器会多走一步，将非确定性边转换为确定性边。\n\
    \n首先，注意每个分支都以 `l` 开头。我们可以简单地只使用一条边来代替三条边，并推迟非确定性的出现，如图 4-5 所示。\n\n![../images/470763_1_En_4_Chapter/470763_1_En_4_Fig5_HTML.jpg](img/470763_1_En_4_Fig5_HTML.jpg)\n\
    \n图 4-5\n\n`/l(ist|ost|ust)/`\n\n其次，注意每个分支都以 `st` 结尾。我们可以使用一条边和一个状态来代替三个冗余的边和状态，如图\
    \ 4-6 所示。\n\n![../images/470763_1_En_4_Chapter/470763_1_En_4_Fig6_HTML.jpg](img/470763_1_En_4_Fig6_HTML.jpg)\n\
    \n图 4-6\n\n`l`，`I` 或 `o` 或 `u`，`s`，`t`\n\n作为最后一步，我们应用一个位掩码来代替这三条边，其中字母通过*或*操作连接，如图\
    \ 4-7 所示。\n\n![../images/470763_1_En_4_Chapter/470763_1_En_4_Fig7_HTML.jpg](img/470763_1_En_4_Fig7_HTML.jpg)\n\
    \n图 4-7\n\n`l`，`{i, o, u}` 字符集，`s`，`t`\n\n现在，我们将这个位掩码表示为 `{i|o|u}`。请这样理解：“从字符\
    \ `i`、`o`、`u` 中选择一个。”你将在本章后面了解这种语言结构。\n\n更重要的是，结果图现在是一个 DFA，^(²⁸) 即确定性有限自动机。\n\
    \n非确定性形式更容易从正则表达式构建。如果输入长度为 `N`，则构建树需要 `O(N)` 步。作为交换，我们在执行时付出代价，因为最坏情况下的执行时间是\
    \ `O(2^N)`。\n\n构建确定性自动机所需的步骤数量级为 `O(2^N)`。作为交换，执行成本是线性的。\n\n在实践中，只要我们的正则表达式不是可重用的，我们倾向于满足于较慢的最坏情况执行时间。这是因为正则表达式可以非常快速地成功匹配。一旦找到匹配，执行就结束了。\n\
    \n因此，即使大多数正则表达式引擎都使用优化，非确定性形式通常也是有益的。\n\n最后，注意我们最初的表达式是 `/list|lost|lust/`。如果我们从最终优化后的自动机反向工程出一个正则表达式，我们会得到\
    \ `/l(i|o|u)st/`。这种形式是纯确定性的。因此，我们可以得出结论，如果我们的正则表达式解释器倾向于以非确定性的方式执行正则表达式匹配，那么通过编写优化的正则表达式，我们可以节省宝贵的运行时间。即使解释器为我们进行了必要的优化，通过以优化形式编写正则表达式，我们仍然可以节省自动机构建时间。\n\
    \n这种好处通常是微不足道的，所以每当我在优化和可理解性之间做选择时，我倾向于可理解性。\n\n如果你想了解更多关于优化技术的信息，请参考 `swtch.com`。^(²⁹)\n\
    \n# 基本的正则表达式简化\n\n你已经看到，对于同一个正则表达式，非确定性自动机构建算法会产生两个完全不同的自动机。在上一节中，\n\n*   `/list|lost|lust/`\
    \ 产生了一个非确定性有限状态自动机。\n*   `/l(i|o|u)st/` 产生了一个确定性自动机。\n\n你已经知道第二种形式更高效。通常，除非出于语义原因需要提高正则表达式的可读性，否则我更喜欢第二种形式。\n\
    \n当匹配一个分支意味着另一个分支也被匹配时，同样的情况也适用。例如，在 `/lesson|less/` 或 `/less|lesson/` 中，匹配 `lesson`\
    \ 意味着我们必须已经匹配了 `less`。\n\n这是因为 `lesson` 以 `less` 开头。因此，我们可以将正则表达式简化为 `/less/`。\n\
    \n例如，当在 `lessom`（很可能是由于拼写错误而写出的无意义单词）上执行 `/lesson|less/` 时，我们首先尝试匹配 `lesson`，然后回溯，最终得出结论\
    \ `less` 被接受。虽然在小正则表达式中这没什么大不了的，但想象一个膨胀的正则表达式，如下所示：\n\n```\n/less(a|b|c|de(f|g)|o(a|b|c|...))|less/\n\
    ```\n\n在检查 `lessom` 时，我们可能会在第一个分支上浪费大量宝贵的执行时间，而这是毫无理由的。\n\n我们可能在第一个分支上成功，例如，通过检查输入\
    \ `lessdeg`。然而，`lessdeg` 也能匹配 `less`，这意味着我们做了不必要的工作。正则表达式并非设计用于找到最短的匹配。它们被设计为返回执行序列中的第一个匹配。\n"
- fmt: '# A Successful Match Is Cheaper Than Failure


    You saw in the previous sections that regular expressions tend to succeed faster
    than returning a failure. This is because a failure means we have to try each
    execution path in all possible ways.


    As success is cheaper than failure, always formulate a condition for success when
    designing a regular expression. Failure tends to be more expensive.


    # Automatically Generating Regex FSMs


    Visualizing a regular expressions helps you understand how they work and how they
    can be simplified. Until you master the regex execution model in your mind, you
    could have a notebook with you to construct a finite state machine for each regular
    expression you encounter. If you want to save time, you can also use some online
    services.


    [`http://ivanzuzak.info/noam/webapps/fsm_simulator/`](http://ivanzuzak.info/noam/webapps/fsm_simulator/)
    simulates the execution of a regular expression matching a given string. It not
    only creates automata for you but also shows the execution of the matching algorithm
    character by character. Unfortunately, the language of the automaton is limited,
    as we can only concatenate strings, use the *or* operator, and use the Kleene
    (`*`) operator for indicating any number of occurrences. We can also use parentheses
    for grouping. Using the plus symbol instead of the pipe is slightly inconvenient
    because in this special dialect, plus means alternative execution and not the
    "at least once" repeat modifier. In exchange for the semantic difficulties, this
    software shows you three different types of simplified automata that can be used
    to match your strings. The constructs in this book have been very close to the
    *eNFA* construct.


    [`http://ivanzuzak.info/noam/webapps/regex_simplifier/`](http://ivanzuzak.info/noam/webapps/regex_simplifier/)
    shows you how to simplify regular expressions. For instance, the expression containing
    the words *list*, *lost*, and *lust* is simplified as follows:


    ```

    Input: list+lost+lust

    R1   list+lost+lust

    Rule (ab+ac) => a(b+c)

    R2   l(ist+ost)+lust

    Rule (ab+ac) => a(b+c)

    R3   l((ist+ost)+ust)

    Rule (ab+cb) => (a+c)b

    R4   l(((is+os)t)+ust)

    Rule (a) => a

    R5   l((is+os)t+ust)

    Rule (ab+cb) => (a+c)b

    R6   l(((is+os)+us)t)

    Rule (ab+cb) => (a+c)b

    R7   l((((i+o)s)+us)t)

    Rule (a) => a

    R8   l(((i+o)s+us)t)

    Rule (ab+cb) => (a+c)b

    R9   l((((i+o)+u)s)t)

    Rule ab(cd) => abcd

    R10  l(((i+o)+u)s)t

    Rule ab(cd) => abcd

    R11  l((i+o)+u)st

    Rule (a+(b+c)) => a+b+c

    R12  l(i+o+u)st

    ```


    [`https://regexper.com/`](https://regexper.com/) constructs an execution graph
    from a JavaScript regular expression. For instance, check out the representation
    of a complex JavaScript regular expression online. If you study the graph, you
    can easily reverse engineer what each meta character means. If this regular expression
    seems intimidating for you, don''t worry, because we all have trouble reading
    expressions like this one.


    This graph representation has little to do with the finite state automata because
    in the regexper graph, edges do not consume characters. In this graph, nodes consume
    characters, and edges can be selected in a nondeterministic way. Also notice that
    edges may have conditions on them such as *1..3 times* or *1+ times*. The FSM
    representation of such edges may be completely different. This is a simplification
    for the sake of understandability.


    [`https://www.debuggex.com/`](https://www.debuggex.com/) uses the same format
    as regexper, and the interface helps you visualize how a regular expression matches
    a string character by character. You can use JavaScript, Python, and generic PCRE
    syntax.


    [`https://regexr.com/`](https://regexr.com/) gives you a verbal explanation and
    cheat sheet for JavaScript, as well as the generic PCRE syntax.


    [`https://regex101.com/`](https://regex101.com/) is another handy tool for testing
    whether a regular expression matches a string. PCRE (PHP), JavaScript, Python,
    and GoLang are all usable. The tool can also generate code for C#, Java, Ruby,
    Rust, and Perl 5.


    [`http://qfsm.sourceforge.net/download.html`](http://qfsm.sourceforge.net/download.html)
    is my favorite finite state machine designer tool. You can visualize and simulate
    finite state machines conveniently.


    # Summary


    In this chapter, you learned the fundamentals of visualizing the execution of
    simple regular expressions with finite state machines. We concluded that the execution
    of state machines can be deterministic or nondeterministic, depending on the way
    how regular expressions are simplified.


    Deterministic execution can be visualized using a deterministic finite automaton.
    Creating this automaton is expensive, but determining whether a regular expression
    matches a string is cheap in terms of execution time.


    Nondeterministic execution can be visualized using a nondeterministic finite automaton.
    Creating this automaton is cheap, but executing whether a regular expression matches
    a string is expensive in terms of execution time.


    As success is always cheaper than a failure during runtime, we tend to favor nondeterministic
    execution to avoid losing too much time with optimization.


    We concluded this chapter with some simple considerations for optimizing regular
    expressions and some tools that visualize, test, simplify, or debug regular expressions.


    So far, you have used a limited subset of regular expressions. In the next chapter,
    you will extend this subset with repeat modifiers.


    Footnotes


    # 5. Repeat Modifiers


    In Chapter 1, I explained that regular expressions are imperative. Imperative
    languages come with control structures. When developing software using a programming
    language, we use the following control structures:


    *   *Branching*: In most programming languages, we use `if` statements and switches.
    In regular expressions, we branch off using the `|` metasyntax character or using
    character sets. An `|` structure vaguely corresponds to an `if-else` structure,
    and a character set vaguely corresponds to a `switch` statement. An example of
    character sets is `[ab]`. Read it like `a|b`. In other words, choose either `a`
    or `b`.


    *   *Loops*: In most programming languages, we use loops such as the `for` loop
    or the `while` loop. *Repeat modifiers* are similar structures to loops in regular
    expressions.


    Table 5-1 describes the repeat modifiers that are available to use.


    **Table 5-1 Repeat Modifiers**


    | Repeat Modifier (PCRE) | Description |

    | --- | --- |

    | `+` | Match at least once |

    | `?` | Match at most once |

    | `*` | Match any number of times |

    | `{min,max}` | Match at least `min` times, and at most `max` times |

    | `{n}` | Match exactly `n` times |


    Table 5-1 shows the PCRE syntax only. There are some differences in other dialects.
    We will tackle those differences in the description of each repeat modifier.'
