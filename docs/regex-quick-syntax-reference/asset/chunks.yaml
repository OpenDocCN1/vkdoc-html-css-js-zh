    PHP offers global functions to handle regular expressions. These start with the
    following:


    - `preg_` matching the Perl PCRE syntax

    - `ereg_` based on the ERE dialect

    - `mb_ereg` also based on the ERE dialect, with the ability to handle Unicode
    characters


    We will deal only with the PCRE syntax here.


    In PHP, some modifiers are the same as in JavaScript, while others are different.


    - `i` stands for case-insensitivity just like in JavaScript.

    - `m` stands for multiline just like in JavaScript.

    - `u` stands for Unicode matching just like in JavaScript.

    - `s` makes the `.` character match all characters without exception, including
    the newline, just like in ES2018.

    - `x` turns on free spacing mode for easier readability. Free spacing mode ignores
    whitespace characters between regex characters.


    Consult the PCRE section of the PHP manual^([³](#fn3)) for the documentation of
    all PCRE regex functions.


    You can execute PHP code online using many sandbox solutions such as `writephponline.com`^([⁴](#fn4))
    or the Joodle PHP online editor.^([⁵](#fn5))


    You can use `preg_match` to return the first match from a string.


    ```

    preg_match(''/xy+/'', ''xyxyyxyyy'', $matches, PREG_OFFSET_CAPTURE);

    print_r($matches);

    ```


    The result is as follows:


    ```

    Array ( [0] => Array ( [0] => xy [1] => 0 ) )

    ```


    This is an array containing one element describing the match. The match descriptor
    is an array, where element 0 contains the matched sequence, and the element at
    index 1 contains the index of the first character of the match.


    `preg_match_all` returns all matches, so it is similar to the `g` flag in JavaScript.
    Remember, PHP does not have the `g` modifier, so global matching is encoded in
    the public interface in the PCRE regular expression wrapper.


    ```

    preg_match_all(''/xy+/'', ''xyxyyxyyy'', $matches, PREG_OFFSET_CAPTURE);

    print_r($matches);

    ```


    The result contains all matches.


    ```

    Array (

    [0] => Array (

    [0] => Array ( [0] => xy   [1] => 0 )

    [1] => Array ( [0] => xyy  [1] => 2 )

    [2] => Array ( [0] => xyyy [1] => 5 )

    )

    )

    ```


    Although the `preg_` functions act as a wrapper for Perl 5–style regular expressions,
    there are some small differences in the Perl syntax. Consult the `php.net` documentation
    on PCRE pattern differences^([⁶](#fn6)) for more details.


    ### Python


    We will now use `python.org`’s shell^([⁷](#fn7)) to start getting familiar with
    regular expressions in Python. The `re` Python module gives you support for PCRE-style
    regular expressions. You can import this module with `import re`.


    ```

    >>> import re

    ```


    The `compile` method of the `re` module compiles a regular expression based on
    the pattern string provided to it. You can already assemble many pattern strings
    using your PCRE knowledge.


    ```

    >>> regex = re.compile(r"xy+")

    ```


    Notice the `r` in front of the string. In Python, this denotes a raw string. Although
    in the previous example you can omit this `r`, in generic cases, you can save
    a lot of character escaping if you use raw strings.


    The `search` method of a compiled regular expression searches its string argument
    for a match.


    ```

    >>> regex.search( "QxyxyyQ" )

    ```


    You can get more information on the result with some methods.


    ```

    >>> result = regex.search( "QxyyxyQ" )

    >>> result.group(), result.start(), result.end(), result.span()

    (''xyy'', 1, 4, (1, 4))

    ```


    The method `group` returns the first match in its longest form. The first character
    of the match and the first character after the match can be retrieved using the
    `start`, `end`, and `span` methods.


    The `match` method of compiled regular expressions is misleading because it looks
    for a match from the *start* of the string.


    ```

    >>> regex.match( "QxyxyyQ" )

    None

    >>> regex.match( "xyxyyQ" )


    ```


    Technically, `match` is redundant because you could use the `^` character to match
    the start of the string.


    ```

    >>> re.compile( "^xy+" ).search( "xyxyyQ" )


    ```


    I explained the `match` method so you would avoid confusing it with `search`.


    There is no need to compile regular expressions because the `match` and `search`
    methods are also available via the `re` module as a function accepting a regex
    string and a regular string.


    ```

    >>> re.search( ''^xy+'', ''xyyyyxyQ'' )


    ```


    It is also possible to enumerate all matches belonging to a search expression.
    The methods `findall` and `finditer` do the trick.


    ```

    >>> re.findall( ''xy+'', ''QxyxyyQxyyyQ'' )

    [''xy'', ''xyy'', ''xyyy'']

    >>> iterator = re.finditer( ''xy+'', ''QxyxyyQxyyyQ'' )

    >>> for matchNum, match in enumerate(iterator):

    ...     print ( match.group(), match.span() )

    ...

    xy (1, 3)

    xyy (3, 6)

    xyyy (7, 11)

    ```


    In the first example, we enumerated all matches in an array. In the second example,
    we created an iterator and started iterating on it to print the results one by
    one.


    Now you know enough to understand the example code generated by `regex101.com`.^([⁸](#fn8))


    ```

    import re

    regex = r"ab+"

    test_str = "ababb"

    matches = re.finditer(regex, test_str)

    for matchNum, match in enumerate(matches):

    matchNum = matchNum + 1

    print ("Match {matchNum} was found at {start}-{end}: {match}"

    .format(

    matchNum = matchNum,

    start = match.start(),

    end = match.end(),

    match = match.group()

    )

    )

    for groupNum in range(0, len(match.groups())):

    groupNum = groupNum + 1

    print ("Group {groupNum} found at {start}-{end}: {group}"

    .format(

    groupNum = groupNum,

    start = match.start(groupNum),

    end = match.end(groupNum),

    group = match.group(groupNum)

    )

    )

    ```


    Note that I formatted the long lines in the code. As the width of this book is
    limited, this change makes sense, and it is not a good idea to write very long
    lines of code anyway.


    The code sequence prints out the following:


    ```

    Match 1 was found at 0-2: ab

    Match 2 was found at 2-5: abb

    ```


    The inner loop of groups was not executed in this example. You will come back
    to this code later when studying the extraction of substrings using capture groups.


    For more information, consult the Python regex documentation.^([⁹](#fn9))


