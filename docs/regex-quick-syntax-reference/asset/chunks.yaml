    /\d.[^a-z][^a-z]/

    ```


    is valid in PCRE. It matches four characters, a digit, an arbitrary character,
    and two characters that are not lowercase letters.


    Special characters require special care. Suppose we would like to search for the
    expression `[(1+2)*3]^2`. If we fire up our JavaScript Chrome Developer Tools
    and execute a matching string `''/[(1+2)*3]^2/''` against the regex `/[(1+2)*3]^2/`,
    we are destined to fail.


    ```

    > ''[(1+2)*3]^2''.match( /[(1+2)*3]^2/ )

    null

    ```


    The reason is that we have to escape all special characters.


    ```

    ''[(1+2)*3]^2''.match( /\[\(1\+2\)\*3\]\^2/ )

    ["[(1+2)*3]^2", index: 0, input: "[(1+2)*3]^2"]

    ```


    Correct me if I am wrong, but escaping seems anything but readable. Some languages
    such as Perl and PHP provide the `\Q` and `\E` special characters to write any
    characters unescaped. Whatever is written in between `\Q` and `\E` will be matched
    in sequence, character by character.


    For instance, the PHP implementation looks like this:


    ```

    $re = ''/\Q[(1+2)*3]^2\E/'';

    $str = ''[(1+2)*3]^2'';

    preg_match_all($re, $str, $matches, PREG_SET_ORDER, 0);

    // Print the entire match result

    var_dump($matches);

    ```


    The output is as follows:


    ```

    array(1) { [0]=> array(1) { [0]=> string(11) "[(1+2)*3]^2" } }

    ```


    As this feature does not exist in JavaScript, we have the following options:


    *   Use an extended library such as xregexp.^([^(44)](#fn44))


    *   Use an escaping function^([^(45)](#fn45)) that does the dirty work automatically.


    Here’s an example (which you can find online^([^(46)](#fn46))):


    ```

    RegExp.escape = function(text) {

    return text.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, "\\$&");

    }

    ```


    ## Summary


    In this chapter, you learned to use some more advanced elements of the regular
    expression syntax.


    *   Character sets


    *   Character set ranges


    *   Exclusions from character sets


    *   Character set classes


    I concluded this chapter with some examples concatenating regex substrings formed
    using the language constructs you already know.


    Footnotes [1](#470763_1_En_6_Chapter.xhtml#Fn1_source)   [2](#470763_1_En_6_Chapter.xhtml#Fn2_source)
      [3](#470763_1_En_6_Chapter.xhtml#Fn3_source)   [4](#470763_1_En_6_Chapter.xhtml#Fn4_source)
      [5](#470763_1_En_6_Chapter.xhtml#Fn5_source)   [6](#470763_1_En_6_Chapter.xhtml#Fn6_source)
      [7](#470763_1_En_6_Chapter.xhtml#Fn7_source)   [8](#470763_1_En_6_Chapter.xhtml#Fn8_source)
      [9](#470763_1_En_6_Chapter.xhtml#Fn9_source)   [10](#470763_1_En_6_Chapter.xhtml#Fn10_source)'
