    *   `/x\z/` matches strings that end with `x`.


    Whenever `^` and `$` formulate restrictions defined on lines, you use the `\A`
    and `\z` or `\Z` characters, respectively, for the strings containing all lines
    in many PCRE-based languages.


    This is not a generic rule, because in JavaScript, `\A` means the literal character
    `A`. JavaScript uses the word boundary assertion `\b` to test for the start or
    end of a word.


    *   `/\bx/` matches words starting with `x`.


    *   `/x\b/` matches words ending with `x`.


    Furthermore, in JavaScript, the `m` multiline modifier redefines `^` and `$` to
    assert the start and end of a line, respectively. You will learn about the multiline
    modifier in the next chapter.


    In EMACS,


    *   ``/\`x/`` matches strings that start with `x`.


    *   `/^x/` matches lines that start with `x`.


    *   `/x\''/` matches strings that end with `x`.


    *   `/x$/` matches lines that end with `x`.


    In VIM,


    *   `/\%^x/` matches strings that start with `` `x` ``.


    *   `/^x/` matches lines that start with `` `x` ``.


    *   `/x\%$/` matches strings that end with `` `x` ``.


    *   `/x$/` matches lines that end with `` `x` ``.


    In Perl 6,


    *   `` `/^x/` `` matches strings that start with `` `x` ``.


    *   `` `/x$/` `` matches strings that end with `` `x` ``.


    *   `` `/^^x/` `` matches lines that start with `` `x` ``.


    *   `` `/x$$/` `` matches lines that end with `` `x` ``.


    You can conclude that anchored start and end characters may behave completely
    differently in different dialects. Always check your documentation and test your
    work before relying on these assertions.


    **Exercise 1**: Which of the following strings does `/^list`|`lost`|`lust$/` match
    in JavaScript, and why?


    *   `list,`


    *   `lostlist,`


    *   `listlist,`


    *   `lustlist?`


    **Solution**: Surprisingly, the answer is, the first three strings match. Here’s
    the proof:


    ```

    > ''list''.match( /^list|lost|lust$/ )

    ["list", index: 0, input: "list"]

    > ''lostlist''.match( /^list|lost|lust$/ )

    ["lost", index: 0, input: "lostlist"]

    > ''listlist''.match( /^list|lost|lust$/ )

    ["list", index: 0, input: "listlist"]

    > ''lustlist''.match( /^list|lost|lust$/ )

    null

    ```


    You may have erroneously thought that the regular expression matches strings `''list''`,
    `''lost''`, and `''lust''`, and nothing else, because the start and the end of
    the string are all anchored.


    If you expected only `list` to match the regular expression, recall a sentence
    from the alternative execution section: the pipe operator has the lowest precedence
    out of all operators in regular expressions.


    The `|` operator has the lowest precedence, which means that both the `^` and
    the `$` bind stronger. If you use parentheses to highlight the natural precedence,
    you get the following expression:


    ```

    /(^list)|lost|(lust$)/

    ```


    This expression reads as follows: you match any string that


    *   Either starts with `list`


    *   Or contains `lost`


    *   Or ends with `lust`


    The second string, `''lostlist''`, matches this expression, because it contains
    `lost`. The third string, `''listlist''`, matches this expression because it starts
    with `list`.


    The fourth string, `''lustlist''`, does not match this expression because it does
    not start with `list`, does not contain `lost`, and does not end with `lust`.


    If you want to limit your matches to exclusively `list`, `lost`, and `lust`, you
    have to use parentheses.


    ```

    /^(list|lost|lust)$/

    ```


    After adding parentheses, only the first string matches the expression.


    ```

    > ''list''.match( /^(list|lost|lust)$/ )

    ["list", index: 0, input: "list"]

    > ''lostlist''.match( /^(list|lost|lust)$/ )

    null

    > ''listlist''.match( /^(list|lost|lust)$/ )

    null

    > ''lustlist''.match( /^(list|lost|lust)$/ )

    null

    ```


    When using anchor characters with `|`, always denote your intended precedence
    with parentheses, even if your intentions are obvious to you and even if the usage
    of parentheses is redundant. This way, your expressions will become more maintainable.


    ## Modifiers


    It is possible to add different modifiers to a regular expression to change the
    way the expression is interpreted and executed. Modifiers are typically written
    after the end of the expression.


    The bad news is different regular expression implementations come with different
    modifiers. The good news is before working with a language, you can look up and
    get used to the modifiers available in your language.


    Table [2-3](#470763_1_En_2_Chapter.xhtml#Tab3) shows some examples of modifiers.


    Table 2-3


    Modifiers


    | Modifier | Semantics |

    | --- | --- |

    | `g` | Global matching, which does not return after the first match. |

    | `m` | Multiline matching to make `^` and `$` match the start and end of a line
    instead of the start and the end of the whole string. |

    | `s` | Single-line mode. The character `.` matches all characters including `\n`.
    |

    | `i` | Case-insensitive matching. |

    | `x` | Ignore whitespace characters. This option turns on free spacing mode.
    |

    | `u` | Match with full Unicode. |


    These flags are not universal. For instance, the `x` flag is not available in
    JavaScript. The `g` flag is not available in PHP because global mode can be accessed
    only by invoking a different matcher function.


    Let’s see the effects of case-insensitive mode in the JavaScript console:


    ```

    > /re/.test( ''Regex'' );

    false

    > /re/i.test( ''Regex'' );

    true

    ```


    Case-insensitive mode treats the string as case insensitive, matching the sequence
    `Re` with the regular expression `/re/i`.


    For now, you can assume `/re/i` and `/(r`|`R)(e`|`E)/` are equivalent. This is
    not exactly true because of two reasons affecting efficiency.


    *   You will later learn a more optimal way of representing character sets representing,
    for example, a character from the set `{r, R}`.


    *   You will learn the secondary function of parentheses used for capturing substrings,
    which may drastically slow down regular expressions.


    Don’t worry about performance considerations in this section. Focus on getting
    the syntax right.'
  trans: '

    # 运算符优先级与括号


    连接运算的优先级高于选择运算。你可以将连接运算视为乘法，将选择运算视为加法。在表达式`/a`|`the/`中无需使用括号，因为连接运算的优先级更高。同理，计算`1
    + 2 * 3 = 1 + 6 = 7`时也不需要括号。


    有时你需要覆盖默认的优先级规则，此时括号就派上了用场。你可以使用括号对低优先级的表达式进行分组。


    例如，表达式`/list`|`lost`|`lust/`可以简化为`/l(i`|`o`|`u)st/`。你可以使用任意数量的嵌套括号进行分组。


    在 VIM 和 EMACS 中，不要忘记对括号进行转义。


    为完整起见，需注意括号的用法可能产生重载。括号将用于从正则表达式中*捕获*子字符串。你将在后续阶段探索这一用例。


    括号是元字符，不会消耗正则表达式测试字符串中的任何字符。还有许多其他命令也不会在字符串内部进行遍历。例如，下一节你将学习到同样不消耗字符的定位起始锚点和结束锚点。


    # 定位起始锚点和结束锚点


    在某些方言（如 JavaScript）中，`^`和`$`符号表示待匹配字符串的起始和结束。而在其他环境（如 EMACS 和 VIM）中，`^`和`$`符号表示待匹配行的起始和结束。


    在 BRE、ERE、多数基于 PCRE 的语言以及 Perl 6 中：


    * `/^x/` 匹配以`x`开头的字符串。

    * `/x$/` 匹配以`x`结尾的字符串。

    * `/^x$/` 匹配只包含字符`''x''`的字符串。


    在某些基于 PCRE 的语言中，上述字符仅表示行的边界断言。例如在 Ruby 中：


    * `/^x/` 匹配以`x`开头的行。

    * `/x$/` 匹配以`x`结尾的行。

    * `/\Ax/` 匹配以`x`开头的字符串。

    * `/x\z/` 匹配以`x`结尾的字符串。


    当`^`和`$`对行边界进行限制时，在多数基于 PCRE 的语言中，对于包含多行的字符串，你可以分别使用`\A`和`\z`或`\Z`字符。


    这不是通用规则，因为在 JavaScript 中，`\A`表示字面字符`A`。JavaScript 使用单词边界断言`\b`来测试单词的起始或结束。


    * `/\bx/` 匹配以`x`开头的单词。

    * `/x\b/` 匹配以`x`结尾的单词。


    此外，在 JavaScript 中，多行修饰符`m`会重新定义`^`和`$`，使其分别匹配行的起始和结束。你将在下一章学习多行修饰符。


    在 EMACS 中：


    * ``/\`x/`` 匹配以`x`开头的字符串。

    * `/^x/` 匹配以`x`开头的行。

    * `/x\''/` 匹配以`x`结尾的字符串。

    * `/x$/` 匹配以`x`结尾的行。


    在 VIM 中：


    * `/\%^x/` 匹配以`x`开头的字符串。

    * `/^x/` 匹配以`x`开头的行。

    * `/x\%$/` 匹配以`x`结尾的字符串。

    * `/x$/` 匹配以`x`结尾的行。


    在 Perl 6 中：


    * `/^x/` 匹配以`x`开头的字符串。

    * `/x$/` 匹配以`x`结尾的字符串。

    * `/^^x/` 匹配以`x`开头的行。

    * `/x$$/` 匹配以`x`结尾的行。


    你可以得出结论：定位起始锚点和结束锚点字符在不同方言中的行为可能完全不同。在依赖这些断言前，务必查阅文档并测试你的代码。


    **练习 1**：在 JavaScript 中，`/^list`|`lost`|`lust$/`会匹配以下哪些字符串？为什么？


    * `list,`

    * `lostlist,`

    * `listlist,`

    * `lustlist?`


    **解答**：令人惊讶的答案是，前三个字符串都能匹配。以下是验证结果：


    ```

    > ''list''.match( /^list|lost|lust$/ )

    ["list", index: 0, input: "list"]

    > ''lostlist''.match( /^list|lost|lust$/ )

    ["lost", index: 0, input: "lostlist"]

    > ''listlist''.match( /^list|lost|lust$/ )

    ["list", index: 0, input: "listlist"]

    > ''lustlist''.match( /^list|lost|lust$/ )

    null

    ```


    你可能错误地认为该正则表达式只匹配字符串`''list''`、`''lost''`和`''lust''`，而非其他内容，因为字符串的起始和结束都被锚定了。


    如果你期望只有`list`能匹配该正则表达式，请回忆选择运算一节中的内容：管道运算符在正则表达式中是所有运算符中优先级最低的。


    `|`运算符优先级最低，这意味着`^`和`$`的绑定优先级更高。如果使用括号来突出自然优先级，你会得到以下表达式：


    ```

    /(^list)|lost|(lust$)/

    ```


    该表达式解读如下：匹配任何满足以下任一条件的字符串：


    * 以`list`开头

    * 包含`lost`

    * 以`lust`结尾


    第二个字符串`''lostlist''`能匹配，因为它包含`lost`。第三个字符串`''listlist''`能匹配，因为它以`list`开头。


    第四个字符串`''lustlist''`不匹配，因为它不以`list`开头，不包含`lost`，也不以`lust`结尾。


    如果你想将匹配范围限定为仅`list`、`lost`和`lust`，则必须使用括号。


    ```

    /^(list|lost|lust)$/

    ```


    添加括号后，只有第一个字符串能匹配该表达式。


    ```

    > ''list''.match( /^(list|lost|lust)$/ )

    ["list", index: 0, input: "list"]

    > ''lostlist''.match( /^(list|lost|lust)$/ )

    null

    > ''listlist''.match( /^(list|lost|lust)$/ )

    null

    > ''lustlist''.match( /^(list|lost|lust)$/ )

    null

    ```


    当将锚点字符与`|`一起使用时，务必使用括号标明你预期的优先级，即使你的意图显而易见，甚至括号的使用是冗余的。这样，你的表达式将更易于维护。


    # 修饰符


    可以为正则表达式添加不同的修饰符，以改变表达式的解释和执行方式。修饰符通常写在表达式结尾之后。


    坏消息是，不同的正则表达式实现带有不同的修饰符。好消息是，在使用某种语言之前，你可以查找并熟悉该语言中可用的修饰符。


    表 2-3 展示了一些修饰符的示例。


    **表 2-3** 修饰符


    | 修饰符 | 语义 |

    | --- | --- |

    | `g` | 全局匹配，在首次匹配后不会停止返回。 |

    | `m` | 多行匹配，使`^`和`$`匹配行的起始和结束，而非整个字符串的起始和结束。 |

    | `s` | 单行模式。字符`.`匹配所有字符，包括`\n`。 |

    | `i` | 不区分大小写匹配。 |

    | `x` | 忽略空白字符。此选项启用自由间距模式。 |

    | `u` | 使用完整 Unicode 匹配。 |


    这些标志并非通用。例如，`x`标志在 JavaScript 中不可用。`g`标志在 PHP 中不可用，因为全局模式只能通过调用不同的匹配器函数来访问。


    让我们在 JavaScript 控制台中查看不区分大小写模式的效果：


    ```

    > /re/.test( ''Regex'' );

    false

    > /re/i.test( ''Regex'' );

    true

    ```


    不区分大小写模式将字符串视为不区分大小写，使序列`Re`与正则表达式`/re/i`匹配。


    目前，你可以认为`/re/i`与`/(r`|`R)(e`|`E)/`是等价的。这并不完全准确，原因有二，且会影响效率：


    * 稍后你将学习一种更优的方式来表示字符集，例如表示集合`{r, R}`中的字符。

    * 你将学习括号用于捕获子字符串的次要功能，这可能会大幅降低正则表达式的速度。


    在本节中不必担心性能问题。重点在于掌握正确的语法。

