- fmt: '# Summary


    This chapter was the icing on the cake. You can be proud of yourself because now
    you not only understand regular expressions but can also write maintainable expressions.
    These skills catapult you to the top 1 percent of software developers in terms
    of regular expression usage.


    You have learned the following techniques to increase the maintainability of your
    code:


    - Using extended mode to introduce whitespaces and comments

    - Using subroutines to create named abstractions in your code

    - Using named capture groups to make the retrieval of your capture groups maintainable


    In the next chapter, you will learn how to optimize your regular expressions.


    # 10. Optimizing Regular Expressions


    You have learned all the tools to optimize the execution of a regular expression;
    therefore, this chapter acts as a summary for everything you have learned so far.


    You learned that the execution of regexes can be modeled using two types of automata:
    deterministic and nondeterministic FSM.


    The execution time of a nondeterministic automaton can be exponentially measured
    in the number of its steps. The complexity comes from the need for backtracking.


    Creating a deterministic finite state automaton from a nondeterministic automaton
    also has exponential complexity.


    In most execution environments, regular expression virtual machines follow the
    nondeterministic model. This is because success may be a lot faster than failure.
    We could just match the input in `n` steps, where `n` is the size of the input.
    If we made our execution deterministic, the state space could explode, and we
    could end up with `O(2^n)` complexity.


    Using a nondeterministic model has consequences. We will make use of these consequences
    while optimizing our regexes.


    ## Summary of the Optimization Techniques


    As complexity arises from backtracking, the intended goal of optimization techniques
    is to minimize backtracking. We will consider a few ways to do that.


    - Making character classes more specific

    - Repeating character class loops

    - Using possessive repeat modifiers

    - Using atomic groups

    - Refactoring for optimization


    Some compilers perform automatic optimizations on your regexes. The generic rule
    is that you are left on your own.


    ## Making Character Classes More Specific


    Our enemy is the `.*` pattern because in the worst case you may end up backtracking
    as many times as the length of your input.


    For instance, suppose you want to capture identifier names in between the microtemplate
    tags `${` and `}`. In this example, we assume we are looking for patterns of form
    `${ id }`, where `id` may not contain whitespaces. The following extended PCRE
    expression does the trick:


    ```

    /(?x)

    \$\{  # Consume the opening tag ${

    \s*   # Consume all whitespaces greedily

    (.+?) # Minimal match our identifier

    \s*   # Consume all remaining whitespaces greedily

    \}    # Close the tag

    /

    ```


    Notice the extended mode `(?x)`. Remember, starting a regex with `(?x)` makes
    whitespace characters not match themselves and allows you to place comments in
    the expression followed by a `#` character until a newline character.


    As we are looking for identifier characters, we are sure that these characters
    are not whitespaces, and they are not closing braces either. Therefore, it is
    a luxury to use the arbitrary character class here. We can make our expression
    more deterministic by changing `.+?` to a more specific character class: `[^\s\}]`.


    ```

    /(?x)

    \$\{        # Consume the opening tag ${

    \s*         # Consume all whitespaces greedily

    ([^\s\}]+)  # Minimal match our identifier

    \s*         # Consume all remaining whitespaces greedily

    \}          # Close the tag

    /

    ```


    Notice that we now have the luxury to use a greedy repeat modifier because it
    does not matter whether we are greedy or lazy. In fact, our best bet is just to
    go for a possessive repeat modifier, but let’s not jump ahead of ourselves too
    much.


    ### Tip


    When using alternative execution or a character class, none of the choices in
    the alternation may start with the same character as the character followed by
    the alternation.


    Avoid `[xy]*x`. Understand the requirements better because there is almost always
    an easier solution: `/[xy]*x/` matches a substring of the input that contains
    `x` and `y` characters only and ends with `x`. If we just check for the existence
    of such a pattern, checking for `/y*x/` is sufficient.


    If our task is to verify `/^[xy]*x$/`, go for `/^(y*+x)*+$/`. We possessively
    match any number of `y` characters, followed by an `x`. We look for as many of
    these patterns as possible. As we used possessive matching everywhere, there is
    absolutely no backtracking present in this expression. To allow the usage of possessive
    loops, we had to eliminate the `[xy]` character set by factoring `x` out of it.


    ## Repeating Character Class Loops


    Avoid repeating the same character class loop, regardless of whether you use the
    greedy or lazy version.


    ```

    /(?x)

    \$\{   # Consume the opening tag ${

    \s*    # Consume all whitespaces greedily

    (.+?)  # Minimal match our identifier

    \s*    # Consume all remaining whitespaces greedily

    \}     # Close the tag

    /

    ```


    Here, `(\s*)(.+?)(\s*)` is an invitation for trouble. If, for any reason, we don’t
    find the `}` character in our input string, the regular expression goes into backtracking
    hell and tries every possible combination of including each possible sequence
    of whitespace characters either in one of the `\s*` patterns or in the `.+?` pattern.


    You have already seen a possible solution to eliminate this backtracking hell.


    ```

    /(?x)

    \$\{        # Consume the opening tag ${

    \s*         # Consume all whitespaces greedily

    ([^\s\}]+)  # Minimal match our identifier

    \s*         # Consume all remaining whitespaces greedily

    \}          # Close the tag

    /

    ```


    By making the character class in the middle distinct from the other two, we will
    not allow the regex VM to go on a Don Quixote windmill fight of trying to determine
    where our whitespaces belong.


    To eliminate all backtracking whatsoever, we can use another technique, covered
    next.


    ## Use Possessive Repeat Modifiers Whenever Possible


    Possessive repeat modifiers never backtrack by definition; they fail instead.
    In exchange for eliminating backtracking, we limit the state space by not exploring
    the backtracking branches at all.


    ```

    /(?x)

    \$\{        # Consume the opening tag ${

    \s*+        # Consume all whitespaces greedily

    ([^\s\}]+)  # Minimal match our identifier

    \s*+        # Consume all remaining whitespaces greedily

    \}          # Close the tag

    /

    ```


    Here the regex engine won’t even try backtracking in the case of the `\s*+` pattern.
    This is because we as humans know that if there is no `}`, it does not matter
    how we match the whitespaces. Therefore, we can simply accelerate the failure.


    Remember the rule for discovering the opportunity to add possessive repeat modifiers:


    - If the character following the possessive loop is mutually exclusive with the
    first character of the pattern inside the loop, then you may consider using a
    possessive loop.'
