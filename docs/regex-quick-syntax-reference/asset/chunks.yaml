- fmt: '# Use Atomic Groups


    Not only loops but also alternations can backtrack in an inefficient way. We might
    have already matched a node in an alternation, just to find that at a later stage
    we examine the same character, trying to match other branches of the same alternation.


    I can illustrate atomic groups with an easy example from my personal life. I tend
    to lose stuff easily. Sometimes I go look for my stuff in my house. For instance,
    suppose I am looking for my phone. I look at the `table`, my `pocket`, and also
    the `kitchen`.


    Once I find my phone, I check whether I have an appointment. I have appointments
    on Tuesday. If the day does not match, I don’t need my phone anymore.


    The following regular expression captures first me looking for my phone and then
    checking the day:


    ```

    /(?>table|pocket|kitchen) --> Tuesday/

    ```


    Suppose on `Wednesday` I find my phone in my pocket, and then I figure out it’s
    not `Thursday`, so I have to backtrack. Then I go back and look for my phone in
    the `kitchen`. This doesn’t make any sense! Once I have found my phone, it would
    make sense to stop looking for my phone. This is what atomic groups solve.


    For instance, suppose you would like to get an exact match for `list`, `lost`,
    or `lust`. In PCRE,


    ```

    /^(list|lost|lust)$/

    ```


    Suppose we are trying to match the text `lists`. We start at the first branch
    of the alternation and match `list` completely. Given we have yet to parse an
    `s` character instead of terminating the sequence, we backtrack. Now we are back
    to square one, with the string `lists`, and we try to match it against `lost`.
    After consuming the `l` character, we have to backtrack. In the third branch,
    the same thing happens: we match the `l` character just to conclude that we need
    an `i` instead of a `u`.


    This time, we got away with unnecessary backtracking cheaply. Imagine, though,
    what happens if backtracking operations are nested. What happens if there is a
    complex subexpression in the place of the `l` character. We can waste a lot of
    resources.


    This is why it makes perfect sense to treat this alternation in a possessive way.
    Both PCRE and Perl 6 make it possible to create atomic groups, also known as possessive
    groups. In a possessive group, if any of the branches match, execution does not
    go back to try another branch. If we try to backtrack into a possessive group,
    we automatically fail the expression. Once you leave a possessive group, you cannot
    backtrack into it.


    ```

    PCRE:    /(?> a|b)/

    Perl 6:  / [ a|b ]: /

    ```


    Notice that in Perl 6, the colon is consistent for loops and alternations. Perl
    6 appears to be cleaner than PCRE in this sense. In most programming languages,
    we still deal with the PCRE syntax, so you will have to get used to the PCRE syntax
    if you want to use possessive groups.


    If you have ever written Prolog programs, a possessive group is like the cut (`!`)
    operation. It cuts execution branches from the theorem proving tree.


    - Use possessive groups whenever all alternatives in an or construct are mutually
    exclusive.


    Let’s finish with the execution of our previous example. We try to match `lists`
    against the regex.


    ```

    /^(?> list|lost|lust)$/

    ```


    We are in the first branch and match `list`. We leave the possessive alternation.
    There is still an `s` character left, and given we were supposed to be at the
    end of the string, we backtrack. Given we cannot backtrack into the possessive
    group, this regular expression fails to match `lists`. Problem solved.


    # Refactor for Optimization


    We saw this optimization technique in action when we first introduced the `list`,
    `lost`, `lust` example. We can factor out common characters at the beginning and
    at the end of the expression. This regex


    ```

    /^(list|lost|lust)$/

    ```


    becomes the following:


    ```

    /^l(i|o|u)st$/

    ```


    Matching also becomes more efficient because after backtracking, we don’t have
    to match the same character over and over again.


    Once you have only one character in each branch of your alternation, you can use
    character sets for higher efficiency.


    ```

    /^l[iou]st$/

    ```


    # Optimization Techniques Limit Nondeterministic Execution


    Optimization techniques are all about cutting down execution paths from an execution
    tree. You can optimize an expression up to the extent that it becomes deterministic.


    A necessary condition for creating a deterministic execution plan of a regular
    expression is to:


    - Factor out all prefixes in alternations

    - Make all your loops and alternations possessive


    # Summary


    After learning how to write maintainable regular expressions, the next task was
    to write efficient regexes. I covered the following optimization techniques:


    - Making character classes more specific

    - Repeating character class loops

    - Using possessive repeat modifiers

    - Using atomic groups

    - Refactoring for optimization


    All of these optimization techniques are geared toward making execution of your
    regular expressions more deterministic.


    # 11. Parsing HTML Code and URL Query Strings with Regular Expressions


    In this chapter, we will use JavaScript to parse an HTML document and process
    the query string of a URL.


    ## Parsing HTML Tags


    **Exercise 1**: Suppose an HTML document is given. Extract all the `<td>` tags
    using a regular expression, and print their content to the console. You can assume
    any content including newline characters inside the `<td>` tags. The `<td>` tags
    may have attributes.


    **Example Input:**


    ```javascript

    const table = `


    text 1

    text 2


    text trés


    text 4 first line

    text 4 second line


    `;

    ```


    **Solution:**


    When dealing with a multiline regular expression, it is worth using the new ES2018
    `s` (`dotall`) flag to treat the whole text as a single line. Given there are
    multiple table details to match, we will definitely need to declare our regular
    expression as global using the `g` flag.


    ```javascript

    /.*/gs.exec( table )

    ```


    Let’s also add the opening and closing tags that we would like to match. Notice
    there are four distinct options matching a table detail element: `<td>`, `<Td>`,
    `<tD>`, and `<TD>`. We can match them all with just one expression, without any
    alternation or character sets, by declaring our regular expression as case insensitive
    using the `i` flag. When matching the close tag `</td>`, make sure you escape
    the slash.


    ```javascript

    /.*/gis.exec( table )

    ```


    After executing this expression, you can see that three table details got returned
    as one. There are multiple reasons for this error.


    - First, `.*` is greedy, and it matches all characters, including other `</td>`
    flags and `<td>` flags. We reduce the matched string only after backtracking character
    by character and unlooping the characters of the last `</td>` tag.

    - Second, `<td class="first">` is not matched by this regular expression because
    a greater-than symbol has to follow the `d` in the `<td>` tag according to our
    expression.


    We can solve both problems easily.


    Regarding the first problem, we can make the greedy `.*` loop lazy by adding a
    `?` after it. These mechanics will attempt a minimal match. An alternative solution
    is to change `.` to `[^<]`, but this solution would imply we cannot nest tags
    inside `<td>`, so that is not a brilliant idea.


    The second problem can be addressed by matching all characters between the `td`
    and the `>`. In this case, we know the characters we match are distinct from `>`.
    Therefore, we match any number of non-greater-than characters in a `[^>]*` loop.


    ```javascript

    /]*>.*?/gis.exec( table )

    ```


    We need one more change: we have to capture the contents of the tag so that we
    can access it and print it to the console.


    ```javascript

    let regex = /]*>(.*?)/gis

    let contents = '''';

    while ( contents = regex.exec( table ) ) {

    console.log( contents[1] );

    }

    ```


    Note the contents of the last table detail are captured as `undefined`.'
