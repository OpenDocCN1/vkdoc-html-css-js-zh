  trans: '

    # 固定范围匹配


    假设我们想匹配至少出现两次、至多出现五次的字符 `a`。不同的正则方言对此有不同的实现方式，如表 5-3 所示。


    表 5-3：匹配字符 `a` 至少两次，至多五次


    | 方言 | 表示法 |

    | --- | --- |

    | `BRE`, `EMACS` | `/a\{2,5\}/` |

    | `VIM` | `/a\{2,5}/` |

    | `ERE`, `PCRE` | `/a{2,5}/` |

    | `Perl 6` | `/ a ** 2..5 /` |


    在大多数编程语言中，我们使用 `PCRE` 方言：`/a{2,5}/`。请根据你自己的使用场景来关注。


    有限状态机的形式看起来比较冗长，因为我们需要展开每一种可能。匹配二到五次意味着我们必须为匹配两次、三次、四次和五次分别构建一条路径，如图 5-7 所示。


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig7_HTML.jpg](img/470763_1_En_5_Fig7_HTML.jpg)


    图 5-7：`/a{2,5}/`


    在实践中，大多数正则引擎将这个重复修饰符表示为 `*`（星号）。星号被解释为*任意次数*的匹配，并使用内部计数器来满足所需条件。


    请注意，可以省略范围的最大值。要匹配至少两个 `a` 字符，你必须使用表 5-4 中所示的表示法。


    表 5-4：匹配至少两个 `a` 字符


    | 方言 | 表示法 |

    | --- | --- |

    | `BRE`, `EMACS` | `/a\{2,\}/` |

    | `VIM` | `/a\{2,}/` |

    | `ERE`, `PCRE` | `/a{2,}/` |

    | `Perl 6` | `/ a ** 2..* /` |


    注意，除了 `Perl 6` 之外，所有方言中最大值都被简单地省略了，而在 `Perl 6` 中，`*` 表示任意值。


    `/a{2,}/` 的有限状态机形式比属于有界重复修饰符的 FSM 要简单得多。事实上，这个机器等价于表达式 `/aaa*/` 的 FSM，如图 5-8 所示。


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig8_HTML.jpg](img/470763_1_En_5_Fig8_HTML.jpg)


    图 5-8：`/a{2,}/`


    理论上，上限是无界的。在实践中，这个上限取决于正则虚拟机的实现。上限限制可能是一个像 `256` 这样的低数值。在其他语言中，这个值是 `32767`，这比
    2 字节无符号整数的最大值小一。在使用具有较大上限的正则表达式时要小心。


    另外请注意，在某些语言（如 `Python`）中，实际最大限制是无穷大，但如果这个限制太大，你可能会很容易遇到溢出错误。


    ## 精确循环 `n` 次


    让我们看看所有方言中表达式 `/aa/` 的简写形式，如表 5-5 所示。


    表 5-5：`/aa/` 的简写形式


    | 方言 | 表示法 |

    | --- | --- |

    | `BRE`, `EMACS` | `/a\{2\}/` |

    | `VIM` | `/a\{2}/` |

    | `ERE`, `PCRE` | `/a{2}/` |

    | `Perl 6` | `/ a ** 2 /` |


    这意味着我们精确地循环两次字符 `a`。当有一个复杂的表达式而不是 `a`，或者重复次数远大于 `2` 时，这个简写形式实际上比原版 `/aa/` 更简洁。


    属于这个循环的有限状态机非常简单，如图 5-9 所示。


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig9_HTML.jpg](img/470763_1_En_5_Fig9_HTML.jpg)


    图 5-9：`/aa/`


    如你所见，该状态机匹配了 `/aa/` 的 FSM。


    ## 贪婪重复修饰符


    你已经在表 5-1 中看到了贪婪重复修饰符的元字符。


    所有这类重复修饰符默认都是*贪婪*的。这意味着重复修饰符会从匹配字符串中消耗尽可能多的字符，然后逐字符回溯。


    举一个极端的例子，假设我们使用正则表达式 `/^.*list$/` 来匹配字符串 `''The lost list''`。


    由于 `*` 重复修饰符是贪婪的，`.*` 首先会消耗整个字符串，然后发现我们处于字符串末尾，并且还需要匹配字符 `l`。匹配失败时，我们进行回溯。


    重复修饰符以贪婪的方式消耗字符，并尽可能少地回溯。因此，我们只回溯一个字符。回溯后，`.*` 匹配 `The lost lis`，下一个要消耗的字符是 `t`。由于
    `t` 不等于 `l`，我们再次回溯。


    现在 `.*` 变成 `The lost li`，我们尝试将 `s` 与 `l` 匹配。这行不通，所以继续回溯。


    现在 `.*` 变成 `The lost l`，我们尝试将 `i` 与 `l` 匹配。这行不通，所以继续回溯。


    现在 `.*` 变成 `The lost` ，我们尝试将 `l` 与 `l` 匹配。这次匹配成功，所以我们继续用正则表达式模式的剩余部分匹配字符串的剩余部分。由于我们成功匹配了整个字符串并到达了末尾，我们成功退出正则匹配。


    在这个例子中，我们只回溯了四次。但想象一下，如果我们有数兆字节的文本，一个 `.*` 结构可能会在评估正则表达式剩余部分之前读取整个文件。因此，使用 `.*`
    之类的结构要格外小心。几乎总有一种更优的方式来描述一个模式。


    引入回溯是因为我们的状态机是非确定性的。在 `/^.*list$/` 中，每一步，只要我们处于 `.*` 循环中并且即将遇到一个 `l` 字符，我们就必须决定是匹配一个
    `.` 字符还是匹配一个 `l`。正是这种非确定性导致了回溯。


    对抗回溯的一种方法是使非确定性状态机变得确定。这可能需要对输入的大小执行指数级别的步骤。只有极少数正则虚拟机会这样做，因为这种努力通常得不偿失。


    另一种解决方案是使用按照不同策略进行匹配和回溯的循环。

    '
- fmt: '# Lazy Repeat Modifiers


    You have seen that greed sometimes leads to bad performance. What you have not
    seen is the relationship between greed and correctness. Greed can sometimes lead
    to incorrect results.


    For instance, suppose you want to create a global regular expression in JavaScript
    that matches *all* questions in a Spanish text. In Spanish, the syntax of a question
    is as follows:


    ```

    ¿?

    ```


    Assuming there are no newline characters, it makes sense to match a sentence using
    the following regular expression:


    ```

    let regex = /¿.+\?/g

    ```


    Let’s test our regex on some questions.


    ```

    let text = ''¿Tienes animals en casa? ¿Dónde está la biblioteca?'';

    > text.match( regex );

    ["¿Tienes animals en casa? ¿Dónde está la biblioteca?"]

    ```


    Oops, something seems to be wrong. Both questions were returned as one result.
    Why?


    Because our `.+` repeat modifier is greedy, that’s why! `.+` doesn’t care that
    a `\?` character is coming. We read the question mark as an arbitrary character.


    This is why repeat modifiers have a *lazy* version of repeat modifiers in most
    dialects.


    Lazy repeat modifiers match the *minimum* number of characters that are absolutely
    necessary by executing the body of the repeat modifier as few times as possible.
    Once the expression fails and we have to backtrack, we now add characters instead
    of removing them.


    The syntax of lazy repeat modifiers is as follows: in EMACS, PCRE, and Perl 6,
    we simply add a question mark (`?`) after the repeat modifier.


    * `a*?` matches zero or more `a` characters and attempts to match as few `a` characters
    as possible.

    * `a+?` matches one or more `a` characters and attempts to match as few `a` characters
    as possible.

    * `a??` matches zero or one `a` characters, first attempting not to match the
    `a` character.

    * `a{1,2}?` attempts to match the `a` character once or twice, first trying to
    match it once. In Perl 6, the equivalent syntax is `a **? 1..2`.


    Let’s see our JavaScript example:


    ```

    let regex = /¿.+?\?/g

    let text = ''¿Tienes animals en casa? ¿Dónde está la biblioteca?'';

    text.match( regex );

    ```


    The return value matches the two sentences properly.


    ```

    (2) ["¿Tienes animals en casa?", "¿Dónde está la biblioteca?"]

    ```


    Note that regardless if you want to use greedy or lazy repeat modifiers, it makes
    sense to restrict the search space. We can exclude the first character following
    the repeat modifier from the possible first characters inside the repeated sequence.
    This means we are better off excluding the `\?` character from the arbitrary `.`
    character class. We can perform the exclusion by defining the `[^\?]` character
    set. Read it as “an arbitrary character except the question mark.”


    ```

    regex = /¿[^\?]+\?/g;

    > text.match( regex )

    (2) ["¿Tienes animals en casa?", "¿Dónde está la biblioteca?"]

    ```


    ### Tip


    Always attempt to make the first character of the sequence inside the repeat modifier
    body and the first character after the repeat modifier mutually exclusive to avoid
    nondeterministic branching and backtracking.


    Now we have the two sentences one by one, as two separate matches of the global
    regular expression. To get some more practice with lazy repeat modifiers, let’s
    match `/^.*?list$/` against the text `The lost list`.


    * `The` is matched by `.*`, before we attempt to match `list$` on `lost list`.
    We do consume `l` from the string, but then, the letter `o` does not match `i`
    from the pattern, so we backtrack.

    * `The lost` is matched by `.*`. We now attempt to match the `list$` pattern with
    `list`. We succeed. No more backtracking is needed.


    In this example, the result was the same, but the number of backtracking operations
    was lower.


    You may ask the question, when it is worth using a lazy repeat modifier, and when
    it is worth using a greedy repeat modifier? The answer is not obvious.


    * You may want to use one version or another for correctness reasons. See the
    Spanish questions, for example. Whenever you have to match a pattern where there
    is a starting sign and an ending sign and the expressions may not be nested, a
    minimal loop is correct.

    * When correctness does not matter, you can sometimes intuitively figure out which
    pattern to use. Remember, a match is always cheaper than failure; therefore, it
    is worth optimizing for faster matching.


    ## Possessive Repeat Modifiers


    A possessive repeat modifier executes as a greedy repeat modifier does with one
    exception: once a possessive structure backtracks, it fails. Instead of backtracking
    just one iteration, the possessive repeat modifier just fully gives up, reverting
    all iterations. Either we greedily match as many iterations of the possessive
    loop as possible or we don’t match any iterations at all.


    Possessive repeat modifiers are available in PCRE and in Perl 6.


    In most PCRE languages, we write a `+` after the symbol of the corresponding greedy
    repeat modifier to indicate that it is possessive, yielding `a*+`, `a++`, `a?+`,
    `a{1,2}+` loops.


    In Perl 6, we write a `:` after the repeat modifier: `a*:`, `a+:`, `a?:`, `a **:
    1..2`.


    Some languages like JavaScript don’t have possessive repeat modifiers. It is still
    possible to emulate them with a construct we are not yet familiar with. Write
    down this expression: `(?=(a+))\1`. Once you know what a positive lookahead is
    and how capture groups work, you can verify that the expression `(?=(a+))\1` is
    equivalent to `a++`, assuming that there are no other open parentheses in front
    of this expression. The equivalence is not fully strict, though, because a capture
    group is introduced to construct the possessive repeat modifier. The introduced
    capture group may offset the numbering of other capture groups behind this capture
    group.


    *I encourage you to play around with possessive repeat modifiers in regex101.com.*
    ^([^(36)](#fn36)) *You can see the matching executed in a step-by-step fashion
    if you use the regex debugger belonging to the PHP (PCRE) syntax.*


    For instance, the expression `/a++b/` matches any string containing the sequence
    `ab`. The pattern `a++` matches the `a` character, and then `b` is matched.


    The expression `/a++a/` never matches any strings. This is because `a++` is possessive,
    so it eats up all the `a` characters before attempting to match another `a` character.
    As this `a` character is never found, the regex engine backtracks fully and fails.
    Unlike `/a+a/`, we cannot backtrack just one character in `/a++a/`. Therefore,
    no strings will ever match the regex `/a++a/`.


    As a rule of thumb, we can conclude that the first character of the sequence we
    are trying to match in a possessive repeat modifier may never follow the repeat
    modifier itself. Otherwise, we will never get a match.'
