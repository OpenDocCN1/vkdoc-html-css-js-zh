- fmt: '# Multiline Matches


    Let’s execute a multiline example. The regular expression


    ```

    > xRow = /^x+$/m

    ```


    defines that each row of a possibly multiline string can contain only lowercase
    `x` characters, and each row has to contain at least one `x` character. The `^`
    character indicates that each row has to start with the specified regex sequence.
    The `$` character indicates that each row has to end with the specified regex
    sequence.


    The `match` function specifies that the first row of the string matches all the
    specified criteria.


    ```

    ''xx\nxXx\nxxxx''.match( xRow )

    ["xx", index: 0, input: "xxxXxxxxx"]

    ```


    If you want to retrieve all matches, you have to add the global flag to the regular
    expression. This expression matches the first and third rows of the string, ignoring
    the second row:


    ```

    ''xx\nxXx\nxxxx''.match( /^x+$/mg )

    ["xx", "xxxx"]

    ```


    Without the flags, the newline characters count as whitespace. As whitespace characters
    are not equal to `x`, the string does not match the regular expression.


    ```

    ''xx\nxXx\nxxxx''.match( /^x+$/ )

    null

    ```


    As you can see, without the multiline flag, the `^` and `$` characters indicate
    that the whole string may only contain characters specified by the pattern `x+`.


    # ES6 Unicode Regular Expressions


    In ES6, you can specify Unicode characters for matching. A Unicode character is
    treated as one character regardless of the number of bytes the character occupies.


    ```

    > ''x''.codePointAt( 0 ).toString( 16 )

    "78"

    ```


    The hexadecimal code of the `x` character is `78`. The corresponding Unicode character
    in JavaScript is `\u{78}`. However, a regular expression containing this Unicode
    character does not match the character itself.


    ```

    > /\u{78}/.test( ''x'' )

    false

    ```


    This is why you need the `u` flag.


    ```

    > /\u{78}/u.test( ''x'' )

    true

    ```


    Another problem with Unicode characters is that their size in bytes may vary.
    For instance, `''\u{2ABCD}''` is a Unicode character that cannot be represented
    using 4 bytes.


    Let’s construct a regular expression that checks whether the corresponding string
    contains exactly one character. You can do this using the arbitrary character
    symbol `.`. You can specify that your string starts with this character, ends
    with this character, and has nothing in between: `/^.$/`.


    Let’s test under what conditions does the string `''\u{2ABCD}''` match this regex:
    `/^.$/`. As this book is not able to handle long Unicode characters, I will give
    you both a screenshot (see Figure [3-1](#470763_1_En_3_Chapter.xhtml#Fig1)) and
    the code. The Unicode character will be a rectangle in the code.


    ![../images/470763_1_En_3_Chapter/470763_1_En_3_Fig1_HTML.jpg](images/470763_1_En_3_Chapter/470763_1_En_3_Fig1_HTML.jpg)


    Figure 3-1


    Unicode flag for JavaScript regular expressions


    ```

    > /^.$/.test( ''▯'' )

    false

    > /^.$/u.test( ''▯'' )

    true

    > /^.$/.test( ''\u{2ABCD}'' )

    false

    > /^.$/u.test( ''\u{2ABCD}'' )

    true

    ```


    We can conclude that the old JavaScript regex engine interprets `''\u{2ABCD}''`
    as a sequence of two characters. However, with the `u` flag, the long Unicode
    character is recognized as a single character.


    # Sticky Matches


    The `y` flag sets the `lastIndex` property of a regular expression after a match
    to the first character after the last matched sequence. If the last execution
    of the regular expression resulted in no matches, `lastIndex` is set to `0`.


    This is a mutation of the internal state of the regular expression. Always be
    aware of this side effect! When the `y` flag is on, a `^` is automatically added
    to the beginning of the regular expression. This means the character at position
    `lastIndex` has to match the start of the regular expression.


    Here’s an example:


    ```

    > regExp = /ab+/y

    /ab+/y

    > ''ababbabbb''.match( regExp )

    { 0:"ab", index: 0, input: "ababbabbb" }

    > regExp.lastIndex


    > ''ababbabbb''.match( regExp )

    { 0: "abb", index: 2, input: "ababbabbb" }

    > regExp.lastIndex


    > ''ababbabbb''.match( regExp )

    { 0:"abbb", index: 5, input: "ababbabbb" }

    > regExp.lastIndex


    > ''ababbabbb''.match( regExp )

    null

    > regExp.lastIndex


    > ''ababbabbb''.match( regExp )

    { 0: "ab", index: 0, input: "ababbabbb" }

    > regExp.lastIndex


    // ...

    ```


    # Summary


    Regular expressions in JavaScript have some unique features worth experimenting
    with. Some of these features are unique in the JavaScript regular expression virtual
    machine. Other features are common to other languages.


    I didn’t focus on the exact syntax of the regex patterns here because you will
    learn the exact rules at a later stage. Some characters, such as the `+` (at least
    once) meta character, act as foreshadowing for the capabilities of regular expressions
    in most languages.


    You learned that regular expressions are objects in JavaScript, and they are integrated
    into some `String` methods as well.


    The `RegExp` public interface allows testing a string, finding the first match,
    finding all matches, replacing substrings, and even splitting strings.


    To perform some of these use cases, you can use some modifiers such as the global
    `g` modifier, the sticky `y` modifier, or the multiline `m` modifier.


    Two more modifiers make it more convenient to process strings: `i` makes the string
    insensitive to uppercase or lowercase, while `u` makes the JavaScript regex virtual
    machine handle Unicode characters properly.


    # Other PCRE-Based Regex Environments


    JavaScript regular expressions are based on the PCRE dialect as well as the regex
    execution environments of most programming languages. We will now explore how
    to execute regular expressions in some of the most popular languages.


    Given that in the case of most languages executing regular expressions is not
    as easy as in JavaScript, we will use some tools that make it possible to execute
    and test regular expressions in the browser.


    When you want a quick solution for generating code for matching regular expressions,
    head over to the code generator of `regex101.com`.^([²](#fn2))'
