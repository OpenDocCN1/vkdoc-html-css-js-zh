    # 1. An Introduction to Regular Expressions


    I still remember my doomed encounters with regular expressions back when I tried
    to learn them. In fact, I took pride in not using regular expressions. I always
    found a long workaround or a code snippet. I projected and blamed my own lack
    of expertise on the hard readability of regular expressions. This process continued
    until I was ready to face the truth: regular expressions are powerful, and they
    can save you a lot of time and headache.


    Fast-forward a couple of years. People I worked with encountered the same problems.
    Some knew regular expressions, and others hated them. Among the haters of regular
    expressions, it was quite common that they actually liked the syntax and grammar
    of their first programming language. Some developers even took courses on formal
    languages. Therefore, I made it my priority to show everyone a path toward their
    disowned knowledge to master regular expressions.


    ## Why Are Regular Expressions Important?


    In today’s world, we have to deal with processing a lot of data. Accessing data
    is not the main problem. Filtering data is. Regular expressions provide you with
    one type of filter that you can use to extract relevant data from the big chunks
    of data available to you. For instance, suppose you have an XML file containing
    4GB of data on movies. Regular expressions make it possible to query this XML
    text so that you can find all movies that were filmed in Budapest in 2016, for
    instance.


    Regular expressions are a must-have for software developers.


    In front-end development, we often validate input using regular expressions. Many
    small features are also easier with regular expressions, such as splitting strings,
    parsing input, and matching patterns.


    When writing backend code, especially in the world of data science, we often search,
    replace, and process data using regular expressions. In IT infrastructure, regular
    expressions have many use cases. VIM and EMACS also come with regex support for
    finding commands, as well as editing text files.


    Regular expressions are everywhere. These skills will come handy for you in your
    IT engineering career.


    ## What Are Regular Expressions?


    Regular expressions, or *regexes*, come from the theory of formal languages. In
    theory, a *regex* is a finite character sequence defining a search pattern. We
    often use these search patterns to


    - Test whether a string matches a search expression

    - Find some characters in a string

    - Replace substrings in a string matching a regex

    - Process and format user input

    - Extract information from server logs, configuration files, and text files

    - Validate input in web applications and in the terminal


    A typical regular expression task is *matching*. I will now use JavaScript to
    show you how to test-drive regular expressions because almost everyone has access
    to a browser. In the browser, you have to open the Developer Tools. In Google
    Chrome, you can do this by right-clicking a web site and selecting Inspect. Inside
    the Developer Tools, select the Console tab to enter and evaluate your JavaScript
    expressions.


    Suppose there is a JavaScript regular expression `/re/`. This expression looks
    for a pattern inside a string, where there is an `r` character, followed by an
    `e` character. For the sake of simplicity, suppose our strings are case sensitive.


    ```

    const s1 = ''Regex'';

    const s2 = ''regular expression'';

    ```


    In JavaScript, strings have a `match` method. This method expects a regular expression
    and returns some data on the first match.


    ```

    > s1.match( /re/ )

    null

    > s2.match( /re/ )

    ["re", index: 0, input: "regular expression"]

    ```


    A regular expression is an expression written inside two slash (`/`) characters.
    The expression `/re/` searches for an `r` character followed by an `e` character.


    As an analogy, imagine that you loaded a web site in the browser, pressed Ctrl+F
    or Cmd+F to find a substring inside the web site on the screen, and started typing
    `re`. The regular expression `/re/` does the same thing inside the specified string,
    except that the results are case sensitive.


    Notice that `''Regex''` does not contain the substring `''re''`. Therefore, there
    are no matches.


    The string `''regular expression''` contains the substring `''re''` twice: once
    at position 0 and once at position 11. For the sake of determining the match,
    the JavaScript regular expression engine returns only the first match at index
    0 and terminates.


    JavaScript allows you to turn the syntax around by testing the regular expression.


    ```

    > /re/.test( s1 )

    false

    > /re/.test( s2 )

    true

    ```


    The return value is a simple Boolean. Most of the time, you do not need anything
    more, so testing the regular expression is sufficient.


    Each programming language has different syntax for built-in regex support. You
    can either learn them or generate the corresponding regex code using an online
    generator such as [`https://regex101.com/`](https://regex101.com/).'
