  trans: '

    # 懒惰重复修饰符


    你已经看到贪婪有时会导致性能不佳。但你尚未了解的是贪婪与正确性之间的关系。贪婪有时会导致错误的结果。


    例如，假设你想在 JavaScript 中创建一个全局正则表达式，用于匹配西班牙语文本中的*所有*问句。在西班牙语中，问句的语法如下：


    ```

    ¿?

    ```


    假设文本中没有换行符，那么使用以下正则表达式来匹配一个句子是合理的：


    ```

    let regex = /¿.+\?/g

    ```


    让我们在几个问句上测试这个正则表达式。


    ```

    let text = ''¿Tienes animals en casa? ¿Dónde está la biblioteca?'';

    > text.match( regex );

    ["¿Tienes animals en casa? ¿Dónde está la biblioteca?"]

    ```


    哎呀，好像哪里不对劲。两个问句被作为一个结果返回了。为什么呢？


    这是因为我们的 `.+` 重复修饰符是贪婪的！`.+` 并不关心后面会出现 `\?` 字符。我们把问号当成了一个任意字符。


    正因如此，大多数方言中的重复修饰符都提供了*懒惰*版本。


    懒惰重复修饰符会匹配*最少*的、绝对必要的字符，即尽可能少地执行重复修饰符主体中的内容。当表达式匹配失败而需要回溯时，我们不再是移除字符，而是添加字符。


    懒惰重复修饰符的语法如下：在 EMACS、PCRE 和 Perl 6 中，我们只需在重复修饰符后面加上一个问号（`?`）。


    * `a*?` 匹配零个或多个 `a` 字符，并尝试尽可能少地匹配 `a` 字符。

    * `a+?` 匹配一个或多个 `a` 字符，并尝试尽可能少地匹配 `a` 字符。

    * `a??` 匹配零个或一个 `a` 字符，首先尝试不匹配 `a` 字符。

    * `a{1,2}?` 尝试匹配一次或两次 `a` 字符，首先尝试匹配一次。在 Perl 6 中，等效的语法是 `a **? 1..2`。


    让我们来看看 JavaScript 的例子：


    ```

    let regex = /¿.+?\?/g

    let text = ''¿Tienes animals en casa? ¿Dónde está la biblioteca?'';

    text.match( regex );

    ```


    返回值正确地匹配了两个句子。


    ```

    (2) ["¿Tienes animals en casa?", "¿Dónde está la biblioteca?"]

    ```


    请注意，无论你是想使用贪婪还是懒惰的重复修饰符，限制搜索空间都是有意义的。我们可以将重复修饰符后面的第一个字符，排除在重复序列内部可能出现的第一个字符之外。这意味着我们最好将
    `\?` 字符从任意的 `.` 字符类中排除掉。我们可以通过定义 `[^\?]` 字符集来实现排除。可以将其理解为“除了问号之外的任意字符”。


    ```

    regex = /¿[^\?]+\?/g;

    > text.match( regex )

    (2) ["¿Tienes animals en casa?", "¿Dónde está la biblioteca?"]

    ```


    ### 提示


    始终尝试让重复修饰符主体内部序列的第一个字符与重复修饰符之后的第一个字符互斥，以避免非确定性分支和回溯。


    现在，我们得到了两个独立的句子，作为全局正则表达式的两个单独匹配。为了进一步练习懒惰重复修饰符，让我们用 `/^.*?list$/` 来匹配文本 `The
    lost list`。


    * `.*` 匹配了 `The`，然后我们尝试在 `lost list` 上匹配 `list$`。我们确实从字符串中消耗了 `l`，但紧接着字母 `o` 与模式中的
    `i` 不匹配，因此我们回溯。

    * `.*` 匹配了 `The lost`。现在我们尝试用 `list` 来匹配 `list$` 模式。匹配成功。不再需要回溯。


    在这个例子中，结果是一样的，但回溯操作的次数更少。


    你可能会问，什么时候值得使用懒惰重复修饰符，什么时候值得使用贪婪重复修饰符？答案并不显而易见。


    * 你可能出于正确性考虑而选择使用其中一种。例如，西班牙语问句的例子。每当需要匹配一个有开始标志和结束标志、且表达式可能不会嵌套的模式时，使用最小化循环是正确的。

    * 当正确性无关紧要时，你有时可以凭直觉判断使用哪种模式。请记住，匹配成功总是比匹配失败更省时；因此，值得为更快的匹配进行优化。


    ## 占有重复修饰符


    占有重复修饰符的执行方式与贪婪重复修饰符相同，但有一个例外：一旦占有结构回溯，它就会失败。占有重复修饰符不是仅仅回溯一次迭代，而是完全放弃，撤销所有迭代。我们要么贪婪地匹配尽可能多的占有循环迭代，要么完全不匹配任何迭代。


    占有重复修饰符在 PCRE 和 Perl 6 中可用。


    在大多数 PCRE 语言中，我们在相应的贪婪重复修饰符符号后添加一个 `+` 来表示其为占有模式，从而产生 `a*+`、`a++`、`a?+`、`a{1,2}+`
    这样的循环。


    在 Perl 6 中，我们在重复修饰符后添加一个 `:`：`a*:`、`a+:`、`a?:`、`a **: 1..2`。


    有些语言（如 JavaScript）没有占有重复修饰符。但仍然可以使用我们尚未了解的结构来模拟它们。写下这个表达式：`(?=(a+))\1`。一旦你了解了什么是正向先行断言以及捕获组是如何工作的，你可以验证表达式
    `(?=(a+))\1` 等价于 `a++`，前提是该表达式前面没有其他左括号。不过，这种等价并不是完全严格的，因为引入了一个捕获组来构造占有重复修饰符。这个引入的捕获组可能会使其后面的其他捕获组的编号发生偏移。


    *我鼓励你在 regex101.com 上尝试使用占有重复修饰符。* ^(³⁶) *如果你使用属于 PHP (PCRE) 语法的正则调试器，你可以看到逐步执行的匹配过程。*


    例如，表达式 `/a++b/` 匹配任何包含序列 `ab` 的字符串。模式 `a++` 匹配 `a` 字符，然后匹配 `b`。


    表达式 `/a++a/` 永远不会匹配任何字符串。这是因为 `a++` 是占有模式，它会在尝试匹配另一个 `a` 字符之前消耗掉所有 `a` 字符。由于永远找不到这个
    `a` 字符，正则引擎会完全回溯并失败。与 `/a+a/` 不同，在 `/a++a/` 中我们不能只回溯一个字符。因此，没有任何字符串能匹配正则表达式 `/a++a/`。


    根据经验法则，我们可以得出结论：我们试图在占有重复修饰符中匹配的序列的第一个字符，永远不能出现在该重复修饰符本身之后。否则，我们将永远无法得到匹配结果。

    '
- fmt: '# Summary


    Most programming languages implement *sequence*, *selection*, and *iteration*.
    While sequence and selection are obvious in regular expressions, there are many
    ways to perform iteration. You have learned five basic ways to iterate a pattern.
    The `+` symbol indicates matching a character or a sequence at least once. The
    `?` symbol matches at most once, and the `*` symbol matches any number of times.
    We can also formulate cardinality restrictions by specifying the minimum and the
    maximum of allowed occurrence count. We can also repeat a sequence exactly a specified
    number of times.


    You also used the notation `[ab]` to select either the `a` character *or* the
    `b` character. I will expand on this concept in the next chapter by introducing
    *character sets*.


    Generic repeat modifiers are greedy: they attempt to match a maximal number of
    characters. Backtracking is minimal; you remove one character from the matched
    string during each backtracking attempt.


    You can add a `?` at the end of the repeat modifier to get a lazy repeat modifier,
    which does minimal matching and increases the number of matched characters one
    by one after each backtracking.


    You can add a `+` at the end of the repeat modifier to get a possessive repeat
    modifier, which does maximal matching and fails during any backtracking attempt.


    Footnotes [1](#470763_1_En_5_Chapter.xhtml#Fn1_source)


    # 6. Character Sets and Character Classes


    The previous chapter introduced finite state machines to make regular expressions
    easier to understand. In this chapter, you will learn the tools you need to create
    more complex finite state machines to perform advanced pattern matching tasks
    with regular expressions.


    We will build on Chapter [2](#470763_1_En_2_Chapter.xhtml), assuming that you
    know how to handle literal characters, concatenation, the *or* operator, the dot
    character, grouping operators with parentheses, anchored start and end, and modifiers.


    ## Character Sets


    A character set matches strings containing any of the characters in the set.


    In Perl 6, character sets are enumerated inside `<[` and `]>`.


    In all other dialects, including all other programming languages and text editors,
    we use brackets: `[` and `]`.


    The character set for a string containing at least one binary digit is as follows:


    - `/<[01]>/` in Perl 6

    - `/[01]/` in all other dialects


    The expression `[01]` matches a `0` *or* a `1` character.


    As I have already introduced the *or* operator, it is easy to conclude that the
    previous character set is equivalent to the following:


    - `/0\|1/` in EMACS and VIM

    - `/0|1/` in ERE, Perl 6, and PCRE (including all programming languages)


    Regex engines tend to build an internal representation of sets using bitmasks.
    Therefore, checking character sets is often just as efficient as matching single
    characters.


    In the finite state machine representation, there is only one edge connecting
    two states, as shown in Figure [6-1](#470763_1_En_6_Chapter.xhtml#Fig1).


    ![../images/470763_1_En_6_Chapter/470763_1_En_6_Fig1_HTML.jpg](images/470763_1_En_6_Chapter/470763_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    `/[01]/`


    I used the `[01]` character set notation to indicate the bitmask.


    ## Character Set Ranges


    Imagine that your next task is to represent an octal digit and a hexadecimal digit.
    In PCRE, knowing what you already know, you could use the following syntax:


    - `/[01234567]/` for an octal digit

    - `/[0123456789abcdefABCDEF]/` for a hexadecimal digit


    Regular expressions allow you to define ranges using the `-` character in most
    dialects. Only Perl 6 is different, where you have to use the `..` character.^([^(37)](#fn37))


    Therefore, the octal digit becomes as follows:


    - `/<[0..7]>/` in Perl 6

    - `/[0-7]/` in all other dialects


    The range `0-7` is equivalent to `01234567`.


    The task of writing a hexadecimal digit seems to be a bit more complicated at
    first glance. Writing `/[0-9]|[a-f]|[A-F]/` is completely valid, but the syntax
    looks too complicated.


    Recalling the equivalence of ranges and their enumerations, we can conclude the
    following:


    - `0123456789` is equivalent to `0-9`.

    - `abcdef` is equivalent to `a-f`.

    - `ABCDEF` is equivalent to `A-F`.


    As a consequence, `0123456789abcdefABCDEF` is equivalent to `0-9a-fA-F`. Therefore,
    the hexadecimal digit becomes the following:


    - `/<[0..9a..fA..F]>/` in Perl 6

    - `/[0-9a-fA-F]/` in all other dialects


    ## Exclusions from Character Sets


    You saw that character sets are represented by bitmasks in most regex interpreters.
    You will now figure out how to invert these bits.


    In Perl 6, placing a `-` in front of the opening bracket inverts the character
    set. This minus meta character can also be used in front of character set classes.
    See the next section for more details on character classes.


    In all other dialects, the inverter character is the `^` operator, placed inside
    the brackets in front of the character enumeration, range, or class.


    For instance, characters that are not hexadecimal digits are defined as follows:


    - `/<-[0..9a..fA..F]>/` in Perl 6

    - `/[^0-9a-fA-F]/` in all other dialects'
  raw: '## Summary


    Most programming languages implement *sequence*, *selection*, and *iteration*.
    While sequence and selection are obvious in regular expressions, there are many
    ways to perform iteration. You have learned five basic ways to iterate a pattern.
    The + symbol indicates matching a character or a sequence at least once. The ?
    symbol matches at most once, and the * symbol matches any number of times. We
    can also formulate cardinality restrictions by specifying the minimum and the
    maximum of allowed occurrence count. We can also repeat a sequence exactly a specified
    number of times.


    You also used the notation `[ab]` to select either the `a` character *or* the
    `b` character. I will expand on this concept in the next chapter by introducing
    *character sets*.


    Generic repeat modifiers are greedy: they attempt to match a maximal number of
    characters. Backtracking is minimal; you remove one character from the matched
    string during each backtracking attempt.


    You can add a `?` at the end of the repeat modifier to get a lazy repeat modifier,
    which does minimal matching and increases the number of matched characters one
    by one after each backtracking.


    You can add a `+` at the end of the repeat modifier to get a possessive repeat
    modifier, which does maximal matching and fails during any backtracking attempt.


    Footnotes [1](#470763_1_En_5_Chapter.xhtml#Fn1_source)


    # 6. Character Sets and Character Classes


    The previous chapter introduced finite state machines to make regular expressions
    easier to understand. In this chapter, you will learn the tools you need to create
    more complex finite state machines to perform advanced pattern matching tasks
    with regular expressions.


    We will build on Chapter [2](#470763_1_En_2_Chapter.xhtml), assuming that you
    know how to handle literal characters, concatenation, the *or* operator, the dot
    character, grouping operators with parentheses, anchored start and end, and modifiers.


    ## Character Sets


    A character set matches strings containing any of the characters in the set.


    In Perl 6, character sets are enumerated inside `<[` and `]>`.


    In all other dialects, including all other programming languages and text editors,
    we use brackets: `[`and `]`.


    The character set for a string containing at least one binary digit is as follows:


    *   `/<[01]>/` in Perl 6


    *   `/[01]/` in all other dialects


    The expression `[01]` matches a `0` *or* a `1` character.


    As I have already introduced the *or* operator, it is easy to conclude that the
    previous character set is equivalent to the following:


    *   `/0\|1/` in EMACS and VIM


    *   `/0|1/` in ERE, Perl 6, and PCRE (including all programming languages)


    Regex engines tend to build an internal representation of sets using bitmasks.
    Therefore, checking character sets is often just as efficient as matching single
    characters.


    In the finite state machine representation, there is only one edge connecting
    two states, as shown in Figure [6-1](#470763_1_En_6_Chapter.xhtml#Fig1).


    ![../images/470763_1_En_6_Chapter/470763_1_En_6_Fig1_HTML.jpg](images/470763_1_En_6_Chapter/470763_1_En_6_Fig1_HTML.jpg)


    Figure 6-1


    /[01]/


    I used the `[01]` character set notation to indicate the bitmask.


    ## Character Set Ranges


    Imagine that your next task is to represent an octal digit and a hexadecimal digit.
    In PCRE, knowing what you already know, you could use the following syntax:


    *   `/[01234567]/` for an octal digit


    *   `/[0123456789abcdefABCDEF]/` for a hexadecimal digit


    Regular expressions allow you to define ranges using the `-` character in most
    dialects. Only Perl 6 is different, where you have to use the `..` character.^([^(37)](#fn37))


    Therefore, the octal digit becomes as follows:


    *   `/<[0..7]>/` in Perl 6


    *   `/[0-7]/` in all other dialects


    The range `0-7` is equivalent to `01234567`.


    The task of writing a hexadecimal digit seems to be a bit more complicated at
    first glance. Writing `/[0-9]`|`[a-f]`|`[A-F]/` is completely valid, but the syntax
    looks too complicated.


    Recalling the equivalence of ranges and their enumerations, we can conclude the
    following:


    *   `0123456789` is equivalent to `0-9`.


    *   `abcdef` is equivalent to `a-f`.


    *   `ABCDEF` is equivalent to `A-F`.


    As a consequence, `0123456789abcdefABCDEF` is equivalent to `0-9a-fA-F`. Therefore,
    the hexadecimal digit becomes the following:


    *   `/<[0..9a..fA..F]>/` in Perl 6


    *   `/[0-9a-fA-F]/` in all other dialects


    ## Exclusions from Character Sets


    You saw that character sets are represented by bitmasks in most regex interpreters.
    You will now figure out how to invert these bits.


    In Perl 6, placing a `-` in front of the opening bracket inverts the character
    set. This minus meta character can also be used in front of character set classes.
    See the next section for more details on character classes.


    In all other dialects, the inverter character is the `^` operator, placed inside
    the brackets in front of the character enumeration, range, or class.


    For instance, characters that are not hexadecimal digits are defined as follows:


    *   `/<-[0..9a..fA..F]>/` in Perl 6


    *   `/[^0-9a-fA-F]/` in all other dialects'
