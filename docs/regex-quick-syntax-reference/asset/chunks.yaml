- fmt: '# Backtracking


    When performing a match, we can match a character, a set, or a sequence of characters.
    Here are some examples:


    - `ab+` matches an `a` and then at least one `b`. Matching strings are `ab`, `abb`,
    `abbb`, and so on.

    - `[ab]+` matches any number of `a` or `b` character in any order, assuming the
    matched sequence is at least one character long. Matching strings are `a`, `b`,
    `aa`, `ab`, `ba`, `bb`, `aaa`, `aab`, and so on.

    - `(ab)+` matches at least one `ab` sequence. Matching strings are `ab`, `abab`,
    `ababab`, and so on.


    In most programming languages, we use loops for iteration. We normally execute
    a loop a fixed number of times, moving forward in execution. This is where regular
    expressions differ from other languages. Regex repeat modifiers may unloop themselves.
    The process of unlooping is called *backtracking*.


    Backtracking may occur whenever we have a degree of nondeterminism in our regular
    expression. Nondeterminism is brought by alternative execution and repeat modifiers.
    It is easy to see that selection and iteration are similar in nature. For instance,
    the repeat modifier `a+` is nothing other than an infinite sequence.


    ```

    a|aa|aaa|aaaa|aaaaa|...

    ```


    For instance, in JavaScript, suppose we are matching the `aa` string against the
    regular expression `/^[ab]+a$/`.


    ```

    > /^[ab]+a$/.test( ''aa'' )

    true

    ```


    This matching returns `true`, but the execution becomes interesting, as shown
    in Figure [5-1](#470763_1_En_5_Chapter.xhtml#Fig1).


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig1_HTML.jpg](images/470763_1_En_5_Chapter/470763_1_En_5_Fig1_HTML.jpg)


    Figure 5-1


    Backtracking in nondeterministic FSMs


    Notice that the `^` and `$` state transitions do not read any characters from
    the string, but they fix the position from which a string is parsed. The fixed
    start and end anchors guard the match state such that the whole string has to
    be parsed.


    Suppose you have a token, and you move it among the states of the automaton to
    match the previous regular expression.


    From the `start` state, the `^` anchor lets us pass at the start of the string
    to the first intermediate state. We then consume an `a` character to move to the
    middle state. Suppose we are using the loop with label `{a|b}` to consume the
    second `a` character and stay in the same state. After consuming the second `a`
    character, our string ends, and we are not in a `match` state.


    Therefore, we have to backtrack, unlooping the `[ab]+` repeat modifier once. Then
    we consume the second `a` character via the other arrow, moving us to the last
    intermediate state in the automaton. As the only arrow moving out from this state
    is the `$`, we have to check whether we have reached the end of the string. Yes,
    we have, so we successfully reach the `match` state.


    Let’s examine each repeat modifier in more depth.


    ## Match at Least Once


    In BRE, we have to use the `*` to represent the `+` repeat modifier. `a+` becomes
    `aa*`. In other words, matching an `a` character and at least zero more `a` characters
    is equivalent to matching at least one `a` character.


    In EMACS and VIM, you have to escape the `+` operator. `a+` becomes `a\+`. In
    all other dialects, we use the following:


    - `a+` to denote matching the `a` character at least once

    - `[ab]+` to denote matching the `a` or the `b` character at least once

    - `(ab)+` to denote matching the `ab` sequence at least once


    The finite state machine belonging to `a+` is as shown in Figure [5-2](#470763_1_En_5_Chapter.xhtml#Fig2).


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig2_HTML.jpg](images/470763_1_En_5_Chapter/470763_1_En_5_Fig2_HTML.jpg)


    Figure 5-2


    `/a+/`


    We first match an `a` character, and then we match any number of `a` characters.
    The next loop may be an empty transition, or we may simplify the automaton by
    matching the next character.


    For instance, we can construct two different automata for the regular expression
    `/a+b/`, as shown in Figure [5-3](#470763_1_En_5_Chapter.xhtml#Fig3) and Figure
    [5-4](#470763_1_En_5_Chapter.xhtml#Fig4).


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig4_HTML.jpg](images/470763_1_En_5_Chapter/470763_1_En_5_Fig4_HTML.jpg)


    Figure 5-4


    `/a+b/` without empty arrow


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig3_HTML.jpg](images/470763_1_En_5_Chapter/470763_1_En_5_Fig3_HTML.jpg)


    Figure 5-3


    `/a+b/` with empty arrow


    The two automata are equivalent, assuming that we can freely move forward along
    the empty arrow, without reading any characters.


    Let’s summarize the *at least once* loop for different dialects in Table [5-2](#470763_1_En_5_Chapter.xhtml#Tab2).


    Table 5-2


    At Least Once Loop


    | Dialect | Notation for the At Least Once Loop |

    | --- | --- |

    | BRE | None; use `aa*` |

    | ERE, PCRE, Perl 6 | `a+` |

    | EMACS, VIM | `a\+` |


    ## Match at Most Once: Optionals


    Optionals are not supported in BRE. Optionals have to be escaped in EMACS and
    VIM. In the rest of the dialects, optionals are written in the same way as the
    *at least once* meta character:


    - `a?` to denote matching the `a` character at most once

    - `[ab]?` to denote matching the `a` or the `b` character at most once

    - `(ab)?` to denote matching the `ab` sequence at most once


    Optionals are called optionals because either we can match them once or we don’t
    match them at all.


    The finite state machine belonging to an optional matching `a?` is shown in Figure
    [5-5](#470763_1_En_5_Chapter.xhtml#Fig5).


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig5_HTML.jpg](images/470763_1_En_5_Chapter/470763_1_En_5_Fig5_HTML.jpg)


    Figure 5-5


    `/a?/`


    Notice the empty arrow. When taking the bottom path, no characters are consumed
    from the string we attempt to match.


    ## Match Any Number of Times


    This operator is available in all dialects without escaping. The expression `a*`
    looks the same in all dialects and matches a sequence of `a` characters of any
    lengths, including the empty string. The finite state automaton form of the match
    is straightforward, as shown in Figure [5-6](#470763_1_En_5_Chapter.xhtml#Fig6).


    ![../images/470763_1_En_5_Chapter/470763_1_En_5_Fig6_HTML.jpg](images/470763_1_En_5_Chapter/470763_1_En_5_Fig6_HTML.jpg)


    Figure 5-6


    `/a*/`


    Parentheses and brackets can be used in the same way as the `+` and the operators.


    - `a*` denotes matching any number of `a` characters.

    - `[ab]*` denotes matching the `a` or `b` character any number of times.

    - `(ab)*` denotes matching the `ab` sequence any number of times.


    Don’t forget to escape the parentheses with `\(` and `\)` in EMACS and VIM.'
