- fmt: '## Summary


    This chapter covered some basic building blocks that make it possible for you
    to understand and construct basic regular expressions.


    You learned how to formulate a regular expression, what characters you can use
    as literal characters, and how to use meta characters. This chapter also introduced
    concatenation and alternative execution matching characters after each other or
    as alternatives. The `.` character was introduced as a shorthand for one arbitrary
    character.


    I concluded this chapter with anchoring the start and end of a string or a line
    and with previewing some modifiers. You will use some of these modifiers in the
    next chapter, where you will execute PCRE-based regular expressions in many different
    programming languages.


    # 3. Executing Regular Expressions


    Regular expressions can be used in different programming languages and text editors.
    As it is important to test your code in different environments, in this chapter
    you will get to know how to construct and execute regexes in your own environment.


    Don’t worry about memorizing the details in all languages. The goal in this chapter
    is to explore and play with regexes. You don’t have to put pressure on yourself
    to memorize language elements I have not yet explained in detail. Once you get
    to the verbose explanation of a feature you may not yet understand, remembering
    what you have read in this chapter will increase your familiarity with the language
    construct.


    First, you will get to know regular expressions in JavaScript in depth so that
    you can experiment with regexes in the browser. Then you will get a chance to
    use some web sites to execute regular expressions in many other programming languages.


    Once again, the mind-set of this chapter is “No pressure. Have fun.”


    ## Regular Expressions in JavaScript


    It is easy to experiment with JavaScript regular expressions, as JavaScript is
    accessible in all browsers.


    I will use the Chrome Developer Tools to execute regular expressions. The `>`
    symbol at the front of each line denotes input. The return value and console logs
    are printed after the input lines. As we are experimenting in the console, I will
    use global variables. Obviously, in the source code, using `let` and `const` is
    encouraged.


    Regular expressions can be constructed in two ways. In their literal form, a regex
    pattern can be written in between slashes (`/`), and some global modifiers can
    be added to them in the end. In their object form, you use the `RegExp` constructor
    to create regular expressions. The two forms are identical.


    ```

    > new RegExp( ''xy+'' )

    /xy+/

    ```


    The `xy+` pattern matches strings that contain an `x` character followed by at
    least one `y` character.


    JavaScript regular expressions are objects.


    ```

    > typeof /xy+/

    "object"

    ```


    The constructor function allows the runtime compilation of the expression. For
    instance, you could construct a regex pattern using a visual editor, assemble
    a string based on the visual editor, and pass it to the `RegExp` constructor as
    an argument during runtime.


    ### RegExp Methods


    There are many use cases for regular expressions in JavaScript. You can identify
    these use cases by examining the public interface of regexes, which describe the
    methods executable on `RegExp` objects.


    - `exec` executes a search returning information on a match.

    - `test` executes a search returning a Boolean indicating whether a match was
    found.

    - `toString` stringifies a regular expression.


    ```

    > /xy+/.exec( ''yyxyy'' );

    {0: "xyy", index: 2, input: "yyxyy", length: 1}

    > /xy+/.test( ''yyxyy'' );

    true

    > /xy+/.toString()

    "/xy+/"

    ```


    Notice that `exec` returns the *longest* match `xyy`, not the shortest match `xy`.
    This is because the `y+` construct acts like a loop that matches as many `y` characters
    as it finds. In other words, the `y+` construct is greedy. You will learn about
    the behavior of the `+` meta character in Chapter [5](#470763_1_En_5_Chapter.xhtml).


    Notice in the previous `test` example that from the point of view of finding a
    match, the `xy+` search expression is equivalent to using `xy`. This is because
    locating *one* `y` character implies that you can also locate *at least one*.
    Therefore, in the method `test`, `/xy+/` and `/xy/` behave in the same way. In
    other methods, `y+` finds the longest sequence of `y` characters.


    ### String Methods Accepting Regular Expressions


    Some string methods accept regular expressions as arguments.


    - `match` executes a search in the string returning information on the upcoming
    match. It’s like the `exec` method on `RegExp` objects, exchanging the object
    and the argument.

    - `search` executes a search in the string returning the index of the upcoming
    match. The returned index is `-1` if the regex pattern cannot be found in the
    string.

    - `replace` executes a search in the string and replaces the first match.

    - `split` splits a string into substrings based on a specified regex pattern.


    Here are some examples:


    ```

    > s = ''xyyzxyzz'';

    > s.match( /xy+/ );

    { 0: "xyy", index: 0, input: "xyyzxyzz", length: 1 }

    > s.search( /xy+/ );


    > s.replace( /xy+/, ''U'' )

    "Uzxyzz"

    > s

    "xyyzxyzz"

    > s.split( /xy+/ )

    ["", "z", "zz"]

    ```


    Notice that `replace` does not mutate the original string; it just returns a new
    string with the replaced values.


    The `split` method of strings is polymorphic in a sense that it accepts a string
    as well as a regular expression. In the latter case, the string split is made
    according to the longest possible matches.


    ### Regex Modifiers


    The second argument of the `RegExp` constructor function is the list of flags
    applied to the regular expression. These flags are called *modifiers*. For instance,
    for a case-sensitive search, you can apply the `i` flag.


    ```

    > x = new RegExp( ''x'' )

    /x/

    > xX = new RegExp( ''x'', ''i'' )

    /x/i

    > x.test( ''XY'' )

    false

    > xX.test( ''XY'' )

    true

    ```


    Table 3-1 describes the modifiers available in JavaScript.


    **Table 3-1 JavaScript Modifiers**


    | Modifier | Description |

    | --- | --- |

    | `i` | Non-case-sensitive matching. Uppercase and lowercase don’t matter. |

    | `g` | Global match. You attempt to find all matches instead of just returning
    the first match. The internal state of the regular expression stores where the
    last match was located, and matching is resumed where it was left in the previous
    match. |

    | `m` | Multiline match. It treats the `^` and `$` characters to match the beginning
    and the end of each line of the tested string. A newline character is determined
    by `\n` or `\r`. |

    | `u` | Unicode search. The regex pattern is treated as a Unicode sequence. |

    | `y` | Sticky search. |

    | `s` | Single-line matching. The `.` character will also match newline characters
    such as `\r` and `\n`. Available in ES2018 and newer. |


    Single-line matching is a construct that was added to the regex engine of JavaScript
    with ES2018. I will not cover this flag in this chapter. Let’s execute a few examples
    for the rest of the flags.


    ### Global Matches


    Let’s construct an example for global matching. We will find all the sequences
    of `x` characters.


    ```

    > regex = /x+/g;

    > str = ''yxxxyxyxx'';

    > regex.exec( str )

    {0: ''xxx'', index: 1, input: ''yxxxyxyxx'' }

    > regex.lastIndex


    > regex.exec( str )

    { 0: "x", index: 5, input: "yxxxyxyxx" }

    > regex.exec( str )

    { 0: "xx", index: 7, input: "yxxxyxyxx" }

    > regex.exec( str )

    null

    > str.match( /x+/ )

    {0: ''xxx'', index: 1, input: ''yxxxyxyxx'' }

    > str.match( /x+/g )

    ["xxx", "x", "xx"]

    ```


    In the `exec` example, you can see that all three matches are returned one by
    one. After the third match, `null` is returned. The `lastIndex` property of the
    global regular expression stores the position where it needs to resume execution.


    You have already learned that with string matching, the return value is similar
    to the first execution of `regex.exec`. However, with a global regex argument,
    the return value is an array containing *all* matches in sequential order.'
