    The value of `"ababb" =~ /ab+/` is `1` whenever the match is successful, `0` otherwise.
    You can also retrieve the matched string and the string before and after the match.


    ```

    if ( "ababb" =~ /ab+/ ) {

    print "Match: ", $`, "|-->|", $&, "||ab|<--|abb

    ```


    The `g` global modifier is available in Perl to retrieve all matches.


    ```

    while ( "ababb" =~ /ab+/g ) {

    print "Match: ", $`, "|-->|", $&, "||ab||abb|<--|

