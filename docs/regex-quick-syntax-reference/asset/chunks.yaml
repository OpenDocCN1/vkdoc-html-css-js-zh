- fmt: '# Character Set Classes


    The good news is that regex dialects allow us to specify character set classes
    such as digits, whitespaces, or alphanumerical characters. The bad news is each
    dialect does it differently.


    For instance, the PHP documentation enumerates the character classes available
    in PHP.


    This simplifies the hexadecimal character example originating from character set
    ranges to`/[[:xdigit:]]/`. Notice the double brackets. The outer bracket denotes
    that we define a character set. The inner bracket belongs to the named character
    class syntax.


    As a rule of thumb, always use named character classes instead of ranges and enumerations
    because named classes make it easier to read and maintain your expressions in
    the future.


    **Exercise 1**: Write PHP code matching the `''Aa5h''` string against the`/[[:xdigit:]]/`character
    set class expression. Use the output generated by`https://regex101.com`to determine
    the results. You can run your code online using the service`www.writephponline.com/`.


    **Solution:**


    ```

    $re = ''/[[:xdigit:]]/'';

    $str = ''Aa5h'';

    preg_match_all($re, $str, $matches, PREG_SET_ORDER, 0);

    // Print the entire match result

    var_dump($matches);

    ```


    After execution, we get the following response:


    ```

    array(3) {

    [0]=> array(1) { [0]=> string(1) "A" }

    [1]=> array(1) { [0]=> string(1) "a" }

    [2]=> array(1) { [0]=> string(1) "5" }

    }

    ```


    This means the regular expression successfully matches the uppercase and lowercase
    alphabetical digits as well as the numerical digit. As`h`is not a hexadecimal
    digit, no match is returned.


    **Exercise 2**: Write a regular expression in Perl 6 checking whether a string
    contains a hexadecimal character, where the alphabetical digits may be written
    only in uppercase. Use the Perl 6 documentation to research how regular expressions
    are written in Perl 6, and use the service`tio.run`to execute your code.


    **Solution:**


    According to the documentation, the code looks like the following:


    ```

    if ''XXaAXX'' ~~ m// {

    say "Matching character: " ~ $/;

    say "String before the match is: " ~ $/.prematch;

    say "String after the match is: " ~ $/.postmatch;

    say "Match start index: " ~ $/.from;

    say "Match end index: " ~ $/.to;

    }

    ```


    We will use the test string`''xxaAXX''`and expect that our regular expression
    will match only the uppercase`A`character at index 3, not the lowercase`a`character
    at index 2.


    The regular expression`/<+xdigit -lower>/`defines a character set including all
    hexadecimal characters and excluding lowercase letters. I could have used the
    abbreviation`:Ll`for denoting the`lower`class. This would have changed the regular
    expression to`/+xdigit -:Ll/`.


    The syntax of the condition is equivalent to the one in the documentation, except
    for the more verbose messages. After executing the code using`tio.run`, we get
    the following output:


    ```

    Matching character: A

    String before the match is: XXa

    String after the match is: XX

    Match start index: 3

    Match end index: 4

    ```


    Each programming language comes with its own documentation for its character classes.
    We have seen in the case of Perl 6 that some languages have a redundant notation,
    specifically, a more semantic one (`lower`) and a shorter one (`Ll`).


    In JavaScript, character classes are escape sequences. See the documentation on`developer.mozilla.org`for
    more details.


    **Exercise 3**: Formulate the Perl 6 regular expression`/<+xdigit -lower>/`in
    JavaScript.


    **Solution:**


    JavaScript does not have a hexadecimal digit class. Therefore, we will simply
    use the decimal digit class`\d`and the range`A-F`.


    The resulting regular expression is`/[\dA-F]/`.


    Always look up the documentation for the exact class names, as they differ in
    each language. Some rules of thumb still apply, such as the following:


    *   `\d`stands for a digit (`[0-9]`).

    *   `\D`stands for a nondigit character (`[^0-9]`).

    *   `\s`stands for whitespace (`\s-`in EMACS;`[\t\r\n\f]`).

    *   `\S`stands for a nonwhitespace (`\S-`in EMACS;`[ ^\t\r\n\f]`).

    *   `\w`stands for a character typically used in identifiers (`[0-9a-zA-Z_]`).

    *   `\W`stands for a nonidentifier character.


    # Concatenating Advanced Language Constructs


    We have already covered some basic use cases for concatenating regular expression
    characters. For instance, the expression`/re/`means we have to match the character`r`,
    followed by the character`e`.


    Concatenation works with any regex subexpressions. Therefore, the expression


    ```

    /\d.[^a-z][^a-z]/

    ```


    is valid in PCRE. It matches four characters, a digit, an arbitrary character,
    and two characters that are not lowercase letters.


    Special characters require special care. Suppose we would like to search for the
    expression`[(1+2)*3]^2`. If we fire up our JavaScript Chrome Developer Tools and
    execute a matching string`''[(1+2)*3]^2''`against the regex`/[(1+2)*3]^2/`, we
    are destined to fail.


    ```

    > ''[(1+2)*3]^2''.match( /[(1+2)*3]^2/ )

    null

    ```


    The reason is that we have to escape all special characters.


    ```

    ''[(1+2)*3]^2''.match( /\[\(1\+2\)\*3\]\^2/ )

    ["[(1+2)*3]^2", index: 0, input: "[(1+2)*3]^2"]

    ```


    Correct me if I am wrong, but escaping seems anything but readable. Some languages
    such as Perl and PHP provide the`\Q`and`\E`special characters to write any characters
    unescaped. Whatever is written in between`\Q`and`\E`will be matched in sequence,
    character by character.


    For instance, the PHP implementation looks like this:


    ```

    $re = ''/\Q[(1+2)*3]^2\E/'';

    $str = ''[(1+2)*3]^2'';

    preg_match_all($re, $str, $matches, PREG_SET_ORDER, 0);

    // Print the entire match result

    var_dump($matches);

    ```


    The output is as follows:


    ```

    array(1) { [0]=> array(1) { [0]=> string(11) "[(1+2)*3]^2" } }

    ```


    As this feature does not exist in JavaScript, we have the following options:


    *   Use an extended library such as xregexp.

    *   Use an escaping function that does the dirty work automatically.


    Here’s an example (which you can find online):


    ```

    RegExp.escape = function(text) {

    return text.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, "\\$&");

    }

    ```


    # Summary


    In this chapter, you learned to use some more advanced elements of the regular
    expression syntax.


    * Character sets

    * Character set ranges

    * Exclusions from character sets

    * Character set classes


    I concluded this chapter with some examples concatenating regex substrings formed
    using the language constructs you already know.'
