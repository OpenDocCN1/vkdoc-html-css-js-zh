  ## 前言


  你是否曾想成为罗丹那样的雕塑家，手握凿子，精雕细琢一块岩石，将其塑造成你心中的模样？主流程序员们一直对资源极度受限的移动设备敬而远之，唯恐无法雕琢出可用的应用程序。好吧，那样的时代已经过去了。


  `Android OS` 将功能上近乎不受限制的移动设备（覆盖范围惊人）推送到了你的门前。在这本书中，我们想明确证实你的猜想：`Android` 是一个非常适合编程的卓越操作系统。如果你是一名`Java`程序员，你将拥有绝佳的机会，利用`Android
  OS`——这个令人兴奋、功能强大且通用性强的计算平台。尽管是移动操作系统，`Android OS`在框架设计方面引入了全新的范式。


  这是我们对`Android`主题的第四版，也是至今最好的一版。*Pro Android 4* 是`Android 4.0 SDK`（第一个同时涵盖手机和平板的`Android`
  SDK）的全面编程指南。在这一版中，我们对*Pro Android 3*中的许多内容进行了精炼、重写和增强，为初学者和专业人士创建了一本彻底更新的指南。*Pro
  Android 4* 是我们四年研究的成果。我们在 31 个章节中涵盖了超过 100 个主题。


  在本版中，我们加强了关于 Android 内部机制的讨论，涵盖了线程、进程、长期运行的服务、广播接收器、闹钟管理器、设备配置变更以及异步任务。我们用了超过 150
  页的篇幅来讲解片段、片段对话框、ActionBar 以及拖放功能。我们显著增强了服务和传感器章节。动画章节也进行了修订，加入了基于属性的动画。联系人 API 章节也已大幅重写，以考虑为社交
  API 铺平道路的个人资料功能。


  概念、代码和教程是本书的精髓。每一章都体现了这一理念。每章中独立的教程都附有专家建议的注释。书中所有项目均可下载，方便导入 Eclipse。


  最后，在本书中，我们超越了基础知识，就每个主题提出了尖锐的问题，并记录了结果（请参见目录中我们涵盖的广泛主题列表）。我们也在积极更新补充网站（`www.androidbook.com`），提供关于`Android
  SDK`的最新和未来研究资料。当您阅读本书时，如有任何问题，只需发送电子邮件，我们即可快速回复。


  ## 第 1 章




  '
- "# Android 计算平台简介\n\n如今，计算资源比以往任何时候都更容易获取。手持设备已转变为计算平台。无论是手机还是平板电脑，移动设备如今在通用计算方面的能力之强，使其正成为*真正*的个人电脑（PC）。所有传统\
  \ PC 制造商都在基于 Android 操作系统生产各种形态的设备。操作系统、计算平台、编程语言和开发框架之间的竞争正在转移并重新应用于移动设备。\n\n我们还看到移动编程的激增，越来越多的\
  \ IT 应用开始提供对应的移动版本。在本书中，我们将向您展示如何利用您的 Java 技能，为运行在谷歌 Android 平台（[`http://developer.android.com/index.html`](http://developer.android.com/index)）上的设备编写程序，这是一个面向移动和平板开发的开放源码平台。\n\
  \n**注意：** 我们对 Android 感到兴奋，因为它是一个基于 Java 的先进平台，在框架设计中引入了许多新的范式（即使是在移动平台的限制下）。\n\n\
  在本章中，我们将概述 Android 及其 SDK，简要介绍关键软件包，介绍每章将要涵盖的内容，向您展示如何利用 Android 源码，并强调为 Android\
  \ 平台编程的优势。\n\n### 新型个人电脑的新平台\n\nAndroid 平台秉持手持设备通用计算的思想。它是一个全面的平台，其特点在于基于 Linux\
  \ 的操作系统堆栈，用于管理设备、内存和进程。Android 的 Java 库涵盖了电话、视频、语音、图形、连接、用户界面编程以及设备的其他许多方面。\n\n\
  **注意：** 尽管是为移动和平板设备构建的，但 Android 平台展现出全功能桌面框架的特性。谷歌通过一个名为 Android SDK 的软件开发工具包（SDK）将这些框架开放给\
  \ Java 程序员。当您使用 Android SDK 时，您很少会觉得自己是在为移动设备编程，因为您可以访问在台式机或服务器上使用的大多数类库——包括一个关系型数据库。\n\
  \nAndroid SDK 支持大部分 Java 平台标准版（Java SE），但抽象窗口工具包（AWT）和 Swing 除外。取代 AWT 和 Swing 的，是\
  \ Android SDK 自己*广泛而现代化的 UI 框架*。由于您是用 Java 编写应用程序，您可能会认为需要一个负责解释运行时 Java 字节码的 Java\
  \ 虚拟机（JVM）。JVM 通常提供必要的优化，帮助 Java 达到与 C 和 C++等编译型语言相媲美的性能水平。Android 提供了自己的优化型 JVM\
  \ 来运行编译后的 Java 类文件，以应对手持设备在内存、处理器速度和功耗等方面的限制。这个虚拟机被称为 Dalvik VM，我们将在后面的章节“深入探讨 Dalvik\
  \ VM”中探讨。\n\n**注意：** Java 编程语言的熟悉性和简洁性，加上 Android 庞大的类库，使得 Android 成为一个极具吸引力的编程平台。\n\
  \n图 1-1 提供了 Android 软件堆栈的概览。（我们将在“理解 Android 软件堆栈”一节中提供更多细节。）\n\n![Image](img/9781430239307_Fig01-01.jpg)\n\
  \n***图 1-1.** Android 软件堆栈的高层视图*\n\n### Android 的早期历史\n\n手机使用多种操作系统，例如塞班 OS、微软 Windows\
  \ Phone OS、移动 Linux、iPhone OS（基于 Mac OS X）、Moblin（英特尔出品）以及许多其他专有操作系统。到目前为止，还没有哪个操作系统成为事实上的标准。用于开发移动应用的可用\
  \ API 和环境限制太多，与桌面框架相比似乎远远落后。相比之下，Android 平台承诺了开放性、低廉成本、开源代码，更重要的是，一个高端、一体化、一致的开发框架。\n\
  \n谷歌于 2005 年收购了初创公司 Android Inc.，开始了 Android 平台的开发（参见图 1-2）。Android Inc.的关键人物包括安迪·鲁宾、里奇·迈纳、尼克·西尔斯和克里斯·怀特。\n\
  \n![Image](img/9781430239307_Fig01-02.jpg)\n\n***图 1-2.** Android 早期时间线*\n\nAndroid\
  \ SDK 于 2007 年 11 月首次作为“早期预览”版本发布。2008 年 9 月，T-Mobile 宣布推出 T-Mobile G1，这是第一款基于 Android\
  \ 平台的智能手机。自那以后，我们看到了 SDK 2.0、3.0，现在又有了 4.0，大约每年发布一个版本。运行 Android 的设备起初只是涓涓细流，但现在已是汹涌潮流。\n\
  \nAndroid 的关键架构目标之一是允许应用程序之间相互交互并复用彼此的组件。这种复用不仅适用于服务，也适用于数据和用户界面（UI）。\n\nAndroid\
  \ 凭借其完善的功能，能够利用网络资源提供的云计算模型，并通过手机上本地数据存储来增强这种体验，因而很早就吸引了追随者并保持了开发者的势头。Android 在手机上对关系型数据库的支持也在其早期采用中发挥了作用。\n\
  \n在 1.0 和 1.1 版本（2008 年）中，Android 不支持软键盘，要求设备配备物理按键。Android 于 2009 年 4 月发布了 1.5\
  \ SDK，解决了这个问题，同时还带来了许多其他功能，例如高级媒体录制能力、小部件和动态文件夹。\n\n2009 年 9 月，Android 操作系统 1.6\
  \ 版本发布，一个月内又推出了 Android 2.0，这促使大量 Android 设备在 2009 年圣诞季涌入市场。该版本引入了高级搜索功能和文本转语音功能。\n\
  \n在 Android 2.3 中，重要的功能包括管理员远程擦除安全数据、在弱光条件下使用摄像头和视频、Wi-Fi 热点、显著的性能改进、改进的蓝牙功能、可选地将应用安装到\
  \ SD 卡、支持 OpenGL ES 2.0、备份改进、搜索可用性改进、用于信用卡处理的近场通信支持、大幅改进的动作和传感器支持（类似 Wii）、视频聊天以及改进的\
  \ Market。\n\nAndroid 3.0 专注于平板设备以及更强大的双核处理器，如 NVIDIA Tegra 2。此版本的主要功能包括支持使用更大的屏幕。引入了一个名为“碎片”（Fragments）的重要新概念。碎片贯穿于\
  \ 3.0 的使用体验之中。引入了更多类似桌面的功能，如操作栏和拖放。主屏幕小部件得到了显著增强，并且提供了更多 UI 控件。在 3D 领域，OpenGL 通过\
  \ Renderscript 得到了增强，进一步补充了 ES 2.0。这为平板电脑带来了令人兴奋的引入。\n\n然而，3.0 的体验仅限于平板电脑。在 3.0\
  \ 发布时，Android 的 2.x 分支继续服务于手机，而 3.x 分支服务于平板电脑。从 4.0 开始，Android 合并了这些分支，形成了一个统一的\
  \ SDK。对于手机用户来说，主要的 UI 差异在于，平板的体验也被带到了手机上。\n\n4.0 用户体验的关键方面如下：\n\n\n\n```markdown\n\
  *   一种名为`Roboto`的新字体，可在高密度屏幕上提供清晰度。\n*   一种在主页上将应用组织到文件夹中的更好方法。\n*   能够将应用和文件夹拖入始终位于设备底部的收藏夹栏。\n\
  *   基于设备类型的通知优化。对于小型设备，它们显示在顶部；对于大型设备，它们显示在底部系统栏中。\n*   可调整大小、可滚动的窗口小部件。\n*   多种解锁屏幕的方式。\n\
  *   拼写检查器。\n*   改进的语音输入，带有“连续说话”选项。\n*   更多用于管理网络数据使用量的控件。\n*   增强的联系人应用程序，带有类似于社交网络的个人资料。\n\
  *   对日历应用程序的增强。\n*   更好的相机应用：连续对焦、零快门延迟、人脸检测、点击对焦以及照片编辑器。\n*   图片和视频的实时特效，用于实现有趣的效果。\n\
  *   一种快速截取和分享屏幕截图的方法。\n*   快两倍的浏览器性能。\n*   改进的电子邮件。\n*   一个用于基于 NFC 共享的新概念，称为 Android\
  \ Beam。\n*   支持`Wi-Fi Direct`以促进 P2P 服务。\n*   蓝牙健康设备配置文件。\n\n开发者对 4.0 支持的关键方面包括：\n\
  \n*   基于对象（包括视图）属性变化的革新动画\n*   修正了 3.0 版本中基于列表的窗口小部件行为的固定数量问题\n*   更加成熟的操作栏，集成了搜索功能\n\
  *   支持多种移动标准：高级音频分发配置文件（`A2DP`：使用外部扬声器的能力）、实时传输协议（`RTP`：通过 IP 流式传输音频/视频）、媒体传输协议（`MTP`）、图片传输协议（`PTP`：用于连接计算机下载照片和媒体）以及蓝牙耳机配置文件（`HSP`）\n\
  *   全设备加密\n*   数字版权管理（`DRM`）\n*   加密存储和密码\n*   涉及个人资料的社交 API\n*   增强的日历 API\n* \
  \  语音邮件 API\n\n#### 深入探究 Dalvik 虚拟机\n\n作为 Android 的一部分，谷歌投入了大量时间来思考如何针对低功耗手持设备优化设计。手持设备在内存和速度方面落后其桌面同类产品八到十年。它们的计算能力也有限。因此，对手机端的性能要求非常严格，要求手机设计者优化一切。如果你查看\
  \ Android 中的软件包列表，你会发现它们功能齐全且广泛。\n\n这些问题促使谷歌在许多方面重新审视标准的 JVM 实现。谷歌实现此 JVM 的关键人物是\
  \ Dan Bornstein，他编写了 Dalvik 虚拟机——Dalvik 是冰岛一个城镇的名称。Dalvik 虚拟机获取生成的 Java 类文件，并将它们合并到一个或多个\
  \ Dalvik 可执行（`.dex`）文件中。Dalvik 虚拟机的目标是尽一切可能优化 JVM，以节省空间、提高性能和延长电池寿命。\n\n由于 Dalvik\
  \ 虚拟机，Android 中的最终可执行代码不是基于 Java 字节码，而是基于`.dex`文件。这意味着你不能直接执行 Java 字节码；你必须从 Java\
  \ 类文件开始，然后将它们转换为可链接的`.dex`文件。\n\n#### 理解 Android 软件栈\n\n到目前为止，我们已经介绍了 Android 的历史及其优化特性，包括\
  \ Dalvik 虚拟机，并且我们已经暗示了可用的 Java 编程栈。在本节中，我们将介绍 Android 的开发方面。图 1–3 从开发者的角度展示了 Android\
  \ 软件栈。\n\n![Image](img/9781430239307_Fig01-03.jpg)\n\n***图 1–3.** 详细的 Android SDK\
  \ 软件栈*\n\nAndroid 平台的核心是 Linux 内核，负责设备驱动程序、资源访问、电源管理和其它操作系统职责。提供的设备驱动程序包括：显示、相机、键盘、Wi-Fi、闪存、音频和进程间通信（`IPC`）。尽管核心是\
  \ Linux，但在诸如摩托罗拉 Droid 这样的 Android 设备上，绝大多数（如果不是全部）应用程序都是用 Java 开发的，并通过 Dalvik 虚拟机运行。\n\
  \n位于内核之上的下一层是许多 C/C++库，例如`OpenGL`、`WebKit`、`FreeType`、安全套接字层（`SSL`）、C 运行时库（`libc`）、`SQLite`和媒体库。基于伯克利软件发行版（`BSD`）的系统\
  \ C 库已针对基于嵌入式 Linux 的设备进行了调整（大小大约减半）。媒体库基于 PacketVideo（[`www.packetvideo.com`](http://www.packetvideo.com/)）的`OpenCORE`。这些库负责音频和视频格式的录制与回放。一个名为`Surface\
  \ Manager`的库控制对显示系统的访问，并支持 2D 和 3D。\n\n**注意：** 这些核心库可能会发生变化，因为它们都是 Android 的内部实现细节，并未直接暴露给发布的\
  \ Android API。我们指出这些核心库只是为了让你了解 Android 底层架构的本质。有关更新和未来的见解，请参考 Android 开发者网站。\n\n\
  `WebKit`库负责浏览器支持；它与支持谷歌 Chrome 和苹果 Safari 的是同一个库。`FreeType`库负责字体支持。`SQLite`（[`www.sqlite.org/`](http://www.sqlite.org/)）是一个设备本身可用的关系数据库。`SQLite`也是一个独立的关系数据库开源项目，与\
  \ Android 没有直接关联。你也可以获取并使用为`SQLite`设计的工具来处理 Android 数据库。\n\n大多数应用程序框架通过 Dalvik 虚拟机访问这些核心库，Dalvik\
  \ 虚拟机是通往 Android 平台的门户。正如我们在前几节中指出的，Dalvik 经过优化，可以运行多个虚拟机实例。当 Java 应用程序访问这些核心库时，每个应用程序都会获得自己的虚拟机实例。\n\
  \nAndroid Java API 的主要库包括：电话、资源、位置、UI、内容提供者（数据）和包管理器（安装、安全等）。程序员在此 Java API 之上开发最终用户应用程序。设备上的一些最终用户应用程序示例包括：主页、联系人、电话和浏览器。\n\
  \nAndroid 还支持一个名为`Skia`的自定义谷歌 2D 图形库，它用 C 和 C++编写。`Skia`也构成了谷歌 Chrome 浏览器的核心。然而，Android\
  \ 中的 3D API 基于来自 Khronos Group（[`www.khronos.org`](http://www.khronos.org)）的`OpenGL\
  \ ES`实现。`OpenGL ES`包含针对嵌入式系统优化的`OpenGL`子集。\n\n从媒体角度来看，Android 平台支持最常见的音频、视频和图片格式。从无线角度来看，Android\
  \ 拥有支持蓝牙、EDGE、3G、Wi-Fi 和全球移动通信系统（`GSM`）电话功能的 API，具体取决于硬件。\n\n#### 使用 Android SDK\
  \ 开发最终用户应用程序\n\n在本节中，我们将向你介绍你将在 Android 上开发最终用户应用程序时使用的高级 Android Java API。我们将简要讨论\
  \ Android 模拟器、Android 基础组件、UI 编程、服务、媒体、电话功能、动画等。\n```\n\n\n\n#### Android 模拟器\n\n\
  Android SDK 附带一个名为 Android Development Tools (ADT) 的 Eclipse 插件。您将使用此集成开发环境（IDE）来开发、调试和测试您的\
  \ Java 应用程序。（我们将在第 2 章中深入介绍 ADT。）您也可以不使用 ADT，而是改用命令行工具来使用 Android SDK。这两种方法都支持一个模拟器，您可以使用它来运行、调试和测试您的应用程序。您甚至不需要真实设备就能完成\
  \ 90% 的应用程序开发。功能齐全的 Android 模拟器模仿了大多数设备功能。模拟器的局限性包括 USB 连接、摄像头和视频捕获、耳机、电池模拟、蓝牙、Wi-Fi、NFC\
  \ 以及 OpenGL ES 2.0。\n\nAndroid 模拟器通过一种名为 QEMU 的开源“处理器模拟器”技术来完成其工作，该技术由 Fabrice Bellard\
  \ 开发（[`http://wiki.qemu.org/Index.html`](http://wiki.qemu.org/Index.html)）。这种技术允许在一个操作系统之上模拟另一个操作系统，而与处理器无关。QEMU\
  \ 允许在 CPU 级别进行模拟。\n\n在 Android 模拟器中，处理器基于 Advanced RISC Machine (ARM)。ARM 是一种基于精简指令集计算\
  \ (RISC) 的 32 位微处理器架构，通过减少指令集中的指令数量来实现设计简单性和速度。模拟器在此模拟处理器上运行 Android 版本的 Linux。\n\
  \nARM 广泛用于手持设备和其他对低功耗非常重要的嵌入式电子产品。大部分移动市场都使用基于此架构的处理器。\n\n您可以在 Android SDK 文档中找到关于模拟器的更多详细信息，网址为\
  \ [`http://developer.android.com/guide/developing/tools/emulator.html`](http://developer.android.com/guide/developing/tools/emulator.html)。\n\
  \n#### Android UI\n\nAndroid 使用一个类似于其他基于桌面的、功能齐全的 UI 框架。事实上，它在本质上更现代且更具异步性。如果您将传统的基于\
  \ C 的 Microsoft Windows API 视为第一代，将基于 C++ 的 Microsoft Foundation Classes (MFC) 视为第二代，那么\
  \ Android UI 本质上是一个第四代 UI 框架。基于 Java 的 Swing UI 框架将是第三代，它引入了远超 MFC 的设计灵活性。Android\
  \ UI、JavaFX、Microsoft Silverlight 和 Mozilla XML User Interface Language (XUL) 都属于这种新型的第四代\
  \ UI 框架，其 UI 是声明式的且独立于主题。\n\n**注意：** 在 Android 中，即使用于编程的设备可能是手持设备，您也使用现代用户界面范例进行编程。\n\
  \nAndroid UI 编程涉及在 XML 文件中声明界面。然后，您将这些 XML 视图定义作为窗口加载到 UI 应用程序中。这与基于 HTML 的网页非常相似。与\
  \ HTML 中一样，您通过其 ID 查找（获取）各个控件，并使用 Java 代码对其进行操作。\n\n即使是 Android 应用程序中的菜单也是从 XML\
  \ 文件中加载的。Android 中的屏幕或窗口通常被称为 *activity*，它包含用户完成逻辑操作单元所需的多个视图。*视图* 是 Android 的基本\
  \ UI 构建块，您可以进一步将它们组合成称为 *视图组* 的复合视图。\n\n视图在内部使用了熟悉的画布、绘制和用户交互概念。托管这些包含视图和视图组的复合视图的\
  \ Activity 是 Android 中可替换的逻辑 UI 组件。\n\nAndroid 3.0 引入了一个名为 *片段* 的新 UI 概念，允许开发者将视图和功能分块以在平板电脑上显示。平板电脑提供了足够的屏幕空间用于多窗格\
  \ Activity，而片段则为这些窗格提供了抽象。\n\nAndroid 框架的关键概念之一是 Activity 窗口的生命周期管理。建立了协议，以便 Android\
  \ 可以在用户隐藏、恢复、停止和关闭 Activity 窗口时管理状态。您将在第 2 章中了解这些基本概念，同时还会介绍如何设置 Android 开发环境。\n\
  \n#### Android 基础组件\n\nAndroid UI 框架以及 Android 的许多其他部分，都依赖于一个名为 *intent* 的新概念。Intent\
  \ 是一种用于在 Android 中调用组件的进程内和进程间机制。\n\nAndroid 中的组件是一段具有明确定义生命周期的代码。表示 Android 应用程序中窗口的\
  \ Activity 是一个组件。在 Android 进程中运行并为其他客户端提供服务的是一个组件。响应事件而唤醒的接收器是 Android 中组件的另一个例子。\n\
  \n在满足调用组件这一主要需求的同时，Intent 表现出的特性与窗口消息、动作、发布-订阅模型和进程间通信的特性相似。以下是使用`Intent`类调用或启动\
  \ Web 浏览器的示例：\n\n```java\npublic static void invokeWebBrowser(Activity activity)\n\
  {\n    Intent intent = new Intent(Intent.ACTION_VIEW);\n    intent.setData(Uri.parse(\"\
  http://www.google.com\"));\n    activity.startActivity(intent);\n}\n```\n\n在此示例中，通过\
  \ Intent，我们请求 Android 启动一个合适的窗口来显示网站内容。根据设备上安装的浏览器列表，Android 将选择一个合适的浏览器来显示该网站。您将在第\
  \ 5 章中了解更多关于 Intent 的内容。\n\nAndroid 对 *资源* 提供了广泛支持，这些资源包括字符串和位图等内容，以及一些不太熟悉的项目，如基于\
  \ XML 的视图（类似于 HTML 的布局）定义。Android 框架以一种新颖的方式使用资源，使其使用变得简单、直观和方便。以下是一个示例，其中资源 ID\
  \ 是为 XML 文件中定义的资源自动生成的：\n\n```java\npublic final class R {\n    //所有字符串资源的常量将在此处自动生成\n\
  \    public static final class string {\n        public static final int hello=0x7f070000;\n\
  \    }\n    //所有图像文件将在此处生成唯一 ID\n    public static final class drawable {\n    \
  \    public static final int myanimation=0x7f020001;\n        public static final\
  \ int numbers19=0x7f02000e;\n    }\n    //视图 ID 根据其名称自动生成\n    public static final\
  \ class id {\n        public static final int textViewId1=0x7f080003;\n    }\n \
  \   //以下两个文件（类似 html）定义布局\n    //根据各自子目录中的文件名自动生成。\n    public static final class\
  \ layout {\n        public static final int frame_animations_layout=0x7f030001;\n\
  \        public static final int main=0x7f030002;\n    }\n}\n```\n\n此类中的每个自动生成的\
  \ ID 对应于 XML 文件中的一个元素或整个文件本身。在您想要使用这些 XML 定义的任何地方，您都将使用这些生成的 ID。当涉及到根据区域设置、设备大小等特化资源时，这种间接引用非常有帮助。（第\
  \ 3 章更详细地介绍了`R.java`文件和资源。）\n\nAndroid 中的另一个新概念是 *内容提供者*。内容提供者是对数据源的抽象，使其看起来像是 RESTful\
  \ 服务的提供者和消费者。底层的 SQLite 数据库使内容提供者这一功能成为应用程序开发者的强大工具。我们将在第 4 章中介绍内容提供者。在第 3 章、第 4\
  \ 章和第 5 章中，我们将讨论 Intent、资源和内容提供者如何促进 Android 平台的开放性。\n\n\n\n### 高级 UI 概念\n\nXML\
  \ 页面布局定义（类似于 HTML 网页）在描述 Android UI 方面起着至关重要的作用。我们来看一个例子，看看 Android 布局 XML 文件是如何为一个包含文本视图的简单布局做到这一点的：\n\
  \n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!-- 将其放置在 /res/layout/sample_page1.xml\
  \ -->\n<!-- 将自动生成一个名为：R.layout.sample_page1 的 id -->\n<LinearLayout ..some basic\
  \ attributes..>\n<TextView android:id=\"@+id/textViewId\"  \n    android:layout_width=\"\
  fill_parent\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"@string/hello\"\
  \n    />\n</LinearLayout>\n```\n\n你将使用为此 XML 文件生成的 ID，将此布局加载到 Activity 窗口中。（我们将在第\
  \ 6 章中介绍这个过程。）Android 还广泛支持菜单（更多内容详见第 7 章），从标准菜单到上下文菜单。你会发现 Android 中的菜单使用起来很方便，因为它们也是作为\
  \ XML 文件加载的，并且这些菜单的资源 ID 是自动生成的。以下是在 XML 文件中声明菜单的方法：\n\n```\n<menu >\n    <!-- 此组使用默认类别。\
  \ -->\n    <group android:id=\"@+id/menuGroup_Main\">\n        <item android:id=\"\
  @+id/menu_clear\"\n            android:orderInCategory=\"10\"\n            android:title=\"\
  clear\" />\n        <item android:id=\"@+id/menu_show_browser\"\n            android:orderInCategory=\"\
  5\"\n            android:title=\"show browser\" />\n    </group>\n</menu>\n```\n\
  \nAndroid 支持对话框，并且 Android 中的所有对话框都是异步的。这些异步对话框给习惯了某些窗口框架中同步模式对话框的开发人员带来了特殊的挑战。我们将在第\
  \ 7 章中讨论菜单，并在第 9 章中讨论对话框。\n\nAndroid 提供了对动画的广泛支持。实现动画有三种基本方式。你可以进行逐帧动画。或者，你可以通过更改视图变换矩阵（位置、缩放、旋转和透明度）来提供补间动画。或者，你也可以通过更改对象的属性来做补间动画。基于属性的动画是在\
  \ 3.0 中引入的，是实现动画最灵活且推荐的方式。所有这些动画都将在第 21 章中介绍。\n\n此外，Android 允许你在 XML 资源文件中定义这些动画。看看这个例子，其中一系列编号的图片以逐帧动画的形式播放：\n\
  \n```\n<animation-list\n        android:oneshot=\"false\">\n    <item android:drawable=\"\
  @drawable/numbers11\" android:duration=\"50\" />\n   ……\n    <item android:drawable=\"\
  @drawable/numbers19\" android:duration=\"50\" />\n </animation-list>\n```\n\nAndroid\
  \ 还通过实现 OpenGL ES 1.0 和 2.0 标准来支持 3D 图形。OpenGL ES 和 OpenGL 一样，是一个基于 C 语言的扁平化 API。而\
  \ Android SDK 由于是基于 Java 的编程 API，需要利用 Java 绑定来访问 OpenGL ES。Java ME 已经通过 Java 规范请求（JSR）239\
  \ 为 OpenGL ES 定义了这种绑定，Android 在其实现中使用了相同的 Java 绑定来对接 OpenGL ES。如果你不熟悉 OpenGL 编程，学习曲线会比较陡峭。由于篇幅限制，我们无法在本书第四版中涵盖\
  \ OpenGL 的内容。不过，在我们的第三版中，有超过 100 页的相关内容。\n\nAndroid 有许多围绕主屏幕的 *信息触手可及* 概念。首先是*实时文件夹*。使用实时文件夹，你可以将一组项目作为文件夹发布到主屏幕上。该集合的内容会随着底层数据的变化而变化。这种变化的数据可以来自设备本地，也可以来自互联网。由于篇幅限制，我们无法在本书第四版中涵盖实时文件夹的内容。不过，第三版中包含了广泛的介绍。\n\
  \n第二个基于主屏幕的概念是*主屏幕小部件*。主屏幕小部件用于使用 UI 小部件在主屏幕上绘制信息。这些信息可以按固定时间间隔更新。例如，你的电子邮件存储中的电子邮件数量。我们在第\
  \ 25 章中介绍主屏幕小部件。主屏幕小部件在 3.0 中得到了增强，增加了列表视图，当底层数据发生变化时，这些列表视图可以更新。这些增强功能在第 26 章中介绍。\n\
  \n*集成的 Android 搜索*是第三个基于主屏幕的概念。使用集成搜索，你可以在设备本地以及整个互联网上搜索内容。Android 搜索的功能不止于此，它还允许你通过搜索控件触发命令。由于篇幅限制，我们无法在本书第四版中涵盖搜索\
  \ API 的内容。不过，第三版中包含了相关介绍。\n\nAndroid 还支持触摸屏和基于手指在设备上移动的手势。Android 允许你将屏幕上的任意随机运动录制为命名手势。然后，应用程序可以使用此手势来指示特定的操作。我们在第\
  \ 27 章中介绍触摸屏和手势。\n\n传感器现在已成为移动体验中重要的一部分。我们在第 29 章中介绍传感器。\n\n移动设备所需的另一项必要创新是其配置的动态特性。例如，很容易将手持设备在纵向和横向查看模式之间切换。或者你可以将手持设备对接以变成笔记本电脑。Android\
  \ 3.0 引入了一个名为“片段”的概念来有效处理这些变化。第 8 章专门介绍片段，而第 12 章则讨论如何处理配置变更。\n\n我们还在第 10 章中介绍了操作栏的\
  \ 3.0 特性（该特性在 4.0 中得到了极大增强）。操作栏使得 Android 能够与桌面菜单栏范式相媲美。\n\n拖放功能是在 3.0 中为平板电脑引入的。此功能现在也可用于手机。我们在第\
  \ 28 章中介绍拖放功能。\n\n手持设备完全能够感知基于云的环境。为了进行服务器端 HTTP 调用，理解线程模型以避免“应用程序无响应”消息至关重要。我们在第\
  \ 18 章中介绍可用于异步处理的机制。\n\n在 Android SDK 之外，还有许多独立的创新正在发生，使得开发变得既令人兴奋又简单。一些例子包括 XML/VM、PhoneGap\
  \ 和 Titanium。Titanium 允许你使用 HTML 技术来为基于 WebKit 的 Android 浏览器编程。我们在本书第二版中介绍了 Titanium。然而，由于时间和篇幅限制，我们不在本版中介绍\
  \ Titanium。\n\n### Android 服务组件\n\n安全性是 Android 平台的基础组成部分。在 Android 中，安全贯穿应用程序生命周期的所有阶段——从设计阶段的策略考量到运行时的边界检查。我们在第\
  \ 14 章中介绍安全性和权限。\n\n在第 15 章中，我们将向你展示如何在 Android 中构建和使用服务，特别是 HTTP 服务。本章还将涵盖进程间通信（同一设备上应用程序之间的通信）。\n\
  \n基于位置的服务是 Android SDK 中另一个更令人兴奋的组件。SDK 的这一部分为应用程序开发者提供了用于显示和操作地图，以及获取实时设备位置信息的\
  \ API。我们将在第 22 章中详细介绍这些概念。\n\n\n  \n#### Android 媒体与电话组件  \n\nAndroid 提供了涵盖音频、视频和电话组件的\
  \ API。第 23 章将介绍电话 API，而音频和视频 API 将在第 24 章中详细讲解。  \n\n从 Android 2.0 开始，Android 内置了\
  \ Pico 文本转语音引擎。由于篇幅限制，本书第四版未能包含文本转语音的相关内容，第三版则已涵盖文本转语音 API。  \n\n最后同样重要的是，Android\
  \ 通过创建一个定义应用程序包的 XML 文件，将这些概念整合到一个应用中。该文件被称为应用的 *清单文件*（`AndroidManifest.xml`）。示例如下：\
  \  \n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\n      package=\"\
  com.ai.android.HelloWorld\"\n      android:versionCode=\"1\"\n      android:versionName=\"\
  1.0.0\">\n    <application android:icon=\"@drawable/icon\" android:label=\"@string/app_name\"\
  >\n        <activity android:name=\".HelloWorld\"\n                  android:label=\"\
  @string/app_name\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\nAndroid 清单文件用于定义 Activity、注册服务和内容提供者，以及声明权限。随着本书各章节的深入，我们将逐一介绍清单文件的详细信息。\
  \  \n\n#### Android Java 包  \n\n快速了解 Android 平台的一种方式是查看 Java 包的结构。由于 Android 与标准\
  \ JDK 发行版存在差异，了解哪些功能被支持、哪些不被支持至关重要。以下是 Android SDK 中包含的重要包的简要说明：  \n\n\n\n`android.app`：实现了\
  \ Android 的应用程序模型。主要类包括代表启动和停止语义的 `Application`，以及大量与活动相关的类、片段、控件、对话框、提醒和通知。我们在本书中会用到其中的大部分类。\n\
  \n`android.app.admin`：提供了让企业管理员等人员控制设备的能力。\n\n`android.accounts`：提供了用于管理 Google、Facebook\
  \ 等账户的类。主要类是 `AccountManager` 和 `Account`。我们在第 30 章讨论联系人 API 时会简要介绍这个 API。\n\n`android.animation`：包含了所有新的属性动画类。这些类在第\
  \ 21 章中有详尽的介绍。\n\n`android.app.backup`：为应用程序提供了在用户更换设备时备份和恢复数据的钩子。\n\n`android.appwidget`：提供了主屏幕小部件的功能。当我们讨论主屏幕小部件（包括基于列表的小部件）时，第\
  \ 25 章和第 26 章会详细涵盖这个包。\n\n`android.bluetooth`：提供了大量用于处理蓝牙功能的类。主要类包括 `BluetoothAdapter`、`BluetoothDevice`、`BluetoothSocket`、`BluetoothServerSocket`\
  \ 和 `BluetoothClass`。你可以使用 `BluetoothAdapter` 来控制本地安装的蓝牙适配器。例如，你可以启用、禁用它，并启动发现过程。`BluetoothDevice`\
  \ 代表你正在连接的远程蓝牙设备。两个蓝牙套接字用于在设备之间建立通信。蓝牙类代表你正在连接的蓝牙设备类型。\n\n`android.content`：实现了内容提供者的概念。内容提供者抽象了来自数据存储的数据访问。这个包还实现了关于意图和\
  \ Android 统一资源标识符（URI）的核心思想。这些类在第 4 章中有介绍。\n\n`android.content.pm`：实现了与包管理器相关的类。包管理器了解权限、已安装的包、已安装的提供者、已安装的服务、已安装的组件（如活动）以及已安装的应用程序。\n\
  \n`android.content.res`：提供了对资源文件（结构化和非结构化）的访问。主要类是 `AssetManager`（用于非结构化资源）和 `Resources`。这个包中的一些类在第\
  \ 3 章中有介绍。\n\n`android.database`：实现了抽象数据库的概念。主要接口是 `Cursor` 接口。这个包中的一些类在第 4 章中有介绍。\n\
  \n`android.database.sqlite`：使用 SQLite 作为物理数据库来实现 `android.database` 包中的概念。主要类是 `SQLiteCursor`、`SQLiteDatabase`、`SQLiteQuery`、`SQLiteQueryBuilder`\
  \ 和 `SQLiteStatement`。不过，你大部分交互会使用来自抽象的 `android.database` 包中的类。\n\n`android.drm`：与数字版权管理相关的类。\n\
  \n`android.gesture`：包含了处理用户定义手势所需的所有类和接口。主要类是 `Gesture`、`GestureLibrary`、`GestureOverlayView`、`GestureStore`、`GestureStroke`\
  \ 和 `GesturePoint`。一个 `Gesture` 是 `GestureStrokes` 和 `GesturePoints` 的集合。手势被收集在\
  \ `GestureLibrary` 中。手势库存储在 `GestureStore` 中。手势有名称，以便被识别为操作。这个包中的一些类在第 27 章中有介绍。\n\
  \n`android.graphics`：包含 `Bitmap`、`Canvas`、`Camera`、`Color`、`Matrix`、`Movie`、`Paint`、`Path`、`Rasterizer`、`Shader`、`SweepGradient`\
  \ 和 `TypeFace` 这些类。\n\n`android.graphics.drawable`：实现了绘图协议和背景图像，并允许 drawable 对象的动画。\n\
  \n`android.graphics.drawable.shapes`：实现了形状，包括 `ArcShape`、`OvalShape`、`PathShape`、`RectShape`\
  \ 和 `RoundRectShape`。\n\n`android.hardware`：实现了与物理相机相关的类。`Camera` 代表硬件相机，而 `android.graphics.Camera`\
  \ 代表一个与物理相机完全无关的图形概念。\n\n`android.hardware.usb`：让你能够从 Android 与 USB 设备通信。\n\n`android.location`：包含\
  \ `Address`、`GeoCoder`、`Location`、`LocationManager` 和 `LocationProvider` 这些类。`Address`\
  \ 类代表简化的可扩展地址语言（XAL）。`GeoCoder` 允许你根据一个地址获取经纬度坐标，反之亦然。`Location` 代表经纬度。这个包中的一些类在第\
  \ 22 章中有介绍。\n\n`android.media`：包含 `MediaPlayer`、`MediaRecorder`、`Ringtone`、`AudioManager`\
  \ 和 `FaceDetector` 这些类。支持流式传输的 `MediaPlayer` 用于播放音频和视频。`MediaRecorder` 用于录制音频和视频。`Ringtone`\
  \ 类用于播放可以用作铃声和通知的短音片段。`AudioManager` 负责音量控制。你可以使用 `FaceDetector` 来检测位图中的人脸。这个包中的一些类在第\
  \ 24 章中有介绍。\n\n`android.media.audiofx`：提供音频效果。\n\n`android.media.effect`：提供视频效果。\n\
  \n`android.mtp`：提供了与相机和音乐设备交互的能力。\n\n`android.net`：实现了基本的套接字级网络 API。主要类包括 `Uri`、`ConnectivityManager`、`LocalSocket`\
  \ 和 `LocalServerSocket`。这里还值得一提的是，Android 在浏览器级别和网络级别都支持 HTTPS。Android 的浏览器也支持 JavaScript。\n\
  \n`android.net.rtp`：支持流式传输协议。\n\n`android.net.sip`：提供对 VOIP 的支持。\n\n`android.net.wifi`：管理\
  \ Wi-Fi 连接。主要类包括 `WifiManager` 和 `WifiConfiguration`。`WifiManager` 负责列出已配置的网络和当前活动的\
  \ Wi-Fi 网络。\n\n`android.net.wifi.p2p`：支持通过 Wi-Fi Direct 的 P2P 网络。\n\n`android.nfc`：让你与近距离设备交互，以实现非接触式商务，例如在销售柜台处理信用卡。\n\
  \n`android.opengl`：包含围绕 OpenGL ES 1.0 和 2.0 操作的实用类。OpenGL ES 的主要类在从 JSR 239 借用的一组不同的包中实现。这些包是\
  \ `javax.microedition.khronos.opengles`、`javax.microedition.khronos.egl` 和 `javax.microedition.khronos.nio`。这些包是\
  \ Khronos 用 C 和 C++ 实现的 OpenGL ES 的轻量级封装。\n\n`android.os`：代表通过 Java 编程语言可访问的 OS\
  \ 服务。一些重要的类包括 `BatteryManager`、`Binder`、`FileObserver`、`Handler`、`Looper` 和 `PowerManager`。`Binder`\
  \ 是一个允许进程间通信的类。`FileObserver` 监控文件的变化。你使用 `Handler` 类在消息线程上运行任务，使用 `Looper` 运行消息线程。\n\
  \n`android.preference`：允许应用程序让用户以统一的方式管理该应用程序的偏好设置。主要类是 `PreferenceActivity`、`PreferenceScreen`\
  \ 以及各种偏好派生类，如 `CheckBoxPreference` 和 `SharedPreferences`。这个包中的一些类在第 13 章和第 25 章中有介绍。\n\
  \n`android.provider`：包含一组遵循 `android.content.ContentProvider` 接口的预构建内容提供者。这些内容提供者包括\
  \ `Contacts`、`MediaStore`、`Browser` 和 `Settings`。这组接口和类存储了底层数据结构的元数据。我们在第 30 章中会涵盖联系人提供者包中的许多类。\n\
  \n`android.sax`：包含一组高效的 XML 简单 API（SAX）解析工具类。主要类包括 `Element`、`RootElement` 以及一系列\
  \ `ElementListener` 接口。\n\n`android.speech.*`：提供将文本转换为语音的支持。主要类是 `TextToSpeech`。你将能够获取文本，并要求此类的实例将要说的文本排队。例如，你可以访问许多回调来监控语音何时结束。Android\
  \ 使用来自 SVOX 的 Pico 文本转语音（TTS）引擎。\n\n`android.telephony`：包含 `CellLocation`、`PhoneNumberUtils`\
  \ 和 `TelephonyManager` 这些类。`TelephonyManager` 让你能够确定小区位置、电话号码、网络运营商名称、网络类型、手机类型和用户识别模块（SIM）序列号。这个包中的一些类在第\
  \ 23 章中有介绍。\n\n`android.telephony.gsm`：允许你根据蜂窝基站收集小区位置，并包含负责 SMS 消息的类。这个包之所以被称为\
  \ GSM，是因为全球移动通信系统是最初定义 SMS 数据消息标准的技术。\n\n`android.telephony.cdma`：提供对 CDMA 电话的支持。\n\
  \n`android.test`、`android.test.mock`、`android.test.suitebuilder`：支持为 Android 应用程序编写单元测试的包。\n\
  \n`android.text`：包含文本处理类。\n\n`android.text.method`：提供用于为各种控件输入文本的类。\n\n`android.text.style`：提供多种用于文本跨度的样式机制。\n\
  \n`android.utils`：包含 `Log`、`DebugUtils`、`TimeUtils` 和 `Xml` 这些类。\n\n`android.view`：包含\
  \ `Menu`、`View` 和 `ViewGroup` 这些类，以及一系列监听器和回调。\n\n`android.view.animation`：提供对补间动画的支持。主要类包括\
  \ `Animation`、一系列用于动画的插值器，以及一组特定的动画器类，包括 `AlphaAnimation`、`ScaleAnimation`、`TranslationAnimation`\
  \ 和 `RotationAnimation`。这个包中的一些类在第 21 章中有介绍。\n\n`android.view.inputmethod`：实现了输入法框架架构。\n\
  \n`android.webkit`：包含代表 Web 浏览器的类。主要类包括 `WebView`、`CacheManager` 和 `CookieManager`。\n\
  \n`android.widget`：包含所有通常派生自 `View` 类的 UI 控件。主要小部件包括 `Button`、`Checkbox`、`Chronometer`、`AnalogClock`、`DatePicker`、`DigitalClock`、`EditText`、`ListView`、`FrameLayout`、`GridView`、`ImageButton`、`MediaController`、`ProgressBar`、`RadioButton`、`RadioGroup`、`RatingButton`、`Scroller`、`ScrollView`、`Spinner`、`TabWidget`、`TextView`、`TimePicker`、`VideoView`\
  \ 和 `ZoomButton`。\n\n`com.google.android.maps`：包含 `MapView`、`MapController` 和 `MapActivity`\
  \ 这些类，本质上是使用 Google 地图所需的类。\n\n\n\n以下是一些关键的 Android 专用包。从这份列表中，你可以看出 Android 核心平台的深度。\n\
  \n**注意：** 总体而言，Android Java API 包含了超过 50 个包和超过 1000 个类，并且每个新版本都在持续增长。\n\n此外，Android\
  \ 在 `java.*` 命名空间中提供了大量包。这些包包括：`awt.font`、`beans`、`io`、`lang`、`lang.annotation`、`lang.ref`、`lang.reflect`、`math`、`net`、`nio`、`nio.channels`、`nio.channels.spi`、`nio.charset`、`security`、`security.acl`、`security.cert`、`security.interfaces`、`security.spec`、`sql`、`text`、`util`、`util.concurrent`、`util.concurrent.atomic`、`util.concurrent.locks`、`util.jar`、`util.logging`、`util.prefs`、`util.regex`\
  \ 和 `util.zip`。\n\nAndroid 还附带了来自 `javax` 命名空间的以下包：`crypto`、`crypto.spec`、`microedition.khronos.egl`、`microedition.khronos.opengles`、`net`、`net.ssl`、`security.auth`、`security.auth.callback`、`security.auth.login`、`security.auth.x500`、`security.cert`、`sql`、`xml`\
  \ 和 `xmlparsers`。\n\n除此之外，它还包含来自 `org.apache.http.*` 的大量包，以及 `org.json`、`org.w3c.dom`、`org.xml.sax`、`org.xml.sax.ext`、`org.xml.sax.helpers`、`org.xmlpull.v1`\
  \ 和 `org.xmlpull.v1.sax2`。这些众多的包共同构成了一个丰富的计算平台，用于为手持设备编写应用程序。\n\n### 充分利用 Android\
  \ 源代码\n\nAndroid 文档在某些地方略显不足。Android 源代码可以用来填补这些空白。\n\nAndroid 及其所有项目的源代码均由 Git\
  \ 源代码控制系统管理。Git ([`http://git-scm.com/`](http://git-scm.com/)) 是一个开源的源代码控制系统，旨在快速方便地处理大型和小型项目。Linux\
  \ 内核和 Ruby on Rails 项目也依赖 `git` 进行版本控制。\n\nAndroid 源代码分发的详细信息发布在 [`http://source.android.com`](http://source.android.com)。这些代码大约在\
  \ 2008 年 10 月以开源形式提供。开放手机联盟的目标之一就是让 Android 成为一个免费且完全可定制的移动平台。\n\n#### 在线浏览 Android\
  \ 源代码\n\n在 Android 4.0 之前，Android 源代码分发位于 [`http://android.git.kernel.org/`](http://android.git.kernel.org/)。现在\
  \ Android 托管在自己的 Git 站点上，地址为 [`https://android.googlesource.com`](https://android.googlesource.com)。但是，在撰写本文时，该网站无法在线浏览。网上有些帖子表示在线浏览功能可能很快就会提供。\n\
  \n另一个经常用来在线浏览 Android 源代码的网站是：\n\n`www.google.com/codesearch/p?hl=en#uX1GffpyOZk/core/java/android/`\n\
  \n然而，有传言称 Code Search 项目可能正在关闭。即使没有关闭，该网站也尚未搜索 Android 4.0 的代码。例如，我们无法在此处找到新的联系人\
  \ API。\n\n另一个有用的网站是：\n\n`www.grepcode.com/search/?query=google+android&entity=project`\n\
  \n这里似乎有 Android 4.01 的分支。\n\n我们希望这两个网站都能持续提供最新的发布版本，以便您可以在线浏览源代码。\n\n#### 使用 Git\
  \ 下载 Android 源代码\n\n如果以上所有方法都行不通，您可能必须在计算机上安装 `git` 并自行下载源代码。如果您使用的是 Linux 发行版，可以按照\
  \ [`http://source.android.com`](http://source.android.com) 上的说明获取最新源代码。\n\n如果您使用的是\
  \ Windows 平台，这将是一个挑战。您需要先安装 `git`，然后使用它来获取所需的 Android 包。\n\n**注意：** 我们关于使用 `git`\
  \ 下载 Android 的研究笔记可以在 [`http://androidbook.com/item/3919`](http://androidbook.com/item/3919)\
  \ 找到。\n\n##### 安装 Git\n\n使用以下 URL 在 Windows 上安装 `msysGit` 包：\n\n`http://code.google.com/p/msysgit/downloads/list`\n\
  \n安装完成后，您将看到一个名为 `C:\\git` 的目录（假设您已将其安装在 `c:\\` 下）。\n\n##### 测试 Git 安装\n\n关键目录是\
  \ `C:\\git\\bin`。要检查它是否正常工作，您可以使用以下命令克隆一个公共仓库：\n\n`git clone git://git.kernel.org/pub/scm/git/git.git`\n\
  \n这会将仓库克隆到您的本地驱动器。\n\n##### 下载 Android 仓库\n\n运行以下命令来发现有多少个 Android Git 仓库：\n\n`git\
  \ clone https://android.googlesource.com/platform/manifest.git`\n\n这将下载一个名为 `manifest`\
  \ 的目录。查找一个名为 `manifest\\default.xml` 的文件。\n\n该文件将包含许多 Android 仓库的名称。以下是该文件中的几行内容：\n\
  \n```\n  <project path=\"frameworks/base\"\n            name=\"platform/frameworks/base\"\
  \ />\n  <project path=\"frameworks/compile/libbcc\"\n              name=\"platform/frameworks/compile/libbcc\"\
  \ />\n```\n\n您可以在 [`http://androidbook.com/item/3920`](http://androidbook.com/item/3920)\
  \ 查看 4.0 版本的完整文件内容，我们已将该文件内容发布在那里，方便您快速查阅。请记住，它可能不是最新的信息。\n\n现在，您可以使用以下命令获取基础的 `android.jar`\
  \ 源代码：\n\n`git clone https://android.googlesource.com/platform/frameworks/base.git`\n\
  \n使用同样的逻辑，您可以通过输入以下命令获取联系人提供者包：\n\n`git clone https://android.googlesource.com/platform/packages/providers/ContactsProvider`\n\
  \n### 本书中的示例项目\n\n在本书中，您会看到许多可运行的示例项目。每章末尾都有一个“参考资料”部分，其中包含下载该章示例项目的 URL。所有这些示例项目都可以通过以下地址访问：\n\
  \n`http://androidbook.com/proandroid4/projects`\n\n如果您在下载或编译这些项目时遇到任何问题，请通过电子邮件联系我们：`satya.komatineni@gmail.com`\
  \ 或 `davemac327@gmail.com`。\n\n我们会不断用学到的新知识更新 `androidbook.com` 支持站点。如果我们的努力能进一步促进您的学习，那将是非常值得的。\n\
  \n### 总结\n\n在本章中，我们旨在激发您对 Android 的好奇心。如果您是一名 Java 程序员，您将有一个绝佳的机会从这个令人兴奋、功能强大且通用的计算平台中获益。欢迎您继续阅读本书的其余部分，以系统而深入地理解\
  \ Android SDK。\n\n## 第 2 章\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n## 搭建你的开发环境\n\n上一章概述了 Android 的历史，并暗示了本书后续章节将要涉及的概念。此时此刻，你可能已经迫不及待地想要动手写一些代码了。首先，你将了解使用\
  \ Android 软件开发工具包（SDK）构建应用程序所需的条件，并搭建你的开发环境。接着，你将逐步完成一个“Hello World！”应用程序。然后，本章会解释\
  \ Android 应用程序的生命周期，最后讨论如何使用 Android 虚拟设备（AVD）以及在实际设备上运行你的应用程序。\n\n要构建 Android 应用程序，你需要\
  \ Java SE 开发工具包（JDK）、Android SDK 和一个开发环境。严格来说，你可以使用原始文本编辑器来开发应用程序，但在本书中，你将使用广泛使用的\
  \ Eclipse IDE。Android SDK 需要 JDK 5 或 JDK 6（示例中使用的是 JDK 6）以及 Eclipse 3.5 或更高版本（本书使用\
  \ Eclipse 3.5，也称为 Galileo，以及 3.6，也称为 Helios）。\n\n**注意：** 在编写本书时，Java 7 已经可用，但尚不受\
  \ Android SDK 支持。最新的 Eclipse 版本（3.7，亦称 Indigo）也已经可用，但 Android 历来在最新的 Eclipse 上表现不太稳定。请在此处查看系统需求以获取最新信息：[`http://developer.android.com/sdk/requirements.html`](http://developer.android.com/sdk/requirements.html)。\n\
  \nAndroid SDK 兼容 Windows（Windows XP、Windows Vista 和 Windows 7）、Mac OS X（仅限 Intel）和\
  \ Linux（仅限 Intel）。在硬件方面，你需要一台 Intel 机器，性能越强越好。\n\n为了使开发更便捷，你可能会用到 Android 开发工具（ADT）。ADT\
  \ 是一个 Eclipse 插件，支持使用 Eclipse IDE 构建 Android 应用程序。\n\nAndroid SDK 由两个主要部分组成：工具和包。当你首次安装\
  \ SDK 时，你得到的只是基础工具。这些是帮助你开发应用程序的可执行文件和支持文件。而包则是特定于某个 Android 版本（称为*平台*）或某个平台特定附加组件的文件。平台包括\
  \ Android 1.5 到 4.0。附加组件包括 Google Maps API、Market License Validator，甚至还有供应商提供的组件，如三星的\
  \ Galaxy Tab 附加组件。安装 SDK 后，你需使用其中一个工具来下载并设置平台和附加组件。让我们开始吧！\n\n### 搭建你的环境\n\n要构建\
  \ Android 应用程序，你需要建立一个开发环境。在本节中，你将逐步完成下载 JDK 6、Eclipse IDE、Android SDK（工具和包）和 ADT\
  \ 的过程。你还需要配置 Eclipse 以构建 Android 应用程序。Google 提供了一个页面来描述安装过程（[`http://developer.android.com/sdk/installing.html`](http://developer.android.com/sdk/installing.html)），但正如你将看到的，它遗漏了一些关键步骤。\n\
  \n#### 下载 JDK 6\n\n你首先需要的是 Java SE 开发工具包。Android SDK 需要 JDK 5 或更高版本；我们使用 JDK 6 开发了示例。对于\
  \ Windows，请从 Oracle 网站（[`http://www.oracle.com/technetwork/java/javase/downloads/index.html`](http://www.oracle.com/technetwork/java/javase/downloads/index.html)）下载\
  \ JDK 6 并安装。你只需要 JDK，不需要捆绑包。对于 Mac OS X，请从 Apple 网站（[`http://developer.apple.com/java/download/`](http://developer.apple.com/java/download/)）下载\
  \ JDK，选择适用于你特定 Mac OS 版本的文件并安装。你需要免费注册为 Apple 开发者才能获得 JDK，并且在进入下载页面后，你需要点击右侧的 Java\
  \ 链接。要为 Linux 安装 JDK，请打开一个终端窗口并尝试以下命令：\n\n`sudo apt-get install sun-java6-jdk`\n\
  \n这应该会安装 JDK 及其所有依赖项，例如 Java 运行时环境（JRE）。如果没有安装成功，这可能意味着你需要添加一个新的软件源，然后再次尝试该命令。网页\
  \ [`https://help.ubuntu.com/community/Repositories/Ubuntu`](https://help.ubuntu.com/community/Repositories/Ubuntu)\
  \ 解释了软件源以及如何添加与第三方软件的连接。具体过程因你使用的 Linux 版本而异。完成这些操作后，请重试该命令。\n\n随着 Ubuntu 10.04（Lucid\
  \ Lynx）的推出，Ubuntu 建议使用 OpenJDK 代替 Oracle/Sun JDK。要安装 OpenJDK，请尝试以下命令：\n\n`sudo apt-get\
  \ install openjdk-6-jdk`\n\n如果未找到，请按照前面的说明设置第三方软件，然后再次运行该命令。JDK 所依赖的所有包都会自动为你添加。可以同时安装\
  \ OpenJDK 和 Oracle/Sun JDK。要在 Ubuntu 上切换已安装的 Java 版本中的活跃 Java，请在 shell 提示符下运行此命令：\n\
  \n`sudo update-alternatives --config java`\n\n然后选择你希望设为默认的 Java。\n\n现在你已经安装了 Java\
  \ JDK，是时候设置 `JAVA_HOME` 环境变量，使其指向 JDK 安装文件夹了。在 Windows XP 机器上，选择“开始”![Image](img/U001.jpg)\
  \ “我的电脑”，右键单击，选择“属性”，选择“高级”选项卡，然后单击“环境变量”。单击“新建”添加变量，或如果变量已存在则单击“编辑”进行修改。`JAVA_HOME`\
  \ 的值类似于 `C:\\Program Files\\Java\\jdk1.6.0_27`。\n\n对于 Windows Vista 和 Windows 7，进入“环境变量”屏幕的步骤略有不同。选择“开始”![Image](img/U001.jpg)\
  \ “计算机”，右键单击，选择“属性”，单击“高级系统设置”链接，然后单击“环境变量”。之后，按照与 Windows XP 相同的说明来更改 `JAVA_HOME`\
  \ 环境变量。\n\n对于 Mac OS X，你需要在家目录的 `.bashrc` 文件中设置 `JAVA_HOME`。编辑或创建 `.bashrc` 文件，并添加如下所示的一行：\n\
  \n`export JAVA_HOME=path_to_JDK_directory`\n\n其中 `path_to_JDK_directory` 很可能为 `/Library/Java/Home`。对于\
  \ Linux，请编辑你的 `.bashrc` 文件并添加类似于 Mac OS X 的一行，区别在于你的 Java 路径可能类似于 `/usr/lib/jvm/java-6-sun`\
  \ 或 `/usr/lib/jvm/java-6-openjdk`。\n\n#### 下载 Eclipse 3.6\n\n安装 JDK 后，你可以下载适用于 Java\
  \ 开发者的 Eclipse IDE。（你不需要 Java EE 版本；它也能用，但体积大得多，并且包含本书不需要的内容。）本书中的示例使用 Eclipse 3.6（在\
  \ Windows 环境下）。你可以从 `www.eclipse.org/downloads/` 下载所有版本的 Eclipse。\n\nEclipse 发行版是一个\
  \ `.zip` 文件，可以解压到几乎任何位置。在 Windows 上，最简单的解压位置是 `C:\\`，这会产生一个 `C:\\eclipse` 文件夹，你可以在其中找到\
  \ `eclipse.exe`。对于 Mac OS X，你可以解压到 `Applications`。对于 Linux，你可以解压到家目录，或让管理员将 Eclipse\
  \ 放在可以访问的公共位置。在所有平台上，Eclipse 可执行文件都在 `eclipse` 文件夹中。你也可以使用 Linux 的“软件中心”来查找和安装 Eclipse（用于添加新应用程序），但这可能不会提供最新版本。\n\
  \n当你首次启动 Eclipse 时，它会要求你提供一个工作空间的位置。为简单起见，你可以选择一个简单的位置，例如 `C:\\android` 或家目录下的某个目录。如果你与他人共用计算机，应该将工作空间文件夹放在家目录下的某个位置。\n\
  \n\n\n#### 下载 Android SDK\n\n要构建 Android 应用程序，你需要 Android SDK。如前所述，SDK 附带基础工具；然后你需要下载所需或想要使用的软件包部分。SDK\
  \ 的工具部分包含一个模拟器，因此你无需使用搭载 Android 操作系统的移动设备即可开发 Android 应用程序。它还附带一个设置实用程序，允许你安装想要下载的软件包。\n\
  \n你可以从 [`http://developer.android.com/sdk`](http://developer.android.com/sdk) 下载\
  \ Android SDK。它以一个 `.zip` 文件的形式提供，类似于 Eclipse 的分发方式，因此你需要将其解压到合适的位置。对于 Windows，将文件解压到方便的位置（我们使用的是\
  \ `C:` 盘），之后你会得到一个类似于 `C:\\android-sdk-windows` 的文件夹，其中包含如 图 2-1 所示的文件。对于 Mac OS\
  \ X 和 Linux，你可以将文件解压到你的主目录。请注意，Mac OS X 和 Linux 没有 SDK Manager 可执行文件；在 Mac OS X\
  \ 和 Linux 中，SDK Manager 的等效操作是运行 `tools/android` 程序。\n\n![图片](img/9781430239307_Fig02-01.jpg)\n\
  \n**图 2-1.** *Android SDK 的基础内容*\n\n另一种方法（仅适用于 Windows）是下载安装程序 EXE 而不是 zip 文件，然后运行该安装程序可执行文件。此可执行文件会检查\
  \ Java JDK，为你解压嵌入的文件，并运行 SDK Manager 程序以帮助你完成其余下载项的设置。\n\n无论是通过 Windows 安装程序还是通过执行\
  \ SDK Manager，接下来你都应该安装一些软件包。当你首次安装 Android SDK 时，它不会附带任何平台版本（即 Android 版本）。安装平台非常简单。启动\
  \ SDK Manager 后，你会看到已安装的内容以及可安装的内容，如 图 2-2 所示。你必须添加 Android SDK Tools 和 Platform-tools，环境才能正常工作。因为你很快会用到它，所以至少添加\
  \ Android 1.6 SDK Platform。\n\n![图片](img/9781430239307_Fig02-02.jpg)\n\n**图 2-2**\
  \ *向 Android SDK 添加软件包*\n\n点击“Install”按钮。你需要为每个要安装的项目点击“Accept”（或点击“Accept All”），然后点击“Install”。然后\
  \ Android 会下载你的软件包和平台以供使用。Google APIs 是用于开发使用 Google Maps 的应用程序的附加组件。你随时可以回来添加更多软件包。\n\
  \n##### 更新你的 PATH 环境变量\n\nAndroid SDK 带有一个 `tools` 目录，你需要将其添加到 PATH 中。你还需要将刚刚安装的\
  \ `platform-tools` 目录添加到 PATH 中。现在就来添加它们，或者如果你正在升级，请确保它们正确无误。同时，你还可以添加一个 JDK bin\
  \ 目录，这会让之后的操作更简便。\n\n对于 Windows，返回“环境变量”窗口。编辑 PATH 变量，在末尾添加一个分号（`;`），然后跟上 Android\
  \ SDK tools 文件夹的路径，再跟一个分号，接着是 Android SDK platform-tools 文件夹的路径，再跟一个分号，最后是 `%JAVA_HOME%\\\
  bin`。完成后点击“确定”。对于 Mac OS X 和 Linux，编辑你的 `.bashrc` 文件，将 Android SDK tools 目录路径添加到你的\
  \ PATH 变量中，同时添加 Android SDK `platform-tools` 目录和 `$JAVA_HOME/bin` 目录。类似以下命令适用于 Linux：\n\
  \n```\nexport PATH=$PATH:$HOME/android-sdk-linux_x86/tools:$HOME/android-sdk-linux_x86/platform-tools:$JAVA_HOME/bin\n\
  ```\n\n请确保指向 Android SDK tools 目录的 PATH 组件与你特定的设置相符。\n\n#### 工具窗口\n\n在本书的后续部分，有时你需要执行命令行实用程序。这些程序是\
  \ JDK 或 Android SDK 的一部分。通过将这些目录添加到 PATH 中，你无需指定完整路径名即可执行它们，但你需要启动一个*工具窗口*来运行它们（后续章节会提及此工具窗口）。在\
  \ Windows 中创建工具窗口最简单的方法是选择“开始”![图片](img/U001.jpg)“运行”，输入 `cmd`，然后点击“确定”。对于 Mac OS\
  \ X，在 Finder 的“Applications”文件夹中或 Dock（如果存在）中选择“终端”。对于 Linux，从“应用程序”![图片](img/U001.jpg)“附件”菜单中选择“终端”。\n\
  \n稍后你可能需要知道工作站的 IP 地址。在 Windows 中查找时，启动一个工具窗口并输入命令 `ipconfig`。结果中包含一个 IPv4（或类似名称）条目，旁边列出了你的\
  \ IP 地址。IP 地址看起来像这样：192.168.1.25。对于 Mac OS X 和 Linux，启动一个工具窗口并使用命令 `ifconfig`。你可以在标签\
  \ `inet addr` 旁边找到你的 IP 地址。\n\n你可能会看到一个名为 localhost 或 lo 的网络连接；该网络连接的 IP 地址是 127.0.0.1。这是一个操作系统使用的特殊网络连接，与工作站\
  \ IP 地址不同。请查找另一个不同的数字作为工作站的 IP 地址。\n\n\n\n### 安装安卓开发工具（ADT）\n\n现在你需要安装 `ADT`，这是一个帮助构建安卓应用的\
  \ Eclipse 插件。具体来说，`ADT` 与 Eclipse 集成，为你提供创建、测试和调试安卓应用的功能。你需要使用 Eclipse 中的“安装新软件”功能来进行安装。（升级\
  \ `ADT` 的说明将在本节稍后给出。）首先，启动 Eclipse IDE 并按照以下步骤操作：\n\n1.  选择 **帮助** ![Image](img/U001.jpg)\
  \ **安装新软件**。\n2.  选择 **工作台** 字段，输入\n    [`https://dl-ssl.google.com/android/eclipse/`](https://dl-ssl.google.com/android/eclipse/)\n\
  \    并按回车键。Eclipse 连接该站点并填充列表，如图 2-3 所示。\n3.  你应该会看到一个名为 **开发者工具** 的条目，包含四个子节点：**Android\
  \ DDMS**、**Android Development Tools**、**Android Hierarchy Viewer** 和 **Android\
  \ Traceview**。选中父节点 **开发者工具**，确保子节点也已被选中，然后点击 **下一步** 按钮。你看到的版本可能比这些更新，这没问题。你可能还会看到其他工具。这些工具将在第\
  \ 11 章中进一步解释。\n4.  Eclipse 会要求你确认要安装的工具。点击 **下一步**。\n5.  系统会要求你查看 `ADT` 以及安装 `ADT`\
  \ 所需工具的许可协议。查看许可协议，点击 **我接受**，然后点击 **完成** 按钮。\n\n![Image](img/9781430239307_Fig02-03.jpg)\n\
  \n**图 2-3.** *使用 Eclipse 的“安装新软件”功能安装 ADT*\n\nEclipse 会下载开发者工具并进行安装。你需要重启 Eclipse，以便新插件在\
  \ IDE 中显示。\n\n如果你在 Eclipse 中已经安装了旧版本的 `ADT`，请转到 Eclipse 的 **帮助** 菜单，选择 **检查更新**。你应该会看到新版本的\
  \ `ADT`，然后可以按照安装说明操作，从第 3 步继续。\n\n**注意：** 如果你正在升级 `ADT`，可能不会在要升级的工具列表中看到其中一些工具。如果没看到它们，那么在升级完\
  \ `ADT` 的其余部分后，请转到 **安装新软件**，并从 **工作台** 菜单中选择 [`https://dl-ssl.google.com/android/eclipse/`](https://dl-ssl.google.com/android/eclipse/)。中间窗口应显示其他可供安装的工具。\n\
  \n让 `ADT` 在 Eclipse 中正常工作的最后一步是将其指向 Android SDK。在 Eclipse 中，选择 **窗口** **首选项**。![Image](img/U001.jpg)\
  \ （在 Mac OS X 上，**首选项** 位于 **Eclipse** 菜单下。）在 **首选项** 对话框中，选择 **Android** 节点，并将\
  \ **SDK 位置** 字段设置为 Android SDK 的路径（参见图 2-4），然后点击 **应用** 按钮。请注意，你可能会看到一个对话框，询问是否要向\
  \ Google 发送有关 Android SDK 的使用统计信息；这取决于你自行决定。\n\n![Image](img/9781430239307_Fig02-04.jpg)\n\
  \n**图 2-4.** *将 ADT 指向 Android SDK*\n\n你可能还想在 **Android** ![Image](img/U001.jpg)\
  \ **构建** 页面上进行另一项首选项更改。如果你希望文件保存更快，则应勾选 **跳过打包** 选项。默认情况下，`ADT` 每次构建时都会为应用启动做好准备。通过勾选此选项（参见图\
  \ 2-5），打包和索引只会在真正需要时发生。\n\n![Image](img/9781430239307_Fig02-05.jpg)\n\n**图 2-5.**\
  \ *加快构建速度*\n\n在 Eclipse 中，你可以启动 SDK 管理器。为此，请选择 **窗口** ![Image](img/U001.jpg) **Android\
  \ SDK 管理器**。你应该会看到与图 2-2 相同的窗口。\n\n你已经为第一个安卓应用做好了准备——但首先，你必须简要了解安卓应用的基本概念。\n\n###\
  \ 学习基本组件\n\n每个应用框架都有一些关键组件，开发者在开始编写基于该框架的应用之前需要了解这些组件。例如，你需要了解 JavaServer Pages（`JSP`）和\
  \ servlet 才能编写 Java 2 平台企业版（`J2EE`）应用。同样，在为安卓构建应用时，你需要了解视图、活动、片段、意图、内容提供者、服务和 `AndroidManifest.xml`\
  \ 文件。这里简要介绍这些基本概念，并在整本书中更详细地探讨它们。\n\n#### 视图\n\n`视图` 是构成用户界面基本构建块的用户界面（`UI`）元素。一个\
  \ `视图` 可以是一个按钮、一个标签、一个文本字段或许多其他 `UI` 元素。如果你熟悉 `J2EE` 和 Swing 中的 `视图`，那么你就能理解安卓中的\
  \ `视图`。`视图` 也可以用作其他 `视图` 的容器，这意味着 `UI` 中通常存在一个 `视图` 的层次结构。最终，你看到的一切都是一个 `视图`。\n\n\
  #### 活动\n\n一个 `活动` 是一个 `UI` 概念，通常代表应用中的单个屏幕。它通常包含一个或多个 `视图`，但也可以不包含。`活动` 顾名思义——它是帮助用户做某件事的东西，可能是查看数据、创建数据或编辑数据。大多数安卓应用内部都有多个活动。\n\
  \n#### 片段\n\n当屏幕很大时，在单个 `活动` 中管理其所有功能会变得困难。`片段` 类似于子活动，一个 `活动` 可以在屏幕上同时显示一个或多个 `片段`。当屏幕很小时，一个\
  \ `活动` 更可能只包含一个 `片段`，而这个 `片段` 可以是较大屏幕中使用的同一个。\n\n#### 意图\n\n`意图` 泛泛地定义了执行某项工作的“意图”。`意图`\
  \ 封装了几个概念，因此理解它们的最佳方式是查看它们的使用示例。你可以使用 `意图` 执行以下任务：\n\n*   广播一条消息。\n*   启动一个服务。\n\
  *   启动一个活动。\n*   显示一个网页或联系人列表。\n*   拨打一个电话号码或接听一个电话。\n\n`意图` 并不总是由你的应用发起的——系统也会使用它们来通知你的应用特定事件（例如收到一条短信）。\n\
  \n`意图` 可以是显式的或隐式的。如果你只是简单地说要显示一个 `URL`，系统会决定哪个组件来完成这个意图。你也可以提供关于应由什么处理这个意图的具体信息。`意图`\
  \ 将动作和动作处理器松散地耦合在一起。\n\n#### 内容提供者\n\n设备上的移动应用之间的数据共享很常见。因此，安卓为应用定义了一种标准机制来共享数据（例如联系人列表），而无需暴露底层存储、结构和实现。通过内容提供者，你可以公开你的数据，并让你的应用使用来自其他应用的数据。\n\
  \n#### 服务\n\n安卓中的 `服务` 类似于你在 Windows 或其他平台中看到的服务——它们是可以在后台长时间运行的进程。安卓定义了两类服务：本地服务和远程服务。本地服务是只有托管该服务的应用才能访问的组件。相反，远程服务是旨在供设备上运行的其他应用远程访问的服务。\n\
  \n`服务` 的一个例子是电子邮件应用用来轮询新消息的组件。如果该 `服务` 不被设备上运行的其他应用使用，则这种 `服务` 可能是本地服务。如果多个应用使用该\
  \ `服务`，则它被实现为远程服务。\n\n#### AndroidManifest.xml\n\n`AndroidManifest.xml` 类似于 `J2EE`\
  \ 世界中的 `web.xml` 文件，它定义了应用的内容和行为。例如，它列出了应用的活动和服务，以及应用运行所需的权限和功能。\n\n\n\n### Android\
  \ 虚拟设备\n\nAndroid 虚拟设备（AVD）允许开发者在无需连接真实 Android 设备（通常是手机或平板电脑）的情况下测试应用程序。AVD 可以通过多种配置进行创建，以模拟不同类型的真实设备。\n\
  \n### Hello World\n\n现在，你已经准备好构建第一个 Android 应用程序。首先构建一个简单的“Hello World！”程序。按照以下步骤创建应用程序的骨架：\n\
  \n1. 启动 Eclipse，选择文件 ![Image](img/U001.jpg) 新建 ![Image](img/U001.jpg) 项目。在“新建项目”对话框中，选择\
  \ Android，然后点击“下一步”。你会看到“新建 Android 项目”对话框，如图 2 – 6 所示。（Eclipse 可能已将“Android 项目”添加到“新建”菜单中，因此如果有的话，可以直接使用。工具栏上还有一个“新建\
  \ Android 项目”按钮。）\n\n   ![Image](img/9781430239307_Fig02-06.jpg)\n\n   **图 2–6.**\
  \ *使用新建项目向导创建 Android 应用程序*\n\n2. 如图 2–6 所示，输入 **HelloAndroid** 作为项目名称。你需要将此项目与在\
  \ Eclipse 中创建的其他项目区分开来，因此，当你查看 Eclipse 环境中的所有项目时，选择一个对你有意义的名称。另外请注意，项目的默认位置源自 Eclipse\
  \ 工作区位置。新建项目向导会将新应用程序的名称附加到工作区位置。在这种情况下，如果你的 Eclipse 工作区是 `c:\\android`，那么你的新项目位于\
  \ `c:\\android\\HelloAndroid\\`。\n\n3. 暂时不修改“位置”部分，因为你希望在工作区的默认位置创建一个新项目。点击“下一步”。\n\
  \n4. 下一个窗口显示可用的构建目标。选择 Android 1.6。这是你作为应用程序基础的 Android 版本。你可以在更高版本的 Android（例如\
  \ 2.1 和 2.3.3）上运行应用程序；但 Android 1.6 具备你所需要的一切功能，因此选择它作为目标。通常，最好选择尽可能低的版本号，因为这可以最大化能够运行你应用程序的设备数量。点击“下一步”进入最后一个向导窗口。\n\
  \n5. 输入 **Hello Android** 作为应用程序名称。此名称将随应用程序图标一起显示在应用程序的标题栏和应用程序列表中。它应该具有描述性，但不宜过长。\n\
  \n6. 使用 `com.androidbook.hello` 作为包名。你的应用程序必须有一个基础包名，这就是它。此包名将用作应用程序的标识符，并且在所有应用程序中必须是唯一的。因此，最好以你拥有的域名开头来命名包名。如果你没有域名，请发挥创意，确保你的包名不会被其他人使用。但是，不要使用以\
  \ `com.google`、`com.android`、`android` 或 `com.example` 开头的包名，因为这些域名被 Google 限制使用，你将无法将应用程序上传到\
  \ Android Market。\n\n7. 输入 **HelloActivity** 作为创建 Activity 名称。你这是在告诉 Android，当应用程序启动时应启动此\
  \ Activity。你的应用程序中可能还有其他 Activity，但这个 Activity 是应用程序启动时用户首先看到的界面。\n\n8. Min SDK\
  \ Version 的值为 4，意味着你的应用程序需要 Android 1.6 或更高版本。技术上，你可以指定一个低于构建目标值的 Min SDK Version。如果你的应用程序调用了旧版\
  \ Android 中不存在的功能，你需要妥善处理这种情况，但这可以做到。\n\n9. 点击“完成”按钮，这将指示 ADT 为你生成项目骨架。现在，打开 `src`\
  \ 文件夹下的 `HelloActivity.java` 文件，并按如下方式修改 `onCreate()` 方法：\n\n   ```\n   /** 当 Activity\
  \ 首次创建时被调用。 */\n       @Override\n       public void onCreate(Bundle savedInstanceState)\
  \ {\n           super.onCreate(savedInstanceState);\n           /** 创建一个 TextView\
  \ 并写入 Hello World! */\n           TextView tv = new TextView(this);\n          \
  \ tv.setText(\"Hello World!\");\n           /** 将内容视图设置为 TextView */\n         \
  \  setContentView(tv);\n      }\n   ```\n\n   你可能需要向代码中添加一条 `import android.widget.TextView;`\
  \ 语句，以消除 Eclipse 报告的错误。保存 `HelloActivity.java` 文件。\n\n要运行该应用程序，你需要创建一个 Eclipse 启动配置，并且需要一个虚拟设备来运行它。我们快速浏览这些步骤，稍后再详细介绍\
  \ AVD。按照以下步骤创建 Eclipse 启动配置：\n\n1. 选择运行 ![Image](img/U001.jpg) 运行配置。\n\n2. 在“运行配置”对话框中，双击左窗格中的“Android\
  \ 应用程序”。向导会插入一个名为“新配置”的新配置。\n\n3. 将配置重命名为 **RunHelloWorld**。\n\n4. 点击“浏览”按钮，然后选择\
  \ HelloAndroid 项目。\n\n5. 将“启动操作”设置为“启动默认 Activity”。对话框应如图 2–7 所示。\n\n   ![Image](img/9781430239307_Fig02-07.jpg)\n\
  \n   **图 2–7.** *配置 Eclipse 启动配置以运行“Hello World！”应用程序*\n\n6. 点击“应用”，然后点击“运行”。你几乎快完成了！Eclipse\
  \ 已准备好运行你的应用程序，但它需要一个设备来运行它。如图 2–8 所示，系统会警告你未找到兼容的目标，并询问你是否要创建一个。点击“是”。\n\n   ![Image](img/9781430239307_Fig02-08.jpg)\n\
  \n   **图 2–8.** *有关目标的错误消息提示，并询问是否创建新的 AVD*\n\n7. 系统会显示一个窗口，其中列出了现有的 AVD（见图 2–9）。你需要添加一个适用于新应用程序的\
  \ AVD。点击“新建”按钮。\n\n   ![Image](img/9781430239307_Fig02-09.jpg)\n\n   **图 2–9.**\
  \ *现有的 Android 虚拟设备*\n\n8. 如图 2–10 所示填写“创建 AVD”表单。将名称设置为 Gingerbread，为目标选择 Android\
  \ 2.3.3 - API 级别 10（或其他版本），将 SD 卡大小设置为 10（代表 10MB），启用快照，并使用默认皮肤。点击“创建 AVD”。管理器可能会确认成功创建了你的\
  \ AVD。点击右上角的 X 关闭 AVD 管理器窗口。\n\n   ![Image](img/9781430239307_Fig02-10.jpg)\n\n\
  \   **图 2–10.** *配置 Android 虚拟设备*\n\n   **注意：** 你为 AVD 选择了较新版本的 SDK，但你的应用程序也可以在旧版本上运行。这是可以的，因为带有较新\
  \ SDK 的 AVD 可以运行需要旧版 SDK 的应用程序。当然，反之则不成立：需要新版 SDK 功能的应用程序无法在带有旧版 SDK 的 AVD 上运行。\n\
  \n9. 从底部列表中选择你的新 AVD。请注意，你可能需要点击“刷新”按钮才能使任何新的 AVD 显示在列表中。点击“确定”按钮。\n\n10. Eclipse\
  \ 将启动模拟器，并运行你的第一个 Android 应用程序（见图 2–11）！\n\n\n\n**注：**模拟器可能需要一些时间来模拟设备的启动过程。启动完成后，您通常会看到一个锁定屏幕。点击菜单按钮或拖动解锁图像来解锁\
  \ AVD。解锁后，您应该会看到`HelloAndroidApp`在模拟器中运行，如图 2-11 所示。请注意，模拟器在启动过程中会在后台启动其他应用程序，因此您可能会不时看到警告或错误消息。如果出现这种情况，通常可以将其关闭，让模拟器继续启动过程。例如，如果运行模拟器时看到类似“`application\
  \ abc`未响应”的消息，您可以等待应用程序启动，或者直接让模拟器强制关闭该应用程序。一般来说，您应该等待并让模拟器正常启动。\n\n![图片](img/9781430239307_Fig02-11.jpg)\n\
  \n**图 2-11.** *HelloAndroidApp 在模拟器中运行*\n\n现在您已经知道如何创建新的 Android 应用程序并在模拟器中运行它了。接下来，您将更深入地了解\
  \ AVD，以及如何部署到真实设备上。\n\n### Android 虚拟设备\n\nAVD 代表一种设备配置。例如，您可以创建一个 AVD，代表一台运行 SDK\
  \ 1.5 版本、配备 32MB SD 卡的老旧 Android 设备。其思路是，您创建自己将要支持的 AVD，然后在开发和测试应用程序时将模拟器指向其中一个\
  \ AVD。指定（和更改）要使用的 AVD 非常容易，这使使用各种配置进行测试变得轻而易举。前面您已经看到了如何使用 Eclipse 创建 AVD。您可以在 Eclipse\
  \ 中选择 Window ![图片](img/U001.jpg) AVD Manager 来创建更多 AVD。您也可以使用命令行创建 AVD。具体方法如下。\n\
  \n要创建一个 AVD，您需要使用位于`tools`目录（`c:\\android-sdk-windows\\tools\\`）下的批处理文件`android`。`android`允许您创建新的\
  \ AVD 并管理现有的 AVD。例如，您可以查看现有的 AVD、移动 AVD 等。通过运行`android -help`可以查看使用`android`的可用选项。现在，我们只创建一个\
  \ AVD。\n\n默认情况下，AVD 存储在您的主目录（所有平台）下一个名为`.android\\AVD`的文件夹中。如果您刚刚为“Hello World!”应用程序创建了一个\
  \ AVD，那么可以在此处找到它。如果您想在其他位置存储或操作 AVD，也可以这样做。对于本例，让我们创建一个用于存储 AVD 镜像的文件夹，例如`c:\\avd\\\
  `。下一步是在工具窗口中使用以下命令列出可用的 Android 目标：\n\n```\nandroid list target\n```\n\n此命令的输出是所有已安装\
  \ Android 版本的列表，列表中的每个项目都有一个 ID。再次使用工具窗口，输入以下命令（使用适合您工作站的路径来存储 AVD 文件，并根据您安装的 SDK\
  \ 平台目标，为`-t` ID 参数使用适当的值）：\n\n```\nandroid create avd -n CupcakeMaps -t 2 -c 16M\
  \ -p c:\\avd\\CupcakeMaps\\\n```\n\n传递给批处理文件的参数列在表 2-1 中。\n\n![图片](img/9781430239307_t0201.jpg)\n\
  \n执行上述命令会生成一个 AVD；您应该会看到类似图 2-12 所示的输出。请注意，当您运行`create avd`命令时，系统会询问您是否要创建自定义硬件配置文件。此时请回答\
  \ no，但要知道，回答 yes 会提示您为 AVD 配置许多选项，例如屏幕尺寸、摄像头是否存在等。\n\n![图片](img/9781430239307_Fig02-12.jpg)\n\
  \n**图 2-12.** *创建 AVD 将产生如下`android.bat`输出。*\n\n即使您使用`android.bat`程序为`CupcakeMaps`指定了备用位置，在您主目录的`.android/AVD`文件夹下仍然会有一个`CupcakeMaps.ini`文件。这是一件好事，因为如果您返回\
  \ Eclipse 并选择 Window ![图片](img/U001.jpg) AVD Manager，您将看到所有 AVD。在 Eclipse 中运行 Android\
  \ 应用程序时，您可以访问其中任何一个。\n\n再看一下图 2-2。每个 Android 版本都有一个 API 级别。Android 1.6 的 API 级别为\
  \ 4，Android 2.1 的 API 级别为 7。这些 API 级别编号并不对应于`android create avd`命令用于`-t`参数的目标 ID。您始终需要使用`android\
  \ list target`命令来获取`android create avd`命令所需的适当目标 ID 值。\n\n### 在真实设备上运行\n\n测试 Android\
  \ 应用程序的最佳方式是将其运行在真实设备上。任何商用 Android 设备在连接到您的工作站时都应该可以工作，但您可能需要做一些设置工作。如果您使用的是 Mac，只需通过\
  \ USB 线缆插入设备即可，无需其他操作。然后，在设备本身上，依次选择 Settings ![图片](img/U001.jpg) Applications ![图片](img/U001.jpg)\
  \ Development，并启用 USB 调试。在 Linux 上，您可能需要创建或修改此文件：`/etc/udev/rules.d/51-android.rules`。我们将此文件的一份副本与项目文件一起放在了我们的网站上；将其复制到正确的目录，并根据您的机器适当修改用户名和组值。然后，当您插入\
  \ Android 设备时，它将被识别。接下来，在设备上启用 USB 调试。\n\n对于 Windows，您需要处理 USB 驱动程序。Google 在 Android\
  \ 包中提供了一些驱动程序，这些驱动程序位于 Android SDK 目录的`usb_driver`子目录下。其他设备供应商也会为您提供驱动程序，因此请在他们的网站上查找。当您设置好驱动程序后，在设备上启用\
  \ USB 调试，一切就绪了。\n\n现在设备已连接到您的工作站，当您尝试启动一个应用程序时，它要么直接在设备上启动，要么（如果您有模拟器在运行或连接了其他设备）会打开一个窗口，您可以在其中选择要启动到的设备或模拟器。如果没有，请尝试编辑您的运行配置以手动选择目标。\n\
  \n\n\n### 探索 Android 应用的结构\n\n尽管 Android 应用的大小和复杂程度可能千差万别，但它们的结构却十分相似。图 2–13 展示了您刚刚构建的“Hello\
  \ World!”应用的结构。\n\n![图片](img/9781430239307_Fig02-13.jpg)\n\n**图 2–13** *“Hello World!”应用的结构*\n\
  \nAndroid 应用包含一些必需的和可选的工件。表 2–2 总结了 Android 应用的各个元素。\n\n![图片](img/9781430239307_t0202.jpg)\n\
  \n从表 2–2 可以看出，Android 应用主要由三部分组成：应用描述文件、各种资源集合以及应用的源代码。如果暂时忽略 `AndroidManifest.xml`\
  \ 文件，您可以用一种简单的方式来理解 Android 应用：用代码实现业务逻辑，而其他所有内容都属于资源。这种基本结构与 J2EE 应用的基本结构类似，资源对应于\
  \ JSP，业务逻辑对应于 Servlet，而 `AndroidManifest.xml` 文件则对应于 `web.xml` 文件。\n\n您还可以将 J2EE\
  \ 的开发模型与 Android 的开发模型进行比较。在 J2EE 中，构建视图的理念是使用标记语言来构建。Android 也采用了这种方法，尽管 Android\
  \ 中的标记是 XML。这种方法的好处在于，您无需在代码中硬编码应用的视图；您只需通过编辑标记语言即可修改应用的外观和感觉。\n\n此外，还需要注意几个关于资源的限制。首先，Android\
  \ 仅支持 `res` 下预定义文件夹内的文件线性列表。例如，它不支持在 `layout` 文件夹（或 `res` 下的其他文件夹）中嵌套子文件夹。其次，`assets`\
  \ 文件夹与 `res` 下的 `raw` 文件夹有一些相似之处。这两个文件夹都可以包含原始文件，但 `raw` 中的文件被视为资源，而 `assets` 中的文件则不是。因此，`raw`\
  \ 中的文件可以被本地化、通过资源 ID 访问等。而 `assets` 文件夹的内容则被视为通用内容，使用时不受资源约束和支持。请注意，由于 `assets`\
  \ 文件夹的内容不被视为资源，您可以在该文件夹中放置任意层次的文件夹和文件。（第 3 章 会更详细地讨论资源。）\n\n**注意** 您可能已经注意到，Android\
  \ 中大量使用了 XML。您知道 XML 是一种臃肿的数据格式，因此这就引出了一个问题：当目标设备资源有限时，依赖 XML 是否合理？事实上，您在开发过程中创建的\
  \ XML 最终会通过 Android 资源打包工具（AAPT）编译为二进制文件。因此，当您的应用安装到设备上时，设备上的文件是以二进制形式存储的。在运行时需要该文件时，会以其二进制形式读取，而不会转换回\
  \ XML。这使您两全其美——既可以使用 XML 进行开发，又无需担心占用设备上的宝贵资源。\n\n### 审视应用生命周期\n\nAndroid 应用的生命周期由系统根据用户需求、可用资源等因素严格管理。例如，用户可能想启动一个网络浏览器，但最终由系统决定是否启动该应用。尽管系统是最终管理者，但它会遵循一些明确且合乎逻辑的准则来决定一个应用是否可以被加载、暂停或停止。如果用户当前正在使用某个活动（Activity），系统会给予该应用很高的优先级。\n\
  \n相反地，如果一个活动不可见，并且系统判定必须关闭某个应用以释放资源，它会关闭优先级较低的应用。\n\n这与基于 Web 的 J2EE 应用的生命周期形成对比。J2EE\
  \ 应用受到其运行容器的松散管理。例如，J2EE 容器可以在某个应用闲置超过预定时间后，将其从内存中移除。但容器通常不会根据负载和/或可用资源将应用移入或移出内存。J2EE\
  \ 容器通常拥有足够的资源来同时运行大量应用。而 Android 的资源更加有限，因此 Android 必须对应用拥有更强的控制力和主导权。\n\n**注意**\
  \ Android 在独立进程中运行每个应用，每个进程都拥有自己的虚拟机。这提供了一个受保护的内存环境。通过将应用隔离到单独的进程中，系统可以控制哪个应用应获得更高的优先级。例如，一个正在执行\
  \ CPU 密集型任务的进程无法阻止来电。\n\n应用生命周期的概念是合乎逻辑的，但 Android 应用的一个基本方面却使事情变得复杂。具体来说，Android\
  \ 应用架构是以组件和集成为导向的。这带来了丰富的用户体验、无缝复用和便捷的应用集成，但也为应用生命周期管理器带来了复杂的任务。\n\n让我们考虑一个典型场景。用户正在通电话，需要打开一封电子邮件来回答一个问题。用户进入主屏幕，打开邮件应用，打开该邮件，点击邮件中的链接，并通过阅读网页上的股票报价来回答朋友的问题。这个场景涉及四个应用：主屏幕应用、通话应用、邮件应用和浏览器应用。当用户从一个应用导航到另一个应用时，体验是无缝的。然而在后台，系统正在保存和恢复应用的状态。例如，当用户点击邮件中的链接时，系统会先保存正在运行的邮件活动（Activity）的元数据，然后启动浏览器应用的活动来加载\
  \ URL。事实上，系统在启动另一个活动之前，会保存任何当前活动的元数据，以便之后能够返回到该活动（例如，当用户回退时）。如果内存成为问题，系统必须关闭正在运行某个活动的进程，并在必要时恢复它。\n\
  \nAndroid 对应用及其组件的生命周期非常敏感。因此，您需要理解并处理生命周期事件，以构建稳定的应用。运行您 Android 应用及其组件的进程会经历各种生命周期事件，Android\
  \ 提供了您可以通过实现来处理状态变化的回调方法。首先，您应该熟悉一个活动的各种生命周期回调方法（参见代码清单 2–1）。\n\n***代码清单 2–1.**\
  \ *活动的生命周期方法*\n\n```\nprotected void onCreate(Bundle savedInstanceState);\nprotected\
  \ void onStart();\nprotected void onRestart();\nprotected void onResume();\nprotected\
  \ void onPause();\nprotected void onStop();\nprotected void onDestroy();\n```\n\n\
  \n\n`清单 2–1` 展示了 Android 在 Activity 生命周期中调用的生命周期方法列表。为了确保实现稳定的应用程序，理解系统何时调用每个方法非常重要。请注意，您不需要对所有方法都做出响应。但如果需要响应，请确保也调用父类版本。`图\
  \ 2–14` 显示了状态之间的转换。\n\n![Image](img/9781430239307_Fig02-14.jpg)\n\n**图 2–14.** *Activity\
  \ 的状态转换*\n\n系统可以根据当前发生的其他事件来启动和停止您的 Activity。当 Activity 被新创建时，Android 会调用 `onCreate()`\
  \ 方法。`onCreate()` 之后总是跟着调用 `onStart()`，但 `onStart()` 并不总是由 `onCreate()` 调用触发，因为如果您的应用程序曾被停止，`onStart()`\
  \ 也可能被调用。当 `onStart()` 被调用时，您的 Activity 对用户还不可见，但即将可见。`onResume()` 在 `onStart()`\
  \ 之后被调用，此时 Activity 处于前台并可被用户访问。此时，用户可以开始与您的 Activity 交互。\n\n当用户决定切换到另一个 Activity\
  \ 时，系统会调用您的 Activity 的 `onPause()` 方法。在 `onPause()` 之后，您可以预期 `onResume()` 或 `onStop()`\
  \ 会被调用。例如，如果用户将您的 Activity 带回前台，则会调用 `onResume()`。如果您的 Activity 对用户变为不可见，则会调用 `onStop()`。如果在\
  \ `onStop()` 被调用后，您的 Activity 被带回前台，则会调用 `onRestart()`。如果您的 Activity 位于 Activity\
  \ 栈中但对用户不可见，并且系统决定终止您的 Activity，则会调用 `onDestroy()`。\n\n上述描述的 Activity 状态模型看起来很复杂，但您不需要处理所有可能的情况。您主要处理\
  \ `onCreate()`、`onResume()` 和 `onPause()`。您通过 `onCreate()` 为您的 Activity 创建用户界面。在此方法中，您将数据绑定到控件，并为您的\
  \ UI 组件连接事件处理器。在 `onPause()` 中，您需要将关键数据持久化到应用程序的数据存储中：这是系统终止您的应用程序之前，最后一个可以被安全调用的方法。`onStop()`\
  \ 和 `onDestroy()` 不保证一定会被调用，因此不要依赖这些方法处理关键逻辑。\n\n从以上讨论中能学到什么？系统管理着您的应用程序，并且可以在任何时间启动、停止或恢复某个应用程序组件。尽管系统控制着您的组件，但它们并非完全与您的应用程序隔离运行。换句话说，如果系统启动了您应用程序中的某个\
  \ Activity，您可以指望在该 Activity 中拥有一个应用程序上下文。\n\n到目前为止，您已经涵盖了创建新 Android 应用程序、在模拟器中运行\
  \ Android 应用程序、Android 应用程序的基本结构以及许多 Android 应用程序中常见的几个特性。但是，您还没有看到如何解决 Android\
  \ 应用程序中出现的问题。本章的最后一部分将讨论简单的调试。\n\n### 简单调试\n\nAndroid SDK 包含了一系列可用于调试的工具。这些工具已集成到\
  \ Eclipse IDE 中（请参见 图 2–15 的简要示例）。\n\n![Image](img/9781430239307_Fig02-15.jpg)\n\
  \n**图 2–15.** *在构建 Android 应用程序时可以使用的调试工具*\n\n在整个 Android 开发过程中，您会经常使用的一个工具是 `LogCat`。此工具显示您通过\
  \ `android.util.Log`、`System.out.println` 等发出的日志消息。尽管 `System.out.println` 也能工作，并且其消息会显示在\
  \ `LogCat` 窗口中，但从您的应用程序中记录消息时，应使用 `android.util.Log` 类。该类定义了您熟悉的提示、警告和错误方法，您可以利用这些方法在\
  \ `LogCat` 窗口中进行过滤，以便只查看您关注的信息。这是一个 `Log` 命令的示例：\n\n`Log.v(\"string TAG\", \"This\
  \ is my verbose message to write to the log\");`\n\n此示例展示了 `Log` 类的静态 `v()` 方法，但还有其他用于不同严重级别的方法。最好为要记录的消息使用合适的调用级别，通常不建议在打算部署到生产环境的应用程序中保留详细调用。请记住，日志记录会消耗内存和\
  \ CPU 资源。\n\n`LogCat` 特别方便的一点是，您不仅可以在模拟器中运行应用程序时查看日志消息，还可以在工作站上连接了处于调试模式的真实设备时查看日志消息。实际上，日志消息会被存储，以至于您甚至可以从记录日志消息时已断开的设备中检索到最新的消息。当您将设备连接到工作站并打开\
  \ `LogCat` 视图时，您会看到最近数百条消息。第 11 章 将涵盖更高级的调试。\n\n#### 启动模拟器\n\n之前您已经了解了如何从 Eclipse\
  \ 的项目中启动模拟器。大多数情况下，您应该先启动模拟器，然后再在正在运行的模拟器中部署和测试您的应用程序。要随时启动模拟器，首先通过运行 Android SDK\
  \ 的 `tools` 目录中的 `android` 程序或通过 Eclipse 的 `Window` 菜单进入 AVD Manager。进入 Manager\
  \ 后，从列表中选择所需的 AVD，然后单击 `Start`。\n\n当您单击 `Start` 按钮时，会打开“启动选项”对话框（参见 图 2–16）。这允许您缩放模拟器窗口的大小，并更改启动和关闭选项。当您使用中、小屏幕设备（如手机）的\
  \ AVD 时，通常可以使用默认屏幕尺寸。但对于大屏幕和超大屏幕尺寸（例如平板电脑），默认屏幕尺寸可能无法在工作站的屏幕上完美适配。如果出现这种情况，您可以启用“按实际尺寸缩放显示”并输入一个值。此标签有些误导，因为平板电脑的屏幕密度可能与您的工作站不同，并且模拟器无法完美匹配模拟器窗口在您屏幕上的实际物理尺寸。例如，在我们的工作站屏幕上，模拟一个\
  \ 10 英寸屏幕的 Honeycomb 平板电脑时，10 英寸的“真实尺寸”对应约 0.64 的缩放比例，并且工作站屏幕上的实际尺寸略大于 10 英寸。请根据您的屏幕尺寸和屏幕密度选择适合您的值。\n\
  \n![Image](img/9781430239307_Fig02-16.jpg)\n\n**图 2–16.** *启动选项对话框*\n\n您还可以在“启动选项”对话框中处理快照。退出模拟器时保存到快照会导致稍长的延迟。顾名思义，您将模拟器的当前状态写入到一个快照映像文件中，该文件可以在下次启动时使用，以避免经历完整的\
  \ Android 启动序列。如果存在快照，启动速度会快得多，这使得保存时的延迟非常值得——您基本上可以从上次离开的地方继续。\n\n如果您想从头开始全新的启动，可以选择“清除用户数据”。您也可以取消选择“从快照启动”以保留用户数据并经历完整的启动序列。或者，您可以创建一个自己喜欢的快照，并*仅*启用“从快照启动”选项；这会反复重用该快照，因此启动速度快，关闭速度也快，因为每次退出时不会创建新的快照映像文件。快照映像文件存储在与\
  \ AVD 其他映像文件相同的目录中。如果您在创建 AVD 时未启用快照，您可以随时编辑该 AVD 并在那里启用它们。\n\n\n\n### 小结\n\n本章涵盖以下主题，帮助您为\
  \ Android 开发做好准备：\n\n*   下载并安装 JDK、Eclipse 和 Android SDK\n*   如何修改您的 `PATH` 变量并启动工具窗口\n\
  *   安装 Android 开发工具（ADT），以及如何在拥有旧版本时进行更新\n*   视图、活动、片段、意图、内容提供程序、服务和 `AndroidManifest.xml`\
  \ 文件的基本概念\n*   安卓虚拟设备（AVD），可用于在您没有设备（或没有特定测试设备）时测试应用\n*   构建一个“Hello World!”应用并将其部署到模拟器\n\
  *   初始化任何应用的基本要求（项目名称、Android 目标、应用名称、包名、主活动、最低 SDK 版本）\n*   运行配置的位置以及如何更改它们\n*\
  \   创建 AVD 的命令行方法\n*   将真实设备连接到工作站并在其上运行您的新应用\n*   Android 应用的内部结构以及活动的生命周期\n* \
  \  `LogCat`，以及如何在其中查找应用发送的内部消息\n*   启动模拟器时可用的选项，例如快照和调整屏幕显示大小\n\n### 面试问题\n\n请回答以下问题以巩固您对本章节的理解：\n\
  \n1.  为 Android 开发需要 JRE 还是 JDK？\n2.  是否可以不使用 Eclipse 进行 Android 开发？\n3.  Android\
  \ SDK 下的 `tools` 和 `platform-tools` 目录有什么区别？\n4.  Android 中的视图是什么？\n5.  意图又是什么？\n\
  6.  判断正误：应用的构建目标必须与最低 SDK 版本相同。为什么是或为什么不是？\n7.  为应用选择包名时必须采取哪些预防措施？\n8.  什么是 AVD？它有什么用途？\n\
  9.  什么是 AVD 快照？如何使用它？\n10. 应用所需的 MP3 文件应存储在哪个源文件夹中？\n11. 应用图标文件应放在哪里？\n12. 活动看到的第一个生命周期回调是什么？\n\
  13. 活动看到的最后一个生命周期回调是什么？\n14. 用于从您的应用写入日志消息的类是什么？\n15. 可用于写入日志消息的所有方法有哪些，它们之间有什么不同？\n\
  \n## 第 3 章\n\n## 理解 Android 资源\n\n在 第 2 章 中，我们向您概述了 Android 应用，并快速了解了一些其底层概念。您还了解了\
  \ Android SDK、Eclipse Android 开发工具（ADT），以及如何在由 Android 虚拟设备（AVD）标识的模拟器上运行您的应用。\n\
  \n在本章及接下来的几章中，我们将深入探讨 Android SDK 的基础知识。这些基础知识包括资源、内容提供程序和意图。\n\nAndroid 依赖于以声明方式定义\
  \ UI 组件的资源。这种声明式方法与 HTML 使用声明式标签定义其 UI 的方式并无太大不同。从这个意义上说，Android 在 UI 开发方法上是具有前瞻性的。Android\
  \ 还允许对这些资源进行样式化和本地化。本章涵盖了 Android 中可用的各种资源。\n\n### 理解资源\n\n资源在 Android 架构中扮演着关键角色。Android\
  \ 中的资源是绑定到可执行应用的文件（如音乐文件或描述窗口布局的文件）或值（如对话框的标题）。这些文件与值以这样一种方式绑定到可执行文件：您可以在不重新编译应用的情况下更改它们或提供替代方案。\n\
  \n常见的资源示例包括字符串、颜色、位图和布局。资源允许您使用其 ID 来代替在应用中硬编码字符串。这种间接方式让您可以更改字符串资源的文本，而无需更改源代码。\n\
  \nAndroid 中有许多、许多资源类型。让我们从一种非常常见的资源——字符串——开始对资源的讨论。\n\n\n\n### 字符串资源\n\nAndroid\
  \ 允许你在一个或多个 XML 资源文件中定义字符串。这些包含字符串资源定义的 XML 文件位于 `/res/values` 子目录下。XML 文件的名称是任意的，不过通常你会看到文件名为\
  \ `strings.xml`。代码清单 3-1 展示了一个字符串资源文件的示例。\n\n**代码清单 3-1.** `strings.xml` 示例\n\n\
  ```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <string name=\"\
  hello\">hello</string>\n    <string name=\"app_name\">hello appname</string>\n</resources>\n\
  ```\n\n**注意：** 在某些 Eclipse 版本中，`<resources>` 节点需要使用 `xmlns` 规范进行限定。只要存在 `xmlns`，它指向什么似乎并不重要。以下两种变体都是可行的：\n\
  \n```\n<resources >\n```\n\n以及\n\n```\n<resources >\n```\n\n即使是文件的第一行（表明它是具有特定编码的\
  \ XML 文件）也是可选的。即使没有这一行，Android 也能正常运行。\n\n当此文件被创建或更新时，Eclipse ADT 插件会自动在你的应用程序根包中创建或更新一个名为\
  \ `R.java` 的 Java 类，其中包含为两个指定字符串资源生成的唯一 ID。请注意以下示例中 `R.java` 文件的位置。这是某个项目（例如 MyProject）的高级目录结构：\n\
  \n```\n\\MyProject\n   \\src\n         \\com\\mycompany\\android\\my-root-package\n\
  \         \\com\\mycompany\\android\\my-root-package\\another-package\n   \\gen\n\
  \\com\\mycompany\\android\\my-root-package\\R.java\n   \\assets\n   \\res\n   \\\
  AndroidManifest.xml\n...等\n```\n\n**注意：** 无论资源文件有多少个，都只有一个 `R.java` 文件。\n\n对于 代码清单\
  \ 3-1 中的字符串资源文件，更新后的 `R.java` 文件包含了 代码清单 3-2 中的条目。\n\n**代码清单 3-2.** `R.java` 示例\n\
  \n```\npackage com.mycompany.android.my-root-package;\npublic final class R {\n\
  \   ...其他取决于项目和应用的条目\n\n    public static final class string\n   {\n      ...其他取决于项目和应用的条目\n\
  \npublic static final int hello=0x7f040000;\n        public static final int app_name=0x7f040001;\n\
  \n      ...其他取决于项目和应用的条目\n    }\n   ...其他取决于项目和应用的条目\n}\n```\n\n首先请注意，`R.java` 如何在根包中定义了一个顶层类：`public\
  \ static final class R`。在这个 `R` 的外部类中，Android 定义了一个内部类 `static final class string`。`R.java`\
  \ 创建这个内部静态类作为一个命名空间，用于保存字符串资源 ID。\n\n用变量名 `hello` 和 `app_name` 定义的两个 `static final\
  \ int` 就是代表相应字符串资源的资源 ID。你可以通过以下代码结构在源代码中的任何位置使用这些资源 ID：\n\n```\nR.string.hello\n\
  ```\n\n生成的 ID 指向的是 `int` 类型而非 `string` 类型。大多数接受字符串的方法也接受这些资源标识符作为输入。Android 会在必要时将这些\
  \ `int` 解析为 `string`。\n\n大多数示例应用程序将所有字符串定义在一个 `strings.xml` 文件中仅仅是一种惯例。只要 XML 文件的结构看起来像\
  \ 代码清单 3-1 所示，并且文件位于 `/res/values` 子目录下，Android 可以接受任意数量的此类文件。\n\n这个文件的结构很容易理解。根节点\
  \ `<resources>` 后跟一个或多个 `<string>` 子元素。每个 `<string>` 元素或节点都有一个名为 `name` 的属性，该属性最终会成为\
  \ `R.java` 中的 `id` 属性。\n\n为了证明该子目录下允许存在多个字符串资源文件，你可以在同一子目录下放置另一个文件，内容如下，并将其命名为 `strings1.xml`（参见\
  \ 代码清单 3-3）。\n\n**代码清单 3-3.** 额外 `strings.xml` 文件示例\n\n```\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<resources>\n    <string name=\"hello1\">hello 1</string>\n\
  \    <string name=\"app_name1\">hello appname 1</string>\n</resources>\n```\n\n\
  Eclipse ADT 插件会在编译时验证这些 ID 的唯一性，并将它们作为两个附加常量放入 `R.java` 中：`R.string.hello1` 和 `R.string.app_name1`。\n\
  \n\n\n### 布局资源\n\n在 Android 中，屏幕视图通常作为资源从 XML 文件中加载。这与描述网页内容和布局的 HTML 文件非常相似。这些\
  \ XML 文件被称为布局资源。*布局资源*是 Android UI 编程中使用的关键资源。请参考代码清单 3-4 中的代码片段，这是一个 Android Activity\
  \ 的示例。\n\n**代码清单 3-4.** *使用布局文件*\n\n```java\npublic class HelloWorldActivity extends\
  \ Activity\n{\n    @Override\n    public void onCreate(Bundle savedInstanceState)\n\
  \    {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.main);\n\
  \        TextView tv = (TextView)this.findViewById(R.id.text1);\n        tv.setText(\"\
  Try this text instead\");\n    }\n    ...\n}\n```\n\n`setContentView(R.layout.main)`\
  \ 这行代码表明存在一个名为 `R.layout` 的静态类，在该类中，有一个名为 `main`（整型）的常量，它指向由 XML 布局资源文件定义的 `View`。该\
  \ XML 文件名为 `main.xml`，需要放置在资源目录的 `layout` 子目录中。换句话说，这行语句要求程序员创建 `/res/layout/main.xml`\
  \ 文件，并将必要的布局定义放入该文件中。`main.xml` 布局文件的内容可能如代码清单 3-5 所示。\n\n**代码清单 3-5.** *`main.xml`\
  \ 布局文件示例*\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\n\
  \    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\n\
  \    android:layout_height=\"fill_parent\"\n    >\n    <TextView    android:id=\"\
  @+id/text1\"\n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"\
  wrap_content\"\n    android:text=\"@string/hello\"\n    />\n    <Button    android:id=\"\
  @+id/b1\"\n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"\
  wrap_content\"\n    android:text=\"@string/hello\"\n    />\n</LinearLayout>\n```\n\
  \n代码清单 3-5 中的布局文件定义了一个名为 `LinearLayout` 的根节点，其中包含一个 `TextView` 后跟一个 `Button`。`LinearLayout`\
  \ 会垂直或水平地排列其子元素——在此示例中为垂直排列。\n\n你需要为每个屏幕（或 Activity）定义一个单独的布局文件。更准确地说，每个布局都需要一个专用文件。如果你要绘制两个屏幕，可能需要两个布局文件，例如\
  \ `/res/layout/screen1_layout.xml` 和 `/res/layout/screen2_layout.xml`。\n\n**注意：**\
  \ `/res/layout/` 子目录中的每个文件都会根据文件名（不包括扩展名）生成一个唯一的常量。对于布局，重要的是文件的数量；而对于字符串资源，重要的是文件*内部*单个字符串资源的数量。\n\
  \n例如，如果 `/res/layout/` 目录下有两个名为 `file1.xml` 和 `file2.xml` 的文件，那么在 `R.java` 中，你将拥有如代码清单\
  \ 3-6 所示的条目。\n\n**代码清单 3-6.** *多个布局文件的多个常量*\n\n```java\npublic static final class\
  \ layout {\n  .... any other files\n    public static final int file1=0x7f030000;\n\
  \    public static final int file2=0x7f030001;\n}\n```\n\n这些布局文件中定义的视图（例如 `TextView`，见代码清单\
  \ 3-5）可以通过 `R.java` 中生成的资源 ID 在 Java 代码中访问：\n\n```java\nTextView tv = (TextView)this.findViewById(R.id.text1);\n\
  tv.setText(\"Try this text instead\");\n```\n\n在这个例子中，你通过 `Activity` 类的 `findViewById`\
  \ 方法定位 `TextView`。常量 `R.id.text1` 对应于为 `TextView` 定义的 ID。布局文件中 `TextView` 的 ID 如下所示：\n\
  \n```xml\n<TextView android:id=\"@+id/text1\"\n..\n</TextView>\n```\n\n`id` 属性的值表示，常量\
  \ `text1` 用于在该 Activity 所拥有的其他视图中唯一标识此视图。`@+id/text1` 中的加号（`+`）表示如果 `text1` 这个 ID\
  \ 尚不存在，则会创建它。这种资源 ID 语法还有其他内容，我们接下来会看到。\n\n### 资源引用语法\n\n无论资源类型如何（目前介绍了字符串和布局两种），所有\
  \ Android 资源在 Java 源代码中都是通过其 ID 来标识（或引用）的。在 XML 文件中为资源分配 ID 所使用的语法被称为*资源引用语法*。这种语法不仅限于分配\
  \ ID：它也是一种标识任何资源（如字符串、布局文件或图像）的方式。\n\n这种定位资源或引用现有资源的通用方法与 ID 是如何关联的呢？事实证明，ID 是像字符串一样作为资源被跟踪的数值。想象一下你的项目持有一个数字池。你可以从池中取出一个数字并将其分配给一个控件。\n\
  \n让我们先进一步研究一下资源引用结构。该资源引用具有以下形式结构：\n\n`@[package:]type/name`\n\n其中 `type` 对应于 `R.java`\
  \ 中可用的资源类型命名空间，其中一些如下：\n\n*   `R.drawable`\n*   `R.id`\n*   `R.layout`\n*   `R.string`\n\
  *   `R.attr`\n*   `R.plural`\n*   `R.array`\n\nXML 资源引用语法中对应的类型如下：\n\n*   `drawable`\n\
  *   `id`\n*   `layout`\n*   `string`\n*   `attr`\n*   `plurals`\n*   `string-array`\n\
  \n资源引用 `@[package:]type/name` 中的 `name` 部分是赋予该资源的名称（例如代码清单 3-5 中的 `text1`）；它也在 `R.java`\
  \ 中表示为一个 `int` 常量。\n\n如果在语法 `@[package:]type/name` 中未指定包名，则 `type/name` 对将根据本地资源和应用程序本地的\
  \ `R.java` 包进行解析。\n\n如果指定了 `android:type/name`，则将使用包 `android` 进行引用解析，具体通过 `android.R.java`\
  \ 文件。你可以使用任何 Java 包名替换 `package` 占位符，以定位正确的 `R.java` 文件来解析引用。\n\n现在让我们回到代码清单 3-5\
  \ 中 ID 分配给控件的方式。ID 被视为资源。按照这个逻辑，当你编写\n\n```xml\n<TextView android:id=\"@+id/text1\"\
  \ ..../>\n```\n\n时，你是在说：“获取一个由类型 `id` 和值 `text1` 标识的资源，并将其分配给这个 `TextView` 实例。”\
  \ `+` 表示如果 `text1` 这个 `id` 未定义为资源，则用一个唯一的数字来定义它。\n\n基于此信息，让我们分析几个 ID 示例。在阅读代码清单\
  \ 3-7 时，请注意 ID `android:id` 的左侧（即 `android:id` 本身）不属于语法的一部分。`android:id` 只是你如何将\
  \ ID 分配给像 `TextView` 这样的控件的方式。\n\n**代码清单 3-7.** *探索资源引用语法*\n\n```xml\n<TextView\
  \  android:id=\"text\">\n// 编译错误，因为 id 不接受原始文本字符串。\n// 此外，它也不是有效的资源引用语法。\n\n<TextView\
  \  android:id=\"@text\">\n// 错误的语法。@text 缺少类型名称。\n// 它应该是 @id/text、@+id/text 或 @string/string1。\n\
  // 然而，这里的 string 类型虽然是有效的资源引用，但却是无效的。\n// 这是因为左侧需要的是 \"id\" 而不是 \"string\"。\n//\
  \ 你将得到一个错误：\"No Resource type specified\"。\n\n<TextView  android:id=\"@id/text\"\
  >\n// 错误: No Resource found that matches id \"text\"\n// 除非你事先已经将 \"text\" 定义为一个\
  \ ID\n\n<TextView  android:id=\"@android:id/text\">\n// 错误: Resource is not public\n\
  // 表明在 android.R.id 中没有这样的 id。\n// 当然，如果 Android 的 R.java 定义了此名称的 id，这将是有效的。\n\n\
  <TextView  android:id=\"@+id/text\">\n// 成功: 在本地包的 R.java 中创建了一个名为 \"text\" 的 id\n\
  ```\n\n\n好的，作为高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将以下英文文本翻译成中文。\n\n\n在语法`\"@+id/text\"\
  `中，`+`号具有特殊含义。它告诉 Android：ID `text`可能尚不存在，如果确实如此，则创建一个新的 ID 并将其命名为`text`。我们不知道在资源引用语法中，除了\
  \ ID 上下文之外，还有哪里会使用`+`。这很有道理，因为你不能假设某个字符串资源是在未明确指定其内容的情况下创建的。系统无法像创建唯一数字那样自动创建该资源。\n\
  \nID 与资源引用语法之间的这种联系常常是混淆的根源。要消除这种混淆，请记住一点：ID 是作为资源来指定的。\n\n### 为后续使用自定义资源 ID\n\n\
  分配 ID 的通用模式要么是创建一个新的 ID，要么是使用 Android 包创建的 ID。然而，也可以预先创建 ID，并在你自己的包中后续使用。再次强调，这源于\
  \ ID 是资源这一事实。如果它们是资源，就应该允许被预定义并可供后续使用。\n\n`<TextView android:id=\"@+id/text\">`这一行（如清单\
  \ 3–7 所示）表明：如果名为`text`的 ID 已存在，则使用它；如果该 ID 不存在，则创建一个新的。那么，像`text`这样的 ID 何时可能已经存在于`R.java`中以供重用呢？\n\
  \n你可能倾向于将`R.id.text`这样的常量放入`R.java`，但`R.java`是不可编辑的。即使它是可编辑的，每当`/res/*`子目录中的内容发生更改、添加或删除时，它都会被重新生成。\n\
  \n解决方案是使用名为`item`的资源标签来定义一个不依附于任何特定资源的 ID。清单 3–8 展示了一个示例。\n\n**清单 3–8.** *预定义一个\
  \ ID*\n```\n<resources>\n<item type=\"id\" name=\"text\"/>\n</resources>\n```\n\n\
  `type`指的是资源类型——在本例中是`id`。一旦此 ID 就位，清单 3–9 中的`View`定义就能正常工作。\n\n**清单 3–9.** *重用预定义的\
  \ ID*\n```\n<TextView android:id=\"@id/text\">\n..\n</TextView>\n```\n\n### 已编译与未编译的\
  \ Android 资源\n\nAndroid 主要通过两种类型的文件来支持资源：XML 文件和原始文件（例如包括图像、音频和视频）。你已经看到，在某些情况下，资源被定义为\
  \ XML 文件中的值（例如字符串），而有时整个 XML 文件就是一个资源（例如布局资源文件）。\n\n在 XML 文件集合中作进一步区分，你会发现两种类型：一种被编译为二进制格式，另一种则按原样复制到设备上。你目前看到的示例——字符串资源\
  \ XML 文件和布局资源 XML 文件——在成为可安装包的一部分之前会被编译成二进制格式。这些 XML 文件具有预定义的格式，其中 XML 节点可以被转换为\
  \ ID。\n\n你还可以选择一些 XML 文件，使其拥有自己自由的格式结构；这些文件不会被解释，但会生成资源 ID（`resource type: xml`）。然而，你确实希望将它们编译为二进制格式，并享受本地化的便利。为此，你可以将这些\
  \ XML 文件放置在`/res/xml/`子目录中，以使其被编译成二进制格式。在这种情况下，你需要使用 Android 提供的 XML 读取器来读取 XML\
  \ 节点。\n\n但是，如果你将文件（包括 XML 文件）放置在`/res/raw/`目录中，它们则不会被编译成二进制格式。然而，因为它是资源，Android\
  \ 会通过`R.java`生成一个 ID。原始文件的资源类型是`raw`。因此，你可以通过`R.raw.some-filename-minus-extension`访问这些文件的标识。你必须使用显式的基于流的\
  \ API 来读取这些文件。音频和视频文件就属于此类。\n\n**注意：** 由于`raw`目录是`/res/*`层级结构的一部分，即便是这些原始的音频和视频文件，也能像所有其他资源一样利用本地化和\
  \ ID 生成功能。\n\n正如我们在上一章的表 2-1 中提到的，资源文件根据其类型被存放在不同的子目录中。以下是`/res`文件夹中一些重要的子目录及其托管的资源类型：\n\
  \n*   `anim`：已编译的动画文件\n*   `drawable`：位图\n*   `layout`：UI 和视图定义\n*   `values`：数组、颜色、尺寸、字符串和样式\n\
  *   `xml`：已编译的任意 XML 文件\n*   `raw`：未编译的原始文件\n\nAndroid 资源打包工具（AAPT）中的资源编译器会编译除`raw`资源之外的所有资源，并将它们放入最终的`.apk`文件中。该文件包含了\
  \ Android 应用程序的代码和资源，对应于 Java 的`.jar`文件（`apk`代表 Android 包）。`.apk`文件就是安装到设备上的文件。\n\
  \n**注意：** 尽管 XML 资源解析器允许像`hello-string`这样的资源名称，但你在`R.java`中会看到编译时错误。你可以通过将资源重命名为`hello_string`（用下划线替换连字符）来解决这个问题。\n\
  \n### 列举关键的 Android 资源\n\n既然你已经了解了资源的基础知识，现在让我们列举一些 Android 支持的其他关键资源、它们的 XML 表示以及在\
  \ Java 代码中的使用方式。（你可以将本节作为为每种资源编写资源文件时的快速参考。）首先，快速浏览一下表 3–1 中资源的类型及其用途。\n\n![Image](img/9781430239307_tab3_01.jpg)\n\
  \n![Image](img/9781430239307_tab3_01a.jpg)\n\n表中指定的每种资源都将在后续章节中通过 XML 和 Java 代码片段进行详细说明。\n\
  \n**注意：** 从 ID 生成的性质来看，似乎——尽管我们还没有在任何官方资料中看到——如果 XML 文件不在`/res/values`子目录中，就会根据文件名生成\
  \ ID。如果它们在`values`子目录中，则仅查看文件的内容来生成 ID。\n\n#### 字符串数组\n\n你可以在`/res/values`子目录下的任何文件中将字符串数组指定为资源。为此，你需要使用一个名为`string-array`的\
  \ XML 节点。这个节点与`string`资源节点一样，是`resources`的子节点。清单 3–10 是在资源文件中指定数组的一个示例。\n\n**清单\
  \ 3–10.** *指定字符串数组*\n```\n<resources ....>\n......Other resources\n<string-array\
  \ name=\"test_array\">\n    <item>one</item>\n    <item>two</item>\n    <item>three</item>\n\
  </string-array>\n......Other resources\n</resources>\n```\n\n一旦你有了这个`string-array`资源定义，就可以像清单\
  \ 3–11 所示，在 Java 代码中检索这个数组。\n\n**清单 3–11.** *指定字符串数组*\n```\n//Get access to Resources\
  \ object from an Activity\nResources res = your-activity.getResources();\nString\
  \ strings[] = res.getStringArray(R.array.test_array);\n\n//Print strings\nfor (String\
  \ s: strings)\n{\n    Log.d(\"example\", s);\n}\n```\n\n\n\n### 复数资源\n\n资源 `plurals`\
  \ 是一组字符串，这些字符串用于表达数值数量的不同方式，例如巢中有多少颗蛋。考虑以下示例：\n\n`There is 1 egg.`\n`There are 2\
  \ eggs.`\n`There are 0 eggs.`\n`There are 100 eggs.`\n\n请注意，对于数字 2、0 和 100，句子是相同的，但数字\
  \ 1 对应的句子不同。Android 允许你将这种变化表示为 `plurals` 资源。清单 3–12 展示了如何在资源文件中根据数量表示这两种变化。\n\n\
  **清单 3–12.** 指定字符串数组\n\n```\n<resources...>\n<plurals name=\"eggs_in_a_nest_text\"\
  >\n    <item quantity=\"one\">There is 1 egg</item>\n    <item quantity=\"other\"\
  >There are %d eggs</item>\n</plurals>\n</resources>\n```\n\n这两种变化在同一个复数下被表示为两个不同的字符串。现在，你可以使用清单\
  \ 3–13 中的 Java 代码，根据给定数量使用此复数资源来打印字符串。`getQuantityString()` 方法的第一个参数是 `plurals`\
  \ 资源 ID。第二个参数选择要使用的字符串。当数量值为 1 时，直接使用该字符串。当数量值不为 1 时，必须提供第三个参数，其值将替换 `%d` 的位置。如果在\
  \ `plurals` 资源中使用了格式化字符串，则必须始终提供至少三个参数。第二个参数可能会令人困惑；该参数的唯一区别在于其值是 1 还是非 1。\n\n**清单\
  \ 3–13.** 指定字符串数组\n\n```\nResources res = your-activity.getResources();\nString\
  \ s1 = res.getQuantityString(R.plurals.eggs_in_a_nest_text, 0,0);\nString s2 = res.getQuantityString(R.plurals.eggs_in_a_nest_text,\
  \ 1,1);\nString s3 = res.getQuantityString(R.plurals.eggs_in_a_nest_text, 2,2);\n\
  String s4 = res.getQuantityString(R.plurals.eggs_in_a_nest_text, 10,10);\n```\n\n\
  根据此代码，每个数量都会得到一个适合其复数形式的恰当字符串。\n\n然而，上述 `<item>` 节点的 `quantity` 属性还有哪些其他可能的值？我们强烈建议你阅读\
  \ Android 源代码发行版中的 `Resources.java` 和 `PluralRules.java` 的源代码，以真正理解这一点。本章末尾“资源”部分的链接中有这些源文件的摘录。\n\
  \n关键在于，对于 `en`（英语）语言区域，唯一可能的两个值是`\"one\"`和`\"other\"`。对于除 `cs`（捷克语）之外的所有其他语言也是如此，在捷克语中，值分别是`\"\
  one\"`（用于 1）、`\"few\"`（用于 2 到 4），以及用于其余情况的`\"other\"`。\n\n### 关于字符串资源的更多内容\n\n我们在前面的章节简要介绍了字符串资源。现在让我们重新审视它们，以提供更多细节，包括\
  \ HTML 字符串以及如何在字符串资源中替换变量。\n\n**注意：** 大多数 UI 框架都支持字符串资源。然而，与其他 UI 框架不同，Android 提供了通过\
  \ `R.java` 快速将 ID 与字符串资源关联起来的能力，因此在 Android 中将字符串用作资源要容易得多。\n\n我们首先来看如何在 XML 资源文件中定义普通字符串、带引号的字符串、HTML\
  \ 字符串和可替换字符串（参见清单 3–14）。\n\n**清单 3–14.** 定义字符串资源的 XML 语法\n\n```\n<resources>\n \
  \   <string name=\"simple_string\">simple string</string>\n    <string name=\"quoted_string\"\
  >\"quoted 'xyz' string\"</string>\n    <string name=\"double_quoted_string\">\\\"\
  double quotes\\\"</string>\n    <string name=\"java_format_string\">\n         \
  \  hello %2$s Java format string. %1$s again\n     </string>\n     <string name=\"\
  tagged_string\">\n         Hello <b><i>Slanted Android</i></b>, You are bold.\n\
  \     </string>\n</resources>\n```\n\n这个 XML 字符串资源文件需要放在 `/res/values` 子目录中。文件名可以任意。\n\
  \n请注意，带引号的字符串需要转义或放在备用引号中。字符串定义也允许使用标准的 Java 字符串格式化序列。\n\nAndroid 还允许在 `<string>`\
  \ 节点内使用子 XML 元素，例如 `<b>`、`<i>` 以及其他简单的文本格式化 HTML。你可以使用这种复合 HTML 字符串在文本视图（text view）绘制之前对文本进行样式设置。\n\
  \n清单 3–15 中的 Java 示例说明了每种用法。\n\n**清单 3–15.** 在 Java 代码中使用字符串资源\n\n```\n//Read a\
  \ simple string and set it in a text view\nString simpleString = activity.getString(R.string.simple_string);\n\
  textView.setText(simpleString);\n\n//Read a quoted string and set it in a text view\n\
  String quotedString = activity.getString(R.string.quoted_string);\ntextView.setText(quotedString);\n\
  \n//Read a double quoted string and set it in a text view\nString doubleQuotedString\
  \ = activity.getString(R.string.double_quoted_string);\ntextView.setText(doubleQuotedString);\n\
  \n//Read a Java format string\nString javaFormatString = activity.getString(R.string.java_format_string);\n\
  //Convert the formatted string by passing in arguments\nString substitutedString\
  \ = String.format(javaFormatString, \"Hello\" , \"Android\");\n//set the output\
  \ in a text view\ntextView.setText(substitutedString);\n\n//Read an html string\
  \ from the resource and set it in a text view\nString htmlTaggedString = activity.getString(R.string.tagged_string);\n\
  //Convert it to a text span so that it can be set in a text view\n//android.text.Html\
  \ class allows painting of \"html\" strings\n//This is strictly an Android class\
  \ and does not support all html tags\nSpanned textSpan = android.text.Html.fromHtml(htmlTaggedString);\n\
  //Set it in a text view\ntextView.setText(textSpan);\n```\n\n一旦你将字符串定义为资源，就可以在 XML\
  \ 布局定义中直接为 `TextView` 等视图设置这些字符串。清单 3–16 展示了一个示例，其中将 HTML 字符串设置为 `TextView` 的文本内容。\n\
  \n**清单 3–16.** 在 XML 中使用字符串资源\n\n```\n<TextView android:layout_width=\"fill_parent\"\
  \n          android:layout_height=\"wrap_content\"\n          android:gravity=\"\
  center_horizontal\"\n          android:text=\"@string/tagged_string\"/>\n```\n\n\
  `TextView` 会自动识别此字符串为 HTML 字符串，并相应地处理其格式。这非常有用，因为你可以作为布局的一部分，快速在视图中设置具有吸引力的文本。\n\
  \n\n\n### 颜色资源\n\n与字符串资源类似，您可以使用引用标识符来间接引用颜色。这样做可以让 Android 实现颜色本地化和主题应用。在资源文件中定义并标识颜色后，您可以通过其\
  \ ID 在 Java 代码中访问它们。字符串资源 ID 位于 `<your-package>.R.string` 命名空间下，而颜色资源 ID 则位于 `<your-package>.R.color`\
  \ 命名空间下。\n\nAndroid 还在其自身的资源文件中定义了一组基础颜色。因此，这些 ID 可以通过 Android 的 `android.R.color`\
  \ 命名空间进行访问。查看以下网址，了解 `android.R.color` 命名空间中可用的颜色常量：\n\n`http://code.google.com/android/reference/android/R.color.html`\n\
  \n代码清单 3–17 提供了一些在 XML 资源文件中指定颜色的示例。\n\n**代码清单 3–17.** *定义颜色资源的 XML 语法*\n\n```\n\
  <resources>\n    <color name=\"red\">#f00</color>\n    <color name=\"blue\">#0000ff</color>\n\
  \    <color name=\"green\">#f0f0</color>\n    <color name=\"main_back_ground_color\"\
  >#ffffff00</color>\n</resources>\n```\n\n代码清单 3–17 中的条目必须放在 `/res/values` 子目录下的一个文件中。文件名称可以是任意的，这意味着您可以选择任何文件名。Android\
  \ 会读取所有文件，然后处理它们并查找如 `resources` 和 `color` 等单个节点，以确定各个 ID。\n\n代码清单 3–18 展示了在 Java\
  \ 代码中使用颜色资源的示例。\n\n**代码清单 3–18.** *Java 代码中的颜色资源*\n\n```\nint mainBackGroundColor\n\
  \     =  activity.getResources.getColor(R.color.main_back_ground_color);\n```\n\n\
  代码清单 3–19 展示了如何在视图定义中使用颜色资源。\n\n**代码清单 3–19.** *在视图定义中使用颜色*\n\n```\n<TextView android:layout_width=\"\
  fill_parent\"\n          android:layout_height=\"wrap_content\"\n          android:textColor=\"\
  @color/red\"\n          android:text=\"Sample Text to Show Red Color\"/>\n```\n\n\
  ### 尺寸资源\n\n像素、英寸和点都是可以用于 XML 布局或 Java 代码的尺寸示例。您可以使用这些尺寸资源来样式化和本地化 Android UI，而无需更改源代码。\n\
  \n代码清单 3–20 展示了如何在 XML 中使用尺寸资源。\n\n**代码清单 3–20.** *定义尺寸资源的 XML 语法*\n\n```\n<resources>\n\
  \    <dimen name=\"mysize_in_pixels\">1px</dimen>\n    <dimen name=\"mysize_in_dp\"\
  >5dp</dimen>\n    <dimen name=\"medium_size\">100sp</dimen>\n</resources>\n```\n\
  \n您可以使用以下任一单位来指定尺寸：\n\n*   `px`: 像素\n*   `in`: 英寸\n*   `mm`: 毫米\n*   `pt`: 点\n*\
  \   `dp`: 基于 160dpi（每英寸像素密度）屏幕的密度无关像素（尺寸会根据屏幕密度调整）\n*   `sp`: 缩放无关像素（允许用户调整大小的尺寸；对字体使用很有帮助）\n\
  \n在 Java 中，您需要访问 `Resources` 对象实例来获取一个尺寸。您可以通过在 `activity` 对象上调用 `getResources`\
  \ 来实现（参见代码清单 3–21）。一旦获得 `Resources` 对象，您就可以使用尺寸 ID 请求它定位该尺寸（同样参见代码清单 3–21）。\n\n\
  **代码清单 3–21.** *在 Java 代码中使用尺寸资源*\n\n```\nfloat dimen = activity.getResources().getDimension(R.dimen.mysize_in_pixels);\n\
  ```\n\n**注意：** Java 方法调用使用的是 `Dimension`（完整拼写），而 `R.java` 命名空间使用缩写版本 `dimen` 来表示\
  \ *dimension*。\n\n与 Java 中类似，在 XML 中用于尺寸的资源引用使用 `dimen`，而不是完整的单词 *dimension*（参见代码清单\
  \ 3–22）。\n\n**代码清单 3–22.** *在 XML 中使用尺寸资源*\n\n```\n<TextView android:layout_width=\"\
  fill_parent\"\n          android:layout_height=\"wrap_content\"\n          android:textSize=\"\
  @dimen/medium_size\"/>\n```\n\n### 图像资源\n\nAndroid 会为放置在 `/res/drawable` 子目录下的图像文件生成资源\
  \ ID。支持的图像类型包括 `.gif`、`.jpg` 和 `.png`。此目录中的每个图像文件都会根据其基本文件名生成唯一的 ID。例如，如果图像文件名为\
  \ `sample_image.jpg`，则生成的资源 ID 为 `R.drawable.sample_image`。\n\n**警告：** 如果两个文件的基本文件名相同，会导致错误。此外，`/res/drawable`\
  \ 下的子目录会被忽略。放置在这些子目录下的任何文件都不会被读取。\n\n您可以在其他 XML 布局定义中引用 `/res/drawable` 中可用的图像，如代码清单\
  \ 3–23 所示。\n\n**代码清单 3–23.** *在 XML 中使用图像资源*\n\n```\n<Button\n      android:id=\"\
  @+id/button1\"\n      android:layout_width=\"fill_parent\"\n      android:layout_height=\"\
  wrap_content\"\n      android:text=\"Dial\"\n      android:background=\"@drawable/sample_image\"\
  \n/>\n```\n\n您也可以通过 Java 以编程方式检索图像，并将其设置为按钮等 UI 对象的背景（参见代码清单 3–24）。\n\n**代码清单 3–24.**\
  \ *在 Java 中使用图像资源*\n\n```\n//调用 getDrawable 获取图像\nBitmapDrawable d = activity.getResources().getDrawable(R.drawable.sample_image);\n\
  \n//然后可以使用该 drawable 设置背景\nbutton.setBackgroundDrawable(d);\n\n//或者可以直接通过资源 ID 设置背景\n\
  button.setBackgroundResource(R.drawable.sample_image);\n```\n\n**注意：** 这些设置背景的方法可以一直追溯到\
  \ `View` 类。因此，大多数 UI 控件都支持设置背景。\n\nAndroid 还支持一种特殊类型的图像，称为*可拉伸图像*。这是一种 `.png` 图像，其中部分图像可以被指定为静态区域和可拉伸区域。Android\
  \ 提供了一个名为 Draw 9-patch 的工具来指定这些区域（您可以在 [`http://developer.android.com/guide/developing/tools/draw9patch.html`](http://developer.android.com/guide/developing/tools/draw9patch.html)\
  \ 阅读更多相关信息）。\n\n一旦准备好 `.png` 图像，您就可以像使用其他任何图像一样使用它。当用作按钮背景时，它会非常有用，因为按钮需要拉伸自身以适应文本。\n\
  \n\n\n### 颜色可绘制资源\n\n在 Android 中，图像是一种可绘制资源。Android 还支持另一种称为*颜色可绘制资源*的可绘制资源；它本质上是一个彩色矩形。\n\
  \n**注意：** Android 文档似乎暗示可以实现圆角，但我们未能成功创建。我们提供了另一种替代方法。文档还暗示其实例化的 Java 类是 `PaintDrawable`，但代码返回的是\
  \ `ColorDrawable`。\n\n要定义这些彩色矩形之一，你可以在 `/res/values` 子目录下的任何 XML 文件中，通过名为 `drawable`\
  \ 的节点名称定义一个 XML 元素。清单 3–25 展示了一些颜色可绘制资源的示例。\n\n**清单 3–25.** *定义颜色可绘制资源的 XML 语法*\n\
  \n```\n<resources>\n    <drawable name=\"red_rectangle\">#f00</drawable>\n    <drawable\
  \ name=\"blue_rectangle\">#0000ff</drawable>\n    <drawable name=\"green_rectangle\"\
  >#f0f0</drawable>\n</resources>\n```\n\n清单 3–26 和 3–27 分别展示了如何在 Java 和 XML 中使用颜色可绘制资源。\n\
  \n**清单 3–26.** *在 Java 代码中使用颜色可绘制资源*\n\n```\n// 获取一个可绘制对象\nColorDrawable redDrawable\
  \ = (ColorDrawable) activity.getResources().getDrawable(R.drawable.red_rectangle);\n\
  \n// 将其设置为文本视图的背景\ntextView.setBackgroundDrawable(redDrawable);\n```\n\n**清单 3–27.**\
  \ *在 XML 代码中使用颜色可绘制资源*\n\n```\n<TextView android:layout_width=\"fill_parent\"\n\
  \          android:layout_height=\"wrap_content\"\n          android:textAlign=\"\
  center\"\n          android:background=\"@drawable/red_rectangle\"/>\n```\n\n要在你的\
  \ `Drawable` 中实现圆角，你可以使用当前未记录在案的 `<shape>` 标签。但是，此标签需要单独存放在 `/res/drawable` 目录下的一个文件中。清单\
  \ 3–28 展示了如何在名为 `/res/drawable/my_rounded_rectangle.xml` 的文件中使用 `<shape>` 标签定义一个圆角矩形。\n\
  \n**清单 3–28.** *定义圆角矩形*\n\n```\n<shape >\n    <solid android:color=\"#f0600000\"\
  />\n    <stroke android:width=\"3dp\" color=\"#ffff8080\"/>\n    <corners android:radius=\"\
  13dp\" />\n    <padding android:left=\"10dp\" android:top=\"10dp\"\n        android:right=\"\
  10dp\" android:bottom=\"10dp\" />\n</shape>\n```\n\n然后，你可以像 清单 3–29 所示，将此可绘制资源用作之前文本视图示例的背景。\n\
  \n**清单 3–29.** *从 Java 代码使用可绘制对象*\n\n```\n// 获取一个可绘制对象\nGradientDrawable roundedRectangle\
  \ = (GradientDrawable) activity.getResources().getDrawable(R.drawable.my_rounded_rectangle);\n\
  \n// 将其设置为文本视图的背景\ntextView.setBackgroundDrawable(roundedRectangle);\n```\n\n**注意：**\
  \ 不**需要**将返回的基础 `Drawable` 强制转换为 `GradientDrawable`，但这样做是为了向你展示此 `<shape>` 标签会变成一个\
  \ `GradientDrawable`。此信息很重要，因为你可以查阅此类的 Java API 文档，以了解它所定义的 XML 标签。\n\n最终，`drawable`\
  \ 子目录中的位图图像会被解析为 `BitmapDrawable` 类。一个可绘制资源值，例如 清单 3–29 中的某个矩形，会被解析为 `ColorDrawable`。包含\
  \ `<shape>` 标签的 XML 文件会被解析为 `GradientDrawable`。\n\n### 使用任意的 XML 资源文件\n\n除了到目前为止描述的结构化资源之外，Android\
  \ 还允许将任意 XML 文件作为资源。这种方法将使用资源的优势扩展到了任意 XML 文件。首先，这种方法提供了一种基于生成的资源 ID 来快速引用这些文件的方式。其次，这种方法允许你对这些资源\
  \ XML 文件进行本地化。第三，你可以高效地在设备上编译和存储这些 XML 文件。\n\n需要以这种方式读取的 XML 文件存储在 `/res/xml` 子目录下。清单\
  \ 3–30 是一个名为 `/res/xml/test.xml` 的示例 XML 文件。\n\n**清单 3–30.** *示例 XML 文件*\n\n```\n\
  <rootelem1>\n   <subelem1>\n      Hello World from an xml sub element\n   </subelem1>\n\
  </rootelem1>\n```\n\n与处理其他 Android XML 资源文件一样，AAPT 在将此 XML 文件放入应用程序包之前会对其编译。如果你想解析这些文件，你需要使用\
  \ `XmlPullParser` 的一个实例。你可以使用 清单 3–31 中的代码，在任何上下文（包括 `activity`）中获取 `XmlPullParser`\
  \ 实现的实例。\n\n**清单 3–31.** *读取 XML 文件*\n\n```\nResources res = activity.getResources();\n\
  XmlResourceParser xpp = res.getXml(R.xml.test);\n```\n\n返回的 `XmlResourceParser`\
  \ 是 `XmlPullParser` 的一个实例，并且它也实现了 `java.util.AttributeSet`。清单 3–32 展示了一个更完整的代码片段，用于读取\
  \ `test.xml` 文件。\n\n**清单 3–32.** *使用 `XmlPullParser`*\n\n```\nprivate String getEventsFromAnXMLFile(Activity\
  \ activity)\nthrows XmlPullParserException, IOException\n{\n   StringBuffer sb =\
  \ new StringBuffer();\n   Resources res = activity.getResources();\n   XmlResourceParser\
  \ xpp = res.getXml(R.xml.test);\n\n   xpp.next();\n   int eventType = xpp.getEventType();\n\
  \    while (eventType != XmlPullParser.END_DOCUMENT)\n    {\n        if(eventType\
  \ == XmlPullParser.START_DOCUMENT)\n        {\n           sb.append(\"******Start\
  \ document\");\n        }\n        else if(eventType == XmlPullParser.START_TAG)\n\
  \        {\n           sb.append(\"\\nStart tag \"+xpp.getName());\n        }\n\
  \        else if(eventType == XmlPullParser.END_TAG)\n        {\n           sb.append(\"\
  \\nEnd tag \"+xpp.getName());\n        }\n        else if(eventType == XmlPullParser.TEXT)\n\
  \        {\n           sb.append(\"\\nText \"+xpp.getText());\n        }\n     \
  \   eventType = xpp.next();\n    }//eof-while\n    sb.append(\"\\n******End document\"\
  );\n    return sb.toString();\n}//eof-function\n```\n\n在 清单 3–32 中，你可以看到如何获取 `XmlPullParser`，如何使用\
  \ `XmlPullParser` 遍历 XML 文档中的 XML 元素，以及如何使用 `XmlPullParser` 的附加方法来访问 XML 元素的详细信息。如果你想运行此代码，你必须如前所示创建一个\
  \ XML 文件，并从任何菜单项或按钮点击中调用 `getEventsFromAnXMLFile` 函数。它会返回一个字符串，你可以使用 `Log.d` 调试方法将其打印到日志流中。\n\
  \n\n\n### 使用原始资源\n\nAndroid 除了允许任意 XML 文件外，也支持原始文件。这些资源放置在 `/res/raw` 目录下，是诸如音频、视频或需要本地化并通过资源\
  \ ID 引用的文本文件等原始文件。与放置在 `/res/xml` 中的 XML 文件不同，这些文件不会被编译，而是按原样移动到应用包中。不过，每个文件都会在\
  \ `R.java` 中生成一个标识符。如果你将一个文本文件放置在 `/res/raw/test.txt`，就可以使用代码清单 3–33 中的代码读取该文件。\n\
  \n**代码清单 3–33.** *读取原始资源*\n\n```\nString getStringFromRawFile(Activity activity)\n\
  \   throws IOException\n   {\n      Resources r = activity.getResources();\n   \
  \   InputStream is = r.openRawResource(R.raw.test);\n      String myText = convertStreamToString(is);\n\
  \      is.close();\n      return myText;\n   }\n\n   String convertStreamToString(InputStream\
  \ is)\n   throws IOException\n   {\n      ByteArrayOutputStream baos = new ByteArrayOutputStream();\n\
  \      int i = is.read();\n      while (i != -1)\n      {\n         baos.write(i);\n\
  \         i = is.read();\n      }\n      return baos.toString();\n   }\n```\n\n\
  **注意：** 如果文件名（不含扩展名）重复，Eclipse ADT 插件会生成编译错误。对于所有基于文件生成的资源 ID，情况都是如此。\n\n### 使用\
  \ Assets（资源文件）\n\nAndroid 提供了另一个目录，你可以在其中存放要包含在包中的文件：`/assets`。它与 `/res` 处于同一层级，意味着它不是\
  \ `/res` 的子目录。`/assets` 中的文件不会在 `R.java` 中生成 ID；你必须指定文件路径来读取它们。文件路径是从 `/assets`\
  \ 开始的相对路径。你可以使用 `AssetManager` 类来访问这些文件，如代码清单 3–34 所示。\n\n**代码清单 3–34.** *读取 Asset\
  \ 文件*\n\n```\n//注意：代码中未展示异常处理\nString getStringFromAssetFile(Activity activity)\n\
  {\n    AssetManager am = activity.getAssets();\n    InputStream is = am.open(\"\
  test.txt\");\n    String s = convertStreamToString(is);\n    is.close();\n    return\
  \ s;\n}\n```\n\n### 回顾资源目录结构\n\n总之，代码清单 3–35 快速展示了资源目录的整体结构。\n\n**代码清单 3–35.** *资源目录*\n\
  \n```\n/res/values/strings.xml\n           /colors.xml\n           /dimens.xml\n\
  \           /attrs.xml\n           /styles.xml\n    /drawable/*.png\n          \
  \   /*.jpg\n             /*.gif\n             /*.9.png\n    /anim/*.xml\n    /layout/*.xml\n\
  \    /raw/*.*\n    /xml/*.xml\n/assets/*.*/*.*\n```\n\n**注意：** 由于不在 `/res` 目录下，只有\
  \ `/assets` 目录可以包含任意深度的子目录列表。其他所有目录都只能在该目录的层级包含文件，不能更深。这就是 `R.java` 为这些文件生成标识符的方式。\n\
  \n### 资源配置变更\n\n资源有助于本地化。例如，你可以让一个字符串值根据用户的语言区域而变化。Android 资源将此概念推广到设备的任何配置，语言只是其中一种配置选项。配置变更的另一个例子是设备从垂直方向旋转到水平方向。垂直模式称为*竖屏模式*，水平模式称为*横屏模式*。\n\
  \nAndroid 允许你根据布局模式，为相同的资源 ID 选择不同的布局集。Android 通过为每种配置使用不同的目录来实现这一点。代码清单 3–36 展示了一个例子。\n\
  \n**代码清单 3–36.** *备选资源目录*\n\n```\n\\res\\layout\\main_layout.xml\n\\res\\layout-port\\\
  main_layout.xml\n\\res\\layout-land\\main_layout.xml\n```\n\n尽管这里有三个独立的布局文件，但它们都只在\
  \ `R.java` 中生成一个布局 ID。这个 ID 如下所示：\n\n`R.layout.main_layout`\n\n然而，当你检索与此布局 ID 对应的布局时，会得到适用于该设备布局的适当布局。\n\
  \n在此示例中，目录扩展名 `-port` 和 `-land` 被称为*配置限定符*。这些限定符是*不区分大小写*的，并且通过连字符（`-`）与资源目录名称分隔。你在这些配置限定符目录中指定的资源称为*备选资源*。未带配置限定符的资源目录中的资源称为*默认资源*。\n\
  \n下面列出了大部分可用的配置限定符。请注意，新的 API 可能会添加新的限定符。请参阅参考资料部分中的 URL，查看最新的资源限定符集合：\n\n*   `mccAAA`：`AAA`\
  \ 是移动国家代码。\n*   `mncAAA`：`AAA` 是运营商/网络代码。\n*   `en-rUS`：语言和区域。\n*   `sw<N>dp`、`w<N>dp`、`h<N>dp`：最小宽度、可用宽度、可用高度（自\
  \ API 13 起）。\n*   `small`、`normal`、`large`、`xlarge`：屏幕尺寸。\n*   `long`、`notlong`：屏幕类型。\n\
  *   `port`、`land`：竖屏或横屏。\n*   `car`、`desk`：底座类型。\n*   `night`、`notnight`：夜间或日间。\n\
  *   `ldpi`、`mdpi`、`hdpi`、`xhdpi`、`nodpi`、`tvdpi`：屏幕密度。\n*   `notouch`、`stylus`、`finger`：屏幕类型。\n\
  *   `keysexposed`、`keyssoft`、`keyshidden`：键盘类型。\n*   `nokeys`、`qwerty`、`12key`：按键数量。\n\
  *   `navexposed`、`navhidden`：导航键隐藏或暴露。\n*   `nonav`、`dpad`、`trackball`、`wheel`：导航设备类型。\n\
  *   `v3`、`v4`、`v7`：API 级别。\n\n使用这些限定符，你可以拥有如代码清单 3–37 所示的资源目录。\n\n**代码清单 3–37.**\
  \ *其他备选资源目录*\n\n```\n\\res\\layout-mcc312-mnc222-en-rUS\n\\res\\layout-ldpi\n\\\
  res\\layout-hdpi\n\\res\\layout-car\n```\n\n你可以通过导航到设备上的“自定义区域”应用程序来发现当前的区域设置。此应用程序的导航路径为：主页\
  \ ![图像](img/U001.jpg) 应用程序列表 ![图像](img/U001.jpg) 自定义区域。\n\n给定一个资源 ID，Android 会使用算法选择正确的资源。你可以参考“参考\
  \ URL”部分中的 URL 来了解更多关于这些规则的信息，但让我们先了解几条经验法则。\n\n首要规则是，前面列出的限定符是按优先级顺序排列的。考虑代码清单\
  \ 3–38 中的目录。\n\n**代码清单 3–38.** *布局文件变体*\n\n```\n\\res\\layout\\main_layout.xml\n\
  \\res\\layout-port\\main_layout.xml\n\\res\\layout-en\\main_layout.xml\n```\n\n\n\
  \n在 Listing 3–38 中，布局文件`main_layout.xml`有两个额外的变体：一个用于语言的变体，一个用于布局模式的变体。现在，让我们检查一下，如果你在竖屏模式下查看设备，会选取哪个布局文件。即使你处于竖屏模式，Android\
  \ 仍会从`layout-en`目录中选取布局，因为在配置限定符列表中，语言变体的优先级高于方向变体。本章“参考 URL”一节中提到的 SDK 链接列出了所有配置限定符及其优先级顺序。\n\
  \n让我们通过尝试几个字符串资源来进一步了解优先级规则。请注意，字符串资源基于单个 ID，而布局资源则是基于文件的。为了测试字符串资源的配置限定符优先级，我们设计了五个资源\
  \ ID，它们可以参与以下变体：`default`、`en`、`en_us`、`port`和`en_port`。这五个资源 ID 如下：\n\n*   `teststring_all`：此\
  \ ID 存在于`values`目录的所有变体中，包括默认变体。\n*   `testport_port`：此 ID 存在于默认变体和仅`-port`变体中。\n\
  *   `t1_enport`：此 ID 存在于默认变体以及`-en`和`-port`变体中。\n*   `t1_1_en_port`：此 ID 存在于默认变体和仅`-en-port`变体中。\n\
  *   `t2`：此 ID 仅存在于默认变体中。\n\nListing 3–39 展示了`values`目录的所有变体。\n\n**Listing 3–39.**\
  \ **基于配置的字符串变体**\n\n```\n// values/strings.xml\n<resources >\n  <string name=\"\
  teststring_all\">teststring in root</string>\n  <string name=\"testport_port\">testport-port</string>\n\
  \  <string name=\"t1_enport\">t1 in root</string>\n  <string name=\"t1_1_en_port\"\
  >t1_1 in root</string>\n  <string name=\"t2\">t2 in root</string>\n</resources>\n\
  \n// values-en/strings_en.xml\n<resources >\n  <string name=\"teststring_all\">teststring-en</string>\n\
  \  <string name=\"t1_enport\">t1_en</string>\n  <string name=\"t1_1_en_port\">t1_1_en</string>\n\
  </resources>\n\n// values-en-rUS/strings_en_us.xml\n<resources >\n  <string name=\"\
  teststring_all\">test-en-us</string>\n</resources>\n\n// values-port/strings_port.xml\n\
  <resources >\n  <string name=\"teststring_all\">test-en-us-port</string>\n  <string\
  \ name=\"testport_port\">testport-port</string>\n  <string name=\"t1_enport\">t1_port</string>\n\
  \  <string name=\"t1_1_en_port\">t1_1_port</string>\n</resources>\n\n// values-en-port/strings_en_port.xml\n\
  <resources >\n  <string name=\"teststring_all\">test-en-port</string>\n  <string\
  \ name=\"t1_1_en_port\">t1_1_en_port</string>\n</resources>\n```\n\nListing 3–40\
  \ 展示了这些内容对应的`R.java`文件。\n\n**Listing 3–40.** **支持字符串变体的`R.java`**\n\n```\npublic\
  \ static final class string {\n    public static final int teststring_all=0x7f050000;\n\
  \    public static final int testport_port=0x7f050004;\n    public static final\
  \ int t1_enport=0x7f050001;\n    public static final int t1_1_en_port=0x7f050002;\n\
  \    public static final int t2=0x7f050003;\n}\n```\n\n显而易见，尽管你定义了大量的字符串，但只生成了五个字符串资源\
  \ ID。如果你检索这些字符串值，每个字符串检索的行为如下所述（我们测试的配置是`en_US`和竖屏模式）：\n\n*   `teststring_all`：此\
  \ ID 存在于`values`目录的所有五个变体中。因为它存在于所有变体中，所以会从`values-en-rUS`目录中选取该变体。根据优先级规则，特定语言会覆盖默认变体、`en`变体、`port`变体和`en-port`变体。\n\
  *   `testport_port`：此 ID 存在于默认变体和仅`-port`变体中。因为它不存在于任何以`-en`开头的值目录中，所以`-port`变体的优先级高于默认变体，因此会从`-port`变体中选取值。如果它存在于某个`-en`变体中，则会从那里选取值。\n\
  *   `t1_enport`：此 ID 存在于三个变体中：默认变体、`-en`变体和`-port`变体。因为它同时存在于`-en`和`-port`变体中，所以会从`-en`变体中选取值。\n\
  *   `t1_1_en_port`：此 ID 存在于四个变体中：默认变体、`-port`变体、`-en`变体和`-en-port`变体。因为它可在`-en-port`变体中找到，所以会从`-en-port`变体中选取它，忽略默认变体、`-en`变体和`-port`变体。\n\
  *   `t2`：此 ID 仅存在于默认变体中，因此从默认变体中选取值。\n\nAndroid SDK 有一个更详细的算法，你可以进一步阅读。不过，本节中的示例已经向你展示了其核心思想。关键在于认识到一个变体相对于另一个变体的优先级。下面的参考章节提供了此\
  \ SDK 链接的 URL，还提供了用于下载本章可导入项目的 URL；你可以使用此项目来试验这些配置变体。\n\n### 参考 URL\n\n在学习 Android\
