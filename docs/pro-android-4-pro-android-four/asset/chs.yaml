  \ dismiss();\n            return;\n        }\n        if (v.getId() == R.id.btn_dismiss)\n\
  \        {\n            act.onDialogDone(this.getTag(), true, null);\n         \
  \   dismiss();\n            return;\n        }\n        if (v.getId() == R.id.btn_help)\n\
  \        {\n            FragmentTransaction ft =\n                getFragmentManager().beginTransaction();\n\
  \            ft.remove(this);\n\n            // 在这种情况下，你想要显示帮助文本，但\n           \
