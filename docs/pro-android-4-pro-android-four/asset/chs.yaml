  \ throw new SQLException(\n           \"Failed to insert row because Book Name is\
  \ needed \" + uri);\n    }\n\n    if (values.containsKey(BookTableMetaData.BOOK_ISBN)\
  \ == false) {\n        values.put(BookTableMetaData.BOOK_ISBN, \"Unknown ISBN\"\
  );\n    }\n    if (values.containsKey(BookTableMetaData.BOOK_AUTHOR) == false) {\n\
  \        values.put(BookTableMetaData.BOOK_AUTHOR, \"Unknown Author\");\n    }\n\
  \n    SQLiteDatabase db = mOpenHelper.getWritableDatabase();\n    long rowId = db.insert(BookTableMetaData.TABLE_NAME,\n\
  \            BookTableMetaData.BOOK_NAME, values);\n    if (rowId > 0) {\n     \
  \   Uri insertedBookUri =\n            ContentUris.withAppendedId(\n           \
  \         BookTableMetaData.CONTENT_URI, rowId);\n        getContext()\n       \
  \    .getContentResolver()\n                .notifyChange(insertedBookUri, null);\n\
  \n        return insertedBookUri;\n    }\n\n    throw new SQLException(\"Failed\
  \ to insert row into \" + uri);\n}\n\n@Override\npublic int delete(Uri uri, String\
  \ where, String[] whereArgs)\n{\n    SQLiteDatabase db = mOpenHelper.getWritableDatabase();\n\
  \    int count;\n    switch (sUriMatcher.match(uri)) {\n    case INCOMING_BOOK_COLLECTION_URI_INDICATOR:\n\
  \        count = db.delete(BookTableMetaData.TABLE_NAME,\n                where,\
  \ whereArgs);\n        break;\n\n    case INCOMING_SINGLE_BOOK_URI_INDICATOR:\n\
  \        String rowId = uri.getPathSegments().get(1);\n        count = db.delete(BookTableMetaData.TABLE_NAME,\n\
  \                BookTableMetaData._ID + \"=\" + rowId\n                + (!TextUtils.isEmpty(where)\
  \ ? \" AND (\" + where + ')' : \"\"),\n                whereArgs);\n        break;\n\
  \n    default:\n        throw new IllegalArgumentException(\"Unknown URI \" + uri);\n\
  \    }\n\n    getContext().getContentResolver().notifyChange(uri, null);\n    return\
  \ count;\n}\n\n@Override\npublic int update(Uri uri, ContentValues values,\n   \
  \     String where, String[] whereArgs)\n{\n    SQLiteDatabase db = mOpenHelper.getWritableDatabase();\n\
  \    int count;\n    switch (sUriMatcher.match(uri)) {\n    case INCOMING_BOOK_COLLECTION_URI_INDICATOR:\n\
  \        count = db.update(BookTableMetaData.TABLE_NAME,\n                values,\
  \ where, whereArgs);\n        break;\n\n    case INCOMING_SINGLE_BOOK_URI_INDICATOR:\n\
  \        String rowId = uri.getPathSegments().get(1);\n        count = db.update(BookTableMetaData.TABLE_NAME,\n\
  \                values, BookTableMetaData._ID + \"=\" + rowId\n               \
  \ + (!TextUtils.isEmpty(where) ? \" AND (\" + where + ')' : \"\"),\n           \
  \     whereArgs);\n        break;\n\n    default:\n        throw new IllegalArgumentException(\"\
  Unknown URI \" + uri);\n    }\n\n    getContext().getContentResolver().notifyChange(uri,\
  \ null);\n    return count;\n}\n```\n\n### 履行 MIME 类型契约\n\n`BookProvider` 内容提供程序还必须实现\
  \ `getType()` 方法，以便为给定的 URI 返回 MIME 类型。与内容提供程序的许多其他方法一样，此方法会根据传入的 URI 进行重载。因此，`getType()`\
  \ 方法的首要任务是区分 URI 的类型：它是一个书籍集合还是单本书？\n\n正如我们在上一节中指出的，我们将使用 `UriMatcher` 来解析此 URI\
  \ 类型。根据此 URI，`BookTableMetaData` 类已定义了要为每个 URI 返回的 MIME 类型常量。你可以在清单 4–6 中查看此方法的实现。\n\
  \n### 实现查询方法\n\n内容提供程序中的 `query` 方法负责根据传入的 URI 和 `where` 子句返回一个行集合。\n\n与其他方法一样，`query`\
  \ 方法使用 `UriMatcher` 来识别 URI 类型。如果 URI 类型是单项类型，则该方法像这样从传入的 URI 中检索书籍 ID：\n\n1.  它使用\
  \ `getPathSegments()` 提取路径段。\n2.  它索引到 URI 中以获取第一个路径段，该路径段恰好是书籍 ID。\n\n然后，`query`\
  \ 方法使用我们在清单 4–6 中预先创建的 `projection`s 来标识返回列。最后，`query` 将游标返回给调用者。在整个过程中，`query`\
  \ 方法使用 `SQLiteQueryBuilder` 对象来制定和执行查询（参见清单 4–6）。\n\n### 实现插入方法\n\n内容提供程序中的 `insert`\
  \ 方法负责将记录插入到底层数据库中，然后返回一个指向新创建记录的 URI。\n\n与其他方法一样，`insert` 使用 `UriMatcher` 来识别 URI\
  \ 类型。代码首先检查 URI 是否指示了正确的集合类型 URI。如果不是，代码会抛出一个异常（参见清单 4–6）。\n\n然后，代码验证可选和必填的列参数。对于某些缺失的列，代码可以替换为默认值。\n\
  \n接下来，代码使用 `SQLiteDatabase` 对象插入新记录并返回新插入的 ID。最后，代码使用从数据库返回的 ID 构造新的 URI。\n\n\n\n\
  #### 实现更新方法\n\n内容提供程序中的 `update` 方法负责根据传入的列值以及 `where` 子句来更新一条或多条记录。`update` 方法随后会返回过程中更新的行数。\n\
  \n与其他方法类似，`update` 使用 `UriMatcher` 来识别 URI 类型。如果 URI 类型是集合，则直接传递 `where` 子句以影响尽可能多的记录。如果\
  \ URI 类型是单条记录类型，则从 URI 中提取图书 ID，并将其作为额外的 `where` 子句指定。最后，代码返回更新的记录数（参见清单 4-6）。另请注意，`notifyChange`\
  \ 方法如何让你能够向外界宣告该 URI 处的数据已发生变化。在 `insert` 方法中，当插入一条记录时，你也可以通过声明“`…/books`”已更改来实现同样的效果。\n\
  \n#### 实现删除方法\n\n内容提供程序中的 `delete` 方法负责根据传入的 `where` 子句来删除一条或多条记录。`delete` 方法随后会返回过程中删除的行数。\n\
  \n与其他方法类似，`delete` 使用 `UriMatcher` 来识别 URI 类型。如果 URI 类型是集合类型，则直接传递 `where` 子句以便删除尽可能多的记录。如果\
  \ `where` 子句为 `null`，则会删除所有记录。如果 URI 类型是单条记录类型，则从 URI 中提取图书 ID，并将其作为额外的 `where`\
  \ 子句指定。最后，代码返回删除的记录数（参见清单 4-6）。\n\n#### 使用 UriMatcher 识别 URI\n\n我们已经多次提到 `UriMatcher`\
  \ 类；现在来深入了解一下。内容提供程序中的几乎所有方法都针对 URI 进行了重载。例如，无论你是要检索单本书还是一个图书列表，都会调用相同的 `query()`\
  \ 方法。具体由该方法来判断请求的是哪种 URI 类型。Android 的 `UriMatcher` 工具类能帮助你识别 URI 类型。\n\n其工作原理如下：你告诉一个\
  \ `UriMatcher` 实例预期要匹配哪些 URI 模式，并为每个模式关联一个唯一编号。一旦这些模式注册完毕，你就可以询问 `UriMatcher`，传入的\
  \ URI 是否匹配某个特定模式。\n\n如前所述，我们的 `BookProvider` 内容提供程序有两个 URI 模式：一个用于图书集合，另一个用于单本书。清单\
  \ 4-7 中的代码使用 `UriMatcher` 注册了这两种模式。它将 `1` 分配给图书集合，将 `2` 分配给单本书（URI 模式本身在 `books`\
  \ 表的元数据中定义）。\n\n**清单 4-7.** *使用 `UriMatcher` 注册 URI 模式*\n\n```\nprivate static final\
  \ UriMatcher sUriMatcher;\n//为每种 URI 类型定义 ID\nprivate static final int INCOMING_BOOK_COLLECTION_URI_INDICATOR\
  \ = 1;\nprivate static final int INCOMING_SINGLE_BOOK_URI_INDICATOR = 2;\n\nstatic\
  \ {\n    sUriMatcher = new UriMatcher(UriMatcher.NO_MATCH);\n    //为图书注册模式\n   \
  \ sUriMatcher.addURI(BookProviderMetaData.AUTHORITY\n                         ,\
  \ \"books\"\n                         , INCOMING_BOOK_COLLECTION_URI_INDICATOR);\n\
  \    //为单本书注册模式\n    sUriMatcher.addURI(BookProviderMetaData.AUTHORITY\n       \
  \                     , \"books/#\",\n                            INCOMING_SINGLE_BOOK_URI_INDICATOR);\n\
  }\n```\n\n注册完成后，你就可以看到 `UriMatcher` 在查询方法实现中的作用：\n\n```\nswitch (sUriMatcher.match(uri))\
  \ {\n   case INCOMING_BOOK_COLLECTION_URI_INDICATOR:\n   ......\n   case INCOMING_SINGLE_BOOK_URI_INDICATOR:\n\
  \   ......\n   default:\n      throw new IllegalArgumentException(\"Unknown URI\
  \ \" + uri);\n}\n```\n\n请注意，`match` 方法返回的是之前注册的相同编号。`UriMatcher` 的构造函数接受一个整数，用于表示根\
  \ URI。如果 URL 上既没有路径段也没有权限标识，`UriMatcher` 会返回这个数字。当模式不匹配时，`UriMatcher` 也会返回 `NO_MATCH`。你可以构造一个不带根匹配码的\
  \ `UriMatcher`；在这种情况下，Android 会在内部将 `UriMatcher` 初始化为 `NO_MATCH`。因此，清单 4-7 中的代码也可以写成如下形式：\n\
  \n```\nstatic {\n        sUriMatcher = new UriMatcher();\n        sUriMatcher.addURI(BookProviderMetaData.AUTHORITY\n\
  \                                 , \"books\"\n                                \
  \ , INCOMING_BOOK_COLLECTION_URI_INDICATOR);\n\n        sUriMatcher.addURI(BookProviderMetaData.AUTHORITY\n\
  \                                , \"books/#\",\n                              \
  \  INCOMING_SINGLE_BOOK_URI_INDICATOR);\n}\n```\n\n#### 使用投影映射\n\n内容提供程序充当抽象列集与数据库中真实列集之间的中介，然而这些列集可能不同。在构建查询时，你必须在客户端指定的\
  \ `where` 子句列与真实的数据库列之间建立映射。你可以借助 `SQLiteQueryBuilder` 类来设置这个*投影映射*。\n\n以下是 Android\
  \ SDK 文档关于 `QueryBuilder` 类中 `public void setProjectionMap(Map columnMap)` 映射方法的描述：\n\
  \n> 设置查询的投影映射。投影映射将调用者传入查询的列名映射到数据库列名。这对于重命名列以及在进行连接操作时消除列名歧义非常有用。例如，你可以将“name”映射为“people.name”。如果设置了投影映射，它必须包含用户可能请求的所有列名，即使键和值相同。\n\
  \n以下是我们的 `BookProvider` 内容提供程序设置投影映射的方式：\n\n```\nsBooksProjectionMap = new HashMap<String,\
  \ String>();\nsBooksProjectionMap.put(BookTableMetaData._ID, BookTableMetaData._ID);\n\
  \n//名称，ISBN，作者\nsBooksProjectionMap.put(BookTableMetaData.BOOK_NAME\n          \
  \                                     , BookTableMetaData.BOOK_NAME);\nsBooksProjectionMap.put(BookTableMetaData.BOOK_ISBN\n\
  \                                              , BookTableMetaData.BOOK_ISBN);\n\
  sBooksProjectionMap.put(BookTableMetaData.BOOK_AUTHOR\n                        \
  \                      , BookTableMetaData.BOOK_AUTHOR);\n\n//创建日期，修改日期\nsBooksProjectionMap.put(BookTableMetaData.CREATED_DATE\n\
  \                                               , BookTableMetaData.CREATED_DATE);\n\
  sBooksProjectionMap.put(BookTableMetaData.MODIFIED_DATE\n                      \
  \                          , BookTableMetaData.MODIFIED_DATE);\n```\n\n然后，查询构建器像这样使用变量\
  \ `sBooksProjectionMap`：\n\n```\nqueryBuilder.setTables(BookTableMetaData.TABLE_NAME);\n\
  queryBuilder.setProjectionMap(sBooksProjectionMap);\n```\n\n#### 注册提供程序\n\n最后，你必须使用\
  \ 清单 4-8 中的标签结构，在 `AndroidManifest.xml` 文件中注册内容提供程序。\n\n**清单 4-8.** *注册提供程序*\n\n\
  ```\n<provider android:name=\".BookProvider\"\n   android:authorities=\"com.androidbook.provider.BookProvider\"\
  />\n```\n\n\n\n### 使用图书提供程序\n\n现在我们已经有了一个图书提供程序，接下来将向您展示调用该提供程序的示例代码。示例代码包括添加图书、删除图书、获取图书数量，以及最终显示所有图书。\n\
  \n请注意，这些都是示例项目中的代码片段，由于需要额外的依赖文件，因此无法直接编译。但我们认为，这些示例代码对于演示我们所探讨的概念非常有价值。\n\n在本章末尾，我们提供了可下载示例项目的链接，您可以在自己的\
  \ Eclipse 环境中使用它进行编译和测试。\n\n#### 添加图书\n\n清单 4–9 中的代码向图书数据库中插入一本新书。\n\n**清单 4–9.**\
  \ *使用提供程序进行插入操作*\n\n```java\npublic void addBook(Context context)\n{\n    String\
  \ tag = \"Exercise BookProvider\";\n    Log.d(tag,\"Adding a book\");\n    ContentValues\
  \ cv = new ContentValues();\n    cv.put(BookProviderMetaData.BookTableMetaData.BOOK_NAME,\
  \ \"book1\");\n    cv.put(BookProviderMetaData.BookTableMetaData.BOOK_ISBN, \"isbn-1\"\
  );\n    cv.put(BookProviderMetaData.BookTableMetaData.BOOK_AUTHOR, \"author-1\"\
  );\n\n    ContentResolver cr = context.getContentResolver();\n    Uri uri = BookProviderMetaData.BookTableMetaData.CONTENT_URI;\n\
  \    Log.d(tag,\"book insert uri:\" + uri);\n    Uri insertedUri = cr.insert(uri,\
  \ cv);\n    Log.d(tag,\"inserted uri:\" + insertedUri);\n}\n```\n\n#### 删除图书\n\n\
  清单 4–10 中的代码从图书数据库中删除最后一条记录。有关 清单 4–10 中 `getCount()` 方法的工作原理，请参见 清单 4–11 的示例。\n\
  \n**清单 4–10.** *使用提供程序进行删除操作*\n\n```java\npublic void removeBook(Context context)\n\
  {\n    String tag = \"Exercise BookProvider\";\n    int i = getCount(context); //参见清单\
  \ 4-11 中的 getCount 函数\n    ContentResolver cr = context.getContentResolver();\n\
  \    Uri uri = BookProviderMetaData.BookTableMetaData.CONTENT_URI;\n    Uri delUri\
  \ = Uri.withAppendedPath(uri, Integer.toString(i));\n    Log.d(tag, \"Del Uri:\"\
  \ + delUri);\n    cr.delete(delUri, null, null);\n    Log.d(tag, \"New count:\"\
  \ + getCount(context));\n}\n```\n\n请注意，这只是演示如何使用 URI 进行删除操作的简单示例。获取最后一个 URI 的算法并非在所有情况下都有效。不过，如果您添加了五条记录并逐个从末尾删除，它应该可以正常工作。在实际应用中，您可能希望将记录显示在列表中，并让用户选择要删除的记录，这样您就能知道该记录的准确\
  \ URI。\n\n#### 获取图书数量\n\n清单 4–11 中的代码获取数据库游标，并统计游标中的记录数量。\n\n**清单 4–11.** *统计表中的记录数*\n\
  \n```java\nprivate int getCount(Context context)\n{\n    Uri uri = BookProviderMetaData.BookTableMetaData.CONTENT_URI;\n\
  \    Activity a = (Activity)context;\n    Cursor c = a.managedQuery(uri,\n     \
  \       null, //投影\n            null, //选择字符串\n            null, //选择参数字符串数组\n \
  \           null); //排序顺序\n    int numberOfRecords = c.getCount();\n    c.close();\n\
  \    return numberOfRecords;\n}\n```\n\n#### 显示图书列表\n\n清单 4–12 中的代码检索图书数据库中的所有记录。\n\
  \n**清单 4–12.** *显示图书列表*\n\n```java\npublic void showBooks(Context context)\n{\n\
  \    String tag = \"Exercise BookProvider\";\n    Uri uri = BookProviderMetaData.BookTableMetaData.CONTENT_URI;\n\
  \    Activity a = (Activity)context;\n    Cursor c = a.managedQuery(uri,\n     \
  \       null, //投影\n            null, //选择字符串\n            null, //选择参数字符串数组\n \
  \           null); //排序顺序\n\n    int iname = c.getColumnIndex(\n        BookProviderMetaData.BookTableMetaData.BOOK_NAME);\n\
  \n    int iisbn = c.getColumnIndex(\n        BookProviderMetaData.BookTableMetaData.BOOK_ISBN);\n\
  \    int iauthor = c.getColumnIndex(\n         BookProviderMetaData.BookTableMetaData.BOOK_AUTHOR);\n\
  \n    //报告索引\n    Log.d(tag,\"name,isbn,author:\" + iname + iisbn + iauthor);\n\n\
  \    //基于索引遍历行\n    for(c.moveToFirst();!c.isAfterLast();c.moveToNext())\n    {\n\
  \        //获取值\n        String id = c.getString(1);\n        String name = c.getString(iname);\n\
  \        String isbn = c.getString(iisbn);\n        String author = c.getString(iauthor);\n\
  \n        //报告或记录行\n        StringBuffer cbuf = new StringBuffer(id);\n        cbuf.append(\"\
  ,\").append(name);\n        cbuf.append(\",\").append(isbn);\n        cbuf.append(\"\
  ,\").append(author);\n        Log.d(tag, cbuf.toString());\n    }\n\n    //报告已读取的行数\n\
  \    int numberOfRecords = c.getCount();\n    Log.d(tag,\"Num of Records:\" + numberOfRecords);\n\
  \n    //关闭游标\n    //理想情况下，这应该在\n    //finally 块中完成。\n    c.close();\n}\n```\n\n\
