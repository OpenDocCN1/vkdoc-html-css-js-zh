  在图 10–3 中，你可以在 Activity 标题旁边看到未展开的列表。这与 SDK 在操作栏模式为标签导航时放置标签的位置相同。如果你点击 One 项，列表会展开并允许你选择一个选项，如图\
  \ 10–4 所示。\n\n![Image](img/9781430239307_Fig10-04.jpg)\n\n**图 10–4.** *带有打开导航列表的\
  \ Activity*\n\n将此 Activity 与图 10–1 和图 10–2 中的 Activity 进行比较，它们看起来非常相似，只是前者有标签，后者有列表用于导航。这两个\
  \ Activity 的设计主题说明了与网页设计方式的重要相似之处。\n\n![Image](img/square.jpg) **注意：** 在网站中，可能有许多网页，但每个页面通过母版页显示统一的外观和感觉。在这个更简单的例子中，你使用基类来实现这种效果。\n\
  \n尽管你使用了多个 Activity 来展示操作栏，但操作栏似乎更适用于在单个 Activity 上协调片段。但是，如果你需要处理多个 Activity，你可以使用此基类模式来提供那种母版页设计模式。\n\
  \n此列表导航 Activity 的行为与上一节中标签 Activity 的行为非常相似。区别在于点击列表项时会发生什么。每次你选择一个列表项时，你都会看到对列表监听器的回调，并且列表监听器会向调试文本视图发送一条消息。\n\
  \n现在，你已经有了两个可用的 Activity，菜单项允许你在标签 Activity 和列表 Activity 之间切换。\n\n接下来，让我们进入更简单的标准操作栏\
  \ Activity。\n\n### 标准导航操作栏 Activity\n\n在本节中，你将研究标准导航操作栏的性质。你设置一个 Activity，并将其操作栏导航模式设置为标准。然后，你将看到标准导航的外观并检查其行为。\n\
  \n与 `ListNavigationActionBarActivity` 的情况一样，由于你的基类承担了大部分工作，因此实现和测试标准操作栏导航 Activity\
  \ 很容易。你需要以下额外文件：\n\n*   `StandardNavigationActionBarActivity.java`：这是将操作栏配置为标准导航模式操作栏的实现文件（代码清单\
  \ 10–17）。\n\n你还需要更新以下两个文件：\n\n*   `BaseActionBarActivity.java`：取消对响应菜单项而调用标准操作栏\
  \ Activity 的注释（有关更改，请参见代码清单 10–18，原始文件请参见代码清单 10–3）。\n*   `AndroidManifest.xml`：在清单文件中定义此新\
  \ Activity（有关此 Activity 的定义，请参见代码清单 10–19，以便你可以将其添加到代码清单 10–11 的主 Android 清单文件中）。\n\
  \n#### 设置标准导航操作栏 Activity\n\n你在设置标签操作栏时使用了标签监听器，在设置列表导航操作栏时使用了列表监听器。对于标准操作栏，除了菜单回调之外，没有其他监听器。菜单回调不需要特别设置，因为它们由\
  \ SDK 自动连接。因此，以标准导航模式设置操作栏非常容易。\n\n代码清单 10–17 展示了标准导航操作栏 Activity 的源代码。\n\n**代码清单\
  \ 10–17.** *标准导航操作栏 Activity*\n```java\n//StandardNavigationActionBarActivity.java\n\
  package com.androidbook.actionbar;\n//\n//使用 CTRL-SHIFT-O 导入依赖项\n//\npublic class\
  \ StandardNavigationActionBarActivity\n    extends BaseActionBarActivity\n{\n  \
  \  private static String tag=\n      \"标准导航操作栏 Activity\";\n    public StandardNavigationActionBarActivity()\n\
  \    {\n        super(tag);\n    }\n    @Override\n    public void onCreate(Bundle\
  \ savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n    \
  \    workwithStandardActionBar();\n    }\n\n    public void workwithStandardActionBar()\n\
  \    {\n        ActionBar bar = this.getActionBar();\n        bar.setTitle(tag);\n\
  \        bar.setNavigationMode(ActionBar.NAVIGATION_MODE_STANDARD);\n        //测试如果在标准模式下添加标签会发生什么\n\
  \        attachTabs(bar);\n    }\n    public void attachTabs(ActionBar bar)\n  \
  \  {\n        TabListener tl = new TabListener(this,this);\n\n        Tab tab1 =\
  \ bar.newTab();\n        tab1.setText(\"Tab1\");\n        tab1.setTabListener(tl);\n\
  \        bar.addTab(tab1);\n\n        Tab tab2 = bar.newTab();\n        tab2.setText(\"\
  Tab2\");\n        tab2.setTabListener(tl);\n        bar.addTab(tab2);\n    }\n}//eof-class\n\
  ```\n\n将操作栏设置为标准导航操作栏唯一需要做的就是将其导航模式设置为标准。该部分代码在代码清单 10–17 中突出显示。\n\n![Image](img/square.jpg)\
  \ **注意：** 代码清单 10–17 还包含一些代码，用于查看在标准导航模式下添加标签会发生什么。测试表明，这些标签不会导致任何运行时错误，但会被框架忽略。\n\
  \n在你看到标准操作栏的样子之前，你需要对现有文件进行一些更改。\n\n#### 对 `BaseActionBarActivity` 进行更改\n\n一旦标准导航操作栏\
  \ Activity（代码清单 10–17）可用，你就可以返回并更改 `BaseActionBarActivity`（代码清单 10–3），以便用于 `StandardNavigationActionBarActivity`\
  \ 的菜单项可以调用此 Activity。取消注释后，代码清单 10–3 中的相应函数看起来像代码清单 10–18 中的代码。\n\n**代码清单 10–18.**\
  \ *取消注释以调用标准导航操作栏 Activity 的部分*\n```java\nprivate void invokeStandardNav(){\n  \
  \  Intent i = new Intent(this,\n      StandardNavigationActionBarActivity.class);\n\
  \    startActivity(i);\n}\n```\n\n取消注释后，菜单项和代码已连接好，可以调用 `StandardNavigationActionBarActivity`。\n\
  \n#### 对 `AndroidManifest.xml` 进行更改\n\n在调用此 Activity 之前，你需要在 Android 清单文件中注册此 Activity。将代码清单\
  \ 10–19 中的行添加到代码清单 10–11 的 Android 清单文件中，以完成 Activity 的注册。\n\n**代码清单 10–19.** *注册标准导航操作栏\
  \ Activity*\n```xml\n<activity android:name=\".StandardNavigationActionBarActivity\
  \ \"\n        android:label=\"操作栏演示：标准导航\">\n</activity>\n```\n\n#### 检查标准操作栏 Activity\n\
  \n当你编译到目前为止所涉及的文件（并在“标准导航操作栏 Activity”一节中列出）并运行应用程序时，应用程序会以标签 Activity 作为第一个 Activity\
  \ 打开（图 10–1）。如果你点击菜单项，你会看到图 10–2 中的 Activity。如果你选择菜单项“调用标准导航”，你现在会看到如图 10–5 所示的标准导航操作栏\
  \ Activity。\n\n![Image](img/9781430239307_Fig10-05.jpg)\n\n**图 10–5.** *带有标准导航操作栏的\
