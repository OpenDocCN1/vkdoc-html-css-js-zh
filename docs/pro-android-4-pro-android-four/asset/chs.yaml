  \ `EditText`；以及三个按钮，分别用于保存输入、取消（关闭）对话框片段以及弹出帮助对话框。\n\n`PromptDialogFragment` 的 Java\
  \ 代码开始时看起来与你之前的片段类似。你有一个用于创建新对象的 `newInstance()` 静态方法，在此方法中，你调用默认构造函数，构建一个参数 Bundle，并将其附加到新对象上。接下来，在\
  \ `onAttach()` 回调中有一些新内容。你需要确保刚刚附加的 Activity 已经实现了 `OnDialogDoneListener` 接口。为了测试这一点，你将传入的\
  \ Activity 强制转换为 `OnDialogDoneListener` 接口。以下是那段代码：\n\n```\ntry {\n    OnDialogDoneListener\
  \ test = (OnDialogDoneListener)act;\n}\ncatch(ClassCastException cce) {\n    //\
  \ 在这里我们优雅地处理失败情况。\n    Log.e(MainActivity.LOGTAG, \"Activity 未监听\");\n}\n```\n\n\
  如果 Activity 没有实现此接口，则会抛出 `ClassCastException` 异常。你可以处理这个异常并更优雅地应对，但这个示例尽可能保持代码简洁。\n\
  \n接下来是 `onCreate()` 回调。与片段的常见做法一致，你并不在此处构建用户界面，但可以设置对话框样式。这是对话框片段独有的特点。你可以自行设置样式和主题，也可以仅设置样式并将主题值设为零（`0`），让系统为你选择合适的主题。以下是该段代码：\n\
  \n```\nint style = DialogFragment.STYLE_NORMAL, theme = 0;\nsetStyle(style,theme);\n\
  ```\n\n\n\n在`onCreateView()`中，你需要为对话框片段创建视图层次结构。与其他片段一样，不要将视图层次结构附加到传入的视图容器中（即，将`attachToRoot`参数设置为`false`）。然后，设置按钮回调，并将对话框提示文本设置为最初传递给`newInstance()`的提示。最后，检查是否有任何值通过保存的状态包（`icicle`）传入。这将表明你的片段正在被重新创建，很可能是由于配置变更导致的，并且用户可能已经输入了一些文本。如果是这样，你需要用用户已输入的内容填充`EditText`。请记住，由于配置已更改，内存中的实际视图对象与之前不同，因此你必须找到它并相应地设置文本。接下来的回调是`onSaveInstanceState()`；在这里，你将用户输入的任何当前文本保存到保存的状态包中。\n\
  \n`onCancel()`和`onDismiss()`回调未显示，因为它们只进行日志记录；你将能够在片段生命周期中看到这些回调何时触发。\n\n提示对话框片段中的最后一个回调是针对按钮的。再次，你获取对封闭活动的引用，并将其转换为你期望活动已实现的接口。如果用户按下了“保存”按钮，你获取输入的文本并调用接口的回调`onDialogDone()`。此回调接受该片段的标签名、一个表示此对话框片段是否被取消的布尔值以及一个消息（在本例中为用户输入的文本）。以下是来自`MainActivity`末尾列表\
  \ 9-6 的代码：\n\n```\npublic void onDialogDone(String tag, boolean cancelled,\n   \
  \                      CharSequence message) {\n    String s = tag + \" responds\
  \ with: \" + message;\n    if(cancelled)\n        s = tag + \" was cancelled by\
  \ the user\";\n    Toast.makeText(this, s, Toast.LENGTH_LONG).show();\n    Log.v(LOGTAG,\
  \ s);\n}\n```\n\n然后你调用`dismiss()`来移除对话框片段。请记住，`dismiss()`不仅会使片段在视觉上消失，还会将片段从片段管理器中弹出，使其不再可用。如果按下的按钮是“关闭”，你再次调用接口回调，这次不带消息，然后调用`dismiss()`。最后，如果用户按下了“帮助”按钮，你不想丢失提示对话框片段，因此你采取了一些不同的操作。我们之前已经描述过。为了记住提示对话框片段以便稍后返回，你需要创建一个片段事务，使用`show()`方法移除提示对话框片段并添加帮助对话框片段；这需要放入返回栈中。还要注意，帮助对话框片段是如何通过资源\
  \ ID 的引用创建的。这意味着你的帮助对话框片段可以与应用程序可用的任何帮助文本一起使用。\n\n### 对话框示例：`HelpDialogFragment`\n\
  \n我们将很快展示帮助对话框片段的代码，但现在先描述其操作。你创建了一个片段事务，从提示对话框片段导航到帮助对话框片段，并将该片段事务放入返回栈。这使得提示对话框片段从视图中消失，但仍可通过片段管理器和返回栈访问。新的帮助对话框片段出现在其位置，允许用户阅读帮助文本。当用户关闭帮助对话框片段时，片段返回栈条目被弹出，效果是帮助对话框片段被关闭（同时在视觉上和从片段管理器中），并且提示对话框片段恢复到视图中。这是实现所有这些效果的一种相当简单的方法。它非常简单但非常强大；即使在这些对话框显示时用户旋转设备，它也能正常工作。\n\
  \n下载并查看`HelpDialogFragment.java`文件及其布局（`help_dialog.xml`）的源代码。此对话框片段的目的是显示帮助文本。布局包含一个`TextView`和一个关闭按钮。Java\
  \ 代码应该开始让你感到熟悉。有一个`newInstance()`方法来创建一个新的帮助对话框片段，一个`onCreate()`方法来设置样式和主题，以及一个`onCreateView()`方法来构建视图层次结构。在这个特定情况下，你需要找到一个字符串资源来填充`TextView`，因此你通过活动访问资源，并选择传递给`newInstance()`的资源\
  \ ID。最后，`onCreateView()`设置了一个按钮点击处理程序来捕获关闭按钮的点击。在这种情况下，在关闭时你不需要做任何有趣的事情。\n\n此片段有两种调用方式：从活动调用和从提示对话框片段调用。当此帮助对话框片段从主活动显示时，关闭它只是将片段从顶部弹出，并显示下面的主活动。当此帮助对话框片段从提示对话框片段显示时，因为帮助对话框片段是返回栈上片段事务的一部分，关闭它会导致片段事务被回滚，这会弹出帮助对话框片段但恢复提示对话框片段。用户会看到提示对话框片段重新出现。\n\
  \n\n\n### 对话框示例：AlertDialogFragment\n\n本示例应用中还有最后一个对话框片段要展示：提示对话框片段。虽然你可以用与帮助对话框片段类似的方式创建提示对话框片段，但也可以使用在多个\
  \ Android 版本中都有效的旧版 `AlertBuilder` 框架来创建。 清单 9–9 展示了提示对话框片段的源代码。\n\n**清单 9–9.**\
  \ *`AlertDialogFragment` Java 代码*\n\n```java\npublic class AlertDialogFragment\n\
  extends DialogFragment\nimplements DialogInterface.OnClickListener\n{\n    public\
  \ static AlertDialogFragment\n    newInstance(String message)\n    {\n        AlertDialogFragment\
  \ adf = new AlertDialogFragment();\n        Bundle bundle = new Bundle();\n    \
  \    bundle.putString(\"alert-message\",message);\n        adf.setArguments(bundle);\n\
  \n        return adf;\n    }\n\n    @Override\n    public void onCreate(Bundle savedInstanceState)\n\
  \    {\n        super.onCreate(savedInstanceState);\n        this.setCancelable(true);\n\
  \        int style = DialogFragment.STYLE_NORMAL, theme = 0;\n        setStyle(style,theme);\n\
  \    }\n\n    @Override\n    public Dialog onCreateDialog(Bundle savedInstanceState)\n\
  \    {\n        AlertDialog.Builder b =\n            new AlertDialog.Builder(getActivity())\n\
  \           .setTitle(\"Alert!!\")\n           .setPositiveButton(\"Ok\", this)\n\
  \           .setNegativeButton(\"Cancel\", this)\n           .setMessage(this.getArguments().getString(\"\
  alert-message\"));\n        return b.create();\n    }\n\n    public void onClick(DialogInterface\
  \ dialog, int which)\n    {\n        OnDialogDoneListener act = (OnDialogDoneListener)\
  \ getActivity();\n        boolean cancelled = false;\n        if (which == AlertDialog.BUTTON_NEGATIVE)\n\
  \        {\n            cancelled = true;\n        }\n        act.onDialogDone(getTag(),\
  \ cancelled, \"Alert dismissed\");\n    }\n}\n```\n\n此对话框无需布局，因为 `AlertBuilder`\
  \ 会为你处理。注意，该对话框片段开始时与其他片段类似，但这里没有 `onCreateView()` 回调，而是使用了 `onCreateDialog()` 回调。你需要实现\
  \ `onCreateView()` 或 `onCreateDialog()`，但不能同时实现两者。`onCreateDialog()` 的返回值不是视图，而是一个对话框。这里值得注意的是，要获取对话框的参数，你应该访问参数\
  \ Bundle。在此示例应用中，你只对提示消息进行了此操作，但你也可以通过参数 Bundle 访问其他参数。\n\n另外请注意，对于这种类型的对话框片段，你的片段类需要实现\
  \ `DialogInterface.OnClickListener`，这意味着你的对话框片段必须实现 `onClick()` 回调。当用户对嵌入的对话框进行操作时，会触发此回调。同样，你会获得触发回调的对话框引用以及被按下的按钮标识。和之前一样，你应谨慎，不要依赖\
  \ `onDismiss()`，因为设备配置发生变化时也可能会触发此回调。\n\n### 对话框示例：嵌入对话框\n\n你可能已经注意到 `DialogFragment`\
  \ 的另一个特性。在该应用的主布局中，文本下方有一个 `FrameLayout`，可用于容纳对话框。在应用的菜单中，最后一项会触发片段事务，将 `PromptDialogFragment`\
  \ 的新实例添加到主屏幕。无需任何修改，该对话框片段即可嵌入主布局显示，并如预期般工作。\n\n这种技术的一个不同之处在于，显示嵌入对话框的代码与显示弹出对话框的代码不同。嵌入对话框的代码如下所示：\n\
  \n```java\nft.add(R.id.embeddedDialog, pdf, EMBED_DIALOG_TAG);\nft.commit();\n```\n\
  \n这与第 8 章中在 `FrameLayout` 中显示片段时的代码完全相同。不过，这次需要确保传入一个标签名，当对话框片段通知活动用户的输入时，会使用该标签名。\n\
  \n### 对话框示例：观察\n\n运行此示例应用时，请务必在不同设备方向上尝试所有菜单选项。在对话框片段显示时旋转设备。你会欣喜地发现对话框会随旋转而适应；无需担心大量代码来管理因配置变化而导致的片段保存与恢复。\n\
  \n我们希望您能体会到的另一点是，在片段和活动之间进行通信是多么容易。当然，活动拥有或可以获取对所有可用片段的引用，因此它可以访问片段自身暴露的方法。这并不是片段与活动之间通信的唯一方式。你始终可以使用片段管理器上的\
  \ getter 方法来获取受管理片段的实例，然后适当地转换该引用并直接调用该片段上的方法。你甚至可以在另一个片段内部执行此操作。通过接口和活动将片段相互隔离的程度，或者通过片段间通信构建依赖关系的程度，取决于你的应用程序有多复杂以及你希望实现多大程度的复用。\n\
  \n### 使用 Toast\n\n本章开头介绍了如何在错误页面上使用提示消息进行 JavaScript 调试。如果需要使用类似的方法处理不频繁的调试消息，可以使用\
  \ Android 中的 `Toast` 对象。\n\n`Toast` 类似于一个提示对话框，它包含一条消息，显示一段时间后消失。它没有任何按钮。因此，可以说它是一种瞬时提示消息。之所以称为\
  \ `Toast`，是因为它像烤面包机里弹出来的吐司一样弹出。\n\n清单 9–10 展示了一个如何使用 `Toast` 显示消息的示例。\n\n**清单 9–10.**\
  \ *使用 `Toast` 进行调试*\n\n```java\n//Create a function to wrap a message as a toast\n\
  //show the toast\npublic void reportToast(String message)\n{\n    String s = MainActivity.LOGTAG\
  \ + \":\" + message;\n    Toast.makeText(activity, s, Toast.LENGTH_SHORT).show();\n\
  }\n```\n\n清单 9–10 中的 `makeText()` 方法不仅可以使用活动，还可以使用任何上下文对象，例如传递给广播接收器或服务的上下文。这扩展了\
  \ `Toast` 在活动之外的使用范围。\n\n### 用于旧版 Android 的对话框片段\n\n虽然希望所有旧手机都能升级到 Ice Cream Sandwich，从而能够利用对话框片段的所有优点，但现实是，一些旧型号仍会停留在\
  \ Android 1.6、2.1 和 2.2 上。为了给这些手机提供对话框片段支持，Google 提供了 Fragment 兼容性库。对于对话框片段，你仍然使用前面讨论过的\
  \ `DialogFragment` 类；只需确保在应用程序中包含兼容性 jar 文件即可。\n\n\n\n### 摘要\n\n本章讨论了异步对话框以及如何使用对话框片段，涵盖以下主题：\n\
  \n- 什么是对话框以及为何使用它\n- Android 中对话框的异步特性\n- 让对话框在屏幕上显示的三个步骤\n- 创建片段\n- 对话框片段创建视图层次结构的两种方法\n\
  - 片段事务如何参与显示对话框片段，以及如何获取一个片段事务\n- 用户在查看对话框片段时按下返回键会发生什么\n- 返回栈及管理对话框片段\n- 点击对话框片段上的按钮时会发生什么，以及如何处理\n\
  - 从对话框片段与调用活动进行通信的简洁方法\n- 一个对话框片段如何调用另一个对话框片段并仍能返回上一个对话框片段\n- `Toast` 类以及如何将其用作简单的提示弹窗\n\
  \n### 面试问题\n\n以下问题应能帮助您巩固对本章关于对话框讨论的理解：\n\n1.  您的代码能否在对话框片段显示后立即读取用户从提示对话框片段中的输入？请说明原因。\n\
  2.  您使用 `DialogFragment` 的哪个方法来构建视图层次结构？\n3.  您使用哪个方法来返回一个已准备好的对话框？\n4.  您使用对话框片段的哪个方法来显示对话框？\n\
  5.  调用此方法的两种方式是什么？哪一种最简单？\n6.  您能使用 `onDismiss()` 来判断用户是否已点击对话框片段中的按钮吗？请说明原因。\n\
  7.  一个对话框片段能否显示另一个对话框片段？如果可以，新的对话框片段能否再显示另一个对话框片段而不产生问题？\n8.  您在哪里设置对话框的样式和主题？\n\
  9.  `Toast` 消息的时间长度选项有哪些？\n10. 如何在配置变更（例如设备旋转）时，让对话框片段记住用户输入的内容？\n\n## 第 10 章\n\n\
  ## 探索操作栏\n\n`ActionBar` 是在适用于平板电脑的 Android 3.0 SDK 中引入的，现在（4.0 版本）也适用于手机。它允许您自定义活动的标题栏。在\
  \ 3.0 SDK 发布之前，活动的标题栏仅包含活动的标题。Android 的 `ActionBar` 设计类似于网页浏览器的菜单/标题栏。\n\n![Image](img/square.jpg)\
  \ **注意：** 本章同时指代 `ActionBar` 和 action bar。`ActionBar` 指实际的类，而 *action bar* 指的是概念。\n\
  \n3.0 SDK 经过了优化，但仅适用于平板电脑。这意味着，对于运行 Android 4.0 之前版本的手机，操作栏 API 并不可用。到了 4.0 SDK，手机和平板电脑的\
  \ SDK 方面已合并，以提供统一的 API。\n\n操作栏设计的一个关键目标是让用户无需在选项菜单或上下文菜单中搜寻，就能轻松访问常用操作。\n\n![Image](img/square.jpg)\
  \ **注意：** 在当前计算机技术文献中，便捷的操作访问被时髦地称为 *可发现性*，指的是方便地发现/调用操作的能力。我们在本章末尾提供了一些关于可发现性的参考网址。\n\
  \n在本章的学习过程中，您将了解关于操作栏的以下内容：\n\n- 操作栏归活动所有，并遵循其生命周期。\n- 操作栏可以采用三种形式之一：选项卡式操作栏、列表操作栏或标准操作栏。您将看到这些不同的操作栏在每种模式下的外观和行为。\n\
  - 您将学习选项卡监听器如何让您与选项卡式操作栏进行交互。\n- 您将看到如何使用微调适配器和列表监听器与列表操作栏进行交互。\n- 您将了解操作栏的“主页”图标如何与菜单基础设施进行交互。\n\
  - 您将看到图标菜单项如何显示在操作栏区域中并对其进行响应。\n- 您将了解如何在操作栏中放置自定义搜索小部件。\n\n您将通过规划三个不同的活动来探索这些概念。每个活动都拥有不同模式的操作栏。这将让您有机会检查每种模式下操作栏的行为。但首先，让我们快速浏览一下操作栏的视觉方面。\n\
  \n### 操作栏的解剖结构\n\n图 10–1 显示了一个处于选项卡导航模式的典型操作栏。\n\n![Image](img/9781430239307_Fig10-01.jpg)\n\
  \n**图 10–1.** *带有选项卡式操作栏的活动*\n\n此截图取自本章后面介绍的实际工作示例。图 10–1 中的操作栏有五个部分。这些部分如下（从左到右）：\n\
  \n- *主页图标区域：* 操作栏左上角的图标有时称为“主页”图标。这类似于网站导航上下文，点击主页图标会带您回到起始点。当您将用户导航到主活动时，不要启动一个新的主活动；相反，应使用一个意图标志来转移过去，该标志会清除主活动之上的所有活动栈。稍后您将看到，点击此“主页”图标会向选项菜单发送一个回调，其菜单\
  \ ID 为 `android.R.id.home`。\n- *标题区域：* 标题区域显示操作栏的标题。\n- *选项卡区域：* 选项卡区域是操作栏绘制指定选项卡列表的地方。此区域的内容是可变的。如果操作栏导航模式是选项卡，则此处显示选项卡。如果模式是列表导航模式，则显示一个可导航的下拉列表项。在标准模式下，此区域被忽略并保持为空。\n\
  - *操作图标区域：* 在选项卡区域之后，操作图标区域显示一些作为图标的选项菜单项。您将在稍后的示例中看到如何选择哪些选项菜单显示为操作图标。\n- *菜单图标区域：*\
  \ 最后是菜单图标区域。它是一个单一的标准菜单图标。当您点击此菜单图标时，您会看到展开的菜单。根据 Android 设备的大小，此展开菜单的外观或在屏幕上的位置会有所不同。您还可以将搜索视图附加到菜单上，就像它是一个菜单的操作图标一样。我们将在本章后面介绍这一点。\n\
  \n除了操作栏之外，图 10–1 中的活动还显示了一个用于记录大量操作的调试文本视图。这些操作可能是点击选项卡、主页图标、操作菜单或实际选项菜单的结果。\n\n\
  让我们看看如何实现前面提到的三种类型的操作栏活动：选项卡式操作栏、列表操作栏和标准操作栏。您已经看过作为操作栏视觉示例的选项卡式操作栏，那么我们将从实现选项卡式操作栏开始。\n\
  \n\n\n### 选项卡式导航操作栏活动\n\n尽管你计划创建三种不同的活动，每种都有其自己的操作栏类型，但这些示例活动具有许多共同的功能：\n\n*   所有这些活动都具有相同的调试文本视图，以便你可以在调用操作时进行监控。\n\
  *   所有这些活动都具有相同的主页图标。\n*   所有这些活动都有一个标题。\n*   所有这些活动都具有相同的操作图标。\n*   所有这些活动都具有相同的选项菜单。\n\
  \n这些活动之间的主要区别在于，每个活动对操作栏的配置方式不同。在本示例中，你将公共行为封装在一个基类中，并允许每个派生活动（包括此选项卡式操作栏活动）来配置操作栏。\n\
  \n如果没有至少一个操作栏活动的上下文，很难解释这些公共文件。因此，你首先查看这些公共文件，以及选项卡式操作栏活动如何使用它们。然后，另外两个状态栏活动可以用更少的文件添加到该项目中。\n\
  \n以下是此选项卡式操作栏练习所需的文件列表。这些文件既包括公共文件，也包括选项卡式操作栏特有的文件。列表看起来很多，是因为你将公共行为封装到了基类中。这减少了后续示例所需的文件数量。每个文件都标注了清单编号：\n\
  \n*   `DebugActivity.java`：基类活动，允许使用如图 10–1 所示的调试文本视图（清单 10–2）。\n*   `BaseActionBarActivity.java`：派生自\
  \ `DebugActivity`，允许公共导航（例如，响应包括在三个活动之间切换在内的公共操作）（清单 10–3）。\n*   `IReportBack.java`：一个接口，作为调试活动与操作栏的各种监听器之间的通信工具（清单\
  \ 10–1）。\n*   `BaseListener.java`：基类监听器，与 `DebugActivity` 以及从操作栏调用的各种操作协同工作。作为选项卡监听器和列表导航监听器的基类（清单\
  \ 10–4）。\n*   `TabNavigationActionBarActivity.java`：继承自 `BaseActionBarActivity.java`，并将操作栏配置为选项卡式操作栏。大部分与选项卡式操作栏相关的代码都在此类中（清单\
  \ 10–6）。\n*   `TabListener.java`：用于向选项卡式操作栏添加选项卡。在这里响应选项卡点击。在本例中，它只是通过 `BaseListener`\
  \ 将一条消息记录到调试视图（清单 10–5）。\n*   `AndroidManifest.xml`：定义要调用的活动（清单 10–13）。\n*   `Layout/main.xml`：`DebugActivity`\
  \ 的布局文件。由于所有三个状态栏活动都继承自此基类 `DebugActivity`，因此它们共享此布局文件（清单 10–7）。\n*   `menu/menu.xml`：一组菜单项，用于测试菜单与操作栏的交互。此菜单文件也在所有派生状态栏活动之间共享（清单\
  \ 10–9）。\n\n#### 实现基类活动\n\n许多基类都使用了 `IReportBack` 接口。该接口在清单 10–1 中介绍。\n\n**清单 10–1.**\
  \ *`IReportBack.java`*\n\n```\n//IReportBack.java\npackage com.androidbook.actionbar;\n\
  \npublic interface IReportBack\n{\n   public void reportBack(String tag, String\
  \ message);\n   public void reportTransient(String tag, String message);\n}\n```\n\
  \n实现了此接口的类会接收一条消息并将其报告到屏幕上，类似于调试消息。这是通过 `reportBack()` 方法完成的。`reportTransient()`\
  \ 方法执行相同的操作，只是它使用 `Toast` 将该消息报告给用户。\n\n在本示例中，实现 `IReportBack` 的类是 `DebugActivity`。这使得\
  \ `DebugActivity` 能够传递自身，而无需暴露其所有内部实现。`DebugActivity` 的源代码在清单 10–2 中给出。\n\n**清单\
  \ 10–2.** *带有调试文本视图的 `DebugActivity`*\n\n```\n//DebugActivity.java\npackage com.androidbook.actionbar;\n\
  //\n//使用 CTRL-SHIFT-O 导入依赖项\n//\npublic abstract class DebugActivity\nextends Activity\n\
  implements IReportBack\n{\n   //派生类需要首先定义\n   protected abstract boolean\n   onMenuItemSelected(MenuItem\
  \ item);\n\n   //由构造函数设置的私有变量\n   private static String tag=null;\n   private int\
  \ menuId = 0;\n   private int layoutid = 0;\n   private int debugTextViewId = 0;\n\
  \n   public DebugActivity(int inMenuId,\n         int inLayoutId,\n         int\
  \ inDebugTextViewId,\n         String inTag)\n   {\n      tag = inTag;\n      menuId\
  \ = inMenuId;\n      layoutid = inLayoutId;\n      debugTextViewId = inDebugTextViewId;\n\
  \n   }\n    @Override\nprotected void onCreate(Bundle savedInstanceState) {\n  \
  \      super.onCreate(savedInstanceState);\n        setContentView(this.layoutid);\n\
  \n        //你需要以下代码来使文本视图可滚动。\n        TextView tv = this.getTextView();\n     \
  \   tv.setMovementMethod(\n          ScrollingMovementMethod.getInstance());\n \
  \   }\n    @Override\npublic boolean onCreateOptionsMenu(Menu menu){\n       super.onCreateOptionsMenu(menu);\n\
  \       MenuInflater inflater = getMenuInflater();\n       inflater.inflate(menuId,\
  \ menu);\n       return true;\n    }\n    @Override\npublic boolean onOptionsItemSelected(MenuItem\
  \ item){\n       appendMenuItemText(item);\n       if (item.getItemId() == R.id.menu_da_clear){\n\
  \          this.emptyText();\n          return true;\n       }\n       boolean b\
  \ = onMenuItemSelected(item);\n       if (b == true)\n       {\n          return\
  \ true;\n       }\n       return super.onOptionsItemSelected(item);\n    }\nprotected\
  \ TextView getTextView(){\n        return\n        (TextView)this.findViewById(this.debugTextViewId);\n\
  \    }\nprotected void appendMenuItemText(MenuItem menuItem){\n       String title\
  \ = menuItem.getTitle().toString();\n       appendText(\"MenuItem:\" + title);\n\
  \    }\n    protected void emptyText(){\n       TextView tv = getTextView();\n \
  \      tv.setText(\"\");\n    }\nprotected void appendText(String s){\n       TextView\
  \ tv = getTextView();\n       tv.setText(s + \"\\n\" + tv.getText());\n       Log.d(tag,s);\n\
  \    }\npublic void reportBack(String tag, String message)\n   {\n      this.appendText(tag\
  \ + \":\" + message);\n      Log.d(tag,message);\n   }\npublic void reportTransient(String\
  \ tag, String message)\n   {\n      String s = tag + \":\" + message;\n      Toast\
  \ mToast =\n        Toast.makeText(this, s, Toast.LENGTH_SHORT);\n      mToast.show();\n\
  \      reportBack(tag,message);\n      Log.d(tag,message);\n   }\n}//eof-class\n\
  ```\n\n此基类活动的主要目标是提供一个包含调试文本视图的活动。此文本视图用于记录来自 `reportBack()` 方法的消息。你将所有操作栏活动的基类都使用此活动。\n\
  \n\n\n#### 为操作栏分配统一行为\n\n您有更多机会将派生自活动的代码重构到另一个基类 `BaseActionBarActivity` 中。\n\n\
  这个重构类的主要目的是提供对菜单项的通用行为响应。这些菜单项用于在代表三种不同操作栏模式的三个活动之间切换。切换后，您可以测试相应的操作栏活动。\n\n本活动在清单\
  \ 10-3 中呈现。\n\n**清单 10-3.** *操作栏启用活动的公共基类*\n\n```\n// BaseActionBarActivity.java\n\
  package com.androidbook.actionbar;\n//\n//使用 CTRL-SHIFT-O 导入依赖\n//\npublic abstract\
  \ class BaseActionBarActivity\nextends DebugActivity\n{\n    private String tag=null;\n\
  \    public BaseActionBarActivity(String inTag)\n    {\n        super(R.menu.menu,\
  \    // 提供通用菜单\n            R.layout.main,    // 提供通用布局\n            R.id.textViewId,\
  \  // 基础调试活动的文本视图\n            inTag);           // 用于日志记录的调试标签\n            tag\
  \ = inTag;\n    }\n    @Override\n    public void onCreate(Bundle savedInstanceState)\n\
  \    {\n        super.onCreate(savedInstanceState);\n        TextView tv = this.getTextView();\n\
  \        tv.setText(tag);\n    }\n    protected boolean onMenuItemSelected(MenuItem\
  \ item)\n    {\n// 响应主页图标\n        if (item.getItemId() == android.R.id.home) {\n\
  \            this.reportBack(tag,\"Home Pressed\");\n            return true;\n\
  \        }\n\n// 调用同级活动的通用行为\n        if (item.getItemId() == R.id.menu_invoke_tabnav){\n\
  \            if (getNavMode() ==\n              ActionBar.NAVIGATION_MODE_TABS)\n\
  \            {\n                this.reportBack(tag,\n                  \"You are\
  \ already in tab nav\");\n            }\n            else {\n                this.invokeTabNav();\n\
  \            }\n            return true;\n        }\n        if (item.getItemId()\
  \ == R.id.menu_invoke_listnav){\n            if (getNavMode() ==\n            ActionBar.NAVIGATION_MODE_LIST)\n\
  \            {\n                this.reportBack(tag,\n                \"You are\
  \ already in list nav\");\n            }\n            else{\n                this.invokeListNav();\n\
  \            }\n            return true;\n        }\n        if (item.getItemId()\
  \ == R.id.menu_invoke_standardnav){\n            if (getNavMode() ==\n         \
  \   ActionBar.NAVIGATION_MODE_STANDARD)\n            {\n                this.reportBack(tag,\n\
  \                \"You are already in standard nav\");\n            }\n        \
  \    else{\n                this.invokeStandardNav();\n            }\n         \
  \   return true;\n        }\n        return false;\n    }\nprivate int getNavMode(){\n\
  ActionBar bar = this.getActionBar();\n        return bar.getNavigationMode();\n\
  \    }\n    private void invokeTabNav(){\n        Intent i = new Intent(this,\n\
  \          TabNavigationActionBarActivity.class);\n        startActivity(i);\n \
  \   }\n\n    // 在实现以下额外活动时，解开相应方法体的注释\n\n    private void invokeListNav(){\n   \
  \     //Intent i = new Intent(this,\n        //  ListNavigationActionBarActivity.class);\n\
  \        //startActivity(i);\n    }\n    private void invokeStandardNav(){\n   \
  \     //Intent i = new Intent(this,\n        //  StandardNavigationActionBarActivity.class);\n\
  \        //startActivity(i);\n    }\n}//eof-class\n```\n\n如果您关注清单 10-3 中响应菜单项的代码，会发现您正在检查当前活动是否也是要切换到的目标活动。如果是，您会记录一条消息，并且不切换当前活动。\n\
  \n这个基础操作栏活动还简化了派生的操作栏导航活动，包括标签导航操作栏活动。\n\n#### 实现标签监听器\n\n在您能够使用标签操作栏之前，需要一个标签监听器。标签监听器允许您响应标签上的点击事件。您从基础监听器派生您的标签监听器，该基础监听器允许您记录标签操作。清单\
  \ 10-4 展示了使用 `IReportBack` 进行记录的基础监听器。\n\n**清单 10-4.** *操作栏启用活动的通用监听器*\n\n```\n\
  //BaseListener.java\npackage com.androidbook.actionbar;\n//\n//使用 CTRL-SHIFT-O 导入依赖\n\
  //\npublic class BaseListener\n{\n   protected IReportBack mReportTo;\n   protected\
  \ Context mContext;\n   public BaseListener(Context ctx, IReportBack target)\n \
  \  {\n      mReportTo = target;\n      mContext = ctx;\n   }\n}\n```\n\n这个基类持有一个对\
  \ `IReportBack` 实现的引用，以及一个可作为上下文使用的活动。在这种情况下，清单 10-2 中的 `DebugActivity` 既是 `IReportBack`\
  \ 的实现者，也承担了上下文的角色。\n\n现在您有了一个基础监听器，清单 10-5 展示了标签监听器。\n\n**清单 10-5.** *用于响应标签操作的标签监听器*\n\
  \n```\n// TabListener.java\npackage com.androidbook.actionbar;\n//\n//使用 CTRL-SHIFT-O\
  \ 导入依赖\n//\npublic class TabListener extends BaseListener\nimplements ActionBar.TabListener\n\
  {\n    private static String tag = \"tc>\";\n    public TabListener(Context ctx,\n\
  \                IReportBack target)\n    {\n        super(ctx, target);\n    }\n\
  \    public void onTabReselected(Tab tab,\n                  FragmentTransaction\
  \ ft)\n    {\n        this.mReportTo.reportBack(tag,\n          \"ontab re selected:\"\
  \ + tab.getText());\n    }\n    public void onTabSelected(Tab tab,\n           \
  \    FragmentTransaction ft)\n    {\n        this.mReportTo.reportBack(tag,\n  \
  \        \"ontab selected:\" + tab.getText());\n    }\n    public void onTabUnselected(Tab\
  \ tab,\n                 FragmentTransaction ft)\n    {\n        this.mReportTo.reportBack(tag,\n\
  \          \"ontab un selected:\" + tab.getText());\n    }\n}\n```\n\n这个标签监听器将操作栏标签的回调记录到图\
  \ 10-1 的调试文本视图中。\n\n#### 实现标签操作栏活动\n\n有了标签监听器后，您最终可以构建标签导航活动。这在清单 10-6 中呈现。\n\n\
  **清单 10-6.** *标签导航启用的操作栏活动*\n\n```\n// TabNavigationActionBarActivity.java\npackage\
  \ com.androidbook.actionbar;\n//\n//使用 CTRL-SHIFT-O 导入依赖\n//\npublic class TabNavigationActionBarActivity\n\
  extends BaseActionBarActivity\n{\n    private static String tag =\n      \"Tab Navigation\
  \ ActionBarActivity\";\n    public TabNavigationActionBarActivity()\n    {\n   \
  \     super(tag);\n    }\n    @Override\n    public void onCreate(Bundle savedInstanceState)\n\
  \    {\n        super.onCreate(savedInstanceState);\n        workwithTabbedActionBar();\n\
  \    }\n\npublic void workwithTabbedActionBar()\n    {\n        ActionBar bar =\
  \ this.getActionBar();\n        bar.setTitle(tag);\n        bar.setNavigationMode(\n\
  \          ActionBar.NAVIGATION_MODE_TABS);\n\n        TabListener tl = new TabListener(this,this);\n\
  \n        Tab tab1 = bar.newTab();\n        tab1.setText(\"Tab1\");\n        tab1.setTabListener(tl);\n\
  \        bar.addTab(tab1);\n\n        Tab tab2 = bar.newTab();\n        tab2.setText(\"\
  Tab2\");\n        tab2.setTabListener(tl);\n        bar.addTab(tab2);\n    }\n}//eof-class\n\
  ```\n\n现在，您将在以下小节中查看此活动（清单 10-6）的代码，这些小节将关注使用标签操作栏的各个方面。首先，您需要获取属于活动的操作栏的访问权限。\n\
  \n\n\n##### 获取操作栏实例\n\n在列表 10-6 中，请注意控制操作栏的代码非常简单。你可以在活动中调用`getActionbar()`方法来获取该活动的操作栏访问权限。以下是该行代码的再次呈现：\n\
  \n```\nActionBar bar = this.getActionBar();\n```\n\n如这段代码所示，操作栏是活动的一个属性，并且不能跨越活动边界。换句话说，不能使用一个操作栏来控制或影响多个活动。\n\
  \n##### 操作栏导航模式\n\n在列表 10-6 中，一旦你为某个活动获取了操作栏，就可以将其导航模式设置为`ActionBar.NAVIGATION_MODE_TABS`：\n\
  \n```\nbar.setNavigationMode(\n  ActionBar.NAVIGATION_MODE_TABS);\n```\n\n另外两种可能的操作栏导航模式是：\n\
  \n* `ActionBar.NAVIGATION_MODE_LIST`\n* `ActionBar.NAVIGATION_MODE_STANDARD`\n\n\
  一旦设置了标签导航模式，你就可以在`ActionBar`类的 API 中使用多种与标签相关的方法。列表 10-6 使用了这些与标签相关的 API 来向操作栏添加两个标签。同时，你还使用了来自列表\
  \ 10-5 的标签监听器来初始化标签。\n\n以下是列表 10-6 中展示如何向操作栏添加标签的快速代码片段：\n\n```\nTab tab1 = bar.newTab();\n\
  tab1.setText(\"Tab1\");\ntab1.setTabListener(tl);\nbar.addTab(tab1);\n```\n\n如果你忘记对添加到操作栏的标签调用`setTabListener()`方法，程序会在运行时报错，提示需要一个监听器。\n\
  \n#### 可滚动的调试文本视图布局\n\n当操作栏的标签被点击时，标签监听器被设置成将调试信息发送到调试文本视图。列表 10-7 展示了`DebugActivity`的布局文件，其中包含了调试文本视图。\n\
  \n**列表 10-7.** *调试活动文本视图布局文件*\n\n\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n`<!-- /res/layout/main.xml -->`\n```xml\n<LinearLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:orientation=\"vertical\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"fill_parent\"\
  \n    android:gravity=\"fill\"\n    >\n    <TextView android:id=\"@+id/textViewId\"\
  \n        android:layout_width=\"fill_parent\"\n        android:layout_height=\"\
  fill_parent\"\n        android:background=\"@android:color/white\"\n        android:text=\"\
  Initial Text Message\"\n        android:textColor=\"@android:color/black\"\n   \
  \     android:textSize=\"25sp\"\n        android:scrollbars=\"vertical\"\n     \
  \   android:scrollbarStyle=\"insideOverlay\"\n        android:scrollbarSize=\"25dip\"\
  \n        android:scrollbarFadeDuration=\"0\"\n        />\n</LinearLayout>\n```\n\
  \n关于此布局，有几点值得注意。你将文本视图的背景色设为白色，这样便于在光线较亮的环境下截屏。文本字号也设置得很大，以方便截屏。\n\n你还设置了文本视图的滚动功能。虽然通常布局使用\
  \ `ScrollView`，但文本视图本身已具备滚动能力。除了在 XML 文件中为文本视图启用滚动属性外，你还需要在文本视图上调用 `setMovementMethod()`\
  \ 方法，如代码清单 10–8 所示。\n\n**代码清单 10–8.** *为文本视图启用滚动功能*\n```java\nTextView tv = this.getTextView();\n\
  tv.setMovementMethod(\n    ScrollingMovementMethod.getInstance());\n```\n此代码提取自\
  \ `DebugActivity`（代码清单 10–2）。\n\n滚动文本视图时，你会发现滚动条出现后会逐渐淡出。这并不能很好地指示文本是否超出可视范围。你可以通过将淡出持续时间设置为\
  \ 0 来让滚动条保持显示。如何设置此参数请参见代码清单 10–7。\n\n#### 操作栏与菜单交互\n\n此示例还展示了菜单如何与操作栏交互。因此，你需要设置一个菜单文件。该文件在代码清单\
  \ 10–9 中给出。\n\n**代码清单 10–9.** *本项目菜单 XML 文件*\n```xml\n<!-- /res/menu/menu.xml -->\n\
  <menu\n>\n    <!-- 此组使用默认类别。 -->\n    <group android:id=\"@+id/menuGroup_Main\"\
  >\n\n        <item android:id=\"@+id/menu_action_icon1\"\n            android:title=\"\
  操作图标 1\"\n            android:icon=\"@drawable/creep001\"\n            android:showAsAction=\"\
  ifRoom\"/>\n\n        <item android:id=\"@+id/menu_action_icon2\"\n            android:title=\"\
  操作图标 2\"\n            android:icon=\"@drawable/creep002\"\n            android:showAsAction=\"\
  ifRoom\"/>\n\n        <item android:id=\"@+id/menu_icon_test\"\n            android:title=\"\
  图标测试\"\n            android:icon=\"@drawable/creep003\"/>\n\n        <item android:id=\"\
  @+id/menu_invoke_listnav\"\n            android:title=\"调用列表导航\"\n            />\n\
  \        <item android:id=\"@+id/menu_invoke_standardnav\"\n            android:title=\"\
  调用标准导航\"\n            />\n        <item android:id=\"@+id/menu_invoke_tabnav\"\n\
  \            android:title=\"调用标签导航\"\n            />\n        <item android:id=\"\
  @+id/menu_da_clear\"\n            android:title=\"清除\" />\n    </group>\n</menu>\n\
  ```\n\n![Image](img/square.jpg) **注意：** 代码清单 10–9 中的菜单 XML 文件使用了来自 [`www.androidicons.com`](http://www.androidicons.com)\
  \ 的三个图标（`creep001`、`002` 和 `003`）。根据该网站声明，这些图标遵循知识共享许可协议 3.0。\n\n以下部分将更详细地介绍此菜单。\n\
  \n##### 显示菜单\n\n在 2.3 及更早版本中，设备通常有专门的菜单按钮。在 3.0 中，模拟器不显示实体主页、返回和菜单按钮。这些按钮在某些设备上可能仍然可用。\n\
  \n如图 10–2 所示，返回和主页按钮现在是屏幕底部的软按钮。而菜单按钮则在应用程序上下文中显示，具体位于右上角的操作栏中。\n\n图 10–2 展示了菜单展开后的样子。\n\
  \n![Image](img/9781430239307_Fig10-02.jpg)\n\n**图 10–2.** *带有标签操作栏和展开菜单的 Activity*\n\
  \n有一点值得注意：菜单栏可能不显示菜单项的图标。你不应依赖菜单项图标在所有情况下都显示。\n\n##### 菜单项作为操作\n\n正如本章开头所述，你可以将某些菜单项直接分配到操作栏上显示。这些菜单项使用\
  \ `showAsAction` 标记指示。你可以在代码清单 10–9 的菜单 XML 文件中看到此标记。该标记行被提取出来，并再次显示在代码清单 10–10\
  \ 中。\n\n**代码清单 10–10.** *`showAsAction` 的菜单项属性*\n```xml\nandroid:showAsAction=\"\
  ifRoom\"\n```\n此 XML 标记的其他可能值如下：\n\n*   `always`\n*   `never`\n*   `withText`\n\n\
  你也可以通过 `MenuItem` 类的 Java API 实现相同的效果：\n```java\nmenuItem.setShowAsAction(int actionEnum)\n\
  ```\n`actionEnum` 的值如下：\n\n*   `SHOW_AS_ACTION_ALWAYS`\n*   `SHOW_AS_ACTION_IF_ROOM`\n\
  *   `SHOW_AS_ACTION_NEVER`\n*   `SHOW_AS_ACTION_WITH_TEXT`\n\n由于这些操作本质上只是菜单项，它们的行为也是如此，并会调用\
  \ Activity 类的 `onOptionsItemSelected()` 回调方法。\n\n最后，本示例使用了许多图标。你可以将这些图标替换为自己的图标，或者使用本章末尾的\
  \ URL 下载本章的项目。\n\n#### Android 清单文件\n\n代码清单 10–11 展示了迄今本项目的清单文件。\n\n**代码清单 10–11.**\
  \ *`AndroidManifest.xml`*\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <manifest\n    package=\"com.androidbook.actionbar\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0.0\">\n    <application android:icon=\"@drawable/icon\"\
  \n        android:label=\"操作栏演示应用\">\n        <activity android:name=\".TabNavigationActionBarActivity\"\
  \n            android:label=\"操作栏演示：标签导航\">\n            <intent-filter>\n     \
  \           <action android:name=\"android.intent.action.MAIN\" />\n           \
  \     <category android:name=\"android.intent.category.LAUNCHER\" />\n         \
  \   </intent-filter>\n        </activity>\n    </application>\n    <uses-sdk android:minSdkVersion=\"\
  11\" />\n</manifest>\n```\n\n`minSDKVersion` 需要指向 `11`，即 3.0 版本的 API 编号。\n\n####\
  \ 检查标签操作栏 Activity\n\n当你编译这些文件并运行应用程序时，会看到标签操作栏，如图 10–1 所示。然后，如果你点击右侧的菜单图标，就会看到应用程序的菜单，如图\
  \ 10–2 中展开的那样。\n\n该应用程序的设计方式是，操作栏上的任何操作都会被记录到调试文本视图中。当运行此应用程序时，你可以测试以下内容：\n\n* \
  \  如果你点击主页图标，你将看到一条消息记录到调试屏幕，表明主页按钮被点击。\n*   如果你点击 tab1，你将看到一条消息，表明 tab1 被重新选中。\n\
  *   如果你点击 tab2，你将看到两条消息：一条表明 tab1 失去焦点，另一条表明 tab2 被点击。这些消息通过代码清单 10–5 中的标签监听器提供。\n\
  *   如果你点击右侧的操作按钮，你将看到相应的菜单项被调用，并且调试消息记录到调试视图。\n*   如果你展开菜单，你将看到有菜单项用于调用其他 Activity，这些\
  \ Activity 演示了其余的操作栏模式。但是，你需要等到本章后面开发完其他 Activity 后才能使用。在此之前，只需注意这些项被调用并记录调试消息即可。\n\
  \n至此，你完成了标签操作栏 Activity 的实现，以及基础框架的设置，这使得编写其他两个 Activity 更加简单。接下来，让我们进入列表导航模式的操作栏。\n\
  \n### 列表导航操作栏 Activity\n\n由于你的基类承担了大部分工作，因此实现和测试列表操作栏导航 Activity 相当容易。你需要以下额外文件来实现此\
  \ Activity：\n\n*   `SimpleSpinnerArrayAdapter.java`：用于设置列表导航栏及其监听器。此类提供下拉导航列表所需的行（代码清单\
  \ 10–12）。\n*   `ListListener.java`：作为列表导航 Activity 的监听器。在将操作栏设置为列表操作栏时，需要将此监听器传递给操作栏（代码清单\
  \ 10–13）。\n*   `ListNavigationActionBarActivity.java`：实现列表导航操作栏 Activity（代码清单 10–14）。\n\
  \n拥有这三个新文件后，你需要更新以下两个文件：\n\n*   `BaseActionBarActivity.java`：取消对列表操作栏 Activity 调用的注释（代码清单\
  \ 10–3）。\n*   `AndroidManifest.xml`：在清单文件中定义新的列表导航操作栏 Activity（代码清单 10–11）。\n\n\
  #### 创建微调器适配器\n\n要能够使用列表导航模式初始化操作栏，你需要以下两样东西：\n\n*   一个微调器适配器，可以告诉列表导航程序导航文本列表是什么。\n\
  *   一个列表导航监听器，以便当选择了列表中的某个项时，你可以得到回调。\n\n代码清单 10–12 展示了实现 `SpinnerAdapter` 接口的 `SimpleSpinnerArrayAdapter`。如前所述，此类的目标是提供一个要显示的项列表。\n\
  \n**代码清单 10–12.** *为列表导航创建微调器适配器*\n```java\n//SimpleSpinnerArrayAdapter.java\npackage\
  \ com.androidbook.actionbar;\n//\n//使用 CTRL-SHIFT-O 导入依赖项\n//\npublic class SimpleSpinnerArrayAdapter\n\
  \    extends ArrayAdapter<String>\n    implements SpinnerAdapter\n{\n    public\
  \ SimpleSpinnerArrayAdapter(Context ctx)\n    {\n        super(ctx,\n          android.R.layout.simple_spinner_item,\n\
  \          new String[]{\"one\",\"two\"});\n\n        this.setDropDownViewResource(\n\
  \          android.R.layout.simple_spinner_dropdown_item);\n    }\n    public View\
  \ getDropDownView(\n      int position, View convertView, ViewGroup parent)\n  \
  \  {\n        return super.getDropDownView(\n          position, convertView, parent);\n\
  \    }\n}\n```\n\n没有直接实现列表导航所需的 `SpinnerAdapter` 接口的 SDK 类。因此，你从 `ArrayAdapter`\
  \ 派生此类，并为 `SpinnerAdapter` 提供一个简单的实现。本章末尾有一个关于微调器适配器的参考 URL，供进一步阅读。现在，让我们进入列表导航监听器。\n\
  \n#### 创建列表监听器\n\n这是一个实现 `ActionBar.OnNavigationListener` 的简单类。代码清单 10–13 展示了此类的代码。\n\
  \n**代码清单 10–13.** *为列表导航创建列表监听器*\n```java\n//ListListener.java\npackage com.androidbook.actionbar;\n\
  //\n//使用 CTRL-SHIFT-O 导入依赖项\n//\npublic class ListListener\n    extends BaseListener\n\
  \    implements ActionBar.OnNavigationListener\n{\n    public ListListener(\n  \
  \  Context ctx, IReportBack target)\n    {\n        super(ctx, target);\n    }\n\
  \    public boolean onNavigationItemSelected(\n    int itemPosition, long itemId)\n\
  \    {\n        this.mReportTo.reportBack(\n          \"列表监听器\",\"项位置:\" + itemPosition);\n\
  \        return true;\n    }\n}\n```\n\n与代码清单 10–5 中的标签监听器类似，你从 `BaseListener` 继承，以便能够通过\
  \ `IReportBack` 接口将事件记录到调试文本视图。\n\n#### 设置列表操作栏\n\n现在，你已拥有设置列表导航操作栏所需的一切。列表导航操作栏\
  \ Activity 的源代码如代码清单 10–14 所示。此类与你之前编写的标签 Activity 非常相似。\n\n**代码清单 10–14.** *列表导航操作栏\
  \ Activity*\n```java\n// ListNavigationActionBarActivity.java\npackage com.androidbook.actionbar;\n\
  //\n//使用 CTRL-SHIFT-O 导入依赖项\n//\npublic class ListNavigationActionBarActivity\n\
  \    extends BaseActionBarActivity\n{\n    private static String tag=\n      \"\
  列表导航操作栏 Activity\";\n\n    public ListNavigationActionBarActivity()\n    {\n   \
  \     super(tag);\n    }\n\n    @Override\n    public void onCreate(Bundle savedInstanceState)\n\
  \    {\n        super.onCreate(savedInstanceState);\n        workwithListActionBar();\n\
  \    }\n    public void workwithListActionBar()\n    {\n        ActionBar bar =\
  \ this.getActionBar();\n        bar.setTitle(tag);\n        bar.setNavigationMode(ActionBar.NAVIGATION_MODE_LIST);\n\
  \        bar.setListNavigationCallbacks(\n           new SimpleSpinnerArrayAdapter(this),\n\
  \           new ListListener(this,this));\n    }\n}//eof-class\n```\n\n重要的代码在代码清单\
  \ 10–14 中突出显示。代码非常简单：你获取一个微调器适配器和一个列表监听器，并将它们设置为操作栏的列表导航回调。\n\n#### 对 `BaseActionBarActivity`\
  \ 进行更改\n\n有了这个列表导航操作栏 Activity（代码清单 10–14），你可以返回并更改 `BaseActionBarActivity`，以便用于\
  \ `ListNavigationActionBarActivity` 的菜单项可以调用此 Activity。取消注释后，代码清单 10–3 中的相应函数看起来像代码清单\
  \ 10–15 中提取并取消注释的代码。\n\n**代码清单 10–15.** *取消注释以调用列表导航操作栏 Activity 的代码*\n```java\n\
  private void invokeListNav(){\n     Intent i = new Intent(this,\n        ListNavigationActionBarActivity.class);\n\
  \     startActivity(i);\n}\n```\n取消注释后，菜单项和代码就被连接起来，以调用此列表导航操作栏 Activity。\n\n####\
  \ 对 `AndroidManifest.xml` 进行更改\n\n在调用此 Activity 之前，你需要在 Android 清单文件中注册它。将代码清单 10–16\
  \ 中的代码添加到代码清单 10–11 的 Android 清单文件中，以完成 Activity 的注册。\n\n**代码清单 10–16.** *注册列表导航操作栏\
  \ Activity*\n```xml\n<activity android:name=\".ListNavigationActionBarActivity\"\
  \n        android:label=\"操作栏演示：列表导航\">\n</activity>\n```\n\n#### 检查列表操作栏 Activity\n\
  \n当你编译到目前为止所涉及的文件（本小节关于列表导航操作栏开头提到的新文件和已更改文件）并运行应用程序时，你会看到如图 10–3 所示的列表操作栏。\n\n\
