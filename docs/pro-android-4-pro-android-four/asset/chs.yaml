  19. `URIMatcher`是如何工作的？它有什么用途？\n\n## 第 5 章\n\n## 理解 Intent\n\nAndroid 引入了一个称为 *intent*\
  \ 的概念来调用组件。Android 的组件列表包括 Activity（UI 组件）、Service（后台代码）、Broadcast Receiver（响应广播消息的代码）和\
  \ Content Provider（抽象数据的代码）。\n\n### Android Intent 基础\n\n虽然 intent 很容易被理解为一种调用组件的机制，但\
  \ Android 将多个想法融入了 *intent* 的概念中。你可以使用 intent 从你的应用程序中调用外部应用程序。你可以使用 intent 从你的应用程序中调用内部或外部组件。你可以使用\
  \ intent 引发事件，以便其他人能以类似于发布-订阅模型的方式响应。你还可以使用 intent 设置闹钟。\n\n**注意：** 什么是 intent？简单的回答可能是：intent\
  \ 是一个动作及其相关的数据载荷。\n\n在最简单的层面上，intent 是一个你可以告诉 Android 去执行（或 *调用*）的动作。Android 调用的动作取决于为该动作注册了哪些内容。假设你编写了以下\
  \ Activity：\n\n```\npublic class BasicViewActivity extends Activity\n{\n    @Override\n\
  \    public void onCreate(Bundle savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.some_view);\n    }\n}//eof-class\n```\n\n布局 `some_view`\
  \ 需要指向 `/res/layout` 目录中一个有效的布局文件。然后，Android 允许你将该 Activity 注册到应用程序的清单文件中，使其可供其他应用程序调用。注册代码如下所示：\n\
  \n```\n<activity android:name=\".BasicViewActivity\"\n          android:label=\"\
  Basic View Tests\">\n  <intent-filter>\n   <action android:name=\"com.androidbook.intent.action.ShowBasicView\"\
  />\n   <category android:name=\"android.intent.category.DEFAULT\" />\n  </intent-filter>\n\
  </activity>\n```\n\n此处的注册不仅涉及一个 Activity，还涉及一个可用于调用该 Activity 的动作。Activity 的设计者通常会为这个动作选择一个名称，并将其指定为该\
  \ Activity 的 intent filter 的一部分。随着本章内容的深入，你将有机会了解更多关于这些 intent filter 的知识。\n\n既然你已经指定了\
  \ Activity 及其与动作的注册关系，你就可以使用 intent 来调用这个 `BasicViewActivity`：\n\n```\npublic static\
  \ void invokeMyApplication(Activity parentActivity)\n{\nString actionName=\"com.androidbook.intent.action.ShowBasicView\"\
  ;\n   Intent intent = new Intent(actionName);\n   parentActivity.startActivity(intent);\n\
  }\n```\n\n**注意：** 动作名称的一般约定是 `<your-package-name>.intent.action.YOUR_ACTION_NAME`。\n\
  \n一旦 `BasicViewActivity` 被调用，它就能够发现是哪个 intent 调用了它。以下是重写后的 `BasicViewActivity` 代码，用于获取调用它的\
  \ intent：\n\n```\npublic class BasicViewActivity extends Activity\n{\n    @Override\n\
  \    public void onCreate(Bundle savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.some_view);\n        Intent intent = this.getIntent();\n\
  \        if (intent == null)\n        {\n            Log.d(\"test tag\", \"This\
  \ activity is invoked without an intent\");\n        }\n    }\n}//eof-class\n```\n\
  \n\n\n### Android 中可用的 Intent\n\n你可以通过调用 Android 自带的一些应用程序来测试运行 Intent。位于 [`http://developer.android.com/guide/appendix/g-app-intents.html`](http://developer.android.com/guide/appendix/g-app-intents.html)\
  \ 的页面记录了部分可用的 Google 应用程序及其调用的 Intent。\n\n![Image](img/square.jpg) **注意：** 此列表可能因\
  \ Android 版本而异。\n\n可用的应用程序集可能包括以下内容：\n\n*   用于打开浏览器窗口的浏览器应用\n*   用于拨打电话号码的应用\n*\
  \   用于显示电话拨号器，让用户通过界面输入号码并拨打电话的应用\n*   用于在给定经纬度坐标处显示世界地图的地图应用\n*   能够显示 Google 街景的详细地图应用\n\
  \n代码清单 5-1 中的代码展示了如何通过它们公开的 Intent 来调用这些应用程序。\n\n**代码清单 5-1.** *练习 Android 预置应用*\n\
  \n```\npublic class IntentsUtils\n{\n    public static void invokeWebBrowser(Activity\
  \ activity)\n    {\n       Intent intent = new Intent(Intent.ACTION_VIEW);\n   \
  \    intent.setData(Uri.parse(\"http://www.google.com\"));\n       activity.startActivity(intent);\n\
  \    }\n    public static void invokeWebSearch(Activity activity)\n    {\n     \
  \  Intent intent = new Intent(Intent.ACTION_WEB_SEARCH);\n       intent.setData(Uri.parse(\"\
  http://www.google.com\"));\n       activity.startActivity(intent);\n    }\n    public\
  \ static void dial(Activity activity)\n    {\n       Intent intent = new Intent(Intent.ACTION_DIAL);\n\
  \       activity.startActivity(intent);\n    }\n\n    public static void call(Activity\
  \ activity)\n    {\n       Intent intent = new Intent(Intent.ACTION_CALL);\n   \
  \    intent.setData(Uri.parse(\"tel:555–555–5555\"));\n       activity.startActivity(intent);\n\
  \    }\n    public static void showMapAtLatLong(Activity activity)\n    {\n    \
  \   Intent intent = new Intent(Intent.ACTION_VIEW);\n       //geo:lat,long?z=zoomlevel&q=question-string\n\
  \       intent.setData(Uri.parse(\"geo:0,0?z=4&q=business+near+city\"));\n     \
  \  activity.startActivity(intent);\n    }\n\n    public static void tryOneOfThese(Activity\
  \ activity)\n    {\n       IntentsUtils.invokeWebBrowser(activity);\n    }\n}\n\
  ```\n\n只要你有一个简单的 Activity，并通过菜单项调用 `tryOneOfThese(activity)`，你就可以执行这段代码。创建一个简单的菜单很容易（见代码清单\
  \ 5-2）。\n\n**代码清单 5-2.** *创建简单菜单的测试框架*\n\n```\npublic class MainActivity extends\
  \ Activity\n{\n   public void onCreate(Bundle savedInstanceState)   {\n      super.onCreate(savedInstanceState);\n\
  \n      TextView tv = new TextView(this);\n      tv.setText(\"Hello, Android. Say\
  \ hello\");\n      setContentView(tv);\n   }\n   @Override\n   public boolean onCreateOptionsMenu(Menu\
  \ menu)    {\n      super.onCreateOptionsMenu(menu);\n      int base=Menu.FIRST;\
  \ // value is 1\n      MenuItem item1 = menu.add(base,base,base,\"Test\");\n   \
  \   return true;\n   }\n\n   @Override\n   public boolean onOptionsItemSelected(MenuItem\
  \ item)   {\n      if (item.getItemId() == 1)       {\n         IntentUtils.tryOneOfThese(this);\n\
  \      }\n      else {\n        return super.onOptionsItemSelected(item);\n    \
  \  }\n      return true;\n   }\n}\n```\n\n![Image](img/square.jpg) **注意：** 请参阅第\
  \ 2 章了解如何基于这些文件创建 Android 项目，以及如何编译和运行它。你也可以阅读第 7 章的前面部分，查看更多关于菜单的示例代码。或者，你可以使用本章末尾提供的网址下载专门为本章节准备的\
  \ Eclipse 示例项目。不过，当你下载示例代码时，这个基础 Activity 可能会稍有不同，但概念保持不变。在下载的示例中，我们还从 XML 文件加载了菜单。\n\
  \n### 探索 Intent 的构成\n\n深入理解 Intent 的另一个可靠方法是查看 Intent 对象包含的内容。一个 Intent 包含动作、数据（由数据\
  \ URI 表示）、额外的数据元素键值对，以及一个明确的类名（称为*组件名*）。只要 Intent 至少包含其中一项，其他几乎所有部分都是可选的。我们将依次探讨这些部分。\n\
  \n![Image](img/square.jpg) **注意：** 当 Intent 带有组件名时，它被称为*显式* Intent。当 Intent 不包含组件名，而依赖于动作和数据等其他部分时，它被称为*隐式*\
  \ Intent。在本章后续内容中，你将看到这两种 Intent 之间存在细微差别。\n\n#### Intent 与数据 URI\n\n到目前为止，我们介绍了最简单的\
  \ Intent，即我们只需要一个动作名。代码清单 5-1 中的 `ACTION_DIAL` 活动就是其中之一；要调用拨号器，该清单中我们只需要拨号器的动作，不需要其他内容：\n\
  \n```\npublic static void dial(Activity activity)\n{\n   Intent intent = new Intent(Intent.ACTION_DIAL);\n\
  \   activity.startActivity(intent);\n}\n```\n\n与 `ACTION_DIAL` 不同，用于拨打指定电话号码的 `ACTION_CALL`\
  \ Intent（同样参考代码清单 5-1）接受一个名为 `Data` 的额外参数。此参数指向一个 URI，而该 URI 又指向电话号码：\n\n```\npublic\
  \ static void call(Activity activity)\n{\n   Intent intent = new Intent(Intent.ACTION_CALL);\n\
  \   intent.setData(Uri.parse(\"tel:555–555–5555\"));\n   activity.startActivity(intent);\n\
  }\n```\n\nIntent 的动作部分是一个字符串或字符串常量，通常以 Java 包名作为前缀。\n\nIntent 的数据部分并非实际数据，而是指向数据的指针。此数据部分是一个表示\
  \ URI 的字符串。Intent 的 URI 可以包含可作为数据推断的参数，就像网站的 URL 一样。\n\n此 URI 的格式可能因该动作调用的每个 Activity\
  \ 而异。在本例中，`CALL` 动作决定了它期望何种数据 URI。它从 URI 中提取了电话号码。\n\n![Image](img/square.jpg) **注意：**\
  \ 被调用的 Activity 也可以将 URI 用作数据源的指针，从数据源中提取数据并使用该数据。对于音频、视频和图像等媒体，就是这种情况。\n\n\n\n\
  ### 通用操作\n\n`Intent.ACTION_CALL` 和 `Intent.ACTION_DIAL` 这些操作很容易让我们错误地认为每个操作与其所调用的组件之间存在一一对应的关系。为了反驳这一点，我们来看一个来自清单\
  \ 5–1 中 `IntentUtils` 代码的反例：\n\n```\npublic static void invokeWebBrowser(Activity\
  \ activity)\n{\n   Intent intent = new Intent(Intent.ACTION_VIEW);\n   intent.setData(Uri.parse(\"\
  http://www.google.com\"));\n   activity.startActivity(intent);\n}\n```\n\n请注意，这里操作只是简单地声明为\
  \ `ACTION_VIEW`。Android 如何知道应该调用哪个 Activity 来响应这样一个通用的操作名称呢？在这些情况下，Android 不仅依赖通用的操作名称，还依赖\
  \ URI 的特性。Android 会查看 URI 的协议（scheme），这里恰好是 `http`，然后询问所有已注册的 Activity，看哪些能理解这个协议。接着，它会进一步询问哪些能够处理\
  \ `VIEW` 操作，然后调用该 Activity。要使这一切正常工作，浏览器 Activity 应该已经针对 `http` 数据协议注册了一个 `VIEW`\
  \ 意图。该意图声明在清单文件中可能如下所示：\n\n```\n<activity......>\n<intent-filter>\n          <action\
  \ android:name=\"android.intent.action.VIEW\" />\n         <data android:scheme=\"\
  http\"/>\n         <data android:scheme=\"https\"/>\n</intent-filter>\n</activity>\n\
  ```\n\n你可以通过查看 [`http://developer.android.com/guide/topics/manifest/data-element.html`](http://developer.android.com/guide/topics/manifest/data-element.html)\
  \ 上关于意图过滤器 `data` 元素的 XML 定义，来了解 `data` 节点更多允许的属性。意图过滤器 `data` XML 子节点的子元素或属性包括以下这些：\n\
  \n`host`\n`mimeType`\n`path`\n`pathPattern`\n`pathPrefix`\n`port`\n`scheme`\n\n\
  `mimeType` 是一个你经常会用到的属性。例如，下面这个用于显示笔记列表的 Activity 的意图过滤器，将 MIME 类型指定为一个笔记目录：\n\n\
  ```\n<intent-filter>\n   <action android:name=\"android.intent.action.VIEW\" />\n\
  \   <data android:mimeType=\"vnd.android.cursor.dir/vnd.google.note\" />\n</intent-filter>\n\
  ```\n\n这个意图过滤器声明可以理解为：“调用此 Activity 来查看一个笔记集合。”\n\n另一方面，显示单个笔记的屏幕，其意图过滤器使用了一个表示单个笔记项的\
  \ MIME 类型：\n\n```\n<intent-filter>\n   <action android:name=\"android.intent.action.VIEW\"\
  \ />\n   <data android:mimeType=\"vnd.android.cursor.item/vnd.google.note\" />\n\
  </intent-filter>\n```\n\n这个意图过滤器声明可以理解为：“调用此 Activity 来查看单个笔记。”\n\n### 使用额外信息\n\n\
  除了操作和数据这两个主要属性之外，意图还可以包含一个称为 *extras* 的额外属性。Extra 可以向接收意图的组件提供更多信息。额外数据以键/值对的形式存在：键名通常以包名开头，而值可以是任何基本数据类型，也可以是任意对象，只要它实现了\
  \ `android.os.Parcelable` 接口。这些额外信息由一个名为 `android.os.Bundle` 的 Android 类来表示。\n\n\
  `Intent` 类中以下两个方法提供了对额外 `Bundle` 的访问：\n\n```\n//从 Intent 中获取 Bundle\nBundle extraBundle\
  \ = intent.getExtras();\n\n// 在 intent 中放入一个 bundle\nBundle anotherBundle = new\
  \ Bundle();\n\n// 用键/值对填充 bundle\n...\n// 然后设置 bundle 到 Intent 上\nintent.putExtras(anotherBundle);\n\
  ```\n\n`getExtras` 很直观：它返回 intent 所携带的 `Bundle`。`putExtras` 会检查 intent 当前是否有一个 bundle。如果\
  \ intent 已经有一个 bundle，`putExtras` 会将新 bundle 中的额外键值对转移到现有的 bundle 中。如果 bundle 不存在，`putExtras`\
  \ 会创建一个，并将新 bundle 中的键值对复制到创建的 bundle 中。\n\n![Image](img/square.jpg) **注意：** `putExtras`\
  \ 会复制传入的 bundle，而不是直接引用它。所以如果你之后修改了传入的 bundle，并不会改变 intent 内部的 bundle。\n\n你可以使用多种方法向\
  \ bundle 添加基本类型。以下是一些将简单数据类型添加到额外数据中的方法：\n\n`putExtra(String name, boolean value);`\n\
  `putExtra(String name, int value);`\n`putExtra(String name, double value);`\n`putExtra(String\
  \ name, String value);`\n\n下面是一些不那么简单的 extras 方法：\n\n```\n// 简单数组支持\nputExtra(String\
  \ name, int[] values);\nputExtra(String name, float[] values);\n\n// 可序列化对象\nputExtra(String\
  \ name, Serializable value);\n\n// Parcelable 支持\nputExtra(String name, Parcelable\
  \ value);\n\n// 在给定的键下添加另一个 bundle\n// Bundle 中的 Bundle\nputExtra(String name, Bundle\
  \ value);\n\n// 从另一个 intent 添加 bundle\n// Bundle 的副本\nputExtra(String name, Intent\
  \ anotherIntent);\n\n// 显式 ArrayList 支持\nputIntegerArrayListExtra(String name, ArrayList\
  \ arrayList);\nputParcelableArrayListExtra(String name, ArrayList arrayList);\n\
  putStringArrayListExtra(String name, ArrayList arrayList);\n```\n\n在接收端，以 `get`\
  \ 开头的方法会根据键名从额外的 bundle 中检索信息。\n\n`Intent` 类定义了与某些操作关联的额外键字符串。你可以在 [`http://developer.android.com/reference/android/content/Intent.html#EXTRA_ALARM_COUNT`](http://developer.android.com/reference/android/content/Intent.html#EXTRA_ALARM_COUNT)\
  \ 上找到许多这些额外信息键常量。\n\n让我们考虑一下该 URL 中列出的、与发送电子邮件相关的几个示例 extra：\n\n*   `EXTRA_EMAIL`：你将使用此字符串键来保存一组电子邮件地址。该键的值为\
  \ `android.intent.extra.EMAIL`。它应指向一个包含文本形式电子邮件地址的字符串数组。\n*   `EXTRA_SUBJECT`：你将使用此键来保存电子邮件的主题。该键的值为\
  \ `android.intent.extra.SUBJECT`。该键应指向一个提供主题的字符串。\n\n\n\n### 使用组件直接调用 Activity\n\
  \n你已经看到了几种使用 Intent 启动 Activity 的方式。你看到了一个显式操作启动 Activity，也看到了一个通用操作借助数据 URI 启动\
  \ Activity。Android 还提供了一种更直接的方式来启动 Activity：你可以指定 Activity 的 `ComponentName`，它是围绕对象包名和类名的一个抽象。`Intent`\
  \ 类提供了多种方法来指定组件：\n\n- `setComponent(ComponentName name);`\n- `setClassName(String\
  \ packageName, String classNameInThatPackage);`\n- `setClassName(Context context,\
  \ String classNameInThatContext);`\n- `setClass(Context context, Class classObjectInThatContext);`\n\
  \n归根结底，它们都是调用同一个方法的快捷方式：\n\n`setComponent(ComponentName name);`\n\n`ComponentName`\
  \ 将包名和类名封装在一起。例如，以下代码调用了模拟器中自带的 `contacts` Activity：\n\n```\nIntent intent = new\
  \ Intent();\nintent.setComponent(new ComponentName(\n    \"com.android.contacts\"\
  \n    ,\"com.android.contacts.DialContactsEntryActivity\");\nstartActivity(intent);\n\
  ```\n\n请注意，包名和类名都是完全限定的，并在传递给 `Intent` 类之前依次用于构造 `ComponentName`。\n\n你也可以直接使用类名，而无需构造\
  \ `ComponentName`。再次考虑 `BasicViewActivity` 代码片段：\n\n```\npublic class BasicViewActivity\
  \ extends Activity\n{\n    @Override\n    public void onCreate(Bundle savedInstanceState)\n\
  \    {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.some_view);\n\
  \    }\n}//eof-class\n```\n\n基于此，你可以使用以下代码来启动这个 Activity：\n\n```\nIntent directIntent\
  \ = new Intent(activity, BasicViewActivity.class);\nactivity.start(directIntent);\n\
  ```\n\n然而，如果你希望任何类型的 Intent 都能启动一个 Activity，你应该像这样在 `AndroidManifest.xml` 文件中注册该\
  \ Activity：\n\n```\n<activity android:name=\".BasicViewActivity\"\n          android:label=\"\
  Test Activity\">\n```\n\n![Image](img/square.jpg) **注意：** 通过类名或名称直接调用 Activity 时，不需要\
  \ Intent 过滤器。如前所述，这种类型的 Intent 被称为*显式 Intent*。由于显式 Intent 指定了要调用的完全限定的 Android 组件，因此在调用该组件时会忽略该\
  \ Intent 的其他部分。\n\n### 理解 Intent 类别\n\n你可以将 Activity 分类，以便根据类别名称搜索它们。例如，在启动时，Android\
  \ 会查找其类别标记为 `CATEGORY_LAUNCHER` 的 Activity。然后它会选取这些 Activity 的名称和图标，并将它们放置在主页屏幕上以供启动。\n\
  \n另一个例子：Android 会查找标记为 `CATEGORY_HOME` 的 Activity，以在启动时显示主屏幕。类似地，`CATEGORY_GADGET`\
  \ 将一个 Activity 标记为适合嵌入或在另一个 Activity 中重用。\n\n类似 `CATEGORY_LAUNCHER` 这样的类别的字符串格式遵循\
  \ `category` 定义约定：\n\n```\nandroid.intent.category.LAUNCHER\n```\n\n你需要了解这些用于 `category`\
  \ 定义的文本字符串，因为 Activity 会在 `AndroidManifest.xml` 文件中将它们的类别注册为 Activity 过滤器定义的一部分。以下是一个示例：\n\
  \n```\n<activity android:name=\".HelloWorldActivity\"\n          android:label=\"\
  @string/app_name\">\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n![Image](img/square.jpg) **注意：** Activity\
  \ 可能具有某些能力来限制或启用它们，例如是否可以将它们嵌入到父 Activity 中。这些类型的 Activity 特征通过类别声明。\n\n让我们快速浏览一些预定义的\
  \ Android 类别及其使用方法（参见表 5–1）。\n\n![Image](img/9781430239307_tab05-01.jpg)\n\n你可以在以下针对\
  \ `Intent` 类的 Android SDK 网址中阅读这些 Activity 类别的详细信息：\n[`http://developer.android.com/android/reference/android/content/Intent.html#CATEGORY_ALTERNATIVE`](http://developer.android.com/android/reference/android/content/Intent.html#CATEGORY_ALTERNATIVE)。\n\
  \n当你使用 Intent 启动 Activity 时，可以通过指定类别来选择要启动的 Activity 类型。或者，你可以搜索匹配某个类别的 Activity。以下是一个检索与\
  \ `CATEGORY_LAUNCHER` 类别相匹配的主 Activity 集合的示例：\n\n```\nIntent mainIntent = new Intent(Intent.ACTION_MAIN,\
  \ null);\nmainIntent.addCategory(Intent.CATEGORY_LAUNCHER);\nPackageManager pm =\
  \ getPackageManager();\nList<ResolveInfo> list = pm.queryIntentActivities(mainIntent,\
  \ 0);\n```\n\n`PackageManager` 是一个关键类，它允许你发现匹配特定 Intent 的 Activity，而无需调用它们。你可以遍历接收到的\
  \ Activity，并根据 `ResolveInfo` API 按需调用它们。以下是前面代码的扩展，它遍历 Activity 列表，并在匹配某个名称时调用其中一个\
  \ Activity。在代码中，我们使用了一个任意名称进行测试：\n\n```\nfor(ResolveInfo ri: list)\n{\n    //ri.activityInfo.\n\
  \    Log.d(\"test\",ri.toString());\n    String packagename = ri.activityInfo.packageName;\n\
  \    String classname = ri.activityInfo.name;\n    Log.d(\"test\", packagename +\
  \ \":\" + classname);\n    if (classname.equals(\"com.ai.androidbook.resources.TestActivity\"\
  ))\n    {\n        Intent ni = new Intent();\n        ni.setClassName(packagename,classname);\n\
  \        activity.startActivity(ni);\n    }\n}\n```\n\n你也可以完全基于 Intent 类别（例如 `CATEGORY_LAUNCHER`）来启动\
  \ Activity：\n\n```\npublic static void invokeAMainApp(Activity activity)\n{\n  \
  \ Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);\n   mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);\n\
  \   activity.startActivity(mainIntent);\n}\n```\n\n会有多个 Activity 匹配该 Intent，那么 Android\
  \ 会选择哪一个？为了解决这个问题，Android 会显示一个“完成操作使用”对话框，列出所有可能的 Activity，供你选择其中一个运行。\n\n以下是使用\
  \ Intent 前往主页的另一个示例：\n\n```\n//前往主屏幕\nIntent mainIntent = new Intent(Intent.ACTION_MAIN,\
  \ null);\nmainIntent.addCategory(Intent.CATEGORY_HOME);\nstartActivity(mainIntent);\n\
  ```\n\n如果你不想使用 Android 的默认主页，你可以编写自己的主页，并将该 Activity 声明为 `HOME` 类别。在这种情况下，由于现在注册了多个主屏\
  \ Activity，上述代码将为你提供一个选项来打开你的主屏 Activity：\n\n```\n//用你的主屏替换默认主屏\n<intent-filter>\n\
  \   <action android:value=\"android.intent.action.MAIN\" />\n   <category android:value=\"\
  android.intent.category.HOME\"/>\n   <category android:value=\"android.intent.category.DEFAULT\"\
  \ />\n</intent-filter>\n```\n\n\n\n### 将 Intent 解析为其组件的规则\n\n到目前为止，我们已经讨论了关于 `Intent`\
  \ 的许多方面。总结一下，我们谈到了动作、数据 URI、额外数据，最后是类别。基于这些方面，Android 使用多种策略，根据 Intent 过滤器将 `Intent`\
  \ 与其目标 Activity 进行匹配。\n\n层级结构的顶端是附加到 `Intent` 上的组件名称。如果设置了此名称，则该 `Intent` 被称为*显式\
  \ Intent*。对于显式 `Intent`，只有组件名称重要；`Intent` 的其他所有方面或属性都被忽略。当 `Intent` 上没有组件名称时，该 `Intent`\
  \ 被称为*隐式 Intent*。用于解析隐式 `Intent` 目标的规则有很多。\n\n基本规则是：传入 `Intent` 的动作、类别和数据特性*必须*与\
  \ Intent 过滤器中指定的特性*匹配*（或存在）。与 `Intent` 不同，一个 Intent 过滤器可以指定多个动作、类别和数据属性。这意味着同一个\
  \ Intent 过滤器可以满足多个 `Intent`，也就是说一个 Activity 可以响应许多 `Intent`。但是，“匹配”的含义在动作、数据属性和类别之间有所不同。让我们看看隐式\
  \ `Intent` 每个部分的匹配标准。\n\n#### 动作\n\n如果 `Intent` 上有一个动作，那么 Intent 过滤器必须将该动作作为其动作列表的一部分，或者不定义任何动作。因此，如果\
  \ Intent 过滤器*没有定义动作*，则该 Intent 过滤器*匹配*任何传入的 `Intent` 动作。\n\n如果在 Intent 过滤器中指定了一个或多个动作，则至少有一个动作必须与传入\
  \ `Intent` 的动作匹配。\n\n#### 数据\n\n如果 Intent 过滤器中未指定任何数据特性，则它不会匹配任何携带任何数据或数据属性的传入 `Intent`。这意味着它只会寻找那些根本没有指定数据的\
  \ `Intent`。\n\n（过滤器中）缺少数据和缺少动作的作用是相反的。如果过滤器中没有动作，则一切皆匹配。如果过滤器中没有数据，则 `Intent` 中的每一点数据都是不匹配的。\n\
  \n#### 数据类型\n\n要使数据类型匹配，传入 `Intent` 的数据类型必须是 Intent 过滤器中指定的数据类型之一。`Intent` 中的数据类型必须存在于\
  \ Intent 过滤器中。\n\n传入 `Intent` 的数据类型通过以下两种方式之一确定。首先，如果数据 URI 是 `content:` 或 `file:`\
  \ URI，则内容提供者或 Android 会确定其类型。第二种方式是查看 `Intent` 的显式数据类型。为此，传入的 `Intent` 不应设置数据 URI，因为当在\
  \ `Intent` 上调用 `setType` 时，这会自动处理。\n\nAndroid 还允许其 MIME 类型规范使用星号（`*`）作为子类型，以涵盖所有可能的子类型。\n\
  \n此外，数据类型是区分大小写的。\n\n#### 数据方案\n\n要使数据方案匹配，传入 `Intent` 的数据方案必须是 Intent 过滤器中指定的方案之一。换句话说，传入的数据方案必须存在于\
  \ Intent 过滤器中。\n\n传入 `Intent` 的方案是数据 URI 的第一部分。在 `Intent` 上，没有设置方案的方法。它纯粹是从类似 `http://www.somesite.com/somepath`\
  \ 的 `Intent` 数据 URI 派生出来的。\n\n如果传入 `Intent` URI 的数据方案是 `content:` 或 `file:`，则无论\
  \ Intent 过滤器的方案、域和路径如何，都被视为匹配。根据 SDK 的说法，这是因为每个组件都应该知道如何从 `content` 或 `file` URL\
  \ 读取数据，这些 URL 本质上是本地的。换句话说，所有组件都应该支持这两种类型的 URL。\n\n方案也是区分大小写的。\n\n#### 数据授权\n\n\
  如果过滤器中没有授权，则对于任何传入的数据 URI 授权（或域名）都是匹配的。如果在过滤器中指定了授权——例如 `www.somesite.com`——那么一个方案和一个授权必须与传入\
  \ `Intent` 的数据 URI 匹配。\n\n例如，如果我们在 Intent 过滤器中指定 `www.somesite.com` 作为授权，方案指定为 `https`，那么该\
  \ `Intent` 将无法匹配 `http://www.somesite.com/somepath`，因为 `http` 没有被指示为受支持的方案。\n\n\
  授权也是区分大小写的。\n\n#### 数据路径\n\nIntent 过滤器中没有数据路径意味着匹配任何传入数据 URI 的路径。如果在过滤器中指定了路径——例如\
  \ `somepath`——那么一个方案、一个授权和一个数据路径必须与传入 `Intent` 的数据 URI 匹配。\n\n换句话说，方案、授权和路径协同工作以验证传入的\
  \ `Intent` URI，例如 `http://www.somesite.com/somepath`。所以 `path`、`authority` 和 `scheme`\
  \ 不是孤立地工作，而是协同工作。\n\n路径也是区分大小写的。\n\n#### Intent 类别\n\n传入 `Intent` 中的每个类别都必须存在于过滤器类别列表中。过滤器中有更多的类别是可以的。如果一个过滤器*没有任何类别*，它将*只匹配一个没有提及任何类别*的\
  \ `Intent`。\n\n然而，有一个陷阱。Android 将所有传递给 `startActivity()` 的*隐式* `Intent` 视为至少包含一个类别：`android.intent.category.DEFAULT`。`startActivity()`\
  \ 中的代码将只搜索那些为传入的隐式 `Intent` 定义了 `DEFAULT` 类别的 Activity。因此，每个希望通过隐式 `Intent` 被调用的\
  \ Activity 都必须在其过滤器中包含默认类别。\n\n即使一个 Activity 在其 Intent 过滤器中没有默认类别，如果你知道它的显式组件名称，你仍然可以像启动器那样启动它。如果你在没有将默认类别作为搜索条件的情况下自行显式搜索匹配的\
  \ `Intent`，你也可以通过这种方式启动这些 Activity。\n\n从这个意义上说，这个 `DEFAULT` 类别是 `startActivity()`\
  \ 实现的人为产物，而不是过滤器的固有行为。\n\n还有一个额外的问题，因为 Android 声明，如果 Activity 仅打算从启动器屏幕调用，则 `DEFAULT`\
  \ 类别是不必要的。因此，这些 Activity 通常只在其过滤器中包含 `MAIN` 和 `LAUNCHER` 类别。但是，也可以选择为这些 Activity\
  \ 指定 `DEFAULT` 类别。\n\n\n\n### 练习使用 `ACTION_PICK`\n\n到目前为止，我们所练习的 Intent 或操作，主要是调用其他\
  \ Activity，而不期望返回结果。现在让我们来看一个更复杂一点的操作，它在被调用后会返回一个值。`ACTION_PICK` 就是这样一个通用操作。\n\n\
  `ACTION_PICK` 的用途是启动一个显示项目列表的 Activity。该 Activity 应允许用户从列表中选择一个项目。一旦用户选择了项目，Activity\
  \ 应将所选项目的 URI 返回给调用者。这使得 UI 的功能可以被复用来选择特定类型的项目。\n\n你应该使用指向 Android 内容游标的 MIME 类型来指示要选择的项目集合。该\
  \ URI 的 MIME 类型应类似于以下内容：\n\n`vnd.android.cursor.dir/vnd.google.note`\n\nActivity\
  \ 负责根据 URI 从内容提供者中检索数据。这也是数据应尽可能封装到内容提供者中的原因。\n\n对于像这样返回数据的操作，我们不能使用 `startActivity()`，因为\
  \ `startActivity()` 不返回结果。`startActivity()` 无法返回结果，因为它会在单独的线程中将新 Activity 作为模态对话框打开，并让主线程处理事件。换句话说，`startActivity()`\
  \ 是一个异步调用，没有任何回调来指示被调用 Activity 中发生的事情。如果你想要返回数据，可以使用 `startActivity()` 的一个变体，名为\
  \ `startActivityForResult()`，它带有回调。\n\n让我们看看 `Activity` 类中 `startActivityForResult()`\
  \ 方法的签名：\n\n`public void startActivityForResult(Intent intent, int requestCode)`\n\
  \n此方法启动一个你希望从中获得结果的 Activity。当该 Activity 退出时，源 Activity 的 `onActivityResult()` 方法会被调用，并传入给定的\
  \ `requestCode`。此回调方法的签名是：\n\n`protected void onActivityResult(int requestCode,\
  \ int resultCode, Intent data)`\n\n`requestCode` 是你传入 `startActivityForResult()`\
  \ 方法的参数。`resultCode` 可以是 `RESULT_OK`、`RESULT_CANCELED` 或自定义代码。自定义代码应以 `RESULT_FIRST_USER`\
  \ 开始。`Intent` 参数包含被调用 Activity 想要返回的任何附加数据。对于 `ACTION_PICK` 的情况，Intent 中返回的数据指向单个项目的数据\
  \ URI。\n\n代码清单 5–3 演示了如何调用一个返回结果的 Activity。\n\n![图片](img/square.jpg) **注意：** 代码清单\
  \ 5–3 中的代码假定你已经安装了 Android SDK 发行版中的 NotePad 示例项目。如果你尚未在 SDK 中安装 NotePad 示例，我们在本章末尾提供了一个链接，指导你如何下载它。\n\
  \n**代码清单 5–3.** *调用操作后返回数据*\n\n```\npublic class SomeActivity extends Activity\n\
  {\n.....\n.....\npublic static void invokePick(Activity activity)\n{\n  Intent pickIntent\
  \ = new Intent(Intent.ACTION_PICK);\n  int requestCode = 1;\n  pickIntent.setData(Uri.parse(\n\
  \     \"content://com.google.provider.NotePad/notes\"));\n  activity.startActivityForResult(pickIntent,\
  \ requestCode);\n}\n\nprotected void onActivityResult(int requestCode\n    ,int\
  \ resultCode\n    ,Intent outputIntent)\n{\n  //这是为了通知父类（Activity）\n  //被调用的 Activity\
  \ 已完成，基类\n  //可以进行必要的清理工作\n  super.onActivityResult(requestCode, resultCode, outputIntent);\n\
  \  parseResult(this, requestCode, resultCode, outputIntent);\n}\npublic static void\
  \ parseResult(Activity activity\n    , int requestCode\n    , int resultCode\n \
  \   , Intent outputIntent)\n{\n    if (requestCode != 1)\n    {\n     Log.d(\"Test\"\
  , \"Some one else called this. not us\");\n             return;\n    }\n    if (resultCode\
  \ != Activity.RESULT_OK)\n    {\n      Log.d(Test, \"Result code is not ok:\" +\
  \ resultCode);\n               return;\n    }\n    Log.d(\"Test\", \"Result code\
  \ is ok:\" + resultCode);\n    Uri selectedUri = outputIntent.getData();\n    Log.d(\"\
  Test\", \"The output uri:\" + selectedUri.toString());\n\n    //继续显示笔记\n    outputIntent.setAction(Intent.ACTION_VIEW);\n\
  \    startActivity(outputIntent);\n}\n```\n\n常量 `RESULT_OK`、`RESULT_CANCELED` 和\
  \ `RESULT_FIRST_USER` 都定义在 `Activity` 类中。这些常量的数值如下：\n\n```\nRESULT_OK = -1;\nRESULT_CANCELED\
  \ = 0;\nRESULT_FIRST_USER = 1;\n```\n\n要使 `PICK` 功能正常工作，响应方中的实现代码应明确处理 `PICK` 的需求。让我们看看这在\
  \ Google 示例 NotePad 应用程序中是如何完成的。当在项目列表中选中某个项目时，会检查启动该 Activity 的 Intent 是否为 `PICK`\
  \ Intent。如果是，则数据 URI 会被设置到一个新的 Intent 中，并通过 `setResult()` 返回：\n\n```\n@Override\n\
  protected void onListItemClick(ListView l, View v, int position, long id) {\n  \
  \  Uri uri = ContentUris.withAppendedId(getIntent().getData(), id);\n\n    String\
  \ action = getIntent().getAction();\n    if (Intent.ACTION_PICK.equals(action) ||\n\
  \              Intent.ACTION_GET_CONTENT.equals(action))\n   {\n        // 调用者正在等待我们返回用户选择的笔记。\n\
  \        // 他们已点击了其中一个，现在返回它。\n        setResult(RESULT_OK, new Intent().setData(uri));\n\
  \    } else {\n        // 启动 Activity 以查看/编辑当前选中的项目\n        startActivity(new Intent(Intent.ACTION_EDIT,\
  \ uri));\n    }\n}\n```\n\n\n\n### 执行 GET_CONTENT 操作\n\n`ACTION_GET_CONTENT` 与 `ACTION_PICK`\
  \ 类似。在使用 `ACTION_PICK` 时，你需要指定一个指向项目集合（例如笔记集合）的 URI。你期望该操作从集合中选取一个笔记并将其返回给调用者。而使用\
  \ `ACTION_GET_CONTENT` 时，你向 Android 表明你需要一个特定 MIME 类型的项目。Android 会搜索那些能够创建此类项目或能够从符合该\
  \ MIME 类型的现有项目集合中进行选择的活动。\n\n使用 `ACTION_GET_CONTENT`，你可以通过以下代码从 NotePad 应用支持的笔记集合中选取一个笔记：\n\
  \n```java\npublic static void invokeGetContent(Activity activity)\n{\n      Intent\
  \ pickIntent = new Intent(Intent.ACTION_GET_CONTENT);\n      int requestCode = 2;\n\
  \      pickIntent.setType(\"vnd.android.cursor.item/vnd.google.note\");\n      activity.startActivityForResult(pickIntent,\
  \ requestCode);\n}\n```\n\n请注意，这里的 intent 类型被设置为单个笔记的 MIME 类型。这与以下代码片段中的 `ACTION_PICK`\
  \ 形成对比，后者的输入是一个数据 URI：\n\n```java\npublic static void invokePick(Activity activity)\n\
  {\n  Intent pickIntent = new Intent(Intent.ACTION_PICK);\n  int requestCode = 1;\n\
  \  pickIntent.setData(Uri.parse(\n     \"content://com.google.provider.NotePad/notes\"\
  ));\n  activity.startActivityForResult(pickIntent, requestCode);\n}\n```\n\n为了让一个活动能够响应\
  \ `ACTION_GET_CONTENT`，该活动必须注册一个意图过滤器，表明它可以提供该 MIME 类型的项目。以下是 SDK 中 NotePad 应用的实现方式：\n\
  \n```xml\n<activity android:name=\"NotesList\" android:label=\"@string/title_notes_list\"\
  >\n......\n<intent-filter>\n    <action android:name=\"android.intent.action.GET_CONTENT\"\
  \ />\n    <category android:name=\"android.intent.category.DEFAULT\" />\n    <data\
  \ android:mimeType=\"vnd.android.cursor.item/vnd.google.note\" />\n      </intent-filter>\n\
  ......\n</activity>\n```\n\n响应 `onActivityResult()` 的其他代码与之前的 `ACTION_PICK` 示例完全相同。如果有多个活动可以返回相同的\
  \ MIME 类型，Android 会显示选择器对话框，让你选择一个活动。\n\n### 介绍待定 Intent\n\nAndroid 有一种 intent 的变体，称为\
  \ *待定 intent*。在这种变体中，Android 允许组件将 intent 存储在一个位置以供将来使用，并可以在之后再次调用。例如，在闹钟管理器中，你希望在闹钟响起时启动一个服务。Android\
  \ 通过围绕一个普通的对应 intent 创建一个包装后的待定 intent 并将其存储起来来实现这一点，这样即使调用进程终止，该 intent 仍然可以被分发到其目标。在创建待定\
  \ intent 时，Android 会存储关于原始进程的足够信息，以便在分发或调用时能够检查安全凭证。\n\n让我们看看如何创建一个待定 intent：\n\n\
  ```java\nIntent regularIntent;\nPendingIntent pi = PendingIntent.getActivity(context,\
  \ 0, regularIntent,...);\n```\n\n![Image](img/square.jpg) **注意：** `PendingIntent.getActivity()`\
  \ 方法的第二个参数被称为 `requestCode`，在本例中我们将其设置为 0。当两个底层 intent 相同时，这个参数用于区分这两个待定 intent。这一点在第\
  \ 20 章中讨论得更为详细，我们在那里将结合闹钟管理器来介绍待定 intent。\n\n关于 `PendingActivity.getActivity()`\
  \ 这个方法命名，有几个奇怪的地方。activity 在这里的作用是什么？为什么我们创建待定 intent 时不使用 `create`，而是使用 `get`？\n\
  \n要理解第一点，我们需要深入探讨一下普通 intent 的用法。一个普通 intent 可以用来启动一个 activity、一个服务，或者调用一个广播接收器。（你将在本书后面学习到服务和广播接收器。）使用\
  \ intent 调用这些不同类型的组件，其性质是不同的。为了适应这一点，Android 的上下文（`Activity` 的超类）提供了三种不同的方法：\n\n\
  - `startActivty(intent)`\n- `startService(intent)`\n- `sendBroadcast(intent)`\n\n\
  考虑到这些变体，如果我们要存储一个 intent 以供以后重用，Android 如何知道是启动 activity、启动服务，还是通过广播启动广播接收器呢？这就是为什么在创建待定\
  \ intent 时，我们必须明确指定创建它的目的，这也解释了以下三种独立的方法：\n\n- `PendingIntent.getActivity(context,\
  \ 0, intent, ...)`\n- `PendingIntent.getService(context, 0, intent, ...)`\n- `PendingIntent.getBroadcast(context,\
  \ 0, intent, ...)`\n\n现在来解释“get”这部分。Android 会存储 intent 并重用它们。如果你两次请求使用同一个 intent\
  \ 对象创建待定 intent，你将得到同一个待定 intent。看一下 `PendingIntent.getActivity()` 方法的完整签名，这一点就更清楚了：\n\
  \n```java\nPendingIntent.getActivity(Context context, //原始上下文\n     int requestCode,\
  \ //1,2, 3, 等\n     Intent intent, //原始 intent\n     int flags ) //标志\n```\n\n如果你的目标是获得一个不同的待定\
  \ intent 副本，你必须提供一个不同的 `requestCode`。我们在第 20 章中介绍闹钟管理器时会更详细地解释这一需求。如果两个 intent 的内部部分匹配（除了额外的\
  \ bundle 外），则它们被视为相同。允许额外的 bundle 不同，这不会影响 intent 的唯一性。如果你希望在两个其他方面相同的底层 intent\
  \ 之间强制实现唯一性，你可以改变请求代码参数的值。这将使得待定 intent 变得唯一，即使底层 intent 并不唯一。\n\n这些标志指示如果已存在一个待定\
  \ intent 时该如何处理——是否返回 null、覆盖 extras 等等。有关可能标志的更多详细信息，请参阅以下网址：\n\n`http://developer.android.com/reference/android/app/PendingIntent.html`\n\
  \n通常，你可以为 `requestCode` 和标志传递 0，以获得默认行为。\n\n\n\n### 资源\n\n以下是一些有助于加深本章内容理解的实用链接：\n\
  \n- [`http://developer.android.com/reference/android/content/Intent.html`](http://developer.android.com/reference/android/content/Intent.html)：意图概览，包括众所周知的动作、附加数据等。\n\
  - [`http://developer.android.com/guide/appendix/g-app-intents.html`](http://developer.android.com/guide/appendix/g-app-intents.html)：列出了针对一系列\
  \ Google 应用的意图。在这里，你将了解如何调用浏览器、地图、拨号器和谷歌街景。\n- [`http://developer.android.com/reference/android/content/IntentFilter.html`](http://developer.android.com/reference/android/content/IntentFilter.html)：介绍意图过滤器，在注册意图过滤器时非常有用。\n\
  - [`http://developer.android.com/guide/topics/intents/intents-filters.html`](http://developer.android.com/guide/topics/intents/intents-filters.html)：深入探讨意图过滤器的解析规则。\n\
  - [`http://developer.android.com/resources/samples/get.html`](http://developer.android.com/resources/samples/get.html)：可下载\
  \ NotePad 应用示例代码的网址。你需要加载这个示例项目来测试某些意图。\n- [`http://developer.android.com/resources/samples/NotePad/index.html`](http://developer.android.com/resources/samples/NotePad/index.html)：NotePad\
  \ 应用的在线源代码。\n- [`www.openintents.org/`](http://www.openintents.org/)：一个旨在收集各厂商开放意图的网站项目。\n\
  - [`www.androidbook.com/proandroid4/projects`](http://www.androidbook.com/proandroid4/projects)：本章的可下载测试项目可在此网址获取。ZIP\
  \ 文件名为 `ProAndroid4_ch05_TestIntents.zip`。\n\n### 摘要\n\n本章涵盖了关于意图的以下内容：\n\n- 隐式意图是动作、数据\
  \ URI 以及作为附加数据传递的显式数据的集合。\n- 显式意图是直接与类名相关联的意图，不考虑其前述部分中提到的隐式组成部分。\n- 你使用意图来调用 Android\
  \ 中的 Activity 或其他组件。\n- 诸如 Activity 之类的组件通过意图过滤器声明它们想要响应的意图。\n- 意图与意图过滤器之间的解析规则。\n\
  - 如何使用意图启动 Activity。\n- 如何启动返回结果的 Activity。\n- 意图类别的作用。\n- 默认类别的细微差别。\n- 什么是待定意图以及如何使用它们。\n\
  - 待定意图的独特性。\n- 如何使用 `PICK` 和 `GET_CONTENT` 动作。\n\n### 面试问题\n\n1.  如何使用意图调用 Activity？\n\
  2.  什么是显式意图和隐式意图？\n3.  意图由哪些组成部分构成？\n4.  如何通过意图将数据发送到接收组件？\n5.  你能说出 Android 应用中的主要组件吗？\n\
  6.  意图的数据部分是否直接包含数据？\n7.  意图的动作部分是否应直接引用一个 Activity 或组件？\n8.  当在意图中显式指定类名时，意图的哪些其他部分会被考虑？\n\
  9.  `action.MAIN` 的含义是什么？\n10. 如果你在意图过滤器中未指定动作，是否意味着你的 Activity 可以响应所有动作？\n11. 如果你在意图过滤器中未指定数据，你会匹配哪种类型的意图？\n\
  12. 为什么有必要在意图过滤器中为你的 Activity 设置一个默认类别？\n13. 你的启动器 Activity 是否需要默认类别？\n14. 如何调用一个可以向调用者返回结果的\
  \ Activity？\n15. 调用 Activity 最快的方式是什么？\n16. `action_pick` 和 `action_get_content`\
  \ 之间有什么区别？\n\n## 第 6 章\n\n## 构建用户界面与使用控件\n\n到目前为止，我们已经介绍了 Android 的基础知识，但尚未涉及用户界面（UI）。在本章中，我们将讨论用户界面和控件。我们首先讨论\
  \ Android 中 UI 开发的总体理念，然后描述 Android SDK 随附的许多 UI 控件。这些是构建你将创建的界面的基本元素。我们还将讨论视图适配器和布局管理器。视图适配器用于向显示数据集（无论这些数据来自数组、数据库还是其他数据源）的控件提供数据。顾名思义，布局管理器负责管理控件在屏幕上的位置。在此过程中，我们还将介绍样式和主题，它们有助于封装控件外观属性，以便于设置和维护。\n\
  \n到本章结束时，你将扎实掌握如何将 UI 控件布局到屏幕中，并为其填充数据。\n\n### Android 中的 UI 开发\n\nAndroid 中的 UI\
  \ 开发很有趣。之所以有趣，是因为它相对容易。借助 Android，我们拥有一个易于理解的框架，配备了一套数量有限的即用控件。可用的屏幕区域通常有限。Android\
  \ 还处理了通常与设计和构建高质量 UI 相关的许多繁重工作。这一点，再加上用户通常只想执行一个特定操作，使我们能够轻松构建良好的 UI，以提供良好的用户体验。\n\
  \nAndroid SDK 附带了许多控件，你可以使用它们为应用程序构建 UI。与其他 SDK 类似，Android SDK 提供文本字段、按钮、列表、网格等。此外，Android\
  \ 还提供了一系列适用于移动设备的控件。\n\n常见控件的核心是两个类：`android.view.View` 和 `android.view.ViewGroup`。正如第一个类的名称所示，`View`\
  \ 类代表一个通用的 `View` 对象。Android 中的常见控件最终都继承自 `View` 类。`ViewGroup` 也是一个视图，但它还包含其他视图。`ViewGroup`\
  \ 是一系列布局类的基类。与 Swing 类似，Android 使用*布局*的概念来管理控件在容器视图中的布局方式。使用布局，正如我们将看到的，可以让我们轻松控制\
  \ UI 中控件的位置和方向。\n\n你可以从几种方法中选择在 Android 中构建 UI。你可以完全在代码中构建 UI。你也可以在 XML 中定义 UI。你甚至可以结合使用两者——在\
  \ XML 中定义 UI，然后在代码中引用并修改它。为了演示这一点，在本章中，我们将使用这三种方法中的每一种来构建一个简单的 UI。\n\n在我们开始之前，让我们定义一些术语。在本书和其他\
  \ Android 文献中，你会在关于 UI 开发的讨论中看到术语 *视图*、*控件*、*微件*、*容器*和*布局*。如果你是 Android 编程或 UI 开发的新手，可能不熟悉这些术语。在开始之前，我们简要描述一下它们（请参见表\
  \ 6–1）。\n\n![图片](img/t0601.jpg)\n\n图 6–1 显示了我们即将构建的应用程序的截图。截图旁边是该应用程序中控件和容器的布局层次结构。\n\
  \n![图片](img/9781430239307_Fig06-01.jpg)\n\n**图 6–1.** *Activity 的 UI 和布局*\n\n在讨论示例程序时，我们将参考这个布局层次结构。现在，请知道该应用程序只有一个\
  \ Activity。该 Activity 的 UI 由三个容器组成：一个包含人名，一个包含地址，以及一个作为子容器外部父容器的容器。\n\n\n\n####\
  \ 完全通过代码构建 UI\n\n第一个示例代码清单 6–1 演示了如何完全通过代码构建 UI。要尝试此示例，请创建一个带名为 `MainActivity` 的\
  \ Activity 的新 Android 项目，然后将代码清单 6–1 中的代码复制到你的 `MainActivity` 类中。\n\n**注意：** 我们将在本章末尾提供一个\
  \ URL，你可以通过它下载本章的项目文件。这样，你可以直接将这些项目导入 Eclipse，而无需复制粘贴代码。\n\n**代码清单 6–1.** *完全通过代码创建简单的用户界面*\n\
  \n```\npackage com.androidbook.controls;\nimport android.app.Activity;\nimport android.os.Bundle;\n\
  import android.view.ViewGroup.LayoutParams;\nimport android.widget.LinearLayout;\n\
  import android.widget.TextView;\npublic class MainActivity extends Activity\n{\n\
      private LinearLayout nameContainer;\n\n    private LinearLayout addressContainer;\n\
  \n    private LinearLayout parentContainer;\n\n    /** 当 Activity 首次创建时调用。 */\n\
      @Override\n    public void onCreate(Bundle savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n\
  \n        createNameContainer();\n\n        createAddressContainer();\n\n        createParentContainer();\n\
  \n        setContentView(parentContainer);\n    }\n\n    private void createNameContainer()\n\
      {\n        nameContainer = new LinearLayout(this);\n\n        nameContainer.setLayoutParams(new\
  \ LayoutParams(LayoutParams.FILL_PARENT,\n                LayoutParams.WRAP_CONTENT));\n\
          nameContainer.setOrientation(LinearLayout.HORIZONTAL);\n\n        TextView\
  \ nameLbl = new TextView(this);\n        nameLbl.setText(\"姓名：\");\n\n        TextView\
  \ nameValue = new TextView(this);\n        nameValue.setText(\"张三\");\n\n        nameContainer.addView(nameLbl);\n\
          nameContainer.addView(nameValue);\n    }\n\n    private void createAddressContainer()\n\
      {\n        addressContainer = new LinearLayout(this);\n\n        addressContainer.setLayoutParams(new\
  \ LayoutParams(LayoutParams.FILL_PARENT,\n                LayoutParams.WRAP_CONTENT));\n\
          addressContainer.setOrientation(LinearLayout.VERTICAL);\n\n        TextView\
  \ addrLbl = new TextView(this);\n        addrLbl.setText(\"地址：\");\n\n        TextView\
  \ addrValue = new TextView(this);\n        addrValue.setText(\"好莱坞大道 911 号\");\n\
  \n        addressContainer.addView(addrLbl);\n        addressContainer.addView(addrValue);\n\
      }\n\n    private void createParentContainer()\n    {\n        parentContainer\
  \ = new LinearLayout(this);\n\n        parentContainer.setLayoutParams(new LayoutParams(LayoutParams.FILL_PARENT,\n\
                  LayoutParams.FILL_PARENT));\n        parentContainer.setOrientation(LinearLayout.VERTICAL);\n\
  \n        parentContainer.addView(nameContainer);\n        parentContainer.addView(addressContainer);\n\
      }\n}\n```\n\n如代码清单 6–1 所示，该 Activity 包含三个 `LinearLayout` 对象。正如我们之前提到的，布局对象包含在屏幕部分区域定位子元素的逻辑。例如，`LinearLayout`\
  \ 知道如何垂直或水平排列控件。布局对象可以包含任何类型的视图（View），甚至可以包含其他布局。\n\n`nameContainer` 对象包含两个 `TextView`\
  \ 控件：一个用于标签`姓名：`，另一个用于保存实际姓名（例如张三）。`addressContainer` 也包含两个 `TextView` 控件。这两个容器的区别在于：`nameContainer`\
  \ 是水平布局，而 `addressContainer` 是垂直布局。这两个容器都位于 Activity 的根视图 `parentContainer` 内部。构建容器后，Activity\
  \ 通过调用 `setContentView(parentContainer)` 将视图内容设置为根视图。当需要渲染 Activity 的 UI 时，根视图会被调用以渲染自身。然后根视图调用其子视图进行渲染，子控件再调用它们的子视图，依此类推，直到整个\
  \ UI 渲染完成。\n\n如代码清单 6–1 所示，我们有多个 `LinearLayout` 控件。其中两个是垂直布局，一个是水平布局。`nameContainer`\
  \ 是水平布局，这意味着两个 `TextView` 控件会水平并排显示。`addressContainer` 是垂直布局，这意味着两个 `TextView` 控件会上下堆叠。`parentContainer`\
  \ 也是垂直布局，因此 `nameContainer` 出现在 `addressContainer` 上方。请注意 `addressContainer` 和 `parentContainer`\
  \ 这两个垂直布局容器之间的细微差别。`parentContainer` 设置为占据屏幕的全部宽度和高度：\n\n```\nparentContainer.setLayoutParams(new\
  \ LayoutParams(LayoutParams.FILL_PARENT,\n        LayoutParams.FILL_PARENT));\n\
  ```\n\n而 `addressContainer` 则垂直方向自适应内容：\n\n```\naddressContainer.setLayoutParams(new\
  \ LayoutParams(LayoutParams.FILL_PARENT,\n        LayoutParams.WRAP_CONTENT));\n\
  ```\n\n换句话说，`WRAP_CONTENT` 表示视图在该维度上仅占用所需的空间，不超过父视图允许的范围。对于 `addressContainer` 而言，这意味着该容器会垂直占据两行高度，因为它只需要这么多。\n\
  \n\n\n#### 完全在 XML 中构建用户界面\n\n现在让我们用 XML 构建相同的用户界面（参见代码清单 6–2）。回顾第 3 章的内容，XML 布局文件存储在资源（`/res/`）目录下的\
  \ `layout` 文件夹中。要尝试这个示例，请在 Eclipse 中创建一个新的 Android 项目。默认情况下，你会得到一个名为 `main.xml`\
  \ 的 XML 布局文件，位于 `res/layout` 文件夹下。双击 `main.xml` 查看其内容。Eclipse 会为你的布局文件显示一个可视化编辑器。在视图顶部可能会显示类似\
  \ “Hello World, MainActivity!” 的字符串。点击视图底部的 `main.xml` 标签，即可查看 `main.xml` 文件的 XML\
  \ 代码。其中会显示一个 `LinearLayout` 和一个 `TextView` 控件。使用布局标签或 `main.xml` 标签（或两者同时使用），在 `main.xml`\
  \ 文件中重新创建代码清单 6–2 的内容。然后保存文件。\n\n**代码清单 6–2.** *完全在 XML 中创建用户界面*\n\n```\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<LinearLayout\n    android:orientation=\"vertical\"\
  \ android:layout_width=\"fill_parent\"\n    android:layout_height=\"fill_parent\"\
  >\n    <!-- 姓名容器 -->\n    <LinearLayout\n        android:orientation=\"horizontal\"\
  \ android:layout_width=\"fill_parent\"\n        android:layout_height=\"wrap_content\"\
  >\n\n            <TextView  android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\" android:text=\"姓名:\" />\n\n            <TextView android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\" android:text=\"张三\"\
  \ />\n\n    </LinearLayout>\n\n    <!-- 地址容器 -->\n    <LinearLayout\n        android:orientation=\"\
  vertical\" android:layout_width=\"fill_parent\"\n        android:layout_height=\"\
  wrap_content\">\n\n            <TextView android:layout_width=\"fill_parent\"\n\
          android:layout_height=\"wrap_content\" android:text=\"地址:\" />\n\n            <TextView\
  \ android:layout_width=\"fill_parent\"\n        android:layout_height=\"wrap_content\"\
  \ android:text=\"好莱坞大道 911 号\" />\n    </LinearLayout>\n\n</LinearLayout>\n```\n\
  \n在你的新项目的 `src` 目录下，有一个默认的 `.java` 文件，其中包含一个 `Activity` 类定义。双击该文件查看其内容。请注意 `setContentView(R.layout.main)`\
  \ 这条语句。代码清单 6–2 中展示的 XML 代码片段，结合对 `setContentView(R.layout.main)` 的调用，会渲染出与之前完全用代码生成的相同的用户界面。该\
  \ XML 文件一目了然，但请注意我们定义了三个容器视图。第一个 `LinearLayout` 相当于我们的父容器。该容器通过设置相应属性 `android:orientation=\"\
  vertical\"` 将方向设为垂直。父容器包含两个 `LinearLayout` 容器，分别代表 `nameContainer` 和 `addressContainer`。\n\
  \n运行此应用程序将产生与之前示例应用程序相同的用户界面。标签和值将如图 6–1 所示显示。\n\n#### 在 XML 中结合代码构建用户界面\n\n代码清单\
  \ 6–2 是一个刻意构造的示例。在 XML 布局中对 `TextView` 控件的值进行硬编码没有任何意义。理想情况下，我们应该在 XML 中设计用户界面，然后从代码中引用这些控件。这种方法使我们能够将动态数据绑定到设计时定义的控件上。事实上，这也是推荐的做法。在\
  \ XML 中构建布局，然后使用代码填充动态数据，是相当容易的。\n\n代码清单 6–3 展示了相同的用户界面，但使用了略有不同的 XML 代码。该 XML 为\
  \ `TextView` 控件分配了 ID，以便我们可以在代码中引用它们。\n\n**代码清单 6–3.** *在 XML 中使用 ID 创建用户界面*\n\n\
  ```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\n    android:orientation=\"\
  vertical\" android:layout_width=\"fill_parent\"\n    android:layout_height=\"fill_parent\"\
  >\n    <!-- 姓名容器 -->\n    <LinearLayout\n        android:orientation=\"horizontal\"\
  \ android:layout_width=\"fill_parent\"\n        android:layout_height=\"wrap_content\"\
  >\n\n            <TextView android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\" android:text=\"@string/name_text\" />\n\n            <TextView android:id=\"\
  @+id/nameValue\"\n        android:layout_width=\"wrap_content\" android:layout_height=\"\
  wrap_content\" />\n\n</LinearLayout>\n\n    <!-- 地址容器 -->\n    <LinearLayout\n        android:orientation=\"\
  vertical\" android:layout_width=\"fill_parent\"\n        android:layout_height=\"\
  wrap_content\">\n\n            <TextView android:layout_width=\"fill_parent\"\n\
          android:layout_height=\"wrap_content\" android:text=\"@string/addr_text\"\
  \ />\n\n            <TextView android:id=\"@+id/addrValue\"\n        android:layout_width=\"\
  fill_parent\" android:layout_height=\"wrap_content\" />\n    </LinearLayout>\n\n\
  </LinearLayout>\n```\n\n除了为想要通过代码填充内容的 `TextView` 控件添加 ID 之外，我们还有一些标签 `TextView`\
  \ 控件，它们的内容来自字符串资源文件。这些是没有 ID 但带有 `android:text` 属性的 `TextView`。正如第 3 章中提到的，这些 `TextView`\
  \ 的实际字符串将来自 `/res/values` 文件夹中的 `strings.xml` 文件。代码清单 6–4 展示了我们的 `strings.xml` 文件可能的样子。\n\
  \n**代码清单 6–4.** *用于代码清单 6–3 的`strings.xml` 文件*\n\n```\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<resources>\n    <string name=\"app_name\">公共控件</string>\n    <string\
  \ name=\"name_text\">姓名:</string>\n    <string name=\"addr_text\">地址:</string>\n\
  </resources>\n```\n\n代码清单 6–5 中的代码演示了如何获取对 XML 中定义的控件的引用以设置其属性。你可以将此代码放入 Activity\
  \ 的 `onCreate()` 方法中。\n\n**代码清单 6–5.** *在运行时引用资源中的控件*\n\n```\nsetContentView(R.layout.main);\n\
  \nTextView nameValue = (TextView)findViewById(R.id.nameValue);\nnameValue.setText(\"\
  张三\");\nTextView addrValue = (TextView)findViewById(R.id.addrValue);\naddrValue.setText(\"\
  好莱坞大道 911 号\");\n```\n\n代码清单 6–5 中的代码非常直接，但请注意，我们在调用 `findViewById()` 之前先通过 `setContentView(R.layout.main)`\
  \ 加载了资源——如果视图尚未加载，我们就无法获取对它们的引用。\n\nAndroid 的开发者们做得非常出色，几乎控件的每一个方面都可以通过 XML 或代码进行设置。通常，最好在\
  \ XML 布局文件中设置控件的属性，而不是使用代码。然而，很多时候你仍需要使用代码，例如设置要显示给用户的值。\n\n\n\n### FILL_PARENT\
  \ 与 MATCH_PARENT\n\n常量 `FILL_PARENT` 已在 Android 2.2 中被弃用，并替换为 `MATCH_PARENT`。但这纯粹是名称上的更改。该常量的值仍然是\
  \ -1。同样，在 XML 布局中，`fill_parent` 也被替换为 `match_parent`。那么你应该使用哪个值呢？实际上，你可以直接使用值 -1，而不用\
  \ `FILL_PARENT` 或 `MATCH_PARENT`，这也完全可行。不过，这样可读性不高，而且你无法在 XML 布局中使用无名称的等效值。有一个更好的方法。\n\
  \n根据你的应用需要使用哪些 Android API，你可以选择针对 Android 2.2 之前的版本构建应用，依赖前向兼容性；或者针对 Android 2.2\
  \ 及更高版本构建应用，并将 `minSdkVersion` 设置为你应用支持的最低 Android 版本。例如，如果你只需要 Android 1.6 中已有的\
  \ API，那么就针对 Android 1.6 构建，并使用 `FILL_PARENT` 和 `fill_parent`。你的应用应该能在包括 2.2 及更高版本在内的所有后续\
  \ Android 版本中正常运行。如果你需要使用 Android 2.2 或更高版本的 API，那就针对该版本构建，使用 `MATCH_PARENT` 和 `match_parent`，并将\
  \ `minSdkVersion` 设置为一个更低的版本：例如 `4`（对应 Android 1.6）。你仍然可以将基于 Android 2.2 构建的应用部署到更早的\
  \ Android 版本上，但你必须谨慎处理那些在早期 Android SDK 中不存在的类和/或方法。有一些方法可以解决这个问题，比如使用反射或创建包装类来处理不同\
  \ Android 版本之间的差异。我们将在第 12 章中深入探讨这些高级主题。\n\n### 理解 Android 的常用控件\n\n现在我们将开始讨论 Android\
  \ SDK 中的常用控件。我们首先介绍文本控件，然后介绍按钮、复选框、单选按钮、列表、网格、日期和时间控件，以及地图视图控件。我们还会谈到布局控件。\n\n####\
  \ 文本控件\n\n文本控件很可能是你在 Android 中会接触到的第一类控件。Android 提供了一套完整但不复杂的文本控件。在本节中，我们将讨论 `TextView`、`EditText`、`AutoCompleteTextView`\
  \ 和 `MultiCompleteTextView` 控件。图 6–2 展示了这些控件的实际效果。\n\n![Image](img/9781430239307_Fig06-02.jpg)\n\
  \n**图 6–2.** *Android 中的文本控件*\n\n##### TextView\n\n你已经在代码清单 6–3 中看到了一个简单的 `TextView`\
  \ 控件的 XML 定义，以及在代码清单 6–4 中看到了如何在代码中处理 `TextView`。注意我们如何在 XML 中指定 ID、宽度、高度和文本值，以及如何使用\
  \ `setText()` 方法设置值。`TextView` 控件能够显示文本，但不允许编辑。这可能会让你认为该控件本质上只是一个静态标签。事实并非如此。`TextView`\
  \ 控件有一些有趣的属性，使其非常实用。例如，如果你知道 `TextView` 的内容将包含网址或电子邮件地址，你可以将 `autoLink` 属性设置为 `email|web`，控件就会自动查找并高亮显示所有电子邮件地址和网址。而且，当用户点击这些高亮项之一时，系统会自动启动电子邮件应用并填入该地址，或者用该网址启动浏览器。在\
  \ XML 中，这个属性应放在 `TextView` 标签内，看起来像这样：\n\n```\n<TextView   ...     android:autoLink=\"\
  email|web\"    ...    />\n```\n\n你可以指定一组以竖线分隔的值，包括 `web`、`email`、`phone` 或 `map`，或者使用\
  \ `none`（默认值）或 `all`。如果你想在代码中设置 `autoLink` 行为而不是使用 XML，相应的方法调用是 `setAutoLinkMask()`。你需要传入一个\
  \ `int` 值，表示类似之前的值的组合，例如 `Linkify.EMAIL_ADDRESSES|Linkify.WEB_ADDRESSES`。为了实现此功能，`TextView`\
  \ 使用了 `android.text.util.Linkify` 类。代码清单 6–6 展示了在代码中实现自动链接的示例。\n\n**代码清单 6–6.**\
  \ *在 TextView 中对文本使用 Linkify*\n\n```\nTextView tv =(TextView)this.findViewById(R.id.tv);\n\
  tv.setAutoLinkMask(Linkify.ALL);\ntv.setText(\"请访问我的网站 http://www.androidbook.com\n\
  或发邮件至 davemac327@gmail.com。\");\n```\n\n请注意，我们在设置文本之前先设置了 `TextView` 的自动链接选项。这一点很重要，因为如果在设置文本之后再设置自动链接选项，它不会影响已有的文本。由于我们使用代码为文本添加超链接，代码清单\
  \ 6–6 中 `TextView` 的 XML 不需要任何特殊属性，可以像下面这样简单：\n\n```\n<TextView android:id=\"@+id/tv\"\
  \ android:layout_width=\"wrap_content\"\n  android:layout_height=\"wrap_content\"\
  />\n```\n\n如果你愿意，你也可以调用 `Linkify` 类的静态方法 `addLinks()`，按需查找并添加链接到任何 `TextView` 或任何\
  \ `Spannable` 的内容中。除了使用 `setAutoLinkMask()`，我们还可以在*设置文本之后*执行以下操作：\n\n```\nLinkify.addLinks(tv,\
  \ Linkify.ALL);\n```\n\n点击链接会触发该操作对应的默认 Intent。例如，点击网址会启动浏览器并打开该网址。点击电话号码会启动拨号程序，以此类推。`Linkify`\
  \ 类可以直接执行这些工作。\n\n`Linkify` 还能检测您想要查找的自定义模式，判断它们是否匹配你需要设为可点击的内容，并设置如何触发 Intent，从而使点击转化为某种操作。我们在此不深入讨论这些细节，但你需要知道这些功能是可以实现的。\n\
  \n`TextView` 还有许多其他特性值得探索，从字体属性到 `minLines` 和 `maxLines` 等等。这些特性都比较直观，建议你自行尝试，看看如何利用它们。不过需要记住的是，`TextView`\
  \ 类中的某些功能并不适用于只读字段，这些功能是为 `TextView` 的子类准备的，我们接下来将介绍其中一个子类。\n\n\n\n##### `EditText`\n\
  \n`EditText`控件是`TextView`的子类。顾名思义，`EditText`控件允许文本编辑。`EditText`虽然不如互联网上常见的文本编辑控件强大，但\
  \ Android 设备的用户通常不会编写文档——他们最多只会输入几段文字。因此，该类具有有限但合适的功能，甚至可能会让你感到惊讶。例如，`EditText`最重要的属性之一是`inputType`。你可以将`inputType`属性设置为`textAutoCorrect`，让控件纠正常见的拼写错误。你可以将其设置为`textCapWords`，让控件将单词首字母大写。其他选项则只接受电话号码或密码。\n\
  \n有一些较旧且现已弃用的方式来指定首字母大写、多行文本和其他功能。如果这些是在没有`inputType`属性的情况下指定的，它们仍然可以被读取；但如果指定了`inputType`，这些较旧的属性将被忽略。\n\
  \n`EditText`控件以前的默认行为是在一行上显示文本，并根据需要扩展。换句话说，如果用户输入超过第一行，则会显示另一行，依此类推。但是，你可以通过将`singleLine`属性设置为`true`来强制用户单行输入。在这种情况下，用户必须继续在同一行上输入。对于`inputType`，如果你不指定`textMultiLine`，`EditText`将默认为仅单行。因此，如果你想要旧的多行输入默认行为，则需要将`inputType`指定为`textMultiLine`。\n\
  \n`EditText`的一个优秀功能是你可以指定提示文本。该文本会以略微淡化的方式显示，并在用户开始输入文本时立即消失。提示的目的是让用户知道该字段中期望输入的内容，而无需用户选择并擦除默认文本。在\
  \ XML 中，此属性是`android:hint=\"your hint text here\"`或`android:hint=\"@string/your_hint_name\"\
  `，其中`your_hint_name`是要在`/res/values/strings.xml`中找到的字符串资源名称。在代码中，你可以调用`setHint()`方法，并传入`CharSequence`或资源\
  \ ID。\n\n##### `AutoCompleteTextView`\n\n`AutoCompleteTextView`控件是一个具有自动完成功能的`TextView`。换句话说，当用户在`TextView`中输入时，控件可以显示建议供选择。清单\
  \ 6–7 演示了使用 XML 和相应代码的`AutoCompleteTextView`控件。\n\n**清单 6–7.** *使用 AutoCompleteTextView\
  \ 控件*\n\n```xml\n<AutoCompleteTextView android:id=\"@+id/actv\"\n    android:layout_width=\"\
  fill_parent\"  android:layout_height=\"wrap_content\" />\n```\n\n```java\nAutoCompleteTextView\
  \ actv = (AutoCompleteTextView) this.findViewById(R.id.actv);\n\nArrayAdapter<String>\
  \ aa = new ArrayAdapter<String>(this,\n                android.R.layout.simple_dropdown_item_1line,\n\
  \                new String[] {\"English\", \"Hebrew\", \"Hindi\", \"Spanish\",\n\
  \                \"German\", \"Greek\" });\n\nactv.setAdapter(aa);\n```\n\n清单 6–7\
  \ 中显示的`AutoCompleteTextView`控件会向用户推荐一种语言。例如，如果用户输入`en`，控件会建议 English。如果用户输入`gr`，控件会推荐\
  \ Greek，以此类推。\n\n如果你使用过建议控件或类似的自动完成控件，你就会知道这类控件由两部分组成：一个文本视图控件和一个用于显示建议的控件。这就是基本概念。要使用此类控件，你需要创建控件、创建建议列表、将建议列表告知控件，并且可能还需要告知控件如何显示建议。或者，你也可以为建议创建第二个控件，然后将两个控件关联起来。\n\
  \nAndroid 简化了这一过程，从清单 6–7 中可以明显看出。要使用`AutoCompleteTextView`，你可以在布局文件中定义该控件，并在 Activity\
  \ 中引用它。然后，你创建一个包含建议的适配器类，并定义将显示建议的控件 ID（在本例中，是一个简单的列表项）。在清单 6–7 中，`ArrayAdapter`的第二个参数告诉适配器使用一个简单的列表项来显示建议。最后一步是使用`setAdapter()`方法将适配器与`AutoCompleteTextView`关联起来。暂时不用担心适配器；我们将在本章后面部分介绍它们。\n\
  \n##### `MultiAutoCompleteTextView`\n\n如果你使用过`AutoCompleteTextView`控件，就会知道该控件仅对文本视图中的**全部**文本提供建议。换句话说，如果你输入一个句子，你不会得到每个单词的建议。这就是`MultiAutoCompleteTextView`的用武之地。你可以使用`MultiAutoCompleteTextView`在用户输入时提供建议。例如，图\
  \ 6–2 显示用户键入了单词`English`，后跟一个逗号，然后键入了`Ge`，这时控件建议了 German。如果用户继续输入，控件将提供更多建议。\n\n\
  使用`MultiAutoCompleteTextView`与使用`AutoCompleteTextView`类似。不同之处在于，你必须告诉控件从哪里开始重新提供建议。例如，在图\
  \ 6–2 中，你可以看到控件可以在句子开头以及识别到逗号之后提供建议。`MultiAutoCompleteTextView`控件要求你提供一个标记器（tokenizer），它可以解析句子并告知控件是否需要重新开始建议。清单\
  \ 6–8 演示了使用 XML 和 Java 代码的`MultiAutoCompleteTextView`控件。\n\n**清单 6–8.** *使用 MultiAutoCompleteTextView\
  \ 控件*\n\n```xml\n<MultiAutoCompleteTextView android:id=\"@+id/mactv\"\n    android:layout_width=\"\
  fill_parent\"  android:layout_height=\"wrap_content\" />\n```\n\n```java\nMultiAutoCompleteTextView\
  \ mactv = (MultiAutoCompleteTextView) this\n                .findViewById(R.id.mactv);\n\
  ArrayAdapter<String> aa2 = new ArrayAdapter<String>(this,\n                android.R.layout.simple_dropdown_item_1line,\n\
  new String[] {\"English\", \"Hebrew\", \"Hindi\", \"Spanish\", \"German\", \"Greek\"\
  \ });\n\nmactv.setAdapter(aa2);\n\nmactv.setTokenizer(new MultiAutoCompleteTextView.CommaTokenizer());\n\
  ```\n\n清单 6–7 和 6–8 之间唯一显著的区别在于使用了`MultiAutoCompleteTextView`以及调用了`setTokenizer()`方法。由于本例中使用了`CommaTokenizer`，当在`EditText`字段中输入逗号后，该字段将再次使用字符串数组提供建议。输入的其他任何字符都不会触发该字段提供建议。所以，即使你输入了`French\
  \ Spani`，部分单词`Spani`也不会触发建议，因为它没有跟在逗号后面。Android 还提供了另一个用于电子邮件地址的标记器，叫做`Rfc822Tokenizer`。如果你愿意，也可以随时创建自己的标记器。\n\
  \n### Button 控件\n\n按钮在任何小部件工具包中都很常见，Android 也不例外。Android 提供了典型的按钮集以及一些额外的功能。在本节中，我们将讨论三种类型的按钮控件：基本按钮、图像按钮和开关按钮。图\
  \ 6–3 展示了包含这些控件的用户界面。最上面的按钮是基本按钮，中间的按钮是图像按钮，最后一个是开关按钮。\n\n![Image](img/9781430239307_Fig06-03.jpg)\n\
  \n**图 6–3.** *Android 按钮控件*\n\n让我们从基本按钮开始。\n\n\n\n#### 按钮控件\n\nAndroid 中的基本按钮类是\
  \ `android.widget.Button`。这种按钮除了用于处理点击事件之外，并没有太多特别之处。代码清单 6–9 展示了 `Button` 控件的 XML\
  \ 布局片段，以及我们可能要在 Activity 的 `onCreate()` 方法中设置的一些 Java 代码。我们的基本按钮将类似于图 6–3 中顶部的按钮。\n\
  \n**代码清单 6–9.** *处理按钮上的点击事件*\n\n```\n<Button android:id=\"@+id/button1\"\n    android:text=\"\
  @string/basicBtnLabel\"\n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"\
  wrap_content\" />\n```\n\n```\nButton button1 = (Button)this.findViewById(R.id.button1);\n\
  button1.setOnClickListener(new OnClickListener()\n{\n     public void onClick(View\
  \ v)\n     {\n        Intent intent = new Intent(Intent.ACTION_VIEW,\n         \
  \                       Uri.parse(\"http://www.androidbook.com\"));\n        startActivity(intent);\n\
  \     }\n});\n```\n\n代码清单 6–9 展示了如何注册按钮点击事件。通过使用 `OnClickListener` 调用 `setOnClickListener()`\
  \ 方法来注册点击事件。在代码清单 6–9 中，动态创建了一个匿名监听器来处理 `button1` 的点击事件。当按钮被点击时，会调用监听器的 `onClick()`\
  \ 方法，在本例中，它会启动浏览器访问我们的网站。\n\n自 Android SDK 1.6 起，有一种更简单的方法来为按钮设置点击处理器。代码清单 6–10\
  \ 显示了一个 `Button` 的 XML，其中为处理器指定了一个属性，以及作为点击处理器的 Java 代码。\n\n**代码清单 6–10.** *设置按钮的点击处理器*\n\
  \n```\n<Button   ...    android:onClick=\"myClickHandler\"    ...  />\n```\n\n```\n\
  \    public void myClickHandler(View target) {\n        switch(target.getId()) {\n\
  \        case R.id.button1:\n        ...\n```\n\n处理器方法被调用时，`target` 参数会被设置为代表被点击按钮的\
  \ `View` 对象。注意点击处理器方法中的 `switch` 语句是如何使用按钮的资源 ID 来选择要执行的逻辑的。使用这种方法意味着你无需在代码中显式创建每个\
  \ `Button` 对象，并且可以在多个按钮之间复用同一个方法。这使代码更易于理解和维护。这种方法也适用于其他按钮类型。\n\n#### ImageButton\
  \ 控件\n\nAndroid 通过 `android.widget.ImageButton` 提供了图片按钮。使用图片按钮与使用基本按钮类似（参见代码清单 6–11）。我们的图片按钮将类似于图\
  \ 6–3 中中间的按钮。\n\n**代码清单 6–11.** *使用 `ImageButton`*\n\n```\n<ImageButton android:id=\"\
  @+id/imageButton2\"\n    android:layout_width=\"wrap_content\" android:layout_height=\"\
  wrap_content\"\n    android:onClick=\"myClickHandler\"\n    android:src=\"@drawable/icon\"\
  \  />\n```\n\n```\nImageButton imageButton2 = (ImageButton)this.findViewById(R.id.imageButton2);\n\
  imageButton2.setImageResource(R.drawable.icon);\n```\n\n这里我们在 XML 中创建了图片按钮，并从可绘制资源中设置了按钮的图片。按钮的图片文件必须存在于\
  \ `/res/drawable` 目录下。在我们的例子中，只是简单地复用了 Android 图标作为按钮图片。我们还在代码清单 6–11 中展示了如何通过调用按钮的\
  \ `setImageResource()` 方法并传入资源 ID，来动态设置按钮的图片。请注意，你只需执行其中一种方式，无需同时在 XML 文件和代码中指定按钮图片。\n\
  \n图片按钮的一个不错特性是，你可以为按钮指定透明背景。这样就会得到一个可点击的图片，它像按钮一样工作，但外观可以随心所欲。只需为图片按钮设置 `android:background=\"\
  @null\"` 即可。\n\n由于你的图片可能与标准按钮截然不同，你可以自定义按钮在 UI 中使用的另外两种状态下的外观。除了正常显示外，按钮可以拥有焦点（focus），也可以被按下（pressed）。拥有**焦点**仅仅意味着按钮当前是事件的目标。例如，你可以使用键盘或方向键上的箭头键将焦点引导到按钮上。**按下**则意味着按钮在被按下后、用户松开之前，其外观会发生变化。为了告诉\
  \ Android 按钮的三个状态分别对应哪张图片，我们设置了一个选择器。这是一个简单的 XML 文件，位于项目的 `/res/drawable` 文件夹中。这有点违反直觉，因为它是一个\
  \ XML 文件而不是图片文件，但选择器文件必须放在那里。选择器文件的内容将类似于代码清单 6–12。\n\n**代码清单 6–12.** *在 ImageButton\
  \ 中使用选择器*\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n    <selector >\n\
  \     <item android:state_pressed=\"true\"\n           android:drawable=\"@drawable/button_pressed\"\
  \ /> <!-- 按下 -->\n     <item android:state_focused=\"true\"\n           android:drawable=\"\
  @drawable/button_focused\" /> <!-- 聚焦 -->\n     <item android:drawable=\"@drawable/icon\"\
  \ /> <!-- 默认 -->\n    </selector>\n```\n\n关于选择器文件，有几点需要注意。首先，不要像在 values XML 文件中那样指定\
  \ `<resources>` 标签。其次，按钮图片的顺序很重要。Android 会按顺序测试选择器中的每个项目，看是否匹配。因此，你希望正常图片放在最后，这样只有按钮既未被按下也未获得焦点时才会使用它。如果正常图片被列在第一位，那么即使按钮被按下或获得焦点，它也会始终匹配并被选中。当然，你引用的可绘制资源必须存在于\
  \ `/res/drawables` 文件夹中。在布局 XML 文件中定义按钮时，你需要将 `android:src` 属性设置为选择器 XML 文件，就像它是一个普通可绘制资源一样，如下所示：\n\
  \n```\n<Button   ...    android:src=\"@drawable/imagebuttonselector\"    ...   />\n\
  ```\n\n#### ToggleButton 控件\n\n`ToggleButton` 控件，类似于复选框或单选按钮，是一个双状态按钮。此按钮可以处于“开”或“关”状态。如图\
  \ 6–3 所示，`ToggleButton` 的默认行为是在“开”状态下显示绿色条，在“关”状态下显示灰色条。此外，默认行为还会将按钮的文本设置为“开”（On）或“关”（Off）。如果“开/关”不适用于你的应用程序，你可以修改\
  \ `ToggleButton` 的文本。例如，如果你有一个希望通过 `ToggleButton` 启动和停止的后台进程，你可以使用 `android:textOn`\
  \ 和 `android:textOff` 属性将按钮文本设置为“停止”和“运行”。\n\n代码清单 6–13 展示了一个示例。我们的切换按钮是图 6–3 中底部的按钮，它处于“开”位置，因此按钮上的标签显示为“停止”。\n\
  \n**代码清单 6–13.** *Android 的 `ToggleButton`*\n\n```\n<ToggleButton android:id=\"\
  @+id/cctglBtn\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"  \n        android:text=\"Toggle Button\"\n        android:textOn=\"\
  Stop\"  \n        android:textOff=\"Run\"/>\n```\n\n由于 `ToggleButton` 将开和关文本作为单独的属性，因此\
  \ `ToggleButton` 的 `android:text` 属性实际上并未被使用。该属性存在是因为它是继承自 `TextView` 的，但在这种情况下，你无需使用它。\n\
  \n\n\n#### `CheckBox` 控件\n\n`CheckBox` 控件是另一种双状态按钮，允许用户切换其状态。不同之处在于，在许多情况下，用户并不将其视为可立即触发操作的按钮。然而，从\
  \ Android 的角度来看，它仍然是一个按钮，你可以对复选框执行任何可以对按钮执行的操作。\n\n在 Android 中，你可以通过创建 `android.widget.CheckBox`\
  \ 的实例来创建复选框。请参见清单 6–14 和图 6–4。\n\n**清单 6–14.** *创建复选框*\n\n```\n<LinearLayout\n \
  \       android:orientation=\"vertical\" android:layout_width=\"fill_parent\"\n\
  \        android:layout_height=\"fill_parent\">\n\n<CheckBox android:id=\"@+id/chickenCB\"\
  \  android:text=\"Chicken\" android:checked=\"true\"\n    android:layout_width=\"\
  wrap_content\" android:layout_height=\"wrap_content\" />\n\n<CheckBox android:id=\"\
  @+id/fishCB\"  android:text=\"Fish\"\n    android:layout_width=\"wrap_content\"\
  \ android:layout_height=\"wrap_content\" />\n\n<CheckBox android:id=\"@+id/steakCB\"\
  \  android:text=\"Steak\" android:checked=\"true\"\n    android:layout_width=\"\
  wrap_content\" android:layout_height=\"wrap_content\" />\n\n</LinearLayout>\n```\n\
  \n![Image](img/9781430239307_Fig06-04.jpg)\n\n**图 6–4.** *使用 `CheckBox` 控件*\n\n\
  你可以通过调用 `setChecked()` 或 `toggle()` 来管理复选框的状态。你可以通过调用 `isChecked()` 来获取其状态。\n\n\
  如果你需要在复选框被选中或取消选中时实现特定逻辑，你可以通过调用 `setOnCheckedChangeListener()` 并传入 `OnCheckedChangeListener`\
  \ 接口的实现来注册 `on-checked` 事件。然后，你需要实现 `onCheckedChanged()` 方法，该方法将在复选框被选中或取消选中时被调用。清单\
  \ 6–15 展示了一些处理 `CheckBox` 的代码。\n\n**清单 6–15.** *在代码中使用复选框*\n\n```\npublic class\
  \ CheckBoxActivity extends Activity {\n        /** Called when the activity is first\
  \ created. */\n        @Override\n        public void onCreate(Bundle savedInstanceState)\
  \ {\n            super.onCreate(savedInstanceState);\n            setContentView(R.layout.checkbox);\n\
  \n            CheckBox fishCB = (CheckBox)findViewById(R.id.fishCB);\n\n       \
  \     if(fishCB.isChecked())\n                fishCB.toggle();     // flips the\
  \ checkbox to unchecked if it was checked\n\n            fishCB.setOnCheckedChangeListener(\n\
  \                        new CompoundButton.OnCheckedChangeListener() {\n\n    \
  \            @Override\n                public void onCheckedChanged(CompoundButton\
  \ arg0, boolean isChecked) {\n                    Log.v(\"CheckBoxActivity\", \"\
  The fish checkbox is now \"\n                            + (isChecked?\"checked\"\
  :\"not checked\"));\n                }});\n        }\n}\n```\n\n设置 `OnCheckedChangeListener`\
  \ 的好处在于，你会直接接收到 `CheckBox` 按钮的新状态。你也可以像使用基本按钮那样使用 `OnClickListener` 技术。当调用 `onClick()`\
  \ 方法时，你需要通过适当的类型转换来获取按钮的新状态，然后在其上调用 `isChecked()`。清单 6–16 展示了如果我们为 `CheckBox` 按钮的\
  \ XML 定义添加了 `android:onClick=\"myClickHandler\"`，代码可能的样子。\n\n**清单 6–16.** *在代码中使用复选框（结合\
  \ `android:onClick`）*\n\n```\npublic void myClickHandler(View view) {\n    switch(view.getId())\
  \ {\n    case R.id.steakCB:\n        Log.v(\"CheckBoxActivity\", \"The steak checkbox\
  \ is now \" +\n                (((CheckBox)view).isChecked()?\"checked\":\"not checked\"\
  ));\n    }\n}\n```\n\n#### `RadioButton` 控件\n\n`RadioButton` 控件是任何 UI 工具包中不可或缺的一部分。单选按钮为用户提供多个选项，并强制他们选择单个项目。为了强制实现这种单选模型，单选按钮通常属于一个组，并且每个组在任意时刻只能有一个项目被选中。\n\
  \n要在 Android 中创建一组单选按钮，首先创建一个 `RadioGroup`，然后向该组中添加单选按钮。清单 6–17 和图 6–5 展示了一个示例。\n\
  \n**清单 6–17.** *使用 Android `RadioButton` 组件*\n\n```\n<LinearLayout\n        android:orientation=\"\
  vertical\" android:layout_width=\"fill_parent\"\n        android:layout_height=\"\
  fill_parent\">\n\n<RadioGroup     android:id=\"@+id/rBtnGrp\" android:layout_width=\"\
  wrap_content\"\n            android:layout_height=\"wrap_content\"  android:orientation=\"\
  vertical\" >\n\n    <RadioButton     android:id=\"@+id/chRBtn\" android:text=\"\
  Chicken\"\n            android:layout_width=\"wrap_content\"  android:layout_height=\"\
  wrap_content\"/>\n\n    <RadioButton  android:id=\"@+id/fishRBtn\" android:text=\"\
  Fish\" android:checked=\"true\"\n            android:layout_width=\"wrap_content\"\
  \  android:layout_height=\"wrap_content\"/>\n\n    <RadioButton android:id=\"@+id/stkRBtn\"\
  \ android:text=\"Steak\"\n            android:layout_width=\"wrap_content\"  android:layout_height=\"\
  wrap_content\"/>\n\n</RadioGroup>\n\n</LinearLayout>\n```\n\n在 Android 中，你可以使用 `android.widget.RadioGroup`\
  \ 实现单选按钮组，使用 `android.widget.RadioButton` 实现单选按钮。\n\n![Image](img/9781430239307_Fig06-05.jpg)\n\
  \n**图 6–5.** *使用单选按钮*\n\n请注意，单选按钮组中的单选按钮默认情况下初始状态是未选中的，尽管你可以在 XML 定义中将其中一个设置为选中状态，就像我们在清单\
  \ 6–17 中对“Fish”所做的那样。要以编程方式将其中一个单选按钮设置为选中状态，你可以获取对该单选按钮的引用并调用 `setChecked()`：\n\n\
  ```\nRadioButton steakBtn = (RadioButton)this.findViewById(R.id.stkRBtn);\nsteakBtn.setChecked(true);\n\
  ```\n\n你也可以使用 `toggle()` 方法来切换单选按钮的状态。与 `CheckBox` 控件类似，如果你调用 `setOnCheckedChangeListener()`\
  \ 并传入 `OnCheckedChangeListener` 接口的实现，你会收到 `on-checked` 或 `on-unchecked` 事件的通知。不过，这里有一个细微的区别。这是一个与之前不同的类。这次，从技术上讲，它是\
  \ `RadioGroup.OnCheckedChangeListener` 类，而之前是 `CompoundButton.OnCheckedChangeListener`\
  \ 类。\n\n`RadioGroup` 也可以包含除单选按钮之外的其他视图。例如，清单 6–18 在最后一个单选按钮之后添加了一个 `TextView`。另外请注意，第一个单选按钮\
  \ (`anotherRadBtn`) 位于此单选按钮组之外。\n\n**清单 6–18.** *包含不止`RadioButton`的`RadioGroup`*\n\
  \n```\n<LinearLayout\n        android:orientation=\"vertical\"  android:layout_width=\"\
  fill_parent\"\n        android:layout_height=\"fill_parent\">\n\n<RadioButton android:id=\"\
  @+id/anotherRadBtn\"  android:text=\"Outside\"\n            android:layout_width=\"\
  wrap_content\"  android:layout_height=\"wrap_content\"/>\n\n<RadioGroup android:id=\"\
  @+id/radGrp\"\nandroid:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  >\n\n     <RadioButton android:id=\"@+id/chRBtn\"  android:text=\"Chicken\"\n  \
  \          android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  />\n\n     <RadioButton android:id=\"@+id/fishRBtn\"  android:text=\"Fish\"    \n\
  \            android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  />\n\n     <RadioButton android:id=\"@+id/stkRBtn\"  android:text=\"Steak\"\n  \
  \          android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  />\n\n     <TextView android:text=\"My Favorite\"\n            android:layout_width=\"\
  wrap_content\"  android:layout_height=\"wrap_content\"/>\n```\n\n\n\n### RadioGroup\
  \ 操作\n\n`</RadioGroup>`\n`</LinearLayout>`\n\nListing 6–18 展示了在单选按钮组中可以包含非`RadioButton`控件。同时需要注意的是，单选按钮组只能对其容器内的单选按钮强制单选。也就是说，ID\
  \ 为`anotherRadBtn`的单选按钮将不会受到 Listing 6–18 中所示单选按钮组的影响，因为它不是该组的子元素。\n\n你可以通过编程方式操作`RadioGroup`。例如，可以获取对单选按钮组的引用并添加一个单选按钮（或其他类型的控件）。Listing\
  \ 6–19 演示了这一概念。\n\n**Listing 6–19.** *在代码中向`RadioGroup`添加`RadioButton`*\n\n```\n\
  RadioGroup radGrp = (RadioGroup)findViewById(R.id.radGrp);\nRadioButton newRadioBtn\
  \ = new RadioButton(this);\nnewRadioBtn.setText(\"Pork\");\nradGrp.addView(newRadioBtn);\n\
  ```\n\n一旦用户选中了单选按钮组中的某个单选按钮，就无法通过再次单击来取消选中。清除单选按钮组中所有单选按钮的唯一方法是调用`RadioGroup`上的`clearCheck()`方法。\n\
  \n当然，你可能希望利用`RadioGroup`实现一些有趣的功能。你可能不想轮询每个`RadioButton`来判断它是否被选中。幸运的是，`RadioGroup`提供了多种方法来帮助你。我们通过\
  \ Listing 6–20 来演示这些方法。此代码对应的 XML 见 Listing 6–18。\n\n**Listing 6–20.** *以编程方式使用\
  \ RadioGroup*\n\n```\npublic class RadioGroupActivity extends Activity {\n     \
  \   protected static final String TAG = \"RadioGroupActivity\";\n\n        /** Called\
  \ when the activity is first created. */\n        @Override\n        public void\
  \ onCreate(Bundle savedInstanceState) {\n            super.onCreate(savedInstanceState);\n\
  \            setContentView(R.layout.radiogroup);\n\n            RadioGroup radGrp\
  \ = (RadioGroup)findViewById(R.id.radGrp);\n\n            int checkedRadioButtonId\
  \ = radGrp.getCheckedRadioButtonId();\n\n            radGrp.setOnCheckedChangeListener(new\
  \ RadioGroup.OnCheckedChangeListener() {\n                @Override\n          \
  \      public void onCheckedChanged(RadioGroup arg0, int id) {\n               \
  \     switch(id) {\n                    case -1:\n                        Log.v(TAG,\
  \ \"Choices cleared!\");\n                        break;\n                    case\
  \ R.id.chRBtn:\n                        Log.v(TAG, \"Chose Chicken\");\n       \
  \                 break;\n                    case R.id.fishRBtn:\n            \
  \            Log.v(TAG, \"Chose Fish\");\n                        break;\n     \
  \               case R.id.stkRBtn:\n                        Log.v(TAG, \"Chose Steak\"\
  );\n                        break;\n                    default:\n             \
  \           Log.v(TAG, \"Huh?\");\n                        break;\n            \
  \        }\n                }});\n        }\n}\n```\n\n我们可以随时使用`getCheckedRadioButtonId()`获取当前选中的`RadioButton`，该方法返回选中项的资源\
  \ ID，如果没有任何项被选中（可能没有默认选项且用户尚未做出选择），则返回–1。我们在前面的`onCreate()`方法中展示了这一点，但实际上，你应当在合适的时机使用它来读取用户当前的选择。我们还可以设置一个监听器，在用户选择某个`RadioButton`时立即得到通知。注意，`onCheckedChanged()`方法接收一个`RadioGroup`参数，这允许你为多个`RadioGroup`使用同一个`OnCheckedChangeListener`。你可能已经注意到了\
  \ switch 选项中的–1 情况。这种情况也会在通过代码调用`clearCheck()`清除`RadioGroup`时发生。\n\n### ImageView\
  \ 控件\n\n我们尚未介绍的基本控件之一是`ImageView`控件。它用于显示图像，图像可以来自文件、内容提供者或资源（如 drawable）。你甚至可以只指定一种颜色，`ImageView`将显示该颜色。Listing\
  \ 6–21 展示了一些`ImageView`在 XML 中的示例，以及如何创建`ImageView`的相关代码。\n\n**Listing 6–21.** *XML\
  \ 和代码中的`ImageView`*\n\n```\n<ImageView android:id=\"@+id/image1\"\n  android:layout_width=\"\
  wrap_content\"  android:layout_height=\"wrap_content\"\n  android:src=\"@drawable/icon\"\
  \ />\n\n<ImageView android:id=\"@+id/image2\"\n  android:layout_width=\"125dip\"\
  \  android:layout_height=\"25dip\"\n  android:src=\"#555555\" />\n\n<ImageView android:id=\"\
  @+id/image3\"\n  android:layout_width=\"wrap_content\"  android:layout_height=\"\
  wrap_content\" />\n\n<ImageView android:id=\"@+id/image4\"\n  android:layout_width=\"\
  wrap_content\"  android:layout_height=\"wrap_content\"\n  android:src=\"@drawable/manatee02\"\
  \n  android:scaleType=\"centerInside\"\n  android:maxWidth=\"35dip\"  android:maxHeight=\"\
  50dip\"\n  />\n\n  ImageView imgView = (ImageView)findViewById(R.id.image3);\n\n\
  \  imgView.setImageResource( R.drawable.icon );\n\n  imgView.setImageBitmap(BitmapFactory.decodeResource(\n\
  \              this.getResources(), R.drawable.manatee14) );\n\n  imgView.setImageDrawable(\n\
  \              Drawable.createFromPath(\"/mnt/sdcard/dave2.jpg\") );\n\n  imgView.setImageURI(Uri.parse(\"\
  file://mnt/sdcard/dave2.jpg\"));\n```\n\n在这个示例中，我们在 XML 中定义了四个图像。第一个只是我们应用程序的图标。第二个是一个灰色条，宽度大于高度。第三个定义没有在\
  \ XML 中指定图像源，但我们为其关联了一个 ID（`image3`），以便在代码中使用该 ID 来设置图像。第四个图像是我们的另一个 drawable 图像文件，我们不仅指定了图像文件的来源，还设置了图像在屏幕上的最大尺寸，并定义了当图像超过最大尺寸时的处理方式。在这种情况下，我们告诉`ImageView`对图像进行居中缩放，使其适应我们指定的大小。\n\
  \n在 Listing 6–21 的 Java 代码中，我们展示了设置`image3`图像的几种方法。首先，我们当然需要通过资源 ID 找到`ImageView`的引用。第一个设置方法`setImageResource()`直接使用图像的资源\
  \ ID 来定位图像文件，为我们的`ImageView`提供图像。第二个设置方法使用`BitmapFactory`将图像资源读入`Bitmap`对象，然后将`ImageView`设置为该`Bitmap`。请注意，在将`Bitmap`应用到`ImageView`之前，我们可以对其做一些修改，但在本例中，我们直接使用了原图。此外，`BitmapFactory`有几种创建`Bitmap`的方法，包括从字节数组和`InputStream`创建。你可以使用`InputStream`方法从\
  \ Web 服务器读取图像，创建`Bitmap`图像，然后设置`ImageView`。\n\n第三种设置方法使用`Drawable`作为图像源。在此例中，我们展示了图像来源是\
  \ SD 卡。你需要将某种图像文件以正确的名称放在 SD 卡上，才能使此方法生效。与`BitmapFactory`类似，`Drawable`类有几种不同的构造`Drawable`的方法，包括从\
  \ XML 流构造。\n\n最后一个设置方法接受图像文件的 URI，并将其用作图像源。对于这最后一个调用，不要认为你可以使用任何图像 URI 作为源。此方法实际上仅用于设备上的本地图像，而不是可能通过\
  \ HTTP 找到的图像。要将基于互联网的图像用作`ImageView`的源，你很可能需要使用`BitmapFactory`和`InputStream`。\n\n\
  \n\n### 日期与时间控件\n\n日期和时间控件在许多窗口工具集中都很常见。Android 提供了多种基于日期和时间的控件，本部分将讨论其中几种。具体来说，我们将介绍\
  \ `DatePicker`、`TimePicker`、`DigitalClock` 和 `AnalogClock` 控件。\n\n#### `DatePicker`\
  \ 和 `TimePicker` 控件\n\n顾名思义，你可以使用 `DatePicker` 控件选择日期，使用 `TimePicker` 控件选取时间。代码清单\
  \ 6-22 和 图 6-6 展示了这些控件的示例。\n\n**代码清单 6-22.** *XML 中的 `DatePicker` 和 `TimePicker`\
  \ 控件*\n\n```\n<LinearLayout\n        android:orientation=\"vertical\"\n        android:layout_width=\"\
  fill_parent\"\n        android:layout_height=\"fill_parent\">\n\n  <TextView android:id=\"\
  @+id/dateDefault\"\n    android:layout_width=\"fill_parent\" android:layout_height=\"\
  wrap_content\" />\n\n  <DatePicker android:id=\"@+id/datePicker\"\n    android:layout_width=\"\
  wrap_content\" android:layout_height=\"wrap_content\" />\n\n  <TextView android:id=\"\
  @+id/timeDefault\"\n    android:layout_width=\"fill_parent\" android:layout_height=\"\
  wrap_content\" />\n\n  <TimePicker android:id=\"@+id/timePicker\"\n    android:layout_width=\"\
  wrap_content\" android:layout_height=\"wrap_content\" />\n\n</LinearLayout>\n```\n\
  \n![Image](img/9781430239307_Fig06-06.jpg)\n\n**图 6-6.** *`DatePicker` 和 `TimePicker`\
  \ 的用户界面*\n\n如果你查看 XML 布局，会发现定义这些控件很简单。与 Android 工具集中的任何其他控件一样，你可以通过编程方式访问这些控件以进行初始化或从中检索数据。例如，你可以像代码清单\
  \ 6-23 所示那样初始化这些控件。\n\n**代码清单 6-23.** *分别使用日期和时间初始化 `DatePicker` 和 `TimePicker`*\n\
  \n```\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.datetimepicker);\n\n        TextView dateDefault\
  \ = (TextView)findViewById(R.id.dateDefault);\n        TextView timeDefault = (TextView)findViewById(R.id.timeDefault);\n\
  \n        DatePicker dp = (DatePicker)this.findViewById(R.id.datePicker);\n    \
  \    // 月份（而且只有月份）是从零开始的。显示时需要加 1。\n        dateDefault.setText(\"日期默认为 \" + (dp.getMonth()\
  \ + 1) + \"/\" +\n                dp.getDayOfMonth() + \"/\" + dp.getYear());\n\
  \        // 这里，从 12 月 (12) 中减去 1 以将其设置为 12 月\n        dp.init(2008, 11, 10, null);\n\
  \n        TimePicker tp = (TimePicker)this.findViewById(R.id.timePicker);\n\n  \
  \      java.util.Formatter timeF = new java.util.Formatter();\n        timeF.format(\"\
  时间默认为 %d:%02d\", tp.getCurrentHour(),\n                        tp.getCurrentMinute());\n\
  \        timeDefault.setText(timeF.toString());\n\n        tp.setIs24HourView(true);\n\
  \        tp.setCurrentHour(new Integer(10));\n        tp.setCurrentMinute(new Integer(10));\n\
  \    }\n}\n```\n\n代码清单 6-23 将 `DatePicker` 的日期设置为 2008 年 12 月 10 日。请注意，对于月份，内部值是从零开始的，这意味着一月是\
  \ 0，十二月是 11。对于 `TimePicker`，小时和分钟数被设置为 10。另请注意，此控件支持 24 小时制视图。如果你未设置这些控件的值，默认值将是设备当前的日期和时间。\n\
  \n最后，请注意 Android 提供了这些控件的模态窗口版本，例如 `DatePickerDialog` 和 `TimePickerDialog`。如果你想向用户显示控件并强制用户做出选择，这些控件非常有用。我们将在第\
  \ 8 章中更详细地介绍对话框。\n\n#### `DigitalClock` 和 `AnalogClock` 控件\n\nAndroid 还提供了 `DigitalClock`\
  \ 和 `AnalogClock` 控件（参见图 6-7）。\n\n![Image](img/9781430239307_Fig06-07.jpg)\n\n**图\
  \ 6-7.** *使用 `AnalogClock` 和 `DigitalClock`*\n\n如图所示，数字时钟除了小时和分钟外，还支持秒显示。Android\
  \ 中的模拟时钟是一个双指针时钟，一个指针指示小时，另一个指针指示分钟。要将它们添加到布局中，请使用如代码清单 6-24 所示的 XML。\n\n**代码清单\
  \ 6-24.** *在 XML 中添加 `DigitalClock` 或 `AnalogClock`*\n\n```\n<DigitalClock\n  android:layout_width=\"\
  wrap_content\" android:layout_height=\"wrap_content\" />\n\n<AnalogClock\n  android:layout_width=\"\
  wrap_content\" android:layout_height=\"wrap_content\" />\n```\n\n这两个控件实际上仅用于显示当前时间，它们不允许你修改日期或时间。换句话说，它们是功能仅限于显示当前时间的控件。因此，如果你想更改日期或时间，则需要使用\
  \ `DatePicker`/`TimePicker` 或 `DatePickerDialog`/`TimePickerDialog`。不过，这两个时钟的优点是它们会自动更新，无需你做任何操作。也就是说，`DigitalClock`\
  \ 中的秒数会自然流逝，`AnalogClock` 的指针会自行转动，而我们无需额外处理。\n\n### `MapView` 控件\n\n`com.google.android.maps.MapView`\
  \ 控件可以显示地图。你可以通过 XML 布局或代码来实例化此控件，但使用它的 Activity 必须扩展 `MapActivity`。`MapActivity`\
  \ 负责处理加载地图的多线程请求、执行缓存等操作。\n\n代码清单 6-25 展示了 `MapView` 的实例化示例。\n\n**代码清单 6-25.** *通过\
  \ XML 布局创建 `MapView` 控件*\n\n```\n<LinearLayout\n        android:orientation=\"vertical\"\
  \ android:layout_width=\"fill_parent\"\n        android:layout_height=\"fill_parent\"\
  >\n\n    <com.google.android.maps.MapView\n        android:layout_width=\"fill_parent\"\
  \n        android:layout_height=\"fill_parent\"\n        android:enabled=\"true\"\
  \n        android:clickable=\"true\"\n        android:apiKey=\"myAPIKey\"\n    \
  \    />\n\n</LinearLayout>\n```\n\n我们将在第 17 章讨论基于位置的服务时，详细讨论 `MapView` 控件。届时你也会学习如何获取自己的地图\
  \ API 密钥。\n\n### 理解适配器\n\n在详细讨论 Android 的列表控件之前，我们需要谈谈适配器。列表控件用于显示数据集合。但 Android\
  \ 并未使用单一类型的控件来同时管理显示和数据，而是将这两项职责分离到列表控件和适配器中。列表控件是扩展了 `android.widget.AdapterView`\
  \ 的类，包括 `ListView`、`GridView`、`Spinner` 和 `Gallery`（参见图 6-8）。\n\n![Image](img/9781430239307_Fig06-08.jpg)\n\
  \n**图 6-8.** *`AdapterView` 类层次结构*\n\n`AdapterView` 本身扩展了 `android.widget.ViewGroup`，这意味着\
  \ `ListView`、`GridView` 等是容器控件。换句话说，列表控件包含子视图的集合。适配器的目的是管理 `AdapterView` 的数据，并为其提供子视图。让我们通过研究\
  \ `SimpleCursorAdapter` 来了解其工作原理。\n\n\n\n#### 认识 `SimpleCursorAdapter`\n\n`SimpleCursorAdapter`\
  \ 如图 6–9 所示。\n\n![图片](img/9781430239307_Fig06-09.jpg)\n\n**图 6–9.** *`SimpleCursorAdapter`*\n\
  \n这是一张非常重要的理解图。左侧是 `AdapterView`；在此示例中，它是一个由多个 `TextView` 子视图构成的 `ListView`。右侧是数据；在本例中，它表示为来自内容提供程序查询结果的若干数据行。\n\
  \n为了将数据行映射到 `ListView`，`SimpleCursorAdapter` 需要一个子布局资源 ID。该子布局必须描述右侧应显示在左侧的每个数据元素的布局。这里的布局与我们为活动编写的布局类似，但它只需指定\
  \ `ListView` 中单行的布局。例如，如果从联系人内容提供程序获得了一组结果信息，并且只想在 `ListView` 中显示每个联系人姓名，则需要提供一个布局来描述姓名字段的外观。如果希望在\
  \ `ListView` 的每一行中同时显示姓名和来自结果集的图像，则布局必须说明如何显示姓名和图像。\n\n这并不意味着你必须为结果集中的每个字段都提供布局规范，也不意味着你必须在结果集中为\
  \ `ListView` 每一行要包含的每个元素都准备一个数据。例如，稍后我们将展示如何在 `ListView` 中添加复选框用于选择行，而这些复选框无需通过结果集中的数据来设置。我们还将展示如何访问结果集中不属于\
  \ `ListView` 部分的数据。尽管我们刚刚只讨论了 `ListViews`、`TextView`s、游标和结果集，但请记住，适配器的概念远比这更通用。左侧可以是一个画廊，右侧可以是一个简单的图像数组。但为了简化问题，我们暂先更详细地了解\
  \ `SimpleCursorAdapter`。\n\n`SimpleCursorAdapter` 的构造函数如下所示：\n\n`SimpleCursorAdapter(Context\
  \ context, int childLayout, Cursor c, String[] from, int[] to)`\n\n此适配器将游标中的一行转换为容器控件的子视图。子视图的定义由\
  \ XML 资源（`childLayout` 参数）指定。请注意，由于游标中的一行可能包含多列，你需要通过指定列名数组（使用 `from` 参数）来告知 `SimpleCursorAdapter`\
  \ 要选择该行中的哪些列。\n\n同样，因为你选择的每一列都必须映射到布局中的一个 `View`，所以必须在 `to` 参数中指定这些视图的 ID。所选择的列与显示该列数据的\
  \ `View` 之间存在一一对应的映射关系，因此 `from` 和 `to` 参数数组必须具有相同数量的元素。如前所述，子视图可以包含其他类型的视图，不一定是\
  \ `TextView`。例如，你可以使用 `ImageView`。\n\n`ListView` 与我们的适配器之间存在着紧密的协作关系。当 `ListView`\
  \ 想要显示一行数据时，它会调用适配器的 `getView()` 方法，并传入位置参数以指定要显示的数据行。适配器通过使用其构造函数中设置的布局构建相应的子视图，并从结果集中提取相应记录的数据来响应。因此，`ListView`\
  \ 无需处理数据在适配器端如何存在；它只需要根据需求调用子视图即可。这是一个关键点，因为这意味着 `ListView` 不一定需要为每一行数据都创建子视图。它实际上只需要拥有足够显示在显示窗口中的子视图数量。如果只显示十行，从技术上讲，即使结果集中有数百条记录，`ListView`\
  \ 也只需要实例化十个子布局。实际上，实例化的子布局数量会超过十个，因为 Android 通常会预留一些额外的子布局，以便更快地将新行显示出来。你应该得出的结论是：`ListView`\
  \ 管理的子视图是可以被回收利用的。稍后我们将对此进行更多讨论。\n\n图 6–9 揭示了使用适配器的一些灵活性。由于列表控件使用了适配器，你可以根据数据和子视图替换使用各种类型的适配器。例如，如果你不打算从内容提供程序或数据库中填充\
  \ `AdapterView`，则不必使用 `SimpleCursorAdapter`。你可以选择一种更“简单”的适配器——`ArrayAdapter`。\n\n\
  \n\n#### 认识 `ArrayAdapter`\n\n`ArrayAdapter` 是 Android 中最简单的适配器。它专门针对列表控件，并假设列表项（子视图）由\
  \ `TextView` 控件表示。创建一个新的 `ArrayAdapter` 可以像下面这样简单：\n\n```\nArrayAdapter<String>\
  \ adapter = new ArrayAdapter<String>(this,\n                android.R.layout.simple_list_item_1,\n\
  \                new string[]{\"Dave\",\"Satya\",\"Dylan\"});\n```\n\n我们仍然需要传入上下文（`this`）和\
  \ `childLayout` 资源 ID。但这次我们不再传入数据字段规范组成的 `from` 数组，而是直接传入一个字符串数组作为实际数据。我们不需要传入游标或\
  \ `View` 资源 ID 组成的 `to` 数组。这样做的假设是：我们的子布局只包含一个 `TextView`，而 `ArrayAdapter` 会将其作为数据数组中字符串的目标显示位置。\n\
  \n现在我们介绍一个关于 `childLayout` 资源 ID 的便捷技巧。我们无需为列表项创建自己的布局文件，而是可以直接利用 Android 中预定义的布局。请注意，子布局资源\
  \ ID 的前缀是 `android.`。Android 不会在本地的 `/res` 目录中查找，而是会去自己的资源目录中查找。你可以通过导航到 Android\
  \ SDK 文件夹，然后在 `platforms/<android-version>/data/res/layout` 路径下找到该文件夹。在那里，你会找到 `simple_list_item_1.xml`，可以看到它定义了一个简单的\
  \ `TextView`。这个 `TextView` 正是我们的 `ArrayAdapter` 用来创建视图（在其 `getView()` 方法中）并传递给 `ListView`\
  \ 的。你可以随意浏览这些文件夹，找到适用于各种场景的预定义布局。我们稍后会用到更多这样的布局。\n\n`ArrayAdapter` 还有其他构造方法。如果 `childLayout`\
  \ 不是一个简单的 `TextView`，你可以传入行布局的资源 ID，再加上用于接收数据的 `TextView` 的资源 ID。当你没有现成的字符串数组可以传入时，可以使用\
  \ `createFromResource()` 方法。代码清单 6-26 展示了一个为 Spinner 创建 `ArrayAdapter` 的例子。\n\n\
  **代码清单 6-26.** *从字符串资源文件创建 `ArrayAdapter`*\n\n```\n<Spinner android:id=\"@+id/spinner\"\
  \n    android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  \ />\n\nSpinner spinner = (Spinner) findViewById(R.id.spinner);\n\nArrayAdapter<CharSequence>\
  \ adapter = ArrayAdapter.createFromResource(this,\n        R.array.planets, android.R.layout.simple_spinner_item);\n\
  \nadapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);\n\
  \nspinner.setAdapter(adapter);\n\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<!--\
  \ 此文件位于 /res/values/planets.xml -->\n<resources>\n  <string-array name=\"planets\"\
  >\n    <item>水星</item>\n    <item>金星</item>\n    <item>地球</item>\n    <item>火星</item>\n\
  \    <item>木星</item>\n    <item>土星</item>\n    <item>天王星</item>\n    <item>海王星</item>\n\
  \  </string-array>\n</resources>\n```\n\n代码清单 6-26 包含三个部分。第一部分是 Spinner 的 XML 布局。第二部分是\
  \ Java 代码，展示了如何创建一个数据源定义在字符串资源文件中的 `ArrayAdapter`。使用这种方法，你不仅可以将列表内容外部化到 XML 文件中，还可以使用本地化的版本。我们稍后会详细介绍\
  \ Spinner，但现在你只需要知道，Spinner 有一个用于显示当前选中值的视图，以及一个用于显示可供选择值的列表视图。它基本上就是一个下拉菜单。代码清单\
  \ 6-26 的第三部分是名为 `/res/values/planets.xml` 的 XML 资源文件，它被读取用来初始化 `ArrayAdapter`。\n\
  \n值得一提的是，`ArrayAdapter` 允许对底层数据进行动态修改。例如，`add()` 方法会在数组末尾追加一个新值。`insert()` 方法会在数组中的指定位置添加一个新值。而\
  \ `remove()` 方法会从数组中移除一个对象。你也可以调用 `sort()` 方法来对数组重新排序。当然，完成这些操作后，数据数组会与 `ListView`\
  \ 不同步，这时你需要调用适配器的 `notifyDataSetChanged()` 方法。该方法将使 `ListView` 与适配器重新同步。\n\n以下列表总结了\
  \ Android 提供的适配器：\n\n- `ArrayAdapter<T>`：这是一个基于任意对象泛型数组的适配器。它旨在与 `ListView` 配合使用。\n\
  - `CursorAdapter`：此适配器也用于 `ListView`，它通过游标为列表提供数据。\n- `SimpleAdapter`：顾名思义，这是一个简单的适配器。它通常用于使用静态数据（可能来自资源）填充列表。\n\
  - `ResourceCursorAdapter`：此适配器继承自 `CursorAdapter`，并知道如何从资源创建视图。\n- `SimpleCursorAdapter`：此适配器继承自\
  \ `ResourceCursorAdapter`，并根据游标中的列创建 `TextView`/`ImageView` 视图。这些视图在资源中定义。\n\n我们已经介绍了足够多的适配器知识，接下来可以开始展示一些使用适配器和列表控件（也称为\
  \ `AdapterView`）的实际例子了。让我们开始吧。\n\n### 在 AdapterView 中使用适配器\n\n既然你已经了解了适配器，现在是时候让它们为我们工作了，为列表控件提供数据。在本节中，我们将首先介绍基本的列表控件——`ListView`。然后，我们将描述如何创建你自己的自定义适配器，最后，我们将介绍其他类型的列表控件：`GridView`、Spinner\
  \ 和 Gallery。\n\n#### 基本列表控件：`ListView`\n\n`ListView` 控件垂直显示项目列表。也就是说，如果我们有一个待查看的项目列表，且项目数量超出了当前屏幕显示范围，我们可以滚动来查看其余项目。通常，使用\
  \ `ListView` 的方法是编写一个继承自 `android.app.ListActivity` 的新 Activity。`ListActivity` 包含一个\
  \ `ListView`，你可以通过调用 `setListAdapter()` 方法来为 `ListView` 设置数据。\n\n正如我们之前所述，适配器将列表控件与数据连接起来，并帮助为列表控件准备子视图。`ListView`\
  \ 中的项目可以被点击以执行即时操作，也可以被选中以便后续对选中的项目集合进行操作。我们将从一个非常简单的例子开始，然后逐步添加功能。\n\n\n\n#####\
  \ 在 ListView 中显示值\n\n图 6–10 展示了最简形式的 `ListView` 控件。\n\n![图片](img/9781430239307_Fig06-10.jpg)\n\
  \n**图 6–10.** *使用 `ListView` 控件*\n\n在本练习中，我们将用 `ListView` 填满整个屏幕，因此甚至无需在主布局 XML\
  \ 文件中指定 `ListView`。代码清单 6–27 展示了 `ListActivity` 的 Java 代码。\n\n**代码清单 6–27.** *向\
  \ `ListView` 添加条目*\n\n```\npublic class ListViewActivity extends ListActivity\n\
  {\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\n    {\n\
  \        super.onCreate(savedInstanceState);\n\n        Cursor c = managedQuery(Contacts.CONTENT_URI,\n\
  \                        null, null, null, Contacts.DISPLAY_NAME + \" ASC\");\n\n\
  \        String[] cols = new String[] {Contacts.DISPLAY_NAME};\n        int[]  \
  \  views = new int[]   {android.R.id.text1};\n\n        SimpleCursorAdapter adapter\
  \ = new SimpleCursorAdapter(this,\n                        android.R.layout.simple_list_item_1,\n\
  \                        c, cols, views);\n        this.setListAdapter(adapter);\n\
  \    }\n}\n```\n\n代码清单 6–27 创建了一个 `ListView` 控件，并用设备上的联系人列表填充它。在我们的示例中，我们查询设备以获取联系人列表。为演示目的，我们选择了\
  \ Contacts 中的所有字段（使用 `managedQuery()` 方法中的第一个 null 参数），并按 `Contacts.DISPLAY_NAME`\
  \ 字段进行排序（使用 `managedQuery()` 方法中的最后一个参数）。然后，我们创建一个投影（`cols`）来选择 `ListView` 中仅显示的联系人姓名——投影定义了我们感兴趣的列。接着，我们提供相应的资源\
  \ ID 数组（`views`），将姓名列（`Contacts.DISPLAY_NAME`）映射到 `TextView` 控件（`android.R.id.text1`）。之后，我们创建了一个光标适配器并设置列表的适配器。适配器类能够智能地从数据源中提取行，并取出每个联系人的名称以填充\
  \ UI。\n\n要使它正常工作，我们还需要做一件事。由于此演示正在访问手机的通讯录数据库，我们需要请求相应的权限。此安全主题将在第 14 章中更详细地介绍，因此现在我们将仅引导您完成\
  \ `ListView` 的显示。双击本项目的 `AndroidManifest.xml` 文件，然后点击“权限”标签页。点击“添加”按钮，选择“使用权限”，然后点击“确定”。向下滚动名称列表，直到找到\
  \ `android.permission.READ_CONTACTS`。您的 Eclipse 窗口应类似于图 6–11 所示。然后保存 `AndroidManifest.xml`\
  \ 文件。现在您可以在模拟器中运行此应用程序。在此示例应用程序中显示任何姓名之前，您可能需要使用联系人应用程序添加一些联系人。\n\n您会注意到 `onCreate()`\
  \ 方法没有设置 Activity 的内容视图。相反，由于基类 `ListActivity` 已经包含了一个 `ListView`，因此它只需为 `ListView`\
  \ 提供数据即可。我们在这个示例中使用了一些快捷方式，首先是利用 `ListActivity` 提供了主布局。我们还使用了 Android 提供的布局作为子视图（资源\
  \ ID `android.R.layout.simple_list_item_1`），其中包含 Android 提供的 `TextView`（资源 ID `android.R.id.text1`）。总而言之，设置起来相当简单。\n\
  \n![图片](img/9781430239307_Fig06-11.jpg)\n\n**图 6–11.** *修改 `AndroidManifest.xml`\
  \ 以使我们的应用程序运行*\n\n##### ListView 中的可点击项\n\n当然，当您运行此示例时，您会看到可以上下滚动列表来查看所有联系人姓名，但仅此而已。如果我们想对这个示例做一些更有趣的事情，比如当用户点击\
  \ `ListView` 中的某个条目时启动联系人应用程序，该怎么办？代码清单 6–28 展示了对我们示例的修改，以接受用户输入。\n\n**代码清单 6–28.**\
  \ *在 `ListView` 上接受用户输入*\n\n```\npublic class ListViewActivity2 extends ListActivity\
  \ implements OnItemClickListener\n{\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n\n  \
  \      ListView lv = getListView();\n\n        Cursor c = managedQuery(Contacts.CONTENT_URI,\n\
  \                null, null, null, Contacts.DISPLAY_NAME + \" ASC\");\n\n      \
  \  String[] cols = new String[] {Contacts.DISPLAY_NAME};\n        int[]   views\
  \ = new int[]   {android.R.id.text1};\n\n        SimpleCursorAdapter adapter = new\
  \ SimpleCursorAdapter(this,\n                android.R.layout.simple_list_item_1,\n\
  \                c, cols, views);\n        this.setListAdapter(adapter);\n     \
  \   lv.setOnItemClickListener(this);\n    }\n\n    @Override\n    public void onItemClick(AdapterView<?>\
  \ adView, View target, int position, long id) {\n        Log.v(\"ListViewActivity\"\
  , \"in onItemClick with \" + ((TextView) target).getText() +\n                \"\
  . Position = \" + position + \". Id = \" + id);\n        Uri selectedPerson = ContentUris.withAppendedId(\n\
  \                Contacts.CONTENT_URI, id);\n        Intent intent = new Intent(Intent.ACTION_VIEW,\
  \ selectedPerson);\n        startActivity(intent);\n    }\n}\n```\n\n我们的 Activity\
  \ 现在实现了 `OnItemClickListener` 接口，这意味着当用户在 `ListView` 中点击某个内容时，我们将收到回调。正如在 `onItemClick()`\
  \ 方法中所见，我们获得了关于所点击内容的许多信息，包括接收点击的视图、所点击条目在 `ListView` 中的位置，以及根据适配器得到的条目 ID。由于我们知道\
  \ `ListView` 由 `TextView` 组成，因此我们假设接收到的是 `TextView` 并相应地进行类型转换，然后调用 `getText()`\
  \ 方法来获取联系人姓名。位置值表示此条目在 `ListView` 中所有条目列表中的相对位置，且从零开始。因此，列表中的第一个条目位于位置 0。\n\nID\
  \ 值完全取决于适配器和数据源。在我们的示例中，我们恰好查询的是 Contacts 内容提供者，因此根据该适配器，ID 就是来自内容提供者的记录的 `_ID`。但在其他情况下，您的数据源可能并非来自内容提供者，因此您不应认为总可以像本例中那样创建\
  \ URI。如果我们使用的是从资源 XML 文件中读取值的 `ArrayAdapter`，那么赋予我们的 ID 很可能就是数据数组中的位置值，实际上可能与位置值完全相同。\n\
  \n之前讨论 `ArrayAdapter` 时，我们提到了 `notifyDataSetChanged()` 方法，该方法可以在数据发生变化时让适配器更新 `ListView`。在当前示例中尝试这个实验。点击一个联系人，这应该会启动联系人应用程序。现在，编辑该联系人，更改其姓名；点击“完成”，然后点击“返回”按钮，回到我们的示例应用程序。您应该会看到\
  \ `ListView` 中该联系人的姓名已自动更新。是不是很酷？通过 `SimpleCursorAdapter` 和 Contacts 内容提供者，我们的 `ListView`\
  \ 已被自动更新。然而，对于 `ArrayAdapter`，您需要自行调用 `notifyDataSetChanged()` 方法。\n\n\n\n### 使用\
  \ `ListView` 添加其他控件\n\n刚才的操作相当简单。我们生成了一个包含联系人姓名的自定义 `ListView`，点击姓名即可为所选人员启动“联系人”应用。但如果我们想先选择一批姓名，然后对这组人执行某些操作，该怎么办？在下一个示例应用中，我们将修改列表项的布局以包含复选框，并会在用户界面中添加一个按钮，用于对选中的子集项目执行操作。\n\
  \n如果你希望在主布局中添加其他控件，可以自行提供布局 XML 文件，放入一个 `ListView`，并添加其他所需控件。例如，你可以在用户界面的 `ListView`\
  \ 下方添加一个按钮，用于对选中的项目提交操作，如图 6–12 所示。\n\n![图片](img/9781430239307_Fig06-12.jpg)\n\n\
  **图 6–12.** 一个附加按钮，允许用户提交选中的项目\n\n本例的主布局如代码清单 6–29 所示，其中包含了该活动的 UI 定义——`ListView`\
  \ 和 `Button`。\n\n**代码清单 6–29.** 重写 `ListActivity` 引用的 `ListView`\n\n```\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<!-- 该文件位于 /res/layout/list.xml -->\n<LinearLayout\n\
  \    android:orientation=\"vertical\"\n    android:layout_width=\"fill_parent\"\
  \  android:layout_height=\"fill_parent\">\n\n    <ListView android:id=\"@android:id/list\"\
  \n            android:layout_width=\"fill_parent\"  android:layout_height=\"0dip\"\
  \n            android:layout_weight=\"1\" />\n\n    <Button android:id=\"@+id/btn\"\
  \ android:onClick=\"doClick\"\n           android:layout_width=\"wrap_content\"\
  \  android:layout_height=\"wrap_content\"\n           android:text=\"提交选择\" />\n\
  \n</LinearLayout>\n```\n\n请注意为 `ListView` 指定的 ID。我们必须使用 `@android:id/list`，因为 `ListActivity`\
  \ 期望在我们的布局中找到一个具有此名称的 `ListView`。如果我们依赖 `ListActivity` 为自动创建的默认 `ListView`，它也会具有这个\
  \ ID。\n\n另一点需要注意是我们在 `LinearLayout` 中指定 `ListView` 高度的方式。我们希望无论 `ListView` 中有多少项，按钮始终显示在屏幕上，并且不希望用户滚动到页面底部才能找到按钮。为此，我们将\
  \ `layout_height` 设为 0，然后使用 `layout_weight` 表示该控件应占据父容器的所有可用空间。这一技巧既为按钮留出了空间，又保留了滚动\
  \ `ListView` 的能力。我们将在本章稍后部分详细讨论布局和权重。\n\n活动的实现代码如代码清单 6–30 所示。\n\n**代码清单 6–30.**\
  \ 从 `ListActivity` 读取用户输入\n\n```\npublic class ListViewActivity3 extends ListActivity\n\
  {\n    private static final String TAG = \"ListViewActivity3\";\n    private ListView\
  \ lv = null;\n    private Cursor cursor = null;\n    private int idCol = -1;\n \
  \   private int nameCol = -1;\n    private int timesContactedCol = -1;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.list);\n\n        lv = getListView();\n\n     \
  \   cursor = managedQuery(Contacts.CONTENT_URI,\n                        null, null,\
  \ null, Contacts.DISPLAY_NAME + \" ASC\");\n\n        String[] cols = new String[]{Contacts.DISPLAY_NAME};\n\
  \        idCol = cursor.getColumnIndex(Contacts._ID);\n        nameCol = cursor.getColumnIndex(Contacts.DISPLAY_NAME);\n\
  \        timesContactedCol = cursor.getColumnIndex(Contacts.TIMES_CONTACTED);\n\n\
  \        int[] views = new int[]{android.R.id.text1};\n\n        SimpleCursorAdapter\
  \ adapter = new SimpleCursorAdapter(this,\n                android.R.layout.simple_list_item_multiple_choice,\n\
  \                cursor, cols, views);\n\n        this.setListAdapter(adapter);\n\
  \n        lv.setChoiceMode(ListView.CHOICE_MODE_MULTIPLE);\n    }\n\n    public\
  \ void doClick(View view) {\n        int count=lv.getCount();\n        SparseBooleanArray\
  \ viewItems = lv.getCheckedItemPositions();\n        for(int i=0; i<count; i++)\
  \ {\n            if(viewItems.get(i)) {\n                // CursorWrapper cw = (CursorWrapper)\
  \ lv.getItemAtPosition(i);\n                cursor.moveToPosition(i);\n        \
  \        long id = cursor.getLong(idCol);\n                String name = cursor.getString(nameCol);\n\
  \                int timesContacted = cursor.getInt(timesContactedCol);\n      \
  \          Log.v(TAG, name + \" 已选中。联系次数 = \" + timesContacted +\n             \
  \           \"。位置 = \" + i + \"。ID = \" + id);\n            }\n        }\n    }\n\
  }\n```\n\n现在，我们又回到了调用 `setContentView()` 来设置活动 UI 的情况。在设置适配器时，我们传入了另一个 Android 提供的用于\
  \ `ListView` 行项目的视图（`android.R.layout.simple_list_item_multiple_choice`），这会使每一行包含一个\
  \ `TextView` 和一个 `CheckBox`。如果你查看这个布局文件内部，会看到另一个 `TextView` 的子类，名为 `CheckedTextView`。这种特殊类型的\
  \ `TextView` 专为与 `ListView` 配合使用而设计。看吧，我们早就说过 Android 布局文件夹里有一些有趣的东西！你会注意到 `CheckedTextView`\
  \ 的 ID 是 `text1`，这正是我们需要传递给 `SimpleCursorAdapter` 构造函数中 views 数组的值。\n\n因为我们希望用户能够选择行，所以将选择模式设置为\
  \ `CHOICE_MODE_MULTIPLE`。默认情况下，选择模式是 `CHOICE_MODE_NONE`。另一个可能的取值是 `CHOICE_MODE_SINGLE`。如果你想在本例中使用单选模式，则需要改用不同的布局，很可能是\
  \ `android.R.layout.simple_list_item_single_choice`。\n\n在本例中，我们实现了一个基本按钮，它会调用活动的\
  \ `doClick()` 方法。为简单起见，我们只想将用户勾选的项目名称输出到 LogCat。好消息是解决方案相当简单；坏消息是 Android 已经演变，最佳方案取决于你针对的是哪个\
  \ Android 版本。我们这里展示的 `ListView` 解决方案自 Android 1 以来一直有效（尽管我们在按钮回调中采用了 Android 1.6\
  \ 的快捷方式）。也就是说，`getCheckedItemPositions()` 方法虽然旧但依然可用。其返回值是一个数组，可以告诉你某个项目是否被选中。因此，我们遍历该数组。如果\
  \ `ListView` 中对应的行被选中，`viewItems.get(i)` 将返回 true。我们的数据可通过游标访问。所以，我们不在 `ListView`\
  \ 中查找数据，而是在游标中查找数据。`ListView` 会告诉我们在适配器中的哪个位置进行查找。\n\n当我们从 `ListView` 获取到一个已被选中的位置编号时，可以使用游标的\
  \ `moveToPosition()` 方法来准备读取数据。还有一个方法功能几乎相同，即 `ListView` 的 `getItemAtPosition()`\
  \ 方法。在我们的例子中，`getItemAtPosition()` 返回的对象实际上是一个 `CursorWrapper` 对象。正如我们之前所说，在其他情况下，我们可能会得到其他类型的对象。这里之所以会得到\
  \ `CursorWrapper`，仅仅是因为我们正在与内容提供程序打交道。你必须了解你的数据源和适配器，才能知道会得到什么结果。\n\n\n\n然后我们可以使用\
  \ `Cursor`（或者如果之前选择了 `CursorWrapper`）来检索与 `ListView` 行相关联的数据。请注意，在我们的示例中，即使我们从未将备注映射到\
  \ `ListView`，我们也能检索到联系人的姓名和备注。当我们为适配器设置游标时，我们选择了所有可用字段。在实践中，你并不需要所有字段，因此应将查询限制为仅查询将要使用的字段。但在这个案例中，我们查询的字段数量超过了在\
  \ `ListView` 中显示所需的数量，这样我们就可以在按钮回调中轻松访问其他字段。\n\n#### 从 `ListView` 读取选中项的另一种方法\n\n\
  Android 1.6 引入了另一种从 `ListView` 检索选中行列表的方法：`getCheckItemIds()`。随后，在 Android 2.2 中，该方法被弃用，并替换为\
  \ `getCheckedItemIds()`。虽然名称变化细微，但使用该方法的方式基本相同。此外，在 Android 2.2 中，处理联系人的方式也发生了变化。在我们的下一个示例中，我们将使用\
  \ Android 2.2 的功能来展示示例的可能实现。列表 6–31 展示了 Java 代码。对于 `list.xml` 的 XML 布局，我们可以继续使用列表\
  \ 6–29 中的文件。\n\n**列表 6–31.** *从 `ListActivity` 读取用户输入的另一种方法*\n\n```\npublic class\
  \ ListViewActivity4 extends ListActivity\n{\n    private static final String TAG\
  \ = \"ListViewActivity4\";\n    private SimpleCursorAdapter adapter = null;\n  \
  \  private ListView lv = null;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n    \
  \    setContentView(R.layout.list);\n\n        lv = getListView();\n\n        String[]\
  \ projection = new String[] {Contacts._ID,\n                Contacts.DISPLAY_NAME};\n\
  \        Cursor c = managedQuery(Contacts.CONTENT_URI,\n                       \
  \ projection, null, null, Contacts.DISPLAY_NAME);\n\n        String[] cols = new\
  \ String[] {Contacts.DISPLAY_NAME};\n        int[]    views = new int[]       {android.R.id.text1};\n\
  \n        adapter = new SimpleCursorAdapter(this,\n                android.R.layout.simple_list_item_multiple_choice,\n\
  \                c, cols, views);\n\n        this.setListAdapter(adapter);\n\n \
  \       lv.setChoiceMode(ListView.CHOICE_MODE_MULTIPLE);\n    }\n\n    public void\
  \ doClick(View view) {\n        if(!adapter.hasStableIds()) {\n            Log.v(TAG,\
  \ \"Data is not stable\");\n            return;\n        }\n        long[] viewItems\
  \ = lv.getCheckedItemIds();\n        for(int i=0; i<viewItems.length; i++) {\n \
  \           Uri selectedPerson = ContentUris.withAppendedId(\n                 \
  \   Contacts.CONTENT_URI, viewItems[i]);\n\n            Log.v(TAG, selectedPerson.toString()\
  \ + \" is checked.\");\n        }\n    }\n}\n```\n\n在这个示例应用中，当我们点击按钮时，回调函数会调用 `getCheckedItemIds()`\
  \ 方法。而在上一个示例中，我们得到的是 `ListView` 中被选中项的位置数组。这一次，我们得到的是适配器中那些在 `ListView` 里被选中的记录的\
  \ ID 数组。我们现在可以绕过 `ListView` 和游标，因为这些 ID 可以与内容提供者一起使用，从而执行我们想要的任何操作。在我们的示例中，我们只是构建了一个\
  \ URI，该 URI 代表来自联系人内容提供者的特定记录，并将该 URI 写入 LogCat。我们本可以直接使用内容提供者对数据进行操作。这种技术同样适用于旧版联系人内容提供者和\
  \ Android 1.6 的 `getCheckItemIds()` 方法。\n\n在这个示例中，我们另一个不同的做法是，在创建游标时只选择了少数几个列。这是常规做法，因为你不想读取不必要的数据。从该示例中需要指出的最后一点是，`getCheckedItemIds()`\
  \ 方法要求适配器中的底层数据是稳定的。因此，强烈建议在调用 `ListView` 的 `getCheckedItemIds()` 之前，先调用适配器的 `hasStableIds()`。在我们的示例中，我们走了一条捷径，仅记录事实并返回。实际上，你需要执行更智能的操作，例如，可能启动一个后台线程进行重试，并显示一个对话框指示正在处理。\n\
  \n我们已经向你展示了如何在多种场景下使用 `ListView`。我们展示了适配器为支持 `ListView` 承担了大量工作。接下来，我们将从 `GridView`\
  \ 开始，介绍其他类型的列表控件。\n\n\n\n#### `GridView` 控件\n\n大多数小部件工具包都提供了一种或多种基于网格的控件。Android\
  \ 有一个 `GridView` 控件，它可以以网格的形式显示数据。请注意，虽然我们在此处使用了*数据*这一术语，但网格的内容可以是文本、图像等。\n\n`GridView`\
  \ 控件以网格形式显示信息。`GridView` 的使用模式是在 XML 布局中定义网格（参见清单 6–32），然后使用 `android.widget.ListAdapter`\
  \ 将数据绑定到网格。别忘了在 `AndroidManifest.xml` 文件中添加 `uses-permission` 标签，以使此示例生效。\n\n**清单\
  \ 6–32.** *XML 布局中 `GridView` 的定义及关联的 Java 代码*\n\n```\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<!-- 此文件位于 /res/layout/gridview.xml -->\n<GridView\n    android:id=\"\
  @+id/gridview\"\n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"\
  fill_parent\"\n    android:padding=\"10px\"\n    android:verticalSpacing=\"10px\"\
  \n    android:horizontalSpacing=\"10px\"\n    android:numColumns=\"auto_fit\"\n\
  \    android:columnWidth=\"100px\"\n    android:stretchMode=\"columnWidth\"\n  \
  \  android:gravity=\"center\"\n    />\n```\n\n```\npublic class GridViewActivity\
  \ extends Activity\n{\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\n\
  \    {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.gridview);\n\
  \n        GridView gv = (GridView)findViewById(R.id.gridview);\n\n        Cursor\
  \ c = managedQuery(Contacts.CONTENT_URI,\n                        null, null, null,\
  \ Contacts.DISPLAY_NAME);\n\n        String[] cols = new String[] {Contacts.DISPLAY_NAME};\n\
  \        int[]    views = new int[]      {android.R.id.text1};\n\n        SimpleCursorAdapter\
  \ adapter = new SimpleCursorAdapter(this,\n                android.R.layout.simple_list_item_1,\n\
  \                c, cols, views);\n\n        gv.setAdapter(adapter);\n    }\n}\n\
  ```\n\n清单 6–32 在 XML 布局中定义了一个简单的 `GridView`。然后将该网格加载到 Activity 的内容视图中。生成的用户界面如图\
  \ 6–13 所示。\n\n![图片](img/9781430239307_Fig06-13.jpg)\n\n**图 6–13.** *填充了联系人信息的 `GridView`*\n\
  \n图 6–13 中显示的网格展示了设备上联系人的姓名。我们决定显示一个包含联系人姓名的 `TextView`，但你也可以轻松生成一个填充了图像或其他控件的网格。我们再次利用了\
  \ Android 中预定义的布局。事实上，这个示例与清单 6–27 非常相似，但有几个重要的区别。首先，我们的 `GridViewActivity` 继承自\
  \ `Activity`，而不是 `ListActivity`。其次，我们必须调用 `setContentView()` 来为我们的 `GridView` 设置布局；没有可用的默认视图。最后，要设置适配器，我们在\
  \ `GridView` 对象上调用 `setAdapter()`，而不是在 `Activity` 上调用 `setListAdapter()`。\n\n你肯定已经注意到，网格使用的适配器是一个\
  \ `ListAdapter`。列表通常是一维的，而网格是二维的。因此我们可以得出结论，网格实际上显示的是面向列表的数据。事实证明，列表是按行显示的。也就是说，列表先填充第一行，然后第二行，以此类推。\n\
  \n和之前一样，我们有一个列表控件，它与适配器协同工作来处理数据管理和子视图的生成。我们之前使用的相同技术同样适用于 `GridView`。不过有一个例外与选择相关：无法像我们在清单\
  \ 6–30 中那样在 `GridView` 中指定多项选择。\n\n#### `Spinner` 控件\n\n`Spinner` 控件类似于下拉菜单。它通常用于从相对较短的选择列表中进行选择。如果选项列表太长而无法完全显示，系统会自动为你添加一个滚动条。你可以通过\
  \ XML 布局实例化一个 `Spinner`，如下所示：\n\n```\n<Spinner\n    android:id=\"@+id/spinner\"\
  \  android:prompt=\"@string/spinnerprompt\"\n    android:layout_width=\"wrap_content\"\
  \  android:layout_height=\"wrap_content\" />\n```\n\n虽然从技术上讲，spinner 是一个列表控件，但它对你来说更像是一个简单的\
  \ `TextView` 控件。换句话说，当 spinner 处于静止状态时，只会显示一个值。spinner 的目的是允许用户从一组预设值中进行选择：当用户点击小箭头时，会显示一个列表，用户可以选择一个新值。填充此列表的方式与其他列表控件相同：使用适配器。\n\
  \n由于 spinner 通常像下拉菜单一样使用，因此常见做法是让适配器从资源文件中获取列表选项。展示如何使用资源文件设置 spinner 的示例见清单 6–33。请注意名为\
  \ `android:prompt` 的新属性，它用于在列表顶部设置提示文字，供用户选择。我们的 spinner 提示的实际文本位于 `/res/values/strings.xml`\
  \ 文件中。正如你所料，`Spinner` 类也提供了在代码中设置提示的方法。\n\n**清单 6–33.** *从资源文件创建 Spinner 的代码*\n\n\
  ```\npublic class SpinnerActivity extends Activity {\n    /** 当 Activity 首次被创建时调用。\
  \ */\n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n   \
  \     super.onCreate(savedInstanceState);\n        setContentView(R.layout.spinner);\n\
  \n        Spinner spinner = (Spinner)findViewById(R.id.spinner);\n\n        ArrayAdapter<CharSequence>\
  \ adapter = ArrayAdapter.createFromResource(this,\n                R.array.planets,\
  \ android.R.layout.simple_spinner_item);\n\n        adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);\n\
  \n        spinner.setAdapter(adapter);\n    }\n}\n```\n\n你可能还记得在清单 6–26 中看到过 `planets.xml`\
  \ 文件。在这个示例中，我们展示了如何创建一个 `Spinner` 控件；适配器被设置好然后关联到 spinner。实际效果请参见图 6–14。\n\n![图片](img/9781430239307_Fig06-14.jpg)\n\
  \n**图 6–14.** *用于选择行星的 Spinner*\n\n与我们之前的列表控件的一个不同之处在于，使用 spinner 时需要处理一个额外的布局。图\
  \ 6–14 的左侧显示了 spinner 的正常模式，即显示当前选中项。在这种情况下，当前选中项是土星。在该词旁边有一个向下箭头，表示此控件是一个 spinner，可以用来弹出一个列表以选择不同的值。第一个布局作为参数传递给\
  \ `ArrayAdapter.createFromResource()` 方法，定义了 spinner 在正常模式下的外观。图 6–14 的右侧展示了 spinner\
  \ 处于弹出列表模式，等待用户选择新值。此列表的布局通过 `setDropDownViewResource()` 方法设置。同样在这个例子中，我们使用了 Android\
  \ 提供的布局来满足这两种需求，因此如果你想查看这两种布局的定义，可以访问 Android 的 `res/layout` 文件夹。当然，你也可以为它们指定自己的布局定义，以达到你想要的效果。\n\
  \n\n\n### Gallery 控件\n\n`Gallery` 控件是一个可水平滚动的列表控件，其焦点始终位于列表中央。在触摸模式下，该控件通常用作照片画廊。你可以通过\
  \ XML 布局或代码来实例化一个 `Gallery`：\n\n```\n<Gallery\n    android:id=\"@+id/gallery\"\n\
  \    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  \n/>\n```\n\n`Gallery` 控件通常用于显示图片，因此你的适配器很可能需要专门针对图片进行定制。我们将在下一节关于自定义适配器的内容中展示一个自定义图片适配器的示例。从视觉上看，`Gallery`\
  \ 控件的外观如图 6-15 所示。\n\n![图片](img/9781430239307_Fig06-15.jpg)\n\n**图 6-15.** *显示海牛图片的画廊*\n\
  \n### 创建自定义适配器\n\nAndroid 中的标准适配器易于使用，但存在一些局限性。为解决此问题，Android 提供了一个名为 `BaseAdapter`\
  \ 的抽象类，当需要自定义适配器时，你可以对其进行扩展。如果你有特殊的数据管理需求，或者希望更精细地控制子视图的显示方式，就可以使用自定义适配器。此外，你也可以通过使用缓存技术来提升性能，从而使用自定义适配器。接下来，我们将展示如何构建一个自定义适配器。\n\
  \n代码清单 6-34 展示了自定义适配器的 XML 布局和 Java 代码可能呈现的样子。在本示例中，我们的适配器将处理海牛图片，因此我们将其命名为 `ManateeAdapter`。我们还将在一个\
  \ Activity 中创建该适配器。\n\n**代码清单 6-34.** *我们的自定义适配器：`ManateeAdapter`*\n\n```\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<!-- 该文件位于 /res/layout/gridviewcustom.xml\
  \ -->\n<GridView\n    android:id=\"@+id/gridview\"\n    android:layout_width=\"\
  fill_parent\"\n    android:layout_height=\"fill_parent\"\n    android:padding=\"\
  10dip\"\n    android:verticalSpacing=\"10dip\"\n    android:horizontalSpacing=\"\
  10dip\"\n    android:numColumns=\"auto_fit\"\n    android:gravity=\"center\"\n \
  \   />\n```\n\n```\npublic class GridViewCustomAdapter extends Activity\n{\n   \
  \ @Override\n    protected void onCreate(Bundle savedInstanceState)\n    {\n   \
  \     super.onCreate(savedInstanceState);\n        setContentView(R.layout.gridviewcustom);\n\
  \n        GridView gv = (GridView)findViewById(R.id.gridview);\n\n        ManateeAdapter\
  \ adapter = new ManateeAdapter(this);\n\n        gv.setAdapter(adapter);\n    }\n\
  \n    public static class ManateeAdapter extends BaseAdapter {\n        private\
  \ static final String TAG = \"ManateeAdapter\";\n        private static int convertViewCounter\
  \ = 0;\n        private Context mContext;\n        private LayoutInflater mInflater;\n\
  \n        static class ViewHolder {\n            ImageView image;\n        }\n\n\
  \        private int[] manatees = {\n                R.drawable.manatee00, R.drawable.manatee01,\
  \ R.drawable.manatee02,\n                R.drawable.manatee03, R.drawable.manatee04,\
  \ R.drawable.manatee05,\n                R.drawable.manatee06, R.drawable.manatee07,\
  \ R.drawable.manatee08,\n                R.drawable.manatee09, R.drawable.manatee10,\
  \ R.drawable.manatee11,\n                R.drawable.manatee12, R.drawable.manatee13,\
  \ R.drawable.manatee14,\n                R.drawable.manatee15, R.drawable.manatee16,\
  \ R.drawable.manatee17,\n                R.drawable.manatee18, R.drawable.manatee19,\
  \ R.drawable.manatee20,\n                R.drawable.manatee21, R.drawable.manatee22,\
  \ R.drawable.manatee23,\n                R.drawable.manatee24, R.drawable.manatee25,\
  \ R.drawable.manatee26,\n                R.drawable.manatee27, R.drawable.manatee28,\
  \ R.drawable.manatee29,\n                R.drawable.manatee30, R.drawable.manatee31,\
  \ R.drawable.manatee32,\n                R.drawable.manatee33 };\n\n        private\
  \ Bitmap[] manateeImages = new Bitmap[manatees.length];\n        private Bitmap[]\
  \ manateeThumbs = new Bitmap[manatees.length];\n\n        public ManateeAdapter(Context\
  \ context) {\n            Log.v(TAG, \"Constructing ManateeAdapter\");\n       \
  \     this.mContext = context;\n            mInflater = LayoutInflater.from(context);\n\
  \n            for(int i=0; i<manatees.length; i++) {\n                manateeImages[i]\
  \ = BitmapFactory.decodeResource(\n                        context.getResources(),\
  \ manatees[i]);\n                manateeThumbs[i] = Bitmap.createScaledBitmap(manateeImages[i],\n\
  \                        100, 100, false);\n            }\n        }\n\n       \
  \ @Override\n        public int getCount() {\n            Log.v(TAG, \"in getCount()\"\
  );\n            return manatees.length;\n        }\n\n        public int getViewTypeCount()\
  \ {\n            Log.v(TAG, \"in getViewTypeCount()\");\n            return 1;\n\
  \        }\n```\n\n\n\n```java\npublic int getItemViewType(int position) {\n   \
  \ Log.v(TAG, \"in getItemViewType() for position \" + position);\n    return 0;\n\
  }\n\n@Override\npublic View getView(int position, View convertView, ViewGroup parent)\
  \ {\n    ViewHolder holder;\n\n    Log.v(TAG, \"in getView for position \" + position\
  \ +\n            \", convertView is \" +\n            ((convertView == null)?\"\
  null\":\"being recycled\"));\n\n    if (convertView == null) {\n        convertView\
  \ = mInflater.inflate(R.layout.gridimage, null);\n        convertViewCounter++;\n\
  \        Log.v(TAG, convertViewCounter + \" convertViews have been created\");\n\
  \n        holder = new ViewHolder();\n        holder.image = (ImageView) convertView.findViewById(R.id.gridImageView);\n\
  \n        convertView.setTag(holder);\n    } else {\n        holder = (ViewHolder)\
  \ convertView.getTag();\n    }\n\n    holder.image.setImageBitmap( manateeThumbs[position]\
  \ );\n\n    return convertView;\n}\n\n@Override\npublic Object getItem(int position)\
  \ {\n    Log.v(TAG, \"in getItem() for position \" + position);\n    return manateeImages[position];\n\
  }\n\n@Override\npublic long getItemId(int position) {\n    Log.v(TAG, \"in getItemId()\
  \ for position \" + position);\n    return position;\n}\n```\n\n当你运行这个应用程序时，你应该会看到一个显示效果，如图\
  \ 6–16 所示。\n\n![Image](img/9781430239307_Fig06-16.jpg)\n\n**图 6–16.** *一个展示海牛图像的\
  \ `GridView`*\n\n这个例子虽然看起来相对简单，但有很多值得解释的地方。我们先从 `Activity` 类开始，它与本章这一小节中我们一直在使用的类非常相似。主布局来自\
  \ `gridviewcustom.xml`，其中只包含一个 `GridView` 定义。我们需要从布局内部获取对 `GridView` 的引用，因此我们定义并设置了\
  \ `gv`。我们实例化了 `ManateeAdapter`，将上下文传递给它，并将适配器设置到 `GridView` 上。到目前为止，这都是非常标准的操作，不过你已经注意到，我们的自定义适配器在创建时使用的参数远少于预定义的适配器。这主要是因为我们对这个特定适配器拥有完全的控制权，并且它仅用于这个应用程序。如果我们要让这个适配器更加通用，很可能会设置更多参数。但让我们继续往下看。\n\
  \n适配器内部的工作是管理向 Android `View` 对象传递数据。列表控件（此处为 `GridView`）会使用这些 `View` 对象。数据来自某个数据源。在之前的例子中，数据通过传递给适配器的游标对象传入。而在我们这个自定义示例中，适配器完全了解数据及其来源。列表控件会询问信息，以便知道如何构建用户界面。当列表控件有不再需要的视图时，它也会友好地将这些视图传入以进行回收。一开始你可能觉得适配器必须知道如何构建视图有些奇怪，但最终，这一切都是合理的。\n\
  \n当我们实例化自定义适配器 `ManateeAdapter` 时，通常的做法是将上下文传入，并由适配器保存它。在需要时能够使用上下文通常非常有用。我们希望适配器做的第二件事是持有\
  \ `inflater`（布局填充器）。这有助于在需要创建新视图返回给列表控件时提高性能。适配器中典型的第三件事是创建一个 `ViewHolder` 对象，用于容纳我们正在管理的数据所对应的\
  \ `View` 对象。在这个例子中，我们只存储了一个 `ImageView`，但如果需要处理额外的字段，我们会把它们添加到 `ViewHolder` 的定义中。例如，如果有一个\
  \ `ListView`，每一行包含一个 `ImageView` 和两个 `TextView`，那么我们的 `ViewHolder` 就会包含一个 `ImageView`\
  \ 和两个 `TextView`。\n\n由于我们在这个适配器中处理的是海牛图像，我们在构造时设置了一个资源 ID 数组来创建位图。我们还定义了一个位图数组作为我们的数据列表。\n\
  \n从 `ManateeAdapter` 的构造函数可以看出，我们保存了上下文，创建并持有 `inflater`，然后遍历图像资源 ID 并构建一个位图数组。这个位图数组就是我们的数据。\n\
  \n正如你之前所学，设置适配器会导致我们的 `GridView` 调用适配器上的方法来设置自身，以便显示数据。例如，`gv` 会调用适配器的 `getCount()`\
  \ 方法来确定有多少个对象需要显示。它还会调用 `getViewTypeCount()` 方法来确定 `GridView` 中可以显示多少种不同类型的视图。在这个示例中，我们将此值设为\
  \ 1。然而，如果我们有一个 `ListView` 并且希望在常规数据行之间放置分隔符，那么我们将有两种类型的视图，并且需要从 `getViewTypeCount()`\
  \ 方法返回 2。你可以根据需要设置任意多种不同的视图类型，只要正确地从这个方法返回对应的计数即可。与此方法相关的还有 `getItemViewType()`。我们刚刚提到可以从适配器返回多种类型的视图，但为了简单起见，`getItemViewType()`\
  \ 只需要返回一个整数值，来指明数据中某个特定位置对应的是哪种视图类型。因此，如果我们有两种类型的视图需要返回，`getItemViewType()` 就需要返回\
  \ 0 或 1 来指示具体类型。如果我们有三种类型的视图，这个方法需要返回 0、1 或 2。\n\n如果我们的适配器在 `ListView` 中处理分隔符，它必须将这些分隔符视为数据。这意味着数据中有一个位置被分隔符占据。当列表控件调用\
  \ `getView()` 来获取该位置对应的视图时，`getView()` 需要返回一个分隔符视图，而不是常规的数据视图。并且当在 `getItemViewType()`\
  \ 中被问及该位置的视图类型时，我们需要返回我们预先决定对应于该视图类型的整数值。如果你使用了分隔符，另一件你应该做的事是实现 `isEnabled()` 方法。对于列表项，该方法应返回\
  \ `true`；对于分隔符，应返回 `false`，因为分隔符不应被选中或点击。\n\n`ManateeAdapter` 中最有趣的方法是 `getView()`\
  \ 方法调用。一旦 `gv` 确定了有多少项可用，它就开始请求数据。现在，我们来谈谈视图回收。列表控件只能在屏幕上显示尽可能多的子视图。这意味着没有必要为适配器中的每一份数据都调用\
  \ `getView()`；只为能够显示的项数调用 `getView()` 才是合理的。当 `gv` 从适配器获取子视图时，它正在确定屏幕上能容纳多少个视图。当屏幕被子视图填满时，`gv`\
  \ 就会停止调用 `getView()`。\n\n\n\n如果你在启动这个示例应用后查看 `LogCat`，你会看到各种调用，但你也会发现 `getView()`\
  \ 在所有图片请求完成之前就停止了调用。如果你开始在 `GridView` 中上下滚动，你会在 `LogCat` 中看到更多对 `getView()` 的调用，并且你会注意到，一旦我们创建了一定数量的子视图，`getView()`\
  \ 被调用时 `convertView` 会被设置为某个非空值。这意味着我们现在正在回收子视图——这对性能非常有利。\n\n如果我们在 `getView()`\
  \ 中从 `gv` 获取到一个非空的 `convertView` 值，这意味着 `gv` 正在回收该视图。通过重用传入的视图，我们避免了填充 XML 布局，也避免了查找\
  \ `ImageView`。通过将一个 `ViewHolder` 对象与我们返回的 `View` 关联，我们可以更快地在下一次视图被回传时完成回收。在 `getView()`\
  \ 中，我们只需重新获取 `ViewHolder` 并将正确的数据分配到视图中。\n\n对于这个示例，我们想展示的是，放入视图中的数据并不一定与数据源中的完全一致。`createScaledBitmap()`\
  \ 方法会为显示目的创建一个更小版本的数据。关键在于，我们的列表控件不会调用 `getItem()` 方法。如果用户对列表控件执行操作，我们的其他代码会调用该方法来对数据进行处理。再次强调，对于任何适配器，理解其行为非常重要。你不一定非要依赖适配器中由\
  \ `getView()` 创建的列表控件视图中的数据。有时，你需要调用适配器的 `getItem()` 方法来获取实际要操作的数据。而有时，就像我们在之前的\
  \ `ListView` 示例中所做的那样，你可能希望从游标中获取数据。这完全取决于适配器以及数据的最终来源。尽管我们在示例中使用了 `createScaledBitmap()`\
  \ 方法，但 Android 2.2 引入了另一个在这里可能很有用的类：`ThumbnailUtils`。这个类提供了一些从位图和视频生成缩略图的静态方法。\n\
  \n这个示例中还有最后一点需要指出，即 `getItemId()` 方法的调用。在我们之前使用 `ListView` 和联系人的示例中，项目 ID 是来自内容提供者的\
  \ `_ID` 值。对于这个示例，我们并不需要除位置之外的其他值作为项目 ID。项目 ID 的作用是提供一种机制，使数据可以独立于其位置被引用。当数据存在于该适配器之外时（就像我们的联系人那样），这一点尤其重要。当我们能像处理海牛图片那样直接控制数据，并且知道如何在应用中获取实际数据时，一个常见的简化做法就是直接将位置作为项目\
  \ ID。在我们的案例中尤其如此，因为我们甚至不允许添加或删除数据。\n\n### Android 中的其他控件\n\nAndroid 中有许多控件可供使用。我们到目前为止已经介绍了相当多，更多的内容将在后续章节中介绍（例如第\
  \ 22 章中的 `MapView`，以及第 24 章中的 `VideoView` 和 `MediaController`）。你会发现，其他控件由于都继承自 `View`，与我们这里介绍的有许多共同之处。现在，我们仅提几个你可能想自行深入探索的控件。\n\
  \n`ScrollView` 是一个用于设置带有垂直滚动条的 `View` 容器的控件。当你内容太多无法在一屏内显示时，这非常有用。关于如何使用它，请参阅本章的“参考资料”部分中\
  \ Romain Guy 博客文章的链接。\n\n`ProgressBar` 和 `RatingBar` 控件类似于滑块。前者用于直观显示某些操作的进度（例如文件下载或音乐播放），后者则用于显示星级评分。\n\
  \n`Chronometer` 控件是一个正向计时的计时器。如果你想显示倒计时，可以使用 `CountDownTimer` 类，但它不是一个 `View` 类。\n\
  \nAndroid 4.0 中新增了 `Switch` 控件，它的功能类似于 `ToggleButton`，但在视觉上呈现左右滑动样式。同样在 4.0 中新增的还有\
  \ `Space` 视图，这是一个轻量级视图，可用于在布局中更轻松地在其他视图之间创建间距。\n\n`WebView` 是一个非常特殊的用于显示 HTML 的视图。它的功能远不止于此，包括处理\
  \ Cookie 和 JavaScript，以及与应用程序中的 Java 代码进行交互。但是，在你在应用程序中实现一个 Web 浏览器之前，你应该仔细考虑调用设备上的\
  \ Web 浏览器，让它来完成所有繁重的工作。\n\n至此，本章对控件的介绍就结束了。接下来，我们将讨论用于修改控件外观和感觉的样式与主题，然后介绍用于在屏幕上排列控件的布局。\n\
  \n### 样式和主题\n\nAndroid 提供了多种方式来改变应用程序中视图的样式。我们首先介绍在字符串中使用标记标签，然后介绍如何使用 spannable\
  \ 来更改文本的特定视觉属性。但是，如果你想使用一个通用规范来控制多个视图或整个 Activity 或应用程序的外观，该怎么办呢？我们将讨论 Android 样式和主题，向你展示如何操作。\n\
  \n\n\n#### 使用样式\n\n有时候，你可能想要高亮或设置`View`内容的样式。你可以通过静态或动态方式来实现。静态方式下，你可以直接在字符串资源中对字符串应用标记，如下所示：\n\
  \n`<string name=\"styledText\"><i>静态</i>样式在<b>TextView</b>中。</string>`\n\n然后你可以在\
  \ XML 或代码中引用它。请注意，字符串资源中可以使用以下 HTML 标签：`<i>`（斜体）、`<b>`（粗体）和`<u>`（下划线），以及`<sup>`（上标）、`<sub>`（下标）、`<strike>`（删除线）、`<big>`（放大）、`<small>`（缩小）和`<monospace>`（等宽字体）。你甚至可以嵌套使用它们，例如，实现小号上标。这不仅适用于`TextView`，也适用于其他视图，比如按钮。图\
  \ 6-17 展示了使用本节中的多个示例后，样式化和主题化文本的效果。\n\n![图片](img/9781430239307_Fig06-17.jpg)\n\n\
  **图 6-17.** *样式和主题示例*\n\n以编程方式设置`TextView`控件内容的样式需要额外一些工作，但提供了更大的灵活性（参见代码清单 6-35），因为你可以在运行时设置样式。不过，这种灵活性只能应用于`Spannable`对象，而`EditText`通常以这种方式管理内部文本，但`TextView`默认不使用`Spannable`。`Spannable`本质上是一个可以应用样式的`String`。要让`TextView`将文本存储为`Spannable`，你可以这样调用`setText()`：\n\
  \n`tv.setText(\"这段文本存储在 Spannable 中\", TextView.BufferType.SPANNABLE);`\n\n然后，当你调用`tv.getText()`时，会得到一个`Spannable`对象。\n\
  \n如代码清单 6-35 所示，你可以获取`EditText`的内容（作为`Spannable`对象），然后为部分文本设置样式。该清单中的代码将文本样式设置为粗体和斜体，并将背景设置为红色。你可以像之前描述\
  \ HTML 标签那样使用所有的样式选项，甚至更多。\n\n**代码清单 6-35.** *动态为`EditText`内容应用样式*\n\n```\nEditText\
  \ et =(EditText)this.findViewById(R.id.et);\net.setText(\"动态设置 EditText 内容的样式\"\
  );\nSpannable spn = (Spannable) et.getText();\nspn.setSpan(new BackgroundColorSpan(Color.RED),\
  \ 0, 7,\n             Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\nspn.setSpan(new StyleSpan(android.graphics.Typeface.BOLD_ITALIC),\n\
  \             0, 7, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE);\n```\n\n这两种样式化技术只作用于它们所应用的单个视图。Android\
  \ 提供了一种样式机制来定义可在多个视图间复用的通用样式，同时还提供了一种主题机制，该机制基本上可以将一个样式应用于整个 Activity 或整个应用程序。首先，我们需要讨论样式。\n\
  \n***样式*** 是`View`属性的集合，它被赋予一个名称，这样你可以通过名称引用该集合，并将该样式按名称分配给视图。例如，代码清单 6-36 展示了一个保存在`/res/values`目录下的资源\
  \ XML 文件，我们可以将其用于所有错误消息。\n\n**代码清单 6-36.** *定义一个可在多个视图中使用的样式*\n\n```\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<resources>\n    <style name=\"ErrorText\">\n      \
  \  <item name=\"android:layout_width\">fill_parent</item>\n        <item name=\"\
  android:layout_height\">wrap_content</item>\n        <item name=\"android:textColor\"\
  >#FF0000</item>\n        <item name=\"android:typeface\">monospace</item>\n    </style>\n\
  </resources>\n```\n\n这里定义了视图的大小以及字体颜色（红色）和字体样式。请注意，`item`标签的`name`属性就是我们布局 XML 文件中使用的\
  \ XML 属性名称，而`item`标签的值不再需要双引号。现在，我们可以为错误`TextView`使用此样式，如代码清单 6-37 所示。\n\n**代码清单\
  \ 6-37.** *在视图中使用样式*\n\n```\n<TextView  android:id=\"@+id/errorText\"\n    style=\"\
  @style/ErrorText\"\n    android:text=\"目前没有错误\"\n    />\n```\n\n需要注意的是，在此`View`定义中，样式的属性名称不以`android:`开头。请留意这一点，因为似乎除了样式之外，其他所有属性都使用`android:`前缀。当应用程序中有许多视图共享同一样式时，在一个地方更改该样式会简单得多；你只需修改这一个资源文件中的样式属性即可。当然，你可以为各种控件创建许多不同的样式。例如，按钮可以共享一种通用样式，而菜单中的文本则可以共享另一种不同的通用样式。\n\
  \n样式的一个非常好的方面是你可以建立它们的层次结构。我们可以基于`ErrorText`样式定义一个新的样式，用于表示非常严重的错误消息。代码清单 6-38 展示了这可能的样子。\n\
  \n**代码清单 6-38.** *从父样式中定义新样式*\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <resources>\n    <style name=\"ErrorText.Danger\" >\n        <item name=\"android:textStyle\"\
  >bold</item>\n    </style>\n</resources>\n```\n\n这个示例表明，我们可以简单地通过使用父样式名称作为新样式名称的前缀来命名我们的子样式。因此，`ErrorText.Danger`是`ErrorText`的子样式，并继承了父样式的所有属性。然后它添加了一个新的`textStyle`属性。这个过程可以重复多次，从而创建一整套样式树。\n\
  \n与适配器布局的情况类似，Android 也提供了大量的样式供我们使用。要指定一个 Android 提供的样式，请使用如下语法：\n\n`style=\"@android:style/TextAppearance\"\
  `\n\n此样式设置了 Android 中文本的默认样式。要找到主控的 Android `styles.xml`文件，请访问`Android SDK/platforms/<android-version>/data/res/values/`文件夹。在此文件中，你会发现许多现成的样式可供使用或扩展。关于扩展\
  \ Android 提供的样式，这里有一个注意事项：之前使用前缀的方法不适用于 Android 提供的样式。相反，你必须使用`style`标签的`parent`属性，如下所示：\n\
  \n```\n<style name=\"CustomTextAppearance\" parent=\"@android:style/TextAppearance\"\
  >\n    <item  ... 在此处添加你的扩展内容 ...    />\n</style>\n```\n\n你不必总是将整个样式应用到你的视图上。你也可以选择只借用样式的一部分。例如，如果你想将`TextView`中的文本颜色设置为系统样式颜色，可以执行以下操作：\n\
  \n```\n<EditText id=\"@+id/et2\"\n    android:layout_width=\"fill_parent\"  android:layout_height=\"\
  wrap_content\"\n    android:textColor=\"?android:textColorSecondary\"\n    android:text=\"\
  @string/hello_world\" />\n```\n\n请注意，在这个例子中，`textColor`属性的值以`?`字符开头，而不是`@`字符。使用`?`字符是为了让\
  \ Android 知道要在当前主题中查找样式值。因为我们看到了`?android`，所以我们要在 Android 系统主题中查找此样式值。\n\n\n\n####\
  \ 使用主题\n\n样式的一个问题是，你需要为每个希望应用样式的视图定义添加 `style=\"@style/...\"` 属性规范。如果你有一些希望在整个 Activity\
  \ 或整个应用中应用的样式元素，则应使用主题。*主题*本质上就是广泛应用的样式；但在定义主题方面，它与样式完全相同。事实上，主题和样式相当可互换：你可以将主题扩展为样式，或将样式作为主题引用。通常，只有名称能提示某个样式是打算用作样式还是主题。\n\
  \n要为 Activity 或应用指定主题，你可以在项目的 `AndroidManifest.xml` 文件中的 `<activity>` 或 `<application>`\
  \ 标签内添加一个属性。代码可能如下所示：\n\n```\n<activity android:theme=\"@style/MyActivityTheme\"\
  >\n<application android:theme=\"@style/MyApplicationTheme\">\n<application android:theme=\"\
  @android:style/Theme.NoTitleBar\">\n```\n\n你可以在与 Android 提供的样式相同的文件夹中找到 Android\
  \ 提供的主题，主题位于名为 `themes.xml` 的文件中。查看主题文件内部时，你会看到大量定义的样式，其名称以 `Theme` 开头。你还会注意到，在\
  \ Android 提供的主题和样式内部，存在大量的扩展操作，这就是为什么你会看到诸如 `Theme.Dialog.AppError` 这样的样式名称。\n\n\
  至此，我们对 Android 控件集的讨论就结束了。正如我们在本章开头提到的，在 Android 中构建 UI 需要掌握两件事：控件集和布局管理器。在下一节中，我们将讨论\
  \ Android 布局管理器。\n\n### 理解布局管理器\n\nAndroid 提供了一组充当视图容器的视图类。这些容器类被称为*布局*（或*布局管理器*），每种布局都实现了特定的策略来管理其子视图的大小和位置。例如，`LinearLayout`\
  \ 类将其子视图水平或垂直地逐一排列。所有布局管理器都派生自 `View` 类，因此你可以将布局管理器相互嵌套。\n\nAndroid SDK 附带的布局管理器定义在表\
  \ 6-2 中。\n\n![Image](img/t0602.jpg)\n\n我们将在后续章节中讨论这些布局管理器。名为 `AbsoluteLayout` 的布局管理器已被弃用，本书将不再介绍。\n\
  \n#### LinearLayout 布局管理器\n\n`LinearLayout` 布局管理器是最基础的。该布局管理器根据 `orientation` 属性的值，将其子视图水平或垂直地组织起来。到目前为止，我们已经在多个示例中使用了\
  \ `LinearLayout`。列表 6-39 展示了一个水平配置的 `LinearLayout`。\n\n**列表 6-39.** *水平配置的 LinearLayout*\n\
  \n```\n<LinearLayout\n    android:orientation=\"horizontal\"\n    android:layout_width=\"\
  fill_parent\"  android:layout_height=\"wrap_content\">\n\n    <!-- 在此处添加子视图 -->\n\
  \n</LinearLayout>\n```\n\n你可以通过将 `orientation` 的值设置为 `vertical` 来创建一个垂直方向的 `LinearLayout`。由于布局管理器可以嵌套，例如，你可以构建一个包含多个水平布局管理器的垂直布局管理器，以创建一个填充表单，其中每一行都有一个标签和一个\
  \ `EditText` 控件相邻。每一行都是其自己的水平布局，但所有行作为一个集合则按垂直方向组织。\n\n##### 理解 Weight 和 Gravity\n\
  \n`orientation` 属性是 `LinearLayout` 布局管理器识别的第一个重要属性。其他可能影响子控件大小和位置的重要属性是 weight 和\
  \ gravity。\n\n你可以使用 *weight* 来为控件分配相对于容器中其他控件的大小重要性。假设一个容器有三个控件：一个的 weight 为 1，而其他两个的\
  \ weight 为 0。在这种情况下，weight 等于 1 的控件将消耗容器中的空白空间。*Gravity* 本质上是对齐。例如，如果你希望将标签的文本向右对齐，你可以将其\
  \ gravity 设置为 `right`。`gravity` 的可能值有很多，包括 `left`、`center`、`right`、`top`、`bottom`、`center_vertical`、`clip_horizontal`\
  \ 等。有关这些值以及其他 gravity 值的详细信息，请参阅“参考资料”部分的网页。\n\n![Image](img/square.jpg) **注意：**\
  \ 布局管理器扩展了 `android.widget.ViewGroup`，许多基于控件的容器类（例如 `ListView`）也是如此。尽管布局管理器和基于控件的容器扩展了相同的类，但布局管理器类严格处理控件的大小和位置，而不处理与子控件的用户交互。例如，比较\
  \ `LinearLayout` 和 `ListView` 控件。在屏幕上，它们看起来很相似，因为两者都可以垂直组织子视图。但 `ListView` 控件提供了供用户进行选择的\
  \ API，而 `LinearLayout` 则没有。换句话说，基于控件的容器（`ListView`）支持用户与容器中的项目进行交互，而布局管理器（`LinearLayout`）仅处理大小和定位。\n\
  \n现在让我们看一个涉及 weight 和 gravity 属性的示例（参见图 6-18）。\n\n![Image](img/9781430239307_Fig06-18.jpg)\n\
  \n**图 6-18.** *使用 `LinearLayout` 布局管理器*\n\n图 6-18 显示了三个利用 `LinearLayout` 的 UI，它们具有不同的\
  \ weight 和 gravity 设置。左侧的 UI 使用了 weight 和 gravity 的默认设置。第一个 UI 的 XML 布局如列表 6-40\
  \ 所示。\n\n**列表 6-40.** *在 LinearLayout 中垂直排列的三个文本字段，使用默认的 Weight 和 Gravity 值*\n\n\
  ```\n<LinearLayout\n    android:orientation=\"vertical\" android:layout_width=\"\
  fill_parent\"\n    android:layout_height=\"fill_parent\">\n\n    <EditText android:layout_width=\"\
  fill_parent\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
  one\"/>\n    <EditText android:layout_width=\"fill_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"two\"/>\n    <EditText android:layout_width=\"\
  fill_parent\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
  three\"/>\n</LinearLayout>\n```\n\n图 6-18 中间的 UI 使用了 weight 的默认值，但将容器中控件的 `android:gravity`\
  \ 分别设置为 `left`、`center` 和 `right`。最后一个示例将中间组件的 `android:layout_weight` 属性设置为 1.0，并将其他两个组件保留为默认值\
  \ 0.0（参见列表 6-41）。通过将中间组件的 weight 属性设置为 1.0，而将其他两个组件的 weight 属性保留为 0.0，我们指定了中间组件应占据容器中所有剩余的空白空间，而其他两个组件应保持其理想大小。\n\
  \n类似地，如果你希望容器中三个控件中的两个共享剩余的空白空间，你可以将这两个控件的 weight 设置为 1.0，并将第三个控件的 weight 设置为 0.0。最后，如果你希望三个组件均匀地共享空间，你可以将所有组件的\
  \ weight 值都设置为 1.0。这样做将使每个文本字段均匀扩展。\n\n\n\n##### **清单 6–41.** *配置了权重的 `LinearLayout`*\n\
  \n```\n<LinearLayout\n    android:orientation=\"vertical\" android:layout_width=\"\
  fill_parent\"\n    android:layout_height=\"fill_parent\">\n\n    <EditText android:layout_width=\"\
  fill_parent\" android:layout_weight=\"0.0\"\n    android:layout_height=\"wrap_content\"\
  \ android:text=\"one\"\n    android:gravity=\"left\"/>\n\n    <EditText android:layout_width=\"\
  fill_parent\" android:layout_weight=\"1.0\"\n    android:layout_height=\"wrap_content\"\
  \ android:text=\"two\"\n    android:gravity=\"center\"/>\n\n    <EditText android:layout_width=\"\
  fill_parent\" android:layout_weight=\"0.0\"\n    android:layout_height=\"wrap_content\"\
  \ android:text=\"three\"\n    android:gravity=\"right\"\n    />\n</LinearLayout>\n\
  ```\n\n##### `android:gravity` 与 `android:layout_gravity` 的区别\n\n请注意，Android 定义了两个相似的\
  \ gravity 属性：`android:gravity` 和 `android:layout_gravity`。它们的区别如下：`android:gravity`\
  \ 是视图自身使用的设置，而 `android:layout_gravity` 由容器（`android.view.ViewGroup`）使用。例如，你可以将\
  \ `android:gravity` 设置为 `center`，使 `EditText` 中的文本在控件内居中显示。同样地，你可以通过设置 `android:layout_gravity=\"\
  right\"` 将 `EditText` 对齐到 `LinearLayout`（容器）的最右侧。请参见 图 6–19 和 清单 6–42。\n\n![Image](img/9781430239307_Fig06-19.jpg)\n\
  \n**图 6–19.** *应用 gravity 设置*\n\n**清单 6–42.** *理解 `android:gravity` 与 `android:layout_gravity`\
  \ 的区别*\n\n```\n<LinearLayout\n    android:orientation=\"vertical\" android:layout_width=\"\
  fill_parent\"\n    android:layout_height=\"fill_parent\">\n\n    <EditText android:layout_width=\"\
  wrap_content\" android:gravity=\"center\"\n    android:layout_height=\"wrap_content\"\
  \ android:text=\"one\"\n android:layout_gravity=\"right\"/>\n</LinearLayout>\n```\n\
  \n如 图 6–19 所示，文本在 `EditText` 中居中显示，而该 `EditText` 则对齐到 `LinearLayout` 的右侧。\n\n####\
  \ `TableLayout` 布局管理器\n\n`TableLayout` 布局管理器是 `LinearLayout` 的扩展。该布局管理器将其子控件组织成行和列。清单\
  \ 6–43 展示了一个示例。\n\n**清单 6–43.** *一个简单的 `TableLayout`*\n\n```\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<TableLayout\n    android:layout_width=\"fill_parent\" \
  \ android:layout_height=\"fill_parent\">\n\n  <TableRow>\n    <TextView android:text=\"\
  名字：\"\n        android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  \ />\n\n    <EditText android:text=\"埃德加\"\n        android:layout_width=\"wrap_content\"\
  \  android:layout_height=\"wrap_content\" />\n  </TableRow>\n\n  <TableRow>\n  \
  \  <TextView android:text=\"姓氏：\"\n        android:layout_width=\"wrap_content\"\
  \  android:layout_height=\"wrap_content\" />\n\n    <EditText android:text=\"爱伦·坡\"\
  \n        android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  \ />\n  </TableRow>\n\n</TableLayout>\n```\n\n要使用此布局管理器，你需要创建一个 `TableLayout` 实例，并在其中放置\
  \ `TableRow` 元素。这些 `TableRow` 元素包含表格的控件。清单 6–43 对应的 UI 如 图 6–20 所示。\n\n![Image](img/9781430239307_Fig06-20.jpg)\n\
  \n**图 6–20.** *`TableLayout` 布局管理器*\n\n由于 `TableLayout` 的内容是按行而非按列定义的，因此 Android\
  \ 通过查找拥有最多单元格的行来确定表格的列数。例如，清单 6–44 创建了一个两行的表格，其中一行有两个单元格，另一行有三个单元格（参见 图 6–21）。在这种情况下，Android\
  \ 会创建一个两行三列的表格。第一行的最后一列是一个空单元格。\n\n**清单 6–44.** *一个不规则表格定义*\n\n```\n<TableLayout\n\
  \    android:layout_width=\"fill_parent\"  android:layout_height=\"fill_parent\"\
  >\n\n  <TableRow>\n    <TextView android:text=\"名字：\"\n        android:layout_width=\"\
  wrap_content\"  android:layout_height=\"wrap_content\" />\n\n    <EditText android:text=\"\
  埃德加\"\n        android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  \ />\n  </TableRow>\n\n  <TableRow>\n    <TextView android:text=\"姓氏：\"\n      \
  \  android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  \ />\n\n    <EditText android:text=\"艾伦\"\n        android:layout_width=\"wrap_content\"\
  \  android:layout_height=\"wrap_content\" />\n\n    <EditText android:text=\"坡\"\
  \n        android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  \ />\n  </TableRow>\n\n</TableLayout>\n```\n\n![Image](img/9781430239307_Fig06-21.jpg)\n\
  \n**图 6–21.** *一个不规则的 `TableLayout`*\n\n在 清单 6–43 和 清单 6–44 中，我们使用 `TableRow` 元素填充了\
  \ `TableLayout`。虽然这是常规用法，但你也可以将任何 `android.widget.View` 作为表格的子视图放置。例如，清单 6–45 创建了一个表格，其第一行是一个\
  \ `EditText`（参见 图 6–22）。\n\n**清单 6–45.** *使用 `EditText` 代替 `TableRow`*\n\n```\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<TableLayout\n    android:layout_width=\"\
  fill_parent\"  android:layout_height=\"fill_parent\"\n    android:stretchColumns=\"\
  0,1,2\" >\n\n  <EditText android:text=\"全名：\"\n        android:layout_width=\"wrap_content\"\
  \  android:layout_height=\"wrap_content\" />\n\n  <TableRow>\n    <TextView android:text=\"\
  埃德加\"\n        android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  \ />\n\n    <TextView android:text=\"艾伦\"\n        android:layout_width=\"wrap_content\"\
  \  android:layout_height=\"wrap_content\" />\n\n    <TextView android:text=\"坡\"\
  \n        android:layout_width=\"wrap_content\"  android:layout_height=\"wrap_content\"\
  \ />\n  </TableRow>\n\n</TableLayout>\n```\n\n![Image](img/9781430239307_Fig06-22.jpg)\n\
  \n\n\n**图 6–22.** 作为 `TableLayout` 子元素的 `EditText`\n\n清单 6–45 的用户界面显示在图 6–22 中。请注意，即使我们在\
  \ XML 布局中没有指定，`EditText` 也占据了屏幕的整个宽度。这是因为 `TableLayout` 的子元素总是横跨整行。换句话说，`TableLayout`\
  \ 的子元素可以指定 `android:layout_width=\"wrap_content\"`（就像我们对 `EditText` 所做的那样），但这不会影响实际布局——它们会被强制采用\
  \ `fill_parent`。不过，它们可以设置 `android:layout_height`。\n\n由于表格的内容在设计时并不总是已知，`TableLayout`\
  \ 提供了几个属性来帮助控制表格的布局。例如，清单 6–45 将 `TableLayout` 上的 `android:stretchColumns` 属性设置为\
  \ `\"0,1,2\"`。这向 `TableLayout` 发出提示：列 0、1 和 2 可以根据表格内容的需要进行拉伸。如果我们在清单 6–45 中没有使用\
  \ `stretchColumns`，就会看到 `\"EdgarAllenPoe\"` 被挤在一起。从技术上讲，第二行占据了整个宽度，但如果没有 `stretchColumns`，三个\
  \ `TextView` 就不会分散排列。\n\n类似地，你可以设置 `android:shrinkColumns`，以便在其它列需要更多空间时，将某一列或多列的内容换行。你也可以设置\
  \ `android:collapseColumns` 使某些列不可见。请注意，列采用从零开始的索引方案进行标识。\n\n`TableLayout` 还提供了\
  \ `android:layout_span`。你可以使用此属性让一个单元格跨越多列。该字段类似于 HTML 的 `colspan` 属性。\n\n有时，你可能还需要在单元格或控件的内容之间提供间距。Android\
  \ SDK 通过 `android:padding` 及其同类属性支持这一点。`android:padding` 让你可以控制视图外部边界与其内容之间的空间（参见清单\
  \ 6–46）。\n\n**清单 6–46.** *使用 `android:padding`*\n\n```\n<LinearLayout\n    android:orientation=\"\
  vertical\" android:layout_width=\"fill_parent\"\n    android:layout_height=\"fill_parent\"\
  >\n\n    <EditText android:text=\"one\"\n    android:layout_width=\"wrap_content\"\
  \  android:layout_height=\"wrap_content\"\n    android:padding=\"40px\" />\n</LinearLayout>\n\
  ```\n\n清单 6–46 将内边距设置为 `40px`。这在 `EditText` 控件的外部边界与其内部显示的文本之间创建了 40 像素的空白区域。图 6–23\
  \ 展示了同一个 `EditText` 的两个不同内边距值。左侧的用户界面未设置任何内边距，右侧的用户界面设置了 `android:padding=\"40px\"\
  `。\n\n![Image](img/9781430239307_Fig06-23.jpg)\n\n**图 6–23.** *使用内边距*\n\n`android:padding`\
  \ 为所有边设置内边距：左、右、上、下。你可以通过使用 `android:leftPadding`、`android:rightPadding`、`android:topPadding`\
  \ 和 `android:bottomPadding` 来控制每一侧的内边距。\n\nAndroid 还定义了 `android:layout_margin`，它与\
  \ `android:padding` 类似。实际上，`android:padding` / `android:layout_margin` 类似于 `android:gravity`\
  \ / `android:layout_gravity`，但前者针对视图，后者针对容器。\n\n最后，内边距值始终设置为尺寸类型，通常是 `dp`、`px` 或\
  \ `sp`。我们在第 3 章中介绍了尺寸类型。\n\n#### RelativeLayout 布局管理器\n\n另一个有趣的布局管理器是 `RelativeLayout`。顾名思义，此布局管理器实现了一种策略，即容器中的控件相对于容器或容器中的另一个控件进行布局。清单\
  \ 6–47 和图 6–24 展示了一个示例。\n\n**清单 6–47.** *使用 `RelativeLayout` 布局管理器*\n\n```\n<RelativeLayout\n\
  \        android:layout_width=\"fill_parent\"\n        android:layout_height=\"\
  wrap_content\">\n\n    <TextView android:id=\"@+id/userNameLbl\"\n        android:layout_width=\"\
  fill_parent\"  android:layout_height=\"wrap_content\"\n        android:text=\"Username:\
  \ \"\n        android:layout_alignParentTop=\"true\" />\n\n    <EditText android:id=\"\
  @+id/userNameText\"\n        android:layout_width=\"fill_parent\"  android:layout_height=\"\
  wrap_content\"\n        android:layout_toRightOf=\"@id/userNameLbl\" />\n\n    <TextView\
  \ android:id=\"@+id/pwdLbl\"\n        android:layout_width=\"wrap_content\"  android:layout_height=\"\
  wrap_content\"\n        android:layout_below=\"@id/userNameText\"\n        android:text=\"\
  Password: \" />\n\n    <EditText android:id=\"@+id/pwdText\"\n        android:layout_width=\"\
  fill_parent\"  android:layout_height=\"wrap_content\"\n        android:layout_toRightOf=\"\
  @id/pwdLbl\"\n        android:layout_below=\"@id/userNameText\" />\n\n    <TextView\
  \ android:id=\"@+id/pwdCriteria\"\n        android:layout_width=\"fill_parent\"\
  \  android:layout_height=\"wrap_content\"\n        android:layout_below=\"@id/pwdText\"\
  \n        android:text=\"Password Criteria... \" />\n\n    <TextView android:id=\"\
  @+id/disclaimerLbl\"\n        android:layout_width=\"fill_parent\"  android:layout_height=\"\
  wrap_content\"\n        android:layout_alignParentBottom=\"true\"\n        android:text=\"\
  Use at your own risk... \" />\n\n</RelativeLayout>\n```\n\n![Image](img/9781430239307_Fig06-24.jpg)\n\
  \n**图 6–24.** *使用 `RelativeLayout` 布局管理器布局的用户界面*\n\n如图所示，该用户界面看起来像一个简单的登录表单。用户名标签固定在容器顶部，因为我们设置了\
  \ `android:layout_alignParentTop` 为 `true`。类似地，用户名输入框位于用户名标签下方，因为我们设置了 `android:layout_below`。密码标签出现在用户名标签下方，密码输入框出现在密码标签下方。免责声明标签固定在容器底部，因为我们设置了\
  \ `android:layout_alignParentBottom` 为 `true`。\n\n除了这三个布局属性之外，你还可以指定 `layout_above`、`layout_toRightOf`、`layout_toLeftOf`、`layout_centerInParent`\
  \ 等更多属性。由于 `RelativeLayout` 的简洁性，使用它非常有趣。事实上，一旦你开始使用它，它就会成为你最喜欢的布局管理器——你会发现自己反复使用它。\n\
  \n##### ADT 对设计 RelativeLayouts 的支持\n\n随着用于 Eclipse 的 Android 开发工具（ADT）的发展，越来越多的功能变得可用。早期，布局的视觉编辑器并不太好。但最近它好多了。特别是，该工具使用\
  \ `RelativeLayout` 以可视方式布局用户界面的能力有了很大改善。如果你使用 `RelativeLayout`，绝对应该检查一下 Eclipse\
  \ 中的这个工具。\n\n\n\n#### `FrameLayout` 布局管理器\n\n我们迄今为止讨论过的布局管理器实现了多种布局策略。换句话说，每种布局管理器都有其特定的方式来在屏幕上定位和定向其子视图。使用这些布局管理器，你可以在同一屏幕上放置多个控件，每个控件占据屏幕的一部分。Android\
  \ 还提供了一种主要用于显示单个项目的布局管理器：`FrameLayout`。你主要使用这个实用布局类来动态显示单个视图，但你可以用它填充多个项目，设置其中一个可见，而其他项目不可见。代码清单\
  \ 6–48 演示了如何使用 `FrameLayout`。\n\n**代码清单 6–48.** *填充 `FrameLayout`*\n\n```\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout\n    android:id=\"@+id/frmLayout\"\
  \n    android:layout_width=\"fill_parent\"  android:layout_height=\"fill_parent\"\
  >\n\n     <ImageView\n        android:id=\"@+id/oneImgView\" android:src=\"@drawable/one\"\
  \n        android:scaleType=\"fitCenter\"\n        android:layout_width=\"fill_parent\"\
  \  android:layout_height=\"fill_parent\"/>\n    <ImageView\n        android:id=\"\
  @+id/twoImgView\" android:src=\"@drawable/two\"\n        android:scaleType=\"fitCenter\"\
  \n        android:layout_width=\"fill_parent\"  android:layout_height=\"fill_parent\"\
  \n        android:visibility=\"gone\" />\n\n</FrameLayout>\n\npublic class FrameLayoutActivity\
  \ extends Activity{\n    private ImageView one = null;\n    private ImageView two\
  \ = null;\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.listing6_48);\n\
  \n        one = (ImageView)findViewById(R.id.oneImgView);\n        two = (ImageView)findViewById(R.id.twoImgView);\n\
  \n        one.setOnClickListener(new OnClickListener(){\n\n            public void\
  \ onClick(View view) {\n                two.setVisibility(View.VISIBLE);\n\n   \
  \             view.setVisibility(View.GONE);\n            }});\n\n        two.setOnClickListener(new\
  \ OnClickListener(){\n\n            public void onClick(View view) {\n         \
  \       one.setVisibility(View.VISIBLE);\n\n                view.setVisibility(View.GONE);\n\
  \            }});\n    }\n}\n```\n\n代码清单 6–48 展示了布局文件以及 Activity 的 `onCreate()`\
  \ 方法。该演示的思路是在 `FrameLayout` 中加载两个 `ImageView` 对象，但同一时间只让其中一个 `ImageView` 对象可见。在用户界面中，当用户点击可见的图像时，我们隐藏一个图像并显示另一个图像。\n\
  \n现在更仔细地看一下代码清单 6–48，从布局开始。可以看到我们定义了一个包含两个 `ImageView` 对象（`ImageView` 是一个知道如何显示图像的控件）的\
  \ `FrameLayout`。请注意，第二个 `ImageView` 的可见性被设置为 `gone`，从而使该控件不可见。现在，看一下 `onCreate()`\
  \ 方法。在 `onCreate()` 方法中，我们为 `ImageView` 对象注册了点击事件的监听器。在点击处理程序中，我们隐藏一个 `ImageView`\
  \ 并显示另一个。\n\n正如我们之前所说，当你需要动态地将视图的内容设置为单个控件时，通常会使用 `FrameLayout`。尽管这是常规做法，但该控件可以接受多个子视图，正如我们所演示的那样。代码清单\
  \ 6–48 向布局中添加了两个控件，但一次只让其中一个控件可见。然而，`FrameLayout` 并不强制你一次只能有一个控件可见。如果你向布局中添加了多个控件，`FrameLayout`\
  \ 会简单地将这些控件堆叠起来，一个叠在另一个上面，最后一个控件位于最上层。这可以创建出有趣的用户界面。例如，图 6–25 展示了一个包含两个可见 `ImageView`\
  \ 对象的 `FrameLayout` 控件。你可以看到控件是堆叠的，并且顶部的控件部分覆盖了它后面的图像。\n\n![Image](img/9781430239307_Fig06-25.jpg)\n\
  \n**图 6–25.** *包含两个 `ImageView` 对象的 `FrameLayout`*\n\n`FrameLayout` 的另一个有趣方面是，如果你向布局中添加了多个控件，布局的大小将根据容器中最大的项目来计算。在图\
  \ 6–25 中，顶部的图像实际上比它后面的图像小得多，但由于布局的大小是根据最大的控件计算的，因此顶部的图像被拉伸了。\n\n另外请注意，如果将一个或多个控件初始时设置为不可见并放入\
  \ `FrameLayout` 中，你可能需要考虑在你的 `FrameLayout` 上使用 `setMeasureAllChildren(true)`。因为最大的子视图决定了布局的大小，如果最大的子视图一开始是不可见的，你就会遇到问题：当它变得可见时，它只能部分可见。为了确保所有项目都能正确渲染，请调用\
  \ `setMeasureAllChildren()` 并向其传递 `true` 值。`FrameLayout` 对应的 XML 属性是 `android:measureAllChildren=\"\
  true\"`。\n\n#### `GridLayout` 布局管理器\n\nAndroid 4.0 引入了一种名为 `GridLayout` 的新布局管理器。正如你可能期望的那样，它以行和列的网格模式来布局视图，有点像\
  \ `TableLayout`。然而，它比 `TableLayout` 更容易使用。使用 `GridLayout`，你可以为视图指定行和列的值，它就会出现在网格中的该位置。这意味着你不需要为每个单元格都指定一个视图，只需要为那些你想要放置视图的单元格指定即可。视图可以跨越多个网格单元格。你甚至可以将多个视图放入同一个网格单元格中。\n\
  \n在布局视图时，你不能使用 weight 属性，因为它不适用于 `GridLayout` 的子视图。你可以改用 `layout_gravity` 属性。可以用于\
  \ `GridLayout` 子视图的其他有趣属性包括 `layout_column` 和 `layout_columnSpan`，分别用于指定最左侧的列以及视图占用的列数。类似地，还有\
  \ `layout_row` 和 `layout_rowSpan` 属性。有趣的是，你不需要为 `GridLayout` 的子视图指定 `layout_height`\
  \ 和 `layout_width`；它们默认为 `WRAP_CONTENT`。\n\n\n\n### 针对不同设备配置自定义布局\n\n到目前为止，你已经非常清楚\
  \ Android 提供了大量布局管理器来帮助你构建用户界面。如果你尝试过我们讨论过的布局管理器，就会知道可以通过多种方式组合这些布局管理器，以获得你想要的外观和体验。但即使有这么多布局管理器，构建用户界面并将其调整到位仍是一项挑战。对于移动设备尤其如此。移动设备的用户和制造商变得越来越复杂，这使开发者的工作更具挑战性。\n\
  \n其中一项挑战是为在不同屏幕配置下显示的应用构建 UI。例如，如果你的应用在竖屏模式与横屏模式下显示，你的 UI 会是什么样子？如果你还未遇到过这种情况，现在你的大脑可能已经在飞速运转，思考如何处理这种常见场景。有趣且幸运的是，Android\
  \ 为这种用例提供了一些支持。\n\n其工作原理如下：在构建布局时，Android 会根据设备的配置从特定文件夹中查找并加载布局。设备可以处于三种配置之一：竖屏、横屏或方形（方形很少见）。为了为不同配置提供不同的布局，你需要为每种配置创建特定的文件夹，Android\
  \ 将从中加载合适的布局。如你所知，默认布局文件夹位于 `res/layout`。为了支持竖屏显示，创建一个名为 `res/layout-port` 的文件夹。对于横屏，创建一个名为\
  \ `res/layout-land` 的文件夹。对于方形，创建一个名为 `res/layout-square` 的文件夹。\n\n这时有个好问题：“有了这三个文件夹，我还需要默认布局文件夹（`res/layout`）吗？”\
  \ 一般来说，是的。Android 的资源解析逻辑会首先查找配置特定的目录。如果 Android 在那里没有找到资源，它会转到默认布局目录。因此，你应该将默认布局定义放在\
  \ `res/layout` 中，而将自定义版本放在特定配置的文件夹中。\n\n另一个技巧是在布局文件中使用 `<include />` 标签。这允许你创建公共的布局代码块（例如，在默认布局目录中），并将它们包含在\
  \ `layout-port` 和 `layout-land` 中定义的布局里。一个 `include` 标签可能看起来像这样：\n\n`<include layout=\"\
  @layout/common_chunk1\" />`\n\n如果 `include` 的概念让你感兴趣，你还应该查看 Android API 中的 `<merge\
  \ />` 标签和 `ViewStub` 类。这些类让你在组织布局时拥有更大的灵活性，并且无需重复视图。\n\n请注意，Android SDK 没有提供任何 API\
  \ 让你以编程方式指定加载哪种配置——系统只是根据设备配置自动选择文件夹。不过，你可以在代码中设置设备的方向，例如，使用以下代码：\n\n```\nimport\
  \ android.content.pm.ActivityInfo;\n...\nsetRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);\n\
  ```\n\n这将强制你的应用在设备上以横屏模式显示。继续在你之前的某个项目中尝试一下。将这段代码添加到某个 Activity 的 `onCreate()` 方法中，在模拟器中运行它，然后侧着脑袋查看你的应用。\n\
  \n布局并非唯一受配置驱动的资源，在查找要使用的资源时，还会考虑设备配置的其他限定符。`res` 文件夹的全部内容都可以为每种配置提供变体。例如，要为每种配置加载不同的可绘制对象，除了默认的\
  \ `drawable` 文件夹外，还要创建 `drawable-port`、`drawable-land` 和 `drawable-square` 文件夹。请记住，在你的代码中，你仍然只使用\
  \ `R.resource_type.name` 来引用资源，而不带任何限定符。例如，如果你在几个不同的限定资源目录中有许多 `main.xml` 布局文件的不同变体，你的代码仍将引用\
  \ `R.layout.main`。Android 会负责为你找到合适的 `main.xml`。\n\n关于更多资源基础，你可以参考第 3 章。我们将在第 12\
  \ 章中更详细地介绍配置变更这一概念。至此，我们关于构建 UI 的讨论就结束了。\n\n### 总结\n\n让我们快速列举一下你在本章学到的关于构建用户界面的内容，以此作为本章的结尾：\n\
  \n* XML 资源如何定义 UI 外观，以及代码如何填充数据\n* 三种主要的布局类型及其使用时机\n* Android 支持的视图以及如何通过 XML 和代码定义它们\n\
  * 主要的列表控件以及如何使用适配器填充数据\n* 可用于从一组公共资源管理应用外观和体验的样式和主题\n\n### 面试问题\n\n你可以使用以下问题作为指南，测试你对本章内容的理解。\n\
  \n**1.**  `TextView` 能否接收用户的键入输入？\n\n**2.**  何时应该在 `EditText` 字段中使用 `Spannable`？\n\
  \n**3.**  如何在按下和释放操作期间自定义 `ImageButton` 的外观？\n\n**4.**  适配器是否总是需要从内容提供者获取数据？\n\n\
  **5.**  `ListView` 能否包含多个视图？\n\n**6.**  `ListView` 是否必须始终包含至少一个 `TextView`？\n\n\
  **7.**  什么定义了 `ListView` 项的布局，你可以在哪里找到它？\n\n**8.**  `Spinner` 与其他列表控件有何不同？\n\n**9.**\
  \  为了以行列格式显示数据库表中的姓名列表，使用 `TableLayout` 还是 `GridView` 更好？\n\n**10.** 何时在用户界面中使用\
  \ `AbsoluteLayout`？\n\n**11.** `android:layout_weight` 有什么作用？\n\n**12.** `android:gravity`\
  \ 和 `android:layout_gravity` 有什么区别？\n\n**13.** 是否可能强制 Activity 以特定方向显示？\n\n**14.**\
  \ 在哪个布局管理器中使用 `android:layout_toRightOf`？\n\n**15.** 在什么情况下，列表适配器中的 ID 与位置的数值相同？\n\
  \n在下一章中，我们将进一步深入用户界面开发——我们将讨论菜单。\n\n"
