  ### 操作栏与搜索视图\n\n在 Android 4.0 中，由于操作栏在手机上可用，将其用作搜索功能的兴趣日益增长。本节将展示如何在操作栏中使用搜索小部件。\n\
  \n我们将提供代码片段，你可以使用这些代码片段修改到目前为止看到的项目，以包含搜索小部件。虽然我们只提供片段，但你可以在本章的可下载项目中看到完整的代码。\n\n\
  搜索视图小部件是一个搜索框，它位于操作栏中的标签和菜单图标之间，如图 10–7 所示。\n\n![Image](img/9781430239307_Fig10-07.jpg)\n\
  \n**图 10–7.** *操作栏搜索视图*\n\n要在你的操作栏中使用搜索，你需要执行以下操作：\n\n1.  定义一个指向 SDK 提供的搜索视图的菜单项。你还需要一个可以加载此菜单的\
  \ Activity。这通常被称为*搜索调用 Activity*。\n2.  创建另一个 Activity，它可以接收步骤 1 中搜索视图的查询并提供结果。这通常被称为*搜索结果\
  \ Activity*。\n3.  创建一个 XML 文件，允许你自定义搜索视图小部件。此文件通常命名为 `searchable.xml`，位于 `res/xml`\
  \ 子目录中。\n4.  在清单文件中声明搜索结果 Activity。此定义需要指向步骤 3 中定义的 XML 文件。\n5.  在你的搜索调用 Activity\
  \ 的菜单设置中，指示搜索视图需要定位到步骤 2 中的搜索结果 Activity。\n\n我们将为这些步骤中的每一步提供代码片段。如前所述，完整代码在可下载的项目中可用。实际上，当你运行本章的项目时，搜索视图在本章前面部分介绍的所有操作栏上都是可见的：标签、列表和标准。\n\
  \n#### 将搜索视图小部件定义为菜单项\n\n要定义一个搜索视图显示在你的 Activity 的操作栏中，你需要在你的一个菜单 XML 文件中定义一个菜单项，如代码清单\
  \ 10–20 所示。\n\n**代码清单 10–20.** *搜索视图菜单项定义*\n```xml\n<item android:id=\"@+id/menu_search\"\
  \n    android:title=\"搜索\"\n    android:showAsAction=\"ifRoom\"\n    android:actionViewClass=\"\
  android.widget.SearchView\"\n    />\n```\n代码清单 10–20 中的关键元素是指向 `android.widget.SearchView`\
  \ 的 `actionViewClass` 属性。你之前在本章中声明普通菜单项作为操作图标出现在操作栏时，已经看到了其他属性。\n\n#### 塑造搜索结果 Activity\n\
  \n为了在你的应用程序中启用搜索，你需要一个可以响应搜索查询的 Activity。它可以像任何其他 Activity 一样。一个示例在代码清单 10–21 中展示。\n\
  \n**代码清单 10–21.** *搜索结果 Activity*\n```java\npublic class SearchResultsActivity\n\
  {\n    private static String tag=\"搜索结果 Activity\";\n\n    @Override\n    public\
  \ void onCreate(Bundle savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n\
  \        final Intent queryIntent = getIntent();\n        doSearchQuery(queryIntent);\n\
  \    }\n    @Override\n    public void onNewIntent(final Intent newIntent)\n   \
  \ {\n        super.onNewIntent(newIntent);\n        final Intent queryIntent = getIntent();\n\
  \        doSearchQuery(queryIntent);\n    }\n    private void doSearchQuery(final\
  \ Intent queryIntent)\n    {\n        final String queryAction = queryIntent.getAction();\n\
  \        if (!(Intent.ACTION_SEARCH.equals(queryAction)))\n        {\n         \
  \   Log.d(tag,\"意图不是用于搜索\");\n            return;\n        }\n        final String\
  \ queryString =\n            queryIntent.getStringExtra(SearchManager.QUERY);\n\
  \        Log.d(tag, queryString);\n    }\n}//eof-class\n```\n\n关于代码清单 10–21 中的搜索结果\
  \ Activity，有几点需要注意：\n\n*   此 Activity 检查调用它的 action 是否由搜索发起。\n*   此 Activity 可能是新创建的，或者只是被带到前台。在后一种情况下，此\
  \ Activity 还需要在其 `onNewIntent()` 方法中执行与 `onCreate()` 方法相同的操作。\n*   如果此 Activity\
  \ 由搜索调用，它将使用一个名为 `SearchManager.QUERY` 的额外参数来检索查询字符串。然后，Activity 会记录该字符串是什么。在实际场景中，你将使用该字符串来返回匹配的结果。\n\
  \n#### 通过可搜索的 XML 文件自定义搜索\n\n如前面的步骤所示，让我们看看自定义搜索体验的 XML 文件；见代码清单 10–22。\n\n**代码清单\
  \ 10–22.** *可搜索的 XML 文件*\n```xml\n<!-- /res/xml/searchable.xml -->\n<searchable\n\
  \    android:label=\"@string/search_label\"\n    android:hint=\"@string/search_hint\"\
  \n/>\n```\n\n`hint` 属性将显示在搜索视图小部件上，作为你开始键入时消失的提示。`label` 在操作栏中不起重要作用。但是，当你将相同的搜索结果\
  \ Activity 用于搜索对话框时，对话框将具有此处定义的标签。\n\n你可以在以下 URL 了解更多关于可搜索 XML 属性的信息：\n\n`http://developer.android.com/guide/topics/search/searchable-config.html`\n\
  \n#### 在清单文件中定义搜索结果 Activity\n\n现在，让我们看看如何将这个 XML 文件与搜索结果 Activity 关联起来。这是在清单文件中定义搜索结果\
  \ Activity 时完成的：参见代码清单 10–23。注意指向可搜索 XML 文件资源的元数据定义。\n\n**代码清单 10–23.** *将 Activity\
  \ 与其 `Searchable.xml` 关联*\n```xml\n<activity android:name=\".SearchResultsActivity\"\
  \n   android:label=\"搜索结果\">\n     <intent-filter>\n        <action android:name=\"\
  android.intent.action.SEARCH\"/>\n      </intent-filter>\n     <meta-data android:name=\"\
  android.app.searchable\"\n                        android:resource=\"@xml/searchable\"\
  />\n</activity>\n```\n\n#### 为搜索视图小部件指定搜索目标\n\n到目前为止，你已经在操作栏中有了搜索视图，并且有了可以响应搜索的\
  \ Activity。你需要使用 Java 代码将这两部分连接起来。你可以在搜索调用 Activity 的 `onCreateOptions()` 回调中，在设置菜单时执行此操作。代码清单\
  \ 10–24 中的函数可以从 `onCreateOptions()` 调用，以链接搜索视图小部件和搜索结果 Activity。\n\n**代码清单 10–24.**\
  \ *将搜索视图小部件与搜索结果 Activity 关联*\n```java\nprivate void setupSearchView(Menu menu)\n\
  {\n    //定位搜索视图小部件\n    SearchView searchView =\n        (SearchView) menu.findItem(R.id.menu_search).getActionView();\n\
  \    if (searchView == null)\n    {\n        this.reportBack(tag, \"无法获取搜索视图\");\n\
  \        return;\n    }\n\n    //设置搜索视图\n    SearchManager searchManager =\n   \
  \     (SearchManager) getSystemService(Context.SEARCH_SERVICE);\n    ComponentName\
  \ cn =\n        new ComponentName(this,SearchResultsActivity.class);\n    SearchableInfo\
  \ info =\n        searchManager.getSearchableInfo(cn);\n    if (info == null)\n\
  \    {\n        this.reportBack(tag, \"无法获取搜索信息\");\n        return;\n    }\n\n\
  \    searchView.setSearchableInfo(info);\n\n    //不要图标化小部件；默认展开它\n    searchView.setIconifiedByDefault(false);\n\
  }\n```\n\n你可以通过修改你的项目来测试本节中的代码，或者你可以下载本章的项目。完成此操作后，你将看到搜索视图作为操作栏的一部分显示，如图 10–7 所示。\n\
  \n### 操作栏与片段\n\n本章展示了如何将操作栏与 Activity 结合使用。在处理平板电脑时，通常建议将操作栏与片段一起使用。片段在第 8 章中介绍。这里阐述的相同原则也适用于片段。\n\
  \n因为片段位于 Activity 内部，而 Activity 拥有操作栏，所以不需要基类抽象来确保每个 Activity 具有相同的操作栏。所有片段共享同一个\
  \ Activity，因此它们也共享同一个操作栏。解决方案更简单。\n\n### 参考资料\n\n以下 URL 在我们为本章节研究资料时提供了帮助。该列表还包括进一步的阅读材料。此外，最后的\
