  \n至此，让我们将注意力转向下一章的内容提供者。\n\n---\n\n## 第 4 章\n\n## 理解内容提供者\n\nAndroid 使用一种称为*内容提供者*的概念来将数据抽象为服务。内容提供者的这个想法使得数据源看起来像是支持\
  \ REST 的数据提供者，例如网站。从这个意义上说，内容提供者是数据的封装器。Android 设备上的 SQLite 数据库就是一个可以封装到内容提供者中的数据源示例。\n\
  \n**注意：** REST 代表表述性状态转移。当你在 Web 浏览器中输入一个 URL，Web 服务器以 HTML 作为响应时，你实际上已经在 Web 服务器上执行了一个基于\
  \ REST 的“查询”操作。REST 通常也与（SOAP——简单对象访问协议）Web 服务进行对比。你可以在以下维基百科条目中阅读更多关于 REST 的内容：[`http://en.wikipedia.org/wiki/Representational_State_Transfer`](http://en.wikipedia.org/wiki/Representational_State_Transfer)。\n\
  \n要从内容提供者检索数据或向内容提供者保存数据，你需要使用一组类似 REST 的 URI。例如，如果你要从一个封装了图书数据库的内容提供者中检索一组图书，你需要使用如下\
  \ URI：\n\n`content://com.android.book.BookProvider/books`\n\n要从该图书数据库中检索一本特定的书（第\
  \ 23 本），你需要使用如下 URI：\n\n`content://com.android.book.BookProvider/books/23`\n\n你将在本章中看到这些\
  \ URI 如何对应到底层的数据库访问机制。设备上的任何应用程序都可以利用这些 URI 来访问和操作数据。因此，内容提供者在应用程序之间共享数据方面扮演着重要角色。\n\
  \n严格来说，内容提供者的职责更多地在于封装机制而非数据访问机制。你需要一个实际的数据访问机制，例如 SQLite 或网络访问，才能访问到底层的数据源。因此，仅当你希望对外共享数据或在应用程序之间共享数据时，才需要内容提供者这一抽象层。对于内部数据访问，应用程序可以使用任何它认为合适的数据存储/访问机制，例如：\n\
  \n-   *SharedPreferences*：一组你可以持久化以存储应用程序偏好的键/值对。\n-   *文件*：应用程序内部的文件，你可以将其存储在可移除的存储介质上。\n\
  -   *SQLite*：SQLite 数据库，每个数据库对于创建它的包来说是私有的。\n-   *网络*：一种允许你通过 HTTP 服务从外部检索或存储数据的机制。\n\
  \n**注意：** 尽管 Android 允许使用多种数据访问机制，但本章重点介绍 SQLite 和内容提供者抽象，因为内容提供者是数据共享的基础，与其他 UI\
  \ 框架相比，这在 Android 框架中要普遍得多。我们将在第 11 章中介绍网络方法，并在第 9 章中介绍偏好设置机制。\n\n### 探索 Android\
  \ 内置的内容提供者\n\nAndroid 带有许多内置的内容提供者，这些提供者在 SDK 的 `android.provider` Java 包中有文档说明。你可以在此处查看这些提供者的列表：\n\
  \n`http://developer.android.com/reference/android/provider/package-summary.html`\n\
  \n这些提供者包括，例如，联系人（Contacts）和媒体存储（Media Store）。这些 SQLite 数据库通常具有 `.db` 扩展名，并且只能从实现包内部访问。任何在该包之外的访问都必须通过内容提供者接口进行。\n\
  \n\n\n#### 在模拟器和可用设备上探索数据库\n\n由于 Android 中的许多内容提供程序都使用 SQLite 数据库（`www.sqlite.org/`），您可以使用\
  \ Android 和 SQLite 提供的工具来检查这些数据库。其中许多工具位于 `\\android-sdk-install-directory\\tools`\
  \ 子目录中；其他工具位于 `\\android-sdk-install-directory\\platform-tools` 中。\n\n**注意：** 请参考第\
  \ 2 章，了解如何在不同操作系统中定位 `tools` 目录和调用命令窗口。与其余大部分章节一样，本章主要在 Windows 平台上给出示例。在本节中，我们将使用多个命令行工具，您可以重点关注可执行文件或批处理文件的名称，而无需过多关注工具所在的目录。我们已在第\
  \ 2 章 中介绍了如何在各种平台上设置工具目录的路径。\n\nAndroid 使用一个名为 Android 调试桥（`adb`）的命令行工具，其位置如下：\n\
  \n`platform-tools\\adb.exe`\n\n`adb` 是 Android 工具包中的一种特殊工具，大多数其他工具通过它来访问设备。但是，您必须让模拟器正在运行或有\
  \ Android 设备已连接，`adb` 才能正常工作。您可以在命令行中输入以下命令来查看是否有正在运行的设备或模拟器：\n\n`adb devices`\n\
  \n如果模拟器没有运行，您可以在命令行中输入以下命令来启动它：\n\n`emulator.exe @avdname`\n\n参数 `@avdname` 是 Android\
  \ 虚拟设备（AVD）的名称。（第 2 章介绍了 Android 虚拟设备的必要性以及如何在第 2 章 中创建它们。）要查看您已有的虚拟设备，可以运行以下命令：\n\
  \n`android list avd`\n\n此命令将列出所有可用的 AVD。如果您已经通过 Eclipse Android 开发工具（ADT）开发并运行过任何\
  \ Android 应用程序，那么您已经至少配置了一个虚拟设备。上述命令至少会列出这一个。\n\n以下是 `list` 命令的一些输出示例。（根据您的 `tools`\
  \ 目录位置以及 Android 版本，以下输出内容的路径或版本号可能会有所不同，例如 `i:\\android`。）\n\n```\nI:\\android\\\
  tools>android list avd\nAvailable Android Virtual Devices:\n    Name: avd\n    Path:\
  \ I:\\android\\tools\\..\\avds\\avd3\n  Target: Google APIs (Google Inc.)\n    \
  \      Based on Android 1.5 (API level 3)\n    Skin: HVGA\n  Sdcard: 32M\n---------\n\
  \    Name: titanium\n    Path: C:\\Documents and Settings\\Satya\\.android\\avd\\\
  titanium.avd\n  Target: Android 1.5 (API level 3)\n    Skin: HVGA\n```\n\n如上所述，AVD\
  \ 的详细信息在第 2 章有介绍。\n\n您也可以通过 Eclipse ADT 插件启动模拟器。当您选择在模拟器中运行或调试某个程序时，这会自动发生。模拟器启动并运行后，您可以通过输入以下命令再次测试以获取正在运行的设备列表：\n\
  \n`adb devices`\n\n现在您应该会看到类似如下的输出：\n\n```\nList of devices attached\nemulator-5554\
  \ device\n```\n\n您可以在命令行中输入以下命令来查看可以通过 `adb` 运行的众多选项和命令：\n\n`adb help`\n\n您也可以访问以下网址了解\
  \ `adb` 的许多运行时选项：[`http://developer.android.com/guide/developing/tools/adb.html`](http://developer.android.com/guide/developing/tools/adb.html)。\n\
  \n您可以使用 `adb` 在连接的设备上打开一个 shell，方法是输入：\n\n`adb shell`\n\n**注意：** 此 shell 是一个 Unix\
  \ `ash`，但命令集有限。例如，您可以执行 `ls`，但 `find`、`grep` 和 `awk` 在该 shell 中不可用。\n\n您可以在 shell\
  \ 提示符下输入以下内容来查看 shell 中可用的命令集：\n\n`#ls /system/bin`\n\n`#` 符号是 shell 的提示符。为简洁起见，在以下示例中我们将省略此提示符。要查看根级目录和文件的列表，您可以在\
  \ shell 中输入：\n\n`ls -l`\n\n您需要访问此目录才能查看数据库列表：\n\n`ls /data/data`\n\n此目录包含设备上已安装的软件包列表。让我们通过探索\
  \ `com.android.providers.contacts` 软件包来查看一个示例：\n\n`ls /data/data/com.android.providers.contacts/databases`\n\
  \n这将列出一个名为 `contacts.db` 的数据库文件，这是一个 SQLite 数据库。（该文件和路径仍然取决于设备和版本。）\n\n**注意：** 在\
  \ Android 中，数据库可能是在首次访问时创建的。这意味着如果您从未访问过联系人应用程序，您可能看不到此文件。\n\n如果包含的 `ash` 中有 `find`\
  \ 命令，您可以查找所有 `*.db` 文件。但仅靠 `ls` 无法很好地做到这一点。您能做到的最接近的操作是：\n\n`ls -R /data/data/*/databases`\n\
  \n使用此命令，您会注意到 Android 发行版中有以下数据库（再次提醒，请谨慎：根据您的版本，此列表可能有所不同）：\n\n```\nalarms.db\n\
  contacts.db\ndownloads.db\ninternal.db\nsettings.db\nmmssms.db\ntelephony.db\n```\n\
  \n您可以在 `adb` shell 中通过对其中一个数据库调用 `sqlite3` 来操作它，请输入：\n\n`sqlite3 /data/data/com.android.providers.contacts/databases/contacts.db`\n\
  \n您可以通过输入以下内容退出 `sqlite3`：\n\n`sqlite>.exit`\n\n请注意，`adb` 的提示符是 `#`，而 `sqlite3`\
  \ 的提示符是 `sqlite>`。您可以通过访问 `www.sqlite.org/sqlite.html` 来了解各种 `sqlite3` 命令。不过，我们将在下面列出一些重要的命令，这样您就不必去访问网页了。您可以通过输入以下命令来查看表列表：\n\
  \n`sqlite> .tables`\n\n此命令是以下内容的快捷方式：\n\n```\nSELECT name FROM sqlite_master\nWHERE\
  \ type IN ('table','view') AND name NOT LIKE 'sqlite_%'\nUNION ALL\nSELECT name\
  \ FROM sqlite_temp_master\nWHERE type IN ('table','view')\nORDER BY 1\n```\n\n您可能已经猜到，`sqlite_master`\
  \ 表是一个主表，用于跟踪数据库中的表和视图。以下命令行会打印出 `contacts.db` 中名为 `people` 的表的 `create` 语句：\n\n\
  `.schema people`\n\n这是在 SQLite 中获取表列名的一种方法。它还会打印出列数据类型。在使用内容提供程序时，您应留意这些列类型，因为访问方法依赖于它们。\n\
  \n然而，仅仅为了了解列名及其类型而手动解析这条长长的 `create` 语句是非常繁琐的。有一种变通方法：您可以将 `contacts.db` 拉取到本地计算机上，然后使用任何适用于\
  \ SQLite 版本 3 的 GUI 工具来检查该数据库。您可以从操作系统命令提示符中发出以下命令来拉取 `contacts.db` 文件：\n\n`adb\
  \ pull /data/data/com.android.providers.contacts/databases/contacts.db` ![Image](img/U002.jpg)\n\
  `c:/somelocaldir/contacts.db`\n\n我们使用了免费下载的 Sqliteman（[`http://sqliteman.com/`](http://sqliteman.com/)），这是一个适用于\
  \ SQLite 数据库的 GUI 工具，运行起来似乎没有问题。我们遇到了几次崩溃，但除此之外，发现该工具完全可以用于探索 Android SQLite 数据库。\n\
  \n\n\n### SQLite 快速入门\n\n以下示例 SQL 语句可帮助你快速浏览 SQLite 数据库：\n\n```\n//设置工具中显示的列标题\n\
  sqlite>.headers on\n\n//从表中选择所有行\nselect * from table1;\n\n//统计表中的行数\nselect count(*)\
  \ from table1;\n\n//选择特定的列集\nselect col1, col2 from table1;\n\n//选择列中的不重复值\nselect\
  \ distinct col1 from table1;\n\n//统计不重复值的数量\nselect count(col1) from (select distinct\
  \ col1  from table1);\n\n//分组\nselect count(*), col1 from table1 group by col1;\n\
  \n//常规内连接\nselect * from table1 t1, table2 t2\nwhere t1.col1 = t2.col1;\n\n//左外连接\n\
  //返回 t1 中的所有数据，即使 t2 中没有匹配行\nselect * from table t1 left outer join table2 t2\n\
  on t1.col1 = t2.col1\nwhere ....\n```\n\n### 内容提供者的架构\n\n现在你已经知道如何通过 Android 和 SQLite\
  \ 工具探索现有的内容提供者。接下来，我们将考察内容提供者的一些架构元素，以及这些内容提供者如何与行业中其他数据访问抽象相关联。\n\n总体而言，内容提供者方法与以下行业抽象有相似之处：\n\
  \n- 网站\n- REST\n- Web 服务\n- 存储过程\n\n设备上的每个内容提供者都像网站一样，通过一个字符串（类似于域名，但称为*授权标识*）向系统注册自己。这个唯一标识的字符串构成了该内容提供者所能提供的一组\
  \ URI 的基础。这无异于一个拥有域名的网站通过许多 URL 来公开其文档或内容。\n\n这个授权标识的注册发生在 `AndroidManifest.xml`\
  \ 文件中。以下是在 `AndroidManifest.xml` 中注册提供者的两个示例：\n\n```\n<provider android:name=\"\
  SomeProvider\"\n        android:authorities=\"com.your-company.SomeProvider\" />\n\
  \n<provider android:name=\"NotePadProvider\"\n   android:authorities=\"com.google.provider.NotePad\"\
  \n/>\n```\n\n授权标识对于内容提供者来说就像域名。鉴于上述授权标识的注册，这些提供者将受理以该授权标识前缀开头的 URL：\n\n```\ncontent://com.your-company.SomeProvider/\n\
  content://com.google.provider.NotePad/\n```\n\n你会看到，内容提供者就像一个网站，拥有一个作为起始 URL 的基础域名。\n\
  \n**注意：** Android 提供的提供者可能不包含完整的授权标识名称。目前建议仅对第三方内容提供者使用完整名称。这就是为什么你有时会看到内容提供者使用像\
  \ `contacts` 这样的简单单词来引用，而不是 `com.google.android.contacts`（对于第三方提供者而言）。\n\n内容提供者也提供类似\
  \ REST 的 URL 来检索或操作数据。对于上述注册，在 `NotePadProvider` 数据库中，用于标识笔记目录或集合的 URI 是：\n\n```\n\
  content://com.google.provider.NotePad/Notes\n```\n\n用于标识特定笔记的 URI 是：\n\n```\ncontent://com.google.provider.NotePad/Notes/#\n\
  ```\n\n其中 `#` 是特定笔记的 `id`。以下是一些数据提供者可能接受的 URI 示例：\n\n```\ncontent://media/internal/images\n\
  content://media/external/images\ncontent://contacts/people/\ncontent://contacts/people/23\n\
  ```\n\n请注意，这些提供者的媒体（`content://media`）和联系人（`content://contacts`）没有完整的结构。这是因为它们不是第三方提供者，而是由\
  \ Android 控制的。\n\n内容提供者也展现出 Web 服务的特性。内容提供者通过其 URI，将内部数据作为服务公开。然而，内容提供者 URL 的输出并非像基于\
  \ SOAP 的 Web 服务调用那样是类型化的数据。这种输出更像是来自 JDBC 语句的结果集。即使如此，与 JDBC 的相似之处也只是概念上的。我们不想给人留下这与\
  \ JDBC 的 `ResultSet` 相同的印象。\n\n调用者需要了解返回的行和列的结构。此外，正如你将在本章“Android MIME 类型的结构”部分所见，内容提供者有一个内置机制，允许你确定此\
  \ URI 所代表数据的多用途互联网邮件扩展（MIME）类型。\n\n除了类似于网站、REST 和 Web 服务之外，内容提供者的 URI 还类似于数据库中存储过程的名称。存储过程提供基于服务的底层关系数据访问方式。URI\
  \ 与存储过程相似，因为对内容提供者进行的 URI 调用会返回一个游标。然而，内容提供者与存储过程的不同之处在于，内容提供者中服务调用的输入通常嵌入在 URI\
  \ 本身中。\n\n我们提供这些比较是为了让你了解内容提供者更广泛的应用范围。\n\n### Android 内容 URI 的结构\n\n我们将内容提供者比作网站，因为它能响应传入的\
  \ URI。因此，要从内容提供者检索数据，你只需调用一个 URI。然而，在内容提供者的情况下，检索到的数据以行和列集的形式呈现，由一个 Android `cursor`\
  \ 对象表示。在此背景下，我们将考察可用于检索数据的 URI 结构。\n\nAndroid 中的内容 URI 看起来与 HTTP URI 类似，区别在于它们以\
  \ `content` 开头，并且具有通用形式：\n\n```\ncontent://*/*/*\n```\n\n或\n\n```\ncontent://authority-name/path-segment1/path-segment2/etc…\n\
  ```\n\n以下是一个示例 URI，用于标识笔记数据库中编号为 23 的笔记：\n\n```\ncontent://com.google.provider.NotePad/notes/23\n\
  ```\n\n在 `content:` 之后，URI 包含授权标识的唯一标识符，用于在提供者注册表中定位该提供者。在上述示例中，`com.google.provider.NotePad`\
  \ 是 URI 的授权标识部分。\n\n`/notes/23` 是 URI 的路径部分，每个提供者都各不相同。路径部分中的 `notes` 和 `23` 被称为*路径段*。提供者有责任记录并解释\
  \ URI 的路径部分和路径段。\n\n内容提供者的开发者通常通过在提供者实现 Java 包的 Java 类或 Java 接口中声明常量来完成这一点。此外，路径的第一部分可能指向一个对象集合。例如，`/notes`\
  \ 表示笔记的集合或目录，而 `/23` 指向一个具体的笔记项。\n\n给定这个 URI，提供者应检索出该 URI 所标识的行。提供者还应能够使用任何状态变更方法（`insert`、`update`\
  \ 或 `delete`）来更改此 URI 处的内容。\n\n\n\n### Android MIME 类型结构\n\n正如网站会针对特定 URL 返回 MIME\
  \ 类型（这允许浏览器调用正确的程序来查看内容），内容提供者还有一项额外职责，即为给定的 URI 返回 MIME 类型。这为数据的查看方式提供了灵活性。知道数据类型后，你可能会有多个程序知晓如何处理该数据。例如，如果你硬盘上有一个文本文件，会有许多编辑器能够显示该文本文件。根据操作系统的不同，它甚至可能让你选择使用哪个编辑器。\n\
  \nMIME 类型在 Android 中的工作方式与在 HTTP 中类似。你向提供者询问它所支持的特定 URI 的 MIME 类型，提供者会返回一个由两部分组成的字符串，该字符串根据标准\
  \ Web MIME 约定标识其 MIME 类型。你可以在以下位置找到 MIME 类型标准：\n\n`http://tools.ietf.org/html/rfc2046`\n\
  \n根据 MIME 类型规范，一个 MIME 类型包含两部分：主类型和子类型。以下是一些广为人知的 MIME 类型对的示例：\n\n`text/html`\n\
  `text/css`\n`text/xml`\n`text/vnd.curl`\n`application/pdf`\n`application/rtf`\n\
  `application/vnd.ms-excel`\n\n你可以在互联网号码分配机构（IANA）网站上查看注册的主类型和子类型的完整列表：\n\n`http://www.iana.org/assignments/media-types/`\n\
  \n已注册的主要内容类型有：\n\n`application`\n`audio`\n`example`\n`image`\n`message`\n`model`\n\
  `multipart`\n`text`\n`video`\n\n这些主要类型中的每一种都有子类型。但如果供应商拥有专有数据格式，子类型名称会以 `vnd` 开头。例如，Microsoft\
  \ Excel 电子表格由子类型 `vnd.ms-excel` 标识，而 `pdf` 被视为非供应商标准，并且这样表示时不带任何供应商特定的前缀。\n\n有些子类型以\
  \ `x-` 开头；这些是非标准的子类型，无需注册。它们被视为两个协作代理之间双边定义的私有值。以下是一些示例：\n\n`application/x-tar`\n\
  `audio/x-aiff`\n`video/x-msvideo`\n\nAndroid 遵循类似的约定来定义 MIME 类型。Android MIME 类型中的\
  \ `vnd` 表示这些主类型和子类型是非标准的、供应商特定的形式。为了提供唯一性，Android 进一步使用类似于域规范的多个部分来区分主类型和子类型。此外，每种内容类型的\
  \ Android MIME 类型有两种形式：一种用于单个记录，另一种用于多条记录。\n\n对于单个记录，MIME 类型如下所示：\n\n`vnd.android.cursor.item/vnd.yourcompanyname.contenttype`\n\
  \n对于记录或行的集合，MIME 类型如下所示：\n\n`vnd.android.cursor.dir/vnd.yourcompanyname.contenttype`\n\
  \n这里有几个示例：\n\n```\n// 一条笔记\nvnd.android.cursor.item/vnd.google.note\n```\n\n```\n\
  // 笔记的集合或目录\nvnd.android.cursor.dir/vnd.google.note\n```\n\n**注意：** 这里的含义是 Android\
  \ 原生地识别项目目录和单个项目。作为程序员，你的灵活性仅限于子类型。例如，列表控件之类的东西依赖于从游标返回的内容作为这些 MIME 主类型之一。\n\nMIME\
  \ 类型在 Android 中广泛使用，尤其是在意图中，系统会根据数据的 MIME 类型来确定要调用哪个活动。MIME 类型总是通过内容提供者从其 URI 派生而来。在处理\
  \ MIME 类型时，你需要牢记三点：\n\n- 主类型和子类型对于它们所代表的内容必须是唯一的。正如所指出的，主类型在很大程度上是为你决定好的。它主要是一个项目目录或单个项目。在\
  \ Android 的上下文中，这些可能不像你想象的那么开放。\n- 如果主类型和子类型不是标准的（在谈到特定记录时通常如此），则需要在它们前面加上 `vnd`。\n\
  - 它们通常根据你的特定需求进行命名空间划分。\n\n为了重申这一点，通过 Android `游标` 返回的项目集合的主要 MIME 类型应始终为 `vnd.android.cursor.dir`，而通过\
  \ Android `游标` 检索到的单个项目的主要 MIME 类型应为 `vnd.android.cursor.item`。在子类型方面，你有更多的回旋余地，例如\
  \ `vnd.google.note`；在 `vnd.` 部分之后，你可以自由地将其子类型设置为任何你想要的。\n\n\n\n### 使用 URI 读取数据\n\
  \n现在你知道，要从内容提供者检索数据，需要使用该内容提供者提供的 URI。由于内容提供者定义的 URI 对该提供者是唯一的，因此记录这些 URI 并让程序员能够查看和调用它们非常重要。Android\
  \ 自带的提供者通过定义代表这些 URI 字符串的常量来实现这一点。\n\n请考虑 Android SDK 中辅助类定义的这三个 URI：\n\n`MediaStore.Images.Media.INTERNAL_CONTENT_URI`\n\
  `MediaStore.Images.Media.EXTERNAL_CONTENT_URI`\n`ContactsContract.Contacts.CONTENT_URI`\n\
  \n对应的文本 URI 字符串如下：\n\n`content://media/internal/images`\n`content://media/external/images`\n\
  `content://com.android.contacts/contacts/`\n\n给定这些 URI，从联系人提供者检索单行人员记录的代码如下所示：\n\
  \n```\nUri peopleBaseUri = ContactsContract.Contacts.CONTENT_URI;\nUri myPersonUri\
  \ = Uri.withAppendedPath(peopleBaseUri, \"23\");\n\n//查询这条记录。\n//managedQuery 是\
  \ Activity 类的一个方法\nCursor cur = managedQuery(myPersonUri, null, null, null);\n```\n\
  \n请注意 `ContactsContract.Contacts.CONTENT_URI` 是如何在 `Contacts` 类中被预定义为常量的。我们将变量命名为\
  \ `peopleBaseUri`，以表明如果你的目的是查找人员，则需要使用联系人内容 URI。当然，如果你从概念上将人员视为联系人，也可以将此变量命名为 `contactsBaseUri`。\n\
  \n**注意：** 请参考第 30 章以更详细地了解联系人内容提供者。另请注意，联系人 API 及其相关常量可能会随每个 API 版本而更改。本章已使用 Android\
  \ 2.2（API 8）及更高版本进行测试。\n\n在这个例子中，代码获取根 URI，向其添加一个特定的人员 ID，然后调用 `managedQuery` 方法。\n\
  \n作为针对此 URI 进行查询的一部分，可以指定排序顺序、要选择的列以及 `where` 子句。在此示例中，这些附加参数均设置为 `null`。\n\n**注意：**\
  \ 内容提供者应通过实现一组接口或将列名列为常量来列出其支持的列。但是，为列定义常量的类或接口还应通过列命名约定、注释或文档来明确列的类型，因为目前没有正式的方法通过常量来指示列的类型。\n\
  \n列表 4–1 展示了如何基于前面的示例，从联系人内容提供者中检索具有特定列列表的游标。\n\n**列表 4–1.** *从内容提供者检索游标*\n\n```\n\
  //使用此接口查看常量\nimport ContactsContract.Contacts;\n...\n// 指定要返回哪些列的数组。\nstring[] projection\
  \ = new string[] {\n    Contacts._ID,\n    Contacts.DISPLAY_NAME_PRIMARY\n};\n\n\
  Uri mContactsUri = ContactsContract.Contacts.CONTENT_URI;  \n\n// 检索查询的最佳方式；返回一个托管的查询。\n\
  Cursor managedCursor = managedQuery( mContactsUri,\n                        projection,\
  \ //要返回哪些列。\n                        null,       // WHERE 子句\n                 \
  \       Contacts.DISPLAY_NAME_PRIMARY + \" ASC\"); // 排序子句。\n```\n\n请注意，`projection`\
  \ 仅仅是一个表示列名的字符串数组。因此，除非你知道这些列是什么，否则你会发现很难创建 `projection`。你应该在与提供 URI 相同的类中查找这些列名，此例中就是\
  \ `Contacts` 类。你可以通过查看 `android.provider.ContactsContract.Contacts` 类的 SDK 文档（可从以下网址获取）来详细了解每个列：\n\
  \n`http://developer.android.com/reference/android/provider/ContactsContract.Contacts.html`\n\
  \n让我们重新审视返回的 `cursor`：它包含零条或多条记录。列名、顺序和类型是提供者特定的。但是，返回的每一行都有一个名为 `_id` 的默认列，代表该行的唯一标识符。\n\
  \n### 使用 Android 游标\n\n以下是关于 Android 游标的一些要点：\n\n- 游标是行的集合。\n- 在读取任何数据之前，你需要使用 `moveToFirst()`，因为游标起始位置在第一行之前。\n\
  - 你需要知道列名。\n- 你需要知道列类型。\n- 所有字段访问方法都基于列号，因此你必须先将列名转换为列号。\n- 游标是随机的（可以向前、向后移动，也可以跳转）。\n\
  - 由于游标是随机的，你可以询问它的行数。\n\nAndroid 游标有许多方法允许你对其进行导航。列表 4–2 展示了如何检查游标是否为空，以及当游标不为空时如何逐行遍历游标。\n\
  \n**列表 4–2.** *使用 `while` 循环遍历游标*\n\n```\nif (cur.moveToFirst() == false)\n{\n \
  \  //没有行，游标为空\n   return;\n}\n\n//游标已指向第一行\n//让我们访问几个列\nint nameColumnIndex = cur.getColumnIndex(Contacts.DISPLAY_NAME_PRIMARY);\n\
  String name = cur.getString(nameColumnIndex);\n\n//现在我们来看看如何循环遍历游标\n\nwhile(cur.moveToNext())\n\
  {\n   //游标移动成功\n   //访问字段\n}\n```\n\n列表 4–2 开头的假设是游标位于第一行之前。为了将游标定位到第一行，我们在游标对象上使用\
  \ `moveToFirst()` 方法。如果游标为空，此方法返回 `false`。然后我们重复使用 `moveToNext()` 方法来遍历游标。\n\n为了帮助你了解游标的位置，Android\
  \ 提供了以下方法：\n\n`isBeforeFirst()`\n`isAfterLast()`\n`isClosed()`\n\n使用这些方法，你也可以像列表\
  \ 4–3 那样使用 `for` 循环来遍历游标，而不是使用列表 4–2 中的 `while` 循环。\n\n**列表 4–3.** *使用 for 循环遍历游标*\n\
  \n```\n//在 for 循环外部先获取你的索引\nint nameColumn = cur.getColumnIndex(Contacts.DISPLAY_NAME_PRIMARY);\n\
  \n//现在基于列索引遍历游标\nfor(cur.moveToFirst();!cur.isAfterLast();cur.moveToNext())\n{\n\
  \   String name = cur.getString(nameColumn);\n}\n```\n\n列的索引顺序似乎有点随意。因此，我们建议你先从游标中显式获取索引，以避免意外。要查找游标中的行数，Android\
  \ 在游标对象上提供了一个名为 `getCount()` 的方法。\n\n### 使用 where 子句\n\n内容提供者提供了两种传递 `where` 子句的方式：\n\
  \n- 通过 URI\n- 通过结合使用 `string` 子句和一组可替换的字符串数组参数\n\n我们将通过一些示例代码来介绍这两种方法。\n\n\n\n####\
  \ 通过 URI 传递 where 子句\n\n假设你想从 Google 笔记数据库中检索 ID 为 23 的笔记。你会使用代码清单 4-4 中的代码来获取一个包含一条记录的游标，该记录对应\
  \ notes 表中的第 23 行。\n\n**代码清单 4-4.** *通过 URI 传递 SQL where 子句*\n\n```java\nActivity\
  \ someActivity;\n//..初始化 someActivity\nString noteUri = \"content://com.google.provider.NotePad/notes/23\"\
  ;\nCursor managedCursor = someActivity.managedQuery( noteUri,\n                \
  \        projection, //要返回的列\n                        null,       // WHERE 子句\n\
  \                        null); // ORDER BY 子句\n```\n\n我们将 `managedQuery` 方法的 `where`\
  \ 子句参数设为 `null`，因为在这种情况下，我们假设笔记提供程序足够智能，能够识别出我们想要的笔记的 `id`。这个 `id` 嵌入在 URI 本身中。我们将\
  \ URI 作为传递 `where` 子句的载体。当你看笔记提供程序如何实现相应的查询方法时，这一点就变得很明显了。以下是该查询方法的一段代码片段：\n\n```java\n\
  //从类似 content://.../notes/23 的传入 URI 中检索笔记 ID\nint noteId = uri.getPathSegments().get(1);\n\
  \n//请求查询构建器构建查询\n//指定表名\nqueryBuilder.setTables(NOTES_TABLE_NAME);\n\n//使用 noteId\
  \ 来添加 where 子句\nqueryBuilder.appendWhere(Notes._ID + \"=\" + noteId);\n```\n\n注意笔记的\
  \ ID 是如何从 URI 中提取的。表示传入参数 `uri` 的 `Uri` 类有一个方法，用于提取 URI 中根路径 `content://com.google.provider.NotePad`\
  \ 之后的部分。这些部分被称为*路径段（path segments）*；它们是位于 `/` 分隔符之间的字符串，例如 `/seg1/seg3/seg4/`，并且按其位置进行索引。对于这里的\
  \ URI，第一个路径段就是 23。然后，我们使用这个 ID 23 来追加到为 `QueryBuilder` 类指定的 `where` 子句中。最终，等效的 select\
  \ 语句将为：\n\n```sql\nselect * from notes where _id = 23\n```\n\n**注意：** `Uri` 和 `UriMatcher`\
  \ 类用于识别 URI 并从其中提取参数。（我们将在“使用 UriMatcher 识别 URI”一节中进一步介绍 `UriMatcher`。）`SQLiteQueryBuilder`\
  \ 是 `android.database.sqlite` 中的一个辅助类，它允许你构建将由 `SQLiteDatabase` 在 SQLite 数据库实例上执行的\
  \ SQL 查询。\n\n### 使用显式 where 子句\n\n现在你已经了解了如何使用 URI 发送 `where` 子句，接下来考虑 Android 允许我们发送显式列列表及其对应值作为\
  \ `where` 子句的另一种方法。为了探索这一点，让我们再次看看我们在代码清单 4-4 中使用的 `Activity` 类的 `managedQuery`\
  \ 方法。以下是它的签名：\n\n```java\npublic final Cursor managedQuery(Uri uri,\n   String[]\
  \ projection,\n   String selection,\n   String[] selectionArgs,\n   String sortOrder)\n\
  ```\n\n注意名为 `selection` 的参数，其类型为 `String`。这个选择字符串代表一个过滤器（本质上是一个 `where` 子句），用于声明要返回哪些行，其格式为\
  \ SQL `where` 子句（不包含 `WHERE` 本身）。传递 `null` 将返回给定 URI 的所有行。在选择字符串中，你可以包含 `?`，这些 `?`\
  \ 将被 `selectionArgs` 中的值按它们在 selection 中出现的顺序替换。这些值将作为 `String` 类型绑定。\n\n由于你有两种指定\
  \ `where` 子句的方法，你可能会发现很难确定提供程序是如何使用这些 `where` 子句的，以及如果同时使用两个 `where` 子句，哪个 `where`\
  \ 子句优先。\n\n例如，你可以使用以下任意一种方法查询 ID 为 23 的笔记：\n\n```java\n//URI 方法\nmanagedQuery(\"\
  content://com.google.provider.NotePad/notes/23\"\n,null\n,null\n,null\n,null);\n\
  ```\n\n或者\n\n```java\n//显式 where 子句\nmanagedQuery(\"content://com.google.provider.NotePad/notes\"\
  \n,null\n,\"_id=?\"\n,new String[] {23}\n,null);\n```\n\n惯例是尽可能通过 URI 使用 `where`\
  \ 子句，并将显式选项作为特殊情况使用。\n\n### 插入记录\n\n到目前为止，我们已经讨论了如何使用 URI 从内容提供程序检索数据。现在，让我们将注意力转向插入、更新和删除操作。\n\
  \n**注意：** 在解释内容提供程序时，到目前为止，我们使用了 Google 教程提供的记事本应用程序作为原型示例。但是，并不需要完全熟悉那个应用程序。即使你没有看过该应用程序，也应该能够理解这些示例。不过，我们将在本章后面部分为你提供一个示例提供程序的完整代码。\n\
  \nAndroid 使用一个名为 `android.content.ContentValues` 的类来保存待插入的单条记录的值。`ContentValues`\
  \ 是一个键/值对字典，非常类似于列名及其值。插入记录的步骤是：先将记录填充到 `ContentValues` 中，然后请求 `android.content.ContentResolver`\
  \ 使用 URI 插入该记录。\n\n**注意：** 你需要定位到 `ContentResolver`，因为在这个抽象层面上，你不是在请求数据库插入记录；而是在请求将记录插入到由\
  \ URI 标识的提供程序中。`ContentResolver` 负责将 URI 引用解析到正确的提供程序，然后将 `ContentValues` 对象传递给该特定的提供程序。\n\
  \n以下是准备插入操作时，将单行笔记填充到 `ContentValues` 中的示例：\n\n```java\nContentValues values = new\
  \ ContentValues();\nvalues.put(\"title\", \"新笔记\");\nvalues.put(\"note\",\"这是一条新笔记\"\
  );\n\n//values 对象现在已准备好插入\n```\n\n你可以通过向 `Activity` 类请求来获取 `ContentResolver` 的引用：\n\
  \n```java\nContentResolver contentResolver = activity.getContentResolver();\n```\n\
  \n现在，你只需要一个 URI 来告诉 `ContentResolver` 插入该行。这些 URI 在与 `Notes` 表对应的类中定义。在记事本示例中，该\
  \ URI 为：\n\n```java\nNotepad.Notes.CONTENT_URI\n```\n\n我们可以使用这个 URI 和我们已经拥有的 `ContentValues`\
  \ 来调用插入该行的方法：\n\n```java\nUri uri = contentResolver.insert(Notepad.Notes.CONTENT_URI,\
  \ values);\n```\n\n此调用返回一个指向新插入记录的 URI。返回的 URI 将匹配以下结构：\n\n```java\nNotepad.Notes.CONTENT_URI/new_id\n\
  ```\n\n\n\n#### 向内容提供程序添加文件\n\n有时，你可能需要将文件存储在数据库中。通常的做法是将文件保存到磁盘，然后更新数据库中指向该文件名的记录。\n\
  \nAndroid 采用此协议并通过定义保存和检索这些文件的特定程序来自动化该过程。Android 使用一种约定，即在对保留列名 `_data` 的记录中保存对文件名的引用。\n\
  \n当在表中插入一条记录时，Android 会向调用者返回一个 URI。一旦你使用此机制保存了记录，你还需要接着将文件保存到该位置。为此，Android 允许\
  \ `ContentResolver` 获取数据库记录的 URI，并返回一个可写的输出流。在后台，Android 会分配一个内部文件，并将该文件名的引用存储在\
  \ `_data` 字段中。\n\n如果你要扩展记事本示例以便为给定笔记存储图像，你可以创建一个名为 `_data` 的附加列，并首先执行插入操作以获取一个 URI。以下代码演示了此协议的这一部分：\n\
  \n```\nContentValues values = new ContentValues();\nvalues.put(\"title\", \"新笔记\"\
  );\nvalues.put(\"note\",\"这是一条新笔记\");\n\n//使用内容解析器插入记录\nContentResolver contentResolver\
  \ = activity.getContentResolver();\nUri newUri = contentResolver.insert(Notepad.Notes.CONTENT_URI,\
  \ values);\n```\n\n一旦你获得了记录的 URI，以下代码请求 `ContentResolver` 获取对文件输出流的引用：\n\n```\n\
  ....\n//直接使用内容解析器获取输出流\n//ContentResolver 隐藏了对 _data 字段的访问，该字段存储了实际的文件引用。\nOutputStream\
  \ outStream = activity.getContentResolver().openOutputStream(newUri);\nsomeSourceBitmap.compress(Bitmap.CompressFormat.JPEG,\
  \ 50, outStream);\noutStream.close();\n```\n\n然后，代码使用该输出流进行写入。\n\n#### 更新与删除\n\n\
  到目前为止，我们已经讨论了查询和插入操作；更新和删除操作相对直接。执行更新类似于执行插入，其中更改的列值通过 `ContentValues` 对象传递。以下是\
  \ `ContentResolver` 对象上 `update` 方法的签名：\n\n```\nint numberOfRowsUpdated =\nactivity.getContentResolver().update(\n\
      Uri uri,\n    ContentValues values,\n    String whereClause,\n    String[] selectionArgs\
  \ )\n```\n\n`whereClause` 参数用于将更新约束到相关的行。类似地，`delete` 方法的签名是：\n\n```\nint numberOfRowsDeleted\
  \ =\nactivity.getContentResolver().delete(\n    Uri uri,\n    String whereClause,\n\
      String[] selectionArgs )\n```\n\n显然，`delete` 方法不需要 `ContentValues` 参数，因为在删除记录时你无需指定要删除的列。\n\
  \n几乎所有来自 `managedQuery` 和 `ContentResolver` 的调用最终都定向到 `provider` 类。了解提供程序如何实现这些方法中的每一个，足以让我们了解客户端如何使用这些方法。在下一节中，我们将从头开始介绍一个示例内容提供程序的实现：名为\
  \ `BookProvider`。\n\n### 实现内容提供程序\n\n我们已经讨论了如何与内容提供程序交互以获取数据，但尚未讨论如何编写内容提供程序。要编写内容提供程序，你必须继承\
  \ `android.content.ContentProvider` 并实现以下关键方法：\n\n- `query`\n- `insert`\n- `update`\n\
  - `delete`\n- `getType`\n\n在实现它们之前，你还需要设置一些内容。我们将通过描述你需要采取的步骤来说明内容提供程序实现的所有细节：\n\
  \n1.  规划你的数据库、URI、列名等，并创建一个元数据类，为所有这些元数据元素定义常量。\n2.  继承抽象类 `ContentProvider`。\n\
  3.  实现这些方法：`query`、`insert`、`update`、`delete` 和 `getType`。\n4.  在清单文件中注册提供程序。\n\n\
  #### 规划数据库\n\n为了探索这个主题，我们将创建一个包含书籍集合的数据库。该书籍数据库只包含一个名为 `books` 的表，其列名为 `name`、`isbn`\
  \ 和 `author`。这些列名属于元数据。你将在 Java 类中定义这类相关元数据。这个承载元数据的 Java 类 `BookProviderMetaData`\
  \ 如**列表 4–5** 所示。该元数据类的一些关键元素已突出显示。\n\n**列表 4–5.** *为数据库定义元数据：BookProviderMetaData\
  \ 类*\n\n```\npublic class BookProviderMetaData\n{\n    public static final String\
  \ AUTHORITY = \"com.androidbook.provider.BookProvider\";\n\n    public static final\
  \ String DATABASE_NAME = \"book.db\";\n    public static final int DATABASE_VERSION\
  \ = 1;\n    public static final String BOOKS_TABLE_NAME = \"books\";\n\n    private\
  \ BookProviderMetaData() {}\n\n    //描述 BookTable 的内部类\n    public static final\
  \ class BookTableMetaData implements BaseColumns\n    {\n        private BookTableMetaData()\
  \ {}\n        public static final String TABLE_NAME = \"books\";\n\n        //URI\
  \ 和 MIME 类型定义\n        public static final Uri CONTENT_URI =\n                          Uri.parse(\"\
  content://\" + AUTHORITY + \"/books\");\n\n        public static final String CONTENT_TYPE\
  \ =\n                         \"vnd.android.cursor.dir/vnd.androidbook.book\";\n\
  \n        public static final String CONTENT_ITEM_TYPE =\n                        \"\
  vnd.android.cursor.item/vnd.androidbook.book\";\n\n        public static final String\
  \ DEFAULT_SORT_ORDER = \"modified DESC\";\n\n        //附加列从这里开始。\n        //字符串类型\n\
          public static final String BOOK_NAME = \"name\";\n\n        //字符串类型\n        public\
  \ static final String BOOK_ISBN = \"isbn\";\n\n        //字符串类型\n        public static\
  \ final String BOOK_AUTHOR = \"author\";\n\n        //来自 System.currentTimeMillis()\
  \ 的整数\n        public static final String CREATED_DATE = \"created\";\n\n        //来自\
  \ System.currentTimeMillis() 的整数\n        public static final String MODIFIED_DATE\
  \ = \"modified\";\n    }\n}\n```\n\n这个 `BookProviderMetaData` 类首先将其授权定义为 `com.androidbook.provider.BookProvider`。我们将使用这个字符串在\
  \ Android 清单文件中注册提供程序。该字符串构成了用于此提供程序的 URI 的前半部分。\n\n然后，该类继续将其唯一的一个表 (`books`) 定义为一个内部类\
  \ `BookTableMetaData`。`BookTableMetaData` 类接着定义一个用于标识书籍集合的 URI。鉴于上一段中的授权，书籍集合的 URI\
  \ 将如下所示：\n\n```\ncontent://com.androidbook.provider.BookProvider/books\n```\n\n\
  该 URI 由常量\n\n`BookProviderMetaData.BookTableMetaData.CONTENT_URI`\n\n表示。\n\n`BookTableMetaData`\
  \ 类接着定义书籍集合和单本书籍的 MIME 类型。提供程序实现将使用这些常量来返回传入 URI 的 MIME 类型。\n\n然后，`BookTableMetaData`\
  \ 定义列集合：`name`、`isbn`、`author`、`created`（创建日期）和 `modified`（最后更新日期）。\n\n**注意：** 你应该通过代码中的注释来指明列的数据类型。\n\
  \n元数据类 `BookTableMetaData` 还继承了 `BaseColumns` 类，该类提供了标准的 `_id` 字段，表示行 ID。有了这些元数据定义，我们就可以着手实现提供程序了。\n\
  \n\n\n### 扩展 ContentProvider\n\n实现我们的 `BookProvider` 示例内容提供程序需要扩展 `ContentProvider`\
  \ 类，并重写 `onCreate()` 来创建数据库，然后实现 `query()`、`insert()`、`update()`、`delete()` 和 `getType()`\
  \ 方法。本节介绍数据库的设置和创建，后续几节将分别介绍 `query()`、`insert()`、`update()`、`delete()` 和 `getType()`\
  \ 这些独立的方法。代码清单 4-6 提供了该类的完整源代码。该类的重要子节已高亮显示。\n\n查询方法需要指定需要返回的列集合。这类似于 `SELECT` 子句，它需要列名以及它们的\
  \ `AS` 别名（有时称为 *同义词*）。Android 使用一个 `Map` 对象（称为 `projection map`）来表示这些列名及其同义词。我们需要设置这个映射，以便稍后在查询方法的实现中使用它。在提供程序实现的代码中（参见代码清单\
  \ 4-6），你将看到这部分在“投影映射设置”中预先完成。\n\n我们将实现的大多数方法都将 URI 作为输入。尽管此内容提供程序能够响应的所有 URI 都以相同的模式开头，但\
  \ URI 的尾部会有所不同——就像网站一样。每个 URI 虽然开头相同，但必须不同才能标识不同的数据或文档。下面是一个例子：\n\n```\nUri1: content://com.androidbook.provider.BookProvider/books\n\
  Uri2: content://com.androidbook.provider.BookProvider/books/12\n```\n\n图书提供程序需要区分这些\
  \ URI。这是一个简单的情况。如果我们的图书提供程序容纳了更多对象而不仅仅是图书，那么就会有更多的 URI 来标识这些对象。\n\n提供程序实现需要一种机制来区分不同的\
  \ URI；Android 为此目的使用了一个名为 `UriMatcher` 的类。因此，我们需要设置这个对象，使其包含我们所有的 URI 变体。你将在代码清单\
  \ 4-6 中创建投影映射的片段之后看到这些代码。我们将在“使用 UriMatcher 识别 URI”一节中进一步解释 `UriMatcher` 类。\n\n\
  然后，代码清单 4-6 中的代码重写了 `onCreate()` 方法来促进数据库的创建。然后，源代码实现了 `insert()`、`query()`、`update()`、`getType()`\
  \ 和 `delete()` 方法。所有这些代码都列在一个清单中，但我们将在单独的小节中解释每个方面。\n\n### 代码清单 4-6. 实现 BookProvider\
  \ 内容提供程序\n\n```\npublic class BookProvider extends ContentProvider\n{\n    //日志辅助标签。对提供程序没有特殊意义。\n\
