- 'no': 3471
  overturn_probability: 0.05
  alternative: 排版噪声或误识别的正文小标题
  counter_evidence:
  - 前一行 3469 是分隔线 `---`，通常用于章节分隔，但 3471 的内容 `# 第 4 章` 明确带有顶级编号特征。
  - 后文 3473 `## 理解内容提供者` 是二级标题，符合“章”下接“节/小节”的层级结构，支持 3471 为章标题的判断。
  - 该文本来自《Pro Android 4》或类似的技术书籍，其中“第 4 章”确实是标准的大章标题。
  keep_split: true
