- "# 1. 入门指南\n\nRex van der Spuy¹\n\n(1) 加拿大安大略省多伦多\n\n欢迎使用 HTML5 游戏设计师工具包！本书是一本必备指南，涵盖了制作各种\
  \ 2D 动作游戏所需了解的最有用的技术。它涵盖了经典的开发实践、工具、算法和架构，包括以下内容：\n\n*   如何使用 Tiled 编辑器设计游戏关卡（第\
  \ 2 章）。\n*   使用基于瓦片的技术进行高效碰撞检测（第 3 章）。\n*   设计等距游戏地图及等距游戏中的碰撞检测（第 4 章）。\n*   为迷宫游戏进行寻路，包括视线和\
  \ A* 算法（第 5 章和第 6 章）。\n*   基于瓦片游戏的惊人效率，以及你可以用它们做的一些令人惊讶的事情（第 7 章）。\n\n这些都是你需要了解的技术，几乎可以创建任何类型的游戏。\n\
  \n## 你需要了解什么\n\n你是一位游戏设计师！并且，你需要具备相当的 JavaScript 和 HTML5 技术熟练度。如果你正在阅读这本书，说明你已经制作过一些游戏，并且有一套你乐于使用的工具集或游戏引擎。你知道如何制作精灵、运行游戏循环、检测碰撞、编写游戏逻辑以及处理用户输入。你还应该对向量数学有一定了解：如何计算向量、将其归一化，以及从其他向量创建新向量。\n\
  \n### 注意\n\n如果你不了解这些内容，或者需要复习，请阅读《Foundation Game Design with HTML5 and JavaScript》（Apress,\
  \ 2012）、《Advanced Game Design with HTML5 and JavaScript》（Apress, 2015）和《Learn PixiJS》（Apress,\
  \ 2015）。这三本书会教你所需的一切知识。\n\n本书对你用于制作游戏的技术完全保持中立。源代码是使用 JavaScript 编写的，并基于一个名为 Hexi\
  \ 的简单 2D HTML5 游戏引擎。然而，代码示例纯粹旨在作为一种你可以应用于任何其他编程语言或游戏引擎的伪代码。你使用什么游戏引擎或显示列表框架并不重要——你可以将本书中的概念应用于其中任何一个。本书中代码的重点在于算法、高级概念和代码注释——而不一定是实现细节。我会把那些细节留给你，根据你选择的任何技术自行处理。\n\
  \n你只需要确保你使用的技术拥有一个完整的层次化场景图（也称为显示列表）。这意味着你能够制作精灵，并将它们嵌套为父精灵的子级。此外，你的技术需要以某种方式允许你在游戏精灵上引用以下属性（除非另有说明，值单位为像素）：\n\
  \n*   `gx`：精灵的全局水平位置，相对于游戏屏幕的左上角。\n*   `gy`：精灵的全局垂直位置，相对于游戏屏幕的左上角。\n*   `x`：精灵的局部水平位置，相对于其父级精灵的左上角。\n\
  *   `y`：精灵的局部垂直位置，相对于游戏屏幕的左上角。\n*   `width`：精灵的宽度。\n*   `height`：精灵的高度。\n*   `halfWidth`：精灵宽度的一半。\n\
  *   `halfHeight`：精灵高度的一半。\n*   `scaleX`：精灵的水平缩放比例（作为 0 到 1 之间的归一化值）。\n*   `scaleY`：精灵的垂直缩放比例（作为\
  \ 0 到 1 之间的归一化值）。\n*   `centerX`：精灵的中心 x 位置。\n*   `centerY`：精灵的中心 y 位置。\n*   `rotation`：精灵的旋转角度，以弧度为单位。\n\
  *   `alpha`：精灵的透明度（作为 0 到 1 之间的归一化值）。\n*   `vx`：精灵的垂直速度。\n*   `vy`：精灵的水平速度。\n* \
  \  `layer`：精灵在显示堆栈中的位置（0 为底层）。\n\n你还需要一些方法来将精灵分组到父容器中，以及一些帮助你管理这些操作的函数：\n\n*   `group`：将精灵分组到一个父容器中。\n\
  *   `addChild`：将一个精灵添加为另一个精灵或容器的子级。\n*   `removeChild`：从父精灵或容器中移除一个精灵。\n\n这些是你制作任何你能想到的\
  \ 2D 游戏所需的仅有的精灵属性和函数。虽然名称可能不同，但你使用的任何 2D 游戏开发工具都会以某种方式允许你访问这些属性和函数。只需在你使用的工具中找出它们，你就能利用本书中的代码。\n\
  \n\n\n### Hexi 与 Ga\n\n本书中的大部分源代码均使用一款名为 **Hexi** 的极简 2D HTML5 游戏引擎编写而成。该引擎由我亲自设计，旨在让你用最少的代码，开发出尽可能多种类的游戏。你可以在这里找到关于\
  \ Hexi 你需要了解的所有信息，包括详细的教程和示例：\n\n```\ngithub.com/kittykatattack/hexi\n```\n\n如果你对本书中代码的具体实现有任何疑问，请参考该链接。（本书中的源代码基于\
  \ `Hexi` v.0.1 版本）。\n\nHexi 还有一个“小妹妹”，名叫 Ga。\n\n```\ngithub.com/kittykatattack/ga\n\
  ```\n\nGa 的 API 与 Hexi 相同，但其代码库几乎小了 10 倍。这怎么可能呢？因为它使用了一个极其轻量级的、基于 Canvas 的渲染器，而没有使用\
  \ WebGL。事实上，Ga 是专门为将其核心压缩到 6.5k 以下而编写的，这使其成为微游戏竞赛（例如一年一度的 JS13K 赛事 `js13kgames.com`）的理想工具。同时，它也是学习底层图形渲染的绝佳途径，无需处理\
  \ WebGL 那些常常不必要的复杂性。\n\n如果你想知道 Hexi 或 Ga 的内部工作原理，或者想从头开始构建你自己的自定义游戏引擎，你可以在本书的姊妹篇《*使用\
  \ HTML5 和 JavaScript 的高级游戏开发*》中找到你需要知道的一切。Ga 实际上只是该书中开发的代码的一个生产级版本。而 Hexi 则是同一个\
  \ API 的实现，其底层运行着一个基于 PixiJS (WebGL) 的渲染器。\n\n#### 源代码\n\n你可以在这里找到本书的所有源代码：\n\n```\n\
  github.com/kittykatattack/agdt\n```\n\n代码按章节组织。只需克隆该仓库，在根目录下启动一个 Web 服务器，然后在您喜欢的浏览器中打开示例即可。\n\
  \n所有示例代码均使用最新版本的 JavaScript：ES6/7（也称为 JavaScript 2016/17）编写。这些代码在当时撰写时，这些标准还非常新，以至于没有任何浏览器厂商完全实现它们。如果你也遇到同样的情况，我建议你使用\
  \ JavaScript ES6 转译器，例如 Babel (`babeljs.io`)，将 ES6 源代码编译成可用于生产环境的 ES5。在所有源代码示例文件中，你会发现一个名为\
  \ `src` 的文件夹，其中包含 ES6 源代码，以及一个名为 `bin` 的文件夹，其中包含转译后的 ES5 代码。\n\n© Rex van der Spuy 2017\n\
  \nRex van der Spuy, *《高级游戏开发者工具包》*, 10.1007/978-1-4842-1097-0_2\n\n## 2. 使用 Tiled\
  \ Editor\n\nRex van der Spuy^(1 )\n\n(1)加拿大，安大略省，多伦多\n\n如果说有什么软件是每个游戏开发者都应该学会使用的，那非\
  \ Tiled Editor 莫属（`www.mapeditor.org`）。Tiled Editor 是一款行业标准的开源应用程序，它让你能够轻松创建视觉上复杂的布局，然后将该布局导出为\
  \ JSON 数据文件，供你构建游戏世界使用。由于 Tiled Editor 仅输出数据，因此它既适用于 JavaScript，也同样适用于使用任何其他技术（如\
  \ C#、Java 或 Objective-C）制作游戏。而且它不仅仅适用于游戏——当你需要设计一个用代码难以描述或极其耗时的大型复杂布局时，都可以使用它。\n\
  \n在本章中，我们将详细研究如何使用 Tiled Editor，以便你能够快速将其应用于自己的项目中。你将了解如何：\n\n-   准备你的源图像。\n-  \
  \ 配置 Tiled Editor。\n-   使用图层和对象。\n-   理解 JSON 数据输出。\n-   将 JSON 数据导入你的游戏代码，并使用它来创建精灵。\n\
  -   创建一个摄像机，使其在大型滚动游戏世界中跟随游戏角色。\n\n学习如何使用 Tiled Editor 并导入其数据所需付出的微小努力，对于它将带给你的巨大生产力提升来说，是完全值得的。\n\
  \n我们将通过制作一个实用的小型 RPG（角色扮演游戏）引擎来学习如何使用 Tiled Editor，如图 2-1 所示。运行本章源文件中的 `fantasy.html`\
  \ 来试用完成后的原型。使用方向键控制精灵角色在世界中行走，并收集三样物品：一颗心、一个骷髅和一只土拨鼠（有点像一只胖乎乎的、毛茸茸的豚鼠）。\n\n![A346816_1_En_2_Fig1_HTML.jpg](img/A346816_1_En_2_Fig1_HTML.jpg)\n\
  \n### 图 2-1. 帮助精灵在游戏世界中收集物品\n\n所有游戏对象都具有正确的深度层级，虽然墙壁、树木和灌木丛会阻挡精灵的道路，但他可以像在真实的 3D\
  \ 空间中一样绕过它们。如果仅使用纯代码来绘制对象的位置和深度，创建如此复杂的布局将相当困难——因此，这是 Tiled Editor 的完美用武之地！\n\n\
  ## 选择你的图像\n\n首先要从包含游戏图形的图块集开始。\n\n### 注意\n图块集，也称为精灵表，是将所有游戏图像作为子图像包含在单个图像中。\n\n\
  你需要使用图形编辑器（如 Illustrator、Pixelmator、Photoshop、Gimp 或 Piskel）创建游戏图形，然后使用 Shoebox\
  \ 或 Texture Packer 等工具打包。\n\n整个滚动游戏世界仅使用了图 2-2 中所示的少量图像构建而成。完成的游戏世界看起来很复杂，但使用这个图块集仅用了几分钟就拼凑完成了。大多数精灵图像是\
  \ 64 x 64 像素，但右上角较小的图像是 32x32 像素。大树是 128x128 像素。你可以混合搭配任意大小的精灵图像，但如果将它们保持在 2 的幂次方大小（`8x8`、`16x16`、`32x32`\
  \ 等），你的工作会轻松得多。\n\n![A346816_1_En_2_Fig2_HTML.jpg](img/A346816_1_En_2_Fig2_HTML.jpg)\n\
  \n### 图 2-2. 从一个图块集开始\n\n你可以看到，该图块集包含了关卡中除一个角色之外的所有精灵：精灵角色。这是因为我们稍后会直接在游戏代码中添加这个动画精灵。（你将在后续步骤中看到如何操作）。\n\
  \n## 创建地图\n\n**地图** 是 Tiled Editor 对你正在创建的游戏屏幕布局的称呼。它只是一个由单元格组成的矩形网格。我们在本章中创建的游戏地图是一个\
  \ 24 x 24 的单元网格，每个单元宽高均为 32 像素。这意味着整个地图的宽度和高度为 768 像素。\n\n要在 Tiled Editor 中创建新地图，请从菜单中选择“文件\
  \ ➤ 新建”。将出现“新建地图”对话框，让你设置地图属性，如图 2-3 所示。对于平面的 2D 地图，选择**正交**方向。选择 CSV 图层格式，以便地图信息以数组形式输出。同时，保持\
  \ Tile 渲染顺序的默认值“右下”。然后，设置地图的宽度和高度（以图块为单位），然后定义每个图块的宽度和高度。如果你的图块集包含不同大小的图像，请将图块高度和宽度设置为*最小*图像的大小。在此示例中，图块集上最小的图像是\
  \ 32x32 像素。完成后选择“确定”。\n\n![A346816_1_En_2_Fig3_HTML.jpg](img/A346816_1_En_2_Fig3_HTML.jpg)\n\
  \n### 图 2-3. 设置地图属性\n\n\n\n### 注意\n\n本书使用的是写作时最新的 **Tiled Editor** 版本 0.15.0。你使用的版本可能在组织方式、布局和输出上略有不同，因此请将这些细节视为通用指南，并根据实际情况自行判断如何应用。\n\
  \n接下来，加载你的图块集。点击 Tiled Editor 工作区右侧 `图块集` 面板中的 `新建图块集` 按钮。为你的图块集命名，并将 `类型` 设置为“基于图块集图像”。浏览到图块集所在位置，并定义每个图块的高度和宽度。同样，将此高度和宽度设置为你最小精灵图像的大小。在本示例中，我将图块集命名为“fantasy”，并将图块宽度和高度设置为\
  \ 32 像素，如图 2-4 所示。如果你的图块集中每个图像周围有间距（内边距），请在此处输入间距数值。（像 Texture Packer 这类软件生成的图块集会在每个子图像周围添加两个像素的默认内边距）。完成后点击\
  \ `确定`。\n\n![A346816_1_En_2_Fig4_HTML.jpg](img/A346816_1_En_2_Fig4_HTML.jpg)\n\n\
  ### 图 2-4. 设置图块集\n\n### 注意\n\n如果需要，你可以为每个关卡使用多个图块集，并且图块集可以是任意大小。你也可以选择不使用图块集，而是通过选择\
  \ `类型` 选项中的“基于图像集合”来使用单独的图像文件构建游戏。这使得 Tiled Editor 成为一个极其灵活的布局工具。\n\n完成后，你会看到你的图块集加载到\
  \ `图块集` 面板中，如图 2-5 所示。\n\n![A346816_1_En_2_Fig5_HTML.jpg](img/A346816_1_En_2_Fig5_HTML.jpg)\n\
  \n### 图 2-5. 加载你的图块集\n\n## 设置图像属性\n\n你可以为图块集上的每个图像创建并设置属性，并且你可以在游戏代码中访问所有这些属性。在本示例中，我想为骷髅头、心脏和土拨鼠图像分配名称。以下是如何为每个图像分配名称：\n\
  \n1.  点击一个图像，找到 `属性` 面板中的 `自定义属性` 部分。\n2.  创建一个名为 `name` 的新属性，并为该图像指定一个名称。\n\n我将这些图像分别命名为“skull”、“marmot”和“heart”，如图\
  \ 2-6 所示。在本章后面，你将看到如何在游戏代码中将此信息作为对象属性进行访问。\n\n![A346816_1_En_2_Fig6_HTML.jpg](img/A346816_1_En_2_Fig6_HTML.jpg)\n\
  \n### 图 2-6. 设置可选的图像属性\n\n## 使用图层\n\n现在你可以开始构建地图了！Tiled Editor 允许你创建**图层**，以便在游戏世界的不同元素之间进行组织。在一个简单的地图中，你可能有一个名为\
  \ `maze` 的图层，其中包含迷宫的所有墙壁，以及另一个名为 `enemies` 的图层，其中包含游戏中的所有敌人。我们在此示例中构建的地图稍微复杂一些，因为我们使用图层来帮助创建浅\
  \ 3D 效果。我们的地图使用六个图层，从地面开始，垂直向上，一直到树梢：\n\n*   **ground（地面）**：草地。该图层用于放置精灵脚下的事物。\n\
  *   **obstacles（障碍物）**：树木的底部、灌木丛的底部和墙壁的底部。这些是精灵脚以上但头部以下的事物。\n*   **items（物品）**：心脏、骷髅头和土拨鼠。这些东西也大约处于中等高度。\n\
  *   **objects（对象）**：精灵。它也处于中等高度，但应显示在物品的前面。\n*   **wallTops（墙顶）**：墙壁的顶部。这些位于精灵头部上方。\n\
  *   **treeTops（树顶）**：树木的顶部。这些位于墙壁顶部上方。\n\n图 2-7 显示了游戏中的一个场景，你可以同时看到所有这些深度图层。你能将每个图层与最终场景中的对应部分匹配起来吗？你是否注意到上层的事物覆盖了下层的事物？\n\
  \n![A346816_1_En_2_Fig7_HTML.gif](img/A346816_1_En_2_Fig7_HTML.gif)\n\n### 图 2-7.\
  \ 构成此场景的所有精灵已被组织成 6 个深度图层\n\n### 注意\n\n这种伪 3D 效果有时被称为 2.5D。就像你坐在椅子上，俯视着游戏发生的桌面。精灵本身是平面的，像一张张纸，但如果它们靠近屏幕底部，看起来就离我们更近；如果靠近屏幕顶部，看起来就更远。\n\
  \n通过根据从底部到顶部的深度来组织图层，我们可以轻松地创造出深度的错觉。离观察者更近的精灵会遮挡住那些更远的精灵。\n\n通过点击图 2-8 中 `图层` 面板的\
  \ `新建图层` 按钮来创建这六个图层。\n\n![A346816_1_En_2_Fig8_HTML.jpg](img/A346816_1_En_2_Fig8_HTML.jpg)\n\
  \n### 图 2-8. 创建一些地图图层\n\n从 `新建图层` 按钮菜单中可以看出，你可以创建三种类型的图层：`Tile`（图块）、`Object`（对象）和\
  \ `Image`（图像）图层。\n\n*   **Tile Layer（图块图层）**：使用矩形图块来构成这类图层。这非常适合固定网格布局，大多数 2D 游戏关卡都是这样设计的。图块图层上的任何内容最终都会形成一个图像\
  \ ID 代码数组。在本示例中，除了精灵之外的所有内容都是在 `Tile` 图层上创建的。\n*   **Object Layer（对象图层）**：用于应该自由放置而不是固定在刚性网格系统中的精灵。它也适用于放置当前图块集中没有的对象，或者稍后由代码生成的对象。你还可以使用对象图层来添加非可视的游戏元素，这些元素可在游戏中提供一些有用的数据。`Object`\
  \ 图层上的任何内容在最终的 JSON 文件中都将被描述为一个 JavaScript 对象。在本示例中，精灵角色将位于对象图层上。\n*   **Image Layer（图像图层）**：用于放置单个图像。使用\
  \ `图层属性` 面板中的 `图像` 字段来浏览图像或设置其 URL。当你将地图导出为 JSON 文件时，此信息将生成图像文件的路径及其 `x` 和 `y` 像素坐标。\n\
  \n### 注意\n\n通过使用对象和图像图层，Tiled 成为任何类型游戏（不仅仅是基于图块的游戏）的非常灵活的视觉布局编辑器。关于需要多少层、精灵的大小和形状，或者每种图层类型上应该放置什么类型的事物，没有固定规则。只需使用对你的游戏类型有意义的任何组织系统即可。\n\
  \n我们现在准备开始设计地图。\n\n## 构建地图\n\n我们将从最底层（地面）开始，然后逐层向上。\n\n选择 `ground（地面）` 图层，点击草地图块，然后使用油漆桶工具用草地填充关卡，如图\
  \ 2-9 所示。\n\n![A346816_1_En_2_Fig9_HTML.jpg](img/A346816_1_En_2_Fig9_HTML.jpg)\n\
  \n### 图 2-9. 使用油漆桶工具用草地填充关卡\n\n接下来是 `obstacles（障碍物）` 图层。这些是阻止精灵角色移动的事物。你可以将 `obstacles`\
  \ 图层上的任何事物视为迷宫的墙壁。这包括树干、墙壁底部和灌木丛底部。\n\n按住 `command` 或 `ctrl` 键可同时选择多个图块图像。选择 `图章`\
  \ 工具，并使用它将精灵图像印到关卡上。使用 `橡皮擦` 工具修正任何错误。参见图 2-10。\n\n![A346816_1_En_2_Fig10_HTML.jpg](img/A346816_1_En_2_Fig10_HTML.jpg)\n\
  \n\n\n### 图 2-10. 添加障碍物\n\n接下来，添加道具层。这些是精灵能够拾取的东西。我们在道具层只需要三样东西：心形、骷髅头和土拨鼠。使用印章工具将这些添加到图层中，如图\
  \ 2-11 所示。\n\n![A346816_1_En_2_Fig11_HTML.jpg](img/A346816_1_En_2_Fig11_HTML.jpg)\n\
  \n### 图 2-11. 添加可收集物品\n\n接下来是对象层。我们将在这里添加精灵角色——*以数据对象的形式*。精灵没有在瓦片集中用图片表示，因为稍后我们将通过代码将其构建为一个复杂的动画精灵。你可以用一个简单的精灵占位图，并以我添加其他图片相同的方式将其添加到地图中，但我想借此机会向你展示\
  \ Tiled Editor 的对象是如何工作的。\n\n从图 2-12 中可以看到，精灵所在的图层类型叫做 `objects`。这是一种特殊的图层，允许你自由放置物品，而无需将它们吸附到网格上。它还允许你为对象指定自定义的宽度和高度。这意味着你可以放置任意大小的对象，并精确指定其屏幕坐标中的\
  \ `x` 和 `y` 值。对象图层上的内容在导出的 JSON 文件中将以 JavaScript 对象数组的形式呈现，并且你可以为每个对象赋予一组独一无二的属性。\n\
  \n![A346816_1_En_2_Fig12_HTML.jpg](img/A346816_1_En_2_Fig12_HTML.jpg)\n\n### 图 2-12.\
  \ 添加一个对象并为其设置属性\n\n要向对象图层添加内容，请使用某个形状工具，然后在希望对象出现的位置绘制形状。上下文相关的“属性”面板将显示你正在创建的新对象的属性。Tiled\
  \ Editor 的对象有一些默认属性，例如位置和大小，这些属性与我们在本书中使用的精灵对象的属性非常接近。在这个例子中，我将对象名称设置为 `\"elf\"\
  `，并将其宽度和高度设置为 64 像素。你可以根据需求更改或添加任意数量的其他属性，所有这些属性都将在最终的游戏代码中访问得到。任何你以这种方式创建的对象，都可以从\
  \ Tiled Editor 便捷的“对象”面板中访问。\n\n还有两个图层需要添加：`wallTops` 和 `treeTops`，如图 2-13 所示。\n\
  \n![A346816_1_En_2_Fig13_HTML.jpg](img/A346816_1_En_2_Fig13_HTML.jpg)\n\n### 图 2-13.\
  \ 添加墙壁顶部和树冠\n\n现在，大功告成！\n\n## 理解 JSON 地图数据\n\n当你完成地图构建后，请按照以下步骤将地图保存并导出为 JSON 数据：\n\
  \n1.  从主菜单中选择 `文件` ➤ `另存为...`，将文件保存为 Tiled Editor 自有的 TMX 格式。\n2.  选择 `地图` ➤ `地图属性...`。在属性面板中找到\
  \ `瓦片图层格式` 属性，并选择 `CSV`。CSV（逗号分隔值）选项会将地图图层导出为数字数组，这正是我们需要的。\n3.  通过选择 `文件` ➤ `导出为...`\
  \ 将地图数据导出为 JSON，并选择 `JSON` 作为文件类型。\n4.  现在我们有了一个包含潜在有用地图数据的 JSON 文件，但我们该如何使用它呢？\n\
  \n重要的是要记住，地图中的每个图层都以数组形式表示。这意味着 JSON 文件将至少包含六个数组。其中五个数组包含的是瓦片集帧 ID 代码。还有一个数组代表对象图层，它是一个对象数组。JSON\
  \ 文件还会提供关于地图、瓦片的高度和宽度，以及所有瓦片属性的信息。所有这些额外信息都包含在拥有自己子数组的子对象中。数据量很大，如果你是第一次打开 JSON\
  \ 数据文件，可能会被眼前的内容搞得不知所措。别让它吓到你！你很快就会发现，它的结构非常合乎逻辑，一旦理解了它，在游戏程序中使用所有这些数据就会变得很容易。\n\
  \n### 注意\n\nTiled Editor 的数据输出已成为游戏设计行业的事实标准，因此学习其结构以及如何将其整合到你自己的游戏中，是一项值得长期投入的技能。\n\
  \n我们尽量保持简单，先从安全距离审视一下 JSON 文件的总体结构。下面是一个简略版本，展示了最重要的属性。\n\n```\n{\n //地图的属性    \
  \        \n \"backgroundcolor\": \"#ffffff\",\n \"height\": 24,\n \"nextobjectid\"\
  : 2, //仅供 Tiled Editor 内部使用\n \"orientation\": \"orthogonal\",\n \"properties\"\
  : {/* 你可能设置的任何自定义属性 */},\n \"renderorder\": \"right-down\",\n \"tileheight\": 32,\n\
   \"tilewidth\": 32,\n \"version\": 1,\n \"width\": 24,\n\n //`layers` 属性是一个对象数组。每个对象都包含\
  \            \n //另一个数组，该数组代表该图层的地图数据。图层            \n //对象还包含图层属性，包括其名称、类型和大小 \
  \           \n \"layers\":[\n   {\"data\": [1, 2, 1, 2, 1, 2, ...], //图层属性...},\n\
     {\"data\": [0, 0, 0, 0, 0, 0, ...], //图层属性...},\n   {\"data\": [0, 0, 0, 0, 0,\
  \ 0, ...], //图层属性...},\n   {\"objects\": [{\"name\":\"elf\", //...更多对象属性...}], //图层属性...},\n\
     {\"data\": [0, 0, 0, 0, 0, 0, ...] ], //图层属性...},\n   {\"data\": [19, 20, 21,\
  \ 22, 0, ...], //图层属性...},\n ],\n\n //`tilesets` 属性是一个对象数组。每个对象            \n //代表地图中使用的一个瓦片集。（本例中我们只用了\
  \            \n //一个。）这些对象包含默认的瓦片集            \n //属性，以及自定义属性，比如精灵图像名称         \
  \   \n \"tilesets\":[\n    { //...瓦片集属性，例如每个瓦片的宽度和高度。\n      //我们设置的自定义瓦片名称属性：\n\
        \"tileproperties\": {\n        \"11\": {\"name\": \"heart\"},\n        \"\
  4\": {\"name\": \"skull\"},\n        \"5\": {\"name\": \"marmot\"}\n      },\n    }\n\
    ]\n}\n```\n\n大部分地图数据，即那些实际告诉你地图每个单元格中内容的数据，都位于每个图层对象的 `\"data\"` 属性中。让我们看看第一个图层对象内部是什么：\n\
  \n```\n{\n  \"data\":[\n      1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,\n\
        7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,\n      1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,\n\
        7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,\n      ...等等。\n    ],\n   \"\
  height\": 24,\n   \"name\": \"ground\",\n   \"opacity\": 1,\n   \"type\": \"tilelayer\"\
  ,\n   \"visible\": true,\n   \"width\": 24,\n   \"x\": 0,\n   \"y\": 0\n},\n```\n\
  \n你可以看到，它包含一些有用的属性，比如图层的名称和类型。`data` 数组是一个包含 576 个数字的列表，这些数字代表该图层上的所有瓦片（24x24 瓦片\
  \ = 576）。这些数字被称为**网格 ID** 或 **gid**，每个数字都指向瓦片集中的一张图片。Tiled Editor 从左到右对瓦片集中的每张图片进行编号，从\
  \ 1 开始。图 2-14 显示了前 12 个瓦片集图像的网格 ID。你可以看到，1、2、7 和 8 与草地瓦片相匹配。`data` 数组使用这些数字来表示每个图层的视觉布局。\n\
  \n![A346816_1_En_2_Fig14_HTML.jpg](img/A346816_1_En_2_Fig14_HTML.jpg)\n\n\n\n###\
  \ 图 2-14. 网格编号用于在数组中表示精灵图像\n\n在我们的地图中，创建了五个图块层和一个对象层。对象层包含一个名为 `objects` 的数组，在本例中该数组只包含一个对象：精灵。你可以看到，我们为精灵分配的所有属性（如其名称和尺寸）都可以作为此数组中的一个对象来访问。\n\
  \n```\n{\n  \"draworder\": \"topdown\",\n  \"height\": 24,\n  \"name\": \"objects\"\
  ,\n  \"opacity\": 1,\n  \"type\": \"objectgroup\",\n  \"visible\": true,\n  \"width\"\
  : 24,\n  \"x\": 0,\n  \"y\": 0,\n  \"objects\":[\n    {\n      \"height\": 64,\n\
  \      \"name\": \"elf\",\n      \"properties\": {/* 任何自定义属性 */},\n      \"rotation\"\
  : 0,\n      \"type\": \"\",\n      \"visible\": true,\n      \"width\": 64,\n  \
  \    \"x\": 287,\n      \"y\": 350\n    }]\n}\n```\n\n最后，还有一个名为 `tilesets` 的数组，它代表了用于构建此关卡的所有图块集。每个图块集都表示为一个对象，在本示例中我们只使用了一个图块集：\n\
  \n```\n\"tilesets\":[\n  {\n    \"columns\": 6,\n    \"firstgid\": 1,\n    \"image\"\
  : \"../images/fantasy.png\",\n    \"imageheight\": 192,\n    \"imagewidth\": 192,\n\
  \    \"margin\": 0,\n    \"name\": \"fantasy\",\n    \"properties\": {/* 任何自定义属性\
  \ */},\n    \"spacing\": 0,\n    \"tilewidth\": 32,\n    \"tileheight\": 32,\n \
  \   \"tileproperties\": {\n      \"11\": {\"name\": \"heart\"},\n      \"4\": {\"\
  name\": \"skull\"},\n      \"5\": {\"name\": \"marmot\"}\n    }\n  }\n]\n```\n\n\
  可以看到，我们为 heart、skull 和 marmot 分配的自定义名称属性位于 `tileproperties` 子对象中。注意，它们的 ID 编号比图块集中的网格编号小\
  \ 1。\n\n### 注意\n\n这些数字相差 1 是有一定逻辑的，但只有当你使用多个图块集来制作地图时才能体会到这一点。如果你确实使用了多个图块集，请继续阅读！`tileproperties`\
  \ 中使用的 ID 编号是 Tiled Editor 所称的图块集中图块的“本地”ID。这些本地 ID 从 0 开始编号。数据数组中使用的 ID 则是“全局”图块\
  \ ID。这些全局 ID 可以跨越多个图块集。这意味着第一个图块集可能从 1 开始编号，第二个图块集可能从 32 开始，而第三个可能从 96 开始（0 保留给“无图块”）。你可以使用每个本地图块集的\
  \ `firstgid` 属性来确定全局 ID 应来自哪个图块集。然后，通过减去 `firstgid`，你可以将其映射为该图块集中的本地 ID。但如果只使用单个图块集，直接减\
  \ 1 即可，因为这就是第一个图块集的 `firstgid`。有点困惑？别担心！只有当你使用多个图块集创建第一个地图时，这一切才会开始变得有意义。\n\n现在所有这些数据对你来说开始有意义了吗？如果你和我一样，你那小小的程序员之心一定会欣喜若狂！因为你知道这些都是非常有价值的东西。你可以利用所有这些数据，自动生成所有精灵并布局游戏地图。那么，我们该如何深入利用它呢？\n\
  \n## 使用 JSON 数据构建关卡\n\nJSON 数据并不关心我们想用它制作什么样的游戏，也不关心你使用的是什么技术。你可以用同样的数据制作基于 Objective-C、Haxe、Unity\
  \ 或 Elm 的游戏。这意味着你需要编写一个函数来解释这些数据，并决定应如何使用它来构建游戏关卡。如何处理这些数据完全由你决定。\n\n### 决定如何使用数据\n\
  \n从哪里开始？根据你想制作的游戏类型，制定一系列关于如何解释所有这些数据的规则。对于我想制作的奇幻角色扮演游戏，我提出了以下要求：\n\n*   整个游戏世界将包含在一个名为\
  \ `world` 的**容器组**中。“容器组”只是我用来描述包含嵌套子**精灵**的对象的术语。（回忆一下，精灵就是构成游戏世界的交互式图像）。\n\n*\
  \   每个图块集层也应该是 `world` 容器内的一个独立组。这里有五个图块集层，这意味着最终会有五个组：`ground`、`obstacles`、`items`、`wallTops`\
  \ 和 `treeTops`。所有这些层都有一个 `name` 属性，我会将该名称属性分配给层组，以便稍后访问。\n\n*   对象层上的任何内容都应作为一个简单的\
  \ JavaScript 对象返回给游戏。之后我可以决定如何使用该对象中的数据。如果需要，我会使用对象的 `name` 属性来访问它。在当前示例中只有一个对象：精灵。\n\
  \n*   层内的所有图像都将被创建为精灵。\n\n*   我需要一种方法来引用我在世界中创建的所有对象。我将添加两个搜索函数，允许我通过名称搜索对象。`world.getObject(\"\
  name\")` 将检索与所查找对象的 name 属性匹配的单个对象。它可以是精灵、层组或数据对象。`world.getObjects(\"elf\", \"\
  obstacles\", \"marmot\")` 返回一个对象数组，其名称与参数中的名称相匹配。\n\n*   为了尽可能保持简单，我将限制每个地图只使用一个图块集。\n\
  \n这是我提出的要求列表，但你的要求可能会根据你所制作的游戏类型以及所需的灵活性而有所不同。\n\n##### 游戏代码 API\n\n在我们探讨如何实现这些规则之前，让我们先看看完成后的\
  \ API 会是什么样子。我将能够像这样创建一个新的游戏世界：\n\n```\nlet world = makeTiledWorld(data.json, tileset.png);\n\
  ```\n\n然后世界将神奇地出现，完全就像我在 Tiled Editor 中设计的那样。如果我想从世界中检索一个层组、精灵或对象，可以这样做：\n\n```\n\
  let elf = world.getObject(\"elf\");\n```\n\n我可以像这样将一组对象作为一个数组来检索：\n\n```\nlet items\
  \ = world.getObjects(\"heart\", \"skull\", \"marmot\");\n```\n\n如果我有多个精灵共享相同的图块集名称属性，我也可以将它们全部检索到一个数组中。例如，如果我有一个名为\
  \ “wall” 的图块集图像，并且在世界中使用了这个图像 20 次，我可以像这样将所有墙精灵检索到一个数组中：\n\n```\nlet walls = world.getObjects(\"\
  wall\");\n```\n\n这是一个简单的 API，对于大多数类型的游戏来说，它足以提供我所需的灵活性。\n\n那么，如何实现这一切呢？\n\n## 编写\
  \ `makeTiledWorld` 函数\n\n我可以编写一个名为 `makeTiledWorld` 的函数来完成所有工作。关于代码如何工作的所有细节都包含在注释中，但我将在代码清单之后重点介绍几个重要特性。\n\
  \n\n\n### 注意\n\n此代码清单展示了 Hexi 游戏引擎如何实现 `makeTiledWorld`，其中包含一些你应该了解的具体实现细节。`Container`\
  \ 和 `Sprite` 是 PixiJS 对象。Pixi 的资源加载器用于加载 JSON 文件。（Hexi 使用 PixiJS 作为其底层渲染引擎和资源加载器）。`frame`\
  \ 函数是 Hexi 引擎内置的一个自定义函数，用于从单个父图像中捕获矩形子图像。你需要在你所使用的任何技术中找到这些细节的等效实现。\n\n```\nmakeTiledWorld(jsonTiledMap,\
  \ tileset) {\n\n//获取 JSON 文件的引用            \n  let tiledMap = PIXI.loader.resources[jsonTiledMap].data;\n\
  \n//创建一个名为 `world` 的容器组，用于包含来自 `tiledMap` 的所有图层、精灵            \n  //和对象。`world`\
  \ 对象将在 `makeTiledWorld`            \n  //函数完成后返回给主游戏程序            \n  let world\
  \ = new Container();\n\n//设置构成地图的每个图块的宽度和高度。            \n  //（本例中图块大小为 32x32 像素）\
  \            \n  world.tileheight = tiledMap.tileheight;\n  world.tilewidth = tiledMap.tilewidth;\n\
  \n//计算世界的 `width` 和 `height`，单位为像素            \n  world.worldWidth = tiledMap.width\
  \ * tiledMap.tilewidth;\n  world.worldHeight = tiledMap.height * tiledMap.tileheight;\n\
  \n//获取世界（以图块计）的高度和宽度引用，            \n  //以备后续使用（你会用到的！）            \n  world.widthInTiles\
  \ = tiledMap.width;\n  world.heightInTiles = tiledMap.height;\n\n//创建一个 `objects`\
  \ 数组，用于存储对地图中任何            \n  //命名对象的引用。命名对象都具有            \n  //在 Tiled Editor\
  \ 中分配的 `name` 属性            \n  world.objects = [];\n\n//每个图块周围的可选间距（填充）       \
  \     \n  //这部分是为了解决图块周围的间距问题，            \n  //该间距在使用纹理图集图块集时很常见。在 Tiled Editor\
  \ 中创建新地图时设置            \n  //`spacing` 属性            \n  let spacing = tiledMap.tilesets[0].spacing;\n\
  \n//计算图块集上有多少列。            \n  //这等于图像的宽度除以每个图块的宽度，            \n  //再加上每个图块周围可能有的可选间距\
  \            \n  let numberOfTilesetColumns =\n    Math.floor(\n      tiledMap.tilesets[0].imagewidth\n\
  \      / (tiledMap.tilewidth + spacing)\n    );\n\n//遍历所有地图图层            \n  tiledMap.layers.forEach(tiledLayer\
  \ => {\n\n//为此图层创建一个容器组，并复制            \n    //该图层的所有属性到该组上            \n    let\
  \ layerGroup = new Container();\n\nObject.keys(tiledLayer).forEach(key => {\n\n\
  //将图层的所有属性添加到组中，但不包括            \n      //宽度和高度（因为容器组会根据其内容自行计算这些值）            \n\
  \      if (key !== \"width\" && key !== \"height\") {\n        layerGroup[key] =\
  \ tiledLayer[key];\n      }\n    });\n\n//将 Tiled Editor 的 `opacity` 属性转换为 Container\
  \ 的            \n    //等效 `alpha` 属性            \n    layerGroup.alpha = tiledLayer.opacity;\n\
  \n//将该组添加到 `world`            \n    world.addChild(layerGroup);\n\n//将该组推入 `world`\
  \ 的 `objects` 数组            \n    //以便稍后可以访问它            \n    world.objects.push(layerGroup);\n\
  \n//当前图层是 `tilelayer` 吗？            \n    if (tiledLayer.type === \"tilelayer\"\
  ) {\n\n//遍历该图层的 `data` 数组            \n      tiledLayer.data.forEach((gid, index)\
  \ => {\n        let tileSprite, texture, mapX, mapY, tilesetX, tilesetY,\n     \
  \       mapColumn, mapRow, tilesetColumn, tilesetRow;\n\n//如果网格 ID 号（`gid`）不为零，则创建一个精灵\
  \            \n        if (gid !== 0) {\n\n//计算出我们当前所在的地图列和行号，然后            \n \
  \         //计算网格单元的 x 和 y 像素位置            \n          mapColumn = index % world.widthInTiles;\n\
  \          mapRow = Math.floor(index / world.widthInTiles);\n          mapX = mapColumn\
  \ * world.tilewidth;\n          mapY = mapRow * world.tileheight;\n\n//计算出图块集图像所在的列和行号，\
  \            \n          //然后使用这些值计算该图像在图块集上的            \n          //x 和 y 像素位置\
  \            \n          tilesetColumn = ((gid - 1) % numberOfTilesetColumns);\n\
  \          tilesetRow = Math.floor((gid - 1) / numberOfTilesetColumns);\n      \
  \    tilesetX = tilesetColumn * world.tilewidth;\n          tilesetY = tilesetRow\
  \ * world.tileheight;\n\n//补偿图块周围可能存在的任何可选间距（填充），            \n          //如果有的话。这段代码会累积从图块集左侧开始的间距偏移量，\
  \            \n          //并将它们添加到当前图块的位置中            \n          if (spacing >\
  \ 0) {\n            tilesetX\n              += spacing\n              + (spacing\
  \ * ((gid - 1) % numberOfTilesetColumns));\n            tilesetY\n             \
  \ += spacing\n              + (spacing * Math.floor((gid - 1) / numberOfTilesetColumns));\n\
  \          }\n\n//使用上述值从图块集图像创建精灵的图像。            \n          //自定义的 `frame` 方法从图块集中捕获正确的图像\
  \            \n          texture = frame(\n            tileset, tilesetX, tilesetY,\n\
  \            world.tilewidth, world.tileheight\n          );\n\n//我已决定任何具有 `name`\
  \ 属性的图块都很重要            \n          //并且应该在 `world.objects` 数组中可访问\n\nlet tileproperties\
  \ = tiledMap.tilesets[0].tileproperties,\n              key = String(gid - 1);\n\
  \n//如果 JSON 的 `tileproperties` 对象有一个与当前图块匹配的子对象，            \n          //并且该子对象有一个\
  \ `name` 属性，            \n          //则创建一个精灵并将图块属性赋值给            \n          //该精灵\
  \            \n          if (tileproperties[key] && tileproperties[key].name) {\n\
  \n//创建一个精灵            \n            tileSprite = new Sprite(texture);\n\n//将该图块的所有属性复制到精灵上\
  \            \n            //（包括 `name` 属性）            \n            Object.keys(tileproperties[key]).forEach(property\
  \ => {\n              tileSprite[property] = tileproperties[key][property];\n  \
  \          });\n\n//将该精灵推入 `world` 的 `objects` 数组            \n            //以便稍后可以通过\
  \ `name` 访问它            \n            world.objects.push(tileSprite);\n        \
  \  }\n\n//如果图块没有 `name` 属性，则仅用它            \n          //创建一个普通精灵（它只需要一个纹理）    \
  \        \n          else {\n            tileSprite = new Sprite(texture);\n   \
  \       }\n\n//将精灵放置在地图上            \n          tileSprite.x = mapX;\n         \
  \ tileSprite.y = mapY;\n\n//记录该精灵在数组中的索引号            \n          //（我们将用它进行碰撞检测，你将在下一章学习）\
  \            \n          tileSprite.index = index;\n\n//记录该精灵在图块集上的 `gid`。     \
  \       \n          //这对后续的碰撞检测也很有用            \n          tileSprite.gid = gid;\n\
  \n//将该精灵添加到当前图层组            \n          layerGroup.addChild(tileSprite);\n     \
  \   }\n      });\n    }\n\n//我们现在已经处理完图块图层，让我们继续！\n\n//这一层是 Tiled Editor 的 `objectgroup`\
  \ 吗？            \n    if (tiledLayer.type === \"objectgroup\") {\n      tiledLayer.objects.forEach(object\
  \ => {\n```\n\n\n\n// 我们只是要获取对象的属性  \n// 以便后续决定如何处理它  \n\n// 获取对象所在图层组的引用  \n`object.group\
  \ = layerGroup;`\n\n// 将对象推入世界的 `objects` 数组  \n`world.objects.push(object);`\n\n\
  // 搜索函数\n\n/*  \n`world.getObject` 和 `world.getObjects`（带\"s\"的版本）用于搜索并返回  \n`world.objects`\
  \ 数组中的任何精灵或对象。  \n任何在 Tiled Editor 中具有 `name` 属性的对象都会出现在搜索结果中。  \n`getObject` 返回单个对象，`getObjects`\
  \ 返回对象数组。  \n`getObject` 实际返回搜索函数本身，因此你可以  \n使用以下格式直接访问单个对象：  \n`sprite.x = world.getObject(\"\
  anySprite\").x;`  \n`sprite.y = world.getObject(\"anySprite\").y;`  \n*/\n\n`world.getObject\
  \ = objectName => {`  \n    `let searchForObject = () => {`  \n      `let foundObject;`\
  \  \n      `world.objects.some(object => {`  \n        `if (object.name && object.name\
  \ === objectName) {`  \n          `foundObject = object;`  \n          `return true;`\
  \  \n        `}`  \n      `});`  \n      `if (foundObject) {`  \n        `return\
  \ foundObject;`  \n      `} else {`  \n        `throw new Error(\"没有名称为 \" + objectName\
  \ + \" 的对象\");`  \n      `}`  \n    `};`\n\n    // 返回搜索函数\n    `return searchForObject();`\
  \  \n`};`\n\n`world.getObjects = objectNames => {`  \n    `let foundObjects = [];`\
  \  \n    `world.objects.forEach(object => {`  \n      `if (object.name && objectNames.indexOf(object.name)\
  \ !== -1) {`  \n        `foundObjects.push(object);`  \n      `}`  \n    `});` \
  \ \n    `if (foundObjects.length > 0) {`  \n      `return foundObjects;`  \n   \
  \ `} else {`  \n      `throw new Error(\"找不到这些对象\");`  \n    `}`  \n    `return\
  \ foundObjects;`  \n`};`\n\n// 就这样，我们完成了！\n\n// 最后，将 `world` 对象返回给游戏程序\n`return\
  \ world;`\n```\n\n(你可以在本章源文件的 Hexi `src` 文件夹的 `tileUtilities` 模块中找到 `makeTiledWorld`\
  \ 的完整工作代码)。\n\n这段代码通过遍历 JSON 数据中的所有数组，并利用这些信息来创建精灵并将它们放置在 `world` 中。但有一个重要的细节需要指出。每个精灵都创建了两个新属性：`index`\
  \ 和 `gid`。\n\n```\ntileSprite.index = index;\ntileSprite.gid = gid;\n```\n\n`index`\
  \ 是精灵在地图数组中的数组位置编号。`gid` 是精灵纹理图像在瓦片集上的网格 ID 编号。这两个属性在后续碰撞检测中会非常有用，你将在第 3 章中找到具体用法。敬请期待！\n\
  \n现在让我们了解如何使用 `makeTiledWorld` 来构建游戏。\n\n## 创建游戏世界\n\n查看本章源文件中的 `fantasy.js` 文件，可以找到我们创建的游戏世界的工作示例。图\
  \ 2-15 将左侧最终渲染的地图与我们最初在 Tiled Editor 中设计的地图进行了对比。\n\n![A346816_1_En_2_Fig15_HTML.jpg](img/A346816_1_En_2_Fig15_HTML.jpg)\n\
  \n### 图 2-15. 渲染后的游戏世界与我们用 Tiled Editor 设计的地图一致\n\n使用键盘方向键让精灵在游戏世界中行走，你会注意到精灵的深度层次也是正确的。让我们了解\
  \ `makeTiledWorld` 函数是如何构建这个场景的。\n\n### 创建精灵\n\n当游戏代码的 `setup` 函数运行时，世界会通过 `makeTiledWorld`\
  \ 从 JSON 文件和瓦片集图像中创建。\n\n```\nworld = g.makeTiledWorld(\n    \"maps/fantasy.json\"\
  ,\n    \"images/fantasy.png\"\n  );\n```\n\n这会生成地图，并让我们通过一个名为 `world` 的对象访问所有地图数据。\n\
  \n动画精灵角色是使用另一张名为 `walkcycle.png` 的瓦片集图像创建的，该图像包含精灵的所有动画帧，如图 2-16 所示。\n\n![A346816_1_En_2_Fig16_HTML.jpg](img/A346816_1_En_2_Fig16_HTML.jpg)\n\
  \n### 图 2-16. 精灵的动画瓦片集\n\n以下是游戏 `setup` 函数中使用该动画瓦片集创建精灵的代码。\n\n```\nelf = g.sprite(g.filmstrip(\"\
  images/walkcycle.png\", 64, 64));\n```\n\n自定义的 `filmstrip` 函数捕获 `walkcycle` 瓦片集中每个\
  \ 64x64 像素的帧，并用它来初始化精灵。\n\n你记得我们在 Tiled Editor 中创建了一个占位对象来代表精灵，并用它来设置精灵的 `x` 和 `y`\
  \ 位置。接下来我们要做的是使用这些值来定位新的精灵。我们添加到 `world` 对象中的 `getObject` 方法能够从地图数据中提取任何具有 `name`\
  \ 属性的内容。以下是使用 `getObject` 捕获精灵的 `x` 和 `y` 地图数据值，并将其应用于精灵的 `x` 和 `y` 位置属性的方法。\n\n\
  ```\nelf.x = world.getObject(\"elf\").x;\nelf.y = world.getObject(\"elf\").y;\n\
  ```\n\n这个新的精灵还不是世界的一部分，因此将其添加到世界的对象层。首先获取对象层的引用，然后使用 `addChild` 将精灵添加到其中。\n\n```\n\
  let objectsLayer = world.getObject(\"objects\");\nobjectsLayer.addChild(elf);\n\
  ```\n\n游戏的其余部分负责移动精灵并使其动画化。它还实现了碰撞检测，你将在下一章全面了解其工作原理。\n\n### 更改精灵的深度层\n\n精灵可以在树木和墙壁后面及前面行走，且无需任何其他深度排序代码即可确保其正确显示。这怎么可能？因为后台运行的\
  \ PixiJS 渲染器会按照创建的先后顺序显示精灵——后创建的精灵显示在先创建的精灵之前。大多数 2D 渲染器都以相同方式工作。而且，由于我们是从最底层（地面）开始创建精灵，并逐层向上，因此\
  \ Tiled Editor 上层中的精灵会渲染在下层精灵的前面。这一切都是自动发生的，这得益于我们在 Tiled Editor 中设计图层时的精心规划，以及\
  \ `makeTiledWorld` 函数中创建精灵的顺序。\n\n但如果在游戏进行过程中想要更改精灵的深度层，该怎么办？例如，也许精灵在某个地方发现了梯子，能够爬到墙壁顶部。如何让精灵显示在墙壁之上但在树冠之下？\n\
  \n获取 `\"treeTops\"` 图层组的引用，并将精灵添加到其中。\n\n```\nworld.getObject(\"treeTops\").addChild(elf);\n\
  ```\n\n图 2-17 显示了结果。\n\n![A346816_1_En_2_Fig17_HTML.jpg](img/A346816_1_En_2_Fig17_HTML.jpg)\n\
  \n### 图 2-17. 更改精灵的深度层\n\n既然我们有一个广阔的游戏世界可以探索，让我们添加滚动摄像头。\n\n\n\n#### 滚动世界摄像机\n\n\
  我们的游戏地图远比显示它的游戏屏幕要大得多。但你会注意到，它会非常自然地滚动，以跟随精灵移动。在本节中，你将学习如何实现这种滚动游戏摄像机，从而运用这些概念为你的游戏构建类似的摄像机。\n\
  \n但在我们了解其制作方法之前，首先快速浏览一下你需要编写的高级游戏代码，以便创建和使用摄像机。首先，像这样在游戏世界中初始化摄像机：\n\n```\ncamera\
  \ = g.worldCamera(world, world.worldWidth, world.worldHeight, anyCanvasElement);\n\
  ```\n\n第一个参数是一个包含`x`、`y`属性的精灵。第二和第三个参数以像素为单位定义游戏世界的宽度和高度。最后一个参数是渲染游戏世界的画布 HTML 元素。\n\
  \n摄像机对象有两个有用的方法可以用来控制它：`centerOver`和`follow`。你可以使用`centerOver`方法让摄像机自身居中于某个精灵之上，像这样：\n\
  \n```\ncamera.centerOver(sprite);\n```\n\n使用以下方法让摄像机在游戏循环中跟随任何精灵，像这样：\n\n```\nfunction\
  \ gameLoop() {\n  camera.follow(sprite);\n}\n```\n\n摄像机有一个不可见的内部边界，其大小为画布尺寸的一半。你可以在图\
  \ 2-18 的第一张图片中看到这个不可见的内部边界。精灵可以在这个边界内自由移动，只有当精灵越过边界时，摄像机才会开始移动。当摄像机到达地图边缘时会停止移动，但精灵可以一直走到地图边缘。图\
  \ 2-18 展示了所有这些特性，从而产生了自然的滚动效果。\n\n![A346816_1_En_2_Fig18_HTML.gif](img/A346816_1_En_2_Fig18_HTML.gif)\n\
  \n### 图 2-18. 一个让精灵在游戏世界中自由移动的滚动游戏摄像机\n\n- 你可以将摄像机视为一种悬浮在世界上方的不可见精灵。它拥有`x`和`y`位置，以及高度和宽度。摄像机有一个名为`follow`的方法，可以改变摄像机的`x`和`y`坐标，以跟上它所跟随的任何精灵；还有一个名为`centerOver`的方法，可以将摄像机居中于任何精灵之上。它还会根据地图尺寸检查自身位置，以便在到达地图边缘时停止移动。\n\
  \n- 以下是实现所有这些功能的完整`worldCamera`函数。\n\n```\n    worldCamera(world, worldWidth, worldHeight,\
  \ canvas) {\n\n//定义一个具有实用属性的 `camera` 对象                  \n      let camera = {\n\
  \        width: canvas.width,\n        height: canvas.height,\n        _x: 0,\n\
  \        _y: 0,\n\n//`x` 和 `y` 的 getter/setter                  \n        //当你改变摄像机的位置时，\
  \                  \n        //它们会向相反方向移动世界的位置                  \n        get x()\
  \ {\n          return this._x;\n        },\n        set x(value) {\n          this._x\
  \ = value;\n          world.x = -this._x;\n        },\n        get y() {\n          return\
  \ this._y;\n        },\n        set y(value) {\n          this._y = value;\n   \
  \       world.y = -this._y;\n        },\n\n//摄像机的中心 x 和 y 位置                  \n\
  \        get centerX() {\n          return this.x + (this.width / 2);\n        },\n\
  \        get centerY() {\n          return this.y + (this.height / 2);\n        },\n\
  \n//边界属性定义了一个矩形区域，其大小为游戏屏幕的一半                  \n        //如果摄像机跟随的精灵位于此区域内，摄像机将不会滚动。如果精灵\
  \                  \n        //越过此边界，后面的 `follow` 函数将改变                  \n        //摄像机的\
  \ x 和 y 位置，以滚动游戏世界                  \n        get rightInnerBoundary() {\n          return\
  \ this.x + (this.width / 2) + (this.width / 4);\n        },\n        get leftInnerBoundary()\
  \ {\n          return this.x + (this.width / 2) - (this.width / 4);\n        },\n\
  \        get topInnerBoundary() {\n          return this.y + (this.height / 2) -\
  \ (this.height / 4);\n        },\n        get bottomInnerBoundary() {\n          return\
  \ this.y + (this.height / 2) + (this.height / 4);\n        },\n\n//接下来的代码定义了两个摄像机\
  \                  \n        //方法：`follow` 和 `centerOver`\n\n//使用 `follow` 方法让摄像机跟随一个精灵\
  \                  \n        follow: function(sprite) {\n\n//检查精灵相对于内部边界的位置。如果精灵\
  \                  \n          //移出边界，则移动摄像机以跟随精灵                  \n          if(sprite.x\
  \ < this.leftInnerBoundary) {\n            this.x = sprite.x - (this.width / 4);\n\
  \          }\n          if(sprite.y < this.topInnerBoundary) {\n            this.y\
  \ = sprite.y - (this.height / 4);\n          }\n          if(sprite.x + sprite.width\
  \ > this.rightInnerBoundary) {\n            this.x = sprite.x + sprite.width - (this.width\
  \ / 4 * 3);\n          }\n          if(sprite.y + sprite.height > this.bottomInnerBoundary)\
  \ {\n            this.y = sprite.y + sprite.height - (this.height / 4 * 3);\n  \
  \        }\n\n//如果摄像机到达地图边缘，则停止其移动                  \n          if(this.x < 0) {\n\
  \            this.x = 0;\n          }\n          if(this.y < 0) {\n            this.y\
  \ = 0;\n          }\n          if(this.x + this.width > worldWidth) {\n            this.x\
  \ = worldWidth - this.width;\n          }\n          if(this.y + this.height > worldHeight)\
  \ {\n            this.y = worldHeight - this.height;\n          }\n        },\n\n\
  //使用 `centerOver` 方法将摄像机居中于一个精灵之上                  \n        centerOver: function(sprite)\
  \ {\n\n//将摄像机居中于一个精灵之上                  \n          this.x = (sprite.x + sprite.halfWidth)\
  \ - (this.width / 2);\n          this.y = (sprite.y + sprite.halfHeight) - (this.height\
  \ / 2);\n        }\n      };\n\n//返回 `camera` 对象                  \n      return\
  \ camera;\n    };\n```\n\n- （你可以在 `hexi/src/modules/gameUtilities/src/gameUtilities.js`\
  \ 中找到 `worldCamera` 函数）。\n\n- 可以看到，摄像机实际上只是一个数据模型，用于确定世界的哪一部分应该在画布上可见。摄像机将自身的大小和位置与它所跟随的精灵以及世界的边缘进行比较。\n\
  \n- 诀窍在于摄像机实际上从未移动。当你改变它的 `x` 和 `y` 位置时，它实际上是以相反的量移动世界的位置。\n\n```\n    set x(value)\
  \ {\n      this._x = value;\n      world.x = -this._x;\n    },\n    set y(value)\
  \ {\n      this._y = value;\n      world.y = -this._y;\n    },\n```\n\n- 这使得摄像机看起来像是在世界中移动，而实际上它是在向相反方向移动世界。\n\
  \n## 总结\n\n平铺地图编辑器是游戏设计者可以学习的最有用的软件工具之一。你已经学会了如何设置游戏地图；导入图块集；以及使用平铺地图编辑器的图层、对象和工具来设计你的游戏世界。你还学会了如何读取平铺地图编辑器的\
  \ JSON 地图数据，并使用这些数据构建可重用的代码，以制作各种不同的游戏。此外，你还发现了正确设置游戏对象深度层级，以及添加一个能够跟随游戏角色在世界中移动的摄像机是多么容易。\n\
  \n但是，我们还没结束！你会注意到，在本章的演示游戏中，当精灵角色在世界中行走时，它的路径会被树木、灌木丛和墙壁阻挡。并且，精灵可以拾取世界中的物体。这又是如何实现的呢？你将在下一章中了解，届时我们将详细探讨基于瓦片的游戏的碰撞检测。\n\
  \n© Rex van der Spuy 2017\n\nRex van der Spuy, 《高级游戏开发者工具包》, 10.1007/978-1-4842-1097-0_3\n\
  \n\n\n# 3. 基于瓦片的碰撞检测\n\nRex van der Spuy¹\n\n(1)加拿大多伦多，安大略省\n\n在游戏中检测碰撞主要有两种方式。第一种是比较屏幕上精灵的\
  \ x 和 y 像素位置。如果它们的形状重叠，则发生碰撞。这种碰撞检测策略称为**窄阶段碰撞**。如果你使用过带有类似 `hitTestRectangle` 或\
  \ `hitTestCircle` 等碰撞函数的游戏引擎来检查形状是否重叠，那么这些很可能就是窄阶段碰撞函数。它们使用向量数学（线性代数）来判断精灵的形状是否重叠。因此，你可以实现非常精确的像素级碰撞精度，这对于基于物理的动作游戏非常重要。\n\
  \n另一种检测碰撞的方式是使用基于瓦片的方法。**基于瓦片的碰撞**系统不使用几何学来检测碰撞。它所做的只是读取精灵在数组中的索引号。如果某个精灵位于数组地图中已被另一个精灵占据的位置，则发生碰撞。例如，如果一个精灵在地图上的位置与墙壁相同，那么你就知道该精灵碰到了墙壁。然后你可以设置某种碰撞反应，比如阻止精灵移动。\n\
  \n### 注意\n基于瓦片的碰撞是一种**宽阶段碰撞**，你将在第 6 章中了解更多相关信息。\n\n基于瓦片碰撞的一大优势是，你不必检查每个对象是否与其他所有对象发生碰撞，也无需进行任何几何计算。相反，你只需要读取一个数组。这使得它在\
  \ CPU 效率上远高于窄阶段碰撞测试。更重要的是，你可以为不同类型的事物（如“墙壁”、“敌人”或“物品”）设置少量通用的碰撞检查。即使地图上有数百个这样的元素，每种类型也只需运行一次碰撞检查。这使得基于瓦片的碰撞非常适合可能包含数百个同类元素的巨大游戏地图。并且由于基于瓦片的碰撞通过读取地图数组工作，你可以利用精灵在地图上的位置及其局部环境信息，用于\
  \ AI 或其他游戏逻辑。\n\n基于瓦片碰撞的缺点是无法提供像素级精度。但事实证明，对于许多或大多数 2D 动作游戏来说，精确的像素级碰撞并非必要。基于瓦片的碰撞有一种独特“手感”：坚实、可预测，就像在玩一款真正的电子游戏。上世纪\
  \ 70 和 80 年代整个 8 位和 16 位视频游戏革命都建立在基于瓦片的碰撞之上，它至今仍是你需要了解的最重要的视频游戏碰撞技术。\n\n### 注意\n\
  既想要像素级精度，又想要瓦片级效率？你可以先使用基于瓦片的方法检查碰撞，兼得两者之长。然后，如果检测到一般性碰撞，再使用第二次窄阶段测试来获得进一步的像素级精度。你将在第\
  \ 6 章中找到具体实现方法。\n\n在本章中，你将通过一些经典的迷宫游戏示例，学习基于瓦片碰撞的基础知识。你将有机会了解如何使用瓦片编辑器构建一个平面 2D\
  \ 视频游戏环境，以及如何使用地图数组分析该环境。我们还将为基于瓦片的游戏构建一个通用碰撞函数。最后，我们将把所有这些新技能应用到第 2 章的幻想 RPG 游戏原型中。\n\
  \n## 理解基于瓦片的碰撞\n\n以下是进行基于瓦片碰撞所需了解的基础知识。在开始之前，你的精灵需要一个新的属性，名为 `index`：\n\n```\nplayerSprite.index\
  \ \n```\n\n`index` 只是一个数字，用于指示精灵在地图数组中的位置。\n\n要找到这个数字，你需要将精灵的中心 x 和 y 屏幕位置转换为其对应的数组索引号。下面是一个通用的\
  \ `getIndex` 函数，你可以用来完成这项工作：\n\n```\ngetIndex(x, y, tilewidth, tileheight, mapWidthInTiles)\
  \ {\n\n  //将像素坐标转换为地图索引坐标            \n  let index = {};\n  index.x = Math.floor(x\
  \ / tilewidth);\n  index.y = Math.floor(y / tileheight);\n\n  //返回索引号          \
  \  \n  return index.x + (index.y * mapWidthInTiles);\n};\n```\n\n下一步是找出游戏世界中可能位于同一位置的其他事物。例如，假设你有一个包含敌人位置的地图数组。你可以将其命名为\
  \ `enemyMapArray`。\n\n```\nenemyMapArray = [0, 0, 0, 5, 0, 0, 5, 0, /*...*/];\n\
  ```\n\n任何有敌人的位置都用数字“5”表示。任何没有敌人的位置都用“0”表示。这些数字称为**网格索引** ID 号，或简称为 **gid**。\n\n\
  你可以像这样找出 `playerSprite` 所在位置的 gid：\n\n```\ngid = enemyMapArray[playerSprite.index];\n\
  ```\n\n如果这个 gid 值是“5”，那么你就知道 `playerSprite` 与某个敌人位于同一位置。碰撞发生了！\n\n```\nif (gid ===\
  \ 5) {\n\n    //碰撞！            \n}\n```\n\n你现在知道 `playerSprite` 撞上了一个敌人。但具体是哪一个呢？\n\
  \n要弄清楚这一点，你的游戏需要一个数组来存储对所有敌人精灵的引用：\n\n```\nenemySprites = [enemySprite1, enemySprite2,\
  \ enemySprite3, /*...*/ ];\n```\n\n这些精灵中的每一个也需要一个 `index` 属性，用于指示它们在 `enemyMapArray`\
  \ 中的位置：\n\n```\nenemySprite1.index = 52;\nenemySprite2.index = 3;\nenemySprite3.index\
  \ = 108;\n//...\n```\n\n要找到玩家位置处的敌人精灵，请遍历 `enemySprites` 数组，找到与 `playerSprite` 具有相同\
  \ `index` 编号的那个。那就是 `playerSprite` 正在碰撞的敌人。\n\n```\nif (gid === 5) {\n  enemySprites.some(enemy\
  \ => {\n    if (playerSprite.index === enemy.index) {\n\n      //你找到了碰撞到的敌人精灵！ \
  \           \n    }\n  });\n}\n```\n\n以上就是基于瓦片碰撞的基础知识，接下来我们将了解如何在游戏中实现它们。\n\n#####\
  \ 收集物品\n\n让我们看一个非常实际的例子来演示这一点。运行 `simpleCollision.html` 文件，如图 3-1 所示，使用键盘方向键帮助外星人角色收集炸弹。每次外星人收集到一个炸弹，该炸弹就会从地图上消失。消息输出了外星人在屏幕上的\
  \ x 和 y 位置，以及其当前的地图索引号。\n\n![A346816_1_En_3_Fig1_HTML.jpg](img/A346816_1_En_3_Fig1_HTML.jpg)\n\
  \n### 图 3-1. 使用基于瓦片碰撞的物品收集\n\n### 设计游戏世界\n\n在第 2 章中，你学习了如何使用瓦片编辑器快速设计游戏世界。本章中的所有示例游戏原型我都使用了相同的方法制作。我使用了三个图层：`backgroundLayer`（背景层）、`bombLayer`（炸弹层）和\
  \ `alienLayer`（外星人层），如图 3-2 所示。\n\n![A346816_1_En_3_Fig2_HTML.jpg](img/A346816_1_En_3_Fig2_HTML.jpg)\n\
  \n### 图 3-2. 三个地图图层\n\n瓦片集中的外星人和炸弹图片都被赋予了名称属性值：“alien”和“bomb”，如图 3-3 所示。这将使我们稍后能够在游戏代码中轻松地使用\
  \ `world.getObject`（针对单个对象）和 `world.getObjects`（针对对象数组）来引用它们，正如你在前一章所学的那样。\n\n![A346816_1_En_3_Fig3_HTML.jpg](img/A346816_1_En_3_Fig3_HTML.jpg)\n\
  \n### 图 3-3. 为外星人和炸弹图片命名\n\n\n\n### 初始化游戏世界\n\n游戏代码会加载瓦片集图像以及 Tiled Editor 生成的 JSON\
  \ 文件。`setup` 函数通过 `makeTiledWorld` 来创建世界。\n\n```\nworld = g.makeTiledWorld(\n  \"\
  maps/simpleCollision.json\",\n  \"images/timeBombPanic.png\"\n);\n```\n\n这会在画布上绘制精灵和图层。在\
  \ Tiled Editor 中，我们为任何对象赋予的 `name` 属性，都可以在 `world.objects` 数组中访问到。我们可以通过 `world.getObject`（用于单个对象）或\
  \ `world.getObjects`（带“s”，用于对象数组）按名称获取对这些对象的引用。以下是获取外星人精灵引用的方法。\n\n```\nalien =\
  \ world.getObject(\"alien\");\n```\n\n我们的游戏还需要引用炸弹图层，以便访问它的 `data` 数组。\n\n```\n\
  bombLayer = world.getObject(\"bombLayer\");\nbombMapArray = bombLayer.data;\n```\n\
  \n现在，`bombLayer` 是一个容器，包含所有作为子精灵的炸弹。`bombMapArray` 是一个有用的数组，它告诉我们世界中所有炸弹的网格位置。（数组中的炸弹的\
  \ `gid` 数字将为 `5`）。\n\n我们还需要一个包含所有炸弹精灵的数组，可以像这样从世界中获取：\n\n```\nbombSprites = world.getObjects(\"\
  bomb\");\n```\n\n`world.getObjects` 会搜索世界中的 `objects` 数组，并找到任何 `name` 属性为 `\"bomb\"\
  ` 的对象。在这个例子中，`\"bomb\"` 匹配了世界中的所有 11 个炸弹精灵。`bombSprites` 现在是一个数组，其中包含对每个这些精灵的引用。\n\
  \n现在，让我们了解如何使用炸弹地图数据来检测碰撞。\n\n### 理解炸弹地图\n\n`bombMapArray` 是一个有用的数字数组，与屏幕上炸弹精灵的位置相对应。你可以在图\
  \ 3-4 中看到这一点。每个 `\"5\"` 代表一个炸弹，每个 `\"0\"` 代表一个空单元格。\n\n![A346816_1_En_3_Fig4_HTML.gif](img/A346816_1_En_3_Fig4_HTML.gif)\n\
  \n### 图 3-4. 与 Tiled Editor 中炸弹图层匹配的炸弹数组\n\n当创建炸弹精灵时，每个新精灵都会被赋予自己的 `index` 属性。`index`\
  \ 属性存储了炸弹在这个数组中的初始位置。\n\n我们需要知道外星人角色是否与地图上的某个炸弹位于同一位置。为此，我们必须将外星人的中心 `x` 和 `y` 屏幕坐标转换为其对应的数组索引号。我们可以借助\
  \ `getIndex` 函数来完成此操作。\n\n```\nalien.index = getIndex(\n  alien.centerX, alien.centerY,\n\
  \  world.tilewidth, world.tileheight, world.widthInTiles\n);\n```\n\n要判断外星人是否碰到了其中一个炸弹，需检查外星人的索引号是否与炸弹地图中的炸弹\
  \ `gid` 数字（`\"5\"`）匹配。\n\n```\n//找出外星人在炸弹数组中的位置是否与炸弹的 gid 数字匹配                 \
  \ \nif (bombMapArray[alien.index] === 5) {\n\n  //如果匹配，则过滤炸弹精灵数组，找到            \
  \  \n  //与外星人位置匹配的那个              \n  bombSprites = bombSprites.filter(bomb => {\n\
  \n    //这个炸弹精灵的索引号是否与外星人相同？              \n    if (bomb.index === alien.index) {\n\
  \n      //如果相同，则通过将炸弹的 gid 设置为 `0`              \n      //从 `bombMapArray` 中移除该炸弹\
  \              \n      bombMapArray[bomb.index] = 0;\n\n      //从其容器组中移除该炸弹精灵  \
  \            \n      g.remove(bomb);\n\n      //从 `bombSprites` 数组中过滤掉该炸弹      \
  \        \n      return false;\n    } else {\n\n      //如果不匹配，则将该炸弹保留在 `bombSprites`\
  \ 数组中              \n      return true;\n    }\n  });\n}\n```\n\n可以看到，如果外星人和炸弹共享相同的索引号，则它们一定占据了相同的地图位置。在这种情况下，通过将该位置的\
  \ `gid` 数字设置为 0，将炸弹从关卡的炸弹地图中擦除。\n\n```\nbombMapArray[bomb.index] = 0;\n```\n\n然后，使用一个名为\
  \ `remove` 的函数将炸弹精灵从游戏中移除。\n\n```\ng.remove(bomb);\n```\n\n游戏代码实际上维护着游戏中所有炸弹的实时地图。运行游戏，拾取几个炸弹，然后检查关卡的\
  \ `bombMapArray`（你可以在控制台中看到其输出）。你会注意到，每次拾取一个炸弹时，该单元格的 `gid` 值都会被设置为 `\"0\"`。炸弹已从地图上擦除。图\
  \ 3-5 显示了在拾取了几个炸弹后，地图的 `bombMapArray` 看起来是什么样的。你可以看到，它与屏幕上炸弹的位置完美匹配。\n\n![A346816_1_En_3_Fig5_HTML.gif](img/A346816_1_En_3_Fig5_HTML.gif)\n\
  \n### 图 3-5. 当一个炸弹被拾取时，其在游戏地图中的 gid 数字被设置为零\n\n在数组中拥有这种类型的数据更新，对于执行各种其他游戏逻辑分析非常有用，你将会在后面看到这一点。\n\
  \n### 使外星人沿网格移动\n\n在我们继续讨论基于瓦片的碰撞之前，先快速了解一下外星人角色的移动系统是如何工作的。像许多迷宫游戏角色一样，外星人与地图的网格单元精确对齐地移动。这意味着，当你按下按键改变其方向时，外星人不会朝新方向移动，直到它进入网格的新行或新列。这确保了它能干净利落地过渡到新的行列中。这有助于保持你的碰撞检测系统简单可靠。\n\
  \n如何判断游戏角色是否与地图网格单元精确对齐？通过检查精灵的 `x` 和 `y` 屏幕坐标是否可以被地图瓦片的宽度和高度整除。以下是用于检查此情况的经典代码片段。\n\
  \n```\nif(Math.floor(sprite.x) % world.tilewidth === 0\n&& Math.floor(sprite.y)\
  \ % world.tilehieght === 0) {\n\n  //是的，精灵与地图的行和列对齐了              \n}\n```\n\n你还需要确保精灵的速度可以被\
  \ `tilewidth` 和 `tileheight` 整除。这能确保精灵实际拥有的像素位置能使上述检查结果为真。这意味着，如果你的瓦片宽度和高度是 `64`，那么你精灵的速度必须是能整除\
  \ `64` 的数：`1`、`2`、`4`、`8`、`16` 或 `32`。如果精灵的速度是 `5`、`7` 或 `11`，它们永远无法整除 `64`，因此精灵将永远不会精确地对齐到地图的行或列。\n\
  \n以下是此示例中的实现方式。`setup` 函数创建了响应方向键按下的键盘按键对象。然后在外星人上创建了一个名为 `direction` 的属性，按键动作会改变该\
  \ `direction` 的值。\n\n```\n//创建键盘对象                  \nleftArrow = g.keyboard(37);\n\
  upArrow = g.keyboard(38);\nrightArrow = g.keyboard(39);\ndownArrow = g.keyboard(40);\n\
  \n//在外星人上创建一个 `direction` 属性                  \nalien.direction = \"\";\n\n//分配按键的\
  \ `press` 动作，以改变外星人的 `direction`\nleftArrow.press = () => alien.direction = \"left\"\
  ;\nupArrow.press = () => alien.direction = \"up\";\nrightArrow.press = () => alien.direction\
  \ = \"right\";\ndownArrow.press = () => alien.direction = \"down\";\n```\n\n当按下任意方向键时，外星人的\
  \ `direction` 会变为：`\"up\"`、`\"down\"`、`\"left\"` 或 `\"right\"`。游戏循环在每一帧检查此方向，并相应地改变外星人的速度：\n\
  \n```\nif(Math.floor(alien.x) % world.tilewidth === 0\n&& Math.floor(alien.y) %\
  \ world.tileheight === 0) {\n  switch (alien.direction) {\n    case \"up\":\n  \
  \    alien.vy = -4;\n      alien.vx = 0;\n      break;\n    case \"down\":\n   \
  \   alien.vy = 4;\n      alien.vx = 0;\n      break;\n    case \"left\":\n     \
  \ alien.vx = -4;\n      alien.vy = 0;\n      break;\n    case \"right\":\n     \
  \ alien.vx = 4;\n      alien.vy = 0;\n      break;\n  }\n}\n```\n\n然后，游戏循环移动外星人，并使用一个名为\
  \ `contain` 的自定义函数将其限制在画布边界内。\n\n```\nalien.x += alien.vx;\nalien.y += alien.vy;\n\
  g.contain(alien, g.stage);\n```\n\n\n\n### 注意\n\n对于任何依赖读取数组索引位置的游戏来说，留意地图边界都尤为重要。这是因为你不希望精灵的\
  \ `x`/`y` 坐标计算出的数组索引数字小于或大于数组中的元素数量。如果发生这种情况，你可能会遇到一些神秘的“未定义”错误信息。这些错误很难追踪，尤其是在它们不常发生的情况下。但这还不是最糟糕的情况。最糟糕的是你根本不会收到任何错误信息。相反，你只会注意到各种看似没有明显原因的疯狂随机错误。如果发生这种情况，请检查你的精灵的索引和位置值！\n\
  \n在接下来的示例中，你将看到如何通过保持精灵与网格行和列对齐，来轻松实现带有墙壁的迷宫游戏。\n\n### 与移动精灵的碰撞\n\n如果所有的炸弹都在移动，会发生什么？它们的地图索引数字会不断变化。为了帮助跟踪这一点，请为你的精灵添加另一个名为\
  \ `gid` 的新属性。\n\n```javascript\nplayerSprite.gid\n```\n\n`gid` 存储了引用精灵在瓦片集上图像的网格索引数字。如果玩家精灵的瓦片集图像是顶行的第四个，你可以像这样将其\
  \ `gid` 设置为 4：\n\n```javascript\nplayerSprite.gid = 4;\n```\n\n你在前一章学到的 `makeTileWorld`\
  \ 函数在创建游戏世界时会自动为所有精灵添加一个 `gid` 属性。\n\n如果精灵在四处移动，请使用它们的 `gid` 和 `index` 属性来实时更新它们在地图数组中的位置。使用\
  \ `updateMap` 函数来帮助你完成此操作。`updateMap` 接受原始数组和你想要更新位置的一个精灵或精灵数组。它还需要知道世界的宽度、高度和 `widthInTiles`。它返回一个包含这些精灵新位置的新数组。\n\
  \n```javascript\nmapArray = updateMap(mapArray, bombSprites, world);\n```\n\n以下是完成所有工作的完整\
  \ `updateMap` 函数。（请注意，此代码使用了你在本章前面学到的 `getIndex` 函数）。\n\n```javascript\nfunction\
  \ updateMap(mapArray, spritesToUpdate, world) {\n\n  //首先创建一个用零填充的新地图数组。\n  //新地图数组的大小将与原始数组完全相同\n\
    let newMapArray = mapArray.map(gid => {\n    gid = 0;\n    return gid;\n  });\n\
  \n  //`spritesToUpdate` 是一个精灵数组吗？\n  if (spritesToUpdate instanceof Array) {\n\n\
      //获取 `spritesToUpdate` 数组中每个精灵的索引数字\n    //并将精灵的 `gid` 添加到地图上匹配的索引处\n    spritesToUpdate.forEach(sprite\
  \ => {\n\n      //找到新的索引数字\n      sprite.index = getIndex(\n        sprite.centerX,\
  \ sprite.centerY,\n        world.tilewidth, world.tileheight, world.widthInTiles\n\
        );\n\n      //将精灵的 `gid` 数字添加到地图上正确的\n      //索引处\n      newMapArray[sprite.index]\
  \ = sprite.gid;\n    });\n  }\n\n  //`spritesToUpdate` 只是一个单独的精灵吗？\n  else {\n    let\
  \ sprite = spritesToUpdate;\n\n    //找到新的索引数字\n    sprite.index = getIndex(\n      sprite.centerX,\
  \ sprite.centerY,\n      world.tilewidth, world.tileheight, world.widthInTiles\n\
      );\n\n    //将精灵的 `gid` 数字添加到地图上正确的\n    //索引处\n    newMapArray[sprite.index]\
  \ = sprite.gid;\n  }\n\n  //返回新的地图数组以替换之前的地图数组\n  return newMapArray;\n}\n```\n\n\
  （你可以在 `hexi/src/modules/tileUtilities/src/tileUtilities.js` 中找到 `updateMap` 函数。）\n\
  \n`updateMap` 接收一个精灵数组，使用它们的索引位置创建一张新地图，并用新地图替换之前的地图。这是确保所有位置都是最新的最可靠方法，并且允许两个或多个精灵在同一个位置共享一个\
  \ `gid` 数字。`updateMap` 应在游戏循环中调用，在精灵的位置被改变之后、检查碰撞之前。\n\n既然你知道了如何实时更新地图，那么如何使用这些信息来检查碰撞呢？\n\
  \n### 通过比较数组位置检查碰撞\n\n如果你的游戏中有大量移动的精灵，你可以使用数组比较技术来检查碰撞。在本章的第一个示例中，我们像这样检查外星人和炸弹之间的碰撞：\n\
  \n```javascript\nif (bombArray[alien.index] === 5) //碰撞！\n```\n\n这对于检查单个精灵与一组精灵的效果很好。但如果你想要检查一组移动的精灵与另一组移动的精灵之间的碰撞呢？\n\
  \n诀窍是将一张地图叠加到另一张地图上。如果这些地图中的任何内容共享相同的索引数字，就会发生碰撞。\n\n以下是其基本工作原理：\n\n首先，从包含不同种类事物的两张地图开始。`mapOne`\
  \ 存储“1”，`mapTwo` 存储“2”：\n\n```javascript\nmapOne = [0, 0, 1, 0, 1, 0];\nmapTwo =\
  \ [0, 2, 0, 0, 2, 0];\n```\n\n你想要找出是否有任何地图位置同时被 1 和 2 占据？有吗？我们可以清楚地看到，确实有。在索引数字\
  \ 4 处。\n\n但是我们如何用代码检查这个呢？像这样：\n\n```javascript\nmapOne.forEach((gid, index) => {\n\
    if (mapTwo[index] === 2 && gid === 1) {\n    console.log(\"在位置 \" + index + \"\
  \ 处发生碰撞\");\n  }\n});\n```\n\n这会显示：\n\n```\n在位置 4 处发生碰撞\n```\n\n如果你有大量位置不断变化的精灵，这可能是检查碰撞最有效的方法。\n\
  \n让我们看一个实际示例，演示这些新技术。运行 `movingCollision.html` 文件，查看带有移动炸弹的示例游戏新版本。使用箭头键让外星人追逐并收集炸弹，如图\
  \ 3-6 所示。\n\n![A346816_1_En_3_Fig6_HTML.jpg](img/A346816_1_En_3_Fig6_HTML.jpg)\n\
  \n### 图 3-6. 在地图上追逐移动的炸弹\n\n这个新示例使用了相同的三个地图层：“backgroundLayer”、“bombLayer” 和 “alienLayer”。图\
  \ 3-7 显示了每一层的数据数组。\n\n![A346816_1_En_3_Fig7_HTML.gif](img/A346816_1_En_3_Fig7_HTML.gif)\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您给定的格式和注意事项，将以下英文文本翻译成中文。\n\n\n### 图 3-7. Tiled Editor\
  \ 中的三个地图图层\n\n`setup` 函数通过以下方式获取对外星人图层数据数组的引用：\n\n```\nalienMapArray = world.getObject(\"\
  alienLayer\").data;\n```\n\n然后，在游戏循环中每帧更新外星人的位置后，会调用 `updateMap` 来更新数组中外星人的位置。\n\
  \n```\nalienMapArray = updateMap(alienMapArray, alien, world);\n```\n\n这意味着 `alienMapArray`\
  \ 将始终包含外星人的当前位置。\n\n炸弹的位置会在一个 `forEach` 循环中更新。循环结束后，会使用 `updateMap` 函数将每个炸弹的新位置更新到\
  \ `bombMapArray` 中。以下是实现此功能的代码：\n\n```\nbombSprites.forEach(bomb => {\n\n//`atXEdge`\
  \ 和 `atYEdge` 会根据精灵是否位于画布边缘返回 `true` 或 `false`                  \nlet atXEdge =\
  \ (sprite, container) => {\n  return (sprite.x === 0 || sprite.x + sprite.width\
  \ === container.width)\n}\nlet atYEdge = (sprite, container) => {\n  return (sprite.y\
  \ === 0 || sprite.y + sprite.width === container.height)\n}\n\n//如果炸弹位于地图网格的列或行上，则改变其方向\
  \                  \nif (Math.floor(bomb.x) % world.tilewidth === 0\n&& Math.floor(bomb.y)\
  \ % world.tileheight === 0)\n{\n\n  //如果炸弹位于画布边缘，              \n  //则反转其速度以使其保持在内部\
  \              \n  if (atXEdge(bomb, g.canvas)) {\n    bomb.vx = -bomb.vx;\n  }\n\
  \  else if (atYEdge(bomb, g.canvas)) {\n    bomb.vy = -bomb.vy;\n  }\n\n  //如果炸弹位于画布内部，则为其指定一个随机的新方向\
  \              \n  else {\n    changeDirection(bomb);\n  }\n}\n\n//移动炸弹        \
  \          \nbomb.x += bomb.vx;\nbomb.y += bomb.vy;\n});\n```\n\n现在，`bombMapArray`\
  \ 将包含当前帧中炸弹位置的最新记录。您会注意到在上面的代码中，每当炸弹位于网格单元格中心时，就会调用一个名为 `changeDirection` 的函数——接下来我们来看看它是如何工作的。\n\
  \n### 为炸弹指定随机方向\n\n炸弹只有在与网格行或列对齐时才会改变方向。并且，如果炸弹位于画布边缘，则无法改变方向，这可以防止生成无效的数组索引号。以下是\
  \ `changeDirection` 函数，它在满足这些条件时被调用。\n\n```\n//方向改变辅助函数                  \nfunction\
  \ changeDirection(sprite) {\n  let up = 1,\n    down = 2,\n    left = 3,\n    right\
  \ = 4,\n    direction = g.randomInt(1, 4);\n\n  switch (direction) {\n    case right:\n\
  \      sprite.vx = 2;\n      sprite.vy = 0;\n      break;\n\n    case left:\n  \
  \    sprite.vx = -2;\n      sprite.vy = 0;\n      break;\n\n    case up:\n     \
  \ sprite.vx = 0;\n      sprite.vy = -2;\n      break;\n\n    case down:\n      sprite.vx\
  \ = 0;\n      sprite.vy = 2;\n      break;\n  }\n}\n```\n\n这只是一个非常简单的 switch 语句，它改变精灵的速度以匹配其随机分配的方向。\n\
  \n### 碰撞检测\n\n如果您在任何时候快照 `alienMapArray` 或 `bombMapArray`，您会发现它们的内容与画布上精灵的位置相匹配，如图\
  \ 3-8 所示。\n\n![A346816_1_En_3_Fig8_HTML.gif](img/A346816_1_En_3_Fig8_HTML.gif)\n\
  \n### 图 3-8. 实时更新精灵的地图位置\n\n碰撞是通过比较这两个数组来检测的。代码遍历 `bombMapArray`，检查每个索引位置的 `gid`\
  \ 是否为 `5`。如果是，并且 `alienMapArray` 在相同索引号处有 `4`，则发生碰撞。然后代码会过滤掉该位置上的任何炸弹精灵。（该位置可能不止一个炸弹）。当找到匹配项时，炸弹会从地图中清除，并且精灵会被移除。\n\
  \n```\nbombMapArray.forEach((gid, index) => {\n\n  //外星人是否与炸弹具有相同的索引号？         \
  \     \n  if (alienMapArray[index] === 4 && gid === 5) {\n\n    //是的，因此过滤掉该位置上的所有炸弹精灵\
  \              \n    //（可能不止一个）              \n    bombSprites = bombSprites.filter(bomb\
  \ => {\n      if (bomb.index === index) {\n\n        //从数组中移除炸弹的 gid 编号        \
  \      \n        bombMapArray[bomb.index] = 0;\n\n        //从 `bombLayer` 组中移除炸弹\
  \              \n        g.remove(bomb);\n        return false;\n      } else {\n\
  \        return true;\n      }\n    });\n  }\n});\n```\n\n到目前为止，所有这些示例都展示了如何使用精灵的中心点来检测碰撞。但对于许多游戏来说，您需要更高的精度。接下来，我们来看看如何使我们的碰撞检测更精确一些。\n\
  \n## 使用角点\n\n我们的碰撞系统到目前为止的一个局限是，我们只使用精灵的中心 x/y 点来确定其地图数组位置。\n\n```\nsprite.index\
  \ = getIndex\n  sprite.centerX, sprite.centerY,\n  world.tilewidth, world.tileheight,\
  \ world.widthInTiles\n);\n```\n\n这意味着，即使精灵部分进入了相邻的单元格，`getIndex` 也不会检测到其位置发生了变化。只有当精灵的中心点穿过单元格边界时，它才会检测到变化。您可以在图\
  \ 8-9 中看到，即使外星人碰到了炸弹，也只有在外星人的中心进入炸弹所在的单元格时，才会检测到碰撞。见图 3-9。\n\n![A346816_1_En_3_Fig9_HTML.jpg](img/A346816_1_En_3_Fig9_HTML.jpg)\n\
  \n### 图 3-9. 使用精灵的中心点来确定其地图位置\n\n这可能不是问题，事实上，在这个示例中，这种效果看起来非常自然。但对于许多类型的碰撞，您可能希望使用精灵的精确边缘作为碰撞边界。这对于与墙壁等不应有任何重叠的物体，或者与火焰等需要立即反应的物体的碰撞来说非常重要。\n\
  \n那么，如何确定精灵的边缘是否位于新的地图位置呢？不要使用中心点。而是使用精灵的 4 个角点。图 3-10 显示了这四个角点的位置。\n\n![A346816_1_En_3_Fig10_HTML.gif](img/A346816_1_En_3_Fig10_HTML.gif)\n\
  \n### 图 3-10. 为获得更高精度，请检查精灵的 4 个角的位置\n\n计算这些点很容易。使用 `getPoints` 函数来计算并返回一个包含这四个点\
  \ x/y 坐标的对象。`getPoints` 接受一个参数：要查找其角点的精灵。它返回一个对象，该对象有四个子对象属性，分别表示精灵四个角的位置：`topLeft`、`topRight`、`bottomLeft`\
  \ 和 `bottomRight`。\n\n```\nfunction getPoints(s) {\n  return {\n    topLeft: {x:\
  \ s.x, y: s.y},\n    topRight: {x: s.x + s.width - 1, y: s.y},\n    bottomLeft:\
  \ {x: s.x, y: s.y + s.height - 1},\n    bottomRight: {x: s.x + s.width - 1, y: s.y\
  \ + s.height - 1}\n  };\n}\n```\n\n（底部和左侧的角点比精灵的宽度和高度小 1 像素，这样这些点就保持在精灵内部，而不是外部）。\n\
  \n\n\n### 注意\n\n为什么在 `getCorners` 函数中要使用 `“s”` 而不是 `“sprite”`？虽然我通常建议使用描述性变量名，但通过使用明显的简写，你可以让密集且重复的数学计算更加紧凑和易读。\n\
  \n现在，不再仅仅通过检查精灵的中心点来定位地图位置，而是检查所有四个角点。如果这些角点与你关注的精灵的`gid`具有相同的索引，则说明发生了碰撞。\n\n首先，使用上面的\
  \ `getPoints` 函数来获取精灵的四个角点。\n\n```\nsprite.collisionPoints = getPoints(sprite);\n\
  ```\n\n创建一个 `collisionGid` 变量，用于存储你想要检查与精灵是否发生碰撞的单元格的`gid`。\n\n```\nlet collisionGid\
  \ = 5;\n```\n\n你还需要一个 `mapArray`，其中包含具有上述 `collisionGid` 的精灵。\n\n```\nlet mapArray\
  \ = anyMapArray;\n```\n\n然后遍历所有四个点，并为每个点调用自定义的 `checkPoints` 函数。\n\n```\nlet hit\
  \ = Object.keys(sprite.collisionPoints).some(checkPoints);\n```\n\n如果任何一个角点与 `mapArray`\
  \ 中具有与我们关注的 `collisionGid` 相同的 `gid` 的单元格相交，则 `checkPoints` 函数返回 `true`。\n\n```\n\
  function checkPoints(key) {\n\n  //获取当前要检查的点的引用。            \n  //(`topLeft`, `topRight`,\
  \ `bottomLeft` 或 `bottomRight` )            \n  let point = sprite.collisionPoints[key];\n\
  \n  //在地图数组中找到该点的索引号            \n  let index = getIndex(\n    point.x, point.y,\n\
  \    world.tilewidth, world.tileheight, world.widthInTiles\n  );\n\n  //找出该点当前所在地图位置的\
  \ gid 值            \n  let currentGid = mapArray[index];\n\n  //如果该值与我们所关注的 gid\
  \ 值匹配，            \n  //则说明发生了碰撞            \n  if (currentGid === collisionGid)\
  \ {\n    return true;\n  } else {\n    return false;\n  }\n}\n```\n\n如果*某些*角点（至少一个）与你关注的单元格接触，上述代码将返回`true`。这是因为我们使用了\
  \ JavaScript 的 `some` 数组方法：\n\n```\nvar hit = Object.keys(sprite.collisionPoints).some(checkPoints);\n\
  ```\n\n一旦找到第一个发生碰撞的角点，循环就会退出，函数返回 `true`。这意味着如果第一个点，即精灵的 `topLeft` 角点发生了碰撞，循环会立即返回`true`，而不再检查其他点。这对于确保对碰撞做出即时反应非常有用。\n\
  \n但是，如果你只想在*每一个*角点都与你关注的单元格接触时才检测到碰撞，该怎么做呢？请使用 JavaScript 的 `every` 数组方法，如下所示：\n\
  \n```\nvar hit = Object.keys(sprite.collisionPoints).every(checkPoints);\n```\n\n\
  在这种情况下，只有当*每一个*角点都参与碰撞时，`hit` 才会变为 `true`。这对于确保精灵完全位于一个单元格内部，或者完全覆盖另一个精灵非常有用。你可以利用这一点来高效地测试精灵的四个角是否都落在迷宫地板上，从而防止精灵穿墙而过。（在后续的示例中，你将看到如何做到这一点）。\n\
  \n现在你已经知道是否发生了碰撞，接下来使用索引号在地图的同一位置找到匹配的精灵。这只是你之前示例中相同代码的一个变体：\n\n```\nif (hit) {\n\
  \  enemySprites.some((enemy) => {\n    if (enemy.index === collisionIndex) {\n\n\
  \      //这就是你关注的精灵            \n    }\n  });\n}\n```\n\n在我们继续深入之前，先来整合所有这些新代码。\n\
  \n### 一个可复用的基于瓦片的碰撞函数\n\n你现在可以看到，基于瓦片的碰撞对于各种不同的游戏场景是多么有用。为了让我们轻松一点，我快速编写了一个通用的 `hitTestTile`\
  \ 函数，这样你只需一行代码就能实现基于瓦片的碰撞。你可以将它放入任何游戏中，只要游戏中的精灵具有本书一直在使用的相同属性即可。该函数用于检测精灵与任何地图数组上的某个瓦片`gid`编号之间的碰撞。该函数还允许你设置要检测的碰撞类型：中心点、某些角点或每个角点。使用方法如下：\n\
  \n```\nlet collisionObject = hitTestTile(sprite, mapArray, collisionGid, worldObject,\
  \ pointsToCheck);\n```\n\n`hitTestTile` 返回一个碰撞对象，其中包含以下两个属性：\n\n*   `collision.hit`：一个布尔值，如果发生碰撞则为\
  \ true。\n*   `collision.index`：一个数字，表示碰撞发生的地图数组位置。\n\n你可以使用这两个属性来决定如何处理碰撞。\n\n第四个参数\
  \ `worldObject` 是一个定义基于瓦片的游戏世界的对象。它需要包含以下属性：\n\n```\nworld.tilewidth\nworld.tileheight\n\
  world.widthInTiles\n```\n\n（`widthInTiles` 是一个数字，表示你的瓦片地图的列数）。\n\n我们在最后两章中使用的 `makeTiledWorld`\
  \ 函数会自动为你返回一个包含这些属性的世界对象。但如果你是通过代码（而非使用 Tiled Editor）生成世界地图，只要你将自己的、包含上述三个相同属性的世界对象传递给它，你仍然可以使用\
  \ `hitTestTile`。\n\n最后一个参数 `pointsToCheck` 决定了检查精灵上的哪些点以检测碰撞。你可以使用以下三个字符串选项之一：\n\
  \n```\n\"every\"\n\"some\"\n\"center\"\n```\n\n以下是完整的 `hitTestTile` 函数。这里没有新代码，它只是对我们在前面示例中使用的相同技术进行了重新编排。\n\
  \n```\nhitTestTile(sprite, mapArray, gidToCheck, world, pointsToCheck) {\n\n  //`checkPoints`\
  \ 辅助函数遍历精灵的角点，              \n  //找出它们是否位于你关注的数组单元格内。              \n  //如果是，则返回\
  \ `true`。              \n  let checkPoints = key => {\n\n    //获取当前要检查的点的引用。   \
  \           \n    //(`topLeft`, `topRight`, `bottomLeft` 或 `bottomRight` )     \
  \         \n    let point = sprite.collisionPoints[key];\n\n    //在地图数组中找到该点的索引号\
  \              \n    collision.index = this.getIndex(\n      point.x, point.y,\n\
  \      world.tilewidth, world.tileheight, world.widthInTiles\n    );\n\n    //找出该点当前所在地图位置的\
  \ gid 值              \n    collision.gid = mapArray[collision.index];\n\n    //如果该值与我们所关注的\
  \ gid 值匹配，              \n    //则说明发生了碰撞              \n    if (collision.gid ===\
  \ gidToCheck) {\n      return true;\n    } else {\n      return false;\n    }\n\
  \  };\n\n  //将 \"some\" 设置为 `pointsToCheck` 的默认值              \n  pointsToCheck\
  \ = pointsToCheck || \"some\";\n\n  //该函数将返回的碰撞对象              \n  let collision\
  \ = {};\n\n  //你想要检查哪些点？              \n  //\"every\"、\"some\" 还是 \"center\"?  \
  \            \n  switch (pointsToCheck) {\n    case \"center\":\n\n      //只有中心点接触时，`hit`\
  \ 才为 true              \n      let point = {\n        center: {\n          x: sprite.centerX,\n\
  \          y: sprite.centerY\n        }\n      };\n      sprite.collisionPoints\
  \ = point;\n      collision.hit = Object.keys(sprite.collisionPoints).some(checkPoints);\n\
  \      break;\n\n    case \"every\":\n\n      //每个角点都接触时，`hit` 才为 true         \
  \     \n      sprite.collisionPoints = this.getPoints(sprite);\n      collision.hit\
  \ = Object.keys(sprite.collisionPoints).every(checkPoints);\n      break;\n\n  \
  \  case \"some\":\n```\n\n\n\n// 仅当某些点接触时，`hit` 的值才为 true\n`sprite.collisionPoints\
  \ = this.getPoints(sprite);`\n`collision.hit = Object.keys(sprite.collisionPoints).some(checkPoints);`\n\
  `break;`\n\n// 返回碰撞对象。\n// 若检测到碰撞，`collision.hit` 的值为 true。\n// `collision.index`\
  \ 可告知碰撞发生时所处地图数组的索引编号。\n`return collision;`\n\n（你可以在本章的源文件 `hexi/src/modules/tileUtilities/src`\
  \ 中找到此函数的可用版本）。\n\n运行 `usingCornerPoints.html` 示例，可看到 `hitTestTile` 的实际应用。在此示例中，一旦外星人的任意角点进入包含炸弹的单元格，炸弹就会立即消失。如图\
  \ 3-11 所示。\n\n![A346816_1_En_3_Fig11_HTML.jpg](img/A346816_1_En_3_Fig11_HTML.jpg)\n\
  \n### 图 3-11. 使用部分角点进行即时碰撞检测\n\n这种碰撞反应是否显得过于即时？你可以通过将 `\"some\"` 改为 `\"every\"`\
  \ 来实现完全不同的效果：\n\n```\nlet alienVsBomb = hitTestTile(alien, bombMapArray, 5, world,\
  \ \"every\");\n```\n\n现在，只有当每个角点都位于炸弹的单元格内时，才会检测到碰撞。这让外星人必须先完全包裹住炸弹，炸弹才会消失。图 3-12\
  \ 说明了这一点。\n\n![A346816_1_En_3_Fig12_HTML.jpg](img/A346816_1_En_3_Fig12_HTML.jpg)\n\
  \n### 图 3-12. 仅当每个角点都位于地图单元格内时才检测碰撞\n\n结果看起来非常自然，而这是一种使用基于几何的碰撞检测系统难以实现的效果。此外，使用每个角点进行碰撞检测还有另一个重要用途：你可以用它来将精灵限制在地图的特定位置。接下来让我们了解如何做到这一点。\n\
  \n## 使用反向碰撞检测来检查障碍物\n\n对于迷宫或角色扮演游戏，你通常需要知道地图的哪些区域是角色可以行走的，哪些是不可以行走的。例如，角色应该能够在草地上行走，但不能穿过墙壁、岩石或树木。这些被称为地图的可行走区域和不可行走区域。通常你会发现，角色只允许在某一种东西上行走，但有很多东西它不能行走。因此，与其检查角色不能行走的三样东西（如墙壁、岩石和树木），不如只测试角色可以行走的那一样东西（例如草地）。如果角色在草地上，它可以行走；但如果它接触到其他任何东西，则不能行走。这是一种*反向*碰撞策略。之所以说它是反向的，是因为你通过检查精灵是否*没有碰到*另一个障碍物，来判断它是否撞上了障碍物。如果它在草地上，你就知道它没有碰到墙壁、岩石或树木。简单！对于某些类型的碰撞来说，这种方法非常高效。\n\
  \n如何知道一个精灵是否完全位于某个特定的地图单元格内？通过检查它的全部四个角点。如果精灵的四个角点都在同一个位置，就可以知道该精灵没有与其他任何单元格重叠。是的，你可能不会惊讶地发现，你可以通过使用\
  \ JavaScript 的 `every` 循环来检查这一点！让我们通过经典的迷宫墙壁示例来了解如何操作。\n\n运行 `wallsAndBombs.js`\
  \ 文件，使用方向键控制外星人在迷宫中穿行并拾取炸弹。外星人可以平滑地穿过走廊和拐角，但墙壁会阻挡其移动，如图 3-13 所示。\n\n![A346816_1_En_3_Fig13_HTML.jpg](img/A346816_1_En_3_Fig13_HTML.jpg)\n\
  \n### 图 3-13. 在迷宫中穿行以拾取炸弹\n\n图 3-14 显示了迷宫以及用于创建该迷宫的 `wallArray`。\n\n![A346816_1_En_3_Fig14_HTML.gif](img/A346816_1_En_3_Fig14_HTML.gif)\n\
  \n### 图 3-14. 添加墙壁以创建迷宫游戏\n\n你可以看到，任何 gid 编号为 2 或 3 的都是墙壁。但由于我们将进行反向碰撞检查，我们对此不感兴趣。我们只关心任何不是墙壁的东西。也就是地图中用\
  \ `\"0\"` 表示的所有东西。因此，我们的碰撞算法将遵循以下逻辑：*如果外星人没有碰到 `\"0\"` 单元格，则阻止其移动。*\n\n以下是游戏循环中实现此功能的全部代码。除了几个小细节外，它与前一个示例中的代码非常相似。\n\
  \n```\nlet alienVsFloor = g.hitTestTile(alien, wallMapArray, 0, world, \"every\"\
  );\n\nif (!alienVsFloor.hit) {\n\n  //阻止外星人移动\n  alien.x -= alien.vx;\n  alien.y\
  \ -= alien.vy;\n  alien.vx = 0;\n  alien.vy = 0;\n}\n```\n\n可以看到，只有当每个角点都位于一个 `\"\
  0\"` 单元格内时，`alienVsFloor` 才为真。如果 `alienVsFloor` 变为 false，我们就知道外星人碰到了非 `\"0\"` 的东西——那东西一定是墙壁。\n\
  \n此示例使用了最简单的碰撞反应代码。如果外星人撞到墙壁，则通过从其位置减去其速度，然后将其速度设为零来阻止其移动。\n\n```\nalien.x -= alien.vx;\n\
  alien.y -= alien.vy;\nalien.vx = 0;\nalien.vy = 0;\n```\n\n我们可以使用如此简单的碰撞反应系统，是因为外星人的移动与地图的网格行和列对齐，并且我们没有使用任何物理机制来改变其速度。这些约束条件消除了一大类我们无需担心的碰撞问题。\n\
  \n为了了解这段代码在实际环境中的用法，以下是游戏循环中使用 `hitTestTile` 来检查外星人与地面，以及外星人与炸弹之间碰撞的全部代码。\n\n```\n\
  //检查外星人与地面之间的碰撞\nlet alienVsFloor = g.hitTestTile(alien, wallMapArray, 0, world,\
  \ \"every\");\n\n//如果外星人没有碰到地砖，则阻止其移动\nif (!alienVsFloor.hit) {\n  alien.x -= alien.vx;\n\
    alien.y -= alien.vy;\n  alien.vx = 0;\n  alien.vy = 0;\n}\n\n//检查外星人与炸弹之间的碰撞\n\
  let alienVsBomb = g.hitTestTile(alien, bombMapArray, 5, world, \"every\");\n\n//查看外星人在炸弹数组中的位置是否与炸弹的\
  \ gid 编号匹配\nif (alienVsBomb.hit) {\n\n  //如果匹配，则过滤炸弹精灵并找到\n  //与外星人位置相匹配的那个\n  bombSprites\
  \ = bombSprites.filter(function(bomb) {\n\n    //该炸弹精灵的索引号是否与外星人相同？\n    if (bomb.index\
  \ === alienVsBomb.index) {\n\n      //如果相同，则通过将 `bombMapArray` 中的 gid 设为 `0`\n      //来从其中移除炸弹\n\
        bombMapArray[bomb.index] = 0;\n\n      //从其容器组中移除炸弹精灵\n      g.remove(bomb);\n\
  \n      //从 `bombSprites` 数组中滤除该炸弹\n      return false;\n    } else {\n\n      //如果不匹配，则将炸弹保留在\
  \ `bombSprites` 数组中\n      return true;\n    }\n  });\n}\n```\n\n现在我们有了一个实用的基于瓦片的碰撞系统，可用于各种基于瓦片的游戏。接下来，让我们了解如何在上一章开始构建的奇幻角色扮演游戏中运用所有这些新技能。\n\
  \n\n\n### 基于瓦片碰撞的角色扮演游戏\n\n先试玩一下第 1 章的`fantasy.html`原型示例，重温一下它的运作方式。你会注意到精灵角色可以碰撞两类物体：\n\
  \n-   阻挡行动的障碍物：树桩、墙基和灌木丛底部。\n-   可收集的物品：红心、骷髅头和土拨鼠。\n\n图 3-15 展示了这一点。碰撞机制完全基于前几节学到的瓦片碰撞系统。但这里有一些有趣的新细节，这些细节并非边缘情况，而是许多类型游戏中你都需要解决的典型碰撞问题。\n\
  \n![A346816_1_En_3_Fig15_HTML.jpg](img/A346816_1_En_3_Fig15_HTML.jpg)\n\n**图 3-15.**\
  \ 障碍物阻挡行动，物品可被收集\n\n### 定义碰撞区域\n\n游戏地图中的所有瓦片都由整齐填充 32x32 像素方格的精美图形构成。然而，精灵角色并不遵循这一模式。它的精灵尺寸为\
  \ 64x64 像素，而角色插画的实际尺寸为 28x52 像素。图 3-16 展示了这一点。\n\n![A346816_1_En_3_Fig16_HTML.gif](img/A346816_1_En_3_Fig16_HTML.gif)\n\
  \n**图 3-16.** 所有尺寸均不相同\n\n在迷宫游戏示例中这不成问题，因为瓦片尺寸、精灵尺寸以及迷宫单元格网格尺寸完全相同：都是 64x64 像素。现在该怎么办？\n\
  \n别担心！只需在精灵上创建一个碰撞区域即可。碰撞区域定义了精灵的哪个部位应对碰撞敏感。在本游戏中，我只希望精灵头部以下的身体区域对碰撞做出反应。这是一个 20x20\
  \ 像素的方形区域，你可以在图 3-17 中看到它。它相对于精灵顶部向下偏移 44 像素，向左偏移 22 像素。\n\n![A346816_1_En_3_Fig17_HTML.gif](img/A346816_1_En_3_Fig17_HTML.gif)\n\
  \n**图 3-17.** 精灵的碰撞区域\n\n这保留了浅 2.5D 景深效果，因为它意味着精灵的头部不会撞到视觉上位于其上方但深度层更低的物体——例如墙壁或树木的顶部。\n\
  \n要在游戏代码中实现这一点，我们只需在精灵上创建一个定义此形状的`collisionArea`对象。以下是游戏设置函数中实现此功能的代码片段。\n\n```\n\
  elf.collisionArea = {\n  x: 22,\n  y: 44,\n  width: 20,\n  height: 20\n};\n```\n\
  \n（有关完整上下文，请参考第 1 章的`fantasy.js`源文件）。\n\n现在，不再使用精灵的四个角点，而是使用这个新的`collisionArea`的四个角点进行碰撞检测。为了实现这一点，请使用这个新版本的`getPoints`函数。\n\
  \n```\ngetPoints(s) {\n  let ca = s.collisionArea;\n  if (ca !== undefined) {\n\
  \    return {\n      topLeft: {\n        x: s.x + ca.x,\n        y: s.y + ca.y\n\
  \      },\n      topRight: {\n        x: s.x + ca.x + ca.width,\n        y: s.y\
  \ + ca.y\n      },\n      bottomLeft: {\n        x: s.x + ca.x,\n        y: s.y\
  \ + ca.y + ca.height\n      },\n      bottomRight: {\n        x: s.x + ca.x + ca.width,\n\
  \        y: s.y + ca.y + ca.height\n      }\n    };\n  } else {\n    return {\n\
  \      topLeft: {\n        x: s.x,\n        y: s.y\n      },\n      topRight: {\n\
  \        x: s.x + s.width - 1,\n        y: s.y\n      },\n      bottomLeft: {\n\
  \        x: s.x,\n        y: s.y + s.height - 1\n      },\n      bottomRight: {\n\
  \        x: s.x + s.width - 1,\n        y: s.y + s.height - 1\n      }\n    };\n\
  \  }\n}\n```\n\n现在你可以为游戏中的任何精灵设置自定义碰撞区域。那么，这个幻想 RPG 游戏示例中的碰撞系统是如何工作的呢？\n\n## 与障碍物的碰撞\n\
  \n你从第 2 章还记得，所有应阻止精灵移动的瓦片都创建在一个名为`obstacles`的地图层上，如图 3-18 所示。\n\n![A346816_1_En_3_Fig18_HTML.jpg](img/A346816_1_En_3_Fig18_HTML.jpg)\n\
  \n**图 3-18.** 地图的障碍物层\n\n这导出一个漂亮的大数组，其中充满了代表障碍物的`gid`数字。但最重要的是，它也充满了零。数组中的任何`0`都表示“没有障碍物”。这意味着我们可以使用我们的小反证碰撞技巧。我们可以检查精灵碰撞区域的所有四个角是否都接触到了`0`单元格。如果任何一个不是`0`，我们就知道精灵撞到了障碍物。我们最终得到的代码几乎与我们早期迷宫游戏示例中用于检查迷宫墙壁的代码相同。以下是游戏循环中检查精灵是否接触障碍物的代码。如果接触了，代码会阻止精灵移动。\n\
  \n```\nlet obstaclesMapArray = world.getObject(\"obstacles\").data;\nlet elfVsGround\
  \ = g.hitTestTile(elf, obstaclesMapArray, 0, world, \"every\");\n\nif (!elfVsGround.hit)\
  \ {\n  //阻止精灵移动\n  elf.x -= elf.vx;\n  elf.y -= elf.vy;\n  elf.vx = 0;\n  elf.vy\
  \ = 0;\n}\n```\n\n如果你想知道精灵撞到了哪种类型的障碍物呢？你可以使用`collision.index`属性在地图数组中查找其`gid`编号。以下是从`obstacleMapArray`中查找`gid`编号的方法：\n\
  \n```\nobstaclesMapArray[elfVsGround.index]\n```\n\n如果精灵撞到了树的右侧，这将给出`33`。这意味着你现在可以获得关于精灵与环境交互情况的详细信息，并利用这些信息开始构建复杂的游戏逻辑。\n\
  \n### 与物品的碰撞\n\n你还会记得，当我们在 Tiled Editor 中设计游戏地图时，我们给物品瓦片赋予了这些名称属性：`skull`、`heart`和`marmot`。物品也被添加到了它们自己的图层上，如图\
  \ 3-19 所示。\n\n![A346816_1_En_3_Fig19_HTML.jpg](img/A346816_1_En_3_Fig19_HTML.jpg)\n\
  \n**图 3-19.** 物品瓦片位于它们自己的图层上，并具有名称属性\n\n我们可以在游戏代码中使用这些自定义名称属性来判断精灵正在接触哪些物品。让我们来看看如何实现。\n\
  \n首先，我们需要获取对物品图层的引用。\n\n```\nitemsLayer = world.getObject(\"items\");\n```\n\n记住`itemsLayer`是一个精灵容器。它包含该图层上的所有精灵；只有三个：红心、骷髅头和土拨鼠。你可以在图层的`children`数组中访问这些精灵。因此下一步是获取对`itemsLayer.children`的引用。\n\
  \n```\nitems = itemsLayer.children;\n```\n\n现在我们有了一个名为`items`的数组，其中包含三个物品精灵。\n\n\
  \n\n### 注记\n\n你也可以选择*克隆*数组，而不是创建一个指向原始数组的直接引用指针。你可以像这样克隆数组：\n\n```\nitems = itemsLayer.children.slice(0);\n\
  ```\n\n克隆数组的好处是，如果对 `items` 数组进行了修改，原始的 `itemsLayer.children` 数组将保持不变。当你需要将游戏重置为初始状态时，这会非常有用。\n\
  \n精灵与物品之间的碰撞是如何工作的？不出所料！这与本章前面例子中炸弹与外星人之间的碰撞完全相同。唯一新增的是，当碰撞发生时，屏幕上会显示一条持续三秒的消息，告知你精灵收集到的物品名称。\n\
  \n```\nlet itemsMapArray = world.getObject(\"items\").data;\nlet elfVsItems = g.hitTestTile(elf,\
  \ itemsMapArray, 0, world, \"some\");\n\nif (!elfVsItems.hit) {\nitems = items.filter(item\
  \ => {\n\n  //判断当前物品是否与精灵的位置匹配              \n  if (item.index === elfVsItems.index)\
  \ {\n\n    //显示消息              \n    message.visible = true;\n    message.content\
  \ = \"You found a \" + item.name;\n\n    //让消息在三秒后消失              \n    g.wait(3000,\
  \ function() {\n      message.visible = false;\n    });\n\n    //移除物品          \
  \    \n    itemsMapArray[item.index] = 0;\n    g.remove(item);\n    return false;\n\
    } else {\n    return true;\n  }\n  });\n}\n```\n\n图 3-20 展示了收集到物品时屏幕上显示的消息效果。\n\
  \n![A346816_1_En_3_Fig20_HTML.jpg](img/A346816_1_En_3_Fig20_HTML.jpg)\n\n### 图 3-20.\
  \ 显示物品的名称属性\n\n基于瓦片的碰撞：解决！\n\n## 小结\n\n基于瓦片的碰撞是你能够学到的最有用的游戏设计技术之一。我们在本章中使用的简单系统可以作为你在\
  \ 2D 动作游戏中进行大部分（或全部）碰撞检测的基础。现在你学会了如何在地图世界中定位对象、检测它与其他对象的碰撞、对这些碰撞做出反应，以及更新游戏世界。你可以使用通用的\
  \ `hitTestTile` 函数，配合 `getIndex` 和 `getPoints`，来处理任何类型 2D 视频游戏的碰撞问题。\n\n但是，如果我再次告诉你“我们还没结束！”你会不会感到惊讶？既然你已经理解了如何构建一个交互式基于瓦片的游戏世界，一个全新的游戏设计技术宇宙已向你敞开。在接下来的几章中，我们将深入探讨所有这些新技术：影响地图、宽相位碰撞、寻路、程序化关卡生成，以及下一章中的等距地图。希望你胃口大开！\n\
