- fmt: "###### Figure 2-10. Add the obstacles\n\nNext, add the items layer. These\
    \ are things that the elf is going to be able to pick up. We only need three things\
    \ on the items layer: the heart, the skull, and the marmot. Add these to the layer\
    \ using the stamp tool, as shown in Figure [2-11](#A346816_1_En_2_Chapter.xhtml#Fig11).\n\
    \n![A346816_1_En_2_Fig11_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig11_HTML.jpg)\n\
    \n###### Figure 2-11. Add the collection items\n\nNext is the object layer. This\
    \ is where we’re going to add the elf character — *as a data object*. The elf\
    \ isn’t represented as an image in the tileset because we’re going to build it\
    \ later from code as a complex animated sprite. You could use a simple placeholder\
    \ image of an elf and just add it to the map in the same way I’ve added the other\
    \ images, but instead I want to use this as an opportunity to show you how Tiled\
    \ Editor’s objects work.\n\nYou can see from Figure [2-12](#A346816_1_En_2_Chapter.xhtml#Fig12)\
    \ that the layer type that the elf is on is called `objects`. This is a special\
    \ kind of layer that lets you place things freely without snapping them to the\
    \ grid. It also lets you assign a custom height and width to the object. That\
    \ means you can place objects of any size with precise `x` and `y` screen coordinates.\
    \ Things on object layers will be represented as an array of JavaScript objects\
    \ in the exported JSON file, and you can give each object a unique set of properties.\n\
    \n![A346816_1_En_2_Fig12_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig12_HTML.jpg)\n\
    \n###### Figure 2-12. Add an object and give it some properties\n\nTo add something\
    \ to an Object Layer, use one of the shape tools and draw the shape onto the spot\
    \ where you want the object to appear. The context-sensitive Properties panel\
    \ will display the properties for the new object you’re creating. Tiled Editor’s\
    \ objects have some default properties, like position and size, which closely\
    \ match properties on the sprite objects that we’ve been using in this book. For\
    \ this example, I’ve set the object’s name to `\"elf\"`, and set its width and\
    \ height to 64 pixels. You can change or add as many other properties as you like,\
    \ all of which you’ll be able to access in your final game code. Any object you\
    \ create like this you can access from Tiled Editor’s handy Objects panel.\n\n\
    There are two more layers to add: the `wallTops` and the `treeTops`, as shown\
    \ in Figure [2-13](#A346816_1_En_2_Chapter.xhtml#Fig13).\n\n![A346816_1_En_2_Fig13_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig13_HTML.jpg)\n\
    \n###### Figure 2-13. Add the tops of the walls and the tops of the trees\n\n\
    And now you’re done!\n\n## Understanding the JSON Map Data\n\nWhen you’ve finished\
    \ building the map, follow these steps to save and export the map as JSON data:\n\
    \n1.  Select `File` ➤ `Save As…` from the main menu to save the file in Tiled\
    \ Editor’s own TMX format.\n2.  Select `Map` ➤ `Map Properties…`. Find the `Tile\
    \ Layer Format` property in the Properties panel, and choose `CSV`. The CSV (Comma\
    \ Separated Values) option exports the map layer as arrays of numbers, which is\
    \ what we want.\n3.  Export the map data to JSON by selecting `File` ➤ `Export\
    \ As…` and choose `JSON` as the file type.\n4.  We’ve now got a JSON file full\
    \ of potentially useful map data, but how can we use it?\n\nIt’s important to\
    \ remember that each layer in the map is represented as an array. That means the\
    \ JSON file will contain at least six arrays. Five of those arrays are full of\
    \ tileset frame id codes. One of them, the one that represents the objects layer,\
    \ is an array of objects. The JSON file also gives you information about the height\
    \ and width of the map, tiles, and all the tile properties. All of this extra\
    \ information is contained in sub-objects with their own sub-arrays. There’s a\
    \ lot of data, and if you open the JSON data file for the first time, you might\
    \ become overwhelmed by what you see. Don’t let it intimidate you! You’ll soon\
    \ see that the structure is quite logical and, once you understand it, it will\
    \ be easy for you to use all this data in your game program.\n\n###### Note\n\n\
    Tiled Editor’s data output has become a de facto standard in the game design industry,\
    \ so learning how it’s structured and how to incorporate it with your own games\
    \ is a good long-term skill investment.\n\nLet’s keep things simple and first\
    \ take a look at the broad structure of the JSON file — from a safe distance.\
    \ Here’s an abridged version that shows you the most important properties.\n\n\
    ```\n{\n //The map's properties            \n \"backgroundcolor\": \"#ffffff\"\
    ,\n \"height\": 24,\n \"nextobjectid\": 2, //Only used by Tiled Editor for internal\
    \ use\n \"orientation\": \"orthogonal\",\n \"properties\": {/* Any custom properties\
    \ you might have set */},\n \"renderorder\": \"right-down\",\n \"tileheight\"\
    : 32,\n \"tilewidth\": 32,\n \"version\": 1,\n \"width\": 24,\n\n //The `layers`\
    \ property is an array of objects. Each object contains            \n //another\
    \ array that represents that layer's map data. The layer            \n //objects\
    \ also contains the layer properties, which includes            \n //its name,\
    \ type and size            \n \"layers\":[\n   {\"data\": [1, 2, 1, 2, 1, 2, ...],\
    \ //Layer properties...},\n   {\"data\": [0, 0, 0, 0, 0, 0, ...], //Layer Properties...},\n\
       {\"data\": [0, 0, 0, 0, 0, 0, ...], //LayerProperties...},\n   {\"objects\"\
    : [{\"name\":\"elf\", //...more object properties...}], //LayerProperties...},\n\
       {\"data\": [0, 0, 0, 0, 0, 0, ...] ], //LayerProperties...},\n   {\"data\"\
    : [19, 20, 21, 22, 0, ...], //LayerProperties...},\n ],\n\n //The `tilesets` property\
    \ is an array of objects. Each object            \n //represents one of the tilesets\
    \ used in the map. (We only used            \n //one in this example.) These objects\
    \ contain default tileset            \n //properties, and also custom properties,\
    \ like the sprite image name            \n \"tilesets\":[\n    { //...Tileset\
    \ properties, like the width and height of each tile.\n      //The custom tile\
    \ name properties that we set:\n      \"tileproperties\": {\n        \"11\": {\"\
    name\": \"heart\"},\n        \"4\": {\"name\": \"skull\"},\n        \"5\": {\"\
    name\": \"marmot\"}\n      },\n    }\n  ]\n}\n```\n\nMost of map data, the stuff\
    \ that actually tells you what’s in each cell of the map, is in the `\"data\"\
    ` property of each layer object. Let’s take a look at the first layer object and\
    \ see what’s inside:\n\n```\n{\n  \"data\":[\n      1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,\n\
          7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,\n      1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,\n\
          7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,\n      ...etc.\n    ],\n\
       \"height\": 24,\n   \"name\": \"ground\",\n   \"opacity\": 1,\n   \"type\"\
    : \"tilelayer\",\n   \"visible\": true,\n   \"width\": 24,\n   \"x\": 0,\n   \"\
    y\": 0\n},\n```\n\nYou can see that it contains some useful properties, like the\
    \ layer’s name and its type. The `data` array is a list of 576 numbers that represent\
    \ all the tiles on that layer (24x24 tiles = 576). The numbers are called the\
    \ **grid id**, or **gid**, and each one refers to an image in the tileset. Tiled\
    \ Editor numbers each tileset image from left to right, starting from 1. Figure\
    \ [2-14](#A346816_1_En_2_Chapter.xhtml#Fig14) shows how the grid id’s of the first\
    \ 12 tileset images. You can see that 1, 2, 7, and 8 match the grass tiles. The\
    \ `data` array uses these numbers to represent the visual layout of each layer.\n\
    \n![A346816_1_En_2_Fig14_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig14_HTML.jpg)"
