  trans: "\n# 构建游戏世界\n\n使用`makeIsoTiledWorld`函数的方式与原始`makeTiledWorld`函数完全相同，因此无需学习任何新内容。唯一需要注意的是，如果你改变了任何精灵的位置或`z`属性，就需要使用自定义的`byDepth`函数重新对精灵进行深度排序。在本例中，所有精灵都位于每个地图图层容器的`children`数组中，因此你需要像这样进行深度排序：\n\
    \n```\nmapLayer.children.sort(byDepth);\n```\n\n除此之外，没有其他需要学习的新内容。以下是图 4-8 所展示的`cubes.js`文件的完整应用代码。它加载了在\
    \ Tiled Editor 中创建的等距地图，并实现了键盘交互、碰撞检测和精确的深度排序。你在其他上下文中已经见过所有这些代码，注释中详细解释了其功能。\n\
    \n```\n//The files we want to load                  \nlet thingsToLoad = [\n \
    \ \"images/cubes.png\",\n  \"images/cubes.json\"\n];\n\n//Create a new Hexi instance,\
    \ and start it                  \nlet g = hexi(512, 512, setup, thingsToLoad);\n\
    \n//Scale the canvas to the maximum browser dimensions                  \ng.scaleToWindow();\n\
    \n//Declare variables used in more than one function                  \nlet world,\
    \ leftArrow, upArrow,\n  rightArrow, downArrow, message, wallLayer,\n  player,\
    \ wallMapArray;\n\n//Start Hexi                  \ng.start();\n\nfunction setup()\
    \ {\n\n  //Make the world from the Tiled JSON data              \n  world = makeIsoTiledWorld(\n\
    \    \"images/cubes.json\",\n    \"images/cubes.png\"\n  );\n\n  //Add the world\
    \ to the `stage`              \n  g.stage.addChild(world);\n\n  //Position the\
    \ world inside the canvas              \n  let canvasOffset = (g.canvas.width\
    \ / 2) - world.tilewidth / 2;\n  world.x += canvasOffset;\n  world.y = 0;\n\n\
    \  //Get the objects we need from the world              \n  player = world.getObject(\"\
    player\");\n  wallLayer = world.getObject(\"wallLayer\");\n\n  //Add the player\
    \ to the wall layer and set it at              \n  //the same depth level as the\
    \ walls              \n  wallLayer.addChild(player);\n  player.z = 0;\n  wallLayer.children.sort(byDepth);\n\
    \n  //Initialize the player's velocity to zero              \n  player.vx = 0;\n\
    \  player.vy = 0;\n\n  //Make a text object              \n  message = g.text(\"\
    \", \"16px Futura\", \"black\");\n  message.setPosition(5, 0);\n\n  //Create the\
    \ keyboard objects              \n  leftArrow = g.keyboard(37);\n  upArrow = g.keyboard(38);\n\
    \  rightArrow = g.keyboard(39);\n  downArrow = g.keyboard(40);\n\n  //Assign the\
    \ key `press` actions              \n  player.direction = \"none\";\n  leftArrow.press\
    \ = () => player.direction = \"left\";\n  upArrow.press = () => player.direction\
    \ = \"up\";\n  rightArrow.press = () => player.direction = \"right\";\n  downArrow.press\
    \ = () => player.direction = \"down\";\n  leftArrow.release = () => player.direction\
    \ = \"none\";\n  upArrow.release = () => player.direction = \"none\";\n  rightArrow.release\
    \ = () => player.direction = \"none\";\n  downArrow.release = () => player.direction\
    \ = \"none\";\n\n  //Set the game state to `play`              \n  g.state = play;\n\
    }\n\nfunction play() {\n\n  //Change the player character's velocity if it's centered\
    \ over a grid cell              \n  if (Math.floor(player.cartX) % world.cartTilewidth\
    \ === 0\n  && Math.floor(player.cartY) % world.cartTileheight === 0) {\n    switch\
    \ (player.direction) {\n      case \"up\":\n        player.vy = -2;\n        player.vx\
    \ = 0;\n        break;\n      case \"down\":\n        player.vy = 2;\n       \
    \ player.vx = 0;\n        break;\n      case \"left\":\n        player.vx = -2;\n\
    \        player.vy = 0;\n        break;\n      case \"right\":\n        player.vx\
    \ = 2;\n        player.vy = 0;\n        break;\n      case \"none\":\n       \
    \ player.vx = 0;\n        player.vy = 0;\n        break;\n    }\n  }\n\n  //Update\
    \ the player's Cartesian position, based on its velocity              \n  player.cartY\
    \ += player.vy;\n  player.cartX += player.vx;\n\n  //Wall collision          \
    \    \n  //Get a reference to the wall map array              \n  wallMapArray\
    \ = wallLayer.data;\n\n  //Use `hitTestIsoTile` to check for a collision     \
    \         \n  let playerVsGround = hitTestIsoTile(player, wallMapArray, 0, world,\
    \ \"every\");\n\n  //If there's a collision, prevent the player from moving. \
    \             \n  //Subtract its velocity from its position and then set its velocity\
    \ to zero              \n  if (!playerVsGround.hit) {\n    player.cartX -= player.vx;\n\
    \    player.cartY -= player.vy;\n    player.vx = 0;\n    player.vy = 0;\n  }\n\
    \n  //Add world boundaries              \n  let top = 0,\n    bottom = (world.heightInTiles\
    \ * world.cartTileheight),\n    left = 0,\n    right = (world.widthInTiles * world.cartTilewidth);\n\
    \n  //Prevent the player from crossing any of the world boundaries           \
    \   \n  //Top              \n  if (player.cartY < 0) {\n    player.cartY = top;\n\
    \  }\n\n  //Bottom              \n  if (player.cartY + player.cartHeight > bottom)\
    \ {\n    player.cartY = bottom - player.cartHeight;\n  }\n\n  //Left         \
    \     \n  if (player.cartX < left) {\n    player.cartX = left;\n  }\n\n  //Right\
    \              \n  if (player.cartX + player.cartWidth > right) {\n    player.cartX\
    \ = right - player.cartWidth;\n  }\n\n  //Position the sprite's screen `x` and\
    \ `y` position              \n  //using its isometric coordinates            \
    \  \n  player.x = player.isoX;\n  player.y = player.isoY;\n\n  //Get the player's\
    \ index position in the map array              \n  player.index = g.getIndex(\n\
    \    player.cartX, player.cartY,\n    world.cartTilewidth, world.cartTileheight,\
    \ world.widthInTiles\n  );\n\n  //Depth sort the sprites if the player is moving\
    \              \n  if (player.vx !== 0 || player.vy !== 0) {\n    wallLayer.children.sort(byDepth);\n\
    \  }\n\n  //Display the player's x, y and index values              \n  message.content\
    \ = `index: ${player.index}`;\n}\n```\n\n## 总结\n\n不论你的游戏采用笛卡尔投影还是等距投影，处理基于瓦片的游戏的基本逻辑是相同的。正如本章所见，如果你知道如何绘制地图、添加键盘交互以及使用笛卡尔坐标进行碰撞检测，那么你可以将同样的逻辑应用于等距地图，只需添加两个简单的转换公式。你还学会了如何将这些公式应用于指针位置坐标，从而在屏幕上精确地选中等距精灵。此外，你还掌握了如何使用\
    \ Tiled Editor 创建和绘制等距地图，并利用`z`值对这些精灵进行精确的深度排序，使它们能够在正确的深度图层上显示。这些都是制作各种等距游戏（从策略游戏到地牢探险游戏）所需具备的基础技能。\n\
    \n既然你已经知道如何创建各种交互式基于瓦片的游戏环境，那么如何制作能够智能地在这些环境中导航的游戏角色呢？这就是下一章的内容：寻路。\n\n© Rex van\
    \ der Spuy 2017\n\nRex van der Spuy, 《高级游戏开发者工具包》, 10.1007/978-1-4842-1097-0_5\n\
    \n# 5. 寻路基础\n\nRex van der Spuy¹\n\n(1) 加拿大安大略省多伦多市\n\n你现在已经知道如何制作基于瓦片的游戏世界，也知道了如何制作一个能够在这个世界中导航的玩家角色。但是，如何创建能够自主游荡和探索世界的精灵呢？花点时间来体验一下本章源文件中名为`tileBasedLineOfSight.html`的示例原型（如图\
    \ 5-1 所示）。迷宫中有三个怪物，它们会随机游荡，直到发现外星人角色——然后就会穷追不舍。\n\n![A346816_1_En_5_Fig1_HTML.jpg](img/A346816_1_En_5_Fig1_HTML.jpg)\n"
- fmt: '###### Figure 5-1. The monsters navigate the game world autonomously and chase
    the player character


    The monsters seem to have a kind of intelligence, and behave much as you would
    expect living creatures to behave. But, of course, it’s just an effective illusion,
    thanks to a collection of game programming techniques broadly known as **pathfinding**:
    how to make sprites that can autonomously interpret and navigate a game world.
    In this chapter you’re going to learn all the basics of pathfinding, including:


    - How to analyze and interpret the environment that a sprite is in.

    - Random movement through a maze.

    - Finding the closest direction to a target.

    - Line of sight: How to know if a sprite can see another sprite.


    Pathfinding is actually a rudimentary form of Artificial Intelligence (AI), and
    you’ll be able to apply these techniques, not just to a wide range of different
    games, but any programming problem where you need to interpret the meaning of
    some data based on its context in a larger set of data. And, it’s pretty easy
    to do! So let’s start with some pathfinding fundamentals, and go from there.


    ## Random Movement Through a Maze


    The best place to start with pathfinding is to first create sprites that move
    around a maze at random. Run the `randomMovement.html` file and you’ll find a
    simpler version of the same maze game shown in Figure 5-1. Instead of actively
    searching for the alien character, the monsters change their direction randomly
    whenever they’re at an intersection. Let’s go on a tour of how this code works,
    and we’ll learn all the pathfinding basics as we go.


    ### Direction and Speed


    When monster sprites are created in the game’s setup function, they’re initialized
    with two important properties: `direction` and `speed`, highlighted in the sprite
    creation code below:


    ```

    monsters = mapMonsters.map(mapMonster => {

      let monster = g.sprite(monsterFrames);

      monster.x = mapMonster.x;

      monster.y = mapMonster.y;

      monster.direction = "none";

      monster.speed = 4;

      monsterLayer.addChild(monster);

      mapMonster.visible = false;

      return monster;

    });

    ```


    The `direction` is a string, which is initialized to `"none"` – you’ll see how
    we assign it new string values ahead. `speed` is the number of pixels per frame
    that the sprite should move, and it should be a number that divides evenly into
    the map’s `tilewidth` and `tileheight` size. We’re going to need to use those
    `direction` and `speed` values to help give the monsters new random directions
    and velocities.


    ### Moving the Sprite in the Game Loop


    The code that actually chooses the monsters’ new direction and makes them move
    runs inside the game loop. The code that does this needs to do four important
    things:


    1. Find out if the monster is centered directly over a map tile cell.

    2. If it is, choose a new random direction.

    3. Use the monster’s new random direction and speed to find its velocity.

    4. Use the new velocity to move the monster.


    Here’s the code from the game loop that does all this.


    ```

    monsters.forEach(monster => {


      //1. Is the monster directly centered over a map tile cell?

      if (isCenteredOverCell(monster)) {


        //2. Yes, it is, so find out which are valid directions to move.

        //`validDirections` returns an array which can include any

        //of these string values: "up", "right", "down"or "left" or

        monster.validDirections = validDirections(

          monster, wallMapArray, 0, world

        );


        //3. Can the monster change its direction?

        if (canChangeDirection(monster.validDirections)) {


          //4. If it can, randomly select a new direction from the monsters valid
    directions

          monster.direction = randomDirection(monster, monster.validDirections);

        }


        //5. Use the monster''s direction and speed to find its new velocity

        let velocity = directionToVelocity(monster.direction, monster.speed);

        monster.vx = velocity.vx;

        monster.vy = velocity.vy;

      }


      //6. Move the monster

      monster.x += monster.vx;

      monster.y += monster.vy;

    });

    ```


    This is very high-level code. You can see that all the important functionality
    is hidden away in five important functions: `isCenteredOverCell`, `validDirections`,
    `canChangeDirection`, `randomDirection`, and `directionToVelocity`. We’re going
    to look at each of these functions, in turn, to find out exactly how they work.


    ### Is the Sprite Centered Over a Tile Cell?


    As you learned in Chapter 3, your sprites will move with more accuracy and precision
    in a tile-based world if they only change direction when they’re exactly centered
    over a cell. So the first thing the code does is figure this out by using a helper
    function called `isCenteredOverCell`. Supply it with a sprite, and `isCenteredOverCell`
    will return `true` if the sprite is centered, and `false` if it isn’t.


    ```

    function isCenteredOverCell(sprite) {

      return Math.floor(sprite.x) % world.tilewidth === 0

      && Math.floor(sprite.y) % world.tileheight === 0

    }

    ```


    This is a funky bit of boiler plate code that shows how unexpectedly useful the
    modulus operator (`%`) can sometimes be. (As a reminder, the modulus operator
    tells you what the remainder is of a division operation.) The code above finds
    out if the `x` and `y` top-left corner position of the sprite, divided by the
    width and height of the tile, has a remainder of zero. If it does, then you know
    the sprite is at an `x`/`y` location that divides absolutely evenly into the dimensions
    of the tile. And, that can only mean one thing: that the sprite is *exactly* aligned
    over the cell. It’s a clever trick – thank you, modulus operator!


    If the sprite is centered, the next step is to find out which are the possible
    valid directions that the sprite can choose.'
