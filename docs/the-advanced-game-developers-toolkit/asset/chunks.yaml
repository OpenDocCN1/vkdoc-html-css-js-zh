    \ collision check, we’re not interested in those. We’re only interested in anything\
    \ that isn’t a wall. That’s anything represented by a “0” in the map. So our collision\
    \ algorithm is going to follow this logic: *If the alien isn’t touching a “0”\
    \ cell, prevent it from moving.*\n\nHere’s all the code from the game loop that\
    \ does this. It’s very similar to the code from the previous example, except for\
    \ a few small details.\n\n```\nlet alienVsFloor = g.hitTestTile(alien, wallMapArray,\
    \ 0, world, \"every\");\n\nif (!alienVsFloor.hit) {\n\n  //Prevent the alien from\
    \ moving            \n  alien.x -= alien.vx;\n  alien.y -= alien.vy;\n  alien.vx\
    \ = 0;\n  alien.vy = 0;\n}\n```\n\nYou can see that alienVsFloor only becomes\
    \ true if every corner point is inside a “0” cell. If alienVsFloor becomes false,\
    \ we know that the alien is touching something that isn’t “0” – and that thing\
    \ must be a wall.\n\nThis example uses the world’s simplest collision reaction\
    \ code. If the alien hits a wall, the alien is prevented from moving by subtracting\
    \ its velocity from its position, and then setting its velocity to zero.\n\n```\n\
    alien.x -= alien.vx;\nalien.y -= alien.vy;\nalien.vx = 0;\nalien.vy = 0;\n```\n\
    \nWe can get away with such a simple collision reaction system because the alien’s\
    \ movement is aligned to the map’s grid rows and columns, and we’re not using\
    \ any physics to change its velocity. Those constraints have removed a whole class\
    \ of collision problems that we don’t have to worry about.\n\nTo see how this\
    \ code is used in context, here’s all the code from the game loop that uses hitTestTile\
    \ to check for a collision between the alien and the floor, and the alien and\
    \ the bombs.\n\n```\n//Check for a collision between the alien and floor     \
    \           \nlet alienVsFloor = g.hitTestTile(alien, wallMapArray, 0, world,\
    \ \"every\");\n\n//Prevent the alien from moving if it's not touching a floor\
    \ tile                \nif (!alienVsFloor.hit) {\n  alien.x -= alien.vx;\n  alien.y\
    \ -= alien.vy;\n  alien.vx = 0;\n  alien.vy = 0;\n}\n\n//Check for a collision\
    \ between the alien and the bombs                \nlet alienVsBomb = g.hitTestTile(alien,\
    \ bombMapArray, 5, world, \"every\");\n\n//Find out if the alien's position in\
    \ the bomb array matches a bomb gid number                \nif (alienVsBomb.hit)\
    \ {\n\n  //If it does, filter through the bomb sprites and find the one      \
    \      \n  //that matches the alien's position            \n  bombSprites = bombSprites.filter(function(bomb)\
    \ {\n\n    //Does the bomb sprite have the same index number as the alien?   \
    \         \n    if (bomb.index === alienVsBomb.index) {\n\n      //If it does,\
    \ remove the bomb from the            \n      //`bombMapArray` by setting its\
    \ gid to `0`            \n      bombMapArray[bomb.index] = 0;\n\n      //Remove\
    \ the bomb sprite from its container group            \n      g.remove(bomb);\n\
    \n      //Filter the bomb out of the `bombSprites` array            \n      return\
    \ false;\n    } else {\n\n      //Keep the bomb in the `bombSprites` array if\
    \ it doesn't match            \n      return true;\n    }\n  });\n}\n```\n\nNow\
    \ we’ve got a useful tile-based collision system we can use for all kinds of tile-based\
    \ games. So let’s now find out how we can use all these new skills in the fantasy\
    \ Role Playing game that we started to build in the previous chapter."
