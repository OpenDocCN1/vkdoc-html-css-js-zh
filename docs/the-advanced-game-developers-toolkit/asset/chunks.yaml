  trans: "\n###### 图 5-9. 沿精灵之间距离最大的轴移动怪物\n\n很明显，如果怪物想要靠近玩家，它应该选择沿 X 轴的左方向。然而，X 轴也是两个物体之间距离最大的轴。这反直觉，但确实如此！\n\
    \n现在我们知道了这一点，可以使用一个简单的`if/else`语句来判断哪个方向是距离目标最近的方向：“上”、“下”、“左”或“右”。这里有一个名为`closest`的函数，它封装了所有逻辑并为我们返回正确的值：\n\
    \n```\nlet closest = () => {\n\n  //绘制 spriteTwo 和 spriteOne 之间的向量           \
    \   \n  let vx = spriteTwo.centerX - spriteOne.centerX,\n      vy = spriteTwo.centerY\
    \ - spriteOne.centerY;\n\n  //如果在 X 轴上的距离更大...              \n  if (Math.abs(vx)\
    \ >= Math.abs(vy)) {\n\n    //尝试左和右              \n    if (vx <= 0) {\n      return\
    \ \"left\";\n    } else {\n      return \"right\";\n    }\n  }\n\n  //如果在 Y 轴上的距离更大...\
    \              \n  else {\n\n    //尝试上和下              \n    if (vy <= 0) {\n \
    \     return \"up\"\n    } else {\n      return \"down\"\n    }\n  }\n};\n```\n\
    \n现在让我们了解如何将其集成到现有代码中。\n\n### 寻找最近方向\n\n打开本章源文件中的`closesestDirection.js`文件，你会在`play`函数（游戏循环）中找到这段代码，它负责移动怪物并选择它们的新方向。除了第\
    \ 4 步之外，它与我们本章开头使用的代码完全相同。\n\n```\nmonsters.forEach(monster => {\n\n//1\\. 怪物是否正中心对准地图瓦片单元格？\
    \              \n  if (isCenteredOverCell(monster)) {\n\n//2\\. 是的，它正中心对准，因此找出哪些是有效的移动方向。\
    \              \n  //`validDirections` 返回一个数组，可以包含以下              \n  //字符串值：\"\
    up\", \"right\", \"down\", \"left\" 或 \"none\"              \n  monster.validDirections\
    \ = validDirections(\n    monster, wallMapArray, 0, world\n  );\n\n//3\\. 怪物能否改变方向？\
    \              \n  if (canChangeDirection(monster.validDirections)) {\n\n//4\\\
    . 如果可以，选择距离外星人最近的方向              \n    monster.direction = closestDirection(monster,\
    \ alien, monster.validDirections);\n  }\n\n//5\\. 使用怪物的方向和速度来找到它的新速度         \
    \     \n  let velocity = directionToVelocity(monster.direction, monster.speed);\n\
    \  monster.vx = velocity.vx;\n  monster.vy = velocity.vy;\n}\n\n//6\\. 移动怪物  \
    \                \nmonster.x += monster.vx;\nmonster.y += monster.vy;\n```\n\n\
    唯一新增的代码行是这一行：\n\n```\nmonster.direction = closestDirection(monster, alien, monster.validDirections);\n\
    ```\n\n一个名为`closestDirection`的新函数负责计算并返回怪物有效方向中距离外星人最近的那一个。如果没有匹配最近方向的有效方向，它会回退到随机选择一个方向。以下是实现所有这些功能的完整`closestDirection`函数：\n\
    \n```\nfunction closestDirection(spriteOne, spriteTwo, validDirections = []) {\n\
    \n//一个辅助函数，用于找到最近方向              \n  let closest = () => {\n\n//绘制 spriteTwo 和\
    \ spriteOne 之间的向量              \n    let vx = spriteTwo.centerX - spriteOne.centerX,\n\
    \        vy = spriteTwo.centerY - spriteOne.centerY;\n\n//如果在 X 轴上的距离更大...   \
    \           \n    if (Math.abs(vx) >= Math.abs(vy)) {\n\n//尝试左和右             \
    \ \n      if (vx <= 0) {\n        return \"left\";\n      } else {\n        return\
    \ \"right\";\n      }\n    }\n\n//如果在 Y 轴上的距离更大...              \n    else {\n\
    \n//尝试上和下              \n      if (vy <= 0) {\n        return \"up\"\n      }\
    \ else {\n        return \"down\"\n      }\n    }\n  };\n\n//既是最近方向也是有效方向的方向 \
    \             \n  let closestValidDirection = validDirections.find(x => x ===\
    \ closest());\n\n//`randomInt` 辅助函数返回一个介于              \n  //最小值和最大值之间的随机整数  \
    \            \n  let randomInt = (min, max) => {\n    return Math.floor(Math.random()\
    \ * (max - min + 1)) + min;\n  };\n\n//精灵被困住了吗？              \n  let trapped =\
    \ validDirections.length === 0;\n\n//如果精灵没有被困住，从`validDirections`数组中         \
    \     \n  //选择最近的方向。如果没有最近的有效的方向，              \n  //则随机选择一个有效方向             \
    \ \n  if (!trapped) {\n    if (closestValidDirection) {\n      return closestValidDirection;\n\
    \    } else {\n      return validDirections[randomInt(0, validDirections.length\
    \ - 1)];\n    }\n  } else {\n    return \"trapped\"\n  }\n}\n```\n\n这个函数的工作原理是：首先绘制两个精灵之间的向量，然后计算出哪一个方向对于`spriteOne`（猎人）来说最接近`spriteTwo`（目标）。代码会检查该方向是否也在`validDirections`数组中。如果是，则选择那个最近的方向；如果不是，则选择一个随机的新方向。\n\
    \n这个系统运行良好，但存在一个小问题：即使怪物的视线被迷宫墙壁阻挡，它们也知道哪个方向最接近外星人。也许怪物是在用声音探测外星人的位置，通过心灵感应交流，或者，不太可能的是，它们只是非常聪明？从美学上看，这个系统是可行的——它看起来正确，并且使游戏具有挑战性。但你可能想要创建一个怪物只有在真正*看到*外星人（且没有被墙壁阻挡）时才会做出反应的游戏。我们可以通过使用一种基本的游戏设计技术来实现这个功能，称为**视线**。\n\
    \n## 视线\n\n如何判断一个精灵能否看到另一个精灵？在两者之间绘制一个向量，然后沿该向量以均匀间隔的点检查障碍物。如果该向量完全没有障碍，那么你就知道两个精灵之间存在直接视线。\n\
    \n运行本章源文件中的`lineOfSight.html`文件，查看交互式示例，如图 5-10 所示。在屏幕周围以各种组合拖放外星人、怪物和墙壁精灵。一条红色的线延伸在怪物和外星人之间，代表视线。如果视线未被遮挡，精灵之间的线会变暗，并且怪物会张开它的嘴。\n\
    \n![A346816_1_En_5_Fig10_HTML.jpg](img/A346816_1_En_5_Fig10_HTML.jpg)\n\n######\
    \ 图 5-10. 检查两个精灵之间的视线\n\n其工作原理是：一系列的点被不可见地放置在两个精灵之间的向量（线）上。如果其中任何一点碰到了盒子，那么你就知道视线被挡住了。如果这些点都没有碰到任何盒子，那么精灵之间就有一条清晰的视线。图\
    \ 5-11 说明了这一点。\n\n![A346816_1_En_5_Fig11_HTML.jpg](img/A346816_1_En_5_Fig11_HTML.jpg)\n\
    \n###### 图 5-11. 沿线绘制点，并检查每个点是否与盒子发生碰撞\n\n让我们逐步讲解你需要编写的代码，以实现这一功能。\n"
- fmt: "### Calculating the Vector\n\nThe first step is to plot a vector between the\
    \ center of the two sprites.\n\n```\nlet vx = spriteTwo.centerX - spriteOne.centerX,\n\
    \    vy = spriteTwo.centerY - spriteOne.centerY;\n```\n\nNext, we need to find\
    \ out what the length of the vector is, in pixels. The length of a vector is known\
    \ as its magnitude, and you can figure it out like this:\n\n```\nlet magnitude\
    \ = Math.sqrt(vx * vx + vy * vy);\n```\n\nWe want to plot points at evenly spaced\
    \ positions along this vector. To help us do that, let’s create a variable called\
    \ `segment` that determines what the distance between each of those points should\
    \ be.\n\n```\nlet segment = spriteOne.width;\n```\n\nUsually you don’t want the\
    \ space between the points to be less than the width or height of your smallest\
    \ sprite. That’s because if the space between points is too large, the point collision\
    \ test might skip over and miss smaller obstacle sprites.\n\nNow that we know\
    \ the length of the vector between the sprites, and we know the length of each\
    \ segment between collision points, we can figure out how many collision points\
    \ along the line we’ll need to use.\n\n```\nlet numberOfPoints = magnitude / segment;\n\
    ```\n\nFor example, if the magnitude of the vector is 256 pixels, and the length\
    \ of each segment is 64 pixels, the `numberOfPoints` would be 4.\n\n### Finding\
    \ the Positions of the Collision Points\n\nWe now have enough information to figure\
    \ out the x/y position of the collision points along the vector. We’re going to\
    \ do this with the help of a function called `points()` that returns an array\
    \ containing objects with `x` and `y` properties. We’re going to be able to use\
    \ that array of point objects to test for a collision between each point and an\
    \ obstacle. Here’s the `points()` function that creates the array of point objects:\n\
    \n```\nlet points = () => {\n\n  //Initialize an array that is going to store\
    \ all our points              \n  //along the vector              \n  let arrayOfPoints\
    \ = [];\n\n  //Create a point object for each segment of the vector and      \
    \        \n  //store its x/y position as well as its index number on         \
    \     \n  //the map array              \n  for (let i = 1; i <= numberOfPoints;\
    \ i++) {\n\n    //Calculate the new magnitude for this iteration of the loop \
    \             \n    let newMagnitude = segment * i;\n\n    //Find the unit vector\
    \              \n    let dx = vx / magnitude,\n        dy = vy / magnitude;\n\n\
    \    //Use the unit vector and newMagnitude to figure out the x/y            \
    \  \n    //position of the next point in this loop iteration              \n \
    \   let x = spriteOne.centerX + dx * newMagnitude,\n        y = spriteOne.centerY\
    \ + dy * newMagnitude;\n\n    //Push a point object with x and y properties into\
    \ the `arrayOfPoints`              \n    arrayOfPoints.push({x, y});\n  }\n\n\
    \  //Return the array of point objects              \n  return arrayOfPoints;\n\
    };\n```\n\nAt the heart of the `points()` function is a loop that creates point\
    \ objects for however many `numberOfPoints` there are. The first thing the loop\
    \ does is create a `newMagnitude` value by multiplying the loop index value with\
    \ the value of `segment`.\n\n```\nlet newMagnitude = segment * i;\n```\n\nIf there\
    \ are four points, and the width of each segment is 64 pixels, `newMagnitude`\
    \ will have the values 64, 128, 194, and 256 with each iteration of the loop.\n\
    \nThe next two lines of code figure out what the unit vector is, represented by\
    \ the variable names `dx` and `dy`.\n\n```\nlet dx = vx / magnitude,\n    dy =\
    \ vy / magnitude;\n```\n\nA unit vector (also known as a normalized vector) is\
    \ just a tiny, scaled-down version of the main vector between the sprites that's\
    \ less than one pixel long. It points in the same direction as the main vector,\
    \ but because it's the smallest possible size that the vector can be, we can use\
    \ it to create new vectors of varying length.\n\nYou’ll find a complete beginner’s\
    \ guide to vector math in this book’s companion, *Advanced Game Design with HTML5\
    \ and JavaScript* (Apress, 2015). It explains all these concepts in great detail\
    \ with plenty of practical examples of how to use them for game development.\n\
    \nMultiplying the unit vector by the `newMagnitude`, and adding the result to\
    \ `spriteOne`‘s position will give us the x/y positions of points along the vector.\n\
    \n```\nlet x = spriteOne.centerX + dx * newMagnitude,\n    y = spriteOne.centerY\
    \ + dy * newMagnitude;\n```\n\nFigure [5-12](#A346816_1_En_5_Chapter.xhtml#Fig12)\
    \ illustrates what this would look like for each iteration of the loop if there\
    \ were four `numberOfPoints` and the segment width was 64 pixels.\n\n![A346816_1_En_5_Fig12_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig12_HTML.jpg)\n\
    \n###### Figure 5-12. Find the positions of each of the points along the vector\n\
    \nThe x/y values of these points are stored in a point object and pushed into\
    \ an array called `arrayOfPoints`.\n\n```\narrayOfPoints.push({x, y});\n```\n\n\
    When the loop finishes, `arrayOfPoints` will contain a list of objects with `x`\
    \ and `y` properties that match the x and y values we calculated in the previous\
    \ step. The `points()` function returns this array:\n\n```\nreturn arrayOfPoints;\n\
    ```\n\nWe can now access this array by calling the `points()` function like this:\n\
    \n```\npoints()\n```\n\nThis will dynamically recalculate and return the new array\
    \ of points whenever we need them in our game.\n\n### Testing the Points for Collisions\
    \ with Obstacles\n\nWe now need some way to figure out if any of those points\
    \ is touching one of the obstacles. We can use a basic geometric collision function\
    \ called `hitTestPoint()` that checks whether a single point object with x/y properties\
    \ is intersecting a rectangular sprite. `hitTestPoint()` returns `true` if there\
    \ is a collision, and `false` if there isn’t.\n\n```\nlet hitTestPoint = (point,\
    \ sprite) => {\n\n  //Find out if the point's position is inside the area defined\
    \              \n  //by the sprite's left, right, top and bottom sides       \
    \       \n  let left = point.x > sprite.x,\n      right = point.x < (sprite.x\
    \ + sprite.width),\n      top = point.y > sprite.y,\n      bottom = point.y <\
    \ (sprite.y + sprite.height);\n\n  //If all the collision conditions are met,\
    \ you know the              \n  //point is intersecting the sprite           \
    \   \n  return left && right && top && bottom;\n};\n```\n\nWe can now use `hitTestPoint()`\
    \ to check for a collision between every point and every obstacle sprite that\
    \ might be blocking the line of sight. Here’s how:\n\n```\nlet noObstacles = points().every(point\
    \ => {\n  return obstacles.every(obstacle => {\n    return !(hitTestPoint(point,\
    \ obstacle))\n  });\n});\n```\n\nIf `noObstacles` is `true`, then we know that\
    \ the line of sight is clear."
