- fmt: "// We're just going to capture the object's properties\n// so that we can\
    \ decide what to do with it later\n\n// Get a reference to the layer group the\
    \ object is in\n`object.group = layerGroup;`\n\n// Push the object into the world's\
    \ `objects` array\n`world.objects.push(object);`\n\n// Search functions\n\n/*\
    \  \n`world.getObject` and `world.getObjects` (with an \"s\") search for and return\
    \  \nany sprites or objects in the `world.objects` array.  \nAny object that has\
    \ a `name` property in  \nTiled Editor will show up in a search.  \n`getObject`\
    \ gives you a single object, `getObjects` gives you an array of objects.  \n`getObject`\
    \ returns the actual search function, so you  \ncan use the following format to\
    \ directly access a single object:  \n`sprite.x = world.getObject(\"anySprite\"\
    ).x;`  \n`sprite.y = world.getObject(\"anySprite\").y;`  \n*/\n\n`world.getObject\
    \ = objectName => {`  \n    `let searchForObject = () => {`  \n      `let foundObject;`\
    \  \n      `world.objects.some(object => {`  \n        `if (object.name && object.name\
    \ === objectName) {`  \n          `foundObject = object;`  \n          `return\
    \ true;`  \n        `}`  \n      `});`  \n      `if (foundObject) {`  \n     \
    \   `return foundObject;`  \n      `} else {`  \n        `throw new Error(\"There\
    \ is no object with the property name: \" + objectName);`  \n      `}`  \n   \
    \ `};`\n\n    // Return the search function\n    `return searchForObject();` \
    \ \n`};`\n\n`world.getObjects = objectNames => {`  \n    `let foundObjects = [];`\
    \  \n    `world.objects.forEach(object => {`  \n      `if (object.name && objectNames.indexOf(object.name)\
    \ !== -1) {`  \n        `foundObjects.push(object);`  \n      `}`  \n    `});`\
    \  \n    `if (foundObjects.length > 0) {`  \n      `return foundObjects;`  \n\
    \    `} else {`  \n      `throw new Error(\"I could not find those objects\");`\
    \  \n    `}`  \n    `return foundObjects;`  \n`};`\n\n// That's it, we're done!\n\
    \n// Finally, return the `world` object back to the game program\n`return world;`\n\
    ```\n```\n\n(You can find the full, working code for `makeTiledWorld` in the `tileUtilities`\
    \ module of Hexi's `src` folder in this chapter's source files).\n\nThis code\
    \ works by looping through all the arrays in the JSON data, and using that information\
    \ to make sprites and plot them in `world`. But there's an important detail to\
    \ point out. Each sprite has been created with two new properties: `index` and\
    \ `gid`.\n\n```\ntileSprite.index = index;\ntileSprite.gid = gid;\n```\n\n`index`\
    \ is the array position number of the sprite in the map array. `gid` is the grid\
    \ id number of the sprite's texture image on the tileset. Both of these properties\
    \ are going to be very useful for collision detection later, and you'll find how\
    \ in Chapter [3](#A346816_1_En_3_Chapter.xhtml). Stay tuned!\n\nNow let's find\
    \ out how to use `makeTiledWorld` to build a game.\n\n## Creating the Game World\n\
    \nTake a look at the `fantasy.js` file in the chapter's source files for a working\
    \ example of the game world we've created. Figure [2-15](#A346816_1_En_2_Chapter.xhtml#Fig15)\
    \ compares the final rendered map on the left with the original map we designed\
    \ in Tiled Editor.\n\n![A346816_1_En_2_Fig15_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig15_HTML.jpg)\n\
    \n###### Figure 2-15. The rendered game world matches the map we designed in Tiled\
    \ Editor\n\nUse the keyboard arrow keys to make the elf walk around the game world,\
    \ and you'll notice that the sprites are also correctly depth layered. Let's find\
    \ out how the `makeTiledWorld` function was used to construct this scene.\n\n\
    ### Creating the Sprites\n\nWhen the game code's `setup` function runs, the world\
    \ is created from the JSON file and tileset image using `makeTiledWorld`.\n\n\
    ```\nworld = g.makeTiledWorld(\n    \"maps/fantasy.json\",\n    \"images/fantasy.png\"\
    \n  );\n```\n\nThis generates the map, and lets us access all the map data through\
    \ an object called `world`.\n\nThe animated elf character is created using another\
    \ tileset image called `walkcycle.png` that contains all the elf's animation frames,\
    \ as shown in Figure [2-16](#A346816_1_En_2_Chapter.xhtml#Fig16).\n\n![A346816_1_En_2_Fig16_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig16_HTML.jpg)\n\
    \n###### Figure 2-16. The elf's animation tileset\n\nHere's the code in the game's\
    \ `setup` function that uses this animation tileset to create the elf sprite.\n\
    \n```\nelf = g.sprite(g.filmstrip(\"images/walkcycle.png\", 64, 64));\n```\n\n\
    The custom `filmstrip` function captures each 64 by 64 pixel frame in the `walkcycle`\
    \ tileset and uses it to initialize the sprite.\n\nYou'll remember that in Tiled\
    \ Editor we just created a placeholder object to represent the elf, and used it\
    \ to set the elf's `x` and `y` position. What we want to do next is use those\
    \ values to position our new elf sprite. The `getObject` method that we added\
    \ to the `world` object is able to extract anything from the map data that has\
    \ a `name` property. Here's how you can use `getObject` to capture the elf's `x`\
    \ and `y` map data values, and apply them to the sprite's `x` and `y` position\
    \ properties.\n\n```\nelf.x = world.getObject(\"elf\").x;\nelf.y = world.getObject(\"\
    elf\").y;\n```\n\nThis new elf sprite isn't part of the world yet, so add it to\
    \ the world's objects layer. First get a reference to the objects layer, and then\
    \ use `addChild` to add the elf to it.\n\n```\nlet objectsLayer = world.getObject(\"\
    objects\");\nobjectsLayer.addChild(elf);\n```\n\nThe rest of the game moves and\
    \ animates the elf. It also implements collision detection, and you'll learn all\
    \ about how that works in the next chapter.\n\n### Changing the Sprite's Depth\
    \ Layer\n\nThe elf can walk behind and in front of the trees and wall, and there's\
    \ no other depth-sorting code required to make sure this works properly. How is\
    \ that possible? Because the PixiJS renderer that's running behind the scenes\
    \ displays sprites created last, in front of those created first. Most 2D renderers\
    \ work the same way. And, because we created the sprites starting with the bottom-most\
    \ layer, the ground, and worked our way up, the sprites in Tiled Editor's upper\
    \ layers render in front of those on the lower layers. It all happens automatically,\
    \ thanks to the careful way we planned the layers when we designed them using\
    \ Tiled Editor, and the order in which we created the sprites in the `makeTiledWorld`\
    \ function.\n\nBut what if you want to change a sprite's depth layer, while the\
    \ game is in progress? For example, maybe the elf discovered a ladder somewhere\
    \ and was able to climb on top of the wall. How could you display the elf above\
    \ the wall but below the treetops?\n\nGet a reference to the `\"treeTops\"` layer\
    \ group and add the elf to it.\n\n```\nworld.getObject(\"treeTops\").addChild(elf);\n\
    ```\n\nFigure [2-17](#A346816_1_En_2_Chapter.xhtml#Fig17) shows the result.\n\n\
    ![A346816_1_En_2_Fig17_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig17_HTML.jpg)\n\
    \n###### Figure 2-17. Change the sprite's depth layer\n\nNow that we've got a\
    \ big game world to explore, let's add the scrolling camera."
