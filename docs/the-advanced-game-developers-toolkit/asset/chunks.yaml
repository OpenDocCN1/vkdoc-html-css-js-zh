  trans: "\n// 使用经典的 `for` 循环遍历所有 `surroundingTestNodes` 节点  \n//（`for` 循环能带来边际性能提升。A*\
    \ 算法对性能要求极高，  \n// 因此每次循环迭代中即使微小的性能提升，  \n// 也可能累积成显著的总体提升）  \nfor (let i = 0;\
    \ i < surroundingTestNodes.length; i++) {\n\n  // 获取当前测试节点的引用  \n  let testNode\
    \ = surroundingTestNodes[i];\n\n  // 判断该节点位于直线轴还是对角线轴，并分配相应的成本\n\n  // A. 声明成本变量\
    \  \n  let cost = 0;\n\n  // B. 它们是否位于同一行或同一列？  \n  if (centerNode.row === testNode.row\
    \ || centerNode.column === testNode.column) {\n\n    // 如果是，则分配成本为 \"10\"  \n\
    \    cost = straightCost;\n  } else {\n\n    // 否则，分配成本为 \"14\"  \n    cost =\
    \ diagonalCost;\n  }\n\n  // C. 计算成本（g、h 和 f）  \n  // 当前节点的成本  \n  let g = centerNode.g\
    \ + cost;\n\n  // 从该节点到目标节点的成本（启发式函数）  \n  let h;\n  switch (heuristic) {\n  \
    \  case \"manhattan\":\n      h = manhattan(testNode, destinationNode);\n    \
    \  break;\n\n    case \"euclidean\":\n      h = euclidean(testNode, destinationNode);\n\
    \      break;\n\n    case \"diagonal\":\n      h = diagonal(testNode, destinationNode);\n\
    \      break;\n\n    default:\n      throw new Error(\"哎呀！看起来你拼错了启发式函数的名称\");\n\
    \  }\n\n  // 最终成本  \n  let f = g + h;\n\n  // 判断 testNode 是否在 openList 或 closedList\
    \ 数组中  \n  let isOnOpenList = openList.some(node => testNode === node);\n  let\
    \ isOnClosedList = closedList.some(node => testNode === node);\n\n  // 如果它在任一列表中，我们可以检查\
    \  \n  // 这条路径是否为先前成本计算的更低成本替代方案。  \n  // 新的 G 成本会影响最终的 F 成本  \n  if (isOnOpenList\
    \ || isOnClosedList) {\n    if (testNode.f > f) {\n      testNode.f = f;\n   \
    \   testNode.g = g;\n      testNode.h = h;\n\n      // 仅在新成本更低时才更改父节点  \n    \
    \  testNode.parent = centerNode;\n    }\n  }\n\n  // 否则，将 testNode 添加到 openList\
    \  \n  else {\n    testNode.f = f;\n    testNode.g = g;\n    testNode.h = h;\n\
    \    testNode.parent = centerNode;\n    openList.push(testNode);\n  }\n\n  //\
    \ `for` 循环在此结束  \n}\n\n// 将当前 centerNode 推入 closedList  \nclosedList.push(centerNode);\n\
    \n// 如果 openList 为空，则退出循环。  \n// 这表示没有通往目标节点的路径，或者目标节点无效（例如墙壁图块）  \nif (openList.length\
    \ === 0) {\n  return shortestPath;\n}\n\n// 根据最终成本对 openList 进行排序  \nopenList\
    \ = openList.sort((a, b) => a.f - b.f);\n\n// 将最终成本最低的节点设为新的 centerNode  \ncenterNode\
    \ = openList.shift();\n\n// `while` 循环在此结束  \n\n// 现在我们有了所有候选节点，让我们找到最短路径！  \n\
    if (openList.length !== 0) {\n\n  // 从目标节点开始  \n  let testNode = destinationNode;\n\
    \  shortestPath.push(testNode);\n\n  // 通过父节点反向追溯，  \n  // 直到找到起始节点  \n  while\
    \ (testNode !== startNode) {\n\n    // 逐步遍历每个节点的父节点，  \n    // 从目标节点开始，到起始节点结束\
    \  \n    testNode = testNode.parent;\n\n    // 将节点添加到数组的开头  \n    shortestPath.unshift(testNode);\n\
    \n    // ...然后再次循环到下一个节点的父节点，直到  \n    // 到达路径的终点  \n  }\n}\n\n// 返回一个由节点组成的数组，这些节点相互连接形成\
    \  \n// 最短路径  \nreturn shortestPath;\n\n### 使用 `shortestPath` 函数\n\n在本章的源文件中，你会找到一个名为\
    \ `shortestPath.html` 的文件夹。运行该程序，你会看到一个外星角色坐在一个简单的迷宫环境中。用鼠标点击任意位置，程序将绘制从外星角色位置到鼠标点击位置的最短路径，如图\
    \ 6-18 所示。\n\n![A346816_1_En_6_Fig18_HTML.jpg](img/A346816_1_En_6_Fig18_HTML.jpg)\n"
- fmt: "###### Figure 6-18. Click anywhere to draw the shortest path\n\nThis program\
    \ works by calculating the shortest path between the alien sprite and the mouse’s\
    \ location. As you’ve learned, the `shortestPath` function returns an array of\
    \ nodes. Each node has a `row` and `column` property, and we can use that information\
    \ to display a black square sprite on the screen for every node in the array.\n\
    \nHere’s the relevant code from the program’s `setup` function that does this.\
    \ An array called `currentPathSprites` is populated with black square sprites,\
    \ which match the shortest path nodes, each time the mouse pointer is released.\n\
    \n```\n//An array to store the sprites that will be used to display          \
    \        \n//the shortest path                  \ncurrentPathSprites = [];\n\n\
    //The mouse pointer's `release` function runs the code that                  \n\
    //calculates the shortest path and draws that sprites that                  \n\
    //represent it                  \ng.pointer.release = () => {\n\n  //calculate\
    \ the shortest path              \n  let path = shortestPath(\n    getIndex(alien.x,\
    \ alien.y, 64, 64, 13),         //Start map index              \n    getIndex(g.pointer.x,\
    \ g.pointer.y, 64, 64, 13), //End index              \n    wallMapArray,                                   //Map\
    \ array              \n    13,                                             //Map\
    \ width              \n    [2, 3],                                         //Obstacle\
    \ gids              \n    \"manhattan\"                                     //Heuristic\
    \              \n  );\n\n  //Use Hexi's `remove` method to remove any possible\
    \              \n  //sprites in the `currentPathSprites` array              \n\
      g.remove(currentPathSprites);\n\n  //Display the shortest path             \
    \ \n  path.forEach(node => {\n\n    //Figure out the x and y location of each\
    \ square in the path by              \n    //multiplying the node's `column` and\
    \ `row` by the height, in              \n    //pixels, of each square: 64    \
    \          \n    let x = node.column * 64,\n        y = node.row * 64;\n\n    //Create\
    \ the square sprite and set it to the x and y location              \n    //we\
    \ calculated above              \n    let square = g.rectangle(64, 64, \"black\"\
    );\n    square.x = x;\n    square.y = y;\n\n    //Push the sprites into the `currentPath`\
    \ array,              \n    //so that we can easily remove them the next time\
    \              \n    //the mouse is clicked              \n    currentPathSprites.push(square);\n\
      });\n};\n```\n\nJust for completeness, you’ll notice that the code above uses\
    \ a convenience function called `remove` that’s built into the rendering engine.\
    \ Its job is to remove single sprites or any sprites in an array of sprites, from\
    \ the renderer. Here’s the `remove` function that does this work, just in case\
    \ you need to do anything similar in your own programs:\n\n```\nfunction remove(...sprites)\
    \ {\n\n  //Remove sprites that's aren't in an array              \n  if (!(sprites[0]\
    \ instanceof Array)) {\n    if (sprites.length > 1) {\n      sprites.forEach(sprite  =>\
    \ {\n        sprite.parent.removeChild(sprite);\n      });\n    } else {\n      sprites[0].parent.removeChild(sprites[0]);\n\
        }\n  }\n\n  //Remove sprites in an array of sprites              \n  else\
    \ {\n    let spritesArray = sprites[0];\n    if (spritesArray.length > 0) {\n\
          for (let i = spritesArray.length - 1; i >= 0; i--) {\n        let sprite\
    \ = spritesArray[i];\n        sprite.parent.removeChild(sprite);\n        spritesArray.splice(spritesArray.indexOf(sprite),\
    \ 1);\n      }\n    }\n  }\n}\n```\n\nYou can see that as long as you have the\
    \ `shortestPath` array, there are many ways that you can use it. In the examples\
    \ ahead, I’ll show you how you can use it to make a game character walk through\
    \ the maze. But first, let’s look at a topic that I’ve been strategically avoiding\
    \ until now: heuristics.\n\n## Understanding Heuristics\n\nThere will usually\
    \ be more than one shortest path to a destination, as shown in Figure [6-19](#A346816_1_En_6_Chapter.xhtml#Fig19).\n\
    \n![A346816_1_En_6_Fig19_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig19_HTML.jpg)\n\
    \n###### Figure 6-19. All three paths are the same length, but the route they\
    \ choose is different\n\nNone of the paths is any better or worse than the other,\
    \ and they all have the same cost. But each has a unique style. This style depends\
    \ on the heuristic that A* uses to calculate the path.\n\nA **heuristic** is a\
    \ mini-algorithm whose job is to work out distances based on a simple formula.\
    \ Three famous heuristics are often used with A*: Manhattan, Euclidean, and Diagonal.\
    \ Figure [6-20](#A346816_1_En_6_Chapter.xhtml#Fig20) illustrates the different\
    \ paths that each heuristic in the `shortestPath` function produces. Which do\
    \ you prefer?\n\n![A346816_1_En_6_Fig20_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig20_HTML.jpg)\n\
    \n###### Figure 6-20. Different heuristics produce different paths\n\nThe `shortestPath`\
    \ function selects which heuristic to use based on the last argument supplied\
    \ to it.\n\n```\nlet path = shortestPath(\n  getIndex(alien.x, alien.y, 64, 64,\
    \ 13),\n  getIndex(g.pointer.x, g.pointer.y, 64, 64, 13),\n  wallMapArray,\n  13,\n\
      [2, 3],\n  \"manhattan\"          \n);\n```\n\nA `switch` statement in the `while`\
    \ loop finds the value of `H` by delegating the work to whichever heuristic method\
    \ was specified.\n\n```\nlet h;\nswitch (heuristic) {\n  case \"manhattan\":\n\
        h = manhattan(testNode, destinationNode);\n    break;\n\n  case \"euclidean\"\
    :\n    h = euclidean(testNode, destinationNode);\n    break;\n\n  case \"diagonal\"\
    :\n    h = diagonal(testNode, destinationNode);\n    break;\n\n  default:\n    throw\
    \ new Error(\"Oops! It looks like you misspelled the name of the heuristic\");\n\
    }\n```\n\nEach heuristic method calculates the distance between the start and\
    \ end point in different ways. The Manhattan method is simplest. It just adds\
    \ together the rows and columns, and multiplies the sum by the cost. It ignores\
    \ any possible diagonal shortcuts.\n\n```\nlet manhattan = (testNode, destinationNode)\
    \ => {\n  let h\n    = Math.abs(testNode.row - destinationNode.row)\n    * straightCost\
    \ + Math.abs(testNode.column - destinationNode.column)\n    * straightCost;\n\
      return h;\n};\n```\n\nIt’s called Manhattan because if you were walking down\
    \ the streets of New York City (Manhattan island), you wouldn’t be able to take\
    \ a shortcut diagonally through any city block.\n\nIgnoring possible diagonal\
    \ routes makes the Manhattan heuristic fast to process. This is important because\
    \ A* is an extremely CPU-hungry algorithm. If you need to do pathfinding for a\
    \ lot of game characters on each frame, Manhattan will save you some performance\
    \ impact. However, because it doesn’t account for diagonal routes, it may not\
    \ always guarantee the absolute shortest path.\n\nThe Euclidean method uses the\
    \ Pythagorean theorem to calculate the distance.\n\n```\nlet euclidean = (testNode,\
    \ destinationNode) => {\n  let vx = destinationNode.column - testNode.column,\n\
        vy = destinationNode.row - testNode.row,\n    h = Math.floor(Math.sqrt(vx\
    \ * vx + vy * vy) * straightCost);\n  return h;\n};\n```\n\nThe Euclidean method\
    \ does account for diagonals, so it produces a very natural-looking path. However,\
    \ it’s a little slower to process than the Manhattan method because of that hungry\
    \ `Math.sqrt` method.\n\nThe Diagonal method compensates for the costs of moving\
    \ straight across or diagonally, so it ends up with a very accurate cost estimate.\
    \ This means that A* may need to do less searching and produce a faster result,\
    \ and it will definitely produce the shortest possible path.\n\n```\nlet diagonal\
    \ = (testNode, destinationNode) => {\n  let vx = Math.abs(destinationNode.column\
    \ - testNode.column),\n    vy = Math.abs(destinationNode.row - testNode.row),\n\
        h = 0;\n\n  if (vx > vy) {\n    h = Math.floor(diagonalCost * vy + straightCost\
    \ * (vx - vy));\n  } else {\n    h = Math.floor(diagonalCost * vx + straightCost\
    \ * (vy - vx));\n  }\n  return h;\n};\n```\n\nThere’s no one right heuristic to\
    \ use. You just need to decide which produces the kind of path that seems the\
    \ most natural for the game you’re making."
  raw: "###### Figure 6-18. Click anywhere to draw the shortest path\n\nThis program\
    \ works by calculating the shortest path between the alien sprite and the mouse’s\
    \ location. As you’ve learned, the shortestPath function returns an array of nodes.\
    \ Each node has a row and column property, and we can use that information to\
    \ display a black square sprite on the screen for every node in the array.\n\n\
    Here’s the relevant code from the program’s setup function that does this. An\
    \ array called currentPathSprites is populated with black square sprites, which\
    \ match the shortest path nodes, each time the mouse pointer is released.\n\n\
    ```\n//An array to store the sprites that will be used to display            \
    \      \n//the shortest path                  \ncurrentPathSprites = [];\n\n//The\
    \ mouse pointer's `release` function runs the code that                  \n//calculates\
    \ the shortest path and draws that sprites that                  \n//represent\
    \ it                  \ng.pointer.release = () => {\n\n  //calculate the shortest\
    \ path              \n  let path = shortestPath(\n    getIndex(alien.x, alien.y,\
    \ 64, 64, 13),         //Start map index              \n    getIndex(g.pointer.x,\
    \ g.pointer.y, 64, 64, 13), //End index              \n    wallMapArray,                                   //Map\
    \ array              \n    13,                                             //Map\
    \ width              \n    [2, 3],                                         //Obstacle\
    \ gids              \n    \"manhattan\"                                     //Heuristic\
    \              \n  );\n\n  //Use Hexi's `remove` method to remove any possible\
    \              \n  //sprites in the `currentPathSprites` array              \n\
      g.remove(currentPathSprites);\n\n  //Display the shortest path             \
    \ \n  path.forEach(node => {\n\n    //Figure out the x and y location of each\
    \ square in the path by              \n    //multiplying the node's `column` and\
    \ `row` by the height, in              \n    //pixels, of each square: 64    \
    \          \n    let x = node.column * 64,\n        y = node.row * 64;\n\n    //Create\
    \ the square sprite and set it to the x and y location              \n    //we\
    \ calculated above              \n    let square = g.rectangle(64, 64, \"black\"\
    );\n    square.x = x;\n    square.y = y;\n\n    //Push the sprites into the `currentPath`\
    \ array,              \n    //so that we can easily remove them the next time\
    \              \n    //the mouse is clicked              \n    currentPathSprites.push(square);\n\
      });\n};\n```\n\nJust for completeness, you’ll notice that the code above uses\
    \ a convenience function called remove that’s built into the rendering engine.\
    \ Its job is to remove single sprites or any sprites an array of sprites, from\
    \ the renderer. Here’s the remove function that does this work, just in case you\
    \ need to do anything similar in your own programs:\n\n```\nfunction remove(...sprites)\
    \ {\n\n  //Remove sprites that's aren't in an array              \n  if (!(sprites[0]\
    \ instanceof Array)) {\n    if (sprites.length > 1) {\n      sprites.forEach(sprite  =>\
    \ {\n        sprite.parent.removeChild(sprite);\n      });\n    } else {\n      sprites[0].parent.removeChild(sprites[0]);\n\
        }\n  }\n\n  //Remove sprites in an array of sprites              \n  else\
    \ {\n    let spritesArray = sprites[0];\n    if (spritesArray.length > 0) {\n\
          for (let i = spritesArray.length - 1; i >= 0; i--) {\n        let sprite\
    \ = spritesArray[i];\n        sprite.parent.removeChild(sprite);\n        spritesArray.splice(spritesArray.indexOf(sprite),\
    \ 1);\n      }\n    }\n  }\n}\n```\n\nYou can see that as long as you have the\
    \ shortestPath array, there are many ways that you can use it. In the examples\
    \ ahead, I’ll show you how you can use it to make a game character walk through\
    \ the maze. But first, let’s look at a topic that I’ve been strategically avoiding\
    \ until now: heuristics.\n\n## Understanding Heuristics\n\nThere will usually\
    \ be more than one shortest path to a destination, as shown in Figure [6-19](#A346816_1_En_6_Chapter.xhtml#Fig19).\n\
    \n![A346816_1_En_6_Fig19_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig19_HTML.jpg)\n\
    \n###### Figure 6-19. All three paths are the same length, but the route they\
    \ choose is different\n\nNone of the paths is any better or worse than the other,\
    \ and they all have the same cost. But each has a unique style. This style depends\
    \ on the heuristic that A* uses to calculate the path.\n\nA **heuristic** is a\
    \ mini-algorithm whose job is to work out distances based on a simple formula.\
    \ Three famous heuristics are often used with A*: Manhattan, Euclidean, and Diagonal.\
    \ Figure [6-20](#A346816_1_En_6_Chapter.xhtml#Fig20) illustrates the different\
    \ paths that each heuristic in the shortestPath function produces. Which do you\
    \ prefer?\n\n![A346816_1_En_6_Fig20_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig20_HTML.jpg)\n\
    \n###### Figure 6-20. Different heuristics produce different paths\n\nThe shortestPath\
    \ function selects which heuristic to use based on the last argument supplied\
    \ to it.\n\n```\nlet path = shortestPath(\n  getIndex(alien.x, alien.y, 64, 64,\
    \ 13),\n  getIndex(g.pointer.x, g.pointer.y, 64, 64, 13),\n  wallMapArray,\n  13,\n\
      [2, 3],\n  \"manhattan\"          \n);\n```\n\nA switch statement in the while\
    \ loop finds the value of H by delegating the work to whichever heuristic method\
    \ was specified.\n\n```\nlet h;\nswitch (heuristic) {\n  case \"manhattan\":\n\
        h = manhattan(testNode, destinationNode);\n    break;\n\n  case \"euclidean\"\
    :\n    h = euclidean(testNode, destinationNode);\n    break;\n\n  case \"diagonal\"\
    :\n    h = diagonal(testNode, destinationNode);\n    break;\n\n  default:\n    throw\
    \ new Error(\"Oops! It looks like you misspelled the name of the heuristic\");\n\
    }\n```\n\nEach heuristic method calculates the distance between the start and\
    \ end point in different ways. The Manhattan method is simplest. It just adds\
    \ together the rows and columns, and multiplies the sum by the cost. It ignores\
    \ any possible diagonal shortcuts.\n\n```\nlet manhattan = (testNode, destinationNode)\
    \ => {\n  let h\n    = Math.abs(testNode.row - destinationNode.row)\n    * straightCost\
    \ + Math.abs(testNode.column - destinationNode.column)\n    * straightCost;\n\
      return h;\n};\n```\n\nIt’s called Manhattan because if you were walking down\
    \ the streets of New York City (Manhatten island), you wouldn’t be able to take\
    \ a shortcut diagonally through any city block.\n\nIgnoring possible diagonal\
    \ routes makes the Manhattan heuristic fast to process. This is important because\
    \ A* is an extremely CPU-hungry algorithm. If you need to do pathfinding for a\
    \ lot of game characters on each frame, Manhattan will save you some performance\
    \ impact. However, because it doesn’t account for diagonal routes, it may not\
    \ always guarantee the absolute shortest path.\n\nThe Euclidean method uses the\
    \ Pythagorean theorem to calculate the distance.\n\n```\nlet euclidean = (testNode,\
    \ destinationNode) => {\n  let vx = destinationNode.column - testNode.column,\n\
        vy = destinationNode.row - testNode.row,\n    h = Math.floor(Math.sqrt(vx\
    \ * vx + vy * vy) * straightCost);\n  return h;\n};\n```\n\nThe Euclidean method\
    \ does account for diagonals, so it produces a very natural-looking path. However,\
    \ it’s a little slower to process than the Manhattan method because of that hungry\
    \ Math.sqrt method.\n\nThe Diagonal method compensates for the costs of moving\
    \ straight across or diagonally, so it ends up with a very accurate cost estimate.\
    \ This means that A* may need to do less searching and produce a faster result,\
    \ and it will definitely produce the shortest possible path.\n\n```\nlet diagonal\
    \ = (testNode, destinationNode) => {\n  let vx = Math.abs(destinationNode.column\
    \ - testNode.column),\n    vy = Math.abs(destinationNode.row - testNode.row),\n\
        h = 0;\n\n  if (vx > vy) {\n    h = Math.floor(diagonalCost * vy + straightCost\
    \ * (vx - vy));\n  } else {\n    h = Math.floor(diagonalCost * vx + straightCost\
    \ * (vy - vx));\n  }\n  return h;\n};\n```\n\nThere’s no one right heuristic to\
    \ use. You just need to decide which produces the kind of path that seems the\
    \ most natural for the game you’re making."
  trans: "\n###### 图 6-18：点击任意位置绘制最短路径\n\n该程序通过计算外星精灵与鼠标位置之间的最短路径来工作。如你所知，`shortestPath`\
    \ 函数会返回一个节点数组。每个节点都包含 `row`（行）和 `column`（列）属性，我们可以利用这些信息，为数组中的每个节点在屏幕上显示一个黑色方块精灵。\n\
    \n以下是程序中负责此功能的 `setup` 函数的相关代码。每次释放鼠标指针时，一个名为 `currentPathSprites` 的数组就会被填充上与最短路径节点匹配的黑色方块精灵。\n\
    \n```\n// 用于存储显示最短路径的精灵的数组                  \ncurrentPathSprites = [];\n\n// 鼠标指针的\
    \ `release` 函数，运行计算最短路径并绘制代表路径精灵的代码                  \ng.pointer.release = ()\
    \ => {\n\n  // 计算最短路径              \n  let path = shortestPath(\n    getIndex(alien.x,\
    \ alien.y, 64, 64, 13),         // 起始地图索引              \n    getIndex(g.pointer.x,\
    \ g.pointer.y, 64, 64, 13), // 结束索引              \n    wallMapArray,                                   //\
    \ 地图数组              \n    13,                                             // 地图宽度\
    \              \n    [2, 3],                                         // 障碍物 gid\
    \              \n    \"manhattan\"                                     // 启发式算法\
    \              \n  );\n\n  // 使用 Hexi 的 `remove` 方法移除 `currentPathSprites` 数组中任何可能存在的精灵\
    \              \n  g.remove(currentPathSprites);\n\n  // 显示最短路径              \n\
      path.forEach(node => {\n\n    // 通过将节点的 `column` 和 `row` 乘以每个方格的像素高度 (64)  \
    \            \n    // 来计算路径中每个方格的 x 和 y 位置              \n    let x = node.column\
    \ * 64,\n        y = node.row * 64;\n\n    // 创建方块精灵并将其设置为我们上面计算出的 x 和 y 位置  \
    \            \n    let square = g.rectangle(64, 64, \"black\");\n    square.x\
    \ = x;\n    square.y = y;\n\n    // 将精灵推入 `currentPath` 数组，              \n    //\
    \ 以便下次鼠标点击时能够轻松移除它们              \n    currentPathSprites.push(square);\n  });\n\
    };\n```\n\n为完整起见，你会注意到上面的代码使用了一个名为 `remove` 的便捷函数，该函数内置于渲染引擎中。它的作用是从渲染器中移除单个精灵或精灵数组中的任何精灵。以下是执行此工作的\
    \ `remove` 函数，以防你在自己的程序中需要实现类似功能：\n\n```\nfunction remove(...sprites) {\n\n  //\
    \ 移除不在数组中的精灵              \n  if (!(sprites[0] instanceof Array)) {\n    if (sprites.length\
    \ > 1) {\n      sprites.forEach(sprite  => {\n        sprite.parent.removeChild(sprite);\n\
          });\n    } else {\n      sprites[0].parent.removeChild(sprites[0]);\n    }\n\
      }\n\n  // 移除精灵数组中的精灵              \n  else {\n    let spritesArray = sprites[0];\n\
        if (spritesArray.length > 0) {\n      for (let i = spritesArray.length - 1;\
    \ i >= 0; i--) {\n        let sprite = spritesArray[i];\n        sprite.parent.removeChild(sprite);\n\
            spritesArray.splice(spritesArray.indexOf(sprite), 1);\n      }\n    }\n\
      }\n}\n```\n\n你可以看到，只要你拥有 `shortestPath` 数组，就可以通过多种方式使用它。在接下来的示例中，我将向你展示如何利用它让游戏角色穿越迷宫。但首先，让我们看一个我一直策略性回避的话题：启发式算法。\n\
    \n## 理解启发式算法\n\n通常，到达目的地存在不止一条最短路径，如图 6-19 所示。\n\n![A346816_1_En_6_Fig19_HTML.jpg](img/A346816_1_En_6_Fig19_HTML.jpg)\n\
    \n###### 图 6-19。三条路径长度相同，但选择的路线不同\n\n没有哪条路径绝对优于或劣于其他路径，它们都具有相同的代价。但每条路径都有其独特的风格。这种风格取决于\
    \ A* 算法在计算路径时使用的启发式算法。\n\n**启发式算法** 是一种微型算法，其任务是基于一个简单公式来计算距离。有三种著名的启发式算法常用于 A*\
    \ 算法：曼哈顿距离、欧几里得距离和对角线距离。图 6-20 展示了 `shortestPath` 函数中每种启发式算法所产生的不同路径。你更喜欢哪一种？\n\
    \n![A346816_1_En_6_Fig20_HTML.jpg](img/A346816_1_En_6_Fig20_HTML.jpg)\n\n######\
    \ 图 6-20。不同的启发式算法产生不同的路径\n\n`shortestPath` 函数根据传递给它的最后一个参数来选择使用哪种启发式算法。\n\n```\n\
    let path = shortestPath(\n  getIndex(alien.x, alien.y, 64, 64, 13),\n  getIndex(g.pointer.x,\
    \ g.pointer.y, 64, 64, 13),\n  wallMapArray,\n  13,\n  [2, 3],\n  \"manhattan\"\
    \          \n);\n```\n\n在 `while` 循环中的一个 `switch` 语句通过将工作委托给指定的启发式方法来查找 `H` 的值。\n\
    \n```\nlet h;\nswitch (heuristic) {\n  case \"manhattan\":\n    h = manhattan(testNode,\
    \ destinationNode);\n    break;\n\n  case \"euclidean\":\n    h = euclidean(testNode,\
    \ destinationNode);\n    break;\n\n  case \"diagonal\":\n    h = diagonal(testNode,\
    \ destinationNode);\n    break;\n\n  default:\n    throw new Error(\"哎呀！看起来你拼错了启发式算法的名字\"\
    );\n}\n```\n\n每种启发式方法都以不同的方式计算起点和终点之间的距离。曼哈顿方法最为简单。它只是将行数和列数相加，然后将总和乘以代价。它忽略了任何可能的对角线捷径。\n\
    \n```\nlet manhattan = (testNode, destinationNode) => {\n  let h\n    = Math.abs(testNode.row\
    \ - destinationNode.row)\n    * straightCost + Math.abs(testNode.column - destinationNode.column)\n\
        * straightCost;\n  return h;\n};\n```\n\n它之所以被称为曼哈顿，是因为如果你走在纽约市（曼哈顿岛）的街道上，你将无法对角线地穿过任何城市街区抄近路。\n\
    \n忽略可能的对角线路径使得曼哈顿启发式算法的处理速度很快。这很重要，因为 A* 是一个极其消耗 CPU 的算法。如果你需要为每帧中的大量游戏角色进行寻路，曼哈顿算法将有助于减少性能影响。然而，由于它没有考虑对角线路径，可能无法始终保证找到绝对最短的路径。\n\
    \n欧几里得方法使用勾股定理来计算距离。\n\n```\nlet euclidean = (testNode, destinationNode) => {\n\
      let vx = destinationNode.column - testNode.column,\n    vy = destinationNode.row\
    \ - testNode.row,\n    h = Math.floor(Math.sqrt(vx * vx + vy * vy) * straightCost);\n\
      return h;\n};\n```\n\n欧几里得方法确实考虑了对角线，因此它可以生成一条看起来非常自然的路径。然而，由于使用了那个消耗资源的 `Math.sqrt`\
    \ 方法，其处理速度比曼哈顿方法稍慢。\n\n对角线方法补偿了直线移动和对角线移动的代价，因此最终能得到非常准确的成本估算。这意味着 A* 算法可能需要更少的搜索，产生更快的结果，并且肯定能得出可能的最短路径。\n\
    \n```\nlet diagonal = (testNode, destinationNode) => {\n  let vx = Math.abs(destinationNode.column\
    \ - testNode.column),\n    vy = Math.abs(destinationNode.row - testNode.row),\n\
        h = 0;\n\n  if (vx > vy) {\n    h = Math.floor(diagonalCost * vy + straightCost\
    \ * (vx - vy));\n  } else {\n    h = Math.floor(diagonalCost * vx + straightCost\
    \ * (vy - vx));\n  }\n  return h;\n};\n```\n\n没有唯一正确的启发式算法。你只需要决定哪种算法能为你正在制作的游戏生成看起来最自然的路径。\n"
- fmt: "## Rounding Corners\n\nThere’s a potential problem with our current A* algorithm:\
    \ it calculates the shortest path by taking a diagonal shortcut between cells.\
    \ This is accurate, but it poses a problem for maze games. In most maze games,\
    \ you’ll want your characters to walk around the edges of walls, so cutting corners\
    \ diagonally would look strange. Figure [6-21](#A346816_1_En_6_Chapter.xhtml#Fig21)\
    \ illustrates this dilemma.\n\n![A346816_1_En_6_Fig21_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig21_HTML.jpg)\n\
    \n###### Figure 6-21. Maze game paths should usually not cut diagonally around\
    \ corners\n\nThere’s a simple solution to preventing paths from taking diagonal\
    \ shortcuts around corners: just don’t check for any nodes that are diagonally\
    \ adjacent to the current center test node. In the current `surroundingNodes`\
    \ function from the code in our example A* implementation, all eight nodes surrounding\
    \ the current center node are tested:\n\n```\nlet allSurroundingNodes = [\n  nodeMap[index\
    \ - mapWidthInTiles - 1],\n  nodeMap[index - mapWidthInTiles],\n  nodeMap[index\
    \ - mapWidthInTiles + 1],\n  nodeMap[index - 1],\n  nodeMap[index + 1],\n  nodeMap[index\
    \ + mapWidthInTiles - 1],\n  nodeMap[index + mapWidthInTiles],\n  nodeMap[index\
    \ + mapWidthInTiles + 1]\n];\n\nlet validSurroundingNodes = allSurroundingNodes.filter(node\
    \ => {/*...*/});\n```\n\nTo prevent diagonals, just test the nodes directly above,\
    \ below, and to the right and left of the center node:\n\n```\nlet crossSurroundingNodes\
    \ = [\n  nodeMap[index - mapWidthInTiles],\n  nodeMap[index - 1],\n  nodeMap[index\
    \ + 1],\n  nodeMap[index + mapWidthInTiles],\n];\n\nlet validSurroundingNodes\
    \ = crossSurroundingNodes.filter(node => {/*...*/});\n```\n\nAnd that’s all there\
    \ is to it!\n\n## Walking the Path\n\nNow that we know how to find a path, we\
    \ need to teach our game characters how to walk along it. You’ll find a working\
    \ example of this in the `walkPath.html` program. Click anywhere in the maze,\
    \ and the alien sprite will take the shortest route to get there. The A* algorithm\
    \ uses the modification we just looked at to allow the path to round corners,\
    \ as shown in Figure [6-22](#A346816_1_En_6_Chapter.xhtml#Fig22).\n\n![A346816_1_En_6_Fig22_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig22_HTML.jpg)\n\
    \n###### Figure 6-22. Click anywhere on the map, and the game character will walk\
    \ there\n\nThis works by using the `shortestPath` function to create a new 2D\
    \ array of x/y points. These points are called **way points**. Each way point\
    \ represents the x/y location of each node in the path. Those points are then\
    \ used to tell the sprite which direction to move in. Let’s look at the code that\
    \ makes all of this work.\n\nFirst, the `setup` function defines the pointer’s\
    \ `release` method. It captures the pointer’s x and y position in two new variables\
    \ called `destinationX` and `destinationY`. It also sets a Boolean variable called\
    \ `calculateNewPath` variable to `true` to flag that a new path should be calculated\
    \ at the next opportunity. The `setup` function also defines a variable called\
    \ `wayPoints2DArray` that will be used later to store the pairs of x/y way points.\n\
