- fmt: '### Hexi and Ga


    Most of the source code in this book has been written using a minimalist 2D HTML5
    game engine called Hexi. It’s been designed, by me, as a tool for making the widest
    possible range of games while writing the least amount of code. You can find out
    all you need to know about Hexi, including detailed tutorials and examples, here:


    ```

    github.com/kittykatattack/hexi

    ```


    If you have any questions about the specific implementation of the code in this
    book, refer to that link. (The source code in this book is based on `Hexi` v.0.1).


    Hexi also has a little sister, called Ga.


    ```

    github.com/kittykatattack/ga

    ```


    Ga’s API is the same as Hexi’s but the code base is almost 10 times smaller. How
    is that possible? Because it uses an extremely lightweight canvas-based renderer,
    without WebGL. In fact, Ga was specifically written so that its core could compress
    down to less than 6.5k, making it an appropriate tool to use to for micro-gaming
    competitions, like the annual JS13K event (`js13kgames.com`). It’s also a great
    way to learn about low-level graphics rendering, without having to deal with the
    often unnecessary complexities of WebGL.


    If you want to know the inner details of how Hexi or Ga works, or want to build
    your own custom game engine from scratch, you’ll find everything you need to know
    in this book’s companion, *Advanced Game Design with HTML5 and JavaScript*. Ga
    is really just a production-grade version of the code developed in that book.
    And Hexi is just an implementation of the same API with a PixiJS-based (WebGL)
    renderer running under-the-hood.


    ### The Source Code


    You’ll find all the source code for this book here:


    ```

    github.com/kittykatattack/agdt

    ```


    The code is organized into chapters. Just clone the repository, launch a web server
    in the root directory, and open the examples in your favorite browser.


    All the example code has been written in the latest version current of JavaScript:
    ES6/7 (also known as JavaScript 2016/17). This code was written at a time when
    these standards were so new that no browser vendor had yet fully implemented them.
    If you’re in that same position, I suggest you use a JavaScript ES6 transpiler,
    like Babel (`babeljs.io`) to compile the ES6 source code into production-ready
    ES5. In all the source code example files, you’ll find a folder called `src` that
    contains the ES6 source, and a folder called `bin`, which contains the transpiled
    ES5.


    © Rex van der Spuy 2017


    Rex van der Spuy, *The Advanced Game Developer''s Toolkit*, 10.1007/978-1-4842-1097-0_2


    ## 2. Using Tiled Editor


    Rex van der Spuy^(1 )


    (1)Toronto, Ontario, Canada


    If there’s only one piece of software that every game developer should learn how
    to use, it’s Tiled Editor (`www.mapeditor.org`). Tiled Editor is an industry-standard
    open source application that lets you easily create a visually complex layout,
    and then export that layout as a JSON data file that you use to build your game
    world. Because Tiled Editor just outputs data, it works just as well for making
    games with any technology, like C#, Java, or Objective-C, as it does for JavaScript.
    And it’s not just for games – you can use it whenever you need to design a complex
    layout that would be difficult or time consuming to describe with code.


    In this chapter we’re going to take a detailed look at how to use Tiled Editor
    so that you can start using it with your own projects quickly. You’ll find out
    how to:


    - Prepare your source images.

    - Configure Tiled Editor.

    - Use Layers and Objects.

    - Understand the JSON data output.

    - Import the JSON data into your game code and use it to create sprites.

    - Create a camera to follow a game character around a large scrolling game world.


    The small effort that it takes to learn how use Tiled Editor and import its data
    is well worth the massive productivity boost it will give you.


    We’re going learn how to use Tile Editor by making a useful little RPG (Role Playing
    Game) engine, shown in Figure 2-1. Run the `fantasy.html` file in the chapter’s
    source files to try out the finished prototype. Use the arrow keys to walk the
    elf character around the world and collect three items: a heart, a skull, and
    a marmot (which is kind of like a fat, furry Guinea pig).


    ![A346816_1_En_2_Fig1_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig1_HTML.jpg)


    ###### Figure 2-1. Help the elf collect items in the game world


    All the game objects are correctly depth layered, and although the walls, trees,
    and bushes block the elf’s path, he can walk around them as if it were a real
    3D space. Creating a complex layout like this would be quite difficult if you
    were plotting the positions and depths of the objects using pure code – so this
    is the perfect job for Tiled Editor!


    ### Choosing Your Images


    The first place to start is with a tileset that contains the graphics for your
    game.


    ###### Note

    Tilesets, also known as spritesheets, are just single images that contain all
    your game images as sub-images.


    You’ll need to create your game graphics using a graphics editor like Illustrator,
    Pixelmator, Photoshop, Gimp, or Piskel and then package them with a tool like
    Shoebox or Texture Packer.


    The entire scrolling game world was built using only the small handful of images
    shown in Figure 2-2. The finished game world looks complex, but it only took a
    few minutes to snap together using this tileset. Most of the sprite images are
    64 x 64 pixels, but the smaller ones on the top right are 32x32. The big tree
    is 128x128 pixels. You can mix and match sprites images of any sizes, although
    you’ll make life much easier for yourself if you keep them to sizes that are powers
    of 2 (`8x8`, `16x16`, `32x32`, etc.).


    ![A346816_1_En_2_Fig2_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig2_HTML.jpg)


    ###### Figure 2-2. Start with a tileset


    You can see that the tileset contains all the sprites in the level except for
    one: the elf character. That’s because we’re going to add the animated elf later
    – directly in our game code. (You’ll see how in the steps ahead).


    ### Making a Map


    A **map** is the name that Tiled Editor gives to the game screen layout that you’re
    creating. It’s just a rectangular grid of cells. The game map that we’re creating
    in this chapter is a 24 by 24 grid of cells, with each cell being 32 pixels wide
    and high. That means the entire map has a width and height of 768 pixels.


    To create a new map in Tiled Editor, select File ➤ New from the menu. The New
    Map dialogue box will appear to let you set the map’s properties, as shown in
    Figure 2-3. Select **orthogonal** orientation for a flat, 2D map. Choose CSV layer
    format so that the map information will be output as arrays. Also, keep the Tile
    render order’s default value of Right Down. Then set the width and height of the
    map, in tiles, and then define the width and height of each tile. If you have
    a tileset with different sized images, set the tile height and width to the size
    of the *smallest* image. In this example, the smallest images on the tileset are
    32x32 pixels. Select OK when you’re done.


    ![A346816_1_En_2_Fig3_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig3_HTML.jpg)


    ###### Figure 2-3. Set the map properties'
