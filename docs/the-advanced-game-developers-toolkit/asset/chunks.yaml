  trans: "\n###### 图 5-5. 查找方向名称\n\n如果怪物不在地图中符合这些条件的位置，它们就会继续沿当前方向移动。\n\n判断怪物当前所处的地图位置类型很容易。如果\
    \ `validDirections` 数组中没有元素，就说明该精灵被困住了。\n\n```\nlet trapped = validDirections.length\
    \ === 0;\n```\n\n如果 `validDirections` 数组中只有一个元素，就说明精灵处于死胡同中。\n\n```\nlet inCulDeSac\
    \ = validDirections.length === 1;\n```\n\n这些都很简单，但现在我们如何判断精灵是否处于通道交叉口呢？首先，问问自己：\"\
    什么是通道交叉口？\"仔细观察图 5-5，并思考如果精灵位于任何标记有 X 的地图位置，`validDirections` 数组中可能会包含哪些值。有什么想法吗？没错！通道交叉口总是会包含\
    \ \"left\" 或 \"right\" *以及* \"up\" 或 \"down\"。图 5-6 说明了这一点。\n\n![A346816_1_En_5_Fig6_HTML.jpg](img/A346816_1_En_5_Fig6_HTML.jpg)\n\
    \n###### 图 5-6. 通道交叉口总是包含一个左/右值和一个上/下值\n\n以下是如何用代码表达这一点：\n\n```\nlet up = validDirections.find(x\
    \ => x === \"up\"),\n    down = validDirections.find(x => x === \"down\"),\n \
    \   left = validDirections.find(x => x === \"left\"),\n    right = validDirections.find(x\
    \ => x === \"right\"),\n    atIntersection = (up || down) && (left || right);\n\
    ```\n\n如果 `atIntersection` 为 `true`，就说明精灵位于标记有 X 的通道交叉口之一。很简单！\n\n现在我们已经知道如何判断精灵是被困住、处于死胡同还是通道交叉口了。那么，让我们把所有这些代码包装成一个更大的函数，名为\
    \ `canChangeDirection`。如果这些条件中的任何一个为真，它将返回 `true`，否则返回 `false`。\n\n```\nfunction\
    \ canChangeDirection(validDirections = []) {\n\n  // 精灵是否在死胡同中。如果 `validDirections`\
    \ 数组中只有一个元素，则为 true                \n  let inCulDeSac = validDirections.length\
    \ === 1;\n\n  // 精灵是否被困住。如果 `validDirections` 数组中没有元素，则为 true                \n\
    \  let trapped = validDirections.length === 0;\n\n  // 精灵是否在通道中。如果精灵位于包含 \"left\"\
    \ 或 \"right\" 以及 \"up\" 或 \"down\" 值的位置，则为 true                \n  let up = validDirections.find(x\
    \ => x === \"up\"),\n      down = validDirections.find(x => x === \"down\"),\n\
    \      left = validDirections.find(x => x === \"left\"),\n      right = validDirections.find(x\
    \ => x === \"right\"),\n      atIntersection = (up || down) && (left || right);\n\
    \n  // 如果精灵可以改变方向，则返回 `true`；否则返回 `false`                \n  return trapped ||\
    \ atIntersection || inCulDeSac;\n}\n```\n\n现在我们已经有办法判断精灵是否位于可以改变方向的地图位置，接下来让我们了解如何为其赋予一个新的随机方向。\n\
    \n#### 选择一个随机方向\n\n既然我们已经知道精灵有哪些有效方向，接下来要做的就是随机选择一个。`randomDirection` 函数会从 `validDirections`\
    \ 数组中随机返回一个字符串：\"up\"、\"left\"、\"right\" 或 \"down\"。如果没有有效方向，则表示精灵四面都被困住了，该函数会返回字符串\
    \ \"trapped\"。以下是实现此功能的 `randomDirection` 函数：\n\n```\nfunction randomDirection(sprite,\
    \ validDirections = []) {\n\n  // `randomInt` 辅助函数返回一个介于最小值和最大值之间的随机整数       \
    \         \n  let randomInt = (min, max) => {\n    return Math.floor(Math.random()\
    \ * (max - min + 1)) + min;\n  };\n\n  // 精灵是否被困住？                \n  let trapped\
    \ = validDirections.length === 0;\n\n  // 如果精灵没有被困住，则随机选择一个有效方向。否则，返回字符串 \"trapped\"\
    \                \n  if (!trapped) {\n    return validDirections[randomInt(0,\
    \ validDirections.length - 1)];\n  } else {\n    return \"trapped\"\n  }\n}\n\
    ```\n\n#### 将方向字符串转换为速度数值\n\n现在我们知道精灵应该朝哪个方向移动了。但是，为了让这个信息能用于移动精灵，我们需要将方向字符串转换为代表精灵速度的数值。一个名为\
    \ `directionToVelocity` 的函数负责完成这项工作：它返回一个包含 `vx` 和 `vy` 属性的对象，这两个属性对应精灵应该移动的方向。\n\
    \n```\nfunction directionToVelocity(direction = \"\", speed = 0) {\n\n  switch\
    \ (direction) {\n    case \"up\":\n      return {\n        vy: -speed,\n     \
    \   vx: 0\n      }\n      break;\n    case \"down\":\n      return {\n       \
    \ vy: speed,\n        vx: 0\n      };\n      break;\n    case \"left\":\n    \
    \  return {\n        vx: -speed,\n        vy: 0\n      };\n      break;\n    case\
    \ \"right\":\n      return {\n        vx: speed,\n        vy: 0\n      };\n  \
    \    break;\n    default:\n      return {\n        vx: 0,\n        vy: 0\n   \
    \   };\n  }\n};\n```\n\n如果怪物的方向是 \"trapped\"，则会触发默认情况，代表怪物速度的 `vx` 和 `vy` 值将为零。\n\
    \n要使精灵移动，请使用这些值更新精灵的速度：\n\n```\nlet velocity = directionToVelocity(monster.direction,\
    \ monster.speed);\nmonster.vx = velocity.vx;\nmonster.vy = velocity.vy;\n```\n\
    \n然后将它们应用到精灵的当前位置：\n\n```\nmonster.x += monster.vx;\nmonster.y += monster.vy;\n\
    ```\n\n这就是让怪物在迷宫中随机移动的方法！\n\n## 追猎外星人\n\n随机移动的怪物是一个好的开始，但对于更具挑战性的游戏，你可能希望怪物主动寻找并追捕玩家角色。运行本章源文件中的\
    \ `closestDirection.html` 文件，查看此类系统的交互式示例，如图 5-7 所示。\n\n![A346816_1_En_5_Fig7_HTML.jpg](img/A346816_1_En_5_Fig7_HTML.jpg)\n\
    \n###### 图 5-7. 怪物总是选择离玩家角色最近的方向\n\n无论它们身在迷宫何处，怪物总是会选择朝更接近玩家角色的方向移动。\n\n### 计算向量\n\
    \n为了实现这一点，你需要知道怪物四个可能方向中哪一个离外星人最近。第一步是在怪物和外星人的中心点之间绘制一条*向量*。向量只是一条不可见的数学线，其众多用途之一就是计算两个精灵之间的距离和角度。向量由两个值\
    \ `vx` 和 `vy` 表示，你可以像这样计算两个精灵之间的向量：\n\n```\nlet vx = spriteTwo.centerX - spriteOne.centerX,\n\
    \    vy = spriteTwo.centerY - spriteOne.centerY;\n```\n\n`vx` 告诉我们对象在 X 轴上的距离。`vy`\
    \ 告诉我们对象在 Y 轴上的距离。`vx` 和 `vy` 变量共同描述了两个对象之间的向量。\n\n向量只是线的一种数学表示——你实际上不会在屏幕上看到它被显示出来。但是，如果你能看到它，它可能看起来有点像图\
    \ 5-8 中两个精灵中心之间那条黑色的对角线。\n\n![A346816_1_En_5_Fig8_HTML.jpg](img/A346816_1_En_5_Fig8_HTML.jpg)\n\
    \n###### 图 5-8. 向量可以帮助你计算两个精灵之间的距离和角度\n\n为了让怪物追猎外星人，我们必须让它朝自身与外星人之间*距离最大*的水平或垂直方向移动。这是为什么呢？看看图\
    \ 5-9。\n\n![A346816_1_En_5_Fig9_HTML.jpg](img/A346816_1_En_5_Fig9_HTML.jpg)\n"
- fmt: "###### Figure 5-9. Move the monster along the axis with the greatest distance\
    \ between the sprites\n\nIt’s obvious that the monster should choose the left\
    \ direction along the X axis if it wants to get closer to the player. However,\
    \ the X axis is also the one with the greatest distance between the objects. Unintuitive,\
    \ but true!\n\nNow that we know this, we can use a simple `if/else` statement\
    \ to tell us which direction is the closest direction to the target: “up,” “down,”\
    \ “left,” or “right.” Here’s a function called `closest` that wraps this all up\
    \ and returns the correct value for us:\n\n```\nlet closest = () => {\n\n  //Plot\
    \ a vector between spriteTwo and spriteOne              \n  let vx = spriteTwo.centerX\
    \ - spriteOne.centerX,\n      vy = spriteTwo.centerY - spriteOne.centerY;\n\n\
    \  //If the distance is greater on the X axis...              \n  if (Math.abs(vx)\
    \ >= Math.abs(vy)) {\n\n    //Try left and right              \n    if (vx <=\
    \ 0) {\n      return \"left\";\n    } else {\n      return \"right\";\n    }\n\
    \  }\n\n  //If the distance is greater on the Y axis...              \n  else\
    \ {\n\n    //Try up and down              \n    if (vy <= 0) {\n      return \"\
    up\"\n    } else {\n      return \"down\"\n    }\n  }\n};\n```\n\nNow let’s find\
    \ out how to integrate this with our existing code.\n\n### Finding the Closest\
    \ Direction\n\nOpen the `closesestDirection.js` file in the chapter’s source files\
    \ and you’ll find this bit of code in the `play` function (the game loop) that’s\
    \ responsible for moving the monsters and choosing their new directions. It’s\
    \ identical to the code we used at the beginning of the chapter, except for step\
    \ number 4.\n\n```\nmonsters.forEach(monster => {\n\n//1\\. Is the monster directly\
    \ centered over a map tile cell?              \n  if (isCenteredOverCell(monster))\
    \ {\n\n//2\\. Yes, it is, so find out which are valid directions to move.    \
    \          \n  //`validDirections` returns an array which can include any    \
    \          \n  //of these string values: \"up\", \"right\", \"down\", \"left\"\
    \ or \"none\"              \n  monster.validDirections = validDirections(\n  \
    \  monster, wallMapArray, 0, world\n  );\n\n//3\\. Can the monster change its\
    \ direction?              \n  if (canChangeDirection(monster.validDirections))\
    \ {\n\n//4\\. If it can, choose the closest direction to the alien           \
    \   \n    monster.direction = closestDirection(monster, alien, monster.validDirections);\n\
    \  }\n\n//5\\. Use the monster's direction and speed to find its new velocity\
    \              \n  let velocity = directionToVelocity(monster.direction, monster.speed);\n\
    \  monster.vx = velocity.vx;\n  monster.vy = velocity.vy;\n}\n\n//6\\. Move the\
    \ monster                  \nmonster.x += monster.vx;\nmonster.y += monster.vy;\n\
    ```\n\nThe only new line of code is this one:\n\n```\nmonster.direction = closestDirection(monster,\
    \ alien, monster.validDirections);\n```\n\nA new function called `closestDirection`\
    \ does the job of figuring out and returning one of the monster’s valid directions\
    \ that’s closest to the alien. If there are no valid directions that match the\
    \ closest direction, it falls back on selecting a random direction. Here’s the\
    \ complete `closestDirection` function that does all this:\n\n```\nfunction closestDirection(spriteOne,\
    \ spriteTwo, validDirections = []) {\n\n//A helper function to find the closest\
    \ direction              \n  let closest = () => {\n\n//Plot a vector between\
    \ spriteTwo and spriteOne              \n    let vx = spriteTwo.centerX - spriteOne.centerX,\n\
    \        vy = spriteTwo.centerY - spriteOne.centerY;\n\n//If the distance is greater\
    \ on the X axis...              \n    if (Math.abs(vx) >= Math.abs(vy)) {\n\n\
    //Try left and right              \n      if (vx <= 0) {\n        return \"left\"\
    ;\n      } else {\n        return \"right\";\n      }\n    }\n\n//If the distance\
    \ is greater on the Y axis...              \n    else {\n\n//Try up and down \
    \             \n      if (vy <= 0) {\n        return \"up\"\n      } else {\n\
    \        return \"down\"\n      }\n    }\n  };\n\n//The closest direction that's\
    \ also a valid direction              \n  let closestValidDirection = validDirections.find(x\
    \ => x === closest());\n\n//The `randomInt` helper function returns a random \
    \             \n  //integer between a minimum and maximum value              \n\
    \  let randomInt = (min, max) => {\n    return Math.floor(Math.random() * (max\
    \ - min + 1)) + min;\n  };\n\n//Is the sprite trapped?              \n  let trapped\
    \ = validDirections.length === 0;\n\n//If the sprite isn't trapped, choose the\
    \ closest direction              \n  //from the `validDirections` array. If there's\
    \ no closest valid              \n  //direction, then choose a valid direction\
    \ at random              \n  if (!trapped) {\n    if (closestValidDirection) {\n\
    \      return closestValidDirection;\n    } else {\n      return validDirections[randomInt(0,\
    \ validDirections.length - 1)];\n    }\n  } else {\n    return \"trapped\"\n \
    \ }\n}\n```\n\nThis function works by first plotting a vector between the two\
    \ sprites, and then figuring out which direction would be the closest for `spriteOne`,\
    \ the hunter, to reach `spriteTwo`, the target. The code checks whether that direction\
    \ is also in the `validDirections` array. If it is, that closest direction is\
    \ chosen, but if it isn’t, a new random direction is chosen.\n\nThis system works\
    \ well but there’s a small problem with it: the monsters know which direction\
    \ is the closest to the alien even if their sight is blocked by maze walls. Maybe\
    \ the monsters are using sound to detect the alien’s position, communicating telepathically,\
    \ or, unlikely, they’re just really smart? Aesthetically this system works – it\
    \ looks correct and makes for a challenging game. But you might want to create\
    \ a game where the monsters will only react if they can actually *see* the alien,\
    \ unobstructed by walls. We can implement this feature by using an essential game\
    \ design technique called **line of sight**.\n\n## Line of Sight\n\nHow can you\
    \ tell whether a sprite can see another sprite? Plot a vector between two sprites\
    \ and then check for obstructions at evenly spaced points along that vector. If\
    \ the vector is completely unobstructed, then you know you have a direct line\
    \ of sight between two sprites.\n\nRun the `lineOfSight.html` file in this chapter’s\
    \ source files for an interactive example, shown in Figure [5-10](#A346816_1_En_5_Chapter.xhtml#Fig10).\
    \ Drag and drop the alien, monster, and wall sprites in various combinations around\
    \ the screen. A red line extends between the monster and the alien, which represents\
    \ the line of sight. If the line of sight is unobstructed, the line between the\
    \ sprites darkens and the monster opens its mouth.\n\n![A346816_1_En_5_Fig10_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig10_HTML.jpg)\n\
    \n###### Figure 5-10. Check for a line of sight between two sprites\n\nThe way\
    \ this works is that a series of points are invisibly placed along the vector\
    \ (the line) between the two sprites. If any of those points touches a box, then\
    \ you know that the line of sight is being obstructed. If none of those points\
    \ touch any of the boxes, then there’s a clear line of sight between the sprites.\
    \ Figure [5-11](#A346816_1_En_5_Chapter.xhtml#Fig11) illustrates this.\n\n![A346816_1_En_5_Fig11_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig11_HTML.jpg)\n\
    \n###### Figure 5-11. Plot points along the line and check each point for a collision\
    \ with a box\n\nLet’s go a on step-by-step tour of the code you need to write\
    \ to make this work."
