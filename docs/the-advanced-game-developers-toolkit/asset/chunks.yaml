          return shortestPath;\n    }\n\n//Sort the open list according to final cost\
    \              \n    openList = openList.sort((a, b) => a.f - b.f);\n\n//Set the\
    \ node with the lowest final cost as the new centerNode              \n    centerNode\
    \ = openList.shift();\n\n//The `while` loop ends here              \n  }\n\n//Now\
    \ that we have all the candidates, let's find the shortest path!             \
