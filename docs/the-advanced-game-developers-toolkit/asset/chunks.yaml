- fmt: "### Finding the Valid Directions\n\nThe `validDirections` function analyzes\
    \ the map environment that the sprite is currently in, and returns an array of\
    \ strings with all possible valid directions that the sprite can move in.\n\n\
    ```\nmonster.validDirections = validDirections(\n  monster,       //The sprite\
    \            \n  wallMapArray,  //The tile map array            \n  0,       \
    \      //The gid value that represents an empty tile            \n  world    \
    \      //The world object. It needs these properties:            \n          \
    \       //`tilewidth`, `tileheight` and `widthInTiles`            \n);\n```\n\n\
    The array that `validDirections` returns can include any of these five string\
    \ values: `\"up\"`, `\"down\"`, `\"left\"`, `\"right\"`, or `\"none\"`. How it\
    \ figures this out is quite interesting, so let’s first take a look at the entire\
    \ `validDirections` function, and then I’ll walk you through how it works, step\
    \ by step.\n\n```\nfunction validDirections(sprite, mapArray, validGid, world)\
    \ {\n\n  //Get the sprite's current map index position number              \n\
    \  let index = g.getIndex(\n    sprite.x,\n    sprite.y,\n    world.tilewidth,\n\
    \    world.tileheight,\n    world.widthInTiles\n  );\n\n  //An array containing\
    \ the index numbers of tile cells              \n  //above, below and to the left\
    \ and right of the sprite              \n  let surroundingCrossCells = (index,\
    \ widthInTiles) => {\n    return [\n      index - widthInTiles,  //Cell above\
    \              \n      index - 1,             //Cell to the left             \
    \ \n      index + 1,             //Cell to the right              \n      index\
    \ + widthInTiles,  //Cell below              \n    ];\n  };\n\n  //Get the index\
    \ position numbers of the 4 cells to the top, right, left              \n  //and\
    \ bottom of the sprite              \n  let surroundingIndexNumbers = surroundingCrossCells(index,\
    \ world.widthInTiles);\n\n  //Find all the tile gid numbers that match the surrounding\
    \ index numbers              \n  let surroundingTileGids = surroundingIndexNumbers.map(index\
    \ => {\n    return mapArray[index];\n  });\n\n  //`directionList` is an array\
    \ of 4 string values that can be either              \n  //\"up\", \"left\", \"\
    right\", \"down\" or \"none\", depending on              \n  //whether there is\
    \ a cell with a valid gid that matches that direction              \n  let directionList\
    \ = surroundingTileGids.map((gid, i) => {\n\n    //The possible directions   \
    \           \n    let possibleDirections = [\"up\", \"left\", \"right\", \"down\"\
    ];\n\n    //If the direction is valid, choose the matching string            \
    \  \n    //identifier for that direction. Otherwise, return \"none\"         \
    \     \n    if (gid === validGid) {\n      return possibleDirections[i];\n   \
    \ } else {\n      return \"none\";\n    }\n  });\n\n  //We don't need \"none\"\
    \ in the list of directions, so              \n  //let's filter it out (it’s just\
    \ a placeholder)              \n  let filteredDirectionList = directionList.filter(direction\
    \ => direction != \"none\");\n\n  //Return the filtered list of valid directions\
    \              \n  return filteredDirectionList;\n}\n```\n\nNow let’s find out\
    \ how this actually works!\n\n### The Tiles Surrounding the Sprite\n\nThe first\
    \ thing the `validDirections` function does is to figure out which map tiles are\
    \ surrounding the sprite. A function called `surroundingCrossCells` uses the sprite’s\
    \ index number in the map array to figure this out. It returns an array of four\
    \ map index numbers that represent the cells above, to the left, to the right,\
    \ and below the sprite.\n\n```\nlet surroundingCrossCells = (index, widthInTiles)\
    \ => {\n  return [\n    index - widthInTiles,  //Cell above                \n\
    \    index - 1,             //Cell to the left                \n    index + 1,\
    \             //Cell to the right                \n    index + widthInTiles, \
    \ //Cell below                \n  ];\n};\n\nlet surroundingIndexNumbers =\n  surroundingCrossCells(index,\
    \ world.widthInTiles);\n```\n\nFigure [5-2](#A346816_1_En_5_Chapter.xhtml#Fig2)\
    \ illustrates where these cells are in relation to the sprite, and their matching\
    \ map array index numbers. In this example there are 11 cells in each row of this\
    \ maze and the monster sprite’s position index number is 38. The map array index\
    \ numbers surrounding the sprite, starting at the top and going clockwise, are\
    \ 27, 39, 49, and 37.\n\n![A346816_1_En_5_Fig2_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig2_HTML.jpg)\n\
    \n###### Figure 5-2. Find the cells surrounding the sprite\n\nWe now have an array\
    \ called `surroundingIndexNumbers` that tells us the index numbers of the cells\
    \ around the sprite. But that’s not enough information; we also need to know what\
    \ gid values of those cells are, so that we know what kind of tiles they contain.\
    \ Remember, we want to allow the sprite to move to empty tiles, but prevent it\
    \ from moving to wall tiles. So the next step is then to use those index numbers\
    \ to find out exactly which tile sprites are at those locations. Let’s map the\
    \ `surroundingIndexNumbers` to a new array that tells us the actual gid numbers\
    \ of those cells. Here’s how:\n\n```\nlet surroundingTileGids = surroundingIndexNumbers.map(index\
    \ => {\n  return mapArray[index];\n});\n```\n\nFor example, the index numbers\
    \ from Figure [5-2](#A346816_1_En_5_Chapter.xhtml#Fig2), 27, 39, 49, and 35 would\
    \ now map to a new array containing the following gid values: 0, 0, 2, and 0.\
    \ The number 0 represents an empty cell, and the number 2 represents a wall. Figure\
    \ [5-3](#A346816_1_En_5_Chapter.xhtml#Fig3) illustrates this.\n\n![A346816_1_En_5_Fig3_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig3_HTML.jpg)\n\
    \n###### Figure 5-3. Find out what kinds of tiles are in the surrounding cells\
    \ by getting their gid numbers\n\n### The Valid Directions\n\nThe next step is\
    \ to give direction names, as strings, to each of the four possible directions\
    \ that the sprite can move to. The direction names can be any of the following:\
    \ `\"up\"`, `\"left\"`, `\"right\"`, `\"down\"`, or `\"none\"`. The following\
    \ bit of code maps our `surroundingTileGids` array to a new array called `directionList`,\
    \ which contains these direction strings.\n\n```\nlet directionList = surroundingTileGids.map((gid,\
    \ i) => {\n\n  //The possible directions                \n  let possibleDirections\
    \ = [\"up\", \"left\", \"right\", \"down\"];\n\n  //If the direction is valid,\
    \ choose the matching string                \n  //identifier for that direction.\
    \ Otherwise, return \"none\"                \n  if (gid === validGid) {\n    return\
    \ possibleDirections[i];\n  } else {\n    return \"none\";\n  }\n});\n```\n\n\
    Any gid that isn’t valid is given the direction name `\"none\"`. Figure [5-4](#A346816_1_En_5_Chapter.xhtml#Fig4)\
    \ illustrates the resulting array produced by the `directionList` function.\n\n\
    ![A346816_1_En_5_Fig4_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig4_HTML.jpg)\n\n\
    ###### Figure 5-4. Find the direction names\n\nWe don’t actually need the `\"\
    none\"` value, so let’s filter it out (it’s just acting as a placeholder):\n\n\
    ```\nlet filteredDirectionList = directionList.filter(direction => {\n  return\
    \ direction != \"none\"\n});\n```\n\n`filteredDirectionList` is now our final\
    \ array, which contains all the valid directions in which the sprite can move:\n\
    \n```\n[\"up\", \"left\", \"right\"]\n```\n\n(Or, if the sprite is completely\
    \ trapped on all sides, this array will be empty – but we’ll get to that!)\n\n\
    This array is returned by the `validDirections` function, which completes the\
    \ first major step in the pathfinding process.\n\n### Can the Monster Change Direction?\n\
    \nThere are actually only certain places on the map where the monsters should\
    \ change their directions.\n\n*   When they’re in a passage intersection.\n* \
    \  If they’re in a cul-de-sac (a dead end).\n*   Or if they’re trapped by walls\
    \ on all four sides (in which case they should stop moving completely).\n\nThe\
    \ X’s in Figure [5-5](#A346816_1_En_5_Chapter.xhtml#Fig5) mark where these three\
    \ map conditions are in the maze we’re using.\n\n![A346816_1_En_5_Fig5_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig5_HTML.jpg)"
