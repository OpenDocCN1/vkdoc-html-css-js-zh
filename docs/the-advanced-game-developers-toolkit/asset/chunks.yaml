- fmt: "### Figure 3-7. Three map layers in Tiled Editor\n\nThe `setup` function grabs\
    \ a reference to the alien layer’s data array like this:\n\n```\nalienMapArray\
    \ = world.getObject(\"alienLayer\").data;\n```\n\nThen, after the alien’s position\
    \ is changed each frame in the game loop, `updateMap` is called to update the\
    \ alien’s position in the array.\n\n```\nalienMapArray = updateMap(alienMapArray,\
    \ alien, world);\n```\n\nThis means that the `alienMapArray` will always contain\
    \ the current position of the alien.\n\nThe bomb’s positions are updated in a\
    \ `forEach` loop. After the loop runs, the `updateMap` function is used to update\
    \ the `bombMapArray` with each bomb’s new location. Here’s the code that does\
    \ this:\n\n```\nbombSprites.forEach(bomb => {\n\n//`atXEdge` and `atYEdge` will\
    \ return `true` or `false` depending on whether or                  \n//not the\
    \ sprite is at the edges of the canvas                  \nlet atXEdge = (sprite,\
    \ container) => {\n  return (sprite.x === 0 || sprite.x + sprite.width === container.width)\n\
    }\nlet atYEdge = (sprite, container) => {\n  return (sprite.y === 0 || sprite.y\
    \ + sprite.width === container.height)\n}\n\n//Change the bomb's direction if\
    \ it's at a map grid column or row                  \nif (Math.floor(bomb.x) %\
    \ world.tilewidth === 0\n&& Math.floor(bomb.y) % world.tileheight === 0)\n{\n\n\
    \  //If the bomb is at the edge of the canvas,              \n  //reverse its\
    \ velocity to keep it inside              \n  if (atXEdge(bomb, g.canvas)) {\n\
    \    bomb.vx = -bomb.vx;\n  }\n  else if (atYEdge(bomb, g.canvas)) {\n    bomb.vy\
    \ = -bomb.vy;\n  }\n\n  //If the bomb is inside the canvas, give it a new random\
    \ direction              \n  else {\n    changeDirection(bomb);\n  }\n}\n\n//Move\
    \ the bomb                  \nbomb.x += bomb.vx;\nbomb.y += bomb.vy;\n});\n```\n\
    \n`bombMapArray` will now contain a current record of the position of the bombs\
    \ for this frame. You’ll notice in the code above that a function called `changeDirection`\
    \ is called whenever a bomb is centered over a grid cell – let’s find out how\
    \ that works next.\n\n### Giving the Bombs a Random Direction\n\nThe bombs only\
    \ change direction if they’re aligned to a grid row or column. And, the bombs\
    \ can’t change direction if they’re at the edges of the canvas, which prevents\
    \ them from generating invalid array index numbers. Here’s the `changeDirection`\
    \ function, which is called whenever these conditions are met.\n\n```\n//Change\
    \ direction helper function                  \nfunction changeDirection(sprite)\
    \ {\n  let up = 1,\n    down = 2,\n    left = 3,\n    right = 4,\n    direction\
    \ = g.randomInt(1, 4);\n\n  switch (direction) {\n    case right:\n      sprite.vx\
    \ = 2;\n      sprite.vy = 0;\n      break;\n\n    case left:\n      sprite.vx\
    \ = -2;\n      sprite.vy = 0;\n      break;\n\n    case up:\n      sprite.vx =\
    \ 0;\n      sprite.vy = -2;\n      break;\n\n    case down:\n      sprite.vx =\
    \ 0;\n      sprite.vy = 2;\n      break;\n  }\n}\n```\n\nThis is just a very simple\
    \ switch statement that changes the velocity of the sprite to match its randomly\
    \ assigned direction.\n\n### Collision Detection\n\nIf you take a snapshot of\
    \ the `alienMapArray` or `bombMapArray` at any time, you’ll see that their contents\
    \ match the locations of the sprites on the canvas, as shown in Figure [3-8](#A346816_1_En_3_Chapter.xhtml#Fig8).\n\
    \n![A346816_1_En_3_Fig8_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig8_HTML.gif)\n\
    \n###### Figure 3-8. Update the sprite’s map locations in real time\n\nThe collisions\
    \ are detected by comparing these two arrays. The code loops through the `bombMapArray`\
    \ and checks whether the `gid` of each index position is `5`. If it is, and the\
    \ `alienMapArray` has a `4` at the same index number, then there’s a collision.\
    \ The code then filters out any bomb sprites at that location. (There might be\
    \ more than one bomb at that same location). When it finds a match, the bomb is\
    \ cleared from the map and the sprite is removed.\n\n```\nbombMapArray.forEach((gid,\
    \ index) => {\n\n  //Does the alien have the same index number as a bomb?    \
    \          \n  if (alienMapArray[index] === 4 && gid === 5) {\n\n    //Yes, so\
    \ filter out any bomb sprites at this location              \n    //(there might\
    \ be more than one)              \n    bombSprites = bombSprites.filter(bomb =>\
    \ {\n      if (bomb.index === index) {\n\n        //Remove the bomb gid number\
    \ from the array              \n        bombMapArray[bomb.index] = 0;\n\n    \
    \    //Remove the bomb from the `bombLayer` group              \n        g.remove(bomb);\n\
    \        return false;\n      } else {\n        return true;\n      }\n    });\n\
    \  }\n});\n```\n\nSo far all these examples have shown you how to check for collisions\
    \ by using the center points of sprites. But for many games you’ll need a little\
    \ more precision. Let’s find out how to make our collision detection a little\
    \ more accurate.\n\n## Using Corner Points\n\nA limitation in our collision system\
    \ so far is that we’re only using the sprite’s center x/y point to figure out\
    \ its map array location.\n\n```\nsprite.index = getIndex\n  sprite.centerX, sprite.centerY,\n\
    \  world.tilewidth, world.tileheight, world.widthInTiles\n);\n```\n\nThat means\
    \ that even if the sprite is part way into the next cell, `getIndex` won’t detect\
    \ that its location has changed. It will only detect a change if the sprite’s\
    \ center point crosses the cell boundary. You can see in Figure 8-9 that even\
    \ though the alien is touching the bomb, a collision isn’t detected until the\
    \ center of the alien enters the bomb’s cell. See Figure [3-9](#A346816_1_En_3_Chapter.xhtml#Fig9).\n\
    \n![A346816_1_En_3_Fig9_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig9_HTML.jpg)\n\
    \n###### Figure 3-9. The sprite’s center point is used to figure out its map location\n\
    \nThis might not be a problem, and in fact the effect seems completely natural\
    \ in this example. But for many kinds of collisions you’ll want to use the exact\
    \ edges of a sprite as the collision boundary. This is important for collisions\
    \ with things where there should be no overlap at all, such as with walls, or\
    \ for things were there should be an immediate reaction, like with fire.\n\nSo\
    \ how can you figure out whether the edge of a sprite is in a new map location?\
    \ Don’t use the center point. Instead, use each of the sprite’s 4 corner points.\
    \ Figure [3-10](#A346816_1_En_3_Chapter.xhtml#Fig10) shows where these four corner\
    \ points are.\n\n![A346816_1_En_3_Fig10_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig10_HTML.gif)\n\
    \n###### Figure 3-10. For more precision, check the locations of the sprite’s\
    \ 4 corners\n\nIt’s easy to calculate these. Use a `getPoints` function to calculate\
    \ and return an object that contains the x/y coordinates of these four points.\
    \ `getPoints` takes one argument: the sprite for which you find the corner points.\
    \ It returns an object with four sub-object properties that tell you the x and\
    \ y positions of the sprite’s corners: `topLeft`, `topRight`, `bottomLeft`, and\
    \ `bottomRight`.\n\n```\nfunction getPoints(s) {\n  return {\n    topLeft: {x:\
    \ s.x, y: s.y},\n    topRight: {x: s.x + s.width - 1, y: s.y},\n    bottomLeft:\
    \ {x: s.x, y: s.y + s.height - 1},\n    bottomRight: {x: s.x + s.width - 1, y:\
    \ s.y + s.height - 1}\n  };\n}\n```\n\n(The bottom and left corner points are\
    \ 1 pixel less than the sprite’s width and height so that the points remain inside\
    \ the sprite, and not outside it)."
