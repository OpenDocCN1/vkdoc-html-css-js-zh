  trans: "\n### 计算向量\n\n第一步是在两个精灵的中心之间绘制一个向量。\n\n```\nlet vx = spriteTwo.centerX -\
    \ spriteOne.centerX,\n    vy = spriteTwo.centerY - spriteOne.centerY;\n```\n\n\
    接下来，我们需要找出这个向量的长度（以像素为单位）。向量的长度称为其**模长**，你可以通过以下方式计算：\n\n```\nlet magnitude =\
    \ Math.sqrt(vx * vx + vy * vy);\n```\n\n我们希望沿着这个向量在等间距的位置上绘制点。为了帮助我们实现这一点，我们创建一个名为\
    \ `segment` 的变量，用于确定每个点之间的距离。\n\n```\nlet segment = spriteOne.width;\n```\n\n\
    通常，你不希望点之间的间距小于最小精灵的宽度或高度。这是因为如果点之间的间距过大，碰撞检测可能会跳过并错过较小的障碍物精灵。\n\n现在，既然我们知道了两个精灵之间向量的长度，也知道了碰撞点之间每个线段的长度，就可以计算出需要沿这条线使用多少个碰撞点了。\n\
    \n```\nlet numberOfPoints = magnitude / segment;\n```\n\n例如，如果向量的模长是 256 像素，每个线段的长度是\
    \ 64 像素，那么 `numberOfPoints` 的值就是 4。\n\n### 查找碰撞点的位置\n\n现在我们有足够的信息来计算沿向量分布的碰撞点的\
    \ x/y 坐标。我们将借助一个名为 `points()` 的函数来实现这一点，该函数返回一个包含具有 `x` 和 `y` 属性的对象的数组。我们将使用这个点对象数组来测试每个点与障碍物之间是否发生碰撞。以下是创建点对象数组的\
    \ `points()` 函数：\n\n```\nlet points = () => {\n\n  // 初始化一个数组，用于存储所有沿向量分布的点  \
    \            \n  let arrayOfPoints = [];\n\n  // 为向量的每个线段创建一个点对象，并           \
    \   \n  // 将其 x/y 坐标及其在地图数组中的索引编号存储起来              \n  for (let i = 1; i <= numberOfPoints;\
    \ i++) {\n\n    // 计算本次循环迭代中的新模长              \n    let newMagnitude = segment\
    \ * i;\n\n    // 计算单位向量              \n    let dx = vx / magnitude,\n        dy\
    \ = vy / magnitude;\n\n    // 使用单位向量和 newMagnitude 计算出本循环迭代中              \n \
    \   // 下一个点的 x/y 坐标              \n    let x = spriteOne.centerX + dx * newMagnitude,\n\
    \        y = spriteOne.centerY + dy * newMagnitude;\n\n    // 将一个包含 x 和 y 属性的点对象推入\
    \ `arrayOfPoints`              \n    arrayOfPoints.push({x, y});\n  }\n\n  //\
    \ 返回点对象数组              \n  return arrayOfPoints;\n};\n```\n\n`points()` 函数的核心是一个循环，该循环为\
    \ `numberOfPoints` 指定的点数创建点对象。循环首先将循环索引值乘以 `segment` 的值，创建一个 `newMagnitude` 值。\n\
    \n```\nlet newMagnitude = segment * i;\n```\n\n如果有四个点，且每个线段的宽度为 64 像素，那么随着循环的每次迭代，`newMagnitude`\
    \ 的值将依次为 64、128、192 和 256。\n\n接下来的两行代码计算出单位向量，用变量名 `dx` 和 `dy` 表示。\n\n```\nlet\
    \ dx = vx / magnitude,\n    dy = vy / magnitude;\n```\n\n单位向量（也称为归一化向量）仅仅是精灵之间主向量的一个微小平移缩放版本，其长度小于一个像素。它指向与主向量相同的方向，但由于它是向量可能的最小尺寸，我们可以用它来创建不同长度的新向量。\n\
    \n你可以在本书的配套资料《使用 HTML5 和 JavaScript 进行高级游戏设计》(Apress, 2015) 中找到关于向量数学的完整初学者指南。它通过大量用于游戏开发的实用示例详细解释了所有这些概念。\n\
    \n将单位向量乘以 `newMagnitude`，并将结果加到 `spriteOne` 的位置上，将给出沿向量分布的点的 x/y 坐标。\n\n```\n\
    let x = spriteOne.centerX + dx * newMagnitude,\n    y = spriteOne.centerY + dy\
    \ * newMagnitude;\n```\n\n图 5-12 展示了如果 `numberOfPoints` 为 4 且线段宽度为 64 像素时，循环每次迭代的结果。\n\
    \n![A346816_1_En_5_Fig12_HTML.jpg](img/A346816_1_En_5_Fig12_HTML.jpg)\n\n######\
    \ 图 5-12. 查找沿向量分布的每个点的位置\n\n这些点的 x/y 值存储在一个点对象中，并被推入一个名为 `arrayOfPoints` 的数组。\n\
    \n```\narrayOfPoints.push({x, y});\n```\n\n循环结束后，`arrayOfPoints` 将包含一个对象列表，这些对象具有与我们在上一步中计算的\
    \ x 和 y 值相匹配的 `x` 和 `y` 属性。`points()` 函数返回这个数组：\n\n```\nreturn arrayOfPoints;\n\
    ```\n\n现在，我们可以通过像这样调用 `points()` 函数来访问这个数组：\n\n```\npoints()\n```\n\n每当我们在游戏中需要时，这都会动态地重新计算并返回新的点数组。\n\
    \n### 测试点与障碍物的碰撞情况\n\n现在我们需要某种方法来判断这些点中的任何一个是否碰到了某个障碍物。我们可以使用一个名为 `hitTestPoint()`\
    \ 的基本几何碰撞函数，该函数检查一个带有 x/y 属性的单个点对象是否与一个矩形精灵相交。如果发生碰撞，`hitTestPoint()` 返回 `true`，否则返回\
    \ `false`。\n\n```\nlet hitTestPoint = (point, sprite) => {\n\n  // 判断点的位置是否在由精灵的左侧、右侧、顶部和底部边界定义的区域内\
    \              \n  let left = point.x > sprite.x,\n      right = point.x < (sprite.x\
    \ + sprite.width),\n      top = point.y > sprite.y,\n      bottom = point.y <\
    \ (sprite.y + sprite.height);\n\n  // 如果所有碰撞条件都满足，则说明该点与精灵相交              \n \
    \ return left && right && top && bottom;\n};\n```\n\n现在，我们可以使用 `hitTestPoint()`\
    \ 来检查每个点与可能阻挡视线的每个障碍物精灵之间是否发生碰撞。方法如下：\n\n```\nlet noObstacles = points().every(point\
    \ => {\n  return obstacles.every(obstacle => {\n    return !(hitTestPoint(point,\
    \ obstacle))\n  });\n});\n```\n\n如果 `noObstacles` 为 `true`，那么我们就知道视线是清晰的。\n"
- fmt: '### `lineOfSight` 函数


    让我们把前几节学到的所有技术整合起来，构建一个可复用的`lineOfSight`函数。如果两个精灵之间存在清晰的视线，该函数将返回`true`，否则返回`false`。你可以这样在你的游戏代码中使用它：


    ```

    monster.lineOfSight = lineOfSight(

      monster, //精灵一

      alien,   //精灵二

      boxes,   //障碍物精灵的数组

      16       //每个碰撞点之间的距离

    );

    ```


    第四个参数决定了碰撞点之间的距离。为了获得更好的性能，请将这个值设置得大一些，最大可达你最小精灵的宽度（例如`64`或`32`）。为了获得更高的精度，请使用较小的数值。


    你可以使用`lineOfSight`的值来决定如何改变游戏中的某些内容。在`lineOfSight.html`示例文件中，它被用来张开怪物的嘴巴，并增加两个精灵之间连接线的透明度。


    ```

    if (monster.lineOfSight) {

      monster.show(monster.states.angry)

      line.alpha = 1;

    } else {

      monster.show(monster.states.normal)

      line.alpha = 0.3;

    }

    ```


    （有关其工作原理的完整细节，请查看`lineOfSight.js`文件中的源代码，特别是关于如何初始化怪物不同状态的部分。）


    以下是完整的`lineOfSight`函数。


    ```

    function lineOfSight(

      spriteOne,    //第一个精灵，具有 `centerX` 和 `centerY` 属性

      spriteTwo,    //第二个精灵，具有 `centerX` 和 `centerY` 属性

      obstacles,    //作为障碍物的精灵数组

      segment = 32  //碰撞点之间的距离

    ) {


    //绘制从 spriteTwo 到 spriteOne 之间的向量

      let vx = spriteTwo.centerX - spriteOne.centerX,

          vy = spriteTwo.centerY - spriteOne.centerY;


    //计算向量的模（以像素为单位的长度）

      let magnitude = Math.sqrt(vx * vx + vy * vy);


    //需要测试多少个点？

      let numberOfPoints = magnitude / segment;


    //创建一个 x/y 点的数组，这些点之间相隔 64 像素，

      //并从 `spriteOne` 延伸到 `spriteTwo`

      let points = () => {


    //初始化一个用于存储所有点的数组

        //沿着向量

        let arrayOfPoints = [];


    //为向量的每一段创建一个点对象，并

        //存储其在 map 数组中的 x/y 位置以及索引号

        for (let i = 1; i <= numberOfPoints; i++) {


    //计算此循环迭代的新模长

          let newMagnitude = segment * i;


    //获取单位向量

          let dx = vx / magnitude,

              dy = vy / magnitude;


    //使用单位向量和 newMagnitude 计算出此循环迭代中

          //下一个点的 x/y 位置

          let x = spriteOne.centerX + dx * newMagnitude,

              y = spriteOne.centerY + dy * newMagnitude;


    //将一个包含 x 和 y 属性的点对象推入 `arrayOfPoints`

          arrayOfPoints.push({x, y});

        }


    //返回点对象数组

        return arrayOfPoints;

      };


    //测试点与精灵之间是否存在碰撞

      let hitTestPoint = (point, sprite) => {


    //判断点的位置是否在由精灵的

        //左、右、上、下边界定义的区域内

        let left = point.x > sprite.x,

            right = point.x < (sprite.x + sprite.width),

            top = point.y > sprite.y,

            bottom = point.y < (sprite.y + sprite.height);


    //如果所有碰撞条件都满足，则说明该点

        //与精灵相交

        return left && right && top && bottom;

      };


    //如果向量上的所有瓦片索引号都为 `0`，则 `noObstacles` 函数将返回 `true`，

      //这意味着它们不包含任何障碍物。如果其中任何一个不是 `0`，

      //则该函数返回 `false`，表示路径上有障碍物

      let noObstacles = points().every(point => {

        return obstacles.every(obstacle => {

          return !(hitTestPoint(point, obstacle))

        });

      });


    //返回碰撞测试的真/假值

      return noObstacles;

    }

    ```


    现在你已经知道如何判断两个精灵之间是否存在清晰的视线。同时，你也知道了如何让精灵在迷宫环境中导航。你需要学习的最后一件事是如何将这两种技术结合起来——别担心，这比你想象的要简单得多！


    ### 基于瓦片的视线


    运行本章源文件中的`tileBasedLineOfSight.html`文件，可以查看如何在基于瓦片的迷宫环境中实现视线寻路系统的工作示例。在此示例中，怪物只有在沿着通道拥有清晰视线时才会追逐外星人，如图[5-13](#A346816_1_En_5_Chapter.xhtml#Fig13)所示。


    ![A346816_1_En_5_Fig13_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig13_HTML.jpg)


    ###### 图 5-13. 怪物只有看到外星人时才会追逐它


    为了使视线系统在基于瓦片的迷宫环境中良好运行，我们将进行以下两项修改：


    *   我们将使用基于瓦片的碰撞检测，而不是基于几何碰撞检测，来检查精灵之间向量上的任何点是否与墙壁接触。

    *   我们将把精灵之间的向量限制在直角方向上。这意味着我们只允许使用`0`、`90`或`180`度的角度来测试视线。


    让我们了解如何添加这两个新特性，然后用它们构建一个新的`tileBaseLineOfSight`函数。'
  raw: "### The lineOfSight Function\n\nLet’s put together all the techniques we’ve\
    \ learned in the last few sections, and build a reusable lineOfSight function\
    \ that will return true if there’s a clear line of sight between two sprites,\
    \ and false if there isn’t. Here’s how you’ll be able to use it in your game code:\n\
    \n```\nmonster.lineOfSight = lineOfSight(\n  monster, //Sprite one           \
    \ \n  alien,   //Sprite two            \n  boxes,   //An array of obstacle sprites\
    \            \n  16       //The distance between each collision point        \
    \    \n);\n```\n\nThe fourth argument determines the distance between collision\
    \ points. For better performance, make this a large number, up to the maximum\
    \ width of your smallest sprite (such as 64 or 32). For greater precision, use\
    \ a smaller number.\n\nYou can use the lineOfSight value to decide how to change\
    \ certain things in your game. In the lineOfSight.html example file, it’s used\
    \ to open the monster’s mouth, and to increase the alpha value of the connecting\
    \ line between the two sprites.\n\n```\nif (monster.lineOfSight) {\n  monster.show(monster.states.angry)\n\
      line.alpha = 1;\n} else {\n  monster.show(monster.states.normal)\n  line.alpha\
    \ = 0.3;\n}\n```\n\n(Check out the source code in the lineOfSight.js file for\
    \ full details on how this works, and especially how to initialize the monster’s\
    \ different states.)\n\nHere’s the complete lineOfSight function.\n\n```\nfunction\
    \ lineOfSight(\n  spriteOne,    //The first sprite, with `centerX` and `centerY`\
    \ properties              \n  spriteTwo,    //The second sprite, with `centerX`\
    \ and `centerY` properties              \n  obstacles,    //An array of sprites\
    \ which act as obstacles              \n  segment = 32  //The distance between\
    \ collision points              \n) {\n\n//Plot a vector between spriteTwo and\
    \ spriteOne              \n  let vx = spriteTwo.centerX - spriteOne.centerX,\n\
          vy = spriteTwo.centerY - spriteOne.centerY;\n\n//Find the vector's magnitude\
    \ (its length in pixels)              \n  let magnitude = Math.sqrt(vx * vx +\
    \ vy * vy);\n\n//How many points will we need to test?              \n  let numberOfPoints\
    \ = magnitude / segment;\n\n//Create an array of x/y points, separated by 64 pixels,\
    \ that              \n  //extends from `spriteOne` to `spriteTwo`            \
    \  \n  let points = () => {\n\n//Initialize an array that is going to store all\
    \ our points              \n    //along the vector              \n    let arrayOfPoints\
    \ = [];\n\n//Create a point object for each segment of the vector and        \
    \      \n    //store its x/y position as well as its index number on         \
    \     \n    //the map array              \n    for (let i = 1; i <= numberOfPoints;\
    \ i++) {\n\n//Calculate the new magnitude for this iteration of the loop     \
    \         \n      let newMagnitude = segment * i;\n\n//Find the unit vector  \
    \            \n      let dx = vx / magnitude,\n          dy = vy / magnitude;\n\
    \n//Use the unit vector and newMagnitude to figure out the x/y              \n\
          //position of the next point in this loop iteration              \n      let\
    \ x = spriteOne.centerX + dx * newMagnitude,\n          y = spriteOne.centerY\
    \ + dy * newMagnitude;\n\n//Push a point object with x and y properties into the\
    \ `arrayOfPoints`              \n      arrayOfPoints.push({x, y});\n    }\n\n\
    //Return the array of point objects              \n    return arrayOfPoints;\n\
      };\n\n//Test for a collision between a point and a sprite              \n  let\
    \ hitTestPoint = (point, sprite) => {\n\n//Find out if the point's position is\
    \ inside the area defined              \n    //by the sprite's left, right, top\
    \ and bottom sides              \n    let left = point.x > sprite.x,\n        right\
    \ = point.x < (sprite.x + sprite.width),\n        top = point.y > sprite.y,\n\
            bottom = point.y < (sprite.y + sprite.height);\n\n//If all the collision\
    \ conditions are met, you know the              \n    //point is intersecting\
    \ the sprite              \n    return left && right && top && bottom;\n  };\n\
    \n//The `noObstacles` function will return `true` if all the tile            \
    \  \n  //index numbers along the vector are `0`, which means they contain    \
    \          \n  //no obstacles. If any of them aren't `0`, then the function returns\
    \              \n  //`false` which means there's an obstacle in the way      \
    \        \n  let noObstacles = points().every(point => {\n    return obstacles.every(obstacle\
    \ => {\n      return !(hitTestPoint(point, obstacle))\n    });\n  });\n\n//Return\
    \ the true/false value of the collision test              \n  return noObstacles;\n\
    }\n```\n\nSo now you know how to figure out if there’s a clear line of sight between\
    \ two sprites. And, you also know how to make sprites navigate around a maze environment.\
    \ The last thing you need to learn is how to combine these two techniques – don’t\
    \ worry, it’s much easier than you think!\n\n## Tile-Based Line of Sight\n\nRun\
    \ the tileBasedLineOfSight.html file in the chapter’s source files for a working\
    \ example of how to implement a line of sight pathfinding system in a tile-based\
    \ maze environment. In this example the monsters only chase the alien if they\
    \ have a clear line of sight down a passage, as illustrated in Figure [5-13](#A346816_1_En_5_Chapter.xhtml#Fig13).\n\
    \n![A346816_1_En_5_Fig13_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig13_HTML.jpg)\n\
    \n###### Figure 5-13. The monsters only chase the alien when they can see it\n\
    \nThere are two modifications we’re going to make our line of sight system so\
    \ that it works well in a tile-based maze environment:\n\n*   We’re going to use\
    \ a tile-based collision instead of a geometry-based collision to check whether\
    \ any of the points along the vector between the sprites are touching any walls.\n\
    \n*   We’re going to restrict the vector between the sprites to right angles.\
    \ That means we’re only going to allow angles of 0, 90, or 180 degrees to test\
    \ for a line of sight.\n\nLet’s find out how to add these two new features and\
    \ then use them to build a new tileBaseLineOfSight function."
  trans: "\n### `lineOfSight` 函数\n\n让我们把前几节学到的所有技术整合起来，构建一个可复用的 `lineOfSight` 函数。如果两个精灵之间存在清晰的视线，该函数将返回\
    \ `true`，否则返回 `false`。你可以这样在你的游戏代码中使用它：\n\n```\nmonster.lineOfSight = lineOfSight(\n\
    \  monster, //精灵一\n  alien,   //精灵二\n  boxes,   //障碍物精灵的数组\n  16       //每个碰撞点之间的距离\n\
    );\n```\n\n第四个参数决定了碰撞点之间的距离。为了获得更好的性能，请将这个值设置得大一些，最大可达你最小精灵的宽度（例如 `64` 或 `32`）。为了获得更高的精度，请使用较小的数值。\n\
    \n你可以使用 `lineOfSight` 的值来决定如何改变游戏中的某些内容。在 `lineOfSight.html` 示例文件中，它被用来张开怪物的嘴巴，并增加两个精灵之间连接线的透明度。\n\
    \n```\nif (monster.lineOfSight) {\n  monster.show(monster.states.angry)\n  line.alpha\
    \ = 1;\n} else {\n  monster.show(monster.states.normal)\n  line.alpha = 0.3;\n\
    }\n```\n\n（有关其工作原理的完整细节，请查看 `lineOfSight.js` 文件中的源代码，特别是关于如何初始化怪物不同状态的部分。）\n\n\
    以下是完整的 `lineOfSight` 函数。\n\n```\nfunction lineOfSight(\n  spriteOne,    //第一个精灵，具有\
    \ `centerX` 和 `centerY` 属性\n  spriteTwo,    //第二个精灵，具有 `centerX` 和 `centerY` 属性\n\
    \  obstacles,    //作为障碍物的精灵数组\n  segment = 32  //碰撞点之间的距离\n) {\n\n//绘制从 spriteTwo\
    \ 到 spriteOne 之间的向量\n  let vx = spriteTwo.centerX - spriteOne.centerX,\n     \
    \ vy = spriteTwo.centerY - spriteOne.centerY;\n\n//计算向量的模（以像素为单位的长度）\n  let magnitude\
    \ = Math.sqrt(vx * vx + vy * vy);\n\n//需要测试多少个点？\n  let numberOfPoints = magnitude\
    \ / segment;\n\n//创建一个 x/y 点的数组，这些点之间相隔 64 像素，\n  //并从 `spriteOne` 延伸到 `spriteTwo`\n\
    \  let points = () => {\n\n//初始化一个用于存储所有点的数组\n    //沿着向量\n    let arrayOfPoints\
    \ = [];\n\n//为向量的每一段创建一个点对象，并\n    //存储其在 map 数组中的 x/y 位置以及索引号\n    for (let i\
    \ = 1; i <= numberOfPoints; i++) {\n\n//计算此循环迭代的新模长\n      let newMagnitude =\
    \ segment * i;\n\n//获取单位向量\n      let dx = vx / magnitude,\n          dy = vy\
    \ / magnitude;\n\n//使用单位向量和 newMagnitude 计算出此循环迭代中\n      //下一个点的 x/y 位置\n   \
    \   let x = spriteOne.centerX + dx * newMagnitude,\n          y = spriteOne.centerY\
    \ + dy * newMagnitude;\n\n//将一个包含 x 和 y 属性的点对象推入 `arrayOfPoints`\n      arrayOfPoints.push({x,\
    \ y});\n    }\n\n//返回点对象数组\n    return arrayOfPoints;\n  };\n\n//测试点与精灵之间是否存在碰撞\n\
    \  let hitTestPoint = (point, sprite) => {\n\n//判断点的位置是否在由精灵的\n    //左、右、上、下边界定义的区域内\n\
    \    let left = point.x > sprite.x,\n        right = point.x < (sprite.x + sprite.width),\n\
    \        top = point.y > sprite.y,\n        bottom = point.y < (sprite.y + sprite.height);\n\
    \n//如果所有碰撞条件都满足，则说明该点\n    //与精灵相交\n    return left && right && top && bottom;\n\
    \  };\n\n//如果向量上的所有瓦片索引号都为 `0`，则 `noObstacles` 函数将返回 `true`，\n  //这意味着它们不包含任何障碍物。如果其中任何一个不是\
    \ `0`，\n  //则该函数返回 `false`，表示路径上有障碍物\n  let noObstacles = points().every(point\
    \ => {\n    return obstacles.every(obstacle => {\n      return !(hitTestPoint(point,\
    \ obstacle))\n    });\n  });\n\n//返回碰撞测试的真/假值\n  return noObstacles;\n}\n```\n\
    \n现在你已经知道如何判断两个精灵之间是否存在清晰的视线。同时，你也知道了如何让精灵在迷宫环境中导航。你需要学习的最后一件事是如何将这两种技术结合起来——别担心，这比你想象的要简单得多！\n\
    \n### 基于瓦片的视线\n\n运行本章源文件中的 `tileBasedLineOfSight.html` 文件，可以查看如何在基于瓦片的迷宫环境中实现视线寻路系统的工作示例。在此示例中，怪物只有在沿着通道拥有清晰视线时才会追逐外星人，如图\
    \ 5-13 所示。\n\n![A346816_1_En_5_Fig13_HTML.jpg](img/A346816_1_En_5_Fig13_HTML.jpg)\n\
    \n###### 图 5-13. 怪物只有看到外星人时才会追逐它\n\n为了使视线系统在基于瓦片的迷宫环境中良好运行，我们将进行以下两项修改：\n\n* \
    \  我们将使用基于瓦片的碰撞检测，而不是基于几何碰撞检测，来检查精灵之间向量上的任何点是否与墙壁接触。\n*   我们将把精灵之间的向量限制在直角方向上。这意味着我们只允许使用\
    \ `0`、`90` 或 `180` 度的角度来测试视线。\n\n让我们了解如何添加这两个新特性，然后用它们构建一个新的 `tileBaseLineOfSight`\
    \ 函数。\n"
- fmt: "### Tile-Based Collision\n\nThe advantage to using a tile-based collision\
    \ system in a maze game environment is that it’s very efficient. In a big game\
    \ you could have hundreds of tile-based collision tests happening simultaneously\
    \ without any noticeable performance hit. Geometry-based collision is much more\
    \ math heavy, so; although it can be very precise, you pay a performance penalty.\n\
    \nIn our earlier line of sight example we used a geometry based collision function\
    \ called `hitTestPoint` that checked whether a point is inside the area of a rectangle.\
    \ How can we test for a collision between a point and a sprite using tile based\
    \ collision? We need to test whether a point’s map array index number corresponds\
    \ to the map array index number of the sprite we want to test for a collision\
    \ with. That means that we need to convert each point’s x/y position number into\
    \ a map array index number. We already know how to do that, using a function called\
    \ `getIndex` that you learned to use in Chapter [3](#A346816_1_En_3_Chapter.xhtml):\n\
    \n```\nfunction getIndex(x, y, tilewidth, tileheight, mapWidthInTiles) {\n\n \
    \ //Convert pixel coordinates to map index coordinates              \n  let index\
    \ = {};\n  index.x = Math.floor(x / tilewidth);\n  index.y = Math.floor(y / tileheight);\n\
    \n  //Return the index number              \n  return index.x + (index.y * mapWidthInTiles);\n\
    };\n```\n\nIf you have an array of points, all of which have index numbers that\
    \ correspond to their positions on the map, you know that they’re colliding with\
    \ any objects that share those same index numbers. You can then find out exactly\
    \ what object the point is colliding with by using the point’s index number to\
    \ look up the gid value of the cell at the location.\n\n```\nmapArray[point.index]\n\
    ```\n\nIf the point’s gid number matches the gid number of an object that you’re\
    \ interested in, then you have a collision.\n\nFor a line of sight collision test,\
    \ you’re specifically looking for collisions with cells that *don’t contain any\
    \ obstacles*. In the examples we’ve been using in this book, all empty cells without\
    \ obstacles have gid numbers of 0. That means you can loop through every point\
    \ in the line of sight vector, and if all of them have index numbers that correspond\
    \ to a gid value of 0, then you know there are no collisions.\n\n```\nlet noObstacles\
    \ = points().every(point => {\n  return mapArray[point.index] === 0\n});\n```\n\
    \nIn the example above, if `noObstacles` returns `true`, then you have a clear\
    \ line of sight. You’ll see ahead how this little bit of code is used in our complete\
    \ tile-based collision system. But first, how can we limit our line of sight test\
    \ to allow only right angles?\n\n### Limiting the Angle\n\nIn our earlier line\
    \ of sight example the monster sprite had a full field of 360 degree vision. In\
    \ the maze game example, the monsters’ line of sight is restricted to right angles.\
    \ This means that the the monsters can’t see around corners on the diagonal; they\
    \ can just see whatever is directly in front of them. This makes it a little bit\
    \ easier for the player, and also makes for a more natural feeling maze game experience.\n\
    \nBefore we find out how to implement this, let’s first find our how you can figure\
    \ out the angle of a vector (a line). As you’ve learned, a vector is defined by\
    \ two values: `vx` and `vy`. This is the code that we’ve been using to plot a\
    \ vector between two sprites:\n\n```\nlet vx = spriteTwo.centerX - spriteOne.centerX,\n\
    \    vy = spriteTwo.centerY - spriteOne.centerY;\n```\n\nYou can find out what\
    \ the angle of that vector is, in degrees, using this handy formula:\n\n```\n\
    let angle = Math.atan2(vy, vx) * 180 / Math.PI;\n```\n\nThe first step in restricting\
    \ the line of sight angle is to create an array that includes all the valid angles.\
    \ For example, to restrict your angles to 90 degrees, use these angles:\n\n```\n\
    let angles = [90, -90, 0, 180, -180];\n```\n\nThe next step is to create a function\
    \ that compares the vector’s angle to the angles in the array. If they match,\
    \ the function returns `true`, if they don’t, it returns `false`. Here’s a `validAngle`\
    \ function that does this:\n\n```\nlet validAngle = (vx, vy, angles) => {\n\n\
    \  //Find the angle of the vector between the two sprites              \n  let\
    \ angle = Math.atan2(vy, vx) * 180 / Math.PI;\n\n  //If the angle matches one\
    \ of the valid angles, return              \n  //`true`, otherwise return `false`\
    \              \n  if (angles.length !== 0) {\n    return angles.some(x => x ===\
    \ angle);\n  } else {\n    return true;\n  }\n};\n```\n\nNow let’s find out how\
    \ to use these new techniques to build a reusable tile-based line of sight function."
  raw: "### Tile-Based Collision\n\nThe advantage to using a tile-based collision\
    \ system in a maze game environment is that it’s very efficient. In a big game\
    \ you could have hundreds of tile-based collision tests happening simultaneously\
    \ without any noticeable performance hit. Geometry-based collision is much more\
    \ math heavy, so; although it can be very precise, you pay a performance penalty.\n\
    \nIn our earlier line of sight example we used a geometry based collision function\
    \ called hitTestPoint that checked whether a point is inside the area of a rectangle.\
    \ How can we test for a collision between a point and a sprite using tile based\
    \ collision? We need to test whether a point’s map array index number corresponds\
    \ to the map array index number of the sprite we want to test for a collision\
    \ with. That means that we need to convert each point’s x/y position number into\
    \ a map array index number. We already know how to do that, using a function called\
    \ getIndex that you learned to use in Chapter [3](#A346816_1_En_3_Chapter.xhtml):\n\
    \n```\nfunction getIndex(x, y, tilewidth, tileheight, mapWidthInTiles) {\n\n  //Convert\
    \ pixel coordinates to map index coordinates              \n  let index = {};\n\
      index.x = Math.floor(x / tilewidth);\n  index.y = Math.floor(y / tileheight);\n\
    \n  //Return the index number              \n  return index.x + (index.y * mapWidthInTiles);\n\
    };\n```\n\nIf you have an array of points, all of which have index numbers that\
    \ correspond to their positions on the map, you know that they’re colliding with\
    \ any objects that share those same index numbers. You can then find out exactly\
    \ what object the point is colliding with by using the point’s index number to\
    \ look up the gid value of the cell at the location.\n\n```\nmapArray[point.index]\n\
    ```\n\nIf the point’s gid number matches the gid number of an object that you’re\
    \ interested in, then you have a collision.\n\nFor a line of sight collision test,\
    \ you’re specifically looking for collisions with cells that *don’t contain any\
    \ obstacles*. In the examples we’ve been using in this book, all empty cells without\
    \ obstacles have gid numbers of 0. That means you can loop through every point\
    \ in the line of sight vector, and if all of them have index numbers that correspond\
    \ to a gid value of 0, then you know there are no collisions.\n\n```\nlet noObstacles\
    \ = points().every(point => {\n  return mapArray[point.index] === 0\n});\n```\n\
    \nIn the example above, if noObstacles returns true, then you have a clear line\
    \ of sight. You’ll see ahead how this little bit of code is used in our complete\
    \ tile-based collision system. But first, how can we limit our line of sight test\
    \ to allow only right angles?\n\n### Limiting the Angle\n\nIn our earlier line\
    \ of sight example the monster sprite had a full field of 360 degree vision. In\
    \ the maze game example, the monsters’ line of sight is restricted to right angles.\
    \ This means that the the monsters can’t see around corners on the diagonal; they\
    \ can just see whatever is directly in front of them. This makes it a little bit\
    \ easier for the player, and also makes for a more natural feeling maze game experience.\n\
    \nBefore we find out how to implement this, let’s first find our how you can figure\
    \ out the angle of a vector (a line). As you’ve learned, a vector is defined by\
    \ two values: vx and vy. This is the code that we’ve been using to plot a vector\
    \ between two sprites:\n\n```\nlet vx = spriteTwo.centerX - spriteOne.centerX,\n\
        vy = spriteTwo.centerY - spriteOne.centerY;\n```\n\nYou can find out what\
    \ the angle of that vector is, in degrees, using this handy formula:\n\n```\n\
    let angle = Math.atan2(vy, vx) * 180 / Math.PI;\n```\n\nThe first step in restricting\
    \ the line of sight angle is to create an array that includes all the valid angles.\
    \ For example, to restrict your angles to 90 degrees, use these angles:\n\n```\n\
    let angles = [90, -90, 0, 180, -180];\n```\n\nThe next step is to create a function\
    \ that compares the vector’s angle to the angles in the array. If they match,\
    \ the function returns true, if they don’t, it returns false. Here’s a validAngle\
    \ function that does this:\n\n```\nlet validAngle = (vx, vy, angles) => {\n\n\
      //Find the angle of the vector between the two sprites              \n  let\
    \ angle = Math.atan2(vy, vx) * 180 / Math.PI;\n\n  //If the angle matches one\
    \ of the valid angles, return              \n  //`true`, otherwise return `false`\
    \              \n  if (angles.length !== 0) {\n    return angles.some(x => x ===\
    \ angle);\n  } else {\n    return true;\n  }\n};\n```\n\nNow let’s find out how\
    \ to use these new techniques to build a reusable tile-based line of sight function."
  trans: "\n### 基于瓦片的碰撞检测\n\n在迷宫游戏环境中使用基于瓦片的碰撞检测系统，其优势在于效率极高。在大型游戏中，你可以同时进行数百次基于瓦片的碰撞测试，而不会出现任何明显的性能损失。基于几何学（Geometry）的碰撞检测运算量要大得多，因此，尽管它可以非常精确，但你会付出性能上的代价。\n\
    \n在我们早前的视线示例中，我们使用了一个名为 `hitTestPoint` 的基于几何学的碰撞函数，它用来检测一个点是否位于某个矩形区域内。我们如何使用基于瓦片的碰撞来检测一个点与一个精灵（sprite）之间的碰撞呢？我们需要检测一个点的地图数组索引编号是否与我们要检测碰撞的精灵的地图数组索引编号相匹配。这意味着我们需要将每个点的\
    \ x/y 位置坐标转换成地图数组索引编号。我们已经知道如何做到这一点，这要使用你在第 3 章中学到的一个名为 `getIndex` 的函数：\n\n```\n\
    function getIndex(x, y, tilewidth, tileheight, mapWidthInTiles) {\n\n  //将像素坐标转换为地图索引坐标\
    \              \n  let index = {};\n  index.x = Math.floor(x / tilewidth);\n \
    \ index.y = Math.floor(y / tileheight);\n\n  //返回索引编号              \n  return\
    \ index.x + (index.y * mapWidthInTiles);\n};\n```\n\n如果你有一个点数组，其中所有点都具有与其在地图上的位置相对应的索引编号，那么你就知道这些点正在与共享相同索引编号的任何对象发生碰撞。然后，你可以通过使用该点的索引编号来查找该位置单元格的\
    \ gid 值，从而准确地找出该点正在与哪个对象发生碰撞。\n\n```\nmapArray[point.index]\n```\n\n如果该点的 gid\
    \ 编号与你感兴趣对象的 gid 编号匹配，那么就发生了碰撞。\n\n对于视线碰撞测试，你专门寻找的是与**不包含任何障碍物**的单元格的碰撞。在本书中使用的示例中，所有没有障碍物的空单元格的\
    \ gid 编号都是 0。这意味着你可以遍历视线向量中的每一个点，如果所有这些点对应的 gid 值都是 0，那么你就知道没有碰撞发生。\n\n```\nlet\
    \ noObstacles = points().every(point => {\n  return mapArray[point.index] ===\
    \ 0\n});\n```\n\n在上面的例子中，如果 `noObstacles` 返回 `true`，那么你就拥有清晰的视线。稍后你将看到这一段简短的代码是如何在我们完整的基于瓦片的碰撞系统中使用的。但首先，我们如何限制我们的视线测试，使其只允许直角方向呢？\n\
    \n### 限制角度\n\n在我们早前的视线示例中，怪物精灵拥有 360 度的完整视野。而在迷宫游戏示例中，怪物的视线被限制在直角方向。这意味着怪物无法看到对角线上的拐角处；它们只能看到正前方的东西。这会让玩家感觉稍微容易一些，同时也能带来更自然的迷宫游戏体验。\n\
    \n在我们找到实现方法之前，先来了解一下如何计算一个向量（一条线）的角度。正如你已经学到的，一个向量由两个值定义：`vx` 和 `vy`。这是我们一直用来绘制两个精灵之间向量的代码：\n\
    \n```\nlet vx = spriteTwo.centerX - spriteOne.centerX,\n    vy = spriteTwo.centerY\
    \ - spriteOne.centerY;\n```\n\n你可以使用以下便捷公式计算出该向量的角度（以度为单位）：\n\n```\nlet angle\
    \ = Math.atan2(vy, vx) * 180 / Math.PI;\n```\n\n限制视线角度的第一步是创建一个包含所有有效角度的数组。例如，要将角度限制为\
    \ 90 度，可以使用这些角度：\n\n```\nlet angles = [90, -90, 0, 180, -180];\n```\n\n下一步是创建一个函数，将向量的角度与数组中的角度进行比较。如果它们匹配，函数返回\
    \ `true`，如果不匹配，则返回 `false`。下面是一个实现此功能的 `validAngle` 函数：\n\n```\nlet validAngle\
    \ = (vx, vy, angles) => {\n\n  //找出两个精灵之间向量的角度              \n  let angle = Math.atan2(vy,\
    \ vx) * 180 / Math.PI;\n\n  //如果角度与某个有效角度匹配，则返回              \n  //`true`，否则返回\
    \ `false`              \n  if (angles.length !== 0) {\n    return angles.some(x\
    \ => x === angle);\n  } else {\n    return true;\n  }\n};\n```\n\n现在让我们来了解如何使用这些新技术来构建一个可复用的基于瓦片的视线函数。\n"
- fmt: "### The `tileBasedLineOfSight` Function\n\nHere’s the new `tileBasedLineOfSight`\
    \ function that implements tile-based collision and restricts the angle to 90\
    \ degrees. You’ll learn ahead how to use it in a game.\n\n```javascript\nfunction\
    \ tileBasedLineOfSight(\n  spriteOne,    //The first sprite, with `centerX` and\
    \ `centerY` properties              \n  spriteTwo,    //The second sprite, with\
    \ `centerX` and `centerY` properties              \n  mapArray,     //The tile\
    \ map array              \n  world,        //The `world` object that contains\
    \ the `tilewidth              \n                //`tileheight` and `widthInTiles`\
    \ properties              \n  emptyGid = 0, //The Gid that represents and empty\
    \ tile, usually `0`              \n  segment = 32, //The distance between collision\
    \ points              \n  angles = []   //An array of angles to which you want\
    \ to              \n                //restrict the line of sight             \
    \ \n) {\n\n//Plot a vector between spriteTwo and spriteOne              \n  let\
    \ vx = spriteTwo.centerX - spriteOne.centerX,\n      vy = spriteTwo.centerY -\
    \ spriteOne.centerY;\n\n//Find the vector's magnitude (its length in pixels) \
    \             \n  let magnitude = Math.sqrt(vx * vx + vy * vy);\n\n//How many\
    \ points will we need to test?              \n  let numberOfPoints = magnitude\
    \ / segment;\n\n//Create an array of x/y points that              \n  //extends\
    \ from `spriteOne` to `spriteTwo`              \n  let points = () => {\n\n//Initialize\
    \ an array that is going to store all our points              \n    //along the\
    \ vector              \n    let arrayOfPoints = [];\n\n//Create a point object\
    \ for each segment of the vector and              \n    //store its x/y position\
    \ as well as its index number on              \n    //the map array          \
    \    \n    for (let i = 1; i <= numberOfPoints; i++) {\n\n//Calculate the new\
    \ magnitude for this iteration of the loop              \n      let newMagnitude\
    \ = segment * i;\n\n//Find the unit vector              \n      let dx = vx /\
    \ magnitude,\n          dy = vy / magnitude;\n\n//Use the unit vector and newMagnitude\
    \ to figure out the x/y              \n      //position of the next point in this\
    \ loop iteration              \n      let x = spriteOne.centerX + dx * newMagnitude,\n\
    \          y = spriteOne.centerY + dy * newMagnitude;\n\n//The getIndex function\
    \ converts x/y coordinates into              \n      //map array index positon\
    \ numbers              \n      let getIndex = (x, y, tilewidth, tileheight, mapWidthInTiles)\
    \ => {\n\n//Convert pixel coordinates to map index coordinates              \n\
    \        let index = {};\n        index.x = Math.floor(x / tilewidth);\n     \
    \   index.y = Math.floor(y / tileheight);\n\n//Return the index number       \
    \       \n        return index.x + (index.y * mapWidthInTiles);\n      };\n\n\
    //Find the map index number that this x and y point corresponds to           \
    \   \n      let index = getIndex(\n        x, y,\n        world.tilewidth,\n \
    \       world.tileheight,\n        world.widthInTiles\n      );\n\n//Push the\
    \ point into the `arrayOfPoints`              \n      arrayOfPoints.push({\n \
    \       x, y, index\n      });\n    }\n\n//Return the array              \n  \
    \  return arrayOfPoints;\n  };\n\n//The tile-based collision test.           \
    \   \n  //The `noObstacles` function will return `true` if all the tile      \
    \        \n  //index numbers along the vector are `0`, which means they contain\
    \              \n  //no walls. If any of them aren't 0, then the function returns\
    \              \n  //`false` which means there's a wall in the way           \
    \   \n  let noObstacles = points().every(point => {\n      return mapArray[point.index]\
    \ === emptyGid\n  });\n\n//Restrict the line of sight to right angles only   \
    \           \n  //(we don't want to use diagonals)              \n  let validAngle\
    \ = () => {\n\n//Find the angle of the vector between the two sprites        \
    \      \n    let angle = Math.atan2(vy, vx) * 180 / Math.PI;\n\n//If the angle\
    \ matches one of the valid angles, return              \n    //`true`, otherwise\
    \ return `false`              \n    if (angles.length !== 0) {\n      return angles.some(x\
    \ => x === angle);\n    } else {\n      return true;\n    }\n  };\n\n//Return\
    \ `true` if there are no obstacles and the line of sight              \n  //is\
    \ at a 90 degree angle              \n  if (noObstacles === true && validAngle()\
    \ === true) {\n    return true;\n  } else {\n    return false;\n  }\n}\n```\n\n\
    And that’s tile-based line of sight - solved!\n\n## Summary\n\nAll the basics\
    \ you need to know to get started with pathfinding are in this chapter. You’ve\
    \ learned how to analyze and interpret the environment that a sprite is in, and\
    \ how to use that information to decide which direction a sprite should move in.\
    \ Should it choose a random direction, or a direction that’s closest to its target?\
    \ You’ve also learned one of the most important techniques that every game developer\
    \ needs to know: how to determine the line of sight. And, you now know how to\
    \ use a line of sight in both a geometry-based and a tile-based collision environment.\
    \ As you’ll see in the chapters ahead, all these skills are useful not just for\
    \ pathfinding, but also as the basis for building rudimentary AIs. And, of course,\
    \ you can use these exact same techniques with your isometric game maps!\n\nThe\
    \ skills you’ve learned in this chapter will take you quite far, but there’s one\
    \ more important pathfinding skill you need to know: how to find the shortest\
    \ path between two points. That’s what the next chapter is all about!\n\n© Rex\
    \ van der Spuy 2017\n\nRex van der Spuy, *The Advanced Game Developer's Toolkit*,\
    \ 10.1007/978-1-4842-1097-0_6"
