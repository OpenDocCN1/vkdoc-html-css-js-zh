          },\n      bottomLeft: {\n        x: s.x + ca.x,\n        y: s.y + ca.y +\
    \ ca.height\n      },\n      bottomRight: {\n        x: s.x + ca.x + ca.width,\n\
            y: s.y + ca.y + ca.height\n      }\n    };\n  } else {\n    return {\n\
          topLeft: {\n        x: s.x,\n        y: s.y\n      },\n      topRight: {\n\
            x: s.x + s.width - 1,\n        y: s.y\n      },\n      bottomLeft: {\n\
            x: s.x,\n        y: s.y + s.height - 1\n      },\n      bottomRight: {\n\
            x: s.x + s.width - 1,\n        y: s.y + s.height - 1\n      }\n    };\n\
      }\n}\n```\n\nYou can now set a custom collision area for any sprites in the\
    \ game. Now how does the collision system in the fantasy RPG game example work?\n\
    \n## Collisions with Obstacles\n\nYou’ll remember from Chapter [2](#A346816_1_En_2_Chapter.xhtml)\
    \ that all the tiles that should prevent the elf from moving were created on a\
    \ map layer called obstacles, shown in Figure [3-18](#A346816_1_En_3_Chapter.xhtml#Fig18).\n\
    \n![A346816_1_En_3_Fig18_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig18_HTML.jpg)\n\
    \n###### Figure 3-18. The map’s obstacles layer\n\nThis exports as a nice fat\
    \ array that is full of gid numbers representing the obstacles. But, most importantly,\
    \ it’s also full of zeros. Any “0” in the array means “no obstacle.” That means\
    \ we can use our little inverse collision trick. We can check to see if all four\
    \ corners of the elf’s collision area are touching “0” cells. If any of them aren’t\
    \ “0,” we know that the elf has bumped into an obstacle. The code we end up with\
    \ is almost identical to the code we used to check for maze walls in our earlier\
    \ maze game examples. Here’s the code from the game loop that checks whether the\
    \ elf is touching an obstacle. If it is, the code prevents the elf from moving.\n\
    \n```\nlet obstaclesMapArray = world.getObject(\"obstacles\").data;\nlet elfVsGround\
    \ = g.hitTestTile(elf, obstaclesMapArray, 0, world, \"every\");\n\nif (!elfVsGround.hit)\
    \ {\n\n  //Prevent the elf from moving            \n  elf.x -= elf.vx;\n  elf.y\
    \ -= elf.vy;\n  elf.vx = 0;\n  elf.vy = 0;\n}\n```\n\nWhat if you want to find\
    \ out which type of obstacle the elf has bumped into? You can use the collision.index\
    \ property to look up its gid number in the map array. Here’s how you could find\
    \ a gid number from the obstacleMapArray:\n\n```\nobstaclesMapArray[elfVsGround.index]\n\
    ```\n\nIf the elf bumped into the right side of a tree, this would give you 33\\\
    . This means you can now obtain detailed information about how of the elf is interacting\
    \ with the environment, and use this to start building some sophisticated game\
    \ logic.\n\n### Collisions with Items\n\nYou’ll remember that when we designed\
    \ the game map in Tiled Editor, we gave the item tiles these name properties:\
    \ “skull”, “heart”, and “marmot.” The items were also added on their own layer,\
    \ shown in Figure [3-19](#A346816_1_En_3_Chapter.xhtml#Fig19).\n\n![A346816_1_En_3_Fig19_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig19_HTML.jpg)\n\
    \n###### Figure 3-19. The item tiles are on their own layer and have name properties\n\
    \nWe can use these custom name properties in our game code to tell us which items\
    \ the elf is touching. Let’s find out how.\n\nFirst, we need to get a reference\
    \ to the items layer.\n\n```\nitemsLayer = world.getObject(\"items\");\n```\n\n\
    Remember that itemsLayer is a sprite container. It contains all the sprites on\
    \ that layer; there will only be three: the heart, skull, and marmot. You can\
    \ access those sprites in the layer’s children array. So the next step to get\
    \ a reference to the itemsLayer.children.\n\n```\nitems = itemsLayer.children;\n\
    ```\n\nWe now have an array called items that contains the three item sprites."
  trans: "\n### 基于瓦片碰撞的角色扮演游戏\n\n先试玩一下第 1 章的`fantasy.html`原型示例，重温一下它的运作方式。你会注意到精灵角色可以碰撞两类物体：\n\
    \n-   阻挡行动的障碍物：树桩、墙基和灌木丛底部。\n-   可收集的物品：红心、骷髅头和土拨鼠。\n\n图 3-15 展示了这一点。碰撞机制完全基于前几节学到的瓦片碰撞系统。但这里有一些有趣的新细节，这些细节并非边缘情况，而是许多类型游戏中你都需要解决的典型碰撞问题。\n\
    \n![A346816_1_En_3_Fig15_HTML.jpg](img/A346816_1_En_3_Fig15_HTML.jpg)\n\n**图 3-15.**\
    \ 障碍物阻挡行动，物品可被收集\n\n### 定义碰撞区域\n\n游戏地图中的所有瓦片都由整齐填充 32x32 像素方格的精美图形构成。然而，精灵角色并不遵循这一模式。它的精灵尺寸为\
    \ 64x64 像素，而角色插画的实际尺寸为 28x52 像素。图 3-16 展示了这一点。\n\n![A346816_1_En_3_Fig16_HTML.gif](img/A346816_1_En_3_Fig16_HTML.gif)\n\
    \n**图 3-16.** 所有尺寸均不相同\n\n在迷宫游戏示例中这不成问题，因为瓦片尺寸、精灵尺寸以及迷宫单元格网格尺寸完全相同：都是 64x64 像素。现在该怎么办？\n\
    \n别担心！只需在精灵上创建一个碰撞区域即可。碰撞区域定义了精灵的哪个部位应对碰撞敏感。在本游戏中，我只希望精灵头部以下的身体区域对碰撞做出反应。这是一个\
    \ 20x20 像素的方形区域，你可以在图 3-17 中看到它。它相对于精灵顶部向下偏移 44 像素，向左偏移 22 像素。\n\n![A346816_1_En_3_Fig17_HTML.gif](img/A346816_1_En_3_Fig17_HTML.gif)\n\
    \n**图 3-17.** 精灵的碰撞区域\n\n这保留了浅 2.5D 景深效果，因为它意味着精灵的头部不会撞到视觉上位于其上方但深度层更低的物体——例如墙壁或树木的顶部。\n\
    \n要在游戏代码中实现这一点，我们只需在精灵上创建一个定义此形状的`collisionArea`对象。以下是游戏设置函数中实现此功能的代码片段。\n\n```\n\
    elf.collisionArea = {\n  x: 22,\n  y: 44,\n  width: 20,\n  height: 20\n};\n```\n\
    \n（有关完整上下文，请参考第 1 章的`fantasy.js`源文件）。\n\n现在，不再使用精灵的四个角点，而是使用这个新的`collisionArea`的四个角点进行碰撞检测。为了实现这一点，请使用这个新版本的`getPoints`函数。\n\
    \n```\ngetPoints(s) {\n  let ca = s.collisionArea;\n  if (ca !== undefined) {\n\
    \    return {\n      topLeft: {\n        x: s.x + ca.x,\n        y: s.y + ca.y\n\
    \      },\n      topRight: {\n        x: s.x + ca.x + ca.width,\n        y: s.y\
    \ + ca.y\n      },\n      bottomLeft: {\n        x: s.x + ca.x,\n        y: s.y\
    \ + ca.y + ca.height\n      },\n      bottomRight: {\n        x: s.x + ca.x +\
    \ ca.width,\n        y: s.y + ca.y + ca.height\n      }\n    };\n  } else {\n\
    \    return {\n      topLeft: {\n        x: s.x,\n        y: s.y\n      },\n \
    \     topRight: {\n        x: s.x + s.width - 1,\n        y: s.y\n      },\n \
    \     bottomLeft: {\n        x: s.x,\n        y: s.y + s.height - 1\n      },\n\
    \      bottomRight: {\n        x: s.x + s.width - 1,\n        y: s.y + s.height\
    \ - 1\n      }\n    };\n  }\n}\n```\n\n现在你可以为游戏中的任何精灵设置自定义碰撞区域。那么，这个幻想 RPG 游戏示例中的碰撞系统是如何工作的呢？\n\
    \n## 与障碍物的碰撞\n\n你从第 2 章还记得，所有应阻止精灵移动的瓦片都创建在一个名为`obstacles`的地图层上，如图 3-18 所示。\n\n\
    ![A346816_1_En_3_Fig18_HTML.jpg](img/A346816_1_En_3_Fig18_HTML.jpg)\n\n**图 3-18.**\
    \ 地图的障碍物层\n\n这导出一个漂亮的大数组，其中充满了代表障碍物的`gid`数字。但最重要的是，它也充满了零。数组中的任何`0`都表示“没有障碍物”。这意味着我们可以使用我们的小反证碰撞技巧。我们可以检查精灵碰撞区域的所有四个角是否都接触到了`0`单元格。如果任何一个不是`0`，我们就知道精灵撞到了障碍物。我们最终得到的代码几乎与我们早期迷宫游戏示例中用于检查迷宫墙壁的代码相同。以下是游戏循环中检查精灵是否接触障碍物的代码。如果接触了，代码会阻止精灵移动。\n\
    \n```\nlet obstaclesMapArray = world.getObject(\"obstacles\").data;\nlet elfVsGround\
    \ = g.hitTestTile(elf, obstaclesMapArray, 0, world, \"every\");\n\nif (!elfVsGround.hit)\
    \ {\n  //阻止精灵移动\n  elf.x -= elf.vx;\n  elf.y -= elf.vy;\n  elf.vx = 0;\n  elf.vy\
    \ = 0;\n}\n```\n\n如果你想知道精灵撞到了哪种类型的障碍物呢？你可以使用`collision.index`属性在地图数组中查找其`gid`编号。以下是从`obstacleMapArray`中查找`gid`编号的方法：\n\
    \n```\nobstaclesMapArray[elfVsGround.index]\n```\n\n如果精灵撞到了树的右侧，这将给出`33`。这意味着你现在可以获得关于精灵与环境交互情况的详细信息，并利用这些信息开始构建复杂的游戏逻辑。\n\
    \n### 与物品的碰撞\n\n你还会记得，当我们在 Tiled Editor 中设计游戏地图时，我们给物品瓦片赋予了这些名称属性：`skull`、`heart`和`marmot`。物品也被添加到了它们自己的图层上，如图\
    \ 3-19 所示。\n\n![A346816_1_En_3_Fig19_HTML.jpg](img/A346816_1_En_3_Fig19_HTML.jpg)\n\
    \n**图 3-19.** 物品瓦片位于它们自己的图层上，并具有名称属性\n\n我们可以在游戏代码中使用这些自定义名称属性来判断精灵正在接触哪些物品。让我们来看看如何实现。\n\
    \n首先，我们需要获取对物品图层的引用。\n\n```\nitemsLayer = world.getObject(\"items\");\n```\n\n\
    记住`itemsLayer`是一个精灵容器。它包含该图层上的所有精灵；只有三个：红心、骷髅头和土拨鼠。你可以在图层的`children`数组中访问这些精灵。因此下一步是获取对`itemsLayer.children`的引用。\n\
    \n```\nitems = itemsLayer.children;\n```\n\n现在我们有了一个名为`items`的数组，其中包含三个物品精灵。\n"
- fmt: "###### Note\n\nAlternatively, you might want to *clone* the array instead\
    \ of making a direct reference pointer to the original. You can clone the array\
    \ like this:\n\n```\nitems = itemsLayer.children.slice(0);\n```\n\nThe advantage\
    \ to cloning the array is that if you make changes to the `items` array, the original\
    \ `itemsLayer.children` array will remain unmodified. This could be very useful\
    \ if you need to reset the game to its original state.\n\nHow does the collision\
    \ between the elf and items work? No surprises! It’s exactly the same as the collision\
    \ between the bombs and alien in the earlier examples from this chapter. The only\
    \ addition is that, when a collision happens, a message is displayed on screen\
    \ for three seconds that gives you the name of the item the elf has collected.\n\
    \n```\nlet itemsMapArray = world.getObject(\"items\").data;\nlet elfVsItems =\
    \ g.hitTestTile(elf, itemsMapArray, 0, world, \"some\");\n\nif (!elfVsItems.hit)\
    \ {\nitems = items.filter(item => {\n\n  //Does the current item match the elf's\
    \ position?              \n  if (item.index === elfVsItems.index) {\n\n    //Display\
    \ the message              \n    message.visible = true;\n    message.content\
    \ = \"You found a \" + item.name;\n\n    //Make the message disappear after 3\
    \ seconds              \n    g.wait(3000, function() {\n      message.visible\
    \ = false;\n    });\n\n    //Remove the item              \n    itemsMapArray[item.index]\
    \ = 0;\n    g.remove(item);\n    return false;\n  } else {\n    return true;\n\
      }\n  });\n}\n```\n\nFigure [3-20](#A346816_1_En_3_Chapter.xhtml#Fig20) illustrates\
    \ the message that will appear onscreen when an item is collected.\n\n![A346816_1_En_3_Fig20_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig20_HTML.jpg)\n\
    \n###### Figure 3-20. Display the item’s name property\n\nTile-based collision:\
    \ solved!\n\n## Summary\n\nTile-based collision is one of the most useful game\
    \ design techniques you can learn. The simple systems that we used in this chapter\
    \ can be used as the basis for most, or all, of the collision you’ll need to do\
    \ in 2D action games. You now how to find an object’s location on world map, check\
    \ it for collisions with other other objects, react to those collisions, and update\
    \ the game world. You can use the general purpose `hitTestTile` function, along\
    \ with `getIndex` and `getPoints` for handling collisions for any 2D videogame\
    \ of any genre.\n\nBut would it surprise you if you I told you, yet again, that\
    \ “We’re not done yet!”? Now that you understand how to make an interactive tile-based\
    \ game world, a whole new universe of game design techniques has opened up to\
    \ you. Over the next few chapters we’re going to feast on all these new techniques:\
    \ influence maps, broadphase collision, pathfinding, procedural level generation\
    \ and, in the next chapter, isometric maps. I hope you’re hungry!\n\n© Rex van\
    \ der Spuy 2017\n\nRex van der Spuy, The Advanced Game Developer's Toolkit, 10.1007/978-1-4842-1097-0_4\n\
    \n# 4. Isometric Maps\n\nRex van der Spuy^(1)\n\n(1)Toronto, Ontario, Canada\n\
    \nNow that you know the basics of making tile-based games, let’s add a cool new\
    \ feature: **isometric projection**. Isometric projection is a shallow 3D effect\
    \ in which the game world appears to be rotated by 45 degrees and viewed from\
    \ above at a 30 degree angle. Figure [4-1](#A346816_1_En_4_Chapter.xhtml#Fig1)\
    \ shows a typical isometric map layout.\n\n![A346816_1_En_4_Fig1_HTML.gif](OEBPS/Images/A346816_1_En_4_Fig1_HTML.gif)\n\
    \n###### Figure 4-1. Isometric projection is a fixed-perspective 3D effect\n\n\
    Instead of squares, your map is made up of shapes that represent cubes, as seen\
    \ edge-on at an angle. It looks 3D, but there are two big differences between\
    \ isometric 3D and true 3D:\n\n- Isometric 3D has a permanently fixed perspective.\n\
    - Isometric 3D doesn’t have a horizon line, so the game world can appear to extend\
    \ endlessly beyond the edges of the world.\n\nIsometric maps are standard for\
    \ many genres of games, such as strategy and map-based adventure and role playing\
    \ games. Their strength is that, like 2D maps, they give the player a consistent\
    \ bird’s-eye view of the game world, so it’s easy to plot and plan your next move.\
    \ But the 3D perspective can give you a greater sensation of spatial immersion\
    \ than an ordinary 2D map can generally provide.\n\nIn this chapter you’ll learn\
    \ all the basics of how to make an isometric game map, including how to do the\
    \ following:\n\n- Move a game character around an isometric world.\n- Accurately\
    \ depth sort sprites.\n- Do collision detection between isometric sprites.\n-\
    \ Use a pointer to select isometric sprites, and match their onscreen locations\
    \ to their map array index positions.\n- How to set up and render an isometric\
    \ game world using Tiled Editor.\n\nLet’s find out how!\n\n## Isometric Basics\n\
    \nYou might be surprised to learn that the only new thing you need to know to\
    \ make an isometric game world is a little bit of easy math. Take a look at Figure\
    \ [4-2](#A346816_1_En_4_Chapter.xhtml#Fig2), which renders the same game map in\
    \ two ways.\n\n![A346816_1_En_4_Fig2_HTML.jpg](OEBPS/Images/A346816_1_En_4_Fig2_HTML.jpg)\n\
    \n###### Figure 4-2. Cartesian vs. Isometric rendering of the same map\n\nBoth\
    \ maps were created using identical map array data. The example on the left renders\
    \ the map using **Cartesian coordinates**. These are what we know as ordinary\
    \ `x` and `y` coordinates that align to the axis planes at right angles. The example\
    \ on the right renders the map using **isometric coordinates**. There’s only one\
    \ difference between the two maps: the tiles in the isometric map are just stretched\
    \ and rotated by 45 degrees. It’s the same map, just seen through a different\
    \ lens. What that means is that you can turn any ordinary Cartesian tile map into\
    \ an isometric tile map just by applying a simple mathematical conversion.\n\n\
    Here’s pretty much the only math you need to know to convert `x` and `y` points\
    \ between a flat Cartesian map and a 3D isometric map. To convert Cartesian `x`\
    \ and `y` points to isometric points, use this formula:\n\n```\nisoX = cartX -\
    \ cartY;\nisoY = (cartX + cartY) / 2;\n```\n\nTo convert isometric points to Cartesian,\
    \ use this formula:\n\n```\ncartX = (2 * isoY + isoX) / 2;\ncartY = (2 * isoY\
    \ - isoX) / 2;\n```\n\nThat’s all! The rest of the code you’ll be learning in\
    \ this chapter is essentially just giving you an easy way to convert between these\
    \ two coordinate systems, using these formulas."
