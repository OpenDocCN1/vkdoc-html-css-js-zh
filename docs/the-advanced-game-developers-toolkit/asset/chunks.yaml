    \ ID 编号比图块集中的网格编号小 1。\n\n###### 注意\n\n这些数字相差 1 是有一定逻辑的，但只有当你使用多个图块集来制作地图时才能体会到这一点。如果你确实使用了多个图块集，请继续阅读！`tileproperties`\
