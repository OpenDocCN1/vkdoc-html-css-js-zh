    \nThat means that even if the sprite is part way into the next cell, getIndex\
    \ won’t detect that its location has changed. It will only detect a change if\
    \ the sprite’s center point crosses the cell boundary. You can see in Figure 8-9\
    \ that even though the alien is touching the bomb, a collision isn’t detected\
    \ until the center of the alien enters the bomb’s cell. See Figure [3-9](#A346816_1_En_3_Chapter.xhtml#Fig9).\n\
    \n![A346816_1_En_3_Fig9_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig9_HTML.jpg)\n\
    \n###### Figure 3-9. The sprite’s center point is used to figure out its map location\n\
    \nThis might not be a problem, and in fact the effect seems completely natural\
    \ in this example. But for many kinds of collisions you’ll want to use the exact\
    \ edges of a sprite as the collision boundary. This is important for collisions\
    \ with things where there should be no overlap at all, such as with walls, or\
    \ for things were there should be an immediate reaction, like with fire.\n\nSo\
    \ how can you figure out whether the edge of a sprite is in a new map location?\
    \ Don’t use the center point. Instead, use each of the sprite’s 4 corner points.\
    \ Figure [3-10](#A346816_1_En_3_Chapter.xhtml#Fig10) shows where these four corner\
    \ points are.\n\n![A346816_1_En_3_Fig10_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig10_HTML.gif)\n\
    \n###### Figure 3-10. For more precision, check the locations of the sprite’s\
    \ 4 corners\n\nIt’s easy to calculate these. Use a getPoints function to calculate\
    \ and return an object that contains the x/y coordinates of these four points.\
    \ getPoints takes one argument: the sprite for which you find the corner points.\
    \ It returns an object with four sub-object properties that tell you the x and\
    \ y positions of the sprite’s corners: topLeft, topRight, bottomLeft, and bottomRight.\n\
    \n```\nfunction getPoints(s) {\n  return {\n    topLeft: {x: s.x, y: s.y},\n    topRight:\
    \ {x: s.x + s.width - 1, y: s.y},\n    bottomLeft: {x: s.x, y: s.y + s.height\
    \ - 1},\n    bottomRight: {x: s.x + s.width - 1, y: s.y + s.height - 1}\n  };\n\
    }\n```\n\n(The bottom and left corner points are 1 pixel less than the sprite’s\
    \ width and height so that the points remain inside the sprite, and not outside\
    \ it)."
  trans: "好的，作为一名高级文档工程师和翻译员，我将严格按照您给定的格式和注意事项，将以下英文文本翻译成中文。\n\n\n### 图 3-7. Tiled\
    \ Editor 中的三个地图图层\n\n`setup` 函数通过以下方式获取对外星人图层数据数组的引用：\n\n```\nalienMapArray =\
    \ world.getObject(\"alienLayer\").data;\n```\n\n然后，在游戏循环中每帧更新外星人的位置后，会调用 `updateMap`\
    \ 来更新数组中外星人的位置。\n\n```\nalienMapArray = updateMap(alienMapArray, alien, world);\n\
    ```\n\n这意味着 `alienMapArray` 将始终包含外星人的当前位置。\n\n炸弹的位置会在一个 `forEach` 循环中更新。循环结束后，会使用\
    \ `updateMap` 函数将每个炸弹的新位置更新到 `bombMapArray` 中。以下是实现此功能的代码：\n\n```\nbombSprites.forEach(bomb\
    \ => {\n\n//`atXEdge` 和 `atYEdge` 会根据精灵是否位于画布边缘返回 `true` 或 `false`           \
    \       \nlet atXEdge = (sprite, container) => {\n  return (sprite.x === 0 ||\
    \ sprite.x + sprite.width === container.width)\n}\nlet atYEdge = (sprite, container)\
    \ => {\n  return (sprite.y === 0 || sprite.y + sprite.width === container.height)\n\
    }\n\n//如果炸弹位于地图网格的列或行上，则改变其方向                  \nif (Math.floor(bomb.x) % world.tilewidth\
    \ === 0\n&& Math.floor(bomb.y) % world.tileheight === 0)\n{\n\n  //如果炸弹位于画布边缘，\
    \              \n  //则反转其速度以使其保持在内部              \n  if (atXEdge(bomb, g.canvas))\
    \ {\n    bomb.vx = -bomb.vx;\n  }\n  else if (atYEdge(bomb, g.canvas)) {\n   \
    \ bomb.vy = -bomb.vy;\n  }\n\n  //如果炸弹位于画布内部，则为其指定一个随机的新方向              \n  else\
    \ {\n    changeDirection(bomb);\n  }\n}\n\n//移动炸弹                  \nbomb.x +=\
    \ bomb.vx;\nbomb.y += bomb.vy;\n});\n```\n\n现在，`bombMapArray` 将包含当前帧中炸弹位置的最新记录。您会注意到在上面的代码中，每当炸弹位于网格单元格中心时，就会调用一个名为\
    \ `changeDirection` 的函数——接下来我们来看看它是如何工作的。\n\n### 为炸弹指定随机方向\n\n炸弹只有在与网格行或列对齐时才会改变方向。并且，如果炸弹位于画布边缘，则无法改变方向，这可以防止生成无效的数组索引号。以下是\
    \ `changeDirection` 函数，它在满足这些条件时被调用。\n\n```\n//方向改变辅助函数                  \nfunction\
    \ changeDirection(sprite) {\n  let up = 1,\n    down = 2,\n    left = 3,\n   \
    \ right = 4,\n    direction = g.randomInt(1, 4);\n\n  switch (direction) {\n \
    \   case right:\n      sprite.vx = 2;\n      sprite.vy = 0;\n      break;\n\n\
    \    case left:\n      sprite.vx = -2;\n      sprite.vy = 0;\n      break;\n\n\
    \    case up:\n      sprite.vx = 0;\n      sprite.vy = -2;\n      break;\n\n \
    \   case down:\n      sprite.vx = 0;\n      sprite.vy = 2;\n      break;\n  }\n\
    }\n```\n\n这只是一个非常简单的 switch 语句，它改变精灵的速度以匹配其随机分配的方向。\n\n### 碰撞检测\n\n如果您在任何时候快照\
    \ `alienMapArray` 或 `bombMapArray`，您会发现它们的内容与画布上精灵的位置相匹配，如图 3-8 所示。\n\n![A346816_1_En_3_Fig8_HTML.gif](img/A346816_1_En_3_Fig8_HTML.gif)\n\
    \n###### 图 3-8. 实时更新精灵的地图位置\n\n碰撞是通过比较这两个数组来检测的。代码遍历 `bombMapArray`，检查每个索引位置的\
    \ `gid` 是否为 `5`。如果是，并且 `alienMapArray` 在相同索引号处有 `4`，则发生碰撞。然后代码会过滤掉该位置上的任何炸弹精灵。（该位置可能不止一个炸弹）。当找到匹配项时，炸弹会从地图中清除，并且精灵会被移除。\n\
    \n```\nbombMapArray.forEach((gid, index) => {\n\n  //外星人是否与炸弹具有相同的索引号？       \
    \       \n  if (alienMapArray[index] === 4 && gid === 5) {\n\n    //是的，因此过滤掉该位置上的所有炸弹精灵\
    \              \n    //（可能不止一个）              \n    bombSprites = bombSprites.filter(bomb\
    \ => {\n      if (bomb.index === index) {\n\n        //从数组中移除炸弹的 gid 编号      \
    \        \n        bombMapArray[bomb.index] = 0;\n\n        //从 `bombLayer` 组中移除炸弹\
    \              \n        g.remove(bomb);\n        return false;\n      } else\
    \ {\n        return true;\n      }\n    });\n  }\n});\n```\n\n到目前为止，所有这些示例都展示了如何使用精灵的中心点来检测碰撞。但对于许多游戏来说，您需要更高的精度。接下来，我们来看看如何使我们的碰撞检测更精确一些。\n\
    \n## 使用角点\n\n我们的碰撞系统到目前为止的一个局限是，我们只使用精灵的中心 x/y 点来确定其地图数组位置。\n\n```\nsprite.index\
    \ = getIndex\n  sprite.centerX, sprite.centerY,\n  world.tilewidth, world.tileheight,\
    \ world.widthInTiles\n);\n```\n\n这意味着，即使精灵部分进入了相邻的单元格，`getIndex` 也不会检测到其位置发生了变化。只有当精灵的中心点穿过单元格边界时，它才会检测到变化。您可以在图\
    \ 8-9 中看到，即使外星人碰到了炸弹，也只有在外星人的中心进入炸弹所在的单元格时，才会检测到碰撞。见图 3-9。\n\n![A346816_1_En_3_Fig9_HTML.jpg](img/A346816_1_En_3_Fig9_HTML.jpg)\n\
    \n###### 图 3-9. 使用精灵的中心点来确定其地图位置\n\n这可能不是问题，事实上，在这个示例中，这种效果看起来非常自然。但对于许多类型的碰撞，您可能希望使用精灵的精确边缘作为碰撞边界。这对于与墙壁等不应有任何重叠的物体，或者与火焰等需要立即反应的物体的碰撞来说非常重要。\n\
    \n那么，如何确定精灵的边缘是否位于新的地图位置呢？不要使用中心点。而是使用精灵的 4 个角点。图 3-10 显示了这四个角点的位置。\n\n![A346816_1_En_3_Fig10_HTML.gif](img/A346816_1_En_3_Fig10_HTML.gif)\n\
    \n###### 图 3-10. 为获得更高精度，请检查精灵的 4 个角的位置\n\n计算这些点很容易。使用 `getPoints` 函数来计算并返回一个包含这四个点\
    \ x/y 坐标的对象。`getPoints` 接受一个参数：要查找其角点的精灵。它返回一个对象，该对象有四个子对象属性，分别表示精灵四个角的位置：`topLeft`、`topRight`、`bottomLeft`\
    \ 和 `bottomRight`。\n\n```\nfunction getPoints(s) {\n  return {\n    topLeft: {x:\
    \ s.x, y: s.y},\n    topRight: {x: s.x + s.width - 1, y: s.y},\n    bottomLeft:\
    \ {x: s.x, y: s.y + s.height - 1},\n    bottomRight: {x: s.x + s.width - 1, y:\
    \ s.y + s.height - 1}\n  };\n}\n```\n\n（底部和左侧的角点比精灵的宽度和高度小 1 像素，这样这些点就保持在精灵内部，而不是外部）。\n"
- fmt: "###### Note\n\nWhy use `“s”` instead of `“sprite”` in the `getCorners` function?\
    \ Although I usually recommend using descriptive variable names, you can make\
    \ dense and repetitive math calculations more compact and readable by using an\
    \ obvious shorthand.\n\nNow instead of just checking the sprite’s center point\
    \ to find the map location, check all four corner points. If they have the same\
    \ index as the `gid` of the sprite you’re interested in, you have a collision.\n\
    \nFirst, use the above `getPoints` function to find the sprite’s four corner points.\n\
    \n```\nsprite.collisionPoints = getPoints(sprite);\n```\n\nCreate a `collisionGid`\
    \ variable that stores the `gid` of the cell you want to check for a collision\
    \ with the sprite.\n\n```\nlet collisionGid = 5;\n```\n\nYou also need a `mapArray`\
    \ that contains sprites that have the above `collisionGid`.\n\n```\nlet mapArray\
    \ = anyMapArray;\n```\n\nThen loop through all four points and call a custom `checkPoints`\
    \ function for each point.\n\n```\nlet hit = Object.keys(sprite.collisionPoints).some(checkPoints);\n\
    ```\n\nThe `checkPoints` function returns `true` if any of the corner points are\
    \ intersecting the cells in the `mapArray` that have the same `gid` as the `collisionGid`\
    \ that we’re interested in.\n\n```\nfunction checkPoints(key) {\n\n  //Get a reference\
    \ to the current point to check.            \n  //(`topLeft`, `topRight`, `bottomLeft`\
    \ or `bottomRight` )            \n  let point = sprite.collisionPoints[key];\n\
    \n  //Find the point's index number in the map array            \n  let index\
    \ = getIndex(\n    point.x, point.y,\n    world.tilewidth, world.tileheight, world.widthInTiles\n\
    \  );\n\n  //Find out what the gid value is in the map position            \n\
    \  //that the point is currently over            \n  let currentGid = mapArray[index];\n\
    \n  //If it matches the value of the gid that we're interested, in           \
    \ \n  //then there's been a collision            \n  if (currentGid === collisionGid)\
    \ {\n    return true;\n  } else {\n    return false;\n  }\n}\n```\n\nThe above\
    \ code will return `true` if *some* of the corners (at least one) are touching\
    \ the cell you’re interested in. That’s because we used JavaScript’s `some` array\
    \ method:\n\n```\nvar hit = Object.keys(sprite.collisionPoints).some(checkPoints);\n\
    ```\n\nThe loop will quit and the function will return `true` as soon as it finds\
    \ the first corner point in the collision. That means that if at the first point,\
    \ the sprite’s `topLeft` corner gets a hit, the loop will return `true` right\
    \ away and not bother checking the other points. This is useful to ensure an immediate\
    \ reaction to touching something.\n\nBut what if you want to detect a collision\
    \ only if every corner point is touching the cell you’re interested in? Use JavaScript’s\
    \ `every` array method, like this:\n\n```\nvar hit = Object.keys(sprite.collisionPoints).every(checkPoints);\n\
    ```\n\nIn this case, `hit` will only become `true` if every corner point is involved\
    \ in the collision. This is useful for ensuring that a sprite is completely inside\
    \ a cell, or covering another sprite. You can use this to very efficiently test\
    \ whether all four corners of a sprite are on the floor of the maze, so that the\
    \ sprite doesn’t walk through any walls. (You’ll see how to do this in the examples\
    \ ahead).\n\nNow that you know whether or you have a hit, use the index number\
    \ to find the matching sprite at that same map location. This just a variation\
    \ on the same code you’ve seen in previous examples:\n\n```\nif (hit) {\n  enemySprites.some((enemy)\
    \ => {\n    if (enemy.index === collisionIndex) {\n\n      //This is the sprite\
    \ you're interested in            \n    }\n  });\n}\n```\n\nBefore we go any further,\
    \ let’s consolidate all this new code.\n\n### A Reusable Tile-Based Collision\
    \ Function\n\nYou can see now how useful tile-based collision can be for a wide\
    \ variety of different game situations. To make our lives a little easier, I’ve\
    \ whipped up a general-purpose `hitTestTile` function so that you can implement\
    \ tile-based collision with just one line of code. You can drop it into any game\
    \ with sprites that have the same properties that we’ve been using in this book.\
    \ The function checks for a collision between a sprite and a tile `gid` number\
    \ on any map array. The function also lets you set the type of collision you want\
    \ to check for: the center point, some corner points, or every corner point. Here’s\
    \ how to use it:\n\n```\nlet collisionObject = hitTestTile(sprite, mapArray, collisionGid,\
    \ worldObject, pointsToCheck);\n```\n\n`hitTestTile` returns a collision object\
    \ that contains these two properties:\n\n*   `collision.hit`: A Boolean value\
    \ that will be true if a collision occurred.\n\n*   `collision.index`: A number\
    \ that tells you the collision’s map array location.\n\nYou can use these two\
    \ properties to figure out how to handle the collision.\n\nThe fourth argument,\
    \ `worldObject`, is an object that defines the tile-based game world. It needs\
    \ to have these properties:\n\n```\nworld.tilewidth\nworld.tileheight\nworld.widthInTiles\n\
    ```\n\n(The `widthInTiles` is a number that represents the number of columns in\
    \ your tile map).\n\nThe `makeTiledWorld` function that we’ve been using in the\
    \ last two chapters automatically returns a world object with these properties\
    \ for you. But if you are generating your world map from code, without using Tiled\
    \ Editor, you can still use `hitTestTile` as long as you pass it your own world\
    \ object with those same three properties.\n\nThe last argument, `pointsToCheck`,\
    \ determines which points on the sprite to check for a collision. You can use\
    \ either of these three string options:\n\n```\n\"every\"\n\"some\"\n\"center\"\
    \n```\n\nHere’s the complete `hitTestTile` function. There’s no new code here,\
    \ it’s just a reworking of the same techniques we’ve used in earlier examples.\n\
    \n```\nhitTestTile(sprite, mapArray, gidToCheck, world, pointsToCheck) {\n\n \
    \ //The `checkPoints` helper function loops through the sprite's corner points\
    \ to              \n  //find out if they are inside an array cell that you're\
    \ interested in.              \n  //Return `true` if they are              \n\
    \  let checkPoints = key => {\n\n    //Get a reference to the current point to\
    \ check.              \n    //(`topLeft`, `topRight`, `bottomLeft` or `bottomRight`\
    \ )              \n    let point = sprite.collisionPoints[key];\n\n    //Find\
    \ the point's index number in the map array              \n    collision.index\
    \ = this.getIndex(\n      point.x, point.y,\n      world.tilewidth, world.tileheight,\
    \ world.widthInTiles\n    );\n\n    //Find out what the gid value is in the map\
    \ position              \n    //that the point is currently over             \
    \ \n    collision.gid = mapArray[collision.index];\n\n    //If it matches the\
    \ value of the gid that we're interested, in              \n    //then there's\
    \ been a collision              \n    if (collision.gid === gidToCheck) {\n  \
    \    return true;\n    } else {\n      return false;\n    }\n  };\n\n  //Assign\
    \ \"some\" as the default value for `pointsToCheck`              \n  pointsToCheck\
    \ = pointsToCheck || \"some\";\n\n  //The collision object that will be returned\
    \ by this function              \n  let collision = {};\n\n  //Which points do\
    \ you want to check?              \n  //\"every\", \"some\" or \"center\"?   \
    \           \n  switch (pointsToCheck) {\n    case \"center\":\n\n      //`hit`\
    \ will be true only if the center point is touching              \n      let point\
    \ = {\n        center: {\n          x: sprite.centerX,\n          y: sprite.centerY\n\
    \        }\n      };\n      sprite.collisionPoints = point;\n      collision.hit\
    \ = Object.keys(sprite.collisionPoints).some(checkPoints);\n      break;\n\n \
    \   case \"every\":\n\n      //`hit` will be true if every point is touching \
    \             \n      sprite.collisionPoints = this.getPoints(sprite);\n     \
    \ collision.hit = Object.keys(sprite.collisionPoints).every(checkPoints);\n  \
    \    break;\n\n    case \"some\":\n```"
