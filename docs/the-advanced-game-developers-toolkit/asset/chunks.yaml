    \ most important techniques that every game developer needs to know: how to determine\
    \ the line of sight. And, you now know how to use a line of sight in both a geometry-based\
    \ and a tile-based collision environment. As you’ll see in the chapters ahead,\
    \ all these skills are useful not just for pathfinding, but also as the basis\
    \ for building rudimentary AIs. And, of course, you can use these exact same techniques\
    \ with your isometric game maps!\n\nThe skills you’ve learned in this chapter\
    \ will take you quite far, but there’s one more important pathfinding skill you\
    \ need to know: how to find the the shortest path between two points. That’s what\
    \ the next chapter is all about!\n\n© Rex van der Spuy 2017\n\nRex van der Spuy,\
    \ The Advanced Game Developer's Toolkit, 10.1007/978-1-4842-1097-0_6"
  trans: "\n### `tileBasedLineOfSight` 函数\n\n下面是一个全新的 `tileBasedLineOfSight` 函数，它实现了基于瓦片的碰撞检测，并将角度限制为\
    \ 90 度。你将在后文学习如何在游戏中使用它。\n\n```javascript\nfunction tileBasedLineOfSight(\n  spriteOne,\
    \    //第一个精灵，包含 `centerX` 和 `centerY` 属性              \n  spriteTwo,    //第二个精灵，包含\
    \ `centerX` 和 `centerY` 属性              \n  mapArray,     //地图瓦片数组           \
    \   \n  world,        //`world` 对象，包含 `tilewidth`、`tileheight`              \n\
    \                //和 `widthInTiles` 属性              \n  emptyGid = 0, //代表空瓦片的\
    \ Gid，通常为 `0`              \n  segment = 32, //碰撞点之间的间距              \n  angles\
    \ = []   //你想将视线限制在其中的角度数组              \n) {\n\n//计算 spriteTwo 和 spriteOne 之间的向量\
    \              \n  let vx = spriteTwo.centerX - spriteOne.centerX,\n      vy =\
    \ spriteTwo.centerY - spriteOne.centerY;\n\n//求向量的长度（以像素为单位）              \n \
    \ let magnitude = Math.sqrt(vx * vx + vy * vy);\n\n//我们需要测试多少个点？             \
    \ \n  let numberOfPoints = magnitude / segment;\n\n//创建一个从 `spriteOne` 延伸到 `spriteTwo`\
    \ 的 x/y 点数组              \n  let points = () => {\n\n//初始化一个数组，用于存储所有沿向量的点   \
    \           \n    let arrayOfPoints = [];\n\n//为向量的每个段创建一个点对象，并存储其 x/y 坐标    \
    \          \n    //以及在地图数组中的索引号              \n    for (let i = 1; i <= numberOfPoints;\
    \ i++) {\n\n//计算本次循环迭代的新长度              \n      let newMagnitude = segment * i;\n\
    \n//求单位向量              \n      let dx = vx / magnitude,\n          dy = vy / magnitude;\n\
    \n//使用单位向量和 newMagnitude 计算本次循环迭代中              \n      //下一个点的 x/y 位置       \
    \       \n      let x = spriteOne.centerX + dx * newMagnitude,\n          y =\
    \ spriteOne.centerY + dy * newMagnitude;\n\n//`getIndex` 函数将 x/y 坐标转换为       \
    \       \n      //地图数组的索引位置编号              \n      let getIndex = (x, y, tilewidth,\
    \ tileheight, mapWidthInTiles) => {\n\n//将像素坐标转换为地图索引坐标              \n      \
    \  let index = {};\n        index.x = Math.floor(x / tilewidth);\n        index.y\
    \ = Math.floor(y / tileheight);\n\n//返回索引号              \n        return index.x\
    \ + (index.y * mapWidthInTiles);\n      };\n\n//找出这个 x 和 y 点对应的地图索引号         \
    \     \n      let index = getIndex(\n        x, y,\n        world.tilewidth,\n\
    \        world.tileheight,\n        world.widthInTiles\n      );\n\n//将该点存入 `arrayOfPoints`\
    \ 数组              \n      arrayOfPoints.push({\n        x, y, index\n      });\n\
    \    }\n\n//返回数组              \n    return arrayOfPoints;\n  };\n\n//基于瓦片的碰撞检测。\
    \              \n  //如果向量的所有瓦片索引号均为 `0`（表示没有墙壁），              \n  //则 `noObstacles`\
    \ 函数返回 `true`。如果其中任何一个不为 0，              \n  //则函数返回 `false`，表示路径中有墙壁阻挡      \
    \        \n  let noObstacles = points().every(point => {\n      return mapArray[point.index]\
    \ === emptyGid\n  });\n\n//将视线限制为仅直角方向              \n  //（我们不希望使用对角线）       \
    \       \n  let validAngle = () => {\n\n//计算两个精灵之间向量的角度              \n    let\
    \ angle = Math.atan2(vy, vx) * 180 / Math.PI;\n\n//如果角度与有效角度之一匹配，返回 `true`，否则返回\
    \ `false`              \n    if (angles.length !== 0) {\n      return angles.some(x\
    \ => x === angle);\n    } else {\n      return true;\n    }\n  };\n\n//如果没有障碍物且视线角度为\
    \ 90 度，则返回 `true`              \n  if (noObstacles === true && validAngle() ===\
    \ true) {\n    return true;\n  } else {\n    return false;\n  }\n}\n```\n\n搞定！这就是基于瓦片的视线检测。\n\
    \n## 总结\n\n本章涵盖了你开始学习寻路所需的所有基础知识。你已经学会了如何分析和解读精灵所处的环境，并利用这些信息来决定精灵的移动方向——应该选择随机方向，还是最接近目标的方向？你还学会了一项每位游戏开发者都必须掌握的重要技术：如何确定视线。现在，你知道了如何在基于几何和基于瓦片的碰撞环境中使用视线。正如你在后续章节中将要看到的，所有这些技能不仅对寻路有用，也是构建基础\
    \ AI 的基础。当然，你完全可以把这些相同的技术应用到你的等距游戏地图中！\n\n本章学到的技能会让你走得很远，但还有一项重要的寻路技能你需要掌握：如何找到两点之间的最短路径。这正是下一章的全部内容！\n\
    \n© Rex van der Spuy 2017\n\nRex van der Spuy, *高级游戏开发者工具包*, 10.1007/978-1-4842-1097-0_6\n"
- fmt: '# 6. Finding the Shortest Path


    Rex van der Spuy


    (1) Toronto, Ontario, Canada


    There is one last major area of pathfinding we need to tackle: finding the shortest
    path through a maze. As it turns out, this is not just an interesting aside, but
    one of the most important game design skills you need to know.


    All the player control systems that we’ve covered in the book so far have involved
    moving the player around the screen with the keyboard or the mouse. But games
    often employ a point-and-click control system. Point the mouse to some place on
    the map and click. The character will walk there and magically seem to find the
    shortest path to the destination while cleverly sidestepping any obstacles. Graphical
    adventure games use this control system, as do almost all strategy and turn-based
    games. How does it work? That’s exactly what you’re going to find out in this
    chapter!


    Moving a character along the shortest path is really a two-part process:


    1. **Find the shortest path**: This involves testing all the most likely tiles
    between the start point and the destination. You need to figure out which tiles
    will get you to the destination sooner, and which contain obstacles to avoid.
    At the end of this testing, you end up with an array of tiles that tell you the
    shortest path.

    2. **Follow the tiles in the path**: The arrays of tiles you end up with are like
    breadcrumbs that the game character can follow. Tell the character to follow these
    crumbs from its start position to the destination.


    If the first step seems like it might be rather complex, it is! But the good news
    is that excellent solutions have been found already. That means you don’t need
    to worry about coming up with your own solution — you can just choose a ready-made
    one and implement it in your game.


    There are a number of different pathfinding algorithms you can use, including
    best-first, breadth-first, and Dijkstra’s algorithm. All will do a reasonable
    job of solving the problem. But the best is generally regarded to be A* (A star).
    The A* algorithm has the overall best performance, and it is extremely flexible.
    If there’s only one pathfinding algorithm you should learn, A* is it.


    A* was developed in the 1960s by Peter Hart, Nils Nilsson, and Bertram Raphael.
    It’s a modification to Dijkstra’s algorithm, a pathfinding algorithm that was
    postulated in the 1950s by pioneering computer scientist Edsger Dijkstra.


    Before I show you how to use A* in a game, let’s take a detailed look at how the
    algorithm works.


    ## Understanding A*


    We can be proud of our evolutionary ancestors. Thanks to good pathfinding ability,
    they all successfully evaded larger protozoa, sidestepped gnashing dinosaur teeth,
    and avoided ending up as fossilized remains at the bottom of the Sterkfontein
    caves. Pathfinding is a skill that is as essential to being able to survive as
    a tree frog in the Amazon as it is to being able to catch the bus in the morning.
    It’s a survival skill that allows you to automatically figure out the shortest
    path from point A to point B without being eaten, dying of starvation, or being
    late for work. One glance at Figure 6-1, and you’ll immediately be able to see
    the shortest path between point A and point B. Pathfinding is part of our DNA.


    ![A346816_1_En_6_Fig1_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig1_HTML.jpg)


    ###### Figure 6-1. What’s the shortest path between point A and point B? It’s
    obvious to us humans, but how do you explain it to a computer?


    Computers, on the other hand, are like pampered, prize-winning, Persian lap cats.
    They sit around all day, spend far too much time on the Internet, and sleep a
    lot. They haven’t had their skills honed through countless millennia of fighting
    it out in the primordial soup as we have. We need to tell them in the bluntest
    growl possible, “This path good!” or “This path not good!” and practically threaten
    them with a gnarled club.


    But what is a “good path”? In the case of finding the shortest path, it’s the
    one that gets you to your destination sooner. The problem is that computers can’t
    see the big picture. They can see only one small step at a time. So the strategy
    for telling a computer how to find the shortest path goes something like this:


    - Break the entire path into many small steps.

    - For each step, figure out which step to take next.

    - Take that next step, and repeat the process until you get where you’re supposed
    to be.


    But the computer must still be able to tell the difference between a good path
    and a bad path. Let’s see how to help it figure that out.


    ### Calculating Costs


    Solve this riddle:


    A newspaper is delivered to your front door every morning. What’s the least expensive
    way of picking it up?


    A. Opening the front door.


    B. Walking out the back door, jumping over your garden fence, running down the
    alley, hailing a taxicab, and riding around the block to your front door?


    Option A was free, but option B cost you about $4.75 in cab fare. This means that
    option B is more expensive.


    `Expensive` is the term that the A* algorithm uses to describe how much work it
    takes to travel between two points. A* figures out the least expensive routes
    to a destination. It does this by assigning a cost to every possible step you
    can take on the path. The step with the lowest cost is the better step to take.
    A* works by finding the lowest cost moves and the least expensive paths.


    A* has its own set of terms and vocabulary. Cost and expense are two of those
    terms and, as you’ll see, they’re a convenient way to describe some of its core
    concepts. I’ll be introducing a few other specific A* terms ahead. Keep a special
    lookout for the terms `node` and `heuristic`, coming up soon!


    Figure 6-2 explains what I mean by cost. Imagine that you’re a bacterium in a
    Petri dish, free floating, and minding your own business at point A. Suddenly,
    the shadow of a huge, hungry single-celled amoeba looms over you with the lone
    goal of subsuming your cellular matter. You know you’re in trouble if you don’t
    hide right away. There are only two places you can hide: point B or point C. You
    have a split second to decide which is the closest.


    ![A346816_1_En_6_Fig2_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig2_HTML.jpg)


    ###### Figure 6-2. Which is closest to A: B or C?


    In the example in Figure 6-2, traveling to point B takes about one-third longer
    than traveling to point C. In fact, it takes exactly 1.41 times longer to travel
    to point B from point A. That means that point C is where you need to swim to
    escape that amoeba. The value 1.41 is the cost of traveling diagonally.


    In a rectangular grid-based game world, there are only two choices of movement,
    and each has a cost:


    - **Diagonally**: The cost is 14.

    - **Directly across**: Going horizontally or vertically, the cost is 10.


    It doesn’t really matter what those costs are, as long as they proportionately
    represent the amount of time it takes to move in those directions. So, 14 versus
    10 is the same proportion as 1.4 versus 1, and we conveniently don’t need to worry
    about decimal numbers. You can certainly use 1.4 and 1 in your own code if you
    prefer. Figure 6-3 shows the cost of movement between cells.


    ![A346816_1_En_6_Fig3_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig3_HTML.jpg)


    ###### Figure 6-3. The cost of traveling through cells


    Now we have a way of describing to the computer what a good path is: the one with
    the lowest cost.


    Figure 6-4 shows two possible paths from A to B. Not only can you clearly see
    that path 1 is the shortest, but it also happens to be the least expensive.


    ![A346816_1_En_6_Fig4_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig4_HTML.jpg)'
