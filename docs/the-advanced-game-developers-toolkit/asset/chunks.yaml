    } else if (wayPoints2DArray[0][0] > alien.x) {

    alien.vx = 4;

    alien.vy = 0;


    // 向上

    } else if (wayPoints2DArray[0][1] < alien.y) {

    alien.vx = 0;

    alien.vy = -4;


    // 向下

    } else if (wayPoints2DArray[0][1] > alien.y) {

    alien.vx = 0;

    alien.vy = 4;

    }


    // 移除当前路径点，这样下一次

    // `wayPoints2DArray` 中的第一个元素就能正确指向

    // 外星人精灵要移动到的下一个路径点。

    wayPoints2DArray.shift();


    // 如果没有剩余的路径点了，

    // 则将外星人的速度设为 0

    } else {

    alien.vx = 0;

