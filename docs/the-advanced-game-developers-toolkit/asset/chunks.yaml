  trans: "\n###### 注意\n\n此代码清单展示了 Hexi 游戏引擎如何实现 `makeTiledWorld`，其中包含一些你应该了解的具体实现细节。`Container`\
    \ 和 `Sprite` 是 PixiJS 对象。Pixi 的资源加载器用于加载 JSON 文件。（Hexi 使用 PixiJS 作为其底层渲染引擎和资源加载器）。`frame`\
    \ 函数是 Hexi 引擎内置的一个自定义函数，用于从单个父图像中捕获矩形子图像。你需要在你所使用的任何技术中找到这些细节的等效实现。\n\n```\nmakeTiledWorld(jsonTiledMap,\
    \ tileset) {\n\n//获取 JSON 文件的引用            \n  let tiledMap = PIXI.loader.resources[jsonTiledMap].data;\n\
    \n//创建一个名为 `world` 的容器组，用于包含来自 `tiledMap` 的所有图层、精灵            \n  //和对象。`world`\
    \ 对象将在 `makeTiledWorld`            \n  //函数完成后返回给主游戏程序            \n  let world\
    \ = new Container();\n\n//设置构成地图的每个图块的宽度和高度。            \n  //（本例中图块大小为 32x32\
    \ 像素）            \n  world.tileheight = tiledMap.tileheight;\n  world.tilewidth\
    \ = tiledMap.tilewidth;\n\n//计算世界的 `width` 和 `height`，单位为像素            \n  world.worldWidth\
    \ = tiledMap.width * tiledMap.tilewidth;\n  world.worldHeight = tiledMap.height\
    \ * tiledMap.tileheight;\n\n//获取世界（以图块计）的高度和宽度引用，            \n  //以备后续使用（你会用到的！）\
    \            \n  world.widthInTiles = tiledMap.width;\n  world.heightInTiles =\
    \ tiledMap.height;\n\n//创建一个 `objects` 数组，用于存储对地图中任何            \n  //命名对象的引用。命名对象都具有\
    \            \n  //在 Tiled Editor 中分配的 `name` 属性            \n  world.objects\
    \ = [];\n\n//每个图块周围的可选间距（填充）            \n  //这部分是为了解决图块周围的间距问题，            \n\
    \  //该间距在使用纹理图集图块集时很常见。在 Tiled Editor 中创建新地图时设置            \n  //`spacing` 属性\
    \            \n  let spacing = tiledMap.tilesets[0].spacing;\n\n//计算图块集上有多少列。\
    \            \n  //这等于图像的宽度除以每个图块的宽度，            \n  //再加上每个图块周围可能有的可选间距     \
    \       \n  let numberOfTilesetColumns =\n    Math.floor(\n      tiledMap.tilesets[0].imagewidth\n\
    \      / (tiledMap.tilewidth + spacing)\n    );\n\n//遍历所有地图图层            \n  tiledMap.layers.forEach(tiledLayer\
    \ => {\n\n//为此图层创建一个容器组，并复制            \n    //该图层的所有属性到该组上            \n    let\
    \ layerGroup = new Container();\n\nObject.keys(tiledLayer).forEach(key => {\n\n\
    //将图层的所有属性添加到组中，但不包括            \n      //宽度和高度（因为容器组会根据其内容自行计算这些值）          \
    \  \n      if (key !== \"width\" && key !== \"height\") {\n        layerGroup[key]\
    \ = tiledLayer[key];\n      }\n    });\n\n//将 Tiled Editor 的 `opacity` 属性转换为 Container\
