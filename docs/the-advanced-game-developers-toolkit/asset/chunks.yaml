- fmt: "### Tile-Based Collision for Role Playing Games\n\nPlay through the `fantasy.html`\
    \ prototype example from Chapter [1](#A346816_1_En_1_Chapter.xhtml) to re-acquaint\
    \ yourself with how it behaves. You’ll notice that the elf character can collide\
    \ with two types of things:\n\n- Obstacles that prevent movement: the bottoms\
    \ of trees, the bottoms of walls, and the bottoms of bushes.\n- Items that can\
    \ be collected: the heart, the skull, and the marmot.\n\nFigure [3-15](#A346816_1_En_3_Chapter.xhtml#Fig15)\
    \ illustrates this. The collision mechanics are all based on the tile-based collision\
    \ system we learned in the previous few sections. But there are a few interesting\
    \ new details, which far from being edge-cases, are typical of collision problems\
    \ you’ll need to solve for many kinds of games.\n\n![A346816_1_En_3_Fig15_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig15_HTML.jpg)\n\
    \n**Figure 3-15.** Obstacles block movement and items can be collected\n\n###\
    \ Defining the Collision Area\n\nAll the tiles in the game map are comprised of\
    \ graphics that neatly fill 32 by 32 pixel square tiles. The elf character, however,\
    \ doesn’t follow this pattern. Its sprite size is 64 by 64 pixels, and the actual\
    \ size of the character illustration is 28 by 52 pixels. Figure [3-16](#A346816_1_En_3_Chapter.xhtml#Fig16)\
    \ illustrates this.\n\n![A346816_1_En_3_Fig16_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig16_HTML.gif)\n\
    \n**Figure 3-16.** All the sizes are different\n\nThis wasn’t an issue in the\
    \ maze game examples, because the tile sizes, sprite sizes, and maze cell grid\
    \ sizes were all exactly the same: 64x64 pixels. What do we do now?\n\nRelax!\
    \ Just create a collision area on the elf. The collision area defines which part\
    \ of the elf should be sensitive to collisions. In this game, I only want the\
    \ area of the elf’s body below its head to react to collisions. It’s a square\
    \ area of 20 by 20 pixels, that you can see in Figure [3-17](#A346816_1_En_3_Chapter.xhtml#Fig17).\
    \ It’s offset by the top of the sprite by 44 pixels, and offset on the left by\
    \ 22 pixels.\n\n![A346816_1_En_3_Fig17_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig17_HTML.gif)\n\
    \n**Figure 3-17.** The sprite’s collision area\n\nThis preserves the shallow 2.5D\
    \ depth effect because it means the elf’s head won’t bump into things that are\
    \ visually above it but on a lower depth layer – like the tops of walls or trees.\n\
    \nTo set this up in our game code we just need to create a `collisionArea` object\
    \ on the elf sprite that defines this shape. Here’s the bit of code from the game’s\
    \ setup function that does this.\n\n```\nelf.collisionArea = {\n  x: 22,\n  y:\
    \ 44,\n  width: 20,\n  height: 20\n};\n```\n\n(Refer to the `fantasy.js` source\
    \ file from Chapter [1](#A346816_1_En_1_Chapter.xhtml) to see this code in its\
    \ full context).\n\nNow, instead of using the sprite’s four corner points, do\
    \ a collision check using the four corner points of this new `collisionArea`.\
    \ To implement this, use this new version of the `getPoints` function.\n\n```\n\
    getPoints(s) {\n  let ca = s.collisionArea;\n  if (ca !== undefined) {\n    return\
    \ {\n      topLeft: {\n        x: s.x + ca.x,\n        y: s.y + ca.y\n      },\n\
    \      topRight: {\n        x: s.x + ca.x + ca.width,\n        y: s.y + ca.y\n\
    \      },\n      bottomLeft: {\n        x: s.x + ca.x,\n        y: s.y + ca.y\
    \ + ca.height\n      },\n      bottomRight: {\n        x: s.x + ca.x + ca.width,\n\
    \        y: s.y + ca.y + ca.height\n      }\n    };\n  } else {\n    return {\n\
    \      topLeft: {\n        x: s.x,\n        y: s.y\n      },\n      topRight:\
    \ {\n        x: s.x + s.width - 1,\n        y: s.y\n      },\n      bottomLeft:\
    \ {\n        x: s.x,\n        y: s.y + s.height - 1\n      },\n      bottomRight:\
    \ {\n        x: s.x + s.width - 1,\n        y: s.y + s.height - 1\n      }\n \
    \   };\n  }\n}\n```\n\nYou can now set a custom collision area for any sprites\
    \ in the game. Now how does the collision system in the fantasy RPG game example\
    \ work?\n\n## Collisions with Obstacles\n\nYou’ll remember from Chapter [2](#A346816_1_En_2_Chapter.xhtml)\
    \ that all the tiles that should prevent the elf from moving were created on a\
    \ map layer called `obstacles`, shown in Figure [3-18](#A346816_1_En_3_Chapter.xhtml#Fig18).\n\
    \n![A346816_1_En_3_Fig18_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig18_HTML.jpg)\n\
    \n**Figure 3-18.** The map’s obstacles layer\n\nThis exports as a nice fat array\
    \ that is full of `gid` numbers representing the obstacles. But, most importantly,\
    \ it’s also full of zeros. Any `0` in the array means “no obstacle.” That means\
    \ we can use our little inverse collision trick. We can check to see if all four\
    \ corners of the elf’s collision area are touching `0` cells. If any of them aren’t\
    \ `0`, we know that the elf has bumped into an obstacle. The code we end up with\
    \ is almost identical to the code we used to check for maze walls in our earlier\
    \ maze game examples. Here’s the code from the game loop that checks whether the\
    \ elf is touching an obstacle. If it is, the code prevents the elf from moving.\n\
    \n```\nlet obstaclesMapArray = world.getObject(\"obstacles\").data;\nlet elfVsGround\
    \ = g.hitTestTile(elf, obstaclesMapArray, 0, world, \"every\");\n\nif (!elfVsGround.hit)\
    \ {\n  //Prevent the elf from moving\n  elf.x -= elf.vx;\n  elf.y -= elf.vy;\n\
    \  elf.vx = 0;\n  elf.vy = 0;\n}\n```\n\nWhat if you want to find out which type\
    \ of obstacle the elf has bumped into? You can use the `collision.index` property\
    \ to look up its `gid` number in the map array. Here’s how you could find a `gid`\
    \ number from the `obstacleMapArray`:\n\n```\nobstaclesMapArray[elfVsGround.index]\n\
    ```\n\nIf the elf bumped into the right side of a tree, this would give you `33`.\
    \ This means you can now obtain detailed information about how of the elf is interacting\
    \ with the environment, and use this to start building some sophisticated game\
    \ logic.\n\n### Collisions with Items\n\nYou’ll remember that when we designed\
    \ the game map in Tiled Editor, we gave the item tiles these name properties:\
    \ `skull`, `heart`, and `marmot`. The items were also added on their own layer,\
    \ shown in Figure [3-19](#A346816_1_En_3_Chapter.xhtml#Fig19).\n\n![A346816_1_En_3_Fig19_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig19_HTML.jpg)\n\
    \n**Figure 3-19.** The item tiles are on their own layer and have name properties\n\
    \nWe can use these custom name properties in our game code to tell us which items\
    \ the elf is touching. Let’s find out how.\n\nFirst, we need to get a reference\
    \ to the items layer.\n\n```\nitemsLayer = world.getObject(\"items\");\n```\n\n\
    Remember that `itemsLayer` is a sprite container. It contains all the sprites\
    \ on that layer; there will only be three: the heart, skull, and marmot. You can\
    \ access those sprites in the layer’s `children` array. So the next step to get\
    \ a reference to the `itemsLayer.children`.\n\n```\nitems = itemsLayer.children;\n\
    ```\n\nWe now have an array called `items` that contains the three item sprites."
