    # About the Author and About the Technical Reviewer


    # About the Author


    ![A346816_1_En_BookFrontmatter_Figb_HTML.jpg](OEBPS/Images/A346816_1_En_BookFrontmatter_Figb_HTML.jpg)


    Rex van der Spuy is a leading expert on video game design and interactive graphics,
    and he is the author of the popular Foundation and Advanced series of books about
    how to make video games. Rex has designed games and done interactive interface
    programming with Agency Interactive (Dallas), Scottish Power (Edinburgh), DC Interact
    (London), Draught Associates (London), the Bank of Montreal and TVO (Canada).
    He’s also built game engines and interactive interfaces for museum installations
    for PixelProject (Cape Town, South Africa), and built “Ga,” the world’s smallest
    full-featured 2D game engine; and its full-featured sister engine, “Hexi.” He
    created and taught advanced courses in game design for many years at the Canadian
    School of India (Bangalore, India). The highlight of his career was programming
    video games on the Annapurna glacier at 4,500 meters (which, to his delight, was
    1,000 meters higher than the maximum permissible operating altitude of his laptop).
    Rex spends his free time sleeping, and tuning his sitar.


    # About the Technical Reviewer


    Tom Barker is a husband, father, engineer, technical leader, professor, author,
    amateur classicist, aspiring winemaker, and maser. Currently, he is Senior Director
    of Software Engineering and Development at Comcast.


    © Rex van der Spuy 2017


    Rex van der Spuy, The Advanced Game Developer''s Toolkit, 10.1007/978-1-4842-1097-0_1


    # 1. Getting Started


    Rex van der Spuy^(1)


    (1)Toronto, Ontario, Canada


    Welcome to the HTML5 game designers toolkit! This book is an essential guide to
    the most useful techniques you need to know for making a wide range of 2D action
    games. It covers classic development practices, tools, algorithms, and architectures,
    including the following:


    *   How to use Tiled Editor to design game levels (Chapter [2](#A346816_1_En_2_Chapter.xhtml)).

    *   Efficient collision detection using tile-based techniques (Chapter [3](#A346816_1_En_3_Chapter.xhtml)).

    *   Designing isometric game maps and collision detection in isometric games (Chapter
    [4](#A346816_1_En_4_Chapter.xhtml)).

    *   Pathfinding for maze games, including line-of-sight and A Star (Chapters [5](#A346816_1_En_5_Chapter.xhtml)
    and [6](#A346816_1_En_6_Chapter.xhtml)).

    *   The amazing efficiency of tile-based games, and some surprising things you
    can do with them (Chapter [7](#A346816_1_En_7_Chapter.xhtml)).


    These are all the techniques you need to know to create almost any kind of game
    in any genre.


    ## What You Need to Know


    You’re a game designer! And, you need to have a reasonable fluency with JavaScript
    and HTML5 technologies. If you’re reading this book, you’ve already made a few
    games and have a toolset or game engine that you’re happy using. You know how
    to make sprites, run a game loop, test for collisions, write game logic, and handle
    user input. You should also have some familiarity with vector math: how to calculate
    vectors, normalize them, and create new vectors from other vectors.


    ###### Note


    If you don’t know any of those things, or need a refresher, pick up a copy of
    *Foundation Game Design with HTML5 and JavaScript* (Apress, 2012), *Advanced Game
    Design with HTML5 and JavaScript* (Apress, 2015), and *Learn PixiJS* (Apress,
    2015). These three books will teach you everything you need to know.


    This book is completely agnostic about which technology you use to make games.
    The source code has been written in JavaScript using a simple 2D HTML5 game engine
    called Hexi. However, the code examples are purely intended to be a kind of pseudo-code
    that you can apply to any other programming language or game engine. It doesn’t
    matter what game engine or display list framework you use – you can apply the
    concepts in this book to any of them. The important things about the code in this
    book are the algorithms, the high-level concepts, and the code comments – not
    necessarily the implementation details. I’ll leave those up to you, for whatever
    technology you choose.


    All you need to do is make sure that the technology you’re using has a full hierarchical
    scene graph (also known as a display list). That means you’re able to make sprites
    and nest them as children of parent sprites. And, your technology needs some way
    of letting you reference the following properties on your game sprites (values
    are in pixels, unless stated otherwise):


    *   `gx`: The global horizontal position of the sprite, relative to the game screen’s
    top left corner.

    *   `gy`: The global vertical position of the sprite, relative to the game screen’s
    top left corner.

    *   `x`: The local horizontal position of the sprite, relative to the sprite’s
    parent’s top left corner.

    *   `y`: The local vertical position of the sprite, relative to the game screen’s
    top left corner.

    *   `width`: The sprite’s width.

    *   `height`: The sprite’s height.

    *   `halfWidth`: Half the sprite’s width.

    *   `halfHeight`: Half the sprite’s height.

    *   `scaleX`: The sprite’s horizontal scale (as a normalized value between 0 and
    1).

    *   `scaleY`: The sprite’s vertical scale (as a normalized value between 0 and
    1).

    *   `centerX`: The sprite’s center x position.

    *   `centerY`: The sprite’s center y position.

    *   `rotation`: The sprite’s angle of rotation, in Radians.

    *   `alpha`: The sprite’s transparency (as a normalized value between 0 and 1).

    *   `vx`: The sprite’s vertical velocity.

    *   `vy`: The sprite’s horizontal velocity.

    *   `layer`: The sprite’s position in the display stack (0 is the bottom layer).


    You’ll also need some way to group sprites together into a parent container, and
    some functions to help you manage this:


    *   `group`: Groups sprites into a parent container.

    *   `addChild`: Add sprite as child of another sprite or container.

    *   `removeChild`: Remove a sprite from its parent sprite or container.


    These are the only sprite properties and functions you need to make any kind of
    2D game you can think of. Although the names will likely be different, any 2D
    game development tool you’re using will let you access these properties and functions
    in some way. Just identify them in the tool that you’re using, and you’ll be able
    to make use of the code in this book.'
