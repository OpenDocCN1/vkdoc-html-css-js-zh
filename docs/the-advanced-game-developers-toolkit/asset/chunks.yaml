- fmt: '###### Note


    In this book I’ve use Tiled Editor version 0.15.0, which was the latest at the
    time of writing. The version you’re using will likely have a slightly different
    organization, layout, and output, so just treat these details as a general guide
    and use your own judgment about how to apply them.


    Next, load in your tileset. Click the `New Tileset` button in the `Tilesets` panel
    on the right-hand side of Tiled Editor’s workspace. Give your tileset a name and
    set the `Type` as “Based on Tileset Image.” Browse to the tileset’s location,
    and define the height and width of each tile. Again, set this height and width
    to the size of your smallest sprite image. In this example, I’ve named the tileset
    “fantasy,” and set the tile width and height to 32 pixels, as shown in Figure
    [2-4](#A346816_1_En_2_Chapter.xhtml#Fig4). If your tileset has spacing (padding)
    around each image, enter the spacing amount here. (Tilesets produced by software
    like Texture Packer adds two pixels of default padding around each tileset sub-image).
    Click `OK` when you’re done.


    ![A346816_1_En_2_Fig4_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig4_HTML.jpg)


    ###### Figure 2-4. Set the tileset


    ###### Note


    You can use more than one tileset for each level if you need to, and the tilesets
    can be any size. Instead of using tilesets, you can optionally build your game
    using individual images files by choosing the `Type` option “Based On Collection
    of Images.” This makes Tiled Editor an extremely flexible layout tool.


    When this is done, you’ll see your tileset loaded into the `Tilesets` panel, as
    shown in Figure [2-5](#A346816_1_En_2_Chapter.xhtml#Fig5).


    ![A346816_1_En_2_Fig5_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig5_HTML.jpg)


    ###### Figure 2-5. Load your tileset


    ## Setting Images Properties


    You can create and set properties for each image on your tileset, and you’ll be
    able to access all those properties in your game code. In this example, I want
    to assign names to the skull, heart, and marmot images. Here’s how to assign a
    name to each image:


    1.  Click on an image, and find the `Custom Properties` section of the `Properties`
    panel.

    2.  Create a new property called `name`, and give the image a name.


    I’ve named each of these images “skull,” “marmot,” and “heart,” as shown in Figure
    [2-6](#A346816_1_En_2_Chapter.xhtml#Fig6). Later in this chapter you’ll see how
    you can access this information as object properties in your game code.


    ![A346816_1_En_2_Fig6_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig6_HTML.jpg)


    ###### Figure 2-6. Set optional image properties


    ## Using Layers


    You’re now ready to start building the map! Tiled Editor lets you create **layers**
    into which you can organize different elements of your game world. In a simple
    map, you might have a layer called `maze` that contains all the walls of your
    maze, and another layer called `enemies` that contains all the enemies in your
    game. The map we’re building in this example is a little more complex in that
    we’re using layers to help us create a shallow 3D effect. Our map uses six layers,
    starting from the ground, and working up, vertically, to the treetops:


    *   **ground**: The grass. This layer is for things under the elf’s feet.

    *   **obstacles**: The bottom parts of the trees, the bottom parts of bushes,
    and the bottom parts of walls. These are things that are above the elf’s feet,
    but below its head.

    *   **items**: The heart, skull, and marmot. These things are also around middle
    height.

    *   **objects**: The elf. It’s also at middle height, but it should be displayed
    in front of the items.

    *   **wallTops**: The tops of the walls. These are above the elf’s head.

    *   **treeTops**: The tops of the trees. These are above the tops of the walls.


    Figure [2-7](#A346816_1_En_2_Chapter.xhtml#Fig7) shows a scene from the game where
    you can see all these depth layers at the same time. Can you match each layer
    with its representation in the final scene? Do you notice that the things in top
    layers are covering the things in the bottom layers?


    ![A346816_1_En_2_Fig7_HTML.gif](OEBPS/Images/A346816_1_En_2_Fig7_HTML.gif)


    ###### Figure 2-7. All the sprites that make up this scene have been organized
    into 6 depth layers


    ###### Note


    This pseudo-3D effect is sometimes called 2.5D. It’s as though you’re sitting
    on a chair, looking down at the tabletop where the game is happening. The sprites
    themselves are flat, like pieces of paper, but they appear closer to us if they’re
    near the bottom of the screen, and farther away if they’re near the top.


    By organizing our layers according to depth, from bottom to top, it’s going to
    be easy to create the illusion of depth. The sprites that are closer to the viewer
    will overlap the ones that are farther away.


    Create these six layers by clicking the `New Layer` button in the `Layers` panel,
    shown in Figure [2-8](#A346816_1_En_2_Chapter.xhtml#Fig8).


    ![A346816_1_En_2_Fig8_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig8_HTML.jpg)


    ###### Figure 2-8. Create some map layers


    You can see from the `New Layer` button menu that there are three types of layers
    that you can create: `Tile`, `Object`, and `Image` layers.


    *   **Tile Layer**: Use rectangular tiles to compose these kinds of layers. This
    is great for fixed grid layouts, which is how most 2D game levels are designed.
    Anything on a tile layer will end up as an array of image id codes. In this example,
    everything except the elf has been created on a `Tile` layer.

    *   **Object Layer**: Use this for sprites that should be placed freely and not
    fixed into a rigid grid system. Its also useful for placing objects that aren’t
    in the current tileset, or which will be generated later by code. You could also
    use an object layer for adding non-visual game elements that provide some useful
    data in your game. Anything on an `Object` layer will be described as a JavaScript
    object in the final JSON file. In this example, the elf character will be on an
    object layer.

    *   **Image Layer**: Use this to position a single image. Use the `Image` field
    in the `Layer Properties` panel to browse for the image or set its URL. When you
    export the map as a JSON file, this information will generate a path to the image
    file along with its `x` and `y` pixel coordinates.


    ###### Note


    By using object and image layers, Tiled becomes a very flexible visual layout
    editor for any type of game, not just tile-based ones. There are no rules about
    how many layers you need, the size and shape of the sprites, or what kind of things
    should be on each layer type. Just use whatever organization system makes sense
    to you for the kind of game you’re making.


    We’re now ready to start designing the map.


    ## Building the Map


    We’ll start from the bottom-most layer, the ground, and work our way up.


    Select the `ground` layer, click on the grass tile, and use the paint bucket tool
    to cover the level with grass, as shown in Figure [2-9](#A346816_1_En_2_Chapter.xhtml#Fig9).


    ![A346816_1_En_2_Fig9_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig9_HTML.jpg)


    ###### Figure 2-9. Fill the level with grass using the paint bucket tool


    Next is the `obstacles` layer. These are the things that will prevent the elf
    character from moving. You can think of anything on the `obstacles` layer as the
    walls of a maze. This includes the trunks of trees, the bottom parts of the walls,
    and the bottom parts of the bushes.


    Hold down the `command` or `ctrl` key to select more than one tile image at a
    time. Choose the `Stamp` tool, and use it to stamp sprite images onto the level.
    Fix any mistakes with the `Eraser`. See Figure [2-10](#A346816_1_En_2_Chapter.xhtml#Fig10).


    ![A346816_1_En_2_Fig10_HTML.jpg](OEBPS/Images/A346816_1_En_2_Fig10_HTML.jpg)'
