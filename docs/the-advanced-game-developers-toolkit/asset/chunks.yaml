    Now the collision will only be detected when every corner point is inside the
    bomb’s cell. This lets the alien completely envelop the bomb before it disappears.
    Figure [3-12](#A346816_1_En_3_Chapter.xhtml#Fig12) illustrates this.


    ![A346816_1_En_3_Fig12_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig12_HTML.jpg)


    ###### Figure 3-12. Detect a collision only when every corner point is inside
    the map cell


    The result is very natural looking, and it’s an effect that’s difficult to achieve
    using a geometry-based collision detection system. It also turns out that checking
    for collisions with every corner point has another important use: you can use
    it to contain a sprite inside specific map locations. Let’s find out how to do
    that next.


    ## Using Inverse Collision Detection to Check for Obstacles


    For maze or RPG games you usually need to know which parts of the map are areas
    that a character can walk on, and which they can’t. For example, a character should
    be able to walk on grass, but not walls, rocks, or trees. These are known as the
    walkable and non-walkable areas of a map. Often you’ll find that there is only
    one thing that a character should be allowed to walk on, but many things that
    it shouldn’t be allowed to walk on. So, instead of checking for collision with
    three things that a character can’t walk on (like walls, rocks, and trees) just
    test for a collision with the one thing that the character can walk on (like grass.)
    If the character is on the grass, it can walk, but if it’s touching anything else,
    it can’t. This is an *inverse* collision strategy. It’s inverse because you’re
    finding out whether a sprite is hitting an obstacle by checking whether it’s *not
    hitting* another obstacle. If it’s on the grass, you know it’s not touching a
    wall, rock, or tree. Simple! For certain types of collisions this can be very
    efficient.


    How can you find out if a sprite is completely inside a certain map cell? By checking
    every one of its four corner points. If the sprite’s four corners are all at the
    same location, you know that the sprite is not overlapping any other cell. And,
    yes, you might not be surprised to learn that you can check for this by using
    JavaScript’s `every` loop! Let’s find out how to do this with the classic example:
    maze walls.


    Run the `wallsAndBombs.js` file and use the arrow keys to navigate the alien around
    a maze and pick up the bombs. The alien can move smoothly through the corridors
    and around corners, but walls block its movement, as shown in Figure [3-13](#A346816_1_En_3_Chapter.xhtml#Fig13).


    ![A346816_1_En_3_Fig13_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig13_HTML.jpg)


    ###### Figure 3-13. Navigate the maze to pick up bombs


    Figure [3-14](#A346816_1_En_3_Chapter.xhtml#Fig14) shows the maze and the `wallArray`
    that’s used to create it.


    ![A346816_1_En_3_Fig14_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig14_HTML.gif)


    ###### Figure 3-14. Add walls to create a maze game


    You can see that anything with a gid number of 2 or 3 is a wall. But because we’re
    going to do an inverse collision check, we’re not interested in those. We’re only
    interested in anything that isn’t a wall. That’s anything represented by a `"0"`
    in the map. So our collision algorithm is going to follow this logic: *If the
    alien isn’t touching a `"0"` cell, prevent it from moving.*


    Here’s all the code from the game loop that does this. It’s very similar to the
    code from the previous example, except for a few small details.


    ```

    let alienVsFloor = g.hitTestTile(alien, wallMapArray, 0, world, "every");


    if (!alienVsFloor.hit) {


      //Prevent the alien from moving

      alien.x -= alien.vx;

      alien.y -= alien.vy;

      alien.vx = 0;

      alien.vy = 0;

    }

    ```


    You can see that `alienVsFloor` only becomes true if every corner point is inside
    a `"0"` cell. If `alienVsFloor` becomes false, we know that the alien is touching
    something that isn’t `"0"` – and that thing must be a wall.


    This example uses the world’s simplest collision reaction code. If the alien hits
    a wall, the alien is prevented from moving by subtracting its velocity from its
    position, and then setting its velocity to zero.


    ```

    alien.x -= alien.vx;

    alien.y -= alien.vy;

    alien.vx = 0;

    alien.vy = 0;

    ```


    We can get away with such a simple collision reaction system because the alien’s
    movement is aligned to the map’s grid rows and columns, and we’re not using any
    physics to change its velocity. Those constraints have removed a whole class of
    collision problems that we don’t have to worry about.


    To see how this code is used in context, here’s all the code from the game loop
    that uses `hitTestTile` to check for a collision between the alien and the floor,
    and the alien and the bombs.


    ```

    //Check for a collision between the alien and floor

    let alienVsFloor = g.hitTestTile(alien, wallMapArray, 0, world, "every");


    //Prevent the alien from moving if it''s not touching a floor tile

    if (!alienVsFloor.hit) {

      alien.x -= alien.vx;

      alien.y -= alien.vy;

      alien.vx = 0;

      alien.vy = 0;

    }


    //Check for a collision between the alien and the bombs

    let alienVsBomb = g.hitTestTile(alien, bombMapArray, 5, world, "every");


    //Find out if the alien''s position in the bomb array matches a bomb gid number

    if (alienVsBomb.hit) {


      //If it does, filter through the bomb sprites and find the one

      //that matches the alien''s position

      bombSprites = bombSprites.filter(function(bomb) {


        //Does the bomb sprite have the same index number as the alien?

        if (bomb.index === alienVsBomb.index) {


          //If it does, remove the bomb from the

          //`bombMapArray` by setting its gid to `0`

          bombMapArray[bomb.index] = 0;


          //Remove the bomb sprite from its container group

          g.remove(bomb);


          //Filter the bomb out of the `bombSprites` array

          return false;

        } else {


          //Keep the bomb in the `bombSprites` array if it doesn''t match

          return true;

        }

      });

    }

    ```


    Now we’ve got a useful tile-based collision system we can use for all kinds of
    tile-based games. So let’s now find out how we can use all these new skills in
    the fantasy Role Playing game that we started to build in the previous chapter.'
