    \ PIXI.Container();\n\n//B. Set the `tileHeight` to the `tiledMap`'s `tileDepth`\
    \ property              \n  //so that it matches the pixel height of the sprite\
    \ tile image              \n  world.tileheight = parseInt(tiledMap.properties.tileDepth);\n\
      world.tilewidth = tiledMap.tilewidth;\n\n//C. Define the Cartesian dimesions\
    \ of each tile              \n  world.cartTileheight = parseInt(tiledMap.properties.cartTileheight);\n\
      world.cartTilewidth = parseInt(tiledMap.properties.cartTilewidth);\n\n//D. Calculate\
    \ the `width` and `height` of the world, in pixels              \n  //using the\
    \ `world.cartTileHeight` and `world.cartTilewidth`              \n  //values \
    \             \n  world.worldWidth = tiledMap.width * world.cartTilewidth;\n  world.worldHeight\
    \ = tiledMap.height * world.cartTileheight;\n\n//Get a reference to the world's\
    \ height and width in              \n  //tiles, in case you need to know this\
    \ later (you will!)              \n  world.widthInTiles = tiledMap.width;\n  world.heightInTiles\
    \ = tiledMap.height;\n\n//Create an `objects` array to store references to any\
    \              \n  //named objects in the map. Named objects all have        \
    \      \n  //a `name` property that was assigned in Tiled Editor             \
    \ \n  world.objects = [];\n\n//The optional spacing (padding) around each tile\
    \              \n  //This is to account for spacing around tiles             \
    \ \n  //that's commonly used with texture atlas tilesets. Set the            \
    \  \n  //`spacing` property when you create a new map in Tiled Editor        \
    \      \n  let spacing = tiledMap.tilesets[0].spacing;\n\n//Figure out how many\
    \ columns there are on the tileset.              \n  //This is the width of the\
    \ image, divided by the width              \n  //of each tile, plus any optional\
    \ spacing thats around each tile              \n  let numberOfTilesetColumns =\n\
        Math.floor(\n      tiledMap.tilesets[0].imagewidth / (tiledMap.tilewidth +\
    \ spacing)\n    );\n\n//E. A `z` property to help track which depth level the\
    \ sprites are on              \n  let z = 0;\n\n//Loop through all the map layers\
    \              \n  tiledMap.layers.forEach(tiledLayer => {\n\n//Make a group for\
    \ this layer and copy              \n    //all of the layer properties onto it\
    \              \n    let layerGroup = new PIXI.Container();\n\nObject.keys(tiledLayer).forEach(key\
    \ => {\n\n//Add all the layer's properties to the group, except the          \
    \    \n      //width and height (because the group will work those our for   \
    \           \n      //itself based on its content)              \n      if (key\
    \ !== \"width\" && key !== \"height\") {\n        layerGroup[key] = tiledLayer[key];\n\
          }\n    });\n\n//Translate `opacity` to `alpha`              \n    layerGroup.alpha\
    \ = tiledLayer.opacity;"
  trans: "\n###### 图 4-12. 添加自定义地图属性\n\n当 `Tiled Editor` 生成 JSON 地图数据时，你将能够在 `properties`\
    \ 字段中访问这些值。\n\n```\n\"properties\":\n    {\n     \"cartTileheight\":\"32\",\n\
    \     \"cartTilewidth\":\"32\",\n     \"tileDepth\":\"64\"\n    },\n```\n\n在后面的代码示例中，你将看到我们需要如何使用这些值来精确绘制等距地图。\n\
    \n现在你已经设置好了地图属性，请像第 2 章那样使用等距图块集来构建你的世界。图 4-13 展示了你的 `Tiled Editor` 工作区可能的外观。\n\
    \n![A346816_1_En_4_Fig13_HTML.jpg](img/A346816_1_En_4_Fig13_HTML.jpg)\n\n######\
    \ 图 4-13. 在 Tiled Editor 中设计等距地图\n\n在图 4-13 中，你可以看到我给红色立方体赋予了值为 `\"player\"` 的自定义名称属性。我还使用两个图层构建了地图：`playerLayer`\
    \ 仅包含红色立方体，而 `wallLayer` 包含所有迷宫墙壁。\n\n设计完地图后，将其导出为 JSON 文件，现在你就可以用它开始编写游戏代码了。\n\
    \n### `makeIsoTiledWorld` 函数\n\n下一步是修改第 2 章中的 `makeTiledWorld` 函数，使其能够处理等距地图。以下是实现此功能的新版\
    \ `makeIsoTiledWorld`。它遵循与原版相同的格式，但应用了本章学到的关于等距地图的所有知识。我在代码中添加了从 A 到 I 的注释，以突出显示新的修改部分。\n\
    \n```\nfunction makeIsoTiledWorld(jsonTiledMap, tileset) {\n\n//创建一个名为 `world`\
    \ 的组，用于包含 `tiledMap` 中的所有图层、精灵              \n  //和对象。`world` 对象将被返回给主游戏程序   \
    \           \n  let tiledMap = PIXI.loader.resources[jsonTiledMap].data;\n\n//A.\
    \ 你需要向 Tiled Editor 地图添加三个自定义属性：              \n  //`cartTilewidth`、`cartTileheight`\
    \ 和 `tileDepth`。              \n  //检查这些自定义属性是否存在              \n  if (!tiledMap.properties.cartTilewidth\n\
    \  && !tiledMap.properties.cartTileheight\n  && !tiledMap.properties.tileDepth)\
    \ {\n    throw new Error(\n      \"请在 Tiled Editor 中设置自定义的 cartTilewidth、cartTileheight\
    \ 和 tileDepth 地图属性\"\n    );\n  }\n\n//创建 `world` 容器              \n  let world\
    \ = new PIXI.Container();\n\n//B. 将 `tileHeight` 设置为 `tiledMap` 的 `tileDepth`\
    \ 属性              \n  //使其与精灵图块图像的像素高度匹配              \n  world.tileheight = parseInt(tiledMap.properties.tileDepth);\n\
    \  world.tilewidth = tiledMap.tilewidth;\n\n//C. 定义每个图块的笛卡尔维度              \n\
    \  world.cartTileheight = parseInt(tiledMap.properties.cartTileheight);\n  world.cartTilewidth\
    \ = parseInt(tiledMap.properties.cartTilewidth);\n\n//D. 使用 `world.cartTileHeight`\
    \ 和 `world.cartTilewidth` 值              \n  //计算世界的 `width` 和 `height`（以像素为单位）\
    \            \n  world.worldWidth = tiledMap.width * world.cartTilewidth;\n  world.worldHeight\
    \ = tiledMap.height * world.cartTileheight;\n\n//获取世界的以图块为单位的宽度和高度引用，        \
    \      \n  //以备后续需要（你会的！）              \n  world.widthInTiles = tiledMap.width;\n\
    \  world.heightInTiles = tiledMap.height;\n\n//创建一个 `objects` 数组，用于存储对地图中任何  \
    \            \n  //命名对象的引用。命名对象都具有在 Tiled Editor 中分配的 `name` 属性              \n\
    \  world.objects = [];\n\n//每个图块周围的可选间距（内边距）              \n  //这是为了考虑图块周围的间距，\
    \              \n  //常用于纹理图集图块集。在 Tiled Editor 中创建新地图时设置              \n  //`spacing`\
    \ 属性              \n  let spacing = tiledMap.tilesets[0].spacing;\n\n//计算图块集上有多少列。\
    \              \n  //这是图像宽度除以每个图块的宽度，              \n  //再加上每个图块周围的可选间距      \
    \        \n  let numberOfTilesetColumns =\n    Math.floor(\n      tiledMap.tilesets[0].imagewidth\
    \ / (tiledMap.tilewidth + spacing)\n    );\n\n//E. 一个 `z` 属性，用于帮助追踪精灵所在的深度层级 \
    \             \n  let z = 0;\n\n//遍历所有地图图层              \n  tiledMap.layers.forEach(tiledLayer\
    \ => {\n\n//为该图层创建一个组，并复制              \n    //该图层的所有属性到该组上              \n  \
    \  let layerGroup = new PIXI.Container();\n\nObject.keys(tiledLayer).forEach(key\
    \ => {\n\n//将图层的所有属性添加到该组，除了              \n      //宽度和高度（因为组会根据其内容自行计算这些值）  \
    \            \n      if (key !== \"width\" && key !== \"height\") {\n        layerGroup[key]\
    \ = tiledLayer[key];\n      }\n    });\n\n//将 `opacity` 转换为 `alpha`          \
    \    \n    layerGroup.alpha = tiledLayer.opacity;\n```\n"
- fmt: "```javascript\n// Add the group to the `world`\nworld.addChild(layerGroup);\n\
    \n// Push the group into the world's `objects` array\n// So you can access it\
    \ later\nworld.objects.push(layerGroup);\n\n// Is this current layer a `tilelayer`?\n\
    if (tiledLayer.type === \"tilelayer\") {\n\n  // Loop through the `data` array\
    \ of this layer\n  tiledLayer.data.forEach((gid, index) => {\n    let tileSprite,\
    \ texture, mapX, mapY, tilesetX, tilesetY,\n      mapColumn, mapRow, tilesetColumn,\
    \ tilesetRow;\n\n    // If the grid id number (`gid`) isn't zero, create a sprite\n\
    \    if (gid !== 0) {\n\n      // Figure out the map column and row number that\
    \ we're on, and then\n      // calculate the grid cell's x and y pixel position\n\
    \      mapColumn = index % world.widthInTiles;\n      mapRow = Math.floor(index\
    \ / world.widthInTiles);\n\n      // Use the Cartesian values to find the\n  \
    \    // `mapX` and `mapY` values\n      mapX = mapColumn * world.cartTilewidth;\n\
    \      mapY = mapRow * world.cartTileheight;\n\n      // Figure out the column\
    \ and row number that the tileset\n      // image is on, and then use those values\
    \ to calculate\n      // the x and y pixel position of the image on the tileset\n\
    \      tilesetColumn = ((gid - 1) % numberOfTilesetColumns);\n      tilesetRow\
    \ = Math.floor((gid - 1) / numberOfTilesetColumns);\n      tilesetX = tilesetColumn\
    \ * world.tilewidth;\n      tilesetY = tilesetRow * world.tileheight;\n\n    \
    \  // Compensate for any optional spacing (padding) around the tiles if\n    \
    \  // there is any. This bit of code accumulates the spacing offsets from the\n\
    \      // left side of the tileset and adds them to the current tile's position\n\
    \      if (spacing > 0) {\n        tilesetX\n          += spacing + (spacing *\
    \ ((gid - 1) % numberOfTilesetColumns));\n        tilesetY\n          += spacing\
    \ + (spacing * Math.floor((gid - 1) / numberOfTilesetColumns));\n      }\n\n \
    \     // Use the above values to create the sprite's image from\n      // the\
    \ tileset image\n      texture = g.frame(\n        tileset, tilesetX, tilesetY,\n\
    \        world.tilewidth, world.tileheight\n      );\n\n      // I've decided\
    \ that any tiles that have a `name` property are important\n      // and should\
    \ be accessible in the `world.objects` array\n\n      let tileproperties = tiledMap.tilesets[0].tileproperties,\n\
    \        key = String(gid - 1);\n\n      // If the JSON `tileproperties` object\
    \ has a sub-object that\n      // matches the current tile, and that sub-object\
    \ has a `name` property,\n      // then create a sprite and assign the tile properties\
    \ onto\n      // the sprite\n      if (tileproperties[key] && tileproperties[key].name)\
    \ {\n\n        // Make a sprite\n        tileSprite = new PIXI.Sprite(texture);\n\
    \n        // Copy all of the tile's properties onto the sprite\n        // (This\
    \ includes the `name` property)\n        Object.keys(tileproperties[key]).forEach(property\
    \ => {\n\n          tileSprite[property] = tileproperties[key][property];\n  \
    \      });\n\n        // Push the sprite into the world's `objects` array\n  \
    \      // so that you can access it by `name` later\n        world.objects.push(tileSprite);\n\
    \      }\n\n      // If the tile doesn't have a `name` property, just use it to\n\
    \      // create an ordinary sprite (it will only need one texture)\n      else\
    \ {\n        tileSprite = new PIXI.Sprite(texture);\n      }\n\n      // Add isometric\
    \ properties to the sprite\n      addIsoProperties(\n        tileSprite, mapX,\
    \ mapY,\n        world.cartTilewidth, world.cartTileheight\n      );\n\n     \
    \ // Use the isometric position to add the sprite to the world\n      tileSprite.x\
    \ = tileSprite.isoX;\n      tileSprite.y = tileSprite.isoY;\n      tileSprite.z\
    \ = z;\n\n      // Make a record of the sprite's index number in the array\n \
    \     // (We'll use this for collision detection later)\n      tileSprite.index\
    \ = index;\n\n      // Make a record of the sprite's `gid` on the tileset.\n \
    \     // This will also be useful for collision detection later\n      tileSprite.gid\
    \ = gid;\n\n      // Add the sprite to the current layer group\n      layerGroup.addChild(tileSprite);\n\
    \    }\n  });\n}\n\n// Is this layer an `objectgroup`?\nif (tiledLayer.type ===\
    \ \"objectgroup\") {\n  tiledLayer.objects.forEach(object => {\n\n    // We're\
    \ just going to capture the object's properties\n    // so that we can decide\
    \ what to do with it later.\n    // Get a reference to the layer group the object\
    \ is in\n    object.group = layerGroup;\n\n    // Push the object into the world's\
    \ `objects` array\n    world.objects.push(object);\n  });\n}\n\n// Add 1 to the\
    \ z index (the first layer will have a z index of `1`)\nz += 1;\n});\n\n// Search\
    \ functions\nworld.getObject = (objectName) => {\n  let searchForObject = () =>\
    \ {\n    let foundObject;\n    world.objects.some(object => {\n      if (object.name\
    \ && object.name === objectName) {\n        foundObject = object;\n        return\
    \ true;\n      }\n    });\n    if (foundObject) {\n      return foundObject;\n\
    \    } else {\n      throw new Error(\"There is no object with the property name:\
    \ \" + objectName);\n    }\n  };\n\n  // Return the search function\n  return\
    \ searchForObject();\n};\n\nworld.getObjects = (objectNames) => {\n  let foundObjects\
    \ = [];\n  world.objects.forEach(object => {\n    if (object.name && objectNames.indexOf(object.name)\
    \ !== -1) {\n      foundObjects.push(object);\n    }\n  });\n  if (foundObjects.length\
    \ > 0) {\n    return foundObjects;\n  } else {\n    throw new Error(\"I could\
    \ not find those objects\");\n  }\n  return foundObjects;\n};\n\n// That's it,\
    \ we're done!\n// Finally, return the `world` object back to the game program\n\
    return world;\n```\n\nWith this new `makeIsoTiledWorld` function we’ve got a way\
    \ to plot the map we created in Tiled Editor and access all the sprites it contains.\
    \ Let’s find out exactly how to do that next."
