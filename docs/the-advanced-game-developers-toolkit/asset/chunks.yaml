    在这个例子中，每当用户点击鼠标时就会计算一条新路径，但在你自己的游戏中，你可以修改这一点，使得每当发生任何导致精灵改变方向的重大事件时，就重新计算路径。


    ## 扩展与自定义 A* 算法


    你肯定需要投入一些时间来熟悉 A* 算法并理解其所有细微之处。但这绝对值得，因为它是游戏设计的基础技术，应用于大多数游戏类型的所有平台。


    A* 算法的一大吸引力在于其灵活性。如你所见，只需切换启发函数，就能生成不同类型的路径。但让 A* 算法如此灵活的不仅仅是启发函数。让我们看看 A* 算法提供的其他一些可能性。


    ### 可变地形


    在本章的示例中，我们只有一种障碍物：墙壁。然而，你的游戏中可能有不同类型的障碍物，并非所有障碍物都无法穿越。


    如果你的游戏中有一个泥潭会怎样？角色仍然可以穿过泥潭，但移动速度会减慢。你可以修改 A* 算法，让包含泥潭的节点具有高成本。例如，当 A* 算法遇到泥潭节点时，给
    G 成本额外增加 20 或 30 点。这样 A* 算法就会计算是绕过泥潭更快，还是直接穿过泥潭走捷径更优。


    策略游戏一直在使用这种技术。部队需要考虑是坚持在平原上快速行军，还是花时间翻山越岭。这种分析完全由 A* 算法对不同类型移动的成本分析来完成。


    ### 影响地图


    另一个可以用 A* 算法解决的有趣问题。想象一下，你的敌方 AI 角色正在使用 A* 算法寻找通往地牢的最佳出口。唯一的问题是，你发现你可以轻松地通过躲在该出口附近，并在每个敌人盲目摸索过来时将其击倒来获得高分。这些敌人无法警告他们的同伴，尽管这可能是最短的路线，但也极其危险。


    你可以通过使用所谓的**影响地图**来解决这个问题。如果游戏世界的某个区域变得特别危险，那么将这些节点的成本设得非常高。当 A* 算法搜索路径时，它就会避开这些代价高昂的危险区域。


    你还可以扩展这个概念来解决多个敌人沿同一条路径移动的问题。在许多游戏中，如果所有敌人都选择同一条最短路径，会显得非常不自然。你可以通过追踪每个敌人选择的路径，并为这些节点分配高成本，来迫使敌人选择不同的路径。这样
    A* 算法就会避开已被其他敌人选中的节点和路径。


    ### 迪杰斯特拉算法


    之前，我提到 A* 算法是迪杰斯特拉算法的一种改进。有一个很好的理由让你选择使用迪杰斯特拉算法而非 A* 算法：即当你不知道路径的最终目的地时。


    A* 算法和迪杰斯特拉算法的唯一区别在于，A* 算法增加了启发函数。在迪杰斯特拉算法中，H 值始终为零。这意味着当迪杰斯特拉算法开始寻找路径时，它不知道应该从哪个方向开始寻找。它需要比
    A* 算法进行更多的搜索才能找到目标。


    但是，如果你的游戏中不确定角色的最终目的地会是哪里呢？想象你正在设计一款策略或资源管理游戏，你的村民需要去收集草莓。小镇周围有四个草莓丛，但你不确定哪一个最近。如果你使用迪杰斯特拉算法，它会向所有方向向外搜索，直到找到第一个目标。如果你使用
    A* 算法，你需要计算到每个草莓丛的四条不同路径，并选择最短的一条。迪杰斯特拉算法可以帮你省去这一步麻烦，因此在这种情况下是更好的选择。


    如果你想使用迪杰斯特拉算法而不是 A* 算法，只需将所有 H 成本设为 0。A* 算法的其余代码保持不变。


    不要重复造轮子！本章旨在让你完全理解 A* 算法的工作原理，旨在帮助你根据需求对其进行定制、重写和修改。不过，JavaScript 中有许多高质量的 A*
    算法开源实现，可能在性能、灵活性或易于实现方面更适合你的用例。`Easystar.js` 和 `Pathfinding.js` 是不错的起点。


    ## 本章小结


    本章简要介绍了寻路算法，希望能启发你思考如何在自己的游戏中使用这些技术。冒险游戏、策略游戏以及任何需要复杂 AI 的游戏都将从这些技术中受益。你已经学会了从零实现你自己的
    A* 寻路算法所需的一切知识，以及如何使用它来让你基于瓦片的游戏世界中的精灵进行移动。


    但这绝不意味着我们对基于瓦片的游戏的探讨就此结束！在下一章中，你将学到更多基于瓦片的游戏设计秘诀：如何使用瓦片轻松创建出人意料地复杂的自主 AI 实体，以及如何实现高效的宽相位碰撞检测系统。


    © 雷克斯·范德斯普伊 2017


    雷克斯·范德斯普伊，《高级游戏开发者工具包》，10.1007/978-1-4842-1097-0_7

