- fmt: "// Find the valid surrounding nodes, which are ones inside  \n// the map border\
    \ that don't include obstacles. Optionally change `allSurroundingNodes`  \n//\
    \ to `crossSurroundingNodes` to prevent the path from choosing diagonal routes\
    \  \n// between nodes  \nlet validSurroundingNodes = allSurroundingNodes.filter(node\
    \ => {\n\n  // The node will be beyond the top and bottom edges of the  \n  //\
    \ map if it is `undefined`  \n  let nodeIsWithinTopAndBottomBounds = node !==\
    \ undefined;\n\n  // Only return nodes that are within the top and bottom map\
    \ bounds  \n  if (nodeIsWithinTopAndBottomBounds) {\n\n    // Some Boolean values\
    \ that tell us whether the current map index is on  \n    // the left or right\
    \ border of the map, and whether any of the nodes  \n    // surrounding that index\
    \ extend beyond the left and right borders  \n    let indexIsOnLeftBorder = index\
    \ % mapWidthInTiles === 0;\n    let indexIsOnRightBorder = (index + 1) % mapWidthInTiles\
    \ === 0;\n    let nodeIsBeyondLeftBorder\n      = node.column % (mapWidthInTiles\
    \ - 1) === 0\n      && node.column !== 0;\n    let nodeIsBeyondRightBorder = node.column\
    \ % mapWidthInTiles === 0;\n\n    // Find out whether or not the node contains\
    \ an obstacle by looping  \n    // through the obstacle GIDs and returning `true`\
    \ if it  \n    // finds any at this node's location  \n    let nodeContainsAnObstacle\
    \ = obstacleGids.some(obstacle => {\n      return mapArray[node.index] === obstacle;\n\
    \    });\n\n    // If the index is on the left border and any nodes surrounding\
    \ it are beyond the  \n    // left border, don't return that node  \n    if (indexIsOnLeftBorder)\
    \ {\n      return !nodeIsBeyondLeftBorder;\n    }\n\n    // If the index is on\
    \ the right border and any nodes surrounding it are beyond the  \n    // right\
    \ border, don't return that node  \n    else if (indexIsOnRightBorder) {\n   \
    \   return !nodeIsBeyondRightBorder;\n    }\n\n    // Return `false` if the node\
    \ contains an obstacle  \n    else if (nodeContainsAnObstacle) {\n      return\
    \ false;\n    }\n\n    // If this passes the checks above, it means the index\
    \ must be  \n    // inside the area defined by the left and right borders.  \n\
    \    // So, return the node  \n    else {\n      return true;\n    }\n  }\n});\n\
    \n// Return the array of `validSurroundingNodes`  \nreturn validSurroundingNodes;\n\
    };\n\n// Heuristic methods  \n// 1. Manhattan  \nlet manhattan = (testNode, destinationNode)\
    \ => {\n  let h\n    = Math.abs(testNode.row - destinationNode.row)\n    * straightCost\
    \ + Math.abs(testNode.column - destinationNode.column)\n    * straightCost;\n\
    \  return h;\n};\n\n// 2. Euclidean  \nlet euclidean = (testNode, destinationNode)\
    \ => {\n  let vx = destinationNode.column - testNode.column,\n    vy = destinationNode.row\
    \ - testNode.row,\n    h = Math.floor(Math.sqrt(vx * vx + vy * vy) * straightCost);\n\
    \  return h;\n};\n\n// 3. Diagonal  \nlet diagonal = (testNode, destinationNode)\
    \ => {\n  let vx = Math.abs(destinationNode.column - testNode.column),\n    vy\
    \ = Math.abs(destinationNode.row - testNode.row),\n    h = 0;\n\n  if (vx > vy)\
    \ {\n    h = Math.floor(diagonalCost * vy + straightCost * (vx - vy));\n  } else\
    \ {\n    h = Math.floor(diagonalCost * vx + straightCost * (vy - vx));\n  }\n\
    \  return h;\n};\n\n// Loop through all the nodes until the current `centerNode`\
    \ matches the  \n// `destinationNode`. When they're the same we know we've reached\
    \ the  \n// end of the path  \nwhile (centerNode !== destinationNode) {\n\n  //\
    \ Find all the nodes surrounding the current `centerNode`  \n  let surroundingTestNodes\
    \ = surroundingNodes(centerNode.index, mapArray, mapWidthInTiles);"
