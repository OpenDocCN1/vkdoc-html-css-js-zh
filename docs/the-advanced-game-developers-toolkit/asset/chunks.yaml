    \ + player.cartHeight > bottom) {\n  player.cartY = bottom - player.cartHeight;\n\
    }\n\n//Left                \nif (player.cartX < left) {\n  player.cartX = left;\n\
    }\n\n//Right                \nif (player.cartX + player.cartWidth > right) {\n\
      player.cartX = right - player.cartWidth;\n}\n\n//Position the sprite's sceen\
    \ `x` and `y` position                \n//using its isometric coordinates    \
    \            \nplayer.x = player.isoX;\nplayer.y = player.isoY;\n\n//Get the player's\
    \ index position in the map array                \nplayer.index = g.getIndex(\n\
      player.cartX, player.cartY,\n  world.cartTilewidth, world.cartTileheight, world.widthInTiles\n\
    );\n\n//Display the player's x, y and index values                \nmessage.content\
    \ = `index: ${player.index}`;\n```\n\nNow that we can move a sprite around the\
    \ game world, the next step is to add collision detection."
  trans: "\n###### Note\n\n任何你可能正在使用的场景图或游戏引擎都会包含某种指针对象，它能提供 x 和 y 值。只需在你所使用的技术中识别出它，然后将这段代码应用到该对象上。\n\
    \n有了这些值，我们现在可以轻松计算图块的行和列位置。\n\n```javascript\ncolumn = Math.floor(pointer.cartX\
    \ / world.cartTilewidth);\nrow = Math.floor(this.cartY / world.cartTileheight);\n\
    ```\n\n最后，地图数组索引号：\n\n```javascript\nindex = column + (row * world.widthInTiles);\n\
    ```\n\n为了让我们的生活更轻松，让我们使用名为`makeIsoPointer`的函数将这些属性添加到指针对象中。这样，我们就可以在需要时随时从指针中获取这些值。\n\
    \n```javascript\nfunction makeIsoPointer(pointer, world) {\n  Object.defineProperties(pointer,\
    \ {\n    //The isometric's world's Cartesian coordinates\n    cartX: {\n     \
    \ get() {\n        let x =\n          (((2 * this.y + this.x) - (2 * world.y +\
    \ world.x)) / 2)\n          - (world.cartTilewidth / 2);\n        return x;\n\
    \      },\n      enumerable: true,\n      configurable: true\n    },\n    cartY:\
    \ {\n      get() {\n        let y =\n          (((2 * this.y - this.x) - (2 *\
    \ world.y - world.x)) / 2)\n          + (world.cartTileheight / 2);\n        return\
    \ y;\n      },\n      enumerable: true,\n      configurable: true,\n    },\n \
    \   //The tile's column and row in the array\n    column: {\n      get() {\n \
    \       return Math.floor(this.cartX / world.cartTilewidth);\n      },\n     \
    \ enumerable: true,\n      configurable: true\n    },\n    row: {\n      get()\
    \ {\n        return Math.floor(this.cartY / world.cartTileheight);\n      },\n\
    \      enumerable: true,\n      configurable: true,\n    },\n    //The tile's\
    \ index number in the array\n    index: {\n      get() {\n        let index =\
    \ {};\n        //Convert pixel coordinates to map index coordinates\n        index.x\
    \ = Math.floor(this.cartX / world.cartTilewidth);\n        index.y = Math.floor(this.cartY\
    \ / world.cartTileheight);\n        //Return the index number\n        return\
    \ index.x + (index.y * world.widthInTiles);\n      },\n      enumerable: true,\n\
    \      configurable: true,\n    },\n  });\n}\n```\n\n现在你可以像这样将这些属性添加到你的指针中：\n\n\
    ```javascript\nmakeIsoPointer(g.pointer, world);\n```\n\n并且你可以像这样在文本字段中显示它们：\n\
    \n```javascript\nmessage.content = `\n  cartX: ${Math.floor(g.pointer.cartX)}\n\
    \  cartY: ${Math.floor(g.pointer.cartY)}\n  column: ${g.pointer.column}\n  row:\
    \ ${g.pointer.row}\n  index: ${g.pointer.index}\n  layer 1 gid: ${world.layers[0][Math.floor(g.pointer.index)]}\n\
    \  layer 2 gid: ${world.layers[1][Math.floor(g.pointer.index)]}\n`;\n```\n\n这是本章源代码中`pointer.js`文件里唯一产生图[4-4]输出的新代码，其余代码与我们之前的示例相同。\n\
    \n我们在处理等距地图方面的所有核心技能已经就绪，所以让我们看看如何开始使用它们来制作游戏。\n\n## 在等距世界中移动\n\n接下来，让我们了解如何让游戏角色在这个等距地图上移动。运行本章源文件中的`movement.html`文件，并使用键盘方向键在迷宫中移动红色方块，如图[4-5]所示。一个文本字段会显示红色方块当前所在的地图数组索引号。\n\
    \n**图 4-5.** 使用方向键移动红色方块\n\n别慌——你已经知道如何做到这一点了！所有代码所做的就是将你在前一章学到的基于图块的地图移动技术与我们的新等距技能结合起来。为了向你证明这一点，让我们来看看添加到现有代码库中的新代码。\n\
    \n首先，你需要定义“玩家”角色是什么。在这个例子中，它是一个红色方块。因此，在绘制图块地图的`switch`语句中，将其引用为玩家对象。\n\n```javascript\n\
    case 3:\n  sprite = isoRectangle(world.cartTilewidth, world.cartTileheight, 0xFF0000);\n\
    \  player = sprite;\n```\n\n在`setup`函数中，我们还需要定义键盘方向键和玩家对象的`direction`属性，以便在地图上移动它。让我们添加代码来实现这一点，这与我们在前一章中用来完成相同任务的代码完全相同。\n\
    \n```javascript\n//Create the keyboard objects\nleftArrow = g.keyboard(37);\n\
    upArrow = g.keyboard(38);\nrightArrow = g.keyboard(39);\ndownArrow = g.keyboard(40);\n\
    \n//Assign the key `press` actions\nplayer.direction = \"none\";\nleftArrow.press\
    \ = () => player.direction = \"left\";\nupArrow.press = () => player.direction\
    \ = \"up\";\nrightArrow.press = () => player.direction = \"right\";\ndownArrow.press\
    \ = () => player.direction = \"down\";\nleftArrow.release = () => player.direction\
    \ = \"none\";\nupArrow.release = () => player.direction = \"none\";\nrightArrow.release\
    \ = () => player.direction = \"none\";\ndownArrow.release = () => player.direction\
    \ = \"none\";\n```\n\n下一步是向游戏循环中添加代码，以使用键盘输入来移动玩家。这基本上与我们在 2D 地图上移动精灵的代码相同，但有一个重要的变化。代码不是直接操作精灵的屏幕\
    \ x 和 y 位置值，而是使用精灵的`cartX`和`cartY`属性。精灵的位置、速度和屏幕边界都通过`cartX`和`cartY`进行更新。仅在最后一步，才使用新计算出的`isoX`和`isoY`属性来设置精灵的屏幕位置。\n\
    \n为什么？因为使用`cartX`和`cartY`进行所有逻辑和定位计算，意味着你可以编写*完全*等同于为普通 2D 基于图块的地图编写的代码。这意味着没有新东西需要学习！以下是游戏循环中执行所有这些操作的代码，额外好处是，它还能告诉你精灵正在占据哪个地图数组索引位置。\n\
    \n```javascript\n//Change the player character's velocity if it's centered over\
    \ a grid cell\nif (Math.floor(player.cartX) % world.cartTilewidth === 0\n&& Math.floor(player.cartY)\
    \ % world.cartTileheight === 0) {\n  switch (player.direction) {\n    case \"\
    up\":\n      player.vy = -2;\n      player.vx = 0;\n      break;\n    case \"\
    down\":\n      player.vy = 2;\n      player.vx = 0;\n      break;\n    case \"\
    left\":\n      player.vx = -2;\n      player.vy = 0;\n      break;\n    case \"\
    right\":\n      player.vx = 2;\n      player.vy = 0;\n      break;\n    case \"\
    none\":\n      player.vx = 0;\n      player.vy = 0;\n      break;\n  }\n}\n\n\
    //Update the player's Cartesian position based on its velocity\nplayer.cartY +=\
    \ player.vy;\nplayer.cartX += player.vx;\n\n//Add world boundaries\nlet top =\
    \ 0,\n    bottom = (world.heightInTiles * world.cartTileheight),\n    left = 0,\n\
    \    right = (world.widthInTiles * world.cartTilewidth);\n\n//Prevent the player\
    \ from crossing any of the world boundaries\n//Top\nif (player.cartY < 0) {\n\
    \  player.cartY = top;\n}\n\n//Bottom\nif (player.cartY + player.cartHeight >\
    \ bottom) {\n  player.cartY = bottom - player.cartHeight;\n}\n\n//Left\nif (player.cartX\
    \ < left) {\n  player.cartX = left;\n}\n\n//Right\nif (player.cartX + player.cartWidth\
    \ > right) {\n  player.cartX = right - player.cartWidth;\n}\n\n//Position the\
    \ sprite's screen `x` and `y` position\n//using its isometric coordinates\nplayer.x\
    \ = player.isoX;\nplayer.y = player.isoY;\n\n//Get the player's index position\
    \ in the map array\nplayer.index = g.getIndex(\n  player.cartX, player.cartY,\n\
    \  world.cartTilewidth, world.cartTileheight, world.widthInTiles\n);\n\n//Display\
    \ the player's x, y and index values\nmessage.content = `index: ${player.index}`;\n\
    ```\n\n现在我们已经可以在游戏世界中移动精灵了，下一步是添加碰撞检测。\n"
- fmt: "# Isometric Collision Detection\n\nTo make tile-based collision detection\
    \ work in an isometric world, we need make a few modifications to the `getPoints`\
    \ function you learned in the previous chapter. Instead of using the sprite’s\
    \ ordinary `x`, `y`, `width`, and `height` screen values, we need to use its `cartX`,\
    \ `cartY`, `cartWidth`, and `cartHeight` values. Here’s a new function called\
    \ `getIsoPoints` that implements this.\n\n```\nfunction getIsoPoints(s) {\n  let\
    \ ca = s.collisionArea;\n  if (ca !== undefined) {\n    return {\n      topLeft:\
    \ {\n        x: s.cartX + ca.x,\n        y: s.cartY + ca.y\n      },\n      topRight:\
    \ {\n        x: s.cartX + ca.x + ca.width,\n        y: s.cartY + ca.y\n      },\n\
    \      bottomLeft: {\n        x: s.cartX + ca.x,\n        y: s.cartY + ca.y +\
    \ ca.height\n      },\n      bottomRight: {\n        x: s.cartX + ca.x + ca.width,\n\
    \        y: s.cartY + ca.y + ca.height\n      }\n    };\n  }\n  else {\n    return\
    \ {\n      topLeft: {\n        x: s.cartX,\n        y: s.cartY\n      },\n   \
    \   topRight: {\n        x: s.cartX + s.cartWidth - 1,\n        y: s.cartY\n \
    \     },\n      bottomLeft: {\n        x: s.cartX,\n        y: s.cartY + s.cartHeight\
    \ - 1\n      },\n      bottomRight: {\n        x: s.cartX + s.cartWidth - 1,\n\
    \        y: s.cartY + s.cartHeight - 1\n      }\n    };\n  }\n}\n```\n\n(Remember,\
    \ `ca` refers to the sprite’s collision area, which you learned about in Chapter\
    \ 3.)\n\nNow we need to replace the old `getPoints` with `getIsoPoints` in the\
    \ `hitTestTile` function. We also need to use the sprite’s `cartX` and `cartY`\
    \ values to calculate its center point. Let’s use a new version of `hitTestTile`\
    \ called `hitTestIsoTile` that implements this. Here’s an abridged version of\
    \ `hitTestIsoTile` with the new updated code highlighted.\n\n```\nfunction hitTestIsoTile(sprite,\
    \ mapArray, gidToCheck, world, pointsToCheck) {\n\n  //...\n\n  switch (pointsToCheck)\
    \ {\n\n    case \"center\":\n      let point = {\n        center: {\n        \
    \  x: s.cartX + ca.x + (ca.width / 2),            \n          y: s.cartY + ca.y\
    \ + (ca.height / 2)            \n        }\n      };\n      sprite.collisionPoints\
    \ = point;\n      collision.hit = Object.keys(sprite.collisionPoints).some(checkPoints);\n\
    \      break;\n\n    case \"every\":\n      sprite.collisionPoints = getIsoPoints(sprite);\n\
    \      collision.hit = Object.keys(sprite.collisionPoints).every(checkPoints);\n\
    \      break;\n\n    case \"some\":\n      sprite.collisionPoints = getIsoPoints(sprite);\n\
    \      collision.hit = Object.keys(sprite.collisionPoints).some(checkPoints);\n\
    \      break;\n  }\n\n  //...\n\n}\n```\n\nThese are the only changes that need\
    \ to be made to our old `hitTestTile` function. You’ll find the complete `hitTestIsoTile`\
    \ function in the chapter’s source files.\n\nWe can now use `hitTestIsoTile` in\
    \ the game loop to check for a collision like this:\n\n```\n//Get a reference\
    \ to the wall map array                \nwallMapArray = world.layers[0];\n\n//Use\
    \ `hitTestIsoTile` to check for a collision                \nlet playerVsGround\
    \ = hitTestIsoTile(player, wallMapArray, 1, world, \"every\");\n\n//If there's\
    \ a collision, prevent the player from moving.                \n//Subtract its\
    \ velocity from its position and then set its velocity to zero               \
    \ \nif (!playerVsGround.hit) {\n  player.cartX -= player.vx;\n  player.cartY -=\
    \ player.vy;\n  player.vx = 0;\n  player.vy = 0;\n}\n```\n\nIt’s the same essential\
    \ code we used to check for collisions in the maze game prototype from Chapter\
    \ 3. Nothing new to learn!\n\n## Depth Layering\n\nSo far in these examples we’ve\
    \ just been using flat diamond shaped sprites to build our isometric world. But\
    \ in most games you’ll want to use real, 3-dimensional-looking shapes for your\
    \ sprites. Run the `depthLayering.html` file in this chapter’s source files for\
    \ a working example of just such an isometric world, shown in Figure 4-6.\n\n\
    ![A346816_1_En_4_Fig6_HTML.jpg](OEBPS/Images/A346816_1_En_4_Fig6_HTML.jpg)\n\n\
    ###### Figure 4-6. Build an isometric world using 3D sprites\n\nIt’s the same\
    \ map, and uses the same keyboard control and collision as the previous examples.\
    \ What’s new is that the tiles are made from transparent cube images and are correctly\
    \ depth sorted. Depth sorting means that the sprites which appear closer to the\
    \ viewer are displayed in front of those that are further away.\n\n### Sorting\
    \ a Sprite by Its `z` Property Value\n\nThere are two new things we need to add\
    \ to our code to do proper isometric depth sorting. First, each of our sprites\
    \ needs a new property called `z`, which determines its depth layer.\n\n```\n\
    sprite.z = depthLayer;\n```\n\nSprites on lower-level map layers should have a\
    \ lower `z` value than those on higher-level map layers. You’ll see in the code\
    \ examples how this value is found and assigned to sprites.\n\nNext, you need\
    \ to sort the sprites based on this new `z` value. Because most display systems\
    \ draw sprites to the screen based on the order in which they appear in the display\
    \ list, you can change their depth layer just by changing their order in the list.\
    \ The display list is just an array of sprites, so that means all you need is\
    \ a custom JavaScript array sort method to reorder the sprites in that array based\
    \ on their `z` value.\n\nHere’s a custom sort function called `byDepth` that does\
    \ just that. It works out each sprite’s isometric depth by adding the sprite’s\
    \ Cartesian `x` and `y` position together, and multiplying it by its `z` value.\
    \ It then shifts each pair of neighboring sprites in the array to a lower or higher\
    \ index position based on its depth.\n\n```\nfunction byDepth(a, b) {\n\n  //Calculate\
    \ the depths of `a` and `b`              \n  //(add `1` to `a.z` and `b.z` to\
    \ avoid multiplying by 0)              \n  a.depth = (a.cartX + a.cartY) * (a.z\
    \ + 1);\n  b.depth = (b.cartX + b.cartY) * (b.z + 1);\n\n  //Move sprites with\
    \ a lower depth to a higher position in the array              \n  if (a.depth\
    \ < b.depth) {\n\n    //Move the sprite down one position              \n    return\
    \ -1;\n  } else if (a.depth > b.depth) {\n\n    //Move the sprite up one position\
    \              \n    return 1;\n  } else {\n\n    //Keep the sprite in the same\
    \ position              \n    return 0;\n  }\n}\n```\n\nA return value of `-1`\
    \ means the sprite will be shifted down one place in the array, and a value of\
    \ `1` means that it will be shifted up one place. A value of zero means the sprite\
    \ will maintain its current position. To use the `byDepth` function, supply it\
    \ as an argument to JavaScript’s array `sort` method on any array that represents\
    \ your sprite display list. Many scene graphs and game engines use an array called\
    \ `children` that defines the display list, so you could sort the `children` array\
    \ by depth like this:\n\n```\nworld.children.sort(byDepth);\n```\n\nNow let’s\
    \ find out how to use this in practice.\n\n### Layering 3D Isometric Sprites\n\
    \nThe `depthLayering.js` example file uses a tileset composed of three cube images,\
    \ as shown in Figure 4-7.\n\n![A346816_1_En_4_Fig7_HTML.jpg](OEBPS/Images/A346816_1_En_4_Fig7_HTML.jpg)"
