    \ 是精灵在地图数组中的数组位置编号。`gid` 是精灵纹理图像在瓦片集上的网格 ID 编号。这两个属性在后续碰撞检测中会非常有用，你将在第 3 章中找到具体用法。敬请期待！\n\
    \n现在让我们了解如何使用 `makeTiledWorld` 来构建游戏。\n\n## 创建游戏世界\n\n查看本章源文件中的 `fantasy.js` 文件，可以找到我们创建的游戏世界的工作示例。图\
    \ 2-15 将左侧最终渲染的地图与我们最初在 Tiled Editor 中设计的地图进行了对比。\n\n![A346816_1_En_2_Fig15_HTML.jpg](img/A346816_1_En_2_Fig15_HTML.jpg)\n\
    \n###### 图 2-15. 渲染后的游戏世界与我们用 Tiled Editor 设计的地图一致\n\n使用键盘方向键让精灵在游戏世界中行走，你会注意到精灵的深度层次也是正确的。让我们了解\
    \ `makeTiledWorld` 函数是如何构建这个场景的。\n\n### 创建精灵\n\n当游戏代码的 `setup` 函数运行时，世界会通过 `makeTiledWorld`\
    \ 从 JSON 文件和瓦片集图像中创建。\n\n```\nworld = g.makeTiledWorld(\n    \"maps/fantasy.json\"\
    ,\n    \"images/fantasy.png\"\n  );\n```\n\n这会生成地图，并让我们通过一个名为 `world` 的对象访问所有地图数据。\n\
    \n动画精灵角色是使用另一张名为 `walkcycle.png` 的瓦片集图像创建的，该图像包含精灵的所有动画帧，如图 2-16 所示。\n\n![A346816_1_En_2_Fig16_HTML.jpg](img/A346816_1_En_2_Fig16_HTML.jpg)\n\
    \n###### 图 2-16. 精灵的动画瓦片集\n\n以下是游戏 `setup` 函数中使用该动画瓦片集创建精灵的代码。\n\n```\nelf = g.sprite(g.filmstrip(\"\
    images/walkcycle.png\", 64, 64));\n```\n\n自定义的 `filmstrip` 函数捕获 `walkcycle` 瓦片集中每个\
    \ 64x64 像素的帧，并用它来初始化精灵。\n\n你记得我们在 Tiled Editor 中创建了一个占位对象来代表精灵，并用它来设置精灵的 `x` 和\
    \ `y` 位置。接下来我们要做的是使用这些值来定位新的精灵。我们添加到 `world` 对象中的 `getObject` 方法能够从地图数据中提取任何具有\
    \ `name` 属性的内容。以下是使用 `getObject` 捕获精灵的 `x` 和 `y` 地图数据值，并将其应用于精灵的 `x` 和 `y` 位置属性的方法。\n\
    \n```\nelf.x = world.getObject(\"elf\").x;\nelf.y = world.getObject(\"elf\").y;\n\
    ```\n\n这个新的精灵还不是世界的一部分，因此将其添加到世界的对象层。首先获取对象层的引用，然后使用 `addChild` 将精灵添加到其中。\n\n\
    ```\nlet objectsLayer = world.getObject(\"objects\");\nobjectsLayer.addChild(elf);\n\
    ```\n\n游戏的其余部分负责移动精灵并使其动画化。它还实现了碰撞检测，你将在下一章全面了解其工作原理。\n\n### 更改精灵的深度层\n\n精灵可以在树木和墙壁后面及前面行走，且无需任何其他深度排序代码即可确保其正确显示。这怎么可能？因为后台运行的\
    \ PixiJS 渲染器会按照创建的先后顺序显示精灵——后创建的精灵显示在先创建的精灵之前。大多数 2D 渲染器都以相同方式工作。而且，由于我们是从最底层（地面）开始创建精灵，并逐层向上，因此\
    \ Tiled Editor 上层中的精灵会渲染在下层精灵的前面。这一切都是自动发生的，这得益于我们在 Tiled Editor 中设计图层时的精心规划，以及\
    \ `makeTiledWorld` 函数中创建精灵的顺序。\n\n但如果在游戏进行过程中想要更改精灵的深度层，该怎么办？例如，也许精灵在某个地方发现了梯子，能够爬到墙壁顶部。如何让精灵显示在墙壁之上但在树冠之下？\n\
    \n获取 `\"treeTops\"` 图层组的引用，并将精灵添加到其中。\n\n```\nworld.getObject(\"treeTops\").addChild(elf);\n\
    ```\n\n图 2-17 显示了结果。\n\n![A346816_1_En_2_Fig17_HTML.jpg](img/A346816_1_En_2_Fig17_HTML.jpg)\n\
    \n###### 图 2-17. 更改精灵的深度层\n\n既然我们有一个广阔的游戏世界可以探索，让我们添加滚动摄像头。\n"
- fmt: "# A Scrolling World Camera\n\nOur game map is much bigger than the game screen\
    \ that it’s being displayed in. But, you’ll notice that it scrolls very naturally\
    \ to follow the elf wherever it goes. In this section you’ll learn how this scrolling\
    \ game camera was implemented so that you can use these concepts to build a similar\
    \ camera for your own games.\n\nBut before we find out how it was made, let’s\
    \ first take a quick look at the high-level game code you’ll need to write to\
    \ create and use the camera. First, initialize the camera in a game world like\
    \ this:\n\n```\ncamera = g.worldCamera(world, world.worldWidth, world.worldHeight,\
    \ anyCanvasElement);\n```\n\nThe first argument is an sprite with `x`, `y` properties.\
    \ The second two arguments define the width and height of the game world, in pixels.\
    \ The last is the canvas HTML element that the world is being rendered in.\n\n\
    The camera object has two useful methods that you can use to control it: `centerOver`\
    \ and `follow`. You can make the camera center itself over a sprite using the\
    \ `centerOver` method, like this:\n\n```\ncamera.centerOver(sprite);\n```\n\n\
    Use the following method to make the camera follow any sprite inside a game loop\
    \ like this:\n\n```\nfunction gameLoop() {\n  camera.follow(sprite);\n}\n```\n\
    \nThe camera has an invisible inner boundary, which is half the canvas size. You\
    \ can see this invisible inner boundary on the first image of Figure [2-18](#A346816_1_En_2_Chapter.xhtml#Fig18).\
    \ A sprite can move freely within this boundary and the camera won’t start moving\
    \ until the sprite crosses it. The camera will stop moving when it reaches the\
    \ edge of the map, but the sprite is free to walk all the way. Figure [2-18](#A346816_1_En_2_Chapter.xhtml#Fig18)\
    \ illustrates all these features, which results in a natural looking scrolling\
    \ effect.\n\n![A346816_1_En_2_Fig18_HTML.gif](OEBPS/Images/A346816_1_En_2_Fig18_HTML.gif)\n\
    \n###### Figure 2-18. A scrolling game camera that lets a sprite move freely around\
    \ the game world\n\n- You can think of the camera as a kind of invisible sprite\
    \ that hangs over the world. It has an `x` and `y` position, and a height and\
    \ width. The camera has a method called `follow` that changes the camera’s `x`\
    \ and `y` coordinates to keep up with any sprite that it’s following, and a method\
    \ called `centerOver` that centers the camera over any sprite. It also checks\
    \ its position in relation to the size of the map, so that it stops itself if\
    \ it reaches the map edges.\n\n- Here’s the complete `worldCamera` function that\
    \ does all this.\n\n```\n    worldCamera(world, worldWidth, worldHeight, canvas)\
    \ {\n\n//Define a `camera` object with helpful properties                  \n\
    \      let camera = {\n        width: canvas.width,\n        height: canvas.height,\n\
    \        _x: 0,\n        _y: 0,\n\n//`x` and `y` getters/setters             \
    \     \n        //When you change the camera's position,                  \n \
    \       //they shift the position of the world in the opposite direction     \
    \             \n        get x() {\n          return this._x;\n        },\n   \
    \     set x(value) {\n          this._x = value;\n          world.x = -this._x;\n\
    \        },\n        get y() {\n          return this._y;\n        },\n        set\
    \ y(value) {\n          this._y = value;\n          world.y = -this._y;\n        },\n\
    \n//The center x and y position of the camera                  \n        get centerX()\
    \ {\n          return this.x + (this.width / 2);\n        },\n        get centerY()\
    \ {\n          return this.y + (this.height / 2);\n        },\n\n//Boundary properties\
    \ that define a rectangular area, half the size                  \n        //of\
    \ the game screen. If the sprite that the camera is following                \
    \  \n        //is inide this area, the camera won't scroll. If the sprite    \
    \              \n        //crosses this boundary, the `follow` function ahead\
    \ will change                  \n        //the camera's x and y position to scroll\
    \ the game world                  \n        get rightInnerBoundary() {\n          return\
    \ this.x + (this.width / 2) + (this.width / 4);\n        },\n        get leftInnerBoundary()\
    \ {\n          return this.x + (this.width / 2) - (this.width / 4);\n        },\n\
    \        get topInnerBoundary() {\n          return this.y + (this.height / 2)\
    \ - (this.height / 4);\n        },\n        get bottomInnerBoundary() {\n          return\
    \ this.y + (this.height / 2) + (this.height / 4);\n        },\n\n//The code next\
    \ defines two camera                  \n        //methods: `follow` and `centerOver`\n\
    \n//Use the `follow` method to make the camera follow a sprite               \
    \   \n        follow: function(sprite) {\n\n//Check the sprites position in relation\
    \ to the inner                  \n          //boundary. Move the camera to follow\
    \ the sprite if the sprite                  \n          //strays outside the boundary\
    \                  \n          if(sprite.x < this.leftInnerBoundary) {\n            this.x\
    \ = sprite.x - (this.width / 4);\n          }\n          if(sprite.y < this.topInnerBoundary)\
    \ {\n            this.y = sprite.y - (this.height / 4);\n          }\n          if(sprite.x\
    \ + sprite.width > this.rightInnerBoundary) {\n            this.x = sprite.x +\
    \ sprite.width - (this.width / 4 * 3);\n          }\n          if(sprite.y + sprite.height\
    \ > this.bottomInnerBoundary) {\n            this.y = sprite.y + sprite.height\
    \ - (this.height / 4 * 3);\n          }\n\n//If the camera reaches the edge of\
    \ the map, stop it from moving                  \n          if(this.x < 0) {\n\
    \            this.x = 0;\n          }\n          if(this.y < 0) {\n            this.y\
    \ = 0;\n          }\n          if(this.x + this.width > worldWidth) {\n            this.x\
    \ = worldWidth - this.width;\n          }\n          if(this.y + this.height >\
    \ worldHeight) {\n            this.y = worldHeight - this.height;\n          }\n\
    \        },\n\n//Use the `centerOver` method to center the camera over a sprite\
    \                  \n        centerOver: function(sprite) {\n\n//Center the camera\
    \ over a sprite                  \n          this.x = (sprite.x + sprite.halfWidth)\
    \ - (this.width / 2);\n          this.y = (sprite.y + sprite.halfHeight) - (this.height\
    \ / 2);\n        }\n      };\n\n//Return the `camera` object                 \
    \ \n      return camera;\n    };\n```\n\n- (You’ll find the `worldCamera` function\
    \ in `hexi/src/modules/gameUtilities/src/gameUtilities.js`).\n\n- You can see\
    \ that the camera is really just a data model that’s used to figure out which\
    \ part of the world should be visible on the canvas. The camera compares its size\
    \ and position against the sprite that it’s following and the edges of the world.\n\
    \n- The trick is that the camera never actually moves. When you change its `x`\
    \ and `y` position, it’s actually shifting the position of the world by the inverse\
    \ amount.\n\n```\n    set x(value) {\n      this._x = value;\n      world.x =\
    \ -this._x;\n    },\n    set y(value) {\n      this._y = value;\n      world.y\
    \ = -this._y;\n    },\n```\n\n- This makes the camera look like as if it’s moving\
    \ around in the world, when in fact it’s moving the world in the opposite direction.\n\
    \n## Summary\n\nTiled Editor is one of the most useful software tools a game designer\
    \ can learn. You’ve learned how to set up game maps; import tilesets; and use\
    \ Tiled Editor’s layers, objects, and tools to design your game worlds. You’ve\
    \ also learned how to read Tiled Editor’s JSON map data, and use that data to\
    \ build reusable code for making a wide range of different games. And, you found\
    \ out how easy it is to correctly depth layer the game objects, and add a camera\
    \ that can follow a game character all around the world.\n\nBut, we’re not done\
    \ yet! You’ll notice that in the demo game in this chapter that when the elf character\
    \ walks around the world, its path is blocked by trees, bushes, and walls. And,\
    \ the elf can pick up objects in the world. How does that work? You’ll find out\
    \ in the next chapter, when to take a detailed look at collision detection for\
    \ tile-based games.\n\n© Rex van der Spuy 2017\n\nRex van der Spuy, The Advanced\
    \ Game Developer's Toolkit, 10.1007/978-1-4842-1097-0_3"
