  trans: "\n### 编码空间网格\n\n我们首先需要创建网格。这只是一个二维数组，其中的单元格数量与我们想要的网格行数和列数相匹配。数组首先被初始化为空元素。然后，代码遍历所有精灵，并使用我们熟悉的\
    \ `getIndex` 函数，根据每个精灵的 x/y 像素坐标将它们插入到正确的单元格中。我们的代码在一个名为 `spatialGrid` 的函数中完成所有这些操作，该函数允许你指定网格的大小以及每个单元格的大小（以像素为单位）。\n\
    \n```\nlet spatialGrid = (widthInPixels, heightInPixels, cellSizeInPixels, spritesArray)\
    \ => {\n\n  //找出我们需要多少个单元格以及网格数组应该有多长              \n  let width = widthInPixels\
    \ / cellSizeInPixels,\n    height = heightInPixels / cellSizeInPixels,\n    length\
    \ = width * height;\n\n  //初始化一个空网格              \n  let gridArray = [];\n\n \
    \ //向元素中添加空的子数组              \n  for (let i = 0; i < length; i++) {\n\n    //向每个元素添加空数组。我们将在这里\
    \              \n    //存储精灵引用              \n    gridArray.push([]);\n  }\n\n\
    \  //将精灵添加到网格              \n  spritesArray.forEach(sprite => {\n\n    //找出精灵当前的映射索引位置\
    \              \n    let index = getIndex(sprite.x, sprite.y, cellSizeInPixels,\
    \ cellSizeInPixels, width);\n\n    //将精灵添加到该索引位置的数组中              \n    gridArray[index].push(sprite);\n\
    \  });\n\n  //返回数组              \n  return gridArray;\n};\n\n//创建空间网格并将大理石精灵添加到其中\
    \                  \nlet grid = spatialGrid(512, 512, 64, marbles.children);\n\
    ```\n\n现在我们有了一个名为 `grid` 的二维数组。它包含的每个子数组要么为空，要么以与屏幕上精灵位置相匹配的方式包含对精灵的引用。例如，你可能会得到一个如下所示的数组：\n\
    \n```\n[\n  [],[circle1],[],[],[],[],[],[circle2],[],\n  [circle3],[],[circle4],[circle5],[],[],[],[],[],\n\
    \  [],[],[],[],[],[],[],[],[circle6],\n  [],[],[],[circle7],[circle8],[],[],[],[],\n\
    \  [],[circle9],[],[circle10],[],[circle11],[],[],[],\n  [circle12, circle13],[],[],[],[],[],[circle14],[circle15],[],\n\
    \  [circle16],[circle17],[],[],[],[circle18],[],[],[],\n  [],[],[circle19],[],[],[circle20],[],[],[circle21],\n\
    \  [],[circle20],[circle23],[],[],[],[],[circle24],[circle25]\n]\n```\n\n（精灵的实际名称，如\
    \ `circle1` 和 `circle2`，仅用于说明目的——这些名称实际上并非由代码生成。）\n\n图 7-7 展示了这个数组如何与相同精灵的屏幕位置进行比较。\n\
    \n![A346816_1_En_7_Fig7_HTML.jpg](img/A346816_1_En_7_Fig7_HTML.jpg)\n\n######\
    \ 图 7-7. 精灵在数组中的位置与它们在屏幕上的位置相匹配\n\n在精灵密集分布的游戏里，你可能会有许多单元格包含对多个精灵的引用。\n\n下一步是遍历所有精灵，并找出其碰撞区域内是否有其他精灵。（请记住，碰撞区域是指精灵周围的八个单元格，加上精灵自身所在的单元格。）如果碰撞区域内有任何精灵，代码将使用一个名为\
    \ `movingCircleCollision` 的自定义函数执行窄阶段碰撞检查，以使精灵相互弹开（关于 `movingCircleCollision`\
    \ 如何工作的详细信息，请参阅《Foundation Game Design with HTML5 and JavaScript》（Apress，2012））。最后，当前正在检查的精灵会从网格数组中移除，因为其所有可能的碰撞都已检查完毕，并且我们希望防止其他精灵在循环的后续迭代中重新检查它。\n\
    \n```\n//遍历所有精灵                  \nfor (let i = 0; i < marbles.children.length;\
    \ i++) {\n\n  //获取循环中当前精灵的引用              \n  let sprite = marbles.children[i];\n\
    \n  //找出精灵当前的映射索引位置              \n  let gridWidthInTiles = 512 / 64;\n  let index\
    \ = getIndex(sprite.x, sprite.y, 64, 64, gridWidthInTiles);\n\n  //找出周围单元格包含的内容，包括那些可能超出网格边界的单元格\
    \              \n  let allSurroundingCells = [\n    grid[index - gridWidthInTiles\
    \ - 1],\n    grid[index - gridWidthInTiles],\n    grid[index - gridWidthInTiles\
    \ + 1],\n    grid[index - 1],\n    grid[index],\n    grid[index + 1],\n    grid[index\
    \ + gridWidthInTiles - 1],\n    grid[index + gridWidthInTiles],\n    grid[index\
    \ + gridWidthInTiles + 1]\n  ];\n\n  //找出所有可能与当前精灵发生碰撞的精灵              \n  for\
    \ (let j = 0; j < allSurroundingCells.length; j++) {\n\n    //获取当前周围单元格的引用   \
    \           \n    let cell = allSurroundingCells[j];\n\n    //如果该单元格不是 `undefined`（超出网格边界）\
    \              \n    //并且不为空，则检查当前精灵与单元格中的精灵之间是否存在碰撞              \n    if (cell\
    \ && cell.length !== 0) {\n\n      //遍历单元格中的所有精灵              \n      for (let\
    \ k = 0; k < cell.length; k++) {\n\n        //获取单元格中正在检查的当前精灵的引用             \
    \ \n        let surroundingSprite = cell[k];\n\n        //如果单元格中的精灵与主循环中的当前精灵不是同一个，则检查这两个精灵之间是否存在碰撞\
    \              \n        if (surroundingSprite !== sprite) {\n\n          //执行窄阶段碰撞检查，使精灵相互弹开\
    \              \n          g.movingCircleCollision(sprite, surroundingSprite);\n\
    \        }\n      }\n    }\n  }\n\n  //最后，将当前这个精灵从当前的空间网格单元格中移除，因为涉及该精灵的所有可能碰撞都已被检查完毕\
    \              \n  grid[index] = grid[index].filter(x => x !== sprite);\n}\n```\n\
    \n这就是全部内容！通过首先执行高效的宽阶段检查，并且仅在有碰撞可能性时才执行性能密集型的窄阶段检查，我们极大地提高了碰撞系统的效率。\n\n为什么这段代码使用老式的\
    \ `for` 循环，而不是更简洁现代的 `forEach` 循环？`for` 循环的效率通常稍微高一点。通常，这种差异并不足以让人普遍偏爱 `for` 循环，但由于碰撞检测是游戏中最消耗性能的任务之一，在这种情况下使用\
    \ `for` 循环通常能为你带来一点性能提升。\n"
- fmt: "### Other Broadphase Collision Strategies\n\nA spatial grid is an excellent\
    \ all-purpose broadphase collision-detection system that is a game designer’s\
    \ staple. It’s hard to be beat for simplicity, speed and low overhead. However,\
    \ there are many other broadphase collision strategies that each has its unique\
    \ take on the problem. Here are the four most popular:\n\n- **Hierarchical grid**:\
    \ In a fixed-sized spatial grid such as the one we’ve been using in this chapter,\
    \ the cell size must be as large as the largest object. But what if you have a\
    \ game with a few very big objects and a lot of very small objects? The cell size\
    \ will need to be big enough to accommodate those large objects, even if there\
    \ aren’t very many of them. You’ll end up with a situation where each cell is\
    \ full of many small objects, each doing expensive distance checks against one\
    \ another. A hierarchical grid solves this possible problem by creating two or\
    \ more grids of different-sized cells. It creates a grid with big cells for the\
    \ big objects, and another one for the small objects, and any range of differing\
    \ cell size grids in between. Collision checks between small objects are handled\
    \ in the small-cell grid, and collisions between big objects are handled in the\
    \ big-cell grid. If a small object needs to check for a collision with a big object,\
    \ the system checks the cells that correspond to both grids.\n\n- **Quadtree**:\
    \ A specific type of hierarchical grid. The game world is divided into 4 rectangles,\
    \ which are in turn divided into 4 more rectangles, resulting in 16. Each of those\
    \ 16 rectangles is again split into 4 smaller rectangles, and this continues depending\
    \ on how much detail you need. Each of the smaller rectangles is a child of the\
    \ larger parents. The quadtree system figures out which objects to test for collisions\
    \ depending on their level in their hierarchy. The 3D version of the quadtree\
    \ is called an octree.\n\n- **Sort and sweep**: Sort the objects in arrays based\
    \ on their `x` and `y` positions. Check for overlaps on the `x` and `y` axes and,\
    \ if found, do a more precise distance check. Because the objects are spatially\
    \ sorted first, likely collision candidates come to the forefront first.\n\n-\
    \ **BSP tree**: Space is partitioned in a way that closely matches the geometry\
    \ of the game objects. It’s useful because it means that the partitions can be\
    \ used both for collisions and to define environmental boundaries. Binary space\
    \ partitioning (BSP) trees are closely related to quadtrees, but they’re more\
    \ versatile. BSP trees are widely used in collision detection for 3D games.\n\n\
    I suggest that you spend some time researching these other broadphase collision\
    \ strategies. You may find one of them holds a particularly good solution to a\
    \ complex collision problem you might be facing.\n\nThe definitive reference text\
    \ on collision for games is Christer Ericson’s classic *Real Time Collision Detection*\
    \ (Morgan Kaufman, 2004.) Although the source code examples are written in `C++`\
    \ (a close relative of `JavaScript`), the algorithms can be adapted for any programming\
    \ language or technical implementation.\n\nBut remember: don’t try and preemptively\
    \ optimize your collision system before you need to! If your game runs fine on\
    \ all your target platforms without needing to use a spatial grid or a quadtree\
    \ just leave it alone – it’s fine!\n\n## Summary\n\nIn this chapter you’ve learned\
    \ how you can add hidden game information in arrays, and use that information\
    \ to add a richness and complexity to your game world. The AI race car showed\
    \ you how, with minimal, easy code, you can create a game entity that behaves\
    \ in a complex, intelligent, and unpredictable way. You also learned how to create\
    \ and use the best all-purpose and low-overhead broadphase collision strategy:\
    \ the spatial grid. Using a spatial grid dramatically reduces the number of collision\
    \ checks your games will need to do, and it’s easy to modify and tweak to your\
    \ needs.\n\nAnd, we’ve reached the end of the book! You’ve now got all the skills\
    \ you need to start making a wide variety of 2D action games in any genre. From\
    \ level design, to collision detection to pathfinding and the amazing efficiency\
    \ of tile-based architecture, you’ve now mastered all the game designer’s classic\
    \ techniques. Now go and make some great games!\n\n# Index\n\n## A\n\n1.  `A*`\
    \ (A star)\n    1.  code\n        1.  node map\n        2.  `shortestPath` function\n\
    \        3.  source files\n        4.  universe\n    2.  cost calculation\n  \
    \  3.  cross-checking nodes\n    4.  Dijkstra’s algorithm\n    5.  heuristic\n\
    \    6.  influence map\n    7.  link nodes\n    8.  nodes\n    9.  pathfinding\n\
    \    10.  second step\n    11.  strategies\n    12.  two-dimensional array/grid\n\
    \    13.  variable terrain\n\n## B\n\n1.  Binary space partitioning (BSP) trees\n\
    2.  Broadphase collision\n\n## C\n\n1.  Cartesian *vs.* isometric rendering\n\
    2.  Collision detection, isometric\n\n## D\n\n1.  Diagonal method\n2.  Dijkstra’s\
    \ algorithm\n\n## E, F\n\n1.  Euclidean method\n\n## G\n\n1.  Ga (index entry)\n\
    2.  Game design\n    1.  AI systems\n        1.  arrays\n        2.  controlled\
    \ robot car\n        3.  keyboard\n    2.  broadphase and narrowphase collision\n\
    \        1.  broadphase collision strategies\n        2.  BSP tree\n        3.\
    \  hierarchical grid\n        4.  implementation\n        5.  quadtree\n     \
    \   6.  sort and sweep\n        7.  source code\n        8.  spatial grid\n  \
    \      9.  steps\n    3.  broadphase collision detection\n    4.  spatial grid\n\
    \n## H\n\n1.  Heuristic method\n2.  Hexi\n    1.  game sprites\n    2.  source\
    \ code\n\n## I, J, K\n\n1.  Inverse collision detection\n    1.  `alienVsFloor`\n\
    \    2.  game loop\n    3.  maze walls\n    4.  obstacles\n    5.  walls\n2. \
    \ Isometric projection\n    1.  arrow keys\n    2.  *vs.* cartesian\n    3.  cartesian\
    \ tile map\n    4.  collision detection\n    5.  coordinates\n    6.  diamond\
    \ shaped tiles\n    7.  depth layering\n        1.  3 isometric sprite images\n\
    \        2.  updation\n        3.  z property value\n    8.  differences\n   \
    \ 9.  fixed-perspective 3D effect\n    10.  formula\n    11.  game character around\n\
    \    12.  game map\n    13.  `isoRectangle` function\n    14.  map array index\n\
    \    15.  properties\n    16.  sprites\n    17.  Tiled Editor\n        1.  configuration\n\
    \        2.  game prototype\n        3.  game world\n        4.  `makeIsoTiledWorld`\
    \ function\n\n## L\n\n1.  Line of sight\n    1.  `arrayOfPoints`\n    2.  collision\
    \ points\n    3.  `lineOfSight` function\n    4.  normalized vector\n    5.  obstacles\n\
    \    6.  plot points\n    7.  sprites\n    8.  unit vector\n    9.  vector\n\n\
    ## M\n\n1.  `makeTiledWorld` function\n\n## N, O\n\n1.  Narrowphase collision\n\
    \n## P, Q, R\n\n1.  Pathfinding\n    1.  `A*` algorithm\n    2.  alien hunting\n\
    \        1.  closest direction\n        2.  vector calculation\n    3.  basics\
    \ of\n    4.  line of sight\n        1.  `arrayOfPoints`\n        2.  collision\
    \ points\n        3.  `lineOfSight` function\n        4.  normalized vector\n\
    \        5.  obstacles\n        6.  plot points\n        7.  sprites\n       \
    \ 8.  unit vector\n        9.  vector\n    5.  monsters navigate\n    6.  random\
    \ movement\n        1.  direction and speed\n        2.  game loop\n        3.\
    \  `isCenteredOverCell` function\n        4.  valid directions\n    7.  tile-based\
    \ maze environment\n        1.  angles\n        2.  collision\n        3.  modifications\n\
    \        4.  `tileBasedLineOfSight` function\n2.  Pythagorean theorem\n\n## S\n\
    \n1.  Shortest path\n    - See `A*` (A star)\n    1.  heuristics\n    2.  Manhattan\
    \ method\n    3.  `remove` function\n    4.  rounding corners\n    5.  two-part\
    \ process\n    6.  way points\n    7.  `wayPoints2DArray`\n2.  `shortestPath`\
    \ function\n3.  Spritesheets (See Tilesets)\n4.  `surroundingNodes` function"
