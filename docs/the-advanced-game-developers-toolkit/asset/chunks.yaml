- fmt: '###### Figure 6-4. The shortest path is also the least expensive


    Earlier, I mentioned that computers can see only one step in the path at any given
    time. You can see from Figure [6-3](#A346816_1_En_6_Chapter.xhtml#Fig3) that each
    step is the least expensive step that could have been chosen to get to point B.
    But that’s only obvious after you already know the outcome of the path. The computer
    doesn’t know this before it starts building the path. How does it know which step
    to take next, directly from point A?


    ### Finding the Second Step


    In A*’s terminology, every step in the path is called a node. As far as we’re
    concerned, nodes are just cells in a two-dimensional array or grid. However, I’m
    going to start calling them nodes from now on, just so that you get used to that
    term. You’ll find it widely used in discussions of pathfinding in other texts.
    A* uses the term node because there’s no reason why you can’t divide your space
    in ways other than a rectangular grid, such as by using hexagons or circles. But
    for our purposes, when you hear me talk about nodes, just know that I mean grid
    cells.


    A* starts searching for the shortest path at point A. Point A is the parent node.
    A parent node is a definite, confirmed step on the path. Obviously, we know that
    point A is going to be the first step, so it automatically becomes the first parent
    node.


    If we know what the first step is, how do we find the second step? A* must check
    all eight cells surrounding the parent node to discover which of those is the
    next most likely candidate. Figure [6-5](#A346816_1_En_6_Chapter.xhtml#Fig5) shows
    point A as the parent node, and all the surrounding nodes that it needs to check.
    (If any of those nodes happen to be walls or impassable objects, it ignores them.)


    ![A346816_1_En_6_Fig5_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig5_HTML.jpg)


    ###### Figure 6-5. Check all the nodes surrounding the parent to see which might
    be the next most likely step in the path


    Each of these surrounding cells declares the current parent node as its parent.
    The code that does this in the A* algorithm will look something like this:


    ```

    surroundingNode.parent = currentParent;

    ```


    This is important because it means that A* can trace the best path to the destination
    by following the trail of parent nodes. Don’t worry too much about this now, as
    you’ll see how it works in the pages ahead. Just remember that each node has a
    `parent` property that keeps track of the node that it’s linked to in the path.


    A* then needs to find out what the cost will be to travel from the parent node
    to the surrounding child nodes. It turns out that this happens to be an important
    number, so A* refers to this cost as `G`. Figure [6-6](#A346816_1_En_6_Chapter.xhtml#Fig6)
    shows the `G` costs for all the surrounding nodes.


    ![A346816_1_En_6_Fig6_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig6_HTML.jpg)


    ###### Figure 6-6. Each surrounding node is given a cost, referred to in A*’s
    terminology as `G`


    A* then figures out which surrounding node is closer to the destination, point
    B. It calculates the cost of traveling from point B to every surrounding node.
    (The wall standing in the way is treated as if it were not there for now, but
    as you’ll see, this is compensated for by later tests.) Figure [6-7](#A346816_1_En_6_Chapter.xhtml#Fig7)
    shows the path from the first surrounding node to point B. You can see that it
    calculated the cost of the test path from that node as 54.


    ![A346816_1_En_6_Fig7_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig7_HTML.jpg)


    ###### Figure 6-7. Figure out the cost of each path from every surrounding node
    to point B


    This distance test is called a heuristic. Heuristic simply means figuring something
    out by trial and error. (It’s derived from the Greek work *heuriskein*, which
    means find.) Heuristic is not random trial and error, however. It’s trial and
    error within a set of logical rules that are likely to produce the answer we’re
    seeking. A* has no idea which of the surrounding child nodes will end up with
    the least expensive path, so it just tries all eight of them. The cost of each
    heuristic path also happens to be very important, so A* refers to this cost as
    `H`.


    There are actually three commonly used ways of calculating the heuristic path:
    Manhattan, Euclidean, and diagonal. We’ll be looking at each of these in detail
    in the “Understanding Heuristics” section later in this chapter. For now, just
    know that these are specific ways for calculating the distance from the surrounding
    test node to the destination point.


    A* figures out the `H` cost for every surrounding child node. If you combine the
    `H` and `G` costs, you come up with a third, final cost, called `F`. Figure [6-8](#A346816_1_En_6_Chapter.xhtml#Fig8)
    shows what all the `G`, `H`, and `F` costs are for each node.


    ![A346816_1_En_6_Fig8_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig8_HTML.jpg)


    ###### Figure 6-8. Find the final `F` cost of each node by adding the `G` and
    `H` costs together


    The winner is the node with the lowest `F` cost. Can you see it? It’s the one
    directly to the right of the parent node, as shown in Figure [6-9](#A346816_1_En_6_Chapter.xhtml#Fig9).


    ![A346816_1_En_6_Fig9_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig9_HTML.jpg)


    ###### Figure 6-9. The node with the lowest `F` cost becomes the most likely next
    step in the path


    This node now becomes a potential new parent node. A* doesn’t yet know for sure
    whether this will be the best second step to take, but as far as it can tell,
    it’s a pretty good place to continue checking. (In fact, it’s not the best second
    step, but A* will soon find this out, as you will see.)


    You can see from Figure [6-9](#A346816_1_En_6_Chapter.xhtml#Fig9) that each parent
    node represents a potential step in the path to point B. I use the word *potential*
    because A* doesn’t know for sure whether any given parent node is the best step
    until it does a little more checking. You can already see a problem occurring
    in Figure [6-9](#A346816_1_En_6_Chapter.xhtml#Fig9). The new parent node is *not*
    the best next step. It would be better to move diagonally up from point A. Figure
    [6-10](#A346816_1_En_6_Chapter.xhtml#Fig10) illustrates this.


    ![A346816_1_En_6_Fig10_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig10_HTML.jpg)


    ###### Figure 6-10. The obvious first choice isn’t always the best one. How will
    A* figure out that it’s better to move diagonally up from the start point?


    Luckily, A* has a system for cross-checking nodes and weeding out inefficiencies
    like this. A* keeps track of the possible best parent nodes to use for the route
    by keeping two lists:


    *   Closed list: This is a list of nodes that don’t need to be checked. Whenever
    a new parent node is found, it’s added to this list.

    *   Open list: This is a list of all the nodes surrounding each parent. They’re
    the nodes that need to be checked.


    When a new potential parent node checks all the surrounding nodes, it looks at
    each node’s previous `G` cost on the open list. Figure [6-11](#A346816_1_En_6_Chapter.xhtml#Fig11)
    shows that the previous `G` cost for the node directly above it was 14.


    ![A346816_1_En_6_Fig11_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig11_HTML.jpg)


    ###### Figure 6-11. The old `G` cost was 14. Will its new cost be more or less?


    To find its new `G` cost, A* takes the current `G` value of the parent node and
    adds 10 more, which is the cost of traveling up one node. That brings the total
    new `G` cost to 20. Figure [6-12](#A346816_1_En_6_Chapter.xhtml#Fig12) illustrates
    this.


    ![A346816_1_En_6_Fig12_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig12_HTML.jpg)'
