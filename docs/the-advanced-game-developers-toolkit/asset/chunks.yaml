    \ tilesetX, tilesetY,\n        world.tilewidth, world.tileheight\n      );\n\n\
    \      // 我决定任何具有 `name`（名称）属性的图块都是重要的\n      // 并且应该在 `world.objects` 数组中可访问\n\
    \n      let tileproperties = tiledMap.tilesets[0].tileproperties,\n        key\
    \ = String(gid - 1);\n\n      // 如果 JSON 的 `tileproperties` 对象有一个与当前图块匹配的子对象，\n\
    \      // 并且该子对象有一个 `name`（名称）属性，\n      // 则创建一个精灵并将图块属性赋值到\n      // 该精灵上\n\
    \      if (tileproperties[key] && tileproperties[key].name) {\n\n        // 创建一个精灵\n\
    \        tileSprite = new PIXI.Sprite(texture);\n\n        // 将图块的所有属性复制到精灵上\n\
    \        // （这包括 `name`（名称）属性）\n        Object.keys(tileproperties[key]).forEach(property\
    \ => {\n\n          tileSprite[property] = tileproperties[key][property];\n  \
    \      });\n\n        // 将精灵推入世界的 `objects`（对象）数组\n        // 以便稍后可以通过 `name`（名称）访问它\n\
    \        world.objects.push(tileSprite);\n      }\n\n      // 如果图块没有 `name`（名称）属性，则只需用它来\n\
    \      // 创建一个普通精灵（它只需要一个纹理）\n      else {\n        tileSprite = new PIXI.Sprite(texture);\n\
    \      }\n\n      // 为精灵添加等距属性\n      addIsoProperties(\n        tileSprite, mapX,\
    \ mapY,\n        world.cartTilewidth, world.cartTileheight\n      );\n\n     \
    \ // 使用等距位置将精灵添加到世界中\n      tileSprite.x = tileSprite.isoX;\n      tileSprite.y\
    \ = tileSprite.isoY;\n      tileSprite.z = z;\n\n      // 记录精灵在数组中的索引号\n     \
    \ // （稍后我们会用它进行碰撞检测）\n      tileSprite.index = index;\n\n      // 记录精灵在图块集上的 `gid`。\n\
    \      // 稍后这对碰撞检测也很有用\n      tileSprite.gid = gid;\n\n      // 将精灵添加到当前图层组\n\
    \      layerGroup.addChild(tileSprite);\n    }\n  });\n}\n\n// 这个图层是 `objectgroup`（对象组）吗？\n\
    if (tiledLayer.type === \"objectgroup\") {\n  tiledLayer.objects.forEach(object\
    \ => {\n\n    // 我们只是要捕获对象的属性\n    // 以便稍后决定如何处理它。\n    // 获取对象所在的图层组的引用\n   \
    \ object.group = layerGroup;\n\n    // 将对象推入世界的 `objects`（对象）数组\n    world.objects.push(object);\n\
    \  });\n}\n\n// z 索引加 1（第一个图层的 z 索引为 `1`）\nz += 1;\n});\n\n// 搜索函数\nworld.getObject\
    \ = (objectName) => {\n  let searchForObject = () => {\n    let foundObject;\n\
    \    world.objects.some(object => {\n      if (object.name && object.name ===\
    \ objectName) {\n        foundObject = object;\n        return true;\n      }\n\
    \    });\n    if (foundObject) {\n      return foundObject;\n    } else {\n  \
    \    throw new Error(\"不存在属性名称为 \" + objectName + \" 的对象\");\n    }\n  };\n\n\
    \  // 返回搜索函数\n  return searchForObject();\n};\n\nworld.getObjects = (objectNames)\
    \ => {\n  let foundObjects = [];\n  world.objects.forEach(object => {\n    if\
    \ (object.name && objectNames.indexOf(object.name) !== -1) {\n      foundObjects.push(object);\n\
    \    }\n  });\n  if (foundObjects.length > 0) {\n    return foundObjects;\n  }\
    \ else {\n    throw new Error(\"我找不到这些对象\");\n  }\n  return foundObjects;\n};\n\
    \n// 就这样，我们完成了！\n// 最后，将 `world` 对象返回给游戏程序\nreturn world;\n```\n\n有了这个新的 `makeIsoTiledWorld`\
    \ 函数，我们就有了一种方法来绘制我们在 Tiled Editor 中创建的地图，并访问它包含的所有精灵。接下来让我们具体了解如何做到这一点。\n"
- fmt: "# Building the Game World\n\nUsing the `makeIsoTiledWorld` function works\
    \ just like our original `makeTiledWorld` function, so there’s really nothing\
    \ new to learn. The only thing you need to keep in mind is that if you change\
    \ the position or `z` property of any sprite, you need to re-sort the sprites\
    \ using our custom `byDepth` function. In this case, all our sprites are in the\
    \ `children` array of each map layer container, so you need to depth sort them\
    \ like this:\n\n```\nmapLayer.children.sort(byDepth);\n```\n\nApart from this,\
    \ there’s nothing new to learn. Here’s the complete application code for the `cubes.js`\
    \ file, which was illustrated in Figure [4-8](#A346816_1_En_4_Chapter.xhtml#Fig8).\
    \ It loads up the isometric map that was created in Tiled Editor, adds keyboard\
    \ interactivity, collision and accurate depth sorting. You’ve see all this code\
    \ before in other contexts, and the comments explain the details.\n\n```\n//The\
    \ files we want to load                  \nlet thingsToLoad = [\n  \"images/cubes.png\"\
    ,\n  \"images/cubes.json\"\n];\n\n//Create a new Hexi instance, and start it \
    \                 \nlet g = hexi(512, 512, setup, thingsToLoad);\n\n//Scale the\
    \ canvas to the maximum browser dimensions                  \ng.scaleToWindow();\n\
    \n//Declare variables used in more than one function                  \nlet world,\
    \ leftArrow, upArrow,\n  rightArrow, downArrow, message, wallLayer,\n  player,\
    \ wallMapArray;\n\n//Start Hexi                  \ng.start();\n\nfunction setup()\
    \ {\n\n  //Make the world from the Tiled JSON data              \n  world = makeIsoTiledWorld(\n\
    \    \"images/cubes.json\",\n    \"images/cubes.png\"\n  );\n\n  //Add the world\
    \ to the `stage`              \n  g.stage.addChild(world);\n\n  //Position the\
    \ world inside the canvas              \n  let canvasOffset = (g.canvas.width\
    \ / 2) - world.tilewidth / 2;\n  world.x += canvasOffset;\n  world.y = 0;\n\n\
    \  //Get the objects we need from the world              \n  player = world.getObject(\"\
    player\");\n  wallLayer = world.getObject(\"wallLayer\");\n\n  //Add the player\
    \ to the wall layer and set it at              \n  //the same depth level as the\
    \ walls              \n  wallLayer.addChild(player);\n  player.z = 0;\n  wallLayer.children.sort(byDepth);\n\
    \n  //Initialize the player's velocity to zero              \n  player.vx = 0;\n\
    \  player.vy = 0;\n\n  //Make a text object              \n  message = g.text(\"\
    \", \"16px Futura\", \"black\");\n  message.setPosition(5, 0);\n\n  //Create the\
    \ keyboard objects              \n  leftArrow = g.keyboard(37);\n  upArrow = g.keyboard(38);\n\
    \  rightArrow = g.keyboard(39);\n  downArrow = g.keyboard(40);\n\n  //Assign the\
    \ key `press` actions              \n  player.direction = \"none\";\n  leftArrow.press\
    \ = () => player.direction = \"left\";\n  upArrow.press = () => player.direction\
    \ = \"up\";\n  rightArrow.press = () => player.direction = \"right\";\n  downArrow.press\
    \ = () => player.direction = \"down\";\n  leftArrow.release = () => player.direction\
    \ = \"none\";\n  upArrow.release = () => player.direction = \"none\";\n  rightArrow.release\
    \ = () => player.direction = \"none\";\n  downArrow.release = () => player.direction\
    \ = \"none\";\n\n  //Set the game state to `play`              \n  g.state = play;\n\
    }\n\nfunction play() {\n\n  //Change the player character's velocity if it's centered\
    \ over a grid cell              \n  if (Math.floor(player.cartX) % world.cartTilewidth\
    \ === 0\n  && Math.floor(player.cartY) % world.cartTileheight === 0) {\n    switch\
    \ (player.direction) {\n      case \"up\":\n        player.vy = -2;\n        player.vx\
    \ = 0;\n        break;\n      case \"down\":\n        player.vy = 2;\n       \
    \ player.vx = 0;\n        break;\n      case \"left\":\n        player.vx = -2;\n\
    \        player.vy = 0;\n        break;\n      case \"right\":\n        player.vx\
    \ = 2;\n        player.vy = 0;\n        break;\n      case \"none\":\n       \
    \ player.vx = 0;\n        player.vy = 0;\n        break;\n    }\n  }\n\n  //Update\
    \ the player's Cartesian position, based on its velocity              \n  player.cartY\
    \ += player.vy;\n  player.cartX += player.vx;\n\n  //Wall collision          \
    \    \n  //Get a reference to the wall map array              \n  wallMapArray\
    \ = wallLayer.data;\n\n  //Use `hitTestIsoTile` to check for a collision     \
    \         \n  let playerVsGround = hitTestIsoTile(player, wallMapArray, 0, world,\
    \ \"every\");\n\n  //If there's a collision, prevent the player from moving. \
    \             \n  //Subtract its velocity from its position and then set its velocity\
    \ to zero              \n  if (!playerVsGround.hit) {\n    player.cartX -= player.vx;\n\
    \    player.cartY -= player.vy;\n    player.vx = 0;\n    player.vy = 0;\n  }\n\
    \n  //Add world boundaries              \n  let top = 0,\n    bottom = (world.heightInTiles\
    \ * world.cartTileheight),\n    left = 0,\n    right = (world.widthInTiles * world.cartTilewidth);\n\
    \n  //Prevent the player from crossing any of the world boundaries           \
    \   \n  //Top              \n  if (player.cartY < 0) {\n    player.cartY = top;\n\
    \  }\n\n  //Bottom              \n  if (player.cartY + player.cartHeight > bottom)\
    \ {\n    player.cartY = bottom - player.cartHeight;\n  }\n\n  //Left         \
    \     \n  if (player.cartX < left) {\n    player.cartX = left;\n  }\n\n  //Right\
    \              \n  if (player.cartX + player.cartWidth > right) {\n    player.cartX\
    \ = right - player.cartWidth;\n  }\n\n  //Position the sprite's screen `x` and\
    \ `y` position              \n  //using its isometric coordinates            \
    \  \n  player.x = player.isoX;\n  player.y = player.isoY;\n\n  //Get the player's\
    \ index position in the map array              \n  player.index = g.getIndex(\n\
    \    player.cartX, player.cartY,\n    world.cartTilewidth, world.cartTileheight,\
    \ world.widthInTiles\n  );\n\n  //Depth sort the sprites if the player is moving\
    \              \n  if (player.vx !== 0 || player.vy !== 0) {\n    wallLayer.children.sort(byDepth);\n\
    \  }\n\n  //Display the player's x, y and index values              \n  message.content\
    \ = `index: ${player.index}`;\n}\n```\n\n## Summary\n\nWhether your game is displayed\
    \ using Cartesian or isometric projection, the underlying logic behind working\
    \ with tile-based games is the same. As you’ve seen in this chapter, if you know\
    \ how to plot maps, add keyboard interactivity, and do collision detection using\
    \ Cartesian coordinates, you can apply that same logic to isometric maps, with\
    \ the addition of two simple little conversion formulas. You’ve also learned how\
    \ to apply these formulas to pointer position coordinates so that you can accurately\
    \ select isometric sprites on the screen. And, you’ve learned how to create and\
    \ plot isometric maps using Tiled Editor, and accurately depth sort those sprites\
    \ using `z` values so that they display in their correct depth layers. These are\
    \ all the basic skills you need to start making a wide variety of isometric games,\
    \ from strategy games to dungeon crawlers.\n\nNow that you know how to make all\
    \ sorts of interactive tile-based game environments, how can you create game characters\
    \ that are able to intelligently navigate through those environments? That’s what\
    \ the next chapter is all about: pathfinding.\n\n© Rex van der Spuy 2017\n\nRex\
    \ van der Spuy, The Advanced Game Developer's Toolkit, 10.1007/978-1-4842-1097-0_5\n\
    \n# 5. Pathfinding Basics\n\nRex van der Spuy^(1)\n\n(1)Toronto, Ontario, Canada\n\
    \nYou now know how to make a tile-based game world, and you also know how to make\
    \ a player character that can navigate through that world. But how do you create\
    \ sprites that can wander around and explore the world on their own? Take a moment\
    \ to play the example prototype called `tileBasedLineOfSight.html` that you’ll\
    \ find in this chapter’s source files (shown in Figure [5-1](#A346816_1_En_5_Chapter.xhtml#Fig1)).\
    \ The maze is populated by three monsters who wander around randomly until they\
    \ spot the alien character – then they chase him relentlessly.\n\n![A346816_1_En_5_Fig1_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig1_HTML.jpg)"
