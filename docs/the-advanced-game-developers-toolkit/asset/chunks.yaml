- fmt: "###### Figure 6-12. Add the parent node’s G cost (10) to the cost of traveling\
    \ up one node (10) to find the new G cost (20)\n\nIf it finds that the new cost\
    \ is lower, A* changes the node’s parent to the current parent:\n\n```\nif (newG\
    \ < oldG) {\n  surroundingNode.parent = currentParent;\n} else {\n  don't change\
    \ the surrounding node's parent\n}\n```\n\nBut if the new G cost is more expensive,\
    \ the node’s parent doesn’t change. That’s the case in this example. It will keep\
    \ the same parent that it was assigned in the first step, which was the start\
    \ node. The current parent node that we’re checking is left out in the cold.\n\
    \nThis is very important because A* creates the path by linking nodes together\
    \ through their parents, like a chain.\n\nA* runs this same check with all the\
    \ other surrounding nodes, and calculates their new G costs based on what they\
    \ will be if they need to run through the new parent, as shown in Figure [6-13](#A346816_1_En_6_Chapter.xhtml#Fig13).\n\
    \n![A346816_1_En_6_Fig13_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig13_HTML.jpg)\n\
    \n###### Figure 6-13. Find out if any of the G costs of the other nodes are less\
    \ by routing the path through this current parent. They’re not\n\nAs you can see\
    \ from Figure [6-13](#A346816_1_En_6_Chapter.xhtml#Fig13), the G costs of all\
    \ the nodes will be higher by going through the current parent. That means that\
    \ none of them will change their parent to the current parent. The current parent\
    \ is toast! It has no children, so it’s definitely not going to be part of the\
    \ shortest path.\n\nBut A* still needs to figure out which node to test next.\
    \ It ignores wall nodes and the previous parent node. It chooses the next node\
    \ with the lowest F cost as the new parent node, as shown in Figure [6-14](#A346816_1_En_6_Chapter.xhtml#Fig14).\n\
    \n![A346816_1_En_6_Fig14_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig14_HTML.jpg)\n\
    \n###### Figure 6-14. The surrounding node with the lowest F cost becomes the\
    \ new parent node\n\nBut what happens if some of the nodes have the same cost?\
    \ You can see from Figure [6-13](#A346816_1_En_6_Chapter.xhtml#Fig13) that the\
    \ nodes directly above and below the parent are tied for first place, each with\
    \ the same low score of 54. In this case, A* chooses whichever node comes up first\
    \ in the loop that runs this check. If it happens to be the wrong one, this will\
    \ be corrected later by further checks. But by pure chance, this time the first\
    \ node with the lowest score also happens to be the better choice. It’s chosen\
    \ as the new parent node, and A* continues checking.\n\nIt’s also quite likely\
    \ that there will be more than one possible shortest path. The one A* builds is\
    \ determined by how it selects nodes whose costs are tied.\n\nWe’ve currently\
    \ tested two nodes, and have selected a third, as you can see from Figure [6-15](#A346816_1_En_6_Chapter.xhtml#Fig15).\n\
    \n![A346816_1_En_6_Fig15_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig15_HTML.jpg)\n\
    \n###### Figure 6-15. Three nodes are candidates for steps on the path, but which\
    \ will make the final shakedown?\n\nBut only two of those nodes are part of the\
    \ path. How do we know? Because the node on the upper right has assigned the start\
    \ node as its parent. This is a relationship that chains the two nodes together,\
    \ as shown in Figure [6-16](#A346816_1_En_6_Chapter.xhtml#Fig16). It forms the\
    \ first two steps in the path.\n\n![A346816_1_En_6_Fig16_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig16_HTML.jpg)\n\
    \n###### Figure 6-16. The start node is the parent of the upper-right node. This\
    \ relationship chains the nodes together\n\n### Linking the Nodes Through Their\
    \ Parents\n\nA* then continues following this same logic until it reaches the\
    \ destination node, point B. In a very big game world, this could involve checking\
    \ hundreds of nodes.\n\nWhen A* finally builds the path, it traces the route from\
    \ parent node to parent node to link the start and end points together. You can\
    \ see this illustrated in Figure [6-17](#A346816_1_En_6_Chapter.xhtml#Fig17).\n\
    \n![A346816_1_En_6_Fig17_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig17_HTML.jpg)\n\
    \n###### Figure 6-17. Each node in the final path has a reference to its parent\n\
    \nWhen A* reaches the destination, point B, it stops checking. A* then just needs\
    \ to work backward from point B, following the parent nodes, to construct the\
    \ path. The A* algorithm produces an array that will tell you each node you need\
    \ to walk through to find the shortest route from point A to point B.\n\nNow that\
    \ you understand the theory, let’s have a look at the actual JavaScript code.\n\
    \n## A* in Code\n\nIt should be pretty obvious by now that nodes are quite important\
    \ things in the A* universe. Each node needs to store quite a bit of information:\n\
    \n- Its position (its row and column on the grid).\n- Its G, H, and F costs.\n\
    - Its parent node.\n\nIt therefore makes sense to create a node object to store\
    \ this information.\n\n### Creating a Node Map\n\nThe first step to working with\
    \ nodes is to create something called a **node map**. The node map is a two-dimensional\
    \ array that exactly matches the game’s maze map. However, each cell of the node\
    \ map contains a node object. These node objects will store all the important\
    \ node properties and values we need.\n\nHere’s a simple function called `nodes`\
    \ that returns an array of node objects for every cell in our map array.\n\n```\n\
    let nodes = (mapArray, mapWidthInTiles) => {\n  return mapArray.map((cell, index)\
    \ => {\n\n    //Figure out the row and column of this cell              \n   \
    \ let column = index % mapWidthInTiles;\n    let row = Math.floor(index / mapWidthInTiles);\n\
    \n    //The node object              \n    return node = {\n      f: 0,\n    \
    \  g: 0,\n      h: 0,\n      parent: null,\n      column: column,\n      row:\
    \ row,\n      index: index\n    };\n  });\n};\n```\n\nEach node object includes\
    \ cost properties, a reference to its parent node, and row, column, and index\
    \ information that will make it easy for us to match the node up to its position\
    \ in the map array. You’ll see how this is used in the context of the `shortestPath`\
    \ function that we’re going to look at next."
