  trans: "\n# 滚动世界摄像机\n\n我们的游戏地图远比显示它的游戏屏幕要大得多。但你会注意到，它会非常自然地滚动，以跟随精灵移动。在本节中，你将学习如何实现这种滚动游戏摄像机，从而运用这些概念为你的游戏构建类似的摄像机。\n\
    \n但在我们了解其制作方法之前，首先快速浏览一下你需要编写的高级游戏代码，以便创建和使用摄像机。首先，像这样在游戏世界中初始化摄像机：\n\n```\ncamera\
    \ = g.worldCamera(world, world.worldWidth, world.worldHeight, anyCanvasElement);\n\
    ```\n\n第一个参数是一个包含`x`、`y`属性的精灵。第二和第三个参数以像素为单位定义游戏世界的宽度和高度。最后一个参数是渲染游戏世界的画布 HTML\
    \ 元素。\n\n摄像机对象有两个有用的方法可以用来控制它：`centerOver`和`follow`。你可以使用`centerOver`方法让摄像机自身居中于某个精灵之上，像这样：\n\
    \n```\ncamera.centerOver(sprite);\n```\n\n使用以下方法让摄像机在游戏循环中跟随任何精灵，像这样：\n\n```\n\
    function gameLoop() {\n  camera.follow(sprite);\n}\n```\n\n摄像机有一个不可见的内部边界，其大小为画布尺寸的一半。你可以在图\
    \ 2-18 的第一张图片中看到这个不可见的内部边界。精灵可以在这个边界内自由移动，只有当精灵越过边界时，摄像机才会开始移动。当摄像机到达地图边缘时会停止移动，但精灵可以一直走到地图边缘。图\
    \ 2-18 展示了所有这些特性，从而产生了自然的滚动效果。\n\n![A346816_1_En_2_Fig18_HTML.gif](img/A346816_1_En_2_Fig18_HTML.gif)\n\
    \n###### 图 2-18. 一个让精灵在游戏世界中自由移动的滚动游戏摄像机\n\n- 你可以将摄像机视为一种悬浮在世界上方的不可见精灵。它拥有`x`和`y`位置，以及高度和宽度。摄像机有一个名为`follow`的方法，可以改变摄像机的`x`和`y`坐标，以跟上它所跟随的任何精灵；还有一个名为`centerOver`的方法，可以将摄像机居中于任何精灵之上。它还会根据地图尺寸检查自身位置，以便在到达地图边缘时停止移动。\n\
    \n- 以下是实现所有这些功能的完整`worldCamera`函数。\n\n```\n    worldCamera(world, worldWidth,\
    \ worldHeight, canvas) {\n\n//定义一个具有实用属性的 `camera` 对象                  \n      let\
    \ camera = {\n        width: canvas.width,\n        height: canvas.height,\n \
    \       _x: 0,\n        _y: 0,\n\n//`x` 和 `y` 的 getter/setter                \
    \  \n        //当你改变摄像机的位置时，                  \n        //它们会向相反方向移动世界的位置     \
    \             \n        get x() {\n          return this._x;\n        },\n   \
    \     set x(value) {\n          this._x = value;\n          world.x = -this._x;\n\
    \        },\n        get y() {\n          return this._y;\n        },\n        set\
    \ y(value) {\n          this._y = value;\n          world.y = -this._y;\n        },\n\
    \n//摄像机的中心 x 和 y 位置                  \n        get centerX() {\n          return\
    \ this.x + (this.width / 2);\n        },\n        get centerY() {\n          return\
    \ this.y + (this.height / 2);\n        },\n\n//边界属性定义了一个矩形区域，其大小为游戏屏幕的一半     \
    \             \n        //如果摄像机跟随的精灵位于此区域内，摄像机将不会滚动。如果精灵                  \n \
    \       //越过此边界，后面的 `follow` 函数将改变                  \n        //摄像机的 x 和 y 位置，以滚动游戏世界\
    \                  \n        get rightInnerBoundary() {\n          return this.x\
    \ + (this.width / 2) + (this.width / 4);\n        },\n        get leftInnerBoundary()\
    \ {\n          return this.x + (this.width / 2) - (this.width / 4);\n        },\n\
    \        get topInnerBoundary() {\n          return this.y + (this.height / 2)\
    \ - (this.height / 4);\n        },\n        get bottomInnerBoundary() {\n          return\
    \ this.y + (this.height / 2) + (this.height / 4);\n        },\n\n//接下来的代码定义了两个摄像机\
    \                  \n        //方法：`follow` 和 `centerOver`\n\n//使用 `follow` 方法让摄像机跟随一个精灵\
    \                  \n        follow: function(sprite) {\n\n//检查精灵相对于内部边界的位置。如果精灵\
    \                  \n          //移出边界，则移动摄像机以跟随精灵                  \n          if(sprite.x\
    \ < this.leftInnerBoundary) {\n            this.x = sprite.x - (this.width / 4);\n\
    \          }\n          if(sprite.y < this.topInnerBoundary) {\n            this.y\
    \ = sprite.y - (this.height / 4);\n          }\n          if(sprite.x + sprite.width\
    \ > this.rightInnerBoundary) {\n            this.x = sprite.x + sprite.width -\
    \ (this.width / 4 * 3);\n          }\n          if(sprite.y + sprite.height >\
    \ this.bottomInnerBoundary) {\n            this.y = sprite.y + sprite.height -\
    \ (this.height / 4 * 3);\n          }\n\n//如果摄像机到达地图边缘，则停止其移动                \
    \  \n          if(this.x < 0) {\n            this.x = 0;\n          }\n          if(this.y\
    \ < 0) {\n            this.y = 0;\n          }\n          if(this.x + this.width\
    \ > worldWidth) {\n            this.x = worldWidth - this.width;\n          }\n\
    \          if(this.y + this.height > worldHeight) {\n            this.y = worldHeight\
    \ - this.height;\n          }\n        },\n\n//使用 `centerOver` 方法将摄像机居中于一个精灵之上\
    \                  \n        centerOver: function(sprite) {\n\n//将摄像机居中于一个精灵之上\
    \                  \n          this.x = (sprite.x + sprite.halfWidth) - (this.width\
    \ / 2);\n          this.y = (sprite.y + sprite.halfHeight) - (this.height / 2);\n\
    \        }\n      };\n\n//返回 `camera` 对象                  \n      return camera;\n\
    \    };\n```\n\n- （你可以在 `hexi/src/modules/gameUtilities/src/gameUtilities.js`\
    \ 中找到 `worldCamera` 函数）。\n\n- 可以看到，摄像机实际上只是一个数据模型，用于确定世界的哪一部分应该在画布上可见。摄像机将自身的大小和位置与它所跟随的精灵以及世界的边缘进行比较。\n\
    \n- 诀窍在于摄像机实际上从未移动。当你改变它的 `x` 和 `y` 位置时，它实际上是以相反的量移动世界的位置。\n\n```\n    set x(value)\
    \ {\n      this._x = value;\n      world.x = -this._x;\n    },\n    set y(value)\
    \ {\n      this._y = value;\n      world.y = -this._y;\n    },\n```\n\n- 这使得摄像机看起来像是在世界中移动，而实际上它是在向相反方向移动世界。\n\
    \n## 总结\n\n平铺地图编辑器是游戏设计者可以学习的最有用的软件工具之一。你已经学会了如何设置游戏地图；导入图块集；以及使用平铺地图编辑器的图层、对象和工具来设计你的游戏世界。你还学会了如何读取平铺地图编辑器的\
    \ JSON 地图数据，并使用这些数据构建可重用的代码，以制作各种不同的游戏。此外，你还发现了正确设置游戏对象深度层级，以及添加一个能够跟随游戏角色在世界中移动的摄像机是多么容易。\n\
    \n但是，我们还没结束！你会注意到，在本章的演示游戏中，当精灵角色在世界中行走时，它的路径会被树木、灌木丛和墙壁阻挡。并且，精灵可以拾取世界中的物体。这又是如何实现的呢？你将在下一章中了解，届时我们将详细探讨基于瓦片的游戏的碰撞检测。\n\
    \n© Rex van der Spuy 2017\n\nRex van der Spuy, 《高级游戏开发者工具包》, 10.1007/978-1-4842-1097-0_3\n"
- fmt: "# 3. Tile-Based Collision\n\nRex van der Spuy^(1)\n\n(1)Toronto, Ontario,\
    \ Canada\n\nThere are two main ways that you can check for collisions in games.\
    \ The first is to compare the x and y pixel positions of sprites on the screen.\
    \ If their shapes are overlapping, you have a collision. This is a collision detection\
    \ strategy called **narrow-phase collision**. If you’ve used a game engine with\
    \ collision functions that might have names like `hitTestRectangle` or `hitTestCircle`\
    \ to check whether shapes are overlapping, it’s likely that these are narrow-phase\
    \ collision functions. They use vector math (linear algebra) to figure out if\
    \ the shapes of the sprites are overlapping. Because of that you can achieve very\
    \ precise pixel-level collision accuracy, which is very important for physics-based\
    \ action games.\n\nThe other way to check for collisions is to use the tile-based\
    \ approach. A **tile-based collision** system doesn’t use geometry to check for\
    \ a collision. All it does is read a sprite’s index number in an array. If a sprite\
    \ is at an array map location that is already occupied by another sprite, you\
    \ have a collision. For example, if a sprite is at the same location on the map\
    \ as a wall, then you know the sprite is touching the wall. You can then set up\
    \ some kind of collision reaction, like preventing the sprite from moving.\n\n\
    ###### Note\nTile-based collision is a type of **broad-phase collision**, which\
    \ you’ll learn more about in Chapter 6.\n\nA big advantage to tile-based collision\
    \ is that you don’t have to check every object against every other object whether\
    \ they’re colliding, and you don’t have to do any geometry calculations. Instead,\
    \ you just read an array. This makes it much more CPU efficient than a narrow-phase\
    \ collision test. What’s more is that you can set just a few general collision\
    \ checks for different types of things, like “walls,” “enemies,” or “items.” Even\
    \ if you have hundreds of these things on a map, you just need to run one collision\
    \ check for each type. This makes tile-based collision great for huge game maps\
    \ that could contain hundreds of similar things. And because tile-based collisions\
    \ work by reading map arrays, you can use the information about the sprite’s location\
    \ on the map, and its local environment, for AI or other game logic.\n\nThe disadvantage\
    \ to tile-based collision is that it doesn’t give you pixel-level accuracy. But\
    \ it turns out that for many or most kinds of 2D action games, precise pixel-level\
    \ collision just isn’t necessary. Tile-based collisions have a particular “feel”\
    \ to them: solid, and predictable, like you’re playing a proper video game. The\
    \ entire 8-bit and 16-bit video game revolution of the ‘70s and ‘80s was founded\
    \ on tile-based collision, and it’s still the most important video game collision\
    \ technique you need to know.\n\n###### Note\nDo you want pixel-level accuracy,\
    \ but also tile-based efficiency? You can have the best of both worlds by first\
    \ checking for a collision using the tile-based approach. Then, if you detect\
    \ a general collision, use a second narrow-phase test for further pixel-level\
    \ precision. You’ll find out how to do that in Chapter 6.\n\nIn this chapter you’re\
    \ going to learn about the fundamentals of tile-based collision using some classic\
    \ maze game examples. You’ll get a chance to see how you can use Tiled Editor\
    \ to build a flat 2D video game environment, and how to use map arrays to analyze\
    \ that environment. We’ll also build a general-purpose collision function for\
    \ tile-based games. And finally, we’ll apply all these new skills to our fantasy\
    \ RPG game prototype from Chapter 2.\n\n## Understanding Tile-Based Collision\n\
    \nHere are the basics you need to know to do a tile-based collision. Before you\
    \ start, your sprites need a new property called `index`:\n\n```\nplayerSprite.index\
    \ \n```\n\nThe `index` is just a number that tells you the location of the sprite\
    \ in the map array.\n\nTo find this number you have to convert the sprite’s center\
    \ x and y screen position into its matching array index number. Here’s a general\
    \ purpose `getIndex` function you can use to do this:\n\n```\ngetIndex(x, y, tilewidth,\
    \ tileheight, mapWidthInTiles) {\n\n  //Convert pixel coordinates to map index\
    \ coordinates            \n  let index = {};\n  index.x = Math.floor(x / tilewidth);\n\
    \  index.y = Math.floor(y / tileheight);\n\n  //Return the index number      \
    \      \n  return index.x + (index.y * mapWidthInTiles);\n};\n```\n\nThe next\
    \ step is to find out what other things in the game world might be at that same\
    \ location. For example, imagine that you have a map array that contains the location\
    \ of enemies. You could call it `enemyMapArray`.\n\n```\nenemyMapArray = [0, 0,\
    \ 0, 5, 0, 0, 5, 0, /*...*/];\n```\n\nAny location with an enemy is signified\
    \ with the number “5.” Any location without an enemy has it signified with “0.”\
    \ These numbers are called **grid index** id numbers, or **gid** for short.\n\n\
    You can find out which gid is at the `playerSprite`‘s location like this:\n\n\
    ```\ngid = enemyMapArray[playerSprite.index];\n```\n\nIf that gid number is “5”\
    \ then you know that the `playerSprite` is at the same location as an enemy. A\
    \ collision has occurred!\n\n```\nif (gid === 5) {\n\n    //Collision!       \
    \     \n}\n```\n\nYou now know that the `playerSprite` has hit an enemy. But which\
    \ one has it hit?\n\nTo figure this out, your game needs an array that stores\
    \ references to all the enemy sprites:\n\n```\nenemySprites = [enemySprite1, enemySprite2,\
    \ enemySprite3, /*...*/ ];\n```\n\nEach of these sprites also needs an `index`\
    \ property that tells you their location in the `enemyMapArray`:\n\n```\nenemySprite1.index\
    \ = 52;\nenemySprite2.index = 3;\nenemySprite3.index = 108;\n//...\n```\n\nTo\
    \ find the enemy sprite at the player’s location, loop through the array of `enemySprites`\
    \ and find the one that has the same `index` number as the `playerSprite`. That\
    \ will be the one that the `playerSprite` is colliding with.\n\n```\nif (gid ===\
    \ 5) {\n  enemySprites.some(enemy => {\n    if (playerSprite.index === enemy.index)\
    \ {\n\n      //You've found the colliding enemy sprite!            \n    }\n \
    \ });\n}\n```\n\nThese are the basics of tile-based collision, and next we’ll\
    \ find out how to implement them in a game.\n\n## Collecting Items\n\nLet’s look\
    \ at a really practical example to demonstrate this. Run the `simpleCollision.html`\
    \ file, shown in Figure 3-1, and use the keyboard arrow keys to help the alien\
    \ character collect bombs. Each time the alien collects a bomb, the bomb disappears\
    \ from the map. The message output tells you the alien’s screen x and y position,\
    \ and also its current map index number.\n\n![A346816_1_En_3_Fig1_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig1_HTML.jpg)\n\
    \n###### Figure 3-1. Item collection using tile-based collision\n\n### Designing\
    \ the Game World\n\nIn Chapter 2 you learned how to use Tiled Editor to help you\
    \ quickly design a game world. I made all example game prototypes in this chapter\
    \ using the very same techniques. I used three layers: `backgroundLayer`, `bombLayer`,\
    \ and `alienLayer`, shown in Figure 3-2.\n\n![A346816_1_En_3_Fig2_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig2_HTML.jpg)\n\
    \n###### Figure 3-2. The three map layers\n\nThe alien and bomb images in the\
    \ tileset are both given name property values: “alien” and “bomb,” as shown in\
    \ Figure 3-3. This will let us easily reference them in the game code later using\
    \ `world.getObject` (for single objects) and `world.getObjects` (for an array\
    \ of objects), as you learned to do in the previous chapter.\n\n![A346816_1_En_3_Fig3_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig3_HTML.jpg)\n\
    \n###### Figure 3-3. Give names to the alien and bomb images"
