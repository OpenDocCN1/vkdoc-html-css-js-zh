  trans: "\n###### 图 2-10. 添加障碍物\n\n接下来，添加道具层。这些是精灵能够拾取的东西。我们在道具层只需要三样东西：心形、骷髅头和土拨鼠。使用印章工具将这些添加到图层中，如图\
    \ 2-11 所示。\n\n![A346816_1_En_2_Fig11_HTML.jpg](img/A346816_1_En_2_Fig11_HTML.jpg)\n\
    \n###### 图 2-11. 添加可收集物品\n\n接下来是对象层。我们将在这里添加精灵角色——*以数据对象的形式*。精灵没有在瓦片集中用图片表示，因为稍后我们将通过代码将其构建为一个复杂的动画精灵。你可以用一个简单的精灵占位图，并以我添加其他图片相同的方式将其添加到地图中，但我想借此机会向你展示\
    \ Tiled Editor 的对象是如何工作的。\n\n从图 2-12 中可以看到，精灵所在的图层类型叫做 `objects`。这是一种特殊的图层，允许你自由放置物品，而无需将它们吸附到网格上。它还允许你为对象指定自定义的宽度和高度。这意味着你可以放置任意大小的对象，并精确指定其屏幕坐标中的\
    \ `x` 和 `y` 值。对象图层上的内容在导出的 JSON 文件中将以 JavaScript 对象数组的形式呈现，并且你可以为每个对象赋予一组独一无二的属性。\n\
    \n![A346816_1_En_2_Fig12_HTML.jpg](img/A346816_1_En_2_Fig12_HTML.jpg)\n\n######\
    \ 图 2-12. 添加一个对象并为其设置属性\n\n要向对象图层添加内容，请使用某个形状工具，然后在希望对象出现的位置绘制形状。上下文相关的“属性”面板将显示你正在创建的新对象的属性。Tiled\
    \ Editor 的对象有一些默认属性，例如位置和大小，这些属性与我们在本书中使用的精灵对象的属性非常接近。在这个例子中，我将对象名称设置为 `\"elf\"\
    `，并将其宽度和高度设置为 64 像素。你可以根据需求更改或添加任意数量的其他属性，所有这些属性都将在最终的游戏代码中访问得到。任何你以这种方式创建的对象，都可以从\
    \ Tiled Editor 便捷的“对象”面板中访问。\n\n还有两个图层需要添加：`wallTops` 和 `treeTops`，如图 2-13 所示。\n\
    \n![A346816_1_En_2_Fig13_HTML.jpg](img/A346816_1_En_2_Fig13_HTML.jpg)\n\n######\
    \ 图 2-13. 添加墙壁顶部和树冠\n\n现在，大功告成！\n\n## 理解 JSON 地图数据\n\n当你完成地图构建后，请按照以下步骤将地图保存并导出为\
    \ JSON 数据：\n\n1.  从主菜单中选择 `文件` ➤ `另存为...`，将文件保存为 Tiled Editor 自有的 TMX 格式。\n2.\
    \  选择 `地图` ➤ `地图属性...`。在属性面板中找到 `瓦片图层格式` 属性，并选择 `CSV`。CSV（逗号分隔值）选项会将地图图层导出为数字数组，这正是我们需要的。\n\
    3.  通过选择 `文件` ➤ `导出为...` 将地图数据导出为 JSON，并选择 `JSON` 作为文件类型。\n4.  现在我们有了一个包含潜在有用地图数据的\
    \ JSON 文件，但我们该如何使用它呢？\n\n重要的是要记住，地图中的每个图层都以数组形式表示。这意味着 JSON 文件将至少包含六个数组。其中五个数组包含的是瓦片集帧\
    \ ID 代码。还有一个数组代表对象图层，它是一个对象数组。JSON 文件还会提供关于地图、瓦片的高度和宽度，以及所有瓦片属性的信息。所有这些额外信息都包含在拥有自己子数组的子对象中。数据量很大，如果你是第一次打开\
    \ JSON 数据文件，可能会被眼前的内容搞得不知所措。别让它吓到你！你很快就会发现，它的结构非常合乎逻辑，一旦理解了它，在游戏程序中使用所有这些数据就会变得很容易。\n\
    \n###### 注意\n\nTiled Editor 的数据输出已成为游戏设计行业的事实标准，因此学习其结构以及如何将其整合到你自己的游戏中，是一项值得长期投入的技能。\n\
    \n我们尽量保持简单，先从安全距离审视一下 JSON 文件的总体结构。下面是一个简略版本，展示了最重要的属性。\n\n```\n{\n //地图的属性  \
    \          \n \"backgroundcolor\": \"#ffffff\",\n \"height\": 24,\n \"nextobjectid\"\
    : 2, //仅供 Tiled Editor 内部使用\n \"orientation\": \"orthogonal\",\n \"properties\"\
    : {/* 你可能设置的任何自定义属性 */},\n \"renderorder\": \"right-down\",\n \"tileheight\":\
    \ 32,\n \"tilewidth\": 32,\n \"version\": 1,\n \"width\": 24,\n\n //`layers` 属性是一个对象数组。每个对象都包含\
    \            \n //另一个数组，该数组代表该图层的地图数据。图层            \n //对象还包含图层属性，包括其名称、类型和大小\
    \            \n \"layers\":[\n   {\"data\": [1, 2, 1, 2, 1, 2, ...], //图层属性...},\n\
       {\"data\": [0, 0, 0, 0, 0, 0, ...], //图层属性...},\n   {\"data\": [0, 0, 0, 0,\
    \ 0, 0, ...], //图层属性...},\n   {\"objects\": [{\"name\":\"elf\", //...更多对象属性...}],\
    \ //图层属性...},\n   {\"data\": [0, 0, 0, 0, 0, 0, ...] ], //图层属性...},\n   {\"data\"\
    : [19, 20, 21, 22, 0, ...], //图层属性...},\n ],\n\n //`tilesets` 属性是一个对象数组。每个对象 \
    \           \n //代表地图中使用的一个瓦片集。（本例中我们只用了            \n //一个。）这些对象包含默认的瓦片集    \
    \        \n //属性，以及自定义属性，比如精灵图像名称            \n \"tilesets\":[\n    { //...瓦片集属性，例如每个瓦片的宽度和高度。\n\
          //我们设置的自定义瓦片名称属性：\n      \"tileproperties\": {\n        \"11\": {\"name\"\
    : \"heart\"},\n        \"4\": {\"name\": \"skull\"},\n        \"5\": {\"name\"\
    : \"marmot\"}\n      },\n    }\n  ]\n}\n```\n\n大部分地图数据，即那些实际告诉你地图每个单元格中内容的数据，都位于每个图层对象的\
    \ `\"data\"` 属性中。让我们看看第一个图层对象内部是什么：\n\n```\n{\n  \"data\":[\n      1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,\n\
          7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,\n      1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,1,2,\n\
          7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,7,8,\n      ...等等。\n    ],\n\
       \"height\": 24,\n   \"name\": \"ground\",\n   \"opacity\": 1,\n   \"type\"\
    : \"tilelayer\",\n   \"visible\": true,\n   \"width\": 24,\n   \"x\": 0,\n   \"\
    y\": 0\n},\n```\n\n你可以看到，它包含一些有用的属性，比如图层的名称和类型。`data` 数组是一个包含 576 个数字的列表，这些数字代表该图层上的所有瓦片（24x24\
    \ 瓦片 = 576）。这些数字被称为**网格 ID** 或 **gid**，每个数字都指向瓦片集中的一张图片。Tiled Editor 从左到右对瓦片集中的每张图片进行编号，从\
    \ 1 开始。图 2-14 显示了前 12 个瓦片集图像的网格 ID。你可以看到，1、2、7 和 8 与草地瓦片相匹配。`data` 数组使用这些数字来表示每个图层的视觉布局。\n\
    \n![A346816_1_En_2_Fig14_HTML.jpg](img/A346816_1_En_2_Fig14_HTML.jpg)\n"
- fmt: "###### Figure 2-14. Grid id numbers are used to represent sprite images in\
    \ an array\n\nIn our map we created five tile layers and one objects layer. The\
    \ objects layer has an array called `objects` that contains just one object in\
    \ this example: the elf. You can see that all the properties we assigned to the\
    \ elf, like its name and size, are accessible as an object in this array.\n\n\
    ```\n{\n  \"draworder\": \"topdown\",\n  \"height\": 24,\n  \"name\": \"objects\"\
    ,\n  \"opacity\": 1,\n  \"type\": \"objectgroup\",\n  \"visible\": true,\n  \"\
    width\": 24,\n  \"x\": 0,\n  \"y\": 0,\n  \"objects\":[\n    {\n      \"height\"\
    : 64,\n      \"name\": \"elf\",\n      \"properties\": {/* Any custom properties\
    \ */},\n      \"rotation\": 0,\n      \"type\": \"\",\n      \"visible\": true,\n\
    \      \"width\": 64,\n      \"x\": 287,\n      \"y\": 350\n    }]\n}\n```\n\n\
    Finally, there’s an array called `tilesets` that represents all the tilesets we\
    \ used to build this level. Each tileset is represented as an object, and we only\
    \ used 1 in this example:\n\n```\n\"tilesets\":[\n  {\n    \"columns\": 6,\n \
    \   \"firstgid\": 1,\n    \"image\": \"../images/fantasy.png\",\n    \"imageheight\"\
    : 192,\n    \"imagewidth\": 192,\n    \"margin\": 0,\n    \"name\": \"fantasy\"\
    ,\n    \"properties\": {/* Any custom properties */},\n    \"spacing\": 0,\n \
    \   \"tilewidth\": 32,\n    \"tileheight\": 32,\n    \"tileproperties\": {\n \
    \     \"11\": {\"name\": \"heart\"},\n      \"4\": {\"name\": \"skull\"},\n  \
    \    \"5\": {\"name\": \"marmot\"}\n    }\n  }\n]\n```\n\nYou can see that the\
    \ custom name property we assigned to the heart, skull, and marmot are in the\
    \ `tileproperties` sub-object. Notice that their id numbers are 1 less than the\
    \ grid id numbers in the tileset.\n\n###### Note\n\nThere is some logic to why\
    \ these numbers are off by one, but you’ll only appreciate this if you’re using\
    \ more than one tileset to make a map. If you are, read on! The Id numbers used\
    \ in the `tileproperties` are what Tiled Editor calls the “local” id numbers of\
    \ the tiles in the tileset. These local ids start numbering from 0. The ids used\
    \ in the data arrays are “global” tile ids. These global ids can span several\
    \ tilesets. That means the first tileset might start its grid id numbering at\
    \ 1, the second tileset might start at 32, and the third might start at 96 (0\
    \ is reserved for “no tile”). You can use the `firstgid` property of each local\
    \ tileset to figure out from which tileset the global id should be. You can then\
    \ map it to a local id in that tileset by subtracting the `firstgid`. But if you’re\
    \ just using a single tileset, just subtract 1, since that’s the `firstgid` of\
    \ the first tileset. Confused? Don’t worry! This will only start to make sense\
    \ when you create your first map using more than one tileset.\n\nIs all this data\
    \ starting to make sense to you now? If you’re like me, your little programmer’s\
    \ heart will be bursting with glee! That’s because you know this is all really\
    \ juicy stuff. You can use all this data to make all your sprites and lay out\
    \ your game map automatically. Now how can we sink our teeth into it?\n\n## Using\
    \ JSON Data to Build the Level\n\nThe JSON data doesn’t know or care what kind\
    \ of game we want make with it, or what technology you’re using. You can use the\
    \ same data to make games with Objective-C, Haxe, Unity, or Elm. That means you\
    \ need to write a function that interprets this data and decides how it should\
    \ be used to construct a game level. It’s entirely up to you what to do with it.\n\
    \n### Deciding How to Use the Data\n\nWhere do you start? Come up with a list\
    \ of rules about how to interpret all this data, depending on the kind of game\
    \ you want to make. For the fantasy role playing game that I want to make, I came\
    \ up with these requirements:\n\n*   The entire game world is going to be contained\
    \ inside a single **container group** called `world`. A “container group” is just\
    \ my term for an object that contains nested child **sprites**. (Sprites, as you’ll\
    \ recall, are just interactive images that the game world is made from).\n\n*\
    \   Each Tileset Layer should also be its own separate group, inside the `world`\
    \ container. There are five Tileset layers, and that means I’ll end up with five\
    \ groups: `ground`, `obstacles`, `items`, `wallTops`, and `treeTops`. All these\
    \ layers have a name property, so I’ll assign that name property to the layer\
    \ group so that I can access it later.\n\n*   Anything on an Object layer should\
    \ be returned to the game as a simple JavaScript object. I can then decide later\
    \ how to use the data in that object. I’m going to use the Object’s name property\
    \ to access it if I need it. There’s only one object in our current example: the\
    \ elf.\n\n*   All the images inside the layers will be created as sprites.\n\n\
    *   I need some way to reference all the objects that I’m creating in the world.\
    \ I’m going to add two search functions that will let me retrieve objects by searching\
    \ for them by name. `world.getObject(\"name\")` will retrieve a single object\
    \ that matches the name property of the object I’m looking for. It could be a\
    \ sprite, layer group, or data object. `world.getObjects(\"elf\", \"obstacles\"\
    , \"marmot\")` returns an array of objects with names that match those in the\
    \ arguments.\n\n*   To keep things as simple as possible, I’m going to limit myself\
    \ to one tileset per map.\n\nThis is the list of requirements that I came up,\
    \ but yours might be different depending on what kind of game you’re making and\
    \ how much flexibility you need.\n\n### The Game Code API\n\nBefore we look at\
    \ how to implement these rules, let’s see what our API will look like when we’re\
    \ done. I’ll be able to create a new game world like this:\n\n```\nlet world =\
    \ makeTiledWorld(data.json, tileset.png);\n```\n\nThe world will then magically\
    \ appear, exactly as I designed it in Tiled Editor. If I want to retrieve a layer\
    \ group, sprite, or object from the world, I can do it like this:\n\n```\nlet\
    \ elf = world.getObject(\"elf\");\n```\n\nI can retrieve a collection of objects\
    \ as an array like this:\n\n```\nlet items = world.getObjects(\"heart\", \"skull\"\
    , \"marmot\");\n```\n\nIf I have many sprites that share the same tileset name\
    \ property, I can also retrieve all of them in an array. For example, if I have\
    \ a tileset image with the name “wall,” and I use that image 20 times in the world,\
    \ I can retrieve all the wall sprites in a single array like this:\n\n```\nlet\
    \ walls = world.getObjects(\"wall\");\n```\n\nThis is a simple API that will be\
    \ enough to give me as much flexibility as I’ll need for most types of games.\n\
    \nSo how can I make all this happen?\n\n## Writing the `makeTiledWorld` Function\n\
    \nI can do all this by writing a single function called `makeTiledWorld`. All\
    \ the details about how the code works are in the comments, but I’ll highlight\
    \ a few important features after the code listing."
  raw: '###### Figure 2-14. Grid id numbers are used to represent sprite images in
    an array


    In our map we created five tile layers and one objects layer. The objects layer
    has an array called objects that contains just one object in this example: the
    elf. You can see that all the properties we assigned to the elf, like its name
    and size, are accessible as an object in this array.


    ```

    {

     "draworder": "topdown",

     "height": 24,

     "name": "objects",

     "opacity": 1,

     "type": "objectgroup",

     "visible": true,

     "width": 24,

     "x": 0,

     "y": 0,

     "objects":[

       {

         "height": 64,

         "name": "elf",

         "properties": {/* Any custom properties */},

         "rotation": 0,

         "type": "",

         "visible": true,

         "width": 64,

         "x": 287,

         "y": 350

      }]

    }

    ```


    Finally, there’s an array called tilesets that represents all the tilesets we
    used to build this level. Each tileset is represented as an object, and we only
    used 1 in this example:


    ```

    "tilesets":[

      {

        "columns": 6,

        "firstgid": 1,

        "image": "../images/fantasy.png",

        "imageheight": 192,

        "imagewidth": 192,

        "margin": 0,

        "name": "fantasy",

        "properties": {/* Any custom properties */},

        "spacing": 0,

        "tilewidth": 32

        "tileheight": 32,

        "tileproperties": {

           "11": {"name": "heart"},

           "4": {"name": "skull"},

           "5": {"name": "marmot"}

        }

      }

    ]

    ```


    You can see that the custom name property we assigned to the heart, skull, and
    marmot are in the tileproperties sub-object. Notice that their id numbers are
    1 less than the grid id numbers in the tileset.


    ###### Note


    There is some logic to why these numbers are off by one, but you’ll only appreciate
    this if you’re using more than tileset to make a map. If you are, read on! The
    Id numbers used in the “tileproperties” are what Tiled Editor calls the “local”
    id numbers of the tiles in the tileset. These local ids start numbering from 0\.
    The ids used in the data arrays are “global” tile ids. These global ids can span
    several tilesets. That means the first tileset might start its grid id numbering
    at 1, the second tileset might start at 32, and the third might start at 96 (0
    is reserved for “no tile”). You can use the “firstgid” property of each local
    tileset to figure out from which tileset the global id should be. You can then
    map it to a local id in that tileset by subtracting the “firstgid.” But if you’re
    just using a single tileset, just subtract 1, since that’s the “firstgid” of the
    first tileset. Confused? Don’t worry! This will only start to make sense when
    you create your first map using more than one tileset.


    Is all this data starting to make sense to you now? If you’re like me, your little
    programmer’s heart will be bursting with glee! That’s because you know this is
    all really juicy stuff. You can use all this data to make all your sprites and
    lay out your game map automatically. Now how can we sink our teeth into it?


    ## Using JSON Data to Build the Level


    The JSON data doesn’t know or care what kind of game we want make with it, or
    what technology you’re using. You can use the same data to make games with Objective-C,
    Haxe, Unity, or Elm. That means you need to write a function that interprets this
    data and decides how it should be used to construct a game level. It’s entirely
    up to you what to do with it.


    ### Deciding How to Use the Data


    Where do you start? Come up with a list of rules about how to interpret all this
    data, depending on the kind of game you want to make. For the fantasy role playing
    game that I want to make, I came up with these requirements:


    *   The entire game world is going to be contained inside a single **container
    group** called world. A “container group” is just my term for an object that contains
    nested child **sprites**. (Sprites, as you’ll recall, are just interactive images
    that the game world is made from).


    *   Each Tileset Layer should also be its own separate group, inside the world
    container. There are five Tileset layers, and that means I’ll end up with five
    groups: ground, obstacles, items, wallTops, and treeTops. All these layers have
    a name property, so I’ll assign that name property to the layer group so that
    I can access it later.


    *   Anything on an Object layer should be returned to the game as a simple JavaScript
    object. I can then decide later how to use the data in that object. I’m going
    to use the Object’s name property to access it if I need it. There’s only one
    object in our current example: the elf.


    *   All the images inside the layers will be created as sprites.


    *   I need some way to reference all the objects that I’m creating in the world.
    I’m going to add two search functions that will let me retrieve objects by searching
    for them by name. world.getObject("name") will retrieve a single object that matches
    the name property of the object I’m looking for. It could be a sprite, layer group,
    or data object. world.getObjects("elf," "obstacles," "marmot") returns an array
    of objects with names that match those in the arguments.


    *   To keep things as simple as possible, I’m going to limit myself to one tileset
    per map.


    This is the list of requirements that I came up, but yours might be different
    depending on what kind of game you’re making to how much flexibility you need.


    ### The Game Code API


    Before we look at how to implement these rules, let’s see what our API will look
    like when we’re done. I’ll be able to create a new game world like this:


    ```

    let world = makeTiledWorld(data.json, tileset.png);

    ```


    The world will then magically appear, exactly as I designed it in Tiled Editor.
    If I want to retrieve a layer group, sprite, or object from the world, I can do
    it like this:


    ```

    let elf = world.getObject("elf");

    ```


    I can retrieve a collection of objects as an array like this:


    ```

    let items = world.getObjects("heart", "skull", "marmot");

    ```


    If I have many sprites that share the same tileset name property, I can also retrieve
    all of them in an array. For example, if I have a tileset image with the name
    “wall,” and I use that image 20 times in the world, I can retrieve all the wall
    sprites in a single array like this:


    ```

    let walls = world.getObjects("wall");

    ```


    This is a simple API that will be enough to give me as much flexibility as I’ll
    need for most types of games.


    So how can I make all this happen?


    ## Writing the makeTiledWorld Function


    I can do all this by writing a single function called makeTiledWorld. All the
    details about how the code works are in the comments, but I’ll highlight a few
    important features after the code listing.'
