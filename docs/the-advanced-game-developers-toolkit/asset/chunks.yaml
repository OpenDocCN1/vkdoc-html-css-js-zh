    \ \"none\";\nrightArrow.release = () => player.direction = \"none\";\ndownArrow.release\
    \ = () => player.direction = \"none\";\n```\n\nThe next step is to add code to\
    \ the game loop that uses the keyboard input to move the player. This is essentially\
    \ the same code we used to move a sprite on a 2D map, with one important change.\
    \ Instead of working directly with the sprite’s x and y screen position values,\
    \ the code works with the sprite’s cartX and cartY properties. The sprite’s position,\
    \ velocity, and screen boundaries are all updated using cartX and cartY. Only\
    \ in the final step are the new, calculated isoX and isoY properties used to set\
    \ the sprite’s screen position.\n\nWhy? Because doing all your logic and positioning\
    \ calculations with cartX and cartY means you can write code that is *identical*\
    \ to the code you would write for an ordinary 2D tile-based map. That means there’s\
    \ nothing new to learn! Here’s the code from the game loop that does all this\
    \ and, as a bonus, tells you tells you which map array index position the sprite\
