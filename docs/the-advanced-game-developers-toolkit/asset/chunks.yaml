    \ picked up. You can see that it’s a perfect match with the location of the bombs\
    \ on the screen.\n\n![A346816_1_En_3_Fig5_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig5_HTML.gif)\n\
    \n###### Figure 3-5. When a bomb is picked up, its gid in the map gid number is\
    \ set to zero\n\nHaving this kind of data updated in an array is useful for doing\
    \ all sorts of other game logic analysis, as you’ll see ahead.\n\n### Moving the\
    \ Alien in Alignment with the Grid\n\nBefore we continue our discussion of tile-based\
    \ collision, let’s quickly take look at how the alien character’s movement system\
    \ works. Like many maze game characters, the alien moves in exact alignment with\
    \ the map’s grid cells. That means that when you press a key to change its direction,\
    \ the alien won’t move in the new direction until it’s entered a new row or column\
    \ in the grid. This ensures that it will cleanly transition into new rows and\
    \ columns. It helps keep your collision detection system simple and dependable.\n\
    \nHow can you figure out if a game character is exactly aligned to a map grid\
    \ cell? By checking to see if the sprite’s x and y screen coordinates are evenly\
    \ divisible by the width and height of the map’s tiles. Here’s the classic snippet\
    \ of code that checks for this.\n\nif(Math.floor(sprite.x) % world.tilewidth ===\
    \ 0\n\n```\n&& Math.floor(sprite.y) % world.tilehieght === 0) {\n\n  //Yes, the\
    \ sprite is aligned to the map’s rows and columns              \n}\n```\n\nYou\
    \ also need to ensure that the sprite has a velocity that’s evenly divisible by\
    \ the tilewidth and tileheight. That ensures the sprite will actually have pixel\
    \ positions that allow for the above check to become true. What this means is\
    \ that if your tile width and height is 64, your sprite’s velocity must be a number\
    \ that divides evenly into 64: 1, 2, 4, 8, 16, or 32\\. If the sprite has velocities\
    \ like 5, 7, or 11, they’ll never divide evenly into 64, and so the sprite will\
    \ never become exactly aligned to the maps’ rows or columns.\n\nHere’s how this\
    \ works in this example. The setup function creates the keyboard key object that\
    \ responds to arrow keypresses. A property called direction is then created on\
    \ the alien, and the keypress actions change the value of that direction.\n\n\
    ```\n//Create the keyboard objects                  \nleftArrow = g.keyboard(37);\n\
    upArrow = g.keyboard(38);\nrightArrow = g.keyboard(39);\ndownArrow = g.keyboard(40);\n\
    \n//Create a `direction` property on the alien                  \nalien.direction\
    \ = \"\";\n\n//Assign key `press` actions that change the alien’s `direction`\n\
    leftArrow.press = () => alien.direction = \"left\";\nupArrow.press = () => alien.direction\
    \ = \"up\";\nrightArrow.press = () => alien.direction = \"right\";\ndownArrow.press\
    \ = () => alien.direction = \"down\";\n```\n\nWhen any of the arrow keys are pressed,\
    \ alien’s direction will be changed to: “up,” “down,” “left,” or “right.” The\
    \ game loop checks this at each frame, and changes the alien’s velocity accordingly:\n\
    \n```\nif(Math.floor(alien.x) % world.tilewidth === 0\n&& Math.floor(alien.y)\
    \ % world.tileheight === 0) {\n  switch (alien.direction) {\n    case \"up\":\n\
          alien.vy = -4;\n      alien.vx = 0;\n      break;\n    case \"down\":\n\
          alien.vy = 4;\n      alien.vx = 0;\n      break;\n    case \"left\":\n      alien.vx\
    \ = -4;\n      alien.vy = 0;\n      break;\n    case \"right\":\n      alien.vx\
    \ = 4;\n      alien.vy = 0;\n      break;\n  }\n}\n```\n\nThe game loop then moves\
    \ the alien and keeps it inside the canvas boundary using a custom function called\
    \ contain.\n\n```\nalien.x += alien.vx;\nalien.y += alien.vy;\ng.contain(alien,\
    \ g.stage);\n```"
  trans: "\n### 初始化游戏世界\n\n游戏代码会加载瓦片集图像以及 Tiled Editor 生成的 JSON 文件。`setup` 函数通过 `makeTiledWorld`\
    \ 来创建世界。\n\n```\nworld = g.makeTiledWorld(\n  \"maps/simpleCollision.json\",\n\
    \  \"images/timeBombPanic.png\"\n);\n```\n\n这会在画布上绘制精灵和图层。在 Tiled Editor 中，我们为任何对象赋予的\
    \ `name` 属性，都可以在 `world.objects` 数组中访问到。我们可以通过 `world.getObject`（用于单个对象）或 `world.getObjects`（带“s”，用于对象数组）按名称获取对这些对象的引用。以下是获取外星人精灵引用的方法。\n\
    \n```\nalien = world.getObject(\"alien\");\n```\n\n我们的游戏还需要引用炸弹图层，以便访问它的 `data`\
    \ 数组。\n\n```\nbombLayer = world.getObject(\"bombLayer\");\nbombMapArray = bombLayer.data;\n\
    ```\n\n现在，`bombLayer` 是一个容器，包含所有作为子精灵的炸弹。`bombMapArray` 是一个有用的数组，它告诉我们世界中所有炸弹的网格位置。（数组中的炸弹的\
    \ `gid` 数字将为 `5`）。\n\n我们还需要一个包含所有炸弹精灵的数组，可以像这样从世界中获取：\n\n```\nbombSprites = world.getObjects(\"\
    bomb\");\n```\n\n`world.getObjects` 会搜索世界中的 `objects` 数组，并找到任何 `name` 属性为 `\"\
    bomb\"` 的对象。在这个例子中，`\"bomb\"` 匹配了世界中的所有 11 个炸弹精灵。`bombSprites` 现在是一个数组，其中包含对每个这些精灵的引用。\n\
    \n现在，让我们了解如何使用炸弹地图数据来检测碰撞。\n\n### 理解炸弹地图\n\n`bombMapArray` 是一个有用的数字数组，与屏幕上炸弹精灵的位置相对应。你可以在图\
    \ 3-4 中看到这一点。每个 `\"5\"` 代表一个炸弹，每个 `\"0\"` 代表一个空单元格。\n\n![A346816_1_En_3_Fig4_HTML.gif](img/A346816_1_En_3_Fig4_HTML.gif)\n\
    \n###### 图 3-4. 与 Tiled Editor 中炸弹图层匹配的炸弹数组\n\n当创建炸弹精灵时，每个新精灵都会被赋予自己的 `index`\
    \ 属性。`index` 属性存储了炸弹在这个数组中的初始位置。\n\n我们需要知道外星人角色是否与地图上的某个炸弹位于同一位置。为此，我们必须将外星人的中心\
    \ `x` 和 `y` 屏幕坐标转换为其对应的数组索引号。我们可以借助 `getIndex` 函数来完成此操作。\n\n```\nalien.index =\
    \ getIndex(\n  alien.centerX, alien.centerY,\n  world.tilewidth, world.tileheight,\
    \ world.widthInTiles\n);\n```\n\n要判断外星人是否碰到了其中一个炸弹，需检查外星人的索引号是否与炸弹地图中的炸弹 `gid`\
    \ 数字（`\"5\"`）匹配。\n\n```\n//找出外星人在炸弹数组中的位置是否与炸弹的 gid 数字匹配                  \nif\
    \ (bombMapArray[alien.index] === 5) {\n\n  //如果匹配，则过滤炸弹精灵数组，找到              \n\
    \  //与外星人位置匹配的那个              \n  bombSprites = bombSprites.filter(bomb => {\n\
    \n    //这个炸弹精灵的索引号是否与外星人相同？              \n    if (bomb.index === alien.index)\
    \ {\n\n      //如果相同，则通过将炸弹的 gid 设置为 `0`              \n      //从 `bombMapArray`\
    \ 中移除该炸弹              \n      bombMapArray[bomb.index] = 0;\n\n      //从其容器组中移除该炸弹精灵\
    \              \n      g.remove(bomb);\n\n      //从 `bombSprites` 数组中过滤掉该炸弹  \
    \            \n      return false;\n    } else {\n\n      //如果不匹配，则将该炸弹保留在 `bombSprites`\
    \ 数组中              \n      return true;\n    }\n  });\n}\n```\n\n可以看到，如果外星人和炸弹共享相同的索引号，则它们一定占据了相同的地图位置。在这种情况下，通过将该位置的\
    \ `gid` 数字设置为 0，将炸弹从关卡的炸弹地图中擦除。\n\n```\nbombMapArray[bomb.index] = 0;\n```\n\n\
    然后，使用一个名为 `remove` 的函数将炸弹精灵从游戏中移除。\n\n```\ng.remove(bomb);\n```\n\n游戏代码实际上维护着游戏中所有炸弹的实时地图。运行游戏，拾取几个炸弹，然后检查关卡的\
    \ `bombMapArray`（你可以在控制台中看到其输出）。你会注意到，每次拾取一个炸弹时，该单元格的 `gid` 值都会被设置为 `\"0\"`。炸弹已从地图上擦除。图\
    \ 3-5 显示了在拾取了几个炸弹后，地图的 `bombMapArray` 看起来是什么样的。你可以看到，它与屏幕上炸弹的位置完美匹配。\n\n![A346816_1_En_3_Fig5_HTML.gif](img/A346816_1_En_3_Fig5_HTML.gif)\n\
    \n###### 图 3-5. 当一个炸弹被拾取时，其在游戏地图中的 gid 数字被设置为零\n\n在数组中拥有这种类型的数据更新，对于执行各种其他游戏逻辑分析非常有用，你将会在后面看到这一点。\n\
    \n### 使外星人沿网格移动\n\n在我们继续讨论基于瓦片的碰撞之前，先快速了解一下外星人角色的移动系统是如何工作的。像许多迷宫游戏角色一样，外星人与地图的网格单元精确对齐地移动。这意味着，当你按下按键改变其方向时，外星人不会朝新方向移动，直到它进入网格的新行或新列。这确保了它能干净利落地过渡到新的行列中。这有助于保持你的碰撞检测系统简单可靠。\n\
    \n如何判断游戏角色是否与地图网格单元精确对齐？通过检查精灵的 `x` 和 `y` 屏幕坐标是否可以被地图瓦片的宽度和高度整除。以下是用于检查此情况的经典代码片段。\n\
    \n```\nif(Math.floor(sprite.x) % world.tilewidth === 0\n&& Math.floor(sprite.y)\
    \ % world.tilehieght === 0) {\n\n  //是的，精灵与地图的行和列对齐了              \n}\n```\n\n\
    你还需要确保精灵的速度可以被 `tilewidth` 和 `tileheight` 整除。这能确保精灵实际拥有的像素位置能使上述检查结果为真。这意味着，如果你的瓦片宽度和高度是\
    \ `64`，那么你精灵的速度必须是能整除 `64` 的数：`1`、`2`、`4`、`8`、`16` 或 `32`。如果精灵的速度是 `5`、`7` 或 `11`，它们永远无法整除\
    \ `64`，因此精灵将永远不会精确地对齐到地图的行或列。\n\n以下是此示例中的实现方式。`setup` 函数创建了响应方向键按下的键盘按键对象。然后在外星人上创建了一个名为\
    \ `direction` 的属性，按键动作会改变该 `direction` 的值。\n\n```\n//创建键盘对象                  \n\
    leftArrow = g.keyboard(37);\nupArrow = g.keyboard(38);\nrightArrow = g.keyboard(39);\n\
    downArrow = g.keyboard(40);\n\n//在外星人上创建一个 `direction` 属性                  \n\
    alien.direction = \"\";\n\n//分配按键的 `press` 动作，以改变外星人的 `direction`\nleftArrow.press\
    \ = () => alien.direction = \"left\";\nupArrow.press = () => alien.direction =\
    \ \"up\";\nrightArrow.press = () => alien.direction = \"right\";\ndownArrow.press\
    \ = () => alien.direction = \"down\";\n```\n\n当按下任意方向键时，外星人的 `direction` 会变为：`\"\
    up\"`、`\"down\"`、`\"left\"` 或 `\"right\"`。游戏循环在每一帧检查此方向，并相应地改变外星人的速度：\n\n```\n\
    if(Math.floor(alien.x) % world.tilewidth === 0\n&& Math.floor(alien.y) % world.tileheight\
    \ === 0) {\n  switch (alien.direction) {\n    case \"up\":\n      alien.vy = -4;\n\
    \      alien.vx = 0;\n      break;\n    case \"down\":\n      alien.vy = 4;\n\
    \      alien.vx = 0;\n      break;\n    case \"left\":\n      alien.vx = -4;\n\
    \      alien.vy = 0;\n      break;\n    case \"right\":\n      alien.vx = 4;\n\
    \      alien.vy = 0;\n      break;\n  }\n}\n```\n\n然后，游戏循环移动外星人，并使用一个名为 `contain`\
    \ 的自定义函数将其限制在画布边界内。\n\n```\nalien.x += alien.vx;\nalien.y += alien.vy;\ng.contain(alien,\
    \ g.stage);\n```\n"
- fmt: '###### Note


    It’s especially important to be aware of map boundaries for any game that depends
    on reading array index locations. That’s because you don’t want the sprite’s `x`/`y`
    position to evaluate to an array index number that’s less than or greater than
    the number of elements in the array. If it does, you might encounter some mysterious
    “undefined” error messages. These are very hard to track down, especially if they
    happen infrequently. But that’s not the worst that can happen. The worst is that
    you won’t get any error messages at all. Instead, you’ll just notice all sorts
    of crazy random bugs with no apparent cause. If that happens, check your sprites’
    index and position values!


    In upcoming examples you’ll see how keeping sprites aligned to grid rows and columns
    makes it easy to implement a maze game with walls.


    ### Collisions with Moving Sprites


    What would happen if all the bombs were moving around? Their map index numbers
    would change constantly. To help keep track of this, add another new property
    to your sprites called `gid`.


    ```javascript

    playerSprite.gid

    ```


    `gid` stores the grid index number that references the sprite’s image on the tileset.
    If the player sprite’s tileset image is the fourth on the top row, you could set
    its `gid` to 4, like this:


    ```javascript

    playerSprite.gid = 4;

    ```


    The `makeTileWorld` function you learned in the previous chapter added a `gid`
    property to all the sprites for you when it created the game world.


    If sprites are moving around, use their `gid` and `index` properties to update
    their locations in the map array in real time. Use an `updateMap` function to
    help you do this. `updateMap` takes the original array and a sprite, or an array
    of sprites, whose locations you want to update. It also needs to know the world’s
    width, height, and `widthInTiles`. It returns a new array with the new locations
    of those sprites.


    ```javascript

    mapArray = updateMap(mapArray, bombSprites, world);

    ```


    Here’s the complete `updateMap` function that does all the work. (Note that this
    code makes use of the `getIndex` function you learned earlier in the chapter).


    ```javascript

    function updateMap(mapArray, spritesToUpdate, world) {


      //First create a new map array filled with zeros.

      //The new map array will be exactly the same size as the original

      let newMapArray = mapArray.map(gid => {

        gid = 0;

        return gid;

      });


      //Is `spritesToUpdate` an array of sprites?

      if (spritesToUpdate instanceof Array) {


        //Get the index number of each sprite in the `spritesToUpdate` array

        //and add the sprite''s `gid` to the matching index on the map

        spritesToUpdate.forEach(sprite => {


          //Find the new index number

          sprite.index = getIndex(

            sprite.centerX, sprite.centerY,

            world.tilewidth, world.tileheight, world.widthInTiles

          );


          //Add the sprite''s `gid` number to the correct

          //index on the map

          newMapArray[sprite.index] = sprite.gid;

        });

      }


      //Is `spritesToUpdate` just a single sprite?

      else {

        let sprite = spritesToUpdate;


        //Find the new index number

        sprite.index = getIndex(

          sprite.centerX, sprite.centerY,

          world.tilewidth, world.tileheight, world.widthInTiles

        );


        //Add the sprite''s `gid` number to the correct

        //index on the map

        newMapArray[sprite.index] = sprite.gid;

      }


      //Return the new map array to replace the previous one

      return newMapArray;

    }

    ```


    (You’ll find the `updateMap` function in `hexi/src/modules/tileUtilities/src/tileUtilities.js`.)


    `updateMap` takes an array of sprites, uses their index positions to make a new
    map, and replaces the previous map with the new one. This is the most reliable
    way to make sure all the positions are current, and allows for two or more sprites
    to share a single `gid` number at the same location. `updateMap` should be called
    inside a game loop, after the positions of sprites have been changed, and before
    you check for collisions.


    Now that you know how to update a map in real time, how can you use this information
    to check for collisions?


    ### Checking Collisions by Comparing Array Locations


    If you have lots of moving sprites in a game, you can check for collisions using
    an array comparison technique. In the first example in this chapter, we checked
    for a collision between the alien and a bomb like this:


    ```javascript

    if (bombArray[alien.index] === 5) //Collision!

    ```


    This works well for checking a single sprite against a group of sprites. But what
    if you want to check a group of moving sprites against another group of moving
    sprites?


    The trick is to overlay one map onto another map. If anything in those maps share
    the same index numbers, you have a collision.


    Here’s the basic system at work:


    First, start with two maps containing different kinds of things. `mapOne` stores
    “1”s and `mapTwo` stores “2”s:


    ```javascript

    mapOne = [0, 0, 1, 0, 1, 0];

    mapTwo = [0, 2, 0, 0, 2, 0];

    ```


    What you want to find out is if there are any map locations that are occupied
    by both a 1 and a 2? Are there? We can clearly see that there are. At index number
    4.


    But how can we check for this with code? Like this:


    ```javascript

    mapOne.forEach((gid, index) => {

      if (mapTwo[index] === 2 && gid === 1) {

        console.log("Collision at location: " + index);

      }

    });

    ```


    This displays:


    ```

    Collision at location: 4

    ```


    If you have lots of sprites with constantly changing positions, this might be
    the most efficient way to check for collisions.


    Let’s look at a practical example that demonstrates these new techniques. Run
    the `movingCollision.html` file for a new version of the example game with moving
    bombs. Use the arrow keys to make the alien chase and collect bombs, as shown
    in Figure [3-6](#A346816_1_En_3_Chapter.xhtml#Fig6).


    ![A346816_1_En_3_Fig6_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig6_HTML.jpg)


    ###### Figure 3-6. Chase moving bombs around the map


    This new example uses the same three map layers: “backgroundLayer,” “bombLayer,”
    and “alienLayer.” Figure [3-7](#A346816_1_En_3_Chapter.xhtml#Fig7) shows the data
    array for each layer.


    ![A346816_1_En_3_Fig7_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig7_HTML.gif)'
