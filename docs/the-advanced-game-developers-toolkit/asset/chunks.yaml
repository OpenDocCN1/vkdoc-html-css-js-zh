    \ in hexi/src/modules/tileUtilities/src/tileUtilities.js.)\n\nupdateMap takes\
    \ an array of sprites, uses their index positions to make a new map, and replaces\
    \ the previous map with the new one. This is the most reliable way to make sure\
    \ all the positions are current, and allows for two or more sprites to share a\
    \ single gid number at the same location. updateMap should be called inside a\
    \ game loop, after the positions of sprites have been changed, and before you\
    \ check for collisions.\n\nNow that you know how to update a map in real time,\
    \ how can you use this information to check for collisions?\n\n### Checking Collisions\
    \ by Comparing Array Locations\n\nIf you have lots of moving sprites in a game,\
    \ you can check for collisions using an array comparison technique . In the first\
    \ example in this chapter, we checked for a collision between the alien and a\
    \ bomb like this:\n\n```\nif (bombArray[alien.index] === 5) //Collision!\n```\n\
    \nThis works well for checking a single sprite against a group of sprites. But\
    \ what if you want to check a group of moving sprites against another group of\
    \ moving sprites?\n\nThe trick is to overlay one map onto another map. If anything\
    \ in those maps share the same index numbers, you have a collision.\n\nHere’s\
    \ the basic system at work:\n\nFirst, start with two maps containing different\
    \ kinds of things. mapOne stores “1”s and mapTwo stores “2”s:\n\n```\nmapOne =\
    \ [0, 0, 1, 0, 1, 0];\nmapTwo = [0, 2, 0, 0, 2, 0];\n```\n\nWhat you want to find\
    \ out is if there are any map locations that are occupied by both a 1 and a 2?\
    \ Are there? We can clearly see that there are. At index number 4.\n\nBut how\
    \ can we check for this with code? Like this:\n\n```\nmapOne.forEach((gid, index)\
    \ => {\n  if (mapTwo[index] === 2 && gid === 1) {\n    console.log(\"Collision\
    \ at location: \" + index);\n  }\n});\n```\n\nThis displays:\n\n```\nCollision\
    \ at location: 4\n```\n\nIf you have lots of sprites with constantly changing\
    \ positions, this might be the most efficient way to check for collisions.\n\n\
    Let’s look at a practical example that demonstrates these new techniques. Run\
    \ the movingCollision.html file for new a version of the example game with moving\
    \ bombs. Use the arrow keys to make the alien chase and collect bombs, as shown\
    \ in Figure [3-6](#A346816_1_En_3_Chapter.xhtml#Fig6).\n\n![A346816_1_En_3_Fig6_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig6_HTML.jpg)\n\
    \n###### Figure 3-6. Chase moving bombs around the map\n\nThis new example uses\
    \ the same three map layers: “backgroundLayer,” “bombLayer,” and “alienLayer.”\
    \ Figure [3-7](#A346816_1_En_3_Chapter.xhtml#Fig7) shows the data array for each\
    \ layer.\n\n![A346816_1_En_3_Fig7_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig7_HTML.gif)"
