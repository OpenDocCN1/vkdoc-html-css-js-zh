  trans: '

    # 宽相位与窄相位碰撞


    游戏碰撞检测有两种通用的处理方式，分别称为**宽相位**和**窄相位**碰撞。


    - **宽相位碰撞**：检查精灵是否处于碰撞的粗略区域，例如我们在前几章详细讨论过的基于瓦片的碰撞。其优势在于，这是针对大量精灵进行碰撞检测时极具性能效率的方式。因为它仅执行简单的数组查找，无需进行任何复杂的数学运算。

    - **窄相位碰撞**：通过检查精灵的精确几何形状来判断它们的轮廓是否重叠。其优势在于，由于精度极高，窄相位碰撞对于物理模拟至关重要，例如检测两个台球之间的碰撞。其劣势在于，由于大量数学运算会加重
    CPU 负担，它非常消耗性能。如果你要检测大量精灵之间的碰撞，速度可能会很慢。尽管本书不涉及如何实现窄相位碰撞系统，但你可以在*《使用 HTML5 与 JavaScript
    进行高级游戏设计》*中找到从头构建此类系统所需的一切知识。


    这两种碰撞系统构成了所有电子游戏中碰撞检测的基础。你如何决定使用哪一种？选择通常很简单：如果需要物理效果，就用窄相位；否则就用宽相位。但这里存在一个灰色地带！


    如果你正在制作一个游戏，其中有数千个圆球需要相互弹跳，该怎么办？你尝试实现一个物理负担沉重的窄相位碰撞系统，但帧率降到了每秒 5 帧。太慢了！于是你实现了一个宽相位碰撞系统，轻松达到了每秒
    60 帧。但现在你的圆球在弹开之前明显会相互重叠，看起来极其不精确。你该怎么办？


    同时使用宽相位*和*窄相位碰撞！将你的碰撞系统分解为两个步骤：


    1.  **宽相位检查**：首先使用宽相位碰撞来找出你关注的精灵是否彼此处于大致邻近区域，以及在本动画帧中是否可能足够接近并发生接触。

    2.  **窄相位检查**：如果宽相位检查确定有可能发生碰撞，则运行一个更精确但更耗费 CPU 的窄相位检查。


    实现这种两阶段碰撞策略的方法有很多，但我要向你展示最简单、最有用且通常最具性能效率的一种：**空间网格**。


    ## 空间网格


    要创建空间网格，请将你的游戏世界划分为单元格。这些单元格应该多大？它们的大小应该相当于一个精灵在一个动画帧内可能移动的最大距离。例如，假设你正在创建一个弹珠游戏，并且你确定所有弹珠精灵的移动速度都不会超过每秒
    64 像素。这意味着你可以使用一个空间网格，其中每个单元格宽 64 像素、高 64 像素。如果你的游戏屏幕是 512x512 像素，图 7-4 展示了这个网格的样子。


    ![A346816_1_En_7_Fig4_HTML.jpg](img/A346816_1_En_7_Fig4_HTML.jpg)


    ###### 图 7-4. 将你的世界划分为单元格


    在标准的窄相位碰撞系统中，每个精灵都需要与整个游戏中的其他所有精灵进行碰撞检测。这是很浪费的，因为碰撞检测会在位于屏幕完全相反两侧的精灵之间进行，即便它们绝无可能发生碰撞。但是，如果你使用空间网格，你的碰撞检测就会更有针对性。对于每个精灵，你只需要检测它与其直接相邻单元格中的精灵之间是否发生碰撞。


    例如，请看图 7-5。屏幕左中位置有一个大的白色圆圈。那个白色圆圈所在的单元格，以及环绕它的八个单元格，共同构成了该圆圈的**碰撞区域**。这个碰撞区域是屏幕上该精灵有可能与任何其他精灵发生碰撞的唯一区域。


    ![A346816_1_En_7_Fig5_HTML.jpg](img/A346816_1_En_7_Fig5_HTML.jpg)


    ###### 图 7-5. 仅检测同一碰撞区域内精灵之间的碰撞


    因此，我们不需要检测这个大白色圆圈与屏幕上其他 24 个圆圈之间的碰撞，只需检测它与碰撞区域右上角那两个较小圆圈之间的碰撞。这减少了大约 90%的碰撞检测次数！


    原理就这么简单！但是，你如何实际用代码创建这样一个空间网格系统，并在游戏中使用它呢？


    ## 实现空间网格


    运行本章源文件中的 `spatialGrid.html` 文件，可以查看一个可运行的示例。这是一个简单的弹珠弹射游戏。用鼠标选择一个弹珠，拖拽，然后释放。观察弹珠在屏幕上弹跳并与其他弹珠碰撞，如图
    7-6 所示。


    ![A346816_1_En_7_Fig6_HTML.jpg](img/A346816_1_En_7_Fig6_HTML.jpg)


    ###### 图 7-6. 点击、拖拽并释放，观看弹珠在屏幕上弹跳


    有关这个小游戏原型如何工作的详细信息，请查看完整的源代码。就我们的目的而言，我们只对空间网格碰撞系统的工作原理感兴趣。但是，关于我们即将查看的代码，有两点你需要了解：


    - 所有代码都在游戏循环内运行，因此每一帧都会更新。

    - 所有圆形精灵都引用自一个名为 `marbles.children` 的数组。


    好了，明白了吗？现在我们来看看代码！

    '
- fmt: "### Coding the Spatial Grid\n\nThe first thing we need to do is create the\
    \ grid. This is just a 2D array with cells that match the number of rows and columns\
    \ we want for our grid. The array is first initialized with empty elements. Then,\
    \ the code loops through all the sprites and uses our good old `getIndex` function\
    \ to insert them into their correct cells, based on each sprite’s x/y pixel coordinates.\
    \ Our code does all this inside a function called `spatialGrid`, which lets you\
    \ specify the size of the grid and size of each cell, in pixels.\n\n```\nlet spatialGrid\
    \ = (widthInPixels, heightInPixels, cellSizeInPixels, spritesArray) => {\n\n \
    \ //Find out how many cells we need and how long the              \n  //grid array\
    \ should be              \n  let width = widthInPixels / cellSizeInPixels,\n \
    \   height = heightInPixels / cellSizeInPixels,\n    length = width * height;\n\
    \n  //Initialize an empty grid              \n  let gridArray = [];\n\n  //Add\
    \ empty sub-arrays to the element              \n  for (let i = 0; i < length;\
    \ i++) {\n\n    //Add empty arrays to each element. This is where            \
    \  \n    //we're going to store sprite references              \n    gridArray.push([]);\n\
    \  }\n\n  //Add the sprites to the grid              \n  spritesArray.forEach(sprite\
    \ => {\n\n    //Find out the sprite's current map index position             \
    \ \n    let index = getIndex(sprite.x, sprite.y, cellSizeInPixels, cellSizeInPixels,\
    \ width);\n\n    //Add the sprite to the array at that index position        \
    \      \n    gridArray[index].push(sprite);\n  });\n\n  //Return the array   \
    \           \n  return gridArray;\n};\n\n//Create the spatial grid and add the\
    \ marble sprites to it                  \nlet grid = spatialGrid(512, 512, 64,\
    \ marbles.children);\n```\n\nWe now have a 2D array called `grid`. Each sub-array\
    \ it contains will either be empty, or contain references to sprites in a way\
    \ that matches the positions of the sprites on the screen. For example, you might\
    \ have an array that looks like this:\n\n```\n[\n  [],[circle1],[],[],[],[],[],[circle2],[],\n\
    \  [circle3],[],[circle4],[circle5],[],[],[],[],[],\n  [],[],[],[],[],[],[],[],[circle6],\n\
    \  [],[],[],[circle7],[circle8],[],[],[],[],\n  [],[circle9],[],[circle10],[],[circle11],[],[],[],\n\
    \  [circle12, circle13],[],[],[],[],[],[circle14],[circle15],[],\n  [circle16],[circle17],[],[],[],[circle18],[],[],[],\n\
    \  [],[],[circle19],[],[],[circle20],[],[],[circle21],\n  [],[circle20],[circle23],[],[],[],[],[circle24],[circle25]\n\
    ]\n```\n\n(The actual names of the sprites, such as `circle1` and `circle2`, are\
    \ just for illustrative purposes – those names are not actually produced by the\
    \ code.)\n\nFigure 7-7 shows how this array compares to the screen positions of\
    \ the same sprites.\n\n![A346816_1_En_7_Fig7_HTML.jpg](OEBPS/Images/A346816_1_En_7_Fig7_HTML.jpg)\n\
    \n###### Figure 7-7. The sprites are positioned in the array to match their screen\
    \ positions\n\nIn a game with densely packed sprites, you might have many cells\
    \ that hold references to more than one sprite.\n\nThe next step is to loop through\
    \ all the sprites and find out whether there are any other sprites in its collision\
    \ zone. (Remember, the collision zone is the eight cells surrounding the sprite,\
    \ plus the cell that the sprite itself occupies.) If there are any sprites in\
    \ the collision zone, the code does a narrowphase collision check using a custom\
    \ function called `movingCircleCollision` to bounce the sprites apart (see *Foundation\
    \ Game Design with HTML5 and JavaScript* (Apress, 2012) for details on how `movingCircleCollision`\
    \ works.) Finally, the current sprite being checked is removed from the grid array\
    \ because all its possible collisions have been checked and we want to prevent\
    \ other sprites from trying to recheck it in a later iteration of the loop.\n\n\
    ```\n//Loop through all the sprites                  \nfor (let i = 0; i < marbles.children.length;\
    \ i++) {\n\n  //Get a reference to the current sprite in the loop            \
    \  \n  let sprite = marbles.children[i];\n\n  //Find out the sprite's current\
    \ map index position              \n  let gridWidthInTiles = 512 / 64;\n  let\
    \ index = getIndex(sprite.x, sprite.y, 64, 64, gridWidthInTiles);\n\n  //Find\
    \ out what the surrounding cells contain, including those that              \n\
    \  //might be beyond the borders of the grid              \n  let allSurroundingCells\
    \ = [\n    grid[index - gridWidthInTiles - 1],\n    grid[index - gridWidthInTiles],\n\
    \    grid[index - gridWidthInTiles + 1],\n    grid[index - 1],\n    grid[index],\n\
    \    grid[index + 1],\n    grid[index + gridWidthInTiles - 1],\n    grid[index\
    \ + gridWidthInTiles],\n    grid[index + gridWidthInTiles + 1]\n  ];\n\n  //Find\
    \ all the sprites that might be colliding with this current sprite           \
    \   \n  for (let j = 0; j < allSurroundingCells.length; j++) {\n\n    //Get a\
    \ reference to the current surrounding cell              \n    let cell = allSurroundingCells[j];\n\
    \n    //If the cell isn't `undefined` (beyond the grid borders)              \n\
    \    //and it's not empty, check for a collision between              \n    //the\
    \ current sprite and sprites in the cell              \n    if (cell && cell.length\
    \ !== 0) {\n\n      //Loop through all the sprites in the cell              \n\
    \      for (let k = 0; k < cell.length; k++) {\n\n        //Get a reference to\
    \ the current sprite being checked              \n        //in the cell      \
    \        \n        let surroundingSprite = cell[k];\n\n        //If the sprite\
    \ in the cell is not the same as the current              \n        //sprite in\
    \ the main loop, then check for a collision              \n        //between those\
    \ sprites              \n        if (surroundingSprite !== sprite) {\n\n     \
    \     //Perform a narrow-phase collision check to bounce              \n     \
    \     //the sprites apart              \n          g.movingCircleCollision(sprite,\
    \ surroundingSprite);\n        }\n      }\n    }\n  }\n\n  //Finally, remove this\
    \ current sprite from the current              \n  //spatial grid cell because\
    \ all possible collisions              \n  //involving this sprite have been checked\
    \              \n  grid[index] = grid[index].filter(x => x !== sprite);\n}\n```\n\
    \nAnd that’s all there is to it! By doing an efficient broadphase check first,\
    \ and then only doing a performance-heavy narrowphase check if there’s a likelihood\
    \ of a collision, we’ve greatly increased the efficiency of our collision system.\n\
    \nWhy does this code use old-fashioned `for` loops, instead of more sleek and\
    \ modern `forEach` loops? `for` loops tend to be ever so slightly more efficient.\
    \ Usually, the difference is not enough to favor `for` loops in general, but because\
    \ collision detection is one of the most performance-demanding tasks your games\
    \ will be doing, using a `for` loop in this context will usually win you a small\
    \ performance boost."
