    本书中的大部分源代码均使用一款名为 **Hexi** 的极简 2D HTML5 游戏引擎编写而成。该引擎由我亲自设计，旨在让你用最少的代码，开发出尽可能多种类的游戏。你可以在这里找到关于
    Hexi 你需要了解的所有信息，包括详细的教程和示例：


    ```

    github.com/kittykatattack/hexi

    ```


