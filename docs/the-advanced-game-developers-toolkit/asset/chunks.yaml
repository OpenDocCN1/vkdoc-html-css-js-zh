    ## 2. 使用 Tiled Editor


    Rex van der Spuy^(1 )


    (1)加拿大，安大略省，多伦多


    如果说有什么软件是每个游戏开发者都应该学会使用的，那非 Tiled Editor 莫属（`www.mapeditor.org`）。Tiled Editor
    是一款行业标准的开源应用程序，它让你能够轻松创建视觉上复杂的布局，然后将该布局导出为 JSON 数据文件，供你构建游戏世界使用。由于 Tiled Editor
    仅输出数据，因此它既适用于 JavaScript，也同样适用于使用任何其他技术（如 C#、Java 或 Objective-C）制作游戏。而且它不仅仅适用于游戏——当你需要设计一个用代码难以描述或极其耗时的大型复杂布局时，都可以使用它。


    在本章中，我们将详细研究如何使用 Tiled Editor，以便你能够快速将其应用于自己的项目中。你将了解如何：


    -   准备你的源图像。

    -   配置 Tiled Editor。

    -   使用图层和对象。

    -   理解 JSON 数据输出。

    -   将 JSON 数据导入你的游戏代码，并使用它来创建精灵。

    -   创建一个摄像机，使其在大型滚动游戏世界中跟随游戏角色。


    学习如何使用 Tiled Editor 并导入其数据所需付出的微小努力，对于它将带给你的巨大生产力提升来说，是完全值得的。


    我们将通过制作一个实用的小型 RPG（角色扮演游戏）引擎来学习如何使用 Tiled Editor，如图 2-1 所示。运行本章源文件中的 `fantasy.html`
    来试用完成后的原型。使用方向键控制精灵角色在世界中行走，并收集三样物品：一颗心、一个骷髅和一只土拨鼠（有点像一只胖乎乎的、毛茸茸的豚鼠）。


    ![A346816_1_En_2_Fig1_HTML.jpg](img/A346816_1_En_2_Fig1_HTML.jpg)


    ###### 图 2-1. 帮助精灵在游戏世界中收集物品


    所有游戏对象都具有正确的深度层级，虽然墙壁、树木和灌木丛会阻挡精灵的道路，但他可以像在真实的 3D 空间中一样绕过它们。如果仅使用纯代码来绘制对象的位置和深度，创建如此复杂的布局将相当困难——因此，这是
    Tiled Editor 的完美用武之地！


    ### 选择你的图像


    首先要从包含游戏图形的图块集开始。


    ###### 注意

    图块集，也称为精灵表，是将所有游戏图像作为子图像包含在单个图像中。


    你需要使用图形编辑器（如 Illustrator、Pixelmator、Photoshop、Gimp 或 Piskel）创建游戏图形，然后使用 Shoebox
    或 Texture Packer 等工具打包。


    整个滚动游戏世界仅使用了图 2-2 中所示的少量图像构建而成。完成的游戏世界看起来很复杂，但使用这个图块集仅用了几分钟就拼凑完成了。大多数精灵图像是 64
    x 64 像素，但右上角较小的图像是 32x32 像素。大树是 128x128 像素。你可以混合搭配任意大小的精灵图像，但如果将它们保持在 2 的幂次方大小（`8x8`、`16x16`、`32x32`
    等），你的工作会轻松得多。


    ![A346816_1_En_2_Fig2_HTML.jpg](img/A346816_1_En_2_Fig2_HTML.jpg)


    ###### 图 2-2. 从一个图块集开始


    你可以看到，该图块集包含了关卡中除一个角色之外的所有精灵：精灵角色。这是因为我们稍后会直接在游戏代码中添加这个动画精灵。（你将在后续步骤中看到如何操作）。


    ### 创建地图


    **地图** 是 Tiled Editor 对你正在创建的游戏屏幕布局的称呼。它只是一个由单元格组成的矩形网格。我们在本章中创建的游戏地图是一个 24 x
    24 的单元网格，每个单元宽高均为 32 像素。这意味着整个地图的宽度和高度为 768 像素。


    要在 Tiled Editor 中创建新地图，请从菜单中选择“文件 ➤ 新建”。将出现“新建地图”对话框，让你设置地图属性，如图 2-3 所示。对于平面的
    2D 地图，选择**正交**方向。选择 CSV 图层格式，以便地图信息以数组形式输出。同时，保持 Tile 渲染顺序的默认值“右下”。然后，设置地图的宽度和高度（以图块为单位），然后定义每个图块的宽度和高度。如果你的图块集包含不同大小的图像，请将图块高度和宽度设置为*最小*图像的大小。在此示例中，图块集上最小的图像是
    32x32 像素。完成后选择“确定”。


    ![A346816_1_En_2_Fig3_HTML.jpg](img/A346816_1_En_2_Fig3_HTML.jpg)


    ###### 图 2-3. 设置地图属性

