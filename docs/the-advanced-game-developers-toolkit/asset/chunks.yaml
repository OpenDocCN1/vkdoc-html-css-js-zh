  trans: "```markdown\n\n// 寻找所有有效的周围节点，即地图边界内且不包含障碍物的节点。\n// 可选择将 `allSurroundingNodes`\
    \ 替换为 `crossSurroundingNodes`，\n// 以防止路径在节点间选择对角线方向。\nlet validSurroundingNodes\
    \ = allSurroundingNodes.filter(node => {\n\n  // 若节点为 `undefined`，则表示其超出了地图的顶部和底部边缘。\n\
    \  let nodeIsWithinTopAndBottomBounds = node !== undefined;\n\n  // 仅返回位于地图顶部和底部边界之间的节点。\n\
    \  if (nodeIsWithinTopAndBottomBounds) {\n\n    // 以下布尔值用于判断当前地图索引是否位于地图左边界或右边界，\n\
    \    // 以及该索引周围的节点是否延伸至左右边界之外。\n    let indexIsOnLeftBorder = index % mapWidthInTiles\
    \ === 0;\n    let indexIsOnRightBorder = (index + 1) % mapWidthInTiles === 0;\n\
    \    let nodeIsBeyondLeftBorder\n      = node.column % (mapWidthInTiles - 1) ===\
    \ 0\n      && node.column !== 0;\n    let nodeIsBeyondRightBorder = node.column\
    \ % mapWidthInTiles === 0;\n\n    // 通过遍历障碍物 GID 来判断节点是否包含障碍物。\n    // 若在该节点位置找到任何障碍物，则返回\
    \ `true`。\n    let nodeContainsAnObstacle = obstacleGids.some(obstacle => {\n\
    \      return mapArray[node.index] === obstacle;\n    });\n\n    // 如果索引位于左边界，且任何周围节点超出左边界，则不返回该节点。\n\
    \    if (indexIsOnLeftBorder) {\n      return !nodeIsBeyondLeftBorder;\n    }\n\
    \n    // 如果索引位于右边界，且任何周围节点超出右边界，则不返回该节点。\n    else if (indexIsOnRightBorder) {\n\
    \      return !nodeIsBeyondRightBorder;\n    }\n\n    // 如果节点包含障碍物，则返回 `false`。\n\
    \    else if (nodeContainsAnObstacle) {\n      return false;\n    }\n\n    //\
    \ 如果通过了上述检查，则说明索引一定位于左右边界定义的区域内。\n    // 因此返回该节点。\n    else {\n      return true;\n\
    \    }\n  }\n});\n\n// 返回 `validSurroundingNodes` 数组。\nreturn validSurroundingNodes;\n\
    };\n\n// 启发式方法\n// 1. 曼哈顿距离\nlet manhattan = (testNode, destinationNode) => {\n\
    \  let h\n    = Math.abs(testNode.row - destinationNode.row)\n    * straightCost\
    \ + Math.abs(testNode.column - destinationNode.column)\n    * straightCost;\n\
    \  return h;\n};\n\n// 2. 欧几里得距离\nlet euclidean = (testNode, destinationNode)\
    \ => {\n  let vx = destinationNode.column - testNode.column,\n    vy = destinationNode.row\
    \ - testNode.row,\n    h = Math.floor(Math.sqrt(vx * vx + vy * vy) * straightCost);\n\
    \  return h;\n};\n\n// 3. 对角线距离\nlet diagonal = (testNode, destinationNode) =>\
    \ {\n  let vx = Math.abs(destinationNode.column - testNode.column),\n    vy =\
    \ Math.abs(destinationNode.row - testNode.row),\n    h = 0;\n\n  if (vx > vy)\
    \ {\n    h = Math.floor(diagonalCost * vy + straightCost * (vx - vy));\n  } else\
    \ {\n    h = Math.floor(diagonalCost * vx + straightCost * (vy - vx));\n  }\n\
    \  return h;\n};\n\n// 遍历所有节点，直到当前的 `centerNode` 与 `destinationNode` 匹配。\n// 当两者相同时，说明我们已经到达路径终点。\n\
    while (centerNode !== destinationNode) {\n\n  // 查找当前 `centerNode` 周围的所有节点。\n\
    \  let surroundingTestNodes = surroundingNodes(centerNode.index, mapArray, mapWidthInTiles);\n\
    \n```"
- fmt: "// Loop through all the `surroundingTestNodes` nodes using a classic `for`\
    \ loop  \n// (A `for` loop gives us a marginal performance boost. A* is extremely\
    \ performance  \n// hungry, so even a small performance boost with each loop iteration\
    \ can  \n// amount to a significant boost overall)  \nfor (let i = 0; i < surroundingTestNodes.length;\
    \ i++) {\n\n  // Get a reference to the current test node  \n  let testNode =\
    \ surroundingTestNodes[i];\n\n  // Find out whether the node is on a straight\
    \ axis or  \n  // a diagonal axis, and assign the appropriate cost\n\n  // A.\
    \ Declare the cost variable  \n  let cost = 0;\n\n  // B. Do they occupy the same\
    \ row or column?  \n  if (centerNode.row === testNode.row || centerNode.column\
    \ === testNode.column) {\n\n    // If they do, assign a cost of \"10\"  \n   \
    \ cost = straightCost;\n  } else {\n\n    // Otherwise, assign a cost of \"14\"\
    \  \n    cost = diagonalCost;\n  }\n\n  // C. Calculate the costs (g, h and f)\
    \  \n  // The node's current cost  \n  let g = centerNode.g + cost;\n\n  // The\
    \ cost of travelling from this node to the  \n  // destination node (the heuristic)\
    \  \n  let h;\n  switch (heuristic) {\n    case \"manhattan\":\n      h = manhattan(testNode,\
    \ destinationNode);\n      break;\n\n    case \"euclidean\":\n      h = euclidean(testNode,\
    \ destinationNode);\n      break;\n\n    case \"diagonal\":\n      h = diagonal(testNode,\
    \ destinationNode);\n      break;\n\n    default:\n      throw new Error(\"Oops!\
    \ It looks like you misspelled the name of the heuristic\");\n  }\n\n  // The\
    \ final cost  \n  let f = g + h;\n\n  // Find out if the testNode is in either\
    \  \n  // the openList or closedList array  \n  let isOnOpenList = openList.some(node\
    \ => testNode === node);\n  let isOnClosedList = closedList.some(node => testNode\
    \ === node);\n\n  // If it's on either of these lists, we can check  \n  // whether\
    \ this route is a lower-cost alternative  \n  // to the previous cost calculation.\
    \ The new G cost  \n  // will make the difference to the final F cost  \n  if\
    \ (isOnOpenList || isOnClosedList) {\n    if (testNode.f > f) {\n      testNode.f\
    \ = f;\n      testNode.g = g;\n      testNode.h = h;\n\n      // Only change the\
    \ parent if the new cost is lower  \n      testNode.parent = centerNode;\n   \
    \ }\n  }\n\n  // Otherwise, add the testNode to the open list  \n  else {\n  \
    \  testNode.f = f;\n    testNode.g = g;\n    testNode.h = h;\n    testNode.parent\
    \ = centerNode;\n    openList.push(testNode);\n  }\n\n  // The `for` loop ends\
    \ here  \n}\n\n// Push the current centerNode into the closed list  \nclosedList.push(centerNode);\n\
    \n// Quit the loop if there's nothing on the open list.  \n// This means that\
    \ there is no path to the destination or the  \n// destination is invalid, like\
    \ a wall tile  \nif (openList.length === 0) {\n  return shortestPath;\n}\n\n//\
    \ Sort the open list according to final cost  \nopenList = openList.sort((a, b)\
    \ => a.f - b.f);\n\n// Set the node with the lowest final cost as the new centerNode\
    \  \ncenterNode = openList.shift();\n\n// The `while` loop ends here  \n\n// Now\
    \ that we have all the candidates, let's find the shortest path!  \nif (openList.length\
    \ !== 0) {\n\n  // Start with the destination node  \n  let testNode = destinationNode;\n\
    \  shortestPath.push(testNode);\n\n  // Work backwards through the node parents\
    \  \n  // until the start node is found  \n  while (testNode !== startNode) {\n\
    \n    // Step through the parents of each node,  \n    // starting with the destination\
    \ node and ending with the start node  \n    testNode = testNode.parent;\n\n \
    \   // Add the node to the beginning of the array  \n    shortestPath.unshift(testNode);\n\
    \n    // ...and then loop again to the next node's parent till you  \n    // reach\
    \ the end of the path  \n  }\n}\n\n// Return an array of nodes that link together\
    \ to form  \n// the shortest path  \nreturn shortestPath;\n\n### Using the `shortestPath`\
    \ Function\n\nIn the chapter’s source files, you’ll find a folder called `shortestPath.html`.\
    \ Run the program, and you’ll see an alien character sitting in a simple maze\
    \ environment. Click anywhere with the mouse, and the program will draw the shortest\
    \ path from the alien’s position to the mouse’s location, as shown in Figure 6-18.\n\
    \n![A346816_1_En_6_Fig18_HTML.jpg](OEBPS/Images/A346816_1_En_6_Fig18_HTML.jpg)"
