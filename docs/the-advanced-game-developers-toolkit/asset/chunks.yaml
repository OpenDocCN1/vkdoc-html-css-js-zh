    \n###### Figure 3-2. The three map layers\n\nThe alien and bomb images in the\
    \ tileset are both given name property values: “alien” and “bomb,” as shown in\
    \ Figure [3-3](#A346816_1_En_3_Chapter.xhtml#Fig3). This will let us easily reference\
    \ them in the game code later using world.getObject (for single objects) and world.getObjects\
    \ (for an array of objects), as you learned to do in the previous chapter.\n\n\
    ![A346816_1_En_3_Fig3_HTML.jpg](OEBPS/Images/A346816_1_En_3_Fig3_HTML.jpg)\n\n\
    ###### Figure 3-3. Give names to the alien and bomb images"
  trans: "\n# 3. 基于瓦片的碰撞检测\n\nRex van der Spuy¹\n\n(1)加拿大多伦多，安大略省\n\n在游戏中检测碰撞主要有两种方式。第一种是比较屏幕上精灵的\
    \ x 和 y 像素位置。如果它们的形状重叠，则发生碰撞。这种碰撞检测策略称为**窄阶段碰撞**。如果你使用过带有类似 `hitTestRectangle`\
    \ 或 `hitTestCircle` 等碰撞函数的游戏引擎来检查形状是否重叠，那么这些很可能就是窄阶段碰撞函数。它们使用向量数学（线性代数）来判断精灵的形状是否重叠。因此，你可以实现非常精确的像素级碰撞精度，这对于基于物理的动作游戏非常重要。\n\
    \n另一种检测碰撞的方式是使用基于瓦片的方法。**基于瓦片的碰撞**系统不使用几何学来检测碰撞。它所做的只是读取精灵在数组中的索引号。如果某个精灵位于数组地图中已被另一个精灵占据的位置，则发生碰撞。例如，如果一个精灵在地图上的位置与墙壁相同，那么你就知道该精灵碰到了墙壁。然后你可以设置某种碰撞反应，比如阻止精灵移动。\n\
    \n###### 注意\n基于瓦片的碰撞是一种**宽阶段碰撞**，你将在第 6 章中了解更多相关信息。\n\n基于瓦片碰撞的一大优势是，你不必检查每个对象是否与其他所有对象发生碰撞，也无需进行任何几何计算。相反，你只需要读取一个数组。这使得它在\
    \ CPU 效率上远高于窄阶段碰撞测试。更重要的是，你可以为不同类型的事物（如“墙壁”、“敌人”或“物品”）设置少量通用的碰撞检查。即使地图上有数百个这样的元素，每种类型也只需运行一次碰撞检查。这使得基于瓦片的碰撞非常适合可能包含数百个同类元素的巨大游戏地图。并且由于基于瓦片的碰撞通过读取地图数组工作，你可以利用精灵在地图上的位置及其局部环境信息，用于\
    \ AI 或其他游戏逻辑。\n\n基于瓦片碰撞的缺点是无法提供像素级精度。但事实证明，对于许多或大多数 2D 动作游戏来说，精确的像素级碰撞并非必要。基于瓦片的碰撞有一种独特“手感”：坚实、可预测，就像在玩一款真正的电子游戏。上世纪\
    \ 70 和 80 年代整个 8 位和 16 位视频游戏革命都建立在基于瓦片的碰撞之上，它至今仍是你需要了解的最重要的视频游戏碰撞技术。\n\n######\
    \ 注意\n既想要像素级精度，又想要瓦片级效率？你可以先使用基于瓦片的方法检查碰撞，兼得两者之长。然后，如果检测到一般性碰撞，再使用第二次窄阶段测试来获得进一步的像素级精度。你将在第\
    \ 6 章中找到具体实现方法。\n\n在本章中，你将通过一些经典的迷宫游戏示例，学习基于瓦片碰撞的基础知识。你将有机会了解如何使用瓦片编辑器构建一个平面 2D\
    \ 视频游戏环境，以及如何使用地图数组分析该环境。我们还将为基于瓦片的游戏构建一个通用碰撞函数。最后，我们将把所有这些新技能应用到第 2 章的幻想 RPG\
    \ 游戏原型中。\n\n## 理解基于瓦片的碰撞\n\n以下是进行基于瓦片碰撞所需了解的基础知识。在开始之前，你的精灵需要一个新的属性，名为 `index`：\n\
    \n```\nplayerSprite.index \n```\n\n`index` 只是一个数字，用于指示精灵在地图数组中的位置。\n\n要找到这个数字，你需要将精灵的中心\
    \ x 和 y 屏幕位置转换为其对应的数组索引号。下面是一个通用的 `getIndex` 函数，你可以用来完成这项工作：\n\n```\ngetIndex(x,\
    \ y, tilewidth, tileheight, mapWidthInTiles) {\n\n  //将像素坐标转换为地图索引坐标         \
    \   \n  let index = {};\n  index.x = Math.floor(x / tilewidth);\n  index.y = Math.floor(y\
    \ / tileheight);\n\n  //返回索引号            \n  return index.x + (index.y * mapWidthInTiles);\n\
    };\n```\n\n下一步是找出游戏世界中可能位于同一位置的其他事物。例如，假设你有一个包含敌人位置的地图数组。你可以将其命名为 `enemyMapArray`。\n\
    \n```\nenemyMapArray = [0, 0, 0, 5, 0, 0, 5, 0, /*...*/];\n```\n\n任何有敌人的位置都用数字“5”表示。任何没有敌人的位置都用“0”表示。这些数字称为**网格索引**\
    \ ID 号，或简称为 **gid**。\n\n你可以像这样找出 `playerSprite` 所在位置的 gid：\n\n```\ngid = enemyMapArray[playerSprite.index];\n\
    ```\n\n如果这个 gid 值是“5”，那么你就知道 `playerSprite` 与某个敌人位于同一位置。碰撞发生了！\n\n```\nif (gid\
    \ === 5) {\n\n    //碰撞！            \n}\n```\n\n你现在知道 `playerSprite` 撞上了一个敌人。但具体是哪一个呢？\n\
    \n要弄清楚这一点，你的游戏需要一个数组来存储对所有敌人精灵的引用：\n\n```\nenemySprites = [enemySprite1, enemySprite2,\
    \ enemySprite3, /*...*/ ];\n```\n\n这些精灵中的每一个也需要一个 `index` 属性，用于指示它们在 `enemyMapArray`\
    \ 中的位置：\n\n```\nenemySprite1.index = 52;\nenemySprite2.index = 3;\nenemySprite3.index\
    \ = 108;\n//...\n```\n\n要找到玩家位置处的敌人精灵，请遍历 `enemySprites` 数组，找到与 `playerSprite`\
    \ 具有相同 `index` 编号的那个。那就是 `playerSprite` 正在碰撞的敌人。\n\n```\nif (gid === 5) {\n  enemySprites.some(enemy\
    \ => {\n    if (playerSprite.index === enemy.index) {\n\n      //你找到了碰撞到的敌人精灵！\
    \            \n    }\n  });\n}\n```\n\n以上就是基于瓦片碰撞的基础知识，接下来我们将了解如何在游戏中实现它们。\n\n\
    ## 收集物品\n\n让我们看一个非常实际的例子来演示这一点。运行 `simpleCollision.html` 文件，如图 3-1 所示，使用键盘方向键帮助外星人角色收集炸弹。每次外星人收集到一个炸弹，该炸弹就会从地图上消失。消息输出了外星人在屏幕上的\
    \ x 和 y 位置，以及其当前的地图索引号。\n\n![A346816_1_En_3_Fig1_HTML.jpg](img/A346816_1_En_3_Fig1_HTML.jpg)\n\
    \n###### 图 3-1. 使用基于瓦片碰撞的物品收集\n\n### 设计游戏世界\n\n在第 2 章中，你学习了如何使用瓦片编辑器快速设计游戏世界。本章中的所有示例游戏原型我都使用了相同的方法制作。我使用了三个图层：`backgroundLayer`（背景层）、`bombLayer`（炸弹层）和\
    \ `alienLayer`（外星人层），如图 3-2 所示。\n\n![A346816_1_En_3_Fig2_HTML.jpg](img/A346816_1_En_3_Fig2_HTML.jpg)\n\
    \n###### 图 3-2. 三个地图图层\n\n瓦片集中的外星人和炸弹图片都被赋予了名称属性值：“alien”和“bomb”，如图 3-3 所示。这将使我们稍后能够在游戏代码中轻松地使用\
    \ `world.getObject`（针对单个对象）和 `world.getObjects`（针对对象数组）来引用它们，正如你在前一章所学的那样。\n\n\
    ![A346816_1_En_3_Fig3_HTML.jpg](img/A346816_1_En_3_Fig3_HTML.jpg)\n\n###### 图\
    \ 3-3. 为外星人和炸弹图片命名\n"
- fmt: "### Initializing the Game World\n\nThe game code loads the tileset image and\
    \ also the JSON file produced by Tiled Editor. The `setup` function creates the\
    \ world using `makeTiledWorld`.\n\n```\nworld = g.makeTiledWorld(\n  \"maps/simpleCollision.json\"\
    ,\n  \"images/timeBombPanic.png\"\n);\n```\n\nThis plots the sprites and layers\
    \ on the canvas. Anything in Tiled Editor that we assigned a `name` property is\
    \ accessible in the `world.objects` array. We can get references to these objects\
    \ by name by using `world.getObject` (for single objects) or `world.getObjects`\
    \ (with an “s,” for an array of objects). Here’s how to get a reference to the\
    \ alien sprite.\n\n```\nalien = world.getObject(\"alien\");\n```\n\nOur game also\
    \ needs to reference the bomb layer so that we can access its `data` array.\n\n\
    ```\nbombLayer = world.getObject(\"bombLayer\");\nbombMapArray = bombLayer.data;\n\
    ```\n\n`bombLayer` is now a container that contains all the bombs as child sprites.\
    \ `bombMapArray` is now a useful array that tells use the grid positions of all\
    \ the bombs in the world. (Bombs in the array will have a `gid` number of `5`).\n\
    \nWe also need an array of all the bomb sprites, so we can grab them from the\
    \ world like this:\n\n```\nbombSprites = world.getObjects(\"bomb\");\n```\n\n\
    `world.getObjects` searches through the world’s `objects` array and finds anything\
    \ with the `name` property `\"bomb\"`. In this example, `\"bomb\"` matches all\
    \ 11 bomb sprites in the world. `bombSprites` is now an array that contains references\
    \ to each of these sprites.\n\nNow let’s find out how to use the bomb map data\
    \ to check for collisions.\n\n### Understanding the Bomb Map\n\nThe `bombMapArray`\
    \ is a useful array of numbers that matches the position of the bomb sprites on\
    \ the screen. You can see this illustrated in Figure [3-4](#A346816_1_En_3_Chapter.xhtml#Fig4).\
    \ Each `\"5\"` is a bomb, and each `\"0\"` is an empty cell.\n\n![A346816_1_En_3_Fig4_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig4_HTML.gif)\n\
    \n###### Figure 3-4. An array of bombs that matches the bomb layer in Tiled Editor\n\
    \nWhen the bomb sprites are created, each new sprite is given its own `index`\
    \ property. The `index` property stores the bomb’s initial position in this array.\n\
    \nWe need to know whether the alien character is in the same location as a bomb\
    \ on the map. To do this we have to convert the alien’s center `x` and `y` screen\
    \ coordinates to its matching array index number. We can do this with the help\
    \ of the `getIndex` function.\n\n```\nalien.index = getIndex(\n  alien.centerX,\
    \ alien.centerY,\n  world.tilewidth, world.tileheight, world.widthInTiles\n);\n\
    ```\n\nTo figure out if the alien is touching one of the bombs, check to see if\
    \ the alien’s index number matches a bomb `gid` number (`\"5\"`) in the map of\
    \ bombs.\n\n```\n//Find out if the alien's position in the bomb array matches\
    \ a bomb gid number                  \nif (bombMapArray[alien.index] === 5) {\n\
    \n  //If it does, filter through the bomb sprites and find the one           \
    \   \n  //that matches the alien's position              \n  bombSprites = bombSprites.filter(bomb\
    \ => {\n\n    //Does the bomb sprite have the same index number as the alien?\
    \              \n    if (bomb.index === alien.index) {\n\n      //If it does,\
    \ remove the bomb from the              \n      //`bombMapArray` by setting its\
    \ gid to `0`              \n      bombMapArray[bomb.index] = 0;\n\n      //Remove\
    \ the bomb sprite from its container group              \n      g.remove(bomb);\n\
    \n      //Filter the bomb out of the `bombSprites` array              \n     \
    \ return false;\n    } else {\n\n      //Keep the bomb in the `bombSprites` array\
    \ if it doesn't match              \n      return true;\n    }\n  });\n}\n```\n\
    \nYou can see that if the alien and a bomb share the same index number, they must\
    \ be occupying the same map location. In that case, the bomb is erased from the\
    \ level’s bomb map by setting the `gid` number for that location to zero.\n\n\
    ```\nbombMapArray[bomb.index] = 0;\n```\n\nThe bomb sprite is then removed from\
    \ the game using a function called `remove`.\n\n```\ng.remove(bomb);\n```\n\n\
    The game code is actually maintaining a live map of all the bombs in the game.\
    \ Play the game, pick up a few bombs, and check the level’s `bombMapArray`, which\
    \ you see output in the console. You’ll notice that each time a bomb is picked\
    \ up, the cell’s `gid` value is set to `\"0\"`. The bombs were erased from the\
    \ map. Figure [3-5](#A346816_1_En_3_Chapter.xhtml#Fig5) shows what the map’s `bombMapArray`\
    \ looks like after a few of the bombs have been picked up. You can see that it’s\
    \ a perfect match with the location of the bombs on the screen.\n\n![A346816_1_En_3_Fig5_HTML.gif](OEBPS/Images/A346816_1_En_3_Fig5_HTML.gif)\n\
    \n###### Figure 3-5. When a bomb is picked up, its gid in the map gid number is\
    \ set to zero\n\nHaving this kind of data updated in an array is useful for doing\
    \ all sorts of other game logic analysis, as you’ll see ahead.\n\n### Moving the\
    \ Alien in Alignment with the Grid\n\nBefore we continue our discussion of tile-based\
    \ collision, let’s quickly take look at how the alien character’s movement system\
    \ works. Like many maze game characters, the alien moves in exact alignment with\
    \ the map’s grid cells. That means that when you press a key to change its direction,\
    \ the alien won’t move in the new direction until it’s entered a new row or column\
    \ in the grid. This ensures that it will cleanly transition into new rows and\
    \ columns. It helps keep your collision detection system simple and dependable.\n\
    \nHow can you figure out if a game character is exactly aligned to a map grid\
    \ cell? By checking to see if the sprite’s `x` and `y` screen coordinates are\
    \ evenly divisible by the width and height of the map’s tiles. Here’s the classic\
    \ snippet of code that checks for this.\n\n```\nif(Math.floor(sprite.x) % world.tilewidth\
    \ === 0\n&& Math.floor(sprite.y) % world.tilehieght === 0) {\n\n  //Yes, the sprite\
    \ is aligned to the map’s rows and columns              \n}\n```\n\nYou also need\
    \ to ensure that the sprite has a velocity that’s evenly divisible by the `tilewidth`\
    \ and `tileheight`. That ensures the sprite will actually have pixel positions\
    \ that allow for the above check to become true. What this means is that if your\
    \ tile width and height is `64`, your sprite’s velocity must be a number that\
    \ divides evenly into `64`: `1`, `2`, `4`, `8`, `16`, or `32`. If the sprite has\
    \ velocities like `5`, `7`, or `11`, they’ll never divide evenly into `64`, and\
    \ so the sprite will never become exactly aligned to the maps’ rows or columns.\n\
    \nHere’s how this works in this example. The `setup` function creates the keyboard\
    \ key object that responds to arrow keypresses. A property called `direction`\
    \ is then created on the alien, and the keypress actions change the value of that\
    \ `direction`.\n\n```\n//Create the keyboard objects                  \nleftArrow\
    \ = g.keyboard(37);\nupArrow = g.keyboard(38);\nrightArrow = g.keyboard(39);\n\
    downArrow = g.keyboard(40);\n\n//Create a `direction` property on the alien  \
    \                \nalien.direction = \"\";\n\n//Assign key `press` actions that\
    \ change the alien’s `direction`\nleftArrow.press = () => alien.direction = \"\
    left\";\nupArrow.press = () => alien.direction = \"up\";\nrightArrow.press = ()\
    \ => alien.direction = \"right\";\ndownArrow.press = () => alien.direction = \"\
    down\";\n```\n\nWhen any of the arrow keys are pressed, alien’s `direction` will\
    \ be changed to: `\"up\"`, `\"down\"`, `\"left\"`, or `\"right\"`. The game loop\
    \ checks this at each frame, and changes the alien’s velocity accordingly:\n\n\
    ```\nif(Math.floor(alien.x) % world.tilewidth === 0\n&& Math.floor(alien.y) %\
    \ world.tileheight === 0) {\n  switch (alien.direction) {\n    case \"up\":\n\
    \      alien.vy = -4;\n      alien.vx = 0;\n      break;\n    case \"down\":\n\
    \      alien.vy = 4;\n      alien.vx = 0;\n      break;\n    case \"left\":\n\
    \      alien.vx = -4;\n      alien.vy = 0;\n      break;\n    case \"right\":\n\
    \      alien.vx = 4;\n      alien.vy = 0;\n      break;\n  }\n}\n```\n\nThe game\
    \ loop then moves the alien and keeps it inside the canvas boundary using a custom\
    \ function called `contain`.\n\n```\nalien.x += alien.vx;\nalien.y += alien.vy;\n\
    g.contain(alien, g.stage);\n```"
