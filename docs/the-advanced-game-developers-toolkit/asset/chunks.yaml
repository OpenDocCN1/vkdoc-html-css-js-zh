  trans: "\n### 寻找有效方向\n\n`validDirections`函数分析精灵当前所处的地图环境，并返回一个字符串数组，其中包含精灵可以移动的所有有效方向。\n\
    \n```\nmonster.validDirections = validDirections(\n  monster,       //精灵对象   \
    \         \n  wallMapArray,  //瓦片地图数组            \n  0,             //代表空瓦片的 gid\
    \ 值            \n  world          //世界对象。它需要以下属性：            \n              \
    \   //`tilewidth`、`tileheight`和`widthInTiles`            \n);\n```\n\n`validDirections`返回的数组可以包含以下五个字符串值中的任意几个：`\"\
    up\"`、`\"down\"`、`\"left\"`、`\"right\"`或`\"none\"`。其判定方式相当有趣，让我们先看一下整个`validDirections`函数，然后我会逐步讲解它的工作原理。\n\
    \n```\nfunction validDirections(sprite, mapArray, validGid, world) {\n\n  //获取精灵当前在地图数组中的索引位置编号\
    \              \n  let index = g.getIndex(\n    sprite.x,\n    sprite.y,\n   \
    \ world.tilewidth,\n    world.tileheight,\n    world.widthInTiles\n  );\n\n  //一个包含精灵上、下、左、右四个方向瓦片单元格索引编号的数组\
    \              \n  let surroundingCrossCells = (index, widthInTiles) => {\n  \
    \  return [\n      index - widthInTiles,  //上方的单元格              \n      index\
    \ - 1,             //左侧的单元格              \n      index + 1,             //右侧的单元格\
    \              \n      index + widthInTiles,  //下方的单元格              \n    ];\n\
    \  };\n\n  //获取精灵上、右、左、下四个方向单元格的索引位置编号              \n  let surroundingIndexNumbers\
    \ = surroundingCrossCells(index, world.widthInTiles);\n\n  //查找与周围索引编号相匹配的所有瓦片\
    \ gid 编号              \n  let surroundingTileGids = surroundingIndexNumbers.map(index\
    \ => {\n    return mapArray[index];\n  });\n\n  //`directionList`是一个包含四个字符串值的数组，这些值可以是\
    \              \n  //\"up\"、\"left\"、\"right\"、\"down\"或\"none\"，具体取决于       \
    \       \n  //对应方向是否存在具有有效 gid 的单元格              \n  let directionList = surroundingTileGids.map((gid,\
    \ i) => {\n\n    //可能的方向              \n    let possibleDirections = [\"up\",\
    \ \"left\", \"right\", \"down\"];\n\n    //如果方向有效，则选择该方向对应的字符串标识符            \
    \  \n    //否则返回\"none\"              \n    if (gid === validGid) {\n      return\
    \ possibleDirections[i];\n    } else {\n      return \"none\";\n    }\n  });\n\
    \n  //我们不需要方向列表中的\"none\"，所以              \n  //把它过滤掉（它只是一个占位符）              \n\
    \  let filteredDirectionList = directionList.filter(direction => direction !=\
    \ \"none\");\n\n  //返回过滤后的有效方向列表              \n  return filteredDirectionList;\n\
    }\n```\n\n现在，让我们深入了解它的实际工作原理！\n\n### 精灵周围的瓦片\n\n`validDirections`函数做的第一件事是找出哪些地图瓦片位于精灵周围。一个名为`surroundingCrossCells`的函数利用精灵在地图数组中的索引编号来解决这个问题。它返回一个包含四个地图索引编号的数组，这些编号分别代表精灵上方、左侧、右侧和下方的单元格。\n\
    \n```\nlet surroundingCrossCells = (index, widthInTiles) => {\n  return [\n  \
    \  index - widthInTiles,  //上方的单元格                \n    index - 1,           \
    \  //左侧的单元格                \n    index + 1,             //右侧的单元格             \
    \   \n    index + widthInTiles,  //下方的单元格                \n  ];\n};\n\nlet surroundingIndexNumbers\
    \ =\n  surroundingCrossCells(index, world.widthInTiles);\n```\n\n图 5-2 展示了这些单元格相对于精灵的位置，以及它们对应的地图数组索引编号。在此示例中，迷宫的每一行有\
    \ 11 个单元格，怪物精灵的位置索引编号为 38。精灵周围的地图数组索引编号从顶部开始顺时针方向依次为 27、39、49 和 37。\n\n![A346816_1_En_5_Fig2_HTML.jpg](img/A346816_1_En_5_Fig2_HTML.jpg)\n\
    \n###### 图 5-2. 查找精灵周围的单元格\n\n现在我们有了一个名为`surroundingIndexNumbers`的数组，它告诉我们精灵周围单元格的索引编号。但这还不够；我们还需要知道这些单元格的\
    \ gid 值，这样才能了解它们包含哪种类型的瓦片。请记住，我们希望允许精灵移动到空瓦片，但阻止它移动到墙壁瓦片。因此，下一步是利用这些索引编号找出这些位置具体是哪些瓦片精灵。让我们将`surroundingIndexNumbers`映射到一个新数组，该数组告诉我们这些单元格的实际\
    \ gid 编号。方法如下：\n\n```\nlet surroundingTileGids = surroundingIndexNumbers.map(index\
    \ => {\n  return mapArray[index];\n});\n```\n\n例如，图 5-2 中的索引编号 27、39、49 和 35 现在会被映射到一个包含以下\
    \ gid 值的新数组：0、0、2 和 0。数字 0 代表空单元格，数字 2 代表墙壁。图 5-3 说明了这一点。\n\n![A346816_1_En_5_Fig3_HTML.jpg](img/A346816_1_En_5_Fig3_HTML.jpg)\n\
    \n###### 图 5-3. 通过获取周围单元格的 gid 编号来查明其中包含哪些类型的瓦片\n\n### 有效方向\n\n下一步是为精灵可以移动的四个可能方向分别赋予方向名称（字符串形式）。方向名称可以是以下任意一种：`\"\
    up\"`、`\"left\"`、`\"right\"`、`\"down\"`或`\"none\"`。以下代码片段将我们的`surroundingTileGids`数组映射到一个名为`directionList`的新数组，其中包含这些方向字符串。\n\
    \n```\nlet directionList = surroundingTileGids.map((gid, i) => {\n\n  //可能的方向\
    \                \n  let possibleDirections = [\"up\", \"left\", \"right\", \"\
    down\"];\n\n  //如果方向有效，则选择该方向对应的字符串标识符                \n  //否则返回\"none\"     \
    \           \n  if (gid === validGid) {\n    return possibleDirections[i];\n \
    \ } else {\n    return \"none\";\n  }\n});\n```\n\n任何无效的 gid 都会被赋予方向名称`\"none\"\
    `。图 5-4 展示了`directionList`函数生成的最终数组。\n\n![A346816_1_En_5_Fig4_HTML.jpg](img/A346816_1_En_5_Fig4_HTML.jpg)\n\
    \n###### 图 5-4. 查找方向名称\n\n我们实际上不需要`\"none\"`这个值，所以把它过滤掉（它只是充当占位符）：\n\n```\nlet\
    \ filteredDirectionList = directionList.filter(direction => {\n  return direction\
    \ != \"none\"\n});\n```\n\n现在，`filteredDirectionList`就是我们的最终数组，其中包含了精灵可以移动的所有有效方向：\n\
    \n```\n[\"up\", \"left\", \"right\"]\n```\n\n（或者，如果精灵四面完全被困住，这个数组将是空的——但我们稍后会讲到这一点！）\n\
    \n这个数组由`validDirections`函数返回，这完成了寻路过程的第一步。\n\n### 怪物能否改变方向？\n\n实际上，地图上只有某些特定位置怪物才应该改变方向。\n\
    \n*   当它们处于通道交叉口时。\n*   如果它们处于死胡同（尽头路）时。\n*   或者如果它们被四面墙壁困住（这种情况下它们应该完全停止移动）。\n\
    \n图 5-5 中的 X 标记出了我们使用的迷宫中这三种地图条件所在的位置。\n\n![A346816_1_En_5_Fig5_HTML.jpg](img/A346816_1_En_5_Fig5_HTML.jpg)\n"
- fmt: "###### Figure 5-5. Find the direction names\n\nIf the monsters are not at\
    \ a map location that matches one of these conditions, they’ll just continue on\
    \ in their current directions.\n\nIt’s easy to figure these out what the monster’s\
    \ current map location type is. If the there are no elements in the `validDirections`\
    \ array, then you know that the sprite is trapped.\n\n```\nlet trapped = validDirections.length\
    \ === 0;\n```\n\nYou know that a sprite is in a cul-de-sac if there’s just one\
    \ element in the `validDirections` array.\n\n```\nlet inCulDeSac = validDirections.length\
    \ === 1;\n```\n\nThose were easy, but now how do we know if a sprite is at a passage\
    \ intersection? First, ask yourself, “What is a passage intersection?” Take a\
    \ close look at Figure [5-5](#A346816_1_En_5_Chapter.xhtml#Fig5), and ask yourself\
    \ what values might be in the `validDirections` array if a sprite were at any\
    \ of the map positions marked with an X. Any ideas? Yes, that’s right! A passage\
    \ intersection will always contain the values “left” or “right” *and* “up” or\
    \ “down.” Figure [5-6](#A346816_1_En_5_Chapter.xhtml#Fig6) illustrates this.\n\
    \n![A346816_1_En_5_Fig6_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig6_HTML.jpg)\n\
    \n###### Figure 5-6. Passage intersections always contain a left/right value and\
    \ an up/down value\n\nHere’s how you can express this in code:\n\n```\nlet up\
    \ = validDirections.find(x => x === \"up\"),\n    down = validDirections.find(x\
    \ => x === \"down\"),\n    left = validDirections.find(x => x === \"left\"),\n\
    \    right = validDirections.find(x => x === \"right\"),\n    atIntersection =\
    \ (up || down) && (left || right);\n```\n\nIf `atIntersection` is `true`, you\
    \ know that the sprite is at one of the passage intersections marked by an X.\
    \ Easy!\n\nWe now know how to tell if a sprite is trapped, in a cul-de-sac, or\
    \ at a passage intersection. So let’s wrap all this code into a bigger function\
    \ called `canChangeDirection`. It will return `true` if any of these conditions\
    \ are true, or `false` if they aren’t.\n\n```\nfunction canChangeDirection(validDirections\
    \ = []) {\n\n  //Is the sprite in a dead-end (cul de sac.) This will be true if\
    \ there's only                \n  //one element in the `validDirections` array\
    \                \n  let inCulDeSac = validDirections.length === 1;\n\n  //Is\
    \ the sprite trapped? This will be true if there are no elements in          \
    \      \n  //the `validDirections` array                \n  let trapped = validDirections.length\
    \ === 0;\n\n  //Is the sprite in a passage? This will be `true` if the the sprite\
    \                \n  //is at a location that contain the values              \
    \  \n  //\"left\" or \"right\" and \"up\" or \"down\"                \n  let up\
    \ = validDirections.find(x => x === \"up\"),\n      down = validDirections.find(x\
    \ => x === \"down\"),\n      left = validDirections.find(x => x === \"left\"),\n\
    \      right = validDirections.find(x => x === \"right\"),\n      atIntersection\
    \ = (up || down) && (left || right);\n\n  //Return `true` if the sprite can change\
    \ direction or `false` if it can't                \n  return trapped || atIntersection\
    \ || inCulDeSac;\n}\n```\n\nNow that we have a way to tell if a sprite is at a\
    \ map location where it can change direction, let’s find out how to give it a\
    \ new random direction.\n\n#### Choosing a Random Direction\n\nNow that we know\
    \ what the sprite’s valid directions are, all we have to do is pick one at random.\
    \ The `randomDirection` function randomly returns a single string from the `validDirections`\
    \ array: “up,” “left,” “right,” or “down.” If there are no valid directions it\
    \ means the sprite is trapped on all sides, and the function returns the string\
    \ “trapped.” Here’s the `randomDirection` function that does this:\n\n```\nfunction\
    \ randomDirection(sprite, validDirections = []) {\n\n  //The `randomInt` helper\
    \ function returns a random integer between a minimum                \n  //and\
    \ maximum value                \n  let randomInt = (min, max) => {\n    return\
    \ Math.floor(Math.random() * (max - min + 1)) + min;\n  };\n\n  //Is the sprite\
    \ trapped?                \n  let trapped = validDirections.length === 0;\n\n\
    \  //If the sprite isn't trapped, randomly choose one of the valid           \
    \     \n  //directions. Otherwise, return the string \"trapped\"             \
    \   \n  if (!trapped) {\n    return validDirections[randomInt(0, validDirections.length\
    \ - 1)];\n  } else {\n    return \"trapped\"\n  }\n}\n```\n\n#### Converting the\
    \ Direction String to a Velocity Number\n\nWe now know which direction the sprite\
    \ should move in. But, for that information to be useful to move a sprite, we\
    \ need to convert the direction string into a number that represents the sprite’s\
    \ velocity. A function called `directionToVelocity` does that job: it returns\
    \ an object with `vx` and `vy` properties that correspond to the direction the\
    \ sprite should move.\n\n```\nfunction directionToVelocity(direction = \"\", speed\
    \ = 0) {\n\n  switch (direction) {\n    case \"up\":\n      return {\n       \
    \ vy: -speed,\n        vx: 0\n      }\n      break;\n    case \"down\":\n    \
    \  return {\n        vy: speed,\n        vx: 0\n      };\n      break;\n    case\
    \ \"left\":\n      return {\n        vx: -speed,\n        vy: 0\n      };\n  \
    \    break;\n    case \"right\":\n      return {\n        vx: speed,\n       \
    \ vy: 0\n      };\n      break;\n    default:\n      return {\n        vx: 0,\n\
    \        vy: 0\n      };\n  }\n};\n```\n\nIf the monster’s direction is “trapped,”\
    \ the default case will be triggered and `vx` and `vy` values, which represent\
    \ the monster’s speed, will be zero.\n\nTo make the sprite move, update the sprite’s\
    \ velocity with these values:\n\n```\nlet velocity = directionToVelocity(monster.direction,\
    \ monster.speed);\nmonster.vx = velocity.vx;\nmonster.vy = velocity.vy;\n```\n\
    \nAnd then apply them to the sprite’s current position:\n\n```\nmonster.x += monster.vx;\n\
    monster.y += monster.vy;\n```\n\nAnd that’s how to make a monster randomly move\
    \ around a maze!\n\n## Hunting the Alien\n\nRandomly moving monsters are a good\
    \ start, but for a more challenging game you’ll want your monsters to actively\
    \ seek out and hunt the player character. Run the `closestDirection.html` file\
    \ in this chapter’s source files for an interactive example of just such a system,\
    \ illustrated in Figure [5-7](#A346816_1_En_5_Chapter.xhtml#Fig7).\n\n![A346816_1_En_5_Fig7_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig7_HTML.jpg)\n\
    \n###### Figure 5-7. The monsters always choose the closest direction to the player\
    \ character\n\nNo matter where they are in the maze, the monsters will always\
    \ choose to move in a direction that takes them closer to the player character.\n\
    \n### Calculating the Vector\n\nTo make this work, you need to know which of the\
    \ monsters’ four possible directions are closest to the alien. The first step\
    \ is to draw a *vector* between the center points of a monster and the alien.\
    \ A vector is just an invisible mathematical line that, among its many uses, can\
    \ be used to figure out the distance and angle between two sprites. A vector is\
    \ represented by two values, `vx` and `vy`, and you can calculate a vector between\
    \ two sprites like this:\n\n```\nlet vx = spriteTwo.centerX - spriteOne.centerX,\n\
    \    vy = spriteTwo.centerY - spriteOne.centerY;\n```\n\n`vx` tells us the distance\
    \ between the objects on the X axis. `vy` tells us the distance between the objects\
    \ on the Y axis. The `vx` and `vy` variables together describe a vector between\
    \ the objects.\n\nThe vector is just a mathematical representation of a line –\
    \ you don’t actually see it displayed on the screen. But, if you could see it,\
    \ it might look something like the black diagonal line that runs between the centers\
    \ of the two sprites in Figure [5-8](#A346816_1_En_5_Chapter.xhtml#Fig8).\n\n\
    ![A346816_1_En_5_Fig8_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig8_HTML.jpg)\n\n\
    ###### Figure 5-8. A vector can help you figure out the distance and angle between\
    \ two sprites\n\nTo make the monster hunt the alien, we have to move it in the\
    \ horizontal or vertical direction with the *greatest amount of distance* between\
    \ it and the alien. Why is that? Take a look at Figure [5-9](#A346816_1_En_5_Chapter.xhtml#Fig9).\n\
    \n![A346816_1_En_5_Fig9_HTML.jpg](OEBPS/Images/A346816_1_En_5_Fig9_HTML.jpg)"
