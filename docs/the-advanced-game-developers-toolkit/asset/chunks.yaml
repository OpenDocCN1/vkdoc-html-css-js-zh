  trans: "\n###### 图 6-12：将父节点的 G 成本（10）加上向上移动一个节点的成本（10），得到新的 G 成本（20）\n\n如果发现新成本更低，A*\
    \ 会将节点的父节点更改为当前父节点：\n\n```\nif (newG < oldG) {\n  surroundingNode.parent = currentParent;\n\
    } else {\n  don't change the surrounding node's parent\n}\n```\n\n但如果新的 G 成本更高，则节点的父节点不会改变。本例正是这种情况。它将保留第一步中分配的父节点，即起始节点。我们正在检查的当前父节点将遭到冷落。\n\
    \n这一点非常重要，因为 A* 通过将节点与其父节点链接在一起形成路径，就像一条链条。\n\nA* 会对所有其他相邻节点执行同样的检查，并根据它们是否需要经过新的父节点来计算新的\
    \ G 成本，如图 6-13 所示。\n\n![A346816_1_En_6_Fig13_HTML.jpg](img/A346816_1_En_6_Fig13_HTML.jpg)\n\
    \n###### 图 6-13：检查通过当前父节点路由路径是否会降低其他节点的 G 成本。结果显示不会\n\n从图 6-13 可以看出，所有节点经过当前父节点的\
    \ G 成本都会更高。这意味着没有一个节点会将其父节点改为当前父节点。当前父节点彻底出局了！它没有子节点，因此肯定不会成为最短路径的一部分。\n\n但 A*\
    \ 仍然需要确定接下来测试哪个节点。它会忽略墙壁节点和上一个父节点。它会选择 F 成本最低的下一个节点作为新的父节点，如图 6-14 所示。\n\n![A346816_1_En_6_Fig14_HTML.jpg](img/A346816_1_En_6_Fig14_HTML.jpg)\n\
    \n###### 图 6-14：F 成本最低的相邻节点成为新的父节点\n\n但如果某些节点成本相同会怎样？从图 6-13 可以看出，父节点正上方和正下方的节点并列第一，两者的低分都是\
    \ 54。在这种情况下，A* 会选择在循环中首先被检查到的节点。如果碰巧选错了，后续的检查会进行纠正。但纯属偶然，这次第一个具有最低分数的节点恰好也是更好的选择。它被选为新的父节点，A*\
    \ 继续进行检查。\n\n也很可能不止一条最短路径。A* 构建的路径取决于它如何选择成本相同的节点。\n\n我们已经测试了两个节点，并选定了第三个节点，如图\
    \ 6-15 所示。\n\n![A346816_1_En_6_Fig15_HTML.jpg](img/A346816_1_En_6_Fig15_HTML.jpg)\n\
    \n###### 图 6-15：三个节点是路径上的候选节点，但谁会最终入选？\n\n但其中只有两个节点属于路径。我们怎么知道的？因为右上角的节点将起始节点指定为其父节点。这种关系将两个节点链接在一起，如图\
    \ 6-16 所示。它构成了路径中的前两个步骤。\n\n![A346816_1_En_6_Fig16_HTML.jpg](img/A346816_1_En_6_Fig16_HTML.jpg)\n\
    \n###### 图 6-16：起始节点是右上角节点的父节点。这种关系将节点链接在一起\n\n### 通过父节点链接节点\n\n接着，A* 会继续遵循同样的逻辑，直到到达目标节点\
    \ B 点。在一个非常大的游戏世界中，这可能需要检查数百个节点。\n\n当 A* 最终构建出路径时，它会从父节点到父节点进行追踪，以将起点和终点连接起来。如图\
    \ 6-17 所示。\n\n![A346816_1_En_6_Fig17_HTML.jpg](img/A346816_1_En_6_Fig17_HTML.jpg)\n\
    \n###### 图 6-17：最终路径中的每个节点都引用其父节点\n\n当 A* 到达目的地 B 点时，它会停止检查。然后 A* 只需要从 B 点开始，顺着父节点逆向工作，即可构建出路径。A*\
    \ 算法会生成一个数组，告诉你从 A 点到 B 点需要经过哪些节点才能找到最短路径。\n\n现在你已理解其原理，让我们来看看实际的 JavaScript 代码。\n\
    \n## 代码中的 A*\n\n到现在应该相当明显了，节点在 A* 的世界里是相当重要的东西。每个节点需要存储相当多的信息：\n\n- 它的位置（在网格中的行和列）。\n\
    - 它的 G、H 和 F 成本。\n- 它的父节点。\n\n因此，创建一个节点对象来存储这些信息是合情合理的。\n\n### 创建节点图\n\n处理节点的第一步是创建一个所谓的**节点图**。节点图是一个二维数组，与游戏的地图迷宫完全匹配。然而，节点图的每个单元格都包含一个节点对象。这些节点对象将存储我们需要的重要节点属性和值。\n\
    \n下面是一个名为 `nodes` 的简单函数，它为地图数组中的每个单元格返回一个节点对象数组。\n\n```\nlet nodes = (mapArray,\
    \ mapWidthInTiles) => {\n  return mapArray.map((cell, index) => {\n\n    //计算此单元格的行和列\n\
    \    let column = index % mapWidthInTiles;\n    let row = Math.floor(index / mapWidthInTiles);\n\
    \n    //节点对象\n    return node = {\n      f: 0,\n      g: 0,\n      h: 0,\n   \
    \   parent: null,\n      column: column,\n      row: row,\n      index: index\n\
    \    };\n  });\n};\n```\n\n每个节点对象都包含成本属性、对其父节点的引用，以及行列和索引信息，这些信息使我们能够轻松地将节点与其在地图数组中的位置对应起来。你将看到这在\
    \ `shortestPath` 函数中是如何使用的，我们接下来将介绍该函数。\n"
- fmt: "### `shortestPath`函数\n\n我们A*代码的核心是`shortestPath`函数。它返回一个数组，包含从点A到点B的最短路径。以下是调用它的示例，包括要使用的参数。\n\
    \n```\nlet path = shortestPath(\n  getIndex(alien.x, alien.y, 64, 64, 13),   \
    \       // 起始地图索引            \n  getIndex(g.pointer.x, g.pointer.y, 64, 64, 13)),\
    \ // 目标索引            \n  wallMapArray,                                    // 地图数组\
    \            \n  13,                                              // 地图宽度（以瓦片为单位）\
    \            \n  [2, 3],                                          // 障碍物gid数组\
    \            \n  \"manhattan\"                                      // 要使用的启发式函数\
    \            \n);\n```\n\n如你所见，这些参数与我们之前讨论的信息类型相匹配。我们尚未讨论的一项内容是所使用的启发式函数类型。我将在“理解启发式函数”部分解释启发式函数选项及其工作原理。\n\
    \n以下是完整的`shortestPath`函数。除了需要确保所有数据有效的少量额外检查外，它完全按照我之前对A*算法工作原理描述的方式进行路径查找。请通读所有注释，并尝试将代码与之前的描述对应起来。\n\
    \n```\nfunction shortestPath(\n  startIndex,\n  destinationIndex,\n  mapArray,\n\
    \  mapWidthInTiles,\n  obstacleGids = [],\n  heuristic = \"manhattan\"\n) {\n\n\
    // `nodes`函数创建节点对象数组              \n  let nodes = (mapArray, mapWidthInTiles)\
    \ => {\n    return mapArray.map((cell, index) => {\n\n// 计算此单元格的行和列          \
    \    \n      let column = index % mapWidthInTiles;\n      let row = Math.floor(index\
    \ / mapWidthInTiles);\n\n// 节点对象              \n      return node = {\n      \
    \  f: 0,\n        g: 0,\n        h: 0,\n        parent: null,\n        column:\
    \ column,\n        row: row,\n        index: index\n      };\n    });\n  };\n\n\
    // 初始化shortestPath数组              \n  let shortestPath = [];\n\n// 初始化节点映射   \
    \           \n  let nodeMap = nodes(mapArray, mapWidthInTiles);\n\n// 初始化关闭列表和开放列表数组\
    \              \n  let closedList = [];\n  let openList = [];\n\n// 声明直线或斜线移动的“代价”\
    \              \n  let straightCost = 10;\n  let diagonalCost = 14;\n\n// 获取起始节点\
    \              \n  let startNode = nodeMap[startIndex];\n\n// 获取当前中心节点。第一个节点将\
    \              \n  // 与路径的起始位置匹配              \n  let centerNode = startNode;\n\
    \n// 将`centerNode`推入`openList`，因为              \n  // 它是我们将要检查的第一个节点         \
    \     \n  openList.push(centerNode)\n\n// 获取当前目标节点。第一个节点将              \n  //\
    \ 与路径的结束位置匹配              \n  let destinationNode = nodeMap[destinationIndex];\n\
    \n// 所有包围当前地图索引号的节点              \n  let surroundingNodes = (index, mapArray,\
    \ mapWidthInTiles) => {\n\n// 找出所有周围的节点（包括那些可能              \n    // 超出地图边界的节点——我们将在\
    \              \n    // `validSurroundingNodes`函数中过滤掉它们）              \n    let\
    \ allSurroundingNodes = [\n      nodeMap[index - mapWidthInTiles - 1],\n     \
    \ nodeMap[index - mapWidthInTiles],\n      nodeMap[index - mapWidthInTiles + 1],\n\
    \      nodeMap[index - 1],\n      nodeMap[index + 1],\n      nodeMap[index + mapWidthInTiles\
    \ - 1],\n      nodeMap[index + mapWidthInTiles],\n      nodeMap[index + mapWidthInTiles\
    \ + 1]\n    ];\n\n// 可选地排除对角线节点，这通常更适合              \n    // 2D迷宫游戏          \
    \    \n    let crossSurroundingNodes = [\n      nodeMap[index - mapWidthInTiles],\n\
    \      nodeMap[index - 1],\n      nodeMap[index + 1],\n      nodeMap[index + mapWidthInTiles],\n\
    \    ];\n```"
  raw: "### The shortestPath Function\n\nThe heart of our A* code is the shortestPath\
    \ function. It returns an array that contains the shortest path from point A to\
    \ point B. Here’s an example of how to call it, including the arguments to use.\n\
    \n```\n let path = shortestPath(\n  getIndex(alien.x, alien.y, 64, 64, 13),          //The\
    \ start map index            \n  getIndex(g.pointer.x, g.pointer.y, 64, 64, 13)),\
    \ //The destination index            \n  wallMapArray,                                    //The\
    \ map array            \n  13,                                              //Map\
    \ width, in tiles            \n  [2, 3],                                          //Obstacle\
    \ gid array            \n  \"manhattan\"                                      //Heuristic\
    \ to use            \n);\n```\n\nAs you can see, the arguments match the kinds\
    \ of information that we looked at earlier. The one thing we haven’t discussed\
    \ yet is the kind of heuristic to use. I’ll explain the heuristic options and\
    \ how they work in the “Understanding Heuristics” section.\n\nThe following is\
    \ the entire shortestPath function. Apart from a few additional checks that it\
    \ needs to make sure that all the data is valid, it’s doing pathfinding just as\
    \ I explained in the description of how the A* algorithm works. Read through all\
    \ the comments and try to match up the code to the earlier description.\n\n```\n\
    function shortestPath(\n  startIndex,\n  destinationIndex,\n  mapArray,\n  mapWidthInTiles,\n\
      obstacleGids = [],\n  heuristic = \"manhattan\"\n) {\n\n//The `nodes` function\
    \ creates the array of node objects              \n  let nodes = (mapArray, mapWidthInTiles)\
    \ => {\n    return mapArray.map((cell, index) => {\n\n//Figure out the row and\
    \ column of this cell              \n      let column = index % mapWidthInTiles;\n\
          let row = Math.floor(index / mapWidthInTiles);\n\n//The node object    \
    \          \n      return node = {\n        f: 0,\n        g: 0,\n        h: 0,\n\
            parent: null,\n        column: column,\n        row: row,\n        index:\
    \ index\n      };\n    });\n  };\n\n//Initialize the shortestPath array      \
    \        \n  let shortestPath = [];\n\n//Initialize the node map             \
    \ \n  let nodeMap = nodes(mapArray, mapWidthInTiles);\n\n//Initialize the closed\
    \ and open list arrays              \n  let closedList = [];\n  let openList =\
    \ [];\n\n//Declare the \"costs\" of travelling in straight or diagonal lines \
    \             \n  let straightCost = 10;\n  let diagonalCost = 14;\n\n//Get the\
    \ start node              \n  let startNode = nodeMap[startIndex];\n\n//Get the\
    \ current center node. The first one will              \n  //match the path's\
    \ start position              \n  let centerNode = startNode;\n\n//Push the `centerNode`\
    \ into the `openList`, because              \n  //it's the first node that we're\
    \ going to check              \n  openList.push(centerNode)\n\n//Get the current\
    \ destination node. The first one will              \n  //match the path's end\
    \ position              \n  let destinationNode = nodeMap[destinationIndex];\n\
    \n//All the nodes that are surrounding the current map index number          \
    \    \n  let surroundingNodes = (index, mapArray, mapWidthInTiles) => {\n\n//Find\
    \ out what all the surrounding nodes are (including those that              \n\
        //might be beyond the borders of the map – we’ll filter these out ahead  \
    \            \n    //in the `validSurroundingNodes` function)              \n\
        let allSurroundingNodes = [\n      nodeMap[index - mapWidthInTiles - 1],\n\
          nodeMap[index - mapWidthInTiles],\n      nodeMap[index - mapWidthInTiles\
    \ + 1],\n      nodeMap[index - 1],\n      nodeMap[index + 1],\n      nodeMap[index\
    \ + mapWidthInTiles - 1],\n      nodeMap[index + mapWidthInTiles],\n      nodeMap[index\
    \ + mapWidthInTiles + 1]\n    ];\n\n//Optionally exlude the diagonal nodes, which\
    \ is often perferable              \n    //for 2D maze games              \n    let\
    \ crossSurroundingNodes = [\n      nodeMap[index - mapWidthInTiles],\n      nodeMap[index\
    \ - 1],\n      nodeMap[index + 1],\n      nodeMap[index + mapWidthInTiles],\n\
        ];"
  trans: "\n### `shortestPath`函数\n\n我们 A*代码的核心是`shortestPath`函数。它返回一个数组，包含从点 A 到点\
