    \n## 使用 JSON 数据构建关卡\n\nJSON 数据并不关心我们想用它制作什么样的游戏，也不关心你使用的是什么技术。你可以用同样的数据制作基于 Objective-C、Haxe、Unity\
    \ 或 Elm 的游戏。这意味着你需要编写一个函数来解释这些数据，并决定应如何使用它来构建游戏关卡。如何处理这些数据完全由你决定。\n\n### 决定如何使用数据\n\
    \n从哪里开始？根据你想制作的游戏类型，制定一系列关于如何解释所有这些数据的规则。对于我想制作的奇幻角色扮演游戏，我提出了以下要求：\n\n*   整个游戏世界将包含在一个名为\
    \ `world` 的**容器组**中。“容器组”只是我用来描述包含嵌套子**精灵**的对象的术语。（回忆一下，精灵就是构成游戏世界的交互式图像）。\n\n\
    *   每个图块集层也应该是 `world` 容器内的一个独立组。这里有五个图块集层，这意味着最终会有五个组：`ground`、`obstacles`、`items`、`wallTops`\
    \ 和 `treeTops`。所有这些层都有一个 `name` 属性，我会将该名称属性分配给层组，以便稍后访问。\n\n*   对象层上的任何内容都应作为一个简单的\
    \ JavaScript 对象返回给游戏。之后我可以决定如何使用该对象中的数据。如果需要，我会使用对象的 `name` 属性来访问它。在当前示例中只有一个对象：精灵。\n\
    \n*   层内的所有图像都将被创建为精灵。\n\n*   我需要一种方法来引用我在世界中创建的所有对象。我将添加两个搜索函数，允许我通过名称搜索对象。`world.getObject(\"\
    name\")` 将检索与所查找对象的 name 属性匹配的单个对象。它可以是精灵、层组或数据对象。`world.getObjects(\"elf\", \"\
    obstacles\", \"marmot\")` 返回一个对象数组，其名称与参数中的名称相匹配。\n\n*   为了尽可能保持简单，我将限制每个地图只使用一个图块集。\n\
    \n这是我提出的要求列表，但你的要求可能会根据你所制作的游戏类型以及所需的灵活性而有所不同。\n\n### 游戏代码 API\n\n在我们探讨如何实现这些规则之前，让我们先看看完成后的\
    \ API 会是什么样子。我将能够像这样创建一个新的游戏世界：\n\n```\nlet world = makeTiledWorld(data.json,\
    \ tileset.png);\n```\n\n然后世界将神奇地出现，完全就像我在 Tiled Editor 中设计的那样。如果我想从世界中检索一个层组、精灵或对象，可以这样做：\n\
    \n```\nlet elf = world.getObject(\"elf\");\n```\n\n我可以像这样将一组对象作为一个数组来检索：\n\n```\n\
    let items = world.getObjects(\"heart\", \"skull\", \"marmot\");\n```\n\n如果我有多个精灵共享相同的图块集名称属性，我也可以将它们全部检索到一个数组中。例如，如果我有一个名为\
    \ “wall” 的图块集图像，并且在世界中使用了这个图像 20 次，我可以像这样将所有墙精灵检索到一个数组中：\n\n```\nlet walls = world.getObjects(\"\
    wall\");\n```\n\n这是一个简单的 API，对于大多数类型的游戏来说，它足以提供我所需的灵活性。\n\n那么，如何实现这一切呢？\n\n##\
    \ 编写 `makeTiledWorld` 函数\n\n我可以编写一个名为 `makeTiledWorld` 的函数来完成所有工作。关于代码如何工作的所有细节都包含在注释中，但我将在代码清单之后重点介绍几个重要特性。\n"
- fmt: "###### Note\n\nThis code listing represents how `makeTiledWorld` is implemented\
    \ by the Hexi game engine, and there are a few specific implementation details\
    \ you should know. `Container` and `Sprite` are PixiJS objects. Pixi’s resource\
    \ loader is used to load the JSON file. (Hexi uses PixiJS as its lower-level rendering\
    \ engine and asset loader). The `frame` function is a custom function built into\
    \ the Hexi engine that captures a rectangular sub-image from a single parent image.\
    \ You will need to find equivalents for these details in whatever technology you’re\
    \ using.\n\n```\nmakeTiledWorld(jsonTiledMap, tileset) {\n\n//Get a reference\
    \ to the JSON file            \n  let tiledMap = PIXI.loader.resources[jsonTiledMap].data;\n\
    \n//Create a container group called `world` to contain all the layers, sprites\
    \            \n  //and objects from the `tiledMap`. The `world` object is going\
    \ to be            \n  //returned to the main game program after this `makeTiledWorld`\
    \            \n  //function finishes            \n  let world = new Container();\n\
    \n//Set the width and height of each tile that makes up the map.            \n\
    \  //(The tile size is 32x32 pixels in this example)            \n  world.tileheight\
    \ = tiledMap.tileheight;\n  world.tilewidth = tiledMap.tilewidth;\n\n//Calculate\
    \ the `width` and `height` of the world, in pixels            \n  world.worldWidth\
    \ = tiledMap.width * tiledMap.tilewidth;\n  world.worldHeight = tiledMap.height\
    \ * tiledMap.tileheight;\n\n//Get a reference to the world's height and width\
    \ in            \n  //tiles, in case you need to know this later (you will!) \
    \           \n  world.widthInTiles = tiledMap.width;\n  world.heightInTiles =\
    \ tiledMap.height;\n\n//Create an `objects` array to store references to any \
    \           \n  //named objects in the map. Named objects all have           \
    \ \n  //a `name` property that was assigned in Tiled Editor            \n  world.objects\
    \ = [];\n\n//The optional spacing (padding) around each tile            \n  //This\
    \ is to account for spacing around tiles            \n  //that's commonly used\
    \ with texture atlas tilesets. Set the            \n  //`spacing` property when\
    \ you create a new map in Tiled Editor            \n  let spacing = tiledMap.tilesets[0].spacing;\n\
    \n//Figure out how many columns there are on the tileset.            \n  //This\
    \ is the width of the image, divided by the width            \n  //of each tile,\
    \ plus any optional spacing thats around each tile            \n  let numberOfTilesetColumns\
    \ =\n    Math.floor(\n      tiledMap.tilesets[0].imagewidth\n      / (tiledMap.tilewidth\
    \ + spacing)\n    );\n\n//Loop through all the map layers            \n  tiledMap.layers.forEach(tiledLayer\
    \ => {\n\n//Make a container group for this layer and copy            \n    //all\
    \ of the layer properties onto it            \n    let layerGroup = new Container();\n\
    \nObject.keys(tiledLayer).forEach(key => {\n\n//Add all the layer's properties\
    \ to the group, except the            \n      //width and height (because the\
    \ container group will work those our for            \n      //itself based on\
    \ its content).            \n      if (key !== \"width\" && key !== \"height\"\
    ) {\n        layerGroup[key] = tiledLayer[key];\n      }\n    });\n\n//Translate\
    \ Tiled Editor’s `opacity` property to the Container’s            \n    //equivalent\
    \ `alpha` property            \n    layerGroup.alpha = tiledLayer.opacity;\n\n\
    //Add the group to the `world`            \n    world.addChild(layerGroup);\n\n\
    //Push the group into the `world`'s `objects` array            \n    //So you\
    \ can access it later            \n    world.objects.push(layerGroup);\n\n//Is\
    \ this current layer a `tilelayer`?            \n    if (tiledLayer.type === \"\
    tilelayer\") {\n\n//Loop through the `data` array of this layer            \n\
    \      tiledLayer.data.forEach((gid, index) => {\n        let tileSprite, texture,\
    \ mapX, mapY, tilesetX, tilesetY,\n            mapColumn, mapRow, tilesetColumn,\
    \ tilesetRow;\n\n//If the grid id number (`gid`) isn't zero, create a sprite \
    \           \n        if (gid !== 0) {\n\n//Figure out the map column and row\
    \ number that we're on, and then            \n          //calculate the grid cell's\
    \ x and y pixel position            \n          mapColumn = index % world.widthInTiles;\n\
    \          mapRow = Math.floor(index / world.widthInTiles);\n          mapX =\
    \ mapColumn * world.tilewidth;\n          mapY = mapRow * world.tileheight;\n\n\
    //Figure out the column and row number that the tileset            \n        \
    \  //image is on, and then use those values to calculate            \n       \
    \   //the x and y pixel position of the image on the tileset            \n   \
    \       tilesetColumn = ((gid - 1) % numberOfTilesetColumns);\n          tilesetRow\
    \ = Math.floor((gid - 1) / numberOfTilesetColumns);\n          tilesetX = tilesetColumn\
    \ * world.tilewidth;\n          tilesetY = tilesetRow * world.tileheight;\n\n\
    //Compensate for any optional spacing (padding) around the tiles if          \
    \  \n          //there is any. This bit of code accumlates the spacing offsets\
    \ from the            \n          //left side of the tileset and adds them to\
    \ the current tile's position            \n          if (spacing > 0) {\n    \
    \        tilesetX\n              += spacing\n              + (spacing * ((gid\
    \ - 1) % numberOfTilesetColumns));\n            tilesetY\n              += spacing\n\
    \              + (spacing * Math.floor((gid - 1) / numberOfTilesetColumns));\n\
    \          }\n\n//Use the above values to create the sprite's image from     \
    \       \n          //the tileset image. The custom `frame` method captures the\
    \            \n          //correct image from the tileset            \n      \
    \    texture = frame(\n            tileset, tilesetX, tilesetY,\n            world.tilewidth,\
    \ world.tileheight\n          );\n\n//I've dedcided that any tiles that have a\
    \ `name` property are important            \n          //and should be accessible\
    \ in the `world.objects` array\n\nlet tileproperties = tiledMap.tilesets[0].tileproperties,\n\
    \              key = String(gid - 1);\n\n//If the JSON `tileproperties` object\
    \ has a sub-object that            \n          //matches the current tile, and\
    \ that sub-object has a `name` property,            \n          //then create\
    \ a sprite and assign the tile properties onto            \n          //the sprite\
    \            \n          if (tileproperties[key] && tileproperties[key].name)\
    \ {\n\n//Make a sprite            \n            tileSprite = new Sprite(texture);\n\
    \n//Copy all of the tile's properties onto the sprite            \n          \
    \  //(This includes the `name` property)            \n            Object.keys(tileproperties[key]).forEach(property\
    \ => {\n              tileSprite[property] = tileproperties[key][property];\n\
    \            });\n\n//Push the sprite into the `world`'s `objects` array     \
    \       \n            //so that you can access it by `name` later            \n\
    \            world.objects.push(tileSprite);\n          }\n\n//If the tile doesn't\
    \ have a `name` property, just use it to            \n          //create an ordinary\
    \ sprite (it will only need one texture)            \n          else {\n     \
    \       tileSprite = new Sprite(texture);\n          }\n\n//Position the sprite\
    \ on the map            \n          tileSprite.x = mapX;\n          tileSprite.y\
    \ = mapY;\n\n//Make a record of the sprite's index number in the array       \
    \     \n          //(We'll use this for collision detection, which you'll    \
    \        \n          //learn in the next chapter)            \n          tileSprite.index\
    \ = index;\n\n//Make a record of the sprite's `gid` on the tileset.          \
    \  \n          //This will also be useful for collision detection later      \
    \      \n          tileSprite.gid = gid;\n\n//Add the sprite to the current layer\
    \ group            \n          layerGroup.addChild(tileSprite);\n        }\n \
    \     });\n    }\n\n//We're now done with the tile layers, so let's move on!\n\
    \n//Is this layer a Tiled Editor `objectgroup`?            \n    if (tiledLayer.type\
    \ === \"objectgroup\") {\n      tiledLayer.objects.forEach(object => {\n```"
