    but you can change this in your own games this so that the path is calculated
    whenever anything significant happens that should cause a sprite to change direction.


    ## Extending and Customizing A*


    You will definitely need to invest a bit of time into getting comfortable using
    A* and understanding all its subtleties. But it’s certainly worth the effort,
    as it’s a cornerstone game design technique that is used on all platforms in most
    game genres.


    A big part of A*’s appeal is its flexibility. As you’ve seen, you can produce
    a different kind of path just by switching the heuristic. But it’s not just the
    heuristics that make A* as flexible as it is. Let’s look at a few of the other
    possibilities the A* algorithm offers.


    ### Variable Terrain


    In this chapter’s examples, we’ve had only one type of obstacle: walls. However,
    you may have different kinds of obstacles in your games, not all of which are
    impenetrable.


    What if you had a game with a mud pit? Characters could still move through the
    mud, but it would slow them down. You could modify A* so that nodes containing
    mud have a high costs. For example, give your G costs an extra 20 or 30 points
    when A* encounters a mud node. A* would then calculate whether it’s faster to
    go around the mud or take the shortcut through it.


    Strategy games use this technique all the time. Troops need to consider whether
    it’s better to stick to the plains and travel fast, or take their time crossing
    mountains. This analysis is all done by A*’s cost analysis of different kinds
    of moves.


    ### Influence Map


    Here’s another interesting problem that’s solvable with A*. Imagine that you have
    enemy AI characters that are using A* to find the best exit to a dungeon. The
    only problem is that you’ve discovered that you can easily rack up a high score
    by hiding near that exit and knocking off each enemy as it blindly stumbles by.
    The enemies have no way of warning their friends that, although this might be
    the shortest route, it’s also extremely dangerous.


    You can fix this by using what’s called an **influence map**. If an area of the
    game world becomes particularly dangerous, make those nodes a very high cost.
    When A* searches for a path, it will avoid those expensive, dangerous areas.


    You can also extend this concept to solve the problem of many enemies following
    the same path. In many games, it will seem very unnatural if all the enemies choose
    the same shortest path. You can force enemies to take a different path by tracking
    the path that each chooses, and assigning high costs to those nodes. A* will then
    avoid nodes and paths that have already been chosen by other enemies.


    ### Dijkstra’s Algorithm


    Earlier, I mentioned that A* was a modification of Dijkstra’s algorithm. There
    is one good reason to use Dijkstra’s algorithm over A*: when you don’t know the
    final destination of the path.


    The only difference between A* and Dijkstra’s algorithm is that A* adds heuristics.
    In Dijkstra’s algorithm, H always has a value of zero. The means that when Dijkstra’s
    algorithm starts looking for a path, it doesn’t know in which direction to start
    looking. It must do a lot more searching than A* to find the goal.


    But what if you have a game where you’re not sure where the character’s final
    destination will be? Imagine that you’re designing a strategy or resource management
    game and your villagers need to collect strawberries. There are four strawberry
    bushes around the town, but you don’t know which bush is the closest. If you use
    Dijkstra’s algorithm, it will search outward in all directions until it finds
    the first one. If you use A*, you will need to calculate four different paths
    to each bush and choose the shortest. Dijkstra’s algorithm saves you from having
    to do this, so it would be a better choice in this case.


    If you want to use Dijkstra’s algorithm rather than A*, just assign 0 to all the
    H costs. The rest of the A* code will be the same.


    Don’t reinvent the wheel! This chapter was written so that you completely understand
    how A* works. It’s been intended to help you customize it, rewrite it, and modify
    it however you want. But, there are plenty of high-quality, open source implementations
    of A* in JavaScript that might be more performant, more flexible, or easier to
    implement for your use case. `Easystar.js` and `Pathfinding.js` are good places
    to start.


    ## Summary


    This chapter has presented a brief introduction to pathfinding, which should get
    you thinking about what’s possible for your own games. Adventure games, strategy
    games, and any games that require sophisticated AI will benefit from these techniques.
    You’ve learned everything you need to know to implement your own A* pathfinding
    algorithm from scratch and how to use it to move sprites around your tile-based
    game world.


    But we’re not done with tile-based games by any means! In the next chapter you’re
    going to learn a few more secrets of tile-based game design: how to use tiles
    to easily create surprisingly sophisticated, autonomous AI entitles, and how to
    implement an efficient broadphase collision detection system.


