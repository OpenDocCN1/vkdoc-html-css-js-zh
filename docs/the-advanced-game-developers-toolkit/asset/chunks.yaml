    是专门为将其核心压缩到 6.5k 以下而编写的，这使其成为微游戏竞赛（例如一年一度的 JS13K 赛事 `js13kgames.com`）的理想工具。同时，它也是学习底层图形渲染的绝佳途径，无需处理
    WebGL 那些常常不必要的复杂性。


    如果你想知道 Hexi 或 Ga 的内部工作原理，或者想从头开始构建你自己的自定义游戏引擎，你可以在本书的姊妹篇《*使用 HTML5 和 JavaScript
    的高级游戏开发*》中找到你需要知道的一切。Ga 实际上只是该书中开发的代码的一个生产级版本。而 Hexi 则是同一个 API 的实现，其底层运行着一个基于
    PixiJS (WebGL) 的渲染器。


    ### 源代码


