  \ 1-13 和 1-14）。如前所述，如果你的清单文件格式错误，此时会显示错误信息（\"Manifest is not valid JSON\"），并要求你更正后重新加载。\n\
  \n■ **注意** 你还可以通过从扩展管理页面选择\"允许在无痕模式下运行\"选项来启用扩展在*无痕模式*下运行（见图 1-13）。\n\n***图 1-13.**\
  \ 加载扩展：扩展已列在扩展管理页面中*\n\n一旦扩展成功加载，它也会显示在扩展管理页面上供你配置，如图 1-13 所示。最后，要查看弹出窗口，你需要点击 `ShowTime`\
  \ 扩展对应的浏览器操作按钮。将鼠标悬停在此按钮上时，你还可以看到浏览器操作的提示信息（回想一下，提示字符串是通过清单文件中的 `default_title`\
  \ 键设置的）。接下来，你将了解如何调试 Chrome 扩展。\n\n## 调试扩展\n\n在本节中，你将学习如何调试 Chrome 扩展。毫不意外地，这种调试与在\
  \ Chrome 浏览器上调试简单网页并无区别。你完成此任务的最佳伙伴是——你猜对了——Chrome DevTools。\n\n\n\n我们不会深入探讨 Chrome\
  \ DevTools 的细节，因为 Google 开发者社区已经为新手和有经验的 Web 开发者提供了优秀的资源，帮助他们熟悉如何在 Chrome 浏览器上调试\
  \ Web 应用。以下 URL 即可访问：[`developers.google.com/web/tools/chrome-devtools/`](https://developers.google.com/web/tools/chrome-devtools/)。\n\
  \n![index-36_1.jpg](img/index-36_1.jpg)\n\n## 检查弹出窗口\n\n你可以进行的第一种调试是检查弹出窗口。为此，只需右键点击弹出窗口（在点击浏览器按钮后窗口弹出时执行此操作），然后选择“检查元素”，如图\
  \ 1-14 所示。\n\n***图 1-14.** 调试扩展：检查弹出窗口*\n\n> **注意** 另一种检查弹出窗口的方法是选择“检查弹出窗口”菜单项，该菜单项在你右键点击扩展图标（即浏览器按钮）时会显示。\n\
  \n如图 1-15 所示，Chrome DevTools 窗口将会出现，并默认选中“元素”面板。你可以使用此面板以迭代的方式编辑样式，甚至编辑 DOM，从而查看哪种设计效果最佳。\n\
  \n![index-37_1.jpg](img/index-37_1.jpg)\n\n***图 1-15.** 调试扩展：元素面板*\n\n## 源代码面板和资源面板\n\
  \n调试过程中其他有用的面板包括“源代码”面板和“资源”面板。使用“源代码”面板，你可以通过在脚本中设置*断点*来调试 JavaScript 代码。为此，首先需要选择要调试的特定脚本（见图\
  \ 1-16）。然后，点击你想要设置断点的行号。最后（在 DevTools 窗口内），重新加载 DevTools 窗口以激活断点。\n\n![index-38_1.jpg](img/index-38_1.jpg)\n\
  \n***图 1-16.** 调试扩展：源代码面板*\n\n> **注意** 你也可以在“源代码”面板中通过点击每行的行号，为脚本添加多个断点。\n\n使用“资源”面板，你可以检查其他已加载的资源，例如本地存储和会话存储。然而，出于本书的目的，我们不会使用这类存储，因为\
  \ Google Chrome 扩展框架提供了一个更好的存储 API。该 API 允许存储的数据跨多个设备同步，这是 `localStorage` 和 `sessionStorage`\
  \ API 所不具备的功能。\n\n你仍然可以在开发的扩展中尝试使用它们。通过“资源”面板检查存储极其简单。如图 1-17 所示，你只需选择与你要检查的存储类型相对应的资源项即可。\n\
