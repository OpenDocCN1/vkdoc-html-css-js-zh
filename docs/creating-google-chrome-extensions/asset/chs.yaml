  \ 扩展的所有 JavaScript 代码都可以使用标准 JavaScript API 编写。这包括 `Date` API（用于获取当前日期和时间）和 `DOM`\
  \ API（用于访问 DOM 树）。\n\n你可以尝试创建用于显示当前时间和日期的 JavaScript 代码，例如在标题标签（`h1`、`h2` 等）内部。清单\
