  ## 验证 JSON 文件


  现在，在你最喜欢的文本编辑器中打开 `manifest.json` 文件。但在开始之前，有一件重要的事情需要注意：JSON 文件*不能*包含注释。这包括单行注释和多行注释。在
  Chrome 网上应用店上传扩展程序包时，大多数错误都是由清单文件中的此类注释引起的。在 Chrome 浏览器本地测试扩展程序时，这些错误不会被报告。


  **注意** 不过，为了演示目的，代码清单和相关材料中*使用了*注释。


  因此，每当你觉得清单文件状态不佳时（例如，可能包含一些拼写错误或其他格式错误），可以放心地尝试任意*JSON 校验工具*。网上有大量此类在线校验工具。例如，[`jsonlint.com`](http://jsonlint.com/)、[`jsonschemalint.com`](http://jsonschemalint.com/)
  等。话虽如此，你现在终于可以打开清单文件进行编辑了。


  '
- '# 创建清单


  在你的空清单文件中添加以下属性：`manifest_version`、`name` 和 `version`。这些是清单文件中的必填字段。`manifest_version`
  代表清单文件格式的版本。`name` 代表扩展程序的名称。同样地，`version` 是扩展程序的版本。


  `manifest_version` 属性接受一个大于 0 的整数值。在撰写本文时，`manifest_version` 属性的有效值是 2，这表示它是清单文件格式的第二个版本。`version`
  属性接受一个字符串值，该值由（一至四个）以点分隔的整数（介于 0 和 65536 之间）组成。同样地，`name` 属性接受一个包含扩展程序名称的字符串值。你还可以添加一个
  `description` 属性（带有相应的字符串值），它表示扩展程序的纯文本描述。


  **注意** Google Chrome 浏览器中的自动更新系统会比较扩展程序的（前述）版本，以确定该扩展程序是否需要更新。如果已发布的扩展程序版本字符串比已安装的版本更新，则扩展程序会自动更新。在编写本书时，扩展程序的更新检查频率是每五小时一次。


  '
- "# 添加按钮：浏览器操作\n\n现在，你需要为 Google Chrome 工具栏中可点击的按钮添加代码。这也被称为*浏览器操作*按钮，或简称为浏览器操作。为此，你需要在清单中添加另一个名为\
  \ `browser_action` 的属性。`browser_action` 属性接受一个对象值（即 `{}`），该对象由以下（字符串）键组成：`default_title`、`default_icon`\
  \ 和 `default_popup`。\n\n如清单 1-1 所示，每个键都接受一个字符串值。`default_title` 键代表浏览器操作的（字符串）工具提示。`default_icon`\
  \ 键代表要用作图标的 PNG 图像资源的（相对）路径。同样地，`default_popup` 代表要用作弹窗（视图）的 HTML 文件的（相对）路径。\n\n\
  **清单 1-1.** 第 1 章 /ShowTime/manifest.json\n\n```\n{\n  \"manifest_version\": 2,\n\
  \  \"name\": \"ShowTime\",\n  \"description\": \"显示当前时间和日期的扩展程序\",\n  \"version\"\
  : \"1.2\",\n  \"browser_action\": {\n    \"default_title\": \"ShowTime\",\n```\n\
  \n\n"
- "# Chrome 扩展开发指南\n\n## 简介\n\n`\"default_icon\" : \"icon.png\"`, //用作 Chrome 工具栏中的图标\n\
  \n`\"default_popup\" : \"popup.html\"`\n\n},\n\n## 第 1 章 ■ Google Chrome 扩展入门\n\n\
