  \ 可用性与消息传递\n\n■ **注意** 回忆一下，将 `persistent` 定义为 `true` 的事件脚本是 *后台脚本*，如第[2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)章所述。\n\
  \n***图 3-8.** `HelloOmniboxInput`：设置默认建议*\n\n#### 创建项目\n\n上下文菜单项有不同的形式，包括 `normal`、`separator`、`checkbox`\
