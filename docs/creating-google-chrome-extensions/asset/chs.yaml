- "# 架构概览\n\n### 关于弹窗脚本\n\n**注意：** `Popup`脚本也代表扩展运行时。但它们不像事件脚本那样享有那么多特权（例如，持久性），因为弹窗脚本仅在相应弹窗打开时才会执行。因此，弹窗脚本只能成功监听少数事件。\n\
  \n### 事件脚本的必要性\n\n到目前为止讨论的每个组件都有其特定用途。例如，`BrowserAction`和`PageAction`组件作为按钮输入；快捷键提供了一种替代的输入方式；弹窗组件提供视图，而弹窗脚本提供应用程序逻辑。现在你可能已经对事件脚本如何对扩展有用有了大致的了解。以下几点明确说明了其用途：\n\
  \n- 最重要的用途是监听来自输入组件的事件，例如来自`BrowserAction`或`PageAction`组件的点击事件、调用快捷键时的命令事件、以及来自上下文菜单项选择的上下文菜单事件。此外，事件脚本还可以监听来自多功能框输入的事件。以下是输入组件触发的事件的完整列表及相应的输入组件\
  \ API（这里列出了除`ContentUI`之外的所有输入组件）：\n  - `chrome.browserAction` — `onClicked`\n \
  \ - `chrome.pageAction` — `onClicked`\n  - `chrome.commands` — `onCommand`\n  -\
  \ `chrome.contextMenus` — `onClicked`\n  - `chrome.omnibox` — `onInputStarted`，`onInputChanged`，`onInputEntered`，`onInputCancelled`\n\
  \n**注意：** 如果在`manifest`中为`BrowserAction`或`PageAction`组件定义了`default_popup`，则`onClicked`事件将不会触发。\n\
  \n- 另一个重要用途是监听来自扩展本身的事件。这包括仅能从`chrome.runtime`对象访问的事件，例如`onMessage`，`onConnect`，`onInstalled`，`onUpdateAvailable`等。这些事件大多数是\
  \ Chrome 扩展框架提供的消息 API 的一部分。你将在下一章中了解这些事件。\n\n**注意：** 内容脚本（一种注入到访问网页中的脚本组件）可用于在宿主网页中创建\
  \ HTML 元素。这些元素在本书中称为 Content UI。Content UI 只能触发标准的 JavaScript 事件。此外，内容脚本对 Chrome\
  \ 扩展 API 的访问非常有限，因为它们不代表扩展运行时。它们只能访问以下 API：`chrome.runtime`，`chrome.extension`和`chrome.storage`。内容脚本仍然可以使用\
  \ Chrome 扩展框架提供的消息 API（可通过`chrome.runtime`对象访问）与扩展运行时通信。\n\n- 正如你将在第 3 章中看到的，使用`onMessage`（或`onConnect`）事件，事件脚本可以监听来自扩展注入到网页中的内容脚本的消息。此外，使用`chrome.runtime.onMessageExternal`事件，事件脚本还可以直接监听来自网页的消息。\n\
  \n- 除了所有这些事件之外，事件脚本还可以监听与各种 API 功能关联的事件，例如`tabs`，`alarms`，`storage`，`bookmarks`，`history`等。这些事件（及其相应的\
  \ API）的示例如下：\n  - `chrome.tabs` — `onCreated`，`onUpdated`，`onRemoved`等\n  - `chrome.alarms`\
  \ — `onAlarm`\n  - `chrome.storage` — `onChanged`\n  - `chrome.bookmarks` — `onCreated`，`onRemoved`，`onChanged`，`onImportBegan`，`onImportEnded`等\n\
  \  - `chrome.history` — `onVisited`，`onVisitRemoved`\n\n- 最重要的是事件脚本的**持久性**，它赋予了所有这些功能。事件脚本能够以可靠的方式监听事件，因为它是一个长期运行的脚本（与弹窗脚本不同，后者仅在弹窗打开时执行）。事件脚本会在需要时（即它们监听的事件被触发时）自动加载，并在再次空闲时卸载。\n\
  \n- 最后，事件脚本还可用于包含由扩展中多个组件共享的应用程序逻辑。例如，考虑一个允许在任何页面上记笔记的笔记扩展。最初，如果只使用`BrowserAction`，整个应用程序逻辑可以放在弹窗脚本中。但如果添加了其他输入组件，弹窗脚本中的代码将无法被这些组件访问（因为弹窗脚本仅在弹窗打开时执行）。\n\
  \n为了允许这种情况，共享代码（反映通用逻辑）可以放在事件脚本中。这使得各种组件可以不受限制地访问通用应用程序逻辑。显然，在这种情况下，弹窗脚本需要使用消息 API\
  \ 与事件脚本来回通信（以便访问通用应用程序逻辑）。不要被这个例子搞糊涂，当你在本章后面完成`BrowserActionNotes`扩展时，你会更清楚地理解它。\n\
  \n### 此组件的清单角色\n\n要在你的扩展中使用事件脚本，你需要在`manifest`中定义`background`属性。该属性是一个由`scripts`和`persistent`键组成的对象。\n\
  \n`scripts`键接受一个字符串数组作为其值，其中每个字符串是事件脚本的（相对）路径。而`persistent`键将布尔值`false`作为其值（如清单\
  \ 2-4 所示）。允许多个事件脚本以模块化代码（图 2-10 和 2-11），如下所示：\n\n```\n\"background\" : {\n  \"scripts\"\
  \ : [\"event_script.js\", \"another_event_script.js\"],\n  \"persistent\" : false\n\
  }\n```\n\n**图 2-10.** `HelloShortcutKey`：后台页面\n\n**图 2-11.** `HelloShortcutKey`：后台页面\n\
  \n此外，一旦在`manifest`中定义了这些脚本，在扩展成功加载到浏览器后，它们会自动被引用到一个自动生成的 HTML 页面中，该页面称为**后台页面**，如图\
  \ 2-12 和 2-13 所示。\n\n**图 2-12.** 扩展管理页面：`HelloShortcutKey`\n\n**图 2-13.** `HelloShortcutKey`：后台页面\n\
  \n实际的 HTML 文件命名不同（见图 2-14）。\n\n**图 2-14.** `HelloShortcutKey`：后台页面\n\n### 后台脚本\n\
  \n事件脚本仅在被监听的事件被触发时持久存在。当事件未被触发时，Chrome 浏览器会使事件脚本处于非活动状态（请注意，这不会立即发生），如图 2-15 所示。\n\
  \n**图 2-15.** 扩展管理页面：`HelloShortcutKey`\n\n要使此脚本在浏览器打开期间持续存在，你需要通过在`manifest`中将`persistent`设置为`true`来将其标记为持久。此类事件脚本称为**后台脚本**。通常，你不需要在扩展中使用后台脚本。扩展框架中只有少数\
  \ API 调用需要后台脚本才能正确执行。本书中使用的大多数示例除非另有说明，否则仅使用事件脚本。\n\n**注意：** **不推荐**使用后台脚本。这是出于性能原因——它们会占用更多内存和其他系统资源。\n\
  \n### 事件对象\n\n\n\n"
- "# 排版后的文档\n\n在当前主题讨论的所有事件中，有一个共同点。它们都代表了扩展框架中的一个事件对象。*事件*是一个对象，允许您在发生某些有趣的事情时得到通知。以下是使用`chrome.alarms.onAlarm`事件在闹钟结束时得到通知的示例。\n\
  \n```javascript\nchrome.alarms.onAlarm.addListener(function(alarm) {\n  if(alarm.name\
  \ == \"A\") {/**/}\n  else if(alarm.name == \"B\") {/**/}\n  else {/**/}\n});\n\
  ```\n\n## 第二章 ■ 架构概述\n\n与 DOM API 类似，扩展框架中的事件也需要一个监听器函数，该函数使用`addListener`方法注册。不应将其与\
  \ DOM API 的`addEventListener`方法混淆。扩展框架中的每个 API（`browserAction`、`pageAction`、`commands`、`tabs`、`alarms`、`bookmarks`等）都会向监听器函数传递不同类型的参数。对于前面列出的示例，监听器接收一个`Alarm`类型的参数。\n\
  \n除了目前讨论的事件之外，扩展框架还提供了一个高级系统，用于根据某些自定义规则的匹配来执行操作。虽然这听起来类似于典型的事件和监听器模型，但并非如此。扩展框架中的这个高级功能被称为声明式事件处理器，并将在同名主题中讨论。\n\
  \n### 重新审视`onCommand`事件\n\n现在，您可以最终重新审视`HelloShortcutKey`扩展。要监听`onCommand`事件，首先需要在扩展文件夹中创建一个事件脚本。事件脚本可以任意命名，只要是一个有效的文件名即可。接下来，您需要在清单中列出该事件脚本。为此，您需要先定义`background`清单属性。\n\
  \n向此属性添加两个属性：`scripts`和`persistent`。如前所述，`scripts`属性接受一个数组作为其值。事件脚本将列在此数组中。对于此扩展，由于您不希望在浏览器打开期间让事件脚本持续存在（您只希望它们基于事件保持活动状态），您需要将`persistent`定义为`false`，如清单\
  \ 2-4 所示。\n\n当此扩展在浏览器中加载时，与事件脚本对应的*后台页面*将开始监听任何事件。要处理`onCommand`事件，您需要实现其监听器函数（参见清单\
  \ 2-5）。当定义的快捷键被调用时，*后台页面*将变为活动状态并执行监听器函数。一旦它进入空闲状态（参见图 2-11），它将变为不活动状态，从而也卸载所有关联的脚本（以节省内存和其他系统资源）。\n\
  \n### 声明式事件处理器\n\n在我们开始讨论声明式事件处理器作为基于自定义规则执行操作的高级机制之前，请将注意力转移到`HelloPageAction`扩展以显示页面操作。该扩展位于第二章的练习文件文件夹中。您可以在浏览器中加载它进行测试。\n\
  \n**清单 2-6.** 第二章/HelloPageAction/manifest.json\n\n```json\n{\n  \"manifest_version\"\
  : 2,\n  \"name\": \"HelloPageAction\",\n  \"description\": \"Extension to demonstrate\
  \ a Page-Action\",\n  \"version\": \"1.2\",\n  \"page_action\": {\n    \"default_title\"\
  : \"HelloPageAction\",\n    \"default_icon\": \"icon.png\",\n    \"default_popup\"\
  : \"popup.html\"\n  },\n  \"background\": {\n    \"scripts\": [\"event_script.js\"\
  ],\n    \"persistent\": false\n  },\n  \"permissions\": [\n    \"tabs\"\n  ]\n}\n\
  ```\n\n### `HelloPageAction`扩展\n\n如清单 2-6 所示，除了声明和定义页面操作外，此扩展的清单还包含用于使用事件脚本的`background`清单属性的定义。除此之外，清单还包含用于使用`tabs`功能的`permissions`属性（您将在第三章中了解`permissions`属性）。为了使事件脚本仅在事件基础上活动，`persistent`被定义为`false`。\n\
  \n**清单 2-7.** 第二章/HelloPageAction/event_script.js\n\n```javascript\n//region {variables\
  \ and functions}\nvar consoleGreeting = \"Hello World! - from event_script.js\"\
  ;\nvar queryInfoForAllTabs = {\n  //\"active\":false,\"currentWindow\":true\n};\n\
  \nfunction logTabs(tabs) {\n  console.group(\"Tabs\");\n  console.log(tabs);\n \
  \ console.groupEnd(\"Tabs\");\n}\n\nfunction queryTabsAndShowPageActions() {\n \
  \ chrome.tabs.query(\n    queryInfoForAllTabs,\n    function(tabs) {\n      console.log(\"\
  All tabs length: %s\", tabs.length);\n      //Output tabs object to the console\
  \ as a separate visual group\n      logTabs(tabs);\n      if(tabs.length > 0) {\n\
  \        for(var i=0; i<tabs.length; i++) {\n          chrome.pageAction.show(tabs[i].id);\n\
  \        }\n      }\n    }\n  );\n}\n//end-region\n```\n\n清单 2-7 和 2-8 包含了此扩展中使用的事件脚本的代码。函数`queryTabsAndShowPageActions`使用了`chrome.tabs.query`\
  \ API，根据对象`queryInfoForAllTabs`查询标签页，该对象作为第一个参数传递给`query`方法。此对象为空，以便使`query` API\
  \ 返回所有标签页。这在您的扩展中是必需的，以便在所有标签页上显示页面操作。\n\n`query`方法的第二个参数是一个回调函数，它接收`tabs`作为其第一个（也是唯一一个）参数。因为它是一个数组，所以您可以对其进行迭代。此数组中的每个元素都是`Tab`类型。在\
  \ Chrome 扩展框架中，每个标签页都使用此`Tab`类型表示。此类型有许多关联的属性，其中重要的包括`id`、`active`和`url`。\n\n对于此扩展，您需要`id`属性来显示页面操作。页面操作通过调用`chrome.pageAction.show`方法显示在标签页中，该方法接受标签页的`id`作为其唯一参数。因此，在循环`for(var\
  \ i=0; i<tabs.length; i++)`内部，调用`show`方法来显示页面操作。\n\n**清单 2-8.** 第二章/HelloPageAction/event_script.js\n\
  \n```javascript\n//region {calls}\nconsole.log(consoleGreeting);\n//Show Page-Actions\
  \ using the chrome.tabs.query method\n//queryTabsAndShowPageActions();\n//Show Page-Actions\
  \ using the onUpdated event\nchrome.tabs.onUpdated.addListener(function(tabId,changeInfo,tab)\
  \ {\n  chrome.pageAction.show(tabId);\n});\n//end-region\n```\n\n然而，使用`queryTabsAndShowPageActions`函数有一个缺点。此函数只会被调用一次，即当事件脚本首次在浏览器中加载时。为了在每次打开（或更新）标签页时显示页面操作，这还不够。为此，您需要监听标签页上的一个事件——`onUpdated`事件。\n\
  \n此事件的使用在清单 2-8 中有所展示。对于此扩展，`queryTabsAndShowPageActions`函数调用已被注释掉。通过简单地监听`onUpdated`事件来显示页面操作。这样，每次标签页被更新（即打开或更新）时，监听器函数都会被调用，并为相应的标签页显示一个页面操作，其\
  \ ID 为`tabId`（监听器函数接收的参数，如清单 2-8 所示）。\n\n#### `declarativeContent` API\n\n\n\n现在我们可以开始讨论声明式事件处理器了。声明式事件处理器提供了一种定义规则的方式，这些规则由声明式条件和动作组成。条件是在浏览器本身中评估的，而不是在驱动扩展框架的\
  \ JavaScript 引擎中。这减少了浏览器与（前述）JavaScript 引擎之间的往返延迟。在撰写本书时，有两种声明式事件处理器——`chrome.declarativeContent`\
  \ 和 `chrome.declarativeWebRequest`。在本书的学习过程中，你不需要处理后者（因为它不适用于稳定版通道上的 Google Chrome\
  \ 用户）。\n\n## 第 2 章 ■ 架构概览\n\n你可以使用 `chrome.declarativeContent` API 根据网页内容执行操作，而无需读取网页内容的权限（读取和修改网页内容是通过注入到已访问网页的\
  \ content scripts 完成的）。在撰写本书时，仅支持两种此类操作——`chrome.declarativeContent.ShowPageAction`\
  \ 和 `chrome.declarativeContent.SetIcon`。要使用此 API，需要在 manifest 中声明以下权限：`declarativeContent`。\n\
  \n#### 添加和移除规则\n\n作为声明式 API，该 API 允许你在 `onPageChanged` 事件上注册规则，即使用 `chrome.declarativeContent.onPageChanged.*`。其中，`*`\
  \ 可以表示 `addRules` 或 `removeRules`。`addRules` 方法将规则实例数组作为第一个参数，并将一个可选的回调函数（在完成时调用）作为第二个参数。\n\
  \n```\nvar rule1 = {\n    id : \"some_rule_A\", //可选，未设置时会自动生成\n    priority : 100,\
  \ //可选，默认值为 100\n    conditions : [/*条件*/],\n    actions : [/*动作*/]\n};\n...\nvar\
  \ ruleList = [rule1,rule2,...];\nchrome.declarativeContent.onPageChanged.addRules(ruleList);\n\
  ```\n\n要移除规则，请调用 `removeRules` 方法。它接受一个可选的规则标识符数组（例如 `[rule1.id, rule2.id]`）作为第一个参数，以及一个回调函数作为第二个参数。如果该数组为\
  \ `undefined`，则会移除该扩展的所有已注册规则。\n\n***清单 2-9.*** 第 2 章/PageActionNotes/event_script.js\n\
  \n```\n//region {变量和函数}\nvar consoleGreeting = \"Hello World! - from event_script.js\"\
  ;\nvar ruleStackOverflowHost = {\n    \"conditions\" : [\n        new chrome.declarativeContent.PageStateMatcher({\n\
  \            \"pageUrl\" : {\n                \"hostEquals\" : \"stackoverflow.com\"\
  ,\n                \"schemes\" : [\"http\",\"https\"]\n            }\n        })\n\
  \    ],\n    \"actions\" : [new chrome.declarativeContent.ShowPageAction()]\n};\n\
  //end-region\n```\n\n> **注意：** 规则在浏览会话之间是持久化的。因此，你应该在扩展安装期间，使用 `runtime.onInstalled`\
  \ 事件来添加规则。请注意，该事件在扩展更新时也会触发。因此，你应该先清除之前安装的规则，然后再注册新规则。有关规则的更多详细信息，请访问以下网址：<https://developer.chrome.com/extensions/events>。\n\
  \n***清单 2-10.*** 第 2 章/PageActionNotes/event_script.js\n\n```\n//region {函数调用}\n\
  console.log(consoleGreeting);\nchrome.runtime.onInstalled.addListener(function()\
  \ {\n    //替换所有规则\n    chrome.declarativeContent.onPageChanged.removeRules(undefined,function()\
  \ {\n        //使用新规则\n        chrome.declarativeContent.onPageChanged.addRules(\n\
  \            [ruleStackOverflowHost]\n        );\n    });\n});\n//end-region\n```\n\
  \n#### 使用 ShowPageAction\n\n在上一主题“HelloPageAction 扩展”中，演示了如何使用 `chrome.tabs.query`\
  \ 方法和 `chrome.tabs.onUpdated` 事件显示 Page-Action。现在，你将了解另一种使用声明式事件处理器动作来实现的方法。\n\n\
  > **注意：** 有关此主题的深入介绍，请访问该网址。\n\n\n\n"
- "# [`developer.chrome.com/extensions/declarativeContent`](https://developer.chrome.com/extensions/declarativeContent)\n\
  \n如清单 2-9 所示，`ruleStackOverflowHost` 是使用一个条件和相应动作创建的。该条件通过 `PageStateMatcher` 对象表示。\n\
  \n`PageStateMatcher` 仅在满足所有列出的条件时才会匹配网页。在清单 2-9 中，这些条件包括 `pageUrl.hostEquals` 和\
  \ `pageUrl.schemes`（用于匹配 `stackoverflow.com` 上的所有网页）。除了使用 `pageUrl` 条件外，还可以使用 `css`\
  \ 条件。例如，考虑以下规则：当 [`www.google.com`](https://www.google.com/) 的网页上存在密码字段时，显示一个 `PageAction`：\n\
  \n```\nvar rule1 = {\n  \"conditions\" : [\n    new chrome.declarativeContent.PageStateMatcher({\n\
  \      \"pageUrl\" : {\n        \"hostEquals\" : \"www.google.com\",\n        \"\
  schemes\" : [\"https\"]\n      },\n      \"css\" : [\"input[type='password']\"]\n\
  \    })\n  ],\n  \"actions\" : [new chrome.declarativeContent.ShowPageAction()]\n\
  };\n```\n\n如前所述，`declarativeContent` API 仅支持两个动作。动作作为 `actions` 数组的一个元素列出（如清单 2-9\
  \ 所示，`actions` 是 `rule` 实例的一个属性）。最后，要注册这些规则，需要执行以下调用。由于规则在浏览器会话之间是持久的，因此它们仅在扩展程序安装时添加一次。此外，要清除所有先前定义的规则，需将\
  \ `undefined` 作为第一个参数调用 `removeRules`。\n\n```\nchrome.runtime.onInstalled.addListener(function()\
  \ {\n  // 替换所有规则\n  chrome.declarativeContent.onPageChanged.removeRules(undefined,\
  \ function() {\n    // 使用新规则\n    chrome.declarativeContent.onPageChanged.addRules(\n\
  \      [ruleStackOverflowHost]\n    );\n  });\n});\n```\n\n#### 内容脚本\n\n在之前关于 `declarativeContent`\
  \ API 的主题中，你了解了如何无需读取网页内容，仅通过声明某些条件即可执行特定操作。这可能并不总是足够，因为 `declarativeContent` API（通过\
  \ `PageStateMatcher` 对象）只允许有限的匹配条件。此外，动作也非常有限。这正是内容脚本发挥作用的地方。\n\n内容脚本是一种注入到访问的网页中的脚本组件。它们对\
  \ Chrome 扩展程序 API 的访问非常有限（因为它们不代表扩展程序运行时）。但是，它们可以使用 DOM API 读取和修改访问网页的内容（即 HTML\
  \ 元素）。由于可以访问 DOM API，它们还可以将内容（即 HTML 元素）添加到被注入的网页中。这种使用内容脚本创建的用户界面被称为内容界面。在你进一步了解内容脚本之前，请记住内容脚本不能：\n\
  \n- 使用 `chrome.*` API，以下情况除外：\n  - `extension`（`getURL`、`inIncognitoContext`、`lastError`、`onRequest`、`sendRequest`）\n\
  \  - `i18n`\n  - `runtime`（`connect`、`getManifest`、`getURL`、`id`、`onConnect`、`onMessage`、`sendMessage`）\n\
  \  - `storage`\n- 使用其他脚本组件中定义的变量或函数。\n- 使用网页（它们被注入到的）或其他内容脚本中定义的变量或函数。\n\n> **注意：**\
  \ 内容脚本可以间接使用完整的 `chrome.*` API，并且也可以间接访问其他脚本组件中定义的变量和函数。它们可以通过使用消息传递 API（将在第 3 章讨论）来实现这一切。\n\
  \n#### 清单文件在此组件中的作用\n\n现在让我们看看如何配置清单文件以使用内容脚本组件。\n\n如果内容脚本的代码总是需要自动注入，你需要在清单文件中声明并定义\
  \ `content_scripts` 属性，如下面的代码所示：\n\n```\n\"content_scripts\" : [\n  {\n    \"matches\"\
  \ : [\"http://www.google.com/*\"],\n```\n\n\n`\"css\"` : `[\"mystyles_A.css\"]`,\n\
  `\"js\"` : `[\"jquery.js\",\"myscript_A.js\"]`\n}\n]\n\n该属性是一个数组，其中每个元素（一个内容脚本）在其定义中包含以下属性——`matches`、`css`\
  \ 和 `js`。显而易见，`css` 和 `js` 分别是需要注入到与 `matches` 数组中指定的 URL 相匹配的网页中的 CSS 和 JavaScript\
  \ 文件数组。\n\n除此之外，还可以使用 `tabs` API 以编程方式注入 JavaScript（或 CSS）代码（这需要在 manifest 中申请 `tabs`\
  \ 权限，以便获得所有标签页的访问权限并与之交互；但如果只需访问当前活动标签页，则 `activeTab` 权限就足够了）。\n\n对于编程式注入，可以在 manifest\
  \ 中使用 `tabs` 或 `activeTab` 权限。当用户调用扩展时（例如，通过点击其 `BrowserAction`），`activeTab` 权限会授予扩展对当前活动标签页的临时访问权限。对该标签页的访问权限将持续到标签页被导航或关闭为止。\n\
  \n## 第 2 章 ■ 架构概述\n\n当扩展运行时的代码通过监听函数（例如事件 `chrome.browserAction.onClicked` 或 `chrome.pageAction.onClicked`\
  \ 的监听函数）访问当前活动标签页，并希望通过注入 JavaScript 或 CSS 代码与该标签页交互时，可以使用 `activeTab` 权限。要与其余标签页交互，请使用\
  \ `tabs` 权限。以下方法（在 `tabs` API 中）分别用于注入 CSS 和 JavaScript 代码。\n\n`chrome.tabs.insertCSS(integer\
  \ tabId, object details, function callback)`\n\n`chrome.tabs.executeScript(integer\
  \ tabId, object details, function callback)`\n\n**注意** 当你的 JavaScript 或 CSS 代码不应注入到每个与\
  \ `matches` 模式匹配的网页中，而只需在某些特定情况下注入时，编程式注入非常有用。例如，在点击 `BrowserAction` 或 `PageAction`\
  \ 按钮时。\n\n`tabId` 参数是要在其中注入 CSS 或 JavaScript 代码的标签页的 ID；默认为当前窗口的（当前）活动标签页。`details`\
  \ 参数是一个对象，包含要注入的（CSS/JavaScript）代码或文件的详细信息。在此对象中，必须设置 `code` 或 `file` 属性，但两者*不得*同时设置。第\
  \ 2 章练习文件文件夹中的 `HelloContentScript` 扩展演示了如何在扩展中使用内容脚本。\n\n***清单 2-11.*** 第 2 章/HelloContentScript/manifest.json\n\
  \n```\n{\n    \"manifest_version\" : 2,\n    \"name\" : \"HelloContentScript\",\n\
  \    \"description\" : \"用于演示内容脚本的扩展\",\n    \"version\" : \"1.2\",\n    \"content_scripts\"\
  \ : [\n        {\n            \"matches\" : [\"*://stackoverflow.com/*\"],\n   \
  \         \"js\" : [\"content_script.js\"]\n        }\n    ],\n    \"background\"\
  \ : {\n        \"scripts\" : [\"event_script.js\"],\n        \"persistent\" : false\n\
  \    },\n    \"permissions\" : [\"activeTab\"],\n    \"browser_action\" : {\n  \
  \      \"default_icon\" : \"icon.png\"\n    }\n}\n```\n\n![](img/index-82_1.jpg)\n\
