  \n这样，当访问任何属于 `stackoverflow.com` 主机的网页时，Page-Action 按钮将会显示。点击 Page-Action 后，弹出窗口将会打开。如前所述，此弹出窗口（及其弹出脚本）与前一个扩展中使用的弹出窗口相同。此弹出窗口允许你与\
