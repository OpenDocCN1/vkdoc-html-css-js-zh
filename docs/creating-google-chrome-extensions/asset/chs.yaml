  ## 第 1 章 ■ GOOGLE CHROME 扩展简介


  ### 扩展与插件


  要获取已安装（添加）到 Chrome 浏览器上的扩展完整列表，请将标签页导航至 `chrome://extensions`，如图 1-1 所示。此页面（称为扩展管理页面）用于管理
  Chrome 浏览器中的扩展。


  ***图 1-1.** 查看 Google Chrome 扩展*


  > **注意** 图 1-1 中的项目（即 Google Docs）并不是一个扩展，而是一个 Google Chrome 应用。应用和扩展都列在 Chrome
  浏览器的同一页面（`chrome://extensions`）上，这个页面被称为扩展管理页面。此外，应用也会列在网址为 `chrome://apps` 的页面上。


  建议将此标签页固定（右键单击标签页，然后选择“固定标签页”选项——见图 1-2），因为本书内容将经常用到它。


