  ## `Details`对象


  `Details`对象接受键`tabId`和`popup`，其中`popup`是弹出窗口中要显示的 HTML 文件。如果将其设置为空字符串（`""`），则不显示弹出窗口。


  #### `chrome.browserAction.setPopup(object details)`


  `Details`对象接受键`tabId`和`popup`，其中`popup`是弹出窗口中要显示的 HTML 文件。如果将其设置为空字符串（`""`），则不显示弹出窗口。


