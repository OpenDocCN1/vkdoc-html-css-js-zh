  \ \"persistent\" : false\n  },\n  \"content_scripts\" : \n```\n\n`![`\n\n***图 3-24.**\
  \ 后台页面控制台面板*\n\n### 弹出窗口脚本与内容脚本\n\n现在，让我们来看看弹出窗口脚本如何与内容脚本通信。\n\n为了演示这一点，在练习文件文件夹中包含了一个\
  \ PSandCS 扩展。清单 3-14 到 3-16 包含了该扩展的相关代码。你可以在浏览器中加载此扩展进行测试。图 3-20 和图 3-21 分别包含了该扩展内容脚本和弹出窗口脚本的日志。\n\
  \n> **注意：** 如果扩展的浏览器操作不包含弹出窗口，则可以使用事件脚本为 `chrome.browserAction.onClicked` 事件提供监听函数。\n\
  \n使用此监听函数，你可以调用 `chrome.tabs.sendMessage`（或 `chrome.tabs.connect`）方法。这种方法不需要使用 tabs\
