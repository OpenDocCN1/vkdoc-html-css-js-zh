  \n***图 1-17.** 调试扩展：资源面板*\n\n## 控制台面板\n\n“控制台”面板是 Chrome DevTools 窗口中的一个典型（JavaScript）REPL\
  \ 环境。使用它，你不仅可以记录诊断信息，还可以将其用作 shell，与页面上的 JavaScript 进行交互。控制台面板如图 1-18 所示。\n\n***图\
  \ 1-18.** 调试扩展：控制台面板*\n\n在扩展开发的背景下，这意味着你可以使用控制台面板来记录脚本中的数据。记录数据的方法是使用 `console.log()`\
  \ 方法。该方法接受一个可变数量的 JavaScript 对象列表作为输出。\n\n> **注意** 使用 `console.clear()` 方法清除控制台日志。\n\
  \n除此之外，使用控制台面板，你还可以与 Google Chrome 扩展框架提供的各种 API 进行交互。请记住，所有这些都是在扩展开发的上下文中进行的，因此此类\
  \ API 仅对属于扩展的（脚本或）页面可用。例如，在你开发的 ShowTime 扩展中，你可以添加以下代码行来记录扩展是否拥有隐身访问权限。事实上，你可以直接在控制台面板中执行此代码（在检查弹出窗口时）。\n\
