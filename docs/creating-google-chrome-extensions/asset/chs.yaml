- "# 图 1-34. 分发扩展：保存草稿\n\n![](img/index-51_1.jpg)\n\n## 第 1 章：Google Chrome 扩展程序简介\n\
  \n返回信息中心后，您会发现扩展程序的草稿已列在“您的列表”部分下，如图 1-35 所示。随着您对扩展程序开发了解的深入，您可以改进并更新此草稿。最后，当您准备好此扩展程序后，可以更新第\
  \ 16 步中讨论的字段并发布该扩展程序。\n\n**图 1-35. 分发扩展：项目列表**\n\n### 本章小结\n\n本章从浏览器扩展程序的基本定义开始，包括它们是什么以及不是什么。然后，您学习了如何通过“扩展程序管理”页面列出\
  \ Chrome 浏览器中已安装的扩展程序。\n\n接下来，讨论了一些值得注意的扩展程序，之后您还学习了如何在 Chrome 浏览器上安装扩展程序。还描述了创建\
  \ Chrome 扩展程序所使用的技术，并将其与其他浏览器上使用的技术进行了比较。\n\n最后，您创建了第一个扩展程序——名为 `ShowTime`——并学习了如何在\
  \ Chrome 浏览器中加载它。不仅如此，您还学习了如何调试扩展程序并将其上传到 Chrome 网上应用商店。在第 2 章中，您将了解更多关于 Chrome\
  \ 扩展程序的开发及其架构的信息。但在继续之前，请确保对您创建的 `ShowTime` 扩展程序进行一些尝试和实验，以更好地感受开发过程。这将使您对下一章中使用的示例扩展程序更加熟悉，在下一章中您将学习扩展程序的架构。\n\
  \n## 第 2 章：架构概览\n\n本章从用户和开发者的角度描述 Chrome 扩展程序的架构。这样做将帮助您快速掌握用于创建 Chrome 扩展程序的各种组件。阅读完本章后，您将像用户一样理解\
  \ Chrome 扩展程序的构建块——从所涉及的交互功能角度，同时也像开发者一样——从可用于提供各种功能的内部技术角度。\n\n与前一章一样，本章假设您具有使用\
  \ HTML、CSS 和 JavaScript 等技术编写简单网页的一些经验。您应该了解网页的事件驱动特性，例如，在单击按钮后显示一些用户界面（使用事件监听器等）。那么，让我们开始吧！\n\
  \n### 什么是用户视角？\n\n一个 API（在我们的案例中，是 Google Chrome 扩展程序 API）可以从提供各种功能（如用户界面、存储等）所涉及的内部技术角度来理解，也可以从交互功能角度——具体到需要用于访问这些功能的技术——来理解。后者，即根据扩展程序\
  \ API 提供的*交互功能*来理解它，被描述为用户视角（或用户观点）。本章的内容会不时切换视角，以帮助您学习 Google Chrome 扩展程序 API。\n\
  \n### 创建 Chrome 扩展程序所涉及的组件\n\nGoogle Chrome 扩展程序与任何其他软件应用程序没有什么不同。您通过按钮（或快捷键等）等输入与其交互，它处理一些数据并显示结果。听起来很抽象，不是吗？好吧，其实不然。您很快就会明白。\n\
  \n与其他应用程序开发框架类似，Google Chrome 扩展程序框架为其开发者提供了提供用户界面以及诸如存储、消息传递、网络请求等功能的技术。以下是用于创建\
  \ Chrome 扩展程序的组件。\n\n© Prateek Mehta 2016\nP. Mehta，《创建 Google Chrome 扩展程序》，DOI\
  \ 10.1007/978-1-4842-1775-7_2\n\n![](img/index-53_1.jpg)\n\n#### 输入组件\n\n提供交互功能，由用户界面/非用户界面输入元素组成，例如工具栏按钮、快捷键、上下文菜单项等。Chrome\
  \ 扩展程序提供以下输入组件（见图 2-1）：\n\n- `Browser-Action`\n- `Page-Action`\n- `Shortcut-Key`\n\
  - `Context-Menu-Item`\n- `Omnibox-Input`\n- `Content-UI`\n\n**图 2-1. 用于创建 Chrome\
  \ 扩展程序的输入组件**\n\n#### 脚本组件\n\n顾名思义，这些组件是包含应用程序逻辑的脚本，当用户与扩展程序交互时，这些逻辑可能在不同时间需要。有三种类型的脚本组件：\n\
  \n- *事件脚本（后台脚本）*\n- *弹出窗口脚本*\n- *内容脚本*\n\n> **注意：** 每种*类型*的脚本组件都有自己独立的*作用域*。因此，例如，弹出窗口脚本不能使用事件脚本中定义的变量和函数，反之亦然。这同样适用于其他脚本对——内容脚本和弹出窗口脚本，以及内容脚本和事件脚本。脚本之间能够访问彼此数据（变量、函数等）的唯一方式是通过*消息传递*，您将在下一章中学习到。\n\
  \n![](img/index-54_1.jpg)\n\n#### 弹出窗口组件\n\n弹出窗口是一个特殊的（可选的）视图，仅对 `Browser-Action`\
  \ 和 `Page-Action` 输入组件可用。弹出窗口完全由一个 HTML 页面构成（见图 2-2 和 2-3）。请注意，弹出窗口*仅*在用户单击与 `Browser-Action`\
  \ 或 `Page-Action`（取决于扩展程序使用的是哪一个）对应的工具栏按钮时才会出现。是的，您猜对了——弹出窗口脚本是与弹出窗口组件一起使用的。\n\n\
  **图 2-2. 一个 Browser-Action 弹出窗口**\n\n![](img/index-55_1.jpg)\n\n**图 2-3. 一个 Page-Action\
  \ 弹出窗口**\n\n弹出窗口脚本是普通的 JavaScript 文件。因为它们用于弹出窗口中，所以被称为弹出窗口脚本。请注意，弹出窗口脚本的代码*不能*内联到弹出窗口的\
  \ HTML 页面中。脚本内联意味着将 JavaScript 代码直接放置在 `<script>` 标签内，例如 `<script>alert('Hello World');</script>`。\n\
  \n因此，弹出窗口脚本只能被引用，其中 `src` 需要指向相对于扩展程序文件夹的路径，例如 `<script src=\"popup_script.js\"\
  ></script>`。并且，是的，可以引用多个弹出窗口脚本（见清单 2-1）以使代码模块化。这些脚本在扩展程序加载（到浏览器中）时不会合并，并且可以在 DevTools\
  \ 窗口的“源”和“资源”面板中单独识别（见第 1 章的图 1-16 和 1-17），这已在第 1 章中讨论过。此外，“控制台”面板也有助于分类来自不同（被引用的）弹出窗口脚本的日志，如图\
  \ 2-4 所示。\n\n![](img/index-56_1.jpg)\n\n**图 2-4. 检查弹出窗口：控制台面板**\n\n弹出窗口脚本的一个非常重要的特性是它们可以访问\
  \ Chrome 扩展程序 API。此外，作为 JavaScript 文件，弹出窗口脚本可以访问所有标准的 JavaScript API，包括用于监听和响应弹出窗口内节点触发的\
  \ DOM 事件的事件 API。\n\n**清单 2-1.** 第 2 章/HelloBrowserAction/popup.html\n\n```html\n\
  <head>\n    <!-- 以下标签不被遵守 -->\n    <title>HelloBrowserAction (自定义)</title>\n   \
  \ <!--\n    <script>\n        // 不允许内联脚本\n        alert('Hello World');\n    </script>\n\
  \    -->\n    <!-- 允许引用脚本 -->\n    <script src=\"popup_script.js\"></script>\n \
  \   <script src=\"another_popup_script.js\"></script>\n    <style>\n        ...\n\
  \    </style>\n</head>\n```\n\n\n\n"
- '# 注意

  检查弹出窗口时，有时弹出脚本可能不会出现在`Sources`面板中。要解决此问题，只需重新加载开发者工具窗口即可（请保持在开发者工具窗口内操作）。


  ### 清单组件

  每个扩展程序都有一个名为`manifest.json`的 JSON 格式清单文件，它向 Chrome 浏览器提供扩展程序的重要信息。为此，您需要在清单中声明扩展程序将要使用的功能（例如输入类型——浏览器操作、快捷键等），并定义其对应的值。


  除此之外，Google Chrome 扩展程序框架还提供了大量 API，可用于访问 Chrome 浏览器的实用功能，例如`bookmarks`、`tabs`、`history`等。要使用这些功能，您还需要在清单中*声明*它们的用途。本章后续主题将详细说明清单的更多细节。


  在编写本书时，要创建最简单的有效 Google Chrome 扩展程序（不执行任何操作），只需一个包含清单文件的文件夹，清单文件需包含以下必需属性（也将在第 1
  章中讨论）。


  - `manifest_version` — 指示清单文件格式的版本（编写本书时为 2）

  - `name` — 指示扩展程序的名称，例如`HelloBrowserAction`

  - `version` — 指示扩展程序的版本，例如`1.2`


  ### 扩展程序运行时

  在本节中，您将从开发者的角度了解扩展程序开发。具体来说，您将了解*扩展程序运行时*（不要与扩展程序框架提供的实际运行时 API 混淆，即`chrome.runtime`
  API）。


  现在您已经明白扩展程序的逻辑是用 JavaScript 编写的。鉴于 JavaScript 的事件驱动特性，您可能会好奇扩展程序的生命周期。例如，考虑到用于创建扩展程序的各种输入组件，您可能会考虑监听这些输入触发的事件，然后做出相应响应。


  扩展程序框架中的每个输入组件（ContentUI 除外）都有一些关联事件（例如，Browser-Action 和 Page-Action 输入组件分别关联以下事件——`chrome.browserAction.onClicked`事件和`chrome.pageAction.onClicked`事件）。要监听这些事件，您需要附加*监听器*函数。这些函数在代表扩展程序运行时的脚本组件中创建（并分配给事件）。


  因此，当扩展程序在浏览器中加载时，首先读取清单以授予访问某些 API（例如`tabs` API）的权限。然后，视图和脚本被加载。最后，监听器函数被分配给输入组件。


  请注意，扩展程序本身也有一些关联事件（例如`onMessage`、`onInstalled`等），代表扩展程序运行时的脚本组件也可以将这些事件分配给监听器函数。现在，您可能会问哪些脚本组件代表扩展程序运行时。以下主题提供了这个问题的答案。


  '
- '# 注意

  扩展程序本身有许多关联事件。这些事件是`chrome.runtime`（API）对象的属性。以下是与扩展程序相关的一些最有用的事件——`onMessage`、`onConnect`、`onConnectExternal`、`onInstalled`和`onUpdateAvailable`。


  ### 代表运行时的脚本

  在已加载的扩展程序中，能够监听从输入组件触发的事件或扩展程序发生的其他事件的脚本（脚本组件）代表扩展程序运行时。这些脚本包括弹出脚本和事件脚本。但由于弹出脚本仅在弹出窗口打开时执行，您将更多地依赖扩展程序中的事件脚本（这是一个在后台长期运行的脚本）来监听每个事件（从任何输入组件触发，或从扩展程序自身触发，包括扩展程序安装、卸载、更新等时触发的事件）。


  不表示扩展程序运行时的脚本是内容脚本。


  显然，浏览器中加载的网页永远不能代表扩展程序运行时。但是，正如您将在第 3 章中看到的，网页脚本仍然可以与扩展程序运行时和内容脚本交互（使用消息传递 API）。


  '
- '# 注意

  内容脚本（一种注入到访问网页的脚本组件）对 Chrome 扩展程序 API 的访问权限非常有限，因为它们不表示扩展程序运行时。它们只能访问以下 API：`chrome.runtime`、`chrome.extension`和`chrome.storage`。但内容脚本可以访问常规网页脚本可以访问的所有标准
  JavaScript API。此外，它们可以与扩展程序运行时交互（使用消息传递 API）。


  ### 输入组件：第一部分

  输入组件是 Google Chrome 扩展程序框架提供的*交互功能*。扩展程序并不严重依赖输入，但它们至关重要，因为它们是进入扩展程序核心逻辑的入口点。例如，考虑一个扩展程序，它从所有打开的标签页的
  URL 中搜索单词并返回匹配的 URL。为此，扩展程序至少需要提供一个工具栏按钮（即 Browser-Action 或 Page-Action，如下所述），按下该按钮时会显示一个弹出窗口，其中包含用于输入要搜索单词的文本字段。类似于这种情况，扩展程序还有许多其他方式依赖一个或多个输入组件来触发某些响应（来自脚本组件）或仅显示弹出窗口。


  '
- "# 注意\n*大多数*这些输入组件可以组合在一个扩展程序中。例如，Google Dictionary（Google 出品）扩展程序使用 Browser-Action、Content-UI（事件附加到文档内容）和\
  \ Shortcut-Key 作为输入组件。\n\n那么，现在您已经理解了输入是什么。让我们进一步了解它们，包括如何使用它们，以及如何在清单中声明和定义它们。让我再次重申，清单是您声明扩展程序将要使用的功能并定义其对应值的地方。\n\
  \n但在继续之前，请记住，*无需*任何输入组件也可以创建功能完整的扩展程序。例如，一个自动将访问网页的详细信息发送到 HTTP 服务器的扩展程序。除了这个例子外，为\
  \ Chrome 浏览器创建的*主题*也是在没有任何输入组件的情况下创建的。事实上，主题完全使用清单组件（和一些图像）创建。此外，主题也是一种扩展程序！您已经在上一章学习了创建主题。\n\
  \n### Browser-Action 和 Page-Action 组件\n\n\n\n`Browser-Action`和`Page-Action`组件是 Google\
  \ Chrome 工具栏中的按钮，如图 2-1 所示。`Browser-Action`始终位于地址栏的右侧（地址栏外部），而`Page-Action`始终位于地址栏内部（与地址栏右侧对齐）。在图\
  \ 2-1 中，`Browser-Action`是位于多功能框右侧的圆形紫色按钮。`Page-Action`是位于多功能框内部的浅紫色三角形按钮。请注意，一个扩展**只能**使用其中之一——要么是`Browser-Action`，要么是`Page-Action`组件。\n\
  \n`Browser-Action`和`Page-Action`都有一个与之关联的`popup`组件（以及图标和标题）。当点击对应`Browser-Action`或`Page-Action`按钮的图标时，会显示此弹出窗口。在清单文件中为这些操作分配的标题会被设置为`Browser-Action`或`Page-Action`按钮的`tooltip`（取决于您使用的是哪一个）。`Browser-Action`和`Page-Action`的\
  \ API 可以从所有脚本组件中访问，但内容脚本除外。`chrome.browserAction`对象用于访问`Browser-Action`的 API。类似地，`chrome.pageAction`对象用于访问`Page-Action`的\
  \ API。\n\n**第 2 章 ■ 架构概述**\n\n> **注** 在 Google Chrome 浏览器中，地址栏也称为*多功能框*。在本书中，这两个词可互换使用。\n\
  \n#### 需要单独操作的原因\n\n`Browser-Action`表示对所有网页通用的操作，而`Page-Action`则并非如此。`Page-Action`是针对特定网页设计的（例如，属于`facebook.com`的网页、包含密码字段的网页等）。这就是`Page-Action`名称的由来。这是\
  \ Chrome 的建议，但并没有阻止您违反它。您可以为所有网页使用`Page-Action`，而不是（建议的）仅用于特定网页。但在 API 和架构方面，`Page-Action`有一个限制，这清楚地表明了其实际用途。\n\
  \n一旦在清单文件中声明和定义，`Browser-Action`始终可见。`Page-Action`则并非如此。为了在浏览器中显示`Page-Action`按钮，需要从任何脚本组件（内容脚本除外）调用`chrome.pageAction.show(tabId)`方法（参见清单\
  \ 2-7 和 2-8）。此外，`chrome.declarativeContent`API 也可用于显示`Page-Action`（不必担心，您将在后续主题中了解更多关于这些\
  \ API 的知识）。\n\n> **注** 在扩展开发的上下文中，每个标签页都有一个唯一的 ID。此外，在 Chrome 扩展框架中，每个标签页都使用`Tab`类型表示。此类型具有许多相关属性，其中重要的包括`id`、`active`和`url`。完整的属性列表可在\
  \ URL [`developer.chrome.com/extensions/tabs#type`](https://developer.chrome.com/extensions/tabs#type)\
  \ 找到。`chrome.tabs`API 用于操作标签页。您将在本章后续主题中了解更多相关内容。\n\n请注意，`popup`组件可用于`Browser-Action`和`Page-Action`输入组件。由于弹出脚本始终附加到弹出窗口，因此该脚本始终可用于这些输入组件（显然，只要用户点击这些输入组件后弹出窗口可见即可）。`popup`组件的唯一目的是包含额外的视图，例如表单字段。\n\
  \n但要显示弹出窗口，需要点击对应`Browser-Action`或`Page-Action`组件的按钮。\n\n#### 此组件的清单文件作用\n\n`Browser-Action`和`Page-Action`组件需要在清单文件中声明。除了声明之外，您还需要定义这些组件（无论您在扩展中使用哪一个）。`Browser-Action`在清单文件中按以下方式声明（和定义）（清单\
  \ 2-2）。\n\n**第 2 章 ■ 架构概述**\n\n***清单 2-2.*** 第 2 章/HelloBrowserAction/manifest.json\n\
  \n```json\n\"browser_action\" : {\n  \"default_title\" : \"HelloBrowserAction\"\
  ,\n  \"default_icon\" : \"icon.png\",\n  \"default_popup\" : \"popup.html\"\n}\n\
  ```\n\n类似地，清单 2-3 演示了如何在清单文件中声明（和定义）`Page-Action`。再次提醒您，**一个扩展只能使用其中之一**——要么是`Browser-Action`组件，要么是`Page-Action`组件，但不能同时使用。\n\
  \n***清单 2-3.*** 第 2 章/HelloPageAction/manifest.json\n\n```json\n\"page_action\"\
  \ : {\n  \"default_title\" : \"HelloPageAction\",\n  \"default_icon\" : \"icon.png\"\
  ,\n  \"default_popup\" : \"popup.html\"\n}\n```\n\n如您所见，这两个输入组件的声明和定义是同时进行的。如果清单中仅包含属性（`browser_action`或`page_action`）而没有对应的值，当尝试将此包上传到\
  \ Chrome 浏览器进行测试时，将会产生错误。因此，除了属性外，您还需要提供相应的值。对于`Browser-Action`和`Page-Action`组件，这些值是键值对，包含以下键：\n\
  \n*   `default_title` — 设置为扩展的提示工具\n*   `default_icon` — 设置此路径下的 PNG 图像资源作为扩展的图标\n\
  *   `default_popup` — 设置此路径下的 HTML 文件作为扩展的弹出窗口\n\n> **注** 清单文件中提供的所有资源路径都是相对于扩展文件夹根目录的。例如，如果您有一个名为`HelloWorldExtension`的文件夹，其中包含清单文件，那么`default_icon\
  \ \"icon.png\"`是相对于根目录的，其完整路径将是`HelloWorldExtension/icon.png`。因此，请确保只提供相对路径。\n\n\
  #### 定义组件\n\n对于`browser_action`或`page_action`属性，`null`、空字符串、`bool`等都是无效值。唯一允许的值是一个对象，即`{}`。此对象可以为空。\n\
  \n这通常是为了快速部署扩展以进行测试。此外，有时您可能出于其他原因（如下文所述）而有意这样做。\n\n无论情况如何，只要`browser_action`或`page_action`属性的值为空对象，扩展就可以成功加载。\n\
  \n您可能会疑惑，不提供值的情况下这是如何工作的。嗯，它能工作是因为 Chrome 会提供一个默认的扩展图标（如图 2-5 所示）和一个默认的标题（使用您在清单文件中为`name`属性分配的扩展名称）。但不会为此操作设置默认的弹出窗口。\n\
  \n***图 2-5.** Google Chrome 浏览器中的默认扩展图标*\n\n请注意，所有这些属性键都带有`default`前缀，因为它们的值可以由扩展运行时使用某些\
  \ API 调用（由 Chrome 扩展框架提供）覆盖。这些调用分别列于表 2-1（`Page-Action`组件）和表 2-2（`Browser-Action`组件）。\n\
  \n***表 2-1.** Page-Action：设置标题、图标和弹出窗口*\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `chrome.pageAction.setTitle(object\
  \ details)` | `details`对象接受键`tabId`和`title`，其中（整数）`tabId`是您要修改 Page-Action 的标签页\
  \ ID，`title`是提示工具字符串。 |\n| `chrome.pageAction.setIcon(object details, function callback)`\
  \ | `details`对象接受键`tabId`和`path`，其中`path`是相对图像路径。（可选的）`callback`参数应是一个看起来像`function()\
  \ {...}`的函数。 |\n\n\n\n"
