  ```\n\n#### 下载文件\n\n\n\n要下载文件，请使用`chrome.downloads.download`方法。该方法接受两个参数——`options`（类型为`object`）和`callback`（类型为`function`）。对应于`DownloadItem`的`id`将被传递到回调函数中。`options`对象描述了下载内容及其方式。它支持以下属性。\n\
  \n- `url`（`string`）\n- `filename`（`string`）\n- `saveAs`（`Boolean`）\n- `method`（`\"\
  GET\"`或`\"POST\"`字符串）\n- `headers`（`array`）\n- `body`（`string`）\n\n> **注意**：`DownloadItem`是与下载\
  \ API 关联的一种类型。该类型包含一长串属性（详情请访问[`developer.chrome.com/extensions/downloads#type-DownloadItem`](https://developer.chrome.com/extensions/downloads#type-DownloadItem)）。一些重要的属性包括`id`、`filename`、`mime`、`startTime`、`endTime`、`bytesReceived`和`totalBytes`。\n\
  \n---\n\n## 第 3 章 ■ API 可用性与消息传递\n\n请注意，如果要下载的 URL 使用 HTTPS 协议，则应使用`method`、`headers`和`body`属性。现在，让我们看一个使用`download`方法的示例。在此示例中，我们将下载位于\
  \ [`www.apress.com/9781430250531`](http://www.apress.com/9781430250531) 的源代码文件。要下载的文件的确切\
  \ URL 显示在 清单 3-25 的`downloadOptions`对象中。\n\n* **图 3-36.** Tabs API：使用`captureVisibleTab`方法\n\
  \n如您所见，调用了`download`方法，并将`downloadOptions`对象作为第一个参数传递。`downloadOptions`对象使用`url`和`saveAs`属性定义。显而易见，`url`是要下载的\
  \ URL。将`saveAs`属性设置为`true`是为了使用文件选择器，允许用户选择文件名。请注意图 3-29 中的“下载者”部分，它指向了发起下载的扩展。\n\
  \n---\n\n## 第 3 章 ■ API 可用性与消息传递\n\n#### 取消或恢复下载\n\n一旦获得了`DownloadItem`对应的`id`（该`id`已传递给`download`方法的回调函数），您就可以轻松地取消、恢复甚至暂停下载。相应的调用非常简单：\n\
  \n- `chrome.downloads.cancel(integer downloadId, function callback)`\n- `chrome.downloads.resume(integer\
  \ downloadId, function callback)`\n- `chrome.downloads.pause(integer downloadId,\
  \ function callback)`\n\n#### 打开下载\n\n如果`DownloadItem`已完成，请使用`open`方法打开下载的文件。如果未完成，`open`方法会通过`chrome.runtime.lastError`返回错误。\n\
  \n此方法只需要一个参数，即`downloadId`。请注意，此方法需要额外的权限：`downloads.open`。\n\n若仅需在文件管理器中显示已下载文件所在的文件夹，需要调用以下方法：`chrome.downloads.show(integer\
  \ downloadId)`。\n\n此外，如果唯一意图是在文件管理器中显示默认的“下载”文件夹，则需要调用`chrome.downloads.showDefaultFolder()`方法。\n\
  \n#### 删除下载\n\n如果`DownloadItem`已完成，请使用`chrome.downloads.removeFile`方法删除已下载的文件。该方法接受两个参数——`downloadId`和`callback`。但是，如果只需要从历史记录中清除下载记录（而不删除已下载的文件），则应改用`chrome.downloads.erase`方法。\n\
  \n此方法接受一个`query`对象和一个`callback`函数作为其参数。`query`对象可以接受一长串属性。一些重要的属性包括`id`、`startedBefore`、`startedAfter`、`endedBefore`、`endedAfter`、`filenameRegex`和`urlRegex`。要查看完整列表，请访问\
  \ [`developer.chrome.com/extensions/downloads#method-erase`](https://developer.chrome.com/extensions/downloads#method-erase)\
  \ 。\n\n#### 相关事件\n\n\n\n下载 API 提供了一些有用的事件，例如`onCreated`、`onChanged`等，可用于在下载开始或对应的`DownloadItem`属性发生变化时提供回调函数。以下列出这些事件及其说明。请注意，你还可以参考清单\
  \ 3-25 了解这些事件及其监听函数的具体用法。\n\n* `onCreated`—当下载开始时，使用`DownloadItem`对象触发该事件\n* `onErased`—当下载从历史记录中删除时，使用`downloadId`触发该事件\n\
  * `onChanged`—当`DownloadItem`的任何属性（`bytesReceived`和`estimatedEndTime`除外）发生变化时触发该事件\n\
  \n### History API\n\n历史 API（即`chrome.history` API）用于与浏览器记录的已访问页面进行交互。通过此 API，你可以添加、删除和查询浏览器历史记录中的\
  \ URL。它需要使用历史权限。清单 3-26 包含了来自第三章练习文件文件夹中 HistoryAPI 扩展的代码。\n\n***清单 3-26.*** 第 3\
  \ 章/HistoryAPI/ event_script.js\n\n```\n//region {变量和函数}\n\nvar greeting = \"Hello\
  \ World!\";\n\nvar tenMinutesAsMilliseconds = 10 * 60 * 1000;\n\n//getTime 返回自纪元以来的毫秒数\n\
  \nvar currentTimeAsMilliseconds = new Date().getTime();\n\n//使用 \"text\" 查询过去一小时内过滤历史记录\n\
  \nvar query = {\n\n\"text\" : \"apress\",\n\n\"startTime\" : currentTimeAsMilliseconds\
  \ - 6 * tenMinutesAsMilliseconds,\n\n\"endTime\" : currentTimeAsMilliseconds,\n\n\
  \"maxResults\" : 10\n\n};\n\n//end-region\n\n//region {调用}\n\nconsole.log(greeting);\n\
  \nchrome.history.search(query,function(results) {\n\nresults.forEach(function(result)\
  \ {\n\n//result 是 HistoryItem 类型\n\nconsole.log(result);\n\n});\n\n});\n\nchrome.history.getVisits({\"\
  url\" : \"http://www.example.\n\norg\"},function(results) {\n\nresults.forEach(function(result)\
  \ {\n\n//result 是 VisitItem 类型\n\nconsole.log(result);\n\n});\n\n});\n\nchrome.history.addUrl({\"\
  url\" : \"http://www.example.org\"},function() {\n\nconsole.log(\"addUrl\");\n\n\
  });\n\nchrome.history.deleteUrl({\"url\" : \"http://www.example.org\"},function()\
  \ {\n\nconsole.log(\"deleteUrl\");\n\n});\n\n/*\n\nchrome.history.deleteAll(function()\
  \ {\n\nconsole.log(\"deleteAll\");\n\n});\n\n*/\n\n//end-region\n```\n\n要使用查询搜索历史记录，请使用`chrome.history.search`方法。该方法接受两个参数——`query`（`object`类型）和`callback`（`function`类型）。\n\
  \n`query`对象支持以下属性：\n\n* `text`—向历史服务提交的自由文本查询。留空以检索所有页面。\n* `startTime`—将结果限制为此日期之后访问的页面，以自纪元以来的毫秒数表示。\n\
  * `endTime`—将结果限制为此日期之前访问的页面。以自纪元以来的毫秒数表示。\n* `maxResults`—要检索的最大结果数。默认值为 100。\n\
  \n请注意，`callback`函数接收一个`HistoryItem`结果数组。这里，`HistoryItem`是一个封装历史查询单个结果的对象。它支持以下有用属性——`id`、`url`、`title`、`lastVisitTime`、`visitCount`等。\n\
  \n要检索关于某个 URL 访问的信息，请使用`chrome.history.getVisits`方法。如清单 3-26 所示，该方法将一个对象（包含`url`属性）作为其第一个参数。第二个参数是一个`callback`函数，该函数接收一个`VisitItem`结果数组。\n\
  \n**注意：** `VisitItem`是一个封装了对某个 URL 单次访问的对象。它由以下属性组成：`id`、`visitId`、`visitTime`、`referringVisitId`和`transition`（类型为`TransitionType`，描述了浏览器如何导航到特定\
  \ URL）。你可以访问<https://developer.chrome.com/extensions/history#transition_types>了解更多关于`TransitionType`的信息。\n\
  \n\n\n#### 添加和移除网址\n\n要在当前时间向历史记录中添加一个网址，请使用 `chrome.history.addUrl` 方法。\n\n该方法接受两个参数：`details`（类型为\
  \ `object`）和 `callback`（类型为 `function`）。`details` 对象仅支持 `url` 属性。类似地，使用 `chrome.history.deleteUrl(object\
  \ details, function callback)` 方法可从历史记录中移除指定网址的所有出现记录。请注意，要清除所有历史记录项，需使用 `chrome.history.deleteAll`\
  \ 方法。该方法仅接受一个 `callback` 函数作为参数。\n\n*图 3-37.* XHRAPI：记录响应\n\n#### 关联事件\n\n历史记录 API\
  \ 支持 `onVisited` 和 `onVisitRemoved` 事件。当访问某个网址时，会触发 `onVisited` 事件，并在相应的监听函数中提供该网址的\
  \ `HistoryItem` 数据。请注意，此事件在页面加载完成之前触发。\n\n类似地，当一个或多个网址从历史记录服务中移除时，会触发 `onVisitRemoved`\
  \ 事件。该事件对应的监听函数接收一个对象。\n\n该对象支持以下属性：\n\n- **allHistory** (`Boolean`) - 如果移除了所有历史记录，则为\
  \ `True`。若为 `true`，则 `urls` 将为空。\n- **urls** (`array`) - 被移除的 `String` 类型网址数组。\n\
  \n#### 通知 API\n\n您可以使用 `chrome.notifications` API 通过模板创建丰富的通知，并在系统托盘中向用户显示这些通知。它需要使用\
  \ `notifications` 权限。*代码清单 3-27* 包含了来自第 3 章练习文件文件夹中 NotificationsAPI 扩展的代码。\n\n\
  ***代码清单 3-27.*** 第 3 章 /NotificationsAPI/ event_script.js\n\n```\n//region {variables\
  \ and functions}\n\nvar greeting = \"Hello World!\";\n\nvar title = \"NotificationsAPI\"\
  ;\n\nvar message = \"Test message X\";\n\nvar oneMinuteAsMilliseconds = 1 * 60 *\
  \ 1000;\n\n//getTime returns the number of milliseconds since the epoch\n\nvar currentTimeAsMilliseconds\
  \ = new Date().getTime();\n\nvar notificationId = \"myNotification1\";\n\nvar NOTIFICATION_TEMPLATE_TYPE\
  \ = {\n\nBASIC : \"basic\",\n\nIMAGE : \"image\",\n\nLIST : \"list\",\n\nPROGRESS\
  \ : \"progress\"\n\n};\n\nvar myButton1 = {\n\ntitle : \"Click X\",\n\niconUrl :\
  \ \"button.png\"\n\n};\n\nvar myButton2 = {\n\ntitle : \"Click Y\",\n\niconUrl :\
  \ \"button.png\"\n\n};\n\nvar myItem1 = {\n\ntitle : \"Item X\",\n\nmessage : \"\
  This is item X\"\n\n};\n\nvar myItem2 = {\n\ntitle : \"Item Y\",\n\nmessage : \"\
  This is item Y\"\n\n};\n\nvar notificationOptions = {\n\ntype : NOTIFICATION_TEMPLATE_TYPE.LIST,\n\
  \niconUrl : \"icon.png\",\n\ntitle : title,\n\nmessage : message,\n\neventTime :\
  \ currentTimeAsMilliseconds + oneMinuteAsMilliseconds,\n\nbuttons : [myButton1,myButton2],\n\
  \n/*imageUrl : \"icon.png\",*/\n\nitems : [myItem1,myItem2], //comment out for BASIC\n\
  \n/*progress : 0,*/\n\nisClickable : true\n\n};\n\n//end-region\n\n//region {calls}\n\
  \nconsole.log(greeting);\n\nchrome.notifications.create(notificationId,notificationOptions,\n\
  \nfunction(id) {\n\nconsole.log(\"create: \" + id);\n\n}\n\n);\n\n/*\n\nchrome.notifications.clear(notificationId,function(wasCleared)\
  \ {\n\nconsole.log(\"clear: \" + wasCleared);\n\n});\n\n*/\n\n/*\n\nchrome.notifications.getAll(function(notifications)\
  \ {\n\nconsole.log(\"getAll:\");\n\nconsole.log(notifications);\n\n});\n\n*/\n\n\
  chrome.notifications.onClicked.addListener(function(id) { //notification-id console.log(\"\
  onClicked: \" + id);\n\nnotificationOptions.title = title + \" (onClicked)\";\n\n\
  chrome.notifications.update(notificationId,notificationOptions,\n\nfunction(wasUpdated)\
  \ {\n\nconsole.log(\"update: \" + wasUpdated);\n\n}\n\n);\n\n});\n\nchrome.notifications.onClosed.addListener(function(notificationId,byUser)\
  \ {\n\nconsole.log(\"onClosed: \" + notificationId);\n\n});\n\nchrome.notifications.onButtonClicked.addListener(\n\
  \nfunction(notificationId,buttonIndex) {\n\nconsole.log(\"onButtonClicked: \" +\
  \ buttonIndex);\n\n}\n\n);\n\n//end-region\n```\n\n#### 创建和清除通知\n\n要创建一条通知，请使用 `chrome.notifications.create`\
  \ 方法。该方法接受三个参数：`notificationId`（类型为 `string`）、`notificationOptions`（类型为 `object`）以及一个\
  \ `callback` 函数。请注意，`notificationOptions` 对象描述了通知的内容。它支持的完整属性列表可访问 [`developer.chrome.com/apps/notifications#type-NotificationOptions`](https://developer.chrome.com/apps/notifications#type-NotificationOptions)。\n\
  \n`notificationOptions` 对象中一个名为 `type` 的重要属性声明了用于创建通知的模板。其他属性如 `title`、`message`、`buttons`、`imageUrl`、`items`、`progress`\
  \ 等则定义了模板的具体部分。\n\n图 3-30 至 3-32 包含了不同通知模板的示例。在*代码清单 3-27* 中，请注意用作枚举来选择通知模板的 `NOTIFICATION_TEMPLATE_TYPE`\
  \ 对象。\n\n您可以通过调用 `chrome.notifications.clear` 方法来清除一条通知，该方法接受 `notificationId` 作为参数。要清除所有通知，请结合使用\
  \ `clear` 方法与 `chrome.notifications.getAll` 方法，后者接受一个回调函数作为参数。此回调函数接收一个包含所有通知的对象。\n\
  \n#### 更新通知\n\n要更新一条已有的通知，请使用 `chrome.notifications.update` 方法。该方法接受三个参数：`notificationId`（类型为\
  \ `string`）、`notificationOptions`（类型为 `object`）以及一个回调函数。该回调函数接收一个 `Boolean` 参数，指示通知是否已更新。在*代码清单\
  \ 3-27* 中，请注意 `update` 方法是在 `onClicked` 事件的监听函数内部调用的。\n\n#### 关联事件\n\n通知 API 支持\
  \ `onClosed`、`onClicked` 和 `onButtonClicked` 事件。\n\n当通知被关闭时（无论是系统关闭还是用户操作关闭），会触发\
  \ `onClosed` 事件。如*代码清单 3-27* 所示，该事件对应的监听函数接收两个参数：(`string`) `notificationId` 和 (`Boolean`)\
  \ `byUser`。\n\n当用户点击通知中的按钮（见图 3-34）时，会触发 `onButtonClicked` 事件。请注意，按钮是通过 `notificationOptions`\
  \ 对象中的 `buttons` 属性提供的（请参见*代码清单 3-27*）。此事件的监听函数接收 `notificationId` 和 `buttonIndex`。类似地，当用户点击通知的非按钮区域时，会触发\
  \ `onClicked` 事件。在*代码清单 3-27* 中，此事件用于更新通知的 `title` 属性（见图 3-33）。\n\n#### 存储 API\n\
  \n存储 API（即 `chrome.storage` API）用于存储、检索和跟踪用户数据的更改。它需要使用 `storage` 权限。*代码清单 3-28*\
  \ 包含了来自第 3 章练习文件文件夹中 StorageAPI 扩展的代码。该 API 经过优化，以满足扩展的特定存储需求。它提供了与 `localStorage`\
  \ API 相同的存储能力，但具有以下关键区别：\n\n- 用户数据可以自动与 Chrome 同步（使用 `chrome.storage.sync` API）。\n\
  - 您的扩展内容脚本可以直接访问用户数据，无需*后台页面*。\n- 它是异步的，支持批量读写操作，因此比阻塞且串行的 `localStorage` API 更快。\n\
  - 用户数据可以存储为对象（而 `localStorage` API 以字符串形式存储数据）。\n\n#### 同步存储与本地存储\n\n\n\n## 第 3\
  \ 章：API 可用性与消息传递\n\n要为您的扩展程序存储用户数据，您可以使用 `storage.sync` 或 `storage.local` API。使用\
  \ `storage.sync` 时，只要用户启用了同步功能，存储的数据就会自动同步到用户登录的任何 Chrome 浏览器。\n\n当 Chrome 处于离线状态时，Chrome\
  \ 会将数据存储在本地。下次浏览器在线时，Chrome 会同步这些数据。即使**用户禁用同步**，`storage.sync` API 仍然会正常工作。在这种情况下，它的行为将与\
  \ `storage.local` API 完全相同。\n\n> **注意**：不应存储机密的用户信息！存储区域未加密。\n\n---\n\n## 清单 3-28.\
  \ 第 [3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3) 章 /StorageAPI/event_script.js\n\
  \n```javascript\n//region {variables and functions}\n\nvar greeting = \"Hello World!\"\
  ;\n\n//end-region\n\n//region {calls}\n\nconsole.log(greeting);\n\n/*\n//single\
  \ key or a list of keys for items to remove\nchrome.storage.sync.remove(\"color\"\
  ,function() {\n    console.log(\"remove\");\n    chrome.storage.sync.get(\"color\"\
  ,function(items) {\n        console.log(\"get\");\n        console.log(items);\n\
  \    });\n});\n*/\n\nchrome.storage.sync.set({\"color\":\"red\"},function() {\n\
  \    console.log(\"set\");\n    //string or array of string or object keys\n   \
  \ chrome.storage.sync.get(\"color\",function(items) {\n        console.log(\"get\"\
  );\n        console.log(items);\n    });\n});\n\nchrome.storage.onChanged.addListener(function(changes,areaName)\
  \ {\n    console.log(changes);\n    //\"sync\",\"local\" or \"managed\"\n    console.log(areaName);\n\
  });\n\n//end-region\n```\n\n---\n\n#### 设置和获取项目\n\n您可以通过以下 API 调用分别从存储中设置和获取项目：`chrome.storage.sync.set`\
  \ 和 `chrome.storage.sync.get`。`get` 方法接受字符串、字符串数组或对象键作为其第一个参数，`set` 方法接受一个对象（包含键值对）作为其第一个参数。`get`\
  \ 方法的第二个参数是一个回调函数，该函数接收一个对象作为其参数。图 3-35 包含了这些方法调用产生的对应日志。\n\n#### 删除项目\n\n您可以通过调用\
  \ `chrome.storage.sync.remove` 方法轻松删除存储中的项目。此方法接受一个字符串或字符串数组作为其第一个参数，并可选地接受一个回调函数作为其第二个参数。要从存储中删除所有项目，请使用\
  \ `chrome.storage.sync.clear` 方法。\n\n#### 关联事件\n\n存储 API 提供了 `chrome.storage.onChanged`\
  \ 事件。当一个或多个（存储）项目发生更改时，会触发此事件。对应于此事件的监听器函数接收两个参数：（对象）`changes` 和（字符串）`areaName`。此处，`areaName`\
  \ 是存储区域的名称（例如 `sync`、`local` 等）。\n\n---\n\n### Tabs API\n\nTabs API（即 `chrome.tabs`\
  \ API）用于与浏览器的标签系统进行交互。\n\n您可以使用此 API 在浏览器中创建、修改和重新排列标签页。它需要使用 `tabs` 权限。清单 3-29\
  \ 包含了来自第 [3 章](http://dx.doi.org/10.1007/978-1-4842-1775-7_3) 练习文件文件夹中的 `TabsAPI`\
  \ 扩展程序的代码。您已经使用了此 API 中的 `query`、`connect`、`sendMessage`、`executeScript` 和 `insertCSS`\
  \ 方法。本节将介绍其余的方法。\n\n> **注意**：您可以在扩展程序的清单文件中不声明任何权限的情况下，使用大多数 `chrome.tabs` 方法和事件。但是，如果您需要访问\
  \ `tabs.Tab` 的 `url`、`title` 或 `favIconUrl` 属性，则必须在清单中声明 `tabs` 权限。\n\n---\n\n##\
  \ 清单 3-29. 第 [3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3) 章 /TabsAPI/event_script.js\n\
  \n```javascript\n//region {variables and functions}\n\nvar greeting = \"Hello World!\"\
  ;\n\nvar createProperties = {\n    url : \"http://www.example.org\",\n    active\
  \ : false,\n};\n\nvar updateProperties = {\n    pinned : true\n};\n\nfunction getJavaScriptCode(dataUrl)\
  \ {\n    var javascriptCode = \"var imgElement = document.createElement('img');\"\
  ;\n    javascriptCode += \"document.body.appendChild(imgElement);\";\n```\n\n\n\
  ```javascript\njavascriptCode += \"imgElement.style.borderTop = '2px dashed silver';\"\
  ;\njavascriptCode += \"imgElement.src = \";\njavascriptCode += \"'\" + dataUrl +\
  \ \"';\";\nreturn javascriptCode;\n}\n\nfunction createAndUpdateTab(tab) {\n  chrome.tabs.create(createProperties,\
  \ function(tab) {\n    console.log(\"create\");\n    // integer or array of integers\n\
  \    //chrome.tabs.remove(tab.id);\n    /*\n    chrome.tabs.duplicate(tab.id,function(tab)\
  \ {\n      console.log(\"duplicate\");\n    });\n    */\n    chrome.tabs.update(tab.id,\
  \ updateProperties, function(tab) {\n      console.log(\"update\");\n      //chrome.tabs.reload(tab.id);\n\
  \      chrome.tabs.getZoom(tab.id, function(zoomFactor) {\n        console.log(\"\
  getZoom\");\n        console.log(zoomFactor); //1\n      });\n      /*\n      chrome.tabs.setZoom(tab.id,2,function()\
  \ {\n        console.log(\"setZoom\");\n      });\n      */\n    });\n  });\n}\n\
  // end-region\n```\n\n## 第 3 章：API 可用性与消息传递\n\n```javascript\n//region {calls}\n\
  console.log(greeting);\n\nchrome.browserAction.onClicked.addListener(function(tab)\
  \ {\n  chrome.tabs.captureVisibleTab({\"format\": \"png\"}, function(dataUrl) {\n\
  \    // Cannot access a chrome:// URL\n    chrome.tabs.executeScript(tab.id, {\"\
  code\": getJavaScriptCode(dataUrl)});\n  });\n  //createAndUpdateTab(tab);\n});\n\
  //end-region\n```\n\n#### 创建与删除标签页\n\n要创建一个标签页，请使用 `chrome.tabs.create` 方法。该方法接受两个参数：`createProperties`（`object`\
  \ 类型）和 `callback`（`function` 类型）。`createProperties` 对象支持以下常用属性：`index`、`url`、`active`\
  \ 和 `pinned`。`callback` 函数接收一个 `Tab`（`tabs.Tab`）类型的参数。此外，也可以通过调用 `chrome.tabs.duplicate`\
  \ 方法来复制标签页，如清单 3-29 所示（参见 `createAndUpdateTab` 函数中被注释掉的部分）。\n\n使用 `chrome.tabs.remove`\
  \ 方法可以关闭一个或多个标签页。该方法将需要关闭的标签页 ID 或 ID 列表作为第一个参数，并支持可选的 `callback` 函数作为第二个参数。\n\n\
  #### 更新标签页\n\n使用 `chrome.tabs.update` 方法可以修改标签页的属性。该方法接受三个参数：`tabId`、`updateProperties`\
  \ 和 `callback`。你可能已经猜到，`tabId` 是要更新的标签页的 ID。`callback` 函数通过 `tab` 参数接收更新后标签页的详细信息。`updateProperties`\
  \ 对象指定了需要更新的属性，仅支持以下属性：`url`、`active`、`highlighted`、`pinned`、`muted` 和 `openerTabId`。请注意，你还可以通过调用\
  \ `chrome.tabs.reload` 方法来重新加载标签页。该方法将待重新加载的标签页 ID 作为第一个参数，并支持可选的 `callback` 函数作为第二个参数。\n\
  \n***清单 3-30.*** 第 3 章/TabsAPI/manifest.json\n\n```json\n{\n  \"manifest_version\"\
  : 2,\n  \"name\": \"API 演示：tabs API\",\n  \"description\": \"演示 tabs API 的使用\",\n\
  \  \"version\": \"1.2\",\n  \"background\": {\n    \"scripts\": [\"event_script.js\"\
  ],\n    \"persistent\": false\n  },\n  \"browser_action\": {\n    \"default_icon\"\
  : \"icon.png\"\n  },\n  \"permissions\": [\n    \"tabs\",\n    \"<all_urls>\"\n\
  \  ]\n}\n```\n\n> **提示：** 要缩放指定标签页，请使用 `chrome.tabs.setZoom` 方法。此外，要获取指定标签页的当前缩放因子，可使用\
  \ `chrome.tabs.getZoom` 方法。\n\n#### 捕获标签页\n\n要捕获指定窗口中当前活动标签页的可见区域，请使用 `chrome.tabs.captureVisibleTab`\
  \ 方法。该方法接受三个参数：`windowId`、`options` 和 `callback`。`windowId` 参数是可选的，默认为当前窗口。`options`\
  \ 参数用于指定图像的格式。\n\n`callback` 函数接收 `dataUrl`（字符串）参数——这是一个指向包含被捕获标签页可见区域编码图像数据的 URL。请注意，`dataUrl`\
  \ 可赋值给 HTML `img` 元素的 `src` 属性，如清单 3-29 所示。对应的图像见图 3-36。同时请注意，此方法需要额外的权限：`<all_urls>`——如清单\
  \ 3-30 所示。\n\n#### 相关事件\n\n`chrome.tabs` API 提供了与几乎所有可用方法相对应的大量事件。例如，`onCreated`、`onUpdated`、`onRemoved`、`onZoomChange`\
  \ 等事件。此类事件的完整列表可访问 [`developer.chrome.com/extensions/tabs`](https://developer.chrome.com/extensions/tabs)。\n\
  \n### XHR API\n\n扩展程序可以通过请求跨源权限，与远程服务器通信（使用 `XMLHttpRequest` 对象）。此类权限通过*匹配模式*来申请，这些模式提供了对一个或多个主机的访问权限（参见清单\
  \ 3-31 中的 `\"*://localhost/*\"`）。\n\n***清单 3-31.*** 第 3 章/XHRAPI/manifest.json\n\
  \n```json\n{\n  \"manifest_version\": 2,\n  \"name\": \"API 演示：xhr API\",\n  \"\
  description\": \"演示 xhr API 的使用\",\n  \"version\": \"1.2\",\n  \"background\": {\n\
  \    \"scripts\": [\"event_script.js\"],\n    \"persistent\": false\n  },\n  \"\
  permissions\": [\n    \"*://localhost/*\"\n  ]\n}\n```\n\n一旦申请了主机权限，就可以像普通网页一样使用\
  \ XHR API。在清单 3-32 中，请注意 `ucService`（将输入字符串转换为大写的 PHP 脚本）托管在我本地的 HTTP 服务器上。PHP 脚本见清单\
  \ 3-33。\n\n***清单 3-32.*** 第 3 章/XHRAPI/event_script.js\n\n```javascript\n//region\
  \ {variables and functions}\nvar greeting = \"Hello World!\";\nvar xhr = new XMLHttpRequest();\n\
  \nfunction onReadyStateChange() {\n  if (xhr.readyState == 4) {\n    console.log(xhr.responseText);\n\
  \  }\n}\n\nvar host = \"http://localhost/\";\nvar ucService = host + \"Exercise\
  \ Files/Chapter3/XHRAPI/webpage.php?\";\nvar queryString = \"name=\" + encodeURIComponent(\"\
  xhr api\");\n//end-region\n\n//region {calls}\nconsole.log(greeting);\nxhr.onreadystatechange\
  \ = onReadyStateChange;\nxhr.open(\"GET\", ucService + queryString);\nxhr.send();\n\
  //end-region\n```\n\n查询字符串 `\"name=xhr api\"` 是以静态方式提供的。在您的扩展程序中，可以动态提供，例如来自 Browser-Action\
  \ 弹出窗口或 Content-UI 等。图 3-37 显示了来自服务器的相应响应。\n\n***清单 3-33.*** 第 3 章/XHRAPI/WebServer/webpage.php\n\
  \n```php\n<?php\n$raw_input = trim($_GET[\"name\"]);\nif(!preg_match(\"/^[a-zA-Z\
  \ ]*$/\",$raw_input)) {\n    echo \"\";\n} else {\n    echo strtoupper($raw_input);\n\
  }\n?>\n```\n\n### 本章小结\n\n本章开头讨论了上一章中未涉及的输入组件：多功能框输入、上下文菜单项和 Content-UI。之后，你学习了脚本组件如何利用\
  \ Google Chrome 扩展框架提供的消息传递 API 以各种方式进行交互。除此之外，你还学习了普通网页如何与扩展程序进行交互。\n\n接着，你了解了清单文件中的权限字符串的含义，然后学习了如何使用扩展框架提供的许多有用的\
  \ API。你还学习了如何在扩展程序中使用 XHR 跨不同源进行通信，这通过在清单文件中使用*匹配模式*权限字符串实现。\n\n在下一章中，你将了解 Chrome\
  \ 扩展框架提供的其余一些功能，例如主题、替换页面（用于替换新标签页、书签页面等）和选项页面，这些功能可以提升你的扩展在 Chrome 浏览器中的适用性。\n\n\
  ---\n\n## **第 4 章：关于扩展的更多内容**\n\n\n\n"
- "# 关于扩展的更多信息\n\n至此，你已经了解了 Google Chrome 扩展的大部分特性，包括其架构、不同组件之间的消息传递，以及 Google Chrome\
  \ 扩展框架所提供的 API。本章将介绍 Google Chrome 扩展的其余特性，例如选项页面、覆盖页面和主题。此外，你还将了解到在开发 Google Chrome\
  \ 扩展时需要注意的一些安全问题，其中包括 API 权限、`match pattern` 权限、内容脚本注入等。\n\n### 提供选项页面\n\n你可以通过提供一个选项页面（参见图\
  \ 4-4），让用户自定义扩展的行为。需要注意的一个重要点是：即使不使用选项页面，也可以轻松实现类似功能。例如，可以通过提供一个包含界面的弹出组件来保存扩展的首选项（比如使用\
  \ `chrome.storage` API）。不过，不建议这样做，因为用户将无法从“扩展程序管理”页面访问到该选项页面（选项链接请参见图 4-3）。\n\n\
  #### 清单文件对该组件的作用\n\n要声明一个选项页面，需要使用 `options_ui` 清单属性。\n\n该属性支持以下属性。如清单 4-1（来自 OverridePages\
  \ 扩展）所示，`page` 和 `chrome_style` 属性足以声明一个扩展的选项页面。\n\n- `page` (字符串) — 选项页面的路径，相对于扩展的根目录。\n\
  - `chrome_style` (布尔值) — 如果为 `true`，Chrome 的用户代理样式表将应用于选项页面。默认值为 `false`，但为了与 Chrome\
  \ 的 UI 风格保持一致，建议将此值设置为 `true`。\n- `open_in_tab` (布尔值) — 如果为 `true`，扩展的选项页面将在新标签页中打开，而不是嵌入在\
  \ `chrome://extensions` 页面内。默认值为 `false`，不建议使用 `true`。\n\n***清单 4-1.*** 第 4 章/OverridePages/manifest.json\n\
  \n```\n{\n  \"name\" : \"My New-Tab\",\n  \"version\" : \"1.2\",\n  \"manifest_version\"\
  \ : 2,\n  \"chrome_url_overrides\" : {\n    /*newtab,history,bookmarks*/\n    \"\
  newtab\" : \"myNewTab.html\"\n  },\n  \"permissions\" : [\"bookmarks\",\"storage\"\
  ],\n  /*Using an options page*/\n  \"options_ui\" : {\n    \"page\" : \"myOptionsPage.html\"\
  ,\n    /*Use Chrome stylesheet*/\n    \"chrome_style\" : true\n  }\n}\n```\n\n###\
  \ 编写选项页面\n\n选项页面完全由一个 HTML 页面构成（如图 4-4 所示）。清单 4-2 包含了 OverridePages 扩展中使用的选项页面的\
  \ HTML 代码。该扩展位于第 4 章的练习文件文件夹中。如前所述，建议通过将清单中的 `chrome_style` 属性设置为 `true`，为该 HTML\
  \ 页面使用 Chrome 样式表。\n\n> **注意** 要以编程方式打开选项页面，请使用 `chrome.runtime.openOptionsPage`\
  \ 方法。\n\n***图 4-1.*** 新标签页：覆盖提示\n\n***清单 4-2.*** 第 4 章/OverridePages/myOptionsPage.html\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>My Options-Page</title>\n<script\
  \ src=\"myOptionsPage_1.js\"></script>\n<style>\ndiv.left {\n  float:left;\n}\n\
  div.right {\n  float:right;\n}\np.clear {\n  clear:both;\n}\n</style>\n</head>\n\
  <body>\n<p>\n<div class=\"left\">\n  仅显示匹配的书签？\n</div>\n<div class=\"right\">\n\
  \  <form>\n    <input type=\"radio\" name=\"highlight\" value=\"1\"> 是\n    <input\
  \ type=\"radio\" name=\"highlight\" value=\"0\" checked=\"checked\"> 否\n  </form>\n\
  </div>\n</p>\n<br>\n<p class=\"clear\">\n  <input type=\"button\" id=\"save\" value=\"\
  保存\">\n</p>\n</body>\n</html>\n```\n\n\n\n### 排版后的内容\n\n选项页面可以引用脚本。脚本的`src`属性需要指向一个路径，该路径是相对于扩展文件夹（即扩展的根目录）的。在列表\
  \ 4-2 中，被引用的脚本是 `myOptionsPage_1.js`。列表 4-3 包含了该被引用脚本的对应代码。此脚本的目的是保存 `OverridePages`\
  \ 扩展的用户偏好设置。有关偏好的具体细节将在下一主题中描述。\n\n***列表 4-3.*** 第 4 章 / `OverridePages/ myOptionsPage_1.js`\n\
  \n```\n//region {variables and functions}\nvar storageKey = \"APPEND_MATCHING_ONLY\"\
  ;\nvar items = {};\nvar saveButtonID = \"save\";\n\nfunction logSuccess(task) {\n\
  \  console.log(\"%s Successful!\",task);\n}\n//end-region\n\n//region {calls}\n\
  document.addEventListener(\"DOMContentLoaded\",function(dcle) {\n  var saveButton\
  \ = document.getElementById(saveButtonID);\n  saveButton.addEventListener(\"click\"\
  ,function(ce) {\n    if(document.forms[0].highlight.value == \"1\") {\n      items[storageKey]\
  \ = true;\n      chrome.storage.sync.set(\n        items,\n        function() {\n\
  \          if(!chrome.runtime.lastError)\n            logSuccess(\"Set-Storage\"\
  );\n        }\n      );\n    } else {\n      items[storageKey] = false;\n      chrome.storage.sync.set(\n\
  \        items,\n        function() {\n          if(!chrome.runtime.lastError)\n\
  \            logSuccess(\"Set-Storage\");\n        }\n      );\n    }\n  });\n});\n\
  //end-region\n```\n\n### 使用覆盖页面\n\n*覆盖页面*是一种将扩展中的 HTML 文件替换（即覆盖）Google Chrome 通常提供的页面的方式。除了\
  \ HTML，覆盖页面通常还包含 CSS 和 JavaScript 代码。一个扩展可以覆盖以下任意一个页面：\n\n- *书签管理器* (`chrome://bookmarks`)\
  \ — 当用户从 Chrome 菜单中选择书签管理器菜单项，或在 Mac 上从书签菜单中选择书签管理器项时出现的页面。\n- *历史记录* (`chrome://history`)\
  \ — 当用户从 Chrome 菜单中选择历史记录菜单项，或在 Mac 上从历史记录菜单中选择显示完整历史记录项时出现的页面。\n- *新标签页* (`chrome://newtab`)\
  \ — 当用户创建新标签页或窗口时出现的页面。\n\n***图 4-2.** 带有书签的新标签页*\n\n> **注意** 一个扩展只能覆盖一个页面。例如，练习文件文件夹中提供的\
  \ `OverridePages` 扩展覆盖了新标签页。\n\n***列表 4-4.*** 第 4 章 / `OverridePages/ myNewTab.html`\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>My New-Tab</title>\n  <script src=\"\
  myNewTab_1.js\"></script>\n  <style>\n    body {\n      background-color:#eee;\n\
  \    }\n    h2 {\n      width:50%;\n      margin:auto auto;\n      text-align:center;\n\
  \      color:#555;\n    }\n    ul {\n      padding:0px;\n      width:60%;\n    \
  \  margin-left:auto;\n      margin-right:auto;\n      margin-top:100px;\n      text-align:center;\n\
  \      border:2px dashed #555;\n    }\n    li {\n      overflow:hidden;\n      list-style-type:none;\n\
  \    }\n    a {\n      text-decoration:none;\n    }\n    a:hover {\n      text-decoration:underline;\n\
  \    }\n  </style>\n</head>\n<body>\n  <h2>My New-Tab: Chrome Developer Bookmarks</h2>\n\
  \  <ul id=\"list\"></ul>\n</body>\n</html>\n```\n\n#### 清单文件在此组件中的作用\n\n要覆盖一个页面，请使用\
  \ `chrome_url_overrides` 清单属性。被覆盖的具体页面通过 `bookmarks`、`history` 或 `newtab` 属性来指定。\n\
  \n列表 4-1 中展示了一个示例，其中通过指定 `\"newtab\" : \"myNewTab.html\"` 来覆盖新标签页。列表 4-4 包含了来自 `myNewTab.html`\
  \ 文件的相应 HTML 代码。\n\n***图 4-3.** 扩展管理页面：选项链接*\n\n#### OverridePages 扩展\n\n本章练习文件文件夹中提供的\
  \ `OverridePages` 扩展可以覆盖新标签页。您可以在浏览器中加载此扩展进行测试。请注意加载此扩展后出现的提示（见图 4-1）。Chrome 浏览器需要此提示来确认覆盖操作是否（由用户）有意为之。\n\
  \n\n\n如图 4-2 所示，该扩展程序覆盖了“新建标签页”以显示书签。引用的脚本 `myNewTab_1.js` 用于将书签项目附加到 HTML `ul`\
  \ 元素列表中，如代码清单 4-4 中的 `<ul id=\"list\"></ul>` 所示。代码清单 4-5 和 4-6 包含了该引用脚本中的 JavaScript\
  \ 代码。\n\n![](img/index-168_1.jpg)\n\n**图 4-4.** 带有 Chrome 样式表的选项页面\n\n**代码清单 4-5.**\
  \ 第 4 章/OverridePages/`myNewTab_1.js`\n\n```\n//region {variables and functions}\n\
  \nvar folders = [];\n\nvar listName = \"list\";\n\nvar host = \"developer.chrome.com\"\
  ;\n\nvar itemBorderRightStyle = \"5px solid #666\";\n\nvar itemBoxShadowStyle =\
  \ \"0px 0px 2px #333\";\n\nvar itemBackgroundColor = \"#ccc\";\n\nvar storageKey\
  \ = \"APPEND_MATCHING_ONLY\";\n\nfunction appendItem(listElement,nodeURL,nodeParentTitle)\
  \ {\n\nvar li = document.createElement(\"li\");\n\nvar a = document.createElement(\"\
  a\");\n\na.href = nodeURL;\n\na.innerText = nodeURL + \" (\" + nodeParentTitle +\
  \ \")\";\n\nli.appendChild(a);\n\nif(nodeURL.indexOf(host) != -1) {\n\nli.style.borderRight\
  \ = itemBorderRightStyle;\n\nli.style.boxShadow = itemBoxShadowStyle;\n\nli.style.backgroundColor\
  \ = itemBackgroundColor;\n\n}\n\nlistElement.appendChild(li);\n\n}\n\nfunction appendMatchingItem(listElement,nodeURL,nodeParentTitle)\
  \ {\n\nif(nodeURL.indexOf(host) != -1)\n\nappendItem(listElement,nodeURL,nodeParentTitle);\n\
  \n}\n\nfunction populateList(listElement) {\n\nfolders.forEach(function(folder)\
  \ {\n\nfolder.children.forEach(function(bookmarkTreeNode) {\n\nappendItem(listElement,bookmarkTreeNode.url,folder.title);\n\
  \n});\n\n});\n\n}\n\nfunction populateListV2(listElement) {\n\nchrome.storage.sync.get(storageKey,function(items)\
  \ {\n\nif(!chrome.runtime.lastError && items[storageKey]) {\n\nfolders.forEach(function(folder)\
  \ {\n\nfolder.children.forEach(function(bookmarkTreeNode) {\n\nif(bookmarkTreeNode.url)\n\
  \nappendMatchingItem(\n\nlistElement,\n\nbookmarkTreeNode.url,\n\nfolder.title\n\
  \n);\n\n});\n\n});\n\n} else {\n\nfolders.forEach(function(folder) {\n\nfolder.children.forEach(function(bookmarkTreeNode)\
  \ {\n\nif(bookmarkTreeNode.url)\n\nappendItem(\n\nlistElement,\n\nbookmarkTreeNode.url,\n\
  \nfolder.title\n\n);\n\n});\n\n});\n\n}\n\n});\n\n}\n\n//endregion\n```\n\n为了在“新建标签页”中显示书签，使用了书签\
  \ API（即 `chrome.bookmarks` API）。回顾第 3 章的内容，书签树中的每个节点都由一个 `bookmarks.BookmarkTreeNode`\
  \ 对象表示。同样，要检索整个书签的层级结构，需要使用 `chrome.bookmarks.getTree` 方法。\n\n在代码清单 4-6 中，请注意使用\
  \ `children.length` 属性来访问子书签节点。所有这些书签节点都存储在 `folders` 数组中。代码清单 4-5 包含了 `populateList`\
  \ 和 `populateListV2` 函数。这两个函数中的任何一个都可以用来将书签项目附加到前面提到的 HTML `ul` 元素列表中。这些书签项目是从 `folders`\
  \ 数组中获取的。\n\n![](img/index-170_1.jpg)\n\n**图 4-5.** 选项页面：登录控制台\n\n`OverridePages`\
  \ 扩展程序包含一个选项页面，用于保存用户偏好，即只允许在“新建标签页”中显示匹配的书签（此处，匹配的书签是指其 URL 属于特定主机的书签）。为了实现这一功能，使用了存储\
  \ API（即 `chrome.storage` API）。在代码清单 4-3 中，请注意使用 `chrome.storage.sync.set` 方法保存所选选项（“是”和“否”选项可见于图\
  \ 4-4）。同时请注意，与此次调用对应的日志可见于图 4-5。在代码清单 4-3 和 4-5 中，存储项（针对所选选项）对应的键通过以下方式声明：`var storageKey\
  \ = \"APPEND_MATCHING_ONLY\";`\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成地道、准确的中文。\n\
  \n\n为了使用这个存储项（对应于所选选项——是或否），`populateListV2` 函数会调用 `chrome.storage.sync.get` 方法。如果在此次调用期间没有引发运行时错误，并且存储项被设置为\
  \ `true`（即“是”），则会调用 `appendMatchingItem` 函数。否则，将调用 `appendItem` 函数。\n\n在追加书签项之前，`appendMatchingItem`\
  \ 函数会测试待追加的书签节点，其 URL 是否与主机名 `developer.chrome.com` 匹配。\n\n相应的输出如 图 4-6 所示。\n\n\
  **清单 4-6.** [第 4 章](http://dx.doi.org/10.1007/978-1-4842-1775-7_4)/OverridePages/`myNewTab_1.js`\n\
  \n```javascript\n//region {calls}\ndocument.addEventListener(\"DOMContentLoaded\"\
  ,function(dcle) {\n  var listElement = document.getElementById(listName);\n  chrome.bookmarks.getTree(function(bookmarkTreeAsArray)\
  \ {\n    var bookmarkTree = bookmarkTreeAsArray[0];\n    if(bookmarkTree.children)\
  \ {\n      bookmarkTree.children.forEach(function(node) {\n        if(node.children.length\
  \ > 0) folders.push(node);\n      });\n    }\n    //populateList(listElement);\n\
  \    populateListV2(listElement);\n  });\n});\n//end-region\n```\n\n![带有书签的新标签页](img/index-171_1.jpg)\n\
  \n**图 4-6.** 带有书签的新标签页\n\n### 为 Google Chrome 创建主题\n\n主题是一种特殊的扩展程序，它可以改变浏览器外观。主题的打包方式与普通扩展程序相同，但请注意，*主题不包含\
  \ JavaScript 或 HTML 代码*。您可以试用 Chrome 网上应用商店中提供的主题。以下 URL 将直接带您进入主题 [类别：https://chrome.google.com/webstore/category/themes](https://chrome.google.com/webstore/category/themes)。\n\
  \n> **注意** 将扩展程序或主题上传到开发者信息中心没有任何区别，因为主题也是一种扩展程序。\n\n创建主题非常简单，因为它只需要几张图片和清单文件中的几行代码即可。\
  \ 图 4-7 显示了主题扩展程序所使用的图片，这些图片位于[第 4 章](http://dx.doi.org/10.1007/978-1-4842-1775-7_4)的练习文件文件夹中。清单\
  \ 4-7 包含了此扩展程序对应的清单文件代码。\n\n**清单 4-7.** [第 4 章](http://dx.doi.org/10.1007/978-1-4842-1775-7_4)/主题/`manifest.json`\n\
  \n```json\n{\n  \"manifest_version\" : 2,\n  \"name\" : \"HelloTheme\",\n  \"version\"\
  \ : \"1.2\",\n  \"theme\" : {\n    \"images\" : {\n      \"theme_frame\" : \"images/theme_frame_golden.png\"\
  ,\n      \"theme_toolbar\" : \"images/theme_toolbar_silver.png\",\n      \"theme_ntp_background\"\
  \ : \"images/theme_ntp_background.png\",\n      \"theme_ntp_attribution\" : \"images/theme_ntp_attribution.png\"\
  \n    },\n    \"colors\" : {\n      \"tab_text\" : [0,0,0],\n      \"ntp_text\"\
  \ : [255,255,255],\n      \"button_background\" : [0,0,255]\n    },\n    \"tints\"\
  \ : {\n      \"buttons\" : [0.0,0.0,0.0],\n      \"frame\" : [-1.0,-1.0,-1.0],\n\
  \      \"frame_inactive\" : [-1.0,-1.0,0.3],\n      \"frame_incognito\" : [-1.0,-1.0,0.2],\n\
  \      \"frame_incognito_inactive\" : [-1.0,-1.0,0.0]\n    }\n  }\n}\n```\n\n**图\
  \ 4-7.** 主题扩展程序所使用的图片\n\n> **注意** 练习文件文件夹中提供了 SVG 文件，以便您自定义用于创建主题图片的形状。\n\n主题支持图像、颜色和色调元素。要创建主题，您需要为主题清单属性（参见清单\
  \ 4-7）定义这些元素。除此之外，您还需要定义与这些元素对应的属性。以下是一些最常用的属性及其说明。\n\n- `theme_frame` — 窗口的框架，即标签页后面的区域。\n\
  - `theme_toolbar` — 当前标签页和工具栏的共同主题。\n- `theme_ntp_background` — 新标签页的背景图片。\n- `theme_ntp_attribution`\
  \ — 新标签页的署名图片。\n- `tab_text` — 当前标签页标题中文本的颜色。\n- `ntp_text` — 新标签页中所有文本的颜色。\n- `button_background`\
  \ — 所有窗口按钮（例如，最小化、关闭等）的背景颜色。\n- `buttons` — 可应用于 Chrome 工具栏中各种按钮的颜色色调。\n- `frame`\
  \ — 可应用于 Chrome 框架的颜色色调。\n- `frame_inactive` — 当 Chrome 窗口处于非活动状态时应用的颜色色调。\n- `frame_incognito`\
  \ — 在隐身模式下应用于框架的颜色色调。\n- `frame_incognito_inactive` — 与 `frame_incognito` 相同，但适用于窗口（在隐身模式下）处于非活动状态时。\n\
  \n![应用了主题的新标签页](img/index-174_1.jpg)\n\n**图 4-8.** 应用了主题的新标签页\n\n> **注意** 主题不包含\
  \ JavaScript 或 HTML 代码。\n\n图 4-8 显示了应用了主题后的新标签页。请注意窗口的金色框架，这是通过 `theme_frame` 属性指定的。也要注意新标签页的背景图片。它是通过\
  \ `theme_ntp_background` 属性指定的。要指定署名图片，请使用 `theme_ntp_attribution` 属性。在提供的扩展程序中，署名图片是\
  \ `theme_ntp_attribution.png`，它是一个带有黄色徽标的圆形图片（见图 4-8 右下角）。\n\n![隐身模式下的主题](img/index-175_1.jpg)\n\
  ![隐身模式下的主题](img/index-175_2.jpg)\n\n**图 4-9.** 隐身模式下的主题\n\n> **注意** 色调采用色相-饱和度-明度格式，使用\
  \ 0 到 1.0 范围内的浮点数。值为 -1.0 表示不做任何更改。\n\n对于隐身模式，您可以将颜色色调应用于现有样式。例如，在图 4-9 中，请注意应用于窗口框架的颜色色调。此色调是使用\
  \ `frame_incognito` 属性（参见清单 4-7）应用的。类似地，颜色色调也可以应用于非活动模式的不同样式。在图 4-10 中，请注意活动窗口（在前面）和非活动窗口（非活动窗口在后面，并且框架颜色更深）之间的区别。\n\
  \n**图 4-10.** 非活动窗口的颜色色调（后窗口）\n\n### 扩展程序开发：安全注意事项\n\n到目前为止，您已经了解到扩展程序拥有某些权限，使其能够超越常规网页脚本的能力。因此，在编写扩展程序时需要具有安全意识。否则，可能会在用户数据的隐私方面影响用户，涉及已访问、正在访问以及将要访问的数据。以下主题讨论了一些使扩展程序更加安全的有用方法，以及扩展程序框架在后端处理安全性的方式。\n\
  \n#### API 权限\n\n第一层安全防护由扩展程序框架中的权限架构自动提供。API 权限有助于在扩展程序或应用被恶意软件入侵时限制其造成的损害。例如，如果一个操作书签的扩展程序拥有\
  \ `bookmarks` 权限，它就无法影响用户的下载内容，仅仅是因为它没有 `downloads` 权限。因此，您可以看到，*绝不要在清单中请求不必要的权限*，因为如果扩展程序或应用被入侵，这将削弱用户的安全性。\n\
  \n此外，某些权限在安装扩展程序（或应用）之前，也会作为警告显示给用户。请注意，您可以在以下 URL 了解更多关于这些警告的信息：[`developer.chrome.com/extensions/permission_warnings`](https://developer.chrome.com/extensions/permission_warnings)。\n\
  \n#### 匹配模式权限\n\n\n\n"
- "# 与 API 的权限类似，*匹配模式*提供对一个或多个主机的访问权限（用于 XHR API）。为避免对扩展程序或用户安全造成损害，您应*仅在扩展程序中允许列入白名单的主机*，或者实际上，仅允许扩展程序所需的确切白名单远程服务。\n\
  \n#### 外部可连接\n\n如前文“网页脚本和事件脚本”部分（第 3 章）所述，要使扩展程序能够接收来自外部网页（或其他扩展程序）的消息，清单文件中需要包含`externally_connectable`属性。\n\
  \n对于`ids`和`matches`键，您应分别指定需要向扩展程序发送消息的外部网页的扩展程序 ID 和 URL 模式。这样，您可以避免扩展程序收到未经请求的消息，并*专门选择您想要通信的源*。\n\
  \n#### 存储\n\n`storage` API 是扩展程序框架提供的优化 API，用于满足扩展程序特定的存储需求。然而，需要注意的重要一点是，所提供的存储空间并未加密。因此，切勿使用此\
  \ API 存储机密的用户信息。\n\n要为扩展程序存储用户数据，您可以使用`storage.sync`或`storage.local`。\n\n使用`storage.sync`时，只要用户启用了同步功能，存储的数据将自动同步到用户登录的任何\
  \ Chrome 浏览器。\n\n当 Chrome 处于离线状态时，Chrome 会将数据存储在本地。下次浏览器在线时，Chrome 会同步这些数据。即使**用户禁用了同步，`storage.sync`仍然有效**。在这种情况下，它的行为将与`storage.local`相同。\n\
  \n要使用`storage.sync` API，需要进行以下调用。要了解更多关于此 API 的信息，您可以回看上一章中“Storage API”主题。\n\n\
  ```\nchrome.storage.sync.get(string or array of string or object keys, function\
  \ callback)\nchrome.storage.sync.set(object items, function callback)\n```\n\n####\
  \ 内容脚本\n\n在编写内容脚本时，您应注意两个安全问题。首先，注意不要将安全漏洞引入到您注入内容脚本的网页中。例如，如果您的内容脚本从远程服务器（例如，通过\
  \ XHR API）接收数据，在将其注入当前网页之前，请务必过滤该数据，以防跨站脚本攻击。例如，最好通过`innerText`而不是`innerHTML`来注入数据。\n\
  \n> **注意：** 内容脚本在一个称为*隔离世界*的特殊环境中执行。它们可以访问所注入网页的 DOM，但无法访问该网页创建的任何 JavaScript 变量或函数。在每个内容脚本看来，其运行的网页上没有其他\
  \ JavaScript 在执行。反之亦然：网页上运行的 JavaScript 无法调用内容脚本定义的任何函数或访问其任何变量。隔离世界允许每个内容脚本对其 JavaScript\
  \ 环境进行更改，而无需担心与网页或其他内容脚本发生冲突。\n\n值得注意的是网页和扩展程序共享的 JavaScript 对象会发生什么——例如`window.onload`事件。每个隔离世界都看到自己版本的对象。对该对象的赋值会影响您的独立副本。例如，网页和扩展程序都可以对`window.onload`进行赋值，但两者都无法读取对方的事件处理程序。事件处理程序将按照它们被赋值的顺序被调用。\n\
  \n其次，尽管在隔离世界中运行内容脚本可以提供一定的保护，使其免受网页攻击，但如果您不加选择地使用来自网页（或服务）的数据，恶意网页（或通过 XHR API 访问的远程服务）仍可能攻击您的内容脚本。例如，使用`eval`方法解析此数据会使其得以执行，从而使恶意代码能够在您的扩展程序内部执行。为避免这种情况，请*选择不执行代码的更安全（解析）API*，例如`JSON.parse`方法。\n\
  \n### 总结\n\n本章讨论了谷歌 Chrome 扩展程序的其余功能，例如选项页面、覆盖页面和主题。本章描述的`OverridePages`扩展程序覆盖了“新建标签页”。该扩展程序还演示了选项页面的使用。此页面提供了一个单一选项来保存用户对`OverridePages`扩展程序的偏好设置。\n\
  \n`Themes`扩展程序为浏览器显示了一个简单的主题——为窗口提供彩色边框，为“新建标签页”提供背景图片，并为隐身窗口和非活动窗口提供色彩色调。最后，描述了一些安全问题，并讨论了相应的补救措施。所描述的问题包括\
  \ API 权限、*匹配模式*权限、`externally_connectable`属性、存储和内容脚本注入。\n\n本章结束了本书。您了解了什么是谷歌 Chrome\
  \ 扩展程序，学习了如何创建它们，了解了扩展程序的组件和消息传递，以及在 Chrome 网上应用店（前身为谷歌 Chrome 扩展程序画廊）发布扩展程序。所以，现在是时候利用谷歌\
  \ Chrome 浏览器的强大功能，创建您自己出色的扩展程序了！\n\n## 索引\n\n### A\n- `chrome.runtime.sendMessage`\
