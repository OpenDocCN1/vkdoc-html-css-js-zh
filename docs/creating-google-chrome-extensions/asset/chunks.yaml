  trans: "\n现在我们可以开始讨论声明式事件处理器了。声明式事件处理器提供了一种定义规则的方式，这些规则由声明式条件和动作组成。条件是在浏览器本身中评估的，而不是在驱动扩展框架的\
    \ JavaScript 引擎中。这减少了浏览器与（前述）JavaScript 引擎之间的往返延迟。在撰写本书时，有两种声明式事件处理器——`chrome.declarativeContent`\
    \ 和 `chrome.declarativeWebRequest`。在本书的学习过程中，你不需要处理后者（因为它不适用于稳定版通道上的 Google Chrome\
    \ 用户）。\n\n## 第 2 章 ■ 架构概览\n\n你可以使用 `chrome.declarativeContent` API 根据网页内容执行操作，而无需读取网页内容的权限（读取和修改网页内容是通过注入到已访问网页的\
    \ content scripts 完成的）。在撰写本书时，仅支持两种此类操作——`chrome.declarativeContent.ShowPageAction`\
    \ 和 `chrome.declarativeContent.SetIcon`。要使用此 API，需要在 manifest 中声明以下权限：`declarativeContent`。\n\
    \n### 添加和移除规则\n\n作为声明式 API，该 API 允许你在 `onPageChanged` 事件上注册规则，即使用 `chrome.declarativeContent.onPageChanged.*`。其中，`*`\
    \ 可以表示 `addRules` 或 `removeRules`。`addRules` 方法将规则实例数组作为第一个参数，并将一个可选的回调函数（在完成时调用）作为第二个参数。\n\
    \n```\nvar rule1 = {\n    id : \"some_rule_A\", //可选，未设置时会自动生成\n    priority :\
    \ 100, //可选，默认值为 100\n    conditions : [/*条件*/],\n    actions : [/*动作*/]\n};\n\
    ...\nvar ruleList = [rule1,rule2,...];\nchrome.declarativeContent.onPageChanged.addRules(ruleList);\n\
    ```\n\n要移除规则，请调用 `removeRules` 方法。它接受一个可选的规则标识符数组（例如 `[rule1.id, rule2.id]`）作为第一个参数，以及一个回调函数作为第二个参数。如果该数组为\
    \ `undefined`，则会移除该扩展的所有已注册规则。\n\n***清单 2-9.*** 第 2 章/PageActionNotes/event_script.js\n\
    \n```\n//region {变量和函数}\nvar consoleGreeting = \"Hello World! - from event_script.js\"\
    ;\nvar ruleStackOverflowHost = {\n    \"conditions\" : [\n        new chrome.declarativeContent.PageStateMatcher({\n\
    \            \"pageUrl\" : {\n                \"hostEquals\" : \"stackoverflow.com\"\
    ,\n                \"schemes\" : [\"http\",\"https\"]\n            }\n       \
    \ })\n    ],\n    \"actions\" : [new chrome.declarativeContent.ShowPageAction()]\n\
    };\n//end-region\n```\n\n> **注意：** 规则在浏览会话之间是持久化的。因此，你应该在扩展安装期间，使用 `runtime.onInstalled`\
    \ 事件来添加规则。请注意，该事件在扩展更新时也会触发。因此，你应该先清除之前安装的规则，然后再注册新规则。有关规则的更多详细信息，请访问以下网址：<https://developer.chrome.com/extensions/events>。\n\
    \n***清单 2-10.*** 第 2 章/PageActionNotes/event_script.js\n\n```\n//region {函数调用}\n\
    console.log(consoleGreeting);\nchrome.runtime.onInstalled.addListener(function()\
    \ {\n    //替换所有规则\n    chrome.declarativeContent.onPageChanged.removeRules(undefined,function()\
    \ {\n        //使用新规则\n        chrome.declarativeContent.onPageChanged.addRules(\n\
    \            [ruleStackOverflowHost]\n        );\n    });\n});\n//end-region\n\
    ```\n\n### 使用 ShowPageAction\n\n在上一主题“HelloPageAction 扩展”中，演示了如何使用 `chrome.tabs.query`\
    \ 方法和 `chrome.tabs.onUpdated` 事件显示 Page-Action。现在，你将了解另一种使用声明式事件处理器动作来实现的方法。\n\
    \n> **注意：** 有关此主题的深入介绍，请访问该网址。\n"
- fmt: "# [https://developer.chrome.com/extensions/declarativeContent](https://developer.chrome.com/extensions/declarativeContent)\n\
    \nAs displayed in Listing 2-9, the `ruleStackOverflowHost` is created using a\
    \ condition and a corresponding action. The condition is represented using a `PageStateMatcher`\
    \ object.\n\n`PageStateMatcher` matches web pages if and only if all listed criteria\
    \ are met. In Listing 2-9, those criteria include `pageUrl.hostEquals` and `pageUrl.schemes`\
    \ (to match all the web pages on `stackoverflow.com`). In addition to using the\
    \ `pageUrl` criteria, `css` criteria can also be used. For example, consider the\
    \ following rule to show a `PageAction` for web pages on [https://www.google.com](https://www.google.com/),\
    \ when a password field is present on it:\n\n```\nvar rule1 = {\n  \"conditions\"\
    \ : [\n    new chrome.declarativeContent.PageStateMatcher({\n      \"pageUrl\"\
    \ : {\n        \"hostEquals\" : \"www.google.com\",\n        \"schemes\" : [\"\
    https\"]\n      },\n      \"css\" : [\"input[type='password']\"]\n    })\n  ],\n\
    \  \"actions\" : [new chrome.declarativeContent.ShowPageAction()]\n};\n```\n\n\
    As discussed already, only two actions are supported by the `declarativeContent`\
    \ API. An action is listed as an element of the `actions` array (`actions` is\
    \ an attribute of the `rule` instance, as displayed in Listing 2-9). Finally,\
    \ to register the rules, the following calls are made. As rules are persistent\
    \ across browsing sessions, they are only added once, which is when the extension\
    \ installs. Additionally, to clear all the previously defined rules, `removeRules`\
    \ is called with `undefined` as the first argument.\n\n```\nchrome.runtime.onInstalled.addListener(function()\
    \ {\n  // Replace all rules\n  chrome.declarativeContent.onPageChanged.removeRules(undefined,\
    \ function() {\n    // With a new rule\n    chrome.declarativeContent.onPageChanged.addRules(\n\
    \      [ruleStackOverflowHost]\n    );\n  });\n});\n```\n\n## Content Scripts\n\
    \nIn the previous topic on the `declarativeContent` API, you understood how without\
    \ reading the web page contents you can take certain actions simply by declaring\
    \ some condition(s). This may not be always sufficient, as the `declarativeContent`\
    \ API (via the `PageStateMatcher` object) only allows certain limited criteria\
    \ for matching. Moreover, the actions are also very limited. This is where content\
    \ scripts are useful.\n\nContent scripts are a type of scripting component that\
    \ is injected into the visited web page(s). They have a very limited access to\
    \ the Chrome Extensions API (as they do not represent the extension runtime).\
    \ But, they can read and modify the contents (i.e., HTML elements) of visited\
    \ web pages using the DOM API. Since they have access to the DOM API, they can\
