  trans: "\n### 排版后的内容\n\n选项页面可以引用脚本。脚本的`src`属性需要指向一个路径，该路径是相对于扩展文件夹（即扩展的根目录）的。在列表\
    \ 4-2 中，被引用的脚本是 `myOptionsPage_1.js`。列表 4-3 包含了该被引用脚本的对应代码。此脚本的目的是保存 `OverridePages`\
    \ 扩展的用户偏好设置。有关偏好的具体细节将在下一主题中描述。\n\n***列表 4-3.*** 第 4 章 / `OverridePages/ myOptionsPage_1.js`\n\
    \n```\n//region {variables and functions}\nvar storageKey = \"APPEND_MATCHING_ONLY\"\
