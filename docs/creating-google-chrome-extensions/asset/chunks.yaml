- fmt: '# Adding Extensions to Chrome


    It is extremely easy to add extensions available on the Chrome Web Store to your
    Chrome browser. First of all, you need to visit the extensions’ store, located
    at the URL `https://chrome.google.com/webstore/category/extensions`. Once you
    are in the store, you can choose any extension(s) that you want to add to your
    Chrome browser.


    Next, on the selected page you need to click the **Add to Chrome** button as displayed
    in Figure 1-4.


    ***Figure 1-4.** Adding an extension from the store*


    ![](index-24_1.jpg)

    ![](index-24_2.jpg)


    Finally, click on the **Add Extension** button (Figure 1-5) to confirm your selection.


    Congratulations, you have successfully added an extension to your Chrome browser!


    ***Figure 1-5.** Adding an extension from the store: confirming the selection*


    As mentioned earlier, you can tab over to the URL `chrome://extensions` to see
    the list of added extensions. The extension just added will be available in that
    list (see Figure 1-6).


    ***Figure 1-6.** Adding an extension from the store: Save to Google Drive*


    ![](index-25_1.jpg)


    > **Note:** Similar to the `chrome://plugins` and the `chrome://extensions`, there
    are other useful URLs (Figure 1-7) that you can access to get more detailed information
    about your Chrome browser. To get a complete list of these URLs, open the page
    `chrome://chrome-urls` in your Chrome browser, as displayed in Figure 1-7.


    ***Figure 1-7.** Chrome URLs at `chrome://chrome-urls`*


    # Technologies to Create Extensions


    While Google Chrome Extensions offer a lot to the users (in terms of the rich
    functionalities provided), at the same time they also provide a great ease to
    the developers in creating extensions. The technologies used to create Google
    Chrome Extensions are nothing but vanilla HTML, CSS, JavaScript, and (most essentially)
    JSON! And because of this, developing extensions for the Google Chrome browser
    has a flatter learning curve compared to developing extensions for other browsers.
    And yes, Google Chrome Extensions can be built from any desktop operating system.
    After all, these extensions are just a bunch of HTML and JavaScript files!


    ## How Are Technologies Used?


    For obvious reasons, HTML and CSS are used to create the views in extensions.
    JavaScript is used to provide the application logic, as well as to access the
    APIs and components provided by the Google Chrome Extensions framework (in-depth
    coverage of extension components and APIs is provided in Chapters 2 and 3, respectively).
    Finally, JSON is used to create the manifest file for the extensions, in order
    to provide information about itself (the extension) to the Google Chrome browser.


    ## Extensions API


    Google Chrome Extensions are sandboxed in Chrome browsers. This sandbox allows
    an *isolated* execution of the code (i.e., the JavaScript code) belonging to the
    extension.


    What this basically means is that there could be hundreds of extensions installed
    on the Chrome browser, but those extensions won’t be aware of each other’s existence
    automatically. And what this implies is:


    - Different extensions won’t accidentally connect with each other.

    - An extension cannot automatically access code or memory belonging to another
    extension.

    - There won’t be any name conflicts.

    - Chrome browser won’t get confused between your extension’s `Script_A.js` and
    another extension’s `Script_A.js`.

    - The same holds true for other resources that belong to an extension, such as
    HTML, JSON files, images, etc.

    - Extensions can connect with each other in a determined, controlled way (for
    communication).

    - The Extensions framework provides a messaging API to help with one-time as well
    as long-lived connections (more about it in Chapter 3).


    > **Note:** Apart from the sandboxing described here, there is another kind of
    sandboxing that’s provided by the Chrome browser (sandboxing of scripts that are
    injected from extensions into web pages). You will read about it in Chapter 3.


    Chrome Extensions are extremely viable in enhancing the functionality of the Chrome
    web browser. They are able to do so by combining different features (of the Chrome
    browser) to provide a common functionality. For example, consider an extension
    that accesses the tabs and the alarms API (provided by Chrome) to open a tab after
    a predefined interval (say, one day).


    The Google Chrome Extensions framework provides extensions with many special-purpose
    APIs that provide access to amazing features of the Chrome browser. These APIs
    provide access to almost every feature available in the Chrome browser!


    > **Note:** While the Extensions framework provides a whole lot of special-purpose
    APIs, extensions can still use all the standard APIs (also known as the standard
    JavaScript APIs) that the browser provides to web pages. These are the same core
    JavaScript and Document Object Model (DOM) APIs that you are already familiar
    with. Additionally, `XMLHttpRequest`, HTML5 (and other emerging) APIs, WebKit
    APIs (for CSS animations, filters, etc.), and V8 APIs (such as JSON) are also
    supported!


    The HTML5 and other emerging APIs supported by the Chrome browser include audio,
    canvas, geolocation, local storage, notifications, and video. To read more about
    these APIs, visit the URL `https://developer.chrome.com/extensions/api_other`.


    Using these APIs, you can integrate different features provided by the Chrome
    browser with our extension. The list of features includes APIs for alarms, bookmarks,
    history, tabs, actions, storage, notifications, search, and a lot more! You will
    learn about these APIs in Chapter 3.


    # Creating Your First Extension


    The first extension that you will be creating is called `ShowTime`. This extension
    will add a clickable button (also known as the Browser-Action button) to the Google
    Chrome toolbar. Clicking this button will open a popup (see Figure 1-8) that will
    display the current time and date.


    ![](index-28_1.jpg)

    ![](index-28_2.jpg)


    ***Figure 1-8.** Extension popup displayed upon clicking the Extension button*


    > **Note:** `manifest.json` is the only reserved file name in an extension. All
    the other files can be named anything you want.


    To start off, you need to create a folder with the following files: `popup.html`,
    `popup_script.js`, `icon.png`, and `manifest.json` (see Figure 1-9).


    ***Figure 1-9.** Exercise files: ShowTime*


    Later, when you learn about publishing, you will find that the same folder (that
    you just created) is zipped and uploaded to the Chrome Web Store.


    ![](index-29_1.jpg)


    > **Note:** A zipped package of the same folder will be uploaded on the Chrome
    Web Store (via the *Developer Dashboard*) when you publish this extension. This
    is also demonstrated in Figures 1-30 to 1-32. The same holds true for every extension
    you develop.'
