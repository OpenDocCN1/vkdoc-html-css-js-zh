- fmt: "# Chapter 3: API Availability and Messaging\n\nTo store user data for your\
    \ extension, you can use the `storage.sync` or `storage.local` APIs. When using\
    \ `storage.sync`, the stored data will automatically be synced to any Chrome browser\
    \ that the user is logged into, provided the user has sync enabled.\n\nWhen Chrome\
    \ is offline, Chrome stores the data locally. The next time the browser is online,\
    \ Chrome syncs the data. Even if a user disables syncing, the `storage.sync` API\
    \ will still work. In this case, it will behave identically to the `storage.local`\
    \ API.\n\n> **Note**: Confidential user information should not be stored! The\
    \ storage area isn’t encrypted.\n\n---\n\n## Listing 3-28. Chapter [3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)\
    \ /StorageAPI/event_script.js\n\n```javascript\n//region {variables and functions}\n\
    \nvar greeting = \"Hello World!\";\n\n//end-region\n\n//region {calls}\n\nconsole.log(greeting);\n\
    \n/*\n//single key or a list of keys for items to remove\nchrome.storage.sync.remove(\"\
    color\",function() {\n    console.log(\"remove\");\n    chrome.storage.sync.get(\"\
    color\",function(items) {\n        console.log(\"get\");\n        console.log(items);\n\
    \    });\n});\n*/\n\nchrome.storage.sync.set({\"color\":\"red\"},function() {\n\
    \    console.log(\"set\");\n    //string or array of string or object keys\n \
    \   chrome.storage.sync.get(\"color\",function(items) {\n        console.log(\"\
    get\");\n        console.log(items);\n    });\n});\n\nchrome.storage.onChanged.addListener(function(changes,areaName)\
    \ {\n    console.log(changes);\n    //\"sync\",\"local\" or \"managed\"\n    console.log(areaName);\n\
    });\n\n//end-region\n```\n\n---\n\n# Setting and Getting Items\n\nYou set and\
    \ get items from storage using the following API calls respectively: `chrome.storage.sync.set`\
    \ and `chrome.storage.sync.get`. The `get` method takes a string, an array of\
    \ strings, or object keys as its first parameter, and the `set` method takes an\
    \ object (with key-value pairs) as its first parameter. The second parameter in\
    \ the `get` method is a callback function, and it receives an object as its argument.\
    \ Figure [3-35](index_split_001.html#p143) contains the corresponding logs from\
    \ these method calls.\n\n# Removing Items\n\nYou can easily remove an item in\
    \ storage by calling the `chrome.storage.sync.remove` method. This method takes\
    \ a string or array of strings as its first parameter, and an optional callback\
    \ function as its second parameter. To remove all items from the storage, use\
    \ the `chrome.storage.sync.clear` method.\n\n# Associated Events\n\nThe storage\
    \ API provides the `chrome.storage.onChanged` event. This event is fired when\
    \ one or more (storage) items change. The listener function corresponding to this\
    \ event receives two arguments: (object) `changes` and (string) `areaName`. Here,\
    \ `areaName` is the name of the storage area (`sync`, `local`, etc.).\n\n---\n\
    \n# Tabs API\n\nThe Tabs API (i.e., the `chrome.tabs` API) is used to interact\
    \ with the browser’s tab system.\n\nYou can use this API to create, modify, and\
    \ rearrange tabs in the browser. It uses the `tabs` permission. [Listing 3-29](index_split_001.html#p156)\
    \ contains the code from the `TabsAPI` extension, provided in [Chapter 3’s](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)\
    \ Exercise Files folder. You have already used the `query`, `connect`, `sendMessage`,\
    \ `executeScript`, and `insertCSS` methods from this API. This section looks at\
    \ the remaining methods.\n\n> **Note**: You can use most `chrome.tabs` methods\
    \ and events without declaring any permissions in the extension’s manifest file.\
    \ However, if you require access to the `url`, `title`, or `favIconUrl` properties\
    \ of `tabs.Tab`, you must declare the `tabs` permission in the manifest.\n\n---\n\
    \n## Listing 3-29. Chapter [3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)\
    \ /TabsAPI/event_script.js\n\n```javascript\n//region {variables and functions}\n\
    \nvar greeting = \"Hello World!\";\n\nvar createProperties = {\n    url : \"http://www.example.org\"\
    ,\n    active : false,\n};\n\nvar updateProperties = {\n    pinned : true\n};\n\
    \nfunction getJavaScriptCode(dataUrl) {\n    var javascriptCode = \"var imgElement\
    \ = document.createElement('img');\";\n    javascriptCode += \"document.body.appendChild(imgElement);\"\
    ;\n```"
