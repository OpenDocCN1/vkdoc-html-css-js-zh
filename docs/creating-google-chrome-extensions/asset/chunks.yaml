    );\n        }\n      );\n    } else {\n      items[storageKey] = false;\n    \
    \  chrome.storage.sync.set(\n        items,\n        function() {\n          if(!chrome.runtime.lastError)\n\
    \            logSuccess(\"Set-Storage\");\n        }\n      );\n    }\n  });\n\
    });\n//end-region\n```\n\n## 使用覆盖页面\n\n*覆盖页面*是一种将扩展中的 HTML 文件替换（即覆盖）Google Chrome\
    \ 通常提供的页面的方式。除了 HTML，覆盖页面通常还包含 CSS 和 JavaScript 代码。一个扩展可以覆盖以下任意一个页面：\n\n- *书签管理器*\
    \ (`chrome://bookmarks`) — 当用户从 Chrome 菜单中选择书签管理器菜单项，或在 Mac 上从书签菜单中选择书签管理器项时出现的页面。\n\
    - *历史记录* (`chrome://history`) — 当用户从 Chrome 菜单中选择历史记录菜单项，或在 Mac 上从历史记录菜单中选择显示完整历史记录项时出现的页面。\n\
    - *新标签页* (`chrome://newtab`) — 当用户创建新标签页或窗口时出现的页面。\n\n***图 4-2.** 带有书签的新标签页*\n\
    \n> **注意** 一个扩展只能覆盖一个页面。例如，练习文件文件夹中提供的 `OverridePages` 扩展覆盖了新标签页。\n\n***列表 4-4.***\
    \ 第 4 章 / `OverridePages/ myNewTab.html`\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>My New-Tab</title>\n  <script src=\"myNewTab_1.js\"></script>\n  <style>\n\
    \    body {\n      background-color:#eee;\n    }\n    h2 {\n      width:50%;\n\
    \      margin:auto auto;\n      text-align:center;\n      color:#555;\n    }\n\
    \    ul {\n      padding:0px;\n      width:60%;\n      margin-left:auto;\n   \
    \   margin-right:auto;\n      margin-top:100px;\n      text-align:center;\n  \
    \    border:2px dashed #555;\n    }\n    li {\n      overflow:hidden;\n      list-style-type:none;\n\
    \    }\n    a {\n      text-decoration:none;\n    }\n    a:hover {\n      text-decoration:underline;\n\
    \    }\n  </style>\n</head>\n<body>\n  <h2>My New-Tab: Chrome Developer Bookmarks</h2>\n\
    \  <ul id=\"list\"></ul>\n</body>\n</html>\n```\n\n## 清单文件在此组件中的作用\n\n要覆盖一个页面，请使用\
    \ `chrome_url_overrides` 清单属性。被覆盖的具体页面通过 `bookmarks`、`history` 或 `newtab` 属性来指定。\n\
    \n列表 4-1 中展示了一个示例，其中通过指定 `\"newtab\" : \"myNewTab.html\"` 来覆盖新标签页。列表 4-4 包含了来自\
    \ `myNewTab.html` 文件的相应 HTML 代码。\n\n***图 4-3.** 扩展管理页面：选项链接*\n\n## OverridePages\
    \ 扩展\n\n本章练习文件文件夹中提供的 `OverridePages` 扩展可以覆盖新标签页。您可以在浏览器中加载此扩展进行测试。请注意加载此扩展后出现的提示（见图\
    \ 4-1）。Chrome 浏览器需要此提示来确认覆盖操作是否（由用户）有意为之。\n"
- fmt: 'As seen in Figure 4-2, this extension overrides the New Tab page to display
    the bookmarks. The referred script `myNewTab_1.js` is used to append bookmark
    items to the HTML `ul` element list, seen in Listing 4-4 as `<ul id="list"></ul>`.
    Listings 4-5 and 4-6 contain the JavaScript code from the referred script.


    ![](index-168_1.jpg)


    **Figure 4-4.** Options page with Chrome stylesheet


    **Listing 4-5.** Chapter 4/OverridePages/`myNewTab_1.js`


    ```

    //region {variables and functions}


    var folders = [];


    var listName = "list";


    var host = "developer.chrome.com";


    var itemBorderRightStyle = "5px solid #666";


    var itemBoxShadowStyle = "0px 0px 2px #333";


    var itemBackgroundColor = "#ccc";


    var storageKey = "APPEND_MATCHING_ONLY";


    function appendItem(listElement,nodeURL,nodeParentTitle) {


    var li = document.createElement("li");


    var a = document.createElement("a");


    a.href = nodeURL;


    a.innerText = nodeURL + " (" + nodeParentTitle + ")";


    li.appendChild(a);


    if(nodeURL.indexOf(host) != -1) {


    li.style.borderRight = itemBorderRightStyle;


    li.style.boxShadow = itemBoxShadowStyle;


    li.style.backgroundColor = itemBackgroundColor;


    }


    listElement.appendChild(li);


    }


    function appendMatchingItem(listElement,nodeURL,nodeParentTitle) {


    if(nodeURL.indexOf(host) != -1)


    appendItem(listElement,nodeURL,nodeParentTitle);


    }


    function populateList(listElement) {


    folders.forEach(function(folder) {


    folder.children.forEach(function(bookmarkTreeNode) {


    appendItem(listElement,bookmarkTreeNode.url,folder.title);


    });


    });


    }


    function populateListV2(listElement) {


    chrome.storage.sync.get(storageKey,function(items) {


    if(!chrome.runtime.lastError && items[storageKey]) {


    folders.forEach(function(folder) {


    folder.children.forEach(function(bookmarkTreeNode) {


    if(bookmarkTreeNode.url)


    appendMatchingItem(


    listElement,


    bookmarkTreeNode.url,


    folder.title


    );


    });


    });


    } else {


    folders.forEach(function(folder) {


    folder.children.forEach(function(bookmarkTreeNode) {


    if(bookmarkTreeNode.url)


    appendItem(


    listElement,


    bookmarkTreeNode.url,


    folder.title


    );


    });


    });


    }


    });


    }


    //endregion

    ```


    To display bookmarks in the New Tab page, the bookmarks API (i.e., the `chrome.bookmarks`
    API) has been used. Recall from Chapter 3 that each node in the bookmark tree
    is represented by a `bookmarks.BookmarkTreeNode` object. And also recall that
    to retrieve the entire bookmark’s hierarchy, you need to use the `chrome.bookmarks.getTree`
    method.


    In Listing 4-6, note the use of the `children.length` property to access the child
    bookmark nodes. All these bookmark nodes are stored in the `folders` array. Listing
    4-5 contains the `populateList` and `populateListV2` functions. Any of these functions
    can be used to append bookmark items to the aforementioned HTML `ul` element list.
    These bookmark items are obtained from the `folders` array.


    ![](index-170_1.jpg)


    **Figure 4-5.** Options page: logging on to the console


    The `OverridePages` extension contains an options page to save a user preference
    to only allow display of matching bookmarks in the New Tab page (here, a matched
    bookmark has an URL belonging to a certain host). To implement this, the storage
    API (i.e., the `chrome.storage` API) has been used. In Listing 4-3, note the use
    of `chrome.storage.sync.set` method to save the selected option (the Yes and No
    options can be seen in Figure 4-4). Also note that the log corresponding to this
    call can be seen in Figure 4-5. In Listings 4-3 and 4-5, the key corresponding
    to the storage item (for the selected option) is declared in the following way:
    `var storageKey = "APPEND_MATCHING_ONLY";`'
