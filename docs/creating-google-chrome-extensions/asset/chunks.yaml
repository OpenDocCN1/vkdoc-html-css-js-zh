    /CSandWS/ manifest.json


    {


    "manifest_version" : 2,


    "name" : "Communication Demo: content-script and webpage-script",


    "description" : "Shows communication b/w content-script and ...",


    "version" : "1.2",


    "content_scripts" : [


    {


    "matches" : ["*://localhost/*"],


    "js" : ["content_script.js"]


    }


    ]


    }


    ■ **Note** The web page provided with this extension can also be served as a local
    file web page. Although it has a .php suffix, it contains plain HTML code. For
    this reason, it can be opened directly in the Chrome browser (i.e., as a local
    file web page using the file://


    scheme).


    Listing [3-18 con](#index_split_001.html#p129)tains the code from the injected
    content script. The button variable refers the created button element— Send Message
    . This element can be seen at the top-right of Figur[e 3-22](#index_split_000.html#p119)
    . Note that this button element has a listener function associated with its click
    event. Upon clicking this element, the listener function first logs the “Button
    clicked!” string to the console. Then it calls the postMessage method— window.postMes
    sage (message,targetOrigin) .


    Quite obviously, message argument is the message to send. And as described, targetOrigin
    is the URL or URI of the window that will receive the messages. Note that in this
    case, targetOrigin points to the origin of the current window: var targetOrigin


    = window.location.origin . Also note that all the following values for targetOrigin
    are invalid: "file://" , "file://*" , "" , and null . To use the messaging API
    in a local file web page, postMessage needs be called as window.postMessage(message,"*")
    .


    ■ **Note** To inject content scripts into local file web pages, you need to define
    the matches attribute as "matches" : ["file://*"] .


    Regardless of the scheme the web page is served with (i.e., http:// or https://


    versus file:// ), to receive a sent message, a listener function for the message
    event is required to be created, as shown in the window.addEventListener("message",functio
    n(me){/**/}) line. The same h[as been done in Listing 3-19 . The log cor](#index_split_001.html#p130)responding
    to its listener function can be seen in Figur[e 3-22](#index_split_000.html#p119)
    . Note that the event that gets passed to this listener function has a data property
    that can be used to access the string or object that was sent by the postMessage
    method.


