    \ 属性应始终指向脚本文件的*相对*路径（即相对于扩展文件夹）。此外，你也可以将应用逻辑拆分为多个 JavaScript 文件，但每个文件都需要单独引用。\n\
    \n`style` 标签内的 CSS 也可以提取到外部 CSS 文件中，并通过 `<link type=\"text/css\" rel=\"stylesheet\"\
    \ href=\"some_file.css\" />` 进行引用。\n\n***清单 1-5.*** 第 1 章 / ShowTime/popup.html\n\
    \n```\nh1,h2 {\n    display:table-row;\n    vertical-align:middle;\n    text-align:center;\n\
    }\nh2 {\n    background-color:#777;\n}\n.unselectable {\n    -webkit-user-select:none;\n\
    \    cursor:default;\n}\n</style>\n</head>\n<body>\n<div class=\"unselectable\"\
    >\n    <h1 class=\"empty\"></h1>\n    <h1 id=\"time\"></h1>\n    <h2 id=\"date\"\
    ></h2>\n</div>\n</body>\n</html>\n```\n\n## 加载扩展文件夹\n\nChrome 浏览器提供了一种非常快速简便的方法来加载扩展文件夹（用于测试目的）。请注意，浏览器不需要任何额外文件，它只期望找到一个包含\
    \ HTML、JavaScript 和 JSON 文件的文件夹。以下步骤演示了如何加载扩展文件夹：\n\n1. 切换到扩展管理页面。回忆一下，该页面位于 URL\
    \ `chrome://extensions`（图 1-1）。\n2. 在此页面上打开\"开发者模式\"选项（见图 1-11）。\n\n![](img/index-34_1.jpg)\n\
    ![](img/index-34_2.jpg)\n\n## 第 1 章 ■ Google Chrome 扩展入门\n\n***图 1-11.** 加载扩展：选择开发者模式选项*\n\
    \n3. 这将为页面添加一个额外的区域，其中包含用于加载、打包和更新扩展的按钮（如图 1-11 所示）。\n4. 点击\"加载已解压的扩展程序\"按钮来加载扩展。如图\
    \ 1-12 所示，会弹出一个\"浏览文件夹\"或类似的窗口，提示你选择扩展文件夹。\n\n***图 1-12.** 加载扩展：浏览扩展文件夹* 16\n\n\
    ![](img/index-35_1.jpg)\n\n## 第 1 章 ■ Google Chrome 扩展入门\n\n5. 选择你创建的 `ShowTime`\
    \ 文件夹，然后点击\"确定\"继续。成功了！你终于成功在浏览器中加载了你的扩展（见图 1-13 和 1-14）。如前所述，如果你的清单文件格式错误，此时会显示错误信息（\"\
    Manifest is not valid JSON\"），并要求你更正后重新加载。\n\n■ **注意** 你还可以通过从扩展管理页面选择\"允许在无痕模式下运行\"\
    选项来启用扩展在*无痕模式*下运行（见图 1-13）。\n\n***图 1-13.** 加载扩展：扩展已列在扩展管理页面中*\n\n一旦扩展成功加载，它也会显示在扩展管理页面上供你配置，如图\
    \ 1-13 所示。最后，要查看弹出窗口，你需要点击 `ShowTime` 扩展对应的浏览器操作按钮。将鼠标悬停在此按钮上时，你还可以看到浏览器操作的提示信息（回想一下，提示字符串是通过清单文件中的\
    \ `default_title` 键设置的）。接下来，你将了解如何调试 Chrome 扩展。\n\n## 调试扩展\n\n在本节中，你将学习如何调试 Chrome\
    \ 扩展。毫不意外地，这种调试与在 Chrome 浏览器上调试简单网页并无区别。你完成此任务的最佳伙伴是——你猜对了——Chrome DevTools。\n"
- fmt: "We won’t be getting into great detail about Chrome DevTools, because the Google\
    \ developers community has already provided excellent resources to get newbies,\
    \ as well as experienced web developers, familiar with debugging web applications\
    \ on the Chrome browser. The following URL will get you there: [https://developers.google.com/web/tools/chrome-devtools/](https://developers.google.com/web/tools/chrome-devtools/).\n\
    \n![index-36_1.jpg](index-36_1.jpg)\n\n## Inspecting the Popup\n\nThe first kind\
    \ of debugging you can do is inspect the popup. To do that, simply right-click\
    \ on the popup (after the popup gets displayed upon clicking the Browser-Action)\
    \ and choose Inspect Element, as shown in Figure 1-14.\n\n***Figure 1-14.** Debugging\
    \ an extension: Inspecting the popup*\n\n> **Note** Alternatively, popups can\
    \ also be inspected by selecting the Inspect Popup menu item, which is displayed\
    \ when you right-click on the icon for the extension (i.e., the Browser-Action).\n\
    \nAs displayed in Figure 1-15, the Chrome DevTools window will appear, with the\
    \ Elements panel selected. You can use this panel to edit the styles, or even\
    \ the DOM, in an iterative manner to see what’s working best with your designs.\n\
    \n![index-37_1.jpg](index-37_1.jpg)\n\n***Figure 1-15.** Debugging an extension:\
    \ Elements panel*\n\n## Sources and Resources Panel\n\nThe other panels that can\
    \ be useful during debugging include the Sources panel and the Resources panel.\
    \ Using the Sources panel, you can debug the JavaScript code by setting *breakpoints*\
    \ in the script. In order to do that, you first need to select the particular\
    \ script (see Figure 1-16) that needs to be debugged. Next, click the line number\
    \ of the line where you want to set the breakpoint. Finally (while staying inside\
    \ the DevTools window), reload the DevTools window to activate the breakpoint(s).\n\
    \n![index-38_1.jpg](index-38_1.jpg)\n\n***Figure 1-16.** Debugging an extension:\
    \ Sources panel*\n\n> **Note** You can also add multiple breakpoints to scripts\
    \ in the Sources panel by clicking each line’s line number.\n\nUsing the Resources\
    \ panel, you can inspect the other resources that are loaded, such as local storage\
    \ and session storage. We won’t, however, use these kinds of storage for the purposes\
    \ of this book, as the Google Chrome Extensions framework provides a better storage\
    \ API for the extensions. It which allows syncing of the stored data across multiple\
    \ devices, which is not provided by the `localStorage` and `sessionStorage` APIs.\n\
    \nYou can still experiment with their use in the extensions you develop. Inspecting\
    \ the storage via the Resources panel is extremely easy. As displayed in Figure\
    \ 1-17, all you need to do is simply select the resource item with the kind of\
    \ storage you need to inspect.\n\n![index-39_1.jpg](index-39_1.jpg)\n![index-39_2.jpg](index-39_2.jpg)\n\
    \n***Figure 1-17.** Debugging an extension: Resources panel*\n\n## Console Panel\n\
    \nThe Console panel is a typical (JavaScript) REPL in the Chrome DevTools window.\
    \ Using it, not only can you log diagnostic information, you can also use it as\
    \ a shell to interact with the JavaScript on the page. The Console panel is displayed\
    \ in Figure 1-18.\n\n***Figure 1-18.** Debugging an extension: Console panel*\n\
    \nIn the context of extension development, it means you can use the Console panel\
    \ to log data from the scripts. The way you can log data is using the `console.log()`\
    \ method. This method takes a variable list of JavaScript objects to output.\n\
    \n> **Note** Use the `console.clear()` method to clear the console log.\n\nIn\
    \ addition to this, using the Console panel you can also interact with the various\
    \ APIs provided by the Google Chrome Extensions framework. Recall that all this\
    \ is in the context of extension development, so such APIs are only available\
    \ to the (scripts or) pages that belong to an extension. For example, in the ShowTime\
    \ extension you developed, you can also add the following lines of code to log\
    \ if incognito access is available to the extension. In fact, you can directly\
    \ execute this code in the Console panel (while inspecting the popup).\n\n```\n\
    chrome.extension.isAllowedIncognitoAccess(function(isAllowed) {\n    console.log(isAllowed);\n\
    });\n```\n\nAs you learn more about the other components used to build extensions,\
    \ you will find that the Console panel is an indispensable tool to help you quickly\
    \ debug your extensions. It will be demonstrated more in the upcoming topics where\
    \ you create new extensions. For now, let’s explore how to distribute extensions\
    \ via the Chrome Web Store.\n\n## Distributing on Store\n\nOnce you create your\
    \ awesome extension, you will soon find the need to distribute it on the Chrome\
    \ Web Store. This will help you market your app, extension, or theme to a multitude\
    \ of users in search of such products for their Chrome browsers. The way the Chrome\
    \ Web Store allows you to distribute your extensions is via its Developer Dashboard.\
    \ At the time of writing, the Developer Dashboard is available at the following\
    \ URL: [https://chrome.google.com/webstore/developer/dashboard](https://chrome.google.com/webstore/developer/dashboard).\
    \ In this section, we’ll go step by step to upload the ShowTime extension to the\
    \ Chrome Web Store.\n\n1.  Tab over to the following URL, which is the Developer\
    \ Dashboard: [https://chrome.google.com/webstore/developer/dashboard](https://chrome.google.com/webstore/developer/dashboard).\
    \ If you are not logged in to a Google account, you will be asked to do so, as\
    \ displayed in Figure 1-19. Upon successful login, you will be redirected to the\
    \ Developer Dashboard shown in Figure 1-20.\n\n    ![index-41_1.jpg](index-41_1.jpg)\n\
    \    ![index-41_2.jpg](index-41_2.jpg)\n\n    ***Figure 1-19.** Distributing an\
    \ extension: Logging into a Google account*\n    ***Figure 1-20.** Distributing\
    \ an extension: Using the dashboard*\n\n    > **Note** The Google Account ID does\
    \ not necessarily have to be a Gmail ID, but commonly, it is.\n\n2.  Once you\
    \ are in the Developer Dashboard, you need to review the basic information about\
    \ your developer account. At the time of writing, this information can be reviewed\
    \ before paying the developer’s registration fee.\n\n    > **Note** A one-time\
    \ developer registration fee of U.S. $5.00 is required to verify your account\
    \ and publish items.\n\n3.  Next, you need to pay the developer registration fee.\
    \ It is a one-time fee, required to verify your account and publish items. At\
    \ the time of writing, it amounts to U.S. $5.00. Click Pay This Fee Now button\
    \ to initiate the payment process.\n4.  As displayed in Figures 1-21 and 1-22,\
    \ you need to add a payment method to pay with. If you already have a payment\
    \ method associated with your Google account, you can proceed to the next step.\n\
    \n    ***Figure 1-21.** Distributing an extension: Selecting a payment method*\n\
    \    ![index-43_1.jpg](index-43_1.jpg)\n\n    ***Figure 1-22.** Distributing an\
    \ extension: Adding a new payment method*\n\n5.  Review your purchase (see Figure\
    \ 1-23) and then click Buy to proceed to the next step.\n\n    ![index-44_1.jpg](index-44_1.jpg)\n\
    \    ![index-44_2.jpg](index-44_2.jpg)\n\n    ***Figure 1-23.** Distributing an\
    \ extension: Reviewing the purchase*\n\n6.  Finally, you can start the payment\
    \ gateway by clicking the Start Now button, shown in Figure 1-24."
