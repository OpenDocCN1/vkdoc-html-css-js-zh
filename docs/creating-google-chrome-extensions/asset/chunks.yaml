    Creating and Removing a Tab


    To create a tab, use the chrome.tabs.create method . This method takes two parameters-
    createProperties (of type object ) and callback (of type function ). The createProperties
    object supports the following useful properties- index , url , active , and pinned
    . The callback function receives an argument of type Tab ( tabs.Tab ). A tab can
    also be duplicated by calling the chrome.tabs.duplicate method, as shown in


    [Listing 3-29](#index_split_001.html#p156) (see the commented-out section in the
    createAndUpdateTab function).


    Use the chrome.tabs.remove method to close one or more tabs. This method takes
    the ID of the tab to close, or a list of such IDs as its first parameter. It also
    supports an optional callback function as its second parameter.


    Updating a Tab


    Use the chrome.tabs.update method to modify the properties of a tab. This method
    takes three parameters- tabId , updateProperties , and callback . As you might
    have guessed, tabId is the ID of the tab to update. The callback function receives
    the details of the updated tab via the tab argument. The updateProperties object
    specifies the properties to update. Only the following properties are supported-
    url , active , highlighted , pinned , muted , and openerTabId . Note that you
    can also reload a tab by calling the chrome.tabs.reload method. This method takes
    the ID of the tab to reload as its first parameter and an optional callback function
    as its second parameter.


    ***Listing 3-30.*** Ch[apter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)
    /TabsAPI/ manifest.json


    {


    "manifest_version" : 2,


    "name" : "API Demos: tabs API",


    "description" : "Demonstrates use of the tabs API",


    "version" : "1.2",


    "background" : {


    "scripts" : ["event_script.js"],


    "persistent" : false


    },


    "browser_action" : {


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    "default_icon" : "icon.png"


    },


    "permissions" : [


    "tabs",


    "<all_urls>"


    ]


    }


    ■ **Note** To zoom a specified tab, use the chrome.tabs.setZoom method. Additionally,
    to get the current zoom factor of a specified tab, use the chrome.tabs.getZoom
    method.


    Capturing a Tab


    To capture the visible area of the currently active tab in the specified window,
    use the chrome.tabs.captureVisibleTab method . This method takes three parameters-windowId
    , options , and callback . The windowId parameter is optional, and it defaults
    to the current window. The options parameter is used to specify the format of
    the image.


    The callback function receives the dataUrl (string) argument-which is a URL referring
    to the data containing the encoded image of the visible area of the captured tab.
    Note that the dataUrl can be assigned to the src property of an HTML img element,
    as shown in


    [Listing 3-29 . An im](#index_split_001.html#p156)age corresponding to this is
    shown in Figur[e 3-36 . Also note th](#index_split_001.html#p146)at this method
    requires an additional permission- <all_urls> —shown [in Listing 3-30](#index_split_001.html#p157)
    .


    Associated Events


    The chrome.tabs API provides a long list of events corresponding to almost every
    available method. For example, the onCreated , onUpdated , onRemoved , onZoomChange
    , etc., events. The complete list of such events is available at [https://developer.chrome.](https://developer.chrome.com/extensions/tabs)


    [com/extensions/tabs .](https://developer.chrome.com/extensions/tabs)


    XHR API


    An extension can talk to remote servers (using the XMLHttpRequest object) by requesting
    cross-origin permissions. Such permissions are requested with the help of *match
    patterns* that provide access to one or more hosts (see “*://localhost/*” [in
    Listing 3-31](#index_split_001.html#p158) ).


    ***Listing 3-31.*** Chapter [3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)
    /XHRAPI/manifest.json


    {


    "manifest_version" : 2,


    "name" : "API Demos: xhr API",


    "description" : "Demonstrates use of the xhr API",


    "version" : "1.2",


    "background" : {


    "scripts" : ["event_script.js"],


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    "persistent" : false


    },


    "permissions" : [


    "*://localhost/*"


    ]


    }


    Once the host permission is requested, the XHR API can be used, similarly to the
    way it is used in regular web pages. In [Listing 3-32 , note th](#index_split_001.html#p159)at
    the ucService (PHP script to uppercase the input string) is served from my local
    HTTP server. The PHP script is av[ailable in Listing 3-33 .](#index_split_001.html#p159)


    ***Listing 3-32.*** Ch[apter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)
    /XHRAPI/event_script.js


