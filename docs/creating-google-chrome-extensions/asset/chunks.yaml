  trans: "\n我们不会深入探讨 Chrome DevTools 的细节，因为 Google 开发者社区已经为新手和有经验的 Web 开发者提供了优秀的资源，帮助他们熟悉如何在\
    \ Chrome 浏览器上调试 Web 应用。以下 URL 即可访问：[`developers.google.com/web/tools/chrome-devtools/`](https://developers.google.com/web/tools/chrome-devtools/)。\n\
    \n![index-36_1.jpg](img/index-36_1.jpg)\n\n## 检查弹出窗口\n\n你可以进行的第一种调试是检查弹出窗口。为此，只需右键点击弹出窗口（在点击浏览器按钮后窗口弹出时执行此操作），然后选择“检查元素”，如图\
    \ 1-14 所示。\n\n***图 1-14.** 调试扩展：检查弹出窗口*\n\n> **注意** 另一种检查弹出窗口的方法是选择“检查弹出窗口”菜单项，该菜单项在你右键点击扩展图标（即浏览器按钮）时会显示。\n\
    \n如图 1-15 所示，Chrome DevTools 窗口将会出现，并默认选中“元素”面板。你可以使用此面板以迭代的方式编辑样式，甚至编辑 DOM，从而查看哪种设计效果最佳。\n\
    \n![index-37_1.jpg](img/index-37_1.jpg)\n\n***图 1-15.** 调试扩展：元素面板*\n\n## 源代码面板和资源面板\n\
    \n调试过程中其他有用的面板包括“源代码”面板和“资源”面板。使用“源代码”面板，你可以通过在脚本中设置*断点*来调试 JavaScript 代码。为此，首先需要选择要调试的特定脚本（见图\
    \ 1-16）。然后，点击你想要设置断点的行号。最后（在 DevTools 窗口内），重新加载 DevTools 窗口以激活断点。\n\n![index-38_1.jpg](img/index-38_1.jpg)\n\
    \n***图 1-16.** 调试扩展：源代码面板*\n\n> **注意** 你也可以在“源代码”面板中通过点击每行的行号，为脚本添加多个断点。\n\n使用“资源”面板，你可以检查其他已加载的资源，例如本地存储和会话存储。然而，出于本书的目的，我们不会使用这类存储，因为\
    \ Google Chrome 扩展框架提供了一个更好的存储 API。该 API 允许存储的数据跨多个设备同步，这是 `localStorage` 和 `sessionStorage`\
    \ API 所不具备的功能。\n\n你仍然可以在开发的扩展中尝试使用它们。通过“资源”面板检查存储极其简单。如图 1-17 所示，你只需选择与你要检查的存储类型相对应的资源项即可。\n\
    \n![index-39_1.jpg](img/index-39_1.jpg)\n![index-39_2.jpg](img/index-39_2.jpg)\n\
    \n***图 1-17.** 调试扩展：资源面板*\n\n## 控制台面板\n\n“控制台”面板是 Chrome DevTools 窗口中的一个典型（JavaScript）REPL\
    \ 环境。使用它，你不仅可以记录诊断信息，还可以将其用作 shell，与页面上的 JavaScript 进行交互。控制台面板如图 1-18 所示。\n\n\
    ***图 1-18.** 调试扩展：控制台面板*\n\n在扩展开发的背景下，这意味着你可以使用控制台面板来记录脚本中的数据。记录数据的方法是使用 `console.log()`\
    \ 方法。该方法接受一个可变数量的 JavaScript 对象列表作为输出。\n\n> **注意** 使用 `console.clear()` 方法清除控制台日志。\n\
    \n除此之外，使用控制台面板，你还可以与 Google Chrome 扩展框架提供的各种 API 进行交互。请记住，所有这些都是在扩展开发的上下文中进行的，因此此类\
    \ API 仅对属于扩展的（脚本或）页面可用。例如，在你开发的 ShowTime 扩展中，你可以添加以下代码行来记录扩展是否拥有隐身访问权限。事实上，你可以直接在控制台面板中执行此代码（在检查弹出窗口时）。\n\
    \n```\nchrome.extension.isAllowedIncognitoAccess(function(isAllowed) {\n    console.log(isAllowed);\n\
    });\n```\n\n随着你对构建扩展的其他组件了解得更多，你会发现控制台面板是一个不可或缺的工具，可以帮助你快速调试扩展。在接下来的创建新扩展的章节中，将更详细地演示其用法。现在，让我们来探讨如何通过\
    \ Chrome 网上应用店分发扩展。\n\n## 在应用商店分发\n\n一旦你创建了出色的扩展，很快你就会发现需要将其分发到 Chrome 网上应用店。这将帮助你向大量正在为其\
    \ Chrome 浏览器寻找此类应用的、主题或扩展的用户推广你的产品。Chrome 网上应用店允许你通过其开发者控制面板来分发扩展。在撰写本书时，开发者控制面板的访问网址为：[`chrome.google.com/webstore/developer/dashboard`](https://chrome.google.com/webstore/developer/dashboard)。在本节中，我们将逐步演示如何将\
    \ ShowTime 扩展上传到 Chrome 网上应用店。\n\n1.  导航至以下 URL，即开发者控制面板：[`chrome.google.com/webstore/developer/dashboard`](https://chrome.google.com/webstore/developer/dashboard)。如果你未登录\
    \ Google 账号，系统将要求你登录，如图 1-19 所示。登录成功后，你将被重定向到如图 1-20 所示的开发者控制面板。\n\n    ![index-41_1.jpg](img/index-41_1.jpg)\n\
    \    ![index-41_2.jpg](img/index-41_2.jpg)\n\n    ***图 1-19.** 分发扩展：登录 Google\
    \ 账号*\n    ***图 1-20.** 分发扩展：使用控制面板*\n\n    > **注意** Google 账号 ID 不一定是 Gmail ID，但通常情况下的确如此。\n\
    \n2.  进入开发者控制面板后，你需要查看开发者账号的基本信息。在撰写本书时，可以在支付开发者注册费之前查看这些信息。\n\n    > **注意** 需要支付一次性开发者注册费\
    \ 5.00 美元，以验证你的账号并发布项目。\n\n3.  接下来，你需要支付开发者注册费。这是一次性费用，用于验证你的账号并发布项目。在撰写本书时，费用为\
    \ 5.00 美元。点击“立即支付此费用”按钮启动支付流程。\n4.  如图 1-21 和图 1-22 所示，你需要添加一种支付方式来进行支付。如果你的 Google\
    \ 账号已关联支付方式，可以直接进入下一步。\n\n    ***图 1-21.** 分发扩展：选择支付方式*\n    ![index-43_1.jpg](img/index-43_1.jpg)\n\
    \n    ***图 1-22.** 分发扩展：添加新支付方式*\n\n5.  核对你的购买信息（见图 1-23），然后点击“购买”进入下一步。\n\n \
    \   ![index-44_1.jpg](img/index-44_1.jpg)\n    ![index-44_2.jpg](img/index-44_2.jpg)\n\
    \n    ***图 1-23.** 分发扩展：核对购买信息*\n\n6.  最后，你可以点击如图 1-24 所示的“立即开始”按钮，启动支付网关。\n"
- fmt: "**Figure 1-24.** Distributing an extension: Confirming the purchase\n\nCHAPTER\
    \ 1 ■ INTRODUCTION TO GOOGLE CHROME EXTENSIONS\n\n7. Upon successful completion\
    \ of the payment process, a window will be displayed from `Google Wallet`, thanking\
    \ you for the purchase. As displayed in Figure 1-25, click Done to return to the\
    \ Developer Dashboard.\n\n**Figure 1-25.** Distributing an extension: Completing\
    \ the purchase\n\n**Note** Currency fluctuations, bank fees, and applicable taxes\
    \ may change your final amount.\n\n8. In the Developer Dashboard, click the `Add\
    \ New Item` button (see Figure 1-26) to upload a new extension to your dashboard.\n\
    \nCHAPTER 1 ■ INTRODUCTION TO GOOGLE CHROME EXTENSIONS\n\n**Figure 1-26.** Distributing\
    \ an extension: Adding a new extension\n\n9. Here, you need to upload a zipped\
    \ package of your extension folder. For that, you will have to click the `Choose\
    \ File` button seen in Figure 1-27. But before you do, there are some quick additions\
    \ you need to make to the `ShowTime` extension.\n\n**Figure 1-27.** Distributing\
    \ an extension: Uploading the zipped package\n\n10. As shown in Listing 1-1, you\
    \ need to add the `icons` attribute to the manifest file. This attribute takes\
    \ an object value (i.e. `{}`) of the following key-value pairs:\n    a. `\"16\"\
    \ : \"icon16.png\"`: This 16px icon is used as the favicon for an extension's\
    \ pages.\n    b. `\"48\" : \"icon48.png\"`: This 48px icon is used on the Extensions\
    \ Management page (as displayed in Figure 1-28).\n    c. `\"128\" : \"icon128.png\"\
    `: This 128px icon is used during installation and in the Chrome Web Store.\n\n\
    CHAPTER 1 ■ INTRODUCTION TO GOOGLE CHROME EXTENSIONS\n\n**Figure 1-28.** Distributing\
    \ an extension: 48px icon\n\n11. Now that you have added the `icons` attribute\
    \ to the manifest, you also need to add the corresponding images. You can create\
    \ your own or use the ones provided in the Exercise Files folder for Chapter 1\
    \ (see Figure 1-29). Note that the keys `16`, `48`, and `128` represent the (relative)\
    \ paths to the PNG image resources to be used.\n\n**Figure 1-29.** Distributing\
    \ an extension: Adding the icons\n\n12. Finally, you can create a zipped package\
    \ of this extension folder and resume from Step 9.\n\n13. After choosing the zipped\
    \ package, click the `Upload` button (see Figure 1-30).\n\nCHAPTER 1 ■ INTRODUCTION\
    \ TO GOOGLE CHROME EXTENSIONS\n\n**Figure 1-30.** Distributing an extension: Uploading\
    \ the `ShowTime` zipped package\n\n14. Upon successful uploading of the zipped\
    \ package, the dashboard will reload (see Figure 1-31) to reflect the changes.\n\
    \n**Figure 1-31.** Distributing an extension: Uploading the `ShowTime` zipped\
    \ package\n\nCHAPTER 1 ■ INTRODUCTION TO GOOGLE CHROME EXTENSIONS\n\n15. If your\
    \ manifest file is malformed (or there are any other related flaws, for example\
    \ missing image resources, etc.), an error will be shown at this stage, as displayed\
    \ in Figure 1-32.\n\n**Figure 1-32.** Distributing an extension: Uploading the\
    \ `ShowTime` zipped package\n\n16. You then enter the edit mode for your extension\
    \ (see Figure 1-33). You are free to fill in the fields the way you want.\n\n\
    CHAPTER 1 ■ INTRODUCTION TO GOOGLE CHROME EXTENSIONS\n\n**Figure 1-33.** Distributing\
    \ an extension: Editing the draft\n\n17. Finally, you can either publish the changes\
    \ you made, which will also publish the extension on the store, or you can choose\
    \ to save the draft. You may also discard the current draft if you want to try\
    \ again. For now, save the draft by clicking on `Save Draft and Return to Dashboard`,\
    \ as displayed in Figure 1-34."
