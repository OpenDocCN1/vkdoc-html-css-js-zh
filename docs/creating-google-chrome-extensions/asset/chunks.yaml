    Background Scripts


    Event scripts persist only as long as the events being listened to are getting
    triggered.


    When events are not getting triggered, event scripts are made inactive by the
    Chrome browser (note that this does not happen immediately), as displayed in Figur[e
    2-15 .](#index_split_000.html#p73)


