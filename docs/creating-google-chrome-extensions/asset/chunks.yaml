    In Listing [3-15 , note the use of](#index_split_001.html#p125) chrome.tabs.query
    method to get the (currently) active tab. As described earlier, the chrome.tabs.sendMessage
    method is used to send message to the content script. This method takes the following
    parameters .


    • tabID


    • message


    • responseCallback


    The tabID is the ID of the tab to send messages to. The message parameter is the
    message to send. In this case, it is a string “Test message X” . And similar to
    the previously discussed extensions, responseCallback is a callback function that
    is used by the receiver of the sent message.


