    \ 函数会测试待追加的书签节点，其 URL 是否与主机名 `developer.chrome.com` 匹配。\n\n相应的输出如 图 4-6 所示。\n\n\
    **清单 4-6.** [第 4 章](http://dx.doi.org/10.1007/978-1-4842-1775-7_4)/OverridePages/`myNewTab_1.js`\n\
    \n```javascript\n//region {calls}\ndocument.addEventListener(\"DOMContentLoaded\"\
    ,function(dcle) {\n  var listElement = document.getElementById(listName);\n  chrome.bookmarks.getTree(function(bookmarkTreeAsArray)\
    \ {\n    var bookmarkTree = bookmarkTreeAsArray[0];\n    if(bookmarkTree.children)\
    \ {\n      bookmarkTree.children.forEach(function(node) {\n        if(node.children.length\
    \ > 0) folders.push(node);\n      });\n    }\n    //populateList(listElement);\n\
    \    populateListV2(listElement);\n  });\n});\n//end-region\n```\n\n![带有书签的新标签页](img/index-171_1.jpg)\n\
    \n**图 4-6.** 带有书签的新标签页\n\n## 为 Google Chrome 创建主题\n\n主题是一种特殊的扩展程序，它可以改变浏览器外观。主题的打包方式与普通扩展程序相同，但请注意，*主题不包含\
    \ JavaScript 或 HTML 代码*。您可以试用 Chrome 网上应用商店中提供的主题。以下 URL 将直接带您进入主题 [类别：https://chrome.google.com/webstore/category/themes](https://chrome.google.com/webstore/category/themes)。\n\
    \n> **注意** 将扩展程序或主题上传到开发者信息中心没有任何区别，因为主题也是一种扩展程序。\n\n创建主题非常简单，因为它只需要几张图片和清单文件中的几行代码即可。\
    \ 图 4-7 显示了主题扩展程序所使用的图片，这些图片位于[第 4 章](http://dx.doi.org/10.1007/978-1-4842-1775-7_4)的练习文件文件夹中。清单\
    \ 4-7 包含了此扩展程序对应的清单文件代码。\n\n**清单 4-7.** [第 4 章](http://dx.doi.org/10.1007/978-1-4842-1775-7_4)/主题/`manifest.json`\n\
    \n```json\n{\n  \"manifest_version\" : 2,\n  \"name\" : \"HelloTheme\",\n  \"\
    version\" : \"1.2\",\n  \"theme\" : {\n    \"images\" : {\n      \"theme_frame\"\
    \ : \"images/theme_frame_golden.png\",\n      \"theme_toolbar\" : \"images/theme_toolbar_silver.png\"\
    ,\n      \"theme_ntp_background\" : \"images/theme_ntp_background.png\",\n   \
    \   \"theme_ntp_attribution\" : \"images/theme_ntp_attribution.png\"\n    },\n\
    \    \"colors\" : {\n      \"tab_text\" : [0,0,0],\n      \"ntp_text\" : [255,255,255],\n\
    \      \"button_background\" : [0,0,255]\n    },\n    \"tints\" : {\n      \"\
    buttons\" : [0.0,0.0,0.0],\n      \"frame\" : [-1.0,-1.0,-1.0],\n      \"frame_inactive\"\
    \ : [-1.0,-1.0,0.3],\n      \"frame_incognito\" : [-1.0,-1.0,0.2],\n      \"frame_incognito_inactive\"\
    \ : [-1.0,-1.0,0.0]\n    }\n  }\n}\n```\n\n**图 4-7.** 主题扩展程序所使用的图片\n\n> **注意**\
    \ 练习文件文件夹中提供了 SVG 文件，以便您自定义用于创建主题图片的形状。\n\n主题支持图像、颜色和色调元素。要创建主题，您需要为主题清单属性（参见清单\
    \ 4-7）定义这些元素。除此之外，您还需要定义与这些元素对应的属性。以下是一些最常用的属性及其说明。\n\n- `theme_frame` — 窗口的框架，即标签页后面的区域。\n\
    - `theme_toolbar` — 当前标签页和工具栏的共同主题。\n- `theme_ntp_background` — 新标签页的背景图片。\n-\
    \ `theme_ntp_attribution` — 新标签页的署名图片。\n- `tab_text` — 当前标签页标题中文本的颜色。\n- `ntp_text`\
    \ — 新标签页中所有文本的颜色。\n- `button_background` — 所有窗口按钮（例如，最小化、关闭等）的背景颜色。\n- `buttons`\
    \ — 可应用于 Chrome 工具栏中各种按钮的颜色色调。\n- `frame` — 可应用于 Chrome 框架的颜色色调。\n- `frame_inactive`\
    \ — 当 Chrome 窗口处于非活动状态时应用的颜色色调。\n- `frame_incognito` — 在隐身模式下应用于框架的颜色色调。\n- `frame_incognito_inactive`\
    \ — 与 `frame_incognito` 相同，但适用于窗口（在隐身模式下）处于非活动状态时。\n\n![应用了主题的新标签页](img/index-174_1.jpg)\n\
    \n**图 4-8.** 应用了主题的新标签页\n\n> **注意** 主题不包含 JavaScript 或 HTML 代码。\n\n图 4-8 显示了应用了主题后的新标签页。请注意窗口的金色框架，这是通过\
    \ `theme_frame` 属性指定的。也要注意新标签页的背景图片。它是通过 `theme_ntp_background` 属性指定的。要指定署名图片，请使用\
    \ `theme_ntp_attribution` 属性。在提供的扩展程序中，署名图片是 `theme_ntp_attribution.png`，它是一个带有黄色徽标的圆形图片（见图\
    \ 4-8 右下角）。\n\n![隐身模式下的主题](img/index-175_1.jpg)\n![隐身模式下的主题](img/index-175_2.jpg)\n\
    \n**图 4-9.** 隐身模式下的主题\n\n> **注意** 色调采用色相-饱和度-明度格式，使用 0 到 1.0 范围内的浮点数。值为 -1.0 表示不做任何更改。\n\
    \n对于隐身模式，您可以将颜色色调应用于现有样式。例如，在图 4-9 中，请注意应用于窗口框架的颜色色调。此色调是使用 `frame_incognito`\
    \ 属性（参见清单 4-7）应用的。类似地，颜色色调也可以应用于非活动模式的不同样式。在图 4-10 中，请注意活动窗口（在前面）和非活动窗口（非活动窗口在后面，并且框架颜色更深）之间的区别。\n\
    \n**图 4-10.** 非活动窗口的颜色色调（后窗口）\n\n## 扩展程序开发：安全注意事项\n\n到目前为止，您已经了解到扩展程序拥有某些权限，使其能够超越常规网页脚本的能力。因此，在编写扩展程序时需要具有安全意识。否则，可能会在用户数据的隐私方面影响用户，涉及已访问、正在访问以及将要访问的数据。以下主题讨论了一些使扩展程序更加安全的有用方法，以及扩展程序框架在后端处理安全性的方式。\n\
    \n### API 权限\n\n第一层安全防护由扩展程序框架中的权限架构自动提供。API 权限有助于在扩展程序或应用被恶意软件入侵时限制其造成的损害。例如，如果一个操作书签的扩展程序拥有\
    \ `bookmarks` 权限，它就无法影响用户的下载内容，仅仅是因为它没有 `downloads` 权限。因此，您可以看到，*绝不要在清单中请求不必要的权限*，因为如果扩展程序或应用被入侵，这将削弱用户的安全性。\n\
    \n此外，某些权限在安装扩展程序（或应用）之前，也会作为警告显示给用户。请注意，您可以在以下 URL 了解更多关于这些警告的信息：[`developer.chrome.com/extensions/permission_warnings`](https://developer.chrome.com/extensions/permission_warnings)。\n\
    \n### 匹配模式权限\n"
- fmt: "# Similar to the permissions for APIs, *match patterns* provide access to\
    \ one or more hosts (for use with the XHR API). To prevent damage to the extension\
    \ or to the user’s security, you should *only allow white-listed hosts in your\
    \ extensions,* or in fact, the exact white-listed remote service that your extension\
    \ needs to use.\n\n## Externally Connectable\n\nAs discussed previously in the\
    \ “Web Page Scripts and Event Scripts” section (in Chapter 3), for an extension\
    \ to be able to receive messages from external web pages (or other extensions),\
    \ the `externally_connectable` attribute is required in the manifest.\n\nFor the\
    \ `ids` and `matches` keys, you should specify the IDs of the extensions, and\
    \ the URL patterns of the external web pages (respectively) that need to send\
    \ messages to the extension. This way, you can avoid unsolicited messages to your\
    \ extensions, and *specifically choose the sources you want to communicate with*.\n\
    \n## Storage\n\nThe `storage` API is an optimized API provided by the Extensions\
    \ framework to meet the specific storage needs of the extensions. However, an\
    \ important point to note is that the storage provided is not encrypted. So, confidential\
    \ user information should never be stored using this API.\n\nTo store user data\
    \ for your extension, you can use `storage.sync` or `storage.local`.\n\nWhen using\
    \ `storage.sync`, the stored data will automatically be synced to any Chrome browser\
    \ that the user is logged in to, provided the user has sync enabled.\n\nWhen Chrome\
    \ is offline, Chrome stores the data locally. The next time the browser is online,\
    \ Chrome syncs the data. Even if a user disables syncing, `storage.sync` will\
    \ still work. In this case, it will behave identically to `storage.local`.\n\n\
    To use the `storage.sync` API, the following calls need to be made. To read more\
    \ about this API, you can refer back to the topic “Storage API” in the previous\
    \ chapter.\n\n```\nchrome.storage.sync.get(string or array of string or object\
    \ keys, function callback)\nchrome.storage.sync.set(object items, function callback)\n\
    ```\n\n## Content Script\n\nWhen writing a content script, you should be aware\
    \ of two security issues. First, be careful not to introduce security vulnerabilities\
    \ into the web page your content script is injected into. For example, if your\
    \ content script receives data from a remote server (for example, via the XHR\
    \ API), be careful to filter that data for cross-site scripting attacks before\
    \ injecting it into the current web page. For example, it’s better to inject data\
    \ via `innerText` rather than `innerHTML`.\n\n> **Note:** Content scripts execute\
    \ in a special environment called an *isolated world*. They have access to the\
    \ DOM of the web page they are injected into, but not to any JavaScript variables\
    \ or functions created by the web page. It looks to each content script as if\
    \ there is no other JavaScript executing on the web page it is running on. The\
    \ same is true in reverse: JavaScript running on the web page cannot call any\
    \ functions or access any variables defined by content scripts. Isolated worlds\
    \ allow each content script to make changes to its JavaScript environment without\
    \ worrying about conflicting with the web page or with other content scripts.\n\
    \nIt’s worth noting what happens with JavaScript objects that are shared by the\
    \ web page and the extension—for example, the `window.onload` event. Each isolated\
    \ world sees its own version of the object. Assigning to the object affects your\
    \ independent copy of the object. For example, both the web page and extension\
    \ can assign to `window.onload`, but neither one can read the other’s event handler.\
    \ The event handlers are called in the order in which they were assigned.\n\n\
    Second, although running your content script in an isolated world provides some\
    \ protection from the web page, a malicious web page (or remote service, accessed\
    \ via the XHR API) might still be able to attack your content script if you use\
    \ data from the web page (or service) indiscriminately. For example, using the\
    \ `eval` method to parse this data allows it to be executed, enabling malicious\
    \ code to execute from within your extension. To avoid this, *choose safer (parsing)\
    \ APIs that do not execute code,* such as the `JSON.parse` method.\n\n## Summary\n\
    \nThis chapter discussed the remaining features of Google Chrome Extensions, such\
    \ as options page, override pages, and themes. The `OverridePages` extension described\
    \ in this chapter overrides the New Tab page. The use of an options page was also\
    \ demonstrated in this extension. This page provided a single option to save a\
    \ user preference for the `OverridePages` extension.\n\nThe `Themes` extension\
    \ displayed a simple theme for the browser—providing colored frames for the window,\
    \ a background image for the New Tab page, and color tints for the incognito and\
    \ inactive windows. Finally, some security concerns were described, and their\
    \ corresponding remedies were also discussed. The issues that were described included\
    \ API permissions, *match pattern* permissions, the `externally_connectable` attribute,\
    \ storage, and content-script injection.\n\nThis chapter concludes the book. You\
    \ discovered what Google Chrome Extensions are, learned how to create them, learned\
    \ about extension components and messaging, and publishing of extensions on the\
    \ Chrome Web Store (formerly the Google Chrome Extensions Gallery). So now it’s\
    \ time for you to leverage the power of the Google Chrome browser by creating\
    \ your own awesome extensions!\n\n# Index\n\n## A\n- `chrome.runtime.sendMessage`\
    \ method, 105\n- Alarms API, 121–124\n- Architecture, Chrome Extensions\n  - components,\
    \ 40–41\n  - input components, 36–39\n  - manifest, 40–41\n  - popup, 37–39\n\
    \  - scripting, 36–39\n  - user perspective, 35\n- `chrome.runtime.connect` method,\
    \ 101\n- Content scripts\n  - Chrome Extensions API, 62\n  - Content UI, 62\n\
    \  - DOM API, 62\n  - HelloContentScript Extension, 65–68\n  - manifest, 63–64\n\
    \n## B\n- Browser-Action button, 9, 12\n- BrowserActionNotes Extension\n  - Browser-Action\
    \ component, 69\n  - console panel, popup, 73\n  - `loadNoteForActiveURL` function,\
    \ 72\n  - popup component, 69–70\n  - `popup_script.js`, 71–72, 74\n  - resources\
    \ panel, 70\n  - setting badge text, 73\n  - `textarea` element, 72\n- Browser-Action\
    \ popup, 37\n\n## C\n- Chrome Web Store, 11\n- Content scripts and event scripts\n\
    \  - `chrome.runtime.sendMessage` method, 103\n  - `connect` and `sendMessage`\
    \ methods, 103\n  - Console panel, 103, 107\n  - `content_script.js`, 104\n  -\
    \ `event_script.js`, 105\n  - `extensionID` parameter, 105\n  - `manifest.json`,\
    \ 106–107\n  - popup inspecting, 106\n  - `runtime.onMessage`, 103\n  - `runtime.onMessageExternal`\
    \ and `runtime.onConnectExternal` events, 103\n- Content scripts and web page\
    \ scripts\n  - bookmarks API, 113–114\n  - `button` element, 112\n  - `content_script.js`,\
    \ 113\n  - `content_scripts` attribute, 111\n  - `manifest.json`, 112\n  - `postMessage`\
    \ method—`window.postMessage`, 112\n  - `runtime.onMessageExternal` and `runtime.onConnectExternal`\
    \ events, 111\n  - `webpage_script.js`, 114\n  - `window.addEventListener(“message”,\
    \ function(me){/**/})`, 112\n  - `window.postMessage` method, 111\n  - `window.postMessage(message,“*”)`,\
    \ 112\n- Context menu items\n  - `contextMenus` permission, 85\n  - item creation\n\
    \    - `addEventListener` method, 93\n    - `browser_action` and `page_action`\
    \ contexts, 87\n    - `chrome.contextMenus.create` method, 89\n    - `chrome.runtime.lastError`\
    \ object, 89\n    - `documentUrlPatterns` property, 88\n    - `event_script.js`,\
    \ 87–89, 93\n    - HelloContextMenuItem extension, 88\n    - `ID_CONTEXT_MENU_ITEM_HELLO`\
    \ variable, 87\n    - `info` object, 90\n    - `info.menuItemId` property, 90\n\
    \    - `onClicked` event, 89\n\n## E, F\n- Event scripts\n  - API features, 52\n\
    \  - background scripts, 55–56\n  - Browser-Action and Page-Action components,\
    \ 51\n  - BrowserActionNotes, 53\n  - `chrome.runtime` object, 51\n  - `chrome.runtime.onMessageExternal`\
    \ event, 52\n  - content scripts, 52\n  - `declarativeContent` API `addRules`/`removeRules`,\
    \ 60"
  raw: 'Similar to the permissions for APIs, *match patterns* provide access to one
    or more hosts (for use with the XHR API). To prevent damage to the extension or
    to the user’s security, you should *only allow white-listed hosts in your extensions,*
    or in fact, the exact white-listed remote service that your extension needs to
    use.


    Externally Connectable


    As discussed previously in the “Web Page Scripts and Event Scripts” section (in
    Ch[apter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3) ), for an extension
    to be able to receive messages from external web pages (or other extensions),
    the externally_connectable attribute is required in the manifest.


    For the ids and matches keys, you should specify the IDs of the extensions, and
    the URL patterns of the external web pages (respectively) that need to send messages
    to the extension. This way, you can avoid unsolicited messages to your extensions,
    and *specifically choose the sources you want to communicate with* .


    Storage


    The storage API is an optimized API provided by the Extensions framework to meet
    the specific storage needs of the extensions. However, an important point to note
    is that the storage provided is not encrypted. So, confidential user information
    should never be stored using this API.


    CHAPTER 4 ■ MORE ABOUT EXTENSIONS


    To store user data for your extension, you can use storage.sync or storage.local
    .


    When using storage.sync , the stored data will automatically be synced to any
    Chrome browser that the user is logged in to, provided the user has sync enabled.


    When Chrome is offline, Chrome stores the data locally. The next time the browser
    is online, Chrome syncs the data. Even if a user disables syncing, storage.sync
    will still work. In this case, it will behave identically to storage.local .


    To use the storage.sync API, the following calls need to be made. To read more
    about this API, you can refer back to the topic “Storage API” in the previous
    chapter.


    chrome.storage.sync.get(string or array of string or object keys, function callback)


    chrome.storage.sync.set(object items, function callback)


    Content Script


    When writing a content script, you should be aware of two security issues. First,
    be careful not to introduce security vulnerabilities into the web page your content
    script is injected into. For example, if your content script receives data from
    a remote server (for example, via the XHR API), be careful to filter that data
    for cross-site scripting attacks before injecting it into the current web page.
    For example, it’s better to inject data via innerText rather than innerHTML .


    ■ **Note** Content scripts execute in a special environment called an *isolated
    world* . They have access to the DOM of the web page they are injected into, but
    not to any JavaScript variables or functions created by the web page. It looks
    to each content script as if there is no other JavaScript executing on the web
    page it is running on. The same is true in reverse: JavaScript running on the
    web page cannot call any functions or access any variables defined by content
    scripts. Isolated worlds allow each content script to make changes to its JavaScript
    environment without worrying about conflicting with the web page or with other
    content scripts.


    It’s worth noting what happens with JavaScript objects that are shared by the
    web page and the extension—for example, the window.onload event. Each isolated
    world sees its own version of the object. Assigning to the object affects your
    independent copy of the object. For example, both the web page and extension can
    assign to window.onload , but neither one can read the other’s event handler.
    The event handlers are called in the order in which they were assigned.


    CHAPTER 4 ■ MORE ABOUT EXTENSIONS


    Second, although running your content script in an isolated world provides some
    protection from the web page, a malicious web page (or remote service, accessed
    via the XHR API) might still be able to attack your content script if you use
    data from the web page (or service) indiscriminately. For example, using the eval
    method to parse this data allows it to be executed, enabling malicious code to
    execute from within your extension. To avoid this, *choose safer (parsing) APIs
    that do not execute code,* such as the JSON.parse method.


    Summary


    This chapter discussed the remaining features of Google Chrome Extensions, such
    as options page, override pages, and themes. The OverridePages extension described
    in this chapter overrides the New Tab page. The use of an options page was also
    demonstrated in this extension. This page provided a single option to save a user
    preference for the OverridePages extension.


    The Themes extension displayed a simple theme for the browser—providing colored
    frames for the window, a background image for the New Tab page, and color tints
    for the incognito and inactive windows. Finally, some security concerns were described,
    and their corresponding remedies were also discussed. The issues that were described
    included API permissions, *match pattern* permissions, the externally_connectable
    attribute, storage, and content-script injection.


    This chapter concludes the book. You discovered what Google Chrome Extensions
    are, learned how to create them, learned about extension components and messaging,
    and publishing of extensions on the Chrome Web Store (formerly the Google Chrome
    Extensions Gallery). So now it’s time for you to leverage the power of the Google
    Chrome browser by creating your own awesome extensions!


