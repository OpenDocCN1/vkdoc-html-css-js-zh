    Google Chrome 扩展程序框架为扩展程序提供了许多专用 API，使你能够访问 Chrome 浏览器的强大功能。这些 API 几乎可以访问 Chrome
    浏览器中的所有可用功能！许多 API 已经讨论过了，尽管它们是在不同的上下文中描述的。例如，以下 API 被描述为输入组件：`chrome.omnibox`、`chrome.contextMenus`、`chrome.commands`、`chrome.pageAction`
    和 `chrome.browserAction`。本节将介绍以下 API：


    * `alarms`

    * `bookmarks`

    * `downloads`

    * `history`

    * `notifications`

    * `storage`

    * `tabs`


    > **注意** 扩展程序仍然可以使用浏览器为网页提供的所有标准 API（也称为标准 JavaScript API）。这些就是你熟悉的核心 JavaScript
    和文档对象模型（DOM）API。

    >

    > 此外，扩展程序还支持 XMLHttpRequest (XHR) API、HTML5 API、WebKit API（用于 CSS 动画、滤镜等）和 V8
    API（例如 JSON）！


    ## 第 3 章 ■ API 可用性与消息传递


    除了这些来自扩展程序框架的 API，本节还涵盖了标准 JavaScript API 中的 XHR API。本指南未讨论的其他 API（但你可以通过在线文档
    [`developer.chrome.com/extensions/api_index`](https://developer.chrome.com/extensions/api_index)
    阅读了解）包括：


    * `contentSettings`

    * `cookies`

    * `desktopCapture`

    * `extension`

    * `management`

    * `system.cpu`

    * `system.memory`

    * `webstore`

    * `windows`


    ## 声明权限

