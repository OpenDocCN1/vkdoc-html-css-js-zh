    "default_title" : "HelloShortcutKey",


    "default_icon" : "icon-1.png"


    },


    "background" : {


    "scripts" : ["event_script.js"],


    "persistent" : false


    },


    "commands" : {


    "shortcut-key to change the extension icon" : {


    "suggested_key" : {"default" : "Alt+Shift+9"},


    "description" : "Change the extension icon"


    }


    }


    }


    In Listing [2-4 , only one shor](#index_split_000.html#p64)tcut key has been used.
    As mentioned, the shortcut key ( shortcut-key to change the extension icon ) is
    listed as an attribute of the commands manifest attribute. The actual keyboard
    shortcut that is mapped to the shortcut key is defined as a value of the default
    attribute of the suggested_key attribute. It is named default as it can be overridden.


    The user can manually add more shortcuts from the chrome://extensions/


    configureCommands window (see Figur[es 2-6 and 2-7 ). The API associa](#index_split_000.html#p65)ted
    with the shortcut key input component feature is accessible from the chrome.commands
    object. All scripting components, except for content scripts, can use this API.


