  trans: "\n### `列表 3-1` `HelloOmniboxInput/manifest.json`\n\n```json\n{\n  \"manifest_version\"\
    \ : 2,\n  \"version\" : \"1.2\",\n  \"name\" : \"HelloOmniboxInput\",\n  \"description\"\
    \ : \"用于演示 Omnibox（多功能框）的扩展程序\",\n  \"background\" : {\n    \"scripts\" : [\"\
    event_script.js\"],\n    \"persistent\" : false\n  },\n  \"omnibox\" : {\n   \
    \ \"keyword\" : \"OI\"\n  },\n  \"icons\" : {\n    \"16\" : \"icon-16.png\",\n\
    \    \"128\" : \"icon-128.png\"\n  }\n}\n```\n\n### 事件脚本（Event Script）在此组件中的作用\n\
    \n现在来看使用此输入组件所需的事件脚本部分。与其他输入组件的事件脚本用法类似，omnibox 输入组件也使用事件脚本来监听相关事件。这些事件包括 `onInputStarted`、`onInputChanged`、`onInputEntered`\
    \ 和 `onInputCancelled`。请注意，这些事件隶属于 `chrome.omnibox` API。此 API 无需在清单文件中声明任何权限。\n\
    \n这些事件的使用方法在`列表 3-2`中进行了演示。\n\n`图 3-3` `HelloOmniboxInput`：与 omnibox 交互\n\n###\
    \ `列表 3-2` `HelloOmniboxInput/event_script.js`\n\n```javascript\n//region {变量和函数}\n\
    var ON_INPUT_ENTERED_DISPOSITION = {\n  \"CURRENT_TAB\" : \"currentTab\",\n  \"\
    NEW_FOREGROUND_TAB\" : \"newForegroundTab\",\n  \"NEW_BACKGROUND_TAB\" : \"newBackgroundTab\"\
    \n};\n\nvar suggestResultOne = {\n  \"content\" : \"Some content\",\n  \"description\"\
    \ : \"Description\"\n};\n\nvar suggestResults = [suggestResultOne];\n\nvar searchService\
    \ = \"https://www.google.com/\";\nsearchService += \"search?q=chrome+extensions+developers+\"\
    ;\n\nfunction CreateWindow(url) {\n  var windowCreateData = {\"url\" : \"\"};\n\
    \  windowCreateData.url = url;\n  chrome.windows.create(windowCreateData);\n}\n\
    //end-region\n\n//region {调用}\nchrome.omnibox.onInputStarted.addListener(function()\
    \ {\n  console.log(\"<InputStarted>\");\n});\n\nchrome.omnibox.onInputChanged.addListener(function(text,\
    \ suggest) {\n  console.log(\"<InputChanged> Text: \" + text);\n  //suggest(suggestResults);\n\
    \  suggest(getSuggestResults(text));\n});\n\nchrome.omnibox.onInputEntered.addListener(function(text,\
    \ disposition) {\n  console.log(\"<InputEntered> Text: \" + text);\n  CreateWindow(searchService\
    \ + text);\n  //默认 disposition 为 ON_INPUT_ENTERED_DISPOSITION.CURRENT_TAB\n});\n\
    //end-region\n```\n\n`图 3-4` `HelloOmniboxInput`：建议结果\n\n需要监听的最重要事件是 `chrome.omnibox.onInputChanged`\
    \ 和 `chrome.omnibox.onInputEntered`。前者（事件）触发意味着用户更改了在 omnibox 中输入的内容，后者（即 `onInputEntered`\
    \ 事件）触发则意味着用户已确认输入的内容或建议的内容。与不同事件相关的日志可以在图 3-6 中查看。\n\n`图 3-5` `HelloOmniboxInput`：与\
    \ omnibox 交互\n\n当 `onInputChanged` 事件被触发时，您需要提供建议结果供用户确认。可以通过向 `suggest` 回调函数传递一个数组来提供建议结果（参见`列表\
    \ 3-2`）。请注意，此数组中的每个元素都必须是 `SuggestResult` 类型，该类型是一个包含 `content` 和 `description`\
    \ 属性的对象。例如，建议结果 `suggestResultOne` 定义如下：\n\n```javascript\nvar suggestResultOne\
    \ = {\"content\":\"Some content\",\"description\":\"Description\"};\n```\n\n您需要将数组\
    \ `[suggestResultOne]` 传递给 `suggest` 回调函数。图 3-4 和图 3-5 展示了建议结果，其中图 3-4 的建议结果是\
    \ `Description`，而图 3-5 的建议结果分别是“搜索 'tabs' 于...”和“搜索 'themes' 于...”。\n\n请注意，真正被确认的是这些描述对应的\
    \ `content`。而所谓的“被确认”，我指的是将 `content` 传递给 `onInputEntered` 事件的监听函数。\n"
- fmt: "# CHAPTER 3 ■ API AVAILABILITY AND MESSAGING\n\n***Figure 3-6.** `HelloOmniboxInput`:\
    \ background page*\n\nThe content is passed to this listener function as the `text`\
    \ parameter, shown in [Listing 3-2](#index_split_000.html#p97). The second parameter,\
    \ called `disposition`, is the recommended context to display results. This is\
    \ usually not required, as it has a default value of `current tab`. The text,\
    \ in [Listing 3-2](#index_split_000.html#p97), is used to display related search\
    \ web pages in a new window. Note the use of the `chrome.windows.create` method\
    \ to create a new window (see Figure [3-8](#index_split_000.html#p102) ).\n\n\
    ***Figure 3-7.** `HelloOmniboxInput`: Setting the default suggestion*\n\nCHAPTER\
    \ 3 ■ API AVAILABILITY AND MESSAGING\n\nNote the default suggestion `Run HelloOmniboxInput\
    \ command ...` seen in Figure [3-5](#index_split_000.html#p99), for the `HelloOmniboxInput`\
    \ extension. This can be easily overridden to `Search on developer.chrome.com`\
    \ (displayed in Figure [3-7](#index_split_000.html#p100)) by executing the following\
    \ lines of code in the event script component:\n\n```\nchrome.omnibox.setDefaultSuggestion(\n\
    \    {\"description\":\"Search on developer.chrome.com\"}\n);\n```\n\n## Context\
    \ Menu Items\n\nIn the Chrome Extensions framework, one of the most advanced and\
    \ feature-leveraging input component provided is the context menu item. This component\
    \ allows an extension to create item(s) in the context menu, as displayed in Figure\
    \ [3-10](#index_split_000.html#p104). The created item can nest other such items\
    \ within itself. This becomes extremely useful when an extension offers multiple\
    \ related functionalities (each displayed as a separate context menu item) that\
    \ can be grouped under a single item. This input component requires the `contextMenus`\
    \ permission.\n\n***Listing 3-3.*** Chapter 3 / `HelloContextMenuItem`/ `manifest.json`\n\
    \n```\n{\n    \"manifest_version\" : 2,\n    \"name\" : \"HelloContextMenuItem\"\
    ,\n    \"description\" : \"Extension to demonstrate a Context-Menu-Item\",\n \
    \   \"version\" : \"1.2\",\n    \"permissions\" : [\"contextMenus\"],\n    \"\
    icons\" : {\n        \"16\" : \"icon-16.png\",\n        \"128\" : \"icon-128.png\"\
    \n    },\n    \"background\" : {\n        \"scripts\" : [\"event_script.js\"],\n\
    \        \"persistent\" : true\n    }\n}\n```\n\nSimilar to the input component\
    \ discussed in the previous topic, using the context menu item component is also\
    \ very straightforward. First, you need to use the `contextMenus` permission in\
    \ the manifest. Then, you need to use an event script component in order to create\
    \ item(s) in the context menu. This event script component needs to be defined\
    \ with `persistent` set to `true` in the manifest, in order to make it persist\
    \ as long as the browser is opened. This is required because the item(s) in the\
    \ context menu are defined from within the event script component, so it should\
    \ last long enough. The corresponding code for the event script component and\
    \ the `contextMenus` permission is provided in [Listing 3-3](#index_split_000.html#p101).\n\
    \n![](index-102_1.jpg)\n\nCHAPTER 3 ■ API AVAILABILITY AND MESSAGING\n\n■ **Note**\
    \ Recall, that an event script with `persistent` defined as `true` is a *background\
    \ script*, as discussed in Chapter [2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2).\n\
    \n***Figure 3-8.** `HelloOmniboxInput`: Setting the default suggestion*\n\n###\
    \ Creating an Item\n\nThere are different forms of context menu items, including\
    \ `normal`, `separator`, `checkbox`, etc. Here, you will create a \"normal\" item.\
    \ Note that if your extension requires the use of multiple items in the context\
    \ menu, you can also use a \"separator\" item to (visually) group your items.\n\
    \n■ **Note** A context menu item can take different forms. It can be a \"normal\"\
    \ item (the typical item you always notice in context menus), a \"separator\"\
    \ item, a \"checkbox\" item, or a \"radio\" item. For the course of this book,\
    \ we will be dealing only with the first two items. This will help you focus more\
    \ on the various contexts available to context menus in the Chrome browser.\n\n\
    ![](index-103_1.jpg)\n\nCHAPTER 3 ■ API AVAILABILITY AND MESSAGING\n\n***Figure\
    \ 3-9.** `HelloContextMenuItem`: background page*"
