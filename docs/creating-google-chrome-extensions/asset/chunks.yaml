    **Introduction**


    Creating Google Chrome Extensions is an intermediate-level book that teaches development
    of browser extensions for Google Chrome web browser. Browser extensions are extremely
    viable in enhancing functionality of web browsers. They have access to almost
    all the features provided by the browser. And they can encapsulate such features
    in the form of a bundled application to provide a targeted functionality to users
    – such as an extension that can summarize the current page you are reading, or
    another extension that can save all the images in the page you are browsing. Extensions
    run in a sandboxed environment, making them secure – which is a huge plus!


    The APIs provided by Chrome Extensions framework help to empower web


    applications by coupling them with amazing features provided by the Google Chrome
    web browser, such as bookmarks, history, tabs, actions, storage, notifications,
    search, and a lot more other features.


    After understanding the examples and lessons in this book, you will be able to
    transform your existing web applications as (into) Google Chrome browser extensions,
    as well as create brand new extensions that serve some useful purpose.


    In this book we will go from discovering what Google Chrome Extensions are, how
    to create them, extension components and messaging, to publishing of extensions
    on the Chrome Web Store (formerly the Google Chrome Extensions Gallery).


    “Extensions” is the only way out for sped-up productivity on Google Chrome browsers.


    So, showcase your existing web development skills in a completely modernized way,
    by “Creating Google Chrome Extensions”.


    **xvii**


    ## Chapter 1


    ## Introduction to Google Chrome Extensions


    In this chapter you will learn about Google Chrome Extensions, which are a useful
    way to add functionality to the Google Chrome web browser. We will first take
    a quick look at some popular Google Chrome Extensions and the technologies that
    are used to code Chrome Extensions. Then, you will learn how to create your own
    “Hello World” style Chrome Extension—but only after we describe the features and
    abilities of Chrome Extensions. Finally, you will learn about publishing Chrome
    Extensions on the Chrome Web Store (formerly the Google Chrome Extensions Gallery).


    This chapter assumes you have some experience writing simple web pages using technologies
    such as `HTML`, `CSS`, and `JavaScript`. That said, let’s get started!


    ### What Are Google Chrome Extensions?


    Google Chrome Extensions are browser extensions for the Google Chrome web browser.


    Browser extensions are programs that run within the context (security sandbox)
    of a web browser. They help to provide new functionality(ies) by combining existing
    features of the web browser and make it possible for users to do many things at
    once!


    > **Note** At the time of this writing, Google Chrome Extensions are only supported
    on the desktop versions of the Google Chrome web browser.


    ### Support for Browser Extensions


    The Google Chrome web browser started supporting browser extensions in its fourth
    version, which was released in 2010. It is also possible to create extensions
    for browsers such as Safari, Mozilla Firefox, and Opera. Extensions created for
    the Google Chrome web browser are compatible with the Opera web browser, ever
    since Opera shifted to the Chromium’s extension model (after Opera dropped its
    own Presto engine, in favor of the WebKit engine used by the Google Chrome web
    browser, from the Chromium project).


    Developing extensions for the Safari web browser has a similar learning curve
    to that of the Google Chrome web browser, and developing extensions for both is
    easy because it does not require you to learn any newer technologies (only existing
    web technologies are used). But developing extensions for the Firefox web browser
    is comparatively difficult as it involves the use of technologies apart from web
    technologies, such as `XUL`, `XPCOM`, etc. (you can read more about these at [https://en.wikipedia.org/wiki/Add-on_(Mozilla)#Extension_technologies](https://en.wikipedia.org/wiki/Add-on_(Mozilla)#Extension_technologies)).
    This book only covers development of extensions on the Google Chrome web browser.


    > **Note** The Chrome Web Store is an online marketplace where users can browse
    for Chrome apps, extensions, and themes. The store helps users find, purchase,
    and install content on the Chrome browser.


    ### Extensions Are Not Plug-ins


    An important point to note is that browser extensions are different from browser
    plugins. While browser extensions are sandboxed within the host web browser (software),
    plug-ins are not. Here, a sandbox can be thought of as a software container –
    allowing the execution of web technologies, and at the same time providing access
    to the features of browsers, such as tabs, history, buttons, popups, etc.


    In addition to this, extensions add new functionality(ies) to browsers by combining
    existing features that are already available on browsers (in case of Chrome Extensions,
    this is done using the API provided by the Extensions framework). Plug-ins, however,
    provide new functionality(ies) by providing support for particular media types
    to browsers. In the former case, the example could be an extension that allows
    users to save all the opened tabs that are not in incognito mode, to the local
    storage. For the latter case, the example could be a plug-in that allows reading
    and rendering of `PDF` files on the browser.


    Also note that there is another kind of web application that developers can create
    for the Chrome browser. These applications are known as *Google Chrome Apps*.
    From a development’s standpoint, Google Chrome Apps are somewhere in between Google
    Chrome Extensions and browser plug-ins.'
