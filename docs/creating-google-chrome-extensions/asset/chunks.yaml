    ***Figure 2-15.** Extensions Management page: HelloShortcutKey* To make this script
    persist as long as the browser is opened, you need to mark it as persistent, by
    setting persistent to true in the manifest. Such an event script is known as a
    *background script* . Usually, you won’t find the need to use background scripts
    in your extension. There are only a few API calls (in the Extensions framework)
    that require a background script for their proper execution. For most examples
    used in this book, only event script are used unless stated otherwise.


    ■ **Note** Background scripts are *not* recommended for use. This is due to performance
    reasons—they take up more memory and other system resources.


