    document.addEventListener("DOMContentLoaded",function(dcle) {


    var buttonID = document.getElementById(sendMessageButtonID);


    buttonID.addEventListener("click",function(ce) {


    //This message will be intercepted by event_script.js


    chrome.runtime.sendMessage(extensionID,message,responseCallback);


    });


    });


    //end-


    region


    The message parameter in sendMessage is the message to send. In this case, the
    message is a string “Test message X” . You might be wondering about the use of
    the responseCallback parameter . Well, this parameter is a callback function that
    is used by the receiver of the sent message, i.e. the extension runtime. F[or
    the examples in Listings 3-9](#index_split_000.html#p113)


    [and 3-10 (fr](#index_split_000.html#p115)om the WSandES extension), the event
    script component is used to represent the extension runtime. An important point
    to note is that the callback (although called by the event script) gets executed
    in the context of the web page script. Figur[e 3-15 displa](#index_split_000.html#p111)ys
    the log corresponding to the sendResponse(responseObject) call in the event script.


    ***Figure 3-18.** Console panel for background page*


    Listening to the Event


    As shown in Listing 3-10, the listener function for the chrome.runtime.onMessageExternal
    event is used to handle the incoming message from the external web page. The listener
    function for the onMessageExternal event takes three parameters— message , sender
    , and sendResponse . As discussed, sendResponse is the callback that gets executed
    in the context of the web page script. Note the passed argument called responseObject
    .


    ![](index-115_1.jpg)


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    ***Figure 3-19.** Inspecting the web page: Console panel*


    ***Listing 3-10.*** Ch[apter 3 /W](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)SandES/
    event_script.js


    //region {variables and functions}


    var greeting = "Hello World!";


    var responseObject = {


    message : "Test message Y",


    sender : "event_script.js"


    };


    function GetFormattedMessageString(message,sender) {


    return "Message ''" + message + "'' from Sender ''" + sender.url + "''";


    }


    //end-region


    //region {calls}


    console.log(greeting);


    chrome.runtime.onMessageExternal.addListener(


    function(message,sender,sendResponse) {


    //Will get called from the script where sendResponse is defined


    sendResponse(responseObject);


    console.log(GetFormattedMessageString(message,sender));


    }


    );


    //end-


    region


    ![](index-116_1.jpg)


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    The message parameter contains the passed message. And similarly, the sender parameter
    contains the URL of the external web page that sent the message. In this case,
    the external web page is webpage.php , served from my local HTTP server. The log
    corresponding to these values is shown in Figur[e 3-16](#index_split_000.html#p112)
    .


    Role of the Manifest for This API


    For an extension to be able to receive messages from external web pages (or other
    extensions), an important addition is required in the manifest. This addition
    is the externally_connectable manifest attribute. This attribute contains two
    keys— ids and matches . Both of these keys take array values. While the ids key
    represents the IDs of the (external) extensions that can send messages, the matches
    key represents the URL


    patterns of the external web pages that can send messages. An important point
    to note is that this attribute is a *must-have* for any extension that needs to
    be communicated with from external web pages or extensions, irrespective of the
    messaging API that’s used ( chrome.runtime.sendMessage or chrome.runtime.connect
    ).


    ***Figure 3-20.** Inspecting the web page: Console panel* 100


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    For the WSandES extension (provided in Ch[apter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)
    ’s Exercise Files folder), the externally_connectable attribute is defined the
    following way. This is done so as to only allow web pages served from the localhost
    to send messages to the extension runtime.


    "externally_connectable" : {


    //Extension and app IDs. If this field is not specified, no


    //extensions or apps can communicate.


    //"ids" : [], //To match all extensions and apps, specify only "*"


    //Allowed webpages


    "matches" : ["*://localhost/*"]


    }


    Using Long-Lived Connections


    The messaging example that was demonstrated in this topic involved a single message
    and response. Sometimes it is useful to have a conversation that lasts longer
    than that. To facilitate this purpose, the Extensions framework provides the chrome.runtime.connect
    method . Note that apart from the web page script, this method is also available
    to other scripts, including to content script and popup script.


    ■ **Note** Obviously, the event script can also use the chrome.runtime.connect
    method.'
  trans: "\n# API 可用性与消息传递\n\n标准 JavaScript API 中用于消息传递的 API 对应的事件包括 `message` 事件。类似地，扩展框架中用于消息传递的\
    \ API 对应的事件包括以下事件。现在你已经对消息传递有了一个概览，让我们通过不同的示例来更清晰地理解这些概念。\n\n- `chrome.runtime.onMessage`\n\
    - `chrome.runtime.onMessageExternal`\n- `chrome.runtime.onConnect`（以及对应的 `port.onMessage`\
    \ 事件）\n- `chrome.runtime.onConnectExternal`（以及对应的 `port.onMessage` 事件）\n\n## 网页脚本与事件脚本\n\
    \n这里的基本思想是允许外部网页与扩展运行时进行通信。在 Chrome 浏览器中，所有网页（除了扩展管理页面）都可以访问 `chrome.runtime.sendMessage`\
    \ 方法，该方法用于向扩展运行时发送消息。该方法接受以下参数：\n\n- `extensionID`\n- `message`\n- `responseCallback`\n\
    \n如清单 3-9 所示，点击 `send_message` 按钮会触发 `chrome.runtime.sendMessage(extensionID,\
    \ message, responseCallback)` 调用。请注意，`extensionID` 是要发送消息的扩展的 ID。该 ID 可以从扩展管理页面查看（参见图\
    \ 3-16）。另请注意，每次在扩展内容或扩展文件夹位置进行更改后重新加载扩展时，该 ID 都会发生变化。此外，对 `manifest.json`（或扩展文件夹中的任何其他文件）的修改只有在重新安装或重新加载扩展后才会生效！\n\
    \n![](img/index-113_1.jpg)\n\n> **注意：**对于 WSandES 扩展，`WebServer` 文件夹的内容已从我的本地\
    \ HTTP 服务器提供服务，以便提供接近真实场景的演示，即你的扩展可能正在尝试监听来自（在 Chrome 浏览器中访问的）外部网页的消息。另请注意，所提供的网页具有\
    \ `.php` 后缀，但包含纯 HTML 代码。因此，它可以直接作为本地文件网页（即使用 `file://` 方案）在 Chrome 浏览器中打开。\n\n\
    ***图 3-17.** 检查网页：控制台面板*\n\n***清单 3-9.*** [第 3 章 / WSandES / WebServer / webpage_script.js](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)\n\
    \n```\n//region {variables and functions}\n//注意这个来自扩展页面\nvar extensionID = \"\
    lconbphjmfkpdopdnadkdfiiflajajgg\";\nvar sendMessageButtonID = \"send_message\"\
    ;\nvar greeting = \"Hello World!\";\nvar message = \"Test message X\";\n\nfunction\
    \ responseCallback(responseObject) {\n    console.log(\"Message '\" +\n      \
    \  responseObject.message + \"' from Sender '\" +\n        responseObject.sender\
    \ + \"'\"\n    );\n}\n//end-region\n\n//region {calls}\nconsole.log(greeting);\n\
    document.addEventListener(\"DOMContentLoaded\", function(dcle) {\n    var buttonID\
    \ = document.getElementById(sendMessageButtonID);\n    buttonID.addEventListener(\"\
    click\", function(ce) {\n        //此消息将被 event_script.js 拦截\n        chrome.runtime.sendMessage(extensionID,\
    \ message, responseCallback);\n    });\n});\n//end-region\n```\n\n`sendMessage`\
    \ 中的 `message` 参数是要发送的消息。在本例中，消息是一个字符串 `\"Test message X\"`。你可能想知道 `responseCallback`\
    \ 参数的用途。嗯，这个参数是一个回调函数，由发送消息的接收方（即扩展运行时）使用。对于清单 3-9 和 3-10（来自 WSandES 扩展）中的示例，事件脚本组件用于代表扩展运行时。需要重点注意的是，回调（尽管由事件脚本调用）是在网页脚本的上下文中执行的。图\
    \ 3-15 显示了与事件脚本中 `sendResponse(responseObject)` 调用对应的日志。\n\n***图 3-18.** 后台页面控制台面板*\n\
    \n## 监听事件\n\n如清单 3-10 所示，`chrome.runtime.onMessageExternal` 事件的监听函数用于处理来自外部网页的传入消息。`onMessageExternal`\
    \ 事件的监听函数接受三个参数——`message`、`sender` 和 `sendResponse`。如前所述，`sendResponse` 是在网页脚本上下文中执行的回调。请注意传递的参数\
    \ `responseObject`。\n\n![](img/index-115_1.jpg)\n\n***图 3-19.** 检查网页：控制台面板*\n\n\
    ***清单 3-10.*** [第 3 章 / WSandES / event_script.js](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)\n\
    \n```\n//region {variables and functions}\nvar greeting = \"Hello World!\";\n\
    var responseObject = {\n    message : \"Test message Y\",\n    sender : \"event_script.js\"\
    \n};\n\nfunction GetFormattedMessageString(message, sender) {\n    return \"Message\
    \ '\" + message + \"' from Sender '\" + sender.url + \"'\";\n}\n//end-region\n\
    \n//region {calls}\nconsole.log(greeting);\nchrome.runtime.onMessageExternal.addListener(\n\
    \    function(message, sender, sendResponse) {\n        //将从定义 sendResponse 的脚本中调用\n\
    \        sendResponse(responseObject);\n        console.log(GetFormattedMessageString(message,\
    \ sender));\n    }\n);\n//end-region\n```\n\n`message` 参数包含传递的消息。同样，`sender` 参数包含发送消息的外部网页的\
    \ URL。在本例中，外部网页是从我的本地 HTTP 服务器提供服务的 `webpage.php`。对应于这些值的日志如图 3-16 所示。\n\n## 此\
    \ API 的清单文件作用\n\n要使扩展能够接收来自外部网页（或其他扩展）的消息，清单文件中需要添加一个重要内容。这个添加项是 `externally_connectable`\
    \ 清单属性。此属性包含两个键——`ids` 和 `matches`。这两个键都接受数组值。`ids` 键表示可以发送消息的（外部）扩展的 ID，而 `matches`\
    \ 键表示可以发送消息的外部网页的 URL 模式。需要重点注意的是，无论使用哪种消息传递 API（`chrome.runtime.sendMessage`\
    \ 或 `chrome.runtime.connect`），此属性是任何需要与外部网页或扩展通信的扩展的*必备*属性。\n\n***图 3-20.** 检查网页：控制台面板*\n\
    \n对于 WSandES 扩展（在[第 3 章](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)的练习文件文件夹中提供），`externally_connectable`\
    \ 属性按以下方式定义。这样做是为了仅允许从 localhost 提供服务的网页向扩展运行时发送消息。\n\n```\n\"externally_connectable\"\
    \ : {\n    //扩展和应用程序 ID。如果未指定此字段，则无法与任何\n    //扩展或应用程序进行通信。\n    //\"ids\" : [],\
    \ //要匹配所有扩展和应用程序，只需指定 \"*\"\n    //允许的网页\n    \"matches\" : [\"*://localhost/*\"\
    ]\n}\n```\n\n## 使用长连接\n\n本主题中演示的消息传递示例涉及单条消息和响应。有时，进行持续时间更长的对话会很有用。为了促进此目的，扩展框架提供了\
    \ `chrome.runtime.connect` 方法。请注意，除了网页脚本之外，此方法也可用于其他脚本，包括内容脚本和弹出脚本。\n\n> **注意：**显然，事件脚本也可以使用\
    \ `chrome.runtime.connect` 方法。\n"
- fmt: "But you will rarely find this application. However, you will definitely find\
    \ a frequent use of the `chrome.runtime.onConnect` (or the `chrome.runtime.onConnectExternal`)\
    \ event with its listener function in the event script. The `connect` method will\
    \ mainly be used from within the event script to communicate with another extension.\
    \ The same holds true for the `sendMessage` method. You can read more about cross-extension\
    \ messaging at [developer.chrome.com/extensions/messaging#external](https://developer.chrome.com/extensions/messaging#external).\n\
    \nThis method takes the `extensionID` as its first parameter. This is the ID of\
    \ the extension you need to connect to for a long-lived connection. The second\
    \ parameter is an object, which can be used to provide additional information\
    \ about the connection—for example, `{\"name\" : \"connection1\"}`. Note that\
    \ this method returns a `port` object. The `port.postMessage` method is used to\
    \ send message to the extension runtime. The code discussed so far (for the web\
    \ page script) is summarized as following.\n\n```\nvar port = chrome.runtime.connect(\"\
    ...\",{\"name\" : \"connection1\"});\nport.onMessage.addListener(function(message)\
    \ {\n    console.log(message);\n});\nport.postMessage(\"Test message X\");\n```\n\
    \n![Figure 3-21](index-118_1.jpg)\n\nCHAPTER 3 ■ API AVAILABILITY AND MESSAGING\n\
    \nNext, on the receiving end (i.e., the extension runtime represented using an\
    \ event script), the listener function for the `chrome.runtime.onConnectExternal`\
    \ event (or the `chrome.runtime.onConnect` event, for connection made from within\
    \ the extension) also receives the `port` object. Note that in this case—i.e.,\
    \ for connection between a web page script and event script—the `onConnectExternal`\
    \ event needs to be used, because it gets fired when a connection is made from\
    \ an external web page (or extension).\n\n**Figure 3-21.** Inspecting the popup:\
    \ Console panel\n\nFinally, using the listener function for the `port.onMessage`\
    \ event (available to both ends of the connection), you can listen for the incoming\
    \ messages. Note that since each end has access to the `port` object, they can\
    \ do the both. That means they can send as well as receive messages through the\
    \ established connection (via the `port`). The code discussed so far (for the\
    \ event script) is summarized as following:\n\n```\nchrome.runtime.onConnectExternal.addListener(function(port)\
    \ {\n    //if(port.name == \"connection1\")\n    port.onMessage.addListener(function(message)\
    \ {\n        console.log(message); //Test message X\n        port.postMessage(\"\
    Test message Y\");\n    });\n});\n```\n\n![Figure 3-22](index-119_1.jpg)\n\nCHAPTER\
    \ 3 ■ API AVAILABILITY AND MESSAGING\n\n## Content Scripts and Event Scripts\n\
    \nRecall that the content script component does not represent the extension runtime.\
    \ But it does have access to the following APIs in the Extensions framework—`extension`,\
    \ `i18n`, `runtime`, and `storage`. And in the `runtime` API, the content script\
    \ component has access to `connect` and `sendMessage` methods. And access to events\
    \ `runtime.onConnect` (including the corresponding `port.onMessage` event) and\
    \ `runtime.onMessage`.\n\nNote that the content script component does not have\
    \ access to the `runtime.onMessageExternal` and `runtime.onConnectExternal` events.\
    \ For this reason, it cannot rely on the `runtime` APIs to communicate with the\
    \ web page scripts. Instead, it needs to listen for the `message` event provided\
    \ by the standard JavaScript APIs to do so. First let’s take a look at how content\
    \ scripts can communicate with the extension runtime, and then in the following\
    \ topics, you will learn how popup scripts and web page scripts can communicate\
    \ with a content script.\n\nFor this purpose, evaluate [Listings 3-11](index_split_000.html#p120)\
    \ to [3-13](index_split_001.html#p122) from the `CSandES` extension. Note from\
    \ the [manifest file (Listing 3-13)](index_split_001.html#p122) that this extension\
    \ injects content scripts into the visited web pages belonging to the localhost.\
    \ This is specified using the `\"*://localhost/*\"` string in the `matches` array.\
    \ The corresponding script that gets injected is `content_script.js` (see [Figures\
    \ 3-17](index_split_000.html#p113) and [3-19](index_split_000.html#p115)). [Listing\
    \ 3-11](index_split_000.html#p120) contains the code from this script.\n\n**Figure\
    \ 3-22.** Inspecting the web page: Console panel\n\nCHAPTER 3 ■ API AVAILABILITY\
    \ AND MESSAGING\n\n**Note** For popup scripts and event scripts to be able to\
    \ communicate with the content scripts, the `chrome.runtime.sendMessage` method\
    \ cannot be used. Instead, the `chrome.tabs.sendMessage` (or `chrome.tabs.connect`)\
    \ method needs to be used. For the `chrome.tabs.sendMessage` method, the corresponding\
    \ event remains the same—i.e., `chrome.runtime.onMessage` (and similarly the event\
    \ `chrome.runtime.onConnect` for the `chrome.tabs.connect` method).\n\n**Listing\
    \ 3-11.** [Chapter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3) /CSandES/\
    \ `content_script.js`\n\n```\n//region {variables and functions}\nvar sendMessageButtonID\
    \ = \"send_message\";\nvar greeting = \"Hello World!\";\nvar message = \"Test\
    \ message X\";\nfunction responseCallback(responseObject) {\n    console.log(\"\
    Message '\" + responseObject.message +\n        \"' from Sender '\" + responseObject.sender\
    \ + \"'\"\n    );\n}\n//end-region\n\n//region {calls}\nconsole.log(greeting);\n\
    (function(){\n    var buttonElement = document.createElement(\"button\");\n  \
    \  buttonElement.style.position = \"fixed\";\n    buttonElement.style.display\
    \ = \"block\";\n    buttonElement.style.width = \"70px\";\n    buttonElement.style.height\
    \ = \"40px\";\n    buttonElement.style.bottom = \"10px\";\n    buttonElement.style.left\
    \ = \"10px\";\n    buttonElement.innerText = \"Message Runtime\";\n    buttonElement.addEventListener(\"\
    click\",function(ce) {\n        //This message will be intercepted by event_script.js\n\
    \        chrome.runtime.sendMessage(message,responseCallback);\n    });\n    document.body.appendChild(buttonElement);\n\
    \    /*\n    //var port = chrome.runtime.connect(\"...\",{\"name\":\"connection1\"\
    });\n    var port = chrome.runtime.connect({\"name\":\"connection1\"});\n    port.onMessage.addListener(function(message){console.log(message);});\n\
    \    port.postMessage(\"...\");\n    */\n})();\n//end-region\n```\n\nCHAPTER 3\
    \ ■ API AVAILABILITY AND MESSAGING\n\nAs shown in [Listing 3-11](index_split_000.html#p120),\
    \ as soon as the content script gets injected, it appends a button element into\
