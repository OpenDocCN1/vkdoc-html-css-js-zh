    URL: [https://developer.chrome.com/extensions/match_patterns](https://developer.chrome.com/extensions/match_patterns).


    Upon clicking the `BrowserAction` button, the listener function gets called, as
    a result of which CSS and JavaScript codes get injected. The `cssCode` variable
    contains CSS code to underline the anchor tags (i.e., `a` tag) and code to set
