    ## Popup Scripts and Event Scripts


    Now let’s see how a popup script can communicate with the event script. Although
    both these components represent the extension runtime, they exist as different
    scripting components in the extensions architecture. This is why there is a need
    for communication between these two scripting components. Having these components
    communicate with each other is a lot easier than it is for other components.


    ### **Listing 3-20.** Chapter 3 /PSandES/ manifest.json


    ```json

    {


    "manifest_version" : 2,


    "name" : "Communication Demo: popup-script and event-script",


    "description" : "Shows communication b/w popup-script and event-script",


    "version" : "1.2",


    "browser_action" : {


    "default_title" : "Communication Demo: popup-script and event-script",


    "default_icon" : "icon.png",


    "default_popup" : "popup.html"


    },


    "background" : {


    "scripts" : ["event_script.js"],


    "persistent" : false


    }


    }

    ```


    Since a popup script is being used, it is obvious that the extension will need
    a `BrowserAction` or `PageAction` component with a popup. This can be seen in
    **Listing 3-20**, from the `PSandES` extension (in Chapter 3’s Exercise Files
    folder). To use an event script, the `background` attribute has been defined in
    the manifest. **Listing 3-22** contains the code for the corresponding event script
    component.


    ### **Listing 3-21.** Chapter 3 /PSandES/ popup_script.js


    ```javascript

    //region {variables and functions}


    var sendMessageButtonID = "send_message";


    var greeting = "Hello World!";


    var message = "Test message X";


    function responseCallback(responseObject) {


    console.log("Message ''" + responseObject.message +


    "'' from Sender ''" + responseObject.sender + "''");


    }


    //end-region

    ```


    ![](index-132_1.jpg)


    ## CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    ```javascript

    //region {calls}


    console.log(greeting);


    document.addEventListener("DOMContentLoaded",function(dcle){


    var buttonID = document.getElementById(sendMessageButtonID);


    buttonID.addEventListener("click",function(ce) {


    //This message will be intercepted by event_script.js


    chrome.runtime.sendMessage(message,responseCallback);


    });


    });


    //end-region

    ```


    As discussed in the previous examples, to send a message to the event script,
    the following call needs to be made: `chrome.runtime.sendMessage(message, responseCallback)`.
    As you know already, the `message` parameter is the message to send. The `responseCallback`
    is a callback function that is used by the receiver of the sent message.


    Note that **Listing 3-21** contains the code from the popup script used in the
    `PSandES` extension. **Figure 3-23** and **Figure 3-25** display the logs from
    the popup script.


    ### **Figure 3-29.** API demos: Downloads API


    ### **Listing 3-22.** Chapter 3 /PSandES/ event_script.js


    ```javascript

    //region {variables and functions}


    var greeting = "Hello World!";


    var responseObject = {


    message : "Test message Y",


    sender : "event_script.js"


    };


    function GetFormattedMessageString(message,sender) {


    return "Message ''" + message + "'' from Sender ''" + sender.url + "''";


    }


    //end-region

    ```


    ## CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    ```javascript

    //region {calls}


    console.log(greeting);


    chrome.runtime.onMessage.addListener(function(message,sender,sendResponse) {


    //Will get called from the script where sendResponse is defined


    sendResponse(responseObject);


    console.log(GetFormattedMessageString(message,sender));


    });


    //end-region

    ```


    Finally, to receive the sent message, the event script provides the listener function
    for the `chrome.runtime.onMessage` event. The log corresponding to this function
    is shown in **Figure 3-24**. Note the `sendResponse` callback and the passed argument
    `responseObject`, which is logged to the console in the context of the popup script
    (see **Figure 3-25**).


    ## Google Chrome Extensions APIs


    The Google Chrome Extensions framework provides extensions with many special-purpose
    APIs that allow you to access amazing features of the Chrome browser. These APIs
    provide access to almost every feature available in the Chrome browser! A lot
    of APIs have already been discussed, although they were described in a different
    context. For example, the following APIs were described as input components: `chrome.omnibox`,
    `chrome.contextMenus`, `chrome.commands`, `chrome.pageAction`, and `chrome.browserAction`.
    This section looks at the following APIs:


    * `alarms`

    * `bookmarks`

    * `downloads`

    * `history`

    * `notifications`

    * `storage`

    * `tabs`


    > **Note** Extensions can still use all the standard APIs (also known as the standard
    JavaScript APIs) that the browser provides to web pages. These are the same core
    JavaScript and Document Object Model (DOM) APIs that you are already familiar
    with.

    >

    > Additionally, XMLHttpRequest (XHR) APIs, HTML5 APIs, WebKit APIs (for CSS animations,
    filters, etc.), and V8 APIs (such as JSON) are supported!


    ## CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    In addition to these APIs from the Extensions framework, this section also covers
    the XHR API from the standard JavaScript APIs. Other APIs that are not discussed
    here—but that you can read about in the online documentation at [https://developer.chrome.com/extensions/api_index](https://developer.chrome.com/extensions/api_index)—include
    the following:


    * `contentSettings`

    * `cookies`

    * `desktopCapture`

    * `extension`

    * `management`

    * `system.cpu`

    * `system.memory`

    * `webstore`

    * `windows`


