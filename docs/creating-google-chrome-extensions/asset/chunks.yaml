  trans: "\n# 第 3 章 ■ API 可用性与消息传递\n\n***图 3-6.** `HelloOmniboxInput`：后台页面*\n\n内容作为\
    \ `text` 参数传递给此监听函数，如清单 3-2 所示。第二个参数称为 `disposition`，是用于显示结果的推荐上下文。这通常不是必需的，因为它默认值为\
    \ `current tab`。清单 3-2 中的文本用于在新窗口中显示相关的搜索网页。注意使用 `chrome.windows.create` 方法来创建新窗口（参见图\
    \ 3-8）。\n\n***图 3-7.** `HelloOmniboxInput`：设置默认建议*\n\n第 3 章 ■ API 可用性与消息传递\n\n\
    注意在 `HelloOmniboxInput` 扩展中看到的默认建议 `Run HelloOmniboxInput command ...`，如图 3-5\
    \ 所示。通过在事件脚本组件中执行以下代码行，可以轻松将其覆盖为 `Search on developer.chrome.com`（显示在图 3-7 中）：\n\
    \n```\nchrome.omnibox.setDefaultSuggestion(\n    {\"description\":\"Search on\
    \ developer.chrome.com\"}\n);\n```\n\n## 上下文菜单项\n\n在 Chrome 扩展框架中，提供的最先进且功能丰富的输入组件之一是上下文菜单项。此组件允许扩展在上下文菜单中创建项目，如图\
    \ 3-10 所示。创建的项目可以在其内部嵌套其他此类项目。当扩展提供多个相关功能（每个功能显示为单独的上下文菜单项）并且可以分组到单个项目下时，这变得极为有用。此输入组件需要\
    \ `contextMenus` 权限。\n\n***清单 3-3.*** 第 3 章 / `HelloContextMenuItem` / `manifest.json`\n\
    \n```\n{\n    \"manifest_version\" : 2,\n    \"name\" : \"HelloContextMenuItem\"\
    ,\n    \"description\" : \"Extension to demonstrate a Context-Menu-Item\",\n \
    \   \"version\" : \"1.2\",\n    \"permissions\" : [\"contextMenus\"],\n    \"\
    icons\" : {\n        \"16\" : \"icon-16.png\",\n        \"128\" : \"icon-128.png\"\
    \n    },\n    \"background\" : {\n        \"scripts\" : [\"event_script.js\"],\n\
    \        \"persistent\" : true\n    }\n}\n```\n\n与上一主题中讨论的输入组件类似，使用上下文菜单项组件也非常直接。首先，您需要在清单中使用\
    \ `contextMenus` 权限。然后，您需要使用事件脚本组件来在上下文菜单中创建项目。此事件脚本组件需要在清单中定义 `persistent` 为\
    \ `true`，以便在浏览器打开时保持其持久性。之所以需要这样做，是因为上下文菜单中的项目是在事件脚本组件内部定义的，因此它需要持续足够长的时间。事件脚本组件和\
    \ `contextMenus` 权限的相应代码在清单 3-3 中提供。\n\n![](img/index-102_1.jpg)\n\n第 3 章 ■ API\
    \ 可用性与消息传递\n\n■ **注意** 回忆一下，将 `persistent` 定义为 `true` 的事件脚本是 *后台脚本*，如第[2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)章所述。\n\
    \n***图 3-8.** `HelloOmniboxInput`：设置默认建议*\n\n### 创建项目\n\n上下文菜单项有不同的形式，包括 `normal`、`separator`、`checkbox`\
    \ 等。在这里，您将创建一个 \"normal\" 项目。注意，如果您的扩展需要在上下文菜单中使用多个项目，您也可以使用 \"separator\" 项目来（视觉上）对项目进行分组。\n\
    \n■ **注意** 上下文菜单项可以采取不同的形式。它可以是 \"normal\" 项目（您在上下文菜单中总是注意到的典型项目）、\"separator\"\
    \ 项目、\"checkbox\" 项目或 \"radio\" 项目。就本书而言，我们只处理前两种项目。这将帮助您更专注于 Chrome 浏览器中上下文菜单可用的各种上下文。\n\
