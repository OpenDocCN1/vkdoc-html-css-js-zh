- fmt: "# As described earlier, the HTML file represents the view our extension’s\
    \ popup will have. The JavaScript file will contain the application logic (in\
    \ this case, logic to display the current time and date). The manifest file will\
    \ provide information about the extension itself to the Chrome browser. For obvious\
    \ reasons, the `icon.png` file will be used by the Chrome browser to create the\
    \ button for your extension (see Figure 1-10).\n\n**Figure 1-10.** Extension button\
    \ in the Google Chrome toolbar\n\n## Validating a JSON File\n\nNow it’s time to\
    \ open the `manifest.json` file in your favorite text editor. But before you do,\
    \ an important thing to note is that a JSON file *cannot* have comments inside\
    \ it. This includes single-line and multi-line comments. Most errors during uploading\
    \ of extension packages on the Chrome Web Store are caused due to such comments\
    \ in the manifest file. These errors are not reported when testing extensions\
    \ locally in the Chrome browser.\n\n**Note** For the purpose of demonstration,\
    \ however, *comments* have been used in the code listings and related material.\n\
    \nSo, whenever you get a feeling that your manifest file is not in its best condition\
    \ (i.e., it might contain some typos or other formatting errors), feel free to\
    \ try out any *JSON validators* of your choice. There are tons of such validators\
    \ available online. For example, [http://jsonlint.com](http://jsonlint.com/),\
    \ [http://jsonschemalint.com](http://jsonschemalint.com/), etc. With that said,\
    \ you can finally open the manifest file for editing.\n\n# Creating the Manifest\n\
    \nAdd the following attributes to your empty manifest file: `manifest_version`,\
    \ `name`, and `version`. These are the required fields in a manifest file. `manifest_version`\
    \ represents the version of the manifest file format. `name` represents the name\
    \ of the extension. And similarly, `version` is the version of the extension.\n\
    \nThe `manifest_version` attribute takes an integer value greater than 0. At the\
    \ time of writing, the valid value for the `manifest_version` attribute is 2,\
    \ which indicates that it is the second version of the manifest file format. The\
    \ `version` attribute takes a string value consisting of (one to four) dot-separated\
    \ integers (between 0 and 65536). Similarly, the `name` attribute takes a string\
    \ value containing the name of your extension. You can also add a `description`\
    \ attribute (with a corresponding string value), which represents a plain text\
    \ description of the extension.\n\n**Note** The auto-update system in the Google\
    \ Chrome browser compares (the aforementioned) versions of an extension to determine\
    \ whether the extension needs to be updated. If the published extension has a\
    \ newer version string than the installed extension, the extension is automatically\
    \ updated. At the time of writing this book, the extension update frequency is\
    \ five hours.\n\n# Adding the Button: Browser-Action\n\nNow you need to add the\
    \ code for the clickable button in the Google Chrome toolbar. This is also known\
    \ as the *Browser-Action* button, or simply Browser-Action. For this, you need\
    \ to add another attribute in your manifest called `browser_action`. The `browser_action`\
    \ attribute takes an object value (i.e. `{}`) comprised of the following (string)\
    \ keys: `default_title`, `default_icon`, and `default_popup`.\n\nAs you can see\
    \ in Listing 1-1, each of these keys takes a string value. The `default_title`\
    \ key represents the tooltip (string) for the Browser-Action. The `default_icon`\
    \ key represents the (relative) path to the PNG image resource to be used as the\
    \ icon. And similarly, `default_popup` represents the (relative) path to the HTML\
    \ file to be used as the popup (view).\n\n**Listing 1-1.** Chapter 1 /ShowTime/manifest.json\n\
    \n```\n{\n  \"manifest_version\": 2,\n  \"name\": \"ShowTime\",\n  \"description\"\
    : \"Extension to show the current time and date\",\n  \"version\": \"1.2\",\n\
    \  \"browser_action\": {\n    \"default_title\": \"ShowTime\",\n```"
