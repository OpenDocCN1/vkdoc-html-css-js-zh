    ’s Exercise Files folder (see Figur[e 2-9](#index_split_000.html#p67) ).


    ***Figure 2-9.** Exercise files: HelloShortcutKey*


    [As seen in Listing 2-5 , the](#index_split_000.html#p66) addListener method is
    used to attach a listener to the onCommand event. The listener function receives
    a string argument “command” , which represents name of the command (i.e., shortcut
    key) that was performed. In this case, if “command” is logged to the console,
    it will display the string “shortcut-key to change the extension icon” . This
    argument is useful when an extension has multiple commands defined in the manifest.
    To separate the logic inside the listener (based on different commands) you need
    to branch out on different commands (names) that were performed (for example,
    using if or switch ). Obviously, it’s best to avoid the use of long and descriptive
    names for commands to make the comparisons easier.


    ■ **Note** Do not get confused between the addListener and the addEventListener
    methods. The latter belongs to the DOM API, which you are already familiar with.


    Event Scripts


    In the previous topic, you learned about the event-script scripting component.


    Let’s discuss more about this scripting component, including how it is declared
    in the manifest, why it needs to represent the extension runtime, and how persistent
    it is compared to other scripts.


