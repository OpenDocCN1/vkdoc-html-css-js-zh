    \ 2-4 所示。\n\n![](img/index-56_1.jpg)\n\n**图 2-4. 检查弹出窗口：控制台面板**\n\n弹出窗口脚本的一个非常重要的特性是它们可以访问\
    \ Chrome 扩展程序 API。此外，作为 JavaScript 文件，弹出窗口脚本可以访问所有标准的 JavaScript API，包括用于监听和响应弹出窗口内节点触发的\
