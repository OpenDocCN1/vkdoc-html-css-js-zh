  trans: "\n# 如前所述，HTML 文件代表了扩展程序弹窗的视图。JavaScript 文件将包含应用程序逻辑（在此例中，即显示当前时间和日期的逻辑）。清单文件将向\
    \ Chrome 浏览器提供扩展程序本身的信息。显而易见，`icon.png` 文件将被 Chrome 浏览器用来为你的扩展程序创建按钮（参见图 1-10）。\n\
    \n**图 1-10.** Google Chrome 工具栏中的扩展程序按钮\n\n## 验证 JSON 文件\n\n现在，在你最喜欢的文本编辑器中打开\
    \ `manifest.json` 文件。但在开始之前，有一件重要的事情需要注意：JSON 文件*不能*包含注释。这包括单行注释和多行注释。在 Chrome\
    \ 网上应用店上传扩展程序包时，大多数错误都是由清单文件中的此类注释引起的。在 Chrome 浏览器本地测试扩展程序时，这些错误不会被报告。\n\n**注意**\
    \ 不过，为了演示目的，代码清单和相关材料中*使用了*注释。\n\n因此，每当你觉得清单文件状态不佳时（例如，可能包含一些拼写错误或其他格式错误），可以放心地尝试任意*JSON\
    \ 校验工具*。网上有大量此类在线校验工具。例如，[`jsonlint.com`](http://jsonlint.com/)、[`jsonschemalint.com`](http://jsonschemalint.com/)\
    \ 等。话虽如此，你现在终于可以打开清单文件进行编辑了。\n\n# 创建清单\n\n在你的空清单文件中添加以下属性：`manifest_version`、`name`\
    \ 和 `version`。这些是清单文件中的必填字段。`manifest_version` 代表清单文件格式的版本。`name` 代表扩展程序的名称。同样地，`version`\
    \ 是扩展程序的版本。\n\n`manifest_version` 属性接受一个大于 0 的整数值。在撰写本文时，`manifest_version` 属性的有效值是\
    \ 2，这表示它是清单文件格式的第二个版本。`version` 属性接受一个字符串值，该值由（一至四个）以点分隔的整数（介于 0 和 65536 之间）组成。同样地，`name`\
    \ 属性接受一个包含扩展程序名称的字符串值。你还可以添加一个 `description` 属性（带有相应的字符串值），它表示扩展程序的纯文本描述。\n\n\
    **注意** Google Chrome 浏览器中的自动更新系统会比较扩展程序的（前述）版本，以确定该扩展程序是否需要更新。如果已发布的扩展程序版本字符串比已安装的版本更新，则扩展程序会自动更新。在编写本书时，扩展程序的更新检查频率是每五小时一次。\n\
    \n# 添加按钮：浏览器操作\n\n现在，你需要为 Google Chrome 工具栏中可点击的按钮添加代码。这也被称为*浏览器操作*按钮，或简称为浏览器操作。为此，你需要在清单中添加另一个名为\
    \ `browser_action` 的属性。`browser_action` 属性接受一个对象值（即 `{}`），该对象由以下（字符串）键组成：`default_title`、`default_icon`\
    \ 和 `default_popup`。\n\n如清单 1-1 所示，每个键都接受一个字符串值。`default_title` 键代表浏览器操作的（字符串）工具提示。`default_icon`\
    \ 键代表要用作图标的 PNG 图像资源的（相对）路径。同样地，`default_popup` 代表要用作弹窗（视图）的 HTML 文件的（相对）路径。\n\
    \n**清单 1-1.** 第 1 章 /ShowTime/manifest.json\n\n```\n{\n  \"manifest_version\"\
    : 2,\n  \"name\": \"ShowTime\",\n  \"description\": \"显示当前时间和日期的扩展程序\",\n  \"\
    version\": \"1.2\",\n  \"browser_action\": {\n    \"default_title\": \"ShowTime\"\
    ,\n```"
- fmt: "# Chrome 扩展开发指南\n\n## 简介\n\n`\"default_icon\" : \"icon.png\"`, //Used as the\
    \ icon in the Chrome toolbar\n\n`\"default_popup\" : \"popup.html\"`\n\n},\n\n\
    ## 第1章 ■ Google Chrome 扩展入门\n\n`\"icons\" : {`\n\n`\"16\" : \"icon16.png\"`, //Used\
    \ as the favicon for an extension's pages\n\n`\"48\" : \"icon48.png\"`, //Used\
    \ on the extension management page\n\n`\"128\" : \"icon128.png\"` //Used during\
    \ installation & in the Chrome Web Store\n\n`}`\n\n`}`\n\n现在你可以继续学习其他部分，即弹出视图的\
    \ JavaScript 和 HTML 代码。毫不意外地，创建弹出窗口与创建任何其他静态网页并无区别。关于 JavaScript 代码，Chrome 扩展框架在提供其专用\
    \ API 的同时，仍然提供所有标准的 JavaScript API。\n\n这基本上意味着 `ShowTime` 扩展的所有 JavaScript 代码都可以使用标准\
    \ JavaScript API 编写。这包括 `Date` API（用于获取当前日期和时间）和 `DOM` API（用于访问 DOM 树）。\n\n你可以尝试创建用于显示当前时间和日期的\
    \ JavaScript 代码，例如在标题标签（`h1`、`h2` 等）内部。清单 1-2 和 1-3 展示了实现此功能的一种方式。\n\n***Listing\
    \ 1-2.*** Chapter 1 / ShowTime/popup_script.js\n\n```\n//region {variables and\
    \ functions}\n\nvar timeId = \"time\";\nvar dateId = \"date\";\nvar days = [\"\
    Sun\",\"Mon\",\"Tue\",\"Wed\",\"Thu\",\"Fri\",\"Sat\"];\nvar months = [\"Jan\"\
    ,\"Feb\",\"Mar\",\"Apr\",\"May\",\"Jun\",\"Jul\",\"Aug\",\"Sep\",\"Oct\",\"Nov\"\
    ,\"Dec\"];\nvar consoleGreeting = \"Hello World! - from popup_script.js\";\n\n\
    function setTimeAndDate(timeElement,dateElement) {\n    var date = new Date();\n\
    \    var minutes = (date.getMinutes() < 10 ? '0' : '') + date.getMinutes();\n\
    \    var time = date.getHours() + \":\" + minutes;\n    //In \"date.getMonth\"\
    , 0 indicates the first month of the year\n    //In \"date.getDay\", 0 represents\
    \ Sunday\n    var date = days[date.getDay()] + \", \" + months[date.getMonth()]\
    \ + \" \" + date.getDate() + \" \" + date.getFullYear();\n    timeElement.innerHTML\
    \ = time;\n    dateElement.innerHTML = date;\n}\n\n//end-region\n```\n\n清单 1-2\
    \ 中需要注意的一个重要点是，`getMonth` 方法（`Date` 对象的方法）对每年的第一个月返回 0。而 `getDay` 方法（`Date` 对象的方法）对星期日返回\
    \ 0。此外，`setTimeAndDate` 函数接受两个参数，这些参数代表用于显示当前时间和日期的元素。\n\n## 第1章 ■ Google Chrome\
    \ 扩展入门\n\n***Listing 1-3.*** Chapter 1 / ShowTime/popup_script.js\n\n```\n//region\
    \ {calls}\n\nconsole.log(consoleGreeting);\ndocument.addEventListener(\"DOMContentLoaded\"\
    ,function(dcle) {\n    var timeElement = document.getElementById(timeId);\n  \
    \  var dateElement = document.getElementById(dateId);\n    setTimeAndDate(timeElement,dateElement);\n\
    });\n\n//end-region\n```\n\n清单 1-3 包含剩余的 JavaScript 代码，其中调用了 `setTimeAndDate`\
    \ 函数。如代码所示，在文档加载完成后访问 DOM 是一种良好实践（这就是为什么 `setTimeAndDate` 函数在 `DOMContentLoaded`\
    \ 事件的监听器内部被调用）。\n\n你可能想知道 `console.log` 方法的输出。这将在后续关于调试扩展的主题中讨论。但在此之前，你首先需要知道如何在浏览器中加载扩展。这将在下一节\"\
    加载扩展文件夹\"中讨论。\n\n***Listing 1-4.*** Chapter 1 / ShowTime/popup.html\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<!-- The following tag is not obeyed -->\n<title>ShowTime\
    \ (Custom)</title>\n<!--\n<script>\n// Inline scripts are not allowed\nalert('Hello\
    \ World');\n</script>\n-->\n<!-- Referring scripts is allowed -->\n<script src=\"\
    popup_script.js\"></script>\n<style>\nbody {\n    padding:0px;\n    margin:0px;\n\
    \    width:300px;\n    height:200px;\n}\n```\n\n## 第1章 ■ Google Chrome 扩展入门\n\n\
    查看清单 1-4 和 1-5，其中包含 HTML 代码。这里有一个非常重要的点需要注意：在弹出窗口中***不允许***内联脚本！但可以引用脚本，如代码所示。`src`\
    \ 属性应始终指向脚本文件的*相对*路径（即相对于扩展文件夹）。此外，你也可以将应用逻辑拆分为多个 JavaScript 文件，但每个文件都需要单独引用。\n\
    \n`style` 标签内的 CSS 也可以提取到外部 CSS 文件中，并通过 `<link type=\"text/css\" rel=\"stylesheet\"\
    \ href=\"some_file.css\" />` 进行引用。\n\n***Listing 1-5.*** Chapter 1 / ShowTime/popup.html\n\
    \n```\nh1,h2 {\n    display:table-row;\n    vertical-align:middle;\n    text-align:center;\n\
    }\nh2 {\n    background-color:#777;\n}\n.unselectable {\n    -webkit-user-select:none;\n\
    \    cursor:default;\n}\n</style>\n</head>\n<body>\n<div class=\"unselectable\"\
    >\n    <h1 class=\"empty\"></h1>\n    <h1 id=\"time\"></h1>\n    <h2 id=\"date\"\
    ></h2>\n</div>\n</body>\n</html>\n```\n\n## 加载扩展文件夹\n\nChrome 浏览器提供了一种非常快速简便的方法来加载扩展文件夹（用于测试目的）。请注意，浏览器不需要任何额外文件，它只期望找到一个包含\
    \ HTML、JavaScript 和 JSON 文件的文件夹。以下步骤演示了如何加载扩展文件夹：\n\n1. 切换到扩展管理页面。回忆一下，该页面位于 URL\
    \ `chrome://extensions`（图 1-1）。\n2. 在此页面上打开\"开发者模式\"选项（见图 1-11）。\n\n![](index-34_1.jpg)\n\
    ![](index-34_2.jpg)\n\n## 第1章 ■ Google Chrome 扩展入门\n\n***Figure 1-11.** 加载扩展：选择开发者模式选项*\n\
    \n3. 这将为页面添加一个额外的区域，其中包含用于加载、打包和更新扩展的按钮（如图 1-11 所示）。\n4. 点击\"加载已解压的扩展程序\"按钮来加载扩展。如图\
    \ 1-12 所示，会弹出一个\"浏览文件夹\"或类似的窗口，提示你选择扩展文件夹。\n\n***Figure 1-12.** 加载扩展：浏览扩展文件夹*\
    \ 16\n\n![](index-35_1.jpg)\n\n## 第1章 ■ Google Chrome 扩展入门\n\n5. 选择你创建的 `ShowTime`\
    \ 文件夹，然后点击\"确定\"继续。成功了！你终于成功在浏览器中加载了你的扩展（见图 1-13 和 1-14）。如前所述，如果你的清单文件格式错误，此时会显示错误信息（\"\
    Manifest is not valid JSON\"），并要求你更正后重新加载。\n\n■ **注意** 你还可以通过从扩展管理页面选择\"允许在无痕模式下运行\"\
    选项来启用扩展在*无痕模式*下运行（见图 1-13）。\n\n***Figure 1-13.** 加载扩展：扩展已列在扩展管理页面中*\n\n一旦扩展成功加载，它也会显示在扩展管理页面上供你配置，如图\
    \ 1-13 所示。最后，要查看弹出窗口，你需要点击 `ShowTime` 扩展对应的浏览器操作按钮。将鼠标悬停在此按钮上时，你还可以看到浏览器操作的提示信息（回想一下，提示字符串是通过清单文件中的\
    \ `default_title` 键设置的）。接下来，你将了解如何调试 Chrome 扩展。\n\n## 调试扩展\n\n在本节中，你将学习如何调试 Chrome\
    \ 扩展。毫不意外地，这种调试与在 Chrome 浏览器上调试简单网页并无区别。你完成此任务的最佳伙伴是——你猜对了——Chrome DevTools。"
