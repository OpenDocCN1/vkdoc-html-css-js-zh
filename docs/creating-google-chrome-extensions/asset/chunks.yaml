  trans: "\n# API 可用性与消息传递\n\n## 创建书签\n\n请注意，如果一个节点是文件夹，它具有以下属性：`id`、`parentId`、`children`\
    \ 和 `title`。如果它是一个书签，则具有以下属性：`id`、`parentId`、`title` 和 `url`。此外，书签树的根节点没有任何父节点，因此不存在\
    \ `parentId`。它包含两个特殊的文件夹作为其子节点——书签栏和其他书签。\n\n> **注意**：你不能使用此 API 在根节点中添加或删除条目。你也不能重命名、移动或删除特殊的书签栏和其他书签文件夹。\n\
    \n![](img/index-141_1.jpg)\n\n要创建书签，请使用 `chrome.bookmarks.create` 方法。此方法接受两个参数——`bookmark`（类型为\
    \ `object`）和 `callback`（类型为 `function`）。使用 `bookmark` 对象中定义的属性——`parentId`、`title`\
    \ 和 `url`——你可以创建一个书签或文件夹。请注意，如果 `url` 为 `null` 或缺失，则创建的书签将是一个文件夹。`callback` 函数接收一个类型为\
    \ `BookmarkTreeNode` 的参数。\n\n**图 3-34.** API 示例：通知 API\n\n清单 3-24 包含相应的代码片段，其中使用\
    \ `bookmark1` 对象，首先创建一个文件夹，然后在该文件夹内部创建一个书签。这是通过 `callback` 函数中的 `result.id` 值实现的。另请参见图\
    \ 3-27，其中包含了已创建的文件夹和书签。一个有趣的事情是，创建的文件夹的 `id`（以蓝色高亮显示）是 `373`，从 URL `chrome://bookmarks/#373`\
    \ 中可以看出。你可以使用 `chrome.bookmarks.get` 方法来检查这一点，如清单 3-24 所示。该方法接受一个字符串 `id` 或这些\
    \ id 的数组，以及一个 `callback` 函数作为其参数。`callback` 函数接收一个 `results` 参数，该参数是一个 `BookmarkTreeNode`\
