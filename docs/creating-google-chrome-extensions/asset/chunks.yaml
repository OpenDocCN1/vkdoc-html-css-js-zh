    Component Usage


    Now that you understand what these components are, let us discuss how we will
    be using them in the topic “Examples on Components” – which contains demo extensions
    for your learning purposes. As mentioned earlier, a Browser-Action component is
    used in an extension where a common functionality is desired for every visited
    page. An example of such an extension is a note-taking extension used to take
    notes on different pages.


    You will be working with this note-taking extension in the topic


    “BrowserActionNotes” (to utilize a Browser-Action). And for the Page-Action demo,
    you’ll be working with a modified version of the BrowserActionNotes extension,
    where note-taking will only be allowed on web pages belonging to the stackoverflow.com
    host.


    Additionally, the use of an event script to show Page-Actions has been demonstrated
    in the topic “HelloPageAction Extension”.


    Shortcut Key or Command


    Shortcut key (or command) is another useful input component. As its name suggests,
    a shortcut key is a keyboard shortcut that can be registered as an input to your
    extension.


    Each such shortcut key must be listed in the manifest as an attribute of the commands
    manifest attribute, [as seen in Listing 2-4 . An extension can h](#index_split_000.html#p64)ave
    many such shortcut key attributes, but there can only be a total of four keyboard
    shortcuts mapped to these attributes.


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


