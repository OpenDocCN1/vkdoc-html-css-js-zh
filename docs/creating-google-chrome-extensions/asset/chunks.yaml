    Now you can move to the other parts, i.e., JavaScript and HTML code for the popup
    view. Not so surprisingly, creating the popup is no different from creating any
    other static web page. And regarding the JavaScript code, the Chrome Extensions
    framework while providing its special-purpose APIs, still provides all the standard
    JavaScript APIs.


    It basically means that all the JavaScript code for the ShowTime extension can
    be written using standard JavaScript APIs. This includes the Date API (to get
    the current date and time),and the DOM API (to access the DOM tree).


    You can try to create the JavaScript code for displaying the current time and
    date, say for example inside a heading tag ( h1 , h2 [, etc.). Listings 1-2 and](#index_split_000.html#p31)
    [1-3](#index_split_000.html#p32) show one of the ways this can be done.


    ***Listing 1-2.*** Ch[apter 1 /S](http://dx.doi.org/10.1007/978-1-4842-1775-7_1)howTime/popup_script.js


    //region {variables and functions}


    var timeId = "time";


    var dateId = "date";


    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]; var months =


    ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","


    Nov","Dec"];


    var consoleGreeting = "Hello World! - from popup_script.js";


    function setTimeAndDate(timeElement,dateElement) {


    var date = new Date();


    var minutes = (date.getMinutes() < 10 ? ''0'' : '''') + date.getMinutes();


    var time = date.getHours() + ":" + minutes;


    //In "date.getMonth", 0 indicates the first month of the year


    //In "date.getDay", 0 represents Sunday


    var date = days[date.getDay()] + ", " + months[date.getMonth()] + "


    " + date.getDate() + " " + date.getFullYear();


    timeElement.innerHTML = time;


    dateElement.innerHTML = date;


    }


    //end-region


    An important poin[t to note in Listing 1-2 is th](#index_split_000.html#p31)at
    the getMonth method (of the Date object) returns 0 for the first month of the
    year. And the getDay method (of the Date object) returns 0 for Sunday. Also, the
    setTimeAndDate function takes two arguments.


    These arguments represent the elements used to display the current time and date.


    CHAPTER 1 ■ INTRODUCTION TO GOOGLE CHROME EXTENSIONS


    ***Listing 1-3.*** Ch[apter 1](http://dx.doi.org/10.1007/978-1-4842-1775-7_1)
    /ShowTime/popup_script.js


    //region {calls}


    console.log(consoleGreeting);


    document.addEventListener("DOMContentLoaded",function(dcle) {


    var timeElement = document.getElementById(timeId);


    var dateElement = document.getElementById(dateId);


    setTimeAndDate(timeElement,dateElement);


    });


    //end-region


    Listing [1-3 con](#index_split_000.html#p32)tains the remaining JavaScript code
    where the setTimeAndDate function is called. As displayed, it is a good practice
    to access the DOM after the document has loaded (which is why the setTimeAndDate
    function is called inside the listener for the DOMContentLoaded event ).


    You might be wondering about the output of the console.log method . This is discussed
    in one of the following topics on debugging extensions. But before that, you will
    first need to know how to load an extension in the browser. This is discussed
    in the next section, “Loading the Extension Folder”.


    ***Listing 1-4.*** Ch[apter 1](http://dx.doi.org/10.1007/978-1-4842-1775-7_1)
    / ShowTime/popup.html


    <!DOCTYPE html>


    <html>


    <head>


    <!-- The following tag is not obeyed -->


    <title>ShowTime (Custom)</title>


    <!--


    <script>


    // Inline scripts are not allowed


    alert(''Hello World'');


    </script>


    -->


    <!-- Referring scripts is allowed -->


    <script src="popup_script.js"></script>


    <style>


    body {


    padding:0px;


    margin:0px;


    width:300px;


    height:200px;


    }


    CHAPTER 1 ■ INTRODUCTION TO GOOGLE CHROME EXTENSIONS


    Take a look at [Listings 1-4 and](#index_split_000.html#p32) [1-5 , which con](#index_split_000.html#p33)tain
    the HTML code. There is a very important point to note here. Inlining of scripts
    is *not allowed* in the popup! But scripts can be referred, as displayed in the
    code. The src should always point to the *relative* path to the script file (i.e.
    relative to the extension folder). Additionally, you can also split the application
    logic into multiple JavaScript files. But each should be referred separately.


    The CSS inside the style tag can also be extracted into an external CSS file and
    referred as <link type="text/css" rel="stylesheet" href="some_file.css" /> .


    ***Listing 1-5.*** Ch[apter 1 / S](http://dx.doi.org/10.1007/978-1-4842-1775-7_1)howTime/popup.html
    h1,h2 {


    display:table-row;


    vertical-align:middle;


    text-align:center;


    }


    h2 {


    background-color:#777;


    }


    .unselectable {


    -webkit-user-select:none;


    cursor:default;


    }


    </style>


    </head>


    <body>


    <div class="unselectable">


    <h1 class="empty"></h1>


    <h1 id="time"></h1>


    <h2 id="date"></h2>


    </div>


    </body>


    </html>


    Loading the Extension Folder


    The Chrome browser provides a very quick and easy way to load the extension folder
    in the browser (for testing purposes). Note that no additional file is required
    by the browser.


    It only expects to find a folder with HTML, JavaScript, and a JSON file. The following
    steps demonstrate how to load the extension folder:


    1.


    Tab over to the Extensions Management page. Recall that this


    page is located at the URL chrome://extensions (Figur[e 1-1 ).](#index_split_000.html#p21)


    2.


    Turn on the Developer Mode option (seen in Figur[e 1-11 )](#index_split_000.html#p34)


    on this page.


    ![](index-34_1.jpg)


    ![](index-34_2.jpg)


    CHAPTER 1 ■ INTRODUCTION TO GOOGLE CHROME EXTENSIONS


    ***Figure 1-11.** Loading an extension: Choosing the developer mode option* 3.


    This will add an additional section to the page, with buttons to


    load *,* pack *,* and update extensions (as displayed in Figur[e 1-11 ).](#index_split_000.html#p34)


    4.


    Click on the Load Unpacked Extension button to load the


    extension. As displayed in Figur[e 1-12 , a Br](#index_split_000.html#p34)owse
    for Folder or a similar window will prompt you to choose the


    extension folder.


    ***Figure 1-12.** Loading an extension: Browsing for the extension folder* 16


    ![](index-35_1.jpg)


    CHAPTER 1 ■ INTRODUCTION TO GOOGLE CHROME EXTENSIONS


    5.


    Select the ShowTime folder you created, and click OK to


    proceed. There it is! You have finally loaded your extension in


    the browser (see Figur[es 1-13 and](#index_split_000.html#p35) [1-14 ). As discussed
    earlier](#index_split_000.html#p36), if your manifest file is malformed, an error
    will be shown at


    this stage ( “Manifest is not valid JSON” ). It will ask you to


    correct it and retry the loading process.


    ■ **Note** You can also enable the extension to run in the *incognito mode* by
    selecting the Allow in Incognito option from the Extensions Management page (see
    F[igure 1-13](#index_split_000.html#p35) ).


    ***Figure 1-13.** Loading an extension: Extension is listed in the Extensions
    Management page* As soon as the extension is successfully loaded, it will also
    be available (for configuration) in the Extensions Management page, as displayed
    in Figur[e 1-13](#index_split_000.html#p35) . Finally, to view the popup, you
    need to click on the Browser-Action (button) corresponding to the ShowTime extension.
    Upon hovering over this button, you can also see the tooltip for the Browser-Action
    (recall that the tooltip string was set using the default_title key in the manifest
    file). Next, you’ll find out how to debug Chrome Extensions.


    Debugging an Extension


    In this section, you learn about debugging Chrome Extensions. Not so surprisingly,
    this debugging is not different from debugging simple web pages on the Chrome
    browser.


    Your best friend for this task is—you guessed it—Chrome DevTools.'
