    (which is of Tab type). The info object contains important information when a
    context menu item is clicked. This information can be used to take actions depending
    on the item that was clicked. For example[, in Listing 3-5 , the](#index_split_000.html#p105)
    info.menuItemId property is simply logged to the console (Figur[e 3-11](#index_split_000.html#p105)
