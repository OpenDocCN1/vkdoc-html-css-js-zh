- fmt: "`Browser-Action`和`Page-Action`组件是Google Chrome工具栏中的按钮，如图2-1所示。`Browser-Action`始终位于地址栏的右侧（地址栏外部），而`Page-Action`始终位于地址栏内部（与地址栏右侧对齐）。在图2-1中，`Browser-Action`是位于多功能框右侧的圆形紫色按钮。`Page-Action`是位于多功能框内部的浅紫色三角形按钮。请注意，一个扩展**只能**使用其中之一——要么是`Browser-Action`，要么是`Page-Action`组件。\n\
    \n`Browser-Action`和`Page-Action`都有一个与之关联的`popup`组件（以及图标和标题）。当点击对应`Browser-Action`或`Page-Action`按钮的图标时，会显示此弹出窗口。在清单文件中为这些操作分配的标题会被设置为`Browser-Action`或`Page-Action`按钮的`tooltip`（取决于您使用的是哪一个）。`Browser-Action`和`Page-Action`的API可以从所有脚本组件中访问，但内容脚本除外。`chrome.browserAction`对象用于访问`Browser-Action`的API。类似地，`chrome.pageAction`对象用于访问`Page-Action`的API。\n\
    \n**第2章 ■ 架构概述**\n\n> **注** 在Google Chrome浏览器中，地址栏也称为*mnibox*。在本书中，这两个词可互换使用。\n\
    \n## 需要单独操作的原因\n\n`Browser-Action`表示对所有网页通用的操作，而`Page-Action`则并非如此。`Page-Action`是针对特定网页设计的（例如，属于`facebook.com`的网页、包含密码字段的网页等）。这就是`Page-Action`名称的由来。这是Chrome的建议，但并没有阻止您违反它。您可以为所有网页使用`Page-Action`，而不是（建议的）仅用于特定网页。但在API和架构方面，`Page-Action`有一个限制，这清楚地表明了其实际用途。\n\
    \n一旦在清单文件中声明和定义，`Browser-Action`始终可见。`Page-Action`则并非如此。为了在浏览器中显示`Page-Action`按钮，需要从任何脚本组件（内容脚本除外）调用`chrome.pageAction.show(tabId)`方法（参见清单2-7和2-8）。此外，`chrome.declarativeContent`API也可用于显示`Page-Action`（不必担心，您将在后续主题中了解更多关于这些API的知识）。\n\
    \n> **注** 在扩展开发的上下文中，每个标签页都有一个唯一的ID。此外，在Chrome扩展框架中，每个标签页都使用`Tab`类型表示。此类型具有许多相关属性，其中重要的包括`id`、`active`和`url`。完整的属性列表可在URL\
    \ [https://developer.chrome.com/extensions/tabs#type](https://developer.chrome.com/extensions/tabs#type)\
    \ 找到。`chrome.tabs`API用于操作标签页。您将在本章后续主题中了解更多相关内容。\n\n请注意，`popup`组件可用于`Browser-Action`和`Page-Action`输入组件。由于弹出脚本始终附加到弹出窗口，因此该脚本始终可用于这些输入组件（显然，只要用户点击这些输入组件后弹出窗口可见即可）。`popup`组件的唯一目的是包含额外的视图，例如表单字段。\n\
    \n但要显示弹出窗口，需要点击对应`Browser-Action`或`Page-Action`组件的按钮。\n\n## 此组件的清单文件作用\n\n`Browser-Action`和`Page-Action`组件需要在清单文件中声明。除了声明之外，您还需要定义这些组件（无论您在扩展中使用哪一个）。`Browser-Action`在清单文件中按以下方式声明（和定义）（清单2-2）。\n\
    \n**第2章 ■ 架构概述**\n\n***清单2-2.*** 第2章/HelloBrowserAction/manifest.json\n\n```json\n\
    \"browser_action\" : {\n  \"default_title\" : \"HelloBrowserAction\",\n  \"default_icon\"\
    \ : \"icon.png\",\n  \"default_popup\" : \"popup.html\"\n}\n```\n\n类似地，清单2-3演示了如何在清单文件中声明（和定义）`Page-Action`。再次提醒您，**一个扩展只能使用其中之一**——要么是`Browser-Action`组件，要么是`Page-Action`组件，但不能同时使用。\n\
    \n***清单2-3.*** 第2章/HelloPageAction/manifest.json\n\n```json\n\"page_action\" :\
    \ {\n  \"default_title\" : \"HelloPageAction\",\n  \"default_icon\" : \"icon.png\"\
    ,\n  \"default_popup\" : \"popup.html\"\n}\n```\n\n如您所见，这两个输入组件的声明和定义是同时进行的。如果清单中仅包含属性（`browser_action`或`page_action`）而没有对应的值，当尝试将此包上传到Chrome浏览器进行测试时，将会产生错误。因此，除了属性外，您还需要提供相应的值。对于`Browser-Action`和`Page-Action`组件，这些值是键值对，包含以下键：\n\
    \n*   `default_title` — 设置为扩展的提示工具\n*   `default_icon` — 设置此路径下的PNG图像资源作为扩展的图标\n\
    *   `default_popup` — 设置此路径下的HTML文件作为扩展的弹出窗口\n\n> **注** 清单文件中提供的所有资源路径都是相对于扩展文件夹根目录的。例如，如果您有一个名为`HelloWorldExtension`的文件夹，其中包含清单文件，那么`default_icon\
    \ \"icon.png\"`是相对于根目录的，其完整路径将是`HelloWorldExtension/icon.png`。因此，请确保只提供相对路径。\n\
    \n## 定义组件\n\n对于`browser_action`或`page_action`属性，`null`、空字符串、`bool`等都是无效值。唯一允许的值是一个对象，即`{}`。此对象可以为空。\n\
    \n这通常是为了快速部署扩展以进行测试。此外，有时您可能出于其他原因（如下文所述）而有意这样做。\n\n无论情况如何，只要`browser_action`或`page_action`属性的值为空对象，扩展就可以成功加载。\n\
    \n您可能会疑惑，不提供值的情况下这是如何工作的。嗯，它能工作是因为Chrome会提供一个默认的扩展图标（如图2-5所示）和一个默认的标题（使用您在清单文件中为`name`属性分配的扩展名称）。但不会为此操作设置默认的弹出窗口。\n\
    \n***图2-5.** Google Chrome浏览器中的默认扩展图标*\n\n请注意，所有这些属性键都带有`default`前缀，因为它们的值可以由扩展运行时使用某些API调用（由Chrome扩展框架提供）覆盖。这些调用分别列于表2-1（`Page-Action`组件）和表2-2（`Browser-Action`组件）。\n\
    \n***表2-1.** Page-Action：设置标题、图标和弹出窗口*\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `chrome.pageAction.setTitle(object\
    \ details)` | `details`对象接受键`tabId`和`title`，其中（整数）`tabId`是您要修改Page-Action的标签页ID，`title`是提示工具字符串。\
    \ |\n| `chrome.pageAction.setIcon(object details, function callback)` | `details`对象接受键`tabId`和`path`，其中`path`是相对图像路径。（可选的）`callback`参数应是一个看起来像`function()\
    \ {...}`的函数。 |"
  raw: 'The Browser-Action and Page-Action components are buttons in the Google Chrome
    toolbar, as displayed in Figur[e 2-1 . Br](#index_split_000.html#p53)owser-Action
    is always located just right of the address bar (outside it), whereas Page-Action
    is always located inside the address bar (aligned to its right edge). In Figur[e
    2-1 , Br](#index_split_000.html#p53)owser-Action is the circular, purple button,
    just to the right of the omnibox. Page-Action is the triangular, light-purple
    button that’s located inside the omnibox. Note that an extension can *only* use
    one of these—either a Browser-Action or a Page-Action component.


    Both, Browser-Action and Page-Action have a *popup* component associated with
    them (along with an icon and a title). This popup gets displayed upon clicking
    on the icon corresponding to a Browser-Action or a Page-Action button. The title
    assigned in the manifest for these actions is set as the *tooltip* for the Browser-Action
    or Page-Action button (whichever one you are using). The Browser-Action and Page-Action
    APIs can be accessed from all the scripting components, except content scripts.
    The chrome.


    browserAction object is used to access the API for Browser-Action. Similarly,
    the chrome.pageAction object is used to access the API for Page-Action.


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    ■ **Note** In Google Chrome browser, the address bar is also known as an *omnibox*
    .


    Throughout this book, these words are used interchangeably.


    Need for Separate Actions


    While a Browser-Action represents an action that is common to all web pages, it
    is not so with a Page-Action. Page-Actions are meant for specific web pages (for
    example, web pages belonging to facebook.com , web pages with password fields,
    etc.). This is why a Page-Action is named so. This is a recommendation from Chrome,
    but there is nothing to stop you from going against it. You could use Page-Actions
    for all web pages instead of (the recommended way) only specific ones. But still,
    in terms of the API and the architecture, there is a limitation set on Page-Actions
    that makes it quite clear what they are actually intended for.


    Once declared and defined in the manifest, a Browser-Action is always visible.
    This is not so with a Page-Action. In order to display the Page-Action button
    in the browser, a call to the chrome.pageAction.show(tabId) method needs to be
    made (see Listings 2-7 and 2-8) from any of the scripting components (except a
    content script). In addition to this, the chrome.declarativeContent API can also
    be used to display Page-Actions (don’t get overwhelmed, as you will learn more
    about these APIs in the topics that follow).


    ■ **Note** In the context of extensions development, every tab has a unique ID.
    Additionally, in the Chrome Extensions framework, every tab is represented using
    the Tab type. This type has many properties associated with it and important ones
    include id , active , and url .


    The complete list of properties is available a[t the URL https://developer.chrome.com/](https://developer.chrome.com/extensions/tabs#type)


    [extensions/tabs#type](https://developer.chrome.com/extensions/tabs#type) . The
    chrome.tabs API is used to manipulate the tabs. You will read more about this
    in the upcoming topics in this chapter.


    Note that the popup component is available to Browser-Action and Page-Action input
    components. And because a popup script is always attached to the popup, it is
    implied that this script is always available to these input components (obviously,
    as long as the popup is visible after the user clicks on these input components).
    The popup component has the sole purpose of containing additional views, for example,
    form fields.


    But to display a popup, the button corresponding to a Browser-Action or Page-Action
    component needs to be clicked.


    Role of the Manifest for This Component


    The Browser-Action and Page-Action components need to be declared in the manifest
    file. Apart from the declarations, you also need to define these components (whichever
    one you are using in your extension). Browser-Action is declared (and defined)
    in the following wa[y (Listing 2-2](#index_split_000.html#p61) ) in the manifest
    file.


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    ***Listing 2-2.*** Ch[apter 2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)
    /HelloBrowserAction/manifest.json


    "browser_action" : {


    "default_title" : "HelloBrowserAction",


    "default_icon" : "icon.png",


    "default_popup" : "popup.html"


    }


    Similarly, Listing [2-3](#index_split_000.html#p61) displays how to declare (and
    define) a Page-Action in the manifest file. You are reminded again that *an extension
    can use only one of these* —either the Browser-Action or Page-Action component,
    but not both.


    ***Listing 2-3.*** Ch[apter 2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)
    /HelloPageAction/manifest.json


    "page_action" : {


    "default_title" : "HelloPageAction",


    "default_icon" : "icon.png",


    "default_popup" : "popup.html"


    }


    As you can see, the declaration and definition go together for these two input
    components. Simply saving the manifest with only the attributes ( browser_action
    or page_action ) will produce errors when you try to upload this package into
    the Chrome browser for testing. So, along with the attribute, you also need to
    provide the corresponding value. For the Browser-Action and Page-Action components,
    those values are key-value pairs with the following keys.


    • default_title —Set as the tooltip for the extension


    • default_icon —PNG image resource at this path is set as the icon


    for the extension


    • default_popup —HTML file at this path is set as the popup for the


    extension


    ■ **Note** All resource paths provided in the manifest file are relative to the
    root of your extension folder. For example, if you have a folder named HelloWorldExtension
    that contains the manifest, then default-icon “icon.png” is taken relative to
    the root. It would be HelloWorldExtension/icon.png . So make sure you only provide
    relative paths.


    Defining the Component


    For the browser_action or page_action attributes, null , empty-string , bool ,
    etc. are all invalid values. The only allowed value is an object, i.e. {} . This
    object can be left empty.


    This is usually done for quick deployment of an extension, for testing purposes.
    Moreover, sometimes you may want so intentionally for another reason (as explained
    ahead).


    ![](index-62_1.jpg)


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    Whatever the scenario is, an extension will load successfully with an empty object
    as the value for a browser_action or page_action attribute.


    You may be puzzled by how this works without providing the values. Well, it works
    because Chrome will provide a default extension icon (as seen in Figure [2-5 )
    and a defa](#index_split_000.html#p62)ult title (using the name you have assigned
    to your extension in the manifest file for the name attribute). No default popup
    will be set for this action.


    ***Figure 2-5.** Default extension icon in Google Chrome browser* Note that all
    these attribute keys are prefixed with default because their values can be overridden
    by the extension runtime using certain API calls (provided by the Chrome Extensions
    framework). The calls are listed in Ta[bles 2-1](#index_split_000.html#p62) [and
    2-2 for the P](#index_split_000.html#p63)age-Action and Browser-Action components,
    respectively.


    ***Table 2-1.** Page-Action : Setting Title, Icon, and Popup* **Method**


    **Description**


    chrome.pageAction.


    Details object takes keys tabId and title , where


    setTitle(object details)


    (integer) tabId is the ID of the tab for which you want


    to modify the Page-Action and title is the tooltip


    string.


    chrome.pageAction.


    Details object takes keys tabId and path , where path


    setIcon(object details,


    is the relative image path. The (optional) callback


    function callback)


    parameter should be a function that looks like


    function() {...} .


    chrome.pageAction.'
  trans: "\n`Browser-Action`和`Page-Action`组件是 Google Chrome 工具栏中的按钮，如图 2-1 所示。`Browser-Action`始终位于地址栏的右侧（地址栏外部），而`Page-Action`始终位于地址栏内部（与地址栏右侧对齐）。在图\
    \ 2-1 中，`Browser-Action`是位于多功能框右侧的圆形紫色按钮。`Page-Action`是位于多功能框内部的浅紫色三角形按钮。请注意，一个扩展**只能**使用其中之一——要么是`Browser-Action`，要么是`Page-Action`组件。\n\
    \n`Browser-Action`和`Page-Action`都有一个与之关联的`popup`组件（以及图标和标题）。当点击对应`Browser-Action`或`Page-Action`按钮的图标时，会显示此弹出窗口。在清单文件中为这些操作分配的标题会被设置为`Browser-Action`或`Page-Action`按钮的`tooltip`（取决于您使用的是哪一个）。`Browser-Action`和`Page-Action`的\
    \ API 可以从所有脚本组件中访问，但内容脚本除外。`chrome.browserAction`对象用于访问`Browser-Action`的 API。类似地，`chrome.pageAction`对象用于访问`Page-Action`的\
    \ API。\n\n**第 2 章 ■ 架构概述**\n\n> **注** 在 Google Chrome 浏览器中，地址栏也称为*多功能框*。在本书中，这两个词可互换使用。\n\
    \n## 需要单独操作的原因\n\n`Browser-Action`表示对所有网页通用的操作，而`Page-Action`则并非如此。`Page-Action`是针对特定网页设计的（例如，属于`facebook.com`的网页、包含密码字段的网页等）。这就是`Page-Action`名称的由来。这是\
    \ Chrome 的建议，但并没有阻止您违反它。您可以为所有网页使用`Page-Action`，而不是（建议的）仅用于特定网页。但在 API 和架构方面，`Page-Action`有一个限制，这清楚地表明了其实际用途。\n\
    \n一旦在清单文件中声明和定义，`Browser-Action`始终可见。`Page-Action`则并非如此。为了在浏览器中显示`Page-Action`按钮，需要从任何脚本组件（内容脚本除外）调用`chrome.pageAction.show(tabId)`方法（参见清单\
    \ 2-7 和 2-8）。此外，`chrome.declarativeContent`API 也可用于显示`Page-Action`（不必担心，您将在后续主题中了解更多关于这些\
    \ API 的知识）。\n\n> **注** 在扩展开发的上下文中，每个标签页都有一个唯一的 ID。此外，在 Chrome 扩展框架中，每个标签页都使用`Tab`类型表示。此类型具有许多相关属性，其中重要的包括`id`、`active`和`url`。完整的属性列表可在\
    \ URL [`developer.chrome.com/extensions/tabs#type`](https://developer.chrome.com/extensions/tabs#type)\
    \ 找到。`chrome.tabs`API 用于操作标签页。您将在本章后续主题中了解更多相关内容。\n\n请注意，`popup`组件可用于`Browser-Action`和`Page-Action`输入组件。由于弹出脚本始终附加到弹出窗口，因此该脚本始终可用于这些输入组件（显然，只要用户点击这些输入组件后弹出窗口可见即可）。`popup`组件的唯一目的是包含额外的视图，例如表单字段。\n\
    \n但要显示弹出窗口，需要点击对应`Browser-Action`或`Page-Action`组件的按钮。\n\n## 此组件的清单文件作用\n\n`Browser-Action`和`Page-Action`组件需要在清单文件中声明。除了声明之外，您还需要定义这些组件（无论您在扩展中使用哪一个）。`Browser-Action`在清单文件中按以下方式声明（和定义）（清单\
    \ 2-2）。\n\n**第 2 章 ■ 架构概述**\n\n***清单 2-2.*** 第 2 章/HelloBrowserAction/manifest.json\n\
    \n```json\n\"browser_action\" : {\n  \"default_title\" : \"HelloBrowserAction\"\
    ,\n  \"default_icon\" : \"icon.png\",\n  \"default_popup\" : \"popup.html\"\n\
    }\n```\n\n类似地，清单 2-3 演示了如何在清单文件中声明（和定义）`Page-Action`。再次提醒您，**一个扩展只能使用其中之一**——要么是`Browser-Action`组件，要么是`Page-Action`组件，但不能同时使用。\n\
    \n***清单 2-3.*** 第 2 章/HelloPageAction/manifest.json\n\n```json\n\"page_action\"\
    \ : {\n  \"default_title\" : \"HelloPageAction\",\n  \"default_icon\" : \"icon.png\"\
    ,\n  \"default_popup\" : \"popup.html\"\n}\n```\n\n如您所见，这两个输入组件的声明和定义是同时进行的。如果清单中仅包含属性（`browser_action`或`page_action`）而没有对应的值，当尝试将此包上传到\
    \ Chrome 浏览器进行测试时，将会产生错误。因此，除了属性外，您还需要提供相应的值。对于`Browser-Action`和`Page-Action`组件，这些值是键值对，包含以下键：\n\
    \n*   `default_title` — 设置为扩展的提示工具\n*   `default_icon` — 设置此路径下的 PNG 图像资源作为扩展的图标\n\
    *   `default_popup` — 设置此路径下的 HTML 文件作为扩展的弹出窗口\n\n> **注** 清单文件中提供的所有资源路径都是相对于扩展文件夹根目录的。例如，如果您有一个名为`HelloWorldExtension`的文件夹，其中包含清单文件，那么`default_icon\
    \ \"icon.png\"`是相对于根目录的，其完整路径将是`HelloWorldExtension/icon.png`。因此，请确保只提供相对路径。\n\
    \n## 定义组件\n\n对于`browser_action`或`page_action`属性，`null`、空字符串、`bool`等都是无效值。唯一允许的值是一个对象，即`{}`。此对象可以为空。\n\
    \n这通常是为了快速部署扩展以进行测试。此外，有时您可能出于其他原因（如下文所述）而有意这样做。\n\n无论情况如何，只要`browser_action`或`page_action`属性的值为空对象，扩展就可以成功加载。\n\
    \n您可能会疑惑，不提供值的情况下这是如何工作的。嗯，它能工作是因为 Chrome 会提供一个默认的扩展图标（如图 2-5 所示）和一个默认的标题（使用您在清单文件中为`name`属性分配的扩展名称）。但不会为此操作设置默认的弹出窗口。\n\
    \n***图 2-5.** Google Chrome 浏览器中的默认扩展图标*\n\n请注意，所有这些属性键都带有`default`前缀，因为它们的值可以由扩展运行时使用某些\
    \ API 调用（由 Chrome 扩展框架提供）覆盖。这些调用分别列于表 2-1（`Page-Action`组件）和表 2-2（`Browser-Action`组件）。\n\
    \n***表 2-1.** Page-Action：设置标题、图标和弹出窗口*\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `chrome.pageAction.setTitle(object\
    \ details)` | `details`对象接受键`tabId`和`title`，其中（整数）`tabId`是您要修改 Page-Action 的标签页\
    \ ID，`title`是提示工具字符串。 |\n| `chrome.pageAction.setIcon(object details, function\
    \ callback)` | `details`对象接受键`tabId`和`path`，其中`path`是相对图像路径。（可选的）`callback`参数应是一个看起来像`function()\
    \ {...}`的函数。 |\n"
- fmt: "# 排版后文本\n\n## `Details`对象\n\n`Details`对象接受键`tabId`和`popup`，其中`popup`是弹出窗口中要显示的HTML文件。如果将其设置为空字符串（`\"\
    \"`），则不显示弹出窗口。\n\n## `chrome.browserAction.setPopup(object details)`\n\n`Details`对象接受键`tabId`和`popup`，其中`popup`是弹出窗口中要显示的HTML文件。如果将其设置为空字符串（`\"\
    \"`），则不显示弹出窗口。\n\n# 第2章 ■ 架构概述\n\n***表2-2.** 浏览器动作：设置标题、图标和弹出窗口*\n\n| **方法** |\
    \ **描述** |\n|----------|----------|\n| `chrome.browserAction.setTitle(object details)`\
    \ | `Details`对象接受键`tabId`和`title`，其中`tabId`（整数）是要限制此修改的标签页ID，`title`是工具提示字符串。当此标签页关闭时，工具提示被重置。\
    \ |\n| `chrome.browserAction.setIcon(object details, function callback)` | `Details`对象接受键`tabId`和`path`，其中`path`是相对图像路径。（可选的）`callback`参数应为一个形如`function()\
    \ {...}`的函数。当此标签页关闭时，图标被重置。 |\n| `chrome.browserAction.setPopup(object details)`\
    \ | `Details`对象接受键`tabId`和`popup`，其中`popup`是弹出窗口中要显示的HTML文件。如果将其设置为空字符串（`\"\"\
    `），则不显示弹出窗口。当此标签页关闭时，弹出窗口被重置。 |\n\n## 组件用法\n\n现在您已经了解了这些组件是什么，让我们讨论如何在“组件示例”主题中使用它们——该主题包含供学习用的演示扩展。如前所述，浏览器动作组件用于需要对每个访问页面实现公共功能的扩展中。此类扩展的一个示例是用于在不同页面上记笔记的笔记记录扩展。\n\
    \n您将在“BrowserActionNotes”主题中操作此笔记记录扩展（以使用浏览器动作）。对于页面动作演示，您将使用修改版的BrowserActionNotes扩展，该扩展仅允许在属于`stackoverflow.com`主机的网页上记笔记。\n\
    \n此外，在“HelloPageAction扩展”主题中演示了使用事件脚本来显示页面动作。\n\n## 快捷键或命令\n\n快捷键（或命令）是另一个有用的输入组件。顾名思义，快捷键是可以注册为扩展输入的键盘快捷方式。\n\
    \n每个这样的快捷键必须作为`commands`清单属性的属性列在清单中，如清单2-4所示。一个扩展可以有多个这样的快捷键属性，但最多只能有四个键盘快捷方式映射到这些属性。\n\
    \n# 第2章 ■ 架构概述\n\n***清单2-4.*** 第2章/HelloShortcutKey/manifest.json\n\n```json\n\
    {\n  \"manifest_version\": 2,\n  \"name\": \"HelloShortcutKey\",\n  \"description\"\
    : \"Extension to demonstrate a Shortcut-Key as an input component\",\n  \"version\"\
    : \"1.2\",\n  \"browser_action\": {\n    \"default_title\": \"HelloShortcutKey\"\
    ,\n    \"default_icon\": \"icon-1.png\"\n  },\n  \"background\": {\n    \"scripts\"\
    : [\"event_script.js\"],\n    \"persistent\": false\n  },\n  \"commands\": {\n\
    \    \"shortcut-key to change the extension icon\": {\n      \"suggested_key\"\
    : { \"default\": \"Alt+Shift+9\" },\n      \"description\": \"Change the extension\
    \ icon\"\n    }\n  }\n}\n```\n\n在清单2-4中，只使用了一个快捷键。如前所述，快捷键（`shortcut-key to change\
    \ the extension icon`）被列为`commands`清单属性的一个属性。映射到该快捷键的实际键盘快捷方式被定义为`suggested_key`属性的`default`属性的值。之所以命名为`default`，是因为它可以被覆盖。\n\
    \n用户可以从`chrome://extensions/configureCommands`窗口手动添加更多快捷方式（见图2-6和2-7）。与快捷键输入组件功能相关的API可通过`chrome.commands`对象访问。除内容脚本外，所有脚本组件都可以使用此API。\n\
    \n![图2-6](index-65_1.jpg)\n![图2-7](index-65_2.jpg)\n\n# 第2章 ■ 架构概述\n\n***图2-6.**\
    \ 为HelloBrowserAction扩展注册快捷方式*\n\n***图2-7.** 为HelloBrowserAction扩展注册的快捷方式*\n\n\
    除此之外，`_execute_browser_action`和`_execute_page_action`是Chrome保留的，用于分别执行浏览器动作和页面动作。命令属性不应以`_`作为其名称的前缀，因为这会导致命令API静默失败。\n\
    \n请注意，在图2-6和2-7中，HelloBrowserAction扩展只能看到一个属性。此属性由Chrome自动生成。\n\n如果您定义自定义快捷方式，它们将显示在`chrome://extensions/configureCommands`窗口中，如图2-8中的HelloShortcutKey扩展所示。\n\
    \n![图2-8](index-66_1.jpg)\n\n# 第2章 ■ 架构概述\n\n***图2-8.** 具有自定义快捷键的HelloShortcutKey扩展*\n\
    \n## `onCommand`事件\n\n为扩展定义了快捷键后，您可以通过监听`onCommand`（`chrome.commands.onCommand`）事件来实现其监听器函数。\n\
    \n如前所述，只有扩展运行时（不要与`chrome.runtime` API混淆）才能监听此类事件。具体来说，能够执行此操作的脚本是扩展中的事件脚本（请参考“表示运行时的脚本”主题，以提醒自己有关扩展运行时的内容）。\n\
    \n***清单2-5.*** 第2章/HelloShortcutKey/event_script.js\n\n```javascript\n//region\
    \ {variables and functions}\nvar consoleGreeting = \"Hello World! - from event_script.js\"\
    ;\nvar details = { \"path\": \"icon-2.png\" };\n//end-region\n\n//region {calls}\n\
    console.log(consoleGreeting);\nchrome.commands.onCommand.addListener(function(command)\
    \ {\n  chrome.browserAction.setIcon(\n    details,\n    function() { /**/ }\n\
    \  );\n});\n//end-region\n```\n\n![图2-9](index-67_1.jpg)\n\n# 第2章 ■ 架构概述\n\n清单2-4和2-5包含了HelloShortcutKey扩展的代码示例。\n\
    \n该扩展为浏览器动作设置了一个默认图标（`icon-1.png`）。借助`onCommand`监听器，它通过调用`chrome.browserAction.setIcon`方法将浏览器动作图标更改为`icon-2.png`。对于此扩展，您可以使用自己的图标或使用第2章练习文件文件夹中提供的图标（见图2-9）。\n\
    \n***图2-9.** 练习文件：HelloShortcutKey*\n\n如清单2-5所示，`addListener`方法用于将监听器附加到`onCommand`事件。监听器函数接收一个字符串参数`command`，该参数表示执行的命令（即快捷键）的名称。在这种情况下，如果`command`被记录到控制台，它将显示字符串`\"\
    shortcut-key to change the extension icon\"`。当扩展在清单中定义了多个命令时，此参数很有用。要分离监听器内部的逻辑（基于不同的命令），您需要根据执行的命令（名称）进行分支处理（例如，使用`if`或`switch`）。显然，最好避免为命令使用长而描述性的名称，以简化比较。\n\
    \n> **注意** 不要混淆`addListener`和`addEventListener`方法。后者属于您已经熟悉的DOM API。\n\n## 事件脚本\n\
    \n在之前的主题中，您学习了事件脚本组件。\n\n让我们进一步讨论此脚本组件，包括它如何在清单中声明、为什么需要表示扩展运行时，以及与其他脚本相比其持久性如何。\n\
    \n# 第2章 ■ 架构概述"
