  trans: "\n# 关于扩展的更多信息\n\n至此，你已经了解了 Google Chrome 扩展的大部分特性，包括其架构、不同组件之间的消息传递，以及 Google\
    \ Chrome 扩展框架所提供的 API。本章将介绍 Google Chrome 扩展的其余特性，例如选项页面、覆盖页面和主题。此外，你还将了解到在开发\
    \ Google Chrome 扩展时需要注意的一些安全问题，其中包括 API 权限、`match pattern` 权限、内容脚本注入等。\n\n## 提供选项页面\n\
    \n你可以通过提供一个选项页面（参见图 4-4），让用户自定义扩展的行为。需要注意的一个重要点是：即使不使用选项页面，也可以轻松实现类似功能。例如，可以通过提供一个包含界面的弹出组件来保存扩展的首选项（比如使用\
    \ `chrome.storage` API）。不过，不建议这样做，因为用户将无法从“扩展程序管理”页面访问到该选项页面（选项链接请参见图 4-3）。\n\n\
    ### 清单文件对该组件的作用\n\n要声明一个选项页面，需要使用 `options_ui` 清单属性。\n\n该属性支持以下属性。如清单 4-1（来自 OverridePages\
    \ 扩展）所示，`page` 和 `chrome_style` 属性足以声明一个扩展的选项页面。\n\n- `page` (字符串) — 选项页面的路径，相对于扩展的根目录。\n\
    - `chrome_style` (布尔值) — 如果为 `true`，Chrome 的用户代理样式表将应用于选项页面。默认值为 `false`，但为了与\
    \ Chrome 的 UI 风格保持一致，建议将此值设置为 `true`。\n- `open_in_tab` (布尔值) — 如果为 `true`，扩展的选项页面将在新标签页中打开，而不是嵌入在\
    \ `chrome://extensions` 页面内。默认值为 `false`，不建议使用 `true`。\n\n***清单 4-1.*** 第 4 章/OverridePages/manifest.json\n\
    \n```\n{\n  \"name\" : \"My New-Tab\",\n  \"version\" : \"1.2\",\n  \"manifest_version\"\
    \ : 2,\n  \"chrome_url_overrides\" : {\n    /*newtab,history,bookmarks*/\n   \
    \ \"newtab\" : \"myNewTab.html\"\n  },\n  \"permissions\" : [\"bookmarks\",\"\
    storage\"],\n  /*Using an options page*/\n  \"options_ui\" : {\n    \"page\" :\
    \ \"myOptionsPage.html\",\n    /*Use Chrome stylesheet*/\n    \"chrome_style\"\
    \ : true\n  }\n}\n```\n\n## 编写选项页面\n\n选项页面完全由一个 HTML 页面构成（如图 4-4 所示）。清单 4-2 包含了\
    \ OverridePages 扩展中使用的选项页面的 HTML 代码。该扩展位于第 4 章的练习文件文件夹中。如前所述，建议通过将清单中的 `chrome_style`\
    \ 属性设置为 `true`，为该 HTML 页面使用 Chrome 样式表。\n\n> **注意** 要以编程方式打开选项页面，请使用 `chrome.runtime.openOptionsPage`\
    \ 方法。\n\n***图 4-1.*** 新标签页：覆盖提示\n\n***清单 4-2.*** 第 4 章/OverridePages/myOptionsPage.html\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>My Options-Page</title>\n<script\
    \ src=\"myOptionsPage_1.js\"></script>\n<style>\ndiv.left {\n  float:left;\n}\n\
    div.right {\n  float:right;\n}\np.clear {\n  clear:both;\n}\n</style>\n</head>\n\
    <body>\n<p>\n<div class=\"left\">\n  仅显示匹配的书签？\n</div>\n<div class=\"right\">\n\
    \  <form>\n    <input type=\"radio\" name=\"highlight\" value=\"1\"> 是\n    <input\
    \ type=\"radio\" name=\"highlight\" value=\"0\" checked=\"checked\"> 否\n  </form>\n\
    </div>\n</p>\n<br>\n<p class=\"clear\">\n  <input type=\"button\" id=\"save\"\
    \ value=\"保存\">\n</p>\n</body>\n</html>\n```\n"
- fmt: "### 排版后的内容\n\nAn options page can refer scripts. The `src` of the script needs\
    \ to point to a path, relative to the extension folder (i.e., the extension’s\
    \ root). In [Listing 4-2](#index_split_001.html#p163), the referred script is\
    \ `myOptionsPage_1.js`. [Listing 4-3](#index_split_001.html#p164) contains the\
    \ corresponding code from this referred script. The purpose of this script is\
    \ to save user preferences for the `OverridePages` extension. The exact details\
    \ of the preference are described in the following topic.\n\n***Listing 4-3.***\
    \ Chapter 4 / `OverridePages/ myOptionsPage_1.js`\n\n```\n//region {variables\
    \ and functions}\nvar storageKey = \"APPEND_MATCHING_ONLY\";\nvar items = {};\n\
    var saveButtonID = \"save\";\n\nfunction logSuccess(task) {\n  console.log(\"\
    %s Successful!\",task);\n}\n//end-region\n\n//region {calls}\ndocument.addEventListener(\"\
    DOMContentLoaded\",function(dcle) {\n  var saveButton = document.getElementById(saveButtonID);\n\
    \  saveButton.addEventListener(\"click\",function(ce) {\n    if(document.forms[0].highlight.value\
    \ == \"1\") {\n      items[storageKey] = true;\n      chrome.storage.sync.set(\n\
    \        items,\n        function() {\n          if(!chrome.runtime.lastError)\n\
    \            logSuccess(\"Set-Storage\");\n        }\n      );\n    } else {\n\
    \      items[storageKey] = false;\n      chrome.storage.sync.set(\n        items,\n\
    \        function() {\n          if(!chrome.runtime.lastError)\n            logSuccess(\"\
    Set-Storage\");\n        }\n      );\n    }\n  });\n});\n//end-region\n```\n\n\
    ## Working with Override Pages\n\n*Override pages* are a way to substitute (i.e.,\
    \ override) an HTML file from the extension for a page that Google Chrome normally\
    \ provides. In addition to HTML, an override page usually has CSS and JavaScript\
    \ code. An extension can override any one of the following pages:\n\n- *Bookmark\
    \ Manager* (`chrome://bookmarks`) — The page that appears when the user chooses\
    \ the Bookmark Manager menu item from the Chrome menu or, on a Mac, the Bookmark\
    \ Manager item from the Bookmarks menu.\n- *History* (`chrome://history`) — The\
    \ page that appears when the user chooses the History menu item from the Chrome\
    \ menu or, on a Mac, the Show Full History item from the History menu.\n- *New\
    \ Tab* (`chrome://newtab`) — The page that appears when the user creates a new\
    \ tab or window.\n\n***Figure 4-2.** New Tab page with bookmarks*\n\n> **Note**\
    \ An extension can override only one page. For example, the `OverridePages` extension,\
    \ provided in the Exercise Files folder, overrides the New Tab page.\n\n***Listing\
    \ 4-4.*** Chapter 4 / `OverridePages/ myNewTab.html`\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>My New-Tab</title>\n  <script src=\"myNewTab_1.js\"></script>\n\
    \  <style>\n    body {\n      background-color:#eee;\n    }\n    h2 {\n      width:50%;\n\
    \      margin:auto auto;\n      text-align:center;\n      color:#555;\n    }\n\
    \    ul {\n      padding:0px;\n      width:60%;\n      margin-left:auto;\n   \
    \   margin-right:auto;\n      margin-top:100px;\n      text-align:center;\n  \
    \    border:2px dashed #555;\n    }\n    li {\n      overflow:hidden;\n      list-style-type:none;\n\
    \    }\n    a {\n      text-decoration:none;\n    }\n    a:hover {\n      text-decoration:underline;\n\
    \    }\n  </style>\n</head>\n<body>\n  <h2>My New-Tab: Chrome Developer Bookmarks</h2>\n\
    \  <ul id=\"list\"></ul>\n</body>\n</html>\n```\n\n## Role of Manifest for this\
    \ Component\n\nTo override a page, use the `chrome_url_overrides` manifest attribute.\
    \ The exact page that will be overridden is specified using the `bookmarks`, `history`,\
    \ or `newtab` property.\n\nAn example for this is shown [in Listing 4-1](#index_split_001.html#p162),\
    \ where the New Tab page is overridden by specifying `\"newtab\" : \"myNewTab.html\"\
    `. [Listing 4-4](#index_split_001.html#p166) contains the corresponding HTML code\
    \ from the `myNewTab.html` file.\n\n***Figure 4-3.** Extensions Management page:\
    \ options link*\n\n## OverridePages Extension\n\nThe `OverridePages` extension\
    \ provided in the Exercise Files folder of this chapter can override the New Tab\
    \ page. You can load this extension in your browser for testing. Note the prompt\
    \ that appears upon loading this extension (see Figure 4-1). This is required\
    \ by the Chrome browser to know if the override is intended (by the user) or not."
