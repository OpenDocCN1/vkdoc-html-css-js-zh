- fmt: '# Adding and Removing URLs


    To add a URL to the history at the current time, use the `chrome.history.addUrl`
    method.


    This method takes two parameters—`details` (of type `object`) and `callback` (of
    type `function`). The `details` object only supports the `url` property. Similarly,
    use the `chrome.history.deleteUrl(object details, function callback)` method to
    remove all occurrences of the given URL from the history. Note that to remove
    all items from the history, you use the `chrome.history.deleteAll` method. This
    method only takes a `callback` function as its parameter.


    *Figure 3-37.* XHRAPI: Logging the response


    ## Associated Events


    The history API supports the `onVisited` and `onVisitRemoved` events. The `onVisited`
    event is fired when a URL is visited, providing the `HistoryItem` data for that
    URL in the corresponding listener function. Note that this event fires before
    the page has loaded.


    Similarly, the `onVisitRemoved` event is fired when one or more URLs are removed
    from the history service. The listener function corresponding to this event receives
    an object.


    This object supports the following properties:


    - **allHistory** (`Boolean`) - `True` if all history was removed. If it’s `true`,
    `URLs` will be empty.

    - **urls** (`array`) - `String` array of removed URLs.


    # Notifications API


    You can use the `chrome.notifications` API to create rich notifications using
    templates and show these notifications to users in the system tray. It uses the
    `notifications` permission. *Listing 3-27* contains the code from the NotificationsAPI
    extension, provided in Chapter 3’s Exercise Files folder.


    ***Listing 3-27.*** Chapter 3 /NotificationsAPI/ event_script.js


    ```

    //region {variables and functions}


    var greeting = "Hello World!";


    var title = "NotificationsAPI";


    var message = "Test message X";


    var oneMinuteAsMilliseconds = 1 * 60 * 1000;


    //getTime returns the number of milliseconds since the epoch


    var currentTimeAsMilliseconds = new Date().getTime();


    var notificationId = "myNotification1";


    var NOTIFICATION_TEMPLATE_TYPE = {


    BASIC : "basic",


    IMAGE : "image",


    LIST : "list",


    PROGRESS : "progress"


    };


    var myButton1 = {


    title : "Click X",


    iconUrl : "button.png"


    };


    var myButton2 = {


    title : "Click Y",


    iconUrl : "button.png"


    };


    var myItem1 = {


    title : "Item X",


    message : "This is item X"


    };


    var myItem2 = {


    title : "Item Y",


    message : "This is item Y"


    };


    var notificationOptions = {


    type : NOTIFICATION_TEMPLATE_TYPE.LIST,


    iconUrl : "icon.png",


    title : title,


    message : message,


    eventTime : currentTimeAsMilliseconds + oneMinuteAsMilliseconds,


    buttons : [myButton1,myButton2],


    /*imageUrl : "icon.png",*/


    items : [myItem1,myItem2], //comment out for BASIC


    /*progress : 0,*/


    isClickable : true


    };


    //end-region


    //region {calls}


    console.log(greeting);


    chrome.notifications.create(notificationId,notificationOptions,


    function(id) {


    console.log("create: " + id);


    }


    );


    /*


    chrome.notifications.clear(notificationId,function(wasCleared) {


    console.log("clear: " + wasCleared);


    });


    */


    /*


    chrome.notifications.getAll(function(notifications) {


    console.log("getAll:");


    console.log(notifications);


    });


    */


    chrome.notifications.onClicked.addListener(function(id) { //notification-id console.log("onClicked:
    " + id);


    notificationOptions.title = title + " (onClicked)";


    chrome.notifications.update(notificationId,notificationOptions,


    function(wasUpdated) {


    console.log("update: " + wasUpdated);


    }


    );


    });


    chrome.notifications.onClosed.addListener(function(notificationId,byUser) {


    console.log("onClosed: " + notificationId);


    });


    chrome.notifications.onButtonClicked.addListener(


    function(notificationId,buttonIndex) {


    console.log("onButtonClicked: " + buttonIndex);


    }


    );


    //end-region

    ```


    ## Creating and Clearing a Notification


    To create a notification, use the `chrome.notifications.create` method. This method
    takes three parameters - `notificationId` (of type `string`), `notificationOptions`
    (of type `object`), and a `callback` function. Note that the `notificationOptions`
    object describes the contents of the notification. The complete list of properties
    it supports is available at [https://developer.chrome.com/apps/notifications#type-NotificationOptions](https://developer.chrome.com/apps/notifications#type-NotificationOptions).


    An important property (in the `notificationOptions` object) called `type` declares
    the template to be used for creating a notification. Other properties such as
    `title`, `message`, `buttons`, `imageUrl`, `items`, `progress`, etc. define the
    specific parts of the template.


    Figures 3-30 to 3-32 contain examples of different notification templates. In
    *Listing 3-27*, note the `NOTIFICATION_TEMPLATE_TYPE` object used as an enum to
    select the notification template.


    You can clear a notification by calling the `chrome.notifications.clear` method,
    which takes the `notificationId` as its parameter. To clear all the notifications,
    use the `clear` method, along with the `chrome.notifications.getAll` method, which
    takes a callback function as its parameter. This callback receives an object consisting
    of all the notifications.


    ## Updating a Notification


    To update an existing notification, use the `chrome.notifications.update` method.
    This method takes three parameters - `notificationId` (of type `string`), `notificationOptions`
    (of type `object`), and a callback function. The callback function receives a
    `Boolean` argument indicating whether the notification updated. In *Listing 3-27*,
    note that the `update` method is called from within the listener function for
    the `onClicked` event.


    ## Associated Events


    The notifications API supports the `onClosed`, `onClicked`, and `onButtonClicked`
    events.


    The `onClosed` event is fired when the notification is closed - either by the
    system or by user action. As seen in *Listing 3-27*, the listener function corresponding
    to this event receives two arguments - (`string`) `notificationId` and (`Boolean`)
    `byUser`.


    The `onButtonClicked` event is fired when the user clicks a button (see Figure
    3-34) in the notification. Note that buttons are provided using the `buttons`
    property in the `notificationOptions` object (see *Listing 3-27*). The listener
    function for this event receives the `notificationId` as well as the `buttonIndex`.
    Similarly, the `onClicked` event is fired when the user clicks in a non-button
    area of the notification. This event is used in *Listing 3-27* to update the notification’s
    `title` property (see Figure 3-33).


    # Storage API


    The storage API (i.e., the `chrome.storage` API) is used to store, retrieve, and
    track changes to user data. It uses the `storage` permission. *Listing 3-28* contains
    the code from the StorageAPI extension, provided in Chapter 3’s Exercise Files
    folder. This API is optimized to meet the specific storage needs of extensions.
    It provides the same storage capabilities as the `localStorage` API with the following
    key differences:


    - User data can be automatically synced with Chrome sync (using `chrome.storage.sync`
    API).

    - Your extension’s content scripts can directly access user data without the need
    for a *background page*.

    - It’s asynchronous with bulk read and write operations, and therefore faster
    than the blocking and serial `localStorage` API.

    - User data can be stored as objects (the `localStorage` API stores data in strings).


    ## Sync versus Local Storage'
