- fmt: "# 架构概览\n\n## 关于弹窗脚本\n\n**注意：** `Popup`脚本也代表扩展运行时。但它们不像事件脚本那样享有那么多特权（例如，持久性），因为弹窗脚本仅在相应弹窗打开时才会执行。因此，弹窗脚本只能成功监听少数事件。\n\
    \n## 事件脚本的必要性\n\n到目前为止讨论的每个组件都有其特定用途。例如，`BrowserAction`和`PageAction`组件作为按钮输入；快捷键提供了一种替代的输入方式；弹窗组件提供视图，而弹窗脚本提供应用程序逻辑。现在你可能已经对事件脚本如何对扩展有用有了大致的了解。以下几点明确说明了其用途：\n\
    \n- 最重要的用途是监听来自输入组件的事件，例如来自`BrowserAction`或`PageAction`组件的点击事件、调用快捷键时的命令事件、以及来自上下文菜单项选择的上下文菜单事件。此外，事件脚本还可以监听来自多功能框输入的事件。以下是输入组件触发的事件的完整列表及相应的输入组件API（这里列出了除`ContentUI`之外的所有输入组件）：\n\
    \  - `chrome.browserAction` — `onClicked`\n  - `chrome.pageAction` — `onClicked`\n\
    \  - `chrome.commands` — `onCommand`\n  - `chrome.contextMenus` — `onClicked`\n\
    \  - `chrome.omnibox` — `onInputStarted`，`onInputChanged`，`onInputEntered`，`onInputCancelled`\n\
    \n**注意：** 如果在`manifest`中为`BrowserAction`或`PageAction`组件定义了`default_popup`，则`onClicked`事件将不会触发。\n\
    \n- 另一个重要用途是监听来自扩展本身的事件。这包括仅能从`chrome.runtime`对象访问的事件，例如`onMessage`，`onConnect`，`onInstalled`，`onUpdateAvailable`等。这些事件大多数是Chrome扩展框架提供的消息API的一部分。你将在下一章中了解这些事件。\n\
    \n**注意：** 内容脚本（一种注入到访问网页中的脚本组件）可用于在宿主网页中创建HTML元素。这些元素在本书中称为Content UI。Content\
    \ UI只能触发标准的JavaScript事件。此外，内容脚本对Chrome扩展API的访问非常有限，因为它们不代表扩展运行时。它们只能访问以下API：`chrome.runtime`，`chrome.extension`和`chrome.storage`。内容脚本仍然可以使用Chrome扩展框架提供的消息API（可通过`chrome.runtime`对象访问）与扩展运行时通信。\n\
    \n- 正如你将在第3章中看到的，使用`onMessage`（或`onConnect`）事件，事件脚本可以监听来自扩展注入到网页中的内容脚本的消息。此外，使用`chrome.runtime.onMessageExternal`事件，事件脚本还可以直接监听来自网页的消息。\n\
    \n- 除了所有这些事件之外，事件脚本还可以监听与各种API功能关联的事件，例如`tabs`，`alarms`，`storage`，`bookmarks`，`history`等。这些事件（及其相应的API）的示例如下：\n\
    \  - `chrome.tabs` — `onCreated`，`onUpdated`，`onRemoved`等\n  - `chrome.alarms`\
    \ — `onAlarm`\n  - `chrome.storage` — `onChanged`\n  - `chrome.bookmarks` — `onCreated`，`onRemoved`，`onChanged`，`onImportBegan`，`onImportEnded`等\n\
    \  - `chrome.history` — `onVisited`，`onVisitRemoved`\n\n- 最重要的是事件脚本的**持久性**，它赋予了所有这些功能。事件脚本能够以可靠的方式监听事件，因为它是一个长期运行的脚本（与弹窗脚本不同，后者仅在弹窗打开时执行）。事件脚本会在需要时（即它们监听的事件被触发时）自动加载，并在再次空闲时卸载。\n\
    \n- 最后，事件脚本还可用于包含由扩展中多个组件共享的应用程序逻辑。例如，考虑一个允许在任何页面上记笔记的笔记扩展。最初，如果只使用`BrowserAction`，整个应用程序逻辑可以放在弹窗脚本中。但如果添加了其他输入组件，弹窗脚本中的代码将无法被这些组件访问（因为弹窗脚本仅在弹窗打开时执行）。\n\
    \n为了允许这种情况，共享代码（反映通用逻辑）可以放在事件脚本中。这使得各种组件可以不受限制地访问通用应用程序逻辑。显然，在这种情况下，弹窗脚本需要使用消息API与事件脚本来回通信（以便访问通用应用程序逻辑）。不要被这个例子搞糊涂，当你在本章后面完成`BrowserActionNotes`扩展时，你会更清楚地理解它。\n\
    \n## 此组件的清单角色\n\n要在你的扩展中使用事件脚本，你需要在`manifest`中定义`background`属性。该属性是一个由`scripts`和`persistent`键组成的对象。\n\
    \n`scripts`键接受一个字符串数组作为其值，其中每个字符串是事件脚本的（相对）路径。而`persistent`键将布尔值`false`作为其值（如清单2-4所示）。允许多个事件脚本以模块化代码（图2-10和2-11），如下所示：\n\
    \n```\n\"background\" : {\n  \"scripts\" : [\"event_script.js\", \"another_event_script.js\"\
    ],\n  \"persistent\" : false\n}\n```\n\n**图2-10.** `HelloShortcutKey`：后台页面\n\n\
    **图2-11.** `HelloShortcutKey`：后台页面\n\n此外，一旦在`manifest`中定义了这些脚本，在扩展成功加载到浏览器后，它们会自动被引用到一个自动生成的HTML页面中，该页面称为**后台页面**，如图2-12和2-13所示。\n\
    \n**图2-12.** 扩展管理页面：`HelloShortcutKey`\n\n**图2-13.** `HelloShortcutKey`：后台页面\n\
    \n实际的HTML文件命名不同（见图2-14）。\n\n**图2-14.** `HelloShortcutKey`：后台页面\n\n## 后台脚本\n\n\
    事件脚本仅在被监听的事件被触发时持久存在。当事件未被触发时，Chrome浏览器会使事件脚本处于非活动状态（请注意，这不会立即发生），如图2-15所示。\n\n\
    **图2-15.** 扩展管理页面：`HelloShortcutKey`\n\n要使此脚本在浏览器打开期间持续存在，你需要通过在`manifest`中将`persistent`设置为`true`来将其标记为持久。此类事件脚本称为**后台脚本**。通常，你不需要在扩展中使用后台脚本。扩展框架中只有少数API调用需要后台脚本才能正确执行。本书中使用的大多数示例除非另有说明，否则仅使用事件脚本。\n\
    \n**注意：** **不推荐**使用后台脚本。这是出于性能原因——它们会占用更多内存和其他系统资源。\n\n## 事件对象"
  raw: '■ **Note** Popup scripts also represent the extension runtime. But they do
    not enjoy as many privileges (for example, persistence) as an event script (because
    a popup script is only executed when the corresponding popup is opened). So, there
    are only a few events which popup scripts can successfully listen to.


    The Need for Event Scripts


    Every component discussed so far has a specific purpose. For example, the BrowserAction
    and Page-Action components serve as button inputs; a shortcut key provides an
    alternative way of providing inputs; a popup component provides a view, and a
    popup script provides the application logic. Now you might have some rough idea
    as to how an event script is useful to an extension (based on your reading so
    far). The following points clearly define its uses:


    • The most important use is listening for events fired from input


    components, such as click events fired from the Browser-Action


    or Page-Action components, command events when invoking a


    shortcut key, and context menu events from context menu item


    selection. Moreover, an event script can also listen for events fired


    from an omnibox input. Following is a complete list of events


    (fired from input components) along with the corresponding


    input component APIs (here, all input components are listed


    except for Content-UI ).


    •


    chrome.browserAction — onClicked


    •


    chrome.pageAction — onClicked


    •


    chrome.commands — onCommand


    •


    chrome.contextMenus — onClicked


    •


    chrome.omnibox — onInputStarted , onInputChanged ,


    onInputEntered , onInputCancelled


    ■ **Note** The onClicked event will not fire if the Browser-Action or Page-Action
    component has default_popup defined in the manifest.


    • Another important use is listening for events fired from the


    extension itself. This includes events such as onMessage ,


    onConnect , onInstalled , onUpdateAvailable , etc., that are only


    accessible from the chrome.runtime object . Most of these events


    are part of the messaging API provided by the Chrome Extensions


    framework. You will read about these events in the next chapter.


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    ■ **Note** Content scripts (a type of scripting component that is injected into
    the visited web pages) can be used to create HTML elements in the host web pages.
    These elements are referred as Content UIs in this book. Content UIs can only
    fire standard JavaScript events.


    Additionally, content scripts have very limited access to the Chrome Extensions
    API because they do not represent the extension runtime. They can only access
    the following APIs— chrome.runtime , chrome.extension , and chrome.storage . Content
    scripts can still communicate with the extension runtime using the messaging API
    (accessible via the chrome.runtime object) provided by the Chrome Extensions framework.


    • As you will see in Ch[apter 3 , using the](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)
    onMessage (or onConnect ) event, an event script can listen for messages from
    content


    scripts(s), injected into a web page by the extension. Additionally,


    using the chrome.runtime.onMessageExternal event , event


    scripts can also listen for messages directly from a web page.


    • Apart from all these events, event scripts can also listen for


    events that are associated with various API features , such as tabs ,


    alarms , storage , bookmarks , history , etc. Examples of such


    events (along with their corresponding APIs) are listed here:


    •


    chrome.tabs — onCreated , onUpdated , onRemoved , etc.


    •


    chrome.alarms — onAlarm


    •


    chrome.storage — onChanged


    •


    chrome.bookmarks — onCreated , onRemoved , onChanged ,


    onImportBegan , onImportEnded , etc.


    •


    chrome.history — onVisited , onVisitRemoved


    • Most important of all is the *persistence* of event-script, which gives rise
    to all of these features. An event script can listen for events in


    a reliable manner because it is a long-running script (unlike the


    popup script, which is only executed when the popup is opened).


    Event scripts are automatically loaded whenever they are *needed*


    (i.e., when the events they are listening to get fired) and are


    unloaded when they go idle again.


    • Lastly, event scripts can also be used for containing the application


    logic that is shared by multiple components in an extension. For


    example, consider a note-taking extension that allows taking notes


    on any page. Initially, if only a Browser-Action is used, the entire


    application logic can be placed within the popup script itself. But


    if additional input components are added, the code inside popup


    script won’t be accessible to these components (because a popup


    script is only executed when a popup is opened).


    ![](index-70_1.jpg)


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    To allow for this, the shared code (reflecting the common


    logic) can be placed inside an event script. This allows various


    components to access the common application logic, without any


    restrictions. Obviously, the popup script (for this case) will need


    to use the messaging API to communicate back and forth with


    the event script (so as to access the common application logic).


    Don’t get overwhelmed with this example, as you will understand


    it more clearly when you work out the BrowserActionNotes


    extension later in this chapter.


    Role of the Manifest for This Component


    To use an event script in your extension, you need to define the background attribute
    in the manifest. This attribute is an object composed of the scripts and persistent
    keys .


    The scripts key takes an array of strings as its value, where each string is the
    (relative) path to an event script. And the persistent key takes the Boolean false
    as its value (as display[ed in Listing 2-4](#index_split_000.html#p64) ). Multiple
    event scripts are simply allowed to modularize the code (Figur[es 2-10](#index_split_000.html#p70)
    [and 2-11](#index_split_000.html#p71) ), as shown in the following lines.


    "background" : {


    "scripts" : ["event_script.js","another_event_script.js"],


    "persistent" : false


    }


    ***Figure 2-10.** HelloShortcutKey : Background page*


    ![](index-71_1.jpg)


    ![](index-71_2.jpg)


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    ***Figure 2-11.** HelloShortcutKey: Background page*


    Additionally, once these script(s) are defined in the manifest—upon the successful
    loading of the extension (in the browser)—they are automatically referred in an
    auto-generated HTML page, known as the *background page* , as shown in Figur[es
    2-12 and](#index_split_000.html#p71) [2-13 .](#index_split_000.html#p72)


