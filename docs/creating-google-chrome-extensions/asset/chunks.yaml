    \ 3-6）。除此之外，它还包含一个页面操作和一个事件脚本组件（参见图 3-12）。注意使用`activeTab`权限仅与当前活动标签页交互（在此情况下，是通过内容脚本组件）。\n\
    \n**清单 3-6.** 第 3 章/HelloContentUI/ manifest.json\n\n```\n{\n    \"manifest_version\"\
    \ : 2,\n    \"name\" : \"HelloContentUI\",\n    \"description\" : \"Show Page-Action\
    \ using Content-UI\",\n    \"version\" : \"1.2\",\n    \"page_action\" : {\n \
    \       \"default_title\" : \"HelloContentUI\",\n        \"default_icon\" : \"\
    icon.png\",\n        \"default_popup\" : \"popup.html\"\n    },\n    \"background\"\
    \ : {\n        \"scripts\" : [\"event_script.js\"],\n        \"persistent\" :\
    \ false\n    },\n    \"permissions\" : [\n        \"activeTab\"\n    ],\n    \"\
    content_scripts\" : [\n        {\n            \"matches\" : [\"*://www.example.org/*\"\
    ],\n            \"js\" : [\"content_script.js\"]\n        }\n    ]\n}\n```\n\n\
    第 3 章 ■ API 可用性和消息传递\n\n**图 3-13.** *HelloContentUI：注入的内容脚本组件*\n\n**清单 3-7.**\
    \ 第 3 章/HelloContentUI/ content_script.js\n\n```\n//region {variables and functions}\n\
    var consoleGreeting = \"Hello World! - from content_script.js\";\nvar requestMessage\
    \ = {\"data\":\"Test message X\"};\nvar responseCallback = function(responseMessage)\
    \ {\n    console.log(\"responseMessage: \" + responseMessage.data);\n};\nfunction\
    \ createButton() {\n    var button = document.createElement(\"button\");\n   \
    \ button.style.width = \"70px\";\n    button.style.height = \"40px\";\n    button.style.position\
    \ = \"fixed\";\n    button.style.top = \"10px\";\n    button.style.right = \"\
    10px\";\n    button.innerText = \"Send Message\";\n    document.body.appendChild(button);\n\
    \    return button;\n}\n//end-region\n```\n\n第 3 章 ■ API 可用性和消息传递\n\n```\n//region\
    \ {calls}\nconsole.log(consoleGreeting);\nvar button = createButton();\nbutton.addEventListener(\"\
    click\",function() {\n    console.log(\"Button clicked!\");\n    chrome.runtime.sendMessage(/*extensionId,*/\n\
