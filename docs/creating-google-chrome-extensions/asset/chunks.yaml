- fmt: "# 使用书签API\n\n要搜索书签，请使用`chrome.bookmarks.search`方法。此方法接受一个查询和一个回调函数作为参数。查询可以使用字符串或对象进行。在[清单3-24](#index_split_001.html#p141)中，查询使用了字符串。如果使用对象，则需要定义以下属性：`query`、`url`和`title`。\n\
    \n***图3-35.** API演示：存储API*\n\n## 使用书签层次结构\n\n书签API提供了`chrome.bookmarks.getTree`方法来检索整个书签层次结构。此方法接受一个函数作为其唯一参数。书签树作为数组传递给此方法。与该API对应的用法可以在以下代码片段中看到。\n\
    \n请注意，树是此传递数组的第一个元素。由于此树使用节点表示，因此使用`children`属性来访问嵌套文件夹。\n\n在这种情况下，文件夹是`Bookmarks\
    \ Bar`和`Other Bookmarks`。通过遍历嵌套的`BookmarkTreeNode`项（例如，使用`folder.children.forEach`调用），您可以访问层次结构中的所有书签。\n\
    \n```\nchrome.bookmarks.getTree(function(bookmarkTreeAsArray) {\n    var bookmarkTree\
    \ = bookmarkTreeAsArray[0];\n    var folders = [];\n    if(bookmarkTree.children)\
    \ {\n        bookmarkTree.children.forEach(function(node) {\n            if(node.children.length\
    \ > 0) folders.push(node);\n        });\n    }\n    if(folders.length > 0) {\n\
    \        folders.forEach(function(folder) {\n            folder.children.forEach(function(bookmarkTreeNode)\
    \ {\n                if(bookmarkTreeNode.url) {\n                    /*use the\
    \ node*/\n                }\n            });\n        });\n    }\n});\n```\n\n\
    ## 相关事件\n\n书签API还提供了一些事件，这些事件在书签树发生特定变化时触发。以下列表包含这些事件及其描述。请注意，正如您在之前的示例中所看到的，要监听这些事件，您需要提供监听器函数。它们通过调用事件的`addListener`来添加。要了解更多关于这些事件的信息，请访问https://developer.chrome.com/extensions/bookmarks。\n\
    \n- `onCreated` — 在创建书签或文件夹时触发\n- `onRemoved` — 在删除书签或文件夹时触发\n- `onChanged` —\
    \ 在书签或文件夹发生变化时触发\n- `onMoved` — 在书签或文件夹移动到不同的父文件夹时触发\n- `onChildrenReordered`\
    \ — 在文件夹的子项因UI中排序而改变顺序时触发\n- `onImportBegan` — 在书签导入会话开始时触发\n- `onImportEnded`\
    \ — 在书签导入会话结束时触发\n\n## 下载API\n\n下载API（即`chrome.downloads`API）用于以编程方式启动、监控、操作和搜索下载。它使用`downloads`权限。\n\
    \n[清单3-25](#index_split_001.html#p144)包含来自DownloadsAPI扩展的代码，该扩展位于第3章的Exercise\
    \ Files文件夹中。\n\n***清单3-25.*** 第3章/DownloadsAPI/event_script.js\n\n```\n//region\
    \ {variables and functions}\nvar greeting = \"Hello World!\";\nvar downloadOptions\
    \ = {\n    \"url\" : \"http://www.apress.com/downloadable/download/sample/sample_id/1456/\"\
    ,\n    \"saveAs\" : true\n};\n//end-region\n\n//region {calls}\nconsole.log(greeting);\n\
    chrome.downloads.download(downloadOptions,function(downloadId) {\n    console.log(downloadId);\n\
    \    /*\n    chrome.downloads.pause(downloadId,function() {\n        if(!chrome.runtime.lastError)\
    \ console.log(\"pause\");\n    });\n    */\n});\nchrome.downloads.onCreated.addListener(function(downloadItem)\
    \ {\n    console.log(\"onCreated:\");\n    console.log(downloadItem);\n});\nchrome.downloads.onErased.addListener(function(downloadId)\
    \ {\n    console.log(\"onErased:\");\n    console.log(downloadId);\n});\nchrome.downloads.onChanged.addListener(function(downloadDelta)\
    \ {\n    console.log(\"onChanged:\");\n    console.log(downloadDelta);\n});\n\
    //end-region\n```\n\n## 下载文件"
  raw: 'To search bookmarks, use the chrome.bookmarks.search method . This method
    takes a query and a callback function as its parameters. Query can be made using
    a string or object. In [Listing 3-24](#index_split_001.html#p141) , query has
    been made using a string. If an object were to be used, it would need to have
    the following properties defined: query , url , and title .


    ***Figure 3-35.** API demos: Storage API*


    Using the Bookmarks Hierarchy


    The bookmarks API provides the chrome.bookmarks.getTree method to retrieve the
    entire bookmarks hierarchy. This method takes a function as its only parameter.
    A bookmark tree is passed as an array to this method. A usage corresponding to
    this API can be seen in the following code snippet.


    Note that the tree is the first element of this passed array. Since this tree
    is represented using a node, the children property is used to access the nested
    folders.


    In this case, the folders are Bookmarks Bar and Other Bookmarks . By iterating
    over the nested BookmarkTreeNode items (say, using the folder.children.forEach
    call), you can access all the bookmarks in the hierarchy.


    chrome.bookmarks.getTree(function(bookmarkTreeAsArray) {


    var bookmarkTree = bookmarkTreeAsArray[0];


    var folders = [];


    if(bookmarkTree.children) {


    bookmarkTree.children.forEach(function(node) {


    if(node.children.length > 0) folders.push(node);


    });


    }


    if(folders.length > 0) {


    folders.forEach(function(folder) {


    folder.children.forEach(function(bookmarkTreeNode) {


    if(bookmarkTreeNode.url) {


    /*use the node*/


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    }


    }


    }


    }


    });


    Associated Events


    The bookmarks API also provides a number of events that are fired when certain
    things happen to the bookmark tree. The following list contains the events, along
    with their descriptions. Note that as you have seen for the previous examples,
    to listen for these events, you need to provide listener functions. They are added
    by calling addListener on the event. To read more about these events[, visit https://developer.chrome.com/](https://developer.chrome.com/extensions/bookmarks)


    [extensions/bookmarks .](https://developer.chrome.com/extensions/bookmarks)


    • onCreated —Fired when a bookmark or folder is created


    • onRemoved —Fired when a bookmark or folder is removed


    • onChanged —Fired when a bookmark or folder changes


    • onMoved —Fired when a bookmark or folder is moved to a different


    parent folder


    • onChildrenReordered —Fired when the children of a folder have


    changed their order due to the order being sorted in the UI


    • onImportBegan —Fired when a bookmark import session begins


    • onImportEnded —Fired when a bookmark import session ends


    Downloads API


    The downloads API (i.e., the chrome.downloads API) is used to programmatically
    initiate, monitor, manipulate, and search for downloads. It uses the downloads
    permission.


    [Listing 3-25 con](#index_split_001.html#p144)tains the code from the DownloadsAPI
    extension, provided in Ch[apter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)
