    ### Extensions and Plug-ins


    To get a complete list of the extensions installed (added) on your Chrome web
    browser, tab over to the URL `chrome://extensions`, as shown in Figure 1-1. This
    page (known as the Extensions Management page) is used to manage extensions in
    the Chrome browser.


    ***Figure 1-1.** Viewing the Google Chrome Extensions*


    > **Note** The item in Figure 1-1 (i.e. Google Docs) is not an extension. Instead,
    it is a Google Chrome App. Both—apps, and extensions—are listed on the same page
    in the Chrome browser (`chrome://extensions`), known as the Extensions Management
    page. Additionally, apps are also listed on the page located at the URL `chrome://apps`.


    Consider pinning this tab (right-click on the tab and then choose the Pin Tab
    option—see Figure 1-2), as it will be used quite often during the course of this
    book.


    ***Figure 1-2.** Pinning the `chrome://extensions` tab*


