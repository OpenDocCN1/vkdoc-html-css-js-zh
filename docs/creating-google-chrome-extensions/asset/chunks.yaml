    Content Scripts


    In the previous topic on the declarativeContent API, you understood how without
    reading the web page contents you can take certain actions simply by declaring
    some condition(s). This may not be always sufficient, as the declarativeContent
    API (via the PageStateMatcher object) only allows certain limited criteria for
    matching. Moreover, the actions are also very limited. This is where content scripts
    are useful.


    Content scripts are a type of scripting component that is injected into the visited
    web page(s). They have a very limited access to the Chrome Extensions API (as
    they do not represent the extension runtime). But, they can read and modify the
    contents (i.e., HTML


    elements) of visited web pages using the DOM API . Since they have access to the
    DOM


