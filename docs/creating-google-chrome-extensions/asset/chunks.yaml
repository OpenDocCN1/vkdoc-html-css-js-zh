    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    Summary


    The beginning of this chapter discussed the left-out input components from the
    previous chapter-omnibox input, context menu item, and Content-UI . After this,
    you learned the various ways in which scripting components can interact with each
    other using the messaging APIs provided by the Google Chrome Extensions framework.
    In addition to this, you also learned how ordinary web pages can interact with
    an extension.


    You then learned what permission strings are in a manifest file, before learning
    about how to use the many useful APIs provided by the Extensions framework. You
    also learned how using XHR in an extension is possible across different origins
    using *match pattern* permission strings in the manifest file.


    In the next chapter, you will read about a few remaining features provided by
    the Chrome Extensions framework, such as themes, override pages (to override a
    new tab, bookmarks page, etc.), and options pages, which enable you to enhance
    the niche of your extension on the Chrome browser.


