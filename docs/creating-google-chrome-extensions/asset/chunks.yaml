    \ 3-24 中，查询使用了字符串。如果使用对象，则需要定义以下属性：`query`、`url`和`title`。\n\n***图 3-35.** API\
    \ 演示：存储 API*\n\n## 使用书签层次结构\n\n书签 API 提供了`chrome.bookmarks.getTree`方法来检索整个书签层次结构。此方法接受一个函数作为其唯一参数。书签树作为数组传递给此方法。与该\
    \ API 对应的用法可以在以下代码片段中看到。\n\n请注意，树是此传递数组的第一个元素。由于此树使用节点表示，因此使用`children`属性来访问嵌套文件夹。\n\
    \n在这种情况下，文件夹是`Bookmarks Bar`和`Other Bookmarks`。通过遍历嵌套的`BookmarkTreeNode`项（例如，使用`folder.children.forEach`调用），您可以访问层次结构中的所有书签。\n\
    \n```\nchrome.bookmarks.getTree(function(bookmarkTreeAsArray) {\n    var bookmarkTree\
    \ = bookmarkTreeAsArray[0];\n    var folders = [];\n    if(bookmarkTree.children)\
    \ {\n        bookmarkTree.children.forEach(function(node) {\n            if(node.children.length\
    \ > 0) folders.push(node);\n        });\n    }\n    if(folders.length > 0) {\n\
    \        folders.forEach(function(folder) {\n            folder.children.forEach(function(bookmarkTreeNode)\
    \ {\n                if(bookmarkTreeNode.url) {\n                    /*use the\
    \ node*/\n                }\n            });\n        });\n    }\n});\n```\n\n\
    ## 相关事件\n\n书签 API 还提供了一些事件，这些事件在书签树发生特定变化时触发。以下列表包含这些事件及其描述。请注意，正如您在之前的示例中所看到的，要监听这些事件，您需要提供监听器函数。它们通过调用事件的`addListener`来添加。要了解更多关于这些事件的信息，请访问\
    \ https://developer.chrome.com/extensions/bookmarks。\n\n- `onCreated` — 在创建书签或文件夹时触发\n\
    - `onRemoved` — 在删除书签或文件夹时触发\n- `onChanged` — 在书签或文件夹发生变化时触发\n- `onMoved` — 在书签或文件夹移动到不同的父文件夹时触发\n\
    - `onChildrenReordered` — 在文件夹的子项因 UI 中排序而改变顺序时触发\n- `onImportBegan` — 在书签导入会话开始时触发\n\
    - `onImportEnded` — 在书签导入会话结束时触发\n\n## 下载 API\n\n下载 API（即`chrome.downloads`API）用于以编程方式启动、监控、操作和搜索下载。它使用`downloads`权限。\n\
    \n清单 3-25 包含来自 DownloadsAPI 扩展的代码，该扩展位于第 3 章的 Exercise Files 文件夹中。\n\n***清单 3-25.***\
    \ 第 3 章/DownloadsAPI/event_script.js\n\n```\n//region {variables and functions}\n\
    var greeting = \"Hello World!\";\nvar downloadOptions = {\n    \"url\" : \"http://www.apress.com/downloadable/download/sample/sample_id/1456/\"\
    ,\n    \"saveAs\" : true\n};\n//end-region\n\n//region {calls}\nconsole.log(greeting);\n\
    chrome.downloads.download(downloadOptions,function(downloadId) {\n    console.log(downloadId);\n\
    \    /*\n    chrome.downloads.pause(downloadId,function() {\n        if(!chrome.runtime.lastError)\
    \ console.log(\"pause\");\n    });\n    */\n});\nchrome.downloads.onCreated.addListener(function(downloadItem)\
    \ {\n    console.log(\"onCreated:\");\n    console.log(downloadItem);\n});\nchrome.downloads.onErased.addListener(function(downloadId)\
    \ {\n    console.log(\"onErased:\");\n    console.log(downloadId);\n});\nchrome.downloads.onChanged.addListener(function(downloadDelta)\
    \ {\n    console.log(\"onChanged:\");\n    console.log(downloadDelta);\n});\n\
    //end-region\n```\n\n## 下载文件\n"
- fmt: '要下载文件，请使用`chrome.downloads.download`方法。该方法接受两个参数——`options`（类型为`object`）和`callback`（类型为`function`）。对应于`DownloadItem`的`id`将被传递到回调函数中。`options`对象描述了下载内容及其方式。它支持以下属性。


    - `url`（`string`）

    - `filename`（`string`）

    - `saveAs`（`Boolean`）

    - `method`（`"GET"`或`"POST"`字符串）

    - `headers`（`array`）

    - `body`（`string`）


    > **注意**：`DownloadItem`是与下载API关联的一种类型。该类型包含一长串属性（详情请访问[https://developer.chrome.com/extensions/downloads#type-DownloadItem](https://developer.chrome.com/extensions/downloads#type-DownloadItem)）。一些重要的属性包括`id`、`filename`、`mime`、`startTime`、`endTime`、`bytesReceived`和`totalBytes`。


    ---


    ## 第3章 ■ API 可用性与消息传递


    请注意，如果要下载的URL使用HTTPS协议，则应使用`method`、`headers`和`body`属性。现在，让我们看一个使用`download`方法的示例。在此示例中，我们将下载位于
    [http://www.apress.com/9781430250531](http://www.apress.com/9781430250531) 的源代码文件。要下载的文件的确切URL显示在
    [清单3-25](#index_split_001.html#p144) 的`downloadOptions`对象中。


    * **图3-36.** Tabs API：使用`captureVisibleTab`方法


    如您所见，调用了`download`方法，并将`downloadOptions`对象作为第一个参数传递。`downloadOptions`对象使用`url`和`saveAs`属性定义。显而易见，`url`是要下载的URL。将`saveAs`属性设置为`true`是为了使用文件选择器，允许用户选择文件名。请注意[图3-29](#index_split_001.html#p132)中的“下载者”部分，它指向了发起下载的扩展。


    ---


    ## 第3章 ■ API 可用性与消息传递


    ### 取消或恢复下载


    一旦获得了`DownloadItem`对应的`id`（该`id`已传递给`download`方法的回调函数），您就可以轻松地取消、恢复甚至暂停下载。相应的调用非常简单：


    - `chrome.downloads.cancel(integer downloadId, function callback)`

    - `chrome.downloads.resume(integer downloadId, function callback)`

    - `chrome.downloads.pause(integer downloadId, function callback)`


    ### 打开下载


    如果`DownloadItem`已完成，请使用`open`方法打开下载的文件。如果未完成，`open`方法会通过`chrome.runtime.lastError`返回错误。


    此方法只需要一个参数，即`downloadId`。请注意，此方法需要额外的权限：`downloads.open`。


    若仅需在文件管理器中显示已下载文件所在的文件夹，需要调用以下方法：`chrome.downloads.show(integer downloadId)`。


    此外，如果唯一意图是在文件管理器中显示默认的“下载”文件夹，则需要调用`chrome.downloads.showDefaultFolder()`方法。


    ### 删除下载


    如果`DownloadItem`已完成，请使用`chrome.downloads.removeFile`方法删除已下载的文件。该方法接受两个参数——`downloadId`和`callback`。但是，如果只需要从历史记录中清除下载记录（而不删除已下载的文件），则应改用`chrome.downloads.erase`方法。


    此方法接受一个`query`对象和一个`callback`函数作为其参数。`query`对象可以接受一长串属性。一些重要的属性包括`id`、`startedBefore`、`startedAfter`、`endedBefore`、`endedAfter`、`filenameRegex`和`urlRegex`。要查看完整列表，请访问
    [https://developer.chrome.com/extensions/downloads#method-erase](https://developer.chrome.com/extensions/downloads#method-erase)
    。


    ### 相关事件'
  raw: 'To download a file, use the chrome.downloads.download method . This method
    takes two parameters— options (of type object ) and callback (of type function
    ). The id corresponding to the DownloadItem is passed to the callback function.
    The options object describes what to download and how. It supports the following
    properties.


    • url (string)


    • filename (string)


    • saveAs (Boolean)


    • method ( "GET" or "POST" string)


    • headers (array)


    • body (string)


    ■ **Note** DownloadItem is a type associated with the downloads API. This type
    contains a long list of properties (details are available a[t https://developer.chrome.com/](https://developer.chrome.com/extensions/downloads#type-DownloadItem)


    [extensions/downloads#type-DownloadItem ).](https://developer.chrome.com/extensions/downloads#type-DownloadItem)
    Some of the important properties include id , filename , mime , startTime , endTime
    , bytesReceived , and totalBytes .


    ![](index-146_1.jpg)


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    Note that the method , headers , and body properties are to be used if the URL
    to download uses the HTTPS protocol. Now, let’s look at an example to use the
    download method. For this example, we will download the source code file available
    a[t http://](http://www.apress.com/9781430250531)


    [www.apress.com/9781430250531 . The exact URL of the file to be do](http://www.apress.com/9781430250531)wnloaded
    is shown in


    [Listing 3-25 (in the](#index_split_001.html#p144) downloadOptions object).


    ***Figure 3-36.** Tabs API: Using the captureVisibleTab method* As you can see,
    the call to the download method is made and downloadOptions object is passed as
    the first argument. The downloadOptions object is defined using the url and saveAs
    properties. Quite obviously, url is the URL to download. Setting the saveAs property
    to true is done to use a file chooser to allow the users to select a filename.
    Note the “Downloaded by” section in Figur[e 3-29 , r](#index_split_001.html#p132)eferring
    the extension that has initiated the download.


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    Cancelling or Resuming a Download


    Once you have obtained the id corresponding to the DownloadItem (passed to the
    callback function of the download method), you can easily cancel, resume, or even
    pause a download. The corresponding calls are very straightforward:


    •


    chrome.downloads.cancel(integer downloadId, function callback)


    •


    chrome.downloads.resume(integer downloadId, function callback)


    • chrome.downloads.pause(integer downloadId, function callback)


    Opening a Download


    Use the open method to open the downloaded file if the DownloadItem is complete.
    If it is not complete, the open method returns an error through chrome.runtime.lastError
    .


    This method only requires a single parameter, which is the downloadId . Note that
    this method requires an additional permission: downloads.open .


    To simply show the downloaded file in its folder in a file manager, a call to
    the following method needs to be made: chrome.downloads.show(integer downloadId)
    .


    Moreover, if the only intent is to show the default Downloads folder in a file
    manager, you need to call the chrome.downloads.showDefaultFolder() method.


    Deleting a Download


    To remove the downloaded file if the DownloadItem is complete, use the chrome.


    downloads.removeFile method . This method takes two parameters— downloadId and
    callback . However, if all that is required is clearing off the download from
    the history (without deleting the downloaded file), use the chrome.downloads.erase
    method instead.


    This method takes a query object and a callback function as its parameters. The
    query object can take a long list of properties. Some important ones include id
    , startedBefore , startedAfter , endedBefore , endedAfter , filenameRegex , and
    urlRegex . To view the complete list, [visit https://developer.chrome.com/extensions/downloads#method-erase](https://developer.chrome.com/extensions/downloads#method-erase)
    .


    Associated Events'
