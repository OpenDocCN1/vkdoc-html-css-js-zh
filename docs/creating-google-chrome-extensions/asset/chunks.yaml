- fmt: 'The downloads API provides some useful events such as `onCreated`, `onChanged`,
    etc., that can be used to provide callbacks when download begins, or when the
    corresponding `DownloadItem`''s properties change. The following is a list of
    such events with their descriptions. Note that you can also refer [Listing 3-25](#index_split_001.html#p144)
    to see the exact uses of these events with their listener functions.


    * `onCreated`—Fired with the `DownloadItem` object when a download begins

    * `onErased`—Fired with the `downloadId` when a download is erased from history

    * `onChanged`—Fired when any of a `DownloadItem`''s properties change (except
    `bytesReceived` and `estimatedEndTime`)


    ## History API


    The history API (i.e., the `chrome.history` API) is used to interact with the
    browser''s record of visited pages. Using this API, you can add, remove, and query
    for URLs in the browser''s history. It uses the history permission. [Listing 3-26](#index_split_001.html#p148)
    contains the code from the HistoryAPI extension, provided in Chapter 3''s Exercise
    Files folder.


    ***Listing 3-26.*** Chapter 3/HistoryAPI/ event_script.js


    ```

    //region {variables and functions}


    var greeting = "Hello World!";


    var tenMinutesAsMilliseconds = 10 * 60 * 1000;


    //getTime returns the number of milliseconds since the epoch


    var currentTimeAsMilliseconds = new Date().getTime();


    //query to filter history using "text", in the past hour


    var query = {


    "text" : "apress",


    "startTime" : currentTimeAsMilliseconds - 6 * tenMinutesAsMilliseconds,


    "endTime" : currentTimeAsMilliseconds,


    "maxResults" : 10


    };


    //end-region


    //region {calls}


    console.log(greeting);


    chrome.history.search(query,function(results) {


    results.forEach(function(result) {


    //result is of type HistoryItem


    console.log(result);


    });


    });


    chrome.history.getVisits({"url" : "http://www.example.


    org"},function(results) {


    results.forEach(function(result) {


    //result is of type VisitItem


    console.log(result);


    });


    });


    chrome.history.addUrl({"url" : "http://www.example.org"},function() {


    console.log("addUrl");


    });


    chrome.history.deleteUrl({"url" : "http://www.example.org"},function() {


    console.log("deleteUrl");


    });


    /*


    chrome.history.deleteAll(function() {


    console.log("deleteAll");


    });


    */


    //end-region

    ```


    To search the history using a query, use the `chrome.history.search` method. This
    method takes two parameters—`query` (of type `object`) and `callback` (of type
    `function`).


    The `query` object supports the following properties:


    * `text`—A free-text query to the history service. Leave it empty to retrieve
    all pages.

    * `startTime`—Limit results to those visited after this date, represented in milliseconds
    since the epoch.

    * `endTime`—Limit results to those visited before this date. Represented in milliseconds
    since the epoch.

    * `maxResults`—The maximum number of results to retrieve. Defaults to 100.


    Note that the `callback` function receives an array of `HistoryItem` results.
    Here, a `HistoryItem` is an object encapsulating one result of a history query.
    It supports the following useful properties—`id`, `url`, `title`, `lastVisitTime`,
    `visitCount`, etc.


    To retrieve information about visits to a URL, use the `chrome.history.getVisits`
    method. As shown in [Listing 3-26](#index_split_001.html#p148), this method takes
    an object (with `url` property) as its first parameter. The second parameter is
    a `callback` function that receives an array of `VisitItem` results.


    **Note:** A `VisitItem` is an object encapsulating one visit to a URL. It is composed
    of the following properties: `id`, `visitId`, `visitTime`, `referringVisitId`,
    and `transition` (of `TransitionType`, which describes how the browser navigated
    to a particular URL). You can read more about the `TransitionType` by visiting
    <https://developer.chrome.com/extensions/history#transition_types>.'
