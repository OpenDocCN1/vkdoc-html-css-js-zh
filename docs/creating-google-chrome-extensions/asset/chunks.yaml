    ```\n\n如图 3-13 所示，内容脚本组件（`content_script.js`）用于在其注入的网页中创建一个按钮元素（“发送消息”）。\n"
- fmt: '# The `addEventListener` Method


    The `addEventListener` method (see [Listing 3-7](#index_split_000.html#p108))
    is used to provide a callback to handle the `click` event on this button (recall
    from [Chapter 2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2) that a content
    script component has access to all the standard JavaScript APIs). The `Page-Action`
    will get displayed upon clicking this button. You might wonder how this works.
    Well, this is where the messaging APIs become useful.


    As described, the messaging APIs, provided in the Extensions framework, allow
    different scripting components to interact with each other. This is displayed
    in [Listings 3-7](#index_split_000.html#p108) and [3-8](#index_split_000.html#p109).


    The content script component in this extension uses the `runtime.sendMessage`
    method of the messaging API to send a message to the extension runtime. Recall
    that an event script is used to represent the extension runtime (refer back to
    the topic "Scripts Representing Runtime" to remind yourself of the extension runtime).


    ## Listing 3-8


    **Chapter 3 / HelloContentUI / `event_script.js`**


    ```javascript

    //region {variables and functions}


    var consoleGreeting = "Hello World! - from event_script.js";


    var responseMessage = {"data":"Test message Y"};


    //end-region


    //region {calls}


    console.log(consoleGreeting);


    //Show Page-Action using the onMessage event


    chrome.runtime.onMessage.addListener(


    function(requestMessage,sender,sendResponse) {


    chrome.pageAction.show(sender.tab.id);


    console.log("requestMessage: " + requestMessage.data);


    sendResponse(responseMessage);


    }


    );


    //end-region

    ```


    ![Image](index-110_1.jpg)


    ## API Availability and Messaging


    As displayed in [Listing 3-8](#index_split_000.html#p109), the event script component
    (`event_script.js`) can listen for the messages using the listener function for
    the `runtime.onMessage` event. In this case, the listener function contains code
    to display the `Page-Action` (see [Figure 3-14](#index_split_000.html#p110)) for
    the corresponding tab, which is obtained from the `sender` object''s tab ID. Don''t
    get overwhelmed with this example, as you will read more about the messaging APIs
    in the following topics in this chapter.


    **Figure 3-14.** *HelloContentUI: Page-Action component*


    # Messaging for Communication


    By now you have tried different scripting components to accomplish different purposes.
    But there are scenarios where a single type of scripting component is not sufficient
    to get the job done—for example, consider the `HelloContentUI` extension discussed
    previously. In that extension, you needed the content script and the event script
    (i.e., the extension runtime) to communicate with each other in order to show
    the `Page-Action` component.


    ![Image](index-111_1.jpg)


    In addition to this, apart from the scripting components belonging to an extension,
    normal (external) web pages may also want to interact with an extension. So, in
    all, there are four types of scripts that can communicate with each other—content
    scripts, popup scripts, event scripts (or background scripts), and web page scripts
    (belonging to external web pages that need to interact with an extension).


    **Figure 3-15.** *Inspecting the web page: Console panel*


    ## APIs and Events


    Now we can talk about the actual messaging APIs that are used for communication
    between different scripting components. These APIs are from the standard JavaScript
    APIs and the Extensions framework. The messaging API provided by the standard
    JavaScript APIs includes the `window.postMessage` method. Similarly, the messaging
    APIs provided by the Extensions framework includes the following methods:


    - `chrome.runtime.sendMessage`

    - `chrome.runtime.connect` (and the corresponding `port.postMessage` method)

    - `chrome.tabs.sendMessage`

    - `chrome.tabs.connect` (and the corresponding `port.postMessage` method)


    ![Image](index-112_1.jpg)


    **Figure 3-16.** *Console panel for background page*'
