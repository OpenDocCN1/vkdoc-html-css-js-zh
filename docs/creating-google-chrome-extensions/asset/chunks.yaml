- fmt: "# Figure 1-34. Distributing an extension: Saving the draft\n\n![](index-51_1.jpg)\n\
    \n## Chapter 1: Introduction to Google Chrome Extensions\n\nWhen you return to\
    \ the dashboard, you will find the draft of your extension listed under the Your\
    \ Listings section, as displayed in Figure 1-35. As you learn more about the development\
    \ of extensions, you can improve and update this draft. And finally, when you\
    \ are ready with this extension, you can update the fields discussed in Step 16\
    \ and publish the extension.\n\n**Figure 1-35. Distributing an extension: Item\
    \ listings**\n\n### Summary\n\nThis chapter began with a basic definition of browser\
    \ extensions, including what they are and what they are not. Then you learned\
    \ to list the extensions installed in your Chrome browser via the Extensions Management\
    \ page.\n\nNext, some notable extensions were discussed, after which you also\
    \ learned to install extensions on the Chrome browser. The technologies to create\
    \ Chrome Extensions were also described, while comparing them with the technologies\
    \ used on other browsers.\n\nFinally you created your first extension—called `ShowTime`—and\
    \ you learned to load it in the Chrome browser. Not only this, you also learned\
    \ to debug your extension and upload it on the Chrome Web Store. In Chapter 2,\
    \ you will read more about the development of Chrome Extensions, as well as their\
    \ architecture. But before moving ahead, make sure to fiddle and experiment with\
    \ things in the `ShowTime` extension you created to get a better feel of the development\
    \ process. This will make you more comfortable with the sample extensions that\
    \ are used in the next chapter, where you learn about the architecture of extensions.\n\
    \n## Chapter 2: Architecture Overview\n\nThis chapter describes the architecture\
    \ of Chrome Extensions from the user’s and developer’s points of view. Doing so\
    \ will help you quickly wrap your head around various components that are used\
    \ to create Chrome Extensions. After reading this chapter, you will understand\
    \ the building blocks of Chrome Extensions like a user—in terms of the interactive\
    \ functionalities involved—and also like a developer—in terms of the inner techniques\
    \ available to provide various functionalities.\n\nLike the previous chapter,\
    \ this chapter assumes you have some experience writing simple web pages using\
    \ technologies such as HTML, CSS, and JavaScript. You should know the event-driven\
    \ nature of web pages, for example—showing some UI after clicking a button (using\
    \ event listeners), etc. That said, let’s begin!\n\n### What Is User Perspective?\n\
    \nAn API (in our case, the Google Chrome Extensions API) can be understood in\
    \ terms of the inner techniques involved in providing various functionalities\
    \ (such as UI, storage, etc.) or in terms of the interactive functionalities—down\
    \ to the techniques that need to be used to access these functionalities. The\
    \ latter—i.e., understanding the Extension’s API in terms of the *interactive\
    \ functionalities* it provides—is described as the user perspective (or the user’s\
    \ point of view). The contents of this chapter switch perspective from time to\
    \ time, to aid your learning of the Google Chrome Extensions API.\n\n### Components\
    \ Involved in Creating Chrome Extensions\n\nGoogle Chrome Extensions are no different\
    \ from any other software application. You interact with it via inputs such as\
    \ buttons (or shortcut keys, etc.), and it processes some data and displays the\
    \ result. Abstract, isn’t it? Well, not so much. You will find out soon.\n\nSimilar\
    \ to other application development frameworks, the Google Chrome Extensions framework\
    \ provides its developers with techniques to provide UI, and functionalities such\
    \ as storage, messaging, web requests, etc. The following are the components that\
    \ are used to create Chrome Extensions.\n\n© Prateek Mehta 2016\nP. Mehta, *Creating\
    \ Google Chrome Extensions*, DOI 10.1007/978-1-4842-1775-7_2\n\n![](index-53_1.jpg)\n\
    \n#### Input Components\n\nOffer interactive functionalities, comprised of UI/non-UI\
    \ input elements, such as toolbar buttons, shortcut keys, context menu items,\
    \ etc. Chrome Extensions provide the following input components (see Figure 2-1):\n\
    \n- `Browser-Action`\n- `Page-Action`\n- `Shortcut-Key`\n- `Context-Menu-Item`\n\
    - `Omnibox-Input`\n- `Content-UI`\n\n**Figure 2-1. Input components for creating\
    \ Chrome Extensions**\n\n#### Scripting Components\n\nAs the name suggests, these\
    \ components are scripts that contain the application logic which may be required\
    \ at different times when users interact with the extension. There are three types\
    \ of scripting components:\n\n- *Event scripts (Background scripts)*\n- *Popup\
    \ scripts*\n- *Content scripts*\n\n> **Note:** Each *type* of scripting component\
    \ has its own separate *scope*. So, for example, a popup script cannot use variables\
    \ and functions defined in an event script, and vice versa. The same holds true\
    \ for other pairs of scripts—content scripts and popup scripts, and content scripts\
    \ and event script. The only way scripts can access each other’s data (variables,\
    \ functions, etc.) is by *messaging*, which you will learn about in the next chapter.\n\
    \n![](index-54_1.jpg)\n\n#### Popup Component\n\nPopup is a special (optional)\
    \ view available only to the `Browser-Action` and `Page-Action` input components.\
    \ A popup is made entirely of an HTML page (see Figures 2-2 and 2-3). Note that\
    \ a popup *only* appears when the user clicks on the toolbar button corresponding\
    \ to a `Browser-Action` or a `Page-Action` (whichever one the extension is using).\
    \ And yes, you guessed it right—popup scripts are used along with the popup component.\n\
    \n**Figure 2-2. A Browser-Action popup**\n\n![](index-55_1.jpg)\n\n**Figure 2-3.\
    \ A Page-Action popup**\n\nPopup scripts are plain JavaScript files. Because they\
    \ are used in a popup, they are known as popup scripts. Note that a popup script’s\
    \ code *cannot* be inlined into the HTML page for popup. Inlining of scripts means\
    \ placing JavaScript code directly inside `<script>` tags, as in `<script>alert('Hello\
    \ World');</script>`.\n\nSo, popup scripts can only be referred to, where the\
    \ `src` needs to point a path, relative to the extension folder, such as `<script\
    \ src=\"popup_script.js\"></script>`. And yes, multiple popup scripts can be referred\
    \ to (see Listing 2-1) to modularize the code. These scripts do not get merged\
    \ when the extension loads (in the browser), and they can be separately identified\
    \ in the Sources and Resources panels (see Figures 1-16 and 1-17 in Chapter 1)\
    \ in the DevTools window, discussed in Chapter 1. Additionally, the Console panel\
    \ will also help categorize the logs from different (referred) popup scripts,\
    \ as displayed in Figure 2-4.\n\n![](index-56_1.jpg)\n\n**Figure 2-4. Inspecting\
    \ the popup: Console panel**\n\nA very important feature of popup scripts is that\
    \ they can access the Chrome Extensions API. Moreover, being JavaScript files,\
    \ popup scripts have access to all the Standard JavaScript APIs, including the\
    \ event APIs to listen for and respond to DOM events fired from the nodes within\
    \ a popup.\n\n**Listing 2-1.** Chapter 2/HelloBrowserAction/popup.html\n\n```html\n\
    <head>\n    <!-- The following tag is not obeyed -->\n    <title>HelloBrowserAction\
    \ (Custom)</title>\n    <!--\n    <script>\n        // Inline scripts are not\
    \ allowed\n        alert('Hello World');\n    </script>\n    -->\n    <!-- Referring\
    \ scripts is allowed -->\n    <script src=\"popup_script.js\"></script>\n    <script\
    \ src=\"another_popup_script.js\"></script>\n    <style>\n        ...\n    </style>\n\
    </head>\n```"
