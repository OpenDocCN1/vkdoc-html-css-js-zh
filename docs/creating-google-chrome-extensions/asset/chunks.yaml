- fmt: "# API Availability and Messaging\n\n## APIs Requiring Permissions\n\nTo use\
    \ most `chrome.*` APIs, your extension (or app) must declare its intent in the\
    \ `permissions` field of the manifest. Every such permission in the `permissions`\
    \ field can be one of a list of known strings (such as `\"alarms\"`, `\"storage\"\
    `, `\"tabs\"`, etc.—see the following list containing all permission strings)\
    \ or a *match pattern* that gives access to one or more hosts. In all the examples\
    \ discussed until this point, you haven’t seen a *match pattern* in the `permissions`\
    \ field of the manifest. This is because such use is only required alongside the\
    \ XHR API (more about it later in this section).\n\n### An Example of Permissions\n\
    \nThe following code snippet is an example of the `permissions` part of a manifest\
    \ file.\n\n```json\n\"permissions\" : [\n  \"alarms\",        // Extensions-API\
    \ permission\n  \"tabs\",          // Extensions-API permission\n  \"bookmarks\"\
    ,     // Extensions-API permission\n  \"http://www.blogger.com/\",   // XHR permission\n\
    \  \"http://*.google.com/\"       // XHR permission\n],\n```\n\nAs you might have\
    \ guessed by looking at this code, the `\"alarms\"`, `\"tabs\"`, and `\"bookmarks\"\
    ` permission strings are required to access the alarms, tabs, and bookmarks APIs\
    \ (respectively). And unlike these permission strings, the remaining two permission\
    \ strings (i.e., the URLs) are required to talk to remote hosts outside of the\
    \ extension’s origin (via XHR).\n\nThe documentation corresponding to an API in\
    \ the Google Chrome Extensions framework specifies the need for a permission string\
    \ (if any). In addition to this, if an API requires you to declare a permission\
    \ string in the manifest, then its documentation tells you how to do so. For example,\
    \ the Alarms API documentation—found at [https://developer.chrome.com/extensions/alarms](https://developer.chrome.com/extensions/alarms)\
    \ —shows you how to declare the `alarms` permission.\n\n### List of Permission\
    \ Strings\n\n- `activeTab`\n- `alarms`\n- `audioModem`\n- `background`\n- `bookmarks`\n\
    - `browsingData`\n- `clipboardRead`\n- `clipboardWrite`\n- `contentSettings`\n\
    - `contextMenus`\n- `cookies`\n- `copresence`\n- `debugger`\n- `declarativeContent`\n\
    - `declarativeWebRequest`\n- `desktopCapture`\n- `dns`\n- `documentScan`\n- `downloads`\n\
    - `enterprise.platformKeys`\n- `experimental`\n- `fileBrowserHandler`\n- `fileSystemProvider`\n\
    - `fontSettings`\n- `gcm`\n- `geolocation`\n- `history`\n- `identity`\n- `idle`\n\
    - `idltest`\n- `location`\n- `management`\n- `nativeMessaging`\n- `networking.config`\n\
    - `notificationProvider`\n- `notifications`\n- `pageCapture`\n- `platformKeys`\n\
    - `power`\n- `printerProvider`\n- `privacy`\n- `processes`\n- `proxy`\n- `sessions`\n\
    - `signedInDevices`\n- `storage`\n- `system.cpu`\n- `system.display`\n- `system.memory`\n\
    - `system.storage`\n- `tabCapture`\n- `tabs`\n- `topSites`\n- `tts`\n- `ttsEngine`\n\
    - `unlimitedStorage`\n- `vpnProvider`\n- `wallpaper`\n- `webNavigation`\n- `webRequest`\n\
    - `webRequestBlocking`\n\n> **Note:** Permissions help to limit damage if your\
    \ extension or app is compromised by malware. Some of the permissions are also\
    \ displayed to users, before installation of the extension (or app), as a warning.\
    \ You can read more about these warnings at [https://developer.chrome.com/extensions/permission_warnings](https://developer.chrome.com/extensions/permission_warnings).\n\
    \n## Optional Permissions\n\nThere are two types of permissions—*required permissions*\
    \ and *optional permissions*. The permissions you’ve dealt with so far are required\
    \ permissions. Optional permissions are permissions that can be requested at runtime,\
    \ rather than install time. Users understand why the permissions are needed and\
    \ grant only those that are necessary. Though optional permissions are more informative\
    \ for users, they are not described here due to their complexity. You can read\
    \ more about them at [https://developer.chrome.com/extensions/permissions](https://developer.chrome.com/extensions/permissions).\n\
    \n---\n\n# Alarms API\n\nThe alarms API (i.e., the `chrome.alarms` API) is used\
    \ to schedule code to run periodically or at a specified time in the future. It\
    \ uses the `alarms` permission. Listing 3-23 contains the code from the AlarmsAPI\
    \ extension, provided in Chapter 3’s Exercise Files folder.\n\n![API demos: Notifications\
    \ API](index-138_1.jpg)\n\n### Creating an Alarm\n\nTo create an alarm, use the\
    \ `chrome.alarms.create` method. This method takes two parameters—`alarmName`\
    \ (of type `string`) and `alarmInfo` (of type `object`). The `alarmInfo` object\
    \ describes when the alarm should fire. The initial time must be specified by\
    \ either `when` or `delayInMinutes` (but not both).\n\n![API demos: Notifications\
    \ API](index-139_1.jpg)\n\nIf `periodInMinutes` is set, the alarm will repeat\
    \ every `periodInMinutes` minutes after the initial event. The listener function\
    \ for the corresponding `chrome.alarms.onAlarm` event is fired when an alarm has\
    \ elapsed. Figure 3-26 displays the log from this listener function. Note the\
    \ argument received by this callback. This argument is of type `Alarm`, which\
    \ contains properties such as `name`, `scheduledTime`, and `periodInMinutes`.\n\
    \n![API demos: Notifications API](index-140_1.jpg)\n\n> **Note:** While debugging\
    \ an extension, which is loaded unpacked, there’s no limit to how often the alarm\
    \ can fire. For all other cases, alarms with intervals of less than one minute\
    \ will not be honored and will cause a warning. Refer back to the topic “Loading\
    \ the Extension Folder” (from Chapter 1) to remind yourself of the basics of extension\
    \ loading.\n\n**Listing 3-23.** Chapter 3/AlarmsAPI/event_script.js\n\n```javascript\n\
    //region {variables and functions}\n\nvar greeting = \"Hello World!\";\nvar count\
    \ = 0;\nvar alarmName = \"testAlarm\";\nvar alarmInfo = {\n  when : Date.now()\
    \ + 6000,\n  periodInMinutes : 1  //Repeatedly fire after every 1 minute\n};\n\
    \n//end-region\n\n//region {calls}\n\nconsole.log(greeting);\nchrome.alarms.clearAll();\n\
    chrome.alarms.onAlarm.addListener(function(alarm) {\n  console.log(\"onAlarm-\"\
    \ + ++count);\n});\nchrome.alarms.create(alarmName,alarmInfo);\n\n//end-region\n\
    ```\n\n### Other Important Methods\n\nIn Listing 3-23, the `chrome.alarms.clearAll`\
    \ method is used to clear all alarms. To clear a specific alarm, use the `chrome.alarms.clear(string\
    \ name, function callback)` method. Other important methods in the alarms API\
    \ include the following. Here, note that the callback function for the `get` method\
    \ receives an argument of type `Alarm`, whereas the callback function for the\
    \ `getAll` method receives an argument of type `array`.\n\n- `chrome.alarms.get(string\
    \ name, function callback)`\n- `chrome.alarms.getAll(function callback)`\n\n---\n\
    \n# Bookmarks API\n\nThe bookmarks API (i.e., the `chrome.bookmarks` API) is used\
    \ to create, organize, and otherwise manipulate bookmarks. It uses the `bookmarks`\
    \ permission. Bookmarks are organized in a tree, where each node in the tree is\
    \ either a bookmark or a folder.\n\nEach node in the tree is represented by a\
    \ `bookmarks.BookmarkTreeNode` object. `BookmarkTreeNode` properties are used\
    \ throughout the `chrome.bookmarks` API. For example, when you call `chrome.bookmarks.create`,\
    \ you pass in the new node’s parent (`parentId`), and optionally, the node’s `title`\
    \ and `url` properties. To read about the complete list of properties a node can\
    \ have, refer to [https://developer.chrome.com/extensions/bookmarks#type-BookmarkTreeNode](https://developer.chrome.com/extensions/bookmarks#type-BookmarkTreeNode).\n\
    \n![API demos: Notifications API](index-137_1.jpg)"
