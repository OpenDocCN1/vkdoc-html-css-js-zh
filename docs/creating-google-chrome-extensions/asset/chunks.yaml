- fmt: "# API Availability and Messaging\n\nThe corresponding event for the messaging\
    \ API in the standard JavaScript APIs includes the `message` event. And similarly,\
    \ the corresponding events for the messaging APIs in the Extensions framework\
    \ include the following events. Now that you have an overview of messaging, let's\
    \ try different examples to understand these concepts more clearly.\n\n- `chrome.runtime.onMessage`\n\
    - `chrome.runtime.onMessageExternal`\n- `chrome.runtime.onConnect` (and the corresponding\
    \ `port.onMessage` event)\n- `chrome.runtime.onConnectExternal` (and the corresponding\
    \ `port.onMessage` event)\n\n## Web Page Scripts and Event Scripts\n\nThe basic\
    \ idea here is to allow an external web page to communicate with the extension\
    \ runtime. In the Chrome browser, all web pages (except the Extensions Management\
    \ page) have access to the `chrome.runtime.sendMessage` method, which is used\
    \ to send messages to the extension runtime. This method takes the following parameters:\n\
    \n- `extensionID`\n- `message`\n- `responseCallback`\n\n[As seen in Listing 3-9](#index_split_000.html#p113),\
    \ clicking the button `send_message` leads to the `chrome.runtime.sendMessage(extensionID,\
    \ message, responseCallback)` call. Note that `extensionID` is the ID of the extension\
    \ to send the message to. This ID can be viewed from the Extensions Management\
    \ page (see Figure 3-16). Also note that this ID will change upon loading the\
    \ extension every time a change is made in the extension contents or in the extension\
    \ folder's location. Moreover, the modifications to `manifest.json` (or any other\
    \ file in the extension's folder) will only take effect upon reinstalling or reloading\
    \ the extension!\n\n![](index-113_1.jpg)\n\n> **Note:** For the WSandES extension,\
    \ the contents of the folder `WebServer` have been served from my local HTTP server\
    \ to give a demonstration that is close to the real-world scenario, where your\
    \ extension might be attempting to listen for messages from external web pages\
    \ (visited on the Chrome browser). Also note that the served web page has a `.php`\
    \ suffix but contains plain HTML code. For this reason, it can be opened directly\
    \ in the Chrome browser as a local file web page (i.e., using the `file://` scheme).\n\
    \n***Figure 3-17.** Inspecting the web page: Console panel*\n\n***Listing 3-9.***\
    \ [Chapter 3 / WSandES / WebServer / webpage_script.js](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)\n\
    \n```\n//region {variables and functions}\n//Note this from the extensions page\n\
    var extensionID = \"lconbphjmfkpdopdnadkdfiiflajajgg\";\nvar sendMessageButtonID\
    \ = \"send_message\";\nvar greeting = \"Hello World!\";\nvar message = \"Test\
    \ message X\";\n\nfunction responseCallback(responseObject) {\n    console.log(\"\
    Message '\" +\n        responseObject.message + \"' from Sender '\" +\n      \
    \  responseObject.sender + \"'\"\n    );\n}\n//end-region\n\n//region {calls}\n\
    console.log(greeting);\ndocument.addEventListener(\"DOMContentLoaded\", function(dcle)\
    \ {\n    var buttonID = document.getElementById(sendMessageButtonID);\n    buttonID.addEventListener(\"\
    click\", function(ce) {\n        //This message will be intercepted by event_script.js\n\
    \        chrome.runtime.sendMessage(extensionID, message, responseCallback);\n\
    \    });\n});\n//end-region\n```\n\nThe `message` parameter in `sendMessage` is\
    \ the message to send. In this case, the message is a string `\"Test message X\"\
    `. You might be wondering about the use of the `responseCallback` parameter. Well,\
    \ this parameter is a callback function that is used by the receiver of the sent\
    \ message, i.e., the extension runtime. For the examples in [Listings 3-9](#index_split_000.html#p113)\
    \ and [3-10](#index_split_000.html#p115) (from the WSandES extension), the event\
    \ script component is used to represent the extension runtime. An important point\
    \ to note is that the callback (although called by the event script) gets executed\
    \ in the context of the web page script. Figure 3-15 displays the log corresponding\
    \ to the `sendResponse(responseObject)` call in the event script.\n\n***Figure\
    \ 3-18.** Console panel for background page*\n\n## Listening to the Event\n\n\
    As shown in Listing 3-10, the listener function for the `chrome.runtime.onMessageExternal`\
    \ event is used to handle the incoming message from the external web page. The\
    \ listener function for the `onMessageExternal` event takes three parameters —\
    \ `message`, `sender`, and `sendResponse`. As discussed, `sendResponse` is the\
    \ callback that gets executed in the context of the web page script. Note the\
    \ passed argument called `responseObject`.\n\n![](index-115_1.jpg)\n\n***Figure\
    \ 3-19.** Inspecting the web page: Console panel*\n\n***Listing 3-10.*** [Chapter\
    \ 3 / WSandES / event_script.js](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)\n\
    \n```\n//region {variables and functions}\nvar greeting = \"Hello World!\";\n\
    var responseObject = {\n    message : \"Test message Y\",\n    sender : \"event_script.js\"\
    \n};\n\nfunction GetFormattedMessageString(message, sender) {\n    return \"Message\
    \ '\" + message + \"' from Sender '\" + sender.url + \"'\";\n}\n//end-region\n\
    \n//region {calls}\nconsole.log(greeting);\nchrome.runtime.onMessageExternal.addListener(\n\
    \    function(message, sender, sendResponse) {\n        //Will get called from\
    \ the script where sendResponse is defined\n        sendResponse(responseObject);\n\
    \        console.log(GetFormattedMessageString(message, sender));\n    }\n);\n\
    //end-region\n```\n\nThe `message` parameter contains the passed message. And\
    \ similarly, the `sender` parameter contains the URL of the external web page\
    \ that sent the message. In this case, the external web page is `webpage.php`,\
    \ served from my local HTTP server. The log corresponding to these values is shown\
    \ in Figure 3-16.\n\n## Role of the Manifest for This API\n\nFor an extension\
    \ to be able to receive messages from external web pages (or other extensions),\
    \ an important addition is required in the manifest. This addition is the `externally_connectable`\
    \ manifest attribute. This attribute contains two keys — `ids` and `matches`.\
    \ Both of these keys take array values. While the `ids` key represents the IDs\
    \ of the (external) extensions that can send messages, the `matches` key represents\
    \ the URL patterns of the external web pages that can send messages. An important\
    \ point to note is that this attribute is a *must-have* for any extension that\
    \ needs to be communicated with from external web pages or extensions, irrespective\
    \ of the messaging API that's used (`chrome.runtime.sendMessage` or `chrome.runtime.connect`).\n\
    \n***Figure 3-20.** Inspecting the web page: Console panel*\n\nFor the WSandES\
    \ extension (provided in [Chapter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)'s\
    \ Exercise Files folder), the `externally_connectable` attribute is defined the\
    \ following way. This is done so as to only allow web pages served from the localhost\
    \ to send messages to the extension runtime.\n\n```\n\"externally_connectable\"\
    \ : {\n    //Extension and app IDs. If this field is not specified, no\n    //extensions\
    \ or apps can communicate.\n    //\"ids\" : [], //To match all extensions and\
    \ apps, specify only \"*\"\n    //Allowed webpages\n    \"matches\" : [\"*://localhost/*\"\
    ]\n}\n```\n\n## Using Long-Lived Connections\n\nThe messaging example that was\
    \ demonstrated in this topic involved a single message and response. Sometimes\
    \ it is useful to have a conversation that lasts longer than that. To facilitate\
    \ this purpose, the Extensions framework provides the `chrome.runtime.connect`\
    \ method. Note that apart from the web page script, this method is also available\
    \ to other scripts, including to content script and popup script.\n\n> **Note:**\
    \ Obviously, the event script can also use the `chrome.runtime.connect` method."
