    the fields discussed in Step 16 and publish the extension.


    ***Figure 1-35.** Distributing an extension: Item listings* Summary


    This chapter began with a basic definition of browser extensions, including what
    they are and what they are not. Then you learned to list the extensions installed
    in your Chrome browser via the Extensions Management page.


    Next, some notable extensions were discussed, after which you also learned to
    install extensions on the Chrome browser. The technologies to create Chrome Extensions
    were also described, while comparing them with the technologies used on other
    browsers.


    Finally you created your first extension—called ShowTime —and you learned to load
    it in the Chrome browser. Not only this, you also learned to debug your extension
    and upload it on the Chrome Web Store. In Ch[apter 2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)
    , you will read more about the development of Chrome Extensions, as well as their
    architecture. But before moving ahead, make sure to fiddle and experiment with
    things in the ShowTime extension you created to get a better feel of the development
    process. This will make you more comfortable with the sample extensions that are
    used in the next chapter, where you learn about the architecture of extensions.


    **CHAPTER 2**


    **Architecture Overview**


    This chapter describes the architecture of Chrome Extensions from the user’s and
    developer’s points of view. Doing so will help you quickly wrap your head around
    various components that are used to create Chrome Extensions. After reading this
    chapter, you will understand the building blocks of Chrome Extensions like a user—in
    terms of the interactive functionalities involved—and also like a developer—in
    terms of the inner techniques available to provide various functionalities.


    Like the previous chapter, this chapter assumes you have some experience writing
    simple web pages using technologies such as HTML, CSS, and JavaScript. You should
    know the event-driven nature of web pages, for example—showing some UI after clicking
    a button (using event listeners), etc. That said, let’s begin!


    What Is User Perspective ?


    An API (in our case, the Google Chrome Extensions API) can be understood in terms
    of the inner techniques involved in providing various functionalities (such as
    UI, storage, etc.) or in terms of the interactive functionalities—down to the
    techniques that need to be used to access these functionalities. The latter—i.e.,
    understanding the Extension’s API in terms of the *interactive functionalities*
    it provides—is described as the user perspective (or the user’s point of view).
    The contents of this chapter switch perspective from time to time, to aid your
    learning of the Google Chrome Extensions API.


    Components Involved in Creating Chrome


    Extensions


    Google Chrome Extensions are no different from any other software application.
    You interact with it via inputs such as buttons (or shortcut keys, etc.), and
    it processes some data and displays the result. Abstract, isn’t it? Well, not
    so much. You will find out soon.


    Similar to other application development frameworks, the Google Chrome


    Extensions framework provides its developers with techniques to provide UI, and
    functionalities such as storage, messaging, web requests, etc. The following are
    the components that are used to create Chrome Extensions.


    © Prateek Mehta 2016


    P. Mehta, *Creating Google Chrome Extensions*, DOI 10.1007/978-1-4842-1775-7_2


    ![](index-53_1.jpg)


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    • **Input components** —Offer interactive functionalities, comprised


    of UI/non-UI input elements, such as toolbar buttons, shortcut


    keys, context menu items, etc. Chrome Extensions provide the


    following input components (see Figur[e 2-1 ):](#index_split_000.html#p53)


    •


    Browser-Action


    •


    Page-Action


    •


    Shortcut-Key


    •


    Context-Menu-Item


    •


    Omnibox-Input


    •


    Content-UI


    ***Figure 2-1.** Input components for creating Chrome Extensions*


    • **Scripting** **components** —As the name suggests, these


    components are scripts that contain the application logic which


    may be required at different times when users interact with the


    extension. There are three types of scripting components:


    •


    *Event scripts (Background scripts)*


    •


    *Popup scripts*


    •


    *Content scripts*


    ■ **Note**


    Each


    *type* of scripting component has its own separate *scope* . So, for example,
    a popup script cannot use variables and functions defined in an event script,
    and vice versa. The same holds true for other pairs of scripts—content scripts
    and popup scripts, and content scripts and event script. The only way scripts
    can access each other’s data (variables, functions, etc.) is by *messaging* ,
    which you will learn about in the next chapter.


    ![](index-54_1.jpg)


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    •


    **Popup** **component** —Popup is a special (optional) view


    available only to the Browser-Action and Page-Action input


    components. A popup is made entirely of an HTML page


    (see Figur[es 2-2](#index_split_000.html#p54) [and 2-3 ). N](#index_split_000.html#p55)ote
    that a popup *only* appears when the user clicks on the toolbar button corresponding


    to a Browser-Action or a Page-Action (whichever one the


    extension is using). And yes, you guessed it right—popup


    scripts are used along with the popup component.


    ***Figure 2-2.** A Browser-Action popup*


    ![](index-55_1.jpg)


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    ***Figure 2-3.** A Page-Action popup*


    •


    Popup scripts are plain JavaScript files. Because they are


    used in a popup, they are known as popup scripts. Note that


    a popup script’s code *cannot* be inlined into the HTML page


    for popup. Inlining of scripts means placing JavaScript code


    directly inside script tags, as in <script>alert(''Hello


    World'');</script> .


    •


    So, popup scripts can only be referred to, where the src


    needs to point a path, relative to the extension folder, such


    as <script src="popup_script.js"></script> . And yes, multiple popup scripts can
    be referre[d to (see Listing 2-1 )](#index_split_000.html#p56)


    to modularize the code. These scripts do not get merged


    when the extension loads (in the browser), and they can be


    separately identified in the Sources and Resources panels


    (see Figures 1-16 and 1-17 in Ch[apter 1 ) in the DevT](http://dx.doi.org/10.1007/978-1-4842-1775-7_1)ools
    window, discussed in Ch[apter 1 . A](http://dx.doi.org/10.1007/978-1-4842-1775-7_1)dditionally,
    the Console panel will also help categorize the logs from different


    (referred) popup scripts, as displayed in Figur[e 2-4 .](#index_split_000.html#p56)


    ![](index-56_1.jpg)


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    ***Figure 2-4.** Inspecting the popup: Console panel*


    • A very important feature of popup scripts is that they can access


    the Chrome Extensions API. Moreover, being JavaScript files,


    popup scripts have access to all the Standard JavaScript APIs,


    including the event APIs to listen for and respond to DOM events


    fired from the nodes within a popup.


    ***Listing 2-1.*** Ch[apter 2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)
    /HelloBrowserAction/popup.html


    <head>


    <!-- The following tag is not obeyed -->


    <title>HelloBrowserAction (Custom)</title>


    <!--


    <script>


    // Inline scripts are not allowed


    alert(''Hello World'');


    </script>


    -->


    <!-- Referring scripts is allowed -->


    <script src="popup_script.js"></script>


    <script src="another_popup_script.js"></script>


    <style>


    ...


