- fmt: "# More About Extensions\n\nBy now you have learned about most of the features\
    \ of Google Chrome Extensions, including the architecture, messaging between different\
    \ components, and the APIs provided by the Google Chrome Extensions framework.\
    \ This chapter covers the remaining features of Google Chrome Extensions, such\
    \ as the options page, override pages, and themes. In addition to this, you will\
    \ learn about some security concerns that you should keep in mind when developing\
    \ Google Chrome Extensions. These include API permissions, `match pattern` permissions,\
    \ content-script injections, etc.\n\n## Providing an Options Page\n\nYou can allow\
    \ users to customize the behavior of the extension by providing an options page\
    \ (see Figure 4-4). An important point to note is that such a provision can be\
    \ easily made without the use of an options page. This can be done, for example,\
    \ by providing a popup component consisting of a UI to allow saving of preferences\
    \ for the extension (say using the `chrome.storage` API). However, this is not\
    \ recommended, as it won’t allow users to access the options page from the Extensions\
    \ Management page (see Figure 4-3 for the options link).\n\n### Role of Manifest\
    \ for this Component\n\nTo declare an options page, you need to use the `options_ui`\
    \ manifest attribute.\n\nThis attribute supports the following properties. As\
    \ seen in Listing 4-1 (from the OverridePages extension), the `page` and `chrome_style`\
    \ properties suffice to declare the options page for an extension.\n\n- `page`\
    \ (string) — The path to the options page, relative to the extension’s root.\n\
    - `chrome_style` (boolean) — If `true`, a Chrome user agent stylesheet will be\
    \ applied to the options page. The default value is `false`, but for a consistent\
    \ UI with Chrome, it is recommended to set this value to `true`.\n- `open_in_tab`\
    \ (boolean) — If `true`, the extension’s options page will be opened in a new\
    \ tab rather than embedded in `chrome://extensions`. The default value is `false`,\
    \ and `true` is not recommended.\n\n***Listing 4-1.*** Chapter 4/OverridePages/manifest.json\n\
    \n```\n{\n  \"name\" : \"My New-Tab\",\n  \"version\" : \"1.2\",\n  \"manifest_version\"\
    \ : 2,\n  \"chrome_url_overrides\" : {\n    /*newtab,history,bookmarks*/\n   \
    \ \"newtab\" : \"myNewTab.html\"\n  },\n  \"permissions\" : [\"bookmarks\",\"\
    storage\"],\n  /*Using an options page*/\n  \"options_ui\" : {\n    \"page\" :\
    \ \"myOptionsPage.html\",\n    /*Use Chrome stylesheet*/\n    \"chrome_style\"\
    \ : true\n  }\n}\n```\n\n## Writing an Options Page\n\nAn options page is made\
    \ entirely of an HTML page (displayed in Figure 4-4). Listing 4-2 contains the\
    \ HTML code for the options page used in the OverridePages extension. This extension\
    \ is available in Chapter 4’s Exercise Files folder. As described, it is recommended\
    \ to use the Chrome stylesheet for this HTML, by setting the `chrome_style` property\
    \ to `true` in the manifest.\n\n> **Note** To programmatically open an options\
    \ page, use the `chrome.runtime.openOptionsPage` method.\n\n***Figure 4-1.***\
    \ New Tab page: override prompt\n\n***Listing 4-2.*** Chapter 4/OverridePages/myOptionsPage.html\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>My Options-Page</title>\n<script\
    \ src=\"myOptionsPage_1.js\"></script>\n<style>\ndiv.left {\n  float:left;\n}\n\
    div.right {\n  float:right;\n}\np.clear {\n  clear:both;\n}\n</style>\n</head>\n\
    <body>\n<p>\n<div class=\"left\">\n  Only display matching bookmarks?\n</div>\n\
    <div class=\"right\">\n  <form>\n    <input type=\"radio\" name=\"highlight\"\
    \ value=\"1\"> Yes\n    <input type=\"radio\" name=\"highlight\" value=\"0\" checked=\"\
    checked\"> No\n  </form>\n</div>\n</p>\n<br>\n<p class=\"clear\">\n  <input type=\"\
    button\" id=\"save\" value=\"Save\">\n</p>\n</body>\n</html>\n```"
