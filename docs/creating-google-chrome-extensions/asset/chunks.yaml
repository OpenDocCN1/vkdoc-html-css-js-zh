    ## 弹出窗口脚本与事件脚本


    现在让我们看看弹出窗口脚本如何与事件脚本进行通信。虽然这两个组件都代表了扩展的运行环境，但它们在扩展架构中作为不同的脚本组件存在。这就是为什么这两个脚本组件之间需要进行通信。让这些组件相互通信比让其他组件相互通信要容易得多。


