    \ the use of the `textarea` and `button` tags.\n\n![BrowserActionNotes: popup\
    \ component](index-87_1.jpg)\n![BrowserActionNotes: popup component](index-87_2.jpg)\n\
    \n## Figure 2-22. BrowserActionNotes: popup component\n\nAlso note the referred\
    \ popup script, named `popup_script.js`. The `SAVE` button is used to save the\
    \ entered note, using the `localStorage` API (a standard JavaScript API). The\
    \ saved note is mapped to the URL the note was saved for (see Figure 2-23, in\
    \ the Resources panel).\n\nThe `REMOVE` button is used to remove the saved note\
    \ for the corresponding URL.\n\n## Figure 2-23. BrowserActionNotes: Resources\
    \ panel\n\n## Listing 2-13. Chapter 2 /BrowserActionNotes/popup.html\n\n```html\n\
    <script src=\"popup_script.js\"></script>\n<style>\n...\n</style>\n</head>\n<body>\n\
    <div id=\"container\">\n<div id=\"top\"><textarea id=\"note\" placeholder=\"...\"\
    ></textarea></div>\n<div id=\"bottom\">\n<br>\n<button id=\"save_button\">SAVE</button>\n\
    <br>\n<button id=\"remove_button\">REMOVE</button>\n</div>\n</div>\n</body>\n\
    </html>\n```\n\nThe popup script, upon loading, gets references to the `textarea`\
    \ and `button` elements. This is done using the `getElementById` method (a standard\
    \ JavaScript API).\n\nThe most important functions defined in the popup script\
    \ (see Listing 2-14) are `hardSave` and `removeNote`. Both these functions use\
    \ the tab’s API to access the currently active tab.\n\nNote that this extension\
    \ uses the `tabs` permission in the manifest.\n\nUpon clicking of the `saveButton`\
    \ in the popup, the `hardSave` function gets called.\n\nSimilarly, clicking the\
    \ `removeButton` calls the `removeNote` function. A note is saved by calling the\
    \ `localStorage.setItem` method—`localStorage.setItem(activeURL,noteText)`.\n\n\
    It is removed by calling the `localStorage.removeItem` method.\n\n## Listing 2-14.\
    \ Chapter 2 /BrowserActionNotes/popup_script.js\n\n```javascript\n//region {variables\
    \ and functions}\nvar consoleGreeting = \"Hello World! - from popup_script.js\"\
    ;\n\n//Active-URL can also be cached\n//var activeURL = \"\";\nvar noteElementID\
    \ = \"note\";\nvar saveButtonID = \"save_button\";\nvar removeButtonID = \"remove_button\"\
    ;\nvar noteElement = null;\nvar saveButton = null;\nvar removeButton = null;\n\
    var queryInfo = {\"active\":true};\n\nfunction logSuccess(task) {\n    console.log(\"\
    %s Successful!\",task);\n    chrome.browserAction.setBadgeText({\"text\":localStorage.length.toString()});\n\
    }\n\n//function logFailure(task) {console.log(\"%s Failed!\",task);}\n\nfunction\
    \ loadNoteForActiveURL(noteElement) {\n    chrome.tabs.query(queryInfo,function(tabs)\
    \ {\n        var activeURL = tabs[0].url;\n        noteElement.value = localStorage.getItem(activeURL);\n\
    \        logSuccess(\"Get-Storage\");\n    });\n}\n\nfunction softSave(noteText)\
    \ {} //appends the text\n\nfunction hardSave(noteText) { //overwrites the text\n\
    \    chrome.tabs.query(queryInfo,function(tabs) {\n        var activeURL = tabs[0].url;\n\
    \        localStorage.setItem(activeURL,noteText);\n        logSuccess(\"Set-Storage\"\
    );\n    });\n}\n\nfunction removeNote() {\n    chrome.tabs.query(queryInfo,function(tabs)\
    \ {\n        var activeURL = tabs[0].url;\n        localStorage.removeItem(activeURL);\n\
    \        logSuccess(\"Remove-Storage\");\n    });\n}\n//end-region\n```\n\nAs\
    \ soon as the popup opens, the `loadNoteForActiveURL` function (Listing 2-15)\
    \ gets called to access the note corresponding to the currently active URL and\
    \ to load this note in the `textarea` element. Note the use of the `logSuccess`\
    \ function. Aside from use as a logging function, it is also used to set the badge\
    \ text for the Browser-Action (see Figures 2-24 and 2-25). This text is updated\
    \ with the `localStorage.length` value, at various times when you interact with\
    \ the extension.\n\n![Setting the badge text](index-90_1.jpg)\n![Console panel\
    \ for popup](index-90_2.jpg)\n\n## Figure 2-24. BrowserActionNotes: Setting the\
    \ badge text\n\n## Figure 2-25. BrowserActionNotes: Console panel for popup"
