- fmt: "■ **Note**: Browser-Actions can optionally display a badge, which is a bit\
    \ of text that is layered over the icon. Badges make it easy to update the Browser-Action\
    \ to display a small amount of information about the state of the extension. Because\
    \ the badge has limited space, it should have four characters or less.\n\nYou\
    \ set the text and color of the badge using `browserAction.setBadgeText` and `browserAction.setBadgeBackgroundColor`,\
    \ respectively.\n\n**Listing 2-15.** Chapter [2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)\
