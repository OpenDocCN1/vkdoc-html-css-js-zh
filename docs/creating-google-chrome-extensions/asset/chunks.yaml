    \ {\n  chrome.tabs.create(createProperties, function(tab) {\n    console.log(\"\
    create\");\n    // integer or array of integers\n    //chrome.tabs.remove(tab.id);\n\
    \    /*\n    chrome.tabs.duplicate(tab.id,function(tab) {\n      console.log(\"\
    duplicate\");\n    });\n    */\n    chrome.tabs.update(tab.id, updateProperties,\
    \ function(tab) {\n      console.log(\"update\");\n      //chrome.tabs.reload(tab.id);\n\
    \      chrome.tabs.getZoom(tab.id, function(zoomFactor) {\n        console.log(\"\
    getZoom\");\n        console.log(zoomFactor); //1\n      });\n      /*\n     \
    \ chrome.tabs.setZoom(tab.id,2,function() {\n        console.log(\"setZoom\");\n\
    \      });\n      */\n    });\n  });\n}\n// end-region\n```\n\n# Chapter 3: API\
    \ Availability and Messaging\n\n```javascript\n//region {calls}\nconsole.log(greeting);\n\
    \nchrome.browserAction.onClicked.addListener(function(tab) {\n  chrome.tabs.captureVisibleTab({\"\
    format\": \"png\"}, function(dataUrl) {\n    // Cannot access a chrome:// URL\n\
    \    chrome.tabs.executeScript(tab.id, {\"code\": getJavaScriptCode(dataUrl)});\n\
    \  });\n  //createAndUpdateTab(tab);\n});\n//end-region\n```\n\n## Creating and\
    \ Removing a Tab\n\nTo create a tab, use the `chrome.tabs.create` method. This\
    \ method takes two parameters: `createProperties` (of type `object`) and `callback`\
    \ (of type `function`). The `createProperties` object supports the following useful\
    \ properties: `index`, `url`, `active`, and `pinned`. The `callback` function\
    \ receives an argument of type `Tab` (`tabs.Tab`). A tab can also be duplicated\
    \ by calling the `chrome.tabs.duplicate` method, as shown in [Listing 3-29](#index_split_001.html#p156)\
    \ (see the commented-out section in the `createAndUpdateTab` function).\n\nUse\
    \ the `chrome.tabs.remove` method to close one or more tabs. This method takes\
    \ the ID of the tab to close, or a list of such IDs as its first parameter. It\
    \ also supports an optional `callback` function as its second parameter.\n\n##\
    \ Updating a Tab\n\nUse the `chrome.tabs.update` method to modify the properties\
    \ of a tab. This method takes three parameters: `tabId`, `updateProperties`, and\
    \ `callback`. As you might have guessed, `tabId` is the ID of the tab to update.\
    \ The `callback` function receives the details of the updated tab via the `tab`\
    \ argument. The `updateProperties` object specifies the properties to update.\
    \ Only the following properties are supported: `url`, `active`, `highlighted`,\
    \ `pinned`, `muted`, and `openerTabId`. Note that you can also reload a tab by\
    \ calling the `chrome.tabs.reload` method. This method takes the ID of the tab\
    \ to reload as its first parameter and an optional `callback` function as its\
    \ second parameter.\n\n***Listing 3-30.*** Chapter 3/TabsAPI/manifest.json\n\n\
    ```json\n{\n  \"manifest_version\": 2,\n  \"name\": \"API Demos: tabs API\",\n\
    \  \"description\": \"Demonstrates use of the tabs API\",\n  \"version\": \"1.2\"\
    ,\n  \"background\": {\n    \"scripts\": [\"event_script.js\"],\n    \"persistent\"\
    : false\n  },\n  \"browser_action\": {\n    \"default_icon\": \"icon.png\"\n \
    \ },\n  \"permissions\": [\n    \"tabs\",\n    \"<all_urls>\"\n  ]\n}\n```\n\n\
    > **Note:** To zoom a specified tab, use the `chrome.tabs.setZoom` method. Additionally,\
    \ to get the current zoom factor of a specified tab, use the `chrome.tabs.getZoom`\
    \ method.\n\n## Capturing a Tab\n\nTo capture the visible area of the currently\
    \ active tab in the specified window, use the `chrome.tabs.captureVisibleTab`\
    \ method. This method takes three parameters: `windowId`, `options`, and `callback`.\
    \ The `windowId` parameter is optional, and it defaults to the current window.\
    \ The `options` parameter is used to specify the format of the image.\n\nThe `callback`\
    \ function receives the `dataUrl` (string) argument — which is a URL referring\
    \ to the data containing the encoded image of the visible area of the captured\
    \ tab. Note that the `dataUrl` can be assigned to the `src` property of an HTML\
    \ `img` element, as shown in [Listing 3-29](#index_split_001.html#p156). An image\
    \ corresponding to this is shown in [Figure 3-36](#index_split_001.html#p146).\
    \ Also note that this method requires an additional permission: `<all_urls>` —\
    \ shown in [Listing 3-30](#index_split_001.html#p157).\n\n## Associated Events\n\
    \nThe `chrome.tabs` API provides a long list of events corresponding to almost\
    \ every available method. For example, the `onCreated`, `onUpdated`, `onRemoved`,\
    \ `onZoomChange`, etc., events. The complete list of such events is available\
    \ at [https://developer.chrome.com/extensions/tabs](https://developer.chrome.com/extensions/tabs).\n\
    \n# XHR API\n\nAn extension can talk to remote servers (using the `XMLHttpRequest`\
    \ object) by requesting cross-origin permissions. Such permissions are requested\
    \ with the help of *match patterns* that provide access to one or more hosts (see\
    \ `\"*://localhost/*\"` in [Listing 3-31](#index_split_001.html#p158)).\n\n***Listing\
    \ 3-31.*** Chapter 3/XHRAPI/manifest.json\n\n```json\n{\n  \"manifest_version\"\
    : 2,\n  \"name\": \"API Demos: xhr API\",\n  \"description\": \"Demonstrates use\
    \ of the xhr API\",\n  \"version\": \"1.2\",\n  \"background\": {\n    \"scripts\"\
    : [\"event_script.js\"],\n    \"persistent\": false\n  },\n  \"permissions\":\
    \ [\n    \"*://localhost/*\"\n  ]\n}\n```\n\nOnce the host permission is requested,\
    \ the XHR API can be used, similarly to the way it is used in regular web pages.\
    \ In [Listing 3-32](#index_split_001.html#p159), note that the `ucService` (PHP\
    \ script to uppercase the input string) is served from my local HTTP server. The\
    \ PHP script is available in [Listing 3-33](#index_split_001.html#p159).\n\n***Listing\
    \ 3-32.*** Chapter 3/XHRAPI/event_script.js\n\n```javascript\n//region {variables\
    \ and functions}\nvar greeting = \"Hello World!\";\nvar xhr = new XMLHttpRequest();\n\
    \nfunction onReadyStateChange() {\n  if (xhr.readyState == 4) {\n    console.log(xhr.responseText);\n\
    \  }\n}\n\nvar host = \"http://localhost/\";\nvar ucService = host + \"Exercise\
    \ Files/Chapter3/XHRAPI/webpage.php?\";\nvar queryString = \"name=\" + encodeURIComponent(\"\
    xhr api\");\n//end-region\n\n//region {calls}\nconsole.log(greeting);\nxhr.onreadystatechange\
    \ = onReadyStateChange;\nxhr.open(\"GET\", ucService + queryString);\nxhr.send();\n\
    //end-region\n```\n\nThe query string `\"name=xhr api\"` is provided in a static\
    \ manner. It could be dynamically provided in your extension, for example, from\
    \ a Browser-Action popup, or Content-UI, etc. [Figure 3-37](#index_split_001.html#p150)\
    \ shows the corresponding response from the server.\n\n***Listing 3-33.*** Chapter\
    \ 3/XHRAPI/WebServer/webpage.php\n\n```php\n<?php\n$raw_input = trim($_GET[\"\
    name\"]);\nif(!preg_match(\"/^[a-zA-Z ]*$/\",$raw_input)) {\n    echo \"\";\n\
    } else {\n    echo strtoupper($raw_input);\n}\n?>\n```\n\n# Summary\n\nThe beginning\
    \ of this chapter discussed the left-out input components from the previous chapter:\
    \ omnibox input, context menu item, and Content-UI. After this, you learned the\
    \ various ways in which scripting components can interact with each other using\
    \ the messaging APIs provided by the Google Chrome Extensions framework. In addition\
    \ to this, you also learned how ordinary web pages can interact with an extension.\n\
    \nYou then learned what permission strings are in a manifest file, before learning\
    \ about how to use the many useful APIs provided by the Extensions framework.\
    \ You also learned how using XHR in an extension is possible across different\
    \ origins using *match pattern* permission strings in the manifest file.\n\nIn\
    \ the next chapter, you will read about a few remaining features provided by the\
    \ Chrome Extensions framework, such as themes, override pages (to override a new\
    \ tab, bookmarks page, etc.), and options pages, which enable you to enhance the\
    \ niche of your extension on the Chrome browser.\n\n---\n\n## **Chapter 4: More\
    \ About Extensions**"
