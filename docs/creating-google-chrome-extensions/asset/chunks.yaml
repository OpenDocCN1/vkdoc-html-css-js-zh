  trans: "\n# 第 3 章：API 可用性与消息传递\n\n要为您的扩展程序存储用户数据，您可以使用 `storage.sync` 或 `storage.local`\
    \ API。使用 `storage.sync` 时，只要用户启用了同步功能，存储的数据就会自动同步到用户登录的任何 Chrome 浏览器。\n\n当 Chrome\
    \ 处于离线状态时，Chrome 会将数据存储在本地。下次浏览器在线时，Chrome 会同步这些数据。即使**用户禁用同步**，`storage.sync`\
    \ API 仍然会正常工作。在这种情况下，它的行为将与 `storage.local` API 完全相同。\n\n> **注意**：不应存储机密的用户信息！存储区域未加密。\n\
    \n---\n\n## 清单 3-28. 第 [3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3) 章 /StorageAPI/event_script.js\n\
    \n```javascript\n//region {variables and functions}\n\nvar greeting = \"Hello\
    \ World!\";\n\n//end-region\n\n//region {calls}\n\nconsole.log(greeting);\n\n\
    /*\n//single key or a list of keys for items to remove\nchrome.storage.sync.remove(\"\
    color\",function() {\n    console.log(\"remove\");\n    chrome.storage.sync.get(\"\
    color\",function(items) {\n        console.log(\"get\");\n        console.log(items);\n\
    \    });\n});\n*/\n\nchrome.storage.sync.set({\"color\":\"red\"},function() {\n\
    \    console.log(\"set\");\n    //string or array of string or object keys\n \
    \   chrome.storage.sync.get(\"color\",function(items) {\n        console.log(\"\
    get\");\n        console.log(items);\n    });\n});\n\nchrome.storage.onChanged.addListener(function(changes,areaName)\
    \ {\n    console.log(changes);\n    //\"sync\",\"local\" or \"managed\"\n    console.log(areaName);\n\
    });\n\n//end-region\n```\n\n---\n\n# 设置和获取项目\n\n您可以通过以下 API 调用分别从存储中设置和获取项目：`chrome.storage.sync.set`\
    \ 和 `chrome.storage.sync.get`。`get` 方法接受字符串、字符串数组或对象键作为其第一个参数，`set` 方法接受一个对象（包含键值对）作为其第一个参数。`get`\
    \ 方法的第二个参数是一个回调函数，该函数接收一个对象作为其参数。图 3-35 包含了这些方法调用产生的对应日志。\n\n# 删除项目\n\n您可以通过调用\
    \ `chrome.storage.sync.remove` 方法轻松删除存储中的项目。此方法接受一个字符串或字符串数组作为其第一个参数，并可选地接受一个回调函数作为其第二个参数。要从存储中删除所有项目，请使用\
    \ `chrome.storage.sync.clear` 方法。\n\n# 关联事件\n\n存储 API 提供了 `chrome.storage.onChanged`\
    \ 事件。当一个或多个（存储）项目发生更改时，会触发此事件。对应于此事件的监听器函数接收两个参数：（对象）`changes` 和（字符串）`areaName`。此处，`areaName`\
    \ 是存储区域的名称（例如 `sync`、`local` 等）。\n\n---\n\n# Tabs API\n\nTabs API（即 `chrome.tabs`\
    \ API）用于与浏览器的标签系统进行交互。\n\n您可以使用此 API 在浏览器中创建、修改和重新排列标签页。它需要使用 `tabs` 权限。清单 3-29\
    \ 包含了来自第 [3 章](http://dx.doi.org/10.1007/978-1-4842-1775-7_3) 练习文件文件夹中的 `TabsAPI`\
    \ 扩展程序的代码。您已经使用了此 API 中的 `query`、`connect`、`sendMessage`、`executeScript` 和 `insertCSS`\
    \ 方法。本节将介绍其余的方法。\n\n> **注意**：您可以在扩展程序的清单文件中不声明任何权限的情况下，使用大多数 `chrome.tabs` 方法和事件。但是，如果您需要访问\
    \ `tabs.Tab` 的 `url`、`title` 或 `favIconUrl` 属性，则必须在清单中声明 `tabs` 权限。\n\n---\n\n\
    ## 清单 3-29. 第 [3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3) 章 /TabsAPI/event_script.js\n\
    \n```javascript\n//region {variables and functions}\n\nvar greeting = \"Hello\
    \ World!\";\n\nvar createProperties = {\n    url : \"http://www.example.org\"\
    ,\n    active : false,\n};\n\nvar updateProperties = {\n    pinned : true\n};\n\
    \nfunction getJavaScriptCode(dataUrl) {\n    var javascriptCode = \"var imgElement\
    \ = document.createElement('img');\";\n    javascriptCode += \"document.body.appendChild(imgElement);\"\
    ;\n```\n"
