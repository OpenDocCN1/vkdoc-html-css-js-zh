  trans: "\n# 排版后的文档\n\n在当前主题讨论的所有事件中，有一个共同点。它们都代表了扩展框架中的一个事件对象。*事件*是一个对象，允许您在发生某些有趣的事情时得到通知。以下是使用`chrome.alarms.onAlarm`事件在闹钟结束时得到通知的示例。\n\
    \n```javascript\nchrome.alarms.onAlarm.addListener(function(alarm) {\n  if(alarm.name\
    \ == \"A\") {/**/}\n  else if(alarm.name == \"B\") {/**/}\n  else {/**/}\n});\n\
    ```\n\n## 第二章 ■ 架构概述\n\n与 DOM API 类似，扩展框架中的事件也需要一个监听器函数，该函数使用`addListener`方法注册。不应将其与\
    \ DOM API 的`addEventListener`方法混淆。扩展框架中的每个 API（`browserAction`、`pageAction`、`commands`、`tabs`、`alarms`、`bookmarks`等）都会向监听器函数传递不同类型的参数。对于前面列出的示例，监听器接收一个`Alarm`类型的参数。\n\
    \n除了目前讨论的事件之外，扩展框架还提供了一个高级系统，用于根据某些自定义规则的匹配来执行操作。虽然这听起来类似于典型的事件和监听器模型，但并非如此。扩展框架中的这个高级功能被称为声明式事件处理器，并将在同名主题中讨论。\n\
    \n### 重新审视`onCommand`事件\n\n现在，您可以最终重新审视`HelloShortcutKey`扩展。要监听`onCommand`事件，首先需要在扩展文件夹中创建一个事件脚本。事件脚本可以任意命名，只要是一个有效的文件名即可。接下来，您需要在清单中列出该事件脚本。为此，您需要先定义`background`清单属性。\n\
    \n向此属性添加两个属性：`scripts`和`persistent`。如前所述，`scripts`属性接受一个数组作为其值。事件脚本将列在此数组中。对于此扩展，由于您不希望在浏览器打开期间让事件脚本持续存在（您只希望它们基于事件保持活动状态），您需要将`persistent`定义为`false`，如清单\
    \ 2-4 所示。\n\n当此扩展在浏览器中加载时，与事件脚本对应的*后台页面*将开始监听任何事件。要处理`onCommand`事件，您需要实现其监听器函数（参见清单\
    \ 2-5）。当定义的快捷键被调用时，*后台页面*将变为活动状态并执行监听器函数。一旦它进入空闲状态（参见图 2-11），它将变为不活动状态，从而也卸载所有关联的脚本（以节省内存和其他系统资源）。\n\
    \n## 声明式事件处理器\n\n在我们开始讨论声明式事件处理器作为基于自定义规则执行操作的高级机制之前，请将注意力转移到`HelloPageAction`扩展以显示页面操作。该扩展位于第二章的练习文件文件夹中。您可以在浏览器中加载它进行测试。\n\
    \n**清单 2-6.** 第二章/HelloPageAction/manifest.json\n\n```json\n{\n  \"manifest_version\"\
    : 2,\n  \"name\": \"HelloPageAction\",\n  \"description\": \"Extension to demonstrate\
    \ a Page-Action\",\n  \"version\": \"1.2\",\n  \"page_action\": {\n    \"default_title\"\
    : \"HelloPageAction\",\n    \"default_icon\": \"icon.png\",\n    \"default_popup\"\
    : \"popup.html\"\n  },\n  \"background\": {\n    \"scripts\": [\"event_script.js\"\
    ],\n    \"persistent\": false\n  },\n  \"permissions\": [\n    \"tabs\"\n  ]\n\
    }\n```\n\n### `HelloPageAction`扩展\n\n如清单 2-6 所示，除了声明和定义页面操作外，此扩展的清单还包含用于使用事件脚本的`background`清单属性的定义。除此之外，清单还包含用于使用`tabs`功能的`permissions`属性（您将在第三章中了解`permissions`属性）。为了使事件脚本仅在事件基础上活动，`persistent`被定义为`false`。\n\
    \n**清单 2-7.** 第二章/HelloPageAction/event_script.js\n\n```javascript\n//region {variables\
    \ and functions}\nvar consoleGreeting = \"Hello World! - from event_script.js\"\
    ;\nvar queryInfoForAllTabs = {\n  //\"active\":false,\"currentWindow\":true\n\
    };\n\nfunction logTabs(tabs) {\n  console.group(\"Tabs\");\n  console.log(tabs);\n\
    \  console.groupEnd(\"Tabs\");\n}\n\nfunction queryTabsAndShowPageActions() {\n\
    \  chrome.tabs.query(\n    queryInfoForAllTabs,\n    function(tabs) {\n      console.log(\"\
    All tabs length: %s\", tabs.length);\n      //Output tabs object to the console\
    \ as a separate visual group\n      logTabs(tabs);\n      if(tabs.length > 0)\
    \ {\n        for(var i=0; i<tabs.length; i++) {\n          chrome.pageAction.show(tabs[i].id);\n\
    \        }\n      }\n    }\n  );\n}\n//end-region\n```\n\n清单 2-7 和 2-8 包含了此扩展中使用的事件脚本的代码。函数`queryTabsAndShowPageActions`使用了`chrome.tabs.query`\
    \ API，根据对象`queryInfoForAllTabs`查询标签页，该对象作为第一个参数传递给`query`方法。此对象为空，以便使`query` API\
    \ 返回所有标签页。这在您的扩展中是必需的，以便在所有标签页上显示页面操作。\n\n`query`方法的第二个参数是一个回调函数，它接收`tabs`作为其第一个（也是唯一一个）参数。因为它是一个数组，所以您可以对其进行迭代。此数组中的每个元素都是`Tab`类型。在\
    \ Chrome 扩展框架中，每个标签页都使用此`Tab`类型表示。此类型有许多关联的属性，其中重要的包括`id`、`active`和`url`。\n\n\
    对于此扩展，您需要`id`属性来显示页面操作。页面操作通过调用`chrome.pageAction.show`方法显示在标签页中，该方法接受标签页的`id`作为其唯一参数。因此，在循环`for(var\
    \ i=0; i<tabs.length; i++)`内部，调用`show`方法来显示页面操作。\n\n**清单 2-8.** 第二章/HelloPageAction/event_script.js\n\
    \n```javascript\n//region {calls}\nconsole.log(consoleGreeting);\n//Show Page-Actions\
    \ using the chrome.tabs.query method\n//queryTabsAndShowPageActions();\n//Show\
    \ Page-Actions using the onUpdated event\nchrome.tabs.onUpdated.addListener(function(tabId,changeInfo,tab)\
    \ {\n  chrome.pageAction.show(tabId);\n});\n//end-region\n```\n\n然而，使用`queryTabsAndShowPageActions`函数有一个缺点。此函数只会被调用一次，即当事件脚本首次在浏览器中加载时。为了在每次打开（或更新）标签页时显示页面操作，这还不够。为此，您需要监听标签页上的一个事件——`onUpdated`事件。\n\
    \n此事件的使用在清单 2-8 中有所展示。对于此扩展，`queryTabsAndShowPageActions`函数调用已被注释掉。通过简单地监听`onUpdated`事件来显示页面操作。这样，每次标签页被更新（即打开或更新）时，监听器函数都会被调用，并为相应的标签页显示一个页面操作，其\
    \ ID 为`tabId`（监听器函数接收的参数，如清单 2-8 所示）。\n\n## `declarativeContent` API\n"
- fmt: "Now we can begin the discussion on declarative event handlers. Declarative\
    \ event handlers provide a means to define certain rules consisting of declarative\
    \ conditions and actions. Conditions are evaluated in the browser itself, rather\
    \ than the JavaScript engine that powers the Extensions framework. This reduces\
    \ the round-trip latencies between the browser and the (aforementioned) JavaScript\
    \ engine. At the time of writing this book, there are two kinds of declarative\
    \ event handlers—`chrome.declarativeContent` and `chrome.declarativeWebRequest`.\
    \ For the course of this book, you won’t be dealing with the latter (as it is\
    \ not available to the Google Chrome users on the stable channel).\n\n## CHAPTER\
    \ 2 ■ ARCHITECTURE OVERVIEW\n\nYou can use the `chrome.declarativeContent` API\
    \ to take actions depending on the content of a web page, without requiring permission\
    \ to read the web page’s content (which is done using content scripts that are\
    \ injected into the visited web pages, to read and modify the web page’s content).\
    \ Only two such actions are supported at the time of writing—`chrome.declarativeContent.ShowPageAction`\
    \ and `chrome.declarativeContent.SetIcon`. To use this API, the following permission\
    \ is required in the manifest: `declarativeContent`.\n\n### Adding and Removing\
    \ Rules\n\nAs a declarative API, this API lets you register rules on the `onPageChanged`\
    \ event, i.e. using `chrome.declarativeContent.onPageChanged.*`. Here, `*` could\
    \ mean `addRules` or `removeRules`. The `addRules` method takes an array of rule\
    \ instances as its first parameter, and an optional callback function (that is\
    \ called on completion) as the second parameter.\n\n```\nvar rule1 = {\n    id\
    \ : \"some_rule_A\", //Optional, will be generated if not set\n    priority :\
    \ 100, //Optional, defaults to 100\n    conditions : [/*conditions*/],\n    actions\
    \ : [/*actions*/]\n};\n...\nvar ruleList = [rule1,rule2,...];\nchrome.declarativeContent.onPageChanged.addRules(ruleList);\n\
    ```\n\nTo remove rules, call the `removeRules` method. It accepts an optional\
    \ array of rule identifiers (for example, `[rule1.id, rule2.id]`) as its first\
    \ parameter, and a callback function as its second parameter. If the array is\
    \ `undefined`, all registered rules of this extension are removed.\n\n***Listing\
    \ 2-9.*** Chapter 2/PageActionNotes/event_script.js\n\n```\n//region {variables\
    \ and functions}\nvar consoleGreeting = \"Hello World! - from event_script.js\"\
    ;\nvar ruleStackOverflowHost = {\n    \"conditions\" : [\n        new chrome.declarativeContent.PageStateMatcher({\n\
    \            \"pageUrl\" : {\n                \"hostEquals\" : \"stackoverflow.com\"\
    ,\n                \"schemes\" : [\"http\",\"https\"]\n            }\n       \
    \ })\n    ],\n    \"actions\" : [new chrome.declarativeContent.ShowPageAction()]\n\
    };\n//end-region\n```\n\n> **Note:** Rules are persistent across browsing sessions.\
    \ Therefore, you should add rules during extension installation time, using the\
    \ `runtime.onInstalled` event. Note that this event is also triggered when an\
    \ extension is updated. Therefore, you should first clear previously installed\
    \ rules and then register new rules. For more details on rules, visit the following\
    \ URL: <https://developer.chrome.com/extensions/events>.\n\n***Listing 2-10.***\
    \ Chapter 2/PageActionNotes/event_script.js\n\n```\n//region {calls}\nconsole.log(consoleGreeting);\n\
    chrome.runtime.onInstalled.addListener(function() {\n    //Replace all rules\n\
    \    chrome.declarativeContent.onPageChanged.removeRules(undefined,function()\
    \ {\n        //With a new rule\n        chrome.declarativeContent.onPageChanged.addRules(\n\
    \            [ruleStackOverflowHost]\n        );\n    });\n});\n//end-region\n\
    ```\n\n### Using ShowPageAction\n\nIn the previous topic, “HelloPageAction Extension,”\
    \ it was demonstrated how Page-Action can be displayed using the `chrome.tabs.query`\
    \ method and using the `chrome.tabs.onUpdated` event. Now, you will examine another\
    \ way to do so using a declarative event handlers’ actions.\n\n> **Note:** For\
    \ advanced coverage of this topic, visit the URL."
