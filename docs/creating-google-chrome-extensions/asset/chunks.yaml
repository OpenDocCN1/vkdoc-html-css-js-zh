- fmt: "# 排版后的内容\n\n`onMessageExternal`和`runtime.onConnectExternal`事件。因此，它们不能依赖运行时API与网页脚本通信。相反，它们需要监听由标准JavaScript\
    \ API提供的`message`事件来实现此目的。为此，让我们检查本章练习文件文件夹中提供的`CSandWS`扩展。[清单3-17](#index_split_001.html#p128)至[3-19](#index_split_001.html#p130)包含此扩展的相关代码。\n\
    \n如本扩展的清单文件所示，使用`content_scripts`属性，一个内容脚本会被注入到属于`localhost`的已访问网页中。请注意，为了本扩展展示的目的，无需HTTP服务器来提供外部网页。但这样做是为了展示`window`的安全使用。\n\
    \n`postMessage`方法和`message`事件。如果内容脚本被注入到本地文件网页中，那么`postMessage`方法中的目标源（即接收消息的窗口的URL或URI）需要指定为`*`。出于安全原因，强烈不鼓励这样做，因为它将允许来自所有主机的消息。\n\
    \n> **注意** 此上下文中的本地文件是通过浏览器使用`file://`方案访问的文件。本地文件网页的一个示例是`file:///F:/Exercise%20Files/somefile.html`。这与使用`http://`或`https://`方案从`localhost`提供的网页不同。\n\
    \n## 第3章 ■ API可用性与消息传递\n\n**清单3-17.** 第[3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)章/`CSandWS`/`manifest.json`\n\
    \n```json\n{\n  \"manifest_version\": 2,\n  \"name\": \"Communication Demo: content-script\
    \ and webpage-script\",\n  \"description\": \"Shows communication b/w content-script\
    \ and ...\",\n  \"version\": \"1.2\",\n  \"content_scripts\": [\n    {\n     \
    \ \"matches\": [\"*://localhost/*\"],\n      \"js\": [\"content_script.js\"]\n\
    \    }\n  ]\n}\n```\n\n> **注意** 此扩展提供的网页也可以作为本地文件网页提供。尽管它有`.php`后缀，但它包含纯HTML代码。因此，它可以直接在Chrome浏览器中打开（即使用`file://`方案作为本地文件网页）。\n\
    \n清单[3-18](#index_split_001.html#p129)包含注入的内容脚本的代码。`button`变量引用了创建的按钮元素——`Send\
    \ Message`。该元素可以在图[3-22](#index_split_000.html#p119)的右上角看到。请注意，此按钮元素有一个与其`click`事件关联的监听器函数。点击此元素时，监听器函数首先将`\"\
    Button clicked!\"`字符串记录到控制台。然后它调用`postMessage`方法——`window.postMessage(message,\
    \ targetOrigin)`。\n\n显然，`message`参数是要发送的消息。并且如上所述，`targetOrigin`是接收消息的窗口的URL或URI。请注意，在这种情况下，`targetOrigin`指向当前窗口的源：`var\
    \ targetOrigin = window.location.origin`。另请注意，以下所有`targetOrigin`值都是无效的：`\"file://\"\
    `、`\"file://*\"`、`\"\"`和`null`。要在本地文件网页中使用消息传递API，需要将`postMessage`调用为`window.postMessage(message,\
    \ \"*\")`。\n\n> **注意** 要将内容脚本注入本地文件网页，您需要将`matches`属性定义为`\"matches\": [\"file://*\"\
    ]`。\n\n无论网页使用何种方案提供（即`http://`或`https://`与`file://`），要接收发送的消息，都需要为`message`事件创建一个监听器函数，如`window.addEventListener(\"\
    message\", function(me){/**/})`行所示。同样的事项已在[清单3-19](#index_split_001.html#p130)中完成。其监听器函数对应的日志可以在图[3-22](#index_split_000.html#p119)中看到。请注意，传递给此监听器函数的事件具有一个`data`属性，可用于访问由`postMessage`方法发送的字符串或对象。\n\
    \n![](index-129_1.jpg)"
  raw: 'onMessageExternal and runtime.onConnectExternal events . For this reason,
    they cannot rely on the runtime APIs to communicate with the web page scripts.
    Instead, they need to listen for the message event provided by the standard JavaScript
    APIs to do so. For this purpose, let’s examine the CSandWS extension provided
    in the Exercise Files folder of this chapter. [Listings 3-17](#index_split_001.html#p128)
    [to 3-19](#index_split_001.html#p130) contain the relevant code from this extension.


    As seen in the manifest file for this extension, using the content_scripts attribute
    , a content script is injected into the visited web pages belonging to the localhost.
    Note that for the purpose demonstrated by this extension, an HTTP server is not
    necessary to serve the external web pages. But it has been done so to display
    secure use of the window.


    postMessage method and the message event. If the content script were to be injected
    in a local file web page, the target origin (i.e., URL or URI of the window that
    would receive the messages) in the postMessage method would need to be specified
    as * . This is strongly discouraged for security reasons, as it would allow messages
    from all hosts.


    ■ **Note** A local file in this context is a file accessed in the browser using
    the file://


    scheme. An example of a local file web page is file:///F:/Exercise%20Files/somefile.


    html . This is different from a web page served from the localhost that uses http://
    or https:// schemes.


