    Extensions Development: Security Concerns


    By now you understand that extensions have certain privileges that allow them
    to go beyond what regular web page scripts can do. For this reason, you need to
    be security conscious when writing extensions. Failing to do so can affect your
    users in terms of the privacy of the data that was accessed, that is currently
    being accessed, and that will be accessed. The following topics discuss some useful
    ways in which you can make your extensions more secure, and ways in which the
    Extensions framework takes care of security behind the scenes.


    API Permissions


    The first level of security is automatically provided by the permissions architecture
    in the Extensions framework. API permissions help to limit damage if the extension
    or app is compromised by malware. For example, if an extension that manipulates
    bookmarks has the bookmarks permission, it won’t be able to affect the user’s
    downloads, simply because it does not have the downloads permission. So, here
    you see that you should *never request* *unnecessary permissions in the manifest,*
    as this will weaken the user’s security if the extension or app gets compromised.


    Additionally, some of the permissions are also displayed to users, before installation
    of the extension (or app), as a warning. Note that you can read more about these
    warnings at the following URL[: https://developer.chrome.com/extensions/permission_warnings
    .](https://developer.chrome.com/extensions/permission_warnings)


