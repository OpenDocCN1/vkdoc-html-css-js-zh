  trans: "\n# 架构概览\n\n## 关于弹窗脚本\n\n**注意：** `Popup`脚本也代表扩展运行时。但它们不像事件脚本那样享有那么多特权（例如，持久性），因为弹窗脚本仅在相应弹窗打开时才会执行。因此，弹窗脚本只能成功监听少数事件。\n\
    \n## 事件脚本的必要性\n\n到目前为止讨论的每个组件都有其特定用途。例如，`BrowserAction`和`PageAction`组件作为按钮输入；快捷键提供了一种替代的输入方式；弹窗组件提供视图，而弹窗脚本提供应用程序逻辑。现在你可能已经对事件脚本如何对扩展有用有了大致的了解。以下几点明确说明了其用途：\n\
    \n- 最重要的用途是监听来自输入组件的事件，例如来自`BrowserAction`或`PageAction`组件的点击事件、调用快捷键时的命令事件、以及来自上下文菜单项选择的上下文菜单事件。此外，事件脚本还可以监听来自多功能框输入的事件。以下是输入组件触发的事件的完整列表及相应的输入组件\
    \ API（这里列出了除`ContentUI`之外的所有输入组件）：\n  - `chrome.browserAction` — `onClicked`\n\
    \  - `chrome.pageAction` — `onClicked`\n  - `chrome.commands` — `onCommand`\n\
    \  - `chrome.contextMenus` — `onClicked`\n  - `chrome.omnibox` — `onInputStarted`，`onInputChanged`，`onInputEntered`，`onInputCancelled`\n\
    \n**注意：** 如果在`manifest`中为`BrowserAction`或`PageAction`组件定义了`default_popup`，则`onClicked`事件将不会触发。\n\
    \n- 另一个重要用途是监听来自扩展本身的事件。这包括仅能从`chrome.runtime`对象访问的事件，例如`onMessage`，`onConnect`，`onInstalled`，`onUpdateAvailable`等。这些事件大多数是\
    \ Chrome 扩展框架提供的消息 API 的一部分。你将在下一章中了解这些事件。\n\n**注意：** 内容脚本（一种注入到访问网页中的脚本组件）可用于在宿主网页中创建\
    \ HTML 元素。这些元素在本书中称为 Content UI。Content UI 只能触发标准的 JavaScript 事件。此外，内容脚本对 Chrome\
    \ 扩展 API 的访问非常有限，因为它们不代表扩展运行时。它们只能访问以下 API：`chrome.runtime`，`chrome.extension`和`chrome.storage`。内容脚本仍然可以使用\
    \ Chrome 扩展框架提供的消息 API（可通过`chrome.runtime`对象访问）与扩展运行时通信。\n\n- 正如你将在第 3 章中看到的，使用`onMessage`（或`onConnect`）事件，事件脚本可以监听来自扩展注入到网页中的内容脚本的消息。此外，使用`chrome.runtime.onMessageExternal`事件，事件脚本还可以直接监听来自网页的消息。\n\
    \n- 除了所有这些事件之外，事件脚本还可以监听与各种 API 功能关联的事件，例如`tabs`，`alarms`，`storage`，`bookmarks`，`history`等。这些事件（及其相应的\
    \ API）的示例如下：\n  - `chrome.tabs` — `onCreated`，`onUpdated`，`onRemoved`等\n  - `chrome.alarms`\
    \ — `onAlarm`\n  - `chrome.storage` — `onChanged`\n  - `chrome.bookmarks` — `onCreated`，`onRemoved`，`onChanged`，`onImportBegan`，`onImportEnded`等\n\
    \  - `chrome.history` — `onVisited`，`onVisitRemoved`\n\n- 最重要的是事件脚本的**持久性**，它赋予了所有这些功能。事件脚本能够以可靠的方式监听事件，因为它是一个长期运行的脚本（与弹窗脚本不同，后者仅在弹窗打开时执行）。事件脚本会在需要时（即它们监听的事件被触发时）自动加载，并在再次空闲时卸载。\n\
    \n- 最后，事件脚本还可用于包含由扩展中多个组件共享的应用程序逻辑。例如，考虑一个允许在任何页面上记笔记的笔记扩展。最初，如果只使用`BrowserAction`，整个应用程序逻辑可以放在弹窗脚本中。但如果添加了其他输入组件，弹窗脚本中的代码将无法被这些组件访问（因为弹窗脚本仅在弹窗打开时执行）。\n\
    \n为了允许这种情况，共享代码（反映通用逻辑）可以放在事件脚本中。这使得各种组件可以不受限制地访问通用应用程序逻辑。显然，在这种情况下，弹窗脚本需要使用消息\
    \ API 与事件脚本来回通信（以便访问通用应用程序逻辑）。不要被这个例子搞糊涂，当你在本章后面完成`BrowserActionNotes`扩展时，你会更清楚地理解它。\n\
    \n## 此组件的清单角色\n\n要在你的扩展中使用事件脚本，你需要在`manifest`中定义`background`属性。该属性是一个由`scripts`和`persistent`键组成的对象。\n\
    \n`scripts`键接受一个字符串数组作为其值，其中每个字符串是事件脚本的（相对）路径。而`persistent`键将布尔值`false`作为其值（如清单\
    \ 2-4 所示）。允许多个事件脚本以模块化代码（图 2-10 和 2-11），如下所示：\n\n```\n\"background\" : {\n  \"\
    scripts\" : [\"event_script.js\", \"another_event_script.js\"],\n  \"persistent\"\
    \ : false\n}\n```\n\n**图 2-10.** `HelloShortcutKey`：后台页面\n\n**图 2-11.** `HelloShortcutKey`：后台页面\n\
    \n此外，一旦在`manifest`中定义了这些脚本，在扩展成功加载到浏览器后，它们会自动被引用到一个自动生成的 HTML 页面中，该页面称为**后台页面**，如图\
    \ 2-12 和 2-13 所示。\n\n**图 2-12.** 扩展管理页面：`HelloShortcutKey`\n\n**图 2-13.** `HelloShortcutKey`：后台页面\n\
    \n实际的 HTML 文件命名不同（见图 2-14）。\n\n**图 2-14.** `HelloShortcutKey`：后台页面\n\n## 后台脚本\n\
    \n事件脚本仅在被监听的事件被触发时持久存在。当事件未被触发时，Chrome 浏览器会使事件脚本处于非活动状态（请注意，这不会立即发生），如图 2-15 所示。\n\
    \n**图 2-15.** 扩展管理页面：`HelloShortcutKey`\n\n要使此脚本在浏览器打开期间持续存在，你需要通过在`manifest`中将`persistent`设置为`true`来将其标记为持久。此类事件脚本称为**后台脚本**。通常，你不需要在扩展中使用后台脚本。扩展框架中只有少数\
    \ API 调用需要后台脚本才能正确执行。本书中使用的大多数示例除非另有说明，否则仅使用事件脚本。\n\n**注意：** **不推荐**使用后台脚本。这是出于性能原因——它们会占用更多内存和其他系统资源。\n\
    \n## 事件对象\n"
- fmt: "# 排版后的文档\n\n在当前主题讨论的所有事件中，有一个共同点。它们都代表了扩展框架中的一个事件对象。*事件*是一个对象，允许您在发生某些有趣的事情时得到通知。以下是使用`chrome.alarms.onAlarm`事件在闹钟结束时得到通知的示例。\n\
    \n```javascript\nchrome.alarms.onAlarm.addListener(function(alarm) {\n  if(alarm.name\
    \ == \"A\") {/**/}\n  else if(alarm.name == \"B\") {/**/}\n  else {/**/}\n});\n\
    ```\n\n## 第二章 ■ 架构概述\n\n与 DOM API 类似，扩展框架中的事件也需要一个监听器函数，该函数使用`addListener`方法注册。不应将其与\
    \ DOM API 的`addEventListener`方法混淆。扩展框架中的每个 API（`browserAction`、`pageAction`、`commands`、`tabs`、`alarms`、`bookmarks`等）都会向监听器函数传递不同类型的参数。对于前面列出的示例，监听器接收一个`Alarm`类型的参数。\n\
    \n除了目前讨论的事件之外，扩展框架还提供了一个高级系统，用于根据某些自定义规则的匹配来执行操作。虽然这听起来类似于典型的事件和监听器模型，但并非如此。扩展框架中的这个高级功能被称为声明式事件处理器，并将在同名主题中讨论。\n\
    \n### 重新审视`onCommand`事件\n\n现在，您可以最终重新审视`HelloShortcutKey`扩展。要监听`onCommand`事件，首先需要在扩展文件夹中创建一个事件脚本。事件脚本可以任意命名，只要是一个有效的文件名即可。接下来，您需要在清单中列出该事件脚本。为此，您需要先定义`background`清单属性。\n\
    \n向此属性添加两个属性：`scripts`和`persistent`。如前所述，`scripts`属性接受一个数组作为其值。事件脚本将列在此数组中。对于此扩展，由于您不希望在浏览器打开期间让事件脚本持续存在（您只希望它们基于事件保持活动状态），您需要将`persistent`定义为`false`，如清单\
    \ 2-4 所示。\n\n当此扩展在浏览器中加载时，与事件脚本对应的*后台页面*将开始监听任何事件。要处理`onCommand`事件，您需要实现其监听器函数（参见清单\
    \ 2-5）。当定义的快捷键被调用时，*后台页面*将变为活动状态并执行监听器函数。一旦它进入空闲状态（参见图 2-11），它将变为不活动状态，从而也卸载所有关联的脚本（以节省内存和其他系统资源）。\n\
    \n## 声明式事件处理器\n\n在我们开始讨论声明式事件处理器作为基于自定义规则执行操作的高级机制之前，请将注意力转移到`HelloPageAction`扩展以显示页面操作。该扩展位于第二章的练习文件文件夹中。您可以在浏览器中加载它进行测试。\n\
    \n**清单 2-6.** 第二章/HelloPageAction/manifest.json\n\n```json\n{\n  \"manifest_version\"\
    : 2,\n  \"name\": \"HelloPageAction\",\n  \"description\": \"Extension to demonstrate\
    \ a Page-Action\",\n  \"version\": \"1.2\",\n  \"page_action\": {\n    \"default_title\"\
    : \"HelloPageAction\",\n    \"default_icon\": \"icon.png\",\n    \"default_popup\"\
    : \"popup.html\"\n  },\n  \"background\": {\n    \"scripts\": [\"event_script.js\"\
    ],\n    \"persistent\": false\n  },\n  \"permissions\": [\n    \"tabs\"\n  ]\n\
    }\n```\n\n### `HelloPageAction`扩展\n\n如清单 2-6 所示，除了声明和定义页面操作外，此扩展的清单还包含用于使用事件脚本的`background`清单属性的定义。除此之外，清单还包含用于使用`tabs`功能的`permissions`属性（您将在第三章中了解`permissions`属性）。为了使事件脚本仅在事件基础上活动，`persistent`被定义为`false`。\n\
    \n**清单 2-7.** 第二章/HelloPageAction/event_script.js\n\n```javascript\n//region {variables\
    \ and functions}\nvar consoleGreeting = \"Hello World! - from event_script.js\"\
    ;\nvar queryInfoForAllTabs = {\n  //\"active\":false,\"currentWindow\":true\n\
    };\n\nfunction logTabs(tabs) {\n  console.group(\"Tabs\");\n  console.log(tabs);\n\
    \  console.groupEnd(\"Tabs\");\n}\n\nfunction queryTabsAndShowPageActions() {\n\
    \  chrome.tabs.query(\n    queryInfoForAllTabs,\n    function(tabs) {\n      console.log(\"\
    All tabs length: %s\", tabs.length);\n      //Output tabs object to the console\
    \ as a separate visual group\n      logTabs(tabs);\n      if(tabs.length > 0)\
    \ {\n        for(var i=0; i<tabs.length; i++) {\n          chrome.pageAction.show(tabs[i].id);\n\
    \        }\n      }\n    }\n  );\n}\n//end-region\n```\n\n清单 2-7 和 2-8 包含了此扩展中使用的事件脚本的代码。函数`queryTabsAndShowPageActions`使用了`chrome.tabs.query`\
    \ API，根据对象`queryInfoForAllTabs`查询标签页，该对象作为第一个参数传递给`query`方法。此对象为空，以便使`query` API\
    \ 返回所有标签页。这在您的扩展中是必需的，以便在所有标签页上显示页面操作。\n\n`query`方法的第二个参数是一个回调函数，它接收`tabs`作为其第一个（也是唯一一个）参数。因为它是一个数组，所以您可以对其进行迭代。此数组中的每个元素都是`Tab`类型。在\
    \ Chrome 扩展框架中，每个标签页都使用此`Tab`类型表示。此类型有许多关联的属性，其中重要的包括`id`、`active`和`url`。\n\n\
    对于此扩展，您需要`id`属性来显示页面操作。页面操作通过调用`chrome.pageAction.show`方法显示在标签页中，该方法接受标签页的`id`作为其唯一参数。因此，在循环`for(var\
    \ i=0; i<tabs.length; i++)`内部，调用`show`方法来显示页面操作。\n\n**清单 2-8.** 第二章/HelloPageAction/event_script.js\n\
    \n```javascript\n//region {calls}\nconsole.log(consoleGreeting);\n//Show Page-Actions\
    \ using the chrome.tabs.query method\n//queryTabsAndShowPageActions();\n//Show\
    \ Page-Actions using the onUpdated event\nchrome.tabs.onUpdated.addListener(function(tabId,changeInfo,tab)\
    \ {\n  chrome.pageAction.show(tabId);\n});\n//end-region\n```\n\n然而，使用`queryTabsAndShowPageActions`函数有一个缺点。此函数只会被调用一次，即当事件脚本首次在浏览器中加载时。为了在每次打开（或更新）标签页时显示页面操作，这还不够。为此，您需要监听标签页上的一个事件——`onUpdated`事件。\n\
    \n此事件的使用在清单 2-8 中有所展示。对于此扩展，`queryTabsAndShowPageActions`函数调用已被注释掉。通过简单地监听`onUpdated`事件来显示页面操作。这样，每次标签页被更新（即打开或更新）时，监听器函数都会被调用，并为相应的标签页显示一个页面操作，其\
    \ ID 为`tabId`（监听器函数接收的参数，如清单 2-8 所示）。\n\n## `declarativeContent` API"
  raw: 'In all the events discussed in the current topic, one thing is common. They
    all represent an event object in the Extensions framework. An *event* is an object
    that allows you to be notified when something interesting happens. The following
    is an example of using the chrome.alarms.onAlarm event to be notified whenever
    an alarm has elapsed.


    chrome.alarms.onAlarm.addListener(function(alarm) {


    if(alarm.name == "A") {/**/}


    else if(alarm.name == "B") {/**/}


    else {/**/}


    });


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    Similar to the DOM APIs, the events in the Extensions framework also require a
    listener function, registered using the addListener method. It should not be confused
    with the addEventListener method of the DOM API. Every API in the Extensions framework
    ( browserAction , pageAction , commands , tabs , alarms , bookmarks , etc.) passes
    different kinds of arguments to the listener functions. For the example listed
    previously, the listener receives an argument of type Alarm .


    Aside from the events discussed so far, the Extensions framework also provides
    an advanced system for taking actions depending on (matching of ) certain custom
    rules.


    Although this sounds similar to the typical *events and listeners* model, it is
    not. This advanced feature in the Extensions framework is known as a *declarative
    event handler* and will be discussed in the following topic of the same name.


    Revisiting the onCommand Event


    Now you can finally revisit the HelloShortcutKey extension. To listen for the
    onCommand event, first you need to create an event script in the extension folder.
    An event script can be named anything you like, as long as it is a valid file
    name. Next, you need to list the event script in the manifest. For that, you first
    need to define the background manifest attribute.


    Add two properties to this attribute— scripts and persistent . As mentioned earlier,
    the scripts attribute takes an array as its value. The event script will be listed
    within this array. For this extension, since you don’t want the event script(s)
    to persist as long as the browser is opened (you only want them to stay active
    on an event basis), you need to define persistent as false , as display[ed in
    Listing 2-4 .](#index_split_000.html#p64)


    When this extension loads in the browser, the *background page* corresponding
    to the event script will start listening for any events. To handle the onCommand
    event, you need to implemen[t its listener function (see Listing 2-5 ). When the
    defined shor](#index_split_000.html#p66)tcut key(s) are invoked, the *background
    page* will become active and execute the listener function. It will be made inactive
    once it goes idle (see Figur[e 2-11 ), ther](#index_split_000.html#p71)eby also
    unloading all the associated scripts (to save memory and other system resources).


    Declarative Event Handlers


    Before we start the discussion on declarative event handlers as an advanced mechanism
    to take actions based on custom rules, divert your attention to the HelloPageAction
    extension to display Page-Actions. This extension is provided in Ch[apter 2 ’s](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)
    Exercise Files folder. You can load it in the browser for testing.


    ***Listing 2-6.*** Ch[apter 2 /H](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)elloPageAction/manifest.json


    {


    "manifest_version" : 2,


    "name" : "HelloPageAction",


    "description" : "Extension to demonstrate a Page-Action",


    "version" : "1.2",


    "page_action" : {


    "default_title" : "HelloPageAction",


    "default_icon" : "icon.png",


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    "default_popup" : "popup.html"


    },


    "background" : {


    "scripts" : ["event_script.js"],


    "persistent" : false


    },


    "permissions" : [


    "tabs"


    ]


    }


    The HelloPageAction Extension


    As display[ed in Listing 2-6 , apar](#index_split_000.html#p74)t from declaring
    and defining the Page-Action, the manifest for this extension also contains a
    definition for the background manifest attribute to use an event script. In addition
    to this, the manifest also contains the permissions attribute to use the tabs
    feature (you will read about the permissions attribute in Ch[apter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)
    ). To make the event script active only on an event basis, persistent is defined
    as false .


    ***Listing 2-7.*** Ch[apter 2](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)
    /HelloPageAction/event_script.js


    //region {variables and functions}


    var consoleGreeting = "Hello World! - from event_script.js";


    var queryInfoForAllTabs = {


    //"active":false,"currentWindow":true


    };


    function logTabs(tabs) {


    console.group("Tabs");


    console.log(tabs);


    console.groupEnd("Tabs");


    }


    function queryTabsAndShowPageActions() {


    chrome.tabs.query(


    queryInfoForAllTabs,


    function(tabs) {


    console.log("All tabs length: %s", tabs.length);


    //Output tabs object to the console as a separate visual group


    logTabs(tabs);


    if(tabs.length > 0) {


    for(var i=0; i<tabs.length; i++) {


    chrome.pageAction.show(tabs[i].id);


    }


    }


    }


    );


    }


    //end-


    region


    CHAPTER 2 ■ ARCHITECTURE OVERVIEW


    Listings [2-7](#index_split_000.html#p75) [and 2-8 con](#index_split_000.html#p76)tain
    the code for the event script used in this extension. The function queryTabsAndShowPageActions
    makes use of the chrome.tabs.query API to query the tabs based on the object queryInfoForAllTabs
    , which is passed as the first argument to the query method. This object is empty,
    so as to make the query API return all the tabs. This is required in your extension
    to show Page-Actions on all the tabs.


    The second argument of the query method is a callback function, which receives
    tabs as its first (and only) argument. Because it is an array, you can iterate
    over it. Every element in this array is of Tab type. In the Chrome Extensions
    framework, every tab is represented using this Tab type. This type has many properties
    associated with it, and the important ones include id , active , and url .


    For the purpose of this extension, you need the id property in order to show the
    Page-Action. Page-Action is displayed in a tab by calling the method chrome.pageAction.


    show , which takes the id of the tab as its only argument. So, inside the loop
    for(var i=0; i<tabs.length; i++) , the show method is called to display the Page-Action.


    ***Listing 2-8.*** Ch[apter 2 /H](http://dx.doi.org/10.1007/978-1-4842-1775-7_2)elloPageAction/event_script.js


    //region {calls}


    console.log(consoleGreeting);


    //Show Page-Actions using the chrome.tabs.query method


    //queryTabsAndShowPageActions();


    //Show Page-Actions using the onUpdated event


    chrome.tabs.onUpdated.addListener(function(tabId,changeInfo,tab) {


    chrome.pageAction.show(tabId);


    });


    //end-region


    However, there is one drawback to using the queryTabsAndShowPageActions


    function. This function will only get called once, i.e. when the event script
    first loads in the browser. In order to show Page-Action every time you open (or
    update) a tab, this will not suffice. For that, you need to listen for an event
    on the tabs—the onUpdated event.


    The use of this event is demonstrat[ed in Listing 2-8 . F](#index_split_000.html#p76)or
    the purpose of this extension, the queryTabsAndShowPageActions function call has
    been commented out. Page-Actions are displayed by simply listening for the onUpdated
    event. This way, every time a tab gets updated (i.e., opened or updated), the
    listener function will get called and will display a Page-Action for the corresponding
    tab, with an ID of tabId (the argument received by the listener function, as shown
    [in Listing 2-8](#index_split_000.html#p76) ).


