    var greeting = "Hello World!";


    var xhr = new XMLHttpRequest();


    function onReadyStateChange() {


    if(xhr.readyState == 4) {


    console.log(xhr.responseText);


    }


    }


    var host = "http://localhost/";


    var ucService = host + "Exercise Files/Chapter3/XHRAPI/webpage.php?"; var queryString
    = "name=" + encodeURIComponent("xhr api");


    //end-region


    //region {calls}


    console.log(greeting);


    xhr.onreadystatechange = onReadyStateChange;


    xhr.open("GET",ucService + queryString);


    xhr.send();


    //end-


    region


    The query string “name=xhr api” is provided in a static manner. It could be dynamically
    provided in your extension, for example, from a Browser-Action popup, or Content-UI,
    etc. Figur[e 3-37 sho](#index_split_001.html#p150)ws the corresponding response
    from the server.


