    \n### 创建 Chrome 扩展程序所涉及的组件\n\nGoogle Chrome 扩展程序与任何其他软件应用程序没有什么不同。您通过按钮（或快捷键等）等输入与其交互，它处理一些数据并显示结果。听起来很抽象，不是吗？好吧，其实不然。您很快就会明白。\n\
    \n与其他应用程序开发框架类似，Google Chrome 扩展程序框架为其开发者提供了提供用户界面以及诸如存储、消息传递、网络请求等功能的技术。以下是用于创建\
    \ Chrome 扩展程序的组件。\n\n© Prateek Mehta 2016\nP. Mehta，《创建 Google Chrome 扩展程序》，DOI\
    \ 10.1007/978-1-4842-1775-7_2\n\n![](img/index-53_1.jpg)\n\n#### 输入组件\n\n提供交互功能，由用户界面/非用户界面输入元素组成，例如工具栏按钮、快捷键、上下文菜单项等。Chrome\
    \ 扩展程序提供以下输入组件（见图 2-1）：\n\n- `Browser-Action`\n- `Page-Action`\n- `Shortcut-Key`\n\
    - `Context-Menu-Item`\n- `Omnibox-Input`\n- `Content-UI`\n\n**图 2-1. 用于创建 Chrome\
    \ 扩展程序的输入组件**\n\n#### 脚本组件\n\n顾名思义，这些组件是包含应用程序逻辑的脚本，当用户与扩展程序交互时，这些逻辑可能在不同时间需要。有三种类型的脚本组件：\n\
    \n- *事件脚本（后台脚本）*\n- *弹出窗口脚本*\n- *内容脚本*\n\n> **注意：** 每种*类型*的脚本组件都有自己独立的*作用域*。因此，例如，弹出窗口脚本不能使用事件脚本中定义的变量和函数，反之亦然。这同样适用于其他脚本对——内容脚本和弹出窗口脚本，以及内容脚本和事件脚本。脚本之间能够访问彼此数据（变量、函数等）的唯一方式是通过*消息传递*，您将在下一章中学习到。\n\
    \n![](img/index-54_1.jpg)\n\n#### 弹出窗口组件\n\n弹出窗口是一个特殊的（可选的）视图，仅对 `Browser-Action`\
    \ 和 `Page-Action` 输入组件可用。弹出窗口完全由一个 HTML 页面构成（见图 2-2 和 2-3）。请注意，弹出窗口*仅*在用户单击与 `Browser-Action`\
    \ 或 `Page-Action`（取决于扩展程序使用的是哪一个）对应的工具栏按钮时才会出现。是的，您猜对了——弹出窗口脚本是与弹出窗口组件一起使用的。\n\
    \n**图 2-2. 一个 Browser-Action 弹出窗口**\n\n![](img/index-55_1.jpg)\n\n**图 2-3. 一个\
    \ Page-Action 弹出窗口**\n\n弹出窗口脚本是普通的 JavaScript 文件。因为它们用于弹出窗口中，所以被称为弹出窗口脚本。请注意，弹出窗口脚本的代码*不能*内联到弹出窗口的\
    \ HTML 页面中。脚本内联意味着将 JavaScript 代码直接放置在 `<script>` 标签内，例如 `<script>alert('Hello\
    \ World');</script>`。\n\n因此，弹出窗口脚本只能被引用，其中 `src` 需要指向相对于扩展程序文件夹的路径，例如 `<script\
    \ src=\"popup_script.js\"></script>`。并且，是的，可以引用多个弹出窗口脚本（见清单 2-1）以使代码模块化。这些脚本在扩展程序加载（到浏览器中）时不会合并，并且可以在\
