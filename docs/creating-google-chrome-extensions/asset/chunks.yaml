    Revisiting Content-UI


    In the previous chapter, you learned how to create a Content-UI. But you did not
    learn how exactly it might be used or interacted with, apart from simply staying
    as a static content on the web page (see Figure 2-19) it is injected into. You
    will examine its use with the help of the HelloContentUI extension, which is provided
    in Ch[apter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3) ’s Exercise Files
    folder. In this extension, Content-UI is used to display the Page-Action component.


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    ■ **Note** The accompanying source code for this book is available (for free)
    in the Downloads section a[t http://www.apress.com/9781484217740](http://www.apress.com/9781484217740)
    .


    The HelloContentUI Extension


    This extension contains a content script component that is injected into the visited
    web pages belonging to the example.org host, as inferred from the matches attribute
    in its manifest, [which is in Listing 3-6](#index_split_000.html#p107) . In addition
    to this, it also contains a Page-Action and an event script component (see Figur[e
    3-12 ). N](#index_split_000.html#p106)ote the use of activeTab permission to only
    interact with the currently active tab (in this case, via the content script component).


    ***Listing 3-6.*** Ch[apter 3 /H](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)elloContentUI/
    manifest.json


    {


    "manifest_version" : 2,


    "name" : "HelloContentUI",


    "description" : "Show Page-Action using Content-UI",


    "version" : "1.2",


    "page_action" : {


    "default_title" : "HelloContentUI",


    "default_icon" : "icon.png",


    "default_popup" : "popup.html"


    },


    "background" : {


    "scripts" : ["event_script.js"],


    "persistent" : false


    },


    "permissions" : [


    "activeTab"


    ],


    "content_scripts" : [


    {


    "matches" : ["*://www.example.org/*"],


    "js" : ["content_script.js"]


    }


    ]


    }


    ![](index-108_1.jpg)


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    ***Figure 3-13.** HelloContentUI: Injected content script component*


    ***Listing 3-7.*** Ch[apter 3](http://dx.doi.org/10.1007/978-1-4842-1775-7_3)
    /HelloContentUI/ content_script.js


    //region {variables and functions}


    var consoleGreeting = "Hello World! - from content_script.js";


    var requestMessage = {"data":"Test message X"};


    var responseCallback = function(responseMessage) {


    console.log("responseMessage: " + responseMessage.data);


    };


    function createButton() {


    var button = document.createElement("button");


    button.style.width = "70px";


    button.style.height = "40px";


    button.style.position = "fixed";


    button.style.top = "10px";


    button.style.right = "10px";


    button.innerText = "Send Message";


    document.body.appendChild(button);


    return button;


    }


    //end-region


    CHAPTER 3 ■ API AVAILABILITY AND MESSAGING


    //region {calls}


    console.log(consoleGreeting);


    var button = createButton();


    button.addEventListener("click",function() {


    console.log("Button clicked!");


    chrome.runtime.sendMessage(/*extensionId,*/


    requestMessage,


    responseCallback


    );


    });


    //end-


    region


    As displayed in Figur[e 3-13](#index_split_000.html#p108) , the content script
    component ( content_script.js ) is used to create a button element (“Send Message”)
    into the web page it is injected into.'
