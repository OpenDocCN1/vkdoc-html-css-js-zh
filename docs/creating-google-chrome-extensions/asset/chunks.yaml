    \n***图 2-8.** 具有自定义快捷键的 HelloShortcutKey 扩展*\n\n## `onCommand`事件\n\n为扩展定义了快捷键后，您可以通过监听`onCommand`（`chrome.commands.onCommand`）事件来实现其监听器函数。\n\
