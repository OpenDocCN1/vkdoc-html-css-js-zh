    \n## 第 2 章：架构概览\n\n本章从用户和开发者的角度描述 Chrome 扩展程序的架构。这样做将帮助您快速掌握用于创建 Chrome 扩展程序的各种组件。阅读完本章后，您将像用户一样理解\
