    \n### 什么是用户视角？\n\n一个 API（在我们的案例中，是 Google Chrome 扩展程序 API）可以从提供各种功能（如用户界面、存储等）所涉及的内部技术角度来理解，也可以从交互功能角度——具体到需要用于访问这些功能的技术——来理解。后者，即根据扩展程序\
