    # 添加和移除网址


    要在当前时间向历史记录中添加一个网址，请使用 `chrome.history.addUrl` 方法。


    该方法接受两个参数：`details`（类型为 `object`）和 `callback`（类型为 `function`）。`details` 对象仅支持
    `url` 属性。类似地，使用 `chrome.history.deleteUrl(object details, function callback)`
    方法可从历史记录中移除指定网址的所有出现记录。请注意，要清除所有历史记录项，需使用 `chrome.history.deleteAll` 方法。该方法仅接受一个
    `callback` 函数作为参数。


    *图 3-37.* XHRAPI：记录响应


    ## 关联事件


    历史记录 API 支持 `onVisited` 和 `onVisitRemoved` 事件。当访问某个网址时，会触发 `onVisited` 事件，并在相应的监听函数中提供该网址的
    `HistoryItem` 数据。请注意，此事件在页面加载完成之前触发。


    类似地，当一个或多个网址从历史记录服务中移除时，会触发 `onVisitRemoved` 事件。该事件对应的监听函数接收一个对象。


    该对象支持以下属性：


    - **allHistory** (`Boolean`) - 如果移除了所有历史记录，则为 `True`。若为 `true`，则 `urls` 将为空。

    - **urls** (`array`) - 被移除的 `String` 类型网址数组。


    # 通知 API


    您可以使用 `chrome.notifications` API 通过模板创建丰富的通知，并在系统托盘中向用户显示这些通知。它需要使用 `notifications`
    权限。*代码清单 3-27* 包含了来自第 3 章练习文件文件夹中 NotificationsAPI 扩展的代码。


    ***代码清单 3-27.*** 第 3 章 /NotificationsAPI/ event_script.js


    ```

    //region {variables and functions}


