    While inspecting the popup, sometimes, popup script(s) might not appear in the
    `Sources` panel. To correct this, all you need to do is reload the DevTools window
    (while staying inside the DevTools window).


    ## Manifest Component

    Every extension has a JSON-formatted manifest file named `manifest.json`, and
    it provides important information about the extension to the Chrome browser. To
    facilitate that purpose, you need to declare the features your extension is going
    to use (such as the kinds of inputs—Browser-Action, Shortcut-Key, etc.) and define
    their corresponding values in the manifest.


    In addition to this, the Google Chrome Extensions framework provides a whole slew
    of APIs that you can use to access useful functionalities of the Chrome browser,
    such as `bookmarks`, `tabs`, `history`, etc. And in order to use these, you need
    to *declare* their usage in the manifest also. More details on the manifest follow
    in the upcoming topics in this chapter.


    At the time of writing this book, to create the simplest valid Google Chrome Extension
    (that does nothing), the only requirement is a folder with a manifest file that
    contains the following required attributes (also discussed in Chapter 1).


    - `manifest_version` — Indicates the version of the manifest file format (at the
    time of writing, it is 2)

    - `name` — Indicates the name of the extension, for example `HelloBrowserAction`

    - `version` — Indicates the version of the extension, for example `1.2`


    ## Extension Runtime

    In this section you learn about Extensions development from the developer’s point
    of view. Specifically, you will learn about the *extension runtime* (not to be
    confused with the actual runtime API provided by the Extensions framework, i.e.,
    the `chrome.runtime` API).


    By now you understand that an extension’s logic is written in JavaScript. And
    given the event-driven nature of JavaScript, you might be wondering about the
    extension lifecycle. For example, considering the various input components used
    to create extensions, you might wonder about listening to events fired from these
    inputs, and then responding accordingly.


    Every input component in the Extensions framework (with the exception of ContentUI)
    has some associated events (for example, Browser-Action and Page-Action input
    components have the following events associated with them respectively—the `chrome.browserAction.onClicked`
    event and the `chrome.pageAction.onClicked` event). And to listen to these events,
    you need to attach *listener* functions. These functions are created (and assigned
    to events) within the scripting components that represent the extension runtime.


    So, when an extension is loaded in the browser, the manifest is first read for
    providing permission(s) to access certain APIs (such as the `tabs` API). Then,
    the views and scripts get loaded. And finally, listener functions are assigned
    to input components.


    Note that the extension itself has some events associated with it (for example,
    `onMessage`, `onInstalled`, etc.), and listener functions can also be assigned
    to these events by the scripting components that represent the extension runtime.
    Now, you may ask which scripting components represent the extension runtime. The
    following topic provides the answer to this question.


    # Note

    The extension itself has many events associated with it. These events are properties
    of the `chrome.runtime` (API) object. Following are some of the most useful events
    associated with the extension— `onMessage`, `onConnect`, `onConnectExternal`,
    `onInstalled`, and `onUpdateAvailable`.


    ## Scripts Representing the Runtime

    In a loaded extension, the scripts (scripting components) that can listen for
    events fired from the input components, or other things that happen to an extension,
    represent the extension runtime. These scripts include the popup script and the
    event script. But because a popup script is only executed when a popup is opened,
    you will rely more on the event script in your extension (which is a long-running
    script in the background) to listen for each and every event (fired from any input
    component, or fired from the extension itself, including those that are fired
    when an extension installs, uninstalls, updates, etc.).


    The script that does not represent the extension runtime is the content script.


    And obviously, the web pages loaded in the browser can never represent the extension
    runtime. But, as you will see in Chapter 3, web page scripts can still interact
    with the extension runtime and with the content scripts (using the messaging APIs).


    # Note

    Content scripts (a type of scripting component that is injected into the visited
    web pages) have very limited access to the Chrome Extensions API, because they
    do not represent the extension runtime. They can only access the following APIs—
    `chrome.runtime`, `chrome.extension`, and `chrome.storage`. But content scripts
    have access to all the standard JavaScript APIs that regular web page scripts
    do. Additionally, they can interact with the extension runtime (using the messaging
    APIs).


    ## Input Components: Part One

    Input components are the *interactive functionalities* offered by the Google Chrome
    Extensions framework. Extensions do not heavily rely on inputs. But they are crucial,
    as these are the entry points to the extensions’ core logic. For example, consider
    an extension that searches for a word in URLs from all opened tabs and returns
    matched URLs. For that it is required that the extension at least provide a toolbar
    button (i.e., a Browser-Action or Page-Action, as described next), which upon
    being pressed, displays a popup with text field to enter the word to be searched.
    Similar to this scenario, there are many other ways in which an extension will
    rely on one or more input components to trigger certain responses (from the scripting
    components) or to simply display the popup.


    # Note

    *Most* of these input components can be combined in a single extension. For example,
    the Google Dictionary (by Google) extension uses Browser-Action, Content-UI (where
    events are attached to document content), and Shortcut-Key as input components.


    So, now you understand what inputs are. Let’s learn more about them, including
    how are they used, and how to declare and define them in the manifest. Let me
    also reiterate that the manifest is the place where you declare the features your
    extension is going to use and define their corresponding values.


    But before moving ahead, keep in mind that fully functional extensions can be
    created *without* any input components. For example, an extension that automatically
    sends the details of the visited web pages to an HTTP server. In addition to this
    example, *themes* that are created for the Chrome browser are also created without
    any input components. As a matter of fact, themes are solely created using a manifest
    component (and some images). Besides, a theme is an extension too! You learned
    to create themes in the last chapter.


    ## The Browser-Action and Page-Action Components'
