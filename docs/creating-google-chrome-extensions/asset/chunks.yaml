    method callback if there was an error.


    ### BrowserActionNotes Extension


    This extension allows taking notes on all visited web pages. It uses a `BrowserAction`
    input component (as displayed in [Figure 2-20](#index_split_000.html#p86)) and
    a popup component ([Figure 2-21](#index_split_000.html#p86)) with a popup script.
    By now you understand that the manifest component is mandatory for every extension.
    Note that this extension only allows saving one note for a URL. The note can be
    overwritten or completely removed from the storage.


