- "# 2. 使用箭头函数的 Lambda 表达式\n\n函数在 JavaScript 中无处不在。长期以来，人们一直需要对它们进行语法整容，使其更简洁，从而更易于使用和理解。\n\
  \nJavaScript 本质上是一种函数式编程语言。它支持函数作为一等公民，这意味着函数就像语言中的任何其他类型一样。函数可以赋值给变量，作为参数传递给其他函数，并且可以像\
