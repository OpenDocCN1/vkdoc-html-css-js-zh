- "# 4. 使用对象和数组解构分而治之\n\nJavaScript 允许我们使用对象和数组轻松创建“数据包”，使我们能够流畅地封装数据并在代码中传递。然而，我们用来“触及”这些数据结构的语法往往冗长、命令式且容易出错。在\
  \ ES6 和 ES9 中，JavaScript 采用了另一种函数式构造——解构语法，以改善我们解包数据的体验，使其与我们最初封装数据的方式达到一致。\n\n\
  在本章中，我们将了解对象和数组的新解构语法如何提供一种优雅的机制来访问数据结构。我们还将学习将其与我们已掌握的默认参数和剩余参数知识相结合，并了解这两个特性如何协同工作，以定义能清晰表达其预期同时更灵活的函数。在本章结束时，我们将能够使用清晰、简洁且极具表现力的语法安全地查询对象和数组，同时改善我们详细描述函数签名的方式。\n\
  \n\n\n## 在结构化与解构之间寻求对称性\n\nJavaScript 为我们提供了两种类似集合的对象——数组和键值对对象。^(²⁵) 使用 `Object`\
  \ 构造函数、`Object.create` 或字面量对象语法（即 `{}`）创建的对象都是 `Object` 的实例。它们可以被视为关联数组或字典对象。对象本质上是一组键值对。如果要求对象查找某个键的值，它将返回与该键关联的值，如果该键在对象中不存在，则返回\
  \ `undefined`。\n\n另一方面，数组提供了一种顺序数据结构，具有高效的随机元素查找功能。JavaScript 中的数组是 `Array` 类型的实例，它们同样具有关联性，只不过它们的键是整数，并且只能是作为它们所指向条目的索引的整数。\n\
  \n对象和数组都为我们提供了*“深入”*访问它们的方式。对象提供了“点”表示法，允许我们获取自身内部某个键关联的值，以及“括号”（或“下标”）表示法（即 `[]`）也能达到同样效果。而数组只提供括号表示法作为在数组中*特定*索引处查找元素的手段。与对象非常相似，查找数组中**不**存在的索引会返回\
  \ `undefined`。\n\n对象和数组都可以嵌套，通常相互嵌套。这可能导致相当复杂的查找，迫使开发者内联变量来解释他们试图实现的目标。请看：\n\n-\
  \ ① 使用明显的语法\n- ② 重构代码以使意图更清晰\n- ③ 如果地址对象**没有** `zip` 属性会发生什么？\n\n```\nconst user\
  \ = {\n  name: 'douglas',\n  profession: 'developer',\n  address: {\n    street1:\
  \ '1 Ad Infinitum Drive',\n    street2: '',\n    city: 'Cupertino',\n    state:\
  \ 'CA',\n    zip: [\n      '95014',\n      '1234',\n    ],\n  },\n};\nconst zipCode\
  \ = user.address.zip[0] + '-' + user.address.zip[1]; ①\nconsole.assert(zipCode ===\
  \ '95014-1234');\n// 重构后的版本\nconst zip = user.address.zip; ②\nconst code = zip[0];\
  \ ③\nconst extended = zip[1];\nconst final = code + '-' + extended;\nconsole.assert(final\
  \ === '95014-1234');\n```\n\n思考一下，如果我们没有创建原始对象，而是获得了它的一个引用，我们如何确定其结构。我们必须进行一些脑力体操，通过逆向解析查找过程来“重建”原始对象的结构。当函数期望接收一个对象或数组时，这更加令人沮丧——作为调用者，如果不查看函数实现或阅读文档，根本无法判断该函数真正关心参数的哪些“部分”。\n\
  \n雪上加霜的是，这种语法在沿途并没有提供任何 `undefined` 检查机制！如果中间某个属性的查找失败，这种失败会级联影响到所有依赖该属性值的内容。一些语言提供了“安全导航”运算符，或者在查找失败时设置默认值的方式，但可惜的是，JavaScript\
  \ 对这两种方式都不支持。\n\n核心问题在于我们定义对象和数组（创建*结构*）的方式与访问它们（*解构*它们）以获取特定值的方式之间缺乏对称性。如果查找语法能够镜像构造语法，那么“重新组装”原始对象（或数组）将变得轻而易举，因为赋值语句的左侧将和右侧一样具有表现力。\n\
  \n解构支持缺失的另一个方面是无法展开或“打散”对象；换句话说，就是获取集合中的**所有**条目，无论是数组的元素还是对象中的键值对。开发者不得不强行遍历整个集合，无论是显式地使用\
  \ `for` 循环，还是隐式地使用像 `forEach` 这样的方法，这两者都有很大的改进空间。\n\n进入展开运算符和新的解构语法。我们将从展开运算符开始，然后是解构语法。\n\
  \n## 数组的展开运算符\n\n考虑一个简单的用例——一个计算三角形周长的函数和一个存储各边边长的数组。让我们看看如何将两者结合使用：\n\n- ① 我们从一个数组开始\n\
  - ② 我们提取数组中的每一个元素提供给函数\n\n```\nconst perimeter = (a, b, c) => a + b + c;\nconst\
  \ sides = [9, 8, 3]; ①\n// 打印 20\nconsole.log(perimeter(sides[0], sides[1], sides[2]));\
  \ ②\n```\n\n鉴于函数期望三个参数，我们被迫使用下标表示法从数组中分解出这些值。这感觉很繁琐。理想的情况是我们可以将数组的各个元素作为参数“应用”到函数中。\n\
  \n好吧，现在我们可以了！我们现在可以使用展开运算符，它通过 `...` 语法来表达。观察同样的例子是如何变成下面这样的：\n\n- ① 我们从一个数组开始\n\
  - ② 我们使用展开运算符将数组的所有元素提供给函数\n\n```\nconst perimeter = (a, b, c) => a + b + c;\nconst\
  \ sides = [9, 8, 3]; ①\n// 打印 20\nconsole.log(perimeter(...sides)); ②\n```\n\n演示的展开运算符语法使用\
  \ `...` 作为其语法结构。它接收一个数组，并将其“展开”为独立的元素，将每个元素作为单独的参数传递给函数。这立即消除了我们必须使用下标语法强制提取元素的需要。\n\
  \n在我们的代码中有几个地方允许使用展开运算符——首先，正如我们所见，是在函数调用时，其次，是在数组构建时，我们将在下一节中看到。\n\n\n\n### 深入解析`展开操作符`的微妙之处\n\
  \n最好先单独研究展开操作符。以我们的老朋友`console.log`为例。`log`是一个多参数函数，即给定`n`个参数时，它会将每个值用空格分隔后写入控制台。我们直接用其来观察展开操作符的效果：\n\
  \n-   ① 从一个数组开始\n-   ② 直接打印数组——显示`[ 12, -3, 15, 44, 15, 36 ]`\n-   ③ 使用展开操作符——显示`12\
  \ -3 15 44 15 36`\n-   ④ 用`console.log`模拟展开操作符的工作方式\n\n```\nconst arr = [12, -3,\
  \ 15, 44, 15, 36]; ①\n// 打印 '[ 12, -3, 15, 44, 15, 36 ]'\nconsole.log(arr); ②\n\
  // 打印 '12 -3 15 44 15 36'\nconsole.log(...arr); ③\n// 要实现与使用展开操作符相同的结果\nlet temp\
  \ = \";\nfor (const i in arr) {\ntemp += arr[i];\nif (i != (arr.length - 1)) {\n\
  temp += ' ';\n}\n}\nconsole.assert(temp === '12 -3 15 44 15 36'); ④\n```\n\n我们可以得出结论：将数组作为参数调用`console.log`实际上是只传递了**一个**参数。然而，使用展开操作符作用于数组进行调用时，则会传递`n`个参数，其中`n`是数组的长度。\n\
  \n当我们思考如何将数组的*每个*元素打印为一个空格分隔的字符串时，对比会更加明显。如果没有展开操作符，我们别无选择，只能强制性地遍历数组，每次拼接到临时字符串中，然后将该字符串传递给`console.log`。\n\
  \n展开操作符使我们能够从命令式思维（我们的意图常常迷失在`for`循环和固定模式中）转变为以清晰的方式表达意图。\n\n展开操作符的一个普遍用例是连接数组。请记住，数组有一个`push`方法，用于将元素添加到数组末尾。事实证明，`push`也是一个多参数函数。然而，与某些`Math`操作符和`console.log`类似，如果要将一个数组的所有元素连接到另一个数组，此方法几乎无用。^(²⁶)\n\
  \n展开操作符的另一个用例是从现有数组创建新数组。现在我们研究这两个用例：\n\n-   ① 使用展开操作符将数组复制到新数组\n-   ② 从三个数组开始\n\
  -   ③ `push`会原地修改数组\n-   ④ 创建一个连接了元素和一个数组的*新*数组\n-   ⑤ 创建另一个连接了两个数组的数组\n\n```\n\
  const one = [12, -3, 15];\nconst otherOne = [...one]; ①\nconst two = [44, 15, 36];\
  \ ②\n// 修改操作\none.push(...two); ③\nconsole.log(one);\n// 或者内联进行连接\nconst concatenated\
  \ = [12, -3, 15, ...two]; ④\n// 打印 '[ 12, -3, 15, 44, 15, 36 ]'\nconsole.log(concatenated);\n\
  // 创建一个新数组\nconst newArr = [...otherOne, ...two]; ⑤\n// 打印 '[ 12, -3, 15, 44, 15,\
  \ 36 ]'\nconsole.log(newArr);\n```\n\n我们从数组开始，通过将第一个数组展开到新数组的字面量表示法（`[]`）中来创建新数组。换句话说，`otherOne`是一个新数组，包含与初始数组相同的元素。\n\
  \n与`console.log`一样，`Array`上的`push`方法恰好是一个多参数方法。因此，我们可以再次使用展开操作符，轻松地将一个数组中的多个元素推入另一个数组。但是，`push`会执行修改操作，即它会改变原数组。然而，函数式编程鼓励不可变性，如果这是*我们的*意图，那么展开操作符便是盟友。^(²⁷)\n\
  \n展开操作符的一个微妙之处在于它**不**执行“扁平化”操作。如果我们展开一个数组的数组，最终结果将是各个组成数组。展开操作符不会递归地展开嵌套数组。\n\n\
  使展开操作符工作的底层机制依赖于数组是“可迭代的”。我们稍后会介绍可迭代对象和迭代器；不过可以这么说，数组遵循迭代器协议，因此可以在展开操作符中使用。字符串、Map\
  \ 和 Set（我们很快也会看到它们）也是可迭代的，因此可以被展开。^(²⁸)\n\n使用展开操作符构建新数组的最大好处往往也是最容易被忽视的一点，即它的语法迫使我们将现有数组展开到一个新数组中。我们可以通过将现有数组`push`到一个空数组上来实现相同的行为，但这并非`push`\
  \ API 的意图。相反，它的意图是修改现有数组，这与函数式编程的原则背道而驰。\n\n#### 展开与剩余——极性相反的双胞胎\n\n读者会注意到剩余参数和展开操作符的语法相同，但它们的行为却完全相反。剩余参数将提供给函数的所有未说明参数“收集”*到*一个数组中，而展开操作符则将数组中的所有元素提取*出来*。`...`语法的作用取决于调用上下文。`...`仅在发生赋值时充当剩余参数，否则，它充当展开操作符。这种矛盾既有趣又令人不安：\n\
  \n-   ① 在将整个数组附加到返回值之前，先对剩余参数进行排序\n-   ② 对剩余参数进行排序，并将其展开以将其元素附加到返回值中\n\n```\nconst\
  \ onlyRest = (teacher, ...students) => {\nreturn [teacher, students.sort()]; ①\n\
  };\nconst restAndSpread = (teacher, ...students) => {\nreturn [teacher, ...students.sort()];\
  \ ②\n};\n// 打印 '[ 'Ada', [ 'Carol', 'Grace', 'Mary' ] ]'\nconsole.log(onlyRest('Ada',\
  \ 'Mary', 'Carol', 'Grace'));\n// 打印 '[ 'Ada', 'Carol', 'Grace', 'Mary' ]'\nconsole.log(restAndSpread('Ada',\
  \ 'Mary', 'Carol', 'Grace'));\n```\n\n我们首先定义两个多参数函数，都期望接收教师姓名，后跟 n 个学生姓名。由于两个函数都声明了一个剩余参数，教师之后的所有参数都会自动打包到一个数组中。两个函数在构建返回值之前，也会对`students`数组进行`sort`排序，返回值也是一个数组。然而，实现方式在此处出现了分歧。对于第一个函数，我们简单地用一个包含教师姓名的数组以及`sort`排序学生数组（返回一个数组）的结果构建一个新数组。结果正如预期，是一个包含两个元素的数组——教师姓名，后跟一个包含排序后学生姓名的数组。\n\
  \n然而，在第二种情况下，我们将`sort`的结果*展开*到返回值中，从而直接返回一个字符串数组，以教师姓名开头，后跟按字母顺序排序的学生姓名。两种实现之间的差异很微妙，但效果却大相径庭。\n\
  \n我们还会看到剩余参数适用的另一个场景，即数组解构——但首先，来看看对象的展开。\n\n## 对象的展开操作符\n\n在 ES9 中引入，`…`操作符也可用于“展开”对象。与我们看到的用于索引集合的`…`操作符非常相似，`…`操作符会将对象“展开”为其各个键值对。然而，在深入探讨展开对象的细节之前，我们必须先讨论对象属性的特性，特别是`enumerable`描述符。\n\
  \n\n\n### `Object.defineProperties`\n\nJavaScript 开发者习惯于使用 `{}` 语法直接创建对象，并随意添加键值对。这些键默认是可枚举的，也就是说，如果使用\
  \ `for-in` 循环遍历对象中的键，它们都会被列出。\n\n同时，`Object` 类也为我们提供了多种（编程式的）机制来创建对象，以及配置它们的便利方法。其中一个\
  \ API 是 `defineProperties`，它可以与一个“描述符”对象一起使用，为现有对象定义函数，甚至 getter/setter。^(²⁹) `Object.defineProperties`\
  \ 的作用是使用描述符向现有对象（以下简称“目标”）注入属性。\n\n描述符充当一个占位符，用于包含我们想要引入到目标对象的每个键的配置。描述符对象是一个普通的\
  \ JavaScript 对象，它的键将被安装到目标对象上。让我们通过一个简单的例子来看看它的用法：\n\n- ① 使用目标对象和描述符对象调用 `defineProperties`\n\
  - ② 使用 `value: 'Michelle'` 定义 `name` 键\n\n```\nconst michelle = {};\nObject.defineProperties(michelle,\
  \ { ①\nname: {\nvalue: 'Michelle', ②\n},\nhobby: {\nvalue: 'Gardening',\n},\n});\n\
  // 输出 'Michelle'\nconsole.log(michelle.name);\n// 输出 'Gardening'\nconsole.log(michelle.hobby);\n\
  ```\n\n第一个参数是我们想要修改的对象，第二个参数恰好是描述符对象，我们可以看到它是一个包含两个键的 JavaScript 对象。描述符对象中每个键的值就是该属性的配置，并决定了它在目标对象中的形式。也就是说，我们要求\
  \ `defineProperties` 在目标对象上安装两个属性，即 `name` 和 `hobby`，以及它们各自的值。\n\n前面提到的这个 `value`\
  \ 属性**并非**任意指定的；它是我们允许使用的少数几个成员之一，详情见 [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperties`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperties)。这些属性不仅允许我们在目标对象上定义一个结果属性作为值（记住，在\
  \ JavaScript 中函数也是值），还允许定义 getter/setter，以及控制键是否为 `enumerable`、`writable` 和 `configurable`。\n\
  \n其中，`enumerable` 对于我们即将讨论的 `Object.assign` 特别重要，所以让我们花点时间探讨它的用法和含义。就像我们使用描述符对象为某个键设置\
  \ `value`，并通过 `Object.defineProperties` 安装它一样，我们也可以提供 `enumerable` 设置。如果在描述符对象中没有将\
  \ `enumerable` 设置与 `value` 键一起提供，其默认值为 `false`。这与直接创建的对象（`{}`）中键的默认设置（我们已讨论过，默认为\
  \ `true`）形成鲜明对比。这意味着，如果我们要遍历结果对象的键，使用描述符对象创建的任何属性都**不会**出现，除非我们*显式*地将 `enumerable`\
  \ 属性设置为 `true`：\n\n- ① 将 `enumerable` 键设置为 `true`\n- ② 由于此处未设置 `enumerable`，它默认为\
  \ `false`\n- ③ 只有 `name` 会显示出来\n\n```\nconst michelle = {};\nObject.defineProperties(michelle,\
  \ {\nname: {\nvalue: 'Michelle',\nenumerable: true, ①\n},\nhobby: {\nvalue: 'Gardening',\
  \ ②\n},\n});\nfor (const k in michelle) {\nif (Object.prototype.hasOwnProperty.call(michelle,\
  \ k)) {\n// 只输出 'name'\nconsole.log(k); ③\n}\n}\n```\n\n这里需要注意的是，任何没有设置 `enumerable`\
  \ 属性的属性对于 `for-in` 循环都是*不可见*的。如果我们希望所有键都可见，直接使用对象字面量语法创建对象就可以了！也就是说，`Object.defineProperties`\
  \ 的作用是让我们能够*限制*外界如何看待或影响我们对象中的键。\n\n回到正题，设置某些键的可枚举性会影响任何需要查询对象键的算法，例如 `JSON.stringify`，以及\
  \ ES6 引入的两个新功能：新增的 `Object.assign` 和对象展开运算符。\n\n我们将在后续章节中分别介绍 ES6 引入的 `Object.assign`\
  \ 和 ES9 引入的对象展开运算符。乍看之下，它们做的事情相似，但正如我们将看到的，它们的意图截然不同。\n\n### `Object.assign`\n\n\
  ES6 提供了 `Object.assign`，作为一种将一个对象的所有可枚举键复制到另一个对象的方法。`assign` 接受一个“目标”对象，后跟任意数量的“源”对象，并将源对象的所有*可枚举*键复制到目标对象上。考虑以下示例：\n\
  \n- ① 使用对象字面量初始化一个对象\n- ② 使用 `Object.assign` 创建一个新对象，合并所有源对象\n\n```\nconst michelle\
  \ = { ①\nname: 'Michelle',\nhobby: 'Gardening',\n};\nconst rachael = Object.assign({},\
  \ michelle, { ②\nname: 'Rachael',\nprofession: 'Auditor',\n});\n// 输出 '{ name: 'Rachael',\
  \ hobby: 'Gardening', profession: 'Auditor' }'\nconsole.log(rachael);\n```\n\n我们首先使用字面量创建了一个包含两个键的对象。回想一下，对象上定义的所有此类属性默认都是可枚举的。如果使用\
  \ `Object.defineProperties` 并将每个键的 `enumerable` 描述符设置为 `true`，我们也可以达到同样的效果。\n\n\
  接着，我们调用 `Object.assign`，传入一个（空的）目标对象，以及 `michelle` 和另一个（内联的）对象字面量。这里需要注意的是，`michelle`\
  \ 和内联对象都有一个同名的属性，即 `name`。因此，如果要将二者都复制到同一个对象上（按从左到右的顺序），那么最后一个覆盖前面的，对吧？\n\n正如 `console.log`\
  \ 所示，克隆对象确实包含了各个源对象中属性的并集。*然而*，`name` 的值是 `Rachael`，这告诉我们属性确实是按照从左到右的顺序复制的；换句话说，作为源对象传入的\
  \ `michelle` 和内联对象拥有相同的属性，但后者胜出。\n\n可以将 `Object.assign` 理解为将源对象“展开”到目标对象中，如果发生键冲突，则后者的值胜出。此外，我们可以巧妙地利用这一点，通过指定一个空对象作为目标，从现有对象创建新对象，如示例所示。\n\
  \n表面上，`Object.assign` 对对象的作用类似于展开运算符对可迭代对象的作用——它可以帮助将一个对象的键值对“展开”到另一个对象中。然而，它在两个方面有所不足——展开对象的机制（`Object.assign`）和展开可迭代对象的机制（展开运算符）并不对等，因为它们的语法不同。其次，`Object.assign`\
  \ 之于对象，犹如 `Array.push` 之于数组，它们都会*改变*目标对象。诚然，我们可以提供一个空对象作为目标，但该 API 的意图就是修改目标。\n\n\
  `Object.assign` 在我们的工具包中占有一席之地；然而，如果我们想采用函数式编程思维并拥抱不可变性，那么我们需要另一个帮手。请允许我向您介绍对象展开运算符。\n\
  \n\n\n### 展开对象\n\nES9^(³⁰) 将我们用于展开可迭代对象的运算符（即 `...`）引入，使其可用于对象。我们可以通过回顾之前的示例来演示这一点：\n\
  \n- ① 使用展开运算符\n\n```\nconst michelle = {\n  name: 'Michelle',\n  hobby: 'Gardening',\n\
  };\nconst rachael = {\n  ...michelle, ①\n  ...{\n    name: 'Rachael',\n    profession:\
  \ 'Auditor',\n  },\n};\n// 输出 '{ name: 'Rachael', hobby: 'Gardening', profession:\
  \ 'Auditor' }'\nconsole.log(rachael);\n```\n\n我们从简单的对象开始，尝试将一个或多个对象展开到新对象中来构建新对象。除了用展开运算符替代\
  \ `Object.assign` 之外，此示例与我们之前的尝试并无显著差异。然而，新的 `...` 对象语法确实使我们与展开可迭代对象的方式达成一致。同样，展开运算符仅复制被展开对象的可枚举属性。\n\
  \n另外请注意，展开运算符与 `Object.assign` 一样，会遵循我们提供源对象的顺序。如果两个或多个被展开的对象恰好包含相同的键，则后出现的键会覆盖前者。\n\
  \n正如我们在上一节中讨论的，`Object.assign` 与展开运算符的重要区别在于是否存在副作用。`Object.assign` 接受一个目标对象（作为第一个参数），后跟任意数量的源对象。接着它会*改变*目标对象，将源对象的可枚举键复制到目标对象中，然后`返回`目标对象。如果提供的目标恰好是一个现有对象，则正是该对象会获得来自源对象的键，从而改变该对象。\n\
  \n相反，展开运算符的语法并未提供此类途径。展开运算符的语法迫使我们只能将现有对象展开到*新的*对象中。换句话说，展开运算符的语法鼓励不可变性。\n\n## 解构\n\
  \n在之前的讨论中，我们探讨了数组和对象在结构化（创建）与解构（提取）之间缺乏对称性的问题。我们提到了现有方法的若干局限性，包括冗长的语法、无法为“缺失”部分设置默认值，以及函数签名在说明其如何使用参数方面缺乏表现力。现在，让我们了解新的解构语法，以及它如何解决这些问题，同时也会涉及一些注意事项。\n\
  \n### 数组解构\n\n数组的解构语法反映了其顺序特性。请注意观察。\n\n- ① 我们从表示粉色 `rgba` 值的数组开始\n- ② 使用解构语法从数组中提取值\n\
  - ③ 访问数组中没有对应索引的元素会返回 `undefined`\n- ④ 如果我们只想访问数组中的特定项，则忽略其他索引\n\n```\nconst rgba\
  \ = [239, 15, 255, 0.9]; ①\nconst [r, g, b, a, nonExistent] = rgba; ②\nconsole.assert(r\
  \ === 239);\nconsole.assert(g === 15);\nconsole.assert(b === 255);\nconsole.assert(a\
  \ === 0.9);\nconsole.assert(nonExistent === undefined); ③\nconst [, , blue] = rgba;\
  \ ④\nconst blueAgain = rgba[2];\nconsole.assert(blue === b);\nconsole.assert(blueAgain\
  \ === b);\n```\n\n数组解构语法在表达式左侧（即赋值侧）使用 `[]` 语法。如我们所 见，解构赋值允许我们按位置顺序在作用域内声明变量，就像我们为数组定义元素一样。现在，赋值左侧的语法与右侧对称。该语法还允许我们跳过不需要的索引。\n\
  \n对于仅提取一个元素的情况，使用数组解构的价值可能存疑，因为可以直接使用方括号表示法，这个论点也是合理的。然而，当需要从数组中提取多个元素时，解构的回报无疑使其更值得使用。尽管如此，我们承认方括号表示法或\
  \ `length` 等运算符仍然具有相关性，应在适当场合按需使用。\n\n此外，观察赋值语句，我们可以尝试*推断*^(([31])(#fn31))右侧数组的结构。\n\
  \n解构数组元素**不会**违反我们在使用方括号表示法时已习惯的语义。就像请求数组中超出其`大小`的索引处的元素会返回 `undefined` 一样，解构也是如此。\n\
  \n因此，任何对 `undefined` 进行解构的尝试都会导致错误。事实上，解构使用的是与展开运算符相同的可迭代机制。因此，对任何不遵循迭代器接口（我们稍后会介绍）的内容进行解构都会导致错误。^(([32])(#fn32))\n\
  \n与默认参数类似，我们也可以为变量赋值设置默认值，以防数组中不存在所需的索引，如下所示：\n\n- ① 从一个表示四边形的数组开始\n- ② 假设为菱形，使用默认值进行解构\n\
  - ③ 假设为正方形，使用默认值进行解构\n\n```\nconst quadrilateral = [10, 15, 10, 15]; ①\nconst [q1\
  \ = 10,\n       q2 = 20,\n       q3 = q1,\n       q4 = q2] = quadrilateral; ②\n\
  console.assert(q1 === 10);\nconsole.assert(q2 === 15);\nconsole.assert(q3 === 10);\n\
  console.assert(q4 === 15);\nconst [sq1 = 10,\n       sq2 = sq1,\n       sq3 = sq1,\n\
  \       sq4 = sq1] = []; ③\nconsole.assert(sq1 === 10);\nconsole.assert(sq2 ===\
  \ 10);\nconsole.assert(sq3 === 10);\nconsole.assert(sq4 === 10);\n```\n\n就像函数参数中的默认参数一样，我们不仅可以在原始数组中不存在某变量时为其设置默认值，而且右侧的变量还可以引用之前提取元素的值作为默认值！\n\
  \nJavaScript 中的函数调用也会执行赋值操作；方法签名中的参数会依次分配给参数列表中的每一项。事实证明，我们可以直接在方法签名中对数组进行解构，同时还可以为数组中不存在的元素设置默认值：\n\
  \n- ① 为整个数组以及数组中的每个元素设置默认值\n- ② 无参数调用触发默认值\n- ③ 实际上等同于上述操作\n- ④ 计算正方形的周长\n- ⑤ 计算长方形的周长\n\
  - ⑥ 计算梯形的周长\n\n\n```javascript\nconst perimeter = ([s1 = 10,\ns2 = s1,\ns3 = s1,\n\
  s4 = s2] = []) => { ①\nreturn s1 + s2 + s3 + s4;\n};\nconsole.assert(perimeter()\
  \ === 40); ②\nconsole.assert(perimeter([]) === 40); ③\nconsole.assert(perimeter([15])\
  \ === 60); ④\nconsole.assert(perimeter([15, 20]) === 70); ⑤\nconsole.assert(perimeter([15,\
  \ 20, 18, 23]) === 76); ⑥\n```\n\n我们之前学到的关于默认参数的所有内容都适用。我们可以像使用默认参数语法那样，对整个参数设置默认值，但如果参数恰好是一个数组，我们可以进行内联解构，同时为每个我们关心的元素提供默认值。\n\
  \n其明显优势在于函数签名更具表现力，代价是略显冗长。适当的格式化在此很有帮助，使用换行将参数的各个部分分解开来，是一种广泛采用的技术。\n\n最后，我们还可以结合数组解构使用剩余参数。^(³³)\
  \ 这允许我们深入到数组中，抓取所有我们感兴趣的元素，同时将剩余的元素“吸”入另一个数组。\n\n- ① 这里的 `rest` 是一个数组，包含所有未被考虑的元素\n\
  - ② 递归处理剩余元素\n\n```javascript\nconst movies = ['记忆碎片', '蝙蝠侠：侠影之谜', '黑暗骑士'];\nconst\
  \ [first, ...rest] = movies; ①\nconsole.assert(first === '记忆碎片');\nconsole.assert(Array.isArray(rest));\n\
  const [head, ...tail] = rest; ②\nconsole.assert(head === '蝙蝠侠：侠影之谜');\nconsole.assert(Array.isArray(tail));\n\
  ```\n\n就像函数签名中的剩余参数一样，解构中使用 rest 模式**必须**是最后一个赋值项。\n\n正如我们所见，这在递归算法中极为有用^(³⁴)：\n\
  \n- ① 边界情况检测\n- ② 提取我们感兴趣的元素\n- ③ 如果需要则递归\n\n```javascript\nconst or = (...args)\
  \ => {\nif (args.length === 0) return null;\nif (args.length === 1) return args[0];\
  \ ①\nconst [first, ...rest] = args; ②\nreturn first || or(...rest); ③\n};\nconsole.assert(or(null,\
  \ undefined, true, false, '1'));\nconsole.assert(!or(null, undefined, false));\n\
  ```\n\n最后，数组解构也可用于嵌套数组。我们再次注意到赋值与构造之间的对称性：\n\n- ① 当索引查找失败时，为内部数组查找提供默认值\n- ② 嵌套解构\n\
  \n```javascript\nconst ticTacToe = [\n['x', 'o',  'x'],\n['o', 'x', 'o'],\n['x',\
  \ 'o', 'x'],\n];\nconst [\n[cell01] = [],\n[, cell11] = [],\n[, , cell22] = [],\
  \ ①\n] = ticTacToe; ②\nconsole.assert(cell01 === 'x');\nconsole.assert(cell11 ===\
  \ 'x');\nconsole.assert(cell22 === 'x');\n```\n\n这个例子揭示了一个容易出错的地方。回想我们之前的讨论，访问一个数组中**不**存在的索引会得到\
  \ `undefined`。如果我们要查找的值位于顶层，这或许可以接受；然而，如果这是一个嵌套查找，那么这**将**导致错误。考虑到我们试图解构 `undefined`，这是合理的。这里的预防措施可能是在解构之前，先对整个（嵌套）查找设置默认值，正如此处所示。\n\
  \n数组解构的一个用例是让我们可以假装函数`返回`多个值：\n\n- ① `返回`一个数组（在此例中是一个元组）\n- ② 通过解构从返回值中获取多个值\n\n\
  ```javascript\nconst distanceAndSlope = ([x1, y1], [x2, y2]) => {\nconst distance\
  \ = Math.hypot(x2 - x1, y2 - y1);\nconst slope = (y2 - y1) / (x2 - x1);\nreturn\
  \ [distance, slope]; ①\n};\nconst [dist, slope] = distanceAndSlope([4, 3], [10,\
  \ 12]); ②\nconsole.assert(Number.parseFloat(dist.toFixed(2)) === 10.82);\nconsole.assert(slope\
  \ === 1.5);\n```\n\nJavaScript 中有许多方法返回数组（`RegExp.split` 便是一例），数组解构为我们提供了一种便捷且优雅的方式来使用这类函数的结果集。\n\
  \n数组解构常用于解构剩余参数。正如我们所看到的，剩余参数将所有“额外的”参数捕获到一个数组中，这个数组是可展开的。如果我们希望将剩余参数数组中的第一个元素与其他元素分开处理，这一点尤其有用。我们在递归解决方案中经常看到这种用法，如下所示：\n\
  \n- ① 终止条件\n- ② “展平”数组的核心逻辑\n\n```javascript\nconst flatten = ([first, ...rest])\
  \ => {\nif (first === undefined) return []; ①\nreturn !Array.isArray(first)\n? [first,\
  \ ...flatten(rest)]\n: [...flatten(first), ...flatten(rest)]; ②\n};\nconst flattened\
  \ = flatten([\n[1, 2],\n[3], 4, 5, [6, 7],\n]);\nconsole.assert(flattened.length\
  \ === 7);\nconsole.assert(flattened.join() === '1,2,3,4,5,6,7');\n```\n\n我们利用了这样一个事实：如果没有提供剩余参数，解构将导致所有元素被评估为\
  \ `undefined`。这作为递归的终止条件，否则我们继续递归。\n\n除了巧妙运用解构和展开运算符外，这个例子还强调了 ES6 引入的新语法如何让我们在\
  \ JavaScript 中以惯用的方式实现函数式编程。给定一个展平数组的场景，我们的逻辑思路是：查看数组的第一个元素；如果它本身也是一个数组，则先展平该数组，再展平原数组的剩余元素。这个算法在我们的实现中清晰呈现，无需命令式循环和不必要的计数器，我们的真实意图一目了然。\n\
  \n\n### 对象解构\n\n正如大家所料，对象的赋值运算符是 `{}`。数组通过位置进行索引，而对象则使用键值对。因此，在解构时，我们需要在赋值语句中指定我们感兴趣的*键*。请看：\n\
  \n- ① 我们从一个对象开始\n- ② 对象解构的完整形式\n- ③ 对象解构的简写形式\n\n```javascript\nconst paip = {\n\
  \  name: 'Paradigms of Artificial Intelligence Programming',\n  author: 'Peter Norvig',\n\
  \  isbn: 1558601910,\n}; ①\nconst {\n  name: n,\n  isbn: id,\n} = paip; ②\nconsole.assert(n\
  \ === 'Paradigms of Artificial Intelligence Programming');\nconsole.assert(id ===\
  \ 1558601910);\nconst {\n  name,\n  isbn,\n} = paip; ③\nconsole.assert(name ===\
  \ 'Paradigms of Artificial Intelligence Programming');\nconsole.assert(isbn ===\
  \ 1558601910);\n```\n\n对象解构提供了两种语法变体。当我们在作用域中引入的变量名称**不**与被解构对象中的键名一致时，使用较长的版本。如果新变量的名称与它们要查询的键名相同，则使用简写形式更为方便。\n\
  \n从语法和语义上讲，这与数组解构没有显著区别，唯一的区别在于对象不能按位置索引，而必须指定要查找的键。\n\n数组解构中所有可用的功能在这里同样适用——针对不存在的键返回\
  \ `undefined`、默认值、嵌套查找，以及在方法签名中支持解构，所有这些都可以通过对象解构实现。\n\n**不**适用的一点是，新变量无法引用之前已声明的变量，因为“之前”暗示了一种顺序性，而这在关联哈希中是不存在的。\n\
  \n让我们探索所有这些方面：\n\n- ① 我们从一个对象开始\n- ② 使用嵌套解构\n- ③ 使用长格式和短格式的默认值\n- ④ 为整个嵌套查找设置默认值，以防原始对象中缺少该键\n\
  - ⑤ 函数参数中的解构与默认值\n\n```javascript\nconst config = {\n  size: 200,\n  transitionMs:\
  \ 750,\n  clip: {\n    width: 200,\n  },\n}; ①\nconst {\n  size,\n  transitionMs,\n\
  \  clip: { ②\n    width: w = 100, ③\n    height = 100,\n  } = {}, ④\n} = config;\n\
  console.assert(size === 200);\nconsole.assert(transitionMs === 750);\nconsole.assert(w\
  \ === 200);\nconsole.assert(height === 100);\nconst drawChart = ({\n  size = 200,\n\
  \  transitionMs = 1000,\n  clip: {\n    width: w = 100,\n    height = 100,\n  }\
  \ = {},\n} = {}) => { ⑤\n  return [size, transitionMs, w, height];\n};\n// 调用它\n\
  drawChart();\n```\n\n与数组一样，如果我们尝试查找对象中不存在的键，会返回 `undefined`。同样，明智的做法是在查找嵌套对象中的键*之前*，先为其整个结构设置默认值。\n\
  \n## 结合使用数组和对象解构\n\n当然，我们可以混合使用对象和数组解构。让我们重温之前的例子，看看如何结合两者来提取我们感兴趣的部分：\n\n- ① 解构外部对象\n\
  - ② 由于 `address` 本身也是一个对象，我们也对其进行解构\n- ③ `zip` 恰好是一个数组\n- ④ 同时获取 `zip` 中的两个索引值\n\
  \n```javascript\nconst user = {\n  name: 'douglas',\n  profession: 'developer',\n\
  \  address: {\n    street1: '1 Ad Infinitum Drive',\n    street2: \"\",\n    city:\
  \ 'Cupertino',\n    state: 'CA',\n    zip: [\n      '95014',\n      '1234',\n  \
  \  ],\n  },\n};\nconst { ①\n  address: { ②\n    zip: [ ③\n      zip, ④\n      extended,\n\
  \    ],\n  },\n} = user;\nconst final = zip + '-' + extended;\nconsole.assert(final\
  \ === '95014-1234');\n```\n\n我们的目标是提取用户的完整邮政编码，其元素恰好位于一个数组中，该数组嵌套在 `address` 对象内，而\
  \ `address` 本身又是一个 JavaScript 对象字面量的属性。因此，我们必须运用嵌套解构的技巧，小心地剖析原始结构，以便精确地检索出我们想要的内容。我们从解构外部对象开始，这引导我们找到\
  \ `address` 键，然后再次对其进行解构以获取 `zip` 数组。最后，我们可以使用数组解构语法按索引获取构成邮政编码的元素。呼！\n\n我们终于完成了整个循环。复杂的查找和不必要的变量都已不复存在。剩下的仅仅是我们想要的东西。并且，结构化与解构之间的对称性再次显现。\n\
  \n## 注意事项\n\n最后还有一个与函数签名中的解构相关的局限。如果我们解构传递给函数的参数，就会丢失对整个对象（或数组）的引用。换句话说，我们需要做出选择——要么解构以获取我们需要的部分，要么获取整个对象并在函数实现内部进行解构，这样我们就可以在后续继续使用整个对象。虽然这听起来像是边缘情况，但有时我们需要使用对象的部分属性，然后将整个对象传递给下游做进一步处理。像\
  \ Clojure 这样的语言提供了 `:as` 关键字，以便在解构的同时保留对整个对象的引用。不幸的是，JavaScript 没有提供这样的补救措施。\n\n\
  ## 一个小区别\n\n适用于可迭代对象的展开运算符和剩余运算符，与适用于对象的运算符不同，因为对象是**不可迭代**的！虽然对于可迭代对象和对象，展开运算符和剩余运算符看起来和行为一致，但它们底层使用的机制却截然不同。我们应该将适用于对象的展开运算符和剩余运算符视为*新的*语法，而不是将其看作是可迭代对象运算符的扩展。\n\
  \n这种差异在我们尝试将展开运算符与多参函数（如 `console.log`）结合使用时也会显现出来。回想一下，如果我们有一个可迭代对象（如数组）并希望将其内容传递给\
  \ `console.log`，我们可以简单地使用 `console.log(...arr)` 来调用它。这将“展开”数组，将数组中的元素作为单独的参数传递给\
  \ `log`。但这对于对象是行不通的，这再次温和地提醒我们，对象是不可迭代的，并且不能适用于所有可迭代对象的用例。\n\n"
- '# 总结


  正如我们所看到的，展开运算符提供了一种非常强大的机制，可以一次性获取数组的*所有*元素。这在处理多参函数，以及从其他数组创建或拼接数组时尤其有用。


  另一方面，解构语法提供了一种使用*领域特定语言*（DSL）来查询数据的方法，而这种 DSL 的语法与我们最初用来创建对象的语法非常相似。因此，这种 DSL 同样富有表现力，并且通过额外的功能（如为缺失的属性或索引设置默认值），这成为我们
  JavaScript 工具箱中又一个有用的工具。


  在下一章中，我们将转换方向，探讨一种新的字符串定义机制，它有助于简化动态字符串和多行字符串的创建。


  '
- "# 使用模板字符串格式化字符串\n\n\n\n## 引言\n\n你是否曾尝试在 JavaScript 中创建需要同时插入多个变量的动态字符串？我似乎总会在 `+`\
  \ 和引号的使用上出错。更别提还要按照特定格式处理换行和缩进。而且，一旦写完，我们最好*永远*不要再去修改它，对吧？\n\n在本章中，我们将永久告别字符串拼接，转而使用模板字符串。它允许我们以清晰且声明式的方式编排包含变量和表达式插值的字符串。我们还将探索标签函数，它可以用来在\
  \ JavaScript 中创建领域特定语言。我向你保证，在本章结束时，你会迫不及待地重构代码库中的所有字符串，以使用模板字符串。你甚至可能会获得一些关于如何快速创建自己的\
  \ DSL 的灵感！\n\n## 字符串拼接的麻烦\n\nJavaScript 提供了 `String` 原始类型，并支持使用单引号或双引号直接构造字符串。^(³⁵)\
  \ 然而，虽然这适用于构造静态字符串，但在以编程方式构建字符串时却相当麻烦。考虑以下情况：\n\n* ① 确保在有称呼时插入它\n* ② 组合全名，如果没有中间名则省略\n\
  \n```\nconst salutation = 'Mr.';\nconst name = 'Edgar';\nconst middle = 'Allen';\n\
  const last = 'Poe';\nconst fullName = (salutation ? salutation + ' ' : \") ①\n+\
  \ name + ' ' + middle.trim() + ' ' + last; ②\n// 输出 'Mr. Edgar Allen Poe'\nconsole.log(fullName);\n\
  ```\n\n如我们所见，当我们试图区分字符串中的“静态”或固定部分，以及“动态”或变量部分时，我们想要实现的目标意图已经丢失。当然，如果动态部分恰好包含函数或方法调用、条件语句或循环结构，这个问题会进一步加剧。\n\
  \n许多现代 JavaScript（及单页应用）框架（如 Angular）允许我们将 HTML 嵌入到与 JavaScript（或 TypeScript）相同的文件中。HTML\
  \ 与我们的 JavaScript 代码一样，只有在正确格式化时才最容易编写，更重要的是易于维护。鉴于我们唯一可用的选项是字符串拼接，我们被迫参与插值和缩进的复杂操作^(³⁶)：\n\
  \n* ① 声明一个变量\n* ② 尝试使用字符串拼接构造一个相当复杂的字符串\n* ③ 在行内使用该变量\n\n```\nconst title = 'Section\
  \ Title'; ①\nfunction HelloComponent() { };\nHelloComponent.annotations = [new ng.core.Component({\n\
  selector: 'app-hello-world',\ntemplate: '' + ②\n'' +\n'' +\n'' +\n'' +\n'' +\n''\
  \ + title + '' + ③\n'' +\n'' +\n'' +\n'' +\n'' +\n''\n})];\n```\n\n优秀的程序员不会让朋友审查格式错误的代码。因此，我们不仅被迫使用\
  \ `+` 运算符换行，还需要确保代码正确缩进。然而，在这种情况下，我们的编辑器会将其视为 JavaScript，而没有意识到它实际上是嵌入在 JavaScript\
  \ * 内部*的 HTML，如果被要求重新缩进所有代码，它会直接执行（如果它没有自动这样做的话！）。当然，这个问题几乎延伸到所有嵌入式 DSL，其中存在插值变量和格式的混淆。\n\
  \n鉴于我们现有的工具，我们只能诉诸字符串拼接这种古老的插值机制，同时痛苦地在适当的行长度处按下 `Enter` 键，希望我们的 linting 工具不会因为格式不正确的行太多而导致构建失败。\n\
  \n好了，我们的烦恼结束了。ES6 引入了模板字面量，以及作为其扩展的带标签模板字面量。\n\n## 模板字面量\n\n模板字面量引入了更多的语法，即反引号 ``\
  \ ` `` 作为声明字符串的机制，以及占位符语法 `${}` 来支持变量和表达式的插值。模板字面量使得组合包含字面量字符串和将作为字符串创建一部分被求值的行内表达式变得更加容易。考虑以下情况：\n\
  \n* ① 引入一些常量占位符\n* ② 使用带有变量插值的模板字面量组合字符串\n\n```\nconst greeting = 'Hola'; ①\nconst\
  \ name = 'Daniel';\nconst msg = `${greeting}! My name is ${name}`; ②\n```\n\n模板字面量*真正地*编排了一个字符串，省去了通过精心放置\
  \ `+` 运算符而不得不绕的弯路。在 `${}` 内用于插值的命名恰当的变量有助于提高可读性。\n\n插值语法接受任何表达式——无论是函数调用、数学运算，甚至是三元表达式。^(³⁷)\n\
  \n模板字面量也可以用于编排多行字符串。如果以这种方式使用，它们会在求值时保留布局。鉴于许多现代编辑器和 IDE 已经支持 ES6 语法，让它们自动格式化你的代码意味着我们不再会丢失布局。让我们看看重新审视\
  \ Angular 组件示例时会是什么样子：\n\n* ① 声明一个变量\n* ② 使用模板字面量组合字符串\n* ③ 在行内插入一个变量\n\n```\nconst\
  \ title = 'Section Title'; ①\nfunction HelloComponent() { };\nHelloComponent.annotations\
  \ = [new ng.core.Component({\nselector: 'app-hello-world',\ntemplate: `\n ②\n${title}\
  \ ③\n`\n})];\n```\n\n模板字面量保留了我们在反引号内引入的**所有**格式。在我们的示例中，字符串以换行符开头，后面的每一行都缩进了两个空格。如果我们只是使用\
  \ `console.log` 将其打印出来，我们会看到模板字面量信守了它的承诺。再次得益于大多数编辑器现在支持 ES6 语法，我们可以很容易地识别出哪里是直接编排字符串，哪里是使用插值语法。\n\
  \n插值语法有一个限制，那就是我们不能嵌套插值。让我们看一个例子：\n\n* ① 在理想情况下生效\n* ② 哎呀！多了一个空格\n* ③ 尝试嵌套插值将不起作用\n\
  * ④ 我们可以利用模板字面量会求值为字符串这一事实\n\n```\n// 为便于说明，用 _ 表示空格\n{\nconst name = 'Edgar';\n\
  const middle = 'Allen';\nconst last = 'Poe';\n// 输出 'Edgar_Allen_Poe'\nconsole.log(`${name}\
  \ ${middle} ${last}`); ①\n}\n{\nconst name = 'Emily';\nconst middle = \";\nconst\
  \ last = 'Dickinson';\n// 输出 'Emily__Dickinson'\nconsole.log(`${name} ${middle}\
  \ ${last}`);\n// 输出 'Emily__Dickinson' ②\nconsole.log(`${name} ${middle.trim()}\
  \ ${last}`);\n// console.log(`${${name} ${middle}}.trim() ${last}`); ③\n// 输出 Emily_Dickinson\n\
  console.log(`${`${name} ${middle}`.trim()} ${last}`); ④\n}\n```\n\n在我们的理想情况下，每个候选人都有名、中间名和姓。然而，在没有中间名的情况下，盲目地拼接字符串而不在正确位置使用\
  \ `trim` 会导致多出一个空格。另外，请注意我们尝试 `trim` 中间名的方法也是不恰当的——如果名字本身包含尾随空格，修剪中间名有助于减少冗余空格。但对于空中间名*周围*的空格却没有作用。\n\
  \n我们想做的是连接名和中间名，使用 `trim` 消除任何冗余空格，然后才加上姓。\n\n由于我们不能嵌套插值，我们被迫采取不同的策略。我们可以利用模板字面量会求值为其最终字符串这一事实——因此我们可以在模板字符串中嵌套模板字符串——从而以一种稍微复杂的方式实现插值的嵌套。\n\
  \n\n\n尽管有人可能会质疑嵌套模板字符串的可读性，而且这种质疑也完全合理，但在实际中并不少见，尤其是在我们即将讨论的带标签的模板字面量中。\n\n另一个限制是插值语法是`${}`，这意味着`$`和`{}`都是必需的。许多语言（如\
  \ Ruby）允许在仅求值一个变量时省略`{}`，但在求值任何表达式时必须使用它们。\n\n如果我们想要将反引号或`$`符号作为字面量呢？很简单。只需使用反斜杠进行转义，如下所示：\n\
  \n```\nconst escapingLiterals = `模板字符串引入了 \\`\\` 并使用 $\\{} 进行插值`;\n// 输出 '模板字符串引入了\
  \ `` 并使用 ${} 进行插值'\nconsole.log(escapingLiterals);\n```\n\n模板字面量优雅地解决了字符串组合的问题——让我们能够简洁地表达字符串如何形成和格式化。但还有更好的消息！ES6\
  \ 还为我们提供了另一个与模板字符串配合使用的功能，即带标签的模板字面量。接下来让我们深入研究它们。\n\n## 带标签的模板字面量\n\n带标签的模板字面量允许我们使用“标签”或标签函数与模板字面量结合，从而影响生成的字符串，并产生比单独使用模板字面量可能实现的结果更多的东西。\n\
  \n让我们退一步，看看模板字面量是如何工作的。我们可以利用模板字面量的两个方面来改变结果字符串——*如何*拼接以及如何处理模板内插值的变量。考虑一种情况，我们在模板字符串内插值字符串变量——影响结果的方式取决于字符串对象的能力。例如，我们可以调用`toUpperCase`方法并显示一个相当生动的消息，如下所示：\n\
  \n```\nconst greeting = 'Hello';\nconst name = 'Sylvia';\nconst msg = `${greeting.toUpperCase()}!\
  \ 我的名字是 ${name}!`;\n```\n\n如果我们剖析模板字符串的组成部分，可以看到等式有两部分——字符串的“静态”部分和“动态”部分。我们可以将它们想象成两个数组，如下所示：\n\
  \n*模板字符串的静态部分与动态部分*\n\n*   ① 仅插值两个变量的模板字符串\n*   ② `-` 表示固定部分，`_` 表示动态部分\n*   ③ 字符串中固定的部分表示为一个数组\n\
  *   ④ 模板字符串中动态或已求值的部分\n\n```\nconst greeting = 'Hello';\nconst name = 'Sylvia';\n\
  const msg = `${greeting}! 我的名字是 ${name}!`; ①\n//           ___________-------------_______-\
  \ ②\nconst fixedStrings = [\", '! 我的名字是 ', '!']; ③\nconst values = ['Hello', 'Sylvia'];\
  \ ④\n```\n\n就像我们在这里所做的一样，我们可以将*任何*模板字符串整齐地拆分成两个数组。此外，如果我们交错这两个数组——从`fixedStrings`数组中取出第一项，与`values`数组中的第一个值拼接，并继续直到所有项都用完——我们就可以自己重新构建模板字符串！\n\
  \n标签函数正是让我们做到这一点。它们通过提供对模板组成部分（固定部分和动态部分）的引用来让我们拦截模板字符串的求值过程，而标签函数返回的任何值都会被整齐地插入到我们调用它的位置。\n\
  \n我们将从一个简单的例子开始，其中我们将实现模板字符串本身提供的功能。这将让我们有机会理解如何使用标签函数，并检查它们的签名：\n\n*   ① 声明一个标签函数\n\
  *   ② 调用标签函数，传入一个模板字符串\n\n```\nconst handler = (strings, ...values) => { ①\nconst\
  \ interleave = (arr1, arr2) =>\narr1.reduce((arr, v, i) => arr.concat(v, arr2[i]),\
  \ []);\nreturn interleave(strings, values).join(\");\n};\nconst greeting = 'Hello';\n\
  const name = 'Ernest';\nconst msg = handler`${greeting}! 我的名字是 ${name}.`; ②\n//\
  \ 输出 'Hello! 我的名字是 Ernest.'\nconsole.log(msg);\n```\n\n标签函数有一个独特的调用模式，与普通函数必须将参数包裹在圆括号中不同，标签函数直接接受行内的模板字符串。JavaScript\
  \ 将模板字符串拆分为固定部分和动态部分，分别传递给标签函数——所有固定部分作为第一个参数数组传入，插值部分按它们在原始模板中出现的顺序依次传入。因此，在我们的例子中，`strings`是一个固定部分的数组，我们使用可变参数语法将所有剩余参数捕获到另一个数组中。\n\
  \n剩下的就很简单了——只需交错这两个数组，从`strings`数组的第一项开始，接着是`values`数组的一项，直到`strings`数组的末尾，然后返回结果。\n\
  \n如果你在控制台中尝试，你会看到可以为它提供任何模板字符串，它会像被 JavaScript 求值一样返回该字符串。\n\n到目前为止，我们实现的东西 JavaScript\
  \ 已经为我们做了，所以你可能还不相信为什么标签函数是个好主意。让我们尝试一个稍微更复杂的例子——有一个非常流行的编辑器扩展叫做 [Emmet](https://emmet.io/)。安装后，它可以通过提供高度简写的语法，将文本展开为有效的\
  \ HTML 代码，从而让你极其快速地编写 HTML（和 CSS）。Emmet 更进一步，在展开后将光标放置在正确的位置，让我们可以输入内部 HTML。考虑以下示例，其中注释表达了开发者在支持\
  \ Emmet 的编辑器中输入的内容，然后按`Tab`键，看看 Emmet 会将文本转换为什么（其中`_`表示 Emmet 放置光标的位置）：\n\n```\n\
  \ TAB -->\n_\n TAB -->\n_\n TAB -->\n\n```\n\nEmmet 语法显然受到 CSS 选择器的启发，例如`document.querySelector`和\
  \ jQuery 接受的语法。Emmet 是一种交互式媒介，因为它可以将光标放置在适当的位置，以便开发者输入代表元素`innerHTML`的文本。\n\n如果我们想以编程方式做类似的事情，即提供受\
  \ Emmet 启发的语法，然后我们的代码将其展开为相应的 HTML，会怎么样？当然，我们需要一种表达元素`innerHTML`的方式，因为我们实际上要写出所有的\
  \ HTML，并且没有方便地放置光标的奢侈条件，所以我们将采取一种巧妙的方法。我们将使用模板字面量和标签函数，但有一个限制——元素的`innerHTML`必须作为插值变量在模板字符串的末尾提供。换句话说，`h1.title${someVar}`是有效的，但`h1.title.content${someVar}#main`是无效的。这将让我们知道哪些部分组成\
  \ HTML 元素，以及将什么文本放入`innerHTML`中。\n\n最后，给定`h1.title${someVar}`，其中`someVar`求值为`some\
  \ text`，标签函数应返回`<h1 class=\"title\">some text</h1>`。准备好了吗？\n\n*   ① 我们符合 Emmet 的标签函数\n\
  *   ② 假设提供的字符串中第一个内容就是元素名称\n*   ③ 使用正则表达式获取所有类/ID 标记\n*   ④ 如果只是一个没有任何属性的普通元素，则无需操作\n\
  *   ⑤ 获取`id`，如果提供了多个 id，则取最后一个\n*   ⑥ 构建`id=\"\"`字符串\n*   ⑦ 筛选出所有以`.`开头的属性\n*  \
  \ ⑧ 构建`class=\"\"`字符串\n*   ⑨ 构建包含 id/class 的起始标签字符串\n*   ⑩ 写出完整的元素（包括其`innerHTML`）并返回它\n\
  \n\n\n```javascript\nfunction ele([strings], ...values) { ①\nconst str = strings.trim();\n\
  // 假设第一个 . 或 # 之前的内容是元素名称\nconst [element] = str.split(/[.#]/); ②\n// 使用 . 或 # 作为分隔符，将字符串的剩余部分拆分为多个部分\n\
  // 这会抓取位于 '.' 或 '#' 与下一个 '.' 或 '#' 之间的所有内容\nconst attrs = str.match(/.#/g); ③\n\
  let idStr = \"；\nlet classStr = \"；\nif (attrs) { ④\n// 查找所有提供的 id\n// 如果提供了多个 id，仅使用最后一个\n\
  const id = attrs\n.filter(a => a.startsWith('#'))\n.pop(); ⑤\n// 如果没有提供 id，则不拼接\
  \ id 字符串\nidStr = id\n? `id=\"${id.substring(1, id.length)}\"` ⑥\n: \"；\n// 查找所有提供的\
  \ class\nconst classes = attrs\n.filter(a => a.startsWith('.'))\n.map(v => v.substring(1,\
  \ v.length)); ⑦\n// 如果没有提供 class，则不拼接 class 字符串\nclassStr = (classes.length > 0)\n\
  ? `class=\"${classes.reduce((acc, v) => `${acc}${v} `, \").trim()}\"` ⑧\n: \"；\n\
  }\nconst adornedElement = [element, idStr, classStr]\n.reduce((acc, v) => `${acc}\
  \ ${v}`.trim(), \"); ⑨\nreturn `${values.join(\")}`； ➉\n}\nconst heading = 'Hello\
  \ Template Handlers'；\n// 输出 'Hello Template Handlers'\nconsole.log(ele`h1 ${heading}`);\n\
  // 输出 'Hello Template Handlers'\nconsole.log(ele`h1#main ${heading}`);\n// 输出 'Hello\
  \ Template Handlers'\nconsole.log(ele`h1.title ${heading}`);\n// 输出 'Hello Template\
  \ Handlers'\nconsole.log(ele`h1.title.content#main ${heading}`);\n// 输出 'Hello Template\
  \ Handlers'\nconsole.log(ele`h1.title.content#main ${ele`div${heading}`}`);\n//\
  \ 输出 'Hello Template Handlers'\nconsole.log(ele`h1.title.content#main ${ele`div.banner${heading}`}`);\n\
  ```\n\n这里涉及的内容很多，所以我们一步一步来。考虑到我们对标签函数使用方式所施加的限制，我们知道包含元素描述的数组将是一个单元素数组。因此，我们通过解构来获取这唯一的元素，并调用\
  \ `trim` 方法去除所有多余的空白字符。我们还知道，该字符串由一个元素名称以及类选择器（`.`）和 ID 选择器（`#`）组成，因此我们可以使用 `split`\
  \ 方法获取第一个选择器出现之前的内容，并将其视为我们要生成的 HTML 元素的名称。\n\n接下来，通过一些正则表达式魔法，将元素名称之后提供的所有选择器抓取到一个数组中。因此，如果用户提供\
  \ `h1.title.content#main`，则此正则表达式会将其拆分为一个形如 `['.title', '.content', '#main']` 的数组。我们首先过滤该数组，找到用户提供的所有\
  \ ID，如果提供了多个 ID（这是非法的），我们只需取最后一个提供的 ID，从而模拟 Emmet 的行为，并拼接出 `id=` 字符串。然而，多个类（class）*是*允许的，因此我们过滤数组以获取所有提供的类，并拼接出\
  \ `class=` 字符串。\n\n剩下的就很简单了——只需将元素名称、id 和 class 字符串组合在一起，确保插入 `innerHTML` 内容（作为插值变量提供），并返回完全组合好的元素。\n\
  \n关于我们的实现，有几点必须强调。首先，我们在函数*内部*使用模板字符串来构建其他字符串。就标签函数而言，除了拥有一个显式的签名外，它们与普通函数并无二致。其次，正如我们在示例中所看到的，我们可以嵌套调用其他（标签）函数，从而创建嵌套的元素结构。由于\
  \ JavaScript 在组合字符串之前必须先计算每个插值表达式，实际上，对我们标签函数的嵌套调用会导致最终的字符串由内而外构建——最内层的调用先执行，然后向外层推进。\n\
  \n诚然，我们的实现短期内不会获得任何奖项。它无法处理兄弟元素（Emmet 通过 `+` 运算符支持）或同时创建 `n` 个元素（Emmet 通过 `*` 运算符实现）。然而，它确实让我们得以一窥模板字面量和标签函数的强大之处，以及它们真正能够实现的功能。\n\
  \n标签函数与模板字符串一起提供了多种用例，包括辅助国际化与本地化、语言翻译以及用户输入的清理，其核心本质是将字符串从一种形式转换为另一种形式。我们甚至可以扩展我们的\
  \ Emmet 标签函数，以模拟 React 中 JSX 等模板语言所表现出的行为。像 `styled-component` 和 `html-tagged-template`\
  \ 这样的库为我们提供了绝佳的思路和启发，促使我们在许多常见的日常用例中考虑使用模板字面量。\n\n你能想到在哪些情况下可以通过引入这样的 DSL（领域特定语言）来消除代码中的冗余吗？或者，在为了调试目的而漂亮地打印对象时呢？又或者，在以特定格式显示数据时，例如特定于区域设置的日期和/或货币？\n\
  \n"
- '# 总结


  生成包含变量插值的字符串一直是一件繁琐的事情，而模板字符串旨在通过提供一种不仅使插值更容易、而且还支持多行字符串的字面量来缓解这一痛点。另一方面，标签函数允许我们拦截模板字符串的构建过程，从而实现一些相当有趣的用例。


  在下一章中，我们将把注意力转回对象和数组。对象和数组到目前为止表现得很好，但那些来自其他语言的开发者常常会怀念诸如映射（Map）和集合（Set）这样的数据结构，以及
  JavaScript 中缺少此类数据结构的情况。这将是下一章的主题。同时，我们还将看到展开运算符和解构赋值是如何与它们协同工作的。


  脚注 1  2  3  4  5  6  7


  '
- "# 6. 映射与集合——数据结构家族的新成员\n\n一门编程语言必须为我们提供所有必要的构造，使开发者能够清晰高效地为其领域和问题空间建模。迄今为止，JavaScript\
  \ 缺乏对大多数其他语言都提供的两种基本类型的支持，即映射（Map）和集合（Set）。这种情况在 ES6 中得到了改变。\n\n在本章中，我们将探讨 ES6 中引入的两种新数据结构的用途，即\
  \ `Map` 和 `Set`。我们将从它们的构造开始，理解它们的 API，甚至深入底层了解它们是如何实现的。到本章结束时，我们将完全理解如何以及在何时可以在代码中利用映射和集合，以及何时最好避免使用它们。\n\
  \n\n\n## 为什么对象还不够用\n\nJavaScript 提供了两种类似“集合”的对象——普通对象（使用 `{}` 字面量表示）和数组（使用 `[]`\
  \ 字面量表示）。普通对象通常被称为关联数组或字典，通过键进行查找。而数组则提供了一种顺序数据结构，能够通过索引进行高效的随机查找。\n\n对象和数组虽然有用，但并不能满足所有使用场景。对象作为*真正*的键值存储的一个限制是，对象的键**都是**字符串。换句话说，当在对象中使用时，键的“类型”无法保留。这一点可以简单地演示如下：\n\
  \n- ① 创建一个包含两个*看似*不同的键的对象\n- ② 用特定类型查询对象中的某个键\n- ③ **仅**交换键值对的顺序，不做其他更改\n- ④ 现在相同的查询结果不同了\n\
  \n```\nconst obj1 = {\n'true': 'String',\ntrue: 'Boolean',\n}; ①\nconsole.assert(obj1[true]\
  \ === 'Boolean'); ②\nconst obj2 = {\ntrue: 'Boolean',\n'true': 'String',\n}; ③\n\
  console.assert(obj2[true] === 'String'); ④\n```\n\n这一点对于任何曾将 JavaScript 对象序列化为 JSON\
  \ 的人来说（我们*所有人*都遇到过）都是显而易见的。\n\n鉴于这个限制，如果我们需要保留键的*类型*，我们别无他法。^(⁴²)\n\n因此，ES6 为我们提供了映射（Maps）和集合（Sets）。映射与对象非常类似，也是键值存储；但映射会保留键的类型，更接近其他语言中提供的映射。而集合则填补了一个角色，在\
  \ ES6 之前，开发者不得不对数组中的条目进行大量的 `===` 检查，或者仅仅使用字符串作为对象中的“唯一条目”，如果都不行，就只能求助于第三方库^(⁴³)\
  \ 来满足需求。\n\n我们的探索到此为止。我们先从映射开始，接着介绍集合。\n\n## 映射\n\n映射与对象非常相似，也通过键进行查找，区别在于映射会保留键的*类型*（而不是像对象那样将它们强制转换为字符串）。映射提供了一个构造函数作为创建新映射的方式。与数组和对象不同，映射**没有**提供字面量构造方式，这对其可序列化性有一定影响（我们稍后会看到）。映射还提供了一套全面的\
  \ API，用于在映射中添加、更新和删除键值对，下面一一演示：\n\n*映射的键值 API*\n\n- ① 创建映射的构造函数\n- ② 使用 `set` 设置键\n\
  - ③ `set` 是一个流畅接口，返回映射本身\n- ④ `has` 表示是否拥有该键\n- ⑤ `get` 是查询 API\n- ⑥ 强制发生冲突会导致之前的*值*被覆盖\n\
  - ⑦ 最后设置的值胜出\n- ⑧ 如果删除一个已有键，映射返回 true\n- ⑨ 删除不存在的键\n\n```\nconst obj = {};\nconst\
  \ map = new Map(); ①\nmap.set('string', 'is a string'); ②\nmap.set(true, 'is a boolean');\n\
  map.set(1, 'is a number').set(obj, 'is an object'); ③\nconsole.assert(map.has(1));\
  \ ④\nconsole.assert(map.get(obj) === 'is an object'); ⑤\nmap.set(1, 'overrides first');\
  \ ⑥\nconsole.assert(map.get(1) === 'overrides first'); ⑦\nconsole.assert(map.delete('string'));\
  \ ⑧\nconsole.assert(map.has('string') === false);\nconsole.assert(map.delete({})\
  \ === false); ⑨\n```\n\n`Map` API 提供了我们处理键值所需的一切。`set` 接口是流畅的，这无疑是一个强大的盟友，可以避免因非流畅接口而产生的冗余代码。冲突的处理方式也符合预期，最后，我们可以使用\
  \ `delete` API 从映射中移除一个键值对，如果键确实从映射中被删除，则返回 `true`（如果键不存在，`delete` 会返回 `false`，表示没有东西可删）。\n\
  \n在更高层面，还有一些 API 允许我们整体操作映射，例如获取所有条目、条目计数，甚至清空映射（如果我们想这样做的话）：\n\n- ① 可接受可迭代对象的替代构造函数\n\
  - ② 表示键值对的元组\n- ③ 元组中多余的元素会被丢弃\n- ④ 只有键，因此值被设置为 `undefined`\n- ⑤ 键值对都缺失\n- ⑥ 一个略显奇怪但用于查询数量的属性\n\
  - ⑦ 用于遍历键值对的函数式 API\n- ⑧ 这些方法都返回迭代器\n- ⑨ 清空映射并将其 `size` 设为 0 的 API\n\n```\nconst\
  \ map = new Map([ ①\n['s', 'is a string'], ②\n[true, 'is a boolean', 'willBeIgnored'],\
  \ ③\n[1], ④\n[], ⑤\n]);\nconsole.assert(map.size === 4); ⑥\nconsole.assert(map.get('s')\
  \ === 'is a string');\nconsole.assert(map.get(true) === 'is a boolean');\nconsole.assert(map.get(1)\
  \ === undefined);\nconsole.assert(map.get(undefined) === undefined);\nconsole.assert(map.has(undefined));\n\
  map.forEach((v, k) => console.log(v, k)); ⑦\nconsole.log(map.entries());\nconsole.log(map.keys());\n\
  console.log(map.values()); ⑧\nmap.clear(); ⑨\nconsole.assert(map.size === 0);\n\
  ```\n\n映射还提供了另一个有用的构造函数，可以使用任何“可迭代对象”来创建映射。一种常见用法是向构造函数传入一个数组的数组。每个嵌套数组被视为一个二元组，分别表示键和值。如果嵌套数组只包含一个元素，则该值被设置为\
  \ `undefined`。如果数组包含超过两个元素，则所有多余的元素都会被忽略。最后，如果数组为空，则键和值都被设置为 `undefined`。如果提供的数组**没有**产生冲突，那么生成的映射将按数组相同的顺序排列其键，并且生成的映射的\
  \ `size` 将等于数组的 `length`。\n\n\n\n映射（Map）会保留其条目的插入顺序，具体来说就是**键**被添加的顺序。然而，如果发生键冲突，新值会覆盖*该键所在位置*的旧值。也就是说，它们的行为非常类似于数组，只是它们的“索引”可以是任意类型。\n\
  \n由于映射维护了顺序，它们允许我们使用 `forEach` 等方法以及 `entries` API 来遍历其 `entries`。该 API 每次返回一个键值对，被封装在长度为\
  \ 2 的数组中，表示为 `[key, value]`。映射还提供了 `keys` 和 `values` API，顾名思义，它们会按照插入顺序返回映射中所有键和值的数组。\n\
  \n映射和数组一样遵循“迭代器”协议，正如我们之前讨论过的，这使得映射可以通过 `...` 运算符进行展开，并能进行解构。正如我们所见，映射可以通过数组的数组来创建；反过来，可以推测，展开一个映射会将其分解为一个数组的数组，其中每个数组都是一个键和值的元组，而外层的数组反映了插入顺序，其\
  \ `length` 等于映射的 `size`。\n\n- ① 创建一个映射\n- ② 将映射展开为数组\n- ③ 解构获取第二个和第三个条目\n\n```\n\
  const firstQuarter = new Map([\n[1, 'Jan'],\n[2, 'Feb'],\n[3, 'Mar'],\n[4, 'Apr'],\n\
  ]); ①\nconst mapToStr = [...firstQuarter].join(':'); ②\nconsole.assert(mapToStr\
  \ === '1,Jan:2,Feb:3,Mar:4,Apr');\nconst [\n,\n[n2, m2],\n[n3, m3],\n] = firstQuarter;\
  \ ③\nconsole.assert(n2 === 2);\nconsole.assert(m2 === 'Feb');\nconsole.assert(n3\
  \ === 3);\nconsole.assert(m3 === 'Mar');\n```\n\n鉴于映射是可迭代的，并且 `Map` 构造函数期望接收一个可迭代对象，当我们尝试从现有映射创建新映射时，这变得非常方便。当创建恰好是其他映射的并集的新映射时，这甚至更加便利：\n\
  \n- ① 两个映射的并集\n- ② “后到者优先”原则\n\n```\nconst nihar = new Map([\n['car', 'mazda'],\n\
  ['residence', 'apartment'],\n]);\nconst ericka = new Map([\n['pet', 'oscar'],\n\
  ['residence', 'house'],\n]);\nconst union = new Map([...nihar, ...ericka]); ①\n\
  console.assert(union.get('car') === 'mazda');\nconsole.assert(union.get('residence')\
  \ === 'house'); ②\nconsole.assert(union.get('pet') === 'oscar');\n```\n\n我们从两个独立的映射开始，然后利用映射是“可展开的”这一特性以及映射构造函数可以使用数组来构建新映射的事实，尝试构建一个新的映射。注意，在这种情况下，传递给构造函数的数组有**四个**条目；然而，当映射尝试将每个条目添加到新映射时，它在遇到\
  \ `residence` 键时会检测到冲突。因此，结果映射中 `residence` 键对应的值将是 `house`。\n\n为了全面了解映射，让我们回答一个仍未解决的相关问题——两个键如何被视为相等？答案在于\
  \ `===` 操作符。如果 `set` 操作时，映射中已存在的任何键通过 `===` 测试返回 `true`，则视为冲突，该键的值将被设置为新值。否则，一个新的键值对条目会被插入到映射的末尾。\n\
  \n## 注意事项\n\n与映射相关的注意事项并不多。其 API 很全面，能够完成我们对映射期望的所有功能。\n\n然而，第一个不足之处是缺少字面量语法。这迫使我们使用构造函数，这似乎与我们通常处理对象和数组的方式相悖。在\
  \ JavaScript 中有很多理由不使用构造函数^(⁴⁴)，但可惜的是，我们别无选择。让我们通过一个简单的例子来观察这种差异：\n\n- ① 对象为我们提供了字面量\
  \ `{}` 语法\n- ② 同样地，数组提供了 `[]` 字面量\n- ③ 我们却被迫使用构造函数\n\n```\nconst kiran = { ①\nname:\
  \ 'kiran',\nprofession: 'pharmacist',\n};\nconst favFruits = [ ②\n'mango',\n'guava',\n\
  'pineapple',\n];\nconst numbersInHindi = new Map(); ③\nnumbersInHindi.set(1, 'ek').set(2,\
  \ 'do').set(3, 'teen');\n```\n\n第二个问题涉及 JSON 的序列化（和反序列化）。JSON 规范^(⁴⁵) 只支持两种数据结构——对象和数组。因此，对任何映射使用\
  \ `JSON.stringify` 都不会产生预期的结果。\n\n事实证明，我们能为映射的序列化版本做到的最接近的方式是将其视为一个数组的数组。在另一端，我们可以简单地\
  \ `JSON.parse` 接收到的字符串，然后将其交给映射构造函数以创建一个新的映射。观察如下：\n\n- ① 序列化映射的便捷函数\n- ② 序列化的逆操作\n\
  \n```\nconst nihar = new Map([\n['car', 'mazda'],\n['residence', 'apartment'],\n\
  ]);\nconst mapToJson = map => JSON.stringify([...map]); ①\nconst jsonToMap = mapStr\
  \ => new Map(JSON.parse(mapStr)); ②\nconst serialized = mapToJson(nihar);\n// 输出\
  \ '[[\"car\",\"mazda\"],[\"residence\",\"apartment\"]]'\nconsole.log(serialized);\n\
  const deserialized = jsonToMap(serialized);\n// 输出 'Map { 'car' => 'mazda', 'residence'\
  \ => 'apartment' }'\nconsole.log(deserialized);\n```\n\n将序列化/反序列化逻辑封装到工具函数中会很有益处，我们很快就会看到这一点。另外，映射的“可迭代性”再次证明了它是我们的朋友。\n\
  \n然而，如果这让你有点担心，那么你并不孤单。在数据交换层缺乏对映射的支持，将判断某个数据是否为映射的责任转移到了应用层。换句话说，仅仅查看 JSON 内容，根本无法表明某些东西应该被解析为映射，还是仅仅是一个数组的数组。\n\
  \n此外，如果某个对象或数组可能包含映射，我们就不能再简单地对其使用 `JSON.stringify`！我们现在被迫要检查所有值，如果恰好是映射，就使用我们的便捷函数先序列化那个值，然后再序列化父对象。或者，我们可以尝试使用第三方库^(⁴⁶)\
  \ 来为我们完成转换。^(⁴⁷)\n\n这里的关键问题在于，映射的键可以是*任何*类型，包括引用类型。让我们将其与序列化对象进行对比；对象中的键总是字符串，并且字符串自身就是其表示。因此，序列化一个对象键简化为简单地将该字符串放入\
  \ JSON 中。映射则不同！如果我们使用一个对象引用作为映射的键，并且该引用被序列化，那么在反序列化时，该引用就会丢失！考虑以下情况：\n\n- ① 序列化一个包含对象引用作为键的映射\n\
  - ② 将其反序列化回映射\n- ③ 查找该对象引用失败\n\n```\nconst obj = {\nname: 'some object',\n};\nconst\
  \ map = new Map([\n[obj, 'value against an object key'],\n]);\nconst mapToJson =\
  \ m => JSON.stringify([...m]);\nconst jsonToMap = mapStr => new Map(JSON.parse(mapStr));\n\
  const serialized = mapToJson(map); ①\n// 输出 '[[{\"name\":\"some object\"},\"value\
  \ against an object key\"]]'\nconsole.log(serialized);\nconst deserialized = jsonToMap(serialized);\
  \ ②\n// 输出 'Map { { name: 'some object' } => 'value against an object key' }'\n\
  console.log(deserialized);\nconsole.assert(deserialized.get(obj) === undefined);\
  \ ③\n```\n\n从 JSON 反序列化后，要重新获得一个本身是对象引用的键的唯一方法是遍历映射的所有键并获取其引用。这完全违背了键查找的目的！\n\n\
  那么，映射真的有实际用途吗？当然有。只要我们不打算序列化映射，它们就很有用。它们提供了普通的旧式 JavaScript 对象（`POJO`）所不允许的灵活性。当然，如果你*确实*打算序列化，那么最好所有的键本身都是可序列化的（换句话说，是字符串），这样我们才能“重新找到”它们。如果这不可行，那么你最好还是只使用\
  \ `POJO`。\n\n\n\n## WeakMaps\n\nES6 引入了另一种映射变体，即 `WeakMap`。我们不会花太多时间深入讲解 weakmap，只会重点说明它们与常规\
  \ map 的区别。\n\n第一个区别是 `WeakMap` 的键**必须**是对象；不允许使用原始值。^((48))\n\n第二个区别在于 weakmap 如何持有其键。(常规)\
  \ `Map` 对其键保持“强”引用。为了便于说明，假设我们有一个对象，并把它用作常规 map 中的键。如果我们在维护该对象的引用计数，那么计数就会加一。换句话说，即使对该对象的所有其他引用都丢失了，该对象也**无法**被垃圾回收，因为引用计数仍然为\
  \ 1——这个引用就是 map 所持有的那个。为了使该键及其关联值能够被垃圾回收，我们必须显式地将其从 map 中 `delete` 掉。请看下面的示例：\n\n\
  - ① 对一个对象的引用\n- ② 将该引用用作 map 中的键\n- ③ 丢弃对该对象的引用\n- ④ Map 继续持有引用\n\n```\nlet obj\
  \ = {\n  name: 'some object',\n}; ①\nconst map = new Map([\n  [obj, 'value against\
  \ an object key'], ②\n]);\nconsole.assert(map.has(obj));\nobj = null; ③\nconsole.assert(map.size\
  \ === 1); ④\n```\n\n另一方面，weakmap 对其任何键都**不**持有强引用。相反，它们“弱弱地”持有键。可以将弱引用理解为：它们太弱了，无法强制“被引用”对象留在内存中。如果所有*其他*对键的引用都丢失了，这允许作为键的对象被垃圾回收。\n\
  \n我们来分解一下。假设有一个 DOM 元素，我们希望用一个数组来关联一些额外数据。这听起来很适合用 map，对吧？于是，我们将 DOM 元素用作 map 中的键，将关联的数组作为值。现在，每当我们想检索数据时，只需\
  \ `get` 该 DOM 元素，就大功告成了。完美。\n\n现在，某些用户交互导致该元素从 DOM 中删除，从而消除了保留该数组的必要。由于 map 持有对该\
  \ DOM 元素的（强）引用，垃圾回收器无法回收它，这就成了我们开发者的责任，必须记得从 map 中 `delete` 这个键。如果我们*万一*忘记了，那么内存泄漏就出现了！\n\
  \n这正是使用 weakmap 的理想场景。如果改用 weakmap 存储 DOM 与数组的键值对，当 DOM 元素被删除时，weakmap 会让垃圾回收器回收掉这个键，以及与之关联的数组。我们就不用再手动从\
  \ map 中移除引用及其关联数据了。\n\nWeakmap 的 API 相当有限，原因很简单：weakmap 可能在任意时刻丢失一个键（及其关联值）。因此，任何强制\
  \ weakmap 查看所有条目的 API，例如 `size` 和任何迭代 API，都是根本不可行的。`WeakMap` 只允许 `set`、`get`、`delete`\
  \ 键，以及检查 weakmap 是否 `has` 某个键的条目。`WeakMap` 的构造函数接口与 map 类似，如果我们在构造时有可用的可迭代对象，也可以传入它来初始化\
  \ weakmap。\n\n`WeakMap` 主要面向库和框架的作者。想想 jQuery 的 `data` API（它允许你将任意数据附加到任何元素），或者你想在对象外部存储关于某个对象的元数据（想象一下规范缓存），你就会找到\
  \ weakmap 的用武之地。我相信随着 ES6 的普及，我们将会看到 weakmap 的其他有趣用途。\n\n## Sets\n\n`Set` 允许我们存储唯一的值。如果我们尝试向\
  \ set 添加一个已经包含的值，该值会被拒绝。从实现角度看，set 在底层*就是* map，只不过键和值是同一个东西，即值本身。这意味着 map 的所有特性（和注意事项）也适用于\
  \ set。由于 map 和 set 如此相似，我们对 set 的探索会相当简洁。\n\n与 map 一样，set 也不提供字面量，只有构造函数。Set 的 API\
  \ 很完善，允许我们像预期那样操作 set。\n\n我们从构造和值的基本操作开始：\n\n- ① 构造函数创建 set\n- ② `add` 一个值\n- ③\
  \ `add` 是流式 API，返回 set 本身\n- ④ `has` 表示包含\n- ⑤ 强制重复添加……\n- ⑥ Set 保持不变\n- ⑦ 如果 `delete`\
  \ 一个已有的值，set 返回 `true`\n- ⑧ 删除一个不存在的值返回 `false`\n\n```\nconst obj = {};\nconst set\
  \ = new Set(); ①\nset.add('string'); ②\nset.add(true);\nset.add(1).add(obj); ③\n\
  console.assert(set.size === 4);\nconsole.assert(set.has(1)); ④\nset.add(1); ⑤\n\
  console.assert(set.size === 4); ⑥\nconsole.assert(set.delete('string')); ⑦\nconsole.assert(set.has('string')\
  \ === false);\nconsole.assert(set.delete({}) === false); ⑧\n```\n\n这里没有什么意外，和 map\
  \ 非常相似，set 提供了一套完整的 API 来操作值，并且也具有 map 那样的流式调用能力。当然，我们必须注意，set 没有 `get` 方法，因为对于\
  \ set 来说 `get` 等同于 `has`（因为键*就是*值）。\n\nSet 还提供了更高级的 API，允许我们整体操作 set。还有一个补充的构造函数接受可迭代对象，可迭代对象中的每个值都代表\
  \ set 中的一个值（假设没有冲突）。通过可迭代对象构造这一点暗示了：和 map 一样，set 也会维护插入顺序（假设没有冲突），从而支持诸如 `forEach`\
  \ 这样的迭代 API：\n\n- ① 使用可迭代对象创建 set 的构造函数\n- ② 表示 set 值的数组\n- ③ 再次提醒，用于查询计数的属性可能有点令人困惑\n\
  - ④ 遍历值的函数式 API\n- ⑤ 有趣的是，有一个 `keys` API，它与 `values` 相同\n- ⑥ 以上所有方法都返回迭代器\n- ⑦ 用于清空\
  \ set 并将 `size` 设为 0 的 API\n\n```\nconst set = new Set([ ①\n  'string',\n  true,\n\
  \  1, ②\n]);\nconsole.assert(set.size === 3); ③\nconsole.assert(set.has('string'));\n\
  console.assert(set.has(true));\nconsole.assert(set.has(1));\nset.forEach(k => console.log(k));\
  \ ④\nconsole.log(set.entries());\nconsole.log(set.keys()); ⑤\nconsole.log(set.values());\
  \ ⑥\nset.clear(); ⑦\nconsole.assert(set.size === 0);\n```\n\nSet 和 map 一样，表现类似于数组，其中“索引”和该索引处的值是相同的。我们可以向\
  \ set 的 `forEach` 传递一个双参数回调来确认这一点：\n\n```\nset.forEach((k, v) => console.assert(k\
  \ === v))\n```\n\nSet 也提供了一个 `entries` API，表示 set 中的条目。由于 set 中的值充当键，所以这只是一个可以表示为\
  \ `[value, value]` 的两元素数组。同样地，也存在 `keys` 和 `values` API；不过，毫不意外，`keys` API 只是 `values`\
  \ 的别名。\n\n由于 set 是可迭代的，因此它们也是可展开的。考虑到我们有一个接受可迭代对象的构造函数，我们就有了一种便捷的方式来从现有 set 创建新\
  \ set，或者求多个 set 的并集。\n\n- ① 两个 set 的并集\n- ② 重复项会被丢弃\n\n```\nconst colorsOne = new\
  \ Set([\n  'red',\n  'blue',\n]);\nconst colorsTwo = new Set([\n  'yellow',\n  'blue',\n\
  ]);\nconst union = new Set([...colorsOne, ...colorsTwo]); ①\nconsole.assert(union.has('red'));\n\
  console.assert(union.has('blue')); ②\nconsole.assert(union.has('yellow'));\n```\n\
  \n最后，和 map 一样，相等性是通过 `===` 运算符确定的。换句话说，如果我们 `add` 一个值，该值与 set 中任何已有值进行 `===` 检查返回\
  \ `true`，那么这个值就不会被添加到 set 中。\n\n\n\n## 注意事项\n\nSet 在底层*就是*一种 Map，因此进一步探讨只会重复强调：我们针对\
  \ Map 讨论的所有内容都适用于 Set。由于缺少字面量，我们不得不使用构造函数；并且由于 JSON 不支持 Set，与 JSON 之间的转换可能会导致部分信息丢失。\
  \  \nSet 与 Map 在序列化时的唯一区别在于：Set 会被序列化为一个仅包含不同值的数组。\n\n### WeakSet\n\n`WeakSet` 之于\
  \ Set，正如 WeakMap 之于 Map。它提供了一种“弱”引用机制，允许其值在没有其他引用指向该特定值时被垃圾回收。  \n正如预期的那样，WeakSet\
  \ 不提供任何迭代 API，只允许通过 `add` 和 `delete` 方法添加和删除值，并通过 `has` 方法检查是否拥有某个值。其构造函数与 Set 类似，可以在构造时接受一个可迭代对象。\n\
  \nWeakSet 的一个用例是“标记”对象。假设我们需要序列化一个包含循环引用的 JavaScript 对象。`JSON.stringify` 会导致堆栈溢出。在这种情况下，我们必须手动遍历对象及其引用——每次“记录”是否已经见过某个特定对象，如果见过，则不再序列化该引用。可以使用\
  \ WeakMap 来标记已经见过的对象，并且可以确保事后不会有任何悬空引用需要清理。请看：\n\n* ① 如果已经遇到过该键，这里直接 `return`\n\
  * ② 为 `JSON.stringify` 创建一个 replacer 函数\n* ③ 创建一个包含循环引用的对象\n* ④ 这会导致堆栈溢出错误\n* ⑤\
  \ 使用丢弃所有已访问条目的 `replacer` 函数\n\n```\nlet weakSet = new WeakSet();\nconst replacer\
  \ = (key, value) => {\n  if (typeof value === 'object' && value !== null) {\n  \
  \  if (weakSet.has(value)) {\n      // 发现循环引用，丢弃该键\n      return; // ①\n    }\n\
  \    // 将值存入集合\n    weakSet.add(value);\n  }\n  return value;\n}; // ②\nconst rootObj\
  \ = {\n  name: 'rootObj',\n};\nrootObj.children = [{\n  parent: rootObj,\n  name:\
  \ 'childOne',\n  children: [],\n}, {\n  parent: rootObj,\n  name: 'childTwo',\n\
  \  children: [],\n}]; // ③\n// console.log(JSON.stringify(rootObj)); // ④\nconsole.log(JSON.stringify(rootObj,\
  \ replacer, 2)); // ⑤\n// 输出\n// {\n//   \"name\": \"rootObj\",\n//   \"children\"\
  : [\n//     {\n//       \"name\": \"childOne\",\n//       \"children\": []\n// \
  \    },\n//     {\n//       \"name\": \"childTwo\",\n//       \"children\": []\n\
  //     }\n//   ]\n// }\n```\n\n我们首先编写“replacer”函数，该函数将由 `JSON.stringify` 调用。当 `JSON.stringify`\
  \ 遍历作为第一个参数传递给 `stringify` 的对象时，它会调用我们的函数，并将当前尝试转换为字符串表示形式的键和值传递给它。我们的第一项检查是，通过询问内部\
  \ weakset 是否已经包含该键，来判断是否已经“见过”它——如果已经见过，则直接返回。否则，我们*首先*将该键添加到 weakset，然后返回该“值”。当然，我们可以简单地使用一个数组来保存之前见过的引用列表，但那样我们就必须清空该数组或完全解除引用，以确保不会造成内存泄漏。\n\
  \n"
- "# 总结\n\nJavaScript 似乎终于成熟了。我们现在拥有了其他许多语言中习惯使用的四种数据结构。Map 和 Set 填补了之前在 JavaScript\
  \ 中难以原生实现的功能。  \nMap 和 Set 都有一些局限性。然而，这些限制是为了保持语言（和 JSON）的语义而存在的。尽管如此，它们仍然是对该语言的极好补充，使我们开发者能够更好地在代码中表达意图。\n\
  \n在下一章中，我们将探讨增强的对象字面量，并探索 ES6 中引入的一些新的 Object API。\n\n脚注 1 2 3 4 5 6 7\n\n"
- "# 7. 使用增强的对象字面量实现简洁明了的对象\n\nJavaScript 中的字面量对象语法 (`{}`) 是一种强大的机制，允许我们*直接在代码中*描述对象。这种\
  \ `{}` 语法相当优雅且简洁；然而，仍存在一些小问题——定义方法可能略显冗长，添加计算属性也颇麻烦。ES6 极大地增强了此语法，使我们能够*更加*简洁地初始化属性和方法，同时将定义计算属性的能力提升为头等公民。\n\
  \n在本章中，我们将看到这些增强如何使在 JavaScript 中构建对象变得远不那么冗长。我们还将探讨在对象上添加计算属性所允许的新语法，这使得 JavaScript\
  \ 中的元编程变得更容易处理。最后，我们将了解使用尾逗号的好处，以及 ES7 中新增的功能，该功能将其使用范围扩展到了函数定义和调用。在本章结束时，我们的工具包中将增添更多工具，使我们的代码更加一致，且不那么冗长。\n\
  \n## 对象字面量的局限性\n\n在惯用的 JavaScript 代码中，对象字面量语法 `{}` 的使用非常普遍。然而，我们将特别讨论三个缺点：\n\n1.\
  \ getter/setter 与对象方法之间缺乏对称性  \n2. 无法在字面量语法中列出计算属性  \n3. 使用变量定义对象属性时通常伴随的冗长\n\n\
  让我们分别审视这些问题。\n\n\n\n### Getter/Setter 与方法\n\nJavaScript 中的对象除了可以定义方法，还允许定义 `get`\
  \ 和 `set` 访问器。两者的区别在于调用方式——Getter 和 Setter 虽然是函数，但并非作为函数被调用，而是遵循属性的工作方式。请看以下示例，该示例旨在突出两者在使用模式上的差异：\n\
  \n1.  ① 引入属性\n2.  ② 创建 `get` 方法\n3.  ③ 一个 `set` 方法\n4.  ④ 验证输入\n5.  ⑤ 以不同方式存储\n\
  6.  ⑥ 传统方法\n7.  ⑦ 属性查找\n8.  ⑧ 这将产生一个验证错误\n9.  ⑨ 调用 `set` 方法\n10. ⑩ 调用 `get` 方法\n\
  11. ⑪ 调用普通方法\n\n```javascript\nconst song = {\nname: 'Yellow Submarine', ①\nget\
  \ duration() { ②\nconsole.log('Getter is invoked');\nreturn this._duration ? (this._duration\
  \ / 60) : 0;\n},\nset duration(inMin) { ③\nif (inMin <= 0) { ④\nthrow new Error('duration\
  \ of song cannot be less or equal to 0 min');\n}\nconsole.log(`Setter is invoked\
  \ with ${inMin}`);\nthis._duration = inMin * 60; ⑤\n},\ngetName: function () { ⑥\n\
  return this.name;\n},\n};\nconsole.assert(song.name === 'Yellow Submarine'); ⑦\n\
  // song.duration = -1; ⑧\nsong.duration = 3.00; ⑨\nconsole.assert(song.duration\
  \ === 3); ⑩\nconsole.assert(song.getName() === 'Yellow Submarine'); ⑪\n```\n\n可以推测，Getter\
  \ 和 Setter（通常称为“虚拟属性”）允许我们在看似是属性查找的过程中实现钩子。这些钩子可用于多种场景，包括验证和清理输入，或像之前演示的那样在输出时修改属性。当我们比较读取（`get`）和写入\
  \ `duration` 与调用 `getName` 方法时，这种差异就显而易见了。\n\n关键在于，尽管它们都被定义为对象的方法，但定义 Getter/Setter\
  \ 与定义方法的方式缺乏对称性。前者采用了优雅甚至对于其他语言背景的开发者来说可能熟悉的语法，而后者则继续沿用传统的键值语法。\n\n### 在对象字面量上定义计算属性\n\
  \nJavaScript 中的对象还允许在运行时“计算”键名，这为 JavaScript 提供了一定程度的元编程能力。为了在对象上添加一个计算属性，我们需要对现有对象使用“方括号”（或下标）表示法，如下所示：\n\
  \n1.  ① 一个从属性生成方法名的函数\n2.  ② 将给定属性的名称首字母大写\n3.  ③ 使用下标语法将计算出的方法名添加到对象上\n\n```javascript\n\
  const getterFor = (prop) => { ①\nconst capitalized = prop.charAt(0).toUpperCase()\
  \ + prop.slice(1); ②\nreturn `get${capitalized}`;\n};\nconst song = {\nname: 'All\
  \ You Need Is Love',\nalbum: 'Yellow Submarine',\n};\nsong[getterFor('name')] =\
  \ function() { ③\nreturn song['name'];\n};\nsong[getterFor('album')] = function()\
  \ {\nreturn song['album'];\n};\nconsole.assert(song.getName() === song.name);\n\
  console.assert(song.getAlbum() === song.album);\n```\n\n在这个例子中，我们从一个简单的辅助函数开始，该函数根据给定的属性名称计算出\
  \ Getter 的名称。对于属性 `name`，`getterFor('name')` 会直接返回 `getName`。\n\n正如我们所看到的，方括号表示法提供了一种计算即将成为对象键名的*表达式*的方法，并将其附加到对象上。然而，我们必须在\
  \ `{}` 对象表示法之外执行此操作，因为该语法不允许我们像定义其他属性那样内联操作。这迫使我们不得不在多个不同的地方分散定义“完整”的对象。\n\n###\
  \ 使用变量定义对象属性\n\n地道的 JavaScript *无处不在*地使用对象字面量，从使用“揭示模块模式”封装私有成员并暴露公共 API，到 Node.js\
  \ 的 `exports`。这种使用对象字面量的方式常常会导致大量代码重复。请看：\n\n1.  ① 一个私有成员变量\n2.  ② 一个私有函数\n3.  ③\
  \ 在对象字面量上暴露特定的公共 API\n4.  ④ 将对象创建包装在 IEFE（立即执行函数表达式）中，以将私有成员封装在函数作用域内\n\n```javascript\n\
  const greeter = (function () {\nlet greeting = 'Hello'; ①\nconst exclaim = msg =>\
  \ `${msg}!`; ②\nconst greet = name => exclaim(`${greeting} ${name}`);\nconst salutation\
  \ = (newGreeting) => {\ngreeting = newGreeting;\n};\nreturn {\ngreet: greet,\nsalutation:\
  \ salutation,\n}; ③\n}()); ④\nconsole.assert(greeter.greet('Mason') === 'Hello Mason!');\n\
  greeter.salutation('Hola');\nconsole.assert(greeter.greet('Micah') === 'Hola Micah!');\n\
  ```\n\n揭示模块模式利用了函数会引入作用域这一特性。我们从一个“立即执行函数表达式”（IEFE）开始。在 IEFE 内部，我们可以自由定义任意数量的“私有”成员和函数，它们都被限定在封闭函数的作用域内。在\
  \ IEFE 的末尾，我们通过字面量语法创建一个新对象，并将其属性指向需要作为公共 API 一部分的成员。正如我们所观察到的，这种实现方式存在相当多的重复，例如\
  \ `greet: greet`。如果这是一个更复杂的实现，那么它不仅会显得冗长，而且也容易出错。\n\n现在，我们已经了解了对象字面量的一些用例，接下来让我们探讨\
  \ ES6 如何尝试通过“增强的”对象字面量语法来克服这些问题。\n\n## 增强的对象字面量语法\n\nES6 中对对象字面量语法的增强，旨在简化我们在字面量对象定义中定义属性和方法的方式。\n\
  \n### 方法定义简写\n\n对象字面量语法为字面量内的方**法定义**引入了一种简写形式，使其与 Getter/Setter 的定义保持一致。我们重新回顾前面的示例，这次使用简写形式：\n\
  \n1.  ① 使用方法简写定义一个普通函数\n2.  ② 定义一个接收参数的方法\n\n```javascript\nconst song = {\nname:\
  \ 'Yellow Submarine', ①\nget duration() { ②\nconsole.log('Getter is invoked');\n\
  return this._duration ? (this._duration / 60) : 0;\n},\nset duration(inMin) { ③\n\
  if (inMin <= 0) { ④\nthrow new Error('duration of song cannot be less or equal to\
  \ 0 min');\n}\nconsole.log(`Setter is invoked with ${inMin}`);\nthis._duration =\
  \ inMin * 60; ⑤\n},\ngetName() { ①\nreturn this.name;\n},\nsetName(name) { ②\nthis.name\
  \ = name;\n},\n};\nconsole.assert(song.getName() === 'Yellow Submarine');\nsong.setName('All\
  \ You Need Is Love');\nconsole.assert(song.getName() === 'All You Need Is Love');\n\
  ```\n\n这个例子与我们之前尝试的版本并无不同——但是，`getName`（和 `setName`）的定义显著地不那么冗长了。`:` 和 `function`\
  \ 关键字已经消失，剩下的只是方法实现。现在，我们发现字面量上的任何方法定义之间（无论是 Getter/Setter 还是普通方法）都达到了对称。\n\n\n\n\
  ### 计算属性值\n\n计算属性值的增强特性让我们能够在字面量语法内部定义计算属性，从而避免将字面量的定义分散在代码库的不同位置。我们回到之前的示例，不过这次改用内联计算属性：\n\
  \n- ① 一个根据属性创建名称的函数\n- ② 拆分名称以获取第一个字符\n- ③ 内联计算属性的定义\n\n```\nconst getterFor = (prop)\
  \ => { ①\nconst capitalized = prop.charAt(0).toUpperCase() + prop.slice(1); ②\n\
  return `get${capitalized}`;\n};\nconst song = {\nname: 'All You Need Is Love',\n\
  album: 'Yellow Submarine',\n[getterFor('name')]() { ③\nreturn song.name;\n},\n[getterFor('album')]()\
  \ {\nreturn song.album;\n},\n};\nconsole.assert(song.getName() === song.name);\n\
  console.assert(song.getAlbum() === song.album);\n```\n\n这一增强特性让我们可以像往常一样定义计算属性，即使用方括号语法，只不过方括号现在出现在字面量内部，使它们与其他属性定义一样成为一等公民。新的语法还沿用了方法定义简写引入的对称性，让我们可以省略多余的\
  \ `function` 关键字。同样地，如果我们要定义的是属性而非方法，熟悉的 `key:value` 语法在这里同样适用，与传统键名不同的是，计算键名仍需要用方括号括起来。因此，计算属性的等价写法是\
  \ `[computedKey]:value`。\n\n### 属性值简写\n\n属性值简写并不是定义属性（和方法）的新方式，而是提供了一种减少“揭示模块模式”或\
  \ node `exports` 中常见冗余代码的方法。它允许我们仅在键名与作用域中现有变量名匹配时，压缩对象字面量中键值对的定义。\n\n我们重新审视揭示模块模式的定义，这次使用属性值简写：\n\
  \n- ① 使用属性值简写\n\n```\nconst greeter = (function() {\nlet  greeting = 'Hello';\n\
  const exclaim = msg => `${msg}!`;\nconst greet = name => exclaim(`${greeting} ${name}`);\n\
  const salutation = (newGreeting) => {\ngreeting = newGreeting;\n};\nreturn {\ngreet,\
  \ ①\nsalutation,\n};\n// 等价于\n/*\nreturn {\ngreet: greet,\nsalutation: salutation\n\
  }\n*/\n}());\nconsole.assert(greeter.greet('Mason') === 'Hello Mason!');\ngreeter.salutation('Hola');\n\
  console.assert(greeter.greet('Micah') === 'Hola Micah!');\n```\n\n在这个例子中，（返回的）模块中引入的属性（键）与其值同名——现在我们就可以使用简写语法来消除这种重复。当然，如果需要，我们也可以将属性值简写与熟悉的\
  \ `key:value` 记号混合使用。当返回对象中某些键的名称与作用域中任何变量的名称**不**匹配时，这种方式会非常方便。\n\n这看似微小的优化，但如果将其推广到大型模块，或许我们就能看出可以避免多少重复，从而遵循\
  \ DRY 原则，并避免因拼写错误而引入潜在 bug。\n\n### 尾逗号的情况\n\nJavaScript 已经允许在数组和对象字面量中使用“尾逗号”：\n\
  \n- ① 数组字面量中的尾逗号\n- ② 对象字面量中的尾逗号\n\n```\nconst friedmanBooks = [\n'The Little Schemer',\n\
  'The Seasoned Schemer',\n'The Reasoned Schemer', ①\n];\nconst hoyteBook = {\nname:\
  \ 'Let Over Lambda',\nauthor: 'Doug Hoyte',\nisbn10: '1435712757', ②\n};\n```\n\n\
  尾逗号这个特性看似微不足道，但它具有强大的功效。它使我们的代码保持一致性，让数组或对象定义中的每一行看起来都一样。这使得字面量中项目的重新排序变得容易，并且在版本控制系统中添加或删除项目（尤其是在字面量的末尾）时，会产生更清晰的差异对比。\n\
  \nES7 将尾逗号引入到函数参数列表和函数调用中：\n\n- ① 函数参数列表中的尾逗号\n- ② 函数调用中的尾逗号\n\n```\nconst rate\
  \ = (\nbook,\nstarCount, ①\n) => `You rated '${book}' ${starCount} stars`;\nconst\
  \ rating = rate(\n'Practical Common Lisp',\n5, ②\n);\n// 输出 'You rated 'Practical\
  \ Common Lisp' 5 stars'\nconsole.log(rating);\n```\n\n这一添加旨在实现一致性，从而使函数定义和调用也能享受尾逗号的所有好处。\n\
  \n表面上看，尾逗号只有在元素单独成行时才有价值。因此，建议仅在元素（或对象属性）独占一行时强制执行尾逗号。大多数像 `ESLint` 这样的代码检查工具都可以配置为仅在多行声明中标记缺失的尾逗号。\n\
  \n"
- '# 总结


  ES6 引入了一系列新的语法和 API，使得创建新对象（无论是通过字面量还是基于现有对象）变得更加简单、简洁且不易出错。


  在下一章中，我们将探索 `Symbol`——ES6 引入的一种新的原始类型，它通常与增强的字面量语法结合使用，既可作为在对象中引入“唯一”键的机制，也可通过元编程来修改对象的行为。


  '
- "# 8. 隐藏在 Symbol 背后\n\n## 简介\n\nJavaScript 对象中的属性命名存在一个主要障碍，尤其是在使用第三方库或框架时，那就是属性名冲突。我们不得不接受这样的限制：在变量和属性的命名方式上会受到约束。诸如“不要使用\
  \ `$` 前缀作为变量、属性和方法的名称。此前缀为 `<插入框架/库名称>` 所保留”这样的警告屡见不鲜，而我们也只能坦然接受。\n\n好了，这种情况不会再发生了！\n\
  \n在本章中，我们将看到 ES6 引入的一种新数据类型——`Symbol`，如何帮助我们消除这一障碍，摆脱这种约束，让我们能够随心所欲地设计对象，并且知道在任何我们想要使用的环境中，都不会受到任何限制。我们还将看到如何使用\
  \ `Symbol` 来修改内置操作（如 `String.match` 和 `String.split`）的行为。在本章结束时，我们将从强制命名约定的专制中解放出来，与所有库和框架，更不用说\
  \ JavaScript 本身，和谐共处，如同一个快乐的大家庭。\n\n\n\n## 无法强制执行契约\n\n假设我们在代码中使用了某个第三方库，它暴露了一个函数，要求你提供的对象必须包含一个**特定**名称的属性。来看一个简单的例子：\n\
  \n* ① 方便的 `const` 让事情更简单\n* ② 查找该实现期望在传入对象上找到的属性\n* ③ 在简单对象上添加一个属性，以便 `simpleLogger`\
  \ 能使用它\n* ④ 另一个恰好拥有 `log` 属性的对象\n* ⑤ 现在我们该怎么办？\n\n```\nconst LOG_LEVEL = 'log';\
  \ ①\nconst DEBUG = 'DEBUG';\nconst INFO = 'INFO';\nconst ERROR = 'ERROR';\nconst\
  \ simpleLogger = (obj, msg) => {\nlet returnMsg;\nswitch (obj[LOG_LEVEL]) { ②\n\
  case DEBUG:\nreturnMsg = `DEBUG: ${msg}`;\nbreak;\ncase INFO:\nreturnMsg = `INFO:\
  \ ${msg}`;\nbreak;\ncase ERROR:\nreturnMsg = `ERROR: ${msg}`;\nbreak;\ndefault:\n\
  throw new Error('无效的日志级别');\n}\nconsole.log(returnMsg);\nreturn returnMsg;\n};\n\
  const loggableObj = {\n[LOG_LEVEL]: INFO, ③\n};\nsimpleLogger(loggableObj, 'this\
  \ is a test');\nconst someOtherObject = {\nlog: '这只是一个普通属性', ④\n};\n// simpleLogger(someOtherObject,\
  \ 'some message') ⑤\n```\n\n在这个例子中，这个库函数期望传入的任何对象都必须有一个名为 `log` 的属性。库很贴心地提供了一个 `const`，我们可以结合增强的字面量语法，将合适的属性添加到我们的对象上。在内部，`simpleLogger`\
  \ 函数会检查 `log` 属性以确定日志级别，然后打印出相应的消息。\n\n但是，如果我们自己的对象已经有了一个名为 `log` 的属性，而它用于完全不同的目的，该怎么办？也就是说，我们对\
  \ `log` 属性的预期用途与函数期望的使用方式发生了冲突。于是，我们只能选择要么替换掉自己的属性来满足库的需求，要么就不用这个库。这两种选择似乎都不太理想。\n\
  \n这里的问题在于，虽然我们有 `const`，可以安全地引用一个“名称”，从而总能得到正确的*值*，但字符串以及由此衍生的对象键（无论是属性还是方法）*确实可能*发生冲突！这就是为什么很多在其它对象上引入和/或期望“特殊”属性的库会采用命名惯例——比如给注入的属性加上\
  \ `_` 或 `$` 前缀，并规定使用该库的开发者**不**应在自己的代码中使用相同的前缀。看看 AngularJS 风格指南，它明确指出了以下几点：\n\n\
  > *不要对变量、属性和方法的名称使用 $ 前缀。此前缀保留给 AngularJS 使用。*\n\n这里的两难困境在于，为了满足我们的需求，我们需要一种方法来定义一个*不可能*发生冲突的名称，换句话说，就是一个真正独一无二的名称，它不会、也不能以任何方式与任何现有的名称或属性发生冲突。此外，我们希望做到这一点，而无需强制推行编码策略，或者更糟的是，使用某种晦涩的命名策略（比如使用\
  \ UUID）来避免冲突！\n\n## Symbol 来救场\n\nSymbol 是 ES6 中引入的一种**新**的原始类型。与其他原始类型类似，Symbol\
  \ 有一个包装类型，名为 `Symbol`，它提供了一个工厂函数来初始化新的 Symbol。与 `String` 等其他包装对象不同，我们**不能**使用 `new`\
  \ 来创建 Symbol——也就是说，使用 `new Symbol()` 会导致错误。让我们看一段代码片段，了解如何初始化 Symbol：\n\n* ① 使用工厂函数创建一个新的\
  \ Symbol\n* ② 两个 Symbol 永远不会相等\n* ③ 出于调试目的，可以为 Symbol 提供一个描述\n* ④ Symbol 有一个 `toString`\
  \ 实现，如果提供了描述，它会显示该描述\n\n```\nconst symbol1 = Symbol();\nconst symbol2 = Symbol();\
  \ ①\nconsole.assert(symbol1 !== symbol2); ②\nconst symbol3 = Symbol('unique'); ③\n\
  // 打印 Symbol(unique)\nconsole.log(symbol3); ④\n```\n\n`Symbol` 初始化器可以接受一个描述；然而，这个描述对创建的\
  \ Symbol 本身没有影响，只对调试有用。\n\n两个 Symbol **永远**不会相等——每一次调用 `Symbol` 初始化器都会返回一个新的、唯一的\
  \ Symbol 实例。即使提供的描述相同也是如此（因为正如我们讨论过的，提供给初始化函数的字符串仅仅是为了调试）。\n\n所以，现在我们有了创建唯一“事物”的方法。这如何帮助我们解决命名冲突呢？\n\
  \n原来，我们可以将 Symbol 用作对象中的键！让我们先看看如何使用 Symbol 和字符串在对象上定义属性：\n\n* ① 定义一个 Symbol\n*\
  \ ② 一个只有 `name` 属性的普通 JavaScript 对象\n* ③ 无冲突地添加上 `iterable` 属性\n* ④ 这个对象已经有一个名为\
  \ `iterator` 的属性\n* ⑤ 我们仍然可以无冲突地添加一个描述为 `iterator` 的 Symbol\n\n```\nconst ITERATOR\
  \ = Symbol('iterator'); ①\nconst iterableObject = {\nname: 'iterable',\n}; ②\niterableObject[ITERATOR]\
  \ = function() {\nreturn '我是可迭代的';\n}; ③\nconst objWithExistingKey = {\niterator:\
  \ '一些值',\n}; ④\nobjWithExistingKey[ITERATOR] = () => '成功了！'; ⑤\n```\n\n注意，我们首先创建了一个\
  \ Symbol——然后我们使用那个*引用*作为对象属性的名称，以及用于查找。如示例所示，我们可以使用下标语法在现有对象上添加新属性，就像我们对任何表达式所做的那样。最后，一个对象可以同时拥有字符串和\
  \ Symbol 作为其属性，即使属性的名称与 Symbol 的描述相匹配。\n\n利用我们新学的知识，让我们重新审视 `simpleLogger`，看看如何使用\
  \ Symbol 将行为“洒”到对象上，而在此之前我们只能屈从于命名冲突的后果。\n\n* ① 将 `LOG_LEVEL` 定义为一个 Symbol\n* ②\
  \ 在 switch 中查找所需的属性\n* ③ 使用 Symbol 引用引入一个属性\n* ④ 现在它能工作了！\n\n```\nconst LOG_LEVEL\
  \ = Symbol('log'); ①\nconst DEBUG = 'DEBUG';\nconst INFO = 'INFO';\nconst ERROR\
  \ = 'ERROR';\nconst simpleLogger = (obj, msg) => {\nlet returnMsg;\nswitch (obj[LOG_LEVEL])\
  \ { ②\ncase DEBUG:\nreturnMsg = `DEBUG: ${msg}`;\nbreak;\ncase INFO:\nreturnMsg\
  \ = `INFO: ${msg}`;\nbreak;\ncase ERROR:\nreturnMsg = `ERROR: ${msg}`;\nbreak;\n\
  default:\nthrow new Error('无效的日志级别');\n}\nconsole.log(returnMsg);\nreturn returnMsg;\n\
  };\nconst loggableObj = {\nlog: '这只是一个普通属性',\n[LOG_LEVEL]: INFO, ③\n};\nsimpleLogger(loggableObj,\
  \ 'this is a test'); ④\n```\n\n这个例子强调了如何利用 Symbol 在新对象或现有对象上引入无冲突的属性。\n\n使用 Symbol\
  \ 来定义“接口”或“契约”属性，使得库和函数的编写者无需强制规定编码规范，同时允许使用这些库的客户端按照自己的意愿设计对象，并且能够使用这些库而无需担心冲突。\n\
  \n双赢！\n\n\n\n## 符号（Symbol）与 Switch-case 语句\n\n我们可以考虑另一种使用场景，其中使用唯一值（符号）有助于减少潜在的代码错误。我们经常使用字符串来标识“唯一性”，而\
  \ switch-case 等语言结构则利用这一点来辅助程序流程。请看以下示例：\n\n- ① 定义辅助常量\n- ② 对字符串属性执行 switch case\
  \ 判断\n- ③ 引入一个误导性常量\n- ④ 将该误导性常量用作新对象中的日志级别\n- ⑤ 输出结果与预期不符\n\n```\nconst LOG_LEVEL\
  \ = Symbol('log');\nconst DEBUG = 'DEBUG'; ①\nconst INFO = 'INFO';\nconst ERROR\
  \ = 'ERROR';\nconst simpleLogger = (obj, msg) => {\nlet returnMsg;\nswitch (obj[LOG_LEVEL])\
  \ { ②\ncase DEBUG:\nreturnMsg = `DEBUG: ${msg}`;\nbreak;\ncase INFO:\nreturnMsg\
  \ = `INFO: ${msg}`;\nbreak;\ncase ERROR:\nreturnMsg = `ERROR: ${msg}`;\nbreak;\n\
  default:\nthrow new Error('Invalid LOG_LEVEL');\n}\nconsole.log(returnMsg);\nreturn\
  \ returnMsg;\n};\nconst MY_LEVEL = 'ERROR'; ③\nconst loggableObj = {\nlog: 'this\
  \ is just an ordinary property',\n[LOG_LEVEL]: MY_LEVEL, ④\n};\n// 输出 'ERROR: this\
  \ is a test'\nsimpleLogger(loggableObj, 'this is a test'); ⑤\n```\n\n只有敏锐的读者才能意识到这里发生了什么。我们引入了一个误导性常量，即值为\
  \ `\"ERROR\"` 的 `MY_LEVEL`，并将其作为 `LOG_LEVEL` 赋值给一个对象。这样做之所以有效，是因为在 `simpleLogger`\
  \ 函数内部，switch-case 语句判断的是*相等性*，由于传入的 `LOG_LEVEL` 恰好是我们已知的一个值，因此匹配到了 `ERROR` 分支。然而，我们没有抛出错误，反而成功记录了一条错误信息。这里的问题在于，虽然字符串*确实是*值，但两个独立构造的字符串如果碰巧拥有相同大小写的字符集，它们就可以是相等的！\n\
  \n理想情况下，我们希望能够创建真正唯一的、可供我们进行切换判断的值。实际上，JavaScript 中的 `switch` 语句仅仅是使用 `===` 相等运算符来查找匹配的\
  \ `case` 分支！再次，符号（Symbol）前来救场。\n\n- ① 将辅助常量定义为符号而非字符串\n- ② 注意 switch case 语句**没有**变化\n\
  - ③ 其工作方式与使用字符串时完全相同\n\n```\nconst LOG_LEVEL = Symbol('log');\nconst DEBUG = Symbol('DEBUG');\
  \ ①\nconst INFO = Symbol('INFO');\nconst ERROR = Symbol('ERROR');\nconst simpleLogger\
  \ = (obj, msg) => {\nlet returnMsg;\nswitch (obj[LOG_LEVEL]) { ②\ncase DEBUG:\n\
  returnMsg = `DEBUG: ${msg}`;\nbreak;\ncase INFO:\nreturnMsg = `INFO: ${msg}`;\n\
  break;\ncase ERROR:\nreturnMsg = `ERROR: ${msg}`;\nbreak;\ndefault:\nthrow new Error('Invalid\
  \ LOG_LEVEL');\n}\nconsole.log(returnMsg);\nreturn returnMsg;\n};\nconst loggableObj\
  \ = {\nlog: 'this is just an ordinary property',\n[LOG_LEVEL]: ERROR,\n};\n// 输出\
  \ 'ERROR: this is a test'\nsimpleLogger(loggableObj, 'this is a test'); ③\n```\n\
  \n回想一下，符号是唯一的，每次调用初始化函数 `Symbol` 都会创建一个新的、唯一的符号对象，它不等于任何其他符号（即使是那些拥有相同描述字符串的符号）。在我们最新的迭代中，我们使用符号作为键来唯一标识\
  \ `LOG_LEVEL`，同时也用作其值，现在我们就能保证其唯一性了。\n\n## 全局注册表\n\n关于 `Symbol`，还有另一个方面我们需要讨论，那就是全局符号注册表。我们可以将符号注册表视为一个符号池——你可以在池中创建并放入一个符号，并在之后检索它。\n\
  \n要从池中创建或获取一个符号，我们使用 `Symbol.for`。`Symbol.for` 需要提供一个“键”，如果注册表中**不**存在具有该键的符号，则会创建一个新符号。否则，将从注册表中检索具有相同键的符号，具体如下：\n\
  \n- ① 使用 `for` 定义一个符号——在这种情况下，会创建一个新符号\n- ② 使用相同的“键”查找一个符号——这只是一个“获取”操作\n- ③ 它们是相等的\n\
  \n```\nconst global = Symbol.for('globally visible'); ①\nconst otherGlobal = Symbol.for('globally\
  \ visible'); ②\n// 输出 'true'\nconsole.log(global === otherGlobal); ③\n```\n\n事实证明，对于全局注册表中的符号，*正是*这个键来标识符号——如果两个引用都使用相同的键通过\
  \ `for` 查找符号，它们将指向同一个符号。\n\n我们也可以反向操作——给定一个符号，我们可以使用 `Symbol` 上的 `keyFor` 方法获取其键。\n\
  \n- ① 使用 `for` 定义一个符号——在这种情况下，会创建一个新符号\n- ② 查找特定符号的键\n\n```\nconst global = Symbol.for('a\
  \ unique key'); ①\nconst key = Symbol.keyFor(global); ②\n// 输出 'true'\nconsole.log(key\
  \ === 'a unique key');\n```\n\n你可能会问——这有什么意义？如果我们想要跨“领域”共享符号（符号是引用类型，不同于字符串、数字和布尔值这些原始类型），那么这个池就是必需的。^(⁵¹)\
  \ 领域是一个全局上下文，例如存在于 iframe 中的上下文。因此，在网页中运行的 JavaScript 代码与在嵌入的 iframe 中运行的代码，或在 Service\
  \ Worker 中运行的代码，处于不同的领域。如果我们想要将符号用作跨领域的全局标识符或属性名，那么全局符号注册表就是你的得力助手。\n\n当然，要标识全局注册表中的符号，我们需要一个键。总有可能出现两段不同的代码（甚至运行在不同领域中的代码）使用相同的键（出于不同目的）来创建符号。因此，如果我们打算使用全局注册表，就有必要适当地对这些标识符进行“命名空间”化处理。\n\
  \n\n\n## 众所周知的符号\n\nJavaScript 提供了一组有用的符号，作为“静态”属性附加在 `Symbol` 类型上。这些“众所周知的符号”的主要目的是允许我们开发者自定义某些算法如何与我们的对象协作。\n\
  \n让我们退一步，重新审视一下我们之前学到的知识。第一，符号允许我们在对象上引入无冲突的属性；第二，库函数的作者现在可以自由地组合他们定义的一系列符号，并且*要求*我们，如果希望使用该库，就在我们的对象中使用这些符号。\n\
  \n那么，通过众所周知的符号，JavaScript 这门语言*本身*就是一个库！\n\n让我们通过一个具体例子来阐明这一点。JavaScript 字符串有一个叫\
  \ `split` 的方法，它接收一个分隔符（以及一个可选的限制参数），会在分隔符处将字符串拆分，并返回一个由各个子字符串组成的数组。\n\n- ① 定义一个包含用户名和密码编码的\
  \ URL\n- ② 使用正则表达式提取用户名和密码组合\n\n```javascript\nconst url = 'https://admin:supersecret@gitlab.com/looselytyped/sample-repo.git';\
  \ ①\nconst split = url.match(/\\w+:\\w+/); ②\n// 输出\n// [\n//   'admin:supersecret',\n\
  //   index: 8,\n//   input: 'https://admin:supersecret@gitlab.com/looselytyped/sample-repo.git',\n\
  //   groups: undefined\n// ]\nconsole.log(split);\n```\n\n我们使用一个简单的正则表达式来提取 URL\
  \ 字符串中编码的用户名和密码。但问题是，密码是以明文形式显示的！如果我们想在将每个匹配项放入数组之前更改或增强它们，该怎么办？\n\n显而易见的解决方案是，在使用正则表达式匹配到密码*之后*，再对其进行混淆处理。然而，这将提取用户名和密码的操作与密码混淆的操作分离开了。\n\
  \n或许我们可以在 `match` 阶段*同时*完成密码混淆。事实证明，`String.match` 方法可以接收一个对象作为参数（而不是正则表达式），并且如果传入的对象实现了一个方法，其名称计算结果为\
  \ `Symbol.match`，那么 `String.match` 就会简单地将调用转发给那个方法。请看示例：\n\n- ① 定义一个自定义对象\n- ② 使用\
  \ `Symbol.match` 在该对象上定义一个方法\n- ③ 从匹配结果中提取用户名\n- ④ 返回一个新数组，包含用户名并混淆密码\n- ⑤ 将自定义匹配器提供给\
  \ `match` 方法\n\n```javascript\nconst passwordObfuscator = { ①\n  regex: /\\w+:\\\
  w+/,\n  Symbol.match { ②\n    const creds = str.match(this.regex);\n    if (creds)\
  \ {\n      const [username] = creds[0].split(':'); ③\n      return [\n        `${username}:***********`,\
  \ ④\n      ];\n    }\n    return creds;\n  },\n};\nconst url = 'https://admin:supersecret@gitlab.com/looselytyped/sample-repo.git';\n\
  const credentials = url.match(passwordObfuscator); ⑤\n// 输出 'obfuscated credentials\
  \ [ 'admin:***********' ]'\nconsole.log('obfuscated credentials', credentials);\n\
  ```\n\n我们定义了一个对象，并使用增强的对象字面量语法，添加了一个名称计算结果为 `Symbol.match` 的方法。通过实现 `Symbol.match`，我们的对象遵守了\
  \ `String.match` 期望的契约。现在 `match` 可以将匹配操作委托给我们的对象——它不再自己执行匹配，而是简单地调用 `passwordObfuscator[Symbol.match]`。在我们的实现内部，我们首先从字符串中提取用户名（碰巧又使用了\
  \ `match`，但这次提供给它的是一个正则表达式），混淆密码，然后返回结果。\n\n诚然，这个例子远未达到生产级标准，但它确实有助于说明我们如何利用这些众所周知的符号来修改\
  \ JavaScript 中现有 API 的行为。\n\n`Symbol` 对象还有许多其他静态成员，用于改变 JavaScript 处理我们对象的方式。比如\
  \ `Symbol.iterator`，我们很快会在讨论生成器和迭代器时看到它。还有 `Symbol.primitive`，它允许我们定义 JavaScript\
  \ 如何将一个对象强制转换为原始值。你可以在 MDN Web 文档的 Symbol 参考[页面](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Symbol)上找到所有这些符号的列表。\n\
  \n## 并非私有\n\n如果我们取出任何一个对象，并使用 `Object.keys`（列出对象所有可枚举的键）或 `Object.getOwnPropertyNames`（列出所有键，包括不可枚举的）来遍历其成员，我们会发现使用符号定义的成员不会被列出。让我们通过一个简单的演示来测试这一点：\n\
  \n- ① 定义一个带有字符串键的对象\n- ② 使用符号定义另一个键\n- ③ 定义第三个不可枚举的键\n- ④ 检查键\n\n```javascript\n\
  const obj = {\n  a: 'a simple property', ①\n  [Symbol()]: 'a symbol property', ②\n\
  };\nObject.defineProperty(obj, 'nonenumerable', { ③\n  value: 'an unenumerable property',\n\
  \  enumerable: false,\n});\n// 只列出 'a'\nconsole.log(Object.keys(obj));\n// 列出 'a'\
  \ 和 'nonenumerable'\nconsole.log(Object.getOwnPropertyNames(obj));\n// 也只列出 'a'\n\
  console.log(JSON.stringify(obj)); ④\n```\n\n我们定义了一个具有多个键的对象——一个传统的键值对，另一个碰巧是符号，最后第三个是使用\
  \ `Object.defineProperty` 并将 `enumerable` 标志设置为 false 来定义的。运行这个例子表明，我们无法在对象上看到符号属性。\n\
  \n虽然这*似乎*暗示符号键是私有的，并且就我们使用传统的自省机制（如 `JSON.stringify`）而言，它们确实是“私有的”。\n\n然而，这并不意味着它们就是私有的，而且允许对象拥有私有键也不是符号属性的目的。ES6\
  \ 引入了另一个 API，即 `Object.getOwnPropertySymbols`，它可以列出对象上存在的所有符号属性。继续，在我们的例子上尝试一下，你会发现它确实列出了那一个符号属性。\n\
  \n总之，通过组合使用 `Object` 上的方法，我们可以梳理出任何对象上存在的*所有*属性。\n\n"
- '# 总结


  在本章中，我们深入探讨了一种新的原始类型，即符号。我们研究了使用传统键的一些限制，即存在冲突的风险，以及如何使用符号来定义真正的唯一标识符。我们还看到，全局符号注册表允许我们定义和查询符号，甚至跨越
  JavaScript 领域。我们简要了解了如何修改 JavaScript（或任何其他 API）与我们的对象交互的方式，使用符号作为在调用者和被调用者之间实现“契约”的手段。最后，我们以符号虽然看似私有但实际上并非真正私有这一结论收尾。


  在下一章中，我们将了解一种遍历集合的机制，以及如何生成和使用惰性计算与序列。


