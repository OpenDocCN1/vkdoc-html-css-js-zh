  \n在本章中，我们将熟悉一种用于函数表达式的新语法，也称为 ES6 引入的“箭头”函数。我们将看到如何通过更短的语法使我们的代码富有表现力，从而清晰地表达我们的意图。我们的讨论将包括箭头函数的行为与常规函数有何不同，从而使我们能够辨别在何时最好地使用箭头函数。在本章结束时，你将渴望回到你的代码库，因为你知道你可以自信地消除任何不必要的冗余，留下的是……嗯，我们姑且称之为诗，好吗？\n\
  \n## 重新评估函数定义的冗余性\n\n在 ES5 中，我们可以使用几种结构来定义函数，两种主要机制是函数语句和函数表达式。本章的重点将是函数表达式；然而，我有必要详细阐述两者之间的语法差异。考虑以下函数*语句*。\n\
  \n- ① 一个函数语句\n- ② 打印 `function`\n- ③ 打印 `identity`\n\n```javascript\nfunction identity(n)\
  \ { ①\nreturn n;\n}\n// 调用它\nconsole.assert(identity(42) === 42);\n// 检查它\nconsole.assert((typeof\
  \ identity) === 'function'); ②\nconsole.assert(identity.name === 'identity'); ③\n\
  ```\n\n函数语句要求为新创建的函数提供一个名称；否则，我们以后如何调用它？从我们对新定义函数的检查可以看出，它*是* `function` 类型。函数是\
  \ `Function` 类型的对象，相应地，它们具有我们可以查询的属性，例如它们的 `name` 和 `length`。^(¹⁵)\n\n现在我们将看看同一个函数，这次是使用函数表达式定义的。\n\
  \n- ① 一个函数表达式\n- ② 打印 `function`\n- ③ 打印 `identity`\n\n```javascript\nconst identity\
  \ = function(n) { ①\nreturn n;\n};\n// 调用它\nconsole.assert(identity(42) === 42);\n\
  // 检查它\nconsole.assert((typeof identity) === 'function'); ②\nconsole.assert(identity.name\
  \ === 'identity'); ③\n```\n\n正如我们所见，这也定义了一个函数，其行为与使用语句定义的函数完全相同。我们没有为函数提供名称，而是将表达式的值赋给一个变量，或者在这个例子中，赋给一个\
  \ `const`。这个函数与使用语句定义的函数相同，因此行为也相同。\n\n然而，不同之处在于它们是如何被加载的。函数语句在任何代码执行之前被加载。这意味着你可以任意位置定义函数语句，并在任意位置使用它——你甚至可以在将其定义为函数语句之前调用该函数。另一方面，函数表达式涉及对变量的赋值，正如我们从上一章所了解的，这些赋值受提升规则约束。因此，在将变量*赋值*给函数表达式*之前*使用该变量将导致错误。请注意：\n\
  \n- ① 允许在实际定义之前使用定义为语句的函数\n- ② 一个函数语句\n- ③ 在实际定义之前使用定义为表达式的函数会导致错误\n- ④ 一个函数表达式\n\
  \n```javascript\n// 在定义之前调用它\nfnStatement(); ①\nfunction fnStatement() { ②\nconsole.log('I\
  \ am a function statement');\n}\n// 调用它\nfnStatement();\n// fnExpression(); ③\n\
  const fnExpression = function () { ④\nconsole.log('I am a function expression');\n\
  };\n// 调用它\nfnExpression();\n```\n\n选择将函数定义为语句还是表达式很大程度上是品味问题。但是考虑到函数表达式允许我们省略函数名称，它们往往比语句对应的函数稍微简洁一些。然而，有时即使是这种相对简洁的函数表达式语法也常常被证明是相当冗长的。考虑这样一个场景，我们尝试对\
  \ `Array` 的元素进行一系列操作以得出最终值：\n\n- ① 将数组中的每个数字乘以三\n- ② 仅过滤出偶数\n- ③ 将结果归约为它们的和\n\n\
