  \ {\nreturn n * 3; ①\n})\n.filter(function(n) {\nreturn (n % 2) === 0; ②\n})\n.reduce(function(acc,\
  \ n) {\nreturn acc + n; ③\n}, 0);\n```\n\n这个例子可能有点老套；然而，它确实突显了即使编写最简单的函数所涉及的形式化流程。因此，很难解析出我们*实际*想要完成什么。这经常导致开发者将回调提取到（命名的）函数语句中，这不仅更加冗长，而且最终会使代码分散，使得更难以理解我们试图完成的任务。\n\
  \n箭头函数来救场了！\n\n## 箭头函数\n\n箭头函数（有时称为“胖”箭头函数——你会看到这些术语可以互换使用）为我们提供了一种更加简洁的函数定义语法。让我们从探索箭头函数的语法开始。\n\
  \n### 语法\n\n箭头函数消除了函数表达式带来的大量冗余。让我们通过一个简单的例子来吊起胃口：\n\n```javascript\nconst doubleIt\
  \ = n => n * 2;\n// 调用它\nconsole.assert(doubleIt(8) === 16);\n```\n\n在深入细节之前，让我们尽情欣赏箭头函数的优雅。`function`\
  \ 关键字、括号、花括号和 `return` 关键字都消失了。（最后两个并非完全正确，正如我们将在接下来的讨论中看到的。）剩下的只有函数的**真正**意图。\n\
  \n正如我们所见，与函数表达式非常相似，我们不为函数本身提供名称。相反，我们将*求值*表达式的结果赋值给一个变量，以便稍后可以引用它。\n\n现在我们已经尝到了箭头函数的甜头，让我们讨论一些语法细节。\n\
  \n\n\n### 带括号还是不带括号？\n\n箭头函数的参数列表位于胖箭头左侧。**当且仅当**函数签名只有一个参数时，可以省略括号^(¹⁶)。以下代码片段展示了箭头函数参数允许的各种排列方式：\n\
  \n- ① 零参数列表必须带括号\n- ② 单参数列表可省略括号\n- ③ 两个或更多参数必须带括号\n\n```\nconst noop = () => {};\
  \ ①\nconst identity = n => n; ②\nconst get = (obj, k) => obj[k]; ③\n```\n\n这引出一个问题：为单参数箭头函数省略括号是否真的给我们带来好处？JavaScript\
  \ 社区广泛采用的惯例是尽可能省略括号。换句话说，虽然这似乎违背了单参数箭头语句在语法上应与无参数和多参数箭头函数保持一致的理念，但它确实减少了冗余，尤其是在高阶函数中，我们很快就会看到这一点。\n\
  \n箭头函数语法的右侧部分则更为微妙，我们接下来将进行探讨。\n\n### 表达式体与语句体\n\n到目前为止，我们看到的所有示例都是单行函数体。如果函数需要做更多工作该怎么办？\n\
  \n事实上，我们确实可以使用花括号来定义函数体。但你可能记得，花括号在 JavaScript 中创建的是代码块（*blocks*），而代码块是**语句**，不是表达式！换句话说，我们之前看到的所有示例都使用表达式作为函数体，因此无需显式使用\
  \ `return` 从函数返回值。如果我们改用代码块（代码块是语句，因此不会被“求值”），则必须显式地从函数中 `return` 值。（否则，该函数会像任何普通函数一样，隐式返回\
  \ `undefined`。）让我们定义一个多行函数体的箭头函数：\n\n- ① 使用花括号开始函数体\n- ② 必须显式使用 return\n\n```\n\
  const reducer = (acc, n) => { ①\n  acc.push(n);\n  return acc; ②\n};\n// 调用它\nconsole.log(reducer([2,\
  \ 3], 1)); // 输出 '[ 2, 3, 1 ]'\n```\n\n**建议**：如果我们要使用花括号，就应该在函数体中显式包含 `return`。不这样做可能会导致令人困惑的结果。请看：\n\
  \n```\nconst confuser = () => { profession: 'JS Ninja' };\n// 调用它\nconsole.log(confuser());\n\
  ```\n\n快速回答！这个函数被调用时返回什么？它返回一个包含一个键的对象，还是一个带有 `label` 的代码块，因此返回 `undefined`？正如你所见，花括号同时用于定义代码块\
  \ *和* 对象，这种重载特性与箭头函数语法结合使用时会引起混淆。\n\n实际上，如果 JavaScript 在箭头函数定义中“看到”花括号，它会将其视为代码块函数体。这意味着调用时，该函数将返回\
  \ `undefined`。\n\n如果我们确实想返回一个对象呢？我们有两种选择——显式使用带有 `return` 的代码块，或者将函数体包裹在圆括号中，如下所示：\n\
  \n```\nconst confuserOne = () => ({ profession: 'JS Ninja' });\n// 输出 '{ profession:\
  \ 'JS Ninja' }'\nconsole.log(confuserOne());\n// 或者\nconst confuserTwo = () => {\n\
  \  return { profession: 'JS Ninja' };\n};\n// 输出 '{ profession: 'JS Ninja' }'\n\
  console.log(confuserTwo());\n```\n\n以上总结了箭头函数所有的语法细节。现在我们来考虑箭头函数与普通函数之间的语义差异。但在讨论之前，我们必须简要回顾一下普通函数以及它们如何处理\
  \ `this`。\n\n### 普通函数动态设置 `this`\n\n当一个普通函数（使用函数声明或函数表达式定义）引用 `this` 时，该引用会根据所使用的“调用模式”动态解析：\n\
  \n- ① 设置一个指向作用域内局部函数的属性\n- ② 使用“方法调用”模式调用该函数\n- ③ 使用“apply 调用”模式\n- ④ 使用“函数调用”模式调用该函数\n\
  \n```\n'use strict';\nconst returnsThis = function () {\n  return this;\n};\nvar\
  \ obj1 = {\n  name: 'obj1',\n  method: returnsThis, ①\n};\nconsole.assert(obj1.method()\
  \ === obj1); ②\nvar obj2 = {\n  name: 'obj2',\n};\nconsole.assert(returnsThis.apply(obj2)\
  \ === obj2); ③\nconsole.assert(returnsThis() === undefined); ④\n```\n\n我必须强调，我们是在\
  \ `严格模式` 下运行代码，以避免“非安全”环境倾向于强制的自动装箱行为^(¹⁷)。尽管如此，我们使用三种不同的调用模式^(¹⁸) 调用了同一个函数，并看到每次调用时\
  \ `this` 的值都不同！\n\n我们首先在对象上设置一个属性，使其指向局部函数，然后像调用该对象上的任何其他函数属性一样，使用“点”运算符调用它。正如我们所料，`this`\
  \ 指向调用时“点”左侧的内容。换句话说，它指向“当前上下文”。\n\n接着我们使用 `apply`（或其兄弟 `call`），这实际上在调用函数之前设置了函数内部的\
  \ `this`。另一种理解方式是，这一行等同于方法调用模式，区别在于我们使用 `apply` 设置 `this`，而不是被迫在对象上添加一个新属性。\n\n\
  最后，我们简单地在没有任何上下文的情况下调用该函数——也就是说，我们不在任何对象上调用该函数；在 `严格模式` 下，该函数简单地返回 `undefined`，这正是我们所期望的。\n\
  \n正如我们所看到的，函数表达式（或声明）中的 `this` 是在调用时设置的，*而不是* 在定义时设置的。这就是“普通”函数的行为与箭头函数行为的分歧点。普通函数在调用时动态设置\
  \ `this` 的含义，而箭头函数则词法地绑定 `this`；换句话说，箭头函数在 *定义* 时绑定 `this`。\n\n### 词法绑定的 `this`\n\
  \n箭头函数在调用时不会设置 `this` 的含义。相反，它们将 `this` 设置或“固化”为创建时 `this` 求值的结果。请考虑以下代码：\n\n- ①\
  \ 获取全局对象的句柄以便进行 `assert` 断言\n- ② 定义一个简单地 `return`  `this` 的箭头函数\n- ③ 尝试将其用作方法并不会改变上下文\n\
  - ④ `apply` 也不会改变\n- ⑤ 这里的普通函数（正如我们所见）会返回 `undefined`\n\n```\n'use strict';\nconst\
  \ GLOBAL_OBJECT = this; ①\nconst returnMe = () => this; ②\nvar obj1 = {\n  name:\
  \ 'obj1',\n  method: returnMe,\n};\nconsole.assert(obj1.method() === GLOBAL_OBJECT);\
  \ ③\nvar obj2 = {\n  name: 'obj2',\n};\nconsole.assert(returnMe.apply(obj2) ===\
  \ GLOBAL_OBJECT); ④\nconsole.assert(returnMe() === GLOBAL_OBJECT); ⑤\n```\n\n定义箭头函数似乎与定义普通函数，然后将\
  \ `this` `bind` 到定义时 `this` 的值完全相同！而事实上正是如此。\n\n让我们看看适用于箭头函数的其他一些注意事项。\n\n\n\n###\
  \ 其他注意事项\n\n箭头函数在其他细微方面也与常规函数有所不同。由于箭头函数的内部实现方式，它们无法被用作构造函数。如果我们想要定义一个构造函数，必须继续使用常规函数。\n\
  \n另一个区别在于，`this` 并非唯一按词法作用域绑定的东西。当将定义为表达式或语句的函数被调用时，JavaScript 会创建一个对象，该对象会捕获调用时提供给函数的所有参数。这个名为\
  \ `arguments` 的对象在函数体内是可用的。然而，箭头函数不会获得 `arguments` 对象。不过，`strict mode` 限制了 `arguments`\
  \ 的 API 使用范围，并且 ES6 为我们提供了可变参数（我们很快就会看到），这进一步减少了对 `arguments` 的需求，因此这本身并不成为一个很大的注意事项。让我们通过一个简单的例子来看看它是如何工作的：\n\
  \n*   ① 使用语句定义一个函数\n*   ② 将函数语句作为构造函数调用，成功返回\n*   ③ 将函数定义为箭头函数\n*   ④ 将箭头函数作为构造函数调用会抛出错误\n\
  *   ⑤ 常规函数在调用时会获得一个 `arguments` 对象\n*   ⑥ 而箭头函数则不会\n\n```\nfunction PersonAsRegularFunction(name)\
  \ { ①\nthis.name = name;\n}\nconst nate = new PersonAsRegularFunction('Nate'); ②\n\
  // 输出 { name: 'Nate' }\nconsole.log(nate);\nconst PersonAsArrowFunction = (name)\
  \ => { ③\nthis.name = name;\n};\n// const neal = new PersonAsArrowFunction('Neal');\
  \ ④\nfunction regularFunction() {\nreturn arguments;\n}\n// 输出 { '0': 10, '1': 'a',\
  \ '2': true, '3': false }\nconsole.log(regularFunction(10, 'a', true, false)); ⑤\n\
  const arrowFunction = () => arguments;\n// 输出 'ReferenceError: arguments is not\
  \ defined'\n// console.log(arrowFunction(10, 'a', true, false)); ⑥\n```\n\n让我们退一步思考这意味着什么——常规函数在调用时动态设置\
  \ `this` 的值。同时，会创建 `arguments` 对象来捕获调用时提供的所有参数。也就是说，在函数体内使用的 `this` 和 `arguments`\
  \ 对象都是*基于上下文的*——它们依赖于调用上下文以便能够正确定义。然而，箭头函数在定义时就固定了 `this` 的值，并且根本不会被提供 `arguments`\
  \ 对象。换句话说，箭头函数被特意设计为尽可能少地使用其周围的上下文。如果我们的函数实现需要使用在运行时定义的上下文，那么使用常规函数将是最佳选择。\n\n###\
  \ 使用场景\n\n有人可能会想，既然有这么多微妙的变化需要我们注意，箭头函数值得使用吗？正如我们所看到的，JavaScript 是一种函数式编程语言。将函数作为参数传递以及从高阶函数中返回函数是\
  \ JavaScript 中非常常见的范式。事实上，大多数 `Array` 的迭代和操作函数往往是高阶函数，并且为使用箭头函数提供了绝佳的机会。让我们重新审视之前关于对数组执行\
  \ `map` 和 `reduce` 操作的例子，看看如何改用箭头函数。\n\n*   ① 将数组中的每个数字乘以三\n*   ② 仅筛选出偶数\n*   ③\
  \ 将结果归约为其总和\n\n```\nconst nums = [1, 2, 3, 4, 5];\nconst result = nums\n.map(n =>\
  \ n * 3) ①\n.filter(n => (n %  2) === 0) ②\n.reduce((acc, n) => acc + n, 0); ③\n\
  ```\n\n首先，让我们稍作停顿，思考一下这段代码的优雅之处。如我们所见，所有多余的仪式性代码都消失了，剩下的只是我们试图实现的核心意图。几乎可以说，箭头函数就是为此意图而设计的！\n\
  \n另一个使用场景是当我们*确定地*知道在箭头函数定义时 `this` 代表什么。\n\n*   ① 设置\"上下文\"\n*   ② 箭头函数按预期工作\n\n\
  ```\nconst neo = {\nfriends: [\n'Morpheus',\n'Brian',\n'Switch',\n],\naddFriends:\
  \ function () {\nconst args = Array.prototype.slice.call(arguments);\nargs.forEach(f\
  \ => this.friends.push(f)); ②\n},\n};\n// 调用 addFriends\nneo.addFriends('Niobe',\
  \ 'Tank'); ①\n// 输出 '[ 'Morpheus', 'Brian', 'Switch', 'Niobe', 'Tank' ]'\nconsole.log(neo.friends);\n\
  ```\n\n这里我们知道，`addFriends` 内部的 `this` 将指向 `const neo` 所引用的对象，因为 `addFriends` 是作为\
  \ `neo` 的一个方法被调用的。因此，在 `addFriends` 内部，我们可以定义一个能够使用 `this` 的箭头函数，因为在箭头函数被定义时，`this`\
  \ 指向所有者对象。但是，我们不能将 `addFriends` 本身定义为一个箭头函数，因为在函数定义时，`this` 指向全局对象！正如我们可以推断出的，在箭头函数内部引用\
  \ `this` 时，最好确定 `this` 指向什么，或者干脆考虑使用函数表达式。\n\n让我们考虑另一个使用高阶函数来构建小型领域特定语言（DSL）的例子。在这个例子中，我们将使用纯函数——即那些只使用传递给它们的参数的函数。也就是说，它们是\"\
  无状态的\"，因此是使用箭头函数的绝佳候选。这将为我们提供一个极好的机会，来看看箭头函数的简洁性如何帮助我们。\n\n*   ① 定义一个高阶谓词函数\n* \
  \  ② 测试提供的参数是否大于 10\n*   ③ 测试数字是否为偶数\n*   ④ 创建一个测试两个条件的函数\n\n```\nconst and = (a,\
  \ b) => arg => a(arg) && b(arg); ①\nconst gt10 = n => n > 10; ②\nconst even = n\
  \ => n %  2 === 0; ③\nconst gt10AndEven = and(gt10, even); ④\nconsole.assert(gt10AndEven(15)\
  \ === false);\nconsole.assert(gt10AndEven(22) === true);\n```\n\n这里我们定义了 `and` 函数，一个高阶谓词函数^((19))，它接收两个函数，并返回一个新函数。这个新函数期望接收一个参数\
  \ `args`，该参数会针对两个谓词进行测试，当且仅当两个谓词都满足时才返回 true。^((20))\n\n然后我们定义了两个谓词，并使用 `and` 创建了一个新函数，以测试其提供的参数是否既大于\
  \ 10 又是偶数。\n\n再次，我们观察到箭头函数使我们能够敏锐地表达我们的意图，省略了与函数表达式相关的任何多余的仪式性代码。\n\n"
- '# 总结


  尽管箭头函数与它们的表达式和语句表亲有几分相似，但它们在 JavaScript 新世界中的作用是无可争议的。它们使我们能够利用 JavaScript 固有的函数式特性，使代码更简洁、更易读，并且与常规函数不同，它们抑制了任何使其变得有状态的尝试。


  在本章中，我们探索了胖箭头函数的新语法。我们看到了它们的语义与常规函数有何不同，并学习了箭头函数最能为我们服务的恰当使用场景。只要我们始终留意它们行为上的差异，箭头函数就会很好地为我们服务。


  在下一章中，我们将探索一种定义函数签名的新机制，它可以使我们的代码更具表现力，同时减少我们习惯在函数内部进行的大量错误检查。


  脚注 1   2   3   4   5   6




