    这里涉及的内容很多，所以我们一步一步来。考虑到我们对标签函数使用方式所施加的限制，我们知道包含元素描述的数组将是一个单元素数组。因此，我们通过解构来获取这唯一的元素，并调用
    `trim` 方法去除所有多余的空白字符。我们还知道，该字符串由一个元素名称以及类选择器（`.`）和 ID 选择器（`#`）组成，因此我们可以使用 `split`
    方法获取第一个选择器出现之前的内容，并将其视为我们要生成的 HTML 元素的名称。


    接下来，通过一些正则表达式魔法，将元素名称之后提供的所有选择器抓取到一个数组中。因此，如果用户提供 `h1.title.content#main`，则此正则表达式会将其拆分为一个形如
    `[''.title'', ''.content'', ''#main'']` 的数组。我们首先过滤该数组，找到用户提供的所有 ID，如果提供了多个 ID（这是非法的），我们只需取最后一个提供的
    ID，从而模拟 Emmet 的行为，并拼接出 `id=` 字符串。然而，多个类（class）*是*允许的，因此我们过滤数组以获取所有提供的类，并拼接出 `class=`
    字符串。


    剩下的就很简单了——只需将元素名称、id 和 class 字符串组合在一起，确保插入 `innerHTML` 内容（作为插值变量提供），并返回完全组合好的元素。


    关于我们的实现，有几点必须强调。首先，我们在函数*内部*使用模板字符串来构建其他字符串。就标签函数而言，除了拥有一个显式的签名外，它们与普通函数并无二致。其次，正如我们在示例中所看到的，我们可以嵌套调用其他（标签）函数，从而创建嵌套的元素结构。由于
    JavaScript 在组合字符串之前必须先计算每个插值表达式，实际上，对我们标签函数的嵌套调用会导致最终的字符串由内而外构建——最内层的调用先执行，然后向外层推进。


    诚然，我们的实现短期内不会获得任何奖项。它无法处理兄弟元素（Emmet 通过 `+` 运算符支持）或同时创建 `n` 个元素（Emmet 通过 `*` 运算符实现）。然而，它确实让我们得以一窥模板字面量和标签函数的强大之处，以及它们真正能够实现的功能。


    标签函数与模板字符串一起提供了多种用例，包括辅助国际化与本地化、语言翻译以及用户输入的清理，其核心本质是将字符串从一种形式转换为另一种形式。我们甚至可以扩展我们的
    Emmet 标签函数，以模拟 React 中 JSX 等模板语言所表现出的行为。像 `styled-component` 和 `html-tagged-template`
    这样的库为我们提供了绝佳的思路和启发，促使我们在许多常见的日常用例中考虑使用模板字面量。


    你能想到在哪些情况下可以通过引入这样的 DSL（领域特定语言）来消除代码中的冗余吗？或者，在为了调试目的而漂亮地打印对象时呢？又或者，在以特定格式显示数据时，例如特定于区域设置的日期和/或货币？


    ## 总结


    生成包含变量插值的字符串一直是一件繁琐的事情，而模板字符串旨在通过提供一种不仅使插值更容易、而且还支持多行字符串的字面量来缓解这一痛点。另一方面，标签函数允许我们拦截模板字符串的构建过程，从而实现一些相当有趣的用例。


    在下一章中，我们将把注意力转回对象和数组。对象和数组到目前为止表现得很好，但那些来自其他语言的开发者常常会怀念诸如映射（Map）和集合（Set）这样的数据结构，以及
    JavaScript 中缺少此类数据结构的情况。这将是下一章的主题。同时，我们还将看到展开运算符和解构赋值是如何与它们协同工作的。


    脚注 1  2  3  4  5  6  7


    # 6. 映射与集合——数据结构家族的新成员


    一门编程语言必须为我们提供所有必要的构造，使开发者能够清晰高效地为其领域和问题空间建模。迄今为止，JavaScript 缺乏对大多数其他语言都提供的两种基本类型的支持，即映射（Map）和集合（Set）。这种情况在
    ES6 中得到了改变。


    在本章中，我们将探讨 ES6 中引入的两种新数据结构的用途，即 `Map` 和 `Set`。我们将从它们的构造开始，理解它们的 API，甚至深入底层了解它们是如何实现的。到本章结束时，我们将完全理解如何以及在何时可以在代码中利用映射和集合，以及何时最好避免使用它们。

    '
- fmt: '## Why Objects are Not Enough


    JavaScript offers us two “collection”-like objects—objects (represented via the
    `{}` literal) and arrays (represented using the `[]` literal). Objects, often
    referred to as associative arrays, or dictionaries provide lookup via keys. Arrays
    on the other hand provide a sequential data-structure that provide efficient random
    lookup via indexes.


    Objects and arrays, while useful, do not prove to be sufficient for all use-cases.
    One limitation of objects serving as a *true* key-value store is that object keys
    **are** strings. In other words, the “type” of the key is not retained when used
    in an object. This can be trivially demonstrated:


    - ① Create an object with two *seemingly* different keys

    - ② Interrogate the object for a key with a type

    - ③ Swap the order of key value pairs with **no other change**

    - ④ The same lookup is now different


    ```

    const obj1 = {

    ''true'': ''String'',

    true: ''Boolean'',

    }; ①

    console.assert(obj1[true] === ''Boolean''); ②

    const obj2 = {

    true: ''Boolean'',

    ''true'': ''String'',

    }; ③

    console.assert(obj2[true] === ''String''); ④

    ```


    This is patently clear to anyone (which is *all* of us) who has ever serialized
    a JavaScript object to JSON.


    Given this limitation, if we needed to retain the *type* of the key we had no
    recourse.^([^(42)](#fn42))


    ES6 in response offers us maps and sets. Maps, much like objects, are key-value
    stores; however, they retain the types of their keys, proving to be closer to
    maps offered in other languages. Sets on the other hand fill in a role that prior
    to ES6 had developers resorting to lots of `===` checks against entries in arrays,
    resigning to using only strings as “unique entries” in objects, or if all failed,
    reaching out for third-party libraries^([^(43)](#fn43)) to fulfill their needs.


    Our quest ends here. We start by exploring maps, followed by sets.


    ## Maps


    Maps, much like objects, present a lookup via a key, with the difference being
    that maps retain the *type* of the key (vs. coercing them into strings like objects
    do). Maps offer us a constructor as a means to create new maps. Unlike arrays
    and objects, they do **not** offer us a literal for construction, which has an
    implication on their serializability (which we will see soon). Maps also offer
    us a comprehensive API to add, update, and delete key-value pairs within the map,
    all of which are demonstrated here:


    *Map key-value API*


    - ① Constructor to create a map

    - ② `set` a key

    - ③ `set` is a fluent API returning the map itself

    - ④ `has` implies possession

    - ⑤ `get` is the interrogation API

    - ⑥ Forcing a collision causes the previous *value* to be overwritten

    - ⑦ Last one wins

    - ⑧ If an existing key is `delete`d then the map returns true

    - ⑨ Deletion of a nonexistent key


    ```

    const obj = {};

    const map = new Map(); ①

    map.set(''string'', ''is a string''); ②

    map.set(true, ''is a boolean'');

    map.set(1, ''is a number'').set(obj, ''is an object''); ③

    console.assert(map.has(1)); ④

    console.assert(map.get(obj) === ''is an object''); ⑤

    map.set(1, ''overrides first''); ⑥

    console.assert(map.get(1) === ''overrides first''); ⑦

    console.assert(map.delete(''string'')); ⑧

    console.assert(map.has(''string'') === false);

    console.assert(map.delete({}) === false); ⑨

    ```


    The `Map` API provides us with all we need to work with keys and values. The `set`
    API being fluent certainly proves to be a worthy ally, allowing to avoid some
    of the verbosity that results if that were not the case. Collisions are handled
    as we might expect, and finally, we can use the `delete` API to remove a key-value
    pair from the map, which returns `true` if the key was indeed deleted from the
    map (`delete` will return a `false` if the key did not exist, thereby having nothing
    to delete).


    At a higher level there are APIs that let us work with the map as a whole, allowing
    us to get all entries, the count of entries, even clear the map if we wish to
    do so:


    - ① Alternative constructor taking an iterable

    - ② Tuple representing key-value pairs

    - ③ Extra elements in tuples are discarded

    - ④ Only key, so value is set to `undefined`

    - ⑤ Both key-value pairs are missing

    - ⑥ Slightly discombobulating property to interrogate for count

    - ⑦ Functional API to iterate over key-value pairs

    - ⑧ All of these return iterators

    - ⑨ An API to clear the map and set its `size` to zero


    ```

    const map = new Map([ ①

    [''s'', ''is a string''], ②

    [true, ''is a boolean'', ''willBeIgnored''], ③

    [1], ④

    [], ⑤

    ]);

    console.assert(map.size === 4); ⑥

    console.assert(map.get(''s'') === ''is a string'');

    console.assert(map.get(true) === ''is a boolean'');

    console.assert(map.get(1) === undefined);

    console.assert(map.get(undefined) === undefined);

    console.assert(map.has(undefined));

    map.forEach((v, k) => console.log(v, k)); ⑦

    console.log(map.entries());

    console.log(map.keys());

    console.log(map.values()); ⑧

    map.clear(); ⑨

    console.assert(map.size === 0);

    ```


    Maps offer another helpful constructor that can use any “iterable” to create maps
    out of. A common idiom is to supply the constructor with an array of arrays. Each
    nested array is assumed to be a two-value tuple, representing key and value. If
    the nested array contains only one item, then the value is set to `undefined`.
    If the array contains more than two items, then all extra elements are ignored.
    Finally, if the array is empty then both key and value are set to `undefined`.
    If the supplied array produces **no** collisions, then the resulting map will
    have its keys ordered in the same manner as the array, and the `size` of the resulting
    map will be equal to the `length` of the array.'
