  trans: '

    # 11. 使用类实现多重同类对象


    在 JavaScript 中通过类构建对象，并将它们组织成层级结构是困难的。函数、构造函数、`prototype`属性——用秘密配方组合所有这些，撒上魔法粉尘，瞧，我们就实现了继承，*前提是*我们正确绑定了所有连接。如果对
    JavaScript 原型继承的工作原理没有深入理解，这感觉就像黑魔法。


    在本章中，我们将看到如何利用 ES6 引入的几个新关键字（如`class`、`extends`和`super`）轻松创建类并构建继承树，从而像在其他面向对象语言中一样表达我们的意图。完成本章后，我们将能够自信地建模问题空间并使其易于理解。我们还将获得细致入微的视角，明确在代码库中何时应当使用这一新特性，以及何时不使用它可能更合适。


    ## 在 JavaScript 中构建类与继承的难点


    JavaScript 是面向对象的，对象可以充当数据的"袋子"以及方法（即能对包含的数据进行操作的函数）。JavaScript 体现了原型继承，即对象从其他对象扩展而来，加上其动态类型特性，这可以说比
    Java 或 C#等语言中的经典继承强大得多。诚然，JavaScript 似乎并不天然具备其他语言中显而易见的抽象、多态、继承和封装等原则——然而，通过一点技巧，其中许多*是*可以实现的。


    问题就在这里——虽然上述许多面向对象特性在 JavaScript 中*是*可行的，但如果不深入了解使魔法发生的所有环节，就极难正确实现。你需要理解函数如何充当构造函数，`new`如何创建对象，以及构造函数调用如何连接生成对象的原型。还需要掌握`constructor`和`prototype`属性如何在实例内工作以实现继承等功能。请看以下代码片段：


    - ① 一个构造函数

    - ② 在函数的原型上添加一个实例方法

    - ③ 添加另一个实例方法


    ```

    function Person(name) { ①

    this.name = name;

    }

    Person.prototype.getName = function () { ②

    return this.name;

    };

    Person.prototype.sayHello = function (to) { ③

    return `Hello ${to.getName()}. My name is ${this.name}.`;

    };

    const raju = new Person(''Raju'');

    const venkat = new Person(''Venkat'');

    // 输出 ''Hello Venkat. My name is Raju''

    console.log(raju.sayHello(venkat));

    ```


    让我们逐部分分解。开始之前，请记住 JavaScript 中的函数*是*对象，和对象一样可以拥有属性。其中一个属性恰好是`prototype`属性。


    在我们的示例中，我们利用了函数在 JavaScript 中扮演双重角色的事实。也就是说，它们既可以充当普通函数，也可以充当构造函数，很像我们在 Java 或
    C#等语言中熟悉的构造函数。普通函数调用与构造函数调用之间的唯一区别是后者使用了`new`关键字。


    当使用`new`关键字调用函数时，会创建一个新对象，该对象有一个指向创建它的函数原型的隐藏指针，并且在构造函数体内`this`被绑定到这个新对象上。换句话说，任何时候我们在（构造）函数体内使用`this`，我们指的都是这个新对象，它正是该函数创建的"实例"。


    因此，每当我们添加一个像`this.name`这样的属性时，我们只是在*新创建的实例*上添加它。然而，如果我们希望为函数创建的所有实例提供"实例"方法，那么我们可以利用新创建的对象有一个指向函数`prototype`的指针这一事实，通过`Person.prototype`我们实际上就是在修改新对象的原型！


    最后，由于该函数的所有实例共享相同的方法（因为它们属于共享的原型对象），我们可以从一个实例方法调用另一个实例方法，例如，我们可以在`sayHello()`中使用`getName()`。


    ![../images/481812_1_En_11_Chapter/481812_1_En_11_Fig1_HTML.png](img/481812_1_En_11_Fig1_HTML.png)


    图 11-1


    原型继承


    这幅图描述了原型继承的工作原理，其中新创建的实例引用了创建它的函数的原型。^(⁶⁶) 如果我们要查找实例本身不存在的属性（或调用方法），那么对象会*委托*给它的原型，从而"攀爬"继承树。当然，如果到达原型链末端仍未找到该属性，我们将得到`undefined`。

    '
- fmt: "# 关于原型对象的理解\n\n关于原型对象，需要牢记的一点是：它**仅仅**是一个 `POJO`——一个普通的旧式 JavaScript 对象！它与我们使用对象字面量（`{}`）创建的对象没有任何区别。这正是一它被称为“原型式”继承的原因——一个对象作为另一个对象的原型——对象从其他对象继承。\n\
    \n同样，默认情况下，所有对象都固有地继承自 `Object.prototype`。^([(67)](#fn67)) 这条规则适用于我们使用 `{}` 创建的任何对象，也适用于\
    \ JavaScript 附加到函数对象上的原型对象。\n\n为了完整地理解这一点，`Object.prototype` 上附加了一些方法，比如 `toString`。牢记所有这些，我们的全图解表示将变成图\
    \ [11-2](#481812_1_En_11_Chapter.xhtml#Fig2) 所示的样子。\n\n![../images/481812_1_En_11_Chapter/481812_1_En_11_Fig2_HTML.png](images/481812_1_En_11_Chapter/481812_1_En_11_Fig2_HTML.png)\n\
    \n**图 11-2** 从 `Object` 继承\n\n延续我们之前的讨论，如果我们在 `Person` 的实例上调用 `toString`，JavaScript\
    \ 会从该实例开始，发现它没有该方法，然后沿着原型链向上追溯到它的原型，并继续直到到达 `Object.prototype`，最后调用该方法。\n\n我们已经看到了原型继承在\
    \ JavaScript 中是如何运作的雏形。但我们如何像其他语言那样创建继承层次结构呢？让我们看看如何从我们之前实现的 `Person` “扩展”来创建\
    \ `SuperHero`：\n\n- ① 一个“子类”构造函数\n- ② 我们首先调用“父类”构造函数\n- ③ 创建子类原型\n- ④ 向 `SuperHero.prototype`\
    \ 添加一个方法\n- ⑤ 将原型的 `constructor` 属性指向构造函数\n\n哇！这么多活动部件。然而，其中大部分只是重现我们已经了解的 JavaScript\
    \ 原型继承知识。\n\n```javascript\nfunction SuperHero(name, superpower) { // ①\n  //\
    \ 父类调用 - 可以传递参数\n  Person.call(this, name); // ②\n  this.superpower = superpower;\n\
    }\n\nSuperHero.prototype = Object.create(Person.prototype); // ③\n\nSuperHero.prototype.warCry\
    \ = function () { // ④\n  return `My name is ${this.name}!!!`;\n};\n\nSuperHero.prototype.constructor\
    \ = SuperHero; // ⑤\n\nconst thor = new SuperHero('Thor', 'Mjolnir');\n// 输出 'My\
    \ name is Thor!!!'\nconsole.log(thor.warCry());\n// 输出 'Hello Venkat. My name\
    \ is Thor'\nconsole.log(thor.sayHello(venkat));\n```\n\n我们从实现 `Person` 构造函数开始，并向\
    \ `Person.prototype` 添加一些实例方法。然后我们定义一个 `SuperHero` 构造函数，它**应该**扩展 `Person`。继承要求当我们调用子类构造函数时，首先完成父类的构造（在传统面向对象语言中这会是\
    \ `super` 调用），然后才继续构造子类实例。我们如何在 JavaScript 中模拟这一点？\n\n回想一下，当我们像构造函数一样调用函数时（即使用\
    \ `new` 关键字调用），构造函数定义内部的 `this` **就是**新创建的实例。在我们的实现中，我们通过函数上可用的 `call` 方法将 `this`\
    \ 提供给 `Person`。函数对象上的 `call` 方法强制被调用函数（在我们的例子中是 `Person`）内部的 `this` 成为传递给 `call`\
    \ 的第一个参数（在我们的例子中是新创建的 `SuperHero` 实例）。^([(68)](#fn68)) `call` 的第二个参数是函数期望的任何参数——在我们的例子中就是\
    \ `name`。因此，新创建的实例会获得 `Person` 构造函数附加给它的任何属性，这正是我们想要的。\n\n所以，我们可以模拟 `super` 调用。下一个要处理的是——正确对齐原型。如果我们回顾原型继承的实现方式，实例指向创建它们的函数的原型。为了整个继承树正确工作，`SuperHero.prototype`\
    \ **必须**是一个指向 `Person.prototype` 的对象。只有这样，`SuperHero` 的实例才会指向 `SuperHero.prototype`，而\
    \ `SuperHero.prototype` 又指向 `Person.prototype`，默认情况下 `Person.prototype` 指向 `Object.prototype`。\n\
    \n事实证明，`Object.create` 可以接受一个对象，并返回一个使用该对象作为原型的新对象。太棒了！我们用新创建的对象替换 `SuperHero.prototype`，然后在其上添加一个实例方法（仅适用于超级英雄）。\n\
    \n最后一个细节——由于我们替换了 JavaScript 为 `SuperHero` 函数创建的原型对象，我们需要连接它，使其知道拥有它的函数，因此我们将\
    \ `SuperHero.prototype` 上的 `constructor` 属性指回 `SuperHero` 函数。^([(69)](#fn69))\n\
    \n哇。让继承工作起来需要这么多步骤，更不用说这些连接是多么复杂，因此也很容易遗漏某个步骤。然而，在完成所有这些之后，我们的图解表示就变成了图 [11-3](#481812_1_En_11_Chapter.xhtml#Fig3)\
    \ 所示的样子。\n\n![../images/481812_1_En_11_Chapter/481812_1_En_11_Fig3_HTML.png](images/481812_1_En_11_Chapter/481812_1_En_11_Fig3_HTML.png)\n\
    \n**图 11-3** 更深层次的继承\n\n我们必须认识到，与基于类的继承不同，JavaScript 中的继承是通过原型实现的。函数只是简单的辅助工具，允许我们创建原型设置正确的对象，从而实现属性和方法的查找。\n\
    \n既然如此，如何实现“静态”属性呢？即与“类型”关联而非与实例关联的属性。只需在对象类型上添加一个属性即可，在 JavaScript 中，对象类型就是创建该对象的函数。因此，如果我们添加一个属性\
    \ `SuperHero.count`，或许可以跟踪应用程序中构造了多少个超级英雄。\n\n正如我们可能得出的结论，虽然以上所有内容都相当优雅，但继承的意图**可能**会在这些复杂的机制中迷失。此外，类型的定义是分离的。诚然，通过足够巧妙的代码，可以尝试将所有内容抽象到一个位置，但这并不能缓解当前的担忧，即代码量已经很大了！有没有更好的方法来实现所有这些？ES6\
    \ 引入了 `class` 关键字以及其他几个特性，使这一切变得更加容易。让我们来看看。"
  raw: 'The thing to bear in mind about the prototype object is that it is *just*
    a POJO—a plain old JavaScript object! It is no different that if we had created
    an object using the object literal (`{}`). This is precisely why it’s referred
    to as “prototypal” inheritance—one object acts as the prototype of another—objects
    inherit from other objects.


    Along the same vein, by default, all objects inherently inherit from `Object.prototype.`^([^(67)](#fn67))
    This rule applies to any object we create using `{}` as well as to the prototype
    objects that are attached by JavaScript to functions objects.


    To complete the picture, `Object.prototype` has a few methods tacked onto it,
    like `toString`. Keeping all this in mind, our all-pictorial representation of
    this becomes what is shown in Figure [11-2](#481812_1_En_11_Chapter.xhtml#Fig2).


    ![../images/481812_1_En_11_Chapter/481812_1_En_11_Fig2_HTML.png](images/481812_1_En_11_Chapter/481812_1_En_11_Fig2_HTML.png)


    Figure 11-2


    Inheriting from `Object`


    Extending our previous discussion, if we were to call `toString` on an instance
    of `Person`, JavaScript would start with the instance, realize it does not have
    that method, follow the prototype chain up to the it’s prototype, and continue
    to do so till it reaches `Object.prototype`, and invoke that method.


    We are already seeing the glimmer of how prototypal inheritance works in JavaScript.
    But how do we create an inheritance hierarchy like we would in other languages?
    Let us take see how we “extend” from our earlier implementation of `Person` to
    create a `SuperHero` :


    *   ① A “sub-class” constructor


    *   ② We invoke the “super” constructor first


    *   ③ Create the sub-class prototype


    *   ④ Add a method to `SuperHero.prototype`


    *   ⑤ Line up the constructor property of the prototype to point back to the constructor
    function Phew! A lot of moving parts. However, most of it is simply reproducing
    what we already know about prototypal inheritance in JavaScript


    ```

    function SuperHero(name, superpower) { ①

    // super call - can pass args

    Person.call(this, name); ②

    this.superpower = superpower;

    }

    SuperHero.prototype = Object.create(Person.prototype); ③

    SuperHero.prototype.warCry = function () { ④

    return `My name is ${this.name}!!!`;

    };

    SuperHero.prototype.constructor = SuperHero; ⑤

    const thor = new SuperHero(''Thor'', ''Mjolnir'');

    // prints ''My name is Thor!!!''

    console.log(thor.warCry());

    // prints ''Hello Venkat. My name is Thor''

    console.log(thor.sayHello(venkat));

    ```


    We start with our implementation of the `Person` constructor, and adding onto
    `Person.prototype` some instance methods. We then define a `SuperHero` constructor,
    which is *supposed* to extend `Person`. Inheritance requires that when we invoke
    the subclass constructor, we first finish constructing our parents (in traditional
    object-oriented languages this would be a `super` call), and only then continue
    constructing the subclass instance. How do we emulate this in JavaScript?


    Recall that when we invoke a function like a constructor (i.e., invoking it with
    the `new` keyword), `this` inside the constructor definition *is* the newly created
    instance. In our implementation, we supply `this` to the `Person` via the `call`
    method available on functions. The `call` method on function objects forces `this`
    inside the callee (in our case `Person`) to be whatever is supplied as the first
    argument to `call` (in our case that is the newly created `SuperHero` instance).^([^(68)](#fn68))
    The second argument to `call` is any arguments that the function expects—in our
    case that would just be the `name`. Consequently, the newly created instance gets
    adorned with whatever the `Person` constructor tacks on to it, which is exactly
    what we want.


    So, we can emulate a `super` call. Next item on the menu—align the prototypes
    correctly. If we were to look back at how prototypal inheritance is implemented,
    instances point to the prototype of the function that created them. For the whole
    inheritance tree to work correctly, `SuperHero.prototype` **must** be an object
    that points to `Person.prototype`. Then, and only then, instances of `SuperHero`
    will point to `SuperHero.prototype`, which in turn points to `Person.prototype`,
    which by default points to `Object.prototype`.


    It turns out that `Object.create` can take an object, and returns a new object
    that uses the supplied object as its prototype. Great! We swap out `SuperHero.prototype`
    with the newly created object, then tack on an instance method (which works only
    for superheroes) on it.


    One final detail—since we swapped out the prototype object that JavaScript created
    for the `SuperHero` function, we need to wire it so that it knows the function
    that owns it, so we align the `constructor` property on `SuperHero.prototype`
    to point back to the `SuperHero` function.^([^(69)](#fn69))


    Wow. That is a lot of work to get inheritance working, not to mention how intricate
    the wiring is, and consequently, how easy it is to miss a step. However, after
    all that, our pictorial representation transforms to what is shown in Figure [11-3](#481812_1_En_11_Chapter.xhtml#Fig3).


    ![../images/481812_1_En_11_Chapter/481812_1_En_11_Fig3_HTML.png](images/481812_1_En_11_Chapter/481812_1_En_11_Fig3_HTML.png)


    Figure 11-3


    Deeper inheritance


    It is imperative that we realize unlike class-based inheritance, inheritance in
    JavaScript is achieved via prototypes. Functions act as simple facilitators that
    allow us to create objects with their prototypes set correctly, thus enabling
    property and method lookup.


    Given that, how does one achieve “static” properties, that is, properties that
    are associated with the “type” vs. the instance? Simply tack on a property to
    the object type, which in JavaScript is the function that created that object.
    So, if we were to tack a property `SuperHero.count`, we could perhaps keep track
    of how many superheroes we construct in our application.


    As we might conclude, while all of the above is rather elegant, the intent of
    inheritance *might* be lost in the machinations. Furthermore, the definition of
    a type is split. Granted, with enough clever code one could attempt to abstract
    that all to one location, but that does little to alleviate the concern at hand,
    namely there is already a lot of codes! Is there a better way to realize all this?
    ES6 activates the `class` keyword, along with a few others to make all of this
    a lot easier to work with. Let us take a look.'
