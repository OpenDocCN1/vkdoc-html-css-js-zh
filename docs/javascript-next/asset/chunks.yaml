  trans: '

    ### 反对使用 `arguments` 的理由


    JavaScript 的 `arguments` 对象一直存在于调用上下文中，用于处理"额外"的参数。让我们回顾之前将传入所有参数进行 `add` 操作的例子：


    ```

    function add( /**args*/ ) {

    let result = 0;

    for (const i in arguments) {

    result += arguments[i];

    }

    return result;

    }

    // 输出 ''20''

    console.log(add(2, 3, 5, 10));

    ```


    这个函数期望接收 `n` 个参数，并通过消耗所有参数来返回结果。它能完成我们的目标吗？当然能。然而，为了表明该函数确实是多参数的，我们不得不借助注释块，从而在实现中隐藏了这一事实。


    使用 `arguments` 还有两个更明显的缺陷。虽然 `arguments` 支持 `length` 属性，并允许我们使用下标（`[]`）运算符来访问某个特定传入参数，但问题是
    `arguments` 对象实际上**不是一个真正的数组**！如果我们想对传入参数进行操作（例如进行 `sort` 排序或 `filter` 过滤），只能将
    `arguments` 强制转换为数组。


    第二个问题是，`arguments` 对象包含**所有**传入函数的参数。如果希望对某些参数进行差异化处理，我们就需要将它们与其他参数分离开来。


    我们可以通过一个模拟飞机登机的简单示例来突出这两个缺陷。示例中的飞机有一名飞行员、一名乘务员和若干名乘客。但我们必须确保先招待最忠诚的客户，因此需要让它们优先登机。每位乘客都有一个
    `status`（身份），身份等级更高的乘客应*先于*其他乘客登机。让我们先编写一个简单的比较函数，通过乘客的身份进行两两比较：


    ```

    const byStatus = (a, b) => {

    let ret;

    if (a.status === ''platinum'' && b.status !== ''platinum'') {

    ret = -1;

    } else if (a.status === ''platinum'' && b.status === ''platinum'') {

    ret = 0;

    } else if (a.status !== ''platinum'' && b.status === ''platinum'') {

    ret = 1;

    }

    return ret;

    };

    ```


    比较函数就绪后，我们可以编写飞机登机算法。请注意，我们将飞机表示为一个数组，首先 `push` 最先登机的飞行员，然后是乘务员，最后是按个人身份排序的乘客：


    *   ① 飞行员先登机

    *   ② 接着是乘务员

    *   ③ 将 `arguments` 转换为数组

    *   ④ 丢弃前两项，因为它们已被处理

    *   ⑤ 使用自定义排序函数对数组中的剩余项进行排序


    ```

    function boardPlane(pilot, crewMember /** , passengers */ ) {

    const plane = [];

    plane.push(pilot); ①

    plane.push(crewMember); ②

    const toArr = Array.prototype.slice.call(arguments); ③

    const passengers = toArr.slice(2, toArr.length); ④

    plane.push(passengers.sort(byStatus)); ⑤

    return plane;

    }

    const passengerOne = {

    name: ''James'',

    status: ''silver'',

    };

    const passengerTwo = {

    name: ''Joseph'',

    status: ''platinum'',

    };

    // 调用函数

    const plane = boardPlane(''Amelia'', ''Rosemary'', passengerOne, passengerTwo);

    console.assert(Array.isArray(plane));

    // 验证飞行员和乘务员先登机

    console.assert(plane[0] === ''Amelia'');

    console.assert(plane[1] === ''Rosemary'');

    // 验证乘客按身份等级登机

    console.assert(Array.isArray(plane[2]));

    console.assert(plane[2][0] === passengerTwo);

    console.assert(plane[2][1] === passengerOne);

    ```


    这段代码可以运行，但感觉很笨拙。我们讨论过的所有缺陷都暴露无遗。首先，我们必须将 `arguments` 对象强制转换为数组，才能最终对乘客进行 `sort`
    排序。其次，`arguments` 对象包含所有传入 `boardPlane` 的参数，因此为了获取乘客，我们必须丢弃前两个参数（即飞行员和乘务员），因为它们已经被处理过了。`arguments`
    对象不会区分已通过函数参数名占位的参数，这迫使开发者自行判断哪些参数已被捕获，哪些代表“剩余”参数。


    唉！要是能有一种方法，自动将所有"未处理"的参数打包成一个数组就好了……


    ### 新的 `...` 语法


    剩余参数使用了一种新语法，即在参数列表中使用 `...argName`。这个参数会收集函数调用中传入的、**尚未被**处理的参数，并将它们封装成一个 `Array`
    对象。


    现在我们可以重构示例，使用剩余参数，如下所示：


    *   ① 显式声明一个剩余参数

    *   ② 直接对剩余参数调用数组方法


    ```

    const boardPlane = (pilot, crewMember, ...passengers) => { ①

    const plane = [];

    plane.push(pilot);

    plane.push(crewMember);

    plane.push(passengers.sort(byStatus)); ②

    return plane;

    };

    const passengerOne = {

    name: ''James'',

    status: ''silver'',

    };

    const passengerTwo = {

    name: ''Joseph'',

    status: ''platinum'',

    };

    // 调用函数

    const plane = boardPlane(''Amelia'', ''Rosemary'', passengerOne, passengerTwo);

    console.assert(Array.isArray(plane));

    // 验证飞行员和乘务员先登机

    console.assert(plane[0] === ''Amelia'');

    console.assert(plane[1] === ''Rosemary'');

    // 验证乘客按身份等级登机

    console.assert(Array.isArray(plane[2]));

    console.assert(plane[2][0] === passengerTwo);

    console.assert(plane[2][1] === passengerOne);

    ```


    几乎像魔法一样，代码变得更简洁，意图也更清晰。不再需要不必要的强制转换，而且由于我们不再需要像处理 `arguments` 那样处理额外参数，像差一错误这样的问题也彻底消除了。取而代之的是，我们获得了一个真正的数组，其中包含构成"剩余"参数的所有传入参数。只需看一眼函数签名，我们就知道所需的一切——这是一个多参数函数，至少需要两个命名得当的参数，以及一个潜在的乘客列表。


    此外，我们还获得了一个额外的好处。这一点很微妙，但让我们看看能否发现原始版本和重构版本之间的另一个区别。看出来了吗？


    回想一下，箭头函数在被调用时**不会**创建 `arguments` 对象。如果我们*需要*使用 `arguments`，就不得不使用常规函数表达式或函数声明。但在这个例子中，我们可以重新使用更简洁的箭头函数来定义
    `boardPlane`。耶！

    '
- fmt: '### The `rest` of the Details (or is it the Details of `rest`?)


    Rest parameters are far less nuanced than some of the other features we have discussed
    so far. If a function uses rest parameters, then this parameter needs to be the
    last one in the argument list. This makes sense, since it acts as a greedy operator,
    gobbling up any and all arguments that have not already been accounted for. Declaring
    a parameter after a rest parameter in a function signature will result in a `SyntaxError`.


    A rest parameter unlike regular parameters **cannot** have a default value assigned
    to it. Rest parameters have an implicit default value, that being an empty array.
    In other words, if there are no parameters left for the rest parameter to consume,
    it will default being an array of length `0`. This plays out well, since we do
    not have to do `undefined` checks.


    Given that a rest parameter allows us to define a multi-arity function, let us
    see how it plays with the `length` property of functions. Recall that the `length`
    property on functions return the formal arity as defined in its signature. Turns
    out that rest parameters do **not** participate in the arity count for functions.


    Functions also do not expose an API to ascertain if a particular function is indeed
    using rest parameters. While this bodes well with JavaScript’s original design
    of every function being implicitly multi-arity, it also leaves us with no way
    to programmatically discover if the last parameter is a rest parameter.


    Finally, we come to rest parameters and the `arguments` object. While arrow functions
    do not get an `arguments` object, regular functions still do. As you might expect,
    the `arguments` object works just as expected—it gathers up **all** the arguments
    supplied to a function without considering the fact that the last parameter is
    a rest parameter.


    Let us quickly explore all of this with a trite example:


    * ① Arity does not include the rest parameter for function expressions

    * ② As well as for arrow functions

    * ③ `arguments.length` reports the total arguments supplied at invocation


    ```

    function fnExpression(a, b, ...c) {

    console.log(arguments.length);

    }

    const fnArrow = (a, b, ...c) => {

    // do not get an arguments object

    };

    console.assert(fnExpression.length === 2); ①

    console.assert(fnArrow.length === 2); ②

    // prints ''6''

    fnExpression(1, 2, 3, 4, 5, 6); ③

    ```


    ### Summary


    Default parameters allow us to be more expressive when defining function signatures.
    They replace superfluous checks with appropriate defaults, thus making our code’s
    intent clearer. Default parameter values are evaluated at invocation time, allowing
    us to defer the parameter being set within the runtime context of our programs.
    Since parameters can “see” parameters defined to the left in the function signature,
    we can make an attempt to make polymorphic functions, and enable the notion of
    “overloaded” methods as might be used in other languages.


    Rest parameters eliminate the need to use the `arguments` object when writing
    multi-arity functions, with the added benefit of explicit function signature support.
    This helps remove unnecessary coercions in our code, and provide a mechanism to
    cleanly capture all arguments not accounted for by parameters.


    Neither default nor rest parameters eliminate the need for good API design; in
    fact they have just the opposite effect. By putting emphasis on parameters that
    appear on the left with decreasing precedence to the right, they compel us to
    discern between parameters that are necessary and need be supplied, vs. those
    that we *might* be able to default.


    All of this combined lessens the contextual overheard clients have to bear when
    using our API. Now, isn’t that worth celebrating?


    In the next chapter we will look at an improvement targeting JavaScript’s inherent
    mechanism for querying elements of arrays, or values in objects, using the new
    spread operator and destructuring syntax. These in tandem with default parameters
    allow us to be even more expressive in our function signatures.


    Footnotes [1](#481812_1_En_3_Chapter.xhtml#Fn1_source) [2](#481812_1_En_3_Chapter.xhtml#Fn2_source)
    [3](#481812_1_En_3_Chapter.xhtml#Fn3_source) [4](#481812_1_En_3_Chapter.xhtml#Fn4_source)


    # 4. Divide and Conquer with Object and Array Destructuring


    JavaScript lets us easily create “bags of data” using objects and arrays, permitting
    us the ability to fluidly wrap data and ship it around in our code. However, the
    syntax afforded to us to “reach” into these data structures tends to be verbose,
    imperative, and error-prone. In ES6 and ES9, JavaScript adopts yet another functional
    construct in the form of the destructuring syntax to improve our experience with
    unwrapping data, bringing it to parity with how we wrap data in the first place.


    In this chapter we will see how the new destructuring syntax for both objects
    and arrays provide an elegant mechanism to reach into data structures. We will
    also learn to couple this with our understanding of default and rest parameters,
    and how these two features work hand in hand to define functions that eloquently
    express their expectations while being more flexible. By the end of this chapter,
    we will be safely querying objects and arrays using a clear, succinct, and highly
    expressive syntax, while improving the way we detail out function signatures.'
