    `finally` is a bit of an exception—it takes no arguments, and is simply a mechanism
    that allows for any cleanup required after the promise resolves. The `finally`
    block **will** be invoked regardless of a resolution or a rejection, much like
    any `try-catch-finally` block you might be used to in other languages.


    A quick demonstration is in order. We will build upon our promisified `XMLHttpRequest`
    example, and register appropriate listeners for a result, and trap any errors.


    *   ① Attach several handlers using the `then` method


    *   ② Ensure we trap any errors using `catch`


    ```

    const req1 = asyncRequest(''GET'', ''https://my-json-server.typicode.com/typicode/demo/posts'');

    req1

    .then(json => JSON.parse(json)) ①

    .then(resp => resp.map(item => item.id))

    .then((ids) => {

    console.log(`Found ${ids.length} posts`);

    return ids;

    })

    .catch(err => console.log(err)); ②

    ```


    The promise API, outside of being fluent, provides a very elegant mechanism to
    decouple *starting* an asynchronous operation, from the consumption of the results
    of said operation. Gone are the nested callbacks; instead the multiple `then`s
    allow us to (better) align our code with how we think and reason about our programs.
    Furthermore, since the chain correctly propagates errors, we can safely trap *any*
    error that may occur in the promise chain.'
  trans: "\n### 使用 Promise\n\nPromise 通过 `Promise` 构造函数创建，该构造函数只接受一个函数作为参数。这个函数本身又接收两个参数，而这两个参数恰好也都是函数。第一个参数用于发出\
    \ Promise 成功兑现的信号，第二个参数则用于发出失败兑现的信号。我们来看一个简单的示例，以便将这个理念具体化：\n\n- ① 使用构造函数创建一个\
    \ promise\n- ② 有条件地将其 `resolve`（兑现）\n- ③ 否则将其 `reject`（拒绝）\n\n```javascript\n\
    const shouldResolve = true;\nconst p = new Promise((resolve, reject) => { // ①\n\
    \  if (shouldResolve) {\n    resolve('I transitioned successfully'); // ②\n  }\
    \ else {\n    reject(new Error('I failed to resolve')); // ③\n  }\n});\nconsole.log(p);\n\
    ```\n\n我们引入*某个*条件变量，作为模拟现实场景中 promise 可能成功兑现或失败兑现的机制。为了先走“顺利路径”，我们将条件变量设置为 `true`。然后，我们使用构造函数创建一个\
    \ promise，通过调用回调处理函数的第一个参数（恰当地命名为 `resolve`），有条件地“兑现”并附带一条消息。如果在浏览器控制台中运行这段代码，会看到以下输出：\n\
    \n```\nPromise { <state>: \"fulfilled\", <value>: \"I transitioned successfully\"\
    \ }\n```\n\n由于我们的条件变量允许 promise 被“兑现”，因此该 promise 现在处于“已兑现”状态，并报告了我们的成功消息。\n\n\
    如果我们尝试运行相同的代码片段，但将条件变量设置为 `false`，我们会注意到该 promise 被“拒绝”了。\n\n```\nPromise { <state>:\
    \ \"rejected\" }\n```\n\nPromise 构造函数提供了一种机制，用于包装任何执行异步任务的现有函数或操作。许多遗留 API 都期望一个回调函数；然而，如果我们希望在任何地方都使用\
    \ promise（我们也应该这样做），那么可以轻松地对使用者隐藏这一点，如下所示：\n\n- ① 将`XMLHttpRequest` 调用包装在一个函数中\n\
    - ② 如果请求成功，则用 `XMLHttpRequest` 对象的响应来 `resolve` 该 promise\n- ③ 否则，适当地包装响应并将其 `reject`\n\
    \n```javascript\nconst asyncRequest = (method, url) => // ①\n  new Promise((resolve,\
    \ reject) => {\n    const xhr = new XMLHttpRequest();\n    xhr.open(method, url,\
    \ true);\n    xhr.onload = () => resolve(xhr.response); // ②\n    xhr.onerror\
    \ = () => reject(new Error(xhr.statusText)); // ③\n    xhr.send();\n  });\nconst\
    \ req1 = asyncRequest('GET', 'https://my-json-server.typicode.com/typicode/demo/posts');\n\
    ```\n\n我们尝试（我必须承认，这种方式相当幼稚^(⁶²)）使用 promise API 来包装基于 `XMLHttpRequest` 的请求。现在，任何对\
    \ `asyncRequest` 的调用都会简单地返回一个 promise，也就是说，在这个例子中 `req1` 是一个 `Promise` 对象。\n\n\
    正如人们可能推断的那样，promise 就像一个状态机。一旦创建，promise 就处于“待定”状态，最终会“转换”到“已兑现”（如果被 resolve）或“已拒绝”（如果被\
    \ reject）状态，从而使 promise 的状态变为“已敲定”。一旦敲定，一个 promise **不能** 恢复到其先前的任何状态，也不能再转换到任何其他状态。\n\
    \n接下来介绍 Promise API！\n\n### 使用 Promise\n\nPromises/A+ 规范提到了一个 `thenable` 对象，它是一个行为类似\
    \ promise 的对象，并且恰好有一个 `then` 方法。ES6 的 promise 符合 Promises/A+ 规范，并相应地公开了一个 `then`\
    \ 方法，该方法允许客户端访问一个已兑现 promise 的*最终*结果，或者其被拒绝的原因。\n\n任何相关方都可以*在任何时候*（甚至在 promise\
    \ 转换之后）通过向 `then` 方法附加一个处理函数来表达对 promise 值的兴趣。如果 promise 成功兑现，这个回调函数将被调用。\n\n\
    `then` 方法也可以接受第二个可选参数，即错误回调函数；如果 promise 被拒绝，这个回调函数将被调用。然而，这被认为是一种[反模式](https://www.datchley.name/promise-patterns-anti-patterns/)^(⁶³)。为了捕获\
    \ promise 链中的错误，promise 对象还公开了一个 `catch` 方法，该方法将捕获所有被拒绝的情况。`finally` 是 promise\
    \ 公开的另一个方法，它允许我们在 promise 敲定后进行任何清理工作；换句话说，无论 promise 是被兑现还是被拒绝，提供给 `finally`\
    \ 的处理函数都会被调用。\n\n`then`、`catch` 和 `finally` 都保证返回 promise 对象。也就是说，我们不需要将这些回调的返回值包装在\
    \ promise 中——我们可以简单地返回任何值或引用，底层机制会自动为我们将该返回值包装在一个 promise 中。\n\n因此，按照惯例，`resolve`\
    \ 和 `then` 方法*应该*分别捕获并 `return` 值，允许下游消费者继续链式调用，而 `reject` 则应该使用 `Error` 对象来完成，这会捕获堆栈跟踪，从而大大简化调试工作。\n\
    \n这就引出了一个问题——`catch` 的返回值应该是什么？回想一下，`then` 和 `catch` 都返回 promise——所以如果有一种方法可以从错误中恢复并允许\
    \ promise 链继续执行，那么 `catch` 处理函数可以返回一个值，同时允许产生副作用（例如记录错误日志）！这样，下游消费者就可以保持对错误的无知，并且可以继续链式调用，确信他们一定会得到一个值（尽管可能是某种默认值）。\n\
    \n`finally` 稍微有些特殊——它不接受任何参数，仅仅是一种机制，允许在 promise 兑现后进行任何所需的清理。无论 promise 是被兑现还是被拒绝，`finally`\
    \ 块**都**会被调用，很像你可能在其他语言中习惯使用的任何 `try-catch-finally` 块。\n\n我们来做个快速演示。我们将基于我们 promise\
    \ 化的 `XMLHttpRequest` 示例进行构建，为结果注册适当的监听器，并捕获任何错误。\n\n- ① 使用 `then` 方法附加多个处理函数\n\
    - ② 确保使用 `catch` 捕获任何错误\n\n```javascript\nconst req1 = asyncRequest('GET', 'https://my-json-server.typicode.com/typicode/demo/posts');\n\
    req1\n  .then(json => JSON.parse(json)) // ①\n  .then(resp => resp.map(item =>\
    \ item.id))\n  .then((ids) => {\n    console.log(`Found ${ids.length} posts`);\n\
    \    return ids;\n  })\n  .catch(err => console.log(err)); // ②\n```\n\nPromise\
    \ API 除了具有流畅的接口之外，还提供了一种非常优雅的机制，用于将*启动*异步操作与该操作结果的消费解耦。不再需要嵌套的回调函数；取而代之的是，多个 `then`\
    \ 允许我们（更好地）使代码与我们思考和推理程序的方式保持一致。此外，由于链式调用能正确传播错误，我们可以安全地捕获 promise 链中可能发生的*任何*错误。\n"
- fmt: '# All or Nothing


    There are scenarios in which we wish to start a multitude of (asynchronous) operations
    in parallel, treating them either as a collective "whole," insofar that we care
    about all of the resolved values, or just one. This is different than us attempting
    to sequence operations, which is when we would use the `then` method available
    on promises.


    The promise API exposes two class level methods, namely `all` and `race` which
    attempt to fulfill this requirement.


    Consider a scenario where you wish to read from multiple files (on disk), or gather
    information from a slew of different endpoints, and only after all the requests
    complete, collate the results. We can use `Promise.all` to start up multiple concurrent
    requests and wait for all of them to complete, like so:


    *   ① Start a lookup for all of a user''s posts

    *   ② Similarly one for all comments

    *   ③ Use `all` to start multiple operations in parallel

    *   ④ Receive an array of resolved values in the same order as the supplied promises


    ```

    const p = asyncRequest(''GET'', ''https://my-json-server.typicode.com/typicode/demo/posts'');
    ①

    const c = asyncRequest(''GET'', ''https://my-json-server.typicode.com/typicode/demo/comments'');
    ②

    Promise.all([p, c]) ③

    .then(([posts, comments]) => ({ ④

    posts: JSON.parse(posts),

    comments: JSON.parse(comments),

    }))

    .then(obj => console.log(obj))

    .catch(err => console.log(err));

    ```


    We care to fetch all of the posts and the comments for a particular user, which
    are independent requests. `Promise.all` takes an array of promises, and in turn,
    returns a promise. If and only if all of the promises supplied to `all` resolve,
    it collects all of the fulfilled values into an array, ordering them in the same
    order as the original order of promises, and calls our `then` handler.


    However, if one or more promises were to fail (with a rejection or an error),
    then the promise that `all` returns is rejected as well.


    Alternatively, there is `Promise.race`. As the name suggests, given an array of
    promises, the first promise to resolve wins the race (or the first one to be rejected),
    and the resolved value of the "winning" promise is the single argument supplied
    to the handler (thus discarding the results of any other promises that resolve
    afterward).


    One interesting use-case for `Promise.race` is when we wish to timeout an asynchronous
    operation, like so:


    *   ① Start a lookup for all of a user''s posts

    *   ② Wrap `setTimeout` in a promise that is rejected after the set interval

    *   ③ Use `race` to start multiple operations in parallel

    *   ④ Receive the array of posts if our request completes prior to our timeout

    *   ⑤ Else catch the rejection to compose a default return value for subsequent
    consumers


    ```

    const p = asyncRequest(''GET'', ''https://my-json-server.typicode.com/typicode/demo/posts'');
    ①

    const timer = new Promise((_, reject) => setTimeout(reject, 1000)); ②

    Promise.race([p, timer]) ③

    .then(posts => ({ ④

    posts: JSON.parse(posts),

    }))

    .catch(() => ({ ⑤

    posts: [],

    }))

    .then(obj => console.log(obj));

    ```


    We leverage multiple techniques here—(naively) wrapping an asynchronous operation
    like `setTimeout` in a promise, `race`-ing our actual request against one that
    is rejected on a timeout, and returning defaults from a `catch` method so subsequent
    consumers can continue chaining.^([^(64)](#fn64)) If you wish to see how `race`
    behaves if we were to timeout before our Ajax request is resolved, simply lower
    the timeout limit to perhaps `ten`.


    Finally, the promise API exposes two additional (static) methods, namely `Promise.resolve`
    and `Promise.reject` which act as handy shortcuts, particularly when testing.


    ## Caveats


    The first limitation is that promises are eager, in that once we initiate an operation
    using a promise, that work **will** be performed, regardless of whether there
    is an interested consumer. That is, a promise will attempt to carry out its assigned
    duties without waiting for a client to attach a `then` handler.


    Consider a scenario where you attempt to resolve some data (via an Ajax call)
    that is to be displayed in a widget prior to displaying the widget on the screen.
    Now, let''s say that a user interaction causes it so that the widget is no longer
    needed. Since promises are eager, the process that fetches the data happens regardless
    of whether there is a widget to consume them. *If* the promise were to wait till
    the widget attached a `then` handler, then our worries would be over. But alas!


    In addition to promises being eager (or *not* lazy), they are also not cancelable.
    That is, the promise object does not expose an API to cancel the underlying process
    that it wraps. Consider a search interface that attempts to refresh the results
    displayed as we type our query (much like Google''s or Netflix''s). This requires
    that we make an Ajax call to the backend for every character typed. However, there
    is a good chance that we start a backend call based on the characters in the search
    input box, and depending on how fast the user types, we may have to start another
    query before the previous one completes. It would be nice if we could simply cancel
    the previous query prior to starting a new one.


    All of this boils down to one simple rule of thumb—don''t compose a promise unless
    you are sure you are going to use it!


    ## The Benefits of a Native API


    The fact that the promise API is now part of the language offers a **huge** advantage
    over using a library, which is, we now have a standard API that unifies how browser
    vendors, libraries, and frameworks can wrap asynchronous operations. For example,
    `window.fetch`^([^(65)](#fn65)) can now return a promise, because the language
    now natively supports promises. One side effect of this is now we have one vocabulary
    to work with anything asynchronous, allowing us, the developers, to develop a
    richer set of patterns and anti-patterns that rally around one central construct,
    namely the promise. Correspondingly, other language constructs like `async`/`await`,
    which we will discuss soon, can also safely use promises.


    More so, the introduction of the promise API in JavaScript is in line with other
    features we have seen, like iterables, that attempt to provide a common denominator
    for both library/framework writers and consumers, while not diverging away from
    well-established community standards like the Promises/A+ specification.


    Going forward, we, as JavaScript developers, will benefit if we rally around (native)
    promises, be that in our code or in the expectations we set from the libraries
    and frameworks we use. Of course, if nothing else, we might be able to finally
    shed our dependency on yet another third-party library. :)


    ## Summary


    Promises, offered as a native API in JavaScript offer a significant advantage
    over using third-party libraries, by allowing all asynchronous operations, be
    that native or other, to return a promise. Granted that promises come with their
    own concerns, however, they are a huge leap forward from the world we previously
    inhabited, wherein we had inconsistent semantics when working with asynchronous
    operations.


    In the next chapter we will look at a much-wanted language feature, namely the
    ability to declare classes to build inheritance trees in JavaScript.


