- fmt: "### Spreading Objects\n\nES9^([^(30)](#fn30)) brings the same operator that\
    \ we use to spread iterables, namely `...` , and makes them available for objects.\
    \ This can be demonstrated by revisiting our earlier example:\n\n- ① Use the spread\
    \ operator\n\n```\nconst michelle = {\n  name: 'Michelle',\n  hobby: 'Gardening',\n\
    };\nconst rachael = {\n  ...michelle, ①\n  ...{\n    name: 'Rachael',\n    profession:\
    \ 'Auditor',\n  },\n};\n// prints '{ name: 'Rachael', hobby: 'Gardening', profession:\
    \ 'Auditor' }'\nconsole.log(rachael);\n```\n\nWe start with a simple object, and\
    \ attempt to construct a new object by spreading one or more objects into a new\
    \ object. This example does not differ significantly from our earlier attempt\
    \ except for the use of the spread operator instead of `Object.assign`. However,\
    \ the new `...` syntax for objects does bring us to parity with how we spread\
    \ iterables. Once again, the spread operator only copies over the enumerable properties\
    \ of the object being spread.\n\nAlso note that the spread operator, just like\
    \ `Object.assign`, respects the order in which we supply its sources. If two or\
    \ more objects being spread happen to have the same key, the last key wins.\n\n\
    As we discussed in the previous section, the important distinction between `Object.assign`\
    \ and the spread operator is the potential for side effects. `Object.assign` takes\
    \ one target (as its first argument), followed by any number of sources. It then\
    \ proceeds to *mutate* the target, copying the enumerable keys of sources into\
    \ the target, and `return`-s the target object. If the target supplied happens\
    \ to be an existing object, it is that object that will be endowed with the keys\
    \ from the sources, thus changing that object.\n\nOn the flip side, the spread\
    \ operator syntax offers us no such avenue. The very syntax of the spread operator\
    \ forces us to spread existing objects into a *new* object. Putting it another\
    \ way, the spread operator syntax encourages immutability.\n\n## Destructuring\n\
    \nIn an earlier discussion we deliberated upon the lack of symmetry between structuring\
    \ (creation) and destructuring (reaching into) for arrays and objects. We touched\
    \ upon several limitations of the existing approach, including the verbose syntax,\
    \ the inability to default for “missing” parts, and lack of expressiveness in\
    \ function signatures to advertise how they are to use their arguments. Now let\
    \ us consider the new destructuring syntax, and how it addresses all of these\
    \ concerns, followed by some of the caveats.\n\n### Array Destructuring\n\nThe\
    \ destructuring syntax for arrays reflects their sequential idiom. Observe.\n\n\
    - ① We start with an array depicting the `rgba` value of the color pink\n- ② We\
    \ reach into the array using the destructuring syntax\n- ③ Reaching for an element\
    \ that the array does not have an index for returns `undefined`\n- ④ If we wish\
    \ to only reach a particular item in the array, we ignore other indexes\n\n```\n\
    const rgba = [239, 15, 255, 0.9]; ①\nconst [r, g, b, a, nonExistent] = rgba; ②\n\
    console.assert(r === 239);\nconsole.assert(g === 15);\nconsole.assert(b === 255);\n\
    console.assert(a === 0.9);\nconsole.assert(nonExistent === undefined); ③\nconst\
    \ [, , blue] = rgba; ④\nconst blueAgain = rgba[2];\nconsole.assert(blue === b);\n\
    console.assert(blueAgain === b);\n```\n\nThe destructuring syntax for arrays uses\
    \ the `[]` syntax on the left hand, that is, assignment side of an expression.\
    \ As we can see, the destructuring assignment permits us to assign variables in\
    \ scope *positionally* just as we would define elements *for* an array. Now, the\
    \ left-hand side of the assignment looks symmetric to the right-hand side. The\
    \ syntax also allows us to skip indexes that may not be needed.\n\nWe can argue\
    \ that the value of array destructuring when reaching for just one element is\
    \ rather dubious when we could simply make use of the bracket notation, and it\
    \ is a valid argument. However, the return of investment when interrogating for\
    \ more than one element from an array certainly makes it worthwhile. Regardless,\
    \ we can accede that operators like the bracket notation, or `length` still remain\
    \ relevant, and should be used as and when deemed appropriate.\n\nFurthermore,\
    \ looking at the assignment we can attempt to *infer*^([^(31)](#fn31)) what the\
    \ array on the right-hand side looks like.\n\nDestructuring elements from an array\
    \ does **not** violate the semantics that we are used to when working with the\
    \ bracket notation. Just as asking an array for an element at an index that exceeds\
    \ its `size` returns `undefined`, so does destructuring.\n\nConsequently, any\
    \ attempt to destruct `undefined` will result in an error. In fact, destructuring\
    \ uses the same iterable machinery that the spread operator uses. Therefore, destructing\
    \ *anything* that does not abide by the iterator interface (which we will see\
    \ shortly) will result in an error.^([^(32)](#fn32))\n\nMuch like default parameters,\
    \ we can also default variable assignments in case an index of interest does not\
    \ exist within the array like so:\n\n- ① Start with an array representing a quadrilateral\n\
    - ② Destructure with defaults assuming a rhombus\n- ③ Destructure with defaults\
    \ assuming a square\n\n```\nconst quadrilateral = [10, 15, 10, 15]; ①\nconst [q1\
    \ = 10,\n       q2 = 20,\n       q3 = q1,\n       q4 = q2] = quadrilateral; ②\n\
    console.assert(q1 === 10);\nconsole.assert(q2 === 15);\nconsole.assert(q3 ===\
    \ 10);\nconsole.assert(q4 === 15);\nconst [sq1 = 10,\n       sq2 = sq1,\n    \
    \   sq3 = sq1,\n       sq4 = sq1] = []; ③\nconsole.assert(sq1 === 10);\nconsole.assert(sq2\
    \ === 10);\nconsole.assert(sq3 === 10);\nconsole.assert(sq4 === 10);\n```\n\n\
    Just like default parameters in function arguments, not only can we default a\
    \ variable if it does not exist in the originating array, but variables to the\
    \ right can default to the values of previously extracted elements!\n\nA function\
    \ invocation in JavaScript also performs assignment; parameters in the method\
    \ signature are assigned to each item in the argument list in turn. Turns out,\
