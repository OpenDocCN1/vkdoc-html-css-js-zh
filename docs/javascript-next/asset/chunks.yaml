    const url = ''https://my-json-server.typicode.com/typicode/demo'';

    const fetchPosts = await fetch(`${url}/posts`); ①

    const posts = await fetchPosts.json();

    const fetchComments = await fetch(`${url}/comments`);

    const comments = await fetchComments.json();

    return {

    posts,

    comments,

    };

    })();

    redundantWaits

    .then(obj => console.log(''From redundantWaits'', obj));

    const synchronousCalls = (async () => {

    const getJson = url => fetch(url).then(resp => resp.json()); ②

    const url = ''https://my-json-server.typicode.com/typicode/demo'';

    const [posts, comments] = await Promise.all([ ③

    getJson(`${url}/posts`),

    getJson(`${url}/comments`),

    ]);

    return {

    posts,

    comments,

    };

    })();

    synchronousCalls

    .then(obj => console.log(''From synchronousCalls'', obj));

    ```


    This time we attempt to accomplish the same task, that is, populating an object
    with the response from several Ajax calls. However, in this case, the operations
    do not depend on the output of one another. This is a classic scenario where we
    should be using the promise APIs to run these tasks concurrently. Of course, like
    any other function that returns promises, we can always use `await` to gather
    up the results of `Promise.all` and get back in imperative mode.


    Another source of potential bugs is if our `async` function relies on some sort
    of global state.^([^(101)](#fn101)) `await` suspends the execution of the function;
    without blocking the main thread, the runtime can continue working. Therefore,
    it would be prudent to assume that the global state does not look the same as
    it did prior to the function being suspended.


    That’s all for gloomy news. On the sunny side, `await` can consume any object
    that is `then`-able—so if we are using some sort of third-party library for promise
    support, `async` can work with those just as if they were native promises. Go
    forth! `await` away!


    ## Summary


    `async`/`await`, alongside promises, allow us to approach writing code in JavaScript
    in a paradigm that best suits our use-case and programming style—the former being
    rather imperative while the latter promoting more of a functional mindset. While
    the imperative nature may seem more natural to many of us, we must keep in mind
    that promises provide us mechanisms like `all` and `race`, that may allow for
    our code to run faster, but also work with `await`, thereby permitting us to raise
    or lower the level of abstraction suitable for the problem at hand. The use of
    promises still has its place, but `await` can certainly help reduce or eliminate
    some of the tax associated with using promises.


    In the next chapter, we will see yet another extension, wherein iterators and
    generators can now work with asynchronous operations just as easily as they do
    with synchronous ones.


