    in an error. Let us look at a snippet of code to see how we can go about initializing
    symbols:


    *   ① Use the factory function to create a new symbol


    *   ② Two symbols never equal each other


    *   ③ For debugging purposes, a description can be supplied to a symbol


    *   ④ Symbols have a `toString` implementation that displays the description if
    provided


    ```

    const symbol1 = Symbol();

    const symbol2 = Symbol(); ①

    console.assert(symbol1 !== symbol2); ②

    const symbol3 = Symbol(''unique''); ③

    // prints Symbol(unique)

    console.log(symbol3); ④

    ```


    The `Symbol` initializer can be provided with a description; however, this description
    has no effect on the symbol being created, other than it being useful for debugging
    purposes.


    Two symbols can **never** be equal to one another—every invocation of the `Symbol`
    initializer returns a new and unique Symbol instance. This is true *even if* the
    description provided is the same (because like we have discussed, the string provided
    to the initializing function is merely for debugging).


    So, we now have a way to create a unique “thing.” How does that help us with naming
    collisions?


    Well, it turns out, we can use symbols as keys in objects! Let us start with seeing
    how we can use both symbols and strings to define properties on objects:


    *   ① Define a symbol


    *   ② A plain JavaScript object with only a name property


    *   ③ Tack on the `iterable` property with no collisions


    *   ④ This object already has a property with the `iterator` name


    *   ⑤ We can still tack on a symbol with the description `iterator` with no collision


    ```

    const ITERATOR = Symbol(''iterator''); ①

    const iterableObject = {

    name: ''iterable'',

    }; ②

    iterableObject[ITERATOR] = function() {

    return ''I am iterable'';

    }; ③

    const objWithExistingKey = {

    iterator: ''some value'',

    }; ④

    objWithExistingKey[ITERATOR] = () => ''Works!''; ⑤

    ```


    Note that we first create a symbol—we then use that *reference* as the name of
    a property on the object, as well as for lookup. As demonstrated, we can use the
    subscript syntax to tack on a new property on an existing object just like we
    would have done with any expression. Lastly, an object can have a combination
    of strings and symbols as its properties, even if the name of the property matches
    the description of the symbol.


    Using our new found knowledge, let us revisit our `simpleLogger` to see how we
    use symbols to “sprinkle” behavior on objects where previously we would have to
    simply submit to the consequences of name collisions.


    *   ① Define `LOG_LEVEL` as a symbol


    *   ② Look up the required property in the switch


    *   ③ Introduce a property using the symbol reference


    *   ④ Now it works!


    ```

    const LOG_LEVEL = Symbol(''log''); ①

    const DEBUG = ''DEBUG'';

    const INFO = ''INFO'';

    const ERROR = ''ERROR'';

    const simpleLogger = (obj, msg) => {

    let returnMsg;

    switch (obj[LOG_LEVEL]) { ②

    case DEBUG:

    returnMsg = `DEBUG: ${msg}`;

    break;

    case INFO:

    returnMsg = `INFO: ${msg}`;

    break;

    case ERROR:

    returnMsg = `ERROR: ${msg}`;

    break;

    default:

    throw new Error(''Invalid LOG_LEVEL'');

    }

    console.log(returnMsg);

    return returnMsg;

    };

    const loggableObj = {

    log: ''this is just an ordinary property'',

    [LOG_LEVEL]: INFO, ③

    };

    simpleLogger(loggableObj, ''this is a test''); ④

    ```


    This example highlights how we can use symbols to introduce conflict-free properties
    on new or existing objects.


    Using symbols to define “interface” or “contract” properties frees library and
    function writers from having to mandate coding conventions, while simultaneously
    allowing clients using these libraries to design their objects as they deem fit,
    and yet be able to use these libraries without fear of collisions.


    Win–win!'
