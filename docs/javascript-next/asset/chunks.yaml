- fmt: '# Asynchronous Iterators


    We understand the role of `Symbol.iterator`, and how it plays with the `for-of`
    loop. ES9 introduces us to a new symbol, namely `Symbol.asyncIterator`, which
    is meant to work for iterables that perform work asynchronously. The contract
    for any object willing to implement the asynchronous iteration protocol is similar
    to that of `Symbol.iterator`, in that upon invocation, it must return an object
    that has a `next` method.


    It is here that the implementation diverges from the one for `Symbol.iterator`.
    Instead of returning an object with the `done` and `value` keys, it should return
    a promise that resolves to such an object. Perhaps this is easier seen in code
    than explained in prose.


    - ① A simple function that pretends to be a backend call

    - ② And consequently `return`-s promises with randomized timeouts

    - ③ A simple class

    - ④ Implement `Symbol.asyncIterator`

    - ⑤ `Symbol.asyncIterator` returns a simple object, namely the iterator

    - ⑥ The iterator has the `next` method

    - ⑦ If we have values to return, return the `value` wrapped in a promise

    - ⑧ Else if we are done iterating return `done: true` wrapped in a promise


    ```javascript

    const fetchFriends = (index) => { ①

    const friends = [

    ''Matt'',

    ''Neal'',

    ''Ken'',

    ];

    const timeout = Math.floor(Math.random() * Math.floor(42));

    if (index < friends.length) {

    return new Promise(res => setTimeout(res, timeout, friends[index])); ②

    }

    return Promise.reject(new Error(''No more records''));

    };

    class FriendsService { ③

    [Symbol.asyncIterator]() { ④

    let index = 0;

    return { ⑤

    next: async () => { ⑥

    // Make an async call to the backend to retrieve the current

    try {

    const friend = await fetchFriends(index);

    index += 1;

    return { value: friend, done: false }; ⑦

    } catch (e) {

    index = 0;

    return { done: true }; ⑧

    }

    },

    };

    }

    }

    ```


    We start by defining a mock database cursor that uses an index to retrieve a friend
    from a friends list. To mimic a real-life scenario, we simulate varying retrieval
    times using a function to generate random timeout values.


    This is followed by a simple class that acts as a service wrapper around an asynchronous
    call. In order to adhere to the asynchronous iterability contract, it implements
    the `Symbol.asyncIterator` method, which returns the iterator. This iterator has
    the `next` method—however, it does not return a value. Rather, it returns the
    value wrapped in a promise.


    The difference between implementing `Symbol.asyncIterator` and `Symbol.iterator`
    is that in the case of the former, *both* the `value` and `done` flag are resolved
    asynchronously.


    ES9 also introduces us to another `for-of` loop, namely the `for-await-of` loop,
    which knows how to iterate over asynchronous iterables. This loop, unlike the
    `for-of` loop, knows to `await` out the promise that is returned from the `next`
    call, before proceeding with the next iteration. As the name suggests, this loop
    utilizes the `await` keyword, and we know that if we are to use `await`, it must
    be inside an `async` function. Let us see how we can use this loop with our iterable:


    - ① Use the `for-await-of` loop


    ```javascript

    (async () => {

    for await (const friend of new FriendsService()) { ①

    console.log(friend);

    }

    })();

    ```


    Once again, we bear the cost of some boilerplate to wrap the call within an anonymous
    `async` function, but if we were to run this, we see that our friends show up
    in the order that they were asked for. The `for-await-of` loop, like its counterpart,
    asks an iterable object for its iterator by invoking the `Symbol.asyncIterator`,
    then proceeds to invoke the `next` method, `await`-ing the promise that is returned
    to be resolved, then extracting the `value`. Note that if the `promise` resolves
    to `done: true`, iteration stops.


    We can always choose to invoke the `next` method ourselves if we choose to, just
    like with synchronous iterators; however, we will have to append a `then` call
    since `next` invocation returns promises.


    ## Cleaning Up


    Asynchronous iterables can do any resource cleanup within its `next` method prior
    to signaling an end to the iteration via `{ done: true }`. This works well since
    it is the iterator that knows it has reached the end.


    However, what happens if the `for-await-of` loop were to prematurely stop iteration?
    Well, just like synchronous iterables, asynchronous iterables can (optionally)
    implement a `return` method. This method will be invoked if the client terminates
    the iteration, like so:


    - ① Implement both the required `next` and optional `return` method

    - ② Break out prematurely in a `for-of` loop


    ```javascript

    class SimpleIterable {

    [Symbol.asyncIterator]() {

    let counter = 0;

    return {

    next: async () => {

    if (counter < 3) {

    counter++;

    return { value: counter, done: false };

    }

    return { done: true };

    },

    return: async () => {

    console.log(''Cleanup called!'');

    return { done: true };

    }, // ①

    };

    }

    }

    (async () => {

    try {

    for await (const n of new SimpleIterable()) { ①

    console.log(n);

    return; ②

    // or break, or throw new Error()

    }

    } catch (e) {

    console.log(''Error'', e);

    }

    })();

    ```


    We have simplified our earlier example to `return` a promise that resolves to
    an incrementing value. But we also implement the `return` method, which in case
    simply logs to confirm that we indeed get called. Note that we should signal that
    the iterable is `done` as the return value of the `return` method.


    Once again, we find parity between `for-await-of` loop and its peer the `for-of`
    loop, in that invoking the `return` method of the iterable is a side effect of
    the underlying machinery. That is, the `for-await-of` loop knows to invoke the
    `return` method on the iterable if we were to prematurely stop iteration. Other
    mechanisms to auto-invoke the `return` method are `throw`-ing an error within
    a `for-await-of` loop, as well as simply `break`-ing from it.


    ## Being Imperative


    The `for-await-of` loop lives up to its promise of making asynchronous code look
    imperative. This facet is accentuated by the mechanism we can use if something
    were to go wrong. What if the asynchronous iterable that we are looping over were
    to be `reject`-ed? Simple. We can wrap our `for-await-of` loop in a traditional
    `try-catch` block. Observe:


    - ① Reject the promise

    - ② Trap the error using the traditional `try-catch` block


    ```javascript

    class SimpleRejectingIterable {

    [Symbol.asyncIterator]() {

    return {

    next: () => Promise.reject(''Error!''), ①

    };

    }

    }

    (async () => {

    try {

    for await (const n of new SimpleRejectingIterable()) {

    // we will never get here

    console.log(n);

    }

    } catch (e) {

    console.log(''Error'', e); ②

    }

    })();

    ```


    Our iterator in this case simply `reject`-s the promise. If we were to run this
    example, we will see that `await` unwraps the error, and rightly propagates the
    error so that the `catch` block catches it. Voila!


    ## Comingling with Synchronous Iterables


    Turns out, the `for-await-of` loop can work with both asynchronous and synchronous
    iterators. This turns out to be rather beneficial, since we can use it to work
    even with regular iterables like arrays, maps, and sets. Let us revisit our example
    of iterating over a list of promises using `for-await-of`:


    - ① A list of promises

    - ② Use the `for-await-of` loop with a synchronous iterable


    ```javascript

    const randomTimeout = async (val, index) => {

    const timeout = Math.floor(Math.random() * Math.floor(42));

    return new Promise(res =>

    setTimeout(res, timeout, `My value is ${val} at index: ${index}`));

    };

    const promiseList = [

    randomTimeout(10, 1),

    randomTimeout(20, 2),

    randomTimeout(30, 3),

    ]; ①

    (async () => {

    for await (const p of promiseList) { ②

    console.log(p);

    }

    })();

    ```


    Allow me to draw your attention to the fact that an array is a synchronous iterable.
    However, as advertised, the `for-await-of` loop can iterate over it. If the values
    returned upon each iteration happen to be a promise, the loop is suspended till
    the value resolves, unwrapped, and handed off to you.'
