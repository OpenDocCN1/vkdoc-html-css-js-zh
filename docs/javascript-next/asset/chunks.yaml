  raw: '### Computed Values


    The computed values enhancement lets us *move* the definition of computed properties
    within the literal syntax, avoiding scattering the definition of literals in different
    places within the codebase. We come back to our earlier example except to use
    inline computed values this time around:


    *   ① A function to create a name from a property


    *   ② Split the name to get the first character


    *   ③ Inline the computed definition


    ```

    const getterFor = (prop) => { ①

    const capitalized = prop.charAt(0).toUpperCase() + prop.slice(1); ②

    return `get${capitalized}`;

    };

    const song = {

    name: ''All You Need Is Love'',

    album: ''Yellow Submarine'',

    [getterFor(''name'')]() { ③

    return song.name;

    },

    [getterFor(''album'')]() {

    return song.album;

    },

    };

    console.assert(song.getName() === song.name);

    console.assert(song.getAlbum() === song.album);

    ```


    This enhancement lets us define a computed property just as we would have, that
    is, using the bracket notation, except that the brackets find themselves inside
    the literal, making them first class like any other property definition. The new
    syntax also adapts the symmetry introduced by the method definition shorthand,
    allowing us to avoid the superfluous `function` keyword. Likewise, if we were
    defining a property vs. a method, the familiar `key:value` syntax applies here
    just as it does for traditional keys except the computation of the key name would
    still be enclosed within square brackets. Therefore, the equivalent for computed
    properties would be `[computedKey]:value`.


    ### Property Value Shorthand


    The value shorthand, rather than being a new way to define properties (and methods),
    provides a way to reduce the verbosity often seen in the revealing module pattern,
    or node `exports`. It lets us condense the definition of a key-value pair in an
    object literal only if the name of the key matches an existing variable in scope.


    We revisit our revealing module pattern definition, but this time using the value
    shorthand:


    *   ① Use the property value shorthand


    ```

    const greeter = (function() {

    let  greeting = ''Hello'';

    const exclaim = msg => `${msg}!`;

    const greet = name => exclaim(`${greeting} ${name}`);

    const salutation = (newGreeting) => {

    greeting = newGreeting;

    };

    return {

    greet, ①

    salutation,

    };

    // equivalent to

    /*

    return {

    greet: greet,

    salutation: salutation

    }

    */

    }());

    console.assert(greeter.greet(''Mason'') === ''Hello Mason!'');

    greeter.salutation(''Hola'');

    console.assert(greeter.greet(''Micah'') === ''Hola Micah!'');

    ```


    In this example, the properties (keys) introduced in the (returned) module have
    the same name as their values—we are now allowed to eliminate the duplication
    using the shorthand syntax. Of course, we are allowed to mix and match the property
    value shorthand alongside the familiar `key:value` notation we are used to if
    need be. This is handy if the names of certain keys in the object being returned
    do **not** line up with the name of any variables in scope.


    This may seem like a small win, but if we were to extrapolate the gains for large
    modules, perhaps we can see how much repetition we can avoid, thus embracing DRY
    and avoiding potential bugs introduced by typos.


    ## The Case of the Trailing Comma


    JavaScript has permitted “trailing commas” in array and object literals for a
    while now:


    *   ① The trailing comma in array literals


    *   ② The trailing comma in object literals


    ```

    const friedmanBooks = [

    ''The Little Schemer'',

    ''The Seasoned Schemer'',

    ''The Reasoned Schemer'', ①

    ];

    const hoyteBook = {

    name: ''Let Over Lambda'',

    author: ''Doug Hoyte'',

    isbn10: ''1435712757'', ②

    };

    ```


    Trailing commas as a feature might seem trite, but they pack a powerful punch.
    They make our code consistent, in that every line in an array or object definition
    looks the same. This makes it easy to reorder items in literals, and produces
    cleaner diffs in version control systems if items are added or removed, particularly
    at the end of literals.


    ES7 brought trailing commas to function parameter lists, and function invocations:


    *   ① The trailing comma in function parameter list


    *   ② The trailing comma in function invocations


    ```

    const rate = (

    book,

    starCount, ①

    ) => `You rated ''${book}'' ${starCount} stars`;

    const rating = rate(

    ''Practical Common Lisp'',

    5, ②

    );

    // prints ''You rated ''Practical Common Lisp'' 5 stars''

    console.log(rating);

    ```


    This addition aims to bring parity, and consequently all the benefits of trailing
    commas to function definitions and invocations.


    Ostensibly trailing commas only add value if the elements are listed on new-lines.
    As a result, it is preferred to enforce trailing commas only if the element (or
    object property) is on a line of its own. Most linters like ESLint^([^(49)](#fn49))
    can be configured to flag missing trailing commas only on multiline declarations.


    ## Summary


    ES6 introduces a slew of new syntax and APIs that make creating new objects, both
    literally, and from existing objects easier, less verbose, and less error-prone.


    In the next chapter we will explore `Symbol`s, a new primitive type introduced
    in ES6, that are typically used in conjunction with the enhanced literal syntax,
    both as a mechanism to introduce “unique” keys in an object and modifying the
    behavior of your objects via metaprogramming.


    Footnotes [1](#481812_1_En_7_Chapter.xhtml#Fn1_source)


    # 8. Hiding Behind Symbols


    ## Introduction


    Property naming in JavaScript objects presents one major obstacle, especially
    when working with third-party libraries or frameworks, which is, property name
    collisions. We have surrendered to the idea that we will be constrained in how
    we can or cannot name our variables and properties. Warning such as “Do not use
    $ prefix for the names of variables, properties and methods. This prefix is reserved
    for <INSERT FRAMEWORK/LIBRARY NAME HERE> usage” are common, and something we just
    take in stride.


    Well no more!


    In this chapter, we will see how a new data type introduced in ES6, namely `Symbol,`
    helps us eliminate this obstacle, freeing us from this constraint, and allowing
    us to lay out our objects as we wish, knowing that we will not in any way be limited
    with what or how we can use them in whatever setting that we wish to. We will
    also see how we can modify the behavior of built-in operations like `String.match`
    and `String.split` using `Symbol`s. By the end of this chapter we will have freed
    ourselves from the tyranny of enforced naming conventions, leaving us dancing
    alongside all libraries and frameworks, not to mention JavaScript itself, as one
    happy family.'
  trans: '

    # 计算属性值


    计算属性值的增强特性让我们能够在字面量语法内部定义计算属性，从而避免将字面量的定义分散在代码库的不同位置。我们回到之前的示例，不过这次改用内联计算属性：


    - ① 一个根据属性创建名称的函数

    - ② 拆分名称以获取第一个字符

    - ③ 内联计算属性的定义


    ```

    const getterFor = (prop) => { ①

    const capitalized = prop.charAt(0).toUpperCase() + prop.slice(1); ②

    return `get${capitalized}`;

    };

    const song = {

    name: ''All You Need Is Love'',

    album: ''Yellow Submarine'',

    [getterFor(''name'')]() { ③

    return song.name;

    },

    [getterFor(''album'')]() {

    return song.album;

    },

    };

    console.assert(song.getName() === song.name);

    console.assert(song.getAlbum() === song.album);

    ```


    这一增强特性让我们可以像往常一样定义计算属性，即使用方括号语法，只不过方括号现在出现在字面量内部，使它们与其他属性定义一样成为一等公民。新的语法还沿用了方法定义简写引入的对称性，让我们可以省略多余的
    `function` 关键字。同样地，如果我们要定义的是属性而非方法，熟悉的 `key:value` 语法在这里同样适用，与传统键名不同的是，计算键名仍需要用方括号括起来。因此，计算属性的等价写法是
    `[computedKey]:value`。


    # 属性值简写


    属性值简写并不是定义属性（和方法）的新方式，而是提供了一种减少“揭示模块模式”或 node `exports` 中常见冗余代码的方法。它允许我们仅在键名与作用域中现有变量名匹配时，压缩对象字面量中键值对的定义。


    我们重新审视揭示模块模式的定义，这次使用属性值简写：


    - ① 使用属性值简写


    ```

    const greeter = (function() {

    let  greeting = ''Hello'';

    const exclaim = msg => `${msg}!`;

    const greet = name => exclaim(`${greeting} ${name}`);

    const salutation = (newGreeting) => {

    greeting = newGreeting;

    };

    return {

    greet, ①

    salutation,

    };

    // 等价于

    /*

    return {

    greet: greet,

    salutation: salutation

    }

    */

    }());

    console.assert(greeter.greet(''Mason'') === ''Hello Mason!'');

    greeter.salutation(''Hola'');

    console.assert(greeter.greet(''Micah'') === ''Hola Micah!'');

    ```


    在这个例子中，（返回的）模块中引入的属性（键）与其值同名——现在我们就可以使用简写语法来消除这种重复。当然，如果需要，我们也可以将属性值简写与熟悉的 `key:value`
    记号混合使用。当返回对象中某些键的名称与作用域中任何变量的名称**不**匹配时，这种方式会非常方便。


    这看似微小的优化，但如果将其推广到大型模块，或许我们就能看出可以避免多少重复，从而遵循 DRY 原则，并避免因拼写错误而引入潜在 bug。


    # 尾逗号的情况


    JavaScript 已经允许在数组和对象字面量中使用“尾逗号”：


    - ① 数组字面量中的尾逗号

    - ② 对象字面量中的尾逗号


    ```

    const friedmanBooks = [

    ''The Little Schemer'',

    ''The Seasoned Schemer'',

    ''The Reasoned Schemer'', ①

    ];

    const hoyteBook = {

    name: ''Let Over Lambda'',

    author: ''Doug Hoyte'',

    isbn10: ''1435712757'', ②

    };

    ```


    尾逗号这个特性看似微不足道，但它具有强大的功效。它使我们的代码保持一致性，让数组或对象定义中的每一行看起来都一样。这使得字面量中项目的重新排序变得容易，并且在版本控制系统中添加或删除项目（尤其是在字面量的末尾）时，会产生更清晰的差异对比。


    ES7 将尾逗号引入到函数参数列表和函数调用中：


    - ① 函数参数列表中的尾逗号

    - ② 函数调用中的尾逗号


    ```

    const rate = (

    book,

    starCount, ①

    ) => `You rated ''${book}'' ${starCount} stars`;

    const rating = rate(

    ''Practical Common Lisp'',

    5, ②

    );

    // 输出 ''You rated ''Practical Common Lisp'' 5 stars''

    console.log(rating);

    ```


    这一添加旨在实现一致性，从而使函数定义和调用也能享受尾逗号的所有好处。


    表面上看，尾逗号只有在元素单独成行时才有价值。因此，建议仅在元素（或对象属性）独占一行时强制执行尾逗号。大多数像 `ESLint` 这样的代码检查工具都可以配置为仅在多行声明中标记缺失的尾逗号。


    # 总结


    ES6 引入了一系列新的语法和 API，使得创建新对象（无论是通过字面量还是基于现有对象）变得更加简单、简洁且不易出错。


    在下一章中，我们将探索 `Symbol`——ES6 引入的一种新的原始类型，它通常与增强的字面量语法结合使用，既可作为在对象中引入“唯一”键的机制，也可通过元编程来修改对象的行为。


    # 8. 隐藏在 Symbol 背后


    ## 简介


    JavaScript 对象中的属性命名存在一个主要障碍，尤其是在使用第三方库或框架时，那就是属性名冲突。我们不得不接受这样的限制：在变量和属性的命名方式上会受到约束。诸如“不要使用
    `$` 前缀作为变量、属性和方法的名称。此前缀为 `<插入框架/库名称>` 所保留”这样的警告屡见不鲜，而我们也只能坦然接受。


    好了，这种情况不会再发生了！


    在本章中，我们将看到 ES6 引入的一种新数据类型——`Symbol`，如何帮助我们消除这一障碍，摆脱这种约束，让我们能够随心所欲地设计对象，并且知道在任何我们想要使用的环境中，都不会受到任何限制。我们还将看到如何使用
    `Symbol` 来修改内置操作（如 `String.match` 和 `String.split`）的行为。在本章结束时，我们将从强制命名约定的专制中解放出来，与所有库和框架，更不用说
    JavaScript 本身，和谐共处，如同一个快乐的大家庭。

    '
- fmt: '# The Inability to Enforce a Contract


    Let’s say we are making use of a third-party library in our code, and it exposes
    a function that expects the objects you supply it to have a property with a *specific*
    name. Consider a simple example:


    * ① Convenient `const` to make things easier

    * ② Look up the property the implementation expects to find on the supplied object

    * ③ Tack a property on a simple object so it can be used by `simpleLogger`

    * ④ Another object that just happens to have a `log` property

    * ⑤ Now what do we do?


    ```

    const LOG_LEVEL = ''log''; ①

    const DEBUG = ''DEBUG'';

    const INFO = ''INFO'';

    const ERROR = ''ERROR'';

    const simpleLogger = (obj, msg) => {

    let returnMsg;

    switch (obj[LOG_LEVEL]) { ②

    case DEBUG:

    returnMsg = `DEBUG: ${msg}`;

    break;

    case INFO:

    returnMsg = `INFO: ${msg}`;

    break;

    case ERROR:

    returnMsg = `ERROR: ${msg}`;

    break;

    default:

    throw new Error(''Invalid LOG_LEVEL'');

    }

    console.log(returnMsg);

    return returnMsg;

    };

    const loggableObj = {

    [LOG_LEVEL]: INFO, ③

    };

    simpleLogger(loggableObj, ''this is a test'');

    const someOtherObject = {

    log: ''this is just an ordinary property'', ④

    };

    // simpleLogger(someOtherObject, ''some message'') ⑤

    ```


    In this example, the library function expects that any object supplied to it must
    have a property called `log`. The library conveniently gives us a `const` we can
    use along with the enhanced literal syntax to tack the appropriate property on
    our objects. Internally, the `simpleLogger` function interrogates the `log` property
    to establish the logging level, and then prints out the appropriate message.


    But what if our object already has a name property called `log` that serves a
    completely different purpose? That is, our intention with the `log` property collides
    with how the function expects it to be used. So, we can either choose to replace
    ours to accommodate the needs of the library or choose not to use the library
    altogether. None of those seem like great options.


    The issue here is although we have `const`, which allows us to safely reference
    a “name” that we will always get the right *value*, strings and consequently object
    keys (be that property or method) *can* collide! This is the reason why often
    libraries that introduce and/or expect “special” properties on other objects use
    a naming convention—like prefixing the injected properties with a `_` or a `$`,
    and decreeing that developers that use that library should **not** use the same
    prefix within their code. Consider the AngularJS style guide, which explicitly
    states the following:


    > *Do not use $ prefix for the names of variables, properties and methods. This
    prefix is reserved for AngularJS usage.*


    The dilemma presented here is that in order to address our needs, we need a way
    to define a *name* that has no chance of a collision, in other words, a truly
    unique name that does not, and cannot, in any way impugn with any existing names
    or properties. Furthermore, we wish to do this without being forced to enforce
    coding policies, or even worse, use some arcane naming policy like the use UUIDs
    to avoid conflicts!


    # Symbols to the Rescue


    Symbols are a **new** primitive type that was introduced in ES6. Much like other
    primitives, symbols have a wrapper type, named `Symbol`, which offers a factory
    function to initialize new symbols. Unlike other wrapper objects like `String`,
    we are **not** allowed to `new` a symbol—that is, using `new Symbol()` will result
    in an error. Let us look at a snippet of code to see how we can go about initializing
    symbols:


    * ① Use the factory function to create a new symbol

    * ② Two symbols never equal each other

    * ③ For debugging purposes, a description can be supplied to a symbol

    * ④ Symbols have a `toString` implementation that displays the description if
    provided


    ```

    const symbol1 = Symbol();

    const symbol2 = Symbol(); ①

    console.assert(symbol1 !== symbol2); ②

    const symbol3 = Symbol(''unique''); ③

    // prints Symbol(unique)

    console.log(symbol3); ④

    ```


    The `Symbol` initializer can be provided with a description; however, this description
    has no effect on the symbol being created, other than it being useful for debugging
    purposes.


    Two symbols can **never** be equal to one another—every invocation of the `Symbol`
    initializer returns a new and unique Symbol instance. This is true *even if* the
    description provided is the same (because like we have discussed, the string provided
    to the initializing function is merely for debugging).


    So, we now have a way to create a unique “thing.” How does that help us with naming
    collisions?


    Well, it turns out, we can use symbols as keys in objects! Let us start with seeing
    how we can use both symbols and strings to define properties on objects:


    * ① Define a symbol

    * ② A plain JavaScript object with only a name property

    * ③ Tack on the `iterable` property with no collisions

    * ④ This object already has a property with the `iterator` name

    * ⑤ We can still tack on a symbol with the description `iterator` with no collision


    ```

    const ITERATOR = Symbol(''iterator''); ①

    const iterableObject = {

    name: ''iterable'',

    }; ②

    iterableObject[ITERATOR] = function() {

    return ''I am iterable'';

    }; ③

    const objWithExistingKey = {

    iterator: ''some value'',

    }; ④

    objWithExistingKey[ITERATOR] = () => ''Works!''; ⑤

    ```


    Note that we first create a symbol—we then use that *reference* as the name of
    a property on the object, as well as for lookup. As demonstrated, we can use the
    subscript syntax to tack on a new property on an existing object just like we
    would have done with any expression. Lastly, an object can have a combination
    of strings and symbols as its properties, even if the name of the property matches
    the description of the symbol.


    Using our new found knowledge, let us revisit our `simpleLogger` to see how we
    use symbols to “sprinkle” behavior on objects where previously we would have to
    simply submit to the consequences of name collisions.


    * ① Define `LOG_LEVEL` as a symbol

    * ② Look up the required property in the switch

    * ③ Introduce a property using the symbol reference

    * ④ Now it works!


    ```

    const LOG_LEVEL = Symbol(''log''); ①

    const DEBUG = ''DEBUG'';

    const INFO = ''INFO'';

    const ERROR = ''ERROR'';

    const simpleLogger = (obj, msg) => {

    let returnMsg;

    switch (obj[LOG_LEVEL]) { ②

    case DEBUG:

    returnMsg = `DEBUG: ${msg}`;

    break;

    case INFO:

    returnMsg = `INFO: ${msg}`;

    break;

    case ERROR:

    returnMsg = `ERROR: ${msg}`;

    break;

    default:

    throw new Error(''Invalid LOG_LEVEL'');

    }

    console.log(returnMsg);

    return returnMsg;

    };

    const loggableObj = {

    log: ''this is just an ordinary property'',

    [LOG_LEVEL]: INFO, ③

    };

    simpleLogger(loggableObj, ''this is a test''); ④

    ```


    This example highlights how we can use symbols to introduce conflict-free properties
    on new or existing objects.


    Using symbols to define “interface” or “contract” properties frees library and
    function writers from having to mandate coding conventions, while simultaneously
    allowing clients using these libraries to design their objects as they deem fit,
    and yet be able to use these libraries without fear of collisions.


    Win–win!'
