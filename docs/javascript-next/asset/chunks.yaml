- fmt: '# Computed Values


    The computed values enhancement lets us move the definition of computed properties
    within the literal syntax, avoiding scattering the definition of literals in different
    places within the codebase. We come back to our earlier example except to use
    inline computed values this time around:


    - ① A function to create a name from a property

    - ② Split the name to get the first character

    - ③ Inline the computed definition


    ```

    const getterFor = (prop) => { ①

    const capitalized = prop.charAt(0).toUpperCase() + prop.slice(1); ②

    return `get${capitalized}`;

    };

    const song = {

    name: ''All You Need Is Love'',

    album: ''Yellow Submarine'',

    [getterFor(''name'')]() { ③

    return song.name;

    },

    [getterFor(''album'')]() {

    return song.album;

    },

    };

    console.assert(song.getName() === song.name);

    console.assert(song.getAlbum() === song.album);

    ```


    This enhancement lets us define a computed property just as we would have, that
    is, using the bracket notation, except that the brackets find themselves inside
    the literal, making them first class like any other property definition. The new
    syntax also adapts the symmetry introduced by the method definition shorthand,
    allowing us to avoid the superfluous `function` keyword. Likewise, if we were
    defining a property vs. a method, the familiar `key:value` syntax applies here
    just as it does for traditional keys except the computation of the key name would
    still be enclosed within square brackets. Therefore, the equivalent for computed
    properties would be `[computedKey]:value`.


    # Property Value Shorthand


    The value shorthand, rather than being a new way to define properties (and methods),
    provides a way to reduce the verbosity often seen in the revealing module pattern,
    or node `exports`. It lets us condense the definition of a key-value pair in an
    object literal only if the name of the key matches an existing variable in scope.


    We revisit our revealing module pattern definition, but this time using the value
    shorthand:


    - ① Use the property value shorthand


    ```

    const greeter = (function() {

    let  greeting = ''Hello'';

    const exclaim = msg => `${msg}!`;

    const greet = name => exclaim(`${greeting} ${name}`);

    const salutation = (newGreeting) => {

    greeting = newGreeting;

    };

    return {

    greet, ①

    salutation,

    };

    // equivalent to

    /*

    return {

    greet: greet,

    salutation: salutation

    }

    */

    }());

    console.assert(greeter.greet(''Mason'') === ''Hello Mason!'');

    greeter.salutation(''Hola'');

    console.assert(greeter.greet(''Micah'') === ''Hola Micah!'');

    ```


    In this example, the properties (keys) introduced in the (returned) module have
    the same name as their values—we are now allowed to eliminate the duplication
    using the shorthand syntax. Of course, we are allowed to mix and match the property
    value shorthand alongside the familiar `key:value` notation we are used to if
    need be. This is handy if the names of certain keys in the object being returned
    do **not** line up with the name of any variables in scope.


    This may seem like a small win, but if we were to extrapolate the gains for large
    modules, perhaps we can see how much repetition we can avoid, thus embracing DRY
    and avoiding potential bugs introduced by typos.


    # The Case of the Trailing Comma


    JavaScript has permitted "trailing commas" in array and object literals for a
    while now:


    - ① The trailing comma in array literals

    - ② The trailing comma in object literals


    ```

    const friedmanBooks = [

    ''The Little Schemer'',

    ''The Seasoned Schemer'',

    ''The Reasoned Schemer'', ①

    ];

    const hoyteBook = {

    name: ''Let Over Lambda'',

    author: ''Doug Hoyte'',

    isbn10: ''1435712757'', ②

    };

    ```


    Trailing commas as a feature might seem trite, but they pack a powerful punch.
    They make our code consistent, in that every line in an array or object definition
    looks the same. This makes it easy to reorder items in literals, and produces
    cleaner diffs in version control systems if items are added or removed, particularly
    at the end of literals.


    ES7 brought trailing commas to function parameter lists, and function invocations:


    - ① The trailing comma in function parameter list

    - ② The trailing comma in function invocations


    ```

    const rate = (

    book,

    starCount, ①

    ) => `You rated ''${book}'' ${starCount} stars`;

    const rating = rate(

    ''Practical Common Lisp'',

    5, ②

    );

    // prints ''You rated ''Practical Common Lisp'' 5 stars''

    console.log(rating);

    ```


    This addition aims to bring parity, and consequently all the benefits of trailing
    commas to function definitions and invocations.


    Ostensibly trailing commas only add value if the elements are listed on new-lines.
    As a result, it is preferred to enforce trailing commas only if the element (or
    object property) is on a line of its own. Most linters like `ESLint` can be configured
    to flag missing trailing commas only on multiline declarations.


    # Summary


    ES6 introduces a slew of new syntax and APIs that make creating new objects, both
    literally, and from existing objects easier, less verbose, and less error-prone.


    In the next chapter we will explore `Symbol`s, a new primitive type introduced
    in ES6, that are typically used in conjunction with the enhanced literal syntax,
    both as a mechanism to introduce "unique" keys in an object and modifying the
    behavior of your objects via metaprogramming.


    # 8. Hiding Behind Symbols


    ## Introduction


    Property naming in JavaScript objects presents one major obstacle, especially
    when working with third-party libraries or frameworks, which is, property name
    collisions. We have surrendered to the idea that we will be constrained in how
    we can or cannot name our variables and properties. Warning such as "Do not use
    `$` prefix for the names of variables, properties and methods. This prefix is
    reserved for `<INSERT FRAMEWORK/LIBRARY NAME HERE>` usage" are common, and something
    we just take in stride.


    Well no more!


    In this chapter, we will see how a new data type introduced in ES6, namely `Symbol`,
    helps us eliminate this obstacle, freeing us from this constraint, and allowing
    us to lay out our objects as we wish, knowing that we will not in any way be limited
    with what or how we can use them in whatever setting that we wish to. We will
