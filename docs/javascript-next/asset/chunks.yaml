  trans: '

    # for-of 循环


    ES6 引入了一种全新的循环机制，即 `for-of` 循环，其立竿见影的好处可通过以下步骤轻松展示：


    - ① 定义一个数组

    - ② 使用 `for-of` 循环

    - ③ 打印数组中的每一项


    ```

    const arr = [''a'', ''b'', ''c'']; ①

    for (const k of arr) { ②

    // 依次打印 ''a'', ''b'', ''c''

    console.log(k); ③

    }

    ```


    让我们暂停片刻，欣赏一下 `for-of` 循环的精妙之处。命令式带索引的 `for` 循环不见了，也无需再使用 `for-in` 循环。剩下的只有代码的真实意图——遍历数组以按顺序获取每个*元素*！


    这之所以行得通，是因为 `for-of` 循环可以遍历任何碰巧是“可迭代”的对象，而数组在 ES6 中恰好是可迭代的。也就是说，它们提供了一套规范的迭代 API，使得
    `for-of` 循环能够按正确顺序获取数组中的每个元素。


    不仅如此——映射（Map）、集合（Set）和字符串也都是可迭代的，因此我们可以对它们全部使用 `for-of` 循环：


    - ① 考虑到每次迭代会返回一个键值对，我们可以使用数组解构


    ```

    const array = [10, 20, 30, 40, 50];

    for (const i of array) {

    console.log(i);

    }

    const set = new Set([''a'', ''set'', true, false]);

    for (const i of set) {

    console.log(i);

    }

    const map = new Map([

    [''s'', ''is a string''],

    [true, ''is a boolean''],

    ]);

    for (const [k, v] of map) { ①

    console.log(`${k}->${v}`);

    }

    const string = ''ES6 is awesome!'';

    for (const i of string) {

    console.log(i);

    }

    ```


    事实证明，任何对象或集合只要符合可迭代协议，就能参与 `for-of` 循环。让我们来看看在 JavaScript 中“可迭代”意味着什么。


    ## 可迭代对象与迭代器


    像 Java 这样的静态类型语言为我们提供了名为 `Iterator` 的接口。接口是一种契约，要求对象公开特定的 API，并且这种契约由运行时强制实施。在
    Java 中，任何“实现” `Iterator` 接口的对象实质上都是向外界声明它可被迭代。类似地，像 Ruby 这样的动态类型语言也有契约的*概念*，本质上是通过约定实现的。


    无论语言类型是静态还是动态，它们都提供了一种将对象标记为可迭代的方式，使得消费者能够以标准方式访问该对象的各个元素，而无需对象暴露其任何内部实现细节。此外，由于访问元素是通过某种契约进行的，语言本身可以提供额外的结构（如
    Java 增强的 `for` 循环），利用相同的机制进行循环。


    通常，为了成为可迭代对象，该对象（或集合）**必须**实现一个声明自身可迭代的 API（例如在 Java 中，对象必须实现 `Iterator` 接口），从而能够回答两个问题：


    - 我还有更多元素吗？

    - 如果有，那个元素是什么？


    JavaScript 在 ES6 中宣布了对对象和集合实现可迭代的类似支持。然而，JavaScript 作为一种解释型语言，并没有运行时强制实施契约，而是通过约定来施加行为。这个约定如下——任何对象要成为可迭代对象，它必须具有一个名称为
    `Symbol.iterator`（另一个众所周知的符号）的方法。该方法的返回值**必须**是一个具有零参数（即无参数）`next` 方法的对象，而该方法又返回一个包含两个属性的对象：


    - `done`——一个布尔值，用于回答是否还有更多元素可供迭代

    - `value`——当前项


    我们可以通过一个简单的示例让事情更清晰：


    - ① 定义一个简单对象

    - ② 实现 `Symbol.iterator` 方法

    - ③ 迭代器方法返回可迭代对象

    - ④ 可迭代对象实现 `next` 方法

    - ⑤ 如果迭代结束，将 `done` 标记为 `true`

    - ⑥ 如果迭代未结束，返回 `value` 值

    - ⑦ 获取迭代器的引用

    - ⑧ 开始迭代


    ```

    const arrayList = { ①

    data: [1, 2, 3, 4, 5],

    [Symbol.iterator]() { ②

    let index = 0;

    return { ③

    next: () => { ④

    if (index === this.data.length) {

    return {

    done: true, ⑤

    };

    }

    const ret = this.data[index];

    index++;

    return {

    done: false,

    value: ret,

    }; ⑥

    },

    };

    },

    };

    const iterator = arrayList[Symbol.iterator](); ⑦

    // 打印 ''{ done: false, value: 1 }''

    console.log(iterator.next()); ⑧

    ```


    我们在这里尝试实现一个可迭代的数组列表。由于要遵守可迭代协议，我们实现了一个名为 `Symbol.iterator` 的方法。当调用这个迭代器方法时，它会返回一个新对象，由该对象为我们执行迭代。


    请注意，对 `next` 的任何调用返回值都是一个对象，该对象适当地设置了 `done` 标志，并且如果需要，还包含了 `value`。


    既然我们已经了解了实现的大致样子，接下来让我们梳理一下各个活动部件。JavaScript 中的迭代由两个（或三个，取决于你怎么看）不同的部分组成：


    - “可迭代”的对象，即具有 `Symbol.iterator` 方法的对象

    - 调用迭代器方法时*返回*的对象，即“迭代器”，它本身具有 `next` 方法


    最后，还有 `next` 调用的结果，我们可以将其视为迭代器契约的一部分，或者简单地称为迭代器结果。大功告成！我们的 `arrayList` 成功实现了使其可迭代所需的所有部分。现在，我们可以像使用数组一样，使用
    `for-of` 循环来遍历它。请看：


    ```

    // 使用前面示例中的 arrayList 实现

    for (const v of arrayList) {

    // 依次打印 1, 2, 3, 4, 5

    console.log(v);

    }

    ```


    这一切归结为：JavaScript 现在拥有了一套规范化的 API，任何客户端都可以安全地使用它来遍历我们的对象！


    ### 清理工作


    我们知道迭代器需要实现 `next` 方法。当该方法到达可迭代对象的末尾时，它可以在通过 `{ done: true }` 发出结束信号之前，执行任何必要的清理工作。


    但是，如果消费者提前停止迭代会发生什么？实际上，迭代器可以（可选地）实现一个 `return` 方法，当消费者终止迭代时将调用该方法。考虑以下情况：


    - ① 实现必需的 `next` 方法和可选的 `return` 方法

    - ② 在 `for-of` 循环中提前退出


    ```

    const incrementor = {

    [Symbol.iterator]() {

    let start = 0;

    return {

    next() {

    return {

    value: start++,

    done: false,

    };

    },

    return: function () { ①

    console.log(''正在清理...'');

    return {

    done: true,

    };

    },

    };

    },

    };

    for (const v of incrementor) {

    if (v > 10) {

    break; ②

    }

    console.log(v);

    }

    ```


    这里我们有一个简单的递增可迭代对象，它同时实现了 `next` 和 `return` 方法。我们使用新朋友 `for-of` 循环开始遍历该对象，并有条件地
    `break` 跳出循环。如果运行这个示例，我们将在控制台中看到清理消息。请注意，我们返回了 `done: true` 来表示迭代器现在已完成。


    这种机制是 `for-of` 循环了解迭代器机制的一个副作用——此外，不仅是 `break`，在 `for-of` 循环*内部*抛出错误（`throw`）以及从
    `for-of` 循环中返回（`return`）都会调用迭代器的 `return` 方法。


    如果我们显式地调用 `next` 方法，那么当迭代完成后，我们需要调用 `return`。

    '
- fmt: '### Other Benefits


    Having a standard approach to iterability permits JavaScript to build additional
    constructs on top of the API, while simultaneously allowing other libraries to
    devise their objects to leverage the same mechanisms. In Chapter [4](#481812_1_En_4_Chapter.xhtml)
    we discussed the `spread` operator, and learned that anything that is iterable
    is also spreadable. Reiterating, the spread operator introduced in ES6 hooks into
    the exact same machinery that the `for-of` loop does.


    Furthermore, going forward, any object, including ones that we may introduce in
    our applications, the collections provided by libraries like `Immutable.js` as
    well as `NodeList`s (returned by `document.querySelectorAll`） can be both safely
    and correctly looped over, as well as "spread"!^([^(57)](#fn57))


    Finally, and this is subtle, we introduce a mechanism to allow for lazy evaluation
    of code! An iterable object gives the consumer back an iterator, and simply waits
    for the iterator''s `next` method to be invoked. If and when the `next` method
    is invoked, the object can then calculate (if necessary) the next item in the
    sequence, and return it! Take that a step further, our iterables could also be
    infinite (within the bounds of overflow of course).


    We have discussed the iterable, and the iteration protocol in this section. Next,
    we will take a look at "pausable" functions, and some use-cases.


    ## Generators


    Generator functions are a new addition in ES6 that introduce new syntax and keywords,
    as well as new semantics for functions. Let us first take a look at a simple example
    and then we will proceed to see how it works:


    *Defining a simple generator*


    ```

    function* generatorDemo() {

    yield 10;

    console.log(''First time'');

    yield 20;

    console.log(''Second time'');

    }

    const generator = generatorDemo(); // prints nothing to the log

    console.assert(generator !== undefined);

    // following each line is what you see in the console

    console.log(generator.next());

    // { value: 10, done: false }

    console.log(generator.next());

    // First time

    // { value: 20, done: false }

    console.log(generator.next());

    // Second time

    // { value: undefined, done: true }

    // alternatively, we can just use the for-of loop

    for (const i of generatorDemo()) {

    console.log(i);

    }

    ```


    Let us focus on the syntactic aspects here—we are introduced to the new `function*`
    (i.e., *not* a typo), as well a new `yield` keyword.


    When we invoke the generator function, we see two interesting things happen—we
    see nothing in the `console` (if this were a regular function, we would expect
    to see our `console.log` statement print out our messages), and we get *something
    back* from as a return value!


    See, when a generator function is invoked, it immediately returns a generator
    object **without** executing its body. Furthermore, if we are to observe the proceeding
    lines in our example, we see that this returned object has a `next` method on
    it, which in turn, returns another object with `value` and `done` keys in it.
    In other words, the generator object is iterable!


    What role does `yield` perform? If we look closely at the output of our example
    code, we notice that upon invoking `next` on the iterator, the body of the generator
    function is executed only up until the first `yield` statement is encountered,
    at which time, whatever value is "yielded" is returned to the invoking code (wrapped
    in an iterator result object). In effect, the `yield` statement *suspends* the
    execution of the generator function, returning control to the invocation context.


    An analogy that works is one of ping-pong (or tennis) with two players. Once we
    initiate the play (i.e., we have the generator object in our hands), invoking
    `next` sends control over to the generator function''s court. Upon a `yield`,
    the generator returns control to the invokee with a value. We, the "consumer"
    can choose to stop playing by not invoking `next` again at which point the generator
    function (if it is not "done" yet remains in a suspended state), and the generator
    will end the play if it reaches the end of its body''s definition (at which point
    the value returned is `{done: true}`).


    In essence, a generator function is a function that returns an iterable object,
    which in turn implements the iterator protocol. A generator function pauses (using
    `yield`), and resumes when the invokee invokes `next`.


    Let us convert our Fibonacci example to use a generator function:


    ```

    function* fibonacci() {

    let start = 0;

    let next = 1;

    yield start;

    yield next;

    while (true) {

    const result = start + next;

    start = next;

    next = result;

    yield result;

    }

    }

    const f = fibonacci();

    console.log(f.next().value); // 0

    console.log(f.next().value); // 1

    console.log(f.next().value); // 1

    console.log(f.next().value); // 2

    console.log(f.next().value); // 3

    console.log(f.next().value); // 5

    console.log(f.next().value); // 8

    ```


    This implementation isn''t that much different from our earlier implementation
    using `Symbol.iterator`, except we no longer need to implement that method—the
    generator function does it all for us.


    ### Generators as Consumers


    Our exploration of generators so far has seen them as data "producers"—they yield
    values per iteration. Generators, despite their name, can also act as "consumers,"
    wherein we can "push" values onto them, perhaps as a seed, or a way to send data
    to them for them to use.


    Let us tweak our simplistic example and see how this plays out:


    *   ① Kick off the iteration with a `next`


    *   ② Push a value as an argument to the `next` method, effectively setting the
    value of `first`


    *   ③ Do the same again, except this time set the value of `second`


    ```

    function* generatorWithPushDemo() {

    const first = yield 10;

    console.log(''First time'', first);

    const second = yield 20;

    console.log(''Second time'', second);

    }

    const generator = generatorWithPushDemo(); // prints nothing to the log

    console.assert(generator !== undefined);

    // following each line is what you see in the console

    console.log(generator.next()); ①

    // { value: 10, done: false }

    console.log(generator.next(''sending a value in'')); ②

    // First time sending a value in

    // { value: 20, done: false }

    console.log(generator.next(''sending another value in'')); ③

    // Second time sending another value in

    // { value: undefined, done: true }

    ```


    We start with getting a reference to the generator object, then invoke `next`.
    Control goes to the generator, and it `yield`s a value back to us. At this point,
    the generator is suspended.


    This is where things get interesting—we invoke `next` again, except this time
    we supply an argument. This value is *assigned* to the `first` variable, and the
    generator can now use this value within its implementation. One way to think about
    this is that any value we pass *into* the generator effectively replaces the `yield`
    in the generator. Of course, if the `yield` statement was not being captured within
    the generator, passing values in the generator results in a no-op—the value passed
    in is simply ignored.'
