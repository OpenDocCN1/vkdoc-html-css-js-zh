    - ② 表示 set 值的数组\n- ③ 再次提醒，用于查询计数的属性可能有点令人困惑\n- ④ 遍历值的函数式 API\n- ⑤ 有趣的是，有一个 `keys`\
    \ API，它与 `values` 相同\n- ⑥ 以上所有方法都返回迭代器\n- ⑦ 用于清空 set 并将 `size` 设为 0 的 API\n\n\
    ```\nconst set = new Set([ ①\n  'string',\n  true,\n  1, ②\n]);\nconsole.assert(set.size\
    \ === 3); ③\nconsole.assert(set.has('string'));\nconsole.assert(set.has(true));\n\
    console.assert(set.has(1));\nset.forEach(k => console.log(k)); ④\nconsole.log(set.entries());\n\
    console.log(set.keys()); ⑤\nconsole.log(set.values()); ⑥\nset.clear(); ⑦\nconsole.assert(set.size\
    \ === 0);\n```\n\nSet 和 map 一样，表现类似于数组，其中“索引”和该索引处的值是相同的。我们可以向 set 的 `forEach`\
    \ 传递一个双参数回调来确认这一点：\n\n```\nset.forEach((k, v) => console.assert(k === v))\n```\n\
    \nSet 也提供了一个 `entries` API，表示 set 中的条目。由于 set 中的值充当键，所以这只是一个可以表示为 `[value, value]`\
    \ 的两元素数组。同样地，也存在 `keys` 和 `values` API；不过，毫不意外，`keys` API 只是 `values` 的别名。\n\n\
    由于 set 是可迭代的，因此它们也是可展开的。考虑到我们有一个接受可迭代对象的构造函数，我们就有了一种便捷的方式来从现有 set 创建新 set，或者求多个\
    \ set 的并集。\n\n- ① 两个 set 的并集\n- ② 重复项会被丢弃\n\n```\nconst colorsOne = new Set([\n\
    \  'red',\n  'blue',\n]);\nconst colorsTwo = new Set([\n  'yellow',\n  'blue',\n\
    ]);\nconst union = new Set([...colorsOne, ...colorsTwo]); ①\nconsole.assert(union.has('red'));\n\
    console.assert(union.has('blue')); ②\nconsole.assert(union.has('yellow'));\n```\n\
    \n最后，和 map 一样，相等性是通过 `===` 运算符确定的。换句话说，如果我们 `add` 一个值，该值与 set 中任何已有值进行 `===` 检查返回\
    \ `true`，那么这个值就不会被添加到 set 中。\n"
- fmt: "### Caveats\n\nSets *are* maps under the covers, so to go further would only\
    \ belabor the point: everything that we discussed for maps applies to sets. The\
    \ lack of a literal forces us to use the constructor, and since there is no support\
    \ in JSON for sets, going to and from JSON might cause us to lose some fidelity.\
    \  \nThe only difference between serializing sets vs. maps is that sets serialize\
    \ to simply an array of distinct values.\n\n### WeakSets\n\n`WeakSet`s are to\
    \ sets as weakmaps are to maps. They provide a means for us to hold on to references\
    \ “weakly,” allowing their values to be garbage collected if no other references\
    \ to that particular value exist.  \nWeaksets offer no iterative APIs as one would\
    \ expect, leaving only the ability to `add` and `delete` values, and check for\
    \ possession via the `has` method. Their constructors mirror that of sets, in\
    \ that they are capable of taking an iterable at construction time.\n\nOne use-case\
    \ for weaksets is that of “tagging” objects. Let’s say we had to serialize a JavaScript\
    \ object that contained circular references. `JSON.stringify` will result in us\
    \ blowing the stack. In a situation like this, we have to manually recurse through\
    \ the object and its references—each time “recording” if we have seen a particular\
    \ object before, and if so, not serializing that reference. A weakmap can be used\
    \ to tag already seen objects, and we can be certain that there will not be any\
    \ lingering references to clean up after the fact. Observe:\n\n* ① If we have\
    \ already encountered the key, we simply `return` here\n* ② Create a replacer\
    \ function for `JSON.stringify`\n* ③ Create a circular reference object\n* ④ This\
    \ will fail with a stack overflow error\n* ⑤ Use the `replacer` function that\
    \ discards any previously seen entries\n\n```\nlet weakSet = new WeakSet();\n\
    const replacer = (key, value) => {\n  if (typeof value === 'object' && value !==\
    \ null) {\n    if (weakSet.has(value)) {\n      // Circular reference found, discard\
    \ key\n      return; // ①\n    }\n    // Store value in our collection\n    weakSet.add(value);\n\
    \  }\n  return value;\n}; // ②\nconst rootObj = {\n  name: 'rootObj',\n};\nrootObj.children\
    \ = [{\n  parent: rootObj,\n  name: 'childOne',\n  children: [],\n}, {\n  parent:\
    \ rootObj,\n  name: 'childTwo',\n  children: [],\n}]; // ③\n// console.log(JSON.stringify(rootObj));\
    \ // ④\nconsole.log(JSON.stringify(rootObj, replacer, 2)); // ⑤\n// prints\n//\
    \ {\n//   \"name\": \"rootObj\",\n//   \"children\": [\n//     {\n//       \"\
    name\": \"childOne\",\n//       \"children\": []\n//     },\n//     {\n//    \
    \   \"name\": \"childTwo\",\n//       \"children\": []\n//     }\n//   ]\n// }\n\
    ```\n\nWe start by writing our “replacer” function that will be invoked by `JSON.stringify`.\
    \ As `JSON.stringify` recurses through the object supplied to it as the first\
    \ argument to `stringify`, it will invoke our function, passing it the key and\
    \ value that it is currently attempting to convert to a string representation.\
    \ Our first check is to see if we have already “seen” that key before, by asking\
    \ our internal weakset if it has that key—if it does, we simply return. Otherwise,\
    \ we *first* add the key to our weakset, then proceed to return the “value.” Of\
    \ course, we could simply use an array to keep a list of references that we have\
    \ seen previously, but then we would have to clear the array, or deference it\
    \ completely, in order to ensure that we don’t leak memory.\n\n## Summary\n\n\
    JavaScript seems to have finally grown up. We now have at our disposal the four\
    \ data structures that we are used to in many other languages. Maps and sets fulfill\
    \ a role that was previously hard to accomplish natively in JavaScript.  \nBoth\
    \ maps and sets come with some limitations. However, these limitations exist to\
    \ preserve the semantics of the language (and JSON). Despite these, they prove\
    \ to be a great addition to the language, allowing us, the developers, to better\
    \ express our intentions in code.\n\nIn the next chapter we will look at the enhanced\
    \ object literals, and explore some of the new Object APIs that were introduced\
    \ in ES6.\n\nFootnotes [1](#481812_1_En_6_Chapter.xhtml#Fn1_source) [2](#481812_1_En_6_Chapter.xhtml#Fn2_source)\
    \ [3](#481812_1_En_6_Chapter.xhtml#Fn3_source) [4](#481812_1_En_6_Chapter.xhtml#Fn4_source)\
    \ [5](#481812_1_En_6_Chapter.xhtml#Fn5_source) [6](#481812_1_En_6_Chapter.xhtml#Fn6_source)\
    \ [7](#481812_1_En_6_Chapter.xhtml#Fn7_source)\n\n# 7. Bright Shiny Object(s)\
    \ using Enhanced Object Literals\n\nThe literal object syntax (`{}`) in JavaScript\
    \ is a powerful mechanism that allows us to describe objects *literally in code*.\
    \ This `{}` syntax is rather elegant, and succinct; however, there remain a few\
    \ warts—defining methods can be a tad verbose, and tacking on computed properties\
    \ is at best clumsy. ES6 supercharges this syntax, giving us a way to initialize\
    \ properties and methods even *more* concisely, while simultaneously elevating\
    \ the ability to define computed properties to a first-class citizen.\n\nIn this\
    \ chapter we will see how these enhancements make building objects in JavaScript\
    \ far less verbose. We will also examine the new syntax that is permitted for\
    \ adding computed properties on objects, making meta-programming in JavaScript\
    \ a little easier to work with. Finally, we will look at the benefits of using\
    \ trailing commas, and the recent addition in ES7 that expands the use of this\
    \ feature for function definitions and invocations. By the end of this chapter,\
    \ we will have added some more tools in our toolkit to make our code more consistent,\
    \ and less verbose.\n\n## The Limitations of the Object Literal\n\nThe use of\
    \ the object literal syntax `{}` in idiomatic JavaScript code is pervasive. However,\
    \ there are, in particular, three shortcomings that we will be discussing:\n\n\
    1. The lack of symmetry between getters/setters and object methods  \n2. The inability\
    \ to list a computed property within the literal syntax  \n3. The verbosity that\
    \ often accompanies defining object properties using variables\n\nLet us examine\
    \ each of these separately."
  raw: '### Caveats


    Sets *are* maps under the covers, so to go further would only belabor the point:
    everything that we discussed for maps applies to sets. The lack of a literal forces
    us to use the constructor, and since there is no support in JSON for sets, going
    to and from JSON might cause us to lose some fidelity.


    The only difference between serializing sets vs. maps is that sets serialize to
    simply an array of distinct values.


    ## WeakSets


    `WeakSet`s are to sets as weakmaps are to maps. They provide a means for us to
    hold on to references “weakly,” allowing their values to be garbage collected
    if no other references to that particular value exist.


    Weaksets offer no iterative APIs as one would expect leaving only the ability
    to `add` and `delete` values, and check for possession via the `has` method. Their
    constructors mirror that of sets, in that they are capable of taking an iterable
    at construction time.


    One use-case for weaksets is that of “tagging” objects. Let’s say we had to serialize
    a JavaScript object that contained circular references. `JSON.stringify` will
    result in us blowing the stack. In a situation like this, we have to manually
    recurse through the object and its references—each time “recording” if we have
    seen a particular object before, and if so, not serializing that reference. A
    weakmap can be used to tag already seen objects, and we can be certain that there
    will not be any lingering references to clean up after the fact. Observe:


    *   ① If we have already encountered the key, we simply `return` here


    *   ② Create a replacer function for `JSON.stringify`


    *   ③ Create a circular reference object


    *   ④ This will fail with a stack overflow error


    *   ⑤ Use the `replacer` function that discards any previously seen entries


    ```

    let weakSet = new WeakSet();

    const replacer = (key, value) => {

    if (typeof value === ''object'' && value !== null) {

    if (weakSet.has(value)) {

    // Circular reference found, discard key

    return; ①

    }

    // Store value in our collection

    weakSet.add(value);

    }

    return value;

    }; ②

    const rootObj = {

    name: ''rootObj'',

    };

    rootObj.children = [{

    parent: rootObj,

    name: ''childOne'',

    children: [],

    }, {

    parent: rootObj,

    name: ''childTwo'',

    children: [],

    }]; ③

    // console.log(JSON.stringify(rootObj)); ④

    console.log(JSON.stringify(rootObj, replacer, 2)); ⑤

    // prints

    // {

    //   "name": "rootObj",

    //   "children": [

    //     {

    //       "name": "childOne",

    //       "children": []

    //     },

    //    {

    //       "name": "childTwo",

    //       "children": []

    //     }

    //   ]

    // }

    ```


    We start by writing our “replacer” function that will be invoked by `JSON.stringify`.
    As `JSON.stringify` recurses through the object supplied to it as the first argument
    to `stringify`, it will invoke our function, passing it the key and value that
    it is currently attempting to convert to a string representation. Our first check
    is to see if we have already “seen” that key before, by asking our internal weakset
    if it has that key—if it does, we simply return. Otherwise, we *first* add the
    key to our weakset, then proceed to return the “value.” Of course, we could simply
    use an array to keep a list of references that we have seen previously, but then
    we would have to clear the array, or deference it completely, in order to ensure
    that we don’t leak memory.


    ## Summary


    JavaScript seems to have finally grown up. We now have at our disposal the four
    data-structures that we are used to in many other languages. Maps and sets fulfill
    a role that was previously hard to accomplish natively in JavaScript.


    Both maps and sets come with some limitations. However, these limitations exist
    to preserve the semantics of the language (and JSON). Despite these, they prove
    to be a great addition to the language, allowing us, the developers, to better
    express our intentions in code.


    In the next chapter we will look at the enhanced object literals, and explore
    some of the new Object APIs that were introduced in ES6.


    Footnotes [1](#481812_1_En_6_Chapter.xhtml#Fn1_source)   [2](#481812_1_En_6_Chapter.xhtml#Fn2_source)
      [3](#481812_1_En_6_Chapter.xhtml#Fn3_source)   [4](#481812_1_En_6_Chapter.xhtml#Fn4_source)
      [5](#481812_1_En_6_Chapter.xhtml#Fn5_source)   [6](#481812_1_En_6_Chapter.xhtml#Fn6_source)
      [7](#481812_1_En_6_Chapter.xhtml#Fn7_source)


    # 7. Bright Shiny Object(s) using Enhanced Object Literals


    The literal object syntax (`{}`) in JavaScript is a powerful mechanism that allows
    us to describe objects *literally in code*. This `{}` syntax is rather elegant,
    and succinct; however, there remain a few warts—defining methods can be a tad
    verbose, and tacking on computed properties is at best clumsy. ES6 supercharges
    this syntax, giving us a way to initialize properties and methods even *more*
    concisely, while simultaneously elevating the ability to define computed properties
    to a first-class citizen.


    In this chapter we will see how these enhancements make building objects in JavaScript
    far less verbose. We will also examine the new syntax that is permitted for adding
    computed properties on objects, making meta-programming in JavaScript a little
    easier to work with. Finally, we will look at the benefits of using trailing commas,
    and the recent addition in ES7 that expands the use of this feature for function
    definitions and invocations. By the end of this chapter, we will have added some
    more tools in our toolkit to make our code more consistent, and less verbose.


    ## The Limitations of the Object Literal


    The use of the object literal syntax `{}` in idiomatic JavaScript code is pervasive.
    However, there are, in particular, three shortcomings that we will be discussing:


    1.  The lack of symmetry between getters/setters and object methods


    2.  The inability to list a computed property within the literal syntax


    3.  The verbosity that often accompanies defining object properties using variables


    Let us examine each of these separately.'
  trans: "\n### 注意事项\n\nSet 在底层*就是*一种 Map，因此进一步探讨只会重复强调：我们针对 Map 讨论的所有内容都适用于 Set。由于缺少字面量，我们不得不使用构造函数；并且由于\
    \ JSON 不支持 Set，与 JSON 之间的转换可能会导致部分信息丢失。  \nSet 与 Map 在序列化时的唯一区别在于：Set 会被序列化为一个仅包含不同值的数组。\n\
    \n### WeakSet\n\n`WeakSet` 之于 Set，正如 WeakMap 之于 Map。它提供了一种“弱”引用机制，允许其值在没有其他引用指向该特定值时被垃圾回收。\
    \  \n正如预期的那样，WeakSet 不提供任何迭代 API，只允许通过 `add` 和 `delete` 方法添加和删除值，并通过 `has` 方法检查是否拥有某个值。其构造函数与\
    \ Set 类似，可以在构造时接受一个可迭代对象。\n\nWeakSet 的一个用例是“标记”对象。假设我们需要序列化一个包含循环引用的 JavaScript\
    \ 对象。`JSON.stringify` 会导致堆栈溢出。在这种情况下，我们必须手动遍历对象及其引用——每次“记录”是否已经见过某个特定对象，如果见过，则不再序列化该引用。可以使用\
    \ WeakMap 来标记已经见过的对象，并且可以确保事后不会有任何悬空引用需要清理。请看：\n\n* ① 如果已经遇到过该键，这里直接 `return`\n\
    * ② 为 `JSON.stringify` 创建一个 replacer 函数\n* ③ 创建一个包含循环引用的对象\n* ④ 这会导致堆栈溢出错误\n*\
    \ ⑤ 使用丢弃所有已访问条目的 `replacer` 函数\n\n```\nlet weakSet = new WeakSet();\nconst replacer\
    \ = (key, value) => {\n  if (typeof value === 'object' && value !== null) {\n\
    \    if (weakSet.has(value)) {\n      // 发现循环引用，丢弃该键\n      return; // ①\n   \
    \ }\n    // 将值存入集合\n    weakSet.add(value);\n  }\n  return value;\n}; // ②\nconst\
    \ rootObj = {\n  name: 'rootObj',\n};\nrootObj.children = [{\n  parent: rootObj,\n\
    \  name: 'childOne',\n  children: [],\n}, {\n  parent: rootObj,\n  name: 'childTwo',\n\
    \  children: [],\n}]; // ③\n// console.log(JSON.stringify(rootObj)); // ④\nconsole.log(JSON.stringify(rootObj,\
    \ replacer, 2)); // ⑤\n// 输出\n// {\n//   \"name\": \"rootObj\",\n//   \"children\"\
    : [\n//     {\n//       \"name\": \"childOne\",\n//       \"children\": []\n//\
    \     },\n//     {\n//       \"name\": \"childTwo\",\n//       \"children\": []\n\
    //     }\n//   ]\n// }\n```\n\n我们首先编写“replacer”函数，该函数将由 `JSON.stringify` 调用。当\
    \ `JSON.stringify` 遍历作为第一个参数传递给 `stringify` 的对象时，它会调用我们的函数，并将当前尝试转换为字符串表示形式的键和值传递给它。我们的第一项检查是，通过询问内部\
    \ weakset 是否已经包含该键，来判断是否已经“见过”它——如果已经见过，则直接返回。否则，我们*首先*将该键添加到 weakset，然后返回该“值”。当然，我们可以简单地使用一个数组来保存之前见过的引用列表，但那样我们就必须清空该数组或完全解除引用，以确保不会造成内存泄漏。\n\
    \n## 总结\n\nJavaScript 似乎终于成熟了。我们现在拥有了其他许多语言中习惯使用的四种数据结构。Map 和 Set 填补了之前在 JavaScript\
    \ 中难以原生实现的功能。  \nMap 和 Set 都有一些局限性。然而，这些限制是为了保持语言（和 JSON）的语义而存在的。尽管如此，它们仍然是对该语言的极好补充，使我们开发者能够更好地在代码中表达意图。\n\
    \n在下一章中，我们将探讨增强的对象字面量，并探索 ES6 中引入的一些新的 Object API。\n\n脚注 1 2 3 4 5 6 7\n\n# 7.\
    \ 使用增强的对象字面量实现简洁明了的对象\n\nJavaScript 中的字面量对象语法 (`{}`) 是一种强大的机制，允许我们*直接在代码中*描述对象。这种\
    \ `{}` 语法相当优雅且简洁；然而，仍存在一些小问题——定义方法可能略显冗长，添加计算属性也颇麻烦。ES6 极大地增强了此语法，使我们能够*更加*简洁地初始化属性和方法，同时将定义计算属性的能力提升为头等公民。\n\
    \n在本章中，我们将看到这些增强如何使在 JavaScript 中构建对象变得远不那么冗长。我们还将探讨在对象上添加计算属性所允许的新语法，这使得 JavaScript\
    \ 中的元编程变得更容易处理。最后，我们将了解使用尾逗号的好处，以及 ES7 中新增的功能，该功能将其使用范围扩展到了函数定义和调用。在本章结束时，我们的工具包中将增添更多工具，使我们的代码更加一致，且不那么冗长。\n\
    \n## 对象字面量的局限性\n\n在惯用的 JavaScript 代码中，对象字面量语法 `{}` 的使用非常普遍。然而，我们将特别讨论三个缺点：\n\n\
    1. getter/setter 与对象方法之间缺乏对称性  \n2. 无法在字面量语法中列出计算属性  \n3. 使用变量定义对象属性时通常伴随的冗长\n\
    \n让我们分别审视这些问题。\n"
- fmt: '### Getter/setters vs. Methods


    Objects in JavaScript are permitted to have `get`-ters and `set`-ters defined
    alongside methods. The difference between the two happens to be the invocation
    pattern—getters and setters while being functions are not invoked as such. Rather,
    their behavior is in line with how we work with properties. Consider the following
    example that attempts to highlight the differences in the usage patterns between
    the two:


    1. ① Introduce a property

    2. ② Create a `get` method

    3. ③ A `set`-ter method

    4. ④ Validate the input

    5. ⑤ Store it differently

    6. ⑥ A traditional method

    7. ⑦ Property lookup

    8. ⑧ This will produce a validation error

    9. ⑨ Invokes the `set` method

    10. ➉ Invokes the `get` method

    11. ⑪ Invoke a regular method


    ```javascript

    const song = {

    name: ''Yellow Submarine'', ①

    get duration() { ②

    console.log(''Getter is invoked'');

    return this._duration ? (this._duration / 60) : 0;

    },

    set duration(inMin) { ③

    if (inMin <= 0) { ④

    throw new Error(''duration of song cannot be less or equal to 0 min'');

    }

    console.log(`Setter is invoked with ${inMin}`);

    this._duration = inMin * 60; ⑤

    },

    getName: function () { ⑥

    return this.name;

    },

    };

    console.assert(song.name === ''Yellow Submarine''); ⑦

    // song.duration = -1; ⑧

    song.duration = 3.00; ⑨

    console.assert(song.duration === 3); ➉

    console.assert(song.getName() === ''Yellow Submarine''); ⑪

    ```


    As one might surmise, getters and setters, often referred to as “virtual attributes,”
    allow us to implement hooks in what otherwise seem to be property lookups. These
    hooks can be used for a variety of use-cases, including validation and sanitization
    of inputs, or modifying attributes on the way out as previously demonstrated.
    This difference is apparent when we compare reading (`get`-ting) and `set`-ting
    duration to invoking the object method `getName`.


    The key issue here is that although they are all defined as methods on an object,
    there is a lack of symmetry between how we define getters and setters and defining
    methods. While the former involves a rather elegant and perhaps even familiar
    syntax to programmers coming in from other languages, the latter continues to
    make use of the traditional key-value syntax.


    ### Defining Computed Properties on Object Literals


    Objects in JavaScript also permit keys to be “computed” at runtime, allowing for
    some level of meta-programming facilities in JavaScript. In order to tack on a
    computed property on an object we are to use the “bracket” (or subscript) notation
    on an existing object, like so:


    1. ① A function to create a name from a property

    2. ② Capitalize the name of the supplied property

    3. ③ Use the subscript syntax to tack on the calculated method name an object


    ```javascript

    const getterFor = (prop) => { ①

    const capitalized = prop.charAt(0).toUpperCase() + prop.slice(1); ②

    return `get${capitalized}`;

    };

    const song = {

    name: ''All You Need Is Love'',

    album: ''Yellow Submarine'',

    };

    song[getterFor(''name'')] = function() { ③

    return song[''name''];

    };

    song[getterFor(''album'')] = function() {

    return song[''album''];

    };

    console.assert(song.getName() === song.name);

    console.assert(song.getAlbum() === song.album);

    ```


    In this example we start with a simple helper function that calculates the name
    of the getter given a property name. Given the property, say `name`, `getterFor(''name'')`
    simply returns `getName`.


    As we can see, bracket notation provides us a way to evaluate any *expression*
    to calculate the name of the soon-to-be object key, and attach it to the object.
    However, we have to do this outside of the `{}` object notation, since the syntax
    does not afford us a means to do that inline, like we do other properties. This
    forces us to have the “complete” object definition scattered in several different
    places.


    ### Defining Object Properties Using Variables


    Idiomatic JavaScript leverages object literals *everywhere*, from encapsulating
    private members and exposing public APIs using the “revealing module pattern”
    to node `exports`. There is often a large amount of duplication that results from
    using object literals in this manner. Observe:


    1. ① A private member variable

    2. ② A private function

    3. ③ Expose a specific public API on the object literal

    4. ④ Wrap the object creation in an IEFE to encapsulate private members within
    function scope


    ```javascript

    const greeter = (function () {

    let greeting = ''Hello''; ①

    const exclaim = msg => `${msg}!`; ②

    const greet = name => exclaim(`${greeting} ${name}`);

    const salutation = (newGreeting) => {

    greeting = newGreeting;

    };

    return {

    greet: greet,

    salutation: salutation,

    }; ③

    }()); ④

    console.assert(greeter.greet(''Mason'') === ''Hello Mason!'');

    greeter.salutation(''Hola'');

    console.assert(greeter.greet(''Micah'') === ''Hola Micah!'');

    ```


    The revealing module pattern leverages the fact that functions introduce scope.
    We start with an “Immediately Executing Function Expression” (IEFE). Within the
    IEFE we are free to define any number of “private” members and functions, which
    are scoped to the enclosing function. At the end of the IEFE, we simply create
    a new object via the literal syntax, and have its properties point to the members
    that are to be part of the public API. As we observe there is a fair amount of
    duplication, for example, `greet: greet` that stems out of this implementation.
    If this were a far more elaborate implementation, it proves to be not only verbose,
    but error-prone as well.


    Now that we have seen some use-cases for the literal object, let us explore how
    ES6 attempts to overcome these using the “enhanced” object literal syntax.


    ## Enhanced Object Literal Syntax


    The enhancements to the object literal syntax in ES6 simply aims to simplify how
    we define properties and methods within our literal object definitions.


    ### Method Definition Shorthand


    The object literal syntax introduces a shorthand for method definitions within
    the literal syntax, bringing it to parity with getter/setter definitions. We revisit
    our earlier example, except this time using the shortcut:


    1. ① Use the method shorthand to define a regular function

    2. ② Define a method that takes an argument


    ```javascript

    const song = {

    name: ''Yellow Submarine'', ①

    get duration() { ②

    console.log(''Getter is invoked'');

    return this._duration ? (this._duration / 60) : 0;

    },

    set duration(inMin) { ③

    if (inMin <= 0) { ④

    throw new Error(''duration of song cannot be less or equal to 0 min'');

    }

    console.log(`Setter is invoked with ${inMin}`);

    this._duration = inMin * 60; ⑤

    },

    getName() { ①

    return this.name;

    },

    setName(name) { ②

    this.name = name;

    },

    };

    console.assert(song.getName() === ''Yellow Submarine'');

    song.setName(''All You Need Is Love'');

    console.assert(song.getName() === ''All You Need Is Love'');

    ```


    This example is no different than our earlier stab at the same—however, the definition
    of `getName` (and `setName`) is significantly less verbose. Gone is the `:` and
    the `function` keyword; all that remains is the method implementation. We now
    find symmetry between any method definition on a literal, be that getters/setters
    or regular methods.'
  raw: '### Getter/setters vs. Methods


    Objects in JavaScript are permitted to have `get`-ters and `set`-ters defined
    alongside methods. The difference between the two happens to be the invocation
    pattern—getters and setters while being functions are not invoked as such. Rather,
    their behavior is in line with how we work with properties. Consider the following
    example that attempts to highlight the differences in the usage patterns between
    the two:


    *   ① Introduce a property


    *   ② Create a `get` method


    *   ③ A `set`-ter method


    *   ④ Validate the input


    *   ⑤ Store it differently


    *   ⑥ A traditional method


    *   ⑦ Property lookup


    *   ⑧ This will produce a validation error


    *   ⑨ Invokes the `set` method


    *   ➉ Invokes the `get` method


    *   ⑪ Invoke a regular method


    ```

    const song = {

    name: ''Yellow Submarine'', ①

    get duration() { ②

    console.log(''Getter is invoked'');

    return this._duration ? (this._duration / 60) : 0;

    },

    set duration(inMin) { ③

