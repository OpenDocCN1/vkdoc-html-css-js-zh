- fmt: '# Seeking Symmetry Between Structuring and Destructuring


    JavaScript offers us two collection-like objects—arrays and objects that are key-value
    pairs.^([^(25)](#fn25)) Objects created using the `Object` constructor, `Object.create`,
    or the `literal` object syntax (namely `{}`) are instances of `Object`. They can
    be thought of as an associative array, or dictionary objects. Objects are essentially
    a set of key-value pairs. If an object is asked to look up the value of a key,
    it will return the value associated with that key, or `undefined` if that key
    does not exist in the object.


    Arrays on the other hand offer a sequential data structure, with efficient random
    lookup of elements. Arrays in JavaScripts are instances of the `Array` type, and
    they too are associative, except their keys are integers, and can only be integers
    that serve as the index of the item they point to.


    Both objects and arrays give us ways to *reach into* them. Objects offer us the
    “dot” notation that allow us to fetch the value associated with a key within itself,
    as well as the “bracket” (or “subscript”) notation (namely `[]`) to the same effect.
    Arrays on the other hand offer only the bracket notation as a means to look up
    an element at a *particular* index within the array. Much like objects, looking
    up an index that does **not** exist within the array returns `undefined`.


    Both objects and arrays can be nested, often one inside another. This can lead
    to rather convoluted lookups, forcing developers to inline variables to explain
    what they are trying to achieve. Observe:


    - ① Use the obvious syntax

    - ② Refactor it to make the intent clearer

    - ③ What were to happen if the address object did **not** have a `zip` property?


    ```

    const user = {

    name: ''douglas'',

    profession: ''developer'',

    address: {

    street1: ''1 Ad Infinitum Drive'',

    street2: ",

    city: ''Cupertino'',

    state: ''CA'',

    zip: [

    ''95014'',

    ''1234'',

    ],

    },

    };

    const zipCode = user.address.zip[0] + ''-'' + user.address.zip[1]; ①

    console.assert(zipCode === ''95014-1234'');

    // refactored version

    const zip = user.address.zip; ②

    const code = zip[0]; ③

    const extended = zip[1];

    const final = code + ''-'' + extended;

    console.assert(final === ''95014-1234'');

    ```


    Consider how we ascertained what the original object looks if we had not created
    it, but rather handed a reference to it. We would have to do some mental gymnastics
    to “rebuild” the structure of the original object by reverse parsing the lookup.
    This proves to be even more frustrating when functions expect an object or an
    array—as a client there is no way to tell which “parts” of the argument the function
    is really interested in without looking at its implementation or reading the docs.


    To add salt to the wound, the syntax offers no provisions for `undefined` checks
    along the way! If an intermediate property fails the lookup, this failure cascades
    down to everything that relies on that property’s value. Some languages offer
    a “safe navigation” operator, or a way to default a look up if it fails, but alas,
    we had no support for either in JavaScript.


    The central tenet is the lack of symmetry between how we define objects and arrays
    (create the *structure*), and how we reach into them (*destructure* them) to get
    to particular values. If the lookup syntax mirrored the construction syntax, then
    “reassembling” the original object (or array) becomes trivial since the left-hand
    side of the assignment would be as expressive as the right-hand side.


    Another aspect in the lack of destructuring support is the inability to spread
    or “splat” objects; in other words, get to **all** entries of a collection, be
    that elements of an array or key-value pairs in objects. Developers resort to
    imperatively iterating through whole collections, be that explicitly using `for`
    loops, or implicitly using methods like `forEach`, both of which leave much room
    for improvement.


    Enter spread operator, and the new destructuring syntax. We will start with the
    spread operator, followed by the destructuring syntax.


    ## Spread Operator for Arrays


    Consider a simple use-case—a function that calculates the perimeter of a triangle
    and an array that stores the lengths of the individual sides. Let us see how we
    would use the two together:


    - ① We start with an array

    - ② We extract every element of the array to supply to the function


    ```

    const perimeter = (a, b, c) => a + b + c;

    const sides = [9, 8, 3]; ①

    // prints 20

    console.log(perimeter(sides[0], sides[1], sides[2])); ②

    ```


    Given that the function expects three arguments, we are forced to tease apart
    the values from the array using the subscript notation. This feels cumbersome.
    What would be nice is a way for us to “apply” the individual elements of the array
    as arguments to the function.


    Well, now we can! We can now use the spread operator that expresses itself using
    the `...` syntax. Observe how the same example morphs into the following:


    - ① We start with an array

    - ② We use the spread operator to supply all the elements of the array to the
    function


    ```

    const perimeter = (a, b, c) => a + b + c;

    const sides = [9, 8, 3]; ①

    // prints 20

    console.log(perimeter(...sides)); ②

    ```


    The spread operator syntax as demonstrated uses `...` as its syntactic construct.
    It takes an array, and “explodes” it into its individual elements, passing each
    one as individual arguments to the function. Right off the bat this eliminates
    our having to extract the elements imperatively using the subscript syntax.


    There are a handful of places in our code where we are allowed to use the spread
    operator—first, as we have seen, is upon function invocation, and the second,
    array construction, which we will see in the next section.'
