- fmt: '我们的尝试与我们之前拦截对象方法调用的尝试并无不同，只是使用了代理。然而，我们获得了许多好处——我们不再改变对象；相反，代理使我们能够精确地实现我们想要的目标，只需切换引用即可恢复到原始行为。由于代理本身就是一个引用，它可以被限定在函数或模块的作用域内。离开这个作用域，外界就永远不会知道代理的存在！


    我们在这里巧妙地引入了`Reflect`API，所以你可能会疑惑——这到底是干什么用的？`Reflect`是一个与`Proxy`一同在ES6中出现的新API，它作为代理处理器的镜像API。因此，对于我们能安装在代理处理器上的每一种陷阱，`Reflect`上都有一个对应的静态属性。每当我们在处理器上定义一个陷阱，并且希望将同一调用转发给原始对象时，我们可以简单地使用镜像的`Reflect`API，传入目标对象及其可能需要的任何参数。在我们的示例中，我们正在捕获`get`——然而，在调用我们的拦截函数之后，我们希望将调用转发给原始对象，因此我们可以直接使用`Reflect.get`。


    我们已经初步了解了如何使用代理和`Reflect`API。现在，我们将尝试重新创建之前的示例，即在不直接修改`Array.prototype`的情况下定义一个`equals`方法。回想一下，在这个例子中，我们试图为数组增加一个新方法，即`equals`。我们将从一个递归函数开始，该函数可以将一个数组（通过`this`引用）与另一个数组进行比较：


    ```

    const equals = function (other) {

    if (!other) return false;

    if (!Array.isArray(other)) return false;

    if (this.length !== other.length) return false;

    const [fMe, ...rMe] = this;

    const [fOther, ...rOther] = other;

    if (fMe === fOther) {

    return true;

    }

    if ((rMe.length === 0) && (rOther.length === 0)) {

    return true;

    }

    return rMe.equals(rOther);

    };

    ```


    接下来，我们将编写我们的处理器，它将拦截所有对`equals`的调用，并将调用分派给我们新创建的`equals`方法：


    *   ① 定义我们的代理创建助手

    *   ② 定义我们的处理器

    *   ③ 捕获`get`

    *   ④ 增强对`equal`方法的所有调用

    *   ⑤ 否则委托给原始对象


    ```

    const comparableArray = (arr) => { ①

    const handler = { ②

    get(target, property) { ③

    if (property === ''equals'') { ④

    return equals;

    }

    return Reflect.get(target, property); ⑤

    },

    };

    return new Proxy(arr, handler);

    };

    const first = comparableArray([1, 2, 3, [4, 5]]);

    const second = comparableArray([1, 2, 3, [4, 5]]);

    const third = comparableArray([1, 2, 3]);

    // 打印 ''true''

    console.log(first.equals([1, 2, 3, [4, 5]])); ②

    // 打印 ''false''

    console.log(first.equals(third));

    ```


    我们再次捕获`get`，不过这次，如果正在寻找的属性恰好是`equals`，我们就返回自定义实现；否则，只需将调用转发给原始对象。尽管我们的`equals`实现与我们之前的尝试没有任何不同，但我们的方法却截然不同。我们通过代理获得了新的行为，而无需直接修改`Array`本身。


    这种增强仅对使用代理的用户可见。此外，由于代理在获取`equals`方法之外的任何操作都会委托给原始对象，因此对于代理的任何其他使用者来说，这种修改是完全透明的。


    ## 强制实现单例


    现在，我们或许可以看到如何实现许多巧妙的功能，比如添加方法或修改现有方法。让我们考虑另一个用例，即使用代理来构建单例模式。为了实现这一点，我们需要捕获对象的构造过程，确保一旦我们有了一个实例，就始终返回该实例。查看MDN文档，我们找到了`handler.construct`——完美！这正是我们需要的。


    ```

    const singletonFactory = (constructorFn) => { ①

    let instance; ②

    const handler = {

    construct(target, args) { ③

    if (!instance) {

    instance = Reflect.construct(constructorFn, args); ④

    }

    return instance; ⑤

    },

    };

    return new Proxy(constructorFn, handler);

    };

    class SuperHeroService { ⑥

    constructor() {

    this.heroes = [

    ''IronMan'',

    ''Captain America'',

    ''Wasp'',

    ''Black Widow'',

    ];

    }

    getHeroes() {

    return this.heroes;

    }

    addHero(hero) {

    this.heroes.push(hero);

    }

    }

    const SingletonSuperHeroService = singletonFactory(SuperHeroService); ⑦

    const service1 = new SingletonSuperHeroService();

    const service2 = new SingletonSuperHeroService(); ⑧

    // 打印 ''true''

    console.log(service1 === service2); ⑨

    ```


    *   ① 定义我们的代理助手

    *   ② 一个用于缓存实例的局部变量

    *   ③ 捕获构造函数调用

    *   ④ 如果没有实例，则调用提供的构造函数

    *   ⑤ 否则返回我们缓存的实例

    *   ⑥ 我们希望视为单例的类

    *   ⑦ 创建代理

    *   ⑧ 对代理的多次调用返回同一个实例

    *   ⑨ 确保实例相同


    我们的代理创建函数期望将我们希望设为单例的对象的构造函数作为其唯一参数。我们的实现，除了捕获`construct`之外，相当简单——我们在创建单例时保存其局部引用，并在后续调用构造函数时直接返回相同的引用。正如我们所见，我们可以用这个简单的实现包装任何希望视为单例的构造函数。对代理构造函数的多次调用只会返回同一个实例。'
  raw: 'Our attempt does not depart from our earlier attempt at intercepting method
    calls on objects with the exception of using proxies. However, we gain a lot of
    benefits—we no longer mutate the object; instead, the proxy allows us to accomplish
    exactly what we want, allowing us to revert back to the original behavior by simply
    switching references. Since the proxy itself is a reference, it can be scoped
    in a function or a module. Leaving this scope translates to the world never knowing
    that the proxy even exists!


    We did subtly introduce using the `Reflect` API here, so you might be wondering—what’s
    all that about? `Reflect` is a new API that landed alongside `Proxy` in ES6, and
    serves as a mirror API to the handler for proxies. Thus, for every kind of trap
    we are able to install on a proxy’s handler, there exists a static property on
    `Reflect` `.`^([^(91)](#fn91)) Anytime we define a trap on a handler, and we wish
    to forward the same call to the original object, we can simply use the mirrored
    `Reflect` API, passing in the target object and any arguments that it may need.
    In our example we are trapping `get`—however, after calling our interception function,
    we wish to forward the call to the original object, so we can just use `Reflect.get`.


    We have had a taste of how to use proxies, and the `Reflect` API. Now we will
    attempt to recreate our earlier example of defining an `equals` method without
    monkey-patching `Array.prototype` itself. Recall that in this case, we are attempting
    to augment arrays with a new method, namely `equals`. We will start by writing
    a recursive function that can compare one array (referenced by `this`) with another
    array:


    ```

    const equals = function (other) {

    if (!other) return false;

    if (!Array.isArray(other)) return false;

    if (this.length !== other.length) return false;

    const [fMe, ...rMe] = this;

    const [fOther, ...rOther] = other;

    if (fMe === fOther) {

    return true;

    }

    if ((rMe.length === 0) && (rOther.length === 0)) {

    return true;

    }

    return rMe.equals(rOther);

    };

    ```


    Next, we will write our handler, which will intercept any calls to `equals` and
    dispatches the call to our newly minted `equals` method :


    *   ① Define our proxy creator helper


    *   ② Define our handler


    *   ③ Trap `get`


    *   ④ Augment any calls for the `equal` method


    *   ⑤ Otherwise delegate to the original object


    ```

    const comparableArray = (arr) => { ①

    const handler = { ②

    get(target, property) { ③

    if (property === ''equals'') { ④

    return equals;

    }

    return Reflect.get(target, property); ⑤

    },

    };

    return new Proxy(arr, handler);

    };

    const first = comparableArray([1, 2, 3, [4, 5]]);

    const second = comparableArray([1, 2, 3, [4, 5]]);

    const third = comparableArray([1, 2, 3]);

    // prints ''true''

    console.log(first.equals([1, 2, 3, [4, 5]])); ②

    // prints ''false''

    console.log(first.equals(third));

    ```


    We once again trap a `get`, except this time, if the property that is being sought
    out happens to be `equals,` we return our custom implementation; otherwise, simply
    forward the call to the original object. Although our `equals` implementation
    does not in any way differ from our earlier attempt, our approach is significantly
    different. We gain new behavior via the proxy, without having to monkey-patch
    `Array` itself.


    This augmentation is visible to only those who use the proxy. Furthermore, since
    the proxy delegates to the original object for anything outside of `get`-ing the
    `equals` method, for any other consumer of the proxy, the modification is completely
    transparent.


    ## Enforcing Singletons


    Perhaps now we can see how we can accomplish a many a nifty feature like adding
    methods or modifying existing methods. Let us consider another use-case wherein
    we use proxies to build the singleton pattern.^([^(92)](#fn92)) In order to achieve
    this, we will have to trap the construction of an object, ensuring that once we
    have an instance, we always return that instance. A glance at the MDN documentation
    leads us to `handler.construct` ^([^(93)](#fn93))`—`perfect! Just what we need.


    ```

    const singletonFactory = (constructorFn) => { ①

    let instance; ②

    const handler = {

    construct(target, args) { ③

    if (!instance) {

    instance = Reflect.construct(constructorFn, args); ④

    }

    return instance; ⑤

    },

    };

    return new Proxy(constructorFn, handler);

    };

    class SuperHeroService { ⑥

    constructor() {

    this.heroes = [

    ''IronMan'',

    ''Captain America'',

    ''Wasp'',

    ''Black Widow'',

    ];

    }

    getHeroes() {

    return this.heroes;

    }

    addHero(hero) {

    this.heroes.push(hero);

    }

    }

    const SingletonSuperHeroService = singletonFactory(SuperHeroService); ⑦

    const service1 = new SingletonSuperHeroService();

    const service2 = new SingletonSuperHeroService(); ⑧

    // prints ''true''

    console.log(service1 === service2); ⑨

    ```


    *   ① Define our proxy helper


    *   ② A local variable to cache our instance


    *   ③ Trap the constructor call


    *   ④ If we do not have an instance, invoke the supplied constructor


    *   ⑤ Otherwise we return our cached instance


    *   ⑥ A class we wish to treat as a singleton


    *   ⑦ Create the proxy


    *   ⑧ Multiple calls to the proxy return the same instance


    *   ⑨ Ensure that the instances are the same


    Our proxy creator function expects to get the constructor of the object we wish
    to make a singleton as its sole argument. Our implementation, save for trapping
    the `construct`, is rather unimpressive—we hold a local reference to the singleton
    if and when we create it, and upon subsequent invocation of the constructor simply
    return the same reference. As we can see, we can wrap any constructor that we
    wish to treat as a singleton with this simple implementation. Multiple invocations
    of the proxied constructor simply return the same instance.'
