    *   ② 调用标签函数，传入一个模板字符串\n\n```\nconst handler = (strings, ...values) => { ①\nconst\
    \ interleave = (arr1, arr2) =>\narr1.reduce((arr, v, i) => arr.concat(v, arr2[i]),\
    \ []);\nreturn interleave(strings, values).join(\");\n};\nconst greeting = 'Hello';\n\
    const name = 'Ernest';\nconst msg = handler`${greeting}! 我的名字是 ${name}.`; ②\n\
    // 输出 'Hello! 我的名字是 Ernest.'\nconsole.log(msg);\n```\n\n标签函数有一个独特的调用模式，与普通函数必须将参数包裹在圆括号中不同，标签函数直接接受行内的模板字符串。JavaScript\
    \ 将模板字符串拆分为固定部分和动态部分，分别传递给标签函数——所有固定部分作为第一个参数数组传入，插值部分按它们在原始模板中出现的顺序依次传入。因此，在我们的例子中，`strings`是一个固定部分的数组，我们使用可变参数语法将所有剩余参数捕获到另一个数组中。\n\
    \n剩下的就很简单了——只需交错这两个数组，从`strings`数组的第一项开始，接着是`values`数组的一项，直到`strings`数组的末尾，然后返回结果。\n\
    \n如果你在控制台中尝试，你会看到可以为它提供任何模板字符串，它会像被 JavaScript 求值一样返回该字符串。\n\n到目前为止，我们实现的东西 JavaScript\
    \ 已经为我们做了，所以你可能还不相信为什么标签函数是个好主意。让我们尝试一个稍微更复杂的例子——有一个非常流行的编辑器扩展叫做 [Emmet](https://emmet.io/)。安装后，它可以通过提供高度简写的语法，将文本展开为有效的\
    \ HTML 代码，从而让你极其快速地编写 HTML（和 CSS）。Emmet 更进一步，在展开后将光标放置在正确的位置，让我们可以输入内部 HTML。考虑以下示例，其中注释表达了开发者在支持\
    \ Emmet 的编辑器中输入的内容，然后按`Tab`键，看看 Emmet 会将文本转换为什么（其中`_`表示 Emmet 放置光标的位置）：\n\n```\n\
    \ TAB -->\n_\n TAB -->\n_\n TAB -->\n\n```\n\nEmmet 语法显然受到 CSS 选择器的启发，例如`document.querySelector`和\
    \ jQuery 接受的语法。Emmet 是一种交互式媒介，因为它可以将光标放置在适当的位置，以便开发者输入代表元素`innerHTML`的文本。\n\n\
    如果我们想以编程方式做类似的事情，即提供受 Emmet 启发的语法，然后我们的代码将其展开为相应的 HTML，会怎么样？当然，我们需要一种表达元素`innerHTML`的方式，因为我们实际上要写出所有的\
    \ HTML，并且没有方便地放置光标的奢侈条件，所以我们将采取一种巧妙的方法。我们将使用模板字面量和标签函数，但有一个限制——元素的`innerHTML`必须作为插值变量在模板字符串的末尾提供。换句话说，`h1.title${someVar}`是有效的，但`h1.title.content${someVar}#main`是无效的。这将让我们知道哪些部分组成\
