- fmt: 'This argument can be extended to objects that we did not create, and therefore
    do not own. Consider the use of an array. What if we wanted to make it so arrays
    could be compared? They would compare their individual items, recursing if the
    item itself happens to be a nested array. Here is one approach:


    * ① Use `Object.defineProperty` to add an `equals` method

    * ② Voila! Now that method is available on every array


    ```

    Object.defineProperty(Array.prototype, ''equals'', { ①

    value(other) {

    if (!other) return false;

    if (!Array.isArray(other)) return false;

    if (this.length !== other.length) return false;

    const [fMe, ...rMe] = this;

    const [fOther, ...rOther] = other;

    if (fMe === fOther) {

    return true;

    }

    if ((rMe.length === 0) && (rOther.length === 0)) {

    return true;

    }

    return rMe.equals(rOther);

    },

    enumerable: false,

    configurable: true,

    });

    const first = [1, 2, 3, [4, 5]];

    const second = [1, 2, 3, [4, 5]];

    const third = [1, 2, 3];

    // prints ''true''

    console.log(first.equals(second)); ②

    // prints ''false''

    console.log(first.equals(third));

    ```


    In this example we use `Object.defineProperty` to define an `equals` method on
    `Array`s prototype. We could just as easily tacked the property using `Array.prototype.equals
    = function() { … }`; however, using `Object.defineProperty` gives us a chance
    to configure the visibility of this new method—setting `enumerable` to `false`
    hides the property from `for-in` loops. At the same time, we set its `configurable`
    property to `true`, thus allowing us to delete the property if we choose to do
    so.


    Note that in this case we are augmenting `Array`s, rather than modifying the behavior
    of existing methods on an array.


    In languages like Ruby and Python, any modification of an existing type or object
    at runtime is referred to as "monkey patching."^([^(87)](#fn87)) This can be very
    useful—for example Ruby on Rails^([^(88)](#fn88)) uses this technique to great
    benefit; however, if not executed or documented properly, it can prove to be very
    confusing or even pernicious.


    In addition to modification and augmentation of behavior, there are other enhancements
    or restrictions we might want to affect—returning reasonable defaults for undefined
    properties, tacking on methods dynamically, constraining construction of objects
    so we are using a singleton, the list goes on. Ideally, we should be able to modify
    behavior in a manner that is unobtrusive, **and** namespaced, or isolated to specific
    parts of our application, wherein we intentionally ask for the modified behavior,
    knowing that we have in no way affected the behavior of the original object. In
    response, ES6 introduces `Proxy`, alongside `Reflect`. While the two offer a slew
    of functionality on their own, together they make a remarkable tag team.


    ## Metaprogramming with Proxy and Reflect


    ES6 `Proxy` class, as the name suggests, allows us to implement the Proxy pattern^([^(89)](#fn89))
    as a language-level construct. It allows us to create a proxy that wraps the object
    we wish to enhance or modify. However, since it has language level support, we
    can intercept or proxy basic operations like getting/setting/adding/deleting properties
    and constructor calls for objects and invocations for functions. In other words,
    `Proxy` lets us hook into the internal machinery of JavaScript itself.


    The mechanism to intercede and thereby modify behavior is through the use of a
    "handler" object that has "traps" defined. If we do not define a trap for a particular
    piece of functionality, the proxy rightly forwards the call to the original object.


    Let us start with a simple example of a proxy and a handler, and we will then
    delve into all of the moving parts that make proxies awesome in ES6.


    * ① An object we wish to augment

    * ② Construct a proxy

    * ③ Provide the proxy with a handler

    * ④ Define the "get" trap

    * ⑤ Use the proxy


    ```

    const toBeIntercepted = { ①

    name: ''Jonathan'',

    getName() {

    return this.name;

    },

    setName(name) {

    this.name = name;

    },

    };

    const proxied = new Proxy(toBeIntercepted, ②

    { ③

    get(target, property) { ④

    console.log(`${property} was called`);

    return target[property];

    },

    },

    );

    // prints ''name was called'', followed by ''Jonathan''

    console.log(proxied.name); ⑤

    // prints ''getName was called'', followed by ''Jonathan''

    console.log(proxied.getName());

    ```


    We construct a proxy *around* an object using the `Proxy` constructor, which takes
    two arguments—the object we wish to proxy and a handler object that has traps
    defined on it. The traps are functions with very specific^([^(90)](#fn90)) names
    and signatures, each one targeting a specific piece of JavaScript''s internal
    mechanisms. The proxy invokes the appropriate trap, passing it a reference to
    the original object, the name of the property that was looked up, as well as a
    reference to the proxy object.


    Note that the proxy makes no attempt to modify the original object! Instead it
    hands us a *new* object, that has been adorned with the new behavior—however,
    we may still hold a reference to the original object, reverting back to it if
    we so desire.


    Our initial attempt might be rather simplistic, but we can see the beginnings
    of how we can use proxies to accomplish some rather mind-altering metaprogramming
    magic in JavaScript. Let us extend our proxy implementation to recreate intercepting
    all method calls on an object:


    * ① Define a wrapper function to create a proxy

    * ② Our handler with the `get` trap

    * ③ Ensure that we only intercept the supplied objects methods

    * ④ Call the interception function first

    * ⑤ Then delegate to the original method

    * ⑥ Return the proxy

    * ⑦ Define our "logger" function

    * ⑧ Define a plain JavaScript object

    * ⑨ Be sure to wrap our object with the proxy and use that going forward


    ```

    const intercept = (obj, interceptionFn) => { ①

    const handler = { ②

    get(target, property) {

    if ((Reflect.has(target, property))

    && (target[property] instanceof Function)) { ③

    interceptionFn.call(target, property); ④

    }

    return Reflect.get(target, property); ⑤

    },

    };

    return new Proxy(obj, handler); ⑥

    };

    const logger = m => console.log(`${m} was called`); ⑦

    const toBeIntercepted = { ⑧

    name: ''Jonathan'',

    getName() {

    return this.name;

    },

    setName(name) {

    this.name = name;

    },

    };

    const proxied = intercept(toBeIntercepted, logger); ⑨

    // prints ''getName was called'' followed by ''Jonathan''

    console.log(proxied.getName());

    // prints ''setName was called''

    proxied.setName(''Johnson'');

    // prints ''getName was called'' followed by ''Johnson''

    console.log(proxied.getName());

    ```'
