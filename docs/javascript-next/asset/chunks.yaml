- fmt: '# 11. Many of a Kind with Classes


    Building objects via classes, and organizing them in hierarchies in JavaScript,
    is hard. Functions, constructors, the `prototype` property—combine all of these
    using a secret recipe, sprinkle some magic dust, and voila, we have inheritance,
    *assuming* we get all the wiring correct. Without having an intricate understanding
    of how JavaScript prototypal inheritance works, it feels like its black magic.


    In this chapter we will see how we can easily create classes and build inheritance
    trees in our code using several new keywords like `class`, `extends`, and `super`
    that were introduced in ES6, allowing us to express our intent just as we would
    have in other object-oriented languages. Once we are done with this chapter, we
    will be confident in our abilities to model our problem space comprehensibly.
    We will also walk away with a nuanced view of when we should reach for this new
    feature in our codebase, and times when we might be better off without it.


    ## The Difficulties of Building Classes and Inheritance in JavaScript


    JavaScript is object-oriented, where objects can act as “bags” of data, and methods,
    which happen to be functions that can operate on the contained data. JavaScript
    embodies prototypal inheritance, wherein objects extend from other objects, which,
    when coupled with its dynamic typing, is arguably much more powerful than classical
    inheritance seen in languages like Java or C#. Granted, JavaScript does not seem
    to lend itself to principles that are obvious in other languages like abstraction,
    polymorphism, inheritance, and encapsulation—however, with a little bit of trickery,
    many of these *can* be achieved.


    And herein lies the rub—while many of the aforementioned object-oriented facets
    *are* possible in JavaScript, it is extremely hard to get right without having
    intimate knowledge of everything involved to make the magic happen. One needs
    to understand how functions can act as constructors, how `new`-ing creates objects,
    and how the constructor invocation wires up the resulting objects prototype. It
    also requires one to grok how the `constructor` and `prototype` property work
    within the instance to allow for things like inheritance to work. Consider the
    following snippet:


    - ① A constructor function

    - ② Tack on an instance method on the function’s prototype

    - ③ Add another instance method


    ```

    function Person(name) { ①

    this.name = name;

    }

    Person.prototype.getName = function () { ②

    return this.name;

    };

    Person.prototype.sayHello = function (to) { ③

    return `Hello ${to.getName()}. My name is ${this.name}.`;

    };

    const raju = new Person(''Raju'');

    const venkat = new Person(''Venkat'');

    // prints ''Hello Venkat. My name is Raju''

    console.log(raju.sayHello(venkat));

    ```


    Let us break it apart, one piece at a time. Before we start, bear in mind that
    functions in JavaScript *are* objects, and like objects, can have properties.
    One such property happens to be the `prototype` property.


    In our example, we leverage the fact that functions play a dual role in JavaScript.
    That is, they can act both as regular functions, and constructors, much like constructors
    we may be used to in other languages like Java or C#. The only difference between
    a regular function invocation and constructor function invocation is that the
    latter uses the `new` keyword.


    When a function is invoked with the `new` keyword, a new object is created that
    has a hidden pointer to the prototype of the function that created it, and `this`
    is bound to this new object inside the body of the constructor function. In other
    words, anytime we use `this` *inside* the body of a (constructor) function, we
    are referring to this new object, that happens to be an “instance” created by
    that function.


    Consequently, any time we tack on a property, like `this.name` we are simply tacking
    it on the *newly created instance*. However, if we wish to have “instance” methods
    for all instances created by a function, then we leverage the fact that the newly
    created object has a pointer to the functions `prototype`, so by saying `Person.prototype`
    we are changing the prototype of the new object!


    Finally, since all instances of this function have the same methods (since they
    belong to the shared prototype object), we can invoke one instance method from
    another, for example, we can use `getName()` from `sayHello()`.


    ![../images/481812_1_En_11_Chapter/481812_1_En_11_Fig1_HTML.png](images/481812_1_En_11_Chapter/481812_1_En_11_Fig1_HTML.png)


    Figure 11-1


    Prototypal inheritance


    This picture describes how prototypal inheritance works, wherein, the newly created
    instance references the prototype of the function that created it.^([^(66)](#fn66))
    If we are to look up a property (or invoke a method) that does not exist on the
    instance itself, then the object *delegates* to its prototype, thus “climbing”
    the inheritance tree. Of course, if we reach the end of the prototype chain, and
    the property was not found, we would get an `undefined`.'
