    *IN MEMORIAM*


    *My Baa*


    *(1932–2018)*


    ![../images/481812_1_En_BookFrontmatter_Figb_HTML.jpg](images/481812_1_En_BookFrontmatter_Figb_HTML.jpg)


    Introduction


    JavaScript is everywhere—it runs single-page applications on the client side,
    is used on the server side (with technologies like Node.js), helps build desktop
    applications with Electron, ^([¹](#fn1)) and can be used to work with single-board
    computers like Raspberry Pi. ^([²](#fn2)) JavaScript is even used to train machine-learning
    models in the browser using technologies like TensorFlow.js. ^([³](#fn3)) All
    this to say, JavaScript is (arguably) the most deployed language in the world—every
    desktop and laptop and every phone with an embedded browser can run JavaScript.
    As it stands today, JavaScript exhibits many of the features that one would expect
    from a language with this large a footprint.


    But that wasn’t always the case.


    JavaScript has a long history, spanning 24 years at the time of this writing.
    In this time, JavaScript went from being a scripting language used to animate
    web pages to one that is being used everywhere, and for everything. JavaScript’s
    reputation, however, preceded itself—it was deemed quirky and error-prone, and
    not all the criticisms were without merit. And everyone, including the TC39, ^([⁴](#fn4))
    the central committee that is responsible for evolving JavaScript, took notice.


    In 2015, ES6 was announced, which introduced a slew of new features and syntactic
    changes to the language. The aim was simple—to usher JavaScript into the modern
    Web era—armed with the features that developers were vying for, and provide the
    basis for future editions of the language.


    The result? A language that aims to improve developer experience, with constructs
    that seem familiar to developers coming in from other languages. Alongside, a
    yearly cadence for releasing future editions was announced, ensuring that JavaScript
    continues to evolve and mature.


    Features like default parameters, support for variadic functions, destructuring
    syntax, and fat-arrow functions make it easier to lean into JavaScript’s functional
    nature, allowing for code that is concise and elegant. Simultaneously, the newly
    added class syntax makes it possible to build inheritance hierarchies easily,
    allowing for library and framework authors to provide the necessary “trellis”
    to hook into, and extend.


    Asynchronous programming is a natural consequence of JavaScript’s inherent design,
    and once again, the new additions to JavaScript make things easier. Promises are
    now a native API, opening the door for a whole new level of abstractions, that
    we, the developers, can build on. Two such abstractions are async/await, which
    use promises and help make writing asynchronous code seem almost imperative.


    And there is much more! All put together, JavaScript today feels like a very different
    language—one that acts and behaves like other languages that developers might
    be used to.


    This book aims to introduce you to all of these features, endeavoring to provide
    a nuanced view of the “what” and the “why” for every inclusion. However, we cannot
    learn without doing—so this book provides a slew of examples, each one catered
    to highlight a specific feature. So, let’s put our developer hats on, fire up
    our editors, and write some code.


    Ready? Set? Go!


    ## Who should read this book


    This book is directed toward programmers, developers, technical leads, architects,
    programming hobbyists, or anyone interested in learning about how JavaScript has
    evolved over the past 5 years. If you are someone who dreads JavaScript development
    because you have been burnt one too many times by the language, then perhaps this
    book will demonstrate how the language has been transformed to be more familiar
    (to programmers comfortable with other languages) and less idiosyncratic.


    ## What you’ll find in this book


    This book aims to be a comprehensive resource on all the enhancements that were
    introduced in Ecmascript (ES) 6, 7, 8, and 9\. Every chapter starts with highlighting
    a deficiency or defect in the language, and its implications. It then introduces
    a new feature or addition to the language, and how the change addresses the specific
    problem area.


    This book does **not** aim to introduce new features chronologically (starting
    with edition 6 all the way through 9); rather, I aim to collate features from
    multiple editions, as long as they logically “reside” together. However, I do
    highlight which edition the feature was introduced.


    Many technical books give you a play-by-play, chapter-by-chapter breakdown of
    what you are to find in the book. Truth be told, I have always found myself skipping
    over the listing, preferring to stick to the table of contents, or heading straight
    for the index to find what I am looking for. Consequently, I am going to save
    myself a few keystrokes, and you a little time. I do hope you will understand,
    and perhaps forgive this omission.


    ## What you won’t find in this book


    This book does not intend to be a comprehensive resource to programming, or JavaScript,
    the language. It assumes that you, the reader, have a background in programming
    and a certain familiarity with the language. However, there are parts to the language
    that many of us may not have explored in the past, and for those aspects, I do
    provide a richer discourse if I deem it necessary.


    JavaScript also regularly sees modifications, additions, and the occasional deprecation
    to existing APIs, and this trend continues in the newer editions of the language.
    Again, this book does not cover any of these; rather, it focuses on *syntactic*
    enhancements to the language.


    Finally, there exist several options to run modern JavaScript. These include transpilers
    like Babel. ^([⁵](#fn5)) This book makes no attempt to cover how to use any such
    tooling, or document the associated configurations.'
