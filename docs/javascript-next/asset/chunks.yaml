  trans: '

    ### 深入解析`展开操作符`的微妙之处


    最好先单独研究展开操作符。以我们的老朋友`console.log`为例。`log`是一个多参数函数，即给定`n`个参数时，它会将每个值用空格分隔后写入控制台。我们直接用其来观察展开操作符的效果：


    -   ① 从一个数组开始

    -   ② 直接打印数组——显示`[ 12, -3, 15, 44, 15, 36 ]`

    -   ③ 使用展开操作符——显示`12 -3 15 44 15 36`

    -   ④ 用`console.log`模拟展开操作符的工作方式


    ```

    const arr = [12, -3, 15, 44, 15, 36]; ①

    // 打印 ''[ 12, -3, 15, 44, 15, 36 ]''

    console.log(arr); ②

    // 打印 ''12 -3 15 44 15 36''

    console.log(...arr); ③

    // 要实现与使用展开操作符相同的结果

    let temp = ";

    for (const i in arr) {

    temp += arr[i];

    if (i != (arr.length - 1)) {

    temp += '' '';

    }

    }

    console.assert(temp === ''12 -3 15 44 15 36''); ④

    ```


    我们可以得出结论：将数组作为参数调用`console.log`实际上是只传递了**一个**参数。然而，使用展开操作符作用于数组进行调用时，则会传递`n`个参数，其中`n`是数组的长度。


    当我们思考如何将数组的*每个*元素打印为一个空格分隔的字符串时，对比会更加明显。如果没有展开操作符，我们别无选择，只能强制性地遍历数组，每次拼接到临时字符串中，然后将该字符串传递给`console.log`。


    展开操作符使我们能够从命令式思维（我们的意图常常迷失在`for`循环和固定模式中）转变为以清晰的方式表达意图。


    展开操作符的一个普遍用例是连接数组。请记住，数组有一个`push`方法，用于将元素添加到数组末尾。事实证明，`push`也是一个多参数函数。然而，与某些`Math`操作符和`console.log`类似，如果要将一个数组的所有元素连接到另一个数组，此方法几乎无用。^(²⁶)


    展开操作符的另一个用例是从现有数组创建新数组。现在我们研究这两个用例：


    -   ① 使用展开操作符将数组复制到新数组

    -   ② 从三个数组开始

    -   ③ `push`会原地修改数组

    -   ④ 创建一个连接了元素和一个数组的*新*数组

    -   ⑤ 创建另一个连接了两个数组的数组


    ```

    const one = [12, -3, 15];

    const otherOne = [...one]; ①

    const two = [44, 15, 36]; ②

    // 修改操作

    one.push(...two); ③

    console.log(one);

    // 或者内联进行连接

    const concatenated = [12, -3, 15, ...two]; ④

    // 打印 ''[ 12, -3, 15, 44, 15, 36 ]''

    console.log(concatenated);

    // 创建一个新数组

    const newArr = [...otherOne, ...two]; ⑤

    // 打印 ''[ 12, -3, 15, 44, 15, 36 ]''

    console.log(newArr);

    ```


    我们从数组开始，通过将第一个数组展开到新数组的字面量表示法（`[]`）中来创建新数组。换句话说，`otherOne`是一个新数组，包含与初始数组相同的元素。


    与`console.log`一样，`Array`上的`push`方法恰好是一个多参数方法。因此，我们可以再次使用展开操作符，轻松地将一个数组中的多个元素推入另一个数组。但是，`push`会执行修改操作，即它会改变原数组。然而，函数式编程鼓励不可变性，如果这是*我们的*意图，那么展开操作符便是盟友。^(²⁷)


    展开操作符的一个微妙之处在于它**不**执行“扁平化”操作。如果我们展开一个数组的数组，最终结果将是各个组成数组。展开操作符不会递归地展开嵌套数组。


    使展开操作符工作的底层机制依赖于数组是“可迭代的”。我们稍后会介绍可迭代对象和迭代器；不过可以这么说，数组遵循迭代器协议，因此可以在展开操作符中使用。字符串、Map
    和 Set（我们很快也会看到它们）也是可迭代的，因此可以被展开。^(²⁸)


    使用展开操作符构建新数组的最大好处往往也是最容易被忽视的一点，即它的语法迫使我们将现有数组展开到一个新数组中。我们可以通过将现有数组`push`到一个空数组上来实现相同的行为，但这并非`push`
    API 的意图。相反，它的意图是修改现有数组，这与函数式编程的原则背道而驰。


    #### 展开与剩余——极性相反的双胞胎


    读者会注意到剩余参数和展开操作符的语法相同，但它们的行为却完全相反。剩余参数将提供给函数的所有未说明参数“收集”*到*一个数组中，而展开操作符则将数组中的所有元素提取*出来*。`...`语法的作用取决于调用上下文。`...`仅在发生赋值时充当剩余参数，否则，它充当展开操作符。这种矛盾既有趣又令人不安：


    -   ① 在将整个数组附加到返回值之前，先对剩余参数进行排序

    -   ② 对剩余参数进行排序，并将其展开以将其元素附加到返回值中


    ```

    const onlyRest = (teacher, ...students) => {

    return [teacher, students.sort()]; ①

    };

    const restAndSpread = (teacher, ...students) => {

    return [teacher, ...students.sort()]; ②

    };

    // 打印 ''[ ''Ada'', [ ''Carol'', ''Grace'', ''Mary'' ] ]''

    console.log(onlyRest(''Ada'', ''Mary'', ''Carol'', ''Grace''));

    // 打印 ''[ ''Ada'', ''Carol'', ''Grace'', ''Mary'' ]''

    console.log(restAndSpread(''Ada'', ''Mary'', ''Carol'', ''Grace''));

    ```


    我们首先定义两个多参数函数，都期望接收教师姓名，后跟 n 个学生姓名。由于两个函数都声明了一个剩余参数，教师之后的所有参数都会自动打包到一个数组中。两个函数在构建返回值之前，也会对`students`数组进行`sort`排序，返回值也是一个数组。然而，实现方式在此处出现了分歧。对于第一个函数，我们简单地用一个包含教师姓名的数组以及`sort`排序学生数组（返回一个数组）的结果构建一个新数组。结果正如预期，是一个包含两个元素的数组——教师姓名，后跟一个包含排序后学生姓名的数组。


    然而，在第二种情况下，我们将`sort`的结果*展开*到返回值中，从而直接返回一个字符串数组，以教师姓名开头，后跟按字母顺序排序的学生姓名。两种实现之间的差异很微妙，但效果却大相径庭。


    我们还会看到剩余参数适用的另一个场景，即数组解构——但首先，来看看对象的展开。


    ## 对象的展开操作符


    在 ES9 中引入，`…`操作符也可用于“展开”对象。与我们看到的用于索引集合的`…`操作符非常相似，`…`操作符会将对象“展开”为其各个键值对。然而，在深入探讨展开对象的细节之前，我们必须先讨论对象属性的特性，特别是`enumerable`描述符。

    '
- fmt: '### `Object.defineProperties`


    JavaScript developers are accustomed to constructing objects literally using the
    `{}` syntax, and tacking on arbitrary key-value pairs. These keys are by *default*
    enumerable, in that they will be listed if we were to use the `for-in` loop to
    iterate over the keys in the object.


    Simultaneously, the `Object` class also provides us various (programmatic) mechanisms
    to create objects, as well as conveniences to configure them. One of these APIs
    is `defineProperties` which can be used along with a “descriptor” object to define
    functions and even getters/setters for existing objects.^([^(29)](#fn29)) The
    role of `Object.defineProperties` is to inject properties onto an existing object
    (hereon referred to as the “target”) using the descriptor.


    The descriptor acts as a placeholder to contain the configuration for each key
    that we wish to introduce onto the target. The descriptor object is a plain-old
    JavaScript object, whose keys will be installed on the target. Let’s see how this
    is used with a simple example:


    - ① Invoke `defineProperties` with a target and descriptor object

    - ② Define the `name` key with the `value Michelle`


    ```

    const michelle = {};

    Object.defineProperties(michelle, { ①

    name: {

    value: ''Michelle'', ②

    },

    hobby: {

    value: ''Gardening'',

    },

    });

    // prints ''Michelle''

    console.log(michelle.name);

    // prints ''Gardening''

    console.log(michelle.hobby);

    ```


    The first argument is the object we wish to modify and the second argument happens
    to be the descriptor object, which as we can see is a JavaScript object with two
    keys. The value of every key in the descriptor object is the configuration for
    that property, and determines what form it will take in the target. That is, we
    are asking `defineProperties` to install two properties on the target object,
    namely `name` and `hobby`, with their associated values.


    This aforementioned property, `value` is **not** arbitrary; it is a member of
    a select few that we are allowed to use as elucidated in [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperties`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperties).
    These properties not only allow us to define a resultant property on the target
    as a value (remember, functions are values too in JavaScript), but also getter/setters
    and if the keys are `enumerable`, `writable`, and `configurable`.


    Of these, `enumerable` is of particular interest to our soon-to-be-had discussion
    on `Object.assign`, so let us take a moment to explore its usage and meaning.
    Just like we set the `value` for a particular key using the descriptor object,
    and tack it on using `Object.defineProperties`, we can also supply it the `enumerable`
    setting. If the `enumerable` setting is **not** supplied alongside the `value`
    key in the descriptor object, its default is `false`. This is in stark contract
    with the default settings for keys installed in literal (`{}`) object, which as
    we have discussed, happens to be `true`. This means that any property created
    using a descriptor object will **not** show up if were to iterate over the keys
    of the resultant object, unless we *explicitly* set the `enumerable` property
    to `true`:


    - ① Set the `enumerable` key to `true`

    - ② Since we are not setting `enumerable` here, it defaults to `false`

    - ③ Only `name` shows up


    ```

    const michelle = {};

    Object.defineProperties(michelle, {

    name: {

    value: ''Michelle'',

    enumerable: true, ①

    },

    hobby: {

    value: ''Gardening'', ②

    },

    });

    for (const k in michelle) {

    if (Object.prototype.hasOwnProperty.call(michelle, k)) {

    // only prints ''name''

    console.log(k); ③

    }

    }

    ```


    The thing to note here is that any property that does **not** have the `enumerable`
    property set is *invisible* to the `for-in` loop. If we wanted to make all the
    keys visible, we could just as easily have used the literal object syntax to construct
    the object! That is to say, the role of `Object.defineProperties` is to allow
    us to *limit* how the world sees or affects the keys in our objects.


    To return to the subject at hand, setting the enumerability of certain keys affects
    any algorithm that requires to interrogate an object for its keys, such as `JSON.stringify`,
    as well as the two new facilities that ES6 introduced, namely the newly added
    `Object.assign` as well as the object spread operator.


    We will look at both `Object.assign`, introduced in ES6, and the spread operator
    for objects, introduced in ES9 in the following sections. At first glance they
    seem to do similar things, but as we will see, their intent is certainly different.


    ### `Object.assign`


    ES6 gives us `Object.assign` as a means to copy all the enumerable keys of one
    object into another. `assign` takes a “target” object, followed by any number
    of “source” objects, and copies over all the *enumerable* keys of the source objects
    onto the target object. Consider the following example:


    - ① Initialize an object literally

    - ② Use `Object.assign` to construct a new object that merges all the source objects


    ```

    const michelle = { ①

    name: ''Michelle'',

    hobby: ''Gardening'',

    };

    const rachael = Object.assign({}, michelle, { ②

    name: ''Rachael'',

    profession: ''Auditor'',

    });

    // prints ''{ name: ''Rachael'', hobby: ''Gardening'', profession: ''Auditor''
    }''

    console.log(rachael);

    ```


    We start with creating an object literally with two keys. Recall that all such
    properties defined on an object are by default enumerable. We could have achieved
    the same effect if we had using `Object.defineProperties`, setting the `enumerable`
    descriptor for each of those keys to `true`.


    Then we invoke `Object.assign` with a (blank) target, along with `michelle` and
    another (inlined) object literal. The thing to note here is that both `michelle`
    and the inline object have a property with the same name, which in case happens
    to be `name`. Therefore, if a single object were to copy over both (in order from
    left-to-right) then the last one wins. Right?


    As the `console.log` demonstrates, the clone indeed has the union of the properties
    in the individual source objects. *However*, the name happens to be `Rachael`,
    which tells us that properties are indeed copied from left to right; in other
    words, both `michelle` and the inline object passed in as the sources have the
    same property, but it’s the latter one that won.


    One way to think about `Object.assign` is that is “explodes” the source objects
    into the target object, and if there happens to be a key collision, the last one
    wins. Furthermore, we can cleverly use this to create new objects from existing
    ones simply by targeting an empty object, as demonstrated.


    Seemingly, `Object.assign` seems to do for objects what the spread operator does
    for iterables—it can help “spread” the key-value pairs of one object into another.
    However, it falls short on two accounts—the mechanisms to spread objects (`Object.assign`),
    and that for iterables (the spread operator) are not at par, in that they are
    syntactically different. Secondly, `Object.assign` is to objects what `Array.push`
    is to arrays, in that they both *mutate* the target object. Granted that we can
    supply an empty object as the target, however the intention of the API is to change
    the target.


    `Object.assign` has a place in our toolkit; however, if we are to adopt a functional
    mindset and embrace immutability, then we need another ally. Allow me to introduce
    you to the spread operator for objects.'
  raw: '### Object.defineProperties


    JavaScript developers are accustomed to constructing objects literally using the
    `{}` syntax, and tacking on arbitrary key-value pairs. These keys are by *default*
    enumerable, in that they will be listed if we were to use the `for-in` loop to
    iterate over the keys in the object.


    Simultaneously, the `Object` class also provides us various (programmatic) mechanisms
    to create objects, as well as conveniences to configure them. One of these APIs
    is `defineProperties` which can be used along with a “descriptor” object to define
    functions and even getters/setters for existing objects.^([^(29)](#fn29)) The
    role of `Object.defineProperties` is to inject properties onto an existing object
    (hereon referred to as the “target”) using the descriptor.


    The descriptor acts as a placeholder to contain the configuration for each key
    that we wish to introduce onto the target. The descriptor object is a plain-old
    JavaScript object, whose keys will be installed on the target. Let’s see how this
    is used with a simple example:


    *   ① Invoke `defineProperties` with a target and descriptor object


    *   ② Define the `name` key with the `value Michelle`


    ```

    const michelle = {};

    Object.defineProperties(michelle, { ①

    name: {

    value: ''Michelle'', ②

    },

    hobby: {

    value: ''Gardening'',

    },

    });

    // prints ''Michelle''

    console.log(michelle.name);

    // prints ''Gardening''

    console.log(michelle.hobby);

    ```


    The first argument is the object we wish to modify and the second argument happens
    to be the descriptor object, which as we can see is a JavaScript object with two
    keys. The value of every key in the descriptor object is the configuration for
    that property, and determines what form it will take in the target. That is, we
    are asking `defineProperties` to install two properties on the target object,
    namely `name` and `hobby`, with their associated values.


    This aforementioned property, `value` is **not** arbitrary; it is a member of
    a select few that we are allowed to use as elucidated in [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperties`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperties)
    . These properties not only allow us to define a resultant property on the target
    as a value (remember, functions are values too in JavaScript), but also getter/setters
    and if the keys are `enumerable`, `writable,` and `configurable`.


    Of these, `enumerable` is of particular interest to our soon-to-be-had discussion
    on `Object.assign`, so let us take a moment to explore its usage and meaning.
    Just like we set the `value` for a particular key using the descriptor object,
    and tack it on using `Object.defineProperties`, we can also supply it the `enumerable`
    setting. If the `enumerable` setting is **not** supplied alongside the `value`
    key in the descriptor object, its default is `false`. This is in stark contract
    with the default settings for keys installed in literal (`{}`) object, which as
    we have discussed, happens to be `true`. This means that any property created
    using a descriptor object will **not** show up if were to iterate over the keys
    of the resultant object, unless we *explicitly* set the `enumerable` property
    to `true`:


    *   ① Set the enumerable key to true


    *   ② Since we are not setting `enumerable` here, it defaults to `false`


    *   ③ Only `name` shows up


    ```

    const michelle = {};

    Object.defineProperties(michelle, {

    name: {

    value: ''Michelle'',

    enumerable: true, ①

    },

    hobby: {

    value: ''Gardening'', ②

    },

    });

    for (const k in michelle) {

    if (Object.prototype.hasOwnProperty.call(michelle, k)) {

    // only prints ''name''

    console.log(k); ③

    }

    }

    ```


    The thing to note here is that any property that does **not** have the enumerable
    property set is *invisible* to the `for-in` loop. If we wanted to make all the
    keys visible, we could just as easily have used the literal object syntax to construct
    the object! That is to say, the role of `Object.defineProperties` is to allow
    us to *limit* how the world sees or affects the keys in our objects.


    To return to the subject at hand, setting the enumerability of certain keys affects
    any algorithm that requires to interrogate an object for its keys, such as `JSON.stringify`,
    as well as the two new facilities that ES6 introduced, namely the newly added
    `Object.assign` as well as the object spread operator.


    We will look at both `Object.assign`, introduced in ES6, and the spread operator
    for objects, introduced in ES9 in the following sections. At first glance they
    seem to do similar things, but as we will see, their intent is certainly different.


    #### Object.assign


    ES6 gives us `Object.assign` as a means to copy all the enumerable keys of one
    object into another. `assign` takes a “target” object, followed by any number
    of “source” objects, and copies over all the *enumerable* keys of the source objects
    onto the target object. Consider the following example:


    *   ① Initialize an object literally


    *   ② Use `Object.assign` to construct a new object that merges all the source
    objects


    ```

    const michelle = { ①

    name: ''Michelle'',

    hobby: ''Gardening'',

    };

    const rachael = Object.assign({}, michelle, { ②

    name: ''Rachael'',

    profession: ''Auditor'',

    });

    // prints ''{ name: ''Rachael'', hobby: ''Gardening'', profession: ''Auditor''
    }''

    console.log(rachael);

    ```


    We start with creating an object literally with two keys. Recall that all such
    properties defined on an object are by default enumerable. We could have achieved
    the same effect if we had using `Object.defineProperties`, setting the `enumerable`
    descriptor for each of those keys to `true`.


    Then we invoke `Object.assign` with a (blank) target, along with `michelle` and
    another (inlined) object literal. The thing to note here is that both `michelle`
    and the inline object have a property with the same name, which in case happens
    to be `name`. Therefore, if a single object were to copy over both (in order from
    left-to-right) then the last one wins. Right?


    As the `console.log` demonstrates, the clone indeed has the union of the properties
    in the individual source objects. *However*, the name happens to be `Rachael,`
    which tells us that properties are indeed copied from left to right; in other
    words, both `michelle` and the inline object passed in as the sources have the
    same property, but it’s the latter one that won.


    One way to think about `Object.assign` is that is “explodes” the source objects
    into the target object, and if there happens to be a key collision, the last one
    wins. Furthermore, we can cleverly use this to create new objects from existing
    ones simply by targeting an empty object, as demonstrated.


    Seemingly, `Object.assign` seems to do for objects what the spread operator does
    for iterables—it can help “spread” the key-value pairs of one object into another.
    However, it falls short on two accounts—the mechanisms to spread objects (`Object.assign`),
    and that for iterables (the spread operator) are not at par, in that they are
    syntactically different. Secondly, `Object.assign` is to objects what `Array.push`
    is to arrays, in that they both *mutate* the target object. Granted that we can
    supply an empty object as the target, however the intention of the API is to change
    the target.


    `Object.assign` has a place in our toolkit; however, if we are to adopt a functional
    mindset and embrace immutability, then we need another ally. Allow me to introduce
    you to the spread operator for objects.'
  trans: '

    ### `Object.defineProperties`


    JavaScript 开发者习惯于使用 `{}` 语法直接创建对象，并随意添加键值对。这些键默认是可枚举的，也就是说，如果使用 `for-in` 循环遍历对象中的键，它们都会被列出。


    同时，`Object` 类也为我们提供了多种（编程式的）机制来创建对象，以及配置它们的便利方法。其中一个 API 是 `defineProperties`，它可以与一个“描述符”对象一起使用，为现有对象定义函数，甚至
    getter/setter。^(²⁹) `Object.defineProperties` 的作用是使用描述符向现有对象（以下简称“目标”）注入属性。


    描述符充当一个占位符，用于包含我们想要引入到目标对象的每个键的配置。描述符对象是一个普通的 JavaScript 对象，它的键将被安装到目标对象上。让我们通过一个简单的例子来看看它的用法：


    - ① 使用目标对象和描述符对象调用 `defineProperties`

    - ② 使用 `value: ''Michelle''` 定义 `name` 键


    ```

    const michelle = {};

    Object.defineProperties(michelle, { ①

    name: {

    value: ''Michelle'', ②

    },

    hobby: {

    value: ''Gardening'',

    },

    });

    // 输出 ''Michelle''

    console.log(michelle.name);

    // 输出 ''Gardening''

    console.log(michelle.hobby);

    ```


    第一个参数是我们想要修改的对象，第二个参数恰好是描述符对象，我们可以看到它是一个包含两个键的 JavaScript 对象。描述符对象中每个键的值就是该属性的配置，并决定了它在目标对象中的形式。也就是说，我们要求
    `defineProperties` 在目标对象上安装两个属性，即 `name` 和 `hobby`，以及它们各自的值。


    前面提到的这个 `value` 属性**并非**任意指定的；它是我们允许使用的少数几个成员之一，详情见 [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperties`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/defineProperties)。这些属性不仅允许我们在目标对象上定义一个结果属性作为值（记住，在
    JavaScript 中函数也是值），还允许定义 getter/setter，以及控制键是否为 `enumerable`、`writable` 和 `configurable`。


    其中，`enumerable` 对于我们即将讨论的 `Object.assign` 特别重要，所以让我们花点时间探讨它的用法和含义。就像我们使用描述符对象为某个键设置
    `value`，并通过 `Object.defineProperties` 安装它一样，我们也可以提供 `enumerable` 设置。如果在描述符对象中没有将
    `enumerable` 设置与 `value` 键一起提供，其默认值为 `false`。这与直接创建的对象（`{}`）中键的默认设置（我们已讨论过，默认为
    `true`）形成鲜明对比。这意味着，如果我们要遍历结果对象的键，使用描述符对象创建的任何属性都**不会**出现，除非我们*显式*地将 `enumerable`
    属性设置为 `true`：


    - ① 将 `enumerable` 键设置为 `true`

    - ② 由于此处未设置 `enumerable`，它默认为 `false`

    - ③ 只有 `name` 会显示出来


    ```

    const michelle = {};

    Object.defineProperties(michelle, {

    name: {

    value: ''Michelle'',

    enumerable: true, ①

    },

    hobby: {

    value: ''Gardening'', ②

    },

    });

    for (const k in michelle) {

    if (Object.prototype.hasOwnProperty.call(michelle, k)) {

    // 只输出 ''name''

    console.log(k); ③

    }

    }

    ```


    这里需要注意的是，任何没有设置 `enumerable` 属性的属性对于 `for-in` 循环都是*不可见*的。如果我们希望所有键都可见，直接使用对象字面量语法创建对象就可以了！也就是说，`Object.defineProperties`
    的作用是让我们能够*限制*外界如何看待或影响我们对象中的键。


    回到正题，设置某些键的可枚举性会影响任何需要查询对象键的算法，例如 `JSON.stringify`，以及 ES6 引入的两个新功能：新增的 `Object.assign`
    和对象展开运算符。


    我们将在后续章节中分别介绍 ES6 引入的 `Object.assign` 和 ES9 引入的对象展开运算符。乍看之下，它们做的事情相似，但正如我们将看到的，它们的意图截然不同。


    ### `Object.assign`


    ES6 提供了 `Object.assign`，作为一种将一个对象的所有可枚举键复制到另一个对象的方法。`assign` 接受一个“目标”对象，后跟任意数量的“源”对象，并将源对象的所有*可枚举*键复制到目标对象上。考虑以下示例：


    - ① 使用对象字面量初始化一个对象

    - ② 使用 `Object.assign` 创建一个新对象，合并所有源对象


    ```

    const michelle = { ①

    name: ''Michelle'',

    hobby: ''Gardening'',

    };

    const rachael = Object.assign({}, michelle, { ②

    name: ''Rachael'',

    profession: ''Auditor'',

    });

    // 输出 ''{ name: ''Rachael'', hobby: ''Gardening'', profession: ''Auditor'' }''

    console.log(rachael);

    ```


    我们首先使用字面量创建了一个包含两个键的对象。回想一下，对象上定义的所有此类属性默认都是可枚举的。如果使用 `Object.defineProperties`
    并将每个键的 `enumerable` 描述符设置为 `true`，我们也可以达到同样的效果。


    接着，我们调用 `Object.assign`，传入一个（空的）目标对象，以及 `michelle` 和另一个（内联的）对象字面量。这里需要注意的是，`michelle`
    和内联对象都有一个同名的属性，即 `name`。因此，如果要将二者都复制到同一个对象上（按从左到右的顺序），那么最后一个覆盖前面的，对吧？


    正如 `console.log` 所示，克隆对象确实包含了各个源对象中属性的并集。*然而*，`name` 的值是 `Rachael`，这告诉我们属性确实是按照从左到右的顺序复制的；换句话说，作为源对象传入的
    `michelle` 和内联对象拥有相同的属性，但后者胜出。


    可以将 `Object.assign` 理解为将源对象“展开”到目标对象中，如果发生键冲突，则后者的值胜出。此外，我们可以巧妙地利用这一点，通过指定一个空对象作为目标，从现有对象创建新对象，如示例所示。


    表面上，`Object.assign` 对对象的作用类似于展开运算符对可迭代对象的作用——它可以帮助将一个对象的键值对“展开”到另一个对象中。然而，它在两个方面有所不足——展开对象的机制（`Object.assign`）和展开可迭代对象的机制（展开运算符）并不对等，因为它们的语法不同。其次，`Object.assign`
    之于对象，犹如 `Array.push` 之于数组，它们都会*改变*目标对象。诚然，我们可以提供一个空对象作为目标，但该 API 的意图就是修改目标。


    `Object.assign` 在我们的工具包中占有一席之地；然而，如果我们想采用函数式编程思维并拥抱不可变性，那么我们需要另一个帮手。请允许我向您介绍对象展开运算符。

