    # 无法强制执行契约


    假设我们在代码中使用了某个第三方库，它暴露了一个函数，要求你提供的对象必须包含一个**特定**名称的属性。来看一个简单的例子：


    * ① 方便的 `const` 让事情更简单

    * ② 查找该实现期望在传入对象上找到的属性

    * ③ 在简单对象上添加一个属性，以便 `simpleLogger` 能使用它

    * ④ 另一个恰好拥有 `log` 属性的对象

    * ⑤ 现在我们该怎么办？


    ```

    const LOG_LEVEL = ''log''; ①

    const DEBUG = ''DEBUG'';

    const INFO = ''INFO'';

    const ERROR = ''ERROR'';

    const simpleLogger = (obj, msg) => {

    let returnMsg;

    switch (obj[LOG_LEVEL]) { ②

    case DEBUG:

    returnMsg = `DEBUG: ${msg}`;

    break;

    case INFO:

    returnMsg = `INFO: ${msg}`;

    break;

    case ERROR:

    returnMsg = `ERROR: ${msg}`;

    break;

    default:

    throw new Error(''无效的日志级别'');

    }

    console.log(returnMsg);

    return returnMsg;

    };

    const loggableObj = {

    [LOG_LEVEL]: INFO, ③

    };

    simpleLogger(loggableObj, ''this is a test'');

    const someOtherObject = {

    log: ''这只是一个普通属性'', ④

    };

    // simpleLogger(someOtherObject, ''some message'') ⑤

    ```


    在这个例子中，这个库函数期望传入的任何对象都必须有一个名为 `log` 的属性。库很贴心地提供了一个 `const`，我们可以结合增强的字面量语法，将合适的属性添加到我们的对象上。在内部，`simpleLogger`
    函数会检查 `log` 属性以确定日志级别，然后打印出相应的消息。


    但是，如果我们自己的对象已经有了一个名为 `log` 的属性，而它用于完全不同的目的，该怎么办？也就是说，我们对 `log` 属性的预期用途与函数期望的使用方式发生了冲突。于是，我们只能选择要么替换掉自己的属性来满足库的需求，要么就不用这个库。这两种选择似乎都不太理想。


    这里的问题在于，虽然我们有 `const`，可以安全地引用一个“名称”，从而总能得到正确的*值*，但字符串以及由此衍生的对象键（无论是属性还是方法）*确实可能*发生冲突！这就是为什么很多在其它对象上引入和/或期望“特殊”属性的库会采用命名惯例——比如给注入的属性加上
    `_` 或 `$` 前缀，并规定使用该库的开发者**不**应在自己的代码中使用相同的前缀。看看 AngularJS 风格指南，它明确指出了以下几点：


    > *不要对变量、属性和方法的名称使用 $ 前缀。此前缀保留给 AngularJS 使用。*


    这里的两难困境在于，为了满足我们的需求，我们需要一种方法来定义一个*不可能*发生冲突的名称，换句话说，就是一个真正独一无二的名称，它不会、也不能以任何方式与任何现有的名称或属性发生冲突。此外，我们希望做到这一点，而无需强制推行编码策略，或者更糟的是，使用某种晦涩的命名策略（比如使用
    UUID）来避免冲突！


    # Symbol 来救场


    Symbol 是 ES6 中引入的一种**新**的原始类型。与其他原始类型类似，Symbol 有一个包装类型，名为 `Symbol`，它提供了一个工厂函数来初始化新的
    Symbol。与 `String` 等其他包装对象不同，我们**不能**使用 `new` 来创建 Symbol——也就是说，使用 `new Symbol()`
    会导致错误。让我们看一段代码片段，了解如何初始化 Symbol：


    * ① 使用工厂函数创建一个新的 Symbol

    * ② 两个 Symbol 永远不会相等

    * ③ 出于调试目的，可以为 Symbol 提供一个描述

    * ④ Symbol 有一个 `toString` 实现，如果提供了描述，它会显示该描述


    ```

    const symbol1 = Symbol();

    const symbol2 = Symbol(); ①

    console.assert(symbol1 !== symbol2); ②

    const symbol3 = Symbol(''unique''); ③

    // 打印 Symbol(unique)

    console.log(symbol3); ④

    ```


    `Symbol` 初始化器可以接受一个描述；然而，这个描述对创建的 Symbol 本身没有影响，只对调试有用。


    两个 Symbol **永远**不会相等——每一次调用 `Symbol` 初始化器都会返回一个新的、唯一的 Symbol 实例。即使提供的描述相同也是如此（因为正如我们讨论过的，提供给初始化函数的字符串仅仅是为了调试）。


    所以，现在我们有了创建唯一“事物”的方法。这如何帮助我们解决命名冲突呢？


    原来，我们可以将 Symbol 用作对象中的键！让我们先看看如何使用 Symbol 和字符串在对象上定义属性：


    * ① 定义一个 Symbol

    * ② 一个只有 `name` 属性的普通 JavaScript 对象

    * ③ 无冲突地添加上 `iterable` 属性

    * ④ 这个对象已经有一个名为 `iterator` 的属性

    * ⑤ 我们仍然可以无冲突地添加一个描述为 `iterator` 的 Symbol


    ```

    const ITERATOR = Symbol(''iterator''); ①

    const iterableObject = {

    name: ''iterable'',

    }; ②

    iterableObject[ITERATOR] = function() {

    return ''我是可迭代的'';

    }; ③

    const objWithExistingKey = {

    iterator: ''一些值'',

    }; ④

    objWithExistingKey[ITERATOR] = () => ''成功了！''; ⑤

    ```


    注意，我们首先创建了一个 Symbol——然后我们使用那个*引用*作为对象属性的名称，以及用于查找。如示例所示，我们可以使用下标语法在现有对象上添加新属性，就像我们对任何表达式所做的那样。最后，一个对象可以同时拥有字符串和
    Symbol 作为其属性，即使属性的名称与 Symbol 的描述相匹配。


    利用我们新学的知识，让我们重新审视 `simpleLogger`，看看如何使用 Symbol 将行为“洒”到对象上，而在此之前我们只能屈从于命名冲突的后果。


    * ① 将 `LOG_LEVEL` 定义为一个 Symbol

    * ② 在 switch 中查找所需的属性

    * ③ 使用 Symbol 引用引入一个属性

    * ④ 现在它能工作了！


    ```

    const LOG_LEVEL = Symbol(''log''); ①

    const DEBUG = ''DEBUG'';

    const INFO = ''INFO'';

    const ERROR = ''ERROR'';

    const simpleLogger = (obj, msg) => {

    let returnMsg;

    switch (obj[LOG_LEVEL]) { ②

    case DEBUG:

    returnMsg = `DEBUG: ${msg}`;

    break;

    case INFO:

    returnMsg = `INFO: ${msg}`;

    break;

    case ERROR:

    returnMsg = `ERROR: ${msg}`;

    break;

    default:

    throw new Error(''无效的日志级别'');

    }

    console.log(returnMsg);

    return returnMsg;

    };

    const loggableObj = {

    log: ''这只是一个普通属性'',

    [LOG_LEVEL]: INFO, ③

    };

    simpleLogger(loggableObj, ''this is a test''); ④

    ```


    这个例子强调了如何利用 Symbol 在新对象或现有对象上引入无冲突的属性。


    使用 Symbol 来定义“接口”或“契约”属性，使得库和函数的编写者无需强制规定编码规范，同时允许使用这些库的客户端按照自己的意愿设计对象，并且能够使用这些库而无需担心冲突。


    双赢！

