  trans: '

    # 异步迭代器


    我们已了解 `Symbol.iterator` 的作用及其在 `for-of` 循环中的运作方式。ES9 引入了一个新符号 `Symbol.asyncIterator`，旨在用于执行异步操作的可迭代对象。任何希望实现异步迭代协议的对象，其约定与
    `Symbol.iterator` 类似：调用时必须返回一个包含 `next` 方法的对象。


    但在具体实现上，它与 `Symbol.iterator` 有所不同。`Symbol.asyncIterator` 返回的不是包含 `done` 和 `value`
    键的对象，而是返回一个 Promise，该 Promise 解析为这样的对象。或许通过代码比文字解释更容易理解。


    - ① 一个模拟后端调用的简单函数

    - ② 相应地 `return` 带有随机超时的 Promise

    - ③ 一个简单的类

    - ④ 实现 `Symbol.asyncIterator`

    - ⑤ `Symbol.asyncIterator` 返回一个简单对象，即迭代器

    - ⑥ 迭代器具有 `next` 方法

    - ⑦ 如果有值需要返回，则将 `value` 包装在 Promise 中返回

    - ⑧ 否则，如果迭代完成，则返回包含 `done: true` 的 Promise


    ```javascript

    const fetchFriends = (index) => { ①

    const friends = [

    ''Matt'',

    ''Neal'',

    ''Ken'',

    ];

    const timeout = Math.floor(Math.random() * Math.floor(42));

    if (index < friends.length) {

    return new Promise(res => setTimeout(res, timeout, friends[index])); ②

    }

    return Promise.reject(new Error(''No more records''));

    };

    class FriendsService { ③

    [Symbol.asyncIterator]() { ④

    let index = 0;

    return { ⑤

    next: async () => { ⑥

    // 调用后端异步请求以获取当前值

    try {

    const friend = await fetchFriends(index);

    index += 1;

    return { value: friend, done: false }; ⑦

    } catch (e) {

    index = 0;

    return { done: true }; ⑧

    }

    },

    };

    }

    }

    ```


    首先，我们定义一个模拟数据库游标，它使用索引从好友列表中检索好友。为了模拟真实场景，我们通过一个生成随机超时值的函数来模拟不同的检索时间。


    接着，我们创建一个简单的类，作为异步调用的服务封装。为了符合异步可迭代协议，它实现了 `Symbol.asyncIterator` 方法，该方法返回迭代器。这个迭代器具有
    `next` 方法——但它不直接返回值，而是将值包装在 Promise 中返回。


    实现 `Symbol.asyncIterator` 与 `Symbol.iterator` 的区别在于，前者中 `value` 和 `done` 标志都是异步解析的。


    ES9 还引入了另一种 `for-of` 循环，即 `for-await-of` 循环，它知道如何遍历异步可迭代对象。与 `for-of` 循环不同，这种循环在进入下一次迭代之前，会
    `await` `next` 调用返回的 Promise。顾名思义，此循环使用了 `await` 关键字，而我们知道，使用 `await` 时必须在 `async`
    函数内。让我们看看如何将其与我们的可迭代对象一起使用：


    - ① 使用 `for-await-of` 循环


    ```javascript

    (async () => {

    for await (const friend of new FriendsService()) { ①

    console.log(friend);

    }

    })();

    ```


    再次强调，我们需要一些样板代码来将调用包装在匿名 `async` 函数中。但如果运行此代码，我们会发现好友按照请求顺序依次显示。`for-await-of`
    循环与其同步版本类似，通过调用 `Symbol.asyncIterator` 来获取可迭代对象的迭代器，然后依次调用 `next` 方法，`await` 返回的
    Promise 被解析，最后提取 `value`。请注意，如果 Promise 解析为 `done: true`，迭代就会停止。


    与同步迭代器一样，我们也可以选择自行调用 `next` 方法；但由于 `next` 调用返回的是 Promise，我们需要附加一个 `then` 调用。


    ## 资源清理


    异步可迭代对象可以在其 `next` 方法中，在通过 `{ done: true }` 发出迭代结束信号之前，执行任何资源清理。由于迭代器自身知道何时到达终点，因此这种方式效果良好。


    但是，如果 `for-await-of` 循环提前终止迭代会发生什么？与同步可迭代对象一样，异步可迭代对象也可以（可选地）实现 `return` 方法。当客户端终止迭代时，该方法会被调用，示例如下：


    - ① 同时实现必需的 `next` 方法和可选的 `return` 方法

    - ② 在 `for-of` 循环中提前跳出


    ```javascript

    class SimpleIterable {

    [Symbol.asyncIterator]() {

    let counter = 0;

    return {

    next: async () => {

    if (counter < 3) {

    counter++;

    return { value: counter, done: false };

    }

    return { done: true };

    },

    return: async () => {

    console.log(''Cleanup called!'');

    return { done: true };

    }, // ①

    };

    }

    }

    (async () => {

    try {

    for await (const n of new SimpleIterable()) { ①

    console.log(n);

    return; ②

    // 或者 break，或者 throw new Error()

    }

    } catch (e) {

    console.log(''Error'', e);

    }

    })();

    ```


    我们将之前的示例简化，改为 `return` 一个解析为递增值的 Promise。但我们也实现了 `return` 方法，该示例中只是简单打印日志以确认被调用。请注意，我们应该在
    `return` 方法的返回值中表明可迭代对象已完成（`done`）。


    这里我们再次发现 `for-await-of` 循环与其同伴 `for-of` 循环的相似性：调用可迭代对象的 `return` 方法是底层机制的副作用。也就是说，如果我们提前终止迭代，`for-await-of`
    循环会自动调用可迭代对象的 `return` 方法。其他会触发自动调用 `return` 方法的机制包括：在 `for-await-of` 循环中的 `throw`
    错误，以及简单地使用 `break` 退出循环。


    ## 命令式风格


    `for-await-of` 循环名副其实，它使异步代码看起来像命令式代码。当出现问题时，我们使用的处理机制进一步凸显了这一特点。如果正在遍历的异步可迭代对象被
    `reject` 了怎么办？很简单。我们可以将 `for-await-of` 循环包裹在传统的 `try-catch` 块中。请看：


    - ① 拒绝 Promise

    - ② 使用传统 `try-catch` 块捕获错误


    ```javascript

    class SimpleRejectingIterable {

    [Symbol.asyncIterator]() {

    return {

    next: () => Promise.reject(''Error!''), ①

    };

    }

    }

    (async () => {

    try {

    for await (const n of new SimpleRejectingIterable()) {

    // 我们永远不会执行到这里

    console.log(n);

    }

    } catch (e) {

    console.log(''Error'', e); ②

    }

    })();

    ```


    此示例中的迭代器直接 `reject` 了 Promise。如果运行此代码，我们会看到 `await` 解包了错误，并正确地传播错误，使得 `catch`
    块能够捕获它。瞧！


    ## 与同步可迭代对象混合使用


    事实证明，`for-await-of` 循环可以同时处理异步和同步迭代器。这非常有用，因为我们甚至可以用它来处理普通的可迭代对象，如数组、Map 和 Set。让我们重新审视使用
    `for-await-of` 遍历 Promise 列表的例子：


    - ① 一个 Promise 列表

    - ② 对同步可迭代对象使用 `for-await-of` 循环


    ```javascript

    const randomTimeout = async (val, index) => {

    const timeout = Math.floor(Math.random() * Math.floor(42));

    return new Promise(res =>

    setTimeout(res, timeout, `My value is ${val} at index: ${index}`));

    };

    const promiseList = [

    randomTimeout(10, 1),

    randomTimeout(20, 2),

    randomTimeout(30, 3),

    ]; ①

    (async () => {

    for await (const p of promiseList) { ②

    console.log(p);

    }

    })();

    ```


    请注意，数组是一个同步可迭代对象。然而，正如所宣称的那样，`for-await-of` 循环可以遍历它。如果每次迭代返回的值恰好是 Promise，循环会暂停，直到该值被解析、解包，然后交给你。

