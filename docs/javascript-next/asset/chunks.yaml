  raw: '### Spreading Objects


    ES9^([^(30)](#fn30)) brings the same operator that we use to spread iterables,
    namely …​, and makes them available for objects. This can be demonstrated by revisiting
    our earlier example:


    *   ① Use the spread operator


    ```

    const michelle = {

    name: ''Michelle'',

    hobby: ''Gardening'',

    };

    const rachael = {

    ...michelle, ①

    ...{

    name: ''Rachael'',

    profession: ''Auditor'',

    },

    };

    // prints ''{ name: ''Rachael'', hobby: ''Gardening'', profession: ''Auditor''
    }''

    console.log(rachael);

    ```


    We start with a simple object, and attempt to construct a new object by spreading
    one or more objects into a new object. This example does not differ significantly
    from our earlier attempt except for the use of the spread operator instead of
    `Object.assign`. However, the new `...`​ syntax for objects does bring us to parity
    with how we spread iterables. Once again, the spread operator only copies over
    the enumerable properties of the object being spread.


    Also note that the spread operator, just like `Object.assign`, respects the order
    in which we supply its sources. If two or more objects being spread happen to
    have the same key, the last key wins.


    As we discussed in the previous section, the important distinction between `Object.assign`
    and the spread operator is the potential for side effects. `Object.assign` takes
    one target (as its first argument), followed by any number of sources. It then
    proceeds to *mutate* the target, copying the enumerable keys of sources into the
    target, and `return`-s the target object. If the target supplied happens to be
    an existing object, it is that object that will be endowed with the keys from
    the sources, thus changing that object.


    On the flip side, the spread operator syntax offers us no such avenue. The very
    syntax of the spread operator forces us to spread existing objects into a *new*
    object. Putting it another way, the spread operator syntax encourages immutability.


    ## Destructuring


    In an earlier discussion we deliberated upon the lack of symmetry between structuring
    (creation) and destructuring (reaching into) for arrays and objects. We touched
    upon several limitations of the existing approach, including the verbose syntax,
    the inability to default for “missing” parts, and lack of expressiveness in function
    signatures to advertise how they are to use their arguments. Now let us consider
    the new destructuring syntax, and how it addresses all of these concerns, followed
    by some of the caveats.


    ### Array Destructuring


    The destructuring syntax for arrays reflects their sequential idiom. Observe.


    *   ① We start with an array depicting the `rgba` value of the color pink


    *   ② We reach into the array using the destructuring syntax


    *   ③ Reaching for an element that the array does not have an index for returns
    `undefined`


    *   ④ If we wish to only reach a particular item in the array, we ignore other
    indexes


    ```

    const rgba = [239, 15, 255, 0.9]; ①

    const [r, g, b, a, nonExistent] = rgba; ②

    console.assert(r === 239);

    console.assert(g === 15);

    console.assert(b === 255);

    console.assert(a === 0.9);

    console.assert(nonExistent === undefined); ③

    const [, , blue] = rgba; ④

    const blueAgain = rgba[2];

    console.assert(blue === b);

    console.assert(blueAgain === b);

    ```


    The destructuring syntax for arrays uses the `[]` syntax on the left hand, that
    is, assignment side of an expression. As we can see, the destructuring assignment
    permits us to assign variables in scope *positionally* just as we would define
    elements *for* an array. Now, the left-hand side of the assignment looks symmetric
    to the right-hand side. The syntax also allows us to skip indexes that may not
    be needed.


    We can argue that the value of array destructuring when reaching for just one
    element is rather dubious when we could simply make use of the bracket notation,
    and it is a valid argument. However, the return of investment when interrogating
    for more than one element from an array certainly makes it worthwhile. Regardless,
    we can accede that operators like the bracket notation, or `length` still remain
    relevant, and should be used as and when deemed appropriate.


    Furthermore, looking at the assignment we can attempt to *infer*^([^(31)](#fn31))
    what the array on the right-hand side looks like.


    Destructuring elements from an array does **not** violate the semantics that we
    are used to when working with the bracket notation. Just as asking an array for
    an element at an index that exceeds its `size` returns `undefined`, so does destructuring.


    Consequently, any attempt to destruct `undefined` will result in an error. In
    fact, destructuring uses the same iterable machinery that the spread operator
    uses. Therefore, destructing *anything* that does not abide by the iterator interface
    (which we will see shortly) will result in an error.^([^(32)](#fn32))


    Much like default parameters, we can also default variable assignments in case
    an index of interest does not exist within the array like so:


    *   ① Start with an array representing a quadrilateral


    *   ② Destructure with defaults assuming a rhombus


    *   ③ Destructure with defaults assuming a square


    ```

    const quadrilateral = [10, 15, 10, 15]; ①

    const [q1 = 10,

    q2 = 20,

    q3 = q1,

    q4 = q2] = quadrilateral; ②

    console.assert(q1 === 10);

    console.assert(q2 === 15);

    console.assert(q3 === 10);

    console.assert(q4 === 15);

    const [sq1 = 10,

    sq2 = sq1,

    sq3 = sq1,

    sq4 = sq1] = []; ③

    console.assert(sq1 === 10);

    console.assert(sq2 === 10);

    console.assert(sq3 === 10);

    console.assert(sq4 === 10);

    ```


    Just like default parameters in function arguments, not only can we default a
    variable if it does not exist in the originating array, but variables to the right
    can default to the values of previously extracted elements!


    A function invocation in JavaScript also performs assignment; parameters in the
    method signature are assigned to each item in the argument list in turn. Turns
    out, we can destructure arrays directly in the method signature, along with defaulting
    them if they are not available in the array:


    *   ① Default the whole array as well as each element in the array


    *   ② No argument invocation triggering the default


    *   ③ Effectively the same as above


    *   ④ Calculate the perimeter of a square


    *   ⑤ Calculate the perimeter of a rectangle


    *   ⑥ Calculate the perimeter of a trapezium'
  trans: "\n### 展开对象\n\nES9^(³⁰) 将我们用于展开可迭代对象的运算符（即 `...`）引入，使其可用于对象。我们可以通过回顾之前的示例来演示这一点：\n\
    \n- ① 使用展开运算符\n\n```\nconst michelle = {\n  name: 'Michelle',\n  hobby: 'Gardening',\n\
    };\nconst rachael = {\n  ...michelle, ①\n  ...{\n    name: 'Rachael',\n    profession:\
    \ 'Auditor',\n  },\n};\n// 输出 '{ name: 'Rachael', hobby: 'Gardening', profession:\
    \ 'Auditor' }'\nconsole.log(rachael);\n```\n\n我们从简单的对象开始，尝试将一个或多个对象展开到新对象中来构建新对象。除了用展开运算符替代\
    \ `Object.assign` 之外，此示例与我们之前的尝试并无显著差异。然而，新的 `...` 对象语法确实使我们与展开可迭代对象的方式达成一致。同样，展开运算符仅复制被展开对象的可枚举属性。\n\
    \n另外请注意，展开运算符与 `Object.assign` 一样，会遵循我们提供源对象的顺序。如果两个或多个被展开的对象恰好包含相同的键，则后出现的键会覆盖前者。\n\
    \n正如我们在上一节中讨论的，`Object.assign` 与展开运算符的重要区别在于是否存在副作用。`Object.assign` 接受一个目标对象（作为第一个参数），后跟任意数量的源对象。接着它会*改变*目标对象，将源对象的可枚举键复制到目标对象中，然后`返回`目标对象。如果提供的目标恰好是一个现有对象，则正是该对象会获得来自源对象的键，从而改变该对象。\n\
    \n相反，展开运算符的语法并未提供此类途径。展开运算符的语法迫使我们只能将现有对象展开到*新的*对象中。换句话说，展开运算符的语法鼓励不可变性。\n\n##\
    \ 解构\n\n在之前的讨论中，我们探讨了数组和对象在结构化（创建）与解构（提取）之间缺乏对称性的问题。我们提到了现有方法的若干局限性，包括冗长的语法、无法为“缺失”部分设置默认值，以及函数签名在说明其如何使用参数方面缺乏表现力。现在，让我们了解新的解构语法，以及它如何解决这些问题，同时也会涉及一些注意事项。\n\
    \n### 数组解构\n\n数组的解构语法反映了其顺序特性。请注意观察。\n\n- ① 我们从表示粉色 `rgba` 值的数组开始\n- ② 使用解构语法从数组中提取值\n\
    - ③ 访问数组中没有对应索引的元素会返回 `undefined`\n- ④ 如果我们只想访问数组中的特定项，则忽略其他索引\n\n```\nconst rgba\
    \ = [239, 15, 255, 0.9]; ①\nconst [r, g, b, a, nonExistent] = rgba; ②\nconsole.assert(r\
    \ === 239);\nconsole.assert(g === 15);\nconsole.assert(b === 255);\nconsole.assert(a\
    \ === 0.9);\nconsole.assert(nonExistent === undefined); ③\nconst [, , blue] =\
    \ rgba; ④\nconst blueAgain = rgba[2];\nconsole.assert(blue === b);\nconsole.assert(blueAgain\
    \ === b);\n```\n\n数组解构语法在表达式左侧（即赋值侧）使用 `[]` 语法。如我们所 见，解构赋值允许我们按位置顺序在作用域内声明变量，就像我们为数组定义元素一样。现在，赋值左侧的语法与右侧对称。该语法还允许我们跳过不需要的索引。\n\
    \n对于仅提取一个元素的情况，使用数组解构的价值可能存疑，因为可以直接使用方括号表示法，这个论点也是合理的。然而，当需要从数组中提取多个元素时，解构的回报无疑使其更值得使用。尽管如此，我们承认方括号表示法或\
    \ `length` 等运算符仍然具有相关性，应在适当场合按需使用。\n\n此外，观察赋值语句，我们可以尝试*推断*^(([31])(#fn31))右侧数组的结构。\n\
    \n解构数组元素**不会**违反我们在使用方括号表示法时已习惯的语义。就像请求数组中超出其`大小`的索引处的元素会返回 `undefined` 一样，解构也是如此。\n\
    \n因此，任何对 `undefined` 进行解构的尝试都会导致错误。事实上，解构使用的是与展开运算符相同的可迭代机制。因此，对任何不遵循迭代器接口（我们稍后会介绍）的内容进行解构都会导致错误。^(([32])(#fn32))\n\
    \n与默认参数类似，我们也可以为变量赋值设置默认值，以防数组中不存在所需的索引，如下所示：\n\n- ① 从一个表示四边形的数组开始\n- ② 假设为菱形，使用默认值进行解构\n\
    - ③ 假设为正方形，使用默认值进行解构\n\n```\nconst quadrilateral = [10, 15, 10, 15]; ①\nconst\
    \ [q1 = 10,\n       q2 = 20,\n       q3 = q1,\n       q4 = q2] = quadrilateral;\
    \ ②\nconsole.assert(q1 === 10);\nconsole.assert(q2 === 15);\nconsole.assert(q3\
    \ === 10);\nconsole.assert(q4 === 15);\nconst [sq1 = 10,\n       sq2 = sq1,\n\
    \       sq3 = sq1,\n       sq4 = sq1] = []; ③\nconsole.assert(sq1 === 10);\nconsole.assert(sq2\
    \ === 10);\nconsole.assert(sq3 === 10);\nconsole.assert(sq4 === 10);\n```\n\n\
    就像函数参数中的默认参数一样，我们不仅可以在原始数组中不存在某变量时为其设置默认值，而且右侧的变量还可以引用之前提取元素的值作为默认值！\n\nJavaScript\
    \ 中的函数调用也会执行赋值操作；方法签名中的参数会依次分配给参数列表中的每一项。事实证明，我们可以直接在方法签名中对数组进行解构，同时还可以为数组中不存在的元素设置默认值：\n\
    \n- ① 为整个数组以及数组中的每个元素设置默认值\n- ② 无参数调用触发默认值\n- ③ 实际上等同于上述操作\n- ④ 计算正方形的周长\n- ⑤\
    \ 计算长方形的周长\n- ⑥ 计算梯形的周长\n"
- fmt: '```javascript

    const perimeter = ([s1 = 10,

    s2 = s1,

    s3 = s1,

    s4 = s2] = []) => { ①

    return s1 + s2 + s3 + s4;

    };

    console.assert(perimeter() === 40); ②

    console.assert(perimeter([]) === 40); ③

    console.assert(perimeter([15]) === 60); ④

    console.assert(perimeter([15, 20]) === 70); ⑤

    console.assert(perimeter([15, 20, 18, 23]) === 76); ⑥

    ```


    Everything we learned about default parameters applies here. We can default our
    parameters as a whole just like we would with the default parameter syntax, but
    if the parameter happens to be an array, we can destruct inline, as well as provide
    defaults to every element that we are interested in.


    The clear upside is that the function signature is much more expressive, at the
    cost of being verbose. Formatting certainly helps here, and breaking down individual
    pieces of the parameters using new-lines is a well-adopted technique.


    Finally, we can leverage the rest parameters as well with array destructuring.^([^(33)](#fn33))
    This allows us to reach into an array to grab all the elements we are interested
    in, while simultaneously slurping the rest of the elements into another array.


    - ① `rest` here is an array containing any unaccounted-for elements

    - ② Recurse into the remaining elements


    ```javascript

    const movies = [''Momento'', ''Batman Begins'', ''The Dark Knight''];

    const [first, ...rest] = movies; ①

    console.assert(first === ''Momento'');

    console.assert(Array.isArray(rest));

    const [head, ...tail] = rest; ②

    console.assert(head === ''Batman Begins'');

    console.assert(Array.isArray(tail));

    ```


    Like rest parameters for function signatures, usage of the rest pattern for destructuring
    **must** be the last assignment.


    As we can see, this proves to be extremely useful in recursive algorithms^([^(34)](#fn34)):


    - ① Edge case detection

    - ② Extract the elements we are interested in

    - ③ Recurse if we need to


    ```javascript

    const or = (...args) => {

    if (args.length === 0) return null;

    if (args.length === 1) return args[0]; ①

    const [first, ...rest] = args; ②

    return first || or(...rest); ③

    };

    console.assert(or(null, undefined, true, false, ''1''));

    console.assert(!or(null, undefined, false));

    ```


    Finally, array destructuring can be used with nested arrays. Again, we can remark
    upon the symmetry between assignment and construction:


    - ① Default an internal array look up in case the index lookup fails

    - ② Nested destructuring


    ```javascript

    const ticTacToe = [

    [''x'', ''o'',  ''x''],

    [''o'', ''x'', ''o''],

    [''x'', ''o'', ''x''],

    ];

    const [

    [cell01] = [],

    [, cell11] = [],

    [, , cell22] = [], ①

    ] = ticTacToe; ②

    console.assert(cell01 === ''x'');

    console.assert(cell11 === ''x'');

    console.assert(cell22 === ''x'');

    ```


    This example highlights a tripping hazard. If we are to recall our earlier discussion,
    looking up an index that an array does **not** possess results in an `undefined`.
    This may be acceptable if the value we seek is at the top level; however, this
    **will** result in an error if this is a nested lookup. Considering we are attempting
    to destruct `undefined`, this makes sense. The sanity check here might be to default
    the value of the entire (nested) lookup prior to destructuring it as demonstrated
    here.


    One use-case for destructuring arrays is allow us to pretend that a function `return`s
    more than one value:


    - ① `return` an array (or a tuple in this case)

    - ② Destructure to get multiple values out from the return


    ```javascript

    const distanceAndSlope = ([x1, y1], [x2, y2]) => {

    const distance = Math.hypot(x2 - x1, y2 - y1);

    const slope = (y2 - y1) / (x2 - x1);

    return [distance, slope]; ①

    };

    const [dist, slope] = distanceAndSlope([4, 3], [10, 12]); ②

    console.assert(Number.parseFloat(dist.toFixed(2)) === 10.82);

    console.assert(slope === 1.5);

    ```


    There are many methods in JavaScript that return an array (`RegExp.split` comes
    to mind), and array destructuring gives us a convenient and an eloquent way to
    use the result set of such functions.


    Array destructuring is often used for destructing rest parameters. As we have
    seen, rest parameters capture all the “extra” arguments into an array, which is
    spreadable. This is particularly useful if we wish to treat the first element
    in the rest parameters arrays separately from the others. We often see this in
    recursive solutions, as seen here:


    - ① Terminating case

    - ② The essence of “flatten”-ing an array


    ```javascript

    const flatten = ([first, ...rest]) => {

    if (first === undefined) return []; ①

    return !Array.isArray(first)

    ? [first, ...flatten(rest)]

    : [...flatten(first), ...flatten(rest)]; ②

    };

    const flattened = flatten([

    [1, 2],

    [3], 4, 5, [6, 7],

    ]);

    console.assert(flattened.length === 7);

    console.assert(flattened.join() === ''1,2,3,4,5,6,7'');

    ```


    We leverage the fact that if there are no rest parameters supplied, then destructuring
    will result in all elements being evaluated as `undefined`. That acts as the terminating
    case for recursion, else we continue with the recursion.


    Aside from the clever use of destructuring and the spread operator, this example
    highlights how the new syntax introduced in ES6 allows us to approach functional
    programming idiomatically in JavaScript. Given a situation to flatten an array,
    our logical approach would be look at the first element in the array; if it happens
    to be an array itself, start by flattening that array, followed by flattening
    the remaining elements of the original array. This algorithm is revealed as-is
    in our approach. Without imperative loops, and unnecessary counters, our true
    intent is revealed in plain sight.'
