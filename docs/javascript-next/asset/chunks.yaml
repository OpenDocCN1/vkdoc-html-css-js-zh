    // prints ''[ 12, -3, 15, 44, 15, 36 ]''

    console.log(arr); ②

    // prints ''12 -3 15 44 15 36''

    console.log(...arr); ③

    // to get the same result as we did with the spread operator

    let temp = ";

    for (const i in arr) {

    temp += arr[i];

    if (i != (arr.length - 1)) {

