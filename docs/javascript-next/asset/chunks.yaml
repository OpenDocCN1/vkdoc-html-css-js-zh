    *   ⑧ 对代理的多次调用返回同一个实例

    *   ⑨ 确保实例相同


    我们的代理创建函数期望将我们希望设为单例的对象的构造函数作为其唯一参数。我们的实现，除了捕获`construct`之外，相当简单——我们在创建单例时保存其局部引用，并在后续调用构造函数时直接返回相同的引用。正如我们所见，我们可以用这个简单的实现包装任何希望视为单例的构造函数。对代理构造函数的多次调用只会返回同一个实例。

    '
- fmt: "### Building a DSL\n\nFinally, let us see what it takes to build a simple\
    \ domain-specific language (DSL) using proxies. We will attempt to tackle a rather\
    \ popular domain, namely that of building XML markup. However, we will have to\
    \ take a shortcut; our DSL will only produce the necessary JSON that can be consumed\
    \ by a tool like FreeFormatter.com’s “JSON to XML Converter.”^([^(94)](#fn94))\
    \ This will allow us to keep our focus on leveraging proxies for such scenarios.\n\
    \nThis tool (by default) assumes that all attributes for elements are prefixed\
    \ by a `@`, and the element’s text be prefixed by `#`. Thus, given the following\
    \ snippet of JSON:\n\n```json\n{\n  \"books\": {\n    \"@count\": \"1\",\n   \
    \ \"book\": {\n      \"@id\": \"1\",\n      \"title\": {\n        \"@isbn\": \"\
    1590592395\",\n        \"#text\": \"Practical Common Lisp\"\n      }\n    }\n\
    \  }\n}\n```\n\nThe tool will produce the equivalent XML:\n\n```xml\n<books count=\"\
    1\">\n  <book id=\"1\">\n    <title isbn=\"1590592395\">Practical Common Lisp</title>\n\
    \  </book>\n</books>\n```\n\nThis is what our DSL^([^(95)](#fn95)) will look like:\n\
    \n```javascript\nconst books = jsonToXmlBuilder()\n.books({ count: '1' })\n.book({\
    \ id: '1' })\n.title({ isbn: '1590592395' }, 'Practical Common Lisp')\n.up()\n\
    .up()\n.end();\nconsole.log(books);\n// prints\n// {\n//   \"books\": {\n//  \
    \   \"@count\": \"1\",\n//       \"book\": {\n//       \"@id\": \"1\",\n//   \
    \      \"title\": {\n//         \"@isbn\": \"1590592395\",\n//         \"#text\"\
    : \"Practical Common Lisp\"\n//       }\n//     }\n//   }\n// }\n```\n\nOur DSL\
    \ has a few characteristics:\n\n- Elements are expressed as methods, and can be\
    \ nested.\n- Elements can be supplied with an object that represents its attributes,\
    \ and the text of the element.\n- The `up` method takes us back up to the parent\
    \ node so we can add additional child elements to the same parent if we desire\
    \ to do so.\n- The `end` method signals the end of the chain, and produces the\
    \ requisite JSON.\n\nExcited? Let’s get started! First, we will write a one-argument\
    \ helper function to build an element. This function, in turn returns a function,\
    \ that expects to be supplied the attributes and text for an element, and simply\
    \ constructs the necessary JSON to represent that element. This function `return`s\
    \ the proxy object itself, which will be in scope once we are done with our implementation.\
    \ Here is what our `ele`-ment builder looks like:\n\n1. Our function takes a target\
    \ object\n2. We loop over all attributes supplied, and tack it on the target\n\
    3. If the text is supplied, tack that on as well\n\n```javascript\nconst ele =\
    \ function(target) { // ①\n  return function (attrs = {}, text = '') {\n    for(const\
    \ [k, v] of Object.entries(attrs)) {\n      target[`@${k}`] = v; // ②\n    }\n\
    \    if(text) target['#text'] = text; // ③\n    // this will be in scope\n   \
    \ return proxy;\n  }\n}\n```\n\nOur `ele` function is rather simple—it accepts\
    \ a `target` object, then constructs a two-argument function that is eventually\
    \ returned. This newly constructed function expects two (optional) arguments—an\
    \ object representing the attributes for this element and the text. We loop over\
    \ the `entries` in the attributes object, tacking on each one on the target with\
    \ the prerequisite `@` prefix. If any text is supplied, that too is tacked on\
    \ to the target prefixed with `#`.\n\n*Assuming* we have something called proxy\
    \ in scope, we can use this function like so:\n\n1. Returns the inner function\n\
    2. Invoke the returned function with some attributes, and some text\n\n```javascript\n\
    const obj = {};\nconst builder = ele(obj); // ①\nbuilder({ isbn: '1590592395'\
    \ }, 'Practical Common Lisp'); // ②\n// prints '{ '@isbn': '1590592395', '#text':\
    \ 'Practical Common Lisp' }'\nconsole.log(obj);\n```\n\nAs we can see here, attributes\
    \ are to be supplied as an object, wherein each key-value entry represents an\
    \ attribute. This allows us to supply multiple attributes. The `ele` function\
    \ simply constructs a function (referenced by `builder`); this function in turn,\
    \ when invoked with attributes and some text, attaches the necessary metadata\
    \ onto the `target`.\n\nGreat! Now, we will write our proxy handler function.\n\
    \n1. If we are at the `end`, simply `stringify` the last element in the stack\n\
    2. If we are going `up`, then drop the top-most element\n3. Since `up` is a method,\
    \ upon invocation return the `proxy` itself\n4. Get the top-most element in the\
    \ stack\n5. Push the latest element on top of the stack\n6. Cater for an element\
    \ we have already seen\n7. Return the mechanism to adorn the latest element with\
    \ attributes and text\n\n```javascript\n// 'elements' is a stack of previously\
    \ constructed elements,\n// initialized with an empty object (the root)\n// Every\
    \ time we encounter a new element, we put it at the\n// top of the stack.\n//\
    \ Every time we encounter an 'up()', we drop the top-most entry\nconst handler\
    \ = {\n  get(target, property) {\n    if (property === 'end') {\n      return\
    \ () => JSON.stringify(elements.pop()); // ①\n    }\n    if (property === 'up')\
    \ {\n      elements.shift(); // ②\n      return () => proxy; // ③\n    }\n   \
    \ const [curParent] = elements; // ④\n    const child = {};\n    elements.unshift(child);\
    \ // ⑤\n    if(curParent[property]) { // ⑥\n      const existing = curParent[property];\n\
    \      if(Array.isArray(existing)) {\n        curParent[property] = [...existing,\
    \ child];\n      } else {\n        curParent[property] = [existing, child];\n\
    \      }\n    } else {\n      curParent[property] = child;\n    }\n    return\
    \ ele(child); // ⑦\n  },\n};\n```\n\nThere is a lot going on here, so let us take\
    \ it one step at a time. XML allows for nesting, permitting an element to have\
    \ any number of children. In order to track the “current” element (without losing\
    \ track of all of its parents) we maintain a stack, namely `elements`, that happens\
    \ to be an array of previously constructed elements. That is, the “root” element\
    \ will always be the *last* element in the array.\n\nWhen we encounter an `end()`\
    \ we simply `JSON.stringify` the last element in the array by invoking `pop`.\
    \ Note that invoking `end` results in the JSON string being returned, thereby\
    \ signaling the end of our DSL chain.\n\nWhenever the client invokes `up()` we\
    \ simply drop the *first* element in the stack, thereby making its “parent” the\
    \ element that will be affected by the next operation. Here we must be careful\
    \ to return the `proxy` to allow for a fluent API; this allows for the chaining\
    \ to continue.\n\nFinally, we get to the meat of our implementation. We get the\
    \ first element in the `elements` array using the destructuring syntax.^([^(96)](#fn96))\
    \ We construct a placeholder for the child element (an empty object) and insert\
    \ it at the top of the `elements` stack, thus making it the “current” element.\n\
    \nNext, we associate the child element to the parent using the `property` as its\
    \ key. However, XML allows a parent to have multiple child elements with the same\
    \ name. If that were to happen, we ensure that we wrap *all* of the children with\
    \ the same name in an array prior to associating it with the parent.\n\nSo now\
    \ that the parent is associated with an empty child (or an array of children)\
    \ with the `property` as its key, we simply return the mechanism to adorn the\
    \ child with attributes and text if the user chooses to do so.\n\nFinal step,\
    \ we wrap everything neatly in the `jsonToXmlBuilder` function. Note that the\
    \ wrapper function includes the definitions for `ele` and `handler`:\n\n```javascript\n\
    const jsonToXmlBuilder = () => {\n  // truncated for brevity\n  // const ele =\
    \ function(target) { get(target, property) { ... } }\n  // const handler = { ...\
    \ }\n  const root = {};\n  const elements = [root];\n  const proxy = new Proxy(root,\
    \ handler);\n  return proxy;\n};\n```\n\nWe start with an empty `root` element,\
    \ and place it as the first element in the `elements` stack. Next, we construct\
    \ the `proxy` object by invoking the `Proxy` constructor, supplying it the `root`\
    \ object, and the handler function, and return the proxy. We are done! Let’s give\
    \ it a spin and see how we did:"
  raw: '## Building a DSL


    Finally, let us see what it takes to build a simple domain-specific language (DSL)
    using proxies. We will attempt to tackle a rather popular domain, namely that
    of building XML markup. However, we will have to take a shortcut; our DSL will
    only produce the necessary JSON that can be consumed by a tool like FreeFormatter.com’s
    “JSON to XML Converter.”^([^(94)](#fn94)) This will allow us to keep our focus
    on leveraging proxies for such scenarios.


    This tool (by default) assumes that all attributes for elements are prefixed by
    a `@`, and the element’s text be prefixed by `#`. Thus, given the following snippet
    of JSON:


    ```

    {

    "books": {

    "@count": "1",

    "book": {

    "@id": "1",

    "title": {

    "@isbn": "1590592395",

    "#text": "Practical Common Lisp"

    }

    }

    }

    }

    ```


    The tool will produce the equivalent XML:


    ```


    Practical Common Lisp


    ```


    This is what our DSL^([^(95)](#fn95)) will look like:


    ```

    const books = jsonToXmlBuilder()

    .books({ count: ''1'' })

    .book({ id: ''1'' })

    .title({ isbn: ''1590592395'' }, ''Practical Common Lisp'')

    .up()

    .up()

    .end();

    console.log(books);

    // prints

    // {

    //   "books": {

    //     "@count": "1",

    //       "book": {

    //       "@id": "1",

    //         "title": {

    //         "@isbn": "1590592395",

    //         "#text": "Practical Common Lisp"

    //       }

    //     }

    //   }

    // }

    ```


    Our DSL has a few characteristics:


    *   Elements are expressed as methods, and can be nested.


    *   Elements can be supplied with an object that represents its attributes, and
    the text of the element.


    *   The up method takes us back up to the parent node so we can add additional
    child elements to the same parent if we desire to do so.


    *   The end method signals the end of the chain, and produces the requisite JSON.


    Excited? Let’s get started! First, we will write a one-argument helper function
    to build an element. This function, in turn returns a function, that expects to
    be supplied the attributes and text for an element, and simply constructs the
    necessary JSON to represent that element. This function `return`s the proxy object
    itself, which will be in scope once we are done with our implementation. Here
    is what our `ele`-ment builder looks like:


    *   ① Our function takes a target object


    *   ② We loop over all attributes supplied, and tack it on the target


    *   ③ If the text is supplied, tack that on as well


    ```

    const ele = function(target) { ①

    return function (attrs = {}, text = '''') {

    for(const [k, v] of Object.entries(attrs)) {

    target[`@${k}`] = v; ②

    }

    if(text) target[''#text''] = text; ③

    // this will be in scope

    return proxy;

    }

    }

    ```


    Our `ele` function is rather simple—it accepts a `target` object, then constructs
    a two-argument function that is eventually returned. This newly constructed function
    expects two (optional) arguments—an object representing the attributes for this
    element and the text. We loop over the `entries` in the attributes object, tacking
    on each one on the target with the prerequisite `@` prefix. If any text is supplied,
    that too is tacked on to the target prefixed with `#`.


    *Assuming* we have something called proxy in scope, we can use this function like
    so:


    *   ① Returns the inner function


    *   ② Invoke the returned function with some attributes, and some text


    ```

    const obj = {};

    const builder = ele(obj); ①

    builder({ isbn: ''1590592395'' }, ''Practical Common Lisp''); ②

    // prints ''{ ''@isbn'': ''1590592395'', ''#text'': ''Practical Common Lisp''
    }''

    console.log(obj);

    ```


    As we can see here, attributes are to be supplied as an object, wherein each key-value
    entry represents an attribute. This allows us to supply multiple attributes. The
    `ele` function simply constructs a function (referenced by `builder`); this function
    in turn, when invoked with attributes and some text, attaches the necessary metadata
    onto the `target`.


    Great! Now, we will write our proxy handler function.


    *   ① If we are at the `end`, simply `stringify` the last element in the stack


    *   ② If we are going `up`, then drop the top-most element


    *   ③ Since `up` is a method, upon invocation return the `proxy` itself


    *   ④ Get the top-most element in the stack


    *   ⑤ Push the latest element on top of the stack


    *   ⑥ Cater for an element we have already seen


    *   ⑦ Return the mechanism to adorn the latest element with attributes and text


    ```

    // ''elements'' is a stack of previously constructed elements,

    // initialized with an empty object (the root)

    // Every time we encounter a new element, we put it at the

    // top of the stack.

    // Every time we encounter an ''up()'', we drop the top-most entry

    const handler = {

    get(target, property) {

    if (property === ''end'') {

    return () => JSON.stringify(elements.pop()); ①

    }

    if (property === ''up'') {

    elements.shift(); ②

    return () => proxy; ③

    }

    const [curParent] = elements; ④

    const child = {};

    elements.unshift(child); ⑤

    if(curParent[property]) { ⑥

    const existing = curParent[property];

    if(Array.isArray(existing)) {

    curParent[property] = [...existing, child];

    } else {

    curParent[property] = [existing, child];

    }

    } else {

    curParent[property] = child;

    }

    return ele(child); ⑦

    },

    };

    ```


    There is a lot going on here, so let us take it one step at a time. XML allows
    for nesting, permitting an element to have any number of children. In order to
    track the “current” element (without losing track of all of its parents) we maintain
    a stack, namely `elements`, that happens to be an array of previously constructed
    elements. That is, the “root” element will always be the *last* element in the
    array.


    When we encounter an `end()` we simply `JSON.stringify` the last element in the
    array by invoking `pop`. Note that invoking `end` results in the JSON string being
    returned, thereby signaling the end of our DSL chain.


    Whenever the client invokes `up()` we simply drop the *first* element in the stack,
    thereby making its “parent” the element that will be affected by the next operation.
    Here we must be careful to return the `proxy` to allow for a fluent API; this
    allows for the chaining to continue.


    Finally, we get to the meat of our implementation. We get the first element in
    the `elements` array using the destructuring syntax.^([^(96)](#fn96)) We construct
    a placeholder for the child element (an empty object) and insert it at the top
    of the `elements` stack, thus making it the “current” element.


    Next, we associate the child element to the parent using the `property` as its
    key. However, XML allows a parent to have multiple child elements with the same
    name. If that were to happen, we ensure that we wrap *all* of the children with
    the same name in an array prior to associating it with the parent.


    So now that the parent is associated with an empty child (or an array of children)
    with the `property` as its key, we simply return the mechanism to adorn the child
    with attributes and text if the user chooses to do so.


    Final step, we wrap everything neatly in the `jsonToXmlBuilder` function . Note
    that the wrapper function includes the definitions for `ele` and `handler`:


    ```

    const jsonToXmlBuilder = () => {

    // truncated for brevity

    // const ele = function(target) { get(target, property) { ... } }

    // const handler = { ... }

    const root = {};

    const elements = [root];

    const proxy = new Proxy(root, handler);

    return proxy;

    };

    ```


    We start with an empty `root` element, and place it as the first element in the
    `elements` stack. Next, we construct the `proxy` object by invoking the `Proxy`
    constructor, supplying it the `root` object , and the handler function, and return
    the proxy. We are done! Let’s give it a spin and see how we did:'
  trans: "\n### 构建领域特定语言\n\n最后，让我们看看如何使用代理构建一个简单的领域特定语言（DSL）。我们将尝试处理一个相当流行的领域，即构建\
    \ XML 标记。不过，我们需要走一条捷径；我们的 DSL 只会生成必要的 JSON，以供诸如 FreeFormatter.com 的“JSON 到 XML\
    \ 转换器”之类的工具使用。^(⁹⁴) 这让我们能够专注于将代理应用于此类场景。\n\n该工具（默认情况下）假定元素的所有属性都以 `@` 为前缀，元素的文本则以\
    \ `#` 为前缀。因此，给定以下 JSON 片段：\n\n```json\n{\n  \"books\": {\n    \"@count\": \"1\"\
    ,\n    \"book\": {\n      \"@id\": \"1\",\n      \"title\": {\n        \"@isbn\"\
    : \"1590592395\",\n        \"#text\": \"Practical Common Lisp\"\n      }\n   \
    \ }\n  }\n}\n```\n\n该工具将生成对应的 XML：\n\n```xml\n<books count=\"1\">\n  <book id=\"\
    1\">\n    <title isbn=\"1590592395\">Practical Common Lisp</title>\n  </book>\n\
    </books>\n```\n\n这就是我们的 DSL^(⁹⁵) 的样子：\n\n```javascript\nconst books = jsonToXmlBuilder()\n\
    .books({ count: '1' })\n.book({ id: '1' })\n.title({ isbn: '1590592395' }, 'Practical\
    \ Common Lisp')\n.up()\n.up()\n.end();\nconsole.log(books);\n// 输出\n// {\n// \
    \  \"books\": {\n//     \"@count\": \"1\",\n//       \"book\": {\n//       \"\
    @id\": \"1\",\n//         \"title\": {\n//         \"@isbn\": \"1590592395\",\n\
    //         \"#text\": \"Practical Common Lisp\"\n//       }\n//     }\n//   }\n\
    // }\n```\n\n我们的 DSL 具有以下特点：\n\n- 元素被表达为方法，并且可以嵌套。\n- 元素可以附带一个代表其属性的对象，以及元素的文本。\n\
    - `up` 方法让我们返回到父节点，这样我们就可以根据需要向同一个父节点添加额外的子元素。\n- `end` 方法标志着链式调用的结束，并生成所需的 JSON。\n\
    \n兴奋吗？让我们开始吧！首先，我们将编写一个单参数辅助函数来构建一个元素。这个函数依次返回一个函数，该函数期望接收元素的属性和文本，并简单地构造必要的 JSON\
    \ 来表示该元素。这个函数 `return` 代理对象本身，一旦我们完成实现，该代理对象就处于作用域内。以下是我们 `ele`-ment 构建器的样子：\n\
    \n1. 我们的函数接收一个目标对象\n2. 我们遍历提供的所有属性，并将其附加到目标对象上\n3. 如果提供了文本，也将其附加到目标对象上\n\n```javascript\n\
    const ele = function(target) { // ①\n  return function (attrs = {}, text = '')\
    \ {\n    for(const [k, v] of Object.entries(attrs)) {\n      target[`@${k}`] =\
    \ v; // ②\n    }\n    if(text) target['#text'] = text; // ③\n    // 代理对象将处于作用域内\n\
    \    return proxy;\n  }\n}\n```\n\n我们的 `ele` 函数相当简单——它接收一个 `target` 对象，然后构造一个两参数函数并最终返回。这个新构造的函数期望两个（可选）参数——一个代表此元素属性的对象和文本。我们遍历属性对象中的\
    \ `entries`，将每个条目以必需的 `@` 前缀附加到目标对象上。如果提供了任何文本，也将其以 `#` 为前缀附加到目标对象上。\n\n*假设* 作用域内有一个叫做\
    \ proxy 的对象，我们可以像这样使用这个函数：\n\n1. 返回内部函数\n2. 用一些属性和一些文本调用返回的函数\n\n```javascript\n\
    const obj = {};\nconst builder = ele(obj); // ①\nbuilder({ isbn: '1590592395'\
    \ }, 'Practical Common Lisp'); // ②\n// 输出 '{ '@isbn': '1590592395', '#text':\
    \ 'Practical Common Lisp' }'\nconsole.log(obj);\n```\n\n正如我们在这里看到的，属性应作为一个对象提供，其中的每个键值对代表一个属性。这允许我们提供多个属性。`ele`\
    \ 函数简单地构造一个函数（由 `builder` 引用）；当这个函数被调用时，它接收属性和一些文本，然后将必要的元数据附加到 `target` 上。\n\n\
    很好！现在，我们将编写我们的代理处理器函数。\n\n1. 如果遇到 `end`，只需 `stringify` 栈中的最后一个元素\n2. 如果遇到 `up`，则丢弃栈顶元素\n\
    3. 由于 `up` 是一个方法，调用时返回 `proxy` 本身\n4. 获取栈顶元素\n5. 将最新元素压入栈顶\n6. 处理已经见过的元素\n7. 返回用于装饰最新元素的机制，包括属性和文本\n\
    \n```javascript\n// 'elements' 是先前构造的元素的栈，\n// 用一个空对象（根对象）初始化\n// 每当我们遇到一个新元素，就将其放在\n\
    // 栈顶。\n// 每当我们遇到 'up()'，就丢弃栈顶条目\nconst handler = {\n  get(target, property) {\n\
    \    if (property === 'end') {\n      return () => JSON.stringify(elements.pop());\
    \ // ①\n    }\n    if (property === 'up') {\n      elements.shift(); // ②\n  \
    \    return () => proxy; // ③\n    }\n    const [curParent] = elements; // ④\n\
    \    const child = {};\n    elements.unshift(child); // ⑤\n    if(curParent[property])\
    \ { // ⑥\n      const existing = curParent[property];\n      if(Array.isArray(existing))\
    \ {\n        curParent[property] = [...existing, child];\n      } else {\n   \
    \     curParent[property] = [existing, child];\n      }\n    } else {\n      curParent[property]\
    \ = child;\n    }\n    return ele(child); // ⑦\n  },\n};\n```\n\n这里有很多内容，所以我们一步一步来。XML\
    \ 允许嵌套，一个元素可以拥有任意数量的子元素。为了跟踪“当前”元素（同时不丢失其所有父元素的踪迹），我们维护了一个栈，即 `elements`，它是一个由先前构造的元素组成的数组。也就是说，“根”元素将始终是数组中的*最后一个*元素。\n\
    \n当我们遇到 `end()` 时，我们通过调用 `pop` 简单地 `JSON.stringify` 数组中的最后一个元素。注意，调用 `end` 会返回\
    \ JSON 字符串，从而标志着我们的 DSL 链式调用的结束。\n\n每当客户端调用 `up()` 时，我们简单地丢弃栈中的*第一个*元素，从而使其“父”元素成为下一个操作将影响的元素。这里我们必须小心地返回\
    \ `proxy`，以实现流畅的 API；这允许链式调用继续进行。\n\n最后，我们来到实现的核心部分。我们使用解构语法获取 `elements` 数组中的第一个元素。^(⁹⁶)\
    \ 我们为子元素构造一个占位符（一个空对象），并将其插入到 `elements` 栈的顶部，从而使其成为“当前”元素。\n\n接下来，我们使用 `property`\
    \ 作为键，将子元素关联到父元素。然而，XML 允许一个父元素拥有多个同名子元素。如果发生这种情况，我们确保在将*所有*同名的子元素关联到父元素之前，将它们包装在一个数组中。\n\
    \n现在，父元素已经与一个空子元素（或一个子元素数组）关联，以 `property` 为其键，我们只需返回一种机制，以便用户在需要时用属性和文本来装饰子元素。\n\
    \n最后一步，我们将所有内容整齐地包装在 `jsonToXmlBuilder` 函数中。请注意，包装函数包含了 `ele` 和 `handler` 的定义：\n\
    \n```javascript\nconst jsonToXmlBuilder = () => {\n  // 为简洁起见省略了部分内容\n  // const\
    \ ele = function(target) { get(target, property) { ... } }\n  // const handler\
    \ = { ... }\n  const root = {};\n  const elements = [root];\n  const proxy = new\
    \ Proxy(root, handler);\n  return proxy;\n};\n```\n\n我们从一个空的 `root` 元素开始，并将其作为\
    \ `elements` 栈中的第一个元素。接下来，我们通过调用 `Proxy` 构造函数来构造 `proxy` 对象，向其提供 `root` 对象和处理器函数，然后返回代理对象。大功告成！让我们来试一下，看看效果如何：\n"
