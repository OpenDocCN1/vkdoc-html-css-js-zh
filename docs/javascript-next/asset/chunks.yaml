- fmt: '# The for-of Loop


    ES6 introduces a brand-new looping mechanism, namely the `for-of` loop, the immediate
    benefit of which can be easily demonstrated:


    - ① Define an array

    - ② Use the `for-of` loop

    - ③ Print each of the items in the array


    ```

    const arr = [''a'', ''b'', ''c'']; ①

    for (const k of arr) { ②

    // prints ''a'', ''b'', ''c'' in sequence

    console.log(k); ③

    }

    ```


    Let us pause and admire the elegance of the `for-of` loop. Gone is the imperatively
    indexed `for` loop. No need for the `for-in` loop either. All that remains is
    true intent of the code—iterate over an array to get each *element* of the array
    in sequence!


    This works because the `for-of` loop can iterate over anything that happens to
    be “iterable,” and arrays happen to be iterable in ES6. That is, they present
    a canonical API for iteration that allows the `for-of` loop to get every element
    in the array in the correct sequence.


    And it does not end there—maps, sets, and strings all happen to be iterable, so
    we can use the `for-of` loop with all of them:


    - ① Considering we get a key-value pair back per iteration, we can use array destructuring


    ```

    const array = [10, 20, 30, 40, 50];

    for (const i of array) {

    console.log(i);

    }

    const set = new Set([''a'', ''set'', true, false]);

    for (const i of set) {

    console.log(i);

    }

    const map = new Map([

    [''s'', ''is a string''],

    [true, ''is a boolean''],

    ]);

    for (const [k, v] of map) { ①

    console.log(`${k}->${v}`);

    }

    const string = ''ES6 is awesome!'';

    for (const i of string) {

    console.log(i);

    }

    ```


    Turns out, any object or collection can participate in the `for-of` loop, as long
    as it conforms to the iterable protocol. Let us see what it means to be iterable
    in JavaScript.


    ## Iterables and Iterators


    Statically typed languages like Java provide us with an interface called `Iterator`.
    An interface is a contract, that mandates that an object expose a specific API,
    and one that is enforced by the runtime. In Java, any object that “implements”
    the `Iterator` interface essentially declares to the world that it can be iterated
    upon. Similarly, dynamically typed languages like Ruby have the *idea* of a contract,
    essentially via convention.


    Regardless of the type of language, whether static or dynamic, they offer a way
    to mark an object as being iterable, allowing consumers to access individual elements
    of that object in a standard way, and without having the need for the object to
    expose any of its internal implementation details. Furthermore, since accessing
    the elements is using a contract of some sort, the language itself can provide
    additional constructs (like Java’s enhanced `for` loop) that utilizes the same
    mechanism for looping.


    Typically, to be iterable, the object (or collection) **must** implement an API
    declaring itself to be such (e.g., in Java the object must implement the `Iterator`
    interface), and consequently, be able to answer two questions:


    - Do I have any more elements?

    - If so, what is that element?


    JavaScript announced similar support for objects and collections to be made iterable
    in ES6. However, JavaScript being an interpreted language has no runtime enforcement
    of a contract, rather, JavaScript imposes the behavior via convention. This convention
    is as follows—for any object to be iterable, it must have a method name that evaluates
    to `Symbol.iterator` (yet another well-known symbol). The return value of this
    method **must** be an object that has a zero arity (i.e., no arguments) `next`
    method, which in turn returns an object with two properties:


    - `done`—a boolean that answers whether there are any more elements that could
    be iterated upon

    - `value`—the current item


    We can make things a little clearer with a simple example:


    - ① Define a simple object

    - ② Implement the `Symbol.iterator` method

    - ③ The iterator method returns the iterable

    - ④ The iterable implements the `next` method

    - ⑤ If we are done iterating signal `done` as `true`

    - ⑥ If we are not `done`, return the `value`

    - ⑦ Grab a reference to the iterator

    - ⑧ Start iterating


    ```

    const arrayList = { ①

    data: [1, 2, 3, 4, 5],

    [Symbol.iterator]() { ②

    let index = 0;

    return { ③

    next: () => { ④

    if (index === this.data.length) {

    return {

    done: true, ⑤

    };

    }

    const ret = this.data[index];

    index++;

    return {

    done: false,

    value: ret,

    }; ⑥

    },

    };

    },

    };

    const iterator = arrayList[Symbol.iterator](); ⑦

    // prints ''{ done: false, value: 1 }''

    console.log(iterator.next()); ⑧

    ```


    We make an attempt to implement an iterable arraylist here. Since we are to adhere
    to the iterability protocol, we implement a method with the name `Symbol.iterator`.
    The iterator method, when invoked, returns a new object that performs the iteration
    for us.


    Note that the return value of any invocation on `next` returns an object that
    appropriately has the `done` flag set, as well as the `value` if needed.


    Now that we have a handle on what an implementation might look like, let us tease
    apart the moving parts. Iteration in JavaScript consists of two (or three depending
    on how you look at it) different pieces:


    - The object that is “iterable,” that is, the object that has the `Symbol.iterator`
    method

    - The object that is *returned* from invoking the iterator method, the “iterator”
    which in turn has the `next` method on it


    Finally, there is the result of the `next` invocation, which we may consider as
    part of the iterator contract, or simply the iterator result. We are done! Our
    `arrayList` successfully implements all the pieces needed to make it iterable.
    Now, we can make use of the `for-of` loop to iterate over it, just like we can
    with arrays. Observe:


    ```

    // use the arrayList implementation from our earlier example

    for (const v of arrayList) {

    // prints // 1, 2, 3, 4, 5 in sequence

    console.log(v);

    }

    ```


    All this boils down to JavaScript now having a canonical API that any client can
    safely use to iterate over our objects!


    ### Cleaning Up


    We know that iterators need implement the `next` method. This method, upon reaching
    the end of the iterable object, can do any cleanup that is necessary, just prior
    to signaling the end via `{ done: true }`.


    However, what happens if the consumer were to stop the iteration prematurely?
    Well, iterators can (optionally) implement a `return` method, which will be invoked
    if the consumer terminates the iteration. Consider the following:


    - ① Implement both the required `next` and optional `return` method

    - ② Break out prematurely in a `for-of` loop


    ```

    const incrementor = {

    [Symbol.iterator]() {

    let start = 0;

    return {

    next() {

    return {

    value: start++,

    done: false,

    };

    },

    return: function () { ①

    console.log(''Cleaning up ...'');

    return {

    done: true,

    };

    },

    };

    },

    };

    for (const v of incrementor) {

    if (v > 10) {

    break; ②

    }

    console.log(v);

    }

    ```


    Here we have a simple incrementing iterable that happens to implement both the
    `next` and the `return` method. We use our new friend, the `for-of` loop to start
    iterating over our object, and conditionally `break` out of the loop. If we were
    to run this example, we will see the cleaning message show in our console. Notice
    that we return a `done: true` to signal that the iterator is now done.


    This mechanism is a side effect of the `for-of` loop knowing the iterator machinery—furthermore,
    it’s not only `break`, but `throw`-ing an error *inside* the `for-of` loop as
    well as `return`-ing from within a `for-of` loop that will invoke the iterator’s
    `return` method.


    If we were invoking the `next` method explicitly, then it is required that we
    call `return` when we are done.'
