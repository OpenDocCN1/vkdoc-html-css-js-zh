  trans: "\n# 在结构化与解构之间寻求对称性\n\nJavaScript 为我们提供了两种类似集合的对象——数组和键值对对象。^(²⁵) 使用 `Object`\
    \ 构造函数、`Object.create` 或字面量对象语法（即 `{}`）创建的对象都是 `Object` 的实例。它们可以被视为关联数组或字典对象。对象本质上是一组键值对。如果要求对象查找某个键的值，它将返回与该键关联的值，如果该键在对象中不存在，则返回\
    \ `undefined`。\n\n另一方面，数组提供了一种顺序数据结构，具有高效的随机元素查找功能。JavaScript 中的数组是 `Array` 类型的实例，它们同样具有关联性，只不过它们的键是整数，并且只能是作为它们所指向条目的索引的整数。\n\
    \n对象和数组都为我们提供了*“深入”*访问它们的方式。对象提供了“点”表示法，允许我们获取自身内部某个键关联的值，以及“括号”（或“下标”）表示法（即 `[]`）也能达到同样效果。而数组只提供括号表示法作为在数组中*特定*索引处查找元素的手段。与对象非常相似，查找数组中**不**存在的索引会返回\
    \ `undefined`。\n\n对象和数组都可以嵌套，通常相互嵌套。这可能导致相当复杂的查找，迫使开发者内联变量来解释他们试图实现的目标。请看：\n\n\
    - ① 使用明显的语法\n- ② 重构代码以使意图更清晰\n- ③ 如果地址对象**没有** `zip` 属性会发生什么？\n\n```\nconst user\
    \ = {\n  name: 'douglas',\n  profession: 'developer',\n  address: {\n    street1:\
    \ '1 Ad Infinitum Drive',\n    street2: '',\n    city: 'Cupertino',\n    state:\
    \ 'CA',\n    zip: [\n      '95014',\n      '1234',\n    ],\n  },\n};\nconst zipCode\
    \ = user.address.zip[0] + '-' + user.address.zip[1]; ①\nconsole.assert(zipCode\
    \ === '95014-1234');\n// 重构后的版本\nconst zip = user.address.zip; ②\nconst code =\
    \ zip[0]; ③\nconst extended = zip[1];\nconst final = code + '-' + extended;\n\
    console.assert(final === '95014-1234');\n```\n\n思考一下，如果我们没有创建原始对象，而是获得了它的一个引用，我们如何确定其结构。我们必须进行一些脑力体操，通过逆向解析查找过程来“重建”原始对象的结构。当函数期望接收一个对象或数组时，这更加令人沮丧——作为调用者，如果不查看函数实现或阅读文档，根本无法判断该函数真正关心参数的哪些“部分”。\n\
    \n雪上加霜的是，这种语法在沿途并没有提供任何 `undefined` 检查机制！如果中间某个属性的查找失败，这种失败会级联影响到所有依赖该属性值的内容。一些语言提供了“安全导航”运算符，或者在查找失败时设置默认值的方式，但可惜的是，JavaScript\
    \ 对这两种方式都不支持。\n\n核心问题在于我们定义对象和数组（创建*结构*）的方式与访问它们（*解构*它们）以获取特定值的方式之间缺乏对称性。如果查找语法能够镜像构造语法，那么“重新组装”原始对象（或数组）将变得轻而易举，因为赋值语句的左侧将和右侧一样具有表现力。\n\
    \n解构支持缺失的另一个方面是无法展开或“打散”对象；换句话说，就是获取集合中的**所有**条目，无论是数组的元素还是对象中的键值对。开发者不得不强行遍历整个集合，无论是显式地使用\
    \ `for` 循环，还是隐式地使用像 `forEach` 这样的方法，这两者都有很大的改进空间。\n\n进入展开运算符和新的解构语法。我们将从展开运算符开始，然后是解构语法。\n\
    \n## 数组的展开运算符\n\n考虑一个简单的用例——一个计算三角形周长的函数和一个存储各边边长的数组。让我们看看如何将两者结合使用：\n\n- ① 我们从一个数组开始\n\
    - ② 我们提取数组中的每一个元素提供给函数\n\n```\nconst perimeter = (a, b, c) => a + b + c;\nconst\
    \ sides = [9, 8, 3]; ①\n// 打印 20\nconsole.log(perimeter(sides[0], sides[1], sides[2]));\
    \ ②\n```\n\n鉴于函数期望三个参数，我们被迫使用下标表示法从数组中分解出这些值。这感觉很繁琐。理想的情况是我们可以将数组的各个元素作为参数“应用”到函数中。\n\
    \n好吧，现在我们可以了！我们现在可以使用展开运算符，它通过 `...` 语法来表达。观察同样的例子是如何变成下面这样的：\n\n- ① 我们从一个数组开始\n\
    - ② 我们使用展开运算符将数组的所有元素提供给函数\n\n```\nconst perimeter = (a, b, c) => a + b + c;\n\
    const sides = [9, 8, 3]; ①\n// 打印 20\nconsole.log(perimeter(...sides)); ②\n```\n\
    \n演示的展开运算符语法使用 `...` 作为其语法结构。它接收一个数组，并将其“展开”为独立的元素，将每个元素作为单独的参数传递给函数。这立即消除了我们必须使用下标语法强制提取元素的需要。\n\
    \n在我们的代码中有几个地方允许使用展开运算符——首先，正如我们所见，是在函数调用时，其次，是在数组构建时，我们将在下一节中看到。\n"
- fmt: '### “Expanding” Upon the Nuances of the `Spread Operator`


    It will serve us best to first explore the spread operator in isolation. Consider
    our good friend `console.log`. `log` is a multi-arity function, in that, given
    `n` arguments it writes each value to the console delimited by whitespace. Let
    us simply use it to see the effects of the spread operator:


    -   ① We start with an array

    -   ② Simply print out the array—displays `[ 12, -3, 15, 44, 15, 36 ]`

    -   ③ Use the spread operator—displays `12 -3 15 44 15 36`

    -   ④ Simulate what the spread operator does for us with `console.log`


    ```

    const arr = [12, -3, 15, 44, 15, 36]; ①

    // prints ''[ 12, -3, 15, 44, 15, 36 ]''

    console.log(arr); ②

    // prints ''12 -3 15 44 15 36''

    console.log(...arr); ③

    // to get the same result as we did with the spread operator

    let temp = ";

    for (const i in arr) {

    temp += arr[i];

    if (i != (arr.length - 1)) {

    temp += '' '';

    }

    }

    console.assert(temp === ''12 -3 15 44 15 36''); ④

    ```


    As we might conclude, invoking `console.log` with an array *is* invoking it with
    **one** argument. However, invoking it with the spread operator acting on an array
    invokes with `n` arguments, where `n` is the length of the array.


    The contrast is even more stark when we consider how we would have gone about
    printing *each* element of array to a space delimited string. Without the spread
    operator, we have no choice but to imperatively loop over the array, each time
    concatenating to a temporary string, which we would then pass to `console.log`.


    The spread operator allows us to shift from an imperative mindset, where our intent
    is often lost amidst `for` loops and ceremony, to expressing our intent in a clear
    manner.


    A pervasive use-case for the spread operator is one of concatenating arrays. Bear
    in mind that arrays have a `push` method available on them which adds items to
    the end of the array. Turns out `push` too is a multi-arity function. However,
    much like some of the `Math` operators, and `console.log`, this method is of little
    use if we wished to concatenate all the elements of one array to that of another.^([^(26)](#fn26))


    Another use-case for the spread operator is that of creating new arrays from existing
    ones. Let us study both these use-cases now:


    -   ① Use the spread operator to copy an array into a new array

    -   ② We start with three arrays

    -   ③ `push` mutates the array in place

    -   ④ Create a *new* array concatenating elements, and an array

    -   ⑤ Create another array concatenating two arrays


    ```

    const one = [12, -3, 15];

    const otherOne = [...one]; ①

    const two = [44, 15, 36]; ②

    // mutation

    one.push(...two); ③

    console.log(one);

    // alternatively inline the concatenation

    const concatenated = [12, -3, 15, ...two]; ④

    // prints ''[ 12, -3, 15, 44, 15, 36 ]''

    console.log(concatenated);

    // create a new array

    const newArr = [...otherOne, ...two]; ⑤

    // prints ''[ 12, -3, 15, 44, 15, 36 ]''

    console.log(newArr);

    ```


    We start with an array, and create a new one by exploding the first one inside
    the literal array notation (`[]`) of a new array. In other words, `otherOne` is
    a new array containing the same elements as our initial one.


    The `push` method on `Array`, like `console.log`, happens to be a multi-arity
    method. So, we can easily push multiple elements from one array onto another,
    once again, using the spread operator. However, `push` performs a mutation, in
    that it changes the original array. However, functional programming encourages
    immutability, and if that is *our* intent, the spread operator is an ally.^([^(27)](#fn27))


    One nuance of the spread operator is that is does **not** perform a “flatten.”
    If we spread an array of arrays, the end result will be the individual constituent
    arrays. The spread operator does not recursively explode the nested arrays.


    The underlying machinery that makes the spread operator work relies on arrays
    being “iterable.” We will cover iterables and iterators shortly; however it suffices
    to say that arrays abide by the iterator contract, thus enabling them to be used
    with the spread operator. Strings, Maps, and Sets (we will see those shortly as
    well) are also iterables, and thus can be spread.^([^(28)](#fn28))


    The biggest benefit of using the spread operator to construct new arrays is often
    the most overlooked one, in that, its syntax forces us to explode existing arrays
    into a new array. We could achieve the same behavior by `push`-ing existing arrays
    onto an empty array, but that is not the intent of the `push` API. Rather, it
    is to mutate an existing array, which goes against the grain of functional programming.


    #### Spread vs. Rest—Polar Opposite Twins


    One will have observed that the syntax for the rest parameter and the spread operator
    is identical, but their behavior is the exact opposite of one another. The rest
    parameter “collects” all the unaccounted arguments supplied to a function *into*
    an array, while the spread operator extracts all the elements *out* of an array.
    What differentiates what the `...` syntax does depends on the invocation context.
    `...` only acts as the rest parameter when an assignment happens, and if not,
    then it acts as a spread operator. This contradiction can be both interesting
    and disconcerting at the same time:


    -   ① Sort the rest arguments prior to appending the whole array in the return
    value

    -   ② Sort the rest arguments, and explode it to append its elements in the return
    value


    ```

    const onlyRest = (teacher, ...students) => {

    return [teacher, students.sort()]; ①

    };

    const restAndSpread = (teacher, ...students) => {

    return [teacher, ...students.sort()]; ②

    };

    // prints ''[ ''Ada'', [ ''Carol'', ''Grace'', ''Mary'' ] ]''

    console.log(onlyRest(''Ada'', ''Mary'', ''Carol'', ''Grace''));

    // prints ''[ ''Ada'', ''Carol'', ''Grace'', ''Mary'' ]''

    console.log(restAndSpread(''Ada'', ''Mary'', ''Carol'', ''Grace''));

    ```


    We start by defining two multi-arity functions, both of which expect the name
    of the teacher, followed by n-number of names of students. Given that both functions
    declare a rest parameter, all arguments past the teacher are automatically bundled
    into an array. Both functions also proceed to `sort` the students’ array prior
    to constructing the return value, which also happens be an array. However, it
    is here that the implementations depart from one another. In the case of the first
    function, we simply construct a new array with the name of the teacher, and the
    result of `sort`-ing the student array, which returns an array. The result as
    one might expect is an array of two elements—the name of the teacher followed
    by an array with the student names sorted.


    However, in the second case, we *spread* the result of `sort` into the return
    value, thereby simply returning an array of strings, starting with the name of
    the teacher, followed by the names of the students sorted alphabetically. The
    difference between the two implementations is subtle; however the effect is profound.


    We will see another place where the rest parameter is applicable, namely in array
    destructuring—but first, spreading objects.


    ## Spread Operator for Objects


    Introduced in ES9, the `…` operator is also available for “spreading” objects.
    Much like the `…` operator we have seen for indexed collections, the `…` operator
    “explodes” an object into its individual key-value pairs. However, before we get
    into the details of the spreading objects, we must talk about the characteristics
    of object properties, specifically the `enumerable` descriptor.'
