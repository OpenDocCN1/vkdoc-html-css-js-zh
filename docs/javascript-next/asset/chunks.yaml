  trans: "\n# 引言\n\n你是否曾尝试在 JavaScript 中创建需要同时插入多个变量的动态字符串？我似乎总会在 `+` 和引号的使用上出错。更别提还要按照特定格式处理换行和缩进。而且，一旦写完，我们最好*永远*不要再去修改它，对吧？\n\
    \n在本章中，我们将永久告别字符串拼接，转而使用模板字符串。它允许我们以清晰且声明式的方式编排包含变量和表达式插值的字符串。我们还将探索标签函数，它可以用来在\
    \ JavaScript 中创建领域特定语言。我向你保证，在本章结束时，你会迫不及待地重构代码库中的所有字符串，以使用模板字符串。你甚至可能会获得一些关于如何快速创建自己的\
    \ DSL 的灵感！\n\n## 字符串拼接的麻烦\n\nJavaScript 提供了 `String` 原始类型，并支持使用单引号或双引号直接构造字符串。^(³⁵)\
    \ 然而，虽然这适用于构造静态字符串，但在以编程方式构建字符串时却相当麻烦。考虑以下情况：\n\n* ① 确保在有称呼时插入它\n* ② 组合全名，如果没有中间名则省略\n\
    \n```\nconst salutation = 'Mr.';\nconst name = 'Edgar';\nconst middle = 'Allen';\n\
    const last = 'Poe';\nconst fullName = (salutation ? salutation + ' ' : \") ①\n\
    + name + ' ' + middle.trim() + ' ' + last; ②\n// 输出 'Mr. Edgar Allen Poe'\nconsole.log(fullName);\n\
    ```\n\n如我们所见，当我们试图区分字符串中的“静态”或固定部分，以及“动态”或变量部分时，我们想要实现的目标意图已经丢失。当然，如果动态部分恰好包含函数或方法调用、条件语句或循环结构，这个问题会进一步加剧。\n\
    \n许多现代 JavaScript（及单页应用）框架（如 Angular）允许我们将 HTML 嵌入到与 JavaScript（或 TypeScript）相同的文件中。HTML\
    \ 与我们的 JavaScript 代码一样，只有在正确格式化时才最容易编写，更重要的是易于维护。鉴于我们唯一可用的选项是字符串拼接，我们被迫参与插值和缩进的复杂操作^(³⁶)：\n\
    \n* ① 声明一个变量\n* ② 尝试使用字符串拼接构造一个相当复杂的字符串\n* ③ 在行内使用该变量\n\n```\nconst title = 'Section\
    \ Title'; ①\nfunction HelloComponent() { };\nHelloComponent.annotations = [new\
    \ ng.core.Component({\nselector: 'app-hello-world',\ntemplate: '' + ②\n'' +\n\
    '' +\n'' +\n'' +\n'' +\n'' + title + '' + ③\n'' +\n'' +\n'' +\n'' +\n'' +\n''\n\
    })];\n```\n\n优秀的程序员不会让朋友审查格式错误的代码。因此，我们不仅被迫使用 `+` 运算符换行，还需要确保代码正确缩进。然而，在这种情况下，我们的编辑器会将其视为\
    \ JavaScript，而没有意识到它实际上是嵌入在 JavaScript * 内部*的 HTML，如果被要求重新缩进所有代码，它会直接执行（如果它没有自动这样做的话！）。当然，这个问题几乎延伸到所有嵌入式\
    \ DSL，其中存在插值变量和格式的混淆。\n\n鉴于我们现有的工具，我们只能诉诸字符串拼接这种古老的插值机制，同时痛苦地在适当的行长度处按下 `Enter`\
    \ 键，希望我们的 linting 工具不会因为格式不正确的行太多而导致构建失败。\n\n好了，我们的烦恼结束了。ES6 引入了模板字面量，以及作为其扩展的带标签模板字面量。\n\
    \n## 模板字面量\n\n模板字面量引入了更多的语法，即反引号 `` ` `` 作为声明字符串的机制，以及占位符语法 `${}` 来支持变量和表达式的插值。模板字面量使得组合包含字面量字符串和将作为字符串创建一部分被求值的行内表达式变得更加容易。考虑以下情况：\n\
    \n* ① 引入一些常量占位符\n* ② 使用带有变量插值的模板字面量组合字符串\n\n```\nconst greeting = 'Hola'; ①\n\
    const name = 'Daniel';\nconst msg = `${greeting}! My name is ${name}`; ②\n```\n\
    \n模板字面量*真正地*编排了一个字符串，省去了通过精心放置 `+` 运算符而不得不绕的弯路。在 `${}` 内用于插值的命名恰当的变量有助于提高可读性。\n\
    \n插值语法接受任何表达式——无论是函数调用、数学运算，甚至是三元表达式。^(³⁷)\n\n模板字面量也可以用于编排多行字符串。如果以这种方式使用，它们会在求值时保留布局。鉴于许多现代编辑器和\
    \ IDE 已经支持 ES6 语法，让它们自动格式化你的代码意味着我们不再会丢失布局。让我们看看重新审视 Angular 组件示例时会是什么样子：\n\n\
    * ① 声明一个变量\n* ② 使用模板字面量组合字符串\n* ③ 在行内插入一个变量\n\n```\nconst title = 'Section Title';\
    \ ①\nfunction HelloComponent() { };\nHelloComponent.annotations = [new ng.core.Component({\n\
    selector: 'app-hello-world',\ntemplate: `\n ②\n${title} ③\n`\n})];\n```\n\n模板字面量保留了我们在反引号内引入的**所有**格式。在我们的示例中，字符串以换行符开头，后面的每一行都缩进了两个空格。如果我们只是使用\
    \ `console.log` 将其打印出来，我们会看到模板字面量信守了它的承诺。再次得益于大多数编辑器现在支持 ES6 语法，我们可以很容易地识别出哪里是直接编排字符串，哪里是使用插值语法。\n\
    \n插值语法有一个限制，那就是我们不能嵌套插值。让我们看一个例子：\n\n* ① 在理想情况下生效\n* ② 哎呀！多了一个空格\n* ③ 尝试嵌套插值将不起作用\n\
    * ④ 我们可以利用模板字面量会求值为字符串这一事实\n\n```\n// 为便于说明，用 _ 表示空格\n{\nconst name = 'Edgar';\n\
    const middle = 'Allen';\nconst last = 'Poe';\n// 输出 'Edgar_Allen_Poe'\nconsole.log(`${name}\
    \ ${middle} ${last}`); ①\n}\n{\nconst name = 'Emily';\nconst middle = \";\nconst\
    \ last = 'Dickinson';\n// 输出 'Emily__Dickinson'\nconsole.log(`${name} ${middle}\
    \ ${last}`);\n// 输出 'Emily__Dickinson' ②\nconsole.log(`${name} ${middle.trim()}\
    \ ${last}`);\n// console.log(`${${name} ${middle}}.trim() ${last}`); ③\n// 输出\
    \ Emily_Dickinson\nconsole.log(`${`${name} ${middle}`.trim()} ${last}`); ④\n}\n\
    ```\n\n在我们的理想情况下，每个候选人都有名、中间名和姓。然而，在没有中间名的情况下，盲目地拼接字符串而不在正确位置使用 `trim` 会导致多出一个空格。另外，请注意我们尝试\
    \ `trim` 中间名的方法也是不恰当的——如果名字本身包含尾随空格，修剪中间名有助于减少冗余空格。但对于空中间名*周围*的空格却没有作用。\n\n我们想做的是连接名和中间名，使用\
    \ `trim` 消除任何冗余空格，然后才加上姓。\n\n由于我们不能嵌套插值，我们被迫采取不同的策略。我们可以利用模板字面量会求值为其最终字符串这一事实——因此我们可以在模板字符串中嵌套模板字符串——从而以一种稍微复杂的方式实现插值的嵌套。\n"
- fmt: "While one might object to the readability of nested template strings, and\
    \ that objection is well justified, it is not uncommon to see it, especially in\
    \ light of tagged literals, as we will see soon.\n\nAnother limitation is the\
    \ interpolation syntax is `${}`, in that, the `$` and the `{}` are required. Many\
    \ languages like Ruby allow you to skip the `{}` if simply evaluating a variable,\
    \ whereas mandate them when evaluating any expression.\n\nWhat if we wanted to\
    \ have a back-tick, or a `$` sign as a literal? Simple enough. Just escape them\
    \ using a backslash, as shown here:\n\n```\nconst escapingLiterals = `Template\
    \ strings introduce \\`\\` and use $\\{} for interpolation`;\n// prints 'Template\
    \ strings introduce `` and use ${} for interpolation'\nconsole.log(escapingLiterals);\n\
    ```\n\nTemplate literals solve the problem of composing strings quite elegantly—allowing\
    \ us to express how a string is to be formed and formatted succinctly. But there\
    \ is even more good news! ES6 affords us yet another facility that works with\
    \ template strings, namely tagged literals. Let us look into these next.\n\n##\
    \ Tagged Literals\n\nTagged literals allow us to use “tags,” or tag functions,\
    \ in conjunction with template literals, so that we can affect the resulting string\
    \ and produce more than what we might be able to accomplish with template literals\
    \ alone.\n\nLet us take a step back and see how template literals work. There\
    \ are two aspects of a template literal that we can use to change the resultant\
    \ string—*how* we concatenate and what we can do with the variables that we interpolate\
    \ within the template. Consider a situation in which we interpolate string variables\
    \ within a template string—the manner in which we affect the result depends on\
    \ what the string object is capable of. For example, we could invoke the `toUpperCase`\
    \ method and have a rather effervescent message displayed, like so:\n\n```\nconst\
    \ greeting = 'Hello';\nconst name = 'Sylvia';\nconst msg = `${greeting.toUpperCase()}!\
    \ My name is ${name}!`;\n```\n\nIf we were to tease apart the constituent parts\
    \ of a template string, we see that there are two parts to the equation—the “static”\
    \ pieces of the string and the “dynamic” pieces of the string. We can envision\
    \ these as two arrays, like so:\n\n*Static vs. dynamic pieces* *of template strings*\n\
    \n*   ① A template string interpolating just two variables\n*   ② `-` denote fixed\
    \ parts, `_` represent dynamic parts\n*   ③ The parts of the string that are fixed\
    \ represented as an array\n*   ④ The dynamic, or evaluated pieces of the template\
    \ string\n\n```\nconst greeting = 'Hello';\nconst name = 'Sylvia';\nconst msg\
    \ = `${greeting}! My name is ${name}!`; ①\n//           ___________-------------_______-\
    \ ②\nconst fixedStrings = [\", '! My name is ', '!']; ③\nconst values = ['Hello',\
    \ ' Sylvia']; ④\n```\n\nJust like we did here, we can take *any* template string,\
    \ and splice it neatly into two arrays. Furthermore, if we interleaved these two\
    \ arrays—taking the first item from the `fixedStrings` array, concatenating it\
    \ with the first value from the `values` array, and proceeding till we run out\
    \ of items—we can reconstitute the template strings ourselves!\n\nTag functions\
    \ allow us to do exactly this. They let us intercept the evaluation of the template\
    \ string by giving us a reference to the constituent parts of the template—the\
    \ fixed and dynamic pieces, and whatever the return value of the tag function\
    \ happens to be, is neatly slotted in where we invoked it.\n\nWe will start with\
    \ a simple example, in which we will implement the functionality offered to us\
    \ by template strings themselves. This will give us an opportunity to understand\
    \ how to use tag functions, and inspect their signature:\n\n*   ① Declare a tag\
    \ function\n*   ② Invoke the tag function, handing it a template string\n\n```\n\
    const handler = (strings, ...values) => { ①\nconst interleave = (arr1, arr2) =>\n\
    arr1.reduce((arr, v, i) => arr.concat(v, arr2[i]), []);\nreturn interleave(strings,\
    \ values).join(\");\n};\nconst greeting = 'Hello';\nconst name = 'Ernest';\nconst\
    \ msg = handler`${greeting}! My name is ${name}.`; ②\n// prints 'Hello! My name\
    \ is Ernest.'\nconsole.log(msg);\n```\n\nTag functions have a unique invocation\
    \ pattern, in that, unlike regular functions that must wrap their arguments in\
    \ parenthesis, tag functions simply accept a template string in-line. JavaScript\
    \ splits the template string into its fixed and dynamic parts, passing them into\
    \ the tag function separately—all of the fixed parts are sent in as the first\
    \ argument as an array, with the interpolated values sent in consecutively in\
    \ the same order as they appear in the original template. Thus, in our example,\
    \ `strings` is an array of the fixed parts, and we simply capture all of the remaining\
    \ arguments into an array using the variable arguments syntax.\n\nThe rest is\
    \ simple—simply interleave the two arrays, starting with the first item of the\
    \ `strings` array, followed by one from the `values` array, and proceed till we\
    \ reach the end of the `strings` array, and return the result.\n\nIf you were\
    \ to try this out in the console, you will see that you can supply it any template\
    \ string, and it will return the string just as if were evaluated by JavaScript.\n\
    \nSo far, we have implemented something that JavaScript already does for us, so\
    \ perhaps you are not convinced why tag functions are a good idea. Let us attempt\
    \ a slightly more elaborate example—there is a very popular extension for many\
    \ editors called [Emmet](https://emmet.io/). Once installed, it allows one to\
    \ write HTML (and CSS) incredibly fast by providing a highly abbreviated syntax\
    \ that unfolds into valid HTML code. Emmet goes one step further, placing the\
    \ cursor in the right position after expansion, allowing us the type in the inner\
    \ HTML. Consider the following examples, where the comments express what a developer\
    \ would type in their editor that supports Emmet, followed by the `Tab` key, to\
    \ see what Emmet would convert the text into (with the `_` revealing where the\
    \ cursor would be placed by Emmet):\n\n```\n TAB -->\n_\n TAB -->\n_\n TAB -->\n\
    \n```\n\nEmmet syntax is obviously inspired by CSS selectors, such as those that\
    \ are accepted by `document.querySelector` and jQuery. Emmet is an interactive\
    \ medium, in that it can place the cursor at the appropriate spot for the developer\
    \ to type in the text that represent the `innerHTML` for the element.\n\nWhat\
    \ if we wanted to do something similar programmatically, wherein we could supply\
    \ Emmet inspired syntax, and our code would expand it into the appropriate HTML?\
    \ Of course, we need a way to express the `innerHTML` of the element, since we\
    \ are going to actually write out all the HTML and don’t have the luxury of appropriately\
    \ placing a cursor, so we are going to pull a fast one. We will use template literals\
    \ and tag functions, with one restriction—the `innerHTML` to the element has to\
    \ be supplied as an interpolated variable at the end of the template string. In\
    \ other words, `h1.title${someVar}` is valid, but `h1.title.content${someVar}#main`\
    \ is not. This will let us know which parts compose the HTML element, and what\
    \ text to place in as the `innerHTML`.\n\nFinally, given `h1.title${someVar}`\
    \ where `someVar` evaluates to `some text` the tag function should return `<h1\
    \ class=\"title\">some text</h1>`. Ready?\n\n*   ① Our Emmet compliant tag function\n\
    *   ② Assume the name of the element to be the first thing in the supplied string\n\
    *   ③ Use a regular expression to get all class/Ids markers\n*   ④ Nothing to\
    \ do if it just a plain element with no attributes\n*   ⑤ Get the `id`, and if\
    \ multiple ids were supplied, take the last one\n*   ⑥ Build the `id=\"\"` string\n\
    *   ⑦ Filter for all attributes starting with `.`\n*   ⑧ Build the `class=\"\"\
    ` string\n*   ⑨ Build the opening tag string with id/class specified\n*   ➉ Write\
    \ out the full element including its `innerHTML` and return it"
