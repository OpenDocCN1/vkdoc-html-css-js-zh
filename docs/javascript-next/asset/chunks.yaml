  trans: "\n尽管有人可能会质疑嵌套模板字符串的可读性，而且这种质疑也完全合理，但在实际中并不少见，尤其是在我们即将讨论的带标签的模板字面量中。\n\n\
    另一个限制是插值语法是`${}`，这意味着`$`和`{}`都是必需的。许多语言（如 Ruby）允许在仅求值一个变量时省略`{}`，但在求值任何表达式时必须使用它们。\n\
    \n如果我们想要将反引号或`$`符号作为字面量呢？很简单。只需使用反斜杠进行转义，如下所示：\n\n```\nconst escapingLiterals\
    \ = `模板字符串引入了 \\`\\` 并使用 $\\{} 进行插值`;\n// 输出 '模板字符串引入了 `` 并使用 ${} 进行插值'\nconsole.log(escapingLiterals);\n\
    ```\n\n模板字面量优雅地解决了字符串组合的问题——让我们能够简洁地表达字符串如何形成和格式化。但还有更好的消息！ES6 还为我们提供了另一个与模板字符串配合使用的功能，即带标签的模板字面量。接下来让我们深入研究它们。\n\
    \n## 带标签的模板字面量\n\n带标签的模板字面量允许我们使用“标签”或标签函数与模板字面量结合，从而影响生成的字符串，并产生比单独使用模板字面量可能实现的结果更多的东西。\n\
    \n让我们退一步，看看模板字面量是如何工作的。我们可以利用模板字面量的两个方面来改变结果字符串——*如何*拼接以及如何处理模板内插值的变量。考虑一种情况，我们在模板字符串内插值字符串变量——影响结果的方式取决于字符串对象的能力。例如，我们可以调用`toUpperCase`方法并显示一个相当生动的消息，如下所示：\n\
    \n```\nconst greeting = 'Hello';\nconst name = 'Sylvia';\nconst msg = `${greeting.toUpperCase()}!\
    \ 我的名字是 ${name}!`;\n```\n\n如果我们剖析模板字符串的组成部分，可以看到等式有两部分——字符串的“静态”部分和“动态”部分。我们可以将它们想象成两个数组，如下所示：\n\
    \n*模板字符串的静态部分与动态部分*\n\n*   ① 仅插值两个变量的模板字符串\n*   ② `-` 表示固定部分，`_` 表示动态部分\n*   ③\
    \ 字符串中固定的部分表示为一个数组\n*   ④ 模板字符串中动态或已求值的部分\n\n```\nconst greeting = 'Hello';\n\
    const name = 'Sylvia';\nconst msg = `${greeting}! 我的名字是 ${name}!`; ①\n//     \
    \      ___________-------------_______- ②\nconst fixedStrings = [\", '! 我的名字是\
    \ ', '!']; ③\nconst values = ['Hello', 'Sylvia']; ④\n```\n\n就像我们在这里所做的一样，我们可以将*任何*模板字符串整齐地拆分成两个数组。此外，如果我们交错这两个数组——从`fixedStrings`数组中取出第一项，与`values`数组中的第一个值拼接，并继续直到所有项都用完——我们就可以自己重新构建模板字符串！\n\
    \n标签函数正是让我们做到这一点。它们通过提供对模板组成部分（固定部分和动态部分）的引用来让我们拦截模板字符串的求值过程，而标签函数返回的任何值都会被整齐地插入到我们调用它的位置。\n\
