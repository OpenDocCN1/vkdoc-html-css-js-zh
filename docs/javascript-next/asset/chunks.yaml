- fmt: "### Parentheses or No Parentheses?\n\nArrow functions have their parameters\
    \ listed to the left of the fat arrow. It is permitted to skip the parentheses\
    \ **if and only if** the function signature has one parameter.^([^(16)](#fn16))\
    \ The following snippet offers the various permutations allowed for arrow function\
    \ parameters:\n\n- ① Zero-parameter list requires parenthesis\n- ② Single-parameter\
    \ list makes the parenthesis optional\n- ③ Two or more parameters require the\
    \ parenthesis\n\n```\nconst noop = () => {}; ①\nconst identity = n => n; ②\nconst\
    \ get = (obj, k) => obj[k]; ③\n```\n\nThis discussion begs the question, does\
    \ skipping the parenthesis for single-parameter arrow functions buy us anything?\
    \ The convention adopted widely across the JavaScript community is one where we\
    \ should skip the parenthesis if we can. In other words, while it may seem to\
    \ go against the notion that single-argument arrow statements should be syntactically\
    \ consistent (with no-arg and multi-arg arrow functions), it does reduce the verbosity\
    \ especially in the case of higher-order functions as we will see soon.\n\nThe\
    \ right-hand side of the arrow function syntax offers a little more subtlety as\
    \ we will see now.\n\n### Expression and Statement Bodies\n\nAll the examples\
    \ we have seen so far have had single-line bodies. What if our function had to\
    \ do a little more work?\n\nIt turns out we can indeed use curly brackets to define\
    \ the function body. However, as you might recall, curly brackets create blocks\
    \ in JavaScript, which are statements, not expressions! In other words, every\
    \ example we have seen so far used an expression as its body, thus alleviating\
    \ the need to explicitly `return` from the function. If we are to switch to using\
    \ blocks (which is a statement and therefore is not *evaluated*), then we are\
    \ forced to explicitly `return` from the function. (Otherwise, the function, like\
    \ any regular function, returns an implicit `undefined`.) Let us define a multiline-bodied\
    \ arrow function:\n\n- ① Use curly brackets to start body\n- ② Explicit return\
    \ required\n\n```\nconst reducer = (acc, n) => { ①\n  acc.push(n);\n  return acc;\
    \ ②\n};\n// invoke it\nconsole.log(reducer([2, 3], 1)); // prints '[ 2, 3, 1 ]'\n\
    ```\n\nIt *is* recommended that if we are to use curly brackets, we should have\
    \ explicit `return`s in the body. Not doing so can prove to be rather baffling.\
    \ Observe:\n\n```\nconst confuser = () => { profession: 'JS Ninja' };\n// invoke\
    \ it\nconsole.log(confuser());\n```\n\nQuick! What does the function return upon\
    \ invocation? Is it an object with one key, or is that a block with a `label`\
    \ and therefore returns `undefined`? As you can see, the overloaded nature of\
    \ curly brackets to define blocks *and* objects causes confusion in conjunction\
    \ with the arrow syntax.\n\nIt turns out that if JavaScript “sees” curly brackets\
    \ in an arrow function definition it treats it as if it were a block body. This\
    \ means that upon invocation, this function will return `undefined`.\n\nWhat if\
    \ we indeed wanted to return an object? We have two options—explicitly use a block\
    \ with a `return` or wrap the body in parenthesis, like so:\n\n```\nconst confuserOne\
    \ = () => ({ profession: 'JS Ninja' });\n// prints '{ profession: 'JS Ninja' }'\n\
    console.log(confuserOne());\n// alternatively\nconst confuserTwo = () => {\n \
    \ return { profession: 'JS Ninja' };\n};\n// prints '{ profession: 'JS Ninja'\
    \ }'\nconsole.log(confuserTwo());\n```\n\nThat sums up all the syntactical nuances\
    \ of arrow functions. Now let us consider the semantic differences between arrow\
    \ functions and regular functions. But before we go there, we must take a brief\
    \ digression into regular functions, and how they work with `this`.\n\n### Regular\
    \ Functions Dynamically Set `this`\n\nWhen a regular function (defined using function\
    \ statements or expressions) references `this`, that reference is resolved dynamically\
    \ based on the *invocation pattern* used:\n\n- ① Set a property that references\
    \ a local function in scope\n- ② Invoke the function using the “method invocation”\
    \ pattern\n- ③ Use the “apply invocation” pattern\n- ④ Invoke the function using\
    \ the “function invocation” pattern\n\n```\n'use strict';\nconst returnsThis =\
    \ function () {\n  return this;\n};\nvar obj1 = {\n  name: 'obj1',\n  method:\
    \ returnsThis, ①\n};\nconsole.assert(obj1.method() === obj1); ②\nvar obj2 = {\n\
    \  name: 'obj2',\n};\nconsole.assert(returnsThis.apply(obj2) === obj2); ③\nconsole.assert(returnsThis()\
    \ === undefined); ④\n```\n\nI must emphasize that we are running the code in `strict\
    \ mode` to avoid the automatic boxing that “nonsecure” environments tend to enforce.^([^(17)](#fn17))\
    \ That said, we then invoke the same function using three different invocation\
    \ patterns^([^(18)](#fn18)) to see the value of `this` be different in each case!\n\
    \nWe first assign a property on an object to point to the local function, and\
    \ then invoke it like we would any other function property on that object using\
    \ the “dot” operator. As we might expect, `this` points to whatever is on the\
    \ left of the “dot” at invocation time. In other words, it points to the “current\
    \ context.”\n\nWe then use the `apply` (or its cousin `call`) which effectively\
    \ sets the `this` inside the function prior to invoking it. Another way to think\
    \ about it is that this line is equivalent to the method invocation pattern, except\
    \ we are setting `this` using `apply` instead of being forced to tack on a new\
    \ property on the object.\n\nFinally, we simply invoke the function without any\
    \ context—that is, we do not invoke the function on any object; in `strict mode`\
    \ the function simply returns `undefined`, which is what one would expect.\n\n\
    As we can see, `this` within a function expression (or statement) is set at the\
    \ time of invocation, *not* at the time of definition. This is where the behavior\
    \ of “regular” functions diverges from that of arrow functions. While regular\
    \ functions dynamically set the meaning of `this` at invocation time, arrow functions\
    \ bind it lexically; in other words, arrow functions bind `this` at *definition*\
    \ time.\n\n### Lexically Bound `this`\n\nArrow functions do not set the meaning\
    \ of `this` upon invocation. Rather they set or “cement” it to whatever `this`\
    \ evaluates to when they are created. Consider the following:\n\n- ① Grab a handle\
    \ to the global object in scope so we `assert` against it\n- ② Define an arrow\
    \ function that simply `return`s `this`\n- ③ Trying to use it as a method does\
    \ not change the context\n- ④ Neither does `apply`\n- ⑤ Regular functions would\
    \ have returned `undefined` here (as we have seen)\n\n```\n'use strict';\nconst\
    \ GLOBAL_OBJECT = this; ①\nconst returnMe = () => this; ②\nvar obj1 = {\n  name:\
    \ 'obj1',\n  method: returnMe,\n};\nconsole.assert(obj1.method() === GLOBAL_OBJECT);\
    \ ③\nvar obj2 = {\n  name: 'obj2',\n};\nconsole.assert(returnMe.apply(obj2) ===\
    \ GLOBAL_OBJECT); ④\nconsole.assert(returnMe() === GLOBAL_OBJECT); ⑤\n```\n\n\
    Defining an arrow function seems to be the same as defining a regular function,\
    \ and `bind`-ing `this` to whatever is `this` at definition time! And indeed,\
    \ this is the case.\n\nLet us look at some more caveats that apply to arrow functions."
