    highlights how the new syntax introduced in ES6 allows us to approach functional
    programming idiomatically in JavaScript. Given a situation to flatten an array,
    our logical approach would be look at the first element in the array; if it happens
    to be an array itself, start by flattening that array, followed by flattening
    the remaining elements of the original array. This algorithm is revealed as-is
    in our approach. Without imperative loops, and unnecessary counters, our true
    intent is revealed in plain sight.'
  trans: '```javascript

    const perimeter = ([s1 = 10,

    s2 = s1,

    s3 = s1,

    s4 = s2] = []) => { ①

    return s1 + s2 + s3 + s4;

    };

    console.assert(perimeter() === 40); ②

    console.assert(perimeter([]) === 40); ③

    console.assert(perimeter([15]) === 60); ④

    console.assert(perimeter([15, 20]) === 70); ⑤

    console.assert(perimeter([15, 20, 18, 23]) === 76); ⑥

    ```


    我们之前学到的关于默认参数的所有内容都适用。我们可以像使用默认参数语法那样，对整个参数设置默认值，但如果参数恰好是一个数组，我们可以进行内联解构，同时为每个我们关心的元素提供默认值。


    其明显优势在于函数签名更具表现力，代价是略显冗长。适当的格式化在此很有帮助，使用换行将参数的各个部分分解开来，是一种广泛采用的技术。


    最后，我们还可以结合数组解构使用剩余参数。^(³³) 这允许我们深入到数组中，抓取所有我们感兴趣的元素，同时将剩余的元素“吸”入另一个数组。


    - ① 这里的 `rest` 是一个数组，包含所有未被考虑的元素

    - ② 递归处理剩余元素


    ```javascript

    const movies = [''记忆碎片'', ''蝙蝠侠：侠影之谜'', ''黑暗骑士''];

    const [first, ...rest] = movies; ①

    console.assert(first === ''记忆碎片'');

    console.assert(Array.isArray(rest));

    const [head, ...tail] = rest; ②

    console.assert(head === ''蝙蝠侠：侠影之谜'');

    console.assert(Array.isArray(tail));

    ```


    就像函数签名中的剩余参数一样，解构中使用 rest 模式**必须**是最后一个赋值项。


    正如我们所见，这在递归算法中极为有用^(³⁴)：


    - ① 边界情况检测

    - ② 提取我们感兴趣的元素

    - ③ 如果需要则递归


    ```javascript

    const or = (...args) => {

    if (args.length === 0) return null;

    if (args.length === 1) return args[0]; ①

    const [first, ...rest] = args; ②

    return first || or(...rest); ③

    };

    console.assert(or(null, undefined, true, false, ''1''));

    console.assert(!or(null, undefined, false));

    ```


    最后，数组解构也可用于嵌套数组。我们再次注意到赋值与构造之间的对称性：


    - ① 当索引查找失败时，为内部数组查找提供默认值

    - ② 嵌套解构


    ```javascript

    const ticTacToe = [

    [''x'', ''o'',  ''x''],

    [''o'', ''x'', ''o''],

    [''x'', ''o'', ''x''],

    ];

    const [

    [cell01] = [],

    [, cell11] = [],

    [, , cell22] = [], ①

    ] = ticTacToe; ②

    console.assert(cell01 === ''x'');

    console.assert(cell11 === ''x'');

    console.assert(cell22 === ''x'');

    ```


    这个例子揭示了一个容易出错的地方。回想我们之前的讨论，访问一个数组中**不**存在的索引会得到 `undefined`。如果我们要查找的值位于顶层，这或许可以接受；然而，如果这是一个嵌套查找，那么这**将**导致错误。考虑到我们试图解构
    `undefined`，这是合理的。这里的预防措施可能是在解构之前，先对整个（嵌套）查找设置默认值，正如此处所示。


    数组解构的一个用例是让我们可以假装函数`返回`多个值：


    - ① `返回`一个数组（在此例中是一个元组）

    - ② 通过解构从返回值中获取多个值


    ```javascript

    const distanceAndSlope = ([x1, y1], [x2, y2]) => {

    const distance = Math.hypot(x2 - x1, y2 - y1);

    const slope = (y2 - y1) / (x2 - x1);

    return [distance, slope]; ①

    };

    const [dist, slope] = distanceAndSlope([4, 3], [10, 12]); ②

    console.assert(Number.parseFloat(dist.toFixed(2)) === 10.82);

    console.assert(slope === 1.5);

    ```


    JavaScript 中有许多方法返回数组（`RegExp.split` 便是一例），数组解构为我们提供了一种便捷且优雅的方式来使用这类函数的结果集。


    数组解构常用于解构剩余参数。正如我们所看到的，剩余参数将所有“额外的”参数捕获到一个数组中，这个数组是可展开的。如果我们希望将剩余参数数组中的第一个元素与其他元素分开处理，这一点尤其有用。我们在递归解决方案中经常看到这种用法，如下所示：


    - ① 终止条件

    - ② “展平”数组的核心逻辑


    ```javascript

    const flatten = ([first, ...rest]) => {

    if (first === undefined) return []; ①

    return !Array.isArray(first)

    ? [first, ...flatten(rest)]

    : [...flatten(first), ...flatten(rest)]; ②

    };

    const flattened = flatten([

    [1, 2],

    [3], 4, 5, [6, 7],

    ]);

    console.assert(flattened.length === 7);

    console.assert(flattened.join() === ''1,2,3,4,5,6,7'');

    ```


    我们利用了这样一个事实：如果没有提供剩余参数，解构将导致所有元素被评估为 `undefined`。这作为递归的终止条件，否则我们继续递归。


    除了巧妙运用解构和展开运算符外，这个例子还强调了 ES6 引入的新语法如何让我们在 JavaScript 中以惯用的方式实现函数式编程。给定一个展平数组的场景，我们的逻辑思路是：查看数组的第一个元素；如果它本身也是一个数组，则先展平该数组，再展平原数组的剩余元素。这个算法在我们的实现中清晰呈现，无需命令式循环和不必要的计数器，我们的真实意图一目了然。'
- fmt: "# Object Destructuring\n\nThe assignment operator, as one might expect, for\
    \ objects is `{}`. Arrays are indexed by position; however, objects are key-value\
    \ pairs. Consequently, the lookup mandates that we specify the *keys* we are interested\
    \ in within the assignment. Observe:\n\n- ① We start with an object\n- ② The long\
    \ form of object destructuring\n- ③ The short form of object destructuring\n\n\
    ```javascript\nconst paip = {\n  name: 'Paradigms of Artificial Intelligence Programming',\n\
    \  author: 'Peter Norvig',\n  isbn: 1558601910,\n}; ①\nconst {\n  name: n,\n \
    \ isbn: id,\n} = paip; ②\nconsole.assert(n === 'Paradigms of Artificial Intelligence\
    \ Programming');\nconsole.assert(id === 1558601910);\nconst {\n  name,\n  isbn,\n\
    } = paip; ③\nconsole.assert(name === 'Paradigms of Artificial Intelligence Programming');\n\
    console.assert(isbn === 1558601910);\n```\n\nObject destructuring offers us two\
    \ variants of the syntax. The longer version is useful when the variables we introduce\
    \ in scope have names that do **not** line up with the keys in the object being\
    \ destructured. The short form is useful if the names of the new variables are\
    \ identical to the keys that they are interrogating.\n\nSyntactically and semantically\
    \ there is no sharp departure from that of array destructuring except that for\
    \ objects we cannot positionally index, but rather we must specify the keys we\
    \ are looking for.\n\nEverything that is available to us in array destructuring\
    \ is available to us here—`undefined` returns for nonexistent keys, default values,\
    \ nested lookups, and destructuring support in method signatures are all up for\
    \ grabs using object destructuring.\n\nOne aspect that is **not** available is\
    \ the ability for new variables to see previously declared variables since \"\
    previous\" implies an ordering, which does not exist for associative hashes.\n\
    \nLet us explore all of these facets:\n\n- ① We start with an object\n- ② Using\
    \ nested destructuring\n- ③ Defaulted values using both long and short destructuring\
    \ format\n- ④ Default the entire nested lookup with a default in case the original\
    \ object does not have the key\n- ⑤ Destructuring in function parameters with\
    \ defaults\n\n```javascript\nconst config = {\n  size: 200,\n  transitionMs: 750,\n\
    \  clip: {\n    width: 200,\n  },\n}; ①\nconst {\n  size,\n  transitionMs,\n \
    \ clip: { ②\n    width: w = 100, ③\n    height = 100,\n  } = {}, ④\n} = config;\n\
    console.assert(size === 200);\nconsole.assert(transitionMs === 750);\nconsole.assert(w\
    \ === 200);\nconsole.assert(height === 100);\nconst drawChart = ({\n  size = 200,\n\
    \  transitionMs = 1000,\n  clip: {\n    width: w = 100,\n    height = 100,\n \
    \ } = {},\n} = {}) => { ⑤\n  return [size, transitionMs, w, height];\n};\n// invoke\
    \ it\ndrawChart();\n```\n\nLike arrays, objects return `undefined` if we attempt\
    \ to look up a key that does not exist within the object. Once again, it is prudent\
    \ to default a nested lookup in its entirety *prior* to looking up keys within\
    \ it.\n\n## Using Array and Object Destructuring in Combination\n\nOf course,\
    \ we can mix and match object and array destructuring. Let us revisit our earlier\
    \ example to see how we can use a combination of the two to extract the parts\
    \ we are interested in:\n\n- ① Destruct the outer object\n- ② Since `address`\
    \ is an object itself, we destruct that as well\n- ③ `zip` happens to be an array\n\
    - ④ Reach for both indexes within `zip` simultaneously\n\n```javascript\nconst\
    \ user = {\n  name: 'douglas',\n  profession: 'developer',\n  address: {\n   \
    \ street1: '1 Ad Infinitum Drive',\n    street2: \"\",\n    city: 'Cupertino',\n\
    \    state: 'CA',\n    zip: [\n      '95014',\n      '1234',\n    ],\n  },\n};\n\
    const { ①\n  address: { ②\n    zip: [ ③\n      zip, ④\n      extended,\n    ],\n\
    \  },\n} = user;\nconst final = zip + '-' + extended;\nconsole.assert(final ===\
    \ '95014-1234');\n```\n\nOur intent is to extract the full zip code of the user,\
    \ the elements of which happen to be inside an array, nested inside the `address`\
    \ object, which in turn is a property inside a literal JavaScript object. Hence,\
    \ we must exercise our nested destructuring skills, carefully peeling apart the\
    \ original structure to surgically retrieve exactly what it is that we want. We\
    \ start by destructuring the outer object, which in turn leads us to the `address`\
    \ key, which we must destruct again to fetch the `zip` array. Finally, we can\
    \ use the array destructuring syntax to fetch the elements that constitute the\
    \ zip code by index. Phew!\n\nWe have come full circle. Gone are the convoluted\
    \ lookups and the unnecessary variables. What remains is simply what we seek.\
    \ And once again, the symmetry between structuring and destructuring is revealed.\n\
    \n## Caveats\n\nThere remains one final limitation that is specific to destructuring\
    \ in function signatures. It just so happens that if we destructure an argument\
    \ supplied to a function, we lose the reference to the whole object (or array).\
    \ In other words, we have a choice—we either destructure to get the parts we need\
    \ or we grab the whole object and destructure within the implementation of the\
    \ function allowing us to use the whole object further on. While this may sound\
    \ like an edge-case, there are times when we need to use parts of an object, and\
    \ then send the whole object downstream for further processing. Languages like\
    \ Clojure offer the use of the `:as` keyword as a means to destruct and hold a\
    \ reference to the whole object. Unfortunately, JavaScript offers us no such recourse.\n\
    \n## A Small Distinction\n\nThe spread and rest operator that works for iterables\
    \ is different than the one that applies to objects in that objects are **not**\
    \ iterable! While the spread and rest operator look and behave the same for both\
    \ iterables and objects, the underlying mechanisms used for the two are very different.\
    \ We should treat the spread and rest operator that works for objects as *new*\
    \ syntax vs. treating it as an extension of the operators we work for iterables.\n\
    \nThis disparity also reveals itself when we attempt to use the spread operator\
    \ in conjunction with multi-arity functions like `console.log`. Recall that if\
    \ we have an iterable (like an array) and wish to supply the contents of the array\
    \ to `console.log`, we can simply invoke it using `console.log(...arr)`. This\
    \ will \"explode\" the array, supplying the items of the array as individual arguments\
    \ to `log`. This will not work for objects, once again a gentle reminder that\
    \ objects are not iterable, and do not lend themselves to all of the use-cases\
    \ that work for iterables.\n\n## Summary\n\nThe spread operator as we have seen\
    \ provides us with a very powerful mechanism to get at *all* the elements of an\
    \ array in one fell swoop. This proves particularly useful when working with multi-arity\
    \ functions, as well as when creating and/or concatenating arrays from other arrays.\n\
    \nThe destructuring syntax on the other hand provides us a means to interrogate\
    \ data using a *domain-specific language* (DSL) that resembles the syntax that\
    \ we use to create objects in the first place. Consequently, this DSL proves to\
    \ be just as expressive, and with additional functionality such as defaulting\
    \ missing properties (and indexes), this is yet another useful tool in our JavaScript\
    \ toolkit.\n\nIn the next chapter, we will shift directions, and look at a new\
    \ mechanism to define strings that helps simplify creating both dynamic and multiline\
    \ strings.\n\n# Formatted Strings Using Template Strings"
  raw: '### Object Destructuring


    The assignment operator, as one might expect, for objects is `{}`. Arrays are
    indexed by position; however, objects are key-value pairs. Consequently, the lookup
    mandates that we specify the *keys* we are interested in within the assignment.
    Observe:


    *   ① We start with an object


    *   ② The long form of object destructuring


    *   ③ The short form of object destructuring


    ```

    const paip = {

    name: ''Paradigms of Artificial Intelligence Programming'',

    author: ''Peter Norvig'',

    isbn: 1558601910,

    }; ①

    const {

    name: n,

    isbn: id,

    } = paip; ②

    console.assert(n === ''Paradigms of Artificial Intelligence Programming'');

    console.assert(id === 1558601910);

    const {

    name,

    isbn,

    } = paip; ③

    console.assert(name === ''Paradigms of Artificial Intelligence Programming'');

    console.assert(isbn === 1558601910);

    ```


    Object destructuring offers us two variants of the syntax. The longer version
    is useful when the variables we introduce in scope have names that do **not**
    line up with the keys in the object being destructured. The short form is useful
    if the names of the new variables are identical to the keys that they are interrogating.


    Syntactically and semantically there is no sharp departure from that of array
    destructuring except that for objects we cannot positionally index, but rather
    we must specify the keys we are looking for.


    Everything that is available to us in array destructuring is available to us here—`undefined`
    returns for nonexistent keys, default values, nested lookups, and destructuring
    support in method signatures are all up for grabs using object destructuring.


    One aspect that is **not** available is the ability for new variables to see previously
    declared variables since “previous” implies an ordering, which does not exist
    for associative hashes.


    Let us explore all of these facets:


    *   ① We start with an object


    *   ② Using nested destructuring


    *   ③ Defaulted values using both long and short destructuring format


    *   ④ Default the entire nested lookup with a default in case the original object
    does not have the key


    *   ⑤ Destructuring in function parameters with defaults


    ```

    const config = {

    size: 200,

    transitionMs: 750,

    clip: {

    width: 200,

    },

    }; ①

    const {

    size,

    transitionMs,

    clip: { ②

    width: w = 100, ③

    height = 100,

    } = {}, ④

    } = config;

    console.assert(size === 200);

    console.assert(transitionMs === 750);

    console.assert(w === 200);

    console.assert(height === 100);

    const drawChart = ({

    size = 200,

    transitionMs = 1000,

    clip: {

    width: w = 100,

    height = 100,

    } = {},

    } = {}) => { ⑤

    return [size, transitionMs, w, height];

    };

    // invoke it

    drawChart();

    ```


    Like arrays, objects return `undefined` if we attempt to look up a key that does
    not exist within the object. Once again, it is prudent to default a nested lookup
    in its entirety *prior* to looking up keys within it.


    ### Using Array and Object Destructuring in Combination


    Of course, we can mix and match object and array destructuring. Let us revisit
    our earlier example to see how we can use a combination of the two to extract
    the parts we are interested in:


    *   ① Destruct the outer object


    *   ② Since `address` is an object itself, we destruct that as well


    *   ③ `zip` happens to be an array


    *   ④ Reach for both indexes within `zip` simultaneously


    ```

    const user = {

    name: ''douglas'',

    profession: ''developer'',

    address: {

    street1: ''1 Ad Infinitum Drive'',

    street2: ",

    city: ''Cupertino'',

    state: ''CA'',

    zip: [

    ''95014'',

    ''1234'',

    ],

    },

    };

    const { ①

    address: { ②

    zip: [ ③

    zip, ④

    extended,

    ],

    },

    } = user;

    const final = zip + ''-'' + extended;

    console.assert(final === ''95014-1234'');

    ```


    Our intent is to extract the full zip code of the user, the elements of which
    happen to be inside an array, nested inside the `address` object, which in turn
    is a property inside a literal JavaScript object. Hence, we must exercise our
    nested destructuring skills, carefully peeling apart the original structure to
    surgically retrieve exactly what it is that we want. We start by destructuring
    the outer object, which in turn leads us to the `address` key, which we must destruct
    again to fetch the `zip` array. Finally, we can use the array destructuring syntax
    to fetch the elements that constitute the zip code by index. Phew!


    We have come full circle. Gone are the convoluted lookups and the unnecessary
    variables. What remains is simply what we seek. And once again, the symmetry between
    structuring and destructuring is revealed.


    ## Caveats


    There remains one final limitation that is specific to destructuring in function
    signatures. It just so happens that if we destructure an argument supplied to
    a function, we lose the reference to the whole object (or array). In other words,
    we have a choice—we either destructure to get the parts we need or we grab the
    whole object and destructure within the implementation of the function allowing
    us to use the whole object further on. While this may sound like an edge-case,
    there are times when we need to use parts of an object, and then send the whole
    object downstream for further processing. Languages like Clojure offer the use
    of the `:as` keyword as a means to destruct and hold a reference to the whole
    object. Unfortunately, JavaScript offers us no such recourse.


    ## A Small Distinction


    The spread and rest operator that works for iterables is different than the one
    that applies to objects in that objects are **not** iterable! While the spread
    and rest operator look and behave the same for both iterables and objects, the
    underlying mechanisms used for the two are very different. We should treat the
    spread and rest operator that works for objects as *new* syntax vs. treating it
    as an extension of the operators we work for iterables.


    This disparity also reveals itself when we attempt to use the spread operator
    in conjunction with multi-arity functions like `console.log`. Recall that if we
    have an iterable (like an array) and wish to supply the contents of the array
    to `console.log`, we can simply invoke it using `console.log(... arr)`. This will
    “explode” the array, supplying the items of the array as individual arguments
    to `log`. This will not work for objects, once again a gentle reminder that objects
    are not iterable, and do not lend themselves to all of the use-cases that work
    for iterables.


    ## Summary


    The spread operator as we have seen provides us with a very powerful mechanism
    to get at *all* the elements of an array in one fell swoop. This proves particularly
    useful when working with multi-arity functions, as well as when creating and/or
    concatenating arrays from other arrays.


    The destructuring syntax on the other hand provides us a means to interrogate
    data using a *domain-specific language* (DSL) that resembles the syntax that we
    use to create objects in the first place. Consequently, this DSL proves to be
    just as expressive, and with additional functionality such as defaulting missing
    properties (and indexes), this is yet another useful tool in our JavaScript toolkit.


    In the next chapter, we will shift directions, and look at a new mechanism to
    define strings that helps simplify creating both dynamic and multiline strings.


