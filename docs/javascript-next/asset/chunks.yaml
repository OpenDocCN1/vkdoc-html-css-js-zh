- fmt: '# Importing


    ES6 introduces the `import` keyword that allows one module to import another.
    Only modules can use other modules—modules cannot be consumed from plain old JavaScript
    files. Also, recall that modules and files have a one-to-one relationship, in
    that, a file contains one and only one module, and the name of the contained module
    is the name of the file itself.


    The `import` syntax consists of two parts—the name of the module and what to import
    from the said module. Specifying which module is simply specifying the path to
    the location of the module. The interesting bit here are the mechanisms to actually
    import exported members, so let us talk about that.


    How one imports members of another module depends on how those members were exported
    to begin with. As we know, a module can export named and default members. We begin
    with how we can work with named members.


    Consuming a module that has named exports forces the consumer to use the same
    name as the exported members. Consider the following:


    * ① Import the members required for this module


    ```

    /*

    ''030-named-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    trig,

    }

    */

    import { ①

    sin,

    cos,

    tan,

    } from ''./030-named-exports'';

    // use the functions

    console.log(sin(0));

    ```


    A few points of note regarding how we import the pieces we are interested in from
    another module. The `import` syntax looks very similar to the destructuring syntax
    we saw in a previous chapter. We are also allowed to pick and choose the members
    we are interested in, thus permitting the import of only certain members although
    the module might export a lot more.


    Recall that the name of the member is whatever was exported from the module. So,
    if the members being exported are aliased, then we must import the aliased names:


    * ① Use the aliased names in the import


    ```

    /*

    ''050-alias-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin as sine,

    cos as cosine,

    tan,

    trig as trignometry,

    };

    */

    import {

    sine, ①

    cosine,

    tan,

    trignometry,

    } from ''./050-alias-exports'';

    ```


    The module we rely on aliases its members; therefore, as far as any consuming
    module is concerned, those are the public names, and therefore the only ones available
    for import.


    What if we wanted to import all exported members of another module? The `import`
    syntax supports the wildcard (`*`) syntax with one caveat—the import must then
    be namespaced as shown here:


    *Importing named members*


    * ① Use the wildcard operator to import all the exported members in one fell swoop

    * ② Tucked under the namespace members are visible using their public name


    ```

    /*

    ''050-alias-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin as sine,

    cos as cosine,

    tan,

    trig as trignometry,

    };

    */

    import * as trigFns from ''./050-alias-exports''; ①

    console.log(trigFns.sine(0)); ②

    ```


    Using the wildcard operator increases the chances of collisions between names,
    especially if a large number of other modules are being imported. The `as` namespacing
    attempts to eliminate this possibility. Correspondingly, if we import two separate
    modules accidentally with the same name, we will get an error.


    ## Aliasing Imports


    There is a chance that one or more modules being imported may export members with
    the same name; in which case, we need a mechanism to resolve name collisions.
    This is not an issue when we use the wildcard syntax since the imports are namespaced
    to begin with. However, if we are importing individual members of a module, and
    we have to resolve conflicts, we can alias an import just like we can alias exports:


    * ① Alias imports


    ```

    /*

    ''030-named-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    trig,

    }

    */

    import {

    sin as sine, ①

    cos as cosine,

    trig as trignometry,

    } from ''./030-named-exports'';

    ```


    Aliasing imports, outside of aiding in avoiding collisions, also allows us to
    "rename" functions that perhaps might be too long, or help them fit better with
    the domain we are working with.


    Default exports, once again, prove to be a problem child. Since default exports
    are unnamed exports, the consuming module can call that default export anything
    they want!


    * ① Import the default giving it an arbitrary name

    * ② Use the default import just as we would any other member


    ```

    /*

    ''040-default-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    export default trig;

    */

    import myTrignometry, { ①

    sin,

    cos,

    tan,

    } from ''./040-default-exports'';

    console.log(myTrignometry.sin()); ②

    ```


    Often times, when modules export default members, since the name of the import
    is not mandated, different consumers within the same project refer to the default
    export using different names, making it incredibly hard to find where a member
    is being used. This forces developers working with such exports to settle on a
    naming convention in an attempt to bring the naming to parity with named exports.^([^(82)](#fn82))


    The syntax for importing, much like exporting, is rather flexible, and we can
    mix and match any and all combinations of imports. We could, for example, import
    the default, along with other named members with aliasing if we wish to do so:


    * ① Import the default with any name

    * ② Import named members with aliases

    * ③ Use the imports just like we would any other time


    ```

    /*

    ''040-default-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    export default trig;

    */

    import myTrignometry, { ①

    sin as sine, ②

    cos as cosine,

    tan,

    } from ''./040-default-exports'';

    console.log(myTrignometry.sin()); ③

    console.log(sine(45));

    ```


    The primary driving force behind the import style remains on how a module exports
    its members. Simultaneously, features like aliasing imports in a particular module
    *may* be driven by considerations like avoiding name collisions, or attempting
    to make the imported functions seem more accommodating to the domain at hand.
    However, we must persevere to refrain from using these features from a stylistic
    mindset, so as to not introduce too much overhead on anyone who is attempting
    to maintain the codebase.


    # Caveats and Implications


    The syntax for ES6 modules is designed around exports and imports being "static"—in
    that, they need to be top-level statements in module files. We are **not** allowed
    to dynamically or conditionally export or import members.^([^(83)](#fn83))


    There are several benefits to having static modules, with faster lookup, smaller
    bundles (if we are to use a bundling tool like `Webpack` or `Rollup`) due to deterministic
    dead code elimination. You can read more about the benefits of this approach in
    this exemplary blog post ( [`http://calculist.org/blog/2012/06/29/static-module-resolution/`](http://calculist.org/blog/2012/06/29/static-module-resolution/)
    ) by Dave Herman.'
  raw: '## Importing


    ES6 introduces the `import` keyword that allows one module to import another.
    Only modules can use other modules—modules **cannot** be consumed from plain old
    JavaScript files. Also, recall that modules and files have a one-to-one relationship,
    in that, a file contains one and only one module, and the name of the contained
    module is the name of the file itself.


    The `import` syntax consists of two parts—the name of the module and what to import
    from the said module. Specifying which module is simply specifying the path to
    the location of the module. The interesting bit here are the mechanisms to actually
    import exported members, so let us talk about that.


    How one imports members of another module depends on how those members were exported
    to begin with. As we know, a module can export named and default members. We begin
    with how we can work with named members.


    Consuming a module that has named exports forces the consumer to use the same
    name as the exported members. Consider the following:


    *   ① Import the members required for this module


    ```

    /*

    ''030-named-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    trig,

    }

    */

    import { ①

    sin,

    cos,

    tan,

    } from ''./030-named-exports'';

    // use the functions

    console.log(sin(0));

    ```


    A few points of note regarding **how** we import the pieces we are interested
    in from another module. The import syntax looks very similar to the destructuring
    syntax we saw in a previous chapter. We are also allowed to pick and choose the
    members we are interested in, thus permitting the import of only certain members
    although the module might export a lot more.


    Recall that the name of the member is **whatever** was exported from the module.
    So, if the members being exported are aliased, then we must import the aliased
    names:


    *   ① Use the aliased names in the import


    ```

    /*

    ''050-alias-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin as sine,

    cos as cosine,

    tan,

    trig as trignometry,

    };

    */

    import {

    sine, ①

    cosine,

    tan,

    trignometry,

    } from ''./050-alias-exports'';

    ```


    The module we rely on aliases its members; therefore, as far as any consuming
    module is concerned, those are the public names, and therefore the only ones available
    for import.


    What if we wanted to import all exported members of another module? The import
    syntax supports the wildcard (`*`) syntax with one caveat—the import must then
    be namespaced as shown here:


    *Importing* *named members*


    *   ① Use the wildcard operator to import all the exported members in one fell
    swoop


    *   ② Tucked under the namespace members are visible using their public name


    ```

    /*

    ''050-alias-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin as sine,

    cos as cosine,

    tan,

    trig as trignometry,

    };

    */

    import * as trigFns from ''./050-alias-exports''; ①

    console.log(trigFns.sine(0)); ②

    ```


    Using the wildcard operator increases the changes of collisions between names,
    especially if a large number of other modules are being imported. The `as` namespacing
    attempts to eliminate this possibility. Correspondingly, if we import two separate
    modules accidentally with the same name, we will get an error.


    ### Aliasing Imports


    There is a chance that one or more modules being imported may export members with
    the same name; in which case, we need a mechanism to resolve name collisions.
    This is not an issue when we use the wildcard syntax since the imports are namespaced
    to begin with. However, if we are importing individual members of a module, and
    we have to resolve conflicts, we can alias an import just like we can alias exports:


    *   ① Alias imports


    ```

    /*

    ''030-named-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    trig,

    }

    */

    import {

    sin as sine, ①

    cos as cosine,

    trig as trignometry,

    } from ''./030-named-exports'';

    ```


    Aliasing imports, outside of aiding in avoiding collisions, also allows us to
    “rename” functions that perhaps might be too long, or help them fit better with
    the domain we are working with.


    Default exports, once again, prove to be a problem child. Since default exports
    are unnamed exports, the consuming module can call that default export anything
    they want!


    *   ① Import the default giving it an arbitrary name


    *   ② Use the default import just as we would any other member


    ```

    /*

    ''040-default-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    export default trig;

    */

    import myTrignometry, { ①

    sin,

    cos,

    tan,

    } from ''./040-default-exports'';

    console.log(myTrignometry.sin()); ②

    ```


    Often times, when modules export default members, since the name of the import
    is not mandated, different consumers within the same project refer to the default
    export using different names, making it incredibly hard to find where a member
    is being used. This forces developers working with such exports to settle on a
    naming convention in an attempt to bring the naming to parity with named exports.^([^(82)](#fn82))


    The syntax for importing, much like exporting, is rather flexible, and we can
    mix and match any and all combinations of imports. We could, for example, import
    the default, along with other named members with aliasing if we wish to do so:


    *   ① Import the default with any name


    *   ② Import named members with aliases


    *   ③ Use the imports just like we would any other time


    ```

    /*

    ''040-default-exports'' exports the following

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    export default trig;

    */

    import myTrignometry, { ①

    sin as sine, ②

    cos as cosine,

    tan,

    } from ''./040-default-exports'';

    console.log(myTrignometry.sin()); ③

    console.log(sine(45));

    ```


    The primary driving force behind the import style remains on how a module exports
    its members. Simultaneously, features like aliasing imports in a particular module
    *may* be driven by considerations like avoiding name collisions, or attempting
    to make the imported functions seem more accommodating to the domain at hand.
    However, we must persevere to refrain from using these features from a stylistic
    mindset, so as to not introduce too much overhead on anyone who is attempting
    to maintain the codebase.


    ## Caveats and Implications


    The syntax for ES6 modules is designed around exports and imports being “static”—in
    that, they need to be top-level statements in module files. We are **not** allowed
    to dynamically or conditionally export or import members.^([^(83)](#fn83))


    There are several benefits to having static modules, with faster lookup, smaller
    bundles (if we are to use a bundling tool like Webpack or Rollup) due to deterministic
    dead code elimination. You can read more about the benefits of this approach in
    this exemplary blog post ( [`http://calculist.org/blog/2012/06/29/static-module-resolution/`](http://calculist.org/blog/2012/06/29/static-module-resolution/)
    ) by Dave Herman.'
  trans: '

    # 导入


    ES6 引入了 `import` 关键字，允许一个模块导入另一个模块。只有模块才能使用其他模块——普通的旧式 JavaScript 文件无法消费模块。此外，请记住，模块与文件存在一一对应的关系，即一个文件包含且仅包含一个模块，而该模块的名称就是文件本身的名称。


    `import` 语法由两部分组成——模块的名称以及要从该模块中导入的内容。指定模块就是简单地指定模块位置的路径。这里有趣的部分是实际导入已导出成员的机制，所以我们来讨论一下。


    如何导入另一个模块的成员，取决于这些成员最初是如何导出的。我们知道，一个模块可以导出命名成员和默认成员。我们从如何使用命名成员开始讲起。


    消费一个具有命名导出的模块，会强制要求消费方使用与导出成员相同的名称。考虑以下示例：


    * ① 导入此模块所需的成员


    ```

    /*

    ''030-named-exports'' 导出了以下内容

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    trig,

    }

    */

    import { ①

    sin,

    cos,

    tan,

    } from ''./030-named-exports'';

    // 使用这些函数

    console.log(sin(0));

    ```


    关于如何从另一个模块导入我们感兴趣的片段，有几点需要注意。`import` 语法看起来与我们之前在章节中看到的结构赋值语法非常相似。我们还能够挑选我们感兴趣的成员，因此允许只导入某些成员，尽管该模块可能导出更多内容。


    请记住，成员的名称就是模块中导出的名称。因此，如果导出的成员被起了别名，那么我们必须导入这些别名：


    * ① 在导入中使用别名


    ```

    /*

    ''050-alias-exports'' 导出了以下内容

    export {

    degreesToRadians,

    gradiansToRadians,

    sin as sine,

    cos as cosine,

    tan,

    trig as trignometry,

    };

    */

    import {

    sine, ①

    cosine,

    tan,

    trignometry,

    } from ''./050-alias-exports'';

    ```


    我们依赖的模块为其成员起了别名；因此，对于任何消费方模块而言，这些就是公共名称，因此也是唯一可用于导入的名称。


    如果我们想导入另一个模块的所有导出成员呢？`import` 语法支持通配符（`*`），但有一个限制——导入必须像此处所示命名空间化：


    *导入命名成员*


    * ① 使用通配符一次性导入所有导出的成员

    * ② 归入命名空间下的成员，使用其公共名称即可访问


    ```

    /*

    ''050-alias-exports'' 导出了以下内容

    export {

    degreesToRadians,

    gradiansToRadians,

    sin as sine,

    cos as cosine,

    tan,

    trig as trignometry,

    };

    */

    import * as trigFns from ''./050-alias-exports''; ①

    console.log(trigFns.sine(0)); ②

    ```


    使用通配符会增加名称冲突的可能性，尤其是在导入大量其他模块时。`as` 命名空间试图消除这种可能性。相应地，如果我们不小心导入了两个同名但不同的模块，将会收到一个错误。


    ## 别名导入


    有可能一个或多个被导入的模块导出了同名的成员；在这种情况下，我们需要一种机制来解决名称冲突。当我们使用通配符语法时，这不是问题，因为导入从一开始就是命名空间化的。然而，如果我们正在导入模块的单个成员，并且必须解决冲突，我们可以像给导出起别名一样给导入起别名：


    * ① 为导入起别名


    ```

    /*

    ''030-named-exports'' 导出了以下内容

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    trig,

    }

    */

    import {

    sin as sine, ①

    cos as cosine,

    trig as trignometry,

    } from ''./030-named-exports'';

    ```


    为导入起别名，除了有助于避免冲突之外，还允许我们“重命名”那些可能过于冗长的函数，或者使它们更好地适应我们正在处理的领域。


    默认导出再次证明是个“问题儿童”。由于默认导出是未命名的导出，消费方模块可以任意命名该默认导出！


    * ① 导入默认导出并赋予一个任意名称

    * ② 像使用任何其他成员一样使用默认导入


    ```

    /*

    ''040-default-exports'' 导出了以下内容

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    export default trig;

    */

    import myTrignometry, { ①

    sin,

    cos,

    tan,

    } from ''./040-default-exports'';

    console.log(myTrignometry.sin()); ②

    ```


    通常，当模块导出默认成员时，由于导入的名称并非强制规定，同一项目中的不同消费方可能会使用不同的名称来引用默认导出，这使得查找某个成员在何处被使用变得异常困难。这迫使处理此类导出的开发者们必须约定一个命名规范，试图让命名与命名导出保持一致。^(⁸²)


    导入的语法，与导出的语法类似，相当灵活，我们可以混合搭配任何及所有导入组合。例如，如果我们愿意，我们可以在导入默认导出的同时，对其他命名成员使用别名：


    * ① 用任意名称导入默认导出

    * ② 用别名导入命名成员

    * ③ 像往常一样使用这些导入


    ```

    /*

    ''040-default-exports'' 导出了以下内容

    export {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    export default trig;

    */

    import myTrignometry, { ①

    sin as sine, ②

    cos as cosine,

    tan,

    } from ''./040-default-exports'';

    console.log(myTrignometry.sin()); ③

    console.log(sine(45));

    ```


    导入风格的主要驱动力仍然取决于模块如何导出其成员。与此同时，在特定模块中为导入起别名等功能，*可能* 是出于诸如避免名称冲突或试图让导入的函数更适合当前领域等考虑。然而，我们必须努力避免出于风格化的心态而使用这些功能，以免给任何试图维护代码库的人带来过多负担。


    # 注意事项与影响


    ES6 模块的语法设计基于导出和导入是“静态”的这一原则——也就是说，它们必须是模块文件中的顶级语句。我们**不允许**动态地或有条件地导出或导入成员。^(⁸³)


    静态模块有若干好处，包括更快的查找速度、由于确定性死代码消除而生成的更小的打包文件（如果我们使用像 `Webpack` 或 `Rollup` 这样的打包工具）。你可以在这篇由
    Dave Herman 撰写的优秀博文（ [`http://calculist.org/blog/2012/06/29/static-module-resolution/`](http://calculist.org/blog/2012/06/29/static-module-resolution/)
    ）中阅读更多关于此方法好处的内容。

    '
- fmt: '## Summary


    Phew! Who thought that packaging our code to be easily consumable would be this
    tricky? While it may seem that the module syntax introduced in ES6 is overkill,
    we must bear in mind that JavaScript is a language that straddles both sides of
    the wire, in that, it runs in the browser and on the server. Therefore, it will
    serve us well to remember that any syntax added for modules needs to accommodate
    both ecosystems.


    In the next chapter, we will explore proxies that allow us to magically adorn
    both new and existing objects with additional functionality without actually modifying
    the objects themselves.


