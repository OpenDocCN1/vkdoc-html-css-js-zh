- fmt: '# The Dangers of Variable Scoping


    JavaScript supports both statements and expressions, and typically, to capture
    the value that results from an evaluation, we use variables. There are times though
    when a variable, despite its name, isn’t a variable, but designated to be a constant.
    That is, once set, we *intend* for the value of the variable to not change over
    time.


    However, up until now, JavaScript provided us with only one keyword, namely `var`,
    to initialize variables, regardless of whether they were to see their values change
    (consider the index in a `for` loop), or be constant. For the latter, developers
    resorted to a naming convention, typically upper-snake-case, like `SOUTH_WEST`,
    alluding that it be treated like a constant, with no runtime support from the
    language.


    Thus, not only was the use of `var` overloaded, to add insult to the injury, it
    presented us with a few stumbling blocks. Variables declared with `var` are automatically
    hoisted to the top of the current scope. Furthermore, redeclaring two `var`s with
    the same name in the same scope does not throw an error. Combine these two, and
    the result can prove to be rather insidious as demonstrated here:


    *   ① A top level variable declaration

    *   ② Seemingly “shadows” the outer declaration

    *   ③ Turns out, the two variables are one and the same!


    ```

    function insidious() {

    var functionScoped = ''Outer declaration''; ①

    if (true) {

    var functionScoped = ''Inner declaration''; ②

    }

    console.log(functionScoped); ③

    return functionScoped;

    }

    // prints ''Inner declaration''

    insidious();

    ```


    One *may* assume that the inner nested `functionScoped` is scoped within the `if`
    block, which is **not** true! In fact, the second declaration of `functionScoped`
    is a no-op. *However*, this does not prevent JavaScript from declaring the variable
    *once* (at the top) and then reassigning the value of the variable further down,
    as reflected in the output. To avoid any confusion, JavaScript developers tend
    to declare all the variables that are to be used within a function upfront.


    This notion of `var`s not being block scoped is certainly surprising, since many
    languages scope variables *lexically*. That is, the variable in these languages
    is scoped textually within the enclosing parentheses, and not visible outside
    of the scope created by the block. This might lean one to believe that `var`s
    are scoped, when in reality they are not, and can have inexplicable outcomes.
    Consider the following example:


    *   ① Simulate the DOM with three buttons

    *   ② For each button, add a `click` handler

    *   ③ All print `Item 4 is clicked`


    ```

    function simulateDom() {

    var pseudoDom = {

    button1: {},

    button2: {},

    button3: {},

    }; ①

    for (var i = 1; i <= 3; i++) {

    var element = pseudoDom[''button'' + i];

    element.click = function () {

    return ''Item '' + i + '' is clicked.''; ②

    };

    }

    console.log(pseudoDom.button1.click());

    console.log(pseudoDom.button2.click());

    console.log(pseudoDom.button3.click()); ③

    return pseudoDom;

    }

    // prints ''Item 4 is clicked.'' 3 times

    simulateDom();

    ```


    Since the variable `i` is hoisted *outside* the `for` loop, and is not local to
    the `for` loop itself, every click handler “sees” the same `i`. At the end of
    the loop, the value of `i` is predictably 4, which is reported on any button click.


    Summarizing, any `var` declared within a function is scoped to that function,
    even if it *is* defined within a block.


    ## What about `strict mode`?


    ES5 introduced `strict mode` as an opt-in feature as a way to restrict some JavaScript
    behavior. This was done in part to make the transition to future versions of JavaScript
    easier, by changing the semantics of the code and in particular disallowing some
    behaviors. While `strict mode` does help prevent some rather nasty errors from
    occurring, for example, inadvertently declaring “global” variables (variables
    declared within functions without the `var` keyword), it does **not** change the
    scoping rules that we have discussed so far.


    Using `strict mode` with ES5 code is **highly** encouraged, and as we embark on
    a journey to understand and adopt ES6+, it would be prudent to incrementally introduce
    `strict mode` in our existing scripts. This will certainly make converting them
    to ES6 easier. The documentation for `strict mode` is available at [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode).


    In summary, if all the above makes your head spin, then you are not alone. Navigating
    JavaScripts scoping rules is hard enough; combining that with `var`-iable hoisting
    further muddies the waters. In order to address some of the concerns surrounding
    `var`s, ES6 activated^([^(12)](#fn12)) `let`. `let` addresses many of the scoping
    deficits that come with `var` as we will see in the following sections.


    Why `let` instead of simply fixing `var` you might ask. Well, we wouldn’t want
    to go about breaking the Internet, would we?


    ## `let`


    As you might have surmised, most of the confusion around `var`s exist because
    `var`s do not respect “block” scope. A block in JavaScript is a way to collect
    one or more statements; in other words, they allow us to create a compound statement.
    Blocks are delimited by a pair of curly brackets, and if you are thinking, “Wait.
    Looping constructs (like `for` and `while`) and conditional statements (like `if`
    and `else`) use curly brackets. Are those blocks?” then you are right.


    Blocks do not introduce scope. However, ES6 introduces block scope for variables
    that are defined using the `let` keyword. A variable defined with the `let` keyword
    will be scoped within the closest enclosing block. In other words, variables defined
    with the `let` keyword are lexically scoped to the closest enclosing block:


    *   ① A variable declared *within* a block cannot be referenced outside of the
    block

    *   ② A variable declared with the `let` syntax

    *   ③ Like before, the variable is not visible outside of the scope defined by
    the `if` block


    ```

    function letFunction() {

    // console.log(''Before defining block'', scopedLet); ①

    if (true) {

    let scopedLet = ''I am scoped within a block!''; ②

    }

    // console.log(''After defining block'', scopedVar); ③

    }

    // invoke it

    letFunction();

    ```


    We can breathe a sigh of relief! Variables declared with the `let` keyword *seem*
    to follow the rules of scoping that you are used to coming from other languages,
    and they do reduce the contextual overhead associated with `var`s.


    Many of the issues (and potential bugs) that arise from the broad-reaching `var`
    scope can be averted by using `let` instead. Let us revisit our earlier example
    of a simulated DOM and see the effect of using `let`:


    *   ① `i` is local to the `for` loop

    *   ② Since `i` is a local variable, each handler sees the correct value of `i`

    *   ③ Predictably all the click handlers report the correct message


    ```

    function simulateDom() {

    let pseudoDom = {

    button1: {},

    button2: {},

    button3: {},

    };

    for (let i = 1; i <= 3; i++) { ①

    let element = pseudoDom[''button'' + i];

    element.click = function() {

    return ''Item '' + i + '' is clicked.''; ②

    };

    }

    console.log(pseudoDom.button1.click());

    console.log(pseudoDom.button2.click());

    console.log(pseudoDom.button3.click()); ③

    return pseudoDom;

    }

    // prints ''Item 1 is clicked.'', ''Item 2 is clicked.'', ''Item 3 is clicked.''

    simulateDom();

    ```


    As we can see, variables declared with `let` do respect the scope of the enclosing
    block, thus making the code a lot easier to reason about.


    Although `let` does simplify the scoping rules for variables, they too come with
    a few caveats, as we will see in the following section.'
  raw: '## The Dangers of Variable Scoping


    JavaScript supports both statements and expressions, and typically, to capture
    the value that results from an evaluation, we use variables. There are times though
    when a variable, despite its name, isn’t a variable, but designated to be a constant.
    That is, once set, we *intend* for the value of the variable to not change over
    time.


    However, up until now, JavaScript provided us with only one keyword, namely `var,`
    to initialize variables, regardless of whether they were to see their values change
    (consider the index in a `for` loop), or be constant. For the latter, developers
    resorted to a naming convention, typically upper-snake-case, like `SOUTH_WEST`,
    alluding that it be treated like a constant, with no runtime support from the
    language.


    Thus, not only was the use of `var` overloaded, to add insult to the injury, it
    presented us with a few stumbling blocks. Variables declared with `var` are automatically
    hoisted to the top of the current scope. Furthermore, redeclaring two `var`s with
    the same name in the same scope does not throw an error. Combine these two, and
    the result can prove to be rather insidious as demonstrated here:


    *   ① A top level variable declaration


    *   ② Seemingly “shadows” the outer declaration


    *   ③ Turns out, the two variables are one and the same!


    ```

    function insidious() {

    var functionScoped = ''Outer declaration''; ①

    if (true) {

    var functionScoped = ''Inner declaration''; ②

    }

    console.log(functionScoped); ③

    return functionScoped;

    }

    // prints ''Inner declaration''

    insidious();

    ```


    One *may* assume that the inner nested `functionScoped` is scoped within the if
    block, which is **not** true! In fact, the second declaration of `functionScoped`
    is a no-op. *However*, this does not prevent JavaScript from declaring the variable
    *once* (at the top) and then reassigning the value of the variable further down,
    as reflected in the output. To avoid any confusion, JavaScript developers tend
    to declare all the variables that are to be used within a function upfront.


    This notion of `var`s not being block scoped is certainly surprising, since many
    languages scope variables *lexically*. That is, the variable in these languages
    is scoped textually within the enclosing parentheses, and not visible outside
    of the scope created by the block. This might lean one to believe that `var`s
    are scoped, when in reality they are not, and can have inexplicable outcomes.
    Consider the following example:


    *   ① Simulate the DOM with three buttons


    *   ② For each button, add a `click` handler


    *   ③ All print `Item 4 is clicked`


    ```

    function simulateDom() {

    var pseudoDom = {

    button1: {},

    button2: {},

    button3: {},

    }; ①

    for (var i = 1; i <= 3; i++) {

    var element = pseudoDom[''button'' + i];

    element.click = function () {

    return ''Item '' + i + '' is clicked.''; ②

    };

    }

    console.log(pseudoDom.button1.click());

    console.log(pseudoDom.button2.click());

    console.log(pseudoDom.button3.click()); ③

    return pseudoDom;

    }

    // prints ''Item 4 is clicked.'' 3 times

    simulateDom();

    ```


    Since the variable `i` is hoisted *outside* the `for` loop, and is not local to
    the `for` loop itself, every click handler “sees” the same `i`. At the end of
    the loop, the value of `i` is predictably 4, which is reported on any button click.


    Summarizing, any `var` declared within a function is scoped to that function,
    even if it *is* defined within a block.


    ### What about `strict mode`?


    ES5 introduced `strict mode` as an opt-in feature as a way to restrict some JavaScript
    behavior. This was done in part to make the transition to future versions of JavaScript
    easier, by changing the semantics of the code and in particular disallowing some
    behaviors. While `strict mode` does help prevent some rather nasty errors from
    occurring, for example, inadvertently declaring “global” variables (variables
    declared within functions without the `var` keyword), it does **not** change the
    scoping rules that we have discussed so far.


    Using `strict mode` with ES5 code is **highly** encouraged, and as we embark on
    a journey to understand and adopt ES6+, it would be prudent to incrementally introduce
    `strict mode` in our existing scripts. This will certainly make converting them
    to ES6 easier. The documentation for `strict mode` is available at [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode)
    .


    In summary, if all the above makes your head spin, then you are not alone. Navigating
    JavaScripts scoping rules is hard enough; combining that with `var`-iable hoisting
    further muddies the waters. In order to address some of the concerns surrounding
    `vars,` ES6 activated^([^(12)](#fn12)) `let`. `let` addresses many of the scoping
    deficits that come with `var` as we will see in the following sections.


    Why `let` instead of simply fixing `var` you might ask. Well, we wouldn’t want
    to go about breaking the Internet, would we?


    ### `let`


    As you might have surmised, most of the confusion around `var`s exist because
    `var`s do not respect “block” scope. A block in JavaScript is a way to collect
    one or more statements; in other words, they allow us to create a compound statement.
    Blocks are delimited by a pair of curly brackets, and if you are thinking, “Wait.
    Looping constructs (like `for` and `while`) and conditional statements (like `if`
    and `else`) use curly brackets. Are those blocks?” then you are right.


    Blocks do not introduce scope. However, ES6 introduces block scope for variables
    that are defined using the `let` keyword. A variable defined with the `let` keyword
    will be scoped within the closest enclosing block. In other words, variables defined
    with the `let` keyword are lexically scoped to the closest enclosing block:


    *   ① A variable declared *within* a block cannot be referenced outside of the
    block


    *   ② A variable declared with the `let` syntax


    *   ③ Like before, the variable is not visible outside of the scope defined by
    the `if` block


    ```

    function letFunction() {

    // console.log(''Before defining block'', scopedLet); ①

    if (true) {

    let scopedLet = ''I am scoped within a block!''; ②

    }

    // console.log(''After defining block'', scopedVar); ③

    }

    // invoke it

    letFunction();

    ```


    We can breathe a sigh of relief! Variables declared with the `let` keyword *seem*
    to follow the rules of scoping that you are used to coming from other languages,
    and they do reduce the contextual overhead associated with `var`s.


    Many of the issues (and potential bugs) that arise from the broad-reaching `var`
    scope can be averted by using `let` instead. Let us revisit our earlier example
    of a simulated DOM and see the effect of using `let`:


    *   ① `i` is local to the `for` loop


    *   ② Since `i` is a local variable, each handler sees the correct value of `i`


    *   ③ Predictably all the click handlers report the correct message


    ```

    function simulateDom() {

    let pseudoDom = {

    button1: {},

    button2: {},

    button3: {},

    };

    for (let i = 1; i <= 3; i++) { ①

    let element = pseudoDom[''button'' + i];

    element.click = function() {

    return ''Item '' + i + '' is clicked.''; ②

    };

    }

    console.log(pseudoDom.button1.click());

    console.log(pseudoDom.button2.click());

    console.log(pseudoDom.button3.click()); ③

    return pseudoDom;

    }

    // prints ''Item 1 is clicked.'', ''Item 2 is clicked.'', ''Item 3 is clicked.''

    simulateDom();

    ```


    As we can see, variables declared with `let` do respect the scope of the enclosing
    block, thus making the code a lot easier to reason about.


    Although `let` does simplify the scoping rules for variables, they too come with
    a few caveats, as we will see in the following section.'
