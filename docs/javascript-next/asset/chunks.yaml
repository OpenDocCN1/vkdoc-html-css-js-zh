    const plane = [];

    plane.push(pilot);

    plane.push(crewMember);

    plane.push(passengers.sort(byStatus)); ②

    return plane;

    };

    const passengerOne = {

    name: ''James'',

    status: ''silver'',

    };

    const passengerTwo = {

    name: ''Joseph'',

    status: ''platinum'',

    };

    // invoke it

    const plane = boardPlane(''Amelia'', ''Rosemary'', passengerOne, passengerTwo);

    console.assert(Array.isArray(plane));

    // verify pilots and crew board first

    console.assert(plane[0] === ''Amelia'');

    console.assert(plane[1] === ''Rosemary'');

    // verify that passengers board by status

    console.assert(Array.isArray(plane[2]));

    console.assert(plane[2][0] === passengerTwo);

    console.assert(plane[2][1] === passengerOne);

    ```


    Almost magically, the code is shorter, with its intent clear. There is no unnecessary
    coercion, and since we no longer have to account for extras like we did for `arguments`,
    errors like off-by-one are completely eliminated. Instead we get a real array
    holding all the arguments supplied that make up the "rest" of the arguments. A
    glance at the function signature tells us all we need to know—this is a multi-arity
    function, that needs at least two arguments that are aptly named, and potentially
    a list of passengers.


