- fmt: '# Modeling Using Classes


    ES6 introduces us to the `class` keyword, allowing us to express types in a manner
    that finds parity with other languages. Let us start with simply defining the
    `Person` class, and then we will see how inheritance works following that:


    * ① Use the newly activated `class` keyword

    * ② Define a constructor for our type

    * ③ Define an instance method

    * ④ And then another


    ```

    class Person { ①

    constructor(name) { ②

    this.name = name;

    }

    getName() { ③

    return this.name;

    }

    sayHello(to) { ④

    return `Hello ${to.getName()}. My name is ${this.name}.`;

    }

    }

    const raju = new Person(''Raju'');

    const venkat = new Person(''Venkat'');

    // prints ''Hello Venkat. My name is Raju''

    console.log(raju.sayHello(venkat));

    ```


    Right off the bat, a sigh of relief!^([^(70)](#fn70))


    We introduce a "class" `Person`, with a single-argument constructor. JavaScript
    requires that if we do *need* a constructor, it must be called `constructor` and
    we are only allowed to have one constructor per class. However, if our class does
    not do any work at construction time, then we do not have to write a constructor,
    and in that case JavaScript will provide us with a default no-argument constructor.


    We can also tack on functions to the class like regular methods. JavaScript classes
    **cannot** have member variables—if we wish to tack on a property on the instance,
    we must use `this` inside the constructor or any instance method.


    Also, all methods in a class, `constructor` included, benefit from many of the
    features that we have explored—default parameters, destructuring, and spread arguments
    are all fair game. Using one or more of these features in unison is how we would
    accomplish overloaded methods for our instances.


    As our demonstration shows, the behavior is exactly like we had it working with
    functions. Onto inheritance!


    As we attempted earlier, we want `SuperHero` to inherit from `Person`. Let us
    see how we can accomplish this using the new syntax:


    * ① Use the `extends` keyword

    * ② Define the constructor

    * ③ Ensure `super` is invoked

    * ④ Define a `SuperHero` instance method


    ```

    class SuperHero extends Person { ①

    constructor(name, superpower) { ②

    super(name); ③

    this.superpower = superpower;

    }

    warCry() { ④

    return `My name is ${this.name}!!!`;

    }

    }

    const thor = new SuperHero(''Thor'', ''Mjolnir'');

    // prints ''My name is Thor!!!''

    console.log(thor.warCry());

    // prints ''Hello Venkat. My name is Thor''

    console.log(thor.sayHello(venkat));

    ```


    In order to extend another class, we simply use the `extends` keyword, wherein
    we tell what type we wish to extend. The **first** thing we are **required** to
    do in the subtype is to invoke `super` with all of the arguments the parent needs.
    The rest should be no surprise. Once again, we see that the behavior is no different
    than what we saw in our function-based implementation.


    Classes are allowed to have instance methods like we have seen. They are also
    allowed to both instance-level and class-level (`static`) attributes, as well
    as `static` methods. However, attributes cannot be introduced inside the class
    body, and this includes `static` ones. If we wish to do so, we are forced to define
    them *outside* the class body.


    A static method on the other hand is defined like an instance method except it
    is prefixed with the `static` keyword. Such methods can only be accessed on the
    type, via `Classname.staticMethod()`. Let us look at an example where we keep
    track of, and report on the number of superheroes we have constructed:


    * ① Increment the static counter each time the constructor is invoked

    * ② Define a static method that returns the count of superheroes

    * ③ Define an attribute to keep count

    * ④ Invoke the static method


    ```

    class SuperHero extends Person {

    constructor(name, superpower) {

    super(name);

    this.superpower = superpower;

    SuperHero.internalCount += 1; ①

    }

    static count() { ②

    return SuperHero.internalCount;

    }

    }

    SuperHero.internalCount = 0; ③

    const thor = new SuperHero(''Thor'', ''Mjolnir'');

    const blackWidow = new SuperHero(''Black Widow'', ''weapons specialist'');

    // prints ''We have 2 superheroes!''

    console.log(`We have ${SuperHero.count()} superheroes!`); ④

    ```


    We can reference any static attribute or method by calling them using the class
    name. However, we have to declare (and in this case initialize) the static property
    outside the definition of our class. This qualification is also applicable to
    nonstatic, or instance-level attributes.


    Finally, JavaScript does **not** support modifiers, such as `private` or `public`.
    All attributes and methods defined on a class are public. This again is a departure
    from traditional languages like Java or C#.


    Despite these limitations, I believe we can start to appreciate how this syntax
    drastically reduces the amount of wiring we have to do by hand, thus reducing
    any subtle bugs we might introduce when building our own inheritance trees. Admittedly,
    it feels rather declarative, vs. the imperative modus operandi we adopted when
    using functions.


    Furthermore, to folks coming in from other (class-based) languages, this syntax
    is very familiar, and thus feels very empowering. This syntax, already in use
    by frameworks like Angular and libraries like React, makes it far easier for designers
    to allow mechanisms that allow client code to hook into the life cycle offered
    by the same.


    ## Caveats


    If the amount of time and effort it takes to explain prototypal inheritance in
    JavaScript using functions is any measure, then the new syntax wins hands down.
    Discussing the new syntax almost seems natural, as compared to the extremely intricate
    and delicate wiring using the old syntax, while accomplishing exactly the same
    thing.


    That said, we are not out of the woods yet. JavaScript has and will continue using
    prototypal inheritance. The new syntax that ES6 offers is simply syntactic sugar
    on top of the old! Hence the slightly negative news—we, as JavaScript developers,
    **must** realize this, and take it upon ourselves to truly understand how prototypal
    inheritance works under the covers. There is **no** escaping this, and, as JavaScript
    developers, it behooves us to know how the language really works.


    ## Summary


    JavaScript has always supported the idea of types, as well as inheritance, albeit
    in a manner that was cumbersome, and one that necessitated an intimate understanding
    of how (constructor) functions, prototypes, and instances interplayed with one
    another to make all the magic happen. In this chapter we learned how we can use
    the new keywords like `class` and `extends` to clearly elucidate what our instances
    are to look like. We also shined a spotlight on the fact that under the covers
    this new syntax simply sugars prototypal inheritance, and the pitfalls of always
    thinking in "object oriented" mode, when perhaps thinking functionally might serve
    us better.


    In the next chapter we will focus on modules that attempt to fill a much-needed
    gap in JavaScript, namely modules, once and for all doing away with all the schemes
    we have drummed up to "namespace" our code.


