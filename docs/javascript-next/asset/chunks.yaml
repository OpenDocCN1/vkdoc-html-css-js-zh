    # 4. Divide and Conquer with Object and Array Destructuring


    JavaScript lets us easily create “bags of data” using objects and arrays, permitting
    us the ability to fluidly wrap data and ship it around in our code. However, the
    syntax afforded to us to “reach” into these data structures tends to be verbose,
    imperative, and error-prone. In ES6 and ES9, JavaScript adopts yet another functional
    construct in the form of the destructuring syntax to improve our experience with
    unwrapping data, bringing it to parity with how we wrap data in the first place.


    In this chapter we will see how the new destructuring syntax for both objects
    and arrays provide an elegant mechanism to reach into data structures. We will
    also learn to couple this with our understanding of default and rest parameters,
    and how these two features work hand in hand to define functions that eloquently
    express their expectations while being more flexible. By the end of this chapter,
    we will be safely querying objects and arrays using a clear, succinct, and highly
    expressive syntax, while improving the way we detail out function signatures.'
  trans: '

    ### `rest` 参数的细节（或者说 `rest` 参数的细节？）


    剩余参数（Rest parameters）远没有我们目前讨论的其他特性那么微妙复杂。如果一个函数使用了剩余参数，那么该参数必须是参数列表中的最后一个。这是有道理的，因为它作为一个贪婪运算符，会吞下所有尚未被指定的参数。在函数签名中，如果在剩余参数之后声明参数，将会导致
    `SyntaxError` 错误。


    与常规参数不同，剩余参数**不能**被赋予默认值。剩余参数有一个隐式的默认值，即一个空数组。换句话说，如果没有剩余参数可供消耗，它将默认为一个长度为 `0`
    的数组。这非常方便，因为我们不必进行 `undefined` 检查。


    鉴于剩余参数允许我们定义多参数函数，让我们看看它如何与函数的 `length` 属性配合工作。回想一下，函数的 `length` 属性返回其签名中定义的正式参数数量。事实证明，剩余参数**不**计入函数的参数计数。


    函数也没有暴露一个 API 来确定某个特定函数是否确实使用了剩余参数。虽然这符合 JavaScript 最初设计中每个函数都是隐式多参数的风格，但也让我们无法通过编程方式发现最后一个参数是否是剩余参数。


    最后，我们讨论剩余参数和 `arguments` 对象。虽然箭头函数没有 `arguments` 对象，但常规函数仍然有。正如你所料，`arguments`
    对象的工作方式符合预期——它收集所有传递给函数的**所有**参数，而不考虑最后一个参数是剩余参数这一事实。


    让我们用一个简单的例子快速探索所有这些内容：


    * ① 参数个数不包含函数表达式中的剩余参数

    * ② 箭头函数也是如此

    * ③ `arguments.length` 报告调用时提供的总参数数量


    ```

    function fnExpression(a, b, ...c) {

    console.log(arguments.length);

    }

    const fnArrow = (a, b, ...c) => {

    // 没有 arguments 对象

    };

    console.assert(fnExpression.length === 2); ①

    console.assert(fnArrow.length === 2); ②

    // 输出 ''6''

    fnExpression(1, 2, 3, 4, 5, 6); ③

    ```


    ### 总结


    默认参数让我们在定义函数签名时更具表现力。它们用合适的默认值替代了多余的检查，从而使代码的意图更清晰。默认参数值在调用时求值，允许我们在程序的运行时上下文中延迟设置参数。由于参数可以“看到”函数签名中左侧定义的参数，我们可以尝试实现多态函数，并启用其他语言中可能使用的“重载”方法的概念。


    剩余参数消除了在编写多参数函数时使用 `arguments` 对象的必要性，其额外好处是提供了显式函数签名支持。这有助于消除代码中不必要的强制转换，并提供一种机制来干净地捕获所有未被参数占用的参数。


    默认参数和剩余参数都不能取代良好 API 设计的必要性；事实上，它们起到了相反的作用。通过强调从左到右优先级递减的参数，它们迫使我们区分哪些参数是必需的且必须提供，哪些是我们*可能*能够设置默认值的。


    所有这些都减少了客户在使用我们的 API 时必须承担的上下文开销。这难道不值得庆祝吗？


    在下一章中，我们将研究一项改进，该改进针对 JavaScript 中查询数组元素或对象值的内在机制，使用新的展开运算符和解构语法。这些与默认参数结合使用，使我们能够在函数签名中更具表现力。


    脚注 1 2 3 4


    # 4. 使用对象和数组解构分而治之


    JavaScript 允许我们使用对象和数组轻松创建“数据包”，使我们能够流畅地封装数据并在代码中传递。然而，我们用来“触及”这些数据结构的语法往往冗长、命令式且容易出错。在
    ES6 和 ES9 中，JavaScript 采用了另一种函数式构造——解构语法，以改善我们解包数据的体验，使其与我们最初封装数据的方式达到一致。


    在本章中，我们将了解对象和数组的新解构语法如何提供一种优雅的机制来访问数据结构。我们还将学习将其与我们已掌握的默认参数和剩余参数知识相结合，并了解这两个特性如何协同工作，以定义能清晰表达其预期同时更灵活的函数。在本章结束时，我们将能够使用清晰、简洁且极具表现力的语法安全地查询对象和数组，同时改善我们详细描述函数签名的方式。

