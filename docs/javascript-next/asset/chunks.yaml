- fmt: '## `let` 变量会被提升


    事实证明，使用 `let` 声明的变量确实会被提升到其所在块的顶部。*然而*，在变量*定义之前*尝试引用该变量会导致错误。这与 `var` 的行为不同，对于
    `var` 我们确实可以在其定义之前“看到”该变量（只是它求值为 `undefined`）。


    请看下面的示例：


    * ① 引入一个人工块

    * ② `foo` 在声明之前引用了 `bar`

    * ③ 我们定义 `bar`

    * ④ 然后调用 `foo`


    ```

    var foo;

    { ①

    foo = function() {

    console.log(''I am'', bar); ②

    };

    let bar = ''Bar''; ③

    // invoke it

    // foo(); ④

    }

    ```


    我们可以推断出这里发生了什么。`bar` 的声明被移动到了所在块的顶部，从而允许它在声明之前被使用。


    就其本身而言，这个特性本身可能看起来并不麻烦。然而，`let` 还带来了另一个限制：你**不**允许在同一作用域内定义两个同名的变量（这再次与 `var`
    的行为不同）。在这种情况下，JavaScript 会抛出一个 `SyntaxError`。


    也许下面的例子可以说明问题：


    * ① 引入一个变量

    * ② 这会抛出一个错误！

    * ③ 这也会抛出一个错误


    ```

    function determineFavoriteDrink(profession) {

    switch (profession) {

    case ''Programmer'':

    let drink = ''coffee''; ①

    break

    case ''Yoga instructor'':

    let drink = ''tea''; ②

    break;

    default:

    let drink = ''water''; ③

    break;

    }

    return drink;

    }

    // results in a ''SyntaxError''

    console.log(determineFavoriteDrink(''Programmer''));

    ```


    调用该函数会导致 `SyntaxError`！原因是 `let` 同时执行提升操作**并且**阻止同一变量的重新定义。这个例子警示我们，当开始将代码从使用
    `var` 迁移到 `let` 时，我们不能简单地将 `var` 替换为 `let`。`var` 可能允许我们侥幸写出草率的代码；然而，`let` 正确地收紧了规则，我们必须小心谨慎，确保重构后一切正常。不过，这对我们也有好处——`let`
    展示了合理的语义，仅凭这一点就足以让我们再也不使用 `var`。


    ## 不再需要IIFE


    JavaScript 对 `var` 缺乏作用域的限制，常常导致人们使用创造性的解决方案来创建私有变量。其中一种解决方案是使用“立即执行函数表达式”（IIFE）。让我们来看看同一个功能的前后版本，一个使用带
    IIFE 的 `var`，另一个使用带块的 `let`：


    * ① 通过创建一个匿名函数来引入人工块

    * ② 这个 `var` 将被限定在声明的函数作用域内

    * ③ 通过 `return` 一个对象来暴露公共 API

    * ④ 这将导致一个 `ReferenceError`

    * ⑤ 你可以使用公共 API

    * ⑥ 调用公共 getter


    ```

    const counter = (function createCounter() { ①

    var steps = 0; ②

    function increment() {

    steps++;

    }

    function getCount() {

    return steps;

    }

    return {

    increment: increment,

    getCount: getCount,

    }; ③

    }());

    // use it

    // console.log(steps); ④

    counter.increment(); ⑤

    console.assert(counter.getCount() === 1); ⑥

    ```


    有了 `let`，我们不再需要使用 IIFE，因为我们可以简单地用花括号将代码包围起来，从而创建一个封闭的作用域！


    * ① 使用花括号引入人工块

    * ② 这个变量自动限定在块作用域内

    * ③ 将函数声明转换为函数表达式

    * ④ 简单地将一个变量赋值，使其在块外部可用

    * ⑤ 我们仍然无法“看到”这个用 `let` 声明的变量

    * ⑥ 但你可以使用公共 API

    * ⑦ 调用公共 getter


    ```

    let counter;

    { ①

    let steps = 0; ②

    let increment = function () { ③

    console.log(''increment'');

    steps++;

    };

    let getCount = function () {

    return steps;

    };

    counter = {

    increment: increment,

    getCount: getCount,

    }; ④

    }

    // use it

    // console.log(steps); ⑤

    counter.increment(); ⑥

    console.assert(counter.getCount() === 1); ⑦

    ```


    这两个示例都试图限制 `increment` 和 `getCount` 函数的可见性。然而，利用 `let` 可以让我们消除使用 `var` 所涉及的所有仪式性代码。


    ## `const`


    ES6 引入了另一个关键字，即 `const`。顾名思义，它将定义一个常量。换句话说，它定义一个一旦声明其值就无法更改的变量。


    除了 `const` 不能被重新赋值之外，我们目前讨论的关于 `let` 的所有内容也适用于 `const`——它们具有块作用域，会被提升到所在块的顶部，并且不能在同一作用域内声明两个同名的
    `const`。


    重要的是，我们要记住，不能更改的是 `const` 变量的*绑定*。这一点很重要，因为 JavaScript 对象（例如 `Object` 和 `Array`）本质上是可变的。也就是说，如果一个
    `const` 被赋值为一个对象的引用，那么无法更改的是那个*引用*；对象本身可以改变，而 `const` 将看到那个改变。也许通过代码更容易理解这一点。


    * ① 一个值引用

    * ② 一个对象引用

    * ③ 重新赋值会失败并抛出 `TypeError`

    * ④ 但是我们可以修改被引用的对象


    ```

    const VALUE_REFERENCE = ''This cannot be re-assigned''; ①

    const ARRAY_REFERENCE = [ ''I'', ''am'', ''mutable'' ]; ②

    // attempt re-assignment

    // VALUE_REFERENCE = false ③

    // ARRAY_REFERENCE = {}

    // Mutate the array object

    ARRAY_REFERENCE.push(''!''); ④

    // prints [ ''I'', ''am'', ''mutable'', ''!'' ]

    console.log(ARRAY_REFERENCE);

    ```


    ### 不可变对象怎么办？


    `const` 限制自身仅使变量的绑定不可变。如果我们想要使 JavaScript 中的对象类型不可变，我们应该考虑使用例如 `Object.freeze`
    来“冻结”它，或者考虑使用像 Immutable.js^([(13)](#fn13)) 这样的库。


    另一点需要注意的是，声明一个没有初始值的 `const` 也会导致 `SyntaxError`。基本上，声明这样一个 `const` 会将该常量永久地赋值为
    `undefined`，考虑到 JavaScript 已经为这种情况提供了 `undefined` 关键字，这样做是多余的。


    最后，JavaScript 社区已经达成共识，将常量变量命名为全大写加下划线的形式。这使得在代码库中更容易识别常量。


    ## 在 ES6 及以后版本中使用 `var` 的理由


    我们现在知道，我们可以在任何使用 `var` 的地方使用 `let`，并获得一些额外的好处，比如更清晰的作用域规则。`const` 允许我们声明式地定义不可变的绑定。考虑到我们有了块作用域，我们可以摆脱像
    IIFE 这样的仪式性代码来实现封装。所有这一切都说明，对于使用 ES6+ 编写的任何代码，我们**不应该**再使用 `var`。


    我建议我们更进一步——我们应该寻找一种方式来编写代码，使其更多地使用 `const` 而不是 `let`。重新赋值变量会使代码难以阅读、理解和推理。在 `let`
    和 `const` 之间做选择时，我强烈鼓励选择后者，你会很快发现结果会更加清晰和干净。


    像 ESLint 这样的工具可以配置^([(14)](#fn14)) 为在检查 ES6+ 代码时将其视为错误，强烈建议我们这样做。`var` 将永远是 JavaScript
    历史的一部分；然而，现在是时候让我们转向在代码库中只使用 `let` 和 `const` 了。'
  raw: '#### Let Variables are Hoisted


    It turns out that variables declared with `let` do get hoisted to the top of their
    enclosing block. *However,* an attempt to reference such a variable *before* it
    is defined will result in an error. This is a departure from the behavior of `var`,
    where we can indeed “see” the variable prior to its definition (except that it
    evaluates to `undefined`).


    Consider the following example:


    *   ① Introduce an artificial block


    *   ② `foo` references `bar` before it is declared


    *   ③ We define `bar`


    *   ④ We then invoke `foo`


    ```

    var foo;

    { ①

    foo = function() {

    console.log(''I am'', bar); ②

    };

    let bar = ''Bar''; ③

    // invoke it

    // foo(); ④

    }

    ```


    We can surmise what happened here. The declaration of `bar` moved to the top of
    the enclosing block, allowing it to be used prior to its declaration.


    In and of itself, this feature (?) might not seem too troublesome. However, there
    is another constraint that `let` presents us with. That is, you are **not** allowed
    to define two variables in the same scope with the same name (this again is a
    departure from the behavior of `var`s). JavaScript will throw a `SyntaxError`
    in that scenario.


    Perhaps the following example will clarify things:


    *   ① Introduce a variable


    *   ② This will throw an error!


    *   ③ This too will throw an error


    ```

    function determineFavoriteDrink(profession) {

    switch (profession) {

    case ''Programmer'':

    let drink = ''coffee''; ①

    break

    case ''Yoga instructor'':

    let drink = ''tea''; ②

    break;

    default:

    let drink = ''water''; ③

    break;

    }

    return drink;

    }

    // results in a ''SyntaxError''

    console.log(determineFavoriteDrink(''Programmer''));

    ```


    Invocation of the function results in a `SyntaxError`! The reason is that `let`
    simultaneously hoists **and** prevents redefinition of the same variable. This
    example demonstrates a cautionary tale as we start to migrate our code from using
    `var` to `let`—we cannot simply replace `var` with `let. var` may have permitted
    us to get away with sloppy code; however, `let` correctly tightens things up,
    and we must exercise caution to ensure that all is well after refactoring. However,
    this is also to our benefit—`let` exhibits reasonable semantics, and this alone
    should prove sufficient for us to never use `var` again.


    #### No More IEFEs


    JavaScript’s lack of scoping for `var`s often led to the use of creative solutions
    to create private variables. One of these solutions was the use of an “Immediately
    Executing Function Expression” or IEFE. Let us take a before and after version
    of the same functionality, one using `var`s with an IEFE and one using `let` with
    blocks:


    *   ① Introduce artificial block by creating an anonymous function


    *   ② This `var` will be scoped within the declared function


    *   ③ Expose a public API by `return`-ing an object


    *   ④ This will result in a `ReferenceError`


    *   ⑤ You can use the public API


    *   ⑥ Invoke the public getter


    ```

    const counter = (function createCounter() { ①

    var steps = 0; ②

    function increment() {

    steps++;

    }

    function getCount() {

    return steps;

    }

    return {

    increment: increment,

    getCount: getCount,

    }; ③

    }());

    // use it

    // console.log(steps); ④

    counter.increment(); ⑤

    console.assert(counter.getCount() === 1); ⑥

    ```


    With `let` we no longer have to use an IEFE because we can simply surround our
    code with curly brackets to create an enclosing scope!


    *   ① Introduce artificial block using curly brackets


    *   ② This variable is automatically scoped within the block


    *   ③ Convert a function statement to a function expression


    *   ④ Simply assign a variable to be available outside of the block


    *   ⑤ We still cannot “see” the `let`-ted variable


    *   ⑥ But you can use the public API


    *   ⑦ Invoke the public getter


    ```

    let counter;

    { ①

    let steps = 0; ②

    let increment = function () { ③

    console.log(''increment'');

    steps++;

    };

    let getCount = function () {

    return steps;

    };

    counter = {

    increment: increment,

    getCount: getCount,

    }; ④

    }

    // use it

    // console.log(steps); ⑤

    counter.increment(); ⑥

    console.assert(counter.getCount() === 1); ⑦

    ```


    Both these examples attempt to limit the visibility of the `increment` and `getCount`
    functions. However, leveraging `let` allows us to eliminate all the ceremony involved
    with using `var`s.


    ### `const`


    ES6 activates another keyword, namely `const`. As the name suggests, this will
    define a constant. In other words, it defines a variable whose value cannot be
    changed once they have been declared.


    Other than the fact that `const`s cannot be reassigned, everything we have discussed
    so far about `let` applies to `const` as well—they have block scope, and will
    be hoisted to the top of the enclosing block, and we cannot declare two consts
    with the same name in the same scope.


    It is important for us to bear in mind that it is the *binding* of a `const` variable
    that cannot be changed. This has significance because JavaScript objects (such
    as `Object` and `Array`) are inherently mutable. Which is to say, if a `const`
    were assigned a reference to an object, it is that *reference* that cannot be
    changed; the object itself could change, and the `const` would see that change.
    Perhaps this is easier seen in code.


    *   ① A value reference


    *   ② An object reference


    *   ③ Reassignment fails with a `TypeError`


    *   ④ We can however mutate the referenced object


    ```

    const VALUE_REFERENCE = ''This cannot be re-assigned''; ①

    const ARRAY_REFERENCE = [ ''I'', ''am'', ''mutable'' ]; ②

    // attempt re-assignment

    // VALUE_REFERENCE = false ③

    // ARRAY_REFERENCE = {}

    // Mutate the array object

    ARRAY_REFERENCE.push(''!''); ④

    // prints [ ''I'', ''am'', ''mutable'', ''!'' ]

    console.log(ARRAY_REFERENCE);

    ```


    ### What about immutable objects?


    `const` constraints itself to make the binding of a variable immutable. If we
    want to make an object type in JavaScript immutable, we should consider “freezing”
    it with say `Object.freeze`, or consider using a library like Immutable.js.^([^(13)](#fn13))


    Another point of note is declaring a `const` with no initial value also results
    in a `SyntaxError`. Essentially declaring such a `const` will permanently assign
    the constant to `undefined`, which is redundant considering JavaScript already
    has the `undefined` keyword for such situations.


    Finally, the JavaScript community has converged around the convention of naming
    constant variables using upper case with underscores. This makes it easier to
    identify constants within the codebase.


    ## The Case for `var` in ES6 and Beyond


    We now know that we can use `let` anywhere we use `var` and get some added benefits
    like clearer scoping rules. `const`s allow us to declaratively define immutable
    bindings. Considering we have block scope, we can move away from ceremony like
    IEFEs for encapsulation. All this to say that for any code written using ES6+,
    we **should not** be using `var`s anymore.


    I suggest we take this a step further—we should be finding ways to write our code
    in a manner that uses `const` more than `let`. Reassigning variables makes it
    hard to read, understand, and reason about our code. Given a choice between `let`
    and `const,` I highly encourage to pick the latter, and you will soon realize
    how clearer and cleaner the result is.


    Tools like ESLint can be configured^([^(14)](#fn14)) to error when linting ES6+
    code, and it is highly recommended that we do so. `var` will forever remain a
    part of JavaScript’s history; however, it is time for us to move on to using only
    `let` and `const` in our codebases.'
  trans: '

    ## `let` 变量会被提升


    事实证明，使用 `let` 声明的变量确实会被提升到其所在块的顶部。*然而*，在变量*定义之前*尝试引用该变量会导致错误。这与 `var` 的行为不同，对于
    `var` 我们确实可以在其定义之前“看到”该变量（只是它求值为 `undefined`）。


    请看下面的示例：


    -   ① 引入一个人工块

    -   ② `foo` 在声明之前引用了 `bar`

    -   ③ 我们定义 `bar`

    -   ④ 然后调用 `foo`


    ```

    var foo;

    { ①

    foo = function() {

    console.log(''I am'', bar); ②

    };

    let bar = ''Bar''; ③

    // invoke it

    // foo(); ④

    }

    ```


    我们可以推断出这里发生了什么。`bar` 的声明被移动到了所在块的顶部，从而允许它在声明之前被使用。


    就其本身而言，这个特性本身可能看起来并不麻烦。然而，`let` 还带来了另一个限制：你**不**允许在同一作用域内定义两个同名的变量（这再次与 `var`
    的行为不同）。在这种情况下，JavaScript 会抛出一个 `SyntaxError`。


    也许下面的例子可以说明问题：


    -   ① 引入一个变量

    -   ② 这会抛出一个错误！

    -   ③ 这也会抛出一个错误


    ```

    function determineFavoriteDrink(profession) {

    switch (profession) {

    case ''Programmer'':

    let drink = ''coffee''; ①

    break

    case ''Yoga instructor'':

    let drink = ''tea''; ②

    break;

    default:

    let drink = ''water''; ③

    break;

    }

    return drink;

    }

    // results in a ''SyntaxError''

    console.log(determineFavoriteDrink(''Programmer''));

    ```


    调用该函数会导致 `SyntaxError`！原因是 `let` 同时执行提升操作**并且**阻止同一变量的重新定义。这个例子警示我们，当开始将代码从使用
    `var` 迁移到 `let` 时，我们不能简单地将 `var` 替换为 `let`。`var` 可能允许我们侥幸写出草率的代码；然而，`let` 正确地收紧了规则，我们必须小心谨慎，确保重构后一切正常。不过，这对我们也有好处——`let`
    展示了合理的语义，仅凭这一点就足以让我们再也不使用 `var`。


    ## 不再需要 IIFE


    JavaScript 对 `var` 缺乏作用域的限制，常常导致人们使用创造性的解决方案来创建私有变量。其中一种解决方案是使用“立即执行函数表达式”（IIFE）。让我们来看看同一个功能的前后版本，一个使用带
    IIFE 的 `var`，另一个使用带块的 `let`：


    -   ① 通过创建一个匿名函数来引入人工块

    -   ② 这个 `var` 将被限定在声明的函数作用域内

    -   ③ 通过 `return` 一个对象来暴露公共 API

    -   ④ 这将导致一个 `ReferenceError`

    -   ⑤ 你可以使用公共 API

    -   ⑥ 调用公共 getter


    ```

    const counter = (function createCounter() { ①

    var steps = 0; ②

    function increment() {

    steps++;

    }

    function getCount() {

    return steps;

    }

    return {

    increment: increment,

    getCount: getCount,

    }; ③

    }());

    // use it

    // console.log(steps); ④

    counter.increment(); ⑤

    console.assert(counter.getCount() === 1); ⑥

    ```


    有了 `let`，我们不再需要使用 IIFE，因为我们可以简单地用花括号将代码包围起来，从而创建一个封闭的作用域！


    -   ① 使用花括号引入人工块

    -   ② 这个变量自动限定在块作用域内

    -   ③ 将函数声明转换为函数表达式

    -   ④ 简单地将一个变量赋值，使其在块外部可用

    -   ⑤ 我们仍然无法“看到”这个用 `let` 声明的变量

    -   ⑥ 但你可以使用公共 API

    -   ⑦ 调用公共 getter


    ```

    let counter;

    { ①

    let steps = 0; ②

    let increment = function () { ③

    console.log(''increment'');

    steps++;

    };

    let getCount = function () {

    return steps;

    };

    counter = {

    increment: increment,

    getCount: getCount,

    }; ④

    }

    // use it

    // console.log(steps); ⑤

    counter.increment(); ⑥

    console.assert(counter.getCount() === 1); ⑦

    ```


    这两个示例都试图限制 `increment` 和 `getCount` 函数的可见性。然而，利用 `let` 可以让我们消除使用 `var` 所涉及的所有仪式性代码。


    ## `const`


    ES6 引入了另一个关键字，即 `const`。顾名思义，它将定义一个常量。换句话说，它定义一个一旦声明其值就无法更改的变量。


    除了 `const` 不能被重新赋值之外，我们目前讨论的关于 `let` 的所有内容也适用于 `const`——它们具有块作用域，会被提升到所在块的顶部，并且不能在同一作用域内声明两个同名的
    `const`。


    重要的是，我们要记住，不能更改的是 `const` 变量的*绑定*。这一点很重要，因为 JavaScript 对象（例如 `Object` 和 `Array`）本质上是可变的。也就是说，如果一个
    `const` 被赋值为一个对象的引用，那么无法更改的是那个*引用*；对象本身可以改变，而 `const` 将看到那个改变。也许通过代码更容易理解这一点。


    -   ① 一个值引用

    -   ② 一个对象引用

    -   ③ 重新赋值会失败并抛出 `TypeError`

    -   ④ 但是我们可以修改被引用的对象


    ```

    const VALUE_REFERENCE = ''This cannot be re-assigned''; ①

    const ARRAY_REFERENCE = [ ''I'', ''am'', ''mutable'' ]; ②

    // attempt re-assignment

    // VALUE_REFERENCE = false ③

    // ARRAY_REFERENCE = {}

    // Mutate the array object

    ARRAY_REFERENCE.push(''!''); ④

    // prints [ ''I'', ''am'', ''mutable'', ''!'' ]

    console.log(ARRAY_REFERENCE);

    ```


    ### 不可变对象怎么办？


    `const` 限制自身仅使变量的绑定不可变。如果我们想要使 JavaScript 中的对象类型不可变，我们应该考虑使用例如 `Object.freeze`
    来“冻结”它，或者考虑使用像 Immutable.js^((13)) 这样的库。


    另一点需要注意的是，声明一个没有初始值的 `const` 也会导致 `SyntaxError`。基本上，声明这样一个 `const` 会将该常量永久地赋值为
    `undefined`，考虑到 JavaScript 已经为这种情况提供了 `undefined` 关键字，这样做是多余的。


    最后，JavaScript 社区已经达成共识，将常量变量命名为全大写加下划线的形式。这使得在代码库中更容易识别常量。


    ## 在 ES6 及以后版本中使用 `var` 的理由


    我们现在知道，我们可以在任何使用 `var` 的地方使用 `let`，并获得一些额外的好处，比如更清晰的作用域规则。`const` 允许我们声明式地定义不可变的绑定。考虑到我们有了块作用域，我们可以摆脱像
    IIFE 这样的仪式性代码来实现封装。所有这一切都说明，对于使用 ES6+ 编写的任何代码，我们**不应该**再使用 `var`。


    我建议我们更进一步——我们应该寻找一种方式来编写代码，使其更多地使用 `const` 而不是 `let`。重新赋值变量会使代码难以阅读、理解和推理。在 `let`
    和 `const` 之间做选择时，我强烈鼓励选择后者，你会很快发现结果会更加清晰和干净。


    像 ESLint 这样的工具可以配置^((14)) 为在检查 ES6+ 代码时将其视为错误，强烈建议我们这样做。`var` 将永远是 JavaScript
    历史的一部分；然而，现在是时候让我们转向在代码库中只使用 `let` 和 `const` 了。

