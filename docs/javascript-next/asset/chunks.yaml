    ### 其他注意事项


    箭头函数在其他细微方面也与常规函数有所不同。由于箭头函数的内部实现方式，它们无法被用作构造函数。如果我们想要定义一个构造函数，必须继续使用常规函数。


    另一个区别在于，`this` 并非唯一按词法作用域绑定的东西。当将定义为表达式或语句的函数被调用时，JavaScript 会创建一个对象，该对象会捕获调用时提供给函数的所有参数。这个名为
    `arguments` 的对象在函数体内是可用的。然而，箭头函数不会获得 `arguments` 对象。不过，`strict mode` 限制了 `arguments`
    的 API 使用范围，并且 ES6 为我们提供了可变参数（我们很快就会看到），这进一步减少了对 `arguments` 的需求，因此这本身并不成为一个很大的注意事项。让我们通过一个简单的例子来看看它是如何工作的：


    *   ① 使用语句定义一个函数

    *   ② 将函数语句作为构造函数调用，成功返回

    *   ③ 将函数定义为箭头函数

    *   ④ 将箭头函数作为构造函数调用会抛出错误

    *   ⑤ 常规函数在调用时会获得一个 `arguments` 对象

    *   ⑥ 而箭头函数则不会


    ```

    function PersonAsRegularFunction(name) { ①

    this.name = name;

    }

    const nate = new PersonAsRegularFunction(''Nate''); ②

    // 输出 { name: ''Nate'' }

    console.log(nate);

    const PersonAsArrowFunction = (name) => { ③

    this.name = name;

    };

    // const neal = new PersonAsArrowFunction(''Neal''); ④

    function regularFunction() {

    return arguments;

    }

    // 输出 { ''0'': 10, ''1'': ''a'', ''2'': true, ''3'': false }

    console.log(regularFunction(10, ''a'', true, false)); ⑤

    const arrowFunction = () => arguments;

    // 输出 ''ReferenceError: arguments is not defined''

    // console.log(arrowFunction(10, ''a'', true, false)); ⑥

    ```


    让我们退一步思考这意味着什么——常规函数在调用时动态设置 `this` 的值。同时，会创建 `arguments` 对象来捕获调用时提供的所有参数。也就是说，在函数体内使用的
    `this` 和 `arguments` 对象都是*基于上下文的*——它们依赖于调用上下文以便能够正确定义。然而，箭头函数在定义时就固定了 `this` 的值，并且根本不会被提供
    `arguments` 对象。换句话说，箭头函数被特意设计为尽可能少地使用其周围的上下文。如果我们的函数实现需要使用在运行时定义的上下文，那么使用常规函数将是最佳选择。


    ### 使用场景


    有人可能会想，既然有这么多微妙的变化需要我们注意，箭头函数值得使用吗？正如我们所看到的，JavaScript 是一种函数式编程语言。将函数作为参数传递以及从高阶函数中返回函数是
    JavaScript 中非常常见的范式。事实上，大多数 `Array` 的迭代和操作函数往往是高阶函数，并且为使用箭头函数提供了绝佳的机会。让我们重新审视之前关于对数组执行
    `map` 和 `reduce` 操作的例子，看看如何改用箭头函数。


    *   ① 将数组中的每个数字乘以三

    *   ② 仅筛选出偶数

    *   ③ 将结果归约为其总和


    ```

    const nums = [1, 2, 3, 4, 5];

    const result = nums

    .map(n => n * 3) ①

    .filter(n => (n %  2) === 0) ②

    .reduce((acc, n) => acc + n, 0); ③

    ```


    首先，让我们稍作停顿，思考一下这段代码的优雅之处。如我们所见，所有多余的仪式性代码都消失了，剩下的只是我们试图实现的核心意图。几乎可以说，箭头函数就是为此意图而设计的！


    另一个使用场景是当我们*确定地*知道在箭头函数定义时 `this` 代表什么。


    *   ① 设置"上下文"

    *   ② 箭头函数按预期工作


    ```

    const neo = {

    friends: [

    ''Morpheus'',

    ''Brian'',

    ''Switch'',

    ],

    addFriends: function () {

    const args = Array.prototype.slice.call(arguments);

    args.forEach(f => this.friends.push(f)); ②

    },

    };

    // 调用 addFriends

    neo.addFriends(''Niobe'', ''Tank''); ①

    // 输出 ''[ ''Morpheus'', ''Brian'', ''Switch'', ''Niobe'', ''Tank'' ]''

    console.log(neo.friends);

    ```


    这里我们知道，`addFriends` 内部的 `this` 将指向 `const neo` 所引用的对象，因为 `addFriends` 是作为 `neo`
    的一个方法被调用的。因此，在 `addFriends` 内部，我们可以定义一个能够使用 `this` 的箭头函数，因为在箭头函数被定义时，`this` 指向所有者对象。但是，我们不能将
    `addFriends` 本身定义为一个箭头函数，因为在函数定义时，`this` 指向全局对象！正如我们可以推断出的，在箭头函数内部引用 `this` 时，最好确定
    `this` 指向什么，或者干脆考虑使用函数表达式。


    让我们考虑另一个使用高阶函数来构建小型领域特定语言（DSL）的例子。在这个例子中，我们将使用纯函数——即那些只使用传递给它们的参数的函数。也就是说，它们是"无状态的"，因此是使用箭头函数的绝佳候选。这将为我们提供一个极好的机会，来看看箭头函数的简洁性如何帮助我们。


    *   ① 定义一个高阶谓词函数

    *   ② 测试提供的参数是否大于 10

    *   ③ 测试数字是否为偶数

    *   ④ 创建一个测试两个条件的函数


    ```

    const and = (a, b) => arg => a(arg) && b(arg); ①

    const gt10 = n => n > 10; ②

    const even = n => n %  2 === 0; ③

    const gt10AndEven = and(gt10, even); ④

    console.assert(gt10AndEven(15) === false);

    console.assert(gt10AndEven(22) === true);

    ```


    这里我们定义了 `and` 函数，一个高阶谓词函数^((19))，它接收两个函数，并返回一个新函数。这个新函数期望接收一个参数 `args`，该参数会针对两个谓词进行测试，当且仅当两个谓词都满足时才返回
    true。^((20))


    然后我们定义了两个谓词，并使用 `and` 创建了一个新函数，以测试其提供的参数是否既大于 10 又是偶数。


    再次，我们观察到箭头函数使我们能够敏锐地表达我们的意图，省略了与函数表达式相关的任何多余的仪式性代码。


    ## 总结


    尽管箭头函数与它们的表达式和语句表亲有几分相似，但它们在 JavaScript 新世界中的作用是无可争议的。它们使我们能够利用 JavaScript 固有的函数式特性，使代码更简洁、更易读，并且与常规函数不同，它们抑制了任何使其变得有状态的尝试。


    在本章中，我们探索了胖箭头函数的新语法。我们看到了它们的语义与常规函数有何不同，并学习了箭头函数最能为我们服务的恰当使用场景。只要我们始终留意它们行为上的差异，箭头函数就会很好地为我们服务。


    在下一章中，我们将探索一种定义函数签名的新机制，它可以使我们的代码更具表现力，同时减少我们习惯在函数内部进行的大量错误检查。


    脚注 1   2   3   4   5   6

