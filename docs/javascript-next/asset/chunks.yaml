    # 14. Seemingly Imperative with `async` and `await`


    When working with asynchronous operations, promises present a huge leap forward
    from using callbacks. However, promises present us with a specific domain-specific
    language (DSL) to work with, including but not limited to `then`, `catch`, and
    `finally`. This DSL, while easy, and fluent to work with, does not compose well
    with how we typically write code in JavaScript, which is imperative code. Consider
    the case of trapping errors—JavaScript affords us language constructs like `try`/`catch`
    that allow us to trap errors, and provide meaningful stack traces. Promises on
    the other hand, trap errors using the `catch` and `finally` API. This departure
    from our traditional model of writing code introduces a mental burden as we switch
    between different parts of our codebase.


    In this chapter we will see how `async` and `await` can help us refactor all of
    our codes so that we can begin to work with asynchronous code just like we do
    with synchronous code. We will be able to express our intent more clearly, without
    getting lost in a maze of callbacks, and deal with state management and error
    handling using concepts that we are familiar with. We will be wiping tears of
    joy from our faces as we come to the end of this chapter, rejoicing in how beautiful,
    simple, and most importantly, consistent our code seems to be.'
