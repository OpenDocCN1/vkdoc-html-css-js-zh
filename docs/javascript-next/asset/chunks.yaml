    Arrow functions have their parameters listed to the left of the fat arrow. It
    is permitted to skip the parentheses **if and only if** the function signature
    has one parameter.^([^(16)](#fn16)) The following snippet offers the various permutations
    allowed for arrow function parameters:


    *   ① Zero-parameter list requires parenthesis


    *   ② Single-parameter list makes the parenthesis optional


    *   ③ Two or more parameters require the parenthesis


    ```

    const noop = () => {}; ①

    const identity = n => n; ②

    const get = (obj, k) => obj[k]; ③

    ```


    This discussion begs the question, does skipping the parenthesis for single-parameter
    arrow functions buy us anything? The convention adopted widely across the JavaScript
    community is one where we should skip the parenthesis if we can. In other words,
    while it may seem to go against the notion that single-argument arrow statements
    should be syntactically consistent (with no-arg and multi-arg arrow functions),
    it does reduce the verbosity especially in the case of higher-order functions
    as we will see soon.


    The right-hand side of the arrow function syntax offers a little more subtlety
    as we will see now.


    #### Expression and Statement Bodies


    All the examples we have seen so far have had single-line bodies. What if our
    function had to do a little more work?


    It turns out we can indeed use curly brackets to define the function body. However,
    as you might recall, curly brackets create blocks in JavaScript, which are statements,
    not expressions! In other words, every example we have seen so far used an expression
    as its body, thus alleviating the need to explicitly `return` from the function.
    If we are to switch to using blocks (which is a statement and therefore is not
    *evaluated*), then we are forced to explicitly `return` from the function. (Otherwise,
    the function, like any regular function, returns an implicit `undefined.`) Let
    us define a multiline-bodied arrow function:


    *   ① Use curly brackets to start body


    *   ② Explicit return required


    ```

    const reducer = (acc, n) => { ①

    acc.push(n);

    return acc; ②

    };

    // invoke it

    console.log(reducer([2, 3], 1)); // prints ''[ 2, 3, 1 ]''

    ```


    It *is* recommended that if we are to use curly brackets, we should have explicit
    `return`s in the body. Not doing so can prove to be rather baffling. Observe:


    ```

    const confuser = () => { profession: ''JS Ninja'' };

    // invoke it

    console.log(confuser());

    ```


    Quick! What does the function return upon invocation? Is it an object with one
    key, or is that a block with a `label` and therefore returns `undefined`? As you
    can see, the overloaded nature of curly brackets to define blocks *and* objects
    causes confusion in conjunction with the arrow syntax.


    It turns out that if JavaScript “sees” curly brackets in an arrow function definition
    it treats it as if it were a block body. This means that upon invocation, this
    function will return `undefined`.


    What if we indeed wanted to return an object? We have two options—explicitly use
    a block with a `return` or wrap the body in parenthesis, like so:


    ```

    const confuserOne = () => ({ profession: ''JS Ninja'' });

    // prints ''{ profession: ''JS Ninja'' }''

    console.log(confuserOne());

    // alternatively

    const confuserTwo = () => {

    return { profession: ''JS Ninja'' };

    };

    // prints ''{ profession: ''JS Ninja'' }''

    console.log(confuserTwo());

    ```


    That sums up all the syntactical nuances of arrow functions. Now let us consider
    the semantic differences between arrow functions and regular functions. But before
    we go there, we must take a brief digression into regular functions, and how they
    work with `this`.


    ### Regular Functions Dynamically Set `this`


    When a regular function (defined using function statements or expressions) references
    `this`, that reference is resolved dynamically based on the *invocation pattern*
    used:


    *   ① Set a property that references a local function in scope


    *   ② Invoke the function using the “method invocation” pattern


    *   ③ Use the “apply invocation” pattern


    *   ④ Invoke the function using the “function invocation” pattern


    ```

    ''use strict'';

    const returnsThis = function () {

    return this;

    };

    var obj1 = {

    name: ''obj1'',

    method: returnsThis, ①

    };

    console.assert(obj1.method() === obj1); ②

    var obj2 = {

    name: ''obj2'',

    };

    console.assert(returnsThis.apply(obj2) === obj2); ③

    console.assert(returnsThis() === undefined); ④

    ```


    I must emphasize that we are running the code in `strict mode` to avoid the automatic
    boxing that “nonsecure” environments tend to enforce.^([^(17)](#fn17)) That said,
    we then invoke the same function using three different invocation patterns^([^(18)](#fn18))
    to see the value of `this` be different in each case!


    We first assign a property on an object to point to the local function, and then
    invoke it like we would any other function property on that object using the “dot”
    operator. As we might expect, `this` points to whatever is on the left of the
    “dot” at invocation time. In other words, it points to the “current context.”


    We then use the `apply` (or its cousin `call`) which effectively sets the `this`
    inside the function prior to invoking it. Another way to think about it is that
    this line is equivalent to the method invocation pattern, except we are setting
    `this` using `apply` instead of being forced to tack on a new property on the
    object.


    Finally, we simply invoke the function without any context—that is, we do not
    invoke the function on any object; in `strict mode` the function simply returns
    `undefined`, which is what one would expect.


    As we can see, `this` within a function expression (or statement) is set at the
    time of invocation, *not* at the time of definition. This is where the behavior
    of “regular” functions diverges from that of arrow functions. While regular functions
    dynamically set the meaning of `this` at invocation time, arrow functions bind
    it lexically; in other words, arrow functions bind `this` at *definition* time.


    ### Lexically Bound `this`


    Arrow functions do not set the meaning of `this` upon invocation. Rather they
    set or “cement” it to whatever `this` evaluates to when they are created. Consider
    the following:


    *   ① Grab a handle to the global object in scope so we `assert` against it


    *   ② Define an arrow function that simply `return`s `this`


    *   ③ Trying to use it as a method does not change the context


    *   ④ Neither does `apply`


    *   ⑤ Regular functions would have returned `undefined` here (as we have seen)


    ```

    ''use strict'';

    const GLOBAL_OBJECT = this; ①

    const returnMe = () => this; ②

    var obj1 = {

    name: ''obj1'',

    method: returnMe,

    };

    console.assert(obj1.method() === GLOBAL_OBJECT); ③

    var obj2 = {

    name: ''obj2'',

    };

    console.assert(returnMe.apply(obj2) === GLOBAL_OBJECT); ④

    console.assert(returnMe() === GLOBAL_OBJECT); ⑤

    ```


    Defining an arrow function seems to be the same as defining a regular function,
    and `bind`-ing `this` to whatever is `this` at definition time! And indeed, this
    is the case.


    Let us look at some more caveats that apply to arrow functions.'
  trans: "\n### 带括号还是不带括号？\n\n箭头函数的参数列表位于胖箭头左侧。**当且仅当**函数签名只有一个参数时，可以省略括号^(¹⁶)。以下代码片段展示了箭头函数参数允许的各种排列方式：\n\
    \n- ① 零参数列表必须带括号\n- ② 单参数列表可省略括号\n- ③ 两个或更多参数必须带括号\n\n```\nconst noop = () =>\
    \ {}; ①\nconst identity = n => n; ②\nconst get = (obj, k) => obj[k]; ③\n```\n\n\
    这引出一个问题：为单参数箭头函数省略括号是否真的给我们带来好处？JavaScript 社区广泛采用的惯例是尽可能省略括号。换句话说，虽然这似乎违背了单参数箭头语句在语法上应与无参数和多参数箭头函数保持一致的理念，但它确实减少了冗余，尤其是在高阶函数中，我们很快就会看到这一点。\n\
    \n箭头函数语法的右侧部分则更为微妙，我们接下来将进行探讨。\n\n### 表达式体与语句体\n\n到目前为止，我们看到的所有示例都是单行函数体。如果函数需要做更多工作该怎么办？\n\
    \n事实上，我们确实可以使用花括号来定义函数体。但你可能记得，花括号在 JavaScript 中创建的是代码块（*blocks*），而代码块是**语句**，不是表达式！换句话说，我们之前看到的所有示例都使用表达式作为函数体，因此无需显式使用\
    \ `return` 从函数返回值。如果我们改用代码块（代码块是语句，因此不会被“求值”），则必须显式地从函数中 `return` 值。（否则，该函数会像任何普通函数一样，隐式返回\
    \ `undefined`。）让我们定义一个多行函数体的箭头函数：\n\n- ① 使用花括号开始函数体\n- ② 必须显式使用 return\n\n```\n\
    const reducer = (acc, n) => { ①\n  acc.push(n);\n  return acc; ②\n};\n// 调用它\n\
    console.log(reducer([2, 3], 1)); // 输出 '[ 2, 3, 1 ]'\n```\n\n**建议**：如果我们要使用花括号，就应该在函数体中显式包含\
    \ `return`。不这样做可能会导致令人困惑的结果。请看：\n\n```\nconst confuser = () => { profession: 'JS\
    \ Ninja' };\n// 调用它\nconsole.log(confuser());\n```\n\n快速回答！这个函数被调用时返回什么？它返回一个包含一个键的对象，还是一个带有\
    \ `label` 的代码块，因此返回 `undefined`？正如你所见，花括号同时用于定义代码块 *和* 对象，这种重载特性与箭头函数语法结合使用时会引起混淆。\n\
    \n实际上，如果 JavaScript 在箭头函数定义中“看到”花括号，它会将其视为代码块函数体。这意味着调用时，该函数将返回 `undefined`。\n\
    \n如果我们确实想返回一个对象呢？我们有两种选择——显式使用带有 `return` 的代码块，或者将函数体包裹在圆括号中，如下所示：\n\n```\nconst\
    \ confuserOne = () => ({ profession: 'JS Ninja' });\n// 输出 '{ profession: 'JS\
    \ Ninja' }'\nconsole.log(confuserOne());\n// 或者\nconst confuserTwo = () => {\n\
    \  return { profession: 'JS Ninja' };\n};\n// 输出 '{ profession: 'JS Ninja' }'\n\
    console.log(confuserTwo());\n```\n\n以上总结了箭头函数所有的语法细节。现在我们来考虑箭头函数与普通函数之间的语义差异。但在讨论之前，我们必须简要回顾一下普通函数以及它们如何处理\
    \ `this`。\n\n### 普通函数动态设置 `this`\n\n当一个普通函数（使用函数声明或函数表达式定义）引用 `this` 时，该引用会根据所使用的“调用模式”动态解析：\n\
    \n- ① 设置一个指向作用域内局部函数的属性\n- ② 使用“方法调用”模式调用该函数\n- ③ 使用“apply 调用”模式\n- ④ 使用“函数调用”模式调用该函数\n\
    \n```\n'use strict';\nconst returnsThis = function () {\n  return this;\n};\n\
    var obj1 = {\n  name: 'obj1',\n  method: returnsThis, ①\n};\nconsole.assert(obj1.method()\
    \ === obj1); ②\nvar obj2 = {\n  name: 'obj2',\n};\nconsole.assert(returnsThis.apply(obj2)\
    \ === obj2); ③\nconsole.assert(returnsThis() === undefined); ④\n```\n\n我必须强调，我们是在\
    \ `严格模式` 下运行代码，以避免“非安全”环境倾向于强制的自动装箱行为^(¹⁷)。尽管如此，我们使用三种不同的调用模式^(¹⁸) 调用了同一个函数，并看到每次调用时\
    \ `this` 的值都不同！\n\n我们首先在对象上设置一个属性，使其指向局部函数，然后像调用该对象上的任何其他函数属性一样，使用“点”运算符调用它。正如我们所料，`this`\
    \ 指向调用时“点”左侧的内容。换句话说，它指向“当前上下文”。\n\n接着我们使用 `apply`（或其兄弟 `call`），这实际上在调用函数之前设置了函数内部的\
    \ `this`。另一种理解方式是，这一行等同于方法调用模式，区别在于我们使用 `apply` 设置 `this`，而不是被迫在对象上添加一个新属性。\n\n\
    最后，我们简单地在没有任何上下文的情况下调用该函数——也就是说，我们不在任何对象上调用该函数；在 `严格模式` 下，该函数简单地返回 `undefined`，这正是我们所期望的。\n\
    \n正如我们所看到的，函数表达式（或声明）中的 `this` 是在调用时设置的，*而不是* 在定义时设置的。这就是“普通”函数的行为与箭头函数行为的分歧点。普通函数在调用时动态设置\
    \ `this` 的含义，而箭头函数则词法地绑定 `this`；换句话说，箭头函数在 *定义* 时绑定 `this`。\n\n### 词法绑定的 `this`\n\
    \n箭头函数在调用时不会设置 `this` 的含义。相反，它们将 `this` 设置或“固化”为创建时 `this` 求值的结果。请考虑以下代码：\n\n\
    - ① 获取全局对象的句柄以便进行 `assert` 断言\n- ② 定义一个简单地 `return`  `this` 的箭头函数\n- ③ 尝试将其用作方法并不会改变上下文\n\
    - ④ `apply` 也不会改变\n- ⑤ 这里的普通函数（正如我们所见）会返回 `undefined`\n\n```\n'use strict';\n\
    const GLOBAL_OBJECT = this; ①\nconst returnMe = () => this; ②\nvar obj1 = {\n\
    \  name: 'obj1',\n  method: returnMe,\n};\nconsole.assert(obj1.method() === GLOBAL_OBJECT);\
    \ ③\nvar obj2 = {\n  name: 'obj2',\n};\nconsole.assert(returnMe.apply(obj2) ===\
    \ GLOBAL_OBJECT); ④\nconsole.assert(returnMe() === GLOBAL_OBJECT); ⑤\n```\n\n\
    定义箭头函数似乎与定义普通函数，然后将 `this` `bind` 到定义时 `this` 的值完全相同！而事实上正是如此。\n\n让我们看看适用于箭头函数的其他一些注意事项。\n"
- fmt: '### Other Caveats


    Arrow functions differ from regular functions in other subtle ways. Due to the
    internal implementation of arrow functions, they cannot be used as constructor
    functions. If we wish to define a constructor function, we must continue using
    regular functions.


    Another difference is that `this` is not the only thing that is lexically bound.
    When a function defined as an expression or statement is invoked, JavaScript creates
    an object that captures all of the arguments supplied to the function at invocation
    time. This object, named `arguments`, is available within the function body. However,
    arrow functions do not get an `arguments` object. However, `strict mode` restricted
    the API surface area of `arguments`, and ES6 provides us with variable arguments
    (which we will see soon), further reducing the need for `arguments` so this does
    not present itself as much of a caveat. Let us take a look at a quick example
    to see how this works:


    *   ① Define a function using a statement

    *   ② Invoke a function statement as a constructor which returns successfully

    *   ③ Define a function as an arrow function

    *   ④ Invoking an arrow function as a constructor throws an error

    *   ⑤ Regular functions get an `arguments` object upon invocation

    *   ⑥ Arrow functions on the other hand do not


    ```

    function PersonAsRegularFunction(name) { ①

    this.name = name;

    }

    const nate = new PersonAsRegularFunction(''Nate''); ②

    // prints { name: ''Nate'' }

    console.log(nate);

    const PersonAsArrowFunction = (name) => { ③

    this.name = name;

    };

    // const neal = new PersonAsArrowFunction(''Neal''); ④

    function regularFunction() {

    return arguments;

    }

    // prints { ''0'': 10, ''1'': ''a'', ''2'': true, ''3'': false }

    console.log(regularFunction(10, ''a'', true, false)); ⑤

    const arrowFunction = () => arguments;

    // prints ''ReferenceError: arguments is not defined''

    // console.log(arrowFunction(10, ''a'', true, false)); ⑥

    ```


    Let us step back and think about what this means—regular functions dynamically
    set the value of `this` at invocation time. Simultaneously, the `arguments` object
    is created to capture all of the arguments supplied at invocation time. That is
    to say, both `this` and the `arguments` object when used inside of a function
    body are *contextual*—they rely on the invocation context so that they can be
    defined correctly. However, arrow functions cement the value of `this` at definition
    time, and are not provided the `arguments` object at all. In other words, arrow
    functions are specifically designed to use as little of the context around them
    as possible. If our function implementation needs to use context defined at runtime,
    we will be best served using regular functions.


    ### Use-cases


    One might wonder, with all the subtle changes that we must now be aware of, are
    arrow functions worth it? JavaScript as we have seen is a functional programming
    language. Using functions as arguments and returning functions from higher-order
    functions is a very common paradigm in JavaScript. In fact, most `Array` iteration
    and manipulation functions tend to be higher-order functions, and present the
    perfect opportunity for arrow function. Let us revisit our earlier example of
    `map`-ing and `reduce`-ing over an array and see how we can use arrow functions
    instead.


    *   ① Triple every number in the array

    *   ② Filter out even numbers only

    *   ③ Reduce the result to its sum


    ```

    const nums = [1, 2, 3, 4, 5];

    const result = nums

    .map(n => n * 3) ①

    .filter(n => (n %  2) === 0) ②

    .reduce((acc, n) => acc + n, 0); ③

    ```


    First, let us stop for a minute, and consider the elegance of the code. As we
    can see, gone is all the ceremony, and what remains is the essence of what it
    is we are trying to accomplish. It is almost as if arrow functions were designed
    with this intent in mind!


    Another use-case is when we know for *certain* what `this` represents when the
    arrow function is defined.


    *   ① Set the "context"

    *   ② Arrow function works as expected


    ```

    const neo = {

    friends: [

    ''Morpheus'',

    ''Brian'',

    ''Switch'',

    ],

    addFriends: function () {

    const args = Array.prototype.slice.call(arguments);

    args.forEach(f => this.friends.push(f)); ②

    },

    };

    // invoke addFriends

    neo.addFriends(''Niobe'', ''Tank''); ①

    // prints ''[ ''Morpheus'', ''Brian'', ''Switch'', ''Niobe'', ''Tank'' ]''

    console.log(neo.friends);

    ```


    Here we know that `this` inside `addFriends` will point to the object referenced
    by the `const neo` because `addFriends` is invoked as a method on `neo`. Therefore,
    within `addFriends`, we can define an arrow function which can use `this` because
    `this` points to the owner object when that arrow function is defined. However,
    we cannot make `addFriends` itself an arrow function, since at the time the function
    is defined; `this` points to the global object! As we might conclude, it is best
    to be certain what `this` points to when referencing it inside an arrow functions,
    or simply consider using function expressions.


    Let us consider another example of using higher-order functions to build a mini
    domain-specific language (DSL). In this example we will be working with pure functions—that
    is, functions that only use the arguments supplied to them. That is, they are
    "stateless," and thus serve as great candidates for us to use arrow functions.
    This will give us a great opportunity to see how the terseness of arrow functions
    can serve us.


    *   ① Define a higher-order predicate function

    *   ② Test to see if the argument supplied is greater than 10

    *   ③ Test to see if the number is an even number

    *   ④ Create a function that tests two conditions


    ```

    const and = (a, b) => arg => a(arg) && b(arg); ①

    const gt10 = n => n > 10; ②

    const even = n => n %  2 === 0; ③

    const gt10AndEven = and(gt10, even); ④

    console.assert(gt10AndEven(15) === false);

    console.assert(gt10AndEven(22) === true);

    ```


    Here we define the `and` function, a higher-order predicate function^([^(19)](#fn19))
    that given two functions, returns a new function. This new function expects one
    argument, `args`, that is tested against both predicates and returns true if and
    only if both predicates are satisfied.^([^(20)](#fn20))


    We then define two predicates, and use `and` to create a new function to test
    if its supplied argument is both greater than 10 and is even.


    Once again, we observe that arrow functions allow us to keenly express our intentions,
    leaving out any superfluous ceremony associated with function expressions.


    ## Summary


    While arrow functions have a passing resemblance to their expression and statement
    cousins, their role in the new world of JavaScript remains undisputed. They enable
    us to leverage JavaScript''s inherent functional nature, making code more concise,
    and readable, and unlike regular functions rein in any attempts to make them stateful.


    In this chapter we explored the new syntax for fat-arrow functions. We saw how
    their semantics differ from that of regular functions, and learned the appropriate
    use-cases where fat-arrow functions best serve us. As long as we remain mindful
    of the differences in their behavior, arrow functions will serve us well.


    In the next chapter we will explore a new mechanism to define function signatures
    that allow our code to be more expressive, while reducing the amount of error
    checking that we are so accustomed to doing within our functions.


