- fmt: '## Symbols and Switch-cases


    We can consider another use-case where having unique values (symbols) can help
    mitigate potential bugs. We often use strings to identify “uniqueness,” and language
    constructs like switch-case utilize this to aid in program flow. Consider the
    following:


    - ① Define helper constants

    - ② Switch case over a string property

    - ③ Introduce a misleading constant

    - ④ Use the misleading constant as a log level in a new object

    - ⑤ The output is not as expected


    ```

    const LOG_LEVEL = Symbol(''log'');

    const DEBUG = ''DEBUG''; ①

    const INFO = ''INFO'';

    const ERROR = ''ERROR'';

    const simpleLogger = (obj, msg) => {

    let returnMsg;

    switch (obj[LOG_LEVEL]) { ②

    case DEBUG:

    returnMsg = `DEBUG: ${msg}`;

    break;

    case INFO:

    returnMsg = `INFO: ${msg}`;

    break;

    case ERROR:

    returnMsg = `ERROR: ${msg}`;

    break;

    default:

    throw new Error(''Invalid LOG_LEVEL'');

    }

    console.log(returnMsg);

    return returnMsg;

    };

    const MY_LEVEL = ''ERROR''; ③

    const loggableObj = {

    log: ''this is just an ordinary property'',

    [LOG_LEVEL]: MY_LEVEL, ④

    };

    // prints ''ERROR: this is a test''

    simpleLogger(loggableObj, ''this is a test''); ⑤

    ```


    It takes an astute reader to realize what happened here. We introduce a misleading
    constant, namely `MY_LEVEL` which evaluates to `"ERROR"`, and assign it as the
    `LOG_LEVEL` to an object. This works, because within the `simpleLogger` function,
    the switch-case evaluates for *equality*, matching on the `ERROR` case because
    the supplied `LOG_LEVEL` just so happens to have a value that we know of. However,
    instead of throwing an error, we successfully log an error message. The issue
    here is that while strings *are* values, two separately constructed strings can
    be equal if they happen to have the same set of characters with the same casing!


    Ideally, we would like to be able to create truly unique values that we can use
    to switch between. Well, it turns out that the `switch` statement in JavaScript
    simply uses the `===` equality operator to find a matching `case`! Again, symbols
    to the rescue.


    - ① Define helper constants as symbols instead of strings

    - ② Notice the switch case does **not** change

    - ③ This works just like it did with strings


    ```

    const LOG_LEVEL = Symbol(''log'');

    const DEBUG = Symbol(''DEBUG''); ①

    const INFO = Symbol(''INFO'');

    const ERROR = Symbol(''ERROR'');

    const simpleLogger = (obj, msg) => {

    let returnMsg;

    switch (obj[LOG_LEVEL]) { ②

    case DEBUG:

    returnMsg = `DEBUG: ${msg}`;

    break;

    case INFO:

    returnMsg = `INFO: ${msg}`;

    break;

    case ERROR:

    returnMsg = `ERROR: ${msg}`;

    break;

    default:

    throw new Error(''Invalid LOG_LEVEL'');

    }

    console.log(returnMsg);

    return returnMsg;

    };

    const loggableObj = {

    log: ''this is just an ordinary property'',

    [LOG_LEVEL]: ERROR,

    };

    // prints ''ERROR: this is a test''

    simpleLogger(loggableObj, ''this is a test''); ③

    ```


    Recall that symbols are unique, and that every call to the initializer function
    `Symbol` creates a new and unique symbol object, which does not equal any other
    symbol (even those with the same description string). In our latest iteration,
    we use symbols as the key to uniquely identify the `LOG_LEVEL`, as well as its
    value, which we can now guarantee to be unique.


    ## Global Registry


    There is yet another facet of `Symbol`s that we should talk about, namely the
    global symbol registry. We can think of the symbol registry as a pool of symbols—you
    can create and put a symbol in the pool, and retrieve it later.


    To create and or fetch a symbol from the pool, we use `Symbol.for`. `Symbol.for`
    expects to be supplied a “key,” and if a symbol with that key does **not** exist
    in the registry, then one will be created. Otherwise, a symbol with the same key
    is retrieved from the registry, like so:


    - ① Define a symbol using `for`—In this case a symbol will be created

    - ② Look up a symbol using the same “key”—This is simply a “get” operation

    - ③ They are equal


    ```

    const global = Symbol.for(''globally visible''); ①

    const otherGlobal = Symbol.for(''globally visible''); ②

    // prints ''true''

    console.log(global === otherGlobal); ③

    ```


    It turns out that for symbols in the global registry, it *is* the key that identifies
    the symbol—two references will point to the same symbol if they both use the same
    key to look up a symbol using `for`.


    We can also go the other way—given a symbol, we can fetch its key using `keyFor`
    method on Symbol.


    - ① Define a symbol using `for`—In this case a symbol will be created

    - ② Look up the key for a particular symbol


    ```

    const global = Symbol.for(''a unique key''); ①

    const key = Symbol.keyFor(global); ②

    // prints ''true''

    console.log(key === ''a unique key'');

    ```


    You might be wondering—what’s the point? The pool is necessary if we wanted to
    share symbols (which are references unlike strings, numbers, and booleans which
    are primitives) across “realms.”^([^(51)](#fn51)) A realm is a global context,
    such as one that exists in an iframe. So, the JavaScript code running in a webpage
    runs in a different realm that the code that runs in an embedded iframe, or code
    that runs in a service worker. If we wanted to use symbols as global identifiers,
    or names of properties that crossed realms, then the global symbol registry is
    your friend.


    Of course, to identify a symbol in the global registry, we need a key. There is
    always a chance that two disparate pieces of code (even those running in different
    realms) might use the same key (for different purposes) to create a symbol. Thus
    it behooves us to appropriately “namespace” any such identifiers if we are to
    use the global registry.'
