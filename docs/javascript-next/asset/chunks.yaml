  trans: "\n# 对象解构\n\n正如大家所料，对象的赋值运算符是 `{}`。数组通过位置进行索引，而对象则使用键值对。因此，在解构时，我们需要在赋值语句中指定我们感兴趣的*键*。请看：\n\
    \n- ① 我们从一个对象开始\n- ② 对象解构的完整形式\n- ③ 对象解构的简写形式\n\n```javascript\nconst paip = {\n\
    \  name: 'Paradigms of Artificial Intelligence Programming',\n  author: 'Peter\
    \ Norvig',\n  isbn: 1558601910,\n}; ①\nconst {\n  name: n,\n  isbn: id,\n} = paip;\
    \ ②\nconsole.assert(n === 'Paradigms of Artificial Intelligence Programming');\n\
    console.assert(id === 1558601910);\nconst {\n  name,\n  isbn,\n} = paip; ③\nconsole.assert(name\
    \ === 'Paradigms of Artificial Intelligence Programming');\nconsole.assert(isbn\
    \ === 1558601910);\n```\n\n对象解构提供了两种语法变体。当我们在作用域中引入的变量名称**不**与被解构对象中的键名一致时，使用较长的版本。如果新变量的名称与它们要查询的键名相同，则使用简写形式更为方便。\n\
    \n从语法和语义上讲，这与数组解构没有显著区别，唯一的区别在于对象不能按位置索引，而必须指定要查找的键。\n\n数组解构中所有可用的功能在这里同样适用——针对不存在的键返回\
    \ `undefined`、默认值、嵌套查找，以及在方法签名中支持解构，所有这些都可以通过对象解构实现。\n\n**不**适用的一点是，新变量无法引用之前已声明的变量，因为“之前”暗示了一种顺序性，而这在关联哈希中是不存在的。\n\
    \n让我们探索所有这些方面：\n\n- ① 我们从一个对象开始\n- ② 使用嵌套解构\n- ③ 使用长格式和短格式的默认值\n- ④ 为整个嵌套查找设置默认值，以防原始对象中缺少该键\n\
    - ⑤ 函数参数中的解构与默认值\n\n```javascript\nconst config = {\n  size: 200,\n  transitionMs:\
    \ 750,\n  clip: {\n    width: 200,\n  },\n}; ①\nconst {\n  size,\n  transitionMs,\n\
    \  clip: { ②\n    width: w = 100, ③\n    height = 100,\n  } = {}, ④\n} = config;\n\
    console.assert(size === 200);\nconsole.assert(transitionMs === 750);\nconsole.assert(w\
    \ === 200);\nconsole.assert(height === 100);\nconst drawChart = ({\n  size = 200,\n\
    \  transitionMs = 1000,\n  clip: {\n    width: w = 100,\n    height = 100,\n \
    \ } = {},\n} = {}) => { ⑤\n  return [size, transitionMs, w, height];\n};\n// 调用它\n\
    drawChart();\n```\n\n与数组一样，如果我们尝试查找对象中不存在的键，会返回 `undefined`。同样，明智的做法是在查找嵌套对象中的键*之前*，先为其整个结构设置默认值。\n\
    \n## 结合使用数组和对象解构\n\n当然，我们可以混合使用对象和数组解构。让我们重温之前的例子，看看如何结合两者来提取我们感兴趣的部分：\n\n- ①\
    \ 解构外部对象\n- ② 由于 `address` 本身也是一个对象，我们也对其进行解构\n- ③ `zip` 恰好是一个数组\n- ④ 同时获取 `zip`\
    \ 中的两个索引值\n\n```javascript\nconst user = {\n  name: 'douglas',\n  profession:\
    \ 'developer',\n  address: {\n    street1: '1 Ad Infinitum Drive',\n    street2:\
    \ \"\",\n    city: 'Cupertino',\n    state: 'CA',\n    zip: [\n      '95014',\n\
    \      '1234',\n    ],\n  },\n};\nconst { ①\n  address: { ②\n    zip: [ ③\n  \
    \    zip, ④\n      extended,\n    ],\n  },\n} = user;\nconst final = zip + '-'\
    \ + extended;\nconsole.assert(final === '95014-1234');\n```\n\n我们的目标是提取用户的完整邮政编码，其元素恰好位于一个数组中，该数组嵌套在\
    \ `address` 对象内，而 `address` 本身又是一个 JavaScript 对象字面量的属性。因此，我们必须运用嵌套解构的技巧，小心地剖析原始结构，以便精确地检索出我们想要的内容。我们从解构外部对象开始，这引导我们找到\
    \ `address` 键，然后再次对其进行解构以获取 `zip` 数组。最后，我们可以使用数组解构语法按索引获取构成邮政编码的元素。呼！\n\n我们终于完成了整个循环。复杂的查找和不必要的变量都已不复存在。剩下的仅仅是我们想要的东西。并且，结构化与解构之间的对称性再次显现。\n\
    \n## 注意事项\n\n最后还有一个与函数签名中的解构相关的局限。如果我们解构传递给函数的参数，就会丢失对整个对象（或数组）的引用。换句话说，我们需要做出选择——要么解构以获取我们需要的部分，要么获取整个对象并在函数实现内部进行解构，这样我们就可以在后续继续使用整个对象。虽然这听起来像是边缘情况，但有时我们需要使用对象的部分属性，然后将整个对象传递给下游做进一步处理。像\
    \ Clojure 这样的语言提供了 `:as` 关键字，以便在解构的同时保留对整个对象的引用。不幸的是，JavaScript 没有提供这样的补救措施。\n\
    \n## 一个小区别\n\n适用于可迭代对象的展开运算符和剩余运算符，与适用于对象的运算符不同，因为对象是**不可迭代**的！虽然对于可迭代对象和对象，展开运算符和剩余运算符看起来和行为一致，但它们底层使用的机制却截然不同。我们应该将适用于对象的展开运算符和剩余运算符视为*新的*语法，而不是将其看作是可迭代对象运算符的扩展。\n\
    \n这种差异在我们尝试将展开运算符与多参函数（如 `console.log`）结合使用时也会显现出来。回想一下，如果我们有一个可迭代对象（如数组）并希望将其内容传递给\
    \ `console.log`，我们可以简单地使用 `console.log(...arr)` 来调用它。这将“展开”数组，将数组中的元素作为单独的参数传递给\
    \ `log`。但这对于对象是行不通的，这再次温和地提醒我们，对象是不可迭代的，并且不能适用于所有可迭代对象的用例。\n\n## 总结\n\n正如我们所看到的，展开运算符提供了一种非常强大的机制，可以一次性获取数组的*所有*元素。这在处理多参函数，以及从其他数组创建或拼接数组时尤其有用。\n\
    \n另一方面，解构语法提供了一种使用*领域特定语言*（DSL）来查询数据的方法，而这种 DSL 的语法与我们最初用来创建对象的语法非常相似。因此，这种 DSL\
    \ 同样富有表现力，并且通过额外的功能（如为缺失的属性或索引设置默认值），这成为我们 JavaScript 工具箱中又一个有用的工具。\n\n在下一章中，我们将转换方向，探讨一种新的字符串定义机制，它有助于简化动态字符串和多行字符串的创建。\n\
    \n# 使用模板字符串格式化字符串\n"
- fmt: "# Introduction\n\nEver tried to create a dynamic string in JavaScript that\
    \ involved interpolating more than one variable at a time? I always seem to mess\
    \ up the `+` and the quotes somehow. And heaven forbid we must format it in a\
    \ particular way with new-lines and indentation. Also, let’s not talk about *ever*\
    \ changing that once we get it written out, shall we?\n\nIn this chapter we will\
    \ forever forgo string concatenation in lieu of template strings which allow us\
    \ to lay out strings that interpolate variables and expressions in a clear and\
    \ declarative manner. We will also explore tag functions, which can be used to\
    \ create DSLs in JavaScript. I assure you that by the end of this chapter, you\
    \ will be itching to refactor every string in your codebase to use template strings.\
    \ You might even walk away with some ideas on how you can whip up your own DSL!\n\
    \n## The Trouble with Forming Formed Strings\n\nJavaScript has the `String` primitive,\
    \ and supports constructing strings literally using single quotes or double quotes.^([^(35)](#fn35))\
    \ However, while this works for constructing strings that are static, they prove\
    \ to be rather cumbersome to work with when building strings programmatically.\
    \ Consider the following:\n\n* ① Ensure we need to put in a salutation if provided\n\
    * ② Compose the full name ensuring no middle name if there isn’t one\n\n```\n\
    const salutation = 'Mr.';\nconst name = 'Edgar';\nconst middle = 'Allen';\nconst\
    \ last = 'Poe';\nconst fullName = (salutation ? salutation + ' ' : \") ①\n+ name\
    \ + ' ' + middle.trim() + ' ' + last; ②\n// prints 'Mr. Edgar Allen Poe'\nconsole.log(fullName);\n\
    ```\n\nAs we can see, the intent of what it is we are trying to accomplish is\
    \ lost as we attempt to distinguish between the “static,” or fixed pieces of the\
    \ string, and the “dynamic,” or variable pieces of the string. This problem, of\
    \ course, is further accentuated if the dynamic pieces happen to contain function\
    \ or method calls, conditionals, or looping constructs.\n\nMany modern JavaScript\
    \ (and single-page application) frameworks like Angular allow us to embed HTML\
    \ in the same files as JavaScript (or TypeScript). HTML, like our JavaScript code,\
    \ is best written and more importantly maintained if it is formatted correctly.\
    \ Given that our only available option is string concatenation, we are forced\
    \ to participate in interpolation and indentation machinations^([^(36)](#fn36)):\n\
    \n* ① Declare a variable\n* ② Attempt to construct a rather elaborate string using\
    \ string concatenation\n* ③ Use the variable inline\n\n```\nconst title = 'Section\
    \ Title'; ①\nfunction HelloComponent() { };\nHelloComponent.annotations = [new\
    \ ng.core.Component({\nselector: 'app-hello-world',\ntemplate: '' + ②\n'' +\n\
    '' +\n'' +\n'' +\n'' +\n'' + title + '' + ③\n'' +\n'' +\n'' +\n'' +\n'' +\n''\n\
    })];\n```\n\nGood programmers do not let their friends review badly formatted\
    \ code. Thus, we are not only forced to break up lines using the `+` operator,\
    \ we also need to ensure that our code is correctly indented. However, in this\
    \ case, our editor assumes this to be JavaScript, not realizing that it is actually\
    \ HTML embedded *in* JavaScript and will proceed to re-indent all of the code\
    \ if asked to do so (if it does not do it automatically!). Of course, this concern\
    \ extends itself to almost any embedded DSL, wherein we have a conflation of interpolated\
    \ variables, and formatting.\n\nGiven what we have, we resort to string concatenation,\
    \ an archaic interpolation mechanism, all while painstakingly hitting the `Enter`\
    \ key at appropriate line lengths in the hope that our linting tool will not fail\
    \ our build because we left one too many lines badly formatted.\n\nWell, our worries\
    \ are over. ES6 introduces template literals, and as an extension, tagged template\
    \ literals.\n\n## Template literals\n\nTemplate literals introduce more syntax,\
    \ namely the back-tick, or `` ` `` as a mechanism to declare strings, and additionally,\
    \ placeholder syntax, namely `${},` to support interpolation of variables and\
    \ expressions. Template literals make it easier to compose strings consisting\
    \ of both literal strings and expressions in-line that are to be evaluated as\
    \ part of the string creation. Consider the following:\n\n* ① Introduce some constant\
    \ placeholders\n* ② Compose a string using a template literal with variable interpolation\n\
    \n```\nconst greeting = 'Hola'; ①\nconst name = 'Daniel';\nconst msg = `${greeting}!\
    \ My name is ${name}`; ②\n```\n\nThe template literal *literally* lays out a string,\
    \ minus the hoops one has to jump through with meticulously placed `+` operators.\
    \ Appropriately named variables used in interpolation within the `${}` can aid\
    \ in furthering readability.\n\nThe interpolation syntax accepts any expression—be\
    \ that function calls, math operations, or even ternary expressions.^([^(37)](#fn37))\n\
    \nTemplate literals can also be used to lay out multiline strings. If used in\
    \ this manner, they retain the layout upon evaluation. Given that many modern\
    \ editors and IDEs already support ES6 syntax, having them auto-format your code\
    \ means that we no longer lose our layout. Let us see how this were to look if\
    \ we were to revisit our Angular component example:\n\n* ① Declare a variable\n\
    * ② Use a template literal to compose a string\n* ③ Interpolate a variable inline\n\
    \n```\nconst title = 'Section Title'; ①\nfunction HelloComponent() { };\nHelloComponent.annotations\
    \ = [new ng.core.Component({\nselector: 'app-hello-world',\ntemplate: `\n ②\n\
    ${title} ③\n`\n})];\n```\n\nTemplate literals retain **all** the formatting we\
    \ introduce within the back-ticks. In our example our string starts with a newline\
    \ character, with every line following it indented with two spaces. If we were\
    \ to simply print it out using `console.log`, we will see that the template literal\
    \ remains true to its word. Again, aided by the fact that most editors now support\
    \ ES6 syntax, it is easy to spot where we are laying out strings literally, as\
    \ opposed to where we are using the interpolation syntax.\n\nThere is one limitation\
    \ of the interpolation syntax, and that is, we cannot nest interpolations. Let\
    \ us look at an example:\n\n* ① Works in an ideal case\n* ② Oops! One too many\
    \ whitespaces\n* ③ Attempting to nest interpolations will not work\n* ④ We can\
    \ take advantage of the fact that template literals evaluate to strings\n\n```\n\
    // for illustrative purposes _ marks a whitespace\n{\nconst name = 'Edgar';\n\
    const middle = 'Allen';\nconst last = 'Poe';\n// prints 'Edgar_Allen_Poe'\nconsole.log(`${name}\
    \ ${middle} ${last}`); ①\n}\n{\nconst name = 'Emily';\nconst middle = \";\nconst\
    \ last = 'Dickinson';\n// prints 'Emily__Dickinson'\nconsole.log(`${name} ${middle}\
    \ ${last}`);\n// prints 'Emily__Dickinson' ②\nconsole.log(`${name} ${middle.trim()}\
    \ ${last}`);\n// console.log(`${${name} ${middle}}.trim() ${last}`); ③\n// prints\
    \ Emily_Dickinson\nconsole.log(`${`${name} ${middle}`.trim()} ${last}`); ④\n}\n\
    ```\n\nIn our ideal case, every candidate has a first, middle, and last name.\
    \ However, in the case where we do not have a middle name, blindly concatenating\
    \ strings without a `trim` in the right places results in one too many spaces.\
    \ Also, note that our attempt to `trim` the middle name is also misplaced—trimming\
    \ the middle name aids in reducing redundant whitespace if the name itself consisted\
    \ of trailing whitespace. However, it does nothing for the space *around* an empty\
    \ middle name.\n\nWhat we would like to do is concatenate the first and middle\
    \ name, `trim` to eliminate any redundant whitespace, and only then tack on the\
    \ last name.\n\nSince we cannot nest interpolations, we are forced to take a different\
    \ tack. We can leverage the fact that template literals evaluate to their resultant\
    \ strings—thus we can nest template strings within template strings—and in a slightly\
    \ convoluted way, nest interpolations."
