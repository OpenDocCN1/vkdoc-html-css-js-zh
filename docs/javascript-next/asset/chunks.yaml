- fmt: "# Generators\n\nWe are well aware of the introduction of generators in ES6.\
    \ As previously discussed, ES6 generators are synchronous. However, what we want\
    \ when working with asynchronous operations is the ability to `await` prior to\
    \ yielding—except we cannot `await` without being in an `async` function.\n\n\
    ES9 introduces the ability to apply the `async` keyword to generator functions,\
    \ in effect, introducing asynchronous generators. We can `await` asynchronous\
    \ operations within the generator (recall that we only use `await` *inside* of\
    \ `async` functions) just like we would in regular generators, and once resolved,\
    \ `yield` those values:\n\n- ① Define an `async` generator\n- ② `await` an asynchronous\
    \ operation\n- ③ Use the `for-await-of` loop to iterate over the generator iterator\n\
    \n```javascript\nconst randomTimeout = async (val, index) => {\n  const timeout\
    \ = Math.floor(Math.random() * Math.floor(42));\n  return new Promise(res =>\n\
    \    setTimeout(res, timeout, `My value is ${val} at index: ${index}`));\n};\n\
    async function* asyncGenerator() { ①\n  yield await randomTimeout(10, 1); ②\n\
    \  console.log('First time');\n  yield await randomTimeout(20, 2);\n  console.log('Second\
    \ time');\n}\nconsole.log(typeof asyncGenerator()[Symbol.asyncIterator] === 'function');\n\
    (async () => {\n  const gen = asyncGenerator();\n  for await (const item of gen)\
    \ { ③\n    console.log('item', item);\n  }\n})();\n```\n\nAn `async` generator,\
    \ much like a regular generator function, produces an iterator object, except\
    \ the generator object returned implements the `Symbol.asyncIterator` method (as\
    \ compared to a synchronous iterable produced by a synchronous generator). Consequently,\
    \ we can no longer use the `for-of` loop with the generated iterable. However,\
    \ we *can* use the `for-await-of` loop, since it indeed works with asynchronous\
    \ iterables.\n\nThe machinery for asynchronous generators does not differ from\
    \ that from synchronous generators. They are mechanisms that allow us to create\
    \ iterables, permitting for lazy-code, and as a result, create infinite sequences.\
    \ The difference is in what they return—asynchronous iterators return us iterables\
    \ that implement the `Symbol.asyncIterator` method, allowing them to be consumed\
    \ using `for-await-of` loops.\n\n# Parity with Synchronous Iterators and Generators\n\
    \nWe have spoken at length about synchronous iterators and generators, specifically\
    \ about the ability of iterators to implement a `return()` method that is invoked\
    \ if we were to prematurely terminate iteration. We have also seen that generators\
