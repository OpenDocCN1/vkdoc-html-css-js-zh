    A programming language must provide us with all of the necessary constructs that
    empower developers to model their domain and problem space clearly and efficiently.
    Till date, JavaScript lacked support for two fundamental types that most other
    languages offer, namely maps and sets. This changes in ES6.


    In this chapter we will explore the use-cases for two new data-structures introduced
    in ES6, namely `Map`s and `Set`s. We will start with their construction and understand
    their API, and even take a look under the hood to see how they are implemented.
    By the end of this chapter, we will have a complete understanding of how and when
    we can leverage maps and sets in our code, and when it is best to avoid them.'
