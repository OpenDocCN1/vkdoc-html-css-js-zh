    # 全有或全无


    有些场景下，我们希望并行启动大量（异步）操作，要么将它们视为一个 "整体"，关心所有已决议的值，要么只关心其中一个。这与我们尝试序列化操作不同，后者会使用
    Promise 上的 `then` 方法。


    Promise API 提供了两个类级别的方法，即 `all` 和 `race`，旨在满足此需求。


    假设有一个场景，你需要从多个文件（磁盘上）读取数据，或从一系列不同的端点收集信息，并且只有在所有请求完成后，才整理结果。我们可以使用 `Promise.all`
    来启动多个并发请求，并等待它们全部完成，如下所示：


    *   ① 开始查找某个用户的所有文章

    *   ② 同样地，查找该用户的所有评论

    *   ③ 使用 `all` 并行启动多个操作

    *   ④ 接收一个包含所有已决议值的数组，顺序与传入的 Promise 顺序相同


    ```

    const p = asyncRequest(''GET'', ''https://my-json-server.typicode.com/typicode/demo/posts'');
    ①

    const c = asyncRequest(''GET'', ''https://my-json-server.typicode.com/typicode/demo/comments'');
    ②

    Promise.all([p, c]) ③

    .then(([posts, comments]) => ({ ④

    posts: JSON.parse(posts),

    comments: JSON.parse(comments),

    }))

    .then(obj => console.log(obj))

    .catch(err => console.log(err));

    ```


    我们关注的是获取某个特定用户的所有文章和评论，这是两个独立的请求。`Promise.all` 接收一个 Promise 数组，然后返回一个 Promise。当且仅当传递给
    `all` 的所有 Promise 都成功决议时，它会将所有兑现的值收集到一个数组中，按原始 Promise 的顺序排序，然后调用我们的 `then` 处理器。


    然而，如果一个或多个 Promise 失败（由于拒绝或错误），那么 `all` 返回的 Promise 也会被拒绝。


    此外，还有 `Promise.race`。顾名思义，给定一个 Promise 数组，第一个成功决议的 Promise 赢得比赛（或者第一个被拒绝的），而 "获胜"
    Promise 的决议值就是提供给处理器的唯一参数（从而丢弃之后任何其他 Promise 的决议结果）。


    `Promise.race` 的一个有趣用例是当我们希望为异步操作设置超时，如下所示：


    *   ① 开始查找某个用户的所有文章

    *   ② 将 `setTimeout` 包装在一个 Promise 中，该 Promise 在设定时间间隔后被拒绝

    *   ③ 使用 `race` 并行启动多个操作

    *   ④ 如果我们的请求在超时前完成，则接收文章数组

    *   ⑤ 否则，捕获拒绝，为后续消费者组合一个默认返回值


    ```

    const p = asyncRequest(''GET'', ''https://my-json-server.typicode.com/typicode/demo/posts'');
    ①

    const timer = new Promise((_, reject) => setTimeout(reject, 1000)); ②

    Promise.race([p, timer]) ③

    .then(posts => ({ ④

    posts: JSON.parse(posts),

    }))

    .catch(() => ({ ⑤

    posts: [],

    }))

    .then(obj => console.log(obj));

    ```


    我们在这里利用了多种技术——（简单地）将像 `setTimeout` 这样的异步操作包装在 Promise 中，将我们的实际请求与一个会在超时时被拒绝的 Promise
    进行 `race`，并从 `catch` 方法返回默认值，以便后续消费者可以继续链式调用。^(⁶⁴) 如果你想看看如果在 Ajax 请求被决议之前发生了超时，`race`
    会如何表现，只需将超时限制降低，例如 `ten`。


    最后，Promise API 还提供了两个额外的（静态）方法，即 `Promise.resolve` 和 `Promise.reject`，它们作为方便的快捷方式，尤其在测试时。


    ## 注意事项


    第一个限制是 Promise 是热切的，这意味着一旦我们使用 Promise 启动一个操作，这项工作**将会**被执行，无论是否有感兴趣的消费者。也就是说，Promise
    会尝试执行其分配的任务，而不会等待客户端附加一个 `then` 处理器。


    假设有一个场景，你尝试（通过 Ajax 调用）解析一些需要在小部件中显示的数据，然后再将小部件显示在屏幕上。现在，假设某个用户交互导致不再需要这个小部件。由于
    Promise 是热切的，无论是否有小部件来消费这些数据，获取数据的过程都会发生。*如果* Promise 能等到小部件附加了 `then` 处理器再执行，那么我们的担忧就会消失。但可惜！


    除了 Promise 是热切的（或*不*懒惰）之外，它们也是不可取消的。也就是说，Promise 对象没有提供 API 来取消其包装的底层进程。考虑一个搜索界面，它试图在我们输入查询时刷新显示的结果（很像
    Google 或 Netflix）。这要求我们每输入一个字符，就向后端发起一个 Ajax 调用。然而，很可能我们根据搜索输入框中的字符启动了一个后端调用，而根据用户输入的速度，在前一个查询完成之前，我们可能不得不启动另一个查询。如果能在开始新查询之前简单地取消之前的查询就好了。


    所有这些都归结为一个简单的经验法则——除非你确定会使用这个 Promise，否则不要创建它！


    ## 原生 API 的优势


    Promise API 现在已成为语言的一部分，这比使用库带来了**巨大**的优势：我们现在有了一个标准 API，它可以统一浏览器厂商、库和框架包装异步操作的方式。例如，`window.fetch`^(⁶⁵)
    现在可以返回一个 Promise，因为语言现在原生支持 Promise。其一个副作用是，我们现在有了一个统一的词汇来处理所有异步操作，这使我们这些开发者能够开发出一套更丰富的模式和反模式，这些模式都围绕着一个核心结构，即
    Promise。相应地，其他语言结构，如我们很快会讨论的 `async`/`await`，也可以安全地使用 Promise。


    更重要的是，在 JavaScript 中引入 Promise API 与我们看到的其他特性（如 iterables）是一致的，这些特性试图为库/框架作者和消费者提供一个共同的基础，同时又不偏离既有的社区标准（如
    Promises/A+ 规范）。


    展望未来，作为 JavaScript 开发者，如果我们都围绕（原生）Promise，无论是在我们的代码中，还是在我们对所使用的库和框架的期望中，我们都会受益。当然，就算没有其他好处，我们或许最终也能摆脱对又一个第三方库的依赖。:)


    ## 总结


    Promise 作为 JavaScript 中的原生 API 提供，相较于使用第三方库具有显著优势，它允许所有异步操作（无论原生的还是其他的）都返回一个 Promise。诚然，Promise
    本身也有其问题，但与我们之前所处的世界（处理异步操作时语义不一致）相比，它已是一个巨大的飞跃。


    在下一章中，我们将探讨一个备受期待的语言特性，即在 JavaScript 中声明类以构建继承树的能力。


    脚注 1 2 3 4 5 6 7 8

