    # 1. `let` and `const` — The New Declarations on the Block


    The use of variables in JavaScript, like in many other languages, is pervasive.
    Assignments, arguments to function calls, and results of computations; variables
    are everywhere. Simply put, they allow us to store the “state” of a program.


    JavaScript only offers one mechanism to *declare* variables, the ubiquitous `var`.
    However, as we will see in this chapter, `var` presents us with several semantic
    potholes. We will also see how the introduction of two new keywords, namely `let`
    and `const`, to declare variables helps us avoid subtle bugs, and often unintended
    side effects, as well as makes the intent of our code clearer.


    By the end of this chapter, we will have seen why `let` and `const` are not only
    the preferred way to declare and initialize variables, but also have a strong
    argument in favor of deprecating `var`. We will also learn how to refactor our
    existing code to reap the benefits that `let` and `const` offer and recognize
    the best use-case for each.'
  raw: '## How to use this book


    The examples in this book are written with two mandates—they should be bite-sized
    and should build on previously learned material. In this regard, I believe I have
    (mostly) succeeded. You can find all the examples in this book in our online repository
    located at [`https://github.com/Apress/javascript-next`](https://github.com/Apress/javascript-next)
    . Feel free to clone or download this repository, and then follow the instructions
    on usage in the README contained therein.


    Alternatively, the path of least resistance is to simply use your browser console.
    Most modern browsers, like Chrome ^([⁶](#fn6)) and Firefox, ^([⁷](#fn7)) come
    equipped with a console. ^([⁸](#fn8)) You can simply copy and paste the examples
    found in this book in the console and experiment to your heart’s desire.


    Personally, I prefer to experiment in my text editor. If you are anything like
    me, and prefer using a familiar medium, you will need Node.js installed. Follow
    the instructions on their web site ^([⁹](#fn9)) to install Node. If you already
    have Node installed and do not wish to introduce a conflict, investigate “Node
    Version Manager” ^([^(10)](#fn10)) or “nvm-windows” ^([^(11)](#fn11)) that allow
    you to install multiple versions of Node simultaneously.


    Once Node is installed, create a scratch directory anywhere on your computer and
    navigate to it. Then create a new file named `hello-world.js` with the following
    contents:


    ```

    console.log(''Hello JavaScript!'');

    ```


    Switch to the terminal, navigate to your scratch directory, and execute the following
    command:


    ```

    node hello-world.js

    ```


