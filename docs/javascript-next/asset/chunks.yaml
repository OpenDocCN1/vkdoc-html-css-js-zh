    ## Nuances and Caveats


    First and foremost, it is easy to forget to apply the `await` keyword. This will
    not result in a syntactical error—however recall that we can only `await` on operations
    that return promises. If we were to forget to apply the `await` keyword, then
    we would end up getting a reference to the returned promise, which is not what
    we want.


    Conversely, we can often get carried away with using `await` when we would be
    better off simply using the promise API. Recall that `await` suspends the execution
    of the `async` function which bodes well in situations where we need a promise
    resolved prior to proceeding with subsequent operations. However, in the cases
    where we can run operations concurrently, we will be better served by dropping
    down to the promise API, such as `all` or `race`, and consume the results using
    `await`. Observe:


    *   ① Wait on each operation in an imperative style


    *   ② Simple helper function


    *   ③ Run multiple operations concurrently


    ```

