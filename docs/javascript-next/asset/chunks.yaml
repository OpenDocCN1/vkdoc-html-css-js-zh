  trans: '

    ## `Promise` DSL 的不足


    在 JavaScript 中，当尝试执行任何长时间运行的任务时，异步编程是我们唯一的选择。Promise 作为 ES6 的原生 API，通过简化状态管理和错误传播，试图驯服回调函数带来的复杂性。Promise
    本质上是回调的封装，虽然确实让代码更容易理解，但同时也带来了一系列妥协。


    然而，JavaScript 中命令式（或阻塞式）代码与异步代码的编写方式截然不同。请看下面这段尝试以命令式执行相当简单操作的代码片段：


    - ① 命令式函数

    - ② 对结果执行一些简单操作


    ```js

    const firstSyncOp = () => 10; ①

    const secondSyncOp = arg => arg + 20;

    const thirdSyncOp = arg => arg + 30;

    const firstSyncOpResult = firstSyncOp(); ②

    const secondSyncOpResult = secondSyncOp(firstSyncOpResult);

    const result = thirdSyncOp(secondSyncOpResult);

    // 输出 ''使用同步操作 60''

    console.log(''Using synchronous operations'', result);

    ```


    虽然这个例子略显刻意，但它很好地服务于我们的用例。我们从几个同步或阻塞函数开始，然后对各个结果执行一些操作，这里是指简单的算术运算。这个例子除了有些冗长外，理解起来相当简单——我们可以把每个函数的结果当作普通值一样对待，等待使用它们，然后计算最终结果。


    接下来，我们将使用 Promise 把阻塞操作转换为非阻塞或异步操作，并尝试获得同样的结果。


    - ① 一系列异步操作

    - ② Promise 链


    ```js

    const firstAsyncOp = () => new Promise(res => setTimeout(res, 10, 10)); ①

    const secondAsyncOp = arg => new Promise(res => setTimeout(res, 10, arg + 20));

    const thirdAsyncOp = arg => Promise.resolve(arg + 30);

    const result = firstAsyncOp()

    .then(secondAsyncOp) ②

    .then(thirdAsyncOp);

    result.then((r) => {

    console.log(''Using promises'', r);

    return r;

    });

    ```


    这次，我们假设操作数是异步获取的——前两个在十分之一秒的延迟后获取，而第三个则立即解析。但由于每个操作数都被包裹在 Promise 中，我们必须使用 `then`
    API 来链式调用这些操作，最终得到与前一个例子相同的结果。


    如果比较这两种尝试，虽然最终结果相同，但两种方法看起来却大相径庭。虽然 Promise 减少了回调带来的仪式性和冗长性，但在使我们能以处理同步操作的方式来处理异步操作方面，它们几乎毫无建树。两者毫无相似之处！而这只是冰山一角。


    我们习惯于将中间操作的结果保存在变量中，这些变量又可用于条件判断或 `for` 循环等循环结构。请看下面这个对比命令式代码和 Promise 链中使用条件判断的示例：


    - ① 命令式条件判断

    - ② 我们被迫在处理器内部进行条件判断

    - ③ 我们还需要处理条件不满足的情况


    ```js

    let syncConditionalResult = firstSyncOp();

    if (syncConditionalResult > 20) { ①

    syncConditionalResult = secondSyncOp(syncConditionalResult);

    } else {

    syncConditionalResult = thirdSyncOp(syncConditionalResult);

    }

    // 输出 ''命令式条件判断结果: 40''

    console.log(`Imperative conditional result: ${syncConditionalResult}`);

    const asyncConditionalResult = firstAsyncOp()

    .then((val) => {

    if (val > 20) { ②

    return secondAsyncOp(val);

    }

    return val; ③

    })

    .then(thirdAsyncOp);

    asyncConditionalResult.then((r) => {

    // 输出 ''链式条件判断结果: 40''

    console.log(`Chained conditional result: ${r}`);

    return r;

    });

    ```


    使用命令式方式编写代码时，很容易理解其逻辑——如果为真则执行这个，否则执行那个。然而，当使用 Promise 链时，事情就变得棘手了——条件判断被嵌入了处理器内部，我们还必须处理条件判断失败的情况。


    问题的核心在于，处理异步代码时，我们被迫采用一种与同步代码不同的编程模型。我们无法以一种*看起来*是命令式的方式来处理异步代码，因此，我们失去了利用语言提供的绝大多数设施的能力。


    于是 `async` 和 `await` 应运而生。ES8 引入了这两个新关键字，并提供了相关机制，以减少 JavaScript 中同步与异步编程模型之间的差异。

    '
- fmt: "# `async/await`\n\n`async`，在 ES8 中引入，旨在用作函数修饰符。`async`函数向外界声明该函数执行的工作可能是异步的。由于我们在\
    \ ES6 中表示异步操作的标记是 Promise，因此前一句可以归结为：`async`函数**总是**返回一个 Promise，如下所示：\n\n- ①\
    \ 一个返回值的异步函数表达式\n- ② 一个显式返回 Promise 的异步函数\n\n```\nconst implicitPromise = async\
    \ () =>\n  ['Implicitly', 'wrapped', 'in', 'a', 'promise']; ①\nimplicitPromise().then(console.log);\n\
    const explicitPromise = async () =>\n  Promise.resolve(['This', 'just', 'returns',\
    \ 'the', 'promise']); ②\nexplicitPromise().then(console.log);\n```\n\n`async`尝试通过保证返回一个\
    \ Promise 来减少样板代码——对于仅仅`return`一个值的函数，`async`修饰符会自动将该返回值包装在 Promise 中。另一方面，如果函数已经返回了一个\
    \ Promise，那么它就直接返回。\n\nES8 同时引入了`await`关键字，它**只能**在`async`函数内部使用。`await`的作用是修改一个恰好返回\
    \ Promise 的函数的调用（与修改函数**定义**的`async`关键字相反）。由于`await`应用于返回 Promise 的函数（这些函数可能是其他`async`函数），因此`await`的作用是等待被返回的\
    \ Promise 状态稳定，然后继续解包该值。也许下面的示例会帮助你理解：\n\n- ① 一个返回 Promise 的简单函数\n- ② 定义一个匿名的`async`箭头函数\n\
    - ③ 在`async`函数内部使用`await`解析为一个值\n\n```\nconst firstAsyncOp = () => new Promise(res\
    \ => setTimeout(res, 10, 10)); ①\n(async () => { ②\n  const result = await firstAsyncOp();\
    \ ③\n  // 输出 '10'\n  console.log(result);\n  return result;\n})();\n```\n\n我们从一个异步执行工作并因此返回\
    \ Promise 的函数开始。然后在`async`函数内部使用`await`关键字来“等待”被返回的 Promise 状态稳定，并打印其结果。\n\n这里的关键好处是，使用`await`使我们无需向`then`提供回调，而由于`firstAsyncOp`的结果是一个\
    \ Promise，我们本需要这样做。从概念上讲，`await`会暂停它所在的`async`函数，直到它等待的函数产生结果。听起来熟悉吗？这与我们讨论过的生成器函数和`yield`关键字是相同的机制！\n\
    \n注意`await`关键字的使用如何将一个或多个异步调用转换为命令式或阻塞式代码。让我们使用`async/await`重写之前的示例，以便比较这两种方法：\n\
    \n- ① 定义一个匿名的`async`箭头函数\n- ② 在`async`函数内部使用`await`解析第一个操作的值\n- ③ 然后继续使用`await`调用后续操作，提供顺序调用的概念\n\
    - ④ 最终返回结果\n- ⑤ 由于`async`操作总是返回 Promise，我们使用`then`来消费已解析的值\n\n```\nconst result\
    \ = (async () => { ①\n  const firstAsyncOpResult = await firstAsyncOp(); ②\n \
    \ const secondAsyncOpResult = await secondAsyncOp(firstAsyncOpResult); ③\n  const\
    \ res = await thirdAsyncOp(secondAsyncOpResult);\n  return res; ④\n})();\nresult.then((r)\
    \ => { ⑤\n  console.log('Using async/await', r);\n  return r;\n});\n```\n\n我们从第一个操作开始，挂起执行直到\
    \ Promise 解析，然后将该值作为参数传递给后续函数调用，最终返回完全计算出的值。然而，之前使用 Promise 时，我们被迫使用`then`来排序操作。`await`消除了所有这些繁琐的步骤——事实上，这个实现看起来与我们的同步示例没有太大区别。这个示例与同步实现不同的地方在于，如果我们想使用来自立即执行函数表达式的返回值。回想一下，`async`函数的返回值总是被包装在\
    \ Promise 中——因此，如果我们想使用`result`，我们就必须使用`then` API。\n\n利用条件语句和循环结构与预期一样有效。让我们回到之前使用条件语句的示例，只不过这次使用`async/await`：\n\
    \n- ① 一个命令式的条件检查\n\n```\nconst result = (async () => {\n  let firstAsyncOpResult\
    \ = await firstAsyncOp();\n  if (firstAsyncOpResult > 20) { ①\n    firstAsyncOpResult\
    \ = await secondAsyncOp(firstAsyncOpResult);\n  } else {\n    firstAsyncOpResult\
    \ = await thirdAsyncOp(firstAsyncOpResult);\n  }\n  return firstAsyncOpResult;\n\
    })();\nresult.then((r) => {\n  // 输出 'async/await conditional result: 40'\n  console.log(`async/await\
    \ conditional result: ${r}`);\n  return r;\n});\n```\n\n`firstAsyncOpResult`是*异步*操作的结果这一事实，丝毫不会影响我们的代码。去掉`async/await`关键字，我们发现这正是我们处理同步操作结果的方式。\n\
    \n让我们检查一个更实际的用例来突出`async`和`await`的用途。在这个示例中，我们将尝试使用 Fetch API 进行一个 Ajax 调用，以`GET`一个资源并解包响应。请记住，`fetch`返回一个\
    \ Promise，该 Promise 产生一个`Response`对象，而该对象又拥有`json`方法，该方法也返回一个 Promise。我们将编写两个实现——一个使用原生\
    \ Promise，一个使用`async`和`await`：\n\n- ① 使用`fetch`暴露的原生 API\n- ② 定义一个`async`函数\n\
    - ③ 等待 fetch 操作完成\n- ④ 然后等待 JSON 负载被解析\n- ⑤ 调用我们基于 Promise 的实现\n- ⑥ 调用我们基于`async/await`的实现\n\
    - ⑦ 使用`async/await`消费`fetch`操作的结果\n\n```\nconst getWithPromises = url => fetch(url).then(resp\
    \ => resp.json()); ①\nconst getWithAsyncAwait = async (url) => { ②\n  const resp\
    \ = await fetch(url); ③\n  return await resp.json(); ④\n};\nconst url = 'https://my-json-server.typicode.com/typicode/demo/comments';\n\
    getWithPromises(url) ⑤\n  .then((json) => {\n    console.log(json);\n    return\
    \ json;\n  });\ngetWithAsyncAwait(url) ⑥\n  .then((json) => {\n    console.log(json);\n\
    \    return json;\n  });\n// 或者\n(async () => {\n  // 两种方式效果相同\n  // const json\
    \ = await getWithPromises(url);\n  const json = await getWithAsyncAwait(url);\
    \ ⑦\n  console.log(json);\n})();\n```\n\n这个示例突出了两个微妙但不同的问题。当尝试使用一个返回 Promise 的\
    \ API（如`fetch`）时，使用`async/await`可以使实现更清晰、更易于理解。另一方面，我们如何实现获取功能，对我们如何消费它没有任何影响。鉴于两种情况下我们都总是返回一个\
    \ Promise，我们可以使用传统的`then`调用，或者使用另一个（匿名的）`async`函数。也就是说，我们可以开始考虑在任何使用 Promise 链的地方使用`async/await`。\n\
    \n如果 Promise 被拒绝了呢？好吧，`async/await`的目的是让异步代码看起来像是命令式的。因此，我们像通常一样捕获错误（和拒绝）——使用我们钟爱的`try/catch`。观察：\n\
    \n- ① 一系列异步操作\n- ② 这个操作被拒绝\n- ③ 将我们的代码包裹在 try-catch 中"
  raw: '## `async/await`


    `async,` introduced in ES8, is meant to be used as a function modifier. An `async`
    function declares to the world that the work being done by the function may be
    asynchronous. Since our token for asynchronous operations (since ES6) is promises,
    the previous statement boils down to this—`async` functions **always** return
    a promise, like so:


    *   ① An async function expression returning a value


    *   ② An async function returning a promise explicitly


    ```

    const implicitPromise = async () =>

    [''Implicitly'', ''wrapped'', ''in'', ''a'', ''promise'']; ①

    implicitPromise().then(console.log);

    const explicitPromise = async () =>

    Promise.resolve([''This'', ''just'', ''returns'', ''the'', ''promise'']); ②

    explicitPromise().then(console.log);

    ```


    `async` attempts to reduce the boilerplate by guaranteeing the return of a promise—for
    functions that simply `return` a value, the `async` modifier automatically wraps
    the return value in a promise. On the other hand, if the function already returns
    a promise, then it is simply returned.


    ES8 simultaneously introduces the `await` keyword, which can **only** be used
    within `async` functions. The role of `await` is to modify the invocation of a
    function that happens to return a promise (as opposed to the `async` keyword that
    modifies a function *definition*). Since `await` applies to functions that return
    promises (which could be other `async` functions), the role of `await` is to wait
    for the promise being returned to be settled and then proceed to unwrap that value.
    Perhaps the following example will help clear this up:


    *   ① A simple function that returns a promise


    *   ② Define an anonymous `async` fat-arrow function


    *   ③ Use `await` inside the `async` function to resolve to a value


    ```

    const firstAsyncOp = () => new Promise(res => setTimeout(res, 10, 10)); ①

    (async () => { ②

    const result = await firstAsyncOp(); ③

    // prints ''10''

    console.log(result);

    return result;

    })();

    ```


    We start with a function that happens to do its work asynchronously, therefore
    returning a promise. We then use the await keyword inside an `async` function
    to “wait” on the promise being returned to settle and print its result.


    The key benefit here is that using `await` avoids us having to supply a callback
    to `then`, which we would have to do to since the result of `firstAsyncOp` is
    a promise. Conceptually, `await` suspends the `async` function it is wrapped in
    till the function it is waiting on yields a result. Sounds familiar? This is the
    same machinery we discussed with generator functions and the `yield` keyword!


    Notice how the use of the `await` keyword converts one or more asynchronous calls
    into imperative, or blocking code. Let us rewrite our earlier example using `async`/`await`
    so we can compare the two approaches:


    *   ① Define an anonymous `async` fat-arrow function


    *   ② Use `await` inside the `async` function to resolve the first operation’s
    value


    *   ③ Then proceed to invoke subsequent operations using `await` providing the
    notion of sequential invocations


    *   ④ Finally return the result


    *   ⑤ Since `async` operations always return promises, we use `then` to consume
    the resolved value


    ```

    const result = (async () => { ①

    const firstAsyncOpResult = await firstAsyncOp(); ②

    const secondAsyncOpResult = await secondAsyncOp(firstAsyncOpResult); ③

    const res = await thirdAsyncOp(secondAsyncOpResult);

    return res; ④

    })();

    result.then((r) => { ⑤

    console.log(''Using async/await'', r);

    return r;

    });

    ```


    We start with our first operation, suspending execution till the promise resolves,
    and then use that value as an argument to subsequent function calls, eventually
    returning the fully calculated value. However, when we were previously using promises,
    we were forced to sequence operations using `then`. `await` eliminates all the
    ceremony—in fact, this implementation does not look that much different than our
    synchronous example. The one time where this example does diverge from a synchronous
    implementation is if we wish to use the `return`-ed value from our IEFE. Recall
    that the return value from an `async` function is always wrapped in a promise—ergo,
    if we wish to use result, we are then compelled to use the `then` API.


    Leveraging conditionals and looping constructs works just as would expect. Let
    us return to our earlier example using conditionals, except this time with `async`/`await`:


    *   ① An imperative conditional check


    ```

    const result = (async () => {

    let firstAsyncOpResult = await firstAsyncOp();

    if (firstAsyncOpResult > 20) { ①

    firstAsyncOpResult = await secondAsyncOp(firstAsyncOpResult);

    } else {

    firstAsyncOpResult = await thirdAsyncOp(firstAsyncOpResult);

    }

    return firstAsyncOpResult;

    })();

    result.then((r) => {

    // prints ''async/await conditional result: 40''

    console.log(`async/await conditional result: ${r}`);

    return r;

    });

    ```


    The fact that `firstAsyncOpResult` is the result of an *asynchronous* operation
    in no way affects our code. Take away the `async`/`await` keywords and we see
    that this is exactly how we would work with the results of synchronous operations.


    Let us examine a more real-world use-case to highlight the uses of `async` and
    `await`. In this example we will attempt to make an Ajax call using the Fetch
    API^([^(97)](#fn97)) to `GET` a resource, and unwrap the response. Bear in mind
    that `fetch`^([^(98)](#fn98)) returns a promise which results in a `Response`^([^(99)](#fn99))
    object, which in turn has the `json`^([^(100)](#fn100)) method which too returns
    a promise. We will write two implementations—one using the native promises, and
    one using `async` and `await`:


    *   ① Using the native API exposed by `fetch`


    *   ② Define an `async` function


    *   ③ Wait for the fetch operation to complete


    *   ④ Then wait for the JSON payload to be resolved


    *   ⑤ Invoke our promise-based implementation


    *   ⑥ Invoke our `async`/`await-`based implementation


    *   ⑦ Consume the result of a `fetch` operation using `async`/`await`


    ```

    const getWithPromises = url => fetch(url).then(resp => resp.json()); ①

    const getWithAsyncAwait = async (url) => { ②

    const resp = await fetch(url); ③

    return await resp.json(); ④

    };

    const url = ''https://my-json-server.typicode.com/typicode/demo/comments'';

    getWithPromises(url) ⑤

    .then((json) => {

    console.log(json);

    return json;

    });

    getWithAsyncAwait(url) ⑥

    .then((json) => {

    console.log(json);

    return json;

    });

    // alternatively

    (async () => {

    // either one works just the same

    // const json = await getWithPromises(url);

    const json = await getWithAsyncAwait(url); ⑦

    console.log(json);

    })();

    ```


    This example highlights two subtle but separate concerns. When attempting to use
    an API (like `fetch`) that returns promises, using `async`/`await` can make the
    implementation a bit more clearer and easier to reason about. On the flip side,
    how we implement our fetching functionality has no impact whatsoever on how we
    consume it. Given that in either case we are always returning a promise, we can
    either use the traditional `then` invocation, or use another (anonymous) `async`
    function. That is, we can start to consider using `async`/`await` any place where
    we are using a promise chain.


    What if a promise were to be rejected? Well, the intent of `async`/`await` is
    to make asynchronous code seem imperative. Therefore, we trap errors (and rejections)
    the same way we normally do—using our beloved `try`/`catch` . Observe:


    *   ① A series of asynchronous operations


    *   ② This one is rejected


    *   ③ Wrap our code in a try-catch'
