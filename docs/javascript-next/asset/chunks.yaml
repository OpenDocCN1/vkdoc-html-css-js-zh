    *   ① 定义我们的代理助手

    *   ② 一个用于缓存实例的局部变量

    *   ③ 捕获构造函数调用

    *   ④ 如果没有实例，则调用提供的构造函数

    *   ⑤ 否则返回我们缓存的实例

    *   ⑥ 我们希望视为单例的类

