- fmt: '# 3. Effective Function Signatures with Default and Rest Parameters


    We all realize the pervasive use of functions in JavaScript. Consequently, defining
    functions and laying out function signatures is one thing we do a lot. Default
    parameters, a new feature introduced in ES6, provide us the power to improve how
    we detail our function signatures. They allow us to specify what the value of
    a parameter to a function ought to be if no value is passed in at invocation time.
    Along the same vein, rest parameters allow us to express that a function (or method)
    has no expectation to the number of arguments you can supply it—in other words,
    they allow us to explicitly declare variadic functions.


    In this chapter we will explore the new syntax for both default and rest parameters.
    We will see how we can write function signatures that provide our consumers incredible
    flexibility in how they use them, while simultaneously reducing the amount of
    error checking we have to do internally. By the end of this chapter, we will be
    left wondering how we ever managed to work with functions as we know them today!


    ## Unintentionally Obscuring Intent with Arguments


    JavaScript function signatures only include the name of the function. This diverges
    from many other languages where the signature includes the return type and the
    parameter list. Since JavaScript is dynamically typed, functions do not declare
    their return type. However, the part that is most relevant to our discussion here
    is that the parameter list does not participate in the function signature either.
    This is the reason why we do not have overloaded functions in JavaScript. Two
    functions with the same name even with different parameter lists **will** collide,
    with the one defined later overwriting the previous one.


    Furthermore, JavaScript allows functions to be invoked with as few or as many
    arguments as the caller wishes to supply. This means that despite a functions
    *formal* signature, also referred to as its “arity,” *every* function in JavaScript
    is a multi-arity function. We can inspect the same as follows:


    * ① Recall that arrow functions do not have an `arguments` object created upon
    invocation. This forces us to use a function statement

    * ② Invoke `sayHello` with zero arguments

    * ③ Invoke `buildUrl` with more arguments than the function expects

    * ④ Invoke `add` correctly


    ```

    const sayHello = name => ''Hello '' + name;

    const buildUrl = (site, protocol) => protocol + ''://'' + site;

    function add( /**args*/ ) { ①

    let result = 0;

    for (const i in arguments) {

    result += arguments[i];

    }

    return result;

    }

    console.assert(sayHello.length === 1);

    console.assert(buildUrl.length === 2);

    console.assert(add.length === 0);

    // prints ''Hello undefined''

    console.log(sayHello()); ②

    // prints ''https://jsrocks.com''

    console.log(buildUrl(''jsrocks.com'', ''https'', ''non-required argument''));
    ③

    // prints 42

    console.log(add(12, 22, 8)); ④

    ```


    Here, we define three functions with differing arities. Officially, all three
    functions report an arity via the `length` property that is available on function
    objects.


    However, as demonstrated, we can invoke any of those functions with as many or
    as few arguments as we like, and as the outputs suggest, we may or may not get
    the desired results. It turns out that JavaScript functions can declare the number
    of arguments they expect to be supplied by formally listing them in their parameter
    lists. However, there is no check at runtime to ascertain if indeed the function
    is invoked with the correct number of arguments. Essentially, we can either *assume*
    that the function will be invoked correctly or be prepared by installing appropriate
    checks in the implementation in case we don’t get all that we expect.


    Lastly, in our example `add` *is* a function that is attempting to be multi-arity—that
    is, it is a function that can indeed consume as many arguments as we supply it.
    But with no first-class construct in the language to declare this as part of the
    function signature, we are forced to provide a hint (typically via documentation
    or a comment as shown) to clients that they can provide additional arguments if
    they do wish to do so.


    Enter default and rest parameters.


    ## Default Parameters


    Default parameters provide us with a mechanism to highlight what a function really
    needs, and a way to assume some parameters if they are not supplied. Recall that
    JavaScript does not have any runtime enforcement to ensure that a function is
    invoked with the correct number of arguments. Therefore, we, the developers, are
    forced to accommodate for missing arguments in our implementations. Observe:


    * ① Enforce that `site` is required by throwing a runtime error

    * ② We can default `protocol`


    ```

    /**

    * Builds a url

    *

    * @param {site} the url (required)

    * @param {protocol} can be http or https (optional) - defaults to http

    * @returns {string}

    */

    const buildUrl = (site, protocol) => {

    if (!site) { ①

    throw new Error(''site is required'');

    }

    const p = protocol || ''http''; ②

    return p + ''://'' + site;

    };

    ```


    Here, we attempt to build a more resilient implementation of the `buildUrl` function.
    However, the fact that `site` is required and `protocol` is optional is now hidden
    within the confines of its implementation. Documentation can act as an aid—however,
    as we all know, it is often at best incomplete, and at worst, nonexistent.


    Default parameters allow us to express the same like so:


    ```

    const buildUrl = (site, protocol = ''http'') => {

    if (!site) {

    throw new Error(''site is required'');

    }

    return protocol + ''://'' + site;

    };

    ```


    The default value for `protocol` is now explicitly stated in the method signature,
    signaling what it will be *if* the client decided to skip it. Admittedly the fact
    that `site` is required still remains implicit; however the fact that the function
    author could not find a suitable default for it might in itself be telling.


    In other words, a quick glance at the signature of this function reveals far more,
    which previously would have forced the client to peek at the implementation (if
    that was even possible), look at the docs (if they were available), or play Russian
    roulette with argument combinations to see what is or isn’t possible.


    Now that we have default parameters as a first-class construct in the language,
    tools like EsDocs^([^(21)](#fn21)) can even parse out default parameters and automatically
    highlight them in generated documentation. This makes using this feature even
    more enticing.


    Let us now look at some subtleties of default parameters.'
