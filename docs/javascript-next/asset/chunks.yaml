    \ 可以像处理原生 promise 一样处理它们。放心大胆地去用 `await` 吧！\n\n## 总结\n\n`async`/`await` 与 promises\
    \ 一起，让我们能够以最适合用例和编程风格的范式来编写 JavaScript 代码——前者更偏向命令式，而后者则更倡导函数式思维。虽然命令式风格对许多人来说可能更自然，但我们必须记住，promises\
    \ 提供了诸如 `all` 和 `race` 之类的机制，这些机制可能使我们的代码运行得更快，同时也能与 `await` 配合使用，从而允许我们根据需要为手头的问题提升或降低抽象层次。promises\
    \ 的使用仍然有其价值，但 `await` 确实有助于减少或消除使用 promises 所带来的一些负担。\n\n在下一章中，我们将看到另一个扩展，其中迭代器和生成器可以像处理同步操作一样轻松地处理异步操作。\n\
    \n脚注 1   2   3   4   5\n\n# 15. 异步迭代器和生成器——思想的碰撞\n\n生成器的概念很诱人，而且往往会让我们变得挑剔。我们不再害怕处理大型或无限序列以及数据流。然而，尽管生成器在处理值方面表现出色，但它们从来就不是为处理\
    \ promises 而设计的。\n\n在本章中，我们将看到另一种融合——它将生成器的语法与 `async` 和 `await` 结合起来，为我们带来了异步生成器和迭代器。\n"
- fmt: '# The Impedance Mismatch Between Generators/Iterators and Asynchronous Operations


    ES6 introduced us to iterables, the well-known symbol `Symbol.iterator` that allows
    an object to be iterable, as well as the new `for-of` loop that knows to iterate
    over an iterable. The handshake between an iterator, and anything consuming the
    iterator, happens to be an object that takes the form `{ value: ..., done: ...}`.
    If the iterator is not `done`, then the consumer can consume the `value`. Once
    the return value of the iterator returns `done` to `true`, iteration stops.


    ES6 also introduced another feature: generator functions. Generator functions
    are functions that can be suspended using the `yield` (and `yield*`) operator.
    They return generator objects that happen to be iterable, which means, they have
    a method that responds to `Symbol.iterator`. In other words, we can loop over
    a generator object using the `for-of` loop.


    Whatever mechanism we employ to produce or consume iterables will work well if
    we are operating with the result of synchronous operations. However, if the values
    happen to be the result of asynchronous operations, or promises, then things become
    a little arduous. Observe:


    - ① A helper function to create a randomized timeout value

    - ② Returns a promise that resolves to a value and an index

    - ③ An iterable that contains promises

    - ④ We need to wait for the promise to be resolved


    ```javascript

    const randomTimeout = async (val, index) => {

    const timeout = Math.floor(Math.random() * Math.floor(42)); ①

    return new Promise(res =>

    setTimeout(res, timeout, `My value is ${val} at index: ${index}`)); ②

    };

    const promiseList = [

    randomTimeout(10, 1),

    randomTimeout(20, 2),

    randomTimeout(30, 3),

    ]; ③

    // prints the following (your ordering might vary)

    // My value is 20 at index: 2

    // My value is 10 at index: 1

    // My value is 30 at index: 3

    for (const p of promiseList) {

    p.then(console.log); ④

    }

    ```


    We start with a simple helper function that takes a value (to resolve to) and
    an index so we can see the sequence in which we invoked it. The function implementation
    produces a random timeout value, and uses that to return a promise that eventually
    resolves to a value. We then use this helper function to produce an array of asynchronous
    operations.


    Let us, for a moment, ignore the fact that we are using an array of promises,
    and pretend that the iterable we are working with is of unknown length, like reading
    all of the lines in a file using I/O. After all, if we had a (fixed) list of promises,
    we could simply use `Promise.all` to let them work concurrently, and gather up
    the results.


    With that in mind, notice that while the `for-of` loop successfully iterates over
    the list of promises, we still need to wait for each promise to be resolved. However,
    the astute observer will notice that this does not fulfill our requirements. While
    the `for-of` loop diligently returns us the promises in order, they resolve at
    different times. Therefore, the output we see is not in the same order as the
    initial order of the promises. That’s because the `for-of` loop is not aware that
    the values being produced by the iterator are asynchronous.


    But wait. ES8 introduced us to `async`/`await`. Can’t we use that here? Of course!


    - ① `await` out the returned promise prior to proceeding with the loop


    ```javascript

    const promiseList = [

    randomTimeout(10, 1),

    randomTimeout(20, 2),

    randomTimeout(30, 3),

    ];

    (async () => {

    for (const p of promiseList) {

    const res = await p; ①

    console.log(res);

    }

    })();

    ```


    This time around, we use `await` to suspend the `for-of` loop till our promise
    resolves. `await` suspends the execution of the `for-of` till each promise in
    succession is resolved, thereby giving us the output we expect. We incur the cost
    of a little boilerplate since we have to wrap the call to `await` inside an anonymous
    `async` function, but it does seem to work.


    Now let us consider the production side. We know that generator functions produce
    generator objects, which are iterable. Once again, this gets the job done if the
    values being `yield`-ed are synchronous. But yielding asynchronous data sources
    produces rather surprising results:


    - ① Define a generator

    - ② `yield` promises

    - ③ Start consuming


    ```javascript

    function* asyncGenerator() { ①

    yield randomTimeout(10, 1); ②

    console.log(''First time'');

    yield randomTimeout(20, 2);

    console.log(''Second time'');

    }

    const generator = asyncGenerator(); ③

    // prints ''{ value: Promise {  }, done: false }''

    console.log(generator.next());

    // prints ''{ value: Promise {  }, done: false }''

    console.log(generator.next());

    // prints ''{ value: undefined, done: true }''

    console.log(generator.next());

    for (const i of asyncGenerator()) {

    console.log(i);

    }

    (async () => {

    for (const p of asyncGenerator()) {

    const res = await p;

    console.log(res);

    }

    })();

    ```


    We define a simple generator, which `yield`s promises, and attempt to get the
    values by invoking `next`, then using a traditional `for-of` loop and finally
    using `async`/`await`. Notice that in each case, we get the expected `{ value:
    ..., done: ... }` tuple, except in this case, the `value` happens to be a promise.


    This example reveals the true issue at hand—in that, when an iterator hands us
    a result, it attempts to tell us the `value` and whether it is `done` or not.
    In this case, we see that the `value` happens to be a promise, which may or may
    not have resolved yet—however, the generator continues to `yield` values till
    it’s done!


    In other words, while the resolution of the `value` is asynchronous, the calculation
    of whether the generator is `done` *is* synchronous, and therefore, incorrect.
    We **cannot** declare the iterator to be `done` till the `value` is resolved (or
    rejected).


    All of this adds salt to the injury—which is, the whole point of iterating over
    an iterable is to get the values *in sequence*!


    To summarize, on the consumption side, we want our `for-of` loops to give us the
    values we expect in order, pausing for asynchronous data sources to be resolved
    prior to proceeding to the next iteration.


    On the production side, we want to `await` prior to `yield`-ing within a generator.
    But alas! We can only `await` *inside* `async` functions.


    ES9 introduces us to a new symbol, an asynchronous `for-of` loop, and the idea
    of `async` generators, allowing us to iterate over and produce asynchronous iterables.
    Let’s get started.'
