  trans: '

    ## 为什么对象还不够用


    JavaScript 提供了两种类似“集合”的对象——普通对象（使用 `{}` 字面量表示）和数组（使用 `[]` 字面量表示）。普通对象通常被称为关联数组或字典，通过键进行查找。而数组则提供了一种顺序数据结构，能够通过索引进行高效的随机查找。


    对象和数组虽然有用，但并不能满足所有使用场景。对象作为*真正*的键值存储的一个限制是，对象的键**都是**字符串。换句话说，当在对象中使用时，键的“类型”无法保留。这一点可以简单地演示如下：


    - ① 创建一个包含两个*看似*不同的键的对象

    - ② 用特定类型查询对象中的某个键

    - ③ **仅**交换键值对的顺序，不做其他更改

    - ④ 现在相同的查询结果不同了


    ```

    const obj1 = {

    ''true'': ''String'',

    true: ''Boolean'',

    }; ①

    console.assert(obj1[true] === ''Boolean''); ②

    const obj2 = {

    true: ''Boolean'',

    ''true'': ''String'',

    }; ③

    console.assert(obj2[true] === ''String''); ④

    ```


    这一点对于任何曾将 JavaScript 对象序列化为 JSON 的人来说（我们*所有人*都遇到过）都是显而易见的。


    鉴于这个限制，如果我们需要保留键的*类型*，我们别无他法。^(⁴²)


    因此，ES6 为我们提供了映射（Maps）和集合（Sets）。映射与对象非常类似，也是键值存储；但映射会保留键的类型，更接近其他语言中提供的映射。而集合则填补了一个角色，在
    ES6 之前，开发者不得不对数组中的条目进行大量的 `===` 检查，或者仅仅使用字符串作为对象中的“唯一条目”，如果都不行，就只能求助于第三方库^(⁴³)
    来满足需求。


    我们的探索到此为止。我们先从映射开始，接着介绍集合。


    ## 映射


    映射与对象非常相似，也通过键进行查找，区别在于映射会保留键的*类型*（而不是像对象那样将它们强制转换为字符串）。映射提供了一个构造函数作为创建新映射的方式。与数组和对象不同，映射**没有**提供字面量构造方式，这对其可序列化性有一定影响（我们稍后会看到）。映射还提供了一套全面的
    API，用于在映射中添加、更新和删除键值对，下面一一演示：


    *映射的键值 API*


    - ① 创建映射的构造函数

    - ② 使用 `set` 设置键

    - ③ `set` 是一个流畅接口，返回映射本身

    - ④ `has` 表示是否拥有该键

    - ⑤ `get` 是查询 API

    - ⑥ 强制发生冲突会导致之前的*值*被覆盖

    - ⑦ 最后设置的值胜出

    - ⑧ 如果删除一个已有键，映射返回 true

    - ⑨ 删除不存在的键


    ```

    const obj = {};

    const map = new Map(); ①

    map.set(''string'', ''is a string''); ②

    map.set(true, ''is a boolean'');

    map.set(1, ''is a number'').set(obj, ''is an object''); ③

    console.assert(map.has(1)); ④

    console.assert(map.get(obj) === ''is an object''); ⑤

    map.set(1, ''overrides first''); ⑥

    console.assert(map.get(1) === ''overrides first''); ⑦

    console.assert(map.delete(''string'')); ⑧

    console.assert(map.has(''string'') === false);

    console.assert(map.delete({}) === false); ⑨

    ```


    `Map` API 提供了我们处理键值所需的一切。`set` 接口是流畅的，这无疑是一个强大的盟友，可以避免因非流畅接口而产生的冗余代码。冲突的处理方式也符合预期，最后，我们可以使用
    `delete` API 从映射中移除一个键值对，如果键确实从映射中被删除，则返回 `true`（如果键不存在，`delete` 会返回 `false`，表示没有东西可删）。


    在更高层面，还有一些 API 允许我们整体操作映射，例如获取所有条目、条目计数，甚至清空映射（如果我们想这样做的话）：


    - ① 可接受可迭代对象的替代构造函数

    - ② 表示键值对的元组

    - ③ 元组中多余的元素会被丢弃

    - ④ 只有键，因此值被设置为 `undefined`

    - ⑤ 键值对都缺失

    - ⑥ 一个略显奇怪但用于查询数量的属性

    - ⑦ 用于遍历键值对的函数式 API

    - ⑧ 这些方法都返回迭代器

    - ⑨ 清空映射并将其 `size` 设为 0 的 API


    ```

    const map = new Map([ ①

    [''s'', ''is a string''], ②

    [true, ''is a boolean'', ''willBeIgnored''], ③

    [1], ④

    [], ⑤

    ]);

    console.assert(map.size === 4); ⑥

    console.assert(map.get(''s'') === ''is a string'');

    console.assert(map.get(true) === ''is a boolean'');

    console.assert(map.get(1) === undefined);

    console.assert(map.get(undefined) === undefined);

    console.assert(map.has(undefined));

    map.forEach((v, k) => console.log(v, k)); ⑦

    console.log(map.entries());

    console.log(map.keys());

    console.log(map.values()); ⑧

    map.clear(); ⑨

    console.assert(map.size === 0);

    ```


    映射还提供了另一个有用的构造函数，可以使用任何“可迭代对象”来创建映射。一种常见用法是向构造函数传入一个数组的数组。每个嵌套数组被视为一个二元组，分别表示键和值。如果嵌套数组只包含一个元素，则该值被设置为
    `undefined`。如果数组包含超过两个元素，则所有多余的元素都会被忽略。最后，如果数组为空，则键和值都被设置为 `undefined`。如果提供的数组**没有**产生冲突，那么生成的映射将按数组相同的顺序排列其键，并且生成的映射的
    `size` 将等于数组的 `length`。

    '
- fmt: 'Maps retain the insertion order of their entries, specifically the order in
    which the **keys** were added. However, if there happens to be a collision, then
    the new value overrides the previous value *at the location where the key exists*.
    That is, they act very much like arrays except their “indexes” happen to be of
    any type.


    Since maps maintain order, they allow us to iterate over their `entries` with
    methods like `forEach`, as well as the `entries` API which returns one key-value
    pair at a time, wrapped in an array of `length` 2 represented as `[key, value]`.
    Maps also expose a `keys` and a `values` API, which, as their names suggest, return
    an array of the keys and values in the map, in insertion order.


    Maps, like arrays abide by the “iterator” contract, which as we have discussed
    earlier, allows maps to be spreadable using the `...` operator, and consequently
    be destructured. Maps as we have seen can be created using an array of arrays;
    conversely spreading a map, as one might deduce, explodes a map into an array
    of arrays, with each array being a tuple of key and value, and the encompassing
    array reflecting the order of insertion, and its `length` being the `size` of
    the map.


    - ① Create a map

    - ② Explode a map into an array

    - ③ Destruct for the second and third entries


    ```

    const firstQuarter = new Map([

    [1, ''Jan''],

    [2, ''Feb''],

    [3, ''Mar''],

    [4, ''Apr''],

    ]); ①

    const mapToStr = [...firstQuarter].join('':''); ②

    console.assert(mapToStr === ''1,Jan:2,Feb:3,Mar:4,Apr'');

    const [

    ,

    [n2, m2],

    [n3, m3],

    ] = firstQuarter; ③

    console.assert(n2 === 2);

    console.assert(m2 === ''Feb'');

    console.assert(n3 === 3);

    console.assert(m3 === ''Mar'');

    ```


    Given that maps are iterable, and that the `Map` constructor expects an iterable,
    proves to be very convenient when we attempt to create new maps from existing
    maps. This is even handier when creating new maps that happen to be the union
    of other maps:


    - ① Union of two maps

    - ② “last one in” mantra


    ```

    const nihar = new Map([

    [''car'', ''mazda''],

    [''residence'', ''apartment''],

    ]);

    const ericka = new Map([

    [''pet'', ''oscar''],

    [''residence'', ''house''],

    ]);

    const union = new Map([...nihar, ...ericka]); ①

    console.assert(union.get(''car'') === ''mazda'');

    console.assert(union.get(''residence'') === ''house''); ②

    console.assert(union.get(''pet'') === ''oscar'');

    ```


    We start with two separate maps, and then attempt to construct a new one by leveraging
    the fact that maps are “spreadable”, and that the map constructor can utilize
    an array to construct a new map. Notice that in this case, the array that is passed
    to the constructor has **four** entries; however, as the map attempts to add each
    entry to the new map, it detects a collision when encountering the `residence`
    key. Thus, the resulting array will have `house` as the value for the `residence`
    key.


    To round out maps, let us answer the pertinent question that still remains to
    be answered—what deems two keys to be the same? The answer lies in the `===` operator.
    If upon a `set` any existing key in the map returns `true` for a `===` test against
    any of its keys, that is deemed a collision, and the value for that key will be
    set to the new value. Otherwise, a new key-value entry is inserted at the end
    of the map.


    ## Caveats


    There aren’t too many caveats associated with maps. The API is comprehensive and
    does all we expect a map to do.


    However, the first strike is the lack of a literal. This forces us to use the
    constructor, and seems to be against the grain of how we usually work with objects
    and arrays. There are many reasons not to use constructors in JavaScript^([^(44)](#fn44))
    but alas, no recourse for us here. Let us observe this dichotomy with a simple
    example:


    - ① Objects offer us the literal `{}` syntax

    - ② Similarly arrays offer us the `[]` literal

    - ③ We are forced to use the constructor


    ```

    const kiran = { ①

    name: ''kiran'',

    profession: ''pharmacist'',

    };

    const favFruits = [ ②

    ''mango'',

    ''guava'',

    ''pineapple'',

    ];

    const numbersInHindi = new Map(); ③

    numbersInHindi.set(1, ''ek'').set(2, ''do'').set(3, ''teen'');

    ```


    The second concern involves serializing (and deserializing) to (and from) JSON.
    The JSON specification^([^(45)](#fn45)) accommodates only two data-structures—objects
    and arrays. Consequently, using `JSON.stringify` on any map does not do what one
    would expect.


    Turns out, the closest we can get to a serialized version of a map is to treat
    it as an array of arrays. On the other end, we can simply `JSON.parse` the string
    we receive, and hand it to the map constructor to create a new map out of it.
    Observe:


    - ① Handy function to serialize a map

    - ② The converse of serializing


    ```

    const nihar = new Map([

    [''car'', ''mazda''],

    [''residence'', ''apartment''],

    ]);

    const mapToJson = map => JSON.stringify([...map]); ①

    const jsonToMap = mapStr => new Map(JSON.parse(mapStr)); ②

    const serialized = mapToJson(nihar);

    // prints ''[["car","mazda"],["residence","apartment"]]''

    console.log(serialized);

    const deserialized = jsonToMap(serialized);

    // prints ''Map { ''car'' => ''mazda'', ''residence'' => ''apartment'' }''

    console.log(deserialized);

    ```


    Wrapping the serializing/deserializing logic into utility functions can prove
    to be beneficial as we will see soon. Also, turns out, maps “iterability” proves
    once again to be our friend.


    However, if this has you a tad concerned, then you are not alone. The lack of
    support for maps at the data-exchange layer shifts the onus of knowing what is
    or isn’t a map to the application layer. In other words, simply looking at the
    JSON in no way suggests that something should be read in as a map vs. simply being
    an array of arrays.


    Furthermore, we can no longer simply use `JSON.stringify` on an object or an array
    if there is a chance that it contains a map! We are now forced to interrogate
    all the values and if it happens to be a map, use our handy functions to first
    serialize that value, and only then serialize the parent. Alternatively we could
    try to use a third-party library^([^(46)](#fn46)) to do the conversion for us.^([^(47)](#fn47))


    The catch here is that keys for maps can be of *any* type, including references.
    Let us contrast this with serializing objects; keys in objects are always strings,
    which evaluate to themselves. Therefore, serializing an object key simply distills
    down to putting the string itself in JSON. Not so much with maps! If we were to
    use an object reference as a key in a map, and that reference were to be serialized,
    upon deserialization that reference is lost! Consider the following:


    - ① Serialize a map containing an object reference as a key

    - ② Deserialize it back into a map

    - ③ Lookup for the object reference fails


    ```

    const obj = {

    name: ''some object'',

    };

    const map = new Map([

    [obj, ''value against an object key''],

    ]);

    const mapToJson = m => JSON.stringify([...m]);

    const jsonToMap = mapStr => new Map(JSON.parse(mapStr));

    const serialized = mapToJson(map); ①

    // prints ''[[{"name":"some object"},"value against an object key"]]''

    console.log(serialized);

    const deserialized = jsonToMap(serialized); ②

    // prints ''Map { { name: ''some object'' } => ''value against an object key''
    }''

    console.log(deserialized);

    console.assert(deserialized.get(obj) === undefined); ③

    ```


    The only way to get back a reference to a key that itself happens to be an object
    reference after deserializing from JSON is to iterate over the keys of the map
    and grab a reference to it. Which completely defeats the purpose of a key lookup!


    So, is there a real use-case for maps? Absolutely. As long as we do not intend
    to serialize the map, they are useful. They give the flexibility that otherwise
    is not permitted in plain old JavaScript objects (`POJOs`). Of course, if you
    *do* plan on serializing, then it best be that all the keys are themselves serializable
    (in other words, strings) so that we can “refind” them. If that is not a viable
    option, then you are better off just using `POJOs`.'
  raw: 'Interestingly maps retain the insertion order of their entries, specifically
    the order in which the **keys** were added. However, if there happens to be a
    collision, then the new value overrides the previous value *at the location where
    the key exists*. That is, they act very much like arrays except their “indexes”
    happen to be of any type.


    Since maps maintain order, they allow us to iterate over their `entries` with
    methods like `forEach`, as well as the `entries` API which returns one key-value
    pair at a time, wrapped in an array of `length` 2 represented as `[key, value]`.
    Maps also expose a `keys` and a `values` API, which, as their names suggest, return
    an array of the keys and values in the map, in insertion order.


    Maps, like arrays abide by the “iterator” contract, which as we have discussed
    earlier, allows maps to be spreadable using the `…` operator, and consequently
    be destructured. Maps as we have seen can be created using an array of arrays;
    conversely spreading a map, as one might deduce, explodes a map into an array
    of arrays, with each array being a tuple of key and value, and the encompassing
    array reflecting the order of insertion, and its `length` being the `size` of
    the map.


    *   ① Create a map


    *   ② Explode a map into an array


    *   ③ Destruct for the second and third entries


    ```

    const firstQuarter = new Map([

    [1, ''Jan''],

    [2, ''Feb''],

    [3, ''Mar''],

    [4, ''Apr''],

    ]); ①

    const mapToStr = [...firstQuarter].join('':''); ②

    console.assert(mapToStr === ''1,Jan:2,Feb:3,Mar:4,Apr'');

    const [

    ,

    [n2, m2],

    [n3, m3],

    ] = firstQuarter; ③

    console.assert(n2 === 2);

    console.assert(m2 === ''Feb'');

    console.assert(n3 === 3);

    console.assert(m3 === ''Mar'');

    ```


