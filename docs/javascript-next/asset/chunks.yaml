  trans: '

    ## 符号（Symbol）与 Switch-case 语句


    我们可以考虑另一种使用场景，其中使用唯一值（符号）有助于减少潜在的代码错误。我们经常使用字符串来标识“唯一性”，而 switch-case 等语言结构则利用这一点来辅助程序流程。请看以下示例：


    - ① 定义辅助常量

    - ② 对字符串属性执行 switch case 判断

    - ③ 引入一个误导性常量

    - ④ 将该误导性常量用作新对象中的日志级别

    - ⑤ 输出结果与预期不符


    ```

    const LOG_LEVEL = Symbol(''log'');

    const DEBUG = ''DEBUG''; ①

    const INFO = ''INFO'';

    const ERROR = ''ERROR'';

    const simpleLogger = (obj, msg) => {

    let returnMsg;

    switch (obj[LOG_LEVEL]) { ②

    case DEBUG:

    returnMsg = `DEBUG: ${msg}`;

    break;

    case INFO:

    returnMsg = `INFO: ${msg}`;

    break;

    case ERROR:

    returnMsg = `ERROR: ${msg}`;

    break;

    default:

    throw new Error(''Invalid LOG_LEVEL'');

    }

    console.log(returnMsg);

    return returnMsg;

    };

    const MY_LEVEL = ''ERROR''; ③

    const loggableObj = {

    log: ''this is just an ordinary property'',

    [LOG_LEVEL]: MY_LEVEL, ④

    };

    // 输出 ''ERROR: this is a test''

    simpleLogger(loggableObj, ''this is a test''); ⑤

    ```


    只有敏锐的读者才能意识到这里发生了什么。我们引入了一个误导性常量，即值为 `"ERROR"` 的 `MY_LEVEL`，并将其作为 `LOG_LEVEL`
    赋值给一个对象。这样做之所以有效，是因为在 `simpleLogger` 函数内部，switch-case 语句判断的是*相等性*，由于传入的 `LOG_LEVEL`
    恰好是我们已知的一个值，因此匹配到了 `ERROR` 分支。然而，我们没有抛出错误，反而成功记录了一条错误信息。这里的问题在于，虽然字符串*确实是*值，但两个独立构造的字符串如果碰巧拥有相同大小写的字符集，它们就可以是相等的！


    理想情况下，我们希望能够创建真正唯一的、可供我们进行切换判断的值。实际上，JavaScript 中的 `switch` 语句仅仅是使用 `===` 相等运算符来查找匹配的
    `case` 分支！再次，符号（Symbol）前来救场。


    - ① 将辅助常量定义为符号而非字符串

    - ② 注意 switch case 语句**没有**变化

    - ③ 其工作方式与使用字符串时完全相同


    ```

    const LOG_LEVEL = Symbol(''log'');

    const DEBUG = Symbol(''DEBUG''); ①

    const INFO = Symbol(''INFO'');

    const ERROR = Symbol(''ERROR'');

    const simpleLogger = (obj, msg) => {

    let returnMsg;

    switch (obj[LOG_LEVEL]) { ②

    case DEBUG:

    returnMsg = `DEBUG: ${msg}`;

    break;

    case INFO:

    returnMsg = `INFO: ${msg}`;

    break;

    case ERROR:

    returnMsg = `ERROR: ${msg}`;

    break;

    default:

    throw new Error(''Invalid LOG_LEVEL'');

    }

    console.log(returnMsg);

    return returnMsg;

    };

    const loggableObj = {

    log: ''this is just an ordinary property'',

    [LOG_LEVEL]: ERROR,

    };

    // 输出 ''ERROR: this is a test''

    simpleLogger(loggableObj, ''this is a test''); ③

    ```


    回想一下，符号是唯一的，每次调用初始化函数 `Symbol` 都会创建一个新的、唯一的符号对象，它不等于任何其他符号（即使是那些拥有相同描述字符串的符号）。在我们最新的迭代中，我们使用符号作为键来唯一标识
    `LOG_LEVEL`，同时也用作其值，现在我们就能保证其唯一性了。


    ## 全局注册表


    关于 `Symbol`，还有另一个方面我们需要讨论，那就是全局符号注册表。我们可以将符号注册表视为一个符号池——你可以在池中创建并放入一个符号，并在之后检索它。


    要从池中创建或获取一个符号，我们使用 `Symbol.for`。`Symbol.for` 需要提供一个“键”，如果注册表中**不**存在具有该键的符号，则会创建一个新符号。否则，将从注册表中检索具有相同键的符号，具体如下：


    - ① 使用 `for` 定义一个符号——在这种情况下，会创建一个新符号

    - ② 使用相同的“键”查找一个符号——这只是一个“获取”操作

    - ③ 它们是相等的


    ```

    const global = Symbol.for(''globally visible''); ①

    const otherGlobal = Symbol.for(''globally visible''); ②

    // 输出 ''true''

    console.log(global === otherGlobal); ③

    ```


    事实证明，对于全局注册表中的符号，*正是*这个键来标识符号——如果两个引用都使用相同的键通过 `for` 查找符号，它们将指向同一个符号。


    我们也可以反向操作——给定一个符号，我们可以使用 `Symbol` 上的 `keyFor` 方法获取其键。


    - ① 使用 `for` 定义一个符号——在这种情况下，会创建一个新符号

    - ② 查找特定符号的键


    ```

    const global = Symbol.for(''a unique key''); ①

    const key = Symbol.keyFor(global); ②

    // 输出 ''true''

    console.log(key === ''a unique key'');

    ```


    你可能会问——这有什么意义？如果我们想要跨“领域”共享符号（符号是引用类型，不同于字符串、数字和布尔值这些原始类型），那么这个池就是必需的。^(⁵¹) 领域是一个全局上下文，例如存在于
    iframe 中的上下文。因此，在网页中运行的 JavaScript 代码与在嵌入的 iframe 中运行的代码，或在 Service Worker 中运行的代码，处于不同的领域。如果我们想要将符号用作跨领域的全局标识符或属性名，那么全局符号注册表就是你的得力助手。


    当然，要标识全局注册表中的符号，我们需要一个键。总有可能出现两段不同的代码（甚至运行在不同领域中的代码）使用相同的键（出于不同目的）来创建符号。因此，如果我们打算使用全局注册表，就有必要适当地对这些标识符进行“命名空间”化处理。

