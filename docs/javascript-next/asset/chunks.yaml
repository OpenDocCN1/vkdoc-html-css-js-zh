  trans: '

    ### 其他优势


    采用标准的可迭代方法，使得 JavaScript 能够在 API 之上构建额外的结构，同时允许其他库设计自己的对象以利用相同的机制。在第 4 章中，我们讨论了`spread`运算符，并了解到任何可迭代的对象也都是可展开的。重申一下，ES6
    中引入的扩展运算符与`for-of`循环使用了完全相同的机制。


    此外，展望未来，任何对象——包括我们可能在应用程序中引入的对象、诸如`Immutable.js`以及`NodeList`（由`document.querySelectorAll`返回的集合）等库所提供的集合——都可以安全且正确地被循环遍历和“展开”！^(⁵⁷)


    最后，这一点较为微妙，我们引入了一种实现代码惰性求值的机制！可迭代对象为消费者返回一个迭代器，并静待迭代器的`next`方法被调用。当`next`方法被调用时（如果有必要），对象可以计算序列中的下一个项并将其返回。更进一步，我们的可迭代对象也可以是无限的（当然，在溢出的范围内）。


    在本节中，我们讨论了可迭代对象和迭代协议。接下来，我们将探讨“可暂停”函数及其一些用例。


    ## 生成器


    生成器函数是 ES6 中的新增功能，引入了新的语法和关键字，以及函数的新的语义。让我们先看一个简单的示例，然后继续了解其工作原理：


    *定义简单的生成器*


    ```

    function* generatorDemo() {

    yield 10;

    console.log(''第一次'');

    yield 20;

    console.log(''第二次'');

    }

    const generator = generatorDemo(); // 控制台无输出

    console.assert(generator !== undefined);

    // 每行对应控制台输出

    console.log(generator.next());

    // { value: 10, done: false }

    console.log(generator.next());

    // 第一次

    // { value: 20, done: false }

    console.log(generator.next());

    // 第二次

    // { value: undefined, done: true }

    // 或者，我们可以直接使用 for-of 循环

    for (const i of generatorDemo()) {

    console.log(i);

    }

    ```


    让我们聚焦于这里的语法层面——我们接触到了新的`function*`（注意：*并非*笔误），以及一个新的`yield`关键字。


    当我们调用生成器函数时，看到两件有趣的事情发生：控制台中没有输出（如果是普通函数，我们预期会看到`console.log`语句打印出消息），并且我们从返回值中*得到了一些东西*！


    你看，当生成器函数被调用时，会立即返回一个生成器对象，**而不会**执行其函数体。此外，如果我们观察示例中的后续代码行，会发现返回的对象上有一个`next`方法，而该方法又返回一个包含`value`和`done`键的对象。换句话说，生成器对象是可迭代的！


    `yield`的作用是什么？如果我们仔细查看示例代码的输出，会发现每次在迭代器上调用`next`时，生成器函数体仅执行到遇到第一个`yield`语句为止，此时，“yield”出的任何值都会返回给调用代码（包装在迭代器结果对象中）。实际上，`yield`语句*暂停*了生成器函数的执行，将控制权返回给调用上下文。


    一个恰当的类比是（两位玩家之间的）乒乓球或网球。一旦我们开始比赛（即我们手中有了生成器对象），调用`next`会将控制权发送到生成器函数的“球场”。当遇到`yield`时，生成器会通过一个值将控制权返回给调用者。作为“消费者”，我们可以选择不再调用`next`来停止比赛，此时生成器函数（如果尚未“完成”，则保持暂停状态）；如果生成器到达其函数体定义的末尾，比赛将结束（此时返回的值为`{done:
    true}`）。


    本质上，生成器函数是一个返回可迭代对象的函数，而该可迭代对象又实现了迭代器协议。生成器函数会暂停（使用`yield`），并在调用者调用`next`时恢复执行。


    让我们将之前的斐波那契数列示例转换为使用生成器函数：


    ```

    function* fibonacci() {

    let start = 0;

    let next = 1;

    yield start;

    yield next;

    while (true) {

    const result = start + next;

    start = next;

    next = result;

    yield result;

    }

    }

    const f = fibonacci();

    console.log(f.next().value); // 0

    console.log(f.next().value); // 1

    console.log(f.next().value); // 1

    console.log(f.next().value); // 2

    console.log(f.next().value); // 3

    console.log(f.next().value); // 5

    console.log(f.next().value); // 8

    ```


    这个实现与我们之前使用`Symbol.iterator`的实现差别不大，只是我们不再需要实现那个方法——生成器函数为我们完成了所有工作。


    ### 作为消费者的生成器


    到目前为止，我们对生成器的探索一直将其视为数据的“生产者”——它们在每次迭代中产生值。尽管名称如此，生成器也可以充当“消费者”，即我们可以将值“推入”其中，也许作为种子，或作为一种向它们发送数据以供其使用的方式。


    让我们修改简单的示例，看看这种机制如何运作：


    *   ① 通过`next`启动迭代


    *   ② 将一个值作为参数推入`next`方法，从而设置`first`的值


    *   ③ 再次执行相同操作，不过这次设置`second`的值


    ```

    function* generatorWithPushDemo() {

    const first = yield 10;

    console.log(''第一次'', first);

    const second = yield 20;

    console.log(''第二次'', second);

    }

    const generator = generatorWithPushDemo(); // 控制台无输出

    console.assert(generator !== undefined);

    // 每行对应控制台输出

    console.log(generator.next()); ①

    // { value: 10, done: false }

    console.log(generator.next(''传入一个值'')); ②

    // 第一次 传入一个值

    // { value: 20, done: false }

    console.log(generator.next(''传入另一个值'')); ③

    // 第二次 传入另一个值

    // { value: undefined, done: true }

    ```


    我们从获取生成器对象的引用开始，然后调用`next`。控制权转入生成器，它`yield`出一个值返回给我们。此时，生成器处于暂停状态。


    有趣的地方来了——我们再次调用`next`，不过这次提供了一个参数。这个值会被*赋值*给`first`变量，生成器现在可以在其实现中使用这个值。一种理解方式是：我们传入生成器的任何值实际上都会替换生成器中的`yield`。当然，如果生成器内部没有捕获`yield`语句，则向生成器传入值的结果是空操作——传入的值会被简单忽略。


    '
- fmt: "### Cleaning Up\n\nCustom iterators can implement a `return` method that can\
    \ be used to clean up if the consumer terminates the iteration prematurely (using\
    \ `break`, `throw`, or `return`). It turns out that the generator object returned\
    \ by generator functions can do the same.\n\nBut wait, you say, we don’t implement\
    \ the `next` method! If the caller were to invoke `return`, how are we, the generator\
    \ function authors, supposed to clean up?\n\nWell, it turns out, JavaScript already\
    \ has a cleanup mechanism—it’s the `try-catch-finally` block! Here is how it works—if\
    \ our generator implementation were to have a `try` block, and the caller were\
    \ to invoke `return` on the resultant generator, JavaScript will execute the `finally`\
    \ block within the generator function for us:\n\n- ① Wrap the body of the generator\
    \ in a `try` block\n- ② Invoke the `return` method on the generator\n- ③ Use the\
    \ native `for-of` loop to drive the generator to completion\n- ④ Use the `throw`\
    \ method to cause the generator to error out and stop\n\n```\nfunction* generatorFunctionWithTryCatchFinally()\
    \ {\n  try { ①\n    console.log('Started');\n    yield 'some value';\n  } catch\
    \ (error) {\n    console.log('Caught: ' + error);\n  } finally {\n    console.log('Finally\
    \ block');\n  }\n}\n\nconst callee = generatorFunctionWithTryCatchFinally();\n\
    console.log(callee.next());\n// Started\n// { value: 'some value', done: false\
    \ }\n\nconsole.log(callee.return()); ②\n// Finally block\n// { value: undefined,\
    \ done: true }\n\nconsole.log('----------');\n\nfor (const looped of generatorFunctionWithTryCatchFinally())\
    \ { ③\n  console.log(looped);\n  // Started\n  // some value\n  // Finally block\n\
    }\n\nconsole.log('----------');\n\nconst c = generatorFunctionWithTryCatchFinally();\n\
    console.log(c.next());\n// Started\n// { value: 'some value', done: false }\n\n\
    console.log(c.throw(new Error('Stop now!'))); ④\n// Caught: Error: Stop now!\n\
    // Finally block\n// { value: undefined, done: true }\n```\n\nWe write a simple\
    \ generator that has its body wrapped in a `try-catch-finally` block. We grab\
    \ a reference to the generator object, and invoke `return` on it. The example\
    \ enumerates the output we see in the console, and we see that the `finally` block\
    \ is executed for us at this time.\n\nOur next attempt uses the `for-of` loop\
    \ to get a reference to the generator and drive it to completion. Again, if we\
    \ are to observe the output, we see that the `finally` block of the generator\
    \ function is invoked at the end. In other words, the `for-of` loop automatically\
    \ invokes the `return` method of the generator, just like we saw in the case of\
    \ custom iterators.\n\nFinally, there happens to be yet another method that generator\
    \ objects implement, namely `throw`. Going back to the table-tennis analogy, rather\
    \ than sending the ball (a value) into the generator, we are throwing an error\
    \ at it. Much like sending a value (using `next(someValue)`) replaces the `yield`\
    \ statement *inside* the generator, `throw`-ing an error causes the generator\
    \ to throw that error at the place where it was suspended. If there were no `try-catch`\
    \ block around that line, then the generator function would simply report the\
    \ error at that line. In our example, however, we *do* have a `try-catch`, and\
    \ appropriately, the `catch` block is executed, followed by the `finally` block.\n\
    \nAs we can see in this example, generator functions, and the resulting generator\
    \ objects give us the same capabilities as iterators do, maintaining the symmetry\
    \ between custom iterators and automatically produced ones. The only exception\
    \ here is that generator objects also implement the `throw` method, which does\
    \ not apply to other iterables.\n\n### Other Benefits\n\nGenerators allow us to\
    \ write lazily evaluated code, as well as have the ability to produce infinite\
    \ sequences, both of which we see embodied in our Fibonacci sequence generator.\
    \ Leaving aside all the machinery of generators, we must always remember that\
    \ they produce iterators. Many functions that we write tend to return sequences,\
    \ like arrays, except we are forced to populate the array upfront, regardless\
    \ of what the client might need to do with it. Generators give us a mechanism\
    \ for clients to proactively ask for items, thus potentially optimizing how much\
    \ work needs to be done.\n\nWe must always bear in mind that generator functions,\
    \ with the idea of suspending and resuming, are a great fit for any situation\
    \ where we see transfer of control from one context to another, and back. One\
    \ obvious candidate is asynchronous operations, where control goes back and forth\
    \ from the main execution context, to a callback, and back.\n\n### Additional\
    \ Syntactic Considerations\n\nConsider a scenario in which one generator function\
    \ (we will call this “outer”) invokes another generator function (called “inner”)\
    \ as part of its implementation. Given that our intent is to consume all the `yield`-ed\
    \ values of both the outer and the inner generator functions, we need an additional\
    \ mechanism to suspend the outer generator, loop over all of the inner generator’s\
    \ yielded values, and then return control back to the outer generator thereby\
    \ resuming it. This is where a new keyword, namely `yield*`, comes into play.\
    \ Consider the following:\n\n- ① Our so-called inner generator function\n- ② Our\
    \ main or “outer” generator function\n- ③ Using the `yield*` expression to invoke\
    \ the inner generator and drive it to completion\n\n```\nfunction* inner() { ①\n\
    \  yield 'b';\n  yield 'c';\n  yield 'd';\n}\n\nfunction* outer() { ②\n  yield\
    \ 'a';\n  console.log('after the first outer yield');\n  yield* inner(); ③\n \
    \ console.log('after finishing the inner yield*');\n  yield 'e';\n}\n\nfor (const\
    \ v of outer()) {\n  console.log(v);\n}\n// a\n// after the first outer yield\n\
    // b\n// c\n// d\n// after finishing the inner yield*\n// e\n```\n\nWe start with\
    \ two generator functions, except that the outer one delegates to the inner one\
    \ using `yield*`. We see from the output that the outer generator first yields\
    \ a value, then upon a `next` (via the `for-loop`), hands control over to the\
    \ inner generator, and when (if) it is done, resumes the outer generator.\n\n\
    A subtle aspect about `yield*` is that it is given the *result* of invoking the\
    \ inner generator (via `inner()`) and **not** a reference to it (i.e., `inner`).\
    \ In other words, it is given a generator object over which it can loop. It turns\
    \ out that `yield*` can be given *any* iterable—a generator object, an array,\
    \ map, set, string, or even a custom iterable that we handcrafted. Bear in mind\
    \ though that while **all** of these implement the `next` and `return` method,\
    \ only generator objects implement the `throw` method.\n\n### Summary\n\nIn this\
    \ chapter, we saw how JavaScript now offers a standard mechanism for iteration,\
    \ making it possible for consumers and producers of sequences to adhere to a canonical\
    \ API for iteration. We also saw how generator functions and objects allow us\
    \ to write lazy code, and generate infinite sequences. While it may seem that\
    \ the machinery surrounding generators is complex, it will serve to remember the\
    \ symmetry that iterables and generators offer—they happen to be two sides of\
    \ the same coin.\n\nIn the next chapter, we will explore the new promise API,\
    \ which, thanks to ES6, is supported natively in JavaScript. We will see how we\
    \ can wrap legacy callback-based APIs using promises, allowing us to embrace promises\
    \ everywhere.\n\nFootnotes [1](#481812_1_En_9_Chapter.xhtml#Fn1_source) [2](#481812_1_En_9_Chapter.xhtml#Fn2_source)\
    \ [3](#481812_1_En_9_Chapter.xhtml#Fn3_source)"
  raw: '### Cleaning Up


    Custom iterators can implement a `return` method that can be used to clean up
    if the consumer terminates the iteration prematurely (using `break`, `throw,`
    or `return`). It turns out that the generator object returned by generator functions
    can do the same.


    But wait, you say, we don’t implement the `next` method! If the caller were to
    invoke `return`, how are we, the generator function authors, supposed to clean
    up?


    Well, it turns out, JavaScript already has a cleanup mechanism—it’s the `try-catch-finally`
    block! Here is how it works—if our generator implementation were to have a try
    block, and the caller were to invoke `return` on the resultant generator, JavaScript
    will execute the `finally` block within the generator function for us:


    *   ① Wrap the body of the generator in a `try` block


    *   ② Invoke the `return` method on the generator


    *   ③ Use the native `for-of` loop to drive the generator to completion


    *   ④ Use the `throw` method to case the generator to error out and stop


    ```

    function* generatorFunctionWithTryCatchFinally() {

    try { ①

    console.log(''Started'');

    yield ''some value'';

    } catch (error) {

    console.log(''Caught: '' + error);

    } finally {

    console.log(''Finally block'');

    }

    }

    const callee = generatorFunctionWithTryCatchFinally();

    console.log(callee.next());

    // Started

    // { value: ''some value'', done: false }

    console.log(callee.return()); ②

    // Finally block

    // { value: undefined, done: true }

    console.log(''----------'');

    for (const looped of generatorFunctionWithTryCatchFinally()) { ③

    console.log(looped);

    // Started

    // some value

    // Finally block

    }

    console.log(''----------'');

    const c = generatorFunctionWithTryCatchFinally();

    console.log(c.next());

    // Started

    // { value: ''some value'', done: false }

    console.log(c.throw(new Error(''Stop now!''))); ④

    // Caught: Error: Stop now!

    // Finally block

    // { value: undefined, done: true }

    ```


    We write a simple generator that has its body wrapped in a `try-catch-finally`
    block. We grab a reference to the generator object, and invoke `return` on it.
    The example enumerates the output we see in the console, and we see that the `finally`
    block is executed for us at this time.


    Our next attempt uses the `for-of` loop to get a reference to the generator and
    drive it to completion. Again, if we are to observe the output, we see that the
    `finally` block of the generator function is invoked at the end. In other words,
    the `for-of` loop automatically invokes the `return` method of the generator,
    just like we saw in the case of custom iterators.


    Finally, there happens to be yet another method that generator objects implement,
    namely `throw`. Going back to the table-tennis analogy, rather than sending the
    ball (a value) into the generator, we are throwing at error at it. Much like sending
    a value (using `next(someValue)`) replaces the yield statement *inside* the generator,
    `throw`-ing an error causes the generator to throw that error at the place where
    it was suspended. If there were no try-catch block around that line, then the
    generator function would simply report the error at that line. In our example,
    however, we *do* have a try-catch, and appropriately, the `catch` block is executed,
    followed by the `finally` block.


    As we can see in this example, generator functions, and the resulting generator
    objects give us the same capabilities as iterators do, maintaining the symmetry
    between custom iterators and automatically produced ones. The only exception here
    is that generator objects also implement the `throw` method, which does not apply
    to other iterables.


    ### Other Benefits


    Generators allow us to write lazily evaluated code, as well as have the ability
    to produce infinite sequences, both of which we see embodied in our Fibonacci
    sequence generator. Leaving aside all the machinery of generators, we must always
    remember that they produce iterators. Many functions that we write tend to return
    sequences, like arrays, except we are forced to populate the array upfront, regardless
    of what the client might need to do with it. Generators give us a mechanism for
    clients to proactively ask for items, thus potentially optimizing how much work
    needs done.


    We must always bear in mind that generator functions, with the idea of suspending
    and resuming, are a great fit for any situation where we see transfer of control
    from one context to another, and back. One obvious candidate is asynchronous operations,
    where control goes back and forth from the main execution context, to a callback,
    and back.


    ### Additional Syntactic Considerations


    Consider a scenario in which one generator function (we will call this “outer”)
    invokes another generator function (called “inner”) as part of its implementation.
    Given that our intent is to consume all the `yield`-ed values of both the outer
    and the inner generator functions, we need an additional mechanism to suspend
    the outer generator, loop over all of the inner generator’s yielded values, and
    then return control back to the outer generator thereby resuming it. This is where
    a new keyword, namely `yield*,` comes into play. Consider the following:


    *   ① Our so-called inner generator function


    *   ② Our main or “outer” generator function


    *   ③ Using the `yield*` expression to invoke the inner generator and drive it
    to completion


    ```

    function* inner() { ①

    yield ''b'';

    yield ''c'';

    yield ''d'';

    }

    function* outer() { ②

    yield ''a'';

    console.log(''after the first outer yield'');

    yield* inner(); ③

    console.log(''after finishing the inner yield*'');

    yield ''e'';

    }

    for (const v of outer()) {

    console.log(v);

    }

    // a

    // after the first outer yield

    // b

    // c

    // d

    // after finishing the inner yield*

    // e

    ```


    We start with two generator functions, except that the outer one delegates to
    the inner one using `yield*`. We see from the output that the outer generator
    first yields a value, then upon a `next` (via the `for-loop`), hands control over
    to the inner generator, and when (if) it is done, resumes the outer generator.


    A subtle aspect about `yield*` is that it is given the *result* of invoking the
    inner generator (via `inner()`) and **not** a reference to it (i.e., `inner`).
    In other words, it is given a generator object over which it can loop. It turns
    out that `yield*` can be given *any* iterable—a generator object, an array, map,
    set, string, or even a custom iterable that we handcrafted. Bear in mind though
    that while **all** of these implement the `next` and `return` method, only generator
    objects implement the `throw` method.


    ## Summary


    In this chapter, we saw how JavaScript now offers a standard mechanism for iteration,
    making it possible for consumers and producers of sequences to adhere to a canonical
    API for iteration. We also saw how generator functions and objects allow us to
    write lazy code, and generate infinite sequences. While it may seem that the machinery
    surrounding generators is complex, it will serve to remember the symmetry that
    iterables and generators offer—they happen to be two sides of the same coin.


    In the next chapter, we will explore the new promise API, which, thanks to ES6,
    is supported natively in JavaScript. We will see how we can wrap legacy callback-based
    APIs using promises, allowing us to embrace promises everywhere.


    Footnotes [1](#481812_1_En_9_Chapter.xhtml#Fn1_source)   [2](#481812_1_En_9_Chapter.xhtml#Fn2_source)
      [3](#481812_1_En_9_Chapter.xhtml#Fn3_source)'
  trans: "\n### 清理操作\n\n自定义迭代器可以实现一个 `return` 方法，该方法可用于在消费者提前终止迭代（使用 `break`、`throw`\
    \ 或 `return`）时进行清理。事实证明，生成器函数返回的生成器对象也能做到这一点。\n\n但是，等等，你可能会说，我们并没有实现 `next` 方法！如果调用者调用了\
    \ `return`，我们这些生成器函数的作者该如何进行清理呢？\n\n实际上，JavaScript 已经提供了一种清理机制——那就是 `try-catch-finally`\
    \ 块！其工作原理如下：如果我们的生成器实现包含一个 `try` 块，并且调用者在生成的生成器上调用了 `return`，那么 JavaScript 会为我们执行生成器函数内的\
    \ `finally` 块：\n\n- ① 将生成器的主体包裹在一个 `try` 块内\n- ② 在生成器上调用 `return` 方法\n- ③ 使用原生的\
    \ `for-of` 循环驱动生成器直至完成\n- ④ 使用 `throw` 方法使生成器报错并停止\n\n```\nfunction* generatorFunctionWithTryCatchFinally()\
    \ {\n  try { ①\n    console.log('Started');\n    yield 'some value';\n  } catch\
    \ (error) {\n    console.log('Caught: ' + error);\n  } finally {\n    console.log('Finally\
    \ block');\n  }\n}\n\nconst callee = generatorFunctionWithTryCatchFinally();\n\
    console.log(callee.next());\n// Started\n// { value: 'some value', done: false\
    \ }\n\nconsole.log(callee.return()); ②\n// Finally block\n// { value: undefined,\
    \ done: true }\n\nconsole.log('----------');\n\nfor (const looped of generatorFunctionWithTryCatchFinally())\
    \ { ③\n  console.log(looped);\n  // Started\n  // some value\n  // Finally block\n\
    }\n\nconsole.log('----------');\n\nconst c = generatorFunctionWithTryCatchFinally();\n\
    console.log(c.next());\n// Started\n// { value: 'some value', done: false }\n\n\
    console.log(c.throw(new Error('Stop now!'))); ④\n// Caught: Error: Stop now!\n\
    // Finally block\n// { value: undefined, done: true }\n```\n\n我们编写了一个简单的生成器，其主体包裹在\
    \ `try-catch-finally` 块中。我们获取生成器对象的引用，并对其调用 `return`。该示例列举了我们在控制台中看到的输出，我们看到此时\
    \ `finally` 块为我们执行了。\n\n接下来，我们使用 `for-of` 循环来获取生成器的引用并驱动其完成。同样，如果我们观察输出，会发现在最后调用了生成器函数的\
    \ `finally` 块。换句话说，`for-of` 循环会自动调用生成器的 `return` 方法，就像我们在自定义迭代器中看到的那样。\n\n最后，生成器对象还实现了另一种方法，即\
    \ `throw`。回到乒乓球的比喻，不是将球（一个值）发送到生成器中，而是向它抛出一个错误。类似于发送一个值（使用 `next(someValue)`）会替换生成器*内部*的\
    \ `yield` 语句，`throw` 一个错误会导致生成器在其暂停的位置抛出该错误。如果该行周围没有 `try-catch` 块，那么生成器函数就会简单地在该行报告错误。然而，在我们的示例中，我们*确实*有一个\
    \ `try-catch`，因此，`catch` 块会被适当地执行，随后是 `finally` 块。\n\n正如我们在本例中所看到的，生成器函数以及由此产生的生成器对象，为我们提供了与迭代器相同的能力，保持了自定义迭代器和自动生成的迭代器之间的对称性。唯一的例外是生成器对象还实现了\
    \ `throw` 方法，而其他可迭代对象则没有。\n\n### 其他优点\n\n生成器允许我们编写惰性求值的代码，并且能够生成无限序列，这两点都在我们的斐波那契数列生成器中得到了体现。撇开生成器的所有机制不谈，我们必须始终记住，它们产生的是迭代器。我们编写的许多函数倾向于返回序列（如数组），但通常我们必须预先填充数组，无论客户端需要用它做什么。生成器为客户主动请求元素提供了一种机制，从而潜在地优化了需要完成的工作量。\n\
    \n我们必须始终牢记，生成器函数具有挂起和恢复的概念，非常适用于任何涉及控制权从一个上下文转移到另一个上下文再返回的场景。一个明显的候选是异步操作，其中控制权在主执行上下文和回调之间来回切换。\n\
    \n### 额外的语法考量\n\n考虑这样一种场景：一个生成器函数（我们称之为“外部”生成器）在其实现中调用另一个生成器函数（称为“内部”生成器）。鉴于我们的意图是消费外部和内部生成器函数所有\
    \ `yield` 产生的值，我们需要一种额外的机制来挂起外部生成器，遍历内部生成器产生的所有值，然后将控制权返回给外部生成器，从而恢复它。这就是新关键字\
    \ `yield*` 发挥作用的地方。考虑以下情况：\n\n- ① 我们所谓的内部生成器函数\n- ② 我们的主生成器或“外部”生成器函数\n- ③ 使用\
    \ `yield*` 表达式来调用内部生成器并驱动其完成\n\n```\nfunction* inner() { ①\n  yield 'b';\n  yield\
    \ 'c';\n  yield 'd';\n}\n\nfunction* outer() { ②\n  yield 'a';\n  console.log('after\
    \ the first outer yield');\n  yield* inner(); ③\n  console.log('after finishing\
    \ the inner yield*');\n  yield 'e';\n}\n\nfor (const v of outer()) {\n  console.log(v);\n\
    }\n// a\n// after the first outer yield\n// b\n// c\n// d\n// after finishing\
    \ the inner yield*\n// e\n```\n\n我们从两个生成器函数开始，外部生成器使用 `yield*` 将工作委托给内部生成器。从输出中我们看到，外部生成器首先产生一个值，然后在一次\
    \ `next` 调用（通过 `for 循环`）时，将控制权移交给内部生成器，并在其完成时（如果完成的话）恢复外部生成器。\n\n关于 `yield*` 的一个微妙之处在于，它接收的是调用内部生成器（通过\
    \ `inner()`）所得到的*结果*，**而不是**对该生成器的引用（即 `inner`）。换句话说，它接收到的是一个可以对其进行循环的生成器对象。事实证明，`yield*`\
    \ 可以接收*任何*可迭代对象——生成器对象、数组、映射、集合、字符串，甚至是我们手工制作的自定义可迭代对象。不过请记住，虽然*所有*这些可迭代对象都实现了\
    \ `next` 和 `return` 方法，但只有生成器对象实现了 `throw` 方法。\n\n### 总结\n\n在本章中，我们了解了 JavaScript\
    \ 现在如何提供一种标准的迭代机制，使得序列的生产者和消费者能够遵循一套规范的 API 进行迭代。我们还了解了生成器函数和对象如何允许我们编写惰性代码以及生成无限序列。虽然生成器的相关机制看起来可能很复杂，但记住可迭代对象和生成器所提供的对称性会有所帮助——它们恰好是一枚硬币的两面。\n\
    \n在下一章中，我们将探索新的 Promise API，得益于 ES6，该 API 在 JavaScript 中是原生支持的。我们将看到如何使用 Promise\
    \ 来包裹基于回调的遗留 API，从而让我们能够在任何地方使用 Promise。\n\n脚注 1 2 3\n"
- fmt: '# 10. Avoiding Callbacks with Promises


    Working with asynchronous operations is tedious. For the longest time we resorted
    to using callbacks which proved hard to get right especially when it came to state
    management and error propagation. We then elevated the abstraction, leveraging
    promises. However, those too came with their own set of problems—with different
    libraries having varying implementations, leaving us frustrated and looking for
    a sane way to grapple with asynchronous operations.


    That changes now! JavaScript introduces promises in ES6 as a native API, elevating
    promises to be a first-class citizen in the language. In this chapter we will
    explore the API that promises offer, so that we can start using promises in our
    code, doing away with callbacks. We will also learn how we can wrap operations
    that intrinsically assume a callback, so that we can consistently use promises
    everywhere. Given what we will learn in this chapter, we will once and for all
    get rid of callbacks, while making our code easier to write and reason about.


    ## The Broken Promises of Promises


    JavaScript is, by design, a language that enforces an asynchronous programming
    paradigm. As JavaScript developers, we are well versed in the fact that our code
    runs in a single thread. Therefore, “blocking” operations—I/O, network requests,
    and even periodic invocations (using `setInterval`)—all need to be performed asynchronously.
    That is, they need to be performed in a way that does **not** block the main thread.


    Idiomatically, this is accomplished using callbacks. Asynchronous APIs expect
    one, or more “handler” functions as arguments, and these handlers are invoked
    with the result (or error) of the asynchronous call. The handler encompasses what
    to do if and when the asynchronous call finishes.


    Callbacks, while idiomatic, can prove to be hard to work with. Attempts at sequencing
    asynchronous calls (where the invocation of one relies on the response of a previous
    call) can lead to nested callbacks (affectionately referred to as the [pyramid
    of doom](https://en.wikipedia.org/wiki/Pyramid_of_doom_%28programming%29)^([^(58)](#fn58))).
    This nested code style leads to higher coupling, making it harder to test. Since
    the handler runs in a different “context” from the rest of your code, error reporting
    and propagation require careful handling and management.


    Callbacks enforce an eager programming style, in that, any asynchronous function
    that expects a callback as an argument forces the client to know exactly what
    needs done *before* the operation completes. Since the callback **has** to be
    defined prior to invoking the asynchronous operation, one cannot defer *how* we
    consume the result of the call to *after* having started, or finished the work.
    Conceptually, the (asynchronous) task to be performed is tied to the work that
    will be done after the task finishes.


    But most importantly, reading code involving callbacks involves some mental gymnastics,
    and makes it hard to reason about the code, even more so when the callbacks are
    nested within one another. Granted, we could refactor our callbacks to be standalone
    functions, and use those instead, but that seems akin to kicking the can down
    the road. There have been several strategies used when working with nested callbacks,
    many of which have been captured in web sites like [Callback Hell](http://callbackhell.com/).^([^(59)](#fn59))


    So came along promises. As the name suggests, a promise represents the result
    of some work that is to happen *eventually*. When using promises, asynchronous
    calls, rather than accepting a handler, immediately return a promise object (or
    are wrapped in one). This promise, which represents the result of a potential
    success/failure *in the future*, can then be passed around to other pieces of
    your application, elevating the notion of asynchronous work to being a first-class
    citizen just like any other object.


    This promise “token” exposes a `then` method, which expects another handler, and
    in turn returns a new promise that wraps the result of that handler in a promise.
    The handler supplied to `then` is the work that is to be done when the promise
    it is chained to completes. This allows us to *defer* what we wish to do with
    the result of an asynchronous operation till later, in effect, decoupling where
    we start the work, from where we consume the results.


    Considering the `then` API itself returns a promise permits us to “chain” promises,
    thus providing us with a mechanism to eloquently express sequencing—in effect,
    “Do this, when it is done, *then* do this.”


    Finally, a promise object exposes a mechanism to trap any errors, usually with
    a `catch` method, and this allows for trapping, and dealing with any errors that
    might occur, anywhere in the promise chain.


    Promises are a simple abstraction on top of callbacks—they simply provide a mechanism
    to wrap callbacks, alleviating the need for us developers to deal with state and
    error management.


    However, for so long, promises were implemented as a library. Popular stand-along
    implementations include Kris Kowal’s `q`^([^(60)](#fn60)) and libraries like jQuery
    shipped with their own internal implementations. Developers who wished to use
    promises were either forced to include (explicitly or implicitly) a third-party
    library since the language had no support for the same.


    This leads to the second point—while there exists a community-driven specification^([^(61)](#fn61))
    to dictate how JavaScript promises are to work, there was no guarantee that an
    implementation *actually* adhered to the specification, or how true (to the specification)
    the implementation was. In other words, there was no canonical API to work with
    promises that made clients agnostic of the implementation details.


    Add to that the fact that many libraries and frameworks chose to adhere to native
    language constructs (of which there is only one—the callback), thus creating a
    schism, where often code, in one application used both callbacks and promises,
    furthering the confusion.


    To address these issues, ES6 introduces the promise API to JavaScript. Let us
    dive into the details of this API next.'
  raw: '# 10. Avoiding Callbacks with Promises


    Working with asynchronous operations is tedious. For the longest time we resorted
    to using callbacks which proved hard to get right especially when it came to state
    management and error propagation. We then elevated the abstraction, leveraging
    promises. However, those too came with their own set of problems—with different
    libraries having varying implementations, leaving us frustrated and looking for
    a sane way to grapple with asynchronous operations.


    That changes now! JavaScript introduces promises in ES6 as a native API, elevating
    promises to be a first-class citizen in the language. In this chapter we will
    explore the API that promises offer, so that we can start using promises in our
    code, doing away with callbacks. We will also learn how we can wrap operations
    that intrinsically assume a callback, so that we can consistently use promises
    everywhere. Given what we will learn in this chapter, we will once and for all
    get rid of callbacks, while making our code easier to write and reason about.


    ## The Broken Promises of Promises


    JavaScript is, by design, a language that enforces an asynchronous programming
    paradigm. As JavaScript developers, we are well versed in the fact that our code
    runs in a single thread. Therefore, “blocking” operations—I/O, network requests,
    and even periodic invocations (using `setInterval`)—all need to be performed asynchronously.
    That is, they need to be performed in a way that does **not** block the main thread.


    Idiomatically, this is accomplished using callbacks. Asynchronous APIs expect
    one, or more “handler” functions as arguments, and these handlers are invoked
    with the result (or error) of the asynchronous call. The handler encompasses what
    to do if and when the asynchronous call finishes.


    Callbacks , while idiomatic, can prove to be hard to work with. Attempts at sequencing
    asynchronous calls (where the invocation of one relies on the response of a previous
    call) can lead to nested callbacks (affectionately referred to as the [pyramid
    of doom](https://en.wikipedia.org/wiki/Pyramid_of_doom_%2528programming%2529)^([^(58)](#fn58))).
    This nested code style leads to higher coupling, making it harder to test. Since
    the handler runs in a different “context” from the rest of your code, error reporting
    and propagation require careful handling and management.


    Callbacks enforce an eager programming style, in that, any asynchronous function
    that expects a callback as an argument forces the client to know exactly what
    needs done *before* the operation completes. Since the callback **has** to be
    defined prior to invoking the asynchronous operation, one cannot defer *how* we
    consume the result of the call to *after* having started, or finished the work.
    Conceptually, the (asynchronous) task to be performed is tied to the work that
    will be done after the task finishes.


    But most importantly, reading code involving callbacks involves some mental gymnastics,
    and makes it hard to reason about the code, even more so when the callbacks are
    nested within one another. Granted, we could refactor our callbacks to be standalone
    functions, and use those instead, but that seems akin to kicking the can down
    the road. There have been several strategies used when working with nested callbacks,
    many of which have been captured in web sites like [Callback Hell](http://callbackhell.com/).^([^(59)](#fn59))


    So came along promises. As the name suggests, a promise represents the result
    of some work that is to happen *eventually*. When using promises, asynchronous
    calls, rather than accepting a handler, immediately return a promise object (or
    are wrapped in one). This promise, which represents the result of a potential
    success/failure *in the future*, can then be passed around to other pieces of
    your application, elevating the notion of asynchronous work to being a first-class
    citizen just like any other object.


    This promise “token” exposes a `then` method, which expects another handler, and
    in turn returns a new promise that wraps the result of that handler in a promise.
    The handler supplied to `then` is the work that is to be done when the promise
    it is chained to completes. This allows us to *defer* what we wish to do with
    the result of an asynchronous operation till later, in effect, decoupling where
    we start the work, from where we consume the results.


    Considering the `then` API itself returns a promise permits us to “chain” promises,
    thus providing us with a mechanism to eloquently express sequencing—in effect,
    “Do this, when it is done, *then* do this.”


    Finally, a promise object exposes a mechanism to trap any errors, usually with
    a `catch` method , and this allows for trapping, and dealing with any errors that
    might occur, anywhere in the promise chain.


    Promises are a simple abstraction on top of callbacks—they simply provide a mechanism
    to wrap callbacks, alleviating the need for us developers to deal with state and
    error management.


    However, for so long, promises were implemented as a library. Popular stand-along
    implementations include Kris Kowal’s `q`^([^(60)](#fn60)) and libraries like jQuery
    shipped with their own internal implementations. Developers who wished to use
    promises were either forced to include (explicitly or implicitly) a third-party
    library since the language had no support for the same.


    This leads to the second point—while there exists a community-driven specification^([^(61)](#fn61))
    to dictate how JavaScript promises are to work, there was no guarantee that an
    implementation *actually* adhered to the specification, or how true (to the specification)
    the implementation was. In other words, there was no canonical API to work with
    promises that made clients agnostic of the implementation details.


    Add to that the fact that many libraries and frameworks chose to adhere to native
    language constructs (of which there is only one—the callback), thus creating a
    schism, where often code, in one application used both callbacks and promises,
    furthering the confusion.


    To address these issues, ES6 introduces the promise API to JavaScript. Let us
    dive into the details of this API next.'
  trans: '

    # 10. 用 Promise 避免回调


    处理异步操作是一件繁琐的事情。在很长一段时间里，我们求助于使用回调函数，但事实证明，这种模式很难驾驭，尤其是在状态管理和错误传播方面。随后，我们提升了抽象层次，利用了
    Promise。然而，它们本身也带来了一系列问题——不同的库有不同的实现方式，这让我们感到沮丧，并寻求一种合理的方式来处理异步操作。


    这种情况现在改变了！JavaScript 在 ES6 中引入了 Promise 作为原生 API，将 Promise 提升为该语言的一等公民。在本章中，我们将探讨
    Promise 提供的 API，以便我们可以在代码中开始使用 Promise，从而弃用回调。我们还将学习如何封装那些本质上依赖回调的操作，以便我们能够始终一致地使用
    Promise。基于本章所学的内容，我们将一劳永逸地摆脱回调，同时使我们的代码更易于编写和理解。


    ## Promise 的“破碎承诺”


    JavaScript，按设计来说，是一种强制采用异步编程范式的语言。作为 JavaScript 开发者，我们都清楚代码是在单线程中运行的。因此，“阻塞”操作——如
    I/O、网络请求，甚至周期性调用（使用`setInterval`）——都需要异步执行。也就是说，它们需要以一种**不**阻塞主线程的方式执行。


    通常，这是通过回调函数来实现的。异步 API 期望一个或多个“处理”函数作为参数，这些处理程序会在异步调用返回结果（或错误）时被调用。处理程序包含了当异步调用完成时要执行的操作。


    回调函数虽然常见，但可能难以处理。尝试对异步调用进行排序（其中一个调用的执行依赖于前一个调用的响应）可能会导致回调嵌套（被戏称为[厄运金字塔](https://en.wikipedia.org/wiki/Pyramid_of_doom_%28programming%29)^(⁵⁸)）。这种嵌套的代码风格导致更高的耦合度，使其更难测试。由于处理程序在与你代码其余部分不同的“上下文”中运行，错误的报告和传播需要仔细的处理和管理。


    回调强制了一种“急切”的编程风格，也就是说，任何期望回调作为参数的异步函数都强制调用方在操作*完成之前*确切知道需要做什么。由于回调**必须**在调用异步操作之前定义，因此你无法将*如何*消费调用的结果推迟到*开始*或*完成*工作*之后*。从概念上讲，要执行的（异步）任务与任务完成后要执行的工作是绑定在一起的。


    但最重要的是，阅读包含回调的代码需要一些脑力劳动，并且难于理解代码逻辑，尤其是当回调彼此嵌套时。诚然，我们可以将回调重构为独立的函数，并使用它们，但这似乎只是“把问题踢到更远的地方”。在处理嵌套回调时，有一些常用的策略，其中许多策略已在诸如
    [Callback Hell](http://callbackhell.com/)^(⁵⁹) 这样的网站中有所记载。


    于是，Promise 应运而生。顾名思义，Promise 代表了某些*最终*会发生的工作的结果。使用 Promise 时，异步调用不再接受处理函数，而是立即返回一个
    Promise 对象（或将其包裹在一个 Promise 中）。这个 Promise 代表了*未来*潜在成功/失败的结果，它可以被传递到应用程序的其他部分，从而将异步工作的概念提升为像任何其他对象一样的一等公民。


    这个 Promise “令牌”暴露了一个`then`方法，它期望另一个处理程序，并反过来返回一个新的 Promise，该 Promise 将处理程序的结果包裹起来。提供给`then`的处理程序是在其所链接的
    Promise 完成后要执行的工作。这允许我们*推迟*对异步操作结果的处理，直到稍后，从而有效地将启动工作与消费结果的地点解耦。


    鉴于`then` API 本身返回一个 Promise，这允许我们“链式调用”Promise，从而为我们提供了一种优雅表达排序的机制——实际上就是“执行这个，完成后，*然后*再做那个。”


    最后，Promise 对象暴露了一种捕获任何错误的机制，通常使用`catch`方法，这允许捕获并处理 Promise 链中任何位置可能发生的任何错误。


    Promise 是对回调的一种简单抽象——它们只是提供了一种包装回调的机制，减轻了我们开发者处理状态和错误管理的需要。


    然而，长期以来，Promise 是作为库来实现的。流行的独立实现包括 Kris Kowal 的 `q`^(⁶⁰)，而像 jQuery 这样的库也自带其内部实现。希望使用
    Promise 的开发者要么被迫引入（显式或隐式地）一个第三方库，因为语言本身不支持它。


    这就引出了第二点——虽然存在一个社区驱动的规范^(⁶¹)来规定 JavaScript Promise 应如何工作，但无法保证某个实现*确实*遵循了该规范，或者该实现（对规范）的遵循程度如何。换句话说，没有一个规范的
    API 来处理 Promise，使得调用方可以不依赖于具体的实现细节。


    再加上许多库和框架选择遵循原生的语言结构（而这种结构只有一个——回调），从而造成了分裂，往往在一个应用程序中，代码同时使用了回调和 Promise，进一步加剧了混乱。


    为了解决这些问题，ES6 将 Promise API 引入到了 JavaScript。接下来，让我们深入探讨这个 API 的细节。

    '
- fmt: "### Using Promises\n\nPromises are created using the `Promise` constructor,\
    \ which takes as its sole argument a single function. This function, in turn,\
    \ receives two arguments, wherein both arguments happen to be functions themselves.\
    \ The first argument provides the means to signal a successful resolution of the\
    \ promise, while the second signals a failed resolution. Let us consider a simple\
    \ example to make this idea concrete:\n\n- ① Create a promise using the constructor\n\
    - ② `resolve` it conditionally\n- ③ Else `reject` it\n\n```javascript\nconst shouldResolve\
    \ = true;\nconst p = new Promise((resolve, reject) => { // ①\n  if (shouldResolve)\
    \ {\n    resolve('I transitioned successfully'); // ②\n  } else {\n    reject(new\
    \ Error('I failed to resolve')); // ③\n  }\n});\nconsole.log(p);\n```\n\nWe introduce\
    \ *some* conditional as a mechanism to mimic a real-world scenario where the promise\
    \ might successfully resolve, or fail to do so. To follow the happy path (initially),\
    \ we set the conditional to `true`. We then proceed to create a promise using\
    \ the constructor, conditionally “resolve”-ing with a message by invoking the\
    \ first argument to the callback handler, aptly named `resolve`. If we were to\
    \ run this in our browser console, we see the following:\n\n```\nPromise { : \"\
    fulfilled\", : \"I transitioned successfully\" }\n```\n\nSince our conditional\
    \ allowed the promise to be “resolve”-ed, the promise now in a “fulfilled” state\
    \ reports our success message.\n\nIf we were to try running the same snippet with\
    \ the conditional set to `false`, we notice the promise was “rejected.”\n\n```\n\
    Promise { : \"rejected\" }\n```\n\nThe promise constructor provides a mechanism\
    \ to wrap any existing functions or operations that perform asynchronous tasks.\
    \ Many legacy APIs expect a callback; however, if we wish to use promises everywhere\
    \ (which we should), it’s easy to hide this from consumers going forward, like\
    \ so:\n\n- ① Wrap an `XMLHttpRequest` call in a function\n- ② If the request succeeds,\
    \ `resolve` the promise with the response from `XMLHttpRequest` object\n- ③ Else\
    \ `reject` it, appropriately wrapping the response\n\n```javascript\nconst asyncRequest\
    \ = (method, url) => // ①\n  new Promise((resolve, reject) => {\n    const xhr\
    \ = new XMLHttpRequest();\n    xhr.open(method, url, true);\n    xhr.onload =\
    \ () => resolve(xhr.response); // ②\n    xhr.onerror = () => reject(new Error(xhr.statusText));\
    \ // ③\n    xhr.send();\n  });\nconst req1 = asyncRequest('GET', 'https://my-json-server.typicode.com/typicode/demo/posts');\n\
    ```\n\nWe attempt to (rather naively^([^(62)](#fn62)) I must admit) wrap requests\
    \ using `XMLHttpRequest` in a promise API. Now, any call to `asyncRequest` simply\
    \ returns a promise, that is, in this instance `req1` is a `Promise` object.\n\
    \nAs one might surmise, a promise acts like a state machine. Once constructed,\
    \ a promise is in “pending” state, and eventually “transitions” to either being\
    \ “fulfilled,” if it is resolved, or to a “reject”-ed state, if it is rejected,\
    \ lending the state of the promise to “settled.” Once settled, a promise **cannot**\
    \ revert to any of its previous states, nor can it transition to any other state.\n\
    \nOnto the promise API!\n\n### Using Promises\n\nThe Promises/A+ specification\
    \ alludes to a `thenable` object, which is an object that acts like a promise,\
    \ and happens to have a `then` method. ES6 promises are Promises/A+ compliant,\
    \ and correspondingly expose a `then` method that allows clients to access the\
    \ *eventual* result of a resolved promise, or the reason for it being rejected.\n\
    \nAn interested party can express interest in the value of the promise *at any\
    \ time* (even after the promise has transitioned) by attaching a handler to its\
    \ `then` method. This callback will be invoked if the promise resolves successfully.\n\
    \nThe `then` method can also take a second, optional argument which is the error\
    \ callback, and this callback will be invoked if the promise were to be rejected;\
    \ however, this is considered to be an [anti-pattern](https://www.datchley.name/promise-patterns-anti-patterns/).^([^(63)](#fn63))\
    \ In order to catch errors in the promise chain, promise objects also expose a\
    \ `catch` method, which will trap any rejected cases. `finally` is yet another\
    \ method that promises expose, that allows us to do any cleanup once the promise\
    \ is settled; in other words, the handler supplied to `finally` will be invoked\
    \ regardless of the promise being resolved or rejected.\n\n`then`, `catch`, and\
    \ `finally` are all guaranteed to return promise objects. That is, we are not\
    \ required to wrap the return value of these callbacks in promises—we can simply\
    \ return any value or reference, and the underlying machinery will automatically\
    \ wrap the return value in a promise for us.\n\nThus, idiomatically, `resolve`\
    \ and `then` method *should*, respectively, capture and `return` values, allowing\
    \ consumers downstream to continue chaining, while `reject`-ion should be done\
    \ using an `Error` object, which captures a stacktrace thus making debugging a\
    \ lot easier.\n\nWhich begs the question—what should the return value of `catch`\
    \ be? Recall that both `then` and `catch` return promises—so if there is a way\
    \ to recover from an error, and allow for continuation of the promise chain, then\
    \ a `catch` handler can return a value while simultaneously allowing for side\
    \ effects (such as logging the error)! This allows consumers downstream to remain\
    \ agnostic of errors, and may continue chaining knowing that they will get a value,\
    \ albeit a default of some sort.\n\n`finally` is a bit of an exception—it takes\
    \ no arguments, and is simply a mechanism that allows for any cleanup required\
    \ after the promise resolves. The `finally` block **will** be invoked regardless\
    \ of a resolution or a rejection, much like any `try-catch-finally` block you\
    \ might be used to in other languages.\n\nA quick demonstration is in order. We\
    \ will build upon our promisified `XMLHttpRequest` example, and register appropriate\
    \ listeners for a result, and trap any errors.\n\n- ① Attach several handlers\
    \ using the `then` method\n- ② Ensure we trap any errors using `catch`\n\n```javascript\n\
    const req1 = asyncRequest('GET', 'https://my-json-server.typicode.com/typicode/demo/posts');\n\
    req1\n  .then(json => JSON.parse(json)) // ①\n  .then(resp => resp.map(item =>\
    \ item.id))\n  .then((ids) => {\n    console.log(`Found ${ids.length} posts`);\n\
    \    return ids;\n  })\n  .catch(err => console.log(err)); // ②\n```\n\nThe promise\
    \ API, outside of being fluent, provides a very elegant mechanism to decouple\
    \ *starting* an asynchronous operation from the consumption of the results of\
    \ said operation. Gone are the nested callbacks; instead the multiple `then`s\
    \ allow us to (better) align our code with how we think and reason about our programs.\
    \ Furthermore, since the chain correctly propagates errors, we can safely trap\
    \ *any* error that may occur in the promise chain."
