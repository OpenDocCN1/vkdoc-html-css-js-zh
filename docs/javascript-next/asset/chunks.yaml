    # 13. Metamorphosis with Proxy and Reflect


    No API can or should attempt to be complete. Depending on the use-case, and the
    problem space, we often find that we may need to add, remove, or even constraint
    behavior to an object, or a type. Historically our approach to this was leveraging
    JavaScript''s dynamic nature, and simply tack on the additional behavior we wanted
    to see on any object. Symbols can help in this regard, by giving us the guarantee
    of collision-free keys. However, in many cases it can feel a tad hackish, especially
    when we do not wish to *permanently* modify behavior of an object for the lifetime
    of our application.


    ES6 gives us proxies, which are essentially an implementation of the proxy pattern
    at a language level. In this chapter we will see how we can change the behavior
    of both new and existing objects without actually modifying the objects themselves,
    while simultaneously giving us the ability to explicitly opt-in and opt-out if
    and when we choose to do so.


    ## The Perils of Monkey-patching


    JavaScript is a dynamically typed language, in that, it does not require us to
    know or declare what the type of a variable or object is upfront. This dynamic
    nature can be extended to the structure of objects, wherein, given an object,
    we can modify its properties (and methods) to suit our needs. This flexibility
    of JavaScript, along with other features intrinsic to the language like prototypal
    inheritance and first-class functions, has proven to be one of the selling points
    of JavaScript, allowing developers to drum up powerful yet elegant solutions like
    aspect-oriented programming facilities^([^(84)](#fn84)) and Behavior Driven Testing
    using mocks and spies with Sinon,^([^(85)](#fn85)) at the risk of it being abused.^([^(86)](#fn86))


    One particular set of (ab)use-cases lies with adding behavior to existing types
    and objects. Consider a scenario where anytime we get or set a property on an
    object, we wish to automatically perform a side effect, like logging. This isn''t
    something we would want done everywhere, since it might prove to be verbose, expensive,
    or both. We could, using JavaScript''s dynamic nature, modify the behavior for
    a certain section of the codebase, carefully reverting it back to its original
    behavior afterward, like so:


    *   ① Define our interceptor function

    *   ② Ensure that we only intercept the supplied objects methods

    *   ③ Grab a reference to the method

    *   ④ Call the interception function first

    *   ⑤ Then delegate to the original method

    *   ⑥ Define our "logger" function

    *   ⑦ Define a plain JavaScript object

    *   ⑧ Be sure to modify the object prior to invoking its methods


    ```javascript

    const intercept = (obj, interceptionFn) => { ①

    for (const m in obj) {

    if ((Object.prototype.hasOwnProperty.call(obj, m)) && (obj[m] instanceof Function))
    { ②

    const method = obj[m]; ③

    obj[m] = function(...args) {

    interceptionFn.call(obj, m); ④

    return method.apply(obj, args); ⑤

    };

    }

    }

    };

    const logger = m => console.log(`${m} was called`); ⑥

    const toBeIntercepted = { ⑦

    name: ''Jonathan'',

    getName() {

    return this.name;

    },

    setName(name) {

    this.name = name;

    },

    };

    intercept(toBeIntercepted, logger); ⑧

    // prints ''getName was called'' followed by ''Jonathan''

    console.log(toBeIntercepted.getName());

    // prints ''setName was called''

    toBeIntercepted.setName(''Johnson'');

    // prints ''getName was called'' followed by ''Johnson''

    console.log(toBeIntercepted.getName());

    ```


    We start with writing a rather generic method-intercepting function that takes
    two arguments—the object whose behavior we wish to modify and the function that
    is to be invoked when any of the object''s method gets called. Then we loop over
    all of the supplied objects properties, ensuring that we do **not** climb the
    inheritance tree, and only modifying properties that happen to be methods. Finally,
    we define our "logger" function and an object, and ensure we decorate the methods
    of the object so that our logger function is called upon every invocation.


    In this case we are modifying the behavior of an existing object for certain pieces
    of functionality, namely any method invocation. That said, our implementation
    makes it hard to turn off the newly introduced behavior. In order to revert the
    behavior to its original behavior, we will have to store the original implementations
    of the methods we modify, and then reinstall them.


    Of course, we risk forgetting to turn off the behavior (assuming that we can),
    and suffer the consequences, including leaking unintended behavior elsewhere,
    and surprising any other unwitting clients with unexpected side effects. This
    technique of modifying existing behavior is used very effectively by testing libraries
    like Sinon to create spies and mocks, and present an ideal use-case—testing limits
    the scope in which the new behavior is visible.'
