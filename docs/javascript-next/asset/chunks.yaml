  raw: '## Generators


    We are well aware of the introduction of generators in ES6\. As previously discussed,
    ES6 generators are synchronous. However, what we want when working with asynchronous
    operations is the ability to `await` prior to yielding—except we cannot `await`
    without being in an `async` function.


    ES9 introduces the ability to apply the `async` keyword to generator functions,
    in effect, introducing asynchronous generators. We can `await` asynchronous operations
    within the generator (recall that we only use `await` *inside* of `async` functions)
    just like we would in regular generators, and once resolved, `yield` those values:


    *   ① Define an `async` generator


    *   ② `await` an asynchronous operation


    *   ③ Use the `for-await-of` loop to iterate over the generator iterator


    ```

    const randomTimeout = async (val, index) => {

    const timeout = Math.floor(Math.random() * Math.floor(42));

    return new Promise(res =>

    setTimeout(res, timeout, `My value is ${val} at index: ${index}`));

    };

    async function* asyncGenerator() { ①

    yield await randomTimeout(10, 1); ②

    console.log(''First time'');

    yield await randomTimeout(20, 2);

    console.log(''Second time'');

    }

    console.log(typeof asyncGenerator()[Symbol.asyncIterator] === ''function'');

    (async () => {

    const gen = asyncGenerator();

    for await (const item of gen) { ③

    console.log(''item'', item);

    }

    })();

    ```


    An `async` generator, much like a regular generator function, produces an iterator
    object, except the generator object returned implements the `Symbol.asyncIterator`
    method (as compared to a synchronous iterable produced by a synchronous generator).
    Consequently, we can no longer use the `for-of` loop with the generated iterable.
    However, we *can* use the `for-await-of` loop, since it indeed works with asynchronous
    iterables.


    The machinery for asynchronous generators does not differ from that from synchronous
    generators. They are mechanisms that allow us to create iterables, permitting
    for lazy-code, and as a result, create infinite sequences. The difference is in
    what they return—asynchronous iterators return us iterables that implement the
    `Symbol.asyncIterator` method, allowing them to be consumed using `for-await-of`
    loops.


    ## Parity with Synchronous Iterators and Generators


    We have spoken at length about synchronous iterators and generators, specifically
    about the ability of iterators to implement a `return` method that is invoked
    if we were to prematurely terminate iteration. We have also seen that generators
    can act as “consumers,” wherein we can influence the next `yield` of the generator
    by passing an argument to the `next` invocation. All of these apply to asynchronous
    generators and iterators as well. Finally, recall that the point of `async` and
    `await` is to make asynchronous operations *seem* imperative. This allows us to
    wrap the code within an asynchronous generator in a `try-catch` or a `try-catch-finally`
    block to trap any promises that might be rejected during the execution of the
    generator.


    ## Benefits


    Asynchronous iterators and generators prove to be useful anytime we wish to consume
    (lazily or otherwise) the results of asynchronous operations, all while reaping
    the benefits of the seemingly imperative code that `async`/`await` offer us. One
    great example is when reading large files (perhaps using node.js) one line at
    a time. Another use-case would be consuming APIs where the data returned to us
    is paginated. Consider Github’s API wherein requesting the commits for a repository—Github
    returns (by default) a 100 commits per response, providing us with a link to the
    *next* 100 in the response headers. Consuming such an API fits naturally into
    the facilities offered by asynchronous generators, wherein we `await` every `fetch`
    and process, and if needed, proceed to the `next` 100 commits.


    ## Summary


    In this chapter, we saw how ES9’s asynchronous iterators and generators allow
    us to combine `async` and `await` with the on-demand processing capabilities of
    iterators and generators. This new feature set brings us full circle, incorporating
    promises, iterators, and generators introduced in ES6, along with `async`/`await`
    introduced in ES8, to allow us to work in different contexts at a higher level
    of abstraction, while bringing parity to synchronous and asynchronous operations.


