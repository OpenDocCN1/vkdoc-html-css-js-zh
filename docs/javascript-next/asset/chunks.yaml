  trans: '

    映射（Map）会保留其条目的插入顺序，具体来说就是**键**被添加的顺序。然而，如果发生键冲突，新值会覆盖*该键所在位置*的旧值。也就是说，它们的行为非常类似于数组，只是它们的“索引”可以是任意类型。


    由于映射维护了顺序，它们允许我们使用 `forEach` 等方法以及 `entries` API 来遍历其 `entries`。该 API 每次返回一个键值对，被封装在长度为
    2 的数组中，表示为 `[key, value]`。映射还提供了 `keys` 和 `values` API，顾名思义，它们会按照插入顺序返回映射中所有键和值的数组。


    映射和数组一样遵循“迭代器”协议，正如我们之前讨论过的，这使得映射可以通过 `...` 运算符进行展开，并能进行解构。正如我们所见，映射可以通过数组的数组来创建；反过来，可以推测，展开一个映射会将其分解为一个数组的数组，其中每个数组都是一个键和值的元组，而外层的数组反映了插入顺序，其
    `length` 等于映射的 `size`。


    - ① 创建一个映射

    - ② 将映射展开为数组

    - ③ 解构获取第二个和第三个条目


    ```

    const firstQuarter = new Map([

    [1, ''Jan''],

    [2, ''Feb''],

    [3, ''Mar''],

    [4, ''Apr''],

    ]); ①

    const mapToStr = [...firstQuarter].join('':''); ②

    console.assert(mapToStr === ''1,Jan:2,Feb:3,Mar:4,Apr'');

    const [

    ,

    [n2, m2],

    [n3, m3],

    ] = firstQuarter; ③

    console.assert(n2 === 2);

    console.assert(m2 === ''Feb'');

    console.assert(n3 === 3);

    console.assert(m3 === ''Mar'');

    ```


    鉴于映射是可迭代的，并且 `Map` 构造函数期望接收一个可迭代对象，当我们尝试从现有映射创建新映射时，这变得非常方便。当创建恰好是其他映射的并集的新映射时，这甚至更加便利：


    - ① 两个映射的并集

    - ② “后到者优先”原则


    ```

    const nihar = new Map([

    [''car'', ''mazda''],

    [''residence'', ''apartment''],

    ]);

    const ericka = new Map([

    [''pet'', ''oscar''],

    [''residence'', ''house''],

    ]);

    const union = new Map([...nihar, ...ericka]); ①

    console.assert(union.get(''car'') === ''mazda'');

    console.assert(union.get(''residence'') === ''house''); ②

    console.assert(union.get(''pet'') === ''oscar'');

    ```


    我们从两个独立的映射开始，然后利用映射是“可展开的”这一特性以及映射构造函数可以使用数组来构建新映射的事实，尝试构建一个新的映射。注意，在这种情况下，传递给构造函数的数组有**四个**条目；然而，当映射尝试将每个条目添加到新映射时，它在遇到
    `residence` 键时会检测到冲突。因此，结果映射中 `residence` 键对应的值将是 `house`。


    为了全面了解映射，让我们回答一个仍未解决的相关问题——两个键如何被视为相等？答案在于 `===` 操作符。如果 `set` 操作时，映射中已存在的任何键通过
    `===` 测试返回 `true`，则视为冲突，该键的值将被设置为新值。否则，一个新的键值对条目会被插入到映射的末尾。


    ## 注意事项


    与映射相关的注意事项并不多。其 API 很全面，能够完成我们对映射期望的所有功能。


    然而，第一个不足之处是缺少字面量语法。这迫使我们使用构造函数，这似乎与我们通常处理对象和数组的方式相悖。在 JavaScript 中有很多理由不使用构造函数^(⁴⁴)，但可惜的是，我们别无选择。让我们通过一个简单的例子来观察这种差异：


    - ① 对象为我们提供了字面量 `{}` 语法

    - ② 同样地，数组提供了 `[]` 字面量

    - ③ 我们却被迫使用构造函数


    ```

    const kiran = { ①

    name: ''kiran'',

    profession: ''pharmacist'',

    };

    const favFruits = [ ②

    ''mango'',

    ''guava'',

    ''pineapple'',

    ];

    const numbersInHindi = new Map(); ③

    numbersInHindi.set(1, ''ek'').set(2, ''do'').set(3, ''teen'');

    ```


    第二个问题涉及 JSON 的序列化（和反序列化）。JSON 规范^(⁴⁵) 只支持两种数据结构——对象和数组。因此，对任何映射使用 `JSON.stringify`
    都不会产生预期的结果。


    事实证明，我们能为映射的序列化版本做到的最接近的方式是将其视为一个数组的数组。在另一端，我们可以简单地 `JSON.parse` 接收到的字符串，然后将其交给映射构造函数以创建一个新的映射。观察如下：


    - ① 序列化映射的便捷函数

    - ② 序列化的逆操作


    ```

    const nihar = new Map([

    [''car'', ''mazda''],

    [''residence'', ''apartment''],

    ]);

    const mapToJson = map => JSON.stringify([...map]); ①

    const jsonToMap = mapStr => new Map(JSON.parse(mapStr)); ②

    const serialized = mapToJson(nihar);

    // 输出 ''[["car","mazda"],["residence","apartment"]]''

    console.log(serialized);

    const deserialized = jsonToMap(serialized);

    // 输出 ''Map { ''car'' => ''mazda'', ''residence'' => ''apartment'' }''

    console.log(deserialized);

    ```


    将序列化/反序列化逻辑封装到工具函数中会很有益处，我们很快就会看到这一点。另外，映射的“可迭代性”再次证明了它是我们的朋友。


    然而，如果这让你有点担心，那么你并不孤单。在数据交换层缺乏对映射的支持，将判断某个数据是否为映射的责任转移到了应用层。换句话说，仅仅查看 JSON 内容，根本无法表明某些东西应该被解析为映射，还是仅仅是一个数组的数组。


    此外，如果某个对象或数组可能包含映射，我们就不能再简单地对其使用 `JSON.stringify`！我们现在被迫要检查所有值，如果恰好是映射，就使用我们的便捷函数先序列化那个值，然后再序列化父对象。或者，我们可以尝试使用第三方库^(⁴⁶)
    来为我们完成转换。^(⁴⁷)


    这里的关键问题在于，映射的键可以是*任何*类型，包括引用类型。让我们将其与序列化对象进行对比；对象中的键总是字符串，并且字符串自身就是其表示。因此，序列化一个对象键简化为简单地将该字符串放入
    JSON 中。映射则不同！如果我们使用一个对象引用作为映射的键，并且该引用被序列化，那么在反序列化时，该引用就会丢失！考虑以下情况：


    - ① 序列化一个包含对象引用作为键的映射

    - ② 将其反序列化回映射

    - ③ 查找该对象引用失败


    ```

    const obj = {

    name: ''some object'',

    };

    const map = new Map([

    [obj, ''value against an object key''],

    ]);

    const mapToJson = m => JSON.stringify([...m]);

    const jsonToMap = mapStr => new Map(JSON.parse(mapStr));

    const serialized = mapToJson(map); ①

    // 输出 ''[[{"name":"some object"},"value against an object key"]]''

    console.log(serialized);

    const deserialized = jsonToMap(serialized); ②

    // 输出 ''Map { { name: ''some object'' } => ''value against an object key'' }''

    console.log(deserialized);

    console.assert(deserialized.get(obj) === undefined); ③

    ```


    从 JSON 反序列化后，要重新获得一个本身是对象引用的键的唯一方法是遍历映射的所有键并获取其引用。这完全违背了键查找的目的！


    那么，映射真的有实际用途吗？当然有。只要我们不打算序列化映射，它们就很有用。它们提供了普通的旧式 JavaScript 对象（`POJO`）所不允许的灵活性。当然，如果你*确实*打算序列化，那么最好所有的键本身都是可序列化的（换句话说，是字符串），这样我们才能“重新找到”它们。如果这不可行，那么你最好还是只使用
    `POJO`。

