    function ele([strings], ...values) { ①

    const str = strings.trim();

    // assume anything before the FIRST . or # to be the name of the element

    const [element] = str.split(/[.#]/); ②

    // split the remainder of the string into parts using . or # as the delimiter

    // this will grab everything between a ''.'' or ''#'' and the next ''.'' or ''#''

    const attrs = str.match(/[.#](?:[^.#]+)/g); ③

    let idStr = ";

    let classStr = ";

    if (attrs) { ④

    // find all ids supplied

    // if multiple ids were supplied just use the last one

    const id = attrs

    .filter(a => a.startsWith(''#''))

    .pop(); ⑤

    // do not compose id string if no ids were supplied

    idStr = id

    ? `id="${id.substring(1, id.length)}"` ⑥

    : ";

    // find all classes supplied

    const classes = attrs

    .filter(a => a.startsWith(''.''))

    .map(v => v.substring(1, v.length)); ⑦

    // do not compose class string if no classes were supplied

    classStr = (classes.length > 0)

    ? `class="${classes.reduce((acc, v) => `${acc}${v} `, ").trim()}"` ⑧

    : ";

    }

    const adornedElement = [element, idStr, classStr]

    .reduce((acc, v) => `${acc} ${v}`.trim(), "); ⑨

    return `${values.join(")}`; ➉

    }

    const heading = ''Hello Template Handlers'';

    // prints ''Hello Template Handlers''

    console.log(ele`h1 ${heading}`);

    // prints ''Hello Template Handlers''

    console.log(ele`h1#main ${heading}`);

    // prints ''Hello Template Handlers''

    console.log(ele`h1.title ${heading}`);

    // prints ''Hello Template Handlers''

    console.log(ele`h1.title.content#main ${heading}`);

    // prints ''Hello Template Handlers''

    console.log(ele`h1.title.content#main ${ele`div${heading}`}`);

    // prints ''Hello Template Handlers''

    console.log(ele`h1.title.content#main ${ele`div.banner${heading}`}`);

    ```


    There is a lot going on here, so let us take it one step at a time. Given the
    constraints we have placed on the usage of our tag functions, we know that the
    array containing the element description will be a single element array. Hence,
    we destructure the same to get that one and only element and `trim` it to eliminate
    any superfluous whitespace. We also know that the string consists of an element
    name followed by class (`.`) and id (`#`) selectors, so we can use `split` to
    get anything before the first appearance of a selector and treat that as the name
    of the HTML element we are to produce.


    Next, some regular expression magic to grab every selector that was supplied after
    the element name into an array. So, if the user were to supply `h1.title.content#main`
    then the regular expression would split this into an array that looks like `[''.title'',
    ''.content'', ''#main'']`. We first filter this array to find all the IDs supplied
    by the user, and if there were more than one (which is illegal), we simply take
    the last one supplied, thereby emulating the behavior of Emmet, and compose the
    `id=` string. However, multiple classes *are* allowed, so we filter our array
    for all the supplied classes and compose the `class=` string.


    The rest is easy—simply bring together the name of the element, the id, and class
    string, ensuring we are interjecting the `innerHTML` content (supplied as interpolated
    variables), and return the fully composed element.


    We must highlight a few things about our implementation. First, we use template
    strings *within* our function to construct other strings. In so far as a tag function
    is concerned, other than having an explicit signature, they are just like regular
    functions. Secondly, as we can see in the examples, we can nest other (tag) function
    invocations, allowing us to create nested element structures. Since JavaScript
    has to first evaluate every interpolated expression prior to composing the string,
    in effect, nested calls to our tag function cause the final string to be built
    inside out—with the innermost invocation happening first, then moving outward.


    Admittedly our implementation is not going to win any awards any time soon. It
    cannot handle sibling elements (which Emmet supports with the `+` operator) or
    creating `n` number of elements simultaneously (Emmet does this with the `*` operator).
    However, it does allow us to get some insight into the power of template literals
    and tag functions, and what they are truly capable of.


    Tag functions, along with template strings offer a variety of use-cases, including
    aiding with internationalization and localization, language translation, and sanitation
    of user input, where the core essence is transforming a string from one form into
    another. We could even extend our emmet tag function to emulate behavior exhibited
    by template languages like JSX from React. Libraries like `styled-component` and
    `html-tagged-template` offer great ideas and incentives for us to consider template
    literals for many common day-to-day use-cases.


    Can you think of any situation where you can eliminate redundancy in your code
    by introducing such a DSL? How about times where you might be pretty-printing
    objects for debugging purposes? Or displaying data in a particular format, like
    locale-specific dates and/or currencies?


    ## Summary


    Generating strings that interpolate variables has always been a tedious affair,
    and template strings aim to alleviate the pain by providing a literal that not
    only makes it easier, but also has support for multiline strings. Tag functions,
    on the other hand, allow us to intercept how construction of template strings,
    allowing for some rather interesting use-cases.


    In the next chapter we will switch our attention back to objects and arrays. Objects
    and arrays have served us well so far, but those of us who come from other languages,
    we often reminisce about data-structures such as maps and sets, and the lack of
    such data-structures in JavaScript. That is to be the topic of our next chapter.
    Alongside we will see how the spread operator and destructuring work hand in hand
    with these as well.


