    # 变量作用域的危险性


    JavaScript 同时支持语句（statements）和表达式（expressions），通常，为了捕获表达式求值的结果，我们会使用变量。但有时，一个变量虽然名为“变量”，实际上却被指定为常量。也就是说，一旦赋值，我们*意图*让这个变量的值在后续不再改变。


    然而，到目前为止，JavaScript 只提供了一个关键字 `var` 来初始化变量，无论这些变量是值会变化的（比如 `for` 循环中的索引），还是应当保持不变的常量。对于后者，开发者只能采用命名约定，通常是*大写下划线分隔*的格式，比如
    `SOUTH_WEST`，以此暗示它应被当作常量对待，而语言层面并没有提供运行时支持。


    因此，`var` 的用法不仅被过度泛化，雪上加霜的是，它还给我们带来了几个绊脚石。使用 `var` 声明的变量会自动提升（hoist）到当前作用域的顶部。此外，在同一作用域内使用相同的名称重新声明两个
    `var` 变量并不会抛出错误。将这两点结合起来，其结果可能相当隐蔽，如下例所示：


    *   ① 一个顶层变量声明

    *   ② 看似“遮蔽”了外层的声明

    *   ③ 结果发现，这两个变量其实是同一个！


    ```

    function insidious() {

    var functionScoped = ''外层声明''; ①

    if (true) {

    var functionScoped = ''内层声明''; ②

    }

    console.log(functionScoped); ③

    return functionScoped;

    }

    // 输出 ''Inner declaration''（内层声明）

    insidious();

    ```


    有人*可能*会认为内层嵌套的 `functionScoped` 作用于 `if` 块内部，但这**不**正确！事实上，第二次声明 `functionScoped`
    是一个空操作（no-op）。*然而*，这并不妨碍 JavaScript *先*（在顶部）声明这个变量，然后在后续代码中重新赋值，正如输出结果所体现的那样。为了避免混淆，JavaScript
    开发者倾向于在函数开头就声明好所有将在该函数内使用的变量。


    这种 `var` 不遵循块级作用域的观念确实令人惊讶，因为许多语言都是采用*词法作用域*来声明变量的。也就是说，在这些语言中，变量在文本上被限定在封闭的括号内，并且在由块创建的作用域外部是不可见的。这可能会让人误以为
    `var` 也是有作用域的，但实际上并非如此，从而可能导致无法解释的结果。考虑下面的例子：


    *   ① 使用三个按钮模拟 DOM

    *   ② 为每个按钮添加一个 `click` 处理器

    *   ③ 所有按钮都输出 "Item 4 is clicked"


    ```

    function simulateDom() {

    var pseudoDom = {

    button1: {},

    button2: {},

    button3: {},

    }; ①

    for (var i = 1; i <= 3; i++) {

    var element = pseudoDom[''button'' + i];

    element.click = function () {

    return ''Item '' + i + '' is clicked.''; ②

    };

    }

    console.log(pseudoDom.button1.click());

    console.log(pseudoDom.button2.click());

    console.log(pseudoDom.button3.click()); ③

    return pseudoDom;

    }

    // 输出 3 次 ''Item 4 is clicked.''

    simulateDom();

    ```


    由于变量 `i` 被提升到了 `for` 循环*外部*，并且不是 `for` 循环的局部变量，每个点击处理器“看到”的都是同一个 `i`。在循环结束时，`i`
    的值可预见地变为 4，因此任何按钮点击都报告这个值。


    总而言之，在函数内声明的任何 `var` 变量，其作用域都是该函数，即使它*是*在某个块内部定义的也是如此。


    ## 那 `严格模式` 呢？


    ES5 引入了 `strict mode`（严格模式）作为一个可选功能，用以限制 JavaScript 的某些行为。这部分目的是通过改变代码的语义，特别是禁止某些行为，来简化向未来
    JavaScript 版本的过渡。虽然 `strict mode` 确实有助于防止一些相当恶劣的错误发生，例如无意中声明了“全局”变量（在函数内部不使用 `var`
    关键字声明的变量），但它并**没有**改变我们迄今为止讨论的作用域规则。


    我们**强烈**建议在 ES5 代码中使用 `strict mode`。而且，在我们开始理解和采用 ES6+ 的旅程中，逐步在我们现有的脚本中引入 `strict
    mode` 是明智之举。这无疑会使将它们转换为 ES6 变得更加容易。`strict mode` 的文档可在 [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode)
    找到。


    总而言之，如果以上所有内容让你头晕目眩，那么你并不孤单。理清 JavaScript 的作用域规则本身就很难；再结合 `var` 的变量提升，更是雪上加霜。为了解决围绕
    `var` 的一些问题，ES6 启用了^(¹²) `let`。正如我们将在以下章节中看到的，`let` 解决了 `var` 带来的许多作用域缺陷。


    你可能会问，为什么不直接修复 `var` 而是引入 `let`？嗯，我们可不想去搞垮整个互联网，对吧？


    ## `let`


    正如你可能已经猜到的，围绕 `var` 的大部分混乱之所以存在，是因为 `var` 不遵守“块级”作用域。在 JavaScript 中，块是一种收集一个或多个语句的方式；换句话说，它们允许我们创建一个复合语句。块由一对花括号界定，如果你在想：“等等。循环结构（比如
    `for` 和 `while`）和条件语句（比如 `if` 和 `else`）也使用花括号。那些是块吗？”那么，你是对的。


    块本身不引入作用域。然而，ES6 为使用 `let` 关键字定义的变量引入了块级作用域。使用 `let` 关键字定义的变量将被限定在最近的封闭块内。换句话说，使用
    `let` 关键字定义的变量在词法上被限定在最近的封闭块内：


    *   ① 在*块内部*声明的变量不能在块外部被引用

    *   ② 使用 `let` 语法声明的变量

    *   ③ 和之前一样，该变量在 `if` 块定义的作用域外部不可见


    ```

    function letFunction() {

    // console.log(''在定义块之前'', scopedLet); ①

    if (true) {

    let scopedLet = ''我被限定在块内！''; ②

    }

    // console.log(''在定义块之后'', scopedVar); ③

    }

    // 调用它

    letFunction();

    ```


    我们可以松一口气了！使用 `let` 关键字声明的变量*似乎*遵循了你在其他语言中熟悉的作用域规则，并且它们确实减少了与 `var` 相关的上下文开销。


    许多由 `var` 的宽泛作用域引起的问题（以及潜在的 bug）都可以通过改用 `let` 来避免。让我们重新审视之前模拟 DOM 的例子，看看使用 `let`
    的效果：


    *   ① `i` 是 `for` 循环的局部变量

    *   ② 由于 `i` 是局部变量，每个处理器都能看到正确的 `i` 值

    *   ③ 可预见地，所有点击处理器都报告正确的消息


    ```

    function simulateDom() {

    let pseudoDom = {

    button1: {},

    button2: {},

    button3: {},

    };

    for (let i = 1; i <= 3; i++) { ①

    let element = pseudoDom[''button'' + i];

    element.click = function() {

    return ''Item '' + i + '' is clicked.''; ②

    };

    }

    console.log(pseudoDom.button1.click());

    console.log(pseudoDom.button2.click());

    console.log(pseudoDom.button3.click()); ③

    return pseudoDom;

    }

    // 输出 ''Item 1 is clicked.'', ''Item 2 is clicked.'', ''Item 3 is clicked.''

    simulateDom();

    ```


    正如我们所见，使用 `let` 声明的变量确实尊重封闭块的作用域，从而使代码更易于推理。


    尽管 `let` 确实简化了变量的作用域规则，但它本身也有一些注意事项，我们将在下一节中看到。

