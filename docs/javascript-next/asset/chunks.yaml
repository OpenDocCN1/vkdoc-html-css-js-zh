    We have unlocked "Mastery" level with proxies. This example demonstrates the true
    power of proxies—in about 50 lines of code, we implemented a powerful DSL that
    allows us to express our intent in a succinct, yet declarative manner.


    ## Summary


    `Proxy`, along with `Reflect`, proves us with all of the tools we need to create
    "meta" magic in our code unobtrusively. Proxies give us namespaced wrappers around
    the objects we wish to enhance, ensuring that the modified behavior is only visible
    to the region of code where it is applicable. `Reflect` mirrors the API of `Proxy`,
    while simultaneously giving JavaScript a specific place to house reflection-specific
    APIs, whereas prior to ES6, it was `Object` that demonstrated some reflection
    capabilities. Having `Reflect` as part of the toolkit going forward allows JavaScript
    to reduce the clutter in `Object`, perhaps even to the point where JavaScript
    can begin to deprecate the usage of certain methods like `getPrototypeOf` and
    `isExtensible`. Both these classes allow us to approach metaprogramming in JavaScript
    in an elegant fashion, and I am certain that creative developers will find extremely
    interesting use-cases to apply these to.


    Symbols allow us to sprinkle behavior onto our objects, while proxies (and reflect)
    allow us to modify behavior *around* our objects. Between symbols and proxies,
    the duality of metaprogramming is now complete. We can and should pick the right
    apparatus that best serves our use-case.


    In the next chapter we will look at a powerful feature introduced in ES8, namely
    `async` and `await`, that magically allow us to treat asynchronous code like synchronous
    code, thereby eliminating much of the syntactical overhead when using promises.


