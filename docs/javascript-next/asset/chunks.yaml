  trans: '

    # 生成器/迭代器与异步操作之间的阻抗不匹配


    ES6 为我们引入了可迭代对象、众所周知的符号 `Symbol.iterator`（它使对象可迭代），以及新的 `for-of` 循环（它知道如何迭代可迭代对象）。迭代器与其消费者之间的交互协议，恰好是一个采用
    `{ value: ..., done: ...}` 形式的对象。如果迭代器尚未 `done`，则消费者可以使用 `value`。一旦迭代器的返回值将 `done`
    设置为 `true`，迭代就会停止。


    ES6 还引入了另一个特性：生成器函数。生成器函数是可以使用 `yield`（和 `yield*`）运算符暂停的函数。它们返回恰好是可迭代的生成器对象，这意味着它们有一个响应
    `Symbol.iterator` 的方法。换句话说，我们可以使用 `for-of` 循环来遍历生成器对象。


    如果我们在同步操作的结果上进行操作，那么无论我们采用何种机制来生成或消费可迭代对象，它们都能很好地工作。但是，如果这些值恰好是异步操作的结果（或 Promise），那么事情就会变得有些棘手。请看：


    - ① 一个用于创建随机超时值的辅助函数

    - ② 返回一个 Promise，它会解析为一个值和一个索引

    - ③ 一个包含 Promise 的可迭代对象

    - ④ 我们需要等待 Promise 被解析


    ```javascript

    const randomTimeout = async (val, index) => {

    const timeout = Math.floor(Math.random() * Math.floor(42)); ①

    return new Promise(res =>

    setTimeout(res, timeout, `My value is ${val} at index: ${index}`)); ②

    };

    const promiseList = [

    randomTimeout(10, 1),

    randomTimeout(20, 2),

    randomTimeout(30, 3),

    ]; ③

    // 输出如下（你的顺序可能不同）

    // My value is 20 at index: 2

    // My value is 10 at index: 1

    // My value is 30 at index: 3

    for (const p of promiseList) {

    p.then(console.log); ④

    }

    ```


    我们从一个简单的辅助函数开始，它接受一个值（用于解析）和一个索引，这样我们就可以看到调用它的顺序。该函数实现生成一个随机超时值，并利用它返回一个最终解析为某个值的
    Promise。然后，我们使用这个辅助函数生成一个异步操作数组。


    暂时让我们忽略我们正在使用一个 Promise 数组这一事实，并假设我们处理的可迭代对象长度未知，就像使用 I/O 读取文件中的所有行一样。毕竟，如果我们有一个（固定长度的）Promise
    列表，我们可以简单地使用 `Promise.all` 让它们并发运行，并收集结果。


    考虑到这一点，请注意，虽然 `for-of` 循环成功地遍历了 Promise 列表，但我们仍然需要等待每个 Promise 被解析。然而，敏锐的观察者会注意到，这并不能满足我们的需求。虽然
    `for-of` 循环按顺序尽职尽责地返回 Promise，但它们在不同时间点解析。因此，我们看到的输出与 Promise 的初始顺序不一致。这是因为 `for-of`
    循环不知道迭代器产生的值是异步的。


    但是等等。ES8 为我们引入了 `async`/`await`。我们不能在这里使用它吗？当然可以！


    - ① 在继续循环之前，`await` 返回的 Promise


    ```javascript

    const promiseList = [

    randomTimeout(10, 1),

    randomTimeout(20, 2),

    randomTimeout(30, 3),

    ];

    (async () => {

    for (const p of promiseList) {

    const res = await p; ①

    console.log(res);

    }

    })();

    ```


    这次，我们使用 `await` 来暂停 `for-of` 循环，直到我们的 Promise 解析完成。`await` 会暂停 `for-of` 的执行，直到每个
    Promise 依次解析完成，从而给出我们期望的输出。我们付出了一点样板代码的代价，因为我们必须将对 `await` 的调用包装在一个匿名的 `async`
    函数中，但它确实有效。


    现在让我们考虑生产端。我们知道生成器函数会生成生成器对象，这些对象是可迭代的。同样，如果 `yield` 出的值是同步的，这可以完成任务。但是 `yield`
    异步数据源会产生相当令人惊讶的结果：


    - ① 定义一个生成器

    - ② `yield` Promise

    - ③ 开始消费


    ```javascript

    function* asyncGenerator() { ①

    yield randomTimeout(10, 1); ②

    console.log(''第一次'');

    yield randomTimeout(20, 2);

    console.log(''第二次'');

    }

    const generator = asyncGenerator(); ③

    // 打印 ''{ value: Promise {  }, done: false }''

    console.log(generator.next());

    // 打印 ''{ value: Promise {  }, done: false }''

    console.log(generator.next());

    // 打印 ''{ value: undefined, done: true }''

    console.log(generator.next());

    for (const i of asyncGenerator()) {

    console.log(i);

    }

    (async () => {

    for (const p of asyncGenerator()) {

    const res = await p;

    console.log(res);

    }

    })();

    ```


    我们定义了一个简单的生成器，它 `yield` 出 Promise，并尝试通过调用 `next`、使用传统的 `for-of` 循环，以及最终使用 `async`/`await`
    来获取值。注意，在每种情况下，我们都会得到预期的 `{ value: ..., done: ... }` 元组，只不过在这个例子中，`value` 恰好是一个
    Promise。


    这个例子揭示了真正的问题所在——也就是说，当迭代器将结果交给我们时，它试图告诉我们 `value` 是什么以及它是否 `done`。在这种情况下，我们看到
    `value` 恰好是一个 Promise，它可能已被解析也可能尚未被解析——然而，生成器会继续 `yield` 值，直到它完成为止！


    换句话说，虽然 `value` 的解析是异步的，但判断生成器是否 `done` 的计算*是*同步的，因此是不正确的。在 `value` 被解析（或拒绝）之前，我们**不能**将迭代器声明为
    `done`。


    这一切都雪上加霜——也就是说，迭代一个可迭代对象的全部意义在于*按顺序*获取值！


    总结一下，在消费端，我们希望 `for-of` 循环按顺序给我们期望的值，在继续下一次迭代之前暂停，等待异步数据源被解析。


    在生成端，我们希望在进行 `yield` 之前先 `await`。但可惜的是！我们只能*在* `async` 函数内部使用 `await`。


    ES9 为我们引入了一个新的符号、一个异步的 `for-of` 循环，以及 `async` 生成器的概念，使我们能够迭代和生成异步可迭代对象。让我们开始吧。

