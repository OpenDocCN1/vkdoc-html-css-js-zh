    throw new Error(''duration of song cannot be less or equal to 0 min'');

    }

    console.log(`Setter is invoked with ${inMin}`);

    this._duration = inMin * 60; ⑤

    },

    getName: function () { ⑥

    return this.name;

    },

    };

    console.assert(song.name === ''Yellow Submarine''); ⑦

    // song.duration = -1; ⑧

    song.duration = 3.00; ⑨

    console.assert(song.duration === 3); ➉

