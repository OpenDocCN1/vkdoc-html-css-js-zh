- fmt: "# WeakMaps\n\nES6 引入了另一种映射变体，即 `WeakMap`。我们不会花太多时间深入讲解 weakmap，只会重点说明它们与常规\
    \ map 的区别。\n\n第一个区别是 `WeakMap` 的键**必须**是对象；不允许使用原始值。^([(48)](#fn48))\n\n第二个区别在于\
    \ weakmap 如何持有其键。(常规) `Map` 对其键保持“强”引用。为了便于说明，假设我们有一个对象，并把它用作常规 map 中的键。如果我们在维护该对象的引用计数，那么计数就会加一。换句话说，即使对该对象的所有其他引用都丢失了，该对象也**无法**被垃圾回收，因为引用计数仍然为\
    \ 1——这个引用就是 map 所持有的那个。为了使该键及其关联值能够被垃圾回收，我们必须显式地将其从 map 中 `delete` 掉。请看下面的示例：\n\
    \n- ① 对一个对象的引用\n- ② 将该引用用作 map 中的键\n- ③ 丢弃对该对象的引用\n- ④ Map 继续持有引用\n\n```\nlet\
    \ obj = {\n  name: 'some object',\n}; ①\nconst map = new Map([\n  [obj, 'value\
    \ against an object key'], ②\n]);\nconsole.assert(map.has(obj));\nobj = null;\
    \ ③\nconsole.assert(map.size === 1); ④\n```\n\n另一方面，weakmap 对其任何键都**不**持有强引用。相反，它们“弱弱地”持有键。可以将弱引用理解为：它们太弱了，无法强制“被引用”对象留在内存中。如果所有*其他*对键的引用都丢失了，这允许作为键的对象被垃圾回收。\n\
    \n我们来分解一下。假设有一个 DOM 元素，我们希望用一个数组来关联一些额外数据。这听起来很适合用 map，对吧？于是，我们将 DOM 元素用作 map\
    \ 中的键，将关联的数组作为值。现在，每当我们想检索数据时，只需 `get` 该 DOM 元素，就大功告成了。完美。\n\n现在，某些用户交互导致该元素从\
    \ DOM 中删除，从而消除了保留该数组的必要。由于 map 持有对该 DOM 元素的（强）引用，垃圾回收器无法回收它，这就成了我们开发者的责任，必须记得从\
    \ map 中 `delete` 这个键。如果我们*万一*忘记了，那么内存泄漏就出现了！\n\n这正是使用 weakmap 的理想场景。如果改用 weakmap\
    \ 存储 DOM 与数组的键值对，当 DOM 元素被删除时，weakmap 会让垃圾回收器回收掉这个键，以及与之关联的数组。我们就不用再手动从 map 中移除引用及其关联数据了。\n\
    \nWeakmap 的 API 相当有限，原因很简单：weakmap 可能在任意时刻丢失一个键（及其关联值）。因此，任何强制 weakmap 查看所有条目的\
    \ API，例如 `size` 和任何迭代 API，都是根本不可行的。`WeakMap` 只允许 `set`、`get`、`delete` 键，以及检查 weakmap\
    \ 是否 `has` 某个键的条目。`WeakMap` 的构造函数接口与 map 类似，如果我们在构造时有可用的可迭代对象，也可以传入它来初始化 weakmap。\n\
    \n`WeakMap` 主要面向库和框架的作者。想想 jQuery 的 `data` API（它允许你将任意数据附加到任何元素），或者你想在对象外部存储关于某个对象的元数据（想象一下规范缓存），你就会找到\
    \ weakmap 的用武之地。我相信随着 ES6 的普及，我们将会看到 weakmap 的其他有趣用途。\n\n# Sets\n\n`Set` 允许我们存储唯一的值。如果我们尝试向\
    \ set 添加一个已经包含的值，该值会被拒绝。从实现角度看，set 在底层*就是* map，只不过键和值是同一个东西，即值本身。这意味着 map 的所有特性（和注意事项）也适用于\
    \ set。由于 map 和 set 如此相似，我们对 set 的探索会相当简洁。\n\n与 map 一样，set 也不提供字面量，只有构造函数。Set 的\
    \ API 很完善，允许我们像预期那样操作 set。\n\n我们从构造和值的基本操作开始：\n\n- ① 构造函数创建 set\n- ② `add` 一个值\n\
    - ③ `add` 是流式 API，返回 set 本身\n- ④ `has` 表示包含\n- ⑤ 强制重复添加……\n- ⑥ Set 保持不变\n- ⑦ 如果\
    \ `delete` 一个已有的值，set 返回 `true`\n- ⑧ 删除一个不存在的值返回 `false`\n\n```\nconst obj = {};\n\
    const set = new Set(); ①\nset.add('string'); ②\nset.add(true);\nset.add(1).add(obj);\
    \ ③\nconsole.assert(set.size === 4);\nconsole.assert(set.has(1)); ④\nset.add(1);\
    \ ⑤\nconsole.assert(set.size === 4); ⑥\nconsole.assert(set.delete('string'));\
    \ ⑦\nconsole.assert(set.has('string') === false);\nconsole.assert(set.delete({})\
    \ === false); ⑧\n```\n\n这里没有什么意外，和 map 非常相似，set 提供了一套完整的 API 来操作值，并且也具有 map 那样的流式调用能力。当然，我们必须注意，set\
    \ 没有 `get` 方法，因为对于 set 来说 `get` 等同于 `has`（因为键*就是*值）。\n\nSet 还提供了更高级的 API，允许我们整体操作\
    \ set。还有一个补充的构造函数接受可迭代对象，可迭代对象中的每个值都代表 set 中的一个值（假设没有冲突）。通过可迭代对象构造这一点暗示了：和 map\
    \ 一样，set 也会维护插入顺序（假设没有冲突），从而支持诸如 `forEach` 这样的迭代 API：\n\n- ① 使用可迭代对象创建 set 的构造函数\n\
    - ② 表示 set 值的数组\n- ③ 再次提醒，用于查询计数的属性可能有点令人困惑\n- ④ 遍历值的函数式 API\n- ⑤ 有趣的是，有一个 `keys`\
    \ API，它与 `values` 相同\n- ⑥ 以上所有方法都返回迭代器\n- ⑦ 用于清空 set 并将 `size` 设为 0 的 API\n\n\
    ```\nconst set = new Set([ ①\n  'string',\n  true,\n  1, ②\n]);\nconsole.assert(set.size\
    \ === 3); ③\nconsole.assert(set.has('string'));\nconsole.assert(set.has(true));\n\
    console.assert(set.has(1));\nset.forEach(k => console.log(k)); ④\nconsole.log(set.entries());\n\
    console.log(set.keys()); ⑤\nconsole.log(set.values()); ⑥\nset.clear(); ⑦\nconsole.assert(set.size\
    \ === 0);\n```\n\nSet 和 map 一样，表现类似于数组，其中“索引”和该索引处的值是相同的。我们可以向 set 的 `forEach`\
    \ 传递一个双参数回调来确认这一点：\n\n```\nset.forEach((k, v) => console.assert(k === v))\n```\n\
    \nSet 也提供了一个 `entries` API，表示 set 中的条目。由于 set 中的值充当键，所以这只是一个可以表示为 `[value, value]`\
    \ 的两元素数组。同样地，也存在 `keys` 和 `values` API；不过，毫不意外，`keys` API 只是 `values` 的别名。\n\n\
    由于 set 是可迭代的，因此它们也是可展开的。考虑到我们有一个接受可迭代对象的构造函数，我们就有了一种便捷的方式来从现有 set 创建新 set，或者求多个\
    \ set 的并集。\n\n- ① 两个 set 的并集\n- ② 重复项会被丢弃\n\n```\nconst colorsOne = new Set([\n\
    \  'red',\n  'blue',\n]);\nconst colorsTwo = new Set([\n  'yellow',\n  'blue',\n\
    ]);\nconst union = new Set([...colorsOne, ...colorsTwo]); ①\nconsole.assert(union.has('red'));\n\
    console.assert(union.has('blue')); ②\nconsole.assert(union.has('yellow'));\n```\n\
    \n最后，和 map 一样，相等性是通过 `===` 运算符确定的。换句话说，如果我们 `add` 一个值，该值与 set 中任何已有值进行 `===` 检查返回\
    \ `true`，那么这个值就不会被添加到 set 中。"
  raw: '## WeakMaps


    ES6 introduces another variant of maps, namely `WeakMaps`. We won’t spend too
    much time with weakmaps, except to highlight how they differ from regular maps.


    The first difference is that keys in `WeakMaps` **have** to be objects; primitives
    are **not** allowed.^([^(48)](#fn48))


    The second difference lies in how weakmaps hold on to their keys. (Regular) Maps
    maintain a “hard” reference to their keys. For expository purposes, let us assume
    we had an object, and we used that object as key in a regular map. If we were
    maintaining a reference count of the number of references to that object, we would
    have to increment it by one. In other words, even if every other reference to
    that object were lost, the object **cannot** be garbage collected because the
    reference count stands at one—the one being the one the map holds on to. In order
    to make that key and its associated value available for garbage collection, we
    have to explicitly `delete` it from the map. Consider the following:


    *   ① A reference to an object


    *   ② Use that reference as the key in a map


    *   ③ Drop the reference to the object


    *   ④ Map continues to hold the reference


    ```

    let obj = {

    name: ''some object'',

    }; ①

    const map = new Map([

    [obj, ''value against an object key''], ②

    ]);

    console.assert(map.has(obj));

    obj = null; ③

    console.assert(map.size === 1); ④

    ```


    On the other hand, weakmaps do **not** hold a hard reference to any of their keys.
    Instead, they hold on to their keys “weakly.” One way to think about weak references
    is that they are too weak to force the “reference” object to stay in memory. This
    allows for the objects that act as their keys to be garbage collected if all *other*
    references to the key are lost.


    Let us break this down. Let’s say we have a DOM element we wish to associate some
    additional data with using an array. Sounds like an ideal place for a map, right?
    So, we use the DOM element as the key in a map, and the associated array as its
    value. Now anytime we want to retrieve the data we simply `get` the DOM element
    from the map and voilà, we have what we need. Perfect.


    Now, some user interaction causes the element to be deleted from the DOM thus
    eliminating the need to hold on to the array. With the map holding a (hard) reference
    to that DOM element, the garbage collector cannot collect it, leaving it incumbent
    on us, the developers, to remember to `delete` the key from the map. If we *were*
    to forget, well there’s our memory leak!


    This is an ideal scenario for a weakmap. If instead we had used a weakmap to store
    the DOM to array key-value pair, upon deletion of the DOM element, the weakmap
    would allow the garbage collector to sweep away the key, and consequently the
    array associated with it. We are freed from having to remove the reference and
    its associated data from the map.


    The weakmap API is rather sparse, for the simple reason that the weakmap could
    lose a key (and its associated value) at any point. Thus, *any* API that forces
    the weakmap to look at all of its entries, such as `size` and any iterative APIs,
    is simply impossible. Weakmaps only allow for `set`-ing, `get`-ing, and `delete`-ing
    keys and checking to see if the weakmap `has` an entry for a key. The weakmap
    constructor interface mirrors that of maps, and can take an iterable if we have
    one handy to hydrate the weakmap at construction time.


    `WeakMap`s are primarily targeted toward library and framework authors. Think
    of jQuery’s `data` API that lets you attach arbitrary data to any element, or
    if you wish to store some metadata about an object outside of the object itself
    (think canonical caches) and you will find a use-case for weakmaps. I am certain
    that we are going to see other interesting uses of weakmaps as ES6 adoption grows.


    ## Sets


    `Set`s allow us to store unique items. If we attempt to add a value to a set that
    it already contains, then the value is simply rejected. From an implementation
    perspective, sets *are* maps under the covers, except that the key and value happen
    to be one and the same, that is, the value. This means that all of the characteristics
    (and caveats) of maps apply to sets as well. Maps and sets being so alike, our
    journey in the world of sets is going to be pretty concise.


    Like maps, sets also do not offer us a literal, rather just a constructor. The
    set API is thorough, allowing us to work with sets just as we would expect.


    We will start with construction, and working with values:


    *   ① Constructor to create a set


    *   ② `add` a value


    *   ③ `add` is a fluent API returning the map itself


    *   ④ `has` implies possession


    *   ⑤ Force a collision …


    *   ⑥ Leaving the set unchanged


    *   ⑦ If an existing value is `delete`d then the map returns true


    *   ⑧ Deletion of a nonexistent value returns false


    ```

    const obj = {};

    const set = new Set(); ①

    set.add(''string''); ②

    set.add(true);

    set.add(1).add(obj); ③

    console.assert(set.size === 4);

    console.assert(set.has(1)); ④

    set.add(1); ⑤

    console.assert(set.size === 4); ⑥

    console.assert(set.delete(''string'')); ⑦

    console.assert(set.has(''string'') === false);

    console.assert(set.delete({}) === false); ⑧

    ```


    There are no surprises here, and much like maps, sets offer us a complete API
    to work with values, providing the fluency that we have in maps as well. Of course,
    we must note the lack of a `get` which for a set is equivalent to a `has` (since
    the keys *are* the values).


    Sets also offer a higher-level API that allows us to work with the set as a whole.
    There is a complementary constructor that accepts an iterable, with each value
    in the iterable representing a value in the set (assuming no collisions). The
    construction via an iterable should be an indicator that, like maps, sets to maintain
    the order of insertion (assuming no conflicts) thereby supporting iterative APIs
    such as ‘`forEach`’:


    *   ① Constructor to create a set using an iterable


    *   ② Array representing values of the set


    *   ③ Again, slightly discombobulating property to interrogate for count


    *   ④ Functional API to iterate over values


    *   ⑤ Interestingly, there is a `keys` API that is the same as `values`


    *   ⑥ All of the above return iterators


    *   ⑦ An API to clear the map and set its `size` to zero


    ```

    const set = new Set([ ①

    ''string'',

    true,

    1, ②

    ]);

    console.assert(set.size === 3); ③

    console.assert(set.has(''string''));

    console.assert(set.has(true));

    console.assert(set.has(1));

    set.forEach(k => console.log(k)); ④

    console.log(set.entries());

    console.log(set.keys()); ⑤

    console.log(set.values()); ⑥

    set.clear(); ⑦

    console.assert(set.size === 0);

    ```


    Sets, like maps, act like arrays, where the “index” and the value at that index
    are the same. We can pass a two-argument callback to `forEach` on a set like so
    to confirm this:


    ```

    set.forEach((k, v) => console.assert(k === v))

    ```


    Sets also offer an `entries` API representing the entries in the map. Since the
    values in a set act as the keys, this is simply a two-length array that can be
    represented as `[value, value]`. Similarly there exist the `keys` and `values`
    API; however, unsurprisingly, the `keys` API is simply an alias for `values`.


    Since sets are iterable, they are also spreadable. Keeping in mind that we have
    a constructor that takes an iterable, we have a convenient way to create new sets
    from existing sets, or find the union between multiple sets.


    *   ① Union of two sets


    *   ② Duplicates are discarded


    ```

    const colorsOne = new Set([

    ''red'',

    ''blue'',

    ]);

    const colorsTwo = new Set([

    ''yellow'',

    ''blue'',

    ]);

    const union = new Set([...colorsOne,  ...colorsTwo]); ①

    console.assert(union.has(''red''));

    console.assert(union.has(''blue'')); ②

    console.assert(union.has(''yellow''));

    ```


    Finally, equality is established via the `===` operator, just like for maps. In
    other words, if we were to `add` a value that returned `true` for an `===` check
    against any existing value in the set, it simply isn’t added to the set.'
