    more enticing.


    Let us now look at some subtleties of default parameters.'
  trans: '

    # 3. 使用默认参数与剩余参数构建高效函数签名


    我们都深知函数在 JavaScript 中的广泛应用。因此，定义函数并设计函数签名是我们经常要做的事情。ES6 引入的新特性——默认参数，让我们能够改进函数签名的设计方式。它允许我们指定：如果在调用函数时未传入参数值，参数应取什么值。类似地，剩余参数让我们能够表达一个函数（或方法）不限制可提供的参数数量——换句话说，它们让我们能够显式地声明可变参数函数。


    在本章中，我们将探索默认参数和剩余参数的新语法。我们将看到如何编写函数签名，让使用者拥有极大的灵活性，同时减少我们在函数内部需要进行的错误检查。学完本章后，我们可能会感叹：以前是如何凭借现有的函数知识来工作的！


    ## 无意中用 arguments 对象掩盖了意图


    JavaScript 函数签名只包含函数名称。这与许多其他语言不同，其他语言的签名包含返回类型和参数列表。由于 JavaScript 是动态类型语言，函数不声明返回类型。然而，与我们这里讨论最相关的是：参数列表也不参与函数签名。这也是为什么我们在
    JavaScript 中没有函数重载的原因。两个同名函数（即使参数列表不同）**会**发生冲突，后定义的函数会覆盖前一个。


    此外，JavaScript 允许调用者根据意愿传入任意数量（少至零个多至任意）的参数来调用函数。这意味着，尽管函数有*形式*签名（也称为“元数”），但 JavaScript
    中*每个*函数实际上都是多元函数。我们可以通过以下方式进行验证：


    * ① 回顾：箭头函数在调用时不会创建 `arguments` 对象。这迫使我们使用函数声明。

    * ② 用零个参数调用 `sayHello`

    * ③ 用多于函数预期的参数调用 `buildUrl`

    * ④ 正确调用 `add`


    ```

    const sayHello = name => ''Hello '' + name;

    const buildUrl = (site, protocol) => protocol + ''://'' + site;

    function add( /**args*/ ) { ①

    let result = 0;

    for (const i in arguments) {

    result += arguments[i];

    }

    return result;

    }

    console.assert(sayHello.length === 1);

    console.assert(buildUrl.length === 2);

    console.assert(add.length === 0);

    // 输出 ''Hello undefined''

    console.log(sayHello()); ②

    // 输出 ''https://jsrocks.com''

    console.log(buildUrl(''jsrocks.com'', ''https'', ''非必需参数'')); ③

    // 输出 42

    console.log(add(12, 22, 8)); ④

    ```


    这里，我们定义了三个元数不同的函数。官网上，所有三个函数都通过函数对象上的 `length` 属性报告了元数。


    然而，正如所展示的，我们可以随心所欲地用任意数量（多或少）的参数调用这些函数，而输出结果显示，我们可能得到也可能得不到期望的结果。事实证明，JavaScript
    函数可以通过在参数列表中正式列出参数来声明它们期望接收的参数数量。但是，在运行时并没有检查机制来确认函数是否被传入了正确数量的参数。本质上，我们只能*假设*函数会被正确调用，或者通过在实现中安装适当的检查来做好准备，以防我们没有得到所有期望的参数。


    最后，在我们的例子中，`add` 本身就是一个试图实现多元功能的函数——也就是说，它确实可以消耗我们提供的任意数量的参数。但由于语言中没有一等的构造来将其声明为函数签名的一部分，我们只能被迫向使用者提供提示（通常通过文档或注释，如所示），告诉他们如果有需要可以传入额外的参数。


    于是，默认参数和剩余参数应运而生。


    ## 默认参数


    默认参数提供了一种机制来突显函数真正需要什么，以及一种在未提供某些参数时进行假设的方式。回想一下，JavaScript 没有任何运行时强制执行机制来确保函数被传入正确数量的参数。因此，我们开发者被迫在实现中处理缺失的参数。观察以下代码：


    * ① 通过抛出运行时错误来强制要求提供 `site`

    * ② 我们可以为 `protocol` 设置默认值


    ```

    /**

    * 构建 URL

    *

    * @param {site} 网址（必需）

    * @param {protocol} 可以是 http 或 https（可选）——默认为 http

    * @returns {string}

    */

    const buildUrl = (site, protocol) => {

    if (!site) { ①

    throw new Error(''site 是必需的'');

    }

    const p = protocol || ''http''; ②

    return p + ''://'' + site;

    };

    ```


    这里，我们尝试构建一个更健壮的 `buildUrl` 函数实现。然而，`site` 是必需的而 `protocol` 是可选的这一事实，现在被隐藏在了实现内部。文档可以作为辅助手段——但众所周知，文档通常要么不完整，最坏情况下甚至根本不存在。


    默认参数允许我们像这样表达同样的逻辑：


    ```

    const buildUrl = (site, protocol = ''http'') => {

    if (!site) {

    throw new Error(''site 是必需的'');

    }

    return protocol + ''://'' + site;

    };

    ```


    现在，`protocol` 的默认值在方法签名中被显式声明，表明了*如果*使用者决定省略它，参数会是什么值。诚然，`site` 是必需的这一事实仍然隐含未明；但函数作者未能为其找到合适的默认值，这件事本身可能已经说明了问题。


    换句话说，快速瞥一眼这个函数的签名就能发现更多信息，而以前这迫使用户去查看实现（如果可能的话）、查阅文档（如果有的话），或者通过参数组合进行“俄罗斯轮盘赌”式的猜谜，来判断哪些可行、哪些不可行。


    既然我们已经将默认参数作为语言的一等构造，像 EsDocs^(²¹) 这样的工具甚至可以解析默认参数，并在生成的文档中自动高亮显示它们。这使得使用这个特性更加诱人。


    现在让我们来看看默认参数的一些微妙之处。

    '
- fmt: "### Qualifying and Skipping Defaults\n\nWe can default parameters to be the\
    \ result of any *expression*—assignments, function calls, and even ternary expressions\
    \ are all fair game. This is particularly useful if the default value is the result\
    \ of a configuration or environment lookup:\n\n```\nconst getDefaultConn = ()\
    \ => {\n  // look up ENV config\n  // return appropriate connection\n  // as a\
    \ default assume localhost\n  return {\n    host: 'localhost',\n    user: 'me',\n\
    \    password: 'secret',\n    database: 'my_db',\n  };\n};\nconst query = (sql,\
    \ conn = getDefaultConn()) => {\n  // use connection string and sql here to query\
    \ db\n  // conn.connect();\n  // conn.query(sql);\n  // conn.close();\n  return\
    \ conn;\n};\n```\n\nOne thing that might not be obvious is that the defaulted\
    \ parameter gets its default value evaluated upon invocation of the function,\
    \ rather than when the function is actually defined. This, as we can see, lets\
    \ us *defer* the value of `conn` till we actually invoke it.\n\nAnother nuance\
    \ here is that parameters can see previous parameters declared in the function\
    \ signature, and use them when assigning their own defaults. This is particularly\
    \ useful especially when we are thinking of polymorphic implementations. Consider\
    \ the following:\n\n- ① Parameters seeing previous parameters\n- ② Supply only\
    \ one side to create a square\n- ③ Supply both sides to create a rectangle\n\n\
    ```\nconst rectangle = (x, y = x) => [x, y]; ①\n// prints '[ 2, 2 ]'\nconsole.log(rectangle(2));\
    \ ②\n// prints '[ 5, 12 ]'\nconsole.log(rectangle(5, 12)); ③\n```\n\nOf course,\
    \ we can mix and match all of these in interesting ways:\n\n```\nconst triangle\
    \ = (a, b = a, c = Math.hypot(a, b)) => [a, b, c];\n// prints '[ 6, 4, 7.211102550927979\
    \ ]'\nconsole.log(triangle(6, 4));\n// prints '[ 10, 10, 14.142135623730951 ]'\n\
    console.log(triangle(10));\n```\n\nWe must consider what triggers the use of a\
    \ default parameter. Obviously *not* passing in a parameter triggers it. In other\
    \ words, passing in “nothing” causes JavaScript to use the default value. If we\
    \ think about it, `undefined` in JavaScript is the equivalent of nothing.^([(22)](#fn22))\
    \ Thus, given a function, if we do wish to use the default value for a particular\
    \ argument, passing in `undefined` in that position *is* equivalent to “skipping”\
    \ it.\n\n### Usage Considerations\n\nJavaScript’s parser allows any combination\
    \ of default parameters. We might wish to make the default the first parameter\
    \ of a function leaving the rest to be filled in at invocation time, or alternate\
    \ between regular and defaulted parameters. While this might seem interesting,\
    \ its utility for development is rather limited:\n\n```\nconst filter = (coll\
    \ = [], predFn) => coll.filter(predFn);\n// prints '[ 30 ]'\nconsole.log(filter([10,\
    \ 20, 30], n => n > 25));\n```\n\nWe default the `coll` to be an empty array if\
    \ it is not supplied. However, a `filter` function that does not have a predicate\
    \ function to filter with is rather meaningless. Furthermore, if we wish to pass\
    \ in the absolutely necessary predicate function, we are forced to pass in the\
    \ first argument since we can’t skip arguments during function invocation. Of\
    \ course, one might argue that we could pass in `undefined` as the first argument\
    \ thus triggering the default, but that only goes to cement the point; that is,\
    \ the order of parameters in a function signature **still** matters!\n\nBy convention,\
    \ a function’s mandatory, and most “important” parameters are listed to the left,\
    \ followed by those that *may* be optional. This convention is in no way lessened\
    \ by the use of default parameters. The fact that default parameters can only\
    \ see parameters to their *left* underscores this argument.\n\nIn short, keep\
    \ required (and potentially those that *cannot* be assumed) arguments to the left,\
    \ followed by defaulted ones to the right. This helps highlight the fact that\
    \ some parameters are absolutely necessary, while allowing us to default others\
    \ based on their values at invocation time. Win–win. Following this convention\
    \ helps us make our function signatures more descriptive, reducing or even eliminating\
    \ any guesswork on the behalf of our consumers.\n\n## Rest Parameters\n\nDefault\
    \ parameters work exceptionally well if and when the function expects a fixed\
    \ number of parameters. We can choose to highlight those that are required, while\
    \ defaulting some. But what if a function wishes to express that it can accept\
    \ an indeterminate number of parameters, and that it is indeed able to use them\
    \ all? This is where rest parameters come into play."
  raw: '### Qualifying and Skipping Defaults


    We can default parameters to be the result of any *expression*—assignments, function
    calls, and even ternary expressions are all fair game. This is particularly useful
    if the default value is the result of a configuration or environment lookup:


    ```

    const getDefaultConn = () => {

    // look up ENV config

    // return appropriate connection

    // as a default assume localhost

    return {

    host: ''localhost'',

    user: ''me'',

    password: ''secret'',

    database: ''my_db'',

    };

    };

    const query = (sql, conn = getDefaultConn()) => {

    // use connection string and sql here to query db

    // conn.connect();

    // conn.query(sql);

    // conn.close();

    return conn;

    };

    ```


    One thing that might not be obvious is that the defaulted parameter gets its default
    value evaluated upon invocation of the function, rather than when the function
    is actually defined. This, as we can see, lets us *defer* the value of `conn`
    till we actually invoke it.


    Another nuance here is that parameters can see previous parameters declared in
    the function signature, and use them when assigning their own defaults. This is
    particularly useful especially when we are thinking of polymorphic implementations.
    Consider the following:


    *   ① Parameters seeing previous parameters


    *   ② Supply only one side to create a square


    *   ③ Supply both sides to create a rectangle


    ```

    const rectangle = (x, y = x) => [x, y]; ①

    // prints ''[ 2, 2 ]''

    console.log(rectangle(2)); ②

    // prints ''[ 5, 12 ]''

    console.log(rectangle(5, 12)); ③

    ```


    Of course, we can mix and match all of these in interesting ways:


    ```

    const triangle = (a, b = a, c = Math.hypot(a, b)) => [a, b, c];

    // prints ''[ 6, 4, 7.211102550927979 ]''

    console.log(triangle(6, 4));

    // prints ''[ 10, 10, 14.142135623730951 ]''

    console.log(triangle(10));

    ```


    We must consider what triggers the use of a default parameter. Obviously *not*
    passing in a parameter triggers it. In other words, passing in “nothing” causes
    JavaScript to use the default value. If we think about it, `undefined` in JavaScript
    is the equivalent of nothing.^([^(22)](#fn22)) Thus, given a function, if we do
    wish to use the default value for a particular argument, passing in `undefined`
    in that position *is* equivalent to “skipping” it.


    ### Usage Considerations


    JavaScript’s parser allows any combination of default parameters. We might wish
    to make the default the first parameter of a function leaving the rest to be filled
    in at invocation time, or alternate between regular and defaulted parameters.
    While this might seem interesting, its utility for development is rather limited:


    ```

    const filter = (coll = [], predFn) => coll.filter(predFn);

    // prints ''[ 30 ]''

    console.log(filter([10, 20, 30], n => n > 25));

    ```


    We default the `coll` to be an empty array if it is not supplied. However, a `filter`
    function that does not have a predicate function to filter with is rather meaningless.
    Furthermore, if we wish to pass in the absolutely necessary predicate function,
    we are forced to pass in the first argument since we can’t skip arguments during
    function invocation. Of course, one might argue that we could pass in `undefined`
    as the first argument thus triggering the default, but that only goes to cement
    the point; that is, the order of parameters in a function signature **still**
    matters!


    By convention, a function’s mandatory, and most “important” parameters are listed
    to the left, followed by those that *may* be optional. This convention is in no
    way lessened by the use of default parameters. The fact that default parameters
    can only see parameters to their *left* underscores this argument.


    In short, keep required (and potentially those that *cannot* be assumed) arguments
    to the left, followed by defaulted ones to the right. This helps highlight the
    fact that some parameters are absolutely necessary, while allowing us to default
    others based on their values at invocation time. Win–win. Following this convention
    helps us make our function signatures more descriptive, reducing or even eliminating
    any guesswork on the behalf of our consumers.


    ## Rest Parameters


    Default parameters work exceptionally well if and when the function expects a
    fixed number of parameters. We can choose to highlight those that are required,
    while defaulting some. But what if a function wishes to express that it can accept
    an indeterminate number of parameters, and that it is indeed able to use them
    all? This is where rest parameters come into play.'
  trans: "\n### 限定与跳过默认值\n\n我们可以将参数默认值设为任何*表达式*——赋值、函数调用，甚至三元表达式都可以。当默认值是配置或环境查找的结果时，这尤其有用：\n\
    \n```\nconst getDefaultConn = () => {\n  // 查找环境配置\n  // 返回合适的连接\n  // 默认假设为本地主机\n\
    \  return {\n    host: 'localhost',\n    user: 'me',\n    password: 'secret',\n\
    \    database: 'my_db',\n  };\n};\nconst query = (sql, conn = getDefaultConn())\
    \ => {\n  // 在此使用连接字符串和 sql 查询数据库\n  // conn.connect();\n  // conn.query(sql);\n\
    \  // conn.close();\n  return conn;\n};\n```\n\n可能不太明显的一点是，带默认值的参数是在函数被调用时求值，而不是在函数定义时求值。正如我们所看到的，这让我们可以*推迟*\
    \ `conn` 的值，直到实际调用它。\n\n另一个细微之处在于，参数可以访问函数签名中先前声明的参数，并在分配自己的默认值时使用它们。这在我们考虑多态实现时尤其有用。请看以下示例：\n\
    \n- ① 参数访问先前参数\n- ② 只提供一个边长来创建正方形\n- ③ 提供两个边长来创建矩形\n\n```\nconst rectangle = (x,\
    \ y = x) => [x, y]; ①\n// 输出 '[ 2, 2 ]'\nconsole.log(rectangle(2)); ②\n// 输出 '[\
    \ 5, 12 ]'\nconsole.log(rectangle(5, 12)); ③\n```\n\n当然，我们还可以用有趣的方式混合搭配所有这些：\n\
    \n```\nconst triangle = (a, b = a, c = Math.hypot(a, b)) => [a, b, c];\n// 输出\
    \ '[ 6, 4, 7.211102550927979 ]'\nconsole.log(triangle(6, 4));\n// 输出 '[ 10, 10,\
    \ 14.142135623730951 ]'\nconsole.log(triangle(10));\n```\n\n我们必须考虑什么会触发默认参数的使用。显然，*不*传入参数会触发它。换句话说，传入“空”会导致\
    \ JavaScript 使用默认值。仔细想想，JavaScript 中的 `undefined` 就相当于“空”。^((22)) 因此，对于给定的函数，如果我们确实希望某个参数使用默认值，那么在该位置传入\
    \ `undefined` 就相当于“跳过”它。\n\n### 使用注意事项\n\nJavaScript 的解析器允许任意组合的默认参数。我们可能希望将默认值设为函数的第一个参数，其余参数在调用时填充，或者在常规参数和带默认值的参数之间交替。虽然这看起来挺有趣，但它在开发中的实用性相当有限：\n\
    \n```\nconst filter = (coll = [], predFn) => coll.filter(predFn);\n// 输出 '[ 30\
    \ ]'\nconsole.log(filter([10, 20, 30], n => n > 25));\n```\n\n如果未提供 `coll`，我们将其默认设为空数组。然而，一个没有谓词函数进行过滤的\
    \ `filter` 函数毫无意义。此外，如果我们希望传入绝对必要的谓词函数，就必须传入第一个参数，因为我们无法在函数调用时跳过参数。当然，有人可能会争辩说，我们可以传入\
    \ `undefined` 作为第一个参数，从而触发默认值，但这恰恰证实了关键点：即函数签名中参数的顺序**仍然**很重要！\n\n按照惯例，函数的必填参数和“最重要”的参数放在左侧，其次是那些*可能*可选的参数。这一惯例并不会因为默认参数的使用而削弱。默认参数只能访问其*左侧*的参数这一事实更强调了这一点。\n\
    \n简而言之，将必要参数（以及那些*无法*假设的参数）放在左侧，带默认值的参数放在右侧。这有助于突出某些参数是绝对必要的，同时允许我们根据调用时的值为其他参数设置默认值。双赢。遵循这一惯例可以帮助我们让函数签名更具描述性，减少甚至消除使用者的猜测。\n\
    \n## 剩余参数\n\n当函数期望接收固定数量的参数时，默认参数的效果非常出色。我们可以选择突出哪些是必需的，同时为其他参数设置默认值。但如果一个函数想要表达它可以接受不定数量的参数，并且确实能够使用所有参数呢？这时剩余参数就派上用场了。\n"
- fmt: '### The Argument Against `arguments`


    JavaScript has always had the `arguments` object available within the invocation
    context to account for "extra" arguments. Let us revisit our earlier example that
    `add`s all of the arguments supplied to it:


    ```

    function add( /**args*/ ) {

    let result = 0;

    for (const i in arguments) {

    result += arguments[i];

    }

    return result;

    }

    // prints ''20''

    console.log(add(2, 3, 5, 10));

    ```


    This function expects `n` arguments, and it consumes all of them to return a result.
    Does it accomplish what we set out to do? Absolutely. However, in order to express
    that the function is indeed multi-arity, we must resort to using a comment block,
    thus hiding this fact in its implementation.


    There remain two more palpable drawbacks to using `arguments`. While `arguments`
    respond to the `length` property, and allow us to use the subscript (`[]`) operator
    to reach a specific argument that was supplied, it just so happens that the `arguments`
    object is not really an array! If we wish to manipulate the supplied arguments,
    for example, `sort` or `filter` them, we have no choice but to coerce `arguments`
    into an array.


    The second issue is that the `arguments` object includes *all* arguments supplied
    to the function. If the desire is to treat some parameters differently than others,
    we are required to separate those from everything else.


    We can see both these deficiencies highlighted in a simple example that attempts
    to simulate the boarding of a plane. The plane in our example has a pilot, a crew
    member, and n-number of passengers. However, we must be sure to treat our most
    loyal customers first, so we must board them first. Every passenger has a `status`,
    and those with higher status should be invited to board *before* those with other
    statuses. Let us start by writing a simple comparator function that compares two
    passengers using their statuses, like so:


    ```

    const byStatus = (a, b) => {

    let ret;

    if (a.status === ''platinum'' && b.status !== ''platinum'') {

    ret = -1;

    } else if (a.status === ''platinum'' && b.status === ''platinum'') {

    ret = 0;

    } else if (a.status !== ''platinum'' && b.status === ''platinum'') {

    ret = 1;

    }

    return ret;

    };

    ```


    With the comparator function out of the way, we can write our plane boarding algorithm.
    Notice that we represent our plane as an array, first `push`-ing the pilot, who
    boards first, followed by the crew member, followed by the passengers sorted by
    their individual status:


    *   ① Pilot boards first

    *   ② Followed by the crew member

    *   ③ Coerce `arguments` to an array

    *   ④ Discard the first two items since they are already accounted for

    *   ⑤ Sort the remaining items in the array using a custom sort function


    ```

    function boardPlane(pilot, crewMember /** , passengers */ ) {

    const plane = [];

    plane.push(pilot); ①

    plane.push(crewMember); ②

    const toArr = Array.prototype.slice.call(arguments); ③

    const passengers = toArr.slice(2, toArr.length); ④

    plane.push(passengers.sort(byStatus)); ⑤

    return plane;

    }

    const passengerOne = {

    name: ''James'',

    status: ''silver'',

    };

    const passengerTwo = {

    name: ''Joseph'',

    status: ''platinum'',

    };

    // invoke it

    const plane = boardPlane(''Amelia'', ''Rosemary'', passengerOne, passengerTwo);

    console.assert(Array.isArray(plane));

    // verify pilots and crew board first

    console.assert(plane[0] === ''Amelia'');

    console.assert(plane[1] === ''Rosemary'');

    // verify that passengers board by status

    console.assert(Array.isArray(plane[2]));

    console.assert(plane[2][0] === passengerTwo);

    console.assert(plane[2][1] === passengerOne);

    ```


    This works; however, it feels clumsy. All of the drawbacks we have discussed so
    far rear their ugly heads. First, we have to coerce the `arguments` object into
    an array so we can eventually `sort` the passengers. Second, the `arguments` object
    includes all of the arguments supplied to `boardPlane`, so in order to get to
    the passengers, we are forced to drop the first two (namely the pilot and the
    crew member) since they have already been accounted for. The `arguments` object
    does not account for arguments that already have placeholders provided via function
    parameter names, shifting the onus to the developer to discern between the arguments
    that have already been captured, and those that represent the "rest" of the arguments.


    Alas! If only there was a way to auto-box all "unaccounted for" arguments into
    an array …


    ### The New `...` Syntax


    Rest parameters use a new syntax, namely `...argName` in the parameter list. This
    parameter will collect any arguments supplied in the function invocation that
    are **not already** accounted for, and wrap them in an `Array` object.


