  trans: '

    # 使用模块进行命名空间管理


    JavaScript 对“打包”或命名空间的回应可以相当简洁地概括——它根本不存在。这是从语言设计之初起最明显的缺失之一，并导致了各种模块化代码的尝试。这些尝试从自制的解决方案到像
    AMD 这样的完整规范。^(⁷¹)


    ES6 对这个问题的回应是模块。在本章中，我们将学习如何使用 ES6 提供的新支持来创建和使用模块。我们将准备好摒弃像 IEFE 这样的临时解决方案，并准备好拥抱一种一致的、与平台无关的机制，将我们的代码封装成可重用的模块并命名空间化。到本章结束时，我们不仅将对模块的微妙语法有全面的理解，还能随时在我们的代码库中与任何第三方库一起使用它。


    ## JavaScript 中命名空间的缺失


    在 JavaScript 中，只有一个且唯一的环境，即全局作用域。我们所做的任何事情，例如声明变量或定义函数，最终都会进入这个全局作用域，从而对所有内容可见。再加上
    JavaScript 是动态类型的，因此如果两个“事物”同名，即使它们不是同一类型（变量 vs. 函数），也会发生冲突，最后被求值的那一个会胜出。


    恰好只有一个构造可以引入作用域，那就是函数。^(⁷²) 我们开发者迅速抓住了这个想法，将其用作在我们的代码和全局作用域之间创建缓冲区的机制，几乎所有关于创建模块的想法都利用了这一点。


    我们在之前的章节中已经讨论过 IEFE 的概念，但为了唤起记忆，这里是我们之前的永久记忆示例：


    - ① 通过创建一个匿名函数来引入人工块

    - ② 这个 `var` 将被限定在声明的函数作用域内

    - ③ 通过 `return` 一个对象来暴露公共 API

    - ④ 这将导致一个 `ReferenceError`

    - ⑤ 你可以使用公共 API

    - ⑥ 调用公共 getter


    ```

    const counter = (function createCounter() { ①

    var steps = 0; ②

    function increment() {

    steps++;

    }

    function getCount() {

    return steps;

    }

    return {

    increment,

    getCount,

    }; ③

    }());

    // 使用它

    // console.log(steps); ④

    counter.increment(); ⑤

    console.assert(counter.getCount() === 1); ⑥

    ```


    IEFE 与揭示模块模式一起，正好提供了我们所需的机制——一种声明“私有”成员的方法，同时允许我们向外部世界暴露 API。这是开源生态系统中大多数库采用的方法。然而，虽然这似乎解决了*生产*封装构造的问题，但它对解决消费它的问题几乎没有任何帮助。


    以 jQuery 为例。jQuery 将其所有功能封装在一个 IEFE 中，并向全局作用域暴露了一个对象，即 `$`。在我们的应用程序代码中，如果我们想使用
    `$`，我们应该怎么做呢？嗯，我们必须确保 jQuery 库*首先*被加载，这会将 `$` 引入全局作用域，然后我们才能愉快地在代码库中使用它。


    这就是说，库的加载顺序很重要！如果我们重新排列库的顺序，这个纸牌屋就会倒塌。


    这里的核心问题是我们使用全局作用域来共享代码，这使得代码库不同部分之间的相互依赖关系变得*隐式*，而不是显式。更不用说，如果两个或多个“导出的”变量同名，我们很容易发生冲突。当加载了许多迷你库，并且它们之间存在相互依赖关系时，这个问题会进一步加剧——试图确定加载顺序，同时避免冲突，很快就变成了一场俄罗斯轮盘赌。


    总结一下，IEFE 和揭示模块模式可以帮助封装，但它们不对所提供的内容进行命名空间化，将避免冲突的责任留给了使用者。另一方面，消费这些库需要精心地按正确顺序加载库，因为唯一的共享上下文是全局作用域。


    在我们探讨这个问题的解决方案之前，我们必须考虑 JavaScript 的另一个方面，那就是 JavaScript 不再仅仅是一种客户端语言。开发者们已经利用
    Node 等技术在服务器上拥抱了 JavaScript，^(⁷³) 与客户端脚本相比，它有一套完全不同的参数。


    考虑一下 JavaScript 在浏览器中是如何加载的。这是通过 `script` 标签完成的，这要求浏览器从服务器请求一个资源。不用说，我们不想同步执行此操作，因为它会阻塞主线程，所以这种加载通常是异步完成的。将此与服务器端编程对比。当代码库的某一部分“require”另一部分时，该脚本可以同步加载，因为它就位于那里——磁盘上，无论是在同一个项目中，还是在
    `node_modules` 文件夹中。


    同样，这里的问题是按正确顺序加载我们需要的库，并使它们的公共成员可供我们使用，而不会产生冲突的风险。*如何*解决这些依赖关系是另一个问题。在接下来的章节中，我们将讨论
    ES6 如何处理模块的声明和使用。然而，在开始之前，让我们看看如何运行本章中的代码片段。

    '
- fmt: '# How to Run Modularized JavaScript


    The easiest way to run the code samples in this chapter is to use `Node`.^([^(74)](#fn74))
    `Node`, at the time of this writing, is at version 12+, and supports ES6 modules
    behind an experimental flag.


    First, ensure that you either have `Node` installed, or are running a relatively
    recent version of `Node`. Of course, if you already have a version of `Node` running
    on your machine that you want to keep around, you can use either “Node Version
    Manager”^([^(75)](#fn75)) or “`nvm`-windows”^([^(76)](#fn76)) to install and maintain
    multiple versions of `Node` simultaneously. Once installed, open a command prompt
    and type the following:


    ```

    node --version

    # on my machine I see ''v12.4.0''

    ```


    If you see a valid response, then you have `Node` installed correctly.


    In order to load and run ES6 modules in `Node`, there are two requirements:


    * `Node` must be invoked with the `--experimental-modules` flag.


    * Any source file that is to be treated as an ES6 module should have the file
    extension `.mjs` (versus being just `.js`).


    Let us consider a simple example to make things clearer. `cd` to a scratch directory,
    and create a new file with the name `exporter.mjs` with the following contents:


    ```

    // file name must end in "mjs" — like exporter.mjs

    export const sayHello = name => `Hello ${name}!!`

    ```


    Now create another file, in the same directory, and name it `importer.mjs` and
    include the following:


    * ① Import members from `exporter`


    ```

    import { sayHello } from ''./exporter.mjs''; ①

    // prints ''Hello ES6 Modules!!''

    console.log(sayHello("ES6 Modules"));

    ```


    Be sure to save both files, then in the console type the following:


    ```

    node --experimental-modules importer.mjs

    ```


    You should see `Hello ES6 Modules!!`.^([^(77)](#fn77))


    In our setup, `exporter.mjs` “exports” certain members, and `importer.mjs` uses
    said members within itself. As you play along with the examples in this chapter,
    you may name your files any which way, as long as the file has the `.mjs` file
    extension and you are using `Node`’s experimental support for ES6 modules. The
    `.mjs` file extension is unique to `Node`, which by default supports CommonJS.
    However, ES6 module files are no different than regular JavaScript files, except
    that they declare a module, and hence *should* have the `.js` extension. Correspondingly,
    the snippets in this chapter will reference any and all files using the `.js`
    extension—simply replace those with `.mjs` in your workspace.


    Let’s talk modules!


    ## Declaring Modules


    A module in ES6 is simply a collection of related variables, constants, functions,
    and classes. Modules allow us to split up our codebase into smaller, self-contained
    pieces of functionality, which can then be consumed by other parts of our codebase,
    or even published to be consumed by other applications. A module allows us to
    “tuck” functionality in a namespace, thereby eliminating naming conflicts.


    Modules in ES6 are encompassed in files, wherein there is a one-to-one relationship
    between a file and a module. The name of the module is the (absolute or relative)
    path to the file itself. Modules operate under `strict mode` by default, which
    we have discussed briefly in Chapter [1](#481812_1_En_1_Chapter.xhtml). All members
    of a module are implicitly “private”—that is, they are not visible to anyone using
    this module unless they are explicitly `export`-ed. Consider the following:


    * ① Explicitly `export`-ing members


    * ② These are private to the module


    * ③ `export` an object wrapping all public members circa revealing module pattern


    ```

    export const degreesToRadians = d => d * (Math.PI / 180); ①

    export const gradiansToRadians = g => g * 15.707 * Math.pow(10, -3);

    const calc = (fn, x, unit) => { ②

    switch (unit) {

    case ''degrees'':

    return fn.call(null, degreesToRadians(x));

    case ''gradians'':

    return fn.call(null, gradiansToRadians(x));

    default:

    return fn.call(null, x);

    }

    };

    export const sin = (x, unit = ''degrees'') => calc(Math.sin, x, unit);

    export const cos = (x, unit = ''degrees'') => calc(Math.cos, x, unit);

    export const tan = (x, unit = ''degrees'') => calc(Math.tan, x, unit);

    export const trig = { ③

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    ```


    Here we declare a bunch of trigonometry functions, exporting those we deem our
    public API, and leaving the rest to be private. Note that we also `export` an
    object that holds all the public members as properties, much like we did using
    the revealing module pattern. This is a useful technique that gives our consumers
    a choice—they can pick and choose the specific functionality that they are interested
    in, or use the wholly exported object and have everything tucked underneath that
    object available to them. These exported members, also referred to as “named”
    exports, will be visible to anyone using this module.


    `export`-ing individual members may prove to be verbose, and perhaps obfuscates
    what the public API actually is. An alternative syntax is offered that can help
    with this:


    * ① Define all of our members


    * ② Use the alternative export syntax


    ```

    const degreesToRadians = d => d * (Math.PI / 180); ①

    const gradiansToRadians = g => g * 15.707 * Math.pow(10, -3);

    const calc = (fn, x, unit) => {

    switch (unit) {

    case ''degrees'':

    return fn.call(null, degreesToRadians(x));

    case ''gradians'':

    return fn.call(null, gradiansToRadians(x));

    default:

    return fn.call(null, x);

    }

    };

    const sin = (x, unit = ''degrees'') => calc(Math.sin, x, unit);

    const cos = (x, unit = ''degrees'') => calc(Math.cos, x, unit);

    const tan = (x, unit = ''degrees'') => calc(Math.tan, x, unit);

    const trig = {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    export { ②

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    trig,

    };

    ```


    Rather than explicitly exporting each member explicitly as we did earlier, we
    export all public members in one fell swoop. This can help make the public API
    much more explicit—however, while the public API certainly becomes obvious, maintaining
    the module becomes just a tad more tedious, as one must align disparate parts
    of the file while ascertaining what is public, and what isn’t.'
