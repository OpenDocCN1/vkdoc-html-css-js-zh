  raw: '## Modeling Using Classes


    ES6 introduces us to the `class` keyword, allowing us to express types in a manner
    that finds parity with other languages. Let us start with simply defining the
    `Person` class , and then we will see how inheritance works following that:


    *   ① Use the newly activated `class` keyword


    *   ② Define a constructor for our type


    *   ③ Define an instance method


    *   ④ And then another


    ```

    class Person { ①

    constructor(name) { ②

    this.name = name;

    }

    getName() { ③

    return this.name;

    }

    sayHello(to) { ④

    return `Hello ${to.getName()}. My name is ${this.name}.`;

    }

    }

    const raju = new Person(''Raju'');

    const venkat = new Person(''Venkat'');

    // prints ''Hello Venkat. My name is Raju''

    console.log(raju.sayHello(venkat));

    ```


    Right off the bat, a sigh of relief!^([^(70)](#fn70))


    We introduce a “class” `Person`, with a single-argument constructor. JavaScript
    requires that if we do *need* a constructor, it must be called `constructor` and
    we are only allowed to have one constructor per class. However, if our class does
    not do any work at construction time, then we do not have to write a constructor,
    and in that case JavaScript will provide us with a default no-argument constructor.


    We can also tack on functions to the class like regular methods. JavaScript classes
    **cannot** have member variables—if we wish to tack on a property on the instance,
    we must use `this` inside the constructor or any instance method.


    Also, all methods in a class, `constructor` included, benefit from many of the
    features that we have explored—default parameters, destructuring, and spread arguments
    are all fair game. Using one or more of these features in unison is how we would
    accomplish overloaded methods for our instances.


    As our demonstration shows, the behavior is exactly like we had it working with
    functions. Onto inheritance!


    As we attempted earlier, we want `SuperHero` to inherit from `Person`. Let us
    see how we can accomplish this using the new syntax:


    *   ① Use the `extends` keyword


    *   ② Define the constructor


    *   ③ Ensure `super` is invoked


    *   ④ Define a `SuperHero` instance method


    ```

    class SuperHero extends Person { ①

    constructor(name, superpower) { ②

    super(name); ③

    this.superpower = superpower;

    }

    warCry() { ④

    return `My name is ${this.name}!!!`;

    }

    }

    const thor = new SuperHero(''Thor'', ''Mjolnir'');

    // prints ''My name is Thor!!!''

    console.log(thor.warCry());

    // prints ''Hello Venkat. My name is Thor''

    console.log(thor.sayHello(venkat));

    ```


    In order to extend another class, we simply use the `extends` keyword, wherein
    we tell what type we wish to extend. The **first** thing we are **required** to
    do in the subtype is to invoke `super` with all of the arguments the parent needs.
    The rest should be no surprise. Once again, we see that the behavior is no different
    than what we saw in our function-based implementation.


    Classes are allowed to have instance methods like we have seen. They are also
    allowed to both instance-level and class-level (`static`) attributes, as well
    as `static` methods. However, attributes cannot be introduced inside the class
    body, and this includes `static` ones. If we wish to do so, we are forced to define
    them *outside* the class body.


    A static method on the other hand is defined like an instance method except it
    is prefixed with the `static` keyword. Such methods can only be accessed on the
    type, via `Classname.staticMethod()`. Let us look at an example where we keep
    track of, and report on the number of superheroes we have constructed:


    *   ① Increment the static counter each time the constructor is invoked


    *   ② Define a static method that returns the count of superheroes


    *   ③ Define an attribute to keep count


    *   ④ Invoke the static method


    ```

    class SuperHero extends Person {

    constructor(name, superpower) {

    super(name);

    this.superpower = superpower;

    SuperHero.internalCount += 1; ①

    }

    static count() { ②

    return SuperHero.internalCount;

    }

    }

    SuperHero.internalCount = 0; ③

    const thor = new SuperHero(''Thor'', ''Mjolnir'');

    const blackWidow = new SuperHero(''Black Widow'', ''weapons specialist'');

    // prints ''We have 2 superheroes!''

    console.log(`We have ${SuperHero.count()} superheroes!`); ④

    ```


    We can reference any static attribute or method by calling them using the class
    name. However, we have to declare (and in this case initialize) the static property
    outside the definition of our class. This qualification is also applicable to
    nonstatic, or instance-level attributes.


    Finally, JavaScript does **not** support modifiers, such as `private` or `public`.
    All attributes and methods defined on a class are public. This again is a departure
    from traditional languages like Java or C#.


    Despite these limitations, I believe we can start to appreciate how this syntax
    drastically reduces the amount of wiring we have to do by hand, thus reducing
    any subtle bugs we might introduce when building our own inheritance trees. Admittedly,
    it feels rather declarative, vs. the imperative modus operandi we adopted when
    using functions.


    Furthermore, to folks coming in from other (class-based) languages, this syntax
    is very familiar, and thus feels very empowering. This syntax, already in use
    by frameworks like Angular and libraries like React, makes it far easier for designers
    to allow mechanisms that allow client code to hook into the life cycle offered
    by the same.


    ## Caveats


    If the amount of time and effort it takes to explain prototypal inheritance in
    JavaScript using functions is any measure, then the new syntax wins hands down.
    Discussing the new syntax almost seems natural, as compared to the extremely intricate
    and delicate wiring using the old syntax, while accomplishing exactly the same
    thing.


    That said, we are not out of the woods yet. JavaScript has and will continue using
    prototypal inheritance. The new syntax that ES6 offers is simply syntactic sugar
    on top of the old! Hence the slightly negative news—we, as JavaScript developers,
    **must** realize this, and take it upon ourselves to truly understand how prototypal
    inheritance works under the covers. There is **no** escaping this, and, as JavaScript
    developers, it behooves us to know how the language really works.


    ## Summary


    JavaScript has always supported the idea of types, as well as inheritance, albeit
    in a manner that was cumbersome, and one that necessitated an intimate understanding
    of how (constructor) functions, prototypes, and instances interplayed with one
    another to make all the magic happen. In this chapter we learned how we can use
    the new keywords like `class` and `extends` to clearly elucidate what our instances
    are to look like. We also shined a spotlight on the fact that under the covers
    this new syntax simply sugars prototypal inheritance, and the pitfalls of always
    thinking in “object oriented” mode, when perhaps thinking functionally might serve
    us better.


    In the next chapter we will focus on modules that attempt to fill a much-needed
    gap in JavaScript, namely modules, once and for all doing away with all the schemes
    we have drummed up to “namespace” our code.


    Footnotes [1](#481812_1_En_11_Chapter.xhtml#Fn1_source)   [2](#481812_1_En_11_Chapter.xhtml#Fn2_source)
      [3](#481812_1_En_11_Chapter.xhtml#Fn3_source)   [4](#481812_1_En_11_Chapter.xhtml#Fn4_source)
      [5](#481812_1_En_11_Chapter.xhtml#Fn5_source)'
  trans: '

    # 使用类进行建模


    ES6 为我们引入了 `class` 关键字，让我们能够以一种与其他语言对等的方式来表达类型。我们先从简单定义 `Person` 类开始，然后看看继承是如何工作的：


    * ① 使用新激活的 `class` 关键字

    * ② 为我们的类型定义一个构造函数

    * ③ 定义一个实例方法

    * ④ 然后再定义另一个


    ```

    class Person { ①

    constructor(name) { ②

    this.name = name;

    }

    getName() { ③

    return this.name;

    }

    sayHello(to) { ④

    return `Hello ${to.getName()}. My name is ${this.name}.`;

    }

    }

    const raju = new Person(''Raju'');

    const venkat = new Person(''Venkat'');

    // 输出 ''Hello Venkat. My name is Raju''

    console.log(raju.sayHello(venkat));

    ```


    瞬间让人松了一口气！^(⁷⁰)


    我们引入了一个“类” `Person`，它拥有一个带单个参数的构造函数。JavaScript 要求，如果*需要*构造函数，那么它必须命名为 `constructor`，并且每个类只允许有一个构造函数。然而，如果我们的类在构造时不需要做任何工作，那么就不必编写构造函数，在这种情况下，JavaScript
    会为我们提供一个默认的无参构造函数。


    我们还可以像添加常规方法一样，将函数附加到类上。JavaScript 类**不能**拥有成员变量——如果我们希望在实例上添加属性，必须在构造函数或任何实例方法内部使用
    `this`。


    另外，类中的所有方法（包括 `constructor`）都能受益于我们之前探讨过的许多特性——默认参数、解构和展开参数都是可以使用的。组合使用这些特性中的一个或多个，我们就能为实例实现方法重载的效果。


    正如我们演示的那样，其行为与我们在使用函数时完全一致。接下来谈谈继承！


    正如我们之前尝试的那样，我们希望 `SuperHero` 继承自 `Person`。让我们看看如何使用新语法来实现这一点：


    * ① 使用 `extends` 关键字

    * ② 定义构造函数

    * ③ 确保调用了 `super`

    * ④ 定义一个 `SuperHero` 实例方法


    ```

    class SuperHero extends Person { ①

    constructor(name, superpower) { ②

    super(name); ③

    this.superpower = superpower;

    }

    warCry() { ④

    return `My name is ${this.name}!!!`;

    }

    }

    const thor = new SuperHero(''Thor'', ''Mjolnir'');

    // 输出 ''My name is Thor!!!''

    console.log(thor.warCry());

    // 输出 ''Hello Venkat. My name is Thor''

    console.log(thor.sayHello(venkat));

    ```


    为了扩展另一个类，我们只需使用 `extends` 关键字，在其中指明我们希望扩展的类型。在子类型中，我们**必须**做的**第一件事**就是用父类需要的所有参数来调用
    `super`。其余部分应该不会让人感到意外。我们再次看到，其行为与我们基于函数的实现没有区别。


    类可以拥有像我们看到的实例方法。它们也可以拥有实例级和类级（`static`）属性，以及 `static` 方法。然而，属性不能在类主体内部引入，这包括 `static`
    属性。如果希望这样做，我们就必须在类主体*外部*定义它们。


    另一方面，静态方法的定义方式与实例方法类似，只是前面要加上 `static` 关键字。这类方法只能通过 `Classname.staticMethod()`
    在类型上访问。让我们看一个示例，其中我们将跟踪并报告已经构建了多少个超级英雄：


    * ① 每次调用构造函数时，将静态计数器加 1

    * ② 定义一个返回超级英雄数量的静态方法

    * ③ 定义一个用于计数的属性

    * ④ 调用静态方法


    ```

    class SuperHero extends Person {

    constructor(name, superpower) {

    super(name);

    this.superpower = superpower;

    SuperHero.internalCount += 1; ①

    }

    static count() { ②

    return SuperHero.internalCount;

    }

    }

    SuperHero.internalCount = 0; ③

    const thor = new SuperHero(''Thor'', ''Mjolnir'');

    const blackWidow = new SuperHero(''Black Widow'', ''weapons specialist'');

    // 输出 ''We have 2 superheroes!''

    console.log(`We have ${SuperHero.count()} superheroes!`); ④

    ```


    我们可以通过使用类名来引用任何静态属性或方法。然而，我们必须在类定义之外声明（并在此示例中初始化）静态属性。这一限制同样适用于非静态的或实例级的属性。


    最后，JavaScript **不**支持访问修饰符，比如 `private` 或 `public`。在类上定义的所有属性和方法都是公有的。这再次与 Java
    或 C# 等传统语言有所不同。


    尽管存在这些限制，我相信我们可以开始体会到这种语法如何大幅减少了我们必须手动编写的胶水代码，从而降低了在构建自己的继承体系时可能引入的微妙错误。不可否认，它给人一种声明式的感觉，而非我们使用函数时采用的那种命令式操作方式。


    此外，对于来自其他（基于类的）语言的开发者来说，这种语法非常熟悉，因此让人感觉非常强大。这种语法已经被 Angular 等框架和 React 等库所采用，它让设计者能够更轻松地提供机制，允许客户端代码接入框架相应的生命周期。


    ## 注意事项


    如果衡量标准是用函数在 JavaScript 中解释原型继承所需的时间和精力，那么新语法无疑胜出。与使用旧语法那种极其复杂和微妙的接线方式相比，讨论新语法几乎显得自然而然，尽管它们实现的是完全相同的事情。


    话虽如此，我们还没有脱离困境。JavaScript 过去和将来都会继续使用原型继承。ES6 提供的新语法只是旧语法之上的语法糖！因此，稍微有点负面的消息是——作为
    JavaScript 开发者，我们**必须**意识到这一点，并且要主动真正理解原型继承在底层是如何工作的。这是**无法回避的**，并且，作为 JavaScript
    开发者，我们理应了解这门语言实际的工作原理。


    ## 总结


    JavaScript 一直支持类型和继承的概念，尽管其方式有些繁琐，并且需要深入理解（构造）函数、原型和实例之间如何相互作用来让一切神奇地发生。在本章中，我们学习了如何使用像
    `class` 和 `extends` 这样的新关键字来清晰地阐明我们的实例应该是什么样子。我们还着重强调了这样一个事实：在底层，这种新语法仅仅是原型继承的语法糖，以及总是以“面向对象”模式思考可能带来的陷阱，而有时函数式思考可能对我们更有利。


    在下一章中，我们将重点介绍模块，它试图填补 JavaScript 中的一个迫切需求，即模块，一劳永逸地替代我们为代码“命名空间”而想出的所有方案。


    脚注 1   2   3   4   5

    '
- fmt: '# Namespacing Code Using Modules


    JavaScript’s answer to “packaging” or namespacing can be expressed rather succinctly—it
    was nonexistent. This has been one of the most glaring omissions in the language
    design since the beginning, and has led to a variety of attempts at modularizing
    code. These ranged from homegrown solutions to full-blown specifications like
    AMD.^([^(71)](#fn71))


    ES6’s answer to this problem is modules. In this chapter we will learn how to
    create and consume modules using the new support for the same provided in ES6.
    We will be ready to do away with hacky solutions like IEFEs, and be ready to embrace
    a consistent, platform agnostic mechanism to encapsulate and namespace our code
    into reusable modules. By the end of this chapter, not only will we have a comprehensive
    understanding of the nuanced syntax for modules, but also be ready to use the
    same with any third-party libraries in our codebase.


    ## The Lack of Namespacing in JavaScript


    In JavaScript, there exists one and only one environment, namely the global scope.
    Anything we do, such as declaring variables or defining functions, ends up in
    this global scope, and thus visible to all. Add to this the fact that JavaScript
    is dynamically typed, so if two “things” were to be named the same, even if they
    were not the same type (variable vs. function), there would be a collision, with
    the one that was evaluated last winning.


    There happens to be only one construct that introduces scope, namely functions.^([^(72)](#fn72))
    We, the developers, quickly latched on to this idea as a mechanism to create a
    buffer between our code and the global scope, and pretty much every idea around
    creating modules leverages this idea.


    We have discussed the idea of IEFEs in an earlier chapter, but to jog our memory
    here is our previous example for posterity:


    - ① Introduce artificial block by creating an anonymous function

    - ② This `var` will be scoped within the declared function

    - ③ Expose a public API by `return`-ing an object

    - ④ This will result in a `ReferenceError`

    - ⑤ You can use the public API

    - ⑥ Invoke the public getter


    ```

    const counter = (function createCounter() { ①

    var steps = 0; ②

    function increment() {

    steps++;

    }

    function getCount() {

    return steps;

    }

    return {

    increment,

    getCount,

    }; ③

    }());

    // use it

    // console.log(steps); ④

    counter.increment(); ⑤

    console.assert(counter.getCount() === 1); ⑥

    ```


    IEFEs, alongside the revealing module pattern, give us exactly what we need—a
    mechanism to declare “private” members while allowing us to expose an API to the
    outside world. This is the approach most libraries in the open source ecosystem
    use. However, while this seems to have solved the problem of *producing* an encapsulated
    construct, it does little to alleviate the problem of consuming it.


    Consider jQuery as an example. jQuery wrapped all of its functionality in an IEFE,
    and exposed an object to global scope, namely `$`. In our application code, if
    we wish to use `$`, how do we go about doing it? Well, we have to ensure that
    the jQuery library is loaded *first*, which would introduce `$` to the global
    scope, and then we could go about merrily using the same in our codebase.


    This is to say, the order of loading libraries matter! If we were to reorder the
    library list, the house of cards come tumbling down.


    The core issue here is that we are using the global scope to share code, making
    interdependencies between different pieces of the codebase *implicit*, rather
    than explicit. Not to mention, we can just as easily have a collision if two or
    more “exported” variables have the same name. This problem is further exaggerated
    when there are lots of mini-libraries being loaded, with interdependencies between
    all of them—trying to ascertain the order of loading, while avoiding collisions
    quickly becomes a case of Russian roulette.


    Summarizing, IEFEs and the revealing module pattern can help with encapsulation,
    but they don’t namespace what it is they are providing, leaving it to consumers
    to ensure that there are no collisions. On the other hand, consuming these libraries
    involves meticulously loading libraries in the right order, since the only shared
    context is the global scope.


    Before we go about exploring a solution to this problem, we must consider another
    facet of JavaScript, that is, JavaScript is no longer just a client-side language.
    Developers have embraced JavaScript on the server using technologies like Node,^([^(73)](#fn73))
    which has a completely different set of parameters as compared to client-side
    scripting.


    Consider how JavaScript is loaded in the browser. This is done using `script`
    tags, which require that the browser request a resource from the server. Needless
    to say, we would not want to do this synchronously, since it would block the main
    thread, so this loading is typically done asynchronously. Contrast this with server-side
    programming. When one piece of the codebase “require”-s another, that script can
    be loaded synchronously, since it resides right there—on disk, be that in the
    same project, or in the `node_modules` folder.


    Again, the problem here is loading the libraries we need, in the right order,
    and making their public members available to us, without the risk of collisions.
    *How* these dependencies get resolved is a separate question. In the following
    sections we will discuss how ES6 tackles module declaration and usage. However,
    before we begin, let us see how we can run the code snippets in this chapter.'
