    # 如何使用本书


    本书中的示例遵循两大原则：短小精悍，且基于已学内容构建。在这方面，我相信我（基本）做到了。你可以在我们的在线代码仓库中找到本书所有示例，地址是 [`https://github.com/Apress/javascript-next`](https://github.com/Apress/javascript-next)。欢迎克隆或下载该仓库，然后按照其中的
    README 文件中的使用说明操作。


    或者，最简单的办法就是直接使用你的浏览器控制台。大多数现代浏览器，如 Chrome ^(⁶) 和 Firefox ^(⁷)，都自带控制台。^(⁸) 你可以直接将本书中的示例复制粘贴到控制台中，随心所欲地进行实验。


    就我个人而言，我更喜欢在文本编辑器中做实验。如果你和我一样，更习惯使用熟悉的工具，那么你需要安装 Node.js。按照 Node.js 官方网站 ^(⁹)
    上的说明进行安装。如果你已经安装了 Node，但又不想引入版本冲突，可以了解一下“Node Version Manager” ^(¹⁰) 或“nvm-windows”
    ^(¹¹)，它们允许你同时安装多个版本的 Node。


    安装好 Node 后，在电脑上任意位置创建一个临时目录并进入该目录。然后创建一个名为 `hello-world.js` 的新文件，内容如下：


    ```

    console.log(''Hello JavaScript!'');

    ```


    切换到终端，导航到你的临时目录，并执行以下命令：


    ```

    node hello-world.js

    ```


    你应该会看到以下输出：


    ```

    Hello JavaScript!

    ```


    你可以用这种方式运行本书中的所有示例。这种操作方法非常适用，除了第 12 章（关于模块的章节），在那章中我会提供额外的说明。


    大多数编辑器都支持通过扩展、插件或构建系统在编辑器内部执行代码。请务必阅读你常用编辑器的文档，了解如何启用这一功能，以实现快速的反馈循环。无论你采用何种机制，都要确保始终使用正确的
    Node 版本。


    让我们开始编写一些现代 JavaScript 吧！


    # 致谢


    写书是一项孤独的追求。然而，我们站在巨人的肩膀上——无论是过去、现在，还是未来的巨人。这包括我们的家人、老师和导师，他们向我们展示了努力和自律的价值；也包括那些在我们之前的科技工作者，他们创造了我们有时觉得理所当然的东西；最后，还有那些如今不知疲倦地推动边界、改善现状的人们。我知道自己很幸运，有机会受到许多这样杰出人物的影响——正在阅读这本书的每一位，你们知道你们是谁，以及你们对我意味着什么。谢谢你们。


    我有幸在许多会议上发表过演讲，但有一个名字尤其令我难忘，那就是 No Fluff Just Stuff (NFJS) 会议系列。我非常感谢 NFJS 的主管
    Jay Zimmerman 给了我机会，也感谢该系列的其他演讲者，他们不断给我灵感并分享他们的经验。这本书是我有机会就这个主题演讲一段时间的结果，但它的核心内容来自于我与世界各地数百位聪明、有才华的开发人员的互动，是他们让我质疑自己对概念的理解，并促使我深入探究。


    感谢 Brian 和 Anne Sam-Bodden——我长期的雇主，更重要的是，我的朋友——你们对我能力的信心总是超过我自己。你们鼓励我成为演讲者，并鼓励我写书。你们为我提供了一个可以实验、最终茁壮成长的环境。我将永远感激你们。


