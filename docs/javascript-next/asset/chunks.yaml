  trans: '

    # 如何运行模块化 JavaScript


    本章运行代码示例的最简单方法是使用 `Node`。^(⁷⁴) 在撰写本文时，`Node` 的版本为 12 以上，并在实验性标志下支持 ES6 模块。


    首先，请确保你已安装 `Node`，或者正在运行一个相对较新的 `Node` 版本。当然，如果你已在机器上安装了一个想保留的 `Node` 版本，你可以使用“Node
    版本管理器”^(⁷⁵) 或“`nvm`-windows”^(⁷⁶) 来同时安装和维护多个 `Node` 版本。安装完成后，打开命令提示符并输入以下内容：


    ```

    node --version

    # 在我的机器上显示 ''v12.4.0''

    ```


    如果你看到有效响应，则说明 `Node` 已正确安装。


    为了在 `Node` 中加载并运行 ES6 模块，有两个要求：


    * 必须使用 `--experimental-modules` 标志来调用 `Node`。


    * 任何需要被视为 ES6 模块的源文件都应使用 `.mjs` 文件扩展名（而不是 `.js`）。


    让我们考虑一个简单的例子来让事情更清楚。`cd` 到一个临时目录，创建一个名为 `exporter.mjs` 的新文件，内容如下：


    ```

    // 文件名必须以 "mjs" 结尾 — 例如 exporter.mjs

    export const sayHello = name => `Hello ${name}!!`

    ```


    现在，在同一个目录下创建另一个文件，并将其命名为 `importer.mjs`，包含以下内容：


    * ① 从 `exporter` 导入成员


    ```

    import { sayHello } from ''./exporter.mjs''; ①

    // 打印 ''Hello ES6 Modules!!''

    console.log(sayHello("ES6 Modules"));

    ```


    确保保存这两个文件，然后在控制台中输入以下内容：


    ```

    node --experimental-modules importer.mjs

    ```


    你应该会看到 `Hello ES6 Modules!!`。^(⁷⁷)


    在我们的设置中，`exporter.mjs`“导出”某些成员，而 `importer.mjs` 在自身内部使用这些成员。当你按照本章的示例进行练习时，你可以随意命名你的文件，只要文件具有
    `.mjs` 文件扩展名，并且你使用 `Node` 对 ES6 模块的实验性支持即可。`.mjs` 文件扩展名是 `Node` 特有的，它默认支持 CommonJS。然而，ES6
    模块文件与常规 JavaScript 文件没有区别，除了它们声明了一个模块，因此*应该*使用 `.js` 扩展名。相应地，本章中的代码片段将使用 `.js`
    扩展名来引用所有文件——只需在你的工作区中将它们替换为 `.mjs` 即可。


    让我们来谈谈模块！


    ## 声明模块


    ES6 中的模块就是一组相关的变量、常量、函数和类的集合。模块允许我们将代码库拆分成更小、更独立的功能单元，这些单元可以被我们代码库的其他部分使用，甚至可以发布给其他应用程序使用。模块允许我们将功能“隐藏”在命名空间中，从而消除命名冲突。


    ES6 中的模块包含在文件中，其中文件和模块之间是一一对应的关系。模块的名称是文件本身的（绝对或相对）路径。默认情况下，模块在 `严格模式` 下运行，我们在第
    1 章中简要讨论过这一点。模块的所有成员都隐式地为“私有”——也就是说，除非它们被显式地 `export` 导出，否则使用该模块的人无法看到它们。请考虑以下内容：


    * ① 显式地 `export` 成员


    * ② 这些是模块的私有成员


    * ③ 导出一个包含所有公共成员的对象，类似于揭示模块模式


    ```

    export const degreesToRadians = d => d * (Math.PI / 180); ①

    export const gradiansToRadians = g => g * 15.707 * Math.pow(10, -3);

    const calc = (fn, x, unit) => { ②

    switch (unit) {

    case ''degrees'':

    return fn.call(null, degreesToRadians(x));

    case ''gradians'':

    return fn.call(null, gradiansToRadians(x));

    default:

    return fn.call(null, x);

    }

    };

    export const sin = (x, unit = ''degrees'') => calc(Math.sin, x, unit);

    export const cos = (x, unit = ''degrees'') => calc(Math.cos, x, unit);

    export const tan = (x, unit = ''degrees'') => calc(Math.tan, x, unit);

    export const trig = { ③

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    ```


    这里我们声明了一组三角函数，导出那些我们认为是公共 API 的，而将其余部分保留为私有。请注意，我们还 `export` 了一个包含所有公共成员作为属性的对象，就像我们使用揭示模块模式所做的那样。这是一种有用的技术，它赋予我们的使用者选择权——他们可以挑选自己感兴趣的具体功能，或者使用整个导出的对象，并使其下的所有内容都可供他们使用。这些导出的成员，也称为“命名”导出，对任何使用此模块的人都是可见的。


    逐个 `export` 每个成员可能会显得冗长，并且可能模糊了公共 API 的实际内容。有一种替代语法可以帮助解决这个问题：


    * ① 定义我们所有的成员


    * ② 使用替代的导出语法


    ```

    const degreesToRadians = d => d * (Math.PI / 180); ①

    const gradiansToRadians = g => g * 15.707 * Math.pow(10, -3);

    const calc = (fn, x, unit) => {

    switch (unit) {

    case ''degrees'':

    return fn.call(null, degreesToRadians(x));

    case ''gradians'':

    return fn.call(null, gradiansToRadians(x));

    default:

    return fn.call(null, x);

    }

    };

    const sin = (x, unit = ''degrees'') => calc(Math.sin, x, unit);

    const cos = (x, unit = ''degrees'') => calc(Math.cos, x, unit);

    const tan = (x, unit = ''degrees'') => calc(Math.tan, x, unit);

    const trig = {

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    };

    export { ②

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan,

    trig,

    };

    ```


    与我们之前逐个显式导出每个成员不同，这里我们一次性导出所有公共成员。这有助于使公共 API 更加明确——然而，虽然公共 API 当然变得更清晰了，但维护模块会稍微繁琐一些，因为必须协调文件的不同部分，同时确定哪些是公共的，哪些不是。

    '
- fmt: '无论我们是逐一显式导出每个成员，还是一次性导出所有成员，这都取决于个人品味和偏好。然而，JavaScript 社区整体似乎正倾向于显式导出每个公开成员。此外，像`ESDoc`^([^(78)](#fn78))这样的文档工具会智能地仅展示导出的成员，因此即使采用显式导出方式，公开
    API 也一目了然。


    我们也可以导出一个“默认”成员，这是一种表达模块导出“唯一一个”东西的方式。考虑这样一个场景：我们正在编写一个数学库，并且恰好有一个三角学模块，其中我们定义了所有三角学函数。鉴于这个模块的全部内容就是这些函数，使用默认导出是合理的。


    然而，这可能会令人困惑，因为我们可以同时混合使用默认导出和显式导出其他成员，如下所示：


    *   ① 显式导出我们的公开成员

    *   ② 注意我们不再导出`trig`

    *   ③ 将`trig`设为该模块的默认导出


    ```

    export { ①

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan, ②

    };

    export default trig; ③

    ```


    这里，我们使用`default`关键字来导出我们包罗万象的`trig`对象，并假设这是大多数客户端无论如何都想要使用的。然而，我们仍然可以导出单独的成员，以防客户愿意“单点”而不是“全选”。（也可以使用内联命名导出机制，或者根据需要两者结合使用。）不用说，顾名思义，只能有一个默认导出。


    尽管默认导出看起来是个好主意，但它们是一种过渡机制，因为这是`CommonJs`^([^(79)](#fn79))所使用的模型，并且其缺点也多过优点。


    与命名导出（顾名思义）不同，默认导出不会将导出成员的名称暴露给外部世界。这将对模块的使用者施加责任，由他们来决定如何称呼该导出。考虑`degreesToRadians`，它恰好是一个命名导出——外部世界使用该成员时，它都使用相同的名称。如果我们把`degreesToRadians`改为`degToRad`，那么任何使用此模块的人都必须进行同样的更改。然而，作为默认导出的`trig`，并不会强制使用者将其称为`trig`。这意味着如果我们重命名`trig`，客户端将看不到这一更改，从而使重构工作变得相当繁琐。没有名称也意味着支持`IntelliSense`的编辑器无法帮助进行符号自动补全或自动导入。最后，默认导出限制了构建工具执行任何形式的摇树优化（即死代码消除）的能力。^([^(80)](#fn80))


    此外，使用命名导出可以帮助任何使用我们模块的人（可能包括我们自己）缩小生产包的大小，有助于重构等开发实践，并且，正如我们很快将看到的，还能减少导入模块时的混淆。总而言之，使用默认导出在很大程度上被认为是一种反模式^([^(81)](#fn81))，我们应该尽可能少用，甚至不用这个特性。


    导出还提供了另一种功能，即别名。让我们看看这对于命名导出是如何工作的。


    ### 别名导出


    别名导出允许我们重命名模块的成员，使得我们在模块内部引用成员的名称，与使用者看到的名称不同。如果希望将模块与其使用者完全解耦，从而让我们可以自由地重构内部名称而不影响外部世界，这可能很有价值。语法如下所示，并不令人意外：


    *   ① 显式导出我们的公开成员

    *   ② 同时也用别名导出我们包罗万象的对象


    ```

    // 为简洁起见，代码已缩写

    export {

    degreesToRadians,

    gradiansToRadians,

    sin as sine, ①

    cos as cosine,

    tan,

    trig as trignometry, ②

    };

    ```


    `as`语法如预期那样工作，允许我们在“导出时”重命名成员。现在，我们可以随意以任何方式重命名内部别名的成员，而无需强制所有使用者也随之重构。


    别名导出揭示了默认导出的另一个缺点，即由于默认导出是未命名的导出，为它们设置别名是没有意义的。


    ### 快速小结


    总结一下，导出意味着将模块的成员设为公开，也就是说，模块的使用者可以访问它们。我们看到了两种不同的导出机制——命名导出（可以内联，因此是逐个导出）与一次性导出所有符号。我们还学习了默认导出的语法，并讨论了使用这种方法的某些缺点。


    现在让我们转向等式的另一边，即导入或消费一个模块。'
  raw: 'Whether we export each member explicitly or export in one fell swoop is a
    matter of taste and preference. However, it seems that the JavaScript community
    as a whole seems to be tipping toward explicitly exporting each public member.
    Furthermore, documentation tools like ESDoc^([^(78)](#fn78)) intelligently only
    reveal exported members, thereby making the public API obvious even with explicit
    exporting.


    We can also export a “default” member, which is a means to express the “one single”
    thing that module exports. Consider a situation where we are writing a math library,
    and we happen to have a trigonometry module, wherein we are simply defining all
    of our trigonometry functions. Given that this is all there is to this module,
    a default export makes sense.


    However, this can be confusing, because we are allowed to mix and match having
    a default member, while explicitly exporting other members, like so:


    *   ① Explicitly export our public members


    *   ② Note that we are no longer exporting `trig`


    *   ③ Make `trig` a default export for this module


    ```

    export { ①

    degreesToRadians,

    gradiansToRadians,

    sin,

    cos,

    tan, ②

    };

    export default trig; ③

    ```


    Here, we use the `default` keyword to export our all-inclusive `trig` object,
    which we assume is what most of our clients will want to use anyway. However,
    we can still export individual members in case our clients rather order à la carte
    instead of a full entrée. (One can also use the inline named export mechanism,
    or use both in combination if one so desires.) Needless to say, as the name suggests,
    there can only be one default export.


    While default exports seem like a good idea, default exports are a transitionary
    mechanism since this is the model that CommonJs^([^(79)](#fn79)) uses, and come
    with more than their share of downsides.


    Unlike named exports (as the name suggests), default exports do not expose the
    name of the exported member to the outside world. This shifts the onus to the
    consumers of that module, who then decide what to call that export. Consider `degreesToRadians`
    which happens to be a named export—the world sees and uses this member with the
    same name. If we were to change `degreesToRadians` to `degToRad,` then anyone
    using this module will be forced to make the same change. However, `trig`, being
    a default export, does not force a consumer to call it `trig`. This means that
    if we were to rename trig, the client would not see that change, thus making refactoring
    efforts rather tedious. Having no name also means that editors that support IntelliSense
    cannot help with auto-completion of symbols or auto-importing. Finally, default
    exports limit the ability for build tools to do any form of tree-shaking a.k.a
    dead code elimination.^([^(80)](#fn80))


    Furthermore, using named exports can help anyone using our modules (which may
    include us) make our production bundle size smaller, aid development practices
    like refactoring, and, as we will see soon, reduce confusion when importing the
    module. All this to say, using default exports is largely considered an anti-pattern^([^(81)](#fn81))
    and we should use this feature at a minimum, if at all.


    There is one more facility that exports provide us, which is aliasing. Let us
    take a look to see how this works for named exports.


    ### Aliasing Exports


    Aliasing exports allows us to rename members of the module, so that the name that
    we reference a member with internally to the module is different from the name
    that consumers see it as. This might prove to be valuable if one wishes to completely
    decouple the module from its consumers, leaving us free to refactor names without
    affecting the outside world. The syntax, as expressed here, is rather unsurprising:


    *   ① Explicitly export our public members


    *   ② Export our all-encompassing object as well with an alias


    ```

    // code abbreviated for brevity

    export {

    degreesToRadians,

    gradiansToRadians,

    sin as sine, ①

    cos as cosine,

    tan,

    trig as trignometry, ②

    };

    ```


    The `as` syntax works as advertised, allowing us to rename our member **on the
    way out**. Now, we are free to rename any of our aliased members internally any
    which way we want, without forcing all of our consumers to refactor as well.


    Aliasing exports reveals another shortcoming of default exports, namely since
    default exports are unnamed exports, aliasing them is a meaningless proposition.


    ### A Quick Summary


    Summarizing, exporting implies making members of a module public, that is, they
    are accessible to consumers of the module. We have seen two separate mechanisms
    for exporting—named export, which can be inlined, and therefore individual exports,
    vs. exporting all symbols in one fell swoop. Alternatively, we also saw the syntax
    for default exports, and discussed some of the cons of using this approach.


    Let us now turn toward the other side of the equation, namely importing or consuming
    a module.'
