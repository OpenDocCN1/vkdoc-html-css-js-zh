- fmt: '# Summary


    ES6 gives us several new constructs to declare and use variables in our code.
    `let` and `const` allow us to use a declaration style which are more in tune with
    what we may be used to in other languages. Their scoping rules permit easier reasoning
    of the code, preventing bugs that often get introduced due to `var`. As browser
    vendors offer us better support for ES6 and beyond, it behooves us to embrace
    these new constructs. Going forward, there is no reason to favor `var` anymore.
    `let` and `const` give us everything we need, with the appropriate checks baked
    into the runtime. We should leverage linting tools that allow us to enforce this,
    both at development time and during our continuous builds.


    In the next chapter, we will see another revolutionary change that landed in ES6,
    namely a new syntax to define functions.


    Footnotes [1](#481812_1_En_1_Chapter.xhtml#Fn1_source) [2](#481812_1_En_1_Chapter.xhtml#Fn2_source)
    [3](#481812_1_En_1_Chapter.xhtml#Fn3_source)


    # 2. Lambdas with Arrow Functions


    Functions are used everywhere in JavaScript. A face-lift to make their syntax
    succinct, and consequently easier to use and understand, was long overdue.


    JavaScript is, at its core, a functional programming language. It supports functions
    as first-class citizens, in that they are like any other type in the language.
    Functions can be assigned to variables, supplied as arguments to other functions,
    and be `return`-ed from functions just like we would any other type in JavaScript.
    JavaScript is also single-threaded. Well-designed APIs and libraries that involve
    long-running operations work asynchronously, typically accepting a callback which
    is to be invoked when the (asynchronous) task is complete. These callbacks happen
    to be functions as well. Finally, the mechanism to define methods on objects also
    happen to be functions.


    In this chapter we will get acclimated with a new syntax for function expressions,
    also referred to as "arrow" functions that was introduced in ES6. We will see
    how our code can be made eloquent with shorter syntax, thereby allowing us to
    express our intent clearly. Our discussion will include how arrow functions''
    behaviors differ from regular functions, allowing us to discern when best to use
    arrow functions. By the end of this chapter, you will be raring to return to your
    codebase knowing that you can confidently eliminate any unnecessary verbosity,
    leaving behind, well... let''s just call it poetry, shall we?


    ## Reevaluating the Verbosity of Function Definition


    In ES5 we can define functions using several constructs, the two primary mechanisms
    being function statements and expressions. The focus of this chapter will be on
    function expressions; however, it behooves me to elaborate on the syntactical
    difference between the two. Consider the following function *statement*.


    - ① A function statement

    - ② Prints `function`

    - ③ Prints `identity`


    ```javascript

    function identity(n) { ①

    return n;

    }

    // invoke it

    console.assert(identity(42) === 42);

    // inspect it

    console.assert((typeof identity) === ''function''); ②

    console.assert(identity.name === ''identity''); ③

    ```


    The function statement requires that a name be provided to the newly created function;
    otherwise, how would we invoke it later? As we can see from our inspection of
    the newly defined function, it *is* of type `function`. Functions are objects
    of type `Function`, and correspondingly have properties we can interrogate, such
    as their `name` and `length`.^([^(15)](#fn15))


    Now we will take a look at the same function, this time defined using a function
    expression.


    - ① A function expression

    - ② Prints `function`

    - ③ Prints `identity`


    ```javascript

    const identity = function(n) { ①

    return n;

    };

    // invoke it

    console.assert(identity(42) === 42);

    // inspect it

    console.assert((typeof identity) === ''function''); ②

    console.assert(identity.name === ''identity''); ③

    ```


    As we can see, this too defines a function that behaves identical to the one we
    defined using a statement. Rather than supplying a name to the function, we assign
    the value of the expression to a variable, or in this case, a `const`. This function
    is identical to and consequently behaves identically to a function defined using
    a statement.


    The difference, however, lies in how they are loaded. Function statements are
    loaded before any of the code is executed. This means that you can define a function
    statement anywhere, and use it anywhere—you can even invoke the function before
    defining it as a function statement. On the other hand, function expressions involve
    assignments to variables, which, as we know from a previous chapter, are subject
    to hoisting rules. Therefore, using the variable *before* it is assigned to a
    function expression will result in an error. Observe:


    - ① Using a function defined as a statement before it is actually defined is allowed

    - ② A function statement

    - ③ Using a function defined as an expression before it is actually defined results
    in an error

    - ④ A function expression


    ```javascript

    // invoke it before defining it

    fnStatement(); ①

    function fnStatement() { ②

    console.log(''I am a function statement'');

    }

    // invoke it

    fnStatement();

    // fnExpression(); ③

    const fnExpression = function () { ④

    console.log(''I am a function expression'');

    };

    // invoke it

    fnExpression();

    ```


    Choosing between defining functions as statements and expressions is largely a
    matter of taste. But considering function expressions permit us to omit the function
    name they tend to be a little less verbose than their statement counterparts.
    However, at times even this relatively succinct function expression syntax can
    often prove to be rather verbose. Consider a scenario wherein we attempt a series
    of operations on the elements of `Array` to derive a final value:


    - ① Triple every number in the array

    - ② Filter out even numbers only

    - ③ Reduce the result to its sum


    ```javascript

    const nums = [1, 2, 3, 4, 5];

    const result = nums

    .map(function(n) {

    return n * 3; ①

    })

    .filter(function(n) {

    return (n % 2) === 0; ②

    })

    .reduce(function(acc, n) {

    return acc + n; ③

    }, 0);

    ```


    This example may be trite; however, it does highlight the ceremony involved in
    writing even the simplest of functions. As a result, it becomes difficult to parse
    out what we are *actually* attempting to accomplish. This often leads developers
    to extracting the callbacks into (named) function statements, which are not only
    more verbose, but end up dispersing the code, making it even harder to understand
    what it is we are trying to accomplish.


    Arrow functions to the rescue!


    ## Arrow Functions


    Arrow functions (sometimes referred to as "fat" arrow functions—you will see these
    terms used synonymously) present us with a much more concise syntax for function
    definitions. Let us start by exploring the syntax of arrow functions.


    ### Syntax


    Arrow functions eliminate a lot of the verbosity that function expressions present.
    Let us whet our appetite with a simple example:


    ```javascript

    const doubleIt = n => n * 2;

    // invoke it

    console.assert(doubleIt(8) === 16);

    ```


    Let us feast our eyes on the elegance of arrow functions prior to delving into
    the weeds. Gone is the `function` keyword, the parentheses, the curly brackets,
    and the `return` keyword. (The last two are not entirely true, as we will see
    in the following discussion.) All that remains is the **true** intent of the function.


    As we can see, much like function expressions, we do not provide a name for the
    function itself. Rather we assign the result of *evaluating* the expression to
    a variable so that we can reference it later.


    Now that we have had a taste of arrow functions, let us discuss some syntactical
    details.'
  raw: '## Summary


    ES6 gives us several new constructs to declare and use variables in our code.
    `let` and `const` allow us to use a declaration style which are more in tune with
    what we may be used to in other languages. Their scoping rules permit easier reasoning
    of the code, preventing bugs that often get introduced due to `var`s. As browser
    vendors offer us better support for ES6 and beyond, it behooves us to embrace
    these new constructs. Going forward, there is **no** reason to favor `var` anymore.
    `let` and `const` give us everything we need, with the appropriate checks baked
    into the runtime. We should leverage linting tools that allow us to enforce this,
    both at development time and during our continuous builds.


    In the next chapter, we will see another revolutionary change that landed in ES6,
    namely a new syntax to define functions.


    Footnotes [1](#481812_1_En_1_Chapter.xhtml#Fn1_source)   [2](#481812_1_En_1_Chapter.xhtml#Fn2_source)
      [3](#481812_1_En_1_Chapter.xhtml#Fn3_source)


    # 2. Lambdas with Arrow Functions


    Functions are used everywhere in JavaScript. A face-lift to make their syntax
    succinct, and consequently easier to use and understand, was long overdue.


    JavaScript is, at its core, a functional programming language. It supports functions
    as first-class citizens, in that they are like any other type in the language.
    Functions can be assigned to variables, supplied as arguments to other functions,
    and be `return`-ed from functions just like we would any other type in JavaScript.
    JavaScript is also single-threaded. Well-designed APIs and libraries that involve
    long-running operations work asynchronously, typically accepting a callback which
    is to be invoked when the (asynchronous) task is complete. These callbacks happen
    to be functions as well. Finally, the mechanism to define methods on objects also
    happen to be functions.


    In this chapter we will get acclimated with a new syntax for function expressions,
    also referred to as “arrow” functions that was introduced in ES6\. We will see
    how our code can be made eloquent with shorter syntax, thereby allowing us to
    express our intent clearly. Our discussion will include how arrow functions’ behaviors
    differ from regular functions, allowing us to discern when best to use arrow functions.
    By the end of this chapter, you will be raring to return to your codebase knowing
    that you can confidently eliminate any unnecessary verbosity, leaving behind,
    well …​ let’s just call it poetry, shall we?


    ## Reevaluating the Verbosity of Function Definition


    In ES5 we can define functions using several constructs, the two primary mechanisms
    being function statements and expressions. The focus of this chapter will be on
    function expressions; however, it behooves me to elaborate on the syntactical
    difference between the two. Consider the following function *statement*.


    *   ① A function statement


    *   ② Prints `function`


    *   ③ Prints `identity`


    ```

    function identity(n) { ①

    return n;

    }

    // invoke it

    console.assert(identity(42) === 42);

    // inspect it

    console.assert((typeof identity) === ''function''); ②

    console.assert(identity.name === ''identity''); ③

    ```


    The function statement requires that a name be provided to the newly created function;
    otherwise, how would we invoke it later? As we can see from our inspection of
    the newly defined function, it *is* of type `function`. Functions are objects
    of type `Function`, and correspondingly have properties we can interrogate, such
    as their `name`s and `length`.^([^(15)](#fn15))


    Now we will take a look at the same function, this time defined using a function
    expression.


    *   ① A function expression


    *   ② Prints `function`


    *   ③ Prints `identity`


    ```

    const identity = function(n) { ①

    return n;

    };

    // invoke it

    console.assert(identity(42) === 42);

    // inspect it

    console.assert((typeof identity) === ''function''); ②

    console.assert(identity.name === ''identity''); ③

    ```


    As we can see, this too defines a function that behaves identical to the one we
    defined using a statement. Rather than supplying a name to the function, we assign
    the value of the expression to a variable, or in this case, a `const`. This function
    is identical to and consequently behaves identically to a function defined using
    a statement.


    The difference, however, lies in how they are loaded. Function statements are
    loaded before any of the code is executed. This means that you can define a function
    statement anywhere, and use it anywhere—you can even invoke the function before
    defining it as a function statement. On the other hand, function expressions involve
    assignments to variables, which, as we know from a previous chapter, are subject
    to hoisting rules. Therefore, using the variable *before* it is assigned to a
    function expression will result in an error. Observe:


    *   ① Using a function defined as a statement before it is actually defined is
    allowed


    *   ② A function statement


    *   ③ Using a function defined as an expression before it is actually defined
    results in an error


    *   ④ A function expression


    ```

    // invoke it before defining it

    fnStatement(); ①

    function fnStatement() { ②

    console.log(''I am a function statement'');

    }

    // invoke it

    fnStatement();

    // fnExpression(); ③

    const fnExpression = function () { ④

    console.log(''I am a function expression'');

    };

    // invoke it

    fnExpression();

    ```


    Choosing between defining functions as statements and expressions is largely a
    matter of taste. But considering function expressions permit us to omit the function
    name they tend to be a little less verbose than their statement counterparts.
    However, at times even this relatively succinct function expression syntax can
    often prove to be rather verbose. Consider a scenario wherein we attempt a series
    of operations on the elements of `Array` to derive a final value:


    *   ① Triple every number in the array


    *   ② Filter out even numbers only


    *   ③ Reduce the result to its sum


    ```

    const nums = [1, 2, 3, 4, 5];

    const result = nums

    .map(function(n) {

    return n * 3; ①

    })

    .filter(function(n) {

    return (n % 2) === 0; ②

    })

    .reduce(function(acc, n) {

    return acc + n; ③

    }, 0);

    ```


    This example may be trite; however, it does highlight the ceremony involved in
    writing even the simplest of functions. As a result, it becomes difficult to parse
    out what we are *actually* attempting to accomplish. This often leads developers
    to extracting the callbacks into (named) function statements, which are not only
    more verbose, but end up dispersing the code, making it even harder to understand
    what it is we are trying to accomplish.


    Arrow functions to the rescue!


    ## Arrow Functions


    Arrow functions (sometimes referred to as “fat” arrow functions—you will see these
    terms used synonymously) present us with a much more concise syntax for function
    definitions. Let us start by exploring the syntax of arrow functions.


    ### Syntax


    Arrow functions eliminate a lot of the verbosity that function expressions present.
    Let us whet our appetite with a simple example:


    ```

    const doubleIt = n => n * 2;

    // invoke it

    console.assert(doubleIt(8) === 16);

    ```


    Let us feast our eyes on the elegance of arrow functions prior to delving into
    the weeds. Gone is the `function` keyword, the parentheses, the curly brackets,
    and the `return` keyword. (The last true are not entirely true, as we will see
    in the following discussion.) All that remains is the **true** intent of the function.


    As we can see, much like function expressions, we do not provide a name for the
    function itself. Rather we assign the result of *evaluating* the expression to
    a variable so that we can reference it later.


    Now that we have had a taste of arrow functions, let us discuss some syntactical
    details.'
