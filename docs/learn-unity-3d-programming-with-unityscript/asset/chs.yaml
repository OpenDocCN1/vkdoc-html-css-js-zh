  图 3-17. 分别显示有和没有太阳光晕效果的 Game 视图


  ### Render Mode（渲染模式）


  该属性指定了光源的重要性。在运行时，计算光照和阴影会消耗大量计算能力。当这些消耗大量计算能力的元素影响游戏质量和性能时，它们被称为“昂贵（expensive）”。评估光源的相对重要性有助于
  Unity 优化游戏性能，这是本书后续会讨论的一个主题。


  ### Culling Mask（剔除遮罩）


  其工作方式与`Camera`组件中的`Culling Mask`属性相同，你可以在此指定哪些层会受到该光源的影响。


  ### Lightmapping（光照映射）


  `Realtime Only`表示该光源用于在运行时动态照亮场景。`Baked Only`指的是光照贴图（lightmapping），这超出了本书的讨论范围。`Auto`则允许两者兼用。


  ## 其他属性


  还有一些属性特定于你选择的光源类型。这些属性会根据你的选择出现在上下文相关的 Inspector 中。


  ### Range（范围）


  对于`Point`（点光源）和`Spot`（聚光灯），`Range`指的是从光源发出的有效照射距离。超出该范围的游戏对象将不会被照亮。当选中光源时，其范围会在
  Scene 视图中以黄色球体形式直观显示。


  ### Spot Angle（聚光角度）


  仅适用于`Spot`（聚光灯）。`Spot Angle`以度为单位，决定了从`Spot`（聚光灯）发出的锥形光束的宽度。


