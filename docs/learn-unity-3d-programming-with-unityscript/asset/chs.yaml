  0，检视面板中的图表会显示“行走”运动的权重最大，而“行走右转”和“行走左转”的权重最小。当“方向”参数值为 -1 时，“行走左转”的权重最大；当“方向”参数值为
  1 时，“行走右转”的权重最大。


