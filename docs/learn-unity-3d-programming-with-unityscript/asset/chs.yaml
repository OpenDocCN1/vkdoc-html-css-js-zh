- "# 各平台专属开发者资源\n\n各目标平台的制造商希望开发者能为其系统制作游戏，因此提供了大量开发者支持。至少他们会提供文档，但大多数平台也都拥有自己的类似论坛。通常，这些论坛会以某种组合形式提供技术文档、教程、技术论坛以及开发者社区论坛。\n\
  \n虽然大多数这类论坛都要求你创建一个用户账户，但具体要求差异很大。有些在注册时就需要提供合法的商业实体信息，例如纳税识别号，而另一些则在你准备发布游戏时才需要提供。有些论坛会收取费用，不过同样可能要到准备发布时才会涉及。没有一家论坛要求你必须购买硬件，但最佳实践并强烈建议在发布前，不仅要在虚拟模拟器上，还要在目标平台硬件上测试你的游戏。\n\
  \n以下是一些较为常见的网站：\n\n- **索尼**：[`http://us.playstation.com/develop`](http://us.playstation.com/develop)（图\
  \ 13-5）。如果你不在美国，索尼还为其他地区设有论坛，因此请花点时间快速搜索你所在地区的论坛。\n  ![A978-1-4302-6587-0_13_Fig5_HTML.jpg](img/A978-1-4302-6587-0_13_Fig5_HTML.jpg)\n\
