  ## 根运动


  动画涉及角色头部、身体和四肢相对于自身坐标系的运动，而根运动则涉及角色相对于游戏世界坐标系的运动。例如，你会看到没有根运动的僵尸行走动画会让角色原地踏步，而有根运动的
  `walkingWithMotion` 动画则让角色在游戏场景中向前移动。与动画运动一样，动画是否包含根运动，是在导入 Unity 之前创建角色和动画时确定的。


  选择 `Animations` 选项卡。注意底部有一个预览区域，你可以在此播放动画。留意僵尸角色所站平面的网格，你会注意到僵尸正在原地行走。


  在 Inspector 中向下滚动，直到看到可以勾选 `Loop Time` 的位置，其正下方是 `Loop Pose`。对于 `Root Transform
  Rotation`，勾选 `Bake Into Pose`，然后将 `Based Upon` 设置为 `Body Orientation`。接下来，对于 `Root
  Transform Position (Y)`，勾选 `Bake Into Pose`，并在其下方将 `Based Upon (at Start)` 设置为 `Original`。对于
  `Root Transform Position (XZ)`，不要勾选 `Bake Into Pose`。最后，点击 `Apply`（图 5-32）。


  ![A978-1-4302-6587-0_5_Fig32_HTML.jpg](img/A978-1-4302-6587-0_5_Fig32_HTML.jpg)


  **图 5-32.** 在 Inspector 中配置动画设置


  按设置分解这些选项，勾选 `Loop Pose` 意味着动画剪辑将重复或循环播放。如果未勾选，动画剪辑将只播放一次。


  `Root Transform Rotation` 描述了动画剪辑期间动画旋转模型的程度。通过勾选 `Bake Into Pose`，你将原始旋转坐标“烘焙”到角色中，并防止它在动画剪辑期间旋转。这是你希望防止它在行走动画期间发生漂移的方法，因为你希望角色只沿直线向前移动。


  在 `Mirror` 下方，你可以看到来自根运动的平均速度。除了你感兴趣的轴之外，其他轴上的分数速度是可能发生漂移的指标。你可以选择此动画剪辑是应基于模型的**身体方向**（Body
  Orientation），还是应基于该剪辑播放时角色拥有的**原始向前运动矢量**（Original forward movement vector），从角色的前一个运动矢量继续播放。


  `Offset` 允许你进一步微调变换，以解决动画剪辑可能引入的任何差异。


  `Root Transform Position (Y)` 的工作方式与旋转类似。在这种情况下，对于行走动画，你应该勾选 `Bake Into Pose` 以防止向上或向下漂移，但对于跳跃动画，则应保持不勾选，以允许跳跃时上下运动。


  `Root Transform Position (XZ)` 处理沿 xz 平面的运动，这与“地面”相同。回想一下，在 Unity 中，y 轴表示游戏世界中的上下方向。通过保持不勾选
  `Bake Into Pose`，角色在执行动画时将在场景中的 xz 平面上移动。Idle（待机）是常见动画剪辑的一个例子，在这种情况下你会想要勾选 `Bake
  Into Pose` 以防止意外的移动。


  绿色圆圈指示动画循环的平滑程度，其依据是模型在剪辑的第一帧和最后一帧中的变换属性的相似度。当从一个循环的结束到下一个循环的开始的过渡差异增大时，警告指示器会变为黄色，然后变为红色。`Root
  Transform Position (XZ)` 的指示器是红色的，因为每次动画循环时，僵尸都会向前移动一步到新位置。


  现在你的动画已经准备好进行测试，但为了更好地观察行走的根运动效果，为视角提供一些背景而不是纯色平面会更容易。为你的场景创建一个平面，并将其变换设置为 `(0,
  0, 0)`，缩放设置为 `(30, 1, 30)`。在顶部菜单中选择 `Assets` ➤ `Import Package` ➤ `Terrain Assets`，然后点击
  `Import`。在此包中找到 `Terrain Textures` 文件夹，并将 `Grass&Rock` 纹理拖到 Hierarchy 视图中的 Plane
