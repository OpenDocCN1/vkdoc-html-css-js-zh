  ## 乐趣与游戏体验


  如果能简单地定义什么是“乐趣”并加以应用，那么游戏设计将会变得容易。不幸的是，“乐趣”是主观的——你觉得有趣的东西，对别人来说可能毫无乐趣。即使是同一款游戏，在你玩了很多次之后，也可能不再觉得它有趣。一个简单的事实是：你无法预测游戏玩家大众是否认为你的游戏有趣。


  虽然没有具体的“乐趣公式”，但有一些众所周知的工具可以用来避免玩法机制中的常见问题，这些问题必定会降低游戏的潜在乐趣。


  ### 地图


  一个好的起点是，在一张纸上或使用你最喜欢的绘图工具来绘制你的游戏地图。为了了解地图如何帮助你发现游戏设计问题，让我们看看障碍赛场景的地图（图 9-3）。


  ![A978-1-4302-6587-0_9_Fig3_HTML.jpg](img/A978-1-4302-6587-0_9_Fig3_HTML.jpg)


  图 9-3. 障碍赛的初始地图


  现在，你可以轻松地看到玩家角色、从起点到终点的架空赛道，以及各种障碍物都集中在一起。


  为了达到最佳效果，地图应按比例绘制。在这个例子中，相对于障碍物和赛道，玩家角色过大。通过同时标示出玩家的起点，玩家图标为地图增加了更多信息（图 9-4）。


  ![A978-1-4302-6587-0_9_Fig4_HTML.jpg](img/A978-1-4302-6587-0_9_Fig4_HTML.jpg)


  图 9-4. 按比例绘制了玩家角色的障碍赛地图


  现在地图上的玩家图标已经按比例缩放，让我们用批判的眼光看看整个障碍赛的布局。


  赛道上有很多空白区域，玩家除了行走无事可做。这很不好——仅仅行走是无聊的。没有太多障碍物的障碍赛是无聊的。无聊就不好玩。


  在钟摆之后，加农炮、激光和暴风雪障碍物都挤在了一起。在地图上将赛道划分为区域后，这种拥挤现象就更加明显了（图 9-5）。


  ![A978-1-4302-6587-0_9_Fig5_HTML.jpg](img/A978-1-4302-6587-0_9_Fig5_HTML.jpg)


  图 9-5. 将障碍赛划分为区域


  为了解决这个问题，首先将赛道划分为大小更均匀的区域（图 9-6）。


  ![A978-1-4302-6587-0_9_Fig6_HTML.jpg](img/A978-1-4302-6587-0_9_Fig6_HTML.jpg)


  图 9-6. 将障碍赛重新划分为大小相近的区域


  移动平台不需要更大的区域，而钟摆在一个大小合理的区域里算是较大的障碍物，因此这些障碍物及其区域边界可以保持不变。


  现在区域已经划分好，出于多种原因，按类型设置障碍物区域，而不是每种类型只放一个，会更有意义。利用布满相似障碍物的区域是更有效地利用时间和资源的方式。在这种情况下，你可以在各自的区域中使用一组加农炮和激光，而暴风雪则可以简单地调整大小来适配一个区域。在分配这些区域之前，还有几个游戏设计因素需要考虑。


  ### 节奏


  人类的大脑非常擅长适应几乎任何事情。即使你将游戏设计成从头到尾都是令人震惊的、达到曲速 10 级的、令人毛发直竖的激烈体验，一旦玩家的大脑适应了这种节奏，它可能会因为感觉“平淡”而被视为无聊（图
  9-7）。


  ![A978-1-4302-6587-0_9_Fig7_HTML.jpg](img/A978-1-4302-6587-0_9_Fig7_HTML.jpg)


  图 9-7. 持续高强度输出随着时间的推移会显得平淡


  玩家的大脑需要不断调整，才能更投入、受到更多刺激，因此你需要将情感上的强烈高潮和低谷融入游戏体验中（图 9-8）。


  ![A978-1-4302-6587-0_9_Fig8_HTML.jpg](img/A978-1-4302-6587-0_9_Fig8_HTML.jpg)


  图 9-8. 随时间变化的、具有不同情感强度级别的游戏玩法


  在障碍赛的例子中，障碍赛内的每个区域都可以是一个独特的强度级别，由检查点隔开。检查点处提供刚好足够的空间，让玩家站立并评估下一个障碍物。这个喘息空间让玩家在情感上平静下来，在玩家投入下一个相对更高强度的区域之前，将感知到的强度重置到一个较低的水平。



