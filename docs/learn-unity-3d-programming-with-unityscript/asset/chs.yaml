  \n图 4-7.\n\n你将看到变量声明，随后是一些函数，包括熟悉的 `Start()` 函数。在这些函数内部，有一些不太熟悉的条目，比如 `eulerAngles`\
  \ 和 `Quaternions`。这些超出了初学者级别的主题，但不知道它们是什么并不妨碍你使用该脚本或根据自己的喜好自定义其属性。我确实建议你通读一遍脚本参考文档，并且每次遇到新的或不熟悉的话题时都重新阅读该参考文档。你会发现，随着你继续构建整体知识体系，这些概念会逐渐变得清晰。\n\
  \n太棒了——你已经在游戏场景中添加了一个脚本，该脚本接受用户交互并允许用户控制 `Main Camera` 游戏对象的运动。\n\n让我们更仔细地看看脚本是如何影响游戏对象行为的。\n\
  \n一个类非常简单，就是一组变量和函数的集合。在 UnityScript 中，每个脚本都是一个类，并且脚本名称就是类名。函数在脚本中的顺序并不重要，但 Unity\
  \ 如何知道要运行哪些函数呢？\n\n注意\n\n为了条理清晰，如果你在脚本中对常用的函数使用一致的顺序，那么后续再回顾时会更容易处理。\n\n这是游戏引擎底层功能的一部分。当你进入\
  \ `Play` 模式时，会发生一个由 Unity 引擎驱动的事件特定序列。为了在游戏中获得你想要的行为，理解你的代码相对于这些事件的位置与知道要编写什么代码同样重要。\n\
  \n## 启动游戏\n\n当你启动游戏时，通常首先看到的是加载画面。根据游戏的不同，它可能出现在标题画面之前或之后。无论哪种情况，在加载画面和状态栏背后，游戏引擎正在繁忙地准备游戏以供游玩。当游戏对象及其脚本被实例化时，会进行一个特定顺序的函数调用，你可以在脚本中利用这些调用来控制游戏对象的行为。\n\
  \n### Awake\n\n当游戏启动时，首先游戏对象被实例化或创建。在一个游戏对象被实例化后，脚本实例会被加载。`Awake()` 函数在脚本的生命周期内仅被调用一次，即在脚本实例被加载时，以便为游戏玩法设置好各项内容，例如初始化脚本的变量。\n\
  \n游戏对象调用 `Awake()` 函数的顺序是随机的，因此你不应使用 `Awake()` 函数在对象之间传递信息，因为目标对象可能还没有准备好。\n\n###\
  \ Start\n\n`Start()` 也仅被调用一次，即在脚本启用时。这发生在场景中每个对象的 `Awake()` 都被调用之后。\n\n\n\n### 更新\n\
  \n一旦脚本被启用并且`Start()`函数被调用后，在游戏渲染的每一帧，`Update()`函数都会被调用。这是实现游戏行为的主要函数。但这具体意味着什么呢？\n\
  \n简而言之，游戏就是交互式的动画。动画，即游戏中的运动，其原理与视频类似：观众看到的是一系列静态图像。每张图像中，主体的位置都有微小的变化，当这些帧快速连续播放时，就会产生运动的错觉（见图\
  \ 4-8）。\n\n![A978-1-4302-6587-0_4_Fig8_HTML.jpg](img/A978-1-4302-6587-0_4_Fig8_HTML.jpg)\n\
  \n图 4-8. UFO 发射的逐帧序列\n\n渲染游戏，是指以足够快的速度逐帧将画面绘制到屏幕上，从而在游戏中提供同样的运动错觉。Unity 游戏引擎会计算所有内容：每个游戏对象的位置或自上一帧以来的移动、基于位置和光照的每个游戏对象，然后在场景中所有变化生效后，计算出从主摄像机视角看到的场景外观，最后将这一新帧渲染到屏幕上。\n\
  \n与视频不同，游戏多了一个互动元素。在渲染每一帧之前，Unity 引擎必须根据每个游戏对象的组件（包括任何脚本）所决定的行为，计算自上一帧以来的变化。如你在图\
  \ 4-9 中所见，编写在`Update()`函数中的代码驱动着游戏持续进行的动作。\n\n![A978-1-4302-6587-0_4_Fig9_HTML.jpg](img/A978-1-4302-6587-0_4_Fig9_HTML.jpg)\n\
  \n图 4-9. 已渲染帧序列及其对应的脚本函数调用\n\n### 在 Start 中编写脚本\n\n在 Unity 编辑器中，在层级视图中选择“Snazzy\
  \ Cubes”对象。在顶部菜单中，选择**编辑** ➤ **删除**。由于 Snazzy Cubes 是一个父对象，当它被删除时，其所有子对象也会被删除。在这种情况下，所有立方体都会从场景中消失。\n\
  \n使用层级视图，选择**创建** ➤ **球体**来创建一个新的游戏对象。如预期，一个球体出现在原点(0, 0, 0)处。选中主摄像机，然后将球体从层级视图拖拽到`MouseOrbit`脚本组件的“目标”属性中。\n\
  \n在层级菜单中选中光源。将变换位置属性设置为(0, 5, 0)，旋转属性设置为(0, 30, 0)，并确保其类型为“方向光”。\n\n在项目面板中，选择“Assets”文件夹。在项目面板的控制栏中，选择**创建**\
  \ ➤ **文件夹**，然后将其命名为“Scripts”。养成保持游戏资源井然有序的习惯非常重要。你会看到新的“Scripts”文件夹出现在“Assets”文件夹中（图\
  \ 4-10）。\n\n![A978-1-4302-6587-0_4_Fig10_HTML.jpg](img/A978-1-4302-6587-0_4_Fig10_HTML.jpg)\n\
  \n图 4-10. 在项目面板中创建 Scripts 文件夹\n\n选中新的“Scripts”文件夹，选择**创建** ➤ **JavaScript**，并将新脚本命名为“SphereColor”（图\
  \ 4-11）。\n\n![A978-1-4302-6587-0_4_Fig11_HTML.jpg](img/A978-1-4302-6587-0_4_Fig11_HTML.jpg)\n\
  \n图 4-11. 创建 SphereColor 脚本\n\n使用检视面板中的“打开”按钮在 MonoDevelop 中打开脚本，你会发现其中已经有了空的`Start()`和`Update()`函数。在`Start()`函数中添加如下一行代码：\n\
  \n```\ngameObject.renderer.material.color = Color.red;\n```\n\n保存脚本。在编辑器中，将脚本从项目面板拖拽并放到层级视图或场景视图中的球体上，将其附加到球体游戏对象上。播放以查看红色球体。`Start()`函数被调用一次，球体的材质被设置为红色。退出播放模式。\n\
  \n分解这行代码，结果如下：\n\n```\n(1)       (2)      (3)    (4)     (5)  (6)\ngameObject.renderer.material.color\
  \ = Color.red;\n```\n\n- `gameObject` 指向球体，因为这是脚本所挂载的游戏对象。\n- 使用点语法，你逐级向下访问到网格渲染器组件、附加的默认材质以及该材质的颜色属性。\n\
  - 然后，你使用 `Color` 类为该颜色属性赋值，该类包含一些快捷方式，例如 `red`。\n\n### 颜色\n\n你可以按住 `Ctrl`+`'` 并点击\
  \ `Color`，在脚本参考中查看有关该类的更多信息，包括其他可用的快捷颜色。颜色由四个属性组成：红色、绿色、蓝色和透明度（Alpha）。这三个颜色属性各自是一个介于\
  \ 0 和 1 之间的浮点数值，其中 0 表示无色，1 表示全色。颜色是叠加的，因此 r、g、b 值为 0、0、0 时产生黑色，而 1、1、1 时产生白色。第四个值，透明度属性，是透明程度，其中\
  \ 0 表示完全透明，1 表示完全不透明。图 4-12 中列出的颜色快捷方式包括了 r、g、b、a 的值，因此你可以看到是哪种组合构成了最终的快捷颜色。\n\n\
  ![A978-1-4302-6587-0_4_Fig12_HTML.jpg](img/A978-1-4302-6587-0_4_Fig12_HTML.jpg)\n\
  \n图 4-12. Color 类中提供的快捷颜色\n\n对于除快捷颜色之外的任何颜色，你必须直接设置 r、g、b、a 值。将脚本编辑为以下内容：\n\n```\n\
  #pragma strict\n\n// 声明包含颜色值的变量。\nprivate var red : float;\nprivate var green :\
  \ float;\nprivate var blue : float;\nprivate var alpha : float;\n\nfunction Start()\n\
  {\n    // 在 Start 时，通过调用随机数生成函数来设置颜色属性值。\n    red = RandomColorValue();\n    green\
  \ = RandomColorValue();\n    blue = RandomColorValue();\n    alpha = RandomColorValue();\n\
  \    gameObject.renderer.material.color = Color(red, green, blue, alpha);\n    //\
  \ 将随机颜色值打印到控制台。\n    print(gameObject.renderer.material.color);\n}\n\n// 生成一个介于\
  \ 0.000 和 1.000 之间的随机值。\nfunction RandomColorValue() {\n    var randomValue : float;\n\
  \    randomValue = Random.Range(0.000, 1.000);\n    return randomValue;\n}\n```\n\
  \n保存脚本，回到编辑器中进入播放模式，你会看到游戏开始时球体显示为随机颜色。注意 r、g、b、a 颜色值也会打印到控制台。退出播放模式。\n\n你在第 2 章中使用过`Random.Range`，当时你了解到它接受的两个参数是你希望从中选取随机数的最小值和最大值。如果必要，按住\
  \ `Ctrl`+`'` 并点击 `Random.Range` 以打开脚本参考并刷新记忆。\n\n\n\n### 帧率\n\n现在你已经有了在`Start()`中设置球体材质颜色的代码。`Start()`只被调用一次，因此任何对颜色的进一步更改都需要放在`Update()`中。`Update()`每帧都被调用，游戏引擎渲染帧的速率称为帧每秒或\
  \ FPS。帧率过低会失去运动的错觉，而更高的帧率意味着更流畅、响应更快的游戏体验。\n\n游戏运行时的帧率是不断变化的，因为它取决于每帧所需的计算量。单个帧可能需要数千次计算，但这里为了便于说明，我们将数字保持简单。你的代码越笨重（优化越差），每帧的处理时间就越长（图\
  \ 4-13）。\n\n![A978-1-4302-6587-0_4_Fig13_HTML.jpg](img/A978-1-4302-6587-0_4_Fig13_HTML.jpg)\n\
  \n图 4-13. 每帧的计算量可能不同\n\n除了代码要求之外，主处理器和图形芯片的硬件计算能力也限制了帧率。当你比较购买电脑时，看到“2.9 GHz Intel\
  \ Core i7”这样的规格，其中的 2.9 GHz（吉赫兹）指的是英特尔芯片内部“时钟”的处理速度。\n\n在这个简化示例中，假设处理器每个时钟周期或“滴答”可以完成一次计算。处理器\
  \ A 的芯片速度比处理器 B 慢。在相同的游戏条件下，处理器 A 的帧率将低于处理器 B（如图 4-14 所示）。\n\n![A978-1-4302-6587-0_4_Fig14_HTML.jpg](img/A978-1-4302-6587-0_4_Fig14_HTML.jpg)\n\
  \n图 4-14. 两个不同处理器内部时钟速度的对比说明\n\n随着新游戏主机和设备制造出更快的处理器，旧设备的时钟速度将相对较慢。在某个时间点，旧芯片将无法跟上新游戏和游戏引擎的复杂性。你的代码效率越高，旧芯片就越容易处理你的游戏，从而让你的游戏能够覆盖更广阔的市场。\n\
  \n使用最高效的函数和代码结构来减少计算需求以提高帧率，这被称为优化。虽然第 12 章专注于游戏优化，但你将在本书和 Unity 文档中看到旨在实现更好优化的游戏开发良好实践的提示。\n\
  \n### `Time.deltaTime`\n\n从视频和电影中你知道，你可以基于稳定的帧率看到流畅的角色运动。如果游戏的帧率每帧都不同，你得到的将是断断续续、不平稳的运动。你刚刚了解到硬件处理速度和脚本计算都会影响帧率。该怎么办呢？\n\
  \n`Time.deltaTime`来救场了。“Delta”指的是希腊字母 delta（Δ），这是数学中用来表示值变化的符号。在这种情况下，它特指渲染前一帧所花费的以秒为单位的时间变化。\n\
  \n例如，速度或运动，是距离/时间的度量，比如英里每小时。由于帧率每帧都在变化，为了让游戏对象显示稳定的速度，游戏引擎需要计算每秒的位置变化，而不是每帧的变化。`Time.deltaTime`是用于使这类计算与帧率无关（即基于真实时间）的转换因子。\n\
  \n### 在`Update`中编写脚本\n\n将以下变量声明添加到脚本中的其他声明旁：\n\n`public var waitTime : float = 5f;`\n\
  \n`waitTime` 是一个公开变量，保存一个表示球体颜色变化前需要等待的秒数的值。由于它是一个公开变量，你可以在 Inspector 中直接调整它以覆盖脚本中赋值\
  \ 5 的变量声明，从而改变从游戏开始到球体变成随机颜色的时间。\n\n现在添加`Update()`函数代码：\n\n```\nfunction Update()\n\
  {\n        waitTime -= Time.deltaTime;\n        if (waitTime < 0.0f) {\n       \
  \ gameObject.renderer.material.color = Color.blue;\n        }\n}\n```\n\n这段新代码分解如下：\n\
  \n`(1)     waitTime -= Time.deltaTime;`\n\n每次调用`Update()`函数时，自上一帧渲染以来的时间会从`waitTime`中减去。\n\
  \n`(2)     if (waitTime < 0.0f) {`\n\n检查`waitTime`是否已倒计时到零。\n\n`(3)     gameObject.renderer.material.color\
  \ = Color.blue;`\n\n如果`waitTime`已耗尽，则将球体材质颜色改为蓝色。如果`waitTime`尚未耗尽，则花括号内的代码不会执行，当前材质颜色在本帧保持不变。\n\
  \n保存并播放。等待一下，然后…… 是的！五秒后，球体从随机颜色变为蓝色。由于你将`waitTime`声明为公开变量，你可以在 Inspector 中作为脚本组件的一部分找到它。在此处\
  \ Inspector 中进行的任何更改都将覆盖初始脚本化的`waitTime`值 5。\n\n### 用户输入\n\n这有点意思了，但进入和退出播放模式变得乏味。添加一些玩家交互，这样当按下\
  \ N 键（代表新颜色）时，就会为球体的材质生成一个随机颜色。你不知道玩家何时会按下 N 键，所以使用`Update()`函数在每一帧检查这个按键。编辑`Update()`函数，在末尾添加以下代码行：\n\
  \n```\nfunction Update()\n{\n        waitTime -= Time.deltaTime;\n        if (waitTime\
  \ < 0.0f) {\n                gameObject.renderer.material.color = Color.blue;\n\
  \        }\n        if(Input.GetKey(KeyCode.N)) {\n                red = RandomColorValue();\n\
  \                green = RandomColorValue();\n                blue = RandomColorValue();\n\
  \                alpha = RandomColorValue();\n                gameObject.renderer.material.color\
  \ = Color(red, green, blue, alpha);\n                waitTime = 5;\n        }\n\
  }\n```\n\n分解这段新代码：\n\n`(1)     if(Input.GetKey(KeyCode.N)) {`\n\n检查键盘上的 N 键是否被按下。![A978-1-4302-6587-0_4_Figd_HTML.jpg](img/A978-1-4302-6587-0_4_Figd_HTML.jpg)\
  \ + ‘在脚本参考文档中查找`Input.GetKey`（图 4-15）。在这里你了解到`GetKey`是一个布尔值，如果指定的键（本例中为 N）被按下，则返回`true`。该参考文档还为你提供了一个方便的链接，指向键标识符，包括修饰键、功能键和其他特殊键。\n\
  \n![A978-1-4302-6587-0_4_Fig15_HTML.jpg](img/A978-1-4302-6587-0_4_Fig15_HTML.jpg)\n\
  \n图 4-15. Unity 脚本参考文档中的`Input.GetKey`和键标识符链接\n\n`(2)             red = RandomColorValue();`\n\
  `(3)             green = RandomColorValue();`\n`(4)             blue = RandomColorValue();`\n\
  `(5)             alpha = RandomColorValue();`\n`(6)             gameObject.renderer.material.color\
  \ = Color(red, green, blue, alpha);`\n\n与`Start()`函数中用于生成新的随机材质颜色的代码行完全相同。\n\n`(7)\
  \             waitTime = 5;`\n\n将`waitTime`重置为 5。在新颜色变化发生五秒后，球体仍将自动变为蓝色。\n\n保存并播放。现在你可以使用鼠标控制摄像机，并使用键盘更改游戏对象的颜色——太好了！\n\
  \n\n\n### 清理代码\n\n再看一下第 2 到第 6 行的描述。它们与 `Start()` 函数中的代码行完全相同。包含大量重复代码行的脚本是“笨重”的，意味着效率较低。当你发现自己使用相同的代码行时，这表明是时候通过创建一个包含重复代码块的函数来简化代码，然后用一个简单的函数调用代替这些代码块。\n\
  \n在 `Update()` 函数下方，添加 `NewColor()` 函数：\n\n```\nfunction NewColor() {\n    red =\
  \ RandomColorValue();\n    green = RandomColorValue();\n    blue = RandomColorValue();\n\
  \    alpha = RandomColorValue();\n    gameObject.renderer.material.color = Color(red,\
  \ green, blue, alpha);\n    waitTime = 5;\n}\n```\n\n现在，无需两次使用这段代码块，你可以在 `Start()`\
  \ 和 `Update()` 函数中用对 `NewColor()` 的调用来替换它：\n\n```\nfunction Start()\n{\n// 开始时，为球体材质设置随机颜色。\n\
  \    NewColor();\n// 将随机颜色值打印到控制台。\n    print(gameObject.renderer.material.color);\n\
  }\n\nfunction Update()\n{\n    waitTime -= Time.deltaTime;\n    if (waitTime < 0.0f)\
  \ {\n        gameObject.renderer.material.color = Color.blue;\n    }\n    if(Input.GetKey(KeyCode.N))\
  \ {\n        NewColor();\n    }\n}\n```\n\n你的 `Start()` 函数变得更简洁、更易读，`Update()` 函数也是如此。如果你发现未来添加的其他过程中想要改变球体颜色，只需一行代码\
  \ `NewColor();` 即可完成。\n\n通过重写部分代码来清理代码被称为重构。在项目推进过程中，为了保持脚本的简洁，养成重构的习惯是个好方法，这最终会让你的工作更轻松。\n\
  \n假设你还希望用户能够通过点击鼠标来改变球体颜色。在你的脚本中 `NewColor()` 下方添加以下函数：\n\n```\nfunction OnMouseDown()\
  \ {\n    NewColor();\n}\n```\n\n这比再次复制六行代码要好得多，不是吗？保存并运行。\n\n如果你没有事先阅读 `OnMouseDown()`\
  \ 脚本参考，你可能会惊讶地发现，在游戏视图中任意位置点击鼠标并不会导致颜色变化——你必须直接点击球体。\n\n![A978-1-4302-6587-0_4_Fige_HTML.jpg](img/A978-1-4302-6587-0_4_Fige_HTML.jpg)\n\
  \n查阅 `OnMouseDown()`，你会在脚本参考描述中发现：只有当鼠标光标悬停在游戏对象的碰撞体上时点击鼠标按钮，该函数才会被调用。\n\n在层级视图或场景视图中选择球体，你会在检查器中看到，就像使用\
  \ Unity 的立方体基本游戏对象时一样，Unity 为球体基本游戏对象创建了必要的碰撞体组件，使其能够按预期与 `OnMouseDown()` 函数配合使用。\n\
  \n### 启用和禁用组件\n\n除了操作组件的属性来实现所需行为外，你还可以启用或禁用整个组件。`OnMouseDown()` 需要与碰撞体组件交互。你已经证明了它能在碰撞体组件存在时正常工作，现在测试如果禁用碰撞体组件，它是否就会失效。\n\
  \n一个简单的验证方法是：在检查器面板中取消选中球体的“球体碰撞体”复选框以禁用它。这个复选框代表一个布尔标志：勾选时启用标志设为 `true`，未勾选时启用标志设为\
  \ `false`。\n\n继续取消选中该复选框，然后进入播放模式进行测试。不出所料，当碰撞体组件被禁用时，尝试用鼠标点击球体不会有任何反应。退出播放模式并重新勾选复选框以启用碰撞体组件。虽然这是测试概念的简便方法，但在游戏过程中启用或禁用组件需要在脚本中完成。\n\
  \n在 `#pragma strict` 之后的变量列表中添加一个新的变量声明：\n\n```\nprivate var sphereCollider : Collider;\n\
  ```\n\n这个变量声明与之前声明的变量略有不同，它的类型是 Collider。`sphereCollider` 变量对于在脚本中访问碰撞体组件的启用属性是必需的。与持有特定数值的\
  \ float 或 int 变量不同，`sphereCollider` 是一个引用变量。它持有的是定义碰撞体数据所在内存地址的引用，而非数据本身。\n\n在 `Start()`\
  \ 函数的末尾添加以下代码行：\n\n```\nsphereCollider = GetComponent(Collider);\n```\n\n`GetComponent(Collider)`\
  \ 获取球体碰撞体组件的引用，并将其赋值给 `sphereCollider` 变量。在后续章节中，你将使用 `GetComponent()` 来访问其他游戏对象的组件（包括脚本）。\n\
  \n![A978-1-4302-6587-0_4_Figf_HTML.jpg](img/A978-1-4302-6587-0_4_Figf_HTML.jpg)\n\
  \n查阅 `GetComponent()`，你会看到一个简短的选项列表（图 4-16）。选择第一个选项：`Component.GetComponent`。在该参考文档的末尾，你会找到\
  \ Unity 关于优化性能的建议。在本例中，Unity 建议尽可能使用 `GetComponent` 并指定类型，而非字符串。在我们的示例中，我们使用了类型：类型为\
  \ Collider 的 `sphereCollider` 变量，而不是包含游戏对象或组件名称或标签的字符串变量。\n\n![A978-1-4302-6587-0_4_Fig16_HTML.jpg](img/A978-1-4302-6587-0_4_Fig16_HTML.jpg)\n\
  \n**图 4-16.** 脚本参考\n\n在脚本参考中查阅 `GetComponent`。\n\n现在在 `Update()` 函数的末尾添加这个条件语句：\n\
  \n```\nif(Input.GetKey(KeyCode.C)) {\n    sphereCollider.enabled = !sphereCollider.enabled;\n\
  }\n```\n\n这个条件判断玩家是否按下了 C 键。如果是，则碰撞体启用标志（一个布尔值）会被切换为相反值。请仔细看看这行代码：\n\n```\n(1) \
  \                     (2)\nsphereCollider.enabled = !sphereCollider.enabled;\n```\n\
  \n在第 2 章中，你了解到 “`!`” 代表逻辑运算符“非”。\n\n`sphereCollider.enabled` 的布尔值要么是 `true`，要么是\
  \ `false`。无论当前值是什么，其“非”值（即相反值）都会被重新赋值给 `sphereCollider.enabled` 标志。\n\n\n\n使用 `!`\
  \ 运算符来翻转布尔值通常被称为**切换**，因为它就像是一个物理开关，只能朝两个方向翻转，类似于电灯在“开”和“关”之间切换。在这个示例中，玩家按下 C 键的效果，与你在检视面板中勾选或取消勾选复选框来启用或禁用组件是完全一样的。实际上，在游戏运行期间，请留意检视面板中的复选框，你会看到该复选框会随着你按下\
  \ C 键而自动勾选或取消勾选。\n\n到目前为止，脚本的完整列表如下：\n\n```\n#pragma strict\n\n// 声明用于存储颜色值的变量。\n\
  \nprivate var red : float;\n\nprivate var green : float;\n\nprivate var blue : float;\n\
  \nprivate var alpha : float;\n\npublic var waitTime : float = 5f;\n\nprivate var\
  \ sphereCollider : Collider;\n\nfunction Start()\n\n{\n\n// 在 Start 中，为球体材质设置随机颜色。\n\
  \nNewColor();\n\n// 将随机颜色值打印到控制台。\n\nprint(gameObject.renderer.material.color);\n\
  \n// 将球体的碰撞器组件赋值给 sphereCollider 变量。\n\nsphereCollider = GetComponent(Collider);\n\
  \n}\n\n// 生成一个介于 0.000 到 1.000 之间的随机值。\n\nfunction RandomColorValue() {\n\nvar randomValue\
  \ : float;\n\nrandomValue = Random.Range(0.000, 1.000);\n\nreturn randomValue;\n\
  \n}\n\nfunction Update()\n\n{\n\nwaitTime -= Time.deltaTime;\n\nif (waitTime < 0.0f)\
  \ {\n\ngameObject.renderer.material.color = Color.blue;\n\n}\n\nif(Input.GetKey(KeyCode.N))\
  \ {\n\nNewColor();\n\n}\n\nif(Input.GetKey(KeyCode.C)) {\n\nsphereCollider.enabled\
  \ = !sphereCollider.enabled;\n\n}\n\n}\n\nfunction NewColor() {\n\nred = RandomColorValue();\n\
  \ngreen = RandomColorValue();\n\nblue = RandomColorValue();\n\nalpha = RandomColorValue();\n\
  \ngameObject.renderer.material.color = Color(red, green, blue, alpha);\n\nwaitTime\
  \ = 5;\n\n}\n\nfunction OnMouseDown() {\n\nNewColor();\n\n}\n```\n\n保存脚本并尝试运行。\n\
  \n### 销毁游戏对象\n\n比起启用/禁用，一种更持久的方法是使用 `Destroy()` 函数来移除组件或整个游戏对象。这可以通过多种不同的方式来实现。\n\
  \n其中一种方法是使用一个类似于我们倒计时让球体变蓝的计时器。使用双斜杠，注释掉 `Update()` 函数中将球体颜色改为蓝色的那行代码，以停用它。\n\n\
  ```\n//gameObject.renderer.material.color = Color.blue;\n```\n\n在它的正下方，并且仍然在条件语句的大括号内，添加：\n\
  \n```\nDestroy(gameObject);\n```\n\n保存并运行。五秒后，球体不再变蓝，而是消失了。\n\n回到脚本中，注释掉对 `Destroy()`\
  \ 的调用。当两行代码都被注释掉后，五秒标记点将不会有任何变化。使用双斜杠来注释代码是一种很好的快捷方式，可以启用和禁用短代码块以进行测试或调试，而无需重新输入或剪切粘贴多行代码。\n\
  \n你可以让玩家通过向 `Update()` 函数添加另一个 `GetKey()` 条件来销毁球体，如下所示：\n\n```\nif(Input.GetKey(KeyCode.D))\
  \ {\n\n        Destroy(gameObject);\n\n}\n```\n\n保存脚本并运行。当你按下 D 键时，球体会立即被销毁。但是等等，你说，我漏掉了一些东西。你巧妙地使用了\
  \ ![A978-1-4302-6587-0_4_Figh_HTML.jpg](img/A978-1-4302-6587-0_4_Figh_HTML.jpg)\
  \ + ‘ 浏览了 `Destroy()` 函数的脚本参考，并发觉它可以接受一个可选的第二个浮点参数，该参数表示内置的时间延迟。\n\n将 `Destroy(gameObject);`\
  \ 这一行改为 `Destroy(gameObject, 2);`。保存并运行，以演示现在按下 D 键后，球体在销毁前会有两秒的延迟。使用此参数代替我们之前的代码来创建时间延迟，可以减少实现相同目标所需的代码总行数。\n\
  \n实现相同结果的方法通常不止一种。请保持警惕，当你发现更有效的解决方案时，不要犹豫，立即重构你的代码。\n\n## 实例化\n\n到目前为止，你已经经历了游戏对象从游戏开始到确定其在游戏过程中的行为的完整生命周期，这是通过编写代码来修改、启用和禁用游戏对象组件来实现的。\n\
  \n你学习了在运行时销毁游戏对象，但还没有学会如何创建它。在这些示例中，你使用了在运行时之前已创建并放置在场景中的球体游戏对象。\n\n`Instantiate()`\
  \ 对于创建游戏对象的副本特别有用。什么是游戏对象的副本？预制件！你知道预制件是游戏对象的蓝图。实例化就是根据这个蓝图创建游戏对象副本的过程，这个副本被称为实例。\n\
  \n从层级视图中，将球体拖入项目面板的预制件文件夹中。你会看到一个新的球体预制件出现在粉红玫瑰立方体预制件旁边。通过场景视图或层级视图选中球体，然后从编辑器顶部的菜单中选择“编辑\
  \ ➤ 删除”，以此将球体从场景视图中删除。再次使用编辑器顶部的菜单，选择“游戏对象 ➤ 创建空对象”。空游戏对象的变换工具会在场景视图中出现。\n\n在项目面板中，选择脚本文件夹，然后在控制栏中选择“创建\
  \ ➤ JavaScript”，并将新脚本命名为 `CreateSpheres`。将脚本图标拖到层级视图中的空游戏对象上，以将其附加上去。`CreateSpheres`\
  \ 脚本应该作为空游戏对象的一个新组件出现在检视面板中（图 4-17）。\n\n![A978-1-4302-6587-0_4_Fig17_HTML.jpg](img/A978-1-4302-6587-0_4_Fig17_HTML.jpg)\n\
  \n图 4-17. 在检视面板中，`CreateSpheres` 脚本作为空游戏对象的一个组件显示\n\n在 MonoDevelop 中打开 `CreateSpheres`\
  \ 脚本。在 `#pragma strict` 下方，为球体预制件的新实例声明一个新变量。\n\n```\npublic var newSphere : GameObject;\n\
  ```\n\n在 `Update()` 函数中，添加以下代码行：\n\n```\nif(Input.GetKey(KeyCode.Space)) {\n\n \
  \       var instance : GameObject = Instantiate(newSphere);\n\n}\n```\n\n保存脚本并返回编辑器。现在你可以看到\
  \ Unity 美化后显示为“球体”的 `newSphere` 变量。在项目面板中选择预制件文件夹。将球体预制件从项目面板拖到检视面板中游戏对象的新球体属性上，并将其放到“无”之上，以便它显示在新球体区域中（参见图\
  \ 4-18）。\n\n![A978-1-4302-6587-0_4_Fig18_HTML.jpg](img/A978-1-4302-6587-0_4_Fig18_HTML.jpg)\n\
