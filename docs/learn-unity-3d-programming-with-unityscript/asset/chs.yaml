- '# 手里剑粒子系统引擎


  Unity 从 3.5 版本开始引入了手里剑粒子系统引擎。虽然 3D 模型和动画必须在 Unity 外部创建，但手里剑粒子引擎让您能够创建自己的粒子效果，例如火焰、雨水等。在本章中，您将学习如何使用粒子系统创建特殊效果，然后进一步学习如何通过脚本控制它们。


  粒子系统在视觉上非常动态。您最好打开编辑器，以便查看粒子的运动状态以及它们如何响应系统模块的设置（图 8-1）。


  ![A978-1-4302-6587-0_8_Fig1_HTML.jpg](img/A978-1-4302-6587-0_8_Fig1_HTML.jpg)


  图 8-1. 场景视图中的默认粒子系统


  在 Unity 编辑器中，打开“障碍赛道”场景。从顶部菜单中选择 `Game Object ➤ Create Other ➤ Particle System`。在场景视图中，新创建的粒子系统会出现，并立即开始按照默认设置发射粒子。


  您会注意到粒子系统的控制按钮也出现在场景视图的右下角。暂停和停止按钮的功能不言自明。当您将 `Playback Speed`（播放速度）分别更改为 10、0.1
  然后改回 1.00 时，可以观察其中的差异。播放时间有助于协调构成粒子效果的系统以及进行常规的微调。


  在进一步深入之前，先介绍一些术语。粒子是由粒子系统成组发射的对象。它们通常由简单形状的纹理组成，以 2D 广告牌的形式发射。广告牌是一个带有纹理的平面，它始终面向摄像机，从而用
  2D 对象呈现出 3D 效果。


  请记住，游戏性能取决于场景的“繁忙”或“沉重”程度。根据游戏的需求，粒子可以是 3D 的，甚至可以使用 `Texture Sheet Animation`（纹理表动画）模块制作成动画（图
  8-2）。虽然尝试它们很有趣，但请在游戏中合理使用：只使用您需要的粒子，并且只在使用它们的时间内使用。


  ![A978-1-4302-6587-0_8_Fig2_HTML.jpg](img/A978-1-4302-6587-0_8_Fig2_HTML.jpg)


  图 8-2. 在检视面板中看到的默认粒子及其右侧显示的纹理


  粒子系统是发射粒子的组件。它拥有许多模块和设置，可以实现各种各样的效果。粒子系统还可以组合成组，以创建更复杂的粒子效果。


  ![A978-1-4302-6587-0_8_Fig3_HTML.jpg](img/A978-1-4302-6587-0_8_Fig3_HTML.jpg)


  图 8-3. 检视面板中粒子系统组件的初始模块


  当您在检视面板中查看 `Particle System`（粒子系统）组件时（图 8-3），您会发现它提供了强大的编辑能力。在阅读属性描述时，请花时间调整其值，并使用场景视图中粒子系统控制器的
  `Simulate/Stop`（模拟/停止）按钮，观察默认粒子系统如何响应。


  前几个属性控制粒子系统发射粒子。`Duration`（持续时间）是粒子系统发射粒子的时间（秒）。要获得持续效果，您可以勾选 `Looping`（循环）复选框。如果您使用
  `Looping`（循环）并勾选 `Prewarm`（预热）复选框，粒子将显示为仿佛一直在发射。如果您希望在粒子发射开始前有一段延迟，则在不勾选 `Prewarm`（预热）的情况下使用
  `Start Delay`（起始延迟），指定发射粒子前等待的时间（秒）。


  接下来的一组属性控制单个粒子的行为。您可以使用 `Start Lifetime`（起始生命周期）指定每个粒子的生命周期（秒）。`Start Speed`（起始速度）、`Start
  Size`（起始大小）和 `Start Rotation`（起始旋转）顾名思义：分别是粒子首次发射时的初始速度、大小和旋转。这四个属性都可以在相应的字段中指定数值，也可以使用随机范围或曲线进行进一步自定义。


  `Start Color`（起始颜色）也是如此，它提供了更多控件来改变粒子的颜色（包括不透明度的 Alpha 值）在其生命周期内的变化。


  通过使用 `Gravity Multiplier`（重力乘数），您可以实现诸如向上漂浮的烟雾或落向地面的流体飞溅等效果。


  粒子系统像任何其他游戏对象一样可以运动。当它们移动时，您可以使用 `Inherit Velocity`（继承速度）来决定粒子应继承多少速度。


  `Simulation Space`（模拟空间）允许您在 `Local`（局部）空间或 `World`（世界）空间之间进行选择。当勾选时，`Play on Awake`（唤醒时播放）选项会告诉粒子系统在创建后自动启动。最后，`Max
  Particles`（最大粒子数）是系统在一个周期内发射的粒子总数。


  ![A978-1-4302-6587-0_8_Fig4_HTML.jpg](img/A978-1-4302-6587-0_8_Fig4_HTML.jpg)


  图 8-4. 检视面板中粒子系统组件的更多模块


  检视面板中的其余项目是更多模块。单击每个模块可以查看其可控的属性（图 8-4）。请记住，虽然单个粒子系统并不每次都使用每个模块，但手里剑为您提供了丰富的选项（表
  8-1）。


