- '# Unity 入门指南


  现在是学习游戏开发的最佳时机。Unity 已成为游戏开发者最青睐的游戏引擎之一，而 Unity Technologies 公司也在持续进行重大革新，让独立开发者更容易上手。如今
  Unity 游戏可以移植到的平台越来越多（这意味着它能在众多设备上运行），资源商店（Asset Store）为集中管理游戏资源提供了便利，此外 Unity 还提供了出色的支持服务，甚至拓展到为你的游戏提供专业评估和反馈。在撰写本文时，甚至有一个全新部门专门与开发者合作并发行游戏。制作游戏本身就是一种奇妙的体验，比获得高分或近乎不可能的爆头击杀更能让你引以为豪。欢迎加入这场乐趣之旅！


  Unity 团队所说的"游戏"也涵盖了不断发展的"严肃游戏"领域——即使用 Unity3D 为日益增长的行业和应用场景开发的模拟及其他沉浸式交互体验。从 NASA
  的火星探索、CliniSpace 的虚拟医疗培训环境，到 CrossPlatform DeSign 的动画犯罪现场重建和虚拟工业培训师，严肃游戏正以前所未有的速度出现在各个新领域。如果你有志于严肃游戏开发，我相信
  Unity 是最佳工具，而本书则是理想的起点。


  本书假设你拥有一台电脑，并且能够熟练使用网络浏览器下载文件——仅此而已。如果你对游戏开发感兴趣，但之前没有接触过 Unity、编程或数字艺术/内容创作，那么这本书正适合你。如果你在这方面已有一定基础，你会发现本书能帮助你了解
  Unity、编程或 Unity 脚本编写。


  你可能有一个游戏创意，或者想帮助他人将创意变为现实。最优秀的游戏往往能提供最佳用户体验。用户体验源于游戏的视觉与感觉，也就是图形和代码两个方面。图形或美术设计的重要性显而易见：这是用户直接看到的内容，它能够营造氛围并吸引用户。而代码则是隐藏在表象之下的核心，同样至关重要。世界上最精美的图形也无法弥补游戏运行缓慢、反应异常、流程不连贯或直接崩溃的缺陷。Unity
  之所以成为游戏开发者强大且受欢迎的工具，正是因为它能让你掌控这两个重要方面，并将它们无缝融合，创造令人愉悦的体验。


  初学者书籍常用的方法是引导读者创建一个简单游戏，在此过程中逐步介绍和解释其特定功能，然后让读者去查阅"官方文档"。然而这些文档往往如同古埃及象形文字般晦涩难懂，实用性大打折扣。作为初学者，我常常因此感到困惑，不知道在示例游戏之外该如何继续前进。


  本书旨在将你领入游戏开发的世界。我希望你在学习使用 Unity 的同时，能够打下坚实的脚本编写基础，特别是熟悉编程模式。我将教你如何阅读文档，以及它如何融入这种编程模式，这样你就能自信地利用文档持续提升技能、拓展知识，在完成本书后制作出更宏大、更优质的游戏。


  本书的配套网站是 [`www.learn-unityscript.com`](http://www.learn-unityscript.com/)，你可以在那里提问并分享你的游戏——一定要让我知道！你也可以通过
  `janine@learn-unityscript.com` 联系我。本书的源代码可在 [`www.apress.com`](http://www.apress.com/)
  页面的"源代码/下载"标签下找到。


  ## 什么是 UnityScript？


  UnityScript 是基于 .NET 的 JavaScript 方言，因此其语法与流行的网页 JavaScript 方言相似。在 Unity 网站和编辑器中，它被称为"UnityScript"、"JavaScript"、"Java
  Script"和"Javascript"，但它与网页 JavaScript 并不相同。实际应用中有两点需要注意：(1) 从互联网上搜索到的 JavaScript
  代码片段，如果不是专门为 Unity 编写的，可能无法正常工作；(2) Unity 支持的 C#、UnityScript 和 Boo 这三种语言在速度和性能上没有差异。


  ## 预备知识


  无需编程、游戏开发或图形艺术方面的经验。投身游戏开发并非易事，但绝对充满乐趣且能带来个人成就感。你必须热爱学习——这是一个快速发展的领域，总有新东西需要学习，但这也意味着它会随着时间的推移变得越来越好，为你的游戏带来更多炫酷功能，并为你提供更强大的工具来构建它们。我认为开发游戏和玩游戏一样有趣，所以这个过程更像是"升级"我的技能。


