  \ 13-6）。这是 Xbox 开发者网站，但也涉及针对 Web、Kinect 以及 Windows 电脑、平板和手机的应用开发。\n  ![A978-1-4302-6587-0_13_Fig6_HTML.jpg](img/A978-1-4302-6587-0_13_Fig6_HTML.jpg)\n\
  \  图 13-6. 微软 Xbox 开发者注册，并提供其其他设备的更多信息\n\n- **任天堂**：[`http://wiiu-developers.nintendo.com`](http://wiiu-developers.nintendo.com/)（图\
