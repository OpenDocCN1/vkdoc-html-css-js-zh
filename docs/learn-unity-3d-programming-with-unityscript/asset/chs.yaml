  ### Flare（光晕）


  将光的`Transform`位置设置为`(0, 2, 3)`，`Type`设置为`Point`。从顶部菜单中选择**Assets ➤ Import Package
  ➤ Light Flares**。此时会打开`Import Packages`窗口，其中列出了 Unity 标准资源（Standard Assets）中可用的光晕（Light
