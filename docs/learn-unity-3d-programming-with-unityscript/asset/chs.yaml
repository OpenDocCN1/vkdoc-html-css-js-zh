  ## 总结


  你在本章取得了长足的进步。你理解了构成场景的结构，以及必不可少的游戏对象——主摄像机。你了解了游戏对象是组件的容器，以及如何在 Unity 的组件参考文档中快速找到组件。你熟悉了
  Unity 基本形状的游戏对象、摄像机和光源的默认组件。你学会了如何导入资源，并通过天空盒为场景添加色彩，使用材质为游戏对象添加颜色。你甚至尝试了使用遮罩与光晕的一些特殊效果。你正在培养保持项目组织有序的良好习惯。通过创建预制件，你变得更高效，并且知道如何单独或成组地编辑预制件。太棒了！


  不过，有趣的是，对于一本关于脚本编写的书来说，本章竟然一个脚本都没有。这是有意为之。首先，我希望你有机会熟悉 Unity 编辑器的操作。其次，尽管你可以做很多有趣的事情来设置场景，但我想让你注意到，你能做的也仅限于此。如果没有脚本，当你尝试运行它时，它几乎什么都不做。


  别担心——如果你想体验充满动作感的内容，你将在第 4 章中将脚本引入游戏场景时初尝滋味。脚本驱动着游戏对象之间的动作，更不用说玩家与游戏间的交互了。你将循序渐进，开始构建实用的
  Unity 开发和脚本编写技能基础。从这里开始，随着你添加动画、真实的物理行为、粒子效果等等，一切会变得越来越好。


