  \  图 13-11. 使用 Unity 创建基于 Vuforia 或 Metaio 的增强现实游戏\n\n- **Leap Motion**：[`http://developer.leapmotion.com`](http://developer.leapmotion.com/)。Leap\
  \ Motion 是一款运动检测控制器。开发者支持直接在其网站上提供。Unity 资源商店上可用的专有和独立创建的 Leap Motion 资产数量持续增长（图\
