  \n图 10-2. 修订后的障碍赛道设计\n\n你还确定了一些附加标准。玩家越深入，障碍赛道应该变得越难。在每个区域内，你会以从起点到终点逐渐增加难度的方式布置危险物。你将在每个区域之间设置一段狭窄的安全区，让玩家在进入下一个区域前喘口气并重新组织。\n\
  \n首先，根据 z 坐标将空白部分划分为大小相近的区域。找到已定义的点，例如斜坡与高架轨道的连接处、移动平台的两侧、第一个摆锤的起点和第三个摆锤的终点，最后是高架轨道与第二个斜坡的连接处。剩下的工作是将第三个摆锤终点到斜坡起点之间的高架轨道分为三部分（图\
  \ 10-3）：\n\n![A978-1-4302-6587-0_10_Fig3_HTML.jpg](img/A978-1-4302-6587-0_10_Fig3_HTML.jpg)\n\
  \n图 10-3. 由 z 坐标位置标识的区域边界\n\n任何项目都可以分解为可管理的任务组件。在这种情况下，你已将障碍赛道划分为区域，因此有条理的方法是按顺序逐一处理。\n\
  \n## 游戏测试与作弊码\n\n在测试障碍赛道时，每次玩家角色死亡后重新启动游戏并跑上斜坡可能会有点繁琐，但有一种解决方法：你可以内置快捷方式。\n\n这就是作弊码的起源——游戏开发者需要一种快速测试游戏特定行为或功能的方法，而某些“作弊”功能如无敌、无限财富或超级力量正好满足了这一需求。如今，围绕作弊码已经形成了一个完整的产业，游戏开发者往往有意将其保留在最终发布版本中。\n\
  \n如果尚未打开，请打开你的障碍赛道场景。第一个作弊码将把玩家角色重新定位到斜坡顶部。在项目面板的 Assets 文件夹中，创建一个名为`Cheats`的新脚本。在\
  \ MonoDevelop 中打开脚本并编辑代码如下：\n\n```\n#pragma strict\n\npublic var player : GameObject;\n\
  \nfunction Start () {\n    player = GameObject.FindWithTag(\"Player\");\n}\n\nfunction\
  \ Update () {\n    if(Input.GetKeyDown(KeyCode.Alpha1)) {\n        if (player !=\
  \ null) {\n            player.transform.position = Vector3(0, 9, 18);\n        \
  \    player.gameObject.GetComponent(GoRagdoll).ExitRagdoll();\n        }\n    }\n\
  }\n```\n\n其分解如下：\n\n1. `public var player : GameObject;` — 声明一个类型为`GameObject`的公共变量`player`。\n\
  \n2. `player = GameObject.FindWithTag(\"Player\");` — 当调用`Start()`函数时，通过其`Player`标签找到对玩家角色的引用，并将其赋值给`player`。\n\
  \n3. `if(Input.GetKeyDown(KeyCode.Alpha1)) {` — 在每一帧调用`Update()`时，检查玩家是否按下了字母数字键盘上的\
  \ 1 键。如果是，则执行后续代码块。\n\n4. `if (player != null) {` — 测试是否存在有效的`GameObject`引用。如果不是`null`，则执行代码块。\n\
  \n5. `player.transform.position = Vector3(0, 9, 18);` — 通过重置其`Transform`位置坐标，将玩家移动到斜坡顶部。\n\
  \n6. `player.gameObject.GetComponent(GoRagdoll).ExitRagdoll();` — 如果玩家角色已死亡，需要将其重置出布娃娃模式，以便玩家继续。接下来你将创建`ExitRagdoll()`函数。\n\
  \n在 Unity 编辑器顶部菜单中，选择 Game Object ➤ Create Empty。在层级视图中选择新的游戏对象并将其重命名为`Cheats`。该游戏对象的唯一用途是承载作弊码脚本。将其`Transform`位置改为`(0,\
  \ 20, 0)`，以将其移出视线。现在，通过将`Cheats`脚本拖到场景视图中的`Cheats`游戏对象上，或在检查器中通过 Add Component ➤\
  \ Scripts 并从菜单中选择`Cheats`脚本，来附加该脚本。\n\n你仍需要为玩家角色创建`ExitRagdoll()`函数。在项目面板的 Assets\
  \ ➤ Scripts 文件夹中，选择`GoRagdoll`脚本并在 MonoDevelop 中打开。此函数仅需逆转第 7 章中创建的`GotoRagdoll()`函数所做的所有操作。首先，选中`GotoRagdoll()`函数并复制它。在`GotoRagdoll()`函数的闭合大括号之后，将复制的代码粘贴回脚本中，然后将复制的函数名改为`ExitRagdoll`。将所有布尔标志改为其替代设置，你的`ExitRagdoll()`函数现在应如下所示：\n\
  \n```\nfunction ExitRagdoll () {\n    if (childRigidBodies != null) {\n        for\
  \ (var childRigidBody : Rigidbody in childRigidBodies)\n        {\n            childRigidBody.isKinematic\
  \ = true;\n        }\n    }\n    if (childColliders != null) {\n        for (var\
  \ childCollider : Collider in childColliders)\n        {\n            childCollider.enabled\
  \ = false;\n        }\n    }\n    gameObject.collider.enabled = true;\n    gameObject.rigidbody.isKinematic\
  \ = false;\n    gameObject.GetComponent(Animator).enabled = true;\n    gameObject.GetComponent(ThirdPersonCharacter).enabled\
  \ = true;\n    gameObject.GetComponent(ThirdPersonUserControl).enabled = true;\n\
  }\n```\n\n保存脚本，返回 Unity 编辑器，保存场景，然后进行游戏测试。只要你按下 1 键，玩家角色就会回到斜坡顶部。如果玩家角色已死亡，它会重新复活并准备就绪。太棒了——这肯定会加速游戏测试！\n\
  \n\n\n### 雷区\n\n要制作一个地雷，我们只需要地雷本身和一个接触引爆装置。使用示例资源中的`Ball`预设作为地雷模型，以及`Explosion`粒子效果实现爆炸，可以快速简便地构建一个地雷。\n\
  \n在项目面板中，依次展开`Assets ➤ Sample Assets ➤ Vehicles ➤ Rolling Ball ➤ Prefabs`文件夹并打开它。你会在其中找到一个`Ball`预设。你也可以使用\
  \ Unity 的原始球体，但这个黑色球体看起来更有威慑力。\n\n将一个`Ball`预设拖拽到场景视图中，并将其变换位置设置为`(0, 9, 18)`。在层级面板中，将其重命名为`Land\
  \ Mine`。由于碰撞体嵌入到了轨道中，物理引擎会根据这种似乎存在的“碰撞”来移动该`Land Mine`，但这并不是你想要的效果。在层级面板中保持选中`Land\
  \ Mine`，在检视面板中找到`Sphere Collider`组件并勾选`Is Trigger`。接着，在`Rigidbody`组件中，取消勾选`Use Gravity`，这样在游戏运行时`Land\
  \ Mine`就会停留在原地。紧接着，勾选`Is Kinematic`复选框。这将防止周围的地雷受到引爆地雷的爆炸力影响。\n\n继续往下看检视面板，`Ball`和`Ball\
  \ User Control`脚本是不需要的。点击每个脚本组件上的齿轮图标，在上下文菜单中选择`Remove Component`（图 10-4）。\n\n![A978-1-4302-6587-0_10_Fig4_HTML.jpg](img/A978-1-4302-6587-0_10_Fig4_HTML.jpg)\n\
  \n**图 10-4.** 在检视面板中从`Land Mine`游戏对象中移除`Ball`和`Ball User Control`脚本\n\n最后，你需要一个脚本来指示：如果玩家角色与地雷发生接触，地雷就会爆炸，从而摧毁地雷并杀死玩家角色。在项目面板中打开`Assets\
  \ ➤ Script`，然后创建一个名为`LandMineExplosion`的新脚本并在 MonoDevelop 中打开它。按如下方式编辑代码：\n\n```csharp\n\
  #pragma strict\n\npublic var victim : GameObject;\npublic var explosionPrefab :\
  \ GameObject;\n\nfunction Start () {\n    victim = GameObject.FindWithTag(\"Player\"\
  );\n}\n\nfunction OnTriggerEnter (collider : Collider) {\n    if (collider.gameObject\
  \ == victim) {\n        Explosion();\n    }\n}\n\nfunction Explosion () {\n    victim.GetComponent(GoRagdoll).GotoRagdoll();\n\
  \    Instantiate (explosionPrefab, transform.position, Quaternion.identity);\n \
  \   Destroy(gameObject);\n}\n```\n\n这段代码的解析如下：\n\n`(1)     private var victim :\
  \ GameObject;`\n\n声明一个私有的`GameObject`类型引用变量`victim`，用于存放玩家角色的引用。\n\n`(2)     public\
  \ var explosionPrefab : GameObject;`\n\n声明一个公共的`GameObject`类型引用变量`explosionPrefab`，用于存放爆炸粒子效果。\n\
  \n`(3)     victim = GameObject.FindWithTag(\"Player\");`\n\n查找玩家角色游戏对象的引用并赋值给`victim`。\n\
  \n`(4)     function OnTriggerEnter (collider : Collider) { if (collider.gameObject\
  \ == victim) {`\n\n当碰撞体检测到与另一个游戏对象接触时，检查该游戏对象的身份，看它是否为玩家。如果是，\n\n`(5)     Explosion();`\n\
  \n则调用`Explosion()`函数。\n\n`(6)     function Explosion () { victim.GetComponent(GoRagdoll).GotoRagdoll();`\n\
  \n在`Explosion()`函数中，访问角色玩家的`GoRagdoll`脚本并调用`GotoRagdoll()`函数。\n\n`(7)     Instantiate\
  \ (explosionPrefab, transform.position, Quaternion.identity);`\n\n实例化（创建）一个`Explosion`粒子效果预设的实例。\n\
  \n`(8)     Destroy(gameObject);`\n\n销毁`Land Mine`游戏对象。\n\n保存脚本并返回 Unity 编辑器。将`LandMineExplosion`脚本附加到`Land\
  \ Mine`游戏对象上。选中`Land Mine`游戏对象，查看`Land Mine Explosion`脚本组件，会注意到`PrefabExplosion`属性是空的。在项目面板中，打开`Assets\
  \ ➤ Sample Assets ➤ Effects ➤ Particle Systems ➤ Prefabs`文件夹，找到`Explosion`预设。将`Explosion`预设拖拽到`Land\
  \ Mine`游戏对象上。现在，将此预设拖拽到检视面板中的`PrefabExplosion`属性字段中。你的地雷就制作完成了。\n\n为了将其制作成一个预设，以便在本区域放置多个地雷，请在项目面板中打开你的`Assets\
  \ ➤ Prefabs`文件夹，并将层级面板中的`Land Mine`拖拽到其中。\n\n在布置雷区之前，请注意，你可以通过将地雷进一步下沉到高架轨道中来制作不同高度和宽度的地雷（图\
  \ 10-5）。\n\n![A978-1-4302-6587-0_10_Fig5_HTML.jpg](img/A978-1-4302-6587-0_10_Fig5_HTML.jpg)\n\
  \n**图 10-5.** `Land Mine`游戏对象在 y 轴上的位置决定了暴露的障碍物大小\n\n你将通过从项目面板的 Prefab 文件夹中拖拽`Land\
  \ Mine`预设来布置雷区。让自己回到游戏设计模式，思考一下如何布局雷区。图 10-6 展示了几种可能的方案，从一种大小均匀、间距规则的简单模式开始。\n\n\
  ![A978-1-4302-6587-0_10_Fig6_HTML.jpg](img/A978-1-4302-6587-0_10_Fig6_HTML.jpg)\n\
  \n**图 10-6.** 各种地雷散布模式\n\n请记住，你想让这个区域的难度从起点到终点逐步增加，你可以考虑随着玩家前进，增加地雷的尺寸或密度。或者，你可能希望构建一条只有一条可幸存路径的雷区，或者使用完全随机的分布。\n\
  \n选择哪种方式？这取决于你认为哪种方式更有趣，并且更符合你的游戏主题。但当你放置地雷并进行游戏测试时，你可能需要根据游戏过程中的模式效果，切换到不同的选项。\n\
  \n在考虑地雷布局时，要时刻想着玩家。玩家刚刚开始游戏，所以也才刚刚开始熟悉玩家角色的移动和响应。尝试创建一条路径，起始处宽阔、转弯轻松，但随后变得狭窄且曲折，这反过来会迫使玩家更精确地使用控制器。你可能甚至需要一次跳跃，才能到达通往移动平台的缺口边缘的最终“安全”区域。进行游戏测试和调整，直到你对布局满意为止。保存场景。\n\
  \n当你手动布置这个区域时，层级视图中会有许多`Land Mine`游戏对象。你可以使用空的游戏对象来让事情更有条理、更易于管理。在 Unity 编辑器顶部菜单中，选择`Game\
  \ Object ➤ Create Empty`并命名为`Land Mines`。将变换位置设置为`(0, 5, 18)`，使其恰好位于雷区起点处的高架轨道下方。\n\
  \n在层级视图中，选中第一个`Land Mine`游戏对象。向下滚动到最后一个，但这次在点击它之前按住 Shift 键。这将选中列表中第一个和最后一个`Land\
  \ Mine`游戏对象之间的所有对象。将此集合拖拽到`Land Mines`游戏对象上。好多了！再次保存场景。\n\n\n\n### 移动平台区域\n\n作为功能性障碍物，移动平台障碍的设计已经足够完善。只需确保玩家能从与雷区边界相邻的“安全”区域抵达移动平台即可。\n\
  \n在测试过程中你会发现，当前的作弊码会将玩家传送回雷区起点。现在需要为测试移动平台添加一个新的作弊码。在项目面板中，打开 `Assets` ➤ `Scripts`\
  \ 文件夹。双击 `Cheats` 脚本在 MonoDevelop 中编辑。在 `Update()` 函数中，复制现有作弊码，并立即粘贴在条件语句的右花括号之后。将这段条件语句修改为\
  \ `KeyCode.Alpha2`，并将新位置设为 (0, 9, 33.5)，具体如下：\n\n```\nfunction Update () {\n   \
  \ if(Input.GetKeyDown(KeyCode.Alpha1)) {\n        ...\n    }\n    if(Input.GetKeyDown(KeyCode.Alpha2))\
  \ {\n        if (player != null) {\n            player.transform.position = Vector3(0,\
  \ 9, 33.5);\n            player.gameObject.GetComponent(GoRagdoll).ExitRagdoll();\n\
  \        }\n    }\n}\n```\n\n添加此代码后，按键盘上的 2 键即可快速将玩家重新定位到雷区的远端。\n\n考虑到还有五个区域要处理，`Update()`\
  \ 函数会变得越来越臃肿。是时候进行一些重构了。将 `Cheats` 脚本代码修改如下：\n\n```\n#pragma strict\n\npublic var\
  \ player : GameObject;\nprivate var relocationPoint : Vector3;\n\nfunction Start\
  \ () {\n    player = GameObject.FindWithTag(\"Player\");\n}\n\nfunction Update ()\
  \ {\n    CheckInput();\n}\n\nfunction CheckInput () {\n    if(Input.GetKeyDown(KeyCode.Alpha1))\
  \ {\n        relocationPoint = Vector3(0, 9, 18);\n        RelocatePlayer();\n \
  \   }\n    else if(Input.GetKeyDown(KeyCode.Alpha2)) {\n        relocationPoint\
  \ = Vector3(0, 9, 33.5);\n        RelocatePlayer();\n    }\n}\n\nfunction RelocatePlayer(){\n\
  \    if (player != null) {\n        player.transform.position = relocationPoint;\n\
  \        player.gameObject.GetComponent(GoRagdoll).ExitRagdoll();\n    }\n}\n```\n\
  \n这段代码的解析如下：\n\n`(1) private var relocationPoint : Vector3;`\n\n声明一个类型为 `Vector3`\
  \ 的私有变量 `relocationPoint`。\n\n`(2) CheckInput();`\n\n在 `Update()` 函数中调用 `CheckInput()`\
  \ 函数。现在你可以清晰地看到每帧都在检查用户输入。\n\n`(3) function CheckInput () {`\n\n创建一个新的 `CheckInput()`\
  \ 函数，并将原本位于 `Update()` 函数中的玩家输入检测代码移至此处。\n\n`(4) relocationPoint = Vector3(0, 9,\
  \ 18);` 和 `relocationPoint = Vector3(0, 9, 33.5);`\n\n将为该按键关联的新位置赋值给 `relocationPoint`\
  \ 变量。\n\n`(5) RelocatePlayer();`\n\n调用 `RelocatePlayer()` 函数。\n\n`(6) function RelocatePlayer(){`\n\
  \n创建 `RelocatePlayer()` 函数...\n\n`(7) player.transform.position = relocationPoint;`\n\
  \n该函数首先将 `relocationPoint` 变量中的 `Vector3` 值赋给玩家角色的新位置。\n\n请注意，`CheckInput()` 函数中的条件语句也略有变化，从两个独立的\
  \ `if` 条件变为了 `if - else if` 序列。你完全可以保留原来的两个 `if` 条件，但 `else if` 效率更高。举例来说，假设你为七个区域都创建了作弊键。当使用七个\
  \ `if` 条件时，每次调用函数都会检查每一个条件。\n\n假设用户按下了 3 键：\n\n*   处理器代码\n*   评估条件：假（如果按下了 `Alpha1`\
  \ 键）\n*   评估条件：假（如果按下了 `Alpha2` 键）\n*   评估条件：真（如果按下了 `Alpha3` 键）\n*   处理条件内的代码块\n\
  *   评估条件：假（如果按下了 `Alpha4` 键）\n*   评估条件：假（如果按下了 `Alpha5` 键）\n*   评估条件：假（如果按下了 `Alpha6`\
  \ 键）\n*   评估条件：假（如果按下了 `Alpha7` 键）\n*   评估后续代码...\n\n在条件序列中使用 `else if` 意味着，每个条件都会被依次评估，直到找到为真的条件，一旦找到真条件，剩余的\
  \ `else if` 条件就会被跳过。\n\n同样假设用户按下了 3 键：\n\n*   处理器代码\n*   评估条件：假（如果按下了 `Alpha1` 键）\n\
  *   评估条件：假（else if 如果按下了 `Alpha2` 键）\n*   评估条件：真（else if 如果按下了 `Alpha3` 键）\n*  \
  \ 处理条件内的代码块\n*   不评估（else if 如果按下了 `Alpha4` 键）\n*   不评估（else if 如果按下了 `Alpha5` 键）\n\
  *   不评估（else if 如果按下了 `Alpha6` 键）\n*   不评估（else if 如果按下了 `Alpha7` 键）\n*   评估后续代码...\n\
  \n任何能够引入代码的效率优化都能降低处理负担，从而提升整体游戏性能。\n\n\n\n### 加农炮区域\n\n你在第 8 章中创建了一门加农炮，下一步就是将其做成预制件。在项目面板中，打开\
  \ `Assets` ➤ `Prefab` 文件夹。在层级视图中，选中 `Cannon` 游戏对象，将其拖拽到 `Prefab` 文件夹中。然后从层级视图中删除\
  \ `Cannon` 游戏对象。\n\n就像为地雷区域所做的那样，思考一下你将如何在当前区域布置加农炮。这次，在布置加农炮时，需要考虑两个维度：随着玩家在区域中前进的\
  \ z 轴方向，以及相对玩家角色在不同高度的 y 轴方向。通过改变高度，玩家可以运用玩家角色的“蹲伏”动画来躲避危险。\n\n你可以手动布置加农炮：从 `Prefab`\
  \ 文件夹中将其拖拽到场景视图中，然后根据喜好设置 Transform 位置坐标。另一种方法是，你也可以使用脚本来向场景中填充游戏对象（例如障碍物）。例如，创建一个脚本，在区域中随机分布加农炮。\n\
  \n在项目面板中，打开 `Assets` ➤ `Scripts` 文件夹，新建一个名为 `RandomCannonPositions` 的脚本。在 MonoDevelop\
  \ 中打开它，并将代码编辑如下：\n\n```\n#pragma strict\n\npublic var prefab : GameObject;\n\npublic\
  \ var amount : int = 10;\n\nfunction Start () {\n\nfor (var i : int = 0; i < amount;\
  \ i++)\n\n{\n\nvar position: Vector3 = Vector3(5, Random.Range(9.0, 11.0),\n\nRandom.Range(44,\
  \ 53));\n\nInstantiate(prefab, position, Quaternion.Euler(0, 0, 90));\n\n}\n\n}\n\
  ```\n\n其分解说明如下：\n\n`(1) public var prefab : GameObject;`  \n`public var amount :\
  \ int = 10;`  \n声明类型为 `GameObject` 的 `prefab` 引用变量，以及类型为 `int` 的 `amount` 变量，并赋值为\
  \ 10。\n\n`(2) for (var i : int = 0; i < amount; i++)`  \n`for` 循环将根据 `amount` 的值重复执行相应的次数。\n\
  \n`(3) var position: Vector3 = Vector3(5, Random.Range(9.0, 11.0), Random.Range(44,\
  \ 53));`  \n每次循环时，创建一个 `position` 的 `Vector3` 类型变量，并将其 x 坐标值设为 5，使其位于高架轨道右侧；y 坐标介于\
  \ 9 和 11 之间（因为高架轨道表面 y 坐标为 9，且玩家角色高 2 个单位）；z 坐标介于 44 和 53 之间，即该区域的边界范围。\n\n`(4)\
  \ Instantiate(prefab, position, Quaternion.Euler(0, 0, 90));`  \n使用先前生成的位置创建一个新的加农炮预制件实例，并使其绕\
  \ z 轴旋转 90 度，以便瞄准高架轨道的横向方向。\n\n保存脚本。在 Unity 编辑器中，通过顶部菜单 `Game Object` ➤ `Create\
  \ Empty` 创建一个空游戏对象。将其命名为 `Hazard Setup`，并挂载 `RandomCannonPositions` 脚本。将项目面板中 `Assets`\
  \ ➤ `Prefab` 文件夹下的 `Cannon` 预制件拖拽到 Inspector 中 `RandomCannonPositions` 脚本的 `Prefab`\
  \ 属性上。然后在场景视图中将 `Hazard Setup` 游戏对象移开，不要妨碍视线。保存场景。\n\n现在进行游戏测试，你会发现所有加农炮同时开火。为了使发射频率各不相同，请在项目面板的\
  \ `Assets` ➤ `Scripts` 文件夹中找到 `LaunchProjectile` 脚本，并在 MonoDevelop 中打开它。添加一个带有随机选择\
  \ `frequency` 值代码的 `Start()` 函数：\n\n```\n#pragma strict\n\npublic var projectile\
  \ : GameObject;\n\npublic var force : float = 25;\n\npublic var frequency : float\
  \ = 2.0;\n\nprivate var nextLaunch : float = 0.0;\n\nfunction Start () {\n\nfrequency\
  \ = Random.Range(0.5, 2.5);\n\n}\n\nfunction Update () {\n\nif (Time.time > nextLaunch)\
  \ {\n\nnextLaunch = Time.time + frequency;\n\nvar projectileInstance : GameObject\
  \ = Instantiate(projectile,\n\ntransform.position, transform.rotation);\n\nprojectileInstance.rigidbody.AddForce\
  \ (projectileInstance.transform.forward\n\n* force, ForceMode.Impulse);\n\nDestroy(projectileInstance,\
  \ 2);\n\n}\n\n}\n```\n\n保存脚本并保存场景。现在再次进行游戏测试，加农炮区域会呈现出良好的加农炮分布和炮弹发射频率（图 10-7）。\n\
  \n![A978-1-4302-6587-0_10_Fig7_HTML.jpg](img/A978-1-4302-6587-0_10_Fig7_HTML.jpg)\n\
  \n图 10-7. 完成的加农炮区域\n\n你可以轻松添加另一个作弊码来辅助测试，只需在 Cheats 脚本的 `RelocatePlayer()` 函数中添加以下代码：\n\
  \n```\nelse if(Input.GetKeyDown(KeyCode.Alpha3)) {\n\nrelocationPoint = Vector3(0,\
  \ 9, 43);\n\nRelocatePlayer();\n\n}\n```\n\n根据你的喜好进行任何调整，以改善游戏体验。别忘了保存场景和项目。又一个区域完成了——哇！\n\
  \n\n### 摆锤区域\n\n为了保持每个区域强度级别各不相同的游戏设计理念，炮弹区域的强度高于移动平台区域，而摆锤区域的强度低于炮弹区域，而炮弹区域本身又比之前低强度的移动平台区域更具挑战性。这可真是高高低低，起伏不断！\n\
  \n摆锤已经搭建好了。如果你想增加这个区域的难度，可以改变它们的数量、大小和属性。如果你想移动它们，可以按住鼠标左键并拖动光标，将摆锤球连同链条一起框选。这时会出现一个变换控件，你可以使用它来整体移动它们，同时保持它们之间的相对位置。既然它们是一个组，不妨花点时间创建一个空的游戏对象作为摆锤的父级游戏对象，然后对另外两组也这样做。这只是一个简单的原型——想象一下，对于一个更复杂的游戏来说，`Hierarchy`\
  \ 面板会变得多么杂乱和臃肿！\n\n你还可以重复使用一些资源来增加挑战性，例如添加地雷。你可以手动放置它们，或者像处理炮弹一样，创建一个脚本来分配它们的位置。\n\
  \n在 `Project` 面板中，打开 `Assets ➤ Scripts` 文件夹，创建一个名为 `RandomLandMinePositions` 的新脚本。在\
  \ MonoDevelop 中打开它并添加如下代码：\n\n```\n#pragma strict\n\npublic var prefab : GameObject;\n\
  \npublic var amount : int = 10;\n\nfunction Start () {\n\nfor (var i : int = 0;\
  \ i < amount; i++)\n\n{\n\nvar position: Vector3 = Vector3(Random.Range(-3.5, 3.5),\n\
  \nRandom.Range(8.5, 9.0), Random.Range(55, 89));\n\nInstantiate(prefab, position,\
  \ Quaternion.identity);\n\n}\n\n}\n```\n\n分解来看，这段代码与 `RandomCannonPositions` 脚本的唯一区别如下：\n\
  \n`(1) var position: Vector3 = Vector3(Random.Range(-3.5, 3.5), Random.Range(8.5,\
  \ 9.0), Random.Range(55, 89));`\n\n`position` 的 x 和 z 坐标范围反映了该区域在高架轨道上的宽度和长度，而 y\
  \ 坐标范围则决定了地雷高出高架轨道表面的程度。\n\n`(2) Instantiate(prefab, position, Quaternion.identity);`\n\
  \n当调用 `Instantiate()` 函数时，`Quaternion.identity` 相当于表示“无旋转”。\n\n保存脚本，然后将它挂载到 `Hierarchy`\
  \ 面板中的 `Hazard Setup` 游戏对象上。选中此脚本后，打开 `Assets ➤ Prefab` 文件夹，将 `Land Mine` 预制体拖拽到\
  \ `Inspector` 面板中 `Prefab` 属性上。保存场景并进行测试游戏。你可以在 `Inspector` 面板中使用 `amount` 属性来更改地雷的数量，并且可以在\
  \ `Cheats` 脚本的 `RelocatePlayer()` 函数中添加以下作弊代码，以快速将玩家角色带回这个区域：\n\n```\nelse if(Input.GetKeyDown(KeyCode.Alpha4))\
  \ {\n\nrelocationPoint = Vector3(0, 9, 54);\n\nRelocatePlayer();\n\n}\n```\n\n一如既往，当你调整到满意的效果后，保存场景并保存项目。\n\
  \n如果你不想要随机布局怎么办？除了手动放置预制体，你还可以使用脚本按规则模式放置障碍物。在 `Project` 面板中，打开 `Assets ➤ Scripts`\
  \ 文件夹，创建一个名为 `RegularLandMinePositions` 的新脚本。在 MonoDevelop 中打开它并添加如下代码：\n\n```\n\
  #pragma strict\n\npublic var prefab : GameObject;\n\npublic var xPos : float = -3.5;\n\
  \npublic var yPos : float = 8.5;\n\npublic var zPos : float = 55.0;\n\npublic var\
  \ numberWidth : int = 8;\n\npublic var numberLength : int = 34;\n\nfunction Start\
  \ () {\n\nfor (var i : int = 0; i < numberLength; i++)\n\n{\n\nfor (var j : int\
  \ = 0; j < numberWidth; j++)\n\n{\n\nvar position: Vector3 = Vector3(xPos, yPos,\
  \ zPos);\n\nInstantiate(prefab, position, Quaternion.identity);\n\nxPos++;\n\n}\n\
  \nxPos = -3.5;\n\nyPos = yPos + 0.05;\n\nzPos = zPos + 1;\n\n}\n\n}\n```\n\n这段代码分解如下：\n\
  \n`(1) public var prefab : GameObject;`\n\n声明一个类型为 `GameObject` 的公共引用变量 `prefab`，用于保存要在此脚本中使用的预制体的引用。\n\
  \n`(2) public var xPos : float = -3.5; public var yPos : float = 8.5; public var\
  \ zPos : float = 55.0;`\n\n声明类型为 `float` 的公共变量 `xPos`、`yPos` 和 `zPos`，用于保存每个实例化预制体的\
  \ x、y、z 坐标，并分配它们的初始值。\n\n`(3) public var numberWidth : int = 8; public var numberLength\
  \ : int = 34;`\n\n声明公共变量 `numberWidth`，用于保存沿高架轨道宽度方向放置的预制体数量，并分配初始值 8；类似地，声明公共变量\
  \ `numberLength`，用于保存沿高架轨道长度方向放置的预制体数量，并分配初始值 34。\n\n`(4) for (var i : int = 0;\
  \ i < numberLength; i++)`\n\n此 `for` 循环遍历要创建的行数。\n\n`(5) for (var j : int = 0; j\
  \ < numberWidth; j++)`\n\n此循环遍历每行要实例化的预制体数量。\n\n`(6) var position: Vector3 = Vector3(xPos,\
  \ yPos, zPos);`\n\n将 x、y、z 坐标赋值给变量 `position`。\n\n`(7) Instantiate(prefab, position,\
  \ Quaternion.identity);`\n\n在指定位置创建预制体的新实例，且无旋转。\n\n`(8) xPos++;`\n\n在此行创建的每个预制体后，x\
  \ 坐标递增 1。循环重复，将下一个预制体放置在前一个预制体的旁边。\n\n`(9) xPos = -3.5;`\n\n当一行预制体完成时，x 坐标重置为下一行的初始值。\n\
  \n`(10) yPos = yPos + 0.05;`\n\n下一行的 y 坐标递增 0.05。\n\n`(11) zPos = zPos + 1;`\n\n\
  z 坐标递增 1，将下一行沿高架轨道向前放置 1 个单位。\n\n保存脚本。将脚本挂载到 `Hierarchy` 面板中的 `Hazard Setup` 游戏对象上。在\
  \ `Hierarchy` 中选中 `Hazard Setup` 游戏对象后，你可以在 `Inspector` 面板中看到它已挂载了 `RandomLandMinePositions`\
  \ 和 `RegularLandMinePositions` 两个脚本。务必取消勾选 `RandomLandMinePositions` 脚本组件以禁用它；`RegularLandMinePositions`\
  \ 脚本应保持勾选状态。\n\n在 `Project` 面板中，打开 `Assets ➤ Prefab` 文件夹，然后在 `Inspector` 面板中，将 `Land\
  \ Mine` 预制体拖拽到 `RegularLandMinePositions` 脚本的 `Prefab` 属性上。保存场景。\n\n进行测试游戏以观察其模式，你会发现每一行地雷的位置都比上一行更高。这个区域最后会布满地雷，变得无法穿越（图\
  \ 10-8）。\n\n![A978-1-4302-6587-0_10_Fig8_HTML.jpg](img/A978-1-4302-6587-0_10_Fig8_HTML.jpg)\
  \  \n图 10-8. 使用脚本按规则模式分布的预制体地雷\n\n修改以下代码行：\n\n`for (var i : int = 0; i < numberLength;\
  \ i++)`\n\n改为\n\n`for (var i : int = 0; i < numberLength/2; i++)`\n\n并将这一行：\n\n\
  `zPos = zPos + 1;`\n\n改为\n\n`zPos = zPos + 2;`\n\n保存脚本并进行测试游戏。第一个代码变化意味着创建的行数减半，第二个变化则将行间距从\
  \ 1 个单位改为 2 个单位。尝试更改行数和行间距，以及每行中预制体的数量与间距。按你最喜欢的方式排列，直到你在这个区域内拥有可供选择的随机和规则间隔两种地雷放置方案，并且可以通过启用和禁用相应的脚本来轻松切换。\n\
  \n\n\n### 激光区域\n\n你可以将之前许多布置机关的方法应用到激光区域，例如：等距排列、随机排列、固定激光或变化速度等。在这里，我们将从等在区域长度范围内以\
  \ 0.5 单位等距排列、并以不同速度横穿高架轨道宽度的激光开始。\n\n首先，制作激光机关的预制件：将 `LaserCube` 游戏对象从层级视图拖拽到项目面板的\
  \ `Assets ➤ Prefab` 文件夹中，并将其命名为 `Laser`。然后从层级视图中删除 `LaserCube` 游戏对象。\n\n在项目面板中，打开\
  \ `Assets ➤ Scripts` 文件夹，创建一个名为 `Laser Layout` 的新脚本。将代码编辑如下：\n\n```\n#pragma strict\n\
  \npublic var prefab : GameObject;\npublic var zPos : float = 91.0;\npublic var numberLength\
  \ : int = 16;\n\nfunction Start () {\n    for (var i : int = 0; i < numberLength\
  \ * 2; i++)\n    {\n        var position: Vector3 = Vector3(-3.8, 12, zPos);\n \
  \       Instantiate(prefab, position, Quaternion.identity);\n        zPos = zPos\
  \ + 0.5;\n    }\n}\n```\n\n代码解读如下：\n\n`(1)     public var prefab : GameObject;`\n\
  \n一个 `GameObject` 类型的公共引用变量，用于持有对预制件游戏对象的引用。\n\n`(2)     public var zPos : float\
  \ = 91.0;`\n\n声明一个 `float` 类型的公共变量 `zPos`，并赋值为该区域的起始值。\n\n`(3)     public var numberLength\
  \ : int = 16;`\n\n声明一个 `int` 类型的公共变量 `numberLength`，并赋值为该区域的长度值。\n\n`(4)     for\
  \ (var i : int = 0; i < numberLength * 2; i++)`\n\n这个 `for` 循环将在每次迭代中创建并定位一个新的预制件。由于激光非常窄，将它们间隔\
  \ 0.5 单位放置意味着需要两倍数量的激光，因此 `for` 循环迭代的次数是区域长度的两倍。\n\n`(5)     var position: Vector3\
  \ = Vector3(-3.8, 12, zPos);`\n\n声明一个名为 `position` 的 `Vector3` 类型变量，用于指定激光预制件的初始位置。在此区域中，激光预制件的起始\
  \ x 和 y 坐标是固定的，因此只需要改变每个预制件的 z 坐标，以便它们沿着区域等距排列。\n\n`(6)     Instantiate(prefab,\
  \ position, Quaternion.identity);`\n\n用新位置和零旋转来实例化激光预制件。\n\n`(7)     zPos = zPos\
  \ + 0.5;`\n\n通过将新实例化预制件的 z 坐标增加 0.5 单位，前进到下一个位置。\n\n保存脚本并将其附加到层级视图中的 `Hazard Setup`\
  \ 游戏对象上。在层级视图中选择 `Hazard Setup`，然后在项目面板的 `Prefabs` 文件夹中选择 `Laser` 预制件，并将其拖拽赋值给检视面板中\
  \ `Laser Layout` 脚本组件的 `Prefab` 变量。进行游戏测试，注意只有一道激光在撞击到它本应撞击的高架轨道时发出了火花（图 10-9）。\n\
  \n![A978-1-4302-6587-0_10_Fig9_HTML.jpg](img/A978-1-4302-6587-0_10_Fig9_HTML.jpg)\n\
  \n图 10-9. 除了一个之外，所有火花粒子系统都出现在错误的位置\n\n这种异常现象来源于 `Laser` 预制件上的 `Laser` 脚本，该脚本挂载在空的子游戏对象上。在\
  \ `Assets ➤ Prefab` 文件夹中，展开 `Laser` 预制件并选择 `LaserBeam` 子对象，以在检视面板中显示其属性（图 10-10）。\n\
  \n![A978-1-4302-6587-0_10_Fig10_HTML.jpg](img/A978-1-4302-6587-0_10_Fig10_HTML.jpg)\n\
  \n图 10-10. 项目面板中的 `Laser` 子对象 `LaserBeam` 及其在检视面板中的 `Laser` 脚本组件\n\n`Sparks` 属性字段未分配任何游戏对象，但有一道激光的火花位置正确，其余则不然。在\
  \ MonoDevelop 中打开 `Laser` 脚本。在 `Start()` 函数中，你将找到将 `Flare` 粒子系统赋值给 `sparks` 引用变量的代码行：\n\
  \n```\nfunction Start () {\n    sparks = GameObject.Find(\"Flare\");\n```\n\n`Start()`\
  \ 函数只会被调用一次。它会找到第一个名为 `Flare` 的游戏对象并将其赋值给 `sparks`，然后继续执行代码块的其余部分。这就是为什么只有一道激光的火花位置正确。删除这行代码并保存脚本。通过从项目面板拖拽\
  \ `Laser` 预制件的 `Flare` 子游戏对象（`Assets/Prefabs/Laser ➤ Flare`），将其放入检视面板的 `Sparks`\
  \ 属性字段中，从而将 `Flare` 粒子系统赋值给 `Sparks` 属性。进行游戏测试，现在所有火花都会出现在激光撞击高架轨道的位置（图 10-11）。\n\
  \n![A978-1-4302-6587-0_10_Fig11_HTML.jpg](img/A978-1-4302-6587-0_10_Fig11_HTML.jpg)\n\
  \n图 10-11. 每个火花粒子系统都出现在其激光撞击高架轨道表面的位置\n\n所有激光现在都能正常工作，但同步移动并不能带来多大挑战。要通过代码解决此问题，请找到\
  \ `MoveLaser` 脚本并打开它。为了随机化每个激光预制件的速度，请在 `Start()` 函数中添加以下代码行：\n\n```\nfunction Start\
  \ () {\n    offset = transform.position.x - 0.2;\n    speed = Random.Range(1.0,\
  \ 3.0);\n}\n```\n\n你现在应该对 `Random.Range()` 函数非常熟悉了。请记住，你始终可以使用 `Ctrl`+`'` 来打开它的脚本参考文档。你可以在图\
  \ 10-12 中看到激光的随机分布情况。\n\n![A978-1-4302-6587-0_10_Fig12_HTML.jpg](img/A978-1-4302-6587-0_10_Fig12_HTML.jpg)\n\
  \n图 10-12. 对激光预制件应用随机速度后的激光区域\n\n该区域的作弊码是：\n\n```\nelse if(Input.GetKeyDown(KeyCode.Alpha5))\
  \ {\n    relocationPoint = Vector3(0, 9, 90);\n    RelocatePlayer();\n}\n```\n\n\
  将其添加到 `Cheats` 脚本中 `RelocatePlayer()` 函数的其他作弊码列表中。\n\n虽然重新定位和复活玩家角色是一个方便的作弊手段，但在躲避死亡的同时评估你想要检查的机关的所有方面可能很困难。另一个常见且方便的作弊手段是无敌模式。要添加无敌模式，请在\
  \ `CheckInput()` 函数的 `if else` 序列中添加以下代码块：\n\n```\nelse if(Input.GetKeyDown(KeyCode.Alpha0))\
  \ {\n    player.gameObject.GetComponent(GoRagdoll).Invincibility();\n}\n```\n\n\
  代码解读如下：\n\n`(1)     else if(Input.GetKeyDown(KeyCode.Alpha0)) {`\n\n与其他作弊码一样，此行检查玩家是否按下了\
  \ 0（零）键。如果按下，\n\n`(2)     player.gameObject.GetComponent(GoRagdoll).Invincibility();`\n\
  \n获取玩家游戏对象的 `GoRagdoll` 脚本，并调用你接下来将要创建的 `Invincibility()` 函数。保存 `Cheats` 脚本，然后打开\
  \ `GoRagdoll` 脚本。首先添加 `invincible` 变量，如下所示：\n\n```\n#pragma strict\n\nprivate var\
  \ childRigidBodies : Rigidbody[];\nprivate var childColliders : Collider[];\n(1)\
  \     public var invincible : boolean = false;\n```\n\n首先，添加一个 `boolean` 类型的公共变量\
  \ `invincible`，并将其赋值为 `false`。这样，游戏开始时，玩家并非无敌状态。\n\n在脚本末尾，添加 `Invincibility()` 函数：\n\
  \n```\nfunction Invincibility () {\n    (2)             invincible = !invincible;\n\
  }\n```\n\n这是一个简单的开关，`invincible` 的值被重新赋值为其相反的布尔值。\n\n最后，在 `GotoRagdoll()` 函数中，添加一个条件判断，在将玩家转化为布娃娃之前测试玩家是否处于无敌状态：\n\
  \n```\nfunction GotoRagdoll ()\n{\n    (3)     if (!invincible) {\n        if (childRigidBodies\
  \ != null) {\n            for (var childRigidBody : Rigidbody in childRigidBodies)\
  \ {\n                childRigidBody.isKinematic = false;\n            }\n      \
  \  }\n        if (childColliders != null) {\n            for (var childCollider\
  \ : Collider in childColliders) {\n                childCollider.enabled = true;\n\
  \            }\n        }\n        gameObject.collider.enabled = false;\n      \
  \  gameObject.rigidbody.isKinematic = true;\n        gameObject.GetComponent(Animator).enabled\
  \ = false;\n    }\n}\n```\n\n\n\n`gameObject.GetComponent(ThirdPersonCharacter).enabled\
  \ = false;`\n\n`gameObject.GetComponent(ThirdPersonUserControl).enabled = false;`\n\
  \n`}`\n\n`}`\n\n在这个 `if` 条件语句中，它会测试括号内的内容是否为真。使用 `!invincible` 是“`invincible` 值的相反值”的简写。如果\
  \ `invincible` 是 `true`，那么 `!invincible` 就是 `false`。如果条件测试为假，则后续的代码块不会执行，这意味着玩家角色不会转变为布娃娃状态。\n\
  \n保存脚本、场景和项目。玩一下测试你新获得的无敌状态吧！\n\n### 暴风雪区域\n\n首先要解决的是重新定位和调整包含杀手粒子系统的暴风雪游戏对象的大小。在层级视图中选择暴风雪游戏对象，然后在检查器中将其变换位置坐标改为（-10,\
  \ 11.5, 117），以使其在区域中居中。回想一下，-10 的 x 偏移是为了让玩家有时间看到并反应接近的雪花（图 10-13）。\n\n![A978-1-4302-6587-0_10_Fig13_HTML.jpg](img/A978-1-4302-6587-0_10_Fig13_HTML.jpg)\n\
  \n图 10-13.\n致命雪花暴风雪穿过高架轨道\n\n仍在检查器中，向下滚动到粒子系统组件的形状模块。将盒体 X 改为 17，以将粒子发射表面扩展到该区域的长度。由于雪花遵循发射模块每秒\
  \ 10 个的速率，因此它们现在变得不那么密集了。\n\n第 8 章提供了粒子系统及其模块和属性的概述。你可以浏览这些属性，并在检查器中重置它们，以适应粒子发射器的新尺寸和位置。但是，根据你的游戏设计，你如何让这个区域随着玩家的前进而变得更加困难呢？当然是通过脚本编写。\n\
  \n为了使雪花在玩家穿过该区域时以更高的速度发射，请打开项目面板，打开`Assets ➤ Scripts`文件夹，并创建一个名为`BlizzardZone`的新脚本。在\
  \ MonoDevelop 中打开它，并将代码编辑如下：\n\n```\n#pragma strict\n\npublic var playerTransform\
  \ : Transform;\npublic var rateIncrease : float = 1;\nprivate var rate : float;\n\
  \nfunction Update () {\n    if (playerTransform.position.z > 109 && playerTransform.position.z\
  \ < 126) {\n        rate = playerTransform.position.z - 104;\n        gameObject.particleSystem.startSpeed\
  \ = rate * rateIncrease;\n    }\n}\n```\n\n这段代码解析如下：\n\n`(1)     public var playerTransform\
  \ : Transform;`\n\n声明一个`Transform`类型的公有变量`playerTransform`，它将保存对玩家角色变换的引用。\n\n`(2)     public\
  \ var rateIncrease : float = 1;`\n\n声明一个`float`类型的公有变量`rateIncrease`，它将允许你通过检查器调整暴风雪属性变化的速率。\n\
  \n`(3)     private var rate : float;`\n\n声明一个`float`类型的私有变量`rate`，它将与玩家角色的位置一起用于计算一个随玩家角色进度而变化的速率。\n\
  \n`(4)     if (playerTransform.position.z > 109 && playerTransform.position.z <\
  \ 126)`\n\n这个 `if` 条件包含两个测试。第一个是测试玩家角色的变换位置 z 坐标是否大于 109，这意味着他进入了暴风雪区域。第二个是测试玩家角色的变换位置\
  \ z 坐标是否小于 126，这意味着他离开了暴风雪区域的远端。`&&` 运算符代表逻辑与运算符。条件一和条件二都必须为真，整个条件语句才会返回一个`true`结果。这进而会导致后续的代码块被执行。\n\
  \n`(5)     rate = playerTransform.position.z - 104;`\n\n`rate`变量被赋值为玩家角色变换位置 z 坐标值减去\
  \ 104。104 是一个基于起始速度属性原始值 5 而设定的任意值，这样当玩家首次进入从 z 坐标 109 开始的暴风雪区域时，起始速度仍然是 5。\n\n\
  `(6)     gameObject.particleSystem.startSpeed = rate * rateIncrease;`\n\n将基于玩家角色位置计算出的新速率乘以`rateIncrease`值（你可以在检查器中使用该值来调整当玩家在区域内移动时`startSpeed`值变化的快慢），然后将其赋值给暴风雪游戏对象的粒子系统起始速度属性。\n\
  \n保存脚本并将其附加到暴风雪游戏对象上。回到编辑器中，在层级视图中选择暴风雪游戏对象，然后将第三人称角色布娃娃从层级视图拖到检查器中暴风雪区域脚本的玩家变换字段中。进行游戏测试，并注意玩家奔跑时雪花速度的变化。除了在检查器中调整初始粒子系统属性外，你还可以在游戏过程中轻松地控制它们。MonoDevelop\
  \ 的自动填充功能可以通过显示可用的粒子系统属性来辅助你（图 10-14）；\n\n![A978-1-4302-6587-0_10_Fig14_HTML.jpg](img/A978-1-4302-6587-0_10_Fig14_HTML.jpg)\n\
  \n图 10-14.\nMonoDevelop 自动填充弹出窗口中显示的粒子系统属性\n\n不要忘记将此区域的作弊码添加到作弊脚本的`RelocatePlayer()`函数中：\n\
  \n```\nelse if(Input.GetKey(KeyCode.Alpha6)) {\n    relocationPoint = Vector3(0,\
  \ 9, 108);\n    RelocatePlayer();\n}\n```\n\n尽情尝试根据玩家的进度改变不同的粒子系统属性，甚至同时改变多个属性吧。当你对暴风雪区域的效果满意后，保存脚本、场景和项目。\n\
  \n\n\n### 敌人区域\n\n在此区域中，你将把危险升级为一种具备足够智能、能向玩家发起攻击的敌人。你要打造一架简单的无人机敌人，当玩家进入其区域时，它会锁定并追击玩家。\n\
  \n要创建无人机敌人，请打开 `Assets ➤ Prefab` 文件夹，将 `land mine` 预制体拖拽到 Scene 视图。在 Hierarchy 中将其重命名为\
  \ `Enemy Drone`，然后在 Inspector 中将其 Transform 位置设为 `(0, 10, 145)`。`Land Mine` 预制体在与玩家角色接触时已经会爆炸，因此这里只需添加一项功能：能够找到玩家角色并追捕他。\n\
  \n当玩家离开暴风雪区域，进入区域间的小安全区时，他可以看到远端那架不祥的无人机。玩家已经从地雷中得知黑色球体并不友好，但为了增加紧张感，在攻击真正发起之前，他并不知道这次攻击的性质（如图\
  \ 10-15 所示）。\n\n![A978-1-4302-6587-0_10_Fig15_HTML.jpg](img/A978-1-4302-6587-0_10_Fig15_HTML.jpg)\n\
  \n*图 10-15. 玩家角色面对无人机敌人*\n\n在 Project 面板中的 `Assets ➤ Prefab ➤ Scripts` 文件夹内，新建一个名为\
  \ `EnemyDroneAI` 的脚本。在 MonoDevelop 中打开该脚本，并按如下代码进行编辑：\n\n```\n#pragma strict\n\n\
  public var playerTransform : Transform;\n\npublic var speed : float = 3.0f;\n\n\
  private var drone : Vector3;\n\nprivate var target : Vector3;\n\nprivate var distance\
  \ : float;\n\nfunction Update () {\n\nif (playerTransform.position.z > 128 && playerTransform.position.z\
  \ < 145) {\n\ntransform.LookAt(playerTransform);\n\ndrone = transform.position;\n\
  \ntarget = playerTransform.position + Vector3(0, 0.6, 0);\n\ndistance = speed *\
  \ Time.deltaTime;\n\ntransform.position = Vector3.MoveTowards(drone, target, distance);\n\
  \n}\n\n}\n```\n\n这段代码的解析如下：\n\n`(1)     public var playerTransform : Transform;`\
  \  \n`public var speed : float = 3.0f;`\n\n声明 `playerTransform` Transform 类型的公有变量，用于持有对玩家角色\
  \ Transform 的引用，以便进行目标锁定；声明 `speed` 浮点类型变量，使得在播放测试期间可以通过 Inspector 调整无人机的速度。\n\n\
  `(2)     private var drone : Vector3;`  \n`private var target : Vector3;`  \n`private\
  \ var distance : float;`\n\n声明私有变量，这些变量将存储 `MoveTowards()` 函数所需的值：无人机的位置、玩家角色的位置，以及两者之间的距离。\n\
  \n`(3)     if (playerTransform.position.z > 128 && playerTransform.position.z <\
  \ 145)`\n\n此条件判断玩家角色的 z 轴 Transform 位置是否大于 128，如果是，则说明玩家角色已进入无人机的区域。同时它还检查玩家角色的\
  \ z 轴 Transform 位置是否小于 145，这意味着他尚未从远端离开该区域。`&&` 逻辑运算符表示，如果这两个条件都为 true，则说明玩家角色已进入区域且尚未离开，即玩家角色位于无人机敌人的区域内。\n\
  \n`(4)     transform.LookAt(playerTransform);`\n\n`transform.LookAt` 函数以玩家角色的 Transform\
  \ 为参数，旋转无人机的 Transform，使其前向矢量指向玩家角色。\n\n`(5)     drone = transform.position;`  \n\
  `target = playerTransform.position + Vector3(0, 0.6, 0);`  \n`distance = speed *\
  \ Time.deltaTime;`\n\n要移动无人机敌人朝向玩家角色，你必须指定无人机的当前位置、它要前往的目标点以及移动的距离。玩家角色的 Transform\
  \ 位置基于其脚底，因此添加 `Vector3(0, 0.6, 0)` 是为了让无人机保持在架空轨道表面的上方，但同时又足够低，以便玩家角色仍可以跳跃越过它，作为一种规避策略。\n\
  \n`(6)     transform.position = Vector3.MoveTowards(drone, target, distance);`\n\
  \n无人机的新 `transform.position` 由 `MoveTowards()` 函数计算得出，该函数将无人机的位置、玩家角色的位置以及移动距离作为参数。\n\
  \n别忘了在 `Cheats` 脚本的 `CheckInput()` 函数中添加作弊码，以便快速到达此区域：\n\n```\nelse if(Input.GetKey(KeyCode.Alpha7))\
  \ {\n\nrelocationPoint = Vector3(0, 9, 127);\n\nRelocatePlayer();\n\n}\n```\n\n\
  保存脚本并将其附加到 `Enemy Drone` 游戏对象上。需要在 Inspector 中填充 `playerTransform` 属性，只需将 Hierarchy\
  \ 中的 `Third Person Character Ragdoll` 拖拽到该属性字段中即可。进行播放测试，在 Inspector 中调整无人机速度，直到对你来说具有足够的挑战性。保存场景并保存项目。检查一下——所有障碍赛道的杀戮区域都已完成。干得漂亮！\n\
  \n### 调试\n\n意外行为，从灾难性的崩溃到诸如火花与激光未对齐等异常现象（正如你在本章前面所见），都称为 bug。查找并修复这些问题称为调试。Unity\
  \ 专门为此提供了一个特殊的 `Debug` 类。你在第 2 章中使用了 `Debug.Log` 函数在控制台显示消息，并在第 7 章中使用了 `Debug.DrawRay`\
  \ 函数，在测试时使光线投射在场景视图中可见。随着你的场景和脚本变得更加复杂，你更有可能遇到 bug，也更需要高效地识别并修正它们。\n\n#### 编译器错误\n\
  \n当你点击“播放”按钮在游戏视图中运行游戏场景时，编译器首先会翻译你的脚本代码，以便处理器能够理解。如果编译器在你的代码中发现错误，它会通知你。当你尝试播放测试时，Unity\
  \ 编译器会在场景视图中对任何发现的错误给出一个巨大的通知（如图 10-16 所示）：\n\n![A978-1-4302-6587-0_10_Fig16_HTML.jpg](img/A978-1-4302-6587-0_10_Fig16_HTML.jpg)\n\
  \n*图 10-16. 场景视图中显示的编译器错误消息*\n\n在 Project 面板的 Console 选项卡下，还会显示有关该错误的附加信息（如图 10-17\
  \ 所示）：\n\n![A978-1-4302-6587-0_10_Fig17_HTML.jpg](img/A978-1-4302-6587-0_10_Fig17_HTML.jpg)\n\
  \n*图 10-17. 控制台显示的编译器错误信息*\n\n此错误的解析如下：\n\n`1. Assets/Scripts/`\n\n在 `Assets/Scripts`\
  \ 目录下，\n\n`2. RegularLandMinePositions.js`\n\n`RegularLandMinePositions.js` 脚本\n\
  \n`3. (23,27)`\n\n在第 23 行第 27 列存在错误\n\n`4. UCE0001`\n\n有一个简写的错误代码标识 `UCE0001`，表示用户创建的错误\
  \ 0001：缺少分号，\n\n`5. ';' expected.`\n\n并带有错误描述\n\n`6. Insert a semicolon at the end.`\n\
  \n以及一条调试建议：在此行代码末尾插入一个分号。\n\n如果双击底部的错误消息，MonoDevelop 将会打开，并将光标定位在错误发生的位置。通过打开你的一个脚本，删除一行代码中的分号并保存脚本来测试此功能；然后关闭\
  \ MonoDevelop。现在尝试播放测试，观察编译器的错误消息出现在 Project 面板的 Console 选项卡和场景视图中。通过重新插入分号来修复错误，并保存你的脚本。\n\
  \n一行代码中的错误可能会级联导致后续几行代码也出现错误。一旦第一个 bug 被修复，这些其他的伪 bug 也会随之消失，因为编译器现在可以正确读取后续的代码行了。因此，在调试时，你应该从出现的第一个错误开始，并有条不紊地依次解决这些\
  \ bug。\n\n\n\n### 警告\n\n尽管前一个示例中的编译器错误会显示一个红色停止标志图标，表示在错误修复前场景无法播放，但警告则使用黄色让行标志图标来提示你注意某个问题，同时表明场景仍然可以播放（图\
  \ 10-18）。\n\n![A978-1-4302-6587-0_10_Fig18_HTML.jpg](img/A978-1-4302-6587-0_10_Fig18_HTML.jpg)\n\
  \n图 10-18. 控制台中显示的警告消息\n\n警告的示例包括未使用变量的通知，或即将在后续版本中弃用（过时）的 Unity 函数。\n\n你可以使用 `Debug.LogWarning`\
  \ 创建自己的警告。它的用法与 `Debug.Log` 非常相似，但除了消息和对象上下文外，还会显示警告图标。若要尝试此功能，请在 Unity 编辑器的“项目”面板中，打开\
  \ Assets ➤ Scripts 文件夹，找到 ImpactForce 脚本。在 MonoDevelop 中打开它，并将以下代码行添加到 `Start()`\
  \ 函数中：\n\n```\nDebug.LogWarning(\"Warning!\", this);\n```\n\n保存脚本，进行游戏测试，然后查看你的新警告出现在控制台中（图\
  \ 10-19）。\n\n![A978-1-4302-6587-0_10_Fig19_HTML.jpg](img/A978-1-4302-6587-0_10_Fig19_HTML.jpg)\n\
  \n图 10-19. 控制台中显示的 `Debug.LogWarning` 消息\n\n虽然你仍然可以在存在警告的情况下进行游戏测试，但务必在游戏发布之前解决这些问题。\n\
  \n### 运行时错误\n\n运行时错误是脚本成功编译且游戏运行后发生的错误。运行时错误最简单的示例是除以零错误。\n\n在 MonoDevelop 中仍打开\
  \ ImpactForce 脚本的情况下，首先删除或禁用你在上一节中创建的 `Start()` 函数中的警告。现在，通过将 `ImpactForce()` 函数编辑为以下内容来引入除以零错误：\n\
  \n```\nfunction ImpactForce () {\n\n        var colliders : Collider[] =\n     \
  \           Physics.OverlapSphere(transform.position - Vector3(0, 4, 0), 10);\n\n\
  \        for(var cldr : Collider in colliders)\n        {\n                if(cldr.rigidbody\
  \ == null) continue;\n\n                var a : int = 0;\n\n                cldr.rigidbody.AddExplosionForce(10,\
  \ transform.position - Vector3(0,\n                        4/a, 0), 10, 0, ForceMode.Impulse);\n\
  \        }\n}\n```\n\n其分解如下：\n\n`(1) var a : int = 0;`\n\n声明一个 int 类型变量 `a`，并将其赋值为零。\n\
  \n`(2) cldr.rigidbody.AddExplosionForce(10, transform.position - Vector3(0, 4/a,\
  \ 0), 10, 0, ForceMode.Impulse);`\n\n将 Vector3 计算的 y 分量除以 `a`，以创建除以零错误。\n\n保存脚本并开始游戏测试。\n\
  \n请注意，脚本已编译，并且在场景运行之前，控制台中不会出现任何错误消息（图 10-20）。\n\n![A978-1-4302-6587-0_10_Fig20_HTML.jpg](img/A978-1-4302-6587-0_10_Fig20_HTML.jpg)\n\
  \n图 10-20. 控制台中显示的运行时错误\n\n当运行时发生错误时，Unity 会创建一个异常对象，然后抛出该异常。必须捕获并处理该异常，脚本才能继续执行。如果你的脚本未提供适当处理异常的方法，默认处理程序会捕获该异常并生成错误消息。根据错误的不同，它甚至可能导致游戏崩溃或终止。\n\
  \n在此示例中，由于错误发生在玩家角色落地时计算其周围箱体爆炸力的代码块中，因此当抛出此错误时，箱体会保持整齐堆放状态，因为爆炸力无法正确计算或应用。\n\n\
  再次查看图 10-20，你可以看到生成了两条错误消息：一条是关于除以零的数学错误，紧接着是无法计算 `AddExplosionForce()` 中参数的 Vector3\
  \ 坐标。通过先处理控制台中列出的第一个错误，当你修复除以零的错误后，第二个相关错误也将随之解决。移除错误，保存脚本，并进行游戏测试，你的场景将再次无错误地运行。\n\
  \n你也可以使用 `Debug.LogError` 创建自己的错误消息。将以下代码行添加为 `ImpactForce()` 函数的第一行：\n\n```\nDebug.LogError(\"\
  My test error message\", gameObject);\n```\n\n保存脚本并开始游戏测试。带有红色图标的错误消息会按预期出现在控制台中。虽然你创建的错误消息除了图标外，其行为与\
  \ `LogWarning` 消息看起来相同，但 `Debug.LogError` 还与 Unity 调试器协同工作，帮助你在运行时逐步跟踪脚本的执行。虽然使用\
  \ Unity 调试器是一个更高级的主题，但为了将来参考，请注意 Debug 类还有更复杂的用法，你最终会发现它们很有用。\n\n### 异常处理\n\n你已经编写了有助于防止抛出异常的代码。再次查看\
  \ `KillOnCollision` 脚本的 `OnCollisionEnter()` 函数：\n\n```\nfunction OnCollisionEnter(other\
  \ : Collision) {\n        if (other.gameObject.name == \"Third Person Character\
  \ Ragdoll\")\n        {\n        other.gameObject.GetComponent(GoRagdoll).GotoRagdoll();\n\
  \        }\n}\n```\n\n在访问并调用 `GoRagdoll` 脚本组件上的 `GotoRagdoll()` 函数之前，条件检查确保碰撞涉及的游戏对象是玩家角色。假设你没有进行检查，而将函数简单地写为：\n\
  \n```\nfunction OnCollisionEnter(other : Collision) {\n        other.gameObject.GetComponent(GoRagdoll).GotoRagdoll();\n\
  }\n```\n\n当唯一的移动游戏对象是玩家角色时，这可能是合理的。但随着你继续构建障碍赛道，添加了其他移动对象——敌方无人机。如果玩家沿着障碍赛道撤退以躲避无人机，而跟随的无人机撞击到带有\
  \ `KillOnCollision` 脚本组件的危险物时，脚本将尝试访问并调用 `GoRagdoll` 脚本组件的 `GotoRagdoll()` 函数，但敌方无人机没有此组件，因此会发生错误。有了条件判断，如果碰撞涉及敌方无人机，条件测试结果为\
  \ false，则不会执行调用 `GotoRagdoll()` 的代码块，因此不会发生错误。\n\n错误类型及其可能发生的场景组合几乎是无限的。学习如何处理错误的最佳方法是在实践中发现并解决它们，并在过程中逐步学习更多的异常处理代码。你会在\
  \ Unity 在资源商店中提供的示例项目和教程中遇到许多示例。如果遇到无法解决的错误，下一步最佳做法是在 Unity3D 社区页面的“答案”和/或“论坛”下进行快速搜索。很可能有人遇到过相同的问题，并且答案已经\
  \ readily available（随时可用）。\n\n\n## 总结\n\n本章内容相当密集，你将玩家角色和危险物原型整合在一起，实现了你在上一章中构思的游戏设计。你体验了游戏设计的迭代过程，并创建了作弊码以方便测试障碍物跑道原型。你学会了如何让玩家角色复活，并使其变得无敌。\n\
  \n在逐个攻克各个危险区域的过程中，你学到了更多利用脚本和预制件的方法，以固定模式或不可预测的随机化方式快速在场景中填充危险物。通过使用脚本，你学会了实时调整危险物游戏对象的属性以响应玩家的移动。你还创建了第一个敌人，并用一个简单的\
  \ AI 脚本让它动起来。\n\n你重新利用了已有资源以节省原型开发的时间和资源。你还重构了代码以提高效率，并学习了调试的基础知识。呼——你涉及了很广的范围，在充实障碍物跑道原型的过程中，获得了大量设计实现方面的良好实践。干得漂亮！\n\
  \n"
- "# 11. 提升用户体验：GUI 与音效\n\n“视频游戏”这一术语用于描述通过各种视频监视器或屏幕进行游玩的游戏。早期的视频游戏仅限于在单色显示器上显示文本和键盘字符，但自那以后，它们已演变为使用\
  \ 3D 图像、立体声，并且根据平台不同，还具备运动检测和感官反馈功能的复杂游戏体验。\n\n图形用户界面（即 GUI）是一种视觉覆盖层，它通过传达分数、库存物品和地图等信息来辅助玩家，同时还能为玩家与游戏进行交互提供额外的方式。\n\
  \n音效对于打造稳健且丰富的游戏体验同样至关重要。音乐用于设定游戏氛围；使用（从简单音效到叙事对话在内的任何形式）向用户传递关于游戏玩法的提示和信息；或者作为音效，增强显示器上发生的相应视觉动作。\n\
  \n## 创建 GUI 控件\n\n创建和使用 GUI 控件是通过脚本和 `OnGUI()` 函数来完成的。虽然你可以将 GUI 脚本添加到任何游戏对象，或将\
  \ GUI 代码添加到任何脚本中，但保持它们的组织结构良好，会使编辑、更新和排除项目故障变得更加容易。在 Unity 编辑器顶部菜单中，选择 GameObject\
  \ ➤ Create Empty 并将其命名为 GUI。与方向光（Directional Light）和音频（Audio）游戏对象一样，精确的变换（Transform）位置并不重要。你创建的\
  \ GUI 控件将根据你为其指定的屏幕坐标显示，而不是根据 GUI 游戏对象的游戏世界坐标。\n\n### 显示文本\n\nGUI 与用户通信最基本的方式就是显示文本。标签和框正是执行此操作的非常简单的控件。实际上，标签和框之间的唯一区别在于，标签只显示文本，而框则是一个带有深色背景的标签。\n\
  \n#### 标签\n\n要创建一个标签，首先你需要一个脚本。在“项目”面板中，打开 Assets ➤ Scripts 文件夹，然后创建一个新脚本并将其命名为\
  \ GUIScript。在 MonoDevelop 中打开 GUIScript，并将代码编辑为以下内容：\n\n```\n#pragma strict\n\n\
  function OnGUI() {\n\n        GUI.Label(Rect(0, 0, 125, 25), \"A label displays\
  \ text\");\n\n}\n```\n\n这段代码分解如下：\n\n`(1)     function OnGUI()`\n\n用于创建 GUI 控件的\
  \ `OnGUI()` 函数在每一帧都会被调用。\n\n`(2)     GUI.Label(Rect(0, 0, 125, 25), \"A label displays\
  \ text\");`\n\n![A978-1-4302-6587-0_11_Fig1_HTML.jpg](img/A978-1-4302-6587-0_11_Fig1_HTML.jpg)\n\
  \n图 11-1.\n\n显示在“游戏”视图左上角的新标签文本 调用 `GUI` 类的 `Label()` 函数，并为其传递标签的 x 和 y 屏幕坐标、宽度和高度，然后是标签中要显示的文本。\n\
  \n保存脚本，将其附加到 GUI 游戏对象上，保存场景，然后运行。你将看到标签文本显示在“游戏”视图的左上角（图 11-1）。\n\n##### Rect\n\n\
  `Rect` 变量值得再多加解释一下。它代表一个二维矩形，其中 (x, y) 坐标表示矩形左上角将根据屏幕坐标定位的位置。屏幕坐标基于目标平台显示器的宽度和高度，并且独立于游戏世界的\
  \ (x, y, z) 坐标（图 11-2）。\n\n![A978-1-4302-6587-0_11_Fig2_HTML.jpg](img/A978-1-4302-6587-0_11_Fig2_HTML.jpg)\n\
  \n图 11-2.\n\nUnity 脚本参考文档中描绘的，定义二维矩形大小和位置的 `Rect` 变量属性\n\n在 `GUIScript` 中，尝试更改 (x,\
  \ y) 值来重新定位标签。当你同时尝试更改 `Rect` 的大小属性时，你会发现当把标签做小时，文本会被截断，并且不会随着矩形尺寸的缩小而缩小。\n\n#####\
  \ 淡出\n\n假设你想在游戏开始时，通过一条在 3 秒后淡出的消息，告知玩家如何让角色蹲下和跳跃。将 GUIScript 编辑为以下内容：\n\n```\n\
  #pragma strict\n\npublic var fadeDuration : float = 3;\n\nfunction OnGUI() {\n\n\
  \        var fadingColor : Color;        \n\n        fadingColor = GUI.contentColor;\n\
  \n        var fading : float = (Time.time/fadeDuration);\n\n        GUI.contentColor.a\
  \ = Mathf.Lerp(1, 0, fading);\n\n        GUI.Label(Rect(0, 0, 250, 25), \"Press\
  \ C to crouch or Space to jump\");\n\n}\n```\n\n分解一下：\n\n`(1)     public var fadeDuration\
  \ : float = 3;`\n\n声明一个浮点类型变量 `fadeDuration` 并为其赋值 3。\n\n`(2)     var fadingColor\
  \ : Color;`\n\n声明一个 `Color` 类型的引用变量 `fadingColor`。回顾一下，`Color` 由 r、g、b、a 值组成，其中\
  \ a（alpha 值）代表透明度，1 表示完全不透明，0 表示完全透明。\n\n`(3)     fadingColor = GUI.contentColor;`\n\
  \n将 `GUI` 类的 `contentColor` 变量中保存的当前 GUI 文本颜色值赋给 `fadingColor` 变量。\n\n`(4)     var\
  \ fading : float = (Time.time/fadeDuration);`\n\n声明一个浮点类型变量 `fading`，用于保存从游戏开始的时间除以\
  \ `fadeDuration`（秒）得到的结果。\n\n`(5)     GUI.contentColor.a = Mathf.Lerp(1, 0, fading);`\n\
  \n使用 `Mathf.Lerp()` 函数平滑过渡 alpha 值，然后将新值赋给 `GUI.contentColor.a`，该变量保存将要渲染的 GUI 文本的参考颜色。\n\
  \n`(6)     GUI.Label(Rect(0, 0, 250, 25), \"Press C to crouch or Space to jump\"\
  );`\n\n创建一个标签，其左上角将定位在平台屏幕的左上角，显示的文字指令将使用新计算并赋值的 alpha 值进行渲染。\n\n保存脚本，保存场景，然后进行游戏测试。你将看到消息显示在左上角，然后在\
  \ 3 秒内淡出。你可以通过在检查器（Inspector）中调整 `fadeDuration` 来改变消息保持可见的时间长度。\n\n\n\n### 方框（Box）\n\
  \n在 `OnGUI()` 函数的末尾添加以下代码行，以查看标签（Label）和方框（Box）之间的区别：\n\n```csharp\nGUI.Box(Rect\
  \ (0, 75, 100, 50), \"This is a box\");\n```\n\n其工作方式与 `GUI.Label` 完全相同。保存脚本并运行。方框的深色背景在障碍赛道场景（Obstacle\
  \ Course scene）的深色天空盒背景下较难看清，因此你可能需要稍微平移摄影机才能看到它（图 11-3）。\n\n![A978-1-4302-6587-0_11_Fig3_HTML.jpg](img/A978-1-4302-6587-0_11_Fig3_HTML.jpg)\n\
  \n图 11-3. 游戏视图中显示的 GUI.Label 和 GUI.Box\n\n请注意，标签和方框的文本都会淡出。这是因为你在淡出消息代码中编写的 `GUI.contentColor`\
  \ 应用于此 `OnGUI()` 函数中的所有内容。解决此问题的一种方法是为不同的 GUI 控件使用不同的脚本。\n\n删除 `GUI.Box(Rect (0,\
  \ 75, 100, 50), \"This is a box\");` 代码行并保存脚本。\n\n在项目面板中，选择 `Assets ➤ Scripts` 文件夹，然后选择\
  \ Create 并创建一个名为 `GUIBoxScript` 的新脚本。按如下方式编辑代码：\n\n```csharp\n#pragma strict\n\n\
  function OnGUI() {\n    GUI.Box(Rect (0, 75, 100, 50), \"This is a box\");\n}\n\
  ```\n\n保存脚本，将其附加到 GUI 游戏对象，保存场景，并进行游戏测试。这次，方框中的文本保持可见，而标签的文本则淡出。\n\n### 图像（Image）\n\
  \n你可以显示图像来代替文本。将 `GUIBoxScript` 编辑如下：\n\n```csharp\n#pragma strict\n\npublic var\
  \ boxTexture : Texture2D;\n\nfunction OnGUI() {\n    GUI.Box(Rect (0, 75, 100, 50),\
  \ boxTexture);\n}\n```\n\n以下是对其的分解说明：\n\n1. `public var boxTexture : Texture2D;`\
  \ – 为图像文件声明一个 `Texture2D` 类型的引用变量 `boxTexture`。\n\n2. `GUI.Box(Rect (0, 75, 100,\
  \ 50), boxTexture);` – 这行代码创建了 GUI 方框控件，但使用的是图像参数，而非先前示例中使用的字符串参数。\n\n保存脚本。在 Unity\
  \ 编辑器中，选中 GUI 游戏对象后，你会在检查器（Inspector）中的 `GUIBoxScript` 组件里看到 `Box Texture` 属性及其空白字段。在项目面板中，打开\
  \ `Assets ➤ Sample Assets ➤ Sample Scenes ➤ Textures` 文件夹。将 `gui_reticule` 图像拖入\
  \ `Box Texture` 属性字段。保存场景，进行游戏测试，瞄准图像（reticule）就会出现在方框中。太棒了！\n\n请记住，你可以将光标悬停在 `GUI`\
  \ 上，然后使用 ![A978-1-4302-6587-0_11_Figa_HTML.jpg](img/A978-1-4302-6587-0_11_Figa_HTML.jpg)\
  \ 打开 Unity 脚本参考文档，查找可用于自定义 `GUI.Box` 或任何 GUI 控件内容的各种选项。\n\n### 文本输入（Text Input）\n\
  \n有时你可能需要玩家的输入。`TextField` 和 `TextArea` GUI 控件正为此目的而设计，它们之间的唯一区别在于 `TextField` 只能容纳一行文本，而\
  \ `TextArea` 可以容纳多行。\n\n#### TextField\n\n在项目面板中，选择 `Assets ➤ Scripts` 文件夹，创建一个名为\
  \ `GUITextInputScript` 的新脚本。在 MonoDevelop 中打开它，并将代码编辑如下：\n\n```csharp\n#pragma strict\n\
  \nvar textFieldString : String = \"A one-line text field\";\n\nfunction OnGUI ()\
  \ {\n    textFieldString = GUI.TextField (Rect (0, 130, 120, 30), textFieldString);\n\
  }\n```\n\n这段代码分解如下：\n\n1. `public var textFieldString : String = \"A one-line text\
  \ field\";` – 声明 `String` 类型的 `textFieldString` 变量，并为其分配一个初始消息字符串“A one-line text\
  \ field”。\n\n2. `textFieldString = GUI.TextField (Rect (0, 130, 120, 30), textFieldString);`\
  \ – 请记住，`OnGUI()` 在每一帧都会被调用。`String` 变量 `textFieldString` 会反映 `GUI.TextField` 的内容，因为玩家可以对其进行编辑。\n\
  \n保存脚本，将其附加到 GUI 游戏对象，它会在检查器中显示为一个脚本组件。你可以直接在检查器的 `Text Field String` 属性中编辑初始消息，也可以在游戏测试期间观察其变化，以反映游戏过程中对\
  \ `GUI.TextField` 所做的任何更改。\n\n#### TextArea\n\n`TextArea` 的工作方式与 `TextField` 类似。在\
  \ MonoDevelop 中，将 `GUITextInputScript` 编辑如下：\n\n```csharp\n#pragma strict\n\nvar\
  \ textFieldString : String = \"A one-line text field\";\nvar textAreaString  : String\
  \ = \"A multi-line text field\";\n\nfunction OnGUI () {\n    textFieldString = GUI.TextField\
  \ (Rect (0, 130, 120, 30), textFieldString);\n    textAreaString = GUI.TextArea\
  \ (Rect (0, 175, 75, 75), textAreaString);\n}\n```\n\n保存脚本并进行游戏测试。现在，当你在 `TextArea`\
  \ 中添加更多文字时，它会自动换行以适应其空间内的新文本行。\n\n### 更多控件（More Controls）\n\n许多常见的交互元素都可以作为 GUI\
  \ 控件使用，包括按钮（Button）、开关（Toggle）和滑块（Slider）。在创建任何 GUI 控件时，你会注意到它们都遵循位置 - 大小 - 内容（position–size–content）的模式。\n\
  \n#### Button\n\n基本按钮在鼠标按钮释放时响应一次点击。点击时返回 `true`，否则返回 `false`。在你的脚本中，你可以使用条件语句来测试\
  \ `true` 状态；当按钮被点击时，它会执行其代码块。\n\n在项目面板中，选择 `Assets ➤ Scripts` 文件夹，创建一个名为 `GUIButtons`\
  \ 的新脚本。在 MonoDevelop 中打开它，并将代码编辑如下：\n\n```csharp\n#pragma strict\n\nfunction OnGUI\
  \ () {\n    if (GUI.Button (Rect (25, 260, 100, 30), \"Click Me\")) {\n        Debug.Log(\"\
  Button has been clicked\");\n    }\n}\n```\n\n这段代码分解如下：\n\n1. `if (GUI.Button (Rect\
  \ (25, 260, 100, 30), \"Click Me\"))` – 这行高效的代码同时创建了 GUI 按钮并测试了其状态。\n\n2. `Debug.Log(\"\
  Button has been clicked\");` – 如果按钮状态返回 `true`（意味着它被点击了），`Debug.Log` 语句将出现在控制台（Console）中。\n\
  \n保存脚本，将其附加到 GUI 游戏对象，并进行游戏测试。点击按钮以确认“Button has been clicked”出现在控制台中。\n\n你可以将任何类型的代码放入此条件语句中。由于你已经知道如何编写影响脚本所附加的游戏对象以及场景中任何其他游戏对象的代码，因此这里的代码可以影响任何游戏对象的行为。保存场景和项目。\n\
  \n#### Repeat Button（重复按钮）\n\n重复按钮与按钮的不同之处在于，只要重复按钮被按住，它就会在每一帧返回 `true`。\n\n在 MonoDevelop\
  \ 中，将 `GUIButtons` 脚本代码编辑如下：\n\n```csharp\nfunction OnGUI () {\n    if (GUI.Button\
  \ (Rect (25, 260, 100, 30), \"Click Me\")) {\n        Debug.Log(\"Button has been\
  \ clicked\");\n    }\n    if (GUI.RepeatButton (Rect (25, 300, 100, 30), \"Click\
  \ and Hold\")) {\n        Debug.Log(\"The repeat button is being pressed\");\n \
  \   }\n}\n```\n\n保存脚本并进行游戏测试。比较两个按钮的动作，注意只要按住重复按钮，其 `Debug.Log` 语句就会在每一帧打印到控制台。\n\
  \n\n\n#### 屏幕\n\n游戏视图的左侧已经挤满了控件，所以在添加更多控件之前，你需要将按钮移动到右侧。Unity 为你提供了一个便捷的 `Screen`\
  \ 类，它可以提供诸如屏幕分辨率和尺寸，或鼠标光标是显示还是隐藏等信息。在本示例中，你将使用 `Screen.width` 和 `Screen.height`\
  \ 变量来辅助 GUI 控件的放置。\n\n要将按钮移动到右上角，请在 GUIButtons 脚本中将其位置修改为以下内容：\n\n```\nif (GUI.Button\
  \ (Rect (Screen.width - 100, 0, 100, 30), \"点击我\")) {\n```\n\n由于按钮的位置坐标与其左上角重合，因此你必须减去按钮的宽度。否则，它的左侧会从屏幕右侧的最后一个像素开始。\n\
  \n将其下方的重复按钮也移动过去，请在 GUIButtons 脚本中将其位置修改为以下内容：\n\n```\nif (GUI.RepeatButton (Rect\
  \ (Screen.width - 100, 50, 100, 30), \"点击并按住\")) {\n```\n\n保存场景并运行测试以查看新的按钮位置。\n\
  \n同样地，你可以将标签中的玩家指示重新定位到屏幕中央，方法是在 GUIText 脚本中将代码修改如下：\n\n```\nGUI.Label(Rect(Screen.width/2,\
  \ Screen.height/2, 250, 25), \"按 C 键蹲下，或按空格键跳跃\");\n```\n\n如果你现在保存并运行测试，会发现标签位置过低且偏右。这同样是因为标签的左上角被定位在了\
  \ (`Screen.width/2`, `Screen.height/2`) 坐标处。你可以像处理按钮一样处理这个问题，但为了保持居中，这次需要减去标签宽度和高度的一半。代码行现在应如下所示：\n\
  \n```\nGUI.Label(Rect(Screen.width/2 - 125, Screen.height/2 - 12.5, 250, 25), \"\
  按 C 键蹲下，或按空格键跳跃\");\n```\n\n保存脚本，保存场景，然后运行测试，会看到淡出的消息显示在屏幕中央。\n\n#### 工具栏\n\n工具栏是一组按钮行，同一时间只能选中其中一个按钮。\n\
  \n在 GUIButtons 脚本中，将代码编辑为以下内容：\n\n```\n#pragma strict\n\nprivate var toolbarSelectedButton\
  \ = 0;\n\nprivate var toolbarButtonNames : String[] = [\"工具栏按钮 1\", \"工具栏按钮 2\"\
  , \"工具栏按钮 3\"];\n\nfunction OnGUI () {\n    if (GUI.Button (Rect (Screen.width -\
  \ 100, 0, 100, 30), \"点击我\")) {\n        Debug.Log(\"按钮已被点击\");\n    }\n\n    if\
  \ (GUI.RepeatButton (Rect (Screen.width - 100, 50, 100, 30), \"点击并按住\")) {\n   \
  \     Debug.Log(\"重复按钮正在被按住\");\n    }\n\n    toolbarSelectedButton = GUI.Toolbar\
  \ (Rect (25, 25, 250, 30), toolbarSelectedButton, toolbarButtonNames);\n}\n```\n\
  \n分解如下：\n\n`(1) private var toolbarSelectedButton = 0;`\n\n声明一个私有变量 `toolbarSelectedButton`，用于指定创建工具栏时哪个按钮将处于选中状态。和之前一样，计算机从\
  \ 0 开始计数，而不是 1，因此这行代码指定第一个按钮将被选中。\n\n`(2) private var toolbarButtonNames : String[]\
  \ = [\"工具栏按钮 1\", \"工具栏按钮 2\", \"工具栏按钮 3\"];`\n\n声明一个引用变量 `toolbarButtonNames`，它将持有一个字符串类型的数组，然后是引号内实际名称字符串的赋值。方括号\
  \ `[]` 代表一个数组。名称字符串的数量同时指定了要在工具栏中创建的按钮数量。\n\n`(3) toolbarSelectedButton = GUI.Toolbar\
  \ (Rect (25, 25, 250, 30), toolbarSelectedButton, toolbarButtonNames);`\n\n`toolbarSelectedButton`\
  \ 变量与工具栏初始化代码一起保存当前选中按钮的状态。对于工具栏，此处的模式为：位置、工具栏尺寸、选中的按钮、然后是按钮名称。\n\n保存脚本，保存场景，然后运行测试。注意第一个按钮初始处于选中状态，并且你一次无法选中多个按钮。\n\
  \n#### 开关\n\n开关控件在其初始化时的模式略有不同，因为它始终持有一个布尔值，表示它是“开”还是“关”。在项目面板的 Assets ➤ Scripts\
  \ 文件夹中创建一个名为 GUIToggleAndSliders 的新脚本。在 MonoDevelop 中打开它，并将代码编辑为以下内容：\n\n```\n#pragma\
  \ strict\n\nvar toggle : boolean = false;\n\nfunction OnGUI () {\n    toggle = GUI.Toggle\
  \ (Rect (Screen.width - 100, Screen.height - 100, 100, 30), toggle, \"开关控件\");\n\
  \    Debug.Log(toggle);\n}\n```\n\n分解如下：\n\n`(1) var toggle : boolean = false;`\n\
  \n声明一个私有布尔变量 `toggle`，用于保存开关控件的当前状态。\n\n`(2) toggle = GUI.Toggle (Rect (Screen.width\
  \ - 100, Screen.height - 100, 100, 30), toggle, \"开关控件\");`\n\n你之前在 TextField 和\
  \ TextArea 中见过这种代码配置，变量在一行代码内被赋予所创建的控件的值。开关的模式是：位置、尺寸、开关状态、以及显示在开关旁边的文本字符串。\n\n\
  `(3) Debug.Log(toggle);`\n\n在控制台中显示开关控件的当前状态。\n\n保存脚本，将其附加到 GUI 游戏对象上并运行测试。当你选中和取消选中开关时，开关的相应状态会在每一帧打印到控制台。\n\
  \n\n#### 滑块\n\n滑块有一个可滑动的旋钮，可以沿您指定的范围从滑块的一端移动到另一端，滑块的两端分别代表范围的最小值和最大值。滑块可以水平或垂直放置。\n\
  \n要创建水平滑块和垂直滑块的示例，请在 MonoDevelop 中编辑 `GUIToggleAndSliders` 脚本的代码如下：\n\n```\n#pragma\
  \ strict\n\nvar toggle : boolean = false;\nvar horizSlider : float = 0.0;\nvar vertSlider\
  \ : float = 0.0;\n\nfunction OnGUI () {\n    toggle = GUI.Toggle (Rect (Screen.width\
  \ - 100, Screen.height - 100, 100, 30), toggle, \"Toggle switch\");\n    Debug.Log(toggle);\n\
  \    horizSlider = GUI.HorizontalSlider (Rect (Screen.width/2, 25, 100, 30), horizSlider,\
  \ 0.0, 10.0);\n    Debug.Log(horizSlider);\n    vertSlider = GUI.VerticalSlider\
  \ (Rect (Screen.width/2, 50, 100, 30), vertSlider, 0.0, 10.0);\n    Debug.Log(vertSlider);\n\
  }\n```\n\n其分解如下：\n\n```\n(1)     var horizSlider : float = 0.0;\n        var vertSlider\
  \ : float = 0.0;\n```\n\n声明一个 `float` 类型变量来保存水平和垂直滑块旋钮的位置。  \n\n```\n(2)     horizSlider\
  \ = GUI.HorizontalSlider (Rect (Screen.width/2, 25, 100, 30), horizSlider, 0.0,\
  \ 10.0);\n```\n\n浮点数 `horizSlider` 会被赋予滑块的新位置，并据此在每一帧重新绘制滑块。这里的模式是：位置、尺寸、滑块当前值、最小值、最大值。\
  \  \n\n```\n(3)     Debug.Log(horizSlider);\n```\n\n将水平滑块的值记录到控制台。  \n\n```\n(4)\
  \     vertSlider = GUI.VerticalSlider (Rect (Screen.width/2, 50, 100, 30), vertSlider,\
  \ 0.0, 10.0);\n```\n\n垂直滑块与水平滑块采用相同的参数，遵循的模式是：位置、尺寸、滑块当前值、最小值、最大值。  \n\n```\n(5)\
  \     Debug.Log(vertSlider);\n```\n\n将垂直滑块的值记录到控制台。  \n\n保存脚本，保存场景，然后进行游戏测试以观察当您移动水平和垂直滑块旋钮时其值的变化。\n\
  \n此时，游戏视图已经变得相当拥挤（图 11-4）。\n\n![A978-1-4302-6587-0_11_Fig4_HTML.jpg](img/A978-1-4302-6587-0_11_Fig4_HTML.jpg)\n\
  \n图 11-4. 游戏视图中混杂的示例控件\n\n这是一个很好的反例——过多的控制器会降低玩家观察游戏的能力，并且如果实现不当，会损害游戏体验。游戏控制器的使用应在游戏设计阶段决定，远在您坐到电脑前之前。无论您是使用控制器来显示地图、库存、分数、弹药、血量或任何您想传达给玩家的信息，都要尽可能高效。\n\
  \n在此示例中，与障碍赛道原型相关的唯一控制器是淡入淡出标签。您可以将所有示例控制器的代码放在一个脚本中，但创建几个脚本有助于保持示例代码的组织性，并且现在您可以选择\
  \ GUI 游戏对象，并禁用除 `GUIScript` 之外的所有脚本。保存场景并测试，只剩下淡入淡出的标签。\n\nUnity 提供了广泛的 GUI 方法，例如\
  \ `GUI.SelectionGrid`，它作为一个多行工具栏，配合 `GUI.changed` 可以快速测试读者是否与任何控件进行了交互。Unity 还提供更高级的控件，例如复合控件、滚动视图和窗口。如果您的\
  \ GUI 需要更复杂的功能，您可以随时查阅文档，了解 Unity 还能为您提供哪些帮助。\n\n### 自定义控件\n\n游戏设计既要考虑功能，也要考虑外观。到目前为止，您已经处理了\
  \ GUI 控件的功能和布局，但您可能还希望为您的游戏自定义控件的外观。这就是 GUI 样式和 GUI 皮肤发挥作用的地方。\n\n#### GUI 样式\n\n\
  使用 GUI 样式来更改单个控件的外观。在 MonoDevelop 中打开 `GUIScript`，并添加以下代码行：\n\n```\npublic var fadeDuration\
  \ : float = 3;\nvar guiStyle : GUIStyle;\n```\n\n保存脚本。在 Unity 编辑器中，选中 GUI 游戏对象后，您将在\
  \ Inspector 中的 `GUIScript` 脚本组件中看到 Gui Style 属性。展开 Custom Gui Style 以显示自定义属性。您可以在\
  \ Name 字段中为此样式输入一个名称。展开 Normal 以显示 Background 和 Text Color 属性（图 11-5）。\n\n![A978-1-4302-6587-0_11_Fig5_HTML.jpg](img/A978-1-4302-6587-0_11_Fig5_HTML.jpg)\n\
  \n图 11-5. Inspector 中 `GUIScript` 脚本组件的 Custom Gui Style 属性\n\n选择一种新的文本颜色。要使该样式应用于淡入淡出标签，您需要编辑\
  \ `GUIScript`，并将 `guiStyle` 参数传递给 `GUI.Label`，如下所示：\n\n```\nGUI.Label(Rect(Screen.width/2\
  \ - 125, Screen.height/2 - 12.5, 250, 25), \"Press C to crouch or Space to jump\"\
  , guiStyle);\n```\n\n保存脚本并播放。这次，GUI 标签中对玩家的提示将以新的文本颜色显示。\n\n#### GUI 皮肤\n\n您可以为游戏中的每个控件创建一个\
  \ GUI 样式。如果您有一个包含许多控件的更复杂的游戏，使用 GUI 皮肤可能是一种更高效的自定义方法。GUI 皮肤是一套将应用于所有控件的样式。\n\n由于皮肤是一种资源，您将通过在\
  \ Project 面板中选择 Create ➤ GUISkin 并命名为 `myGUISkin` 来创建它。在 Inspector 中，您会看到一个 GUI\
  \ 控件列表（图 11-6），每个控件都可以展开以显示其可自定义的属性。请记住保持项目组织有序，因此花点时间创建一个名为 `MyGUISkins` 的新文件夹，然后将\
  \ `myGUISkin` 资源拖放到其中。\n\n![A978-1-4302-6587-0_11_Fig6_HTML.jpg](img/A978-1-4302-6587-0_11_Fig6_HTML.jpg)\n\
  \n图 11-6. Inspector 中显示的 GUI 皮肤属性\n\n在 Inspector 中，展开 Label ➤ Normal 属性，并将文本颜色更改为与您在前一个示例中使用的\
  \ GUI 样式不同的颜色。在 MonoDevelop 中，编辑 `GUIScript` 如下：\n\n```\n#pragma strict\n\npublic\
  \ var fadeDuration : float = 3;\nvar guiStyle : GUIStyle;\nvar myGuiSkin : GUISkin;\n\
  \nfunction OnGUI() {\n    GUI.skin = myGuiSkin;\n    ...     \n    GUI.Label(Rect(Screen.width/2\
  \ - 125, Screen.height/2 - 12.5, 250, 25), \"Press C to crouch or Space to jump\"\
  , guiStyle);\n}\n```\n\n分解如下：\n\n```\n(1)     var guiStyle : GUIStyle;\n       \
  \ guiStyle\n```\n\n首先，删除与 `GUIStyle` 相关的代码。  \n\n```\n(2)     var myGuiSkin : GUISkin;\n\
  ```\n\n声明一个类型为 `GUISkin` 的引用变量 `myGuiSkin`。  \n\n```\n(3)     GUI.skin = myGuiSkin;\n\
  ```\n\n将自定义的 `myGuiSkin` 分配为活动的 `GUI.skin`。  \n\n保存脚本，然后在 Hierarchy 中选择 GUI 游戏对象。在\
  \ Inspector 中，您将看到 `GUIScript` 组件中出现了一个 Gui Skin 属性。将 `myGUISkin` 资源从 Project 面板的\
  \ `Assets` ➤ `MyGUISkins` 文件夹拖放到 Gui Skin 字段中。保存场景并测试，以查看应用了新的文本字体颜色。\n\n您甚至可以按需混合搭配\
  \ GUI 样式和 GUI 皮肤。恰到好处的细节对于游戏质量至关重要。本节介绍了 GUI 控件及其自定义方法。请自由实验，并深入阅读 Unity 文档，以获取更高级的工具和如何应用它们的示例。祝您玩得开心！\n\
  \n\n\n"
- "# 音频\n\n音频对于游戏体验至关重要，并以多种方式发挥巨大作用。背景音乐设定情绪基调，并且可以在游戏过程中变化，以反映玩家体验的各种情境，例如，悬疑音乐预示着危险将至，而战斗场景中则充满激昂的音乐。\n\
  \n它还能给玩家提供线索，比如通过加快音乐节奏来传达渐强的紧迫感。角色和非玩家角色的对话会向玩家提供与游戏剧情一致的提示和指示。即使在简单的街机类游戏中，以升调结束的短促音效也能对玩家起到正向强化作用，而降调则会强化负面事件或行动。\n\
  \n有时，声音的缺失也能被有效利用。例如，在射击游戏中，当附近的闪光弹爆炸后紧接着一片寂静，然后出现真实的耳鸣声，随着玩家角色恢复，正常的游戏音效逐渐淡入，耳鸣声也随之消失，这有助于保持真实感。\n\
  \n音效与游戏环境和动作结合使用。在写实主题的游戏中，你会听到环境背景噪音，无论是夜晚的蟋蟀声、背景交通声、附近运转的机械声，或是路过的非玩家角色声。更具体的游戏动作音效包括所驾驶车辆的引擎轰鸣声、战斗场景中的撞击和碎裂声，或玩家角色移动时的脚步声。\n\
  \n有些游戏将声音作为核心玩法，例如像《西蒙》和《吉他英雄》这样的流行游戏。游戏 `Lurking` 利用声音创造了一种新颖而诡异的应用方式，其中来自玩家动作（白色）和敌人（红色）的声波照亮了游戏世界（图\
  \ 11-7）。请花点时间查看 `www.lurking-game.com` 上的预告片，这是一个极佳的例子，展示了声音如何既用于设定游戏情绪，又用于驱动实际游戏玩法。\n\
  \n![A978-1-4302-6587-0_11_Fig7_HTML.jpg](img/A978-1-4302-6587-0_11_Fig7_HTML.jpg)\n\
  \n图 11-7.\n\n来自 `www.lurking-game.com` 的《Lurking》预告片截图\n\n## 音频监听器\n\n就像主摄像机是游戏的眼睛一样，音频监听器组件则是游戏的耳朵。当您创建新场景时，音频监听器默认会添加到主摄像机上。在层级视图中，选择\
  \ `Free Look Camera Rig ➤ Pivot ➤ Main Camera`。在 Inspector 中，您将找到音频监听器组件。如果您尝试展开音频监听器，什么也不会发生，因为它没有任何属性（图\
  \ 11-8）。\n\n![A978-1-4302-6587-0_11_Fig8_HTML.jpg](img/A978-1-4302-6587-0_11_Fig8_HTML.jpg)\n\
  \n图 11-8.\n\n音频监听器组件在 Inspector 中没有可显示的属性\n\n它按原样工作，用于接收或“听到”游戏场景中任何音频源的输入，然后通过游戏平台的扬声器播放声音。根据游戏需要，音频监听器也可以改为附加到主要玩家角色或某些其他游戏对象上，但随后必须将其从主摄像机上移除，因为每个场景中只能存在一个音频监听器组件。\n\
  \n## 音频源\n\n音频源是负责播放声音的游戏对象组件。在项目面板中，打开 `Assets ➤ Prefabs` 文件夹，展开 `Land Mine` 预制件以显示\
  \ `Explosion` 图标。选择 `Explosion` 以在 Inspector 中显示其音频源（图 11-9）。\n\n![A978-1-4302-6587-0_11_Fig9_HTML.jpg](img/A978-1-4302-6587-0_11_Fig9_HTML.jpg)\n\
  \n图 11-9.\n\nInspector 中的爆炸音频源组件\n\n与音频监听器不同，您可以在游戏中拥有任意数量的音频源。声音性能，如同游戏性能一样，受到目标平台处理能力以及其特定声音处理和扬声器功能的限制。\n\
  \n音频源的功能类似于游戏中的扬声器，其中音频剪辑是音频源播放的实际声音文件。脚本可用于调整音频源组件中的任何属性，包括更改要播放的音频剪辑。\n\n`静音`\
  \ 是一个简单的启用/禁用切换，用于静音。各种 `Bypass` 效果仅限专业版。启用了 `唤醒时播放` 的音频源将在创建包含音频源组件的游戏对象时开始播放。音频可以像动画剪辑一样循环播放，即每次完整播放完毕后，音频剪辑会重新开始。\n\
  \n分配优先级允许 Unity 适应平台的音频能力。如果超出性能限制，优先级较低的声音将被优先级更高的声音替换。在 Unity 中，0 表示最重要。\n\n声音剪辑的相对响度由音量属性控制，该属性使用\
  \ 0 到 1 的比例表示音量的 0% 到 100%，而音调则控制声音波形的频率，其中较高的音调对应于音阶上较高的音符。\n\n您可以在 2D 和 3D 声音之间进行选择，这两种声音又各自具有各种可调整的属性。2D\
  \ 声音最适合背景音乐等音频，无论玩家在游戏世界中的哪个位置，都能统一播放。3D 声音则根据玩家的位置而变化。\n\n## 3D 与 2D 声音属性\n\n音频剪辑是\
  \ 2D 还是 3D 取决于其导入设置。3D 音频指的是 3D 游戏世界中的声音。音频源可以附加到整个游戏场景中的游戏对象上。3D 声音的音量会随着音频监听器的距离和移动而变化。\n\
  \n无论音频监听器的位置如何，2D 声音都以相同音量播放。其唯一属性 `声像` 控制两个扬声器之间的音量，默认值 0 表示两个扬声器以相同音量播放声音。将滑块向左移动会增加左扬声器的音量，而将滑块向右移动则会增加右扬声器的音量（图\
  \ 11-10）。\n\n![A978-1-4302-6587-0_11_Fig10_HTML.jpg](img/A978-1-4302-6587-0_11_Fig10_HTML.jpg)\n\
  \n图 11-10.\n\nInspector 中的 3D 和 2D 声音设置属性\n\n3D 声音可以通过 3D 声音设置属性进行微调。`多普勒级别` 会根据运动扭曲声音，以产生类似多普勒效应的效果，即靠近声源时音调较高，远离声源时音调较低。\n\
  \n3D 声音表现如同从游戏世界中的特定位置发出，因此声音在声源处最响，并随着远离而减弱。`音量衰减` 属性决定了声音随距离减弱的速率。默认值为 `对数衰减`，与现实世界一致。您还有\
  \ `线性衰减` 和 `自定义衰减` 选项。\n\n`最小距离` 是音量达到 100% 时与音频源的最小距离。3D 声音由 Unity 游戏引擎根据 `声像级别`\
  \ 进行管理，其中 0 基本上是 2D 声音，1 则是完全 3D。`扩散角` 是一个更高级的音频设置，与扬声器系统有关。`最大距离` 是音量衰减导致的声音变化结束的最大距离。通常情况下，这也是您仍能听到声源任何声音的最远点。\n\
  \n## 音频剪辑\n\n源音频文件就是音频剪辑，无论文件类型如何。Unity 支持 `.aif`、`.wav`、`.mp3` 和 `.ogg` 格式。您的项目中已经有一个包含在\
  \ `Land Mine` 预制件中的音频剪辑（图 11-11）。\n\n![A978-1-4302-6587-0_11_Fig11_HTML.jpg](img/A978-1-4302-6587-0_11_Fig11_HTML.jpg)\n\
  \n图 11-11.\n\nLand Mine 预制件音频源组件中的剧烈爆炸音频剪辑及其属性\n\n\n\n### 音频设置\n\nUnity 中有些设置会影响整个项目的音效。你可以通过\
  \ Unity 编辑器顶部的菜单选择 `Edit ➤ Project Settings ➤ Audio` 来访问 `Audio Manager`（音频管理器），随后\
  \ `Audio Manager` 会出现在 Inspector（检视面板）中（图 11-12）。\n\n![A978-1-4302-6587-0_11_Fig12_HTML.jpg](img/A978-1-4302-6587-0_11_Fig12_HTML.jpg)\n\
  \n图 11-12. 由 `AudioManager` 处理的全局音频设置\n\n`Audio Source`（音频源）组件的音量设置允许你调整其相对音量。`AudioManager\
  \ Volume`（音频管理器音量）属性则控制所有正在播放声音的整体音量。\n\n对于 3D 音频，`Volume Rolloff`（音量衰减）允许你在 `Linear`（线性）、`Logarithmic`（对数）和\
  \ `Custom`（自定义）之间进行选择。在 `AudioManager` 中，`Rolloff Scale`（衰减缩放）用于调整 `Logarithmic`（对数）曲线的形状，从而影响衰减速度。\n\
  \n`Speed of Sound`（声速）默认值为海平面声速，并会影响启用了多普勒效应的声音。`Audio Source`（音频源）的 `Doppler Level`（多普勒等级）属性设置了应用于音频片段的多普勒失真程度，而\
  \ `AudioManager`（音频管理器）的 `Doppler Factor`（多普勒因子）则设置了失真效果的明显程度，其中 `0` 表示完全关闭，`1`\
  \ 表示最明显。\n\n`Default Speaker Mode`（默认扬声器模式）设置可用的声道数，对于立体声扬声器，默认值为 `2`。\n\n`DSPBuffer\
  \ Size`（DSP 缓冲区大小）最好保持默认，因为它与 CPU 如何处理聚合音频文件有关，属于本书范围之外的高级话题。\n\n### 音频测试\n\n在 `Scene\
  \ view`（场景视图）的顶部，你会找到一个带有扬声器图标的按钮，它代表 `Audio Preview mode`（音频预览模式）（图 11-13）。不必为了测试游戏音频而进行游戏试玩，你只需切换开启\
  \ `Audio Preview mode`（音频预览模式），并在游戏世界中移动场景摄像机即可。\n\n![A978-1-4302-6587-0_11_Fig13_HTML.jpg](img/A978-1-4302-6587-0_11_Fig13_HTML.jpg)\n\
  \n图 11-13. `Scene view`（场景视图）中的 `Audio Preview`（音频预览）切换开关\n\n## 为障碍赛道添加音频\n\n在将音频添加到障碍赛道原型之前，你需要先从\
  \ `Asset Store`（资源商店）下载一些免费资源。在 Unity 编辑器顶部菜单中选择 `Window ➤ Asset Store`。搜索“Free\
  \ music pack”，找到 Alchemy Studio 提供的示例音频包（图 11-14）。点击蓝色的 `Download`（下载）按钮，然后在提示时点击\
  \ `Import`（导入）。\n\n![A978-1-4302-6587-0_11_Fig14_HTML.jpg](img/A978-1-4302-6587-0_11_Fig14_HTML.jpg)\n\
  \n图 11-14. Unity 资源商店中的免费音乐包\n\n首先，请保持项目结构清晰。在 `Project panel`（项目面板）中选择 `Assets`（资源）文件夹，然后选择\
  \ `Create ➤ Folder`（创建 ➤ 文件夹），并将其命名为 `Audio`。将你刚刚导入的 `Free Pack`（免费包）文件夹移动到 `Audio`\
  \ 文件夹中，然后选中它查看其内容。\n\n### 权限与鸣谢\n\n在游戏中使用的 `Asset Store`（资源商店）资源时，务必查看任何 `Readme`（自述）文件，确认是否有任何要求或限制（图\
  \ 11-15）。要求可能包括在鸣谢中列出资源创建者，而限制则可能包括你不能转售或再销售你下载的资源，无论是免费还是购买的。\n\n![A978-1-4302-6587-0_11_Fig15_HTML.jpg](img/A978-1-4302-6587-0_11_Fig15_HTML.jpg)\n\
  \n图 11-15. `Free Pack`（免费包）文件夹中的 `Readme`（自述）文件\n\n单击 `Readme`（自述）文件可在 Inspector（检视面板）中查看其内容，或双击在\
  \ MonoDevelop 中打开（图 11-16）。\n\n![A978-1-4302-6587-0_11_Fig16_HTML.jpg](img/A978-1-4302-6587-0_11_Fig16_HTML.jpg)\n\
  \n图 11-16. 在 Inspector（检视面板）中显示的 `Readme`（自述）文件内容\n\n首先是感谢，并邀请你在资源商店中对此资源进行评分和评论。反馈对于了解用户需求至关重要，尤其有助于帮助遇到任何问题的人，包括识别新的\
  \ Bug。你的游戏同样需要反馈，因此请花时间提供相同的支持。\n\n接下来是请求发送电子邮件，告知用户如何使用该资源，以及希望在鸣谢中包含的信息。了解自己的作品如何被使用是件有趣的事，得知人们喜欢自己倾注心血的产品，也会获得个人满足感。\n\
  \n将资源商店中的贡献者视为你扩展的团队成员。Alchemy Studio 的 Matteo Bosi 慷慨地允许我们在此项目中使用这个包。给 Matteo 快速发一封邮件，做个自我介绍，并告诉他你正在使用他的免费包制作原型。养成这个习惯，不久你就会结识来自世界各地同样热爱游戏制作的新朋友。游戏开发社区对开发过程中的艰辛和磨难非常支持且理解。他们会帮助你、为你加油，并在你发布游戏时与你一同庆祝。一定要通过回馈来分享这份关爱。\n\
  \n继续阅读 `Readme`（自述）文件，你会找到 Alchemy Studio 提供的更多音效资源的链接，以及可以在导入到项目之前试听的地址。这是常见做法，正如你从\
  \ Alien 和 Spartan King 动画剪辑的示例视频中回忆的那样，这可以避免为了测试而导入所有资源。\n\n### 音乐\n\n音乐有多种用途，包括背景音乐和根据游戏玩法做出的响应。对于几乎所有行为比\
  \ `Play On Awake`（唤醒时播放）更复杂的音效，你将使用脚本来指导其行为。\n\n\n\n### 背景音乐\n\n首先，从一个最简单的例子开始。在\
  \ Unity 编辑器顶部菜单中，依次选择 **GameObject** > **Create Empty**，将其命名为 `Audio`，并将 Transform\
  \ 位置设置为 `(0, 0, 0)`。在层级面板中选中 `Audio` 游戏对象，然后在 Inspector 面板中选择 **Add Component**\
  \ > **Audio** > **Audio Source**。\n\n在项目面板中打开 `Free Pack` 文件夹，你会看到一个 `Metal Loop`\
  \ 文件夹。打开该文件夹，可以看到四个音频剪辑和另一个 `Readme` 文件。从 `Readme` 文件中你将了解到，第一个剪辑是一段完整的音乐轨道，另外三个则是同一轨道拆分出的**前奏**、**为循环播放设计的中间部分**以及**结尾**。选择\
  \ `“Loop 16 - 145 bpm - complete”` 文件，在 Inspector 面板中查看其属性（图 11-17）。\n\n![A978-1-4302-6587-0_11_Fig17_HTML.jpg](img/A978-1-4302-6587-0_11_Fig17_HTML.jpg)\n\
  \n*图 11-17.* 项目面板和 Inspector 面板中的 `“Loop 16 - 145 bpm - complete”`\n\n取消勾选 `3D Sound`，这样无论玩家角色的位置或移动如何，音量都会保持一致。在层级面板中选中\
  \ `Audio` 游戏对象，如果弹出 **Unapplied import settings** 对话框，请选择 “Apply”，然后将 `“Loop 16\
  \ - 145 bpm - complete”` 音频剪辑拖拽到 Audio Source 组件的 `Audio Clip` 属性字段中。`Play On Awake`\
  \ 默认应已勾选。如果没有，请手动勾选。由于这是你希望在游戏全程始终均匀播放的背景音乐，因此为其设置最高优先级 `0`。保存场景并播放。\n\n音频剪辑会从头播放到尾，然后停止。尝试勾选\
  \ `Audio Source` 的 `Loop` 属性并再次播放。现在音频剪辑会重复播放，但循环之间的衔接不太平滑，这正是部分音频剪辑发挥作用的地方。\n\n\
  要实现连续播放的背景音乐，你希望前奏在开始时只播放一次，接着是循环部分持续循环播放。要实现这种行为，你需要一个脚本。\n\n在项目面板中，选择 `Assets\
  \ > Scripts` 文件夹，然后创建一个名为 `BackgroundMusic` 的新脚本。在 MonoDevelop 中打开它，并将代码编辑如下：\n\n\
  ```\n#pragma strict\n\nfunction Start () {\n    PlayBackgroundMusic();\n}\n\nfunction\
  \ PlayBackgroundMusic () {\n    if(audio.isPlaying == true) {\n        audio.Stop();\n\
  \    }\n    audio.Play();\n}\n```\n\n代码分解如下：\n\n(1) `PlayBackgroundMusic();`  \n\
  保持 `Start()` 函数的简洁，将播放背景音乐的代码块放入其自身的函数 `PlayBackgroundMusic()` 中，该函数从 `Start()`\
  \ 函数中调用。\n\n(2) `if(audio.isPlaying == true)`  \n检查音频剪辑是否已经在播放。添加这个测试是良好的实践，而不是简单地单独使用\
  \ `audio.Play()`，以避免出现奇怪的音频行为。\n\n(3) `audio.Stop();`  \n如果音频剪辑已经在播放，则将其停止。\n\n\
  (4) `audio.Play();`  \n从头开始播放音频剪辑。\n\n在 Inspector 面板中，取消勾选 Audio Source 组件的 `Play\
  \ On Awake` 和 `Loop` 属性。将 `BackgroundMusic` 脚本附加到 `Audio` 游戏对象上。保存场景并进行播放测试。此时，你已实现了等同于\
  \ `Play On Awake` 的脚本功能。\n\n接下来，通过将项目面板中的 `“Loop 16 - 145 bpm - intro”` 前奏剪辑拖拽到\
  \ Inspector 中 Audio Source 组件的 `Audio Clip` 属性字段中，来更换音频剪辑。保存并播放测试，现在前奏剪辑会立即播放且只播放一次。\n\
  \n在 MonoDevelop 中，将 `BackgroundMusic` 脚本编辑为：\n\n```\n#pragma strict\n\npublic var\
  \ musicLoop : AudioClip;\nprivate var introMusicIsPlaying : boolean = true;\nprivate\
  \ var looping : boolean = false;\n\nfunction Start () {\n    PlayBackgroundMusic();\n\
  }\n\nfunction Update() {\n    if (!audio.isPlaying) {\n        introMusicIsPlaying\
  \ = false;\n    }\n    if (!introMusicIsPlaying && !looping) {\n        looping\
  \ = true;\n        LoopBackgroundMusic();\n    }\n}\n\nfunction PlayBackgroundMusic\
  \ () {\n    if(audio.isPlaying == true) {\n        audio.Stop();\n    }\n    audio.Play();\n\
  }\n\nfunction LoopBackgroundMusic () {\n    if(audio.isPlaying == true) {\n    \
  \    audio.Stop();\n    }\n    audio.clip = musicLoop;\n    audio.loop = enabled;\n\
  \    audio.Play();\n}\n```\n\n代码分解如下：\n\n(1) `public var musicLoop : AudioClip;`\
  \  \n声明一个类型为 `AudioClip` 的引用变量来容纳将要播放的第二个音频剪辑，并将其命名为 `musicLoop`。\n\n(2) `private\
  \ var introMusicIsPlaying : boolean = true;`  \n声明一个名为 `introMusicIsPlaying` 的私有布尔变量，并将其设置为\
  \ `true`，因为 `PlayBackgroundMusic()` 是从 `Start()` 函数中调用的，它将立即开始播放前奏剪辑。\n\n(3) `private\
  \ var looping : boolean = false;`  \n声明一个名为 `looping` 的私有布尔变量，并将其设置为 `false`。\n\n\
  (4) `if (!audio.isPlaying)`  \n在 `Update()` 函数中，检查前奏剪辑何时播放完毕。记住 `!` 表示“非”，所以这行代码可以理解为“如果音频剪辑没有在播放”，当前奏剪辑结束时，这个条件将为真。\n\
  \n(5) `introMusicIsPlaying = false;`  \n一旦前奏剪辑播放完毕，将 `introMusicIsPlaying` 布尔变量切换为\
  \ `false`。\n\n(6) `if (!introMusicIsPlaying && !looping)`  \n如果前奏音乐没有在播放，且 `looping`\
  \ 仍为 `false`，那么是时候切换音频剪辑了。\n\n(7) `LoopBackgroundMusic();`  \n调用 `LoopBackgroundMusic()`\
  \ 函数，你将在下一步编写这个函数。\n\n(8) `if(audio.isPlaying == true) {` `audio.Stop();` `}`  \n\
  在更换音频剪辑之前调用 `audio.Stop()` 函数是一个良好的实践。\n\n(9) `audio.clip = musicLoop;`  \n将当前音频剪辑切换为\
  \ `musicLoop` 所引用的音频剪辑。\n\n(10) `audio.loop = enabled;`  \n启用 `Audio Source` 的 `Loop`\
  \ 属性。\n\n(11) `audio.Play();`  \n播放新的音频剪辑。\n\n在 Unity 编辑器中，将 `“Loop 16 - 145 bpm\
  \ - loop”` 音频剪辑拖放至 `Audio` 游戏对象的 `BackgroundMusic` 脚本组件中的 `Music Loop` 属性字段。保存场景并播放测试。现在，前奏音频剪辑会无缝衔接到循环音频剪辑，而循环剪辑则会持续循环播放。\n\
  \n然而，这里有些不对劲：随着玩家角色在障碍赛道中不断前进，音乐声逐渐减弱了。这是因为音频剪辑的初始导入设置是 3D 模式。在项目面板中，打开 `Assets\
  \ > Free Pack > Metal Loop Pack`，在 Inspector 面板中依次选中每个音频剪辑，取消勾选 `3D Sound` 属性。如果弹出\
  \ **Unapplied Import Settings** 对话框，请选择 **Apply**。保存场景，进行播放测试，现在无论玩家角色在障碍赛道中的哪个位置，背景音乐都能连续且均匀地播放了。\n\
  \n\n\n#### 事件触发的音效\n\n通过触发器是在游戏过程中播放短音频片段的一种方法。\n\nFree Pack 文件夹中有一个 Fantasy Victory\
  \ (free) 音频片段。玩家成功躲避敌方无人机并抵达高架轨道的最终平台，标志着障碍赛的成功完成，因此当玩家角色到达此处时，你将播放这个音频片段。\n\n如果你事先想到先创建一个空游戏对象，添加一个音频源组件，然后将\
  \ Fantasy Victory (free) 音频片段拖入音频剪辑属性中，那你就想对了。更棒的是，Unity 提供了一些便捷的快捷方式，可以省去这些步骤。\n\
  \n将 Fantasy Victory (free) 音频片段拖放到层次结构中。请务必将其放置在游戏对象之间，而不是放在游戏对象上（那样会高亮显示）。Fantasy\
  \ Victory (free) 游戏对象将出现在层次结构中，并附带一个音频源组件，且 Fantasy Victory (free) 音频片段已自动分配给音频剪辑属性。\n\
  \n再次将音频片段拖入场景视图，注意当你在场景中将其拖到其他游戏对象上时，会出现一个带有 + 符号的绿色圆圈。如果你将音频片段放到某个游戏对象上，Unity 会自动创建一个音频源组件并将其附加到该游戏对象上。请注意——如果该游戏对象已有一个分配了剪辑的音频源，而你又将这个片段拖上去，那么新的音频剪辑将替换之前分配的剪辑。现在先不要真的将\
  \ Fantasy Victory (free) 拖入场景视图。如果你已经拖了，请使用删除组件选项将其删除，这样你只保留第一个，即仅包含变换和音频源组件的 Fantasy\
  \ Victory (free) 游戏对象。\n\n将这个游戏对象的变换位置设置为 `(0, 11.5, 150)`，使其位于最终坡道顶部的中心位置。如果你现在进行试玩，由于默认勾选了“唤醒时播放”，该剪辑会立即播放。在检查器中取消勾选它。仍在检查器中时，选择添加组件\
  \ ➤ 物理 ➤ 盒子碰撞体。勾选`是触发器`，并将“中心”的值改为 `(0, 1, 0)`，“大小”的值改为 `(8, 2, 0.2)`。\n\n你需要一个脚本，当玩家与这个触发碰撞体接触时播放音频，因此在检查器中选择添加组件\
  \ ➤ 新建脚本并将其命名为 `VictoryMusic`，然后点击创建并添加。请注意，通过此方法创建的新脚本会位于资源根文件夹中。通过将其移动到 Assets\
  \ ➤ Scripts 文件夹来保持项目组织有序，然后在 MonoDevelop 中打开它。将代码编辑如下：\n\n```\n#pragma strict\n\n\
  public var backgroundMusic : GameObject;\n\nfunction OnTriggerEnter () {\n\nbackgroundMusic.GetComponent(BackgroundMusic).PlayVictoryMusic();\n\
  \n}\n```\n\n你之前见过这类代码。其分解如下：\n\n`(1)     public var backgroundMusic : GameObject;`\n\
  \n声明一个类型为 `GameObject` 的公共引用变量 `backgroundMusic`，用于持有对音频游戏对象的引用。\n\n`(2)     function\
  \ OnTriggerEnter ()`\n\n当玩家角色进入碰撞体体积时，由于碰撞体设置为`是触发器`，因此会调用 `OnTriggerEnter()`。\n\
  \n`(3)     backgroundMusic.GetComponent(BackgroundMusic).PlayVictoryMusic();`\n\n\
  获取附加到音频游戏对象上的 `BackgroundMusic` 脚本组件的引用，并调用你接下来要编写的 `PlayVictoryMusic()` 函数。另一种方法是停止背景音乐，然后使用此游戏对象和脚本播放胜利音乐音频剪辑，但由于这是背景音乐，为保持项目组织有序，更好的做法是将其包含在一个专用的游戏对象中。\n\
  \n保存脚本，然后将其附加到 Fantasy Victory (free) 游戏对象上。在层次结构中选择 Fantasy Victory (free) 游戏对象，然后将层次结构中的音频游戏对象拖到胜利音乐脚本组件的背景音乐字段中。\n\
  \n在 MonoDevelop 中，返回到 `BackgroundMusic` 脚本并添加以下代码行：\n\n```\n#pragma strict\n\npublic\
  \ var musicLoop : AudioClip;\n\nprivate var introMusicIsPlaying : boolean = true;\n\
  \nprivate var looping : boolean = false;\n\npublic var victoryMusic : AudioClip;\n\
  \nfunction Start () {\n\nPlayBackgroundMusic();\n\n}\n\nfunction Update() {\n\n\
  }\n\nfunction PlayBackgroundMusic () {\n\n}\n\nfunction LoopBackgroundMusic () {\n\
  \n}\n\nfunction PlayVictoryMusic () {\n\nif(audio.isPlaying == true) {\n\naudio.Stop();\n\
  \n}\n\naudio.clip = victoryMusic;\n\naudio.Play();\n\n}\n```\n\n分解如下：\n\n`(1)  \
  \   public var victoryMusic : AudioClip;`\n\n创建一个类型为 `AudioClip` 的引用变量 `victoryMusic`。作为公共变量，你可以轻松地通过将不同音频剪辑拖放到检查器的胜利音乐字段中来测试它们。\n\
  \n`(2)     function PlayVictoryMusic ()` `{`\n\n创建一个新的 `PlayVictoryMusic()` 函数。\n\
  \n`(3)     if(audio.isPlaying == true) {`\n\n`audio.Stop();`\n\n`}`\n\n`audio.clip\
  \ = victoryMusic;`\n\n`audio.Play();`\n\n这些步骤与你之前替换音频剪辑的步骤相同，只是这次新的音频剪辑是 Fantasy\
  \ Victory (free) 音频片段。\n\n保存脚本。在层次结构中选中音频游戏对象，将项目面板中 Assets ➤ Free Pack 文件夹中的 Fantasy\
  \ Victory (free) 音频片段拖到背景音乐脚本组件的胜利音乐字段中。保存场景并保存项目。\n\n让玩家角色四处跑动，你会注意到当玩家角色进入触发体积时，音频剪辑会播放，这正是你想要的，但你也会注意到，如果玩家角色远离\
  \ Fantasy Victory (free) 游戏对象附近，音乐会逐渐消失。该音频剪辑设置为 3D 音效，音量衰减设置为对数衰减。\n\n在项目面板中选择\
  \ Fantasy Victory (free) 剪辑，然后在检查器中取消勾选 3D 音效，如果提示则点击应用。保存场景，再次试玩，现在设置为 2D 音效后，无论玩家角色如何移动，音乐都会保持相同音量。甜蜜的胜利！\n\
  \n\n\n### 音效\n\n音效一词通常指非音乐或非对话的音频片段。音效更常使用 3D 声音，因为它们通常与场景中的特定游戏对象相关联。\n\n打开 `Assets`\
  \ ➤ `Sample Assets` ➤ `Vehicles` ➤ `Car` ➤ `Audio` 文件夹，找到 `Low Acceleration` 音频片段。选中它并在\
  \ `Inspector` 中确认 `3D Sound` 复选框已勾选。在 `Hierarchy` 中选择 `Enemy Drone` 游戏对象，然后将光标移至\
  \ `Scene` 视图并按 `F` 键，将 `Enemy Drone` 游戏对象显示在视图中。\n\n将 `Low Acceleration` 音频片段从 `Project`\
  \ 面板拖放到 `Drone` 上。此时会自动创建一个 `Audio Source` 组件，当其在 `Inspector` 中显示时，`Low Acceleration`\
  \ 文件已自动分配给 `Audio Clip` 属性。在 `Scene` 视图中，还会出现一个由扬声器符号组成的音频源辅助图标（图 11-18）。\n\n![A978-1-4302-6587-0_11_Fig18_HTML.jpg](img/A978-1-4302-6587-0_11_Fig18_HTML.jpg)\n\
  \n图 11-18.\n\n`Scene` 视图中 `Drone` 游戏对象的音频源辅助图标\n\n在 `Inspector` 中，勾选 `Play On Awake`\
  \ 和 `Loop`。在 `3D Sound Settings` 部分将 `Min Distance` 设置为 `2`，`Max Distance` 设置为 `20`。\n\
  \n暂时取消勾选 `Audio` 游戏对象上的 `Audio Source` 组件以禁用背景音乐。保存场景并进行试玩测试。\n\n当玩家接近最终区域时，您会开始听到无人机的音频。当玩家进入该区域且敌方无人机开始移动时，音量会随着无人机靠近而增大。由于\
  \ `Volume Rolloff` 属性默认设置为 `Logarithmic Rolloff`，无人机越近，音量增加速率越快。添加音效后，敌方无人机无疑更具威慑力。\n\
  \n目前，`Audio Listener` 挂载在 `Free Look Camera Rig - Pivot` 的 `Main Camera` 子对象上。请记住，每个场景只能有一个\
  \ `Audio Listener`，因此在 `Hierarchy` 中找到 `Main Camera`，然后在 `Inspector` 中取消勾选其名称旁的复选框以禁用\
  \ `Audio Listener` 组件。\n\n返回 `Hierarchy`，找到 `Third Person Character Ragdoll` 并选中。在\
  \ `Inspector` 中选择 `Add Component` ➤ `Audio` ➤ `Audio Listener`。再次试玩，您会发现当无人机靠近时，其声音效果更好，因为玩家角色比摄像机更接近无人机。\n\
  \n在 `Hierarchy` 中找到 `Audio` 游戏对象，重新启用背景音乐的 `Audio Source`。使用 `Audio Source` 组件中的\
  \ `Volume` 设置来平衡背景音乐与音效的合适音量。\n\n每一个细节都至关重要，决定了游戏是优秀还是卓越。激光火花的噼啪声应从火花产生的位置发出，而非玩家上方的激光源。为抛射体添加多普勒效应能增强其速度感，而带有厚重低音的“嗖嗖”声则能让人感受到摆锤的沉重。\n\
  \n## 总结\n\n请为自己鼓掌——您已经掌握了 UnityScript 的基础知识，正走在成为游戏开发者的康庄大道上。您能够与玩家沟通，并使用 GUI 控件和\
  \ `OnGUI()` 函数增加交互性，还能自定义这些控件以匹配游戏的外观。您还添加了多种形式的音频，包括音效和背景音乐，丰富了游戏体验的深度。\n\n您已在\
  \ `Asset Store` 中找到了更多资源，并记得在游戏最终版本中使用的任何作品上注明资产创建者。同时，您也在游戏开发社区中结识了新伙伴。在下一章中，您将学习更多关于测试和优化游戏以便发布的技巧。胜利在望！\n\
  \n"
- "# 12. 优化你的游戏\n\n优化是游戏开发中一个广泛的分支，如同动画一样，它可以成为一个独立的职业领域。简单来说，它是提升游戏运行效率的过程。至少听起来很简单。\n\
  \n每个目标平台在 CPU（中央处理器）和 GPU（图形处理器）的处理能力方面都存在限制。无论场景是由少量高精度模型还是大量低精度运动部件构成，场景越精细，对处理器的需求就越高。\n\
  \n当需求过高时，游戏性能就会受到影响：玩家会遇到加载时间过长、卡顿或其他游戏错误，最糟糕的是，游戏会崩溃。优化过程就是在维持游戏性能与图形质量之间做出的一系列决策或权衡。\n\
  \n## 目标性能\n\n目标性能通常以期望的帧率或每秒帧数（fps）来表示。如第 4 章所述，帧率过低会破坏动画运动的错觉。虽然通常情况下，更高的帧率会带来更好的视觉体验，但需要每帧进行更多处理的复杂游戏，在可接受的\
  \ fps 目标范围的低端运行可能会更流畅。\n\n主机和 PC 的处理能力远强于移动平台，因此我们以移动设备为例来探讨，因为它们限制最多。不同的移动平台具有不同的性能，同一平台不同版本的移动设备也会有所差异，通常较老的设备内存更小、处理器更慢。您必须在设计阶段早期就确定平台内的目标市场，这将反过来指导您选择目标帧率。\n\
  \n最流行的两大平台，Apple 和 Android，采用了不同的方法。Apple 是一个由 Apple 公司设计的闭源操作系统，运行在 Apple 制造的设备上。Android\
  \ 是一个由 Google 设计的开源操作系统，被众多不同的设备制造商使用。当新版本操作系统发布时，旧设备能否支持新系统的功能取决于其处理能力。\n\nApple\
  \ 在任何特定时间通常只有少数几款 iPhone 或 iPad 设备在市场上销售，其用户在几个月内采用操作系统升级的比例超过 90%。Android 用户拥有的设备来自众多不同制造商，在任何特定时间其性能各不相同。随着制造商不断推出新设备，而部分用户仍保留旧设备，Android\
  \ 移动设备类别内的性能范围要广泛得多，特别是考虑到 Android 用户更新新版 Android 系统的采用率并不稳定（图 12-1），较旧的系统版本可能无法支持您希望在游戏中使用的某些功能。\n\
  \n![A978-1-4302-6587-0_12_Fig1_HTML.jpg](img/A978-1-4302-6587-0_12_Fig1_HTML.jpg)\n\
  \n图 12-1.\n\n运行在特定 Android 版本上的设备相对数量\n\n您必须根据希望覆盖的 Android 移动设备市场份额来考虑这些信息，这反过来将指导您设定目标性能帧率的位置。所有这些决策都应在游戏设计阶段早期完成。\n\
  \n\n\n## 追踪目标帧率\n\n在 Unity 编辑器中，运行障碍赛场景。在游戏视图的顶部菜单中，你会找到一个“统计信息”按钮。点击它，一个包含各种性能统计数据的覆盖层将会出现，其中包括\
  \ FPS（图 12-2）。\n\n![A978-1-4302-6587-0_12_Fig2_HTML.jpg](img/A978-1-4302-6587-0_12_Fig2_HTML.jpg)\n\
  \n图 12-2. 游戏视图顶部菜单中显示的统计信息\n\n“Draw Calls”（绘制调用）统计数据更为详细，它指明了 CPU 需要渲染的内容数量。理解这一点很重要：一个游戏对象可能会因为其应用的每种效果（如像素光照、阴影和反射）而在每一帧中被多次渲染。通过仅在效果对游戏外观有显著贡献时才使用这些效果，从而减少使用量，可以降低绘制调用，这意味着\
  \ CPU 的工作量也因此减少。\n\n你可以使用一个简单的脚本来设置目标帧率。在项目面板中，打开 Assets ➤ Scripts 文件夹，并创建一个名为 `SetTargetFrameRate`\
  \ 的新脚本。在 MonoDevelop 中打开它，并将代码编辑为以下内容：\n\n```\n#pragma strict\n\npublic var frameRate\
  \ : int = 50;\n\nfunction Awake () {\n    Application.targetFrameRate = frameRate;\n\
  }\n```\n\n这段代码的解析如下：\n\n`(1) public var frameRate : int = 50;`\n\n声明一个类型为 `int`\
  \ 的公有变量 `frameRate`，以便你可以从检视面板中调整它。\n\n`(2) Application.targetFrameRate = frameRate;`\n\
  \n将 `Application` 类的 `targetFrameRate` 属性设置为 `frameRate` 所持有的值。\n\n保存脚本。在 Unity\
  \ 编辑器顶部菜单中，选择 Game Object ➤ Create Empty，并将其命名为 `TargetFrameRate`。挂载 `SetTargetFrameRate`\
  \ 脚本，保存场景，然后运行。注意 FPS 并不会精确地保持在 50，甚至可能看起来没有效果。这是因为目标帧率不是一个绝对的限制。为了在统计信息中看到更明显的差异，将帧率改为\
  \ 25，再次运行，你会看到统计窗口中的 FPS 在一个更接近 25 的范围内变化。\n\n当你查阅脚本引用中的 `Application.targetFrameRate`\
  \ 文档时，你会发现将其设置为 –1 是默认值，这会将网络播放器游戏的目标帧率设为 50–60 fps，并告知独立平台尽可能快地渲染。完成后不要忘记将帧率改回\
  \ 50。\n\n## 何时何地进行优化\n\n在设计阶段做出的优化决策，很大程度上基于目标平台已知的限制。在开发过程中，遵循最佳实践建议可以避免因低效的开发技术而导致性能下降。除此之外，随着无数可能影响性能的细节汇集在一起，优化过程会根据游戏的独特特性变得非常动态。\n\
  \n## 设计阶段\n\n在设计阶段所做的决策远不止选择目标帧率。在考虑游戏美术时，目标平台的能力也起着作用。一个普遍的做法是，模型使用的顶点数不应超过必要数量，但\
  \ CPU 渲染限制是基于场景中的所有内容，包括其他因素（如颜色、光照和阴影的使用），而不仅仅是单独某个模型。请参考目标平台的文档以了解具体细节。\n\n移动设备通常无法处理超过\
  \ 100,000 个顶点，而 PC 则可以处理数百万个。你可能需要为移动游戏选择比基于 PC 的游戏低得多的背景细节，以保留主要游戏对象模型的细节。\n\n\
  另一个移动设备的限制是用于下载的文件大小。在游戏设计中融入模型、纹理和材质的复用，有助于控制整体文件大小。\n\n## 开发阶段\n\n遵循“如果没坏，就别修它”这一历久弥新的格言，请记住优化的目的是维持你设定的游戏性能水平。当你的游戏从头到尾都能以此水平运行时，你的工作就完成了！\n\
  \n对玩家的视觉冲击是游戏体验的重要组成部分，这就是为什么游戏图形工具会深入到逐像素级别，并需要进行多次渲染以融入光照、反射、阴影等每一个细节。视觉图形并非唯一可能阻碍游戏性能的因素。物理、动画、音频等也可能造成性能瓶颈。\n\
  \n在构建游戏并进行迭代测试时，瓶颈可能会在明显的游戏条件下出现，例如当复杂模型进入视野时、在特定的动画序列期间，或者在使用高发射率的粒子系统时，最好直接针对这些问题进行处理。\n\
  \n如果瓶颈的原因不那么明显，Unity 有多种工具可以帮助你识别它。编辑器分析器是一个极好的工具，可用于在编辑器或测试设备上评估你的游戏，但它仅在专业版中可用。iOS\
  \ 和 Android 平台有内置的分析器。尽管如此，你仍然可以从构建日志中获取关于游戏的有用信息。\n\n## 创建构建日志\n\n在 Unity 编辑器顶部菜单中，选择\
  \ File ➤ Build Settings（图 12-3）。将障碍赛场景从项目面板拖入“Scenes in Build”窗口。确保在平台窗口中选中了 PC,\
  \ Mac & Linux Standalone，以便 Unity 为你正在构建的目标平台生成正确的文件类型。点击 Build，然后在提示时选择你想要保存文件的位置，并点击\
  \ Save。\n\n![A978-1-4302-6587-0_12_Fig3_HTML.jpg](img/A978-1-4302-6587-0_12_Fig3_HTML.jpg)\n\
  \n图 12-3. 构建设置对话框\n\n当 Unity 完成游戏构建后，你可以通过选择项目面板中的控制台选项卡来访问构建日志。找到右上角的下拉菜单图标，然后选择\
  \ Open Editor Log（图 12-4）。\n\n![A978-1-4302-6587-0_12_Fig4_HTML.jpg](img/A978-1-4302-6587-0_12_Fig4_HTML.jpg)\n\
  \n图 12-4. 控制台下拉菜单\n\n构建日志将出现在控制台应用程序窗口中。除了其他信息外，你可以找到一个构成游戏的资源类型列表及其相对大小（图 12-5）。\n\
  \n![A978-1-4302-6587-0_12_Fig5_HTML.jpg](img/A978-1-4302-6587-0_12_Fig5_HTML.jpg)\n\
  \n图 12-5. 构建日志中显示的信息\n\n在其下方，你会找到一个“已使用资源”列表。加载时间受大小影响，而游戏玩家希望直接开始游玩。这意味着可以通过移除开发过程中在项目中积累的未使用资源来进行优化。移动设备用户在其设备上有更大的内存限制，以及其服务提供商指定的下载大小限制，因此应用大小是他们选择购买或下载你的游戏时的一个考虑因素。通过将“已使用资源”列表与你的\
  \ Assets 文件夹内容进行比较，你可以安全地移除任何未使用的资源。\n\n## 脚本\n\n本书多次通过提及良好的编码实践、高效代码和重构，间接地涉及了脚本优化。有多种技术可以用来优化你的代码。你可以将其中一些技术融入你的标准编码实践中，而其他示例则展示了在优化过程中，你可以采取的不同方法，直到达到目标性能。\n\
  \n\n\n### 静态类型与 `#pragma strict`\n\n你一直遵循的一项实践，现在需要更详细的解释。  \nMonoDevelop 为你创建的每个脚本都以\
  \ `#pragma strict` 开头。这一行代码告诉编译器“严格”地解释后续代码，从而强制你使用静态类型，否则会抛出编译器错误。\n\n静态类型是指在声明变量时指定其类型。在下面这行代码中，你显式地将\
  \ `myVariable` 声明为 `int` 类型：\n\n```\nvar myVariable : int = 2;\n```\n\n你也可以这样声明变量：\n\
  \n```\nvar myVariable = 2;\n```\n\nUnity 会通过一种称为类型推断的方法，自动将其转换为静态类型代码。虽然这种能力可以编写更简洁的代码，但如果变量无法被类型推断，Unity\
  \ 就会依赖动态类型。在动态类型中，Unity 必须根据赋予变量的值来“推断”其类型。“推断”需要时间，而耗费时间会影响游戏性能。坚持使用静态类型有助于提升性能，而\
  \ `#pragma strict` 则能确保你做到这一点。\n\n### 缓存组件查找\n\n这种脚本技术对于频繁使用的脚本尤其有效，但代价是代码量会稍多一些。`GetComponent()`\
  \ 函数就是一个查找的例子。在游戏对象中查找组件需要时间，并影响性能。这里的思路是只查找一次引用，然后将该引用缓存或存储在私有变量中，以便后续在脚本中使用。换句话说，尽量避免在\
  \ `Update()` 或 `FixedUpdate()` 函数中使用 `GetComponent()`。你在自己的 `GoRagdoll` 脚本中就用到了这种技术：\n\
  \n```\n#pragma strict\n\nprivate var childRigidBodies : Rigidbody[];\nprivate var\
  \ childColliders : Collider[];\npublic var invincible : boolean = false;\n\nfunction\
  \ Start ()\n{\n    childRigidBodies = gameObject.GetComponentsInChildren.<Rigidbody>();\n\
  \    childColliders = gameObject.GetComponentsInChildren.<Collider>();\n}\n...\n\
  ```\n\n布娃娃系统的刚体和碰撞体通过 `GetComponentsInChildren()` 函数查找找到，然后在 `Start()` 函数中分别赋值给各自的数组。\n\
  \n## 更多脚本优化替代方案\n\n任何能减少或避免逐帧计算的地方都能提升性能。其中一些方法较为高级，这里不做详细说明，但当与特定项目相关时，你可以更深入地探索它们。\n\
  \n### 使用触发器\n\n在 `LaunchProjectile` 脚本中，你通过使用 `Destroy()` 函数在实例化每个射弹 2 秒后将其销毁，减少了\
  \ Unity 需要追踪的射弹游戏对象的数量：\n\n```\nDestroy(projectileInstance, 2);\n```\n\n虽然这比任由射弹克隆体堆积要好，但\
  \ Unity 仍然需要追踪每个对象并检查其生命周期，直到达到 2 秒。`Destroy()` 函数的一种替代方案是使用触发器。首先，注释掉这行代码。\n\n\
  在你的障碍赛场景中，创建一个立方体游戏对象，并命名为 `DestroyProjectileTrigger`。将其变换位置设置为 (–12, 10.5, 47)，缩放设置为\
  \ (1, 3, 10)。移除网格过滤器和网格渲染器组件，这样你就只剩下一个简单的盒碰撞体。在盒碰撞体组件中勾选“是触发器”。\n\n在项目面板的 Assets\
  \ ➤ Scripts 文件夹中，创建一个名为 `DestroyProjectile` 的新脚本，并在 MonoDevelop 中打开。编辑代码如下：\n\n\
  ```\n#pragma strict\n\nfunction OnTriggerEnter(other : Collider) {\n    Destroy(other.gameObject);\n\
  }\n```\n\n将脚本附加到 `DestroyProjectileTrigger` 游戏对象上并保存场景。播放并观察射弹在进入触发器体积时消失。在后台，Unity\
  \ 像以前一样实例化游戏对象，并由物理引擎处理其运动，但现在 Unity 无需再对该游戏对象进行其他计算，直到它进入触发器体积。\n\n将触发器体积放置在紧邻高架轨道的位置，可以最大限度地缩短射弹的生命周期，从而更有效地提升游戏性能。将变换位置改为\
  \ (–4, 10.5, 47) 并播放。\n\n射弹在轨道的远端消失，但原本仍在轨道上方的拖尾痕迹会立即消失，这看起来不如之前痕迹贯穿整个轨道时效果那么好。这是优化中涉及取舍的一个例子。哪个更重要？是拖尾的视觉效果，还是将触发器体积紧靠高架轨道所带来的效率提升？由你来决定。\n\
  \n此外，从游戏玩法角度来看，如果玩家角色跑动或跳跃进入它会发生什么？呃哦——这可不好。你从 `KillOnTrigger` 脚本中已经知道如何检查 `other`\
  \ 的身份，因此如果你选择将触发器体积保持在玩家角色可触及的范围内，你可以实现一个解决方案：\n\n```\n#pragma strict\n\nfunction\
  \ OnTriggerEnter(other : Collider) {\n    if (other.gameObject.name == \"Projectile\"\
  )\n    {\n        Destroy(other.gameObject);;\n    }\n}\n```\n\n你可能会想，玩家一开始为什么要从侧面跳下去。可能是意外，可能是他们在探索，也可能只是随便玩玩。在开发游戏时，除了考虑游戏对象“应该”做什么之外，还必须考虑它们还“可能”做什么，并采取适当措施来消除错误，就像你刚才做的那样。\n\
  \n### 对象池\n\n随着你编程技能的不断提升，你将学到更高级的解决方案。对象池在优化射弹预制体方面更进了一步。实例化和销毁对象也会带来显著的计算开销。与其反复实例化和销毁游戏对象，不如创建一个游戏对象预制体的数组作为“池”，在需要时从中抽取，在不使用时归还。\n\
  \n### 协程\n\n协程可以在某一帧暂停其执行，然后在下一帧恢复并继续执行，可以跨越任意数量的帧。当你在 `Update()` 或 `FixedUpdate()`\
  \ 函数中调用另一个函数时，你调用的那个函数每帧都会从头到尾运行一遍。在 60fps 的帧率下，这意味着该函数每秒也被调用和执行 60 次。很多时候，你并不需要每帧都调用某个函数，尽管你可能希望它定期运行。相比之下，如果函数每十分之一秒调用一次——这对于许多游戏任务来说仍然足够快——那么每秒只需调用\
  \ 10 次，调用次数减少了六倍。使用协程可以实现这种显著的效率提升。\n\n\n\n"
- "# Mecanim 优化技巧\n\n与脚本类似，Unity 的脚本参考手册提供了使 Mecanim 动画更高效的一般性指南（表 12-1）。其中大部分内容超出了本书涉及的难度范围，但掌握这些信息有助于你在角色设计过程中（无论是自己创建还是与美术师合作）做出更好的决策。\n\
  \n-   使用哈希值而非字符串来查询 `Animator`。\n-   实现一个小型 AI 层来控制 `Animator`。你可以让它为 `OnStateChange`、`onTransitionBegin`\
  \ 等事件提供简单的回调。\n-   使用状态标签轻松地将你的 AI 状态机与 Mecanim 状态机匹配。\n-   使用附加曲线来模拟事件。\n-   使用附加曲线来标记你的动画（例如，与目标匹配结合使用）。\n\
  -   运行时优化：\n    -   始终通过将动画器的剔除模式设置为“基于渲染器”，并禁用蒙皮网格渲染器的“屏幕外仍更新”属性来优化动画。这样，当角色不可见时，动画将不会更新。\n\
  \    -   另一个良好的动画实践是使用哈希 ID。在使用动画器时，使用哈希标识符是一种优化方法，即将状态和参数的名称分配给整数。使用整数代替字符串可以减少处理开销。\n\
  \n如果你有兴趣深入挖掘 Mecanim 优化，可以在 Unity 手册中找到更多信息：`http://docs.unity3d.com/Manual/MecanimPeformanceandOptimization.html`。\n\
  \n"
- '# 项目设置


  一旦你最小化了各个性能瓶颈的影响，如果尚未达到目标游戏性能，你可以从项目全局的角度来处理更通用的优化决策点。


  Unity 中用于优化的设置是全局设置，这意味着它们适用于整个项目（图 12-6）。你是否想要或需要调整任何特定类别的设置，取决于从目标性能、游戏本身、目标平台，到开发过程中出现的性能问题类型等各种因素。采取逻辑方法，首先调整那些能带来最大改变的设置。


  ![A978-1-4302-6587-0_12_Fig6_HTML.jpg](img/A978-1-4302-6587-0_12_Fig6_HTML.jpg)


  *图 12-6. Unity 编辑器中的项目设置菜单 (Edit ➤ Project Settings)*


  ### 质量设置管理器


  图形质量与渲染速度需要权衡：你选择的质量越高，渲染越复杂，帧率就越低。质量设置管理器允许你为各种目标平台（如网页播放器、独立平台、iPhone、Android、Blackberry
  和 Google Native Client）选择不同的图形质量级别（图 12-7）。


  ![A978-1-4302-6587-0_12_Fig7_HTML.jpg](img/A978-1-4302-6587-0_12_Fig7_HTML.jpg)


  *图 12-7. 项目设置*


  绿色勾选标记表示默认设置。你可以通过其默认菜单，点击目标平台列中“默认”行的箭头来更改此设置（图 12-8）。


  ![A978-1-4302-6587-0_12_Fig8_HTML.jpg](img/A978-1-4302-6587-0_12_Fig8_HTML.jpg)


  *图 12-8. 质量设置管理器中的默认菜单*


  **名称**字段是为了方便你引用自己指定的特定质量设置组合。你可以通过“添加质量级别”按钮来添加新质量级别，或通过点击垃圾桶图标来删除它。


  **逐像素光照**是一种为每个屏幕像素计算光照效果的渲染方法。**逐顶点光照**效率更高，因为它只计算模型顶点上的光照效果，模型表面的其余光照则根据这些值进行插值计算。


  **逐像素光照**意味着光照对游戏对象的效果每帧都会计算，无论是像素光照还是顶点光照。如果一个网格被多个逐像素光照照亮，那么该网格会为每个光照渲染一次，这会迅速增加处理开销。


  质量设置管理器中的**像素光数量**用于设置在标准渲染过程“前向渲染”中使用的像素光数量。建议不要让任何游戏对象被超过一个像素光照射，尤其是在移动设备上。


  替代方案包括对静态游戏对象使用**光照贴图**，即预先计算游戏对象表面的亮度。你可以在 Unity 手册中找到光照贴图的详细步骤。最终结果是，游戏运行速度可以比仅使用动态光照快三倍。


  继续介绍质量管理器设置，**纹理质量**全局设置分辨率，即针对整个项目。更高的分辨率需要更多处理能力。要实现更定制化的方法，你可以使用纹理导入设置为每个纹理指定分辨率。


  **各向异性纹理**是指对纹理应用过滤过程以改变其外观。这通常用于平坦表面（如地面），使其在浅角度下看起来更好。


  其余设置深入到光照和阴影的更多技术层面，其中一些需要 Unity Pro 版本才能使用。光照和阴影是实现出色视觉效果的关键，但它们在性能方面可能代价高昂。目前，以下要点足以概括：


  -   质量设置可用于根据目标平台和纹理分辨率以及光照和阴影来优化图形质量。

  -   使用光照贴图来烘焙静态光照。

  -   限制游戏对象仅被一个逐像素光照照射，尤其是在移动设备上。


  ### 物理管理器


  物理引擎内置了性能优化功能，例如“睡眠”。当一个 `rigidbody` 的移动和旋转低于某个阈值时，物理引擎会认为它已停止。在该 `rigidbody` 再次被移动（例如，被另一个力作用或与另一个游戏对象碰撞）之前，物理引擎不会浪费处理能力去更新它。


  物理设置管理器中的“睡眠速度”和“睡眠角速度”属性值指定了“睡眠”阈值（图 12-9）。如有必要，你可以通过在脚本中使用 `rigidbody.WakeUp()`
  函数来访问并唤醒一个 `rigidbody`。


  ![A978-1-4302-6587-0_12_Fig9_HTML.jpg](img/A978-1-4302-6587-0_12_Fig9_HTML.jpg)


  *图 12-9. 项目设置*


  提高物理计算效率的另一种方法是使用层。层是 Inspector 中的一个属性，用于按组对游戏对象进行分类。就像游戏对象可以有相同的标签一样，游戏对象也可以共享相同的层。物理管理器底部的碰撞矩阵用于选择场景中哪些层会与哪些其他层发生交互。只有处于相互交互的层中的游戏对象才能发生碰撞，从而减少处理负载。


  处理需要碰撞体的复杂游戏对象时，一个标准做法是尽可能使用子基本碰撞体的集合，而不是网格碰撞体。网格碰撞体会占用大量处理能力，并且有局限性，例如无法注册与其他网格碰撞体的碰撞。你已经在用于布娃娃效果的原始碰撞体集合示例中看到了这种技术。




  '
- '# 时间管理器


  该管理器具有两项有助于物理优化的属性（图 12-10）。您已了解，在物理相关代码中应使用 `Fixed Timestep` 属性，因为物理计算依赖固定的时间间隔来生成逼真的游戏对象行为。您可以通过
  `Fixed Timestep` 属性调整固定的时间间隔。此处的优化权衡在于：增大更新间隔可降低处理器的计算需求，但物理模拟的精度会相应下降。


  ![A978-1-4302-6587-0_12_Fig10_HTML.jpg](img/A978-1-4302-6587-0_12_Fig10_HTML.jpg)


  图 12-10. 项目设置 - 时间管理器


  `Maximum Allowed Timestep` 属性通过限制物理计算的最大耗时，也有助于维持固定的时间间隔。这样，即使在固定时间间隔内需要进行过多的固定更新，物理引擎也不会拖慢帧率。


  '
- '# 音频管理器


  在音频管理器中，`DSPBuffer Size` 属性用于优化（图 12-11）。延迟是指声音播放前的滞后时间。各选项含义明确：`Best latency` 优先保证声音的快速响应而非性能，`Best
  performance` 优先保证音质而非低延迟，而 `Good latency` 则在延迟与性能之间取得平衡。


  ![A978-1-4302-6587-0_12_Fig11_HTML.jpg](img/A978-1-4302-6587-0_12_Fig11_HTML.jpg)


  图 12-11. 项目设置


  良好的音频使用实践包括：对较小的音效采用原生 WAV 或 AIFF 格式。这些文件已解压缩，运行时无需解码。与所有未使用的资源一样，项目开发阶段遗留的未用音频文件应及时删除。


  '
- '# 播放器设置管理器


  最直接实用的跨平台设置位于首个区域（图 12-12）。其他区域则因目标平台而异，在着手调整前需要充分了解该平台的特性。


  ![A978-1-4302-6587-0_12_Fig12_HTML.jpg](img/A978-1-4302-6587-0_12_Fig12_HTML.jpg)


  图 12-12. 项目设置 - 播放器设置管理器及展开的图标字段


  此处包含游戏标题的产品名称，以及图标和启动画面的纹理字段。在添加图标纹理前，务必确认已选择正确的目标平台——每个平台都有各自的尺寸要求。若未使用正确尺寸，轻则显示异常，重则可能导致应用商店拒绝上架。


  '
- '# 标签与图层管理器


  该管理器用于创建和编辑标签与图层（图 12-13）。对游戏对象进行分组管理，特别是通过对无需处理的组限制操作，可以有效降低处理开销。


  ![A978-1-4302-6587-0_12_Fig13_HTML.jpg](img/A978-1-4302-6587-0_12_Fig13_HTML.jpg)


  图 12-13. 项目设置


