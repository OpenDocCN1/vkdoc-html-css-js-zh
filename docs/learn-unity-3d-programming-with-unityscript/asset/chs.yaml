- '# 光照


  目前，你的新场景包含了天空盒背景和一个`Cube`游戏对象。若进入 Play 模式，立方体仍会保持黑暗。无论天空盒纹理中包含多少光线，它本质上只是一张天空的纹理或图像，并不会向场景中的游戏对象投射光线。要解决这个问题，你需要一个`Light`游戏对象。例如：


  - **方向光（Directional light）**：类似于太阳光，可照亮场景中的每一个游戏对象，但它并非来自单个点光源。

  - **聚光灯（Spot light）**：从单个点发出的锥形光区域，类似于聚光灯或手电筒。

  - **点光源（Point light）**：类似于灯泡，从中心点向所有方向发光。

  - **区域光（Area light）**：用于烘焙光照贴图，不在本书讨论范围内。


  使用层级视图中的`Create`按钮或顶部菜单中的**Game Object ➤ Create Other**，向场景中添加一个方向光。如果选择`Main Camera`，你会在`Camera
  Preview`中看到立方体明显变亮。重新选择`Directional light`，并在 Inspector 中查看其属性。


  第一个属性是`Type`。尽管你创建的是方向光，但可以通过此下拉菜单将其更改为其他类型的光。请注意，Inspector 会保持上下文相关，并会根据所选类型改变属性，但层级视图中的名称“Directional
  light”并不会反映此处所做的任何更改。


  ## 通用光照属性


  我想再次强调亲手操作 Unity 进行实验的重要性。以下对光照属性的描述并非枯燥乏味的说教——这些属性更适合观察和实践，而非被动阅读。虽然我不会为每个属性提供逐步指导，但我强烈建议你在
  Unity 中测试每一个属性，以便在 Scene 视图和 Play 模式下观察其效果。记住，你始终可以使用`Light`组件的齿轮图标来重置属性。


  ### Color（颜色）


  点击颜色框会弹出一个颜色选择器，用于选择任意颜色的光。如果点击吸管图标，颜色框中的颜色会随鼠标悬停位置的颜色而变化——例如，使用鼠标从电脑屏幕其他窗口显示的图像中抓取一个颜色样本。


  ### Intensity（强度）


  这是光的亮度，其中 8 为最亮，0 则为完全无光。虽然更改光的`Type`不会改变其值，但当你创建新光时，方向光（Directional）的默认值为`0.5`，而点光源（Point）和聚光灯（Spot）的默认值为`1`。


  ### Cookie（遮罩）


  Cookie 起到光前掩模或屏幕的作用，为光赋予阴影图案。在 Unity 编辑器中，使用`Transform`组件的齿轮图标选择`Reset`。然后将光的`Transform`位置设置为`(0,
  0, –2)`，`Type`设置为`Spot`。从顶部菜单中选择**Assets ➤ Import Package ➤ Light Cookies**。此时会打开`Import
  Packages`窗口，其中列出了 Unity 标准资源（Standard Assets）中可用的 Cookie。点击**Import**，然后检查`Project`面板中的`Assets`文件夹，会发现`Light
  Cookies`文件夹已加入`Standard Assets`文件夹中的`Skyboxes`文件夹内（图 3-15）。


  ![A978-1-4302-6587-0_3_Fig15_HTML.jpg](img/A978-1-4302-6587-0_3_Fig15_HTML.jpg)


  图 3-15. Unity 标准资源中`Light Cookies`包的内容


  将其中任意一个拖动到 Inspector 面板的`Cookie`属性中，观察光图案如何显示在`Cube`游戏对象上。


