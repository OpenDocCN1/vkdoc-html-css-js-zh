- "# 发布\n\n如果你想在 Unity 编辑器之外查看游戏的效果，可以在开发过程中的任何时刻将其作为独立程序运行。在编辑器中打开“障碍赛”场景后，从顶部菜单选择“文件\
  \ ➤ 生成设置”，打开“生成设置”窗口，操作方式与你之前在本章生成构建日志时相同（图 12-15）。“障碍赛”场景仍会出现在“场景在构建中”部分，右侧索引为\
  \ 0。\n\n首先选择一个平台，本例中选择“PC, Mac & Linux Standalone”。请注意右侧（图 12-16）。如果未显示，请点击“切换平台”按钮。Unity\
  \ 会对项目中特定于你所选平台的资源进行评估和处理，待所有内容为所选平台准备就绪后，Unity 徽标将出现在右侧。\n\n![A978-1-4302-6587-0_12_Fig16_HTML.jpg](img/A978-1-4302-6587-0_12_Fig16_HTML.jpg)\n\
  \n图 12-16. Unity 徽标出现在所选目标平台右侧\n\n现在你可以点击“生成”按钮，选择保存游戏独立版本的名称和位置，然后点击“保存”让 Unity\
  \ 生成游戏。最终生成的游戏文件取决于构建目标。在 Mac 上你会得到一个应用包，在 Windows 上则会得到一个包含 `.exe` 文件的资源文件夹。你可以自行试玩，或者将这些文件分发出去分享你的游戏。现在就来试试你的新独立版本吧。\n\
  \n你首先会看到一个带有 Unity 徽标的黑屏（图 12-17）。虽然所有游戏都会以此作为默认的启动画面，但只有专业版用户才能更改它。\n\n![A978-1-4302-6587-0_12_Fig17_HTML.jpg](img/A978-1-4302-6587-0_12_Fig17_HTML.jpg)\n\
  \n图 12-17. 独立游戏加载时首先出现 Unity 徽标\n\n## 切换场景\n\n即使是最简单的游戏也有启动画面，因此你需要知道如何使用\n\n返回\
  \ Unity 编辑器，保存“障碍赛”场景并保存项目。然后从顶部菜单选择“文件 ➤ 新建场景”来创建一个新场景。再次在顶部菜单中，选择“游戏对象 ➤ 创建空对象”，并将其命名为\
  \ `GUI`。\n\n在项目面板的“资产 ➤ 脚本”文件夹中，创建一个名为 `SplashGUI` 的新脚本，在 MonoDevelop 中打开它，并将代码编辑为以下内容：\n\
  \n```\n#pragma strict\n\nfunction OnGUI() {\n\n        GUI.Label(Rect(0, 0, 125,\
  \ 25), \"Splash screen\");\n\n        if (GUI.Button (Rect (Screen.width/2 - 50,\
  \ Screen.height/2 - 15, 100, 30), \"Start\")) {\n\n                Application.LoadLevel(1);\n\
  \n        }\n\n}\n```\n\n保存脚本，将其附加到 `SplashGUI` 游戏对象上，并将场景保存为 `SplashScene`。你在第\
  \ 11 章中使用过并创建了 GUI 标签和按钮。在这行代码中，数字 1 对应的是在“生成设置”屏幕中分配的索引：\n\n```\nApplication.LoadLevel(1);\n\
  ```\n\n你希望启动画面排在第一位，因此它的索引应为 0，紧随其后的“障碍赛”场景索引为 1。\n\n为此，在 Unity 编辑器顶部菜单中再次选择“文件\
  \ ➤ 生成设置”打开“生成设置”窗口。从项目面板的“资产 ➤ 场景”文件夹中，将 `SplashScene` 拖入“场景在构建中”部分。拖入后，它会被添加到“障碍赛”场景之后，并分配索引\
  \ 1。只需点击并拖动列表中的任意项目到你想要的位置，即可重新排列它们（图 12-18）。\n\n![A978-1-4302-6587-0_12_Fig18_HTML.jpg](img/A978-1-4302-6587-0_12_Fig18_HTML.jpg)\n\
  \n图 12-18. 在“生成设置”窗口中重新排序场景，使启动画面排在首位\n\n点击“生成”，在提示时保存并替换旧的“障碍赛”构建版本。现在，当你运行独立版本时，Unity\
  \ 徽标淡出后，启动画面场景就会出现（图 12-19）。\n\n![A978-1-4302-6587-0_12_Fig19_HTML.jpg](img/A978-1-4302-6587-0_12_Fig19_HTML.jpg)\n\
  \n图 12-19. 启动画面场景自动出现\n\n点击“开始”按钮，你就看到——障碍赛场景出现了。\n\n## 总结\n\n干得漂亮——你已经冲过终点线了！你可以微调游戏的性能，已经了解了用于场景切换的\
  \ `Application.LoadLevel()` 函数，并且发布了独立版本。\n\n不要被优化涉及的大量细节吓倒；只需知道你有许多工具可以用来处理游戏性能问题。现在，一个好的起点是致力于遵循脚本编写的最佳实践，并遵循\
  \ Unity 文档中提供的一个便捷检查清单中收集的一些基本原则（表 12-1）：\n\n表 12-1. 让游戏运行更快的简易检查清单，来自 Unity 脚本参考\n\
  \n| 以 PC 为目标时，保持每帧顶点数低于 20 万至 300 万，具体取决于目标 GPU。 |\n| 如果使用内置着色器，请从“移动”或“无光照”类别中选择。它们同样适用于非移动平台，但只是更复杂着色器的简化近似版本。\
  \ |\n| 保持每场景的不同材质数量较少——在不同对象之间尽可能多地共享材质。 |\n| 对所有非移动对象设置“静态”属性，以启用静态批处理等内部优化。 |\n\
  | 在非必要情况下不要使用像素光照——选择仅使用一个（最好是方向光）像素光照影响你的几何体。 |\n| 在非必要情况下不要使用动态光照——改为选择烘焙光照。 |\n\
  | 尽可能使用压缩纹理格式，否则优先选择 16 位纹理而非 32 位。 |\n| 在非必要情况下不要使用雾效。 |\n| 学习遮挡剔除的优势，并在具有大量遮挡的复杂静态场景中使用它来减少可见几何体和绘制调用的数量。规划你的关卡以受益于遮挡剔除。|\n\
  | 使用天空盒来“伪造”远处几何体。|\n| 使用像素着色器或纹理组合器来混合多个纹理，而不是采用多通道方法。|\n| 如果编写自定义着色器，始终使用尽可能小的浮点格式：`fixed/lowp`\
  \ 用于颜色、光照信息和法线。`half/mediump` 用于纹理 UV 坐标。`float/highp` 避免在像素着色器中使用，适用于顶点着色器中的位置计算。|\n\
  | 尽量减少像素着色器中复杂的数学运算，如 `pow`、`sin`、`cos` 等。|\n| 选择每个片段使用更少的纹理。|\n\n除了硬件和编译器限制外，这些建议中的大部分更像是指导方针而非硬性规则。你可以选择不遵循本章中的某些建议，但这没问题。当你对游戏的性能感到满意时，你可以决定是否再花更多时间进行进一步的优化，因为这可能是一种收益递减的练习。\n\
  \n重要的是，你了解了提升性能的良好实践，并且知道在开发过程中遇到性能问题时，如何从文档中找到优化方面的帮助。\n\n你现在已经掌握了使用 UnityScript\
  \ 进行基础编程以及使用 Unity 编辑器的基本知识。这仅仅是更多乐趣和兴奋的开始。在下一章中，你将获得许多资源，继续你的游戏开发之旅，结识同行，并且最重要的是——享受制作游戏的乐趣。\n\
  \n\n\n"
- '# 13. 下一步该怎么走


  恭喜你——现在你已经掌握了 UnityScript 的基础知识。学习任何一门新语言，真正精通都需要时间，以及反复的练习、练习、再练习。像任何技术领域一样，游戏开发也在持续且快速地发展，这意味着将一部分编程时间用于学习，应该成为你游戏开发生涯中的标准环节。这对游戏开发者来说意味着什么？去制作更多的游戏吧！


  本章提供了丰富的资源，包括从哪里获得特定技术问题的答案，如何与游戏开发社区建立联系，如何跟上最新动态，以及如何建立你的专业作品集。如果你尚未加入，本书的配套网站是[`www.learn-unityscript.com`](http://www.learn-unityscript.com/)，在那里你可以介绍自己、参与讨论、结识志同道合的游戏开发者、获得鼓励，以及分享你的游戏——尽情炫耀你的成果吧！


  信息很容易铺天盖地，所以请将不断提升技能作为你的首要任务。这意味着要投入大量时间亲手实践 Unity。没有游戏创意？那就继续阅读，了解更多关于游戏开发大赛和竞赛的信息。探索特定平台，或者专注于深入学习游戏开发中某个吸引你的特定领域，比如动画或人工智能。


  ## 脚本编写及其他技术资源


  在线论坛已成为全球游戏开发者聚集的主流场所，这一点毫不意外。论坛主要分为两类：纯技术论坛和讨论论坛。


  纯技术论坛侧重于为实际项目解决问题，并具有特定的格式；而讨论论坛则可以包含任何与开发者相关的话题，包括最佳实践、新闻、公告、工作机会，或者仅仅是轻松的闲聊。


  ## 技术论坛


  Unity 网站是 Unity 开发者首屈一指的资源。Unity Answers 是位于[`http://answers.unity3d.com`](http://answers.unity3d.com/)的技术论坛。图
  13-1 展示了其布局：问题以帖子标题形式呈现，并附有关联的话题标签、问题被查看的次数、是否已有回答、原帖发布者是否已接受某个答案，以及来自开发者社区的投票（通常基于问题的质量和有用性）。


  ![A978-1-4302-6587-0_13_Fig1_HTML.jpg](img/A978-1-4302-6587-0_13_Fig1_HTML.jpg)


  图 13-1. 在 Unity Answers 上发布的问题


  虽然问题没有愚蠢之分，但使用论坛也有其礼仪。开发者社区通常很友好且乐于助人，但重点是帮助你学习，而不是替你编写脚本。技术论坛成员的立场是，在提问之前，你应该已经尽一切努力自己找到解决方案。最重要的是，这意味着你为自己的脚本编写了一些代码，并进行了初步研究，例如在
  Unity 文档中自行搜索解决方案。如果你已经尽力而为但仍然卡住了，那么就该向 Unity Answers 求助了。


  在提问之前，先搜索一下。留意搜索结果中类似问题附带的标签，它们或许能帮助你优化搜索。很可能同样的问题以前已经被问过，答案已经存在。


  如果你找不到针对特定问题的解决方案，那么就该自己提问题了。一个好的问题应该非常具体，详细描述你尝试过的方法及结果，并包含一段实际的代码片段。使用超链接来引用你查阅过的文档并描述你的理解，同时引用论坛上你参考过解决方案的问题链接以及你的结果。通常，提出一个好问题的过程本身就能引导你自己找到答案。在提问表单的工具栏中，可以找到添加超链接、代码格式化、文件附件等功能（图
  13-2）。


  大多数论坛都提供积分或声望点数的累积机制，以及针对不同参与形式的有趣徽章。你可以通过提出好问题和给出好答案来获得积分。尽你所能去回答问题，即使你不觉得自己是专家。能够以易于理解的方式传达解决方案，不仅能让你因帮助他人而感到温暖，也能巩固你头脑中的概念，并增强你的信心。


  ![A978-1-4302-6587-0_13_Fig2_HTML.jpg](img/A978-1-4302-6587-0_13_Fig2_HTML.jpg)


  图 13-2. Unity Answers 的提问表单


  Stack Exchange 是一个庞大的开发者资源，包含多个论坛类别。你或许能猜到，位于[`http://gamedev.stackexchange.com`](http://gamedev.stackexchange.com/)的
  GameDev 是为游戏开发者服务的。位于[`http://stackoverflow.com`](http://stackoverflow.com/)的 StackOverflow
  则更侧重于纯粹的编程问题，对于关于游戏目标平台编码的问题可能很有帮助。


  GameDev Stack 和 Stack Overflow 网站也采用社区评级的直接问答形式（图 13-3）。


  ![A978-1-4302-6587-0_13_Fig3a_HTML.jpg](img/A978-1-4302-6587-0_13_Fig3a_HTML.jpg)![A978-1-4302-6587-0_13_Fig3b_HTML.jpg](img/A978-1-4302-6587-0_13_Fig3b_HTML.jpg)


  图 13-3. Stack Exchange 论坛采用社区评级的问答形式


  ## 其他开发者论坛


  另一个流行的游戏开发者资源是 Gamasutra。与编程相关的话题可以在[`www.gamasutra.com/category/programming`](http://www.gamasutra.com/category/programming)找到。它包含编程特写、编程动态、编程博客和编程职位等子类别（图
  13-4）。Gamasutra 更像是博客形式，更适合帮助你了解游戏开发者社区的最新动态，而不是寻找具体的技术答案。


  ![A978-1-4302-6587-0_13_Fig4_HTML.jpg](img/A978-1-4302-6587-0_13_Fig4_HTML.jpg)


  图 13-4. Gamasutra 的结构比纯技术论坛更非正式，话题也更广泛


  虽然 Unity 已经跨越了成为大多数游戏开发者首选的门槛，但在这里你也会看到对其他游戏引擎的提及。开发者在游戏发布后撰写的“项目复盘”，分析开发和发布过程中哪些做对了、哪些做错了，这些内容提供了来自实战一线的极佳实践学习点。




