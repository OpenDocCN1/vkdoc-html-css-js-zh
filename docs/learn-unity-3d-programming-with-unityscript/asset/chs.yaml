- '# 创建动画控制器


  现在你有了角色和动画，还需要一个控制器来播放动画。动画控制器是一种游戏对象组件，用于将动画剪辑的行为连接到游戏对象模型。


  首先选择 `Assets` 文件夹，然后依次选择 Create ➤ Folder 并将其命名为 `Animator Controllers`，接着双击打开该文件夹。接下来选择
  Create ➤ Animator Controller 并将其命名为 `zombieController01`。双击 `zombieController01`
  在动画器视图中打开它（图 5-19）。


  将鼠标光标置于动画器视图中，右键点击网格，在上下文菜单中选择 Create State ➤ Empty。


