- '# 华丽登场


  此示例将通过让玩家在能量闪光中以北欧神祇般的华丽方式登场（图 8-5），为场景增添炫酷效果。


  ![A978-1-4302-6587-0_8_Fig5_HTML.jpg](img/A978-1-4302-6587-0_8_Fig5_HTML.jpg)


  图 8-5. 玩家在游戏开始时华丽登场


  为了了解即将实现的效果，首先你将查看 Unity 示例资源中的各种粒子特效。对于你的第一个粒子系统，你将从一个示例资源预制件开始并进行修改。接着，你将从头开始创建一个自定义粒子系统，并最终将这些系统组合成一个复杂的粒子效果。最后，你将使用脚本将粒子效果及与其他游戏对象的交互整合到障碍赛场景中。


  为了直奔主题，请在项目面板中进入 `Assets ➤ Sample Assets ➤ Sample Scenes ➤ Scenes`，打开`粒子`场景，然后试玩一番。爆炸、火焰、沙尘暴、烟花、水花喷射等等，尽在指尖——太棒了！


  好了，当你准备好继续时，仔细观察沙尘暴，注意整个区域是如何被覆盖的。这是一个简单的粒子系统，其发射器的大小使用有着显著的不同。


  在层级面板中，选择 `Particle Systems ➤ DustStorm`。接着，在检查器中展开`粒子系统`组件的`形状`模块。注意它是一个立方体形状——一个非常大的立方体，`x`和`z`值均为
  100。这个整个`100×100`的立方体就是粒子发射器，它在该立方体表面区域上发射整个沙尘暴，因此播放时看起来覆盖了整个场景。


  你将在障碍赛场景中构建你的粒子效果。继续在编辑器中重新打开障碍赛场景，并删除默认的粒子系统。


  在项目面板中，选择 `Assets ➤ Sample Assets ➤ Effects ➤ Particle Systems ➤ Prefabs` 文件夹，将`DustStorm`粒子系统预制件的一个副本拖入场景，并将其重命名为`DustPuff`。玩家角色的着陆将通过一团灰尘的扬起得到强调。我们将从这里开始，因为它是最简单的。



  '
- '# 灰尘爆裂


  这里的目标是产生一股突如其来的灰尘，以强调玩家撞击地面的力度。选中`DustPuff`后，将注意力转向检视面板中的粒子系统组件（图 8-6）。


  ![A978-1-4302-6587-0_8_Fig6_HTML.jpg](img/A978-1-4302-6587-0_8_Fig6_HTML.jpg)


  图 8-6. `DustPuff` 粒子系统组件设置


  其时序为：能量爆发首先出现，玩家从其中下落至地面，双脚着地，而灰尘则在撞击的瞬间扬起。


  要实现单一的短暂灰尘爆裂，请将 `Duration` 设置为 1 秒，并取消勾选 `Looping`。将 `Start Delay` 设置为 0.75。这将为能量爆发和玩家出现留出一些时间，特别是为了与玩家落地的时刻同步。


  打开 `Start Lifetime` 的下拉菜单，选择 `Random Between Two Constants`，并在相应字段中输入 0 和 2。为粒子的
  `Start Lifetime`、`Start Speed` 和 `Start Size` 引入一些随机性，可以使粒子系统看起来更“自然”。将 `Start Size`
  的值改为 0.5 和 10。


  为了让灰尘向上喷涌然后落回地面，而不是像吹散一样，请将 `Gravity Multiplier` 改为 1。如果你想实现烟雾或蒸汽效果，可以将其设为负值，使粒子向上飘散开。


  为了实现爆裂效果，在 Emission 模块中将 `Rate` 改为 0。现在在 Bursts 中，点击 +，然后将 `Time` 设置为 0.10，`Particles`
  设置为 50。


  使用 Shape 模块，使灰尘爆裂更集中于玩家角色落地区域周围。将 `Shape` 属性设置为 `Cone`，其 `Angle` 应为 25，`Radius`
  为 1，并将 `Emit from:` 属性设置为 `Base`。


  在场景视图中使用 `Simulate` 和 `Stop` 按钮，测试你在更改过程中对 `DustPuff` 粒子系统的改动。现在将第三人称角色布娃娃的 `Transform.position`
  移动到 (0, 4, 0)，并确保 `DustPuff` 的 `Transform.position` 为 (0, 0, 0)，`Transform.rotation`
  为 (90, 0, 0)。保存场景并运行测试。


  '
- '# 能量爆发


  接下来要添加到“盛大登场”中的粒子系统是能量爆发（图 8-7）。在编辑器顶部菜单中，选择 Game Object ➤ Create Other ➤ Particle
  System，并将其命名为 `EnergyBurst`。将 `Transform.position` 改为 (0, 4, 0)，以使爆发来自玩家角色最终着陆点的上方。


  ![A978-1-4302-6587-0_8_Fig7_HTML.jpg](img/A978-1-4302-6587-0_8_Fig7_HTML.jpg)


  图 8-7. `EnergyBurst` 粒子系统组件设置


  检视面板中 Initial 模块的设置只需要更改少数几项。虽然这不会是一次真正瞬间的能量爆发，但会是一次短暂的、一次性粒子发射，产生类似等离子体的光流。将 `Duration`
  改为 1 秒并取消勾选 `Looping`。将 `Gravity Multiplier` 增加到 1，否则玩家角色下落速度会比粒子到达地面的速度更快。


  在 Emission 模块中，将 `Rate` 改为 200。接下来，在 Shape 模块中，选择 `Box`。为了获得更集中的粒子流，将 `Box X` 和
  `Box Z` 设置为 0.2。


  最后，勾选并展开 Color Over Lifetime 模块。双击 `Color` 字段以打开渐变编辑器（图 8-8）。根据图 8-8 选择并移动各个游标，更改它们的颜色和
  Alpha 值。图中左下角的游标以浅电蓝色开始，过渡到右下角第二个游标的淡薰衣草色。左上角的游标 Alpha 值为 100%，右上角的游标 Alpha 值为 0%。你也可以根据需要点击添加更多游标，以实现更多变化。


  ![A978-1-4302-6587-0_8_Fig8_HTML.jpg](img/A978-1-4302-6587-0_8_Fig8_HTML.jpg)


  图 8-8. Color Over Lifetime 模块的 `Color` 属性所使用的渐变编辑器


  虽然本书中的示例使用的是现成的资源，但若想获得更接近闪电的效果，你需要创建一个使用更尖刺形状纹理的材质。要制作粒子材质，请在 Project 面板中创建一个新材质，然后在其
  `Shader` 属性的下拉菜单中，将默认的 `Diffuse` 更改为从 `Particles` 类别中选择一个（图 8-9）。


  如需粒子系统自定义材质和纹理的更多示例，请打开 `Assets` ➤ `Sample Assets` ➤ `Effects` ➤ `Particle Systems`
  文件夹，查看 `Materials` 和 `Textures` 文件夹中的内容。


