- '# 非正式团体、组织与聚会


  Unity 开发者遍布各地，有许多场合可供你与新同行们相聚。不那么技术化的 Unity 论坛就位于 Unity 社区菜单中“答案”选项卡的旁边（见图 13-14）。


  ![A978-1-4302-6587-0_13_Fig14_HTML.jpg](img/A978-1-4302-6587-0_13_Fig14_HTML.jpg)


  图 13-14. Unity 社区论坛


  在这里，你可以与在线 Unity 开发者社区交流。如果你想线下见面，可以选择“用户组”选项卡来寻找本地小组。你会发现许多这类小组都列在 Meetup 上，该网站是一个中心化平台，用于寻找任何共同兴趣的本地人群。


  如果在 Unity 用户组列表中看不到你所在地区的小组，不妨直接搜索 `www.meetup.com`。在这里，你可以找到较新、较小的本地 Unity 小组；如果没有找到，你可以将
  Unity 游戏开发列为兴趣领域，这样当你的地区有小组成立时，你会收到通知。你甚至可以考虑自己创建一个。本地小组的活动形式多种多样，可以是纯粹的社交聚会、技术演示、针对小组成员项目的反馈会议、实践教程课程，或者成员感兴趣的任何内容。


  GDC（游戏开发者大会）是游戏开发行业的年度盛会，数以万计的游戏开发行业人士在此聚集。在这个大型聚会期间，会有讲座与教程、竞赛与奖项、工作坊、社交活动、派对等。所有详情可在
  `www.gdconf.com` 找到。


  Unity 有自己的年度会议，名为 Unite。Unite 每年在北美不同城市举办，并在全球设有其他地区性会场（见图 13-15）。在此，你会找到与 Unity
  相关的所有内容：技术、艺术以及商业方面。有实践培训工作坊、行业资深人士的演讲，以及新功能和产品的预览。你无需达到一定经验水平或发布过游戏即可参加。事实上，在 Unite
  开始之前，还有一个额外的 Unity 培训日，专为完全没有经验的人提供，让他们在主要会议开始前对 Unity 有一个入门了解。关于 Unite 和 Unity
  培训日的更多信息，请访问 Unity3D 网站 `http://unity3D.com/unite`。


  ![A978-1-4302-6587-0_13_Fig15a_HTML.jpg](img/A978-1-4302-6587-0_13_Fig15a_HTML.jpg)![A978-1-4302-6587-0_13_Fig15b_HTML.jpg](img/A978-1-4302-6587-0_13_Fig15b_HTML.jpg)


  图 13-15. 2014 年 Unite 的主会场与地区会场


  IGDA（国际游戏开发者协会）是一个大型的非营利专业组织，致力于为行业发声，并为会员提供全年赞助活动、折扣、教育网络研讨会等福利。其官方网站为 `www.igda.org`。


  '
- '# 游戏开发限时挑战（Game Jams）


  游戏开发限时挑战（Game Jams）是一种在超级有趣且高强度的环境中提升技能的绝佳方式。它们本质上是组织化的团体挑战，个人或团队必须在短时间内（通常为 24
  到 48 小时）从零开始创作一个游戏。


  团队在游戏开发限时挑战开始时由参与者组成。他们的目标是制作出一个可运行的游戏原型。该原型必须符合挑战的指导方针，这些方针可能会指定必须使用的主题或功能等。


  参与者可以是任何参与游戏开发的人，包括程序员、美术师和游戏设计师，但熟练程度各不相同。无论你是多么新手，或者能参与多少小时，你总能找到自己能贡献的事情。像搜索素材或录制音效这样简单的事情也是有价值的贡献。有些挑战允许通过互联网参与，但挑战的真正意义在于聚在一起结交朋友并享受乐趣。


  -   Global Game Jam：`http://globalgamejam.org`。每年一月举行的大型年度游戏开发限时挑战活动。这是一个在全世界数百个地点同步进行的协调活动。

  -   Ludum Dare：`http://ludumdare.com`。每四个月举行一次的在线游戏开发限时挑战，包含两个并行的活动（竞赛组和挑战组）。竞赛组是两者中强度较大的，你必须独自工作，在
  48 小时内根据主题创建所有游戏代码和资源。挑战组则更轻松，允许团队合作和复用现有资源，并给予 72 小时完成。

  -   Nordic Game Jam：`http://nordicgamejam.org`。全球最大规模的游戏开发限时挑战之一，在丹麦举行。


  如果大型活动令人生畏、不便参加或实在距离太远，可以尝试从“一月一游戏”开始：`http://onegameamonth.com`（见图 13-16）。它对所有人开放，但可能是最友好、最不吓人、最鼓舞人心的游戏开发限时挑战网站。活动在线进行，每月都有一个新挑战。


  ![A978-1-4302-6587-0_13_Fig16_HTML.jpg](img/A978-1-4302-6587-0_13_Fig16_HTML.jpg)


  图 13-16. 一月一游戏：一个友好、低调的在线游戏开发限时挑战网站


  如果你对某个限时挑战感兴趣，应该能在像 `http://gamejamcentral.com` 这样的网站上，或者通过简单的在线搜索，找到适合自己的挑战。


  关于赞助活动的一句话：务必仔细阅读细则。通常，奖品仅仅是炫耀的资本，外加游戏开发限时挑战组织方提供的游戏推广奖励。有些挑战的规则可能包括将活动期间制作游戏的部分或全部权利转让，因此请务必了解相关要求。


  '
- '# 竞赛与奖项


  一般来说，竞赛是一种为获胜者（有时也包括亚军）提供奖励的竞争，而奖项和颁奖典礼则是对某种重大成就的认可。你可能会发现有些竞赛的唯一奖品就是炫耀的资本，而有些颁奖典礼则在奖项本身之外，还提供丰厚的奖品包。




  '
- '# 竞赛


  竞赛通常由赞助方举办，并为获胜者提供奖品。与游戏开发冲刺活动类似，这些竞赛可以是本地或在线形式，奖品套餐有大有小，但通常截止日期为数月左右，因为主办方期望的是精良的最终产品，而非仓促拼凑的原型。高额现金奖励通常由公司赞助，以此激励开发者专注于制作利用其软件或硬件产品的游戏。奖品套餐可能包含免费许可证、额外推广机会以及其他有价值的赠品。


  举例来说，在撰写本文时，Unity 与微软联合举办了一场面向 Windows 和 Windows Phone 平台的 Unity 游戏竞赛（图 13-17）。


  ![A978-1-4302-6587-0_13_Fig17_HTML.jpg](img/A978-1-4302-6587-0_13_Fig17_HTML.jpg)


  图 13-17. 竞赛及其奖品示例


  请密切关注 Unity、游戏平台制造商以及行业组织的活动网站，以获取竞赛公告信息。将搜索范围从“游戏开发者”扩大到“应用开发者”，因为许多应用竞赛都设有游戏类别。如果您居住在大都市区，请查询当地会议中心的日程表，关注电子游戏、电子产品及应用相关活动。竞赛结果通常会在活动上公布，因此请记住，竞赛规则的公布日期和作品提交截止日期将远早于实际活动举办时间。


  请仔细阅读细则。了解截止日期、规则以及参与协议可能产生的后果。如果错过了截止日期，就无法获胜。如果不遵守规则，可能会被取消资格。如果不阅读细则，您根本无法预料会发生什么。我曾见过有人因参加竞赛而意外失去了其游戏的所有权。


  以 Windows 商店为例，要符合竞赛资格，您的游戏必须在 2014 年 5 月 1 日至 2014 年 7 月 20 日期间发布于 Windows 商店，因此游戏的所有权毫无疑问仍属于您。另一方面，这也意味着您的游戏必须完成
  Windows 商店的提交流程，这或许意味着您应该已经设立了您的商业实体。如果您习惯于在截止日期前几分钟才将刚完成的作业交给老板或教授，那么您的游戏很可能无法及时送到评委手中。


  '
- '# 奖项


  奖项通常与特定活动挂钩，尽管它们本身可能就是颁奖典礼举办的缘由。


  前面提到的年度 Unite 大会设有奖项，旨在表彰基于 Unity 开发的游戏所取得的成就与进步。表 13-1 列出了多种奖项类别及其描述。


