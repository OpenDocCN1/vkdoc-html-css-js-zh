  文件夹中的 `alpha@zombie_running` 剪辑拖拽到 `Motion` 字段中（图 5-20）。


  ![A978-1-4302-6587-0_5_Fig20_HTML.jpg](img/A978-1-4302-6587-0_5_Fig20_HTML.jpg)


