- "# 4. 使用脚本与游戏对象\n\n既然你已经掌握了编程基础知识，并对 Unity 编辑器及其配套的开发者工具有了很好的理解，那么是时候将脚本引入游戏场景了。\n\
  \n脚本与 Unity 游戏引擎协同工作。你的脚本使用 Unity API 中的类、函数和变量来定制游戏对象的行为。你已经看到，当你创建新项目时，Unity 会创建一个非常基本、可运行的游戏，它由一个空场景组成。类似地，当你创建一个新脚本时，Unity\
  \ 会用空的 `Start()` 和 `Update()` 函数填充它。\n\nUnity 游戏引擎在后台做了大量工作。无论你是否附加了脚本，它都会在每个游戏对象上运行\
  \ `Start()` 和 `Update()` 函数。当你像在第 2 章中所做的那样，在 `Start()` 或 `Update()` 函数的花括号内添加代码时，你就是在重写该函数。\n\
  \nUnity 游戏引擎仍然会在游戏初始化和运行期间的适当时机运行 `Start()` 和 `Update()` 函数。但是，最初它们是空的且不执行任何操作，而添加你的代码则重新定义了每次调用这些函数时游戏内部会发生什么。\n\
  \n理解一点这些幕后操作至关重要。你需要了解游戏引擎何时调用各个函数，以便决定哪个函数是重写的正确选择，从而使游戏对象按照你想要的方式运行。\n\n你将开始使用第\
  \ 2 章中介绍的一些编程命令，来直接或通过玩家交互影响游戏对象的行为。你还将开始使用 Unity API 中几乎适用于所有游戏类型的通用类和函数。\n\n我强烈建议你花时间亲自在脚本中键入示例代码，而不是复制粘贴。虽然这会多花一点时间，但意义正在于此。亲自打字迫使你放慢速度，专注于代码的每一部分，这反过来有助于你记住并回忆起这里学到的概念。\n\
  \n\n\n### 脚本作为行为组件\n\n延续之前的项目，在编辑器顶部菜单中选择 `Assets` ➤ `Import Package` ➤ `Scripts`（如图\
