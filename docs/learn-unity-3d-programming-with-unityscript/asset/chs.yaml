- "# 三维空间处理\n\n三维空间的处理方式与二维空间基本相同，只是增加了表示第三维度的值。`z`轴垂直于`x`轴和`y`轴。在 Unity 中，它们的朝向是这样的：`x`在计算机显示器上水平左右分布，`y`在显示器上垂直上下分布，而`z`代表深度，即“进入”和“离开”显示器的方向。换句话说，`xz`平面是“地面”，而`y`是高度。原点是`(0,\
  \ 0, 0)`，表示`x`、`y`和`z`的值。在 Unity 中，这也被称为世界零点——即你的游戏世界的中心。正如你在二维空间中看到的，三维空间中的向量也是相对于原点表示的（图[2-37]）：\n\
  \n![A978-1-4302-6587-0_2_Fig37_HTML.jpg](img/A978-1-4302-6587-0_2_Fig37_HTML.jpg)\n\
  \n**图 2-37.** 三维空间中的向量\n\n`Vector3`是一个结构体，它保存`x`、`y`和`z`的值。查阅 Unity 脚本参考中的`Vector3`，你会发现它与`Vector2`非常相似，拥有方便且常用的静态变量、`x`、`y`和`z`分量及向量模长值，以及许多相同的函数和运算符。\n\
  \n为了进行比较，可以查看 Unity 脚本参考中的`Vector3.magnitude`（图[2-38]）：\n\n![A978-1-4302-6587-0_2_Fig38_HTML.jpg](img/A978-1-4302-6587-0_2_Fig38_HTML.jpg)\n\
  \n**图 2-38.** Unity 脚本参考中关于`Vector3.magnitude`的描述\n\n现在，计算将`z`分量值也考虑在内。更新你的代码以计算三维向量的模长，如下所示：\n\
  \n```\n#pragma strict\n\nfunction Start () {\n    var myVector : Vector3 = Vector3(3,\
  \ 4, 12);\n    Debug.Log(myVector.magnitude);\n}\n```\n\n运行测试，控制台应该会显示模长为 13。\n\n\
  **注意**\n\n“播放（Play）”、“运行（Run）”、“测试（Test）”、“进入播放模式（Enter play mode）”、“播放以测试（Play\
  \ to test）”和“运行测试（Playtest）”都是指在 Unity 编辑器游戏视图中播放场景的等效术语。\n\n无论你使用二维还是三维向量，这些变量、函数和运算符构成了处理游戏玩法判断的基本工具的一部分，这些判断基于你各种游戏对象的位置和方向。现在，你知道了如何声明变量（包括`Vector2`和`Vector3`这样的结构体），如何调用函数来处理变量中的数据，以及在哪里找到\
  \ Unity 内置的函数。\n\n## 总结\n\n现在，你知道了如何使用 Unity 脚本编辑器 MonoDevelop，并且已经了解了基本的编程术语和概念——干得好！本章既是入门指南也是参考资料，为你奠定了必要的基础。从现在开始，你将看到脚本对\
  \ Unity 编辑器中游戏对象产生的影响。而我说“影响”，是指你即将接触到更多的动作、爆炸和音效——哇哦！\n\n"
- '# 3. 制作一个简单场景


  到目前为止，你已经设置好了游戏开发环境，并且对编程基础、脚本工具 MonoDevelop 以及 Unity 脚本参考有了初步了解。本章的重点是你的主要游戏开发工具——Unity，以及如何创建和管理构成基础游戏场景的基本部分。


  一个游戏由多个场景组成，一个场景由多个游戏对象组成，一个游戏对象由多个组件组成，而组件具有由其内部函数控制的属性，如图[3-1]所示。在本章中，你将通过 Unity
  编辑器界面动手实践如何将这些元素组合成一个场景，同时还会介绍 Unity 为你提供的便利的“Standard Assets”资源包。


  ![A978-1-4302-6587-0_3_Fig1_HTML.jpg](img/A978-1-4302-6587-0_3_Fig1_HTML.jpg)


  **图 3-1.** Unity 中游戏的组成元素


  ## 新建项目，新建场景


  是时候动手了。和[第 2 章]一样，使用 Unity 编辑器顶部菜单选择`File ➤ New Project`来创建一个新项目。此时将打开“Project Wizard”窗口。命名你的项目，确保选中`Create
  new Project`选项卡，保持默认设置（3D），然后创建你的新项目。和之前一样，你的新项目及其空场景将会出现在 Unity 编辑器中。通过这个快速而简单的过程，Unity
  为你搭建了一个可立即运行的骨架游戏。


  如果你好奇，可以在 Finder 或资源管理器中查看游戏所需基本文件的内容（图[3-2]）。资源是你创建或导入到项目中的项目，例如模型、动画、脚本和音频片段；这些资源会被自动放入`Assets`文件夹。Unity
  接受多种文件类型，然后在内部将其转换为兼容版本。同时，Unity 会生成称为元数据的额外数据，放在`Library`文件夹中，这些数据除其他功能外，还有助于 Unity
  在你在游戏中使用这些资源时知道在哪里找到它们以及它们之间的关联方式。Unity 以特定方式自动组织这些文件夹和文件，因此如果你移动这些文件夹或文件，Unity
  编辑器将无法找到它们。


  ![A978-1-4302-6587-0_3_Fig2_HTML.jpg](img/A978-1-4302-6587-0_3_Fig2_HTML.jpg)


  **图 3-2.** Unity 自动创建的新项目文件


  **注意**


  始终使用“Project”视图来组织`Assets`文件夹中的资源。


  回到 Unity 编辑器，你要做的第一件事是命名并保存你的场景。Unity 处理保存的方式与文字处理器等其他程序略有不同。当你在处理游戏场景时，使用`Save
  Scene`来保存对其所做的更改。尽管根据名称你可能认为`Save Project`会保存项目中的所有内容，包括你正在处理的场景，但实际上它保存的是项目中除当前场景之外的所有内容，例如资源或整体项目设置。与任何计算机操作一样，养成经常保存工作的好习惯是明智的。


  从视觉上看，场景是 Unity 编辑器“Scene”视图中显示的二维或三维空间，它以游戏对象的形式包含游戏内容。虽然一个场景可以构成整个游戏，但通常游戏的不同关卡和菜单会使用各自独立的场景。


  场景的维度空间使用笛卡尔坐标系定义。要查看这一点，在 Unity 编辑器顶部菜单中选择`GameObject ➤ Create Other ➤ Cube`（图[3-3]）。


  ![A978-1-4302-6587-0_3_Fig3_HTML.jpg](img/A978-1-4302-6587-0_3_Fig3_HTML.jpg)


  **图 3-3.** Unity 顶部菜单 `GameObject ➤ Create Other ➤ Cube`


  新的游戏对象会作为“Cube”出现在“Hierarchy”视图中，其线框（gizmo）会出现在“Scene”视图中，而其组件则出现在“Inspector”视图中。在“Inspector”视图中，你会在“Transform”组件中看到游戏对象的位置用其坐标`(x,
  y, z)`来描述。默认情况下，Unity 将新游戏对象放置在原点`(0, 0, 0)`，即世界零点（图[3-4]）。


  ![A978-1-4302-6587-0_3_Fig4_HTML.jpg](img/A978-1-4302-6587-0_3_Fig4_HTML.jpg)


  **图 3-4.** 在“Inspector”面板中显示的 Cube 游戏对象位置




