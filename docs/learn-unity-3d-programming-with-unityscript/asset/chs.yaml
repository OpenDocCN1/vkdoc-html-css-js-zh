  你可以在资源商店中找到更多动画，它们可以是独立的动画片段或资源包，也可以包含在完整项目中，比如 Unity Technologies 制作的 Mecanim 演示项目。你现在已经熟悉了在资源商店中浏览的方法，所以我想介绍另一个动画来源，它能让你更进一步，提供一些编辑功能。


