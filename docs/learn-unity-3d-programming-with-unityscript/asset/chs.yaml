  对象，然后将鼠标光标移至场景视图，按下 `F` 键。`F` 键会将场景视图的焦点移动到你在层级视图中选中的对象上。请注意，场景视图中除层级视图搜索结果中的对象外，其他所有内容都变灰了（图
