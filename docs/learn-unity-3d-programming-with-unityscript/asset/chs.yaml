  \ 动画系统。这正是为“紧张刺激的动作场面”注入“动作”的关键所在！\n\n"
- "# 5. 移动游戏对象\n\n你已经构建了一个基本场景，并用游戏对象充实了它。你添加了脚本，允许用户交互来添加和销毁游戏对象，以及改变它们的外观。现在，是时候加入移动功能了。\n\
  \n首先，你将学习如何使用游戏对象的变换组件通过脚本来移动游戏对象。然后，你将初步了解如何使用 Unity 的 Mecanim 系统来处理资源商店中更复杂的游戏对象角色。这些角色带有内置动画，你将学习如何通过脚本操控它们。\n\
  \nUnity 游戏引擎还提供了游戏对象在响应重力或与其他游戏对象碰撞等作用力时的移动和交互。这些由 Unity 游戏引擎的物理系统控制，将在第 6 章和第 7\
  \ 章中介绍。\n\n## 旋转\n\n由于球体从任何角度看起来都一样，因此它并不是演示旋转运动的最佳形状。与其删除它，不如先禁用它。在项目面板的资源文件夹中找到的预制件子文件夹中，选择球体预制件。在检查器顶部附近，取消选中预制件名称“Sphere”左侧的复选框以禁用它（图\
  \ 5-1）。\n\n![A978-1-4302-6587-0_5_Fig1_HTML.jpg](img/A978-1-4302-6587-0_5_Fig1_HTML.jpg)\n\
  \n图 5-1. 在检查器中禁用球体预制件\n\n在层级视图中，选择“创建 ➤ 立方体”。Unity 的原始对象立方体将出现在场景视图的 (0, 0, 0) 位置。\n\
  \n在检查器视图中，选择“添加组件 ➤ 新建脚本”，将其命名为 `MoveCube`，并确保语言属性为 JavaScript。点击“创建并添加”按钮，它将作为组件出现在检查器中。在项目面板中，该脚本出现在资源根文件夹中。为了保持项目整洁，将其移动到脚本文件夹。\n\
  \n现在在 MonoDevelop 中打开 `MoveCube`。为了获得移动的错觉，你希望 Unity 在每一帧中将立方体渲染到略微不同的位置，这意味着你需要使用\
  \ `Update()` 函数。在 `Update()` 函数的花括号之间，添加以下代码行：`transform.Rotate(Vector3.up);`。保存脚本，点击播放进行测试，你的立方体正在旋转——好极了！\n\
  \n让我们分解这行代码，以理解究竟发生了什么：\n\n`(1)      (2)    (3)   (4)`\n\n`transform.Rotate(Vector3.up);`\n\
  \n`Transform` 是每个游戏对象必备的组件；它包含位置、旋转和缩放信息。在这行代码中，你可以使用小写的 `transform`，编译器知道这指的是附加此脚本的游戏对象的变换组件。从一个附加到第二个游戏对象的脚本中影响第一个游戏对象的\
  \ `Transform` 组件会稍微复杂一些，将从第 6 章“访问其他游戏对象”开始介绍。\n\n`Rotate()` 是 `Transform` 类的一个函数。你可以使用\
  \ `#` 阅读脚本参考。它围绕其 `Vector3` 参数的轴应用旋转，单位是欧拉角。欧拉角是一个高级数学术语，指的是围绕游戏对象轴线的旋转度数。\n\n`Vector3`\
  \ 参数定义了旋转将要围绕的轴。`.up` 是向量 (0, 1, 0) 的 `Vector3` 静态变量快捷方式。\n\n仔细观察立方体的平移操纵杆，记住在 Unity\
  \ 的世界空间中，y 轴是“向上”的。再次播放，从视觉上确认立方体的旋转是围绕 y 轴发生的。查看检查器，你可以看到 `Transform` 组件的旋转属性的\
  \ y 值正在根据立方体的旋转变化而变化（图 5-2）。\n\n![A978-1-4302-6587-0_5_Fig2_HTML.jpg](img/A978-1-4302-6587-0_5_Fig2_HTML.jpg)\n\
  \n图 5-2. `Vector3.up` 平行于正 y 轴\n\n向量确实有方向，因此虽然 `Vector3.up` 和 `Vector3.down` 都平行于\
  \ y 轴，但它们指向相反的方向。将 `Vector3.up` 替换为 `Vector3.down`。保存、播放，注意现在立方体似乎正在向相反方向旋转。这是因为旋转现在是围绕向下指向的向量\
  \ (0, -1, 0) 计算的。\n\n你不仅限于使用 `Vector3` 快捷方式，实际上你可以传入任何值的 `Vector3` 变量。将 (`Vector3.down`)\
  \ 替换为 (x, y, z) 值 (2, -5, 4)，保存并播放。现在你会看到立方体以一个角度翻转，因为旋转是围绕这个随机向量计算的。由于应用于所有三个轴的旋转计算累加在一起，立方体看起来也翻转得更快了。\n\
  \n### 在游戏测试中编辑属性\n\n既然你可以让游戏对象围绕任何你喜欢的轴旋转，那么如果也能控制速度就好了。更好的是能够直接在 Unity 编辑器中测试和调整速度，而不是在脚本和编辑器之间来回切换。\n\
  \n回到 MonoDevelop，在 `#pragma strict` 下，声明公共浮点变量 `rotationSpeed` 并赋予其初始值 5：\n\n`public\
  \ var rotationSpeed:float = 5;`\n\n将 `Update()` 函数编辑为：\n\n`transform.Rotate(Vector3.up\
  \ * rotationSpeed);`\n\n你将默认的旋转计算乘以一个你控制的因子：变量 `rotationSpeed`。保存并返回 Unity 编辑器。在层级视图中选中立方体游戏对象，现在你会看到\
  \ `rotationSpeed` 作为 `MoveCube` 脚本组件的一个属性出现，初始值为 5（图 5-3）。\n\n![A978-1-4302-6587-0_5_Fig3_HTML.jpg](img/A978-1-4302-6587-0_5_Fig3_HTML.jpg)\n\
  \n图 5-3. `rotationSpeed` 公共变量作为“旋转速度”属性显示在检查器中\n\n你将 `Vector3` 参数改回 `Vector3.up`，只是为了让你在游戏测试时更容易直观地看到你对\
  \ `rotationSpeed` 属性所做的更改并进行调整。\n\n播放，看到立方体再次围绕 y 轴旋转。在保持播放模式的同时，更改 `rotationSpeed`\
  \ 的值（注意必须选中立方体）。尝试更快的值、更慢的值、零值，甚至负值。这是 Unity 的一个强大功能，你可以在微调游戏体验时立即看到更改的效果。退出播放模式，注意\
  \ `rotationSpeed` 值恢复为 5。请记住，在播放模式下所做的更改不会被保存。\n\n在第 4 章中，你学习了帧率和 `Time.deltaTime`。当你调整游戏对象移动时，请记住，基于不同的帧率，游戏对象在不同计算机上的移动方式会有所不同。解决方案是乘以\
  \ `Time.deltaTime` 来使运动与帧率无关。将 `Update()` 函数编辑如下：\n\n```javascript\nfunction Update\
  \ () {\n    transform.Rotate(Vector3.up * rotationSpeed * Time.deltaTime);\n}\n\
  ```\n\n\n\n### 添加用户交互\n\n保存并运行。立方体的速度因这个新增因素而改变，但你可以重新调整 `rotationSpeed` 属性，恢复到你喜欢的速度。现在不同之处在于，任何在不同机器上玩你游戏的人，都将获得与你在自己机器上创建的游戏相同的体验。\n\
  \n像你在第 4 章中做的那样，通过键盘添加一些用户交互，这次用于控制立方体的旋转。编辑 `Update()` 函数，添加一个条件判断来检查用户是否按下了左箭头键。\n\
  \n```\nfunction Update () {\n        if(Input.GetKey(KeyCode.LeftArrow)) {\n   \
  \             transform.Rotate(Vector3.up * rotationSpeed * Time.deltaTime);\n \
  \       }\n}\n```\n\n保存并运行。现在立方体仅在按下左箭头键时才旋转。类似地，你可以通过使用 `-rotationSpeed`，让用户用右箭头键使立方体向相反方向旋转。\n\
  \n```\nfunction Update () {\n        if(Input.GetKey(KeyCode.LeftArrow)) {\n   \
  \             transform.Rotate(Vector3.up * rotationSpeed * Time.deltaTime);\n \
  \       }\n        if(Input.GetKey(KeyCode.RightArrow)) {\n                transform.Rotate(Vector3.up\
  \ * -rotationSpeed * Time.deltaTime);\n        }\n}\n```\n\n保存并运行。\n\n## 移动（Translate）\n\
  \n`Translate()` 是 `Transform` 的另一个函数，用于移动 `GameObject`。和 `Rotate()` 一样，它也接受一个 `Vector3`\
  \ 参数，但在这个情况下，`Vector3` 描述了 `GameObject` 将要移动的方向和距离。添加一个公共变量，用作乘法因子，以便在编辑器中调整立方体的速度。在\
  \ `rotationSpeed` 变量声明下方，添加一个 `travelSpeed` 变量。\n\n```\npublic var travelSpeed:float\
  \ = 5;\n```\n\n通过向 `Update()` 函数添加以下代码行，让玩家使用上箭头和下箭头键上下移动立方体。\n\n```\nif(Input.GetKey(KeyCode.UpArrow))\
  \ {\n    transform.Translate(Vector3.up * Time.deltaTime * travelSpeed);\n}\nif(Input.GetKey(KeyCode.DownArrow))\
  \ {\n    transform.Translate(Vector3.down * Time.deltaTime * travelSpeed);\n}\n\
  ```\n\n保存并运行。这次，对于向下方向，你使用了 `Vector3.down` 而不是 `-travelSpeed`。两种方法都可行，就像 `-Vector3.up`\
  \ 也等同于 `Vector3.down` 一样。获得相同结果的方法往往不止一种；这很大程度上取决于个人偏好。如果有选择，请选择最高效的代码，如果其他条件相同，则可读性越强越好。\n\
  \n### `Transform.position`\n\n`Translate()` 是一个移动变换（Transform）的函数，而 `position` 则是一个保存变换位置（x,\
  \ y, z）值的变量。你也可以通过直接分配一个新位置来将 `GameObject` 移动到特定位置。在这个例子中，我们将使用 O 键将 `GameObject`\
  \ 送回原点（0, 0, 0）。\n\n首先，在公共变量声明下方添加一个新的私有变量声明。\n\n```\nprivate var originPosition\
  \ : Vector3 = new Vector3(0, 0, 0);\n```\n\n在 `Update()` 函数中，添加以下代码：\n\n```\nif(Input.GetKey(KeyCode.O))\
  \ {\n    transform.position = originPosition;\n}\n```\n\n保存并运行。使用箭头键移动立方体，然后按下 O\
  \ 键将其返回到游戏视图中心。注意，这会重置立方体的位置，但对其旋转没有影响。\n\n虽然这种移动是瞬间完成的，但显得相当突兀。如果你希望立方体更缓慢、更平滑地返回原点，Unity\
  \ 正好有一个专为此目的而设计的出色函数，称为 `Lerp()`。\n\n## 使用 Lerp 实现平滑移动\n\nUnity 的 `Lerp()` 函数可以平滑立方体返回原点的过渡。Lerp\
  \ 代表线性插值（Linear Interpolation），这是一种在两个值之间逼近平滑线或曲线的数学方法。在这种情况下，我们使用 `Lerp()` 来平滑地将立方体从玩家移动到的位置移回原点。如果你花点时间在脚本参考中搜索“Lerp”，你会发现\
  \ `Lerp()` 可用于在两个表示几乎任何内容的值之间进行过渡，包括颜色、材质和四元数（图 5-4）。\n\n![A978-1-4302-6587-0_5_Fig4_HTML.jpg](img/A978-1-4302-6587-0_5_Fig4_HTML.jpg)\n\
  \n图 5-4. Unity 中使用 `Lerp()` 的静态函数\n\n具体来说，你将使用 `Vector3.Lerp`。在脚本参考中选择它，快速阅读一下。\n\
  \n`Vector3.Lerp` 有三个参数：起始 Vector3、目标 Vector3，以及一个用于实际线性插值计算的浮点值。\n\n首先，在其他变量声明之后声明一个公共浮点变量\
  \ `smoothing`，用于从检视面板调整立方体的移动速度：\n\n```\npublic var smoothing : float;\n```\n\n\
  将 `Update()` 函数中用于将立方体返回原点的代码修改如下：\n\n```\n//将立方体移回原点\nif(Input.GetKey(KeyCode.O))\
  \ {\n                transform.position = Vector3.Lerp(transform.position, originPosition,\
  \ smoothing * Time.deltaTime);\n        }\n```\n\n分解关键代码行，我们可以看到以下内容：\n\n`(1) (2)\
  \ (3) (4) (5)`\n`transform.position = Vector3.Lerp(transform.position, originPosition,\
  \ smoothing *`\n`(6)`\n`Time.deltaTime);`\n\n设置游戏对象的变换位置，通过 `Vector3.Lerp()` 函数进行平滑处理，从游戏对象的当前位置移动到原点，并使用一个可用于定制的平滑乘数，该乘数基于实时时间而非变化的帧率。\n\
  \n保存并返回 Unity 编辑器。在层级面板中选中立方体游戏对象，在检视面板中将平滑属性（Smoothing）更改为 3。进入播放模式。现在，当你按住 O 键时，立方体会平滑移动，并且越接近原点，其移动速度会逐渐变慢，最终滑行停止。\n\
  \n现在，你已经通过多种不同的方式为你的原始游戏对象实现了各种移动动画。你玩过一些游戏，它们有效地利用像这样的简单运动来创造有趣、互动的体验，但这只是 Unity\
  \ 能力的冰山一角。本章的其余部分将向你介绍 Mecanim（Unity 的动画系统），以及可以在资源商店中找到的精彩多样的角色和动画包。\n\n\n\n"
- '# Mecanim 动画系统


  `Mecanim` 是 Unity 的动画系统。该系统已集成到 Unity 编辑器中，旨在为游戏开发者提供可视化、直观的工具。虽然角色及其基础动画片段是在导入
  Unity 之前创建的，但 `Mecanim` 系统用于管理和混合这些动画，从而带来更流畅、更出色的游戏体验。


  最棒的是，通过使用虚拟角色（Avatar），`Mecanim` 允许您将一个角色模型的动画重定向到另一个角色上，而无需为第二个角色创建全新的动画序列。这听起来很简单，但这恰恰是
  Unity 团队将复杂功能变得易于使用的又一例证，同时还能为您节省大量的工作时间。


  毕竟，这是一本关于学习 Unity 并专注于脚本编程的书，而脚本编程最终是将动画角色与游戏代码整合以实现游戏运行的必要环节。不过，您需要高效地投入精力——请记住，这里的目标是完成一款出色的游戏并发布它。


  开发工具不断升级，变得更加直观、可视化，更重要的是，通过省去为常用和重复功能编写原始代码的负担，变得更加高效。`Mecanim` 提供了一个可视化编程工具，您可以在编写游戏脚本代码之前，用它来处理复杂的动画交互。


  3D 角色模型的创建和动画制作是在将其集成到 Unity 游戏项目之前完成的。虽然角色创建远远超出了本书的范围，但您将学习如何将一个现成的角色与现成的动画片段结合，为在游戏中使用它做好准备的基础知识。


  本节将向您介绍如何使用 `Mecanim` 设置角色及其动画，并配合脚本编程来处理用户输入，从而控制角色。为了真正理解 `Mecanim` 的精妙之处，您将选择一个角色，配置其虚拟角色和动画，然后利用
  Asset Store 中的免费资源，快速将该动画应用到第二个角色上。这种角色与动画的混搭能力，为您在控制学习成本的同时，为游戏原型提供了庞大的选项库。


  ## 我是医生，不是……！


  在深入之前，我想就游戏开发行业的工作提出几点总体观察。艺术家与开发者之间常有一种友好的竞争关系，通常被定义为创意型与逻辑型之争。我想鼓励您——一位初出茅庐的游戏开发者——不要将自己局限在任何一个类别中。


  虽然艺术家确实富有创造力，但真正技艺精湛的艺术家必须对其选择的媒介有深入的理解，这本质上是技术性的，就像学习和使用任何工具或运动技能来操作艺术媒介，将创意概念从想法变为现实一样。


  开发者使用各种基于纯数学函数和逻辑的编程语言。没有比这更具技术性的了。另一方面，在计算机代码的严格限制下提出解决方案，将应用或游戏概念变为现实，则需要巨大的创造力。


  一款伟大的游戏是艺术与代码的完美结合，为玩家带来卓越的体验。请始终保持开放的心态，包括抓住机会去了解更多关于其他团队成员所做的工作。您越能理解这一切是如何协同工作的，就越能与您的
  3D 艺术家合作者沟通顺畅，最终您的成品质量也会越高。


  ## 建模、骨骼绑定和蒙皮


  计算机生成动画本身就是一个完整的行业，其中有专门从事建模、骨骼绑定、动画等工作的个人。创建一个新的角色并为其制作动画，需要所有这些环节。Maya、3ds Max
  和 Blender 用于从头创建角色，此外还有其他角色生成工具。这超出了本书的范围，但您需要了解一些相关术语。


  建模是创建游戏对象三维形状的过程，这个形状由许多通常被称为多边形（polygons）的三角形组成（图 5-5）。请记住，更复杂的模型需要更多的计算能力。


  ![A978-1-4302-6587-0_5_Fig5_HTML.jpg](img/A978-1-4302-6587-0_5_Fig5_HTML.jpg)


  图 5-5. 外星角色模型线框


  Asset Store 中对模型最常用的描述之一就是模型中使用的“polys”或“tris”（多边形数量）。支持 Unity 的增强现实 SDK Metaio
  说得最好：“在设计 3D 模型时，请记住要使用尽可能少的多边形，但要满足需要。” 为您的游戏选择现成模型也是如此。


  虽然您会学到诸如此类的优化游戏最佳实践，但您还需要查阅目标平台的文档以了解更具体的限制。例如，Metaio 为了将其建议付诸实践，还提供了一个关于多平台（和多设备）上性能与多边形数量的优秀摘要供开发者参考（图
  5-6）。


  ![A978-1-4302-6587-0_5_Fig6_HTML.jpg](img/A978-1-4302-6587-0_5_Fig6_HTML.jpg)


  图 5-6. Metaio 增强现实 SDK 的性能与多边形数量对比


  如果您与创建自定义角色的艺术家合作，告知他们是否存在特定的多边形数量限制会很有帮助。


  骨骼用于控制角色的运动。它们构成一个骨架或关节层级结构，定义了骨骼之间如何相互移动，这与父子游戏对象非常相似。骨骼绑定（Rigging）就是创建这个关节层级结构的过程（图
  5-7）。


  ![A978-1-4302-6587-0_5_Fig7_HTML.jpg](img/A978-1-4302-6587-0_5_Fig7_HTML.jpg)


  图 5-7. 以亮绿色显示的骨骼


  一旦创建了关节层级结构，就必须将其连接到角色网格上，以便网格能够响应关节的动画而移动。将网格连接到关节层级结构的骨骼上称为蒙皮（Skinning）（图 5-8）。


  ![A978-1-4302-6587-0_5_Fig8_HTML.jpg](img/A978-1-4302-6587-0_5_Fig8_HTML.jpg)


  图 5-8. Unity 用户手册中的交互式蒙皮绑定示意图


  如果您打算自己制作角色模型，可以在 Unity 用户手册中找到有用的指南。




  '
- '# 资源商店


  对于独立游戏开发者来说，幸运的是存在 Unity 资源商店。资源商店是模型、脚本、纹理、音频、完整项目等资源的宝库。别被它的名字骗了——上面有许多免费资源可供使用，非常适合学习和制作原型，更不用说这是一个了解各位艺术家和工作室能提供什么的好方法。


  Unity 资源商店的运作方式很像应用商店，其中的资源可能来自独立艺术家或开发者、工作室，甚至 Unity Technologies 本身。你可以找到从简单的零散部件到完整的已完成项目。Unity
  编辑器旨在与资源商店轻松集成。要访问资源商店，请在编辑器顶部菜单中，选择 `Window` ➤ `Asset Store`（图 5-9）。


  ![A978-1-4302-6587-0_5_Fig9_HTML.jpg](img/A978-1-4302-6587-0_5_Fig9_HTML.jpg)


  图 5-9。通过编辑器菜单访问 Unity 资源商店


  资源商店主页会在一个单独的窗口中打开（图 5-10）。左侧前两行展示特色资源，右侧是商店分类菜单。分类菜单下方是“24 小时特惠”，每天都会有一款不同的资源以大幅折扣特价出售。


  ![A978-1-4302-6587-0_5_Fig10_HTML.jpg](img/A978-1-4302-6587-0_5_Fig10_HTML.jpg)


  图 5-10。Unity 资源商店主页


  在分类中，选择 `3D Models` ➤ `Characters` ➤ `Humanoids`。左上方是该子分类下的特色资源，下方是所有可用的 3D 人形模型的完整列表。列表顶部是排序选项；选择
  `PRICE`（价格）。这将按价格从低到高对资源进行排序，将免费资源置于列表顶部（图 5-11）。


  ![A978-1-4302-6587-0_5_Fig11_HTML.jpg](img/A978-1-4302-6587-0_5_Fig11_HTML.jpg)


  图 5-11。Unity 资源商店中可用的 3D 人形模型，按价格排序


  点击其中任何一个，都将进入产品页面，该页面包含简要描述、一张图片、一个可选的展示角色更多图片的区域，以及最后可下载包的详细内容。出于比较目的，请查看 Alien
  and Cocoon 和 Animated Spartan King（图 5-12）。


  ![A978-1-4302-6587-0_5_Fig12_HTML.jpg](img/A978-1-4302-6587-0_5_Fig12_HTML.jpg)


  图 5-12。在 Unity 资源商店中比较 3D 模型


  这些简要描述由发布者提供，内容可能有所不同。通常会提到多边形数量，因为这会影响性能，或可能限制支持你游戏的设备。Mecanim 相对较新，是 Unity 旧版动画系统的重大升级，因此你可能会看到类似针对
  Alien 的评论，指定它实际上与 Mecanim 兼容。


  动画可能单独提供，或者是长动画的一部分，此时你需要知道单个剪辑中各个动画的位置。在 Spartan King 的描述中，发布者给出了每个动画剪辑的特定帧范围。


  最棒的是，这两个发布者都提供了在下载前实际查看动画的方式。Alien and Cocoon 的链接会带你到一个 Unity Web 播放器，你可以作为玩家与之互动，在几个简单的关卡中移动外星人；而
