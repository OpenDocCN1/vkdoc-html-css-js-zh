  在早期，游戏完全由代码创建。Unity 之所以能够更快地创建出精美的游戏，很大程度上在于其使用了诸如场景视图之类的直观工具，你可以在其中从环境搭建到游戏对象定位，可视化地构建游戏（图
  1-32）。


  你可以通过多种方式浏览场景视图。选择手形工具（`Q`）并用鼠标点击并拖动。按住 `Alt` 键并点击拖动鼠标，可以围绕兴趣点旋转视图；按住 `Ctrl` 键并点击拖动鼠标，则可以缩放视图。在“第一人称飞行”模式下，按住鼠标右键并使用
  `A`、`S`、`D`、`W`、`Q` 和 `E` 键进行导航，可以体验到一些乐趣。


  通过点击选中 AngryBots 中的 `Player` 游戏对象。使用手形工具右侧的相应按钮，可以显示“平移”（`W`）、“缩放”（`E`）和“旋转”（`R`）辅助工具。请注意，每个工具中的
  `x`、`y`、`z` 轴分别用红色、绿色和蓝色进行颜色编码。你可以通过点击拖动辅助工具来用鼠标操纵游戏对象的位置，或者在检视面板中输入精确数值来调整。场景相机的视角也可以通过场景辅助工具以相同方式进行调整（图
  1-33）。


