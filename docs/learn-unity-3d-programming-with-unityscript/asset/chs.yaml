  ## 开始使用 AngryBots


  如果你不喜欢游戏，你可能不会对游戏开发感兴趣，因此你能猜到最棒的部分——玩游戏！认识一下 AngryBots，这是 Unity 自带的演示项目。在 Unity
  编辑器的顶部中央，你会看到播放按钮（图 1-19）。


  ![A978-1-4302-6587-0_1_Fig19_HTML.jpg](img/A978-1-4302-6587-0_1_Fig19_HTML.jpg)


  图 1-19. Unity 编辑器播放模式控件


  点击播放按钮启动 AngryBots 游戏。使用方向键或 `ASDW` 键移动，用鼠标左键射击，并用鼠标环顾四周。尽管去享受一下乐趣，然后再次点击播放按钮退出游戏。暂停按钮在播放按钮的右侧，其右侧的按钮用于测试时逐步推进游戏。


  AngryBots 也很适合用来演示组成 Unity 编辑器界面的各个视图。界面是你与 Unity 编辑器交互的窗口。它由多个视图组成，这些视图可以通过工具栏右上角的
  `Layout`（布局）下拉菜单进行配置。你还可以通过拖动标签来调整各个视图的大小并重新排列它们以自定义布局，或者将某个视图拖出编辑器窗口区域，使其成为独立窗口。你可以随时通过选择
  `Layout` 下拉菜单中的 `Revert Factory Settings`（恢复出厂设置）来恢复基本布局。当你的游戏变得复杂时，`Layers`（图层）下拉菜单对于隐藏和显示不同内容非常有用（图
  1-20）。


  ![A978-1-4302-6587-0_1_Fig20_HTML.jpg](img/A978-1-4302-6587-0_1_Fig20_HTML.jpg)


  图 1-20. 图层和布局下拉菜单控件


  在左上角，你会看到四个工具的按钮：平移、移动、旋转和缩放（图 1-21）。这些工具也可以通过 Unity 热键速查表的工具表格中列出的 `Q`、`W`、`E`
  和 `R` 键来选择。


  ![A978-1-4302-6587-0_1_Fig21_HTML.jpg](img/A978-1-4302-6587-0_1_Fig21_HTML.jpg)


  图 1-21. 平移、移动、旋转和缩放工具选择器


  紧邻这些工具右侧的是几个切换开关，它们也有对应的热键，你可以在之前下载的热键列表中找到：`Z` 用于切换轴心模式（在局部空间和世界空间之间切换），`X` 用于切换轴心旋转（在中心旋转或轴心点旋转之间切换）（图
