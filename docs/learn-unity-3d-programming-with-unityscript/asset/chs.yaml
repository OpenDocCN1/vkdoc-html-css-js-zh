- "# 强力着陆\n\n虽然 DustPuff 粒子系统在视觉上强调了玩家角色着陆的力度，但附近的物体也可以受到一种力的扩散影响。在项目面板的 `Assets ➤\
  \ Scripts` 文件夹中，选择 `Create ➤ JavaScript` 并将其命名为 `ImpactForce`。将其附加到 `GrandEntrance`\
  \ 游戏对象上，然后在 MonoDevelop 中打开它。将代码编辑为以下内容：\n\n```\n#pragma strict\n\nfunction Start\
  \ () {\n    Invoke (\"ImpactForce\", 0.75);\n}\n\nfunction ImpactForce () {\n  \
  \  var colliders : Collider[] = Physics.OverlapSphere(transform.position - Vector3(0,\
  \ 4, 0), 10);\n    for(var cldr : Collider in colliders)\n    {\n        if(cldr.rigidbody\
  \ == null) continue;\n        cldr.rigidbody.AddExplosionForce(10, transform.position\
  \ - Vector3(0, 4, 0), 10, 0, ForceMode.Impulse);\n    }\n}\n```\n\n保存脚本。这段代码的分解说明如下：\n\
  \n`(1) Invoke (\"ImpactForce\", 0.75);`\n\n`Invoke` 函数允许你在函数执行之前，通过一个时间延迟来调用函数。它接受两个参数：要调用的函数，以及以秒为单位的时间延迟。在此示例中，力的作用时间应与玩家角色落地以及\
  \ DustPuff 粒子系统开始发射的时间一致，根据其起始延迟可知，这个时间是 0.75 秒。\n\n`(2) (3) var colliders : Collider[]\
  \ = (4) (5) (6) Physics.OverlapSphere(transform.position - Vector3(0, 4, 0), 10);`\n\
  \n在 `ImpactForce()` 函数内部，声明一个用于存储 `Collider` 类型数组的引用变量 `colliders`。将 `Physics.OverlapSphere`\
  \ 边界内找到的所有碰撞器赋值给它，该球体的位置是它所附加到的 `GrandEntrance` 游戏对象的位置减去其 y 坐标值 4，以便将其定位在地面 DustPuff\
  \ 粒子系统发射的中心位置，半径为 10。\n\n`(7) for(var cldr : Collider in colliders)`\n\n这个 `for`\
  \ 循环会遍历碰撞器数组。\n\n`(8) if(cldr.rigidbody == null) continue;`\n\n检查碰撞器上是否附加了刚体。记住，使用物理力时必须要有刚体。如果没有刚体，`continue`\
  \ 意味着不执行接下来的代码块，而是继续处理 `for` 循环中的下一个项目。\n\n`. (9) (10) (11) cldr.rigidbody.AddExplosionForce(10,\
  \ transform.position - Vector3(0, (12)(13) (14) 4, 0), 10, 0, ForceMode.Impulse);`\n\
  \n如果附加了刚体，则应用 `AddExplosionForce`，力的大小为 10，力的来源位置与 DustPuff 粒子系统发射位置相同，爆炸半径为 10，不添加额外的向上力（当你想要一点额外的向上“弹起”效果时可以使用此参数），并使用\
  \ `ForceMode.Impulse` 模式，该模式会瞬间施加全部力，而不是在一段时间内施加。这个力会随着距指定位置的距离增加而减小，并在指定的半径处降为零。\n\
  \n如果你现在进行游戏测试，什么也不会发生，因为 `Physics.OverlapSphere` 的半径内没有游戏对象。为了看到效果，请在项目面板中依次展开 `Assets\
  \ ➤ Sample Assets ➤ Prototyping ➤ Prefabs ➤ Compound Prefabs` 文件夹。将一个 `Smash Boxes`\
  \ 预制体拖拽到场景视图中，然后将其 `Transform.position` 设置为 (–5, 0, –5)，`Transform.rotation` 设置为\
  \ (0, 90, 0)。\n\n在层级面板中使用 Ģ+D 复制此游戏对象，然后将此副本的 `Transform.position` 设置为 (8, 0, –5)。创建第三个副本，将其\
  \ `Transform.position` 设置为 (0, 0, –11)，`Transform.rotation` 设置为 (0, 0, 0)。保存场景，保存项目，然后进行游戏测试。\n\
  \n轰！注意第一堆 Smash Boxes 被完全炸飞，而第二堆中最远的盒子组件几乎没被碰到，第三堆 Smash Boxes 则完全没有被触碰到。这是由于它们相对于\
  \ `ImpactForce` 脚本中指定的 10 爆炸半径的位置所决定的。\n\n就游戏设计和风格而言，这对于我们的玩家来说是一个相当夸张的登场方式，但它作为构建粒子效果的一个很好的练习。\n\
  \n"
- "# 炸弹障碍物\n\n戏剧性的火焰爆炸效果创建方式大致相同，只是使用了火和烟雾粒子系统，并添加了光和声音等额外的特殊效果。Sample Assets 包中有一个极好的爆炸示例，包含了完整的火焰和烟雾材质与纹理。\n\
  \nSample Assets 包中的 `Ball` 预制体看起来阴暗且不祥，因此它可以成为一个很棒的炸弹。将其从 `Assets ➤ Sample Assets\
  \ ➤ Vehicles ➤ Rolling Ball ➤ Prefabs` 文件夹拖拽到场景中，命名为 `Bomb`，将 `Tag` 设置为 `Untagged`，并为其设置\
  \ `Transform.position` 为 (0, 9.5, 20)。点击齿轮图标并从下拉菜单中选择“移除组件”，移除 `Ball` 和 `Ball User\
  \ Control Script` 组件。\n\n在项目面板的 `Assets ➤ Scripts` 文件夹中，创建一个名为 `BombExplosion` 的新脚本，并在\
  \ MonoDevelop 中打开它。将代码编辑为以下内容：\n\n```\n#pragma strict\n\npublic var victim : GameObject;\n\
  public var prefab : GameObject;\n\nfunction Start () {\n    victim = GameObject.Find(\"\
  Third Person Character Ragdoll\");\n}\n\nfunction OnCollisionEnter (collision :\
  \ Collision) {\n    if (collision.gameObject.name == \"Third Person Character Ragdoll\"\
  ) {\n        Explosion();\n    }\n}\n\nfunction Explosion () {\n    victim.GetComponent(GoRagdoll).GotoRagdoll();\n\
  \    Instantiate (prefab, transform.position, Quaternion.identity);\n    Destroy(gameObject);\n\
  }\n```\n\n保存脚本并将其附加到 `Bomb` 游戏对象上。分解说明如下：\n\n`(1) public var victim : GameObject;\
  \ public var prefab : GameObject;`\n\n声明两个引用变量，`victim` 和 `prefab`，类型为 `GameObject`。\n\
  \n`(2) victim = GameObject.Find(\"Third Person Character Ragdoll\");`\n\n在 `Start()`\
  \ 函数中，将 `Third Person Character Ragdoll` 的引用赋值给 `victim`。\n\n`(3) if (collision.gameObject.name\
  \ == \"Third Person Character Ragdoll\") { Explosion(); }`\n\n如果玩家角色与炸弹发生碰撞，则调用\
  \ `Explosion()` 函数。\n\n`(4) victim.GetComponent(GoRagdoll).GotoRagdoll();`\n`(5)\
  \ Instantiate (prefab, transform.position, Quaternion.identity);`\n`(6) Destroy(gameObject);`\n\
  \n在 `Explosion()` 函数内部，将玩家角色转换为 ragdoll（布娃娃系统），在炸弹的 `transform.position` 和旋转位置实例化一个新的爆炸预制体，然后销毁炸弹游戏对象。\n\
  \n如果你现在进行游戏测试，玩家角色会倒下，炸弹会根据与玩家角色的碰撞而滚动，但没有爆炸效果，因为尚未将预制体指定为要在 `Explosion` 函数中实例化的对象。在控制台中，你会看到一个\
  \ `UnassignedReferenceException` 警告，提示 `prefab` 变量尚未分配，并建议你进行分配。\n\n选中 `Bomb` 游戏对象，在检查器中找到\
  \ `BombExplosion` 脚本组件，注意 `Prefab` 属性的字段是 `None`。在项目面板的 `Assets ➤ Sample Assets\
  \ ➤ Effects ➤ Particle Systems ➤ Prefabs` 文件夹中找到 `Explosion` 预制体。将其拖拽并放入检查器的 `Prefab`\
  \ 属性字段中。\n\n保存场景和项目。进行游戏测试，让玩家角色撞向炸弹。太棒了！稍后你会用到更多炸弹，所以请将 `Bomb` 游戏对象从层级面板拖拽到项目面板的\
  \ `Assets ➤ Prefabs` 文件夹中。\n\n\n\n## 暴风雪障碍\n\n这个简单的障碍物用于演示粒子碰撞的使用方法。在编辑器顶部菜单中，选择“游戏对象\
  \ ➤ 创建其他 ➤ 粒子系统”，并将其命名为 Blizzard。将其 `Transform.position` 设置为 (–11, 11.5, 106)，`Transform.rotation`\
  \ 设置为 (0, 90, 0)。\n\n![A978-1-4302-6587-0_8_Fig10_HTML.jpg](img/A978-1-4302-6587-0_8_Fig10_HTML.jpg)\n\
  \n图 8-10. 暴风雪粒子系统设置\n\n在暴风雪粒子系统的初始模块中，使用“起始大小”下拉菜单选择“两个常量之间随机”。保留默认设置 0 和 1。在“发射”模块中，确保“速率”设置为\
  \ 10。\n\n其思路是让玩家需要应对更大体积的粒子。在“形状”模块中选择“盒子”，并将其比例中的盒子 X 和盒子 Y 都改为 5。\n\n勾选“碰撞”模块并展开它。“世界”意味着粒子将与任何物体发生碰撞。请注意，此设置对游戏性能的消耗比使用平面更高。保留所有其他默认设置不变，但**勾选**“发送碰撞消息”复选框（图\
  \ 8-10）。\n\n在项目面板的“资源 ➤ 脚本”文件夹中，找到 `KillOnCollision` 脚本并在 MonoDevelop 中打开。添加以下函数：\n\
  \n```\nfunction OnParticleCollision(other : GameObject)\n{\n    if (other.gameObject.name\
  \ == \"第三人称角色布娃娃\")\n    {\n        other.gameObject.GetComponent(GoRagdoll).GotoRagdoll();\n\
  \    }\n}\n```\n\n当粒子系统碰撞模块中的“发送碰撞消息”复选框被勾选时，会调用 `OnParticleCollision()` 函数。函数内的代码块会检查碰撞中的另一个游戏对象是否是玩家角色，如果是，则调用玩家角色的\
  \ `GotoRagdoll` 函数。\n\n![A978-1-4302-6587-0_8_Fig11_HTML.jpg](img/A978-1-4302-6587-0_8_Fig11_HTML.jpg)\n\
  \n图 8-11. 玩家角色面对暴风雪障碍\n\n保存脚本并将其附加到 Blizzard 游戏对象上。与炸弹类似，将暴风雪粒子系统拖放到项目面板的“资源 ➤ 预置”文件夹中。保存场景（图\
  \ 8-11）并保存项目。进行游戏测试，躲避致命的雪花吧！\n\n## 激光障碍\n\n对于激光障碍，你将学习使用线条渲染器（图 8-12）。线条渲染器的作用就是在两点之间绘制一条线。它也可以使用点数组，在每两个点之间绘制线段，从而形成更复杂的图案。\n\
  \n线条本身是一个二维公告板，就像粒子纹理一样，因此根据你的场景，它在旋转以始终面向相机时，可能会显得有些动态效果。你可以调整其宽度和颜色，甚至可以使用纹理。\n\
  \n这个障碍由一个位于障碍赛道上方的激光发射器组成，它向下朝高架轨道表面发射激光，并来回移动。\n\n![A978-1-4302-6587-0_8_Fig12_HTML.jpg](img/A978-1-4302-6587-0_8_Fig12_HTML.jpg)\n\
  \n图 8-12. 玩家角色与激光障碍\n\n## 激光发射器\n\n为了模拟激光发射器，在层级面板中创建一个基本的立方体游戏对象，将其命名为 `LaserCube`，并设置其\
  \ `Transform.position` 为 (–3.8, 12, 100)，`Transform.scale` 为 (0.2, 1, 0.2)。\n\n\
  `LaserCube` 游戏对象需要一个简单的脚本为其添加移动功能。在项目面板的“资源 ➤ 脚本”文件夹中，选择“创建 ➤ JavaScript”，将其命名为\
  \ `MoveLaser`，并在 MonoDevelop 中打开。将代码编辑为以下内容：\n\n```\n#pragma strict\n\npublic var\
  \ speed : float = 1;\npublic var offset : float;\n\nfunction Start () {\n    offset\
  \ = transform.position.x - 0.2;\n}\n\nfunction Update () {\n    transform.position\
  \ = Vector3(Mathf.PingPong(Time.time * speed, 8) + offset, transform.position.y,\
  \ transform.position.z);\n}\n```\n\n保存脚本并将其附加到 `LaserCube` 上。\n\n这段代码分解如下：\n\n`(1)`\
  \ `public var speed : float = 1;`\n`public var offset : float;`\n\n首先，声明变量：一个公共浮点型变量，允许你在检视面板中调整\
  \ `LaserCube` 的速度；以及一个偏移量变量，用于在 `LaserCube` 移动时正确定位它。\n\n`(2)` `offset = transform.position.x\
  \ - 0.2;`\n\n在 `Start()` 函数中，将 `LaserCube` 游戏对象的位置减去其宽度，赋值给偏移量，这样激光束就能从高架轨道的精确边缘开始移动。\n\
  \n`(3)` `transform.position = Vector3(Mathf.PingPong(Time.time * speed, 8) + offset,\
  \ transform.position.y, transform.position.z);`\n\n你之前已经修改过游戏对象的 `Transform.position`。本示例引入了使用\
  \ `Mathf.PingPong()` 函数来设置 Vector3 的 x 坐标值，从而实现来回移动。\n\n`Mathf.PingPong` 接受两个浮点数，并返回一个在\
  \ 0 和第二个值之间来回移动的值，该值会通过偏移量进行调整，并将结果赋值给 `LaserCube` 的 `Transform.position.x` 的 x\
  \ 坐标。不深入探讨其背后的数学原理，第一个浮点数必须每帧都变化才能产生乒乓移动效果，因此通常使用 `Time.time`。`Time.time` 就是自游戏开始以来的时间（以秒为单位）。\n\
  \n\n\n"
- "# 激光束\n\n激光束是通过线条渲染器（Line Renderer）创建的。线条渲染器不能与已使用渲染器的游戏对象一同使用，因此最佳实践是创建一个空的游戏对象来承载线条渲染器，然后将其作为子游戏对象附加到\
  \ LaserCube 上。\n\n在编辑器顶部菜单中，选择 **Game Object** ➤ **Create Empty**。在层级面板（Hierarchy）中，将其命名为\
  \ LaserBeam，然后拖拽到 LaserCube 游戏对象上，使其作为子游戏对象嵌套其中，并将其 `Transform.position` 设置为 (0,\
  \ –0.5, 0)。由于它是子对象，这个 `Transform.position` 会使其在 y 轴上略微低于父级 LaserCube 游戏对象。继续选中这个空的游戏对象，在检查器（Inspector）中选择\
  \ **Add Component** ➤ **Effects** ➤ **Line Renderer**（图 8-13）。你会注意到场景视图（Scene view）的世界原点处出现了一条品红色线条。你将在游戏过程中通过脚本来协调渲染的线条与移动的激光发射器。\n\
  \n![A978-1-4302-6587-0_8_Fig13_HTML.jpg](img/A978-1-4302-6587-0_8_Fig13_HTML.jpg)\n\
  \n图 8-13.\n\n检查器中的线条渲染器组件\n\n在检查器中，取消勾选 **Cast Shadows** 和 **Receive Shadows**。Unity\
  \ 基础版本不使用阴影，因此保留勾选也不会增加阴影效果。\n\n**Materials** 表示用于绘制线条的材质。如果为 None，则默认使用你在场景视图中看到的品红色线条。若要改变激光束的颜色，你必须指定一种材质。在项目面板（Project）中选择\
  \ **Create** ➤ **Material**，将其命名为 SimpleLaser。将 SimpleLaser 材质拖拽到检查器中的 **Element\
  \ 0** 属性中。选中该材质后，在检查器中使用着色器（Shader）下拉菜单选择 **Particles** ➤ **Alpha Blended**。线条渲染器使用粒子材质；否则你只会得到一条黑色线条。\n\
  \n重新选中 LaserBeam 游戏对象，以在检查器中再次显示其属性。**Light Probes** 是另一个 Unity Pro 功能。**Positions**\
  \ 指定了线条的绘制端点。一条线条至少需要两个点（起点和终点），但你可以通过增加 **Size** 属性的值来添加更多点。\n\n展开 **Parameters**\
  \ 以获取更多自定义选项。将 **Start Width** 和 **End Width** 的值改为 0.05 以使线条更细，将 **Start Color**\
  \ 和 **End Color** 改为亮红色，并勾选 **Use World Space**。\n\n接下来，你需要一个脚本来控制激光的行为。在项目面板的 Assets\
  \ ➤ Scripts 文件夹中，选择 **Create** ➤ **JavaScript**，将其命名为 Laser，并在 MonoDevelop 中打开。将代码编辑为如下内容：\n\
  \n```\n#pragma strict\n\npublic var line : LineRenderer;\n\nfunction Start () {\n\
  \nline = gameObject.GetComponent.<LineRenderer>();\n\n}\n\nfunction Update () {\n\
  \nShowLaser();\n\n}\n\nfunction ShowLaser () {\n\nvar ray : Ray = Ray(transform.position,\
  \ -transform.up);\n\nline.SetPosition(0, ray.origin);\n\nline.SetPosition(1, ray.GetPoint(50));\n\
  \n}\n```\n\n保存脚本，将其附加到子级空游戏对象上，并进行游戏测试。你会看到 LaserCube 左右移动，并发射出一道红色激光。\n\n此代码分解如下：\n\
  \n```\n(1)     public var line : LineRenderer;\n```\n\n声明了一个 `LineRenderer` 类型的引用变量\
  \ `line`。\n\n```\n(2)     line = gameObject.GetComponent.<LineRenderer>();\n```\n\
  \n获取对线条渲染器组件的引用，并将其赋值给 `line` 变量。\n\n```\n(3)     ShowLaser();\n```\n\n在之前的示例中，代码主要写在\
  \ `Update()` 函数内。在本例中，采用了更好的代码编写实践，将代码分解为更小的模块。这里调用了 `ShowLaser()` 函数，该函数仅包含绘制激光的代码。\n\
  \n```\n(4)     var ray : Ray = Ray(transform.position, -transform.up);\n```\n\n\
  在 `ShowLaser` 函数中，创建了一个引用变量 `Ray`，并将游戏对象的 `transform.position` 作为其原点，`-transform.up`\
  \ 作为向下的方向。\n\n```\n(5)     line.SetPosition(0, ray.origin);\n```\n\n\n\n线渲染器的第一个点（元素\
  \ 0）设置为射线起点的位置。\n\n`line.SetPosition(1, ray.GetPoint(50));`\n\n待绘制线的第二个点（元素 1）设置为沿射线方向再延伸\
  \ 10 个单位的位置。\n\n这算是个好的开端，但激光会直接穿过高架轨道，因此不够真实。按如下方式编辑 Laser 脚本的 `ShowLaser()` 函数：\n\
  \n```\nfunction ShowLaser () {\n    var ray : Ray = Ray(transform.position, -transform.up);\n\
  \    var hit : RaycastHit;\n    line.SetPosition(0, ray.origin);\n    if(Physics.Raycast(ray,\
  \ hit, 50))\n    {\n        line.SetPosition(1, hit.point);\n    }  else {\n   \
  \     line.SetPosition(1, ray.GetPoint(50));\n    }\n}\n```\n\n保存脚本。现在进行试玩测试时，你会看到激光在轨道表面处停止。\n\
  \n这段代码解析如下：\n\n`var hit : RaycastHit;`\n\n声明一个类型为 `RaycastHit` 的引用变量 `hit`。\n\n\
  `if(Physics.Raycast(ray, hit, 50))`\n\n测试射线检测是否在 10 个单位内检测到碰撞体。\n\n`line.SetPosition(1,\
  \ hit.point);`\n\n如果检测到碰撞体，则将待绘制线的第二个点设置在射线检测到碰撞体的位置。\n\n`}  else {`\n`line.SetPosition(1,\
  \ ray.GetPoint(50));`\n`}`\n\n否则，照常将线绘制到沿射线方向 50 个单位的位置。\n\n目前唯一能看到的效果是激光在击中轨道时停止。通过使用射线检测，如果有任何带有碰撞体的其他游戏对象与射线相交，激光就会终止于该游戏对象表面上的交点位置。要进行测试，可以在试玩时将玩家角色置于激光束的路径中。\n\
  \n添加粒子系统后，激光看起来会更逼真且更具威慑力。在项目面板中，打开 Assets ➤ Sample Assets ➤ Effects ➤ Particle\
  \ Systems ➤ Prefabs 文件夹。找到 Flare 预制体，拖动一个副本到层级面板，并通过拖放到 LaserCube 上，使其成为 LaserCube\
  \ 的子对象。\n\n在 MonoDevelop 中，编辑 Laser 脚本，按如下方式添加三行代码：\n\n```\n#pragma strict\n\npublic\
  \ var line : LineRenderer;\npublic var sparks : GameObject;\n\nfunction Start ()\
  \ {\n    sparks = GameObject.Find(\"Flare\");\n    line = gameObject.GetComponent.<LineRenderer>();\n\
  }\n\nfunction Update () {\n    ShowLaser();\n}\n\nfunction ShowLaser () {\n    var\
  \ ray : Ray = Ray(transform.position, -transform.up);\n    var hit : RaycastHit;\n\
  \    line.SetPosition(0, ray.origin);\n    if(Physics.Raycast(ray, hit, 50))\n \
  \   {\n        line.SetPosition(1, hit.point);\n        sparks.transform.position\
  \ = hit.point;\n    }  else {\n        line.SetPosition(1, ray.GetPoint(50));\n\
  \    }\n}\n```\n\n保存脚本并进行试玩。这才像是一道激光！\n\n这段代码解析如下：\n\n`public var sparks : GameObject;`\n\
  \n声明一个类型为 `GameObject` 的引用变量 `sparks`。\n\n`sparks = GameObject.Find(“Flare\");`\n\
  \n找到对 Flare 粒子系统预制体的引用，并将其赋值给 `sparks`。\n\n`sparks.transform.position = hit.point;`\n\
  \n将 sparks 粒子系统的位置设置在激光射线检测到碰撞体的位置。\n\n超级酷，对吧？请注意，在试玩时，如果玩家角色被激光击中，火花会从他身上飞溅出来，仿佛他是无敌的。虽然这在其他设定中可能很酷，但这里的激光障碍物本应更具杀伤力。\n\
  \n在 Laser 脚本中，在变量声明部分添加以下内容：\n\n`public var victim : GameObject;`\n\n这声明了一个类型为 `GameObject`\
  \ 的引用变量 `victim`。\n\n要为玩家角色分配引用，请在 `Start()` 函数中添加以下代码行：\n\n`victim = GameObject.Find(\"\
  Third Person Character Ragdoll\");`\n\n最后，在 `ShowLaser()` 函数中插入以下代码行：\n\n```\nfunction\
  \ ShowLaser () {\n    var ray : Ray = Ray(transform.position, -transform.up);\n\
  \    var hit : RaycastHit;\n    line.SetPosition(0, ray.origin);\n    if(Physics.Raycast(ray,\
  \ hit, 50))\n    {\n        line.SetPosition(1, hit.point);\n        if (hit.collider\
  \ == victim.collider) {\n            victim.GetComponent(GoRagdoll).GotoRagdoll();\n\
  \        }\n        sparks.transform.position = hit.point;\n    } else {\n     \
  \   line.SetPosition(1, ray.GetPoint(50));\n    }\n}\n```\n\n如果射线检测到碰撞体，它会检查该碰撞体是否为玩家角色的碰撞体。如果是，则调用玩家角色的\
  \ `GotoRagdoll()` 函数来消灭该玩家。\n\n保存脚本。在项目面板中，打开 Assets ➤ Prefabs 文件夹。将层级面板中的 LaserCube\
  \ 拖动并放入 Prefabs 文件夹中，以备将来使用。现在就可以进行试玩了。\n\n对于这个障碍物来说，简单的材质和红色就足够了，但如果你想通过脚本来设置颜色，样例代码片段是将以下代码行放入\
  \ `Start()` 函数中：\n\n```\nline.material = new Material (Shader.Find(\"Particles/Additive\"\
  ));\nline.SetColors(Color.green, Color.blue);\n```\n\n这里你正在新建一个简单的材质，然后设置线条的起始和结束颜色。\n\
  \n## 曳光弹障碍物\n\n另一个用于视觉效果的精美渲染器是轨迹渲染器组件（图 8-14）。顾名思义，它会在移动的游戏对象后方绘制一条轨迹。它通常用作视觉提示来表示速度，例如飞机的凝结尾迹，甚至可以是速度与逼真图像（如曳光弹）的组合。曳光弹障碍物将在玩家沿高架轨道前进的路径上随机生成曳光弹。\n\
  \n快速演示一下，在层级面板中选择 Pendulum_01。在检视面板中，选择“添加组件 ➤ 效果 ➤ 轨迹渲染器”。\n\n![A978-1-4302-6587-0_8_Fig14_HTML.jpg](img/A978-1-4302-6587-0_8_Fig14_HTML.jpg)\n\
  \n**图 8-14.** 检视面板中的轨迹渲染器组件\n\n轨迹渲染器可以使用不同的材质数组来实现多种效果。与线渲染器一样，轨迹渲染器也使用粒子材质。将材质数组的大小（由\
  \ Size 属性指示）保留为 1。对于元素 0，选择您为激光障碍物创建的 SimpleLaser 材质。\n\n“时间”是轨迹持续的时间（以秒为单位）。“起始宽度”和“结束宽度”调整轨迹的宽度，这类似于线渲染器，也是一个\
  \ 2D 广告牌。如果您的材质中包含颜色，则可以保留颜色属性的元素不变。由于我们的 Laser 材质是白色的，请继续为所有五个元素选择颜色，创建一个绚丽的色彩光谱。\n\
  \n如果游戏对象在时间指定的时间段内没有移动，并且勾选了“自动销毁”，则游戏对象将被销毁。\n\n![A978-1-4302-6587-0_8_Fig15_HTML.jpg](img/A978-1-4302-6587-0_8_Fig15_HTML.jpg)\n\
  \n**图 8-15.** 旋转摆锤障碍物后方绘制的轨迹\n\n当您完成对摆锤轨迹（图 8-15）的实验后，请禁用或删除轨迹渲染器组件。\n\n\n\n"
- '# 弹丸预制体


  创建一个基本球体游戏对象并命名为 `Projectile`。将其 `Transform.position` 设为 `(0, 0, 0)`，`Transform.rotation`
  设为 `(0, 0, 0)`，缩放设为 `(0.05, 0.05, 0.05)`。在 Inspector 中，通过选择 添加组件 ➤ 物理 ➤ Rigidbody
  来添加 `Rigidbody` 组件。


  接下来，通过选择 添加组件 ➤ 特效 ➤ 拖尾渲染器 添加 `Trail Renderer` 组件。在材质属性中，将尺寸保持为 1。使用元素 0 字段右侧的圆形选择按钮定位并选择
  `part_afterburner` 材质。这是一个来自示例资源包的粒子材质。将时间设为 0.5，并将起始宽度和结束宽度均设为 0.1。在颜色属性中，为 `Color[0]`
  指定浅黄色。为其余颜色元素依次选择渐深的黄色到橙色。


  为了使它成为更致命的障碍物，玩家角色被弹丸击中时应被击杀。你可以使用与钟摆障碍物相同的 `KillOnCollision` 脚本，通过选择 添加组件 ➤ 脚本
  ➤ KillOnCollision 来添加。


  最后，将 `Projectile` 游戏对象从层级视图拖拽到项目面板中的 `Assets ➤ Prefabs` 文件夹中，使其成为预制体。现在你可以安全地从场景视图中删除
  `Projectile` 游戏对象。


  '
- "# 弹丸发射器\n\n创建一个基本圆柱体游戏对象并命名为 `Cannon`。将其 `Transform.position` 设为 `(4, 10.5, 95)`，`Transform.rotation`\
  \ 设为 `(0, 0, 90)`，`Transform.scale` 设为 `(0.2, 0.2, 0.2)`。现在创建一个空游戏对象并命名为 `Launcher`。这个空游戏对象将是弹丸实例化的位置。在层级视图中将\
  \ `Launcher` 拖拽到 `Cannon` 上方，使其成为 `Cannon` 的子对象。此时其变换坐标将相对于 `Cannon` 游戏对象而非世界坐标。将其\
  \ `Transform.position` 设为 `(0, 1.25, 0)`，`Transform.rotation` 设为 `(270, 270, 0)`，其缩放应已重置为\
  \ `(5, 5, 5)`。\n\n在项目面板的 `Assets ➤ Scripts` 文件夹中，创建一个名为 `LaunchProjectile` 的脚本。将其附加到\
  \ `Launcher` 游戏对象上，然后在 MonoDevelop 中打开。将代码编辑为以下内容：\n\n```\n#pragma strict\n\npublic\
  \ var projectile : GameObject;\n\npublic var force : float = 25;\n\npublic var frequency\
  \ : float = 2.0;\n\nprivate var nextLaunch : float = 0.0;\n\nfunction Update ()\
  \ {\n\n    if (Time.time > nextLaunch) {\n\n    nextLaunch = Time.time + frequency;\n\
  \n            var projectileInstance : GameObject = Instantiate(projectile, transform.position,\
  \ transform.rotation);\n\n            projectileInstance.rigidbody.AddForce (projectileInstance.transform.forward\
  \ * force, ForceMode.Impulse);\n\n        Destroy(projectileInstance, 2);\n\n  \
  \  }\n\n}\n```\n\n保存脚本。其分解如下：\n\n`(1)     public var projectile : GameObject;`\n\
  \n        `public var force : float = 25;`\n\n        `public var frequency : float\
  \ = 2.0;`\n\n        `private var nextLaunch : float = 0.0;`\n\n变量声明：`projectile`\
  \ 用于持有对 `GameObject` 的引用，而浮点变量 `force` 和 `frequency` 供你在 Inspector 中微调弹丸行为。浮点变量\
  \ `nextLaunch` 跟踪每次弹丸发射之间的时间。\n\n`(2)     if (Time.time > nextLaunch)`\n\n`Time.time`\
  \ 是游戏开始以来的秒数。`if` 条件语句用于测试经过的时间是否大于计算出的下一次弹丸发射时间。如果大于，\n\n`(3)     nextLaunch =\
  \ Time.time + frequency;`\n\n`nextLaunch` 重置为当前已流逝的游戏时间加上浮点变量 `frequency` 指定的每次发射间隔秒数。\n\
  \n`(4)     var projectileInstance : GameObject = Instantiate(projectile,`\n\n  \
  \      `transform.position, transform.rotation);`\n\n在 `transform.position` 和 `transform.rotation`\
  \ 处（即此脚本附加到的父级 `Launcher` 游戏对象的位置和旋转）实例化 `Projectile` 预制体游戏对象的克隆。\n\n`(5)     projectileInstance.rigidbody.AddForce`\n\
  \n        `(projectileInstance.transform.forward * force,`\n\n        `ForceMode.Impulse);`\n\
  \n使用 `AddForce()` 函数向弹丸预制体的刚体施加力，赋予其一个 Vector3 前向方向，大小由可调节的 `force` 因子决定，并使用 `ForceMode.Impulse`\
  \ 瞬间施加所有力。\n\n`(6)     Destroy(projectileInstance, 2);`\n\n出于性能考虑，你不希望这些弹丸游戏对象在视野之外堆积，因此每个克隆将在两秒后被销毁。\n\
  \n在层级视图中选择 `Launcher` 游戏对象。将 `Projectile` 预制体从 `Assets ➤ Prefabs` 文件夹拖拽到 `LaunchProjectile`\
  \ 脚本的弹丸属性字段中。曳光火障已完成。将 `Cannon` 游戏对象从层级视图拖拽到项目文件夹中的 `Assets ➤ Prefabs` 文件夹，使其成为预制体资源。保存脚本，保存场景，并保存项目。进行游戏测试，现在你拥有了一个致命的弹丸式曳光火障。做得好！\n\
  \n## 总结\n\n现在你已经掌握了使用 Shuriken 创建粒子系统和特效的方法，并且开始想象你的障碍赛道将如何形成一个游戏。你已在视觉特效工具包中新增了\
  \ `LineRenderer` 和 `TrailRenderer`，并为障碍赛道场景创建了大量新的障碍物预制体。\n\n在将这些障碍物随机分布到赛道之前，在下一章中，你将学习游戏设计理论等相关内容，这反过来将指导你如何以及为何要像障碍赛道那样设计场景布局。\n\
  \n"
- "# 9. 游戏设计与逻辑——蓝图\n\n对于初学开发者，最常见的建议是：“要想提高游戏制作水平，就制作更多游戏。”一个同样常见的回应是：“没错，但我该从何入手？”\n\
  \n在坐到电脑前之前，你必须先有你正在构建的游戏的蓝图。游戏设计就是创建这个蓝图的过程。既然你已经熟悉了 Unity 编辑器并掌握了一些脚本编写技能，现在是时候来了解游戏设计和游戏制作流程了。\n\
  \n> **注意**  \n> 在任何事情之前，准备是成功的关键。——亚历山大·格拉汉姆·贝尔\n\n\n\n"
- '# 游戏


  究竟什么是游戏？从实用角度出发，一款游戏需要满足以下基本条件：


  - **玩家**：电影和电视剧等其他形式的视频娱乐可以面向一个或多个观众播放，甚至可以在空无一人的房间里放映，但游戏需要至少一名玩家的互动和输入。

  - **规则**：规则既界定了玩家可以做什么，也设定了玩家不能做什么的限制，从而规定了游戏如何进行。

  - **目标**：目标决定了游戏如何结束。它可以是达成即获胜、未达成即失败的目标，也可以是在特定时间内成功完成一项任务或尝试一项活动。


  以你在前几章一直在构建的障碍赛道场景为例。它是一款游戏吗？


  - **玩家**：是的，游戏玩法需要玩家的输入。

  - **规则**：是的：玩家总是从赛道最低处开始游戏。玩家可以行走、奔跑、跳跃和下蹲。危险会杀死玩家。从高架轨道上掉落或跳下也会杀死玩家。

  - **目标**：没有。“不死”并非一个目标。至少对于一款游戏来说，这不是一个很好的目标。玩家可以通过不移动角色来达成这个目标，或者干脆从不玩预期的障碍赛道游戏，只是从高架轨道上跑开。“到达障碍赛道的远端”才是一个目标。


  没有任何一种定义是包罗万象的。例如，谜题也符合这些标准，并且是游戏的一个类型，但略有不同之处在于，谜题通常只有一个正确答案，而非谜题类游戏每次游玩的结果都是不可预测的。除了极少数例外情况，这三要素普遍存在于所有类型的游戏之中，并构成了基础游戏设计的一个实用出发点。


  '
- '# 游戏、小游戏与迷你游戏


  游戏时长可长可短。一端是像`World of Warcraft`这种可能永无止境的游戏，而另一端则是只需几秒钟就能完成的迷你游戏。


  流行的、高品质的主机和 PC 游戏拥有数小时的纯粹游戏时间，这还不包括菜单、过场动画、说明、对话等内容。内容越多越好，但任何特定项目的最终规模都将由预算和发行截止日期决定。


  当前“休闲游戏”的兴起趋势虽常被提及，但定义模糊。受移动设备作为游戏平台日益普及的影响，休闲游戏通常以分钟而非小时为单位进行游玩。游戏玩法本身可能千差万别，但休闲游戏通常具有明确的关卡、线性的进程和简单的计分系统。


  小游戏是更短的游戏，游戏时间约为 5 到 10 分钟一个回合，通常类似于经典的街机游戏。它们可以独立存在，也可以嵌入到大型游戏之中。在大型游戏里，它们用途广泛：可以作为奖励解锁，成为获取奖励的独立活动；可以用来介绍新道具或如何使用新功能；或者仅仅作为主线游戏完成后的额外内容。小游戏不一定要完成才能通关其所属的主游戏。当在像`Legend
  of Zelda`这样的大型游戏中发现它们时，它们在操作和复杂度上通常更为简单。即便如此，一个小游戏仍然具备玩家、规则和终点这三个基本要求。


  迷你游戏旨在几秒钟而非几分钟内完成游玩。`Wario Ware`是迷你游戏合集的一个经典例子。它们在游戏玩法和设计上都提出了独特的挑战，即需要在如此短的时间内既搞懂玩法又赢得游戏。


  '
- '# 游戏设计考量


  在设计任何游戏时，都有几个方面需要你深思熟虑。


  ## 目标受众与 ESRB 分级


  娱乐软件分级委员会（ESRB）是一个行业自律组织，负责定义并执行分级系统。


  你的目标受众年龄以及相应的 ESRB 分级会影响你的游戏设计。敏感内容（包括血腥、暴力、裸体和粗俗语言）的程度会影响你游戏的分级，如果你不了解这些标准，可能会导致你的游戏被排除在你预期受众之外。


  分级系统包含三个部分：


  - **分级类别**：类似于电影分级，用于建议适龄人群（图 9-1）。

  - **内容描述符**：这些描述符提供了关于导致该分级的游戏具体内容的更详细信息。例如，一款游戏可能被评为`E10+`，即“可能包含动画暴力”。如果你觉得这相当模糊，ESRB
  的内容描述符会确切告诉你他们对诸如“动画暴力”等术语的定义（表 9-1）。


  ![A978-1-4302-6587-0_9_Fig1_HTML.jpg](img/A978-1-4302-6587-0_9_Fig1_HTML.jpg)


  **图 9-1.** ESRB 分级类别图示


  **表 9-1.** ESRB 电子游戏内容描述符


  | 内容描述符 | 定义 |

  | --- | --- |

  | 酒精参考 | 提及和/或展示酒精饮料的图像。 |

  | 动画血液 | 变色和/或不逼真的血液描绘。 |

  | 血液 | 对血液的描绘。 |

  | 血腥暴力 | 对血液或身体部位残缺的描绘。 |

  | 卡通暴力 | 涉及卡通式情境和角色的暴力行为。可能包括角色在遭受暴力行为后毫发无损的场景。 |

  | 滑稽恶搞 | 涉及闹剧或暗示性幽默的描绘或对话。 |

  | 粗俗幽默 | 涉及粗俗行为的描绘或对话，包括“卫生间”幽默。 |

  | 毒品参考 | 提及和/或展示非法药物的图像。 |

  | 幻想暴力 | 幻想性质的暴力行为，涉及容易与现实生活区分开来的情境中的人类或非人类角色。 |

  | 强烈暴力 | 对肢体冲突的写实且逼真的描绘。可能涉及极端的和/或逼真的血液、血腥、武器以及对人体受伤和死亡的描绘。 |

