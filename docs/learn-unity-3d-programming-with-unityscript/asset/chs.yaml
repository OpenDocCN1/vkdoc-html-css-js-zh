  \ [`http://developer.samsung.com/forum/en`](http://developer.samsung.com/forum/en)\
  \ 为其安卓开发者提供额外支持，以便特别利用其设备（从手机到电视和可穿戴技术）的功能。\n  ![A978-1-4302-6587-0_13_Fig9a_HTML.jpg](img/A978-1-4302-6587-0_13_Fig9a_HTML.jpg)![A978-1-4302-6587-0_13_Fig9b_HTML.jpg](img/A978-1-4302-6587-0_13_Fig9b_HTML.jpg)\n\
  \  图 13-9. 安卓及基于安卓的三星产品开发者网站\n\n从市场营销的角度来看，为那些成熟且流行的游戏平台制作游戏，无疑能让你的投入获得最大回报。如果你对新兴技术感兴趣，或者只是想尝试一些不同的东西，还有其他一些不太知名的游戏平台也支持\
