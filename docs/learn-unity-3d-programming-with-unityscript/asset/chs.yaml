  > **注意：** 各种动画被称为状态。例如，当角色处于闲置状态时，它就处于“Idle 状态”。从一个状态移动到另一个状态称为过渡，用箭头表示。你在动画器窗口中为动画控制器设计的这些状态和过渡的集合，就构成了所谓的状态机。


