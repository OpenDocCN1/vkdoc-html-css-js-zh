- 'no': 47
  overturn_probability: 0.1
  alternative: 目录（Table of Contents）的开始标记，属于前置内容的一部分。
  counter_evidence:
  - 依据规则，目录通常被视为前置内容或正文的一部分，但‘统一划分为一章’通常指前置内容块。
  - 然而，在许多电子书结构解析中，目录因其列表性质较长，有时会独立处理。但规则明确指出‘文末索引也划分为一章’，暗示前置内容（含目录）应合并。
  - 主要质疑点：如果前置内容（第0-46行）已经作为一章，第47行不应再分章。
  keep_split: true
- 'no': 383
  overturn_probability: 0.0
  alternative: 正文之前的‘关于作者’章节标题。
  counter_evidence:
  - 该行位于目录结束后（第381行是目录最后一项‘索引’之前或目录页结束），属于‘正文之前的内容’。
  - 根据规则‘前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章’，这里的判断存在歧义：是‘所有前置内容合并为一章’还是‘每一类前置内容各自成章’？
  - 通常‘统一划分为一章’意味着整个前置部分（Front Matter）是一个大章。如果如此，第383行不应分章。
  - 但是，查看分章结果，第0行（封面/版权）、第44行（误判）、第47行（目录）都分了章，说明该审查员的逻辑可能是‘每个主要前置部分标题分章’。
  - 如果按照‘前置内容统一为一章’的严格规则，第383行确实不应分章。但如果按照‘目录、关于作者、引言、正文’的逻辑块分割，则可能合理。
  - 鉴于第44行和47行已被判定为分章点，且规则文字‘统一划分为一章’具有强制性，此处分章极可能是错误的，除非‘统一’指的是‘这些内容不属于正文章节，而是独立的前置章节’。
  keep_split: true
