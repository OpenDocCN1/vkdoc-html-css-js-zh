  \ AS3.0 计算机程序了！\n\n### 编写你的第一个程序\n\n现在，你已经具备了开始编写第一个程序所需的大部分要素。在接下来的几个步骤中，你将执行以下操作：\n\
  \n1.  学习如何创建具有 `.as` 文件扩展名的 ActionScript 文件。\n2.  创建一个包，将所有代码整齐地组织在一起。\n3.  导入显示文本和图像所需的图形功能。\n\
  4.  创建一个类，作为你程序的第一个构建块。\n5.  创建一个构造方法，触发程序中的首批操作运行。\n6.  创建一个指令，即你希望程序执行的实际操作。\n\
  7.  导入 Flash 内置的 `Sprite` 类，以帮助你的程序显示输出。\n8.  发布完成的 Flash 文件，以查看你所有辛勤工作的实际输出。\n\n\
  这个过程看似工作量很大，但完成后，你将拥有一个完整的系统框架，这将成为本书其余所有项目的基础，并为你自己构建程序和游戏提供一个灵活的根基。\n\n### ActionScript\
  \ 文件与 `.as` 文件扩展名\n\nActionScript 计算机程序是控制整个游戏的核心。它精确地告诉所有游戏角色和元素应该如何表现。ActionScript\
  \ 程序是游戏最重要的组成部分，本书的大部分内容都致力于解释如何编写和理解它们。\n\nActionScript 程序本质上就是一个包含特殊单词和字符的文本文件。当你编写\
  \ ActionScript 计算机程序时，你只是在计算机上创建一个带有 `.as` 扩展名的简单文本文件。具有 `.as` 扩展名的文件被称为 ActionScript\
  \ 文件或 AS 文件。\n\n你可以在 Flash Builder 中通过查看代码编辑窗口的顶部来确认这一点。如果你按照本章的说明操作，代码编辑窗口顶部高亮显示的标签栏会显示\
  \ `HelloWorld.as`。Figure 1-15 显示了这一点。\n\n![Image](img/9781430239922_Fig01-15.jpg)\n\
  \n**图 1-15.** Flash Builder 中代码编辑窗口顶部高亮显示的标签栏告诉你，你正在创建一个具有 `.as` 扩展名的 ActionScript\
  \ 文件。\n\n查看代码编辑窗口的左侧，你会找到包资源管理器，如图 Figure 1-16 所示。`HelloWorld.as` 文件将会被高亮显示。\n\n\
  ![Image](img/9781430239922_Fig01-16.jpg)\n\n**图 1-16.** 包资源管理器显示项目中正在使用的文件和文件夹。\n\
  \n包资源管理器显示了你 ActionScript 项目中所有正在使用的文件和文件夹。目前你无需担心其中任何一个，除了 `HelloWorld.as` 文件。重要的是要知道，包资源管理器实际上显示的是\
  \ Flash Builder 在你的计算机上自动为你创建的真实文件和文件夹。包资源管理器告诉你，`HelloWorld.as` 文件位于一个名为 `src`\
  \ 的文件夹中，而这个文件夹又位于一个名为 `FlashGames` 的文件夹中。\n\n这些文件夹和文件在你的计算机上位于何处？\n\n你可能还记得，当你在\
  \ Flash Builder 中创建 HelloWorld 项目时，你告诉它将项目保存在这里：\n\n`/Users/rexvanderspuy/Documents/FlashGames/HelloWorld`\n\
  \n这意味着 HelloWorld 项目应该位于一个名为 `FlashGames` 的文件夹中，而这个文件夹又应该位于计算机的“文档”文件夹中。\n\n真的是这样吗？让我们验证一下。\n\
  \nFigure 1-17 展示了我在计算机上打开“文档”文件夹时看到的情况。\n\n![Image](img/9781430239922_Fig01-17.jpg)\n\
  \n**图 1-17.** `HelloWorld.as` 文件以及 Flash Builder 所需的所有其他 ActionScript 项目文件，都已在您指定的位置自动创建。\n\
  \n是的，没错！\n\n`HelloWorld.as` 文件位于一个名为 `src` 的文件夹中，`src` 是**源文件**的缩写。这些是包含计算机编程代码的文件。传统上，计算机程序员将他们的程序存储在名为\
  \ `src` 的文件夹中。你所有的 ActionScript 程序都将存储在名为 `src` 的文件夹中。Flash Builder 会自动为你完成此操作。\n\
  \n而 `src` 文件夹又存储在一个名为 `HelloWorld` 的父文件夹中，这是你项目的名称。`HelloWorld` 文件夹又存储在一个名为 `FlashGames`\
  \ 的文件夹中。\n\n这意味着，包资源管理器向你展示的是存储在计算机上的真实文件和文件夹。请记住，每当你对 Flash Builder 代码编辑窗口中的 AS\
  \ 文件进行任何更改时，你都是在对你计算机上可以找到的真实文件进行真实更改。\n\n\n\n### 这个我要带走！\n\n上一节介绍了 Flash Builder\
  \ 中的包资源管理器。它能帮你找到游戏项目中使用的所有文件和文件夹。但什么是包呢？\n\n包是 AS3.0 程序的第一个基本构建块。它将所有 AS3.0 编程代码的片段组合在一起，并将所有代码包裹在\
  \ `package` 中。一个包由三部分组成。\n\n* **关键字**：这个关键字被恰如其分地命名为 `package`。关键字是 AS3.0 能够理解并执行特殊任务（例如创建包！）的特殊单词。当你在程序中输入关键字时，Flash\
  \ Builder 会将它们染成紫色和蓝色，以便你在代码中识别它们。\n* **标识符**：标识符可以是任何你想给包起的名字。（它是可选的，本书中你不会使用包标识符。）\n\
  * **花括号**：花括号长这样：\n\n```\n{\n}\n```\n\n> 它们用来将里面的内容保持在一起。你可以把它们想象成捆扎包的绳子。下面是一个简单的例子：\n\
  \n```\n{\n  两个花括号之间的任何内容都保持在一起\n}\n```\n\n让我们为你的 Hello World 程序创建包。\n\n1. 打开包含你在前面步骤中创建的空白\
  \ `HelloWorld.as` 文件的 AS3.0 编辑窗口。\n\n2. 在编辑窗口中输入以下文本：\n\n```\npackage\n{\n\n}\n\
  ```\n\n你的 ActionScript 编辑窗口现在应该看起来像 图 1-18。\n\n![图片](img/9781430239922_Fig01-18.jpg)\n\
  \n**图 1-18.** 在 `HelloWorld.as` 文件中创建一个包。\n\n*请注意，你在左花括号和右花括号之间留了一个空行。这是因为你将在后续步骤中在该行插入一些内容。*\n\
  \n你刚刚创建的东西是程序员称之为 **块语句** 的东西。块语句定义了程序的特定部分，用于将花括号之间的所有代码组合在一起。在这种情况下，包块语句完全是空的，因为花括号之间除了一个空行什么也没有。但别担心；它不会空很久！\n\
  \n然而，在继续之前，值得更仔细地审视你究竟创建了什么。\n\n当你在 ActionScript 编辑窗口开始输入代码时，你注意到单词 \"package\"\
  \ 被编辑器自动染成了紫色。这是编辑器的一种有用的提示方式，告诉你刚刚输入的 是一个关键字——一个它能理解的单词。关键字也被称为 *保留字*。这意味着这些单词属于\
  \ ActionScript，而且只属于 ActionScript；你不能将它们用作包、类、变量或方法的名字（稍后将详细介绍）。`package` 关键字只是告诉\
  \ Flash：\"嘿，我正在创建一个包！\" 这不太难，对吧？\n\n在 `package` 关键字之后，是我们亲爱的小伙伴——花括号：\n\n```\n{\n\
  }\n```\n\n很可爱，不是吗？目前，它们完全是空的，里面什么也没有。但这很快就会改变。很快你就会往里面放些东西 `{就像这样！}`。\n\n#### 精灵的一点魔法\n\
  \n精灵（Sprites）是超自然的生物——比如小精灵、仙女或宁芙——它们居住在森林溪流岸边附近的林地幽谷中，以及苍老的古橡树和柳树旁。奇怪的是，它们也住在 Flash\
  \ 和 ActionScript 里。如果你想在屏幕上显示文本或图形，你必须召唤 AS3.0 的精灵。\n\nAS3.0 的精灵住在一个叫库（library）的地方。库是一个庞大的计算机代码仓库，在你安装\
  \ Flash Builder 时它会自动安装。这个库包含数百段预先编写好的计算机代码，你可以在自己的程序中自由使用。精灵由库中的计算机代码片段构成，它们的工作是显示文本和图形。\n\
  \n这个库实际上是 Flex SDK 的一部分，它是所有 AS3.0 程序的大脑。当你从库中请求一些代码时，Flash Builder 会进入 SDK，在各个堆栈中翻找，并带回你正在寻找的东西，以便你可以在程序中使用它。它包含了使你的\
  \ Flash 游戏运行的核心计算机代码。你可以在 Flash Builder 安装目录下找到一个名为 `sdks` 的文件夹中找到 SDK。\n\n同样重要的是要知道，Flash\
  \ Builder 实际上只是与 SDK 交互的一个界面。制作 Flash 游戏真正需要的只是 SDK 和 Flash Player 的调试版本。只要你拥有这两个组件，你就可以使用\
  \ Flash Develop、TextMate、Eclipse、Xcode 或任何其他 IDE 来制作 Flash 游戏。\n\nSDK 的一个伟大之处在于，如果\
  \ Adobe 推出了一个包含你想在游戏中使用的酷炫新功能的新版本 SDK，你只需在 Flash Builder 中下载并安装那个新 SDK 即可。SDK 是免费的，你不需要花任何钱来升级到新版本的\
  \ Flash Builder。\n\n库是一个很大的地方，它被分成许多不同的部分。精灵住在哪里？它们住在库中一个叫做 **display** 的部分，而该部分又在库中一个更大的叫做\
  \ **flash** 的部分里。你可以通过以下路径找到它们：\n\n```\nflash.display.Sprite\n```\n\n每个单词之间的点表示库的一个新部分。这表明\
  \ `display` 部分是 `flash` 部分的一部分，而 `Sprite` 部分是 `display` 部分的一部分。这就像在说：\"从 `flash`\
  \ 部分开始，然后跟着指示牌到 `display` 部分。在 `display` 部分你会找到精灵。\" 但这还不够。你必须使用一个名为 `import` 的特殊关键字来显式地告诉程序调用精灵。`import`\
  \ 关键字用于从库中取出代码，以便你可以在程序中使用它。\n\n以下是导入精灵的方法：\n\n```\nimport flash.display.Sprite;\n\
  ```\n\n这条指令告诉程序去库的 `flash.display` 部分获取一个 `Sprite`。这行代码被称为 **导入语句**。当你想使用库中的专用代码时，你会在你的\
  \ AS3.0 程序和游戏中使用许多导入语句。\n\n请注意，在导入语句的最末尾有一个分号（`;`）。这是一个编程标点符号，意思是\"执行我刚才告诉你的！\"\
  \ 你将在后续的示例中看到更多分号。\n\n另外，非常重要的一点是，请注意 `Sprite` 中的 \"S\" 是大写的。我将在本书后面详细解释原因，但现在你只需知道，当你在\
  \ AS3.0 程序中使用 `Sprite` 这个词时，它必须是大写的。\n\n现在你已经知道了什么是 `Sprite`，在哪里找到它，以及为了在程序中使用它需要编写的代码行，去获取一个\
  \ `Sprite` 吧！\n\n1. 在代码编辑窗口中输入以下粗体文本。确保你将其输入在 *两个花括号之间*。\n\n```\npackage\n{\n  import\
  \ flash.display.Sprite;\n}\n```\n\n注意这个新文本相对于左边缘是缩进的。当你添加新文本时，代码编辑器会自动为你做这件事。本书中的代码示例使用两个空格的缩进级别，但\
  \ ActionScript 编辑器窗口会以四个空格缩进你的代码，这完全没问题。\n\n缩进表明你刚刚添加的新代码 *在* 包的花括号 *内部*。你很快就会发现像这样缩进代码是多么重要。\n\
  \n你可以通过按 Tab 键强制任何代码行进行缩进。\n\n现在，你已经掌握了 AS3.0 精灵的魔力，可以随心所欲地显示文本和图形了！\n\n你的代码编辑窗口现在应该看起来像\
  \ 图 1-19。\n\n![图片](img/9781430239922_Fig01-19.jpg)\n\n**图 1-19.** 从库中导入一个 `Sprite`\
  \ 以帮助你显示文本和图像。\n\n\n##### 不要翘课！\n\n现在你已经创建了一个包并导入了`Sprite`，下一步就是在该包内部创建一个**类**。你可以将类视为构建\
  \ ActionScript 程序的基本模块。\n\n2\\. 保持你的 ActionScript 编辑器窗口打开，直接在包的尖括号内，添加以下粗体显示的文本：\n\
  \n```\npackage\n{\n  import flash.display.Sprite;\n\n  public class HelloWorld extends\
  \ Sprite\n  {\n  }\n}\n```\n\n在`import`语句和新代码之间有一行空行。这是可选的，但正如你将在后续示例中看到的，它会使你的程序更易于阅读。\n\
  \n与`import`语句一样，新代码也从左边界缩进，以表明它位于包的尖括号内。\n\n图 1-20 显示了你代码编辑窗口现在应有的样子。\n\n![图片](img/9781430239922_Fig01-20.jpg)\n\
  \n**图 1-20.** 在包内部创建一个类。\n\n那么你刚刚做了什么？\n\n你创建了一个名为`HelloWorld`的类。你是在包内部创建它的。`public`、`class`和`extends`这些词会显示为蓝色和紫色，表明它们是\
  \ AS3.0 识别的保留关键字。\n\n你编写的任何 ActionScript 程序都必须至少包含一个类，但你在本书中将构建的大多数程序和游戏都会包含多个类。快速看一下这段新代码。\n\
  \n```\npublic class HelloWorld extends Sprite\n{\n}\n```\n\n这段代码被称为**类定义**。和包一样，类定义也有一对空的花括号悬空在那里。这表明，像包一样，它也是一个块语句。这些花括号目前是空的，所以这个类还做不了任何事情。这种情况很快就会改变。\n\
  \n类定义主要做三件事。\n\n*   它创建了类。关键字`class`告诉 Flash 你正在创建一个类。就这么简单！\n*   它赋予类一些要遵守的规则。这应该是显而易见的：你们中有多少人经历过没有规则的课堂？这段代码告诉\
  \ Flash 你正在创建的类是 **public（公共的）**。这意味着它所包含的信息可以被属于同一包或程序可能使用的任何其他包的其他任何类所共享。该类包含的信息对所有人都完全可用。（虽然本书大部分内容都使用公共类，但有时你可能希望阻止类之间共享信息，就像学校的足球队不想与竞争学校分享其战术一样。在这种情况下，你可以将类定义为\
  \ **internal（内部的）**。内部类只与驻留在同一包中的其他类共享信息。）\n*   它赋予类一个标识符，即一个名称，可以是您选择的任何名称。在这个例子中，该类被命名为`HelloWorld`。\n\
  \n你并不是在经历既视感！你之前见过`HelloWorld`这个短语。它是你正在处理的 AS 文件的名称：`HelloWorld.as`。这并非巧合。当你创建一个类时，它必须保存在一个与类名完全相同的文件中。你创建的每一个新类，都必须创建一个与之共享相同类名的新\
  \ AS 文件。\n\n*   最后，它**扩展（extends）** 了另一个类。这意味着它正在使用其他类来帮助其完成工作。在这种情况下，它使用了你在前一行代码中导入的那个大名鼎鼎的`Sprite`的魔力。关键字`extends`告诉`HelloWorld`类使用`Sprite`的魔力来使文本和图像可见。\n\
  \n这里涉及的内容很多，所以让我们用通俗易懂的英语来简化这一行新代码，以便你更好地理解它在说什么。\n\n```\npublic class HelloWorld\
  \ extends Sprite\n{\n}\n```\n\n它在说这些：“创建一个公共类，让你编写的其他代码可以轻松访问。这个新类的名称是`HelloWorld`。它扩展了另一个名为`Sprite`的类，这赋予了它显示文本和图像的魔法能力。”\n\
  \n图 1-21 阐释了这段新代码的含义。\n\n![图片](img/9781430239922_Fig01-21.jpg)\n\n**图 1-21.** 类将容纳你程序的大部分代码，即游戏和程序的核心，位于它的两个花括号之间。\n\
  \n类定义的小小花括号仍然是空的。让我们来利用它们！\n\n##### 使用构造方法\n\n**构造方法**是程序中让事情发生的一部分。具体来说，一旦类被告知开始工作，它就会立即将类投入运行。它所包含的任何编程代码都会立即执行。如果单独的类定义只是一个空壳，那么构造方法就像它的心脏和肺。\n\
  \n3\\. 让我们为`HelloWorld`类创建构造方法。将粗体显示的代码添加到你已经编写的代码中。\n\n```\npackage\n{\n  import\
  \ flash.display.Sprite;\n\n  public class HelloWorld extends Sprite\n  {\n    public\
  \ function HelloWorld()\n    {\n\n    }\n  }\n}\n```\n\n你的 ActionScript 编辑窗口现在应该看起来像图\
  \ 1-22。\n\n![图片](img/9781430239922_Fig01-22.jpg)\n\n**图 1-22.** 在类内部添加构造方法。\n\n\
  如你所见，构造方法仅仅是一个带有空花括号的块语句，看起来和类定义非常相似。事实上，它具有相同的名称：`HelloWorld`。这并非偶然：所有类都需要具有与类名完全相同的构造方法。\n\
  \n你还会识别的另一个东西是关键字`public`。\n\n```\npublic function HelloWorld()\n{\n}\n```\n\n与类定义一样，使用`public`一词告诉\
  \ Flash，构造方法可以自由地被来自不同包的不同类使用。（然而，AS3.0 语言的一个奇怪特性是，构造方法只能永远是公共的。）\n\n这里有一个新东西是`function`关键字。\n\
  \n```\npublic function HelloWorld()\n{\n}\n```\n\n它告诉 Flash 你正在创建一个**函数定义**。函数定义就是执行动作的块语句。它们在你的程序中完成所有工作。你可以将函数定义想象成尽职的仆人，一旦你召唤他们，他们就会按照预先安排的杂务清单立刻行动起来。构造方法将始终是你创建类时编写的第一个函数定义，它有一个特殊的任务：一旦类被调用，并且在任何你可能使用的其他方法开始工作之前，立即运行它包含的任何动作。构造方法有点像首席仆人，天刚亮就起床，把所有其他仆人叫下床，在你还没找到拖鞋之前，就用一壶新沏的茶和早报来迎接你。\n\
  \n关于构造方法，你最后应该注意到的是方法名后面的括号，这里用粗体突出显示：\n\n`HelloWorld()`\n\n这些空的括号允许你在方法需要时，为其提供额外的信息，称为**参数**。你很快就会详细了解方法参数，但就目前而言，你只需要知道在创建函数定义时必须提供一对括号，即使这些括号是空的。\n\
  \n\n### 对齐代码\n\n你可能已经注意到代码格式中有一个有趣的模式正在形成。就像一套空心木制俄罗斯套娃一样，`HelloWorld` 构造方法位于 `HelloWorld`\
  \ 类内部，而该类又位于 `package` 块语句内部。每个项目都位于外层项目的一对花括号内，现在你有了三个层次的块语句。判断一个块语句在哪里结束、另一个从哪里开始的唯一方法，就是看块语句的花括号是打开还是闭合。\n\
  \n正如你所见，这很容易导致花括号产生混乱的纠结。如果你不能完全确定哪对花括号属于哪个块语句，你就可能在错误的地方添加新代码，并在尝试运行程序时遇到各种错误。\n\
  \nFlash Builder 自动为你做的代码格式化，在一定程度上有助于解决这种潜在的混乱。我建议你在本书的项目中使用这种格式化风格。图 1-23 展示了你可以在一个块语句的开括号和闭括号之间画一条假想的线。它非常清晰地显示了你应该在哪个缩进级别添加代码。\n\
  \n![图片](img/9781430239922_Fig01-23.jpg)\n\n**图 1-23.** 通过保持每个块语句的开括号和闭括号沿一条假想线对齐，你可以确保在正确的位置添加代码。\n\
  \n从图 1-23 可以清楚地看到，`import` 语句是 `package` 的一部分，而不是类的一部分。你还可以看到，构造方法是类的一部分，因为它包含在类的花括号内。这要归功于缩进。\n\
  \n还有另一种可视化代码组织方式的方法。我一直在大量使用“块语句”这个术语。这个术语实际上非常具体地描述了如何使用缩进和花括号来组织代码。你可以把每一对花括号想象成一个空盒子或块。每次你创建另一个带有自己花括号对的语句时，你就在第一个块内部创建了一个新块。图\
  \ 1-24 展示了到目前为止你在程序中创建了三个代码块。每个块都嵌套在另一个块内部。\n\n![图片](img/9781430239922_Fig01-24.jpg)\n\
  \n**图 1-24.** 每一对花括号包含一个代码块。块可以包含其他块。\n\n编写代码时一个常见的困惑是不确定一个块语句在哪里结束，另一个在哪里开始。如果你使用这种建议的格式，并在编写时能看到这些假想的划分，这将真正帮助你防止意外地在错误的地方添加一行代码。\n\
  \n如果你在使用 Flash Builder，你可以使用其“大纲”窗口来查看程序中的所有代码块，以及你当前正在哪个块中工作。你可以在代码编辑窗口的左下方找到“大纲”窗口。图\
  \ 1-25 展示了如果你已按照本章的指示操作到现在，你的“大纲”窗口会是什么样子。\n\n![图片](img/9781430239922_Fig01-25.jpg)\n\
  \n**图 1-25.** “大纲”窗口显示了你程序中的所有代码块。\n\n“大纲”窗口清晰地显示你有三个块：`package`、类定义和构造方法。它甚至还添加了一些可爱的小图标来示意它们。`import`\
  \ 语句是 `package` 块的一部分，因为它处于相同的缩进级别。\n\n“大纲”窗口和代码编辑窗口是关联的。如果你点击“大纲”窗口中的一个块，代码编辑窗口会高亮显示同一个块，反之亦然。例如，如果你点击“大纲”窗口中的构造方法块，代码编辑窗口中的构造方法也会被高亮显示，如图\
  \ 1-26 所示。\n\n![图片](img/9781430239922_Fig01-26.jpg)\n\n**图 1-26.** 如果你在“大纲”窗口中选择一个代码块，编辑窗口中相同的代码块会被高亮显示，反之亦然。\n\
  \n在长程序或复杂程序中，你可以使用“大纲”窗口快速找到你想要处理的代码块。\n\n### 指令是什么？\n\n你的程序需要的下一段代码是一条**指令**。计算机编程的一大乐趣在于能够像你是自己个人银河游轮的船长一样，随意抛出诸如“构造方法”和“指令”这样的术语。很简单，指令是你要程序执行的单个操作。它告诉你的程序：“现在就做这个！”方法由一个或多个指令组成，有了它们，程序就活了起来。\n\
  \n4. 你将添加到构造方法中的指令将告诉程序，在程序运行时在控制台窗口中显示“Hello World!”字样。将以下粗体文本添加到你的程序中：\n\n```\n\
  package\n{\n  import flash.display.Sprite;\n\n  public class HelloWorld extends\
  \ Sprite\n  {\n    public function HelloWorld()\n    {\ntrace(\"Hello World! Can\
  \ you read this?\");\n    }\n  }\n}\n```\n\n你的代码编辑窗口现在应该看起来像图 1-27。\n\n![图片](img/9781430239922_Fig01-27.jpg)\n\
  \n**图 1-27.** 将新的 `trace` 方法添加到你的代码中。它会显示引号内位于其括号之间的任何文本。\n\n这是你编写的新代码行：\n\n```\n\
  trace(\"Hello World! Can you read this?\");\n```\n\n这被称为**trace 方法**。这是一种特殊的指令，告诉你的程序在调试时将括号内的任何内容发送到\
  \ Flash Builder 的控制台窗口。你还没看到控制台窗口，但很快你就会看到了！在这个例子中，`trace` 方法会将“Hello World! Can\
  \ you read this?”这些文字发送到控制台窗口。这里的关键词是 `trace`。\n\n如果你想使用 `trace` 向控制台窗口发送一些文本，该文本需要用引号括起来。AS3.0\
  \ 有很多内置方法，比如 `trace`，你可以用它们来做各种有趣的事情，并且你将在本书的过程中详细了解其中的许多方法。\n\n指令以分号（`;`）结尾。分号是一个基本的标点符号，让程序知道“指令结束了！执行这个任务！”它就像句子末尾的句号。每当你看到一行代码末尾有分号，你就知道这是一条指令。它告诉程序执行一个特定的操作。你之前在那行从库中导入\
  \ `Sprite` 的代码中也使用了分号。那行代码也是一条指令。\n\n*如果你忘记在指令末尾添加分号，Flash Builder 会宽宏大量地假设你本意是要加一个。没有分号，你的程序仍然可以完美运行。谢谢你，Flash\
  \ Builder！但为了良好的编程风格，你应该始终添加分号。如果你以后学习其他不那么宽容的编程语言（大多数都不宽容），你将已经养成了一个优秀的习惯。*\n\n\
  图 1-28 展示了在运行和调试程序时，`trace` 如何工作以在控制台窗口中显示文本，这是你在接下来的步骤中将要做的。\n\n![图片](img/9781430239922_Fig01-28.jpg)\n\
  \n**图 1-28.** 在运行和调试程序时，使用 `trace` 方法在控制台窗口中显示文本。\n\n但是，现在先别去控制台窗口找那段文字！直到你调试程序时才会看到它。你将在接下来的步骤中做这件事。\n\
  \n\n\n### 为代码添加注释\n\n在查看程序实际功能之前，我们先为它增加一个新特性：**注释**。编写计算机程序时，经常需要为某段代码的功能写下简短说明。当你解决了一个复杂的编程问题，不确定下次再看代码时是否能理解时，注释尤其有用。它也能帮助其他可能阅读你代码的人更好地理解。\n\
  \n添加注释有两种方式。第一种是使用两个正斜杠（`//`）。在这两个正斜杠之后同一行添加的任何文本，都不会被 AS3.0 解释为编程代码。你可以写任何你喜欢的内容；程序运行时这些内容会被忽略。示例如下：\n\
  \n```\n//Hi mom!! This is a comment. You can write whatever you like here.\n```\n\
  \n有时你可能想写一段无法轻松塞进一行的长注释。这时可以创建**多行注释**。多行注释的写法如下：\n\n```\n/*\nAnything between the\
  \ opening and\nclosing multiline comment characters\nwill not be interpreted as\n\
  programming code.\n*/\n```\n\n多行注释以字符序列 `/*` 开头，以字符序列 `*/` 结尾。你可以在它们之间任意多行上写任何内容。\n\
  \n除了给自己留笔记，注释在你想测试程序在缺少某些代码时的行为时，也非常适合用于禁用代码段。\n\n1. 为了熟悉使用注释，在你的程序中添加一条注释。用以下粗体行修改你的代码：\n\
  \n```\npackage\n{\n  import flash.display.Sprite;\n\n  public class HelloWorld extends\
  \ Sprite\n  {\n    public function HelloWorld()\n    {\n      //The next line displays\
  \ some text\n      trace(\"Hello World! Can you read this?\");\n    }\n  }\n}\n\
  ```\n\n在继续之前，确保你的程序看起来如图 1-29 所示。\n\n![图片](img/9781430239922_Fig01-29.jpg)\n\n**图\
  \ 1-29.** 在代码中添加一条注释。\n\nActionScript 编辑器窗口将注释显示为绿色，以便你轻松将其与编程代码区分开。\n\n2. 最后，如果一切正常，保存\
  \ `HelloWorld.as` 文件。\n\n现在你已经准备好查看程序运行的结果了。\n\n### 运行程序并编译 SWF 文件\n\n到目前为止，你只处理了一个文件，即\
  \ `HelloWorld.as` 文件。这是你的 ActionScript 程序，它被称为 AS 文件。这是你完成所有工作的文件，但它并非最终产品。\n\n\
  你的最终产品将是一个 SWF 文件。这是一个扩展名为 `.swf` 的文件。它是在 Web 浏览器的 Flash Player 中运行的文件，也是你可以上传到互联网或与他人共享的文件。创建\
  \ SWF 文件的行为被称为*编译*它。（这也被称为*构建*它，Flash Builder 正是由此得名。）\n\n在 Flash Builder 中有两种编译\
  \ SWF 文件的方法。\n\n* 你可以从 Flash Builder 的主菜单中选择“运行”![图片](img/arrow.jpg) “运行”，或点击工具栏中的绿色播放图标。执行此操作时，Flash\
  \ Builder 会为你构建 SWF 文件到项目目录的 `bin-debug` 文件夹中，然后在 Flash Player 中启动它。\n* 你可以从主菜单中选择“运行”![图片](img/arrow.jpg)\
  \ “调试”，或点击工具栏中的小甲虫图标。这是一个更好的选择。它执行的操作与普通“运行”命令相同，但还会打开“控制台”窗口。“控制台”窗口会显示你在程序中使用的所有\
  \ `trace` 指令。它还会在“问题”窗口中给出错误消息，告诉你程序中是否犯了一些错误。当你选择“调试”选项时，它实际上会运行程序并启动调试器。一箭双雕！\n\
  \n在制作游戏时，你几乎只会使用“调试”选项，因为它在“控制台”和“问题”窗口中提供的信息极其有用。让我们通过调试程序并观察会发生什么来了解这点！\n\n*从现在起，我将把调试选项称为**编译**。每当我在本书中要求你编译程序时，请点击那个小甲虫按钮。*\n\
  \n1. 从主菜单中选择“运行”![图片](img/arrow.jpg) “调试”，或点击工具栏中的小甲虫图标，如图 1-30 所示。Flash Builder\
  \ 可能会询问你是否要在继续之前保存工作。如果你之前已经为此程序运行过调试器，它可能会询问你是否要终止任何现有的调试会话。在这两种情况下，都点击“确定”按钮。它还可能会询问你是否要打开\
  \ Flash Builder 的**调试透视图**。如果是，请选择“否”。（你将在本章末尾附近了解什么是调试透视图以及如何切换到它。）\n\n![图片](img/9781430239922_Fig01-30.jpg)\n\
  \n**图 1-30.** 选择两种编译程序的方式之一。\n\n如果 Flash Builder 安装正确，并且你严格按照本章的所有说明操作，将会发生以下情况：\n\
  \n* Flash Builder 将启动一个 Flash Player 窗口。它会是空白的。这完全没问题，本就该如此！（如果你没有在“项目属性”面板中取消选中“生成\
  \ HTML 包装文件”选项，则会打开一个空白网页。请参阅本章开头附近的“告诉 Flash Builder 在 Flash Player 中运行你的程序”一节来防止这种情况发生。）\n\
  * Flash Builder 还将打开“控制台”窗口。你应该会在“控制台”窗口中看到“Hello World! Can you read this?”字样。图\
  \ 1-31 展示了你应该看到的内容。“控制台”窗口还会显示一些技术信息，确认它已创建了 SWF 文件，即你的最终作品。\n\n![图片](img/9781430239922_Fig01-31.jpg)\n\
  \n**图 1-31.** 编译你的程序，并在“控制台”窗口中查看结果。\n\n如果你编译程序时发生了这种情况，那么恭喜你，你已经编程并运行了你的第一个计算机程序！如果这没有发生，而你收到了一些无法理解的奇怪错误消息，请继续阅读，看看能否找出问题所在。\n\
  \n\n\n当你编译程序时发生了什么\n\n我们暂时假设你的程序完美运行，你看到了我在上一节中描述的结果，并且没有收到任何错误消息。以下是实际发生的情况：\n\n\
  当你点击调试（Debug）按钮时，Flash Builder 会将你的程序发送给一个名为**编译器**（compiler）的组件。编译器是 Flex SDK 中的一个软件，它的任务是将\
  \ AS3.0 代码转换为可在 Flash Player 中查看的 SWF 文件。同时，它还会检查你的代码中是否存在错误。如果有错误，它会发出警告；如果错误严重，则会阻止代码运行。\n\
  \n但如果代码运行正常，那么编译器会在控制台（Console）窗口中显示你的`trace`消息，并在`HelloWorld`项目目录的`bin-debug`文件夹中为你创建一个\
  \ SWF 文件。让我们验证一下它是否真的做到了。打开你的`bin-debug`文件夹查看一下。你的`HelloWorld`项目目录应该类似于图 1-32。\n\
  \n![Image](img/9781430239922_Fig01-32.jpg)\n\n**图 1-32.** 当你编译程序时，AS3.0 编译器会在项目文件夹中为你创建一个\
  \ SWF 文件。\n\n你感兴趣的是`HelloWorld.swf`文件。与你的项目同名的 SWF 文件将包含你在后续章节中制作的最终游戏。\n\n但该目录下还有几个其他的文件和文件夹。它们对于本书中的任何项目都不是必需的，它们都是所谓的\
  \ **HTML 包装器**（HTML wrapper）的一部分。如果你希望将任何项目上传到互联网，这些文件是你需要的。即使你已告诉 Flash Builder\
  \ 不要生成 HTML 包装器，这些文件仍然会被创建，只不过 Flash Builder 不会用它们来在网页浏览器中启动你的程序。让我们看看这些文件的作用——它们可能在某些时候对你有用。\n\
  \n*   **`HelloWorld.html`**：这是一个 HTML 文件（一个网页），当你运行和调试程序时，编译器会自动为你生成它。它包含播放 SWF\
  \ 文件的代码。你可以使用这个 HTML 文件以及此目录中的其他文件，作为创建可发布到互联网的网页的基础，以便其他人能玩你的游戏。\n*   **`swfObject.js`**：这是一个\
  \ JavaScript（JS）文件，它负责将 SWF 文件嵌入到 HTML 页面中，并检查通过互联网查看你游戏的用户是否安装了 Flash Player。\n\
  *   **`playerProdcutinstall.swf`**：这是一个 Flash 应用程序，如果用户当前的 Flash Player 版本与你的游戏不兼容，它会提示用户下载最新版本。\n\
  *   **`History`**：此文件夹包含专门的代码，允许用户使用浏览器的前进和后退按钮来导航你的游戏或网页应用程序。\n\n详细介绍如何为网络发布 HTML\
  \ 文件已超出了本书的范围，但理论上，你只需要将这五个文件和`History`文件夹上传到一个网址（URL），世界上的任何人都能玩你的游戏。你可以在 Adobe\
  \ 网站上找到更多关于 Flash Builder 的 HTML 包装器的信息，网址是：\n\n`http://help.adobe.com/en_US/flashbuilder/using/index.html`\n\
  \n以上就是当一切正常工作时你会看到的情况。但万一……\n\n### 它没起作用怎么办？\n\n可能有一小部分不幸的读者没有看到图 1-31 所示的输出。事实上，如果这是你第一次进行任何计算机编程，那么你几乎肯定会在某个地方犯一个小错误，从而阻止程序正常运行。别灰心！有很多可能出错的地方，而能够找出问题所在是学习过程中至关重要的一部分。\n\
  \n如果这是你第一次使用 Flash Builder 编译程序，那么很有可能 Flash Builder 没有正确安装，或者你没有安装调试版本的 Flash Player。如果你看到一条错误消息说“Installed\
  \ Flash Player is not a debugger”，那么这很可能就是原因。请按照本章开头“使用 Flash Builder”部分的说明来解决这个问题。\n\
  \n如果 Flash Builder 安装正确，那么只需仔细检查你编写的代码，问题就能轻松解决。首先，当你点击调试按钮时，你可能会看到一个名为“Errors in\
  \ Workspace”的对话框，如图 1-33 所示。\n\n![Image](img/9781430239922_Fig01-33.jpg)\n\n**图\
  \ 1-33.** 编译程序时，Flash Builder 会告诉你代码中是否存在问题。\n\n如果你看到这个对话框，请点击取消（Cancel）。这一点很重要，因为如果你点击继续（Proceed），即使代码中存在错误，Flash\
  \ Builder 仍会尝试创建 SWF 文件。这可能会让你错误地认为你的程序运行正常，而实际上并非如此。在一个有数百行代码的复杂游戏项目中，这可能会让你忽视代码中的错误，而这些错误最终会表现为难以解决或检测的复杂\
  \ bug。\n\n取消 SWF 的启动后，请查看 Flash Builder 工作区底部的“Problems”窗口。Problems 窗口会告诉你它认为你的代码中有多少个错误。点击“Errors”旁边的小三角形，你会看到一个列表，详细列出\
  \ Flash Builder 认为的问题所在。图 1-34 展示了一个例子。\n\n![Image](img/9781430239922_Fig01-34.jpg)\n\
  \n**图 1-34.** 点击 Problems 窗口中“Errors”旁边的三角形，可以查看程序中可能存在的错误。\n\n我可以向你保证，它告诉你的内容在你看来可能完全是天书！你需要花费大量时间使用\
  \ Flash Builder，才能逐渐理解这些错误信息试图告诉你什么。然而，“语法错误”（syntax error）这个术语很重要。它意味着你编写了一些 AS3.0\
  \ 语言无法理解的代码。这是 AS3.0 在说：“啊？”。这通常表明你打错了字或拼写错了某个东西。也可能意味着你忘记打开或关闭某个花括号或圆括号。或者你只是不小心遗漏了某些内容。这些消息的另一件令人困惑的事情是，Flash\
  \ Builder 实际上并不知道问题出在哪里。错误信息很模糊。它们通常不会指向真正的问题所在，因此你必须运用你的推理能力来找出可能出错的地方。\n\n但 Flash\
  \ Builder 不会只给你留下模糊的错误信息；它会指出它认为问题存在于代码的哪个位置。如果你查看编辑器窗口的左侧，你会看到一个带有 X 的小红圈。Flash\
  \ Builder 认为问题出在那行代码上。图 1-35 展示了一个例子。\n\n![Image](img/9781430239922_Fig01-35.jpg)\n\
  \n**图 1-35.** Flash Builder 会指出可能存在错误的代码行。\n\n\n\n*注意：如果遇到一个不太严重但最好修复的小问题，Flash\
  \ Builder 会用一个三角的黄色警告标志来提示你。这不会影响程序的正常运行，但如果放任不管，后续可能会引发更严重的问题。*\n\nFlash Builder\
  \ 高亮显示的那一行代码是一个重要线索！然而，这也很容易产生误导，因为 Flash Builder 只是指出了它无法理解你代码的那个位置。通常，真正的问题出现在*紧挨着这一行之前的位置*。\n\
  \n这可能会让人困惑！这里有个更具体的例子：想象你在森林里散步，被树根绊倒，头撞到了石头上。Flash Builder 会指出石头是问题所在。但你知道，真正的问题是那根树根。\n\
  \n仔细看看图 1-35，并将其与你在上一节中编写的最终代码进行比较。Flash Builder 指向的那一行看起来有什么问题吗？不，它完全没问题。\n\n但看看紧挨着它的上一行。它看起来是这样的：\n\
  \n`public function HelloWorld(`\n\n你发现什么问题了吗？是的！缺少了右括号。这行代码应该是这样的：\n\n`public function\
  \ HelloWorld()`\n\n这类简单的错误非常容易犯，尤其是在你刚开始学习编程，对这一切都还完全不熟悉的时候。\n\n但是，Flash Builder\
  \ 并没有告诉你这就是问题所在。它指向的是它撞到的石头，而不是绊倒它的树根。不过，它确实为你指明了查找的方向。如果你修复了这段代码并再次调试程序，程序就会完美运行，所有的错误信息都会消失。\n\
  \n不幸的是，编译器并不知道你希望你的代码做什么；它只能告诉它期望什么以及它不理解什么。如果运气好，它能精确定位问题所在。但更多时候，它只是给你一个大致的查找方向和线索。这有点像两岁小孩指着自己的大脚趾喊疼。你知道问题出在那里，但究竟是图钉扎了、被蜜蜂蜇了，还是仅仅另一种“上次我这样做你给了我巧克力”的说法，补救措施则取决于经验、审慎的调查和周密的诊断。你需要自己明智地去分析，错误信息试图告诉你什么，以及你可能需要修复或更改什么，才能让程序正常运行。\n\
  \n如果不确定程序的问题出在哪里，问问自己是否可能遇到了以下一个或多个问题：\n\n-   所有内容的拼写和大小写是否正确？\n-   文件是否保存在正确的位置？文件夹和文件的拼写及大小写是否与包名和类名匹配？（如果你使用的是\
  \ Flash Builder，通常不会有这个问题，因为它会自动处理这些事情；但使用其他 IDE 则可能发生。）\n-   所有 AS3.0 关键字（例如 `import`、`package`\
  \ 和 `function`）是否显示为蓝色或紫色？如果某个关键字不是这种颜色，那就清楚地表明你可能拼写或大小写有误。\n-   是否闭合了所有的花括号和圆括号？\n\
  -   你去厨房再倒一杯咖啡时，你的猫有没有跳到键盘上？\n\n下面还有一些在调试程序时需要时刻牢记的通用指导原则：\n\n-   如果收到多条错误信息，总是先修复第一条。后续的错误通常是由于部分代码依赖于前面的代码段正确运行所致。修复第一个错误，修正效果会级联传递，通常能奇迹般地修复其余错误。\n\
  -   检查*紧挨着 Flash 认为出问题的代码行的上一行*。通常，上一行的小错误自身可能不足以产生编译错误，但却足以导致下一行代码出错。\n-   *在重新编译之前，一定要保存正在编辑的\
  \ AS 文件！*我必须强调，忽视这一点是常见疏忽。程序员发现并修复了一个错误，但重新发布 SWF 文件时却得到完全相同的错误信息。这是因为修复后没有保存文件，Flash\
  \ 实际编译的是之前保存的旧版本文件。如果你使用 Flash Builder，这不是问题，因为它会在尝试运行代码前自动为你保存 AS 文件；但大多数其他 IDE\
  \ 不会这样做。\n-   在重新编译并测试程序之前，只做一处修改。如果你的程序之前运行正常，但在做了这次修改后突然停止工作，那么你就确切知道是什么导致了问题。如果你一口气做了五处修改后才运行和调试，程序出了问题，你就无法知道是这五处中的哪一处导致了故障。\n\
  -   最后，程序员的普适法则：尽早测试，频繁测试。多做测试，尽早解决大量微小的、可控的问题，以避免日后不得不处理那些能使项目停滞不前的巨大棘手问题。\n\n\
  除少数特殊情况外，这是本书最后一次对调试问题进行如此详细的讨论。从这以后，你就得靠自己了，但你越早获得调试自己代码的实践经验就越好。在这一领域，经验决定一切，而没有一个比棘手的调试问题更能磨砺你编程技能的磨刀石了。\n\
  \n另外，要习惯使用“问题”窗口——你会经常用到它！它将成为你查找和追踪问题时最亲密的盟友。\n\n\n\n#### 常见错误消息\n\n本节列出了一些在初次调试时可能遇到的常见错误消息，并针对问题可能的原因给出了建议。\n\
  \n- `1087：语法错误：程序结束后发现额外字符。`  \n  您可能忘记打开或关闭某个花括号。\n- `1116：用户定义的命名空间属性只能在类定义的顶层使用。`\
  \  \n  您在类定义中拼错了一个关键字。例如，将“public”拼成了“pulbic”。\n- `1071：语法错误：在属性 public 之后应为定义关键字（如\
  \ function），但实际为 clas。`  \n  您将单词“class”拼写成了“clas”。当拼错关键字时，通常会出现此错误。\n- `1084：语法错误：在\
  \ exteds 之前应包含左花括号。`  \n  您拼错了单词“extends”。\n- `1017：未找到基类 Sprie 的定义。`  \n  您拼错了单词“Sprite”。\n\
  - `1017：未找到基类 Sprite 的定义。`  \n  您拼错了以下代码行中的某个单词，例如“flash”或“display”：  \n  `import\
  \ flash.display.Sprite;`  \n  您也可能遗漏了单词之间的某个点号。\n- `1114：public 属性只能在包中使用。`  \n\
  \  您可能拼错了单词“package”。\n- `1153：构造函数只能声明为 public。`  \n  您在构造函数方法中拼错了单词“public”。\n\
  - `1071：语法错误：在属性 public 之后应为定义关键字（如 function），但实际为 functon。`  \n  您拼错了单词“function”。\n\
  - `在源路径‘HelloWorld’中找到的文件，其名称必须与文件‘HeloWorld’内部的类定义名称相同。`  \n  您在类定义中将“HelloWorld”拼写成了“HeloWorld”。\n\
  - `1008：函数‘HeloWorld’的返回值没有类型声明。`  \n  您在构造函数方法中将“HelloWorld”拼写成了“HeloWorld”。\n\
  - `1084：语法错误：在左花括号之前应包含标识符。`  \n  您忘记关闭一个括号。\n- `1180：调用了可能未定义的方法 trae。`  \n  您将“trace”拼写成了“trae”。\n\
  - `1084：语法错误：在分号之前应包含右括号。`  \n  您忘记关闭一个括号。\n\n别被这些错误消息吓到！您很快就会理解它们想要传达的信息，通过仔细检查代码，您总能找到问题的根源。\n\
  \n#### 对照原始源文件确认程序\n\n如果您对本书中的任何代码有疑问，可以下载我编写的原始源文件，并与您的代码进行核对。您可以从本书的下载页面 [`www.apress.com`](http://www.apress.com)\
  \ 下载这些文件。打开您正在学习的章节的文件夹，您会发现文件夹和文件的组织结构与我书中所描述的一致。您可以在 Flash Builder 中直接打开任何单个文件，或者将整个文件夹作为\
  \ Flash Builder 项目打开。\n\n要将源文件作为项目打开，请从主菜单中选择“文件”![图片](img/arrow.jpg)“导入 Flash Builder\
  \ 项目”。会打开一个新对话框，询问您是要导入文件还是项目文件夹。选择“项目文件夹”，然后点击“完成”。该项目将被导入到 Flash Builder 中，之后您就可以像运行和调试自己的程序一样，对它进行运行和调试。\n\
  \n如果您要导入的项目文件夹与 Flash Builder 中当前打开的项目同名，请在导入之前重命名该项目文件夹。\n\n### 关于 Flash Builder\
  \ 的更多信息\n\nFlash Builder 是一款复杂的软件，包含的功能远多于您平时可能用到的。让我们快速了解一下其中一些最实用的功能。\n\n####\
  \ 编辑窗口的特性与怪癖\n\nActionScript 编辑窗口有一些高级功能，不幸的是，对于初学者来说，如果您不了解它们，这些功能可能会导致一些令人沮丧的怪现象。它们可能让您的工作看起来好像消失了，或者无法正常运行。然而，随着经验积累，您会发现这些功能其实非常有用。\n\
  \n##### 折叠代码\n\n首先，编辑窗口允许您*折叠*代码。请看窗口最左侧，您会看到一些小的减号。每个代码块旁边都有一个减号。如果您点击其中一个减号，该代码块就会折叠成一行。看起来您的代码完全消失了，但实际上并没有。点击代码块旁边新出现的加号，您的代码就会再次显示出来。如果您正在处理一个非常长的程序，并希望暂时隐藏部分代码以免干扰您处理其他部分，这个功能就很有用。图\
  \ 1-36 对此进行了说明。\n\n![图片](img/9781430239922_Fig01-36.jpg)\n\n**图 1-36.** 如果您想清理编辑窗口的杂乱，可以折叠当前不处理的代码块。\n\
  \n\n\n### 断点\n\n如果你正在处理一个复杂的程序，只想测试其中一部分而非全部，可以在代码中添加一个**断点**。添加断点后，代码将在该位置停止运行。如果你知道后面某处存在错误，但只想测试到确认无误的代码段为止，这非常有用。\n\
  \n不过，如果不经意地在左侧边距上双击，也很容易意外地添加断点。作为初学者，你可能不会注意到这些断点的存在，只会发现程序无法正常运行。虽然不会收到任何错误提示，但程序似乎会在中途停止。如果遇到这种情况，请检查并确保没有意外添加任何断点，如果有则将其删除。\n\
  \n通过在编辑窗口的左侧边距上双击，即可在代码中添加断点。你会看到出现一个蓝色的小圆点，如图 1-37 所示。\n\n![图片](img/9781430239922_Fig01-37.jpg)\n\
  \n**图 1-37.** 在代码中添加断点将使其在断点处停止运行。这对于检查代码中哪些部分正常工作、哪些部分有问题非常有用。\n\n添加断点后，当运行并调试代码时，程序会在该处停止。这意味着它不会执行紧随其后的跟踪语句，你将在控制台窗口中只看到一条消息，提示\
  \ SWF 文件已创建。\n\n要移除断点，只需再次双击它。完成此操作后，重新运行并调试程序，程序应能顺利执行完毕。\n\n然而，有时你可能想利用断点来检查哪些代码段工作正常，哪些有问题。在这种情况下，可以保留断点，并打开“断点”视图窗口。通过选择“运行”\
  \ ![图片](img/arrow.jpg) “调试” ![图片](img/arrow.jpg) “其他” 可以使“断点”视图可见。此时会打开一个新的“显示视图”窗口。打开“调试”文件夹，选择“断点”，然后单击“确定”按钮，如图\
  \ 1-38 所示。\n\n![图片](img/9781430239922_Fig01-38.jpg)\n\n**图 1-38.** 显示“断点”视图窗口以帮助管理断点。\n\
  \n现在，Flash Builder 工作区底部会出现一个新的“断点”窗口，如图 1-39 所示。其中将显示代码中的所有断点。\n\n![图片](img/9781430239922_Fig01-39.jpg)\n\
  \n**图 1-39.** 显示“断点”窗口以查看代码中断点的位置。\n\n“断点”窗口的右上角自带菜单栏。你可以通过取消勾选来停用某个断点。如果双击某个断点，代码编辑窗口中的光标将跳转到你添加该断点的位置。你可以选中断点，然后单击菜单栏中的\
  \ X 按钮来移除它们。其中许多选项同样可以在 Flash Builder 的“运行”菜单中找到。\n\n如果在带有断点的情况下运行和调试代码，并且想查看程序从该点继续执行会发生什么，可以选择“项目”菜单中的“恢复”命令，如图\
  \ 1-40 所示。\n\n![图片](img/9781430239922_Fig01-40.jpg)\n\n**图 1-40.** 从断点处恢复运行，可显示程序从该点继续执行后的情况。\n\
  \n在同一个“运行”菜单中，你还可以*单步跳过*断点。如果你在某一行（你认为包含错误的那一行）设置了断点，并希望在不执行该行的情况下测试程序，这一功能就很有用。它会从程序中忽略有疑问的那一行，并显示没有该行时程序将如何运行。\n\
  \n断点还有一些更高级的功能，比如设置条件断点。你可以在 Adobe Flash Builder 文档中“Flash Builder 中的调试工具”一章找到更多相关信息，网址为：\n\
  \n`http://help.adobe.com/en_US/flashbuilder/using/index.html`\n\n当你开始编写冗长、复杂的程序时，就会逐渐体会到断点在帮助测试以及将代码中正常工作部分与问题部分区分开来时有多么实用。断点是必不可少的调试工具。\n\
  \n### 透视\n\nFlash Builder 有一个名为**透视**的功能，它可以改变工作区中窗口的排列方式。如果你刚安装并开始使用 Flash Builder，很可能使用的是名为\
  \ **Flash** 的透视。Flash 透视以我在本书中描述的方式排列工作区，即编辑窗口左侧为包资源管理器和大纲窗口，底部为控制台和问题窗口。\n\n没有理由更改这个透视，但了解如果你愿意，是完全可以更改的，这一点很重要。此外，在探索\
  \ Flash Builder 的过程中，你可能意外切换了透视，导致无法回到我一直介绍的标准 Flash 透视。\n\nFlash Builder 工具栏的右上角有用于切换透视的按钮，如图\
  \ 1-41 所示。\n\n![图片](img/9781430239922_Fig01-41.jpg)\n\n**图 1-41.** 通过切换透视来改变 Flash\
  \ Builder 工作区中窗口的排列方式。\n\n当前选中的透视将通过凹陷的按钮显示。图 1-40 显示当前选中的是 Flash 工作区。如果选择 Flash\
  \ 调试透视会怎样？图 1-42 展示了它的外观。\n\n![图片](img/9781430239922_Fig01-42.jpg)\n\n**图 1-42.**\
  \ Flash 调试透视\n\n所有用于解决问题和调试程序的窗口都以合理的布局呈现，且易于访问。“断点”窗口位于右上角，此外还有两个新窗口：“变量”和“表达式”。\n\
  \nFlash Builder 还包含许多其他透视。你可以通过单击“打开透视”按钮，然后单击“其他”来找到它们，如图 1-43 所示。\n\n![图片](img/9781430239922_Fig01-43.jpg)\n\
  \n**图 1-43.** 如果需要，有许多透视可供选择。\n\n你应该了解这些透视的存在，但在完成本书的项目时，很可能不需要用到它们。\n\n另一个需要记住的问题是，如果你双击任何窗口的标题栏，它将会展开至充满整个工作区。再次双击它即可使其缩小。\n\
  \n### 创建程序的干净编译\n\n有时你编译程序时，尽管没有出现错误消息，但程序的行为似乎并不符合预期。你对程序所做的最近更改似乎没有生效，而且你完全找不到代码中的错误。\n\
  \n如果发生这种情况，你需要通过对程序进行干净编译来重置编译器。为此，请选择“项目” ![图片](img/arrow.jpg) “清理”。选择要清理的项目，然后单击“确定”按钮。编译器将从头开始重新编译你的程序。\n\
  \n\n\n#### 创建 SWF 文件的发布版本\n\n当你的程序或游戏完全完成后，最好创建一个**发布版本**。这个 SWF 文件比你在运行和调试程序时创建的\
  \ SWF 文件体积略小。体积更小的原因是它不包含任何调试信息或 `trace` 语句。发布版本的 SWF 应该是你的最终产品。\n\n要创建发布版本的 SWF\
  \ 文件，请从 Flash Builder 的主菜单中选择 `项目` ![Image](img/arrow.jpg) `导出发布版本`。系统将打开一个新窗口，其中包含一些你很可能永远不需要更改的选项。点击\
  \ `完成` 按钮，Flash Builder 就会为你生成 SWF 文件。\n\n完成后，你会在项目文件夹中一个名为 `bin-release` 的文件夹里找到发布版\
  \ SWF，如图 Figure 1-44 所示。\n\n![Image](img/9781430239922_Fig01-44.jpg)\n\n**图 1-44.**\
  \ 创建一个发布版 SWF，其体积小于调试过程中创建的 SWF 文件。\n\n### 关于 AS3.0 和 Flash Player 的更多内容\n\n在这一过程结束时，你会得到一个\
  \ SWF 文件。只要同一台电脑上也安装了 Flash Player，你就可以将它带到任何电脑上运行。SWF 文件需要借助 Flash Player 才能运行，这一事实非常重要。作为游戏设计师，你需要知道为什么会这样，以及这可能给你带来哪些限制。让我们更深入地看看发布\
  \ SWF 文件时后台究竟发生了什么。\n\nAS3.0 是一种**高级编程语言**。像 Java、C++ 和 Visual Basic 这样的高级编程语言，是为了方便人类轻松阅读、编写和理解而设计的。它们使用真正的英语词汇，例如\
  \ `function` 和 `class`，并使用英语语法元素，如引号和分号。但计算机并不理解英语。如果你今晚试图请电脑帮你洗碗，我猜你只会得到一片沉默。（如果不是这样，请务必告知相关人员，最好是专业人士！）\n\
  \n在最基本的层面上，计算机只理解由 1 和 0 组成的二进制语言。所有 AS3.0 代码都必须被翻译成二进制代码，计算机才能理解。幸运的是，你不需要手动完成这项工作，所以可以收起笔和纸了。Flash\
  \ 内置了一个编译器（一种翻译代码的软件组件）来为你完成这个任务。\n\n请记住，与用 C++ 或 Visual Basic 等语言编写程序不同，Flash 的编译器不会将你的代码编译成计算机中央处理器（CPU，即计算机的主要“大脑”）可以直接读取的形式。它编译代码的目的仅仅是让\
  \ Flash Player 软件能够读取。\n\n在运行任何 AS3.0 程序之前，你的系统上必须安装 Flash Player 软件，因为 Flash Player\
  \ 的职责就是向 CPU 解释你的代码。正因如此，AS3.0 和 Java 一样，被称为**解释型编程语言**。解释型语言使用一种称为**虚拟机**的软件，它在\
  \ CPU 和你的程序之间充当解释器。Flash Player 就是 AS3.0 的虚拟机。\n\n与直接编译到 CPU 的语言相比，解释型语言有许多优势。最重要的是，这意味着你的程序可以在任何安装了\
  \ Flash Player 的操作系统（Windows、Linux 或 Mac OS X）上完美且完全一致地运行。你只需编写一次代码，而为了每个可用操作系统编写的\
  \ Flash Player 会负责确保你的代码正确运行。另一个优势是，Flash Player 保护其运行的计算机免受你可能编写的、意外导致系统冻结或崩溃的代码的影响。所有这些都使得解释型语言成为非常方便和可靠的编程语言。\n\
  \n然而，解释型语言的一个主要缺点在于性能方面。**性能**是一个计算机术语，基本上是指你的程序运行效率或速度。想象一下去一个你不会说当地语言的外国，但有一位翻译陪同，他辛苦地翻译你说的每一个字，然后再把每个回答翻译回英语。这将是一个非常缓慢和繁琐的过程。不幸的是，当你运行\
  \ AS3.0 程序时，Flash Player 和 CPU 之间发生的情况正是如此。到底有多慢？确切数字很难获得，但一个合理的估计是，比代码被编译为二进制机器语言并直接在\
  \ CPU 上运行慢 10 到 20 倍。（这里说的 `慢`，是指 CPU 处理你程序要求它执行的每条指令或计算的快慢程度。）\n\nAdobe 在 Flash\
  \ Player 的每一代迭代中都做了大量工作来提升性能，但对于那些依赖榨干系统每一分处理能力来最大化游戏性能的游戏开发者来说，这仍然是一个主要障碍。这就是需要大量处理能力来计算几何图形的\
  \ 3D Flash 游戏，为何难以与游戏主机（如 Xbox、PlayStation 和 Wii）上丰富的 3D 图形辉煌相抗衡的原因。游戏主机使用定制的编译器，将所有游戏代码优化后，直接作为机器语言在其特定处理器上运行。\n\
  \n不过，如果你最终考虑进入主机游戏设计领域，使用 Flash 仍然会让你处于相当有利的位置：当你准备迈出那一步时，通过使用 AS3.0 编程所学的技能可以直接应用于主机编程。AS3.0\
  \ 编程环境也可能是一个你能学到的、最用户友好的编程环境。而且，嘿，用 Flash 制作一个游戏，把它发布到网上，你就拥有了一个潜在的全球受众——这就是力量！\n\
  \n\n\n### 命名规范\n\n在本章结束之前，我们来快速了解一下编程实践中的一个方面：**命名规范**。你可能已经注意到，你为文件、类和方法所起的名称有些特别之处。看看为\
  \ AS 文件选择的文件名：`HelloWorld`。\n\n它看起来是不是有点奇怪？确实如此。你会注意到 `H` 和 `W` 是大写的，而且两个单词之间没有空格。这是一种程序员们亲切地称为**驼峰命名法**（也被称为**驼峰式记法**）的命名风格。你能猜出为什么叫这个名字吗？我相信你一定能！\n\
  \n使用驼峰命名法，你可以使用多个单词来编写复合短语。单词之间不用空格分隔，但你和 AS3.0 仍然可以轻松地阅读这个短语。在复合名称中间使用空格，对于编程来说就像鸡舍里进了狐狸——无论如何都要避免！当\
  \ AS3.0 代码编译器在不应出现空格的地方遇到空格时，它会直接报错，因此程序员们发明了驼峰命名法，作为一种无需空格就能高效编写复合单词或短语的方式。同时，你也应避免在文件夹名称中使用空格，因为如果你使用了\
  \ Flash Builder 以外的 IDE，底层的 Flex SDK 在编译代码时将无法处理包含空格的路径。\n\n驼峰命名法是命名规范的一个重要特征。命名规范是程序员在开始项目之前约定的一套规则，用于创建包、变量、类、对象、方法和文件的命名风格。通过严格遵守这些命名规范，程序员能够更好地避免因拼写错误或代码中元素大小写不正确而导致的常见错误。此外，他们仅凭命名的大小写方式，就能轻松判断出所处理的是哪种编程对象。\n\
  \n本书中你将用到两种驼峰命名法：\n\n- **小驼峰命名法**：`startsWithLowerCaseLetter`。你将把它用于包名、变量、方法和实例。\n\
  - **大驼峰命名法**：`StartsWithUpperCaseLetter`。你将把它用于类名和构造方法名。同时也会用于 AS 类文件的名称，例如 `HelloWorld.as`\
  \ 和 `Main.as`，这些文件的名称必须与它们在文件中定义的类名完全一致。\n\n由于 ActionScript 是一种区分大小写的编程语言，请记住 `helloWorld`\
  \ 与 `HelloWorld` 不同，而它们与 `helloworld` 也各不相同。确保你严格按照文本中出现的格式遵循所有大小写规则，否则你的程序将无法运行。如果你写了一个看似方方面面都完美无缺但就是无法运行的程序，请检查你的拼写和大小写！这是新手程序员最常犯的错误之一，而且很多程序员都能讲出一些令人头疼的调试故事——一直调试到凌晨\
  \ 4 点，最终揪出的罪魁祸首竟然只是一个拼写错误或大小写错误。对于这一点，本书作者拒绝评论！\n\n### 本章总结\n\n做得好！你已经编写并发布了你的第一个\
  \ AS3.0 程序！其实没那么难，对吧？事实上，恭喜你通过了本书中最困难的章节之一。我已经为后续所有的游戏和项目打下了编程基础，你会发现，在你作为游戏设计师的职业生涯中，你将反复使用同样的格式来搭建程序。\n\
  \n本章涵盖了大量的理论内容，如果你刚接触编程，可能会觉得有些部分有点晦涩难懂。我理解你的感受！但你不必完全理解所有理论才能制作游戏。最重要的是，你知道需要用什么编程代码来获得你想要的结果。更深层次的理解会随着时间的推移而来，通过大量的试错，并尽可能多地在自己的项目中进行实验，你自然会领悟。\n\
  \n大多数程序员通常不愿与外界分享的一个深藏的秘密是：世界上大量软件都是建立在一点点理解和大量复制粘贴之上的。这本身就是学习过程的一部分。当然，你需要确切地知道需要复制粘贴哪些代码片段，以及如何修改它们来获得你想要的结果，而这只有经验（以及本书！）才能教会你。但随着时间推移，你会很快识别出那些常见的代码段，并像最优秀的程序员一样熟练地复制粘贴。\n\
  \n我鼓励你重温本章中那些第一遍读时可能有点模糊的部分，在继续深入学习之前，力求对它们有扎实的理解。如果你还没完全掌握，也不必担心！只要你成功让那个小小的 Hello\
  \ World 程序运行起来，并且大致理解了它为何能工作，那么你就已经入行了！\n\n在下一章中，你将暂时告别编程，学习如何使用 Photoshop 为你的游戏制作图形。在第\
  \ 3 章中，你将看到如何运用本章学到的技能，结合这些图形，开始编程你的第一个交互式游戏世界。\n\n![Image](img/chap.jpg)\n\n##\
  \ 第 2 章\n\n\n\n### 制作游戏图形\n\n在接下来的两章中，你将学习视频游戏设计的两项最核心技能：如何制作游戏图形，以及如何为它们编写程序。游戏设计中所有最重要的核心技术都涵盖在这两章中。正是这些技术，将成为你在本书后续制作其余游戏项目时的基础。\n\
  \n`Flash Builder` 仅用于编写程序代码，而非制作游戏所需的图形。因此，你需要使用一些图形软件来制作这些图形。本章将介绍如何使用 Photoshop\
  \ 制作游戏图形。在下一章中，我将向你展示如何使用 AS3.0 程序代码为这些图形编程，使它们实现完全交互。\n\n*本章假定你几乎没有或完全没有使用过 Photoshop\
  \ 或任何其他图形设计软件的经验。它将从最基础的内容讲起，涵盖所有基本知识。如果你在计算机图形制作方面经验丰富，可以快速浏览本章，了解一下需要制作哪些图形、它们应使用的文件名以及保存的位置和方式。虽然本章重点介绍使用最广泛的图形设计软件\
  \ Photoshop，但你可以使用任何你喜欢的能生成 `PNG` 文件的软件：Fireworks、GIMP、Illustrator，或任何其他你用得顺手的软件。*\n\
  \n到本章结束时，你将创建出图 2-1 中所示的背景游戏世界。\n\n![图片](img/9781430239922_Fig02-01.jpg)\n\n**图\
  \ 2-1.** 背景游戏世界\n\n你还将使用基本形状创建一个游戏角色，如图 2-2 所示。\n\n![图片](img/9781430239922_Fig02-02.jpg)\n\
  \n**图 2-2.** 游戏角色\n\n此外，你还会制作一些用于控制该角色的按钮图形，如图 2-3 所示。\n\n![图片](img/9781430239922_Fig02-03.jpg)\n\
  \n**图 2-3.** 用于控制游戏角色的按钮\n\n所有这些图形都将用 Photoshop 制作，并保存为名为 `PNG`（便携式网络图形）的文件格式。对于\
  \ Flash 游戏来说，`PNG` 图像文件通常是最佳选择。\n\n以下是本章你将学到的内容：\n\n*   如何在 Photoshop 中打开新文件。\n\
  *   如何使用 Photoshop 工具创建基本形状。\n*   如何使用图层来组织形状。\n*   如何为图形应用特殊效果。\n*   如何将图形保存为 `PNG`\
  \ 文件，以便随后使用 AS3.0 进行编程。\n\n那么，让我们开始构建一个游戏世界吧！\n\n*Photoshop 是一款复杂的软件，拥有成千上万种可供更改和自定义的设置。而且，稍不注意，你很容易不小心“自定义”界面布局，几次无意的点击就会导致窗口、面板和工具消失——而且似乎是永久消失。如果你是\
  \ Photoshop 新手，正在探索该软件，这个问题尤其突出。你可能会将某个窗口拖拽或点击到无影无踪。*\n\n*幸运的是，让所有这些窗口重新出现在正确的位置相当容易。Photoshop\
  \ 使用了一种名为**工作区**的概念，它是一组窗口和工具面板的集合，根据你正在做的工作类型，这些窗口和面板会以不同的排列方式分组。当你首次安装并启动 Photoshop\
  \ 时，它会加载一个名为**基本功能**的工作区。没有理由更改这个工作区，我建议你在学习期间使用它，因此本书中的操作说明也是基于这个工作区编写的。*\n\n*以下是确认你正在基本功能工作区中操作的方法。你也可以通过从\
  \ Photoshop 主菜单中选择“窗口”![图片](img/U001.jpg)“工作区”来确认。你应该会看到“基本功能”旁边有一个对勾。在同一个菜单的下方，你会看到一个名为“复位基本功能”的选项。这就是神奇选项！如果你丢失了任何窗口或工具面板，并且到处都找不到，选择“复位基本功能”，它们就会全部弹回到你首次启动\
  \ Photoshop 时所处的位置。你还会在工作区左上角附近看到一个名为“基本功能”的大按钮。如果它看起来是按下的状态，说明你正在“基本功能”工作区中工作。*\n\
  \n*你还可以从 Photoshop 工作区顶部主菜单栏的“窗口”菜单中有选择地隐藏或显示窗口和工具面板。所有在工作区中可见的窗口和面板旁边都会有一个对勾。如果你正在寻找某个窗口，但在屏幕上找不到，请从“窗口”菜单中选中它。*\n\
  \n### 创建游戏世界背景\n\n在第一部分中，你将创建一个背景游戏环境，你的角色将居住在其中。我将一步步地引导你完成整个过程，最后你将制作出一张看起来像图\
  \ 2-4 一样的图片。\n\n![图片](img/9781430239922_Fig02-04.jpg)\n\n**图 2-4.** 游戏世界\n\n####\
  \ 在 Photoshop 中创建新文件\n\n首先，启动 Photoshop 并设置一个新文件，用于绘制背景场景。\n\n1.  启动 Photoshop。\n\
  2.  从主菜单中选择“文件”![图片](img/U001.jpg)“新建”。将打开一个对话框，询问你正在创建的新文件的名称以及你想要设置的图像尺寸。以下是需要更改的选项：\n\
  \    *   名称：`background`\n    *   宽度：550 像素\n    *   高度：400 像素\n\n你可以保留所有其他设置不变。完成后，“新建”文件对话框应该看起来像图\
  \ 2-5 这样。\n\n![图片](img/9781430239922_Fig02-05.jpg)\n\n**图 2-5.** “新建”文件对话框应该看起来像这样。\n\
  \n*如果你看到的“新建”文件对话框与此不完全相同，很可能是你使用的 Photoshop 版本与我的略有不同。本书编写时使用的是 Photoshop CS 5.1，这是出版时的最新版本。如果你使用的是更早或更新的版本，你看到的一些选项可能不完全相同，或者位置稍有不同。不过，我可以向你保证，它们肯定都在那里！请运用你的判断力和智慧去寻找它们。*\n\
  \n*Adobe 在每个版本之间都会对工具和菜单项的布局和位置进行微小的调整，但很少进行大刀阔斧的改动。事实上，在我使用 Photoshop 的 20 年里，本章将要描述的基本功能几乎没有太大变化。这是一件好事，因为这意味着你投入学习\
  \ Photoshop 的时间往往是一项不错的长期投资。这也意味着，如果你使用的是更老版本的 Photoshop，哪怕是像 Photoshop 5 这样已有 10\
  \ 年历史的版本，你仍然可以遵循本章的大部分说明，制作出很棒的游戏图形。*\n\n点击“确定”按钮，会打开一个全新的空白窗口，这就是你将用来绘制背景的窗口。这被称为**画布**。图\
  \ 2-6 显示了你会看到的内容。\n\n![图片](img/9781430239922_Fig02-06.jpg)\n\n**图 2-6.** 用于绘制背景场景的空白画布\n\
  \n\n\n#### 什么是像素？\n\n当你创建新的空白画布时，你为其指定了宽度 550 像素和高度 400 像素。那么什么是像素呢？\n\n像素是构成计算机图形的微小方块，是你在屏幕上能看到的最小单位。没有任何东西能比像素更小。如果你放大计算机图形，你会看到它是由无数微小的方块组成的，这些方块就是像素。图\
  \ 2-7 展示了一个示例。\n\n![Image](img/9781430239922_Fig02-07.jpg)\n\n**图 2-7.** 像素是构成计算机图形的微小方块。\n\
  \n需要明确的是，你创建的新空白画布实际上就是这些微小方块构成的网格。目前你还看不到它们，因为它们全是白色的，但它们确实存在。这张看似平淡无奇、在未经训练的人眼中毫无特色的新画布，实际上是由\
  \ 22 万个白色像素组成的。图 2-8 对此进行了说明。\n\n![Image](img/9781430239922_Fig02-08.jpg)\n\n**图\
  \ 2-8.** 看似空白的画布，实际上是由称为像素的微小白色方块组成的网格。\n\n将这块画布视为像素网格来思考非常重要。在下一章中，你将看到如何访问和控制这个隐形网格中每一个点上所有游戏元素的位置。\n\
  \n*注：像素是计算机图形的基本构件，但并非唯一。还有另一种使用`矢量`制作计算机图形的方法。使用`矢量`制作的图形，其最基本元素是线条而不是方块。Photoshop\
  \ 专精于使用像素创建图形，而 Illustrator 和 Flash Professional 等软件则使用`矢量`。在后面的章节中，你将学习如何利用`矢量`为你的游戏制作精美的插图。*\n\
  \n*Photoshop 的图形工具也使用`矢量`作为其基本构件。*\n\n#### 绘制天空\n\n在 Photoshop 工作区的左侧，你可以找到工具箱。Photoshop\
  \ 的大多数绘图工具都在这里。工具箱有一个可能让人困惑的特点：许多工具是隐藏的，只有在某个按钮上按住鼠标左键时才会显示出来。操作后会显示一个列表，列出该按钮组中所有分组的工具。然后你可以从列表中选择你需要的工具。你需要一些练习和经验才能找到并记住哪些工具属于哪些按钮组，但你会逐渐掌握的。图\
  \ 2-9 显示了大多数重要的绘图工具隐藏的位置。如果在后续指示中你找不到我要求你使用的工具，可以回头参考这张插图。\n\n![Image](img/9781430239922_Fig02-09.jpg)\n\
  \n**图 2-9.** 在任何按钮组上按住鼠标左键，即可显示 Photoshop 的隐藏工具。\n\n你要绘制的第一个东西是一片蓝色的天空，它将构成场景其余部分的背景。在接下来的步骤中，你将学习如何使用`矩形工具`绘制一个方块，为其填充颜色，并使用渐变赋予其自然的深度感。\n\
  \n在工具箱中选择`矩形工具`。当你在工具箱中看到它的图标显示为按下的按钮时，就表示已正确选中，如图 2-10 所示。\n\n![Image](img/9781430239922_Fig02-10.jpg)\n\
  \n**图 2-10.** 选择`矩形工具`。\n\n接下来，你要为矩形选择一种颜色。有两个地方可以操作。在工具箱的左下角，你会看到两个重叠的方块。选择上方的方块可以选取对象的前景色。选择后面的方块可以选取其背景色。如果需要，你可以点击弯曲的箭头图标来交换这些颜色。图\
  \ 2-11 对此进行了说明。\n\n![Image](img/9781430239922_Fig02-11.jpg)\n\n**图 2-11.** 选择对象的前景色或背景色。\n\
  \nPhotoshop 还有一个沿着工作区顶部排列的`选项栏`。它是*上下文相关的*，这意味着你在此处看到的按钮和设置会根据你选择的工具而变化。通过一些经验，你将逐渐了解在不同工具激活状态下可以在此选择哪些工具和选项。当`矩形工具`处于激活状态时，你可以在`选项栏`中更改其颜色，如图\
  \ 2-12 所示。\n\n![Image](img/9781430239922_Fig02-12.jpg)\n\n**图 2-12.** 上下文相关的`选项栏`允许你更改许多工具选项，包括颜色。\n\
  \n*注：如果出于某种原因你找不到`选项栏`，它可能被隐藏了。要显示它，请从 Photoshop 的主菜单中选择“窗口” ![Image](img/U001.jpg)\
  \ “选项”。“选项”旁边应有一个勾选标记。*\n\n*在`选项栏`正上方是应用程序栏。你可以使用它来更改画布的缩放百分比，以及修改 Photoshop 显示面板和窗口的方式。*\n\
  \n按照前述方法，点击工具箱或`选项栏`中的前景色选择框。\n\n颜色选择器窗口会打开，让你选择一种颜色。使用窗口中间的滑块选择一种颜色，然后在其左侧的大方块中选择该颜色的深浅（亮度）。标记为“新的”方框会显示新颜色看起来的样子，并与当前所选颜色进行对比。如果觉得选择太多，可以点击“颜色库”按钮，加载一组预选的颜色供你选择。图\
  \ 2-13 显示了颜色选择器的外观。\n\n![Image](img/9781430239922_Fig02-13.jpg)\n\n**图 2-13.** 在颜色选择器中选择一种颜色。\n\
  \n\n\n除了使用颜色选择器，你也可以从工作区右侧的“颜色”或“色板”面板中选择颜色。点击“色板”选项卡，会显示许多小色块（称为色板）供你选择。当鼠标悬停在某个色板上时，鼠标指针会变成吸管图标，这是一种巧妙的提示，表明你可以吸取颜色用于绘制。当你用吸管选择一种颜色后，它会显示在颜色选择器窗口的“新建”框中，如图\
  \ 2-14 所示。\n\n![Image](img/9781430239922_Fig02-14.jpg)\n\n**图 2-14.** 也可以从“色板”面板中选择颜色。\n\
  \n你也可以直接点击色板，无需打开颜色选择器。该颜色会直接应用到当前处理的矩形或其他形状上。\n\n“色板”面板中默认显示的色板已经涵盖了不错的起始颜色选择，但还有更多颜色可用。点击面板最右侧那个像列表旁边带向下箭头的小按钮，会弹出一个颜色合集列表供你选择。找到一个你喜欢的合集。如果想恢复默认色板，从同一列表中选择`重置色板`即可。\n\
  \n接下来你要绘制天空背景，所以选择一种亮蓝色。完成后点击颜色选择器窗口中的“确定”按钮。你选择的新颜色会出现在工具面板底部的前景色色框中。\n\n返回空白画布。按住鼠标左键并拖动，绘制一个正方形或矩形，如图\
  \ 2-15 所示。它的颜色应与上一步选择的颜色一致。\n\n![Image](img/9781430239922_Fig02-15.jpg)\n\n**图 2-15.**\
  \ 在新工作区中绘制一个矩形。\n\n这样还不错，但你真正想要的是让蓝色矩形填满整个屏幕。让我们在下一步中解决这个问题。\n\n选择工具面板顶部的“移动工具”。移动工具允许你在画布上移动对象，以及调整其大小或旋转对象。一旦选中它，选项栏会提供一些你需要更改的选项。其中有一项非常重要：一个名为`显示变换控件`的复选框。\n\
  \n确保`显示变换控件`已被勾选。如果没有勾选此选项，你将无法轻松调整对象大小或旋转对象。图 2-16 展示了移动工具按钮和选项栏应有的样子。\n\n![Image](img/9781430239922_Fig02-16.jpg)\n\
  \n**图 2-16.** 选择移动工具，并确保选项栏中的`显示变换控件`复选框已被选中。\n\n一旦你选择了已勾选`显示变换控件`的移动工具，你会注意到你绘制的矩形四个角、各边以及中心出现了小方块。这些称为拖拽手柄。当移动工具处于选中状态时，你可以用鼠标拖拽这些手柄来调整矩形的大小和旋转角度。\n\
  \n当鼠标移动到其中一个手柄上时，你会看到两种图标之一出现。对角指向的箭头表示你可以调整矩形大小（这也称为缩放）。弯曲的箭头表示你可以旋转它。图 2-17 展示了如何使用这些拖拽手柄来改变矩形的大小或方向。\n\
  \n![Image](img/9781430239922_Fig02-17.jpg)\n\n**图 2-17.** 使用移动工具调整对象大小或旋转对象。\n\n\
  像这样改变绘图对象的大小和方向，在 Photoshop 的术语中被称为变换。你可以通过从 Photoshop 主菜单选择`编辑` ![Image](img/U001.jpg)\
  \ `变换路径`或`编辑` ![Image](img/U001.jpg) `变换`来找到更多变换选项。你会在其中找到以下选项：`缩放`（调整大小）、`旋转`、`斜切`、`扭曲`、`透视`和`变形`。你还可以找到按固定量翻转和旋转对象的选项。\n\
  \n使用移动工具和拖拽手柄调整矩形大小，使其填满整个画布，如图 2-18 所示。此时画布应完全变为蓝色。\n\n![Image](img/9781430239922_Fig02-18.jpg)\n\
  \n**图 2-18.** 调整矩形大小以填满整个画布。\n\n调整大小完成后，按下 `Enter` 键。这会应用变换，并且你需要在此操作之后才能再次激活 Photoshop\
  \ 的许多选项。你也可以通过再次选择移动工具来应用变换。Photoshop 会弹出一个对话框询问你是否要应用变换，点击“确定”即可接受。\n\n当你正在调整形状或选区的大小或旋转时，Photoshop\
  \ 会禁用主菜单中的大部分选项以及右侧面板中的许多按钮。如果你发现自己在操作时遇到按钮看似冻结或菜单选项莫名变灰，很可能是因为你忘记了应用正在处理的形状上的变换。按\
  \ `Enter` 键立即应用，或者选择移动工具打开确认窗口。之后一切都会正常运作！\n\n现在你已经拥有一个蓝色背景，它将作为天空的基础。保持原样也可以，但让我们通过添加渐变使其更具层次感，从而让效果更好。\n\
  \n\n\n##### 添加渐变\n\n渐变是一种逐渐变化的颜色，可以从浅到深，也可以从一种颜色过渡到另一种。在接下来的步骤中，你将给矩形添加渐变，使其顶部为深蓝色，底部为浅蓝色。这将营造出天空消失于地平线的视觉效果。\n\
  \n当你使用 Photoshop 的形状（如圆形和矩形）时，可以通过“图层样式”菜单为其应用渐变。选择“图层”![Image](img/U001.jpg) “图层样式”![Image](img/U001.jpg)\
  \ “渐变叠加”（图 2-19）。\n\n![Image](img/9781430239922_Fig02-19.jpg)\n\n**图 2-19.** 选择“渐变叠加”图层样式。\n\
  \n一旦选中“渐变叠加”，矩形将被填充一个简单的渐变，同时“图层样式”窗口将打开，并且自动选中“渐变叠加”选项，如图 2-20 所示。\n\n![Image](img/9781430239922_Fig02-20.jpg)\n\
  \n**图 2-20.** “图层样式”窗口让你可以在形状上创建和编辑渐变。\n\n要编辑渐变，请单击“图层样式”窗口中的渐变框。此时会打开“渐变编辑器”窗口，如图\
  \ 2-21 所示。\n\n![Image](img/9781430239922_Fig02-21.jpg)\n\n**图 2-21.** 单击渐变框内部。\n\
  \n你可以通过选择和移动`色标`来更改渐变的颜色和透明度。`色标`指的是窗口下半部分那根长渐变条四个角上的小方块。底部的色标决定渐变的颜色，顶部的色标决定其透明度（即`不透明度`）。图\
  \ 2-22 对此进行了说明。\n\n![Image](img/9781430239922_Fig02-22.jpg)\n\n**图 2-22.** 使用渐变预览条中的色标来自定义渐变。\n\
  \n色标是比较灵巧的东西。你需要稍微摆弄一下才能掌握它们的使用方法。你可以来回滑动它们来改变渐变的起始和结束位置。你可以在渐变预览条的顶部或底部任意位置单击来添加新的色标，也可以通过将色标拖离来删除它们。\n\
  \n顶部的色标控制渐变的不透明度。当你单击一个不透明度色标时，“渐变编辑器”中的`不透明度`选项会被激活，你就可以控制该渐变区域的透明度。`0%` 的不透明度表示完全透明，`100%`\
  \ 则表示完全不透明（实色），因此 `50%` 会使渐变在该色标位置处于半透明状态。图 2-23 对此进行了说明。\n\n![Image](img/9781430239922_Fig02-23.jpg)\n\
  \n**图 2-23.** 如果选中一个不透明度色标，你可以通过更改其不透明度百分比来控制渐变在该点的透明度。\n\n你会注意到，如果更改了`不透明度`值，渐变下方会出现棋盘格图案。这是\
  \ Photoshop 在向你表示颜色是透明的。\n\n`位置`选项决定了色标应放置在渐变的哪个百分比位置。它只是用鼠标拖动色标的另一种替代方式。\n\n底部的色标控制渐变中的颜色。如果双击一个颜色色标，会打开“拾色器”窗口，让你可以选择该部分渐变的颜色。我们下一步就来操作。\n\
  \n双击渐变预览条左侧的颜色色标。“拾色器”窗口就会打开（Photoshop 称之为`选择色标颜色`窗口）。选择一种漂亮的浅蓝色，可以从“拾色器”窗口中选择，也可以从“色板”面板中选择，如图\
  \ 2-24 所示。\n\n![Image](img/9781430239922_Fig02-24.jpg)\n\n**图 2-24.** 更改渐变的颜色。\n\
  \n在`选择色标颜色`窗口中单击`确定`。你选择的新颜色将应用到该色标位置的渐变上。\n\n接下来要做的是更改颜色中点，它决定了渐变的中心位置。颜色中点是渐变预览条底部的一个小圆圈。为了得到更自然的天空渐变效果，请将颜色中点圆点向左滑动，直到`位置`选项显示约为\
  \ `25%`，如图 2-25 所示。\n\n![Image](img/9781430239922_Fig02-25.jpg)\n\n**图 2-25.** 更改渐变的中间点。\n\
  \n当你对渐变的显示效果满意时，请在“渐变编辑器”窗口中单击`确定`。现在你应该拥有一个看起来像图 2-26 那样的渐变。\n\n![Image](img/9781430239922_Fig02-26.jpg)\n\
  \n**图 2-26.** 目前得到的渐变。\n\n这幅图有点问题！你的天空实际上是上下颠倒的。所以你需要将渐变的方向旋转 90 度，让深色部分位于顶部，浅色部分位于底部。\n\
  \n“图层样式”窗口应该仍然处于打开状态。找到`角度`选项，将渐变的角度设置为 `-90`，可以直接在文本框中输入数值，或者用鼠标转动`角度`滚轮，如图 2-27\
  \ 所示。矩形的渐变会随之旋转，天空现在看起来就正过来了。\n\n![Image](img/9781430239922_Fig02-27.jpg)\n\n**图\
  \ 2-27.** 将渐变角度旋转 90 度。\n\n单击“图层样式”窗口中的`确定`按钮，将渐变应用到矩形上。\n\n*除了旋转渐变，你也可以使用移动工具旋转矩形形状本身。*\n\
  \n“图层样式”窗口还允许你将渐变类型从本例中使用的`线性`，更改为`径向`、`角度`、`对称的`或`菱形`。`径向`渐变对于为圆形形状创建伪 3D 效果特别有用。图\
  \ 2-28 展示了这些不同渐变类型的效果。\n\n![Image](img/9781430239922_Fig02-28.jpg)\n\n**图 2-28.**\
  \ Photoshop 中不同的渐变样式。\n\n渐变在 Photoshop 中是一个复杂的话题，学习它们的最佳方法是创建一些形状，并在“渐变编辑器”中试验各种设置，看看能产生什么样的效果。如果你创建了一个特别喜欢的渐变，“渐变编辑器”允许你保存它，以便以后将其载入到另一个形状中。\n\
  \n#### 绘制山丘\n\n天空完成后，是时候为场景添加一些绿色的背景山丘了。你需要在天空的前方绘制山丘。但在开始之前，你必须了解一项重要的 Photoshop\
  \ 技术：如何使用图层来组织对象在画布上的深度位置。\n\n\n\n##### 理解图层\n\n图层能让你组织图形，使其位于其他图形的上方或下方。`图层`面板位于\
  \ Photoshop 工作区的右下角。如果你按照本章之前的说明操作，现在应该有两个图层：一个空白背景图层和你在前面步骤中绘制的矩形形状。\n\n每个图层旁边都有看起来像眼睛的图标。点击这些图标，可以暂时让该图层在画布上不可见，从而让你看到下方的图层。（再次点击眼睛图标即可让图层重新可见。）\n\
  \n如果某个图层旁边有锁图标，表示该图层无法编辑。背景图层将始终处于锁定状态。你也可以通过选中图层并点击`图层`面板顶部附近的“锁定”按钮来锁定任意图层。如果你在该图层上进行了大量图形工作，并希望防止意外搞砸，锁定图层会非常有用。\n\
  \n你可以通过选中图层并调整不透明度滑块，来单独更改每个图层的不透明度（透明度）。如果将图层的不透明度设置为低于 100%，你将能够看到其下方的图层。\n\n\
  你可以使用`图层`面板底部的按钮来创建和删除图层。图 2-29 展示了这些基本功能及其所在位置。\n\n![图片](img/9781430239922_Fig02-29.jpg)\n\
  \n**图 2-29。** `图层`面板让你能够组织图形，使其位于其他图形的上方或下方。\n\n每个图层还会告诉你关于该图层上内容的大量信息。你可以看到第二个图层上有一个形状；那就是你的天空矩形。你可以看到它应用了一个特殊的图层效果，`fx`图标就说明了这一点。你还可以看到它是一个渐变叠加效果。实际上，如果你想编辑渐变效果，只需双击`图层`面板中的`渐变叠加`，就会弹出`图层样式`窗口，让你对渐变进行任意修改。你可以通过点击效果名称旁边的眼睛图标，暂时隐藏你已创建的效果。你也可以通过点击`效果`旁边的眼睛图标，来隐藏一个图层上的所有效果。\n\
  \n如果你想为图层添加任何其他特殊效果，可以点击面板底部的小`FX`按钮，然后从列表中选择一个效果。图 2-30 展示了`图层`面板的这些功能。\n\n![图片](img/9781430239922_Fig02-30.jpg)\n\
  \n**图 2-30。** `图层`面板让你能够添加、编辑或隐藏可能应用于图形的任何效果。\n\n工作时，请特别留意你从`图层`面板左上角选项菜单中选择的混合模式。混合模式决定了一个图层如何与其下方的图层进行交互。如果你使用非“正常”的混合模式，可以产生一些有趣且通常很漂亮的图层效果。然而，对于简单的游戏图形，你可能不需要用到这些，因此你很可能希望始终将混合模式设置为“正常”。\n\
  \n不过，你工作时总有可能会意外更改混合模式。如果你注意到你的游戏图形突然变得暗淡、透明、出现奇怪的轮廓或疯狂的迷幻效果，那很有可能是不小心切换了图层的混合模式。\n\
  \n如你所见，`图层`面板让你对工作成果拥有极大的控制权。不过，虽然在创建自己的游戏图形时你可能会用到所有这些功能，但眼下你无需担心其中的大部分。最重要需要了解的是：*上方图层上的任何内容都会遮盖下方图层上的内容。*\n\
  \n在开始在新图层上绘制之前，先给天空图层命名并锁定它，以防止意外选中或更改它。\n\n双击`图层`面板中的“形状 1”文字。这会使文本处于可编辑状态。将其改为“天空”。（按\
  \ Enter 键应用名称更改。）给图层命名是一个好习惯，这样你可以轻松找到它们。当你在处理包含 20 或 30 个图层的复杂图形时，你会体会到这个习惯的好处。\n\
  \n点击挂锁按钮来锁定图层。同样，在完成图层上的工作后锁定它们也是一个好习惯，这样你在上方的新图层上工作时就不会意外选中或更改它们。（你可以通过再次选中锁定的图层并点击挂锁按钮来轻松解锁图层以便再次编辑。）现在，你的“天空”图层应该看起来像图\
  \ 2-31 所示。\n\n![图片](img/9781430239922_Fig02-31.jpg)\n\n**图 2-31。** 为图层命名并锁定它，以防止意外更改。\n\
  \n这里还有很多我没有提及的非常高级的图层功能。你在创建本书中的游戏图形时不需要用到它们中的任何一个，因为其中许多功能是专门用于照片编辑的。但要全面了解它们的功能，请参考\
  \ Adobe 最新的在线文档，网址为：\n\n`http://help.adobe.com/en_US/photoshop/cs/using/index.html`\n\
  \n浏览到名为“图层”的章节。\n\n让我们为你的游戏世界场景创建一些丘陵，这样你就能实际看到这个概念的应用。\n\n##### 使用钢笔工具绘图\n\nPhotoshop\
  \ 的钢笔工具允许你创建复杂的形状。尽管它被称为钢笔，但它的工作方式并不像已知宇宙中存在的任何钢笔。最好将钢笔工具视为一种制作点，然后用直线连接这些点的方法。将足够多的点连接起来，你就有了一个形状。然后你可以弯曲形状中的线条，以制作出带有曲线的真正复杂的形状。学会正确使用钢笔工具是你能够掌握的最强大、最灵活的图形设计技巧之一。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将遵循您的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n##### 锚点与路径\n\n你将要在游戏世界中创建两座小山。每座山将位于不同的图层上。对于第一座山，请点击“图层”面板底部的“创建新图层”按钮（它看起来像一个折了一角的新页面）。一个新图层将出现在“天空”图层上方。双击这个新图层的名称，将其命名为“Hill\
  \ 1”。图 2-32 展示了你的新图层应有的样子。\n\n![Image](img/9781430239922_Fig02-32.jpg)\n\n**图 2-32.**\
  \ 创建一个新图层来绘制小山。\n\n现在你有三个图层了，你将要在这新的“Hill 1”图层上进行下一步绘制。\n\n从“工具”面板中选择`钢笔工具`（图 2-33）。\n\
  \n![Image](img/9781430239922_Fig02-33.jpg)\n\n**图 2-33.** 钢笔工具\n\n你将使用`钢笔工具`，通过创建一系列点并用直线连接它们，来粗略地绘制出山的轮廓。在后续步骤中，你将通过添加曲线来优化它。\n\
  \n选择`钢笔工具`后，在画布上的任意位置单击一次（你现在正在“Hill”图层上绘制）。会出现一个黑色方块，这被称为**锚点**；它是你形状的起点。\n\n![Image](img/9781430239922_Fig02-34.jpg)\n\
  \n**图 2-34.** 使用钢笔工具单击以添加一个锚点\n\n以锯齿状的方式，向下并向第一个点的左侧单击，以添加更多锚点，如图 2-35 所示。你会注意到，每次添加一个点，它都会通过一条线与前一个点连接起来。这被称为**路径**。\n\
  \n![Image](img/9781430239922_Fig02-35.jpg)\n\n**图 2-35.** 通过单击添加更多锚点来创建路径。\n\n如果在\
  \ Photoshop 中操作失误想要撤销操作，老办法 `编辑` ![Image](img/U001.jpg) `撤销` 或 `CRTL+Z`（Windows）或\
  \ `Command+Z`（Mac OS X）可以撤销你上一步的操作。\n\n然而，Photoshop 默认只设置成撤销上一步的操作，并不能多步撤销。如果你已经做了好几步操作，然后意识到需要返回并撤销五六步，可以打开\
  \ Photoshop 的“历史记录”面板（`窗口` ![Image](img/U001.jpg) `历史记录`）。“历史记录”面板记录了你最近执行的 20 步操作，如图\
  \ 2-36 所示。你可以通过点击这些历史记录中的任意一步，将项目恢复到之前的状态。\n\n你可以使用“历史记录”面板底部的“相机”按钮对你的工作进行快照。如果你即将开始项目中复杂或试验性的阶段，且不想冒丢失已完成工作的风险，这是一个好主意。当你拍摄快照时，Photoshop\
  \ 会保存当前状态下的一个工作版本，你可以通过点击“历史记录”面板顶部的快照来恢复到该状态。但快照不会随图像文件一起保存，因此如果你想恢复到快照状态，需要在关闭正在处理的文件之前进行。\n\
  \n![Image](img/9781430239922_Fig02-36.jpg)\n\n**图 2-36.** 通过“历史记录”面板回溯时间以撤销之前的操作。\n\
  \n继续绘制路径，使其看起来像图 2-37 所示。你可以通过点击你添加的第一个锚点来完成形状。当你这样做时，你会注意到`钢笔工具`旁边出现了一个小“O”图标。这表示你将**闭合路径**。当你闭合一条路径时，你就创建了一个形状。\n\
  \n![Image](img/9781430239922_Fig02-37.jpg)\n\n**图 2-37.** 闭合路径以创建山的粗略形状。\n\n在单击添加锚点时按住\
  \ `Shift` 键，你可以绘制出点之间呈固定 90 度和 45 度角的完美直线。\n\n锚点决定了你的形状将是什么样子。如果你对锚点放置的位置不满意，移动它们很容易。从“工具”面板中选择`直接选择工具`。大家都称之为**白色箭头**，它正是此意。使用白色箭头点击任意一个锚点并将其拖拽到新位置，如图\
  \ 2-38 所示。你可以使用这个工具移动任意锚点并改变形状。\n\n![Image](img/9781430239922_Fig02-38.jpg)\n\n\
  **图 2-38.** 使用直接选择工具（白色箭头）移动锚点。\n\n`钢笔工具`和白色箭头总是这样配合使用。实际上，在钢笔和白色箭头之间切换非常频繁，因此值得学习其键盘快捷键。选中`钢笔工具`后，按住\
  \ `Ctrl` 键（Windows）或 `Command` 键（Mac OS X），钢笔会暂时变为白色箭头。这是个便捷的快捷键，因为如果你在 Photoshop\
  \ 中使用`钢笔工具`制作大量游戏图形，你会在这两个工具之间来回切换成千上万次。\n\n你可以使用**黑色箭头**（`路径选择工具`）拖拽整个形状路径，从而在画布上移动它。图\
  \ 2-39 展示了这一点。\n\n![Image](img/9781430239922_Fig02-39.jpg)\n\n**图 2-39.** 使用路径选择工具（黑色箭头）在画布上移动整个路径。\n\
  \n添加和删除锚点很简单。要添加一个点，选择`钢笔工具`并将其移动到路径上的任意一条线上。你会看到钢笔旁边出现一个小加号图标。点击路径上的那个位置，就会添加一个新的锚点。（它会使用一个名为**方向线**的新特性来添加这个新锚点，你将在下一节中了解它们如何工作。）\n\
  \n你可以用类似的方式删除锚点。将`钢笔工具`移动到一个现有的锚点上，你会看到旁边出现一个减号图标。点击该锚点，它就会消失。图 2-40 展示了如何添加和删除锚点。\n\
  \n如果你使用的是旧版本的 Photoshop，可能无法如此轻松地添加和删除锚点。你很可能会需要从“工具”面板中选择`添加锚点`或`删除锚点`钢笔工具才能达到同样的效果。\n\
  \n![Image](img/9781430239922_Fig02-40.jpg)\n\n**图 2-40.** 使用钢笔工具添加和删除锚点。\n\n如果你知道如何使用`钢笔工具`通过添加和删除锚点来创建路径，并且知道如何使用白色箭头移动它们，你就掌握了在\
  \ Photoshop 中创建复杂形状的基本技能。然而，到目前为止，你只处理了带有直线的形状。在下一节中，我将向你展示如何制作带有曲线的形状。\n\n\n\n\
  ##### 使用方向手柄创建曲线\n\n要使形状弯曲，你需要在锚点上添加方向手柄。\n\n从“工具”面板中选择“转换点工具”。单击其中一个锚点。然后，在按住鼠标左键的同时，将其拖过画布。此时会出现两个方向手柄；你可以使用它们在锚点处弯曲路径。通过拖拽和旋转来拉长方向手柄，曲线就会变得更大。图\
  \ 2-41 展示了这一点。\n\n![Image](img/9781430239922_Fig02-41.jpg)\n\n**图 2-41.** 拖拽并旋转方向手柄以添加曲线\n\
  \n第一次使用“转换点工具”时，你可以同时移动两个方向手柄。它们会保持连接并朝同一方向移动。但是，当你再次单击并拖拽一个方向手柄时，你会发现你只会移动其中一个手柄。使用“转换点工具”进行第二次点击会断开两个手柄之间的连接。这实际上没问题，因为能够独立移动方向手柄对于微调曲线非常有用，如图\
  \ 2-42 所示。\n\n![Image](img/9781430239922_Fig02-42.jpg)\n\n**图 2-42.** 使用“转换点工具”独立拖拽和旋转方向手柄。这可以让你微调曲线。\n\
  \n但是，如果你想再次同时移动两个方向手柄怎么办？你可以使用“直接选择工具”（那个白色箭头）来实现。\n\n从“工具”面板中选择白色箭头。按住 `Alt` 键（Windows）或\
  \ `Option` 键（OS X）并拖拽其中一个方向手柄。你会看到它们又开始一起移动了。松开 `Alt`/`Option` 键后，你可以再次使用白色箭头独立移动方向手柄（参见图\
  \ 2-43）。\n\n![Image](img/9781430239922_Fig02-43.jpg)\n\n**图 2-43.** 使用白色箭头并按住 `Alt`（Windows）或\
  \ `Option`（OS X）键可同时移动两个方向手柄。\n\n通过结合使用这些技巧，你可以非常精细地控制形状的曲线。让我们在下一步中运用它们。\n\n运用这些技巧，让你的形状尽可能接近图\
  \ 2-44 的样子。你需要让它看起来有点像从侧面看到的滑雪坡道。\n\n![Image](img/9781430239922_Fig02-44.jpg)\n\n\
  **图 2-44.** 完成的形状路径\n\n如果你是初次使用“钢笔工具”和方向手柄，你可能第一次尝试就无法完美做到。事实上，你几乎肯定不行。这没什么好担心的！制作带有曲线的形状没有什么神奇的公式；你只需要不断尝试使用这些工具，直到对结果满意为止。使用“历史记录”面板撤销任何错误。但实际上你无法真正犯错——只需继续尝试。坚持按照这些指导进行练习，你很快就会掌握要领。正确使用“钢笔工具”需要大量的练习，但这是你可以学到的最有用、最强大的图形设计技能之一。\n\
  \n##### 调整路径大小\n\n如果你已经创建了一条路径，并想将其放大或缩小，请从“工具”面板中选择黑色箭头。在 Photoshop 工作区顶部的选项栏中选择“显示定界框”。用黑色箭头单击你已绘制的路径。你会看到它被一个带有角上手柄的定界框包围。拖拽这些手柄来调整路径大小，使你想要的形状变得尽可能大或小。图\
  \ 2-45 展示了这一点。\n\n![Image](img/9781430239922_Fig02-45.jpg)\n\n**图 2-45.** 使用黑色箭头调整路径大小。\n\
  \n为了这个项目的需要，请将你绘制的这个路径调整得相当大。\n\n调整路径大小并将其定位，使其填满画布的左侧。请记住，在完成大小和位置的调整后，按 `Enter`\
  \ 键以应用变换。你的画布现在应该看起来类似于图 2-46。\n\n![Image](img/9781430239922_Fig02-46.jpg)\n\n**图\
  \ 2-46.** 调整路径大小并定位。\n\n\n\n##### 用颜色填充路径\n\n你刚刚绘制的路径代表了想要制作形状的轮廓，但只有用颜色填充后，它才能成为游戏图形中可用的内容。Photoshop\
  \ 工作区右侧的“路径”面板可以让你实现这一点。\n\n要想让接下来的技巧生效，你需要先用黑色箭头工具选中上一节中绘制的路径。用黑色箭头点击路径一次将其选中。你可以通过形状路径周围带角点拖动手柄的黑色定界框来判断它是否被选中，如图\
  \ 2-47 所示。\n\n![图片](img/9781430239922_Fig02-47.jpg)\n\n**图 2-47.** 确保形状路径仍被黑色箭头工具选中。\n\
  \n在成功为路径应用颜色之前，你还需要进行一项重要的设置。保持黑色箭头工具选中状态，点击 Photoshop 工作区顶部选项栏中的“添加到形状区域(+)”按钮。图\
  \ 2-48 展示了该按钮的位置。如果未选中此按钮，后续步骤将无法正常进行。正是这个按钮能让你用颜色填充形状路径的内部区域。（如果按钮呈灰色无法点击，说明你未先用黑色箭头选中路径。用箭头点击路径使其选中，然后重试。）\n\
  \n![图片](img/9781430239922_Fig02-48.jpg)\n\n**图 2-48.** 在黑色箭头选项栏中点击“添加到形状区域(+)”按钮。\n\
  \n接下来，为你的形状选择一种颜色。使用本章前面学到的技巧，在工具面板的前景色色框中选择一种亮绿色（图 2-49）。\n\n![图片](img/9781430239922_Fig02-49.jpg)\n\
  \n**图 2-49.** 选择一种绿色前景色。\n\n打开“路径”面板，它作为标签选项位于包含“图层”面板的同一窗口中。如图 2-50 所示，你会看到刚绘制的路径的小缩略图，底部还有一些按钮。这些按钮可以让你用颜色填充路径、用画笔描边、将路径转换为选区或删除路径。如果你为路径指定一个独特的名称，Photoshop\
  \ 会自动将路径随文档保存，以便日后在其他地方复用。我将我的路径命名为“Hill”。\n\n![图片](img/9781430239922_Fig02-50.jpg)\n\
  \n**图 2-50.** “路径”面板允许你用颜色填充路径。\n\n点击“路径”面板底部的“用前景色填充路径”按钮。形状路径将被填充为绿色的前景色，如图 2-51\
  \ 所示。\n\n![图片](img/9781430239922_Fig02-51.jpg)\n\n**图 2-51.** 用前景色填充路径。\n\n如有必要，你可以点击黑色箭头选项栏中的“从形状区域减去(-)”按钮来撤销此效果。这将填充周围区域，而保持形状为空。\n\
  \n现在你的画布应类似于图 2-52。\n\n![图片](img/9781430239922_Fig02-52.jpg)\n\n**图 2-52.** 山坡现在已被颜色填充。\n\
  \n这里到底发生了什么？你在前面章节中绘制的路径只是一个模板。你现在所做的事情就是将颜色倒入这个模板。颜色被倒在了图层的透明表面上。这就像使用模板在透明塑料片上给形状上色。\n\
  \n你唯一关心的是刚刚倒在图层上的颜色。你可以完全删除路径，因为它已经完成了使命，你不再需要它了。让我们删除它。\n\n路径应该仍被黑色箭头工具选中。（你可以通过路径周围的定界框确认这一点。）如果未被选中，用黑色箭头点击路径一次。按下键盘上的`Delete`键，路径就会消失。\n\
  \n剩下的就是一个漂亮的绿色山坡。在下一节中，你将复制这个山坡，更改其颜色，并将其重新定位到画布右侧第一个山坡的后面。\n\n当你熟练掌握了钢笔工具及其相关工具和技巧后，可以尝试使用自由钢笔工具。你会喜欢它的，它就像一支真正的笔！你可以徒手绘制形状，然后使用转换点工具和白色箭头来微调形状。\n\
  \n\n\n##### 复制、修改与排列图层\n\n你的场景中需要两座山丘。但与其费尽周折再建一座，不如直接复制已有的那座，然后稍作修改。\n\n在`图层`面板中选中`山丘\
  \ 1`图层后，从主菜单中选择`图层` > `复制图层`。（你也可以右键点击`山丘 1`图层，选择`复制图层`。）此时会弹出`复制图层`对话框，要求你为新图层命名。将其命名为`山丘\
  \ 2`，如图 5-53 所示。点击`确定`按钮。\n\n![图片](img/9781430239922_Fig02-53.jpg)\n\n**图 2-53.**\
  \ 复制图层。\n\n完成此操作后，你会看到`山丘 1`图层上方出现了一个名为`山丘 2`的新图层（图 2-54）。这两个图层看起来一模一样。\n\n![图片](img/9781430239922_Fig02-54.jpg)\n\
  \n**图 2-54.** 新图层被复制出来，悬浮在第一个图层之上。\n\n现在画布上有了两座山丘，尽管看起来只有一座。这是因为你刚刚创建的新图层与第一个图层位置完全相同——新山丘直接叠放在第一座山丘之上。将其移开，你就能看到两座山丘了。\n\
  \n选择`移动工具`。在`选项`栏中，勾选`自动选择`，并从选项菜单中选择`图层`。`自动选择`功能允许`移动工具`在你点击对象时自动选中正确图层上的物体，这非常方便。如果不更改此设置，你需要先在`图层`面板中点击要操作的图层，然后才能移动该图层的内容。同时进行此操作时，请确保`显示变换控件`也已选中。图\
  \ 2-55 展示了`移动工具`选项应有的状态。\n\n![图片](img/9781430239922_Fig02-55.jpg)\n\n**图 2-55.**\
  \ 自动选择图层让移动工具在你点击对象时自动选中正确图层上的物体。\n\n保持`移动工具`选中状态，移动画布上的山丘。这样，下方图层上的第一座山丘就会神奇地显露出来，如图\
  \ 2-56 所示。\n\n![图片](img/9781430239922_Fig02-56.jpg)\n\n**图 2-56.** 移动新复制的山丘，露出下方图层上的原始山丘。\n\
  \n将其水平翻转，使其朝向与第一座山丘相反的方向。从 Photoshop 主菜单中选择`编辑` > `变换` > `水平翻转`。山丘将翻转过来，面向另一侧，如图\
  \ 2-57 所示。\n\n![图片](img/9781430239922_Fig02-57.jpg)\n\n**图 2-57.** 水平翻转新山丘。\n\n\
  现在来更改新山丘的颜色。在`前景色`色块中选择一种深绿色。\n\n选择`油漆桶工具`。点击新山丘内部，它将被填充上新的颜色（图 2-58）。\n\n![图片](img/9781430239922_Fig02-58.jpg)\n\
  \n**图 2-58.** 选择油漆桶工具并点击新山丘内部以更改其颜色。\n\n选择`移动工具`，将山丘移至画布左下角，如图 2-59 所示。\n\n![图片](img/9781430239922_Fig02-59.jpg)\n\
  \n**图 2-59.** 将新山丘移到其位置上。\n\n你创建的这座颜色更深的新山丘应位于第一座山丘之后，这样看起来就像在远处更远一点的地方。让我们移动它的图层，使其位于第一座山丘图层下方。\n\
  \n在`图层`面板中，将`山丘 2`图层拖拽到`山丘 1`图层下方。松开鼠标，现在你应该能看到深绿色山丘位于浅绿色山丘之后，如图 2-60 所示。\n\n![图片](img/9781430239922_Fig02-60.jpg)\n\
  \n**图 2-60.** 将山丘 2 拖拽到山丘 1 下方，以重新排列画布上山丘的图层顺序。\n\n能够像这样重新排列图层，是 Photoshop 最基本却最强大的技巧之一。\n\
  \n你的山丘看起来更好了，但让我们更进一步：使用一种称为*斜面与浮雕*的技巧，为它们增加一点 3D 效果。\n\n\n\n##### 斜面与浮雕\n\n斜面与浮雕这两种互补效果能使对象呈现浅层立体感。浮雕效果使对象看起来像是压印在表面上，而斜面效果则让它显得略微凸起于表面。图\
  \ 2-61 展示了斜面与浮雕效果。\n\n![Image](img/9781430239922_Fig02-61.jpg)\n\n**图 2-61.** 斜面与浮雕效果\n\
  \n在 Photoshop 中应用此类效果时，需要牢记一个重要概念：你并非将效果直接应用于你绘制的实际图像，而是应用于包含该对象的图层。这就是为什么它们被称为图层效果。该图层上的任何图形元素都会受到你应用于该图层的所有效果的影响。这与许多其他图形和绘图软件不同，那些软件中效果是直接应用于图形对象的。\n\
  \n那么，现在为你的山丘应用斜面效果。选择`Hill 1`图层，然后从`FX`菜单中选择`斜面与浮雕`，如图 2-62 所示。\n\n![Image](img/9781430239922_Fig02-62.jpg)\n\
  \n**图 2-62.** 从`FX`菜单中选择`斜面与浮雕`。\n\n此时会打开`图层样式`窗口。你在之前处理渐变时见过这个窗口。但现在选中了`斜面与浮雕`选项，这样你就可以应用其中任何一种效果了。\n\
  \n从`样式`菜单中选择`内斜面`。确保已勾选`预览`选项，这样你就能看到更改对画布上图形的影响。尝试调整各种设置，直到获得你喜欢的效果。如果取消勾选“使用全局光”选项，效果会更加显著。图\
  \ 2-63 展示了我`图层样式`窗口的设置情况，图 2-64 则显示了山丘应用斜面效果后的结果。但无论你怎么做，现在都先别点`确定`按钮！\n\n![Image](img/9781430239922_Fig02-63.jpg)\n\
  \n**图 2-63.** `图层样式`窗口允许你为选定图层设置并应用`斜面与浮雕`效果。\n\n![Image](img/9781430239922_Fig02-64.jpg)\n\
  \n**图 2-64.** 完成后的斜面效果\n\n创建斜面与浮雕效果很大程度上就是不断调整设置，直到找到你喜欢的效果为止。\n\n保存这个图层样式，以便你能将其应用于第二个山丘。点击`图层效果`窗口中的`新建样式`按钮。会弹出一个`新建样式`窗口。输入名称`Hill`，然后点击`确定`按钮（图\
  \ 2-65）。\n\n![Image](img/9781430239922_Fig02-65.jpg)\n\n**图 2-65.** 保存此样式以便日后使用。\n\
  \n在`图层样式`窗口中点击`确定`，将斜面效果应用于山丘。\n\n接下来，你将把同样的效果应用于第二个山丘。\n\n选择`Hill 2`图层。\n\n打开`样式`面板，你可以在与`颜色`面板相同的窗口组中找到它。`样式`面板以缩略图列表形式显示了一些可以应用于图层的预设样式。列表中的最后一个就是你刚才创建并保存的`Hill`样式。点击它，你会看到样式立即应用于第二个山丘。图\
  \ 2-66 展示了你将看到的效果。\n\n![Image](img/9781430239922_Fig02-66.jpg)\n\n**图 2-66.** 在`样式`面板中点击`Hill`样式，将已保存的样式应用于第二个山丘。\n\
  \n你已完成山丘的处理，因此锁定`Hill 1`和`Hill 2`图层，以防止在后续步骤中意外编辑它们。选择要锁定的图层，然后点击挂锁按钮。图层上会出现挂锁图标（图\
  \ 2-67）。\n\n![Image](img/9781430239922_Fig02-67.jpg)\n\n**图 2-67.** 锁定图层以防止进一步编辑。\n\
  \n现在你有了一个包含天空和山丘的漂亮背景场景。下一节，你将为前景添加一些方块，并学习如何使用选区来制作形状。\n\n##### 使用矩形选框工具制作方块\n\n\
  到目前为止，我向你展示了两种用 Photoshop 制作形状的方法。第一种是使用`矩形`形状工具来制作天空。第二种是使用`钢笔工具`创建路径并用颜色填充路径。在本节中，你将学习第三种方法：如何创建选区并用颜色填充它。\n\
  \n你可以在`工具`面板顶部找到 Photoshop 的选区工具。它们通常用于选择照片的某个区域进行编辑，例如复制、粘贴或删除部分内容，但它们也是一种快速简便的制作形状的方法。你将使用`矩形选框工具`为游戏世界场景的前景制作一些方块。\n\
  \n点击`图层`面板中的新建图层按钮，在山丘图层上方创建一个新图层。将其命名为“Box”（图 2-68）。\n\n![Image](img/9781430239922_Fig02-68.jpg)\n\
  \n**图 2-68.** 在之前的图层上方创建一个新图层。\n\n从`工具`面板中选择`矩形选框工具`。你将用它来制作精确尺寸为 50 x 50 像素的方形块。`选项`栏允许你创建固定大小的选区。找到`样式`选项，并从菜单中选择`固定大小`。输入`宽度`为“50\
  \ px”和`高度`为“50 px”。添加“px”（代表像素）很重要；否则，如果你没有在 Photoshop 首选项中更改默认单位，Photoshop 可能会认为你使用的是以厘米为单位的尺寸。确认你的`选项`栏看起来像图\
  \ 2-69。\n\n![Image](img/9781430239922_Fig02-69.jpg)\n\n**图 2-69.** 选择`矩形选框工具`并将其设置为\
  \ 50 x 50 像素的固定大小。\n\nPhotoshop 称这些为“选框”选择工具，因为当你使用它们选择内容时，选区会被一圈移动的动画线条包围，看起来有点像电影或剧场霓虹灯广告牌的闪光。它们的另一个俏皮名称是“行军蚁”。\n\
  \n点击画布。一个由虚线移动边框界定的正方形会出现在画布上，如图 2-70 所示。它的尺寸正好是 50 x 50 像素。\n\n![Image](img/9781430239922_Fig02-70.jpg)\n\
  \n**图 2-70.** 点击画布添加一个 50 x 50 像素的选择方块。\n\n这就是一个选区。如果你以常规方式使用它，可以复制选区下方的内容，或者将图像粘贴到其中。相反，你将用它来制作一个方块游戏盒子。在接下来的几个步骤中，你将为其添加黑色外边框，用颜色填充，并赋予它斜面效果。\n\
  \n右键单击并选择选项菜单中的`描边`。在制作图形时，你可以将“描边”理解为 Photoshop 中表示“轮廓”的术语。（不过在其他上下文中，描边的用途远不止是勾勒形状。）会打开一个新窗口，允许你设置边框选项。将宽度设置为\
  \ 5 px，并选择一个漂亮的黑色。完成后点击`确定`，你会看到选区现在有了黑色边框。图 2-71 展示了效果。\n\n![Image](img/9781430239922_Fig02-71.jpg)\n\
  \n**图 2-71.** 为选区添加边框。\n\n接下来，添加填充颜色。右键单击并从选项菜单中选择`填充`。会打开一个`填充`窗口。在`内容`部分从菜单中选择`颜色`。标准的`拾色器`窗口会打开，让你选择颜色。选择一种亮红色，完成后在`填充`窗口中点击`确定`。方形选区现在被你选择的颜色填充了。图\
  \ 2-72 展示了你的方块现在应该看起来的样子。\n\n![Image](img/9781430239922_Fig02-72.jpg)\n\n**图 2-72.**\
  \ 为选区添加填充颜色。\n\n你也可以通过选择前景色，然后使用`油漆桶工具`在选区内部点击来填充选区。\n\n\n\n如果你想用渐变填充选区，请使用渐变工具（它与油漆桶工具位于同一个按钮组中）。使用时，在选区中点击并拖动，选区将使用前景色和背景色填充渐变。你可以通过在选项栏中双击渐变预览来编辑渐变。\n\
  \n现在你已经有了一个带黑色边框的红色正方形。但请注意，选区仍然处于激活状态。你不再需要它了，所以请取消选区。从主菜单中选择`选择`→`取消选择`，或按`Ctrl+D`（Windows）或`Command+D`（Mac\
  \ OS X）来取消选择。选框（即那些闪烁的黑线）将会消失。\n\n接下来，为你的红色正方形添加一个斜面效果。点击图层调板底部的`FX`按钮，使用你在上一节学到的技术为正方形应用斜面效果。你的正方形看起来可能会像图\
  \ 2-73 所示。\n\n![Image](img/9781430239922_Fig02-73.jpg)\n\n**图 2-73.** 添加斜面效果。\n\n\
  现在你有了一个很棒的通用游戏方块。再复制几个来装饰你场景的前景。\n\n使用移动工具选择正方形。将鼠标悬停在正方形上，并按住`Alt`（Windows）或`Option`（Mac\
  \ OS X）键。你会看到鼠标图标变为双箭头。按住鼠标左键并拖动。Photoshop 会在其自身的新图层上创建一个完全相同的正方形副本。（你也可以像上一步那样复制图层，但这没那么有趣！）图\
  \ 2-74 展示了这一技巧。\n\n![Image](img/9781430239922_Fig02-74.jpg)\n\n**图 2-74.** 按住`Alt`（Windows）或`Option`（Mac\
  \ OS X）并拖动以复制正方形。\n\n使用同样的技巧再制作 10 或 15 个这样的正方形。使用移动工具将它们沿着画布底部排列，就像一堆积木块。（确保在选项栏中勾选了移动工具的`自动选择图层`选项。这样只需点击画布上的正方形即可轻松选择其图层。）完成后的最终场景看起来会像图\
  \ 2-75 所示。\n\n![Image](img/9781430239922_Fig02-75.jpg)\n\n**图 2-75.** 最终的背景场景\n\n\
  当你在画布上复制和移动这些小方块时，注意不要点击方块正中央的小十字标记。这是决定方块旋转中心的位置。如果你想要让对象偏离中心轴旋转，实际上可以移动这个中心点，这通常非常有用。但是，如果你在尝试复制方块时意外地从中心十字标记拖拽，复制操作将被禁用，取而代之的是你发现自己在画布上随意拖动这个小小的中心十字标记。要重置以便重新开始复制，请双击该方块。最好从方块的内角开始拖拽，这样可以避免意外调整它们的大小或移动它们的中心位置。\n\
  \n现在，以适合 Flash 游戏使用的格式保存你的工作。\n\n##### 保存图像\n\n要在 AS3.0 游戏或程序中使用你刚刚创建的图像（你将在下一章进行操作），你必须将其保存为\
  \ PNG 格式。PNG 是一种*压缩文件格式*。压缩文件具有非常小的文件体积，这意味着它们可以在互联网上快速加载，并且占用的硬盘空间很小。PNG 是一种高质量图像文件格式，体积小，但能保留图像中的透明区域。（其他压缩文件格式如\
  \ JPEG 或 GIF 不能保留透明度，尽管 GIF 具有有限的 1 位透明度，但它不能保留任何不透明度的渐变变化，例如阴影或半透明渐变效果中的变化。）\n\n\
  PNG 文件的唯一问题是无法编辑它们。这意味着如果你决定对图像进行更改，你在 Photoshop 中工作时保存的所有图层、样式或其他设置都将丢失。\n\n出于这个原因，你需要保存图像文件的两个版本。第一个版本应为\
  \ PSD（Photoshop 文档）格式。PSD 文件体积较大，但你可以对它们进行修改。第二个文件应为压缩后的 PNG 文件。你将无法编辑此文件，但它是你将在游戏中使用的文件。如果你需要对图像进行任何更改，请先在\
  \ PSD 文件中进行修改，然后从该 PSD 文件创建 PNG 文件。\n\n以下是保存你的工作并创建将在下一章使用的 PNG 文件的方法：\n\n从 Photoshop\
  \ 的主菜单中选择`文件`→`存储为`。如果这是你第一次保存工作，请将其命名为\"background\"，并确保在格式菜单中选择\"Photoshop\"。在你的电脑上选择一个位置保存文件，然后点击保存按钮。（如果此时弹出\"\
  最大化兼容性\"窗口，直接点击`确定`忽略即可。）\n\n接下来，将图像保存为 PNG 文件。从主菜单中选择`文件`→`存储为 Web 和设备所用格式`。将打开一个新窗口，其中显示许多用于优化图像质量和文件大小的不同设置。在此窗口右上角的预设菜单中，选择`PNG-24`。图\
  \ 2-76 显示了此步骤的样式。点击保存按钮。将打开一个新窗口，允许你在需要时更改文件名并选择保存位置。为文件选择一个位置，然后点击保存按钮。\n\n![Image](img/9781430239922_Fig02-76.jpg)\n\
  \n**图 2-76.** 存储为 Web 和设备所用格式窗口允许你将工作保存为压缩的 PNG 文件。\n\n你现在保存了图像文件的两个版本：一个可供编辑的 PSD\
  \ 版本，以及一个可在 AS3.0 游戏和程序中使用的 PNG 版本。\n\n检查你保存这些图像的位置。你应该会看到这两个文件：\n\n*   `background.psd`\n\
  *   `background.png`\n\n你已经为你的游戏世界准备好了背景图像；现在你可以运用你所有新的 Photoshop 技能来制作一个游戏角色了。\n\
  \n#### 制作游戏角色\n\n如果你已经完成了本章中的所有练习和指导，那么你现在已经掌握了一套使用 Photoshop 制作游戏图形的综合技能。Photoshop\
  \ 的功能远不止这些，但就绘图和制作图形而言，我几乎已经涵盖了所有内容。剩下的主要就是练习所学内容、磨练技能以及调整一些设置。\n\n让我们运用这些技术来制作一个游戏角色。我会指导你创建新文件，并在这个过程中给你一些指点，但我会让你自己完成大部分工作。嘿，你拥有技能、想象力，以及至关重要的历史记录面板，所以别害怕。大胆去做吧！\n\
  \n\n\n#### 创建新文件\n\n在开始绘制之前，先打开一个新的 Photoshop 文档文件。\n\n从 Photoshop 的主菜单中选择 `文件`\
  \ ![Image](img/U001.jpg) `新建`。\n\n将此新文件命名为“角色”。将宽度和高度均设置为 100 像素。\n\n非常重要的一点是，将`背景内容`设置为透明。这样，你绘图中任何透明或未填充的区域都将允许背景透出。你可以通过检查背景是否充满了棋盘格图案来判断自己是否在透明背景上绘图。\n\
  \n图 2-77 展示了新窗口应有的样子。\n\n![Image](img/9781430239922_Fig02-77.jpg)\n\n**图 2-77.**\
  \ 创建一个尺寸为 100 x 100 的新文件。将背景内容设置为透明。\n\n点击`确定`按钮，打开一个新的空白画布。\n\n画布会有点小，因此从主菜单中选择`视图`\
  \ ![Image](img/U001.jpg) `放大`，直到找到你满意的大小。更便捷的方法是，按住 `Ctrl`（Windows）或 `Command`（Mac\
  \ OS X）键，同时按键盘上的加号（`+`）和减号（`-`）键来放大和缩小。\n\nPhotoshop 中还有更多放大选项。你可以使用`工具`面板中的放大镜，在你想要放大的图像部分周围拖拽出一个选区。双击放大镜可使图像恢复到正常放大比例。在画布的左下角，你会看到一个带有百分比的数字——那就是你当前的缩放比例。你可以在此处输入任何你喜欢的缩放百分比。你也可以从`选项栏`正上方的`应用程序栏`更改缩放百分比。\n\
  \n现在，你可以开始绘制了！\n\n#### 绘制你的角色\n\n你的新画布是 100 x 100 像素的正方形。在绘制游戏角色时，尽量填满画布边框内的所有空间。这一点在本节后面的章节中尤其重要，以便让你的游戏角色的边缘看起来能够接触到游戏世界的边缘。\n\
  \n仅使用本章中的技术，图 2-78 展示了我创建的游戏角色。\n\n![Image](img/9781430239922_Fig02-78.jpg)\n\n\
  **图 2-78.** 一个游戏角色\n\n请注意，背景充满了灰色和白色的棋盘格图案。这表明背景是透明的，这正是让游戏世界从角色边缘透出所需要的。如果你在创建新文件时选择了`背景内容：透明`，你的\
  \ Photoshop 画布就会看起来像这样。如果你忘了这样做，可以通过点击`背景`图层中的眼睛图标使其透明。\n\n在处理这个角色的过程中，你将学到很多关于\
  \ Photoshop 的知识，并且完成后你很可能还会产生更多问题。让我们再看看一些可能对此项目有帮助的技巧。\n\n##### 制作圆形\n\n圆形？是的，当然！到目前为止，本章中你还没有制作过任何圆形形状，但它们非常容易制作。只需选择`圆形工具`（与`矩形工具`属于同一按钮组）或`椭圆选框工具`（与`矩形选框工具`属于同一按钮组）。然后按照制作矩形形状时使用的相同技巧操作即可。按住鼠标拖动的同时按下\
  \ `Shift` 键，可以将圆形强制变为正圆。按住鼠标拖动的同时按下 `Alt`（Windows）或 `Option`（OS X）键，可以从圆心开始绘制圆形。\n\
  \n##### 链接与编组图层\n\n有时，你的图形会包含涉及跨多个图层形状的复杂特征。在这些情况下，将所有这些图层作为一个整体来操作会非常有用。Photoshop\
  \ 有两个功能可以帮助你实现这一点：链接图层和编组图层。\n\n通过链接图层，你可以只选择其中一个图层，就能选中所有链接图层上的图形。然后，你可以将这些图层作为一个整体进行移动、调整大小或旋转。当我在处理我的猫咪角色时，我将构成猫眼睛的白色和黑色形状链接了起来。这使得在画布上移动眼睛变得很容易，因为我不需要分别选择黑色和白色部分。\n\
  \n要链接图层，请按住 `Shift` 键并点击所有你想要链接的图层（按住 `Shift` 键可以让你选择多个项目）。然后点击`图层`面板底部的链条按钮。图 2-79\
  \ 对此进行了说明。\n\n![Image](img/9781430239922_Fig02-79.jpg)\n\n**图 2-79.** 链接图层以将它们作为一个整体进行操作。\n\
  \n另一个选项是编组图层。通过编组图层，你可以在`图层`面板中创建一个文件夹，并将相关的图层组织到其中。然后你可以打开和关闭这个文件夹，以减少`图层`面板中的杂乱。\n\
  \n要编组两个或更多图层，请按住 `Shift` 键并用鼠标左键点击选择这些图层。从 Photoshop 的主菜单中选择`图层` ![Image](img/U001.jpg)\
  \ `图层编组`。然后你会看到你选择的图层被组织到`图层`面板中的一个文件夹里。点击文件夹名称旁边的小三角可以打开和关闭它。给这个文件夹起一个名字，以便提醒你里面有哪些图层。图\
  \ 2-80 展示了我如何将猫咪角色的脚部图层组织到它们自己的文件夹中。\n\n![Image](img/9781430239922_Fig02-80.jpg)\n\
  \n**图 2-80.** 将相关图层编组以减少图层面板中的杂乱。\n\n创建组之后，你可以通过按住 `Alt`（Windows）或 `Option`（Mac\
  \ OS X）键并将图层拖入组中，将图层移到组里。\n\n要取消图层编组，请选择组的名称，然后从 Photoshop 的主菜单中选择`图层` ![Image](img/U001.jpg)\
  \ `取消图层编组`。\n\n##### 保存你的游戏角色\n\n当你完成角色的制作后，按照保存背景图像时使用的相同步骤进行保存。确保保存文件的两个版本：PSD\
  \ 文件和 PNG 文件。确保这两个文件分别命名为 `character.psd` 和 `character.png`。\n\n### 制作按钮\n\n在第 3\
  \ 章中，你将构建一个互动玩具，通过点击按钮来控制你的游戏角色。你需要一些可以点击的按钮，所以接下来你将制作这些按钮。在第 3 章中，你将向这些按钮附加一些 AS3.0\
  \ 编程代码，以使它们能够工作。\n\n你需要制作六个按钮，它们看起来就像图 2-81 中所示的那样。\n\n![Image](img/9781430239922_Fig02-81.jpg)\n\
  \n**图 2-81.** 六个按钮\n\n制作它们会很容易，因为你可以在一个 Photoshop 文件中完成所有按钮的制作。让我们看看如何操作。\n\n####\
  \ 创建新文件\n\n到现在为止，你应该已经很擅长这个了，但让我们再次回顾一下创建新 Photoshop 文档的基本步骤，以确保你没有遗漏任何重要内容。\n\n\
  从 Photoshop 的主菜单中选择`文件` ![Image](img/U001.jpg) `新建`。\n\n将此新文件命名为“按钮”。\n\n将宽度设置为\
  \ 100 像素，高度设置为 50 像素。\n\n将`背景内容`设置为透明。\n\n点击`确定`按钮，打开一个新的空白画布。\n\n\n\n#### 绘制按钮\n\
  \n在 Photoshop 中，您可以通过两种方式制作正方形或圆形：使用形状工具或选择工具。您在本章中已经使用过这两种方法。\n\n但它们之间有一个重要区别。当您使用选择工具创建形状时，Photoshop\
  \ 会通过在画布上绘制像素（微小的方块）来制作形状。而使用形状工具时则不会这样。形状工具创建的形状是通过 `**矢量**` 制作的，矢量是基于线条的数学公式。无论将形状放大多少倍，您都看不到任何像素。使用矢量制作的形状编辑起来稍微容易一些，因为如果您调整形状大小，Photoshop\
  \ 无需重新计算所有像素的位置，也无需可能轻微扭曲它们。\n\n但矢量形状有一个缺点。默认情况下，您无法将它们与图层效果（如斜角、浮雕或投影）结合使用。这是因为这些图层效果只作用于像素，而非矢量形状。您需要对形状工具选项进行一点小调整，才能使这些图层效果生效。您需要强制形状工具使用像素而不是矢量。在接下来的步骤中，在制作按钮时，我将向您展示如何操作。\n\
  \n1.  从工具面板中选择 `矩形形状`。\n2.  在工具面板的前景色颜色框中选择一种漂亮的亮黄色。\n3.  在选项栏中，点击 `填充像素` 按钮。这是一个神奇的按钮，它能让您使用形状工具绘制像素。\n\
  4.  在画布上绘制一个黄色矩形。在画布的右侧和底部留出大约 4 到 5 个像素的空间。这样您就有空间放置将在后续步骤中添加的投影效果。图 2-82 展示了此过程的外观。\n\
  \n   ![图片](img/9781430239922_Fig02-82.jpg)\n\n   **图 2-82.** 使用 `填充像素` 选项让形状工具使用像素。\n\
  \n   形状现在填充了像素，这意味着您可以使用任何图层效果。在接下来的步骤中，您将添加斜角和浮雕效果。\n\n5.  点击图层面板底部的 `FX` 按钮，然后选择\
  \ `斜角和浮雕`。在 `图层样式` 窗口中进行任何您喜欢的更改，以获得漂亮的斜角效果。\n6.  保持 `图层样式` 窗口打开，点击左侧选项菜单中的 `投影`。投影选项将打开。`**投影**`\
  \ 能为图像添加轻微的阴影效果，增强其 3D 外观。\n\n   设置以下投影选项：\n\n   *   不透明度：75\n   *   角度：120\n  \
  \ *   距离：4\n   *   大小：4\n\n   图 2-83 展示了投影选项的外观。\n\n   ![图片](img/9781430239922_Fig02-83.jpg)\n\
  \n   **图 2-83.** 投影选项\n\n   记住，您可以通过在图层面板中双击效果名称来随时编辑这些效果。\n\n7.  当您对斜角和投影效果的外观满意后，在\
  \ `图层样式` 窗口中点击 `确定`。完成后，您的画布和图层可能看起来像 图 2-84。\n\n   ![图片](img/9781430239922_Fig02-84.jpg)\n\
  \n   **图 2-84.** 应用了斜角和投影效果的按钮\n\n8.  最后，给图层命名，例如“按钮背景”，并锁定图层以防止进一步编辑。\n\n您的按钮几乎完成了；接下来您需要做的就是添加一些文字。\n\
  \n#### 使用文字工具\n\nPhotoshop 的文字工具非常易于使用。您将使用 `横排文字工具` 在按钮上添加单词“up”。\n\n从工具面板中选择 `横排文字工具`。选项栏让您选择字体、大小和颜色。选择一个漂亮的大号字体，并确保颜色为黑色。（默认颜色会是您刚使用的前景色，所以如果您希望文字在按钮背景上可见，需要更改颜色。）\n\
  \n*如果您需要添加沿着画布垂直排列的文字，请选择 `直排文字工具`。*\n\n点击画布并输入单词“up”。一旦您点击画布添加文字，Photoshop 会自动为您创建一个新图层。使用\
  \ `移动工具` 将文字定位到按钮的中心。图 2-85 展示了我的按钮外观以及我使用的文字选项。\n\n![图片](img/9781430239922_Fig02-85.jpg)\n\
  \n**图 2-85.** 设置文字工具选项并向按钮添加一些文字。\n\n当您向画布添加文字时，Photoshop 会自动为其创建一个新图层，图层名称与您输入的文本相同。但是，只有在您切换工具（例如选择\
  \ `移动工具`）然后再添加更多文字时才会发生这种情况。如果您不切换工具，Photoshop 会将新文字添加到同一个图层。在这种情况下，请手动点击图层面板底部的\
  \ `创建新图层` 按钮来创建新图层。\n\n一个按钮完成了。现在让我们制作剩下的按钮。\n\n\n\n#### 制作更多按钮\n\n你需要总共制作六个按钮，按钮标签分别为`up`、`down`、`grow`、`shrink`、`vanish`和`spin`。所有按钮外观完全一致，唯一区别在于文本。你可以将每个按钮存为独立的`PSD`文件，这没有问题，但最终会得到六个需要管理的`Photoshop`文件以及配套的六个`PNG`文件。有一种方法可以简化这个过程。\n\
  \n我将向你展示一个经典技巧：将所有按钮保存在一个`PSD`文件中，然后利用这个文件生成所需的六个`PNG`文件——每个按钮对应一个。\n\n其原理如下：按钮背景放在最底层，背景上方放置六个文本图层，每个图层对应不同的按钮标签文本。所有文本图层默认隐藏（使用眼睛图标），只显示其中一个。这意味着每次只显示一个按钮标签。接着，基于按钮背景和当前可见的文本标签生成该按钮的`PNG`文件。生成后，隐藏当前文本并显示下一个标签所在的图层，再用此状态生成下一个按钮的`PNG`文件。\n\
  \n实践操作时更容易理解，让我们开始吧！\n\n首先，确保你的图层与图 2-86 类似：按钮背景上方应有一个文本图层，且按钮背景图层已锁定。\n\n![Image](img/9781430239922_Fig02-86.jpg)\n\
  \n**图 2-86.** 当前按钮图层状态\n\n点击`up`图层的眼睛图标将其隐藏，画布上的文本会消失。\n\n选择横排文字工具，在画布上输入单词`down`。画布和图层现在应类似图\
  \ 2-87。\n\n![Image](img/9781430239922_Fig02-87.jpg)\n\n**图 2-87.** 在隐藏图层上方添加新文本。\n\
  \n如果想确保新文本对齐，可临时显示`up`图层，将`down`文本直接置于其上方，完成后再隐藏`up`图层。\n\n接下来，隐藏刚创建的`down`图层，使画布上的文本消失。\n\
  \n再次选择横排文字工具，在画布上输入单词`grow`。画布和图层现在应类似图 2-88。\n\n![Image](img/9781430239922_Fig02-88.jpg)\n\
  \n**图 2-88.** 添加另一层按钮文本，该层应是唯一可见的。\n\n是否已看出规律？所有按钮标签都按此方式添加，但每次只显示一个。重复此过程，直到添加完所有需要的按钮文本。\n\
  \n继续添加`shrink`、`vanish`和`spin`的文本图层。完成后，除`up`图层和`button background`图层外，其他所有图层均设为不可见。最终图层和画布应如图\
  \ 2-89 所示。\n\n![Image](img/9781430239922_Fig02-89.jpg)\n\n**图 2-89.** 完成后的按钮\n\n\
  #### 保存工作并生成`PNG`文件\n\n现在你拥有一个包含所有按钮图形所需的`Photoshop`文档。首先将其保存为`PSD`格式，以免丢失辛苦成果。从主菜单中选择“文件”![Image](img/U001.jpg)“存储为”，选择一个方便的位置保存文件。\n\
  \n现在可以用此文件生成六个`PNG`文件，每个按钮对应一个。从`up`按钮开始。\n\n选择“文件”![Image](img/U001.jpg)“存储为 Web\
  \ 和设备所用格式”，将预设选项设为`PNG-24`。\n\n如果“存储为 Web 和设备所用格式”选项变灰无法选择，可能是误用了 32 位颜色模式。请选择“图像”![Image](img/U001.jpg)“模式”，然后选择`16\
  \ 位/通道`或`8 位/通道`。`Photoshop`会询问是否合并图层——**不要合并**！合并图层会将所有图层压缩为一层，导致无法选择性隐藏和显示。点击“不合并”按钮。“存储为\
  \ Web 和设备所用格式”选项即可重新使用。\n\n点击“存储”按钮，将`PNG`文件命名为`upButton`。确保小写字母`u`、大写字母`B`，且单词之间无空格。这是第\
  \ 1 章讨论的小驼峰命名法（`lowerCamelCase`）示例。从现在起，本书中所有图像都将采用此命名规范。\n\n`Photoshop`主工作区将重新可见。点击`up`图层的眼睛图标将其隐藏。\n\
  \n点击`down`图层的眼睛图标使其可见。此时应仅看到按钮背景上的文本`down`，如图 2-90 所示。\n\n![Image](img/9781430239922_Fig02-90.jpg)\n\
  \n**图 2-90.** 仅保留`down`文本可见。\n\n选择“文件”![Image](img/U001.jpg)“存储为 Web 和设备所用格式”，`PNG-24`选项应已设置。点击“存储”按钮。\n\
  \n选择存储位置，并将新文件命名为`downButton`，遵循相同的小驼峰命名规范。点击“存储”按钮生成`PNG`文件。\n\n是否已看出规律？应该如此！按照相同系统为剩余四个按钮标签创建`PNG`文件，分别保存为`grow.png`、`shrink.png`、`vanish.png`和`spin.png`。\n\
  \n完成后，你的电脑上应保存有`buttons.psd`文件以及六个`PNG`文件。\n\n### 检查工作\n\n本章你完成了很多工作！在继续之前，请双重确认计算机上是否已保存以下文件：\n\
  \n*   `background.psd`文件及其配套的`background.png`文件。\n*   `character.psd`文件及其配套的`character.png`文件。\n\
  *   `buttons.psd`文件及其六个配套的`PNG`文件：`up.png`、`down.png`、`grow.png`、`shrink.png`、`vanish.png`和`spin.png`。\n\
  \n`PNG`文件最为重要，因为下一章你将使用它们，结合`AS3.0`编程代码创建交互游戏世界。图 2-91 展示了这些`PNG`文件应有的样式和文件名。\n\n\
  ![Image](img/9781430239922_Fig02-91.jpg)\n\n**图 2-91.** 本章结束时创建的`PNG`文件\n\n如果文件与此一致，你就可以开始学习第\
  \ 3 章的编程内容了！\n\n### 更多关于`Photoshop`的内容\n\n`Photoshop`还有很多值得学习的地方；本章内容仅触及表面。你已经掌握了开始制作专业级游戏图形所需的大部分重要技巧，这些技能也许已足够。但如果你充满好奇（应该如此！），还有更多内容值得探索。最好的起点可能是\
  \ Adobe 的权威文档《使用`Photoshop`》。你可以从以下链接下载`PDF`文件：\n\n```\nhttp://help.adobe.com/en_US/photoshop/cs/using/photoshop_cs5_help.pdf\n\
  ```\n\n（发布时的最新版本适用于`Photoshop CS5`。如需匹配您所用`Photoshop`版本的文档，请搜索 Adobe 网站。）\n\n《使用`Photoshop`》详尽介绍了`Photoshop`的众多功能，包括本书篇幅无法涵盖的绘画和图像编辑。如果你对`Photoshop`工作原理或功能的任何细节有疑问，都能在该文档中找到答案。\n\
  \n你还可以在 Adobe `Photoshop`帮助网站找到更多资源，包括同一文档的`HTML`版本：\n\n```\nhttp://help.adobe.com/en_US/photoshop/cs/using/index.html\n\
  ```\n\n如果已完成本章学习，你将能够充分利用这些资源，并顺利踏上成为`Photoshop`专家的道路。\n\n\n\n### 本章小结\n\n如果你刚开始学习计算机图形学，希望你享受了本章关于绘制基本游戏对象和角色的内容。Photoshop\
  \ 的绘图和设计工具让你拥有极大的控制权，只需稍加练习就能轻松上手。对于设计游戏角色和环境来说，它们非常理想。\n\n我快速介绍了大量新知识，所以如果你是第一次使用\
  \ Photoshop，不妨稍作休息，进一步尝试探索。创建一个新的空白 `PSD` 文件，绘制一些对象和角色。你很快就能熟练操作，如果你和我一样，Photoshop\
  \ 很快就会成为你最喜爱的绘图应用程序。第 7 章 将介绍另一种图形和插画应用——Adobe Illustrator，使用起来同样乐趣无穷。\n\n本章中，你制作了一些基础的游戏图形。下一章，你将通过一些简单的编程魔法让这些图形生动起来。\n\
  \n![图片](img/chap.jpg)\n\n## 第 3 章\n\n## 编程对象\n\n在第 2 章中，你创建了一个游戏角色、一个游戏世界背景和一些按钮。本章将教你如何运用\
  \ AS3.0 编程代码来对这些图像进行编程，让它们发挥实际作用！\n\n本章涵盖了一些非常重要的 AS3.0 编程概念和技巧：\n\n- 如何将图像文件加载到\
  \ Flash Player 中\n- 如何在舞台上定位对象\n- 什么是变量以及如何使用它们\n- 变量类型\n- 如何创建可被编程代码定位的对象\n- 点语法\n\
  - 方法调用与函数定义\n- 方法参数与形参\n- 事件侦听器\n- 如何编程按钮以控制舞台上的对象\n\n完成本章后，你将拥有一个完全可交互的游戏角色，通过点击按钮即可控制它。图\
  \ 3-1 展示了你将能够实现的效果。\n\n![图片](img/9781430239922_Fig03-01.jpg)\n\n**图 3-1.** 用按钮控制游戏角色。\n\
  \n### 但我有点害怕编程！\n\n尽管本章会介绍很多重要的编程理论，但你最需要掌握的核心内容是：你在 ActionScript 编辑窗口中输入的编程代码如何改变舞台上对象的行为。理论固然重要，但如果你一时不能完全理解，也不必担心。这些知识需要大量练习才能深入掌握。我们将通过许多实际示例来学习，你也会有很多机会来实践新技能。慢慢来，在感觉准备好之前不要急于求成。\n\
  \n正如任何司机都应该对汽车引擎的工作原理有个大致了解一样，如果你只是想开车，并不需要成为机械工程师。如果你以后对代码的某些细节有具体疑问，随时可以回头查阅这些理论。只要你大致理解输入的代码如何影响舞台上的对象，并能自信地在项目中使用这些代码，你就已经胜券在握。\n\
  \n请始终牢记，编程是一种帮助你表达自我的创造性工具，就像画笔之于艺术家。它可以帮助创作绘画，但如果没有艺术家的想象力——也就是你——它便毫无用处。\n\n本章实际上分为两个部分。第一部分，我将教你如何从文件中加载图像并在\
  \ Flash Player 中显示它们。第二部分，我将教你如何对对象进行编程，让它们活起来。\n\n那么，我们如何获取在第 2 章中创建的图像，并在 Flash\
  \ Player 中显示它们呢？\n\n### 加载和显示图像\n\n在开始任何编程之前，我们先来看看需要解决的问题。\n\n在你的电脑上的某个位置，有一些 `PNG`\
  \ 文件，你想在 Flash Player 窗口中显示它们。我们如何将它们从所在的文件夹中提取到 Flash Player 中？图 3-2 展示了我们的难题。\n\
  \n![图片](img/9781430239922_Fig03-02.jpg)\n\n**图 3-2.** 如何将图像文件加载到 Flash Player 中？\n\
  \n这实际上是一个四步问题：\n\n首先，我们需要知道图像在电脑上的存储位置，并获取其地址。\n\n接着，你需要将图像的地址发送给一个称为**加载器**的东西。加载器是一个临时容器，它利用地址从电脑上的任何位置将文件加载到你的程序中。\n\
  \n图像进入加载器后，下一步是将其复制到一个 `Sprite` 中。还记得精灵吗？我们在第 1 章中简单讨论过它们。精灵能够创造游戏魔法，它们将成为你游戏的核心。你可以把精灵看作一个包含图像的盒子，它知道如何与游戏的其他部分通信。当图像被复制到\
  \ `Sprite` 中后，你可以为其附加 AS3.0 编程代码，从而完全控制它在 Flash Player 中的行为。\n\n最后一步是将该 `Sprite`\
  \ 添加到**舞台**上。舞台就是你看到的空白 Flash Player 窗口。舞台是所有动作发生的地方。只有将游戏精灵添加到舞台上，你才能看到它们。\n\n\
  所以，首先你需要获取图像的地址，用加载器检索图像，将其复制到 `Sprite` 中，最后添加到舞台。接下来，我们将用 AS3.0 代码完成所有这些步骤。图 3-3\
  \ 说明了这个基本概念。\n\n![图片](img/9781430239922_Fig03-03.jpg)\n\n**图 3-3.** 在 Flash Player\
  \ 中加载和显示图像的一般过程\n\n> **注意：** 本书大部分项目将使用 `Sprite` 对象，但你也应该知道还有另外两种选择。图像加载后，你还可以将其复制到\
  \ `MovieClip` 或 `Bitmap` 中。本书不会涉及 `Bitmap` 对象，但你可以在下载章节“使用 Flash Professional 并发布你的游戏”中了解\
  \ `MovieClip` 对象的所有内容。`MovieClip` 对象与 `Sprite` 对象完全相同，唯一区别在于前者可以包含预先规划好的动画场景。\n\n\
  \n\n#### 设置新的 AS3.0 项目\n\n在开始编程之前，我们将创建一个新的 AS3.0 项目，并将我们在第 2 章中创建的图像文件复制到其项目目录中。\n\
  \n在你的 IDE（Flash Builder 或 Flash Develop）中创建一个新的 ActionScript 项目，并将其命名为“GameWorld”。如果你对如何创建\
  \ AS3.0 项目还有些模糊，请回顾一下第 1 章。如果你使用的是 Flash Builder，你的项目目录将类似于图 3-4。\n\n*注意：另外，如果你使用的是\
  \ Flash Builder，你可以从本章的源文件中导入 `GameWorldSetup` 文件夹。该文件夹包含了我们将用于启动此项目的基础设置文件，其中包括所有示例图像。要导入项目到\
  \ Flash Builder，请从 Flash Builder 的主菜单中选择 `File` ![Image](img/arrow.jpg) `Import\
  \ Flash Builder Project`。在打开的新窗口中选择 `Project folder`。浏览到该文件夹，选中它，然后点击 `Open` 按钮。在导入窗口中点击\
  \ `Finish` 以加载项目。*\n\n*但是，请抵制这种诱惑！在你当前的学习阶段，你需要通过系统地手动键入代码来练习。这是深入理解代码并与之建立联系的最佳方式。此外，在键入代码时你肯定会犯一些小错误，你需要了解这些错误是什么以及如何修复它们。*\n\
  \n![Image](img/9781430239922_Fig03-04.jpg)\n\n**图 3-4.** 使用 Flash Builder 创建新 ActionScript\
  \ 项目时的默认项目目录\n\n在 `GameWorld` 文件夹中，创建一个名为 `images` 的新子文件夹。将你在第 2 章中制作的所有 PNG 文件复制到这个新的\
  \ `images` 文件夹中。你的 `GameWorld` 项目文件夹现在应该看起来像图 3-5。请注意，你的 PNG 图像文件必须与此处显示的命名完全一致，否则后续步骤将无法进行。\n\
  \n![Image](img/9781430239922_Fig03-05.jpg)\n\n**图 3-5.** 创建一个 `images` 文件夹并将 PNG\
  \ 文件复制到其中。\n\n我们现在准备开始添加一些程序代码。这段初始代码的任务只是用一些基本设置来初始化程序，以便我们能够开始工作。你现在可能还无法理解其中的任何内容，但再过几页你就会明白了。先盲目地输入代码，我会在后面解释一切。\n\
  \n将以下代码复制到 ActionScript 编辑器窗口中。\n\n```as3\npackage\n{\n  import flash.net.URLRequest;\n\
  \  import flash.display.Loader;\n  import flash.display.Sprite;\n  import flash.events.MouseEvent;\n\
  \n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\n  public class GameWorld extends Sprite\n  {\n    public function GameWorld()\n\
  \    {\n      trace(\"This is the game world!\");\n    }\n  }\n}\n```\n\n确认你的编辑器窗口看起来像图\
  \ 3-6。\n\n![Image](img/9781430239922_Fig03-06.jpg)\n\n**图 3-6.** 程序的起始部分\n\n编译程序。在\
  \ Flash Builder 中，这意味着点击调试按钮（如果你使用的是 Flash Develop，请选择 `Project` ![Image](img/arrow.jpg)\
  \ `Test Movie`）。你应该会看到一个空白的 Flash Player 窗口以及跟踪消息“This is the game world!”。如果你没有看到此消息或收到了一些错误信息，请仔细检查你是否打错了任何内容，并将你的工作与本章源文件中\
  \ `GameWorldSetup` 项目文件夹内的文件进行比对。\n\n我们现在准备为程序添加核心内容。但在此之前，让我们先了解这些新增代码的作用。\n\n\
  #### 理解设置文件\n\n你会注意到，我们编写的代码与第 1 章中的 `HelloWorld` 程序代码非常相似。你应该能识别出所有主要部分：`package`、加载\
  \ `Sprite` 的 `import` 语句、类定义以及构造方法。它们的结构完全相同。唯一的区别是，我在 `package` 代码块中插入了一些新代码。这些代码很重要，并且在本书的许多项目中你都会用到，所以我们来看看它的作用。\n\
  \n##### import 语句\n\n你从第 1 章中应该记得，`import` 语句用于从库中加载代码。这个库是一个巨大的、海量的预编写代码仓库，是 Flex\
  \ SDK 的一部分。如果你的程序需要执行特定任务，你可以导入这些代码片段中的任何一个来使用。这些“代码片段”被称为**类**。你总能通过其名称以大写字母开头来识别一个类。我们在第\
  \ 1 章中编写的 `HelloWorld` 程序就是一个类，而我们正在本章编写的 `GameWorld` 程序也是一个类。\n\n我们的程序导入了四个类：\n\
  \n```as3\nimport flash.net.URLRequest;\nimport flash.display.Loader;\nimport flash.display.Sprite;\n\
  import flash.events.MouseEvent;\n```\n\n最后面的 `Sprite`、`Loader`、`URLRequest` 和 `MouseEvent`\
  \ 就是这些类的名称。你永远不会看到这些类本身，也不需要看到。它们被无形地导入到你的程序中，并在后台运行。你只需要知道你想使用的类的名称。别担心，我会随时告知你它们具体是什么以及何时需要它们。你很快就会开始识别出这些“常客”。\n\
  \n在类名前面，是用点连接起来的词语，比如 `flash.display` 和 `flash.events`。这些是库中存放这些类的文件夹。\n\n这些 `import`\
  \ 语句的顺序可以任意。\n\n我们可以看到，我们的程序将导入四个类。它们的作用如下：\n\n*   **`Sprite`**：容器，帮助你在舞台上控制和显示图像。\n\
  *   **`Loader`**：一个临时容器，负责从你的项目目录将图像加载到 AS3.0 程序中。\n*   **`URLRequest`**：理解你计算机上的目录位置，例如\
  \ `../images/background.png`。\n*   **`MouseEvent`**：允许你使用鼠标与游戏对象交互的代码。\n\n我们在本章中将要编写的所有代码都需要这些类的帮助。\n\
  \n\n\n##### 使用元数据标签设置 Flash Player\n\n你可能会注意到，编译程序时，会打开一个空白的 Flash Player 窗口。这个\
  \ Flash Player 窗口具有一些你可以控制的属性。例如，你想让它有多大？它的背景颜色应该是什么？它应该以多快的频率更新动画显示？所有这些属性（以及更多其他属性）都通过一个**元数据标签**来控制。在我们的程序中，它看起来像这样：\n\
  \n```actionscript\n[SWF(width=\"550\", height=\"400\",\n  backgroundColor=\"#FFFFFF\"\
  , frameRate=\"60\")]\n```\n\n这段代码创建了一个宽 550 像素、高 400 像素的 Flash Player 窗口。它用白色背景填充\
  \ Flash Player 窗口，并以每秒 60 帧的速度更新画面。\n\n元数据标签用方括号括起来，像这样：\n\n`[Anything inside these\
  \ square brackets is metadata]`\n\n在这个例子中，元数据标签描述了你程序编译后所创建的 SWF 文件的属性。所有 SWF 属性及其赋予的值都包含在内部圆括号中。\n\
  \n`[SWF(set all the swf file properties here)]`\n\n请仔细查看这个元数据标签。你能看出它设置了哪四个属性吗？它们分别是：\n\
  \n-   **width：** Flash Player 窗口的宽度，单位为像素。\n-   **height：** Flash Player 窗口的高度，单位为像素。\n\
  -   **backgroundColor：** Flash Player 窗口的背景颜色。你在这里看到的奇怪字符串 `#FFFFFF` 是一个**十六进制**颜色代码。十六进制代码是一种使用字母和数字组合来描述颜色的标准化方法。`#FFFFFF`\
  \ 是白色的代码。它告诉 SWF 文件在 Flash Player 启动时显示白色背景。\n\n在网上搜索“十六进制颜色表”可以得到一份包含各种颜色及其对应十六进制代码的详尽列表，你也可以在我们第\
  \ 2 章提到的 Photoshop 调色板中找到它们。以下是一些常见颜色的代码：\n\n-   黑色：`#000000`\n-   白色：`#FFFFFF`\n\
  -   红色：`#FF0000`\n-   蓝色：`#0000FF`\n-   绿色：`#00FF00`\n-   黄色：`#FFFF00`\n-   橙色：`#FF9900`\n\
  -   紫色：`#CC33FF`\n\n> **注意：** 你可以将黑色简写为 `#000`，白色简写为 `#FFF`。如果十六进制代码中的所有 6 个字符都相同，那么你只需要使用前\
  \ 3 个字符。\n\n-   **frameRate：** SWF 显示更新的频率。“60”表示每秒更新 60 次，也就是 **每秒帧数** (fps)。这决定了动画显示的流畅度。对于你的游戏来说，30\
  \ 到 60 之间的任何数字都能带来流畅的动画效果。更高的帧率会让你的电脑处理器在显示游戏动画时更费力一些，但画面效果会更好。对于 Flash 游戏来说，60\
  \ 帧/秒的效果很棒，并且对 CPU 的负担也不算太大。\n\n尝试对元数据标签做一些修改，你会立刻在 Flash Player 中看到效果。尝试修改元数据标签中加粗显示的属性值：\n\
  \n```actionscript\n[SWF(width=\"100\", height=\"200\",\nbackgroundColor=\"#000\"\
  , frameRate=\"60\")]\n```\n\n再次编译程序，你会看到 Flash Player 现在只有 100 像素宽、200 像素高，并且填充了黑色背景，如图\
  \ 3-7 所示。完成后，记得将其改回原始值。\n\n![Image](img/9781430239922_Fig03-07.jpg)\n\n**图 3-7.**\
  \ 使用元数据标签更改 Flash Player 中运行的 SWF 属性。\n\n为什么我们把宽度和高度属性设置为 550 和 400？因为这与我们在第 2 章中创建的\
  \ `background.png` 图片文件的尺寸完全相同。当然，你可以为你的游戏使用任何你想要的宽度和高度。\n\n元数据标签还可以用于将图片、声音和字体嵌入到游戏中，我们将在本书后面介绍其中一些用途。然而，我们刚刚介绍的这个\
  \ SWF 元数据标签将是我们编写所有程序的标准配置，你可能不需要更改它的任何属性。\n\n> **请务必确保 SWF 元数据标签紧跟在 import 语句之后，并且正好在类定义之前。这是它在程序中唯一能正常工作的位置。**\n\
  \n##### 加载并显示 `background.png` 图片\n\n现在，我们准备将第一张图片 `background.png` 加载到程序中。让我们向程序添加新代码，看看它是否有效。我将在后续页面中解释代码的每个细节。\n\
  \n将以下加粗文本添加到 `GameWorld.as` 文件中（完成后，你的 ActionScript 编辑器窗口将如图 3-8 所示。请注意，原来的 `trace`\
  \ 指令已被删除。）：\n\n```actionscript\npackage\n{\n  import flash.net.URLRequest;\n  import\
  \ flash.display.Loader;\n  import flash.display.Sprite;\n  import flash.events.MouseEvent;\n\
  \n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\n  public class GameWorld extends Sprite\n  {\n    //声明我们需要的变量\n    public\
  \ var backgroundURL:URLRequest;\n    public var backgroundLoader:Loader;\n    public\
  \ var background:Sprite;\n\n    public function GameWorld()\n    {\n      //将背景添加到舞台\n\
  \      backgroundURL = new URLRequest();\n      backgroundLoader = new Loader();\n\
  \      background = new Sprite();\n\n      backgroundURL.url = \"../images/background.png\"\
  ;\n      backgroundLoader.load(backgroundURL);\n      background.addChild(backgroundLoader);\n\
  \      stage.addChild(background);\n    }\n  }\n}\n```\n\n![Image](img/9781430239922_Fig03-08.jpg)\n\
  \n**图 3-8.** 向程序添加新代码。\n\n> **请记住，任何以双斜杠 `//` 开头的代码行都是注释。它们不是程序的一部分，只是关于代码功能的说明。你不必在程序中包含注释——它们完全不影响程序的运行。**\n\
  \n编译程序。如果 `background.png` 文件位于项目目录中的正确文件夹内，并且你已完全按照此处显示的代码进行复制，你将看到 Flash Player\
  \ 打开并显示背景图片，如图 3-9 所示。\n\n![Image](img/9781430239922_Fig03-09.jpg)\n\n**图 3-9.**\
  \ 程序加载并显示背景图片。\n\n> **如果在编译此代码时收到任何错误消息，请参考第 1 章中关于调试代码的部分，以了解可能出错的原因。在此项目中，你可能会收到一条特别奇怪的错误消息：**\n\
  >\n> `SecurityError: Error #2000: No active security context.`\n>\n> **这完全不是一条有用的错误消息！但我可以确切地告诉你它的含义：你拼错了文件名，或者错误地输入了指向\
  \ `background.png` 文件或其他某个图片文件的路径。**\n\n##### 这是如何工作的？\n\n到目前为止我们使用的程序格式与第 1 章中\
  \ `HelloWorld` 程序使用的格式完全相同。如果你认为对这段代码的基本结构有任何不理解的地方，请参考该章节。这里有许多你以前从未见过的代码行，我将详细介绍它们的工作原理。\n\
  \n\n\n#### 创建精灵和加载器对象\n\n在本章开头，我解释了为了将计算机文件夹中的图像加载到程序中，我们需要三样东西：\n\n- 我们需要知道图像文件的位置。\n\
  - 我们需要一个加载器将其加载到程序中。\n- 我们需要一个精灵来通过编程代码控制图像。\n\n这正是我们新代码的前几行为程序所做的准备。\n\n第一行创建了一个叫做**变量**的东西。这就是这行代码的作用。变量的名称是：\n\
  \n`backgroundURL`\n\n`public var backgroundURL:URLRequest;`\n\n`backgroundURL`将承担一项特殊任务，即告诉程序在你的计算机上哪里可以找到`background.png`文件。\n\
  \n*URL 代表统一资源定位符。是的，我知道这完全是个毫无意义的短语，但你会在各处看到它，所以你需要学会它。它仅仅意味着“到哪里去找文件”。它可以是一个硬盘上的文件路径，也可以是一个网站地址。你经常会看到网站地址被称为\
  \ URL。*\n\n代码接下来创建了另一个变量，叫做`backgroundLoader`。\n\n`public var backgroundLoader:Loader;`\n\
  \n`backgroundLoader`将是我们的加载器对象。它会将图像从计算机文件夹中的位置加载到程序中。\n\n然后代码创建了第三个变量，叫做`background`。\n\
  \n`public var background:Sprite;`\n\n`background`将是我们的精灵对象。我们在程序中将要进行的所有有趣操作都将围绕这个对象展开。\n\
  \n我们还没有真正创建这些对象，只是告诉程序我们已经创建了将存储它们的变量。\n\n仔细看这三行代码，你会发现它们的结构是相同的。还要注意这三行都以分号结尾。这意味着它们*执行某些操作*。执行某些操作的编程代码被称为指令（我们在第\
  \ 1 章中讨论过指令）。你可以通过是否以分号结尾来判断它是否为指令。\n\n用编程术语来说，这些指令被称为**变量声明**。我们已经创建了三个**变量**：\n\
  \n`backgroundLoader`\n`background`\n`backgroundURL`\n\n图 3-10 详细说明了变量声明的结构。\n\n\
  ![Image](img/9781430239922_Fig03-10.jpg)\n\n**图 3-10.** 变量声明\n\n哇，一下子要吸收这么多内容！而且，变量到底是什么？\n\
  \n让我们稍作休息，了解一下变量是什么以及如何使用它们。\n\n##### 变量\n\n你可以把**变量**想象成存储信息的小盒子。每个盒子都有自己的名字，并存储不同类型的信息。\n\
  \n图 3-11 展示了三个虚构的变量：`score`、`name`和`enemy`。每个变量名都与一个包含信息的盒子相关联。\n\n![Image](img/9781430239922_Fig03-11.jpg)\n\
  \n**图 3-11.** 变量就像存储信息的盒子。\n\n如果你需要使用盒子里的信息，只需在程序中的任何地方引用盒子的名称即可。例如，如果你想了解当前分数，使用变量名`score`；程序会将其解释为\
  \ 41。如果你想引用敌人精灵，使用单词`enemy`。\n\n你还可以随时清空盒子并放入新信息。这就是“可变”的含义！\n\n变量就是这样：带有名称的存储容器。\n\
  \n##### 变量类型\n\n如果你要整理许多装满不同类型物品的小盒子，有时了解每个盒子应该包含什么**类型**的信息会很有用。想象一下你有一个糖罐，却不小心把一袋盐倒进去了。当阿姨们来喝茶时，这可能会出问题！你需要确保你装填的是糖罐。\n\
  \n在 AS3.0 中，你可以告诉变量它应该存储什么类型的信息。为此，使用冒号后跟类型名称，如下所示：\n\n`:Sugar`\n\n如果你的厨房存在于 AS3.0\
  \ 的宇宙中，你可以像这样标记橱柜里的容器：\n\n`smallBluePlasticTub:Sugar; glassJar:Salt;`\n\n这种标记可以防止你把错误的东西放进错误的容器，从而毁了茶话会。妈妈会为你感到骄傲的！\n\
  \n图 3-12 展示了你为变量分配类型后，它们可能的样子。这可以防止你将错误类型的物品放入错误的容器中。（在 AS3.0 中，任何由字母组成的信息被称为**字符串**，即“一串字母或单词”。）\n\
  \n![Image](img/9781430239922_Fig03-12.jpg)\n\n**图 3-12.** 为变量分配类型，这样就不会将错误类型的信息或对象放入错误的容器中。\n\
  \n##### 创建空盒子\n\n让我们快速回顾一下我们最初的三行新代码：\n\n`public var backgroundLoader:Loader;`\n\
  `public var background:Sprite;`\n`public var backgroundURL:URLRequest;`\n\n现在它们对你来说是否更清晰了一些？\n\
  \n这些指令正在创建名为`backgroundLoader`、`background`和`backgroundURL`的空存储容器。\n\n这些存储容器在哪里？它们正空置在程序中，等待我们向里面填充内容。如果你能看到它们，它们看起来会有点像图\
  \ 3-13。\n\n![Image](img/9781430239922_Fig03-13.jpg)\n\n**图 3-13.** 三个等待填充内容的空盒子\n\
  \n让我们往这些盒子里放点东西吧！\n\n\n\n##### 创建实例与对象\n\n到目前为止，我们的代码创建了三个空变量。下一步就是往这些\"箱子\"里填充有用的东西。我们要用对象来填充它们。这正是接下来的三个\
  \ `new` 指令所做的事：\n\n```\nbackgroundURL = new URLRequest();\nbackgroundLoader = new\
  \ Loader();\nbackground = new Sprite();\n```\n\n现在，我们的空变量不再为空；它们被来自我们导入的三个类的程序代码填满了。它们变成了有用的对象。对象是编程元素，是类的副本，我们可以通过程序代码来控制它们。\n\
  \n等等，在弄糊涂之前，我们先退一步想想！\n\n请记住，类是库中预先编写好的程序代码的名称。你看不到那段程序代码，也不想看到它，你只需要知道它的类名就能使用它。我们的程序导入了四个类：`URLRequest`、`Loader`、`Sprite`\
  \ 和 `MouseEvent`。这四个类都包含我们程序中需要使用到的专用代码。\n\n同样，请记住，你总能识别出一个类，因为它的首字母是大写的。你能在上面的代码行中看到我们导入的三个类的名称吗？你应该能看到！等号右边是类，左边是变量。图\
  \ 3-14 说明了这一点。\n\n![Image](img/9781430239922_Fig03-14.jpg)\n\n**图 3-14.** 通过类创建新对象\n\
  \n过程是这样的：类被从库中复制出来，其代码被放入变量中。变量中装满了类所包含的所有专用代码，从而赋予了它们源类所拥有的全部能力。“复制”的另一种说法是“创建实例”。AS3.0\
  \ 的术语中，*实例* 指的是任何包含类副本的变量。\n\n这三个变量现在变成了它们所源自类的*实例*。例如，`background` 变量现在是一个 `Sprite`\
  \ 实例，而 `backgroundLoader` 变量现在是一个 `Loader` 实例。\n\n这三行代码都包含了关键字 `new`。`new` 关键字的职责是“创建类的一个新实例”。\n\
  \n变量名后面紧跟的是等号。等号的职责是将类的新实例赋值给变量。\n\n*在继续深入之前，让我们仔细看看这个等号的确切用途。在 AS3.0 中，等号被称为**赋值运算符**，因为它用于将等号右边的值赋给左边的变量。这与数学中等号的使用方式截然不同，这种差异常常让新手程序员犯糊涂。在数学中，等号表示“等于”。在编程中，等号表示“获取……的值”。*\n\
  \n*这里有一个非常简单的例子。假设你有一个变量，想在游戏中用来跟踪玩家的得分。我们就叫它 `playersScore`。假设游戏中某个玩家得了 12 分，你想要游戏记住这个数字，以便判断玩家表现如何。你可以用等号将数字\
  \ 12 复制到 `playersScore` 变量中，就像你把重要数字记在笔记本上供日后参考一样。代码可能看起来像这样：*\n\n```\nplayersScore\
  \ = 12;\n```\n\n*AS3.0 会直接将其解释为：“`playersScore` 变量获取值 12。” 现在，每当程序看到 `playersScore`\
  \ 变量时，就会亮起一盏小灯，并想：“啊哈！那意味着 12！”*\n\n图 3-15 精确地说明了这个过程是如何工作的。\n\n![Image](img/9781430239922_Fig03-15.jpg)\n\
  \n**图 3-15.** 使用 `new` 关键字创建类的实例\n\n归根结底，我们的三个空变量不再为空。它们充满了我们可以在程序中访问的程序代码。\n\n\
  - `backgroundURL` 中装满了 `URLRequest` 类的一个副本。\n- `backgroundLoader` 中装满了 `Loader`\
  \ 类的一个副本。\n- `background` 中装满了 `Sprite` 类的一个副本。\n\n图 3-16 展示了这些变量现在被填充了什么内容。\n\n\
  ![Image](img/9781430239922_Fig03-16.jpg)\n\n**图 3-16.** 变量现在是类的实例。它们变成了对象。\n\n这个过程的结果是，我们的变量被转换成了对象。对象是类的实例（副本），你可以通过程序代码来定位它。对象是使用\
  \ AS3.0 编程的核心。\n\n*对象还是变量？*\n\n*请记住，变量只是一个空盒子。当类的实例被复制到其中时，它就变成了一个对象。这就像毛毛虫变成蝴蝶一样。*\n\
  \n*所有对象最初都是不起眼的变量，但并非所有变量都会变成对象。在本节中，我将使用**变量**这个名称来指代任何包含单一项普通数据的东西。以下是一些例子：*\n\
  \n```\nplayersScore = 14;\nname = \"Player's name\";\n```\n\n*这些是用于存储单个信息片段的简单容器。*\n\
  \n*我将使用**对象**这个名称来指代任何使用 `new` 关键字创建的复杂事物。以下是一些例子：*\n\n```\nbackground = new Sprite();\n\
  button = new SimpleButton();\n```\n\n*当你看到 `new` 关键字时，你就知道我在创建一个对象。*\n\n*（从纯粹的技术角度来看，AS3.0\
  \ 程序中的一切都是对象。从概念上讲，当你进入更高级的编程时，了解这一点很重要，但在你学习阶段，先不要纠结于这个不一致之处，因为它只会让你更困惑。）*\n\n\
  你可能会好奇类名后面的空括号是做什么用的。它们的存在是为了在创建实例时，提供类完成其工作所需的任何额外细节。从图 3-16 中可以看到，它们完全是空的。我们接下来会看到如何用有用的信息来填充括号。\n\
  \n\n\n##### 在舞台上显示图像\n\n到目前为止，我们的代码创建了三个空变量并将它们转换为对象。现在我们可以利用这些对象在舞台上显示背景图像。接下来的三行代码将完成这项工作。\n\
  \n```\nbackgroundURL.url = \"../images/background.png\";\nbackgroundLoader.load(backgroundURL);\n\
  background.addChild(backgroundLoader);\n```\n\n第一行新代码告诉 `backgroundURL` 对象在项目目录中哪里可以找到\
  \ `background.png` 文件。你可以看到对象名称后面跟着“.url”（如下高亮所示）\n\n```\nbackgroundURL.url = \"\
  ../images/background.png\";\n```\n\n点号表示 `url` 是 `backgroundURL` 的一个**属性**。`url`\
  \ 的作用是存储文件的位置。在这个例子中，它存储了在你的计算机上查找 `background.png` 文件的位置。引号中的文本 `\"../images/background.png\"\
  ` 通过等号被复制到这个 `url` 属性中。我们将在后续页面中详细讨论*属性*究竟是什么意思。但现在，你可以把它想象成对象内部用于存储特定信息的一个容器。`url`\
  \ 属性就像是 `backgroundURL` 对象内部的一个储物柜，它知道图像的位置地址。\n\n图 3-17 精确地说明了这行代码是如何工作的，以及我们的程序是如何开始填充有用信息的。\n\
  \n![Image](img/9781430239922_Fig03-17.jpg)\n\n**图 3-17.** 告诉程序在哪里找到图像文件。\n\n*如果你不熟悉文件路径名，这段文本可能会让你感到困惑：*\n\
  \n*`../images/background.png`*\n\n*这是你文件的位置；也就是 URL。*\n\n*如果你把它分解成几个部分，就更容易理解了。最后一部分是图像文件的名称——也就是我们要加载的图像：*\n\
  \n*`background.png`*\n\n*很简单！*\n\n*在此之前是存放它的文件夹名称：*\n\n*`images/`*\n\n*正斜杠表示这是一个文件夹。*\n\
  \n*我们的程序还需要知道在哪里找到 `images` 文件夹。这就是以下字符的作用：*\n\n*`../`*\n\n*两个点和一条正斜杠告诉程序在当前目录的上一级目录中查找\
  \ `images` 文件夹。这是什么意思呢？*\n\n*图像是由编译程序时创建的 SWF 文件加载的。在这个例子中，它是位于 `bin-debug` 文件夹中的\
  \ `GameWorld.swf` 文件。如果我们尝试使用以下路径名查找文件，是找不到的：*\n\n*`images/background.png`*\n\n\
  *这是因为程序会在 SWF 文件运行的文件夹内部查找 `images` 文件夹，也就是在 `bin-debug` 文件夹内。而 `images` 文件夹并不在\
  \ `bin-debug` 文件夹内部，而是在它的上一级。因此，我们必须告诉程序在当前目录的上一级目录中查找 `images` 文件夹。这就是 `../` 的含义：“检查上一层目录”。*\n\
  \n*图 3-18 展示了这是如何工作的。*\n\n*务必牢记，如果你改变了 SWF 文件的位置，也必须相应地移动 `images` 文件夹，否则你的图像将无法加载，并且会收到一条错误信息：“No\
  \ active Security context”（没有活动的安全上下文）。这仅仅意味着 SWF 找不到这些图像。*\n\n![Image](img/9781430239922_Fig03-18.jpg)\n\
  \n**图 3-18.** `\"../\"` 告诉程序在 SWF 文件运行文件夹的上一级目录中查找 `images` 文件夹\n\n下一行代码使用了 `backgroundURL`\
  \ 所包含的文件位置，并将其发送给加载器对象。\n\n```\nbackgroundLoader.load(backgroundURL);\n```\n\n记住，`backgroundLoader`\
  \ 是 `Loader` 的一种类型。它是一个 `Loader` 对象。`Loader` 对象的工作是加载东西。它通过紧随点号后的关键词 `load` 来完成这项任务（如下高亮所示）：\n\
  \n```\nbackgroundLoader.load(backgroundURL);\n```\n\n`load` 就是所谓的**方法**。方法是帮助对象执行动作的操作。在这个例子中，`load`\
  \ 方法将我们在 `backgroundURL` 中指定的图像加载到 `backgroundLoader` 中。方法通常后面跟着括号，并且它们对括号内的任何信息进行操作。括号内的任何内容都被称为该方法的**参数**。我们很快就会详细探讨什么是方法以及它们是如何工作的。现在，你只需要知道\
  \ `load` 方法已将 `backgroundURL` 加载到了 `backgroundLoader` 中。图 3-19 说明了这行代码的作用。\n\n![Image](img/9781430239922_Fig03-19.jpg)\n\
  \n**图 3-19.** 将图像路径加载到 `backgroundLoader` 中。\n\n*我们在本书中之前见过一个方法。你还记得第 1 章中的这行代码吗？*\n\
  \n*`trace(\"Hello World! Can you read this?\");`*\n\n*`trace` 就是一个方法。它使用其后括号内的文字在控制台窗口中显示该文本。寻找后面跟着括号的小写单词，你就找到了一个方法！*\n\
  \n`backgroundLoader` 是一个用于存放你想加载到程序中的文件的临时存储容器。这是加载文件的必要步骤，但它本身并没有太大用处。让我们通过将图像文件添加到我们的背景精灵中来使其更有用。\n\
  \n```\nbackground.addChild(backgroundLoader);\n```\n\n`background` 是一个 `Sprite`\
  \ 对象。`Sprite` 对象是你实际上可以在舞台上看到的东西。你在游戏中编写的大部分程序都将涉及控制 `Sprite` 对象。你可以把 `Sprite` 想象成一个包含图像并在舞台上移动的盒子。\n\
  \n`Sprite` 对象有一个叫做 `addChild` 的方法。如果你把 `Sprite` 想象成一个保护性的父级，那么每当你使用 `addChild` 时，你就是在给这个\
  \ `Sprite` 一个需要照看的东西。在这个例子中，`addChild` 将 `backgroundLoader` 的内容添加到了 `background`\
  \ 这个 `Sprite` 中。`backgroundLoader` 的内容是什么？就是我们的图像。图 3-20 说明了这行代码是如何工作的。\n\n![Image](img/9781430239922_Fig03-20.jpg)\n\
  \n**图 3-20.** 使用 `addChild` 方法将加载器中的图像添加到 `background` 精灵中。\n\n图像现在安全地处于 `background`\
  \ 精灵对象的父级保护之下，但我们还不能在舞台上看到它。这就是我们编写的最后一行新代码的工作：\n\n```\nstage.addChild(background);\n\
  ```\n\nAS3.0 有一个名为 `stage` 的内置对象。每当你使用 `stage.addChild()` 方法时，括号内的任何内容都会显示在舞台上（只要它是一个\
  \ `Sprite`、`MovieClip` 或 `Bitmap` 对象）。\n\n在这行代码中，`addChild` 所做的是获取 `background`\
  \ 精灵对象，并将其添加到所谓的**显示列表**中。任何在显示列表上的实例在舞台上都是可见的。现在我们可以看到我们的背景图像了……耶！图 3-21 展示了在我们这个小跳蛙游戏中，这最后一道障碍如何最终呈现出一个可见的图像。\n\
  \n![Image](img/9781430239922_Fig03-21.jpg)\n\n**图 3-21.** 在最后一步，使用 `addChild` 将\
  \ `background` 精灵中的图像添加到舞台。\n\n从图 3-21 中你可以看到，这实际上只是将图像从一个对象传递到下一个对象，直到它最终出现在舞台上。在本章稍后的部分，我将向你展示一些快捷方式，可以将其中一些步骤合并起来，从而让你少打很多字。但现在，请先掌握这个体系，因为它清楚地揭示了变量如何变成对象，以及对象又如何被用来实现各种功能的基本机制。\n\
  \n\n\n#### 理解代码结构\n\n我们编写这段代码所使用的结构与第一章 `HelloWorld` 项目中使用的结构完全相同。所有的代码块都在这里：`package`（包）、`class`（类）定义以及\
  \ `constructor`（构造器）方法。我们一直在向这个结构中编写代码。请仔细审视你目前已编写的代码，看看是否能识别出这个结构。\n\n我们已经将特定的代码片段写入了特定的代码块中。如果你理解了其中的原因，程序对你来说就会变得更有意义。以下是每个代码块应该包含的内容：\n\
  \n- **`package` 代码块**：`import`（导入）语句和 SWF 元标签。这是程序运行所需的基本配置。\n- **`class` 定义代码块**：在这里声明你的变量和对象。这些都是你将要创建并希望在程序中使用的所有事物。\n\
  - **`constructor` 方法代码块**：在这里创建并执行一些操作来设置你的游戏。所有有趣的事情都从这里开始！\n\n我们将在程序中添加更多代码块，但它们都将建立在**这个基本结构**之上。事实上，你编写的每一个\
  \ AS3.0 游戏和程序都将使用这个基本结构。如图 3-22 所示。\n\n![Image](img/9781430239922_Fig03-22.jpg)\n\
  \n**图 3-22**。一个 AS3.0 程序的基本结构\n\n#### 在舞台上定位精灵\n\n我们总共有七张图片需要添加到舞台上。我们将使用完全相同的模式来添加剩余的图片。接下来，让我们添加游戏角色。\n\
  \n请仔细在类定义中，紧接在我们之前编写的代码之后，添加以下加粗的代码行：\n\n```\npublic class GameWorld extends Sprite\n\
  {\n  //声明我们需要的变量\n  public var backgroundURL:URLRequest;\n  public var backgroundLoader:Loader;\n\
  \  public var background:Sprite;\n\n  //角色\n  public var characterURL:URLRequest;\n\
  \  public var characterLoader:Loader;\n  public var character:Sprite;\n  public\
  \ function GameWorld()\n  {...\n```\n\n现在，在构造器方法中，紧接在上一节添加的代码之后，添加这些新的加粗代码行。\n\n\
  ```\npublic function GameWorld()\n{\n  //将背景添加到舞台\n  backgroundURL = new URLRequest();\n\
  \  backgroundLoader = new Loader();\n  background = new Sprite();\n\n  backgroundURL.url\
  \ = \"../images/background.png\";\n  backgroundLoader.load(backgroundURL);\n  background.addChild(backgroundLoader);\n\
  \  stage.addChild(background);\n\n  //将角色添加到舞台\n  characterURL = new URLRequest();\n\
  \  characterLoader = new Loader();\n  character = new Sprite();\n\n  characterURL.url\
  \ = \"../images/character.png\";\n  characterLoader.load(characterURL);\n  character.addChild(characterLoader);\n\
  \  stage.addChild(character);\n}\n```\n\n你应该能看到这段代码与我们用于显示背景的代码完全相同。其功能是相同的。唯一的区别是变量名和图像的文件路径。我只是将所有名称中的\
  \ \"background\" 替换成了 \"character\"。\n\n编译程序，你应该会看到你的游戏角色现在出现在 Flash Player 窗口的左上角，如图\
  \ 3-23 所示。\n\n![Image](img/9781430239922_Fig03-23.jpg)\n\n**图 3-23**。将游戏角色添加到舞台。\n\
  \n*当你向舞台添加对象时，最后添加的对象总是显示在最先添加的对象之上。这称为**堆叠顺序**，你将在第 9 章中学到更多关于如何控制它的知识。*\n\n我的猫咪角色坐在那里看起来相当可爱，但让我们使用一些\
  \ AS3.0 代码将它移动到舞台中央。\n\n##### 理解对象的 `x` 和 `y` 位置\n\n舞台高 550 像素，宽 400 像素。我们知道这一点，因为这些是我们输入到\
  \ SWF 元标签中的值。\n\n```\n[SWF(width=\"550\", height=\"400\",\nbackgroundColor=\"#FFFFFF\"\
  , frameRate=\"60\")]\n```\n\n这意味着舞台实际上只是一个 550x400 的像素网格。左上角是位置 0。当你向舞台添加一个 `Sprite`（精灵）时，它总是将其添加到位置\
  \ 0，如图 3-24 所示。\n\n![Image](img/9781430239922_Fig03-24.jpg)\n\n**图 3-24**。舞台是一个像素网格。\n\
  \n网格上的水平位置称为 `X`，垂直位置称为 `Y`。你可以通过引用其 `x` 和 `y` 坐标来引用网格上的任何位置。例如，如果你想引用网格的正中心，可以这样描述：\n\
  \n```\nx = 275\ny = 200\n```\n\n图 3-25 对此进行了说明。\n\n![Image](img/9781430239922_Fig03-25.jpg)\n\
  \n**图 3-25**。使用 `x` 和 `y` 坐标描述网格上的任意点。\n\n我们可以通过编写如下代码将角色移动到舞台中央：\n\n```\ncharacter.x\
  \ = 275;\ncharacter.y = 200;\n```\n\n`Sprite` 对象具有名为 `x` 和 `y` 的属性。你分配给这些属性的任何数字都会将\
  \ `Sprite` 移动到舞台上该坐标处。图 3-26 展示了如果我们使用上述代码，角色在舞台上的位置。\n\n![Image](img/9781430239922_Fig03-26.jpg)\n\
  \n**图 3-26**。使用 `x` 和 `y` 属性定位 `Sprite` 对象。\n\n但角色居中了吗？完全没有！这是因为 `Sprite` 对象是从其左上角开始移动的。这被称为**注册点**。\n\
  \n如果你想让精灵居中，必须从 `x` 和 `y` 坐标中减去其宽度的一半和高度的一半。\n\n我们知道角色 `Sprite` 高 100 像素，宽 100 像素（这正是我们在第\
  \ 2 章中制作的图像大小。）这意味着如果我们希望角色完全居中于舞台中央，必须从 `x` 位置减去 50，并从 `y` 位置减去 50。我们使用的代码看起来像这样：\n\
  \n```\ncharacter.x = 225;\ncharacter.y = 150;\n```\n\n图 3-27 显示了这些 `x` 和 `y` 位置将使角色精确居中于舞台。\n\
  \n![Image](img/9781430239922_Fig03-27.jpg)\n\n**图 3-27**。使用 `x` 和 `y` 属性定位 `Sprite`\
  \ 对象。\n\n现在让我们使用这段代码，在我们的 `GameWorld` 程序中实际地将角色居中于舞台。\n\n直接在您刚编写的新代码之后，输入以下加粗的代码。\n\
  \n```\ncharacterURL.url = \"../images/character.png\";\ncharacterLoader.load(characterURL);\n\
  character.addChild(characterLoader);\nstage.addChild(character);\n\ncharacter.x\
  \ = 225;\ncharacter.y = 150;\n```\n\n编译代码，你将看到角色精确地居中于舞台，如图 3-28 所示。\n\n![Image](img/9781430239922_Fig03-28.jpg)\n\
  \n**图 3-28**。角色在舞台上居中。\n\n现在让我们使用这些新技术，沿着舞台左侧加载、显示并定位这些按钮。\n\n\n\n##### 显示和定位按钮\n\
  \n接下来，我们需要加载六个按钮并定位它们。只需重复相同的代码模式，但将“background”和“character”替换为以下按钮名称：“`upButton`”、“`downButton`”、“`growButton`”、“`shrinkButton`”、“`vanishButton`”和“`spinButton`”。\n\
  \n我们先一起添加上移按钮，然后由你自行添加其余按钮。\n\n在类定义中现有代码之后，添加以下加粗的新代码。\n\n```\npublic class GameWorld\
  \ extends Sprite\n{\n  //声明所需变量\n  public var backgroundURL:URLRequest;\n  public\
  \ var backgroundLoader:Loader;\n  public var background:Sprite;\n\n  //角色\n  public\
  \ var characterURL:URLRequest;\n  public var characterLoader:Loader;\n  public var\
  \ character:Sprite;\n\n  //upButton\n  public var upButtonURL:URLRequest;\n  public\
  \ var upButtonLoader:Loader;\n  public var upButton:Sprite;\n\n  public function\
  \ GameWorld()\n  {...}\n```\n\n接下来，在构造函数方法中添加以下加粗的新代码。将其直接添加到你编写的用于设置角色 `x` 和 `y`\
  \ 属性的代码之后。我列出了整个构造函数方法块，以便你能在正确的上下文中看到所有代码。\n\n```\npublic function GameWorld()\n\
  {\n  //向舞台添加背景\n  backgroundURL = new URLRequest();\n  backgroundLoader = new Loader();\n\
  \  background = new Sprite();\n\n  backgroundURL.url = \"../images/background.png\"\
  ;\n  backgroundLoader.load(backgroundURL);\n  background.addChild(backgroundLoader);\n\
  \  stage.addChild(background);\n\n  //向舞台添加角色\n  characterURL = new URLRequest();\n\
  \  characterLoader = new Loader();\n  character = new Sprite();\n  characterURL.url\
  \ = \"../images/character.png\";\n  characterLoader.load(characterURL);\n  character.addChild(characterLoader);\n\
  \  stage.addChild(character);\n  character.x = 225;\n  character.y = 150;\n\n  //添加上移按钮\n\
  \  upButtonURL = new URLRequest();\n  upButtonLoader = new Loader();\n  upButton\
  \ = new Sprite();\n  upButtonURL.url = \"../images/up.png\";\n  upButtonLoader.load(upButtonURL);\n\
  \  upButton.addChild(upButtonLoader);\n  stage.addChild(upButton);\n  upButton.x\
  \ = 25;\n  upButton.y = 25;\n}\n```\n\n编译程序，你会看到上移按钮位于舞台左上角附近，如图 3-29 所示。\n\n![Image](img/9781430239922_Fig03-29.jpg)\n\
  \n**图 3-29**。将上移按钮添加到舞台。\n\n按照完全相同的方式，将剩余的 5 个按钮添加到舞台。最终效果应如图 3-30 所示。\n\n![Image](img/9781430239922_Fig03-30.jpg)\n\
  \n**图 3-30**。将所有按钮添加到舞台。\n\n以下是正确对齐按钮所需的 `x` 和 `y` 位置：\n\n```\ndownButton.x = 25;\n\
  downButton.y = 85;\n\ngrowButton.x = 25;\ngrowButton.y = 145;\n\nshrinkButton.x\
  \ = 25;\nshrinkButton.y = 205;\n\nvanishButton.x = 25;\nvanishButton.y = 265;\n\n\
  spinButton.x = 25;\nspinButton.y = 325;\n```\n\n你将会进行大量的输入，但这是学习过程中重要的一环。你需要直观地感受逐字逐句键入\
  \ ActionScript 3.0 代码的过程，从而培养与它的内在熟悉感。你还需了解自己在编写代码时会犯哪些类型的错误。每次为新按钮添加代码后，都要编译程序以确保一切运行正常。尽早发现错误至关重要。\n\
  \n在接下来的两章中，你将学习一些新的快捷方法和技巧，它们将大幅减少加载图片所需的代码量——仅为我们这里所用代码的一小部分。但通过本章中这种较为繁琐的方式，我们揭示了变量使用、类运用和对象创建的基本原理。制作游戏需要掌握这些知识。\n\
  \n如果你对编写的代码有任何疑问，本章末尾提供了完整的代码清单。你也可以从本章的源文件中下载名为 `GameWorldLoadedImages` 的项目文件夹。截至当前节点的所有代码都在该文件夹中。\n\
  \n### 按钮编程\n\n本项目的下一步是对按钮进行编程，以便通过点击按钮来控制游戏角色。但在深入具体操作方法之前，让我们先退一步，审视一下你将编写的代码背后的一些基本原理。这些内容并不难，但你会接触到许多新概念，需要快速吸收。你需要将它们分解成可管理的部分，逐一学习。\n\
  \n所以，倒上一杯印度香料奶茶，舒舒服服地坐在沙发上。暂时放下编程，详细了解一下以下主题：\n\n- 点语法\n- 方法\n- 事件侦听器\n\n这三个元素将协同作用于你将编写的新代码中。\n\
  \n*下一节包含大量理论内容，但均为可选阅读。你可能会发现，只需卷起袖子，看看这些概念在实际编程中是如何运作的，反而能理解得更好。可以考虑直接跳到“让按钮生效”一节，那里将把这些理论付诸实践。如果之后觉得需要更深入地了解代码的运行机制，随时可以再回到本节。*\n\
  \n*学习编程就是编写一点代码并观察效果。不要让理论或技术术语拖累或困扰你！如果感到困惑，不妨直接开始处理本书下一个实践项目，并仔细留意你的代码产生的效果。这是最好的学习方法。*\n\
  \n#### 理解点语法\n\n你可能一直好奇，在编写过的代码片段之间出现的那些点究竟有什么具体作用。这些点有三个主要功能。\n\n首先，它们可以告诉你任何给定对象的层级关系。例如，看看下面这个你见过多次的\
  \ `import` 语句：\n\n`import flash.display.Sprite;`\n\n这些点表明 `Sprite` 是 `display` 的一部分，而\
  \ `display` 又是 `flash` 的一部分。这就是描述如何在库中找到 `Sprite` 类的层级关系。\n\n这些点还能帮助你访问对象的**属性**。属性是关于对象的特定信息，例如其大小、颜色或位置。我们刚刚看到，可以通过更改\
  \ `character` 对象的 `x` 和 `y` 属性将其定位在舞台上。你可以通过以下方式引用 `x` 和 `y` 属性：\n\n`character.x`\n\
  `character.y`\n\n点用于表明 `x` 和 `y` *属于* `character` 对象。本章稍后我们将详细介绍属性。\n\n最后，点可以表明对象正在使用方法执行特定任务。下面是我们刚编写过的代码中的一个示例：\n\
  \n`stage.addChild(character);`\n\n这个点表明 `stage` 对象正在使用 `addChild` 方法使角色显示出来。\n\n\
  这种使用点来访问对象及其属性和方法的系统称为**点语法**。它是 ActionScript 3.0 及其相关编程语言（如 C++ 和 Java）的关键特性。\n\
  \n#### 方法\n\n到目前为止，我在本书中已经多次提及方法，但在深入之前，我们应详细了解一下它们究竟是什么以及如何运作的。\n\n方法在程序中执行某种有用的操作。它们由两部分组成：\n\
  \n- **函数定义**：这一部分是一段代码块，包含执行所需任务的指令。\n- **方法调用**：这一部分是一个单词，用于激活函数定义中的指令。\n\n让我们仔细看看这两个要素。\n\
  \n\n\n##### 使用方法调用\n\n到目前为止，你已经在这本书中看到过三种方法调用：`trace`、`addChild` 和 `load`。以下是它们的使用方式：\n\
  \n`trace(\"Hello World!\");`\n`stage.addChild(background);`\n`backgroundLoader.load(backgroundURL);`\n\
  \n我们程序中发生的一切有趣的事情，到目前为止都归功于方法调用。\n\n方法调用的一个优点在于，你无需知道它们实际如何工作就能使用它们。你知道 `trace`\
  \ 究竟如何显示文本，或者 `addChild` 如何将 `Sprite` 放到舞台上吗？你当然不知道——你只需要知道如何使用它来获得你想要的结果。方法实际完成这项工作的方式是其**函数定义**的一部分，我们稍后将讨论函数定义。\n\
  \n你总能识别出方法调用，因为它的名称后面总是跟着括号。括号内的内容是方法完成其工作所需的额外信息。在编程术语中，这些额外信息被称为**参数**。参数就是括号中的内容。\n\
  \n以下是一个 `trace` 方法调用的示例：\n\n`trace(\"Wow! This is an argument!\");`\n\n括号内引号中的文本就是该方法调用的参数。另一个示例如下：\n\
  \n`stage.addChild(character);`\n\n这并不意外。你之前见过这个！`addChild()` 是方法调用，而 `character`\
  \ 是方法的参数。任何作为 `addChild` 方法参数提供的 `Sprite` 对象名称都会显示在舞台上。\n\n关键字 `stage` 和方法名之前的点告诉我们，这是一个属于\
  \ `stage` 的方法。舞台正在使用该方法来完成其工作。\n\n有些方法不需要参数就能完成工作。没有参数的方法调用只需使用空括号。示例如下：\n\n`simpleMethod();`\n\
  \n即使这个方法调用没有参数，你仍然需要提供空括号。\n\n##### 使用函数定义\n\n除了一个例外，到目前为止本书中使用的所有方法都已内置于 AS3.0\
  \ 语言中。（唯一的例外是在 `HelloWorld` 和 `GameWorld` 项目中创建的构造函数方法。构造函数方法是一种用于初始化类的特殊函数定义。）你很幸运，因为这些内置方法非常有用，为你节省了一些工作。然而，作为一名程序员，你可以创建自己的方法。如果你的程序需要执行任何特定的任务，你可以创建一个专门完成该任务的方法。\n\
  \n要创建自己的方法，你需要定义它。以下是定义方法的基本格式：\n\n```\npublic function methodName():void\n{\n \
  \ //在此处添加指令\n}\n```\n\n这被称为**函数定义**。函数定义是块语句，你可以通过它们由一对花括号构成这一特点来识别。正如我们在第 1 章中所学，花括号形成了一段代码“块”。花括号内的任何代码都是该块的一部分。程序是通过组合使用许多这样的块来构建的。\n\
  \n函数定义以关键字 `function` 开头，后跟方法名，然后是括号。如果方法调用不使用任何参数（额外信息），则括号为空。如果方法调用使用参数，则括号内必须包含一个**参数**（稍后你将了解如何使用方法参数）。\n\
  \n括号之后是**类型声明**，它是一个冒号，后跟一个描述该方法可能返回给程序其余部分的信息类型的词。你之前见过类型。还记得这些吗？\n\n`:Sugar`\n\
  `:Salt`\n`:Sprite`\n\n方法也需要包含类型。然而，许多方法不需要向程序的其余部分返回任何信息，因此它们的类型是无关紧要的。要指定一个方法不返回任何信息，你可以指定返回类型为\
  \ `void`。如下所示：\n\n`:void`\n\n在你被所有这些新信息搞得不知所措之前，花点时间看一下图 3-31 和图 3-32，熟悉方法调用的样子以及函数定义的结构。\n\
  \n![图片](img/9781430239922_Fig03-31.jpg)\n\n**图 3-31**. 基本方法的格式\n\n![图片](img/9781430239922_Fig03-32.jpg)\n\
  \n**图 3-32**. 使用参数提供的额外信息的方法的格式\n\n##### 使用一个基本方法\n\n让我们看看如何在程序中使用一个非常简单的例子。\n\n\
  创建一个新的 AS3.0 项目，并在编辑器窗口中输入以下代码：\n\n```\npackage\n{\n  import flash.display.Sprite;\n\
  \n  public class MethodWithoutParameters extends Sprite\n  {\n    public function\
  \ MethodWithoutParameters()\n    {\n      displayText();\n    }\n\n    public function\
  \ displayText():void\n    {\n      trace(\"This is text from the function definition\"\
  );\n    }\n  }\n}\n```\n\n编译该程序，你将看到显示以下跟踪信息：\n\n`This is text from the function\
  \ definition`\n\n该程序的结构非常重要。方法调用 `displayText()` 位于程序的构造函数块内。原因在于，构造函数方法内的任何内容都在程序首次启动时立即运行。`displayText`\
  \ 函数定义紧跟构造函数块之后。通过图解更容易看清这一点，请查看图 3-33，它展示了程序块是如何组织的。\n\n![图片](img/9781430239922_Fig03-33.jpg)\n\
  \n**图 3-33**. `displayText` 函数定义是类块的一部分。\n\n图 3-34 说明了方法调用和函数定义如何协同工作来显示文本。\n\n\
  ![图片](img/9781430239922_Fig03-34.jpg)\n\n**图 3-34**. `displayText` 方法如何工作\n\n始终牢记，方法是两部分系统：你必须创建一个函数定义来定义方法，然后需要一个方法调用来使用它。你可以在本章源文件中的\
  \ `MethodWithoutParameters` 项目文件夹中找到该程序的工作示例。\n\n\n\n#### 创建方法的参数与形参\n\n简单的 `displayText`\
  \ 方法运行得相当不错，但它有一个局限性——它显示的文字始终是固定的。如果你能让这个方法每次被调用时都能传入新的文字来显示，那岂不是更好？\n\n当然可以！新的方法调用可能像这样：\n\
  \n`displayText(\"你可以在这里写下任何你喜欢的文字！\");`\n\n现在的调用中包含了**实参（argument）**。这个实参就是你想要显示的文本。\n\
  \n为了显示这段文本，你需要使用**形参（parameter）** 重写函数定义。形参就是一个用于存储新信息的变量。这个变量可以在函数定义中的任何位置使用，以访问方法调用发送过来的信息。\n\
  \n这其实非常简单，来看一下：\n\n```\npublic function displayText(textYouWantToDisplay:String):void\n\
  {\n  trace(textYouWantToDisplay);\n}\n```\n\n如果你在程序中使用这个方法并运行它，就会看到这条消息：“你可以在这里写下任何你喜欢的文字！”\n\
  \n让我们用一个简单程序来测试一下。\n\n创建一个名为 `MethodWithParameters` 的 AS3.0 项目。\n\n在编辑器窗口中输入以下代码：\n\
  \n```\npackage\n{\n  import flash.display.Sprite;\n\n  public class MethodWithParameters\
  \ extends Sprite\n  {\n    public function MethodWithParameters()\n    {\n     \
  \ displayText(\"你可以在这里写下任何你喜欢的文字！\");\n    }\n\n    public function displayText(textYouWantToDisplay:String):void\n\
  \    {\n      trace(textYouWantToDisplay);\n    }\n  }\n}\n```\n\n编译程序，你会看到以下跟踪消息：\n\
  \n`你可以在这里写下任何你喜欢的文字！`\n\n现在看看我们的方法变得多么灵活。将 `displayText` 方法调用改为以下内容：\n\n`displayText(\"\
  这是一段新的文本\");`\n\n再次编译程序，你会看到：\n\n`这是一段新的文本`\n\n这个系统的美妙之处在于，你只需要编写一次函数定义。只需改变方法调用实参中的文字，就能改变方法显示的文字。例如，你可以使用以下任何方法调用，跟踪输出都会随之改变：\n\
  \n`displayText(\"所有这些文字\");`\n`displayText(\"可以随时按你想要的方式更改\");`\n`displayText(\"\
  而无需修改函数定义\");`\n\n这让方法变得非常通用。理解的关键在于：\n\n- 方法调用实参中的文字被发送到函数定义。\n- 函数定义将该文字存储在一个变量中。该变量名称由形参提供。在本例中，变量名是\
  \ `textYouWantToDisplay`。\n\n每当你在函数定义中使用 `textYouWantToDisplay` 时，它都会被替换为方法调用实参中提供的文字。图\
  \ 3-35 展示了这一切是如何工作的。\n\n![图片](img/9781430239922_Fig03-35.jpg)\n\n**图 3-35**。基本方法的格式\n\
  \n*注：你会发现变量 `textYouWantToDisplay` 被指定为 `String` 类型。`String` 变量是包含文本的变量。我们将在第 4\
  \ 章中详细讨论它们。*\n\n你可以在本章源文件的 `MethodWithParameters` 文件夹中找到这个可运行的示例程序。\n\n#### 使用多个实参与形参\n\
  \n方法可以使用多个实参或形参。使用多个形参的函数定义如下所示：\n\n```\npublic function methodName (valueOne:Type,\
  \  valueTwo:Type):void\n{\n  //指令...\n}\n```\n\n形参只需要在括号内用逗号分隔即可。\n\n如果函数定义使用了多个形参，方法调用也需要发送相同数量的实参。以下是包含两个实参的方法调用示例：\n\
  \n`methodName(argumentOne,  argumentTwo);`\n\n你只需用逗号分隔实参即可。你可以用同样的方式创建任意数量形参的方法。\n\
  \n*在编程生涯的某个时刻，你可能需要调用一个方法，但事先不知道需要多少个参数。假设你有一个方法需要记录去杂货店购买的物品，而你永远不知道会买多少件。今天你可能有\
  \ 3 件物品，像这样：*\n\n*`methodName (itemOne,  itemTwo,  itemThree);`*\n\n*明天你可能有 5 件物品，像这样：*\n\
  \n*`methodName (itemOne,  itemTwo,  itemThree,  itemFour,  itemFive);`*\n\n*为了避免编写两个不同的函数定义，你可以创建一个方法，将接收到的实参存储在一个数组中。我将在第\
  \ 9 章中介绍数组，所以你或许只需将这些信息存档以备将来参考。函数定义将如下所示：*\n\n```\n*function methodName (...itemArray):void*\n\
  \n*{*\n\n*  //指令…*\n\n*}*\n```\n\n*所有实参都作为元素存储在一个名为 `itemArray` 的数组中。参数名前的三个点表示该参数是一个数组，而不是一个变量。（目前，你可以把数组想象成可以存储大量变量的大文件柜。）*\n\
  \n如果你是编程新手，在真正掌握这些内容之前，你需要多练习使用方法并查看不同的示例。别担心！在接下来的章节和篇幅中，我会给你提供大量的练习机会。没有人能一开始就完全理解方法。只要把这章放在手边，并尝试本章源文件中的一些示例程序即可。你会在本书中看到许多方法的实际应用示例，并逐渐习惯使用它们。\n\
  \n\n\n##### 理解事件与事件侦听器\n\n事件是程序中发生的各种情况。你通常会乐于让程序中的大多数事件自动处理，无需费心关注细节。但有些事件（比如按钮点击）你需要了解，以便指定在它们发生时执行特定操作。\n\
  \nAS3.0 允许你为对象附加事件侦听器。事件侦听器会“侦听”程序中发生的事件。当事件发生时，侦听器会触发相应的操作指令。你可以把事件侦听器想象成一只极其聪明且爱吠叫的小狗。你训练它不仅在遇到入侵者时狂吠，还能在吠叫的同时拨打警察局的电话，并向电话那头的警官报出你家地址。多么聪明的小狗！而你在\
  \ AS3.0 中通过事件侦听器就能拥有这样一只小狗。\n\n创建事件侦听器分为三个步骤。你需要按以下步骤设置并在程序中使用它们：\n\n1.  从 Flash\
  \ 的 `events` 包中导入一个事件类。\n2.  通过调用 AS3.0 内置的 `addEventListener` 方法，为对象添加一个事件侦听器。该方法的调用包含多个参数，例如要侦听的事件类型以及事件发生时要执行的操作。\n\
  3.  创建一个事件处理函数，这是一个专门的函数定义，用于告诉程序事件发生时该做什么。它“处理”该事件。事件处理函数包含一个特殊参数，允许它接收一个事件对象，该对象提供了关于所发生事件的相当多的信息。你可以在程序中使用这些信息。\n\
  \n理解事件侦听器工作原理的最佳方式是观察一个实际运行的例子。让我们编写一个简单的程序，展示一个你能创建的最基本的事件侦听器。\n\n创建一个名为 `EventListener`\
  \ 的新 AS3.0 项目。\n\n在代码编辑器中输入以下程序：\n\n```\npackage\n{\n  import flash.display.Sprite;\n\
  \  import flash.events.MouseEvent;\n\n  public class EventListener extends Sprite\n\
  \  {\n    public function EventListener()\n    {\n      stage.addEventListener(MouseEvent.CLICK,\
  \ clickHandler);\n    }\n    public function clickHandler(event:MouseEvent):void\n\
  \    {\n      trace(\"You clicked on the stage\");\n    }\n  }\n}\n```\n\n编译程序。用鼠标点击空白的\
  \ Flash Player 窗口。每次点击时，你都会看到屏幕上显示“You clicked on the stage”这条跟踪信息。\n\n![图片](img/9781430239922_Fig03-36.jpg)\n\
  \n**图 3-36**。每次点击舞台时，你都会看到显示跟踪信息。\n\n让我们来看看这个程序是如何工作的。\n\n###### 导入事件类\n\n要使用事件侦听器，首先要导入\
  \ AS3.0 的一个事件类。在本书中，你将最常使用 `MouseEvent` 和 `KeyboardEvent` 类，尽管还有很多其他类。`MouseEvent`\
  \ 类的 `import` 语句如下所示：\n\n```\nimport flash.events.MouseEvent;\n```\n\n一旦导入，你就可以用它来了解鼠标正在做什么，比如点击事物或在舞台上移动。\n\
  \n###### 添加事件侦听器\n\n下一步是添加一个事件侦听器，用于检测鼠标何时被点击。\n\n```\nstage.addEventListener(MouseEvent.CLICK,\
  \ clickHandler);\n```\n\n事件侦听器通常被添加到对象上。“stage”和“addEventListener”之间的点表示该侦听器已连接到舞台。\n\
  \n让我们把这个指令分解成更小的部分。最重要的是这个方法调用：\n\n```\naddEventListener\n```\n\n这是对 AS3.0 内置方法之一的调用。它用于注册事件，以便侦听器可以开始其工作。\n\
  \n在最基本的情况下，`addEventListener` 方法调用接受两个参数：\n\n```\n(MouseEvent.CLICK, clickHandler)\n\
  ```\n\n第一个参数是你要侦听的事件类型。在本例中，你正在侦听鼠标点击。描述要侦听的事件类型的格式是使用导入的事件类名，后跟一个点，然后是你感兴趣的事件：\n\
  \n```\nMouseEvent.CLICK\n```\n\n你要侦听的事件类型是 `CLICK` 事件。我相信你能猜到，它侦听的是鼠标点击。（事件名称总是用大写字母书写。）\n\
  \n*事件名称用大写书写的*原因*是它们实际上是一种称为**常量**的编程元素。常量总是用大写字母书写，这是它们遵循的命名约定。（你将在第 9 章中了解如何使用常量。）`CLICK`\
  \ 常量内置于 AS3.0 的 `MouseEvent` 类中。*\n\n第二个参数是事件发生时你要调用的函数定义。我们的示例程序使用了这个：\n\n```\n\
  clickHandler\n```\n\n这是事件处理函数的名称。它的名称必须与包含你希望在鼠标按钮被点击时运行的指令的函数定义的名称完全匹配。\n\n\n\n\
  ##### 使用事件处理器\n\n以下是在示例程序中事件处理器的模样：\n\n```\npublic function clickHandler(event:MouseEvent):void\n\
  {\n  trace(\"You clicked on the stage\");\n}\n```\n\n它与你之前在方法章节中看到的函数定义完全一样。然而，事件处理器有两个独特之处，使其有别于普通的函数定义。\n\
  \n第一个区别在于命名。按照惯例，事件处理器的名称总是以单词 *handler* 结尾。程序员选择给事件处理器起类似 `clickHandler`、`moveHandler`\
  \ 或 `someOtherKindOfEvnetHandler` 这样的名称，以便在其他函数定义中易于识别。你也可以随意为事件处理器起任何你喜欢的名字，但如果遵循这个惯例，你的工作会稍微轻松一些。本书的剩余部分都将遵循这一惯例。\n\
  \n第二个区别在于函数定义的参数：\n\n`(event:MouseEvent)`\n\n事件处理器必须声明一个特殊的事件变量，并且该变量的类型必须与发生的事件类型相同，例如\
  \ `MouseEvent`。\n\n这个事件变量是什么？它实际上是当事件发生时，由 AS3.0 自动创建的一个对象。其工作原理如下：\n\n想象一下用鼠标点击舞台。一旦发生点击，就会触发一个\
  \ `CLICK` 事件。AS3.0 将这个 `CLICK` 事件发送给所谓的**事件调度器**。（你不需要了解事件调度器的太多细节，只需知道它有点像在你程序中徘徊，监听事件的微型软件机器人。但你永远不会直接看到它或与它交互。）一旦它听到你告诉它要监听的事件，它就会拿出一个笔记本，记录下关于该事件的大量信息。例如，如果你点击了一个按钮，它可以告诉你点击的按钮名称以及点击发生在舞台上的哪个位置。所有这些信息被封装成一个**事件对象**，并发送给事件处理器（即为响应事件发生而编程运行的函数定义）。然而，事件处理器必须创建一个变量作为其参数来接收这个事件对象。即使你可能实际上不需要在函数定义中使用这个事件对象，AS3.0\
  \ 也要求你创建一个变量作为参数来容纳它。\n\n那么这个事件对象包含哪些信息呢？你可以使用 `trace` 来显示其内容来一探究竟。你可以修改示例函数定义，使其看起来像这样：\n\
  \n```\npublic function clickHandler(event:MouseEvent):void\n{\n  trace(event);\n\
  }\n```\n\n现在，如果你再次编译程序，然后点击舞台，你会看到类似这样的跟踪消息：\n\n```\n[MouseEvent type=\"click\"\
  \ bubbles=true cancelable=false eventPhase=2 localX=360 localY=139\nstageX=360 stageY=139\
  \ relatedObject=null ctrlKey=false altKey=false shiftKey=false\nbuttonDown=false\
  \ delta=0]\n```\n\n信息量真大！其中一些信息可能非常有用，尽管对于我们现在要做的事情来说并非必需。在本书后面，你将学习如何访问这些信息并在你的游戏中使用它们。\n\
  \n你可以使用点语法访问所有这些信息。你只需要使用事件对象的名称，后跟一个点，再跟上你需要访问的事件对象的属性。基于前面的例子，你可以使用以下代码来找出鼠标点击舞台处的\
  \ `x` 位置：\n\n```\nfunction onClick(event:MouseEvent):void\n{\n  trace(event.stageX);\n\
  }\n```\n\n如果舞台上有其他对象，你可以使用 `target` 属性找出被点击对象的名称。使用 `event.target` 将返回你所点击对象的名称：\n\
  \n```\nfunction onClick(event:MouseEvent):void\n{\n  trace(event.target);\n}\n```\n\
  \n如果在示例代码中使用它，它将输出以下内容：\n\n```\n[object Stage]\n```\n\n这就是舞台。\n\n很快你就会看到，我们将如何使用事件监听器来编程控制游戏角色的按钮。\n\
  \n图 3-37 给出了这个示例程序如何工作的总体概述。\n\n![Image](img/9781430239922_Fig03-37.jpg)\n\n**图\
  \ 3-37.** 一个演示事件监听器的简单程序\n\n##### 了解其他事件\n\n这个示例向你展示了如何使用 `MouseEvent` 类中的 `CLICK`\
  \ 事件。`MouseEvent` 类包含许多其他你肯定会用到的事件。表 3-1 显示了事件名称及其功能。\n\n![Image](img/9781430239922_tab03-01.jpg)\n\
  \n![Image](img/9781430239922_tab03-01a.jpg)\n\n这些事件中的许多不适用于你在示例中使用的舞台对象，但它们都适用于\
  \ `Sprite` 对象。以下是一些如何使用 `addEventListener` 注册这些事件的示例：\n\n```\naddEventListener(MouseEvent.ROLL_OVER,\
  \ onRollOver);\naddEventListener(MouseEvent.ROLL_OUT, onRollOut);\naddEventListener(MouseEvent.MOUSE_MOVE,\
  \ onMouseMove);\n```\n\n图 3-38 展示了创建事件监听器的基本模型以及事件发生时发生的情况。\n\n![Image](img/9781430239922_Fig03-38.jpg)\n\
  \n**图 3-38.** 事件监听器的工作原理\n\n像学习方法一样，在你完全掌握事件监听器的工作原理之前，需要一些实践和更多实用示例。在本书的后续内容中，你将会看到许多事件监听器实际应用的例子，因此你将有很多机会进行实验，并在不同上下文中观察它们的效果。事件监听器的优点在于它们都使用完全相同的格式。你暂时不必完全理解它们工作的每一个细节；你只需要知道如何使用它们来为你的游戏获得想要的结果。\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n##### 让你的按钮工作起来\n\n\
  既然我们已经了解了点表示法、方法和事件监听器，就可以运用这些技巧来为我们的 `GameWorld` 项目中的按钮编写程序了。我们来编写一个向上按钮，当点击它时显示一条消息。\n\
  \n1.  确保 `GameWorld` 项目已打开。\n2.  在你之前编写的代码后面，直接添加以下加粗显示的代码。\n\n    *为了节省本书篇幅，我省略了你在类定义中编写的所有变量声明，以及在构造方法中用于创建、显示和定位对象的所有代码。我所有这些代码都用注释代替了，所以你需要小心地将这段新代码插入到你自己项目中的正确位置。如果你对在何处添加这段新代码有任何疑问，请查看本章源文件中的\
  \ `GameWorldButtonTest` 文件。它包含了下一步完整的可运行代码。你也会在本章末尾找到该项目完整完成的代码清单。*\n\n    ```\n\
  \    package\n    {\n      import flash.display.Loader;\n      import flash.display.Sprite;\n\
  \      import flash.events.MouseEvent;\n      import flash.net.URLRequest;\n\n \
  \     [SWF(width=\"550\", height=\"400\",\n        backgroundColor=\"#FFFFFF\",\
  \ frameRate=\"60\")]\n\n      public class GameWorld extends Sprite\n      {\n \
  \       //所有变量声明…\n\n        public function GameWorld()\n        {\n          //所有用于创建、显示和定位对象的代码…\n\
  \n          //添加按钮监听器\n          upButton.addEventListener(MouseEvent.CLICK, upButtonHandler);\n\
  \        }\n        public function upButtonHandler(event:MouseEvent):void\n   \
  \     {\n          trace(\"你点击了向上按钮\");\n        }\n      }\n    }\n    ```\n\n\
  3.  编译程序。程序运行时，点击舞台上的向上按钮。你会看到追踪消息 “你点击了向上按钮。” 图 3-39 显示了你会看到的效果。\n\n    ![Image](img/9781430239922_Fig03-39.jpg)\n\
  \n    **图 3-39.** 点击向上按钮来测试你的按钮事件。\n\n到目前为止，这个非常简单的小程序很好地展示了对象、点表示法、方法和事件监听器是如何协同工作的。但它还没有任何真正有趣的功能。要使其真正具有交互性，并将其作为制作游戏的基础，我们需要了解更多关于\
  \ `Sprite` 对象以及如何控制它们的内容。\n\n### 使用属性控制 Sprite 对象\n\n使用 AS3.0 进行游戏设计，很大一部分内容就是学习如何控制\
  \ `Sprite` 对象。这通常是通过改变 `Sprite` 的属性来实现的。在本章中，我们已经遇到了两个 `Sprite` 属性：`x` 和 `y` 属性。我们学会了如何改变这些属性来定位舞台上的对象。让我们更仔细地看看\
  \ `Sprite` 属性是什么，以及你能用它们做什么。\n\n属性是你可以通过代码控制的对象特征。这些特征是什么？它们可以是附加到你所创建对象上的变量。或者，它们可以是属于\
  \ `Sprite` 类的一些内置属性。这些内置属性对游戏设计师尤其有用。\n\n`Sprite` 类拥有大量你可以访问、使用，有时甚至修改的属性。但是，对于本书中大多数游戏所需的交互类型，你只需频繁使用少数几个属性。更为难得的是，它们也是用起来非常有趣的属性！表\
  \ 3-1 列出了这些属性。\n\n![Image](img/9781430239922_tab03-01b.jpg)\n\n还有一些额外的属性用于在 3D 空间中变换对象。本书中你不会用到它们，但你应该知道它们的存在，并在有机会时尝试使用。虽然它们的主要目的是作为创建\
  \ 3D 对象和空间的构建块，但你可能会在你的一些游戏中将它们用于特殊效果。表 3-2 展示了你可能想了解的 3D 属性。\n\n![Image](img/9781430239922_tab03-02.jpg)\n\
  \n使用所有这些属性可以非常有趣，而且它们很容易使用。在接下来的几节中，我们将在我们的 `GameWorld` 项目中使用它们，将角色对象变成一个交互式玩具。\n\
  \n#### 上下移动\n\n我们要做的第一件事是编写向上和向下按钮的程序，使角色在舞台上上下移动。有几种方法可以编写这些按钮的程序。为了确切演示 `x` 和\
  \ `y` 属性是如何工作的，以及如何改变它们，我们将从最简单的方法开始，然后稍微修改一下程序，使其效果更逼真一些。\n\n在 `GameWorld.as` 文件中添加或更改以下加粗显示的代码（我们将在下一节中详细了解它的工作原理）：\n\
  \n```\npackage\n{\n  import flash.display.Loader;\n  import flash.display.Sprite;\n\
  \  import flash.events.MouseEvent;\n  import flash.net.URLRequest;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n\
  \  public class GameWorld extends Sprite\n  {\n    //所有变量声明…\n\n    public function\
  \ GameWorld()\n    {\n      //所有用于创建、显示和定位对象的代码…\n\n      //添加按钮监听器\n      upButton.addEventListener(MouseEvent.CLICK,\
  \ upButtonHandler);\n      downButton.addEventListener\n        (MouseEvent.CLICK,\
  \ downButtonHandler);\n    }\n    public function upButtonHandler(event:MouseEvent):void\n\
  \    {\n      character.y = 100;\n    }\n    public function downButtonHandler(event:MouseEvent):void\n\
  \    {\n      character.y = 200;\n    }\n  }\n}\n```\n\n*本书中代码示例的最大行宽是 70 个字符。然而，你要编写的许多\
  \ AS3.0 代码行会远比这个长得多。为了使这些代码示例易于阅读，而又不必使用令人困惑的换行符，我对长代码行采用了一种简单的格式化系统。*\n\n*我将在**运算符**处断开长代码行。运算符可以指以下任何字符：`(\
  \ ) = + - * / || !`*\n\n*然后我会缩进两个空格，并从该点继续编写代码行。*\n\n*这是你刚刚编写的程序中的一个示例。下面的代码段太长，无法放入一行：*\n\
  \n*`downButton.addEventListener(MouseEvent.CLICK, downButtonHandler);`*\n\n*所以我在左括号处断行，另起一行，缩进两个空格，然后从该点继续代码：*\n\
  \n*`downButton.addEventListener`*\n\n*`  (MouseEvent.CLICK, downButtonHandler);`*\n\
  \n*你如何为代码添加空格或缩进不会影响程序的运行方式。只需记住，分号会始终告诉你指令在哪里结束。*\n\n*我们将在本书中编写一些非常长的单行代码。我将向你展示一些格式化它们的策略，以便在遇到它们时更容易阅读。*\n\
  \n编译程序。点击向上和向下按钮，观察角色在舞台上上下移动。图 3-40 展示了你会看到的效果。\n\n![Image](img/9781430239922_Fig03-40.jpg)\n\
  \n**图 3-40.** 点击按钮使角色在舞台上上下移动。\n\n这太神奇了，不是吗？有趣的是，如此简单的效果看起来却如此令人满足，尤其是在你为这个程序付出了这么多努力之后。\n\
  \n你应该能认出大部分新代码。你为向下按钮创建了一个事件监听器和一个处理函数。你还在按钮事件处理函数中添加了两条指令，以便在点击按钮时改变角色的 `y` 位置属性。\n\
  \n\n\n#### 逐步移动\n\n按钮已经生效：它们能让我的猫咪角色在舞台上上下移动。但跳跃幅度太大了，而且只能让它在两个位置之间来回移动。如果能以细微、渐进的增量移动角色，并且不受限于两个点，那该多好啊？这样效果会更逼真，玩起猫咪玩具来也更有趣。幸运的是，这很容易实现：\n\
  \n1.  用以下加粗的新文本更新 `upButtonHandler` 和 `downButtonHandler` 中的指令：\n    ```\n    public\
  \ function upButtonHandler(event:MouseEvent):void\n    {\n      character.y = character.y\
  \ - 15;\n    }\n    public function downButtonHandler(event:MouseEvent):void\n \
  \   {\n      character.y = character.y + 15;\n    }\n    ```\n2.  编译程序。再次点击向上和向下按钮，现在猫咪会朝任一方向移动\
  \ 15 像素。好多了！\n\n但这是如何实现的呢？一旦理解了，背后的逻辑其实非常简单。让我们看看 `downButtonHandler` 的指令：\n\n`character.y\
  \ = character.y + 15;`\n\n这条指令获取猫咪当前的 `y` 位置，加上 15 像素，然后将新的总数重新赋值给猫咪当前的 `y` 位置。可以这样理解：猫咪的新位置是点击按钮前的位置加上\
  \ 15 像素的组合。你想让猫咪在舞台上向下移动，所以需要*增加*它的 `y` 位置。\n\n我知道，这有点让人脑筋转不过弯！让我们再分解一下。在我的程序中，角色的起始位置是\
  \ 150 像素。每当程序看到 `character.y` 时，都会将其解释为“150 像素”。你设置了程序，使得每次点击向下按钮时，都会在角色的 y 位置上加\
  \ 15 像素。这就是指令中加粗部分所做的事情：\n\n`character.y = character.y + 15;`\n\n它只是给猫咪的 y 位置加上了\
  \ 15，所以猫咪的新 y 位置是 165。因此你实际上可以这样写这条指令：\n\n`character.y = 165;`\n\n真的很简单，不是吗？\n\n\
  下次点击按钮时，发生的情况完全相同，只是此时 `character.y` 的起始值是 165 像素。再次加上 15 像素，新值就变成了 180。每次点击按钮，都会在该位置上再增加\
  \ 15 像素，结果就是猫咪看起来像是在舞台上逐渐向下移动。\n\n##### 追踪输出\n\n为了帮助你理解其工作原理，可以在程序的事件处理函数中添加一条 `trace`\
  \ 指令：\n\n1.  将以下加粗代码添加到 `upButtonHandler` 和 `downButtonHandler` 中：\n    ```\n  \
  \  public function upButtonHandler(event:MouseEvent):void\n    {\n      character.y\
  \ = character.y - 15;\n      trace(character.y);\n    }\n    public function downButtonHandler(event:MouseEvent):void\n\
  \    {\n      character.y = character.y + 15;\n      trace(character.y);\n    }\n\
  \    ```\n2.  再次编译程序。\n\n多次点击向下按钮。每次点击，你都会看到 `character.y` 属性的新值以 `trace` 消息的形式显示出来。虽然你的数字会有所不同，但效果与你在图\
  \ 3-41 中看到的情况类似。每次点击，数值都会增加 15。\n\n点击向上按钮，随着角色在舞台上向上移动，会产生相反方向的数值。\n\n![图片](img/9781430239922_Fig03-41.jpg)\n\
  \n**图 4-41.** 每点击一次向下按钮，角色的 y 位置增加 15 像素。\n\n使用 `trace` 指令是帮助你弄清楚代码正在做什么的好方法，并且在测试和调试本书中的项目时，你会经常使用它。\n\
  \n##### 使用递增和递减运算符\n\n有一种稍微更高效的方式来编写这段代码。像你刚才所做的那样增量更新值，是一种非常常见且有用的操作，因此 AS3.0 提供了专门的运算符来为你完成这项工作。\n\
  \n***运算符** 是像 `=`、`-`、`+` 和 `*` 这样的符号，它们对值执行专门的操作，例如赋值、加法或减法。*\n\n你将使用的两个新运算符被称为**递增**和**递减**运算符。让我们更新\
  \ `upButtonHandler` 和 `downButtonHandler`，以便它们使用这些运算符：\n\n1.  更改 `upButtonHandler`\
  \ 和 `downButtonHandler`，使其与下面的代码匹配。（我没有包含 `trace` 指令，如果你愿意可以将其删除。保留它们也没问题，不会影响程序的运行。）\n\
  \    ```\n    public function upButtonHandler(event:MouseEvent):void\n    {\n  \
  \    character.y -= 15;\n    }\n    public function downButtonHandler(event:MouseEvent):void\n\
  \    {\n      character.y += 15;\n    }\n    ```\n2.  编译程序，再次点击向上和向下按钮。\n\n程序的功能完全相同，但我通过使用递减运算符简化了代码：\n\
  \n`-=`\n\n以及递增运算符：\n\n`+=`\n\n这些运算符通过将新值重新赋值回原始属性来工作。`-=` 运算符减去该值，`+=` 运算符则加上该值。\n\
  \n递增和递减是游戏设计师的基本工具，所以要习惯使用它们，因为从现在开始你会经常用到它们。\n\n\n\n##### 限制移动范围\n\n你可能已经注意到，小猫在舞台上可以无限向上或向下移动。实际上，你可以让角色一直移动到舞台顶部，并继续无限延伸超出边界。能够以如此具体的方式对“无限”这样的抽象概念进行建模，确实有一种存在主义式的魅力，但这对于你的游戏来说毫无帮助！\n\
  \n你必须使用条件语句来限制角色的移动范围。你可以通过 `if` 关键字来创建条件语句。条件语句会检查角色的 `y` 坐标是否在允许范围内；如果不在，它就会阻止事件处理程序中的指令执行。\n\
  \n`if` 语句非常容易实现。它是一个块语句，你可以将其放置在程序中的任何位置，用于检查某个特定条件是否为真。如果条件为真，则块内的指令会执行；如果条件为假，则这些指令不会执行。\n\
  \n下面是一个用通俗的英语解释 `if` 语句如何工作的例子：\n\n```\nif (括号内的条件为真)\n{\n  ... 则运行大括号内的指令。\n}\n\
  ```\n\n现在，让我们在你刚写好的方法中实际使用一个 `if` 语句来测试一下。我们将阻止我们的游戏角色移出舞台的顶部或底部边界。\n\n1.  将以下加粗显示的代码添加到程序中：\n\
  \    ```\n    public function upButtonHandler(event:MouseEvent):void\n    {\n  \
  \    if(character.y> 0)\n      {\n        character.y -= 15;\n      }\n    }\n \
  \   public function downButtonHandler(event:MouseEvent):void\n    {\n      if(character.y<\
  \ 300)\n      {\n        character.y += 15;\n      }\n    }\n    ```\n2.  编译程序，再次尝试点击向上和向下按钮。现在角色被阻止移出舞台顶部和底部了。这正是我们想要达到的效果！\n\
  \n让我们看看 `if` 语句在 `upButtonHandler` 方法中是如何工作的：\n\n```\nif(character.y> 0)\n{\n  character.y\
  \ -= 15;\n}\n```\n\n使其工作的关键在于括号内的条件语句：\n\n`if(character.y> 0)`\n\n条件语句用于检查某个特定条件是真还是假。上面的条件语句正在检查小猫的\
  \ `y` 坐标是否大于 0。如果条件结果为真，则执行花括号内包含的指令。请记住，0 是舞台最顶部的 `y` 值，而角色的 `y` 坐标是从其左上角开始测量的。\n\
  \n条件语句使用条件运算符来进行检查。这个 `if` 语句中使用的条件运算符是“大于运算符”。它看起来像这样：\n\n`>`\n\n这个运算符检查其左侧的值（角色的\
  \ `y` 坐标）是否大于右侧的值。AS3.0 中提供了许多条件运算符，表 4-3 列出了最常用的一些。\n\n![Image](img/9781430239922_tab03-03.jpg)\n\
  ![Image](img/9781430239922_tab03-03a.jpg)\n\n请将这张表放在手边，因为在接下来的项目中，你会非常频繁地用到其中的许多运算符。\n\
  \n检查角色是否向下移动过多的代码可能稍微难以理解一些：\n\n```\nif(character.y< 300)\n{\n  character.y += 15;\n\
  }\n```\n\n这基本上是在说：“当角色的 `y` 坐标小于 300 时，允许角色在舞台上向下移动 15 像素”。这意味着如果角色的 `y` 坐标等于或大于\
  \ 300，角色就不会移动。\n\n但数字 300 是从哪来的呢？我们知道舞台顶部的 `y` 坐标是 0，舞台底部的 `y` 坐标是 400。如果我们想阻止角色移出舞台底部，难道不应该用\
  \ 400 吗？\n\n在这个例子中却不是这样，我们必须使用 300，原因如下：\n\n关于我们的游戏角色，有两个重要的事实需要记住：\n\n*   它的 `y`\
  \ 坐标是从其左上角测量的。\n*   它有 100 像素高。\n\n这意味着当它的脚（底部）接触到舞台底部时，它的左上角仍位于舞台底部上方 100 像素的位置。为了精确地阻止它的脚越过舞台底部，我们必须在其左上角位于\
  \ `y` 坐标为 300 时停止移动它。这等于舞台高度减去角色的高度。如果我们在 400 时停止它，角色的整个身体早已消失了。在你的程序中测试一下，看看效果吧！\n\
  \n当我们在第 5 章中讨论设置舞台边界时，会更详细地研究这个问题。\n\n\n\n#### 放大与缩小\n\n玩弄 `Sprite` 的属性可以带来很多乐趣。接下来，我们要借鉴《爱丽丝梦游仙境》中的做法，使用\
  \ `scaleX` 和 `scaleY` 属性让角色变大或变小：\n\n1. 仔细将以下**粗体**显示的新代码添加到 `GameWorld.as` 文件中：\n\
  \   ```\n   package\n   {\n     import flash.net.URLRequest;\n     import flash.display.Loader;\n\
  \     import flash.display.Sprite;\n     import flash.events.MouseEvent;\n\n   \
  \  [SWF(width=\"550\", height=\"400\",\n       backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\n     public class GameWorld extends Sprite\n     {\n       //所有变量声明...\n\
  \n       public function GameWorld()\n       {\n         //所有用于创建、显示和定位对象的代码...\n\
  \n         //添加按钮监听器\n         upButton.addEventListener(MouseEvent.CLICK, upButtonHandler);\n\
  \         downButton.addEventListener\n           (MouseEvent.CLICK, downButtonHandler);\n\
  \         growButton.addEventListener\n           (MouseEvent.CLICK, growButtonHandler);\n\
  \         shrinkButton.addEventListener\n           (MouseEvent.CLICK, shrinkButtonHandler);\n\
  \       }\n       public function upButtonHandler(event:MouseEvent):void\n     \
  \  {\n         if(character.y> 0)\n         {\n           character.y -= 15;\n \
  \        }\n       }\n       public function downButtonHandler(event:MouseEvent):void\n\
  \       {\n         if(character.y< 300)\n         {\n           character.y +=\
  \ 15;\n         }\n       }\n       public function growButtonHandler(event:MouseEvent):void\n\
  \       {\n         character.scaleX += 0.1;\n         character.scaleY += 0.1;\n\
  \       }\n       public function shrinkButtonHandler(event:MouseEvent):void\n \
  \      {\n         character.scaleX -= 0.1;\n         character.scaleY -= 0.1;\n\
  \       }\n     }\n   }\n   ```\n2. 编译程序，然后点击放大和缩小按钮。现在您可以改变角色的大小，如图 Figure 3-42\
  \ 所示。\n\n![图片](img/9781430239922_Fig03-42.jpg)\n\n**Figure 3-42.** 点击放大和缩小按钮来改变猫的大小。\n\
  \n*您会注意到角色是从其左上角开始改变大小的。这是因为左上角是其注册点所在位置。如果角色能从其中心均匀地放大或缩小，效果会更自然。在本章末尾，我将向您展示如何居中\
  \ `Sprite` 的注册点来实现这种效果。*\n\n`growButtonHandler` 和 `shrinkButtonHandler` 的基本功能与向上和向下按钮的处理程序相同。但这里使用的是\
  \ `scaleX` 和 `scaleY` 属性来水平和垂直缩放角色，而不是使用 `y` 属性。您需要同时使用这两个属性才能均匀缩放。如果只使用其中一个，比如\
  \ `scaleX`，角色腹部会变得非常胖，但高度却完全不会增加。（试试看！）\n\n*实际上，既然您知道可以同时改变两个属性，您也可以用 `x` 和 `y`\
  \ 属性来尝试。要让角色在舞台上沿对角线移动，您可以修改向上和向下按钮的事件处理程序，使其如下所示：*\n\n```\npublic function upButtonHandler(event:MouseEvent):void\n\
  {\n  if(character.y> 0)\n  {\n    character.y -= 15;\n    character.x += 10;\n \
  \ }\n}\npublic function downButtonHandler(event:MouseEvent):void\n{\n  if(character.y<\
  \ 300)\n  {\n    character.y += 15;\n    character.x -= 10;\n  }\n}\n```\n\n试试看！\n\
  \n`scaleX` 和 `scaleY` 属性使用的值代表对象缩放的比例。这意味着所有对象在其原始大小下，该值均为 1。如果您想将对象的尺寸加倍，就需要将 `scaleX`\
  \ 和 `scaleY` 的值设为 2。在您添加的新代码中，每次点击按钮，猫的缩放比例就会增加或减少 0.1，这相当于其原始大小的 10% 变化。\n\n将 `scaleX`\
  \ 和 `scaleY` 属性与 `height` 和 `width` 属性进行对比是很有趣的。它们都能修改对象的大小，但 `height` 和 `width`\
  \ 属性使用的是像素值。让我们对 `growButtonHandler` 和 `shrinkButtonHandler` 做一些小改动来测试一下。为了让效果更有趣，我们对高度和宽度使用不同的数值，这样角色就不会在各方向上均匀改变大小了。\n\
  \n1. 对 `growButtonHandler` 和 `shrinkButtonHandler` 进行以下修改，用**粗体**显示的代码替换原始代码：\n\
  \   ```\n   public function growButtonHandler(event:MouseEvent):void\n   {\n   \
  \  character.height += 25;\n     character.width += 15;\n   }\n   public function\
  \ shrinkButtonHandler(event:MouseEvent):void\n   {\n     character.height -= 25;\n\
  \     character.width -= 15;\n   }\n   ```\n2. 编译程序。\n\n多次点击放大和缩小按钮，您会注意到角色逐渐被拉伸或压扁，如图\
  \ Figure 3-43 所示。这是因为，虽然角色精确地有 100 像素高和 100 像素宽，但这些指令分别为高度和宽度增加了不同的像素数。如果您为高度和宽度提供完全相同的值，它就会在两个维度上均匀地放大和缩小。\n\
  \n![图片](img/9781430239922_Fig03-43.jpg)\n\n**Figure 3-43.** 以不同的增量改变高度和宽度来压扁或拉伸一个方形对象。\n\
  \n\n\n#### 消失！\n\n接下来这个小技巧将使用 `visible` 属性让角色消失。`visible` 属性与你之前看到的其他属性略有不同，因为它使用**布尔**值。布尔值是只能为\
  \ `true` 或 `false` 的值。这可以让你利用一点编程手法来制作一个切换按钮。你只需一个按钮就能切换（或开关）猫的可见性。\n\n1.  将以下新代码以粗体形式添加到\
  \ `GameWorld.as` 文件中：\n\n```\npackage\n{\n  import flash.net.URLRequest;\n  import\
  \ flash.display.Loader;\n  import flash.display.Sprite;\n  import flash.events.MouseEvent;\n\
  \n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\n  public class GameWorld extends Sprite\n  {\n    //所有变量声明...\n\n    public\
  \ function GameWorld()\n    {\n      //所有创建、显示和定位对象的代码...\n\n      //添加按钮监听器\n \
  \     upButton.addEventListener(MouseEvent.CLICK, upButtonHandler);\n      downButton.addEventListener\n\
  \        (MouseEvent.CLICK, downButtonHandler);\n      growButton.addEventListener\n\
  \        (MouseEvent.CLICK, growButtonHandler);\n      shrinkButton.addEventListener\n\
  \        (MouseEvent.CLICK, shrinkButtonHandler);\n      vanishButton.addEventListener\n\
  \        (MouseEvent.CLICK, vanishButtonHandler);\n    }\n    public function upButtonHandler(event:MouseEvent):void\n\
  \    {\n      if(character.y> 0)\n      {\n        character.y -= 15;\n      }\n\
  \    }\n    public function downButtonHandler(event:MouseEvent):void\n    {\n  \
  \    if(character.y< 300)\n      {\n        character.y += 15;\n      }\n    }\n\
  \    public function growButtonHandler(event:MouseEvent):void\n    {\n      character.height\
  \ += 15;\n      character.width += 15;\n    }\n    public function shrinkButtonHandler(event:MouseEvent):void\n\
  \    {\n      character.height -= 15;\n      character.width -= 15;\n    }\n   \
  \ public function vanishButtonHandler(event:MouseEvent):void\n    {\n      character.visible\
  \ = false;\n    }\n  }\n}\n```\n\n2.  编译程序并点击消失按钮。猫会消失。图 3-44 展示了你将……看不到的画面！\n\n\
  ![图片](img/9781430239922_Fig03-44.jpg)\n\n**图 3-44.** 通过将 `visible` 属性设置为 `false`\
  \ 来让对象消失。\n\n实现消失效果的关键指令是 `vanishButtonHandler` 中的这一行：\n\n`character.visible = false;`\n\
  \n与你见过的其他属性一样，`visible` 属性只是通过点符号附加到对象上。但不同的是，这是你遇到的第一个使用布尔值 `false` 的属性。该指令的意思是：\"\
  不，角色不可见。\"\n\n点击消失按钮后，小猫不仅消失了，而且是永久消失。再怎么点按钮也无法让它回来。实际上，猫仍然作为可编程的对象存在于舞台上，只是你看不见它。怎样才能让猫再次可见呢？\n\
  \n有两种方法。一种方法是创建另一个按钮，并用与可见性按钮完全相同的代码进行编程，只不过将 `visible` 属性的值设为 `true`，像这样：\n\n`character.visible\
  \ = true;`\n\n第二种方法更有趣一些：使用单个按钮让猫既能消失又能重新出现。\n\n如果要切换的两个状态可以用 `true` 和 `false` 值来定义，AS3.0\
  \ 提供了一种非常简单的方法来制作切换按钮，即使用非运算符。非运算符就是一个感叹号，像这样：\n\n`!`\n\n它的字面意思是\"非\"。当与布尔值一起使用时，它表示\"\
  相反的值\"。你可以将非运算符放在任何布尔值前面，将其解读为相反的值。下面我们在 `vanishButtonHandler` 中使用非运算符，将消失按钮变成切换按钮：\n\
  \n1.  修改 `vanishButtonHandler` 中的指令，使其如下所示：\n\n```\npublic function vanishButtonHandler(event:MouseEvent):void\n\
  {\n  character.visible = !character.visible;\n}\n```\n\n2.  编译程序并点击消失按钮几次。你应该每次点击都能看到猫出现和消失。\n\
  \n这就是你赋给 `visible` 属性的新值：\n\n`!character.visible;`\n\n它的字面意思是\"当前角色可见状态的相反值\"。如果猫当前的可见状态是\
  \ `true`，则相反状态将是 `false`。如果当前状态是 `false`，则状态将被解读为 `true`。\n\n程序首次运行时，角色显然可见。它的 `visible`\
  \ 属性为 `true`。当点击消失按钮时，程序将 `!character.visible` 解读为 `false`。角色消失了！第二次点击按钮时，角色的 `visible`\
  \ 属性现在为 `false`，因此程序将 `!character.visible` 解读为 `true`。角色重新出现！\n\n以这种方式使用非运算符的妙处在于，你永远不需要知道\
  \ `visible` 属性是 `true` 还是 `false`。程序会为你跟踪这一点。而且你只需要一个按钮就可以在这两种状态之间切换。\n\n你可以将非运算符的这一特性用于任何接受布尔值（`true`\
  \ 或 `false`）的变量或属性，从而在两个状态之间切换。布尔值在游戏设计中极为有用，用于跟踪诸如敌人是死是活、物品是否已拾取、门是锁着还是没锁等情况。无论你在何处使用布尔值，你很可能都会找到非运算符的巧妙用途，就像你在这里用到的一样。\n\
  \n\n\n##### 旋转\n\n接下来我们要编写旋转按钮的代码，让角色围绕其注册点旋转。这将演示如何使用 `rotation` 属性。\n\n1.  在已有代码中添加以下粗体标注的新代码：\n\
  \n```\npackage\n{\n  import flash.net.URLRequest;\n  import flash.display.Loader;\n\
  \  import flash.display.Sprite;\n  import flash.events.MouseEvent;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n\
  \  public class GameWorld extends Sprite\n  {\n    //所有变量声明...\n\n    public function\
  \ GameWorld()\n    {\n      //所有用于创建、显示\n      //和定位对象的代码...\n\n      //添加按钮监听器\n\
  \      upButton.addEventListener(MouseEvent.CLICK, upButtonHandler);\n      downButton.addEventListener\n\
  \        (MouseEvent.CLICK, downButtonHandler);\n      growButton.addEventListener\n\
  \        (MouseEvent.CLICK, growButtonHandler);\n      shrinkButton.addEventListener\n\
  \        (MouseEvent.CLICK, shrinkButtonHandler);\n      vanishButton.addEventListener\n\
  \        (MouseEvent.CLICK, vanishButtonHandler);\n      spinButton.addEventListener\n\
  \        (MouseEvent.CLICK, spinButtonHandler);\n    }\n    public function upButtonHandler(event:MouseEvent):void\n\
  \    {\n      if(character.y> 0)\n      {\n        character.y -= 15;\n      }\n\
  \    }\n    public function downButtonHandler(event:MouseEvent):void\n    {\n  \
  \    if(character.y< 300)\n      {\n        character.y += 15;\n      }\n    }\n\
  \    public function growButtonHandler(event:MouseEvent):void\n    {\n      character.height\
  \ += 15;\n      character.width += 15;\n    }\n    public function shrinkButtonHandler(event:MouseEvent):void\n\
  \    {\n      character.height -= 15;\n      character.width -= 15;\n    }\n   \
  \ public function vanishButtonHandler(event:MouseEvent):void\n    {\n      character.visible\
  \ = false;\n    }\n    public function spinButtonHandler(event:MouseEvent):void\n\
  \    {\n      character.rotation += 20;\n    }\n  }\n}\n```\n\n2.  点击旋转按钮。现在角色会围绕其左上角轴线旋转，如图\
  \ 3-45 所示。\n\n![图片](img/9781430239922_Fig03-45.jpg)\n\n**图 3-45.** 点击按钮使角色旋转。\n\n\
  `rotation` 属性的使用方法与之前学习的其他属性非常相似：\n\n`character.rotation += 20;`\n\n`rotation` 属性接受圆的角度值，因此你可以使用的范围是\
  \ 0 到 360。正值使对象顺时针旋转，负值使其逆时针旋转。旋转的中心是对象自身的中心注册点。在这个例子中，它是我的猫的左耳。下一节我将展示如何创建注册点位于正中心的\
  \ `Sprite` 对象。\n\n##### 更多属性？\n\n本章开头表格中还有两个重要属性尚未在这个小交互玩具中使用：\n\n*   `alpha`：控制对象的透明度，接受\
  \ 0（完全透明）到 1（完全不透明或实体）之间的值。\n*   `x`：控制对象的水平位置，与其“同伙” `y` 属性一样，接受以像素为单位的值。\n\n这些属性的功能与你已使用的属性非常相似。因此，这里有一个小任务给你：何不创建一对能让猫左右移动的按钮，以及另一对能让猫逐渐消失和重新出现的按钮？我相信你能搞定！同时也可以尝试操作\
  \ 3D 属性：`z`、`rotationX`、`rotationY`、`rotationZ` 和 `scaleZ`。\n\n玩得开心，完成测试后我们下一节见。\n\
  \n\n\n### 居中精灵\n\n正如你刚刚所见，旋转按钮工作正常，但如果你能让角色围绕其中心点旋转，岂不是更好？放大和缩小按钮也能工作，但你的角色是从其左上角开始放大和缩小的。对于大多数游戏来说，你希望这些效果从对象的实际中心点发生。\n\
  \n正如我们本章前面讨论过的，这与角色的注册点位于其左上角有关。当你将一个 PNG 图像文件加载到 `Sprite` 中时，AS3.0 会自动以这种方式对齐它。\n\
  \n但这是为什么呢？让我们退后几步，回想一下当你在程序中加载图像并将其显示在舞台上时会发生什么。\n\n你会记得，图像是被加载到一个 `Loader` 对象中的。然后这个\
  \ `Loader` 被添加到一个 `Sprite` 对象中。最后，这个 `Sprite` 被添加到舞台上。图 3-46 展示了这一点。\n\n![Image](img/9781430239922_Fig03-46.jpg)\n\
  \n**图 3-46.** 图像由三个对象包含：`Loader`、`Sprite` 和舞台。\n\n所以，尽管你在舞台上只能看到角色的图像，但实际上它被一个不可见的\
  \ `Sprite` 包围着，而这个 `Sprite` 里又包含一个不可见的 `Loader`。这就像我们那套套娃一样！请记住这一点。\n\n你知道舞台是一个网格，并且你可以使用\
  \ `x` 和 `y` 属性将 `Sprite` 对象放置在网格上的任意位置。但你还不知道的是，包含图像的 `Sprite` *本身也是一个网格*。当你向 `Sprite`\
  \ 添加图像时，图像加载器的左上角会被定位在 `x` 和 `y` 为 0,0 的位置——*位于 Sprite 自身的网格内部*。0,0 就是 `Sprite`\
  \ 的注册点。图 3-47 展示了它的样子。\n\n![Image](img/9781430239922_Fig03-47.jpg)\n\n**图 3-47.**\
  \ `Sprite` 将图像加载器放置在其局部网格的 0,0 位置。\n\n这突显了一个非常重要的概念。一个图像实际上有两个坐标：它的**舞台坐标**和它在包含它的\
  \ `Sprite` 内部的**局部坐标**。请记住这一点，因为你通常需要同时了解这两个坐标，才能精确调整游戏中对象的位置。\n\n`Sprite` 局部网格中的\
  \ 0,0 位置就是它的注册点。你可以在图 3-47 中清晰地看到这一点。猫的左耳位于 0,0 点。如果我们想让注册点位于猫图像的中心，我们必须移动 `Sprite`\
  \ 网格内部的图像加载器，使其居中于 0,0 位置上方。图 3-48 展示了我们需要实现的目标。\n\n![Image](img/9781430239922_Fig03-48.jpg)\n\
  \n**图 3-48.** 将图像加载器居中于 `Sprite` 的 0,0 点上方，以实现注册点居中。\n\n如果我们能做到这一点，角色将从其中心进行放大、缩小和旋转。所有这些都可以通过两行简单的代码完成。让我们看看如何操作。\n\
  \n1.  在 `GameWorld.as` 文件中找到你将角色添加到舞台的代码段。请仔细添加下面以粗体显示的新代码。\n    ```\n    //Add\
  \ the character to the stage\n    characterURL = new URLRequest();\n    characterLoader\
  \ = new Loader();\n    character = new Sprite();\n    characterURL.url = \"../images/character.png\"\
  ;\n    characterLoader.load(characterURL);\n    characterLoader.x = -50;\n    characterLoader.y\
  \ = -50;\n    character.addChild(characterLoader);\n    stage.addChild(character);\n\
  \    character.x = 225;\n    character.y = 150;\n    ```\n2.  编译程序。\n\n你首先会注意到角色不再位于舞台中央。它向左上方偏移了\
  \ 50 像素，如图 3-49 所示。\n\n![Image](img/9781430239922_Fig03-49.jpg)\n\n**图 3-49.** 角色现在偏移了\
  \ 50 像素。\n\n如果你在本章中一直保持专注，现在应该清楚为什么会发生这种情况。你刚刚添加的新代码将图像加载器对象向左移动了 50 像素，向上移动了 50\
  \ 像素。\n\n```\ncharacterLoader.x = -50;\ncharacterLoader.y = -50;\n```\n\n你已将其定位*在\
  \ Sprite 内部*。因为角色正好是 100 像素见方，所以图像加载器现在直接居中于 `Sprite` 的注册点上方。\n\n这很好，但这也意味着你需要通过将所有角色的\
  \ `x` 和 `y` 属性值调整 50 像素来补偿这一点。如果你想让角色在舞台上居中，要像这样在你之前用于居中的值上加 50 像素：\n\n```\ncharacter.x\
  \ = 275;\ncharacter.y = 200;\n```\n\n如果你修改这些属性并再次编译程序，角色的正中心现在将位于舞台的正中心。\n\n嘿，现在去试试放大、缩小和旋转按钮吧！我们现在得到了我们想要的效果——它们都从角色的中心发生，如图\
  \ 3-50 所示。我们已成功地将图像居中于 `Sprite` 的注册点上方。\n\n![Image](img/9781430239922_Fig03-50.jpg)\n\
  \n**图 3-50.** 从中心进行放大、缩小和旋转。\n\n为了保持简单，本书中的大部分代码都将 `Sprite` 的注册点保持在左上角。但正如你所见，在很多情况下，居中注册点对于实现某些效果至关重要。\n\
  \n\n\n### 代码总结\n\n我们在本章中编写了大量的 AS3.0 代码！为了让你对已编写的内容没有任何疑问，以下是 `GameWorld` 项目的完整最终代码。我使用**粗体**高亮注释作为主要代码段的标题，以便你轻松查看各部分的组织方式。在本章的源文件中，你还可以在\
  \ `GameWorldFinished` 文件夹中找到该项目的可运行示例。\n\n```\npackage\n{\n  import flash.display.Loader;\n\
  \  import flash.display.Sprite;\n  import flash.events.MouseEvent;\n  import flash.net.URLRequest;\n\
  \  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"\
