  \ 个对象。以下是简化后的代码：\n\n```actionscript\npublic var bomb1:Bomb = new Bomb();\n...\n\
  public var bomb5:Bomb = new Bomb();\n\npublic var box1:Box = new Box();\n...\npublic\
