  \ == 2)\n        {\n            _gameOverTimer.reset();\n            gameOverTimer.removeEventListener\n\
  \                (TimerEvent.TIMER, gameOverTimerHandler);\n            //dispatchEvent(new\
  \ Event(\"levelOneComplete\", true));\n        }\n    }\n    if(_levelWinner ==\
  \ \"monsters\")\n    {\n        _gameOver.youLost.visible = true;\n        gameOverTimer.removeEventListener\n\
  \            (TimerEvent.TIMER, gameOverTimerHandler);\n    }\n}\nprivate function\
  \ keyDownHandler(event:KeyboardEvent):void\n{\n    if (event.keyCode == Keyboard.LEFT)\n\
  \    {\n        _character.vx = -5;\n        if(!_star.launched)\n        {\n  \
  \          _starDirection = \"left\";\n        }\n    }\n    else if (event.keyCode\
  \ == Keyboard.RIGHT)\n    {\n        _character.vx = 5;\n        if(!_star.launched)\n\
  \        {\n            _starDirection = \"right\";\n        }\n    }\n    else\
  \ if (event.keyCode == Keyboard.UP)\n    {\n        _character.vy = -5;\n      \
  \  if(!_star.launched)\n        {\n            _starDirection = \"up\";\n      \
  \  }\n    }\n    else if (event.keyCode == Keyboard.DOWN)\n    {\n        _character.vy\
  \ = 5;\n        if(!_star.launched)\n        {\n            _starDirection = \"\
  down\";\n        }\n    }\n    if(event.keyCode == Keyboard.SPACE)\n    {\n    \
  \    if(!_star.launched)\n        {\n            _star.x = _character.x + _character.width\
  \ / 2;\n            _star.y = _character.y + _character.width / 2;\n           \
  \ _star.launched = true;\n        }\n    }\n}\nprivate function keyUpHandler(event:KeyboardEvent):void\n\
  {\n    if (event.keyCode == Keyboard.LEFT\n    || event.keyCode == Keyboard.RIGHT)\n\
  \    {\n        _character.vx = 0;\n    }\n    else if (event.keyCode == Keyboard.DOWN\n\
  \    || event.keyCode == Keyboard.UP)\n    {\n        _character.vy = 0;\n    }\n\
  }\nprivate function addGameObjectToLevel\n    (gameObject:Sprite, xPos:int, yPos:int):void\n\
  {\n    this.addChild(gameObject);\n    gameObject.x = xPos;\n    gameObject.y =\
  \ yPos;\n}\n```\n\n\n\n### 滚动代码的工作原理\n\n为了简化代码，我将滚动所需的所有变量和对象都声明为类定义中的实例变量。这意味着在类的任何位置，只要需要，任何方法或对象都可以访问它们。\n\
  \n```\nprivate var _temporaryX:int;\nprivate var _temporaryY:int;\nprivate var _scroll_Vx:int;\n\
  private var _scroll_Vy:int;\nprivate var _rightInnerBoundary:uint;\nprivate var\
  \ _leftInnerBoundary:uint;\nprivate var _topInnerBoundary:uint;\nprivate var _bottomInnerBoundary:uint;\n\
  private var _currentExplosion:Sprite = null;\n```\n\n然后，`startGame` 方法会初始化内部边界变量。\n\
  \n```\n_rightInnerBoundary\n  = (_stage.stageWidth / 2) + (_stage.stageWidth / 4);\n\
  _leftInnerBoundary\n  = (_stage.stageWidth / 2) - (_stage.stageWidth / 4);\n_topInnerBoundary\n\
  \  = (_stage.stageHeight / 2) - (_stage.stageHeight / 4);\n_bottomInnerBoundary\n\
  \  = (_stage.stageHeight / 2) + (_stage.stageHeight / 4);\n```\n\n`enterFrameHandler`\
  \ 通过先将背景位置捕获到临时变量中，移动背景，然后计算滚动速度，从而计算出滚动速度。\n\n```\n_temporaryX = _background.x;\n\
  _temporaryY = _background.y;\n\n//...滚动背景...\n\n_scroll_Vx = _background.x - _temporaryX;\n\
  _scroll_Vy = _background.y - _temporaryY;\n```\n\n现在我们已经获得了 `_scroll_Vx` 和 `_scroll_Vy`\
  \ 变量，就可以使用 `scroll` 方法来滚动游戏对象了。\n\n```\n//滚动怪物\nscroll(_monster1);\nscroll(_monster2);\n\
  scroll(_monster3);\nscroll(_monster4);\n\n//滚动星星\nif(_star.launched)\n{\n  scroll(_star);\n\
  }\n```\n\n以下是完成这项工作的 `scroll` 方法：\n\n```\npublic function scroll(gameObject:Sprite):void\n\
  {\n  gameObject.x += _scroll_Vx;\n  gameObject.y += _scroll_Vy;\n}\n```\n\n由于游戏世界现在变得更大，`checkStageBoundaries`\
  \ 方法需要对此进行补偿。以下是更新后的 `checkStageBoundaries` 方法，它确保游戏对象不会越过游戏区域的边界：\n\n```\nprivate\
  \ function checkStageBoundaries(gameObject:Sprite):void\n{\n  if (gameObject.x <\
  \ _background.x + 50)\n  {\n    gameObject.x = _background.x + 50;\n  }\n  if (gameObject.y\
  \ < _background.y + 50)\n  {\n    gameObject.y = _background.y + 50;\n  }\n  if\
  \ (gameObject.x + gameObject.width\n  > _background.x + _background.width - 50)\n\
  \  {\n    gameObject.x\n      = _background.x + _background.width - gameObject.width\
  \ - 50;\n  }\n  if (gameObject.y + gameObject.height\n  > _background.y + _background.height\
  \ - 50)\n  {\n    gameObject.y\n    = _background.y + _background.height - gameObject.height\
  \ - 50;\n  }\n}\n```\n\n`checkStarStageBoundaries` 方法也进行了修改，以允许星星移动到舞台边界边缘。\n\n\
  ```\nprivate function checkStarStageBoundaries(star:Star):void\n{\n  if (star.y\
  \ < 0\n  || star.x < 0\n  || star.x > _stage.stageWidth\n  || star.y > _stage.stageHeight)\n\
  \  {\n     _star.launched = false;\n  }\n}\n```\n\n如你所见，所有这些代码只是为了适应更大的游戏世界，并将滚动速度添加到游戏对象的速度中。\n\
  \n有一个例外需要特别关注：如何滚动爆炸效果。\n\n### 滚动爆炸效果\n\n所有爆炸对象都是在 `killMonster` 方法中本地创建的，如下所示：\n\
  \n```\nvar explosion:Explosion = new Explosion();\nthis.addChild(explosion);\n```\n\
  \n这意味着它们无法在 `killMonster` 方法外部被访问。这是个问题，因为 `enterFrameHandler` 需要某种方式来访问它们，以便在它们被添加到舞台后能够滚动它们。\n\
  \n一个简单的解决方案是创建一个实例变量，用于存储对当前爆炸对象的引用。你可能还记得，实例变量是在类定义中声明的任何变量。它们可供类中任何位置的所有对象和所有方法使用。我在类定义中创建了一个名为\
  \ `_currentExplosion` 的实例变量，并将其初始值设为 `null`。\n\n```\nprivate var _currentExplosion:Sprite\
  \ = null;\n```\n\n它是一个 `Sprite`（精灵），因此可以包含任何扩展自 `Sprite` 类的对象，就像爆炸对象那样。\n\n当 `killMonster`\
  \ 方法创建一个临时爆炸对象时，你只需要将其复制到 `_currentExplosion` 变量中，如下所示：\n\n```\nvar explosion:Explosion\
  \ = new Explosion();\nthis.addChild(explosion);\n_currentExplosion = explosion;\n\
  ```\n\n这让你能够持有一个对临时爆炸对象的引用，该引用可用于类中的其他方法。`enterFrameHandler` 可以使用这个 `_currentExplosion`\
  \ 对象来滚动爆炸效果，如下所示：\n\n```\nif(_currentExplosion != null)\n{\n  scroll(_currentExplosion);\n\
  }\n```\n\n这种技术是引用临时对象并在创建它们的方法之外使用它们的快速简便方法。但这可能并非最佳方式。跟踪和控制临时对象会变得复杂，特别是当你需要同时访问多个临时对象时。在第\
  \ 10 章中，你将学习如何使用循环和数组来精确地添加、移除和控制游戏中的临时对象。\n\n\n\n#### 智能怪物\n\n让怪物主动追捕角色非常简单。代码需要做的只是判断怪物相对于角色的位置：是在上方、下方、左侧还是右侧。一旦明确方向，只需修改怪物的速度，使其向玩家移动即可。你需要编写的代码遵循以下逻辑。\n\
  \n```\nif (角色在怪物左侧)\n{\n  让怪物向左移动\n}\n```\n\n以下是《怪物大作战》中实际代码可能的样子：\n\n```\nif (_character.x\
  \ < monster.x)\n{\n  monster.vx = -2;\n  monster.vy = 0;\n}\n```\n\n如你所见，只需比较角色的`x`坐标和怪物的`x`坐标，然后将怪物向左移动即可。\n\
  \n你可以在项目源文件的 `IntelligentMonsters` 示例中查看所有这些代码的实际运行效果。运行 SWF 文件，你会注意到怪物在舞台上追逐角色。它们每秒都会决定应该向左或向右，还是向上或向下移动以接近角色。如果你停止移动角色，你会注意到怪物会蜂拥而至。图\
  \ 8-23 展示了怪物的行为。\n\n![图片](img/9781430239922_Fig08-23.jpg)\n\n**图 8-23.** 追逐玩家的怪物\n\
  \n实现此功能的代码极其简单。只需对 `changeMonsterDirection` 方法进行小幅修改。以下是更新后的方法：\n\n```\nprivate\
  \ function changeMonsterDirection(monster:Monster):void\n{\n  //在 1 和 2 之间选择一个随机数\n\
  \  var randomNumber:int = Math.ceil(Math.random() * 2);\n\n  //如果数字是 1，则沿水平轴靠近角色\n\
  \  if (randomNumber == 1)\n  {\n    if (_character.x > monster.x)\n    {\n     \
  \ //向右\n      monster.vx = 2;\n      monster.vy = 0;\n    }\n    if (_character.x\
  \ < monster.x)\n    {\n      //向左\n      monster.vx = -2;\n      monster.vy = 0;\n\
  \    }\n  }\n\n  //如果数字是 2，则沿垂直轴靠近角色\n  if (randomNumber == 2)\n  {\n    if (_character.y\
  \ < monster.y)\n    {\n      //向上\n      monster.vx = 0;\n      monster.vy = -2;\n\
  \    }\n    if (_character.y > monster.y)\n    {\n      //向下\n      monster.vx =\
  \ 0;\n      monster.vy = 2;\n    }\n  }\n}\n```\n\n代码首先在 1 和 2 之间选择一个随机数。\n\n```\n\
  var randomNumber:int = Math.ceil(Math.random() * 2);\n```\n\n如果数字是 1，怪物决定沿`x`轴靠近角色。\n\
  \n```\nif (randomNumber == 1)\n{\n   //向左或向右移动...\n}\n```\n\n如果随机数是 2，怪物则沿`y`轴靠近角色。\n\
  \n```\nif (randomNumber == 2)\n{\n   //向上或向下移动...\n}\n```\n\n我加入这点随机性是为了让游戏稍微容易一些。你可以轻松地让怪物在方向选择上非常精确，只选择最接近角色的方向移动。具体做法是比较`x`和`y`位置的距离，让怪物选择距离最长的方向。使用`Math.abs`方法可以计算出距离，而无需担心物体`x`和`y`坐标的正负值。\n\
  \n```\n//判断怪物是在 x 轴还是 y 轴上更接近角色\n\nvar vx:Number = Math.abs(_character.x - monster.x);\n\
  var vy:Number = Math.abs(_character.y - monster.y);\n\n//如果在 y 轴上已经更接近，则向右或向左移动角色\n\
  if (vx > vy)\n{\n  if (_character.x > monster.x)\n  {\n    //向右\n    monster.vx\
  \ = 2;\n    monster.vy = 0;\n  }\n  else\n  {\n    //向左\n    monster.vx = -2;\n\
  \    monster.vy = 0;\n  }\n}\n\n//如果在 x 轴上已经更接近，则向上或向下移动角色\nelse\n{\n  if (_character.y\
  \ < monster.y)\n  {\n    //向上\n    monster.vx = 0;\n    monster.vy = -2;\n  }\n\
  \  else\n  {\n    //向下\n    monster.vx = 0;\n    monster.vy = 2;\n  }\n}\n```\n\n\
  这种修改能让怪物像外科手术般精准地锁定角色。虽然这会使游戏变得非常困难，但通过尝试加入一些额外的随机性，你就能找到合适的平衡点，创造出既有趣又富有挑战性的游戏。你可以在\
  \ `IntelligentMonsters` 类的 `changeMonsterDirection` 方法的注释中找到所有这些可行代码。\n\n#### 障碍物与寻路\n\
  \n这是你首次接触游戏设计中称为人工智能（通常简称为 AI）的领域。这是一个庞大的话题，如果你对游戏设计是认真的（你确实是！），你会想要更深入地探索它。\n\n\
  你希望对《怪物大作战》进行的另一个修改是添加障碍物，比如一个迷宫让怪物在其中穿行。你可以使用前两章用过的 `Collision.block` 方法来实现，当怪物碰到墙壁的某一段时，让它们改变方向。但由于每个怪物都需要与每一段墙壁进行碰撞检测，你将不得不管理大量重复的代码。在第\
  \ 10 章中，你将学习如何处理多个物体间的碰撞，届时我将用一段非常高效且紧凑的代码重新审视这个问题。\n\n*你可能还希望让你的怪物能智能地在迷宫中寻路，最好是走最短路径。为此，你需要研究**基于瓦片**的方法来构建游戏，并实现一段著名的代码——**A-Star（A*）寻路算法**。你可以在《Advanced\
  \ Game Design with Flash》一书中找到完成所有这些操作的方法。*\n\n\n\n### 关于游戏结构的更多细节\n\n本章中用于构建游戏的结构，很可能成为你今后制作所有游戏的模板。下面是其工作原理的快速概览：\n\
  \n- 应用程序类负责加载关卡类，并在某个关卡调度事件告知游戏该关卡已完成时，进行关卡切换。\n- 关卡类包含所有游戏逻辑并控制游戏对象。\n- 游戏中的每个对象都由其自身的类构成。游戏对象拥有包含该对象重要数据的属性，并管理其自身状态的变化。它们不包含任何特定于游戏逻辑的代码。这使得在其他游戏中重复使用相同的游戏对象类变得非常容易。\n\
  \n这种结构是著名软件**设计模式**——模型-视图-控制器 (MVC) 的一个极其简化的版本。设计模式是一种将计算机代码组织到多个类中以便于管理的结构。我对这个模式进行了一些简化，使其比真正的\
  \ MVC 模式更易于理解和使用。我们称之为 LMVC 模式（懒人模型-视图-控制器）。这种模式非常适合理解类如何协同工作，并且将在未来许多游戏项目中为你提供很大帮助，尤其是在你学习编程的初级阶段。事实上，它可能就是你唯一需要使用的模式。\n\
  \n理解这种结构的关键在于，一个类完全负责游戏逻辑和控制舞台上的对象。这被称为**视图/控制器**类。在《怪物大乱斗》中，`LevelOne` 和 `LevelTwo`\
  \ 类就是视图/控制器类。游戏对象类是**模型**类。模型类仅包含关于对象的数据，并管理其自身的内部状态变化。它们包含的数据存储在其属性中。视图/控制器类像木偶大师操控所有提线一样控制着这些模型类。如果你理解了这个结构，并在自己的游戏中严格遵守它，你会发现你的游戏易于构建、管理和调试。图\
  \ 8-24 展示了这个结构。\n\n![Image](img/9781430239922_Fig08-24.jpg)\n\n**图 8-24.** 视图/控制器类控制游戏逻辑和模型类。\n\
  \n你将在本书后续的示例中沿用这一结构，因此在继续学习之前，请确保你完全理解它。然而，为了简化代码示例，并且因为后续示例不会包含多个游戏关卡，所有逻辑将像前面章节那样放在应用程序类中。（这意味着应用程序类将充当游戏的视图/控制器。）但如果你设计的游戏有多个关卡，或者有很多不同的游戏画面需要在之间切换，请回到本章，并使用《怪物大乱斗》的结构来规划你的游戏。\n\
  \n*随着编程经验的增长，你的游戏开始变得复杂，你将需要学习真正的“模型-视图-控制器”模式。这是管理复杂游戏的一种非常高效的方法，可以避免编写大量重复代码。你可以在《高级游戏设计与\
  \ Flash》中找到关于如何构建模型-视图-控制器系统的全部内容。*\n\n### 总结\n\n这真是个大章节！包含了大量代码和许多需要吸收的新概念。然而，这里涵盖的所有内容对于打下坚实的\
  \ AS3.0 游戏设计基础都是绝对必要的。在你的游戏设计生涯中，迟早都要处理这些问题。如果第一次没有全部理解，就把这章拆分成更小的部分，仔细学习每个部分，直到弄明白为止。将你在玩游戏时看到的现象与实现它的代码进行对比。理解本章的最佳方法是从头开始创建你自己的《怪物大乱斗》版本。你绝对有这个能力，而且你经历的过程会巩固这里涵盖的所有概念。\n\
  \n希望本章能启发你思考如何开始使用类来帮助构建游戏。如果你谨慎使用，这里介绍的结构可以带你走得很远。\n\n那么，尽情享受本章介绍的一些新技术吧。想不想制作一个将这些技术与前几章学到的其他技术结合起来的游戏？例如，一个带有巨大滚动地牢或太空关卡的游戏怎么样？那会非常棒！或者，结合一些使用文本输入的解谜环节，比如第\
  \ 4 章中的猜数字游戏？也许可以将《怪物大乱斗》和《炸弹恐慌》结合成一个混合游戏，让每个新关卡的难度递增？即使是在本书的这个阶段，你也已经拥有了强大的游戏编码能力。最好的学习方法就是一头扎进去，开始制作一个游戏。\n\
  \n在下一章中，你将学习一个完全不同的游戏类型：平台游戏。你将学习如何使用物理模拟让物体移动，如何使用数组来存储和分析数据，以及如何为你的游戏添加音效和音乐。\n\
  \n祝你设计下一个精彩游戏的过程充满乐趣！完成这些之后，我们第 9 章见！\n\n![Image](img/chap.jpg)\n\n## 第 9 章\n\n\
  ## 物理、循环、数组和声音\n\n最受欢迎的视频游戏类型之一是**平台游戏**，它同时也带来了一些非常有趣的编程和设计挑战。从编程的角度来看，如果你能编写一个平台游戏，就意味着你在游戏设计师的成长道路上达到了一个里程碑。\n\
  \n在本章中，我将向你展示制作自己的平台游戏所需的全部技能。你将详细了解核心视频游戏设计技术，例如：\n\n- 使用物理和热力学模拟实现自然运动。\n- 复杂的玩家角色行为。\n\
  - 具有精确反弹和摩擦的碰撞。\n- 嵌入声音和音乐。\n- 使用数组。\n\n你将在实际、真实的语境中学习这些技术，这样你就能清楚地知道如何将它们应用到自己的游戏中。但首先，让我们详细了解一下在你的游戏中使用物理所需的技术。\n\
  \n\n\n### 使用物理引擎实现自然运动\n\n撞到墙上会发生什么？如果你是上一章《怪物大乱斗》中的角色，那就什么也不会发生——你只是停下脚步，故事就此结束。在现实生活中，情况要复杂得多。一个高速弹跳的橡胶球会以一个角度反弹回来。而像石头这样更重的物体则会砰然落地。再举一个例子：当你踩下汽车油门时，车速逐渐增加；而在踩下刹车后，也需要一段时间才能减速。这些物理反应正是现实世界中的网球、赛车等游戏如此有趣的部分原因。\n\
  \n在接下来的几页中，你将学习如何使用以下技术，创建一个模拟真实物理和热力学的移动游戏角色：\n\n* **加速度**：逐渐加速。\n* **摩擦力**：逐渐减速。\n\
  * **反弹**：当物体碰到舞台边缘时改变运动方向。\n* **重力**：添加一个将物体拉向舞台底部的力。\n* **跳跃**：视频游戏角色最需要的能力之一。\n\
  \n为游戏应用物理原理其实很简单。大多数技术归结为对 `vx` 和 `vy` 属性进行简单计算。虽然计算很简单，但有时很难直观地看出如何实际运用它们。而你将重点探讨的正是这种实际应用。\n\
  \n在本书中，你将用到的大多数物理计算都基于一个名为*欧拉积分*（俗称“简单的视频游戏物理”）的系统。视频游戏物理在游戏环境中看似绝对精确，但实际上只是对真实物理的近似模拟。游戏使用近似物理，是因为处理它们所需的\
  \ CPU 性能远低于使用物理教科书上的计算公式。如果你需要进行真实世界教科书级别的物理模拟，可以参考 Keith Peters 的《ActionScript\
  \ 3.0 动画：让物体动起来》和《高级 ActionScript 3.0 动画》，这两本书对此有详细论述。\n\n要开始尝试物理效果，首先需要创建一个包含可用于应用物理公式的属性的游戏对象类。\n\
  \n#### 用于物理实验的游戏对象类\n\n在本章的源文件中，你会找到一个名为 `Acceleration` 的文件夹。打开 `src` 子文件夹，找到 `Character`\
  \ 类。它使用你现在应该非常熟悉的代码嵌入了猫游戏角色的图像。此外，它还包含一些你将在本章示例中需要的特殊公共属性。以下是 `Character` 类，其中突出的部分是特殊的物理属性：\n\
  \n```\npackage\n{\n  import flash.display.DisplayObject;\n  import flash.display.Sprite;\n\
  \  public class Character extends Sprite\n  {\n    //嵌入图像\n    [Embed(source=\"\
  ../images/character.png\")]\n    private var CharacterImage:Class;\n\n    //私有属性\n\
  \    private var _character:DisplayObject = new CharacterImage();\n\n    //公共属性\n\
  \    public var vx:Number = 0;\n    public var vy:Number = 0;\n    public var accelerationX:Number\
  \ = 0;\n    public var accelerationY:Number = 0;\n    public var speedLimit:Number\
  \ = 5;\n    public var friction:Number = 0.96;\n    public var bounce:Number = -0.7;\n\
  \    public var gravity:Number = 0.3;\n    public var isOnGround:Boolean = undefined;\n\
  \    public var jumpForce:Number = -10;\n\n    public function Character()\n   \
  \ {\n      //在此类中显示图像\n      this.addChild(_character);\n    }\n  }\n}\n```\n\n\
  你会认出 `vx` 和 `vy` 属性，但其他属性将是新的。在接下来的示例中，你将看到每个新属性的作用。下图展示了 `Character` 类的公共属性及其初始值。\n\
  \n![Image](img/9781430239922_Fig09-01.jpg)\n\n**图 9-1.** `Character` 类包含物理所需的属性。\n\
  \n请注意，大多数属性的类型都是 `Number`。这是因为它们需要存储小数值。如果需要存储物理值，则不能将属性类型设为 `int` 或 `uint`，因为物理值始终是分数。\n\
  \n`isOnGround` 属性是一个 `Boolean` 变量。它已被初始化为 `undefined`。如果你不确定一个 `Boolean` 变量应该为 `true`\
  \ 还是 `false`，将其赋值为 `undefined` 意味着“我还不知道”。这相当于将 `Number` 变量赋值为 `0`，或将 `String` 变量赋值为一对空引号。\n\
  \n最简单的物理运动类型是加速度，那么让我们看看如何让它与新的角色对象一起工作。\n\n#### 加速度\n\n**加速度**是指逐渐增加速度。这就像你开始更快地踩自行车踏板时发生的情况。要让游戏对象逐渐加速，你需要在\
  \ `enterFrameHandler` 中向对象的 `vx` 或 `vy` 属性添加一个值。你可能还记得前一章中，`vx` 指的是 `x` 轴上的速度，`vy`\
  \ 指的是 `y` 轴上的速度。简而言之，这些属性代表对象在水平或垂直方向上的移动速度。\n\n在 AS3.0 中，如果你想逐渐增加对象在 `x` 轴上的速度，你需要使用加法赋值运算符（`+=`）将加速度值加到\
  \ `vx` 属性上。你的代码可能类似于这样：\n\n```\nvx += 0.2;\n```\n\n在 `y` 轴上，你的代码可能如下：\n\n```\nvy\
  \ += 0.2;\n```\n\n`0.2` 从哪里来？这就是加速度的值。具体的数值完全取决于你，以及你希望对象加速的快慢。较大的数字（如 `0.6`）会使对象加速更快，而较小的数字（如\
  \ `0.1`）则会使加速慢得多。选择合适的数字只需反复尝试，并观察其对对象产生的影响。\n\n让我们在舞台上看看这个效果对猫角色的影响。运行 `Acceleration`\
  \ 应用程序类，使用方向键在舞台上移动猫对象。它会逐渐加速，直到达到每秒 5 像素的最大速度，如下图所示。\n\n![Image](img/9781430239922_Fig09-02.jpg)\n\
  \n**图 9-2.** 使用加速度逐渐增加对象的速度。\n\n\n\n### Acceleration 类\n\n以下是 `Acceleration` 应用程序类。我已高亮显示所有涉及应用加速度和移动角色的代码。\n\
  \n```\npackage\n{\n  import flash.display.Sprite;\n  import flash.events.Event;\n\
  \  import flash.events.KeyboardEvent;\n  import flash.ui.Keyboard;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n\
  \  public class Acceleration extends Sprite\n  {\n    private var _character:Character\
  \ = new Character();;\n\n    public function Acceleration()\n    {\n      //将角色添加到舞台\n\
  \      stage.addChild(_character);\n      _character.x = 250;\n      _character.y\
  \ = 175;\n\n      //添加事件监听器\n      stage.addEventListener\n        (KeyboardEvent.KEY_DOWN,\
  \ keyDownHandler);\n      stage.addEventListener\n        (KeyboardEvent.KEY_UP,\
  \ keyUpHandler);\n      stage.addEventListener\n        (Event.ENTER_FRAME, enterFrameHandler);\n\
  \    }\n    public function keyDownHandler(event:KeyboardEvent):void\n    {\n  \
  \    if (event.keyCode == Keyboard.LEFT)\n      {\n_character.accelerationX = -0.2;\n\
  \      }\n      else if (event.keyCode == Keyboard.RIGHT)\n      {\n_character.accelerationX\
  \ = 0.2;\n           }\n      else if (event.keyCode == Keyboard.UP)\n      {\n\
  _character.accelerationY = -0.2;\n      }\n      else if (event.keyCode == Keyboard.DOWN)\n\
  \      {\n_character.accelerationY = 0.2;\n      }\n    }\n    public function keyUpHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.LEFT\n      || event.keyCode == Keyboard.RIGHT)\n\
  \      {\n_character.accelerationX = 0;\n_character.vx = 0;\n      }\n      else\
  \ if (event.keyCode == Keyboard.DOWN\n      || event.keyCode == Keyboard.UP)\n \
  \     {\n_character.accelerationY = 0;\n_character.vy = 0;\n      }\n    }\n   \
  \ public function enterFrameHandler(event:Event):void\n    {\n//应用加速度\n_character.vx\
  \ += _character.accelerationX;\n_character.vy += _character.accelerationY;\n\n//限制速度\n\
  if (_character.vx > _character.speedLimit)\n{\n_character.vx = _character.speedLimit;\n\
  }\n      if (_character.vx < -_character.speedLimit)\n      {\n        _character.vx\
  \ = -_character.speedLimit;\n      }\n      if (_character.vy > _character.speedLimit)\n\
  \      {\n        _character.vy = _character.speedLimit;\n      }\n      if (_character.vy\
  \ < -_character.speedLimit)\n      {\n        _character.vy = -_character.speedLimit;\n\
  \      }\n\n//移动角色\n      _character.x += _character.vx;\n      _character.y +=\
  \ _character.vy;\n\n      //检查舞台边界\n      if (_character.x < 0)\n      {\n     \
  \   _character.x = 0;\n      }\n      if (_character.y < 0)\n      {\n        _character.y\
  \ = 0;\n      }\n      if (_character.x + _character.width > stage.stageWidth)\n\
  \      {\n        _character.x = stage.stageWidth - _character.width;\n      }\n\
  \      if (_character.y + _character.height > stage.stageHeight)\n      {\n    \
  \    _character.y = stage.stageHeight - _character.height;\n      }\n\n      //跟踪输出结果\n\
  \      trace(\"_character.vx:  \" + _character.vx);\n      trace(\"_character.x:\
  \  \" + _character.x);\n      trace(\"    ----------\");\n    }\n  }\n}\n```\n\n\
  尽管代码很长，但它不过是自第 5 章以来一直使用的常规代码的微小修改。我相信你认识其中的大部分内容。让我们看看有哪些新内容，以及加速度是如何工作的。\n\n`_character`\
  \ 对象有三个属性来存储新的加速度数据。它们的初始值在 `Character` 类定义中赋值。\n\n```\npublic var accelerationX:Number\
  \ = 0;\npublic var accelerationY:Number = 0;\npublic var speedLimit:Number = 5;\n\
  ```\n\n`accelerationX` 和 `accelerationY` 属性存储的值决定了物体加速的程度。由于你不希望物体在首次出现在舞台上时移动，因此\
  \ `accelerationX` 和 `accelerationY` 被初始化为零。最后，`speedLimit` 是希望物体移动的最大速度。值为 5 意味着物体每帧最多移动不超过\
  \ 5 像素。\n\n为角色的 `accelerationX` 和 `accelerationY` 属性赋值的工作由 `keyDownHandler` 完成。\n\
  \n```\npublic function keyDownHandler(event:KeyboardEvent):void\n{\n  if (event.keyCode\
  \ == Keyboard.LEFT)\n  {\n    _character.accelerationX = -0.2;\n  }\n  else if (event.keyCode\
  \ == Keyboard.RIGHT)\n  {\n    _character.accelerationX = 0.2;\n  }\n  else if (event.keyCode\
  \ == Keyboard.UP)\n  {\n    _character.accelerationY = -0.2;\n  }\n  else if (event.keyCode\
  \ == Keyboard.DOWN)\n  {\n    _character.accelerationY = 0.2;\n  }\n}\n```\n\n如果\
  \ `accelerationX` 为正值，物体向右移动。负值使其向左移动。正的 `accelerationY` 值使物体向下移动，负值使其向上移动。当按下任意箭头键时，这些新值会被赋值。使角色移动所需做的就是将这些值赋给它的\
  \ `vx` 和 `vy` 属性。用两行代码就能轻松完成。\n\n```\n_character.vx += _character.accelerationX;\n\
  _character.vy += _character.accelerationY;\n```\n\n然而，如果保持现状，加速度值会在每一帧都添加到物体的速度上——而物体能有多快没有限制。这意味着物体最终会移动得如此之快，以至于在舞台上只剩下一个模糊的影子。这在大多数游戏中没什么用，因此通常建议设置一个速度限制，这正是以下代码段的作用：\n\
  \n```\nif (_character.vx > _character.speedLimit)\n{\n  _character.vx = _character.speedLimit;\n\
  }\nif (_character.vx < -_character.speedLimit)\n{\n  _character.vx = -_character.speedLimit;\n\
  }\nif (_character.vy > _character.speedLimit)\n{\n  _character.vy = _character.speedLimit;\n\
  }\nif (_character.vy < -_character.speedLimit)\n{\n  _character.vy = -_character.speedLimit;\n\
  }\n```\n\n只有当 `vx` 和 `vy` 属性在速度限制（本例中为 5）范围内时，加速度值才会添加到角色的速度上。这意味着角色会加速到每帧 5 像素，然后以恒定速度移动。其背后的逻辑与设置舞台边界的逻辑完全相同。\n\
  \n下一步是将这些新的速度值添加到物体的 `x` 和 `y` 位置。这通过一些老伙伴来完成——基本上与自第 5 章以来使用的指令相同。\n\n```\n_character.x\
  \ += _character.vx;\n_character.y += _character.vy;\n```\n\n事实上，这两个指令就是你移动角色*所有*需要的内容，即使使它们移动所涉及的物理原理变得相当复杂。所有物理计算都应用于\
  \ `vx` 和 `vy` 属性；然后它们被简单地赋给角色的 `x` 和 `y` 属性，使其移动。\n\n那么，这实际上是如何让物体加速的呢？`enterFrameHandler`\
  \ 末尾的跟踪输出给了你一个线索。\n\n```\ntrace(\"_character.vx: \" + _character.vx);\ntrace(\"\
  _character.x: \" + _character.x);\ntrace(\"----------\");\n```\n\n编译项目，按下右箭头键，观察跟踪输出。当角色开始移动时，你会看到类似于这样的输出：\n\
  \n\n\n```\n_character.vx:  0\n_character.x:  250\n```\n```\n_character.vx:  0.2\n\
  _character.x:  250.2\n```\n```\n_character.vx:  0.4\n_character.x:  250.6\n```\n\
  ```\n_character.vx:  0.6000000000000001\n_character.x:  251.2\n```\n```\n_character.vx:\
  \  0.8\n_character.x:  252\n```\n```\n_character.vx:  1\n_character.x:  253\n```\n\
  ```\n_character.vx:  1.2\n_character.x:  254.2\n```\n\n这是前七个运动帧，但此模式会一直持续，直到 `vx`\
  \ 达到最大值 5，即 `speedLimit` 属性所设置的值。那些带有大量小数的数字是 CPU 的二进制数系统存储分数的方式所产生的副产品。\n`0.6000000000000001`\n\
  \n在实际应用中，你可以忽略那些一串串的零，并四舍五入保留两位小数。\n\n*AS3.0 能够将一个像素分割的最小单位是 0.05。这个单位有一个古怪的名字叫**缇**（20\
  \ 缇等于 1 像素）。这就是为什么你在跟踪输出中看到的所有 `x` 和 `y` 值都是 0.05 的倍数。*\n\n在第二帧中，`accelerationX`\
  \ 的初始值为 0.2，该值被添加到角色的当前 `x` 位置。结果 `x` 值变为 250.2。因为右箭头键仍被按住，所以会运行以下代码：\n\n```\nelse\
  \ if (event.keyCode == Keyboard.RIGHT)\n{\n  _character.accelerationX = 0.2;\n}\n\
  ```\n\n它在 `vx` 值上*额外*增加了 0.2，使其新值为 0.4。你可以在第三次跟踪中看到这个新值。\n\n`_character.vx:  0.4`\n\
  `_character.x:  250.6`\n\n然后，0.4 被添加到物体的 `x` 位置，得到新位置 250.6。从跟踪输出中可以看到，`accelerationX`\
  \ 值持续累积，每帧在自身基础上增加 0.2，直到最终达到 5，此时物体以相当快的速度移动。这一切共同营造出一种非常逼真的物体在加速的错觉。\n\n代码最后要做的是停止物体，这由\
  \ `keyUpHandler` 处理。\n\n```\npublic function keyUpHandler(event:KeyboardEvent):void\n\
  {\n  if (event.keyCode == Keyboard.LEFT\n    || event.keyCode == Keyboard.RIGHT)\n\
  \  {\n    _character.accelerationX = 0;\n    _character.vx = 0;\n  }\n  else if\
  \ (event.keyCode == Keyboard.DOWN\n    || event.keyCode == Keyboard.UP)\n  {\n \
  \   _character.accelerationY = 0;\n    _character.vy = 0;\n  }\n}\n```\n\n当相应的按键被释放时，这会将物体的加速度和速度都设为零。\n\
  \n### 摩擦力\n\n摩擦力与加速度正好相反：它会导致物体逐渐减速。图 9-3 对此进行了说明。\n\n![图片](img/9781430239922_Fig09-03.jpg)\n\
  \n**图 9-3.** 摩擦力使物体逐渐减速。\n\n让我们看看摩擦力是如何在猫咪角色上起作用的。你可以在本章的源文件中找到 `Friction` 项目文件夹。运行\
  \ SWF 文件，并使用方向键在舞台上移动角色。你会注意到，猫会逐渐加速，当你释放按键时又会逐渐减速。它看起来像是在舞台上漂浮。\n\n`Friction` 应用程序类中的代码几乎和你刚才在\
  \ `Acceleration` 类中看到的代码相同，只是做了一些小的补充。在你的代码编辑器中打开它，然后看一看。最大的变化在 `enterFrameHandler`\
  \ 中。两行新代码将角色的 `vx` 和 `vy` 属性与其 `friction` 值相乘。这发生在添加加速度的那几行代码之后，我已在此将它们突出显示：\n\n\
  ```\n//应用加速度\n_character.vx += _character.accelerationX;\n_character.vy += _character.accelerationY;\n\
  \n//应用摩擦力\n_character.vx *= _character.friction;\n_character.vy *= _character.friction;\n\
  ```\n\n记住，角色的 `friction` 值为 0.96。摩擦系数为 1 相当于没有摩擦力，因此任何小于 1 的值都会使物体逐渐减速。0.94 到 0.98\
  \ 之间的值会非常缓慢地施加摩擦力，以实现非常流畅的运动。而 0.7 或 0.6 这样的值会使物体快速减速。\n\n应用摩擦力的这两行代码将角色的速度乘以一个小于\
  \ 1 的数，从而逐渐减小速度。这非常简单且非常有效。\n\n然而，有一个技术细节你需要处理。场景是这样的：假设物体的速度是 5。它的摩擦系数是 0.6。物体需要速度为零才能完全停止。你每帧都施加一些摩擦力，将速度乘以\
  \ 0.6，希望能最终达到零。前五帧可能如下所示：\n\n5 * 0.6 = 3\n3 * 0.6 = 1.8\n1.8 * 0.6 = 1.08\n1.08\
  \ * 0.6 = 0.648\n0.648 * 0.6 = 0.3888\n\n但你还没到零。你认为需要多久才能达到零？嗯，你可以一直算下去——永远也到不了！\n\
  \n这是一种被称为**芝诺悖论**的效应。大致是这样的：假设你有一块蛋糕，你把它切成两半。你把其中一半再切成两半。然后你对第三块再做同样的操作。蛋糕块变得越来越小。你切多少次才能切到没有东西可切？芝诺悖论是：你永远无法达到终点——蛋糕块仅仅变得无限薄，而你可以永远切下去。尽管听起来很疯狂，但数学上确实如此，更疯狂的是，你在\
  \ AS3.0 中必须处理这个问题！\n\n这意味着当你应用摩擦力时，`vx` 和 `vy` 永远不会达到零。物体永远不会完全停止。所以你需要做的是，当 `vx`\
  \ 和 `vy` 低于某个阈值时，*强制其值为零*。这正是 `enterFrameHandler` 中下面这段新代码的作用：\n\n```\nif (Math.abs(_character.vx)\
  \ < 0.1)\n{\n  _character.vx = 0;\n}\nif (Math.abs(_character.vy) < 0.1)\n{\n  _character.vy\
  \ = 0;\n}\n```\n\n如果 `vx` 和 `vy` 的绝对值低于 0.1，则强制其值为 0，从而阻止芝诺悖论的发生。0.1 足够低，不会对物体的运动产生任何可观察的影响，并且即使在低摩擦系数（如\
  \ 0.99）下，物体也能看起来非常自然地停下来。没有这段代码，你的物体就会在舞台上缓慢地向上和向左滑动——并且永远不会真正停止。\n\n这段代码位于 `enterFrameHandler`\
  \ 中，就在检查角色速度限制的代码块下方。\n\n*快速回顾一下，`Math.abs` 会强制其参数的值变为正数（“绝对值”）。这简化了代码，因为你无需检查负值。*\n\
  \n代码的最后一个微小改动是，`keyUpHandler` 现在不再将角色的 `vx` 和 `vy` 属性设为零。这个任务交给了摩擦力计算来完成。`keyUpHandler`\
  \ 只需要停止物体的加速度。\n\n```\npublic function keyUpHandler(event:KeyboardEvent):void\n\
  {\n  if (event.keyCode == Keyboard.LEFT\n    || event.keyCode == Keyboard.RIGHT)\n\
  \  {\n    _character.accelerationX = 0;\n  }\n  else if (event.keyCode == Keyboard.DOWN\n\
  \    || event.keyCode == Keyboard.UP)\n  {\n    _character.accelerationY = 0;\n\
  \  }\n}\n```\n\n关于摩擦力，就是这些了！\n```\n\n\n#### 弹跳\n\n在加速度和摩擦力之后，弹跳就是小菜一碟（非无限的那种！）。打开章节源文件中的\
  \ `Bounce` 项目文件夹并运行 SWF。使用方向键在舞台上移动猫咪，你会注意到可以将它从舞台边缘弹开，如图 9-4 所示。\n\n![Image](img/9781430239922_Fig09-04.jpg)\n\
  \n**图 9-4.** 将猫咪从舞台边缘弹开。\n\n`Character` 类有一个名为 `bounce` 的属性，它被初始化为 `-0.7`。\n\n`public\
  \ var bounce:Number = -0.7;`\n\n`bounce` 值必须是负数，因为弹跳的工作原理是*反转*物体的速度。你很快就能看到这具体是如何发生的。`-0.7`\
  \ 这个值会产生中等程度弹跳的效果。值为 `-1` 会使物体具有极强的弹性。值为 `1` 会使物体完全没有弹力。任何小于 `-1` 的值都会让物体看起来像是撞到了弹性极强的表面，例如蹦床。如果你想在游戏中制作一个弹跳平台，这一点非常重要。\n\
  \n`bounce` 属性直到处理舞台边界的代码部分才再次出现。我在此处高亮了相关代码：\n\n```\n//Check stage boundaries\n\
  if (_character.x < 0)\n{\n  _character.vx *= _character.bounce;\n  _character.x\
  \ = 0;\n}\nif (_character.y < 0)\n{\n  _character.vy *= _character.bounce;\n  _character.y\
  \ = 0;\n}\nif (_character.x + _character.width > stage.stageWidth)\n{\n  _character.vx\
  \ *= _character.bounce;\n  _character.x = stage.stageWidth - _character.width;\n\
  }\nif (_character.y + _character.height > stage.stageHeight)\n{\n  _character.vy\
  \ *= _character.bounce;\n  _character.y = stage.stageHeight - _character.height;\n\
  }\n```\n\n这里发生的一切就是将物体的速度乘以 `bounce` 值，而这个值是负数。如果你反转物体的速度，看起来就像它在弹跳。不，我在这里可没有向你隐瞒什么——这种显著的效果仅通过四行极其简单的代码就实现了。谁说物理很难？\n\
  \n#### 重力\n\n重力的实现与其他物理力一样简单。你只需要创建另一个值，并将其添加到物体的 `vy` 属性中即可。\n\n要查看重力的效果，请打开 `Gravity`\
  \ 项目并运行 SWF。猫咪会掉落到舞台底部。如果你按下上方向键，猫咪会向上移动。当释放上方向键时，猫咪会下落，直到你再次按下上方向键。如果它撞到地面，则会弹起。图\
  \ 9-5 展示了你会看到的情景。\n\n![Image](img/9781430239922_Fig09-05.jpg)\n\n**图 9-5.** 使用方向键让猫咪飞起来。\n\
  \n尽管代码非常简单，但结果却是对真实世界非常令人信服的模拟。实际上，它真实得几乎有点吓人！让我们来看看它是如何工作的。\n\n`Character` 类有一个名为\
  \ `gravity` 的属性，它被初始化为 `0.3`。\n\n`public var gravity:Number = 0.3;`\n\n与其他数值一样，`0.3`\
  \ 也是通过反复试验得出的一个值，并且在此上下文中看起来很自然。数值越大，重力越大；数值越小，重力越小。\n\n将重力应用于角色只需在 `enterFrameHandler`\
  \ 中将其加到角色的 `vy` 属性上。\n\n`_character.vy += _character.gravity;`\n\n就这样！这就是实现重力所需的所有工作。以下展示了这行代码如何融入\
  \ `enterFrameHandler` 中的其他代码：\n\n```\n//Apply acceleration\n_character.vx += _character.accelerationX;\n\
  _character.vy += _character.accelerationY;\n\n//Apply friction\n_character.vx *=\
  \ _character.friction;\n\n//Apply gravity\n_character.vy += _character.gravity;\n\
  ```\n\n（此代码与之前示例相比的另一个小改动是，没有将摩擦力添加到 `vy` 属性。这没有必要，因为重力已经处理了向下的运动。）\n\n然而，`Gravity`\
  \ 类做得更深入一些。你希望允许玩家在按下上方向键时让猫咪向上移动。实际上有多种方法可以实现这一点，而这个类实现的是稍微复杂一些的方式。\n\n其工作方式是，当玩家按下上方向键时，在\
  \ `keyDownHandler` 中将 `gravity` 设置为 `0`（在此处高亮）：\n\n```\npublic function keyDownHandler(event:KeyboardEvent):void\n\
  {\n  if (event.keyCode == Keyboard.LEFT)\n  {\n    _character.accelerationX = -0.2;\n\
  \  }\n  else if (event.keyCode == Keyboard.RIGHT)\n  {\n    _character.accelerationX\
  \ = 0.2;\n  }\n  else if (event.keyCode == Keyboard.UP)\n  {\n    _character.accelerationY\
  \ = -0.2;\n    _character.gravity = 0;\n  }\n}\n```\n\n这使得猫咪可以在舞台上自由向上移动。注意，也没有为下方向键编写代码。你并不需要它——重力会处理向下移动物体的事情。\n\
  \n当按键释放时，`gravity` 属性会被重置回其初始值 `0.3`。\n\n```\npublic function keyUpHandler(event:KeyboardEvent):void\n\
  {\n  _character.accelerationX = 0;\n  _character.accelerationY = 0;\n  _character.gravity\
  \ = 0.3;\n}\n```\n\n你也可以通过另一种方式创建相同的重力效果：在需要应用重力时，直接给 `accelerationY` 一个正值。（正的 `y`\
  \ 值会将物体拉向舞台底部。）这意味着你可以在角色中完全省去创建 `gravity` 属性。然而，使用单独的 `gravity` 值的一个优点是使代码更易于理解，并且可以为你保留灵活选项，以便将来将重力与你可能添加的其他物理力进行组合搭配。\n\
  \n这段代码还有另外两处微调。我希望物体下落的速度比上升的速度更快。我修改了检查物体向下移动速度的 `if` 语句中的速度限制，如下所示：\n\n```\n//Limit\
  \ the speed\nif (_character.vx > _character.speedLimit)\n{\n  _character.vx = _character.speedLimit;\n\
  }\nif (_character.vx < -_character.speedLimit)\n{\n  _character.vx = -_character.speedLimit;\n\
  }\nif (_character.vy > _character.speedLimit * 2)\n{\n  _character.vy = _character.speedLimit\
  \ * 2;\n  trace(\"Terminal velocity!\");\n}\nif (_character.vy < -_character.speedLimit)\n\
  {\n  _character.vy = -_character.speedLimit;\n}\n```\n\n将 `speedLimit` 乘以 `2` 可以使其下落速度比上升速度快一倍。并且在达到最大速度时会显示一条“Terminal\
  \ velocity!”（终端速度！）的追踪消息。你可以在类似《月球着陆器》的游戏中利用这一点，来判断航天器撞击行星表面时是否速度过快。\n\n\n\n###\
  \ 跳跃\n\n在所有已面世的电子游戏中，大概有一半都将跳跃作为角色的核心操作。其本质不过是暂时增加物体的 `y` 轴向速度。一旦你理解了加速度、摩擦力和重力是如何运作的，实现跳跃就并非难事。然而，还有一些额外需要注意的细节，让这个过程稍微复杂一些。\n\
  \n-   你希望物体只有在地面时才能跳跃——并且仅限在地面时。但物体如何判断自己是否在地面上？而“地面”又究竟指什么？代码必须能解决这些问题。\n-   你需要防止按下跳跃键时触发多次跳跃。\n\
  \n让我们来看一个跳跃动作的示例，以及如何解决这些问题。打开 Jumping 项目文件夹并运行 SWF 文件。使用左右箭头键水平移动猫咪，然后按上箭头键或空格键让它跳跃。图\
  \ 9-6 展示了这一过程。\n\n![Image](img/9781430239922_Fig09-06.jpg)\n\n**图 9-6.** 按下空格键或上箭头键让猫咪跳跃。\n\
  \n要实现跳跃，你需要在 `Character` 类中使用以下两个属性：\n\n```actionscript\npublic var isOnGround:Boolean\
  \ = undefined;\npublic var jumpForce:Number = -10;\n```\n\n`isOnGround` 是一个布尔值，用于告知类对象是否在地面上。它被初始化为\
  \ `undefined`，因为在游戏开始时，你可能并不总能确定对象是否在地面上。\n\n`jumpForce` 是角色跳跃时所用的力量。它需要向舞台顶部（即向上）运动，因此其值为负数。赋予它的具体数值同样需要反复试验来确定。你需要确保该值足够大，以抵消重力以及可能作用于该对象的任何其他力。\n\
  \n那么，物体如何知道自己是否在地面上呢？这取决于你正在设计的游戏，可能会变得相当复杂。因此，在开始任何涉及跳跃功能的项目时，你需要仔细思考这个问题。在这个简单的示例中，当猫咪位于舞台底部时，它就算“在地面上”。所以，你只需要在检查舞台底部边界的同一段代码中，将\
  \ `isOnGround` 设置为 `true` 即可。\n\n```actionscript\n//检查舞台边界\nif (_character.x < 0)\n\
  {\n  _character.vx = 0;\n  _character.x = 0;\n}\nif (_character.y < 0)\n{\n  _character.vy\
  \ = 0;\n  _character.y = 0;\n}\nif (_character.x + _character.width > stage.stageWidth)\n\
  {\n  _character.vx = 0;\n  _character.x = stage.stageWidth - _character.width;\n\
  }\nif (_character.y + _character.height > stage.stageHeight)\n{\n  _character.vy\
  \ = 0;\n  _character.y = stage.stageHeight - _character.height;\n  _character.isOnGround\
  \ = true;\n}\n```\n\n这非常直观。在大多数涉及跳跃的游戏中，游戏角色还需要知道它们何时站在平台上。这使得检测地面变得稍微复杂一些，但你将在本章后面看到一个解决方案。让物体跳跃的逻辑发生在\
  \ `onKeyDown` 事件处理函数中。\n\n```actionscript\npublic function keyDownHandler(event:KeyboardEvent):void\n\
  {\n  if (event.keyCode == Keyboard.LEFT)\n  {\n    _character.accelerationX = -0.2;\n\
  \  }\n  else if (event.keyCode == Keyboard.RIGHT)\n  {\n    _character.accelerationX\
  \ = 0.2;\n  }\n  else if (event.keyCode == Keyboard.UP\n    || event.keyCode ==\
  \ Keyboard.SPACE)\n  {\n    if(_character.isOnGround)\n    {\n      _character.vy\
  \ += _character.jumpForce;\n      _character.isOnGround = false;\n    }\n  }\n}\n\
  ```\n\n如果按下空格键或上箭头键，代码会检查物体是否在地面上。如果是，则将跳跃力值加到垂直加速度上，并将 `isOnGround` 设置为 `false`。\n\
  \n如果你使用 `if` 语句对物体施加速度限制，请确保在跳跃物体向上移动时不要进行此检查。这可能会给跳跃效果带来一种不自然的抑制感。\n\n瞧，基本上就是这样。图\
  \ 9-7 展示了这个系统是如何工作的。\n\n![Image](img/9781430239922_Fig09-07.jpg)\n\n**图 9-7.** 如何让物体跳跃。\n\
  \n这是一段相互关联的代码构成的细致网络，需要仔细理解。因此，下面给出了完整的 `Jumping` 应用程序类，以便你能够看到它的完整上下文。我已将与跳跃效果相关的所有代码突出显示。\n\
  \n```actionscript\npackage\n{\n  import flash.display.Sprite;\n  import flash.events.Event;\n\
  \  import flash.events.KeyboardEvent;\n  import flash.ui.Keyboard;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n\
  \  public class Jumping extends Sprite\n  {\n    private var _character:Character\
  \ = new Character();;\n\n    public function Jumping()\n    {\n      //将角色添加到舞台\n\
  \      stage.addChild(_character);\n      _character.x = 250;\n      _character.y\
  \ = 175;\n\n      //添加事件监听器\n      stage.addEventListener\n        (KeyboardEvent.KEY_DOWN,\
  \ keyDownHandler);\n      stage.addEventListener\n        (KeyboardEvent.KEY_UP,\
  \ keyUpHandler);\n      stage.addEventListener\n        (Event.ENTER_FRAME, enterFrameHandler);\n\
  \    }\n    public function keyDownHandler(event:KeyboardEvent):void\n    {\n  \
  \    if (event.keyCode == Keyboard.LEFT)\n      {\n        _character.accelerationX\
  \ = -0.2;\n      }\n      else if (event.keyCode == Keyboard.RIGHT)\n      {\n \
  \         _character.accelerationX = 0.2;\n      }\n      else if (event.keyCode\
  \ == Keyboard.UP\n        || event.keyCode == Keyboard.SPACE)\n      {\n       \
  \ if(_character.isOnGround)\n        {\n          _character.vy += _character.jumpForce;\n\
  \          _character.isOnGround = false;\n        }\n      }\n    }\n    public\
  \ function keyUpHandler(event:KeyboardEvent):void\n    {\n      if (event.keyCode\
  \ == Keyboard.LEFT\n        || event.keyCode == Keyboard.RIGHT)\n      {\n     \
  \   _character.accelerationX = 0;\n      }\n    }\n    public function enterFrameHandler(event:Event):void\n\
  \    {\n      //应用加速度\n      _character.vx += _character.accelerationX;\n\n    \
  \  //应用摩擦力\n      _character.vx *= _character.friction;\n\n      //应用重力\n      _character.vy\
  \ += _character.gravity;\n\n      //限制速度，但角色向上移动时除外\n      if (_character.vx > _character.speedLimit)\n\
  \      {\n        _character.vx = _character.speedLimit;\n      }\n      if (_character.vx\
  \ < -_character.speedLimit)\n      {\n        _character.vx = -_character.speedLimit;\n\
  \      }\n      if (_character.vy > _character.speedLimit * 2)\n      {\n      \
  \  _character.vy = _character.speedLimit * 2;\n      }\n\n      //当速度低于 0.1 时强制归零\n\
  \      if (Math.abs(_character.vx) < 0.1)\n      {\n        _character.vx = 0;\n\
  \      }\n      if (Math.abs(_character.vy) < 0.1)\n      {\n        _character.vy\
  \ = 0;\n      }\n\n      //移动角色\n      _character.x += _character.vx;\n      _character.y\
  \ += _character.vy;\n\n      //检查舞台边界\n      if (_character.x < 0)\n      {\n  \
  \      _character.vx = 0;\n        _character.x = 0;\n      }\n      if (_character.y\
  \ < 0)\n      {\n        _character.vy = 0;\n        _character.y = 0;\n      }\n\
  \      if (_character.x + _character.width > stage.stageWidth)\n      {\n      \
  \  _character.vx = 0;\n        _character.x = stage.stageWidth - _character.width;\n\
  \      }\n      if (_character.y + _character.height > stage.stageHeight)\n    \
  \  {\n        _character.vy = 0;\n        _character.y = stage.stageHeight - _character.height;\n\
  \        _character.isOnGround = true;\n      }\n    }\n  }\n}\n```\n\n\n\n### 为游戏添加音效\n\
  \n现在你有了一个精美、会弹跳、会跳跃的游戏角色。如果每次跳跃时都能配上音效，那该多棒啊！在游戏中播放音效其实一点也不难，本节我将向你展示具体方法。\n\n打开章节源文件中的\
  \ `PlayingSounds` 项目文件夹。除了常见的文件夹外，你会发现一个名为 `sounds` 的新文件夹。里面包含一个名为 `bounce.mp3`\
  \ 的 MP3 文件（图 9-8）。这个 MP3 文件会以与你之前嵌入图像完全相同的方式嵌入到应用程序类中。\n\n![图片](img/9781430239922_Fig09-08.jpg)\n\
  \n**图 9-8.** 将游戏音效放在 `sounds` 文件夹中，与项目其他文件在一起。\n\n运行 SWF 文件，按下空格键。你会听到“砰”的一声，这种音效正是游戏角色跳跃时的典型声音。\n\
  \n以下是完整的 `PlayingSounds` 类。我将嵌入声音、创建声音对象以及播放声音的所有相关代码都加粗标注了出来。\n\n```\npackage\n\
  {\n  import flash.display.Sprite;\n  import flash.events.Event;\n  import flash.events.KeyboardEvent;\n\
  \  import flash.ui.Keyboard;\n\n  //播放声音所需的类\n  import flash.media.Sound;\n  import\
  \ flash.media.SoundChannel;\n\n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"\
  #FFFFFF\", frameRate=\"60\")]\n\n  public class PlayingSounds extends Sprite\n \
  \ {\n    //嵌入声音\n    [Embed(source=\"../sounds/bounce.mp3\")]\n    private var Bounce:Class;\n\
  \n    //为声音创建 Sound 和 SoundChannel 对象\n    private var _bounce:Sound = new Bounce();\n\
  \    private var _bounceChannel:SoundChannel = new SoundChannel();\n\n    public\
  \ function PlayingSounds()\n    {\n      stage.addEventListener\n        (KeyboardEvent.KEY_DOWN,\
  \ keyDownHandler);\n    }\n    public function keyDownHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.SPACE)\n      {\n        //让弹跳声音通道播放弹跳音效\n\
  \        _bounceChannel = _bounce.play();\n      }\n    }\n  }\n}\n```\n\n要在游戏中使用声音，你需要导入两个类：`Sound`\
  \ 和 `SoundChannel`。\n\n```\nimport flash.media.Sound;\nimport flash.media.SoundChannel;\n\
  ```\n\n然后，在类定义中嵌入 MP3 文件，方式与嵌入图像完全相同。\n\n```\n[Embed(source=\"../sounds/bounce.mp3\"\
  )]\nprivate var Bounce:Class;\n```\n\n接着，你需要创建两个对象来帮助你播放声音。\n\n*   **Sound 对象**：这是你想要播放的实际声音。\n\
  \n    ```\n    private var _bounce:Sound = new Bounce();\n    ```\n\n*   **SoundChannel\
  \ 对象**：这是一个为你播放声音的对象。\n\n    ```\n    private var _bounceChannel:SoundChannel =\
  \ new SoundChannel();\n    ```\n\n你需要同时使用这两个对象来播放声音。你可以将 `Sound` 类想象成一张 CD，而 `SoundChannel`\
  \ 则是实际加载并播放它的 CD 播放器。\n\n然后，`SoundChannel` 对象可以在需要时播放 `Sound`。在这个例子中，它在你按下空格键时被调用。\n\
  \n```\n_bounceChannel = _bounce.play();\n```\n\n其实就这么简单。记住这个格式，你就不会出错。\n\n### 在游戏中集成音效\n\
  \n要了解如何在真实游戏环境中集成音效，请打开 `JumpingWithSounds` 项目文件夹。运行 SWF，调高电脑音量，现在每次角色跳跃时，你都会听到“砰”的一声。这是通过在玩家每次按下上方向键或空格键时播放弹跳音效来实现的，执行的指令如下：\n\
  \n```\n_bounceChannel = _bounce.play();\n```\n\n项目文件夹中有一个 `sounds` 文件夹，里面包含了 `bounce.mp3`\
  \ 文件。以下是 `JumpingWithSounds` 应用程序类中用于嵌入和播放声音的新代码。首先，导入 `Sound` 和 `SoundChannel`\
  \ 类，以及本例所需的其他所有类。\n\n```\nimport flash.display.Sprite;\nimport flash.events.Event;\n\
  import flash.events.KeyboardEvent;\nimport flash.ui.Keyboard;\n\n//播放声音所需的类\nimport\
  \ flash.media.Sound;\nimport flash.media.SoundChannel;\n```\n\n接下来，在类定义中嵌入 MP3 文件并创建声音对象。\n\
  \n```\npublic class JumpingWithSound extends Sprite\n{\n  //嵌入声音\n  [Embed(source=\"\
  ../sounds/bounce.mp3\")]\n  private var Bounce:Class;\n\n  //为声音创建 Sound 和 SoundChannel\
  \ 对象\n  private var _bounce:Sound = new Bounce();\n  private var _bounceChannel:SoundChannel\
  \ = new SoundChannel();\n\n  private var _character:Character = new Character();\n\
  ```\n\n最后，当玩家按下上方向键或空格键时，由 `keyDownHandler` 播放声音。\n\n```\nelse if (event.keyCode\
  \ == Keyboard.UP\n  || event.keyCode == Keyboard.SPACE)\n{\n  if(_character.isOnGround)\n\
  \  {\n    _bounceChannel = _bounce.play();\n    _character.vy += _character.jumpForce;\n\
  \    _character.isOnGround = false;\n  }\n}\n```\n\n像这样为游戏添加音效，关键在于选择正确的位置来调用声音的\
  \ `play` 方法。游戏中的大部分音效都会像这样短促，但如果你需要停止任何音效，可以调用声音对象的 `stop` 方法，如下所示：\n\n```\n_bounceChannel\
  \ = _bounce.stop();\n```\n\n如果你使用的是需要循环播放的较长声音，下一节将向你展示具体方法。\n\n### 循环播放音乐并设置音量和声道平衡\n\
  \n你的游戏中很可能会有需要在游戏过程中反复循环播放的音乐。你可能还需要控制声音的音量大小，以及左右扬声器之间的声音平衡。接下来的几个小节将介绍一些简单的技巧来帮助你完成这些操作。\n\
  \n\n\n#### 循环播放声音\n\n播放声音时，要循环播放声音，需要使用以下格式：\n\n```actionscript\n_soundChannel =\
  \ _sound.play(startPosition, timesToPlay);\n```\n\n其中`startPosition`是一个以毫秒为单位的数字。请注意，`0`表示声音的最开始，而`1000`表示声音开始后的一秒。`timesToPlay`是希望声音播放的次数。因此，如果想从头开始播放声音并重复十次，代码可能如下所示：\n\
  \n```actionscript\n_soundChannel = _sound.play(0, 10);\n```\n\n如果希望每次重复时声音都从第 5\
  \ 秒（即 5000 毫秒）开始播放，请将`5000`作为第一个参数：\n\n```actionscript\n_soundChannel = _sound.play(5000,\
  \ 10);\n```\n\n要让声音无限（或几乎无限）重复，需要使用一个小技巧。将第二个参数（循环次数）设置为 AS3.0 已知的最大可能数字。这个值实际上作为整数类的一个属性存储，可以像这样访问：\n\
  \n```actionscript\nint.MAX_VALUE\n```\n\n`int.MAX_VALUE`是整数可以拥有的最大值：2,147,483,647。这意味着声音不会永远循环，但它会循环足够长的时间，让玩家完成游戏——甚至可能在此之后继续循环几十年。以下是使用它让声音“永远”循环的方法：\n\
  \n```actionscript\n_soundChannel = _sound.play(0, int.MAX_VALUE);\n```\n\n*如果循环播放那些没有明显开始或结束点的连续声音，可能会在声音再次播放前听到片刻的静音。这是因为某些\
  \ MP3 格式将 ID3 标签信息（歌曲名称、艺术家名称等）存储在文件的开头或结尾。这就是你听到的静音。如果这确实是个问题，请确保从音频软件中导出 MP3 文件时不包含\
  \ ID3 信息。大多数声音编辑器都有这个选项。如果无法访问原始未压缩的声音文件，请使用专门的音频编辑器（如 Audacity）从文件的开头或结尾修剪掉几毫秒的静音。你可以从以下地址下载\
  \ Audacity：*\n\n*`http://audacity.sourceforge.net/download/`*\n\n*还需要下载并安装 LAME\
  \ MP3 编码器，以便 Audacity 能够导出最终的 MP3 文件。你可以在以下地址找到 LAME 下载站点的链接：*\n\n*`http://audacity.sourceforge.net/help/faq?s=install&item=lame-mp3`*\n\
  \n*有时，你也可以通过让声音从非零的起始位置开始播放来避免循环之间的几毫秒延迟。你需要进行一些实验来找到合适的数值，但`30`通常是一个不错的起点。*\n\n\
  ```actionscript\n_soundChannel = _sound.play(30, int.MAX_VALUE);\n```\n\n*这将跳过前\
  \ 30 毫秒，这大致是声音间隙结束的位置。*\n\n在需要更多灵活性和控制的情况下，可以使用`SOUND_COMPLETE`事件来创建循环。首先，在播放声音时，为`SoundChannel`对象添加一个`SOUND_COMPLETE`事件处理器。\n\
  \n```actionscript\n_soundChannel = _sound.play(0);\n_soundChannel.addEventListener\n\
  \  (Event.SOUND_COMPLETE, loopSoundHandler);\n```\n\n接下来，创建一个`loopSoundHandler`，它会再次播放声音，然后添加另一个新的`SOUND_COMPLETE`监听器。\n\
  \n```actionscript\npublic function loopSoundHandler(event:Event):void\n{\n  if (_soundChannel\
  \ != null)\n  {\n    //Play the sound\n    _soundChannel = _sound.play(0);\n\n \
  \   //Add a new listener\n    _soundChannel.addEventListener\n      (Event.SOUND_COMPLETE,\
  \ loopSoundHandler);\n  }\n}\n```\n\n非常重要的是，这段代码首先通过仅在`_soundChannel`对象不为`null`时执行指令来检查声音通道是否实际存在。\n\
  \n同样，当音乐停止时，需要在程序中的任何位置移除监听器。\n\n```actionscript\n_soundChannel.stop();\n_soundChannel.removeEventListener\n\
  \  (Event.SOUND_COMPLETE, loopSoundHandler);\n```\n\n#### 音量和声像设置\n\n声音的**音量**是指声音的大小或轻柔程度。**声像**决定了声音有多少来自左扬声器或右扬声器。要控制这些属性，首先需要导入`SoundTransform`类。\n\
  \n```actionscript\nimport flash.media.SoundTransform;\n```\n\n然后需要两个`Number`类型的变量来存储音量和声像设置。\n\
  \n```actionscript\nprivate var _volume:Number = 1;\nprivate var _pan:Number = 0;\n\
  ```\n\n如果音量的值为`1`，表示音量为正常。如果为`0`，则声音完全静音。如果为`2`，则声音是原始音量的两倍。\n\n声像值的范围在`-1`到`1`之间。请注意，`-1`表示声音完全来自左扬声器，`1`表示声音完全来自右扬声器，`0`表示声音在左右扬声器之间平衡分布。可以将声像值设置为此范围内的任何数字。如果将其设置为`0.5`，声音将主要来自右扬声器，但左扬声器也能听到，虽然声音较小。\n\
  \n选择了音量和声像的值后，可以使用它们来创建一个`SoundTransform`对象，如下所示：\n\n```actionscript\nvar transform:SoundTransform\
  \ = new SoundTransform(_volume, _pan);\n```\n\n最后一步是将这个`SoundTransform`对象应用到`SoundChannel`对象上，如下所示：\n\
  \n```actionscript\n_soundChannel.soundTransform = transform;\n```\n\n`SoundChannel`对象有一个名为`soundTransform`的属性。如代码所示，将`SoundTransform`对象赋给该属性。是的，我知道，这是一个有点烦人且令人困惑的小环节需要去适应。而且`soundTransform`属性和`SoundTransform`类之间的唯一区别就是首字母的大小写！但是加油！你可以做到，一旦在实际中看到它，就不难了。为了帮助你，可以查看`LoopingMusic`项目文件夹并打开应用程序类。运行\
  \ SWF 或编译它，你会听到一些循环的游戏背景音乐。以下是应用程序类：\n\n```actionscript\npackage\n{\n  import flash.display.Sprite;\n\
  \  import flash.events.Event;\n\n  //Classes needed to play sounds\n  import flash.media.Sound;\n\
  \  import flash.media.SoundChannel;\n  import flash.media.SoundTransform;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n\
  \  public class LoopingMusic extends Sprite\n  {\n    //Embed the sound\n    [Embed(source=\"\
  ../sounds/music.mp3\")]\n    private var Music:Class;\n\n    //Create the Sound\
  \ and Sound channel\n    //objects for the sound\n    private var _music:Sound =\
  \ new Music();\n    private var _musicChannel:SoundChannel = new SoundChannel();\n\
  \n    //Variables needed to set volume and panning\n    private var _volume:Number\
  \ = 1;\n    private var _pan:Number = 0;\n\n    public function LoopingMusic()\n\
  \    {\n      _musicChannel = _music.play(30, int.MAX_VALUE);\n\n      //Change\
  \ the volume and pan settings\n      _volume = 0.5;\n      _pan = 0;\n\n      //Create\
  \ the SoundTransform object\n      var transform:SoundTransform\n        = new SoundTransform(_volume,\
  \ _pan);\n\n      //Add the SoundTransform object to the\n      //musicChannel's\
  \ soundTransform property\n      _musicChannel.soundTransform = transform;\n   \
  \ }\n  }\n}\n```\n\n音乐设置为在程序启动时循环播放，跳过前 30 毫秒以避免音乐开始时的短暂间隙。\n\n```actionscript\n\
  _musicChannel = _music.play(30, int.MAX_VALUE);\n```\n\n接下来设置了音量和扬声器声像值。\n\n```actionscript\n\
  _volume = 0.5;\n_pan = 0;\n```\n\n音量设置为正常响度的一半。因为声像值为零，音乐在左右扬声器之间平衡分布。尝试将声像值设置为`1`或`-1`，然后重新编译程序，听听扬声器声像的变化。\n\
  \n然后使用音量和声像值作为参数创建了`SoundTransform`对象。\n\n```actionscript\nvar transform:SoundTransform\n\
  \   = new SoundTransform(_volume, _pan);\n```\n\n\n\n它被创建为一个局部对象，这也是声音转换对象通常的创建方式。原因在于，只有当您像这样更改音量和平移设置时，才需要创建一个`SoundTransform`对象，并且您在类的其他位置可能永远不需要使用它。最后一步是，将这个新的`transform`对象应用到`musicChannel`对象的`soundTransform`属性上。\n\
  \n`_musicChannel.soundTransform = transform;`\n\n这将设置新的音量和平移设置。每次您更改音量和平移设置时，都需要创建另一个临时的`SoundTransform`对象，并重新将其应用到`SoundChannel`对象上。\n\
  \n您只是刚刚接触了在 AS3.0 中使用声音的皮毛，但这足以让您在自己的游戏中开始使用声音。您还可以在*《高级 Flash 游戏设计》（Advanced Game\
  \ Design with Flash）*一书中找到关于游戏中声音的全面介绍。\n\n### 处理多个对象\n\n现在您拥有了一个可以在舞台上弹跳和跳跃的角色，但舞台本身相当空旷。这只猫需要一些盒子来跳跃。如果能创建一个像图\
  \ 9-9 所示的交互式游戏世界，那岂不是太棒了？\n\n![Image](img/9781430239922_Fig09-09.jpg)\n\n**图 9-9.**\
  \ 平台游戏的雏形，其中有可供跳跃的盒子。\n\n您可以轻松创建 13 个盒子，并使用`Collision.block`方法来检测它们与角色的碰撞，如下所示：\n\
  \n```\nCollision.block(_character, _box1);\nCollision.block(_character, _box2);\n\
  Collision.block(_character, _box3);\nCollision.block(_character, _box4);\nCollision.block(_character,\
  \ _box5);\nCollision.block(_character, _box6);\nCollision.block(_character, _box7);\n\
  Collision.block(_character, _box8);\nCollision.block(_character, _box9);\nCollision.block(_character,\
  \ _box10);\nCollision.block(_character, _box11);\nCollision.block(_character, _box12);\n\
  Collision.block(_character, _box13);\n```\n\n这 13 行代码完全可以正常工作。但谁真的想编写这么多重复的代码呢？\n\
  \n在您的游戏设计生涯更进一步之前，您需要学习一对相辅相成的编程技术：**循环（loops）**和**数组（arrays）**。您将把它们结合使用，来构建一个管理系统，用于处理舞台上的多个对象之间的交互。这包括创建大量对象、更改大量对象的属性以及检测大量对象之间的碰撞。在接下来的几页中，您将学习一些行业内的核心技巧，这些技巧将极大地扩展您的游戏能力。\n\
  \n#### 使用`for`循环\n\n如果您和我一样，可能会觉得编写或复制粘贴那十三行重复的代码是一件非常可怕的苦差事。难道计算机不应该是神奇且节省时间的设备，用来让您免除这种繁琐的工作吗？是的，它们应该是，而且确实有更好的方法。\n\
  \n那 13 条指令除了盒子对象名称的编号不同之外，其他方面完全相同。您能否创建一个基本模板，告诉 AS3.0 将其重复 13 次，并只插入正确的编号？是的，您可以！这是一种称为**循环（loop）**的编程装置。\n\
  \n循环用于重复执行一段代码特定的次数。在 AS3.0 中，您可以创建多种不同类型的循环，虽然它们做的事情几乎相同，但在不同情况下，某些循环会比其他的更合适。最常用的是`for`循环，它是一个以关键字`for`（意为*重复*这么多次）开始的块语句。`for`循环内的任何指令都会按照循环指定的次数重复执行——从一次到成百上千次。\n\
  \n`for`循环的结构乍一看可能有些奇怪和令人困惑，因为它的参数实际上包含三个独立的语句。\n\n*   一个用于跟踪循环重复次数的变量。这被称为**循环索引变量（loop\
  \ index variable）**，通常用字母`i`表示（它代表*索引，index*）。\n*   一个条件语句，告诉循环何时应该停止。\n*   一个语句，每次`for`循环重复时，都会为索引变量加\
  \ 1。（虽然通常每次循环重复都加 1，但您可以通过多种不同的方式加减数字，以便在必要时微调循环。）每个语句之间用分号隔开。\n\n下面是一个`for`循环的示例，它显示从\
  \ 0 到 4 的数字：\n\n```\nfor(var i:int = 0;  i < 5;  i++)\n{\n  trace(i);\n}\n```\n\n\
  如果您在类的构造方法中使用此代码，运行程序时您将看到以下跟踪消息：\n\n```\n0\n1\n2\n3\n4\n```\n\n在章节的源文件中，您会找到一个名为`ForLoop`的项目文件夹。下面是实现此系统的`ForLoop`应用程序类：\n\
  \n```\npackage\n{\n  import flash.display.Sprite;\n\n  public class ForLoop extends\
  \ Sprite\n  {\n    public function ForLoop()\n    {\n      for(var i:int = 0;  i\
  \ < 5;  i++)\n      {\n        trace(i);\n      }\n    }\n  }\n}\n```\n\n编译后，您将在跟踪输出中看到从\
  \ 0 到 4 的数字。\n\n如果您将`for`循环的工作分解成更小的部分，就很容易理解它是如何工作的。它首先声明用于计数循环次数的变量。\n\n`for(`**`var\
  \ i:int = 0;`** `i < 5;  i++)`\n\n这会创建一个名为`i`的局部整数变量，并初始化为 0。下一条语句告诉循环应重复多少次。\n\n\
  `for(var i:int = 0; i < 5;  i++)`\n\n这是一个条件语句。它告诉循环在索引变量小于 5 时重复。在这个例子中，索引变量初始化为\
  \ 0，所以循环将重复直到达到 4。您可以在这里使用任何类型的条件语句。\n\n最后一条语句在循环中的指令每次运行时，将索引变量增加 1。\n\n`for(var\
  \ i:int = 0;  i < 5;  `**`i++`**`)`\n\n第一次运行循环时，`i`以其初始值 0 开始。下次重复时，`++`运算符为其加 1。这意味着`i`等于\
  \ 1（因为 0 加 1 等于 1）。下一次循环重复时，再次为`i`加 1，结果值为 2。这在`i`小于 5 时重复。一旦`i`的值达到 5，循环会立即停止。\n\
  \n\n\n虽然 `i++` 是增加索引变量值最常用的方式，但你也可以使用任何语句来增减该变量。例如，`i += 2` 会使索引变量在每次循环重复时增加 2，而如果你希望循环反向计数，`i--`\
  \ 则会使它减少 1。\n\n如果你打开了 `ForLoop` 项目，可以尝试几种不同的值和条件语句，并在测试时观察输出结果。你可以将 `i` 初始化为任意数值，并使用任意条件来退出循环。以下是另一个示例，其中\
  \ `i` 初始化为 1，循环重复执行直到它等于 5：\n\n```\nfor(var i:int = 1;  i <= 5;  i++)\n{\n  trace(i);\n\
  }\n```\n\n这将产生以下跟踪输出：\n\n```\n1\n2\n3\n4\n5\n```\n\n将索引变量初始化为 1 并在值为 5 时退出循环特别有用，因为它能非常清晰地表明循环的起始和结束位置。它从一数到五，就像普通人计数一样！\n\
  \n在本章中，你将了解几种使用 `for` 循环的不同方式。图 9-10 是一个快速参考图表，说明了 `for` 循环的工作原理。\n\n![Image](img/9781430239922_Fig09-10.jpg)\n\
  \n**图 9-10.** `for` 循环的工作原理\n\n*虽然 `for` 循环是经久不衰的常用选择，但 AS3.0 也允许你以其他几种方式创建循环。你还可以创建\
  \ `while` 循环或 `do-while` 循环。它们与 `for` 循环的功能相同，但在某些特定情况下，它们细微的差别可能会派上用场。*\n\n*`while`\
  \ 循环在游戏开发中特别有用。它的语法如下：*\n\n```\nwhile(某个条件为真)\n{\n   //...执行此操作\n}\n```\n\n*`while`\
  \ 循环不会运行固定的次数；它们会持续运行直到条件变为假。在程序中使用 `while` 循环时，必须确保条件最终会变为假。如果条件始终为真，循环将“永远”运行，可能导致\
  \ Flash Player 挂起。通常，如果循环运行 15 秒仍未结束，Flash Player 会自动退出循环，但有时它不会这样做！请谨慎使用 `while`\
  \ 循环，并在测试前务必保存你的工作。*\n\n*本书不会详细讲解 `while` 和 `do-while` 循环，但值得进一步研究它们以了解其功能。如需更多信息，请参阅\
  \ Adobe 在线文档 *《为 Adobe Flash 编写 Adobe ActionScript 3.0 程序》* 中“ActionScript 语言和语法”一章的“循环”小节。*\n\
  \n### 使用数组\n\n如果你理解了 `for` 循环的工作原理，那么编写检测多个对象碰撞的代码就已经完成了一半。构建这个功能的另一块拼图是数组。你可以将数组想象成一个大柜子，用于在一个地方存储大量对象。\n\
  \n实际上，数组可用于存储任何内容：变量、数字、字符串、对象、方法，甚至是其他数组。数组中的每个元素都使用一个数字进行索引。我们将通过一些实际示例来了解如何使用数组对象的索引号来访问和修改它们。\n\
  \n本书的下载包中有一个名为“Bug Catcher”的平台游戏案例分析，玩家需要用一个罐子收集飞行的虫子。让我们进入游戏状态，创建一个名为 `collectionJar`\
  \ 的数组。在使用数组之前，你需要使用 `new` 关键字对其进行实例化。如果你想创建一个空的收集罐来装虫子，可以像这样创建：\n\n```\nvar collectionJar:Array\
  \ = new Array();\ncollectionJar = [];\n```\n\n数组将其对象放在方括号内，如下所示：\n\n```\n[方括号内的任何东西都属于这个数组]\n\
  ```\n\n一对空括号表示该数组是空的，这就是你初始化 `collectionJar` 数组的方式。但数组不一定要从空开始。你可以在初始化时就让数组中已填充对象。\n\
  \n```\ncollectionJar = [fly, mosquito, bee];\n```\n\n数组中的所有对象都从 0 开始按顺序编号。这些数字称为**索引号**。在此示例中，`fly`\
  \ 的索引号为 0，`mosquito` 的索引号为 1，`bee` 的索引号为 2。你可以使用数组访问运算符来查找哪个对象位于哪个索引号。示例如下：\n\n\
  ```\ncollectionJar[1]\n```\n\n它的值是 `mosquito`，因为 `mosquito` 的索引号是 1。这其实非常简单。数组只是一个编号列表，其中的条目被称为**元素**。图\
  \ 9-11 比较了一个空数组和一个包含三个元素的数组。\n\n![Image](img/9781430239922_Fig09-11.jpg)\n\n**图\
  \ 9-11.** 数组与数组元素\n\n将元素放入数组有几种方法。在之前的例子中，三个元素是在数组初始化时添加的。通常你会从一个空数组开始，然后根据需要向其中添加元素。\n\
  \n将元素放入数组的一种方法是直接将元素赋给数组索引中的某个位置。\n\n```\ncollectionJar[2] = fly;\n```\n\n因此，当你的代码看到\
  \ `collectionJar[2]` 时，它会返回 `fly` 的值。\n\n让我们看一个稍微具体一点的例子。本章的源文件包含一个名为 `BasicArray`\
  \ 的文件夹。打开它并查看应用程序类。\n\n```\npackage\n{\n  import flash.display.Sprite;\n\n  public\
  \ class BasicArray extends Sprite\n  {\n//声明数组\n    private var _collectionJar:Array;\n\
  \n    public function BasicArray()\n    {\n//实例化数组\n      _collectionJar = new Array();\n\
  \n//向数组添加元素\n      _collectionJar[0] =  \"fly\";\n      _collectionJar[1] =  \"\
  mosquito\";\n      _collectionJar[2] =  \"bee\";\n\n//跟踪整个数组内容\n      trace(\"Entire\
  \ Array: \" + _collectionJar);\n\n//跟踪单个元素\n      trace(\"Element 0: \" + _collectionJar[0]);\n\
  \      trace(\"Element 1: \" + _collectionJar[1]);\n      trace(\"Element 2: \"\
  \ + _collectionJar[2]);\n    }\n  }\n}\n```\n\n如果你测试这段代码，跟踪输出将显示：\n\n```\nEntire\
  \ Array: fly,mosquito,bee\nElement 0: fly\nElement 1: mosquito\nElement 2: bee\n\
  ```\n\n从这个例子可以清楚地看到，数组就是存储容器。\n\n#### 向数组推送元素\n\n另一种非常常见的向数组中添加元素的方法是使用数组内置的 `push`\
  \ 方法。你可以使用 `push` 将元素“推入”数组，格式如下：\n\n```\narrayName.push(elementName);\n```\n\n\
  当你将一个对象推入数组时，它会获得一个比最后添加元素的索引号大 1 的索引号。这意味着，如果最后一个元素的索引号是 [2]，那么你推入的对象将获得索引号 [3]。\n\
  \n使用 `push` 非常方便，因为你无需操心该将元素添加到哪个索引号。数组会自动为你处理。\n\n本章源文件包含一个名为 `ArrayPush` 的文件夹。将其作为项目打开，查看应用程序类。它和第一个示例相同，只是使用了\
  \ `push` 方法来添加元素。\n\n```\n_collectionJar.push(\"fly\");\n_collectionJar.push(\"\
  mosquito\");\n_collectionJar.push(\"bee\");\n```\n\n跟踪输出与第一个示例完全相同。你不需要担心索引号这一特性非常便捷。\n\
  \n*要从数组中移除元素，可以使用数组的 `pop` 方法。以下代码使用 `pop` 移除数组中的最后一个元素并将其赋值给一个变量：*\n\n```\nremovedElement\
  \ = _collectionJar.pop();\n```\n\n*如果最后一个元素是 `bee`，那么 `removedElement` 的值就是 `bee`。这也意味着\
  \ `_collectionJar` 现在只包含两个元素：`fly` 和 `mosquito`。*\n\n你还可以使用 `splice` 方法来添加和移除数组中的元素。我将在下一章详细解释如何使用\
  \ `splice`。\n\n\n\n### 循环遍历数组\n\n当数组与循环结合使用时，它们会变得异常有用。你可以使用 `for` 循环遍历数组中的每一个元素，即使有数百个元素，也只需一行代码。数组和循环几乎总是这样搭配使用。让我们来看看如何用循环读取数组中的所有元素。\n\
  \n数组有一个名为 `length` 的内置属性，它能告诉你数组中有多少个元素。你可以像这样访问数组的 `length` 属性：\n\n`arrayName.length`\n\
  \n`length` 属性的编号从 0 开始。这意味着，如果你有一个包含十个元素的数组，`length` 属性将是 `9`。\n\n要查找数组中最后一个元素的索引号，你可以使用如下代码：\n\
  \n`arrayName.length - 1`\n\n你可以使用数组的 `length` 属性来控制 `for` 循环的重复次数。下面是一个基本示例，展示了你可以使用的格式：\n\
  \n```\nfor (var i:int = 0;  i < arrayName.length;  i++)\n{\n  trace(arrayName[i]);\n\
  }\n```\n\n这段代码会显示数组中的所有元素，从元素 0 开始，一直运行到数组的末尾，无论数组有多长。\n\n本章的源文件中包含一个名为 `ArrayLoop`\
  \ 的文件夹。其中有一个示例，演示了如何使用 `for` 循环列出数组的内容。打开应用程序类并编译它来查看效果。\n\n```\npackage\n{\n  import\
  \ flash.display.Sprite;\n\n  public class ArrayLoop extends Sprite\n  {\n    //声明数组\n\
  \    private var _collectionJar:Array;\n\n    public function ArrayLoop()\n    {\n\
  \      //实例化数组\n      _collectionJar = new Array();\n\n      //向数组添加元素\n      _collectionJar.push(\"\
  fly\");\n      _collectionJar.push(\"mosquito\");\n      _collectionJar.push(\"\
  bee\");\n\n      for (var i:int = 0; i < _collectionJar.length; i++)\n      {\n\
  \        trace(\"元素 \" + i + \": \" + _collectionJar[i]);\n      }\n    }\n  }\n\
  }\n```\n\n这会显示以下跟踪输出：\n\n```\n元素 0:  fly\n元素 1:  mosquito\n元素 2:  bee\n```\n\n这段小代码是游戏设计中最常见且最有用的代码之一。你将在略微不同的上下文中数百次或数千次使用它的变体，来完成从创建对象、移动对象、更改对象属性到检测碰撞等各种任务。\n\
  \n### 搜索数组\n\n该系统的另一个有趣特性是，你可以通过加入一个 `if` 语句来创建基本的搜索功能。它非常简单：只需检查循环中的数组元素是否匹配某个搜索词。如果匹配，就找到了你要寻找的元素。\n\
  \n以下是搜索数组的基本格式：\n\n```\nfor (var i:int = 0;  i < arrayName.length;  i++)\n{\n  if(arrayName[i]\
  \ == \"搜索词\")\n  {\n    trace(\"搜索词已找到。\");\n    break;\n  }\n}\n```\n\n这里有一个新概念是关键字\
  \ `break`，它用于立即停止循环，而无需等待循环完成。当你使用循环搜索数组时，通常只寻找一个元素。一旦找到该元素，继续循环就没有意义了，因此你可以使用 `break`\
  \ 提前停止它。因为你的程序不必进行任何不必要的检查，所以你的游戏会运行得更快。\n\n你会在本章的源文件中找到一个名为 `ArraySearch` 的项目文件夹。打开它并查看应用程序类。它在循环内部使用了一个\
  \ `if` 语句，来检查数组是否包含名为 \"mosquito\" 的元素。一旦 `if` 语句找到正确的元素，就会运行一个 `break` 指令来停止循环继续。\n\
  \n```\npackage\n{\n  import flash.display.Sprite;\n\n  public class ArraySearch\
  \ extends Sprite\n  {\n    //声明数组\n    private var _collectionJar:Array;\n\n   \
  \ public function ArraySearch()\n    {\n      //实例化数组\n      _collectionJar = new\
  \ Array();\n\n      //向数组添加元素\n      _collectionJar.push(\"fly\");\n      _collectionJar.push(\"\
  mosquito\");\n      _collectionJar.push(\"bee\");\n\n      for (var i:int = 0; i\
  \ < _collectionJar.length; i++)\n      {\n        if(_collectionJar[i] == \"mosquito\"\
  )\n        {\n          trace(\"在位置 \" + i + \" 找到 Mosquito\");\n          break;\n\
  \        }\n      }\n    }\n  }\n}\n```\n\n如果你测试它，会看到如下输出：\n\n```\n在位置 1 找到 Mosquito\n\
  ```\n\n因为你包含了一个 `break` 指令，循环在此时停止。它永远不会检查元素 [2]，这是一件好事。循环已经找到了它要寻找的东西，因此无需再进一步检查。使用\
  \ `for` 循环搜索数组是一项基本的编程技术，从现在开始你会频繁地用到它。\n\n\n\n### 数组中的数组\n\n你可以在数组中存储任何内容，包括其他数组。你知道一个空数组看起来是这样的：\n\
  \n`[ ]`\n\n它只是一对方括号。假设你想在第一个空数组中放入三个新数组。你可以这样做：\n\n`[[ ],[ ],[ ]]`\n\n现在第一个数组中包含了三个新的空数组。但这样查看会让人困惑，所以这里有一种更直观的方式来观察：\n\
  \n```\n[\n  [ ],\n  [ ],\n  [ ]\n]\n```\n\n现在可以很清楚地看到，外层数组内部包含了三个新数组。这被称为**二维**数组，即数组中的数组。\n\
  \n假设你作为昆虫收藏家的爱好现在扩展了，不仅包括飞虫，还包含了鸟类和缓慢爬行的生物。你需要一个更大的收集罐！你不希望蛞蝓和蠕虫与鸟类混在一起，因为它们可能会被吃掉。所以你需要一个带有内部隔层的新罐子，用来分隔你收集的不同类型生物。你可以将飞虫放在一个区域，鸟类放在另一个区域，缓慢爬行的生物放在第三个区域。二维数组非常适合这种情况，它看起来是这样的：\n\
  \n```\n_collectionJar\n  = [\n      [\"mosquito\", \"bee\", \"fly\"],\n      [\"\
  lark\", \"magpie\", \"albatross\"],\n      [\"snail\", \"slug\", \"worm\"]\n   \
  \ ];\n```\n\n现在你有一个包含三个内部数组的数组——每种生物一个。（注意：最后一个数组后面没有逗号。还要注意：最后一个方括号后面有一个分号。）\n\n\
  每个内部数组只不过是包含数组的简单元素。这意味着如果你想要访问包含缓慢爬行生物的数组，你可以这样做：\n\n`_collectionJar[2]`\n\n这会得到\
  \ `snail`、`slug` 和 `worm`。\n\n如果你想找出该数组的第二个元素是什么，你可以这样做：\n\n`_collectionJar[2][1]`\n\
  \n这会得到 `slug`。\n\n再举一个例子。如果你想找出第二个数组的第三个元素，你可以这样找到它：\n\n`_collectionJar[1][2]`\n\
  \n这会得到 `magpie`。\n\n在本章的源文件中，你会发现一个名为 `ArraysInsideArrays` 的项目文件夹，其中包含这个新收集罐的工作示例。以下是应用程序类：\n\
  \n```\npackage\n{\n  import flash.display.Sprite;\n\n  public class ArraysInsideArrays\
  \ extends Sprite\n  {\n    //声明数组\n    private var _collectionJar:Array;\n\n   \
  \ public function ArraysInsideArrays()\n    {\n      //初始化二维数组\n      _collectionJar\n\
  \        = [\n            [\"mosquito\", \"bee\", \"fly\"],\n            [\"lark\"\
  , \"magpie\", \"albatross\"],\n            [\"snail\", \"slug\", \"worm\"]\n   \
  \       ];\n\n      //查看第一个数组的全部内容\n      //mosquito, bee, fly\n      trace(\"Array\
  \ 0: \" + _collectionJar[0]);\n\n      //查看第二个数组的全部内容\n      //lark, magpie, albatross\n\
  \      trace(\"Array 1: \" + _collectionJar[1]);\n\n      //查看第二个数组的第一个元素\n    \
  \  //lark\n      trace(\"First element of the second array: \"\n        + _collectionJar[1][0]);\n\
  \n      //查看第三个数组的第三个元素\n      //worm\n      trace(\"Third element of the third\
  \ array: \"\n        + _collectionJar[2][2]);\n\n      //查看第一个数组的第二个元素\n      //bee\n\
  \      trace(\"Second element of the first array: \"\n        + _collectionJar[0][1]);\n\
  \n      //查看整个二维数组的内容\n      //mosquito, bee, fly, lark, magpie,\n      //albatross,\
  \ snail, slug, worm\n      trace(\"Entire collection jar: \" + _collectionJar);\n\
  \    }\n  }\n}\n```\n\n以下代码的跟踪输出：\n\n```\nArray 0: mosquito,bee,fly\nArray 1: lark,magpie,albatross\n\
  First element of the second array: lark\nThird element of the third array: worm\n\
  Second element of the first array: bee\nEntire collection jar:\nmosquito,bee,fly,lark,magpie,albatross,snail,slug,worm\n\
  ```\n\n图 9-12 演示了这个二维数组的工作原理。\n\n![图片](img/9781430239922_Fig09-12.jpg)\n\n**图 9-12.**\
  \ 理解二维数组\n\n二维数组是一种非常高效的组织复杂信息的方式，你可以看到，如果你理解了这个系统，就很容易找到你想要的内容。在下一节中，你将看到如何使用二维数组来存储盒子的\
  \ x 和 y 坐标，以便轻松地将它们添加到舞台上正确的位置。\n\n你需要对数组进行一些练习，才能在自己的代码中自如地使用它们。花一些时间研究这些示例文件，做些修改，并观察你的修改如何影响输出结果。这些示例是理解本章后续内容的关键，因此在继续之前务必确保你理解了它们。\n\
  \n\n\n### 创建多个盒子\n\n我决定在平台游戏中放置 13 个盒子，并按图 9-13 所示定位在舞台上。\n\n![图片](img/9781430239922_Fig09-13.jpg)\n\
  \n**图 9-13.** 在舞台上添加大量盒子\n\n我首先在 Illustrator 中规划布局，这是构思关卡设计的有效方法。我打开了网格显示（View >\
  \ Show Grid），并选择了对齐网格选项（View > Snap to Grid），这样能更轻松地将对象精确定位在网格线上。（我的盒子宽高均为 50 像素，因此我在\
  \ Preferences > Guides & Grid 中将网格线设置为每 50 像素显示一次。）图 9-14 展示了我在 Illustrator 中的关卡规划。当然，你不一定非要用\
  \ Illustrator；铅笔和方格纸同样能胜任。（没错，就用铅笔和纸，试试看！）\n\n![图片](img/9781430239922_Fig09-14.jpg)\n\
  \n**图 9-14.** 使用 Illustrator 规划游戏盒子的位置\n\n接着，我记下了每个盒子的 `x` 和 `y` 坐标，如下所示：\n\n```\n\
  box1: x = 0, y = 200\nbox2: x = 100, y = 100\nbox3: x = 100, y = 250\n...\n```\n\
  \n我对所有 13 个盒子都进行了这样的操作。随后，我便拥有了通过循环和数组来创建这些盒子并将其添加到舞台所需的所有信息。\n\n你会在本章的源文件中找到一个名为\
  \ `MakingBoxes` 的项目文件夹。`images` 文件夹中包含一个 50x50 像素的盒子 PNG 图形。`src` 文件夹中包含与第 7 章的“定时炸弹恐慌”项目中相同的\
  \ `Box` 类。代码要正常运行，这两个元素都必须存在于项目文件夹中。图 9-15 展示了 `MakingBoxes` 项目文件夹的结构。\n\n![图片](img/9781430239922_Fig09-15.jpg)\n\
  \n**图 9-15.** 项目文件夹包含一个盒子 PNG 图像和一个用于嵌入图像的 `Box` 类\n\n下面是完整的 `MakingBoxes` 应用程序类代码，其运行结果即图\
  \ 9-13 所示。\n\n```\npackage\n{\n  import flash.display.Sprite;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n  backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n  public\
  \ class MakingBoxes extends Sprite\n  {\n    //用于存储盒子的数组\n    private var _boxes:Array\
  \ = new Array();\n\n    //用于存储盒子 x 和 y 坐标的二维数组\n    private var _boxPositions:Array\
  \ = new Array();\n\n    public function MakingBoxes()\n    {\n      //设置盒子的 x 和\
  \ y 坐标\n      _boxPositions\n        = [\n            [0, 200],\n            [100,\
  \ 100],\n            [100, 250],\n            [150, 50],\n            [150, 250],\n\
  \            [200, 50],\n            [300, 200],\n            [350, 150],\n    \
  \        [400, 150],\n            [400, 300],\n            [450, 150],\n       \
  \     [450, 300],\n            [500, 250]\n          ];\n\n      //创建盒子\n      for(var\
  \ i:int = 0; i < _boxPositions.length; i++)\n      {\n        //创建一个盒子对象\n     \
  \   var box:Box = new Box();\n\n        //将盒子添加到舞台\n        addChild(box);\n   \
  \     box.x = _boxPositions[i][0];\n        box.y = _boxPositions[i][1];\n\n   \
  \     //将其添加到 boxes 数组以供后续使用\n        _boxes.push(box);\n      }\n    }\n  }\n}\n\
  ```\n\n要使这段代码生效，需要两个数组。\n\n```\nprivate var _boxes:Array = new Array();\nprivate\
  \ var _boxPositions:Array = new Array();\n```\n\n`_boxes` 数组是存储全部十三个盒子的容器。`_boxPositions`\
  \ 数组则是一个二维数组，用于存储每个盒子的 `x` 和 `y` 坐标。\n\n```\n_boxPositions\n  = [\n      [0, 200],\n\
  \      [100, 100],\n      [100, 250],\n      [150, 50],\n      [150, 250],\n   \
  \   [200, 50],\n      [300, 200],\n      [350, 150],\n      [400, 150],\n      [400,\
  \ 300],\n      [450, 150],\n      [450, 300],\n      [500, 250]\n    ];\n```\n\n\
  `_boxPositions` 包含 13 个数组。每个数组包含两个元素：第一个元素是盒子的 `x` 坐标，第二个元素是盒子的 `y` 坐标。\n\n```\n\
  [x 坐标, y 坐标]\n```\n\n这些数字正是我当初用铅笔规划关卡时随手记下的。因为有 13 个盒子，所以每个盒子都对应一对 `x` 和 `y` 坐标。\n\
  \n`for` 循环负责创建盒子对象、将其推入 `_boxes` 数组、添加到舞台，并借助 `_boxPositions` 二维数组完成定位。\n\n```\n\
  for(var i:int = 0; i < _boxPositions.length; i++)\n{\n  //创建一个盒子对象\n  var box:Box\
  \ = new Box();\n\n  //将盒子添加到舞台\n  addChild(box);\n  box.x = _boxPositions[i][0];\n\
  \  box.y = _boxPositions[i][1];\n\n  //将其添加到 boxes 数组以供后续使用\n  _boxes.push(box);\n\
  }\n```\n\n`for` 循环使用 `_boxPosition` 数组的 `length` 属性来确定重复次数，该次数与盒子坐标的数量相等。`_boxPositions`\
  \ 数组有 13 个元素，因此循环会重复 13 次。\n\n```\nfor(var i:int = 0; i < _boxPositions.length;\
  \ i++)\n{...\n```\n\n像这样利用 `length` 属性来确定循环次数非常有用。这意味着，如果你决定在游戏中添加或移除盒子，只需在 `_boxPositions`\
  \ 数组中添加或删除一对 `x` 和 `y` 坐标即可。`for` 循环会自动根据坐标数量进行调整，你完全不需要修改循环代码。\n\n循环首先执行的操作是创建一个盒子对象。\n\
  \n```\nvar box:Box = new Box();\n```\n\n接着，代码将此盒子添加到舞台。\n\n```\naddChild(box);\n\
  ```\n\n然后是最巧妙的一步：根据你在 `_boxPositions` 数组中输入的坐标，为盒子赋予 `x` 和 `y` 坐标。\n\n```\nbox.x\
  \ = _boxPositions[i][0];\nbox.y = _boxPositions[i][1];\n```\n\n这是如何工作的呢？如果你对循环和数组不熟悉，这可能会有点令人困惑，让我们来仔细看看。循环第一次运行时，`i`\
  \ 的值为零。这意味着上述代码实际上会变成这样：\n\n```\nbox.x = _boxPositions[0][0];\nbox.y = _boxPositions[0][1];\n\
  ```\n\n首先，`_boxPositions[0]` 是什么？它指的是 `_boxPositions` 数组中的第一个元素，也就是你记下的第一组 `x` 和\
  \ `y` 坐标。\n\n```\n[0, 200]\n```\n\n在这个小数组中，元素 `0` 是 `x` 坐标，元素 `1` 是 `y` 坐标。\n\n\
  ```\n_boxPositions[0][0] = 0\n_boxPositions[0][1] = 200\n```\n\n如果你对此感到困惑，请参考前面关于二维数组的章节。其引用方式与那些示例中引用鸟类和昆虫的方式完全相同。这仅仅意味着第一个盒子的\
  \ `x` 和 `y` 坐标正在从 `_boxPositions` 数组复制到盒子对象的 `x` 和 `y` 属性中。你可以将 `for` 循环中的代码理解为：\n\
  \n```\nbox.x = 0;\nbox.y = 200;\n```\n\n循环第二次运行时，`i` 的值为 `1`。这意味着定位盒子的代码将如下所示：\n\
  \n```\nbox.x = _boxPositions[1][0];\nbox.y = _boxPositions[1][1];\n```\n\n`_boxPositions[1]`\
  \ 指的是 `_boxPositions` 的第二个元素，即存储第二个盒子坐标的数组。\n\n```\n[100, 100]\n```\n\n这意味着你可以像这样引用第二组\
  \ `x` 和 `y` 坐标：\n\n```\n_boxPositions[1][0] = 100\n_boxPositions[1][1] = 100\n```\n\
  \n最后，这也意味着在循环第二次运行时，用于定位盒子的两行代码被解释为：\n\n```\nbox.x = 100;\nbox.y = 100;\n```\n\n\
  循环运行次数与你拥有的坐标数量相同。这意味着它会对每一组坐标创建一个盒子，并将一组坐标分配给一个盒子。\n\n`for` 循环创建的 `box` 对象是*局部的*。这意味着它只在单次循环迭代中存在。循环总共会创建\
  \ 13 个这样的 `box` 对象，但每次循环重复时，这些 `box` 对象都会被新的对象替换。因此，在它失效之前，你需要将其推入 `_boxes` 数组，以便保存它供后续使用。\n\
  \n```\n_boxes.push(box);\n```\n\n\n\n现在盒子对象已安全存储于数组中，您可以在游戏中随时访问它来检测碰撞，甚至重新定位或制作动画！循环执行完毕后，所有\
  \ 13 个盒子对象都将存放在 `_boxes` 数组中。\n\n这是一个非常高效的小型系统，一旦您设置并运行它，它就会自动运行。您甚至无需过多思考，只需在需要创建大量对象并将其放置在舞台上时，复制并粘贴这段基础代码即可。除了对象名称外，您可以在无数游戏项目中直接使用这一基本格式，无需修改。\n\
  \n接下来的步骤是添加一些碰撞检测功能，让跑跳游戏角色能与盒子互动。最难的部分已经完成，您会发现添加碰撞检测其实异常简单。\n\n#### 与多个对象的碰撞处理\n\
  \n打开 `LoopingThroughBoxes` 项目文件夹并运行 SWF 文件。您会看到一个完全符合刚才所述机制的工作系统。猫咪角色现在可以奔跑跳跃于舞台上的盒子之间，探索游戏世界，如图\
  \ 9-16 所示。玩起来乐趣十足，而您已掌握所有必要技能，完全可以独立制作类似内容并开发成完整游戏。\n\n![Image](img/9781430239922_Fig09-16.jpg)\n\
  \n**图 9-16.** 结合物理与碰撞检测，构建平台游戏的基础。\n\n别慌！这里没有新知识需要学习！这种复杂效果仅通过几行额外的简短代码即可实现，而且所有这些代码您都曾见过。我们来看看它是如何工作的。\n\
  \n查看 `LoopingThroughBoxes` 项目文件夹的内部结构，如图 9-17 所示。在 `images` 文件夹中，您会发现角色和盒子的 50x50\
  \ 像素 PNG 图片。`sound` 文件夹包含 `bounce.mp3` 声音文件。`src` 文件夹中包含应用程序类、`Character` 类、`Box`\
  \ 类，以及非常重要的 `Collision` 类。\n\n![Image](img/9781430239922_Fig09-17.jpg)\n\n**图 9-17.**\
  \ LoopingThroughBoxes 项目使用的文件\n\n您还记得第 6 章和第 7 章中的 `Collision` 类吗？您曾用它来阻止两个对象，例如：\n\
  \n`Collision.block(_character, _box);`\n\n这个代码片段正是本例中用于碰撞检测的核心代码。\n\n`LoopingThroughBoxes`\
  \ 应用程序类综合运用了本章迄今为止的所有技术：声音、跳跃物理、以及通过数组和循环将对象添加到游戏中。所有这些您都应该熟悉！唯一新增的部分是 `enterFrameHandler`\
  \ 中的 for 循环，它负责处理角色与盒子之间的碰撞检测。以下是完整的应用程序类，我将在后续页面中解释碰撞检测的工作原理。\n\n```actionscript\n\
  package\n{\n  import flash.display.Sprite;\n  import flash.events.Event;\n  import\
  \ flash.events.KeyboardEvent;\n  import flash.media.Sound;\n  import flash.media.SoundChannel;\n\
  \  import flash.ui.Keyboard;\n\n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"\
  #FFFFFF\", frameRate=\"60\")]\n\n  public class LoopingThroughBoxes extends Sprite\n\
  \  {\n//嵌入声音\n    [Embed(source=\"../sounds/bounce.mp3\")]\n    private var Bounce:Class;\n\
  \n//为声音创建声音和声音通道对象\n    private var _bounce:Sound = new Bounce();\n    private var\
  \ _bounceChannel:SoundChannel = new SoundChannel();\n\n    private var _character:Character\
  \ = new Character();\n    private var _boxes:Array = new Array();\n    private var\
  \ _boxPositions:Array = new Array();\n\n    public function LoopingThroughBoxes()\n\
  \    {\n//设置盒子 x 和 y 坐标\n      _boxPositions\n        = [\n            [0, 200],\n\
  \            [100, 100],\n            [100, 250],\n            [150, 50],\n    \
  \        [150, 250],\n            [200, 50],\n            [300, 200],\n        \
  \    [350, 150],\n            [400, 150],\n            [400, 300],\n           \
  \ [450, 150],\n            [450, 300],\n            [500, 250]\n          ];\n\n\
  //制作盒子\n      for(var i:int = 0; i < _boxPositions.length; i++)\n      {\n//创建一个盒子对象\n\
  \        var box:Box = new Box();\n\n//将盒子添加到舞台\n        addChild(box);\n      \
  \  box.x = _boxPositions[i][0];\n        box.y = _boxPositions[i][1];\n\n//将其添加到盒子数组中以备后续使用\n\
  \        _boxes.push(box);\n      }\n\n//添加角色\n      addChild(_character);\n   \
  \   _character.x = 150;\n      _character.y = 300\n```\n\n\n\n```actionscript\n\
  //添加事件监听器\nstage.addEventListener(KeyboardEvent.KEY_DOWN, keyDownHandler);\nstage.addEventListener(KeyboardEvent.KEY_UP,\
  \ keyUpHandler);\nstage.addEventListener(Event.ENTER_FRAME, enterFrameHandler);\n\
  }\npublic function enterFrameHandler(event:Event):void\n{\n//应用加速度\n_character.vx\
  \ += _character.accelerationX;\n\n//应用摩擦力\n_character.vx *= _character.friction;\n\
  \n//应用重力\n_character.vy += _character.gravity;\n\n//限制速度，角色向上移动时除外\nif (_character.vx\
  \ > _character.speedLimit)\n{\n_character.vx = _character.speedLimit;\n}\nif (_character.vx\
  \ < -_character.speedLimit)\n{\n_character.vx = -_character.speedLimit;\n}\nif (_character.vy\
  \ > _character.speedLimit * 2)\n{\n_character.vy = _character.speedLimit * 2;\n\
  }\n\n//当速度降至 0.1 以下时，强制归零\nif (Math.abs(_character.vx) < 0.1)\n{\n_character.vx\
  \ = 0;\n}\nif (Math.abs(_character.vy) < 0.1)\n{\n_character.vy = 0;\n}\n\n//移动角色\n\
  _character.x += _character.vx;\n_character.y += _character.vy;\n\n//检查舞台边界\nif (_character.x\
  \ < 0)\n{\n_character.vx = 0;\n_character.x = 0;\n}\nif (_character.y < 0)\n{\n\
  _character.vy = 0;\n_character.y = 0;\n}\nif (_character.x + _character.width >\
  \ stage.stageWidth)\n{\n_character.vx = 0;\n_character.x = stage.stageWidth - _character.width;\n\
  }\nif (_character.y + _character.height > stage.stageHeight)\n{\n_character.vy =\
  \ 0;\n_character.y = stage.stageHeight - _character.height;\n_character.isOnGround\
  \ = true;\n}\n\nfor(var i:int = 0; i < _boxes.length; i++)\n{\nCollision.block(_character,\
  \ _boxes[i]);\n\nif(Collision.collisionSide == \"Bottom\")\n{\n//告诉角色，如果它站在平台上，\n\
  //那么它就在地面上\n_character.isOnGround = true;\n\n//通过施加与角色 vy 完全相反的作用力\n//来抵消重力\n_character.vy\
  \ = -_character.gravity;\n}\nelse if(Collision.collisionSide == \"Top\")\n{\n_character.vy\
  \ = 0;\n}\nelse if(Collision.collisionSide == \"Right\"\n|| Collision.collisionSide\
  \ == \"Left\")\n{\n_character.vx = 0;\n}\n}\n}\npublic function keyDownHandler(event:KeyboardEvent):void\n\
  {\nif (event.keyCode == Keyboard.LEFT)\n{\n_character.accelerationX = -0.2;\n}\n\
  else if (event.keyCode == Keyboard.RIGHT)\n{\n_character.accelerationX = 0.2;\n\
  }\nelse if (event.keyCode == Keyboard.UP\n|| event.keyCode == Keyboard.SPACE)\n\
  {\nif(_character.isOnGround)\n{\n_bounceChannel = _bounce.play();\n_character.vy\
  \ += _character.jumpForce;\n_character.gravity = 0.3;\n_character.isOnGround = false;\n\
  }\n}\n}\npublic function keyUpHandler(event:KeyboardEvent):void\n{\nif (event.keyCode\
  \ == Keyboard.LEFT\n|| event.keyCode == Keyboard.RIGHT)\n{\n_character.accelerationX\
  \ = 0;\n}\n}\n}\n```\n\n唯一的新代码是 `enterFrameHandler` 中的 `for` 循环。\n\n```actionscript\n\
  for(var i:int = 0; i < _boxes.length; i++)\n{\nCollision.block(_character, _boxes[i]);\n\
  \nif(Collision.collisionSide == \"Bottom\")\n{\n//告诉角色，如果它站在平台上，\n//那么它就在地面上\n_character.isOnGround\
  \ = true;\n\n//通过施加与角色 vy 完全相反的作用力\n//来抵消重力\n_character.vy = -_character.gravity;\n\
  }\nelse if(Collision.collisionSide == \"Top\")\n{\n_character.vy = 0;\n}\nelse if(Collision.collisionSide\
  \ == \"Right\"\n|| Collision.collisionSide == \"Left\")\n{\n_character.vx = 0;\n\
  }\n}\n```\n\n它会遍历 `_boxes` 数组中的所有盒子，并检查它们是否与角色发生碰撞。\n\n```actionscript\nfor(var\
  \ i:int = 0; i < _boxes.length; i++)\n{\nCollision.block(_character, _boxes[i]);\n\
  ```\n\n`Collision` 类包含一个名为 `collisionSide` 的静态字符串属性，它会告诉你碰撞发生在角色的哪一侧。你可以像这样访问 `collisionSide`\
  \ 属性：\n\n`Collision.collisionSide`\n\n如果没有碰撞，`collisionSide` 的值将是 \"No collision\"\
  。但如果发生碰撞，它的值将为 \"Top\"、\"Bottom\"、\"Left\" 或 \"Right\" 其中之一。你可以在 `if` 语句中使用 `collisionSide`，根据碰撞发生在角色的哪一侧，来对碰撞做出特定的处理。图\
  \ 9-18 说明了这一点。\n\n![Image](img/9781430239922_Fig09-18.jpg)\n\n**图 9-18.** 使用 `Collision`\
  \ 类的 `collisionSide` 属性，找出角色与盒子发生碰撞的是哪一侧。\n\n你需要了解这一点的原因在于，这样当角色撞到这些侧面之一时，你可以将其速度设为零。这会产生盒子吸收角色作用力的效果，从而呈现出非常自然的外观效果。如果角色碰撞在顶部、左侧或右侧，只需将\
  \ `vy` 或 `vx` 设为零即可，如下所示：\n\n```actionscript\nelse if(Collision.collisionSide ==\
  \ \"Top\")\n{\n_character.vy = 0;\n}\nelse if(Collision.collisionSide == \"Right\"\
  \n|| Collision.collisionSide == \"Left\")\n{\n_character.vx = 0;\n}\n```\n\n但如果角色从底部碰撞盒子，就需要解决一个技术细节。重力会持续将角色向下拉向舞台，因此你不能简单地通过将角色的\
  \ `vy` 设为零来使其停止。你必须通过赋予角色一个负的重力值来主动抵消重力，如下所示：\n\n```actionscript\nif(Collision.collisionSide\
  \ == \"Bottom\")\n{\n_character.isOnGround = true;\n_character.vy = -_character.gravity;\n\
  }\n```\n\n如果不这样做，重力会持续试图将角色向下拉入盒子，有时可能会导致角色卡在两个盒子相接的角落中。完全抵消重力可以彻底防止这种情况发生。\n\n\
  这里有一个有趣的小修改。你可以用以下代码替换之前的代码片段，让盒子变得有弹性：\n\n`_character.vy = -_character.vy / 2;`\n\
  \n使用这行代码后，角色在落在平台顶部之前会轻微弹跳一下。如果你想制作一个非常有弹性的平台，比如蹦床，你可以像这样反转角色的速度：\n\n`_character.vy\
  \ = -_character.vy;`\n\n或者，为了获得超级弹跳，可以乘以一个系数，像这样：\n\n`_character.vy = -_character.vy\
  \ * 1.5;`\n\n当角色底部碰到平台顶部时，发生的另一件事是其 `isOnGround` 属性被设置为 `true`。\n\n`_character.isOnGround\
  \ = true;`\n\n这与角色碰到舞台底部时发生的情况完全相同，并且会重新启用其跳跃能力。\n\n这就是你需要了解的全部新代码！你现在有一个有趣的小玩具可以玩了。你将如何利用它来制作一款游戏？回想一下你在第\
  \ 6 章、第 7 章和第 8 章中学到的技能，你会意识到你已经知道该怎么做了。\n\n\n\n#### 案例研究\n\n现在你已经掌握了一些出色的新游戏设计技巧，可以用来制作多种类型的游戏。但在实际游戏中该如何应用这些技巧呢？在本书的下载包中，你将找到一个名为《案例研究：迷宫游戏与平台游戏》的额外章节，其中详细剖析了两款游戏。\n\
  \n- **《迷宫怪物大乱斗》**：一款以怪物穿梭复杂迷宫环境为特色的迷宫游戏。\n- **《捕虫达人》**：一款包含新型敌人、人工智能技术、游戏状态管理器、物体朝向旋转详解以及舞台上对象堆叠顺序变更方法的平台游戏。\n\
  \n图 9-19 展示了这两款游戏的效果。\n\n![图片](img/9781430239922_Fig09-19.jpg)\n\n**图 9-19.** 本书下载包中的《迷宫怪物大乱斗》与《捕虫达人》案例研究\n\
  \n### 本章小结\n\n本章涵盖了许多新技术，你将在自己的游戏项目中找到它们的用武之地。解决胜负条件的具体游戏逻辑以及为角色设计的人工智能，会因项目不同而各异。但希望本章能为你提供一些应对这些问题的思路，以及在自己的游戏中解决这些难题时需要考虑的要素。\n\
  \n本章对平台游戏、物理引擎和多游戏对象管理进行了基础介绍，但这里提供的所有构建模块都能让你起步，只需稍加规划和想象力，就能打造出相当复杂的游戏。加入一些解谜与任务完成元素，再添几个动画敌人，你便顺利踏上制作真正有趣游戏的道路。你还可以添加武器，甚至实现滚动视角，让玩家探索广阔区域。若再设计些赋予玩家特殊能力的道具或可驾驶的载具呢？\n\
  \n你所使用的碰撞检测代码还有一个额外优势：它能告诉你玩家击中平台的哪一侧。你可以将此逻辑应用于敌人碰撞，判断玩家是否踩在敌人头顶——这是在平台游戏中击败敌人的经典方式。你还可以改编物理代码，创造飞行类动作游戏（如《Joust》），或飞行救援/探索游戏（如《Lunar\
  \ Lander》《Choplifter》《Defender》）。实际上，几乎所有 2D 平台游戏都已触手可及。至于移动平台？那可能会很有趣！\n\n在下一章中，你将更深入地研究敌人人工智能和脚本化运动。我会展示使用鼠标的玩家控制方案，还会教你如何让物体在\
  \ 360 度范围内移动并发射子弹。\n\n![图片](img/chap.jpg)\n\n## 第 10 章\n\n## 高级对象与角色控制\n\n现在你已经掌握了构建各种游戏所需的所有技能，但还有更多值得学习的内容。本章我们将探讨以下实用技巧，助你开启专业级游戏设计项目之旅：\n\
  \n* 使用缓动实现平滑运动\n* 用鼠标控制游戏角色\n* 让物体沿旋转方向移动\n* 向各个方向发射子弹\n* 学习基础敌人人工智能：跟随、逃离及向玩家方向射击\n\
  * 复杂的玩家控制对象：飞船、鼠标控制的平台角色、汽车和坦克\n\n本章内容庞杂且密度较高，不必强求一次性掌握所有技巧。我将其设计为一个工具箱，供你在解决特定设计问题时随时查阅。每次只取一小部分，并尽可能将技巧应用到你的项目中。\n\
  \n闲言少叙，开始游戏吧！\n\n### 用鼠标移动对象\n\n如果你开始专业设计游戏，客户可能期望游戏控制依赖鼠标而非键盘。如果你能仅用鼠标设计游戏控制，距离为\
  \ iPhone、iPad 或安卓手机平板等触屏设备设计游戏便仅一步之遥。\n\n那么，让我们逐步了解如何用鼠标控制对象。\n\n#### 将对象固定在鼠标位置\n\
  \n首先，使用`Mouse`类将对象固定在鼠标的`x`和`y`位置。在本章的源文件中，你会找到一个名为`MousePointer`的项目文件夹。运行 SWF 文件后，你会发现只需在舞台上移动鼠标，就能控制本章即将登场的明星角色——按钮仙子。图\
  \ 10-1 展示了你将看到的效果。\n\n![图片](img/9781430239922_Fig10-01.jpg)\n\n**图 10-1.** 移动鼠标让按钮仙子在舞台上飞翔。\n\
  \n移动鼠标时，鼠标指针消失，但对象仍精确固定在其所在位置。这一技巧可为你的任何游戏创建自定义鼠标指针。\n\n所有代码均位于`MousePointer`应用程序类中，如下所示：\n\
  \n```\npackage\n{\n  import flash.display.Sprite;\n  import flash.events.Event;\n\
  \  import flash.ui.Mouse;\n  import flash.events.MouseEvent;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n  backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n  public\
  \ class MousePointer extends Sprite\n  {\n    private var _fairy:Fairy = new Fairy();\n\
  \n    public function MousePointer()\n    {\n      stage.addChild(_fairy);\n\n \
  \     //隐藏鼠标\n      Mouse.hide();\n\n      stage.addEventListener(Event.ENTER_FRAME,\
  \ enterFrameHandler);\n    }\n    private function enterFrameHandler(event:Event):void\n\
  \    {\n      //将仙子居中于鼠标位置\n      _fairy.x = mouseX - (_fairy.width / 2);\n    \
  \  _fairy.y = mouseY - (_fairy.height / 2);\n    }\n  }\n}\n```\n\n此代码依赖于`Mouse`类的使用，因此首先需要导入它。\n\
  \n```\nimport flash.ui.Mouse;\n```\n\n构造函数方法通过`Mouse`类的`hide`方法隐藏鼠标。\n\n```\nMouse.hide();\n\
  ```\n\n最后，它利用舞台的`mouseX`和`mouseY`属性，将仙子的位置固定并居中于现在不可见的鼠标上。\n\n```\n_fairy.x = stage.mouseX\
  \ - (_fairy.width / 2);\n_fairy.y = stage.mouseY - (_fairy.height / 2);\n```\n\n\
  瞧，一个自定义鼠标指针就完成了！\n\n\n\n### 使用缓动效果移动对象\n\n在游戏场景中，你很可能希望角色移动时比单纯紧贴鼠标位置更优雅一些。你可以使用一种名为*缓动*的简单技术，让物体逐渐减速直至停止，并借此创建出非常精巧的物体移动系统。\n\
  \n在本章的源文件中，你会找到一个名为 `EasingWithMouse` 的文件夹。运行该 SWF 文件即可查看效果。移动鼠标，小精灵会追逐鼠标在舞台上移动，并优雅地缓动至鼠标下方位置。你可以在图\
  \ 10-2 中看到这一效果。\n\n![图片](img/9781430239922_Fig10-02.jpg)\n\n**图 10-2.** 小精灵跟随鼠标移动，并带有轻微延迟。\n\
  \n以下是实现该效果的应用程序类。其中有一个你之前未见过的新特性：`EASING` 这个值，它是一种特殊类型的值，称为*常量*。稍后我将解释常量的工作原理。\n\
  \n```actionscript\npackage\n{\n  import flash.display.Sprite;\n  import flash.events.Event;\n\
  \  import flash.events.MouseEvent;\n  import flash.ui.Mouse;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n  backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n  public\
  \ class EasingWithMouse extends Sprite\n  {\n    private var _fairy:Fairy = new\
  \ Fairy();\n    private const EASING:Number = 0.1\n\n    public function EasingWithMouse()\n\
  \    {\n      stage.addChild(_fairy);\n      stage.addEventListener(Event.ENTER_FRAME,\
  \ enterFrameHandler);\n    }\n    private function enterFrameHandler(event:Event):void\n\
  \    {\n      //计算鼠标位置与小精灵中心点之间的距离\n      var vx:Number\n        = stage.mouseX\
  \ - (_fairy.x + _fairy.width / 2);\n      var vy:Number\n        = stage.mouseY\
  \ - (_fairy.y + _fairy.height / 2);  \n      var distance:Number = Math.sqrt(vx\
  \ * vx + vy * vy);\n\n      //如果小精灵与鼠标距离超过 1 像素，则移动小精灵\n      if (distance>= 1)\n\
  \      {\n        _fairy.x += vx * EASING;\n        _fairy.y += vy * EASING;\n \
  \     }\n    }\n  }\n}\n```\n\n代码需要知道小精灵与鼠标之间的距离。它首先使用熟悉的代码计算一个距离向量。\n\n```actionscript\n\
  var vx:Number\n  = stage.mouseX - (_fairy.x + _fairy.width / 2);\nvar vy:Number\n\
  \  = stage.mouseY - (_fairy.y + _fairy.height / 2);  \n```\n\n然后应用一个简单的公式——勾股定理，并将结果存入名为\
  \ `distance` 的变量中。\n\n```actionscript\nvar distance:Number = Math.sqrt(vx * vx +\
  \ vy * vy);\n```\n\n勾股定理指出：“直角三角形斜边的平方等于两直角边的平方和。”将其转化为实际的 AS3.0 代码，意味着你需要使用内置的\
  \ `Math.sqrt` 函数来求 `vx` 与 `vy` 各自平方之和的平方根。幸运的是，毕达哥拉斯是对的！每当你需要计算两点之间的距离时，使用他的公式即可。这将成为你游戏设计技巧库中的常客，在本章中你也会频繁使用它。\n\
  \n*使用 `Math.sqrt` 的一个陷阱在于，它是你所能调用的最耗 CPU 的数学函数之一。如果能避免使用它，你将节省大量处理能力。*\n\n*如何避免呢？尝试用脑力换\
  \ CPU 算力：使用手持计算器自己预先计算数值！*\n\n*举个例子，假设你想在某个物体进入另一物体 75 像素范围内时执行某些代码。首先，计算距离的平方，如下所示：*\n\
  \n```actionscript\nvar distanceSquared:Number = (vx * vx + vy * vy);\n```\n\n*然后，当该距离小于\
  \ 75 像素时执行代码，如下所示：*\n\n```actionscript\nif (distanceSquared < 5625)\n{\n  //如果物体在范围内则执行的指令...\n\
  }\n```\n\n*5625 从何而来？它是 75 × 75（即 75²）。通过自行计算该值，你可以省去 `Math.sqrt`，效果完全相同，只是你可能会注意到物体在舞台上移动得更流畅一些。*\n\
  \n*当然，5625 确实不是一个易于理解的数字，尤其是在设计和测试游戏时。不过，在最终优化阶段，你应始终考虑对任何像这样使用 `Math.sqrt` 的代码进行优化。*\n\
  \n现在，程序已经知道了两点之间的距离，代码使用 `if` 语句来判断，当鼠标与小精灵之间的距离大于 1 像素时移动物体。\n\n```actionscript\n\
  if (Math.abs(distance) >= 1)\n{\n  _fairy.x += vx * EASING;\n  _fairy.y += vy *\
  \ EASING;\n}\n```\n\n### 缓动\n\n缓动就是小精灵轻柔地“缓入”到鼠标下方位置时你所看到的效果。以下是实现该效果的两行代码：\n\n\
  ```actionscript\n_fairy.x += vx * EASING;\n_fairy.y += vy * EASING;\n```\n\n使用一个简单的公式在\
  \ `ENTER_FRAME` 事件中即可非常容易地实现缓动，如下所示：\n\n```actionscript\n(当前位置 - 目标位置) * 缓动值;\n\
  ```\n\n通过改变缓动值，你可以让动画进行得更快或更慢。在下面的例子中，该值存储在一个名为 `EASING` 的常量中，其值为 `0.3`。\n\n```actionscript\n\
  private const EASING:Number = 0.3;\n```\n\n将其改为更大的数值，例如 `0.5`，会使缓动效果发生得更快。将其改为更小的数值，例如\
  \ `0.1`，则会产生更慢的效果。\n\n这是我们在示例中首次使用常量。常量与变量类似，只不过它们的值从不改变。它们是“恒定的”。你可以使用关键字 `const`\
  \ 声明常量。按照惯例，常量总是用大写字母书写。程序员使用常量来确保不会意外覆盖程序中不应改变的值。AS3.0 不允许你在为常量赋值后更改其值。如果你知道自己将要使用的值不会或不应改变，请尽量养成使用常量而不是变量的习惯。\n\
  \n\n\n#### 点击移动对象\n\n只需稍作修改，就能让 Button Fairy 飞到你点击的舞台上的任意位置。打开 `ClickToMove` 项目文件夹并运行\
  \ SWF 文件。在舞台上任意位置点击，Button Fairy 就会从容地飞向那个点。如图 10-3 所示。\n\n![图片](img/9781430239922_Fig10-03.jpg)\n\
  \n**图 10-3.** 点击舞台让 Button Fairy 飞向该处。\n\n以下是实现此功能的代码：\n\n```\npackage\n{\n  import\
  \ flash.display.Sprite;\n  import flash.events.Event;\n  import flash.events.MouseEvent;\n\
  \  import flash.ui.Mouse;\n\n  [SWF(width=\"550\", height=\"400\",\n  backgroundColor=\"\
  #FFFFFF\", frameRate=\"60\")]\n\n  public class ClickToMove extends Sprite\n  {\n\
  \    private const EASING:Number = 0.1\n    private var _fairy:Fairy = new Fairy();\n\
  \n    //用于捕捉鼠标点击位置的变量\n    private var _target_X:Number;\n    private var _target_Y:Number;\n\
  \n    public function ClickToMove()\n    {\n      stage.addChild(_fairy);\n    \
  \  stage.addEventListener\n        (Event.ENTER_FRAME, enterFrameHandler);\n   \
  \   stage.addEventListener\n        (MouseEvent.MOUSE_DOWN, mouseDownHandler)\n\
  \    }\n    private function mouseDownHandler(event:MouseEvent):void\n    {\n  \
  \    _target_X = stage.mouseX;\n      _target_Y = stage.mouseY;\n    }\n    private\
  \ function enterFrameHandler(event:Event):void\n    {\n//计算目标位置与仙子中心之间的距离\n    \
  \  var vx:Number\n        = _target_X - (_fairy.x + _fairy.width / 2);\n      var\
  \ vy:Number\n        = _target_Y - (_fairy.y + _fairy.height / 2);  \n      var\
  \ distance:Number = Math.sqrt(vx * vx + vy * vy);\n\n      //如果距离目标位置超过 1 像素，则移动仙子\n\
  \      if (distance >= 1)\n      {\n        _fairy.x += vx * EASING;\n        _fairy.y\
  \ += vy * EASING;\n      }\n    }\n  }\n}\n```\n\n当玩家用鼠标点击舞台上任意位置时，会调用 `mouseDownHandler`\
  \ 方法。它将鼠标的位置存储在 `_target_X` 和 `_target_Y` 两个变量中。这两个数值用作移动仙子的目标点。这些值仅在玩家点击鼠标时才会改变。其余代码与之前的示例相同。\n\
  \n轻松缓动！\n\n*我们的小缓动公式是一段非常灵活、出色的代码，但如果你想在游戏中运用更高级的缓动效果，可以考虑安装并使用自定义的补间引擎。补间引擎是由热心的程序员编写的专用类，你可以将其添加到\
  \ AS3.0 代码库中，以各种有趣的方式为对象添加动画效果。现存的补间引擎实在太多，无法直接推荐哪一个更好，它们都非常出色，因此你需要自己做一些调研，看看哪些最适合你的游戏。以下是编写本文时最知名的\
  \ AS3.0 补间引擎：Tweener、TweenLite、GTween、Twease 和 Tweensy。*\n\n*通过网络搜索可以找到它们当前的下载网站和安装说明。*\n\
  \n*但是，自己制作补间引擎或许是更好的选择！这并不难，Keith Peter 的杰作——* Foundation ActionScript 3.0 Animation\
  \ *和* AdvancED ActionScript 3.0 Animation *（均由 Apress 出版）会向你展示如何实现。*\n\n### 案例分析：全方位发射抛射物\n\
  \n为了圆满结束关于鼠标驱动玩家控制系统的讨论，让我们看一个实际的例子，它考虑了某些游戏可能需要的复杂度。我们将以此作为玩家控制方案的原型，用于本章末尾的演示游戏《疯狂杀人蜂大混乱！》。\n\
  \n你可以在本章源文件的 `ButtonFairy` 项目文件夹中找到这个例子。运行 SWF 文件，你会看到可以通过拖拽鼠标让 Button Fairy 在舞台上飞行，这与上一节“使用缓动移动对象”中的示例非常相似。在这个版本中，一个橙色的圆圈（即仙子的“魔杖”）会围绕仙子旋转，并始终指向鼠标光标。点击鼠标左键，你可以向各个方向发射星星。星星在碰到舞台边界时会被移除。图\
  \ 10-4 展示了运行效果。\n\n![图片](img/9781430239922_Fig10-04.jpg)\n\n**图 10-4.** Button Fairy\
  \ 朝着魔杖指向的方向飞行，并能向各个方向发射星星。\n\n这是一个重要的示例，演示了以下关键的游戏设计技术：\n\n*   如何让一个对象围绕另一个对象旋转\n\
  *   如何向各个方向发射抛射物\n*   如何使用组合模式，通过单一的 `GameObject` 类来创建所有游戏对象\n\n图 10-5 说明了项目结构。\n\
  \n![图片](img/9781430239922_Fig10-05.jpg)\n\n**图 10-5.** 项目类与文件\n\n让 Button Fairy\
  \ 在舞台移动的代码，与我们之前在“使用缓动移动对象”一节中看到的代码完全相同。移动魔杖和发射星星的新代码已添加进去，你将在后续篇幅中详细了解其工作原理。以下是实现所有功能的整个应用程序类：\n\
  \n```\npackage\n{\n  import flash.display.DisplayObject;\n  import flash.display.Sprite;\n\
  \  import flash.events.Event;\n  import flash.events.MouseEvent;\n  import flash.ui.Mouse;\n\
  \n  [SWF(width=\"550\", height=\"400\",\n  backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\n  public class ButtonFairy extends Sprite\n  {\n    //嵌入图像\n    [Embed(source=\"\
  ../images/fairy.png\")]\n    private var FairyImage:Class;\n    [Embed(source=\"\
  ../images/wand.png\")]\n    private var WandImage:Class;\n    [Embed(source=\"../images/star.png\"\
  )]\n    private var StarImage:Class;\n\n    //私有属性\n    private const EASING:Number\
  \ = 0.1;\n    private var _fairyImage:DisplayObject = new FairyImage();\n    private\
  \ var _wandImage:DisplayObject = new WandImage();\n\n    //创建仙子和魔杖游戏对象\n    //（GameObject\
  \ 类会将图像居中）\n    private var _fairy:GameObject = new GameObject(_fairyImage);\n \
  \   private var _wand:GameObject = new GameObject(_wandImage);\n\n    //存储鼠标与仙子中心之间角度的变量\n\
  \    private var _angle:Number;\n\n    //存储星星的数组\n    private var _stars:Array =\
  \ new Array();\n\n    public function ButtonFairy()\n    {\n      //将仙子和魔杖添加到舞台\n\
  \      stage.addChild(_fairy);\n      stage.addChild(_wand);\n\n      //隐藏鼠标\n \
  \     Mouse.hide();\n\n      //添加事件监听器\n      stage.addEventListener\n        (Event.ENTER_FRAME,\
  \ enterFrameHandler);\n      stage.addEventListener\n        (MouseEvent.MOUSE_DOWN,\
  \ mouseDownHandler);\n    }\n    private function enterFrameHandler(event:Event):void\n\
  \    {\n      //计算仙子中心与鼠标之间的角度\n      _angle\n        = Math.atan2\n        (\n\
  \          _fairy.y - stage.mouseY,\n          _fairy.x - stage.mouseX\n       \
  \ );\n```\n\n\n\n```actionscript\n//围绕小精灵移动魔法棒\nvar radius:int = -50;\n_wand.x =\
  \ _fairy.x + (radius * Math.cos(_angle));\n_wand.y = _fairy.y + (radius * Math.sin(_angle));\n\
  \n//计算鼠标与小精灵中心点的距离\nvar vx:Number = stage.mouseX - _fairy.x;\nvar vy:Number = stage.mouseY\
  \ - _fairy.y;\nvar distance:Number = Math.sqrt(vx * vx + vy * vy);\n\n//如果鼠标距离超过\
  \ 1 像素，则移动小精灵\nif (distance >= 1)\n{\n    _fairy.x += vx * EASING;\n    _fairy.y\
  \ += vy * EASING;\n}\n\n//移动星星\nfor(var i:int = 0; i < _stars.length; i++)\n{\n\
  \    var star:GameObject = _stars[i];\n    star.x += star.vx;\n    star.y += star.vy;\n\
  \n    //检查星星的舞台边界\n    if (star.y < 0\n    || star.x < 0\n    || star.x > stage.stageWidth\n\
  \    || star.y > stage.stageHeight)\n    {\n        //从舞台移除星星\n        stage.removeChild(star);\n\
  \        star = null;\n\n        //从 _stars 数组中移除星星\n        _stars.splice(i,1);\n\
  \n        //将循环计数器减一以补偿移除的星星\n        i--;\n    }\n}\n}\nprivate function mouseDownHandler(event:MouseEvent):void\n\
  {\n    //创建星星并添加到舞台\n    var starImage:DisplayObject = new StarImage();\n    var\
  \ star:GameObject = new GameObject(starImage);\n    stage.addChild(star);\n\n  \
  \  //将星星的起始位置设为魔法棒的位置\n    star.x = _wand.x;\n    star.y = _wand.y;\n\n    //根据小精灵中心与鼠标之间的角度设置星星的速度\n\
  \    star.vx = Math.cos(_angle) * -7;\n    star.vy = Math.sin(_angle) * -7;\n\n\
  \    //将星星推入 _stars 数组\n    _stars.push(star);\n}\n}\n```\n\n#### 制作游戏对象\n\n所有对象的图像都嵌入到应用程序类中。每个单独的对象都通过组合方式制作，将图像发送给`GameObject`类，如下所示：\n\
  \n```actionscript\nprivate var _fairy:GameObject = new GameObject(_fairyImage);\n\
  private var _wand:GameObject = new GameObject(_wandImage);\n```\n\n`GameObject`类包含了所有对象移动所需的`vx`和`vy`属性。当它通过构造函数方法接收到图像时，会显示图像并将其居中到包含它的精灵容器内。以下是实现这一功能的完整`GameObject`类：\n\
  \n```actionscript\npackage\n{\n    import flash.display.DisplayObject;\n    import\
  \ flash.display.Sprite;\n    {\n        public class GameObject extends Sprite\n\
  \        {\n            //公共属性\n            public var vx:Number = 0;\n        \
  \    public var vy:Number = 0;\n\n            public function GameObject\n     \
  \           (image:DisplayObject, center:Boolean = true)\n            {\n      \
  \          //添加图像\n                this.addChild(image);\n\n                //如果\"\
  center\"选项为 true，则居中图像\n                if(center)\n                {\n        \
  \            image.x -= image.width / 2;\n                    image.y -= image.height\
  \ / 2;\n                }\n            }\n        }\n    }\n}\n```\n\n`center`参数默认设置为`true`。这意味着对象的`x`和`y`位置将指向其中心点。在这个游戏示例中，这非常有用，因为我们希望小精灵居中于鼠标位置，魔法棒围绕小精灵中心旋转，并且星星从魔法棒中心点添加到舞台。将所有对象居中可以简化应用程序类中的代码。\n\
  \n如果你想使用此类创建游戏对象，但不想让图像居中，可以将`false`作为第二个参数传入，如下所示：\n\n```actionscript\nprivate\
  \ var _fairy:GameObject = new GameObject(_fairyImage, false);\n```\n\n现在对象的`x`和`y`注册点将是其左上角，与本书中大多数示例的情况一致。\n\
  \n通过这一个类创建所有游戏对象是一种强大的编程技术，称为*组合*。它省去了为每个对象创建单独类的麻烦。如果你的所有游戏对象共享相同的属性，这是一个极好的解决方案。\n\
  \n*关于组合的更多示例及其工作原理的详细解释，请参阅本书下载包中的附加章节《拖放游戏》。*\n\n#### 让魔法棒围绕小精灵旋转\n\n小精灵钮扣的魔法棒是一个黄色圆点，可以向各个方向发射星星。它围绕小精灵的中心旋转，并始终指向鼠标方向，如图\
  \ 10-6 所示。\n\n![图示](img/9781430239922_Fig10-06.jpg)\n\n**图 10-6.** 魔法棒围绕小精灵中心旋转，并始终指向鼠标方向。\n\
  \n要实现这一点，首先需要找到鼠标与小精灵中心之间的角度。代码使用`Math.atan2`函数完成此操作。以下是计算鼠标与小精灵之间角度的代码：\n\n```actionscript\n\
  _angle\n    = Math.atan2\n    (\n        _fairy.y - stage.mouseY,\n        _fairy.x\
  \ - stage.mouseX\n    );\n```\n\nAS3.0 有一个专门的函数`Math.atan2`，可以告诉你对象的旋转角度。使用它时，需要提供描述两个对象之间距离向量的任意`vx`或`vy`值。（有关距离向量的概念及如何查找，请回顾第\
  \ 6 章。）在此示例中，距离向量由小精灵与鼠标在舞台上的位置差来描述：\n\n```actionscript\n    _fairy.y - stage.mouseY,\n\
  \    _fairy.x - stage.mouseX\n```\n\n非常重要的一点是，使用`Math.atan2`时，请确保`vy`值是第一个参数，`vx`值是第二个参数，如下所示：\n\
  \n`Math.atan2(vy, vx)`\n\n`Math.atan2`返回一个以*弧度*为单位的数值。不幸的是，这对旋转精灵对象没有直接用处。你需要将这个数值转换为*度*，这是`rotation`属性所期望的值类型。\n\
  \n要将弧度转换为度，可以使用一个简单的计算：将弧度值乘以 180 除以π（3.14）。AS3.0 内置了一个名为`Math.PI`的函数，可以返回π的值，让你的操作更简便。最终代码可能如下所示：\n\
  \n`Math.atan2(vy, -vx) * (l80/Math.PI)`\n\n这会得到一个四舍五入的度数值，你可以将其应用于任何精灵的`rotation`属性。\n\
  \n*关于旋转和`Math.atan2`工作原理的详细解释，请参阅本书下载包中的附加章节《案例研究：迷宫与平台游戏》。*\n\n我决定让魔法棒在 50 像素半径范围内围绕小精灵旋转。一个名为`radius`的变量定义了此距离。\n\
  \n`var radius:int = -50;`\n\n负值使魔法棒偏离小精灵中心，而这恰好是鼠标指向的方向。\n\n魔法棒的`x`和`y`位置通过将`radius`乘以使用两个专用函数`Math.cos`和`Math.sin`获得的角度比率来确定。这两个函数都将`_angle`值作为参数。然后将结果加到小精灵的`x`和`y`位置，使魔法棒随小精灵移动。\n\
  \n```actionscript\n_wand.x = _fairy.x + (radius * Math.cos(_angle));\n_wand.y =\
  \ _fairy.y + (radius * Math.sin(_angle));\n```\n\n`Math.cos`和`Math.sin`是两个专门的三角函数，它们返回由角度测量形成的三角形两条边的比率。最终效果正如你在舞台上所见。\n\
  \n\n\n### 360 度发射星星\n\n每次单击鼠标左键，代码都会调用 `mouseDownHandler` 函数，它会根据仙女棒指向的方向创建并发射星星。\n\
  \n```actionscript\nprivate function mouseDownHandler(event:MouseEvent):void\n{\n\
  \  //创建一颗星星并将其添加到舞台\n  var starImage:DisplayObject = new StarImage();\n  var star:GameObject\
  \ = new GameObject(starImage);\n  stage.addChild(star);\n\n  //设置星星的起始位置\n  //为仙女棒的位置\n\
  \  star.x = _wand.x;\n  star.y = _wand.y;\n\n  //设置星星的速度\n  //基于仙女与鼠标中心点之间的角度\n\
  \  star.vx = Math.cos(_angle) * -7;\n  star.vy = Math.sin(_angle) * -7;\n\n  //将星星推入\
  \ _stars 数组\n  _stars.push(star);\n}\n```\n\n每颗星星都使用 `GameObject` 类创建并添加到舞台，其方式与代码创建\
  \ `_fairy` 和 `_wand` 对象完全相同。\n\n```actionscript\nvar starImage:DisplayObject = new\
  \ StarImage();\nvar star:GameObject = new GameObject(starImage);\nstage.addChild(star);\n\
  ```\n\n创建时，星星的 x 和 y 坐标与仙女棒的坐标相同。\n\n```actionscript\nstar.x = _wand.x;\nstar.y\
  \ = _wand.y;\n```\n\n然后，每颗星星都需要一个独特的速度，使其沿着鼠标指向的方向远离仙女。要找到这个速度，我们可以使用与旋转仙女棒相同的 `_angle`\
  \ 值，并将其传递给 `Math.cos` 和 `Math.sin` 函数。如果将这些结果乘以 -7，将使星星以每帧 7 像素的速度远离仙女的中心。\n\n```actionscript\n\
  star.vx = Math.cos(_angle) * -7;\nstar.vy = Math.sin(_angle) * -7;\n```\n\n接着，星星被推入\
  \ `_stars` 数组，以便我们可以像管理游戏中其他所有星星一样，移动并管理它。\n\n```actionscript\n_stars.push(star);\n\
  ```\n\n`enterFrameHandler` 中的 `for` 循环负责让星星移动并检查舞台边界。\n\n```actionscript\nfor(var\
  \ i:int = 0; i < _stars.length; i++)\n{\n  var star:GameObject = _stars[i];\n  star.x\
  \ += star.vx;\n  star.y += star.vy;\n\n  //检查星星的舞台边界\n  if (star.y < 0\n  || star.x\
  \ < 0\n  || star.x > stage.stageWidth\n  || star.y > stage.stageHeight)\n  {\n \
  \   //从舞台移除星星\n    stage.removeChild(star);\n    star = null;\n\n    //从 _stars\
  \ 数组中移除星星\n    _stars.splice(i,1);\n\n    //将循环计数器减一\n    //以补偿被移除的星星\n    i--;\n\
  \  }\n}\n```\n\n循环首先通过将我们在 `mouseDownHandler` 中计算的 `vx` 和 `vy` 值加到 x 和 y 坐标上，使 `_stars`\
  \ 数组中的每颗星星朝正确方向移动。\n\n```actionscript\nvar star:GameObject = _stars[i];\nstar.x\
  \ += star.vx;\nstar.y += star.vy;\n```\n\n然后检查星星是否越过了舞台边界。\n\n```actionscript\n\
  if (star.y < 0\n|| star.x < 0\n|| star.x > stage.stageWidth\n|| star.y > stage.stageHeight)\n\
  {…}\n```\n\n如果越界，则移除星星。首先，将其从舞台移除并将其值设为 `null`。\n\n```actionscript\nstage.removeChild(star);\n\
  star = null;\n```\n\n接着使用 `splice` 方法从 `_stars` 数组中删除该星星。\n\n```actionscript\n_stars.splice(i,1);\n\
  ```\n\n然后，代码必须将循环计数器减一，以补偿刚刚从数组中移除的星星。\n\n```actionscript\ni--;\n```\n\n如果不这样做，计数器就会偏差一位，循环将跳过下一个元素。\n\
  \n这里的新内容是使用 `splice` 从数组中移除元素。`splice` 使用两个参数：第一个是要移除元素的索引号，第二个是从该位置开始应移除的元素数量。\n\
  \n```actionscript\nsplice(whereToRemoveTheElement, numberOfElementsToRemove);\n\
  ```\n\n在此例中，您要移除当前星星，其索引号为 `i`。如果循环处于第三次重复，那将是元素编号 `2`。（请记住，数组元素从零开始编号。）\n\n在第二个参数中，`l`\
  \ 是要移除的元素数量。在此例中，您只希望移除一个元素。\n\n在此程序中，`splice` 的作用是从数组中移除星星，这样程序就不再需要移动它或检查其舞台边界。如果不将其从数组中拼接出来，数组会变得越来越大，并且程序将开始产生错误，因为它会包含对已使用\
  \ `removeChild` 从舞台移除的星星对象的引用。\n\n*你也可以使用 `splice` 向数组中插入元素。例如，如果你想将一个名为 `box` 的对象作为第三个元素插入数组，可以使用如下代码行：*\n\
  \n```actionscript\narray.splice(2, 0, box);\n```\n\n*这会将 `box` 对象添加到索引位置 2。0 表示你没有删除最初位于位置\
  \ 2 的元素。该对象将被推到位置 3，其后的任何对象也将被重新编号。*\n\n*如果你想将一个对象插入数组并替换现有元素，可以使用以下格式：*\n\n```actionscript\n\
  array.splice(2, 1, box);\n```\n\n*现在，`box` 对象将被插入到位置 2，但这也表示应从数组中删除一个元素。那将是原来位于位置\
  \ 2 的元素。它现在已彻底消失，被 `box` 替换，并且数组中其余元素将不会被重新编号。*\n\n`splice` 是一个与数组配合使用的非常通用的方法，你肯定会在很多情况下发现它有助于管理游戏对象。\n\
  \n发射投射物的这段代码是作为一名游戏设计师需要了解的最重要的代码之一。如果你的任何游戏对象需要发射子弹，请回到本章的这一部分，并将此代码调整到你的游戏中。这是游戏编程的经典内容。\n\
  \n### 高级玩家控制系统\n\n我们在本书中详细研究了多种不同类型的玩家控制系统，但这并不详尽。为了能够制作尽可能多样化的游戏，你可能还需要实现以下几种玩家控制方案：\n\
  \n- 鼠标控制的平台游戏角色\n- 键盘控制的太空船\n- 俯视角驾驶游戏中的汽车\n- 可以旋转并从炮塔发射子弹的坦克\n\n你可以在本书下载包中的奖励章节“高级玩家控制系统”中找到关于所有这些系统如何工作的工作示例和详细解释。图\
  \ 10-7 展示了你将学习制作的各种游戏对象。\n\n![图片](img/9781430239922_Fig10-07.jpg)\n\n**图 10-7.**\
  \ 高级玩家控制系统\n\n### 敌人 AI 系统\n\n我们已经仔细研究了玩家控制系统，但你的游戏敌人呢？它们制作起来很有趣，编程也很简单。正如你将在下一节中看到的，只需一些简单的技术和一点点常规逻辑，你就能构建出一些令人惊讶的复杂敌人人工智能系统。\n\
  \n你已经知道如何让一个对象跟随鼠标，而这一基本技能正是 AI 系统的核心，你可以对其进行修改以用于各种游戏场景。你只需混合搭配一些你已经掌握的技术，就可以设计出能够执行以下操作的敌人：\n\
  \n- 跟随玩家\n- 逃离玩家\n- 瞄准并向玩家发射子弹\n\n让我们一探究竟。\n\n\n\n#### 跟随另一个对象\n\n打开 `Follow` 项目文件夹并运行\
  \ SWF 文件。你会看到，如果鼠标处于 200 像素范围内，杀手蜂会跟随并转向鼠标。图 10-8 展示了你将看到的景象。当它到达鼠标位置后，会像真正的蜜蜂一样执着地绕其盘旋。\n\
  \n![图片](img/9781430239922_Fig10-08.jpg)\n\n**图 10-8.** 蜜蜂转向鼠标并在舞台上跟随其移动。\n\n蜜蜂是通过我们在\
  \ `ButtonFairy` 项目中使用的通用 `GameObject` 类创建的。以下是实现此效果的 `Follow` 应用程序类：\n\n```\npackage\n\
  {\n  import flash.display.DisplayObject;\n  import flash.display.Sprite;\n  import\
  \ flash.events.Event;\n  import flash.events.MouseEvent;\n  import flash.ui.Mouse;\n\
  \n  [SWF(width=\"550\", height=\"400\",\n  backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\n  public class Follow extends Sprite\n  {\n//嵌入图像\n    [Embed(source=\"\
  ../images/bee.png\")]\n    private var BeeImage:Class;\n\n//属性\n    private const\
  \ SPEED:Number = 3;\n    private const TURN_SPEED:Number = 0.3;\n    private const\
  \ RANGE:Number = 200;\n    private const FRICTION:Number = 0.96;\n    private var\
  \ _beeImage:DisplayObject = new BeeImage();\n    private var _bee:GameObject = new\
  \ GameObject(_beeImage);\n\n//蜜蜂的旋转角度\n    private var _beeAngle:Number;\n\n   \
  \ public function Follow()\n    {\n      stage.addChild(_bee);\n      _bee.x = 275;\n\
  \      _bee.y = 175;\n\n//添加事件侦听器\n      stage.addEventListener(Event.ENTER_FRAME,\
  \ enterFrameHandler);\n    }\n    private function enterFrameHandler(event:Event):void\n\
  \    {\n//获取目标对象\n      var target_X:Number = stage.mouseX;\n      var target_Y:Number\
  \ = stage.mouseY;\n\n//计算目标与蜜蜂之间的距离\n      var vx:Number = target_X - _bee.x;\n\
  \      var vy:Number = target_Y - _bee.y;\n\n      var distance:Number = Math.sqrt(vx\
  \ * vx + vy * vy);\n      if (distance <= RANGE)\n      {\n//计算移动量\n        var\
  \ move_X:Number = TURN_SPEED * vx / distance;\n        var move_Y:Number = TURN_SPEED\
  \ * vy / distance;\n\n//增加蜜蜂的速度\n        _bee.vx += move_X;\n        _bee.vy +=\
  \ move_Y;\n\n//计算总移动距离\n        var moveDistance:Number\n          = Math.sqrt(_bee.vx\
  \ * _bee.vx + _bee.vy * _bee.vy);\n\n//应用缓动效果\n        _bee.vx = SPEED * _bee.vx\
  \ / moveDistance;\n        _bee.vy = SPEED * _bee.vy / moveDistance;\n\n//将蜜蜂转向目标\n\
  //以弧度计算角度\n        _beeAngle = Math.atan2(_bee.vy, _bee.vx);\n\n//将弧度转换为度数，以便正确旋转蜜蜂\n\
  \        _bee.rotation = _beeAngle * 180 / Math.PI + 90;\n      }\n//应用摩擦力\n   \
  \   _bee.vx *= FRICTION;\n      _bee.vy *= FRICTION;\n\n//移动蜜蜂\n      _bee.x +=\
  \ _bee.vx;\n      _bee.y += _bee.vy;\n    }\n  }\n}\n```\n\n蜜蜂知道目标（鼠标）后，会计算自身与目标之间的距离。如果距离小于\
  \ `RANGE` 值（即 200），蜜蜂就会移动。\n\n它使用的是我们本章前面介绍的缓动公式的一个变体。但这一公式稍微复杂一些，因为你需要限制蜜蜂的速度和转向速率。以下是代码执行的步骤以及完成每项任务所用的公式：\n\
  \n1. 代码计算出对象的移动量，并将这些值赋给 `move_X` 和 `move_Y` 变量：`var move_X:Number = TURN_SPEED\
  \ * vx / distance;` `var move_Y:Number = TURN_SPEED * vy / distance;`\n\n2. 这些新变量的值被用于修改速度：`_bee.vx\
  \ += move_X;` `_bee.vy += move_Y;`\n\n3. 蜜蜂新的 `vx` 和 `vy` 属性用于帮助计算所需的总移动距离：`var\
  \ moveDistance:Number` `  = Math.sqrt(_bee.vx * _bee.vx + _bee.vy * _bee.vy);`\n\
  \n4. 然后，代码利用这个新的距离值和 `SPEED` 常量来找到正确的速度：\n   ```\n   _bee.vx = SPEED * _bee.vx /\
  \ moveDistance;\n   _bee.vy = SPEED * _bee.vy / moveDistance;\n   ```\n   这是我们缓动公式的一个变体，其中\
  \ `SPEED` 表示缓动值。\n\n5. 最后，代码将蜜蜂转向目标。这与本书中一直使用的旋转公式相同。加上 `+ 90` 是为了将蜜蜂对象的旋转偏移 90\
  \ 度。否则，蜜蜂的前端会是其右侧。（这是因为对象绘制的方式是，其“正面”是蜜蜂头上的螫针。）你在此代码中使用的任何对象的朝向可能不同，因此你可能需要将 90\
  \ 调整为你通过反复试验得出的数值，具体取决于你看到的对象旋转方向：`_bee.rotation = Math.atan2(_bee.vy, _bee.vx)\
  \ * 180 / Math.PI + 90;`\n\n如果目标*不在*蜜蜂的范围内，则会执行以下指令，通过摩擦力逐渐减慢蜜蜂的速度：\n\n```\n//应用摩擦力\n\
  _bee.vx *= FRICTION;\n_bee.vy *= FRICTION;\n\n//移动蜜蜂\n_bee.x += _bee.vx;\n_bee.y\
  \ += _bee.vy;\n```\n\n一点简单的逻辑，加上对缓动公式进行一些仔细调整，你就能实现非常有效的跟随行为。\n\n#### 逃离玩家\n\n创建完全相反的行为让蜜蜂逃离鼠标是非常容易的。要查看其效果，请打开\
  \ `RunAway` 项目文件夹并运行 SWF 文件。你会看到蜜蜂逃离鼠标，如图 10-9 所示。\n\n我说这是相反的行为，是在最字面的意义上这么说的。应用程序类与前一个案例完全相同，只是三个加号被改成了减号。\n\
  \n蜜蜂的旋转是负的，以便指向相反方向，如下所示：\n\n```\n_bee.rotation\n  = 180 * Math.atan2(_bee.vy, _bee.vx)\
  \ / Math.PI - 90;\n```\n\n速度也是负的，如下所示：\n\n```\n_bee.x -= _bee.vx;\n_bee.y -= _bee.vy;\n\
  ```\n\n就是这样！\n\n![图片](img/9781430239922_Fig10-09.jpg)\n\n**图 10-9.** 靠得太近，蜜蜂就会飞走。\n\
  \n\n\n#### 旋转并向鼠标位置射击\n\n在最终的 AI 系统中，当鼠标进入射程时，蜜蜂会转向鼠标方向并发射子弹。你可以在 `RotateAndShoot`\
  \ 项目文件夹中找到这个示例，图 10-10 展示了运行该 SWF 文件时你将看到的效果。\n\n![图片](img/9781430239922_Fig10-10.jpg)\n\
  \n**图 10-10.** 蜜蜂飞向鼠标并向其发射子弹。\n\n实现这一功能的代码融合了 `Follow` 示例，并增加了子弹发射系统。子弹通过一个定时器发射，该定时器在鼠标进入蜜蜂射程时启动。以下是实现此功能的应用程序类：\n\
  \n```actionscript\npackage\n{\n  import flash.display.DisplayObject;\n  import flash.display.Sprite;\n\
  \  import flash.events.Event;\n  import flash.events.MouseEvent;\n  import flash.ui.Mouse;\n\
  \  import flash.events.TimerEvent;\n  import flash.utils.Timer;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n  backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n  public\
  \ class RotateAndShoot extends Sprite\n  {\n    //嵌入图片\n    [Embed(source=\"../images/bee.png\"\
  )]\n    private var BeeImage:Class;\n    [Embed(source=\"../images/bullet.png\"\
  )]\n    private var BulletImage:Class;\n\n    //属性\n    private const SPEED:Number\
  \ = 3;\n    private const TURN_SPEED:Number = 0.3;\n    private const RANGE:Number\
  \ = 200;\n    private const FRICTION:Number = 0.96;\n    private var _beeImage:DisplayObject\
  \ = new BeeImage();\n    private var _bee:GameObject = new GameObject(_beeImage);\n\
  \n    //蜜蜂的旋转角度\n    private var _beeAngle:Number;\n\n    //发射子弹的定时器\n    private\
  \ var _bulletTimer:Timer;\n\n    //存储子弹的数组\n    private var _bullets:Array = new\
  \ Array();\n\n    public function RotateAndShoot()\n    {\n      //将蜜蜂添加到舞台\n  \
  \    stage.addChild(_bee);\n      _bee.x = 275;\n      _bee.y = 175;\n\n      //初始化定时器\n\
  \      _bulletTimer = new Timer(1000);\n      _bulletTimer.addEventListener\n  \
  \      (TimerEvent.TIMER, bulletTimerHandler);\n\n      //添加事件监听器\n      stage.addEventListener\n\
  \        (Event.ENTER_FRAME, enterFrameHandler);\n    }\n    private function bulletTimerHandler(event:TimerEvent):void\n\
  \    {\n      //创建一颗子弹并添加到舞台\n      var bulletImage:DisplayObject = new BulletImage();\n\
  \      var bullet:GameObject = new GameObject(bulletImage);\n      stage.addChild(bullet);\n\
  \n      //设置子弹的起始位置\n      var radius:int = 30;\n      bullet.x = _bee.x + (radius\
  \ * Math.cos(_beeAngle));\n      bullet.y = _bee.y + (radius * Math.sin(_beeAngle));\n\
  \n      //根据角度设置子弹速度\n      bullet.vx = Math.cos(_beeAngle) * 2 + _bee.vx;\n   \
  \   bullet.vy = Math.sin(_beeAngle) * 2 + _bee.vy;\n\n      //将子弹推入 _bullets 数组\n\
  \      _bullets.push(bullet);\n    }\n    private function enterFrameHandler(event:Event):void\n\
  \    {\n      //获取目标对象\n      var target_X:Number = stage.mouseX;\n      var target_Y:Number\
  \ = stage.mouseY;\n\n      //计算目标与蜜蜂之间的距离\n      var vx:Number = target_X - _bee.x;\n\
  \      var vy:Number = target_Y - _bee.y;\n\n      var distance:Number = Math.sqrt(vx\
  \ * vx + vy * vy);\n      if (distance <= RANGE)\n      {\n        //计算移动量\n   \
  \     var move_X:Number = TURN_SPEED * vx / distance;\n        var move_Y:Number\
  \ = TURN_SPEED * vy / distance;\n\n        //增加蜜蜂的速度\n        _bee.vx += move_X;\n\
  \        _bee.vy += move_Y;\n\n        //计算总移动距离\n        var moveDistance:Number\n\
  \          = Math.sqrt(_bee.vx * _bee.vx + _bee.vy * _bee.vy);\n\n        //应用缓动效果\n\
  \        _bee.vx = SPEED * _bee.vx / moveDistance;\n        _bee.vy = SPEED * _bee.vy\
  \ / moveDistance;\n\n        //让蜜蜂朝向目标旋转\n        //计算弧度角度\n        _beeAngle =\
  \ Math.atan2(_bee.vy, _bee.vx);\n\n        //将弧度转换为角度以正确旋转蜜蜂\n        _bee.rotation\
  \ = _beeAngle * 180 / Math.PI + 90;\n\n        //启动子弹定时器\n        _bulletTimer.start();\n\
  \      }\n      else\n      {\n        _bulletTimer.stop();\n      }\n\n      //应用摩擦力\n\
  \      _bee.vx *= FRICTION;\n      _bee.vy *= FRICTION;\n\n      //移动蜜蜂\n      _bee.x\
  \ += _bee.vx;\n      _bee.y += _bee.vy;\n\n      //移动子弹\n      for(var i:int = 0;\
  \ i < _bullets.length; i++)\n      {\n        var bullet:GameObject = _bullets[i];\n\
  \        bullet.x += bullet.vx;\n        bullet.y += bullet.vy;\n\n        //检查子弹是否超出舞台边界\n\
  \        if (bullet.y < 0\n        || bullet.x < 0\n        || bullet.x > stage.stageWidth\n\
  \        || bullet.y > stage.stageHeight)\n        {\n          //从舞台移除子弹\n    \
  \      stage.removeChild(bullet);\n          bullet = null;\n          _bullets.splice(i,1);\n\
  \           i--;\n        }\n      }\n    }\n  }\n}\n```\n\n#### 使用定时器发射子弹\n\n当鼠标进入蜜蜂射程时，会设置一个定时器，每秒发射一颗子弹。如下面的\
  \ `enterFrameHandler` 的节选代码所示，若鼠标在射程内则启动定时器，超出射程则停止定时器：\n\n```actionscript\nif (distance\
  \ <= RANGE)\n{\n  //…\n  _bulletTimer.start();\n}\nelse\n{\n  _bulletTimer.stop();\n\
  }\n```\n\n接着，`enterFrameHandler` 会遍历 `_bullets` 数组中的所有子弹来移动它们，并在子弹超出舞台边界时将其从游戏中移除。\n\
  \n##### 随机时间间隔射击\n\n你可以做一个小改动，让蜜蜂的射击行为更加真实。在现有代码中，蜜蜂每 1000 毫秒准时射击一次。你可以利用 `Timer`\
  \ 类的 `delay` 属性来随机化这个时间。在 `bulletTimerHandler` 事件处理器中添加以下高亮显示的代码来观察效果：\n\n```actionscript\n\
  private function bulletTimerHandler(event:TimerEvent):void\n{\n  var bulletImage:DisplayObject\
  \ = new BulletImage();\n  var bullet:GameObject = new GameObject(bulletImage);\n\
  \  stage.addChild(bullet);\n  var radius:int = 30;\n  bullet.x = _bee.x + (radius\
  \ * Math.cos(_beeAngle));\n  bullet.y = _bee.y + (radius * Math.sin(_beeAngle));\n\
  \  bullet.vx = Math.cos(_beeAngle) * 2 + _bee.vx;\n  bullet.vy = Math.sin(_beeAngle)\
  \ * 2 + _bee.vy;\n  _bullets.push(bullet);\n\n  //为下一颗子弹找到随机启动时间\n  var randomFireTime:Number\n\
  \    = Math.round(Math.random() * 1000) + 200;\n  _bulletTimer.delay = randomFireTime;\n\
  }\n```\n\n现在，蜜蜂会在 200 到 1200 毫秒之间的随机时间间隔内射击。\n\n如果你想为游戏创建任何类型的旋转敌人炮塔，这个 AI 系统正是你需要掌握的核心内容。只需将鼠标替换为其他游戏对象，蜜蜂就会追逐并射击该对象，我们将在下一个示例中看到这一点。\n\
  \n\n\n### 案例研究：杀手蜂大混乱！\n\n我们在本章中制作了许多有趣的小玩具，只需稍加改造就能将它们变成真正的游戏。如果将按钮仙子与杀手蜂放在同一环境中会发生什么？那就会在《杀手蜂大混乱！》中上演两个死敌之间的终极火力对决。你可以在源文件中找到这个游戏，运行\
  \ SWF 文件即可试玩，如图图 10-11 所示。\n\n![图片](img/9781430239922_Fig10-11.jpg)\n\n**图 10-11.**\
  \ 按钮仙子能否从暴躁的杀手蜂手中拯救林地生物？\n\n按钮仙子可以在屏幕上飞行并向蜜蜂射击。杀手蜂会向她飞来，如果她在射程范围内就会发射子弹。舞台顶部的记分板会记录双方各自命中的次数。\n\
  \n游戏中所有对象均使用通用`GameObject`类生成，因此无需自定义类来管理。这大大简化了游戏结构和代码，只需查看应用程序类就能了解游戏运行所需的一切信息。该应用程序类完全不包含新代码，只是利用本章已讲解的大部分代码实现的一个“大杂烩”示例。不过需要特别关注的是移动星星和子弹弹幕并检测碰撞的循环。这些循环必须确保不会对已移除的弹幕进行碰撞检测。接下来我们将详细分析其工作原理。\n\
