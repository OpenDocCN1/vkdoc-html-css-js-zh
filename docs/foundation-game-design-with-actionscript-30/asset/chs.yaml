  \ = true;\nbuttonDownImage.visible = false;\nbuttonOverImage.visible = false;\n\
  }\n}\n```\n\n#### 管理复杂代码\n\n这是一个很长的程序，但请注意，代码的主体部分与游戏机制无关。大约 70% 的代码用于设置、显示和管理文本字段与按钮。在大型游戏项目中，你会发现大部分代码都像这个游戏一样，用于显示图形和管理用户界面。\n\
  \n使用小而精的方法将代码模块化的重要性之一，就在于它能让你将可视化元素的编程与游戏逻辑的编程分离开来。这样做能让游戏编写变得容易得多，因为当你完成一个方法的编程后，就无需再查看它了。你可以将精力集中在另一个方法的代码上。\n\
  \n尽管如此，在一个包含数百个不同图形元素的复杂游戏中，这种方法也只能帮你到一定程度。你需要学习如何进一步模块化代码，以便能够完全封装那些无需再处理的代码。在第\
  \ 7 章中，你将学习如何利用多个类来制作游戏，这能在一定程度上解决问题。最终的解决方案是采用一种更高级的方法，即使用一种名为“模型-视图-控制器”（`MVC`）的编程*设计模式*。本书不涵盖\
  \ `MVC` 的详细内容，但你可以在本书的续作《Flash 高级游戏设计》中找到所有相关信息。\n\n不过，在你仍在学习的过程中，使用方法进行代码模块化已经能帮助你走得很远，并且你会在这一过程中学到很多。以下是一些让你的游戏和程序更易于管理的思路：\n\
  \n*   创建非常具体的方法，只执行一两个任务——绝不多做。\n*   将所有可视化元素（如按钮、文本、游戏角色、游戏对象和背景）的设置和显示工作都放在各自独立的方法中。这一点很重要，这样它们就不会干扰使游戏运行的关键逻辑编程。\n\
  *   将所有事件处理程序放在程序的末尾。在编写并测试完事件处理程序后，你几乎不需要再去查看它们。如果它们都整齐地排列在程序末尾，就能被巧妙地隐藏起来。\n\n\
  在接下来的章节中，你将在代码中看到所有这些技巧的实际应用。\n\n\n#### 项目扩展\n\n这是本书中第一个完整的游戏。但它真的完成了吗？\n\n游戏设计是一件有趣的事情。游戏，即使是复杂的游戏，也永远不会真正完成。设计师们只是在游戏运行得足够好、没有人抱怨时，才停止对它们的工作。通常，如果设计师有足够的时间、耐心和想象力，游戏还可以添加许多深层次的复杂性或额外的功能。耐心和想象力似乎是游戏设计师取之不尽的资源。通常是*时间*这个因素会从中作梗。\n\
  \n你还能为这个游戏添加不少内容。以下是一些想法。\n\n##### 制作一个“再玩一次”按钮\n\n在游戏结束时显示一个按钮，让玩家可以再玩一次。我不打算解释如何实现，因为你已经知道怎么做了！你知道如何制作按钮、设置对象属性以及创建和调用方法。通过自己创建一个“再玩一次”按钮，你将练习过去四章学到的所有技能：从设计图形到编写代码。你还会遇到一些从未想象过的问题，最终解决它们，当一切正常运行时，你会感觉如履云端。\n\
  \n完成后，你的猜数字游戏可能看起来像图 4-36 这样。\n\n![图片](img/9781430239922_Fig04-36.jpg)\n\n**图 4-36.**\
  \ 创建一个“再玩一次”按钮来重新开始游戏。\n\n以下是一些提示，帮助你进行：\n\n* 当你首次创建“再玩一次”按钮并将其添加到游戏时，它需要被禁用且不可见。\n\
  * `endGame`方法应该启用“再玩一次”按钮。\n* 在按钮被点击后，你需要禁用它。你可以直接在它的 CLICK 事件处理程序中完成。\n* 当你点击“再玩一次”按钮时，它需要重新开始游戏。你可以通过在“再玩一次”按钮的\
  \ CLICK 事件处理程序中调用`startGame`方法来实现。\n* 你需要在游戏重新开始时重新启用 Enter 键和猜测按钮。你会在哪里添加代码来实现这一点？\n\
  \n如果你彻底卡住了，你可以在本章源文件的`PlayAgain`文件夹中找到带有“再玩一次”按钮的完成版游戏。\n\n祝你好运！\n\n##### 追踪猜测记录\n\
  \n你将游戏设置为允许十次猜测，但有些玩家可能没有耐心记住他们之前猜过什么。你可以添加另一个文本字段，显示他们所有的历史猜测，并在他们做出新猜测时添加进去。\n\
  \n为此，你需要一个新的文本字段，或许叫做`guessHistory`。你可以创建一个名为`previousGuesses`的新字符串变量，将所有猜测存储为一段文本字符串，每个数字之间用空格分隔。每当玩家做出新猜测时，你可以将其添加到`previousGuesses`变量中，然后更新`guessHistory`文本字段。以下是这段代码核心部分的示例：\n\
  \n```\npreviousGuesses += currentGuess + \"  \";\nguessHistory.text = previousGuesses;\n\
  ```\n\n这行代码在`playGame`方法中会工作得很好。你能看出第一行指令中的代码是如何用空格分隔每个数字的吗？\n\n##### 添加视觉显示\n\n\
  一个类似“吊死鬼”游戏的视觉显示，用来展示玩家表现如何（或者多糟糕！），是一种有趣的增强。你可以创建十张图片，显示十种不同的“吊死鬼”状态。使用`visible`属性，根据游戏进程有选择地显示或隐藏每种状态。每种状态可以逐步向玩家展示他们离失败有多近，就像在“吊死鬼”游戏中，粉笔人形象添加肢体一样。\n\
  \n##### 扭转局面\n\n一个更高级且有趣的项目是改变游戏规则，让程序来猜一个*你*心中所想的数字。这将是一个全新的程序，但你现在已经具备让它运作起来的所有技能。\n\
  \n想试试看吗？这里有个提示：要让这个游戏工作，你需要使用除法运算符。你已经见过乘法运算符了。\n\n```\n*\n```\n\n你曾使用乘法运算符将随机数乘以\
  \ 100。除法运算符看起来像这样：\n\n```\n/\n```\n\n它是一个简单的正斜杠。你可以在任何指令中使用它来对两个数进行除法运算。\n\n```\n\
  100 / 2\n```\n\n这个示例的结果是 50。然后你可以将这个计算结果赋值给一个指令中的变量。示例如下：\n\n```\ncomputersGuess\
  \ = (100 / 2);\n```\n\n你能看出我的思路吗？我不打算剧透，让你自己琢磨剩下的部分！这对你来说会是一个有难度的项目，但你能做到。并且，在此过程中学到的东西，将让你对自己作为游戏程序员的技能成长和风格获得宝贵的洞察。\n\
  \n\n\n#### 嵌入字体快速指南\n\n如果你想确保游戏中的字体在你之外的电脑上也能正确显示，就需要将字体嵌入。嵌入字体后，字体文件会被存储在 SWF 文件中，这样玩家无需在电脑上安装该字体也能正常显示。以下是嵌入字体的操作步骤：\n\
  \n1.  在项目目录中创建一个名为`fonts`的文件夹，并将字体文件复制到该文件夹中。（字体文件通常具有`.ttf`、`.otf`或`.ttc`文件扩展名。）\n\
  2.  字体嵌入需通过元标签实现。在类定义的开头添加以下代码：\n    ```\n    public class EmbeddedFonts extends\
  \ Sprite\n    {\n      [Embed\n        (\n          source=\"../fonts/Optima.ttc\"\
  ,\n          embedAsCFF=\"false\",\n          fontName=\"embeddedFont\",\n     \
  \     fontWeight=\"normal\",\n          advancedAntiAliasing=\"true\",\n       \
  \   mimeType=\"application/x-font\"\n        )\n      ]\n      private var EmbeddedFontClass:Class;\n\
  \    ```\n\n这段代码最重要的是：`source`参数必须提供项目目录中字体文件的**准确路径**。\n\n1.  将`format`对象的`font`属性设置为`\"\
  embeddedFont\"`，该值应与代码中`fontName`参数指定的名称一致。\n    ```\n    format.size = 32;\n  \
  \  format.color = 0x000000;\n    format.font = \"embeddedFont\"\n    ```\n2.  将文本字段的`embedFonts`属性设置为`true`。\n\
  \    ```\n    output.embedFonts = true;\n    ```\n\n发布后，SWF 文件就能在任何电脑上正确显示该字体。\n\
  \n本章的源文件中有一个名为`EmbeddedFonts`的文件夹，其中包含该系统的可运行示例。它使用嵌入式字体显示一行文本。以下是完整的`EmbeddedFont`类：\n\
  \n```\npackage\n{\n  import flash.display.Sprite;\n  import flash.text.*;\n\n  public\
  \ class EmbeddedFonts extends Sprite\n  {\n    [Embed\n      (\n        source =\
  \ \"../fonts/Optima.ttc\",\n        embedAsCFF = \"false\",\n        fontName =\
  \ \"embeddedFont\",\n        fontWeight = \"normal\",\n        advancedAntiAliasing\
  \ = \"true\",\n        mimeType = \"application/x-font\"\n      )\n    ]\n    private\
  \ var EmbeddedFontClass:Class;\n\n    //创建格式和文本字段对象\n    public var format:TextFormat\
  \ = new TextFormat();\n    public var output:TextField = new TextField();\n\n  \
  \  public function EmbeddedFonts()\n    {\n      //1. 配置格式\n      format.size =\
  \ 32;\n      format.color = 0x000000;\n\n      //字体名称必须与 Embed 标签中的\"name\"参数一致\n\
  \      format.font = \"embeddedFont\";\n\n      //2. 配置文本字段\n      output.defaultTextFormat\
  \ = format;\n      output.embedFonts = true;\n      output.autoSize = TextFieldAutoSize.LEFT;\n\
  \      output.antiAliasType = flash.text.AntiAliasType.ADVANCED;\n      output.border\
  \ = false;\n      output.defaultTextFormat = format;\n      output.text = \"你想显示的文本。\"\
  ;\n      stage.addChild(output);\n      output.x = 50;\n      output.y = 175;\n\
  \    }\n  }\n}\n```\n\n嵌入式字体的行为有时会有些怪异，具体表现往往取决于你试图嵌入的字体文件。如果遇到问题，可首先尝试从 Embed 元标签中删除以下这行代码：\n\
  \n`embedAsCFF = \"false\",`\n\n通常这行代码就能解决问题。\n\n### 总结\n\n本章中介绍的猜数字游戏非常重要，原因如下：\n\
  \n*   这是本书中第一个完整的、真正的游戏。虽然它体量小巧，但包含了完整可运行游戏应具备的所有要素。尽管你后续能构建更复杂的大型游戏，但猜数字游戏是解决游戏设计问题的典范。如果你能理解其中的游戏设计问题及解决方案，那么在尝试更具挑战性的项目时，你将处于非常有利的位置。\n\
  *   你现在已经掌握了输入输出、变量、方法、`if/else`语句、按钮与键盘事件，以及通过方法实现程序模块化。这些主题代表了计算机编程的核心概念。你现在拥有了强大的编程能力，可以构建多种基于逻辑的游戏。\n\
  *   为尽量简化内容，本章重点聚焦于游戏的内部逻辑和结构。但这并不意味着你不能将这些技术与前章中控制舞台上视觉对象的技术相结合。事实上，**你绝对应该将这些技术结合起来！**稍加创意，你就能构建出完全视觉化、基于逻辑和谜题的复杂冒险游戏。\n\
  \n在继续阅读本书之前，不妨稍作休息，根据目前已学的技术自己创作一个游戏。没有什么方式比亲自尝试更能促进学习了，这也会让你对后续章节中更高级的技术有更深的理解。\n\
  \n在第第五章中，你将详细了解如何通过键盘控制舞台上的对象。这将是你从设计**游戏**迈向设计**视频游戏**的重要基石。\n\n![Image](img/chap.jpg)\n\
  \n## 第五章\n## 控制玩家角色\n\n游戏首先要实现的功能之一，就是让玩家能在舞台上移动某个对象。游戏对象可以通过鼠标或键盘来移动。本章将介绍如何用键盘控制游戏对象。\n\
  \n本章涵盖以下主题：\n\n*   使用`KEY_DOWN`、`KEY_UP`和`ENTER_FRAME`事件。\n*   将玩家角色限定在舞台边缘以及屏幕环绕处理。\n\
  *   滚动：垂直滚动、水平滚动和视差滚动。\n*   如何将图像嵌入游戏。\n\n### 使用键盘控制玩家角色\n\n游戏最基本的功能之一，就是让玩家能用键盘控制游戏角色。这并不难实现，其技术核心是使用\
  \ AS3.0 的两个内置类：`KeyboardEvent`类和`Keyboard`类。只需在程序顶部将其与其他导入的类一起导入即可。\n\n```\nimport\
  \ flash.events.KeyboardEvent;\nimport flash.ui.Keyboard;\n```\n\n你在第四章中已经使用过这两个类，实现了玩家按键盘回车键在输入文本字段中输入文字的功能。`KeyboardEvent`和`Keyboard`类包含的方法和属性，能帮助你让玩家通过键盘与游戏互动。就像`MouseEvent`类的属性一样，很快你就能闭着眼睛熟练使用所有这些新方法和新属性了。\n\
  \n\n\n#### 用键盘控制对象——错误的方式！\n\n用键盘控制对象有两种方法：正确的方式和错误的方式。我们先来看看错误的方式。\n\n为什么要学习错误的方式呢？因为用错误的方式实现玩家键盘控制非常直接易懂。哦，而且它其实也能用。但即使你永远不会在某个游戏里用它来控制玩家角色，作为一种判断玩家按了哪些键的通用技术，你也会发现它有无穷的其他用途。它也是理解正确键盘控制方式的基础，而正确方式会在同一底层系统上增加额外的灵活性和优化层。如果你先理解了错误方式如何工作，就能更好地理解和欣赏正确的做法。不过别担心，我会一步步讲解。当你把所有部分拼凑起来时，会惊讶于这个过程如此简单。\n\
  \n让我们编写一个简单的程序来演示这一点。\n\n1. 创建一个名为 `SimpleKeyboardControl` 的新 ActionScript 项目。\n\
  2. 在项目文件夹中，创建一个名为 `images` 的子文件夹。\n3. 将你在第 2 章中创建的 `character.png` 文件复制到 `images`\
  \ 文件夹中。完成后，你的项目文件夹应如图 Figure 5-1 所示。\n\n![图片](img/9781430239922_Fig05-01.jpg)\n\n\
  **图 5-1.** 将 `character.png` 文件复制到 `images` 文件夹中。\n\n4. 在代码编辑器窗口中编写以下程序。（如果你不想全部手动输入，可以在本章源文件的\
  \ `SimpleKeyboardControl` 文件夹中找到完成后的程序。）\n\n```\npackage\n{\n  import flash.net.URLRequest;\n\
  \  import flash.display.Loader;\n  import flash.display.Sprite;\n  import flash.events.KeyboardEvent;\n\
  \  import flash.ui.Keyboard;\n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"\
  #FFFFFF\", frameRate=\"60\")]\n\n  public class SimpleKeyboardControl extends Sprite\n\
  \  {\n    //创建游戏角色对象\n    public var characterURL:URLRequest\n      = new URLRequest(\"\
  ../images/character.png\");\n    public var characterImage:Loader = new Loader();\n\
  \    public var character:Sprite = new Sprite();\n    public function SimpleKeyboardControl()\n\
  \    {\n      //加载图片并将角色添加到舞台\n      characterImage.load(characterURL);\n      character.addChild(characterImage);\n\
  \      stage.addChild(character);\n      character.x = 225;\n      character.y =\
  \ 150;\n\n      //添加 KeyboardEvent 监听器\n      stage.addEventListener\n        (KeyboardEvent.KEY_DOWN,\
  \  keyDownHandler);\n    }\n    public function keyDownHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.LEFT)\n      {\n        character.x\
  \ -= 10;\n      }\n        else if (event.keyCode == Keyboard.RIGHT)\n      {\n\
  \        character.x += 10;\n      }\n      else if (event.keyCode == Keyboard.DOWN)\n\
  \      {\n        character.y += 10;\n      }\n      else if (event.keyCode == Keyboard.UP)\n\
  \      {\n        character.y -= 10;\n      }\n    }\n  }\n }\n```\n\n5. 编译程序。你的游戏角色将出现在舞台上。你可以使用方向键在舞台中移动它，如图\
  \ Figure 5-2 所示。\n\n![图片](img/9781430239922_Fig05-02.jpg)\n\n**图 5-2.** 使用键盘方向键在舞台上移动游戏角色。\n\
  \n我肯定你已注意到这种玩家角色控制方案存在一些明显问题，但在展示解决方案之前，我们先快速了解一下它的工作原理。首先要做的是将 `KeyboardEvent`\
  \ 和 `Keyboard` 类导入程序。\n\n```\nimport flash.events.KeyboardEvent;\nimport flash.ui.Keyboard;\n\
  ```\n\n`Keyboard` 类的主要任务是让判断玩家按了哪些键更简单。`KeyboardEvent` 类允许你为舞台添加事件监听器来监听按键。这正是构造函数中这段代码所做的：\n\
  \n`stage.addEventListener(KeyboardEvent.KEY_DOWN, keyDownHandler);`\n\n这与你在第 4 章中使用的事件监听器相同，工作方式也一样。它的任务是检测键盘上是否有按键被按下。它会调用\
  \ `keyDownHandler`，后者的任务是处理这个事件。\n\n```\npublic function keyDownHandler(event:KeyboardEvent):void\n\
  {\n  if (event.keyCode == Keyboard.LEFT)\n  {\n    character.x -= 10;\n  }\n  else\
  \ if (event.keyCode == Keyboard.RIGHT)\n  {\n    character.x += 10;\n  }\n  else\
  \ if (event.keyCode == Keyboard.DOWN)\n  {\n    character.y += 10;\n  }\n  else\
  \ if (event.keyCode == Keyboard.UP)\n  {\n    character.y -= 10;\n  }\n}\n```\n\n\
  *正如你在第 4 章中学到的，`Keyboard.LEFT`、`Keyboard.RIGHT`、`Keyboard.DOWN` 和 `Keyboard.UP`\
  \ 代表 AS3.0 关联到键盘按键的数字。这些数字被称为键码。*\n\n*AS3.0 使用的键码基于 ASCII，这是一种将数字解释为字符的固定标准。例如，ASCII\
  \ 数字 65 代表大写字母 A。然而，不同操作系统映射这些码到键盘按键的方式并不完全相同。如果你在 Windows 电脑上使用键码设计并测试游戏，然后在另一个操作系统（如\
  \ OS X）上运行 SWF，你使用的键码可能不匹配 OS X 的键盘映射。因此，最好使用 `Keyboard` 类的内置键属性（如 `LEFT` 和 `RIGHT`）而不是实际的键码数字。*\n\
  \n*如果你需要使用这些属性未表示的键，则必须使用键码数字。请务必在每个游戏运行的操作系统上仔细测试这些键码，确保它们正确映射到所有系统上的对应按键。*\n\n\
  *如果你使用 Flash Professional 软件构建游戏，在构建和测试过程中某些键可能不起作用。Flash Professional 为快捷键保留了一些键（例如\
  \ Ctrl 和 S 用于保存文件）。因此，如果你在游戏中使用了这些键或组合键，需要在测试时按住 Shift 键来覆盖 Flash Professional 自身对这些键的使用。在发布的\
  \ SWF 中这些键将正常工作。*\n\n非常简单，`keyPressHandler` 包含一个 if/else 语句，判断哪个键被按下，然后通过向角色的 `x`\
  \ 或 `y` 位置增加或减少 10 像素来向左、右、下或上移动角色。\n\n这很容易理解，但为什么它运行得这么差呢？当你测试程序时，可能注意到了几个大问题：\n\
  \n- 角色移动时抖动。\n- 当你按下方向键之一时，角色开始移动前会有轻微延迟。\n- 你一次只能在一个轴（`x` 或 `y`）上移动角色。你可以左右或上下移动角色，但不能沿对角线移动。尝试同时按上箭头和左箭头；它只会按照你最后按下的键的方向移动角色。如何才能让角色沿对角线移动呢？\n\
  \n\n\n这些问题是由于计算机键盘的**按键缓冲区**导致的。当你按下键盘上的一个键时，键盘只向计算机报告该键被按下了一次；它不知道这个键是否被*按住不放*。计算机操作系统内置了按键重复功能，它会以固定的时间间隔重新发送`KEY_DOWN`事件。按键重复功能对于文字处理器等程序是必要的，例如，你可以按住一个键来重复输入屏幕上的字符。你无法控制按键重复的运行方式，其结果在\
  \ Flash 游戏中就是你在舞台上看到的抖动移动。\n\n为了解决这个问题，你需要绕开按键缓冲区，让按键不直接移动对象。你可以用按键来确定对象的方向和速度，但你需要找到另一种方法来实际移动对象。\n\
  \n#### 正确控制键盘！\n\n既然你已经知道 AS3.0 如何检测你按下了哪些键，你就可以使用同样的基本系统来优化键盘控制程序。\n\n这里有很多新东西，但别慌！一旦你让程序运行起来，我会一步一步地分解所有内容，向你精确解释其工作原理。但现在，先快速总结一下你需要做什么：\n\
  \n- 你必须导入 AS3.0 的`Event`类，以便使用其`ENTER_FRAME`属性。\n- 你必须创建两个新变量：`vx`和`vy`。这些变量将存储对象的垂直和水平速度。\n\
  - 你必须修改`keyDownHandler`，使其不再改变角色的位置。取而代之的是，它用对象应移动的速度和方向来更新`vx`和`vy`变量。\n- 你必须添加一个名为`keyUpHandler`的事件处理函数。它的工作是检测方向键何时被释放。当它们被释放时，它将角色的速度设置为\
  \ 0。\n- 你必须创建一个名为`enterFrameHandler`的新事件处理函数，它使用`vx`和`vy`变量来实际移动角色。\n\n让我们编写一个新程序来演示所有这些特性。\n\
  \n1.  创建一个名为`KeyboardControl`的新 ActionScript 项目。\n2.  在项目目录中创建一个`images`文件夹，并将`character.png`文件复制到其中。\n\
  3.  在代码编辑器中编写以下程序：\n\n```\npackage\n{\n  import flash.net.URLRequest;\n  import\
  \ flash.display.Loader;\n  import flash.display.Sprite;\n  import flash.events.KeyboardEvent;\n\
    import flash.ui.Keyboard;\n  import flash.events.Event;\n\n  [SWF(width=\"550\"\
  , height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n  public\
  \ class KeyboardControl extends Sprite\n  {\n    //创建游戏角色对象\n    public var characterURL:URLRequest\n\
        = new URLRequest(\"../images/character.png\");\n    public var characterImage:Loader\
  \ = new Loader();\n    public var character:Sprite = new Sprite();\n\n    //创建并初始化\
  \ vx 和 vy 变量\n    public var vx:int = 0;\n    public var vy:int = 0;\n\n    public\
  \ function KeyboardControl()\n    {\n      //加载图像并将角色添加到舞台\n      characterImage.load(characterURL);\n\
        character.addChild(characterImage);\n      stage.addChild(character);\n      character.x\
  \ = 225;\n      character.y = 150;\n\n      //添加事件监听器\n      stage.addEventListener\n\
          (KeyboardEvent.KEY_DOWN, keyDownHandler);\n      stage.addEventListener\n\
          (KeyboardEvent.KEY_UP, keyUpHandler);\n      stage.addEventListener\n        (Event.ENTER_FRAME,\
  \ enterFrameHandler);\n    }\n    public function keyDownHandler(event:KeyboardEvent):void\n\
      {\n      if (event.keyCode == Keyboard.LEFT)\n      {\n        vx = -5;\n      }\n\
        else if (event.keyCode == Keyboard.RIGHT)\n      {\n        vx = 5;\n      }\n\
        else if (event.keyCode == Keyboard.UP)\n      {\n        vy = -5;\n      }\n\
        else if (event.keyCode == Keyboard.DOWN)\n      {\n        vy = 5;\n      }\n\
      }\n    public function keyUpHandler(event:KeyboardEvent):void\n    {\n      if\
  \ (event.keyCode == Keyboard.LEFT\n        || event.keyCode == Keyboard.RIGHT)\n\
        {\n        vx = 0;\n      }\n      else if (event.keyCode == Keyboard.DOWN\n\
          || event.keyCode == Keyboard.UP)\n      {\n         vy = 0;\n      }\n    }\n\
      public function enterFrameHandler(event:Event):void\n    {\n      //移动玩家\n      character.x\
  \ += vx;\n      character.y += vy;\n    }\n  }\n}\n```\n\n4.  编译程序。使用方向键在舞台上移动角色。现在的移动非常平滑，你还可以对角移动角色——这正是你想要的角色控制方式！\n\
  \n你可以在本章的源文件中找到完整的`KeyboardControl`程序。让我们来看看这个新程序与你编写的第一个程序有何不同。\n\n#### 使用速度移动\n\
  \n首先要留意的是两个新的整数变量`vx`和`vy`，它们存储了角色的速度——即移动的快慢。实际上，这里需要更精确一点。你存储的其实不是对象的*速率*，而是**速度**。\n\
  \n速度包含了速率和方向。这对初学者来说有时是个令人困惑的概念，因此值得更详细地讨论一下。请看这个指令：\n\n```\nvx = -5;\n```\n\n`vx`指的是\
  \ x 轴（水平方向）的速度。这实际上告诉了你两件事。首先，5 是每帧你想要角色移动的像素数。你将 SWF 文件的帧率设置为 60 fps，这意味着对象每帧将移动\
  \ 5 个像素，即每秒 300 像素。所以这是第一件事：它的速率。\n\n注意负号。\n\n```\nvx = -5;\n```\n\n这又告诉了你什么？记住，舞台最左边的\
  \ x 值为 0。向右移动时，x 值增加。向左移动时，x 值减小。这意味着那些负的 x 值实际上指向了*左侧*，正的值指向了*右侧*。因此，这个指令告诉了你速度和方向，也就是速度。\n\
  \n`向左移动 5 像素。`\n\n再举一个例子：\n\n```\nvy = +5;\n```\n\n`vy`指的是对象在 y 轴（垂直方向）上的速度。舞台最顶端的\
  \ y 值为 0。向下移动舞台时，y 值增加。这个指令表示：\n\n`向下移动 5 像素。`\n\n这就是它的速度！其实并不难，对吧？图 5-3 是一个示意图，展示了正负值如何表明方向。\n\
  \n![Image](img/9781430239922_Fig05-03.jpg)\n\n**图 5-3.** 你可以通过判断 x 或 y 值是正还是负来确定移动方向。\n\
  \n如果这一切看起来平淡无奇且显而易见，那太好了！就应该如此！现在让我们看看所有这些关于速度的讨论是如何融入程序中的。\n\n*选择变量名`vx`和`vy`已经成为指代水平和垂直速度变量的编程惯例，因此本书中也沿用此约定。大多数看到`vx`和`vy`的编程者都会立即明白它们的含义。这只是一个大家似乎都遵循的不成文编程规则，且没人知道原因。当然，你可以给这些变量起任何你喜欢的名字，比如`velocityX`和`velocityY`（这两个名字更具描述性，可能使你的程序更易读）。但是，惯例有时很难打破，因此本书坚持使用`vx`和`vy`。*\n\
  \n\n\n##### 使用新的 `keyDownHandler`\n\n`keyDownHandler` 与你在本章中看到的第一个程序相比略有变化。\n\n\
  ```\npublic function keyDownHandler(event:KeyboardEvent):void\n{\n  if (event.keyCode\
  \ == Keyboard.LEFT)\n  {\n    vx = -5;\n  }\n  else if (event.keyCode == Keyboard.RIGHT)\n\
  \  {\n    vx = 5;\n  }\n  else if (event.keyCode == Keyboard.UP)\n  {\n    vy =\
  \ -5;\n  }\n  else if (event.keyCode == Keyboard.DOWN)\n  {\n    vy = 5;\n  }\n\
  }\n```\n\n`if/else` 语句不再直接改变角色的 `x` 或 `y` 属性，而是仅使用适当的速率来更新 `vx` 和 `vy` 变量。实际移动对象的工作交给了\
  \ `enterFrameHandler` 处理。稍后会详细说明，但首先让我们快速看看另一个新的事件处理器：`keyUpHandler`。\n\n##### 使用\
  \ `keyUpHandler`\n\n在第一个简单的键盘控制程序中，向舞台添加了一个名为 `keyDownHandler` 的事件处理器，其任务是监听按键按下。`keyDownHandler`\
  \ 的有趣之处在于，它只知道按键何时被按下，而不知道何时被释放。事实证明，对于游戏而言，知道按键被抬起与知道按键被按下同样重要。因此，AS3.0 中 `KeyboardEvent`\
  \ 类有一个名为 `KEY_UP` 的便捷小属性，可以告诉你这些信息。你已在附加到舞台对象的指令中使用了 `KEY_UP` 属性作为事件监听：\n\n`stage.addEventListener(KeyboardEvent.KEY_UP,\
  \ keyUpHandler);`\n\n它监听那些被*释放*的按键，并将这些信息发送到 `keyUpHandler`，以便你进行相应操作。但你为什么想知道某个按键是否不再被按下呢？\n\
  \n试想一下：你修改了 `keyDownHandler`，使得当游戏玩家按下某个方向键时，角色的速率改变 5 像素。这很好，因为当你按下某个方向键时，你显然希望角色移动。但当你停止按下某个方向键时呢？合理的情况是角色也应停止。然而，除非你明确告诉程序这一点，否则它不知道你的意图，角色就会无休止地一直移动下去。在简单的键盘控制程序中，`keyDownHandler`\
  \ 直接改变角色的 `x` 和 `y` 属性时这不成问题，但现在你使用了速率，并将实际移动任务交给了 `enterFrameHandler`，这就成了一个重大问题。\n\
  \n`keyUpHandler` 的任务是检查是否有方向键被释放，然后将角色的速率设置为 0。这正是以下代码的作用：\n\n```\npublic function\
  \ keyUpHandler(event:KeyboardEvent):void\n{\n  if (event.keyCode == Keyboard.LEFT\n\
  \    || event.keyCode == Keyboard.RIGHT)\n  {\n    vx = 0;\n  }\n  else if (event.keyCode\
  \ == Keyboard.DOWN\n    || event.keyCode == Keyboard.UP)\n  {\n    vy = 0;\n  }\n\
  }\n```\n\n这段代码应该非常浅显易懂，但有一项内容对你来说是全新的：**或运算符**。它看起来像这样：\n\n`||`\n\n它由两个**管道符**组成。管道符是一条竖线，你可以在键盘上靠近花括号或斜杠键的位置找到它。仔细看看，它就在那里！\n\
  \n`||` 运算符用于条件语句中，帮助你判断某件事*或*另一件事是否为真。\n\n看一下这行代码：\n\n```\nif (event.keyCode ==\
  \ Keyboard.LEFT\n  || event.keyCode == Keyboard.RIGHT)\n{...\n```\n\n它的字面意思是：\n\n\
  ```\n如果左箭头键被按下，\n或者右箭头键被按下，\n则执行以下操作。\n```\n\n释放左箭头键或右箭头键会将水平速率设置为 0；角色将停止向左或向右移动。由于这两种条件的结果完全相同，因此将它们合并到一个带有\
  \ `||` 运算符的语句中是很合理的。这非常高效地节省了额外几行冗余代码。\n\n\n\n##### 使用 `enterFrameHandler`\n\n`enterFrameHandler`\
  \ 才是真正让角色移动的关键。它由一个使用 `Event` 类中 `ENTER_FRAME` 属性的事件监听器触发。要使用它，你首先必须在类定义中通过以下导入指令引入\
  \ `Event` 类：\n\n```\nimport flash.events.Event;\n```\n\n然后，在构造方法中设置事件监听器，指令如下：\n\
  \n```\naddEventListener(Event.ENTER_FRAME, onEnterFrame);\n```\n\n它的格式与另外两个监听器相同，但有一个重要的区别：该监听器并未附加到\
  \ `stage` 对象上。那么它附加到了哪里？不附加到对象而直接添加事件监听器意味着该监听器会*直接附加到它所在的类本身*；在本例中，即是你正在编写的实际程序\
  \ `KeyboardControl` 类。这点目前意义不大，但当你在第 8 章开始研究使用不同类构建游戏时，它会变得非常重要。\n\n当事件监听器被触发时，它会调用\
  \ `enterFrameHandler`。\n\n```\npublic function enterFrameHandler(event:Event):void\n\
  {\n  // 移动角色\n  character.x += vx;\n  character.y += vy;\n}\n```\n\n这个事件处理程序的功能非常简单：它获取\
  \ `vx` 和 `vy` 变量中的水平与垂直速度，并将其赋值给角色的 `x` 和 `y` 属性。这就让物体动了起来。耶！\n\n但是等等，调用这个处理程序的事件是什么？你知道程序中其他事件是由按键按下或松开触发的。`KeyboardEvent.KEY_DOWN`\
  \ 和 `KeyboardEvent.KEY_UP` 在这方面不言自明，但 `Event.ENTER_FRAME` 究竟是什么事件？\n\n先泡杯茶，再往火里添根柴。这里有个小故事，或许能帮你理解其中原理。Flash\
  \ 技术最初是为制作动画而设计的，而动画是一门从静态物体中创造运动幻觉的艺术。Flash 借用的许多概念都来自动画产业，该产业使用赛璐珞胶片来创造这种幻觉。以下简要介绍胶片动画的工作原理：\n\
  \n**胶片**是一长条赛璐珞（塑料），由一系列称为**帧**的小方块组成。每一帧包含一幅图像，而每一帧中的图像与其前一帧的图像只有细微差别。如果有足够多这样略有不同的图像以足够快的速度在观众眼前闪过，这些单独的静态图像就会看起来像是一个连续运动的图像。这种运动幻觉被称为**视觉暂留**，是所有电影、视频、动画乃至游戏动画的基础。\n\
  \n要创造令人信服的运动幻觉，这些略有不同的图像需要以至少每秒 12 次（也称为帧率，fps）的速度在观众眼前闪过。大多数卡通动画都是以 12fps 的速度进行动画的。要获得真正流畅自然的运动，你需要将帧率提高到大约\
  \ 24fps。24fps 是电影院放映的电影和高质量动画电影所使用的帧率。视频则使用大约 30fps 的帧率。\n\n在这个项目中，帧率设置为 60，这是游戏常见的帧率。这意味着舞台上所有对象每秒更新\
  \ 60 次。每次舞台进行这样的更新，就相当于“进入一帧”。因此程序每秒*进入一帧*60 次。\n\n简而言之，这就是 `Event.ENTER_FRAME`\
  \ 的含义。每次程序进入新的一帧时，`ENTER_FRAME` 事件就会被触发。因此，你放在由 `ENTER_FRAME` 事件调用的处理程序中的任何指令，每秒都会运行\
  \ 60 次。它会在程序运行的整个过程中持续执行，直到你移除该事件监听器为止。\n\n在当前程序中，以下两行指令每秒运行 60 次：\n\n```\nplayer.x\
  \ += vx;\nplayer.y += vy;\n```\n\n这使得物体看起来像是在移动。原理如下：\n\n假设角色位于 x 坐标为 100 的位置。如果游戏玩家按下左箭头键，`vx`\
  \ 变量被赋值为-5。当 SWF 文件下一次进入新帧时，-5 被加到角色当前的 x 位置上。物体新位置变为 95。在下一帧中，-5 再次被加到角色的 x 位置上，因此新位置变为\
  \ 90。如果松开左箭头键，`vx` 变量被赋值为 0。然后零被加到角色的 x 位置上（使用 `+=` 运算符），因此它的位置保持在 90，并且停止移动。\n\n\
  很巧妙，对吧？\n\n为了让角色在屏幕上移动，似乎需要费不少周折。请稍安勿躁；这种方法的好处将在本书稍后部分，当你研究使用物理模拟实现自然运动时，会变得非常明显。如果你能先计算出速度，那么在使用它更新游戏角色位置之前，你可以用它做各种有趣的事情。耐心点，我的孩子；一切都会揭晓！\n\
  \n`ENTER_FRAME` 事件是 AS3.0 中面向游戏设计师最重要的事件之一。它是使用 AS3.0 编程代码移动物体的基础。你将要学习的大部分新技术都将由\
  \ `ENTER_FRAME` 事件触发，因此你会发现从现在起，`enterFrameHandler` 将成为一个相当忙碌的小地方——很快它就会充满新朋友和愉快的闲聊。\n\
  \n##### 设置舞台边界\n\n既然你已经能让小玩家角色在舞台上移动，请注意你可以让它完全移出舞台边缘，并且如果你愿意，可以一直走下去，永无止境。游戏设计师主要使用三种策略来防止这种情况发生。\n\
  \n*   在舞台边缘阻挡移动。\n*   屏幕环绕，即玩家从舞台左侧离开，然后从右侧出现。\n*   滚动，即角色处在一个非常大的环境中，背景移动以显示未探索的区域。\n\
  \n你将逐一研究这些技术。\n\n\n\n### 在舞台边缘阻止移动\n\n与大多数编程问题一样，如果你理解了所要实现的目标背后的逻辑，那么你需要做的就是找到一种用编程代码表达该逻辑的方法。以下是这段代码实现功能背后的逻辑：\n\
  \n*如果角色到达屏幕边缘，就将其推回。*\n\n嗯，说起来容易做起来难？我们来看看。\n\nAS3.0 没有任何方法可以将“屏幕边缘”作为一个整体来表示，但你可以访问内置的`stage`对象。它包含`stageWidth`和`stageHeight`属性，可以告诉你舞台的大小。也许你可以利用这些属性来确定舞台的上、下、左、右边界，然后当你发现角色的`x`或`y`位置超出了这些边界时，就阻止它移动。\n\
  \n听起来可行？试试看！请按以下步骤操作：\n\n1. 将以下代码添加到`enterFrameHandler`中：\n\n```\npublic function\
  \ enterFrameHandler(event:Event):void\n{\n  //移动角色\n  character.x += vx;\n  character.y\
  \ += vy;\n\n  //在舞台边缘阻止角色\n  if (character.x < 0)\n  {\n    character.x = 0;\n \
  \ }\n  if (character.y < 0)\n  {\n    character.y = 0;\n  }\n  if (character.x +\
  \ character.width > stage.stageWidth)\n  {\n    character.x = stage.stageWidth -\
  \ character.width;\n  }\n  if (character.y + character.height > stage.stageHeight)\n\
  \  {\n    character.y = stage.stageHeight - character.height;\n  }\n}\n```\n\n2.\
  \ 编译程序，并使用方向键将角色移动到舞台边缘。当角色的任何一侧接触到边缘时，它就会停止移动，如图 5-4 所示。\n\n![图片](img/9781430239922_Fig05-04.jpg)\n\
  \n**图 5-4.** 角色在到达舞台边缘时停止移动。\n\n让我们详细看看这段代码是如何阻止角色越过舞台的左侧、顶部、右侧和底部边缘的。\n\n你知道舞台最左侧的`x`位置值为\
  \ 0。请记住，你的角色的注册点（即测量其`x`和`y`位置的点）是其左上角。这意味着你可以使用以下逻辑来阻止角色越过舞台左侧：\n\n*如果角色的 x 位置小于零，则将其精确设置为零。*\n\
  \n在代码中，同样的逻辑如下所示：\n\n```\nif (character.x < 0)\n{\n  character.x = 0;\n}\n```\n\n\
  如果角色从右向左移动，其`x`位置值会逐渐减小。如果它移动得足够远，其`x`值最终会达到零，甚至变为负数。当这种情况发生时，代码会将角色推回，使其正好处于位置零——即舞台的左边缘。图\
  \ 5-5 说明了这一工作原理。\n\n![图片](img/9781430239922_Fig05-05.jpg)\n\n**图 5-5.** 角色在到达舞台边缘时停止移动。\n\
  \n即使角色实际上确实略微移动到了你设定的舞台边界之外，你也从未看到它这样做；你只能看到它被强制推回的那个位置。\n\n这个逻辑同样适用于检查舞台顶部边界的代码。\n\
  \n*如果角色的 y 位置小于零，则将其精确设置为零。*\n\n```\nif (character.y < 0)\n{\n  character.y = 0;\n\
  }\n```\n\n如果角色越过舞台顶部，它会被强制推回到`y`位置为零。\n\n检查舞台右侧和底部边界会稍微复杂一些。原因在于角色的`x`和`y`位置是从其左上角测量的。这意味着你需要在角色的左上角*到达*右侧和底部边界*之前*就阻止它。如果你在角色的左上角到达舞台右侧或底部时才阻止它，那么角色的身体可能已经消失在边缘之外了。图\
  \ 5-6 说明了这个问题。\n\n![图片](img/9781430239922_Fig05-06.jpg)\n\n**图 5-6.** 你不能直接使用角色的`x`和`y`位置将其停在舞台的右侧和底部边缘。\n\
  \n你需要提前多少停止呢？刚好是其宽度或高度的量。图 5-7 显示了为什么这样有效。\n\n![图片](img/9781430239922_Fig05-07.jpg)\n\
  \n**图 5-7.** 通过加上角色的宽度和高度，可以精确地将其停在右侧和底部边缘。\n\n你可以通过使用内置的`height`和`width`属性来获取角色的高度和宽度。\n\
  \n```\ncharacter.height\ncharacter.width\n```\n\n你在第 2 章中创建的角色对象的高度和宽度为 100 像素。因此，在这个项目中，`character.height`和`character.width`将等于\
  \ 100。\n\n要找到舞台右侧边缘和底部的像素值，请使用舞台对象内置的`stageWidth`和`stageHeight`属性。\n\n```\nstage.stageWidth\n\
  stage.stageHeight\n```\n\n舞台的尺寸是 550 x 400 像素。这意味着`stage.stageWidth`属性的值是 550，`stage.stageHeight`属性的值是\
  \ 400。\n\n以下是精确地将角色停在右侧和底部边缘所需执行的操作：\n\n1. 首先，*将角色的宽度或高度加到其`x`或`y`位置。* 这将为你提供角色前缘的位置。\n\
  2. 如果该前缘的值大于舞台的右侧或底部边缘，则将角色移回到一个`x`或`y`位置，该位置等于舞台尺寸减去角色的高度或宽度。\n\n因此，以下是`if`语句中检查角色的`x`和`y`位置是否已越过舞台右侧和底部边界的代码：\n\
  \n```\nif (character.x + character.width > stage.stageWidth)\n{\n  character.x =\
  \ stage.stageWidth - character.width;\n}\nif (character.y + character.height > stage.stageHeight)\n\
  {\n  character.y = stage.stageHeight - character.height;\n}\n```\n\n它弥补了角色的高度和宽度，并使其精确地停在舞台边界处。图\
  \ 5-8 展示了这一概念的实际应用。\n\n![图片](img/9781430239922_Fig05-08.jpg)\n\n**图 5-8.** 使用对象的宽度实现精确的屏幕边界\n\
  \n使用角色和舞台的内置`height`和`width`属性的好处在于，你无需知道两者中的任何一个有多大。无论游戏角色或舞台的尺寸如何，这段代码都可以保持不变地工作。\n\
  \n你可以在本章源文件中的`StageBoundaries`文件中找到此代码的完整版本。\n\n\n\n### 屏幕环绕\n\n**屏幕环绕**是指对象从舞台一侧消失，然后从对侧重新出现。这是一种非常有趣的效果，实现起来也非常简单。实际上，实现此效果所用的逻辑，几乎与你用于在舞台边缘阻止移动的逻辑完全*相反*。让我们试试看！\n\
  \n1.  将 `enterFrameHandler` 中的条件语句修改为与加粗文本一致：\n\n```\npublic function enterFrameHandler(event:Event):void\n\
  {\n  //移动角色\n  character.x += vx;\n  character.y += vy;\n\n  //屏幕环绕\n  if (character.x\
  \ + character.width < 0)\n  {\n    character.x = 550;\n  }\n  if (character.y +\
  \ character.height < 0)\n  {\n    character.y = 400;\n  }\n  if (character.x > stage.stageWidth)\n\
  \  {\n    character.x = 0 - character.width;\n  }\n  if (character.y > stage.stageHeight)\n\
  \  {\n    character.y = 0 - character.height;\n  }\n}\n```\n\n2.  编译程序。\n3.  使用方向键将角色移动到舞台边缘。躲猫猫！它从对侧出现了（参见图\
  \ 5-9）。\n\n   ![Image](img/9781430239922_Fig05-09.jpg)\n\n   **图 5-9.** 屏幕环绕\n\n\
  在详细了解了如何在舞台边缘停止对象之后，我相信你已经能理解这段代码的作用了。除了逻辑恰好相反这一点令人愉悦外，它几乎完全一样！它利用对象的宽度和高度来判断对象是否已完全消失在舞台边缘之外。一旦检测到这种情况，它就会将对象定位在舞台对侧，刚好在可见边界之外。这创造了一种错觉，仿佛对象被困在某种圆柱形的无尽平面上。我通常在本书中会抱怨这类事情，但这次，这太棒了！好好享受吧！当然，屏幕环绕是《吃豆人》和《小行星》等许多经典老游戏的特色，现在你已经知道如何在需要时实现它了。\n\
  \n你可以在本章源文件的 `ScreenWrapping` 文件夹中找到这个屏幕环绕示例的完整代码。\n\n### 嵌入图像\n\n在继续深入学习之前，让我们看看另一种将图像加载到游戏中的系统。我将向你展示如何将图像嵌入到程序中。\n\
  \n到目前为止，你是这样将图像加载到程序中的：\n\n首先，你创建了一个 `URLRequest` 和一个 `Loader` 对象。\n\n```actionscript\n\
  public var characterURL:URLRequest\n  = new URLRequest(\"../images/character.png\"\
  );\npublic var characterImage:Loader = new Loader();\n```\n\n然后，你将图像加载到 `Loader`\
  \ 对象中。\n\n```actionscript\ncharacterImage.load(characterURL);\n```\n\n这种加载图像的系统称为**运行时**加载。图像不是在程序编译时加载，而是在\
  \ SWF 文件运行时加载。实际上，是编译好的 SWF 文件在加载这些图像，而不是你的程序。SWF 文件会读取你图像文件夹中 PNG 文件的路径，并加载图像。\n\
  \n运行时加载很有用，因为它意味着你可以在不重新编译程序的情况下更改游戏中的任何图像。只需将不同的图像放入图像文件夹，编译好的 SWF 文件就会自动读取新图像。\n\
  \n然而，运行时加载有一个致命缺陷：图像加载速度比代码运行速度慢。这意味着你的程序可能在所有图像加载完成之前就开始运行。如果你在运行每秒更新代码 60 次的 `ENTER_FRAME`\
  \ 事件，情况尤其如此，它可能导致各种问题。\n\nAS3.0 的 `Loader` 类有许多内置的方法和属性，允许你监控已加载图像的状态，并仅在图像加载完成后才初始化程序。这需要相当多的额外编码来设置和管理，但是，如果你的项目出于某种原因需要运行时加载，这可能是唯一的解决方案。你可以在\
  \ AS3.0 的文档中找到关于 `Loader` 类允许你执行此操作的属性和方法的更多信息，文档地址是 `http://help.adobe.com/en_US/FlashPlatform/reference/actionscript/3/flash/display/Loader.html?filter_flash=cs5&filter_flashplayer=10.2&filter_air=2.6`。\n\
  \n然而，对于你将处理的大多数游戏来说，有一种更可靠、更简单且更好的方法。你可以将图像直接嵌入到程序中。这意味着在代码运行之前，程序就可以立即使用这些图像。这也意味着编译好的\
  \ SWF 文件不依赖于外部的图像文件夹。\n\n以下是向程序嵌入图像的步骤：\n\n1.  导入 `DisplayObject` 类。\n\n```actionscript\n\
  import flash.display.DisplayObject;\n```\n\n将此导入语句添加到程序中的其他导入语句中。\n\n2.  在类定义中添加这两行代码：\n\
  \n```actionscript\n[Embed(source=\"../images/character.png\")]\npublic var CharacterImage:Class;\n\
  ```\n\n第一行是 `Embed` 元标签。它告诉程序在哪里查找图像文件。（当你嵌入图像时，文件路径是相对于 AS 文件，而不是 SWF 文件。）\n\n\
  第二行创建了一个 `Class` 变量。图像直接存储在此变量中。（请注意，它的名称以大写字母开头，这表明它是一个类。）\n\n非常重要的一点是，这两行代码必须像这样一起出现，并且按此顺序。你不能将它们分开或在它们之间添加任何其他代码。这只是\
  \ AS3.0 语法中的一个奇怪特性。\n\n3.  从上一步创建的 `Class` 变量创建图像对象。\n\n```actionscript\npublic\
  \ var characterImage:DisplayObject = new CharacterImage();\n```\n\n此新图像对象必须被类型化为\
  \ `DisplayObject`。\n\n4.  最后，你需要将图像对象添加到容器 Sprite 中，方式与之前示例中添加加载器对象完全相同。\n\n```actionscript\n\
  character.addChild(characterImage);\n```\n\n图 5-10 说明了嵌入图像的工作原理。\n\n![Image](img/9781430239922_Fig05-10.jpg)\n\
  \n**图 5-10.** 将图像嵌入到程序中\n\n由于它能解决所有问题，像这样嵌入图像将成为本书后续项目中加载图像到游戏的首选系统。你将在下一节看到一个如何嵌入图像的实用示例。\n\
  \n*你可以嵌入任何类型的文件，而不仅仅是图像文件。在第 9 章中，你将学习如何嵌入声音；在第 11 章中，你将学习如何嵌入 SWF 文件。*\n\n\n\n\
  ### 滚动效果\n\n**滚动**是一种让玩家能够在远超舞台尺寸的广阔环境中移动的视觉效果。如同中国古代的长卷在木桌上缓缓展开，背景会随之移动，使角色能够探索舞台边界之外的空间。\n\
  \n虽然很难说哪个游戏系列更胜一筹，但要说游戏设计中几乎所有的核心理念，都能在两大经典游戏系列《**超级马力欧兄弟**》和《**塞尔达传说**》中以不同形式体现，这一点恐怕争议不大。游戏设计师需要考虑的关于优秀游戏设计的方方面面，几乎都能在这两款游戏中找到，滚动效果也不例外。\n\
  \n《超级马力欧兄弟》主要采用了**横向卷轴**的方式。也就是说，当玩家移动到屏幕左边缘或右边缘时，背景会向左或向右移动。这类游戏的视角通常设计成从侧面观察场景。《塞尔达传说》则使用了**俯瞰式多轴滚动**。在俯瞰式滚动中，你可以从正上方俯视环境，就像一只飞在天空的鸟，俯瞰着下方的大地。多轴滚动允许玩家角色自由地向任何方向移动（上、下、左、右），而环境背景会随之滚动以保持角色位于视野中。\n\
  \n实际上，大多数使用滚动效果的游戏都是这两种系统的结合。本章将先介绍其中更复杂的多轴滚动，最后再快速讲解横向卷轴。当你熟练掌握这里讲解的滚动技术后，就能实现这两种系统的任意组合。\n\
  \n实现滚动系统首先需要一张比舞台大得多的背景场景。在本例中，你将使用一张非常大的图片。\n\n1.  找一张你认为适合滚动系统的大图。任何宽度和高度大于 1000\
  \ 像素的图片都适用于本示例。我决定让我那只勤劳的小猫角色去太空度个假：前往火星的卫星之一——火卫一。幸运的是，美国国家航空航天局（NASA）提供了大量免版税照片，包括我能够下载到的火卫一超高分辨率图像。（要自行下载高分辨率太空场景，请访问\
  \ `http://photojournal.jpl.nasa.gov/`。任何标记为“全分辨率”的图片尺寸都足够大。）\n2.  将下载的照片重命名为 `background`。注意：这很可能是一张扩展名为\
  \ `.jpg` 的 JPEG 图片。如果是这样，你需要在后续的示例代码中使用文件名 `“background.jpg”`。\n3.  创建一个名为 `BasicScrolling`\
  \ 的新 ActionScript 项目。\n4.  在 `BackgroundScrolling` 项目目录中创建一个 `images` 文件夹，然后将你的背景图片和角色图片复制进去。\n\
  5.  在代码编辑器中编写以下程序。（你可以在本章源文件的 `BasicScrolling` 文件夹中找到这段完整的代码。）\n\n```\npackage\n\
  {\n  import flash.display.Sprite;\n  import flash.display.DisplayObject;\n  import\
  \ flash.events.KeyboardEvent;\n  import flash.ui.Keyboard;\n  import flash.events.Event;\n\
  \n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\n  public class BasicScrolling extends Sprite\n  {\n    //嵌入背景图像\n    [Embed(source=\"\
  ../images/background.png\")]\n    public var BackgroundImage:Class;\n    public\
  \ var backgroundImage:DisplayObject\n      = new BackgroundImage();\n    public\
  \ var background:Sprite = new Sprite();\n\n    //嵌入角色图像\n    [Embed(source=\"../images/character.png\"\
  )]\n    public var CharacterImage:Class;\n    public var characterImage:DisplayObject\
  \ = new CharacterImage();\n    public var character:Sprite = new Sprite();\n\n \
  \   //创建并初始化 vx 和 vy 变量\n    public var vx:int = 0;\n    public var vy:int = 0;\n\
  \n    public function BasicScrolling()\n    {\n      //添加背景\n      background.addChild(backgroundImage);\n\
  \      stage.addChild(background);\n      background.x = -1325;\n      background.y\
  \ = -961;\n\n      //添加角色\n      character.addChild(characterImage);\n      stage.addChild(character);\n\
  \      character.x = 225;\n      character.y = 150;\n\n      //添加事件侦听器\n      stage.addEventListener\n\
  \        (KeyboardEvent.KEY_DOWN, keyDownHandler);\n      stage.addEventListener\n\
  \        (KeyboardEvent.KEY_UP, keyUpHandler);\n      stage.addEventListener\n \
  \       (Event.ENTER_FRAME, enterFrameHandler);\n    }\n\n    public function keyDownHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.LEFT)\n      {\n        vx = -5;\n \
  \     }\n      else if (event.keyCode == Keyboard.RIGHT)\n      {\n        vx =\
  \ 5;\n      }\n      else if (event.keyCode == Keyboard.UP)\n      {\n        vy\
  \ = -5;\n      }\n      else if (event.keyCode == Keyboard.DOWN)\n      {\n    \
  \    vy = 5;\n      }\n    }\n    public function keyUpHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.LEFT\n        || event.keyCode == Keyboard.RIGHT)\n\
  \      {\n        vx = 0;\n      }\n      else if (event.keyCode == Keyboard.DOWN\n\
  \        || event.keyCode == Keyboard.UP)\n      {\n        vy = 0;\n      }\n \
  \   }\n    public function enterFrameHandler(event:Event):void\n    {\n      //移动背景\n\
  \      background.x -= vx;\n      background.y -= vy;\n\n      //检查舞台边界\n      if\
  \ (background.x > 0)\n      {\n        background.x = 0;\n      }\n      if (background.y\
  \ > 0)\n      {\n        background.y = 0;\n      }\n      if (background.x < stage.stageWidth\
  \ - background.width)\n      {\n        background.x = stage.stageWidth - background.width;\n\
  \      }\n      if (background.y < stage.stageHeight - background.height)\n    \
  \  {\n        background.y = stage.stageHeight - background.height;\n      }\n \
  \   }\n  }\n}\n```\n\n6.  请记住，如果你使用的是 JPEG 文件，则可能需要将 `“background.png”` 改为 `“background.jpg”`。`[Embed(source=\"\
  ../images/background.jpg\")]`\n7.  编译程序。使用方向键在舞台上移动角色，你会看到自己可以在火卫一的表面上飞翔！（参见图 5-11。）\n\
  \n![图片](img/9781430239922_Fig05-11.jpg)\n\n**图 5-11.** 太空度假！\n\n#### 查看代码\n\n让我们来看看这个程序中引入的一些新代码和概念。\n\
  \n\n\n### 嵌入角色与背景图像\n\n为了嵌入图像，程序首先导入了 `DisplayObject` 类。\n\n```\nimport flash.display.Sprite;\n\
  import flash.display.DisplayObject;\nimport flash.events.KeyboardEvent;\nimport\
  \ flash.ui.Keyboard;\nimport flash.events.Event;\n```\n\n图像被嵌入在类定义中。实现这一功能的代码与你刚才看到的示例完全相同。请记住，即使嵌入了图像，如果要将其显示在舞台上，最终还是需要将其复制到\
  \ `Sprite` 对象中。这就是为什么代码要为角色和背景分别创建对应的 `Sprite` 对象。\n\n```\npublic class BasicScrolling\
  \ extends Sprite\n{\n  //嵌入背景图像\n  [Embed(source=\"../images/background.png\")]\n\
  \  public var BackgroundImage:Class;\n  public var backgroundImage:DisplayObject\
  \ = new BackgroundImage();\n  public var background:Sprite = new Sprite();\n\n \
  \ //嵌入角色图像\n  [Embed(source=\"../images/character.png\")]\n  public var CharacterImage:Class;\n\
  \  public var characterImage:DisplayObject = new CharacterImage();\n  public var\
  \ character:Sprite = new Sprite();\n\n  //创建并初始化 vx 和 vy 变量\n  public var vx:int\
  \ = 0;\n  public var vy:int = 0;\n\n  public function BasicScrolling()\n  {...}\n\
  ```\n\n包含图像的 `Sprite` 随后会以与之前程序相同的方式，在构造方法中被添加到舞台上。\n\n```\npublic function BasicScrolling()\n\
  {\n  //添加背景\n  background.addChild(backgroundImage);\n  stage.addChild(background);\n\
  \  background.x = -1005;\n  background.y = -761;\n\n  //添加角色\n  character.addChild(characterImage);\n\
  \  stage.addChild(character);\n  character.x = 225;\n  character.y = 150;\n\n  //添加事件监听器\n\
  \  stage.addEventListener\n    (KeyboardEvent.KEY_DOWN, keyDownHandler);\n  stage.addEventListener\n\
  \    (KeyboardEvent.KEY_UP, keyUpHandler);\n  stage.addEventListener\n    (Event.ENTER_FRAME,\
  \ enterFrameHandler);\n}\n```\n\n但请注意定位背景的这行代码：\n\n```\nbackground.x = -1325;\n\
  background.y = -961;\n```\n\n这值得进一步解释。\n\n### 定位背景\n\n我使用的火卫一图像非常大：尺寸为 2561 x 1922\
  \ 像素。而舞台只有 550 x 400 像素。我想将背景添加到舞台上并使其居中——这样在游戏开始时，火卫一的中心点就能显示在舞台上。这意味着我需要在背景的 `x`\
  \ 和 `y` 位置分别取其宽度和高度的一半的负值。然后，还需要在 `x` 位置加上舞台宽度的一半，在 `y` 位置加上舞台高度的一半。请记住，对象的定位是从其左上角开始的。并且舞台左上角的\
  \ `x` 和 `y` 值均为 0。这意味着，如果我将背景的初始 `x` 位置设为 -1005，`y` 位置设为 -761，那么游戏开始时背景将相对于舞台居中。图\
  \ 5-12 说明了其原理。\n\n![图像](img/9781430239922_Fig05-12.jpg)\n\n**图 5-12.** 使背景相对于舞台居中。\n\
  \n当然，大部分背景隐藏在舞台之外。但它将正好位于舞台中心的正上方。\n\n要使你自己的背景图像居中，请将图像的高度和宽度除以一半，然后减去舞台宽度和高度的一半。通过在前面加上负号使这些数字变为负数，并将这些负数用作背景的\
  \ `x` 和 `y` 位置。如果你不想手动计算（又何必自己算呢？），只需让 AS3.0 像下面这样自动为你完成即可：\n\n```\nbackground.x\
  \ = -(background.width - stage.stageWidth) / 2;\nbackground.y = -(background.height\
  \ - stage.stageHeight) / 2;\n```\n\n这段代码将使任何尺寸的大型背景图像居中。\n\n角色在舞台上居中。实际上，在整个过程中，角色从未离开它在舞台中央的位置。看起来它像是在移动，但实际上并没有。这就是滚动幻象的全部内容，接下来我将解释其工作原理。\n\
  \n### 滚动背景\n\n那么，如果角色不移动，移动的是什么呢？是背景。在 `enterFrameHandler` 的代码中，`background` 对象成为了新的关注中心。\n\
  \n你所做的仅仅是逆转了之前用于移动角色的一部分逻辑。当你按下方向键时，它们会沿着你希望角色移动的*相反*方向移动 `background` 对象。这就是为什么你需要在这两行代码中给\
  \ `vx` 和 `vy` 变量加上负号：\n\n```\nbackground.x += -vx;\nbackground.y += -vy;\n```\n\n\
  这便制造出了角色在移动的幻象，而实际上是背景对象在向相反方向移动。啊，电子游戏程序员那狡黠的手段！\n\n条件判断语句用于阻止背景对象在其边缘触及舞台边缘时继续移动。\n\
  \n```\nif (background.x > 0)\n{\n  background.x = 0;\n}\nif (background.y > 0)\n\
  {\n  background.y = 0;\n}\nif (background.x < stage.stageWidth - background.width)\n\
  {\n  background.x = stage.stageWidth - background.width;\n}\nif (background.y <\
  \ stage.stageHeight - background.height)\n{\n  background.y = stage.stageHeight\
  \ - background.height;\n}\n```\n\n至于它为何如此运作，其中的逻辑推导就留给你自己去琢磨了，但这不过是用于阻止角色移出舞台边缘的那套逻辑的又一种变体应用而已。\n\
  \n\n### 更好的滚动\n\n这个简单的滚动系统实际上可以让你走得很远，但有几个问题可以通过微调来解决：\n\n- 当可滚动区域达到其极限时，角色将无法一直移动到舞台边缘。试着按住右箭头键，看看你能走多远。到某个时候，背景会停止移动，但玩家无法一直走到舞台的右侧。这似乎是一种人为的限制，在许多动作或冒险游戏中，这对玩家来说会是一个令人沮丧的限制。图\
  \ 5-13 说明了这个问题。\n\n![图片](img/9781430239922_Fig05-13.jpg)\n\n**图 5-13.** 当背景达到其可滚动区域的极限时，角色无法一直移动到舞台边缘。\n\
  \n- 另一个潜在问题是滚动背景*总是*在滚动。对于许多游戏来说，如果背景只在角色*接近*舞台边缘时才滚动，可能更有意义。否则，角色应该自由探索，而背景不应移动。\n\
  \n以下是解决这些问题的方法。你可以建立一个系统，根据角色和背景对象各自的位置，来确定是应该移动角色还是背景对象。如果背景对象已经达到了其移动极限，那么角色应该可以自由移动到舞台边缘。此外，如果玩家没有靠近任何舞台边缘，那么他应该可以在不移动背景对象的情况下自由移动。\n\
  \n实现这一点的诀窍是设置一个假想的**内部边界**，它是舞台内部一个正好为舞台高度和宽度一半的矩形区域。角色可以在内部边界内自由移动；当它到达边界边缘时，它将停止移动，而背景开始滚动。当背景达到其滚动极限时，一直阻挡玩家前进的内部边界将扩展到舞台的极限，以允许玩家移动到舞台边缘。\n\
  \n你将要创建的内部边界，并不像玩家和背景对象那样是一个真实的对象。相反，它只是定义了这些边界的上、下、左、右的四个数字。实际上，找出这些数字的逻辑与设置真实舞台边界的逻辑完全相同；你只是将它们缩小了一半。\n\
  \n你将分两个阶段构建此代码，以便了解其工作原理。（有关此代码的完整最终工作版本，请参阅本章源代码文件中的 `BetterScrolling.as` 文件。）\n\
  \n1.  你可以创建一个新的 ActionScript 项目，或者修改上一个示例中的代码。以下是整个程序的代码清单；所有新代码都已用粗体文本突出显示。\n\n\
  ```\npackage\n{\n  import flash.display.Sprite;\n  import flash.display.DisplayObject;\n\
  \  import flash.events.KeyboardEvent;\n  import flash.ui.Keyboard;\n  import flash.events.Event;\n\
  \n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\npublic class BetterScrolling extends Sprite\n  {\n    //嵌入背景图像\n    [Embed(source=\"\
  ../images/background.png\")]\n    public var BackgroundImage:Class;\n    public\
  \ var backgroundImage:DisplayObject\n      = new BackgroundImage();\n    public\
  \ var background:Sprite = new Sprite();\n\n    //嵌入角色图像\n    [Embed(source=\"../images/character.png\"\
  )]\n    public var CharacterImage:Class;\n    public var characterImage:DisplayObject\
  \ = new CharacterImage();\n    public var character:Sprite = new Sprite();\n\n \
  \   //创建并初始化 vx 和 vy 变量\n    public var vx:int = 0;\n    public var vy:int = 0;\n\
  \n    //内部边界的变量\n    public var rightInnerBoundary:uint;\n    public var leftInnerBoundary:uint;\n\
  \    public var topInnerBoundary:uint;\n    public var bottomInnerBoundary:uint;\n\
  \npublic function BetterScrolling()\n    {\n      //添加背景\n      background.addChild(backgroundImage);\n\
  \      stage.addChild(background);\n      background.x = -(background.width - stage.stageWidth)\
  \ / 2;\n      background.y = -(background.height - stage.stageHeight) / 2;\n   \
  \   //添加角色\n      character.addChild(characterImage);\n      stage.addChild(character);\n\
  \      character.x = 225;\n      character.y = 150;\n\n      //定义内部边界变量\n      rightInnerBoundary\n\
  \        = (stage.stageWidth / 2) + (stage.stageWidth / 4);\n      leftInnerBoundary\n\
  \        = (stage.stageWidth / 2) - (stage.stageWidth / 4);\n      topInnerBoundary\n\
  \        = (stage.stageHeight / 2) - (stage.stageHeight / 4);\n      bottomInnerBoundary\n\
  \        = (stage.stageHeight / 2) + (stage.stageHeight / 4);\n\n      //添加事件监听器\n\
  \      stage.addEventListener\n        (KeyboardEvent.KEY_DOWN, keyDownHandler);\n\
  \      stage.addEventListener\n        (KeyboardEvent.KEY_UP, keyUpHandler);\n \
  \     stage.addEventListener\n        (Event.ENTER_FRAME, enterFrameHandler);\n\
  \    }\n\n    public function keyDownHandler(event:KeyboardEvent):void\n    {\n\
  \      if (event.keyCode == Keyboard.LEFT)\n      {\n        vx = -5;\n      }\n\
  \      else if (event.keyCode == Keyboard.RIGHT)\n      {\n        vx = 5;\n   \
  \   }\n      else if (event.keyCode == Keyboard.UP)\n      {\n        vy = -5;\n\
  \      }\n      else if (event.keyCode == Keyboard.DOWN)\n      {\n        vy =\
  \ 5;\n      }\n    }\n    public function keyUpHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.LEFT\n        || event.keyCode == Keyboard.RIGHT)\n\
  \      {\n        vx = 0;\n      }\n      else if (event.keyCode == Keyboard.DOWN\n\
  \        || event.keyCode == Keyboard.UP)\n      {\n        vy = 0;\n      }\n \
  \   }\n    public function enterFrameHandler(event:Event):void\n    {\n      //禁用移动背景的代码\n\
  \      //background.x -= vx;\n      //background.y -= vy;\n\n      //移动玩家\n    \
  \  character.x += vx\n      character.y += vy;\n\n      //在内部边界边缘停止角色\n      if(character.x\
  \ < leftInnerBoundary)\n      {\n        character.x = leftInnerBoundary;\n    \
  \    background.x -= vx;\n      }\n      if(character.x + character.width > rightInnerBoundary)\n\
  \      {\n        character.x = rightInnerBoundary - character.width\n        background.x\
  \ -= vx;\n      }\n      if(character.y < topInnerBoundary)\n      {\n        character.y\
  \ = topInnerBoundary;\n        background.y -= vy;\n      }\n      if(character.y\
  \ + character.height  > bottomInnerBoundary)\n      {\n        character.y = bottomInnerBoundary\
  \ - character.height;\n        background.y -= vy;\n      }\n```\n\n\n\n```actionscript\n\
  //检查舞台边界\nif (background.x > 0)\n{\n  background.x = 0;\n}\nif (background.y > 0)\n\
  {\n  background.y = 0;\n}\nif (background.x < stage.stageWidth - background.width)\n\
  {\n  background.x = stage.stageWidth - background.width;\n}\nif(background.y < stage.stageHeight\
  \ - background.height)\n{\n  background.y = stage.stageHeight - background.height;\n\
  }\n```\n\n2.  编译程序，使用方向键移动角色。现在你可以在舞台内部边界内自由移动角色。当角色到达内部边界的边缘时，背景开始滚动，如图 5-14 所示。\n\
  \n![图片](img/9781430239922_Fig05-14.jpg)\n\n**图 5-14.** 角色可在内部边界内自由移动。当角色到达其中一条边缘时，角色停止移动，背景开始滚动。\n\
  \n代码首先通过这四个新变量定义了内部边界。你之前在类定义中声明了这些新变量。\n\n```actionscript\npublic var rightInnerBoundary:uint;\n\
  public var leftInnerBoundary:uint;\npublic var topInnerBoundary:uint;\npublic var\
  \ bottomInnerBoundary:uint;\n```\n\n然后在构造方法中设置它们的值。\n\n```actionscript\nrightInnerBoundary\n\
  \  = (stage.stageWidth / 2) + (stage.stageWidth / 4);\nleftInnerBoundary\n  = (stage.stageWidth\
  \ / 2) - (stage.stageWidth / 4);\ntopInnerBoundary\n  = (stage.stageHeight / 2)\
  \ - (stage.stageHeight / 4);\nbottomInnerBoundary\n  = (stage.stageHeight / 2) +\
  \ (stage.stageHeight / 4);\n```\n\n这是你第一次编写使用除法运算符的代码。它由正斜杠（`/`）字符表示，意为“除以”。\n\n\
  你能理解这些边界是如何计算出来的吗？（试试看，其实并不难！）最终你会得到一个面积为舞台一半大小的内部区域。\n\n以下是 `enterFrameHandler`\
  \ 中真正实现整个系统运转的新增代码：\n\n```actionscript\n//移动玩家\ncharacter.x += vx\ncharacter.y +=\
  \ vy;\n\n//在内部边界边缘停止角色\nif (character.x < leftInnerBoundary)\n{\n  character.x =\
  \ leftInnerBoundary;\n  background.x -= vx;\n}\nelse if (character.x + character.width\
  \ > rightInnerBoundary)\n{\n  character.x = rightInnerBoundary - character.width\n\
  \  background.x -= vx;\n}\nif (character.y < topInnerBoundary)\n{\n  character.y\
  \ = topInnerBoundary;\n  background.y -= vy;\n}\nelse if (character.y + character.height\
  \ > bottomInnerBoundary)\n{\n  character.y = bottomInnerBoundary - character.height;\n\
  \  background.y -= vy;\n}\n```\n\n可以看到，我们再次移动了角色。但它只能在内部边界范围内移动。让我们看看第一个 `if` 语句是如何工作的。\n\
  \n```actionscript\nif (character.x < leftInnerBoundary)\n{\n  character.x = leftInnerBoundary;\n\
  \  background.x -= vx;\n}\n```\n\n条件语句检查玩家的左边缘是否小于左侧内部边界。如果是，则将玩家强制拉回到该边缘。这与之前用于在舞台边缘停止角色的逻辑完全相同。\n\
  \n但下一行代码很有意思。\n\n```actionscript\nbackground.x -= vx;\n```\n\n背景开始移动了！这其实就是全部逻辑。代码非常简洁，但在程序运行时产生的效果却显得相当复杂。\n\
  \n#### 更好的滚动效果\n\n你还有一个问题需要解决。当滚动背景到达极限时，角色仍然无法移动到舞台边缘。为此，你需要临时扩展边界，并在玩家返回舞台中心时将其移回原位。只需在恰当位置添加几行非常简单的代码即可实现。\n\
  \n1.  在 `enterFrameHandler` 中添加以下加粗的行：\n\n```actionscript\npublic function enterFrameHandler(event:Event):void\n\
  {\n  //移动玩家\n  character.x += vx\n  character.y += vy;\n\n  //检查内部边界  \n  if (character.x\
  \ < leftInnerBoundary)\n  {\n    character.x = leftInnerBoundary;\n    rightInnerBoundary\n\
  \      = (stage.stageWidth / 2) + (stage.stageWidth / 4);\n    background.x -= vx;\n\
  \  }\n  else if (character.x + character.width > rightInnerBoundary)\n  {\n    character.x\
  \ = rightInnerBoundary - character.width\n    leftInnerBoundary\n      = (stage.stageWidth\
  \ / 2) - (stage.stageWidth / 4);\n    background.x -= vx;\n  }\n  if (character.y\
  \ < topInnerBoundary)\n  {\n    character.y = topInnerBoundary;\n    bottomInnerBoundary\n\
  \      = (stage.stageHeight / 2) + (stage.stageHeight / 4);\n    background.y -=\
  \ vy;\n  }\n  else if\n  (character.y + character.height > bottomInnerBoundary)\n\
  \  {\n    character.y = bottomInnerBoundary - character.height;\n    topInnerBoundary\n\
  \      = (stage.stageHeight / 2) - (stage.stageHeight / 4);\n    background.y -=\
  \ vy;\n  }\n\n  //检查舞台边界\n  if (background.x > 0)\n  {\n    background.x = 0;\n\
  \    leftInnerBoundary = 0;\n  }\n  else if (background.y > 0)\n  {\n    background.y\
  \ = 0;\n    topInnerBoundary = 0;\n  }\n  else if\n  (background.x < stage.stageWidth\
  \ - background.width)\n  {\n    background.x = stage.stageWidth - background.width;\n\
  \    rightInnerBoundary = stage.stageWidth;\n  }\n  else if\n  (background.y < stage.stageHeight\
  \ - background.height)\n  {\n    background.y = stage.stageHeight - background.height;\n\
  \    bottomInnerBoundary = stage.stageHeight;\n  }\n}\n```\n\n2.  编译程序并尝试运行。现在角色可以探索整个区域，直达舞台边缘。\n\
  \n这段代码的工作原理是：当背景达到其移动极限时，将内部边界扩展到舞台边缘。让我们看看代码中第一个 `if` 语句是如何工作的（新增代码以粗体突出显示）。\n\n\
  ```actionscript\nif (background.x > 0)\n{\n  background.x = 0;\n  leftInnerBoundary\
  \ = 0;\n}\n```\n\n如果你按下左方向键，`background` 对象将持续移动，直到条件语句检测到其达到极限。此时，它会停止 `background`\
  \ 对象的移动，并为 `leftInnerBoundary` 变量赋予一个新值，该值等于舞台左侧的 `x` 值。你知道舞台最左侧的 `x` 位置值为零。这使得角色能够一直移动到舞台边缘。图\
  \ 5-15 展示了其工作原理。\n\n![图片](img/9781430239922_Fig05-15.jpg)\n\n**图 5-15.** 当背景对象停止移动时，边界被扩展，从而允许角色移动到舞台边缘。\n\
  \n问题解决了！但你又制造了另一个问题：如果玩家移回舞台中心，如何才能将边界移回其原始位置？\n\n\n\n不妨这样思考：假设角色已经移动到了舞台的最左侧边缘，如图\
  \ 图 5-15 所示。当它回到舞台中央时，不需要立即移动背景对象，直到角色抵达右侧内边界才需要移动。如果出现这种情况，你就知道可以安全地将左侧内边界重置回初始位置。这就是新增粗体代码行的作用：\n\
  \n```\nelse if (character.x + character.width > rightInnerBoundary)\n{\n  character.x\
  \ = rightInnerBoundary - character.width\n  leftInnerBoundary\n    = (stage.stageWidth\
  \ / 2) - (stage.stageWidth / 4);\n  background.x -= vx;\n}\n```\n\n图 5-16 展示了这一过程。\n\
  \n![图片](img/9781430239922_Fig05-16.jpg)\n\n**图 5-16.** 当角色到达右侧边界时，左侧边界重置到初始位置。\n\
  \n本节添加的其他新代码行，对于其余三个边界都遵循完全相同的逻辑。\n\n你可以在本章源文件的 `EvenBetterScrolling` 文件夹中找到该代码的完整工作示例。\n\
  \n### 进一步探索\n\n通过这些滚动示例，你可以为自己的游戏获得相当多的实用经验。你能想象出的任何类型的滚动系统，都会以某种组合方式使用这些相同的技术。实际上你已经攻克了最难处理的滚动类型——垂直和水平组合滚动，因此如果你需要制作一个仅需水平滚动的游戏，那将是小菜一碟。技术完全相同，只是代码量减半，因为只需要检查\
  \ x 轴上的边界即可。\n\n但这并非关于滚动的最终定论，实际上这只是个开始。审视一些你最喜欢的游戏，仔细观察它们是如何实现滚动的。你会发现其中许多游戏以非常巧妙的方式修改了滚动的时机和方式。然而，所有这些的核心都基于你在本章中看到的示例。\n\
  \n当需要同时滚动背景和前景游戏对象时，情况会变得稍微复杂一些。你将在第 7 章中了解如何实现这一点。\n\n#### 视差滚动\n\n还有一种滚动技术值得一提，因为它应用广泛且效果极其显著：**视差滚动**。\n\
  \n**视差**是一种视觉效果，即物体的位置似乎会随观察视角的改变而发生变化。游戏中的视差滚动效果用于营造浅景深的错觉。这是一种简单的 3D 效果，远处的背景物体移动速度比近处的前景物体慢，从而产生慢速移动物体更远的错觉。视差滚动甚至能给简单的\
  \ 2D 游戏带来非常强烈的视觉冲击。\n\n实现起来非常容易。首先，你需要将背景场景拆分为两张独立的图像。第一张用于远处的物体，比如山脉或云朵。你可以将其命名为\
  \ `distantBackground`。将其高度设为与舞台相同（400 像素），但宽度要很长，比如超过 2000 像素。图 5-17 展示了可能的效果。\n\
  \n![图片](img/9781430239922_Fig05-17.jpg)\n\n**图 5-17.** 用于远处物体的远景背景对象\n\n接下来，你需要一张用于近处物体的图像。你可以将其命名为\
  \ `foreground`。使其尺寸与远景背景完全相同。图 5-18 展示了可能的效果。\n\n![图片](img/9781430239922_Fig05-18.jpg)\n\
  \n**图 5-18.** 用于近处物体的前景对象\n\n将它们都添加到舞台上，居中放置，然后添加你的游戏角色，形成一个场景（图 5-19）。\n\n![图片](img/9781430239922_Fig05-19.jpg)\n\
  \n**图 5-19.** 将两个背景组件与游戏角色一起添加到游戏中。\n\n现在你需要做的只是让 `distantBackground` 对象以比 `foreground`\
  \ 对象更慢的速度移动。你使用的指令可能如下所示：\n\n```\nforeground.x += -vx;\nforeground.y += -vy;\ndistantBackground.x\
  \ += -vx / 2;\ndistantBackground.y += -vy / 2;\n```\n\n当游戏角色移动时，远景背景以前景一半的速度移动，使其看起来仿佛在远处。试试看！效果非常迷人。而且，你也可以毫不费力地添加第三个元素作为极远景背景对象，以更慢的速度移动。\n\
  \n为了帮助你开启自己的视差滚动实验，可以查看本章源文件中的 `ParallaxScrolling` 程序。以下是实现该效果的代码：\n\n```\npackage\n\
  {\n  import flash.display.Sprite;\n  import flash.display.DisplayObject;\n  import\
  \ flash.events.KeyboardEvent;\n  import flash.ui.Keyboard;\n  import flash.events.Event;\n\
  \n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\n  public class ParallaxScrolling extends Sprite\n  {\n    //嵌入远景背景图像\n\
  \    [Embed(source=\"../images/distantBackground.png\")]\n    public var DistantBackgroundImage:Class;\n\
  \    public var distantBackgroundImage:DisplayObject\n      = new DistantBackgroundImage();\n\
  \    public var distantBackground:Sprite = new Sprite();\n\n    //嵌入前景图像\n    [Embed(source=\"\
  ../images/foreground.png\")]\n    public var ForegroundImage:Class;\n    public\
  \ var foregroundImage:DisplayObject\n      = new ForegroundImage();\n    public\
  \ var foreground:Sprite = new Sprite();\n\n    //嵌入角色图像\n    [Embed(source=\"../images/character.png\"\
  )]\n    public var CharacterImage:Class;\n    public var characterImage:DisplayObject\
  \ = new CharacterImage();\n    public var character:Sprite = new Sprite();\n\n \
  \   //创建并初始化 vx 变量\n    public var vx:int = 0;\n\n    //内边界的变量\n    public var rightInnerBoundary:uint;\n\
  \    public var leftInnerBoundary:uint;\n```\n\n\n```actionscript\npublic function\
  \ ParallaxScrolling()\n{\n    //添加远景\n    distantBackground.addChild(distantBackgroundImage);\n\
  \    stage.addChild(distantBackground);\n    distantBackground.x\n        = -(distantBackground.width\
  \ - stage.stageWidth) / 2;\n    distantBackground.y = 0;\n\n    //添加前景\n    foreground.addChild(foregroundImage);\n\
  \    stage.addChild(foreground);\n    foreground.x = -(foreground.width - stage.stageWidth)\
  \ / 2;\n    foreground.y = 0;\n\n    //添加角色\n    character.addChild(characterImage);\n\
  \    stage.addChild(character);\n    character.x = 225;\n    character.y = 290;\n\
  \n    //定义内部边界变量\n    rightInnerBoundary\n        = (stage.stageWidth / 2) + (stage.stageWidth\
  \ / 4);\n    leftInnerBoundary\n        = (stage.stageWidth / 2) - (stage.stageWidth\
  \ / 4);\n\n    //添加事件监听器\n    stage.addEventListener\n        (KeyboardEvent.KEY_DOWN,\
  \ keyDownHandler);\n    stage.addEventListener\n        (KeyboardEvent.KEY_UP, keyUpHandler);\n\
  \    stage.addEventListener\n        (Event.ENTER_FRAME, enterFrameHandler);\n}\n\
  \npublic function keyDownHandler(event:KeyboardEvent):void\n{\n    if (event.keyCode\
  \ == Keyboard.LEFT)\n    {\n        vx = -5;\n    }\n    else if (event.keyCode\
  \ == Keyboard.RIGHT)\n    {\n        vx = 5;\n    }\n}\n\npublic function keyUpHandler(event:KeyboardEvent):void\n\
  {\n    if (event.keyCode == Keyboard.LEFT\n        || event.keyCode == Keyboard.RIGHT)\n\
  \    {\n        vx = 0;\n    }\n}\n\npublic function enterFrameHandler(event:Event):void\n\
  {\n    //移动玩家\n    character.x += vx\n\n    //检查内部边界\n    if (character.x < leftInnerBoundary)\n\
  \    {\n        character.x = leftInnerBoundary;\n        rightInnerBoundary\n \
  \           = (stage.stageWidth / 2) + (stage.stageWidth / 4);\n        distantBackground.x\
  \ -= vx / 2;\n        foreground.x -= vx;\n    }\n    if (character.x + character.width\
  \ > rightInnerBoundary)\n    {\n        character.x = rightInnerBoundary - character.width\n\
  \        leftInnerBoundary\n            = (stage.stageWidth / 2) - (stage.stageWidth\
  \ / 4);\n        distantBackground.x -= vx / 2;\n        foreground.x -= vx;\n \
  \   }\n\n    //检查舞台边界\n    if (foreground.x > 0)\n    {\n        foreground.x =\
  \ 0;\n        distantBackground.x\n            = -(distantBackground.width - stage.stageWidth)\
  \ / 4;\n        leftInnerBoundary = 0;\n    }\n    if (foreground.x < stage.stageWidth\
  \ - foreground.width)\n    {\n        foreground.x = stage.stageWidth - foreground.width;\n\
  \        distantBackground.x\n            = ((distantBackground.width - stage.stageWidth)\
  \ / 4) * -3;\n        rightInnerBoundary = stage.stageWidth;\n    }\n}\n```\n\n\
  这段代码使用了本章介绍的所有技术。不过，相比之前的例子，它的代码量更少，因为滚动只发生在 x 轴上。\n\n其中有段代码需要说明一下。当滚动到达前景左边界的极限时，前景会停止移动。这与你在前一个例子中看到的效果相同。但此时，你还需要让远景也停止移动。由于远景的移动速度是前景的一半，你不能简单地将它的\
  \ x 位置设为零。你需要将其 x 位置设为：负（宽度减去舞台宽度后的四分之一）。\n\n```\nif (foreground.x > 0)\n{\n  foreground.x\
  \ = 0;\n  distantBackground.x\n    = -(distantBackground.width - stage.stageWidth)\
  \ / 4;\n  leftInnerBoundary = 0;\n}\n```\n\n又一个烧脑的问题！不过，或许图 5-20 能帮你理清思路。\n\n![Image](img/9781430239922_Fig05-20.jpg)\n\
  \n**图 5-20.** 由于远景以一半的速度移动，你必须将其 x 位置设为：负（宽度减去舞台宽度后的四分之一）。\n\n左边界也需要同样的处理技巧。\n\n\
  ```\nelse if (foreground.x < stage.stageWidth - foreground.width)\n{\n  foreground.x\
  \ = stage.stageWidth - foreground.width;\n  distantBackground.x\n    = ((distantBackground.width\
  \ - stage.stageWidth) / 4) * -3;\n  rightInnerBoundary = stage.stageWidth;\n}\n\
  ```\n\n别被这些数学计算吓倒。直接使用即可，它确实有效！\n\n### 本章总结\n\n那么，就这些了吗？当然不是！本章让你初步体验了如何设置玩家控制方案，但还有更多可以优化的空间。在本书后续章节中，你将学习如何修改这些模型，将加速度、摩擦力和重力融入角色的移动中。你还将看到一种玩家控制方案，使游戏可以通过鼠标而非键盘来操作。\n\
  \n在本章中，你解决了一些游戏设计中极其重要的问题，这些问题将在后续章节的不同情境中反复出现。你可以自己尝试一下这些技术。准备好了之后，我们第 6 章见。届时，我将向你展示如何利用碰撞检测创建一个对象可以与之交互的环境。\n\
  \n![Image](img/chap.jpg)\n\n# 第 6 章\n\n#### 碰撞检测\n\n欢迎来到一个有趣的章节！在这些篇幅中，你将构建一个充满巧妙游戏设计技巧的互动游乐场，并可以在此基础上扩展，创建完全交互的二维环境，也就是我们常说的动作冒险游戏！从碰撞检测、建造墙壁到拾取和丢弃物体，这里应有尽有。发挥一点想象力，你就能用这些非常简单的技术创作出不同类型的游戏。嘿，恭喜自己：从第一页开始，你已经走了很远！你所有的努力即将得到回报。\n\
  \n在本章末尾，我将介绍 `Collision` 类，这是一个专为本书设计的自定义类。它包含一个专门处理对象间复杂碰撞的方法，你可以将其用于任何游戏项目中。\n\
  \n\n\n### 使用 `hitTestObject` 进行基础碰撞检测\n\n大多数电脑游戏之所以好玩，本质上是它们对现实世界的一种简化模拟。与现实世界一样，游戏中包含一些你可以通过某种方式与之互动的物体。这些物体可能是阻挡你前进的墙壁、帮助你的朋友，或是伤害你的敌人。\n\
  \n要创建这类可互动的物体，首先需要一种方法来检测一个物体是否与另一个物体接触。在电脑游戏编程中，这被称为碰撞检测。碰撞检测只是游戏编程术语，指的是物体相互碰撞时发生的情况。AS3.0\
  \ 提供了一种非常简单的方法来检测物体间的碰撞：`hitTestObject` 方法。\n\n`hitTestObject` 方法能给你带来多么强大的功能，这着实令人惊叹。在接下来的页面示例中，你将了解如何使用它来实现以下功能：\n\
  \n- 更改动态文本框中的文字。\n- 触发状态变化。\n- 减少生命值计量条。\n- 更新分数。\n- 拾取和放下物体。\n\n只要发挥一点想象力，你就能运用这些技巧制作出丰富多样的游戏。\n\
  \n在本章的源文件中，你会找到一个名为 `BasicCollisionDetection` 的项目文件夹，它展示了 `hitTestObject` 的工作方式。编译该项目，你会看到一个类似图\
  \ 6-1 的场景。使用方向键在舞台上移动猫咪角色，观察猫咪撞到怪物时会发生什么。输出文本字段中会显示“Hey!!!”字样。如果你将玩家角色移离敌人，文本字段会再次显示“No\
  \ collision...”。\n\n![Image](img/9781430239922_Fig06-01.jpg)\n\n**图 6-1.** 使用 `hitTestObject`\
  \ 更改文本字段中的文字。\n\n查看实现这一切的代码，对你来说是一次很好的复习机会，可以回顾至今所学的所有概念和技巧。它嵌入并显示了图像，使用了动态文本字段，实现了键盘控制，并将构造器方法中的任务模块化到了三个独立的方法中。你现在应该能理解所有这些代码了，但如果有些地方你还不太明白，那么在接触更复杂的内容之前，现在可能是重新查阅书中相关章节的好时机。\n\
  \n所有这些代码中，只有一种你之前没见过的新技巧：使用 `hitTestObject` 方法。它用于在游戏角色碰撞时更改输出文本字段中的文字。我在下面 `BasicCollisionDetection`\
  \ 程序的代码清单中将其高亮标出。你能弄清楚它是如何工作的吗？\n\n```\npackage\n{\n  import flash.display.Sprite;\n\
  \  import flash.display.DisplayObject;\n  import flash.events.KeyboardEvent;\n \
  \ import flash.ui.Keyboard;\n  import flash.events.Event;\n  import flash.text.*;\n\
  \n  [SWF(width=\"550\", height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"\
  60\")]\n\n  public class BasicCollisionDetection extends Sprite\n  {\n//创建文本对象\n\
  \    public var format:TextFormat = new TextFormat();\n    public var output:TextField\
  \ = new TextField();\n    public var input:TextField = new TextField();\n\n//嵌入角色图像\n\
  \    [Embed(source=\"../images/character.png\")]\n    public var CharacterImage:Class;\n\
  \    public var characterImage:DisplayObject = new CharacterImage();\n    public\
  \ var character:Sprite = new Sprite();\n\n//嵌入怪物图像\n    [Embed(source=\"../images/monsterNormal.png\"\
  )]\n    public var MonsterNormalImage:Class;\n    public var monsterNormalImage:DisplayObject\n\
  \      = new MonsterNormalImage();\n    public var monster:Sprite = new Sprite();\n\
  \n//创建并初始化 vx 和 vy 变量\n    public var vx:int = 0;\n    public var vy:int = 0;\n\n\
  public function BasicCollisionDetection()\n    {\n      setupTextfields();\n   \
  \   createGameObjects();\n      setupEventListeners();\n    }\n    public function\
  \ setupTextfields():void\n    {\n//设置文本格式对象\n      format.font = \"Helvetica\";\n\
  \      format.size = 32;\n      format.color = 0xFF0000;\n      format.align = TextFormatAlign.LEFT;\n\
  \n//配置输出文本字段\n      output.defaultTextFormat = format;\n      output.width = 300;\n\
  \      output.height = 36;\n      output.border = true;\n      output.text = \"\"\
  ;\n\n//显示并定位输出文本字段\n      stage.addChild(output);\n      output.x = 125;\n     \
  \ output.y = 65;\n    }\n    public function createGameObjects():void\n    {\n//将怪物添加到舞台\n\
  \      monster.addChild(monsterNormalImage);\n      stage.addChild(monster);\n \
  \     monster.x = 125;\n      monster.y = 150;\n\n//将角色添加到舞台\n      character.addChild(characterImage);\n\
  \      stage.addChild(character);\n      character.x = 300;\n      character.y =\
  \ 150;\n    }\n    public function setupEventListeners():void\n    {\n      stage.addEventListener\n\
  \        (KeyboardEvent.KEY_DOWN, keyDownHandler);\n      stage.addEventListener\n\
  \        (KeyboardEvent.KEY_UP, keyUpHandler);\n      stage.addEventListener\n \
  \       (Event.ENTER_FRAME, enterFrameHandler);\n    }\n    public function keyDownHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.LEFT)\n      {\n        vx = -5;\n \
  \     }\n      else if (event.keyCode == Keyboard.RIGHT)\n      {\n        vx =\
  \ 5;\n      }\n      else if (event.keyCode == Keyboard.UP)\n      {\n        vy\
  \ = -5;\n      }\n      else if (event.keyCode == Keyboard.DOWN)\n      {\n    \
  \    vy = 5;\n      }\n    }\n    public function keyUpHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.LEFT\n        || event.keyCode == Keyboard.RIGHT)\n\
  \      {\n        vx = 0;\n      }\n      else if (event.keyCode == Keyboard.DOWN\n\
  \        || event.keyCode == Keyboard.UP)\n      {\n        vy = 0;\n      }\n \
  \   }\n    public function enterFrameHandler(event:Event):void\n    {\n//移动玩家\n\
  \      character.x += vx;\n      character.y += vy;\n\n//碰撞检测\nif (character.hitTestObject(monster))\n\
  {\noutput.text = \"Hey!!!\";\n}\nelse\n{\noutput.text = \"No collision...\";\n}\n\
  \    }\n  }\n}\n```\n\n让我们来了解一下 `hitTestObject` 是如何工作的。\n\n\n\n#### 使用 `hitTestObject`\n\
  \n`hitTestObject` 方法可用于检测任意两个对象是否发生碰撞。假设你有一个名为 `car` 的 Sprite 对象，玩家可以控制它；另有一个名为\
  \ `wall` 的 Sprite 对象。在你的游戏中，如果玩家的汽车撞到墙壁，它应该发生碰撞。\n\n用通俗的语言来说，你会想编写类似下面这样的计算机代码：\n\
  \n```\nif (the car hits the wall)\n{\n  the car must crash;\n}\n```\n\n在 AS3.0 代码中，它的实现可能如下所示：\n\
  \n```\nif(car.hitTestObject(wall))\n{\n  car.crash();\n}\n```\n\n`hitTestObject`\
  \ 方法通过点语法附加到 `car` 对象上。它有一个参数 `(wall)`，其中包含了你想要检测碰撞的对象名称。图 6-2 展示了这一切是如何协同工作的。\n\
  \n![Image](img/9781430239922_Fig06-02.jpg)\n\n**图 6-2.** 在条件语句中使用 `hitTestObject`\
  \ 方法来检测两个对象之间的碰撞。\n\n通常，你会在 if 语句的条件表达式中使用 `hitTestObject` 方法。如果对象相互接触，该方法会返回布尔值\
  \ `true`，并执行 if 语句内部的指令。如果返回值为 `false`（即对象未接触），则不会执行 if 语句内部的指令。\n\n以下是在 BasicCollisionDetection\
  \ 程序中更改输出字段文本显示的代码片段：\n\n```\npublic function enterFrameHandler(event:Event):void\n\
  {\n  //移动玩家\n  character.x += vx;\n  character.y += vy;\n\n  //碰撞检测\n  if (character.hitTestObject(monster))\n\
  \  {\n    output.text = \"嘿!!!\";\n  }\n  else\n  {\n    output.text = \"无碰撞...\"\
  ;\n  }\n}\n```\n\n它非常简单，只是检查两个对象是否接触。如果接触，则在 `output` 文本字段中显示“嘿!!!”。如果没有接触，则显示“无碰撞…”字样。\n\
  \n非常重要的是，请注意这个 `hitTestObject` if 语句位于 `enterFrameHandler` 内部。这意味着程序会以每秒 60 次的频率检查碰撞。这就是为啥当猫和怪物接触时，显示内容会立刻变化；而当它们不接触时，又会立刻恢复的原因。`hitTestObject`\
  \ 几乎总是在 `enterFrameHandler` 内部使用。\n\n仅仅几行代码就能产生如此强大的效果，是不是很神奇？而且还有更棒的！\n\n### 触发状态变更\n\
  \n你可以在检测碰撞的 if 语句内部放置任意所需的指令。在接下来的示例中，当碰撞发生时，怪物的外观会发生改变。我们先来看看效果，然后再为你解释其工作原理。\n\
  \n打开本章源文件中的 StateChange 项目。编译并运行项目，观察当对象碰撞时会发生什么：怪物会张开它的嘴。图 6-3 展示了你将看到的效果。\n\n\
  ![Image](img/9781430239922_Fig06-03.jpg)\n\n**图 6-3.** 当猫撞到怪物时，怪物会张开嘴。\n\n以下是实现这一功能的程序清单。请注意，这里有两张不同的怪物图像被添加到了同一个\
  \ Sprite 对象中。这听起来是否耳熟？没错！（提示：回想一下第 3 章中的按钮！）\n\n```\npackage\n{\n  import flash.display.Sprite;\n\
  \  import flash.display.DisplayObject;\n  import flash.events.KeyboardEvent;\n \
  \ import flash.ui.Keyboard;\n  import flash.events.Event;\n\n  [SWF(width=\"550\"\
  , height=\"400\",\n    backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n  public\
  \ class StateChange extends Sprite\n  {\n    //嵌入角色图像\n    [Embed(source=\"../images/character.png\"\
  )]\n    public var CharacterImage:Class;\n    public var characterImage:DisplayObject\
  \ = new CharacterImage();\n    public var character:Sprite = new Sprite();\n\n \
  \   //嵌入怪物图像\n    [Embed(source=\"../images/monsterNormal.png\")]\n    public var\
  \ MonsterNormalImage:Class;\n    public var monsterNormalImage:DisplayObject\n \
  \     = new MonsterNormalImage();\n    [Embed(source=\"../images/monsterScared.png\"\
  )]\n    public var MonsterScaredImage:Class;\n    public var monsterScaredImage:DisplayObject\n\
  \      = new MonsterScaredImage();\n    public var monster:Sprite = new Sprite();\n\
  \n    //创建并初始化 vx 和 vy 变量\n    public var vx:int = 0;\n    public var vy:int = 0;\n\
  \n    public function StateChange()\n    {\n      createGameObjects();\n      setupEventListeners();\n\
  \    }\n    public function createGameObjects():void\n    {\n      //组合怪物并将其添加到舞台\n\
  \      monster.addChild(monsterNormalImage);\n      monster.addChild(monsterScaredImage);\n\
  \      monsterScaredImage.visible = false;\n      stage.addChild(monster);\n   \
  \   monster.x = 125;\n      monster.y = 150;\n\n      //将角色添加到舞台\n      character.addChild(characterImage);\n\
  \      stage.addChild(character);\n      character.x = 300;\n      character.y =\
  \ 150;\n    }\n    public function setupEventListeners():void\n    {\n      stage.addEventListener\n\
  \        (KeyboardEvent.KEY_DOWN, keyDownHandler);\n      stage.addEventListener\n\
  \        (KeyboardEvent.KEY_UP, keyUpHandler);\n      stage.addEventListener\n \
  \       (Event.ENTER_FRAME, enterFrameHandler);\n    }\n    public function keyDownHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.LEFT)\n      {\n        vx = -5;\n \
  \     }\n      else if (event.keyCode == Keyboard.RIGHT)\n      {\n        vx =\
  \ 5;\n      }\n      else if (event.keyCode == Keyboard.UP)\n      {\n        vy\
  \ = -5;\n      }\n      else if (event.keyCode == Keyboard.DOWN)\n      {\n    \
  \    vy = 5;\n      }\n    }\n    public function keyUpHandler(event:KeyboardEvent):void\n\
  \    {\n      if (event.keyCode == Keyboard.LEFT\n        || event.keyCode == Keyboard.RIGHT)\n\
  \      {\n        vx = 0;\n      }\n      else if (event.keyCode == Keyboard.DOWN\n\
  \        || event.keyCode == Keyboard.UP)\n      {\n        vy = 0;\n      }\n \
  \   }\n    public function enterFrameHandler(event:Event):void\n    {\n      //移动玩家\n\
  \      character.x += vx;\n      character.y += vy;\n```\n\n```actionscript\n//碰撞检测\n\
  if (character.hitTestObject(monster))\n{\n  monsterScaredImage.visible = true;\n\
  \  monsterNormalImage.visible = false;\n}\nelse\n{\n  monsterScaredImage.visible\
  \ = false;\n  monsterNormalImage.visible = true;\n}\n}\n}\n```\n\n首先你会注意到，程序里嵌入了两种不同的怪物图片：`monsterNormal.png`\
  \ 和 `monsterScared.png`。图 6-4 展示了它们的样子。这两张图片尺寸完全相同——唯一的区别在于怪物的嘴巴。\n\n![图片](img/9781430239922_Fig06-04.jpg)\n\
  \n**图 6-4.** 怪物的两种不同状态\n\n以下是嵌入这些图片并创建怪物精灵（Sprite）的代码。\n\n```actionscript\n[Embed(source=\"\
  ../images/monsterNormal.png\")]\npublic var MonsterNormalImage:Class;\npublic var\
  \ monsterNormalImage:DisplayObject\n  = new MonsterNormalImage();\n\n[Embed(source=\"\
  ../images/monsterScared.png\")]\npublic var MonsterScaredImage:Class;\npublic var\
  \ monsterScaredImage:DisplayObject\n  = new MonsterScaredImage();\n\npublic var\
  \ monster:Sprite = new Sprite();\n```\n\n同样要注意的是，即使创建了两张图片，也只有一个怪物精灵（`monster` Sprite）。这套机制的关键在于**两张图片都被添加到了同一个精灵中**。不过，程序启动时只有\
  \ `monsterNormal` 图片是可见的。以下是将两张图片组合成怪物精灵（`monster` Sprite）的代码：\n\n```actionscript\n\
  monster.addChild(monsterNormalImage);\nmonster.addChild(monsterScaredImage);\nmonsterScaredImage.visible\
  \ = false;\nstage.addChild(monster);\n```\n\n`monsterScared` 图片的 `visible` 属性被设为\
  \ `false`，因此它是隐藏的。这与你在第 3 章中创建不同按钮状态时使用的技术完全相同。怪物精灵（`monster` Sprite）包含两张完美对齐、上下重叠的图片，就像叠放的扑克牌。但在任何时刻，只有其中一张图片是可见的。通过选择性地显示其中一张图片，你就能让怪物改变外貌。\n\
  \n游戏中你选择的任何条件都可以触发怪物外貌的变化。在这个例子中，当两个角色碰撞时就会发生。下面是使用 `hitTestObject` 实现此功能的 `if`\
  \ 语句：\n\n```actionscript\nif (character.hitTestObject(monster))\n{\n  monsterScaredImage.visible\
  \ = true;\n  monsterNormalImage.visible = false;\n}\nelse\n{\n  monsterScaredImage.visible\
  \ = false;\n  monsterNormalImage.visible = true;\n}\n```\n\n这个 `if` 语句根据猫和怪物是否接触，来隐藏其中一张图片。这是一个极其简单但极其有用的效果。\n\
  \n你可以用同样的技术来创建具有非常复杂状态的游戏对象。想象你有一个包含 10 或 20 张不同图片的对象。你可以根据游戏中事件的变化来选择性地显示这些图片。这是创建复杂游戏的基础，而这一切都源于这个简单的技巧。\n\
  \n#### 减少生命值条\n\n许多游戏使用**生命值条**来决定游戏何时结束。当游戏角色撞到像怪物这样的坏东西时，生命值条会逐渐缩小。当生命值条消失时，游戏结束。\n\
  \n实现生命值条非常简单。它巧妙地利用了 `width` 属性。你可以在本章源文件的 `HealthMeter` 项目文件夹中找到生命值条运行的示例。编译程序，你会看到图\
  \ 6-5 所示的效果。当游戏角色碰撞时，生命值条会减少。当它完全减到零时，会通过跟踪输出显示“游戏结束”。\n\n![图片](img/9781430239922_Fig06-05.jpg)\n\
  \n**图 6-5.** 物体碰撞时减少生命值条。\n\n生命值条由两张独立的图片组成：`meterInside.png` 和 `meterOutside.png`。它们尺寸和宽度相同（200\
  \ x 28 像素）。图 6-6 展示了它们的样子。\n\n![图片](img/9781430239922_Fig06-06.jpg)\n\n**图 6-6.**\
  \ 构成生命值条的两张图片\n\n非常重要的一点是，`meterOutside` 的 PNG 图片内部是透明的。它只是一个黑色的边框。这意味着它后面的任何东西都会透出来。\n\
  \n这两张图片被组合到一个精灵（Sprite）中。这与你在上一个例子中用两个状态创建怪物对象（`monster`）的概念相同。这次唯一不同的是，内部和外部这两张图片是同时可见的。\n\
  \n这个程序的大部分代码与前面两个例子的代码几乎相同，所以我们来看看不同之处。首先，两张图片都被嵌入到程序中。\n\n```actionscript\n[Embed(source=\"\
  ../images/meterInside.png\")]\npublic var MeterInsideImage:Class;\npublic var meterInsideImage:DisplayObject\n\
  \  = new MeterInsideImage();\n\n[Embed(source=\"../images/meterOutside.png\")]\n\
  public var MeterOutsideImage:Class;\npublic var meterOutsideImage:DisplayObject\n\
  \  = new MeterOutsideImage();\n\npublic var meter:Sprite = new Sprite();\n```\n\n\
  一个名为 `meter` 的单个精灵对象将被用来组合它们。这发生在 `createGameObjects` 方法初始化程序时。\n\n```actionscript\n\
  meter.addChild(meterInsideImage);\nmeter.addChild(meterOutsideImage);\nstage.addChild(meter);\n\
  meter.x = 125;\nmeter.y = 65;\n```\n\n外部图片在内部图片之后添加，这样它就会覆盖在内部图片之上，完美地将它框起来。\n\n\
  `enterFrameHandler` 包含碰撞代码并显示“游戏结束”消息。\n\n```actionscript\npublic function enterFrameHandler(event:Event):void\n\
  {\n  //移动玩家\n  character.x += vx;\n  character.y += vy;\n\n  //碰撞检测\n  if (character.hitTestObject(monster))\n\
  \  {\n    if(meterInsideImage.width > 0)\n    {\n      meterInsideImage.width--;\n\
  \    }\n  }\n  if(meterInsideImage.width < 1)\n  {\n    trace(\"Game over\");\n\
  \  }\n}\n```\n\n第一个 `if` 语句检查碰撞。如果发现碰撞，它会每帧将生命值条的宽度减少 1 像素。但它还进行了一个额外的检查。只有当宽度大于零时，它才会减少宽度。这可以防止宽度变为负数——如果没有这个额外检查，就会发生这种情况。\n\
  \n```actionscript\nif (character.hitTestObject(monster))\n{\n  if(meterInsideImage.width\
  \ > 0)\n  {\n    meterInsideImage.width--;\n  }\n}\n```\n\n在这个简单的例子中，防止生命值条宽度变为负数其实并非必要。但在一个复杂的游戏程序中，你可能会有其他依赖于生命值条宽度值的代码，如果代码未预期到负数值，游戏可能会产生错误。\n\
  \n这是你第一次看到在一个 `if` 语句内部使用另一个 `if` 语句。这被称为**嵌套 if 语句**，是一种非常常见的编程结构。嵌套的 `if` 语句允许你在第一个条件通过（为真）后，对逻辑进行微调以检查其他条件。（之所以叫嵌套\
  \ `if` 语句，是因为它舒适地嵌在第一个语句里面，就像巢里的蛋。如果你把这一页侧过来看，我确信你能想象出一只乌鸦或喜鹊在第二个 `if` 语句形成的缩进里筑一个非常舒适的巢。）\n\
  \n`enterFrameHandler` 在发现生命值条宽度小于 1 像素时，也会显示一条跟踪消息“游戏结束”。\n\n```actionscript\nif(meterInsideImage.width\
  \ < 1)\n{\n  trace(\"Game over\");\n}\n```\n\n在一个像样的游戏中，你可以改为在文本字段中显示“游戏结束”。或者，你也可以在舞台上方显示整个游戏结束的图片，并提供一个让玩家重新开始的按钮。\n\
  ```\n\n\n#### 使用 `scaleX` 按百分比缩放计量器\n\n你也可以使用 `scaleX` 属性来改变计量器的大小。`scaleX` 根据对象的比例改变其尺寸。它允许你基于百分比而非固定像素值来调整计量器的宽度。这种方式通常更可取，因为无论计量器长短如何，它都会以相同的比例缩减。\n\
  \n`scaleX` 值为 `1` 时表示对象为原始大小。你可以通过每帧将 `scaleX` 属性减去 `0.01` 来将计量器缩小 1%。\n\n如果你想用\
  \ `scaleX` 复制健康计量器的示例，可以使用以下代码：\n\n```\nif (character.hitTestObject(monster))\n\
  {\n  if(meterInsideImage.scaleX > 0)\n  {\n    meterInsideImage.scaleX -= 0.02;\n\
  \  }\n}\nif(meterInsideImage.scaleX <= 0)\n{\n  trace(\"Game over\");\n}\n```\n\n\
  值为 `0.02` 时，每帧将计量器缩小 2%，因此计量器将在 50 帧后缩小至 `0`。\n\n按百分比缩放非常有用，因为你可以用计量器来图表化游戏中可能使用百分比的其他数据。\n\
  \n#### 更新分数\n\n大多数游戏通过根据玩家表现更新分数来追踪胜负。以下示例展示了如何更新分数，并在达到特定分数时结束游戏。打开本章源文件中的 `UpdateScore`\
  \ 项目文件夹并尝试运行。每次猫撞到怪物时，分数增加 1。当分数达到 `5` 时，会显示一条“Game over”跟踪信息。图 6-7 展示了你将看到的内容。\n\
  \n![图片](img/9781430239922_Fig06-07.jpg)\n\n**图 6-7.** 使用碰撞检测来增加分数。\n\n这段代码需要解决一个问题。请记住，碰撞检测代码运行在\
  \ `enterFrameHandler` 内部。`enterFrameHandler` 每秒更新 60 次。如果发生碰撞，所有碰撞代码也会被每秒触发 60 次。如果该代码的任务是在碰撞发生时更新分数，那么分数将每秒更新\
  \ 60 次，直到对象不再接触。\n\n这意味着什么？如果碰撞代码每帧将分数更新 `1`，那么超过 3 秒后分数将激增至 `180`。你可以从之前的示例中看到这种效果：当对象接触时，健康计量器每帧持续减少。\n\
  \n这不是更新分数的正确方式。分数应该只在对象首次接触时更新一次，即使它们保持接触，也不应再次更新。你必须找到一种方法，检测首次碰撞，然后阻止第二次碰撞被记录——直到对象分离。\n\
  \n你可以使用一个布尔变量来实现这一点，该变量根据我刚刚描述的条件打开或关闭碰撞检测。以下是实现这一功能的关键代码。首先，你需要在类定义中创建两个新变量。\n\n\
  ```\npublic var score:uint = 0;\npublic var collisionHasOccurred:Boolean = false;\n\
  ```\n\n`score` 是一个数字，用于追踪两个对象碰撞的次数。游戏开始时它被设为 0。`collisionHasOccurred` 负责追踪是否已经发生过碰撞。程序启动时它被设为\
  \ `false`。如果发生碰撞，它会被设为 `true`，以防止检测到第二次碰撞。这个变量对于评分系统的正常工作至关重要，接下来你将看到原因。\n\n`enterFrameHandler`\
  \ 负责移动角色、检测碰撞、更新分数以及检查游戏是否结束。以下是 `enterFrameHandler` 中的全部代码：\n\n```\npublic function\
  \ enterFrameHandler(event:Event):void\n{\n  //移动玩家\n  character.x += vx;\n  character.y\
  \ += vy;\n\n  //碰撞检测\n  if (character.hitTestObject(monster))\n  {\n    if(! collisionHasOccurred)\n\
  \    {\n      score++;\n      output.text = String(score);\n      collisionHasOccurred\
  \ = true;\n    }\n  }\n  else\n  {\n    collisionHasOccurred = false;\n  }\n\n \
  \ //检查游戏是否结束\n  if(score == 5)\n  {\n    trace(\"Game over\");\n  }\n}\n```\n\n\
  让我们分解这段代码，看看发生了什么以及为什么。首先，代码检查角色与怪物之间是否有碰撞。\n\n```\nif (character.hitTestObject(monster))\n\
  {...\n```\n\n如果有碰撞，下一个 `if` 语句检查对象之间的碰撞*是否尚未发生*。没错，你没有误读上一句；我们想要检查碰撞是否*尚未*发生。这就是这行代码的作用：\n\
  \n```\nif(!collisionHasOccurred)\n{...\n```\n\n\n\n\n它会检查 `collisionHasOccurred`\
  \ 变量是否为 `false`。通常，条件语句会检查某些条件或变量是否为真，但这次不同。相反，你使用了非运算符来检查 `false` 条件。非运算符是一个感叹号（`!`）。当它用于布尔变量前的条件语句中时，它会使得\
  \ `if` 语句内部的指令能够执行，如同该布尔值为 `false` 一样。\n\n那么，它真的是 `false` 吗？在程序启动时，你将 `collisionHasOccurred`\
  \ 初始化为 `false`，因此当第一次碰撞发生时，它的值为 `false`，`if` 语句内部的所有指令都会执行。\n\n```\nscore++;\noutput.text\
  \ = String(score);\ncollisionHasOccurred = true;\n```\n\n这行代码会更新分数和动态文本框，但它还做了一件非常重要的事：它将\
  \ `collisionHasOccurred` 变量设为 `true`。\n\n为什么这很重要？请记住，所有这些代码都运行在 `enterFrameHandler`\
  \ 内部。这意味着如果物体仍然接触，在恰好 1/60 秒后，同一个 `if` 语句将*第二次*被调用。\n\n```\nif(!collisionHasOccurred)\n\
  {\n  score++;\n  output.text = String(score);\n  collisionHasOccurred = true;\n\
  }\n```\n\n你希望这段代码只运行一次，因为你只希望对象首次接触时更新分数。幸运的是，当这段代码第一次运行时，`collisionHasOccurred`\
  \ 变量已被设为 `true`，因此它会阻止代码第二次运行。这意味着没有任何指令被执行，分数和文本框只更新一次。\n\n完美——这正是你想要的！\n\n但还有另一个问题。你希望在物体分离并在游戏后续时刻再次碰撞时，分数*再次*更新。如果\
  \ `collisionHasOccurred` 仍然设为 `true`，这种情况就不会发生。你必须设法将其重置为 `false`，以便在未来的碰撞中更新分数。\n\
  \n这非常简单；你只需在物体*未碰撞*时将 `collisionHasOccurred` 设为 `false`。`if/else` 语句的第二部分负责处理这个问题，如下面加粗的代码所示：\n\
  \n```\nif (character.hitTestObject(monster))\n{\n  if(! collisionHasOccurred)\n\
  \  {\n    score++;\n    output.text = String(score);\n    collisionHasOccurred =\
  \ true;\n  }\n}\nelse\n{\ncollisionHasOccurred = false;\n}\n```\n\n是的，我知道你在想什么。如果你是编程新手，这种逻辑可能会让你觉得有点烧脑！这是到目前为止你见过的关于逻辑运算符和\
  \ `if` 语句最复杂的用法。如果你不能立刻理解，或者觉得自己短时间内写不出同样复杂的代码，也不要太灰心。多看几遍，晚上躺在床上时琢磨一下，过几天再回来看，并在自己的游戏中尝试使用。它会慢慢变得清晰——相信我！观察他人如何解决问题，然后在自己的游戏中尝试这些解决方案，是学习编程极为重要的一环。为了帮助你理解，图\
  \ 6-8 展示了实际流程。\n\n![图片](img/9781430239922_Fig06-08.jpg)\n\n**图 6-8.** 防止分数在一次碰撞中重复更新。\n\
  \n*这段代码也展示了类型转换的另一个例子。你回想一下，类型转换是一种将一种变量类型转换为另一种的系统。*\n\n*`score` 变量被声明为 uint 数字类型。*\n\
  \n*`public var score:uint = 0;`*\n\n*你需要 `score` 变量是数字类型，以便每次碰撞时通过加 1 来更新它，如下所示：*\n\
  \n*`score++;`*\n\n*因此分数可能是 1、5、14 或任何数字，取决于物体碰撞的次数。当需要将这个数字显示在文本框中时，问题就出现了。`TextField`\
  \ 对象只能以字符串（字母或单词）形式显示信息。这意味着你需要将 `score` 变量的值转换为文本字段可以显示的字符串字符。这就是类型转换发挥作用的地方。你的代码可以强制将\
  \ `score` 变量作为字符串读取，如下所示：*\n\n*`String(score)`*\n\n*现在，`score` 的值就可以直接在 `output`\
  \ 文本框中显示了，如下所示：*\n\n*`output.text = String(score);`*\n\n##### 检查游戏是否结束\n\n`score`\
  \ 变量也用于判断游戏何时结束。`enterFrameHandler` 内部一个非常简单的 `if` 语句会在分数达到 5 时显示一条追踪消息。\n\n```\n\
  if(score == 5)\n{\n  trace(\"Game over\");\n}\n```\n\n但你会很快发现这个系统有一个问题。在分数达到 5 之后，程序仍在继续给分数加\
  \ 1 并显示“Game over”消息，如图 6-9 所示。为了正确工作，当分数达到 5 时，程序应该停止计算碰撞次数，而且“Game over”消息应该只显示一次。\n\
  \n![图片](img/9781430239922_Fig06-09.jpg)\n\n**图 6-9.** 程序应该在分数达到 5 时停止计算碰撞，但它没有。\n\
  \n你可以通过应用一些简单的逻辑轻松解决这个问题。\n\n*只有当分数小于 5 时才检查碰撞。*\n\n你知道该怎么做！只需用另一个 `if` 语句包围碰撞检测代码，如下所示：\n\
  \n```\nif(score < 5)\n{\n  if (character.hitTestObject(monster))\n  {\n    if(!\
  \ collisionHasOccurred)\n    {\n      score++;\n      output.text = String(score);\n\
  \      collisionHasOccurred = true;\n    }\n  }\n  else\n  {\n    collisionHasOccurred\
  \ = false;\n  }\n\n  //检查游戏是否结束\n  if(score == 5)\n  {\n    trace(\"Game over\"\
  );\n  }\n}\n```\n\n用这段新代码重新编译程序，你会注意到分数现在在达到 5 时停止累加，并且“Game over”消息只显示一次。图 6-10\
  \ 说明了这一点。\n\n![图片](img/9781430239922_Fig06-10.jpg)\n\n**图 6-10.** 再添加一个简单的 `if`\
  \ 语句，当分数达到 5 时游戏结束。\n\n你会发现，在游戏中需要解决的许多“可能令人困惑的编程问题”（Potentially Puzzling Programming\
  \ Problems），都可以通过应用像这样非常简单的逻辑来解决。\n\n\n\n\n### 拾取和放下物体\n\n现在是时候让猫和怪物放下分歧、和平相处了！在接下来的例子中，你将看到如何让猫拾取一个物体并将其带给怪物。使用本章迄今讨论的技术，这非常容易实现。\n\
  \n你可以在本章源文件的`PickingUpObjects`文件夹中找到这个效果的工作示例。将猫角色移动到星星上方，按下空格键，猫会拾取星星。将星星带到怪物处，再次按下空格键，猫会放下星星，并且会在跟踪消息中显示“Thanks!!”。图\
  \ 6-11 展示了这一过程。\n\n![Image](img/9781430239922_Fig06-11.jpg)\n\n**图 6-11.** 拾取星星并将其带给怪物\n\
  \n该程序使用一个名为`characterHasStar`的布尔变量来确定猫是否正在携带星星。它在类定义中创建时被初始化为`false`。\n\n`public\
  \ var characterHasStar:Boolean = false;`\n\n你可能会认为`enterFrameHandler`现在是让游戏中发生有趣事情的主角。毕竟，过去\
  \ 40 多页中展示的大多数新技术都涉及在其中放置指令。但别忘了，你还有几个同样有用但有些被忽视的方法，如果你能为它们找到用武之地，它们随时准备听候差遣。这一次，`keyDownHandler`将闪耀登场。下面加粗的文本突出显示了`keyDownHandler`中使该程序运行的代码。\n\
  \n```\npublic function keyDownHandler(event:KeyboardEvent):void\n{\n  if (event.keyCode\
  \ == Keyboard.LEFT)\n  {\n    vx = -5;\n  }\n  else if (event.keyCode == Keyboard.RIGHT)\n\
  \  {\n    vx = 5;\n  }\n  else if (event.keyCode == Keyboard.UP)\n  {\n    vy =\
  \ -5;\n  }\n  else if (event.keyCode == Keyboard.DOWN)\n  {\n    vy = 5;\n  }\n\n\
  \  if (event.keyCode == Keyboard.SPACE\n  && character.hitTestObject(star))\n  {\n\
  \    if (!characterHasStar)\n    {\n      character.addChild(star);\n      star.x\
  \ = 0;\n      star.y = 0;\n      characterHasStar = true;\n    }\n    else\n   \
  \ {\n      stage.addChild(star);\n      star.x = character.x;\n      star.y = character.y;\n\
  \      characterHasStar = false;\n      if (monster.hitTestObject(star))\n     \
  \ {\n        trace(\"Thanks!!\");\n      }\n    }\n  }\n}\n```\n\n要理解这是如何工作的，请思考在玩家角色能够拾取或放下星星之前，需要满足哪些条件。\n\
  \n- 游戏玩家需要按下空格键。你可以通过如下条件语句检查这个条件：\n\n```\nif(event.keyCode == Keyboard.SPACE)\n\
  ```\n\n- 角色对象需要接触到星星。你可以通过如下条件语句检查这个条件：\n\n```\nif(character.hitTestObject(star))\n\
  ```\n\n如果这两件事同时发生，你就知道玩家要么试图拾取星星，要么试图放下星星。但重要的是，**这两个条件必须同时成立**。为什么？嗯，很明显，如果猫没有碰到星星，它就不能拾取星星。游戏还需要知道玩家*想要*拾取物体，而按下空格键正是告诉它这一点。\n\
  \n要检查两个条件是否同时成立，你可以使用**与运算符**将它们组合成一个条件语句。你在第 3 章中简要了解过与运算符，但直到现在你才真正看到它的实际应用。与运算符是一个双与符号（`&&`）。\n\
  \n它在这行代码的第一个新`if`语句中被使用：\n\n```if (event.keyCode == Keyboard.SPACE\n&& character.hitTestObject(star))\n\
  {…}\n```\n\n太好了！在一行代码中，你就可以检查拾取或放下物体的条件是否都已满足。但是究竟是哪一个呢？拾取还是放下？\n\n这很容易判断。如果这两个条件都为真，并且猫还没有拿到星星，你就知道需要拾取星星。如果猫已经拿到了星星，你就知道应该放下星星。这只需要一个额外的嵌套`if/else`语句来检查`characterHasStar`变量是否为`false`。以下是这个逻辑的简化版本：\n\
  \n```\nif (the character doesn't have the star)\n{\n   Pick the star up…\n}\nelse\n\
  {\n   Drop the star…\n}\n```\n\n请记住这一点，因为实际代码如下所示：\n\n```\nif (!characterHasStar)\n\
  {\n  character.addChild(star);\n  star.x = 0;\n  star.y = 0;\n  characterHasStar\
  \ = true;\n}\nelse\n{\n  stage.addChild(star);\n  star.x = character.x;\n  star.y\
  \ = character.y;\n  characterHasStar = false;\n  if (monster.hitTestObject(star))\n\
  \  {\n    trace(\"Thanks!!\");\n  }\n}\n```\n\n现在是不是稍微明白一些了？图 6-12 展示了所有这些逻辑是如何转化为代码的。\n\
  \n![Image](img/9781430239922_Fig06-12.jpg)\n\n**图 6-12.** 拾取和放下星星的代码\n\n但代码实际上是如何拾取和放下物体的呢？首先，让我们看看拾取星星的指令。\n\
  \n```\ncharacter.addChild(star);\nstar.x = 0;\nstar.y = 0;\ncharacterHasStar = true;\n\
  ```\n\n代码使用`addChild`方法将星星设为角色的**子对象**。\n\n```\ncharacter.addChild(star);\n```\n\
  \n这与您用来将多个图像添加到单个`Sprite` 的技术相同。这里，您将星星`Sprite`添加到角色`Sprite`。这基本上将星星粘在了角色身上。所以，就像一只小鸭子，无论猫去哪里，星星都紧随其后。\n\
  \n然后代码将星星的`x`和`y`位置设为`0`。\n\n```\nstar.x = 0;\nstar.y = 0;\n```\n\n因为星星刚刚成为角色的子对象，它现在使用角色`Sprite`的内部坐标系，而不是舞台的坐标系。`x`和`y`位置为`0`意味着它被定位在角色的左上角，在角色`Sprite`内部。图\
  \ 6-13 说明了这一点。\n\n![Image](img/9781430239922_Fig06-13.jpg)\n\n**图 6-13.** 当星星成为角色的子对象时，它成为角色局部坐标系的一部分。\n\
  \n你现在给星星的任何`x`和`y`位置都将引用角色`Sprite`*内部*的这些坐标。\n\n最后一件事是将`characterHasStar`变量设为`true`，这可以防止程序在角色已经拥有星星的情况下再次尝试拾取它。\n\
  \n```\ncharacterHasStar = true;\n```\n\n放下星星的指令同样简单明了。\n\n```\nstage.addChild(star);\n\
  star.x = character.x;\nstar.y = character.y;\ncharacterHasStar = false;\nif (monster.hitTestObject(star))\n\
  {\n  trace(\"Thanks!!\");\n}\n```\n\n代码首先使用`addChild`方法再次将星星设为舞台的子对象。这使它从猫的束缚中解放出来。\n\
  \n```\nstage.addChild(star);\n```\n\n星星现在再次成为舞台坐标系的一部分，而不是角色`Sprite`的坐标系。\n\n`stage`对象是舞台上*所有*对象的父对象，包括`character`和`monster`。作为舞台子对象的对象处于食物链的顶端，自由自在。星星现在不再需要盲目地跟随角色，可以随心所欲地惹上它自己的麻烦了。\n\
  \n接下来，代码为星星赋予与角色相同的`x`和`y`位置。\n\n```\nstar.x = character.x;\nstar.y = character.y;\n\
  ```\n\n这将星星固定在舞台上的当前位置，使其看起来像是被放下了。\n\n`characterHasStar`变量被设为`false`，允许角色稍后再次拾取星星。\n\
  \n```\ncharacterHasStar = false;\n```\n\n最后，代码实际上还做了一点额外的工作。它添加了以下`if`语句：\n\n```\n\
  if (monster.hitTestObject(star))\n{\n  trace(\"Thanks!!\");\n}\n```\n\n\n\n它检查怪物是否碰到了星星。如果是，会显示跟踪消息“Thanks!!”。啊……终于有朋友了！（你可以在本章源文件的`PickingUpObjects`文件夹中找到这个示例的完整代码。）\n\
  \n### 关于`hitTestObject`的坏消息\n\n首先，请允许我说：我非常喜欢`hitTestObject`方法！从这些示例中你可以看到，仅用几行代码、一点想象力和一点简单的逻辑，它就能给你带来巨大的能力。我相信你的脑海里肯定已经充满了各种游戏创意。如果你还有任何疑虑，我现在就向你确认：是的，你已经拥有了开始制作它们所需的所有技能！我不会阻止你。去吧，如果你感到灵感迸发，可以先暂停阅读本章，开始动手构建游戏。无限可能的世界在等着你！\n\
  \n但在你继续深入阅读本书之前，让我们更仔细地看看`hitTestObject`的工作原理。亲爱的读者，这一点必须说明：`hitTestObject`隐藏着一个深暗的秘密，如果你不理解它，它将会拖垮你的游戏。\n\
  \n#### 检测边界框碰撞\n\nAS3.0 是如何知道两个物体正在接触的呢？所有显示对象（你可以在舞台上看到的对象）都被一个假想的矩形框包围，这个框被称为**边界框**。边界框定义了`hitTestObject`检查碰撞的对象区域。边界框是看不见的，但它确实存在。图\
  \ 6-14 展示了上一个示例中对象的边界框。\n\n![Image](img/9781430239922_Fig06-14.jpg)\n\n**图 6-14.**\
  \ 边界框定义了对象对碰撞敏感的区域。\n\n每当一个边界框的任何部分与另一个对象的边界框的任何部分相交时，就会检测到碰撞。图 6-15 展示了一些示例。\n\n\
  ![Image](img/9781430239922_Fig06-15.jpg)\n\n**图 6-15.** 当边界框接触或相交时，就会检测到碰撞。\n\n\
  如果物体是方形的或矩形的，这完全没问题，但如果它们不是呢？仔细看看图 6-15：其中一个碰撞与其他不同！第三个碰撞的边界框重叠了，即使实际的物体本身并没有接触。你可以在图\
  \ 6-16 中清晰地看到这一点。\n\n![Image](img/9781430239922_Fig06-16.jpg)\n\n**图 6-16.** 即使表示物体形状的图像没有接触，边界框也会判定为碰撞。\n\
  \n公平地说，这不是`hitTestObject`本身的问题；它的工作就是检查两个对象边界框之间的碰撞。它就是这样工作的。如果这对你不适用，你需要决定是修改游戏和对象的结构使其工作，还是寻找其他进行碰撞检测的方法。\n\
  \n有很多不使用`hitTestObject`进行碰撞检测的方法，但让我们看看它相对于更复杂方法的一些优势，以及如何让你的游戏利用好它。\n\n`hitTestObject`有两个很大的优点，使其成为进行碰撞检测的首选：它易于理解、易于实现，并且对\
  \ CPU 或 Flash Player 压力很小。在游戏设计中，性能考虑会主导许多设计决策，仅凭最后这个原因就足以激励你去探索如何从不起眼的`hitTestObject`中榨取出最多的价值。\n\
  \n那么，你能在使用`hitTestObject`的同时，让它对不规则形状的物体也能合理工作吗？\n\n让我们看看一些解决方案。\n\n#### 学会与之共存\n\
  \n第一个解决方案，实际上算不上一个真正的解决方案，是根据`hitTestObject`施加给你的限制来设计游戏。限制可以是一种巨大的优势，就像按照十四行诗的规则写诗可以是一种优势一样。它们可以帮助你集中精力并简化设计——只管去问问莎士比亚吧！\n\
  \n如果你知道`hitTestObject`最适合方形或矩形物体，那么就把你的物体相应地设计成方形。\n\n看看本章示例中使用的猫和怪物游戏角色。它们都是方形的，但除非你实际看到围绕它们绘制的方形轮廓，否则你不会知道这一点。它们被设计成大部分边缘和角落都与设计它们时所处的网格方格的边缘对齐。这意味着角色形状不填充边界框的地方非常少，因此当碰撞发生时，物体的形状几乎总是重叠的。\n\
  \n然而，在图 6-16 所示的情况下，当一个方形物体的角落与一个圆形物体的角落相交时，你该怎么办？这两个物体上都有一些点，即使可见形状没有重叠，也会检测到碰撞。\n\
  \n这不是整个系统的致命弱点吗？如果物体移动得足够快，那就不是，而在大多数游戏中，它们都会移动得很快。圆形星星边缘的空隙最大处不超过 5 个像素。请记住，这些示例中的角色对象以每`1/60`秒\
  \ 5 像素的速度移动。那真的很快。速度如此之快，空隙又如此之小，以至于玩游戏的人永远不会注意到碰撞是不准确的。\n\n当然，如果物体移动得较慢，你就会遇到问题。但这部分要说明的是：设计你的游戏，使其*不*成为问题。让你的物体矮胖一些，并且移动得合理快速。如果你能做到这一点，`hitTestObject`将是你唯一需要的工具。\n\
  \n看看你最喜欢的一些 2D 游戏。所有角色和物体似乎都有点圆胖和方形，这不是很有趣吗？他们正在应对与你完全相同的限制。欢迎加入视频游戏设计师俱乐部！\n\n\n\
  \n### 创建子对象\n\n使用`hitTestObject`改进碰撞检测的最简单方法，是在主对象内部创建子对象，并用它们来检查碰撞。\n\n让我们继续处理方形猫与圆形星星的碰撞问题。如果你在猫的精灵（`Sprite`）内部创建一个更小的矩形对象来定义碰撞区域，就能极大地改进它们之间的碰撞检测。你可以将这个子对象命名为`collisionArea`。\n\
  \n如果在`if`语句中将其与`hitTestObject`一起使用，代码可能如下所示：\n\n```\nif(collisionArea.hitTestObject(star))\n\
  {\n  //碰撞处理指令…\n}\n```\n\n当然，你需要将`collisionArea`子对象的`visible`属性设置为`false`，使其完全透明。你不需要看到它，只需用它作为主对象内部的形状来定义碰撞区域。\n\
  \n你可以在本章源文件的`SubObjects`项目文件夹中找到此类系统的运行示例。图 6-17 显示了运行 SWF 文件时的效果。猫的中央有一个白色小方块，它跟随猫在舞台上移动。当猫的图像触碰到星星时，不会发生碰撞；但如果白色方块触碰到星星，则会检测到碰撞。这个白色方块是猫的子对象，也是用于判断是否发生碰撞的碰撞区域。\n\
  \n![Image](img/9781430239922_Fig06-17.jpg)\n\n**图 6-17.** 使用子对象在主对象内部创建碰撞区域。\n\n\
  你可以制作一个正方形的 PNG 图像文件，将其嵌入程序，并使用`addChild`将其作为角色的子对象。这种方法可行，与之前在角色中创建星星子对象的原理相同。不过，对于创建简单形状，AS3.0\
  \ 有更好的方法。AS3.0 内置了一个名为`Shape`的类，允许你在舞台上绘制基本形状。本例使用`Shape`类通过 AS3.0 代码绘制一个正方形，然后将该正方形作为子对象添加到角色中。碰撞检测代码随后检查正方形与星星之间是否发生碰撞，而不是检查角色与星星。\n\
  \n以下是`SubObjects`示例程序中的代码工作原理。首先，导入`Shape`类。\n\n```\nimport flash.display.Shape;\n\
  ```\n\n然后，在类定义中创建一个名为`square`的`Shape`对象。\n\n```\npublic var square:Shape = new Shape();\n\
  ```\n\n`createGameObjects`方法负责绘制一个 50x50 像素的白色正方形，并将其添加到角色精灵中。\n\n```\nsquare.graphics.beginFill(0xFFFFFF);\n\
  square.graphics.drawRect(0, 0, 50, 50);\nsquare.graphics.endFill();\ncharacter.addChild(square);\n\
  square.x = 25;\nsquare.y = 25;\n```\n\n它还通过将`square`的`x`和`y`坐标设置为 25，使其在角色精灵中居中。\n\
  \n绘制正方形的任务由 AS3.0 的`graphics`包完成，任何`Shape`或`Sprite`对象都可以使用该包。代码首先使用`beginFill`方法为正方形选择颜色：`square.graphics.beginFill(0xFFFFFF);`\n\
  \n你可以在其括号中使用任何十六进制颜色代码。`0xFFFFFF`是白色的十六进制代码。\n\n接下来，代码使用`drawRect`方法绘制正方形：\n\n`square.graphics.drawRect(0,\
  \ 0, 50, 50);`\n\n前两个参数`0`和`0`决定形状距离左上角的偏移量。你不需要偏移，因此设置为 0。后两个参数`50`和`50`是正方形的宽度和高度，单位为像素。这正好是角色对象（100x100\
  \ 像素）的一半大小。你可以使用`drawRect`方法绘制任意尺寸的矩形。\n\n绘制代码的最后一部分使用了`endFill`方法：\n\n`square.graphics.endFill();`\n\
  \n这基本上意味着“绘制完成，停止填充颜色”。\n\n这三行代码绘制了一个 50x50 像素的白色正方形。接下来的代码将正方形添加到角色精灵中，并将其相对于角色左上角的位置偏移\
  \ 25 像素，从而使其完美居中。\n\n```\ncharacter.addChild(square);\nsquare.x = 25;\nsquare.y\
  \ = 25;\n```\n\n你可以在图 6-18 中看到这段代码的效果。很迷人！\n\n![Image](img/9781430239922_Fig06-18.jpg)\n\
  \n**图 6-18.** 绘制一个正方形并将其居中于角色对象内部。\n\n*以上是对 AS3.0 绘图包的快速介绍，它允许你通过 AS3.0 代码绘制各种简单形状。本书后续不会再使用它，但《高级\
  \ Flash 游戏设计》中有详细讲解。你也可以在 Adobe 的 AS3.0 文档中找到关于如何使用它的非常详细的信息：[`http://help.adobe.com/en_US/FlashPlatform/reference/actionscript/3/flash/display/Graphics.html`](http://help.adobe.com/en_US/FlashPlatform/reference/actionscript/3/flash/display/Graphics.html)*。\n\
  \n为了使白色方块不可见，以免遮挡角色的脸，只需在最后一段代码中添加这一行：\n\n`square.visible = false;`\n\n现在，角色携带着这个正方形子对象，你可以在`enterFrameHandler`中使用它来检查与星星的碰撞。代码非常直接：\n\
  \n```\nif (square.hitTestObject(star))\n{\n  output.text = \"Collision!\"\n}\nelse\n\
  {\n  output.text = \"No collision\"\n}\n```\n\n当然，这种碰撞检测仍然不完美。它避免了猫的耳朵碰到星星边界框的空角时被检测到碰撞的问题，但仍然不是角色图像与星星之间的精确碰撞检测。这重要吗？很可能并不重要。\n\
  \n仔细看看你喜欢的一些 2D 游戏中的碰撞检测，你会发现你常常可以只是轻微碰到敌人而不会触发碰撞。在《大金刚》中跳过木桶或在《超级马里奥兄弟》中躲避龟壳时，这种模糊的碰撞检测无数次救了我一命，而且从未让人觉得游戏有问题。\n\
  \n这归结为仔细思考游戏中的碰撞检测，并决定哪些碰撞重要，哪些不重要。让我们再看一下猫和星星的问题。如果猫的耳朵碰到其边界框的空角就捡起星星，这真的合理吗？绝对不合理，如果真的发生了，看起来肯定不对劲。星星与猫的身体稍微重叠而不触发碰撞是可以接受的吗？很可能，因为一旦猫用包含爪子在内的身体部位触碰到星星，碰撞就会发生。这对玩家来说是有意义的。轻微重叠可以被解释为深度浅（或许是猫的毛发），玩家不会注意到有什么不对劲。\n\
  \n然而，如果你测试后发现这看起来确实很别扭，你可以在猫的区域添加更多矩形子对象来改进或微调碰撞精度。你可以根据需要添加任意多个此类子对象。唯一的缺点是，你需要编写更多代码来检查这些碰撞。如果子对象数量巨大，它们可能会开始拖慢游戏速度。尽管如此，这仍然是一个很好的解决方案，通过明智地使用这种方法，几乎没有什么碰撞检测问题是解决不了的。\n\
  \n这完全是一门艺术，而非科学。如果你能妥当平衡，你将拥有一个极其舒适和自然的碰撞检测系统。为`hitTestObject`喝彩！\n\n\n\n### 高级碰撞检测策略\n\
  \n`HitTestObject` 将在本书大部分内容中频繁出现，但最终你的游戏需要更精确的碰撞检测方式。以下是可供研究的几种技术：\n\n* `hitTestPoint`。这是与\
  \ `hitTestObject` 相关的方法。它检测单个点是否与物体的形状相交。但它仅适用于矢量图形，你可以通过 AS3.0 的 `Shape` 类用代码制作，或使用\
  \ Flash Professional 软件绘制。以下是使用 `hitTestPoint` 方法的格式：\n\n  ```\n  if(vectorShape.hitTestPoint(pointX,\
  \ pointY, true))\n  {\n    //碰撞处理指令…\n  }\n  ```\n\n  如果 `pointX` 和 `PointY` 碰到矢量图形，碰撞将注册为\
  \ `true`，碰撞处理指令将运行。`hitTestPoint` 实际上能告知点是否碰到物体的实际形状，而不仅仅是其边界框。\n\n  这看起来似乎有用，但几乎从未用于游戏。不是因为其功能不佳，而是事实上有更好、更有用、更精确的方法来检测形状之间的碰撞。因此大多数游戏设计师会跳过它，去追求更高级的技术。但请不要完全忽视它；你可能会在某些游戏中找到其创新用途。更多关于\
  \ `hitTestPoint` 的信息，可查阅 [`http://help.adobe.com/en_US/FlashPlatform/reference/actionscript/3/flash/display/DisplayObject.html?filter_flash=cs5&filter_flashplayer=10.2&filter_air=2.6#hitTestPoint()`](http://help.adobe.com/en_US/FlashPlatform/reference/actionscript/3/flash/display/DisplayObject.html?filter_flash=cs5&filter_flashplayer=10.2&filter_air=2.6#hitTestPoint())。\n\
  \n* `BitmapData.hitTest`。正确使用这个 AS3.0 方法，将引导你找到碰撞检测的终极目标：形状间的像素级完美碰撞。这需要高级的 AS3.0\
  \ 和编程知识才能使用，但当你完成本书学习时，将掌握所有必要技能。你将在《Flash 高级游戏设计》中了解使用 `BitmapData.hitTest` 进行复杂碰撞检测所需的一切知识。\n\
  \n* 运用数学。或许令人惊讶的是，判断两个物体是否碰撞的最佳方式是完全放弃 AS3.0 内置的 `hitTestObject` 等方法，自己计算。这不仅提供高精度，而且如果用数学方法处理碰撞，你的游戏运行速度会快得多。在高级层面，你可以使用**向量数学**对各种形状和大小的物体进行极其精确的碰撞检测（你将在《Flash\
  \ 高级游戏设计》中了解具体做法）。不过，你也可以用更简单的数学方法对矩形形状进行非常精确的碰撞检测，这对于你可能编写的 95% 的游戏来说已经足够。\n\n\
  那么，让我们来看看另一种会在你的游戏中发挥巨大作用的碰撞检测方法。\n\n#### 使用基于向量的碰撞检测\n\n到目前为止，你看到的碰撞检测代码能告知两个物体何时接触，你也能利用这些信息来改变变量和物体属性的值。然而，大多数游戏需要更进一步。你需要物体在碰撞时能作出某种物理反应。例如，如果游戏角色撞到箱子，箱子应该阻挡其移动。或者，如果游戏角色发现一块岩石，或许应该能够推动它绕舞台移动。\n\
  \nAS3.0 没有内置功能来实现这些。你当然可以做到这些，但必须从头编写所有代码来实现。这意味着要学习一些简单的数学知识，并花时间理解代码的工作原理。不要因此退缩——在此过程中学到的技能对你作为游戏设计师的职业生涯将是无价之宝，而且你能够将这些相同的技术直接应用于任何其他游戏设计技术或编程语言。\n\
  \n**基于向量的碰撞检测**是视频游戏设计的深奥技巧之一。学会它，你将能在游戏中精确控制所有碰撞检测与反应。你将使用它来防止两个物体重叠，使一个物体阻挡另一个物体的移动。\n\
  \n\n\n##### 防止对象重叠\n\n如果你希望一个游戏对象（比如一个盒子）能够阻挡游戏角色的移动，你就必须找到一种方法来防止角色和盒子重叠。但是，你只有知道它们在碰撞时重叠了多少，才能做到这一点。`hitTestObject`\
  \ 对此毫无帮助，因为它完全不提供碰撞中对象之间重叠量的任何信息。图 6-19 说明了这个问题。\n\n![Image](img/9781430239922_Fig06-19.jpg)\n\
  \n**图 6-19.** 如果你知道对象在碰撞中的重叠量，就可以将它们分开。但你该如何计算出来呢？\n\n如果你知道对象之间的重叠量，你就可以精确地按照这个量将它们分开。该如何计算呢？解决方案是使用**向量**。\n\
  \n你可以将向量想象成连接对象的假想线。所谓\"假想\"，是指它们仅以数字形式存在；你在舞台上无法看到它们。但是，如果你在游戏对象的中心之间画出这些假想线，你就能判断对象是否接触，以及它们重叠的具体量。如果你知道重叠量，就能以刀刃般的精度将它们分开。这一切都是通过一些简单的数学计算完成的。具体原理如下：\n\
  \n首先，你需要计算第一个对象中心到第二个对象中心之间的向量。你可以用两个变量来描述这个向量。\n\n*   `vx`：告知你向量的宽度。\"vx\" 代表 \"\
  沿 x 轴的向量\"。\n*   `vy`：告知你向量的高度。\"vy\" 代表 \"沿 y 轴的向量\"。\n\n如果你有存储这些信息的 `vx` 和 `vy`\
  \ 变量，那么你就创建了一个可以在游戏中使用的向量。图 6-20 展示了如何使用 `vx` 和 `vy` 变量来描述两个游戏对象之间的距离。\n\n![Image](img/9781430239922_Fig06-20.jpg)\n\
  \n**图 6-20.** `vx` 和 `vy` 变量描述了向量的宽度和高度。\n\n你在图 6-20 中看到的距离向量就是我之前提到的假想线。你在舞台上看不到它。它之所以存在，仅仅是因为\
  \ `vx` 和 `vy` 变量描述了它的高度和宽度。\n\n在图 6-20 中，你可以轻易看出两个对象在 x 轴上相距 5 个单位，在 y 轴上相距 5 个单位。这就是\
  \ `vx` 和 `vy` 变量要告诉你的全部信息。很简单吧！\n\n*如果你需要知道距离向量的确切长度，可以使用勾股定理。勾股定理是一个非常常用、久经考验的公式。以下是使用\
  \ `vx` 和 `vy` 变量计算对象间精确距离的方法：*\n\n```\ndistance = Math.sqrt(vx * vx + vy * vy);\n\
  ```\n\n*`Math.sqrt` 是 AS3.0 的一个内置方法，它返回参数中任何值的平方根。*\n\n*在图 6-20 中，`vx` 和 `vy` 变量的值分别为\
  \ 5 和 5。如果你将它们代入上面的公式，结果如下：*\n\n```\ndistance = Math.sqrt(5 * 5 + 5 * 5);\n```\n\
  \n*如果你在 AS3.0 中运行这段代码，将会得到以下结果：*\n\n```\ndistance = 5.9\n```\n\n*这正是你在图 6-20 中看到的两个对象间距离向量的长度。*\n\
  \n*能够像这样计算出对象间的精确距离，对于游戏开发来说极其有用。如果你知道哪些对象更接近，你的游戏角色就可以根据它们与其他对象的距离远近，来决定去哪里或应该避开什么。本章中不需要使用勾股定理，但你将在第\
  \ 10 章中再次遇到它。*\n\n现在你有了一个能告诉你两个对象间距离的向量，如何用它来判定它们是否接触呢？首先，你必须计算两个对象的组合半宽和组合半高。这是什么意思呢？取第一个对象的宽度，除以一半。然后取第二个对象的宽度，同样除以一半。将这两个数相加，得到的就是对象的组合半宽。示例如下：\n\
  \n```\ncombinedHalfWidths\n  = (objectOne.width / 2) + (objectTwo.width / 2);\n\
  ```\n\n然后对对象的高度做同样的事情。\n\n```\ncombinedHalfHeights\n  = (objectOne.height / 2) +\
  \ (objectTwo.height / 2);\n```\n\n图 6-21 展示了这些数字的含义。\n\n![Image](img/9781430239922_Fig06-21.jpg)\n\
  \n**图 6-21.** 找出对象的组合半高和组合半宽。\n\n你可以看到这确实是简单的数学计算。但看起来也可能像一堆无用的信息！其实不然。以下是其重要性所在：\n\
  \n> *如果组合半宽和组合半高小于 `vx` 和 `vy` 变量，那么对象就是接触的。*\n\n让我们来实际了解一下其原理：\n\n1.  想象一下猫咪角色正在舞台上移动。你想知道它是否碰到了盒子。将\
  \ `vx` 和 `vy` 变量与对象的组合半高和组合半宽进行比较。如果 `vx` 和 `vy` 变量的值大于组合半宽和组合半高，那么就没有发生碰撞。图 6-22\
  \ 说明了这一点。\n\n![Image](img/9781430239922_Fig06-22.jpg)\n\n**图 6-22.** 如果 `vx` 和 `vy`\
  \ 变量大于对象的组合半宽和组合半高，则未发生碰撞。\n\n2.  但是如果猫咪悄悄靠近舞台的右边缘会发生什么？一旦它的 `vx` 值变得小于组合半宽，就可能即将发生碰撞。但目前还没有发生，因为\
  \ `vy` 值仍然大于组合半高。你可以在图 6-23 中看到这一点。\n\n![Image](img/9781430239922_Fig06-23.jpg)\n\
  \n**图 6-23.** 如果 `vx` 值变得小于组合半宽，则可能发生碰撞。\n\n3.  如果 `vx` 和 `vy` 值都小于组合半宽和组合半高，那么可以肯定对象正在碰撞。图\
  \ 6-24 展示了这一点。\n\n![Image](img/9781430239922_Fig06-24.jpg)\n\n**图 6-24.** 如果 `vx`\
  \ 和 `vy` 值都小于组合半宽和组合半高，则肯定发生了碰撞。\n\n4.  既然你知道发生了碰撞，就必须将对象分开。只有你知道它们重叠了多少，才能做到这一点。如何计算出来呢？通过从组合半宽和组合半高中减去\
  \ `vx` 和 `vy` 的值，如图 6-25 所示。\n\n![Image](img/9781430239922_Fig06-25.jpg)\n\n**图\
  \ 6-25.** 计算出重叠量。\n\n5.  最后一步是分开对象，使它们不再接触。既然你知道对象重叠了多少，这就很容易做到了。只需从对象的 x 和 y 位置中减去重叠量即可，如下所示：\n\
  \n```\ncharacter.x = character.x - overlap_X;\ncharacter.y = character.y - overlap_Y;\n\
  ```\n\n这等同于说：\n\n> *角色的新位置将与其旧位置相同，减去重叠量。*\n\n这会将对象移出碰撞。图 6-26 说明了这一点。\n\n![Image](img/9781430239922_Fig06-26.jpg)\n\
  \n**图 6-26.** 从角色的当前位置减去重叠量，将其移出碰撞。\n\n通常，在 x 轴或 y 轴上的重叠会稍微多一些。在这种情况下，你应该沿着重叠量最小的轴向移动对象，使其脱离碰撞。\n\
  \n\n好的，作为高级文档工程师，我将遵循您提供的格式指南和示例，对给定的文本进行排版。\n\n\n你是否对理论感到了困惑？但我之前不是承诺过这本书里不会有太多数学内容吗？幸运的是，你不需要了解这些数学知识就能在游戏中使用它。接下来我将向你展示如何操作。\n\
  \n### 使用 `Collision` 类进行编程\n\n如果你理解了这些基本概念，接下来要做的就是弄清楚如何在游戏中运用它们。你很快就会进行实践，但其方式与你在这本书中之前编写的任何代码都截然不同。你将把这段代码作为一个完全独立的类的一部分来使用。这个类叫做\
  \ `Collision`，你可以在本章的源文件中找到它。\n\n但类到底是什么？你可以把类看作是程序的一个独立组件。你可以将不同的类链接在一起，使它们能够共享代码并协同工作，从而构建复杂的游戏和程序。如何做到这一点将是本书后续大部分内容的重点，所以如果现在觉得这听起来有些吓人，不必慌张！我将提供一些易于掌握的小步骤。\n\
  \n从技术上讲，你之前编写的每个程序都是一个类。我一直称它们为计算机程序，但实际上你一直在编写类。你之所以能看出来，是因为你所有的程序都包含了一个叫做类定义的代码块。\n\
  \n`public` `class` `PickingUpObjects extends Sprite`\n`{…`\n\n到目前为止，你所有的程序都包含在一个类中。这对于学习和构建短小的程序来说非常棒，但随着你的游戏复杂度的提升，你会发现将游戏的各个组件拆分到不同的类中会高效得多。\n\
  \n让我们来看看这些新概念和理论的一个实际应用。在本章的源文件中，你会找到一个名为 `BlockingMovement` 的项目文件夹。打开 `src` 文件夹。你会看到它包含两个\
  \ AS 文件，如图 6-27 所示。\n\n![Image](img/9781430239922_Fig06-27.jpg)\n\n**图 6-27.** `BlockingMovement`\
  \ 程序使用两个类来完成其工作。\n\n这些 AS 文件，`BlockingMovement.as` 和 `Collision.as`，都是类。`BlockingMovement.as`\
  \ 是主类。它是启动程序并让一切运转起来的类。程序的主类被称为**应用程序类**。你在本书中迄今为止编写的所有类都是应用程序类。\n\n另一个类是 `Collision.as`。这个类包含专门化的代码，用于帮助应用程序类完成其工作。事实上，它包含了代表你刚刚看到的碰撞逻辑的所有代码。如果你希望一个游戏对象阻挡另一个游戏对象的移动，就可以使用这个类。\n\
  \n将所有碰撞代码放在它自己的类中，有几个很好的理由。\n\n-   `Collision` 类包含的代码非常有用，你会在许多游戏项目中用到它。与其为每个你想使用它的游戏从头编写所有代码，不如直接复制该类并将其放到任何项目的\
  \ `src` 文件夹中。然后你就可以使用 `Collision` 类的所有代码，而无需重写其中任何部分。\n-   如果你不想了解 `Collision` 类中的代码，也完全不需要查看或理解它如何工作。它是一个自包含的“黑盒”。你可以在主程序中非常轻松地使用它，而无需完全弄懂它。\n\
  \n让我们看看这两个类是做什么的。打开 `BlockingMovement` 项目并编译程序。将猫角色移到箱子旁边。角色无法穿过箱子——这是一个固体环境边界。一个输出文本字段会告诉你角色的哪一侧正在接触箱子。图\
  \ 6-28 显示了你会看到的内容。\n\n![Image](img/9781430239922_Fig06-28.jpg)\n\n**图 6-28.** 猫被箱子从各个方向阻挡。\n\
  \n实现这一切的代码非常简单。大部分代码与本章中的其他示例相同。所有的魔法都发生在 `enterFrameHandler` 中。以下加粗的代码完成了所有工作：\n\
  \n```\npublic function enterFrameHandler(event:Event):void\n{\n  //Move the player\n\
  \  character.x += vx;\n  character.y += vy;\n\n  //Collision code\n  Collision.block(character,\
  \ box);\n}\n```\n\n\n\n```\n// 在输出文本字段中显示碰撞方向\noutput.text = Collision.collisionSide;\n\
  ```\n\n没错，真的只有一行代码！\n\n```\nCollision.block(character, box);\n```\n\n它将 `character`\
  \ 和 `box` 对象发送给 `Collision` 类的 `block` 方法。`Collision.block` 方法负责所有阻止对象重叠的工作。你无需关心它如何实现，只需在希望阻止任意两个游戏对象之间的移动时使用这一行代码即可。这段代码能工作，是因为\
  \ `Collision` 类与 `BlockingMovement` 类位于同一个 `src` 文件夹中。图 6-29 展示了这两个类如何协同工作。\n\n\
  ![Image](img/9781430239922_Fig06-29.jpg)\n\n**图 6-29.** 角色和箱子对象被发送到 Collision 类的\
  \ block 方法中。\n\n`Collision.block` 是一种特殊的方法，称为**静态方法**。静态方法是属于外部类的方法，你可以在主程序中使用它们。\n\
  \n要在你的程序中使用静态方法，只需使用该方法所属的类名，后跟一个点，再跟方法名和括号即可。示例如下：\n\n```\nClassName.methodName();\n\
  ```\n\n你之前已经见过静态方法，只是当时没有意识到。在第 4 章中，你用过 AS3.0 的一个特殊内置方法：\n\n```\nMath.random()\n\
  ```\n\n是不是很眼熟？没错，它就是一个静态方法！`random` 是 AS3.0 的 `Math` 类中的一个方法。它的专有功能是生成一个介于 0 和 1\
  \ 之间的随机数，并且你可以在程序中任何其他类里使用它。像这样使用的静态方法通常被称为**工具方法**。它们在你的程序中完成一些实用的小功能，只要提供你需要的结果，你无需关心它们如何工作。\n\
  \n你可以通过在方法定义中添加关键字 `static` 来将任何类的方法变为静态方法，如下所示：\n\n```\nstatic public function\
  \ block(r1:Sprite, r2:Sprite):void\n{ …\n```\n\n这段代码的另一个额外特性是，它能告诉你碰撞发生在角色的哪一侧。\n\
  \n```\noutput.text = Collision.collisionSide;\n```\n\n这行代码读取了 `Collision` 类内部的一个\
  \ `String` 变量，并将其显示在输出文本字段中。\n\n这段代码还有一个额外的好处。只需做一个小小的改动，你就可以让角色推着箱子在舞台上移动。你只需要交换方法参数中对象的顺序即可。将\
  \ `box` 放在前面，然后是 `character`，像这样：\n\n```\nCollision.block(box, character);\n```\n\
  \n重新编译程序并观察效果。现在猫可以推着箱子在舞台上移动，如图 6-30 所示。\n\n![Image](img/9781430239922_Fig06-30.jpg)\n\
  \n**图 6-30.** 交换 Collision.block 方法中参数的顺序，让猫推着箱子在舞台上移动。\n\n这怎么可能？通过改变参数的顺序，代码的效果作用在了箱子上，而不是角色上。唯一的区别在于，因为角色在移动，箱子必须不断调整自身位置到角色移动方向的前方，以防止两个对象重叠。\n\
  \n这就是使用 `Collision` 类的方法！\n\n如果你对新代码可以工作感到满意，并且不太纠结于细节，可以直接跳到下一章。最重要的是，你拥有了一个可以在任何游戏中使用的绝佳小工具。如果你现在对基于向量的碰撞检测原理、为什么需要使用它，以及如何在自定义类中使用静态方法有了大致了解，这已经足够了。就像\
  \ `Math.random` 一样，`Collision.block` 是一个随时可供你使用的工具方法，你不需要知道它如何工作。\n\n但如果你是个代码发烧友，请继续往下读！\n\
  \n### 再探方法、实参和形参\n\n`Collision.block` 方法使用了两个实参。它们可以是游戏中的任意 Sprite 对象。在前面的例子中，它们是\
  \ `character` 和 `box` 对象。\n\n```\nCollision.block(character, box);\n```\n\n这些实参被发送到函数定义中的形参里（你可以在\
  \ `Collision` 类中找到它，稍后就会看到）。形参已用高亮标出。\n\n```\nstatic public function block(r1:Sprite,\
  \ r2:Sprite):void\n{ …\n```\n\n我在第 3 章中讨论过如何使用方法形参，但在继续之前，让我们再回顾一下。\n\n假设你想编写一个方法，其任务是显示水果的名称。我们称这个方法为\
  \ `fruitDisplay`。你希望能够给它任何水果的名称，然后这个方法应该接收这些名称并以跟踪消息的形式显示出来。\n\n这个方法不知道水果的名称会是什么；你可以发送给它任何能想到的水果。它只知道你会给它两个名称。你可以编写类似下面的代码：\n\
  \n```\nfruitDisplay(\"apple\", \"orange\");\n```\n\n水果的名称在方法名后面的括号中提供，这被称为实参。你提供了水果的名称作为字符串（用引号括起来的单词），并用逗号分隔。现在，方法的函数定义的任务就是利用这些信息做点有用的事情。\n\
  \n下面是 `fruitDisplay` 方法的函数定义：\n\n```\npublic function fruitDisplay\n  (parameterOne:String,\
  \ parameterTwo:String):void\n{\n  trace(parameterOne,  parameterTwo);\n}\n```\n\n\
  如果你在程序中运行这段代码，你会看到以下跟踪消息：\n\n```\napple orange\n```\n\n你可以在程序中随时更改方法调用中的实参来显示不同的水果。例如，你可能会厌倦苹果和橙子，然后在程序稍后的位置写下这行代码：\n\
  \n```\nfruitDisplay(\"mango\", \"banana\");\n```\n\n然后你会看到以下跟踪消息：\n\n```\nmango\
  \ banana\n```\n\n你完全没有修改方法本身；你所做的只是更改了方法调用中的实参。当实参被发送到方法的函数定义时，它们被复制到形参中，这里用高亮标出：\n\
  \n```\nfunction fruitDisplay\n  (parameterOne:String,  parameterTwo:String):void\n\
  {\n  trace(parameterOne,  parameterTwo);\n}\n```\n\n形参只是可以在函数定义中任何地方使用的变量。因为你期望它们接收字符串值，所以你将它们的变量类型设置为\
  \ `String`，就像对待其他任何变量一样。\n\n这两个形参的值包含了方法调用传递给它们的任何值。这意味着，每当方法使用变量名 `parameterOne`\
  \ 和 `parameterTwo` 时，它都会用 `apple` 和 `orange` 或 `mango` 和 `banana` 或你选择发送的其他任何值来替换它们。这种系统的美妙之处在于，你可以将这种方法用于许多不同的相关任务，而无需知道变量的具体值。\n\
  \n下面是另一个例子。我们创建一个方法来对三个数字求和并显示结果。它可能看起来像这样：\n\n```\npublic function add(one:int,\
  \  two:int, three:int):void\n{\n  trace(one + two + three);\n}\n```\n\n然后你可以使用方法调用来使用这个方法，可能像这样：\n\
  \n```\nadd(4,10,6);\n```\n\n它会显示以下跟踪消息：\n\n```\n20\n```\n\n你提供的任意三个数字都会得到不同的结果。我相信你已经开始看到这有多实用了。\n\
  \n\n\n### 返回值的方法\n\n你也可以创建向主程序返回结果的方法。假设你有一个名为 `add` 的方法，用于将两个数字相加，代码可能如下所示：\n\n\
  ```\npublic function add(numberOne:Number, numberTwo:Number):Number\n{\n  var result:Number\
  \ = numberOne + numberTwo;\n  return result;\n}\n```\n\n该方法将两个参数相加，并将结果存储到名为 `result`\
  \ 的变量中。随后，关键字 `return` 将 `result` 的值发送回主程序。你可以在主程序中像这样使用此方法：\n\n```\nanyVariable\
  \ = add(23, 13);\n```\n\n`add` 方法的 `result` 值将被复制到 `anyVariable` 中。在此例中，`anyVariable`\
  \ 的值将变为 36。\n\n要在方法中使用返回值，方法的函数定义必须指定该方法将返回的值类型。在本例中，它返回一个 `Number` 类型，你可以看到函数定义中的最后一项，如下高亮所示：\n\
  \n```\npublic function add(numberOne:Number, numberTwo:Number):Number\n```\n\n方法可以向主程序返回任何类型的值，例如\
  \ `String` 或 `Sprite` 对象。只需确保在函数定义中指定正确的返回类型，就像前面的代码一样。（你可以在本章源文件的 `ReturningAValue`\
  \ 项目文件夹中找到该系统的实际示例。）\n\n### 将 Block 方法的参数与碰撞类结合使用\n\n如你所见，若想阻止 `character` 对象穿过\
  \ `box`，你可以编写如下所示的方法调用：\n\n```\nCollision.block(character, box);\n```\n\n这在本程序中可能有效，但如果你有另一个游戏，需要阻止一只\
  \ `mouse` 穿过一条溪流呢？无需更改方法函数定义的任何内容，只需使用这行代码：\n\n```\nCollision.block(mouse, stream);\n\
  ```\n\n该方法以通用方式编写，因此无需预先知道具体要阻止哪些对象，只需知道它们将是两个 `Sprite` 对象即可。你可以在任何上下文中重复使用完全相同的代码。\n\
  \n### 查看 Collision.block 方法\n\n那么，现在你没有任何借口说你不理解方法参数和形参了！准备好迎接更大的挑战了吗？让我们看看 `Collision`\
  \ 类，并准确理解代码是如何工作的。\n\n**警告！** 代码有点复杂，你几乎肯定无法立即理解。实际上，更有利的做法是，等你的编程技能再精进一些，过几章后再回头阅读本章的这一部分。\n\
  \n在开始之前，请翻回几页，找到名为“防止对象重叠”的部分，并尝试熟悉你需要解决的问题。如果你理解了问题以及用于解决问题的逻辑，那么所有新代码所做的就是将那个逻辑转换成\
  \ AS3.0 代码。让我们逐步解析 `Collision` 类，看看有哪些新内容以及它是如何工作的。\n\n以下是整个 `Collision` 类。你会看到很多你不理解的代码，但暂时不必担心。我将在接下来的几页中带你一一解读。请注意，`r1`\
  \ 和 `r2` 分别代表“矩形一”和“矩形二”。在你刚刚看到的示例中，`r1` 是 `character`，`r2` 是 `box`。\n\n```\npackage\n\
  {\n  import flash.display.Sprite;\n\n  public class Collision\n  {\n    static public\
  \ var collisionSide:String = \"\";\n\n    public function Collision()\n    {\n \
  \   }\n    static public function block(r1:Sprite, r2:Sprite):void\n    {\n    \
  \  //计算距离向量\n      var vx:Number\n        = (r1.x + (r1.width / 2))\n        - (r2.x\
  \ + (r2.width / 2));\n\n      var vy:Number\n        = (r1.y + (r1.height / 2))\n\
  \        - (r2.y + (r2.height / 2));\n\n      //检查 vx\n      //是否小于组合半宽\n      if(Math.abs(vx)\
  \ < r1.width / 2 + r2.width / 2)\n      {\n        //可能正在发生碰撞！检查\n        //vy 是否小于组合半高\n\
  \        if(Math.abs(vy) < r1.height / 2 + r2.height / 2)\n        {\n         \
  \ //碰撞已发生！很好！\n          //找出 X 轴和 Y 轴上的重叠大小\n          var overlap_X:Number\n \
  \           = r1.width / 2\n            + r2.width / 2\n            - Math.abs(vx);\n\
  \n          var overlap_Y:Number\n            = r1.height / 2\n            + r2.height\
  \ / 2\n            - Math.abs(vy);\n\n          //碰撞发生在重叠量 *最* 小的轴上。让我们确定\n    \
  \      //是哪条轴\n\n          if(overlap_X >=  overlap_Y)\n          {\n          \
  \  //碰撞发生在 X 轴上\n            //但在哪一侧？vy 可以告诉我们\n            if(vy > 0)\n       \
  \     {\n              collisionSide = \"Top\";\n\n              //将矩形移出碰撞\n   \
  \           r1.y = r1.y + overlap_Y;\n            }\n            else\n        \
  \    {\n              collisionSide = \"Bottom\";\n\n              //将矩形移出碰撞\n \
  \             r1.y = r1.y - overlap_Y;\n            }\n          }\n          else\n\
  \          {\n            //碰撞发生在 Y 轴上\n            //但在哪一侧？vx 可以告诉我们\n        \
  \    if(vx > 0)\n            {\n              collisionSide = \"Left\";\n\n    \
  \          //将矩形移出碰撞\n              r1.x = r1.x + overlap_X;\n            }\n  \
  \          else\n            {\n              collisionSide = \"Right\";\n\n   \
  \           //将矩形移出碰撞\n              r1.x = r1.x - overlap_X;\n            }\n \
  \         }\n        }\n        else\n        {\n          //未发生碰撞\n          collisionSide\
  \ = \"No collision\";\n        }\n      }\n      else\n      {\n        //未发生碰撞\n\
  \        collisionSide = \"No collision\";\n      }\n    }\n  }\n}\n```\n\n这是本书到目前为止你遇到的最复杂的代码，但我将把它拆分开来，一次只分析一小部分。第一个奇怪的地方是\
  \ `Collision` 类的构造方法。\n\n\n```as3\npublic function Collision()\n{\n}\n```\n\n记住，类*必须*有一个构造函数，且构造函数的名称必须与类名完全相同。构造函数内的任何指令都会在类实例化时立即执行。\n\
  \n这个构造函数完全是空的，这看起来可能有些奇怪。原因是你没有任何需要执行的初始化指令。像这样写一个空的构造函数是完全可行的。事实上，如果你愿意，甚至可以完全省略整个构造函数，尽管通常认为省略它是一种不良的编程习惯。（如果你省略了它，AS3.0\
  \ 在编译程序时会自动添加。）\n\n接下来是 `block` 方法的函数定义。\n\n```as3\nstatic public function block(r1:Sprite,\
  \ r2:Sprite):void\n{…\n```\n\n`static` 关键字意味着你可以使用以下格式，在任何其他类中直接调用此方法：\n\n`Collision.block`\n\
  \n这很方便，因为如果这个方法没有被声明为 `static`，你就需要先使用 `new` 关键字创建该类的一个实例，像这样：\n\n`public var collision:Collision\
  \ = new Collision();`\n\n然后你才能像这样使用 `block` 方法：\n\n`collision.block(character, box);`\n\
  \n通过将方法声明为 `static`，你就不必费心先创建类的实例了。\n\n关于这个函数定义，另一个重要的部分是它的参数。\n\n`(r1:Sprite, r2:Sprite)`\n\
  \n这些是类型为 `Sprite` 的局部变量。在 `BlockingMovement` 应用类中，你使用了这行代码来调用该方法：\n\n`Collision.block(character,\
  \ box);`\n\n`character` 和 `box` 都是 `Sprite` 对象，因此 `r1` 和 `r2` 也应该是 `Sprite` 对象类型。当方法被调用时，对\
  \ `character` 对象的引用会被复制到 `r1` 变量中，对 `box` 对象的引用则被复制到 `r2` 变量中。每当你在方法体中看到 `r1` 和\
  \ `r2` 时，如果这有助于你更好地理解代码的工作原理，你可以在脑海中将它们替换为 `character` 和 `box`。（这里的 \"r\" 只是 \"\
  矩形 rectangle\" 的缩写。在这段代码中保持变量名简短，可以使代码更紧凑，也更易读。）\n\n`block` 方法开头的几行代码创建了 `vx` 和\
  \ `vy` 变量，用于定义对象之间的距离向量。\n\n```as3\nvar vx:Number\n  = (r1.x + (r1.width / 2))\n\
  \  - (r2.x + (r2.width / 2));\n\nvar vy:Number\n  = (r1.y + (r1.height / 2))\n \
  \ - (r2.y + (r2.height / 2));\n```\n\n这是位于角色和盒子之间的假想线。该向量是从对象的*中心*绘制的。要找到中心点，需要将它们的宽度和高度的一半值加到其左上角的\
  \ x 和 y 坐标上。最终得到的是一个从角色中心指向盒子中心的向量。记住，一对 `vx` 和 `vy` 变量总是描述一个单一的向量。（如果你对此还有点模糊，请回顾图\
  \ 6-20 复习一下原因。）\n\n既然已经定义了向量，代码就会按步骤检查 `vx` 和 `vy` 是否小于组合后的半宽。记住，如果小于，则发生碰撞。这一切都是通过一系列嵌套的\
  \ `if` 语句完成的。这是第一个：\n\n```as3\nif(Math.abs(vx) < r1.width / 2 + r2.width / 2)\n\
  {…\n```\n\n这段代码并没有看起来那么吓人！它的意思就是：\n\n*`如果(vx 值小于 r1 的半宽加上 r2 的半宽)`*\n*`{…`*\n\n\
  再看一眼那个 `if` 语句。现在明白了吗？就像我保证的那样，这不过是点简单的数学运算。\n\n但其中有一处新内容：\n\n`Math.abs(vx)`\n\n\
  `Math.abs` 是 AS3.0 的内置方法之一。（是的，它是一个静态方法！）它的作用是求出一个数字的**绝对值**。绝对值只能是正数；被强制求绝对值的负数会去掉其符号。假设你在这样一行代码中使用了\
  \ `Math.abs`：\n`Math.abs(-27);`\n\n它会返回：\n\n`27`\n\n为什么这对你有用？如果第一个对象的 x 坐标值小于第二个对象，那么\
  \ `vx` 的值将为负数。负数值会使代码变得过于复杂，因为你需要额外的 `if` 语句来处理它。只处理正值对你来说更简单。\n\n那么，如果代码发现 `vx`\
  \ 小于组合半宽会怎样？它会检查 `vy` 是否小于组合半高。\n\n```as3\nif(Math.abs(vy) < r1.height / 2 + r2.height\
  \ / 2)\n{…\n```\n\n如果结果为真，那么你就知道绝对发生碰撞了。这就是图 6-24 所示的情况。下一步是计算 x 轴和 y 轴上的重叠量，然后使用这些量来确定碰撞发生在对象的哪一侧：顶部、左侧、底部还是右侧。\n\
  \n重叠量被存储在两个名为 `overlap_X` 和 `overlap_Y` 的变量中。计算方式如下：\n\n```as3\nvar overlap_X:Number\n\
  \  = r1.width / 2 + r2.width / 2 - Math.abs(vx);\nvar overlap_Y:Number\n  = r1.height\
  \ / 2 + r2.height / 2 - Math.abs(vy);\n```\n\n你会注意到这些变量没有使用 `public` 关键字声明。这是因为它们仅是方法内部使用的变量，不属于该类。它们不能在\
  \ `block` 方法之外使用。这些被称为**局部变量**。在本书的剩余部分，你会看到更多关于局部变量工作的示例。\n\n既然知道了重叠量，你只需将重叠值与\
  \ `vx` 和 `vy` 值进行比较，就能找出碰撞发生在第一个对象的哪一侧。当代码知道这一点后，它就能使用正确的重叠值来重新定位对象，使其不再与第二个对象接触。\n\
  \n```as3\nif(overlap_X >=  overlap_Y)\n{\n//碰撞发生在 X 轴上\n//但发生在哪一侧？vy 能告诉我们\n  if(vy\
  \ > 0)\n  {\n    collisionSide = \"Top\";\n\n//将矩形移出碰撞\n    r1.y = r1.y + overlap_Y;\n\
  \  }\n  else\n  {\n    collisionSide = \"Bottom\";\n\n//将矩形移出碰撞\n    r1.y = r1.y\
  \ - overlap_Y;\n  }\n}\nelse\n{\n//碰撞发生在 Y 轴上\n//但发生在哪一侧？vx 能告诉我们\n  if(vx > 0)\n\
  \  {\n    collisionSide = \"Left\";\n\n//将矩形移出碰撞\n    r1.x = r1.x + overlap_X;\n\
  \  }\n  else\n  {\n    collisionSide = \"Right\";\n\n//将矩形移出碰撞\n    r1.x = r1.x\
  \ - overlap_X;\n  }\n}\n```\n\n这就是全部内容了。你可以看到逻辑有些复杂，但如果你花几分钟时间在脑海中仔细地跟随代码一步步执行，你也会发现它其实相当简单。\n\
  \n作为额外功能，`Collision` 类有一个名为 `collisionSide` 的 `String` 变量。\n\n`static public var\
  \ collisionSide:String = \"\";`\n\n它的作用是记录碰撞发生的侧面。对于你的一些游戏来说，了解这些信息可能很有用。事实上，了解这些信息对于编写平台游戏至关重要，正如你将在第\
  \ 9 章中看到的那样。\n\n`collisionSide` 被声明为一个 `static` 变量。这意味着你可以在主应用类中像这样访问这个变量：\n\n`Collision.collisionside`\n\
  \n这将返回 `collisionSide` 变量的当前文本。你可以在游戏场景中像这样使用它：\n\n```as3\nif(Collision.collisionSide\
  \ == \"Bottom\")\n{\n  //角色正站在盒子上方，\n  //所以释放蜂群吧！\n}\n```\n\n我将把实际编写这个游戏的任务留给你，靠你的技巧和想象力去实现。（我已经迫不及待想玩到它了！）\n\
  ```\n\n\n### 摘要\n\n碰撞检测是游戏设计中一个相当宏大的主题。希望本章的初步介绍能激发你对后续内容的兴趣。\n\n不过在跳入下一章之前，你可能想稍作休息，动手制作一个游戏。嘿，别害怕，你能做到！毕竟，这正是本书的核心——制作你自己的游戏。如果你将本章的碰撞检测技术与上一章的角色控制技巧（以及你在猜数字游戏中学习到的逻辑分析方法）结合起来，你就拥有了制作一些相当精良游戏所需的所有工具。\n\
  \n而这正是你在下一章要做的事情。你将运用截至目前学到的所有技能，将它们整合起来，制作出你的第一款真正的视频游戏！\n\n![图片](img/chap.jpg)\n\
  \n## 第 7 章\n\n## 制作游戏\n\n现在你已具备开始制作真正游戏所需的所有技能。但具体该怎么做呢？如何从零散的小示例跨越到完整的大游戏，这可能并不显而易见，但别担心。在本章中，我将向你精确演示如何实现这一跨越。我将带你一步步地了解如何仅使用你已经学过的技术来制作一款视频游戏。（好吧，我承认，我还会偷偷加入一两个小技巧！）\n\
  \n你将亲历制作游戏的全过程——从图形到编程。你要制作的游戏是一个非常简单的物品收集游戏。玩家需要在 10 秒倒计时结束前收集五颗炸弹并将其拆除。图 7-1 展示了游戏的样子。\n\
  \n![图片](img/9781430239922_Fig07-01.jpg)\n\n**图 7-1.** 在时间耗尽前拆除炸弹！\n\n我将利用本章的机会向你介绍另一个有用的游戏图形创作工具：Adobe\
  \ Illustrator。如果你对 Illustrator 的工作原理感到好奇，却又因其表面的复杂性而却步，本章将教你开始使用它所需的一切知识。但你不必非得使用\
  \ Illustrator 来制作这些图形；你也可以使用 Photoshop 或任何其他能生成 PNG 文件的图形设计或插画软件来制作。\n\n你还会学到一项有趣的编程新技巧：如何制作计时器。我将向你展示如何将每个游戏对象封装成独立的类，从而大幅减少主应用程序类中所需的代码量。\n\
  \n是时候制作你的第一款真正游戏了！\n\n### 制作游戏图形\n\n你的游戏需要五张 PNG 图片。以下是它们的名称和尺寸：\n\n*   `character.png`（宽：50\
  \ 像素，高：50 像素）\n*   `box.png`（宽：50 像素，高：50 像素）\n*   `bomb.png`（宽：40 像素，高：30 像素）\n\
  *   `background.png`（宽：550 像素，高：400 像素）\n*   `gameOver.png`（宽：300 像素，高：150 像素）\n\
  \n图 7-2 展示了我为这个项目设计的样子。你可以按照自己的喜好设计这些 PNG 文件。只要它们的名称和尺寸与上述一致，就能在游戏程序中使用。\n\n![图片](img/9781430239922_Fig07-02.jpg)\n\
  \n**图 7-2.** 你将制作的游戏图形\n\n我已经使用 Adobe Illustrator CS5.0 制作了所有这些图形，并将在后续的逐步指南中向你展示具体方法。我会从最简单的图形开始，以最复杂的图形结束。完成后，你将拥有使用\
  \ Illustrator 创作自己游戏图形所需的所有技能。\n\n本章假定你已经学习过第 2 章的内容，或者已经知道如何使用 Photoshop。\n\n####\
  \ 制作纹理盒子\n\n你要制作的第一个图形是图 7-3 所示的纹理游戏盒子。这种多用途盒子是视频游戏的基本元素，我将借此机会向你展示一些最实用的基础 Illustrator\
  \ 绘图技巧。\n\n![图片](img/9781430239922_Fig07-03.jpg)\n\n**图 7-3.** 纹理游戏盒子\n\n##### 熟悉\
  \ Adobe Illustrator\n\n当你首次启动 Adobe Illustrator 时，你会发现工具和工作区与 Photoshop 惊人地相似，这让人感到安心。但当你开始使用它时，很快就会发现，尽管外观相似，却存在一些根本性的差异。面板的位置不同，使用的许多概念不同，一些键盘快捷键也不同。Photoshop\
  \ 和 Illustrator 之间有相当多的重叠之处，这恰恰是起初让人困惑的原因。正当你以为知道如何操作时，Illustrator 却改变了游戏规则，让你碰壁。但解决方法很简单！不要把它看作是\
  \ Photoshop 的类似物——将其视为一个完全不同的程序。抛开任何先入为主的期望，下定决心从头开始学习。这绝对值得付出努力，因为事实上，一旦你掌握了要领，用\
  \ Illustrator 制作游戏图形反而*比*Photoshop *更容易*。Illustrator 更加宽松，不那么挑剔，而且灵活得多。和 Photoshop\
  \ 一样，学习使用 Illustrator 是一项不错的长期投资。它是目前使用最广泛、功能最强大的图形设计软件包之一，现在花时间认真学习它，将为你未来多年的发展打下坚实基础。\n\
  \n但与 Photoshop 一样，Illustrator 也是一款极其复杂的软件。它可以在无数种配置下进行定制，并且达到任何特定效果通常都有十种或更多种方法。在本章中，我将带你进行一次范围相当窄的\
  \ Illustrator 之旅；我将只涉及它实际功能的大约 5%。不过，和 Photoshop 之旅一样，你会很高兴地知道，你学到的这 5%正是你在游戏图形工作中\
  \ 95%的时间里会使用的技巧。在完成本章学习后，你将能够熟练使用 Illustrator 来创建大量用于游戏的图形，这些技能也将是学习更高级技巧的重要垫脚石——如果你感到灵感迸发的话……你也应该感到振奋！\n\
  \nIllustrator 和 Photoshop 之间最重要的区别之一是，Illustrator 主要是一个制作**矢量图形**的工具。矢量图形是由线条而非像素构成的图片。而\
  \ Photoshop 完全是关于像素的。使用矢量绘图实际上是 Illustrator 的一大特色，因为这意味着你可以将图像缩放到任意尺寸，而不会损失分辨率质量。此外，绘制完成后，你可以选择是将其作为\
  \ PNG 文件（使用像素）还是 SWF 文件（使用矢量）用于你的游戏中。这两种类型在你的 Flash 游戏中都可以使用。\n\n*本书中的所有 Flash 游戏都使用\
  \ PNG 文件，但你可以同样轻松地使用 SWF 文件。你可以通过选择“文件”![图片](img/arrow.jpg)“导出”，然后选择“Flash (swf)”格式，来保存你在\
  \ Illustrator 中制作的任何图形。*\n\n*选择使用 SWF 还是 PNG 文件实际上取决于风格和个人偏好。PNG 图形通常对 Flash Player\
  \ 处理器的压力稍小。这对于通常处理器负荷很重的游戏来说是有利的。另一方面，使用 SWF 图形的游戏可以缩放到任意尺寸，而不会损失分辨率质量。你更喜欢哪种？两种都试试再决定吧！*\n\
  \n在这个项目中你将使用像素，所以第一件事就是告诉 Illustrator 将像素作为它的通用度量单位。通过选择“编辑”![图片](img/arrow.jpg)“首选项”~“单位”（Windows）或“Illustrator”![图片](img/arrow.jpg)“首选项”（OS\
  \ X）打开“首选项”菜单。选择“单位”，并将“常规”选项更改为“像素”。\n\n现在，你将创建你的第一个 Illustrator 文件并开始绘图！\n\n\n\
  \n### 设置工作区\n\n启动 Illustrator 并创建一个名为 `box` 的新文档。\n\n在 Illustrator 主菜单中选择 **文件**\
  \ > **新建**。**新建文档**对话框将打开。更改此窗口中的参数，使其与以下内容匹配（图 7-4 展示了你的**新建文档**窗口应呈现的样子）：\n\n\
  -   **名称**：`box`\n-   **宽度**：`50 px`\n-   **高度**：`50 px`\n-   **单位**：`Pixels`\n\
  -   **颜色模式**：`RGB`（如果看不到此选项，请点击 **高级** 按钮使其可见。）\n\n![Image](img/9781430239922_Fig07-04.jpg)\n\
  \n**图 7-4.** 新文档的参数\n\n宽度和高度以像素为单位指定，但这些实际上只是应用到最终 PNG 文件上的数字。你的所有绘图都将使用矢量完成，这意味着如果你日后改变主意想调整最终图像的大小，你的插图也可以缩放到任意尺寸。Illustrator\
  \ 有一个**像素预览**视图，可以显示矢量图形在像素化后的样子，你很快会了解如何使用它。\n\n另外，非常重要的一点是**颜色模式**必须设置为 `RGB`。`RGB`\
  \ 代表**红**、**绿**、**蓝**，指的是可见光谱。这是一种在任何投射光的媒介（如电脑显示器或电视屏幕）上使用的颜色解释方式，也是你在制作游戏时应该始终使用的模式。另一种广泛使用的颜色系统是\
  \ `CMYK`，代表**青**、**品红**、**黄**和**黑**（“黑”指黑色）。它用于书籍和杂志等印刷图像，描述了油墨涂覆到纸张上的底层过程。\n\n\
  你会注意到最后一个选项叫做**将新建对象对齐到像素网格**。这实际上是一个非常实用的功能，因为它会将你的图形微调到与底层像素网格精确对应的位置。对于你正在制作这类非常小的图像，有时这样操作可能会有点麻烦，因为像素相对较大，你的线条和形状会被大幅度地调整。但对于实现真正的像素级精确度而言，它是必不可少的，所以可以考虑在某个时刻选择此选项。\n\
  \n点击 **确定** 按钮，你会看到一个空白绘图表面，称为**画板**。画板与 Photoshop 中的画布相同——这是你进行所有绘图的地方。你可以在画板周围的灰色区域绘图，但你在那里绘制的任何内容都不会出现在最终图像中。画板周围的灰色区域是尝试技巧或绘图元素的好地方。如果发现能用得上，你可以将它们复制或拖入最终作品。\n\
  \n如果你需要对画板进行任何更改，例如更改其大小，请单击**工具**栏中的**画板工具**（图 7-5）。然后，你可以在贯穿 Illustrator 工作区顶部的**控制面板**中调整画板大小或更改其任何属性。（实际上，你可以在一个\
  \ Illustrator 文档中拥有多个画板，如果你正在创建许多共享某些元素的不同游戏图形，这可能会很有用。你可以在不同画板之间复制和粘贴，而不是在不同文档之间操作。）\n\
  \n![Image](img/9781430239922_Fig07-05.jpg)\n\n**图 7-5.** 使用画板工具更改绘图区域的大小和属性。\n\n\
  *与 Photoshop 一样，Illustrator 允许你选择不同的工作区，这些工作区是工具和面板的自定义布局。默认工作区称为**基本功能**，我建议你目前坚持使用这个。你可以通过从\
  \ Illustrator 主菜单中选择**窗口** > **工作区**，或单击**控制面板**右上角的**基本功能**按钮来更改工作区。如果你因为四处拖动画板、将它们停靠在不寻常的地方或打开/关闭它们而弄得一团糟，只需从这两个菜单中重新选择**基本功能**工作区，所有内容都会重置回原始位置。*\n\
  \n### 选择颜色\n\n我总是苦于为我的游戏选择合适的颜色。幸运的是，你可以让 Illustrator 从预设的色板选项中为你选择，从而简化颜色选择。你可以在工作区右侧的**面板**栏中找到**色板**面板。\n\
  \n![Image](img/9781430239922_Fig07-06.jpg)\n\n**图 7-6.** 打开色板面板。\n\n打开面板时，你会看到一组基本的色板，如图\
  \ 7-6 所示，但 Illustrator 实际上还有许多其他颜色色板集合，它们隐藏在**色板**面板的菜单中。\n\n1.  单击面板右上角的**色板**面板菜单按钮。选择**打开色板库**。将出现一整个不同色板颜色组合的列表。选择你喜欢的任何一个。我为这个项目选择了**儿童用品**，因为它是一组明亮、欢快的颜色，非常适合视频游戏。图\
  \ 7-7 显示了色板库的查找位置。新的色板将在它们自己的面板中打开。\n\n![Image](img/9781430239922_Fig07-07.jpg)\n\
  \n**图 7-7.** 从色板库中选择一组新的色板。\n\n现在你有一组不错的明亮、饱和及柔和的颜色可供选择。\n\n### 绘制外部形状\n\n首先，你要绘制盒子的外部形状。这是一个应用了内发光效果的绿色矩形。\n\
  \n1.  从**工具**栏中选择**矩形工具**（图 7-8）。\n\n    ![Image](img/9781430239922_Fig07-08.jpg)\n\
  \n    **图 7-8.** 选择矩形工具。\n\n2.  单击**工具**栏中的前景色选择器，然后单击一个绿色色板。将描边（轮廓）颜色设为无。（通过选择**工具**面板中的描边颜色选择器，然后单击带有红色斜线的小按钮来完成此操作。如果操作成功，描边颜色上应该有一条匹配的红色斜线。）图\
  \ 7-9 显示了**工具**栏中的前景色和描边颜色应呈现的样子。\n\n    ![Image](img/9781430239922_Fig07-09.jpg)\n\
  \n    **图 7-9.** 选择绿色前景色并将描边颜色设置为无。\n\n3.  同时按住鼠标左键和 **Shift** 键，从画板的最左上角拖动到最右下角。一个实心绿色正方形将填满整个画板，如图\
  \ 7-10 所示。使用**矩形工具**拖动时按住 **Shift** 键，可以让你绘制出完美的正方形。\n\n    ![Image](img/9781430239922_Fig07-10.jpg)\n\
  \n    **图 7-10.** 单击并拖动以绘制一个绿色矩形。\n\n4.  确保矩形仍处于选中状态。（如果没有，请使用黑色箭头工具重新选中它。）选择 **效果**\
  \ > **风格化** > **内发光**。**内发光**窗口将打开，让你配置该效果。确保选中**预览**选项，并使用以下设置配置效果：\n\n    - **模式**：`Normal`\n\
  \    - **不透明度**：`80`\n    - **模糊**：`9px`\n    - **中心**\n\n最终效果将如图 7-11 所示。关于如何选择这些设置没有固定规则——只需随意调整，直到你对效果的样子感到满意为止。\n\
  \n![Image](img/9781430239922_Fig07-11.jpg)\n\n**图 7-11.** 为矩形添加内发光。\n\n如果你需要修改此效果，或你可能添加到绘图对象上的任何其他效果，请确保选中该对象，然后打开**外观**面板（图\
  \ 7-12）。单击效果名称进行修改。你也可以从**外观**面板修改对象的所有其他视觉属性。\n\n![Image](img/9781430239922_Fig07-12.jpg)\n\
  \n**图 7-12.** 外观面板允许你修改对象的所有视觉属性，例如效果、颜色和不透明度。\n\n\n\n### 绘制内部形状\n\n接下来，你将绘制一个带圆角的内层正方形。你需要使用半透明渐变填充它，并添加一个投影效果，使其看起来像是浮在外层正方形之上。\n\
  \n1.  从工具栏中选择`圆角矩形工具`（图 7-13）。`圆角矩形工具`可让你绘制带圆角的方形和矩形。\n\n![图片](img/9781430239922_Fig07-13.jpg)\n\
  \n**图 7-13.** 选择`圆角矩形工具`。\n\n2.  点击工作区顶部`控制面板`中的`首选项`按钮。将`圆角半径`设置为`8px`，然后点击`确定`按钮，如图\
  \ 7-14 所示。圆角半径决定了矩形边角的圆化程度。（你也可以在绘制矩形时，通过按键盘上的上箭头或下箭头来交互式地更改圆角半径。）\n\n![图片](img/9781430239922_Fig07-14.jpg)\n\
  \n**图 7-14.** 在`首选项`窗口中设置圆角矩形的圆角半径。\n\n3.  在你绘制的第一个矩形上方绘制一个任意尺寸的圆角矩形，如图 7-15 所示。其填充颜色无关紧要，但不应有描边颜色。\n\
  \n![图片](img/9781430239922_Fig07-15.jpg)\n\n**图 7-15.** 确保新的圆角矩形没有描边颜色。\n\n4.  确保这个新矩形仍处于选中状态，并在`控制面板`的`X`、`Y`、`W`（宽度）和`H`（高度）字段中输入以下数值：\n\
  \n*   `X: 25`\n*   `Y: 25`\n*   `W: 35`\n*   `H: 35`\n\n这将为正方形设定精确的高度和宽度，并将其居中，如图\
  \ 7-16 所示。\n\n![图片](img/9781430239922_Fig07-16.jpg)\n\n**图 7-16.** 在`控制面板`中输入精确的尺寸和位置。\n\
  \n*现在画板上有两个绘图对象。如果你使用黑色箭头双击其中任何一个，Illustrator 将切换至`隔离模式`。此模式会调暗并禁用画板上除选中对象之外的所有其他对象，以便于你处理选中项。要退出隔离模式，请在选中对象之外的位置双击鼠标。*\n\
  \n接下来，你将使用半透明渐变填充这个新正方形。\n\n1.  打开`渐变`面板。从`色板`面板中将一个浅蓝色色板拖放到渐变预览最左侧的渐变滑块上。再从`色板`面板中将一个黑色色板拖放到渐变预览最右侧的渐变滑块上。将渐变中点滑块向右移动约\
  \ 75%。图 7-17 对此进行了说明。\n\n![图片](img/9781430239922_Fig07-17.jpg)\n\n**图 7-17.** 通过将色板拖入渐变滑块来创建渐变。\n\
  \n2.  选择最右侧的渐变滑块（此时应为黑色），并将`不透明度`值更改为`0`。此时你应该能看到此渐变填充应用到你所绘制的新正方形上。\n3.  在工具栏中选择`渐变工具`。你会看到正方形上出现一个长条。这被称为`渐变批注器`。它是一个非常有用的工具，让你可以通过在画板上移动它来交互式地更改渐变的旋转角度、尺寸和位置。图\
  \ 7-18 显示了你将看到的内容。你可以使用此工具拖拽、旋转、调整大小和变形渐变；你还可以更改渐变的颜色和颜色分布。\n\n![图片](img/9781430239922_Fig07-18.jpg)\n\
  \n**图 7-18.** 选择`渐变工具`以显示`渐变批注器`。\n\n4.  旋转并定位`渐变批注器`，使渐变沿正方形的对角线方向，从左上角延伸到右下角，如图\
  \ 7-19 所示。\n\n![图片](img/9781430239922_Fig07-19.jpg)\n\n**图 7-19.** 旋转并重新定位渐变。\n\n\
  现在添加一个浅投影效果，为内层正方形增加一些深度感。\n\n1.  确保内层正方形仍处于选中状态，然后从 Illustrator 的主菜单中选择`效果` ![图片](img/arrow.jpg)\
  \ `风格化` ![图片](img/arrow.jpg) `投影`。`投影`窗口将打开（参见图 7-20）。输入以下数值：\n\n*   `模式: 正常`\n\
  *   `不透明度: 30`\n*   `X 偏移: 1px`\n*   `Y 偏移: 1px`\n*   `模糊: 2px`\n\n![图片](img/9781430239922_Fig07-20.jpg)\n\
  \n**图 7-20.** 为内层正方形添加投影。\n\n确保选中`预览`选项，以便在设置这些数值时能够看到正方形上的变化。同样，这只是一个选择看起来效果不错的设置的问题。\n\
  \n现在在方框的边角添加一些铆钉。\n\n1.  从工具栏中选择`椭圆工具`。它与`矩形工具`属于同一按钮组。为其设置深绿色填充颜色。\n2.  按住`Shift`键，在外层正方形左上角点击并拖动绘制一个小圆。图\
  \ 2-21 对此进行了说明。使用`椭圆工具`绘制时按住`Shift`键可让你绘制出完美的正圆。\n\n![图片](img/9781430239922_Fig07-21.jpg)\n\
  \n**图 7-21.** 在左上角绘制一个圆形。\n\n3.  使用你刚学到的渐变技巧，用线性渐变填充深绿色圆形。它应该顶部颜色深，底部颜色浅。你的最终结果应该类似图\
  \ 7-22 所示。\n\n![图片](img/9781430239922_Fig07-22.jpg)\n\n**图 7-22.** 在左上角绘制一个圆形。\n\
  \n4.  在第一个圆内部绘制一个较小的深绿色圆形，如图 7-23 所示。\n\n![图片](img/9781430239922_Fig07-23.jpg)\n\
  \n**图 7-23.** 添加一个较小的圆。\n\n*如果你需要完美对齐两个或多个对象，可以使用 Illustrator 的对齐按钮。使用时，按住`Shift`键并用黑色箭头点击所有你想要对齐的对象。对齐按钮将出现在工作区顶部的`控制面板`中。点击任意按钮，你会看到对象神奇地对齐到正确位置。*\n\
  \n*如果你需要将较小的对象居中于较大的对象内部（就像制作这些铆钉时一样），请确保两个圆都被选中，然后点击`水平居中对齐`按钮，接着点击`垂直居中对齐`按钮。*\n\
  \n再复制几个这个铆钉，用于其他三个边角。\n\n1.  使用黑色箭头点击时按住`Shift`键，可以让你选择多个对象。同时选中内圆和外圆。如果你看到两个圆周围都出现了蓝色定界框，就说明操作正确，如图\
  \ 7-24 所示。\n\n![图片](img/9781430239922_Fig07-24.jpg)\n\n**图 7-24.** 按住`Shift`键点击以选择多个对象。\n\
  \n2.  从主菜单中选择`对象` ![图片](img/arrow.jpg) `编组`。编组对象允许你将多个对象作为一个对象来处理。这意味着你可以在画板上移动、复制和粘贴一组对象，它们会作为一个整体保持在一起。你可以通过双击来编辑组中的单个单元。你可以通过选择`对象`\
  \ ![图片](img/arrow.jpg) `取消编组`来取消对象的编组。\n3.  现在两个圆已编组为一个整体，选择`编辑` ![图片](img/arrow.jpg)\
  \ `复制`（或使用键盘快捷键：Windows 系统为`Ctrl+C`，OSX 系统为`Command+C`）。选择`编辑` ![图片](img/arrow.jpg)\
  \ `贴在前面`（或快捷键：Windows 系统为`Ctrl+F`，OSX 系统为`Command+F`）。这会复制该编组并将其直接粘贴到原编组的正上方。\n\
  4.  将复制的编组移动到正方形的右上角，如图 7-25 所示。\n\n![图片](img/9781430239922_Fig07-25.jpg)\n\n**图\
  \ 7-25.** 使用`复制`/`贴在前面`命令复制编组的圆形，并将新副本移动到正方形的右上角。\n\n\n\n5.  再次使用`粘贴到前面`两次，将复制出的铆钉移至正方形底部两个角，如图图\
  \ 7-26 所示。\n\n![图片](img/9781430239922_Fig07-26.jpg)\n\n**图 7-26.** 再复制两个铆钉并放置到相应位置。\n\
  \n至此，您的多功能游戏盒就完成了！\n\n不过，到目前为止您一直在使用矢量图形进行绘制。最终在游戏中使用的`PNG`图像将由像素组成。它会是什么样呢？要查看效果，请从\
  \ Illustrator 主菜单中选择`视图` ![图片](img/arrow.jpg) `像素预览`。您将看到 50×50 像素游戏盒中像素的具体效果，如图图\
  \ 7-27 所示。\n\n![图片](img/9781430239922_Fig07-27.jpg)\n\n**图 7-27.** 像素预览让您看到绘图在像素层面呈现的效果。\n\
  \n这完美展示了矢量图与位图的区别：线条与点阵。实际上，如果您愿意，完全可以全程开启`像素预览`进行绘制。有时这种模式对确保精细作品的像素对齐十分必要，尤其针对小尺寸图形。在下一节设计炸弹图案时，您会体会到它的实用性。（取消勾选`视图`菜单中的`像素预览`即可关闭该模式。）\n\
  \n最后一步是保存作品。\n\n1.  从主菜单中选择`文件` ![图片](img/arrow.jpg) `另存为`。在电脑上选择保存 Illustrator\
  \ 文档的位置，点击`保存`按钮。（Illustrator 文档的扩展名为`.ai`。）\n2.  现在需要制作`PNG`版本。从主菜单中选择`文件` ![图片](img/arrow.jpg)\
  \ `存储为 Web 和设备所用格式`。从`预设`菜单中选择`PNG-24`。点击`保存`按钮，为完成的`PNG`图像选择保存位置。\n\n以上内容涵盖了 Illustrator\
  \ 的多种不同技巧。让我们加快节奏，设计炸弹图案吧。\n\n\n\n#### 制作炸弹\n\n绘制炸弹图形可以让您有机会使用 Illustrator 的钢笔工具和星形工具，并展示如何将两个或多个形状合并为一个。\n\
  \n1.  新建一个 Illustrator 文档，命名为`bomb`。保持所有新文档设置与绘制盒子时相同，但将宽度改为`40`，高度改为`30`。\n2. \
  \ 选择`椭圆`工具。按住`Shift`键并拖动，绘制一个与画板高度相等的正圆。（如果要以圆心为起点绘制圆形，请按住`Alt`（Windows）或`Option`（OSX）键。）\n\
  3.  为圆形填充一个颜色极深、近乎黑色的径向渐变，如图 7-28 所示。将圆形放置在画板的左侧。\n\n    ![图片](img/9781430239922_Fig07-28.jpg)\n\
  \n    **图 7-28.** 绘制一个带有深色径向渐变的圆形。\n\n4.  选择`渐变`工具。使用渐变注释器重新定位渐变中心，使其最亮区域靠近圆形的左上方（图\
  \ 7-29）。这将产生高光效果，赋予圆形一种立体感，仿佛它是一个球体。\n\n    ![图片](img/9781430239922_Fig07-29.jpg)\n\
  \n    **图 7-29.** 旋转并移动渐变以创建球体高光效果。\n\n5.  绘制一个大小约为圆形五分之一的黑色矩形。使用白色箭头工具收窄左右两个角。Illustrator\
  \ 中的箭头工具与 Photoshop 中的完全相同。最终你会得到一个类似图 7-30 的形状。\n\n    ![图片](img/9781430239922_Fig07-30.jpg)\n\
  \n    **图 7-30.** 绘制一个收窄的黑色矩形。\n\n6.  旋转这个新形状并将其移动到圆形的左上边缘。让它与圆形略微重叠，如图 7-31 所示。\n\
  \n    ![图片](img/9781430239922_Fig07-31.jpg)\n\n    **图 7-31.** 将新形状移动到圆形上方。\n\n\
  \    接下来的技巧是将新形状移动到圆形的后方。在 Photoshop 中，你可以通过将新形状的图层移到圆形图层下方来实现。Illustrator 与 Photoshop\
  \ 一样有图层，但你通常不需要使用它们。形状通常通过调整它们在单个图层上的堆叠顺序来进行分层。让我们看看如何操作。\n\n7.  确保新形状仍处于选中状态。在主菜单中选择`对象`\
  \ ![图片](img/arrow.jpg) `排列` ![图片](img/arrow.jpg) `后移一层`。新形状将定位到圆形下方，如图图 7-32 所示。\n\
  \n    ![图片](img/9781430239922_Fig07-32.jpg)\n\n    **图 7-32.** 将新形状移动到圆形后方。\n\n\
  \    将形状移动到其他形状的前方或后方，在 Illustrator 中是如此常见的操作，以至于你可能很想学习实现此操作的键盘快捷键。首先，按住`CTRL`（Windows）或`Command`键（OSX）。然后按下方括号键`[`和`]`，即可在堆叠顺序中将对象前移或后移。如果同时按住`Shift`键，所选形状将跳转到堆叠顺序的最顶层或最底层。这个方法非常有效，你会发现通常只有在处理非常复杂的形状时才需要使用图层。\n\
  \n    现在将这两个形状合并在一起。\n\n8.  在主菜单中选择`窗口` ![图片](img/arrow.jpg) `路径查找器`，打开`路径查找器`面板。`路径查找器`面板有多个按钮，可以让你合并或减去形状。\n\
  9.  按住`Shift`键，使用黑色箭头分别点击两个形状以同时选中它们。你也可以通过选择主菜单中的`选择` ![图片](img/arrow.jpg) `全部`来选择所有形状。或者使用方便的键盘快捷键：`Ctrl+A`（Windows）或`Command+A`（OSX）。当两个形状都被选中时，你会看到它们都被蓝色的定界框包围。图\
  \ 7-33 显示了应呈现的样子。\n\n    ![图片](img/9781430239922_Fig07-33.jpg)\n\n    **图 7-33.**\
  \ 同时选中两个形状。\n\n10.  点击`路径查找器`面板中的`联集`按钮，如图 7-34 所示。此时两个形状已合并成一个。\n\n    ![图片](img/9781430239922_Fig07-34.jpg)\n\
  \n    **图 7-34.** 使用路径查找器面板合并形状。\n\n当你这样合并形状时，下方形状会继承上方形状的着色品质。你会注意到，收窄的矩形现在与覆盖着它的圆形黑色径向渐变无缝融合。你也可以使用`路径查找器`菜单从一个形状中减去另一个形状。有时间的话可以尝试一下，你会发现它在制作复杂的复合形状时非常有用。\n\
  \n接下来是制作炸弹的导火索。你将使用`钢笔`工具绘制一条路径来完成此操作。Illustrator 的`钢笔`工具与 Photoshop 中的完全相同，如果你不确定如何使用，请回顾第\
  \ 2 章中的相关部分。在绘制和调整路径时，你需要在黑色箭头、白色箭头和`转换锚点`工具之间频繁切换，因此掌握以下键盘快捷键非常有用：\n\n*   黑色箭头（选择工具）：`V`\n\
  *   白色箭头（直接选择工具）：`A`\n*   转换锚点：`Shift+C`\n*   另外，不妨也记一下`钢笔`工具本身的快捷键：`P`\n\n（黑白箭头的快捷键很容易记，因为字母`A`和`V`看起来有点像箭头。）\n\
  \n使用这些工具绘制炸弹的导火索。\n\n1.  绘制一条类似图 7-35 的曲线路径。（操作时确保未选择填充或描边颜色，这样更容易集中精力精确绘制路径。）\n\
  \n    ![图片](img/9781430239922_Fig07-35.jpg)\n\n    **图 7-35.** 使用钢笔和箭头工具为导火索绘制路径。\n\
  \n2.  选择一种深棕色作为描边颜色。\n3.  打开`描边`面板。将粗细设置为`0.25`。对于线条来说，这通常是窄得不可思议的宽度，但由于你的炸弹图形非常小，你会发现这个宽度非常合适。（通常情况下，你会将线条粗细设置在`1`到`5`像素之间。）`描边`面板允许你设置线条和轮廓的所有属性，还允许你进行一些有用的操作，比如添加箭头或更改线条样式。图\
  \ 7-36 展示了在哪里找到`描边`面板以及它的外观。\n\n    ![图片](img/9781430239922_Fig07-36.jpg)\n\n  \
  \  **图 7-36.** 描边面板允许你更改线条的所有属性。\n\n    现在，你要为你绘制的路径添加一种艺术画笔描边。\n\n4.  打开`画笔`面板，如图\
  \ 7-37 所示。\n\n    ![图片](img/9781430239922_Fig07-37.jpg)\n\n    **图 7-37.** 画笔面板允许你为线条选择画笔样式。\n\
  \n5.  你将加载`艺术画笔-油墨`画笔库，它隐藏在`画笔`菜单中。点击`画笔`面板右上角的菜单按钮。选择`打开画笔库` ![图片](img/arrow.jpg)\
  \ `艺术` ![图片](img/arrow.jpg) `艺术画笔-油墨`。这将把`艺术画笔-油墨`画笔库作为一个新面板打开。\n6.  从`艺术画笔-油墨`画笔库中选择`锥形圆角`画笔，如图\
  \ 7-38 所示。你会看到画笔样式被应用到你绘制的路径上，最终效果应该类似图 7-39。\n\n    ![图片](img/9781430239922_Fig07-38.jpg)\n\
  \n    **图 7-38.** 为炸弹的导火索选择一种艺术画笔样式。\n\n    ![图片](img/9781430239922_Fig07-39.jpg)\n\
  \n    **图 7-39.** 画笔样式被应用到路径上。\n\n7.  你需要将导火索移动到炸弹形状的后方。确保导火索仍被选中，然后从主菜单中选择`对象`\
  \ ![图片](img/arrow.jpg) `排列` ![图片](img/arrow.jpg) `置于底层`。（你也可以右键点击它，从选项菜单中选择`排列`\
  \ ![图片](img/arrow.jpg) `置于底层`，或者在 Windows 中按住`Shift+Ctrl+`，或在 OSX 中按住`Shift+Command+[`。）现在导火索将位于炸弹后方，如[图\
  \ 7-40 所示。\n\n    ![图片](img/9781430239922_Fig07-40.jpg)\n\n    **图 7-40.** 使用“置于底层”命令将导火索定位在炸弹形状后方。\n\
  \n    最后一步是在导火索的末端添加一个火花。你将使用`星形`工具来完成此操作。\n\n8.  从工具栏中选择`星形`工具（图 7-41）。你可以在与矩形和椭圆工具相同的按钮组中找到它。\n\
  \n    ![图片](img/9781430239922_Fig07-41.jpg)\n\n    **图 7-41.** 星形工具允许你绘制星星。\n\n\
  9.  `星形`工具名副其实：你可以用它绘制星星！点击并拖动以绘制星形，但在释放左键之前，按下键盘上的上、下箭头键。这将增加或减少星形的角点数。当对角点数量满意后，释放鼠标左键。\n\
  10.  为星形添加径向渐变填充。将渐变的中心设为黄色，外部设为红色。将星形定位在导火索末端，并调整其大小至合适尺寸。图 7-42 展示了可能得到的效果。\n\n\
  \    ![图片](img/9781430239922_Fig07-42.jpg)\n\n    **图 7-42.** 使用星形工具为导火索添加火花。\n\n\
  你可以通过`效果` ![图片](img/arrow.jpg) `模糊`菜单添加高斯模糊来改善此效果，但在本例中，由于图形尺寸很小，这不会对它在最终游戏舞台上的显示效果产生任何影响。\n\
  \n因为这是一个非常小的图像，你需要确保所有像素都保持在画板边界内，并且所有内容都对齐良好。选择`视图` ![图片](img/arrow.jpg) `像素预览`来查看图像的实际像素效果。Illustrator\
  \ 在将矢量转换为像素方面做得不错，但永远比不上你自己的眼睛。你可能会发现图像的某些部分超出了画板边缘，比如图 4-43 中的火花。如果是这样，请将它们移回内部。（你可以使用键盘上的箭头键非常精确地移动。如果在按箭头键的同时按住`Shift`键，可以以更大的增量移动对象。）利用`像素预览`的机会，重新定位或调整任何看起来不合适的部分。当你处理小型图形（大多数游戏图形都是如此）时，最好在设计过程中间歇性地打开`像素预览`，以便快速捕获此类小问题。\n\
  \n![图片](img/9781430239922_Fig07-43.jpg)\n\n**图 7-43.** 使用像素预览重新定位、对齐或重新调整任何外观异常的图形。\n\
  \n最后，保存文件并创建 PNG 图像。\n\n1.  选择`文件` ![图片](img/arrow.jpg) `另存为`，并在你的计算机上找到合适的位置保存文件。\n\
  2.  选择`文件` ![图片](img/arrow.jpg) `存储为 Web 和设备所用格式`。将文件保存为 PNG 格式。\n\n接下来，通过创建一个简单的游戏角色来学习更多有用的\
  \ Illustrator 技巧。\n\n\n\n#### 制作游戏角色\n\n游戏角色由几个基本形状构成，你可以将其作为起点，发挥自己的创意来设计游戏角色。\n\
  \n#### 设置文档并绘制身体\n\n1.  创建一个新的 Illustrator 文档，宽度和高度设置为 50 x 50 像素。将文档命名为 `character`。\n\
  2.  使用椭圆工具绘制一个略微扁平的椭圆。为其添加一个从浅蓝到深灰的径向渐变。移动渐变的中点，使其大约位于 85% 的左侧位置。这个椭圆将作为角色的身体。将椭圆定位，使其底边与画板底部对齐。为其设置\
  \ 1pt 的黑色描边颜色。图 7-44 展示了预期效果。\n\n![图片](img/9781430239922_Fig07-44.jpg)\n\n**图 7-44.**\
  \ 使用椭圆工具绘制角色的身体。\n\n#### 绘制天线\n\n游戏角色需要一对闪亮的金属天线。在接下来的几个步骤中，你将用两个部分制作第一根天线，将它们组合在一起，然后连接到身体上。\n\
  \n1.  首先，绘制一个小而细长的椭圆形。你可以在画板边缘之外的灰色绘图区域绘制它，以便有足够的操作空间。\n\n在“色板”面板中，点击面板右上角的菜单按钮。选择\
  \ `打开色板库` > `渐变` > `金属`。这将打开一个渐变面板，其中模拟了光线在不同类型金属上的反射效果。选择 `钢色径向` 渐变作为椭圆的填充颜色。将其描边颜色设置为无。图\
  \ 7-45 展示了椭圆此时的外观。\n\n![图片](img/9781430239922_Fig07-45.jpg)\n\n**图 7-45.** 绘制一个椭圆并用金属渐变填充。\n\
  \n色板库中有多种像这样的渐变预设，你在为游戏对象上色时肯定会经常用到。有空不妨花些时间探索一下。\n\n2.  选择渐变工具。使用渐变批注器移动渐变，使白色高光位于椭圆的左上角。压扁渐变，使其形状与椭圆相同，但稍微小一点。拖动定义渐变区域的虚线线上的小黑圆圈即可实现此操作。你可以在图\
  \ 7-46 中看到这一点。\n\n![图片](img/9781430239922_Fig07-46.jpg)\n\n**图 7-46.** 扭曲渐变，使其形状与椭圆大致相同。\n\
  \n绘制一个略微倾斜的锥形矩形。使用转换路径工具将其底部弯曲。它看起来应该有点像图 7-47。这将成为天线的底座。\n\n![图片](img/9781430239922_Fig07-47.jpg)\n\
  \n**图 7-47.** 绘制天线的底座。\n\n将新锥形矩形的描边颜色设置为无。选择吸管工具，点击你在步骤 5 中绘制的椭圆的中心。锥形矩形现在将填充与椭圆相同的渐变，如图\
  \ 7-48 所示。\n\n![图片](img/9781430239922_Fig07-48.jpg)\n\n**图 7-48.** 使用吸管工具为天线底座填充与椭圆相同的渐变。\n\
  \n3.  选择渐变工具，重新定位锥形矩形上的渐变，使其中心刚好在底座上方。同时使其稍微更宽更长。你可以在图 7-49 中看到结果。\n\n![图片](img/9781430239922_Fig07-49.jpg)\n\
  \n**图 7-49.** 重新定位天线底座上的渐变。\n\n将椭圆移动到矩形锥形端的上方，并使用 `对象` > `排列` > `置于顶层` 命令将其置于最前面。同时选中两个形状并组合它们（从主菜单中选择\
  \ `对象` > `编组`）。图 7-50 显示了结果。\n\n![图片](img/9781430239922_Fig07-50.jpg)\n\n**图 7-50.**\
  \ 将天线的两个部件编组，以便将它们作为一个整体移动。\n\n现在你拥有了一根漂亮的金属天线，可以粘到角色的身体上。\n\n4.  定位并旋转编组后的天线，使其在画板的左上角向外倾斜。在定位时，你可能希望打开“像素预览”，以确保没有杂散像素越过画板边界。调整天线的尺寸和比例，直到你对其附着在身体上的外观满意为止。请记住，如果需要，你可以双击编组内的任何形状进入隔离模式进行单独编辑。图\
  \ 7-51 展示了最终结果。\n\n![图片](img/9781430239922_Fig07-51.jpg)\n\n**图 7-51.** 将天线连接到身体上。\n\
  \n#### 制作第二根天线\n\n你将通过复制第一根天线，然后使用“镜像”命令将其翻转来制作第二根天线。\n\n1.  确保编组后的天线仍处于选中状态。选择\
  \ `编辑` > `复制`，然后选择 `编辑` > `贴在前面`。这将制作天线的精确副本，并将其粘贴到原件的正上方。\n2.  从主菜单中选择 `对象` > `变换`\
  \ > `镜像`。将打开“镜像”窗口。选择类型为“垂直”，并将角度设置为 90 度。点击“确定”按钮，你将看到新复制的天线被翻转了过来（图 7-52）。\n\n\
  \    ![图片](img/9781430239922_Fig07-52.jpg)\n\n    **图 7-52.** 镜像复制的天线。\n\n3.  将新天线移动到身体的左侧，如图\
  \ 7-53 所示。\n\n    ![图片](img/9781430239922_Fig07-53.jpg)\n\n    **图 7-53.** 身体和两根天线\n\
  \n最后需要做的事情是重新定位第二根天线上的渐变，使其看起来光线以与第一根天线相同的角度照射到它。\n\n4.  双击新天线中的椭圆进入隔离模式。选择渐变工具，用它旋转渐变并将其中心移动到左上角。最终效果应类似于图\
  \ 7-54。\n\n    ![图片](img/9781430239922_Fig07-54.jpg)\n\n    **图 7-54.** 校正第二天线上高光的位置。\n\
  \n身体和天线已经完成；接下来你将处理角色的眼睛。\n\n\n\n#### 制作角色的眼睛\n\n角色的眼睛非常简单，由三个圆形组成。\n\n1.  在左侧触角下方绘制一个白色圆形（图\
  \ 7-55）。\n    ![图片](img/9781430239922_Fig07-55.jpg)\n    **图 7-55**. 眼睛的第一个圆形\n\n\
  \    在第一个圆形内部绘制一个更小的圆形。用蓝色到白色的径向渐变填充它（图 7-56）。\n    ![图片](img/9781430239922_Fig07-56.jpg)\n\
  \    **图 7-56**. 用径向渐变填充第二个圆形。\n\n2.  在第二个圆形内部添加一个更小的黑色圆形。用黑色到深灰色的径向渐变填充它（图 7-57）。这是眼睛的瞳孔。\n\
  \    ![图片](img/9781430239922_Fig07-57.jpg)\n    **图 7-57**. 用深色径向渐变填充第三个圆形。\n\n\
  3.  绘制三个大小不同的白色圆形，并将其按图 7-58 所示放置。这些被称为高光。它们模拟环境光反射，为角色的眼睛增添生气与活力。\n    ![图片](img/9781430239922_Fig07-58.jpg)\n\
  \    **图 7-58**. 添加三个高光。\n\n4.  将所有圆形编组。复制它们以制作第二只眼睛。将第二只眼睛放置在身体右侧。\n\n图 7-59 展示了角色拥有新眼睛后的样子。\n\
  ![图片](img/9781430239922_Fig07-59.jpg)\n**图 7-59**. 角色的眼睛\n\n#### 添加微笑\n\n目前角色看起来有点过于严肃了。你应该让它有点值得微笑的事情。\n\
  \n1.  在眼睛正下方绘制一个拉长的椭圆。给它一个 1pt 的黑色描边轮廓和粉色填充颜色，如图 7-60 所示。\n    ![图片](img/9781430239922_Fig07-60.jpg)\n\
  \    **图 7-60**. 绘制一个带有黑色轮廓的粉色椭圆。\n\n2.  确保它被选中，然后从主菜单中选择**效果** ![图片](img/arrow.jpg)\
  \ **变形** ![图片](img/arrow.jpg) **弧形**。将打开“变形选项”窗口。设置以下选项：\n    - 样式：弧形\n    - 水平\n\
  \    - 弯曲：-17%\n\n    完成后点击**确定**按钮，椭圆将变形为微笑的形状，如图 7-61 所示。\n    ![图片](img/9781430239922_Fig07-61.jpg)\n\
  \    **图 7-61**. 使用弧形变形效果让角色微笑。\n\nIllustrator 有大量的变形效果，您可以利用它们快速轻松地将简单形状转换为非常复杂的形状。\n\
  \n#### 召唤造型师！\n\n通过在两根触角之间简单地添加三个三角形，为角色添加头发。\n\n1.  从工具栏中选择**多边形工具**。多边形工具与矩形和椭圆工具位于同一按钮组中。您可以使用它通过按上箭头或下箭头键来创建任意边数的多边形。单击并拖动以创建一个多边形，但在释放鼠标按钮之前，按下下箭头键。当多边形变成三角形时释放鼠标按钮。\n\
  2.  为三角形填充黑色，并将其放置在两根触角之间、身体后方，如图 7-62 所示。调整其大小使其恰到好处。\n    ![图片](img/9781430239922_Fig07-62.jpg)\n\
  \    **图 7-62**. 使用多边形工具绘制一个黑色三角形。\n\n3.  复制此三角形，并使用**编辑** ![图片](img/arrow.jpg)\
  \ **贴在后面**命令将副本粘贴到原件后面。将其移动到第一个三角形的左侧，并旋转使其与身体的曲线对齐。再制作一个三角形副本，并将其放置在第一个三角形的右侧。最终，您的角色将拥有一个尖刺发型，如图\
  \ 7-63 所示。打开**像素预览**以确保任何三角形的尖点没有超出画板。\n    ![图片](img/9781430239922_Fig07-63.jpg)\n\
  \    **图 7-63**. 角色的新发型\n\n您快完成了！您只需给角色添上脚。\n\n#### 绘制鞋子\n\n您将使用钢笔工具绘制鞋子，并为其添加一个简单的从深色到浅色的线性渐变。\n\
  \n1.  使用**钢笔工具**粗略绘制出左鞋的形状（图 7-64）。\n    ![图片](img/9781430239922_Fig07-64.jpg)\n\
  \    **图 7-64**. 绘制基本路径。\n\n2.  使用**转换锚点工具**将边缘变圆（图 7-65）。\n    ![图片](img/9781430239922_Fig07-65.jpg)\n\
  \    **图 7-65**. 将边缘变圆。\n\n3.  为鞋子添加白色到灰色的线性渐变填充。\n4.  使用黑色箭头调整、缩放或重新定位鞋子，使其恰好适合画板的左半部分。使用**像素预览**确认这一点（图\
  \ 7-66）。\n    ![图片](img/9781430239922_Fig07-66.jpg)\n    **图 7-66**. 在像素预览模式下使用黑色箭头微调鞋子的大小和位置。\n\
  \n5.  如果一切看起来不错，再复制一只鞋子。然后从主菜单中选择**对象** ![图片](img/arrow.jpg) **变换** ![图片](img/arrow.jpg)\
  \ **对称**，将新的鞋子副本翻转过来。将其移动到角色的右侧。\n\n角色基本完成了！图 7-67 展示了它现在的样子。\n![图片](img/9781430239922_Fig07-67.jpg)\n\
  **图 7-67**. 即将完成的游戏角色\n\n您可以让角色保持这个样子，这在游戏中已经足够好了。但让我们再更进一步。\n\n#### 增添额外的可爱感\n\n\
  最后的润色是给角色添加红润的脸颊。\n\n1.  在角色眼睛下方添加两个圆形。用透明到浅粉色的径向渐变填充它们。效果很微妙，但为角色的深度和生动性增添了一些东西。您最终的目标图像应该看起来像图\
  \ 7-68。\n    ![图片](img/9781430239922_Fig07-68.jpg)\n    **图 7-68**. 添加一些红润的脸颊。\n\
  \n2.  最后，保存您的工作并创建 `character.png` 文件。\n\n下一步是设计游戏背景屏幕。\n\n\n\n### 设计游戏场地\n\n我不会一步步教你如何制作游戏背景，而是会解释它是如何制作的。这里没有用到任何新技巧，而且你现在的\
  \ Illustrator 技能应该已经足够让你轻松创作出类似的效果。\n\n我首先创建了一个 550 x 400 像素的文档。为了简化工作，我让 Illustrator\
  \ 的网格可见，并将网格单元格大小设置为 50 x 50 像素。游戏中没有对象大于 50 像素见方，因此以此为基本尺寸来规划游戏场地的布局是合理的。\n\n要设置网格大小，请选择\
  \ 编辑 ![Image](img/arrow.jpg) 首选项 ![Image](img/arrow.jpg) 参考线和网格 (Windows) 或 Illustrator\
  \ ![Image](img/arrow.jpg) 首选项 ![Image](img/arrow.jpg) 参考线和网格 (OSX)。将 `网格线间隔：` 选项设置为\
  \ `50px`。\n\n定义好网格单元格大小后，通过选择 视图 ![Image](img/arrow.jpg) 显示网格 使其可见。然后选择 视图 ![Image](img/arrow.jpg)\
  \ 对齐到网格 选项，这样对象就会整齐地对齐到网格方块上。\n\n完成这些后，我复制了我的盒子图形。我移除了角上的铆钉，并将它复制到每个网格方块中。然后我将所有方块编组，并在“透明度”面板中将其不透明度设置为\
  \ 40%。图 7-69 展示了其效果。\n\n![Image](img/9781430239922_Fig07-69.jpg)\n\n**图 7-69.**\
  \ 创建游戏背景的过程\n\n为了制作边框，我首先创建了一个新图层。我沿着周边复制了盒子图形。我将它们编组，并添加了阴影效果，使其看起来像是边框略微漂浮在主游戏场地上方。然后，我绘制了一个带白色描边颜色的黑色圆角矩形，放置在顶部边框上。这里将显示游戏计时器。最终结果可以在\
  \ 图 7-70 中看到。\n\n![Image](img/9781430239922_Fig07-70.jpg)\n\n**图 7-70.** 完成的背景图形\n\
  \n“游戏结束”图形同样很容易制作。\n\n### 制作游戏结束图形\n\n为了制作“游戏结束”图形的爆炸效果，我首先绘制了一个简单的星形，并填充了红黄径向渐变。然后，我从“效果”菜单中添加了“鱼眼弯曲”效果，只是为了让它稍微膨胀一点。接着，我从“效果”菜单中添加了“内凹和外凸”效果。简单的投影完成了最终效果，你可以在\
  \ 图 7-71 中看到最终效果。制作它花了不到 30 秒。\n\n![Image](img/9781430239922_Fig07-71.jpg)\n\n**图\
  \ 7-71.** 应用于星形以创建卡通爆炸效果的各种效果。\n\n实际上，这只是在那些效果菜单中调整参数的问题，直到我在画板上看到满意的结果为止。\n\n3D\
  \ 文字同样很容易制作。我使用 Emulogic 字体键入了“GAME OVER”字样。我给了文字亮绿色填充和白色轮廓颜色。然后，我应用了“效果” ![Image](img/arrow.jpg)\
  \ “3D”菜单中的“凸出和斜角”效果。同样，这只需要调整效果参数，直到结果看起来不错为止。最后，我稍微旋转了文字。图 7-72 显示了最终结果。又花了 30\
  \ 秒，时间花得值！\n\n![Image](img/9781430239922_Fig07-72.jpg)\n\n**图 7-72.** 使用“凸出和斜角”效果创建\
  \ 3D 文字。\n\n图 7-73 显示了最终的“游戏结束”图形。当此图形在游戏中显示时，“You Won!”或“You Lost!”字样将显示在“GAME\
  \ OVER”文字下方。\n\n![Image](img/9781430239922_Fig07-73.jpg)\n\n**图 7-73.** 完成的游戏结束图形\n\
  \n所有图形都完成了，所以将 PNG 文件复制到游戏项目的 images 文件夹中。现在让我们看看如何编程实现这个游戏。\n\n*关于 Adobe Illustrator，你现在已经掌握足够多的知识，可以开始制作复杂的游戏图形了。但是，你肯定还想了解更多关于\
  \ Illustrator 的知识，首先要查阅的是 Illustrator 自带的帮助菜单。选择 帮助 ![Image](img/arrow.jpg) Illustrator\
  \ 帮助，Adobe 帮助应用程序将打开，按章节逐一介绍 Illustrator 的功能及其使用方法。*\n\n*Adobe 还维护着一个优秀的教程网站，其中包含许多关于如何使用基本功能和实现特殊效果的视频。你可以在\
  \ Adobe 的支持网站 [`www.adobe.com/support/illustrator/`](http://www.adobe.com/support/illustrator/)\
  \ 上找到更多信息。*\n\n### 编程实现游戏\n\n`Time Bomb Panic` 结合了你在本书中学到的所有编程技巧。当你查看代码时，你会发现其中\
  \ 90% 或多或少与你在前几章中使用的代码相同。这很好，因为它表明你可以在真实游戏的上下文中使用你一直在学习的所有代码。没有太多新的东西需要学习。\n\n那么你之前没见过的那\
  \ 10% 呢？以下是你要学习的新内容：\n\n*   如何创建和使用 `Timer` 对象。像随机数一样，定时器对于大多数类型的视频游戏都是必不可少的。\n\
  *   如何为所有游戏对象创建单独的类。\n*   如何使用自定义方法来简化和减少重复代码。\n\n你将全面了解所有这些新特性，以及游戏处理你之前见过的几种技术的特定方式，例如：\n\
  \n*   盒子和炸弹之间的碰撞检测。\n*   舞台边界。\n*   检查游戏是否结束。\n*   显示游戏结束图像。\n\n当你完成时，你应该拥有制作类似复杂度游戏所需的所有信心。\n\
  \n### 处理多个对象\n\n在你查看主应用类的代码之前，必须克服一个大问题：这个游戏中有很多对象。如果你在开始编程游戏之前找不到管理它们的方法，你将陷入数百行重复代码的泥潭。\n\
  \n有多少个对象？你已经创建了五个游戏图形，所以至少有五个。但其中许多图像，如盒子和炸弹，在游戏中会被多次使用。仔细看看 图 7-74。根据你现在对游戏编程的了解，你认为你需要处理多少个对象？\n\
  \n![Image](img/9781430239922_Fig07-74.jpg)\n\n**图 7-74.** 如果一个游戏有很多对象，你如何让代码易于管理？\n\
  \n你有 14 个盒子、5 个炸弹、1 个角色、1 个背景、1 个可见文本字段，以及在游戏结束时出现的“游戏结束”图形。这个“游戏结束”图形还包含另一个文本字段。总共有\
  \ 24 个对象。在前几章的示例程序中，最多只有五个。\n\n为什么这是个问题？想想看，你仅仅是为了创建并向游戏添加一个对象就需要编写多少代码。首先，你必须嵌入图像，创建\
  \ `DisplayObject` 容器，并创建包含的 `Sprite`，如下所示：\n\n```\n[Embed(source=\"../images/character.png\"\
  )]\npublic var CharacterImage:Class;\npublic var characterImage:DisplayObject =\
  \ new CharacterImage();\npublic var character:Sprite = new Sprite();\n```\n\n然后，你必须将图像添加到\
  \ `Sprite`，将 `Sprite` 添加到舞台，并定位它，如下所示：\n\n```\ncharacter.addChild(characterImage);\n\
  stage.addChild(character);\ncharacter.x = 300;\ncharacter.y = 150;\n```\n\n这仅仅是针对一个对象的八行代码。对于这个游戏中的\
  \ 24 个对象，你需要将这段相同的代码重复 24 次。仅仅为了将所有对象添加到游戏中，你最终会得到 192 行重复的代码。\n\n这简直无法管理，所以让我们学习一种更好的方法。你将把所有对象都放在它们各自的类中，然后使用一个自定义方法来将它们添加到舞台上并定位它们。\n\
  \n\n\n#### 什么是类（class）？\n\n我已经讨论了很多关于类的内容，但如果你对我试图解释的内容理解不多，也不必担心。除非你面前有一个真实、鲜活的类，否则这可能是一个非常抽象的概念。所以，让我们来看一些真实、鲜活的类吧！\n\
  \n在这本书中，你已经见过很多类了。\n\n- `AS3.0` 的内置类，比如 `Sprite`、`TextField` 和 `Event`，你可以将它们导入到程序中。\n\
  - 你编写主程序时使用的应用类，比如 `PickingUpObjects`、`KeyboardControl` 或 `NumberGuessingGame`。到目前为止，我一直称它们为“程序”，但它们实际上是“应用类”。\n\
  - 第 6 章中的 `Collision` 类，它是一个专门的类，帮助你创建游戏对象之间的碰撞边界。\n\n很好，但类到底是什么？简而言之，它只是你游戏中的一个“东西”。你可以为你想要在游戏中使用的任何对象创建一个类。这些对象可以是抽象的代码片段，比如\
  \ `Collision` 类，也可以是你在舞台上看到的真实游戏对象。\n\n那么，如果“类”只是一个“东西”，这是否意味着你应该能够为游戏中的每一个东西都创建一个类？当然可以！为了证明这一点，打开\
  \ `TimeBombPanic` 项目文件夹，查看 `src` 文件夹。你会看到这些文件（也如图 7-75 所示）：\n\n- `TimeBombPanic.as`\n\
  - `Collision.as`\n- `Character.as`\n- `Box.as`\n- `Bomb.as`\n- `Background.as`\n\
  - `GameOver.as`\n\n![Image](img/9781430239922_Fig07-75.jpg)\n\n**图 7-75**。Time Bomb\
  \ Panic 中使用的类。每个游戏对象都有一个类。\n\n现在你知道了，`TimeBombPanic.as` 是应用类——主程序。而且你知道 `Collision.as`\
  \ 是你在第 6 章中编写的专门类。但你可以清楚地看到，现在还有五个类，分别对应你在本章第一部分用 Illustrator 绘制的五个游戏对象。\n\n这些类是做什么的？非常简单。它们所做的只是将嵌入的图像加载到自身中。为了证明这一点，让我们看看\
  \ `Character` 类。\n\n```\npackage\n{\n  import flash.display.DisplayObject;\n  import\
  \ flash.display.Sprite;\n\n  public class Character extends Sprite\n  {\n    //Embed\
  \ the image\n    [Embed(source=\"../images/character.png\")]\n    public var GameObjectImage:Class;\n\
  \    public var gameObjectImage:DisplayObject\n      = new GameObjectImage();\n\n\
  \    public function Character()\n    {\n      this.addChild(gameObjectImage);\n\
  \    }\n  }\n}\n```\n\n`Character` 类的工作就是显示 `character.png` 图像。仅此而已！而且你已经见过所有这些代码——它就是那六行你总是用来嵌入和显示图像的相当冗长的代码。\n\
  \n这为什么有用？这意味着，因为你已经在这个类中编写了这段代码，你永远不必再写一遍，并且可以在你编写的任何其他游戏中重复使用它。你很快就会看到它的作用。\n\n\
  我需要指出两个细节。首先，`Character` 类继承了 `Sprite` 类。\n\n```\npublic class Character extends\
  \ Sprite\n```\n\n这意味着你使用 `Character` 类创建的任何游戏对象，本质上都是 `Sprite` 对象。`extends` 关键字意味着\
  \ `Character` 类已经*继承*了 `Sprite` 类的所有属性和方法。这意味着你可以使用所有你通常与 `Sprite` 对象一起使用的属性和方法。像\
  \ `x`、`y`、`visible`、`alpha` 这样的属性，或者像 `addChild` 这样的方法，都对你用这个新的 `Character` 类创建的任何对象起作用。\n\
  \n*这是一个重要的编程概念，称为继承。当你使用 `extends` 关键字时，你正在创建的新类会“继承”被扩展类的所有属性和方法。继承是面向对象编程（OOP）风格的一个关键特性。`AS3.0`\
  \ 是一种 OOP 语言，`Java`、`C++`、`C#` 和 `Objective C` 也是如此。*\n\n这也意味着你不必创建一个单独的 `Sprite`\
  \ 对象并将图像添加到其中。图像已经封装在一个 `Sprite` 中，因为 `Character` 扩展了 `Sprite` 类。\n\n所有这一切意味着 `Character`\
  \ 对象能够做 `Sprite` 对象能做的一切事情，而且还额外显示了游戏角色的图像。\n\n但是 `character.png` 实际上是在哪里显示的呢？它不是显示在舞台上。它是在*这个*类内部显示的。这就是这行代码的作用：\n\
  \n```\nthis.addChild(gameObjectImage);\n```\n\n关键字 `this` 表示“这个类”。这行代码的意思是你正在将 `gameObjectImage`\
  \ 添加到*这个* `Character` 类中。结果是，无论何时你在游戏中使用 `Character` 类对象，`character.png` 图像都会自动显示出来。它是这个类的一部分。\n\
  \n为什么你之前没有像在其他程序中那样使用 `stage.addChild()`？那是因为只有应用类才能直接将东西添加到舞台上。在这种情况下，应用类是 `TimeBombPanic.as`。你很快就会看到它如何将\
  \ `Character` 类对象添加到舞台上。\n\n所以现在你知道了，`Character` 类只是负责显示 `character.png` 图像。但是 `Bomb`、`Box`、`Background`\
  \ 和 `GameOver` 类又是做什么的呢？完全相同的事情：它们显示你在本章第一部分设计的图像。事实上，每个类中的代码几乎相同。看看 `Box` 类：\n\n\
  ```\npackage\n{\n  import flash.display.DisplayObject;\n  import flash.display.Sprite;\n\
  \n  public class Box extends Sprite\n  {\n    //Embed the image\n    [Embed(source=\"\
  ../images/box.png\")]\n    public var GameObjectImage:Class;\n    public var gameObjectImage:DisplayObject\n\
  \      = new GameObjectImage();\n\n    public function Box()\n    {\n      this.addChild(gameObjectImage);\n\
  \    }\n  }\n}\n```\n\n`Box` 类和 `Character` 类之间的唯一区别是名称和它嵌入的 PNG 文件。浏览其他类，你会发现它们都遵循这个完全相同的格式。\n\
  \n那么，既然你已经有了这些类，并把你的游戏图形塞进了里面，你该如何使用它们呢？你首先必须从它们创建对象，这可以在应用类中完成。\n\n当然，你已经知道如何创建对象：使用\
  \ `new` 关键字。你可以像这样从 `Character` 类创建一个对象：\n\n```\npublic var character:Character\
  \ = new Character();\n```\n\n然后你可以像这样将它添加到舞台上：\n\n```\nstage.addChild(character);\n\
  ```\n\n现在你可以在游戏中的任何地方使用 `character` 对象，它就像你创建过的任何其他 `Sprite` 对象一样工作。但一个额外的好处是，它已经包含了\
  \ `character.png` 图像。\n\n这在需要创建多个对象副本时会节省大量工作。Time Bomb Panic 中有 14 个箱子。你不需要为每个箱子创建\
  \ 14 个单独的类。你只需要一个父级 `Box` 类，就可以创建它的 14 个实例（副本）。每个实例都会自动包含嵌入的 `box.png` 图像。这让你省去了输入几十行重复代码的麻烦。\n\
  \n以下是如何仅用一个 `Box` 类创建多个箱子实例的方法。首先，在应用类中创建几个 `box` 对象。\n\n```\npublic var box1:Box\
  \ = new Box();\npublic var box2:Box = new Box();\npublic var box3:Box = new Box();\n\
  ```\n\n你可以像这样将它们添加到舞台上：\n\n```\nstage.addChild(box1);\nstage.addChild(box2);\nstage.addChild(box3);\n\
  ```\n\n\n\n看不到任何 Embed 元标签！`box1`、`box2` 和 `box3` 都包含了嵌入到其父类 `Box` 中的 `box.png`\
