  \  - 朝向鼠标旋转并射击\n  - 使用计时器发射子弹\n  - 案例研究：杀人蜂大混乱！\n  - Flash 动画与发布游戏\n- 索引\n\n## 关于作者\n\
  \n**雷克斯·范德·斯普伊** 是一位自由交互媒体设计师，专精于 Flash/AS3.0 游戏设计、界面设计和 ActionScript 编程。他目前往返于加拿大、印度和南非之间。不编写电子游戏时，他会在世界各地漫游，弹奏西塔琴。\n\
  \n## 关于技术审校\n\n**乔什·弗里尼** 目前是密歇根州大急流城费里斯州立大学数字动画与游戏设计项目的讲师。他教授专注于快速迭代开发与最大化可复用性的\
  \ Flash 游戏开发课程，并曾在密歇根 Flash 节上发表演讲。他喜欢桌游、远足、睡懒觉以及任何乐高相关的东西。他持续为任何有 Flash 问题需要解决的人提供咨询。\n\
  \n## 关于封面图片设计师\n\n![Image](img/corne_van_dooren.jpg) **科内·范·多伦** 设计了本书的封面图片。在为 friends\
  \ of ED 的《Foundation》系列设计新封面后，他开始致力于将技术与有机形态相结合，其成果现在出现在本书及该系列其他书籍的封面上。\n\n科内的童年是在各种随手可及的东西上涂鸦度过的，随后他开始探索多媒体这个无限的世界——从此他的探索之旅便从未停止。他的座右铭一直是：“多媒体的唯一限制是想象力”，这句话不断推动他前进。\n\
  \n科内为众多国际客户工作，为多媒体杂志撰写专题文章，评测和测试软件，撰写多媒体研究，并参与了许多其他 friends of ED 的书籍项目。如果你喜欢科内的作品，请务必看看他在《New\
  \ Masters of Photoshop: Volume 2》（friends of ED, 2004）中的章节。你可以在他的网站 [www.cornevandooren.com](http://www.cornevandooren.com)\
  \ 上看到更多他的作品（并与他联系）。\n\n\n\n### 引言\n\n所以你想制作一款电子游戏。从何入手？需要学习什么？可以向谁寻求帮助？\n\n如果你曾经问过这些问题，你就会知道找到答案有多么困难。多年前，在印度班加罗尔附近的一个小村庄里，我也曾问过自己同样的问题，当时我正在一所国际学校教授编程和互动媒体。我的所有学生都在玩游戏，他们都想创造游戏，但当时却没有全面的书籍或在线资源来指导他们如何实现这一目标。\n\
  \n稍作研究后，我发现了一件令人惊讶的事情：不仅基础游戏设计所需的编程知识相对较少，而且同一套技术还可以在不同的情境中反复使用，用来创建完全不同的游戏类型。这个过程充满乐趣，效果立竿见影，并且是一个极佳的创意宣泄口。这项研究的成果是一本内部使用的游戏设计教材，它构成了三门高中水平课程的基础，并启发了这本著作的诞生。\n\
  \n那还是在 Flash 4 和 5 那个几乎像史前时代的日子里，当时 ActionScript 编程语言还是 1.0 版本，Flash 拥有一些出色的内置交互式教程，一步步引导新手用户。那时似乎每个人都是初学者，所以相对容易找到那些假设读者没有背景知识的书籍和教程。\n\
  \n如今 ActionScript 已发展到 3.0 版本，事情就没那么简单了。ActionScript 语言变得强大得多，但也复杂得多。你为 AS3.0 找到的许多资源都聚焦于这种复杂性，让缺乏编程经验的初学者越来越难以获得全面的立足点来开始学习。讽刺的是，实际上\
  \ AS3.0 比 AS1.0 时代*更易于*构建游戏。本书剥离了 AS3.0 表面上的复杂性，直击你制作游戏所需掌握的核心知识。它充满乐趣且简单易学，任何人都能做到。\n\
  \n游戏设计是一件奇妙的事，你将要学习的内容，可谓是现实世界中能最接近创造魔法的事情。系好安全带，准备迎接一场激动人心的旅程——你很快就会为自己开始产出的作品感到惊讶。\n\
  \n### 关于第二版\n\n本书第一版《Foundation Game Design with Flash》完全专注于如何使用 Flash Professional\
  \ 软件制作游戏。过去，使用 Flash Professional 是制作 Flash 游戏的唯一途径，即使在其他技术逐渐普及后，它仍然是最好的方法。自第一版出版以来，将近三年过去了，AS3.0\
  \ 已经焕发出新的生命力——它已成为为网页、桌面和移动设备制作游戏的最佳跨平台开发工具。对于初学者来说，它也是最容易学习的，并且与任何其他单一技术相比，它拥有最全面、集成度最高的游戏制作工具集。本版本将向你展示如何使用纯\
  \ AS3.0 代码以及一系列互补技术来构建游戏，从而在开发过程中获得最大的灵活性。使用 AS3.0 制作游戏从未如此有趣，而你的游戏所能触及的潜在受众也从未如此广泛。\n\
  \n### 排版约定\n\n为了使本书尽可能清晰易懂，全书使用了以下文本约定：\n\n重要词汇或概念通常在首次出现时以*斜体*突出显示。\n\n代码以`等宽字体`呈现。\n\
  \n新增或更改的代码通常以**`粗体等宽字体`**呈现。\n\n伪代码和变量输入以*`斜体等宽字体`*书写。\n\n菜单命令以菜单 ![Image](img/U001.jpg)\
  \ 子菜单 ![Image](img/U001.jpg) 子菜单的形式书写。\n\n当我需要提醒你注意某些事情时，会像这样突出显示：\n\n咳咳，别说我没提醒你。\n\
  \n有时代码在一行内放不下。发生这种情况时，我会使用像这样的箭头：![Image](img/U002.jpg)。\n\n```\n这是一段非常非常长的代码，应该写在\n\
  \            同一行而不换行。\n```\n\n![Image](img/chap.jpg)\n\n## 第 1 章 - 编程基础：如何制作电子游戏\n\
  \n恭喜你拿起这本书！电子游戏设计是你能用电脑做的最有趣、最有创意的事情之一。你即将踏上一段非凡的旅程，而本书将全程指引你。\n\n那么，如何制作电子游戏呢？虽然制作游戏的方法可能和本书的读者一样多，但一个很好的起点是使用一种名为**Flash\
  \ 和 ActionScript**的技术。用这些技术学习制作游戏不仅容易，而且如果你有时间和想象力，还能利用它们制作出复杂度高、专业品质好的游戏。你还可以将游戏发布到台式机、笔记本电脑、互联网、手机和平板电脑上，而无需学习任何额外的技能。此外，如果你希望进一步深入学习，在制作\
  \ Flash 和 ActionScript 游戏过程中获得的所有技能都可以直接应用于使用其他技术的游戏设计。\n\n使用 Flash 和 ActionScript\
  \ 学习游戏设计实际上是一个两步的过程。\n\n*   你需要学习如何为游戏制作图形和插画。这通常使用图形设计软件来完成，例如 Adobe Photoshop、Illustrator、Flash\
  \ Professional，或开源软件如 GIMP（GNU 图像处理程序）。\n*   你还需要学习一种名为**ActionScript**的**编程语言**。编程语言是一种类似于英语的语言，我们人类用它来与计算机交流。\n\
  \n当你创建好图形并编写好游戏程序后，你将在这本书中学到的底层技术就会将它们整合在一起，使你的游戏运行起来。\n\n使用 Flash 和 ActionScript\
  \ 制作游戏有两种常见方法。\n\n*   你可以使用名为 Flash Professional 的软件，它由 Adobe 公司出品。这款软件允许你仅用一个软件就创建游戏的所有视觉图形并完成所有的计算机编程。\n\
  *   第二种方法是使用你喜欢的任何图形设计或插画软件来创建游戏图形，然后使用**计算机编程代码编辑器**（如 Flash Builder 或 Flash Develop）来编写\
  \ ActionScript 代码，使你的游戏运行起来。\n\n本书采用第二种方法。它更加灵活，因为你可以选择任何你熟悉且用着舒服的图形设计或编程软件。这也意味着你学到的技能不会依赖于\
  \ Adobe Flash Professional 软件的任何特定版本（该软件频繁更新），并且让你免于购买或升级它所需的不菲费用，这对于刚入行游戏设计的人来说可能是一个重大障碍。过去，制作\
  \ Flash 游戏的唯一方法就是使用 Adobe 的 Flash Professional 软件，但幸运的是，现在情况已不再如此。如今有更灵活得多的工具可用于制作\
  \ Flash 游戏，本书将向你展示如何使用它们。\n\n全世界有成千上万的人以使用 Flash 设计游戏为职业。有了这本书并稍加练习，你也能成为他们中的一员。\n\
  \n### 基本要求\n\n令人惊讶的是，电子游戏设计可以是一件技术含量相对较低的事情。以下是使用本书所需的基本设备。\n\n#### 1\\. 一台电脑\n\n\
  你需要一台相当新式的电脑，运行 Windows 系统或最新版本的 Mac OS X。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将以下英文文本翻译成符合格式要求的中文。\n\
  \n\n#### 2. 平面设计软件\n\n你需要平面设计软件，例如 `Photoshop`、`Photoshop Elements`、`Illustrator`，或者免费开源软件\
  \ `GIMP`。`Photoshop` 是地球上使用最广泛的平面设计软件，所以学习如何使用它非常有用；然而，它的价格也非常昂贵。你可以从 Adobe 的网站\
  \ `www.adobe.com/products/photoshop.html` 下载 `Photoshop`。\n\n你也可以使用 `Adobe Illustrator`\
  \ 来制作所有的游戏图形，事实上，本书中的大多数游戏图形都是用它创建的。遗憾的是，它也同样昂贵，但如果你认真对待游戏设计，从长远来看，购买它并学习如何使用它绝对是值得的，因为它可能是目前最好的插画软件。你可以在\
  \ `www.adobe.com/products/photoshop.html` 找到 `Adobe Illustrator`。\n\n比 `Illustrator`\
  \ 或 `Photoshop` 便宜得多的替代品是 `Photoshop Elements`。`Elements` 拥有完整版 `Photoshop` 的所有功能，只是缺少一些高端专业特性。对于创建游戏图形，你可能不需要那些专为摄影和印刷出版定制的高端功能。`Photoshop\
  \ Elements` 可能是一个非常好的选择。你可以从 `www.adobe.com/products/photoshopel/` 下载并购买它。\n\n或者，你也可以省下这笔钱，下载免费的\
  \ `GIMP`。就制作游戏图形而言，`GIMP` 几乎能完成 `Photoshop` 能做的所有事情。一个很大的缺点是它的菜单和窗口与 `Photoshop`\
  \ 差异巨大，因此你会发现很难按照本书的步骤操作。幸运的是，这个问题有一个很好的解决方案。你可以为 `GIMP` 安装一个名为 `GIMPshop` 的软件插件。`GIMPshop`\
  \ 能让 `GIMP` 的外观和功能与 `Photoshop` 完全一致。这意味着你可以按照本书以及任何其他 `Photoshop` 教程中的所有步骤操作，而无需为\
  \ `Photoshop` 那令人望而却步的价格花费一分钱。\n\n你可以在 `www.gimp.org/` 找到免费的 `GIMP`。在 `www.gimpshop.com/`\
  \ 可以找到 `GIMPshop`。\n\n另一个选择是使用免费的基于网络的软件来创建游戏图形，例如 `Aviary`。`www.aviary.com/` `Aviary`\
  \ 拥有许多与 `Photoshop` 和 `Illustrator` 相同的基本功能，并且无需你购买或安装任何东西。如果你的电脑上没有安装任何其他的图形设计或插画软件，并且还不确定是否要购买，`Aviary`\
  \ 可能是一个绝佳的起点。\n\n#### 3. 计算机编程软件\n\n你还需要计算机编程软件，要么是 `Flash Builder`，要么是 `Flash Develop`。这些软件被称为\
  \ **IDE**（集成开发环境）。别被这个术语吓到！它们只是专门用来帮助你编写和编辑计算机编程代码的文本编辑器或文字处理器。通常，点击一个按钮，它们就能为你把完成游戏的所有部件整合在一起。\n\
  \n在撰写本文时，如果你是学生或失业的开发者，`Flash Builder` 是免费的。但如果你两者都不是，那么全价购买它可能也是值得的，因为它能为你节省大量的时间和麻烦。`Flash\
  \ Builder` 目前有三个版本：教育版、标准版和专业版。使用本书只需要标准版。你可以通过访问 Adobe 的教育网站并按照链接查看自己是否符合免费使用教育版\
  \ `Flash Builder` 的条件。`www.adobe.com/devnet/edu.html`。你可以从 `www.adobe.com/products/flash-builder-standard.html`\
  \ 下载并购买 `Flash Builder` 标准版。\n\n如果你使用的是 Windows 系统，可以考虑使用完全免费且出色的 `Flash Develop`。如果你更喜欢使用\
  \ `Flash Develop`，那么使用它来应用本书中的技术并不会困难。本书中的所有游戏设计技术和编程代码都与 `Flash Builder` 和 `Flash\
  \ Develop` 兼容。但是，如果你决定使用 `Flash Develop`，你需要付出更多的努力来安装和使用它。安装和配置的某些方面可能有点棘手，所以除非你非常精通电脑，否则不要考虑一开始就用它。你可以从\
  \ `www.flashdevelop.org` 下载 `Flash Develop`。\n\n如果你决定使用 `Flash Develop`，你还需要下载并安装两个额外的软件组件。首先，你需要\
  \ Adobe 的免费 **Flex SDK**（软件开发工具包）。`Flex SDK` 实际上是让你所有 Flash 游戏运行的幕后核心大脑。你可以从 Adobe\
  \ 的网站 `http://opensource.adobe.com/wiki/display/flexsdk/Flex+SDK` 下载最新版本。\n\n你还需要\
  \ Adobe `Flash Player` 软件的 **调试版本**。你可以在 `http://www.adobe.com/support/flashplayer/downloads.html`\
  \ 找到它。下载适用于你系统的、被称为 **内容调试器** 的 `Flash Player` 版本。`Flash Player` 是真正运行你的游戏的软件。你需要这个特殊的调试版本，以便\
  \ `Flash Develop` 能在你编程代码出错时提醒你。\n\n然而，如果你的电脑上已经安装了另一个版本的 Adobe `Flash Player`，明智的做法是先卸载它，然后再安装新的调试版本。这样做可以防止出现一些奇怪的错误。你可以从\
  \ `http://kb2.adobe.com/cps/141/tn_14157.html` 下载适用于 Windows 的 `Flash Player` 卸载程序。如果你需要\
  \ Mac OSX 的 `Flash Player` 卸载程序，可以在 `http://kb2.adobe.com/cps/909/cpsid_90906.html`\
  \ 找到它。卸载完当前的 `Flash Player` 版本后，再安装新的调试版本。\n\n除了 `Flash Builder` 和 `Flash Develop`\
  \ 之外，还有很多其他可以用来编写 `ActionScript` 程序的 IDE，例如 `Eclipse`（适用于 Windows 和 Mac OSX）、`TextMate`\
  \ 或 `XCode`（仅适用于 Mac OSX）。或者，稍微费点功夫，你也可以使用简陋的 `Notepad`（Windows）或 `TextEdit`（Mac\
  \ OSX）应用程序。所有这些都需要你自己做一些研究来设置和使用，以制作 Flash 游戏，但许多专业的 Flash 游戏设计师都只使用它们。如果你才刚刚学习编程，我不会推荐其中任何一个，但当你积累一些经验后，或许可以考虑一下它们。\n\
  \n#### Adobe Flash Professional\n\n此外，你也可以选择使用 Adobe 的 `Flash Professional`，在同一个软件中同时制作游戏图形和编写编程代码。本书的奖励下载章节“Flash\
  \ 动画与发布你的游戏”将演示如何做到这一点。从 `www.adobe.com/cfusion/tdrc/index.cfm?product=flash` 下载\
  \ `Flash Professional`。\n\n完全使用 `Flash Professional` 制作游戏是本书第一版《Foundation Game\
  \ Design with Flash》的主题。使用 `Flash Professional` 仍然是制作 Flash 游戏的好方法，而且可能仍然是最快、最简单的方法。但是，学习在不借助它的情况下制作游戏能为你带来诸多优势。这意味着你的技能不会局限于某一种特定的软件或某个软件版本。这意味着你可以自由选择任何你喜欢的软件来编程游戏和制作图形。这也意味着你正在培养的技能和工作风格，在时机成熟时，可以轻松地转移到其他游戏设计或编程技术上。这是我将在本书这一版本中采用的、更灵活的方法。\n\
  \n\n\n"
- "# 本书使用的软件\n\n本书中的示例和操作说明均使用 Flash Builder、Photoshop（或 Photoshop Elements）以及 Illustrator。选择这些程序是因为它们易于获取、使用简单、无需复杂的安装或配置，并且同时适用于\
  \ Windows 和 Macintosh 系统。至少，要充分利用本书，您仅需这些软件即可。\n\n第二章包含如何使用 Photoshop 的入门介绍。您将在第七章中学习如何使用\
  \ Illustrator 制作游戏图形。\n\n如果您选择使用其他图形设计或编程软件，请确保在开始学习本书中的项目之前，仔细阅读其文档并熟练使用。\n\n###\
  \ 你需要了解的内容\n\n本书假设您没有任何游戏图形制作经验或计算机编程经验。您将一步步踏上探索这些迷人世界的旅程。如果您想从零开始学习游戏设计且对此一无所知，那么本书就是您入门所需的一切。\n\
  \n话虽如此，游戏开发和 ActionScript 编程语言是庞大的课题，您甚至可以花费一生时间来学习。没有一本书能提供您在学*过程中可能遇到的所有问题的全部答案。如果您从未接触过专业图形设计软件，我强烈建议您在深入阅读本书之前，额外花些时间学习如何使用\
  \ Photoshop、GIMP 或 Illustrator。您将为游戏制作大量图形和插图，如果您能熟练制作图形，那么在处理游戏设计的编程部分时就会更有信心。花一个周末摆弄一下\
  \ Photoshop 或 GIMP，当您开始游戏编程时，就能轻松应对。以下是一些帮助您入门的资源。\n\n如果您使用 Photoshop，请通读文档并完成 Adobe\
  \ 在线帮助系统中的一些练习和示例项目。（要访问这些内容，请从 Photoshop 菜单中选择“帮助”![Image](img/arrow.jpg)“Photoshop\
  \ 帮助”。）\n\n如果您使用带有 GIMPshop 插件的 GIMP，则可以跟随任何为 Photoshop 设计的教程。一个不错的起点是 Adobe 的“入门”教程网站，其中包含许多关于基本\
  \ Photoshop 使用的实用视频。请访问：\n\n`www.adobe.com/support/photoshop/gettingstarted/`\n\n\
  在网上搜索“Photoshop 初学者教程”也会出现大量教程网站，多到无法在此一一列举，但其中许多都非常优秀。\n\n但是，如果您想立即深入，我也支持您！本书是一个绝佳的起点，也是您唯一需要的资源。\n\
  \n### 你不需要了解的内容\n\n也许更令人眼界大开的是，利用本书您*不必*了解什么。\n\n*   数学（反正不用懂太多！）\n*   计算机编程\n*\
  \   网站设计\n*   图形设计\n*   其他几乎所有东西！\n\n事实上，我甚至允许您说“我讨厌电脑”，或者让您沉浸在将笨重钝器砸向显示器的幻想中。请放心，我在某个时刻也完全有过同样的感受！\n\
  \n### 一切关乎编程\n\n本书的大部分内容是关于如何编写计算机程序。除了简要介绍如何使用 Photoshop 和 Illustrator 制作简单游戏图形外，我将把游戏设计中图形和插画方面的探索留给您，这些内容在其他资源中有详细介绍。\n\
  \n那么，什么是计算机程序？\n\n计算机程序就像一个电影剧本，它告诉游戏中的角色和对象在特定条件下应该做什么以及如何表现。例如，假设您设计了一个游戏，玩家必须使用键盘上的方向键引导一只鸭子穿过一个充满饥饿鳄龟的池塘。鸭子如何知道按下方向键时它必须移动？您需要编写一个程序来告诉鸭子这样做。\n\
  \nActionScript 是您将用来为游戏编写程序的计算机编程语言的名称。它是一种非常复杂且功能强大的语言，与 Java 密切相关。ActionScript\
  \ 目前是第 3 版，简称为 `AS3.0`。它是学习编程的绝佳语言，原因如下：\n\n*   它完全集成在 Flash Builder 和 Flash Develop\
  \ 中，这意味着您通常可以立即在屏幕上看到代码运行的结果。这使得编程体验非常具体、令人满足，并且比学习许多其他编程语言的抽象程度要低得多。\n*   `AS3.0`\
  \ 的创造者 Adobe 做了大量工作，使得使用 `AS3.0` 编程的体验极其用户友好。它简化了技术障碍，使程序运行成为一键式过程。\n*   `AS3.0`\
  \ 是一种“真正的”编程语言，就像 Java 或 C++。用 `AS3.0` 学习编程的妙处在于，您学到的技能将直接适用于其他编程语言的学习，并且您可以在未来多年中不断构建这些技能。ActionScript\
  \ 会持续存在，您可以与之共同成长。\n*   使用 `AS3.0` 创建的游戏和程序是*跨平台*的，这意味着它们可以在任何计算机操作系统（Windows、Mac\
  \ OSX 或 Linux）以及 iOS 和 Android 等移动平台上运行，只要该系统安装了 Adobe 的免费 Flash Player 软件。这是一个巨大的优势，因为这意味着您只需要学习一种技术——Flash，而不是多种。Flash\
  \ 和 `AS3.0` 是目前唯一允许您无需学习任何新内容即可发布到所有这些平台的技术。Flash Player 是有史以来安装最广泛的软件之一，因此您无需为每个系统重写编程代码，即可确保游戏的潜在受众非常庞大。\n\
  *   互联网上有一个庞大的、友好的 `AS3.0` 开发者社区，他们投入了大量时间来编写教程并在在线论坛和讨论板上帮助他人。如果您在编写程序时遇到困难，只需在众多\
  \ Flash 和 ActionScript 讨论板上提问，您一定会得到有用的回复。\n\n\n\n#### 编程？但我数学超烂！\n\n本书作者也是如此！非程序员对计算机编程最大的误解之一，就是认为编程等同于某种数学。其实并非如此。它表面看起来可能相似，某些风格也为了方便从数学中借鉴而来，但整个底层系统完全不同。\n\
  \n这并不意味着本课程中完全用不到数学——你确实会用。用多少呢？你会用到加法、减法、乘法、除法，以及一些非常基础的代数（大概是五年级学过的那种）。数学难度仅此而已，而且你并不需要亲自计算。你只需知道如何告诉\
  \ AS3.0 替你做这些计算，就像使用计算器一样。\n\n当然，如果你想，数学完全可以变得更复杂。在后面章节中，你会用到一点三角学来实现特定的运动效果。不过，你未必需要理解三角学实现这些效果的机制——只需知道如何在你的游戏上下文中使用它。本书在很大程度上是从非数学的角度编写的，因此全球的数学恐惧症患者都欢迎阅读！\n\
  \n*注意：虽然你确实不需要大量数学知识就能立即开始制作很棒的游戏，但深入理解用 AS3.0 编程在数学方面的可能性，绝对会让你作为游戏开发者拥有更多选择。有两本非常全面且可读性极强的书，在本书范围之外更详细地涵盖了这一领域：基思·彼得斯（Keith\
  \ Peters）的《Foundation ActionScript 动画：让物体动起来！》以及多位作者合著的《Flash 数学创意》。这两本书都由 friends\
  \ of ED 出版，是《Flash 游戏设计基础》的完美伴侣。你可以将书中讨论的所有技巧直接应用到本书的游戏项目中。*\n\n#### 我已经会编程了！\n\n\
  本书尽可能做到对初学者友好，不假设读者有任何编程背景。然而，你们中的许多人可能是有经验的程序员，阅读本书是为了了解如何将现有的 AS3.0 技能用于创建游戏。别担心；虽然早期章节确实侧重于\
  \ Flash 和 ActionScript 的新手，但后面章节会涉及相当高级的面向对象编程领域，为你提供足够“啃”的内容。\n\n如果你已经是程序员，我建议你直接跳到第\
  \ 4 章，这是从头到尾使用编程技术构建完整游戏的第一章。如果觉得有点复杂，或者遇到不理解的术语和概念，就回退一两章，直到找到让你感到舒适的程度。否则，如果第\
  \ 4 章看起来难度合适，那就直接开干吧！从编程角度看，从那一章开始，内容会变得有趣得多。\n\n游戏设计中涉及的许多技术都非常专业化。即使你可能对 ActionScript\
  \ 或编程了解不少，但如何运用这些技能来构建游戏，并不总是显而易见。本书的重点是游戏设计的架构，而非编程的具体细节。如果你有丰富的编程经验，本书将向你展示如何将这些技能用于完整的游戏开发中。\n\
  \n##### 我能制作什么样的游戏？\n\n本书讲述如何制作二维动作、冒险和街机游戏；同时也涉及益智和逻辑游戏。Flash 是创建这类游戏的绝佳媒介。每一章都会指导你完成设计过程的每一步，但项目非常开放，鼓励你提出自己的原创方式，将技巧运用到你的游戏中。\n\
  \n本书不包含 3D 游戏，因为 3D 是一个庞大的主题，值得单独用一整本书来讲述。好在你在 2D 中学习到的大部分游戏设计技巧，尤其是游戏结构，都可以直接应用于\
  \ 3D 游戏，几乎无需修改。不过，为了简化学习过程并确保材料尽可能聚焦和清晰，我决定专注于 2D 游戏。\n\n##### 学习新术语\n\n像任何大型专业领域一样，编程也伴随着大量需要学习的新术语。本书会尽量避开行话，采用稍长但具体的描述。然而，有些术语使用极为广泛，你应该努力记住它们，因为不了解可能会妨碍你从其他来源进一步学习。本书将在正文中解释所有新术语。\n\
  \n##### 打好基础\n\n作为游戏开发者，你可以把自己想象成建筑师。任何大小或形状的建筑都有一些基本共同点：它们都有地基、墙壁和屋顶。无论你的房子是大是小、是简陋还是豪华，你都需要挖地基、砌墙、盖屋顶。之后，才能开始真正有趣的部分：设计室内布局、做景观、买家具、办暖房派对。\n\
  \n在本章剩余部分，你将编写一个非常简单的程序，它将为你在本书后续章节中创建的所有游戏和程序打下基础。如果你之前从未做过编程，或者刚刚开始掌握 AS3.0，本章就是为你准备的。\n\
  \n如果你有编程经验，你可能想跳到本章末尾，看看有多少技术和概念性内容是你熟悉的。请确保你熟悉了用于构建游戏和程序的结构，但如果一切看起来都很简单，你也可以自由跳过本章。\n\
  \n为了致敬计算机编程的历史，你将编写一个名为 `Hello World` 的程序。传统上，这是新手程序员在学习一种新编程语言时编写的第一个程序，因为它是最简单的完整程序。它做的事情很简单：只是输出\
  \ “Hello World! Can you read this?” 这句话。仅此而已！\n\n这个程序可能看起来很初级，但通过编写它，你将实现两件非常重要的事情。\n\
  \n*   你将构建一个稳健且灵活的程序设计系统，它将成为本书所有项目的核心，并且很可能在你未来数年的个人项目中为你提供良好支持。\n*   你将完成一次 AS3.0\
  \ 编程速成课，为后续章节中一些非常重要的概念和技巧打下基础。\n\n害怕编程？哈！怎么可能有你！在本章中，你将抓住编程这头“野兽”的犄角，把它摔倒在地！\n\n\
  \n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n---\n\n\n### 使用 Flash Builder\n\
  \n`Flash Builder` 是一款用于编写 AS3.0 程序和制作 Flash 游戏的综合性软件。接下来的几节将引导您了解如何设置和使用它的一些基础知识，为您阅读本书后续内容并编写游戏程序打下坚实的基础。\n\
  \n如果您使用的 `Flash Builder` 是随 Adobe Creative Suite 5.5 捆绑安装的，请注意它有一个奇怪的 bug。`Flash\
  \ Builder` 需要 `Flash Player` 的调试版本来向您显示程序是否存在问题，并显示称为**跟踪输出**的特殊消息。当您安装 Adobe Creative\
  \ Suite 时，`Flash Player` 的调试版本会自动安装，但出于某些奇怪的原因，当您尝试运行程序时，`Flash Builder` 有时会找不到它。相反，您会看到一条消息：“Installed\
  \ Flash Player is not a debugger.”\n\n解决这个问题的方法是卸载当前版本的 `Flash Player`，然后重新安装特殊的调试版本。要卸载当前版本，您需要一个可以从\
  \ Adobe 网站下载的特殊 `Flash Player` 卸载程序。\n\n您可以在以下地址找到适用于 Windows 的 `Flash Player` 卸载程序：\n\
  \n`http://kb2.adobe.com/cps/141/tn_14157.html`\n\n您可以在以下地址找到适用于 Mac OSX 的 `Flash\
  \ Player` 卸载程序：\n\n`http://kb2.adobe.com/cps/909/cpsid_90906.html`\n\n一旦卸载了当前的 `Flash\
  \ Player`，请退出正在运行的 `Flash Builder` 和您的网络浏览器，然后下载并安装最新版本的 `Flash Player` 调试版本，您可以在以下地址找到它：\n\
  \n`www.adobe.com/support/flashplayer/downloads.html`\n\n如果您在项目工作中遇到了此问题，请从 `Flash\
  \ Builder` 的代码编辑窗口中复制所有代码，并将其粘贴到一个具有新名称的新 ActionScript 项目中。之后一切应该都能正常运行。\n\nAdobe\
  \ 发布了一份关于如何使用 `Flash Builder` 的全面在线手册。您可以在以下地址找到它：\n\n`http://help.adobe.com/en_US/flashbuilder/using/`\n\
