  \n现在你需要使用 `addChild()` 将对象添加到舞台上，然后设置它们的 `x` 和 `y` 坐标。通常你会这样写：\n\n```actionscript\n\
  stage.addChild(character);\ncharacter.x = 225;\ncharacter.y = 150;\n```\n\n在这个游戏中这样写完全没问题，只不过这次你需要处理\
  \ 22 个对象，而不是仅仅三四个。你肯定不想为此写 66 行代码——那该是多无聊的苦差事！如果能将每个对象的代码缩减到一行，那就太好了。当然可以！\n\n我为这个游戏创建了一个自定义方法，叫做\
  \ `addGameObjectToStage`。以下是如何使用它将一个游戏对象添加到舞台上：\n\n```actionscript\naddGameObjectToStage(character,\
  \ 50, 50);\n```\n\n该方法接受三个参数：对象名称、`x` 坐标和 `y` 坐标。\n\n你可以在 `TimeBombPanic` 应用类中程序清单大约四分之三的位置找到这个方法的函数定义。\n\
  \n```actionscript\npublic function addGameObjectToStage\n  (gameObject:Sprite, xPos:int,\
  \ yPos:int):void\n{\n  stage.addChild(gameObject);\n  gameObject.x = xPos;\n  gameObject.y\
  \ = yPos;\n}\n```\n\n它将对象添加到舞台上，并分配你在方法参数中给定的 `x` 和 `y` 坐标。\n\n*有一个需要注意的小技术细节：该方法的函数定义将传入的参数\
  \ `gameObject` 的类型声明为 `Sprite`。*\n\n*`gameObject:Sprite`*\n\n*不过，本游戏中所有游戏对象的类型都是\
  \ `Character`、`Background`、`Box`、`GameOver` 和 `Bomb`，它们都不是 `Sprite` 类型。但请记住，当你创建游戏对象类时，它们都扩展了\
  \ `Sprite` 类，就像这样：*\n\n*`public class Character extends Sprite`*\n\n*这意味着 `Sprite`\
  \ 是父类。通过在方法参数中将对象声明为其父类类型，你可以使该方法非常通用，从而适用于所有继承自同一父类的对象。*\n\n仔细思考游戏程序中可能存在的任何重复代码片段，你经常会发现可以编写像这样的自定义方法来为你完成这些繁重的工作。\n\
  \n#### 舞台边界\n\n在这个游戏中，你会注意到角色无法越过游戏场地外围的方格边界，如图 Figure 7-77 所示。\n\n![图片](img/9781430239922_Fig07-77.jpg)\n\
  \n**图 7-77**。角色无法越过游戏场地边界。\n\n因为你自己设计了背景图形，所以你知道实际上没有任何物理障碍物阻止角色越过这条边界——它只是一个图像。但它看起来确实像一道坚固的边界。实现这种错觉非常容易。代码所做的只是在每个坐标轴上将舞台边界缩小\
  \ 50 像素，实际上相当于舞台每边都变小了 50 像素。以下是来自 `enterFrameHandler` 实现此功能的 `if` 语句，其中修改后的舞台边界已高亮显示：\n\
  \n```actionscript\nif (character.x < 50)\n{\ncharacter.x = 50;\n}\nif (character.y\
  \ < 50)\n{\ncharacter.y = 50;\n}\nif (character.x + character.width > stage.stageWidth\
  \ - 50)\n{\ncharacter.x = stage.stageWidth - character.width - 50;\n}\nif (character.y\
  \ + character.height > stage.stageHeight -50)\n{\ncharacter.y = stage.stageHeight\
  \ - character.height - 50;\n}\n```\n\n游戏场地的边界宽度为 50 像素，因此代码只需要在 `x` 和 `y` 两个坐标轴上对此进行补偿即可。\n\
  \n#### 角色与方块的碰撞\n\n《定时炸弹恐慌》使用了我在 第 6 章 中介绍过的同一个 `Collision` 类。本游戏的唯一区别在于，`enterFrameHandler`\
  \ 中调用了 14 次 `Collision.block` 方法——每个方块调用一次。以下是实现此功能的简化代码：\n\n```actionscript\nCollision.block(character,\
  \ box1);\n...\nCollision.block(character, box14);\n```\n\n没有比这更简单的了。它工作得很好，不过在 第\
  \ 10 章 中，你将学习如何使用 **for 循环** 更高效地处理多个对象之间的碰撞，这样就不必把同一行代码重复输入 14 次了。\n\n\n\n####\
  \ 拆除炸弹\n\n`bombsDefused` 变量负责统计角色已收集的炸弹数量。它在游戏开始时于类定义中创建并初始化为 0。\n\n`public var\
  \ bombsDefused:uint = 0;`\n\n`enterFrameHandler` 函数会检查角色与炸弹之间的碰撞。五个炸弹对象各自对应一个 `if`\
  \ 语句。当角色与炸弹碰撞时，炸弹的 `visible` 属性会被设为 `false`，这实质上就是将炸弹从游戏中移除。随后 `bombsDefused` 变量增加\
  \ 1，另一行代码会检查游戏是否结束。以下是检测与第一个炸弹碰撞的 `if` 语句：\n\n```\nif(character.hitTestObject(bomb1)\
  \ && bomb1.visible == true)\n{\n  bomb1.visible = false;\n  bombsDefused++;  \n\
  \  checkGameOver();\n}\n```\n\n从游戏中移除对象的方法有很多，但将其设为不可见是最简单的方式。不过需要注意，虽然舞台上看不到某个对象了，但它依然存在。这意味着如果角色与炸弹碰撞后，炸弹的\
  \ `visible` 属性被设为 `false`，这并不能阻止角色再次与其碰撞，只是角色碰撞的会是一个隐形炸弹而非可见炸弹。\n\n这种情况是不能允许的，因此需要在\
  \ `if` 语句中添加额外检查，确保角色只与可见炸弹碰撞。\n\n```\nif(character.hitTestObject(bomb1) && bomb1.visible\
  \ == true)\n{...\n```\n\n如果任何炸弹不可见，说明它已被拆除，这个 `if` 语句就会被忽略。\n\n在更新 `bombsDefused`\
  \ 变量之后，这些 `if` 语句最后会调用 `checkGameOver` 方法：\n\n`checkGameOver();`\n\n这个方法的作用是判断游戏是否结束，你很快就会了解它的工作原理。\n\
  \n### 使用计时器\n\n本游戏的一个全新功能是使用计时器统计从开始到现在的秒数。如果十秒过去了玩家还未拆除所有炸弹，玩家就会输掉游戏。\n\n我们先通过一个非常聚焦的示例程序来看看计时器如何工作，然后我会展示在《炸弹恐慌计时》中如何使用计时器。\n\
  \n#### 理解计时器\n\n在本章的源文件中，你会找到一个名为 `UsingATimer` 的项目文件夹。打开并编译它。它会从 0 计数到 10 秒。到达\
  \ 10 秒后，计数会重新开始。图 7-78 展示了你会看到的效果。\n\n![图片](img/9781430239922_Fig07-78.jpg)\n\n\
  **图 7-78.** 从 0 到 10 计数秒数\n\n`UsingATimer` 应用程序类使用计时器更新一个文本字段。以下是整个程序。我已将所有与创建和使用\
  \ `Timer` 对象相关的代码高亮显示。\n\n```\npackage\n{\n  import flash.display.Sprite;\n  import\
  \ flash.text.*;\n  import flash.events.TimerEvent;\n  import flash.utils.Timer;\n\
  \n  public class UsingATimer extends Sprite\n  {\n    //Timer 对象\n    public var\
  \ timer:Timer;\n\n    //Text 对象\n    public var output:TextField = new TextField();\n\
  \    public var format:TextFormat = new TextFormat();\n\n    public function UsingATimer()\n\
  \    {\n      //初始化计时器\n      timer = new Timer(1000);\n      timer.addEventListener(TimerEvent.TIMER,\
  \ updateTimeHandler);\n      timer.start();\n\n      //设置文本格式对象\n      format.font\
  \ = \"Helvetica\";\n      format.size = 200;\n      format.color = 0x000000;\n \
  \     format.align = TextFormatAlign.CENTER;\n\n      //配置输出文本字段\n      output.defaultTextFormat\
  \ = format;\n      output.autoSize = TextFieldAutoSize.CENTER;\n      output.border\
  \ = true;\n      output.text = \"0\";\n\n      //显示并定位输出文本字段\n      stage.addChild(output);\n\
  \      output.x = 200;\n      output.y = 100;\n    }\n    public function updateTimeHandler(event:TimerEvent):void\n\
  \    {\n      output.text = String(timer.currentCount);\n\n      //当计数达到 10 时重置并重新启动计时器\n\
  \      if(timer.currentCount == 10)\n      {\n        timer.reset();\n        timer.start();\n\
  \      }\n    }\n  }\n}\n```\n\n要在程序中使用计时器，首先需要导入 `Timer` 和 `TimerEvent` 类。\n\n\
  ```\nimport flash.events.TimerEvent;\nimport flash.utils.Timer;\n```\n\n计时器是对象，因此需要用与其他对象相同的方式来创建它们。首先，在类定义中声明计时器变量。\n\
  \n`public var timer:Timer;`\n\n然后在构造函数方法中使用 `new` 关键字将其转化为 `Timer` 对象。\n\n`timer\
  \ = new Timer(1000);`\n\n`Timer` 类需要一个参数，即代表毫秒的数字。（一毫秒等于千分之一秒。本例中的一千毫秒等于一秒。）\n\n\
  AS3.0 中的计时器通过以固定间隔触发事件来工作。在本例中，你希望每秒触发一次事件。该事件的作用是将舞台上的输出文本字段数值加 1。但要实现这一点，需要为刚创建的\
  \ `timer` 对象添加一个 `TimerEvent` 事件监听器。\n\n`timer.addEventListener(TimerEvent.TIMER,\
  \ updateTimeHandler);`\n\n接下来，需要使用 `Timer` 类的 `start` 方法来实际启动计时器。\n\n`timer.start();`\n\
  \n现在，`timer` 对象每秒都会触发 `updateTimeHandler` 事件处理函数。\n\n```\npublic function updateTimeHandler(event:TimerEvent):void\n\
  {\n  output.text = String(timer.currentCount);\n\n  //当计数达到 10 时重置并重新启动计时器\n  if(timer.currentCount\
  \ == 10)\n  {\n    timer.reset();\n    timer.start();\n  }\n}\n```\n\n`Timer` 对象有一个名为\
  \ `currentCount` 的属性，它会告诉你自从计时器启动以来，计时器事件触发了多少次。`updateTimeHandler` 将该值复制到舞台上的输出文本字段中。\n\
  \n`output.text = String(timer.currentCount);`\n\n你可以像这里一样使用 `currentCount`：显示事件被触发的次数。`if`\
  \ 语句使用 `currentCount` 来检查是否已过去十秒；如果是，则调用 `Timer` 类的 `reset` 和 `start` 方法：\n\n```\n\
  timer.reset();\ntimer.start();\n```\n\n\n\n`reset` 会停止计时器，并将 `currentCount` 重置为零。要重新启动计时器，需再次使用\
  \ `start` 方法。（如果你需要在任何游戏中完全停止计时器，可以使用 `stop` 方法，它会停止计时但不重置 `currentCount`。）\n\n\
  创建 `Timer` 对象时，你可以传入第二个参数，即 `repeatCount`。这个数字告诉计时器应重复多少次。通过修改创建 `timer` 对象的指令，可以观察到使用\
  \ `repeatCount` 的效果，如下所示：\n\n`timer = new Timer(l000, 5);`\n\n重新编译程序后，你会看到数字计数到\
  \ 5。之后，事件处理程序便不再被调用。\n\n还有一些 `Timer` 类的属性你应该了解。如果需要更改事件之间的时间间隔，可以使用 `delay` 属性。例如，如果你希望计时器事件每半秒触发一次，可以将\
  \ `delay` 设置为 500 毫秒，如下所示：\n\n`timer.delay = 500;`\n\n如果需要知道计时器当前是否正在运行，可以使用 `running`\
  \ 属性，计时器运行时返回 `true`，否则返回 `false`。\n\n最后，你可以使用 `TimerEvent` 类的 `TIMER_COMPLETE`\
  \ 属性，在计时器完成时触发事件。\n\n`timer.addEventListener(TimerEvent.TIMER_COMPLETE, timerCompleteHandler);`\n\
  \n这是关于计时器工作原理的基础介绍。你可以使用 `Timer` 对象创建倒计时器、让对象间歇性地移动，或者根据玩家完成任务所需的时间计算其得分。\n\n这个示例程序以及《定时炸弹危机》的另一个特点是，文本字段会自动设置其高度和宽度。这是通过\
  \ `TextFieldAutoSize` 类实现的，如下所示：\n\n`output.autoSize = TextFieldAutoSize.CENTER;`\n\
  \n#### 在《定时炸弹危机》中使用计时器\n\n《定时炸弹危机》中的计时器创建和使用方式与示例程序完全相同。它每秒触发一次 `updateTimeHandler`，代码如下：\n\
  \n```\npublic function updateTimeHandler(event:TimerEvent):void\n{\n  output.text\
  \ = String(timer.currentCount);\n\n  //计时器达到 10 时停止\n  if(timer.currentCount ==\
  \ 10)\n  {\n    checkGameOver();\n  }\n}\n```\n\n它只做两件事。首先，用当前时间更新输出文本字段。\n\n`output.text\
  \ = String(timer.currentCount);`\n\n如图 7-79 所示，这会在舞台上显示当前时间。\n\n![图片](img/9781430239922_Fig07-79.jpg)\n\
  \n**图 7-79**。输出文本字段显示计时器的 `currentCount` 属性。\n\n`updateTimeHandler` 做的第二件事是检查游戏是否结束。\n\
  \n```\nif(timer.currentCount == 10)\n{\n  checkGameOver();\n}\n```\n\n它仅在计时器达到 10\
  \ 时检查游戏是否结束。那么这个神秘的 `checkGameOver` 方法到底做了什么呢？\n\n#### 结束游戏\n\n游戏有两种结束方式：玩家拆除五颗炸弹，或计时器达到\
  \ 10。每次玩家与炸弹碰撞时，都会调用 `checkGameOver` 方法。而且，正如你刚才所见，当 `timer.currentCount` 值等于 10\
  \ 时也会调用它。以下是 `checkGameOver` 方法的代码：\n\n```\npublic function checkGameOver():void\n\
  {\n  if(bombsDefused == 5)\n  {\n    gameOver.visible = true;\n    gameResult.text\
  \ = \"You Won!\";\n    character.alpha = 0.5;\n    background.alpha = 0.5;\n   \
  \ timer.removeEventListener(TimerEvent.TIMER, updateTimeHandler);\n    stage.removeEventListener(Event.ENTER_FRAME,\
  \ enterFrameHandler);\n  }\n  else if(timer.currentCount == 10)\n  {\n    gameOver.visible\
  \ = true;\n    gameResult.text = \"You Lost!\";\n    character.alpha = 0.5;\n  \
  \  background.alpha = 0.5;\n    timer.removeEventListener(TimerEvent.TIMER, updateTimeHandler);\n\
  \    stage.removeEventListener(Event.ENTER_FRAME, enterFrameHandler);\n  }\n}\n\
  ```\n\n可以看到，它只是简单地检查这两个条件。如果玩家拆除了五颗炸弹，游戏获胜；反之，如果计时器达到 10，游戏失败。\n\n如果玩家获胜，将执行这些指令：\n\
  \n```\ngameOver.visible = true;\ngameResult.text = \"You Won!\";\ncharacter.alpha\
  \ = 0.5;\nbackground.alpha = 0.5;\ntimer.removeEventListener(TimerEvent.TIMER, updateTimeHandler);\n\
  stage.removeEventListener(Event.ENTER_FRAME, enterFrameHandler);\n```\n\n你可以在 图\
  \ 7-80 中看到效果。\n\n![图片](img/9781430239922_Fig07-80.jpg)\n\n**图 7-80**。当玩家获胜时，显示 `gameOver`\
  \ 对象。\n\n首先，`gameOver` 对象被显示出来。\n\n`gameOver.visible = true;`\n\n在通过构造函数初始化游戏时，`gameOver`\
  \ 对象的 `visible` 属性被设为 `false`。游戏结束时，它被设为 `true`，从而在舞台上可见。\n\n接着，代码在 `gameResult`\
  \ 文本字段中显示 \"You Won!\"。\n\n`gameResult.text = \"You Won!\";`\n\n`gameResult` 文本字段实际上是\
  \ `gameOver` 对象的一个子级。它在构造函数中创建时，并未被设为舞台的子级，而是直接添加到了 `gameOver` 中，如下所示：\n\n```\n\
  gameOver.addChild(gameResult);\ngameResult.x = 145;\ngameResult.y = 160;\n```\n\n\
  这意味着它是 `gameOver` 对象的一部分。为其设置的 `x` 和 `y` 坐标是 `gameOver` 对象内部的局部坐标。这与你在第 6 章中将子对象嵌入单个\
  \ Sprite 的技巧相同。在此处这样做很有用，因为这意味着 `gameResult` 文本字段的可见性和位置将由它的父级 `gameOver` 对象决定。它们是一个整体。\n\
  \n`checkGameOver` 方法中的指令还会在游戏结束时，通过以下两行代码使背景和角色变暗：\n\n```\ncharacter.alpha = 0.5;\n\
  background.alpha = 0.5;\n```\n\n这是给玩家的一个视觉提示，表明游戏已不再活跃。\n\n最后，代码禁用了 `enterFrameHandler`，并将\
  \ `updateTimeHandler` 从计时器中移除。\n\n```\ntimer.removeEventListener(TimerEvent.TIMER,\
  \ updateTimeHandler);\nstage.removeEventListener(Event.ENTER_FRAME, enterFrameHandler);\n\
  ```\n\n移除 `enterFrameHandler` 实际上会冻结游戏，因为游戏角色停止移动，碰撞代码也停止运行。从计时器中移除 `updateTimeHandler`\
  \ 也会使计时停止。\n\n显示获胜或失败结果的代码唯一的区别在于：当玩家失败时，`gameResult` 文本字段中显示 \"You Lost!\"，如 图\
  \ 7-81 所示。\n\n`gameResult.text = \"You Lost!\";` \n\n![图片](img/9781430239922_Fig07-81.jpg)\n\
  \n**图 7-81**。如果玩家失败，`gameResult` 文本字段中显示 \"You Lost!\"。\n\n整个过程就是这样。游戏结束！\n\n\n\n\
  ### 创建滚动游戏环境\n\n第一款真正的游戏完成后，你还可以进行许多微调来让它更完善。可以添加一个“再玩一次”按钮，也可以调整计时器让游戏变得更简单或更难。作为更大的挑战，你甚至可以设计并编程实现游戏的新关卡来增加难度。（下一章将介绍如何制作多关卡游戏。）\n\
  \n一个明显的改进是，你可以创建一个更大、会滚动的游戏环境。事实上，你几乎肯定会想要这样做——能够构建一个潜在的巨大游戏世界的诱惑实在太大了。你在第 5 章中已经学会了如何制作滚动游戏世界。但在那个例子中，只有背景会滚动。当游戏世界中存在其他物体（如盒子和炸弹）时，情况会变得稍微复杂些。这是因为每次背景滚动时，前景中的游戏对象都必须调整自身位置来适应滚动。这并不难实现，你只需要正确计算对象的位置坐标即可。接下来我将演示具体做法。\n\
  \n在本章的源文件中，你会找到 `TimeBombScroll` 项目文件夹。打开并编译应用程序类（`TimeBombScroll.as`），你会看到游戏现在占据的场地是原来的四倍。任何时候都只能看到场地的四分之一。当角色在游戏世界中移动时，背景会随之滚动。如图\
  \ 7-82 所示。\n\n![图片](img/9781430239922_Fig07-82.jpg)\n\n**图 7-82**. 大型滚动游戏世界\n\n\
  让我们看看这是如何实现的。\n\n#### 准备滚动所需的素材\n\n首先需要制作一张大型背景图片。本例中的背景图片是原图的四倍大小：1100 像素×800 像素。我将其命名为`bigBackground.png`，如图\
  \ 7-83 所示。\n\n![图片](img/9781430239922_Fig07-83.jpg)\n\n**图 7-83**. 制作一张大背景图片。\n\n\
  我为这张新背景图片创建了一个名为`BigBackground`的类。\n\n此外，我还需要将包围时间显示文字的黑色圆角矩形从边框分离出来。因为该黑色矩形应固定在舞台的某个位置，不随背景滚动。我将这张黑色矩形图片命名为`timeDisplay.png`，并为其创建了一个名为`TimeDisplay`的类。`TimeDisplay`和`BigBackground`类与你本章中看到的其他游戏对象类完全相同。\n\
  \n#### 向游戏添加对象\n\n我使用`BigBackground`和`TimeDisplay`类创建了背景和时间显示对象，代码如下：\n\n```actionscript\n\
  public var background:BigBackground = new BigBackground();\npublic var timeDisplay:TimeDisplay\
  \ = new TimeDisplay();\n```\n\n然后将它们添加到舞台并定位：\n\n```actionscript\naddGameObjectToStage\n\
  \  (\n    background,\n    -(background.width - stage.stageWidth) / 2,\n    -(background.height\
  \ - stage.stageHeight) / 2\n  );\naddGameObjectToStage(timeDisplay, 200, 5);\n```\n\
  \n背景居中所用的公式与你在第 6 章中使用的一致。\n\n请确保在将所有其他对象添加到舞台**之后**再添加`timeDisplay`对象。这样能保证在游戏滚动时，它会浮在其他对象之上。\n\
  \n背景位置确定后，就可以开始添加游戏对象了。但现在面对的是广阔空间，你不能再用简单的舞台坐标来定位它们。你需要提供相对于背景放置位置的坐标。这些对象大多数在游戏开始时都处于舞台之外。\n\
  \n幸运的是，这很容易实现。只需将游戏对象的 x 和 y 坐标与背景的 x 和 y 坐标相加即可。以下是第一个盒子的定位方式：\n\n```actionscript\n\
  addGameObjectToStage(box1, background.x + 100, background.y + 100);\n```\n\n这会将盒子放置在背景左上角右方\
  \ 100 像素、下方 100 像素的位置。如图 7-84 所示。\n\n![图片](img/9781430239922_Fig07-84.jpg)\n\n**图\
  \ 7-84**. 游戏对象相对于背景对象的 x 和 y 位置进行定位。\n\n这非常方便，因为如果你将来更改背景的初始起始位置，盒子的位置会自动调整进行补偿。\n\
  \n所有游戏对象都像这样相对于背景位置进行定位：\n\n```actionscript\n//盒子\naddGameObjectToStage(box1, background.x\
  \ + 100, background.y + 100);\naddGameObjectToStage(box2, background.x + 200, background.y\
  \ + 300);\naddGameObjectToStage(box3, background.x + 400, background.y + 450);\n\
  addGameObjectToStage(box4, background.x + 100, background.y + 600);\naddGameObjectToStage(box5,\
  \ background.x + 300, background.y + 700);\naddGameObjectToStage(box6, background.x\
  \ + 500, background.y + 200);\naddGameObjectToStage(box7, background.x + 600, background.y\
  \ + 600);\naddGameObjectToStage(box8, background.x + 500, background.y + 500);\n\
  addGameObjectToStage(box9, background.x + 700, background.y + 200);\naddGameObjectToStage(box10,\
  \ background.x + 700, background.y + 400);\naddGameObjectToStage(box11, background.x\
  \ + 800, background.y + 500);\naddGameObjectToStage(box12, background.x + 100, background.y\
  \ + 700);\naddGameObjectToStage(box13, background.x + 900, background.y + 300);\n\
  addGameObjectToStage(box14, background.x + 800, background.y + 200);\n\n//炸弹\naddGameObjectToStage(bomb1,\
  \ background.x + 55, background.y + 710);\naddGameObjectToStage(bomb2, background.x\
  \ + 255, background.y + 310);\naddGameObjectToStage(bomb3, background.x + 355, background.y\
  \ + 160);\naddGameObjectToStage(bomb4, background.x + 855, background.y + 510);\n\
  addGameObjectToStage(bomb5, background.x + 755, background.y + 610);\n```\n\n要使其正常工作，你必须确保在设置游戏对象的\
  \ x 和 y 坐标**之前**，先设置好背景的 x 和 y 坐标。\n\n\n\n#### 滚动与舞台边界\n\n以下是 `enterFrameHandler`\
  \ 中用于滚动背景和游戏对象的全部代码。它使用一个名为 `scroll` 的自定义方法来执行滚动游戏对象的实际工作。我将在后续页面中解释这一切的工作原理。\n\n\
  ```\n//计算滚动速度\nvar temporaryX:int = background.x;\nvar temporaryY:int = background.y;\n\
  \n//检查舞台边界\n//1. 检查内部边界\nif (character.x < leftInnerBoundary)\n{\n  character.x\
  \ = leftInnerBoundary;\n  rightInnerBoundary\n    = (stage.stageWidth / 2) + (stage.stageWidth\
  \ / 4);\n  background.x -= vx;\n}\nelse if (character.x + character.width > rightInnerBoundary)\n\
  {\n  character.x = rightInnerBoundary - character.width\n  leftInnerBoundary\n \
  \   = (stage.stageWidth / 2) - (stage.stageWidth / 4);\n\n  background.x -= vx;\n\
  }\nif (character.y < topInnerBoundary)\n{\n  character.y = topInnerBoundary;\n \
  \ bottomInnerBoundary\n    = (stage.stageHeight / 2) + (stage.stageHeight / 4);\n\
  \  background.y -= vy;\n}\nelse if (character.y + character.height > bottomInnerBoundary)\n\
  {\n  character.y = bottomInnerBoundary - character.height;\n  topInnerBoundary\n\
  \    = (stage.stageHeight / 2) - (stage.stageHeight / 4);\n  background.y -= vy;\n\
  }\n\n//2. 背景舞台边界\nif (background.x > 0)\n{\n  background.x = 0;\n  leftInnerBoundary\
  \ = 0;\n}\nif (background.y > 0)\n{\n  background.y = 0;\n  topInnerBoundary = 0;\n\
  }\nif (background.x < stage.stageWidth - background.width)\n{\n  background.x =\
  \ stage.stageWidth - background.width;\n  rightInnerBoundary = stage.stageWidth;\n\
  }\nif (background.y < stage.stageHeight - background.height)\n{\n  background.y\
  \ = stage.stageHeight - background.height;\n  bottomInnerBoundary = stage.stageHeight;\n\
  }\n\n//3. 角色舞台边界\nif (character.x < 50)\n{\n  character.x = 50;\n}\nif (character.y\
  \ < 50)\n{\n  character.y = 50;\n}\nif (character.x + character.width > stage.stageWidth\
  \ - 50)\n{\n  character.x = stage.stageWidth - character.width - 50;\n}\nif (character.y\
  \ + character.height > stage.stageHeight -50)\n{\n  character.y = stage.stageHeight\
  \ - character.height - 50;\n}\n\n//计算滚动速度\nvar scroll_Vx:int = background.x - temporaryX;\n\
  var scroll_Vy:int = background.y - temporaryY;\n\n//使用滚动速度移动游戏对象\nscroll(box1, scroll_Vx,\
  \ scroll_Vy);\nscroll(box2, scroll_Vx, scroll_Vy);\nscroll(box3, scroll_Vx, scroll_Vy);\n\
  scroll(box4, scroll_Vx, scroll_Vy);\nscroll(box5, scroll_Vx, scroll_Vy);\nscroll(box6,\
  \ scroll_Vx, scroll_Vy);\nscroll(box7, scroll_Vx, scroll_Vy);\nscroll(box8, scroll_Vx,\
  \ scroll_Vy);\nscroll(box9, scroll_Vx, scroll_Vy);\nscroll(box10, scroll_Vx, scroll_Vy);\n\
  scroll(box11, scroll_Vx, scroll_Vy);\nscroll(box12, scroll_Vx, scroll_Vy);\nscroll(box13,\
  \ scroll_Vx, scroll_Vy);\nscroll(box14, scroll_Vx, scroll_Vy);\nscroll(bomb1, scroll_Vx,\
  \ scroll_Vy);\nscroll(bomb2, scroll_Vx, scroll_Vy);\nscroll(bomb3, scroll_Vx, scroll_Vy);\n\
  scroll(bomb4, scroll_Vx, scroll_Vy);\nscroll(bomb5, scroll_Vx, scroll_Vy);\n```\n\
  \n上述代码使用的 `scroll` 方法如下：\n\n```\npublic function scroll\n  (gameObject:Sprite, scroll_Vx:int,\
  \ scroll_Vy:int):void\n{\n  gameObject.x += scroll_Vx;\n  gameObject.y += scroll_Vy;\n\
  }\n```\n\n这段代码的大部分内容用于滚动背景，并为角色和背景设置舞台边界。你之前已经看过所有这些内容——它是第 5 章滚动代码的整合，加上你在本章中为防止角色穿过游戏场地\
  \ 50 像素宽的边界所做的额外修改。如果你对任何代码的工作原理不确定，请回顾第 5 章以及本章前面的部分。\n\n这里的新颖之处在于，代码让所有游戏对象相对于背景移动。这使它们看起来像是固定在背景上的位置。当然，这只是一种假象，但效果非常出色。让我们来看看它是如何工作的。\n\
  \n首先，你需要创建两个变量来临时捕获背景当前的 x 和 y 坐标。你必须在滚动背景*之前*执行此操作。这两个变量名为 `temporaryX` 和 `temporaryY`。\n\
  \n```\nvar temporaryX:int = background.x;\nvar temporaryY:int = background.y;\n\
  ```\n\n它们所做的仅仅是在背景移动前记录其位置。\n\n在背景通过滚动代码移动后，你使用这些变量来计算所谓的**滚动速度**。这告诉你背景先前位置与其当前位置之间的差异。`scroll_Vx`\
  \ 和 `scroll_Vy` 变量用于计算这个差值。\n\n```\nvar scroll_Vx:int = background.x - temporaryX;\n\
  var scroll_Vy:int = background.y - temporaryY;\n```\n\n既然知道了差值，你就可以用它来正确地重新定位游戏对象。你所要做的就是将\
  \ `scroll_Vx` 和 `scroll_Vy` 值应用到对象的 x 和 y 坐标上，如下所示：\n\n```\nbox1.x += scroll_Vx;\n\
  box1.y += scroll_Vy;\n```\n\n这样就足够了。无论背景如何滚动，这些对象现在都会相对于背景保持固定位置。\n\n然而，`TimeBombScroll`\
  \ 中的代码更进一步。它没有繁琐地手动设置 14 个盒子和 5 个炸弹的 x 和 y 坐标，而是将这个工作委托给一个名为 `scroll` 的方法。\n\n```\n\
  scroll(box1, scroll_Vx, scroll_Vy);\n```\n\n然后，`scroll` 方法的函数定义负责处理设置对象 x 和 y 属性的重复性工作，如下所示：\n\
  \n```\npublic function scroll\n  (gameObject:Sprite, scroll_Vx:int, scroll_Vy:int):void\n\
  {\n  gameObject.x += scroll_Vx;\n  gameObject.y += scroll_Vy;\n}\n```\n\n这为你节省了一些繁琐的输入工作。而这就是全部内容。以下是确保其正常工作必须遵循的步骤：\n\
  \n1.  将背景的 x 和 y 坐标复制到 `temporaryX` 和 `temporaryY` 变量中。\n2.  滚动背景。\n3.  计算 `scroll_Vx`\
  \ 和 `scroll_Vy` 值，以确定背景移动了多少。\n4.  将 `scroll_Vx` 和 `scroll_Vy` 值应用于你想要随背景一起滚动的游戏对象。\n\
  \n你必须*严格*按照此顺序添加代码，才能使其正常工作。当然，所有这些代码都在 `enterFrameHandler` 内部运行。\n\n*这实际上是对一种非常精确的游戏动画技术——**韦尔莱积分法**的简单介绍。本书不涉及韦尔莱积分法，但你可以在《高级\
  \ Flash 游戏设计》中读到关于它的全部内容。将对象的位置捕获到临时变量中，移动对象，然后计算差值，这一基本过程正是韦尔莱积分法的核心所在。*\n\n`TimeBombScroll.as`\
  \ 中的其余代码与 `TimeBombPanic.as` 相同，只有两处小改动：游戏开始时角色居中，以及时间限制增加到了 20 秒。（但是，拜托，你应该仍然能在\
  \ 10 秒内通关！）请查看源文件中的完整代码，以便从上下文理解全部内容。\n\n### 总结\n\n现在你已经知道如何从头到尾制作一个完整的游戏了。本章向你展示了如何制作游戏图形、通过代码控制它们，并将它们转化为一个真正可玩的游戏。\n\
  \n但是，你可能希望你的游戏能做到的很多事情，你还没有学会。如何制作能够自行移动的敌方游戏对象？如何切换游戏关卡？以及如何发射子弹？接下来的第 8 章将解释所有这些以及更多内容。\n\
  \n![Image](img/chap.jpg)\n\n## 第 8 章\n\n\n\n# 制作更大型的游戏\n\n`Time Bomb Panic` 是一款优秀的小型单关卡游戏模型。它的概念简单，只需十秒就能玩完，你还有足够的时间去撸猫或冲浪。但这可能不是你真正想制作的那种游戏。那些让你彻夜难眠、反复构思的游戏创意，无疑包含数百个关卡；需要\
  \ 50 小时甚至更久才能通关；并且包含数十种不同的游戏对象、谜题和有趣的场景。它们是大型游戏。在本章中，你将学习如何制作这类游戏。\n\n本章要介绍的游戏名为\
  \ `Monster Mayhem`。这是一款只有两个关卡、包含少量游戏对象的游戏，但你可以使用相同的架构来制作包含任意数量关卡和对象的游戏，同时仍能保持代码的可控性。它是一款大型游戏的优秀模型——同时也适用于你将要制作的大部分小型游戏。\n\
  \n你可以在本章源文件的 `MonsterMayhem` 项目文件夹中找到这款游戏。多玩几次，感受一下它的玩法。在第一关中，你需要击杀舞台上徘徊的两只怪物。按下空格键向上发射一枚星星投射物；如果星星击中怪物三次，它们就会爆炸。如果任何一只怪物碰到你的角色，游戏就会结束。如果你击杀了这两只怪物，就会加载第二关。第二关中有四只移动速度更快的怪物，但这次你可以朝四个方向发射星星。你能击杀全部四只怪物通关吗？这比看上去要难得多！图\
  \ 8-1 展示了游戏的运行画面。\n\n![图像](img/9781430239922_Fig08-01.jpg)\n\n**图 8-1.** Monster\
  \ Mayhem\n\n### 理解游戏结构\n\n`Monster Mayhem` 游戏的代码结构与本书之前介绍的任何游戏都截然不同。游戏的每个关卡都完全包含在单个\
  \ `Sprite` 中。当一个关卡完成时，主应用程序类会从舞台上移除当前关卡的 `Sprite`，并添加一个新的 `Sprite`。这意味着所有游戏对象（如角色或怪物）都不会被直接添加到主舞台，而是先被添加到一个容器\
  \ `Sprite` 中，再由应用程序类将该容器 `Sprite` 添加到舞台上。\n\n为了更清晰地理解其工作原理，让我们比较一下 `Monster Mayhem`\
  \ 和 `Time Bomb Panic` 的结构。在 `Time Bomb Panic` 中，所有游戏对象都作为独立类创建，然后由主应用程序类直接添加到舞台上。图\
  \ 8-2 展示了这种结构。\n\n![图像](img/9781430239922_Fig08-02.jpg)\n\n**图 8-2.** 在 Time Bomb\
  \ Panic 中，所有对象都由主应用程序类添加到舞台上。\n\n在 `Monster Mayhem` 中，所有游戏对象首先被添加到一个名为 `LevelOne`\
  \ 的类中，然后由 `MonsterMayhem` 应用程序类将一个名为 `_levelOne` 的对象添加到舞台上。图 8-3 展示了这一点。\n\n![图像](img/9781430239922_Fig08-03.jpg)\n\
  \n**图 8-3.** 在 Monster Mayhem 中，所有对象首先被添加到 LevelOne 类中，然后主应用程序类创建一个 `_levelOne`\
  \ 对象并将其添加到舞台上。\n\n`LevelOne` 是一个 `Sprite`。这意味着游戏中的所有动作和所有游戏逻辑都发生在 `LevelOne` 这个\
  \ `Sprite` 内部，而不是在应用程序类中。应用程序类所做的只是将关卡添加到舞台上，以便你能看到它。将整个游戏关卡包含在一个 `Sprite` 中的原因是，应用程序类可以通过在舞台上添加或移除关卡来轻松切换关卡。\n\
  \n这里有一个非常重要的知识点要知道：*只有应用程序类能访问舞台*。这意味着它是唯一可以通过将对象显示在舞台上来使其可见的类。请牢记这一点，因为理解它对于掌握你即将需要了解的代码的某些技术细节至关重要。应用程序类是唯一能使用如下代码行的类：\n\
  \n`stage.addChild(gameObject);`\n\n其他类可以在自身内部显示对象，*但不能直接显示在舞台上*。它们只能通过引用 `this`（意为“此类”）来将对象添加到自身：\n\
  \n`this.addChild(gameObject);`\n\n从图 8-3 中可以看出，`LevelOne` 类使用如下代码将对象添加到自身：\n\n```\n\
  this.addChild(_character);\nthis.addChild(_monster);\nthis.addChild(_star);\n```\n\
  \n这意味着这些对象被添加到了 `LevelOne` 类中。这没问题，但只有包含这些对象的 `LevelOne` 类本身在舞台上可见时，你才能实际看到这些对象。这就是为什么应用程序类需要负责从\
  \ `LevelOne` 类创建一个 `_levelOne` 对象并将其添加到舞台上：\n\n`stage.addChild(_levelOne);`\n\n\
  让我们来看看应用程序类 `MonsterMayhem.as`，看看它是如何将 `_levelOne` 添加到舞台上的。这是完整的类代码：\n\n```\npackage\n\
  {\n  import flash.display.Sprite;\n  import flash.events.Event;\n\n  [SWF(width=\"\
  550\", height=\"400\",\n  backgroundColor=\"#FFFFFF\", frameRate=\"60\")]\n\n  public\
  \ class MonsterMayhem extends Sprite\n  {\n    private var _levelOne:LevelOne;\n\
  \    private var _levelTwo:LevelTwo;\n\n    public function MonsterMayhem()\n  \
  \  {\n      _levelOne = new LevelOne(stage);\n      _levelTwo = new LevelTwo(stage);\n\
  \      stage.addChild(_levelOne);\n\n      stage.addEventListener(\"levelOneComplete\"\
  , switchLevelHandler);\n    }\n    private function switchLevelHandler(event:Event):void\n\
  \    {\n      trace(\"Hello from the application class! Switch levels!\");\n   \
  \   stage.removeChild(_levelOne);\n      _levelOne = null;\n      stage.addChild(_levelTwo);\n\
  \    }\n  }\n}\n```\n\n应用程序类负责以下任务：\n\n- 使用 SWF 元标签设置 Flash Player 的参数。\n- 创建两个对象：`_levelOne`\
  \ 和 `_levelTwo`。这些就是游戏关卡。创建这两个对象时，它们都会接收到舞台的引用作为参数，如下所示：\n\n`_levelOne = new LevelOne(stage);`\n\
  \n我稍后会解释这是如何工作的以及为什么这很重要。\n\n- 将 `_levelOne` 对象添加到舞台上。\n- 当玩家完成第一关后，从舞台上移除 `_levelOne`\
  \ 对象并添加 `_levelTwo`。现在不用担心 `switchLevelHandler` 中的这段代码——我们将在本章后面详细讲解。\n\n另外请注意，应用程序类只导入了两个类：`Sprite`\
  \ 和 `Event`——没有其他类。这是因为对于它执行的这些简单任务，它不需要任何其他类。\n\n\n\n#### 使用私有变量和方法\n\n在 `MonsterMayhem.as`\
  \ 中，有一些你之前没见过的新内容。两个关卡对象 `_levelOne` 和 `_levelTwo` 被声明为私有。\n\n```\nprivate var _levelOne:LevelOne;\n\
  private var _levelTwo:LevelTwo;\n```\n\n`switchLevelHandler` 也被声明为私有。\n\n```\nprivate\
  \ function switchLevelHandler(event:Event):void\n{...}\n```\n\n请注意，`private` 意味着这些变量和方法只能在定义它们的类内部使用。它们只能在\
  \ `MonsterMayhem` 类中使用，不能在其他任何地方使用。\n\n*如果在声明属性或方法时没有使用 `private` 关键字，AS3.0 会默认它们是\
  \ `public`（公开的）。公开的属性可以被其他任何类自由访问。如果需要，你可以在代码中使用 `public` 关键字来明确表示这一点。*\n\n为什么要把变量或方法声明为\
  \ `private` 呢？想象一下，你的房子就是一个类，而你的烤箱是类中的一个变量。你的烤箱出了故障，无法打开，于是你叫了一个修理工来检查。但你真的太忙了，修理工来的时候你无法在家，所以你让门开着，相信一切都会顺利。最好的情况是：你回到家，发现烤箱修好了，但一个花瓶碎在地上，沙发上有一个空披萨盒，月底还收到一份账单，上面列出了你确定从未看过的各种付费点播电影。最坏的情况是：你回到家，发现房子烧成了一片废墟，街坊邻居的房子也都着火了。要是你当时能告诉那个修理工（他正拿着他那\
  \ 1 万伏特的充电跨接器准备就绪）：“这是个燃气灶，不是电炉！”就好了。因为你的烤箱是 `public` 的，任何其他不知道它在做什么的类（比如那个修理工）都可以随意对它进行任何修改，从而给你的游戏造成混乱。如果烤箱被声明为\
  \ `private`，那么这个不明所以的修理工就会被拒之门外。\n\n在一个只有几个类的非常小的游戏中，你当然可以将所有变量和方法保持为 `public`，这样一切都会运行良好。然而，在一个较大的游戏中，你会让自己陷入潜在的调试噩梦。因此，为了帮助你养成良好的长期编程习惯，本书中的所有代码都会将类的变量和方法设为\
  \ `private`，除非其他类需要访问它们。\n\n*通过使用 `private` 属性以这种方式锁定一个类，是面向对象编程的一个方面，称为**封装**。封装意味着你的类完全封闭，防止被其他类篡改，并且尽可能自包含。如果其他类想要访问或修改封装类中的任何属性，它们必须遵循非常严格的规则。*\n\
  \n*AS3.0 还有两个特殊的访问器方法，称为 `get` 和 `set`，它们允许类以受控的方式使用另一个类的 `private` 属性。本书中未使用它们，但你可以在\
  \ Adobe 的在线文档 *Programming ActionScript 3.0 for Flash* 的“Methods”章节中阅读更多相关内容，文档地址为\
  \ [`http://help.adobe.com/en_US/ActionScript/3.0_ProgrammingAS3/`](http://help.adobe.com/en_US/ActionScript/3.0_ProgrammingAS3/)。*\n\
  \n你还会注意到，`private` 变量 `_levelOne` 和 `_levelTwo` 的名称以下划线字符 (`_`) 开头。这是一种完全可选的命名约定，但本书将采用此方式。在\
  \ `private` 变量名称前加下划线，有助于你一眼看出哪些属性是 `private` 的。这可以帮助你轻松区分哪些变量在整个类中可访问，哪些变量只能在方法内部访问。你将在后面的一些代码示例中看到这样做的好处。\n\
  \n现在你知道了 `MonsterMayhem` 应用程序类几乎不做任何事情，除了创建并显示一个 `_levelOne` 对象，那么游戏的所有代码在哪里呢？大部分代码都在\
  \ `LevelOne` 和 `LevelTwo` 类中。\n\n### 编程实现游戏\n\n以下是 `MonsterMayhem` 使用的类：\n\n`MonsterMayhem.as`\n\
  `LevelOne.as`\n`LevelTwo.as`\n`Background.as`\n`Character.as`\n`Explosion.as`\n\
  `GameOver.as`\n`Monster.as`\n`Star.as`\n\n正如你刚才所见，`MonsterMayhem` 是应用程序类，负责将关卡添加到游戏中。`LevelOne`\
  \ 和 `LevelTwo` 包含所有游戏编程代码。所有其他类都是游戏对象类。你将首先了解如何将 `LevelOne` 添加到舞台，然后了解如何编程实现游戏的所有具体功能。\n\
  \n#### 让 LevelOne 访问舞台\n\n你刚刚看到，当应用程序类创建 `_levelOne` 对象时，它会将对 `stage` 的引用作为参数传递给它，如下所示：\n\
  \n```\n_levelOne = new LevelOne(stage);\n```\n\n请记住，应用程序类 `MonsterMayhem` 是唯一能够直接访问\
  \ `stage` 对象的类。如果其他任何对象因某种原因需要访问 `stage`，应用程序类必须在创建该对象时将 `stage` 的引用传递给它。对 `stage`\
  \ 的引用通过其构造函数方法传递给对象。`LevelOne` 需要知道 `stage` 的存在，因为它要做的事情之一就是将键盘事件侦听器附加到 `stage`\
  \ 上，以便玩家可以使用方向键移动角色。为了在自身内部保存对 `stage` 的引用，`LevelOne` 还需要一个变量来存储它。以下是 `LevelOne`\
  \ 构造函数及其用于存储舞台引用的 `_stage` 变量的代码（高亮代码是重点内容）：\n\n```\nprivate var _stage:Object;\n\
  public function LevelOne(stage:Object)\n{\n  _stage = stage;\n  this.addEventListener(Event.ADDED_TO_STAGE,\
  \ addedToStageHandler);\n}\n```\n\n当应用程序类创建 `_levelOne` 对象时，它会向其发送一个对 `stage` 的引用。然后，`_levelOne`\
  \ 对象将该引用存储在其自己的变量 `_stage` 中。这意味着，每当 `LevelOne` 类中的代码使用变量 `_stage` 时，它就可以访问 `MonsterMayhem`\
  \ 应用程序类中的主舞台。图 8-4 说明了 `stage` 的引用是如何从 `MonsterMayhem` 应用程序类传递到 `_levelOne` 对象的。\n\
  \n![图片](img/9781430239922_Fig08-04.jpg)\n\n**图 8-4.** 应用程序类将舞台引用发送给 LevelOne。\n\n\
  `LevelOne` 需要这个对 `stage` 的引用，因为它必须将 `keyDownHandler` 和 `keyUpHandler` 附加到它上面。以下是它如何使用新的\
  \ `_stage` 变量来实现这一点：\n\n```\n_stage.addEventListener(KeyboardEvent.KEY_DOWN, keyDownHandler);\n\
  _stage.addEventListener(KeyboardEvent.KEY_UP, keyUpHandler);\n```\n\n你很快就会在完整类的上下文中看到这一点。\n\
  \n\n\n#### 确保 `LevelOne` 确实位于舞台上\n\n当你像刚才那样允许类访问舞台时，会遇到一个额外的技术问题：你必须确保这些对象在尝试访问舞台对象之前，确实已经位于舞台上。如果你使用\
  \ `new` 关键字创建了一个对象，并且该对象在应用类通过 `stage.addChild()` 方法将它添加到舞台之前就尝试访问舞台，就会看到如下错误信息：\n\
  \n```\nError #1009: 无法访问空对象引用的属性或方法\n```\n\n如果你正在向游戏中添加对象，这些对象很可能在创建后就需要立即访问舞台。它们可能需要以此来设置舞台边界，或访问舞台上其他对象的属性。如果它们因为尚未被添加到舞台而无法找到\
  \ `stage` 对象，AS3.0 的编译器就会“摊手放弃”，你就会看到上述错误信息。\n\n要解决这个问题，你需要在对象被添加到舞台之后再进行初始化，而不是在此之前。有一个名为\
  \ `ADDED_TO_STAGE` 的特殊事件监听器正是为此而生。它会等待对象被添加到舞台，然后执行你需要的任何代码。\n\n`LevelOne` 类需要访问舞台来附加移动游戏角色的键盘事件监听器，因此它需要等到被添加到舞台后再尝试这样做。以下是它使用\
  \ `ADDED_TO_STAGE` 事件监听器的方式（重要代码已高亮显示）：\n\n```\npublic function LevelOne(stage:Object)\n\
  {\n  _stage = stage;\n  this.addEventListener(Event.ADDED_TO_STAGE, addedToStageHandler);\n\
  }\nprivate function addedToStageHandler(event:Event):void\n{\n  startGame();\n \
  \ this.removeEventListener\n    (Event.ADDED_TO_STAGE, addedToStageHandler);\n}\n\
  private function startGame():void\n{\n  //所有设置和初始化游戏的指令\n}\n```\n\n一旦应用类创建了 `LevelOne`\
  \ 对象，构造函数方法就会设置好 `ADDED_TO_STAGE` 监听器。\n\n```\nthis.addEventListener(Event.ADDED_TO_STAGE,\
  \ addedToStageHandler);\n```\n\n它会等待直到对象出现在舞台上。一旦出现，就会运行 `addedToStageHandler`。该处理器负责调用\
  \ `startGame` 方法，并且移除监听器，如下所示：\n\n```\nprivate function addedToStageHandler(event:Event):void\n\
  {\n  startGame();\n  this.removeEventListener\n    (Event.ADDED_TO_STAGE, addedToStageHandler);\n\
  }\n```\n\n然后，`startGame` 方法会运行所有创建游戏对象和初始化游戏变量的指令。\n\n这是一个需要克服的技术障碍。没错，这确实很烦人！但不幸的是，对于任何非应用类的类，如果需要引用或使用\
  \ `stage` 对象，这却是必不可少的。图 8-5 展示了 `ADDED_TO_STAGE` 监听器如何启动类的代码。幸运的是，这些都是非常常规的代码，你不需要耗费太多脑力去过度思考。只需盲从地按此示例在你自己游戏中照做即可，不必过于担忧。\n\
  \n![Image](img/9781430239922_Fig08-05.jpg)\n\n**图 8-5.** 等待对象位于舞台上之后再对其进行初始化。\n\n\
  `ADDED_TO_STAGE` 监听器有一个配套的监听器叫 `REMOVED_FROM_STAGE`。`REMOVED_FROM_STAGE` 事件监听器会在对象从舞台被移除时触发。非常重要的是，`REMOVED_FROM_STAGE`\
  \ 允许你移除可能正在对象上运行的其他任何事件监听器。这对于 `ENTER_FRAME` 或定时器事件尤其重要。AS3.0 的一个小怪癖是，即使使用 `removeChild`\
  \ 将对象从舞台上移除，它们的 `ENTER_FRAME` 事件仍会在后台静默运行。如果某个 `ENTER_FRAME` 事件正在运行并试图引用已不存在的对象，就会产生大量错误信息。为了防止这种情况，你可以使用\
  \ `REMOVED_FROM_STAGE` 事件，在对象本身被移除时移除它的 `enterFrameHandler` 事件监听器——如果你的代码没有以其他方式移除它的话。\n\
  \n以下是使用 `REMOVED_FROM_STAGE` 事件监听器的格式。首先，在类的构造方法中添加它：\n\n```\npublic function ClassConstructorMethod()\n\
  {\n  //... 任何类初始化代码\n  //或其他监听器...\n  this.addEventListener\n    (Event.REMOVED_FROM_STAGE,\
  \ removedFromStageHandler);\n}\n```\n\n接着，使用 `removedFromStageHandler` 来运行当对象从舞台移除时应执行的任何代码。非常重要的是，你还需要移除\
  \ `removedFromStageHandler` 本身。\n\n```\nprivate function removedFromStageHandler(event:Event):void\n\
  {\n  //... 你想在对象从舞台移除时\n  //运行的任何指令\n  this.removeEventListener\n    (Event.ENTER_FRAME,\
  \ enterFrameHandler);\n  this.removeEventListener\n    (Event.REMOVED_FROM_STAGE,\
  \ removedFromStageHandler);\n}\n```\n\n*虽然手动移除 `ENTER_FRAME` 事件是必需的，但手动移除其他事件监听器是可选的。在大多数情况下，即使对象上仍有监听器，Flash\
  \ 仍然会删除对象。不过，为了确保万无一失，最佳实践是手动移除它们，这样你就能绝对确定，在对象消失后不会有任何残留代码在后台运行。*\n\n\n\n### `LevelOne`\
  \ 类\n\n第一关的所有游戏逻辑都包含在`LevelOne`类中。它执行了之前章节中应用类所承担的工作。因此，除了刚才介绍的一些新技术细节外，大部分代码都会非常熟悉。但这段代码也做了许多新的事情：\n\
  \n*   让角色发射星星弹丸。\n*   让怪物在被击中时张嘴。\n*   在怪物被消灭时，在舞台上添加爆炸效果。\n*   在关卡结束时显示“关卡完成”或“游戏结束，你输了”的信息。\n\
  *   在关卡完成时生成一个`levelComplete`事件，以便应用类知道它需要加载第二关。\n\n你将逐个详细查看这些新特性。但为了让你有一个完整的代码参考，以下是`LevelOne`的完整代码清单：\n\
