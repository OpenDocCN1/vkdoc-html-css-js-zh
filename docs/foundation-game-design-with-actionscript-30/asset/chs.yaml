  \ Flash Builder 的配置进行一个小改动，告诉它在 Flash Player 窗口中直接运行你的程序，而不是在网页浏览器中。\n\n### 告诉 Flash\
  \ Builder 在 Flash Player 中运行你的程序\n\n当你使用 Flash Builder 创建游戏时，它会获取你在编辑器中编写的编程代码，并在\
  \ Flash Player 软件中运行它。当你安装 Flash Builder 时，Flash Player 软件会自动安装在你的计算机上。然而，当你首次安装\
