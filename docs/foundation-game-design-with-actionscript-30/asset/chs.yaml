  ```\n\n\n```actionscript\nthis.removeEventListener(Event.ENTER_FRAME, enterFrameHandler);\n\
  ```\n\n```actionscript\nprivate function checkStageBoundaries(gameObject:Sprite):void\n\
  {\n  if (gameObject.x < 50)\n  {\n    gameObject.x = 50;\n  }\n  if (gameObject.y\
  \ < 50)\n  {\n    gameObject.y = 50;\n  }\n  if (gameObject.x + gameObject.width\
  \ > _stage.stageWidth - 50)\n  {\n    gameObject.x = _stage.stageWidth - gameObject.width\
