  \n### Flash 动画与发布你的游戏\n\n本书大部分内容都集中在编写制作视频游戏所需的计算机代码上。这是最困难的部分，但除了编写代码之外，你还可以并且应该对你的游戏做更多的事情。如何轻松地为你的游戏创建动画对象，以及创建游戏后如何发布？你将在本书下载包中的附加章节“Flash\
  \ 动画与发布你的游戏”中找到这两件事的答案。你将学习如何使用 Flash Professional 软件快速制作游戏动画，并通过 AS3.0 代码进行控制。此外，如果你想为手机和平板电脑制作游戏，你还将学习如何使用\
  \ Flash Builder 将游戏发布到这些平台。\n\n\n\n### 总结\n\n嘿，这本书已经读完了吗？是的，但感觉真正的乐趣才刚刚开始！如果你已经读到了书中的最后一部分，请为自己鼓掌：你已经成为一名游戏设计师了！凭借你在本书中学到的技能，你已经能够自信地应对绝大多数游戏设计场景。\n\
  \n然而，如果你和其他所有初学游戏设计的人一样，你会发现学习更多知识的欲望是无止境的。尽管你已经掌握了这么多知识，但前方仍有广阔的学习宇宙等待着你。以下是一些你可能想要探索的领域的快速汇总：\n\
  \n-   *Adobe 在线帮助文档：* Adobe 维护着优秀的在线文档，详细说明了 `AS3.0` 编程的大部分内容。你可以通过将网页浏览器指向 Adobe\
  \ 的 ActionScript 技术中心来访问这些文档：[`www.adobe.com/devnet/actionscript.html`](http://www.adobe.com/devnet/actionscript.html)。在那里，你会找到指向\
  \ ActionScript 3 开发人员指南和适用于 Flash 平台的 ActionScript 3 参考的链接。我在本书中多次引用了这些文档中的章节，它们仍然是关于所有\
  \ Flash 和 `AS3.0` 相关事宜的最全面的主要来源。尽管它们讨论的主题和采用的方法都相当高级，但应该符合你当前的能力水平。花些时间阅读其中数百篇文章中的一部分，你一定会找到丰富的内容来激发你日益增长的编程技能。\n\
  \n-   *3D：* 随着 Flash Player 11 和 Stage 3D 的发布，Flash 已成为构建交互式 3D 世界和游戏的绝佳平台。你可以在此处的\
  \ Adobe Stage 3D 网站上了解如何使用 `AS3.0` 编写 3D 游戏：[`www.adobe.com/devnet/flashplayer/stage3d.html`](http://www.adobe.com/devnet/flashplayer/stage3d.html)。有一些\
  \ 3D 游戏引擎可以帮助你使用 `AS3.0` 和 Flash 创建 3D 游戏：Alternativa、Flare3D、Away 3D 以及 Adobe 自家的\
  \ Proscenium。你还可以使用 Stage 3D 来制作 2D 游戏，并且能够完全利用计算机或移动设备的图形处理单元（GPU）来获得出色的性能。易于使用的\
  \ Starling 框架以及 `ND2D` 可以帮助你实现这一点。\n\n-   *物理引擎：* 有一些优秀的类库可用于使用 `AS3.0` 进行精确的物理模拟。其中包括\
  \ `Box2D`、`Motor2`、`APE`、`Foam`、`Flave`、`World Construction Kit`、`JigLib` 和 `Glaze`。\n\
  \n-   *基于瓦片的游戏：* 在这种游戏设计风格中，舞台上的所有物体都被分配到网格中的方格中。然后代码在后台的数组中创建一个游戏的抽象模型，并使用该模型来更新舞台上的对象。棋盘游戏、策略游戏和某些益智游戏非常适合采用基于瓦片的方法。基于瓦片的游戏运行效率非常高，消耗相对较少的\
  \ CPU 资源和内存，并且如果你想要添加新的游戏关卡，扩展起来也非常容易。因此，基于瓦片的方法也适用于平台游戏和冒险游戏。\n\n-   *向量数学与几何：*\
  \ 如果你想创建涉及一定物理模拟的游戏，花点时间学习一些向量数学和 2D 几何知识是非常有益的。即使你认为自己不擅长数学，也请尝试一下——你可能会给自己一个惊喜。你可以立即将学到的知识应用到你的游戏中。\n\
  \n-   *保存游戏数据：* 如果你想在游戏中保存一些数据（例如分数或游戏关卡），以便玩家可以退出游戏并在稍后继续，你需要创建一个共享对象。这在 Adobe\
  \ 在线文档 *为 Flash 编写 ActionScript 3.0* 的“网络与通信”一章中的“存储本地数据”部分有详细说明。\n\n-   *多人游戏：*\
  \ 与朋友一起玩游戏总是更有趣。要制作多人游戏，你需要将游戏数据存储在 Web 服务器上，以便其他玩家可以访问这些数据来更新他们自己的游戏画面。有很多方法可以实现这一点，但都需要研究额外的“服务器端技术”。你的\
  \ Flash 游戏将能够与这些服务器端技术进行通信，但要实现其中的大多数技术，你需要学习新的编程语言，如 `PHP` 或 `Java`。对诸如 `SmartFoxServer`、`ElectroServer`\
  \ 和 `Pulse` 等 Java 套接字服务器进行一些研究。（Java 与 `AS3.0` 关系非常密切，所以你不会感到完全陌生。）你可以使用 `PHP`\
  \ 为你的游戏创建一个高分榜，并且可以使用 `MySQL` 数据库来存储游戏数据。你可以通过将游戏数据存储在内容管理系统（CMS）中，并在 Flash 中使用\
  \ `XML` 访问这些数据，来直接避开 Java 和 `PHP`。Adobe 也提供了自己的 Flash Media 服务器。Media Development\
  \ Server 是免费的，虽然功能有限，但它是在熟悉的环境中接触多人游戏技术的绝佳入门方式。正如你所看到的，有很多东西要学！但所有投入的时间都是值得的。\n\n\
  当然，这本书其实并没有真正结束——你只进行到一半。《Flash 高级游戏设计》接续本书的内容，涵盖了将你的技能提升到真正专业水平所需的所有高级技术。\n\n正如每个游戏设计师所知，制作游戏比玩游戏有趣得多。就像一个刚刚学会调色和勾勒几个简单场景的艺术家一样，你只需要一点练习，就能走上创作杰作的道路。你现在已经在使用\
  \ Flash 和 `AS3.0` 进行游戏设计方面打下了坚实的基础——去制作一些精彩的游戏吧！\n\n![Image](img/chap.jpg)\n\n##\
