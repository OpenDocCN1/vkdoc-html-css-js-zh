- "# 设计思维\n\n设计思维是一套用于规划和创建以人为中心的设计问题的产品与解决方案时，所运用到的战略性和创造性流程及原则。\n\n本系列以设计与创新为两大关键驱动原则，重点关注但不限于以下领域和主题：\n\
  \n* 用户界面 (UI) 与用户体验 (UX) 设计\n* 设计心理学\n* 人机交互 (HCI)\n* 人因工程学设计\n* 产品开发与管理\n* 虚拟现实与混合现实\
  \ (VR/XR)\n* 以用户为中心的建筑环境与智能家居\n* 无障碍性、可持续性与环境设计\n* 学习与教学设计\n* 策略与最佳实践\n\n本系列丛书面向行业内的设计师、开发者、故事讲述者和问题解决者，旨在帮助他们了解当前创造力前沿的最新发展和最佳实践，创建新的范式与解决方案，并激励创意工作者突破边界，设计出比以往更宏大、更卓越的作品。\n\
  \n更多关于本系列的信息，请访问 [`https://link.springer.com/bookseries/15933`](https://link.springer.com/bookseries/15933)。\n\
  \nISSN 2945-7793  \ne-ISSN 2945-7807  \n设计思维  \nISBN 979-8-8688-0085-6  \ne-ISBN\
  \ 979-8-8688-0086-3  \n[`doi.org/10.1007/979-8-8688-0086-3`](https://doi.org/10.1007/979-8-8688-0086-3)\
