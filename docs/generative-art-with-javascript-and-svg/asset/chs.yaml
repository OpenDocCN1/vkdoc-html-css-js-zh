  \ 1 号，邮编 10004。\n\n*献给创作艺术这一深刻的人类体验。*\n\n## 引言\n\n在开始之前，先提个醒：生成式艺术，以及更广泛的创意编程，可能会成为一种让人沉迷的瘾。\"\
  再来一次迭代\"是你可能从那些身陷其中的不幸艺术家口中听到的口头禅。创意工作者渴望下一次生成式创作的快感，并恰好掺入恰到好处的随机性。\n\n本书的目的是以清晰、合乎逻辑的方式，小剂量地揭示这种计算魔法，让你能够安全且神志清醒地接触这个主题。我们将见证由机械精确性诞生的有机形态，不可预测的色彩铺满屏幕，线条与形状以不可思议的和谐汇聚，以及从简单规则中涌现出的复杂结构。这便是生成式艺术的精髓——一切并非尽在你掌控之中。\n\
  \n话虽如此，对于艺术家而言，这也是一种需要时间、耐心和技巧的媒介——其要求绝不亚于其他艺术媒介。虽然我可能夸大了它对实践者的掌控力，但我真正想表达的是，编程拥有其富有表现力的一面——它可能会令人沮丧、让人头疼，这是肯定的——但它也能引人入胜并激发灵感。如果我能为你装备一些新的生成式工具和技术，并在这个过程中让你对其创造潜力略感兴奋——这些潜力超越了艺术领域，延伸至设计和\
  \ Web 开发——那么本书就远远完成了它的使命。\n\n### 你需要了解什么\n\n作为读者，在阅读本书之前需要了解些什么？如果你对编程的核心概念，如`变量`、`函数`、`循环`和`条件语句`感到得心应手，那么学习过程无疑会更加轻松。这类概念在不同的编程语言中大同小异，主要区别在于语法，因此即使你之前使用的是\
  \ JavaScript 以外的语言，也完全没问题。\n\n如果你没有任何编程经验，我们将在第 2 章介绍所需的概念，但我必须强调，本书并非一本编程入门书籍。最好将第二章视为一本入门手册，一个让你在其他地方更深入学习的跳板。一门简短的入门课程对你会有很大帮助。我个人推荐出色的[`freeCodeCamp.com`](https://freeCodeCamp.com)，我自己也花了大量时间在这个网站学习。它提供了关于`HTML`、`CSS`和`JavaScript`基础知识的免费交互式教程，以及其他更多内容。\n\
  \n对于来自其他语言（如 Python、PHP 或 C#）的读者，阅读第二章可能仍然有价值，以确保你熟悉`JavaScript`的语法和一些特性。\n\n如果你已经是一名有经验的\
  \ Web 开发者，根据你的经验水平，可以跳过（或快速浏览）第 2 章。如果你对我们开篇示例（我们将以此结束第 1 章）中使用的任何技术或语法不熟悉，我鼓励你阅读第二章，那里会对它们进行详细解释。Web\
  \ 开发领域非常广阔，对一位开发者来说驾轻就熟的内容，对另一位开发者来说可能还是前沿技术。\n\n### 你将学到什么\n\n我前面提到过，将为你配备一些新工具和技术。现在让我们来详细说明一下。\n\
  \n#### 工具\n\n在工具方面，我们将使用以下内容：\n\n*   `JavaScript`和`SvJs`库。我稍后会详细说明这一点。\n*   一个代码编辑器。这里我将为你提供两种选择：\n\
  \    *   `Visual Studio Code`（一个优秀的开源代码编辑器）\n    *   `CodePen`（一个流行的在线代码编辑器）\n*\
  \   如果你选择使用`Visual Studio Code`（我推荐），我们还将使用`Node.js`和`NPM`来管理依赖项（这是作为开发者应该养成的良好习惯）。\n\
  \n所有代码示例都可从`GitHub`和`CodePen`上获取，所以请随意按照你喜欢的任何方式跟进学习。你当然可以两种方式都采用：在本地使用代码编辑器工作，同时在线查看`CodePen`示例以快速获取灵感。为方便起见，我会将所有`CodePen`示例整理并嵌入到[`davidmatthew.ie/generative-art-javascript-svg`](https://davidmatthew.ie/generative-art-javascript-svg)。\n\
  \n\n\n### 技术概览\n\n就我们将涉及的技术而言，读完本书后，你应该会对以下内容有一个良好的整体认知：\n\n- `SvJs` 库的主要功能及其与 SVG\
  \ 规范的关系\n- 使用 ES6+ 语法，通过 JavaScript 创建生成式艺术草图\n- 生成基础的 SVG 形状\n- 通过随机化参数创建草图的迭代变体\n\
  - 使用噪声创建有机变化\n- 生成复杂的 SVG 路径\n- 制作交互式草图\n- 为草图添加动画效果\n- 以生成方式使用 SVG 滤镜\n\n我们将涉及大量内容，所以不必给自己太大压力，强求理解一切。我自己也常常在某个编程概念上反复碰壁无数次后才终于豁然开朗（JavaScript\
  \ 的 Promise 机制，有人懂吗？），而每次真正理解的时候，通常是因为我在尝试构建一些*真正想做*的东西，而不是机械地重复教程步骤。教程和指导性书籍当然有它们的价值（否则我也不会写这本书了），但重要的是你要从中汲取*你自己*需要的东西，而不是把它们当作必须严格遵守的教学大纲。\n\
  \n保持游戏感很重要，尤其是在艺术创作中。虽然我之前提到了工具，但我更希望你将这本书视为一个玩具箱，而不是工具箱。当我想到工具时，我想到的是需要解决的问题，比如那个歪斜的橱柜上你一直说要去拧紧的松动铰链。工具往往更注重功能性而非趣味性，而我更希望你能从这本书中获得一些乐趣。\n\
  \n## 致谢\n\n我首先要感谢那些永远应该放在第一位的人：我了不起的妻子桑德拉、我帅气的儿子诺亚、我忠实的伙伴考，以及一直相信我的神奇母亲。\n\n感谢我的技术审阅员欧因·奥·康楚瓦尔，他的专业知识和严谨的代码审查剔除了许多错误，并促使我进一步阐明那些原本过于模糊的观点。你的贡献使得这本书整体上更加出色，而书中任何遗留的错误都仅由我一人负责。\n\
  \n感谢我在 Apress 出版社的编辑团队：詹姆斯·罗宾逊·普赖尔、格里芬·温克勒和詹姆斯·马克汉姆。自从启动这个项目的 15 个月以来，我搬了家，换了工作，而最改变人生的莫过于迎来了一个新生命。在所有这些变化（有时甚至是混乱）中，你们始终表现出极大的理解、灵活性和热情。\n\
  \n在更广泛的生成式艺术与创意编程社区中，我要感谢一些杰出人士，他们启发了我自己的工作，并以其慷慨和创造力不断令我惊叹：巴勃罗·阿尔穆尼亚，他出色的 `gySVG`\
  \ 库是 `SvJs` 的灵感来源，并为第一章提供了宝贵的见解；艾哈迈德·穆萨（又名大猩猩太阳），他的写作让我们这些艺术家始终紧跟潮流；萨拉·苏埃丹，她在 SVG\
  \ 滤镜方面的开创性工作让我总是反复研读；马特·皮尔逊，他是最早点燃我心中生成式艺术火花的作者之一；基思·彼得斯，他帮助我和许多其他程序员不再畏惧数学；以及丹·希夫曼，他是经典著作《代码本色》背后的天才，他的热情极具感染力，我无法用言语完全捕捉（去看看他在\
  \ YouTube 上名为“编码列车”的频道，你就会明白我的意思）。\n\n最后，感谢我的朋友们和家人们给予的所有支持。戴尔，感谢你的幽默感（以及假装把我发到\
  \ Instagram 上的任何东西都铸成 NFT）；斯蒂芬（`letsfundit.ie` 的创始人，一个非常值得推荐的慈善机构），感谢你在办公室的闲聊以及总是询问书的进展。史蒂文·S，感谢你帮我度过艰难时期。感谢我在\
  \ UL 的新团队，谢谢你们的热情欢迎和全方位的出色表现。还要感谢我的兄弟姐妹布莱恩、保罗、克莱尔和莎拉，谢谢你们承诺会从头到尾读完这本书（开个玩笑——但你们至少得读读封底吧！）。\n\
  \n## 关于作者 关于技术审阅员\n\n"
- "# 1. 初学者的路径\n\n在踏上任何一条路径之前，基础工作必须到位。在本开篇章节中，这正是我们要做的——打好基础。我们将介绍 SVG，解释是什么使它成为一种独具优势的图像格式，并展示如何将其与\
  \ JavaScript 结合来创建生成式艺术。在此过程中，我们将配置好我们的工具，并建立一个可用于后续草图的模板。\n\n## 为什么选择 JavaScript\
  \ 和 SvJs？\n\n大多数关于生成式艺术的书籍都使用一种基于 Java 的语言，称为 Processing，或者它的 JavaScript 移植版本 `p5.js`。Processing\
  \ 是专门为刚接触编程的艺术家和设计师创建的，拥有庞大且活跃的社区。那么，为什么这本书不使用它呢？\n\n我最初接触生成式艺术正是从 Processing 开始的，所以我当然认可它的价值。当\
  \ `p5.js` 库在 2013 年首次发布时，我很快就转向了它，这允许直接用 JavaScript（Web 的语言）编写生成式草图。但是，当我想将自己的一些草图集成到现实的\
  \ Web 开发项目中时，它的局限性很快就显现出来了。它是一个*庞大*的库，根据最近一次检查，大小接近一兆字节。虽然这听起来可能不算什么，但按照 Web 开发的标准来看，这已经很多了。\n\
  \n`p5.js` 库构建在 HTML Canvas API 之上，而我很快发现这个 API 实际上使用起来相当直接。直接使用这个 API，我能够实现与 `p5.js`\
  \ 大体相同的结果，所以它成了我的首选。然而，我所有草图（无论是 `p5.js` 还是 Canvas）的输出仍然是分辨率依赖的位图图形，缺乏任何语义内容。这意味着什么？为什么这很重要（至少对我而言）？让我来解释一下。\n\
  \n### 介绍可缩放矢量图形\n\n早在 Web 的早期时代，当拨号调制解调器占据主导地位，连接互联网绝非瞬间完成时，带宽是极其宝贵的。如果你希望页面能在你有生之年加载完成，文件大小就必须非常小，而位图图像（如\
  \ JPG 和 PNG）是主要的带宽瓶颈。\n\n位图图像——也称为栅格图像——由大量数据（或比特）组成。一般来说，如果你想要更大的图像，就需要更多的比特，这意味着更大的文件大小。另一方面，SVG\
  \ 是一种矢量格式，这是根本性的不同。SVG 可以缩放到任意尺寸，而文件大小不会相应增加，并且它始终极其清晰锐利。这是可能的，因为它不关心将图像绘制到屏幕所需的比特（即像素），而是在更抽象、更具语义的层面上描述要渲染的图像。它描述图像的方式，与\
  \ HTML 描述网页结构和内容的方式非常相似。正如 Mozilla 开发者网络所说：\n\n> 本质上，SVG 之于图形，就如同 HTML 之于文本。\n\n\
  SVG 格式不仅是解决实际带宽问题的强大方案；它还是由万维网联盟正式标准化的非专有格式（这在 Web 技术世界中几乎等同于面向未来）。其被广泛采用的条件早在 1999\
  \ 年就已具备，但不幸的是，浏览器厂商行动迟缓，支持引入得极其缓慢。因此，在很长一段时间里（至少按互联网的时间尺度来看），SVG 默默无闻，不为人知。直到 Flash（Adobe\
  \ 的专有格式，需要插件才能运行，且经常充斥着安全漏洞）的衰落，以及响应式设计和视网膜（或高 PPI）屏幕的兴起，其可缩放性和锐利度才真正大放异彩，SVG 才终于获得了它应得的支持。\n\
  \n如今，我们可以毫无顾虑地自由使用这种格式，但仅用于制作一些图标和徽标是一回事；挖掘其全部潜力则是另一回事。\n\n\n\n### 原生 SVG\n\n由于\
  \ SVG 与 HTML 一样是一种声明式语言，它具有极佳的可读性，并且很容易上手。就像 HTML 元素一样，SVG 元素使用开闭尖括号编写，并包含带有值的属性。例如，下面展示了如何创建一个圆形：\n\
  \n```\n<circle r=\"10\" cx=\"20\" cy=\"20\" fill=\"red\" />\n```\n\n上述示例中的属性 `r`、`cx`、`cy`\
  \ 和 `fill` 分别指代圆的半径、圆心在 x 轴和 y 轴上的坐标，以及填充颜色。这些属性命名合理，易于理解。\n\n某些 SVG 元素会包含嵌套在其中的其他元素（称为其子节点），因此需要有开闭标签。一个显著的例子是父级\
  \ `<svg>` 元素本身，它包含了所有其他 SVG 元素。\n\n为了展示如何手写 SVG，以下是一个以西尔玛·阿夫·克林特（Hilma af Klint）——可以说是西方艺术史上第一位抽象艺术家——风格创作的极简构图的底层标记语言。\n\
  \n```\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\">\n  <circle\
  \ cx=\"25\" cy=\"25\" r=\"20\" fill=\"pink\" />\n  <circle cx=\"75\" cy=\"25\" r=\"\
  20\" fill=\"orange\" />\n  <circle cx=\"25\" cy=\"75\" r=\"20\" fill=\"lightblue\"\
  \ />\n  <circle cx=\"75\" cy=\"75\" r=\"20\" fill=\"lightgreen\" />\n</svg>\n```\n\
  \n一个受西尔玛·阿夫·克林特启发的简单仿制品\n\n如你所见，SVG 的编写方式保留了代码的语义。搜索引擎非常喜欢这一点；它们不再面对难以穿透的像素墙，而是能清晰地在标记语言中看到其*意图*。在这个例子中，四个圆按照书写顺序显示，并附带一个标题以增强可访问性。图\
  \ 1-1 展示了这个标记语言渲染后的效果。\n\n![](img/538894_1_En_1_Fig1_HTML.png)\n\n一幅抽象画，呈现一个深色方形结构，中心有\
  \ 4 个不同色调的同心圆。\n\n**图 1-1** – 仿西尔玛·阿夫·克林特《天鹅》的简单构图\n\n声明式格式易于阅读，但缺点是编写起来可能很繁琐。如果我们想要\
  \ 100 个圆而不是四个呢？使用原生 SVG，我们得逐个手写全部 100 个圆。而且，如果我们想让圆显示在随机的 `cx` 和 `cy` 位置上，每个圆使用随机选择的\
  \ `fill` 颜色，这根本不可能做到。变量、循环、函数以及所有命令式编程中有趣的东西，我们都无法使用。声明式格式更关注程序*是什么*，而不是*如何做*。然而，*如何做*对我们至关重要。没有*如何做*，就不会有算法，而算法是生成式艺术的核心。\n\
  \n算法就像食谱；它们包含了实现特定结果所需的步骤。如果你在烤蛋糕，你不会只是大喊一声“蛋糕！”就期望它凭空出现，无论你的声明多么具体（“加草莓糖霜和焦糖夹心！”）。这将是声明式方法，在实践中，听起来有点古怪。要烤蛋糕，你需要遵循一系列定义明确的步骤或指令，并准备好原料和烤箱。这类似于编程中的命令式方法；它更亲力亲为，有时事情会变得一团糟。但最终它能给你更多的创意控制权。\n\
  \n### 生成 SVG\n\n那么，如果原生 SVG 不允许使用算法，我们如何用命令式方法编写 SVG 呢？答案是*编写脚本*来生成 SVG，这就是 JavaScript\
  \ 和 SvJs 发挥作用的地方。\n\n我们可以在没有库的情况下直接用 JavaScript 编写 SVG 脚本，但这也有其挑战，主要在于需要编写冗长的样板代码。SvJs\
  \ 库省去了我们的麻烦，让编写 SVG 更加直观和有趣。以下是一个用原生 JavaScript 编写的简单 SVG（图 1-2）示例：\n\n```javascript\n\
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\nsvg.setAttribute('width',\
  \ '150px');\nsvg.setAttribute('height', '150px');\n\nconst div = document.getElementById('container');\n\
  div.appendChild(svg);\n\nconst rect = document.createElementNS('http://www.w3.org/2000/svg',\
  \ 'rect');\nrect.setAttribute('x', '0');\nrect.setAttribute('y', '0');\nrect.setAttribute('width',\
  \ '150');\nrect.setAttribute('height', '150');\nrect.setAttribute('fill', 'cornflowerblue');\n\
  svg.appendChild(rect);\n```\n\n而以下片段是用 SvJs 编写的等效 SVG（暂时不用关心细节；你只需要注意它与原生 JavaScript\
  \ 相比有多简洁）。这段代码的输出见图 1-2。\n\n```javascript\nconst div = document.getElementById('stage');\n\
  const svg = new SvJs().set({ width: '150px', height: '150px' }).addTo(div);\nsvg.create('rect').set({\n\
  \  x: 0, y: 0, width: 150, height: 150, fill: 'cornflowerblue'\n});\n```\n\n![](img/538894_1_En_1_Fig2_HTML.png)\n\
  \n一幅抽象画，呈现一个亮色调的矩形。\n\n**图 1-2** – 一个矢车菊蓝色的矩形，尽显风采\n\n现在，你*可以*编写一些函数来减少编写原生 JavaScript\
  \ 的痛苦，但这会导致你编写一大堆其他实用函数来减轻基础工作的负担。使用 SvJs，我尽力为你省去这个麻烦。它本质上是对真实 SVG 规范的一个非常轻量的封装，并加入了一些有用的生成式函数。这使其保持极小的体积，同时保持对\
  \ SVG 规范的忠实。\n\nSvJs 的灵感来自 gySVG 库，这是一个类似轻量但更通用的 JavaScript 库，附带完整的插件 API 和现代框架支持。我最初打算使用\
  \ gySVG 并通过插件扩展其功能，但这个插件很快发展到我认为更有意义的是编写一个专注于生成式艺术的自己的库。SvJs 就这样诞生了。\n\n### 准备工作\n\
  \n前言说得够多了。让我们开始动手编写代码吧。\n\n#### 代码编辑器\n\n如果你的机器上还没有运行 VS Code，请前往 [code.visualstudio.com](https://code.visualstudio.com)\
  \ 下载并安装适合你操作系统的版本。\n\n如果你无法在机器上安装代码编辑器，或者更愿意在线学习，你可以改用 CodePen。前往 [codepen.io](https://codepen.io)\
  \ 并注册一个账户，如果你还没有注册的话。\n\n本书中的示例将使用 VS Code 编辑器并基于本地文件编写；相同的代码可以在线找到 CodePen 版本，仅有微小差异（例如我们如何导入\
  \ SvJs 库，以及缺少 CodePen 自动提供的 HTML 样板文件）。\n\n#### Node.js 和 NPM\n\n如果你只打算使用 CodePen，可以跳过这部分。但如果你有任何进入\
  \ Web 开发领域的计划，我仍然建议你熟悉 Node.js。\n\nNode.js 是一个开源 JavaScript 运行时环境，允许你设置自己的 JavaScript\
  \ 驱动的服务器。它还允许你通过内置的包管理器 NPM 管理依赖项。\n\n前往 [nodejs.org](https://nodejs.org) 下载并安装最新的\
  \ LTS（长期支持）版本。\n\n#### 初始化并安装 SvJs\n\n创建一个基础文件夹，用于保存与本书相关的所有作品，并将其命名为类似 `generative-svg`\
  \ 的名称。\n\n打开 VS Code，选择 **文件 ➤ 打开文件**，然后导航到该文件夹。接下来，选择 **终端 ➤ 新建终端** 命令，你应该会看到屏幕底部出现一个新窗口，引用了当前文件夹的位置。它应该看起来像这样：\n\
  \n```\nyour-name@computer-name ~/Documents/generative-svg\n```\n\n重要的是路径要指向你在上一步创建的文件夹（即\
  \ `generative-svg`）。确认无误后，就可以初始化项目了。为此，在终端中输入以下内容：\n\n```\nnpm init -y\n```\n\n\n\
  \n"
- "# 运行包管理器并安装 SvJs\n\n此操作将运行 Node 的包管理器 `npm`，而 `init` 命令则用于初始化项目（或称“包”）。`-y` 标志告诉\
  \ `npm` 我们接受所有默认设置选项。您会注意到已创建一个名为 `package.json` 的新文件。这是您在 Web 开发中会经常遇到的文件，但目前无需担心其内容。只需知道它的作用是管理我们的依赖项，其中最主要的依赖项就是\
  \ SvJs 库。\n\n要安装 SvJs，请运行以下命令：\n\n```bash\nnpm install svjs\n```\n\n这会在 `package.json`\
  \ 文件中新增一行，引用了您刚刚安装的 SvJs 版本。同时还会创建一个 `package-lock.json` 文件（一个您永远无需查看的文件）和一个 `node_modules`\
  \ 文件夹，SvJs 及其所有依赖项都存储在此文件夹中（它没有任何依赖项，因此您不会在这里看到其他文件夹）。\n\n## 搭建草图框架\n\n在开始处理 JavaScript\
  \ 之前，我们的第一个草图需要一些 HTML 和 CSS。我们会尽量精简这些标记和样式，并在全书范围内保持基本一致，因为真正的重点将放在 JavaScript\
  \ 上。\n\n现在，在项目根文件夹内创建一个名为 `sketches` 的新文件夹，然后在 `sketches` 文件夹内创建一个名为 `00-template`\
  \ 的新文件夹。我们对文件夹进行编号，以便于排序。`00-template` 文件夹将包含我们从一个草图复制到另一个草图的极简基础内容。在 `00-template`\
  \ 文件夹内创建两个文件：`index.html` 和 `sketch.js`。完成这些操作后，您应该会得到如下所示的文件夹结构：\n\n```\ngenerative-svg\n\
  |-- node_modules\n|-- sketches\n|-- 00-template\n|-- index.html\n|-- sketch.js\n\
  |-- package-lock.json\n|-- package.json\n```\n\n打开 `index.html` 文件。值得注意的是，如果您键入\
  \ `!` 并按 `tab` 键，VS Code 可以为您生成一些样板标记，但我会在此处完整提供我们的样板代码，以便您复制粘贴。一般来说，我建议您自己动手编写示例代码，并尽可能限制“复制粘贴”操作，因为这种方式学习效果较差。不过，在这里这样做是可以的，因为\
  \ HTML 和 CSS 并非我们的重点。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
  \ initial-scale=1.0\">\n  <title>SvJs 模板</title>\n  <style>\n    body {\n      margin:\
  \ 0;\n      background-color: #202020;\n    }\n    #container {\n      display:\
  \ flex;\n      justify-content: center;\n      align-items: center;\n      height:\
  \ 100vh;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"></div>\n \
  \ <script type=\"module\" src=\"sketch.js\"></script>\n</body>\n</html>\n```\n\n\
  关于上述代码，有几点值得指出：我们的 `<div id=\"container\">` 将是生成艺术实际发生的地方。可以这么说，它将成为我们的画布。我将其放置在屏幕中央，移除了所有默认边距，并为模板赋予了整体的“深色模式”感觉（这是我个人的偏好）。在\
  \ `<div>` 下方，您会看到一个 `<script>` 标签。这是我们引入所有代码的地方，因此后续无需再对 HTML 进行任何修改（可能除了更新每个草图的\
  \ `<title>` 标签之外，但我会把这个留给您决定）。脚本设置为 `type=\"module\"`。这使我们能够处理作为模块打包（或导出）的其他文件和库的导入。这是一个值得养成的好习惯，也是我们导入\
  \ SvJs 库的方式。\n\n打开 `sketch.js` 文件，并添加以下内容作为前两行代码：\n\n```javascript\n// 导入 SvJs 库。\n\
  import { SvJs } from '../../node_modules/svjs/src/index.js';\n```\n\n现在我们的模板已经完成，可以复制用于后续的草图了。干得好！\n\
  \n## 提供草图服务\n\n如果此时导航到 `00-template` 文件夹并双击 `index.html` 在 Web 浏览器中打开它，您会在开发者控制台（在大多数浏览器上按\
  \ `F12` 键可访问）中看到一些错误。这是因为我们需要使用 `http://` 协议而不是 `file://` 协议来提供我们的 HTML 文件（如果您查看地址栏中的完整\
  \ URL，就会看到协议前缀）。\n\n要解决这个问题，我们需要安装一个 http 服务器。理想情况下，需要一款能检测文件更改并立即重新加载页面的服务器，这样我们就不必每次都手动刷新浏览器（时间长了会变得很烦人）。有一个简洁的小包叫做\
  \ `live-server`，它可以为我们处理这些。要安装它，请在终端中运行以下命令：\n\n```bash\nnpm install live-server\
  \ -g\n```\n\n`-g` 标志告诉 `npm` 将此包全局安装到我们的机器上，而不是本地安装到当前项目中。因为它更像是一个通用工具，而不是项目特定的依赖项，这正是我们想要的。要运行\
  \ `live-server`，您只需在终端中输入 `live-server` 即可。然后它会自动打开一个新的浏览器窗口，您将在其中看到您的项目文件（假设您仍在\
  \ VS Code 的项目根文件夹中）。导航到 `sketches` ➤ `00-template`，您应该会看到页面加载成功，并且控制台没有任何错误。不过，页面上也没有任何内容，所以让我们写一些代码来解决这个问题。\n\
  \n## 我们的第一个生成式草图\n\n正如我之前提到的，我们的第一个草图将作为解释我们在第 2 章中要介绍的基本编程概念的基础，因此，出于这个原因，接下来的内容（除了代码本身的一些注释外）解释会比较简略。\n\
  \n复制 `00-template` 文件夹，并将其命名为 `01-our-first-generative-sketch`，确保复制到相同位置（即父文件夹为\
  \ `sketches`）。\n\n然后，在您的 `sketch.js` 文件中，在 `import` 语句下方，编写（推荐）或复制以下代码。在输入过程中请阅读注释（以\
  \ `//` 开头的行），我有意让注释较为详尽，以便您更好地理解正在发生的事情。\n\n```javascript\n// 导入 SvJs 库。\nimport\
  \ { SvJs } from '../../node_modules/svjs/src/index.js';\n\n// 创建一些全局变量。\nconst svgSize\
  \ = window.innerWidth > window.innerHeight ? window.innerHeight : window.innerWidth;\n\
  const bgColor = '#181818';\n\n// 创建一个对象来存储一些随机化参数。\nconst randomised = {\n  hue:\
  \ random(0, 360),\n  rotation: random(-180, 180),\n  iterations: random(10, 100)\n\
  }\n\n// 创建我们的父级 SVG，并将其附加到 id 为 'container' 的元素上。\nconst svg = new SvJs();\nsvg.addTo(document.getElementById('container'));\n\
  \n// 设置 viewBox 的宽度和高度以及 SVG 的显示尺寸。\nsvg.set({ viewBox: '0 0 1000 1000', width:\
  \ svgSize, height: svgSize });\n\n// 创建一个背景层——一个覆盖 viewBox 全尺寸的矩形。\nconst rect =\
  \ svg.create('rect');\nrect.set({ x: 0, y: 0, width: 1000, height: 1000, fill: bgColor\
  \ });\n\n// 运行一个随机次数的循环来创建我们的椭圆。\nfor (let i = 0; i < randomised.iterations; i +=\
  \ 1) {\n  // 设置椭圆的中心点、x 轴和 y 轴半径以及旋转角度。\n  let center = 500;\n  let radiusX = 100\
  \ + (i * 3);\n  let radiusY = 300 + (i * 2);\n  let rotation = randomised.rotation\
  \ + (i * 2);\n\n  // 如果随机色相小于 180，则递增它。否则递减它。\n  let hue;\n  if (randomised.hue\
  \ < 180) {\n    hue = randomised.hue + (i * 3);\n  } else {\n    hue = randomised.hue\
  \ - (i * 3);\n  }\n\n  // 创建我们的椭圆。\n  let ellipse = svg.create('ellipse');\n  ellipse.set({\n\
  \    cx: center,\n    cy: center,\n    rx: radiusX,\n    ry: radiusY,\n    fill:\
  \ 'none',\n    stroke: `hsl(${hue} 80% 80% / 0.6)`,\n    transform: `rotate(${rotation}\
  \ ${center} ${center})`\n  });\n}\n\n/**\n* 获取介于最小值和最大值之间的随机数。\n*/\nfunction random(min,\
  \ max, integer = true) {\n  let random = Math.random() * (max - min) + min;\n  let\
  \ number = integer ? Math.floor(random) : random;\n  return number;\n}\n```\n\n\
  好的，代码量相当大！这无疑会让任何编程新手感到不知所措，所以如果您属于这一类并且发现对上述内容感到畏惧，请耐心等待；所有内容将在后续章节中解释。这个第一个生成式草图的目的就是让您快速上手，并向您展示一些快速成果。\n\
  \n\n\n当你保存上述代码后，应该会看到类似图 1-3 所示的效果。每次刷新浏览器都会生成一个独特的版本，因此你看到的内容无疑会在某些方面有所不同。但亲爱的读者，这正是生成艺术的魅力所在。\n\
  \n![](img/538894_1_En_1_Fig3_HTML.png)\n\n一幅抽象画，在深色背景下呈现出一个由椭圆簇构成的旋转图案，形成方形结构。\n\
  \n**图 1-3** 我们的第一个生成式草图（众多变体之一）\n\n## 总结\n\n回顾一下，我们在第一章中涵盖了以下内容：\n\n- 为何使用 JavaScript\
  \ 和 SvJs，而非 Processing 或 `p5.js`\n- SVG 与 PNG 和 JPG 等光栅格式的区别\n- 脚本化 SVG 与直接在标记语言中编写有何不同\n\
  - SvJs 如何让 SVG 脚本编写更直观、更简洁\n- 安装与导入 SvJs 库，并设置基础模板\n- 如何在本地开发服务器上预览我们的草图\n\n下一章：编程入门。\n\
  \n"
- "# 2. 编程入门\n\n虽然编程可以用于创作艺术，但它本身也是一门艺术。它既是科学也是艺术。开始学习编程时，你需要先熟悉其科学的一面，即构成编程这门学科的基本概念和规则。艺术的一面可以稍后涉猎。\n\
  \n学习编程基础意味着要掌握值、变量、运算符、表达式、条件语句、循环、函数等概念。如果你对这些概念一无所知，请不要担心。这正是本章的目的。\n\n我们还将介绍\
  \ JavaScript（我们选择的语言）的特性（包括一些特殊之处）。JavaScript 是一种强大且极其流行的语言；它是浏览器原生理解的唯一编程语言，因此，它自然*无处不在*。学习\
  \ JavaScript 是一个非常实用的选择，它不仅在生成艺术领域，在许多其他领域也能发挥巨大作用。\n\n## 语法\n\n我们从一些语法要点开始。\n\n\
  ### 大小写敏感\n\nJavaScript 是一种区分大小写的语言，因此 `JavaScript` 和 `javascript` 这两个词会被视为不同的标识。许多程序员在命名函数或变量时遵循的命名惯例是驼峰命名法，即术语以类似骆驼驼峰的方式连接在一起。例如：\n\
  \n```\nthisIsCamelCase\nsoIsThis\n```\n\n如你所见，术语的第一部分完全小写，后续部分使用我们称之为“标题大写”的形式，即每个单词的首字母大写。\n\
  \n### 空格\n\n与一些强制执行严格缩进的语言不同，JavaScript 中的空白字符没有内在含义。间距主要是一种风格问题。在 JavaScript 社区中，你遇到的最普遍的风格约定是使用两个空格来缩进代码，如下所示：\n\
  \n```\nsomeCode() {\n  some indented code\n}\n```\n\n### 分号\n\nJavaScript 中的每个语句都应该以分号（`;`）结尾，它相当于自然语言中的句号。由于\
  \ JavaScript 具有一项称为“自动分号插入 (ASI)”的功能，你可以选择完全不写分号，但这样做并不总是安全的（而且我也使用其他必须使用分号的语言），因此我选择保留分号。本书中的代码都将包含分号。\n\
  \n### 注释\n\n在任何你编写的代码中，养成大量使用注释的习惯非常重要。这不仅能让其他人更轻松地阅读和理解你的代码，也能让你自己做到这一点。你会惊讶地发现，如果没有注释指引，自己的代码也会很快变得像谜题一样难以理解。\n\
  \nJavaScript 中有两种类型的注释：单行注释和多行注释。单行注释以两个正斜杠 `//` 开头，多行注释以正斜杠和星号 `/*` 开头，以星号和正斜杠\
  \ `*/` 结束。\n\n```\n// 单行注释。适用于快速解释。\n/*\n * 多行注释。\n * 适用于恰当地记录代码。\n */\n```\n\n\
  单行注释也可以放在同一行代码之后。\n\n```\nsomeCode(); // 我们可以在这里安全地写注释。\n```\n\n## 值\n\n作为一名程序员，你必须精通各种值及其类型。这里我们不是在谈论道德价值观或编程道德准则；这里说的值，指的是最终会被简化为计算机处理的字节和比特的信息“块”。值可以是任何东西，从数字到文本字符串（例如“我爱早餐麦片”）。让我们从数字开始。\n\
  \n### 数字\n\n如果说计算机有什么特别钟爱的东西，那就是数字。它们处理数字的速度，远比我吃掉我最爱的早餐麦片的速度要快。在某些编程语言中，存在不同类型的数字（例如，`int`\
  \ 代表整数或整型数字，`float` 代表十进制数或浮点数），但在 JavaScript 中，所有数值都属于单一的 `Number` 类型。\n\n```\n\
  17 // 一个整数。\n23.085 // 一个小数。\n4e2 // 一个带指数的数字（这里表示 4 的 2 次方）。\n```\n\n### 字符串\n\n\
  字符串表示文本信息，如单词和句子。字符串需要用引号括起来，可以是单引号或双引号。\n\n```\n'世界上有 10 种人。' // 单引号\n\"懂二进制的人和不懂二进制的人。\"\
  \ // 双引号\n```\n\n无论你选择使用单引号还是双引号，保持一致非常重要。尽量不要随意混用。\n\n另一种类型的字符串称为模板字面量，它允许你将变量和表达式插入到字符串中。这是标准的单引号或双引号无法做到的。模板字面量被反引号括起来，代码可以插入在以美元符号为前缀的花括号之间，如下所示：\n\
  \n```\n`这里是一些文本 ${someCodeHere}，这里还有更多文本。很酷吧？`\n```\n\n这是 JavaScript 的一个较新特性，在处理连接字符串和多行字符串时非常有用。让我们通过一个例子来说明。\n\
  \n```\n// 这是过去开发者存储多行 HTML 字符串数据的方式。\nlet oldWay = '' +\n'    \\n' +\n'<div>\\n'\
  \ +\n'        我的名字是 ' + name + '，我今年 ' + age + ' 岁。\\n' +\n'</div>\\n' +\n'    \\\
  n';\n\n// 这是现在实现同样事情的方式。\nlet newWay = `\n<div>\n  我的名字是 ${name}，我今年 ${age} 岁。\n\
  </div>\n`;\n```\n\n如你所见，它更加易读和简洁。通常，每当你想要将字符串值与任何其他内容混合时，反引号是最佳选择。\n\n### 布尔值\n\n\
  布尔值是二进制的；它们只能是 `true` 或 `false`。它们以布尔代数的发明者乔治·布尔的名字命名。它们可用于表示任何二元状态：是或否、开或关、活着或死亡等等。它们简单地写成\
  \ `true` 或 `false`。\n\n```\nlet alive = true; // 呼，还活着\nlet kicking = false; //\
  \ 只是坐着\n```\n\n布尔值使得条件语句和比较成为可能，我们稍后会讲到。\n\n\n\n## 空值\n\n空值是我们最后要介绍的值类型。共有两种：`null`\
  \ 和 `undefined`。你可以将它们理解为不携带任何信息的值。在调试代码时你会经常遇到它们（尤其是 `undefined`），所以可以想象，它们并非总是受欢迎的访客。\n\
  \n`null` 和 `undefined` 有什么区别？一种简化的理解方式是：当 JavaScript 告诉你一个名为 `x` 的变量是 `null` 时，它是在说：“我知道\
  \ `x`，但据我所知，`x` 目前没有任何值。” 另一方面，如果它告诉你 `x` 是 `undefined`，那基本上是在说：“`x` 是个什么鬼？这里压根没有\
  \ `x` 这玩意儿。”\n\n## 变量\n\n我们已经多次提到过“变量”这个词，那么它们到底是什么呢？你可以把变量想象成存储值的容器，这些值可以在后续被引用。\n\
  \n变量在使用前必须先声明。有三种声明方式：使用 `const`、`let` 或 `var`。其中，`var` 已不再推荐使用；我提到它主要是出于历史原因，并且因为你在实际代码中很可能会遇到它。现在很多很多的\
  \ JavaScript 代码库仍然在使用 `var`，仅仅是因为在 2015 年那次重大的 JavaScript 更新（称为 ECMAScript 6，简称\
  \ ES6）之前，没有其他选项可用。\n\n声明一个变量需要使用关键字，创建一个名称/标识符，然后使用等号运算符为其赋值。\n\n```\nconst name\
  \ = 'David Matthew';\nconst countryOfBirth = 'Ireland';\nlet age = 21; // 我希望如此！\n\
  ```\n\n`const` 和 `let` 有什么区别？使用 `const` 时，你声明的值是不应更改的。我的 `countryOfBirth` 就是一个例子：这是一个恒定不变的历史事实。如果之后我试图给\
  \ `countryOfBirth` 重新赋值，会导致错误：\n\n```\ncountryOfBirth = 'Brazil'; // 哎呀...\n-> TypeError:\
  \ Assignment to constant variable\n```\n\n然而，我的 `age`（唉）是会变化的，所以可以毫无问题地更新它。`const`\
  \ 和 `let` 的另一个区别是，`let` 可以在声明时不赋值，而使用 `const` 时，必须在首次创建时就为其赋值。\n\n```\nlet a; //\
  \ 没问题。\nconst b; // 自找麻烦。\n-> Uncaught SyntaxError: Missing initializer in const\
  \ declaration\n```\n\n如果不确定，应该使用 `const` 还是 `let`？JavaScript 社区的普遍共识是，你应该默认使用 `const`，只有当认为变量之后可能被赋予新值时，才使用\
  \ `let`。理由是这样可以减少意外的值重新赋值，从而排除一个潜在的 bug 来源。\n\n## 运算符\n\n运算符是对值执行运算的符号。我们实际上已经见过一个了：赋值运算符（`=`），它将一个值赋给一个变量。让我们看看还有哪些其他类型的运算符可供使用。\n\
  \n### 算术运算符\n\n你可能已经猜到了，算术运算符允许我们执行数学运算。加法运算符（`+`）允许我们相加数字，但它也允许我们拼接字符串。\n\n```\n\
  // 数字相加。\n2 + 2\n-> 4\n// 字符串拼接。\n'I am' + ' so smrt'\n-> 'I am so smrt'\n```\n\n\
  还有减法（`-`）、乘法（`*`）和除法（`/`）运算符。\n\n```\n// 数字相减。\n9 - 4\n-> 5\n// 数字相除。\n9 / 4\n->\
  \ 2.25\n// 数字相乘。\n9 * 4\n-> 36\n```\n\nES6 引入了指数运算符（`**`），它允许你计算一个数的另一个数次方。\n\n\
  ```\n// 指数运算符。\n2 ** 2\n-> 4\n2 ** 6\n-> 64\n2 ** 10\n-> 1024\n```\n\n最后，还有取模运算符（`%`）。它将一个数除以另一个数，并返回余数。这在循环遍历数组（我们稍后会讲到）时，或者快速判断一个未知数是偶数还是奇数时，会特别有用。\n\
  \n```\n// 取模运算符的使用。\n3 % 3\n-> 0\n3 % 2\n-> 1\n12 % 5\n-> 2\n```\n\n\n\n## 运算符优先级与比较符\n\
  \n在此，值得提及运算符优先级规则，它决定了运算执行的顺序。助记词 **BEMDAS** 可以帮助我们理解。\n\n- **B** 括号：括号或圆括号内的内容最先计算。\n\
  - **E** 指数：接下来计算指数。\n- **M** 乘法和 **D** 除法：然后是乘法和除法。这两者具有相同优先级，因此按书写顺序（即从左到右）计算。\n\
  - **A** 加法和 **S** 减法：对剩余数字进行加法和减法。与乘法和除法一样，这两者优先级相同，且从左到右计算。\n\n```\n// 这些求和表达式看起来相似，但结果不同。\n\
  4 / 2 * 2 + 4\n-> 8\n4 / 2 * (2 + 4)\n-> 12\n4 / 2 ** 2 + 4\n-> 5\n```\n\n如有疑问，请使用括号对运算进行分组。这也可以提高可读性。\n\
  \n### 比较运算符\n\n顾名思义，比较运算符对值进行比较。它们始终返回一个布尔值，即 `true` 或 `false` 值。\n\n- `<` 是“小于”运算符。\n\
  - `<=` 是“小于或等于”运算符。\n- `>` 是“大于”运算符。\n- `>=` 是“大于或等于”运算符。\n- `==` 是“等于”运算符。\n- `===`\
  \ 是“严格等于”运算符。\n\n由于 JavaScript 工作方式存在一些微妙的特性，我建议坚持使用严格版本的相等运算符。这可以减少意外（即 bug）。\n\
  \n```\n// 比较运算符的一些示例。\n1 > 2\n-> false\n2 < 3\n-> true\n3 >= 3\n-> true\n5 == \"\
  5\"\n-> true // 但实际上并非如此。\n5 === \"5\"\n-> false // 这样才更准确。\n```\n\n### 逻辑运算符\n\n\
  最后，还有逻辑运算符：与（`&&`）、或（`||`）和非（`!`）。它们模拟了经典逻辑中的合取、析取和否定。\n\n当使用 `&&` 连接两个条件时，当且仅当两个条件都为\
  \ `true` 时，结果才为 `true`。\n\n```\ntrue && false\n-> false\nfalse && true\n-> false\n\
  true && true\n-> true\n```\n\n使用析取（即“或”的正式说法）时，首先要确保在键盘上使用正确的字符。`|` 字符既不是大写字母 `I`\
  \ 也不是小写字母 `L`；它被称为管道符。根据你的区域键盘布局，它可能位于回车键或 Shift 键附近。\n\n当使用 `||` 时，如果一个或两个条件为 `true`，则结果为\
  \ `true`。如果我们记住我们实际上是在询问计算机“这些条件中至少有一个为真吗？”，那么这在直觉上是合理的。\n\n```\ntrue || false\n\
  -> true\nfalse || true\n-> true\nfalse || false\n-> false\n```\n\n最后，我们还有否定运算符 `!`。它会“翻转”紧随其后的条件。它还可以与相等运算符独特地结合，表示“不等于”（`!==`）。\n\
  \n```\n!true\n-> false\n!false\n-> true\n1 !== 2\n-> true\n!(2 > 1)\n-> false\n\
  ```\n\n新手程序员常见的一个错误是使用单个管道符 `|` 或单个 `&` 而不是两个组合。单独使用这些字符会执行位运算（即操作二进制值），这仅适用于高级编程。\n\
  \n## 条件语句\n\n现在我们掌握了比较运算符和逻辑运算符，可以继续学习条件语句了。JavaScript 中的条件语句允许我们影响程序的控制流。打个比方，想象一下四向交叉路口高峰期的交通，人行道上挤满了行人。没有某种控制交通流的方式，就会一片混乱。这时就需要条件语句，例如可能支撑交通灯系统的各种规则。\n\
  \n```\n// 基本语法。\nif (conditionIsTrue) {\n// ... 运行一些代码\n}\n// 一个简单的行人过马路条件语句。\n\
  if (pedestrianBtnIsPressed) {\nwait(30s);\nactivateRedLights();\nwait(3s);\nactivateGreenManSignal();\n\
  }\n```\n\n对于基本的 `if` 语句，我们还可以附加 `else` 和 `else if` 条件。\n\n```\nif (a > b) {\ndoThis();\n\
  } else if (a === b) {\ndoThat();\n} else {\ndoOtherThing();\n}\n```\n\n如果给定的条件不为真，则花括号内的代码不会被执行。让我们以之前的例子为例，为\
  \ `a` 和 `b` 填充值。\n\n```\nlet a = 3;\nlet b = 4;\nif (a > b) {\ndoThis(); // 条件不成立，因此此代码不运行。\n\
  } else if (a === b) {\ndoThat(); // 此代码也不运行。\n} else {\ndoOtherThing(); // 以上两个条件均为假，因此运行此代码。\n\
  }\n```\n\n我想介绍的最后一个条件形式是三元运算符。顾名思义，它严格来说是一个运算符，但由于它扮演了条件检查的角色，我觉得将其放在这里更合适。\n\n\
  ```\n// 三元运算符的基本结构。\nconditionA ? expressionIfTrue : expressionIfFalse;\n```\n\n\
  在上述结构中，我们询问“`conditionA` 是否为真？如果是，则运行 `expressionIfTrue`。否则，运行 `expressionIfFalse`。”\n\
  \n三元运算符最适合用于当你希望根据某个条件是否成立来为变量赋值时。如果该条件不成立，则为其分配一个不同的值。这正是我在第一个生成式草图中使用它的方式：\n\n\
  ```\nconst svgSize = window.innerWidth > window.innerHeight ?\nwindow.innerHeight\
  \ : window.innerWidth;\n```\n\n这里，我们在说“如果窗口的 `innerWidth` 大于其 `innerHeight`，则将 `innerHeight`\
  \ 赋值给 `svgSize`。否则，将 `innerWidth` 赋值给它。”\n\n## 循环\n\n循环是程序员的一项超能力。我们说的是开天辟地的力量。或者，至少是能够让你的程序螺旋式奔向无穷的能力，可能会冻结任何打开的浏览器窗口，并使你的\
  \ CPU 风扇疯狂旋转。这是因为循环可以一遍又一遍地重复代码块，次数不限，或者根据需要无限进行。然而，通常明智的做法是为循环行为设置一个限制（无限循环更多时候是一种错误而非目标）。我们通过所谓的终止条件来设置循环的限制，即告诉循环何时停止的条件。\n\
  \n这里我们将介绍两种主要的循环：`while` 循环和 `for` 循环。\n\n### While 循环\n\n`while` 循环是两者中较简单的一种。其基本结构如下：\n\
  \n```\nwhile (condition === true) {\n// 当条件为真时在此处运行代码。\n}\n```\n\n现在，如果所讨论的条件始终评估为\
  \ `true`，那将导致无限循环。因此，任何循环结构中的一个重要成分是一个在循环运行时发生变化的值。这通常是一个递增或递减的数字，被称为迭代器。按照惯例，`i`\
  \ 通常用作变量名。\n\n```\n// 设置迭代器。\nlet i = 0;\nwhile (i <= 99) {\n// 将 i 的值写入浏览器控制台。\n\
  console.log(i);\n// 每次循环运行时将 i 增加 1。\ni = i + 1;\n}\n```\n\n上述循环将运行 100 次，从 0 开始，直到小于或等于\
  \ 99 为止，并且在每次迭代中，它会将 `i` 的值记录到浏览器控制台。如果省略了递增 `i` 的代码，它将无限循环下去。\n\n值得一提的是，现在有一些简写方式来递增和递减——或者实际上乘法和除法——变量值：\n\
  \n```\n// 长方式。\ni = i + 1\ni = i * 2\ni = i – 1\ni = i / 2\n// 较短方式。\ni += 1\ni\
  \ *= 2\ni -= 1\ni /= 2\n// 更短方式（仅适用于加 1 或减 1）。\ni++\ni--\n```\n\n简写表示法是你实际编程中可能遇到的，因此我们在这里继续使用它。\n\
  \n### For 循环\n\n`for` 循环使用与我们的示例 `while` 循环相同的逻辑，但将迭代器和递增操作合并到一行中。其典型结构如下：\n\n```\n\
  for (let i = startingNumber; i < upperLimit; i += increment) {\n// 当 i 小于 upperLimit\
  \ 时运行一些代码。\n}\n```\n\n\n\n`for`循环结构简洁地分为三个部分。我们首先初始化迭代器，然后设置终止条件，最后决定如何变化迭代器。以下是之前示例的`for`循环版本，我们在每次迭代中将`i`的值记录到浏览器控制台。\n\
  \n```\nfor (let i = 0; i <= 99; i++) {\nconsole.log(i);\n}\n```\n\n你不一定总是递增迭代器。只需稍作调整，就可以轻松反转循环，使其从\
  \ 99 向下计数到 0。\n\n```\nfor (let i = 99; i >= 0; i--) {\nconsole.log(i);\n}\n```\n\
  \n在`for`循环体中，经常将迭代器的值与其他变量结合使用，以实现某些动态结果。例如，在我们开篇的生成式草图中，我使用`i`逐步增加每个椭圆的`radiusX`和`radiusY`。\n\
  \n```\n// 运行一个循环（随机次数）来创建我们的椭圆。\nfor (let i = 0; i < randomised.iterations; i +=\
  \ 1) {\n// ... 代码。\nlet radiusX = 100 + (i * 3);\nlet radiusY = 300 + (i * 2);\n\
  // ... 更多代码。\n}\n```\n\n关于循环，还有更多值得喜爱的地方，并且也存在其他变体（例如`for in`、`for of`和`forEach`，我们将在后面介绍），但就生成式艺术而言，我们主要会使用标准的`for`循环。\n\
  \n## 函数\n\n函数对于 JavaScript 这门语言来说是基础，并且可能是我们在本章中将介绍的最重要的概念。函数是执行特定任务的独立代码块。该任务在函数体中定义，其范围可能从将两个数字相加到启动火箭发射序列。\n\
  \n标准函数使用`function`关键字定义，后跟您为其指定的名称，然后附加圆括号以及定义任务的开闭花括号。\n\n```\n// 标准函数的基本语法。\n\
  function peformSomeTask() {\n// ... 定义任务的代码。\n}\n```\n\n### 函数参数\n\n尽管函数用途广泛，但它们的主要目的是使代码可复用。实现这一点的一种方法是向函数添加参数，这些参数在函数名称的圆括号内定义。\n\
  \n```\n// 带参数的函数。\nfunction sayHello(name) {\n// 用爱尔兰方式向用户打招呼。\nconsole.log(`Howaya\
  \ ${name}, what's the craic?`);\n}\n```\n\n函数可以显式返回值，也可以不返回。如果返回值，则只允许一个返回值。在前面的例子中，没有返回值，因为那不是该函数的目的（或者从技术上讲，如果查询该函数，将返回`undefined`值）。然而，在下面的例子中，我们专门希望从函数中获取一个返回值，这时我们就使用`return`关键字。\n\
  \n```\n// 另一个带参数的函数，这次返回一个值。\nfunction squareNumber(number) {\nreturn number * number;\n\
  }\n```\n\n当调用上面的函数时，它会`return`我们想要的结果，即我们提供的数字的平方。但我们实际上如何在实际中做到这一点呢？\n\n### 调用函数\n\
  \n要使用我们定义的函数，我们需要调用它。这等同于执行或运行该函数。可以这样做：\n\n```\n// 调用一个函数。\nperformSomeTask();\n\
  ```\n\n要调用在其定义中包含参数的函数，我们需要为其提供实参。实参是我们在调用函数时赋予函数的实际值。而形参则是我们定义这些值的方式。让我们看看如何调用带实参的函数。\n\
  \n```\nsayHello('Dave');\n-> \"Howaya Dave, what's the craic?\"\nconsole.log(squareNumber(4));\n\
  -> 16\n```\n\n在这里，我们为第一个函数提供了实参`'Dave'`，为第二个函数提供了实参`4`，并得到了预期的输出。但如果我们在调用函数时忘记了实参，会发生什么？让我们试一下。\n\
  \n```\nsayHello();\n-> \"Howaya undefined, what's the craic?\"\nsquareNumber();\n\
  -> NaN\n```\n\n\n\n我们之前遇到过`undefined`，但没遇过`NaN`。`NaN`的意思是“不是一个数字”。在这两种情况下，我们的函数在缺少参数时都无法正常工作。我们该如何修复这个问题，让它们更健壮一些？\n\
  \n一个直接的方法是在定义函数参数时指定默认值。我们以重写`sayHello()`函数为例。\n\n```\nfunction sayHello(name =\
  \ \", ah it's yourself\") {\n// 以爱尔兰人的方式问候用户。\nconsole.log(`Howaya ${name}, what's\
  \ the craic?`);\n}\nsayHello();\n-> \"Howaya, ah it's yourself, what's the craic?\"\
  \n```\n\n如你所见，创建默认值只需在定义参数时为其赋值即可。现在我们创建了一个比`undefined`更人性化的回退值。\n\n对于`squareNumber()`函数来说，默认值就没那么有意义了。相反，我们可以使用前面介绍的三元表达式技术，在函数被无参数调用时提供一些可操作的反馈。\n\
  \n```\nfunction squareNumber(number) {\nreturn number ? number * number : '请包含你想要计算平方的数字';\n\
  }\n```\n\n在`squareNumber()`函数体内，三元运算符本质上是在问：“`number`是否已定义？如果是，则返回它自身相乘的结果；否则，返回我们的回退消息。”\n\
  \n至此，你应该能更好地理解第一个生成式草图中的函数了。再看一遍，看看现在是否更清晰了。\n\n```\nfunction random(min, max, integer\
  \ = true) {\nlet random = Math.random() * (max - min) + min;\nlet number = integer\
  \ ? Math.floor(random) : random;\nreturn number;\n}\n```\n\n## 作用域\n\n变量的作用域指的是它的可见性，即在程序的什么地方可以访问该变量。在使用函数时，这一点尤其重要。\n\
  \n例如，如果我们在函数内部定义了一个变量，它只能在该函数内部可见。\n\n```\nfunction scopeTest() {\nconst a = 1;\n\
  }\nconsole.log(a);\n-> Uncaught ReferenceError: a is not defined\n```\n\n然而，如果我们在函数外部定义了同一个变量，它将在函数内部可见。\n\
  \n```\nconst a = 1;\nfunction scopeTest() {\nconsole.log(a);\n}\nscopeTest();\n\
  -> 1\n```\n\n在第一种情况下，变量是块级作用域的，即局限于函数块内。在后一种情况下，变量是全局定义的（在所有函数外部），可以在程序中的任何位置访问。\n\
  \n虽然能够在程序中的任何位置访问变量似乎更有利，但对于全局变量，我们应谨慎使用。通常来说，最好明确限制变量的作用域。这也是`var`被废弃的主要原因之一，因为它不能像`let`和`const`那样被“束缚”。\n\
  \n```\nfunction scopeTest() {\nvar a = 1;\n}\nconsole.log(a);\n-> 1\n```\n\n如你所见，使用`var`时，变量可以突破周围块级作用域的限制，这在大型程序中可能会带来问题。在编写生成式艺术时，我们通常编写相对较小的程序（或“草图”），全局变量的问题并不那么突出。不过，我们将在下一节讨论如何最好地让某些设置在整个草图中全局可用，而不依赖全局变量。\n\
  \n## 匿名函数\n\n函数不一定总是需要有名字。尤其是在处理事件和回调（我们将在后面的章节中介绍）时，函数通常作为函数表达式被匿名调用，以便返回一个值。匿名函数也可以赋值给变量，然后由变量存储返回的值。\n\
  \n```\n// 一个赋值给变量的匿名函数表达式。\nconst sum = function(a, b) {\nreturn a + b;\n}\n```\n\
  \n在前面的例子中，该变量可以用来执行函数。\n\n```\nsum(5, 4);\n-> 9\n```\n\n对于匿名函数，我们有一件事不能做：不能在语句的开头使用它们。\n\
  \n\n```javascript\n// 下面这样写是不允许的。\nfunction(a, b) {\nreturn a + b;\n}\n-> Uncaught\
  \ SyntaxError: Function statements require a function name\n```\n\n## 箭头函数\n\n到目前为止，我们介绍了用\
  \ `function` 关键字声明的函数，但还有一种更现代的函数书写方式。这类函数因其采用的箭头语法而被称为**箭头函数**。\n\n```javascript\n\
  // 箭头函数的基本语法。\nconst performSomeTask = () => {\n  // ... 定义任务的代码。\n}\n```\n\n它们是刚刚介绍的传统函数表达式的简洁替代方案。我们来重写\
  \ `sum()` 函数作为示例。\n\n```javascript\nconst sum = (a, b) => {\n  return a + b;\n}\n\
  ```\n\n如你所见，代码简短了一些。但如果我们的函数只包含一个返回值的语句（这正是我们的 `sum()` 函数的情况），它甚至可以变得更简洁。在这种情况下，我们不需要花括号，甚至不需要\
  \ `return` 语句本身。\n\n```javascript\nconst sum = (a, b) => a + b;\n```\n\n由于箭头函数体仅包含单个语句（`a\
  \ + b`），因此系统会默认我们希望返回该语句的值。这就是所谓的**隐式返回**。\n\n当然，并非所有箭头函数都能如此简洁地精简，只有那些包含单一返回语句的才行。但这种单行写法在现代\
  \ JavaScript 代码库中广泛使用，尤其是使用像 React 这样声明式前端框架的代码库，因此熟悉它们非常值得。\n\n使用箭头函数还有另一个原因，这稍微超出了本章的范围，那就是\
  \ `this`。我指的是 `this` 关键字，这在 JavaScript 中是一个复杂的话题（并且在不陷入指代混乱的情况下解释清楚也很复杂）。简而言之，在箭头函数中使用\
  \ `this`，其值更可预测，也更不容易引发错误。但现在先别担心 `this`。\n\n相反，让我们关注一些数据结构，它们在生成式艺术以及更广泛的 JavaScript\
  \ 应用中会很有帮助。这是我们下一节的内容。\n\n## 对象与数组\n\n当需要定义数值、字符串和布尔值等值时，变量非常有用，但如果你需要更复杂的方式来组织和表示数据该怎么办呢？比如，你有一长串列表——无论是本周的购物清单、公司的员工名单、你希望在辞世前游历的地点，或者回到生成式艺术的话题上，你打算为下一部怀旧风格杰作采样的\
  \ 216 种网络安全色的十六进制代码（在 1990 年代，当时的网页开发者——那时被称为网页管理员——可用的调色板要受限得多）。当你需要处理任何形式的列表时，数组就是你的好帮手。\n\
  \n### 数组\n\n数组本质上是一个可以容纳多个值的变量。在 JavaScript 中，这些值不必是同一类型。这意味着如果需要，我们可以将数值、字符串和布尔值混合放入同一个数组中（不过并不推荐这样做）。\n\
  \n数组采用以下格式：\n\n```javascript\n// 标准数组的语法。\nlet arrayName = [item1, item2, item3,\
  \ ... itemN];\n```\n\n每个数组元素都有一个对应的**索引**（即数字），代表其在数组中的位置。数组中第一个元素的索引为 `0`（计算机中从零开始计数是常态），第二个元素索引为\
  \ `1`，第三个为 `2`，以此类推。要按索引直接访问数组中的元素，需要使用方括号，如下所示：\n\n```javascript\n// 访问第一个元素。\n\
  let firstItem = arrayName[0];\n// 访问第二个元素。\nlet secondItem = arrayName[1];\n// 访问第\
  \ n 个元素。\nlet nthItem = arrayName[n + 1];\n```\n\n这种方式特别适合与循环配合使用。使用 for 循环遍历数组中的元素是一种非常常见的做法，并且在我们整个生成式艺术之旅中会频繁用到。\n\
  \n让我们继续以网络安全色为例，遍历包含这 216 个十六进制值的数组。\n\n```json\n\n您不需要担心如何将这些项目放入数组；我们感兴趣的是如何遍历它们并对数组中的每个项目执行某些操作。此处的操作是在每次迭代中设置新创建圆形的颜色（即`fill`）。为了确保执行\
  \ 216 次，我们使用数组的`length`属性来控制循环运行的次数。\n\n```\nfor (let i = 0; i < webSafeColours.length;\
  \ i += 1) {\n// ... some code.\ncircle.fill(webSafeColours[i]);\n// ... more code.\n\
  }\n```\n\n在图 2-1 中，您将看到此代码片段的输出。显然，实现这种螺旋排列涉及更多内容（我们将在后面的章节中介绍）；重点是，我们如何使用迭代变量`i`循环遍历每个颜色值，即`webSafeColours[i]`。\n\
  \n![](img/538894_1_En_2_Fig1_HTML.png)\n\n一张抽象图显示了在深色背景上以螺旋模式排列的各种阴影数据点。\n\n**图\
  \ 2-1** 网络安全色螺旋\n\n如果您勇敢地检查示例背后的代码，您会注意到我最初使用了一个名为`push()`的数组方法将每个颜色添加到数组中。相关的代码行是：\n\
  \n```\ncolours.push(colour);\n```\n\n`push()`方法是我们将项目添加到数组末尾的方式（可以想象从后面装卡车）。如果我们想将项目添加到数组的开头，我们使用一个名为`unshift()`的方法。\n\
  \n```\ncolours.unshift(colour);\n```\n\n如果我们想从数组末尾移除一个项目，我们使用`pop()`方法（想象一下爆米花从锅中爆出）。相反，如果我们想从数组开头移除一个项目，我们使用`shift()`方法（之所以这样命名，是因为我们将所有剩余项目向下移动一个索引）。\n\
  \n在继续之前，我想介绍另一个方法，即我之前提到的`forEach()`循环。此方法是数组特有的，它依次对数组中的每个项目执行操作，使用一个函数作为其参数。顺便提一下，以这种方式作为参数传递的函数被称为回调函数。\n\
  \n```\n// 设置一个示例数组。\nconst someNumbers = [2, 4, 6, 8, 10];\n// 对每个数组项目调用 forEach\
  \ 方法。\nsomeNumbers.forEach((item) => {\nconsole.log(item * 2);\n});\n-> 4 8 12 16\
  \ 20\n```\n\n如果循环的主要目的是专门为每个数组项目执行某些操作，那么`forEach()`循环是一种非常简洁的遍历数组的方式。\n\n### 对象\n\
  \n对象是 JavaScript 提供的另一种数据结构，和函数一样，它们是该语言的基础特性。深入观察，您会发现对象无处不在。事实上，函数是一种特殊的对象。\n\n\
  与数组类似，对象可以包含多个值。主要区别在于，对象用名称标记其值，而数组用数字（即每个项目的索引）标记其值。\n\n对象的格式如下：\n\n```\nconst\
  \ objectName = {\nname1: value1,\nname2: value2,\nname3: value3\n};\n```\n\n这些名称-值对就是对象的**属性**。这些值可以是任何你想要的东西：字符串、布尔值、函数、数组，甚至其他对象。几乎所有能想到的东西都可以表示为一个对象。以我的笔记本电脑为例。\n\
  \n```\nconst myLaptop = {\nprocessor: \"Core i5\",\nscreenSize: \"14 inches\",\n\
  inSleepMode: false,\npowerUp: function() {\nif (inSleepMode) {\nwakeUp();\n} else\
  \ {\nrunBIOS();\n}\n}\n// 等等\n}\n```\n\n有了这些属性，我们可以使用方括号表示法或`–`更常见的`–`点号表示法来调用它们。\n\
  \n```\n// 使用点号表示法访问对象属性。\nmyComputer.screenSize;\n-> \"14 inches\"\n// 使用方括号表示法访问对象属性。\n\
  myComputer[processor];\n-> \"Core i5\"\n```\n\n我们也可以通过相同的语法更新和创建新的对象属性。\n\n```\n\
  // 更新对象的属性。\nmyComputer.inSleepMode = true;\n// 创建新的对象属性。\nmyComputer.storage =\
  \ \"512 GB SSD\";\n```\n\n```\n\n\n\n如果你重新审视我们的第一个草图，你会注意到我使用了一个对象来存储一些随机化设置，这些设置稍后在草图中被调用：\n\
  \n```\n...\nconst randomised = {\n  hue: random(0, 360),\n  rotation: random(-180,\
  \ 180),\n  iterations: random(10, 100)\n};\n...\nlet rotation = randomised.rotation\
  \ + (i * 2);\n```\n\n这是解决我之前提到的全局变量问题的一个好方法。通过使用对象，我们可以使我们的设置全局可用，而不必依赖全局变量。这可以使我们的代码更整洁，并且更不容易引起冲突。\n\
  \n## 类\n\n类（`Class`）就像是创建对象的蓝图或模板。创建出来的对象被称为该类的一个**实例**。一个类可以包含数据以及操作这些数据的函数。这种数据和代码的耦合被称为封装。我们不会深入讲解类的细节，但了解一些基本术语会很有用，因为我们即将使用的`SvJs`库就是基于类的。\n\
  \n要创建类的实例，我们使用`new`关键字，后面跟上类名和括号。这会调用该类的`constructor`（构造函数）。\n\n```\n// 定义一个类。\n\
  class StarShip {\n  // ...\n}\n// 实例化（或构造）一个类。\nconst prometheus = new StarShip();\n\
  ```\n\n属于类的函数被称为方法。一个类通常至少包含用于获取和设置其属性的方法。\n\n```\nprometheus.setDestination = 'Moon\
  \ LV-223, Zeta 2 Reticuli';\nprometheus.takeOff();\n```\n\n当我们在第一章创建第一个生成式 SVG 时，我们首先创建了一个`SvJs`类的实例并调用了一些它的方法。\n\
  \n```\nconst svg = new SvJs();\nsvg.addTo(document.getElementById('container'));\n\
  ```\n\n这就是我们使用类的全部范围了；编写类不属于本书的内容。\n\n## 奇异性与其他特性\n\nJavaScript 提供了许多其他特性，包括闭包、错误捕获、代理、Promise\
  \ 等等，但我无法在此全部涵盖。我将在此指出的是 JavaScript 的一些怪癖——或者客气点说是**古怪之处**——这些可能会困扰使用其他语言的程序员。\n\
  \n### `null`和`NaN`的怪异之处\n\n我们之前了解到`null`本质上就是信息的缺失。那么，`null`也**被认为是一个对象**，这难道不奇怪吗？我们可以通过使用`typeof`检查来确认这一点。\n\
  \n```\ntypeof null;\n-> object\n```\n\n尽管如此，`null`并不被认为是对象的实例。我们可以通过使用`instanceof`检查来确认这一点。\n\
  \n```\nnull instanceof Object;\n-> false\n```\n\n`NaN`（非数字）同样呈现出一些量子级别的怪异，足以让薛定谔的猫都竖起耳朵。它显然不是一个数字，但同时却等于一个数字。而且，奇怪的是，它甚至不等于自身。\n\
  \n```\ntypeof NaN;\n-> Number\nNaN === Number;\n-> false\nNaN === NaN\n-> false\n\
  ```\n\n### 隐式类型转换\n\nJavaScript 在幕后做一些来自更严格语言背景的程序员可能不总是欣赏的事情。例如，它在数据类型方面是出了名的松散，并会根据情况将不同类型的变量转换为匹配的类型（转换数据类型的过程也称为**类型转换**）。让我们以一些数字为例。\n\
  \n```\n1 == 1;\n-> true\n1 == \"1\";\n-> true\n```\n\n一个数字怎么可能等于一个字符串？嗯，它不能。JavaScript\
  \ 正在将字符串转换为数字以便理解表达式。它本质上是在将字符串数据强制转换为数字数据（也称为**类型强制转换**）。这就是为什么我们最好在 JavaScript\
  \ 中使用严格相等运算符的原因，这在许多其他语言中是不存在的。\n\n```\n1 === \"1\";\n-> false\n```\n\n当我们尝试将数字与字符串相加时，也会发生这种转换，但方向相反；在这种情况下，数字被转换为字符串。\n\
  \n```\n1 + \"2\";\n-> \"12\"\n\"2\" + 3;\n-> \"23\"\n```\n\n为了避免这种隐式类型强制转换的陷阱，可以使用像`parseInt()`、`parseFloat()`和`toString()`这样的函数来重新转换或显式地将变量转换为你想要的数据类型。\n\
  \n### 分号的不确定性\n\n我在本章开头提到过，如果你愿意，可以不用分号编写 JavaScript，但在某些边界情况下，这可能导致意外行为。这里就有一个这样的边界情况。\n\
  \n```\nreturn\n1 + 2\n-> undefined\n```\n\n在 JavaScript 中，空格无关紧要，那么这里发生了什么？为什么表达式没有返回`3`？嗯，这里**自动分号插入**功能在幕后被调用了。实际被评估的代码是这样的：\n\
  \n```\nreturn;\n1 + 2;\n```\n\n为了避免这种情况，要么熟悉这类边界情况，要么就使用分号。\n\n## 总结\n\n我们在本章中涵盖了很多内容：\n\
  \n*   JavaScript 的基本语法规则\n*   值，例如字符串、数字和布尔值\n*   变量及其不同的声明方式\n*   算术运算符、比较运算符和逻辑运算符\n\
  *   条件语句和控制流\n*   `while`循环、`for`循环和`forEach`循环\n*   函数和作用域\n*   数组和数组方法\n*   对象和对象属性，以及全局变量的替代方案\n\
  *   JavaScript 的一些比较古怪的特性\n\n我假设你几乎没有编码知识，如果这描述的是你的起点，而你依然跟上了，那么做得好！\n在下一章中，我们将探索`SvJs`库的主要功能，并熟练地创建基本形状、线条和颜色。\n\
  \n"
- "# 3. 关于 SVG 的一切\n\n掌握了 JavaScript 的基础知识，你已经准备好使用`SvJs`了，你可以把它想象成你的生成式画笔和调色板。\n\
  在本章中，我们将涵盖：设置我们的 SVG 画布；如何处理线条和颜色；如何创建一系列简单形状；如何添加文本和标题；如何定义和重用元素；如何使用组、渐变和图案；以及\
  \ SVG 的`viewBox`和视口是如何工作的；在这个过程中，我们将学习`SvJs`库的核心函数，以及它与 SVG 规范的关系。\n\n## 父级 SVG\
  \ 元素\n\n在我们创建任何视觉内容之前，我们需要加载我们的库并设置父级 SVG 元素。父级 SVG，也称为 SVG 文档片段，是指其父元素（如果有的话）不在\
  \ SVG 命名空间中的那个 SVG 元素。一个例子是附加到 HTML DOM 节点上的 SVG。\n\n这值得一提，仅仅是因为 SVG 可以包含其他 SVG；在这种情况下，只有一个可以被视为父级\
  \ SVG 元素。你可能也会看到它被称为**根元素**。\n\n让我们重新打开我们在第一章中设置的 JavaScript 模板文件（它应该位于`sketches/00-template/sketch.js`路径下），并向其中添加以下代码行：\n\
  \n```\n// 父级 SVG。\nconst svg = new SvJs();\n```\n\n`new SvJs()`构造函数，如果调用时不带任何参数，会创建一个\
  \ SVG 元素。它也可以用于通过传入元素名称作为字符串来创建任何其他 SVG 元素。\n\n```\n// 使用 SvJs 构造函数创建一个圆形元素。\nconst\
  \ circle = new SvJs('circle');\n```\n\n要将父级 SVG 元素添加到我们的网页中，我们使用`SvJs`的`addTo()`方法。在这种情况下，我们将传入我们在\
  \ HTML 中之前设置的、`id`为`container`的`<div>`（参见第一章）。将以下内容添加到模板草图中：\n\n```\nconst container\
  \ = document.getElementById('container');\nsvg.addTo(container);\n```\n\n`SvJs`中的大多数函数都是可链式调用的，这意味着你可以使用点号表示法将它们链接在一起，就像这样：\n\
  \n```\nmethodOne().methodTwo();\n```\n\n\n\n```markdown\n\n`new SvJs()`构造函数方法也不例外，因此我们新的父级`SVG`元素一旦实例化，就可以通过追加`addTo()`方法立即附加到`DOM`元素上。\n\
  \n这创建了一个方法链（将点视为链接）。如果我们传递`getElementById()`这个`DOM`方法作为参数，而不是将其赋值给一个变量，我们就可以将代码压缩成一行：\n\
  \n```\n// 父级 SVG。\nconst svg = new SvJs().addTo(document.getElementById('container'));\n\
  ```\n\n然而，简洁并不总是优于清晰，所以如果这行代码对你来说有点过于压缩，请保持你的模板代码不变，无需替换成上述代码。\n\n## 视口（Viewport）与视图框（ViewBox）\n\
  \n`viewport`指的是我们`SVG`元素的可见部分。它是通过使用`width`和`height`属性隐式定义的。\n\n`SVG`格式一个有趣的地方在于其工作区的灵活性，即它可以包含内容的区域。一个`SVG`可能包含的内容远多于任何时刻通过`viewport`可见的部分。这为处理精灵图、画板和其他屏幕外资源提供了可能性。\n\
  \n因为我们要使用一个正方形的`SVG` `viewport`，我们的`width`和`height`将相同，所以我们可以用一个变量来存储这个值。我们称之为`svgSize`。\n\
  \n我们事先不知道屏幕尺寸或方向，因此硬编码一个值并不明智。相反，我们可以通过查询`window.innerWidth`和`window.innerHeight`来检查浏览器窗口的尺寸，并将`svgSize`设置为这两个值中较小的一个。这将确保正方形（或\
  \ 1:1）的宽高比。我们在前一章讨论的三元运算符对于这类检查特别有用。按照以下方式将其包含在模板中，以初始化`svgSize`变量：\n\n```\n// 视口大小（1:1\
  \ 宽高比）。\nconst svgSize = window.innerWidth > window.innerHeight ? window.innerHeight\
  \ : window.innerWidth;\n```\n\n`viewBox`是另一个重要的顶级`SVG`属性。它与`viewport`相关，但拥有更强大（也更复杂）的功能。`viewBox`允许我们在用户空间中定义`viewport`的位置和尺寸。\n\
  \n这到底意味着什么？你可以将用户空间视为无单位或与单位无关的空间。值`100`可能指的是像素、毫米、米或任何其他单位。它默认为像素，但`viewBox`的重点在于它可以让我们摆脱绝对单位的思维。我们可以使用自己的内部坐标系，而无需担心渲染`SVG`的设备的实际尺寸。\n\
  \n就个人而言，我喜欢使用`1000`的宽度和高度，因为我觉得这样划分画布很直观。这`1000`个单位之后可以被压缩到一个`500px`宽的正方形中，或者铺满一个公交车大小的广告牌上。\n\
  \n`viewBox`的前两个值定义了它的起始坐标（称为`min-x`和`min-y`），后两个值定义了`width`和`height`。我们保持简单，将`viewBox`定义为`0\
  \ 0 1000 1000`。\n\n如果`viewport`和`viewBox`的宽高比（即宽度与高度的比例）不同，可以使用`preserveAspectRatio`属性来指定浏览器应如何显示`SVG`。这很快就会变得相当复杂，这就是为什么我已经确保我们的`viewport`和`viewBox`共享相同的\
  \ 1:1（即正方形）宽高比。现在，仅需知道存在`preserveAspectRatio`这个属性即可，以备将来你想要实现更复杂的布局。\n\n有时，要最好地理解某些东西是如何工作的，你需要与它进行视觉交互。基于此，我构建了一个小的`CodePen`草图（或他们称之为“笔”）来演示调整主要`viewBox`值的效果，这样你就可以看到它们如何协同工作来缩放和裁剪`SVG`\
  \ `viewport`内可见的内容。你可以在[`davidmatthew.ie/generative-art-javascript-svg#viewBox`](https://davidmatthew.ie/generative-art-javascript-svg#viewBox)找到这支笔。\n\
  \n至此，我们获得了`viewBox`和`viewport`所需的值，但还未学习如何使用它们。\n\n## 设置与获取值\n\n每个`SvJs`实例，无论是父级`SVG`还是其子元素，都有一个`set()`方法。此方法允许我们设置元素属性的值。\n\
  \n我们如何知道一个元素有哪些属性？好吧，我们会查阅（即搜索）一些官方文档。我推荐的来源是 Mozilla 开发者网络的`SVG`元素参考，地址是[`developer.mozilla.org/en-US/docs/Web/SVG/Element`](https://developer.mozilla.org/en-US/docs/Web/SVG/Element)。用它来提醒自己，或者在你进行独立探索时使用。顺便说一句，`SvJs`库的完整文档可以在[`npmjs.com/package/svjs`](https://npmjs.com/package/svjs)（或相关的`GitHub`仓库）找到；如果你愿意，可以将其放在手边，以便获取每个方法更结构化的定义。\n\
  \n回到设置值，`set()`方法接受一个对象作为其参数，并采用以下格式：\n\n```\nsvg.set({ attribute1: value1, attribute2:\
  \ value2, attributeN: valueN )};\n```\n\n如果你一次设置大量属性，为了可读性，你可以考虑调整格式。\n\n```\nsvg.set({\n\
  attribute1: value1,\nattribute2: value2,\n...\nattributeN: valueN\n)};\n```\n\n\
  不过这取决于你；两种方式都行。\n\n对于我们的父级`SVG`来说，值得注意的属性是`width`和`height`（它们构成了`viewport`）以及`viewBox`。我们现在可以将以下代码添加到我们的模板中来设置这些属性：\n\
  \n```\nsvg.set({ width: svgSize, height: svgSize, viewBox: '0 0 1000 1000' });\n\
  ```\n\n```\n\n\n运行`live-server`命令并导航到我们的模板文件夹后，此时您只会看到一个空白页面。这是因为我们的 SVG 画布中没有任何内容能使其与背景区分开来。我们将很快通过创建一个用作背景层/画布的矩形来解决这个问题。\n\
  \n正如我们可以使用`set()`来设置值一样，我们也可以使用`get()`来获取值。虽然您可能不会经常用到这个功能，但了解其存在是件好事。例如，以下代码会将我们的`viewBox`值输出到控制台：\n\
  \n```\nconsole.log(svg.get('viewBox'));\n```\n\n通过`get()`方法获取属性值在处理事件监听器或其他值动态更新的场景中会非常有用。\n\
  \n## 更快捷的元素创建\n\n如果我们每次创建新的 SVG 元素时都要调用`new SvJs`构造函数和`addTo`方法，久而久之可能会有些繁琐。这时，`SvJs`库的`create()`方法就派上了用场，它将这两个步骤合二为一。要创建一个元素并自动将其追加到父级\
  \ SVG 中，我们只需这样写：\n\n```\nsvg.create('elementName');\n```\n\n在创建元素时，除非你确信之后不会再引用它，否则最好将其赋值给一个变量。因此，你可能会将上述代码写成：\n\
  \n```\nconst variableName = svg.create('elementName');\n```\n\n`create()`方法支持链式调用，并且也可以被子元素调用。\n\
  \n## 线条与形状\n\nSVG 规范定义了六种基本形状类型：\n\n*   圆形\n*   椭圆\n*   线条\n*   多边形\n*   折线\n* \
  \  矩形\n\n由于我们需要设置一个背景，让我们先从矩形开始。\n\n### 矩形和正方形\n\n在 SVG 规范中，矩形是`rect`。要创建一个矩形，我们这样写：\n\
  \n```\nsvg.create('rect');\n```\n\n接下来，我们将链式调用`set()`方法，重点关注`rect`元素的以下五个属性：`x`和`y`用来设置其左上角的位置；`width`和`height`用来定义其大小；以及`fill`用来定义其颜色。因为我们想要一个正方形（从技术上讲，正方形只是一种特殊的矩形），只需将`width`和`height`设置为相同的值即可。请将以下代码添加到我们的模板中：\n\
  \n```\n// 背景。\nsvg.create('rect').set({\n  x: 0, y: 0, width: 1000, height: 1000,\
  \ fill: '#181818'\n});\n```\n\n请注意，我们定义背景的位置和尺寸时，是相对于`viewBox`，而不是`viewport`。这能让我们的值保持一致，因为我们事先并不知道`viewport`的大小。现在运行`live-server`，你应该会看到一个比周围背景颜色稍暗的正方形画布。\n\
  \n这足以满足我们的模板需求。如果你之前遗漏了什么，或者只是想确保代码顺序正确，以下是完整的模板`sketch.js`文件：\n\n```\nimport {\
  \ SvJs } from '../../node_modules/svjs/src/index.js';\n\n// 父级 SVG。\nconst svg =\
  \ new SvJs().addTo(document.getElementById('container'));\n\n// 视口和 viewBox（1:1\
  \ 宽高比）。\nconst svgSize = window.innerWidth > window.innerHeight ? window.innerHeight\
  \ : window.innerWidth;\nsvg.set({ width: svgSize, height: svgSize, viewBox: '0 0\
  \ 1000 1000' });\n\n// 背景。\nsvg.create('rect').set({\n  x: 0, y: 0, width: 1000,\
  \ height: 1000, fill: '#181818'\n});\n```\n\n我们之后编写的任何代码都将特定于正在处理的草图。在复制`00-template`文件夹及其内容并将其重命名为`02-basic-shapes`之前，请确保已保存更改。\n\
  \n## 初次描边\n\n有两个重要的属性几乎可以用于所有图形化的 SVG 元素（即，那些意图显示在屏幕上的元素）。它们是元素的`fill`和`stroke`。正如我们已经看到的，`fill`定义了元素的内部颜色（或背景）。而`stroke`则定义了元素轮廓（或边框）的颜色。\n\
  如果你没有定义`stroke`，就不会显示描边。如果你定义了描边，它默认的`stroke-width`为`1`。\n`stroke-width`属性之所以重要还有另一个原因：它是一个带连字符的属性的例子。在\
  \ JavaScript 中设置属性时我们不能使用连字符，因为它们会被解释为减法运算符。\n我们有两种方法处理这个问题：可以将它们转换为字符串，即写成`'stroke-width'`而不是`stroke-width`；或者用下划线替换连字符，即`stroke-width`变成`stroke_width`。\n\
  SvJs 支持后一种方法，这也是我更喜欢的方式；它速度更快，并且相比在属性对象中混合使用字符串化和非字符串化的属性，看起来也更协调。\n\n理论就讲到这里——让我们来创建一些东西吧！下面的草图是受约瑟夫·阿尔伯斯（Josef\
  \ Albers）启发的色彩错觉图，它展示了仅使用普通矩形就能创作出相当有趣的构图（如图 3-1 所示）。\n\n![](img/538894_1_En_3_Fig1_HTML.png)\n\
  \n一幅抽象画，展示了一个由不同颜色的普通矩形构成的方形结构，背景为深色。\n\n**图 3-1**  \n受约瑟夫·阿尔伯斯启发的色彩错觉\n\n```\n\
  import { SvJs } from '../../node_modules/svjs/src/index.js';\n\n// 视口大小（1:1 宽高比）。\n\
  const svgSize = window.innerWidth > window.innerHeight ? window.innerHeight : window.innerWidth;\n\
  \n// 父级 SVG。\nconst svg = new SvJs().addTo(document.getElementById('container'));\n\
  svg.set({ width: svgSize, height: svgSize, viewBox: '0 0 1000 1000' });\n\n// 背景。\n\
  svg.create('rect').set({\n  x: 0, y: 0, width: 1000, height: 1000, fill: '#181818'\n\
  });\n\n// 主橙色正方形。\nsvg.create('rect').set({\n  x: 150, y: 200, width: 700, height:\
  \ 600, rx: 15, fill: '#e56411',\n  stroke: '#fff', stroke_width: 30, paint_order:\
  \ 'stroke'\n});\n\n// 蓝色矩形。\nsvg.create('rect').set({\n  x: 650, y: 200, width:\
  \ 200, height: 600, rx: 15, fill: '#69969f'\n});\n\n// 较小的橙色矩形。\nsvg.create('rect').set({\n\
  \  x: 200, y: 425, width: 600, height: 150, rx: 20, fill: '#b84b08'\n});\n\n// 黄色矩形。\n\
  svg.create('rect').set({\n  x: 325, y: 200, width: 175, height: 600, fill: '#fed322'\n\
  });\n\n// 紫色矩形。\nsvg.create('rect').set({\n  x: 500, y: 200, width: 175, height:\
  \ 600, fill: '#49283c'\n});\n```\n\n左右两侧较小的矩形看起来是相同的橙色吗？假设这种错觉成功了，你可能很难给出一个确切的答案。但通过浏览代码，你可以轻松验证它们不仅是相同的颜色，而且形状也相同！\n\
  使矩形具有圆角的是`rx`属性，它表示矩形在 x 轴上的圆角半径。如果没有定义相应的`ry`属性，则假定你想要相同的值（从而产生均匀的圆角）。\n你可能还在前面的代码中发现了另一个带连字符的属性，即`paint-order`。这个属性决定了给定元素的`fill`和`stroke`的渲染顺序。\n\
  默认顺序是`fill`先渲染（即填充在下方，因此会被`stroke`部分覆盖），但有时让`stroke`先渲染也很有用，因为只有这样我们才能看到完整的`fill`区域被绘制出来（从代码中删除`paint_order:\
  \ 'stroke'`，你就会明白我的意思）。\n\n### 圆形和椭圆\n\n圆形是所有形状中最简单（也可以说是最完美）的。我们通过`cx`和`cy`属性定义其中心位置，并通过`r`属性定义其半径。\n\
  \n\n\n### 排版后的文本\n\n```\n// 一个简单的圆形示例。\nsvg.create('circle').set({ cx: 50, cy: 50,\
  \ r: 25 });\n```\n\n在下一个草图中，我们用一个`for`循环来提升一下难度。我们将尝试将不同大小的半透明圆形层层叠加的效果（如图 3-2 所示）。再次复制模板文件夹，并将其重命名为`03-circle-overlay-loop`或类似名称（只要保持基本的组织性，文件夹名称其实并不重要）。\n\
  \n在定义背景的代码下方，添加以下代码：\n\n```\n// 圆形叠加循环。\nfor (let i = 1; i <= 6; i += 1) {\n// 变化半径和两个垂直中心点。\n\
  let r = 50 * i;\nlet cx = 500;\nlet cy1 = 800 - r;\nlet cy2 = 200 + r;\n// 创建偏蓝色的圆形集合。\n\
  svg.create('circle').set({\ncx: cx, cy: cy1, r: r, fill: '#99eeff', fill_opacity:\
  \ 0.1\n});\n// 创建偏绿色的圆形集合。\nsvg.create('circle').set({\ncx: cx, cy: cy2, r: r, fill:\
  \ '#aaffee', fill_opacity: 0.1\n});\n}\n// 创建一个微弱的轮廓。\nsvg.create('circle').set({\n\
  cx: 500, cy: 500, r: 320, fill: 'none',\nstroke: '#aaffee', stroke_width: 2, stroke_opacity:\
  \ 0.1\n});\n```\n\n![](img/538894_1_En_3_Fig2_HTML.png)\n\n一幅抽象图，在深色背景上展示了一个巨大的圆形，上面叠加了若干层半透明圆形。\n\
  \n**图 3-2**\n圆形叠加循环的结果\n\n我们在这里所做的是，每次循环运行时，改变两组圆形的`cy`属性（垂直位置）并增加半径`r`。这两组圆形通过颜色（略有不同）和初始位置来区分。循环外的一个最终圆形为这两组圆形提供了一个微弱的轮廓框架。\n\
  \n椭圆与圆形类似，但它有两个半径属性——`rx`和`ry`——而不是单一的`r`。在第 1 章的第一个生成式草图中，我们看到了椭圆的应用。以下是相关的代码片段：\n\
  \n```\n// 创建我们的椭圆。\nlet ellipse = svg.create('ellipse');\nellipse.set({\ncx: center,\n\
  cy: center,\nrx: radiusX,\nry: radiusY,\n...\n});\n```\n\n### 线条、折线与多边形\n\n如果你需要绘制一条从一个点到另一个点的简单直线，可以使用`line`元素。它需要两组坐标：`x1`和`y1`定义起点位置，`x2`和`y2`定义终点位置。同时还需要定义`stroke`（描边）（因为它毕竟是一条线）。\n\
  \n```\n// 朴素的线条。\nsvg.create('line').set({\nx1: 10, y1: 10, x2: 90, y2: 90, stroke:\
  \ '#333'\n});\n```\n\n这是一个很好的机会来展示一些其他可以改变线条外观的与描边相关的属性。第一个是`stroke-linecap`。这个属性定义了线条端点的行为方式。默认值`butt`将线条长度限制在其端点。值`round`会在两端用半圆形封闭线条，而值`square`则会用——你猜对了——方形来封闭线条。图\
  \ 3-3 展示了不同的值，两侧的竖线标明了这些值生效的边界。\n\n![](img/538894_1_En_3_Fig3_HTML.png)\n\n一幅抽象图，在深色背景上展示了三条高亮的水平条，两侧各有一条竖线连接。中间的条带有圆角。最后两条条的尺寸略大于第一条，而第一条恰好完全位于两条竖线之间。\n\
  \n**图 3-3**\n`butt`、`round`和`square`的值（从上到下）\n\n我想强调的另一个属性是`stroke-dasharray`。如果你想要的是虚线而非实线，就可以使用这个属性。更具体地说，`stroke-dasharray`设置了绘制描边时使用的虚线及其间隔的图案。如果我们设置一个单一值，例如`20`，则该值将同时用于虚线的长度和间隔的长度。如果我们设置两个值，第一个用于虚线的长度，第二个用于间隔的长度。然而，如果我们设置三个值，第一个用于第一条虚线的长度，第二个用于间隔，第三个用于下一条虚线的长度。然后这些值会循环使用，从而形成一个重复的图案。\n\
  \n你提供的值数量没有严格的上限，因此这里有很大的发挥创意的空间。\n\n```\n// 设置一个不规则的 stroke-dasharray。\nsvg.create('line').set({\n\
  ...\nstroke_dasharray: 10 30 60\n});\n```\n\n在图 3-4 中，从上到下，我们可以看到以下的`stroke-dasharray`值（所有值均相对于宽度为`1000`的`viewBox`）：\n\
  \n![](img/538894_1_En_3_Fig4_HTML.png)\n\n一幅抽象图，在深色背景上展示了四条不同图案的水平虚线。\n\n**图 3-4**\n\
  各种 `stroke-dasharray` 的值\n\n*   `20`\n*   `40 20`\n*   `10 30 60`\n*   `50 100 200\
  \ 100`\n\n如果你想把一条直线连接到另一条直线上，可以使用`polyline`元素。它接受一个由空格分隔（或逗号分隔）的值组成的`points`数组，用于定义每个`x`和`y`坐标。在将`points`数组设置为属性值之前，需要将其转换为字符串。在下面的示例中，我将演示如何使用`join()`数组方法来实现这一点。结果如图\
  \ 3-5 所示。\n\n![](img/538894_1_En_3_Fig5_HTML.png)\n\n一幅抽象图，在深色背景上展示了一条带有不同振幅峰值和谷值的平直线条。\n\
  \n**图 3-5**\n`polyline`元素的实际效果\n\n```\n// 一个点的数组。\nlet pointsArray = [\n100, 250,\
  \ 250, 250, 285, 175, 325, 325, 390, 50, 450, 400, 500, 200, 515, 250, 900, 250\n\
  ];\n// 一个模拟心跳的折线元素。\nsvg.create('polyline').set({\npoints: pointsArray.join(' '),\n\
  stroke: '#6df876',\nfill: 'none',\nstroke_width: 10,\nstroke_linecap: 'round',\n\
  stroke_linejoin: 'round'\n});\n```\n\n在前面的示例中，我还使用了`stroke-linejoin`属性；它定义了每条线段连接处所使用的形状。\n\
  \n`polygon`元素类似于`polyline`元素，但用于闭合形状，即起点和终点相连接的形状。在图 3-6 中，我们看到了一系列多边形，特定平台的游戏玩家可能会觉得这些形状很熟悉。\n\
  \n![](img/538894_1_En_3_Fig6_HTML.png)\n\n一幅抽象图，在深色背景上依次排列了三角形、平行四边形、加号和六边形。\n\n\
  **图 3-6**\n为玩家准备的多边形\n\n使用`polygon`或`polyline`元素手动创建形状不是我们目前要重点关注的，因为这可能相当繁琐。我们将在后面的章节中介绍更好的生成形状的方法。\n\
  \n### 文本与标题\n\n由于 SVG 是一种纯文本格式，因此它支持文本元素也就不足为奇了。要创建一些文本，我们使用常用的`svg.create()`方法。至少，我们需要定义希望文本出现位置的`x`和`y`坐标（相对于文本边界框的左下角）、文本的颜色以及文本的内容。\n\
  \n```\n// 创建文本。\nlet text = svg.create('text').set({\nx: 20, y: 30, fill: 'white'\n\
  });\n```\n\n那么，如果内容本身不是一个属性，我们该如何定义文本内容呢？它也不是一个子节点，因此创建字符串并追加是不行的。相反，我们需要使用 SvJs\
  \ 的 `content()` 方法。\n\n```\n// 使用 content() 方法插入文本。\ntext.content('我对 SVG 有着一种不健康的痴迷。');\n\
  ```\n\n\n\n### 排版后的文本\n\n如果我们想让文本更加精致，并为其添加一些网络字体，该怎么做呢？有几种方法可以实现，但我将采用最简单的方式，通过\
  \ HTML 引入一些谷歌字体。让我们以此为蓝本快速绘制一幅草图；复制我们的 `00-template` 文件夹，并将其命名为 `04-chalkboard-gag`。如果你看过*辛普森一家*，就会知道大多数剧集的开场都有一个黑板擦笑话，巴特被罚在黑板上胡乱涂写，以此作为对他调皮行为的惩罚。下面这幅草图中就包含了我最喜欢的一个笑话。\n\
  \n我们首先需要在 HTML 中加入以下 `<link>` 标签，因此切换到 `index.html` 文件，并在 `<head>` 部分添加以下代码行。这将调用一个名为\
  \ `Mynerve` 的谷歌字体，该字体具有我们想要的手写风格。\n\n```\n如果巴特可以选择运行一个 `for` 循环来减少惩罚的重复性，我相信他会选择这样做。让我们替他执行这个操作（顺便让斯金纳扫兴）。\n\
  ```\n\n在我们声明背景的代码下方添加以下代码。需要注意几点：我们调用了 `toUpperCase()` 字符串方法将内容转换为大写；这是一个很有用的方法，相关的方法还有\
  \ `toLowerCase()`。使用 `52` 的 `font_size` 来最佳地填满 `viewBox` 的宽度，并且每次迭代将 `y` 位置递增 `80`，这样就能将文字行向下推，填满我们的黑板。我们有足够的空间这样做\
  \ `12` 次，这就是为什么我们将增量限制在 `960` 以下（`960 ÷ 80 = 12`）。再多一次迭代就会溢出视口。\n\n输出结果如图 3-7 所示。\n\
  \n![](img/538894_1_En_3_Fig7_HTML.png)\n\n输出页面的截图。上面有一组文字，内容是“Bart bucks are not\
  \ legal tender.”。\n\n**图 3-7** “巴特币”黑板擦笑话\n\n```\n// 用于笑话的文本行。\nlet line = '\"Bart\
  \ Bucks\" are not legal tender.';\nline = line.toUpperCase();\n// 运行一个循环，创建 12 (960\
  \ / 80) 行文本。\nfor (let i = 0; i < 960; i += 80) {\nlet text = svg.create('text');\n\
  text.content(line);\ntext.set({\nx: 20,\ny: 80 + i,\nfill: '#fff',\nfont_size: 52,\n\
  font_family: 'Mynerve'\n});\n}\n```\n\n标题是另一种我们可以使用的文本。与 `text` 元素不同，`title` 元素不需要定位；它旨在作为描述嵌套在元素内部。它的工作方式与\
  \ HTML 的 `title` 属性类似；它有助于提升无障碍访问性，并在鼠标悬停时作为工具提示显示。它可以用于为父级 SVG 元素或其任何子元素添加标题。\n\
  \n```\n// 为一个圆形元素创建标题。\nlet circle = svg.create('circle');\nlet circleTitle = circle.create('title');\n\
  circleTitle.content('我到处闲逛，到处闲逛。');\n```\n\n`title` 元素适合较短的描述；对于更长的描述，推荐使用 `desc`\
  \ 元素。该元素不会渲染，纯粹是为了无障碍访问目的，其创建方式与 `title` 元素完全相同。如果你想添加关于 SVG 文件本身的额外信息，可以使用 `metadata`\
  \ 元素。例如，嵌入 RDF（资源描述框架）数据或应用程序特定数据。你经常会看到像 Inkscape 或 Illustrator 这样的软件用这种方式嵌入它们自身的元数据。\n\
  \n## 定义（defs）\n\n如果我们想在 SVG 中定义一个图形或其他容器元素，但又不希望该元素本身显示（或者希望它仅在被引用时才显示），我们可以将其嵌套在\
  \ `defs` 元素中，`defs` 代表定义。`defs` 元素可以提升 SVG 的整体无障碍访问性，也有助于更好地组织其内容。\n\n在接下来的关于渐变、图案和其他可复用元素的章节中，我们将依赖\
  \ `defs` 元素提供的功能。\n\n```\n// 定义一个 defs 元素。\nlet defs = svg.create('defs');\n```\n\
  \n## 渐变（Gradients）\n\n渐变是从一种颜色状态逐渐过渡到另一种颜色状态。在 SVG 中，渐变可以支持多种不同的颜色状态（或者称为“色标”）。最常见的是双色标渐变，但偶尔也会遇到包含彩虹般多种不同颜色的渐变。说到彩虹，天空本身就是渐变灵感（渐变的灵感？）的绝佳来源。想象一下黄昏时暗淡的光线，柔和的黄色过渡到浅蓝色，或者日落时炽热的光芒，紫色、红色和橙色交织在一起。\n\
  \n渐变有两种类型：线性渐变（颜色从一个区域沿直线过渡到另一个区域）和径向渐变（颜色从焦点向四周所有方向辐射）。\n\n那么，在 SvJs 中如何创建这样的渐变呢？事实证明，仅仅使用\
  \ `create()` 方法会是一个非常冗长的过程，原因如下：\n\n*   渐变被定义为 `defs` 部分中的独立元素，而不是被视为纯粹的外观属性元素。这样做的好处是单个渐变可以在多个元素之间共享，但缺点是开始时我们需要多执行几个步骤。\n\
  *   对于渐变的每种颜色，必须在渐变元素内定义并嵌套一个 `stop` 元素，以定义颜色及其偏移量（或位置）。这又增加了一系列步骤。\n\n为了解决上述问题，SvJs\
  \ 提供了一个专门的 `createGradient()` 方法，可以显著加快构建渐变的过程。其语法如下：\n\n```\ncreateGradient(id,\
  \ type, colours, rotation)\n```\n\n第一个参数，我们为渐变分配一个 `id`，以便后续可以被元素引用或调用。第二个参数，我们指定渐变类型，即线性或径向。第三个参数，我们传入一个颜色值数组。最后一个参数，我们指定旋转角度，默认为\
  \ 45°（意味着它从左上角“照射”到右下角）。最后一个参数是可选的，仅适用于线性渐变。\n\n`createGradient()` 方法只能由父级 SVG 调用，因为在后台它会检查\
  \ SVG 中是否已经定义了 `defs` 元素，如果没有，它会创建一个并将渐变附加到其中。\n\n下面是我们如何创建一个简单的三色标线性渐变并将其应用于 `rect`\
  \ 元素。\n\n```\n// 创建一个 id 为 'grad' 的渐变。\nsvg.createGradient('grad', 'linear', ['red',\
  \ 'orange', 'yellow'], 90);\n// 通过 url 引用将渐变应用于矩形的填充。\nsvg.create('rect').set({\n\
  x: 0, y: 0, width: 400, height: 400, fill: 'url(#grad)'\n});\n```\n\n如你所见，我们希望应用渐变的形状通过内部\
  \ `url` 引用渐变的 `id`。在前面的示例中，我们将其应用于 `fill` 属性，但它也可以应用于 `stroke`。\n\n在图 3-8 中，我们看到了三个线性渐变及其对应的径向渐变的示例。第一个渐变有两个色标，第二个有三个，第三个有四个。正如你所见，线性渐变更容易看起来更平滑；对于径向渐变，微妙总是更好，因为与线性渐变相比，其过渡看起来可能相对突兀（或出现色带）。\n\
  \n![](img/538894_1_En_3_Fig8_HTML.png)\n\n一幅抽象图展示了三根竖条和三个圆形，颜色呈现渐变效果，背景为深色。\n\n\
  **图 3-8** 线性渐变及其对应的径向渐变\n\n还有更多自定义渐变的方法，我们在此不再赘述，但如果你感兴趣，可以查阅 MDN 文档，了解更多关于渐变 `spreadMethod`\
  \ 以及改变径向渐变焦点的内容。\n\n\n\n## 图案\n\n与渐变类似，图案位于`defs`元素中，供后续引用，而非直接渲染。它们有自己的`viewport`（即宽度和高度）和可选的`viewBox`，这乍看可能有些复杂，但确实提供了更高的灵活性。你可以将`pattern`元素视为一个微型画布，它会在更大的图形元素上重复平铺，理解了这一点，这些设置的含义就清晰了。\n\
  \n要创建一个图案，我们可以使用`createPattern()`快捷方法。与渐变方法类似，它会自动将自身追加到`defs`元素中，并在该元素不存在时自动创建。它还在底层以其他方式简化了图案的创建过程，你无需为此操心。该方法需要三个参数：图案的`id`、`width`和`height`。\n\
  \n为了演示图案的工作原理，我们将快速创建一个草图——又是一个视错觉图，但这次的重点不在颜色上。请复制我们的`00-template`文件夹，并将其重命名为`05-optical-illusion`。\n\
  \n在我们`sketch.js`文件的背景代码下方，创建一个`id`为'illusion'、宽度为`100`、高度为`200`的图案。\n\n```\n// 创建我们的图案。\n\
  const pattern = svg.createPattern('illusion', 100, 200);\n```\n\n这仅仅初始化了我们的图案；我们还没有在其中放置任何内容，也没有创建要应用图案的形状。我们只有一个垂直矩形形状的图案。\n\
  \n在这个草图的第一版迭代中，我将向你展示一个简单的图案是如何应用到形状上的。之后，我们会让图案内容变得更复杂。将以下代码添加到我们的草图中：\n\n```\n\
  // 在图案中创建一个白色矩形。\npattern.create('rect').set({\nx: 10, y: 10, width: 80, height:\
  \ 180, fill: '#eee'\n});\n```\n\n现在我们已经创建了简单的图案（由一个白色矩形组成），是时候将它应用到一个形状上了。为简单起见，我们将其应用到另一个与\
  \ SVG `viewBox` 大小相同的`rect`上，如下所示：\n\n```\n// 将我们的图案应用到一个与 viewBox 大小相同的矩形上。\nsvg.create('rect').set({\n\
  x: 0, y: 0, width: 1000, height: 1000, fill: 'url(#illusion)'\n});\n```\n\n你现在应该能看到类似于图\
  \ 3-9 的效果。虽然不算特别有趣，但足以展示基本原理。\n\n![](img/538894_1_En_3_Fig9_HTML.png)\n\n一个具有 10\
  \ 列 5 行的网格状图案。\n\n**图 3-9** 一个基础图案\n\n在接下来的几个步骤中，我们将创建自己的视错觉图。首先，注释掉创建白色矩形图案的代码（但保留应用该图案的形状）。\n\
  \n```\n// 创建我们的图案。\nconst pattern = svg.createPattern('illusion', 100, 200);\n//\
  \ 在图案中创建一个白色矩形。\n// pattern.create('rect').set({\n//  x: 5, y: 5, width: 90, height:\
  \ 190, fill: '#eee'\n// });\n// 我们将在这里放置新代码。\n// 将我们的图案应用到一个与 viewBox 大小相同的矩形上。\n\
  svg.create('rect').set({\nx: 0, y: 0, width: 1000, height: 1000, fill: 'url(#illusion)'\n\
  });\n```\n\n为了创建我们视错觉图的基础，总共需要八个矩形。其中四个是按特定顺序排列的白色正方形，另外四个是作为分隔线的细长灰色矩形。我们将使用几个`for`循环来创建它们。\n\
  \n首先，创建白色正方形：\n\n```\n// 在图案中创建 4 个白色正方形。\nfor (let i = 0; i < 4; i += 1) {\npattern.create('rect').set({\n\
  x: (i === 3) ? 20: i * 20,\ny: i * 50,\nwidth: 50,\nheight: 50,\nfill: '#eee'\n\
  });\n}\n```\n\n其中的`width`、`height`和`fill`在每次迭代中只是重复自身；我们唯一变化的是`x`和`y`坐标。为此，我们利用了迭代器`i`不断变化的值。`y`坐标在每次循环中增加`50`，这很简单。定义`x`位置的表达式则稍微复杂一些。这里的意思是，我们希望`x`在每次迭代中增加`20`，*除了*最后一次（当`i\
  \ === 3`时）。对于最后一次，我们希望将其设置为`20`。\n\n如果此时查看图案，应该会看到一个起伏的正方形阵列。这还不是一个视错觉图；它看起来更像是初级的像素艺术。为了完成错觉效果，我们需要分隔线。\n\
  \n```\n// 创建 4 个细长的灰色矩形来分隔正方形。\nfor (let i = 0; i < 4; i += 1) {\npattern.create('rect').set({\n\
  x: 0,\ny: 45 + (i * 50),\nwidth: 100,\nheight: 5,\nfill: '#666'\n});\n}\n```\n\n\
  现在，当你保存文件时，应该能看到类似于图 3-10 的效果。\n\n![](img/538894_1_En_3_Fig10_HTML.png)\n\n一个抽象图形，呈现了多个矩形以棋盘格图案排列，并呈锯齿状分布。\n\
  \n**图 3-10** 一个产生视错觉效果的重复图案\n\n如果错觉效果成立，灰色线条看起来应该会略微倾斜，尤其是那些你视线没有直接聚焦的线条。希望这能让你感受到图案的强大之处！我们已经涉及了主要要点，但如果需要，它们还可以通过更多参数进行广泛的自定义。\n\
  \n## 分组与复用元素\n\n可以使用`g`元素对元素进行分组。这有多种用途。其一，像 Inkscape 这样的应用程序采用`g`元素来支持图层功能。其二，是为了进行变换（即同时移动、旋转或倾斜多个元素）而对元素进行分组。其三，仅仅是为了更好地组织\
  \ SVG 而将项目分组在一起。\n\n```\n// 创建一个圆形并将其添加到一个组中。\nconst circle = svg.create('circle');\n\
  const group = svg.create('g');\ncircle.addTo(group);\n```\n\n如果希望将元素分组以备将来复用（即仅在引用时才显示），则应使用`symbol`元素。与图案类似，符号可以拥有自己的`viewport`和`viewBox`。但它们是通`use`元素调用的，而不是应用到`fill`或`stroke`上。\n\
  \n```\n// 创建一个包含圆形和正方形的符号。\nconst symbol = svg.create('symbol');\nsymbol.set({ id:\
  \ 'mySymbol', width: 100, height: 100 });\nsymbol.create('circle').set({ ... });\n\
  symbol.create('rect').set({ ... });\n// 使用该符号三次，但改变其坐标。\nsvg.create('use').set({\
  \ href: '#mySymbol', x: 0, y: 0 });\nsvg.create('use').set({ href: '#mySymbol',\
  \ x: 200, y: 200 });\nsvg.create('use').set({ href: '#mySymbol', x: 400, y: 400\
  \ });\n```\n\n在声明式上下文之外，符号并没有那么大的吸引力，因此在我们基于命令式的创作中不会依赖它们。但如果你想在 MDN 上进一步探索，那里还有很多内容可以挖掘。\n\
  \n## 总结\n\n回顾一下，我们在本章中涵盖了以下内容：\n\n- SvJs 库提供的核心函数\n- SVG `viewBox` 和 `viewport`\
  \ 如何工作\n- 创建基础形状，如矩形、圆形、椭圆、折线以及多边形\n- 自定义`stroke`行为和外观\n- 处理文本和标题\n- 创建渐变和图案\n-\
  \ 定义、分组和符号如何让我们复用元素并更好地构建 SVG 结构\n\n在下一章中，我们将探索如何将规律性与随机性结合，以创建真正具有生成性的构图。\n\n"
- "# 4. 随机性与规律性\n\n\n\n## 随机性：生成艺术的基石\n\n到目前为止，我们所有的草图（第一个除外）都缺少一种通常被认为是生成艺术流派基础的要素：即**随机性**。当我们放弃对草图结果的完全控制，并将某些元素交给机会决定时，这允许了变化、探索和*发现*。\n\
  \n在本章中，我们将学习如何随机化颜色、尺寸和坐标等参数；如何从预定义的数值范围和数组中随机选择；以及如何处理不同的概率分布。我们还将介绍一种流行的生成技术，该技术涉及构建规则网格并随机化其内容。然后，我们将学习如何将随机性应用于网格本身的构建，从而改变作品的基础结构。\n\
  \n### 模拟与数字的随机性\n\n将随机性融入艺术的技术早在数字时代之前就开始了。早在十五世纪，列奥纳多·达·芬奇就建议艺术家从充满随机和暗示性细节的来源中汲取灵感，例如在染色石头和肮脏墙壁表面发现的任意形状。像马克斯·恩斯特这样的艺术家非常认真地对待这样的提示；他的*摩擦法*技术源于将纸张随机放在充满划痕和刮痕的地板上，并从纹理上制作炭笔拓印。\n\
  \n恩斯特的同时代人，二十世纪初的超现实主义者，也在玩弄随机性。他们发展出一种称为**自动主义**的技术，旨在消除对作品执行过程的有意识控制，让机会和无意识成为主要的驱动力。\n\
  \n然而，这些例子都利用了模拟世界中发现的随机性。在数字这个更确定的世界里，1 和 0 占据主导地位，真正的随机性更难找到。它必须被模拟。\n\n好消息是，这更多是一个学术观点而非实际障碍。模拟随机性（或在计算机科学领域被称为**伪随机性**）对于我们的需求来说已经足够了。而且，这也很容易证明，这要感谢\
  \ JavaScript 内置的 `Math.random()` 函数。在你的浏览器控制台中输入该函数并回车，应该足以让你确信它返回的 17 位浮点数不太可能在短期内重复。够随机了，对吧？\n\
  \n```\nMath.random();\n-> 0.32846662956382255\n```\n\n这个函数的局限性在于它只返回 0 到 1 之间的数字。诚然，我们可以轻松地将输出乘以任何我们想要的因子，但如果我们需要一个特定范围内的数字呢？或者想从数组中随机选择一个元素？\n\
  \n## SvJs 的 `Gen.random( )` 函数\n\n幸运的是，SvJs 库附带了一些额外功能：具体来说，是一个名为 `Gen` 的可选模块，其中包含许多对生成艺术家有用的函数。其中之一就是\
  \ `Gen.random()` 函数。\n\n要加载 `Gen` 模块，我们需要将其添加到草图顶部的导入语句中。修改模板草图，将其作为第一行（替换之前的导入语句）：\n\
  \n```\nimport { SvJs, Gen } from '../../node_modules/svjs/src/index.js';\n```\n\n\
  现在我们可以调用 `Gen.random()` 和任何其他 `Gen` 方法（我们将在后面介绍更多）。当不带任何参数调用时，`Gen.random()` 的行为就像\
  \ `Math.random()`；它返回一个介于 `0` 和 `1` 之间的浮点数。\n\n```\nGen.random();\n-> 0.5682831319665758\n\
  ```\n\n然而，如果我们提供一些参数，它会突然变得更有用。以下是一些示例：\n\n```\n// 返回 50 到 100 之间的整数。\nGen.random(50,\
  \ 100);\n-> 87\n// 返回 10 到 20 之间的浮点数。\nGen.random(10, 20, true);\n-> 17.98188644344106\n\
  // 从数组中随机返回一个元素。\nlet rainbow = ['red', 'yellow', 'pink', 'green', 'purple', 'orange',\
  \ 'blue'];\nGen.random(rainbow);\n-> 'purple'\n```\n\n如你所见，如果我们提供两个数字，`Gen.random()`\
  \ 函数会将它们视为一个范围的下限和上限，并返回该范围内的一个数字。默认返回一个整数，但如果将第三个参数设置为 `true`，它将返回一个浮点数。如果我们完全不提供参数（如第一个示例），或者第一个和第二个参数之间的差值小于或等于\
  \ 1，它也会返回一个浮点数。\n\n如果我们传入一个数组作为唯一参数，则从该数组中随机选择一个元素。我特意在示例中使用了颜色（如果“Sing a Rainbow”这首歌在你脑海中挥之不去，我深表歉意），因为这个功能在从预定义调色板中选择颜色时特别有用。\n\
  \n### 无处不在的元素\n\n让我们创建一个草图，让 `Gen.random()` 发挥作用。像往常一样复制 `00-template` 文件，并将其重命名为类似\
  \ `06-elements-everywhere` 的名字。\n\n在我们的背景代码下方，初始化一个变量来存储随机迭代次数，这将决定我们的 `for` 循环（我们稍后将设置）将运行多少次。\n\
  \n```\nlet iterations = Gen.random(500, 1000);\n```\n\n我们的 `iterations` 将是一个介于 `500`\
  \ 和 `1000` 之间的整数。有了这个，让我们编写循环。我们最初将保持简单，只用它来创建小圆圈。每个圆圈都会在 `viewBox` 的尺寸（`0` 到 `1000`）内获得一个随机位置，其半径将在\
  \ `1` 到 `10` 之间。这应该会产生一个与油漆泼溅不太相似的效果（如图 4-1 所示）。\n\n![](img/538894_1_En_4_Fig1_HTML.png)\n\
  \n一幅抽象画呈现出一个黑色方块，里面有呈随机图案的深色圆圈簇。\n\n**图 4-1**\n圆圈随机泼溅效果\n\n```\nfor (let i = 0;\
  \ i < iterations; i += 1) {\n  svg.create('circle').set({\n    cx: Gen.random(0,\
  \ 1000),\n    cy: Gen.random(0, 1000),\n    r: Gen.random(1, 10)\n  });\n}\n```\n\
  \n### 变化的颜色和不透明度\n\n此时，我们有无色的溅点随机地点缀在画布上。让我们通过改变 `fill` 的色相和不透明度来改变这一点。我们将使用 `hsl()`\
  \ 函数来实现，这个函数我们以后会经常用到。它的语法如下：\n\n```\nhsl(hue saturation lightness / alpha)\n```\n\
  \n色相可以是 `0` 到 `360` 之间的任何数字。饱和度和明度是百分比值，而 alpha 分量（决定不透明度）可以是百分比，也可以是 `0` 到 `1`\
  \ 之间的数字。\n\n在我们的循环中，在半径下方添加以下行（确保用逗号分隔这些行）：\n\n```\nfill: `hsl(${Gen.random(0, 360)}\
  \ 80% 80% / ${Gen.random(5, 40)}%)`\n```\n\n现在，我们的溅点变得生动了一些（见图 4-2）。但是为什么要局限于圆圈呢？为什么不向组合中添加一些其他元素，让它看起来不那么像一个宇宙球池呢？在下一个版本的草图中，我们将精确地做到这一点。复杂度将显着增加，所以我们会慢慢地逐步讲解。\n\
  \n![](img/538894_1_En_4_Fig2_HTML.png)\n\n一幅抽象画呈现出一个黑色方块，其中散布着具有渐变色和不同尺寸的点。\n\n\
  **图 4-2**\n色彩更丰富的溅点\n\n### 变化的元素选择\n\n在我们的 `iterations` 变量下面，创建一个名为 `elements` 的数组，并用\
  \ `circle`、`line` 和 `rect` 填充它：\n\n```\nlet elements = ['circle', 'line', 'rect'];\n\
  ```\n\n接下来，删除 `for` 循环中所有现有的代码，并将其替换为以下行，该行将从先前定义的 `elements` 数组中随机选择一个元素。\n\n```\n\
  // 随机选择一个元素。\nlet element = Gen.random(elements);\n```\n\n在下一步中，我们将使用随机值初始化一些变量，这些变量稍后可以应用于我们随机选择的元素。除了\
  \ `x`、`y` 和 `fill` 之外，我们还将改变 `stroke` 和 `stroke-width`。\n\n\n\n```\n// 设置可在任意元素上使用的变量。\n\
  let x = Gen.random(200, 800);\nlet y = Gen.random(200, 800);\nlet fill = `hsl(${Gen.random(120,\
  \ 240)} 80% 80% / ${Gen.random(5, 40)}%)`;\nlet stroke = `hsl(${Gen.random(0, 120)}\
  \ 80% 80% / ${Gen.random(5, 40)}%)`;\nlet strokeWidth = `${Gen.random(1, 3)}`;\n\
  ```\n\n这里你会发现，我将 `x` 和 `y` 变量限制在 `200` 到 `800` 的范围内，这确保了我们的形状保持在该区域内，而不会覆盖整个画布。这样做是为了让最终结果更像一幅精心构图的作品，而非一团散乱的元素。\n\
  \n接下来，我们将设置一个 `props` 变量（properties 的常用缩写）。思路是根据所选元素来设置其属性。由于每个元素在某些属性上有各自独特的语法（例如，`rect`\
  \ 有 `x` 和 `y`，而圆形则有 `cx` 和 `cy`），我们需要一种方法来按条件填充 `props`。有几个方法可以解决这个问题，但 `switch`\
  \ 语句特别适合这种情况。它允许我们逐个情况（字面意思，你马上就会看到）地填充 `props` 变量。\n\n```\n// 初始化属性变量。\nlet props;\n\
  // 根据所选元素填充属性。\nswitch(element) {\n  case 'circle':\n    props = {\n      cx: x,\
  \ cy: y, r: Gen.random(1, 10),\n      fill: fill, stroke: stroke, stroke_width:\
  \ strokeWidth\n    };\n    break;\n  case 'line':\n    props = {\n      x1: x, y1:\
  \ y, x2: x + (Gen.random(-20, 20)),\n      y2: y + (Gen.random(-20, 20)), stroke:\
  \ stroke\n    };\n    break;\n  case 'rect':\n    props = {\n      x: x, y: y, width:\
  \ Gen.random(5, 25), height: Gen.random(5, 25),\n      fill: fill, stroke: stroke,\
  \ stroke_width: strokeWidth,\n      transform: `rotate(${Gen.random(0, 360)} 500\
  \ 500)`\n    };\n}\n```\n\n这里可能稍微需要解释的一行是 `rect` 属性中包含的 `transform` 属性。这个属性可以接受\
  \ `translate`、`rotate`、`scale` 或 `skew` 命令作为参数，并附带一个变换值以及另外两个代表变换原点的值。原点是一组 `x`\
  \ 和 `y` 坐标，定义了变换所依据的参考点。例如，对于 `rotate` 命令，我们就是相对于 `500 500`（即 `viewBox` 的中心）随机旋转\
  \ `rect`。\n\n在我们的 `switch` 语句之后，循环中还剩一行代码要添加。这行代码就是实际创建 `element` 并将 `props` 应用于它的代码。\n\
  \n```\n// 创建元素并设置其属性。\nsvg.create(element).set(props);\n```\n\n现在运行草图时，你应该（希望）能看到类似图\
  \ 4-3 所示的结果。也许我们并没有成功地让它看起来不那么爆炸性（在我看来，它像是一场五彩纸屑的爆发），但不同的形状以及描边值的加入，无疑在多样性和视觉趣味性上增色不少。\n\
  \n![](img/538894_1_En_4_Fig3_HTML.png)\n\n一幅抽象图，显示了一个褪色的圆形，其中聚集了一簇颜色渐变、随机分布的元素，背景为深色。这些元素包括正方形、长方形、圆形和线条。\n\
  \n**图 4-3** 随机元素像五彩纸屑般散落\n\n## 规则网格\n\n不受约束的随机性只能让我们走到这一步；我们需要一些技巧来驯服和约束它。在生成艺术领域，一个特别突出的技巧是使用网格，它允许我们结构化地组织随机性。\n\
  \n### 嵌套 For 循环\n\n嵌套 `for` 循环由一个在另一个循环内部运行的循环组成。由于网格由列（沿 x 轴）和行（沿 y 轴）组成，因此嵌套 `for`\
  \ 循环在其构建中非常有用。通常的做法是，我们沿 y 轴开始创建行，然后对于每一行，我们沿 x 轴从左向右移动，填充该列中的每个单元格。这种移动方式模拟了计算机历史上将像素数据绘制到显示器的方式：从左上角开始，横向移动，然后向下工作。\n\
  \n因此，外循环将是我们的 y 轴，向下移动。对于 y 轴的每次迭代，内（嵌套）循环将横向移动，填充 x 轴。\n\n```\n// 嵌套循环结构示例。\nfor\
  \ (let y = 0; y < height; y += 1) {\n  for (let x = 0; x < width; x += 1) {\n  \
  \  // 代码写在这里。\n  }\n}\n```\n\n让我们创建一个草图来更好地说明这一点。复制并重命名模板文件夹，将其命名为 `07-regular-grids`。在背景下方，我们将设置一个组元素来充当我们的网格容器。\n\
  \n```\n// 创建我们的网格容器组。\nlet grid = svg.create('g');\n```\n\n现在运行我们的 `for` 循环，每次迭代向\
  \ `grid` 添加一个 `rect` 元素。\n\n```\n// 用于可视化网格的嵌套循环。\nfor (let y = 0; y < 700; y +=\
  \ 50) {\n  for (let x = 0; x < 700; x += 50) {\n    grid.create('rect').set({\n\
  \      x: x, y: y, width: 40, height: 40, fill: 'none', stroke: '#eee'\n    });\n\
  \  }\n}\n```\n\n我们在这里使用的值并非特别有意义；我们可以选择不同的增量值、迭代次数、正方形的宽度和高度等。我们稍后可以整理这些值。如果你运行\
  \ `live-server`，你会注意到网格偏离中心，位于左上方（因为我们的 `x` 和 `y` 值初始化为 `0`）。我们可以调整 `x` 和 `y` 值，直到网格与\
  \ `viewBox` 的中心对齐，但这会涉及一些繁琐的试错，并且每次更改网格时都需要调整。相反，让我们使用 SvJs 内置的 `moveTo()` 方法。`moveTo()`\
  \ 方法将给定元素按其中心点移动到新位置。新位置以 `(x, y)` 坐标对的形式传入。此方法对组元素特别有用（因为其中心点不容易计算），但也可以用作 `transform:\
  \ translate(x y)` 语法更直观的替代方案。SvJs 还提供了一个相关的 `getCentre()` 方法（`moveTo()` 方法内部也使用了该方法），用于获取元素的中心坐标，返回一个包含\
  \ `x` 和 `y` 属性的 `object`。当你想将一个元素放置在另一个元素内部时，这非常有用。\n\n循环之后，按如下方式调用 `moveTo()` 方法：\n\
  \n```\n// 将网格居中于 viewBox 内。\ngrid.moveTo(500, 500);\n```\n\n现在网格应该与我们 `viewBox`\
  \ 的中心完美对齐，如图 4-4 所示。\n\n![](img/538894_1_En_4_Fig4_HTML.png)\n\n一幅抽象图，展示了一个由 225\
  \ 个正方形组成的网格状图案，背景为深色。\n\n**图 4-4** 一个居中且规则的网格\n\n### 更灵活的网格\n\n到目前为止，我们已经硬编码了网格的值。我的意思是，我们直接使用值来控制网格的划分、单元格间距、大小等，而不是使用包含值的变量。后一种方法提供了更大的灵活性。\n\
  \n在我们的 `for` 循环之前，设置并初始化以下变量。我们将使用的值将反映我们已经创建的网格；稍后我们会更改它们。\n\n```\n// 设置一些与网格相关的变量。\n\
  let gridSize = 700;\nlet rows = 15;\nlet spacing = 5;\n```\n\n接下来我们需要的是控制循环增量值和每个单元格大小的变量。然而，这些值应该从我们之前设置的那些值中*推导*出来，而不是每次想要更改网格时都重新计算。通过一点基本的数学运算，以下是实现方法：\n\
  \n\n```javascript\nlet increment = gridSize / rows;\nlet cellSize = Math.abs(increment\
  \ - spacing);\n```\n\n`Math.abs()` 函数可确保 `cellSize` 始终为正值，从而避免在调整 `rows` 和 `spacing`\
  \ 值时出现错误。接下来，我们需要将这些值整合到循环中，按如下方式调整：\n\n```javascript\nfor (let y = 0; y < gridSize;\
  \ y += increment) {\n  for (let x = 0; x < gridSize; x += increment) {\n    grid.create('rect').set({\n\
  \      x: x, y: y, width: cellSize, height: cellSize,\n      fill: 'none', stroke:\
  \ '#eee',\n    });\n  }\n}\n```\n\n现在，我们可以自由调整网格变量，循环也会相应地做出响应。我们甚至可以将其随机化，每次刷新时获得不同的网格（如图\
  \ 4-5 所示）。\n\n![图 4-5](img/538894_1_En_4_Fig5_HTML.png)\n\n一幅抽象图展示了三种不同的网格状图案。左侧是一个三行三列的网格。中间是一个由方形簇构成的网格。右侧是一个六行六列的网格。\n\
  \n**图 4-5** 规则网格的变体\n\n```javascript\nlet gridSize = Gen.random(400, 800);\nlet\
  \ rows = Gen.random(2, 20);\nlet spacing = Gen.random(5, 10);\n```\n\n## 裁剪路径与调色板\n\
  \n现在我们已经有了规则网格，接下来需要为其注入活力。这一改动足够大，值得为草图创建一个新迭代。如果你希望将当前工作保存为模板，请保存并复制现有草图文件夹，将其重命名为类似\
  \ `08-colourful-grids` 的名字，这样你就能清楚接下来的工作内容。\n\n### 颜色数组\n\n在之前的“元素无处不在”草图中，我们使用\
  \ `Gen.random()` 来即时生成颜色。但如果我们希望使用特定的调色板，或者一组调色板，以便随机选择呢？\n\n一种常见的方法是将预先选定的调色板存储为颜色值数组，如下所示：\n\
  \n```javascript\n// 创建一个调色板。\nlet palette = ['#5465FF', '#788BFF', '#9BB1FF', '#BFD7FF',\
  \ '#E2FDFF'];\n```\n\n网络上有很多网站（不胜枚举）可以为你提供调色板灵感。事实上，你可能会发现很难只选定一个调色板。在这种情况下，更合理的方式是保存多个调色板，并将它们作为数组存储在另一个数组中。这样，它们就变成了嵌套数组，即包含在其他数组中的数组。你也可以称它们为二维或多维数组。\n\
  \n让我们创建一个包含三个调色板的二维数组（如图 4-6 所示）。在定义初始网格组的下方，包含以下代码（如果你愿意，也可以替换成自己的调色板）：\n\n![图\
  \ 4-6](img/538894_1_En_4_Fig6_HTML.png)\n\n一幅抽象图展示了三行，每行有五个矩形，分别使用三种不同的调色板，背景为深色。\n\
  \n**图 4-6** 我们的三个调色板\n\n```javascript\n// 创建我们的调色板。\nlet palettes = [\n  ['#5465FF',\
  \ '#788BFF', '#9BB1FF', '#BFD7FF', '#E2FDFF'],\n  ['#22577A', '#38A3A5', '#57CC99',\
  \ '#80ED99', '#C7f9CC'],\n  ['#4C5760', '#93A8AC', '#D7CEB2', '#A59E8C', '#66635B']\n\
  ];\n```\n\n接下来，我们将随机选择一个调色板，并将其存储在一个变量中，以便稍后调用。\n\n```javascript\n// 随机选择一个调色板。\n\
  let pickedPalette = Gen.random(palettes);\n```\n\n现在来看网格变量。你可以保留上一次草图时的设置，但这次我不会将\
  \ `gridSize` 或 `spacing` 随机化，因为我希望将重点放在草图中其他随机化元素上。\n\n```javascript\nlet gridSize\
  \ = 600;\nlet rows = Gen.random(3, 10);\nlet spacing = 10;\nlet increment = gridSize\
  \ / rows;\nlet cellSize = Math.abs(increment - spacing);\n```\n\n### 裁剪内容\n\n开发基于网格的组合的下一步将涉及一个名为\
  \ `clipPath` 的概念。本质上，`clipPath` 的作用是定义它所应用到的形状的可见区域，就像剪刀定义纸板剪影一样。\n\n我们不会使用方形来定义网格单元格，而是使用一个方形的\
  \ `clipPath`。这样，我们就可以容纳单元格的内容，而不会让它们溢出到相邻单元格中。让我们暂时退一步来说明这一点。在图 4-7 中，我们有一个方形的 `rect`\
  \ 定义了 `clipPath`，而 `circle` 是被裁剪的元素。在右侧，你可以看到将 `clipPath` 应用于 `circle` 的效果。\n\n\
  ![图 4-7](img/538894_1_En_4_Fig7_HTML.png)\n\n一幅抽象图左侧显示一个方形与一个阴影圆形重叠，该圆形被转换为半圆形，背景为深色。\n\
  \n**图 4-7** `clipPath` 的工作原理\n\n一个 `clipPath` 需要一个 `id` 以便稍后引用。嵌套在 `clipPath` 元素内部的是实际执行“裁剪”的形状或路径。以下是如何创建图\
  \ 4-7 中半圆形的示例方法。\n\n```javascript\n// 使用 id 初始化 clipPath。\nlet clip = svg.create('clipPath').set({\
  \ id: 'clip1' });\n// 创建 clipPath 的形状。\nclip.create('rect').set({\n  x: 0, y: 0,\
  \ width: 100, height: 100, stroke: '#fff'\n});\n// 通过调用其 id 将其应用于圆形。\nsvg.create('circle').set({\n\
  \  cx: 100, cy: 50, r: 50, fill: '#80ffe6', clip_path: 'url(#clip1)'\n});\n```\n\
  \n如你所见，`clipPath` 通过其 `id` 被调用，被视为内部 `url` 引用，这与渐变和图案非常相似。现在让我们回到草图，在循环内应用相同的逻辑。首先，像之前一样创建嵌套循环：\n\
  \n```javascript\nfor (let y = 0; y < gridSize; y += increment) {\n  for (let x =\
  \ 0; x < gridSize; x += increment) {\n  }\n}\n```\n\n接下来，创建 `clipPath`。我们需要为每个实例创建一个唯一的\
  \ `id`，因此我们不能像之前那样传入静态字符串——否则 `id` 会在每次循环迭代时重复。相反，我们可以使用 `x` 和 `y` 迭代变量，利用模板字面量语法生成动态字符串，如下所示：\n\
  \n```javascript\n// 使用唯一 id 创建裁剪路径。\nlet clip = svg.create('clipPath').set({ id:\
  \ `${x}${y}` });\n```\n\n现在我们可以创建 `clipPath` 的实际形状。为了保持简单，我们将其设为方形，即一个宽度和高度等于 `cellSize`\
  \ 的 `rect`。\n\n```javascript\n// 创建裁剪路径形状。\nclip.create('rect').set({\n  x: x, y:\
  \ y, width: cellSize, height: cellSize\n});\n```\n\n有了 `clipPath` 之后，我们需要决定里面放什么内容。这里是我们发挥创意的空间！每个单元格有四个角，所以我们要做的是随机将一组圆形以这四个位置中的任何一个为中心。这些位置的坐标由当前的\
  \ `x` 和 `y` 值以及 `cellSize` 决定。以下是我们如何计算这些位置并随机选择其中一个的方法：\n\n```javascript\n// 定义可能的位置。\n\
  let positions = [\n  [x, y],                     // 左上角\n  [x + cellSize, y],  \
  \        // 右上角\n  [x + cellSize, y + cellSize], // 右下角\n  [x, y + cellSize]   \
  \        // 左下角\n];\n// 随机选择一个位置。\nlet pickedPosition = Gen.random(positions);\n\
  ```\n\n现在，创建 `circle` 组。这将涉及第三个循环（即循环中的循环中的循环——如果你愿意，可以称之为无限套娃循环），我们将创建五个从随机选择的中心点向外辐射的圆形。别忘了我们之前选取的调色板；每个圆形的填充颜色将相应地着色。\n\
  \n\n```markdown\n\n```\n// 为我们的圆创建一个组。\nlet circles = grid.create('g');\n// 创建圆，应用选定的位置和调色板。\n\
  for (let i = 0; i < 5; i += 1) {\ncircles.create('circle').set({\ncx: pickedPosition[0],\n\
  cy: pickedPosition[1],\nr: cellSize - (i * (cellSize / 5)), // 这里稍微调整了一下\nfill:\
  \ pickedPalette[i]\n});\n}\n```\n\n我们还有几个步骤要走。实际上我们还没有将 `clipPath` *应用*到任何东西上，所以如果我们现在运行草图，只会看到一堆相当杂乱的圆重叠在一起。我们将通过将\
  \ `clipPath` 应用于圆组（而不是圆本身）来解决这个问题。作为循环内的最后一步，我们将创建一个方形边框来框住每个单元格，只是为了给图形增加一点轮廓感。\n\
  \n```\n// 将裁剪路径应用于圆组。\ncircles.set({\nclip_path: `url(#${clip.get('id')})`\n});\n\
  // 创建一个方形来框住单元格。\ngrid.create('rect').set({\nx: x, y: y, width: cellSize, height:\
  \ cellSize,\nfill: 'none', stroke: '#eee',\n});\n```\n\n现在，在循环之外，像我们之前所做的那样将网格居中。\n\
  \n```\n// 将网格在 viewBox 内居中。\ngrid.moveTo(500, 500);\n```\n\n瞧！你现在应该会看到一些类似于图 4-8\
  \ 中的变体。（顺便说一句，如果你发现网格没有始终正确居中，那是因为网格的边界框包含了不可见的裁剪内容，而这些内容并不总是围绕网格对称排列。）\n\n![](img/538894_1_En_4_Fig8_HTML.png)\n\
  \n一幅抽象图展示了三个网格状图案。每个网格有一簇方块，其中包含在不同位置的裁剪后的同心圆，背景为深色。\n\n**图 4-8** 色彩丰富的裁剪路径网格图案\n\
  \n## 选择与机会\n\n如果我们在选择是否填充网格中的某个单元格时引入一个机会元素，会怎么样呢？这可以产生一种看起来不那么死板的构图——这不一定是更好的，但它可以在多样性方面提供更多可能。\n\
  \n### SvJs 的 `Gen.chance()` 函数\n\n当我们谈论概率时，通常试图确定的是某事发生的可能性或几率。这件事要么发生要么不发生，所以我们想要的是一个二元响应——或布尔值——来告诉我们“是”或“否”，“赢”或“输”。今天你的马“维克托·矢量”会在比赛中让你赢钱吗？鉴于赔率是\
  \ 7 比 2，获胜的几率是 22%（2 / (7 + 2) × 100 = 22.22）。\n\n我们如何将这种逻辑应用到构图中呢？使用纯 JavaScript\
  \ 和 `Math.random()` 其实相当简单，但 SvJs 通过其 `Gen.chance()` 函数提供了一种更直观、更简洁的替代方案。\n\n默认情况下（即，不带任何参数），`Gen.chance()`\
  \ 基于 50/50 或 50% 的概率返回 `true` 或 `false`。如果我们提供一个参数，它将被解释为一个百分比。\n\n```\n// 以下代码有\
  \ 60% 的概率返回 true。\nGen.chance(60);\n```\n\n如果提供两个数字，则参数被解释为赔率。如果你更倾向于像在博彩公司下注那样思考概率，而不是计算精确的百分比值（这在底层实际上已为你计算好），这会很有用。\n\
  \n```\n// 有 7 比 2 的概率返回 true。\nGen.chance(7, 2);\n```\n\n### 实际应用中的机会\n\n让我们创建一个新草图，使用\
  \ `Gen.chance()` 来决定网格内的单元格是否被填充内容。复制 `08-colourful-grids` 文件夹并将其重命名为 `09-chance`，然后删除内层循环中的所有内容（留给你一个空的嵌套\
  \ `for` 循环）。接下来，将 `palettes` 数组和 `pickedPalette` 变量替换为一个随机生成的 `hue`（色相）。\n\n```\n\
  // 选择一个随机色相。\nlet hue = Gen.random(0, 360);\n```\n\n你可以保持与网格相关的变量不变，或者根据自己的喜好调整它们。接下来，*在*\
  \ `x` 和 `y` 循环*之间*（即在第一个循环内，但在第二个循环之前），像这样增加 `hue`：\n\n```\n// 一个创建网格的嵌套循环。\nfor\
  \ (let y = 0; y < gridSize; y += increment) {\n    // 更新色相，使其不会超出 [0, 360] 的范围。\n\
  \    hue = (hue >= 360) ? (hue - 360) + (120 / rows) : hue + (120 / rows);\n   \
  \ for (let x = 0; x < gridSize; x += increment) {\n    ...\n```\n\n这看起来可能是一种过于复杂的增加\
  \ `hue` 值的方法，但实际上它只做了两件事：首先，确保 `hue` 值不会超出边界（即超过 `360`）；其次，根据行数相对增加 `hue` 值。这样做的目的是，行数较少的草图变体具有较高的增量值，而行数较多的变体具有较低的增量值，从而使整体色彩更加一致。\n\
  \n在 `x` 循环内部，我们将实际使用 `Gen.chance()`。将其用作 `if` 语句中的一个条件，我们可以根据它返回的结果有条件地触发第三个循环。这个循环会在每个单元格内创建随机的\
  \ `line` 元素，但仅当该单元格被 `Gen.chance()` 函数激活时才创建。我们将实际概率设置为 60%。\n\n```\n// 基于概率运行循环。\n\
  if (Gen.chance(60)) {\n    for (let i = 0; i < cellSize; i += 1) {\n        grid.create('line').set({\n\
  \            x1: Gen.random(x, x + cellSize),\n            y1: Gen.random(y, y +\
  \ cellSize),\n            x2: Gen.random(x, x + cellSize),\n            y2: Gen.random(y,\
  \ y + cellSize),\n            stroke: `hsl(${hue} 80% 80% / 0.33)`\n        });\n\
  \    }\n}\n```\n\n这应该会产生渐变的俄罗斯方块式排列，类似于图 4-9。\n\n![](img/538894_1_En_4_Fig9_HTML.png)\n\
  \n一幅抽象图展示了渐变的俄罗斯方块式排列，背景为深色。\n\n**图 4-9** 实际应用中的 `Gen.chance()`\n\n## 概率分布\n\n概率分布描述了数字在给定范围内如何分布（或散布）。除非你以某种形式学习过统计学，否则你可能对这个术语不太熟悉。如果仅仅提到统计就让你冷汗直流，别担心——我们不会深入探讨底层数学。实际上我们已经在使用一种特定的概率分布，只是没有给它命名而已。\n\
  \n### 均匀分布\n\n`Gen.random()` 函数是*均匀*分布的一个例子，其中范围内的每个数字被选中的机会均等。换句话说，`Gen.random()`\
  \ 函数（或者其基础的 `Math.random()`）中不存在任何隐藏的偏差或趋势，会使范围内的某个特定数字子集更有可能被选中。\n\n在图 4-10 中，我们可以看到均匀分布表现为\
  \ 1000 条垂直线的 `x` 坐标变化。这些线分散在各处，出现在 x 轴上任何位置的机会均等。\n\n![](img/538894_1_En_4_Fig10_HTML.png)\n\
  \n一幅抽象图展示了一个矩形结构，其中有多条不同尺寸的明亮线条呈线性排列，背景为深色。\n\n**图 4-10** 垂直线的均匀分布\n\n### 高斯分布\n\
  \n在现实生活的测量中（即那些在二进制 0 和 1 世界之外的测量），均匀分布实际上并不常见。更常见的是所谓的*高斯*分布，其中大多数值聚集在一个中点附近，并在该点两侧逐渐减少。它也被称为正态分布，当绘制成图表时，会形成一条钟形曲线。可视化为一系列垂直线时，它看起来像图\
  \ 4-11。\n\n![](img/538894_1_En_4_Fig11_HTML.png)\n\n一幅抽象图展示了一个矩形结构，其中有多条不同粗细的高亮线条呈线性排列，背景为深色。\n\
  \n**图 4-11** 垂直线的正态分布\n\n大多数值聚集的中点被称为均值，而它们偏离该均值的程度被称为西格玛（sigma）或标准差。\n\n```\n\n\
  \n`SvJs`带有一个名为`Gen.gaussian()`的函数，该函数返回一个符合高斯分布的随机数。在没有参数的情况下，它将返回大约介于 -3 和 +3 之间的值，均值为\
  \ 0，标准差为 1。这在实际应用中意味着：\n\n- 68% 的值将落在 -1 和 1 之间（标准差范围内）\n- 95% 的值将落在 -2 和 2 之间\n\
  - 99% 的值将落在 -3 和 3 之间\n\n通过向`Gen.gaussian()`提供参数，我们可以修改均值和标准差。\n\n```javascript\n\
  // 将均值和标准差分别调整为 10 和 2。\nGen.gaussian(10, 2);\n```\n\n在前面的例子中，将均值调整为 10，标准差调整为 2，这意味着\
  \ 68% 的值将落在均值两侧的 -2 到 +2 范围内（即 8 到 12 之间），95% 的值落在 6 到 14 之间，超过 99% 的值落在 4 到 16\
  \ 之间。严格来说，高斯分布的值是无界的，因此偶尔可能会出现极端异常值。例如，如果您希望将结果限制在标准差三倍范围内，则可以使用`Gen.constrain()`函数来约束结果，如下所示：\n\
  \n```javascript\n// 将 Gen.gaussian()的结果限制在 -3 到 +3 之间。\nlet gaussian = Gen.gaussian(0,\
  \ 1);\nlet constrainedGaussian = Gen.constrain(gaussian, -3, 3);\n```\n\n接下来，让我们快速创建一个草图，演示如何使用`Gen.gaussian()`返回的结果将`x`和`y`坐标映射到我们的`viewBox`上。复制我们的模板并将其命名为`10-gaussian-dist`。像往常一样，在背景下方，初始化一个循环，该循环将运行\
  \ 10,000 次（是的，很多！），并在其内部生成一对高斯坐标。\n\n```javascript\n// 运行一个循环 10000 次。\nfor (let\
  \ i = 0; i < 10000; i += 1) {\n    // 生成具有高斯分布的 x 和 y 坐标。\n    let gaussianX = Gen.gaussian(500,\
  \ 150);\n    let gaussianY = Gen.gaussian(500, 150);\n}\n```\n\n这些坐标围绕`viewBox`的中心（即\
  \ 500）分布，标准差为 150。接下来，仍然在循环内，创建我们的线条，将它们基于高斯坐标，并为其端点添加一些随机化。\n\n```javascript\n\
  // 基于高斯坐标创建线条。\nsvg.create('line').set({\n    x1: gaussianX,\n    y1: gaussianY,\n\
  \    x2: gaussianX + Gen.random(-10, 10),\n    y2: gaussianY + Gen.random(-10, 10),\n\
  \    stroke: `hsl(${Gen.random(150, 270)} 80% 80% / 0.8)`\n});\n```\n\n您可以在此处停止，观察生成的圆形图案，但我添加了另一个小循环（在第一个循环之后，而不是在其内部），通过一系列渐隐的圆形描边来微妙地强调分布的形状。\n\
  \n```javascript\n// 创建一系列圆形来框定分布。\nfor (let i = 0; i < 10; i += 1) {\n    svg.create('circle').set({\n\
  \        cx: 500, cy: 500, r: 25 + (i * 25), fill: 'none',\n        stroke: `hsl(0\
  \ 0% 0% / ${0.25 - (i / 50)})`, stroke_width: 15\n    });\n}\n```\n\n之后，您应该会得到类似于图\
  \ 4-12 的结果。\n\n![一个抽象画面，中心呈现一簇高亮的小线条，背景为深色。](img/538894_1_En_4_Fig12_HTML.png)\n\
  \n**图 4-12**  \n使用`Gen.gaussian`定位 10,000 条线条\n\n就生成的标记而言，与我们之前所做的任何事情相比，这是一个相当沉重的部分（10,000\
  \ 个元素会做到这一点）。这可能会对渲染性能产生负面影响，并且如果您从 HTML 中复制它，也会意味着一个更大的 SVG 文件。一个简单的减小尺寸的方法是，在每次调用`Gen.gaussian()`函数时将第三个参数设置为`false`。与`Gen.random()`一样，`Gen.gaussian()`接受第三个参数，该参数决定它是返回浮点数（更精确但有很多位）还是整数（整数）。在这种情况下，使用整数处理可以将生成的标记量减少大约一半。\n\
  \n### 帕累托分布\n\n帕累托分布，也称为帕累托原则或 80-20 规则（如图 4-13 所示），是我们将介绍的最后一个概率模式。它以一位意大利经济学家的名字命名，他有一个著名的观察：社会\
  \ 20% 的人口控制着 80% 的财富。这发生在 19 世纪 90 年代，所以如果帕累托在今天做出同样的观察，我们可能正在讨论 99-1 规则！尽管如此，其基本思想保持不变：少数拥有多数，多数拥有少数。\n\
  \n![一个抽象画面，呈现一个矩形结构，其中包含随机排列的不同粗细的高亮线条，背景为深色。](img/538894_1_En_4_Fig13_HTML.png)\n\
  \n**图 4-13**  \n垂直线的帕累托分布\n\n这在生成艺术中可用于实现不同大小元素之间的平衡。我们将在下一个草图中使用它来创建一个名为“波尔图·帕累托”的伪城市天际线，其中城市建筑的大小将使用\
  \ SvJs 的`Gen.pareto()`函数进行变化。此函数接受两个参数；第一个参数定义要返回的范围内的最小值，第二个参数定义此数字是浮点数还是整数。\n\n\
  ```javascript\n// 返回一个帕累托分布的整数，不小于 20。\nGen.pareto(20, false);\n// -> 32\n```\n\n\
  复制模板文件夹并将其命名为`11-porto-pareto`，然后在背景下方创建一个包含我们城市天际线的组。\n\n```javascript\n// 为我们的生成城市创建一个组。\n\
  let portoPareto = svg.create('g');\n```\n\n城市天际线将包含三个主要元素：天空、河流（或港口）和建筑物。天空和河流都将是带有渐变的简单`rect`元素；我们将首先创建它们。\n\
  \n```javascript\n// 创建天空渐变。\nsvg.createGradient('sky', 'linear', ['#f58b10', '#d21263',\
  \ '#940c5e', '#25226c'], 90);\n// 创建天空并应用渐变。\nportoPareto.create('rect').set({\n\
  \    x: 150, y: 150, width: 700, height: 400, fill: 'url(#sky)'\n});\n// 创建河流渐变。\n\
  svg.createGradient('river', 'linear', ['#80e5ff10', '#70b566'], 90);\n// 创建河流并应用渐变。\n\
  portoPareto.create('rect').set({\n    x: 150, y: 555, width: 700, height: 295, fill:\
  \ 'url(#river)'\n});\n```\n\n希望上述内容不会让您感到意外。接下来，我们将进行一些帕累托分布并创建我们的建筑物。在下面的循环中，有一行代码我特别想解释一下，就是使用`Gen.constrain()`函数设置高度的部分。没有它，我们的帕累托分布将生成一些高得令人眩晕的建筑物，远远超出画布的限制。然而，单独使用带有固定上限的`Gen.constrain()`会导致最高建筑物出现截断效果，因此为了平衡这一点，我添加了一个`Gen.random()`函数来变化上限。\n\
  \n```javascript\n// 我们生成城市天际线的循环。\nfor (let i = 0; i < 60; i += 1) {\n    // 获取最小高度为\
  \ 20 的帕累托分布。\n    let pareto = Gen.pareto(20);\n    // 约束高度，并稍微随机化上限。\n    let height\
  \ = Gen.constrain(pareto, 20, Gen.random(150, 200));\n    // 创建我们的建筑物。\n    portoPareto.create('line').set({\n\
  \        x1: 150 + (i * 12), y1: 550,\n        x2: 150 + (i * 12), y2: 550 - height,\n\
  \        stroke: '#181818', stroke_width: 8\n    });\n}\n```\n\n我们现在已经有了城市天际线，但尚未完成。它看起来相当扁平，我希望它能被框在一个圆形内，并且颜色看起来像是向外散发。为了实现这一点，我将使用一种叫做`mask`的东西。\n\
  \n\n\n## 遮罩你的内容\n\n`mask`（遮罩）与`clipPath`（裁剪路径）非常相似，区别在于它允许不同程度的透明度。`clipPath`是一种全有或全无的方式：你要么位于定义其形状的边界内部，要么在外部。而使用`mask`，你可以根据形状的亮度或明度来淡入或淡出内容。因此，在创建遮罩时，最直接的方式是使用黑白两色。白色（`#ffffff`）对应完全透明的区域，而黑色（`#000000`）则对应完全不透明的区域。\n\
  \n在图 4-14 中，三角形是`mask`的形状，将其应用于`rect`后的结果显示在右侧。\n\n![](img/538894_1_En_4_Fig14_HTML.png)\n\
  \n一张示意图展示了一个带有阴影的方形，它被添加到一个单色三角形上，最终生成一个具有与方形阴影相似的渐变色的三角形，背景为深色。\n\n**图 4-14** \
  \ \n遮罩的工作原理\n\n与`clipPath`类似，`mask`元素需要一个`id`，并通过指向此`id`的 URL 引用将其应用于另一个元素。我们要做的是创建一个带有`circle`形状的遮罩，这个`circle`的填充将包含一个径向渐变。然后，我们将它应用于之前创建的`portoPareto`组。\n\
  \n```\n// 创建一个径向渐变。\nsvg.createGradient('radialGrad', 'radial', ['#ffffff', '#ffffff60']);\n\
  // 创建一个遮罩，并在其内部创建一个带有径向渐变的圆形。\nlet mask = svg.create('mask').set({ id: 'mask' });\n\
  mask.create('circle').set({\ncx: 500, cy: 500, r: 325, fill: 'url(#radialGrad)',\n\
  });\n// 将遮罩应用于该组。\nportoPareto.set({ mask: 'url(#mask)' });\n```\n\n现在你应该能看到城市景观被裁切成了这个圆形的形状，并且边缘略微淡出。作为最后一步，我添加了一个带渐变的圆形描边，以便更清晰地勾勒出内容。\n\
  \n```\n// 为我们的圆形边框创建一个线性渐变。\nsvg.createGradient('strokeGrad', 'linear', ['#eeeeee',\
  \ '#eeeeee15']);\n// 创建边框并应用渐变。\nsvg.create('circle').set({\ncx: 500, cy: 500, r:\
  \ 345, fill: 'none',\nstroke: 'url(#strokeGrad)', stroke_width: 2.5\n});\n```\n\n\
  结果的一个变体显示在图 4-15 中。\n\n![](img/538894_1_En_4_Fig15_HTML.png)\n\n一张示意图展示了一个高亮的圆形，内部有若干垂直条，周围环绕着渐变色，背景为深色。\n\
  \n**图 4-15**  \n我们的波尔图帕累托城市景观\n\n## 本章小结\n\n在本章中，我们涵盖了以下内容：\n\n-   坐标、颜色、元素尺寸等的随机化\n\
  -   如何从一维和二维数组中随机选取项目\n-   使用嵌套`for`循环构建规则网格\n-   如何使用`clipPaths`和遮罩\n-   利用偶然性作为触发元素创建的方法\n\
  -   如何使用高斯和帕累托概率分布\n\n在下一章中，我们将学习如何使用噪声（noise）为我们的构图增加一种更有机的随机性。\n\n"
- "# 5. 对噪声的需求\n\n在本章中，我们将讨论到目前为止所使用的随机函数的局限性，以及如何通过使用 SvJs 的`Noise`模块来克服这些局限性。我们将探讨什么是噪声及其用途，在本章结束时，我们将在生成式创作的武库中增添一项重要的技术。\n\
  \n## 随机函数的局限\n\n有时，随机性就是过于……嗯，随机。即使我们使用概率分布来塑造随机化值，并将它们约束在结构化模式中，连续值之间的差异也总是带有那种标志性的“断奏”感。换句话说，当并排比较时，这些值总会有一些跳跃和抖动。你不会看到一个值到另一个值的平滑过渡。\n\
  \n别误会我的意思——这通常正是我们想要的，也是随机函数的设计初衷。但是，仅靠随机性很难创造出任何具有有机质感的作品。为此，我们需要噪声。\n\n\n\n##\
  \ 制造噪点\n\n1997 年，肯·佩林荣获奥斯卡奖。这一奖项之所以史无前例，是因为佩林既非演员、导演，也非配乐师，而是一名程序员。为 1982 年上映的电影《创》开发能够让\
  \ 3D 物体看起来更自然的程序化纹理（即有机质感）时，佩林设计出的算法被命名为**佩林噪声**，此后该算法在计算机图形学领域变得无处不在。\n\n你可以在 GIMP、Photoshop\
  \ 等图像编辑器，Inkscape、Illustrator 等矢量编辑器，Blender 等 3D 图形软件包，以及历年来无数视频游戏中找到其实现。Minecraft\
  \ 就是绝佳范例：那些玩家开采资源的无限块状地形，正是利用佩林噪声生成的高度图来决定其起伏变化的。\n\n因此，佩林噪声在图形领域无处不在。但它究竟是什么？\n\
  \n## 噪声解析\n\n从技术上讲，噪声函数确实会产生随机数，但其生成方式具有平滑有序的特点——这正是关键所在。在图 5-1 中，白线的高度通过佩林噪声变量随机化处理。这是一维噪声的示例，即仅沿单轴操作的噪声值。\n\
  \n![](img/538894_1_En_5_Fig1_HTML.png)\n\n抽象图中呈现出一个矩形结构，其内部排列着不同尺寸的明亮线条簇，在深色背景上形成波浪图案。\n\
  \n**图 5-1.** 佩林噪声值的一维表示\n\n噪声本质上是多维的；佩林最初为其三维空间设计，如今也存在四维实现。但由于 SVG 是二维媒介，我将坚持使用`x`和`y`轴。佩林开发的特定算法通过在给定区域以渐变方式混合随机化值来实现效果。这个区域或空间更多是概念性的而非实体；噪声值并非存在于实际平面或独立画布上，而是存在于一个我们可以从中检索值的抽象（且无限）空间中。\n\
  \n例如，在概念坐标`(15, 20)`处获取噪声值会得到介于`-1`和`1`之间的某个值。当我们缓慢遍历此噪声空间到达相邻坐标如`(16, 21)`时，会获得一系列可供使用的平滑变化值。正是我们能利用这些值做什么，使得噪声在审美层面变得有趣。\n\
  \n在图 5-2 中，我们可以看到噪声使用整个画布区域以二维形式呈现。此示例实际上基于像素而非矢量，选择它或许是因为这是直观理解噪声空间概念的最佳方式。在此图中，每个像素的\
  \ alpha 分量根据相应的噪声值变化，形成云朵状结构。你立刻就能明白它为何对创建纹理如此有用。\n\n![](img/538894_1_En_5_Fig2_HTML.png)\n\
  \n抽象图中呈现出一个方形结构，带有云朵状形态，背景为深色。\n\n**图 5-2.** 佩林噪声值的二维表示\n\n## SvJs 噪声模块\n\nSvJs\
  \ 库自带噪声实现，设计目标为使用简便且占用空间尽可能小。它位于独立模块中，因此与`Gen`模块类似，使用前需要先导入。\n\n```javascript\n\
  import { Noise } from '../../node_modules/svjs/src/index.js';\n```\n\n与作为函数集合的`Gen`不同，`Noise`模块基于类实现，因此我们需要先实例化它。\n\
  \n```javascript\n// 创建 Noise 类的实例。\nlet noise = new Noise();\n```\n\n该类包含一个名为`get()`的方法，该方法接受`x`坐标和可选的`y`坐标作为参数，并返回噪声空间中该点的值。\n\
  \n```javascript\nlet noiseValue = noise.get(noiseX, noiseY);\n```\n\n静态的`noiseValue`对我们用处不大；我们需要通过遍历噪声空间来逐渐修改它。我们通过递增`noiseX`和/或`noiseY`坐标来实现。以下是在循环中的实现方式：\n\
  \n```javascript\n// 首先初始化噪声实例和噪声坐标。\nlet noise = new Noise();\nlet noiseX = 15,\
  \ noiseY = 20;\n\n// 运行循环，缓慢递增坐标以修改值。\nfor (let i = 0; i < 1000; i += 1) {\n  let\
  \ noiseValue = noise.get(noiseX, noiseY);\n  // ... 对 noiseValue 进行处理\n  noiseX\
  \ += 0.003;\n  noiseY += 0.003;\n}\n```\n\n如你所见，我们在循环外定义了初始的`noiseX`和`noiseY`坐标，在循环内使用它们获取`noiseValue`，然后在下次循环运行前以极小的增量递增坐标。这个增量我们可以称之为噪声速度或变化率。在处理噪声时，保持变化率极小非常重要；相对较大的跳跃（例如整数值）不会产生可用结果。\n\
  \n## 进入噪声矩阵\n\n让我们复制模板并创建一个名为`12-noise-matrix`的新草图文件夹，以展示噪声如何用于改变网格内的颜色值。在`sketch.js`文件顶部，将`Noise`模块添加到导入语句中：\n\
  \n```javascript\nimport { SvJs, Gen, Noise } from '../../node_modules/svjs/src/index.js';\n\
  ```\n\n接下来，我们将缩短计算`svgSize`（以及`viewport`尺寸）的表达式。实际上，我们可以使用`Math.min()`函数替代三元运算符，该函数返回两个或多个值中的最小值。如果你还记得，我们只想将`svgSize`设置为窗口`innerWidth`或`innerHeight`中的最小值，而`Math.min()`以最简洁的方式实现了这一点。这无疑是个小调整，但暗示了\
  \ JavaScript 内置`Math`模块的多种用途。\n\n```javascript\nconst svgSize = Math.min(window.innerWidth,\
  \ window.innerHeight);\n```\n\n我建议也将此调整应用到我们的基础模板中。\n\n### 充满噪声的网格\n\n对于这个构图，我们将采用熟悉的技术：建立网格，该网格将充当我们的矩阵（毕竟矩阵只是值的网格）。此草图中创建的矩阵将模仿同名电影中的矩阵。我们将在网格中填充\
  \ 1 和 0，这些数字的颜色将由噪声调制，以实现那种层叠、去饱和的效果。\n\n创建噪声类的实例，然后初始化另外三个变量。其中两个将处理噪声的`x`和`y`坐标，第三个将存储决定噪声坐标递增速率的噪声速度。\n\
  \n```javascript\n// 创建噪声对象、噪声 x、y 坐标以及噪声速度。\nlet noise = new Noise();\nlet nX =\
  \ 0, nY = 0;\nlet noiseSpeed = 0.5;\n```\n\n下一段代码应该看起来似曾相识。我们正在设置一些与网格相关的变量，这次我们将省略之前草图中使用的`spacing`和`cellSize`变量，并将`gridSize`设置为覆盖整个`viewBox`。\n\
  \n```javascript\n// 设置一些网格相关变量。\nlet noiseGrid = svg.create('g');\nlet gridSize\
  \ = 1000;\nlet rows = 80;\nlet increment = gridSize / rows;\n```\n\n接下来是我们的循环。我们将从`x`坐标开始外循环，而不是`y`坐标。这样做的效果是从上到下、从左到右构建网格。换言之，我们将先填充列而非行，这将使我们的噪声值以向下流动的方式传播。\n\
  \n在循环内部，我们将使用`noise.get()`方法获取噪声值，并传入我们之前初始化的`nX`和`nY`值。\n\n```javascript\n// 创建噪声矩阵。\n\
  for (let x = 0; x < gridSize; x += increment) {\n  for (let y = 0; y < gridSize;\
  \ y += increment) {\n    // 获取噪声值。\n    let noiseValue = noise.get(nX, nY);\n  }\n\
  }\n```\n\n\n\n接下来，我们创建实际的文本内容。我们需要一系列 0 和 1 来填充网格，每个数字被选中的概率均为 50%。正如上一章所学，结合三元运算符使用\
  \ `Gen.chance()` 函数是最简单的方法。\n\n```\n// 创建显示 0 或 1 的文本（各 50% 概率）。\nlet text = noiseGrid.create('text');\n\
  text.content(Gen.chance() ? '1' : '0');\n```\n\n现在，我们需要根据 `x` 和 `y` 循环迭代器的值设置数字的位置，并使用\
  \ `noiseValue` 变量设置填充颜色的强度（即 `hsl()` 函数中的亮度分量）。同时，我们还应设置字体大小和字体系列。\n\n```\ntext.set({\n\
  x: x, y: y,\nfont_size: 16,\nfont_family: 'serif',\nfill: `hsl(120 20% ${noiseValue}%)`\n\
  });\n```\n\n在结束循环之前，我们需要用 `noiseSpeed` 变量递增 `nX` 和 `nY` 的值。\n\n```\nnX += noiseSpeed;\n\
  nY += noiseSpeed;\n```\n\n为了完成草图，在循环外部调用 `moveTo()` 函数，将网格移至画布中心。\n\n```\n// 将网格置于\
  \ viewBox 中心。\nnoiseGrid.moveTo(500, 500);\n```\n\n现在，当你运行草图时，应该会看到一个由 0 和 1 组成的网格。但……它们全都是黑色的。即使我们使用了\
  \ `noiseValue` 来修改颜色亮度，它并没有发生可见的变化。这是怎么回事呢？\n\n如果你在浏览器控制台中检查一些 `text` 元素，会看到类似如下内容：\n\
  \n```\n\n```\n\n这里需要注意的是，当我们调用 `noise.get()` 方法时，返回的值是一个介于 -1 到 1 之间的浮点数（偶尔会有异常值）。然而，`hsl()`\
  \ 函数中的亮度分量取值范围应为 0 到 100%，因此未经处理的状态下，噪点值在此处并不实用。我们该如何解决这个问题？难道不能直接将其乘以 100 吗？可以这么做，但这样会得到同等数量的负数值。如果我们尝试用\
  \ `Math.abs()` 将负数强制转为正数，就会破坏噪点的核心特性——其平滑过渡的值。那么，解决方案是什么呢？\n\n## 映射噪点值\n\n这实际上是生成式艺术中常见的挑战——将一系列值从一个范围映射到另一个范围。幸运的是，`Gen`\
  \ 模块配备了一个专门实现此功能的函数：`Gen.map()`。\n\n该函数需要五个参数，并可选择第六个参数：第一个参数是要映射到新范围的值，第二和第三个参数定义现有范围的下限和上限，第四和第五个参数定义目标范围的下限和上限。第六个参数指定是否返回浮点数。与其他\
  \ `Gen` 函数（如 `gaussian` 和 `pareto`）一样，此参数默认为 `true`，将其设为 `false` 会将结果四舍五入为最接近的整数。示例如下：\n\
  \n```\n// 将数字 (5) 从一个范围 (0, 10) 映射到另一个范围 (0, 100)。\nlet num = 5;\nnum = Gen.map(num,\
  \ 0, 10, 0, 100);\nconsole.log(num);\n-> 50\n```\n\n如果我们对 `noiseValue` 变量应用 `Gen.map()`\
  \ 函数，就能得到更可用的值。我们可以将这个映射后的新值赋给一个新变量，或者如前面的示例所示，直接重新赋值给原变量。\n\n```\n// 获取噪点值。\nlet\
  \ noiseValue = noise.get(nX, nY);\n// 将噪点值映射到可用范围。\nnoiseValue = Gen.map(noiseValue,\
  \ -1, 1, 0, 100, false);\n```\n\n完成此操作后，你应该会看到矩阵中出现了颜色（如图 5-3 所示）。希望这足以让 Neo 赞许地点头。\n\
  \n![](img/538894_1_En_5_Fig3_HTML.png)\n\n一幅抽象图，展示了一个由一系列 1 和 0 组成的方形结构，背景为深色。\n\
  \n**图 5-3** 那块尝起来像鸡肉的矩阵片段\n\n值得注意的是，当使用像 `serif` 这样的通用 `font-family` 时，你实际上是在让操作系统决定使用哪个默认字体来渲染。因此，你看到的内容可能与图\
  \ 5-3 略有差异。\n\n## 用样式优化\n\n我们可以就此打住，不对草图做进一步修改，但有一个小问题让我无法释怀。在这张草图中，总共有 2,500 个\
  \ `text` 元素，而每个元素的 `font-size` 和 `font-family` 属性始终不变。这似乎相当浪费。\n\n```\n\n```\n\n\
  我们可以先移除循环中设置的字体属性，使 `text.set()` 方法看起来像下面这样：\n\n```\ntext.set({\nx: x, y: y, fill:\
  \ `hsl(120 20% ${noiseValue}%)`\n});\n```\n\n然后，我们可以创建一个 `style` 元素，在其中一次性定位所有 `text`\
  \ 元素。在草图的顶部，父 SVG 声明之后，加入以下代码：\n\n```\n// 设置一些文本样式。\nsvg.create('style').content(`\n\
  text {\nfont-size: 16px;\nfont-family: serif;\n}\n`);\n```\n\n注意这里使用了反引号，这允许我们像编写普通\
  \ CSS 那样缩进代码。这段 CSS 的作用是将 `font-size` 和 `font-family` 应用到每个 `text` 元素，避免了重复的内联属性。这不仅是一种更优雅的处理静态样式的方式，还能为我们节省不少字节。在这张特定草图中，采用这种措施后，渲染的标记大小减少了\
  \ 40%——还不错！\n\n## 旋转噪点\n\n在下一张草图中，为了巩固已涵盖的一些概念，我们将围绕中心点旋转一些 `line` 元素，并用噪点改变它们的线条长度和颜色。这次我们只使用单个循环和单个噪点维度。\n\
  \n复制上一张草图的文件夹，并将其命名为类似 `13-spinning-noise` 的名称。移除 `style` 元素以及背景之后的所有内容，这样我们就剩下以下样板代码：\n\
  \n```\nimport { SvJs, Gen, Noise } from '../../node_modules/svjs/src/index.js';\n\
  // 父 SVG。\nconst svg = new SvJs().addTo(document.getElementById('container'));\n\
  // 视口和 viewBox（1:1 宽高比）。\nconst svgSize = Math.min(window.innerWidth, window.innerHeight);\n\
  svg.set({ width: svgSize, height: svgSize, viewBox: '0 0 1000 1000' });\n// 背景。\n\
  svg.create('rect').set({\nx: 0, y: 0, width: 1000, height: 1000, fill: '#181818'\n\
  });\n```\n\n然后，我们将设置与噪点相关的变量，以及两个随机值，这两个值将决定我们的初始色相和循环运行的次数。\n\n```\n// 噪点相关和随机变量。\n\
  let noise = new Noise();\nlet nX = 0;\nlet noiseSpeed = 0.025;\nlet lines = svg.create('g');\n\
  let hue = Gen.random(0, 360);\nlet iterations = Gen.random(60, 100);\n```\n\n###\
  \ 映射与约束\n\n现在我们可以运行循环了。我们将迭代起始点偏移 `10`；对于这张特定草图，这个值比从通常的 `0` 开始效果更好。在循环内部，我们获取 `noiseValue`，然后通过将该值分别映射到不同范围，从中提取出两个变量。一个用于控制色相的偏移量，另一个用于控制每条线的长度。\n\
  \n```\n// 开始舞动。\nfor (let i = 10; i < iterations; i += 1) {\nlet noiseValue = noise.get(nX);\n\
  let hueShift = Gen.map(noiseValue, -1, 1, -180, 180, false);\nlet lineLength = Gen.map(noiseValue,\
  \ -1, 1, 0, 1000, false);\n}\n```\n\n在 `lineLength` 变量之后（仍在循环内部），设置第一条线。我们将在 `(0,\
  \ 0)`（`viewBox` 的左上角）处从一条垂直直线开始，稍后再处理居中问题。由于这是一条垂直线，第二个 `x` 坐标不会改变——只有第二个 `y` 坐标会改变。\n\
  \n\n\n接下来是 `stroke` 值。我们将把这个值包裹在 `Gen.constrain()` 函数中，以确保其值保持在 `0` 到 `360` 之间，并且在这个函数内部，`hue`\
  \ 将按 `hueShift` 的值递增。然后，我们将 `opacity`（在 `hsl()` 函数内部）和 `stroke-width` 都设置为 `0.5`，这将使线条保持优美和精细。\n\
  \n```\nlet l1 = lines.create('line').set({\nx1: 0, y1: 0, x2: 0, y2: lineLength,\n\
  stroke: `hsl(${Gen.constrain(hue + hueShift, 0, 360)} 80% 80% / 0.5)`,\nstroke_width:\
  \ 0.5\n});\n```\n\n对于第二条线，我们的操作大致相同，区别在于这次我们将 `lineLength` 拉长一点，将 `hue` 向相反方向移动，并降低其\
  \ `opacity`。\n\n```\nlet l2 = lines.create('line').set({\nx1: 0, y1: 0, x2: 0, y2:\
  \ lineLength * 1.1,\nstroke: `hsl(${Gen.constrain(hue - hueShift, 0, 360)} 80% 80%\
  \ / 0.25)`,\nstroke_width: 0.5\n});\n```\n\n### 旋转和平移\n\n最后一步将涉及一些变换以及噪声坐标的常规递增。我们将顺时针正向旋转第一条线，逆时针负向旋转第二条线。为此，我们将使用\
  \ SvJs 提供的 `rotate()` 方法，这比设置 `transform: rotate()` 属性（我们在之前的一些草图中所做的那样）更简单。它还具有一些额外的好处：\n\
  \n- 默认情况下，它相对于元素自身的中心进行旋转，而不是画布的左上角。\n- 它会保留任何现有的变换，而不是像 `transform` 属性那样覆盖它们。\n\
  \n考虑到这一点，让我们继续绘制草图并完成这个循环。\n\n```\nl1.rotate(i);\nl2.rotate(-i);\nnX += noiseSpeed;\n\
  ```\n\n最后，在循环外部，将线条移动到画布中心，并随机旋转一个在 `0` 到 `360` 之间的角度。\n\n```\nlines.moveTo(500,\
  \ 500);\nlines.rotate(Gen.random(0, 360));\n```\n\n如图 5-4 所示，我们最终得到了一系列略微不对称的线条，至少对我来说，它们有点像深海生物在跳舞。\n\
  \n![](img/538894_1_En_5_Fig4_HTML.png)\n\n一幅抽象图展示了一个矩形结构，其中有三个不同的旋转线条，颜色呈渐变效果，背景为深色。\n\
  \n**图 5-4**  \n旋转的线条还是深海生物？\n\n## 总结\n\n虽然关于噪声还有很多值得探索的地方，但我们在这里已经涵盖了基础知识，并且我们将在接下来的章节中再次使用噪声。如果你想更深入地研究噪声的细节，我建议你查看一些第三方库，比如流行的\
  \ `SimplexJS`，它超越了二维空间，允许更自由地配置（不过代价是文件体积更大）。\n\n在我们继续之前，让我们快速回顾一下本章涵盖的内容：\n\n-\
  \   在创建更具有机形态时随机性的局限性，以及噪声如何解决这个问题\n-   抽象噪声空间背后的理论\n-   如何通过 SvJs 的 `Noise` 模块将其付诸实践\n\
  -   如何在循环中遍历噪声空间\n-   如何使用噪声值修改元素的坐标和颜色\n-   将噪声值映射并约束到更有用的范围\n-   使用 CSS 优化重复的元素属性\n\
  -   非破坏性的元素旋转\n\n在下一章中，我们将介绍 SVG 规范中的一个基础部分：功能强大的路径元素。\n\n"
- "# 6. 全功能路径\n\n路径也许是 SVG 规范中最重要、最强大的部分。大多数 SVG 文件，无论是简单的图标还是复杂的艺术作品，主要由路径数据构成。例如，如果在\
  \ Inkscape 或 Illustrator 等矢量图形程序中绘制任何比基本图形更复杂的图形，你实际上就是在处理路径。而且，要在 JavaScript 和\
  \ SvJs 中手动编写路径代码，你不需要是数学天才。\n\n本章将涵盖路径元素及其相关命令，这些命令数量众多，需要有自己的小节。路径可能会很快变得复杂，因此我们还会介绍一些\
  \ SvJs 方法来简化我们的工作。\n\n## 路径元素\n\n设置路径很简单；我们只需像创建大多数其他元素一样调用 SvJs 的 `create()` 方法：\n\
  \n```\nlet path = svg.create('path');\n```\n\n路径接受其他图形元素通常使用的 `fill` 和 `stroke`\
  \ 属性，但与其他图形元素（如 `rect` 和 `circle`）不同，路径本身没有内在的形状或形式。这完全取决于我们来定义，我们通过 `d` 属性来完成。\n\
  \n### D 代表数据\n\n`d` 属性允许我们向路径填充数据。这些数据由一系列路径命令和相应的数值组成，这些数值定义了路径的形状。整个数据作为一个字符串传入。\n\
  \nSVG 规范的创建者知道 SVG 文件中会大量使用路径，因此创建简洁的路径命令是控制总体文件大小（以千字节计）的关键部分。因此，命令是单个字符长度，就像它们传递给的\
  \ `d` 属性一样，并且伴随命令的值也可以灵活格式化以节省空间。\n\n```\n// 路径数据字符串的示例。\npath.set({\nd: 'M 20,20\
  \ L 30,20 L 30,30 L 20,30 Z'\n});\n// 一个使用更简洁字符串的相同路径。\npath.set({\nd: 'M20 20L30\
  \ 20L30 30L20 30Z'\n});\n```\n\n我们将在后面的章节中详细介绍类似的示例是如何工作的；现在，只需注意，完全相同的路径数据可以用逗号分隔值，也可以用空格分隔命令，或者两者都不用。\n\
  \n### 路径命令\n\n你可以将路径命令视为绘图指令。每个命令由一个字母表示，该字母可以是大写或小写。大写版本表示其后的数值将使用绝对坐标（因此命令 `M\
  \ 50,50` 意味着移动到 `viewBox` 中 `50,50` 的确切位置），而小写版本表示将使用相对坐标（因此命令 `m 50,50` 意味着相对于上一个已知位置在\
  \ x 和 y 轴上都移动 `+50`）。\n\n总共有十个命令；如果算上两种大小写版本，那就是二十个。如果你认为这很多，那你是对的！确实是很多。但是，考虑到这些命令可以组合起来创建任何可能的二维形状，这些命令的效率之高令人惊叹。有些命令比其他命令更常见，有些更复杂，有些我们只会演示一次，之后不会再使用。\n\
  \n### 路径的起点和终点\n\n所有路径都有一个起点。对于 SVG 而言，所有路径都始于我们移动虚拟笔的那个点。我们为此使用 `M`（或 `m`）命令，它代表“移动到”。我们后面要跟上一个\
  \ x 和 y 坐标对来定义路径的起点。`M` 命令本身不绘制任何东西——它仅仅是将我们移动到想要开始绘制的点。可以这么说，我们的笔还没有落在纸上。\n\n```\n\
  // M/m 命令的语法。\n'M [x, y] ...'\n'm [dx, dy] ...'\n// M/m 命令的示例。\n'M 50 100 ...'\n\
  'm 50 100 ...'\n```\n\n\n\n我们可以在路径的末尾添加一个可选的 `Z` 命令来闭合路径。没有闭合 `Z` 命令的路径保持开放状态（即起点和终点不连接）。除非终点是曲线，否则\
  \ `Z` 会绘制一条直线连接这两点；如果终点是曲线，则会遵循最后一个控制点的曲率（这一点稍后会更容易理解）。\n\n```\n// 闭合路径。\n'M 50\
  \ 100 ... 50 150 Z'\n```\n\n与其他路径命令不同，小写的 `z` 和大写的 `Z` 执行相同的操作，因为它们后面不跟任何数值。这意味着你可以互换使用它们。\n\
  \n## 直线\n\n为了让我们轻松入门路径创建，我们从直线开始。实际上有几个不同的命令可以绘制直线，但我们先从最显而易见的开始。\n\n### 简单的 L\n\
  \n`L` 命令允许我们绘制由一对 x 和 y 坐标定义的直线。小写的 `l` 执行相同操作，但使用相对于路径上一个输入点的坐标。\n\n```\n// L/l\
  \ 命令的语法。\n'L [x, y] ...'\n'l [dx, dy] ...'\n```\n\n让我们看看这在实践中是什么样子。在下面的示例中，两条线被用来创建两个字母\
  \ L 的实例。第一个使用绝对坐标；第二个使用相对坐标。\n\n```\n// 第一个 L。\nsvg.create('path').set({\nd: 'M\
  \ 300 200 L 300 800 L 600 800'\n});\n// 第二个 L。\nsvg.create('path').set({\nd: 'M\
  \ 675 825 l 0 -600 l -300 0'\n});\n```\n\n我们可以在图 6-1 中看到上述代码的渲染结果。我在此省略了与示例无关的所有元素和属性，只关注路径数据。如你所见，你可以使用任一\
  \ `L` 命令来获得相似的结果。\n\n以这种方式手动创建路径时，一些读者可能会觉得使用绝对坐标更直观，而另一些则可能觉得相对坐标更容易使用。例如，如果你想移动路径的位置而不改变其形状，相对坐标特别有用；使用绝对坐标，我们得更改所有后续数字，而使用相对坐标，我们只需更改初始的\
  \ `M` 点。\n\n![](img/538894_1_En_6_Fig1_HTML.png)\n\n一张抽象图，在一个深色背景上展示了一个包含字母 L 和反向\
  \ L 的正方形。\n\n**图 6-1** 由两个 L 命令绘制的两个 L 形\n\n### 水平与垂直变体\n\n如果我们要绘制的线是水平或垂直的，我们可以使用\
  \ `H` 或 `V` 命令作为快捷方式，因为它们只需要一个参数；对于 `H` 或 `h`，是 x 坐标；对于 `V` 或 `v`，是 y 坐标。\n\n```\n\
  // H/h 命令的语法。\n'H [x] ...'\n'h [dx] ...'\n// V/v 命令的语法。\n'V [y] ...'\n'v [dy] ...'\n\
  ```\n\n我觉得这些命令对生成式艺术并非特别有用，但了解一下它们的存在，以备你需要使用，也是值得的。让我们再次创建图 6-1 中的相同 L 形状，但这次使用\
  \ `H` 和 `V` 命令，包括它们的小写版本。\n\n```\n// 第一个 L。\nsvg.create('path').set({\nd: 'M 300\
  \ 200 V 800 H 600'\n});\n// 第二个 L。\nsvg.create('path').set({\nd: 'M 675 825 v -600\
  \ h -300'\n});\n```\n\n### 更进一步的简化\n\n在我们进入曲线部分之前，值得指出的是，如果我们连续使用相同类型的路径命令，可以省略重复的命令本身。SVG\
  \ 渲染器足够智能，能够识别出如果路径命令被省略，则使用上一个已知的命令。让我们展示一个快速示例（其输出如图 6-2 所示）。\n\n![](img/538894_1_En_6_Fig2_HTML.png)\n\
  \n一张抽象图，在一个深色背景上展示了一个带有三角波形的矩形结构。\n\n**图 6-2** 省略重复命令\n\n```\n// 第一个路径，重复使用 L 命令。\n\
  svg.create('path').set({\nd: 'M 10 10 L 20 20 L 30 10 L 40 20 L 50 10 L 60 20 L\
  \ 70 10'\n});\n// 第二个（相同的）路径，省略了重复的 L 命令。\nsvg.create('path').set({\nd: 'M 10 10\
  \ L 20 20 30 10 40 20 50 10 60 20 70 10'\n});\n```\n\n## 二次贝塞尔曲线\n\n我们要介绍的第一种曲线是二次贝塞尔曲线。别担心——这个令人生畏的名字并不代表它的复杂性。就曲线而言，它相对简单。需要两组坐标：第一组定义控制点（我们稍后会解释），第二组定义目标点。\n\
  \n```\n// Q/q 命令的语法。\n'Q [cpx cpy x y] ...'\n'q [dcpx dcpy dx dy] ...'\n```\n\n\
  ### 控制点\n\n如果你将控制点想象为一种吸引力或拉力，曲线会向着它弯曲，那么你的理解就正确了。控制点本身不会被渲染，但如果你看一下图 6-3 中的点和虚线，可以看到控制点对其曲线（在本例中为二次贝塞尔曲线）施加的力的可视化。在此示例中，该点代表控制点坐标\
  \ `[150, 350]`，给定以下路径：\n\n![](img/538894_1_En_6_Fig3_HTML.png)\n\n一张抽象图，在一个深色背景上展示了一个带有向上抛物线和\
  \ V 型链条图案的正方形结构。\n\n**图 6-3** 二次贝塞尔曲线的控制点\n\n```\n'M 50 150 Q 150 350 250 150'\n\
  ```\n\n二次贝塞尔曲线只有一个控制点，而三次贝塞尔曲线（将在后面的章节中探讨）有两个。\n\n### 平滑的快捷方式\n\n假设我们想要扩展图 6-3 中的路径，并绘制一组以固定间隔重复的平滑波浪。手动进行此操作的难点在于控制点的计算；如果它与前一个控制点不完全对称，我们的曲线中就会出现一个“折点”（见图\
  \ 6-4）。现在，在这种特定情况下，计算一个可以纠正此问题的控制点并非十分艰巨的任务，但在更复杂的情况下，这可能会成为一个挑战。\n\n![](img/538894_1_En_6_Fig4_HTML.png)\n\
  \n一张抽象图，在一个深色背景上展示了一个矩形结构，其中心有一个带失真的正弦波。\n\n**图 6-4** 曲线中的折点\n\n这时，`T` 命令就可以派上用场了。它基于前一条曲线的控制点来扩展二次贝塞尔曲线，本质上是“镜像”或反射它。结果是一条具有对称控制点的平滑曲线，并且它只需要一组坐标。\n\
  \n```\n// T/t 命令的语法。\n'T [x y]'\n't [dx dy]'\n```\n\n让我们扩展图 6-4 中的曲线，增加几个额外的起伏。在下面的示例代码中，为了便于阅读，我在坐标中加了一些逗号，但请记住，实际上并不需要它们。同时，我还利用了连续多次使用\
  \ `T` 命令时无需重复的事实。这就是为什么在接下来的四个坐标中，你只会看到它被使用一次。\n\n```\n// 使用平滑的 T 命令扩展二次曲线。\nsvg.create('path').set({\n\
  d: 'M 50,150 Q 150,350 250,150 T 450,150 650,150 850,150 1050,150'\n});\n```\n\n\
  图 6-5 是结果，添加了一些圆形高亮来区分初始的 `M` 点（黄色）和完整的 `Q` 曲线（紫色的第二个点）以及四个额外的 `T` 点（红色）。\n\n![](img/538894_1_En_6_Fig5_HTML.png)\n\
  \n一张抽象图，在一个深色背景上展示了一个连续的、带有周期起点和终点标记点的正弦波矩形结构。\n\n**图 6-5** 一条平滑的二次曲线\n\n\n\n##\
  \ 二次贝塞尔弹簧\n\n让我们在一个简单的绘图中使用二次贝塞尔曲线，创建一组类似弹簧（Slinky）的路径。如果你不知道什么是弹簧（Slinky），它是一种流行的弹簧玩具，只要从顶部轻轻一推，它就能自己“走”下一段台阶（我相信它还能表演许多其他神奇的把戏，但这正是它最广为人知的一种）。\n\
  \n复制模板文件夹，并将其重命名为 `14-quadratic-slinky`。在父级 SVG 下方，设置一些样式，用于定位 `path` 元素，稍后我们将把这些元素设置为一个组的子元素，并为该组赋予一个\
  \ `id` 为 `slinky`。\n\n```\n// 设置弹簧样式。\nsvg.create('style').content(`\n#slinky path\
  \ {\nfill: none;\nstroke-width: 0.75;\nstroke-linecap: round;\n}`\n);\n```\n\n接下来，设置通常的背景，初始化一个随机色相，并创建前面提到的\
  \ `slinky` 组。\n\n```\n// 背景。\nsvg.create('rect').set({\n  x: 0, y: 0, width: 1000,\
  \ height: 1000, fill: '#181818'\n});\n// 选择一个随机的起始色相。\nlet hue = Gen.random(0, 360);\n\
  // 设置弹簧路径组。\nlet slinky = svg.create('g').set({ id: 'slinky' });\n```\n\n在下一步中，我们将启动循环，并创建几个用于塑造二次曲线的控制点。\n\
  \n```\n// 开始循环。\nfor (let i = 0; i < 500; i += 5) {\n  // 创建控制点。\n  let cpx = Gen.random(200,\
  \ 400);\n  let cpy = i - 400;\n}\n```\n\n我们曲线的宽度将为 600 个单位（相对于 `viewBox`），因此我们的中点将是\
  \ 300。在 x 轴上，`cpx` 变量在中点左右各 100 个单位范围内选取一个随机整数值，以使我们的弹簧产生一些“摆动”。`cpy` 变量则更为直接；它在每次迭代中沿着屏幕向下移动，并带有\
  \ 400 个单位的偏移量，这将使曲线向上“拉伸”。\n\n接下来，让我们创建实际的曲线（保持在循环内部）。\n\n```\n// 创建二次曲线。\nslinky.create('path').set({\n\
  \  stroke: `hsl(${hue} 90% 80% / 0.85)`,\n  d: `M 0 ${i} q ${cpx} ${cpy} 600 0`\n\
  });\n```\n\n在这里，我们像之前多次做的那样设置 `hue`，而对于 `path`，我们使用 `M` 命令开始绘制一条简单的曲线。对于曲线坐标，我们利用小写\
  \ `q` 命令计算的相对坐标，这使我们能够使这些值与曲线的起点保持同步。\n\n在结束循环之前，我们将递增 `hue`，但我们将使用一种新技术来实现。我在第\
  \ 2 章（涉及运算符的章节）中提到了取模运算符（`%`），它用于计算一个数除以另一个数后的余数。这对于在预定义范围内循环非常有用，例如颜色的 `hue` 的\
  \ 0 到 360 约束。在循环结束前添加以下内容作为最后一行：\n\n```\n// 递增色相。\nhue = (hue % 360) + 1.5;\n```\n\
  \n快速解释一下它的工作原理：假设我们的随机 `hue` 初始化为 350。表达式 `hue % 360` 将返回 350，因为 `350 / 360` 等于\
  \ 0，余数为 350。这对于我们范围内的每个数字都适用，*除了* 360，当 360 除以自身时结果为 1，余数为 0。这就是它如何循环回范围起点的方式。\n\
  \n现在循环已完成，我们可以在循环外再添加一行代码，以确保内容居中。结果应类似于图 6-6。\n\n![](img/538894_1_En_6_Fig6_HTML.png)\n\
  \n一幅抽象画，描绘了一个方形结构，其中包含一组褪色的二次曲线，背景为深色。\n\n**图 6-6** 弹簧形态的二次曲线\n\n```\nslinky.moveTo(500,\
  \ 500);\n```\n\n## 椭圆弧\n\n是时候进入弧线部分了！椭圆弧曲线（图 6-7）是一个复杂的家伙，如果没有一些视觉示例，其语法很难理解。`A`（或\
  \ `a`）命令用于初始化它，其后跟不少于七个参数。\n\n```\n// A/a 命令的语法。\n'A [rx ry rotation large-arc-flag\
  \ sweep-flag x y] ...'\n'a [rx ry rotation large-arc-flag sweep-flag dx dy] ...'\n\
  ```\n\n前两个参数和最后两个参数我们之前都已经遇到过：`rx` 和 `ry` 指的是 x 轴和 y 轴的半径，最后的 `x` 和 `y` 参数定义了曲线的终点。`rotation`\
  \ 定义了沿 x 轴的旋转角度，而 `large-arc-flag` 和 `sweep-flag` 都是数字形式的布尔值，`0` 表示 `false`，`1`\
  \ 表示 `true`。至于它们的作用，则需要稍作解释。\n\n![](img/538894_1_En_6_Fig7_HTML.png)\n\n一幅抽象画，描绘了一个方形结构，其中包含一个带有两个端点的半圆，背景为深色。\n\
  \n**图 6-7** 一条椭圆弧曲线\n\n### 设置标志\n\n当我们绘制一条椭圆弧曲线时，实际发生的情况是，在幕后使用两个相互锁定的椭圆作为引导，以确定实际绘制众多可能路径中的哪一条。当\
  \ `large-arc-flag` 设置为 `1` 时，将会选择大弧。当 `sweep-flag` 设置为 `1` 时，弧线将按顺时针方向绘制。让我们看看图\
  \ 6-8，其中展示了这些标志的四种可能排列组合。\n\n![](img/538894_1_En_6_Fig8_HTML.png)\n\n一幅抽象画，描绘了一个方形结构，其中有上下两个圆，按顺时针方向旋转，背景为深色。\n\
  \n**图 6-8** 四种可能的弧线\n\n-   在最上面的路径中，`large-arc-flag` 和 `sweep-flag` 都设置为 `1`。\n\
  -   在第二条路径中，`large-arc-flag` 设置为 `0`，`sweep-flag` 设置为 `1`。\n-   在第三条路径中，`large-arc-flag`\
  \ 和 `sweep-flag` 都设置为 `0`。\n-   在最下面的路径中，`large-arc-flag` 设置为 `1`，`sweep-flag` 设置为\
  \ `0`。\n\n实际上，你在屏幕上一次只能看到这些弧线中的一条。然而，当我们同时看到所有可能的曲线时，这有助于我们理解椭圆弧的底层结构。\n\n### 不规则半径\n\
  \n关于椭圆弧曲线的另一个可能令人困惑之处在于，`rx` 和 `ry` 这两个半径值的工作方式与我们预期的略有不同。通常情况下，半径会直接决定椭圆形状的大小。对于椭圆弧曲线，大小实际上是由多个协同工作的因素决定的，而\
  \ `rx` 和 `ry` 值只是等式的一部分。\n\n例如，你有时会发现，构成可能曲线基础的相互锁定的椭圆是重合的；也就是说，它们彼此重叠。如果你发现将 `large-arc-flag`\
  \ 设置为 `0` 或 `1` 对最终结果没有影响，你就知道是这种情况了。当两个半径值与曲线起点和终点之间的距离成特定比例时，就会发生这种情况。\n\n因此，将\
  \ `rx` 和 `ry` 值视为影响弧线形状的比率，而不是直接决定弧线大小的值，可能会更容易理解（当使用较小的半径值时尤其如此）。如果这听起来不太好理解，也不必担心——起初这相当违反直觉，只有通过实验才会变得更清晰。\n\
  \n为了帮助进行这种实验，并希望让椭圆弧曲线更易于理解，我创建了一个交互式笔，展示了改变半径和标志值的效果。你可以在 [`davidmatthew.ie/generative-art-javascript-svg#arc-curve`](https://davidmatthew.ie/generative-art-javascript-svg#arc-curve)\
  \ 找到这个笔。\n\n\n\n## 生成式弧线\n\n让我们暂且放下椭圆弧线曲线理论细节的纠缠，转而将它们用于一些实际、富有创意的用途。使用我们常用的复制方法，创建一个新的草图文件夹，并将其命名为类似\
  \ `15-generative-arcs` 的名称。此草图的目标是创建两组弧线曲线：一组顺时针绘制，另一组镜像对称，逆时针绘制。我们将对多个关键变量进行随机化处理，以保持输出的独特性和难预测性。\n\
  \n准备好后，在背景下方创建一个将包含我们弧线曲线的组。之后，我们将设置一些随机化变量，这些变量将在接下来的循环中使用。\n\n```\n// 为我们的弧线曲线创建一个容器组。\n\
  let arcs = svg.create('g');\n// 随机化一些变量。\nlet rx = Gen.random(5, 350);\nlet ry =\
  \ Gen.random(5, 350);\nlet hue = Gen.random(0, 360);\n```\n\n接下来，我们将启动循环，该循环将运行\
  \ 360 次。在循环内部，我们将随机化更多变量：弧线的 `rotation`（旋转角），这会使曲线向特定方向伸展；以及 `large-arc-flag`（大弧标记），借助我们的\
  \ `Gen.chance()` 函数，它会有 50% 的概率为 `0` 或 `1`。\n\n```\nfor (let i = 0; i < 360; i +=\
  \ 1) {\n// 随机化旋转角和大弧标记。\nlet rotation = Gen.random(0, 180);\nlet largeArc = Gen.chance()\
  \ ? 1 : 0;\n}\n```\n\n接下来（仍在循环内）创建第一组顺时针弧线曲线。请记住，决定它们顺时针或逆时针绘制的是 `sweep-flag`（扫描标记），它是\
  \ `A` 命令的第五个参数。在这里，在我们的 `largeArc` 变量之后，我们将 `sweep-flag` 设置为 `1`，表示顺时针。\n\n```\n\
  // 创建第一组顺时针弧线曲线 (sweep = 1)。\narcs.create('path').set({\nfill: 'none',\nstroke:\
  \ `hsl(${hue} 75% 75% / 0.05)`,\nd: `M 275 500 A ${rx} ${ry} ${rotation} ${largeArc}\
  \ 1 725 500`\n});\n```\n\n第二组弧线曲线将完全相同，但有两个小改动。我们将 `sweep-flag` 设置为 `0`，使这组曲线逆时针绘制，并将\
  \ `hue` 偏移 `60`，只为颜色增加一点对比度。在关闭循环之前，我们将使用前面提到的取模运算符递增 `hue`。\n\n```\n// 创建第二组逆时针弧线曲线\
  \ (sweep = 0)。\narcs.create('path').set({\nfill: 'none',\nstroke: `hsl(${hue + 60}\
  \ 75% 75% / 0.05)`,\nd: `M 275 500 A ${rx} ${ry} ${rotation} ${largeArc} 0 725 500`\n\
  });\n// 递增色相值。\nhue = (hue % 360) + 0.5;\n```\n\n如果你此时运行草图，你会看到一些变化丰富的生成式弧线（示例输出见图\
  \ 6-9）。如果你想注入更多活力，可以在循环之后添加以下代码行：\n\n![](img/538894_1_En_6_Fig9_HTML.png)\n\n一张抽象图，展示了一个矩形结构，其中有两个椭圆弧线，包含一组重叠的图层，背景为深色。\n\
  \n**图 6-9** 我们生成式弧线的两次渲染\n\n```\n// 应用随机旋转。\narcs.rotate(Gen.random(0, 360));\n\
  ```\n\n## 三次贝塞尔曲线\n\n我们将介绍的最终曲线是三次贝塞尔曲线，由 `C` 命令调用。这是所有可用矢量曲线中用途最广的，也是大多数矢量绘图和插图软件包中使用的主要曲线（通常化名为钢笔工具）。它有两组控制点，因此语法比二次贝塞尔曲线稍复杂些，但比椭圆弧线曲线更容易掌握。\n\
  \n```\n// C/c 命令的语法。\n'C [cpx1 cpy1 cpx2 cpy2 x y] ...'\n'c [dcpx1 dcpy1 dcpx2 dcpy2\
  \ dx dy] ...'\n```\n\n### 三次控制点\n\n第一组控制点坐标 `cpx1` 和 `cpy1` 从起始点一侧塑造曲线的形状。该起始点在\
  \ `C` 命令之前声明——例如，它可能是一组 `M` 坐标，或者是前一条曲线的终点。第二组控制点坐标 `cpx2` 和 `cpy2` 塑造目标点处的曲线形状，该点由最后两个坐标\
  \ `x` 和 `y` 定义。示例如下：\n\n```\n// 创建一条单次三次贝塞尔曲线。\nsvg.create('path').set({\nd: 'M\
  \ 75,75 C 140,330 360,330 425,75'\n});\n```\n\n上述路径在图 6-10 中进行了说明，你可以看到初始的 `M` 点以黄色显示，而构成三次贝塞尔曲线本身的三个点以红色显示。彩色点和虚线仅用于说明目的；它们在最终的\
  \ SVG 中不会被渲染。\n\n![](img/538894_1_En_6_Fig10_HTML.png)\n\n一张抽象图，展示了一个方形结构，其中有一条向上的抛物线状曲线，其两个端点与带有两个端点的倾斜虚线相连。\n\
  \n**图 6-10** 可视化控制点的三次贝塞尔曲线\n\n当连接在一起时，连续的三次贝塞尔曲线可以组合创建出任何可以想象到的 2D 形状。它们是矢量绘图程序中的基本元素，以至于有效运用它们本身已成为一门手艺。审慎地使用这些曲线及其“手柄”（图\
  \ 6-10 中可视化为虚线），可以区分出流畅优美的线条艺术与笨拙生硬的剪贴画。\n\n### S 命令实现对称\n\n与二次贝塞尔曲线类似，如果你想用另一条与其平滑连接的曲线来扩展当前曲线，可以调用三次贝塞尔曲线的一个相关命令。用于此目的的命令是\
  \ `S`（相对值用 `s`）。`S` 命令会自动生成一个对称控制点，该点镜像前一条曲线的控制点，因此允许我们省略第一组控制点坐标。\n\n```\n// 使用\
  \ S 命令扩展三次贝塞尔曲线。\nsvg.create('path').set({\nd: 'M 50,150 C 100,250 200,50 250,150\
  \ S 400,50 450,150'\n});\n```\n\n在图 6-11 中，颜色最浅的虚线指示了 `S` 命令自动生成对称控制点的位置。\n\n![](img/538894_1_En_6_Fig11_HTML.png)\n\
  \n一张抽象图，展示了一个矩形结构，其中包含三次贝塞尔曲线，虚线指示了具有对称控制点的 `S` 命令。\n\n**图 6-11** 一条平滑扩展的三次贝塞尔曲线\n\
  \n## 有机曲线\n\n让我们将前述知识运用到一个构图中，目标是创建一系列平滑的、看起来有机的曲线。为此，我们的老朋友 `Noise` 将为我们指引正确的方向。首先，像往常一样复制模板文件夹，将其命名为类似\
  \ `16-organic-curves` 的名称。确保顶部有以下导入语句：\n\n```\nimport { SvJs, Gen, Noise } from\
  \ '../../node_modules/svjs/src/index.js';\n```\n\n然后是父级 SVG 和背景，之后我们将创建一些与噪声相关的变量。我在这里引入了一个名为\
  \ `amplifier` 的新变量；当我们把噪声值映射到一个新范围（可以说是增加其音量）时，将会用到它。\n\n```\n// 噪声相关变量。\nlet noise\
  \ = new Noise();\nlet n = Gen.random(0, 1000);\nlet speed = 0.05;\nlet amplifier\
  \ = Gen.random(200, 500);\n```\n\n接下来，我们将设置与颜色和曲线本身相关的变量，并将它们包含在一个组内。\n\n```\n//\
  \ 曲线和颜色相关变量。\nlet curves = svg.create('g');\nlet numCurves = Gen.random(75, 125);\n\
  let hue = Gen.random(0, 360);\n```\n\n\n\n## 变量分组与生成有机曲线\n\n按照这种方式将变量进行有意义的分组并添加注释来提升清晰度，通常是一种良好的实践。否则，当你之后重新审视代码时，可能很难回忆起最初的设计意图。你还可以更进一步，通过对象来分组（第\
  \ 2 章概述的技巧），但这里我不打算这样做。\n\n接下来我们将进入循环，首先检索噪声值，然后将其重新映射到更合适的范围（使用前面提到的`amplifier`变量）。请注意，这个范围将跨越正负值，因此我们无法预先知道其极性。就我们的曲线而言，这将有助于模拟更有机的运动，因为数值不会总是与原始起点保持一致的偏移，而是更自然地围绕它们变化。在循环外部，包含`moveTo()`方法来使我们的曲线组居中。\n\
  \n```\nfor (let i = 0; i < numCurves; i += 1) {\n// 检索并映射我们的噪声值。\nlet noiseValue\
  \ = noise.get(n);\nnoiseValue = Gen.map(noiseValue, -1, 1, -amplifier, amplifier,\
  \ false);\n}\ncurves.moveTo(500, 500);\n```\n\n接下来是曲线坐标。为了清晰起见，我们将为每个调用的命令设置变量，使路径数据（或`d`字符串）的构建不那么笨重。继续编写以下代码，并将其保持在循环内。我们目标曲线的形状与图\
  \ 6-10 中所示的曲线相差不大。除此之外，提供的值相当随意，因此可以随意调整它们。\n\n```\n// M 命令坐标。\nlet mx = 0;\nlet\
  \ my = 0 + (i * 5);\n// C 命令坐标。\nlet cpx1 = 0 + noiseValue;\nlet cpy1 = -100;\n\
  let cpx2 = 250 + noiseValue;\nlet cpy2 = -100;\nlet x2 = 300;\nlet y2 = 0;\n// S\
  \ 命令坐标。\nlet spx = 350 + noiseValue;\nlet spy = 100;\nlet x3 = 300;\nlet y3 = -50;\n\
  ```\n\n除了初始的`M`命令坐标外，我们将使用相对坐标来构建曲线（即，我们将前述曲线变量提供给`c`和`s`命令，而不是它们的大写弟兄）。这些在循环设置中效果更好，因为它们始终与最新的坐标值保持同步。唯一需要注意的另一点是，我们非常有选择性地仅让`noiseValue`变量调制了部分值，本例中是十个可能值中的三个。有时微妙的效果最好，但同样，可以随意在此处进行实验。\n\
  \n变量就绪后，是时候创建曲线本身了。这里我将介绍一种关于模板字面量语法的新技巧。在之前的草图中，我们为每个变量都打开和关闭了`${}`大括号。但是，当这些变量一个接一个出现时，我们实际上可以将它们作为一个数组一次性嵌入。\n\
  \n```\n// 创建有机曲线。\ncurves.create('path').set({\nfill: 'none',\nstroke: `hsl(${hue}\
  \ 80% 80% / 0.8)`,\nd: `M ${[mx, my]}\nc ${[cpx1, cpy1, cpx2, cpy2, x2, y2]}\ns\
  \ ${[spx, spy, x3, y3]}`\n});\n```\n\n如果此时运行草图，你会看到一系列曲线，但它们的形状和颜色将始终保持一致。我们还没有递增噪声坐标值——这是一个至关重要的步骤，但非常容易忘记（我自己就多次遗漏了这行代码，导致经常抓耳挠腮）。我们接下来将处理此步骤，同时增加色调值，并通过`noiseValue`变量对其进行微调。作为最后的点缀，我们将添加一些随机的“气泡”（参见图\
  \ 6-12）。别问我为什么。\n\n![](img/538894_1_En_6_Fig12_HTML.png)\n\n一张抽象图展示了一个正方形结构，上面有一系列重叠的、带有随机气泡的立方贝塞尔曲线，背景为深色。\n\
  \n**图 6-12** 噪声调制的有机曲线\n\n```\n// 递增噪声和色调。\nn += speed;\nhue = (hue % 360) + (noiseValue\
  \ / 25);\n// 10% 的概率生成一个“气泡”。\nif (Gen.chance(10)) {\nsvg.create('circle').set({\n\
  r: Gen.random(5, 50),\ncx: Gen.random(150, 850),\ncy: Gen.random(150, 850),\nfill:\
  \ `hsl(0 0% 100% / 0.1)`,\nstroke: '#888'\n});\n}\n```\n\n### 一个更简单的选项\n\n为每个曲线段处理六个坐标（或者在使用`S`命令时为四个），有时会让人感到有点棘手。能够只用一条平滑曲线连接一系列单个点，而无需担心所有那些额外的控制点，岂不是很棒？\n\
  \n问得好！SvJs 配备了一个名为`createCurve()`的方法，正好可以做到这一点。在底层，它利用了三次贝塞尔曲线的能力，但抽象掉了控制点，使得构建曲线不再那么令人生畏。这确实牺牲了很大程度的控制权，但在某些情况下，我们可能不需要手动曲线命令所提供的微调级别。使用`createCurve()`方法，我们只需要关心点。\n\
  \n```\n// createCurve() 方法的语法。\ncreateCurve(pointsArray, [curveFactor]);\n```\n\n\
  粗略地说，我们可以将其视为一种“连点”方法，主要区别在于我们需要提供点，而不是进行连接。第一个参数`pointsArray`，顾名思义，是一个`[x, y]`坐标对数组。它可以作为标准的一维数组或二维数组（即数组的数组）提供。\n\
  \n```\n// 一维点数组。\nlet points1D = [25, 30, 45, 20, 80, 10, 90, 40];\n// 相同点的二维数组。\n\
  let points2D = [\n[25, 30], [45, 20], [80, 10], [90, 40]\n];\n```\n\n`curveFactor`参数允许我们修改点之间的张力。值为`0`时，点通过直线连接。值为`1`（默认值）时，张力较松，曲线更平滑。通常，最可用的结果在`0`到`2`的范围内；偏离太远，底层的控制点将重叠并产生一些真正混乱的波形。但在某些情况下，这可能是你想要的。\n\
  \n在图 6-13 中，我们可以看到上述`curveFactor`值的作用。最上面的曲线设置为`0`，中间的曲线设置为`1`，底部的曲线设置为`5`。浅色的点表示我们的`pointsArray`坐标的位置，仅用于说明目的；正常情况下你不会看到这些被渲染出来。\n\
  \n![](img/538894_1_En_6_Fig13_HTML.png)\n\n一张抽象图展示了一个矩形结构，上面有三条不同的曲线，具有多个波峰和波谷，背景为深色。\n\
  \n**图 6-13** 使用值 0、1 和 5 改变曲线因子\n\n## 总结\n\n路径现在已成为你生成式工具库的一部分，为你开启了更多可能性。回顾一下，我们涵盖了以下内容：\n\
  \n*   路径数据（`d`）字符串格式及其提供的灵活性和经济性。\n*   绝对路径命令和相对路径命令之间的区别\n*   `L`、`V`和`H`直线命令\n\
  *   `Q`和`T`二次贝塞尔曲线命令。\n*   什么是控制点以及如何利用它们\n*   椭圆弧曲线命令`A`及其复杂的参数数组\n*   `C`和`S`三次贝塞尔曲线命令\n\
  *   使用噪声和随机性来塑造曲线\n*   SvJs 的`createCurve()`方法\n\n在下一章中，我们将探索运动、动画以及如何使我们的草图具有交互性。\n\
  \n"
- "# 7. 运动与交互性\n\n\n```markdown\n\n## 交互式生成艺术的核心技术\n\n生成艺术区别于其他艺术形式的一个特点，是其能够融入交互性，并因此吸引观众主动参与。观众——无论是笔记本电脑前的单个用户，还是艺术装置前的一小群人——都可以影响甚至决定最终结果。本质上，这种艺术是*动态*的；它移动、响应、流动，而非固定和最终的。\n\
  \n在本章中，我们将探索交互式艺术的一些底层技术，包括事件监听器、回调函数、光标追踪、碰撞检测，以及如何利用这些技术实时修改我们的 SVG 元素和属性。我们还将深入研究可用于动画化\
  \ SVG 的不同方法，在决定本章剩余部分将采用的方法之前，讨论它们的优缺点。\n\n### 事件监听器\n\n鼠标点击是一个事件，按下键盘上的某个键或点击平板电脑的触摸屏也是如此。当此类事件在网页浏览器上下文中发生时，作为\
  \ JavaScript 程序员，我们可以竖起虚拟的耳朵去监听它们。一旦检测到事件，我们就可以捕获它。捕获事件后做什么由我们决定。我们可以用它来触发任何事情——一条自定义消息、颜色变化、简单的动画、复杂的变换；可能性是无穷无尽的。但首先，我们需要知道如何“监听”。\n\
  \n幸运的是，这很简单：我们可以使用一个名为`addEventListener()`的浏览器原生函数。此函数需要三样东西：一，要附加到的元素（即负责监听的元素）；二，要监听的事件类型（例如，鼠标点击）；三，监听到事件时要执行的操作（即回调函数执行的动作）。其形式如下：\n\
  \n```javascript\n// 为 HTML 或 SVG 元素添加事件监听器。\nelement.addEventListener('eventType',\
  \ doSomething);\n```\n\n这里我们假设回调函数`doSomething()`在代码的其他地方已定义。请注意，在这种情况下，它仅通过名称提供，不带括号。这是为了防止函数被过早触发。而对于匿名函数或箭头函数，情况则不同，它们可以在定义时直接使用，而不会有立即被调用的风险。\n\
  \n```javascript\n// 使用箭头语法定义回调函数。\nelement.addEventListener('eventType', () => {\n\
  \  // 在此处执行某些操作...\n});\n```\n\n### 事件类型\n\n我们可以选择监听的事件类型有很多，但我们将重点关注对生成艺术有用的一小部分：键盘事件、表单事件和指针事件类型。\n\
  \n像`keydown`和`keyup`这样的键盘事件类型会捕获打字时敲击按键的不同阶段。像`change`和`input`这样的表单事件类型可以捕获用于输入数据的界面元素（例如滑块、文本字段和下拉菜单）的更新。而指针事件类型，或许对生成艺术而言是最重要的一类，是鼠标和触摸屏事件类型的更现代替代方案，旨在与硬件无关。指针事件类型包括`pointerdown`、`pointermove`、`pointerover`和`pointerup`。出于我们的目的，我们也可以将`click`事件类型——技术上属于鼠标事件——归入此类，因为它也能捕获简单的触摸事件，例如手指轻点。\n\
  \n```javascript\n// 捕获鼠标、手写笔或手指在元素上的移动。\nelement.addEventListener('pointermove',\
  \ () => {\n  // 在此处执行某些操作...\n});\n```\n\n### 事件参数\n\n当事件监听器附加到元素并捕获到一个事件时，该事件可以作为参数传递给回调函数。例如，如果我们向\
  \ HTML 的`document.body`添加一个事件监听器来检测`click`事件，那么`click`事件的属性也将被捕获，并可供回调函数使用。\n\n\
  以下是实际工作方式的示例。在下面的代码中，每次你点击 HTML 页面`body`内的任意位置时，鼠标或指针设备的位置都会被记录到控制台。\n\n```javascript\n\
  // 在点击时记录用户的指针坐标。\ndocument.body.addEventListener('click', (event) => {\n  let x\
  \ = event.clientX;\n  let y = event.clientY;\n  console.log(`x: ${x}, y: ${y}`);\n\
  });\n```\n\n`clientX`和`clientY`属性只是`click`事件内置的众多属性中的两个。完整的列表可以在 MDN（[`developer.mozilla.org/docs/Web/API/Element/click_event`](http://developer.mozilla.org/docs/Web/API/Element/click_event)）上找到，那里还提供了涵盖所有\
  \ DOM 事件的全面文档。\n\n## 触发 SvJs 的保存方法\n\n假设我们有了一个满意的草图，并且想要保存由我们的 JavaScript 生成的实际\
  \ SVG 标记——我们该怎么做？也许最快的方法是打开浏览器的开发者工具，选择“元素”选项卡，检查 DOM 树直到找到根 SVG 元素。然后右键点击它，选择“复制”，再选择嵌套的“复制\
  \ outerHTML”选项。这给了我们想要的 SVG 文件数据，但不是文件本身。因此，作为最后一步，我们需要打开一个文本或代码编辑器，将剪贴板内容粘贴进去，*然后*将其保存为\
  \ SVG 文件。这并不方便。\n\n如果能简单地按下键盘上的某个键，让整个过程自动完成，那就容易多了。SvJs 确实有一个可用于此目的的`save()`方法，但它首先需要被“连接”到一个事件监听器才能触发。我们现在就来完成这项工作。\n\
  \n打开我们之前的任意一个草图，在草图的底部，编写一个函数，以便在我们按下“s”键时调用此方法。事件类型将是`keydown`，它在按下任意键时触发，所以我们需要确保将`event`作为参数传递给我们的回调函数，以便我们能够查询它的`key`属性；正是这个属性告诉我们实际按下的是哪个键。只有当`key`等于“s”时，我们才会触发`save()`方法，并且不区分大小写（这样也能捕获到大写的“S”）。\n\
  \n```javascript\n// 将根 svg 保存为可下载的文件。\ndocument.addEventListener('keydown', (event)\
  \ => {\n  let key = event.key.toLowerCase();\n  if (key === 's') svg.save();\n});\n\
  ```\n\n对于以后的任何草图，都可以随意使用上述方法。另外，`save()`方法可以在任何 SVG 元素上调用，这意味着如果你愿意，你可以只保存 SVG 的一部分——尽管这种用例比较少见。\n\
  \n### 创意光标追踪\n\n在我们展示事件监听器实际应用的第一个示例中，我们演示了如何实现鼠标光标的追踪。我们只需查询鼠标事件的`clientX`和`clientY`坐标即可。这是有意简化了的，因为相对于\
  \ SVG 的`viewport`（它使用自己的坐标空间）来精确追踪鼠标的位置会稍微复杂一些。\n\n### SvJs 的 trackCursor() 方法\n\
  \n为了解决这个问题，SvJs 内置了一个`trackCursor()`方法，可以在根 SVG 元素上调用。它会自动处理附加相关事件监听器（`pointermove`和`pointerleave`）、将光标位置转换到`viewBox`坐标空间，并确保在触摸屏设备上也能出现预期行为。要激活它，只需在主\
  \ SVG 元素上按如下方式调用即可：\n\n```javascript\nsvg.trackCursor();\n```\n\n一旦激活，它会更新父 SVG\
  \ 的两个属性：`cursorX`和`cursorY`，这两个属性告诉我们当前光标位于`viewBox`（而非网页浏览器窗口）中的位置。它还允许我们传入自己的自定义回调函数，以便在光标位置更新时触发。\n\
  \n```javascript\n// 传入自定义回调。\nsvg.trackCursor(() => {\n  // ...执行操作\n});\n```\n\n\
  ```\n\n\n### 交互式椭圆\n\n让我们创建一个新的草图，展示如何将 `trackCursor()` 进行创造性运用。复制我们的模板文件夹，并将其命名为类似\
  \ `17-cursor-tracking` 的名称。我们将重新创建第 1 章中第一个草图的一个变体，但这次我们将使其具有交互性。\n\n在背景下方，初始化以下变量。`ellipses`\
  \ 数组是一个新增项；我们将用它来存储创建的椭圆，以便之后遍历它们。\n\n```\n// 随机化一些变量。\nlet hue = Gen.random(0,\
  \ 360);\nlet rotation = Gen.random(0, 360);\nlet iterations = Gen.random(50, 100);\n\
  // 该数组将允许我们稍后遍历椭圆。\nlet ellipses = [];\n```\n\n接下来是创建椭圆的循环。这里的代码比第一章中展示的更紧凑，因为我们之后介绍了实现某些结果（如递增\
  \ `hue`）的更简洁方法。另一个值得注意的区别是添加了 `ellipses.push()` 方法；这是我们将每个椭圆添加到前述数组的地方。\n\n```\n\
  // 循环随机次数以创建椭圆。\nfor (let i = 0; i < iterations; i += 1) {\n  // 创建椭圆。\n  let ellipse\
  \ = svg.create('ellipse');\n  ellipse.set({\n    cx: 500,\n    cy: 500,\n    rx:\
  \ 100 + (i * 3),\n    ry: 300 + (i * 2),\n    fill: 'none',\n    stroke: `hsl(${hue}\
  \ 80% 80% / 0.6)`,\n    transform: `rotate(${rotation + (i * 2)} 500 500)`\n  });\n\
  \  // 将椭圆添加到数组。\n  ellipses.push(ellipse);\n  // 递增色调。\n  hue = (hue % 360) + 2;\n\
  }\n```\n\n你现在应该能看到一组静态椭圆。下一步是让它们动起来。我们要做的是在主 SVG 上激活 `trackCursor()` 方法，并传入一个箭头函数作为回调。在这个箭头函数内部，我们将使用\
  \ `forEach()` 循环遍历 `ellipses` 数组中的每一项，并根据光标位置调整每个椭圆的 `cx` 和 `cy` 坐标。\n\n```\n//\
  \ 根据光标调整每个椭圆的中心点。\nsvg.trackCursor(() => {\n  ellipses.forEach((ellipse) => {\n\
  \    ellipse.set({\n      cx: svg.cursorX,\n      cy: svg.cursorY\n    });\n  });\n\
  });\n```\n\n如此一来，我们便实现了运动——当我们创建出一个真正动态的、由光标引导的构图时，我们的椭圆优雅地滑入了生命！图 7-1 展示了光标位于中心点偏南时的一种可能变化。一个按键映射的保存功能在这里特别有用（我自己就用它保存了图\
  \ 7-1），因为它允许我们捕获 SVG 而不会因无意的光标移动（比如如果我们必须点击按钮时可能发生的情况）而干扰构图。\n\n![](img/538894_1_En_7_Fig1_HTML.png)\n\
  \n> 一幅抽象画，呈现出一个方形结构，其中包含以旋转模式排列的椭圆阵列，背景为深色。\n\n**图 7-1** – 经过光标变换的椭圆阵列\n\n既然我们已经知道如何通过交互实现运动，现在是时候学习如何让物体脱离我们的输入而独立运动了。\n\
  \n## 编程式运动\n\n如前所述，我们有几种不同的方法可以用来制作 SVG 动画。第一个是 CSS 关键帧，这对大多数 Web 开发者来说都是熟悉的领域。第二个是\
  \ SVG 格式自身原生的方法——SMIL。第三个是 Web 动画 API（或称 WAAPI），这是一个现代 JavaScript 驱动的 API。最后一种方法是生成式艺术家（至少是\
  \ JavaScript 领域的）中流行的一种技术：递归的 `requestAnimationFrame` 方法。了解每种技术及其各自的优势和弱点，无论我们最终采用哪一种，都会对您大有裨益。我们将创建一个简单的草图，以非常基础的方式展示全部四种选项。准备好后，请创建模板草图的一个新实例，并将其命名为类似\
  \ `18-making-things-move` 的名称。\n\n我们要做的是创建一个菱形形状，由四个不同尺寸的重叠正方形组成（如图 7-2 所示），并使用不同的技术为每个正方形制作动画。以下代码进行了设置，除了\
  \ `transform_origin` 属性（该属性通过设置默认旋转点，确保在各种方法之间实现更一致的动画行为）之外，这里没有什么真正的新内容，因此可以随意直接复制粘贴：\n\
  \n![](img/538894_1_En_7_Fig2_HTML.png)\n\n> 一幅抽象画，呈现出一个方形结构，其中包含四个菱形排列的明亮重叠正方形，背景为深色。\n\
  \n**图 7-2** – 我们将使其运动的四个形状\n\n```\nimport { SvJs } from '../../node_modules/svjs/src/index.js';\n\
  \n// 父级 SVG。\nconst svg = new SvJs().addTo(document.getElementById('container'));\n\
  \n// 视口和 viewBox（1:1 宽高比）。\nconst svgSize = Math.min(window.innerWidth, window.innerHeight);\n\
  svg.set({ width: svgSize, height: svgSize, viewBox: '0 0 1000 1000' });\n\n// 背景。\n\
  svg.create('rect').set({\n  x: 0, y: 0, width: 1000, height: 1000, fill: '#181818'\n\
  });\n\n// 用于容纳形状及其颜色的数组。\nlet palette = ['#34d399', '#6ee7b7', '#a7f3d0', '#d1fae5'];\n\
  let shapes = [];\n\n// 初始化四个形状。\nfor (let i = 0; i < 4; i += 1) {\n  let size =\
  \ 500 - (i * 125);\n  let position = 250 + (i * 62.5);\n  let shape = svg.create('rect').set({\n\
  \    x: position,\n    y: position,\n    width: size,\n    height: size,\n    fill:\
  \ palette[i],\n    transform_origin: '50% 50%',\n    transform: 'rotate(45)'\n \
  \ });\n  shapes.push(shape);\n}\n```\n\n### CSS 关键帧\n\n可以使用 CSS 中的 `@keyframes`\
  \ 规则创建动画序列。与动画、动态图形和视频编辑软件中使用的传统关键帧非常相似，CSS `@keyframes` 定义了某些属性在特定时间点（或序列中的步骤）的状态。例如，在时间\
  \ `t`，我们的对象可能位于位置 `[x1, y1]`，而在时间 `t + 5`，对象可能已经移动到了 `[x2, y2]`。关键帧定义了这些时间点，而从一个状态到另一个状态的过渡就构成了动画。我们称这个过程为“补间”（意为“中间帧”），因为动画就发生在这两个中间状态之间。\n\
  \nCSS `@keyframes` 的语法非常直观。你可以使用 `from` 和 `to` 指令设置简单动画的起始和结束关键帧，或者如果你有更复杂的需求，也可以使用百分比来指定某些过渡应该触发的时间点。一旦\
  \ `@keyframes` 规则定义完毕，它就需要被一个元素使用 `animation-name` 属性调用，同时我们还需要指定动画应持续多长时间（`animation-duration`）。我们还可以定义其他可选属性，例如\
  \ `animation-timing-function`（也称缓动函数），它描述了*如何*从一个属性值过渡到另一个属性值，以及 `animation-iteration-count`，它指定了动画应该播放的次数。\n\
  \n在下面的代码中，我们调用数组中的第一个形状，并为其分配一个 id `cssShape`。这将使我们能够稍后轻松定位该元素。然后，我们设置一个名为 `scaleRotate`\
  \ 的 `@keyframes` 规则，该规则将目标旋转整整 360 度，同时沿其 x 轴缩小、沿其 y 轴放大（产生拉伸效果），然后再将其恢复为原始尺寸。最后，我们将动画分配给\
  \ `cssShape` 元素，指定了持续时间、迭代次数和缓动函数。\n\n\n\n```javascript\n// 为第一个形状设置 ID。\nshapes[0].set({\
  \ id: 'cssShape' });\n// 使用 CSS 为这个形状添加动画。\nsvg.create('style').content(`\n@keyframes\
  \ scaleRotate {\n0% { transform: rotate(0) scale(1, 1) }\n50% { transform: rotate(180deg)\
  \ scale(0.5, 1.5) }\n100% { transform: rotate(360deg) scale(1, 1) }\n}\n#cssShape\
  \ {\nanimation-name: scaleRotate;\nanimation-duration: 5s;\nanimation-iteration-count:\
  \ infinite;\nanimation-timing-function: linear;\n}\n`);\n```\n\n现在你应该能看到，外侧的正方形在缓慢旋转和拉伸，而其他正方形保持静止。此外，也可以使用简写的\
  \ `animation` 属性，通过一次性声明所有动画值来实现更简洁的代码。不过，只有在熟悉完整写法后才使用简写形式，因为值的顺序 `–` 虽然不算特别严格\
  \ `–` 但如果你不熟悉所有可能接受的取值，也可能会导致意外行为。\n\n```javascript\nsvg.create('style').content(`\n\
  ...\n#cssShape {\nanimation: scaleRotate 5s infinite linear;\n}\n`);\n```\n\n###\
  \ SMIL 方式\n\n现在让我们尝试用 SMIL 实现相同的效果。SMIL，全称为同步多媒体集成语言，是 SVG 自带的动画方法，无需 CSS 或 JavaScript。然而，由于我们使用的是\
  \ SvJs，我们将通过 JavaScript 来与 SMIL 交互。在此之前，这里先快速看一下它原始形式下的样子。\n\n如你所见，动画本身是一个实际的 SVG\
  \ 元素，嵌套在被动画化的元素内部（本例中为 `<circle>`）。`<animate>` 元素负责处理大多数 SVG 属性的动画，但在元素变换的情况下（即平移、旋转、缩放或倾斜），必须改用\
  \ `<animateTransform>` 元素。还有一个名为 `<animateMotion>` 的动画元素，专用于让元素沿路径运动。由于我们要旋转和缩放图形，我们将使用\
  \ `<animateTransform>` 元素。\n\n每个变换都需要自己的元素，这使得语法略显冗长。对于第一个变换，即旋转，我们指定了要动画化的 `attributeName`\
  \ 及其类型 `rotate`。我们只有两个需要过渡的状态 `–` 0 度和 360 度 `–` 因此可以使用 `from` 和 `to` 指令来覆盖它们。然后设置持续时间（`dur`）和迭代次数（`repeatCount`），这样第一个变换就完成了。\n\
  \n```javascript\n// 使用 SMIL 旋转第二个形状。\nshapes[1].create('animateTransform').set({\n\
  attributeName: 'transform',\ntype: 'rotate',\nfrom: '0',\nto: '360',\ndur: '5s',\n\
  repeatCount: 'indefinite'\n});\n```\n\n第二个变换稍微复杂一些。它有两个以上的状态，因此我们不使用 `from` 和 `to`\
  \ 属性，而是使用一个可以存储多个状态的 `values` 属性。在本例中，我们提供了一个由分号分隔的变换值列表。我们还需要添加一个额外的 `additive`\
  \ 属性，其值为 `sum`，以便 `scale` 变换能够叠加到（而不是覆盖）之前的 `rotate` 变换上。\n\n```javascript\n// 使用\
  \ SMIL 缩放第二个形状。\nshapes[1].create('animateTransform').set({\nattributeName: 'transform',\n\
  type: 'scale',\nvalues: '1 1; 0.5 1.5; 1 1',\ndur: '5s', additive: 'sum',\nrepeatCount:\
  \ 'indefinite'\n});\n```\n\n现在，第二个形状应该正在缓慢旋转和拉伸，并且其运动应该与我们的 CSS 关键帧示例完全同步。\n\n###\
  \ Web 动画 API\n\nWeb 动画 API，即 WAAPI，是我们即将介绍的方法中最现代的一种。W3C（万维网联盟）正在积极推动它的发展，旨在为 Web\
  \ 动画提供未来方向。除了关键帧和时间选项，它还支持一些高级特性，比如控制播放速率、灵活的缓动功能、与滚动关联的时间线，以及为同一元素应用连续动画（或序列）的能力。\n\
  \n元素可以通过一个命名直观的 `animate()` 方法实现动画，该方法接受两个参数。第一个参数定义关键帧，第二个参数定义时间选项。\n\n```javascript\n\
  element.animate(keyframes, options);\n```\n\n关键帧可以以对象数组的形式提供，也可以是包含数组的对象。时间选项可以以单个值的形式提供\
  \ `–` 具体来说，是一个定义动画时长的毫秒整数 `–` 或是一个包含一个或多个时间相关属性的对象。假设我们要对一个圆的半径 `r` 值进行动画。以下是使用两种语法格式实现此操作的方式：\n\
  \n```javascript\n// 关键帧的第一种格式。\nlet keyframes = [\n{ r: 25 },\n{ r: 40 },\n{ r:\
  \ 25 }\n];\n// 关键帧的第二种格式。\nlet keyframes = {\nr: [25, 40, 25]\n};\n// 时间选项的第一种格式。\n\
  let options = 2000; // 2 秒。\n// 时间选项的第二种格式。\nlet options = {\nduration: 2000,\n\
  iterations: Infinity,\n// ... 等等\n};\n```\n\n在大多数情况下，我更喜欢第二种关键帧格式，因为它更简洁。在实现旋转和缩放示例之前，还有一点需要指出：关键帧之间的间距（或偏移）方式。使用\
  \ CSS 关键帧时，我们需要通过百分比值或 `from` 和 `to` 指令来明确声明关键帧何时触发。使用 Web 动画 API 时，如果没有明确声明，动画的偏移量是*推断*出来的。如果我们有三个关键帧，它们将自动按\
  \ 0、0.5 和 1 的顺序间隔分布（相当于 CSS 中的 0%、50% 和 100%）。但如果需要，我们可以自定义偏移量。在以下示例中，第二个关键帧将在 0.75\
  \ 处触发，而不是默认的 0.5。\n\n```javascript\n// 明确指定偏移量。\nlet keyframes = {\nr: [25, 40,\
  \ 25],\noffset: [0, 0.75, 1]\n};\n```\n\n现在让我们回到示例中，使用 WAAPI 方法实现第三个形状的旋转和缩放。在 SMIL\
  \ 实现下方，按如下方式设置动画。\n\n```javascript\nlet keyframes = {\ntransform: [\n'rotate(0deg)\
  \ scale(1, 1)',\n'rotate(180deg) scale(0.5, 1.5)',\n'rotate(360deg) scale(1, 1)'\n\
  ]\n};\nlet options = {\nduration: 5000,\niterations: Infinity\n};\nshapes[2].animate(keyframes,\
  \ options);\n```\n\n现在，除了一个形状外，其他所有形状应该都在运动。注意 WAAPI 的关键帧语法与我们的 CSS 关键帧示例是多么相似；这并非偶然。Web\
  \ 动画 API 本质上是对现有 Web 动画标准的进一步发展和扩展，因此熟悉 CSS 动画的 Web 开发者应该会觉得其语法直观且（大部分）与已有知识兼容。拥有一个原生的、高级的\
  \ JavaScript API 来在浏览器中创建动画，开启了过去只能通过使用第三方库才能实现的可能性，但这并不是原生 JavaScript 动画技术领域的唯一选择。\n\
  \n### `requestAnimationFrame()` 方法\n\n介绍 `requestAnimationFrame()` 方法，这是一种低层级的递归技术，允许我们接入浏览器的屏幕重绘过程。这与我们之前介绍的方法截然不同；它既非常简单，又非常复杂。通过反复调用一个方法（这就是递归的部分），我们获得了对整个动画过程的完全、精细的控制\
  \ `–` 但这同时也意味着所有事情都必须我们自己来做。像关键帧和时间选项这样的概念，在这个层级并不适用。\n\n`requestAnimationFrame()`\
  \ 方法必须在我们自己定义的、包含每帧要运行的代码的自定义函数内部调用。然后我们将这个自定义函数作为参数传递给 `requestAnimationFrame`，这样它就会在每次屏幕重绘时递归调用。以下是一个关于其工作原理的基本示例。\n\
  \n\n\n```javascript\n// Define the function.\nfunction customFunction() {\n// do\
  \ stuff here...\n// Make the recursive call to requestAnimationFrame().\nrequestAnimationFrame(customFunction);\n\
  }\n// Call the function.\ncustomFunction();\n```\n\n此外，`requestAnimationFrame()`\
  \ 可以向我们的自定义函数传递一个时间戳，这样我们就能根据实时值来同步动画，而不是依赖可能因设备而异的屏幕刷新率。该时间戳包含自动画开始以来经过的毫秒数。现在，让我们继续处理草图，设置一个\
  \ `animate()` 函数，并将时间戳传递给它，以便用它来增加旋转角度。之所以可行，是因为旋转值可以无限递增超过 360° 而仍然保持有效。\n\n```javascript\n\
  // Animate the last shape using requestAnimationFrame.\nfunction animate(time) {\n\
  // Rotate the angle.\nlet angle = time;\n// Apply the rotation.\nshapes[3].set({\
  \ transform: `rotate(${angle})` });\n// The recursive bit.\nrequestAnimationFrame(animate);\n\
  }\nanimate();\n```\n\n好了，这段代码让我们的最后一个形状动了起来，但我们遇到了几个问题。第一，我们的形状旋转速度快得惊人，与其他形状完全不同步。第二，如果你检查控制台，会看到一个错误，大意是我们在旋转变换中提供了一个`undefined`变量。这个错误只出现一次，这说明当我们的函数首次运行时，`angle`（以及`time`）是`undefined`。这很容易修正；我们只需在`time`为`undefined`时将其重新赋值为`0`即可。在声明`angle`之前添加以下代码，应该能让控制台安静下来：\n\
  \n```javascript\n// Prevent errors when the time is undefined on first frame.\n\
  if (time === undefined) time = 0;\n```\n\n现在来解决旋转速度问题。我们可以尝试用任意数值除以`time`，直到它减速到与其它形状同步（或接近同步），但这并不令人满意。相反，让我们用已知的信息来推算：\n\
  \n-   我们的形状应旋转 360°。\n-   这次旋转应耗时五秒（即五千毫秒）。\n-   `time` 以毫秒为单位提供。\n\n基于上述信息，我们可以推导出一个计算式，得出旋转形状的精确速度：每秒\
  \ 0.072°（360° 除以 5,000 毫秒）。用以下代码更新之前`angle`直接等于`time`的语句：\n\n```javascript\n// Rotate\
  \ 360° in 5000ms: 360/5000 = 0.072.\nlet angle = time * 0.072;\n```\n\n这应该能让我们的形状与其他形状同步旋转。然而，让它同步缩放则更具挑战性。为此，我们首先需要在动画循环之外初始化一些变量，这些变量可以帮助我们跟踪某些状态。为什么？因为如果我们试图在循环内部创建这些状态，它们会在每次迭代时被覆盖。缩放增量值需要在上下限之间来回摆动，实现这一目标最直接的方法是跟踪当前缩放值及其极性（即它是向一个方向摆动还是向另一个方向摆动）。为此，我们需要一个布尔值，可以像开关一样来回切换。我们还需要一种方法，使缩放值随时间同步递增，但不直接使用时间戳值，因为那样只会让它无限递增。\n\
  \n考虑到以上几点，让我们在`animate()`函数之前初始化以下变量：\n\n```javascript\nlet isPositive = true;\n\
  let scale = 0, tick = 0, prevTime = 0;\n```\n\n按如下方式更新动画循环。注释承担了主要的解释工作，因此为了更好地理解每一步，请务必仔细阅读注释。这里的主要收获是，与其他方法相比，使用`requestAnimationFrame()`需要我们做更多的工作。\n\
  \n```javascript\n// Animate the final shape using requestAnimationFrame.\nfunction\
  \ animate(time) {\n// Prevent errors when the time is undefined on first frame.\n\
  if (time === undefined) time = 0;\n// Rotate 360° in 5000ms: 360/5000 = 0.072.\n\
  let angle = time * 0.072;\n// We need a constant tick value that doesn't increment\
  \ indefinitely.\ntick = time - prevTime;\n// Scale by 0.5 in 2500ms: 0.5/2500 =\
  \ 0.0002.\nscale = isPositive ? scale + (tick * 0.0002) : scale - (tick * 0.0002);\n\
  // Apply the rotation and scale values.\nshapes[3].set({\ntransform: `rotate(${angle})\
  \ scale(${1 - scale}, ${1 + scale})`\n});\n// Flip the polarity if the scale value\
  \ falls outside these bounds.\nif (scale < 0) isPositive = !isPositive;\nif (scale\
  \ > 0.5) isPositive = !isPositive;\n// Capture the time before it increments.\n\
  prevTime = time;\n// The recursive bit.\nrequestAnimationFrame(animate);\n}\nanimate();\n\
  ```\n\n现在我们应该能让最后一个形状与其他形状同步旋转和缩放了（或多或少有些偏差）。在某些情况下，你可能会注意到旋转有轻微偏移，或者缩放速度比预期的稍快一些。像这样的差异，更多是与浏览器自动调度和处理其他动画方法的优化有关，而不是`requestAnimationFrame()`本身的性能问题。这些动画方法本意并非像我们在本练习中那样组合使用；通常你会根据要实现的目标，选择一种方法并坚持使用。\n\
  \n### 方法总结\n\n那么，对于生成艺术来说，应该选择哪种方法呢？这个问题没有确定的答案，但以下是我的建议（需要说明的是，这并不是对每种方法优缺点的全面分析，而是从我不可避免的带有偏见的视角进行的大致比较）。CSS\
  \ 关键帧更适用于较短的序列，例如动画加载指示器（本身就是一门艺术）、用户体验增强，以及可访问性或浏览器兼容性重要的动画。对于更复杂的序列，它们会很快变得复杂且难以编辑。特别是对于\
  \ SVG 动画，使用 CSS 时许多属性是无法访问的，例如蒙版、裁剪路径和渐变。\n\n使用 SMIL，你拥有一个原生支持 SVG、设计精良的动画格式，并且可以访问所有支持动画的属性。与其他方法不同，当\
  \ SVG 作为图片嵌入时（类似于 gif），它还能保留动画。缺点呢？它可能会变得相当冗长，而且未来前景相当不明朗（早在 2015 年，Chrome 就停止了对\
  \ SMIL 的支持，但这一决定很快被撤销了）。\n\nWeb Animations API（WAAPI）是最现代的动画方法，比 CSS 或 SMIL 拥有更高级的能力，通常也更灵活、更简洁。对于生成艺术，我会推荐它胜过\
  \ CSS 或 SMIL，但它确实有其局限性。它不适用于开放式、探索性的动画（即我们对最终结果不确定的情况）。与 CSS 和 SMIL 一样，所有内容都需要精心编排且有明确意图。要走向“完全生成式”，我们需要像`requestAnimationFrame()`这样更底层的工具。\n\
  \n是的，`requestAnimationFrame()`可能会让我们在一条相当艰难的道路上跋涉，以取得相对微薄的成果，但反过来，更复杂的结果在很多情况下可以通过比其他方法更简单、更优雅的方式实现（我将在下一个关于碰撞检测的例子中演示这一点）。我们只需要在最初克服困难后坚持下去。\n\
  \n另外值得注意的是，市面上有许多可靠的第三方库可以帮助您使用 SVG 制作动画；特别值得一提的是 GreenSock 动画平台 (GSAP)，它功能非常丰富，并提供强大的性能和令人印象深刻的向后兼容性。不过它并非开源，并且其部分插件仅对付费订阅者开放。`Anime.js`\
  \ 是一个不错的开源替代品。\n\n\n\n## 碰撞检测\n\n我们与生成式作品互动以影响其输出是一回事，但当它开始与*自身*互动时，则完全是另一回事。这本质上就是碰撞检测的核心内容。我们将以一个使用矩形边界作为基本碰撞屏障的示例进行探索，并在大家对此记忆犹新时，运用`requestAnimationFrame()`方法。\n\
  \n### 设定边界\n\n那么按照常规流程——从模板创建一个新文件夹，将其重命名为`19-collision-detection`，并在背景色下方开始编码。我们要做的第一件事是创建一个样式类似画框的`rect`。这种效果是通过在半透明填充上叠加描边实现的；描边的一半画在框架外部，一半画在内部（稍后我们在计算碰撞检测时需要考虑到这一点）。这个画框的大小将是随机生成的，因此我们设置一个`frameSize`变量来捕获这个值，并利用它来保持其他元素（如`stroke-width`）的比例协调。\n\
  \n```\n// 创建一个画框作为边界。\nlet frameSize = Gen.random(350, 700);\nlet frame = svg.create('rect').set({\n\
  \  x: (1000 - frameSize) / 2,\n  y: (1000 - frameSize) / 2,\n  width: frameSize,\n\
  \  height: frameSize,\n  fill: '#252525',\n  stroke: `hsl(${Gen.random(0, 360)}\
  \ 80% 80% / 0.25)`,\n  stroke_width: frameSize / 10,\n});\n```\n\n### 初始化并扩展形状\n\
  \n画框已就位，现在让我们用一些大小不等的圆形来填充它。目标是让这些圆形从中心向四周爆发散开，有的迅速疾冲，有的缓慢漫步，当它们碰到画框边界时，全部都会反弹回来。接下来，我们将先初始化圆形并填充一个数组，就像我们在之前的示例中所做的那样。\n\
  \n```\n// 随机确定圆形数量并设置一个空数组。\nlet numCircles = Math.floor(frameSize / 20);\nlet circles\
  \ = [];\n\n// 填充这个数组。\nfor (let i = 0; i < numCircles; i += 1) {\n  // 根据画框尺寸随机化半径。\n\
  \  let radius = Gen.random(frameSize / 100, frameSize / 25);\n\n  // 应用上述变量并随机化色相。\n\
  \  let circle = svg.create('circle').set({\n    cx: 500,\n    cy: 500,\n    r: radius,\n\
  \    fill: `hsl(${Gen.random(0, 360)} 80% 80% / 0.5)`\n  });\n\n  // 将圆形存储到数组中。\n\
  \  circles.push(circle);\n}\n```\n\n现在我们的圆形都聚集在中心，但它们还没有预备好移动。我们有办法追踪它们的位置（通过`cx`和`cy`属性），但还没有属性来追踪它们的速度或方向，而如果我们要实现碰撞检测，这些是必需的。\n\
  \n幸好 SvJs 元素很容易扩展。如果我们想给元素添加一个新属性，只需在`set()`方法中包含它即可。如果它不是有效的 SVG 属性，不会对渲染出的 SVG\
  \ 产生任何影响，但这没关系——我们只是希望将它存储起来，以便稍后用于碰撞检测计算。\n\n我们至少需要两个新属性：一个用于追踪 x 轴上的速度，另一个用于追踪\
  \ y 轴上的速度。要确定方向，我们可以使用相同的属性并通过反转正负号来改变方向。例如，x 轴上的正数表示从左到右的运动，负数则表示从右到左的运动。在 y 轴上，正数表示向下运动，负数表示向上运动。\n\
  \n设置这些新属性将分为两步。我们首先设置变量`velocityX`和`velocityY`来捕获随机化的速度。然后我们要设置的属性将简单地命名为`vx`和`vy`，并使用`Gen.chance()`来随机化它们的正负号（因此它们有\
  \ 50% 的概率为正或负）。将相关代码更新如下：\n\n```\n// 创建变量控制 x 轴和 y 轴的速度。\nlet velocityX = Gen.random(0.1,\
  \ 5, true);\nlet velocityY = Gen.random(0.1, 5, true);\n\n// 应用上述变量并随机化色相。\nlet\
  \ circle = svg.create('circle').set({\n  cx: 500,\n  cy: 500,\n  r: radius,\n  vx:\
  \ Gen.chance() ? velocityX : -velocityX,\n  vy: Gen.chance() ? velocityY : -velocityY,\n\
  \  fill: `hsl(${Gen.random(0, 360)} 80% 80% / 0.5)`\n});\n```\n\n### 逐帧计算\n\n判断我们的某个圆形是否与边界（即画框边缘）发生碰撞，需要持续检查每个圆形的位置。因此，`requestAnimationFrame()`实际上是模拟碰撞检测唯一可行的方法，因为这些检查需要逐帧进行。\n\
  \n接下来会有一大段代码，但我会解释其中的重要部分。你会注意到，当我们获取任何属性时，都会用`Number()`方法将它们包裹起来。这是因为我们的属性会以字符串形式返回，而我们要用它们进行可靠的计算时，希望明确地将它们当作数值来处理，而不是依赖\
  \ JavaScript 的隐式类型转换（它有时可能正确，但会让你容易遇到 bug）。\n\n以下是我们将要实现的算法概要。首先，我们计算下边界和上边界（即画框边缘）。然后，对于每个圆形：\n\
  \n* 我们检索位置和速度并将其存储为变量。\n* 如果 x 变量小于或等于下边界或上边界，我们反转 x 速度变量的正负号。\n* 我们对 y 轴重复上一步。\n\
  * 然后根据计算出的速度更新 x 和 y 变量。\n* 最后，将更新后的变量应用到圆形元素上。\n\n以下是具体的编码版本：\n\n```\n// 获取下边界和上边界（画框边缘），以便在循环中使用。\n\
  let lowerBound = Number(frame.get('x'));\nlet upperBound = lowerBound + frameSize;\n\
  \n// 动画循环。\nfunction animate() {\n  // 检查每个圆形的碰撞情况。\n  circles.forEach((circle)\
  \ => {\n    // 检索位置和速度。\n    let cx = Number(circle.get('cx'));\n    let cy = Number(circle.get('cy'));\n\
  \    let vx = Number(circle.get('vx'));\n    let vy = Number(circle.get('vy'));\n\
  \n    // 检查碰撞，如果发现则反转正负号。\n    if (cx <= lowerBound || cx + (radius * 2) >= upperBound)\
  \ vx = -vx;\n    if (cy <= lowerBound || cy + (radius * 2) >= upperBound) vy = -vy;\n\
  \n    // 更新位置。\n    cx += vx;\n    cy += vy;\n\n    // 设置新值。\n    circle.set({ cx:\
  \ cx, cy: cy, vx: vx, vy: vy });\n  });\n\n  // 递归部分。\n  requestAnimationFrame(animate);\n\
  }\n\n// 调用动画。\nanimate();\n```\n\n如果你此时观看动画，会发现圆形确实在画框边缘附近反弹，但这并不精确，而且似乎还因圆形大小不同而有所不同。看起来我们在计算中遗漏了一些东西。\n\
  \n要修复这个问题，我们需要考虑到画框边框是内嵌的这一事实；也就是说，`stroke`一半在框架内部，而每个圆形的半径也不同。这意味着`lower bound`和`upper\
  \ bound`变量必须在动画循环*内部*计算，因为它们会随每个圆形而变化。不过，有几个静态值可以在循环外部捕获并在循环内部使用：画框边缘和画框内嵌量。删除`lower\
  \ bound`和`upper bound`变量，并将其替换为以下内容：\n\n```\n// 获取画框边缘点（x 或 y）和内嵌量。\nlet frameEdge\
  \ = Number(frame.get('x'));\nlet frameInset = Number(frame.get('stroke-width'))\
  \ / 2;\n```\n\n现在，在循环内部，我们可以计算出正确的`lower bound`和`upper bound`值。\n\n\n\n```\n// 动画循环。\n\
  function animate() {\n  // 检查每个圆形的碰撞。\n  circles.forEach((circle) => {\n    // 计算每个圆形的上下边界。\n\
  \    let radius = Number(circle.get('r'));\n    let lowerBound = frameEdge + radius\
  \ + frameInset;\n    let upperBound = frameEdge + frameSize - radius - frameInset;\n\
  \    // ... 其余代码不变。\n  }\n```\n\n这样就能实现精确的碰撞检测；图 7-3 展示了这一过程的冻结帧。你可以在此基础上进行多种拓展——例如加入随机因素，尝试追踪光标位置，或随时间改变颜色。无论如何，我们已经迈出了走向完整物理模拟的第一步（这个话题远超本书范围，但我鼓励你独立探索）。\n\
  \n![](img/538894_1_En_7_Fig3_HTML.png)\n\n一幅抽象图呈现出一个方形结构，其中有一个带有淡化外层的正方形，以及一团色彩渐变的圆形，背景为深色。\n\
  \n**图 7-3** 多彩碰撞检测\n\n### 循环往复\n\n本章将回归 JavaScript Web Animations API 来画上句号。在此过程中我们会涉及三角函数，但只是浅尝辄止（如果你能领会这个双关语，说明你状态不错！），因为主要目的是为你提供一些灵感，而非用复杂的数学困扰你。\n\
  \n让我们创建一个名为 `20-circular-loop` 的新示例文件夹，并复制模板文件夹。目标是创建一个由许多圆形组成的循环动画，这些圆形本身又排列成一个大圆形；这类动画极具催眠潜力。我们将从背景下的常规位置开始，初始化一些随机变量。\n\
  \n```\n// 随机化一些变量。\nlet numCircles = Gen.random(20, 35);\nlet baseRadius = Gen.random(5,\
  \ 25, true);\nlet hue = Gen.random(0, 360);\n```\n\n我们将用 `numCircles` 来控制循环运行的次数，以及分配这些圆形所需的计算。`baseRadius`\
  \ 和 `hue` 将作为起始值。现在，按如下方式创建循环和圆形，暂时省略 `cx` 和 `cy` 属性（我们将在下一节计算它们）。\n\n```\n// 设置循环。\n\
  for (let i = 0; i < numCircles; i += 1) {\n  // 创建圆形，但先不设置位置或半径。\n  let circle =\
  \ svg.create('circle').set({\n    r: baseRadius,\n    fill: 'none',\n    stroke:\
  \ `hsl(${hue} 80% 80% / 0.75)`,\n    transform_origin: '500 500'\n  });\n}\n```\n\
  \n#### π 的切片\n\n这里就是前面提到的三角函数的切入点。要计算每个圆形的分布（即它们的 `cx` 和 `cy` 坐标），我们需要借助一些 JavaScript\
  \ 内置的 `Math` 方法和属性。首先是 `Math.PI`，这是一个属性，返回 \U0001D745（3.14）的近似值，\U0001D745 是一个数学常数，表示圆的周长（沿其边界的长度）与直径（半径的两倍）之比。图\
  \ 7-4 展示了这些值。\n\n![](img/538894_1_En_7_Fig4_HTML.png)\n\n一幅抽象图呈现出一个方形结构，其中有一个圆形，标有周长、半径和直径，背景为深色。\n\
  \n**图 7-4** 圆的周长、直径和半径\n\n你可能习惯用度数表示角度，但在 JavaScript 中，角度默认以弧度为单位测量。一弧度约等于圆周长上的一段等于半径的长度（如图\
  \ 7-5 所示）。需要略多于六个这样的弧度（约 6.28）才能环绕整个圆周。而 6.28 的一半就是 \U0001D745，即 3.14。\n\n![](img/538894_1_En_7_Fig5_HTML.png)\n\
  \n一幅抽象图呈现出一个方形结构，其中有一个圆形，标有六个弧度。一弧度约等于圆周长上等于半径的长度，数值标有 3.14 和 6.28。\n\n**图 7-5**\
  \ 弧度与 \U0001D745 和圆周的关系\n\n关键点是什么？`Math.PI` 弧度相当于 180°，因此 `Math.PI * 2` 表示一个完整的圆（360°）。所以在我们的循环中，我们将相对于\
  \ `Math.PI * 2` 递增放置圆形的角度。为了确保圆形在圆周上均匀分布，我们将 `Math.PI * 2` 除以 `numCircles`，每次循环运行时，将其乘以迭代器，从而移动到下一个“切片”。\n\
  \n在循环内，定义好圆形元素后，添加以下代码：\n\n```\n// 计算当前角度。\nlet angle = Math.PI * 2 / numCircles\
  \ * i;\n```\n\n#### 正弦与余弦\n\n一旦有了角度，就需要获取对应的正弦和余弦值，你可以将它们视为 x 和 y 坐标。这里我们不深入细节；只需说明，`Math.sin()`\
  \ 和 `Math.cos()` 方法能完美配合，产生圆周运动。\n\n```\n// 获取角度的正弦和余弦值。\nlet sin = Math.sin(angle);\n\
  let cos = Math.cos(angle);\n```\n\n值得注意的是，这些方法本身就非常有用，尤其适用于运动，因为它们能产生平滑、振荡的值。然而，在当前场景中，我们将仅限使用这些值来定位圆形，而不是让它们动起来。为了定位，我们需要将正弦和余弦值映射到更可用的范围，因为默认情况下它们返回\
  \ -1 到 1 之间的值。\n\n我们将相对于 `viewBox` 的中心（即 x 轴和 y 轴均为 500）来定位圆形，并将其重新映射到 700 的范围内。这样得到\
  \ 150 和 850，即中心两侧各 -350 和 +350。\n\n```\n// 将正弦和余弦映射到所需范围。\nlet cx = Gen.map(sin,\
  \ -1, 1, 200, 800, false);\nlet cy = Gen.map(cos, -1, 1, 200, 800, false);\n```\n\
  \n#### 让圆形动起来\n\n现在我们可以尝试一个基础动画。先从简单的开始，让圆形从中心向外移动到我们刚才定义的 `cx` 和 `cy` 坐标。\n\n```\n\
  // 从 (500, 500) 移动到 (cx, cy)。\ncircle.animate({\n  cx: [500, cx, 500],\n  cy: [500,\
  \ cy, 500],\n}, {\n  duration: 10000,\n  iterations: Infinity,\n  easing: ['ease-in-out']\n\
  });\n```\n\n这能让圆形动起来，但这个序列并不特别有趣。让我们增加更多变化：设置初始和目标半径，利用迭代器值让每个圆形的半径都不同，同时让整个动画旋转起来。在结束循环之前，根据圆形的数量递增\
  \ `hue` 值，以获得漂亮的色彩分布。\n\n```\n// 设置初始和目标半径。\nlet r1 = baseRadius * 2 + (i * 10);\n\
  let r2 = baseRadius / (i + 10);\n// 从 (500, 500) 移动到 (cx, cy)，缩小半径，旋转。\ncircle.animate({\n\
  \  cx: [500, cx, 500],\n  cy: [500, cy, 500],\n  r: [r1, r2, r1],\n  transform:\
  \ ['rotate(0deg)', 'rotate(360deg)']\n}, {\n  duration: 10000,\n  iterations: Infinity,\n\
  \  easing: ['ease-in-out']\n});\n// 递增色相值。\nhue = (hue % 360) + (180 / numCircles);\n\
  ```\n好了……这样就大大逼近了我们想要实现的催眠吸引力。请参见图 7-6，这是动画进行到约 15% 时的快照。\n\n![](img/538894_1_En_7_Fig6_HTML.png)\n\
  \n一幅抽象图呈现出一个方形结构，其中有一团圆形呈旋转模式，背景为深色。\n\n**图 7-6** 使用 Web Animations API 实现圆形循环\n\
  \n## 总结\n\n就概念和内容而言，这或许是迄今为止最密集的一章，但我希望你在跟随学习的过程中也获得了一些乐趣。快速回顾一下，我们涵盖了以下内容：\n\n\
  * 事件监听器、事件类型和事件参数\n* 如何保存我们的 SVG 标记\n\n\n\n## 如何使用光标追踪制作交互式草图\n\n*   如何使用光标追踪制作交互式草图\n\
  *   使用 CSS 关键帧进行动画\n*   使用 SMIL 进行动画\n*   Web 动画 API\n*   使用 `requestAnimationFrame()`\
  \ 方法进行动画\n*   基本碰撞检测\n*   非常基础的三角学\n\n在下一章也是最后一章中，我们将重点介绍 SVG 滤镜。\n\n"
- "# 8. 滤镜效果\n\n除了 SVG 提供的所有矢量功能（正如你从名为“可缩放矢量图形”的格式中所期望的那样），SVG 还以 `<filter>` 元素的形式提供了一些非常强大的基于像素的效果。在\
  \ GIMP 或 Photoshop 等编辑器中常见的许多图像处理操作，例如模糊、投影和扭曲，实际上也可以在 SVG 中实现。在本章中，我们将学习如何实现这些效果。\n\
  \n我们不会以任何全面的方式涵盖 SVG 滤镜的功能；那至少需要一本专门的书籍。这是一个庞大的主题，其创作潜力——至少在美学上——常常被忽视。制作出外观糟糕的\
  \ SVG 滤镜非常容易。我将努力避免这个陷阱，并更多地是从生成艺术家的角度，而不是图像编辑器的角度，来呈现一部分滤镜。\n\n### 滤镜基础\n\n在我们深入探讨具体的滤镜效果之前，我们需要了解它们的结构。一个滤镜由一个\
  \ `<filter>` 元素和一个或多个滤镜图元组成。这些图元本身也是元素，它们嵌套在主滤镜元素内部，并且都以字母 `fe`（代表滤镜效果）开头，后跟一个描述性名称。每个图元执行其自身的操作，并且可以通过一系列输入和输出以节点方式连接到其他图元。\n\
  \n让我们看一个仅使用单个图元的原始标记形式的基本示例。\n\n正如你所见，`<filter>` 元素必须嵌套在 `<defs>` 元素内部；与渐变和图案一样，它只有在通过\
  \ `url` 链接到其 `id` 时才会被渲染。在前面的例子中，一个黄色圆圈通过其自身的 `filter` 属性调用滤镜，结果（如图 8-1 所示）是一个柔和的模糊效果，由一个名为\
  \ `feGaussianBlur` 的图元控制。\n\n![](img/538894_1_En_8_Fig1_HTML.png)\n\n一幅抽象画，呈现一个明亮的圆形，背景为深色。\n\
  \n**图 8-1**\n一个模糊的圆形\n\n### 输入与输出\n\n让我们检查一个稍微复杂一些的例子，这次说明滤镜图元如何连接在一起。结果将是一个应用到圆形描边的投影，如图\
  \ 8-2 所示。\n\n![](img/538894_1_En_8_Fig2_HTML.png)\n\n一幅抽象画，呈现一个带有渐隐外层的圆形，背景为深色。\n\
  \n**图 8-2**\n一个投影滤镜效果\n\n与之前的例子一样，我们从一个 `feGaussianBlur` 图元开始，但你会注意到添加了几个属性：`in`\
  \ 和 `result`。这些属性也出现在它后面的图元 `feOffset` 中。在最后一个滤镜图元 `feComposite` 中，`in` 也存在，还有 `in2`。这些意味着什么？\n\
  \n*   `in` 指的是滤镜图元的输入源。\n*   `in2` 指的是第二个输入源（如果滤镜图元支持此功能）。\n*   `result` 是我们用来标记滤镜图元输出的内容，然后可以将其用作另一个图元的输入。\n\
  \n如果一个滤镜图元是其链中的第一个（如上面的 `feGaussianBlur`），`in` 将默认为 `SourceGraphic`；否则，它将默认为前一个图元的\
  \ `result`。`SourceGraphic` 仅指应用滤镜的图形元素。`SourceAlpha` 也指同一个图形元素，但仅限于其 Alpha 通道（即其不透明度值）。\n\
  \n所以这是第二个例子中发生的事情：\n\n1.  `feGaussianBlur` 图元将圆形的 `SourceAlpha` 作为其输入，并对其应用高斯模糊效果。结果（或输出）被命名为\
  \ `blur`。\n2.  `feOffset` 图元将 `blur` 结果作为其输入，并沿着 Y 轴对其进行偏移，此结果被标记为 `offset`。\n3.\
  \  `feComposite` 图元将我们原始的 `SourceGraphic` 作为第一个输入 `in`，并将 `offset` 的结果作为其第二个输入 `in2`，将它们重新组合在一起。\n\
  \n我们稍后将更详细地讨论其中一些图元，但接下来我们将看看如何从标记转移到使用 `SvJs` 编写滤镜脚本。\n\n### SvJs 的 createFilter()\
  \ 方法\n\n也许并不奇怪，`SvJs` 有自己的 `createFilter()` 方法来加速滤镜创建过程。它只需要一个参数：一个 `id`，这个 `id`\
  \ 在将滤镜应用于目标元素时使用。与 `createGradient()` 和 `createPattern()` 方法一样，合理的默认值会被初始化，并且检查\
  \ `defs` 元素是否已存在的工作会在后台处理。\n\n以下是我们之前第一个例子的 `SvJs` 等效代码，将一个柔和的模糊应用于一个黄色圆形（图 8-1）。\n\
  \n```javascript\n// 初始化滤镜。\nlet filter = svg.createFilter('blur');\n// 创建模糊效果。\n\
  filter.create('feGaussianBlur').set({ stdDeviation: 10 });\n// 应用滤镜。\nsvg.create('circle').set({\n\
  \    r: 350, cx: 500, cy: 500, fill: 'yellow', filter: 'url(#blur)'\n});\n```\n\n\
  ### 滤镜区域\n\n当一个滤镜被应用于一个元素时，其活动区域会超出该元素的范围。这允许效果有一定的空间“渗出”（借用印刷术语）。这个空间被称为滤镜区域，一旦滤镜效果超出此区域，就会发生裁剪（见图\
  \ 8-3）。\n\n![](img/538894_1_En_8_Fig3_HTML.png)\n\n一幅抽象画，呈现一个模糊的明亮圆形，背景为深色。\n\n\
  **图 8-3**\n一个被裁剪的滤镜区域\n\n在生成艺术中，我们有时会超出滤镜效果参数预期的值范围，因此如果你的滤镜效果意外被裁剪，了解这个区域很重要。滤镜区域的定义方式与\
  \ `rect` 元素相同：通过 `x`、`y`、`width` 和 `height` 属性。默认情况下，这些值如下：\n\n```\nx: '-10%'\n\
  y: '-10%'\nwidth: '120%'\nheight: '120%'\n```\n\n百分比值是相对于应用滤镜的形状而言的，所以在上述情况下，这相当于在滤镜元素周围有\
  \ `10%` 的内边距。`SvJs` 将此滤镜区域扩大到 `25%`，留出更多尝试空间。如果你需要进一步调整，可以轻松地使用 `set()` 方法进行：\n\n\
  ```javascript\nfilter.set({ x: '-15%', y: '-15%', width: '130%', height: '130%'\
  \ });\n```\n\n## 滤镜效果 101\n\n让我们继续看一些简单的自定义滤镜效果。我们已经看到 `feGaussianBlur` 图元在运行，所以我不会在这里单独为它设立一个小节，但值得在继续之前提一下，它的主要属性\
  \ `stdDeviation` 实际上也可以接受两个值，而不仅仅是一个。如果你提供两个值，第一个数字将控制 X 轴上的模糊，第二个数字控制 Y 轴上的模糊。\n\
  \n```javascript\n// 创建一个“运动”模糊效果。\nfilter.create('feGaussianBlur').set({ stdDeviation:\
  \ '20 0' });\n```\n\n### 阴影\n\n我们之前使用三个连接的滤镜图元实现了一个投影，但实际上有一个更简单的方法。在 SVG 规范较新的修订版中，引入了\
  \ `feDropShadow` 图元，它可以接受最多五个属性：`dx`，定义阴影在 X 轴上的偏移；`dy`，对 Y 轴进行同样的操作；`stdDeviation`，控制阴影的模糊程度；以及另外两个可选属性\
  \ `flood-colour` 和 `flood-opacity`，可以修改阴影的颜色和透明度。\n\n\n\n```markdown\n下面展示了如何使用\
  \ `SvJs` 和 `feDropShadow` 图元重写图 8-2 的代码。\n\n```\n// 初始化滤镜\nlet filter = svg.createFilter('shadow');\n\
  // 创建投影\nfilter.create('feDropShadow').set({ dx: 0, dy: 50, stdDeviation: 25 });\n\
  // 应用滤镜\nsvg.create('circle').set({\n// ... 其他属性\nfilter: 'url(#shadow)'\n});\n\
  ```\n\n### 着色\n\n我们之前提到过一些名为 `flood-colour` 和 `flood-opacity` 的属性，它们可以与 `feDropShadow`\
  \ 图元一起使用。还有一个图元也可以应用这些属性，并且这些属性最初就属于它：`feFlood`。`feFlood` 图元非常基础；它不需要输入，仅用特定颜色和不透明度填充滤镜区域。它本身并不特别有趣，但与其他图元结合时会很有用。\n\
  \n还有其他功能更强的颜色相关图元，名为 `feColorMatrix` 和 `feComponentTransfer`。后者过于高级，超出了本书的范围，因此我们将限定于\
  \ `feColorMatrix` 和 `feFlood`。让我们搭建一个草图来使用它们。\n\n不必复制我们的模板文件夹，而是复制第一个网格示例，我将其标记为\
  \ `07-regular-grids`（参见第 4 章）。将此文件夹复制并重命名为类似 `21-colour-filter` 的名称。保持其余代码不变，将嵌套\
  \ `for` 循环的主体替换为以下代码：\n\n```\nif (Gen.chance(55)) {\ngrid.create('rect').set({\n\
  x: x, y: y, width: cellSize, height: cellSize,\nfill: `rgb(\n${[Gen.random(0, 255),\
  \ Gen.random(0, 255), Gen.random(0, 255)]}\n)`\n});\n}\n```\n\n每次刷新时，这应该会为我们生成一个随机排列的彩色瓷砖网格。到目前为止，我们在颜色使用上一直比较克制，主要控制\
  \ `hsl()` 函数的色相分量。这次我们将释放完整的 `rgb` 色彩光谱，因此结果可能从戏剧性、动态到花哨刺耳不等（参见图 8-4 的示例输出）。我喜欢这些结果中的某些效果；然而，着色有时可能会变得有些不协调。因此，让我们使用一些滤镜来约束颜色，同时保留动态范围。\n\
  \n![](img/538894_1_En_8_Fig4_HTML.png)\n\n一幅抽象图，呈现出一组彩色渐变的方块，背景为深色。\n\n**图 8-4**\
  \ 全光谱 RGB 瓷砖\n\n第一步是降低颜色的饱和度。为此，我们可以使用 `feColorMatrix` 图元，它接受两个参数：`type` 和 `values`。可接受的\
  \ `values` 取决于 `type`，可以如下所示：\n\n- `saturate`：决定输入的色彩饱和度。它接受介于 `0`（无饱和度）和 `1`（完全饱和度）之间的\
  \ `values`，但浏览器可能接受更高的值以实现过饱和。\n- `hueRotate`：按指定角度旋转色相值，该角度在 `values` 中设置。例如，将\
  \ `values` 设置为 `180` 会反转输入来源的所有色相值。\n- `luminanceToAlpha`：将输入的亮度转换为 alpha 值，不需要\
  \ `values`。\n- `matrix`：这是 `feColorMatrix` 类型中最复杂、最强大的一种。它接受一个 5x5 的颜色变换矩阵作为 `values`，该矩阵与输入来源的像素分量值进行矩阵乘法。它有点过于高级，不适合在本章深入探讨。\n\
  \n在上述类型中，`saturate` 正是我们需要的。要从输入中抽去颜色，我们需要将 `values` 设置为 `0`。现在让我们设置一个滤镜来实现这一点。在草图的底部，按如下方式初始化一个新的\
  \ `filter`：\n\n```\n// 初始化滤镜\nlet filter = svg.createFilter('colourise');\n// 降低输入饱和度\n\
  filter.create('feColorMatrix').set({\ntype: 'saturate',\nvalues: 0,\nresult: 'desaturate'\n\
  });\n// 应用滤镜\ngrid.set({ filter: 'url(#colourise)' });\n```\n\n这应该会产生一个灰度网格。接下来，我们要选择一种颜色与其混合，为此我们将使用\
  \ `feFlood` 图元。在 `feColorMatrix` 图元和最后一行应用滤镜的代码之间，添加以下代码：\n\n```\n// 设置泛色\nfilter.create('feFlood').set({\n\
  flood_color: '#7F462C',\nresult: 'flood'\n});\n```\n\n这应该会在合成中添加一种棕褐色。问题在于？它简单地淹没了画布，覆盖了所有其他内容。我们需要一种方法将其与\
  \ `feColorMatrix` 去饱和的 `result` 混合。\n\n### 混合\n\n大多数矢量图像编辑应用程序都内置了混合功能，形式为图层混合模式。SVG\
  \ 在滤镜层面通过 `feBlend` 图元支持此功能。混合模式定义了元素重叠时颜色如何相互作用（无论元素是单个形状还是整个图层）。例如，如果混合模式设置为 `multiply`，最终颜色是顶部颜色乘以底部颜色的结果，这会产生类似透明胶片重叠的效果。如果设置为\
  \ `screen`，顶部和底部颜色会被反转、相乘、再反色，从而产生类似两张图像投射到投影屏幕上的效果。\n\nSVG 规范支持多种混合模式，逐一描述超出了本章的范围，但如需全面了解（包括交互式示例），请查看\
  \ `developer.mozilla.org/docs/Web/CSS/blend-mode` 上的 MDN 条目。\n\n实际上，有几种混合模式在我们的案例中效果很好，所以我打算将这些模式存储在一个数组中，以便稍后选择。在初始化滤镜之前包含以下代码：\n\
  \n```\n// 设置混合模式数组\nlet blendModes = ['screen', 'overlay', 'lighten', 'color-dodge',\
  \ 'soft-light', 'color'];\n```\n\n接下来，在我们定义了 `feFlood` 图元之后，设置 `feBlend` 图元。我们将随机化其\
  \ `mode` 属性，并将第一个输入设置为泛色，第二个输入设置为去饱和的网格。\n\n```\n// 随机化混合模式\nfilter.create('feBlend').set({\n\
  mode: Gen.random(blendModes),\nin: 'flood',\nin2: 'desaturate',\nresult: 'blend'\n\
  });\n```\n\n第一个输入 `in` 作为我们的顶部颜色，第二个输入 `in2` 作为我们的背景颜色。此时，我们的网格应该以着色形式重新出现，但前景中仍然有泛色。我们需要一种方法将其剥离，这就引出了下一节。\n\
  \n### 合成\n\n如果你看过一些最爱的电影幕后花絮，很可能见过绿幕技术：攀爬摩天大楼的动作英雄，实际上挂在一根绳子上，背景是绿色织物。这种技术可以更容易地将背景从前景中剥离，之后与单独拍摄的素材结合。合成就是将这两个不同的元素融合在一起的过程；两个来源合并为一体。它在许多方面与混合相似，但结果更为明显和可编程。它更多地与元素如何相交有关，而非颜色如何融合，可供使用的各种合成操作可以产生非常不同的结果。相比之下，混合在其输出上往往更为统一。\n\
  \n`feComposite` 图元允许我们在 SVG 中执行合成操作。它接受两个输入 `in` 和 `in2`，其 `operator` 属性有七个可能的值：`over`、`in`、`atop`、`xor`、`out`、`lighter`\
  \ 和 `arithmetic`。在图 8-5 中，我展示了其中六种；`arithmetic` 运算符没有固定的输出（它是完全可自定义的），并且过于复杂，无法在本章中恰当覆盖。\n\
  \n![](img/538894_1_En_8_Fig5_HTML.jpg)\n```\n\n\n\n一张图示展示了 `in` 和 `in2` 两种操作的六种效果，包括重叠的正方形、两个淡化的重叠正方形中有一个高亮的小正方形、一个大正方形包含一个小正方形、两个重叠正方形中有一个深色小正方形、一个\
  \ L 形亮色正方形，以及一个更亮的正方形。\n\n**图 8-5**  \nSVG 七种合成操作中的六种\n\n由于 `feComposite` 图元非常有用，并且在进一步探索\
  \ SVG 滤镜时您很可能会依赖它，因此值得详细描述每个预设操作符。在图 8-5 中，我们可以将 `in` 视为前景，将 `in2` 视为绿幕背景。\n\n*\
  \   `over`：这是默认操作符，前景简单地放置在背景之上。\n*   `in`：前景与背景重叠的部分成为新的输出。\n*   `atop`：保留前景与背景重叠的部分；其余的前景部分被裁剪掉。\n\
  *   `xor`：保留前景和背景中不重叠的部分；其余部分被移除。这本质上是 `in` 操作符的逆操作。\n*   `out`：显示前景中位于背景外部的部分。\n\
  *   `lighter`：前景和背景的重叠区域被相加（产生增亮效果）。\n*   `arithmetic`：如果选择此操作符，必须定义四个额外的数值属性：`k1`、`k2`、`k3`\
  \ 和 `k4`。输出结果由以下公式定义：`(k1 * i1 * i2) + (k2 * i1) + (k3 * i2) + k4`，其中 `i1` 和 `i2`\
  \ 分别代表 `in` 和 `in2`。是的，这确实很复杂！但使用此操作符可以获得最微妙且可定制的结果，因此非常值得独立探索。\n\n如果我们将 `feFlood`\
  \ 图元的 `result` 作为第一个输入（前景），将 `SourceGraphic` 作为第二个输入，那么能够实现我们预期效果的操作符是 `atop`。回顾一下，使用此操作符，前景（`feFlood`）与背景（`SourceGraphic`）重叠的部分将被保留；`feFlood`\
  \ 的其余部分则被裁剪掉。\n\n现在让我们进行设置。在 `feBlend` 图元之后、滤镜应用于网格之前，包含以下代码。\n\n```\n// Composite\
  \ the blend 'atop' the original.\nfilter.create('feComposite').set({\nin: 'blend',\n\
  in2: 'SourceGraphic',\noperator: 'atop'\n});\n```\n\n对我来说，这产生了您在图 8-6 中看到的输出。我不知道您怎么看，但我看到了一只好斗的小狗举起爪子，颇有\
  \ Scrappy-Doo 的风范（尽管这很可能是我幻想性视错觉在作祟）。每次刷新页面，您都会看到截然不同的效果，虽然色调会变化，但由于我们只使用了一种 `feFlood`\
  \ 颜色，所以可以观察到共同的颜色基调。不使用滤镜很难实现这种效果。\n\n![](img/538894_1_En_8_Fig6_HTML.png)\n\n一幅抽象画展示了在深色背景上，一团由各种颜色渐变的正方形组成的图案，类似马赛克图案。\n\
  \n**图 8-6**  \n合成操作的结果\n\n#### 噪点与扭曲\n\n在本节中，我们将介绍一种新的噪点，它实际上是 SVG 规范内置的。我们还将探索如何在滤镜管线中添加一些扭曲效果。有了这两个要素，再加上前面介绍的基础知识，一个全新的特效世界将向我们敞开。\n\
  \n##### 湍流（Turbulence）\n\n在第 5 章中，我们介绍了 SvJs 的 `Noise` 模块，它允许我们在草图中使用 Perlin 噪点。SVG\
  \ 也在其 `feTurbulence` 滤镜图元中实现了 Perlin 噪点，那么区别是什么呢？\n\n区别在于，使用 `Noise` 模块，我们可以提取并操作噪点*数据*，利用其值来塑造我们的矢量形状。而使用\
  \ `feTurbulence`，我们拥有的是一个直接以*像素*形式渲染噪点数据的滤镜图元。这虽然不让我们访问底层噪点数据，但我们可以通过调整其属性轻松地改变视觉输出，并将其输入到其他滤镜图元中。`feTurbulence`\
  \ 的属性如下：\n\n*   `baseFrequency`：这是唯一必需的属性，我们可以将其理解为定义噪点的“缩放级别”。通常最低值从 0.0001 开始（当然也可以更低），值越高，显示的噪点地形就越多。如果提供两个数值（而非一个），第一个将定义\
  \ X 轴方向的频率，第二个定义 Y 轴方向的频率。以这种方式解耦两个值，可以在水平或垂直方向上拉伸或压缩生成的纹理。\n*   `numOctaves`：此属性指的是噪点信号中存在的八度音阶数量，决定了我们所能辨别的细节水平。值越高，渲染结果越自然，但对处理器的要求也越高。最实用的结果范围在\
  \ 1 到 5 之间。\n*   `seed`：这允许我们改变采样噪点的“位置”。如果 `baseFrequency` 是缩放级别，那么 `seed` 就是我们的位置坐标。有效的\
  \ `seed` 值应为 0 到 1000 万之间的正整数。\n*   `stitchTiles`：此属性接受 `stitch` 或 `noStitch`，指的是噪点地形相邻区域如何混合。设置为\
  \ `noStitch`（默认值）时，某些噪点配置会导致“平铺”效应，即噪点区域之间的边界非常明显。设置为 `stitch` 可以柔化这种效应。\n*   `type`：可以设置为\
  \ `fractalNoise` 或 `turbulence`（默认值）。前者在红色、绿色、蓝色和 Alpha 通道上产生相同类型的噪点模式，后者则在 Alpha\
  \ 通道上产生不同的模式。`fractalNoise` 类型看起来更柔和，非常适合生成像云这样的气态纹理。而 `turbulence` 类型的外观则更偏向流体形态。\n\
  \n在图 8-7 中，我们可以看到左侧有两个 `turbulence` 实例，右侧有两个 `fractalNoise` 实例。实例之间的值只有细微变化，这应该能让您感受到此滤镜图元可能提供的巨大变化。\n\
  \n![](img/538894_1_En_8_Fig7_HTML.png)\n\n一张截图显示了四个不同的正方形。左侧是两个具有不同频率和八度音阶的湍流模式正方形，颜色渐变。右侧是两个具有不同频率和八度音阶的分形噪点正方形，颜色渐变。\n\
  \n**图 8-7**  \n两种噪点类型的不同基础频率和八度音阶\n\n要感受 `feTurbulence` 的工作原理，最好的方法是调整交互式示例，因此我专门为此创建了一个在线代码笔：`davidmatthew.ie/generative-art-javascript-svg#turbulence`。我倾向于使用非常低的\
  \ `baseFrequency` 值，并通过修改 `seed` 来随机选择一种模式；这可以产生大量有趣的纹理。然而，如果您想模拟更颗粒化的效果，例如经典的胶片颗粒效果或砂纸纹理，非常高的\
  \ `baseFrequency` 值会很有用。\n\n\n\n##### 位移\n\n一个能与 `feTurbulence` 配合得特别好的滤镜图元是 `feDisplacementMap`。这个图元允许我们利用第二个输入\
  \ `in2` 的值来扭曲第一个输入 `in`。第二个输入充当了映射，我们可以从中推导出位移值，也就是决定沿 x 轴和 y 轴施加多少扭曲程度的值。这意味着，我们可以使用\
  \ `feTurbulence` 的输出，通过将两者放入 `feDisplacementMap` 来扭曲我们的 `SourceGraphic`。\n\n除了前面提到的\
  \ `in` 和 `in2` 之外，`feDisplacementMap` 图元还有另外三个属性：第一个是 `scale`，它决定了要施加的扭曲程度（即 `in`\
  \ 被 `in2` 扭曲的程度）。另外两个属性 `xChannelSelector` 和 `yChannelSelector` 允许我们指定哪个通道负责水平位移和垂直位移。它们接受\
  \ `R`、`G`、`B` 或 `A` 作为值，分别代表三个颜色通道以及 alpha 通道。以单个颜色通道 `R` 为例，其值范围可以从 0 到 255。低于\
  \ 127 的值会产生负向位移（沿 x 轴向左移动，或沿 y 轴向上移动），而高于 127 的值则会产生正向位移（沿 x 轴向右移动，或沿 y 轴向下移动）。\n\
  \n在图 8-8 中，一个 `feTurbulence` 图元（中间）的输出被用作映射，以位移源图形（左侧），产生了一些柔和的波浪状扭曲（右侧）。\n\n![](img/538894_1_En_8_Fig8_HTML.png)\n\
  \n一幅插图展示了一簇带阴影的正方形，并添加了一个处于湍流图案中的正方形，从而产生了一簇呈波浪状排列的正方形。\n\n**图 8-8** 使用湍流作为位移映射源\n\
  \n### 创建宇宙气泡\n\n下一个示例将把我们已经介绍过的几个滤镜图元组合在一起，并将其应用于最简单的源图形：圆形。我们的目标是通过合成一些湍流、模糊和扭曲效果，创造出一点“宇宙”感。\n\
  \n首先，复制我们的模板文件夹，并将其重命名为 `22-hubble-bubble`（或你选择的其他名称）。在背景下方通常的位置，让我们将源图形设置在 `viewBox`\
  \ 的中心，并对其半径进行一些随机化处理。\n\n```\n// 创建源图形。\nsvg.create('circle').set({\ncx: 500,\n\
  cy: 500,\nr: Gen.random(250, 350),\nfill: '#000',\nfilter: 'url(#cosmic)'\n});\n\
  ```\n\n你会注意到我们已经引用了滤镜，但尚未创建它。通常我们创建元素的顺序很重要；如果我们先创建一个圆形，再创建另一个，后者会像图层一样被渲染到前者“上方”。但由于滤镜是在\
  \ `defs` 元素内创建的，因此可以在应用滤镜的元素之后定义它们。回顾一下，`defs` 元素内的任何内容都不会被直接渲染，而必须被引用。\n\n下一步，我们将创建这个滤镜（确保\
  \ `id` 与对 `#cosmic` 的引用匹配），并在滤镜链中添加第一个图元：`feTurbulence`。我们将随机化种子，将 `baseFrequency`\
  \ 调低，并将 `numOctaves` 增加到 `4`，以突出一些纹理细节。\n\n```\n// 初始化滤镜。\nlet filter = svg.createFilter('cosmic');\n\
  // 创建随机的湍流量。\nfilter.create('feTurbulence').set({\ntype: 'fractalNoise',\nbaseFrequency:\
  \ Gen.random(0.002, 0.006, true),\nseed: Gen.random(0, 10000),\nnumOctaves: 4,\n\
  stitchTiles: 'stitch',\nresult: 'turbulence'\n});\n```\n\n与 `feFlood` 一样，`feTurbulence`\
  \ 是一个生成器图元，它不需要任何输入；它直接生成自己的输出。结果是，一旦我们将 `feTurbulence` 图元初始化为滤镜链中最新的（或唯一的）环节，它就会用其输出完全充斥整个滤镜区域（如果你此时运行代码，就会看到这个效果）。稍后我们将使用\
  \ `feComposite` 来解决这个问题。\n\n下一步，我们将创建一个要位移（即施加扭曲）的目标区域。为了创建这个目标区域，我们要做的是使用 `feGaussianBlur`\
  \ 来柔化源图形（圆形）的边缘；这会在圆形的周边引入一些透明度。这个透明度递减的区域（模糊的另一种描述方式）将是我们用来对湍流施加扭曲的部分。图 8-8 展示了使用湍流作为位移映射源的结果；而这次我们将反过来，使用湍流作为位移映射的目标。我们圆形上的模糊区域将取而代之成为位移映射源。以下是设置方法（混合了一些随机性）。\n\
  \n```\n// 模糊源图形的边缘。\nfilter.create('feGaussianBlur').set({\nstdDeviation: Gen.random(10,\
  \ 25), in: 'SourceGraphic',\nresult: 'blurred'\n});\n// 用圆形的模糊边缘来位移湍流。\nfilter.create('feDisplacementMap').set({\n\
  in: 'turbulence',\nin2: 'blurred',\nscale: Gen.random(250, 500),\nresult: 'distortion'\n\
  });\n```\n\n这会产生一圈位移后的噪点，如图 8-9 所示。请注意，我们省略了 `feDisplacementMap` 的 `xChannelSelector`\
  \ 和 `yChannelSelector` 属性；它们都默认为 alpha 通道，这对我们的情况来说没问题。\n\n![](img/538894_1_En_8_Fig9_HTML.png)\n\
  \n一幅抽象图展示了一个正方形，其中包含一个边缘模糊的圆形，呈现出多种颜色的渐变。背景也具有多种颜色的渐变。\n\n**图 8-9** 使用圆形模糊边缘进行位移\n\
  \n我们还没有完全完成；作为最后一步，我想裁剪掉模糊区域边界之外的所有内容。解决方法是使用 `atop` 运算符，将 `feDisplacementMap` 和\
  \ `feGaussianBlur` 的输出合成在一起。这样我们应该得到类似于图 8-10 的效果，即我们的哈勃气泡。\n\n![](img/538894_1_En_8_Fig10_HTML.png)\n\
  \n一幅抽象图展示了一个正方形，中心有一个边缘模糊的圆形，呈现出多种颜色的渐变，背景为深色。\n\n**图 8-10** 哈勃气泡草图的一种可能迭代\n\n```\n\
  // 移除模糊边界之外的所有内容。\nfilter.create('feComposite').set({\nin: 'distortion',\nin2: 'blurred',\n\
  operator: 'atop'\n});\n```\n\n## 光照与纹理\n\n尽管 SVG 从定义上讲是一种用于二维矢量图形的格式，但在其滤镜图元中，你会发现两种光照效果：`feDiffuseLighting`\
  \ 和 `feSpecularLighting`。通常属于三维图形领域的光照，需要 z 轴分量才能运作，以便空间中凸出的表面或其他物体（即具有深度的物体）能够捕捉到光源投射的光线。SVG\
  \ 的坐标空间没有任何这样的第三维度或 z 轴，那么光照在这样的环境中究竟是如何运作的呢？答案是 z 轴是通过使用“凹凸”映射来模拟的。具体来说，`feDiffuseLighting`\
  \ 和 `feSpecularLighting` 都将它们连接输入的 alpha 通道解释为凹凸映射源。凹凸映射正如其名，是一张凹凸的映射图，指的是表面上任何凸起的区域，比如斜坡、峰顶、褶皱和纹理。\n\
  \n\n\n### 光照图元的挑战\n\n使用这些光照图元的挑战在于，要知道如何为它们提供带有良好渐变效果的凹凸贴图；任何具有非常尖锐过渡或大面积纯色区域的贴图，往往会出现令人不悦的像素化，或者完全不受影响。在图\
  \ 8-11 中，我们可以看到，一个带有径向渐变（左侧）的圆形与一个同样大小但填充纯色（右侧）的圆形，在受到远距离光源照射时，产生的效果差异相当明显。\n\n\
  ![](img/538894_1_En_8_Fig11_HTML.png)\n\n一张抽象图左侧展示了一个模糊的圆形，中心有一个亮点。右侧是一个明亮的阴影圆形。\n\
  \n**图 8-11**  \n*投射在径向渐变与纯色填充上的光照效果*\n\n光照是 SVG 中非常容易出问题的环节之一。一旦出了问题，结果往往显得廉价、生硬且参差不齐，这可能会让你彻底放弃尝试光照效果。我们需要记住，使用滤镜时，我们已经从矢量领域进入了像素领域，分辨率在此处至关重要。一个渐变更加精细的\
  \ Alpha 通道，会转化为分辨率更高的凹凸贴图。\n\n幸运的是，`feTurbulence` 是生成渐变 Alpha 通道数据的绝佳源头。在下一个示例中，我们将使用\
  \ `feTurbulence` 配合 `feDiffuseLighting` 和 `feDisplacementMap` 来模拟一种粗糙、撕裂的纸张效果。但首先，我们需要更深入地探究上述两个光照图元的一些细节。\n\
  \n### 漫反射与镜面高光光照\n\n`feDiffuseLighting` 图元模拟的是漫反射。这意味着，照射到漫反射光照物体表面的光线会向各个方向散射，这是粗糙表面纹理（如亚麻布）的特征。而\
  \ `feSpecularLighting` 图元则模拟镜面高光反射，这是更光滑表面（如保龄球）的特征。在镜面高光反射中，照射到表面的光线会以一个确定的角度反射出去。图\
  \ 8-12 展示了由 `feDiffuseLighting`（左侧）发出的点光源与由 `feSpecularLighting`（右侧）发出的相同点光源之间的区别。\n\
  \n![](img/538894_1_En_8_Fig12_HTML.png)\n\n一幅抽象图，左侧在深色背景上显示了一个暗色调的圆形，右侧则是一个亮色调的圆形。\n\
  \n**图 8-12**  \n*漫反射光照与镜面高光光照的对比*\n\n两个光照图元都接受一个单一的输入 `in` 作为它们的凹凸贴图源，以及一个 `surfaceScale`\
  \ 属性，该属性定义了凹凸贴图的相对高度。光线的颜色也可以使用 `lighting-color` 属性进行自定义，该属性默认为白色。这两个图元还共享一个用于定义常量的属性：`feDiffuseLighting`\
  \ 的 `diffuseConstant` 和 `feSpecularLighting` 的 `specularConstant`。这个常量决定了光源投射光线的强度。`feSpecularLighting`\
  \ 图元还有一个额外的属性 `specularExponent`，用于控制焦点强度（在图 8-12 中，这将决定点光源反射光斑的大小）。\n\n### 光源\n\
  \n我之前多次提到远距离光源和点光源，但并未解释它们。这指的是由 `feDiffuseLighting` 或 `feSpecularLighting` 图元发出的光源类型。单独这些图元本身并不会发出任何光线；它们需要一个额外的嵌套节点来定义光源。换句话说，在\
  \ SVG 中设置光照涉及定义两个元素：一是外部节点，它定义了光照的目标表面是漫反射还是镜面高光；二是内部节点，它定义了要使用的光源类型。下面是一个在原始 SVG\
  \ 中的示例：\n\n共有三种光源节点：`feDistantLight`，一种环境光，均匀地向各个方向发射光线（例如太阳）；`fePointLight`，一种更近的光源，具有明确的焦点；以及\
  \ `feSpotLight`，一种方向光，通过一个可自定义尺寸的锥形形状发射光线。阐述所有三种光源超出了本章的范围，因此我们将只关注前两种：`feDistantLight`\
  \ 和 `fePointLight`。\n\n`feDistantLight` 光源有两个属性：`azimuth`，指定光线的方向角度，以及 `elevation`，指定光源的高度。两者都以度数为单位表示。用太阳来做类比，黎明时分，太阳从东方升起（`azimuth`\
  \ 和 `elevation` 均为 `0`），到了赤道地区的正午，它会上升到 `elevation` 为 `90` 度，即头顶正上方。\n\n`fePointLight`\
  \ 光源没有 `azimuth` 或 `elevation` 属性；它完全由 `x`、`y` 和 `z` 属性定义。`z` 属性对应于光源的高度或海拔，而 `x`\
  \ 和 `y` 属性则指代当前坐标空间中的标准二维位置。\n\n### 模拟纹理\n\n让我们开始一个新的项目，并深入实践之前提到的部分理论。复制我们的模板文件夹，并将其重命名为\
  \ `23-rough-paper`，然后在背景下方的常规位置，创建一个羊皮纸颜色的渐变，我们将把它应用到我们的纸张上。纸张本身将是一个由两个形状组成的复合路径（将其撕成两半的结果）。如你所见，可以通过简单地添加一个新的\
  \ `M` 命令（相当于抬起笔，在别处开始新的一行）来扩展路径，使其超出结束 `Z` 命令的范围。设置好撕裂的纸张后，我们将其居中。\n\n```javascript\n\
  // 创建一个羊皮纸颜色的渐变。\nsvg.createGradient('parchment', 'linear', ['#fffbeb', '#fde68a'],\
  \ 90);\n// 为撕裂的纸张创建路径。\nlet paper = svg.create('path').set({\n  fill: 'url(#parchment)',\n\
  \  stroke: '#4444',\n  d: 'M 0,0 h 175 l 175,550 h -350 Z M 210,0 h 340 v 550 h\
  \ -165 Z',\n  filter: 'url(#rough-paper)'\n});\n// 将其居中。\npaper.moveTo(500, 500);\n\
  ```\n\n我们有意让构图保持简单，以便能将更多注意力放在滤镜效果上。接下来，我们将初始化滤镜，并将第一个图元添加到链中：`feTurbulence`。这将构成纸张颗粒纹理的基础。\n\
  \n```javascript\n// 初始化滤镜。\nlet filter = svg.createFilter('rough-paper');\n// 添加湍流以模拟纸张颗粒。\n\
  filter.create('feTurbulence').set({\n  type: 'fractalNoise',\n  numOctaves: 5,\n\
  \  baseFrequency: 0.04,\n  seed: Gen.random(0, 100),\n  result: 'turbulence'\n});\n\
  ```\n\n画布现在应该充满了 `feTurbulence`。接下来我们要做的是为其添加光照效果，具体来说，是使用一个带有嵌套 `feDistantLight`\
  \ 节点作为光照类型的 `feDiffuseLighting` 图元。这个第二个节点我们可以在漫反射光照图元之后直接创建，使用 SvJs 的方法链。\n\n```javascript\n\
  // 在湍流上添加漫反射光照。\nfilter.create('feDiffuseLighting').set({\n  surfaceScale: 1,\n\
  \  diffuseConstant: 1.3,\n  in: 'turbulence',\n  result: 'lighting'\n}).create('feDistantLight').set({\n\
  \  azimuth: 180,\n  elevation: 45,\n});\n```\n\n现在画布上应该已经出现了类似纸张的纹理。接下来，我们将一些湍流数据接入\
  \ `feDisplacementMap` 图元，以粗糙处理源图形的边缘。\n\n```javascript\n// 使用湍流扭曲纸张源图形。\nfilter.create('feDisplacementMap').set({\n\
  \  in: 'SourceGraphic',\n  in2: 'turbulence',\n  scale: 25,\n  result: 'distortion'\n\
  });\n```\n\n这为我们提供了一个具有磨损边缘的旧纸张轮廓，但还没有纹理。为了重新引入光照效果的结果，我们需要进行一些合成。将光照输出作为前景，粗糙边缘的纸张作为背景，使用\
  \ `in` 运算符将能实现我们想要的效果。\n\n\n```javascript\n// 将光照与粗糙边缘的纸张融合。\nfilter.create('feComposite').set({\n\
  in: 'lighting',\nin2: 'distortion',\noperator: 'in',\nresult: 'composite'\n});\n\
  ```\n\n现在形状已经就位，纹理也显露出来，我们得到了一个逼真的粗糙撕裂纸张纹理。但是，我们还缺少最后一种要素：颜色。为了解决这个问题，我们将把 `feComposite`\
  \ 的输出与 `feDisplacementMap` 的输出混合，并使用 `multiply`（正片叠底）的 `mode`（混合模式）。这样应该能还原我们最初的羊皮纸渐变。\n\
  \n```javascript\n// 重新引入羊皮纸渐变。\nfilter.create('feBlend').set({\nin: 'composite',\n\
  in2: 'distortion',\nmode: 'multiply'\n});\n```\n\n图 8-13 展示了结果。还不错！虽然单独来看还不够令人印象深刻（至少在我看来是这样），但通过这个效果的各种变体，你就有办法为其他生成式构图增添额外的视觉趣味。\n\
  \n![一张抽象图，中央是一个带有断裂斜线的亮方块，背景为深色。](img/538894_1_En_8_Fig13_HTML.png)\n\n**图 8-13**\
  \ 我们粗糙现成的纸张纹理\n\n### 生成式纹理\n\n前面的例子为我们接下来的尝试打下了基础。模拟纹理固然不错，但在下一个示例中，我们将完全采用生成式方法，也就是放弃部分控制权，享受结果的随机性。在此过程中，我们还将演示点光源镜面光照的用法，以便您了解它与漫射、远距离光照的区别。\n\
  \n复制模板文件夹并将其命名为 `24-rocky-randomness`。在背景下方，我们将设置源图形，它将是一个简单的圆形。我们将为这个圆形应用渐变和滤镜。\n\
  \n```javascript\n// 创建源图形。\nsvg.create('circle').set({\nr: 300,\ncx: 500,\ncy: 500,\n\
  fill: 'url(#random-gradient)',\nfilter: 'url(#rocky-randomness)'\n});\n```\n\n下一步是设置一个线性渐变。为此，我们将使用一个包含三种随机颜色的数组，并且也会随机化渐变的旋转角度。\n\
  \n```javascript\n// 随机颜色数组。\nlet colours = [\n`hsl(${Gen.random(0, 360)} 80% 80%\
  \ / 0.75)`,\n`hsl(${Gen.random(0, 360)} 80% 80% / 0.75)`,\n`hsl(${Gen.random(0,\
  \ 360)} 80% 80% / 0.75)`\n];\n// 一个具有随机旋转角度和颜色数组的渐变。\nsvg.createGradient('random-gradient',\
  \ 'linear', colours, Gen.random(0, 360));\n```\n\n现在来看滤镜。与其他示例一样，我们的第一个节点将是 `feTurbulence`\
  \ 图元，它将作为我们的主要纹理来源。`numOctaves` 将在 `2` 到 `7` 之间变化，这允许细节水平有相当大的变化。`baseFrequency`\
  \ 和 `seed` 我们也将随机化。\n\n```javascript\n// 初始化滤镜。\nlet filter = svg.createFilter('rocky-randomness');\n\
  // 创建主要湍流。\nfilter.create('feTurbulence').set({\ntype: 'turbulence',\nnumOctaves:\
  \ Gen.random(2, 7),\nbaseFrequency: Gen.random(0.003, 0.01, true),\nseed: Gen.random(0,\
  \ 1000),\nresult: 'turbulence'\n});\n```\n\n现在画布上覆盖了原始的湍流，虽然每次刷新都会变化，但仍感觉有些过于均匀。我们如何创造出更有机、更少网格感的东西呢？好吧，我们可以用……更多的湍流来扭曲它！\n\
  \n为此，我们将设置另一个 `feTurbulence` 图元，这次使用 `fractalNoise`（分形噪声）。`baseFrequency` 我们会稍微提高，但\
  \ `numOctaves` 和 `seed` 保持在相似范围内。然后，我们将两者都接入 `feDisplacementMap`，随机化 `scale`（缩放）值（这决定了扭曲的强度），并将\
  \ `R` 和 `G` 分别设置为 x 和 y 通道选择器（纯粹是因为这次我不太喜欢默认的 alpha 输出）。\n\n```javascript\n// 设置另一个湍流实例。\n\
  filter.create('feTurbulence').set({\ntype: 'fractalNoise',\nnumOctaves: Gen.random(3,\
  \ 7),\nbaseFrequency: Gen.random(0.01, 0.07, true),\nseed: Gen.random(0, 1000),\n\
  result: 'noise'\n});\n// 用第二个湍流实例扭曲第一个。\nfilter.create('feDisplacementMap').set({\n\
  in: 'turbulence',\nin2: 'noise',\nscale: Gen.random(25, 40),\nxChannelSelector:\
  \ 'R',\nyChannelSelector: 'G',\nresult: 'distortion'\n});\n```\n\n现在我们有了看起来更自然的噪点，让我们来启动一些镜面光照，看看这些噪点在光照下是什么样子。我们将在大多数属性上使用\
  \ `Gen.random()`，包括点光源的坐标。\n\n```javascript\n// 对扭曲后的输出应用镜面点光源。\nfilter.create('feSpecularLighting').set({\n\
  in: 'distortion',\nsurfaceScale: Gen.random(5, 30),\nspecularConstant: Gen.random(2,\
  \ 6),\nspecularExponent: Gen.random(10, 25),\nresult: 'lighting'\n}).create('fePointLight').set({\n\
  x: Gen.random([-50, 500, 1050]),\ny: Gen.random([-50, 1050]),\nz: Gen.random(50,\
  \ 250)\n});\n```\n\n对于 `x` 和 `y` 坐标，你会注意到我们使用 `Gen.random()` 从一个数组中选取值，而不是从一个范围；如果你检查这些值，你会发现这些组合将光照保持在画布的边缘。这主要是为了防止任何直接照射（想想照片中不受欢迎的相机闪光灯）。如果此时加载草图，你应该会看到一些有趣的生成地形出现。不过我们还没完成。\n\
  \n在我们将地形和源图形重新组合之前，我们先用一些 `feGaussianBlur`（高斯模糊）来柔化后者的边缘。然后，我们将像之前草图中那样，使用 `feComposite`\
  \ 配合 `in` 运算，之后再使用另一个 `feComposite` 图元恢复原始渐变，这次使用 `atop`（在顶部）运算。\n\n```javascript\n\
  // 模糊源图形。\nfilter.create('feGaussianBlur').set({\nin: 'SourceGraphic',\nstdDeviation:\
  \ Gen.random(25, 50),\nresult: 'blur'\n});\n// 通过模糊后的源图形引入光照纹理。\nfilter.create('feComposite').set({\n\
  in: 'lighting',\nin2: 'blur',\noperator: 'in',\nresult: 'comp1'\n});\n// 恢复原始渐变。\n\
  filter.create('feComposite').set({\nin: 'blur',\nin2: 'comp1',\noperator: 'atop'\n\
  });\n```\n\n现在我们可以看结果了！图 8-14 显示了一个我特别喜欢的渲染结果，但这个草图的变体非常多，所以最好多尝试，直到找到你喜欢的效果。\n\n\
  ![一张抽象图，显示一个带有岩石状图案的圆形，背景为深色。](img/538894_1_En_8_Fig14_HTML.png)\n\n**图 8-14** 镜面随机岩石感\n\
  \n至此，我们对滤镜的初步探索就结束了。正如我之前提到的，在滤镜领域还有更多值得探索的地方，而且有很多图元我由于篇幅限制未能涉及。这绝对值得（并且会有回报）进一步独立探索。\n\
  \n## 总结\n\n让我们快速回顾一下这本倒数第二章所涵盖的内容：\n\n- 滤镜的构建方式\n- 滤镜区域和 SvJs 的 `createFilter()`\
  \ 方法\n- 基本图元，如 `feGaussianBlur`、`feFlood` 和 `feDropShadow`\n- 更复杂的图元，如将其他图元联系在一起的\
  \ `feComposite` 和 `feBlend`\n- `feTurbulence` 图元的力量及其创造性的可能性\n- 使用 `feDisplacementMap`\
  \ 扭曲其他图元\n- 光照以及如何使用凹凸贴图模拟三维效果\n- 漫射光和镜面光以及各种光源类型\n- 如何将湍流、位移和光照结合起来模拟和生成纹理\n\n\
  在下一章中，我们将进行总结，并涉及一些有助于将你的生成艺术提升到新水平的话题。\n\n"
- '# 9. 生成之道



  '
- "# 恭喜你走到这一步！我们已经涵盖了很多内容，所以是时候回顾总结、舒展一下你的思维肌肉，并确保我们不会以“受伤”结束这本书。我们将通过逐一回顾各章节的要点来放缓节奏，最后还将预览你在生成式之旅中可能继续探索的一些方向。\n\
  \n### 一路走来的旅程\n\n我们从 SVG 的介绍开始，并探讨了它与 PNG、JPG 等光栅格式的不同之处。接着，我们转向 SvJs 库，学习了如何搭建一个本地前端开发环境。第一章以一段代码转储作为结尾，旨在提供一些视觉灵感，但解释稍显简略，因此接下来的两章填补了这一空缺。\n\
  \n对于那些刚接触 JavaScript 和/或编程的读者，第 2 章提供了一个入门教程，而第 3 章则深入探讨了 SvJs 库的核心功能。我们探索了如何创建基本形状，如何处理文本、组、渐变和图案，并在此过程中创作了一些色彩丰富的构图和视错觉作品。\n\
  \n随着第 4 章引入随机性，我们终于能够完全进入生成式模式，创建出结果不事先僵化固定的草图。我们学习了如何在一个范围内随机生成数字，如何从数组中随机选择元素，以及如何使用生成式艺术的支柱——嵌套\
  \ for 循环——来构建规则网格。我们通过蒙版和剪切路径扩展了 SVG 的知识，并尝试了高斯分布和帕累托概率分布。\n\n第 5 章引入了噪声，作为在草图中注入更有机变化的一种方式，并介绍了其他有用的生成函数，以帮助我们约束和将这些噪声值映射到更有用的范围。在第\
  \ 6 章中，我们挖掘了路径元素及其命令库的强大功能，学习了如何创建二次、三次贝塞尔曲线以及椭圆弧类型的直线和曲线。\n\n第 7 章全部关于让东西动起来。我们探索了事件监听器和用户交互，并回顾了至少四种不同的\
  \ SVG 动画方法。我们介绍了基本的碰撞检测和圆周运动，然后继续在第 8 章中学习了滤镜。在那里，我们重点讨论了生成式艺术家最常用的一组滤镜原语，并学习了如何将这些原语连接起来以实现各种不同的效果。\n\
  \n### 未来的航向\n\n那么，你接下来该何去何从？我们是否已完全探索了生成式艺术的领域，绘制了所有版图？完全没有！我们实际上只是触及了众所周知的冰山一角，暗示了其下方庞大的结构。所以，如果你确实想自己更深入一些，我会试探性地建议一些进一步的主题（前提是到目前为止我们涵盖的材料可以被无限扩展）。\n\
  \n#### 三角学\n\n在第 7 章中，我只能对三角学进行非常粗略的介绍，所以如果你这是第一次遇到诸如 `Math.PI` 和 `Math.sin()` 之类的东西，不要指望这些概念能立刻扎根（“平方”根或其他……抱歉，蹩脚的双关语）。三角学是一个值得深入探讨的主题，就像本书中的许多材料一样，你接触和练习得越多——或者更好的是，你玩得越多——你就会越得心应手。\n\
  \n话虽如此，我确实发现交互式可视化是激发理解的好方法。为此，我建立了一个草图，展示了圆周运动与直角三角形（三角学的基础）之间的关系，其定格画面如图 9-1 所示。\n\
  \n![](img/538894_1_En_9_Fig1_HTML.png)\n\n一幅抽象图呈现了一个方形结构，其中有一个高亮显示的圆，第一象限内有一个直角三角形，并附有度数、正弦\
  \ theta、弧度和余弦 theta 的值。\n\n**图 9-1** 交互式三角学可视化\n\n与本章中的其他示例一样，此示例旨在说明而非指导，因此此处未包含代码。不过，你可以在本书的专用网页上体验这个特定示例，如果感兴趣，也可以在那里检查代码。我还提供了进一步的阅读材料和资源，应该能帮助你深入探索这个主题，包括我多年来一直依赖的那些资料。这些可以在\
  \ `davidmatthew.ie/generative-art-javascript-svg/#trigonometry` 找到。如果你认为自己不太具备数学思维，请不要因此打消探索这个迷人主题的念头。你只需要熟悉其中相对较小的一部分，就能挖掘其创作可能性，而这并不涉及复杂的方程。\n\
  \n#### 分形\n\n另一个不需要复杂方程或令人费解的数学能力（即“弯曲思维”）的主题是分形。是的，分形是一种数学对象，有些极其复杂，但分形通常基于递归和自相似性的简单原理。\n\
  \n递归本质上意味着自引用。递归函数是一个不断调用自身的函数，我们在第 7 章中遇到的 `requestAnimationFrame()` 就是一个例子。关于分形，自相似性意味着一个部分将类似于整体，反之亦然。如图\
  \ 9-2 所示，该图展示了一个著名的分形——谢尔宾斯基三角形。正如你所见，每一个构建块都是整个结构的缩影。\n\n![](img/538894_1_En_9_Fig2_HTML.png)\n\
  \n一幅抽象图呈现了一个方形结构，其中有一个等边三角形，内部包含更小的等边三角形，背景为深色。\n\n**图 9-2** 谢尔宾斯基三角形中的自相似性\n\n\
  递归从何而来？嗯，它存在于包括谢尔宾斯基三角形在内的每一个分形中，但为了真正说明这个想法，让我们来看另一个著名的标本——冯·科赫雪花。用于构建此分形的算法可以归结为以下（尽管是简化的）步骤：\n\
  \n1.  构造一个等边三角形。\n2.  将每条边分成三等份。\n3.  移除中间的线段。\n4.  重复步骤 1。\n\n第四步使该算法具有递归性。图 9-3\
  \ 展示了仅经过三次迭代后此过程的样子。理论上，这些步骤可以无限期地继续下去，产生一个越来越复杂、可以无限放大的周长，这就是为什么分形有时被视为“通往无限的窗口”。在实践中，迭代次数通常受限于屏幕分辨率或以其他方式设定上限，以防止浏览器崩溃和处理器处理无法承受的数字。\n\
  \n![](img/538894_1_En_9_Fig3_HTML.png)\n\n一幅抽象图呈现了一个方形结构，其中有一个等边三角形，等边三角形的每条边被分成三等份，并移除中间的线段。\n\
  \n**图 9-3** 递归构建冯·科赫雪花\n\n分形为生成式艺术家打开了一个探索和灵感的完整宇宙，远非我在这里所能暗示的。如果你此时兴趣被激发，我在 [`davidmatthew.ie/generative-art-javascript-svg/#fractals`](https://davidmatthew.ie/generative-art-javascript-svg/#fractals)\
  \ 汇总了更多资源，我鼓励你去探索。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n\
  #### 系统模拟\n\n简单的规则，往往会衍生出意想不到的复杂性；这不仅适用于分形，也适用于许多自然系统。模拟这类系统通常是严肃科学的工作，但在生成式艺术的更高级领域，你会看到对基础物理学（如重力、质量、密度等）、粒子系统（如雾、火、烟）以及有机行为（从单细胞相互作用到鸟类的群集模式）的模拟。\n\
  \n现在，`SVG` 并非系统模拟的首选媒介——例如，粒子系统在基于像素的环境（如 HTML 的 canvas）中性能更好——但撇开性能问题不谈，如果你希望为自己的作品增添一个额外的层次，在艺术之上撒上一点科学的佐料，那么模拟自然系统绝对值得你投入精力。一个简单的草图就可能成为源源不断创意的输出基础，既是艺术品，也是应用。\n\
  \n`John Conway's Game of Life` 是有机模拟的一个很好的例子；它是一款基于网格、零玩家的游戏，模拟了生长、衰落和演化的模式。网格中的每个细胞可以处于两种状态之一：“存活”或“死亡”。存活的细胞有填充颜色；死亡的细胞则没有。\n\
  \n支撑这款游戏的规则出奇地简单，但复杂性却可以以意想不到的模式和争夺生存权的细胞团块的形式涌现出来。这些规则如下：\n\n1.  任何邻居数量为一个或零个的存活细胞会死亡。\n\
  2.  任何邻居数量为两个或三个的存活细胞会存活到下一“代”（或迭代）。\n3.  任何邻居数量为四个或更多的存活细胞会死亡。\n4.  任何恰好有三个邻居的空（即死亡）细胞会诞生为新细胞。\n\
  \n图 9-4 展示了游戏进行几代后的一个快照。一些细胞团（如左上角和右下角的方形细胞群）处于停滞状态，这意味着它们存活但不会扩散和繁衍。其他细胞则在活跃地蔓延、探索、消失和重生。观察起来会很有趣！\n\
  \n![](img/538894_1_En_9_Fig4_HTML.png)\n\n一张抽象图呈现了一个方形结构，其内部有网格状图案，包含多个正方形。中心、左上角、右上角、左下角和右下角的一些正方形被高亮显示。\n\
  \n**图 9-4**  \n一个正在运行的生命游戏的快照\n\n我将链接更多示例供你尝试，请访问 [`davidmatthew.ie/generative-art-javascript-svg/#systems-simulations`](http://davidmatthew.ie/generative-art-javascript-svg/%2523systems-simulations%25ef%25bb%25bf)，其中包括其他类型的模拟。\n\
  \n### 结语\n\n至此，我总结得已经够多了，所以我想留给你一些（颇为主观的）告别建议，以支持你的生成式艺术创作之旅：\n\n-   安于永不知足。对于任何类型的编程，总有太多东西需要去了解。这没关系。\n\
  -   尽量腾出零碎时间玩代码；你不必非得通宵达旦。养成小习惯式的步骤比偶尔的冲刺跑更可持续。\n-   拥抱简单；生成式艺术不必复杂也能优秀。\n-   从其他艺术家那里汲取灵感；逆向工程那些激励你的示例。\n\
  -   不要只是抄袭；理解你所实现的东西，并且总是加上你自己的风格。这将有助于你发展自己的风格。\n-   回馈。参与社区。贡献代码、建设性的批评，或者只是在他人的作品下留下积极的评论，让他们知道你欣赏他们的努力。\n\
  -   最后，无论结果如何，都要欣赏自己的努力。产出不是一切，你的生成式艺术之旅是属于你自己的。\n\n"
