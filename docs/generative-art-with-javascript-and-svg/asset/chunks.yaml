    ```

    // Adding numbers.

    2 + 2

    -> 4

    // Concatenating strings.

    ''I am'' + '' so smrt''

    -> ''I am so smrt''

    ```


    There are also operators for subtraction ( `-` ), multiplication (

    `*` ), and

    division ( `/` ).


    ```

    // Subtracting numbers.

    9 - 4

    -> 5

    // Dividing numbers.

    9 / 4

    -> 2.25

    // Multiplying numbers.

    9 * 4

    -> 36

    ```


    ES6 introduced an exponentiation operator ( `**` ), which allows

    you to multiply one number by a factor of another (i.e., one number to

    the power of another).


    ```

    // The exponentiation operator.

    2 ** 2

    -> 4

    2 ** 6

    -> 64

    2 ** 10

    -> 1024

    ```


    And finally, there is the modulo operator ( `%` ). This divides one

    number by another and gives you the remainder. This can be especially

    useful when cycling through arrays (which we’ll get to later), or

