- fmt: '```markdown

    Here’s how we could rewrite the code for Figure [8-2](#538894_1_En_8_Chapter.xhtml#Fig2)
    using `SvJs` and

    the `feDropShadow` primitive.


    ```

    // Initialise the filter.

    let filter = svg.createFilter(''shadow'');

    // Create the drop shadow.

    filter.create(''feDropShadow'').set({ dx: 0, dy: 50, stdDeviation: 25 });

    // Apply the filter.

    svg.create(''circle'').set({

    // ... other attributes.

    filter: ''url(#shadow)''

    });

    ```


    ## Coloring


    We mentioned earlier some attributes called `flood-colour` and `flood-opacity`
    that can be used with the `feDropShadow` primitive. There’s another primitive
    these can also be applied to and to which they originally belonged: `feFlood`.
    The `feFlood` primitive is very basic; it requires no input and simply floods
    the filter region with a specific color and opacity. By itself, it’s not especially
    interesting, but it can be useful when combined with other primitives.


    Other more capable color-related primitives exist called `feColorMatrix` and `feComponentTransfer`.
    The latter is too advanced to cover in this book so we’ll limit ourselves to `feColorMatrix`
    and `feFlood`. Let’s set up a sketch and put these to use.


    Instead of copying our template folder, let’s copy our first grid example, which
    I labelled `07-regular-grids` (see Chapter [4](#538894_1_En_4_Chapter.xhtml)).
    Copy and rename this folder to something like `21-colour-filter`. Leaving the
    rest of the code as is, replace the body of the nested `for` loop with the following:


    ```

    if (Gen.chance(55)) {

    grid.create(''rect'').set({

    x: x, y: y, width: cellSize, height: cellSize,

    fill: `rgb(

    ${[Gen.random(0, 255), Gen.random(0, 255), Gen.random(0, 255)]}

    )`

    });

    }

    ```


    This should give us a chance arrangement of colorful tiles on each refresh. So
    far we’ve been quite restrained in our use of color, controlling mainly the hue
    component of the `hsl()` function. This time we’re unleashing the full `rgb` color
    spectrum, so the results can range from dramatic and dynamic to garish and grating
    (see Figure [8-4](#538894_1_En_8_Chapter.xhtml#Fig4) for some sample output).
    There is something I like about these results; the coloring, however, can get
    a little too incongruous at times. So let’s use some filters to rein in the colors
    but retain the dynamic range.


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig4_HTML.png)


    An abstract presents a cluster of squares, in a gradient of colors, against a
    dark background.


    **Figure 8-4** Full-spectrum RGB tiles


    The first step is to desaturate the colors. For this, we can use the `feColorMatrix`
    primitive, which takes two arguments: `type` and `values`. The accepted `values`
    depend on the `type`, which can be as follows:


    - `saturate`: This determines the color saturation of the input. It accepts `values`
    between `0` (no saturation) and `1` (full saturation), though higher values may
    be accepted by browsers to allow for over-saturation.

    - `hueRotate`: This rotates the hue value by a specified angle, which is set in
    `values`. Setting `values` to `180` for example would invert all the hue values
    of the input source.

    - `luminanceToAlpha`: This converts the lightness of the input to alpha values
    and requires no `values`.

    - `matrix`: This is the most complex and powerful of the `feColorMatrix` types.
    It accepts a 5 by 5 color transformation matrix as the `values`, which matrix-multiplies
    the pixel component values of the input source. It’s a little too advanced to
    delve into in this chapter.


    Of the aforementioned, `saturate` is what we’re looking for. To drain the colors
    from our input, we need to set the `values` to `0`. Let’s set up a filter now
    to do this. At the bottom of the sketch, initialize a new `filter` as follows:


    ```

    // Initialise the filter.

    let filter = svg.createFilter(''colourise'');

    // De-saturate the input.

    filter.create(''feColorMatrix'').set({

    type: ''saturate'',

    values: 0,

    result: ''desaturate''

    });

    // Apply the filter.

    grid.set({ filter: ''url(#colourise)'' });

    ```


    This should result in a grayscale grid. Next, we want to choose a color to mix
    into it, and for this, we’ll use the `feFlood` primitive. Between the `feColorMatrix`
    primitive and the last line where we apply the filter, add the following code:


    ```

    // Set a flood colour.

    filter.create(''feFlood'').set({

    flood_color: ''#7F462C'',

    result: ''flood''

    });

    ```


    This should add a sepia-brown color to the composition. The problem? It simply
    floods the canvas, covering everything else. We need a way to blend it with the
    `result` of the `feColorMatrix` desaturation.


    ## Blending


    Most vector and image editing applications have blending capabilities built in,
    in the form of layer blending modes. SVG supports this feature at the filter level
    in the form of the `feBlend` primitive. A blending mode (or just blend mode) defines
    how colors interact when elements overlap (whether the elements are individual
    shapes or entire layers). If a blend mode is set to `multiply` for example, the
    final color is the result of multiplying the top color by the bottom color, which
    creates an effect similar to transparent film cells overlapping. If set to `screen`,
    the top and bottom colors are inverted, multiplied, and re-inverted, resulting
    in an effect similar to two images shone onto a projection screen.


    There are a number of blend modes supported by the SVG spec, and describing each
    one is beyond the scope of this chapter, but for a comprehensive treatment (including
    interactive examples), check out the MDN entry at `developer.mozilla.org/docs/Web/CSS/blend-mode`.


    There are actually several blend modes that will work well in our case, so what
    I’m going to do is store these in an array so we can select from them later. Include
    the following code before our filter is initialized:


    ```

    // Set up a blend modes array.

    let blendModes = [''screen'', ''overlay'', ''lighten'', ''color-dodge'', ''soft-light'',
    ''color''];

    ```


    Next, after where we defined the `feFlood` primitive, set up the `feBlend` primitive.
    We’ll randomize its `mode` attribute and set the first input to the flood color
    and the second input to the desaturated grid.


    ```

    // Randomise the blend mode.

    filter.create(''feBlend'').set({

    mode: Gen.random(blendModes),

    in: ''flood'',

    in2: ''desaturate'',

    result: ''blend''

    });

    ```


    The first input, `in`, acts as our top color, and the second input, `in2`, acts
    as our background color. Our grid should have re-appeared at this point in colorized
    form, but we’ve still got our flood color in the foreground. We need a way to
    strip this out, which brings us to the next section.


    ## Compositing


    If you’ve ever watched the behind-the-scenes footage of some of your favorite
    films, you’ll likely have come across the green-screen technique: the action hero
    who scales a skyscraper is, in reality, hanging from a pulley with green fabric
    draped in the background. This technique makes it easier to strip away the background
    from the foreground and combine it later with separately captured footage. Compositing
    is the act of fusing these two disparate elements together; two sources combine
    and become one. It is similar to blending in many respects, but the results are
    more pronounced and programmable. It has more to do with how elements intersect
    than how their colors merge, and the various compositing operations available
    to us can produce very different results. Blending, on the other hand, tends to
    be more uniform in its output.


    The `feComposite` primitive allows us to perform compositing operations in SVG.
    It takes two inputs, `in` and `in2`, and there are seven possible values its `operator`
    attribute accepts: `over`, `in`, `atop`, `xor`, `out`, `lighter`, and `arithmetic`.
    In Figure [8-5](#538894_1_En_8_Chapter.xhtml#Fig5), I’ve illustrated six of these;
    the `arithmetic` operator has no set output (it’s fully customizable) and is a
    little too complex to properly cover in this chapter.


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig5_HTML.jpg)

