  trans: "\n# 二次贝塞尔弹簧\n\n让我们在一个简单的绘图中使用二次贝塞尔曲线，创建一组类似弹簧（Slinky）的路径。如果你不知道什么是弹簧（Slinky），它是一种流行的弹簧玩具，只要从顶部轻轻一推，它就能自己“走”下一段台阶（我相信它还能表演许多其他神奇的把戏，但这正是它最广为人知的一种）。\n\
    \n复制模板文件夹，并将其重命名为 `14-quadratic-slinky`。在父级 SVG 下方，设置一些样式，用于定位 `path` 元素，稍后我们将把这些元素设置为一个组的子元素，并为该组赋予一个\
    \ `id` 为 `slinky`。\n\n```\n// 设置弹簧样式。\nsvg.create('style').content(`\n#slinky\
    \ path {\nfill: none;\nstroke-width: 0.75;\nstroke-linecap: round;\n}`\n);\n```\n\
    \n接下来，设置通常的背景，初始化一个随机色相，并创建前面提到的 `slinky` 组。\n\n```\n// 背景。\nsvg.create('rect').set({\n\
    \  x: 0, y: 0, width: 1000, height: 1000, fill: '#181818'\n});\n// 选择一个随机的起始色相。\n\
    let hue = Gen.random(0, 360);\n// 设置弹簧路径组。\nlet slinky = svg.create('g').set({\
    \ id: 'slinky' });\n```\n\n在下一步中，我们将启动循环，并创建几个用于塑造二次曲线的控制点。\n\n```\n// 开始循环。\n\
    for (let i = 0; i < 500; i += 5) {\n  // 创建控制点。\n  let cpx = Gen.random(200, 400);\n\
    \  let cpy = i - 400;\n}\n```\n\n我们曲线的宽度将为 600 个单位（相对于 `viewBox`），因此我们的中点将是 300。在\
    \ x 轴上，`cpx` 变量在中点左右各 100 个单位范围内选取一个随机整数值，以使我们的弹簧产生一些“摆动”。`cpy` 变量则更为直接；它在每次迭代中沿着屏幕向下移动，并带有\
    \ 400 个单位的偏移量，这将使曲线向上“拉伸”。\n\n接下来，让我们创建实际的曲线（保持在循环内部）。\n\n```\n// 创建二次曲线。\nslinky.create('path').set({\n\
    \  stroke: `hsl(${hue} 90% 80% / 0.85)`,\n  d: `M 0 ${i} q ${cpx} ${cpy} 600 0`\n\
    });\n```\n\n在这里，我们像之前多次做的那样设置 `hue`，而对于 `path`，我们使用 `M` 命令开始绘制一条简单的曲线。对于曲线坐标，我们利用小写\
    \ `q` 命令计算的相对坐标，这使我们能够使这些值与曲线的起点保持同步。\n\n在结束循环之前，我们将递增 `hue`，但我们将使用一种新技术来实现。我在第\
    \ 2 章（涉及运算符的章节）中提到了取模运算符（`%`），它用于计算一个数除以另一个数后的余数。这对于在预定义范围内循环非常有用，例如颜色的 `hue`\
    \ 的 0 到 360 约束。在循环结束前添加以下内容作为最后一行：\n\n```\n// 递增色相。\nhue = (hue % 360) + 1.5;\n\
    ```\n\n快速解释一下它的工作原理：假设我们的随机 `hue` 初始化为 350。表达式 `hue % 360` 将返回 350，因为 `350 / 360`\
    \ 等于 0，余数为 350。这对于我们范围内的每个数字都适用，*除了* 360，当 360 除以自身时结果为 1，余数为 0。这就是它如何循环回范围起点的方式。\n\
    \n现在循环已完成，我们可以在循环外再添加一行代码，以确保内容居中。结果应类似于图 6-6。\n\n![](img/538894_1_En_6_Fig6_HTML.png)\n\
    \n一幅抽象画，描绘了一个方形结构，其中包含一组褪色的二次曲线，背景为深色。\n\n**图 6-6** 弹簧形态的二次曲线\n\n```\nslinky.moveTo(500,\
    \ 500);\n```\n\n# 椭圆弧\n\n是时候进入弧线部分了！椭圆弧曲线（图 6-7）是一个复杂的家伙，如果没有一些视觉示例，其语法很难理解。`A`（或\
    \ `a`）命令用于初始化它，其后跟不少于七个参数。\n\n```\n// A/a 命令的语法。\n'A [rx ry rotation large-arc-flag\
    \ sweep-flag x y] ...'\n'a [rx ry rotation large-arc-flag sweep-flag dx dy] ...'\n\
    ```\n\n前两个参数和最后两个参数我们之前都已经遇到过：`rx` 和 `ry` 指的是 x 轴和 y 轴的半径，最后的 `x` 和 `y` 参数定义了曲线的终点。`rotation`\
    \ 定义了沿 x 轴的旋转角度，而 `large-arc-flag` 和 `sweep-flag` 都是数字形式的布尔值，`0` 表示 `false`，`1`\
    \ 表示 `true`。至于它们的作用，则需要稍作解释。\n\n![](img/538894_1_En_6_Fig7_HTML.png)\n\n一幅抽象画，描绘了一个方形结构，其中包含一个带有两个端点的半圆，背景为深色。\n\
    \n**图 6-7** 一条椭圆弧曲线\n\n## 设置标志\n\n当我们绘制一条椭圆弧曲线时，实际发生的情况是，在幕后使用两个相互锁定的椭圆作为引导，以确定实际绘制众多可能路径中的哪一条。当\
    \ `large-arc-flag` 设置为 `1` 时，将会选择大弧。当 `sweep-flag` 设置为 `1` 时，弧线将按顺时针方向绘制。让我们看看图\
    \ 6-8，其中展示了这些标志的四种可能排列组合。\n\n![](img/538894_1_En_6_Fig8_HTML.png)\n\n一幅抽象画，描绘了一个方形结构，其中有上下两个圆，按顺时针方向旋转，背景为深色。\n\
    \n**图 6-8** 四种可能的弧线\n\n-   在最上面的路径中，`large-arc-flag` 和 `sweep-flag` 都设置为 `1`。\n\
    -   在第二条路径中，`large-arc-flag` 设置为 `0`，`sweep-flag` 设置为 `1`。\n-   在第三条路径中，`large-arc-flag`\
    \ 和 `sweep-flag` 都设置为 `0`。\n-   在最下面的路径中，`large-arc-flag` 设置为 `1`，`sweep-flag`\
    \ 设置为 `0`。\n\n实际上，你在屏幕上一次只能看到这些弧线中的一条。然而，当我们同时看到所有可能的曲线时，这有助于我们理解椭圆弧的底层结构。\n\n\
    ## 不规则半径\n\n关于椭圆弧曲线的另一个可能令人困惑之处在于，`rx` 和 `ry` 这两个半径值的工作方式与我们预期的略有不同。通常情况下，半径会直接决定椭圆形状的大小。对于椭圆弧曲线，大小实际上是由多个协同工作的因素决定的，而\
    \ `rx` 和 `ry` 值只是等式的一部分。\n\n例如，你有时会发现，构成可能曲线基础的相互锁定的椭圆是重合的；也就是说，它们彼此重叠。如果你发现将\
    \ `large-arc-flag` 设置为 `0` 或 `1` 对最终结果没有影响，你就知道是这种情况了。当两个半径值与曲线起点和终点之间的距离成特定比例时，就会发生这种情况。\n\
    \n因此，将 `rx` 和 `ry` 值视为影响弧线形状的比率，而不是直接决定弧线大小的值，可能会更容易理解（当使用较小的半径值时尤其如此）。如果这听起来不太好理解，也不必担心——起初这相当违反直觉，只有通过实验才会变得更清晰。\n\
    \n为了帮助进行这种实验，并希望让椭圆弧曲线更易于理解，我创建了一个交互式笔，展示了改变半径和标志值的效果。你可以在 [`davidmatthew.ie/generative-art-javascript-svg#arc-curve`](https://davidmatthew.ie/generative-art-javascript-svg#arc-curve)\
    \ 找到这个笔。\n"
- fmt: '# Generative Arcs


    Let’s take a break from further wrestling with the theoretical intricacies of
    elliptical arc curves and put them to some practical, creative use instead. Using
    our usual copy method, create a new sketch folder and name it something like `15-generative-arcs`.
    The aim of this sketch will be to create two sets of arc curves: one set running
    clockwise and the other set mirroring it, running anticlockwise. We’ll randomize
    a number of key variables to keep the output unique and difficult to predict.


    When you’re ready, set up a group below the background that will contain our arc
    curves. After that, we’ll set up some randomized variables we’ll utilize in the
    loop that follows.


    ```

    // Set up a container group for our arc curves.

    let arcs = svg.create(''g'');

    // Randomise some variables.

    let rx = Gen.random(5, 350);

    let ry = Gen.random(5, 350);

    let hue = Gen.random(0, 360);

    ```


    Next we’ll start our loop, which will run 360 times. Inside it, we’ll randomize
    some further variables: the arc’s `rotation`, which will have the effect of distending
    the curve in a particular direction, and the `large-arc-flag`, which, thanks to
    our `Gen.chance()` function, will have a 50% chance of being either `0` or `1`.


    ```

    for (let i = 0; i < 360; i += 1) {

    // Randomise the rotation and large arc flag.

    let rotation = Gen.random(0, 180);

    let largeArc = Gen.chance() ? 1 : 0;

    }

    ```


    Next (and still within our loop) create the first set of clockwise arc curves.
    Remember, what makes them run either clockwise or anticlockwise is the `sweep-flag`,
    which is the fifth argument of the `A` command. Here, after our `largeArc` variable,
    we’re setting the `sweep-flag` to `1`, meaning clockwise.


    ```

    // Create a first set of clockwise arc curves (sweep = 1).

    arcs.create(''path'').set({

    fill: ''none'',

    stroke: `hsl(${hue} 75% 75% / 0.05)`,

    d: `M 275 500 A ${rx} ${ry} ${rotation} ${largeArc} 1 725 500`

    });

    ```


    The second set of arc curves will be identical, bar two small changes. The `sweep-flag`
    we’ll set to `0`, making this set anticlockwise, and the `hue` we’ll offset by
    `60`, just to add a bit of contrast to the colors. And before we close out the
    loop, we’ll increment the `hue` using the aforementioned modulo operator.


    ```

    // Create a second set of counter-clockwise arc curves (sweep = 0).

    arcs.create(''path'').set({

    fill: ''none'',

    stroke: `hsl(${hue + 60} 75% 75% / 0.05)`,

    d: `M 275 500 A ${rx} ${ry} ${rotation} ${largeArc} 0 725 500`

    });

    // Increment the hue.

    hue = (hue % 360) + 0.5;

    ```


    If you run the sketch at this point, you’ll see some nicely varied generative
    arcs (example output in Figure [6-9](#538894_1_En_6_Chapter.xhtml#Fig9)). If you
    want to inject a little more dynamism though, you could add the following line
    after the loop:


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig9_HTML.png)


    An abstract presents a rectangular-shaped structure, which has two elliptical
    arcs with a cluster of overlapped layers, against a dark background.


    **Figure 6-9** Two renders of our generative arcs


    ```

    // Apply a random rotation.

    arcs.rotate(Gen.random(0, 360));

    ```


    # Cubic Bezier Curves


    The final curve we’ll cover is the cubic Bezier curve, called by the `C` command.
    This is the most versatile of all the vector curves available to us and is the
    main curve utilized in most vector drawing and illustration packages (usually
    under the alias of the pen tool). It has two sets of control points, so the syntax
    is a little more complex than its quadratic counterpart, but it’s easier to grapple
    with than the elliptical arc curve.


    ```

    // Syntax of the C/c command.

    ''C [cpx1 cpy1 cpx2 cpy2 x y] ...''

    ''c [dcpx1 dcpy1 dcpx2 dcpy2 dx dy] ...''

    ```


    ## Cubic Control Points


    The first set of control point coordinates `cpx1` and `cpy1` shapes the curve
    from the side of the starting point. This starting point is declared prior to
    the `C` command – it might be a set of `M` coordinates, for example, or the end
    point of a previous curve. The second set of control point coordinates `cpx2`
    and `cpy2` shapes the curve of the destination point, and this point is defined
    by the final two coordinates: `x` and `y`. Here’s an example:


    ```

    // Creating a single cubic bezier curve.

    svg.create(''path'').set({

    d: ''M 75,75 C 140,330 360,330 425,75''

    });

    ```


    The preceding path is illustrated in Figure [6-10](#538894_1_En_6_Chapter.xhtml#Fig10),
    where you can see the initial `M` point in yellow, and in red, the three points
    that comprise the cubic Bezier curve itself. The colored dots and dashed lines
    are just for illustrative purposes; these wouldn’t be rendered in the final SVG.


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig10_HTML.png)


    An abstract presents a square-shaped structure, which has an upward parabolic
    curve with two endpoints connected to the sloped dashed lines with two endpoints.


    **Figure 6-10** A cubic Bezier curve with the control points visualized


    When linked together, consecutive cubic Bezier curves can combine to create any
    2D shape imaginable. They are such a staple of vector drawing programs that wielding
    them effectively has become a craft in itself. Judicious use of these curves and
    their “handles” (visualized as the dashed lines in Figure [6-10](#538894_1_En_6_Chapter.xhtml#Fig10))
    can make the difference between smooth, graceful line art and awkward, clunky
    clip art.


    ## S for Symmetry


    Like the quadratic Bezier curve, the cubic Bezier curve has a related command
    that can be called if you want to extend the curve with another that is smoothly
    connected to it. The command to use for this is `S` (or `s` for relative values).
    The `S` command automatically generates a symmetric control point that mirrors
    the control point of the preceding curve and as a result allows us to omit the
    first set of control point coordinates.


    ```

    // Extending a cubic bezier curve with the S command.

    svg.create(''path'').set({

    d: ''M 50,150 C 100,250 200,50 250,150 S 400,50 450,150''

    });

    ```


    In Figure [6-11](#538894_1_En_6_Chapter.xhtml#Fig11), the faintest of the dashed
    lines indicates where the `S` command has automatically generated a symmetrical
    control point.


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig11_HTML.png)


    An abstract presents a rectangular-shaped structure, which has cubic bezier curves,
    and the dashed lines indicate the `S` command with symmetrical control points.


    **Figure 6-11** A smoothly extended cubic Bezier curve


    # Organic Curves


    Let’s put the preceding knowledge to use in a composition, the aim of which will
    be to create a series of smooth, organic-looking curves. To this end, our friend
    `Noise` will nudge us in the right direction. First, do the usual and copy the
    template folder, calling it something like `16-organic-curves`. Ensure you have
    the following imports at the top:


    ```

    import { SvJs, Gen, Noise } from ''../../node_modules/svjs/src/index.js'';

    ```


    The parent SVG and background will then follow, at which point we’ll create some
    noise-related variables. I’m including a new one here called `amplifier`; this
    will be used when we map the noise value to a new range (increasing its volume
    so to speak).


    ```

    // Noise-related.

    let noise = new Noise();

    let n = Gen.random(0, 1000);

    let speed = 0.05;

    let amplifier = Gen.random(200, 500);

    ```


    Next we’ll set up variables relating to colors and the curves themselves, which
    we’ll contain within a group.


    ```

    // Curve and colour-related.

    let curves = svg.create(''g'');

    let numCurves = Gen.random(75, 125);

    let hue = Gen.random(0, 360);

    ```'
