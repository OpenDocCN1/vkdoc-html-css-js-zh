    \ 'stroke'`，你就会明白我的意思）。\n\n## 圆形和椭圆\n\n圆形是所有形状中最简单（也可以说是最完美）的。我们通过`cx`和`cy`属性定义其中心位置，并通过`r`属性定义其半径。\n"
- fmt: "# 排版后的文本\n\n```  \n// A simple circle example.  \nsvg.create('circle').set({\
    \ cx: 50, cy: 50, r: 25 });  \n```\n\nIn the next sketch, let’s shift things up\
    \ a gear with a `for` loop. We’re going to play with the effect of layering semitransparent\
    \ circles of different sizes over each other (shown in Figure [3-2](#538894_1_En_3_Chapter.xhtml#Fig2)).\
    \ Copy our template folder again and rename it to `03-circle-overlay-loop` or\
    \ something similar (the names of our folders don’t really matter provided we\
    \ maintain a modicum of organization).\n\nBeneath where we defined our background,\
    \ include the following code:\n\n```  \n// Circle overlay loop.  \nfor (let i\
    \ = 1; i <= 6; i += 1) {  \n// Vary the radius, and the two vertical centre points.\
    \  \nlet r = 50 * i;  \nlet cx = 500;  \nlet cy1 = 800 - r;  \nlet cy2 = 200 +\
    \ r;  \n// Create the blueish circle set.  \nsvg.create('circle').set({  \ncx:\
    \ cx, cy: cy1, r: r, fill: '#99eeff', fill_opacity: 0.1  \n});  \n// Create the\
    \ greenish circle set.  \nsvg.create('circle').set({  \ncx: cx, cy: cy2, r: r,\
    \ fill: '#aaffee', fill_opacity: 0.1  \n});  \n}  \n// Create a subtle outline.\
    \  \nsvg.create('circle').set({  \ncx: 500, cy: 500, r: 320, fill: 'none',  \n\
    stroke: '#aaffee', stroke_width: 2, stroke_opacity: 0.1  \n});  \n```\n\n![](images/538894_1_En_3_Chapter/538894_1_En_3_Fig2_HTML.png)\n\
    \nAn abstract presents an oversized circle with several layers of semi-transparent\
    \ circles, against a dark background.\n\n**Figure 3-2**  \nThe result of our circle\
    \ overlay loop\n\nWhat we’ve done here is vary the vertical position of the `cy`\
    \ attribute and increase the radius `r` for two sets of circles each time the\
    \ loop runs. The circle sets are differentiated by their color (slightly) and\
    \ initial positions. A final circle outside the loop provides a subtle outline\
