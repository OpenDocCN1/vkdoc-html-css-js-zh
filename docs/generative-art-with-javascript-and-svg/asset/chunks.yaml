    ## 线条、折线与多边形


    如果你需要绘制一条从一个点到另一个点的简单直线，可以使用`line`元素。它需要两组坐标：`x1`和`y1`定义起点位置，`x2`和`y2`定义终点位置。同时还需要定义`stroke`（描边）（因为它毕竟是一条线）。


