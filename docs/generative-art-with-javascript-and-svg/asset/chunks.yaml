    of a quick sketch; copy our `00-template` folder and call it `04-chalkboard-gag`.
    If you’ve ever watched *The Simpsons*, you’ll know that the beginning of most
    episodes features a chalkboard gag, where Bart is shown scrawling lines on a chalkboard
    as punishment for his errant behavior. One of my favorites is featured in the
    following sketch.


    What we need to do first is include the following `<link>` in our HTML, so switch
    over to the `index.html` file and add the following line to the `<head>` section.
    This calls in a Google font called `Mynerve`, which has the handwritten look we’re
    going for.


    ```

    If Bart had the option of running a `for` loop to minimize the repetitive nature
    of his punishment, I’m sure he would have taken it. Let’s do this on his behalf
    (and cheat Skinner out of some satisfaction).

    ```


    Add the following code below where we declare our background. Some points to note:
    we’re calling the `toUpperCase()` string method to capitalize the content; this
    is a useful method to know, as is the related `toLowerCase()` method. The `font_size`
    of `52` is used to optimally fill the `viewBox` width, and incrementing the `y`
    position on each iteration by `80` is what pushes the lines down our chalkboard.
    We have enough space to do this `12` times, which is why we limit incrementation
    to below `960` (`960 ÷ 80 = 12`). Another iteration would overflow the viewport.


    The output is shown in Figure [3-7](#538894_1_En_3_Chapter.xhtml#Fig7).


    ![](images/538894_1_En_3_Chapter/538894_1_En_3_Fig7_HTML.png)


    A screenshot of the output page. It features a collection of text that reads Bart
    bucks are not legal tender.


    **Figure 3-7** The “Bart Bucks” chalkboard gag


    ```

    // The line to use for the gag.

    let line = ''"Bart Bucks" are not legal tender.'';

    line = line.toUpperCase();

    // Run a loop, creating 12 (960 / 80) lines of text.

    for (let i = 0; i < 960; i += 80) {

    let text = svg.create(''text'');

    text.content(line);

    text.set({

    x: 20,

    y: 80 + i,

    fill: ''#fff'',

    font_size: 52,

    font_family: ''Mynerve''

    });

    }

    ```


    Titles are another type of text we can use. Unlike a `text` element, a `title`
    element doesn’t need to be positioned; it is intended to be nested within an element
    as a description. It works in the same way an HTML `title` attribute works; it
    helps with accessibility and appears as a tooltip on hover. It can be used to
    title the parent SVG element, or any of its child elements.


    ```

    // Create a title for a circle element.

    let circle = svg.create(''circle'');

    let circleTitle = circle.create(''title'');

    circleTitle.content(''I get around-round, I get around.'');

    ```


    A `title` element is suitable for shorter descriptions; for more extended descriptions,
    the `desc` element is recommended. This doesn’t render and is purely for accessibility
    purposes, and is created in exactly the same way as a `title` element. If you
    want to add extra information about the SVG file itself, the `metadata` element
    can be used. An example would be embedding RDF (Resource Description Framework)
    data, or application-specific data. You’ll often see software like Inkscape or
    Illustrator embed their own metadata in this manner.


    ## Definitions


    If we want to define a graphical or other container element for use in our SVG
    but don’t want that element itself to appear (or if we want it to appear only
    when referenced), we would nest it within the `defs` element, which stands for
    definitions. The `defs` element can improve the overall accessibility of an SVG
    and also better help organize its content.


    We’ll rely on the functionality provided by the `defs` element in the upcoming
    sections on gradients, patterns, and other reusable elements.


    ```

    // Defining a defs element.

    let defs = svg.create(''defs'');

    ```


    ## Gradients


    A gradient is a gradual transition from one color state to another. In SVG, gradients
    can support a multitude of these different color states (or “stops” as they’re
    called). Most often, you’ll see gradients of the two-stop variety, but occasionally
    you’ll come across one boasting a rainbow-esque array of different colors. And
    speaking of rainbows, the sky itself is a great source of gradient inspiration
    (gradienspiration?). Think of the dim light at dusk where soft yellows transition
    to light blues, or the brilliant blaze of a sunset where purples, reds, and oranges
    collide.


    Gradients can be of two varieties: linear (a color transition that proceeds from
    one area to another in a straight line) and radial (a color transition that emanates
    outward in all directions from a focal point).


    How would we create such gradients in SvJs? It turns out it would be a very verbose
    process using just the `create()` method, and there’s a couple of reasons for
    this:


    *   Gradients are defined as stand-alone elements within the `defs` section rather
    than treated as purely presentational element attributes. The upside of this is
    that a single gradient can be shared among multiple elements, but the downside
    is we’ve got a couple of extra steps to begin with.

    *   For each gradient color, a `stop` element must be defined and nested within
    the gradient element to define the color and its offset (or position). This adds
    another series of steps.


    To remedy the aforementioned, SvJs offers a dedicated `createGradient()` method
    that significantly speeds up the process of constructing a gradient. Its syntax
    is as follows:


    ```

    createGradient(id, type, colours, rotation)

    ```


    With the first argument, we assign an `id` to the gradient so that it can be referenced
    or called upon later by an element. With the second argument, we specify the gradient
    type, that is, linear or radial. With the third argument, we pass in an array
    of color values. And with the final argument, we specify the angle of rotation,
    which is 45° by default (meaning it “shines” from the top left to the bottom right).
    This last argument is optional and is only applicable to gradients of the linear
    variety.


    The `createGradient()` method can only be called by the parent SVG, as behind
    the scenes it checks whether a `defs` element is already defined within the SVG,
    and if not, it creates it and appends the gradient to it.


    Here’s how we might create a simple three-stop linear gradient and apply it to
    a `rect` element.


    ```

    // Create the gradient with an id of ''grad''.

    svg.createGradient(''grad'', ''linear'', [''red'', ''orange'', ''yellow''], 90);

    // Apply the gradient to the fill of the rect via a url reference.

    svg.create(''rect'').set({

    x: 0, y: 0, width: 400, height: 400, fill: ''url(#grad)''

    });

    ```


    As you can see, the shape we want the gradient applied to references the gradient
    `id` as an internal `url`. In the preceding example, we’ve applied it to the `fill`
    attribute, but it could also have been applied to the `stroke`.


    In Figure [3-8](#538894_1_En_3_Chapter.xhtml#Fig8), we see an example of three
    linear gradients and their radial equivalents. The first gradient has two color
    stops, the second has three, and the third has four. As you can see, it’s easier
    to make linear gradients look smoother; with radial gradients, subtlety is always
    better, as transitions can seem relatively abrupt (or banded) compared to their
    linear counterparts.


    ![](images/538894_1_En_3_Chapter/538894_1_En_3_Fig8_HTML.png)


    An abstract presents three vertical bars and three circles, in a gradient of colors,
    against a dark background.


    **Figure 3-8** Linear gradients and their radial equivalents


    There are more ways to customize gradients that we won’t get into here, but if
    you’re interested, check out the MDN documentation for more on the gradient `spreadMethod`
    and varying the focal points of radial gradients.'
