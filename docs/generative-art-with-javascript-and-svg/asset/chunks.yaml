- fmt: "# Design Thinking\n\nDesign Thinking is a set of strategic and creative processes\
    \ and principles used in the planning and creation of products and solutions to\
    \ human-centered design problems.\n\nWith design and innovation being two key\
    \ driving principles, this series focuses on, but is not limited to, the following\
    \ areas and topics:\n\n* User Interface (UI) and User Experience (UX) Design\n\
    * Psychology of Design\n* Human-Computer Interaction (HCI)\n* Ergonomic Design\n\
    * Product Development and Management\n* Virtual and Mixed Reality (VR/XR)\n* User-Centered\
    \ Built Environments and Smart Homes\n* Accessibility, Sustainability and Environmental\
    \ Design\n* Learning and Instructional Design\n* Strategy and best practices\n\
    \nThis series publishes books aimed at designers, developers, storytellers and\
    \ problem-solvers in industry to help them understand current developments and\
    \ best practices at the cutting edge of creativity, to invent new paradigms and\
    \ solutions, and challenge Creatives to push boundaries to design bigger and better\
    \ than before.\n\nMore information about this series at [`https://link.springer.com/bookseries/15933`](https://link.springer.com/bookseries/15933).\n\
    \nISSN 2945-7793  \ne-ISSN 2945-7807  \nDesign Thinking  \nISBN 979-8-8688-0085-6\
    \  \ne-ISBN 979-8-8688-0086-3  \n[https://doi.org/10.1007/979-8-8688-0086-3](https://doi.org/10.1007/979-8-8688-0086-3)\
    \  \n© David Matthew 2024\n\nThis work is subject to copyright. All rights are\
    \ solely and exclusively licensed by the Publisher, whether the whole or part\
    \ of the material is concerned, specifically the rights of translation, reprinting,\
    \ reuse of illustrations, recitation, broadcasting, reproduction on microfilms\
    \ or in any other physical way, and transmission or information storage and retrieval,\
    \ electronic adaptation, computer software, or by similar or dissimilar methodology\
    \ now known or hereafter developed.\n\nThe use of general descriptive names, registered\
    \ names, trademarks, service marks, etc. in this publication does not imply, even\
    \ in the absence of a specific statement, that such names are exempt from the\
    \ relevant protective laws and regulations and therefore free for general use.\n\
    \nThe publisher, the authors and the editors are safe to assume that the advice\
    \ and information in this book are believed to be true and accurate at the date\
    \ of publication. Neither the publisher nor the authors or the editors give a\
    \ warranty, expressed or implied, with respect to the material contained herein\
    \ or for any errors or omissions that may have been made. The publisher remains\
    \ neutral with regard to jurisdictional claims in published maps and institutional\
    \ affiliations.\n\nThis Apress imprint is published by the registered company\
    \ APress Media, LLC, part of Springer Nature.\n\nThe registered company address\
    \ is: 1 New York Plaza, New York, NY 10004, U.S.A.\n\n*Dedicated to the deeply\
    \ human experience of creating art.*\n\n## Introduction\n\nA caveat before we\
    \ begin: generative art, and creative coding more generally, can become an all-consuming\
    \ addiction. “Just one more iteration” is a refrain you might hear from those\
    \ unfortunate artists caught in its thrall. Creatives craving that next generative\
    \ hit mixed with just the right amount of randomness.\n\nThe purpose of this book\
    \ is to deal out this computational devilry in small doses, in a clear, logical\
    \ fashion, so you can approach this topic safely and with your sanity intact.\
    \ We will encounter organic forms borne of mechanical precision, unpredictable\
    \ swathes of color cover our screens, lines and shapes flocking together in impossible\
    \ harmony, and see complex structures emerge from simple rules. This is the essence\
    \ of generative art, where not all is in your control.\n\nThat said, it’s a medium\
    \ that requires time, patience, and skill on the part of the artist `–` no less\
    \ so than with other artistic mediums. And although I might be exaggerating the\
    \ power it has over its practitioners, the point I really want to make is that\
    \ coding has this expressive side to it `–` it can be frustrating and headache-inducing,\
    \ sure `–` but it can also fascinate and inspire. If I can equip you with some\
    \ new generative tools and techniques, and in the process excite you just a little\
    \ about their creative possibilities `–` possibilities that extend beyond the\
    \ field of art into those of design and web development `–` this book will have\
    \ more than done its job.\n\n### What You Should Know\n\nAs a reader, what should\
    \ you know before tackling this book? It will no doubt be easier if you are comfortable\
    \ with the core concepts of programming, like `variables`, `functions`, `loops`,\
    \ and `conditionals`. These kinds of concepts carry over from language to language,\
    \ differing mainly with respect to syntax, so if you come from a language other\
    \ than JavaScript, then that’s completely fine.\n\nIf you have no prior programming\
    \ experience, we will be covering the concepts required in Chapter [2](#538894_1_En_2_Chapter.xhtml),\
    \ but I should emphasize that this book is not intended to be an introduction\
    \ to programming. The second chapter is best thought of as a primer, a jumping-off\
    \ point for a deeper dive elsewhere. A short introductory course would really\
    \ benefit you here. Personally I’d recommend the wonderful [`freeCodeCamp.com`](https://freeCodeCamp.com),\
    \ a site I’ve spent many hours using myself. It offers free interactive tutorials\
    \ on the basics of `HTML`, `CSS`, and `JavaScript`, and much more besides.\n\n\
    For those coming from another language, like Python, PHP, or C#, the second chapter\
    \ may still be valuable, to be sure you’re acquainted with the syntax and some\
    \ of the idiosyncrasies of `JavaScript`.\n\nIf you’re already a practicing web\
    \ developer, you could skip (or quickly skim) Chapter [2](#538894_1_En_2_Chapter.xhtml),\
    \ depending on your level of experience. If you’re unfamiliar with any of the\
    \ techniques or syntax used in our opening example (which we’ll end Chapter [1](#538894_1_En_1_Chapter.xhtml)\
    \ with), I’d encourage you to give the second chapter a read, where they’ll be\
    \ fully explained. The field of web development is vast enough that what is bread\
    \ and butter to one developer might be bleeding edge to another.\n\n### What You\
    \ Will Learn\n\nI mentioned previously that I’ll be equipping you with some new\
    \ tools and techniques. Let’s flesh these out.\n\n#### Tools\n\nOn the tool end\
    \ of things, we’ll be using the following:\n\n*   `JavaScript` and the `SvJs`\
    \ library. I’ll elaborate on this further later.\n*   A code editor. Here I’ll\
    \ be giving you a choice between:\n    *   `Visual Studio Code` (an excellent\
    \ open source code editor)\n    *   `CodePen` (a popular online code editor)\n\
    *   If you opt to use `Visual Studio Code` (which I recommend), we’ll also be\
    \ using `Node.js` and `NPM` to manage dependencies (a good habit to get into as\
    \ a developer).\n\nAll code examples are available on both `GitHub` and `CodePen`,\
    \ so feel free to follow along whichever way you prefer. You can of course do\
    \ both, work locally with a code editor but check out `CodePen` examples online\
    \ for quick inspiration. For convenience, I’ll organize and embed all `CodePen`\
    \ examples at [`davidmatthew.ie/generative-art-javascript-svg`](https://davidmatthew.ie/generative-art-javascript-svg)."
