    Like gradients, patterns reside in the`defs` element to be referenced later rather
    than rendered directly. They have their own`viewport` (i.e., width and height)
    and optional`viewBox`, which can seem a little complicated at first, but it does
    allow for a greater degree of flexibility. Think of a`pattern` element as a miniature
    canvas to be replicated across a larger graphical element and these settings will
    make more sense.


    To create a pattern, we can use the`createPattern()` shortcut method, which, as
    with the gradient method, automatically appends itself to a`defs` element and
    creates one if it doesn’t exist. It also simplifies pattern creation in other
    ways under the hood that you don’t have to worry about. It requires three arguments:
    the pattern`id`, the`width`, and the`height`.


    To show how patterns work, we’ll create a quick sketch – another optical illusion,
    but this time the focus won’t be on the colors. Copy our`00-template` folder and
    rename it to`05-optical-illusion`.


    In our`sketch.js` file below the code for the background, create a pattern with
    an`id` of ’illusion’ and with a width of`100` and a height of`200`.


    ```

    // Create our pattern.

    const pattern = svg.createPattern(''illusion'', 100, 200);

    ```


    This simply initializes our pattern; we haven’t placed anything within it yet,
    nor have we set up a shape to apply it to. We just have a pattern in the shape
    of a vertical rectangle.


    In our first iteration of this sketch, I’ll show you how a simple pattern gets
    applied to a shape. We’ll get more elaborate with the pattern content afterward.
    Add the following code to our sketch:


    ```

    // Create a white rectangle within the pattern.

    pattern.create(''rect'').set({

    x: 10, y: 10, width: 80, height: 180, fill: ''#eee''

    });

    ```


    Now that we have our simple pattern in place (consisting of a single white rectangle),
    it’s time to apply it to a shape. For simplicity, let’s apply it to another`rect`
    the full size of the SVG`viewBox`, like so:


    ```

    // Apply our pattern to a rect the size of the viewBox.

    svg.create(''rect'').set({

    x: 0, y: 0, width: 1000, height: 1000, fill: ''url(#illusion)''

    });

    ```


    You should now see something similar to Figure [3-9](#538894_1_En_3_Chapter.xhtml#Fig9).
    Not especially interesting, but sufficient to showcase the basics.


    ![](images/538894_1_En_3_Chapter/538894_1_En_3_Fig9_HTML.png)


    A grid-shaped pattern with 10 columns and 5 rows.


    **Figure 3-9** A basic pattern


    In the next few steps, we’ll create our optical illusion. First, comment out the
    code that created the white rectangle pattern (but keep the shape it’s applied
    to).


    ```

    // Create our pattern.

    const pattern = svg.createPattern(''illusion'', 100, 200);

    // Create a white rectangle within the pattern.

    // pattern.create(''rect'').set({

    //  x: 5, y: 5, width: 90, height: 190, fill: ''#eee''

    // });

    // We''ll place our new code here.

    // Apply our pattern to a rect the size of the viewBox.

    svg.create(''rect'').set({

    x: 0, y: 0, width: 1000, height: 1000, fill: ''url(#illusion)''

    });

    ```


    To create the base of our optical illusion, we need a total of eight rectangles.
    Four of them will be white squares arranged in a particular order, and four will
    be thin gray rectangles used as separators. We’ll use a couple of`for` loops to
    create these.


    First, the white squares:


    ```

    // Create 4 x white squares within the pattern.

    for (let i = 0; i < 4; i += 1) {

    pattern.create(''rect'').set({

    x: (i === 3) ? 20: i * 20,

    y: i * 50,

    width: 50,

    height: 50,

    fill: ''#eee''

    });

    }

    ```


    The`width`, `height`, and`fill` merely repeat themselves on each iteration; the
    only attributes we’re varying are the`x` and`y` coordinates. To do this, we’re
    using the changing value of the`i` iterator. The`y` coordinate increases by`50`
    on each run, which is simple enough. The expression defining the`x` position is
    a little more complicated. What we’re saying here is that we want`x` to increase
    by`20` on each iteration, *except* for the final one (where`i === 3`). For this,
    we want to set it to`20`.


    If you view the pattern at this point, you should see an undulating array of squares.
    It’s not an optical illusion yet; it looks more like rudimentary pixel art. To
    complete the illusion, we need our separators.


    ```

    // Create 4 x thin grey rectangles to separate the squares.

    for (let i = 0; i < 4; i += 1) {

    pattern.create(''rect'').set({

    x: 0,

    y: 45 + (i * 50),

    width: 100,

    height: 5,

    fill: ''#666''

    });

    }

    ```


    Now when you hit save, you should see something like Figure [3-10](#538894_1_En_3_Chapter.xhtml#Fig10).


    ![](images/538894_1_En_3_Chapter/538894_1_En_3_Fig10_HTML.png)


    An abstract presents several rectangles in a checkerboard pattern that are arranged
    in a zig-zag method.


    **Figure 3-10** A repeating pattern creating an optical illusion


    If the illusion worked, the gray lines should appear slightly slanted, particularly
    those you’re not directly focusing on. Hopefully this will give you some sense
    of the power of patterns! We’ve touched on the main points, but they can be customized
    extensively with further parameters if needed.


    ## Grouping and Reusing Elements


    Grouping elements together can be done with the`g` element. There are a number
    of use cases for this. One, which applications like Inkscape have adopted, is
    to use the`g` element to support layer functionality. Another is to group elements
    together for the purposes of transformation (i.e., moving, rotating, or skewing
    multiple elements at once). And another is to simply group items together to better
    organize your SVG.


    ```

    // Create a circle and add it to a group.

    const circle = svg.create(''circle'');

    const group = svg.create(''g'');

    circle.addTo(group);

    ```


    If you want to group elements together for later reuse (so that they are only
    displayed when referenced), you’d use the`symbol` element. Symbols, like patterns,
    can have their own`viewport` and`viewBox`. But they are called via the`use` element
    rather than applied to a`fill` or`stroke`.


    ```

    // Create a symbol consisting of a circle and square.

    const symbol = svg.create(''symbol'');

    symbol.set({ id: ''mySymbol'', width: 100, height: 100 });

    symbol.create(''circle'').set({ ... });

    symbol.create(''rect'').set({ ... });

    // Using the symbol three times but varying its co-ordinates.

    svg.create(''use'').set({ href: ''#mySymbol'', x: 0, y: 0 });

    svg.create(''use'').set({ href: ''#mySymbol'', x: 200, y: 200 });

    svg.create(''use'').set({ href: ''#mySymbol'', x: 400, y: 400 });

    ```


    Symbols don’t have quite the same appeal outside of a declarative context, so
    going forward we won’t be relying on them for our imperative-based creations.
    But there’s plenty more to unpack if you want to explore further on MDN.


    ## Summary


    To recap, we’ve covered the following in this chapter:


    - The core functions provided by the SvJs library

    - How the SVG`viewBox` and`viewport` work

    - Creating basic shapes like rectangles, circles, ellipses, polylines, and polygons

    - Customizing`stroke` behavior and appearance

    - Working with text and titles

    - Creating gradients and patterns

    - How definitions, groups, and symbols allow us to reuse elements and better structure
    our SVG


    In the next chapter, we’ll explore how we can combine regularity with randomness
    to create truly generative compositions.


    # 4. Randomness and Regularity'
