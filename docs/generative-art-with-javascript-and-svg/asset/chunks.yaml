    \ 500);\nlines.rotate(Gen.random(0, 360));\n```\n\nAs you can see in Figure [5-4](#538894_1_En_5_Chapter.xhtml#Fig4),\
    \ what we end up are a series of slightly asymmetric lines that somewhat resemble,\
