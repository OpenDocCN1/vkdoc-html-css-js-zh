    ## Choice and Chance


    What if we were to bring an element of chance into choosing whether or not to
    populate a given cell in our grid? This can lead to a less rigid-looking composition
    – which isn’t necessarily better, but it can offer more in the way of variety.


    ### The SvJs `Gen.chance()` Function


    When we talk about probability, what we’re usually trying to establish are the
    chances, or the odds, of something occurring. This something will either happen
    or it won’t, so what we want is a binary response – or boolean – to tell us yes
    or no, win or lose. Will your horse Victor Vector give you a payout at the races
    today? Given the odds are 7 to 2, there’s a 22% chance of some winnings (2 / (7
    + 2) x 100 = 22.22).


    How could we work this kind of logic into our compositions? It’s actually quite
    simple to do with plain JavaScript and `Math.random()`, but SvJs offers a more
    intuitive, less verbose alternative with its `Gen.chance()` function.


    By default (i.e., without any arguments), `Gen.chance()` returns either `true`
    or `false` based on odds of 50/50, or 50%. If we supply a single argument, it’s
    interpreted as a percentage.


    ```

    // The below returns true 60% of the time.

    Gen.chance(60);

    ```


    If two numbers are supplied, the arguments are interpreted as odds. This can be
    useful if you prefer thinking of probabilities more in terms of placing a bet
    at a bookie than calculating a precise percentage value (which is actually done
    for you under the hood).


    ```

    // There is a 7 to 2 chance of this returning true.

    Gen.chance(7, 2);

    ```


    ### Chance in Action


    Let’s create a new sketch, using `Gen.chance()` to determine whether or not the
    cells within our grid get populated with content. Copy the `08-colourful-grids`
    folder and rename it to `09-chance`, and then remove all content from the inner
    loop (leaving you with an empty nested `for` loop). Next, replace the `palettes`
    array and `pickedPalette` variable with a randomly generated `hue`.


    ```

    // Pick a random hue.

    let hue = Gen.random(0, 360);

    ```


    You can leave the grid-related variables as they are, or tweak them if you prefer.
    Next, *between* the `x` and `y` loops (so within the first loop but before the
    second), increment the `hue` like so:


    ```

    // A nested loop to create the grid.

    for (let y = 0; y = 360) ? (hue - 360) + (120 / rows) : hue + (120 / rows);

    for (let x = 0; x < gridSize; x += increment) {

    ...

    ```


    This might seem like an overly complex way of increasing the `hue` value, but
    really it’s just doing two things: first, it’s ensuring the `hue` value doesn’t
    stray out of bounds (i.e., beyond `360`), and second, it’s incrementing the `hue`
    value relative to the number of rows. This is so that sketch variations with a
    lower row count have a higher increment value, and those with a higher row count
    have a lower increment value, resulting in greater color consistency overall.


    Inside the `x` loop is where we’ll actually use `Gen.chance()`. Used as a condition
    inside an `if` statement, we can conditionally fire a third loop based on the
    result it returns. This loop will create random `line` elements inside each cell,
    but only if the cell is activated by the `Gen.chance()` function. We’ll set the
    actual probability to 60%.


    ```

    // Run the loop based on chance.

    if (Gen.chance(60)) {

    for (let i = 0; i < cellSize; i += 1) {

    grid.create(''line'').set({

    x1: Gen.random(x, x + cellSize),

    y1: Gen.random(y, y + cellSize),

    x2: Gen.random(x, x + cellSize),

    y2: Gen.random(y, y + cellSize),

    stroke: `hsl(${hue} 80% 80% / 0.33)`

    });

    }

    }

    ```


    This should result in gradiented tetris-like arrangements, similar to Figure [4-9](#538894_1_En_4_Chapter.xhtml#Fig9).


    ![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig9_HTML.png)


    An abstract presents gradient tetris-like arrangements, against a dark background.


    **Figure 4-9** `Gen.chance()` in action


    ## Probability Distributions


    Probability distributions describe how numbers are spread out (or distributed)
    over a given range. Unless you’ve studied statistics in one form or another, you
    may not be too familiar with the term. And if the mere mention of statistics causes
    you to break out in a cold sweat, don’t worry – we won’t be delving into the underlying
    mathematics. We’ve actually been using a particular kind of probability distribution
    already but just haven’t attached the name to it.


    ### Uniform Distribution


    The `Gen.random()` function is an example of *uniform* distribution, where every
    number within the range has an equal chance of being chosen. In other words, there
    are no biases or tendencies hiding with the `Gen.random()` function (or indeed,
    the `Math.random()` on which it is based) that make it more likely that a certain
    subset of numbers within the range will be selected.


    In Figure [4-10](#538894_1_En_4_Chapter.xhtml#Fig10), we can see uniform distribution
    visualized as the variation of the `x` coordinate in the placement of 1000 vertical
    lines. The lines are all scattered with equal chance of appearing anywhere along
    the x axis.


    ![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig10_HTML.png)


    An abstract presents a rectangle-shaped structure with the linear arrangement
    of several bright lines in different sizes, against a dark background.


    **Figure 4-10** Uniform distribution of vertical lines


    ### Gaussian Distribution


    In real-life measurements (i.e., those outside the binary world of ones and zeros),
    uniform distribution isn’t actually that common. Far more prevalent is something
    called *Gaussian* distribution, where the majority of values cluster toward a
    midpoint and drop off either side of this. It is also known as normal distribution,
    and when graphed, it forms a bell-shaped curve. Visualized as a series of vertical
    lines, it looks like Figure [4-11](#538894_1_En_4_Chapter.xhtml#Fig11).


    ![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig11_HTML.png)


    An abstract presents a rectangle-shaped structure with the linear arrangement
    of highlighted lines in different thicknesses, against a dark background.


    **Figure 4-11** Gaussian distribution of vertical lines


    The midpoint around which most values accumulate is known as the mean, and the
    degree to which they drop off, or deviate, from this mean is known as sigma, or
    the standard deviation.'
