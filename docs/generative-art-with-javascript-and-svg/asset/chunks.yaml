    Regular Grids

    Unrestrained randomness will only get us so far; we need techniques

    to tame and constrain it. One particularly prominent technique in the

    generative art world is to work with grids, which allow us to structure

    our randomness.


    The Nested For Loop

    The nested `for` loop consists of one

    loop running within another. Because grids are comprised of columns

    (along the x axis) and rows (along the y axis), the nested `for` loop comes in

    very useful in their construction. What we’ll typically do is start

    along the y axis and create our rows, and for each row, we move from

    left to right along the x axis, filling out each cell within the column.

    This movement mimics how computers have historically drawn pixel data to

    their displays; start at the top left, move across, and work your way

    down.


    The outer loop will therefore be our y axis, moving down. For each

    iteration of the y axis, the inner (nested) loop will move across,

    populating the x axis.


    ```

    // Example nested loop structure.

    for (let y = 0; y < height; y += 1) {

    for (let x = 0; x < width; x += 1) {

    // Code goes here.

    }

    }

    ```


    Let’s create a sketch to better illustrate this. Copy and rename the

    template folder, renaming it to `07-regular-grids`.

    Below the background, we’ll set up a group element to act as our grid

    container.


    ```

    // Create our grid container group.

    let grid = svg.create(''g'');

    ```


    Now we’ll run our `for` loop, appending a

    `rect` element to

    the `grid` on

    each iteration.


    ```

    // A nested loop to visualise the grid.

    for (let y = 0; y < 700; y += 50) {

    for (let x = 0; x < 700; x += 50) {

    grid.create(''rect'').set({

    x: x, y: y, width: 40, height: 40, fill: ''none'', stroke: ''#eee''

    });

    }

    }

    ```


    The values we’ve used here aren’t especially meaningful; we could

    have chosen a different increment value, iteration count, width and

    height for the square, etc. We can tidy up these values later. What you

    will notice if you run `live-server` is that

    the grid is positioned off-center, to the top left (as our `x` and `y` values
    initialize

    at `0`). We could

    adjust the `x`

    and `y` values

    until the grid lines up with the center of the `viewBox`, but that

    would involve some tedious trial and error and would need to be adjusted

    each time we altered the grid. Instead, let’s use the built-in SvJs

    `moveTo()`

    method.

    The `moveTo()`

    method moves a given element by its center point to a new position. The

    new position is passed in as an `(x, y)` coordinate

    pair. This method is especially useful on a group element (where the

    center point isn’t straightforward to calculate) but can also be used as

    a more intuitive alternative to the `transform: translate(x y)` syntax.

    SvJs also offers a related `getCentre()` method (which the `moveTo()` method also
    utilizes

    internally) to retrieve an element’s center coordinates, returned as an

    `object` with

    `x` and `y` properties. This is

    useful when you want to position one element inside another.


    After the loop, call the `moveTo()` method as follows:


    ```

    // Centre the grid within the viewBox.

    grid.moveTo(500, 500);

    ```


    The grid should now line up nicely in the center of our `viewBox`, as shown in

    Figure [4-4](#538894_1_En_4_Chapter.xhtml#Fig4).


