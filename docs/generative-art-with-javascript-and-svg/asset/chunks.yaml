    这创建了一个方法链（将点视为链接）。如果我们传递`getElementById()`这个`DOM`方法作为参数，而不是将其赋值给一个变量，我们就可以将代码压缩成一行：


    ```

    // 父级 SVG。

    const svg = new SvJs().addTo(document.getElementById(''container''));

    ```


    然而，简洁并不总是优于清晰，所以如果这行代码对你来说有点过于压缩，请保持你的模板代码不变，无需替换成上述代码。


    ## 视口（Viewport）与视图框（ViewBox）


    `viewport`指的是我们`SVG`元素的可见部分。它是通过使用`width`和`height`属性隐式定义的。


    `SVG`格式一个有趣的地方在于其工作区的灵活性，即它可以包含内容的区域。一个`SVG`可能包含的内容远多于任何时刻通过`viewport`可见的部分。这为处理精灵图、画板和其他屏幕外资源提供了可能性。


    因为我们要使用一个正方形的`SVG` `viewport`，我们的`width`和`height`将相同，所以我们可以用一个变量来存储这个值。我们称之为`svgSize`。


    我们事先不知道屏幕尺寸或方向，因此硬编码一个值并不明智。相反，我们可以通过查询`window.innerWidth`和`window.innerHeight`来检查浏览器窗口的尺寸，并将`svgSize`设置为这两个值中较小的一个。这将确保正方形（或1:1）的宽高比。我们在前一章讨论的三元运算符对于这类检查特别有用。按照以下方式将其包含在模板中，以初始化`svgSize`变量：


    ```

    // 视口大小（1:1 宽高比）。

    const svgSize = window.innerWidth > window.innerHeight ? window.innerHeight :
    window.innerWidth;

    ```


    `viewBox`是另一个重要的顶级`SVG`属性。它与`viewport`相关，但拥有更强大（也更复杂）的功能。`viewBox`允许我们在用户空间中定义`viewport`的位置和尺寸。


    这到底意味着什么？你可以将用户空间视为无单位或与单位无关的空间。值`100`可能指的是像素、毫米、米或任何其他单位。它默认为像素，但`viewBox`的重点在于它可以让我们摆脱绝对单位的思维。我们可以使用自己的内部坐标系，而无需担心渲染`SVG`的设备的实际尺寸。


    就个人而言，我喜欢使用`1000`的宽度和高度，因为我觉得这样划分画布很直观。这`1000`个单位之后可以被压缩到一个`500px`宽的正方形中，或者铺满一个公交车大小的广告牌上。


    `viewBox`的前两个值定义了它的起始坐标（称为`min-x`和`min-y`），后两个值定义了`width`和`height`。我们保持简单，将`viewBox`定义为`0
    0 1000 1000`。


    如果`viewport`和`viewBox`的宽高比（即宽度与高度的比例）不同，可以使用`preserveAspectRatio`属性来指定浏览器应如何显示`SVG`。这很快就会变得相当复杂，这就是为什么我已经确保我们的`viewport`和`viewBox`共享相同的1:1（即正方形）宽高比。现在，仅需知道存在`preserveAspectRatio`这个属性即可，以备将来你想要实现更复杂的布局。


    有时，要最好地理解某些东西是如何工作的，你需要与它进行视觉交互。基于此，我构建了一个小的`CodePen`草图（或他们称之为“笔”）来演示调整主要`viewBox`值的效果，这样你就可以看到它们如何协同工作来缩放和裁剪`SVG`
    `viewport`内可见的内容。你可以在[`davidmatthew.ie/generative-art-javascript-svg#viewBox`](https://davidmatthew.ie/generative-art-javascript-svg#viewBox)找到这支笔。


    至此，我们获得了`viewBox`和`viewport`所需的值，但还未学习如何使用它们。


    ## 设置与获取值


    每个`SvJs`实例，无论是父级`SVG`还是其子元素，都有一个`set()`方法。此方法允许我们设置元素属性的值。


    我们如何知道一个元素有哪些属性？好吧，我们会查阅（即搜索）一些官方文档。我推荐的来源是Mozilla开发者网络的`SVG`元素参考，地址是[`developer.mozilla.org/en-US/docs/Web/SVG/Element`](https://developer.mozilla.org/en-US/docs/Web/SVG/Element)。用它来提醒自己，或者在你进行独立探索时使用。顺便说一句，`SvJs`库的完整文档可以在[`npmjs.com/package/svjs`](https://npmjs.com/package/svjs)（或相关的`GitHub`仓库）找到；如果你愿意，可以将其放在手边，以便获取每个方法更结构化的定义。


    回到设置值，`set()`方法接受一个对象作为其参数，并采用以下格式：


    ```

    svg.set({ attribute1: value1, attribute2: value2, attributeN: valueN )};

    ```


    如果你一次设置大量属性，为了可读性，你可以考虑调整格式。


    ```

    svg.set({

    attribute1: value1,

    attribute2: value2,

    ...

    attributeN: valueN

    )};

    ```


    不过这取决于你；两种方式都行。


    对于我们的父级`SVG`来说，值得注意的属性是`width`和`height`（它们构成了`viewport`）以及`viewBox`。我们现在可以将以下代码添加到我们的模板中来设置这些属性：


    ```

    svg.set({ width: svgSize, height: svgSize, viewBox: ''0 0 1000 1000'' });

    ```'
  raw: 'The `new SvJs()`

    constructor method is no exception, so our new parent SVG element can

    actually be immediately attached to a DOM element once instantiated, by

    appending the `addTo()` method to it.

    This creates a method chain (think of the dot as the link). And if we

    pass the `getElementById()` DOM

    method as an argument instead of assigning it to a variable, we can

    condense our code down to a single line:


    ```

    // Parent SVG.

    const svg = new SvJs().addTo(document.getElementById(''container''));

    ```


    Concision doesn’t always beat clarity however, so if this one-liner

    is a little too compressed for your liking, keep your template code as

    is, no need to replace it with the aforementioned.


    The Viewport and ViewBox

    The `viewport` refers to the visible

    portion of our SVG element. It is defined implicitly, via the use of

    `width` and `height`

    attributes.

    One of the interesting things about the SVG format is its flexibility

    with regard to its workspace, that is, the areas in which it can contain

    content. An SVG may contain much more besides what is visible at any one

    time through the `viewport`. This opens

    up the possibility of working with sprites, artboards, and other

    offscreen assets.


    Because we’ll be working with a square SVG `viewport`, our `width` and `height`
    will be the

    same, so we can use a single variable to store this value. We’ll call

    this `svgSize`.

    We don’t know in advance what the screen size or orientation will be, so

    hard-coding a value wouldn’t be wise. Instead, we can check the browser

    window dimensions by querying `window.innerWidth` and

    `window.innerHeight`

    and set `svgSize`

    to the smaller of the two values. This will ensure a square (or 1:1)

    aspect ratio. The ternary operator that we covered in the previous

    chapter is particularly useful for these kinds of checks. Include it as

    follows in the template to initialize the `svgSize` variable:


    ```

    // Viewport size (1:1 aspect ratio).

    const svgSize = window.innerWidth > window.innerHeight ? window.innerHeight :
    window.innerWidth;

    ```


    The `viewBox` is another important

    top-level SVG attribute. It is related to the `viewport` but has more

    powerful (and more complex) capabilities. The `viewBox` allows us to

    define the position and dimensions of our `viewport` in user

    space.

    What does this mean exactly? Well, you can think of user space as

    unitless, or unit-independent, space. A value of 100 might refer to

    pixels, millimeters, meters, or any other unit. It will default to

    pixels, but the point of the `viewBox` is that it can free us

    from thinking in absolute units. We can work with our own internal

    coordinate system without worrying about the actual dimensions of the

    device used to render the SVG.

    Personally, I like working with a width and height of 1000, as I find

    it intuitive to divide up a canvas that way. Those 1000 units could

    later be squeezed into a square 500px wide, or splashed across a

    billboard the size of a bus.

    The first two values of the `viewBox` define its

    starting coordinates (known as `min-x` and `min-y`), and the

    second two define the `width` and `height`. We’ll keep

    things simple by defining the `viewBox` as `0 0 1000 1000`.

    If the `viewport` and `viewBox` don’t share

    the same aspect (i.e., width to height) ratio, the `preserveAspectRatio`

    attribute can be used to specify how the browser should display the SVG.

    This can get complex quite quickly, which is why I’ve already ensured

    our `viewport`

    and `viewBox`

    will share the same 1:1 (i.e., square) aspect ratio. For now, just be

    aware the `preserveAspectRatio`

    attribute exists, should you wish to facilitate more elaborate setups in

    future.

    Sometimes to best understand how something works, you need to

    visually interact with it. With that in mind, I built a little CodePen

    sketch (or “pen” as they’re called) demonstrating the effect of

    adjusting the main `viewBox` values, so

    you can see how they can be used together to scale and crop the content

    visible within the SVG `viewport`. You can

    find the pen at [`davidmatthew.ie/generative-art-javascript-svg#viewBox`](https://davidmatthew.ie/generative-art-javascript-svg#viewBox)

    At this point, we have the values we need for our `viewBox` and `viewport`, but
    we

    haven’t yet learned how to put them to use.


    Setting and Getting Values

    Every `SvJs`

    instance, whether it’s the parent SVG or one of its child elements, has

    a `set()` method. This method allows us

    to set the values of an element’s attributes.

    How do we know what attributes an element has? Well, we’d consult

    (i.e., google) some official documentation. The source I’d recommend is

    the Mozilla Developer Network’s SVG element reference, available at

    [`developer.mozilla.org/en-US/docs/Web/SVG/Element`](https://developer.mozilla.org/en-US/docs/Web/SVG/Element).

    Use it for reminders or for when you do your own independent

    explorations. And while we’re at it, the full documentation for the

    `SvJs` library is

    available at [`npmjs.com/package/svjs`](https://npmjs.com/package/svjs)

    (or at the related GitHub repository); if you’d prefer, have that to

    hand for a more structured definition of each method.


    Getting back to setting values, the `set()` method accepts

    an object as its argument and takes the following format:


    ```

    svg.set({ attribute1: value1, attribute2: value2, attributeN: valueN )};

    ```


    If you’re setting a large number of properties at once, you might

    consider adjusting the formatting for the sake of readability.


    ```

    svg.set({

    attribute1: value1,

    attribute2: value2,

    ...

    attributeN: valueN

    )};

    ```


    It’s up to you however; either way works.


    The attributes of note for our parent SVG are the `width` and `height` (which

    constitute the `viewport`) and the

    `viewBox`. We can

    now add the following code to our template to set these attributes:


    ```

    svg.set({ width: svgSize, height: svgSize, viewBox: ''0 0 1000 1000'' });

    ```'
