    \ = Number(frame.get('x'));\nlet upperBound = lowerBound + frameSize;\n// The\
    \ animation loop.\nfunction animate() {\n// Check collisions for each circle.\n\
    circles.forEach((circle) => {\n// Retrieve the position and velocity.\nlet cx\
    \ = Number(circle.get('cx'));\nlet cy = Number(circle.get('cy'));\nlet vx = Number(circle.get('vx'));\n\
    let vy = Number(circle.get('vy'));\n// Check for collisions, and if found reverse\
    \ the polarity.\nif (cx = upperBound) vx = -vx;\nif (cy = upperBound) vy = -vy;\n\
    // Update the position.\ncx += vx;    cy += vy;\n// Set the new values.\ncircle.set({\
    \ cx: cx, cy: cy, vx: vx, vy: vy });\n});\n// The recursive bit.\nrequestAnimationFrame(animate);\n\
    }\n// Call the animation.\nanimate();\n```\n\nIf you watch the animation at this\
    \ point, you’ll notice that the\ncircles do indeed rebound within the vicinity\
