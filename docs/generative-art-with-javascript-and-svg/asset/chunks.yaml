    \nAn abstract presents a square-shaped structure, which has a circle with six\
    \ radians. One radian is equivalent to the length of a circle’s radius wrapped\
    \ around the circumference, with values of 3.14 and 6.28.\n\n**Figure 7-5** How\
    \ radians relate to \U0001D745 and the circumference\n\nThe takeaway? `Math.PI`\
