    Arrow Functions


    So far we’ve covered functions declared with the `function` keyword, but

    there is another, more modern way of writing functions. These

    functions are called arrow functions due to the arrow syntax they

    employ.


    ```

    // Basic syntax of an arrow function.

    const peformSomeTask = () => {

    // ... code defining the task.

    }

    ```


    They are concise alternatives to the traditional function expressions

    we’ve just covered. Let’s rewrite the `sum()` function as an

    example.


    ```

    const sum = (a, b) => {

    return a + b;

    }

    ```


    A little shorter, as you can see. But it can get even more concise than

    this if our function only consists of a single statement that returns a

    value (which exactly describes our `sum()` function). In

    such a case, we don’t need the curly braces or even the `return` statement

    itself.


    ```

    const sum = (a, b) => a + b;

    ```


    Because the arrow function body consists of just a single statement (

    `a + b` ), it is

    assumed we want the value of this statement returned. This is what’s

    called an implicit return.

    Now, not all arrow functions can be so neatly condensed, just those

    that have a single return statement. But such

    one-liners are liberally used throughout most modern JavaScript code

    bases, particularly those that use declarative front-end frameworks like

    React, so it’s worth familiarizing yourself with them.

    There is another reason to use arrow functions that stretches a

    little beyond the scope of this chapter, and it’s `this`. What I mean is

    the `this`

    keyword, which is a complicated topic in JavaScript (and complicated to

    explain without getting tangled in reflexive language). Suffice to say,

    the value of `this` is more

    predictable and less prone to bugs when used in arrow functions. But

    don’t worry about `this` for now.

    Instead, let’s concern ourselves with some data structures that will

    serve us well in generative art and in JavaScript more generally. This

    is the subject of our next section.


    Objects and Arrays

    Variables are great when you need to define values like numbers,

    strings, and booleans, but what if you need a more sophisticated way to

    represent and organize your data? Say you have a long list of things

    `–` be they this

    week’s groceries, the employees in your company, the locations you want

    to visit before you kick the proverbial bucket, or, to bring it back to

    generative art, the hexadecimal codes of the 216 web-safe colors you’d

    like to sample for your next retro-inspired masterpiece (in the 1990s,

    web developers `–` or web masters as

    they were then known `–` had a much more

    restricted color palette).

    When you have lists of anything, arrays are your friend.


    Arrays

    An array is essentially a variable that can contain multiple values.

    And in JavaScript, these values needn’t be of a uniform type. This means

    we can mix numbers, strings, and booleans

    into a single array if required (though it’s not necessarily recommended

    you do this).


    Arrays take the following format:


    ```

    // The syntax of a standard array.

    let arrayName = [item1, item2, item3, ... itemN];

    ```


    Each array item has a corresponding index, or number, that represents

    its position in the array. The first item in an array has an index of

    `0` (counting

    from zero in computing is the norm), the second item has an index of

    `1`, the third of

    `2`, etc. To

    directly access an item in array by its index, you use square bracket

    notation like so:


    ```

    // Access the first item.

    let firstItem = arrayName[0];

    // Access the second item.

    let secondItem = arrayName[1];

    // Access the nth item.

    let nthItem = arrayName[n + 1];

    ```


    This lends itself particularly well to loops. Iterating over items in

    an array with a for loop is a very common practice, and it’s something

    we’ll lean on heavily throughout our generative art journey.

    Let’s continue with our web-safe colors example and iterate over an

    array containing these 216 hexadecimal values.'
  trans: "```javascript\n// 下面这样写是不允许的。\nfunction(a, b) {\nreturn a + b;\n}\n-> Uncaught\
    \ SyntaxError: Function statements require a function name\n```\n\n## 箭头函数\n\n\
    到目前为止，我们介绍了用 `function` 关键字声明的函数，但还有一种更现代的函数书写方式。这类函数因其采用的箭头语法而被称为**箭头函数**。\n\n\
    ```javascript\n// 箭头函数的基本语法。\nconst performSomeTask = () => {\n  // ... 定义任务的代码。\n\
    }\n```\n\n它们是刚刚介绍的传统函数表达式的简洁替代方案。我们来重写 `sum()` 函数作为示例。\n\n```javascript\nconst\
    \ sum = (a, b) => {\n  return a + b;\n}\n```\n\n如你所见，代码简短了一些。但如果我们的函数只包含一个返回值的语句（这正是我们的\
    \ `sum()` 函数的情况），它甚至可以变得更简洁。在这种情况下，我们不需要花括号，甚至不需要 `return` 语句本身。\n\n```javascript\n\
    const sum = (a, b) => a + b;\n```\n\n由于箭头函数体仅包含单个语句（`a + b`），因此系统会默认我们希望返回该语句的值。这就是所谓的**隐式返回**。\n\
    \n当然，并非所有箭头函数都能如此简洁地精简，只有那些包含单一返回语句的才行。但这种单行写法在现代 JavaScript 代码库中广泛使用，尤其是使用像 React\
    \ 这样声明式前端框架的代码库，因此熟悉它们非常值得。\n\n使用箭头函数还有另一个原因，这稍微超出了本章的范围，那就是 `this`。我指的是 `this`\
    \ 关键字，这在 JavaScript 中是一个复杂的话题（并且在不陷入指代混乱的情况下解释清楚也很复杂）。简而言之，在箭头函数中使用 `this`，其值更可预测，也更不容易引发错误。但现在先别担心\
    \ `this`。\n\n相反，让我们关注一些数据结构，它们在生成式艺术以及更广泛的 JavaScript 应用中会很有帮助。这是我们下一节的内容。\n\n\
    ## 对象与数组\n\n当需要定义数值、字符串和布尔值等值时，变量非常有用，但如果你需要更复杂的方式来组织和表示数据该怎么办呢？比如，你有一长串列表——无论是本周的购物清单、公司的员工名单、你希望在辞世前游历的地点，或者回到生成式艺术的话题上，你打算为下一部怀旧风格杰作采样的\
    \ 216 种网络安全色的十六进制代码（在 1990 年代，当时的网页开发者——那时被称为网页管理员——可用的调色板要受限得多）。当你需要处理任何形式的列表时，数组就是你的好帮手。\n\
    \n### 数组\n\n数组本质上是一个可以容纳多个值的变量。在 JavaScript 中，这些值不必是同一类型。这意味着如果需要，我们可以将数值、字符串和布尔值混合放入同一个数组中（不过并不推荐这样做）。\n\
    \n数组采用以下格式：\n\n```javascript\n// 标准数组的语法。\nlet arrayName = [item1, item2, item3,\
    \ ... itemN];\n```\n\n每个数组元素都有一个对应的**索引**（即数字），代表其在数组中的位置。数组中第一个元素的索引为 `0`（计算机中从零开始计数是常态），第二个元素索引为\
    \ `1`，第三个为 `2`，以此类推。要按索引直接访问数组中的元素，需要使用方括号，如下所示：\n\n```javascript\n// 访问第一个元素。\n\
    let firstItem = arrayName[0];\n// 访问第二个元素。\nlet secondItem = arrayName[1];\n//\
    \ 访问第 n 个元素。\nlet nthItem = arrayName[n + 1];\n```\n\n这种方式特别适合与循环配合使用。使用 for 循环遍历数组中的元素是一种非常常见的做法，并且在我们整个生成式艺术之旅中会频繁用到。\n\
    \n让我们继续以网络安全色为例，遍历包含这 216 个十六进制值的数组。"
- fmt: '您不需要担心如何将这些项目放入数组；我们感兴趣的是如何遍历它们并对数组中的每个项目执行某些操作。此处的操作是在每次迭代中设置新创建圆形的颜色（即`fill`）。为了确保执行216次，我们使用数组的`length`属性来控制循环运行的次数。


    ```

    for (let i = 0; i < webSafeColours.length; i += 1) {

    // ... some code.

    circle.fill(webSafeColours[i]);

    // ... more code.

    }

    ```


    在图[2-1](#538894_1_En_2_Chapter.xhtml#Fig1)中，您将看到此代码片段的输出。显然，实现这种螺旋排列涉及更多内容（我们将在后面的章节中介绍）；重点是，我们如何使用迭代变量`i`循环遍历每个颜色值，即`webSafeColours[i]`。


    ![](images/538894_1_En_2_Chapter/538894_1_En_2_Fig1_HTML.png)


    一张抽象图显示了在深色背景上以螺旋模式排列的各种阴影数据点。


    **图 2-1** 网络安全色螺旋


    如果您勇敢地检查示例背后的代码，您会注意到我最初使用了一个名为`push()`的数组方法将每个颜色添加到数组中。相关的代码行是：


    ```

    colours.push(colour);

    ```


    `push()`方法是我们将项目添加到数组末尾的方式（可以想象从后面装卡车）。如果我们想将项目添加到数组的开头，我们使用一个名为`unshift()`的方法。


    ```

    colours.unshift(colour);

    ```


    如果我们想从数组末尾移除一个项目，我们使用`pop()`方法（想象一下爆米花从锅中爆出）。相反，如果我们想从数组开头移除一个项目，我们使用`shift()`方法（之所以这样命名，是因为我们将所有剩余项目向下移动一个索引）。


    在继续之前，我想介绍另一个方法，即我之前提到的`forEach()`循环。此方法是数组特有的，它依次对数组中的每个项目执行操作，使用一个函数作为其参数。顺便提一下，以这种方式作为参数传递的函数被称为回调函数。


    ```

    // Set up an sample array.

    const someNumbers = [2, 4, 6, 8, 10];

    // Call the forEach method on each array item.

    someNumbers.forEach((item) => {

    console.log(item * 2);

    });

    -> 4 8 12 16 20

    ```


    如果循环的主要目的是专门为每个数组项目执行某些操作，那么`forEach()`循环是一种非常简洁的遍历数组的方式。


    ## 对象


    对象是JavaScript提供的另一种数据结构，和函数一样，它们是该语言的基础特性。深入观察，您会发现对象无处不在。事实上，函数是一种特殊的对象。


    与数组类似，对象可以包含多个值。主要区别在于，对象用名称标记其值，而数组用数字（即每个项目的索引）标记其值。


    对象的格式如下：


    ```

    const objectName = {

    name1: value1,

    name2: value2,

    name3: value3

    };

    ```


    这些名称-值对就是对象的**属性**。这些值可以是任何你想要的东西：字符串、布尔值、函数、数组，甚至其他对象。几乎所有能想到的东西都可以表示为一个对象。以我的笔记本电脑为例。


    ```

    const myLaptop = {

    processor: "Core i5",

    screenSize: "14 inches",

    inSleepMode: false,

    powerUp: function() {

    if (inSleepMode) {

    wakeUp();

    } else {

    runBIOS();

    }

    }

    // etc

    }

    ```


    有了这些属性，我们可以使用方括号表示法或`–`更常见的`–`点号表示法来调用它们。


    ```

    // Accessing an object property with dot notation.

    myComputer.screenSize;

    -> "14 inches"

    // Accessing via bracket notation.

    myComputer[processor];

    -> "Core i5"

    ```


    我们也可以通过相同的语法更新和创建新的对象属性。


    ```

    // Updating an object''s property.

    myComputer.inSleepMode = true;

    // Creating a new object property.

    myComputer.storage = "512 GB SSD";

    ```'
  raw: 'You don’t need to worry about how we get these items into the array for

    now; all we’re interested in is how we’d loop through them and take some

    action for each item in the array. The action in this case will be to

    set the color (i.e., `fill` ) of a newly

    created circle on

    each iteration. And to make sure we do this 216 times, we use the `length` property
    of

    the array to control how many times we run our loop.


    ```

    for (let i = 0; i < webSafeColours.length; i += 1) {

    // ... some code.

    circle.fill(webSafeColours[i]);

    // ... more code.

    }

    ```


    In Figure [2-1](#538894_1_En_2_Chapter.xhtml#Fig1), you’ll see the

    output of this code snippet. Obviously there’s more involved in

    achieving this spiral arrangement (something we’ll cover in a later

    chapter); the main point is how we use the iterator variable `i` to cycle through

    each color value, that is, `webSafeColours[i]`.


    ![](images/538894_1_En_2_Chapter/538894_1_En_2_Fig1_HTML.png)


    An abstract presents a cluster of various shaded data points in a

    spiral pattern, against a dark background.


    Figure 2-1

    A web-safe color spiral


    If you’re brave enough to inspect the code behind the example, you’ll

    notice that to add each color to the array initially, I used an array

    method called `push()`. The relevant

    line is


    ```

    colours.push(colour);

    ```


    The `push()`

    method is how we add an item to the end of an array (think of loading a

    truck from the back). If instead we

    wanted to add the item to the beginning of the array, we’d use a method

    called `unshift()`.


    ```

    colours.unshift(colour);

    ```


    If we wanted to remove an item from the end of the array, we’d use

    the `pop()`

    method (think popcorn popping out of a pot). Conversely, if we wanted to

    remove an item from the beginning of the array, we’d use the `shift()` method

    (so-called because we’re shifting all remaining items to a lower

    index).


    There’s one other method I want to cover before moving on, namely, the

    `forEach()` loop

    I mentioned earlier. This method is unique to arrays and acts on each

    item of the array in turn, using a function as its argument. As an

    aside, functions that are passed as arguments in this manner are known

    as callback

    functions.


    ```

    // Set up an sample array.

    const someNumbers = [2, 4, 6, 8, 10];

    // Call the forEach method on each array item.

    someNumbers.forEach((item) => {

    console.log(item * 2);

    });

    -> 4 8 12 16 20

    ```


    The `forEach()` loop can be

    a nice succinct way of iterating over an array if the main purpose of

    the loop is to perform some action specifically for each array item.


    Objects

    Objects are

    another data structure JavaScript offers, and like functions, they are a

    foundational feature of the language. Take a peek under the hood and

    you’ll find objects everywhere. Functions are, in fact, special kinds of

    objects.

    Like arrays, objects can contain multiple values. The primary

    difference is that objects label their values with names, whereas arrays

    label their values with numbers (i.e., the index of each item).


    An object takes the following format:


    ```

    const objectName = {

    name1: value1,

    name2: value2,

    name3: value3

    };

    ```


    These name-value pairs are the object’s **properties**. The

    values can be anything you want: strings, booleans, functions, arrays,

    or even other objects. Almost anything you can think of can be

    represented as an object. Let’s take my laptop as an example.


    ```

    const myLaptop = {

    processor: "Core i5",

    screenSize: "14 inches",

    inSleepMode: false,

    powerUp: function() {

    if (inSleepMode) {

    wakeUp();

    } else {

    runBIOS();

    }

    }

    // etc

    }

    ```


    With these properties in place, we can call them

    with either bracket notation, or `–` more commonly `–` dot notation.


    ```

    // Accessing an object property with dot notation.

    myComputer.screenSize;

    -> "14 inches"

    // Accessing via bracket notation.

    myComputer[processor];

    -> "Core i5"

    ```


    We can also update and create new object properties via the same syntax.


    ```

    // Updating an object''s property.

    myComputer.inSleepMode = true;

    // Creating a new object property.

    myComputer.storage = "512 GB SSD";

    ```'
