    \ `clipPath` *应用*到任何东西上，所以如果我们现在运行草图，只会看到一堆相当杂乱的圆重叠在一起。我们将通过将 `clipPath` 应用于圆组（而不是圆本身）来解决这个问题。作为循环内的最后一步，我们将创建一个方形边框来框住每个单元格，只是为了给图形增加一点轮廓感。\n\
    \n```\n// 将裁剪路径应用于圆组。\ncircles.set({\nclip_path: `url(#${clip.get('id')})`\n});\n\
    // 创建一个方形来框住单元格。\ngrid.create('rect').set({\nx: x, y: y, width: cellSize, height:\
    \ cellSize,\nfill: 'none', stroke: '#eee',\n});\n```\n\n现在，在循环之外，像我们之前所做的那样将网格居中。\n\
    \n```\n// 将网格在 viewBox 内居中。\ngrid.moveTo(500, 500);\n```\n\n瞧！你现在应该会看到一些类似于图 4-8\
    \ 中的变体。（顺便说一句，如果你发现网格没有始终正确居中，那是因为网格的边界框包含了不可见的裁剪内容，而这些内容并不总是围绕网格对称排列。）\n\n![](img/538894_1_En_4_Fig8_HTML.png)\n\
    \n一幅抽象图展示了三个网格状图案。每个网格有一簇方块，其中包含在不同位置的裁剪后的同心圆，背景为深色。\n\n**图 4-8** 色彩丰富的裁剪路径网格图案\n\
    \n## 选择与机会\n\n如果我们在选择是否填充网格中的某个单元格时引入一个机会元素，会怎么样呢？这可以产生一种看起来不那么死板的构图——这不一定是更好的，但它可以在多样性方面提供更多可能。\n\
    \n### SvJs 的 `Gen.chance()` 函数\n\n当我们谈论概率时，通常试图确定的是某事发生的可能性或几率。这件事要么发生要么不发生，所以我们想要的是一个二元响应——或布尔值——来告诉我们“是”或“否”，“赢”或“输”。今天你的马“维克托·矢量”会在比赛中让你赢钱吗？鉴于赔率是\
    \ 7 比 2，获胜的几率是 22%（2 / (7 + 2) × 100 = 22.22）。\n\n我们如何将这种逻辑应用到构图中呢？使用纯 JavaScript\
    \ 和 `Math.random()` 其实相当简单，但 SvJs 通过其 `Gen.chance()` 函数提供了一种更直观、更简洁的替代方案。\n\n\
    默认情况下（即，不带任何参数），`Gen.chance()` 基于 50/50 或 50% 的概率返回 `true` 或 `false`。如果我们提供一个参数，它将被解释为一个百分比。\n\
    \n```\n// 以下代码有 60% 的概率返回 true。\nGen.chance(60);\n```\n\n如果提供两个数字，则参数被解释为赔率。如果你更倾向于像在博彩公司下注那样思考概率，而不是计算精确的百分比值（这在底层实际上已为你计算好），这会很有用。\n\
    \n```\n// 有 7 比 2 的概率返回 true。\nGen.chance(7, 2);\n```\n\n### 实际应用中的机会\n\n让我们创建一个新草图，使用\
    \ `Gen.chance()` 来决定网格内的单元格是否被填充内容。复制 `08-colourful-grids` 文件夹并将其重命名为 `09-chance`，然后删除内层循环中的所有内容（留给你一个空的嵌套\
    \ `for` 循环）。接下来，将 `palettes` 数组和 `pickedPalette` 变量替换为一个随机生成的 `hue`（色相）。\n\n```\n\
    // 选择一个随机色相。\nlet hue = Gen.random(0, 360);\n```\n\n你可以保持与网格相关的变量不变，或者根据自己的喜好调整它们。接下来，*在*\
    \ `x` 和 `y` 循环*之间*（即在第一个循环内，但在第二个循环之前），像这样增加 `hue`：\n\n```\n// 一个创建网格的嵌套循环。\n\
    for (let y = 0; y < gridSize; y += increment) {\n    // 更新色相，使其不会超出 [0, 360] 的范围。\n\
    \    hue = (hue >= 360) ? (hue - 360) + (120 / rows) : hue + (120 / rows);\n \
    \   for (let x = 0; x < gridSize; x += increment) {\n    ...\n```\n\n这看起来可能是一种过于复杂的增加\
    \ `hue` 值的方法，但实际上它只做了两件事：首先，确保 `hue` 值不会超出边界（即超过 `360`）；其次，根据行数相对增加 `hue` 值。这样做的目的是，行数较少的草图变体具有较高的增量值，而行数较多的变体具有较低的增量值，从而使整体色彩更加一致。\n\
    \n在 `x` 循环内部，我们将实际使用 `Gen.chance()`。将其用作 `if` 语句中的一个条件，我们可以根据它返回的结果有条件地触发第三个循环。这个循环会在每个单元格内创建随机的\
    \ `line` 元素，但仅当该单元格被 `Gen.chance()` 函数激活时才创建。我们将实际概率设置为 60%。\n\n```\n// 基于概率运行循环。\n\
    if (Gen.chance(60)) {\n    for (let i = 0; i < cellSize; i += 1) {\n        grid.create('line').set({\n\
    \            x1: Gen.random(x, x + cellSize),\n            y1: Gen.random(y, y\
    \ + cellSize),\n            x2: Gen.random(x, x + cellSize),\n            y2:\
    \ Gen.random(y, y + cellSize),\n            stroke: `hsl(${hue} 80% 80% / 0.33)`\n\
    \        });\n    }\n}\n```\n\n这应该会产生渐变的俄罗斯方块式排列，类似于图 4-9。\n\n![](img/538894_1_En_4_Fig9_HTML.png)\n\
    \n一幅抽象图展示了渐变的俄罗斯方块式排列，背景为深色。\n\n**图 4-9** 实际应用中的 `Gen.chance()`\n\n## 概率分布\n\n\
    概率分布描述了数字在给定范围内如何分布（或散布）。除非你以某种形式学习过统计学，否则你可能对这个术语不太熟悉。如果仅仅提到统计就让你冷汗直流，别担心——我们不会深入探讨底层数学。实际上我们已经在使用一种特定的概率分布，只是没有给它命名而已。\n\
    \n### 均匀分布\n\n`Gen.random()` 函数是*均匀*分布的一个例子，其中范围内的每个数字被选中的机会均等。换句话说，`Gen.random()`\
    \ 函数（或者其基础的 `Math.random()`）中不存在任何隐藏的偏差或趋势，会使范围内的某个特定数字子集更有可能被选中。\n\n在图 4-10 中，我们可以看到均匀分布表现为\
    \ 1000 条垂直线的 `x` 坐标变化。这些线分散在各处，出现在 x 轴上任何位置的机会均等。\n\n![](img/538894_1_En_4_Fig10_HTML.png)\n\
    \n一幅抽象图展示了一个矩形结构，其中有多条不同尺寸的明亮线条呈线性排列，背景为深色。\n\n**图 4-10** 垂直线的均匀分布\n\n### 高斯分布\n\
    \n在现实生活的测量中（即那些在二进制 0 和 1 世界之外的测量），均匀分布实际上并不常见。更常见的是所谓的*高斯*分布，其中大多数值聚集在一个中点附近，并在该点两侧逐渐减少。它也被称为正态分布，当绘制成图表时，会形成一条钟形曲线。可视化为一系列垂直线时，它看起来像图\
    \ 4-11。\n\n![](img/538894_1_En_4_Fig11_HTML.png)\n\n一幅抽象图展示了一个矩形结构，其中有多条不同粗细的高亮线条呈线性排列，背景为深色。\n\
    \n**图 4-11** 垂直线的正态分布\n\n大多数值聚集的中点被称为均值，而它们偏离该均值的程度被称为西格玛（sigma）或标准差。\n\n```"
- fmt: "`SvJs`带有一个名为`Gen.gaussian()`的函数，该函数返回一个符合高斯分布的随机数。在没有参数的情况下，它将返回大约介于 -3 和\
    \ +3 之间的值，均值为 0，标准差为 1。这在实际应用中意味着：\n\n- 68% 的值将落在 -1 和 1 之间（标准差范围内）\n- 95% 的值将落在\
    \ -2 和 2 之间\n- 99% 的值将落在 -3 和 3 之间\n\n通过向`Gen.gaussian()`提供参数，我们可以修改均值和标准差。\n\n\
    ```javascript\n// 将均值和标准差分别调整为10和2。\nGen.gaussian(10, 2);\n```\n\n在前面的例子中，将均值调整为\
    \ 10，标准差调整为 2，这意味着 68% 的值将落在均值两侧的 -2 到 +2 范围内（即 8 到 12 之间），95% 的值落在 6 到 14 之间，超过\
    \ 99% 的值落在 4 到 16 之间。严格来说，高斯分布的值是无界的，因此偶尔可能会出现极端异常值。例如，如果您希望将结果限制在标准差三倍范围内，则可以使用`Gen.constrain()`函数来约束结果，如下所示：\n\
    \n```javascript\n// 将Gen.gaussian()的结果限制在 -3 到 +3 之间。\nlet gaussian = Gen.gaussian(0,\
    \ 1);\nlet constrainedGaussian = Gen.constrain(gaussian, -3, 3);\n```\n\n接下来，让我们快速创建一个草图，演示如何使用`Gen.gaussian()`返回的结果将`x`和`y`坐标映射到我们的`viewBox`上。复制我们的模板并将其命名为`10-gaussian-dist`。像往常一样，在背景下方，初始化一个循环，该循环将运行\
    \ 10,000 次（是的，很多！），并在其内部生成一对高斯坐标。\n\n```javascript\n// 运行一个循环10000次。\nfor (let\
    \ i = 0; i < 10000; i += 1) {\n    // 生成具有高斯分布的x和y坐标。\n    let gaussianX = Gen.gaussian(500,\
    \ 150);\n    let gaussianY = Gen.gaussian(500, 150);\n}\n```\n\n这些坐标围绕`viewBox`的中心（即\
    \ 500）分布，标准差为 150。接下来，仍然在循环内，创建我们的线条，将它们基于高斯坐标，并为其端点添加一些随机化。\n\n```javascript\n\
    // 基于高斯坐标创建线条。\nsvg.create('line').set({\n    x1: gaussianX,\n    y1: gaussianY,\n\
    \    x2: gaussianX + Gen.random(-10, 10),\n    y2: gaussianY + Gen.random(-10,\
    \ 10),\n    stroke: `hsl(${Gen.random(150, 270)} 80% 80% / 0.8)`\n});\n```\n\n\
    您可以在此处停止，观察生成的圆形图案，但我添加了另一个小循环（在第一个循环之后，而不是在其内部），通过一系列渐隐的圆形描边来微妙地强调分布的形状。\n\n\
    ```javascript\n// 创建一系列圆形来框定分布。\nfor (let i = 0; i < 10; i += 1) {\n    svg.create('circle').set({\n\
    \        cx: 500, cy: 500, r: 25 + (i * 25), fill: 'none',\n        stroke: `hsl(0\
    \ 0% 0% / ${0.25 - (i / 50)})`, stroke_width: 15\n    });\n}\n```\n\n之后，您应该会得到类似于图\
    \ [4-12](#538894_1_En_4_Chapter.xhtml#Fig12) 的结果。\n\n![一个抽象画面，中心呈现一簇高亮的小线条，背景为深色。](images/538894_1_En_4_Chapter/538894_1_En_4_Fig12_HTML.png)\n\
    \n**图 4-12**  \n使用`Gen.gaussian`定位 10,000 条线条\n\n就生成的标记而言，与我们之前所做的任何事情相比，这是一个相当沉重的部分（10,000\
    \ 个元素会做到这一点）。这可能会对渲染性能产生负面影响，并且如果您从 HTML 中复制它，也会意味着一个更大的 SVG 文件。一个简单的减小尺寸的方法是，在每次调用`Gen.gaussian()`函数时将第三个参数设置为`false`。与`Gen.random()`一样，`Gen.gaussian()`接受第三个参数，该参数决定它是返回浮点数（更精确但有很多位）还是整数（整数）。在这种情况下，使用整数处理可以将生成的标记量减少大约一半。\n\
    \n## 帕累托分布\n\n帕累托分布，也称为帕累托原则或 80-20 规则（如图 [4-13](#538894_1_En_4_Chapter.xhtml#Fig13)\
    \ 所示），是我们将介绍的最后一个概率模式。它以一位意大利经济学家的名字命名，他有一个著名的观察：社会 20% 的人口控制着 80% 的财富。这发生在 19\
    \ 世纪 90 年代，所以如果帕累托在今天做出同样的观察，我们可能正在讨论 99-1 规则！尽管如此，其基本思想保持不变：少数拥有多数，多数拥有少数。\n\n\
    ![一个抽象画面，呈现一个矩形结构，其中包含随机排列的不同粗细的高亮线条，背景为深色。](images/538894_1_En_4_Chapter/538894_1_En_4_Fig13_HTML.png)\n\
    \n**图 4-13**  \n垂直线的帕累托分布\n\n这在生成艺术中可用于实现不同大小元素之间的平衡。我们将在下一个草图中使用它来创建一个名为“波尔图·帕累托”的伪城市天际线，其中城市建筑的大小将使用\
    \ SvJs 的`Gen.pareto()`函数进行变化。此函数接受两个参数；第一个参数定义要返回的范围内的最小值，第二个参数定义此数字是浮点数还是整数。\n\
    \n```javascript\n// 返回一个帕累托分布的整数，不小于20。\nGen.pareto(20, false);\n// -> 32\n```\n\
    \n复制模板文件夹并将其命名为`11-porto-pareto`，然后在背景下方创建一个包含我们城市天际线的组。\n\n```javascript\n//\
    \ 为我们的生成城市创建一个组。\nlet portoPareto = svg.create('g');\n```\n\n城市天际线将包含三个主要元素：天空、河流（或港口）和建筑物。天空和河流都将是带有渐变的简单`rect`元素；我们将首先创建它们。\n\
    \n```javascript\n// 创建天空渐变。\nsvg.createGradient('sky', 'linear', ['#f58b10', '#d21263',\
    \ '#940c5e', '#25226c'], 90);\n// 创建天空并应用渐变。\nportoPareto.create('rect').set({\n\
    \    x: 150, y: 150, width: 700, height: 400, fill: 'url(#sky)'\n});\n// 创建河流渐变。\n\
    svg.createGradient('river', 'linear', ['#80e5ff10', '#70b566'], 90);\n// 创建河流并应用渐变。\n\
    portoPareto.create('rect').set({\n    x: 150, y: 555, width: 700, height: 295,\
    \ fill: 'url(#river)'\n});\n```\n\n希望上述内容不会让您感到意外。接下来，我们将进行一些帕累托分布并创建我们的建筑物。在下面的循环中，有一行代码我特别想解释一下，就是使用`Gen.constrain()`函数设置高度的部分。没有它，我们的帕累托分布将生成一些高得令人眩晕的建筑物，远远超出画布的限制。然而，单独使用带有固定上限的`Gen.constrain()`会导致最高建筑物出现截断效果，因此为了平衡这一点，我添加了一个`Gen.random()`函数来变化上限。\n\
    \n```javascript\n// 我们生成城市天际线的循环。\nfor (let i = 0; i < 60; i += 1) {\n    // 获取最小高度为20的帕累托分布。\n\
    \    let pareto = Gen.pareto(20);\n    // 约束高度，并稍微随机化上限。\n    let height = Gen.constrain(pareto,\
    \ 20, Gen.random(150, 200));\n    // 创建我们的建筑物。\n    portoPareto.create('line').set({\n\
    \        x1: 150 + (i * 12), y1: 550,\n        x2: 150 + (i * 12), y2: 550 - height,\n\
    \        stroke: '#181818', stroke_width: 8\n    });\n}\n```\n\n我们现在已经有了城市天际线，但尚未完成。它看起来相当扁平，我希望它能被框在一个圆形内，并且颜色看起来像是向外散发。为了实现这一点，我将使用一种叫做`mask`的东西。"
  raw: "SvJs comes with a function called `Gen.gaussian()`\nthat returns a random\
    \ number that adheres to a Gaussian distribution.\nWith no arguments, it will\
    \ return values between approximately -3 and\n+3, with a mean of 0 and a standard\
    \ deviation of 1\\. What this means in\npractice is that\n\n*   68% of values\
    \ will be within -1 and 1 (the standard\n    deviation)\n\n*   95% of values will\
    \ be within -2 and 2\n\n*   99% of values will be within -3 and 3\n\nBy supplying\
    \ arguments to `Gen.gaussian()`, we\ncan modify the mean and standard deviation.\n\
    \n```\n// Adjusting the mean and standard deviation to 10 and 2 respectively.\n\
    Gen.gaussian(10, 2);\n```\n\nIn the preceding example, adjusting the mean to 10\
    \ and standard\ndeviation to 2 would translate to 68% of values falling within\
    \ -2 and +2\nof the mean (so between 8 and 12), 95% falling between 6 and 14,\
    \ and\nmore than 99% falling between 4 and 16\\. Strictly speaking, the values\
    \ of\na Gaussian distribution aren’t bounded, so there may be occasional\nextreme\
    \ outliers. If, for example, you wanted to make sure you kept the\nresults to\
    \ within a factor of 3 either side of the standard deviation,\nyou could use the\
    \ `Gen.constrain()` function to bound the results\nlike so:\n\n```\n// Bounding\
    \ the results of Gen.gaussian() to within -3 and +3.\nlet gaussian = Gen.gaussian(0,\
    \ 1);\nlet constrainedGaussian = Gen.constrain(gaussian, -3, 3);\n```\n\nLet’s\
    \ move on and create a quick sketch to illustrate how we could use\nthe results\
    \ returned from `Gen.gaussian()` to map\n`x` and `y` coordinates across\nour `viewBox`.\n\
    Copy our template and call it something like `10-gaussian-dist`. In\nthe usual\
    \ place below our background, initialize a loop that will run\n10,000 times (yep,\
    \ that’s a lot!), and inside it, generate a couple of\nGaussian coordinates.\n\
    \n```\n// Run a loop 10,000 times.\nfor (let i = 0; i < 10000; i += 1) {\n// Generate\
    \ x and y co-ordinates with a gaussian distribution.\nlet gaussianX = Gen.gaussian(500,\
    \ 150);\nlet gaussianY = Gen.gaussian(500, 150);\n}\n```\n\nThe coordinates are\
    \ based around the center of the `viewBox` (i.e., 500),\nwith a standard deviation\
    \ of 150\\. Next, and still within the loop,\ncreate our lines, basing them on\
    \ our Gaussian coordinates and adding a\nbit of randomization to their endpoints.\n\
    \n```\n// Create the lines based on the gaussian co-ordinates.\nsvg.create('line').set({\n\
    x1: gaussianX,\ny1: gaussianY,\nx2: gaussianX + Gen.random(-10, 10),\ny2: gaussianY\
    \ + Gen.random(-10, 10),\nstroke: `hsl(${Gen.random(150, 270)} 80% 80% / 0.8)`\n\
    });\n```\n\nYou could stop here and see the circular pattern that emerges, but\
    \ I\nadded another little loop (after the first one, not within it) to subtly\n\
    emphasize the shape of the distribution with a series of fading circular\nstrokes.\n\
    \n```\n// Create a series of circles to frame the distribution.\nfor (let i =\
    \ 0; i < 10; i += 1) {\nsvg.create('circle').set({\ncx: 500, cy: 500, r: 25 +\
    \ (i * 25), fill: 'none',\nstroke: `hsl(0 0% 0% / ${0.25 - (i / 50)})`, stroke_width:\
    \ 15\n});\n}\n```\n\nAfter this, you should end up with something similar to Figure\
    \ [4-12](#538894_1_En_4_Chapter.xhtml#Fig12).\n\n![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig12_HTML.png)\n\
    \nAn abstract presents a cluster of highlighted small lines in the\ncenter, against\
    \ a dark background.\n\nFigure 4-12\nUsing Gen.gaussian to position\n10,000 lines\n\
    \nIn terms of the generated markup, it’s quite a heavy piece compared\nto anything\
    \ we’ve done previously (10,000 elements will do that). This\ncan adversely impact\
    \ render performance and also means a bigger SVG file\nif you copy it from the\
    \ HTML. One easy way to get the size down somewhat\nis to set the third argument\
    \ to `false` in each\ninstance of the `Gen.gaussian()`\nfunction. Like `Gen.random()`,\
    \ `Gen.gaussian()`\naccepts a third argument that determines whether it returns\
    \ a float\n(more accurate but with a lot of digits) or an integer (whole number).\n\
    Dealing in whole numbers decreases the generated markup by roughly a\nfactor of\
    \ two in this case.\n\nPareto Distribution\nPareto distribution, also known as\
    \ the Pareto Principle or the 80-20\nrule (illustrated in Figure [4-13](#538894_1_En_4_Chapter.xhtml#Fig13)),\
    \ is the final\nprobability pattern we’ll cover. It is named after an Italian\
    \ economist\nwho famously observed that just 20% of a society’s population controlled\n\
    80% of its wealth. This was the 1890’s mind, so had Pareto made the same\nobservations\
    \ today, we might be discussing the 99-1 rule! Be that as it\nmay, the basic idea\
    \ remains the same: there is a lot with a little and a\nlittle with a lot.\n\n\
    ![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig13_HTML.png)\n\nAn abstract\
    \ presents a rectangle-shaped structure with a random\narrangement of highlighted\
    \ lines in different thicknesses, against a\ndark background.\n\nFigure 4-13\n\
    Pareto distribution of vertical lines\n\nThis can be useful in generative art\
    \ to achieve a balance of differently\nsized elements. We’ll use this in our next\
    \ sketch to create a\npseudo-cityscape called Porto Pareto, where the size of\
    \ the city’s\nbuildings will be varied using the SvJs `Gen.pareto()`\nfunction.\
    \ This function takes two arguments; the first defines the\nminimum number in\
    \ the range to be returned, and the second defines\nwhether this number will be\
    \ a float or integer.\n\n```\n// Return a pareto-distributed integer, not less\
    \ than 20.\nGen.pareto(20, false);\n-> 32\n```\n\nCopy the template folder and\
    \ name it `11-porto-pareto`, and\nbelow the background, create a group that will\
    \ contain our cityscape.\n\n```\n// Create a group for our generative city.\n\
    let portoPareto = svg.create('g');\n```\n\nThe cityscape will have three main\
    \ elements: the sky, the river (or\nport), and the buildings. The sky and river\
    \ will both be simple `rect` elements with\ngradients; we’ll create these first.\n\
    \n```\n// Create the sky gradient.\nsvg.createGradient('sky', 'linear', ['#f58b10',\
    \ '#d21263', '#940c5e', '#25226c'],\n90);\n// Create the sky and apply the gradient.\n\
    portoPareto.create('rect').set({\nx: 150, y: 150, width: 700, height: 400, fill:\
    \ 'url(#sky)'\n});\n// Create the river gradient.\nsvg.createGradient('river',\
    \ 'linear', ['#80e5ff10', '#70b566'], 90);\n// Create the river and apply the\
    \ gradient.\nportoPareto.create('rect').set({\nx: 150, y: 555, width: 700, height:\
    \ 295, fill: 'url(#river)'\n});\n```\n\nHopefully there won’t have been any surprises\
    \ in the aforementioned.\nNext up, we’ll deal out some Pareto distribution and\
    \ create our\nbuildings. In the following loop, there’s one line in particular\
    \ I want\nto unpack, and this is where we set the height using the `Gen.constrain()`\n\
    function. Without it, our Pareto distribution would\ngenerate some dizzyingly\
    \ high buildings that would extend well beyond\nthe canvas limits. However, using\
    \ `Gen.constrain()` alone\nwith a set upper limit leads to a clipped effect on\
    \ the highest\nbuildings, so to even this out, I’ve added in a `Gen.random()`\
    \ function\nto vary the upper limit.\n\n```\n// A loop for our generative cityscape.\n\
    for (let i = 0; i < 60; i += 1) {\n// Get a pareto distribution with a min height\
    \ of 20.\nlet pareto = Gen.pareto(20);\n// Constrain the height, and slightly\
    \ randomise the upper limit.\nlet height = Gen.constrain(pareto, 20, Gen.random(150,\
    \ 200));\n// Create our buildings.\nportoPareto.create('line').set({\nx1: 150\
    \ + (i * 12), y1: 550,\nx2: 150 + (i * 12), y2: 550 - height,\nstroke: '#181818',\
    \ stroke_width: 8\n});\n}\n```\n\nWe now have our cityscape in place, but we’re\
    \ not done yet. It’s\nquite flat-looking, and I’d like it to be framed within\
    \ a circle and for\nthe colors to look like they’re emanating outward. To achieve\
    \ this, I’m\ngoing to use something called a `mask`."
  trans: "\n`SvJs`带有一个名为`Gen.gaussian()`的函数，该函数返回一个符合高斯分布的随机数。在没有参数的情况下，它将返回大约介于 -3\
    \ 和 +3 之间的值，均值为 0，标准差为 1。这在实际应用中意味着：\n\n- 68% 的值将落在 -1 和 1 之间（标准差范围内）\n- 95% 的值将落在\
    \ -2 和 2 之间\n- 99% 的值将落在 -3 和 3 之间\n\n通过向`Gen.gaussian()`提供参数，我们可以修改均值和标准差。\n\n\
    ```javascript\n// 将均值和标准差分别调整为 10 和 2。\nGen.gaussian(10, 2);\n```\n\n在前面的例子中，将均值调整为\
    \ 10，标准差调整为 2，这意味着 68% 的值将落在均值两侧的 -2 到 +2 范围内（即 8 到 12 之间），95% 的值落在 6 到 14 之间，超过\
    \ 99% 的值落在 4 到 16 之间。严格来说，高斯分布的值是无界的，因此偶尔可能会出现极端异常值。例如，如果您希望将结果限制在标准差三倍范围内，则可以使用`Gen.constrain()`函数来约束结果，如下所示：\n\
    \n```javascript\n// 将 Gen.gaussian()的结果限制在 -3 到 +3 之间。\nlet gaussian = Gen.gaussian(0,\
    \ 1);\nlet constrainedGaussian = Gen.constrain(gaussian, -3, 3);\n```\n\n接下来，让我们快速创建一个草图，演示如何使用`Gen.gaussian()`返回的结果将`x`和`y`坐标映射到我们的`viewBox`上。复制我们的模板并将其命名为`10-gaussian-dist`。像往常一样，在背景下方，初始化一个循环，该循环将运行\
    \ 10,000 次（是的，很多！），并在其内部生成一对高斯坐标。\n\n```javascript\n// 运行一个循环 10000 次。\nfor (let\
    \ i = 0; i < 10000; i += 1) {\n    // 生成具有高斯分布的 x 和 y 坐标。\n    let gaussianX =\
    \ Gen.gaussian(500, 150);\n    let gaussianY = Gen.gaussian(500, 150);\n}\n```\n\
    \n这些坐标围绕`viewBox`的中心（即 500）分布，标准差为 150。接下来，仍然在循环内，创建我们的线条，将它们基于高斯坐标，并为其端点添加一些随机化。\n\
    \n```javascript\n// 基于高斯坐标创建线条。\nsvg.create('line').set({\n    x1: gaussianX,\n\
    \    y1: gaussianY,\n    x2: gaussianX + Gen.random(-10, 10),\n    y2: gaussianY\
    \ + Gen.random(-10, 10),\n    stroke: `hsl(${Gen.random(150, 270)} 80% 80% / 0.8)`\n\
    });\n```\n\n您可以在此处停止，观察生成的圆形图案，但我添加了另一个小循环（在第一个循环之后，而不是在其内部），通过一系列渐隐的圆形描边来微妙地强调分布的形状。\n\
    \n```javascript\n// 创建一系列圆形来框定分布。\nfor (let i = 0; i < 10; i += 1) {\n    svg.create('circle').set({\n\
    \        cx: 500, cy: 500, r: 25 + (i * 25), fill: 'none',\n        stroke: `hsl(0\
    \ 0% 0% / ${0.25 - (i / 50)})`, stroke_width: 15\n    });\n}\n```\n\n之后，您应该会得到类似于图\
    \ 4-12 的结果。\n\n![一个抽象画面，中心呈现一簇高亮的小线条，背景为深色。](img/538894_1_En_4_Fig12_HTML.png)\n\
    \n**图 4-12**  \n使用`Gen.gaussian`定位 10,000 条线条\n\n就生成的标记而言，与我们之前所做的任何事情相比，这是一个相当沉重的部分（10,000\
    \ 个元素会做到这一点）。这可能会对渲染性能产生负面影响，并且如果您从 HTML 中复制它，也会意味着一个更大的 SVG 文件。一个简单的减小尺寸的方法是，在每次调用`Gen.gaussian()`函数时将第三个参数设置为`false`。与`Gen.random()`一样，`Gen.gaussian()`接受第三个参数，该参数决定它是返回浮点数（更精确但有很多位）还是整数（整数）。在这种情况下，使用整数处理可以将生成的标记量减少大约一半。\n\
    \n## 帕累托分布\n\n帕累托分布，也称为帕累托原则或 80-20 规则（如图 4-13 所示），是我们将介绍的最后一个概率模式。它以一位意大利经济学家的名字命名，他有一个著名的观察：社会\
    \ 20% 的人口控制着 80% 的财富。这发生在 19 世纪 90 年代，所以如果帕累托在今天做出同样的观察，我们可能正在讨论 99-1 规则！尽管如此，其基本思想保持不变：少数拥有多数，多数拥有少数。\n\
    \n![一个抽象画面，呈现一个矩形结构，其中包含随机排列的不同粗细的高亮线条，背景为深色。](img/538894_1_En_4_Fig13_HTML.png)\n\
    \n**图 4-13**  \n垂直线的帕累托分布\n\n这在生成艺术中可用于实现不同大小元素之间的平衡。我们将在下一个草图中使用它来创建一个名为“波尔图·帕累托”的伪城市天际线，其中城市建筑的大小将使用\
    \ SvJs 的`Gen.pareto()`函数进行变化。此函数接受两个参数；第一个参数定义要返回的范围内的最小值，第二个参数定义此数字是浮点数还是整数。\n\
    \n```javascript\n// 返回一个帕累托分布的整数，不小于 20。\nGen.pareto(20, false);\n// -> 32\n```\n\
    \n复制模板文件夹并将其命名为`11-porto-pareto`，然后在背景下方创建一个包含我们城市天际线的组。\n\n```javascript\n//\
    \ 为我们的生成城市创建一个组。\nlet portoPareto = svg.create('g');\n```\n\n城市天际线将包含三个主要元素：天空、河流（或港口）和建筑物。天空和河流都将是带有渐变的简单`rect`元素；我们将首先创建它们。\n\
    \n```javascript\n// 创建天空渐变。\nsvg.createGradient('sky', 'linear', ['#f58b10', '#d21263',\
    \ '#940c5e', '#25226c'], 90);\n// 创建天空并应用渐变。\nportoPareto.create('rect').set({\n\
    \    x: 150, y: 150, width: 700, height: 400, fill: 'url(#sky)'\n});\n// 创建河流渐变。\n\
    svg.createGradient('river', 'linear', ['#80e5ff10', '#70b566'], 90);\n// 创建河流并应用渐变。\n\
    portoPareto.create('rect').set({\n    x: 150, y: 555, width: 700, height: 295,\
    \ fill: 'url(#river)'\n});\n```\n\n希望上述内容不会让您感到意外。接下来，我们将进行一些帕累托分布并创建我们的建筑物。在下面的循环中，有一行代码我特别想解释一下，就是使用`Gen.constrain()`函数设置高度的部分。没有它，我们的帕累托分布将生成一些高得令人眩晕的建筑物，远远超出画布的限制。然而，单独使用带有固定上限的`Gen.constrain()`会导致最高建筑物出现截断效果，因此为了平衡这一点，我添加了一个`Gen.random()`函数来变化上限。\n\
    \n```javascript\n// 我们生成城市天际线的循环。\nfor (let i = 0; i < 60; i += 1) {\n    // 获取最小高度为\
    \ 20 的帕累托分布。\n    let pareto = Gen.pareto(20);\n    // 约束高度，并稍微随机化上限。\n    let\
    \ height = Gen.constrain(pareto, 20, Gen.random(150, 200));\n    // 创建我们的建筑物。\n\
    \    portoPareto.create('line').set({\n        x1: 150 + (i * 12), y1: 550,\n\
    \        x2: 150 + (i * 12), y2: 550 - height,\n        stroke: '#181818', stroke_width:\
    \ 8\n    });\n}\n```\n\n我们现在已经有了城市天际线，但尚未完成。它看起来相当扁平，我希望它能被框在一个圆形内，并且颜色看起来像是向外散发。为了实现这一点，我将使用一种叫做`mask`的东西。\n"
- fmt: "# Masking Our Content\n\nA `mask` is very similar to a `clipPath`, except\
    \ that it allows for degrees of transparency. A `clipPath` is an all-or-nothing\
    \ affair; you’re either inside or outside the bounds of the shape that defines\
    \ it. With a `mask`, you can fade content in or out depending on the brightness\
    \ or luminance of the shape. For this reason, it’s most straightforward to use\
    \ black and white when creating masks. White (`#ffffff`) translates to a fully\
    \ transparent region, whereas black (`#000000`) translates to a fully opaque region.\n\
    \nIn Figure [4-14](#538894_1_En_4_Chapter.xhtml#Fig14), the triangle is the `mask`\
    \ shape, and the result of applying it to the `rect` is shown on the right.\n\n\
    ![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig14_HTML.png)\n\nAn abstract\
    \ presents a shaded square, which is added to a monochrome triangle to produce\
    \ a triangle in a gradient similar to the shade of the square, against a dark\
    \ background.\n\n**Figure 4-14**  \nHow masks work\n\nAs with a `clipPath`, the\
    \ `mask` element requires an `id` and is applied to another element via a url\
    \ reference to this `id`. What we’re going to do is create a mask with a `circle`\
    \ shape, and the fill of this `circle` will contain a radial gradient. We’ll then\
    \ apply it to the `portoPareto` group we created earlier.\n\n```\n// Create a\
    \ radial gradient.\nsvg.createGradient('radialGrad', 'radial', ['#ffffff', '#ffffff60']);\n\
    // Create a mask, and inside it create the circle with the radial gradient.\n\
    let mask = svg.create('mask').set({ id: 'mask' });\nmask.create('circle').set({\n\
    cx: 500, cy: 500, r: 325, fill: 'url(#radialGrad)',\n});\n// Apply the mask to\
    \ the group.\nportoPareto.set({ mask: 'url(#mask)' });\n```\n\nYou should now\
    \ see the cityscape cut out in the shape of this circle, with the edges slightly\
    \ fading out. As a final step, I’ve added in a gradiented circular stroke to frame\
    \ the content a little more clearly.\n\n```\n// Create a linear gradient for our\
    \ circular frame.\nsvg.createGradient('strokeGrad', 'linear', ['#eeeeee', '#eeeeee15']);\n\
    // Create the frame and apply the gradient.\nsvg.create('circle').set({\ncx: 500,\
    \ cy: 500, r: 345, fill: 'none',\nstroke: 'url(#strokeGrad)', stroke_width: 2.5\n\
    });\n```\n\nA variation of the result is shown in Figure [4-15](#538894_1_En_4_Chapter.xhtml#Fig15).\n\
    \n![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig15_HTML.png)\n\nAn abstract\
    \ presents a highlighted circle with several vertical bars, surrounded by a gradient\
    \ of colors, against a dark background.\n\n**Figure 4-15**  \nOur Porto Pareto\
    \ cityscape\n\n## Summary\n\nIn this chapter, we’ve covered the following:\n\n\
    - Randomizing coordinates, colors, element dimensions, and more\n- How to randomly\
    \ pick items from single and two-dimensional arrays\n- Regular grid construction\
    \ with nested `for` loops\n- How to use `clipPaths` and masks\n- Using chance\
    \ as a way to trigger element creation\n- How to work with Gaussian and Pareto\
    \ probability distributions\n\nIn the next chapter, we’ll learn how to use noise\
    \ to add a more organic kind of randomness to our compositions.\n\n# 5. The Need\
    \ for Noise\n\nIn this chapter, we’ll be covering the limitations of the random\
    \ functions we’ve utilized thus far and how these limitations can be addressed\
    \ by using the SvJs `Noise` module. We’ll be exploring what noise is and the uses\
    \ to which it can be put, and by the end, we’ll have added a significant technique\
    \ to our generative arsenal.\n\n## Random Limits\n\nSometimes randomness is just\
    \ too, well … random. Even when we shape randomized values with probability distributions\
    \ and constrain them within structured patterns, the variance between consecutive\
    \ values invariably has that characteristic “staccato” feel. In other words, the\
    \ values will always be somewhat jumpy and jittery when looked at side by side.\
    \ You won’t see a smooth progression from one value to another.\n\nDon’t get me\
    \ wrong – this is often what we want, and it’s what random functions are designed\
    \ to do. But it can be tricky to create anything that has an organic quality to\
    \ it with randomness alone. For this, we need noise."
