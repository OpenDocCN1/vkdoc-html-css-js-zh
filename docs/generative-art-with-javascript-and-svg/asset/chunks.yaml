    ## 生成式纹理


    前面的例子为我们接下来的尝试打下了基础。模拟纹理固然不错，但在下一个示例中，我们将完全采用生成式方法，也就是放弃部分控制权，享受结果的随机性。在此过程中，我们还将演示点光源镜面光照的用法，以便您了解它与漫射、远距离光照的区别。


    复制模板文件夹并将其命名为 `24-rocky-randomness`。在背景下方，我们将设置源图形，它将是一个简单的圆形。我们将为这个圆形应用渐变和滤镜。


    ```javascript

    // 创建源图形。

    svg.create(''circle'').set({

    r: 300,

    cx: 500,

    cy: 500,

    fill: ''url(#random-gradient)'',

    filter: ''url(#rocky-randomness)''

    });

    ```


    下一步是设置一个线性渐变。为此，我们将使用一个包含三种随机颜色的数组，并且也会随机化渐变的旋转角度。


    ```javascript

    // 随机颜色数组。

    let colours = [

    `hsl(${Gen.random(0, 360)} 80% 80% / 0.75)`,

    `hsl(${Gen.random(0, 360)} 80% 80% / 0.75)`,

    `hsl(${Gen.random(0, 360)} 80% 80% / 0.75)`

    ];

    // 一个具有随机旋转角度和颜色数组的渐变。

    svg.createGradient(''random-gradient'', ''linear'', colours, Gen.random(0, 360));

    ```


    现在来看滤镜。与其他示例一样，我们的第一个节点将是 `feTurbulence` 图元，它将作为我们的主要纹理来源。`numOctaves` 将在 `2`
    到 `7` 之间变化，这允许细节水平有相当大的变化。`baseFrequency` 和 `seed` 我们也将随机化。


    ```javascript

    // 初始化滤镜。

    let filter = svg.createFilter(''rocky-randomness'');

    // 创建主要湍流。

    filter.create(''feTurbulence'').set({

    type: ''turbulence'',

    numOctaves: Gen.random(2, 7),

    baseFrequency: Gen.random(0.003, 0.01, true),

    seed: Gen.random(0, 1000),

    result: ''turbulence''

    });

    ```


    现在画布上覆盖了原始的湍流，虽然每次刷新都会变化，但仍感觉有些过于均匀。我们如何创造出更有机、更少网格感的东西呢？好吧，我们可以用……更多的湍流来扭曲它！


    为此，我们将设置另一个 `feTurbulence` 图元，这次使用 `fractalNoise`（分形噪声）。`baseFrequency` 我们会稍微提高，但
    `numOctaves` 和 `seed` 保持在相似范围内。然后，我们将两者都接入 `feDisplacementMap`，随机化 `scale`（缩放）值（这决定了扭曲的强度），并将
    `R` 和 `G` 分别设置为 x 和 y 通道选择器（纯粹是因为这次我不太喜欢默认的 alpha 输出）。


    ```javascript

    // 设置另一个湍流实例。

    filter.create(''feTurbulence'').set({

    type: ''fractalNoise'',

    numOctaves: Gen.random(3, 7),

    baseFrequency: Gen.random(0.01, 0.07, true),

    seed: Gen.random(0, 1000),

    result: ''noise''

    });

    // 用第二个湍流实例扭曲第一个。

    filter.create(''feDisplacementMap'').set({

    in: ''turbulence'',

    in2: ''noise'',

    scale: Gen.random(25, 40),

    xChannelSelector: ''R'',

    yChannelSelector: ''G'',

    result: ''distortion''

    });

    ```


    现在我们有了看起来更自然的噪点，让我们来启动一些镜面光照，看看这些噪点在光照下是什么样子。我们将在大多数属性上使用 `Gen.random()`，包括点光源的坐标。


    ```javascript

    // 对扭曲后的输出应用镜面点光源。

    filter.create(''feSpecularLighting'').set({

    in: ''distortion'',

    surfaceScale: Gen.random(5, 30),

    specularConstant: Gen.random(2, 6),

    specularExponent: Gen.random(10, 25),

    result: ''lighting''

    }).create(''fePointLight'').set({

    x: Gen.random([-50, 500, 1050]),

    y: Gen.random([-50, 1050]),

    z: Gen.random(50, 250)

    });

    ```


    对于 `x` 和 `y` 坐标，你会注意到我们使用 `Gen.random()` 从一个数组中选取值，而不是从一个范围；如果你检查这些值，你会发现这些组合将光照保持在画布的边缘。这主要是为了防止任何直接照射（想想照片中不受欢迎的相机闪光灯）。如果此时加载草图，你应该会看到一些有趣的生成地形出现。不过我们还没完成。


    在我们将地形和源图形重新组合之前，我们先用一些 `feGaussianBlur`（高斯模糊）来柔化后者的边缘。然后，我们将像之前草图中那样，使用 `feComposite`
    配合 `in` 运算，之后再使用另一个 `feComposite` 图元恢复原始渐变，这次使用 `atop`（在顶部）运算。


    ```javascript

    // 模糊源图形。

    filter.create(''feGaussianBlur'').set({

    in: ''SourceGraphic'',

    stdDeviation: Gen.random(25, 50),

    result: ''blur''

    });

    // 通过模糊后的源图形引入光照纹理。

    filter.create(''feComposite'').set({

    in: ''lighting'',

    in2: ''blur'',

    operator: ''in'',

    result: ''comp1''

    });

    // 恢复原始渐变。

    filter.create(''feComposite'').set({

    in: ''blur'',

    in2: ''comp1'',

    operator: ''atop''

    });

    ```


    现在我们可以看结果了！图 8-14 显示了一个我特别喜欢的渲染结果，但这个草图的变体非常多，所以最好多尝试，直到找到你喜欢的效果。


    ![一张抽象图，显示一个带有岩石状图案的圆形，背景为深色。](img/538894_1_En_8_Fig14_HTML.png)


    **图 8-14** 镜面随机岩石感


    至此，我们对滤镜的初步探索就结束了。正如我之前提到的，在滤镜领域还有更多值得探索的地方，而且有很多图元我由于篇幅限制未能涉及。这绝对值得（并且会有回报）进一步独立探索。


    ## 总结


    让我们快速回顾一下这本倒数第二章所涵盖的内容：


    - 滤镜的构建方式

    - 滤镜区域和 SvJs 的 `createFilter()` 方法

    - 基本图元，如 `feGaussianBlur`、`feFlood` 和 `feDropShadow`

    - 更复杂的图元，如将其他图元联系在一起的 `feComposite` 和 `feBlend`

    - `feTurbulence` 图元的力量及其创造性的可能性

    - 使用 `feDisplacementMap` 扭曲其他图元

    - 光照以及如何使用凹凸贴图模拟三维效果

    - 漫射光和镜面光以及各种光源类型

    - 如何将湍流、位移和光照结合起来模拟和生成纹理


    在下一章中，我们将进行总结，并涉及一些有助于将你的生成艺术提升到新水平的话题。


    ## 9. 生成之道'
- fmt: '# Congratulations for having come this far! We’ve covered a lot, so it’s time
    to take stock, stretch out those mental muscles, and make sure we don’t end this
    book with an injury. We’ll wind down by reviewing each chapter in little chunks,
    and we’ll wrap up by previewing some of the paths you might pursue next in your
    generative journey.


    ## The Journey So Far


    We began with an introduction to SVG and what sets it apart from raster formats
    like PNG and JPG. We then moved on to the SvJs library and learned how to set
    up a local front-end development environment. The first chapter closed with a
    bit of a code dump to serve up some visual inspiration, but it was a little light
    on explanation, so the following two chapters picked up the slack.


    For those new to JavaScript and/or programming in general, Chapter [2](#538894_1_En_2_Chapter.xhtml)
    offered a primer, while Chapter [3](#538894_1_En_3_Chapter.xhtml) delved into
    the core functionality of the SvJs library. We explored how to create basic shapes
    and how to work with text, groups, gradients, and patterns, and we created some
    colorful compositions and optical illusions along the way.


    With the introduction of randomness in Chapter [4](#538894_1_En_4_Chapter.xhtml),
    we were finally able to go full generative and create sketches with results not
    rigidly set in advance. We learned how to randomize numbers within a range, randomly
    select items from an array, and construct regular grids using that staple of generative
    art, the nested for loop. We extended our knowledge of SVG with masks and clip
    paths and played with Gaussian and Pareto probability distributions.


    Noise was introduced in Chapter [5](#538894_1_En_5_Chapter.xhtml) as a way of
    injecting a more organic kind of variation into our sketches, and other useful
    generative functions were covered to help us constrain and map these noise values
    to more useful ranges. In Chapter [6](#538894_1_En_6_Chapter.xhtml), we tapped
    into the power of the path element and its arsenal of commands, and we learned
    how to create lines and curves of the quadratic, cubic Bezier, and elliptical
    arc variety.


    Chapter [7](#538894_1_En_7_Chapter.xhtml) was all about making things move. We
    explored event listeners and user interaction and reviewed no less than four different
    ways of animating SVG. We covered basic collision detection and circular motion,
    before continuing on to filters in Chapter [8](#538894_1_En_8_Chapter.xhtml).
    There we focused on a subset of filter primitives of most immediate use to the
    generative artist, and we learned how to connect these primitives together to
    achieve a variety of different effects.


    ## The Voyage Forward


    So where do you go from here? Have we fully explored the field of generative art,
    mapped all the territory? Not in the slightest! We’ve only really circled the
    tip of the proverbial iceberg, hinting at the hulking structure beneath. So if
    you do want to dive a little deeper yourself, I’ll tentatively suggest some further
    topics (with the caveat that the material we’ve covered so far could be expanded
    upon ad infinitum).


    ### Trigonometry


    I was only able to offer a very cursory treatment of trigonometry in Chapter [7](#538894_1_En_7_Chapter.xhtml),
    so if this was your first time encountering the likes of `Math.PI` and `Math.sin()`,
    don’t expect these concepts to take root (squared or otherwise … apologies, poor
    pun). Trigonometry is a topic that deserves a deep dive of its own, and like much
    of the material in this book, the more exposure and practice you get – or better
    yet, the more you play – the more comfortable you’ll be.


    That said, I do find that interactive visualizations are a great way to kickstart
    comprehension, so to that end, I’ve set up a sketch showing the relationship between
    circular motion and right-angled triangles (the very foundation of trigonometry),
    a freezeframe of which you can see in Figure [9-1](#538894_1_En_9_Chapter.xhtml#Fig1).


    ![](images/538894_1_En_9_Chapter/538894_1_En_9_Fig1_HTML.png)


    An abstract presents a square-shaped structure, which has a highlighted circle
    with a right-angle triangle on the first quadrant, along with the values of degrees,
    sine theta, radians, and cosine theta.


    **Figure 9-1** An interactive trigonometry visualization


    As with the rest of the examples in this chapter, it’s intended to illustrate
    rather than instruct, so the code isn’t included here. You can, however, play
    with this particular example on the book’s dedicated web page and inspect the
    code there if so inclined. I’ve also included further reading and resources that
    should help you delve into the topic, including those I’ve relied upon myself
    over the years. These can be found at `davidmatthew.ie/generative-art-javascript-svg/#trigonometry`.
    If you don’t consider yourself to be of a particularly mathematical mindset, please
    don’t be dissuaded from exploring this fascinating subject. You only need to be
    acquainted with a relatively small subset of it to tap into its creative possibilities,
    and this doesn’t have to involve complicated equations.


    ### Fractals


    Another subject that doesn’t necessitate complicated equations or mind-bending
    mathematical prowess is fractals. Yes, a fractal is a mathematical object, and
    some are enormously complex, but fractals in general are based on simple principles
    of recursion and self-similarity.


    Recursion essentially means self-reference. A recursive function is one that continuously
    calls itself, an example of which we encountered in Chapter [7](#538894_1_En_7_Chapter.xhtml)
    with `requestAnimationFrame()`. Self-similarity, in relation to fractals, means
    that one part will resemble the whole, and vice versa. This is illustrated in
    Figure [9-2](#538894_1_En_9_Chapter.xhtml#Fig2), which shows a famous fractal
    known as the Sierpinski triangle. As you can see, each building block is a reflection
    of the structure taken in its entirety.


    ![](images/538894_1_En_9_Chapter/538894_1_En_9_Fig2_HTML.png)


    An abstract presents a square-shaped structure, which has an equilateral triangle
    with smaller equilateral triangles, against a dark background.


    **Figure 9-2** Self-similarity in the Sierpinski triangle


    Where does recursion come in? Well, it can be found in every fractal, including
    the Sierpinski triangle, but to really illustrate the idea, let’s take another
    well-known specimen, the Von Koch snowflake. The algorithm used to construct this
    fractal could be distilled down to the following (albeit simplified) steps:


    1.  Construct an equilateral triangle.

    2.  Divide each side into three segments.

    3.  Remove the central segment.

    4.  Repeat step 1.


    The fourth step is what makes this algorithm recursive. Figure [9-3](#538894_1_En_9_Chapter.xhtml#Fig3)
    shows what this process would look like after just three further iterations. In
    theory, these steps could continue on indefinitely, producing an ever-more intricate,
    endlessly magnifiable perimeter, which is why fractals are sometimes seen as "windows
    into infinity." In practice, iterations are usually limited in line with screen
    resolution or otherwise capped to prevent our browsers crashing and our processors
    crunching numbers they can no longer handle.


    ![](images/538894_1_En_9_Chapter/538894_1_En_9_Fig3_HTML.png)


    An abstract presents a square-shaped structure, which has an equilateral triangle,
    the sides of the equilateral triangle are divided into three segments, and removing
    the central segment.


    **Figure 9-3** Recursively constructing the Von Koch snowflake


    Fractals open up an entire universe of exploration and inspiration for the generative
    artist, far beyond what I’ve been able to hint at here. If your interest is piqued
    at this point, I’ve pooled together further resources at [`davidmatthew.ie/generative-art-javascript-svg/#fractals`](https://davidmatthew.ie/generative-art-javascript-svg/#fractals)
    that I’d encourage you to explore.'
