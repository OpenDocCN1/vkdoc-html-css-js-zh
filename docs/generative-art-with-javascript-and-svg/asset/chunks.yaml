    to itself.\n\n```\ntypeof NaN;\n-> Number\nNaN === Number;\n-> false\nNaN ===\
    \ NaN\n-> false\n```\n\nSecret Casting\n\nJavaScript does some things behind the\
    \ scenes that programmers from\nstricter languages may not always appreciate.\
    \ It is, for example,\nnotoriously loose with data types and will convert variables\
    \ of\ndifferent types into matching types to suit the situation (the process\n\
