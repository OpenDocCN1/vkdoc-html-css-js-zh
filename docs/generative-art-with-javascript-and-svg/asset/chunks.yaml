    CSS Keyframes

    Animated sequences can be created with CSS using a `@keyframes` rule. Much

    like traditional keyframes used in

    animation, motion graphics, and video editing software, CSS `@keyframes` define
    the

    state of certain properties at a particular point in time (or step in a

    sequence). For example, at time `t`, our subject might

    be at position `[x1, y1]`, and at time `t + 5`, the subject

    might have moved to `[x2, y2]`. Keyframes

    define these points in time, and the transition between one state and

    another is what constitutes the animation. We call this process

    “tweening” (meaning “inbetweening”), as the animation occurs in these

    inbetween states.

    The syntax for CSS `@keyframes` is quite

    self-explanatory. You can set the start and end keyframes of a simple

    animation with `from` and `to` directives, or if

    you have something a little more complex in mind, you can use

    percentages to specify the point at which certain transitions should

    trigger. Once the `@keyframes` rule is

    defined, it then needs to be called by an element using the `animation-name`

    property, and we also need to specify how long the animation should take

    (the `animation-duration`).

    There are other optional properties that we can define, such as the

    `animation-timing-function`

    (also known as easing), which describes *how* we transition from

    one property value to another, and the `animation-iteration-count`,

    which specifies how many times our animation should play.


    In the following code, we’re calling the first shape of our array and

    assigning it an id of `cssShape`. This will

    enable us to easily target the element later. We then set up a `@keyframes` rule

    called `scaleRotate` that

    rotates its target a full 360 degrees, while simultaneously scaling it

    down along its x axis and up along its y axis (creating a stretching

    effect) before returning it to its original dimensions. And finally we

    assign the animation to the `cssShape` element,

    specifying the duration, iteration count, and timing function.'
