- fmt: "### Native SVG\n\nAs SVG is a declarative language like HTML, it’s very human-readable\
    \ and easy to get started with. Just like HTML elements, SVG elements are written\
    \ using opening and closing angle brackets and contain attributes with values.\
    \ Here, for example, is how you’d create a circle:\n\n```\n<circle r=\"10\" cx=\"\
    20\" cy=\"20\" fill=\"red\" />\n```\n\nThe attributes `r`, `cx`, `cy`, and `fill`\
    \ in the preceding example refer to the circle’s radius, the x and y coordinates\
    \ of its center, and the color to fill it with. All are sensibly named and simple\
    \ to follow.\n\nSome SVG elements will contain other elements nested within them,\
    \ referred to as their child nodes or children, and will therefore need opening\
    \ and closing tags. One prominent example is the parent `<svg>` element itself,\
    \ which contains all other SVG elements.\n\nAs an example of how you might handwrite\
    \ an SVG, here is the markup underlying a very simple composition in the style\
    \ of Hilma af Klint, arguably the first abstract artist in Western art history.\n\
    \n```\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\">\n  <circle\
    \ cx=\"25\" cy=\"25\" r=\"20\" fill=\"pink\" />\n  <circle cx=\"75\" cy=\"25\"\
    \ r=\"20\" fill=\"orange\" />\n  <circle cx=\"25\" cy=\"75\" r=\"20\" fill=\"\
    lightblue\" />\n  <circle cx=\"75\" cy=\"75\" r=\"20\" fill=\"lightgreen\" />\n\
    </svg>\n```\n\nA simple Hilma af Klint-inspired knock-off\n\nAs you can see, SVG\
    \ is written in such a way as to preserve the semantics of the code. Search engines\
    \ love this; no longer are they looking at an impenetrable wall of pixels; they\
    \ can clearly see the *intent* within the markup. In this case, four circles displayed\
    \ in the order they’re written, with a title for extra accessibility. Figure [1-1](#538894_1_En_1_Chapter.xhtml#Fig1)\
    \ shows how this markup appears when rendered.\n\n![](images/538894_1_En_1_Chapter/538894_1_En_1_Fig1_HTML.png)\n\
    \nAn abstract presents a dark square-shaped structure with 4 concentric circles,\
    \ in different shades at the center.\n\n**Figure 1-1** – A simple composition\
    \ in the style of Hilma af Klint’s Svanen (The Swan)\n\nDeclarative formats are\
    \ straightforward to read, but their weakness is that they can become tedious\
    \ to write. What if we wanted 100 circles instead of four? With native SVG, we’d\
    \ have to handwrite all of them, one after the other. And if we wanted to display\
    \ our circles at random `cx` and `cy` positions, each with a randomly selected\
    \ `fill`, this isn’t possible at all. Variables, loops, functions, and all the\
    \ fun stuff of imperative programming aren’t available to us. Declarative formats\
    \ are concerned more with the *what* of a program rather than the *how*. The how,\
    \ however, will very much matter to us. Without the how, we wouldn’t have algorithms,\
    \ and algorithms are essential to generative art.\n\nAlgorithms are like recipes;\
    \ they contain the steps you need to follow to achieve a certain result. If you’re\
    \ baking a cake, you don’t just shout “Cake!” and expect one to materialize, no\
    \ matter how specific you get with your declaration (“with strawberry icing and\
    \ a caramel filling!”). This would be the declarative approach, and in practice,\
    \ it sounds more than a little eccentric. To bake a cake, you follow a series\
    \ of well-defined steps or instructions and have your ingredients and your oven\
    \ at the ready. This is akin to the imperative approach in programming; it’s more\
    \ hands-on, and sometimes things get messy. But ultimately it gives you more creative\
    \ control.\n\n### Generating SVG\n\nSo if native SVG doesn’t allow for the use\
    \ of algorithms, how do we write SVG using an imperative approach? The answer\
    \ is we *script* our SVG, and this is where JavaScript and SvJs come into play.\n\
    \nWe could script SVG directly in JavaScript without a library, but that too has\
    \ its challenges, the main one being the verbose boilerplate code we’d have to\
    \ write. The SvJs library saves us that trouble, making SVG more intuitive and\
    \ fun to write. Here’s an example of a simple SVG (Figure [1-2](#538894_1_En_1_Chapter.xhtml#Fig2))\
    \ written using vanilla JavaScript:\n\n```javascript\nconst svg = document.createElementNS('http://www.w3.org/2000/svg',\
    \ 'svg');\nsvg.setAttribute('width', '150px');\nsvg.setAttribute('height', '150px');\n\
    \nconst div = document.getElementById('container');\ndiv.appendChild(svg);\n\n\
    const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');\n\
    rect.setAttribute('x', '0');\nrect.setAttribute('y', '0');\nrect.setAttribute('width',\
    \ '150');\nrect.setAttribute('height', '150');\nrect.setAttribute('fill', 'cornflowerblue');\n\
    svg.appendChild(rect);\n```\n\nAnd the following snippet is the equivalent SVG\
    \ written using SvJs (don’t worry about the details just yet; all you need to\
    \ note is how concise it is vs. vanilla JavaScript). The output of this code you\
    \ can see in Figure [1-2](#538894_1_En_1_Chapter.xhtml#Fig2).\n\n```javascript\n\
    const div = document.getElementById('stage');\nconst svg = new SvJs().set({ width:\
    \ '150px', height: '150px' }).addTo(div);\nsvg.create('rect').set({\n  x: 0, y:\
    \ 0, width: 150, height: 150, fill: 'cornflowerblue'\n});\n```\n\n![](images/538894_1_En_1_Chapter/538894_1_En_1_Fig2_HTML.png)\n\
    \nAn abstract presents a rectangle in a bright shade.\n\n**Figure 1-2** – A cornflower\
    \ blue-colored rectangle, in all its glory\n\nNow you *could* write some functions\
    \ to make writing vanilla JavaScript less painful, but that leads you down the\
    \ road of writing a whole host of other utility functions to make the basics less\
    \ burdensome. With SvJs, I’ve done my best to save you this trouble. It’s essentially\
    \ a very thin wrapper over the real SVG spec with some helpful generative functions\
    \ thrown in. This keeps its footprint extremely light while maintaining fidelity\
    \ to the SVG spec.\n\nSvJs was inspired by the gySVG library, a similarly light\
    \ but more general-purpose JavaScript library that comes complete with a plug-in\
    \ API and modern framework support. I was initially going to use gySVG and extend\
    \ its functionality with a plug-in, but this plug-in soon grew to the point where\
    \ it made more sense to write my own library with a specific focus on generative\
    \ art. This was how SvJs came to be.\n\n### Getting Set Up\n\nEnough with the\
    \ preamble. Let’s get ourselves set up to write some code.\n\n#### The Code Editor\n\
    \nIf you don’t have VS Code already running on your machine, head on over to [code.visualstudio.com](https://code.visualstudio.com)\
    \ and download and install the appropriate version for your operating system.\n\
    \nIf you can’t install a code editor on your machine or would just prefer to follow\
    \ along online, you can use CodePen instead. Go to [codepen.io](https://codepen.io)\
    \ and sign up an account if you’re not already registered.\n\nI will be writing\
    \ the examples throughout this book with the VS Code editor and local files in\
    \ mind; the same code can be found online via the CodePen versions with some minimal\
    \ differences (such as how we import the SvJs library and the lack of HTML boilerplate\
    \ which CodePen automatically provides).\n\n#### Node.js and NPM\n\nYou can skip\
    \ this part if you intend to use CodePen only, but I would still recommend getting\
    \ familiar with Node.js if you have any plans on getting into the field of web\
    \ development.\n\nNode.js is an open source JavaScript runtime environment that\
    \ allows you to set up your own JavaScript-powered server. It also allows you\
    \ to manage dependencies via the included package manager NPM.\n\nGo to [nodejs.org](https://nodejs.org)\
    \ and download and install the latest LTS (long-term support) version.\n\n####\
    \ Initializing and Installing SvJs\n\nCreate a base folder where you’ll save all\
    \ the work related to this book, and name it something like `generative-svg`.\n\
    \nOpen up VS Code, select **File ➤ Open File**, and navigate to this folder. Next,\
    \ select the **Terminal ➤ New Terminal** command, and you should see a new window\
    \ appear at the bottom of the screen referencing the current folder location.\
    \ It should look something like this:\n\n```\nyour-name@computer-name ~/Documents/generative-svg\n\
    ```\n\nThe important thing is that the path references the folder you created\
    \ in the last step (i.e., `generative-svg`). Once you’ve verified that, you’re\
    \ ready to initialize the project. To do this, type the following into the terminal:\n\
    \n```\nnpm init -y\n```"
  raw: '### Native SVG


    As SVG is a declarative language like HTML, it’s very human-readable and easy
    to get started with. Just like HTML elements, SVG elements are written using opening
    and closing angle brackets and contain attributes with values. Here, for example,
    is how you’d create a circle:


    ```

    The attributes `r`, `cx`, `cy`, and `fill` in the preceding

    example refer to the circle’s radius, the x and y coordinates of its

    center, and the color to fill it with. All are sensibly named and simple

    to follow.

    Some SVG elements will contain other elements nested within them,

    referred to as their child nodes or children, and will therefore need

    opening and closing tags. One prominent example is the parent `<svg>` element

    itself, which contains all other SVG elements.


    As an example of how you might handwrite an SVG, here is the markup

    underlying a very simple composition in the style of Hilma af Klint,

    arguably the first abstract artist in Western art history.


    ```

    A simple Hilma af Klint-inspired knock-off


    ```


    As you can see, SVG is written in such a way as to preserve the

    semantics of the code. Search engines love this; no longer are they

    looking at an impenetrable wall of pixels; they can clearly see the

    *intent* within the markup. In this case, four circles displayed

    in the order they’re written, with a title for extra accessibility.

    Figure [1-1](#538894_1_En_1_Chapter.xhtml#Fig1) shows how this

    markup appears when rendered.


    ![](images/538894_1_En_1_Chapter/538894_1_En_1_Fig1_HTML.png)


    An abstract presents a dark square-shaped structure with 4 concentric

    circles, in different shades at the center.


    Figure 1-1

    A simple composition in the style of Hilma af Klint’s Svanen (The

    Swan)


    Declarative formats are straightforward to read, but their weakness

    is that they can become tedious to write. What if we wanted 100 circles

    instead of four? With native SVG, we’d have to handwrite all of them,

    one after the other. And if we wanted

    to display our circles at random `cx` and `cy` positions, each

    with a randomly selected `fill`, this isn’t

    possible at all. Variables, loops, functions, and all the fun stuff of

    imperative programming aren’t available to us. Declarative formats are

    concerned more with the *what* of a program rather than the

    *how*. The how, however, will very much matter to us. Without the

    how, we wouldn’t have algorithms, and algorithms are essential to

    generative art.

    Algorithms are like recipes; they contain the steps you need to

    follow to achieve a certain result. If you’re baking a cake, you don’t

    just shout “Cake!” and expect one to materialize, no matter how specific

    you get with your declaration (“with strawberry icing and a caramel

    filling!”). This would be the declarative approach, and in practice, it

    sounds more than a little eccentric. To bake a cake, you follow a series

    of well-defined steps or instructions and have

    your ingredients and your oven at the ready. This is akin to the

    imperative approach in programming; it’s more hands-on, and sometimes

    things get messy. But ultimately it gives you more creative control.


    Generating SVG

    So if native SVG doesn’t allow for the use of algorithms, how do we

    write SVG using an imperative approach? The

    answer is we *script* our SVG, and this is where JavaScript and

    SvJs come into play.


    We could script SVG directly in JavaScript without a library, but that

    too has its challenges, the main one being the verbose boilerplate code

    we’d have to write. The SvJs library saves us that trouble, making SVG

    more intuitive and fun to write. Here’s an example of a simple SVG

    (Figure [1-2](#538894_1_En_1_Chapter.xhtml#Fig2)) written using

    vanilla JavaScript:


    ```

    const svg = document.createElementNS('''', ''svg'');

    svg.setAttribute(''width'', ''150px'');

    svg.setAttribute(''height'', ''150px'');

    const div = document.getElementById(''container''); div.appendChild(svg);

    const rect = document.createElementNS('''', ''rect'');

    rect.setAttribute(''x'', ''0'');

    rect.setAttribute(''y'', ''0'');

    rect.setAttribute(''width'', ''150'');

    rect.setAttribute(''height'', ''150'');

    rect.setAttribute(''fill'', ''cornflowerblue'');

    svg.appendChild(rect);

    ```


    And the following snippet is the equivalent SVG written using SvJs

    (don’t worry about the details just yet; all you need to note is how

    concise it is vs. vanilla JavaScript). The output of this code you can

    see in Figure [1-2](#538894_1_En_1_Chapter.xhtml#Fig2).


    ```

    const div = document.getElementById(''stage'');

    const svg = new SvJs().set({ width: ''150px'', height: ''150px'' }).addTo(div);

    svg.create(''rect'').set({

    x: 0, y: 0, width: 150, height: 150, fill: ''cornflowerblue''

    });

    ```


    ![](images/538894_1_En_1_Chapter/538894_1_En_1_Fig2_HTML.png)


    An abstract presents a rectangle in a bright shade.


    Figure 1-2

    A cornflower blue-colored rectangle, in all its glory


    Now you *could* write some functions to make writing vanilla

    JavaScript less painful, but that leads you down the road of writing a

    whole host of other utility functions to make the basics less

    burdensome. With SvJs, I’ve done my best to save you this trouble. It’s

    essentially a very thin wrapper over the real SVG spec with some helpful

    generative functions thrown in. This keeps its footprint extremely light

    while maintaining fidelity to the SVG spec.

    SvJs was

    inspired by the gySVG

    library, a similarly light but more general-purpose JavaScript

    library that comes complete with a plug-in API and modern framework

    support. I was initially going to use gySVG and extend its functionality

    with a plug-in, but this plug-in soon grew to the point where it made

    more sense to write my own library with a specific focus on generative

    art. This was how SvJs came to be.


    Getting Set Up

    Enough with the preamble. Let’s get ourselves set up to write some

    code.


    The Code Editor

    If you don’t have VS Code already running on

    your machine, head on over to code.visualstudio.com and download

    and install the appropriate version for your operating system.

    If you can’t install a code editor on your machine or would just

    prefer to follow along online, you can use CodePen instead. Go to codepen.io and
    sign up an account

    if you’re not already registered.

    I will be writing the examples throughout this book with the VS Code

    editor and local files in mind; the same code can be found online via

    the CodePen versions with some minimal differences (such as how we

    import the SvJs library and the lack of HTML boilerplate which CodePen

    automatically provides).


    Node.js and NPM

    You can skip this part if you intend to use CodePen only, but I would

    still recommend getting familiar with Node.js if you have any plans on

    getting into the field of web development.

    Node.js is an open source

    JavaScript runtime environment that allows you to set up your own

    JavaScript-powered server. It also allows you to manage dependencies via

    the included package manager NPM.

    Go to nodejs.org and download and install the latest LTS (long-term

    support) version.


    Initializing and Installing SvJs

    Create a base folder where you’ll save all the work related to this

    book, and name it something like `generative-svg`.


    Open up VS Code, select File ➤ Open File, and navigate to this folder.

    Next, select the Terminal ➤ New Terminal command, and you should see a

    new window appear

    at the bottom of the screen referencing the current folder location. It

    should look something like this:


    ```

    your-name@computer-name ~/Documents/generative-svg

    ```


    The important thing is that the path references the folder you created

    in the last step (i.e., `generative-svg`). Once

    you’ve verified that, you’re ready to initialize the project. To do

    this, type the following into the terminal:


    ```

    npm init -y

    ```'
  trans: "\n### 原生 SVG\n\n由于 SVG 与 HTML 一样是一种声明式语言，它具有极佳的可读性，并且很容易上手。就像 HTML 元素一样，SVG\
    \ 元素使用开闭尖括号编写，并包含带有值的属性。例如，下面展示了如何创建一个圆形：\n\n```\n<circle r=\"10\" cx=\"20\" cy=\"\
    20\" fill=\"red\" />\n```\n\n上述示例中的属性 `r`、`cx`、`cy` 和 `fill` 分别指代圆的半径、圆心在 x 轴和\
    \ y 轴上的坐标，以及填充颜色。这些属性命名合理，易于理解。\n\n某些 SVG 元素会包含嵌套在其中的其他元素（称为其子节点），因此需要有开闭标签。一个显著的例子是父级\
    \ `<svg>` 元素本身，它包含了所有其他 SVG 元素。\n\n为了展示如何手写 SVG，以下是一个以西尔玛·阿夫·克林特（Hilma af Klint）——可以说是西方艺术史上第一位抽象艺术家——风格创作的极简构图的底层标记语言。\n\
    \n```\n<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\">\n  <circle\
    \ cx=\"25\" cy=\"25\" r=\"20\" fill=\"pink\" />\n  <circle cx=\"75\" cy=\"25\"\
    \ r=\"20\" fill=\"orange\" />\n  <circle cx=\"25\" cy=\"75\" r=\"20\" fill=\"\
    lightblue\" />\n  <circle cx=\"75\" cy=\"75\" r=\"20\" fill=\"lightgreen\" />\n\
    </svg>\n```\n\n一个受西尔玛·阿夫·克林特启发的简单仿制品\n\n如你所见，SVG 的编写方式保留了代码的语义。搜索引擎非常喜欢这一点；它们不再面对难以穿透的像素墙，而是能清晰地在标记语言中看到其*意图*。在这个例子中，四个圆按照书写顺序显示，并附带一个标题以增强可访问性。图\
    \ 1-1 展示了这个标记语言渲染后的效果。\n\n![](img/538894_1_En_1_Fig1_HTML.png)\n\n一幅抽象画，呈现一个深色方形结构，中心有\
    \ 4 个不同色调的同心圆。\n\n**图 1-1** – 仿西尔玛·阿夫·克林特《天鹅》的简单构图\n\n声明式格式易于阅读，但缺点是编写起来可能很繁琐。如果我们想要\
    \ 100 个圆而不是四个呢？使用原生 SVG，我们得逐个手写全部 100 个圆。而且，如果我们想让圆显示在随机的 `cx` 和 `cy` 位置上，每个圆使用随机选择的\
    \ `fill` 颜色，这根本不可能做到。变量、循环、函数以及所有命令式编程中有趣的东西，我们都无法使用。声明式格式更关注程序*是什么*，而不是*如何做*。然而，*如何做*对我们至关重要。没有*如何做*，就不会有算法，而算法是生成式艺术的核心。\n\
    \n算法就像食谱；它们包含了实现特定结果所需的步骤。如果你在烤蛋糕，你不会只是大喊一声“蛋糕！”就期望它凭空出现，无论你的声明多么具体（“加草莓糖霜和焦糖夹心！”）。这将是声明式方法，在实践中，听起来有点古怪。要烤蛋糕，你需要遵循一系列定义明确的步骤或指令，并准备好原料和烤箱。这类似于编程中的命令式方法；它更亲力亲为，有时事情会变得一团糟。但最终它能给你更多的创意控制权。\n\
    \n### 生成 SVG\n\n那么，如果原生 SVG 不允许使用算法，我们如何用命令式方法编写 SVG 呢？答案是*编写脚本*来生成 SVG，这就是 JavaScript\
    \ 和 SvJs 发挥作用的地方。\n\n我们可以在没有库的情况下直接用 JavaScript 编写 SVG 脚本，但这也有其挑战，主要在于需要编写冗长的样板代码。SvJs\
    \ 库省去了我们的麻烦，让编写 SVG 更加直观和有趣。以下是一个用原生 JavaScript 编写的简单 SVG（图 1-2）示例：\n\n```javascript\n\
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\nsvg.setAttribute('width',\
    \ '150px');\nsvg.setAttribute('height', '150px');\n\nconst div = document.getElementById('container');\n\
    div.appendChild(svg);\n\nconst rect = document.createElementNS('http://www.w3.org/2000/svg',\
    \ 'rect');\nrect.setAttribute('x', '0');\nrect.setAttribute('y', '0');\nrect.setAttribute('width',\
    \ '150');\nrect.setAttribute('height', '150');\nrect.setAttribute('fill', 'cornflowerblue');\n\
    svg.appendChild(rect);\n```\n\n而以下片段是用 SvJs 编写的等效 SVG（暂时不用关心细节；你只需要注意它与原生 JavaScript\
    \ 相比有多简洁）。这段代码的输出见图 1-2。\n\n```javascript\nconst div = document.getElementById('stage');\n\
    const svg = new SvJs().set({ width: '150px', height: '150px' }).addTo(div);\n\
    svg.create('rect').set({\n  x: 0, y: 0, width: 150, height: 150, fill: 'cornflowerblue'\n\
    });\n```\n\n![](img/538894_1_En_1_Fig2_HTML.png)\n\n一幅抽象画，呈现一个亮色调的矩形。\n\n**图 1-2**\
    \ – 一个矢车菊蓝色的矩形，尽显风采\n\n现在，你*可以*编写一些函数来减少编写原生 JavaScript 的痛苦，但这会导致你编写一大堆其他实用函数来减轻基础工作的负担。使用\
    \ SvJs，我尽力为你省去这个麻烦。它本质上是对真实 SVG 规范的一个非常轻量的封装，并加入了一些有用的生成式函数。这使其保持极小的体积，同时保持对 SVG\
    \ 规范的忠实。\n\nSvJs 的灵感来自 gySVG 库，这是一个类似轻量但更通用的 JavaScript 库，附带完整的插件 API 和现代框架支持。我最初打算使用\
    \ gySVG 并通过插件扩展其功能，但这个插件很快发展到我认为更有意义的是编写一个专注于生成式艺术的自己的库。SvJs 就这样诞生了。\n\n### 准备工作\n\
    \n前言说得够多了。让我们开始动手编写代码吧。\n\n#### 代码编辑器\n\n如果你的机器上还没有运行 VS Code，请前往 [code.visualstudio.com](https://code.visualstudio.com)\
    \ 下载并安装适合你操作系统的版本。\n\n如果你无法在机器上安装代码编辑器，或者更愿意在线学习，你可以改用 CodePen。前往 [codepen.io](https://codepen.io)\
    \ 并注册一个账户，如果你还没有注册的话。\n\n本书中的示例将使用 VS Code 编辑器并基于本地文件编写；相同的代码可以在线找到 CodePen 版本，仅有微小差异（例如我们如何导入\
    \ SvJs 库，以及缺少 CodePen 自动提供的 HTML 样板文件）。\n\n#### Node.js 和 NPM\n\n如果你只打算使用 CodePen，可以跳过这部分。但如果你有任何进入\
    \ Web 开发领域的计划，我仍然建议你熟悉 Node.js。\n\nNode.js 是一个开源 JavaScript 运行时环境，允许你设置自己的 JavaScript\
    \ 驱动的服务器。它还允许你通过内置的包管理器 NPM 管理依赖项。\n\n前往 [nodejs.org](https://nodejs.org) 下载并安装最新的\
    \ LTS（长期支持）版本。\n\n#### 初始化并安装 SvJs\n\n创建一个基础文件夹，用于保存与本书相关的所有作品，并将其命名为类似 `generative-svg`\
    \ 的名称。\n\n打开 VS Code，选择 **文件 ➤ 打开文件**，然后导航到该文件夹。接下来，选择 **终端 ➤ 新建终端** 命令，你应该会看到屏幕底部出现一个新窗口，引用了当前文件夹的位置。它应该看起来像这样：\n\
    \n```\nyour-name@computer-name ~/Documents/generative-svg\n```\n\n重要的是路径要指向你在上一步创建的文件夹（即\
    \ `generative-svg`）。确认无误后，就可以初始化项目了。为此，在终端中输入以下内容：\n\n```\nnpm init -y\n```\n"
- fmt: "# Running the Package Manager and Installing SvJs\n\nWhat this does is run\
    \ Node’s package manager `npm`, and the `init` command initializes the project,\
    \ or “package.” The `-y` flag just tells `npm` that we want to accept all default\
    \ setup options. You should notice a new file has been created, called `package.json`.\
    \ This is a file you’ll see a lot of in web development, but you don’t need to\
    \ worry about its contents right now. Just know that its purpose is to manage\
    \ our dependencies, the main one being the SvJs library.\n\nTo install SvJs, run\
    \ the following command:\n\n```bash\nnpm install svjs\n```\n\nThis will add a\
    \ new line in the `package.json` file, referencing the version of SvJs you’ve\
    \ just installed. A `package-lock.json` file will also be created (a file you’ll\
    \ never need to look at) and a `node_modules` folder, where SvJs and any of its\
    \ dependencies are stored (it doesn’t have any so you won’t see additional folders\
    \ here).\n\n## Scaffolding Our Sketches\n\nOur first sketch will require a little\
    \ HTML and CSS before we tackle the JavaScript. We’ll keep this markup and styling\
    \ minimal and more or less identical throughout the book, as our real focus will\
    \ be on the JavaScript.\n\nLet’s create a new folder called `sketches` inside\
    \ the base folder, and inside `sketches` create a new folder called `00-template`.\
    \ We’ll number our folders so that they sort nicely. The `00-template` folder\
    \ will contain the very basics we’ll copy from one sketch to another. Inside `00-template`\
    \ create a file called `index.html` and another called `sketch.js`. Once you’ve\
    \ done that, you should have a folder structure like this:\n\n```\ngenerative-svg\n\
    |-- node_modules\n|-- sketches\n|-- 00-template\n|-- index.html\n|-- sketch.js\n\
    |-- package-lock.json\n|-- package.json\n```\n\nOpen the `index.html` file. It’s\
    \ worth noting that VS Code can generate some boilerplate markup for you if you\
    \ type `!` and press the `tab` key, but I’ll include our boilerplate in full here\
    \ so you can copy and paste it. Generally, I recommend you write out the example\
    \ code yourself and limit the “control-c-control-v” activity where possible, as\
    \ you’re less likely to learn this way. Here, however, it’s fine, as HTML and\
    \ CSS aren’t our focus.\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <title>SvJs Template</title>\n  <style>\n    body {\n\
    \      margin: 0;\n      background-color: #202020;\n    }\n    #container {\n\
    \      display: flex;\n      justify-content: center;\n      align-items: center;\n\
    \      height: 100vh;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"\
    ></div>\n  <script type=\"module\" src=\"sketch.js\"></script>\n</body>\n</html>\n\
    ```\n\nThere’s just a couple of things worth pointing out about the preceding\
    \ code: our `<div id=\"container\">` will be where the generative art actually\
    \ happens. It will be our canvas, so to speak. I have placed it within the center\
    \ of the screen, removed any default margins, and given the template an overall\
    \ “dark-mode” feel (my own personal preference). Below the `<div>` you’ll see\
    \ a `<script>` tag. This is where we’ll pull in all our code, so any further modifications\
    \ to the HTML will be unnecessary going forward (other than maybe updating the\
    \ `<title>` tag for each sketch, but I’ll leave that up to you). The script is\
    \ set to `type=\"module\"`. What this does is allow us to handle the import of\
    \ other files and libraries that are packaged (or exported) as modules. This is\
    \ a good practice to get into, and it’s also how we’re going to import the SvJs\
    \ library.\n\nOpen up the `sketch.js` file and include this as your first two\
    \ lines:\n\n```javascript\n// Import the SvJs library.\nimport { SvJs } from '../../node_modules/svjs/src/index.js';\n\
    ```\n\nOur template is now complete, ready to be copied for subsequent sketches.\
    \ Well done!\n\n## Serving Our Sketches\n\nIf you navigate to the `00-template`\
    \ folder at this point and double-click on `index.html` to open it in a web browser,\
    \ you’ll see some errors in the developer console (accessible by pressing `F12`\
    \ on most browsers). This is because we need to serve our HTML files using the\
    \ `http://` protocol rather than the `file://` protocol (you’ll see the protocol\
    \ prefix if you check the full URL in the address bar).\n\nTo rectify this, we\
    \ need to install an http server. And ideally one that detects file changes and\
    \ instantly reloads our page, saving us from having to manually refresh our browser\
    \ each time (which becomes a pain after a while). There’s a neat little package\
    \ called `live-server` that takes care of this for us. To install it, run the\
    \ following in the terminal:\n\n```bash\nnpm install live-server -g\n```\n\nThe\
    \ `-g` flag tells `npm` to install this package globally on our machine, rather\
    \ than locally to the project in question. As it’s more a general-purpose utility\
    \ than a project-specific dependency, this is what we want. To get `live-server`\
    \ to run, all you need to do is type `live-server` into the terminal. It will\
    \ then automatically open a new browser window where you’ll see your project files\
    \ (assuming you’re still in the project’s base folder in VS Code). Navigate to\
    \ `sketches` ➤ `00-template` and you should see your page load free of any console\
    \ errors. It’s also free of any content though, so let’s write some code to address\
    \ this.\n\n## Our First Generative Sketch\n\nAs I mentioned previously, our first\
    \ sketch will serve as a basis for explaining the fundamental programming concepts\
    \ we’ll be covering in Chapter 2, so what follows is, for this reason, rather\
    \ light on explanations (other than some comments in the code itself).\n\nMake\
    \ a copy of the `00-template` folder and call it `01-our-first-generative-sketch`,\
    \ ensuring to copy it to the same location (i.e., so that the parent folder is\
    \ `sketches`).\n\nThen, either write out the following code (recommended) or copy\
    \ it into your `sketch.js` file, below the `import` statement. Read the comments\
    \ as you go (the lines starting with `//`), which I’ve purposely kept quite verbose\
    \ so you can get a better handle on what’s happening.\n\n```javascript\n// Import\
    \ the SvJs library.\nimport { SvJs } from '../../node_modules/svjs/src/index.js';\n\
    \n// Create some global variables.\nconst svgSize = window.innerWidth > window.innerHeight\
    \ ? window.innerHeight : window.innerWidth;\nconst bgColor = '#181818';\n\n//\
    \ Create an object to store some of our randomised parameters.\nconst randomised\
    \ = {\n  hue: random(0, 360),\n  rotation: random(-180, 180),\n  iterations: random(10,\
    \ 100)\n}\n\n// Create our parent SVG and attach it to the element with id 'container'.\n\
    const svg = new SvJs();\nsvg.addTo(document.getElementById('container'));\n\n\
    // Set the width and height of the viewBox and the displayed size of the SVG.\n\
    svg.set({ viewBox: '0 0 1000 1000', width: svgSize, height: svgSize });\n\n//\
    \ Create a background layer - a rectangle the full size of our viewBox.\nconst\
    \ rect = svg.create('rect');\nrect.set({ x: 0, y: 0, width: 1000, height: 1000,\
    \ fill: bgColor });\n\n// Run a loop a random number of times to create our ellipses.\n\
    for (let i = 0; i < randomised.iterations; i += 1) {\n  // Set the centre point,\
    \ the x and y radii of our ellipse and its rotation.\n  let center = 500;\n  let\
    \ radiusX = 100 + (i * 3);\n  let radiusY = 300 + (i * 2);\n  let rotation = randomised.rotation\
    \ + (i * 2);\n\n  // If our random hue is less than 180, increment it. Otherwise\
    \ decrement it.\n  let hue;\n  if (randomised.hue < 180) {\n    hue = randomised.hue\
    \ + (i * 3);\n  } else {\n    hue = randomised.hue - (i * 3);\n  }\n\n  // Create\
    \ our ellipse.\n  let ellipse = svg.create('ellipse');\n  ellipse.set({\n    cx:\
    \ center,\n    cy: center,\n    rx: radiusX,\n    ry: radiusY,\n    fill: 'none',\n\
    \    stroke: `hsl(${hue} 80% 80% / 0.6)`,\n    transform: `rotate(${rotation}\
    \ ${center} ${center})`\n  });\n}\n\n/**\n* Gets a random number between a minimum\
    \ and maximum value.\n*/\nfunction random(min, max, integer = true) {\n  let random\
    \ = Math.random() * (max - min) + min;\n  let number = integer ? Math.floor(random)\
    \ : random;\n  return number;\n}\n```\n\nOk, so quite the code dump! It will no\
    \ doubt overwhelm anyone new to coding, so if you fall into this category and\
    \ find yourself balking at the aforementioned, please bear with me; all will be\
    \ explained in the forthcoming chapters. The purpose of this first generative\
    \ sketch is to just jump in and show you some quick results."
  raw: 'What this does is run Node’s package manager NPM, and the `init` command

    initializes the project, or “package.” The `-y` flag just tells

    `npm` that we

    want to accept all default setup options. You should notice a new file

    has been created, called `package.json`.

    This is a file you’ll see a lot of in web development, but you don’t

    need to worry about its contents right now. Just know that its purpose

    is to manage our dependencies, the main one being the SvJs library.


    To install SvJs, run the following command:


    ```

    npm install svjs

    ```


    This will add a new line in the `package.json` file,

    referencing the version of SvJs you’ve just installed. A `package-lock.json`

    file will also be created (a file you’ll never need to look at) and a

    `node_modules`

    folder, where SvJs and any of its dependencies are stored (it doesn’t

    have any so you won’t see additional folders here).


    Scaffolding Our Sketches

    Our first sketch will require a little HTML and CSS before we tackle

    the JavaScript. We’ll keep this markup and styling minimal and more or

    less identical throughout the book, as our real focus will be on the

    JavaScript.


    Let’s create a new folder called `sketches`

    inside the base folder, and inside `sketches` create a new

    folder called `00-template`. We’ll

    number our folders so that they sort nicely. The `00-template` folder

    will contain the very basics we’ll copy from one sketch to another.

    Inside `00- template` create a file called `index.html` and

    another called `sketch.js`. Once

    you’ve done that, you should have a folder structure like this:


    ```

    generative-svg

    |-- node_modules

    |-- sketches

    |-- 00-template

    |-- index.html

    |-- sketch.js

    |-- package-lock.json

    |-- package.json

    ```


    Open the `index.html` file. It’s

    worth noting that VS Code can generate some boilerplate markup for you

    if you type `!`

    and press the `tab` key, but I’ll

    include our boilerplate in full here so you can copy and paste it.

    Generally, I recommend you write out the example code yourself and limit

    the “control-c-control-v” activity where possible, as you’re less likely

    to learn this way. Here, however, it’s fine, as HTML and CSS aren’t our

    focus.


    ```


    body {

    margin: 0;

    background-color: #202020;

    }

    #container {

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    }


    SvJs Template


    ```


    There’s just a couple of things worth pointing out about the

    preceding code: our `<div id="container">` will be where the generative art actually

    happens. It will be our canvas, so to speak. I have placed it within the

    center of the screen, removed any default margins, and given the

    template an overall “dark-mode” feel (my own personal preference).

    Below the `<div>` you’ll

    see a `<script>` tag.

    This is where we’ll pull in all our code, so

    any further modifications to the HTML will be unnecessary going forward

    (other than maybe updating the `<title>` tag for

    each sketch, but I’ll leave that up to you). The script is set to `type="module"`.
    What

    this does is allow us to handle the import of other files and libraries

    that are packaged (or exported) as modules. This is a good practice to

    get into, and it’s also how we’re going to import the SvJs library.


    Open up the `sketch.js` file and

    include this as your first two lines:


    ```

    // Import the SvJs library.

    import { SvJs } from ''../../node_modules/svjs/src/index.js'';

    ```


    Our template is now complete, ready to be copied for subsequent

    sketches. Well done!


    Serving Our Sketches

    If you navigate to the `00-template` folder at

    this point and double-click on `index.html` to open it

    in a web browser, you’ll see some errors in the developer console

    (accessible by pressing `F12` on most

    browsers). This is because we need to serve our HTML files using the

    `http://`

    protocol rather than the `file://` protocol

    (you’ll see the protocol prefix if you check the full URL in the address

    bar).


    To rectify this, we need to install an http server. And ideally one that

    detects file changes and instantly reloads our

    page, saving us from having to manually refresh our browser each time

    (which becomes a pain after a while). There’s a neat little package

    called `live-server` that

    takes care of this for us. To install it, run the following in the

    terminal:


    ```

    npm install live-server -g

    ```


    The `-g` flag

    tells `npm` to

    install this package globally on our machine, rather than locally to the

    project in question. As it’s more a general-purpose utility than a

    project-specific dependency, this is what we want.

    To get `live-server` to run,

    all you need to do is type `live-server` into the

    terminal. It will then automatically open a new browser window where

    you’ll see your project files (assuming you’re still in the project’s

    base folder in VS Code). Navigate to `sketches` ➤ `00-template` and you

    should see your page load free of any console errors. It’s also free of

    any content though, so let’s write some code to address this.


    Our First Generative Sketch

    As I mentioned previously, our first sketch will serve as a basis for

    explaining the fundamental programming concepts we’ll be covering in

    Chapter [2](#538894_1_En_2_Chapter.xhtml), so what follows is, for this

    reason, rather light on explanations (other than some comments in the

    code itself).

    Make a copy of the `00-template` folder

    and call it `01-our-first-generative-sketch`, ensuring to copy it to

    the same location (i.e., so that the parent folder is `sketches`).


    Then, either write out the following code (recommended) or copy it into

    your `sketch.js`

    file, below the `import` statement.

    Read the comments as you go (the lines starting with `//`), which I’ve

    purposely kept quite verbose so you can get a better handle on what’s

    happening.


    ```

    // Import the SvJs library.

    import { SvJs } from ''../../node_modules/svjs/src/index.js'';

    // Create some global variables.

    const svgSize = window.innerWidth > window.innerHeight ? window.innerHeight :
    window.innerWidth;

    const bgColor = ''#181818'';

    // Create an object to store some of our randomised parameters.

    const randomised = {

    hue: random(0, 360),

    rotation: random(-180, 180),

    iterations: random(10, 100)

    }

    // Create our parent SVG and attach it to the element with id ''container''.

    const svg = new SvJs(); svg.addTo(document.getElementById(''container''));

    // Set the width and height of the viewBox and the displayed size of the SVG.

    svg.set({ viewBox: ''0 0 1000 1000'', width: svgSize, height: svgSize });

    // Create a background layer - a rectangle the full size of our viewBox.

    const rect = svg.create(''rect'');

    rect.set({ x: 0, y: 0, width: 1000, height: 1000, fill: bgColor });

    // Run a loop a random number of times to create our ellipses.

    for (let i = 0; i < randomised.iterations; i += 1) {

    // Set the centre point, the x and y radii of our ellipse and its rotation.

    let center = 500;

    let radiusX = 100 + (i * 3);

    let radiusY = 300 + (i * 2);

    let rotation = randomised.rotation + (i * 2);

    // If our random hue is less than 180, increment it. Otherwise decrement it.

    let hue;

    if (randomised.hue < 180) {

    hue = randomised.hue + (i * 3);

    } else {

    hue = randomised.hue - (i * 3);

    }

    // Create our ellipse.

    let ellipse = svg.create(''ellipse'');

    ellipse.set({

    cx: center,

    cy: center,

    rx: radiusX,

    ry: radiusY,

    fill: ''none'',

    stroke: `hsl(${hue} 80% 80% / 0.6)`,

    transform: `rotate(${rotation} ${center} ${center})`

    });

    }

    /**

    * Gets a random number between a minimum and maximum value.

    */

    function random(min, max, integer = true) {

    let random = Math.random() * (max - min) + min;

    let number = integer ? Math.floor(random) : random;

    return number;

    }

    ```


    Ok, so quite the code dump! It will no doubt overwhelm anyone new to

    coding, so if you fall into this category and find yourself balking at

    the aforementioned, please bear with me; all will be explained in the

    forthcoming chapters. The purpose of this first generative sketch is to

    just jump in and show you some quick results.'
  trans: "\n# 运行包管理器并安装 SvJs\n\n此操作将运行 Node 的包管理器 `npm`，而 `init` 命令则用于初始化项目（或称“包”）。`-y`\
    \ 标志告诉 `npm` 我们接受所有默认设置选项。您会注意到已创建一个名为 `package.json` 的新文件。这是您在 Web 开发中会经常遇到的文件，但目前无需担心其内容。只需知道它的作用是管理我们的依赖项，其中最主要的依赖项就是\
    \ SvJs 库。\n\n要安装 SvJs，请运行以下命令：\n\n```bash\nnpm install svjs\n```\n\n这会在 `package.json`\
    \ 文件中新增一行，引用了您刚刚安装的 SvJs 版本。同时还会创建一个 `package-lock.json` 文件（一个您永远无需查看的文件）和一个 `node_modules`\
    \ 文件夹，SvJs 及其所有依赖项都存储在此文件夹中（它没有任何依赖项，因此您不会在这里看到其他文件夹）。\n\n## 搭建草图框架\n\n在开始处理 JavaScript\
    \ 之前，我们的第一个草图需要一些 HTML 和 CSS。我们会尽量精简这些标记和样式，并在全书范围内保持基本一致，因为真正的重点将放在 JavaScript\
    \ 上。\n\n现在，在项目根文件夹内创建一个名为 `sketches` 的新文件夹，然后在 `sketches` 文件夹内创建一个名为 `00-template`\
    \ 的新文件夹。我们对文件夹进行编号，以便于排序。`00-template` 文件夹将包含我们从一个草图复制到另一个草图的极简基础内容。在 `00-template`\
    \ 文件夹内创建两个文件：`index.html` 和 `sketch.js`。完成这些操作后，您应该会得到如下所示的文件夹结构：\n\n```\ngenerative-svg\n\
    |-- node_modules\n|-- sketches\n|-- 00-template\n|-- index.html\n|-- sketch.js\n\
    |-- package-lock.json\n|-- package.json\n```\n\n打开 `index.html` 文件。值得注意的是，如果您键入\
    \ `!` 并按 `tab` 键，VS Code 可以为您生成一些样板标记，但我会在此处完整提供我们的样板代码，以便您复制粘贴。一般来说，我建议您自己动手编写示例代码，并尽可能限制“复制粘贴”操作，因为这种方式学习效果较差。不过，在这里这样做是可以的，因为\
    \ HTML 和 CSS 并非我们的重点。\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1.0\">\n  <title>SvJs 模板</title>\n  <style>\n    body {\n    \
    \  margin: 0;\n      background-color: #202020;\n    }\n    #container {\n   \
    \   display: flex;\n      justify-content: center;\n      align-items: center;\n\
    \      height: 100vh;\n    }\n  </style>\n</head>\n<body>\n  <div id=\"container\"\
    ></div>\n  <script type=\"module\" src=\"sketch.js\"></script>\n</body>\n</html>\n\
    ```\n\n关于上述代码，有几点值得指出：我们的 `<div id=\"container\">` 将是生成艺术实际发生的地方。可以这么说，它将成为我们的画布。我将其放置在屏幕中央，移除了所有默认边距，并为模板赋予了整体的“深色模式”感觉（这是我个人的偏好）。在\
    \ `<div>` 下方，您会看到一个 `<script>` 标签。这是我们引入所有代码的地方，因此后续无需再对 HTML 进行任何修改（可能除了更新每个草图的\
    \ `<title>` 标签之外，但我会把这个留给您决定）。脚本设置为 `type=\"module\"`。这使我们能够处理作为模块打包（或导出）的其他文件和库的导入。这是一个值得养成的好习惯，也是我们导入\
    \ SvJs 库的方式。\n\n打开 `sketch.js` 文件，并添加以下内容作为前两行代码：\n\n```javascript\n// 导入 SvJs\
    \ 库。\nimport { SvJs } from '../../node_modules/svjs/src/index.js';\n```\n\n现在我们的模板已经完成，可以复制用于后续的草图了。干得好！\n\
    \n## 提供草图服务\n\n如果此时导航到 `00-template` 文件夹并双击 `index.html` 在 Web 浏览器中打开它，您会在开发者控制台（在大多数浏览器上按\
    \ `F12` 键可访问）中看到一些错误。这是因为我们需要使用 `http://` 协议而不是 `file://` 协议来提供我们的 HTML 文件（如果您查看地址栏中的完整\
    \ URL，就会看到协议前缀）。\n\n要解决这个问题，我们需要安装一个 http 服务器。理想情况下，需要一款能检测文件更改并立即重新加载页面的服务器，这样我们就不必每次都手动刷新浏览器（时间长了会变得很烦人）。有一个简洁的小包叫做\
    \ `live-server`，它可以为我们处理这些。要安装它，请在终端中运行以下命令：\n\n```bash\nnpm install live-server\
    \ -g\n```\n\n`-g` 标志告诉 `npm` 将此包全局安装到我们的机器上，而不是本地安装到当前项目中。因为它更像是一个通用工具，而不是项目特定的依赖项，这正是我们想要的。要运行\
    \ `live-server`，您只需在终端中输入 `live-server` 即可。然后它会自动打开一个新的浏览器窗口，您将在其中看到您的项目文件（假设您仍在\
    \ VS Code 的项目根文件夹中）。导航到 `sketches` ➤ `00-template`，您应该会看到页面加载成功，并且控制台没有任何错误。不过，页面上也没有任何内容，所以让我们写一些代码来解决这个问题。\n\
    \n## 我们的第一个生成式草图\n\n正如我之前提到的，我们的第一个草图将作为解释我们在第 2 章中要介绍的基本编程概念的基础，因此，出于这个原因，接下来的内容（除了代码本身的一些注释外）解释会比较简略。\n\
    \n复制 `00-template` 文件夹，并将其命名为 `01-our-first-generative-sketch`，确保复制到相同位置（即父文件夹为\
    \ `sketches`）。\n\n然后，在您的 `sketch.js` 文件中，在 `import` 语句下方，编写（推荐）或复制以下代码。在输入过程中请阅读注释（以\
    \ `//` 开头的行），我有意让注释较为详尽，以便您更好地理解正在发生的事情。\n\n```javascript\n// 导入 SvJs 库。\nimport\
    \ { SvJs } from '../../node_modules/svjs/src/index.js';\n\n// 创建一些全局变量。\nconst\
    \ svgSize = window.innerWidth > window.innerHeight ? window.innerHeight : window.innerWidth;\n\
    const bgColor = '#181818';\n\n// 创建一个对象来存储一些随机化参数。\nconst randomised = {\n  hue:\
    \ random(0, 360),\n  rotation: random(-180, 180),\n  iterations: random(10, 100)\n\
    }\n\n// 创建我们的父级 SVG，并将其附加到 id 为 'container' 的元素上。\nconst svg = new SvJs();\nsvg.addTo(document.getElementById('container'));\n\
    \n// 设置 viewBox 的宽度和高度以及 SVG 的显示尺寸。\nsvg.set({ viewBox: '0 0 1000 1000', width:\
    \ svgSize, height: svgSize });\n\n// 创建一个背景层——一个覆盖 viewBox 全尺寸的矩形。\nconst rect\
    \ = svg.create('rect');\nrect.set({ x: 0, y: 0, width: 1000, height: 1000, fill:\
    \ bgColor });\n\n// 运行一个随机次数的循环来创建我们的椭圆。\nfor (let i = 0; i < randomised.iterations;\
    \ i += 1) {\n  // 设置椭圆的中心点、x 轴和 y 轴半径以及旋转角度。\n  let center = 500;\n  let radiusX\
    \ = 100 + (i * 3);\n  let radiusY = 300 + (i * 2);\n  let rotation = randomised.rotation\
    \ + (i * 2);\n\n  // 如果随机色相小于 180，则递增它。否则递减它。\n  let hue;\n  if (randomised.hue\
    \ < 180) {\n    hue = randomised.hue + (i * 3);\n  } else {\n    hue = randomised.hue\
    \ - (i * 3);\n  }\n\n  // 创建我们的椭圆。\n  let ellipse = svg.create('ellipse');\n \
    \ ellipse.set({\n    cx: center,\n    cy: center,\n    rx: radiusX,\n    ry: radiusY,\n\
    \    fill: 'none',\n    stroke: `hsl(${hue} 80% 80% / 0.6)`,\n    transform: `rotate(${rotation}\
    \ ${center} ${center})`\n  });\n}\n\n/**\n* 获取介于最小值和最大值之间的随机数。\n*/\nfunction random(min,\
    \ max, integer = true) {\n  let random = Math.random() * (max - min) + min;\n\
    \  let number = integer ? Math.floor(random) : random;\n  return number;\n}\n\
    ```\n\n好的，代码量相当大！这无疑会让任何编程新手感到不知所措，所以如果您属于这一类并且发现对上述内容感到畏惧，请耐心等待；所有内容将在后续章节中解释。这个第一个生成式草图的目的就是让您快速上手，并向您展示一些快速成果。\n"
- fmt: "When you save the aforementioned, you should see something like Figure [1-3](#538894_1_En_1_Chapter.xhtml#Fig3).\
    \ Each refresh of the browser will render a unique version, so what you see will\
    \ no doubt differ in some respects. But that, dear reader, is part of the joy\
    \ of generative art.\n\n![](images/538894_1_En_1_Chapter/538894_1_En_1_Fig3_HTML.png)\n\
    \nAn abstract presents a square-shaped structure with a cluster of ellipses in\
    \ a spinning pattern, against a dark background.\n\n**Figure 1-3** Our first generative\
    \ sketch (one variation of many)\n\n## Summary\n\nTo recap, we’ve covered the\
    \ following in this first chapter:\n\n- Why we’re using JavaScript and SvJs rather\
    \ than Processing or `p5.js`\n- What sets SVG apart from raster formats like PNG\
    \ and JPG\n- How scripting SVG differs from writing it directly in markup\n- How\
    \ SvJs can make SVG scripting more intuitive and less verbose\n- Installing and\
    \ importing the SvJs library and setting up our base template\n- How to serve\
    \ our sketches from a local development server\n\nComing up next: a programming\
    \ primer.\n\n# 2. A Programming Primer\n\nAlthough programming can be used to\
    \ create art, it can also be an art in itself. It is part art and part science.\
    \ When beginning programming, you need to familiarize yourself more with the scientific\
    \ side of it, the fundamental concepts and rules that comprise programming as\
    \ a discipline. The art can come later.\n\nLearning the basics in programming\
    \ means getting to grips with concepts like values, variables, operators, expressions,\
    \ conditionals, loops, functions, and more. If you have no idea what any of these\
    \ are, don’t worry. That’s what this chapter is for.\n\nWe’ll also cover the characteristics\
    \ (including some of the peculiarities) of JavaScript, our language of choice.\
    \ JavaScript is a powerful and enormously popular language; it is the only programming\
    \ language web browsers natively understand, so naturally enough, it is *everywhere*.\
    \ Learning JavaScript is therefore a very practical choice and will serve you\
    \ well in a lot of other areas besides generative art.\n\n## Syntax\n\nWe’ll begin\
    \ with some points on syntax.\n\n### Case Sensitivity\n\nJavaScript is a case-sensitive\
    \ language, so the words `JavaScript` and `javascript` would be considered distinct\
    \ from one another. A capitalization convention that many coders adhere to when\
    \ naming functions or variables is something called camel case, where terms are\
    \ joined together in a manner resembling the humps of a camel. For example:\n\n\
    ```\nthisIsCamelCase\nsoIsThis\n```\n\nAs you can see, the first part of the term\
    \ is entirely lowercase, and all subsequent terms use what we’d call title case,\
    \ where the first character of the word is capitalized.\n\n### Spacing\n\nUnlike\
    \ some languages that enforce strict indentation, whitespace in JavaScript doesn’t\
    \ carry any intrinsic meaning. Spacing is mostly a matter of style. The most prevalent\
    \ stylistic convention you’ll come across within the JavaScript community is the\
    \ use of two spaces to indent code, as follows:\n\n```\nsomeCode() {\n  some indented\
    \ code\n}\n```\n\n### Semicolons\n\nEach statement in JavaScript should end with\
    \ a semicolon (`;`), which is the equivalent of a full stop in natural language.\
    \ You can choose to leave them out altogether, due to a JavaScript feature called\
    \ Automatic Semicolon Insertion (ASI), but because this isn’t always safe to do\
    \ (and because I also work with other languages where semicolons are mandatory),\
    \ I opt to leave them in. The code throughout this book will therefore use semicolons.\n\
    \n### Comments\n\nA very important habit to cultivate is the liberal use of comments\
    \ in any code you write. Not only so that others can more easily read and understand\
    \ your code, but so that *you* can do so too. You’d be amazed at how quickly your\
    \ own code can become conundrum-like without comments to guide the way.\n\nThere\
    \ are two types of comments in JavaScript: single-line comments and multi-line\
    \ comments. Single-line comments begin with two forward-slashes `//`, and multi-line\
    \ comments begin with a forward slash and asterisk `/*` and terminate with an\
    \ asterisk and forward slash `*/`.\n\n```\n// A single-line comment. Useful for\
    \ quick explanations.\n/*\n * A multi-line comment.\n * Useful for properly documenting\
    \ code.\n */\n```\n\nSingle-line comments can also be placed after code on the\
    \ same line.\n\n```\nsomeCode(); // We can safely write a comment here.\n```\n\
    \n## Values\n\nAs a programmer, you’ve got to be well versed in values and their\
    \ various types. We’re not talking moral values here or a programming code of\
    \ ethics; by values, we mean “chunks” of information that are eventually boiled\
    \ down to the bytes and bits that the computer processes. Values can be anything\
    \ from numbers to strings of text (like “I love breakfast cereals”). Let’s start\
    \ with numbers.\n\n### Numbers\n\nIf computers love anything at all, it’s numbers.\
    \ They can crunch them far faster than I can crunch through my favorite breakfast\
    \ cereal. In some programming languages, there are different types of numbers\
    \ (e.g., `int` representing integers or whole numbers and `float` representing\
    \ decimal or floating-point numbers), but in JavaScript, all numeric values are\
    \ of the single type `Number`.\n\n```\n17 // A whole number.\n23.085 // A decimal\
    \ number.\n4e2 // A number with an exponent (four to the power of two in this\
    \ case).\n```\n\n### Strings\n\nStrings represent textual information, like words\
    \ and sentences. Strings need to be surrounded by quote marks, of the single or\
    \ double variety.\n\n```\n'There are 10 kinds of people in this world.' // Single\
    \ quotes\n\"Those who understand binary and those who don't.\" // Double quotes\n\
    ```\n\nWhether you choose to use single or double quotes, it’s important to be\
    \ consistent with your choice. Try not to mix them haphazardly.\n\nAnother type\
    \ of string exists called the template literal, which allows you to insert variables\
    \ and expressions into a string. This isn’t possible with standard single or double\
    \ quotes. Template literals are surrounded by backticks, and code can be inserted\
    \ between curly braces prepended by a dollar sign, like so:\n\n```\n`Some text\
    \ here ${someCodeHere}, and more text here. Pretty cool huh?`\n```\n\nThis is\
    \ a more recent feature of JavaScript and is extremely useful for handling concatenated\
    \ (i.e., pieced together) and multi-line strings. Let’s illustrate this with an\
    \ example.\n\n```\n// Here's how developers used to have to store multi-line HTML\
    \ string data.\nlet oldWay = '' +\n'    \\n' +\n'<div>\\n' +\n'        My name\
    \ is ' + name + ' and I am ' + age + ' years of age.\\n' +\n'</div>\\n' +\n' \
    \   \\n';\n\n// And here's how the same thing can be done now.\nlet newWay = `\n\
    <div>\n  My name is ${name} and I am ${age} years of age.\n</div>\n`;\n```\n\n\
    As you can see, it is much more readable and concise. As a rule, whenever you\
    \ want to mix string values with anything else, backticks are the best choice.\n\
    \n### Booleans\n\nBoolean values are binary; they can be either `true` or `false`.\
    \ They are named after George Boole, inventor of Boolean algebra. They can be\
    \ useful for representing any binary state: yes or no, on or off, alive or dead,\
    \ etc. They are written as simply `true` or `false`.\n\n```\nlet alive = true;\
    \ // phew\nlet kicking = false; // just sitting\n```\n\nBooleans make conditional\
    \ statements and comparisons possible, which we’ll get to a little later."
