    *   非常基础的三角学\n\n在下一章也是最后一章中，我们将重点介绍 SVG 滤镜。\n\n## 8. 滤镜效果\n\n除了 SVG 提供的所有矢量功能（正如你从名为“可缩放矢量图形”的格式中所期望的那样），SVG\
    \ 还以 `<filter>` 元素的形式提供了一些非常强大的基于像素的效果。在 GIMP 或 Photoshop 等编辑器中常见的许多图像处理操作，例如模糊、投影和扭曲，实际上也可以在\
    \ SVG 中实现。在本章中，我们将学习如何实现这些效果。\n\n我们不会以任何全面的方式涵盖 SVG 滤镜的功能；那至少需要一本专门的书籍。这是一个庞大的主题，其创作潜力——至少在美学上——常常被忽视。制作出外观糟糕的\
    \ SVG 滤镜非常容易。我将努力避免这个陷阱，并更多地是从生成艺术家的角度，而不是图像编辑器的角度，来呈现一部分滤镜。\n\n### 滤镜基础\n\n在我们深入探讨具体的滤镜效果之前，我们需要了解它们的结构。一个滤镜由一个\
    \ `<filter>` 元素和一个或多个滤镜图元组成。这些图元本身也是元素，它们嵌套在主滤镜元素内部，并且都以字母 `fe`（代表滤镜效果）开头，后跟一个描述性名称。每个图元执行其自身的操作，并且可以通过一系列输入和输出以节点方式连接到其他图元。\n\
    \n让我们看一个仅使用单个图元的原始标记形式的基本示例。\n\n正如你所见，`<filter>` 元素必须嵌套在 `<defs>` 元素内部；与渐变和图案一样，它只有在通过\
