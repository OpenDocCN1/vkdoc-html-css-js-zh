    ## CSS 关键帧\n\n可以使用 CSS 中的 `@keyframes` 规则创建动画序列。与动画、动态图形和视频编辑软件中使用的传统关键帧非常相似，CSS\
    \ `@keyframes` 定义了某些属性在特定时间点（或序列中的步骤）的状态。例如，在时间 `t`，我们的对象可能位于位置 `[x1, y1]`，而在时间\
    \ `t + 5`，对象可能已经移动到了 `[x2, y2]`。关键帧定义了这些时间点，而从一个状态到另一个状态的过渡就构成了动画。我们称这个过程为“补间”（意为“中间帧”），因为动画就发生在这两个中间状态之间。\n\
    \nCSS `@keyframes` 的语法非常直观。你可以使用 `from` 和 `to` 指令设置简单动画的起始和结束关键帧，或者如果你有更复杂的需求，也可以使用百分比来指定某些过渡应该触发的时间点。一旦\
    \ `@keyframes` 规则定义完毕，它就需要被一个元素使用 `animation-name` 属性调用，同时我们还需要指定动画应持续多长时间（`animation-duration`）。我们还可以定义其他可选属性，例如\
