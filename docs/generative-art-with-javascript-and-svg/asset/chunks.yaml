    ## The SMIL Way


    Now let’s try to achieve the same thing with SMIL. SMIL, which stands for Synchronized
    Multimedia Integration Language, is the animation method native to SVG itself,
    requiring no CSS or JavaScript. However, as we’re using SvJs, we will be interfacing
    with SMIL via JavaScript. Before we do so however, here’s a quick peek at how
    it looks in its original form.


    As you can see, the animation is an actual SVG element, nested inside the element
    it animates (a `<circle>` in this case). The `<animate>` element takes care of
    the animation of most SVG attributes, but in the case of element transforms (i.e.,
    translating, rotating, scaling, or skewing), an `<animateTransform>` element must
    be used instead. There is one other animation element called `<animateMotion>`,
    reserved for animating an element along a path. As we will be rotating and scaling
    our shape, the `<animateTransform>` element is the one we’ll be using.


    Each transform requires its own element, making the syntax a little verbose. With
    the first transform, namely, the rotation, we specify the `attributeName` to animate
    and its type, `rotate`. We have just two states to transition between `–` 0 degrees
    and 360 degrees `–` so we can use `from` and `to` directives to cover these. We
    then set the duration (`dur`) and iteration count (`repeatCount`), and that’s
    the first transform taken care of.


    ```javascript

    // Rotate the second shape using SMIL.

    shapes[1].create(''animateTransform'').set({

    attributeName: ''transform'',

    type: ''rotate'',

    from: ''0'',

    to: ''360'',

    dur: ''5s'',

    repeatCount: ''indefinite''

    });

    ```


    The second transform is a little more complicated. It has more than two states,
    so instead of the `from` and `to` attributes, we have a `values` attribute that
    can store multiple states. In this case, we supply it with a semicolon-separated
    list of our transform values. We also need to include an additional `additive`
    attribute with a value of `sum` so that the `scale` transform adds to (and doesn’t
    overwrite) the previous `rotate` transform.


    ```javascript

    // Scale the second shape using SMIL.

    shapes[1].create(''animateTransform'').set({

    attributeName: ''transform'',

    type: ''scale'',

    values: ''1 1; 0.5 1.5; 1 1'',

    dur: ''5s'', additive: ''sum'',

    repeatCount: ''indefinite''

    });

    ```


    The second shape should now be slowly rotating and stretching, and the motion
    should be perfectly synchronized with our CSS keyframes example.


    ## The Web Animations API


    The Web Animations API, or WAAPI, is the most modern of the methods we’ll be covering.
    It is being actively worked on by the W3C (World Wide Web Consortium) and is intended
    to provide the future direction for animation on the Web. In addition to keyframes
    and timing options, it supports advanced features such as control over playback
    rates, flexible easing functionality, scroll-linked timelines, and the ability
    to apply successive animations (or sequences) to the same element.


    Elements can be animated with a sensibly named `animate()` method, which takes
    two arguments. The first argument defines the keyframes, and the second defines
    the timing options.


    ```javascript

    element.animate(keyframes, options);

    ```


    The keyframes can be supplied as either an array of objects or an object containing
    arrays. And the timing options can be supplied as a single value `–` specifically,
    an integer defining the length of the animation in milliseconds `–` or as an object
    containing one or more time-related properties. Say we wanted to animate the value
    of a circle’s radius `r`. The following is how this could be achieved using both
    syntax formats:


    ```javascript

    // Format one for keyframes.

    let keyframes = [

    { r: 25 },

    { r: 40 },

    { r: 25 }

    ];

    // Format two for keyframes.

    let keyframes = {

    r: [25, 40, 25]

    };

    // Format one for timing options.

    let options = 2000; // 2 seconds.

    // Format two for timing options.

    let options = {

    duration: 2000,

    iterations: Infinity,

    // ... etc

    };

    ```


    I prefer the second keyframe format as it is more concise in most cases. Before
    we implement the rotation and scaling example, there’s one more thing to point
    out: how the keyframes are spaced out (or offset) from one another. With CSS keyframes,
    we need to explicitly state when a keyframe should trigger by using percentage
    values or the `from` and `to` directives. With the Web Animations API, the offset
    of animations is *inferred* if not explicitly stated. If we have three keyframes,
    they will be automatically spaced out at 0, 0.5, and 1, respectively (the equivalent
    of 0%, 50%, and 100% in CSS). But we can define custom offsets if needs be. In
    the following example, the second keyframe will trigger at 0.75 instead of the
    default 0.5.


    ```javascript

    // Explicitly defining offsets.

    let keyframes = {

    r: [25, 40, 25],

    offset: [0, 0.75, 1]

    };

    ```


    Let’s get back to our sketch now and implement the rotation and scaling of our
    third shape using the WAAPI method. Below our SMIL implementation, set up the
    animation as follows.


    ```javascript

    let keyframes = {

    transform: [

    ''rotate(0deg) scale(1, 1)'',

    ''rotate(180deg) scale(0.5, 1.5)'',

    ''rotate(360deg) scale(1, 1)''

    ]

    };

    let options = {

    duration: 5000,

    iterations: Infinity

    };

    shapes[2].animate(keyframes, options);

    ```


    Now all but one of our shapes should be on the move. Note how similar the WAAPI
    keyframes syntax is to our CSS keyframes example; this isn’t by accident. The
    Web Animations API is essentially a further development of and extension to preexisting
    web animation standards so that web developers familiar with CSS animation should
    find the syntax intuitive and (mostly) compatible with what they already know.
    Having a native, high-level JavaScript API to create animations in the browser
    has opened up possibilities previously only attainable through the use of third-party
    libraries, but it isn’t the only game in town where native JavaScript animation
    techniques are concerned.


    ## The `requestAnimationFrame()` Method


    Meet the `requestAnimationFrame()` method, a low-level recursive technique that
    allows us to tap into the browser’s screen repainting process. This is a very
    different approach from the methods we’ve covered previously; it is at the same
    time very simple and very complex. By calling a single method over and over again
    (this is the recursive part), we are handed full, fine-grained control over the
    entire animation process `–` but this also means we have to do everything ourselves.
    Concepts like keyframes and timing options don’t really apply at this level.


    The `requestAnimationFrame()` method must be called within a custom function we
    define, which contains the code we want to run on a per-frame basis. We then pass
    this custom function as an argument to `requestAnimationFrame`, so it is called
    recursively on each screen repaint. Here’s a basic example of how this works.'
