    下面展示了如何使用 `SvJs` 和 `feDropShadow` 图元重写图 8-2 的代码。


    ```

    // 初始化滤镜

    let filter = svg.createFilter(''shadow'');

    // 创建投影

    filter.create(''feDropShadow'').set({ dx: 0, dy: 50, stdDeviation: 25 });

    // 应用滤镜

    svg.create(''circle'').set({

    // ... 其他属性

    filter: ''url(#shadow)''

    });

    ```


    ## 着色


    我们之前提到过一些名为 `flood-colour` 和 `flood-opacity` 的属性，它们可以与 `feDropShadow` 图元一起使用。还有一个图元也可以应用这些属性，并且这些属性最初就属于它：`feFlood`。`feFlood`
    图元非常基础；它不需要输入，仅用特定颜色和不透明度填充滤镜区域。它本身并不特别有趣，但与其他图元结合时会很有用。


    还有其他功能更强的颜色相关图元，名为 `feColorMatrix` 和 `feComponentTransfer`。后者过于高级，超出了本书的范围，因此我们将限定于
    `feColorMatrix` 和 `feFlood`。让我们搭建一个草图来使用它们。


    不必复制我们的模板文件夹，而是复制第一个网格示例，我将其标记为 `07-regular-grids`（参见第 4 章）。将此文件夹复制并重命名为类似 `21-colour-filter`
    的名称。保持其余代码不变，将嵌套 `for` 循环的主体替换为以下代码：


    ```

    if (Gen.chance(55)) {

    grid.create(''rect'').set({

    x: x, y: y, width: cellSize, height: cellSize,

    fill: `rgb(

    ${[Gen.random(0, 255), Gen.random(0, 255), Gen.random(0, 255)]}

    )`

    });

    }

    ```


    每次刷新时，这应该会为我们生成一个随机排列的彩色瓷砖网格。到目前为止，我们在颜色使用上一直比较克制，主要控制 `hsl()` 函数的色相分量。这次我们将释放完整的
    `rgb` 色彩光谱，因此结果可能从戏剧性、动态到花哨刺耳不等（参见图 8-4 的示例输出）。我喜欢这些结果中的某些效果；然而，着色有时可能会变得有些不协调。因此，让我们使用一些滤镜来约束颜色，同时保留动态范围。


    ![](img/538894_1_En_8_Fig4_HTML.png)


    一幅抽象图，呈现出一组彩色渐变的方块，背景为深色。


    **图 8-4** 全光谱 RGB 瓷砖


    第一步是降低颜色的饱和度。为此，我们可以使用 `feColorMatrix` 图元，它接受两个参数：`type` 和 `values`。可接受的 `values`
    取决于 `type`，可以如下所示：


    - `saturate`：决定输入的色彩饱和度。它接受介于 `0`（无饱和度）和 `1`（完全饱和度）之间的 `values`，但浏览器可能接受更高的值以实现过饱和。

    - `hueRotate`：按指定角度旋转色相值，该角度在 `values` 中设置。例如，将 `values` 设置为 `180` 会反转输入来源的所有色相值。

    - `luminanceToAlpha`：将输入的亮度转换为 alpha 值，不需要 `values`。

    - `matrix`：这是 `feColorMatrix` 类型中最复杂、最强大的一种。它接受一个 5x5 的颜色变换矩阵作为 `values`，该矩阵与输入来源的像素分量值进行矩阵乘法。它有点过于高级，不适合在本章深入探讨。


    在上述类型中，`saturate` 正是我们需要的。要从输入中抽去颜色，我们需要将 `values` 设置为 `0`。现在让我们设置一个滤镜来实现这一点。在草图的底部，按如下方式初始化一个新的
    `filter`：


    ```

    // 初始化滤镜

    let filter = svg.createFilter(''colourise'');

    // 降低输入饱和度

    filter.create(''feColorMatrix'').set({

    type: ''saturate'',

    values: 0,

    result: ''desaturate''

    });

    // 应用滤镜

    grid.set({ filter: ''url(#colourise)'' });

    ```


    这应该会产生一个灰度网格。接下来，我们要选择一种颜色与其混合，为此我们将使用 `feFlood` 图元。在 `feColorMatrix` 图元和最后一行应用滤镜的代码之间，添加以下代码：


    ```

    // 设置泛色

    filter.create(''feFlood'').set({

    flood_color: ''#7F462C'',

    result: ''flood''

    });

    ```


    这应该会在合成中添加一种棕褐色。问题在于？它简单地淹没了画布，覆盖了所有其他内容。我们需要一种方法将其与 `feColorMatrix` 去饱和的 `result`
    混合。


    ## 混合


    大多数矢量图像编辑应用程序都内置了混合功能，形式为图层混合模式。SVG 在滤镜层面通过 `feBlend` 图元支持此功能。混合模式定义了元素重叠时颜色如何相互作用（无论元素是单个形状还是整个图层）。例如，如果混合模式设置为
    `multiply`，最终颜色是顶部颜色乘以底部颜色的结果，这会产生类似透明胶片重叠的效果。如果设置为 `screen`，顶部和底部颜色会被反转、相乘、再反色，从而产生类似两张图像投射到投影屏幕上的效果。


    SVG 规范支持多种混合模式，逐一描述超出了本章的范围，但如需全面了解（包括交互式示例），请查看 `developer.mozilla.org/docs/Web/CSS/blend-mode`
    上的 MDN 条目。


    实际上，有几种混合模式在我们的案例中效果很好，所以我打算将这些模式存储在一个数组中，以便稍后选择。在初始化滤镜之前包含以下代码：


    ```

    // 设置混合模式数组

    let blendModes = [''screen'', ''overlay'', ''lighten'', ''color-dodge'', ''soft-light'',
    ''color''];

    ```


    接下来，在我们定义了 `feFlood` 图元之后，设置 `feBlend` 图元。我们将随机化其 `mode` 属性，并将第一个输入设置为泛色，第二个输入设置为去饱和的网格。


    ```

    // 随机化混合模式

    filter.create(''feBlend'').set({

    mode: Gen.random(blendModes),

    in: ''flood'',

    in2: ''desaturate'',

    result: ''blend''

    });

    ```


    第一个输入 `in` 作为我们的顶部颜色，第二个输入 `in2` 作为我们的背景颜色。此时，我们的网格应该以着色形式重新出现，但前景中仍然有泛色。我们需要一种方法将其剥离，这就引出了下一节。


    ## 合成


    如果你看过一些最爱的电影幕后花絮，很可能见过绿幕技术：攀爬摩天大楼的动作英雄，实际上挂在一根绳子上，背景是绿色织物。这种技术可以更容易地将背景从前景中剥离，之后与单独拍摄的素材结合。合成就是将这两个不同的元素融合在一起的过程；两个来源合并为一体。它在许多方面与混合相似，但结果更为明显和可编程。它更多地与元素如何相交有关，而非颜色如何融合，可供使用的各种合成操作可以产生非常不同的结果。相比之下，混合在其输出上往往更为统一。


    `feComposite` 图元允许我们在 SVG 中执行合成操作。它接受两个输入 `in` 和 `in2`，其 `operator` 属性有七个可能的值：`over`、`in`、`atop`、`xor`、`out`、`lighter`
    和 `arithmetic`。在图 8-5 中，我展示了其中六种；`arithmetic` 运算符没有固定的输出（它是完全可自定义的），并且过于复杂，无法在本章中恰当覆盖。


    ![](img/538894_1_En_8_Fig5_HTML.jpg)

    ```

    '
- fmt: "一张图示展示了 `in` 和 `in2` 两种操作的六种效果，包括重叠的正方形、两个淡化的重叠正方形中有一个高亮的小正方形、一个大正方形包含一个小正方形、两个重叠正方形中有一个深色小正方形、一个\
    \ L 形亮色正方形，以及一个更亮的正方形。\n\n**图 8-5**  \nSVG 七种合成操作中的六种\n\n由于 `feComposite` 图元非常有用，并且在进一步探索\
    \ SVG 滤镜时您很可能会依赖它，因此值得详细描述每个预设操作符。在图 [8-5](#538894_1_En_8_Chapter.xhtml#Fig5)\
    \ 中，我们可以将 `in` 视为前景，将 `in2` 视为绿幕背景。\n\n*   `over`：这是默认操作符，前景简单地放置在背景之上。\n*   `in`：前景与背景重叠的部分成为新的输出。\n\
    *   `atop`：保留前景与背景重叠的部分；其余的前景部分被裁剪掉。\n*   `xor`：保留前景和背景中不重叠的部分；其余部分被移除。这本质上是 `in`\
    \ 操作符的逆操作。\n*   `out`：显示前景中位于背景外部的部分。\n*   `lighter`：前景和背景的重叠区域被相加（产生增亮效果）。\n\
    *   `arithmetic`：如果选择此操作符，必须定义四个额外的数值属性：`k1`、`k2`、`k3` 和 `k4`。输出结果由以下公式定义：`(k1\
    \ * i1 * i2) + (k2 * i1) + (k3 * i2) + k4`，其中 `i1` 和 `i2` 分别代表 `in` 和 `in2`。是的，这确实很复杂！但使用此操作符可以获得最微妙且可定制的结果，因此非常值得独立探索。\n\
    \n如果我们将 `feFlood` 图元的 `result` 作为第一个输入（前景），将 `SourceGraphic` 作为第二个输入，那么能够实现我们预期效果的操作符是\
    \ `atop`。回顾一下，使用此操作符，前景（`feFlood`）与背景（`SourceGraphic`）重叠的部分将被保留；`feFlood` 的其余部分则被裁剪掉。\n\
    \n现在让我们进行设置。在 `feBlend` 图元之后、滤镜应用于网格之前，包含以下代码。\n\n```\n// Composite the blend\
    \ 'atop' the original.\nfilter.create('feComposite').set({\nin: 'blend',\nin2:\
    \ 'SourceGraphic',\noperator: 'atop'\n});\n```\n\n对我来说，这产生了您在图 [8-6](#538894_1_En_8_Chapter.xhtml#Fig6)\
    \ 中看到的输出。我不知道您怎么看，但我看到了一只好斗的小狗举起爪子，颇有 Scrappy-Doo 的风范（尽管这很可能是我幻想性视错觉在作祟）。每次刷新页面，您都会看到截然不同的效果，虽然色调会变化，但由于我们只使用了一种\
    \ `feFlood` 颜色，所以可以观察到共同的颜色基调。不使用滤镜很难实现这种效果。\n\n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig6_HTML.png)\n\
    \n一幅抽象画展示了在深色背景上，一团由各种颜色渐变的正方形组成的图案，类似马赛克图案。\n\n**图 8-6**  \n合成操作的结果\n\n### 噪点与扭曲\n\
    \n在本节中，我们将介绍一种新的噪点，它实际上是 SVG 规范内置的。我们还将探索如何在滤镜管线中添加一些扭曲效果。有了这两个要素，再加上前面介绍的基础知识，一个全新的特效世界将向我们敞开。\n\
    \n#### 湍流（Turbulence）\n\n在第 [5](#538894_1_En_5_Chapter.xhtml) 章中，我们介绍了 SvJs 的\
    \ `Noise` 模块，它允许我们在草图中使用 Perlin 噪点。SVG 也在其 `feTurbulence` 滤镜图元中实现了 Perlin 噪点，那么区别是什么呢？\n\
    \n区别在于，使用 `Noise` 模块，我们可以提取并操作噪点*数据*，利用其值来塑造我们的矢量形状。而使用 `feTurbulence`，我们拥有的是一个直接以*像素*形式渲染噪点数据的滤镜图元。这虽然不让我们访问底层噪点数据，但我们可以通过调整其属性轻松地改变视觉输出，并将其输入到其他滤镜图元中。`feTurbulence`\
    \ 的属性如下：\n\n*   `baseFrequency`：这是唯一必需的属性，我们可以将其理解为定义噪点的“缩放级别”。通常最低值从 0.0001 开始（当然也可以更低），值越高，显示的噪点地形就越多。如果提供两个数值（而非一个），第一个将定义\
    \ X 轴方向的频率，第二个定义 Y 轴方向的频率。以这种方式解耦两个值，可以在水平或垂直方向上拉伸或压缩生成的纹理。\n*   `numOctaves`：此属性指的是噪点信号中存在的八度音阶数量，决定了我们所能辨别的细节水平。值越高，渲染结果越自然，但对处理器的要求也越高。最实用的结果范围在\
    \ 1 到 5 之间。\n*   `seed`：这允许我们改变采样噪点的“位置”。如果 `baseFrequency` 是缩放级别，那么 `seed` 就是我们的位置坐标。有效的\
    \ `seed` 值应为 0 到 1000 万之间的正整数。\n*   `stitchTiles`：此属性接受 `stitch` 或 `noStitch`，指的是噪点地形相邻区域如何混合。设置为\
    \ `noStitch`（默认值）时，某些噪点配置会导致“平铺”效应，即噪点区域之间的边界非常明显。设置为 `stitch` 可以柔化这种效应。\n*  \
    \ `type`：可以设置为 `fractalNoise` 或 `turbulence`（默认值）。前者在红色、绿色、蓝色和 Alpha 通道上产生相同类型的噪点模式，后者则在\
    \ Alpha 通道上产生不同的模式。`fractalNoise` 类型看起来更柔和，非常适合生成像云这样的气态纹理。而 `turbulence` 类型的外观则更偏向流体形态。\n\
    \n在图 [8-7](#538894_1_En_8_Chapter.xhtml#Fig7) 中，我们可以看到左侧有两个 `turbulence` 实例，右侧有两个\
    \ `fractalNoise` 实例。实例之间的值只有细微变化，这应该能让您感受到此滤镜图元可能提供的巨大变化。\n\n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig7_HTML.png)\n\
    \n一张截图显示了四个不同的正方形。左侧是两个具有不同频率和八度音阶的湍流模式正方形，颜色渐变。右侧是两个具有不同频率和八度音阶的分形噪点正方形，颜色渐变。\n\
    \n**图 8-7**  \n两种噪点类型的不同基础频率和八度音阶\n\n要感受 `feTurbulence` 的工作原理，最好的方法是调整交互式示例，因此我专门为此创建了一个在线代码笔：`davidmatthew.ie/generative-art-javascript-svg#turbulence`。我倾向于使用非常低的\
    \ `baseFrequency` 值，并通过修改 `seed` 来随机选择一种模式；这可以产生大量有趣的纹理。然而，如果您想模拟更颗粒化的效果，例如经典的胶片颗粒效果或砂纸纹理，非常高的\
    \ `baseFrequency` 值会很有用。"
  raw: "An illustration presents six operations of in and in 2 squares. It\nincludes\
    \ overlapped squares, two faded overlap squares with a\nhighlighted small square,\
    \ a big square with a small square, two overlap\nsquares with a dark small square,\
    \ an L-shaped bright square, and a\nlighter square.\n\nFigure 8-5\nSix of the\
    \ seven SVG compositing operations\n\nBecause the `feComposite` primitive is so\
    \ useful\nand something you’ll likely lean on if you further explore SVG filters,\n\
    it’s worth describing each preset operator. In Figure [8-5](#538894_1_En_8_Chapter.xhtml#Fig5),\
    \ we can think of\n`in` as our\nforeground and `in2` as our\ngreen-screen background.\n\
    \n*   `over`:\n    This is the default operator, where our foreground is simply\
    \ placed over\n    the background.\n\n*   `in`: The\n    portion of the foreground\
    \ that overlaps with the background becomes the\n    new output.\n\n*   `atop`:\n\
    \    The portion of the foreground that overlaps with the background is\n    retained;\
    \ the rest of the foreground is clipped.\n\n*   `xor`:\n    Those portions of\
    \ the foreground and background that do not overlap are\n    kept; the rest is\
    \ removed. It’s essentially the inverse of the `in` operator.\n\n*   `out`: The\n\
    \    portion of the foreground that falls outside the background is displayed.\n\
    \n*   `lighter`:\n    The overlapping regions of the foreground and background\
    \ are summed\n    together (resulting in a lightening effect).\n\n*   `arithmetic`:\
    \ If this\n    operator is chosen, four additional attributes must be defined,\
    \ all\n    numeric: `k1`,\n    `k2`, `k3`, and `k4`. The output is\n    then defined\
    \ via the following formula: `(k1 * i1 * i2) + (k2 * i1) + (k3 * i2) + k4`, where\
    \ `i1` and `i2` represent `in` and `in2`, respectively.\n    Yep, told you it\
    \ was complex! But the most subtle and customizable\n    results can be achieved\
    \ using this operator, so it is well worth\n    independent exploration.\n\nIf\
    \ we take the `result` of the `feFlood` primitive as\nour first input (the foreground)\
    \ and the `SourceGraphic` as the\nsecond input, the operator that will achieve\
    \ the effect we’re looking\nfor is `atop`. To\nrecap, with this operator, those\
    \ portions of the foreground (`feFlood`) that overlap\nwith the background (`SourceGraphic`)\
    \ are\nretained; the rest of `feFlood` should be\nclipped.\n\nLet’s set this up\
    \ now. Include the following code after the `feBlend` primitive,\nbefore the filter\
    \ is applied to the grid.\n\n```\n// Composite the blend 'atop' the original.\n\
    filter.create('feComposite').set({\nin: 'blend',\nin2: 'SourceGraphic',\noperator:\
    \ 'atop'\n});\n```\n\nFor me, this resulted in the output you see in Figure [8-6](#538894_1_En_8_Chapter.xhtml#Fig6).\
    \ I don’t know\nabout you, but I see a pugnacious pup putting\nup his dukes, à\
    \ la Scrappy-Doo (though that may well be my pareidolia at\nwork). On each refresh,\
    \ you’ll see something quite different, and while\nthe color tones vary, a common\
    \ palette can be discerned due to the\nsingle `feFlood`\ncolor we’re drawing upon.\
    \ This kind of effect would be quite difficult\nto achieve without filters.\n\n\
    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig6_HTML.png)\n\nAn abstract presents\
    \ a cluster of squares, in a gradient of colors,\nagainst a dark background. It\
    \ resembles a mosaic pattern.\n\nFigure 8-6\nThe result of the composite operation\n\
    \nNoise and Distortion\nIn this section, we’ll introduce a new kind of noise,\
    \ one that’s\nactually built in to the SVG spec itself. And we’ll also explore\
    \ how to\nadd some distortion to our filter pipeline. With these two ingredients,\n\
    along with the basics covered earlier, a whole world of effects opens up\nto us.\n\
    \nTurbulence\nIn Chapter [5](#538894_1_En_5_Chapter.xhtml), we introduced the\
    \ SvJs `Noise` module, which\nallowed us to use Perlin noise in our sketches.\
    \ SVG also\nimplements Perlin noise inside its `feTurbulence` filter\nprimitive,\
    \ so what’s the difference?\n\nWell, with the `Noise` module, we can\nextract\
    \ and play with noise *data*, using its values to shape our\nvectors. With `feTurbulence`\
    \ on the\nother hand, we have a filter primitive that renders noise data directly,\n\
    in *pixel* form. This doesn’t give us access to the underlying\nnoise data, but\
    \ what we can do is easily alter the visual output by\ntweaking its attributes\
    \ and then feed it into other filter primitives.\nThe `feTurbulence`\nattributes\
    \ are as follows:\n\n*   `baseFrequency`: This\n    is the only mandatory attribute,\
    \ and we can think of it as defining the\n    noise “zoom level.” It’s typical\
    \ for the lowest value to start at 0.0001\n    (though you can start lower), and\
    \ the higher the values go, the more of\n    our noise terrain is revealed. If\
    \ you supply two numeric values instead\n    of one, the first will define the\
    \ frequency along the x axis and the\n    second along the y axis. Decoupling\
    \ the values this way makes it\n    possible to stretch or compress the resulting\
    \ texture horizontally or\n    vertically.\n\n*   `numOctaves`: This\n    attribute\
    \ refers to the number of octaves present in the noise signal\n    and determines\
    \ the level of detail we can discern. Higher values\n    render more natural results\
    \ but are more processor-intensive. The most\n    usable results lie in the range\
    \ of 1 to 5.\n\n*   `seed`:\n    This allows us to change the “location” from\
    \ which we sample our noise.\n    If the `baseFrequency` is our\n    zoom level,\
    \ the `seed` is our position.\n    A valid `seed`\n    value should be a positive\
    \ integer anywhere from 0 to 10\n    million.\n\n*   `stitchTiles`: This\n   \
    \ attribute accepts either `stitch` or `noStitch` and refers\n    to how adjacent\
    \ areas of the noise terrain are blended together. With it\n    set to `noStitch`\n\
    \    (the default), certain noise configurations can lead to a “tiling”\n    effect,\
    \ where the boundary between noise regions is quite pronounced. Setting a\n  \
    \  value of `stitch`\n    can soften this.\n\n*   `type`:\n    This can be set\
    \ to `fractalNoise` or `turbulence` (the\n    default). The former produces the\
    \ same kind of noise pattern across the\n    red, green, blue, and alpha channels,\
    \ and the latter produces a\n    different pattern in the alpha channel. The `fractalNoise`\
    \ type has\n    a softer look and is great for generating gaseous textures like\
    \ clouds.\n    The `turbulence`\n    type, on the other hand, is more liquid-like\
    \ in appearance.\n\nIn Figure [8-7](#538894_1_En_8_Chapter.xhtml#Fig7), we can\
    \ see two\ninstances of `turbulence` on the\nleft and two instances of `fractalNoise`\
    \ on the\nright. The values vary only slightly between instances, which should\n\
    give you a sense of the potential variation offered by this filter\nprimitive.\n\
    \n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig7_HTML.png)\n\nA screenshot\
    \ has four different squares. On the left are two squares\nwith turbulence patterns,\
    \ at different frequencies and octaves, in a\ngradient of colors. On the right\
    \ are two squares with fractal noise, at\ndifferent frequencies and octaves, in\
    \ a gradient of colors.\n\nFigure 8-7\nVarying the base frequency and octaves\
    \ for the two noise types\n\nThe best way to get a feel for how `feTurbulence`\
