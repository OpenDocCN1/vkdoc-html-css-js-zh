  trans: "\n当你保存上述代码后，应该会看到类似图 1-3 所示的效果。每次刷新浏览器都会生成一个独特的版本，因此你看到的内容无疑会在某些方面有所不同。但亲爱的读者，这正是生成艺术的魅力所在。\n\
    \n![](img/538894_1_En_1_Fig3_HTML.png)\n\n一幅抽象画，在深色背景下呈现出一个由椭圆簇构成的旋转图案，形成方形结构。\n\
    \n**图 1-3** 我们的第一个生成式草图（众多变体之一）\n\n## 总结\n\n回顾一下，我们在第一章中涵盖了以下内容：\n\n- 为何使用 JavaScript\
    \ 和 SvJs，而非 Processing 或 `p5.js`\n- SVG 与 PNG 和 JPG 等光栅格式的区别\n- 脚本化 SVG 与直接在标记语言中编写有何不同\n\
    - SvJs 如何让 SVG 脚本编写更直观、更简洁\n- 安装与导入 SvJs 库，并设置基础模板\n- 如何在本地开发服务器上预览我们的草图\n\n下一章：编程入门。\n\
    \n# 2. 编程入门\n\n虽然编程可以用于创作艺术，但它本身也是一门艺术。它既是科学也是艺术。开始学习编程时，你需要先熟悉其科学的一面，即构成编程这门学科的基本概念和规则。艺术的一面可以稍后涉猎。\n\
    \n学习编程基础意味着要掌握值、变量、运算符、表达式、条件语句、循环、函数等概念。如果你对这些概念一无所知，请不要担心。这正是本章的目的。\n\n我们还将介绍\
    \ JavaScript（我们选择的语言）的特性（包括一些特殊之处）。JavaScript 是一种强大且极其流行的语言；它是浏览器原生理解的唯一编程语言，因此，它自然*无处不在*。学习\
    \ JavaScript 是一个非常实用的选择，它不仅在生成艺术领域，在许多其他领域也能发挥巨大作用。\n\n## 语法\n\n我们从一些语法要点开始。\n\
    \n### 大小写敏感\n\nJavaScript 是一种区分大小写的语言，因此 `JavaScript` 和 `javascript` 这两个词会被视为不同的标识。许多程序员在命名函数或变量时遵循的命名惯例是驼峰命名法，即术语以类似骆驼驼峰的方式连接在一起。例如：\n\
    \n```\nthisIsCamelCase\nsoIsThis\n```\n\n如你所见，术语的第一部分完全小写，后续部分使用我们称之为“标题大写”的形式，即每个单词的首字母大写。\n\
    \n### 空格\n\n与一些强制执行严格缩进的语言不同，JavaScript 中的空白字符没有内在含义。间距主要是一种风格问题。在 JavaScript\
    \ 社区中，你遇到的最普遍的风格约定是使用两个空格来缩进代码，如下所示：\n\n```\nsomeCode() {\n  some indented code\n\
    }\n```\n\n### 分号\n\nJavaScript 中的每个语句都应该以分号（`;`）结尾，它相当于自然语言中的句号。由于 JavaScript\
    \ 具有一项称为“自动分号插入 (ASI)”的功能，你可以选择完全不写分号，但这样做并不总是安全的（而且我也使用其他必须使用分号的语言），因此我选择保留分号。本书中的代码都将包含分号。\n\
    \n### 注释\n\n在任何你编写的代码中，养成大量使用注释的习惯非常重要。这不仅能让其他人更轻松地阅读和理解你的代码，也能让你自己做到这一点。你会惊讶地发现，如果没有注释指引，自己的代码也会很快变得像谜题一样难以理解。\n\
    \nJavaScript 中有两种类型的注释：单行注释和多行注释。单行注释以两个正斜杠 `//` 开头，多行注释以正斜杠和星号 `/*` 开头，以星号和正斜杠\
    \ `*/` 结束。\n\n```\n// 单行注释。适用于快速解释。\n/*\n * 多行注释。\n * 适用于恰当地记录代码。\n */\n```\n\n\
    单行注释也可以放在同一行代码之后。\n\n```\nsomeCode(); // 我们可以在这里安全地写注释。\n```\n\n## 值\n\n作为一名程序员，你必须精通各种值及其类型。这里我们不是在谈论道德价值观或编程道德准则；这里说的值，指的是最终会被简化为计算机处理的字节和比特的信息“块”。值可以是任何东西，从数字到文本字符串（例如“我爱早餐麦片”）。让我们从数字开始。\n\
    \n### 数字\n\n如果说计算机有什么特别钟爱的东西，那就是数字。它们处理数字的速度，远比我吃掉我最爱的早餐麦片的速度要快。在某些编程语言中，存在不同类型的数字（例如，`int`\
    \ 代表整数或整型数字，`float` 代表十进制数或浮点数），但在 JavaScript 中，所有数值都属于单一的 `Number` 类型。\n\n```\n\
    17 // 一个整数。\n23.085 // 一个小数。\n4e2 // 一个带指数的数字（这里表示 4 的 2 次方）。\n```\n\n### 字符串\n\
    \n字符串表示文本信息，如单词和句子。字符串需要用引号括起来，可以是单引号或双引号。\n\n```\n'世界上有 10 种人。' // 单引号\n\"懂二进制的人和不懂二进制的人。\"\
    \ // 双引号\n```\n\n无论你选择使用单引号还是双引号，保持一致非常重要。尽量不要随意混用。\n\n另一种类型的字符串称为模板字面量，它允许你将变量和表达式插入到字符串中。这是标准的单引号或双引号无法做到的。模板字面量被反引号括起来，代码可以插入在以美元符号为前缀的花括号之间，如下所示：\n\
    \n```\n`这里是一些文本 ${someCodeHere}，这里还有更多文本。很酷吧？`\n```\n\n这是 JavaScript 的一个较新特性，在处理连接字符串和多行字符串时非常有用。让我们通过一个例子来说明。\n\
    \n```\n// 这是过去开发者存储多行 HTML 字符串数据的方式。\nlet oldWay = '' +\n'    \\n' +\n'<div>\\\
    n' +\n'        我的名字是 ' + name + '，我今年 ' + age + ' 岁。\\n' +\n'</div>\\n' +\n' \
    \   \\n';\n\n// 这是现在实现同样事情的方式。\nlet newWay = `\n<div>\n  我的名字是 ${name}，我今年 ${age}\
    \ 岁。\n</div>\n`;\n```\n\n如你所见，它更加易读和简洁。通常，每当你想要将字符串值与任何其他内容混合时，反引号是最佳选择。\n\n###\
    \ 布尔值\n\n布尔值是二进制的；它们只能是 `true` 或 `false`。它们以布尔代数的发明者乔治·布尔的名字命名。它们可用于表示任何二元状态：是或否、开或关、活着或死亡等等。它们简单地写成\
    \ `true` 或 `false`。\n\n```\nlet alive = true; // 呼，还活着\nlet kicking = false; //\
    \ 只是坐着\n```\n\n布尔值使得条件语句和比较成为可能，我们稍后会讲到。\n"
- fmt: '# Empty Values


    Empty values are the final values we’ll consider. There are two: `null` and `undefined`.
    You can think of them as values that carry no information. You’ll see a lot of
    them (particularly `undefined`) when debugging your code, so as you can imagine,
    they are not always the most welcome of visitors.


    What is the difference between `null` and `undefined`? A simplified way to think
    of it is this: when JavaScript tells you a variable called `x` is `null`, it’s
    saying “yeah I know about `x`, but `x` doesn’t have any value so far as I can
    see.” If, on the other hand, it tells you that `x` is `undefined`, it is essentially
    saying “What the **** is `x`? Ain’t no `x` around here.”


    # Variables


    We’ve name-dropped variables a couple of times already, so what exactly are they?
    You can think of variables like containers for values that can be referenced later.


    A variable needs to be declared before it can be used. There are three ways to
    do this: using `const`, `let`, or `var`. The latter, `var`, is no longer recommended;
    I mention it mainly for historical reasons and because it is something you’ll
    likely encounter in the wild. Many, many JavaScript code bases out there still
    use `var`, simply because prior to the great JavaScript update of 2015 (called
    ECMAScript 6, or ES6 for short), there was no other option available.


    Declaring a variable involves using the keyword, creating a name/identifier, and
    then assigning it a value using the equals operator.


    ```

    const name = ''David Matthew'';

    const countryOfBirth = ''Ireland'';

    let age = 21; // I wish!

    ```


    What’s the difference between `const` and `let`? When using `const`, you’re declaring
    a value that shouldn’t change. My `countryOfBirth` is an example: this is a historical
    fact that remains constant. If I later tried to reassign a new value to `countryOfBirth`,
    this would result in an error:


    ```

    countryOfBirth = ''Brazil''; // uh oh...

    -> TypeError: Assignment to constant variable

    ```


    My `age`, however, is (alas) subject to change, so it can be updated without any
    issues. Another difference between `const` and `let` is that the latter can be
    declared without a value, whereas with `const`, a value must be assigned to it
    when it is first created.


    ```

    let a; // A-ok.

    const b; // asking for trouble.

    -> Uncaught SyntaxError: Missing initializer in const declaration

    ```


    When unsure, should you use `const` or `let`? The general consensus in the JavaScript
    community is that you should use `const` by default and only use `let` when you
    think the variable may be assigned a new value later. The reasoning is that this
    can reduce any unintended value re-assignments, ruling out a potential source
    of bugs.


    # Operators


    An operator is a symbol that performs operations on values. We’ve actually come
    across one already: the assignment operator (`=`), which assigns a value to a
    variable. Let’s see what other kinds of operators are available to us.


    ## Arithmetic Operators


    As you might have guessed, arithmetic operators allow us to perform mathematical
    operations. The addition operator (`+`) allows us to add numbers, but it also
    allows us to concatenate strings.


    ```

    // Adding numbers.

    2 + 2

    -> 4

    // Concatenating strings.

    ''I am'' + '' so smrt''

    -> ''I am so smrt''

    ```


    There are also operators for subtraction (`-`), multiplication (`*`), and division
    (`/`).


    ```

    // Subtracting numbers.

    9 - 4

    -> 5

    // Dividing numbers.

    9 / 4

    -> 2.25

    // Multiplying numbers.

    9 * 4

    -> 36

    ```


    ES6 introduced an exponentiation operator (`**`), which allows you to multiply
    one number by a factor of another (i.e., one number to the power of another).


    ```

    // The exponentiation operator.

    2 ** 2

    -> 4

    2 ** 6

    -> 64

    2 ** 10

    -> 1024

    ```


    And finally, there is the modulo operator (`%`). This divides one number by another
    and gives you the remainder. This can be especially useful when cycling through
    arrays (which we’ll get to later), or quickly finding out if an unknown quantity
    is even or odd.


    ```

    // The modulo operator in action.

    3 % 3

    -> 0

    3 % 2

    -> 1

    12 % 5

    -> 2

    ```'
  raw: 'Empty Values

    Empty values are the final values we’ll consider. There are two:

    `null` and `undefined`. You can

    think of them as values that carry no information. You’ll see a lot of

    them (particularly `undefined`) when

    debugging your code, so as you can imagine, they are not always the most

    welcome of visitors.

    What is the difference between `null` and `undefined`? A

    simplified way to think of it is this: when JavaScript tells you a

    variable called `x` is `null`, it’s saying

    “yeah I know about x, but x doesn’t have any value so far as I can see.”

    If, on the other hand, it tells you that `x` is `undefined`, it is

    essentially saying “What the **** is x? Ain’t no x around here.”


    Variables

    We’ve name-dropped variables a couple of times already, so what

    exactly are they? You can think of variables like containers

    for values that can be referenced later.

    A variable needs to be declared before it can be used. There are

    three ways to do this: using `const`, `let`, or `var`.

    The latter, `var`, is no longer

    recommended; I mention it mainly for historical reasons and because it

    is something you’ll likely encounter in the wild. Many, many JavaScript

    code bases out there still use `var`, simply because

    prior to the great JavaScript update of 2015 (called ECMAScript 6, or

    ES6 for short), there was no other options available.


    Declaring a variable involves using the keyword, creating a

    name/identifier, and then assigning it a value using the equals

    operator.


    ```

    const name = ''David Matthew'';

    const countryOfBirth = ''Ireland'';

    let age = 21; // I wish!

    ```


    What’s the difference between `const` and `let`? When using `const`, you’re

    declaring a value that shouldn’t change. My `countryOfBirth` is an

    example: this is a historical fact that remains constant. If I later

    tried to reassign a new value to `countryOfBirth`, this

    would result in an error:


    ```

    countryOfBirth = ''Brazil''; // uh oh...

    -> TypeError: Assignment to constant variable

    ```


    My `age`,

    however, is (alas) subject to change, so it can be updated without any

    issues. Another difference between `const` and `let` is that the

    latter can be declared without a value, whereas with `const`, a value must

    be assigned to it when it is first created.


    ```

    let a; // A-ok.

    const b; // asking for trouble.

    -> Uncaught SyntaxError: Missing initializer in const declaration

    ```


    When unsure, should you use `const` or `let`? The general

    consensus in the JavaScript community is that you should use `const` by default
    and only use

    `let` when you

    think the variable may be assigned a new value later. The reasoning is

    that this can reduce any unintended value re-assignments, ruling out a

    potential source of bugs.


