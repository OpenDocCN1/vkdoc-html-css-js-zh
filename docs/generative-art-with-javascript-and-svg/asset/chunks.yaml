- fmt: "# A Quadratic Slinky\n\nLet's use the quadratic Bezier curve in a simple sketch\
    \ to create a Slinky-esque array of paths. If you don't know what a Slinky is,\
    \ it's a popular spring-based toy that can \"walk\" itself down a set of steps\
    \ if given a nudge from the top (I'm sure it can perform many other miraculous\
    \ feats, but this is the one for which it's most widely known).\n\nCopy the template\
    \ folder and rename it to `14-quadratic-slinky`. Below the parent SVG, set some\
    \ styles to target the `path` elements that we'll later set up as children of\
    \ a group to which we'll give an `id` of `slinky`.\n\n```\n// Style the slinky.\n\
    svg.create('style').content(`\n#slinky path {\nfill: none;\nstroke-width: 0.75;\n\
    stroke-linecap: round;\n}`\n);\n```\n\nNext set up the usual background, initialize\
    \ a random hue, and create the aforementioned `slinky` group.\n\n```\n// Background.\n\
    svg.create('rect').set({\n  x: 0, y: 0, width: 1000, height: 1000, fill: '#181818'\n\
    });\n// Choose a random starting hue.\nlet hue = Gen.random(0, 360);\n// Set up\
    \ the slinky path group.\nlet slinky = svg.create('g').set({ id: 'slinky' });\n\
    ```\n\nIn the next step, we'll fire up the loop and create a couple of control\
    \ points we'll use to shape our quadratic curve.\n\n```\n// Start the loop.\n\
    for (let i = 0; i < 500; i += 5) {\n  // Create the control points.\n  let cpx\
    \ = Gen.random(200, 400);\n  let cpy = i - 400;\n}\n```\n\nThe width of our curve\
    \ will be 600 units (relative to the `viewBox`), so our halfway point will be\
    \ 300. On the x axis, the `cpx` variable is picking a random integer value 100\
    \ units either side of the halfway point, to give our slinky some \"wobble.\"\
    \ The `cpy` variable is more straightforward; it moves down the screen on each\
    \ iteration, with an offset of 400 units that will \"pull\" the curve upward.\n\
    \nNext, let's create the actual curve (keeping within the loop).\n\n```\n// Create\
    \ the quadratic curve.\nslinky.create('path').set({\n  stroke: `hsl(${hue} 90%\
    \ 80% / 0.85)`,\n  d: `M 0 ${i} q ${cpx} ${cpy} 600 0`\n});\n```\n\nHere, we're\
    \ setting the `hue` as we've done many times before, and for the `path`, we're\
    \ drawing one simple curve starting with the `M` command. For the curve coordinates,\
    \ we're taking advantage of the relative coordinates calculated by the lowercase\
    \ `q` command, which allows us to keep the values in step with curve's starting\
    \ point.\n\nBefore closing out the loop, we'll increment the `hue`, but we'll\
    \ use a new technique to do so. I mentioned the modulo operator (`%`) in Chapter\
    \ [2](#538894_1_En_2_Chapter.xhtml) (in the section covering operators), which\
    \ calculates a number's remainder after division. This can be useful to cycle\
    \ within predefined ranges, such as the 0 to 360 constraints of a color's `hue`.\
    \ Add the following as the final line before the end of the loop:\n\n```\n// Increment\
    \ the hue.\nhue = (hue % 360) + 1.5;\n```\n\nA quick explanation of how this works:\
    \ say our random `hue` is initialized to 350. The expression `hue % 360` will\
    \ return 350, because `350 / 360` is 0, with a remainder of 350. This works similarly\
    \ for every number in our range *except* 360, which returns 1 when divided by\
    \ itself and returns a remainder of 0. This is how it cycles back to the start\
    \ of the range.\n\nNow that our loop is done, we can add one more line outside\
    \ it to ensure the content is centered. The result should resemble Figure [6-6](#538894_1_En_6_Chapter.xhtml#Fig6).\n\
    \n![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig6_HTML.png)\n\nAn abstract\
    \ presents a square-shaped structure, which has a cluster of faded quadratic curves,\
    \ against a dark background.\n\n**Figure 6-6** Quadratic curves in a slinky formation\n\
    \n```\nslinky.moveTo(500, 500);\n```\n\n# Elliptical Arcs\n\nTime to embark on\
    \ the arc! The elliptical arc curve (Figure [6-7](#538894_1_En_6_Chapter.xhtml#Fig7))\
    \ is a complicated beast, and the syntax is quite difficult to comprehend without\
    \ some visual examples. The `A` (or `a`) command is used to initialize it, and\
    \ it is followed by no less than seven arguments.\n\n```\n// Syntax for the A/a\
    \ command.\n'A [rx ry rotation large-arc-flag sweep-flag x y] ...'\n'a [rx ry\
    \ rotation large-arc-flag sweep-flag dx dy] ...'\n```\n\nThe first two arguments\
    \ and the last two arguments aren't anything we haven't encountered before: `rx`\
    \ and `ry` refer to the radii of the x and y axes, and the final `x` and `y` arguments\
    \ define the curve's destination point. The `rotation` defines the angle of rotation\
    \ along the x axis, and the `large-arc-flag` and `sweep-flag` are both booleans\
    \ in numeric form, `0` meaning `false` and `1` meaning `true`. What they do though\
    \ takes a little explaining.\n\n![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig7_HTML.png)\n\
    \nAn abstract presents a square-shaped structure, which has a half circle with\
    \ two endpoints, against a dark background.\n\n**Figure 6-7** An elliptical arc\
    \ curve\n\n## Setting the Flags\n\nWhat's really happening when we draw an elliptical\
    \ arc curve is that two interlocking ellipses are used as guides behind the scenes\
    \ to determine which of the many possible paths are actually drawn. With the `large-arc-flag`\
    \ set to `1`, a large arc will be chosen. And with the `sweep-flag` set to `1`,\
    \ the arc will be drawn in a clockwise direction. Let's take a look at Figure\
    \ [6-8](#538894_1_En_6_Chapter.xhtml#Fig8), in which four possible permutations\
    \ of these flags are shown.\n\n![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig8_HTML.png)\n\
    \nAn abstract presents a square-shaped structure with two circles one on another,\
    \ rotating in a clockwise direction, against a dark background.\n\n**Figure 6-8**\
    \ Four possible arcs\n\n- In the uppermost path, the `large-arc-flag` and `sweep-flag`\
    \ are both set to `1`.\n- In the second path down, the `large-arc-flag` is set\
    \ to `0` and the `sweep-flag` is set to `1`.\n- In the third path down, the `large-arc-flag`\
    \ and the `sweep-flag` are both set to `0`.\n- In the lowermost path, the `large-arc-flag`\
    \ is set to `1` and the `sweep-flag` is set to `0`.\n\nIn practice, you'll only\
    \ ever see one of these arcs rendered on screen. However, it helps us understand\
    \ the underlying structure of the elliptical arc when we see all the possible\
    \ curves rendered simultaneously.\n\n## Irregular Radii\n\nOne of the other potential\
    \ confusions about the elliptical arc curve is that the two radius values `rx`\
    \ and `ry` work a little differently to how we might expect. Normally, a radius\
    \ would directly determine the size of an elliptical shape. In the case of the\
    \ elliptical arc curve, the size is actually determined by a number of factors\
    \ that work in conjunction, and the `rx` and `ry` values are only one part of\
    \ the equation.\n\nYou'll sometimes find, for instance, that the interlocking\
    \ ellipses that form the basis of the possible curves coincide; that is, they\
    \ are superimposed on one another. You'll know this is the case if setting the\
    \ `large-arc-flag` to either a `0` or a `1` makes no difference to the final result.\
    \ This can happen when the two radius values and the distance between the curve\
    \ start and end points are in a certain proportion to each other.\n\nIt might\
    \ therefore be easier to think of the `rx` and `ry` values as ratios that influence\
    \ the shape of the arc than as values that directly determine the arc's magnitude\
    \ (this is especially true when using smaller radii values). Don't worry if this\
    \ doesn't make much sense – it's quite counterintuitive at first and only becomes\
    \ clearer with experimentation.\n\nAnd to aid in this experimentation and hopefully\
    \ make the elliptical arc curve a little more accessible, I've created an interactive\
    \ pen that shows the effect of altering both the radii and the flag values. You\
    \ can find the pen at [`davidmatthew.ie/generative-art-javascript-svg#arc-curve`](https://davidmatthew.ie/generative-art-javascript-svg#arc-curve)."
