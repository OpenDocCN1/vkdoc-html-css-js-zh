- fmt: '# 运算符优先级与比较符


    在此，值得提及运算符优先级规则，它决定了运算执行的顺序。助记词 BEMDAS可以帮助我们理解。


    - **B**括号：括号或圆括号内的内容最先计算。

    - **E**指数：接下来计算指数。

    - **M**乘法和**D**除法：然后是乘法和除法。这两者具有相同优先级，因此按书写顺序（即从左到右）计算。

    - **A**加法和**S**减法：对剩余数字进行加法和减法。与乘法和除法一样，这两者优先级相同，且从左到右计算。


    ```

    // 这些求和表达式看起来相似，但结果不同。

    4 / 2 * 2 + 4

    -> 8

    4 / 2 * (2 + 4)

    -> 12

    4 / 2 ** 2 + 4

    -> 5

    ```


    如有疑问，请使用括号对运算进行分组。这也可以提高可读性。


    # 比较运算符


    顾名思义，比较运算符对值进行比较。它们始终返回一个布尔值，即`true`或`false`值。


    - `<`是“小于”运算符。

    - `<=`是“小于或等于”运算符。

    - `>`是“大于”运算符。

    - `>=`是“大于或等于”运算符。

    - `==`是“等于”运算符。

    - `===`是“严格等于”运算符。


    由于 JavaScript 工作方式存在一些微妙的特性，我建议坚持使用严格版本的相等运算符。这可以减少意外（即bug）。


    ```

    // 比较运算符的一些示例。

    1 > 2

    -> false

    2  true

    3  true

    5 == "5"

    -> true // 但实际上并非如此。

    5 === "5"

    -> false // 这样才更准确。

    ```


    # 逻辑运算符


    最后，还有逻辑运算符：与（`&&`）、或（`||`）和非（`!`）。它们模拟了经典逻辑中的合取、析取和否定。


    当使用`&&`连接两个条件时，当且仅当两个条件都为`true`时，结果才为`true`。


    ```

    true && false

    -> false

    false && true

    -> false

    true && true

    -> true

    ```


    使用析取（即“或”的正式说法）时，首先要确保在键盘上使用正确的字符。`|`字符既不是大写字母`I`也不是小写字母`L`；它被称为管道符。根据你的区域键盘布局，它可能位于回车键或Shift键附近。


    当使用`||`时，如果一个或两个条件为`true`，则结果为`true`。如果我们记住我们实际上是在询问计算机“这些条件中至少有一个为真吗？”，那么这在直觉上是合理的。


    ```

    true || false

    -> true

    false || true

    -> true

    false || false

    -> false

    ```


    最后，我们还有否定运算符`!`。它会“翻转”紧随其后的条件。它还可以与相等运算符独特地结合，表示“不等于”（`!==`）。


    ```

    !true

    -> false

    !false

    -> true

    1 !== 2

    -> true

    !(2 > 1)

    -> false

    ```


    新手程序员常见的一个错误是使用单个管道符`|`或单个`&`而不是两个组合。单独使用这些字符会执行位运算（即操作二进制值），这仅适用于高级编程。


    # 条件语句


    现在我们掌握了比较运算符和逻辑运算符，可以继续学习条件语句了。JavaScript中的条件语句允许我们影响程序的控制流。打个比方，想象一下四向交叉路口高峰期的交通，人行道上挤满了行人。没有某种控制交通流的方式，就会一片混乱。这时就需要条件语句，例如可能支撑交通灯系统的各种规则。


    ```

    // 基本语法。

    if (conditionIsTrue) {

    // ... 运行一些代码

    }

    // 一个简单的行人过马路条件语句。

    if (pedestrianBtnIsPressed) {

    wait(30s);

    activateRedLights();

    wait(3s);

    activateGreenManSignal();

    }

    ```


    对于基本的`if`语句，我们还可以附加`else`和`else if`条件。


    ```

    if (a > b) {

    doThis();

    } else if (a === b) {

    doThat();

    } else {

    doOtherThing();

    }

    ```


    如果给定的条件不为真，则花括号内的代码不会被执行。让我们以之前的例子为例，为`a`和`b`填充值。


    ```

    let a = 3;

    let b = 4;

    if (a > b) {

    doThis(); // 条件不成立，因此此代码不运行。

    } else if (a === b) {

    doThat(); // 此代码也不运行。

    } else {

    doOtherThing(); // 以上两个条件均为假，因此运行此代码。

    }

    ```


    我想介绍的最后一个条件形式是三元运算符。顾名思义，它严格来说是一个运算符，但由于它扮演了条件检查的角色，我觉得将其放在这里更合适。


    ```

    // 三元运算符的基本结构。

    conditionA ? expressionIfTrue : expressionIfFalse;

    ```


    在上述结构中，我们询问“`conditionA`是否为真？如果是，则运行`expressionIfTrue`。否则，运行`expressionIfFalse`。”


    三元运算符最适合用于当你希望根据某个条件是否成立来为变量赋值时。如果该条件不成立，则为其分配一个不同的值。这正是我在第一个生成式草图中使用它的方式：


    ```

    const svgSize = window.innerWidth > window.innerHeight ?

    window.innerHeight : window.innerWidth;

    ```


    这里，我们在说“如果窗口的`innerWidth`大于其`innerHeight`，则将`innerHeight`赋值给`svgSize`。否则，将`innerWidth`赋值给它。”


    # 循环


    循环是程序员的一项超能力。我们说的是开天辟地的力量。或者，至少是能够让你的程序螺旋式奔向无穷的能力，可能会冻结任何打开的浏览器窗口，并使你的 CPU 风扇疯狂旋转。这是因为循环可以一遍又一遍地重复代码块，次数不限，或者根据需要无限进行。然而，通常明智的做法是为循环行为设置一个限制（无限循环更多时候是一种错误而非目标）。我们通过所谓的终止条件来设置循环的限制，即告诉循环何时停止的条件。


    这里我们将介绍两种主要的循环：`while`循环和`for`循环。


    ## While 循环


    `while`循环是两者中较简单的一种。其基本结构如下：


    ```

    while (condition === true) {

    // 当条件为真时在此处运行代码。

    }

    ```


    现在，如果所讨论的条件始终评估为`true`，那将导致无限循环。因此，任何循环结构中的一个重要成分是一个在循环运行时发生变化的值。这通常是一个递增或递减的数字，被称为迭代器。按照惯例，`i`通常用作变量名。


    ```

    // 设置迭代器。

    let i = 0;

    while (i <= 99) {

    // 将 i 的值写入浏览器控制台。

    console.log(i);

    // 每次循环运行时将 i 增加 1。

    i = i + 1;

    }

    ```


    上述循环将运行 100 次，从 0 开始，直到小于或等于 99 为止，并且在每次迭代中，它会将`i`的值记录到浏览器控制台。如果省略了递增`i`的代码，它将无限循环下去。


    值得一提的是，现在有一些简写方式来递增和递减——或者实际上乘法和除法——变量值：


    ```

    // 长方式。

    i = i + 1

    i = i * 2

    i = i – 1

    i = i / 2

    // 较短方式。

    i += 1

    i *= 2

    i -= 1

    i /= 2

    // 更短方式（仅适用于加1或减1）。

    i++

    i--

    ```


    简写表示法是你实际编程中可能遇到的，因此我们在这里继续使用它。


    ## For 循环


    `for`循环使用与我们的示例`while`循环相同的逻辑，但将迭代器和递增操作合并到一行中。其典型结构如下：


    ```

    for (let i = startingNumber; i < upperLimit; i += increment) {

    // 当 i 小于 upperLimit 时运行一些代码。

    }

    ```'
  raw: "At this point, it’s worth mentioning rules of precedence, which\ndetermine\
    \ the order in which operations are carried out. The mnemonic\nBEMDAS can help\
    \ us out here.\n\n*   **B**rackets: Whatever is in brackets or parentheses\n \
    \   is evaluated first.\n\n*   **E**xponents: Evaluate any exponents next.\n\n\
    *   **M**ultiplication and **D**ivision:\n    Next, multipliers and divisors.\
    \ These two have equal precedence, so they\n    are evaluated in the order they\
    \ are written, i.e., left to\n    right.\n\n*   **A**ddition and **S**ubtraction:\
    \ Add\n    and subtract any remaining numbers. As with multiplication and\n  \
    \  division, these have equal precedence and are evaluated left to\n    right.\n\
    \n```\n// These sums look similar but result in different answers.\n4 / 2 * 2\
    \ + 4\n-> 8\n4 / 2 * (2 + 4)\n-> 12\n4 / 2 ** 2 + 4\n-> 5\n```\n\nWhen in doubt,\
    \ use parentheses to group operations. This can also\nimprove readability.\n\n\
    Comparison Operators\n\nAs the name suggests, comparison operators\ncompare values.\
    \ They always return a boolean, that is, a `true` or `false` value.\n\n*   `<`\
    \ is\n    the “less than” operator.\n\n*   `<=` is\n    the “less than or equal\
    \ to” operator.\n\n*   `>` is\n    the “more than” operator.\n\n*   `>=` is\n\
    \    the “more than or equal to” operator.\n\n*   `==` is\n    the “equal to”\
    \ operator.\n\n*   `===` is\n    the “strictly equal to” operator.\n\nBecause\
    \ of some subtle quirks with how JavaScript works, I would\nrecommend sticking\
    \ with the strict versions of the equality operators.\nThis can reduce unexpected\
    \ surprises (i.e., bugs).\n\n```\n// Some examples of comparison operators in\
    \ action.\n1 > 2\n-> false\n2  true\n3  true\n5 == \"5\"\n-> true // but not really.\n\
    5 === \"5\"\n-> false // that's more like it.\n```\n\nLogical Operators\nLastly,\
    \ there are the logical operators *and* ( `&&` ),\n*or* ( `||` ), and\n*not* (\
    \ `!` ). These emulate\nthe conjunction, disjunction, and negation of classical\
    \ logic.\n\nWhen conjoining two conditions with `&&`, the\nresult is true if and\
    \ only if both conditions are true.\n\n```\ntrue && false\n-> false\nfalse &&\
    \ true\n-> false\ntrue && true\n-> true\n```\n\nWhen using the disjunction (fancy\
    \ word for *or*), first make\nsure you use the right characters on your keyboard.\
    \ The `|` character is not a\ncapital *i* or lowercase *L*; it’s what’s known\
    \ as the\npipe character. Depending on your regional keyboard layout, it might\
    \ be\nlocated near either your Enter key or your Shift key.\n\nWhen using `||`,\n\
    the result is true if one or both conditions are true. This makes\nintuitive sense\
    \ if we remember that we are essentially asking the\ncomputer “is at least one\
    \ of these conditions true?”\n\n```\ntrue || false\n-> true\nfalse || true\n->\
    \ true\nfalse || false\n-> false\n```\n\nFinally, we have the negation operator\
    \ `!`. This “flips” the\ncondition immediately following it. It can also be uniquely\
    \ coupled with\nthe equality operator to mean not equal to ( `!==` ).\n\n```\n\
    !true\n-> false\n!false\n-> true\n1 !== 2\n-> true\n!(2 > 1)\n-> false\n```\n\n\
    A common source of error for new programmers is using a single pipe\ncharacter\
    \ `|` or\na single ampersand `&` instead of the\ntwo together. By themselves,\
    \ these characters perform bitwise\noperations (i.e., they manipulate binary values)\
    \ and are for advanced\nprogramming only.\n\nConditional Statements\n\nNow that\
    \ we have comparative and logical operators under our belt, we\ncan proceed to\
    \ conditionals. A\nconditional statement in JavaScript\nallows us to influence\
    \ a program’s control flow. As an analogy, think of\nrush hour traffic at a four-way\
    \ intersection, the pavements packed with\npedestrians. Without some way to control\
    \ the flow of traffic, mayhem\nwould ensue. Here is where conditionals are needed,\
    \ such as the various\nrules that might underpin a traffic light system.\n\n```\n\
    // The basic syntax.\nif (conditionIsTrue) {\n// ... run some code\n}\n// A simplistic\
    \ pedestrian crossing conditional.\nif (pedestrianBtnIsPressed) {\nwait(30s);\n\
    activateRedLights();\nwait(3s);\nactivateGreenManSignal();\n}\n```\n\nTo the basic\
    \ `if`\nstatement, we can append `else` and `else if` conditions\ntoo.\n\n```\n\
    if (a > b) {\ndoThis();\n} else if (a === b) {\ndoThat();\n} else {\ndoOtherThing();\n\
    }\n```\n\nIf a given condition isn’t true, the code inside its curly braces\n\
    doesn’t get executed. Let’s take the preceding example again, with the\nvalues\
    \ filled in for `a` and `b`.\n\n```\nlet a = 3;\nlet b = 4;\nif (a > b) {\ndoThis();\
    \ // condition wasn't true, so this code doesn't run.\n} else if (a === b) {\n\
    doThat(); // this code also doesn't run.\n} else {\ndoOtherThing(); // both the\
    \ above are false, so this code runs.\n}\n```\n\nThe last conditional form I want\
    \ to cover is the ternary operator. As\nits name suggests, it is technically an\
    \ operator, but because it plays\nthe role of a conditional check, I felt it was\
    \ more appropriate to\ninclude it here.\n\n```\n// The basic structure of the\
    \ ternary operator.\nconditionA ? expressionIfTrue : expressionIfFalse;\n```\n\
    \nIn the aforementioned, we’re asking “Is `conditionA` true? If\nso, run `expressionIfTrue`.\n\
    Otherwise, run `expressionIfFalse`.”\n\nThe ternary operator is best used\nwhen\
    \ you want to assign a value to a variable based on whether a certain\ncondition\
    \ holds true. If that condition doesn’t hold true, we then\nassign it a different\
    \ value. This is exactly what I used it for in our\nfirst generative sketch:\n\
    \n```\nconst svgSize = window.innerWidth > window.innerHeight ?\nwindow.innerHeight\
    \ : window.innerWidth;\n```\n\nHere, we’re saying “If the window’s `innerWidth`\
    \ is greater\nthan its `innerHeight`, assign\nthe `innerHeight`\nto `svgSize`.\n\
    Otherwise, assign to it the `innerWidth`.”\n\nLoops\nLoops are one of a\nprogrammer’s\
    \ superpowers. We’re talking sea-parting, earth-splitting\npowers. Or, at the\
    \ very least, the ability to send your programs\nspiralling toward infinity, potentially\
    \ freezing any open browser\nwindows and spinning your CPU fan into a frenzy.\n\
    This is because loops can repeat blocks of code over and over, as\nmany times\
    \ as we want, or indefinitely if needed. However, it’s usually\nwise to set a\
    \ limit to looping behavior (infinite loops are more often\nan error than an aim).\
    \ We set a limit to a loop with what’s called a\nterminating condition, that is,\
    \ a condition that tells the loop when to\nstop.\nWe’ll cover two main kinds of\
    \ loops here: the `while` loop and the\n`for` loop.\n\nThe While Loop\n\nThe `while`\
    \ loop\nis the simpler of the two. It’s basic structure is as follows:\n\n```\n\
    while (condition === true) {\n// run code here while condition is true.\n}\n```\n\
    \nNow, if the condition in question *always* evaluates to `true`, that would lead\n\
    to an infinite loop. An important ingredient therefore in any looping\nstructure\
    \ is a value that changes while the loop is running. This is\nnormally a number\
    \ that either increments or decrements and is known as\nan iterator. By convention,\
