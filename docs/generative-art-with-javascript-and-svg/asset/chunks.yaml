- fmt: '# Displacement


    One filter primitive that works particularly well alongside `feTurbulence` is
    `feDisplacementMap`. This primitive allows us to distort the first input, `in`,
    using values from the second input, `in2`. This second input acts as the map from
    which we can derive the displacement values, that is, the values that decide how
    much distortion we should apply along the x and y axes. This means that we could
    use the output from `feTurbulence` to distort our `SourceGraphic` by feeding both
    through `feDisplacementMap`.


    Besides the aforementioned `in` and `in2`, the `feDisplacementMap` primitive has
    three other attributes: the first is `scale`, which determines how much distortion
    to apply (i.e., to what extent is `in` distorted by `in2`). The other two attributes,
    `xChannelSelector` and `yChannelSelector`, allow us to specify which channels
    are responsible for horizontal and vertical displacement. They accept values of
    `R`, `G`, `B`, or `A`, representing the three color channels along with the alpha
    channel. If we take a single color channel, `R`, as an example, its value can
    range from 0 to 255. Values below 127 result in negative displacement (they’re
    shifted left along the x axis, or up along the y axis), whereas values above 127
    result in positive displacement (shifted to the right along the x axis, or down
    along the y axis).


    In Figure [8-8](#538894_1_En_8_Chapter.xhtml#Fig8), the output of an `feTurbulence`
    primitive (center) is used as the map to displace the source graphic (left), resulting
    in some soft wave-like distortion (right).


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig8_HTML.png)


    An illustration depicts a cluster of shaded squares added with the square in a
    turbulence pattern, which produces a cluster of squares in a wavy pattern.


    **Figure 8-8** Using turbulence as a displacement map source


    # Creating a Cosmic Bubble


    This next example will piece together several of the filter primitives we’ve covered
    so far and apply it to the simplest of source graphics: the circle. Our aim will
    be to create something a little “cosmic” by compositing together some turbulence,
    blur, and distortion.


    First things first, make a copy of our template folder and rename it to `22-hubble-bubble`
    (or another name of your choice). In the usual spot below the background, let’s
    set up our source graphic in the center of the `viewBox`, randomizing its radius
    a little.


    ```

    // Create the source graphic.

    svg.create(''circle'').set({

    cx: 500,

    cy: 500,

    r: Gen.random(250, 350),

    fill: ''#000'',

    filter: ''url(#cosmic)''

    });

    ```


    You’ll notice we’ve referenced our filter already but haven’t yet created it.
    Normally the order of our created elements matters; if we create one circle and
    then another, the latter will be rendered “above” the former in a layer-like manner.
    But as filters are created within a `defs` element, it’s ok to define them after
    the element to which they apply. To recap, anything that lives inside the `defs`
    element isn’t directly rendered but must be referenced.


    In the next step, we’ll create the filter (ensuring the `id` matches the reference
    to `#cosmic`), and add the first filter primitive to the chain: `feTurbulence`.
    We’ll randomize the seed, keep the dial low on the `baseFrequency`, and crank
    up the `numOctaves` to `4`, to bring out some of the texture details.


    ```

    // Initialise the filter.

    let filter = svg.createFilter(''cosmic'');

    // Create a random amount of turbulence.

    filter.create(''feTurbulence'').set({

    type: ''fractalNoise'',

    baseFrequency: Gen.random(0.002, 0.006, true),

    seed: Gen.random(0, 10000),

    numOctaves: 4,

    stitchTiles: ''stitch'',

    result: ''turbulence''

    });

    ```


    Like `feFlood`, `feTurbulence` is a generator primitive that doesn’t require any
    input; it generates its own output directly. The result of this is that once we
    initialize an `feTurbulence` primitive as the latest (or only) link in the filter
    chain, it will simply flood the filter region with its output (which is what you’ll
    see if you run the code at this point). We’ll use `feComposite` to fix this later.


    In our next step, we’ll create a target region to displace (i.e., apply distortion
    to). To create this target area, what we’ll do is soften the edges of the source
    graphic (the circle) using an `feGaussianBlur`; this has the effect of introducing
    some transparency to the circle’s perimeter. This area of receding transparency
    (another way of describing a blur) will be what we use to apply distortion to
    our turbulence. Figure [8-8](#538894_1_En_8_Chapter.xhtml#Fig8) shows the result
    of using turbulence as a displacement map source; this time around we’ll be doing
    the reverse and using turbulence as the displacement map destination. The blurred
    area of our circle will instead be our displacement map source. Here’s how to
    set up this up (with some randomness mixed in).


    ```

    // Blur the edges of the source graphic.

    filter.create(''feGaussianBlur'').set({

    stdDeviation: Gen.random(10, 25), in: ''SourceGraphic'',

    result: ''blurred''

    });

    // Displace the turbulence with the blurred edge of the circle.

    filter.create(''feDisplacementMap'').set({

    in: ''turbulence'',

    in2: ''blurred'',

    scale: Gen.random(250, 500),

    result: ''distortion''

    });

    ```


    This results in a rim of displaced noise, as shown in Figure [8-9](#538894_1_En_8_Chapter.xhtml#Fig9).
    Note that we’ve omitted the `xChannelSelector` and `yChannelSelector` attributes
    of `feDisplacementMap`; these both default to the alpha channel, which is fine
    in our case.


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig9_HTML.png)


    An abstract presents a square, which has a circle with blurred edges, in a gradient
    of colors. The background has a gradient of colors as well.


    **Figure 8-9** Displacement using the blurred edge of a circle


    We’re not fully done yet; as a final step, I want to cut away everything beyond
    the perimeter of the blurred region. The solution to this is to composite together
    the outputs of `feDisplacementMap` and `feGaussianBlur` using the `atop` operator.
    We should then have something that resembles Figure [8-10](#538894_1_En_8_Chapter.xhtml#Fig10),
    our Hubble Bubble.


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig10_HTML.png)


    An abstract presents a square, which has a circle in the center with blurred edges,
    in a gradient of colors, against a dark background.


    **Figure 8-10** One possible iteration of the Hubble Bubble sketch


    ```

    // Remove everything beyond the blurred perimeter.

    filter.create(''feComposite'').set({

    in: ''distortion'',

    in2: ''blurred'',

    operator: ''atop''

    });

    ```


    # Lighting and Texture


    Despite SVG being, by definition, a format for two-dimensional vector graphics,
    among its filter primitives, you’ll find two lighting effects: `feDiffuseLighting`
    and `feSpecularLighting`. Normally the domain of three-dimensional graphics, lighting
    typically requires a z-axis component to operate so that surfaces or other objects
    that protrude in space, that is, have depth, can catch the light cast by the source.
    SVG coordinate space is devoid of any such third dimension or z axis, so how exactly
    does lighting function in such an environment? The answer is that the z axis is
    simulated by using “bump” maps. Specifically, `feDiffuseLighting` and `feSpecularLighting`
    both interpret the alpha channel of their connected inputs as a bump map source.
    A bump map is just what it sounds like, a map of bumps, meaning any raised regions
    of a surface, like slopes, peaks, folds, and wrinkles.'
  raw: 'Displacement

    One filter primitive that works particularly well alongside `feTurbulence` is
    `feDisplacementMap`.

    This primitive allows us to distort the first input, `in`, using values from

    the second input,

    `in2`. This

    second input acts as the map from which we can derive the displacement

    values, that is, the values that decide how much distortion we should

    apply along the x and y axes. This means that we could use the output

    from `feTurbulence` to

    distort our `SourceGraphic` by

    feeding both through `feDisplacementMap`.

    Besides the aforementioned `in` and `in2`, the `feDisplacementMap`

    primitive has three other attributes: the first is `scale`, which

    determines how much distortion to apply (i.e., to what extent is `in` distorted
    by `in2`). The other two

    attributes, `xChannelSelector` and

    `yChannelSelector`,

    allow us to specify which channels are responsible for horizontal and

    vertical displacement. They

    accept values of `R`, `G`, `B`, or `A`, representing the

    three color channels along with the alpha channel.

    If we take a single color channel, `R`, as an example, its

    value can range from 0 to 255\. Values below 127 result in negative

    displacement (they’re shifted left along the x axis, or up along the y

    axis), whereas values above 127 result in positive displacement (shifted

    to the right along the x axis, or down along the y axis).


    In Figure [8-8](#538894_1_En_8_Chapter.xhtml#Fig8), the output of

    an `feTurbulence`

    primitive (center) is used as the map to displace the source graphic

    (left), resulting in some soft wave-like distortion (right).


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig8_HTML.png)


    An illustration depicts a cluster of shaded squares added with the

    square in a turbulence pattern, which produces a cluster of squares in a

    wavy pattern.


    Figure 8-8

    Using turbulence as a displacement map source


    Creating a Cosmic Bubble

    This next example will piece together several of the filter

    primitives we’ve covered so far and apply

    it to the simplest of source graphics: the circle. Our aim will be to

    create something a little “cosmic” by compositing together some

    turbulence, blur, and distortion.


    First things first, make a copy of our template folder and rename it to

    `22-hubble-bubble` (or

    another name of your choice). In the usual spot below the background,

    let’s set up our source graphic in the center of the `viewBox`, randomizing

    its radius a little.


    ```

    // Create the source graphic.

    svg.create(''circle'').set({

    cx: 500,

    cy: 500,

    r: Gen.random(250, 350),

    fill: ''#000'',

    filter: ''url(#cosmic)''

    });

    ```


    You’ll notice we’ve referenced our filter already but haven’t yet

    created it. Normally the order of our created elements matters; if we

    create one circle and then another, the latter will be rendered “above”

    the former in a layer-like manner. But as filters are created within a

    `defs` element,

    it’s ok to define them after the element to which they apply. To recap,

    anything that lives inside the `defs` element isn’t

    directly rendered but must be referenced.


    In the next step, we’ll create the filter (ensuring the `id` matches the

    reference to `#cosmic`), and add the

    first filter primitive to the chain: `feTurbulence`. We’ll

    randomize the seed, keep the dial low on the `baseFrequency`, and

    crank up the `numOctaves` to `4`, to bring out some

    of the texture details.


    ```

    // Initialise the filter.

    let filter = svg.createFilter(''cosmic'');

    // Create a random amount of turbulence.

    filter.create(''feTurbulence'').set({

    type: ''fractalNoise'',

    baseFrequency: Gen.random(0.002, 0.006, true),

    seed: Gen.random(0, 10000),

    numOctaves: 4,

    stitchTiles: ''stitch'',

    result: ''turbulence''

    });

    ```


    Like `feFlood`, `feTurbulence` is a

    generator primitive that doesn’t require any input; it generates its own

    output directly. The result of this is that once we initialize an `feTurbulence`

    primitive as the latest (or only) link in the filter chain, it will

    simply flood the filter region with its output (which is what you’ll see

    if you run the code at this point). We’ll use `feComposite` to fix

    this later.


    In our next step, we’ll create a target region to displace (i.e., apply

    distortion to). To create this target area, what we’ll do is soften the

    edges of the source graphic (the circle) using an `feGaussianBlur`; this

    has the effect of introducing some transparency to the circle’s

    perimeter. This area of receding transparency (another way of describing

    a blur) will be what we use to apply distortion to our turbulence.

    Figure [8-8](#538894_1_En_8_Chapter.xhtml#Fig8) shows the result

    of using turbulence as a displacement map source; this time around

    we’ll be doing the reverse and using turbulence as the displacement map

    destination. The blurred area of our circle will instead be our

    displacement map source. Here’s how to set up this up (with some

    randomness mixed in).


    ```

    // Blur the edges of the source graphic.

    filter.create(''feGaussianBlur'').set({

    stdDeviation: Gen.random(10, 25), in: ''SourceGraphic'',

    result: ''blurred''

    });

    // Displace the turbulence with the blurred edge of the circle.

    filter.create(''feDisplacementMap'').set({

    in: ''turbulence'',

    in2: ''blurred'',

    scale: Gen.random(250, 500),

    result: ''distortion''

    });

    ```


    This results in a rim of displaced noise, as shown in Figure [8-9](#538894_1_En_8_Chapter.xhtml#Fig9).
    Note that we’ve

    omitted the `xChannelSelector` and

    `yChannelSelector`

    attributes of `feDisplacementMap`;

    these both default to the alpha channel, which is fine in our case.


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig9_HTML.png)


    An abstract presents a square, which has a circle with blurred edges,

    in a gradient of colors. The background has a gradient of colors as

    well.


    Figure 8-9

    Displacement using the blurred edge of a circle


    We’re not fully done yet; as a final step, I want to cut away everything

    beyond the perimeter of the blurred

    region. The solution to this is to composite together the outputs of

    `feDisplacementMap` and

    `feGaussianBlur`

    using the `atop`

    operator. We should then have something that resembles Figure [8-10](#538894_1_En_8_Chapter.xhtml#Fig10),
    our Hubble

    Bubble.


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig10_HTML.png)


    An abstract presents a square, which has a circle in the center with

    blurred edges, in a gradient of colors, against a dark background.


    Figure 8-10

    One possible iteration of the Hubble Bubble sketch


    ```

    // Remove everything beyond the blurred perimeter.

    filter.create(''feComposite'').set({

    in: ''distortion'',

    in2: ''blurred'',

    operator: ''atop''

    });

    ```


    Lighting and Texture

    Despite SVG being, by definition, a format for two-dimensional vector

    graphics, among its filter primitives, you’ll find two lighting effects:

    `feDiffuseLighting` and

    `feSpecularLighting`.

    Normally the domain of three-dimensional graphics, lighting typically

    requires a z-axis component to operate so that surfaces or other objects

    that protrude in space, that is, have depth, can catch the light cast by

    the source. SVG coordinate space is devoid of any such third dimension

    or z axis, so how exactly does lighting function in such an

    environment?

    The answer is that the z axis is simulated by using “bump” maps.

    Specifically, `feDiffuseLighting` and

    `feSpecularLighting`

    both interpret the alpha channel of their connected inputs as a bump map

    source. A bump map

    is just what it sounds like, a map of bumps, meaning any raised regions

    of a surface, like slopes, peaks, folds, and wrinkles.'
  trans: '

    # 位移


    一个能与 `feTurbulence` 配合得特别好的滤镜图元是 `feDisplacementMap`。这个图元允许我们利用第二个输入 `in2` 的值来扭曲第一个输入
    `in`。第二个输入充当了映射，我们可以从中推导出位移值，也就是决定沿 x 轴和 y 轴施加多少扭曲程度的值。这意味着，我们可以使用 `feTurbulence`
    的输出，通过将两者放入 `feDisplacementMap` 来扭曲我们的 `SourceGraphic`。


    除了前面提到的 `in` 和 `in2` 之外，`feDisplacementMap` 图元还有另外三个属性：第一个是 `scale`，它决定了要施加的扭曲程度（即
    `in` 被 `in2` 扭曲的程度）。另外两个属性 `xChannelSelector` 和 `yChannelSelector` 允许我们指定哪个通道负责水平位移和垂直位移。它们接受
    `R`、`G`、`B` 或 `A` 作为值，分别代表三个颜色通道以及 alpha 通道。以单个颜色通道 `R` 为例，其值范围可以从 0 到 255。低于
    127 的值会产生负向位移（沿 x 轴向左移动，或沿 y 轴向上移动），而高于 127 的值则会产生正向位移（沿 x 轴向右移动，或沿 y 轴向下移动）。


    在图 8-8 中，一个 `feTurbulence` 图元（中间）的输出被用作映射，以位移源图形（左侧），产生了一些柔和的波浪状扭曲（右侧）。


    ![](img/538894_1_En_8_Fig8_HTML.png)


    一幅插图展示了一簇带阴影的正方形，并添加了一个处于湍流图案中的正方形，从而产生了一簇呈波浪状排列的正方形。


    **图 8-8** 使用湍流作为位移映射源


    # 创建宇宙气泡


    下一个示例将把我们已经介绍过的几个滤镜图元组合在一起，并将其应用于最简单的源图形：圆形。我们的目标是通过合成一些湍流、模糊和扭曲效果，创造出一点“宇宙”感。


    首先，复制我们的模板文件夹，并将其重命名为 `22-hubble-bubble`（或你选择的其他名称）。在背景下方通常的位置，让我们将源图形设置在 `viewBox`
    的中心，并对其半径进行一些随机化处理。


    ```

    // 创建源图形。

    svg.create(''circle'').set({

    cx: 500,

    cy: 500,

    r: Gen.random(250, 350),

    fill: ''#000'',

    filter: ''url(#cosmic)''

    });

    ```


    你会注意到我们已经引用了滤镜，但尚未创建它。通常我们创建元素的顺序很重要；如果我们先创建一个圆形，再创建另一个，后者会像图层一样被渲染到前者“上方”。但由于滤镜是在
    `defs` 元素内创建的，因此可以在应用滤镜的元素之后定义它们。回顾一下，`defs` 元素内的任何内容都不会被直接渲染，而必须被引用。


    下一步，我们将创建这个滤镜（确保 `id` 与对 `#cosmic` 的引用匹配），并在滤镜链中添加第一个图元：`feTurbulence`。我们将随机化种子，将
    `baseFrequency` 调低，并将 `numOctaves` 增加到 `4`，以突出一些纹理细节。


    ```

    // 初始化滤镜。

    let filter = svg.createFilter(''cosmic'');

    // 创建随机的湍流量。

    filter.create(''feTurbulence'').set({

    type: ''fractalNoise'',

    baseFrequency: Gen.random(0.002, 0.006, true),

    seed: Gen.random(0, 10000),

    numOctaves: 4,

    stitchTiles: ''stitch'',

    result: ''turbulence''

    });

    ```


    与 `feFlood` 一样，`feTurbulence` 是一个生成器图元，它不需要任何输入；它直接生成自己的输出。结果是，一旦我们将 `feTurbulence`
    图元初始化为滤镜链中最新的（或唯一的）环节，它就会用其输出完全充斥整个滤镜区域（如果你此时运行代码，就会看到这个效果）。稍后我们将使用 `feComposite`
    来解决这个问题。


    下一步，我们将创建一个要位移（即施加扭曲）的目标区域。为了创建这个目标区域，我们要做的是使用 `feGaussianBlur` 来柔化源图形（圆形）的边缘；这会在圆形的周边引入一些透明度。这个透明度递减的区域（模糊的另一种描述方式）将是我们用来对湍流施加扭曲的部分。图
    8-8 展示了使用湍流作为位移映射源的结果；而这次我们将反过来，使用湍流作为位移映射的目标。我们圆形上的模糊区域将取而代之成为位移映射源。以下是设置方法（混合了一些随机性）。


    ```

    // 模糊源图形的边缘。

    filter.create(''feGaussianBlur'').set({

    stdDeviation: Gen.random(10, 25), in: ''SourceGraphic'',

    result: ''blurred''

    });

    // 用圆形的模糊边缘来位移湍流。

    filter.create(''feDisplacementMap'').set({

    in: ''turbulence'',

    in2: ''blurred'',

    scale: Gen.random(250, 500),

    result: ''distortion''

    });

    ```


    这会产生一圈位移后的噪点，如图 8-9 所示。请注意，我们省略了 `feDisplacementMap` 的 `xChannelSelector` 和 `yChannelSelector`
    属性；它们都默认为 alpha 通道，这对我们的情况来说没问题。


    ![](img/538894_1_En_8_Fig9_HTML.png)


    一幅抽象图展示了一个正方形，其中包含一个边缘模糊的圆形，呈现出多种颜色的渐变。背景也具有多种颜色的渐变。


    **图 8-9** 使用圆形模糊边缘进行位移


    我们还没有完全完成；作为最后一步，我想裁剪掉模糊区域边界之外的所有内容。解决方法是使用 `atop` 运算符，将 `feDisplacementMap` 和
    `feGaussianBlur` 的输出合成在一起。这样我们应该得到类似于图 8-10 的效果，即我们的哈勃气泡。


    ![](img/538894_1_En_8_Fig10_HTML.png)


    一幅抽象图展示了一个正方形，中心有一个边缘模糊的圆形，呈现出多种颜色的渐变，背景为深色。


    **图 8-10** 哈勃气泡草图的一种可能迭代


    ```

    // 移除模糊边界之外的所有内容。

    filter.create(''feComposite'').set({

    in: ''distortion'',

    in2: ''blurred'',

    operator: ''atop''

    });

    ```


    # 光照与纹理


    尽管 SVG 从定义上讲是一种用于二维矢量图形的格式，但在其滤镜图元中，你会发现两种光照效果：`feDiffuseLighting` 和 `feSpecularLighting`。通常属于三维图形领域的光照，需要
    z 轴分量才能运作，以便空间中凸出的表面或其他物体（即具有深度的物体）能够捕捉到光源投射的光线。SVG 的坐标空间没有任何这样的第三维度或 z 轴，那么光照在这样的环境中究竟是如何运作的呢？答案是
    z 轴是通过使用“凹凸”映射来模拟的。具体来说，`feDiffuseLighting` 和 `feSpecularLighting` 都将它们连接输入的 alpha
    通道解释为凹凸映射源。凹凸映射正如其名，是一张凹凸的映射图，指的是表面上任何凸起的区域，比如斜坡、峰顶、褶皱和纹理。

