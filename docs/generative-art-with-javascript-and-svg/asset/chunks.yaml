    ## Web 动画 API


    Web 动画 API，即 WAAPI，是我们即将介绍的方法中最现代的一种。W3C（万维网联盟）正在积极推动它的发展，旨在为 Web 动画提供未来方向。除了关键帧和时间选项，它还支持一些高级特性，比如控制播放速率、灵活的缓动功能、与滚动关联的时间线，以及为同一元素应用连续动画（或序列）的能力。


    元素可以通过一个命名直观的 `animate()` 方法实现动画，该方法接受两个参数。第一个参数定义关键帧，第二个参数定义时间选项。


    ```javascript

    element.animate(keyframes, options);

    ```


    关键帧可以以对象数组的形式提供，也可以是包含数组的对象。时间选项可以以单个值的形式提供 `–` 具体来说，是一个定义动画时长的毫秒整数 `–` 或是一个包含一个或多个时间相关属性的对象。假设我们要对一个圆的半径
    `r` 值进行动画。以下是使用两种语法格式实现此操作的方式：


    ```javascript

    // 关键帧的第一种格式。

    let keyframes = [

    { r: 25 },

    { r: 40 },

    { r: 25 }

    ];

    // 关键帧的第二种格式。

    let keyframes = {

    r: [25, 40, 25]

    };

    // 时间选项的第一种格式。

    let options = 2000; // 2 秒。

    // 时间选项的第二种格式。

    let options = {

    duration: 2000,

    iterations: Infinity,

    // ... 等等

    };

    ```


    在大多数情况下，我更喜欢第二种关键帧格式，因为它更简洁。在实现旋转和缩放示例之前，还有一点需要指出：关键帧之间的间距（或偏移）方式。使用 CSS 关键帧时，我们需要通过百分比值或
    `from` 和 `to` 指令来明确声明关键帧何时触发。使用 Web 动画 API 时，如果没有明确声明，动画的偏移量是*推断*出来的。如果我们有三个关键帧，它们将自动按
    0、0.5 和 1 的顺序间隔分布（相当于 CSS 中的 0%、50% 和 100%）。但如果需要，我们可以自定义偏移量。在以下示例中，第二个关键帧将在 0.75
    处触发，而不是默认的 0.5。


    ```javascript

    // 明确指定偏移量。

    let keyframes = {

    r: [25, 40, 25],

    offset: [0, 0.75, 1]

    };

    ```


    现在让我们回到示例中，使用 WAAPI 方法实现第三个形状的旋转和缩放。在 SMIL 实现下方，按如下方式设置动画。


    ```javascript

    let keyframes = {

    transform: [

    ''rotate(0deg) scale(1, 1)'',

    ''rotate(180deg) scale(0.5, 1.5)'',

    ''rotate(360deg) scale(1, 1)''

    ]

    };

    let options = {

    duration: 5000,

    iterations: Infinity

    };

    shapes[2].animate(keyframes, options);

    ```


    现在，除了一个形状外，其他所有形状应该都在运动。注意 WAAPI 的关键帧语法与我们的 CSS 关键帧示例是多么相似；这并非偶然。Web 动画 API 本质上是对现有
    Web 动画标准的进一步发展和扩展，因此熟悉 CSS 动画的 Web 开发者应该会觉得其语法直观且（大部分）与已有知识兼容。拥有一个原生的、高级的 JavaScript
