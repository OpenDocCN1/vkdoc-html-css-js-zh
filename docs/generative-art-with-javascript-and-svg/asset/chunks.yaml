  trans: '

    # 生成式弧线


    让我们暂且放下椭圆弧线曲线理论细节的纠缠，转而将它们用于一些实际、富有创意的用途。使用我们常用的复制方法，创建一个新的草图文件夹，并将其命名为类似 `15-generative-arcs`
    的名称。此草图的目标是创建两组弧线曲线：一组顺时针绘制，另一组镜像对称，逆时针绘制。我们将对多个关键变量进行随机化处理，以保持输出的独特性和难预测性。


    准备好后，在背景下方创建一个将包含我们弧线曲线的组。之后，我们将设置一些随机化变量，这些变量将在接下来的循环中使用。


    ```

    // 为我们的弧线曲线创建一个容器组。

    let arcs = svg.create(''g'');

    // 随机化一些变量。

    let rx = Gen.random(5, 350);

    let ry = Gen.random(5, 350);

    let hue = Gen.random(0, 360);

    ```


    接下来，我们将启动循环，该循环将运行 360 次。在循环内部，我们将随机化更多变量：弧线的 `rotation`（旋转角），这会使曲线向特定方向伸展；以及
    `large-arc-flag`（大弧标记），借助我们的 `Gen.chance()` 函数，它会有 50% 的概率为 `0` 或 `1`。


    ```

    for (let i = 0; i < 360; i += 1) {

    // 随机化旋转角和大弧标记。

    let rotation = Gen.random(0, 180);

    let largeArc = Gen.chance() ? 1 : 0;

    }

    ```


    接下来（仍在循环内）创建第一组顺时针弧线曲线。请记住，决定它们顺时针或逆时针绘制的是 `sweep-flag`（扫描标记），它是 `A` 命令的第五个参数。在这里，在我们的
    `largeArc` 变量之后，我们将 `sweep-flag` 设置为 `1`，表示顺时针。


    ```

    // 创建第一组顺时针弧线曲线 (sweep = 1)。

    arcs.create(''path'').set({

    fill: ''none'',

    stroke: `hsl(${hue} 75% 75% / 0.05)`,

    d: `M 275 500 A ${rx} ${ry} ${rotation} ${largeArc} 1 725 500`

    });

    ```


    第二组弧线曲线将完全相同，但有两个小改动。我们将 `sweep-flag` 设置为 `0`，使这组曲线逆时针绘制，并将 `hue` 偏移 `60`，只为颜色增加一点对比度。在关闭循环之前，我们将使用前面提到的取模运算符递增
    `hue`。


    ```

    // 创建第二组逆时针弧线曲线 (sweep = 0)。

    arcs.create(''path'').set({

    fill: ''none'',

    stroke: `hsl(${hue + 60} 75% 75% / 0.05)`,

    d: `M 275 500 A ${rx} ${ry} ${rotation} ${largeArc} 0 725 500`

    });

    // 递增色相值。

    hue = (hue % 360) + 0.5;

    ```


    如果你此时运行草图，你会看到一些变化丰富的生成式弧线（示例输出见图 6-9）。如果你想注入更多活力，可以在循环之后添加以下代码行：


    ![](img/538894_1_En_6_Fig9_HTML.png)


    一张抽象图，展示了一个矩形结构，其中有两个椭圆弧线，包含一组重叠的图层，背景为深色。


    **图 6-9** 我们生成式弧线的两次渲染


    ```

    // 应用随机旋转。

    arcs.rotate(Gen.random(0, 360));

    ```


    # 三次贝塞尔曲线


    我们将介绍的最终曲线是三次贝塞尔曲线，由 `C` 命令调用。这是所有可用矢量曲线中用途最广的，也是大多数矢量绘图和插图软件包中使用的主要曲线（通常化名为钢笔工具）。它有两组控制点，因此语法比二次贝塞尔曲线稍复杂些，但比椭圆弧线曲线更容易掌握。


    ```

    // C/c 命令的语法。

    ''C [cpx1 cpy1 cpx2 cpy2 x y] ...''

    ''c [dcpx1 dcpy1 dcpx2 dcpy2 dx dy] ...''

    ```


    ## 三次控制点


    第一组控制点坐标 `cpx1` 和 `cpy1` 从起始点一侧塑造曲线的形状。该起始点在 `C` 命令之前声明——例如，它可能是一组 `M` 坐标，或者是前一条曲线的终点。第二组控制点坐标
    `cpx2` 和 `cpy2` 塑造目标点处的曲线形状，该点由最后两个坐标 `x` 和 `y` 定义。示例如下：


    ```

    // 创建一条单次三次贝塞尔曲线。

    svg.create(''path'').set({

    d: ''M 75,75 C 140,330 360,330 425,75''

    });

    ```


    上述路径在图 6-10 中进行了说明，你可以看到初始的 `M` 点以黄色显示，而构成三次贝塞尔曲线本身的三个点以红色显示。彩色点和虚线仅用于说明目的；它们在最终的
    SVG 中不会被渲染。


    ![](img/538894_1_En_6_Fig10_HTML.png)


    一张抽象图，展示了一个方形结构，其中有一条向上的抛物线状曲线，其两个端点与带有两个端点的倾斜虚线相连。


    **图 6-10** 可视化控制点的三次贝塞尔曲线


    当连接在一起时，连续的三次贝塞尔曲线可以组合创建出任何可以想象到的 2D 形状。它们是矢量绘图程序中的基本元素，以至于有效运用它们本身已成为一门手艺。审慎地使用这些曲线及其“手柄”（图
    6-10 中可视化为虚线），可以区分出流畅优美的线条艺术与笨拙生硬的剪贴画。


    ## S 命令实现对称


    与二次贝塞尔曲线类似，如果你想用另一条与其平滑连接的曲线来扩展当前曲线，可以调用三次贝塞尔曲线的一个相关命令。用于此目的的命令是 `S`（相对值用 `s`）。`S`
    命令会自动生成一个对称控制点，该点镜像前一条曲线的控制点，因此允许我们省略第一组控制点坐标。


    ```

    // 使用 S 命令扩展三次贝塞尔曲线。

    svg.create(''path'').set({

    d: ''M 50,150 C 100,250 200,50 250,150 S 400,50 450,150''

    });

    ```


    在图 6-11 中，颜色最浅的虚线指示了 `S` 命令自动生成对称控制点的位置。


    ![](img/538894_1_En_6_Fig11_HTML.png)


    一张抽象图，展示了一个矩形结构，其中包含三次贝塞尔曲线，虚线指示了具有对称控制点的 `S` 命令。


    **图 6-11** 一条平滑扩展的三次贝塞尔曲线


    # 有机曲线


    让我们将前述知识运用到一个构图中，目标是创建一系列平滑的、看起来有机的曲线。为此，我们的老朋友 `Noise` 将为我们指引正确的方向。首先，像往常一样复制模板文件夹，将其命名为类似
    `16-organic-curves` 的名称。确保顶部有以下导入语句：


    ```

    import { SvJs, Gen, Noise } from ''../../node_modules/svjs/src/index.js'';

    ```


    然后是父级 SVG 和背景，之后我们将创建一些与噪声相关的变量。我在这里引入了一个名为 `amplifier` 的新变量；当我们把噪声值映射到一个新范围（可以说是增加其音量）时，将会用到它。


    ```

    // 噪声相关变量。

    let noise = new Noise();

    let n = Gen.random(0, 1000);

    let speed = 0.05;

    let amplifier = Gen.random(200, 500);

    ```


    接下来，我们将设置与颜色和曲线本身相关的变量，并将它们包含在一个组内。


    ```

    // 曲线和颜色相关变量。

    let curves = svg.create(''g'');

    let numCurves = Gen.random(75, 125);

    let hue = Gen.random(0, 360);

    ```

    '
- fmt: '# Grouping Variables and Creating Organic Curves


    It’s generally good practice to group your variables meaningfully in this manner,
    with some comments to add clarity. Otherwise when you later revisit your code,
    you might have a hard time working out your original intentions. You could go
    a step further and group them via objects (a technique outlined in Chapter [2](#538894_1_En_2_Chapter.xhtml)),
    but I won’t do that here.


    We’ll move on to the loop next, where we’ll first retrieve and then re-map our
    noise into a more fit-for-purpose range (using the aforementioned `amplifier`
    variable). Notice here that the range will span positive and negative values,
    so we won’t know the polarity in advance. In the case of our curves, this will
    help us mimic a more organic movement, as the values won’t always be uniformly
    offset from the original starting point, but wrap around them more naturally.
    Outside the loop, include the `moveTo()` method to center-align our curve group.


    ```

    for (let i = 0; i < numCurves; i += 1) {

    // Retrieve and map our noise value.

    let noiseValue = noise.get(n);

    noiseValue = Gen.map(noiseValue, -1, 1, -amplifier, amplifier, false);

    }

    curves.moveTo(500, 500);

    ```


    Next come the curve coordinates. For clarity, we’ll set variables for each command
    we call, to make the construction of the path data (or `d` string) less unwieldy.
    Continue with the following code, keeping it within the loop. The shape of the
    curve we’re aiming for isn’t too dissimilar to the one shown in Figure [6-10](#538894_1_En_6_Chapter.xhtml#Fig10).
    Other than that, the values provided are fairly arbitrary, so feel free to tweak
    them.


    ```

    // M command co-ordinates.

    let mx = 0;

    let my = 0 + (i * 5);

    // C command co-ordinates.

    let cpx1 = 0 + noiseValue;

    let cpy1 = -100;

    let cpx2 = 250 + noiseValue;

    let cpy2 = -100;

    let x2 = 300;

    let y2 = 0;

    // S command co-ordinates.

    let spx = 350 + noiseValue;

    let spy = 100;

    let x3 = 300;

    let y3 = -50;

    ```


    With the exception of the initial `M` command coordinates, we’re going to build
    out our curves using relative coordinates (i.e., we’ll feed the preceding curve
    variables to the `c` and `s` commands rather than to their uppercase brethren).
    These tend to work better in a loop setting, as they always remain in step with
    the most recent coordinate values. The only other point to note is that we’re
    being quite selective with which values are being modulated by our `noiseValue`
    variable, three out of a possible ten in this case. Sometimes subtlety works best,
    but again, feel free to experiment here.


    With our variables in place, it’s time to create the curve itself. I’ll introduce
    a new technique here with regard to the use of template literal syntax. In previous
    sketches, we’ve been opening and closing our braces `${}` for each variable. When
    these variables follow one after the other however, we can actually embed them
    all at once as an array.


    ```

    // Create the organic curve.

    curves.create(''path'').set({

    fill: ''none'',

    stroke: `hsl(${hue} 80% 80% / 0.8)`,

    d: `M ${[mx, my]}

    c ${[cpx1, cpy1, cpx2, cpy2, x2, y2]}

    s ${[spx, spy, x3, y3]}`

    });

    ```


    If you run the sketch at this point, you’ll see a series of curves alright, but
    their shape and color will remain uniform throughout. We haven’t yet incremented
    our noise coordinate value – a vital step, but one all too easy to forget (I’ve
    omitted this line numerous times myself, leading to many a head-scratching moment).
    We’ll take care of this step next and also increase the hue while we’re at it,
    modulating it slightly via the `noiseValue` variable. As a final flourish, we’ll
    throw in some randomized “bubbles” (see Figure [6-12](#538894_1_En_6_Chapter.xhtml#Fig12)).
    Don’t ask me why.


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig12_HTML.png)


    An abstract presents a square-shaped structure, which has a series of overlapped
    cubic bezier curves with random bubbles, against a dark background.


    **Figure 6-12** Noise-modulated organic curves


    ```

    // Increment the noise and hue.

    n += speed;

    hue = (hue % 360) + (noiseValue / 25);

    // 10% chance of spawning a ''bubble''.

    if (Gen.chance(10)) {

    svg.create(''circle'').set({

    r: Gen.random(5, 50),

    cx: Gen.random(150, 850),

    cy: Gen.random(150, 850),

    fill: `hsl(0 0% 100% / 0.1)`,

    stroke: ''#888''

    });

    }

    ```


    ## An Easier Option


    Having to juggle six coordinates for every curve segment (or four when we use
    the `S` command) can get a little trying at times. Wouldn’t it be nice to be able
    to connect a series of single points with a smooth curve, without having to worry
    about all those extra control points?


    Glad you asked! SvJs comes equipped with a method called `createCurve()` that
    can do just this. Under the hood, it harnesses the power of the cubic Bezier curve
    but abstracts away the control points so that constructing a curve is a less intimidating
    affair. This does sacrifice a large degree of control, but in some cases, we may
    not need the level of fine-tuning that the manual curve commands offer. With the
    `createCurve()` method, all we need to worry about are the points.


    ```

    // The syntax of the createCurve() method.

    createCurve(pointsArray, [curveFactor]);

    ```


    In crude terms, we can think of this as a join-the-dots method, the main difference
    being that we need to supply the dots rather than do the joining. The first argument,
    `pointsArray`, is, as the name suggests, an array of `[x, y]` coordinate pairs.
    It can be supplied as either a standard one-dimensional array or as a two-dimensional
    array (i.e., an array of arrays).


    ```

    // A one-dimensional array of points.

    let points1D = [25, 30, 45, 20, 80, 10, 90, 40];

    // A two-dimensional array of the same points.

    let points2D = [

    [25, 30], [45, 20], [80, 10], [90, 40]

    ];

    ```


    The `curveFactor` argument allows us to modify the tension between the points.
    At a value of `0`, the points are connected by a straight line. At a value of
    `1` (the default), the tension is looser and the curve much smoother. In general,
    the most usable results lie in the range of `0` to `2`; stray too far beyond that
    and the underlying control points will overlap and create some truly chaotic squiggles.
    On certain occasions though, this may be what you want.


    In Figure [6-13](#538894_1_En_6_Chapter.xhtml#Fig13), we can see the aforementioned
    `curveFactor` values in action. The uppermost curve is set to `0`, the middle
    curve to `1`, and the bottom curve to `5`. The faint dots indicate where our `pointsArray`
    coordinates are positioned and are shown for illustrative purposes only; you wouldn’t
    see these rendered normally.


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig13_HTML.png)


    An abstract presents a rectangular-shaped structure, which has three different
    curves with several peaks and troughs, against a dark background.


    **Figure 6-13** Varying the curve factor using values of 0, 1, and 5


    ## Summary


    With paths now a part of your generative arsenal, so many more possibilities open
    up for you. To recap, we’ve covered the following:


    * The path data (`d`) string format and the flexibility and economies it offers.

    * The difference between absolute and relative path commands

    * The `L`, `V`, and `H` straight-line commands

    * The `Q` and `T` quadratic Bezier curve commands.

    * What control points are and how to harness them

    * The elliptical arc curve command `A` and its complex array of arguments

    * The `C` and `S` cubic Bezier curve commands

    * Using noise and randomness to shape curves

    * The SvJs `createCurve()` method


    In the next chapter, we’ll explore motion, animation, and how to make our sketches
    interactive.


    ## 7. Motion and Interactivity'
