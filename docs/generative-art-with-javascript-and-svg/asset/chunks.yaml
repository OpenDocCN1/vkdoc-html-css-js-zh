    # 运算符优先级与比较符


    在此，值得提及运算符优先级规则，它决定了运算执行的顺序。助记词 **BEMDAS** 可以帮助我们理解。


    - **B** 括号：括号或圆括号内的内容最先计算。

    - **E** 指数：接下来计算指数。

    - **M** 乘法和 **D** 除法：然后是乘法和除法。这两者具有相同优先级，因此按书写顺序（即从左到右）计算。

    - **A** 加法和 **S** 减法：对剩余数字进行加法和减法。与乘法和除法一样，这两者优先级相同，且从左到右计算。


    ```

    // 这些求和表达式看起来相似，但结果不同。

    4 / 2 * 2 + 4

    -> 8

    4 / 2 * (2 + 4)

    -> 12

    4 / 2 ** 2 + 4

    -> 5

    ```


    如有疑问，请使用括号对运算进行分组。这也可以提高可读性。


    # 比较运算符


    顾名思义，比较运算符对值进行比较。它们始终返回一个布尔值，即 `true` 或 `false` 值。


    - `<` 是“小于”运算符。

    - `<=` 是“小于或等于”运算符。

    - `>` 是“大于”运算符。

    - `>=` 是“大于或等于”运算符。

    - `==` 是“等于”运算符。

    - `===` 是“严格等于”运算符。


    由于 JavaScript 工作方式存在一些微妙的特性，我建议坚持使用严格版本的相等运算符。这可以减少意外（即 bug）。


    ```

    // 比较运算符的一些示例。

    1 > 2

    -> false

    2 < 3

    -> true

    3 >= 3

    -> true

    5 == "5"

    -> true // 但实际上并非如此。

    5 === "5"

    -> false // 这样才更准确。

    ```


    # 逻辑运算符


    最后，还有逻辑运算符：与（`&&`）、或（`||`）和非（`!`）。它们模拟了经典逻辑中的合取、析取和否定。


    当使用 `&&` 连接两个条件时，当且仅当两个条件都为 `true` 时，结果才为 `true`。


    ```

    true && false

    -> false

    false && true

    -> false

    true && true

    -> true

    ```


    使用析取（即“或”的正式说法）时，首先要确保在键盘上使用正确的字符。`|` 字符既不是大写字母 `I` 也不是小写字母 `L`；它被称为管道符。根据你的区域键盘布局，它可能位于回车键或
    Shift 键附近。


    当使用 `||` 时，如果一个或两个条件为 `true`，则结果为 `true`。如果我们记住我们实际上是在询问计算机“这些条件中至少有一个为真吗？”，那么这在直觉上是合理的。


    ```

    true || false

    -> true

    false || true

    -> true

    false || false

    -> false

    ```


    最后，我们还有否定运算符 `!`。它会“翻转”紧随其后的条件。它还可以与相等运算符独特地结合，表示“不等于”（`!==`）。


    ```

    !true

    -> false

    !false

    -> true

    1 !== 2

    -> true

    !(2 > 1)

    -> false

    ```


    新手程序员常见的一个错误是使用单个管道符 `|` 或单个 `&` 而不是两个组合。单独使用这些字符会执行位运算（即操作二进制值），这仅适用于高级编程。


    # 条件语句


    现在我们掌握了比较运算符和逻辑运算符，可以继续学习条件语句了。JavaScript 中的条件语句允许我们影响程序的控制流。打个比方，想象一下四向交叉路口高峰期的交通，人行道上挤满了行人。没有某种控制交通流的方式，就会一片混乱。这时就需要条件语句，例如可能支撑交通灯系统的各种规则。


    ```

    // 基本语法。

    if (conditionIsTrue) {

    // ... 运行一些代码

    }

    // 一个简单的行人过马路条件语句。

    if (pedestrianBtnIsPressed) {

    wait(30s);

    activateRedLights();

    wait(3s);

    activateGreenManSignal();

    }

    ```


    对于基本的 `if` 语句，我们还可以附加 `else` 和 `else if` 条件。


    ```

    if (a > b) {

    doThis();

    } else if (a === b) {

    doThat();

    } else {

    doOtherThing();

    }

    ```


    如果给定的条件不为真，则花括号内的代码不会被执行。让我们以之前的例子为例，为 `a` 和 `b` 填充值。


    ```

    let a = 3;

    let b = 4;

    if (a > b) {

    doThis(); // 条件不成立，因此此代码不运行。

    } else if (a === b) {

    doThat(); // 此代码也不运行。

    } else {

    doOtherThing(); // 以上两个条件均为假，因此运行此代码。

    }

    ```


    我想介绍的最后一个条件形式是三元运算符。顾名思义，它严格来说是一个运算符，但由于它扮演了条件检查的角色，我觉得将其放在这里更合适。


    ```

    // 三元运算符的基本结构。

    conditionA ? expressionIfTrue : expressionIfFalse;

    ```


    在上述结构中，我们询问“`conditionA` 是否为真？如果是，则运行 `expressionIfTrue`。否则，运行 `expressionIfFalse`。”


    三元运算符最适合用于当你希望根据某个条件是否成立来为变量赋值时。如果该条件不成立，则为其分配一个不同的值。这正是我在第一个生成式草图中使用它的方式：


    ```

    const svgSize = window.innerWidth > window.innerHeight ?

    window.innerHeight : window.innerWidth;

    ```


    这里，我们在说“如果窗口的 `innerWidth` 大于其 `innerHeight`，则将 `innerHeight` 赋值给 `svgSize`。否则，将
    `innerWidth` 赋值给它。”


    # 循环


    循环是程序员的一项超能力。我们说的是开天辟地的力量。或者，至少是能够让你的程序螺旋式奔向无穷的能力，可能会冻结任何打开的浏览器窗口，并使你的 CPU 风扇疯狂旋转。这是因为循环可以一遍又一遍地重复代码块，次数不限，或者根据需要无限进行。然而，通常明智的做法是为循环行为设置一个限制（无限循环更多时候是一种错误而非目标）。我们通过所谓的终止条件来设置循环的限制，即告诉循环何时停止的条件。


    这里我们将介绍两种主要的循环：`while` 循环和 `for` 循环。


    ## While 循环


    `while` 循环是两者中较简单的一种。其基本结构如下：


    ```

    while (condition === true) {

    // 当条件为真时在此处运行代码。

    }

    ```


    现在，如果所讨论的条件始终评估为 `true`，那将导致无限循环。因此，任何循环结构中的一个重要成分是一个在循环运行时发生变化的值。这通常是一个递增或递减的数字，被称为迭代器。按照惯例，`i`
    通常用作变量名。


    ```

    // 设置迭代器。

    let i = 0;

    while (i <= 99) {

    // 将 i 的值写入浏览器控制台。

    console.log(i);

    // 每次循环运行时将 i 增加 1。

    i = i + 1;

    }

    ```


    上述循环将运行 100 次，从 0 开始，直到小于或等于 99 为止，并且在每次迭代中，它会将 `i` 的值记录到浏览器控制台。如果省略了递增 `i` 的代码，它将无限循环下去。


    值得一提的是，现在有一些简写方式来递增和递减——或者实际上乘法和除法——变量值：


    ```

    // 长方式。

    i = i + 1

    i = i * 2

    i = i – 1

    i = i / 2

    // 较短方式。

    i += 1

    i *= 2

    i -= 1

    i /= 2

    // 更短方式（仅适用于加 1 或减 1）。

    i++

    i--

    ```


    简写表示法是你实际编程中可能遇到的，因此我们在这里继续使用它。


    ## For 循环


    `for` 循环使用与我们的示例 `while` 循环相同的逻辑，但将迭代器和递增操作合并到一行中。其典型结构如下：


    ```

    for (let i = startingNumber; i < upperLimit; i += increment) {

    // 当 i 小于 upperLimit 时运行一些代码。

    }

    ```

    '
- fmt: '`for`循环结构简洁地分为三个部分。我们首先初始化迭代器，然后设置终止条件，最后决定如何变化迭代器。以下是之前示例的`for`循环版本，我们在每次迭代中将`i`的值记录到浏览器控制台。


    ```

    for (let i = 0; i <= 99; i++) {

    console.log(i);

    }

    ```


    你不一定总是递增迭代器。只需稍作调整，就可以轻松反转循环，使其从99向下计数到0。


    ```

    for (let i = 99; i >= 0; i--) {

    console.log(i);

    }

    ```


    在`for`循环体中，经常将迭代器的值与其他变量结合使用，以实现某些动态结果。例如，在我们开篇的生成式草图中，我使用`i`逐步增加每个椭圆的`radiusX`和`radiusY`。


    ```

    // 运行一个循环（随机次数）来创建我们的椭圆。

    for (let i = 0; i < randomised.iterations; i += 1) {

    // ... 代码。

    let radiusX = 100 + (i * 3);

    let radiusY = 300 + (i * 2);

    // ... 更多代码。

    }

    ```


    关于循环，还有更多值得喜爱的地方，并且也存在其他变体（例如`for in`、`for of`和`forEach`，我们将在后面介绍），但就生成式艺术而言，我们主要会使用标准的`for`循环。


    ## 函数


    函数对于JavaScript这门语言来说是基础，并且可能是我们在本章中将介绍的最重要的概念。函数是执行特定任务的独立代码块。该任务在函数体中定义，其范围可能从将两个数字相加到启动火箭发射序列。


    标准函数使用`function`关键字定义，后跟您为其指定的名称，然后附加圆括号以及定义任务的开闭花括号。


    ```

    // 标准函数的基本语法。

    function peformSomeTask() {

    // ... 定义任务的代码。

    }

    ```


    ### 函数参数


    尽管函数用途广泛，但它们的主要目的是使代码可复用。实现这一点的一种方法是向函数添加参数，这些参数在函数名称的圆括号内定义。


    ```

    // 带参数的函数。

    function sayHello(name) {

    // 用爱尔兰方式向用户打招呼。

    console.log(`Howaya ${name}, what''s the craic?`);

    }

    ```


    函数可以显式返回值，也可以不返回。如果返回值，则只允许一个返回值。在前面的例子中，没有返回值，因为那不是该函数的目的（或者从技术上讲，如果查询该函数，将返回`undefined`值）。然而，在下面的例子中，我们专门希望从函数中获取一个返回值，这时我们就使用`return`关键字。


    ```

    // 另一个带参数的函数，这次返回一个值。

    function squareNumber(number) {

    return number * number;

    }

    ```


    当调用上面的函数时，它会`return`我们想要的结果，即我们提供的数字的平方。但我们实际上如何在实际中做到这一点呢？


    ### 调用函数


    要使用我们定义的函数，我们需要调用它。这等同于执行或运行该函数。可以这样做：


    ```

    // 调用一个函数。

    performSomeTask();

    ```


    要调用在其定义中包含参数的函数，我们需要为其提供实参。实参是我们在调用函数时赋予函数的实际值。而形参则是我们定义这些值的方式。让我们看看如何调用带实参的函数。


    ```

    sayHello(''Dave'');

    -> "Howaya Dave, what''s the craic?"

    console.log(squareNumber(4));

    -> 16

    ```


    在这里，我们为第一个函数提供了实参`''Dave''`，为第二个函数提供了实参`4`，并得到了预期的输出。但如果我们在调用函数时忘记了实参，会发生什么？让我们试一下。


    ```

    sayHello();

    -> "Howaya undefined, what''s the craic?"

    squareNumber();

    -> NaN

    ```'
  raw: 'The `for` loop structure is succinctly

    divided into three sections. We first initialize the iterator, then set

    the terminating condition, and then

    decide how we’re going to vary the iterator. Here’s the `for` loop version of

    our previous example, where we logged the value of `i` to the browser

    console on each iteration.


    ```

    for (let i = 0; i <= 99; i++) {

    console.log(i);

    }

    ```


    You don’t always have to increment the iterator. You can just as easily

    reverse the loop and have it count down from 99 to 0 by making a few

    tweaks.


    ```

    for (let i = 99; i >= 0; i--) {

    console.log(i);

    }

    ```


    It is common to use the value of the iterator in the body of the `for` loop in

    combination with other variables to achieve some dynamic result. In our

    opening generative sketch for example, I used `i` to progressively

    increase the `radiusX` and `radiusY` of each

    ellipse.


    ```

    // Run a loop (a randomised number of times) to create our ellipses.

    for (let i = 0; i < randomised.iterations; i += 1) {

    // ... code.

    let radiusX = 100 + (i * 3);

    let radiusY = 300 + (i * 2);

    // ... more code.

    }

    ```


    There’s lots more to love about loops, and

    other variations also exist (such as the `for in`, the `for of`, and the `forEach`
    which we’ll

    cover later), but for the purposes of generative art, we’ll be mainly

    utilizing the standard `for` loop.


    Functions

    Functions are fundamental to JavaScript as a language and are perhaps

    the single most important concept we’ll cover in this chapter. Functions

    are self-contained blocks of code that perform a particular task. The

    task is defined in the function body, and it might range from adding two

    numbers together to initiating a rocket launch sequence.


    Standard functions

    are defined using the `function` keyword

    followed by the name you give it, which is then appended with

    parentheses and opening and closing curly braces where the task is

    defined.


    ```

    // Basic syntax of a standard function.

    function peformSomeTask() {

    // ... code defining the task.

    }

    ```


    Function Parameters


    Although functions are used in a wide variety of ways, their primary

    purpose is to make

    code reusable. One way to do this is to add parameters to the function,

    which are defined within the parentheses of the function name.


    ```

    // A function with parameters.

    function sayHello(name) {

    // Greet the user the Irish way.

    console.log(`Howaya ${name}, what''s the craic?`);

    }

    ```


    Functions may or may not explicitly return a value, and if they do, only

    one return value is allowed. In the

    preceding example, a value isn’t returned, as that isn’t the purpose of

    the function (or to get technical about it, an `undefined` value would

    be returned if the function was queried). In the following example,

    however, we are specifically looking to get a value returned from the

    function, and this is where we use the `return` keyword.


    ```

    // Another function with parameters, this time returning a value.

    function squareNumber(number) {

    return number * number;

    }

    ```


    The preceding function, when called, will `return` the result

    we’re looking for, that is, the square of the number we supply it. But

    how do we actually do this in practice?


    Invoking Functions


    To use a function we’ve defined, we need to invoke it. This is

    synonymous with calling or executing the function.

    It can be done like so:


    ```

    // Invoking a function.

    performSomeTask();

    ```


    To invoke a function that has parameters as part of its definition, we

    supply it with arguments. Arguments are the actual values we give the

    function when we invoke it. The parameters, on the other hand, are how

    we define these values. Let’s see how we might invoke a function with

    arguments.


    ```

    sayHello(''Dave'');

    -> "Howaya Dave, what''s the craic?"

    console.log(squareNumber(4));

    -> 16

    ```


