    \nHow can a number equal a string? Well, it can’t. JavaScript is casting\nthe\
    \ string as a number to make sense of the expression. It is\nessentially coercing\
    \ the string data into number data (also known as\ntype coercion). That’s why\
    \ we’re always better off using the strict\nequality operator in JavaScript, something\
    \ that doesn’t exist in many\nother languages.\n\n```\n1 === \"1\";\n-> false\n\
    ```\n\nThis kind of casting also occurs when we try to add numbers to strings,\n\
    but it works in the opposite direction; the numbers in this case are\nconverted\
    \ to strings.\n\n```\n1 + \"2\";\n-> \"12\"\n\"2\" + 3;\n-> \"23\"\n```\n\nTo\
    \ avoid the pitfalls of this kind of implicit type coercion,\nfunctions like `parseInt()`,\
    \ `parseFloat()`, and\n`toString()` can\nbe used to re-cast or explicitly convert\
    \ variables to the data type you\nwant to work with.\n\nSemicolon Uncertainty\n\
    \nI mentioned at the start of the chapter that you can write JavaScript\nwithout\
    \ semicolons\nif you wish, but that in some edge cases, it can result in unexpected\n\
    behavior. Here’s one such edge case.\n\n```\nreturn\n1 + 2\n-> undefined\n```\n\
    \nSpacing doesn’t matter in JavaScript, so what is going on here? Why\nisn’t the\
    \ expression returning `3`? Well, here the\nAutomatic Semicolon Insertion feature\
    \ is being invoked under the hood.\nThe actual code being evaluated is this:\n\
    \n```\nreturn;\n1 + 2;\n```\n\nTo avoid this, either familiarize yourself with\
    \ such edge cases or\njust use semicolons.\n\nSummary\n\nWe’ve covered a lot in\
    \ this chapter:\n\n*   Basic rules of JavaScript syntax\n\n*   Values, such as\
    \ strings, numbers, and booleans\n\n*   Variables and the different ways to declare\
