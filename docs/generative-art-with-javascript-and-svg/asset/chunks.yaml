    \ methods and properties. The first is `Math.PI`, a property that returns the\
    \ approximated value of \U0001D745 (3.14), a mathematical constant that represents\
    \ the ratio of a circle’s circumference (the length along its perimeter) to its\
    \ diameter (double the radius). Figure [7-4](#538894_1_En_7_Chapter.xhtml#Fig4)\
    \ illustrates these values.\n\n![](images/538894_1_En_7_Chapter/538894_1_En_7_Fig4_HTML.png)\n\
    \nAn abstract presents a square-shaped structure, which has a circle with circumference,\
    \ radius, and diameters marked, against a dark background.\n\n**Figure 7-4** The\
    \ circumference, diameter, and radius of a circle\n\nYou may be accustomed to\
    \ angles being expressed in terms of degrees, but in JavaScript, angles are measured\
    \ in radians by default. One radian is equivalent to the length of a circle’s\
