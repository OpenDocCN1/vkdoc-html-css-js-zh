    \ the blur along the x axis and the second the blur\nalong the y axis.\n\n```\n\
    // Create a 'motion' blur effect.\nfilter.create('feGaussianBlur').set({ stdDeviation:\
    \ '20 0' });\n```\n\nShadows\nWe implemented a drop shadow earlier using\nthree\
    \ connected filter primitives, but there’s actually a much easier\nway to do this.\
    \ In a more recent revision of the SVG spec, the primitive\n`feDropShadow`\nwas\
    \ introduced, which can accept up to five attributes: `dx`, which defines the\n\
    shadow offset along the x axis; `dy`, which does the\nsame along the y axis; `stdDeviation`,\
    \ which\ncontrols the blurring of the shadow; and two more optional attributes,\n\
    `flood-colour`\nand `flood-opacity`, which\ncan modify the shadow’s color and\
    \ transparency."
  trans: "\n# 如何使用光标追踪制作交互式草图\n\n*   如何使用光标追踪制作交互式草图\n*   使用 CSS 关键帧进行动画\n*   使用 SMIL\
