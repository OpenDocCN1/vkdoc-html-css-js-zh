    # 图案


    与渐变类似，图案位于`defs`元素中，供后续引用，而非直接渲染。它们有自己的`viewport`（即宽度和高度）和可选的`viewBox`，这乍看可能有些复杂，但确实提供了更高的灵活性。你可以将`pattern`元素视为一个微型画布，它会在更大的图形元素上重复平铺，理解了这一点，这些设置的含义就清晰了。


    要创建一个图案，我们可以使用`createPattern()`快捷方法。与渐变方法类似，它会自动将自身追加到`defs`元素中，并在该元素不存在时自动创建。它还在底层以其他方式简化了图案的创建过程，你无需为此操心。该方法需要三个参数：图案的`id`、`width`和`height`。


    为了演示图案的工作原理，我们将快速创建一个草图——又是一个视错觉图，但这次的重点不在颜色上。请复制我们的`00-template`文件夹，并将其重命名为`05-optical-illusion`。


    在我们`sketch.js`文件的背景代码下方，创建一个`id`为''illusion''、宽度为`100`、高度为`200`的图案。


    ```

    // 创建我们的图案。

    const pattern = svg.createPattern(''illusion'', 100, 200);

    ```


    这仅仅初始化了我们的图案；我们还没有在其中放置任何内容，也没有创建要应用图案的形状。我们只有一个垂直矩形形状的图案。


    在这个草图的第一版迭代中，我将向你展示一个简单的图案是如何应用到形状上的。之后，我们会让图案内容变得更复杂。将以下代码添加到我们的草图中：


    ```

    // 在图案中创建一个白色矩形。

    pattern.create(''rect'').set({

    x: 10, y: 10, width: 80, height: 180, fill: ''#eee''

    });

    ```


    现在我们已经创建了简单的图案（由一个白色矩形组成），是时候将它应用到一个形状上了。为简单起见，我们将其应用到另一个与 SVG `viewBox` 大小相同的`rect`上，如下所示：


    ```

    // 将我们的图案应用到一个与 viewBox 大小相同的矩形上。

    svg.create(''rect'').set({

    x: 0, y: 0, width: 1000, height: 1000, fill: ''url(#illusion)''

    });

    ```


    你现在应该能看到类似于图 3-9 的效果。虽然不算特别有趣，但足以展示基本原理。


    ![](img/538894_1_En_3_Fig9_HTML.png)


    一个具有 10 列 5 行的网格状图案。


    **图 3-9** 一个基础图案


    在接下来的几个步骤中，我们将创建自己的视错觉图。首先，注释掉创建白色矩形图案的代码（但保留应用该图案的形状）。


    ```

    // 创建我们的图案。

    const pattern = svg.createPattern(''illusion'', 100, 200);

    // 在图案中创建一个白色矩形。

    // pattern.create(''rect'').set({

    //  x: 5, y: 5, width: 90, height: 190, fill: ''#eee''

    // });

    // 我们将在这里放置新代码。

    // 将我们的图案应用到一个与 viewBox 大小相同的矩形上。

    svg.create(''rect'').set({

    x: 0, y: 0, width: 1000, height: 1000, fill: ''url(#illusion)''

    });

    ```


    为了创建我们视错觉图的基础，总共需要八个矩形。其中四个是按特定顺序排列的白色正方形，另外四个是作为分隔线的细长灰色矩形。我们将使用几个`for`循环来创建它们。


    首先，创建白色正方形：


    ```

    // 在图案中创建 4 个白色正方形。

    for (let i = 0; i < 4; i += 1) {

    pattern.create(''rect'').set({

    x: (i === 3) ? 20: i * 20,

    y: i * 50,

    width: 50,

    height: 50,

    fill: ''#eee''

    });

    }

    ```


    其中的`width`、`height`和`fill`在每次迭代中只是重复自身；我们唯一变化的是`x`和`y`坐标。为此，我们利用了迭代器`i`不断变化的值。`y`坐标在每次循环中增加`50`，这很简单。定义`x`位置的表达式则稍微复杂一些。这里的意思是，我们希望`x`在每次迭代中增加`20`，*除了*最后一次（当`i
    === 3`时）。对于最后一次，我们希望将其设置为`20`。


    如果此时查看图案，应该会看到一个起伏的正方形阵列。这还不是一个视错觉图；它看起来更像是初级的像素艺术。为了完成错觉效果，我们需要分隔线。


    ```

    // 创建 4 个细长的灰色矩形来分隔正方形。

    for (let i = 0; i < 4; i += 1) {

    pattern.create(''rect'').set({

    x: 0,

    y: 45 + (i * 50),

    width: 100,

    height: 5,

    fill: ''#666''

    });

    }

    ```


    现在，当你保存文件时，应该能看到类似于图 3-10 的效果。


    ![](img/538894_1_En_3_Fig10_HTML.png)


    一个抽象图形，呈现了多个矩形以棋盘格图案排列，并呈锯齿状分布。


    **图 3-10** 一个产生视错觉效果的重复图案


    如果错觉效果成立，灰色线条看起来应该会略微倾斜，尤其是那些你视线没有直接聚焦的线条。希望这能让你感受到图案的强大之处！我们已经涉及了主要要点，但如果需要，它们还可以通过更多参数进行广泛的自定义。


    ## 分组与复用元素


    可以使用`g`元素对元素进行分组。这有多种用途。其一，像 Inkscape 这样的应用程序采用`g`元素来支持图层功能。其二，是为了进行变换（即同时移动、旋转或倾斜多个元素）而对元素进行分组。其三，仅仅是为了更好地组织
    SVG 而将项目分组在一起。


    ```

    // 创建一个圆形并将其添加到一个组中。

    const circle = svg.create(''circle'');

    const group = svg.create(''g'');

    circle.addTo(group);

    ```


    如果希望将元素分组以备将来复用（即仅在引用时才显示），则应使用`symbol`元素。与图案类似，符号可以拥有自己的`viewport`和`viewBox`。但它们是通`use`元素调用的，而不是应用到`fill`或`stroke`上。


    ```

    // 创建一个包含圆形和正方形的符号。

    const symbol = svg.create(''symbol'');

    symbol.set({ id: ''mySymbol'', width: 100, height: 100 });

    symbol.create(''circle'').set({ ... });

    symbol.create(''rect'').set({ ... });

    // 使用该符号三次，但改变其坐标。

    svg.create(''use'').set({ href: ''#mySymbol'', x: 0, y: 0 });

    svg.create(''use'').set({ href: ''#mySymbol'', x: 200, y: 200 });

    svg.create(''use'').set({ href: ''#mySymbol'', x: 400, y: 400 });

    ```


    在声明式上下文之外，符号并没有那么大的吸引力，因此在我们基于命令式的创作中不会依赖它们。但如果你想在 MDN 上进一步探索，那里还有很多内容可以挖掘。


    ## 总结


    回顾一下，我们在本章中涵盖了以下内容：


    - SvJs 库提供的核心函数

    - SVG `viewBox` 和 `viewport` 如何工作

    - 创建基础形状，如矩形、圆形、椭圆、折线以及多边形

    - 自定义`stroke`行为和外观

    - 处理文本和标题

    - 创建渐变和图案

    - 定义、分组和符号如何让我们复用元素并更好地构建 SVG 结构


    在下一章中，我们将探索如何将规律性与随机性结合，以创建真正具有生成性的构图。


    # 4. 随机性与规律性

    '
- fmt: "# 随机性：生成艺术的基石\n\n到目前为止，我们所有的草图（第一个除外）都缺少一种通常被认为是生成艺术流派基础的要素：即**随机性**。当我们放弃对草图结果的完全控制，并将某些元素交给机会决定时，这允许了变化、探索和*发现*。\n\
    \n在本章中，我们将学习如何随机化颜色、尺寸和坐标等参数；如何从预定义的数值范围和数组中随机选择；以及如何处理不同的概率分布。我们还将介绍一种流行的生成技术，该技术涉及构建规则网格并随机化其内容。然后，我们将学习如何将随机性应用于网格本身的构建，从而改变作品的基础结构。\n\
    \n## 模拟与数字的随机性\n\n将随机性融入艺术的技术早在数字时代之前就开始了。早在十五世纪，列奥纳多·达·芬奇就建议艺术家从充满随机和暗示性细节的来源中汲取灵感，例如在染色石头和肮脏墙壁表面发现的任意形状。像马克斯·恩斯特这样的艺术家非常认真地对待这样的提示；他的*摩擦法*技术源于将纸张随机放在充满划痕和刮痕的地板上，并从纹理上制作炭笔拓印。\n\
    \n恩斯特的同时代人，二十世纪初的超现实主义者，也在玩弄随机性。他们发展出一种称为**自动主义**的技术，旨在消除对作品执行过程的有意识控制，让机会和无意识成为主要的驱动力。\n\
    \n然而，这些例子都利用了模拟世界中发现的随机性。在数字这个更确定的世界里，1和0占据主导地位，真正的随机性更难找到。它必须被模拟。\n\n好消息是，这更多是一个学术观点而非实际障碍。模拟随机性（或在计算机科学领域被称为**伪随机性**）对于我们的需求来说已经足够了。而且，这也很容易证明，这要感谢\
    \ JavaScript 内置的 `Math.random()` 函数。在你的浏览器控制台中输入该函数并回车，应该足以让你确信它返回的17位浮点数不太可能在短期内重复。够随机了，对吧？\n\
    \n```\nMath.random();\n-> 0.32846662956382255\n```\n\n这个函数的局限性在于它只返回 0 到 1 之间的数字。诚然，我们可以轻松地将输出乘以任何我们想要的因子，但如果我们需要一个特定范围内的数字呢？或者想从数组中随机选择一个元素？\n\
    \n## SvJs 的 `Gen.random( )` 函数\n\n幸运的是，SvJs 库附带了一些额外功能：具体来说，是一个名为 `Gen` 的可选模块，其中包含许多对生成艺术家有用的函数。其中之一就是\
    \ `Gen.random()` 函数。\n\n要加载 `Gen` 模块，我们需要将其添加到草图顶部的导入语句中。修改模板草图，将其作为第一行（替换之前的导入语句）：\n\
    \n```\nimport { SvJs, Gen } from '../../node_modules/svjs/src/index.js';\n```\n\
    \n现在我们可以调用 `Gen.random()` 和任何其他 `Gen` 方法（我们将在后面介绍更多）。当不带任何参数调用时，`Gen.random()`\
    \ 的行为就像 `Math.random()`；它返回一个介于 `0` 和 `1` 之间的浮点数。\n\n```\nGen.random();\n-> 0.5682831319665758\n\
    ```\n\n然而，如果我们提供一些参数，它会突然变得更有用。以下是一些示例：\n\n```\n// 返回 50 到 100 之间的整数。\nGen.random(50,\
    \ 100);\n-> 87\n// 返回 10 到 20 之间的浮点数。\nGen.random(10, 20, true);\n-> 17.98188644344106\n\
    // 从数组中随机返回一个元素。\nlet rainbow = ['red', 'yellow', 'pink', 'green', 'purple', 'orange',\
    \ 'blue'];\nGen.random(rainbow);\n-> 'purple'\n```\n\n如你所见，如果我们提供两个数字，`Gen.random()`\
    \ 函数会将它们视为一个范围的下限和上限，并返回该范围内的一个数字。默认返回一个整数，但如果将第三个参数设置为 `true`，它将返回一个浮点数。如果我们完全不提供参数（如第一个示例），或者第一个和第二个参数之间的差值小于或等于\
    \ 1，它也会返回一个浮点数。\n\n如果我们传入一个数组作为唯一参数，则从该数组中随机选择一个元素。我特意在示例中使用了颜色（如果“Sing a Rainbow”这首歌在你脑海中挥之不去，我深表歉意），因为这个功能在从预定义调色板中选择颜色时特别有用。\n\
    \n## 无处不在的元素\n\n让我们创建一个草图，让 `Gen.random()` 发挥作用。像往常一样复制 `00-template` 文件，并将其重命名为类似\
    \ `06-elements-everywhere` 的名字。\n\n在我们的背景代码下方，初始化一个变量来存储随机迭代次数，这将决定我们的 `for` 循环（我们稍后将设置）将运行多少次。\n\
    \n```\nlet iterations = Gen.random(500, 1000);\n```\n\n我们的 `iterations` 将是一个介于\
    \ `500` 和 `1000` 之间的整数。有了这个，让我们编写循环。我们最初将保持简单，只用它来创建小圆圈。每个圆圈都会在 `viewBox` 的尺寸（`0`\
    \ 到 `1000`）内获得一个随机位置，其半径将在 `1` 到 `10` 之间。这应该会产生一个与油漆泼溅不太相似的效果（如图 [4-1](#538894_1_En_4_Chapter.xhtml#Fig1)\
    \ 所示）。\n\n![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig1_HTML.png)\n\n一幅抽象画呈现出一个黑色方块，里面有呈随机图案的深色圆圈簇。\n\
    \n**图 4-1**\n圆圈随机泼溅效果\n\n```\nfor (let i = 0; i < iterations; i += 1) {\n  svg.create('circle').set({\n\
    \    cx: Gen.random(0, 1000),\n    cy: Gen.random(0, 1000),\n    r: Gen.random(1,\
    \ 10)\n  });\n}\n```\n\n## 变化的颜色和不透明度\n\n此时，我们有无色的溅点随机地点缀在画布上。让我们通过改变 `fill` 的色相和不透明度来改变这一点。我们将使用\
    \ `hsl()` 函数来实现，这个函数我们以后会经常用到。它的语法如下：\n\n```\nhsl(hue saturation lightness / alpha)\n\
    ```\n\n色相可以是 `0` 到 `360` 之间的任何数字。饱和度和明度是百分比值，而 alpha 分量（决定不透明度）可以是百分比，也可以是 `0`\
    \ 到 `1` 之间的数字。\n\n在我们的循环中，在半径下方添加以下行（确保用逗号分隔这些行）：\n\n```\nfill: `hsl(${Gen.random(0,\
    \ 360)} 80% 80% / ${Gen.random(5, 40)}%)`\n```\n\n现在，我们的溅点变得生动了一些（见图 [4-2](#538894_1_En_4_Chapter.xhtml#Fig2)）。但是为什么要局限于圆圈呢？为什么不向组合中添加一些其他元素，让它看起来不那么像一个宇宙球池呢？在下一个版本的草图中，我们将精确地做到这一点。复杂度将显着增加，所以我们会慢慢地逐步讲解。\n\
    \n![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig2_HTML.png)\n\n一幅抽象画呈现出一个黑色方块，其中散布着具有渐变色和不同尺寸的点。\n\
    \n**图 4-2**\n色彩更丰富的溅点\n\n## 变化的元素选择\n\n在我们的 `iterations` 变量下面，创建一个名为 `elements`\
    \ 的数组，并用 `circle`、`line` 和 `rect` 填充它：\n\n```\nlet elements = ['circle', 'line',\
    \ 'rect'];\n```\n\n接下来，删除 `for` 循环中所有现有的代码，并将其替换为以下行，该行将从先前定义的 `elements` 数组中随机选择一个元素。\n\
    \n```\n// 随机选择一个元素。\nlet element = Gen.random(elements);\n```\n\n在下一步中，我们将使用随机值初始化一些变量，这些变量稍后可以应用于我们随机选择的元素。除了\
    \ `x`、`y` 和 `fill` 之外，我们还将改变 `stroke` 和 `stroke-width`。"
  raw: 'So far, all of our sketches (bar the first one) have lacked a certain

    ingredient usually considered foundational to the very genre of

    generative art: namely, randomness. When we surrender full control over

    the result of our sketches and leave certain elements to chance, it

    allows for variation, for exploration, and for *discovery*.

    In this chapter, we’ll learn how to randomize parameters like colors,

    sizes, and coordinates; how to randomly pick from predefined ranges and

    arrays; and how to work with different probability distributions. We’ll

    also cover a popular generative technique that involves constructing

    regular grids and randomizing their contents. We’ll then learn how to

    apply randomness to the construction of the grids themselves so that the

    underlying structure of our compositions can be varied.


    Analogue and Digital Randomness

    Techniques to incorporate randomness into art began

    long before the digital age. As far back as the fifteenth century,

    Leonardo da Vinci suggested that artists take inspiration from sources

    rich in random and suggestive detail, such as the arbitrary forms found

    on the surface of stained stones and dirty walls. Artists like Max Ernst

    took such prompts quite literally; his frottage technique was borne of

    dropping paper at random on floorboards full of scrapes and scratches

    and making charcoal rubbings from the textures.

    Contemporaries of Ernst, the early twentieth-century surrealists,

    also played with randomness. They developed a technique known as automatism, which
    aimed to

    eradicate full conscious control over an artwork’s execution, allowing

    chance and the unconscious to act as the primary driving forces.

    These examples, however, all draw upon the randomness found in the

    analogue world. In the more deterministic world of the digital, where

    ones and zeros reign, true randomness is harder to find. It must instead

    be simulated.


    The good news is that this is more of an academic point than a practical

    obstacle. Simulated randomness (or pseudo-randomness as it’s referred to

    in the field of computer science) is more than enough for our needs. And

    it’s very easy to demonstrate this too, thanks to JavaScript’s built-in

    `Math.random()`

    function. Typing the function into your browser console and hitting

    return should provide sufficient assurance that the 17-decimal

    floating-point number it throws back at you is unlikely to repeat itself

    anytime soon. Random enough, right?


    ```

    Math.random();

    -> 0.32846662956382255

    ```


    The limitation of this function is that it only returns a number

    between 0 and 1\. Granted, we can easily multiply the output by whatever

    factor we want, but what if we needed a number within a specific range?

    Or wanted to choose an item at random from an array?


    The SvJs Gen.random( ) Function

    Thankfully the SvJs library comes armed with some extras:

    specifically, an optional module called `Gen` that contains a

    number of useful functions for generative artists. One of these is the

    `Gen.random()`

    function.


    To load the `Gen`

    module, we need to add it to our import statement at the top of our

    sketches. Modify the template sketch to include this as the first line

    (replacing the previous import statement):


    ```

    import { SvJs, Gen } from ''../../node_modules/svjs/src/index.js'';

    ```


    Now we can call `Gen.random()` and any

    of the other `Gen` methods (more of

    which we’ll cover later). When called without any arguments, `Gen.random()` behaves

    just like `Math.random()`; it

    returns a floating-point number between `0` and `1`.


    ```

    Gen.random();

    -> 0.5682831319665758

    ```


    If, however, we supply some arguments, it suddenly becomes a lot more

    useful. Here are some examples:


    ```

    // Return an integer between 50 and 100.

    Gen.random(50, 100);

    -> 87

    // Return a floating point number between 10 and 20.

    Gen.random(10, 20, true);

    -> 17.98188644344106

    // Return a random item from an array.

    let rainbow = [''red'', ''yellow'', ''pink'', ''green'', ''purple'', ''orange'',
    ''blue''];

    Gen.random(rainbow);

    -> ''purple''

    ```


    As you can see, if we provide two numbers, the `Gen.random()` function will treat
    them as the

    lower and upper thresholds of a range and return a number within that

    range. An integer is returned by default, but if we set the third

    argument to `true`, it will return

    a floating-point number. It will also return a floating-point number if

    we supply no arguments at all (as in our first example), or if the

    difference between the first and second arguments is less than or equal

    to one.

    If we pass in an array as the sole argument, an item is randomly

    selected from that array. I purposely used colors in the example

    (apologies if the “Sing a Rainbow” song got stuck in your head), as this

    functionality is particularly useful when selecting colors from a

    predefined palette.


    Elements Everywhere All at Once

    Let’s create a sketch and put `Gen.random()` to work.

    Copy the `00-template` file as we usually do and

    rename it to something like `06-elements-everywhere`.


    Below our background code, initialize a variable to store a random

    iteration count, which will determine how many times our `for` loop (which we’ll

    set up after) will run.


    ```

    let iterations = Gen.random(500, 1000);

    ```


    Our `iterations`

    will be an integer anywhere between `500` and `1000`. With that in

    place, let’s write the loop. We’ll keep it simple initially and just use

    it to create small circles. Each circle will be given a random position

    within the dimensions of the `viewBox` (`0` to `1000`), and its radius

    will be between `1` and `10`. This should

    create an effect not too dissimilar to the spattering of paint

    (illustrated in Figure [4-1](#538894_1_En_4_Chapter.xhtml#Fig1)).


    ![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig1_HTML.png)


    An abstract presents a dark square with a cluster of dark circles in

    a random pattern.


    Figure 4-1

    A random spattering of circles


    ```

    for (let i = 0; i < iterations; i += 1) {

    svg.create(''circle'').set({

    cx: Gen.random(0, 1000),

    cy: Gen.random(0, 1000),

    r: Gen.random(1, 10)

    });

    }

    ```


    Varying Color and Opacity


    At this point, we have colorless spatters

    randomly speckling the canvas. Let’s change this up by varying the hue

    and opacity of the `fill`. We’ll do this

    with the `hsl()`

    function, which is something we’ll be drawing upon quite a lot. Its

    syntax is as follows:


    ```

    hsl(hue saturation lightness / alpha)

    ```


    The hue can be any number between `0` and `360`. The saturation

    and lightness are percentage values, and the alpha

    component (which determines the opacity) can be either a percentage or a

    number between `0` and `1`.


    In our loop, add the following line below the radius (making sure to

    separate the lines with a comma):


    ```

    fill: `hsl(${Gen.random(0, 360)} 80% 80% / ${Gen.random(5, 40)}%)`

    ```


    Now our speckles have come a little more to life (see Figure [4-2](#538894_1_En_4_Chapter.xhtml#Fig2)).
    But why stick

    to circles? Why not throw some other elements into the mix and make it

    look a little less like a cosmic ball pit? In the next version of the

    sketch, we’ll do precisely that. The complexity will ramp up

    considerably, so we’ll step through it slowly.


    ![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig2_HTML.png)


    An abstract presents a dark square with scattered dots in a gradient

    of colors and different sizes.


    Figure 4-2

    A more colorful spatter


    Varying Element Selection


    Below our `iterations` variable, create an

    array called `elements` and populate

    it with a `circle`, a `line`, and a `rect`:


    ```

    let elements = [''circle'', ''line'', ''rect''];

    ```


    Next, delete all the existing code in our `for` loop, and replace

    it with the following line that will pick a random element from the

    `elements` array

    defined previously.


    ```

    // Pick a random element.

    let element = Gen.random(elements);

    ```


    In the next step, we’ll initialize some variables with random values

    that we can later apply to our randomly selected element. In addition to

    our `x`, `y`, and `fill`, we’ll also vary

    our `stroke` and

    `stroke-width`.'
