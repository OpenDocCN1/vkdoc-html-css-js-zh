    Clip Paths and Color Palettes

    Now that we have our regular grid in place, we need to breathe some

    life into it. The changes we’re going to make are significant enough to

    warrant a new iteration of our sketch, so if you’d prefer to keep what

    we’ve done so far as a template, save and copy the existing sketch

    folder and rename it to something like `08-colourful-grids`,

    which will give you a clue where we’re taking this.


    Arrays of Colors

    In our previous “Elements Everywhere” sketch, we used `Gen.random()` to

    generate our colors on the fly. But

    what if we wanted a particular color palette, or a collection of color

    palettes, so that we could randomly choose between them?


    One popular approach is to store a pre-chosen palette as an array of

    color values, like so:


    ```

    // Create a colour palette.

    let palette = [''#5465FF'', ''#788BFF'', ''#9BB1FF'', ''#BFD7FF'', ''#E2FDFF''];

    ```


    There are many sites out there, too numerous to name, where you might

    stumble upon color palette inspiration. In fact, you might find it

    difficult to settle on a single palette, in which case it would make

    sense to save a selection of them and store them as arrays

    *within* another array. They would then become nested arrays,

    which are just arrays contained within other arrays. You might also see

    them referred to as 2D or multidimensional arrays.


    Let’s create a two-dimensional array containing three color palettes

    (illustrated in Figure [4-6](#538894_1_En_4_Chapter.xhtml#Fig6)). Beneath where
    we defined

    our initial grid group, include the following code (substituting in your

    own color palettes if you prefer):


    ![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig6_HTML.png)


    An abstract presents three rows, each row has five rectangles in

    three different color palettes, against a dark background.


    Figure 4-6

    Our three colour palettes


    ```

    // Create our colour palettes.

    let palettes = [

    [''#5465FF'', ''#788BFF'', ''#9BB1FF'', ''#BFD7FF'', ''#E2FDFF''],

    [''#22577A'', ''#38A3A5'', ''#57CC99'', ''#80ED99'', ''#C7f9CC''],

    [''#4C5760'', ''#93A8AC'', ''#D7CEB2'', ''#A59E8C'', ''#66635B'']

    ];

    ```


    Next, we’re going to randomly select one of these palettes and store it

    in a variable that we can call on later.


    ```

    // Pick a random palette.

    let pickedPalette = Gen.random(palettes);

    ```


    Now on to our grid variables. You can leave this as they were from the

    last sketch, but I’m not going to randomize the `gridSize` or `spacing` this time,
    as

    I want to place the emphasis on other randomized elements of the sketch.


    ```

    let gridSize = 600;

    let rows = Gen.random(3, 10);

    let spacing = 10;

    let increment = gridSize / rows;

    let cellSize = Math.abs(increment - spacing);

    ```


    Clipping Our Content

    The next step in developing our grid-based composition will involve

    something called a `clipPath`. Essentially

    what a `clipPath`

    does is define the visible region of the shape it’s applied to, in much

    the same way a scissors might define a cardboard cutout.


    Instead of using a square to define our grid cells, we’ll use a

    square-shaped `clipPath`. This way we

    can contain the content of our cells without them spilling out into

    adjacent cells. Let’s step out our sketch for a moment to illustrate

    this. In Figure [4-7](#538894_1_En_4_Chapter.xhtml#Fig7), we have a

    square-shaped `rect` that defines the

    `clipPath`, while

    the `circle` is

    the clipped element. On the right, you can see the effect of applying

    the `clipPath` to

    the `circle`.


    ![](images/538894_1_En_4_Chapter/538894_1_En_4_Fig7_HTML.png)


    An abstract presents a square overlapped with a shaded circle on the

    left, which is converted to a semi-circle, against a dark

    background.


    Figure 4-7

    How a clipPath works


    A `clipPath`

    requires an `id`

    so that it can be referenced later. Nested within the `clipPath` element is

    the actual shape or path that will do the “clipping.” Here’s how we’d

    create something like the semi-circle example from Figure [4-7](#538894_1_En_4_Chapter.xhtml#Fig7).


    ```

    // Initialise the clipPath with an id.

    let clip = svg.create(''clipPath'').set({ id: ''clip1'' });

    // Create the shape of the clipPath.

    clip.create(''rect'').set({

    x: 0, y: 0, width: 100, height: 100, stroke: ''#fff''

    });

    // Apply it to a circle via a call to its id.

    svg.create(''circle'').set({

    cx: 100, cy: 50, r: 50, fill: ''#80ffe6'', clip_path: ''url(#clip1)''

    });

    ```


    As you can see, the `clipPath` is called

    via its `id`,

    treated as an internal `url` reference, much

    like gradients and patterns. Let’s get back to our sketch now and apply

    this same logic within our loop. First, create the nested loop as we did

    before:


    ```

    for (let y = 0; y < gridSize; y += increment) {

    for (let x = 0; x < gridSize; x += increment) {

    }

    }

    ```


    Next, create the `clipPath`. We need to

    create a unique `id` for each instance,

    so we can’t pass in a static string as we did previously `–` otherwise, the

    `id` would be

    duplicated on each loop iteration. Instead what we can do is use the

    `x` and `y` iterator variables

    to generate a dynamic string, using template literal syntax like so:


    ```

    // Create our clip path with a unique id.

    let clip = svg.create(''clipPath'').set({ id: `${x}${y}` });

    ```


    Now we can create the actual shape of the `clipPath`. We’ll keep

    it straightforward and make it square, that is, a `rect` with a `width` and `height`
    equal to our

    `cellSize`.


    ```

    // Create the clip path shape.

    clip.create(''rect'').set({

    x: x, y: y, width: cellSize, height: cellSize

    });

    ```


    With the `clipPath` in place, we

    need to decide what to put into it. Here’s where we can get creative!

    There are four corners of each cell, so what we’ll do is randomly center

    a group of circles at any one of these four positions. The coordinates

    of these positions are determined by the current `x` and `y` values, along with

    the `cellSize`.

    Here’s how we’d calculate these positions and choose one of them at

    random:


    ```

    // Define our possible positions.

    let positions = [

    [x, y], // top left

    [x + cellSize, y], // top right

    [x + cellSize, y + cellSize], // bottom right

    [x, y + cellSize] // bottom left

    ];

    // Pick a random position.

    let pickedPosition = Gen.random(positions);

    ```


    Now, to create the `circle` group. This

    will involve a third loop (so a loop within a loop within a loop `–` loopception
    if you

    will), where we will create five circles radiating out from a randomly

    chosen center point. And let’s not forget about our palette picked out

    earlier; the fill of each circle will be colored accordingly.'
