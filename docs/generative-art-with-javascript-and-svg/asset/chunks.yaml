- fmt: "# The Challenge of Lighting Primitives\n\nThe challenge with these lighting\
    \ primitives is knowing how to supply them with nicely gradiented bump maps; anything\
    \ with very sharp transitions or a lot of areas of flat color can often appear\
    \ unpleasantly pixelated, or entirely unaffected. In Figure [8-11](#538894_1_En_8_Chapter.xhtml#Fig11),\
    \ we can see the rather stark difference between a distant light source shining\
    \ on a circle with a radial gradient (left) vs. a circle of the same size with\
    \ a uniform fill (right).\n\n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig11_HTML.png)\n\
    \nAn abstract presents a blurred circle on the left, with a bright dot in the\
    \ center. On the right is a bright-shaded circle.\n\n**Figure 8-11**  \n*Lighting\
    \ cast on a radial gradient vs. a flat fill*\n\nLighting is one of those things\
    \ in SVG that’s very easy to get wrong. When it does go awry, the results often\
    \ look cheap, choppy, and jagged and can put you off playing with lighting altogether.\
    \ We need to remember that with filters, we’ve moved from the realm of vectors\
    \ to that of pixels, where resolution matters. A more finely gradiented alpha\
    \ channel will translate to a higher-resolution bump map.\n\nFortunately, `feTurbulence`\
    \ is a first-rate source of gradiented alpha channel data. In our next sketch,\
    \ we’ll use `feTurbulence` along with `feDiffuseLighting` and `feDisplacementMap`\
    \ to simulate a rough, ripped paper effect. But first, we need to delve a little\
    \ more into the details of the two aforementioned lighting primitives.\n\n## Diffuse\
    \ and Specular Lighting\n\nThe `feDiffuseLighting` primitive simulates diffuse\
    \ reflection. What this means is that the light that strikes the surface of a\
    \ diffuse-lit object is scattered in all directions, as is characteristic of rough\
    \ surface textures (like linen). The `feSpecularLighting` primitive, on the other\
    \ hand, simulates specular reflection, which is characteristic of smoother surfaces\
    \ (like a bowling ball). With specular reflection, the light that strikes the\
    \ surface bounces at a definite angle. Figure [8-12](#538894_1_En_8_Chapter.xhtml#Fig12)\
    \ shows the difference between a point light emitted by `feDiffuseLighting` (left)\
    \ vs. the same light emitted by `feSpecularLighting` (right).\n\n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig12_HTML.png)\n\
    \nAn abstract presents a circle in dim color on the left, and a circle with bright\
    \ color on the right, against a dark background.\n\n**Figure 8-12**  \n*Diffuse\
    \ vs. specular lighting*\n\nBoth lighting primitives take a single input `in`\
    \ as their bump map source and a `surfaceScale` attribute, which defines the relative\
    \ height of the bump map. The color of the light can also be customized using\
    \ the `lighting-color` attribute, which is white by default. Both primitives also\
    \ share an attribute that defines a constant: `diffuseConstant` in the case of\
    \ `feDiffuseLighting` and `specularConstant` in the case of `feSpecularLighting`.\
    \ This constant determines the strength of the light cast by the source. The `feSpecularLighting`\
    \ primitive boasts an additional attribute called `specularExponent`, which controls\
    \ the focal point strength (in Figure [8-12](#538894_1_En_8_Chapter.xhtml#Fig12),\
    \ this would determine the size of the point light’s reflection).\n\n## Light\
    \ Sources\n\nI’ve mentioned distant lights and point lights a couple of times\
    \ now but haven’t explained them. These refer to the type of light emitted by\
    \ either an `feDiffuseLighting` or `feSpecularLighting` primitive. By themselves,\
    \ these primitives do not emit any light; they require an extra nested node to\
    \ define the source. In other words, setting up a light in SVG involves defining\
    \ two elements: one, the outer node, which defines whether the target surface\
    \ of the lighting is diffuse or specular; and two, the inner node, which defines\
    \ the type of light source to be used. Here’s how an example might look in raw\
    \ SVG:\n\nThere are three light source nodes: `feDistantLight`, an ambient light\
    \ that emits rays uniformly in all directions (such as the sun); `fePointLight`,\
    \ a more proximate light source that has a defined focal point; and `feSpotLight`,\
    \ a directional light that emits its rays through a conical shape, the dimensions\
    \ of which can be customized. Addressing all three light sources would exceed\
    \ the scope of this chapter, so we’ll stick to the first two: `feDistantLight`\
    \ and `fePointLight`.\n\nThe `feDistantLight` source has two attributes: the `azimuth`,\
    \ which specifies the angle of direction of the light, and the `elevation`, which\
    \ specifies the height of the light source. Both are expressed in terms of degrees.\
    \ To use the sun analogy, at dawn it would rise in the east (at an `azimuth` and\
    \ `elevation` of `0`) and by midday at the equator, it would have climbed to an\
    \ `elevation` of `90`, directly overhead.\n\nThe `fePointLight` source has no\
    \ `azimuth` or `elevation`; it is instead defined entirely by `x`, `y`, and `z`\
    \ attributes. The `z` attribute would correspond with the `elevation` or height\
    \ of the light source, and the `x` and `y` attributes refer to the standard two-dimensional\
    \ position in the current coordinate space.\n\n## Simulating Textures\n\nLet’s\
