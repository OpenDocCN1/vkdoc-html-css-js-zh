    \ for this purpose: [`davidmatthew.ie/generative-art-javascript-svg#turbulence`](https://davidmatthew.ie/generative-art-javascript-svg#turbulence).\n\
    I prefer working with `baseFrequency` values\nat the very low end of spectrum\
