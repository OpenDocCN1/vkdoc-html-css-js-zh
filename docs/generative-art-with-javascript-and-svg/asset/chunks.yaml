    \  \nSpinning lines or deep-sea creatures?\n\n## Summary\n\nWhile there’s certainly\
    \ more to explore where noise is concerned, we’ve covered the basics here, and\
    \ we will be utilizing noise again in the forthcoming chapters. If you want to\
    \ be able to tinker more with the nuts and bolts of noise, I’d encourage you to\
    \ check out some third-party libraries like the popular SimplexJS, which goes\
    \ beyond two dimensions and allows for greater freedom of configuration (at a\
    \ cost of size, however).\n\nBefore we move on, let’s quickly recap what we’ve\
    \ covered in this chapter:\n\n- The limits of randomness when creating more organic\
    \ forms and how noise addresses this limitation\n- The theory behind the abstract\
    \ noise space\n- How to put this into practice with the SvJs `Noise` module\n\
    - How to traverse the noise space within a loop\n- How to use noise values to\
    \ modify element coordinates and colors\n- Mapping and constraining noise values\
    \ to more useful ranges\n- Optimizing repetitive element attributes with CSS\n\
    - Nondestructive element rotations\n\nIn the next chapter, we’re going to cover\
    \ a fundamental part of the SVG spec: the very powerful path element.\n\n# 6.\
    \ The All-Powerful Path\n\nPaths are perhaps the most important and most powerful\
    \ part of the SVG spec. Most SVG files, be they simple icons or complex artworks,\
    \ consist primarily of path data. If, for example, you draw anything more advanced\
    \ than a primitive shape in a vector graphics program like Inkscape or Illustrator,\
    \ you are ipso facto working with paths. And no, to program paths manually in\
    \ JavaScript and SvJs, you don’t need to be a mathematical wizard.\n\nThis chapter\
    \ will cover the path element and its associated commands, which are sufficiently\
    \ numerous to need their own subsections. Paths can get complicated quickly, so\
    \ we’ll also be covering some SvJs methods to make our lives easier.\n\n## The\
    \ Path Element\n\nIt’s simple to set up a path; we just call the SvJs `create()`\
    \ method as we would with most other elements:\n\n```\nlet path = svg.create('path');\n\
    ```\n\nPaths accept the usual `fill` and `stroke` attributes that other graphical\
    \ elements do, but unlike other graphical elements (like `rect` and `circle`),\
    \ they come with no intrinsic form or shape. This is entirely up to us to define,\
    \ and we do so via the `d` attribute.\n\n### D for Data\n\nThe `d` attribute allows\
    \ us to populate a path with data. This data consists of a series of path commands\
    \ and accompanying numeric values that define the form the path takes. The data\
    \ as a whole is passed in as a string.\n\nThe creators of the SVG spec knew that\
    \ paths would feature heavily in most SVG files, so creating concise path commands\
    \ was a crucial part of keeping down the overall kilobyte count. They are therefore\
    \ of single-character length, like the `d` attribute to which they are passed,\
    \ and the values that accompany the commands can also be flexibly formatted to\
    \ conserve space.\n\n```\n// An example of a string of path data.\npath.set({\n\
    d: 'M 20,20 L 30,20 L 30,30 L 20,30 Z'\n});\n// An identical path using a more\
    \ concise string.\npath.set({\nd: 'M20 20L30 20L30 30L20 30Z'\n});\n```\n\nWe’ll\
    \ go into more detail in later sections as to how examples like the aforementioned\
    \ work; for now, just note that the very same path data can be written with or\
    \ without commas to separate values and with or without spaces to separate commands.\n\
    \n### Path Commands\n\nYou can think of path commands as drawing instructions.\
    \ Each command is represented by a letter, and this letter can be either uppercase\
    \ or lowercase. The uppercase version indicates that the values which follow will\
    \ use absolute coordinates (so the command `M 50,50` would mean moving to the\
    \ exact position of `50,50` in the `viewBox`), whereas the lowercase version means\
    \ that relative coordinates will be used (so the command `m 50,50` would mean\
    \ moving by `+50` on both the x and y axes relative to the last known position).\n\
    \nThere are a total of ten commands; twenty if you count the two versions. And\
    \ if you think that sounds like a lot, you’d be right! It is a lot. But there’s\
    \ an amazing economy to these commands when you consider that they can be combined\
    \ to create any possible two-dimensional shape. Some commands are more common\
    \ than others, some more complex, and some we’ll demonstrate the once and won’t\
    \ use again.\n\n### Starting and Ending a Path\n\nAll paths start somewhere. And\
    \ where SVG is concerned, all paths start at the point to which we move our virtual\
    \ pen. We use the `M` (or `m`) command for this, which means “move to.” We follow\
    \ this with an x and y coordinate pair to define the path’s starting point. The\
    \ `M` command by itself doesn’t draw anything—it merely moves us to the point\
    \ at which we want to begin. Our pen has yet to push down on the paper, so to\
    \ speak.\n\n```\n// Syntax for the M/m command.\n'M [x, y] ...'\n'm [dx, dy] ...'\n\
    // Examples of the M/m command.\n'M 50 100 ...'\n'm 50 100 ...'\n```"
