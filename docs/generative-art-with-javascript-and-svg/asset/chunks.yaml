    \ 是一个数学常数，表示圆的周长（沿其边界的长度）与直径（半径的两倍）之比。图 7-4 展示了这些值。\n\n![](img/538894_1_En_7_Fig4_HTML.png)\n\
    \n一幅抽象图呈现出一个方形结构，其中有一个圆形，标有周长、半径和直径，背景为深色。\n\n**图 7-4** 圆的周长、直径和半径\n\n你可能习惯用度数表示角度，但在\
