- fmt: "# Collision Detection\n\nIt’s one thing to interact ourselves with a generative\
    \ piece to influence the output, but it’s another thing entirely when it begins\
    \ to interact with *itself*. This is in essence what collision detection entails.\
    \ We’ll explore an example using the bounds of a rectangle as a basic collision\
    \ barrier, and we’ll utilize the `requestAnimationFrame()` method while it’s still\
    \ relatively fresh in our minds.\n\n## Setting Boundaries\n\nSo the usual drill\
    \ – create a new folder from the template, rename it to `19-collision-detection`,\
    \ and begin coding below the background. The first thing we’ll do is create a\
    \ `rect` styled like a picture frame. This effect is achieved by using a slightly\
    \ transparent stroke over the fill; half the stroke is painted outside the frame\
    \ and half inside (something we’ll need to factor into our collision detection\
    \ calculations later). The size of this frame will be randomized, so we’ll set\
    \ up a `frameSize` variable to capture this and also use it to keep other element\
    \ (like the `stroke-width`) in proportion.\n\n```\n// Create a frame to act as\
    \ the boundary.\nlet frameSize = Gen.random(350, 700);\nlet frame = svg.create('rect').set({\n\
    \  x: (1000 - frameSize) / 2,\n  y: (1000 - frameSize) / 2,\n  width: frameSize,\n\
    \  height: frameSize,\n  fill: '#252525',\n  stroke: `hsl(${Gen.random(0, 360)}\
    \ 80% 80% / 0.25)`,\n  stroke_width: frameSize / 10,\n});\n```\n\n## Initializing\
    \ and Extending Our Shapes\n\nWith the frame now in place, let’s fill it with\
    \ some circles of various sizes. The aim will be to have these circles burst out\
    \ from the center in all directions, some rushing rapidly and others ambling slowly,\
    \ and all of them bouncing off the frame borders as they encounter them. In the\
    \ following, we’ll start by initializing the circles and filling up an array as\
    \ we’ve done in our previous examples.\n\n```\n// Randomise the number of circles\
    \ and set up an empty array.\nlet numCircles = Math.floor(frameSize / 20);\nlet\
    \ circles = [];\n\n// Populate this array.\nfor (let i = 0; i < numCircles; i\
    \ += 1) {\n  // Randomise the radius relative to the frame size.\n  let radius\
    \ = Gen.random(frameSize / 100, frameSize / 25);\n\n  // Apply the above variables\
    \ and randomise the hue.\n  let circle = svg.create('circle').set({\n    cx: 500,\n\
    \    cy: 500,\n    r: radius,\n    fill: `hsl(${Gen.random(0, 360)} 80% 80% /\
    \ 0.5)`\n  });\n\n  // Store the circle in the array.\n  circles.push(circle);\n\
    }\n```\n\nWe have our circles all clustered in the center now, but they’re not\
    \ yet primed for movement. We have a way to track their position (via the `cx`\
    \ and `cy` attributes), but we have no attributes to track their speed or direction,\
    \ which we’ll need if we’re going to pull off collision detection.\n\nThankfully\
    \ SvJs elements are easily extendable. If we want to add a new attribute to an\
    \ element, it’s as simple as including it in the `set()` method. If it’s not a\
    \ valid SVG attribute, it won’t have any impact on the rendered SVG, but that’s\
    \ ok – we simply want it stored to be used in our collision detection calculations\
    \ later.\n\nWe’ll need at least two new attributes: one to track the speed on\
    \ the x axis and another to track the speed on the y axis. To determine direction,\
    \ we can use these same attributes and invert the polarity to change the direction.\
    \ For example, positive numbers on the x axis will indicate left-to-right motion,\
    \ and negative numbers will mean right-to-left motion. On the y axis, positive\
    \ numbers will denote downward motion and negative numbers upward motion.\n\n\
    Setting these new attributes will be a two-step process. We’ll first set up variables\
    \ `velocityX` and `velocityY` to capture randomized speeds. And the attributes\
    \ we’ll set will be simply `vx` and `vy`, and we’ll randomize their polarity using\
    \ `Gen.chance()` (so they’ll have a 50/50 chance of being either positive or negative).\
    \ Update the relevant code as follows:\n\n```\n// Create variables to control\
    \ the speed on the x and y axes.\nlet velocityX = Gen.random(0.1, 5, true);\n\
    let velocityY = Gen.random(0.1, 5, true);\n\n// Apply the above variables and\
    \ randomise the hue.\nlet circle = svg.create('circle').set({\n  cx: 500,\n  cy:\
    \ 500,\n  r: radius,\n  vx: Gen.chance() ? velocityX : -velocityX,\n  vy: Gen.chance()\
    \ ? velocityY : -velocityY,\n  fill: `hsl(${Gen.random(0, 360)} 80% 80% / 0.5)`\n\
    });\n```\n\n## Frame-by-Frame Calculations\n\nCalculating whether or not one of\
    \ our circles collides with a boundary (i.e., the edge of our frame) involves\
    \ keeping a constant check on each circle’s position. For this reason, `requestAnimationFrame()`\
    \ is really the only feasible way to simulate collision detection, as these checks\
    \ need to occur on a frame-by-frame basis.\n\nThere’s a bit of a code dump coming\
    \ up, but I’ll explain the important parts. You’ll notice that when we fetch any\
    \ of our attributes, we’re wrapping them in a `Number()` method. This is because\
    \ our attributes will be returned as strings, and if we’re to do any reliable\
    \ calculations with them, we want to explicitly handle them as numeric values\
    \ rather than relying on JavaScript’s covert casting (which may sometimes get\
    \ things right, but it leaves you wide open to bugs).\n\nHere’s a rundown of the\
    \ algorithm we’ll implement. First, we calculate the lower and upper bounds (i.e.,\
    \ the frame edges). Then, for each circle:\n\n* We retrieve the position and velocity\
    \ and store them as variables.\n* If the x variable is less than or equal to either\
    \ the lower bound or the upper bound, we reverse the polarity of the x velocity\
    \ variable.\n* We repeat the previous step for the y axis.\n* We then update the\
    \ x and y variables based on the calculated velocity.\n* Finally, we apply the\
    \ updated variables to the circle element.\n\nHere’s the concrete coded version:\n\
    \n```\n// Get the lower and upper bounds (the frame edges) for use in the loop.\n\
    let lowerBound = Number(frame.get('x'));\nlet upperBound = lowerBound + frameSize;\n\
    \n// The animation loop.\nfunction animate() {\n  // Check collisions for each\
    \ circle.\n  circles.forEach((circle) => {\n    // Retrieve the position and velocity.\n\
    \    let cx = Number(circle.get('cx'));\n    let cy = Number(circle.get('cy'));\n\
    \    let vx = Number(circle.get('vx'));\n    let vy = Number(circle.get('vy'));\n\
    \n    // Check for collisions, and if found reverse the polarity.\n    if (cx\
    \ <= lowerBound || cx + (radius * 2) >= upperBound) vx = -vx;\n    if (cy <= lowerBound\
    \ || cy + (radius * 2) >= upperBound) vy = -vy;\n\n    // Update the position.\n\
    \    cx += vx;\n    cy += vy;\n\n    // Set the new values.\n    circle.set({\
    \ cx: cx, cy: cy, vx: vx, vy: vy });\n  });\n\n  // The recursive bit.\n  requestAnimationFrame(animate);\n\
    }\n\n// Call the animation.\nanimate();\n```\n\nIf you watch the animation at\
    \ this point, you’ll notice that the circles do indeed rebound within the vicinity\
    \ of the frame edge, but it’s far from precise and even appears to differ depending\
    \ on the circle size. Looks like we’ve left something out of our calculations.\n\
    \nTo fix this, we need to account for the fact that the frame border is inset;\
    \ that is, the `stroke` is halfway inside the frame, and the radius of each circle\
    \ is different. This means that the `lower bound` and `upper bound` variables\
    \ must be calculated *inside* the animation loop, as they will vary per circle.\
    \ There are, however, a couple of static values that can be captured outside the\
    \ loop and used later inside it: the frame edge and frame inset. Delete the `lower\
    \ bound` and `upper bound` variables and replace them with the following:\n\n\
    ```\n// Get the frame edge point (x or y) and the inset.\nlet frameEdge = Number(frame.get('x'));\n\
    let frameInset = Number(frame.get('stroke-width')) / 2;\n```\n\nNow, inside the\
    \ loop, we can work out the proper `lower bound` and `upper bound` values."
