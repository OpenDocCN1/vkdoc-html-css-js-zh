    not `NaN`. This

    just means “not a number.” In both cases, our functions don’t work so

    well without arguments. How might we

    fix this and make them a little more resilient?


    One straightforward way is to assign default values when defining a

    function’s parameters. Let’s rewrite our `sayHello()` function

    as an example.


    ```

    function sayHello(name = ", ah it''s yourself") {

    // Greet the user the Irish way.

    console.log(`Howaya ${name}, what''s the craic?`);

    }

    sayHello();

    -> "Howaya, ah it''s yourself, what''s the craic?"

    ```


    As you can see, creating a default value is as simple as assigning a

    value to the parameter when you define it. Now we’ve created a more

    human-sounding fallback than `undefined`.


    In the case of the `squareNumber()`

    function, a default value doesn’t make as much sense. Instead, we could

    use the ternary technique covered earlier to provide some actionable

    feedback if the function is called without an argument.


    ```

    function squareNumber(number) {

    return number ? number * number : ''Please include the number you want to square'';

    }

    ```


    In the `squareNumber()`

    function body, our ternary operator is essentially asking “Is `number` defined?
    If

    so, return the result of multiplying it by itself; otherwise, return our

    fallback message.”


    At this point, you

    should be in a better position to fully understand the function defined

    in our first generative sketch. Have another look and see if it makes

    more sense now.


    ```

    function random(min, max, integer = true) {

    let random = Math.random() * (max - min) + min;

    let number = integer ? Math.floor(random) : random;

    return number;

    }

    ```


    Scope

    The scope of a

    variable refers to its visibility, or where in a program the variable

    can be accessed. It’s particularly important to be aware of when working

    with functions.


    If, for example, we defined a variable within a function, it would only

    be visible within that function.


    ```

    function scopeTest() {

    const a = 1;

    }

    console.log(a);

    -> Uncaught ReferenceError: a is not defined

    ```


    However, if we defined the same variable outside that function, it would

    be visible from *within* the function.


    ```

    const a = 1;

    function scopeTest() {

    console.log(a);

    }

    scopeTest();

    -> 1

    ```


    In the first case, the variable is block-scoped, that is, confined to

    the block of the function. In the latter case, the variable is defined

    globally (outside all functions) and can be accessed anywhere in the

    program.


    Although it may seem more beneficial to be able to access a variable

    from anywhere within a program, we should exercise caution where global

    variables are

    concerned. In general, it is better to explicitly restrict the scope of

    our variables. This is one of the main reasons why `var` has been

    deprecated, as it can’t be “contained” in the same way that `let` and `const`
    can be.


    ```

    function scopeTest() {

    var a = 1;

    }

    console.log(a);

    -> 1

    ```


    As you can see earlier, when using `var`, the variable can

    break out of the surrounding block, and this can be problematic in

    larger programs.

    When coding generative art, we’re usually writing relatively small

    programs (or “sketches”) and global variables aren’t as much of an

    issue. However, we’ll discuss in the next section how best to make

    certain settings globally available throughout our sketches without

    relying on global variables.


    Anonymous Functions


    Functions don’t always have to have a name. Particularly when working

    with events and callbacks (which we’ll

    cover in a later chapter), functions are often called anonymously as

    function expressions, executed in order to return a value. Anonymous

    functions can also be assigned to variables that then store the returned

    value.


    ```

    // An anonymous function expression assigned to a variable.

    const sum = function(a, b) {

    return a + b;

    }

    ```


    In the preceding example, the variable can be used to execute the

    function.


    ```

    sum(5, 4);

    -> 9

    ```


    One thing we cannot do with anonymous functions is use them at the start

    of a statement.'
