    // Define the function.

    function customFunction() {

    // do stuff here...

    // Make the recursive call to requestAnimationFrame().

    requestAnimationFrame(customFunction);

    }

    // Call the function.

    customFunction();

    ```


    Additionally, `requestAnimationFrame()` can pass a timestamp to our custom function
    so that we can sync our animation with real-time values rather than relying on
    the screen refresh rate, which can vary from device to device. The timestamp contains
    the amount of milliseconds that have elapsed since our animation started. Let’s
    continue now with our sketch and set up an `animate()` function and pass it the
    timestamp so that we can use it to increment the angle of rotation. This works
    because rotation values can increment indefinitely beyond 360° and still remain
    valid.


    ```javascript

    // Animate the last shape using requestAnimationFrame.

    function animate(time) {

    // Rotate the angle.

    let angle = time;

    // Apply the rotation.

    shapes[3].set({ transform: `rotate(${angle})` });

    // The recursive bit.

    requestAnimationFrame(animate);

    }

    animate();

    ```


    Ok, so this code gets our final shape moving, but we’ve got a couple of problems.
    One, our shape is rotating at a breakneck speed, wildly out of sync with the others.
    And two, if you inspect the console, you’ll see an error to the effect that we’re
    supplying an `undefined` variable to our rotation transform. This error occurs
    just the once, so what that tells us is that when our function runs for the first
    time, the `angle` (and therefore the `time`) is `undefined`. This is simple enough
    to rectify; we just need to reassign the `time` variable to a value of `0` if
    it is `undefined`. Include the following code before the angle is declared, and
    that should soothe our console’s concerns:


    ```javascript

    // Prevent errors when the time is undefined on first frame.

    if (time === undefined) time = 0;

    ```


    Now let’s address the speed of rotation. We could try dividing the `time` by arbitrary
    amounts until it slows down to the point of synchronization (or something close
    enough), but that’s not very satisfactory. Instead, let’s work with what we know:


    -   Our shape should rotate by 360°.

    -   This rotation should take five seconds (or five thousand milliseconds).

    -   The `time` is provided in milliseconds.


    Based on the aforementioned, we can derive a calculation that gives us the exact
    speed by which to rotate our shape: 0.072° per millisecond (360° divided by 5,000
    milliseconds). Update the previous statement where `angle` simply equals `time`
    with the following:


    ```javascript

    // Rotate 360° in 5000ms: 360/5000 = 0.072.

    let angle = time * 0.072;

    ```


    This should rotate our shape in sync with the others. Getting it to scale in sync,
    however, is more of a challenge. For that, we first need to initialize some variables
    outside of the animation loop that can help us keep track of certain states. Why?
    Well, if we tried creating these states inside the loop, they would get overwritten
    on each iteration. The scale increment value needs to swing back and forth between
    an upper and a lower limit, and the most straightforward way to achieve this is
    to keep track of the current scale value and its polarity (i.e., whether it’s
    swinging one way or another). For this, we’ll need a boolean that we can toggle
    back and forth like a switch. We’ll also need a way to increment the scale value
    in a way that synchronizes with the time but doesn’t use the timestamp value directly
    as this would only increment it indefinitely.


    With the aforementioned in mind, let’s initialize the following variables before
    the `animate()` function:


    ```javascript

    let isPositive = true;

    let scale = 0, tick = 0, prevTime = 0;

    ```


    Update the animation loop as follows. The comments do the explanatory heavy-lifting
    here, so to better understand each step, be sure to read the comments carefully.
    The main takeaway here is just how much more work we need to do with `requestAnimationFrame()`
    compared to the other methods.


    ```javascript

    // Animate the final shape using requestAnimationFrame.

    function animate(time) {

    // Prevent errors when the time is undefined on first frame.

    if (time === undefined) time = 0;

    // Rotate 360° in 5000ms: 360/5000 = 0.072.

    let angle = time * 0.072;

    // We need a constant tick value that doesn''t increment indefinitely.

    tick = time - prevTime;

    // Scale by 0.5 in 2500ms: 0.5/2500 = 0.0002.

    scale = isPositive ? scale + (tick * 0.0002) : scale - (tick * 0.0002);

    // Apply the rotation and scale values.

    shapes[3].set({

    transform: `rotate(${angle}) scale(${1 - scale}, ${1 + scale})`

    });

    // Flip the polarity if the scale value falls outside these bounds.

    if (scale < 0) isPositive = !isPositive;

    if (scale > 0.5) isPositive = !isPositive;

    // Capture the time before it increments.

    prevTime = time;

    // The recursive bit.

    requestAnimationFrame(animate);

    }

    animate();

    ```


    We should now have the final shape rotating and scaling in sync (give or take)
    with the other shapes. In some cases, you might see some slight offset in the
    rotation, or the scaling might happen a little quicker than expected. Discrepancies
    like this have more to do with how the browser automatically schedules and handles
    optimizations with the other animation methods than it has to do with the performance
    of `requestAnimationFrame()` itself. These animation methods weren’t designed
    to be combined as we’ve done in this sketch; normally you’ll choose one method
    and stick to it, depending on what you’re trying to achieve.


    ## Methods Summarized


    So which method should you choose for generative art? There’s no definitive answer
    to this, but for what it’s worth, here’s my advice (with the caveat that this
    is not a comprehensive analysis of the pros and cons of each method, but a cursory
    comparison from my inevitably partisan point of view). CSS keyframes are more
    suited to shorter sequences, such as animated loading indicators (an art in themselves),
    UX enhancements, and animations where accessibility or browser compatibility is
    a concern. For more elaborate sequences, they can quickly get convoluted and awkward
    to edit. For animating SVG specifically, there are many attributes that are inaccessible
    when using CSS, such as masks, clip paths, and gradients.


    With SMIL, you’ve got a well-thought-out animation format native to SVG and one
    that can access all animation-capable attributes. Unlike the other methods, it
    can also retain its animations when the SVG is embedded as an image (much like
    a gif). The negatives? It can become quite verbose, and its future is rather unclear
    (back in 2015, support for SMIL was dropped from Chrome, but this decision was
    quickly reversed).


    The Web Animations API, or WAAPI, is the most modern animation method, has more
    advanced capabilities than CSS or SMIL, and in general is more flexible and concise.
    I would recommend it over CSS or SMIL for generative art, but it does have its
    limitations. It’s not suitable for open-ended, exploratory animations, where we’re
    unsure of the end result. Like CSS and SMIL, everything needs to be tightly orchestrated
    and intentional. To go “full generative,” we need something more low level like
    `requestAnimationFrame()`.


    Yes, `requestAnimationFrame()` can make us trudge a rather punishing path to achieve
    relatively meager results, but conversely, more complicated results can in many
    cases be achieved in a far more simple and elegant manner than they can using
    other methods (I’ll demonstrate this in our next example on collision detection).
    We just need to persevere beyond the initial pain barrier.


    It’s also worth noting that there are many solid third-party libraries out there
    to help you animate with SVG; of particular note is the GreenSock Animation Platform
    (GSAP), which is very feature rich and offers robust performance and impressive
    backward compatibility. It’s not open source however, and some of its plug-ins
    are for paid subscribers only. `Anime.js` is a nice open source alternative.'
