  raw: 'The challenge with these lighting primitives is knowing how to supply

    them with nicely gradiented bump maps; anything with very sharp

    transitions or a lot of areas of flat color can often appear

    unpleasantly pixelated, or entirely unaffected. In Figure [8-11](#538894_1_En_8_Chapter.xhtml#Fig11),
    we can see

    the rather stark difference between a distant light source shining on a

    circle with a radial gradient (left) vs. a circle of the same size with

    a uniform fill (right).


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig11_HTML.png)


    An abstract presents a blurred circle on the left, with a bright dot

    in the center. On the right is a bright-shaded circle.


    Figure 8-11

    Lighting cast on a radial gradient vs. a flat fill


    Lighting is one of those things in SVG that’s very easy to get wrong.

    When it does go awry, the results often look cheap, choppy, and jagged

    and can put you off playing with lighting altogether. We need to

    remember that with filters, we’ve moved from the realm of vectors to

    that of pixels, where resolution matters. A more finely gradiented alpha

    channel will translate to a higher-resolution bump map.

    Fortunately, `feTurbulence` is a

    first-rate source of gradiented alpha channel data. In our next sketch,

    we’ll use `feTurbulence` along

    with `feDiffuseLighting` and

    `feDisplacementMap` to

    simulate a rough, ripped paper effect. But first, we need to delve a

    little more into the details of the two aforementioned lighting

    primitives.


    Diffuse and Specular Lighting


    The `feDiffuseLighting`

    primitive

    simulates diffuse reflection. What this means is that the light that

    strikes the surface of a diffuse-lit object is scattered in all

    directions, as is characteristic of rough surface textures (like linen).

    The `feSpecularLighting`

    primitive, on the other hand,

    simulates specular reflection, which is characteristic of smoother

    surfaces (like a bowling ball). With specular reflection, the light that

    strikes the surface bounces at a definite angle. Figure [8-12](#538894_1_En_8_Chapter.xhtml#Fig12)
    shows the

    difference between a point light emitted by `feDiffuseLighting`

    (left) vs. the same light emitted by `feSpecularLighting`

    (right).


    ![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig12_HTML.png)


    An abstract presents a circle in dim color on the left, and a circle

    with bright color on the right, against a dark background.


    Figure 8-12

    Diffuse vs. specular lighting


    Both lighting primitives take a single input `in` as their bump map

    source and a `surfaceScale`

    attribute, which defines the relative height of the bump map. The color

    of the light can also be customized using the `lighting-color`

    attribute, which is white by default. Both primitives also share an

    attribute that defines a constant, `diffuseConstant` in

    the case of `feDiffuseLighting` and

    `specularConstant` in

    the case of `feSpecularLighting`.

    This constant determines the strength of the light cast by the source.

    The `feSpecularLighting`

    primitive boasts an additional attribute called `specularExponent`,

    which controls the focal point strength (in Figure [8-12](#538894_1_En_8_Chapter.xhtml#Fig12),
    this would

    determine the size of the point light’s reflection).


    Light Sources


    I’ve mentioned distant lights and point lights a couple of times now but

    haven’t explained them. These refer to the

    type of light emitted by either an `feDiffuseLighting` or

    `feSpecularLighting`

    primitive. By themselves, these primitives do not emit any light; they

    require an extra nested node to define the source. In other words,

    setting up a light in SVG involves defining two elements: one, the outer

    node, which defines whether the target surface of the lighting is

    diffuse or specular; and two, the inner node, which defines the type of

    light source to be used. Here’s how an example might look in raw SVG:


    There are three light source nodes: `feDistantLight`, an

    ambient light that emits rays uniformly in all directions (such as the

    sun); `fePointLight`, a more

    proximate light source that has a defined focal point; and `feSpotLight`, a

    directional light that emits its rays through a conical shape, the

    dimensions of which can be customized. Addressing all three light

    sources would exceed the scope of this chapter, so we’ll stick to the

    first two: `feDistantLight` and

    `fePointLight`.

    The `feDistantLight` source

    has two attributes: the `azimuth`, which

    specifies the angle of direction of the light, and the `elevation`, which

    specifies the height of the light source. Both are expressed in terms of

    degrees. To use the sun analogy, at dawn it would rise in the east (at

    an `azimuth` and

    `elevation` of

    `0`) and by

    midday at the equator, it would have climbed to an `elevation` of `90`, directly

    overhead.

    The `fePointLight` source

    has no `azimuth`

    or `elevation`;

    it is instead defined entirely by `x`, `y`, and `z` attributes. The

    `z` attribute

    would correspond with the `elevation` or height

    of the light source, and the `x` and `y` attributes refer to

    the standard two-dimensional position in the current coordinate

    space.


    Simulating Textures


    Let’s start a new sketch and flesh out some of the

    theory mentioned previously. Copy our template folder and rename it to

    `23-rough-paper`,

    and in the usual spot below the background, create a parchment-colored

    gradient that we’ll apply to our paper. The paper itself will be a

    compound path consisting of two shapes (the result of ripping it in

    two). As you can see, it’s possible to extend paths beyond a terminating

    `Z` command by

    simply adding a new `M` command (the

    equivalent of lifting your pen to start a new line

    elsewhere). Once we have the ripped paper set up, we center it.


    ```

    // Create a parchment-coloured gradient.

    svg.createGradient(''parchment'', ''linear'', [''#fffbeb'', ''#fde68a''], 90);

    // Create the path for the ripped paper.

    let paper = svg.create(''path'').set({

    fill: ''url(#parchment)'',

    stroke: ''#4444'',

    d: ''M 0,0 h 175 l 175,550 h -350 Z M 210,0 h 340 v 550 h -165 Z'',

    filter: ''url(#rough-paper)''

    });

    // Centre it.

    paper.moveTo(500, 500);

    ```


    The composition we’re keeping deliberately simple so that we can give

    more focus to the filter effect. We’ll initialize this next and add the

    first primitive to the chain: `feTurbulence`. This

    will form the basis of the paper grain texture.


    ```

    // Initialise the filter.

    let filter = svg.createFilter(''rough-paper'');

    // Add turbulence to simulate paper grain.

    filter.create(''feTurbulence'').set({

    type: ''fractalNoise'',

    numOctaves: 5,

    baseFrequency: 0.04,

    seed: Gen.random(0, 100),

    result: ''turbulence''

    });

    ```


    The canvas should now be flooded with `feTurbulence`. What

    we’ll do next is shine a light on it, specifically an `feDiffuseLighting`

    primitive with a nested `feDistantLight` node

    as the lighting type. This second node we can create directly after the

    diffuse lighting primitive, using SvJs method chaining.


    ```

    // Shine diffuse lighting on the turbulence.

    filter.create(''feDiffuseLighting'').set({

    surfaceScale: 1,

    diffuseConstant: 1.3,

    in: ''turbulence'',

    result: ''lighting''

    }).create(''feDistantLight'').set({

    azimuth: 180,

    elevation: 45,

    });

    ```


    We should now have a paper-like texture covering the canvas. Next, we’ll

    rough up the edges of our source graphic by

    plugging some turbulence into an `feDisplacementMap`

    primitive.


    ```

    // Distort the paper source graphic with turbulence.

    filter.create(''feDisplacementMap'').set({

    in: ''SourceGraphic'',

    in2: ''turbulence'',

    scale: 25,

    result: ''distortion''

    });

    ```


    This gives us an outline of aging paper with worn edges, but with no

    texture. To re-introduce the result of the lighting effect, we need to

    do some compositing. With the lighting output as the foreground and

    rough-edged paper as the background, the `in` operator will

    achieve the effect we’re looking for.'
  trans: "\n# 光照图元的挑战\n\n使用这些光照图元的挑战在于，要知道如何为它们提供带有良好渐变效果的凹凸贴图；任何具有非常尖锐过渡或大面积纯色区域的贴图，往往会出现令人不悦的像素化，或者完全不受影响。在图\
    \ 8-11 中，我们可以看到，一个带有径向渐变（左侧）的圆形与一个同样大小但填充纯色（右侧）的圆形，在受到远距离光源照射时，产生的效果差异相当明显。\n\n\
    ![](img/538894_1_En_8_Fig11_HTML.png)\n\n一张抽象图左侧展示了一个模糊的圆形，中心有一个亮点。右侧是一个明亮的阴影圆形。\n\
    \n**图 8-11**  \n*投射在径向渐变与纯色填充上的光照效果*\n\n光照是 SVG 中非常容易出问题的环节之一。一旦出了问题，结果往往显得廉价、生硬且参差不齐，这可能会让你彻底放弃尝试光照效果。我们需要记住，使用滤镜时，我们已经从矢量领域进入了像素领域，分辨率在此处至关重要。一个渐变更加精细的\
    \ Alpha 通道，会转化为分辨率更高的凹凸贴图。\n\n幸运的是，`feTurbulence` 是生成渐变 Alpha 通道数据的绝佳源头。在下一个示例中，我们将使用\
    \ `feTurbulence` 配合 `feDiffuseLighting` 和 `feDisplacementMap` 来模拟一种粗糙、撕裂的纸张效果。但首先，我们需要更深入地探究上述两个光照图元的一些细节。\n\
    \n## 漫反射与镜面高光光照\n\n`feDiffuseLighting` 图元模拟的是漫反射。这意味着，照射到漫反射光照物体表面的光线会向各个方向散射，这是粗糙表面纹理（如亚麻布）的特征。而\
    \ `feSpecularLighting` 图元则模拟镜面高光反射，这是更光滑表面（如保龄球）的特征。在镜面高光反射中，照射到表面的光线会以一个确定的角度反射出去。图\
    \ 8-12 展示了由 `feDiffuseLighting`（左侧）发出的点光源与由 `feSpecularLighting`（右侧）发出的相同点光源之间的区别。\n\
    \n![](img/538894_1_En_8_Fig12_HTML.png)\n\n一幅抽象图，左侧在深色背景上显示了一个暗色调的圆形，右侧则是一个亮色调的圆形。\n\
    \n**图 8-12**  \n*漫反射光照与镜面高光光照的对比*\n\n两个光照图元都接受一个单一的输入 `in` 作为它们的凹凸贴图源，以及一个 `surfaceScale`\
    \ 属性，该属性定义了凹凸贴图的相对高度。光线的颜色也可以使用 `lighting-color` 属性进行自定义，该属性默认为白色。这两个图元还共享一个用于定义常量的属性：`feDiffuseLighting`\
    \ 的 `diffuseConstant` 和 `feSpecularLighting` 的 `specularConstant`。这个常量决定了光源投射光线的强度。`feSpecularLighting`\
    \ 图元还有一个额外的属性 `specularExponent`，用于控制焦点强度（在图 8-12 中，这将决定点光源反射光斑的大小）。\n\n## 光源\n\
    \n我之前多次提到远距离光源和点光源，但并未解释它们。这指的是由 `feDiffuseLighting` 或 `feSpecularLighting` 图元发出的光源类型。单独这些图元本身并不会发出任何光线；它们需要一个额外的嵌套节点来定义光源。换句话说，在\
    \ SVG 中设置光照涉及定义两个元素：一是外部节点，它定义了光照的目标表面是漫反射还是镜面高光；二是内部节点，它定义了要使用的光源类型。下面是一个在原始\
    \ SVG 中的示例：\n\n共有三种光源节点：`feDistantLight`，一种环境光，均匀地向各个方向发射光线（例如太阳）；`fePointLight`，一种更近的光源，具有明确的焦点；以及\
    \ `feSpotLight`，一种方向光，通过一个可自定义尺寸的锥形形状发射光线。阐述所有三种光源超出了本章的范围，因此我们将只关注前两种：`feDistantLight`\
    \ 和 `fePointLight`。\n\n`feDistantLight` 光源有两个属性：`azimuth`，指定光线的方向角度，以及 `elevation`，指定光源的高度。两者都以度数为单位表示。用太阳来做类比，黎明时分，太阳从东方升起（`azimuth`\
    \ 和 `elevation` 均为 `0`），到了赤道地区的正午，它会上升到 `elevation` 为 `90` 度，即头顶正上方。\n\n`fePointLight`\
    \ 光源没有 `azimuth` 或 `elevation` 属性；它完全由 `x`、`y` 和 `z` 属性定义。`z` 属性对应于光源的高度或海拔，而\
    \ `x` 和 `y` 属性则指代当前坐标空间中的标准二维位置。\n\n## 模拟纹理\n\n让我们开始一个新的项目，并深入实践之前提到的部分理论。复制我们的模板文件夹，并将其重命名为\
    \ `23-rough-paper`，然后在背景下方的常规位置，创建一个羊皮纸颜色的渐变，我们将把它应用到我们的纸张上。纸张本身将是一个由两个形状组成的复合路径（将其撕成两半的结果）。如你所见，可以通过简单地添加一个新的\
    \ `M` 命令（相当于抬起笔，在别处开始新的一行）来扩展路径，使其超出结束 `Z` 命令的范围。设置好撕裂的纸张后，我们将其居中。\n\n```javascript\n\
    // 创建一个羊皮纸颜色的渐变。\nsvg.createGradient('parchment', 'linear', ['#fffbeb', '#fde68a'],\
    \ 90);\n// 为撕裂的纸张创建路径。\nlet paper = svg.create('path').set({\n  fill: 'url(#parchment)',\n\
    \  stroke: '#4444',\n  d: 'M 0,0 h 175 l 175,550 h -350 Z M 210,0 h 340 v 550\
    \ h -165 Z',\n  filter: 'url(#rough-paper)'\n});\n// 将其居中。\npaper.moveTo(500,\
    \ 500);\n```\n\n我们有意让构图保持简单，以便能将更多注意力放在滤镜效果上。接下来，我们将初始化滤镜，并将第一个图元添加到链中：`feTurbulence`。这将构成纸张颗粒纹理的基础。\n\
    \n```javascript\n// 初始化滤镜。\nlet filter = svg.createFilter('rough-paper');\n//\
    \ 添加湍流以模拟纸张颗粒。\nfilter.create('feTurbulence').set({\n  type: 'fractalNoise',\n\
    \  numOctaves: 5,\n  baseFrequency: 0.04,\n  seed: Gen.random(0, 100),\n  result:\
    \ 'turbulence'\n});\n```\n\n画布现在应该充满了 `feTurbulence`。接下来我们要做的是为其添加光照效果，具体来说，是使用一个带有嵌套\
    \ `feDistantLight` 节点作为光照类型的 `feDiffuseLighting` 图元。这个第二个节点我们可以在漫反射光照图元之后直接创建，使用\
    \ SvJs 的方法链。\n\n```javascript\n// 在湍流上添加漫反射光照。\nfilter.create('feDiffuseLighting').set({\n\
    \  surfaceScale: 1,\n  diffuseConstant: 1.3,\n  in: 'turbulence',\n  result: 'lighting'\n\
    }).create('feDistantLight').set({\n  azimuth: 180,\n  elevation: 45,\n});\n```\n\
    \n现在画布上应该已经出现了类似纸张的纹理。接下来，我们将一些湍流数据接入 `feDisplacementMap` 图元，以粗糙处理源图形的边缘。\n\n\
    ```javascript\n// 使用湍流扭曲纸张源图形。\nfilter.create('feDisplacementMap').set({\n  in:\
    \ 'SourceGraphic',\n  in2: 'turbulence',\n  scale: 25,\n  result: 'distortion'\n\
    });\n```\n\n这为我们提供了一个具有磨损边缘的旧纸张轮廓，但还没有纹理。为了重新引入光照效果的结果，我们需要进行一些合成。将光照输出作为前景，粗糙边缘的纸张作为背景，使用\
    \ `in` 运算符将能实现我们想要的效果。\n"
- fmt: '```javascript

    // Merge the lighting with the rough-edged paper.

    filter.create(''feComposite'').set({

    in: ''lighting'',

    in2: ''distortion'',

    operator: ''in'',

    result: ''composite''

    });

    ```


    With the shape now in place and the texture showing through, we have a believable
    rough and ripped paper texture. However, we’re missing one final ingredient: the
    color. To remedy this, we’ll blend the output of `feComposite` with the output
    of `feDisplacementMap` and use a `mode` of `multiply`. This should salvage our
    original parchment gradient.


    ```javascript

    // Re-introduce the parchment gradient.

    filter.create(''feBlend'').set({

    in: ''composite'',

    in2: ''distortion'',

    mode: ''multiply''

    });

    ```


    Figure [8-13](#538894_1_En_8_Chapter.xhtml#Fig13) shows the result. Not bad! While
    not quite impressive enough to stand on its own (in my opinion at least), with
    variations of this effect, you have a means of injecting additional visual interest
    into other generative compositions.


    ![An abstract presents a bright square with a breakage slope line in the center,
    against a dark background.](images/538894_1_En_8_Chapter/538894_1_En_8_Fig13_HTML.png)


    **Figure 8-13** Our rough and ready paper texture


    ## Generative Textures


    The previous example lays the groundwork for what we’ll try next. Simulating textures
    is all well and good, but for the next example, we’ll go full generative, that
    is, relinquish some control and relish the randomness of the results. In the process,
    we’ll also demonstrate the use of specular lighting of the point variety, so you
    can see how it differs from diffuse, distant lighting.


    Copy the template folder and call it `24-rocky-randomness`. Below the background,
    we’ll set up our source graphic, which will be a simple circle. To this circle,
    we’ll apply both a gradient and a filter.


    ```javascript

    // Create our source graphic.

    svg.create(''circle'').set({

    r: 300,

    cx: 500,

    cy: 500,

    fill: ''url(#random-gradient)'',

    filter: ''url(#rocky-randomness)''

    });

    ```


    The next step is to set up a linear gradient. For this, we’ll use an array of
    three random colors, and we’ll also randomize the gradient’s rotation.


    ```javascript

    // A random colour array.

    let colours = [

    `hsl(${Gen.random(0, 360)} 80% 80% / 0.75)`,

    `hsl(${Gen.random(0, 360)} 80% 80% / 0.75)`,

    `hsl(${Gen.random(0, 360)} 80% 80% / 0.75)`

    ];

    // A gradient with a randomised rotation and array of colours.

    svg.createGradient(''random-gradient'', ''linear'', colours, Gen.random(0, 360));

    ```


    Now to the filter. As with our other examples, our first node will be an `feTurbulence`
    primitive, which will act as our primary textural source. The `numOctaves` will
    vary between `2` and `7`, which will allow for quite a degree of variation in
    the level of detail. The `baseFrequency` and `seed` we’ll also randomize.


    ```javascript

    // Initalise the filter.

    let filter = svg.createFilter(''rocky-randomness'');

    // Create the primary turbulence.

    filter.create(''feTurbulence'').set({

    type: ''turbulence'',

    numOctaves: Gen.random(2, 7),

    baseFrequency: Gen.random(0.003, 0.01, true),

    seed: Gen.random(0, 1000),

    result: ''turbulence''

    });

    ```


    Now we have raw turbulence covering the canvas, and while it does vary on each
    refresh, it still feels a little too uniform. How can we create something more
    organic and a little less grid-like? Well, we could distort it with … more turbulence!


    To do this, we’ll set up another `feTurbulence` primitive, this time using `fractalNoise`.
    The `baseFrequency` we’ll ramp up a little, but we’ll keep `numOctaves` and the
    `seed` to a similar range. Then we’ll plug both into `feDisplacementMap`, randomize
    the `scale` value (which determines the strength of the distortion), and set `R`
    and `G` as the x and y channel selectors (purely because I didn’t really like
    the default output of alpha on this occasion).


    ```javascript

    // Set up another instance of turbulence.

    filter.create(''feTurbulence'').set({

    type: ''fractalNoise'',

    numOctaves: Gen.random(3, 7),

    baseFrequency: Gen.random(0.01, 0.07, true),

    seed: Gen.random(0, 1000),

    result: ''noise''

    });

    // Distort the first instance of turbulence with the second.

    filter.create(''feDisplacementMap'').set({

    in: ''turbulence'',

    in2: ''noise'',

    scale: Gen.random(25, 40),

    xChannelSelector: ''R'',

    yChannelSelector: ''G'',

    result: ''distortion''

    });

    ```


    We have some more natural-looking noise now, so let’s spin up some specular lighting
    and see how the noise looks when lit up. We’ll utilize `Gen.random()` on most
    of the attributes, including the point light coordinates.


    ```javascript

    // Shine a specular point light on the distorted output.

    filter.create(''feSpecularLighting'').set({

    in: ''distortion'',

    surfaceScale: Gen.random(5, 30),

    specularConstant: Gen.random(2, 6),

    specularExponent: Gen.random(10, 25),

    result: ''lighting''

    }).create(''fePointLight'').set({

    x: Gen.random([-50, 500, 1050]),

    y: Gen.random([-50, 1050]),

    z: Gen.random(50, 250)

    });

    ```


    For the `x` and `y` coordinates, you’ll notice we’re using `Gen.random()` to pick
    from an array of values rather than a range; if you inspect these values, you’ll
    see that these combinations keep the lighting to the periphery of the canvas.
    This is mainly to prevent any direct shine (think of an unwelcome camera flash
    in a photograph). If you load up the sketch at this point, you should see some
    interesting generative terrain emerge. We’re not done yet though.


    Before we bring the terrain and the source graphic back together, we’re going
    to soften the edges of the latter with some `feGaussianBlur`. We’ll then use `feComposite`
    along with the `in` operator as we’ve done in previous sketches, before recovering
    the original gradient using another `feComposite` primitive, this time with the
    `atop` operator.


    ```javascript

    // Blur the source graphic.

    filter.create(''feGaussianBlur'').set({

    in: ''SourceGraphic'',

    stdDeviation: Gen.random(25, 50),

    result: ''blur''

    });

    // Bring the lit texture in via the blurred source graphic.

    filter.create(''feComposite'').set({

    in: ''lighting'',

    in2: ''blur'',

    operator: ''in'',

    result: ''comp1''

    });

    // Recover the original gradient.

    filter.create(''feComposite'').set({

    in: ''blur'',

    in2: ''comp1'',

    operator: ''atop''

    });

    ```


    And now we’re ready to see some results! Figure [8-14](#538894_1_En_8_Chapter.xhtml#Fig14)
    shows a render I particularly liked, but the variation in this sketch is quite
    large so it’s best to play around until you land on something you like.


    ![An abstract presents a circle with a rock-like pattern, against a dark background.](images/538894_1_En_8_Chapter/538894_1_En_8_Fig14_HTML.png)


    **Figure 8-14** Specular random rockiness


    And that concludes our foray into filters. As I mentioned before, there’s so much
    more to explore where filters are concerned, and there are quite a few primitives
    I didn’t have the space to touch on. It definitely warrants (and rewards) further
    independent exploration.


    ## Summary


    Let’s do a quick recap of what was covered in this our penultimate chapter:


    - How filters are constructed

    - Filter regions and the SvJs `createFilter()` method

    - Basic primitives like `feGaussianBlur`, `feFlood`, and `feDropShadow`

    - More complex primitives like `feComposite` and `feBlend` that tie other primitives
    together

    - The power of the `feTurbulence` primitive and its creative possibilities

    - Distorting other primitives using `feDisplacementMap`

    - Lighting and how three dimensions can be simulated using bump maps

    - Diffuse and specular lighting and the various light source types

    - How turbulence, displacement, and lighting can be used together to simulate
    and generate textures


    In the next chapter, we’ll wrap things up and touch on some topics that can help
    take your generative art to the next level.


