    ## 总结\n\n虽然关于噪声还有很多值得探索的地方，但我们在这里已经涵盖了基础知识，并且我们将在接下来的章节中再次使用噪声。如果你想更深入地研究噪声的细节，我建议你查看一些第三方库，比如流行的\
    \ `SimplexJS`，它超越了二维空间，允许更自由地配置（不过代价是文件体积更大）。\n\n在我们继续之前，让我们快速回顾一下本章涵盖的内容：\n\n\
    -   在创建更具有机形态时随机性的局限性，以及噪声如何解决这个问题\n-   抽象噪声空间背后的理论\n-   如何通过 SvJs 的 `Noise` 模块将其付诸实践\n\
    -   如何在循环中遍历噪声空间\n-   如何使用噪声值修改元素的坐标和颜色\n-   将噪声值映射并约束到更有用的范围\n-   使用 CSS 优化重复的元素属性\n\
    -   非破坏性的元素旋转\n\n在下一章中，我们将介绍 SVG 规范中的一个基础部分：功能强大的路径元素。\n\n# 6. 全功能路径\n\n路径也许是\
    \ SVG 规范中最重要、最强大的部分。大多数 SVG 文件，无论是简单的图标还是复杂的艺术作品，主要由路径数据构成。例如，如果在 Inkscape 或 Illustrator\
    \ 等矢量图形程序中绘制任何比基本图形更复杂的图形，你实际上就是在处理路径。而且，要在 JavaScript 和 SvJs 中手动编写路径代码，你不需要是数学天才。\n\
    \n本章将涵盖路径元素及其相关命令，这些命令数量众多，需要有自己的小节。路径可能会很快变得复杂，因此我们还会介绍一些 SvJs 方法来简化我们的工作。\n\n\
    ## 路径元素\n\n设置路径很简单；我们只需像创建大多数其他元素一样调用 SvJs 的 `create()` 方法：\n\n```\nlet path =\
    \ svg.create('path');\n```\n\n路径接受其他图形元素通常使用的 `fill` 和 `stroke` 属性，但与其他图形元素（如\
    \ `rect` 和 `circle`）不同，路径本身没有内在的形状或形式。这完全取决于我们来定义，我们通过 `d` 属性来完成。\n\n### D 代表数据\n\
    \n`d` 属性允许我们向路径填充数据。这些数据由一系列路径命令和相应的数值组成，这些数值定义了路径的形状。整个数据作为一个字符串传入。\n\nSVG 规范的创建者知道\
    \ SVG 文件中会大量使用路径，因此创建简洁的路径命令是控制总体文件大小（以千字节计）的关键部分。因此，命令是单个字符长度，就像它们传递给的 `d` 属性一样，并且伴随命令的值也可以灵活格式化以节省空间。\n\
    \n```\n// 路径数据字符串的示例。\npath.set({\nd: 'M 20,20 L 30,20 L 30,30 L 20,30 Z'\n});\n\
    // 一个使用更简洁字符串的相同路径。\npath.set({\nd: 'M20 20L30 20L30 30L20 30Z'\n});\n```\n\n\
    我们将在后面的章节中详细介绍类似的示例是如何工作的；现在，只需注意，完全相同的路径数据可以用逗号分隔值，也可以用空格分隔命令，或者两者都不用。\n\n###\
    \ 路径命令\n\n你可以将路径命令视为绘图指令。每个命令由一个字母表示，该字母可以是大写或小写。大写版本表示其后的数值将使用绝对坐标（因此命令 `M 50,50`\
    \ 意味着移动到 `viewBox` 中 `50,50` 的确切位置），而小写版本表示将使用相对坐标（因此命令 `m 50,50` 意味着相对于上一个已知位置在\
    \ x 和 y 轴上都移动 `+50`）。\n\n总共有十个命令；如果算上两种大小写版本，那就是二十个。如果你认为这很多，那你是对的！确实是很多。但是，考虑到这些命令可以组合起来创建任何可能的二维形状，这些命令的效率之高令人惊叹。有些命令比其他命令更常见，有些更复杂，有些我们只会演示一次，之后不会再使用。\n\
    \n### 路径的起点和终点\n\n所有路径都有一个起点。对于 SVG 而言，所有路径都始于我们移动虚拟笔的那个点。我们为此使用 `M`（或 `m`）命令，它代表“移动到”。我们后面要跟上一个\
    \ x 和 y 坐标对来定义路径的起点。`M` 命令本身不绘制任何东西——它仅仅是将我们移动到想要开始绘制的点。可以这么说，我们的笔还没有落在纸上。\n\n\
    ```\n// M/m 命令的语法。\n'M [x, y] ...'\n'm [dx, dy] ...'\n// M/m 命令的示例。\n'M 50 100\
    \ ...'\n'm 50 100 ...'\n```\n"
- fmt: 'We can provide an optional `Z` command at the very end of a path to close
    it. Paths without a closing `Z` command remain open (i.e., the starting point
    and end point remain unconnected). `Z` will draw a straight line to connect these
    two points unless the end point is a curve, in which case it will follow the curvature
    of the last control point (this will make more sense later on).


    ```

    // Closing a path.

    ''M 50 100 ... 50 150 Z''

    ```


    Unlike other path commands, the lowercase `z` and uppercase `Z` perform identical
    operations, as no values follow them. This means you can use them interchangeably.


    ## Straight Lines


    To ease us into path creation, we’ll start with the straight line. There are actually
    a few different commands that can draw a straight line, but we’ll start with the
    most obvious.


    ### The Simple L


    The `L` command allows us to draw straight lines defined by an x and y coordinate
    pair. The lowercase `l` does the same but uses coordinates relative to the path’s
    last entered point.


    ```

    // Syntax for the L/l command.

    ''L [x, y] ...''

    ''l [dx, dy] ...''

    ```


    Let’s see what this looks like in practice. In the following example, two lines
    are used to create two instances of the letter L. The first uses absolute coordinates;
    the second uses relative coordinates.


    ```

    // The first L.

    svg.create(''path'').set({

    d: ''M 300 200 L 300 800 L 600 800''

    });

    // The second L.

    svg.create(''path'').set({

    d: ''M 675 825 l 0 -600 l -300 0''

    });

    ```


    We can see a rendering of the preceding code in Figure [6-1](#538894_1_En_6_Chapter.xhtml#Fig1).
    I’ve left out any elements and attributes extraneous to the example and focused
    on just the path data. As you can see, you can use either of the `L` commands
    to achieve similar results.


    When creating paths manually in this manner, some readers may find absolute coordinates
    more intuitive to work with, while others may find relative coordinates easier
    to use. Relative coordinates can be especially useful if, say, you wanted to move
    a path’s location without disturbing its shape; with absolute coordinates, we’d
    have to change all the subsequent numbers, whereas with relative coordinates,
    we’d only have to change the initial `M` point.


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig1_HTML.png)


    An abstract presents a square with an L and a reverse L, against a dark background.


    **Figure 6-1** Two L''s drawn by two L commands


    ### Horizontal and Vertical Varieties


    If the lines that we’re drawing are either horizontal or vertical, we can use
    the `H` or `V` commands as a shortcut, as they only need the one parameter; in
    the case of `H` or `h`, the x coordinate, and in the case of `V` or `v`, the y
    coordinate.


    ```

    // Syntax for the H/h command.

    ''H [x] ...''

    ''h [dx] ...''

    // Syntax for the V/v command.

    ''V [y] ...''

    ''v [dy] ...''

    ```


    These commands I don’t find particularly useful for generative art, but it’s worth
    knowing they’re there should you want to use them. Let’s create the same L shapes
    from Figure [6-1](#538894_1_En_6_Chapter.xhtml#Fig1), but with `H` and `V` this
    time, including their lowercase versions.


    ```

    // The first L.

    svg.create(''path'').set({

    d: ''M 300 200 V 800 H 600''

    });

    // The second L.

    svg.create(''path'').set({

    d: ''M 675 825 v -600 h -300''

    });

    ```


    ### Further Economies


    Before we move on to curves, it’s worth pointing out if we are using successive
    path commands of the same type, the command itself can be removed rather than
    repeated. SVG renderers are intelligent enough to know that if a path command
    is omitted, the last-known command should be used. Let’s show a quick example
    (the output of which is shown in Figure [6-2](#538894_1_En_6_Chapter.xhtml#Fig2)).


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig2_HTML.png)


    An abstract presents a rectangular-shaped structure with a triangular waveform,
    against a dark background.


    **Figure 6-2** Omitting repetitive commands


    ```

    // The first path, with repeating L commands.

    svg.create(''path'').set({

    d: ''M 10 10 L 20 20 L 30 10 L 40 20 L 50 10 L 60 20 L 70 10''

    });

    // The second (identical) path, with the repeating L commands omitted.

    svg.create(''path'').set({

    d: ''M 10 10 L 20 20 30 10 40 20 50 10 60 20 70 10''

    });

    ```


    ## Quadratic Bezier Curves


    The first curve we’ll cover is the quadratic Bezier curve. Don’t worry – the rather
    daunting name doesn’t reflect its complexity. As far as curves go, it’s relatively
    simple. Two sets of coordinates are required: the first set defines the control
    point (which we’ll explain in a moment), and the second the destination point.


    ```

    // Syntax for the Q/q command.

    ''Q [cpx cpy x y] ...''

    ''q [dcpx dcpy dx dy] ...''

    ```


    ### Control Points


    If you imagine a control point as a force of attraction, or pull, toward which
    a curve bends, you’ll have the right idea. Control points aren’t themselves rendered,
    but if you look at the dot and dashed line in Figure [6-3](#538894_1_En_6_Chapter.xhtml#Fig3),
    you can see a visualization of the force a control point exerts over its curve
    (in this case, a quadratic Bezier curve). In this example, the dot represents
    the control point coordinates of `[150, 350]`, given the following path:


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig3_HTML.png)


    An abstract presents a square-shaped structure with an upward parabola and a V-shaped
    chain pattern, against a dark background.


    **Figure 6-3** The control point of a quadratic Bezier curve


    ```

    ''M 50 150 Q 150 350 250 150''

    ```


    A quadratic Bezier curve has just the one control point, whereas the cubic Bezier
    curve (explored in a later section), has two.


    ### A Smooth Shortcut


    Say we wanted to extend the path from Figure [6-3](#538894_1_En_6_Chapter.xhtml#Fig3)
    and draw a smooth set of waves repeating at regular intervals. The difficulty
    in doing this manually is with the calculation of the control point; if it’s not
    perfectly symmetric with the previous one, a “kink” will appear in our curve (see
    Figure [6-4](#538894_1_En_6_Chapter.xhtml#Fig4)). Now, in this particular case,
    it’s not that arduous a job to calculate a control point that would correct this,
    but in more complex cases, this can become a challenge.


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig4_HTML.png)


    An abstract presents a rectangular-shaped structure, which has a sinusoidal waveform
    with distortion in the center, against a dark background.


    **Figure 6-4** A kink in the curve


    This is where the `T` command can help us. It extends a quadratic Bezier curve
    based on the previous curve’s control point, essentially “mirroring” or reflecting
    it. The result is a smooth curve with a symmetric control point, and it requires
    just a single set of coordinates.


    ```

    // Syntax for the T/t command.

    ''T [x y]''

    ''t [dx dy]''

    ```


    Let’s extend the curve from Figure [6-4](#538894_1_En_6_Chapter.xhtml#Fig4), adding
    a few extra undulations to it. In the following example code, I’m adding some
    commas to the coordinates for the sake of readability, but remember that they’re
    not actually required. I’m also taking advantage of the fact that I don’t need
    to repeat the `T` command when using it several times consecutively. This is why
    you’ll only see it used once for the four coordinates that follow.


    ```

    // Extending a quadratic curve with the smooth T command.

    svg.create(''path'').set({

    d: ''M 50,150 Q 150,350 250,150 T 450,150 650,150 850,150 1050,150''

    });

    ```


    Figure [6-5](#538894_1_En_6_Chapter.xhtml#Fig5) is the result, with some circular
    highlights added in to distinguish the initial `M` point (yellow) and the full
    `Q` curve (the purple second point) from the four additional `T` points (in red).


    ![](images/538894_1_En_6_Chapter/538894_1_En_6_Fig5_HTML.png)


    An abstract presents a rectangular-shaped structure, which has a continuous sinusoidal
    waveform with dots at the starting and ending points of the cycle, against a dark
    background.


    **Figure 6-5** A smooth quadratic curve'
