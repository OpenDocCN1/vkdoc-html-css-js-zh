    \ by using the `typeof` check.\n\n```\ntypeof null;\n-> object\n```\n\nDespite\
    \ this, `null` is not\nconsidered an instance *of* an object. We can confirm this\
    \ by\nusing the `instanceof` check.\n\n```\nnull instanceof Object;\n-> false\n\
