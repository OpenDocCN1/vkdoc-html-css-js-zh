    \ is different. This means\nthat the `lower bound` and `upper bound` variables\
    \ must be\ncalculated *inside* the animation loop, as they will vary per\ncircle.\
    \ There are, however, a couple of static values that can be\ncaptured outside\
    \ the loop and used later inside it: the frame edge and\nframe inset. Delete the\
