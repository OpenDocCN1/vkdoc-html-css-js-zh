  trans: '

    # 空值


    空值是我们最后要介绍的值类型。共有两种：`null` 和 `undefined`。你可以将它们理解为不携带任何信息的值。在调试代码时你会经常遇到它们（尤其是
    `undefined`），所以可以想象，它们并非总是受欢迎的访客。


    `null` 和 `undefined` 有什么区别？一种简化的理解方式是：当 JavaScript 告诉你一个名为 `x` 的变量是 `null` 时，它是在说：“我知道
    `x`，但据我所知，`x` 目前没有任何值。” 另一方面，如果它告诉你 `x` 是 `undefined`，那基本上是在说：“`x` 是个什么鬼？这里压根没有
    `x` 这玩意儿。”


    # 变量


    我们已经多次提到过“变量”这个词，那么它们到底是什么呢？你可以把变量想象成存储值的容器，这些值可以在后续被引用。


    变量在使用前必须先声明。有三种声明方式：使用 `const`、`let` 或 `var`。其中，`var` 已不再推荐使用；我提到它主要是出于历史原因，并且因为你在实际代码中很可能会遇到它。现在很多很多的
    JavaScript 代码库仍然在使用 `var`，仅仅是因为在 2015 年那次重大的 JavaScript 更新（称为 ECMAScript 6，简称
    ES6）之前，没有其他选项可用。


    声明一个变量需要使用关键字，创建一个名称/标识符，然后使用等号运算符为其赋值。


    ```

    const name = ''David Matthew'';

    const countryOfBirth = ''Ireland'';

    let age = 21; // 我希望如此！

    ```


    `const` 和 `let` 有什么区别？使用 `const` 时，你声明的值是不应更改的。我的 `countryOfBirth` 就是一个例子：这是一个恒定不变的历史事实。如果之后我试图给
    `countryOfBirth` 重新赋值，会导致错误：


    ```

    countryOfBirth = ''Brazil''; // 哎呀...

    -> TypeError: Assignment to constant variable

    ```


    然而，我的 `age`（唉）是会变化的，所以可以毫无问题地更新它。`const` 和 `let` 的另一个区别是，`let` 可以在声明时不赋值，而使用 `const`
    时，必须在首次创建时就为其赋值。


    ```

    let a; // 没问题。

    const b; // 自找麻烦。

    -> Uncaught SyntaxError: Missing initializer in const declaration

    ```


    如果不确定，应该使用 `const` 还是 `let`？JavaScript 社区的普遍共识是，你应该默认使用 `const`，只有当认为变量之后可能被赋予新值时，才使用
    `let`。理由是这样可以减少意外的值重新赋值，从而排除一个潜在的 bug 来源。


    # 运算符


    运算符是对值执行运算的符号。我们实际上已经见过一个了：赋值运算符（`=`），它将一个值赋给一个变量。让我们看看还有哪些其他类型的运算符可供使用。


    ## 算术运算符


    你可能已经猜到了，算术运算符允许我们执行数学运算。加法运算符（`+`）允许我们相加数字，但它也允许我们拼接字符串。


    ```

    // 数字相加。

    2 + 2

    -> 4

    // 字符串拼接。

    ''I am'' + '' so smrt''

    -> ''I am so smrt''

    ```


    还有减法（`-`）、乘法（`*`）和除法（`/`）运算符。


    ```

    // 数字相减。

    9 - 4

    -> 5

    // 数字相除。

    9 / 4

    -> 2.25

    // 数字相乘。

    9 * 4

    -> 36

    ```


    ES6 引入了指数运算符（`**`），它允许你计算一个数的另一个数次方。


    ```

    // 指数运算符。

    2 ** 2

    -> 4

    2 ** 6

    -> 64

    2 ** 10

    -> 1024

    ```


    最后，还有取模运算符（`%`）。它将一个数除以另一个数，并返回余数。这在循环遍历数组（我们稍后会讲到）时，或者快速判断一个未知数是偶数还是奇数时，会特别有用。


    ```

    // 取模运算符的使用。

    3 % 3

    -> 0

    3 % 2

    -> 1

    12 % 5

    -> 2

    ```

