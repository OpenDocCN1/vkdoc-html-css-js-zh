  raw: "Systems Simulations\nFrom simple rules, unexpected complexity often emerges;\
    \ this is not\nonly true for fractals, but for a number of natural systems. Simulating\
    \ such\nsystems is usually the business of serious science, but in the more\n\
    advanced areas of generative art, you’ll see simulations of basic\nphysics (think\
    \ gravity, mass, density, etc.), particle systems (like\nfog, fire, and smoke),\
    \ and organic behavior (from single cell\ninteractions to the flocking patterns\
    \ of birds).\nNow, SVG isn’t always the medium of choice for systems simulations\n\
    `–` particle\nsystems, for example, will perform better in pixel-based environments\n\
    like the HTML canvas `–` but performance\nconcerns aside, if you’re looking to\
    \ add an extra layer to your\ncompositions, sprinkling a bit of science on top\
    \ of the art, simulating\nnatural systems can certainly be worth the work involved.\
    \ A single\nsketch could become the basis of an endless stream of creative output,\n\
    as much application as artwork.\nJohn Conway’s Game of Life is a good example\
    \ of an organic\nsimulation; it’s a grid-based, zero-player game that simulates\
    \ patterns\nof growth, decline, and evolution. Each cell in the grid can be in\
    \ one\nof two states: “alive” or “dead.” Living cells contain a fill color;\n\
    dead cells do not.\n\nThe rules that underpin the game are surprisingly simple,\
    \ yet complexity\ncan nonetheless emerge in the form of unexpected patterns and\
    \ clusters\nof cells battling it out for survival. These rules are as follows:\n\
    \n1.  Any living cell with either one or zero neighbors dies.\n\n2.  Any living\
    \ cell with either two or three neighbors survives to the\n    next “generation”\
    \ (or iteration).\n\n3.  Any living cell with four or more neighbors dies.\n\n\
    4.  Any empty (i.e., dead) cell with exactly three neighbors spawns to\n    life.\n\
    \nFigure [9-4](#538894_1_En_9_Chapter.xhtml#Fig4) shows a game a\nfew generations\
    \ in. Some clusters (like the square of cells in the top\nleft and bottom right\
    \ corners) are in stasis, meaning they survive but\ndon’t spread and thrive. Other\
    \ cells are actively sprawling, exploring,\ndisappearing, and re-spawning. It\
    \ can be fun to watch!\n\n![](images/538894_1_En_9_Chapter/538894_1_En_9_Fig4_HTML.png)\n\
    \nAn abstract presents a square-shaped structure, which has a\ngrid-shaped pattern\
    \ with several squares. Some squares in the center,\ntop left, top right, bottom\
    \ left, and bottom right are highlighted.\n\nFigure 9-4\nA snapshot of a Game\
    \ of Life in action\n\nI’ll link to more examples for you to play with at [`davidmatthew.ie/generative-art-javascript-svg/#systems-simulations`](http://davidmatthew.ie/generative-art-javascript-svg/%2523systems-simulations%25ef%25bb%25bf),\n\
    including other kinds of simulations.\n\nClosing Comments\n\nAt this stage, I’ve\
    \ done enough summarizing, so I’d like to leave you\nwith some (rather opinionated)\
    \ parting tips to support you in your\ngenerative endeavors:\n\n*   Be comfortable\
    \ never knowing enough. With any kind of coding,\n    there’s always so much more\
    \ to know. And that’s ok.\n\n*   Try to block off bits of time to play with code;\
    \ you don’t need\n    to commit to all-nighters. Small habit-forming steps are\
    \ more\n    sustainable than the odd sprint here and there.\n\n*   Embrace simplicity;\
    \ generative art doesn’t have to be complicated\n    to be good.\n\n*   Take inspiration\
    \ from other artists; reverse-engineer examples\n    that inspire you.\n\n*  \
    \ Don’t just copy; understand what you implement, and always put\n    your own\
    \ spin on things. It’ll help you develop your own style.\n\n*   Give back. Get\
    \ involved in the community. Contribute code,\n    constructive critiques, or\
    \ simply leave a positive comment on another\n    artist’s work and let them know\
    \ you appreciate their efforts.\n\n*   And finally, appreciate your own efforts,\
    \ regardless of the\n    results. Output isn’t everything, and your generative\
