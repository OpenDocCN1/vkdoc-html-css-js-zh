  trans: "好的，作为一名高级文档工程师和翻译员，我将严格按照您的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n# 系统模拟\n\n简单的规则，往往会衍生出意想不到的复杂性；这不仅适用于分形，也适用于许多自然系统。模拟这类系统通常是严肃科学的工作，但在生成式艺术的更高级领域，你会看到对基础物理学（如重力、质量、密度等）、粒子系统（如雾、火、烟）以及有机行为（从单细胞相互作用到鸟类的群集模式）的模拟。\n\
    \n现在，`SVG` 并非系统模拟的首选媒介——例如，粒子系统在基于像素的环境（如 HTML 的 canvas）中性能更好——但撇开性能问题不谈，如果你希望为自己的作品增添一个额外的层次，在艺术之上撒上一点科学的佐料，那么模拟自然系统绝对值得你投入精力。一个简单的草图就可能成为源源不断创意的输出基础，既是艺术品，也是应用。\n\
    \n`John Conway's Game of Life` 是有机模拟的一个很好的例子；它是一款基于网格、零玩家的游戏，模拟了生长、衰落和演化的模式。网格中的每个细胞可以处于两种状态之一：“存活”或“死亡”。存活的细胞有填充颜色；死亡的细胞则没有。\n\
    \n支撑这款游戏的规则出奇地简单，但复杂性却可以以意想不到的模式和争夺生存权的细胞团块的形式涌现出来。这些规则如下：\n\n1.  任何邻居数量为一个或零个的存活细胞会死亡。\n\
    2.  任何邻居数量为两个或三个的存活细胞会存活到下一“代”（或迭代）。\n3.  任何邻居数量为四个或更多的存活细胞会死亡。\n4.  任何恰好有三个邻居的空（即死亡）细胞会诞生为新细胞。\n\
    \n图 9-4 展示了游戏进行几代后的一个快照。一些细胞团（如左上角和右下角的方形细胞群）处于停滞状态，这意味着它们存活但不会扩散和繁衍。其他细胞则在活跃地蔓延、探索、消失和重生。观察起来会很有趣！\n\
    \n![](img/538894_1_En_9_Fig4_HTML.png)\n\n一张抽象图呈现了一个方形结构，其内部有网格状图案，包含多个正方形。中心、左上角、右上角、左下角和右下角的一些正方形被高亮显示。\n\
    \n**图 9-4**  \n一个正在运行的生命游戏的快照\n\n我将链接更多示例供你尝试，请访问 [`davidmatthew.ie/generative-art-javascript-svg/#systems-simulations`](http://davidmatthew.ie/generative-art-javascript-svg/%2523systems-simulations%25ef%25bb%25bf)，其中包括其他类型的模拟。\n\
    \n## 结语\n\n至此，我总结得已经够多了，所以我想留给你一些（颇为主观的）告别建议，以支持你的生成式艺术创作之旅：\n\n-   安于永不知足。对于任何类型的编程，总有太多东西需要去了解。这没关系。\n\
    -   尽量腾出零碎时间玩代码；你不必非得通宵达旦。养成小习惯式的步骤比偶尔的冲刺跑更可持续。\n-   拥抱简单；生成式艺术不必复杂也能优秀。\n-  \
    \ 从其他艺术家那里汲取灵感；逆向工程那些激励你的示例。\n-   不要只是抄袭；理解你所实现的东西，并且总是加上你自己的风格。这将有助于你发展自己的风格。\n\
    -   回馈。参与社区。贡献代码、建设性的批评，或者只是在他人的作品下留下积极的评论，让他们知道你欣赏他们的努力。\n-   最后，无论结果如何，都要欣赏自己的努力。产出不是一切，你的生成式艺术之旅是属于你自己的。\n\
