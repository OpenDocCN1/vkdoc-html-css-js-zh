    \    statements and control flow\n\n*   While\n    loops, for loops, and forEach\
    \ loops\n\n*   Functions and scope\n\n*   Arrays and array methods\n\n*   Objects\
    \ and object properties, and alternatives to global\n    variables\n\n*   Some\
    \ of JavaScript’s quirkier features\n\nI’ve assumed next to no coding knowledge,\
    \ so if that describes your\nstarting point and you’ve still kept up, well done!\n\
    In the next chapter, we’ll explore the main functionality of the SvJs\nlibrary\
