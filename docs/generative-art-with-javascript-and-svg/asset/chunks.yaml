- fmt: "\n如果你重新审视我们的第一个草图，你会注意到我使用了一个对象来存储一些随机化设置，这些设置稍后在草图中被调用：\n\n```\n...\nconst\
    \ randomised = {\n  hue: random(0, 360),\n  rotation: random(-180, 180),\n  iterations:\
    \ random(10, 100)\n};\n...\nlet rotation = randomised.rotation + (i * 2);\n```\n\
    \n这是解决我之前提到的全局变量问题的一个好方法。通过使用对象，我们可以使我们的设置全局可用，而不必依赖全局变量。这可以使我们的代码更整洁，并且更不容易引起冲突。\n\
    \n## 类\n\n类（`Class`）就像是创建对象的蓝图或模板。创建出来的对象被称为该类的一个**实例**。一个类可以包含数据以及操作这些数据的函数。这种数据和代码的耦合被称为封装。我们不会深入讲解类的细节，但了解一些基本术语会很有用，因为我们即将使用的`SvJs`库就是基于类的。\n\
    \n要创建类的实例，我们使用`new`关键字，后面跟上类名和括号。这会调用该类的`constructor`（构造函数）。\n\n```\n// 定义一个类。\n\
    class StarShip {\n  // ...\n}\n// 实例化（或构造）一个类。\nconst prometheus = new StarShip();\n\
    ```\n\n属于类的函数被称为方法。一个类通常至少包含用于获取和设置其属性的方法。\n\n```\nprometheus.setDestination =\
    \ 'Moon LV-223, Zeta 2 Reticuli';\nprometheus.takeOff();\n```\n\n当我们在[第一章](#538894_1_En_1_Chapter.xhtml)创建第一个生成式SVG时，我们首先创建了一个`SvJs`类的实例并调用了一些它的方法。\n\
    \n```\nconst svg = new SvJs();\nsvg.addTo(document.getElementById('container'));\n\
    ```\n\n这就是我们使用类的全部范围了；编写类不属于本书的内容。\n\n## 奇异性与其他特性\n\nJavaScript提供了许多其他特性，包括闭包、错误捕获、代理、Promise等等，但我无法在此全部涵盖。我将在此指出的是JavaScript的一些怪癖——或者客气点说是**古怪之处**——这些可能会困扰使用其他语言的程序员。\n\
    \n### `null`和`NaN`的怪异之处\n\n我们之前了解到`null`本质上就是信息的缺失。那么，`null`也**被认为是一个对象**，这难道不奇怪吗？我们可以通过使用`typeof`检查来确认这一点。\n\
    \n```\ntypeof null;\n-> object\n```\n\n尽管如此，`null`并不被认为是对象的实例。我们可以通过使用`instanceof`检查来确认这一点。\n\
    \n```\nnull instanceof Object;\n-> false\n```\n\n`NaN`（非数字）同样呈现出一些量子级别的怪异，足以让薛定谔的猫都竖起耳朵。它显然不是一个数字，但同时却等于一个数字。而且，奇怪的是，它甚至不等于自身。\n\
    \n```\ntypeof NaN;\n-> Number\nNaN === Number;\n-> false\nNaN === NaN\n-> false\n\
    ```\n\n### 隐式类型转换\n\nJavaScript在幕后做一些来自更严格语言背景的程序员可能不总是欣赏的事情。例如，它在数据类型方面是出了名的松散，并会根据情况将不同类型的变量转换为匹配的类型（转换数据类型的过程也称为**类型转换**）。让我们以一些数字为例。\n\
    \n```\n1 == 1;\n-> true\n1 == \"1\";\n-> true\n```\n\n一个数字怎么可能等于一个字符串？嗯，它不能。JavaScript正在将字符串转换为数字以便理解表达式。它本质上是在将字符串数据强制转换为数字数据（也称为**类型强制转换**）。这就是为什么我们最好在JavaScript中使用严格相等运算符的原因，这在许多其他语言中是不存在的。\n\
    \n```\n1 === \"1\";\n-> false\n```\n\n当我们尝试将数字与字符串相加时，也会发生这种转换，但方向相反；在这种情况下，数字被转换为字符串。\n\
    \n```\n1 + \"2\";\n-> \"12\"\n\"2\" + 3;\n-> \"23\"\n```\n\n为了避免这种隐式类型强制转换的陷阱，可以使用像`parseInt()`、`parseFloat()`和`toString()`这样的函数来重新转换或显式地将变量转换为你想要的数据类型。\n\
    \n### 分号的不确定性\n\n我在本章开头提到过，如果你愿意，可以不用分号编写JavaScript，但在某些边界情况下，这可能导致意外行为。这里就有一个这样的边界情况。\n\
    \n```\nreturn\n1 + 2\n-> undefined\n```\n\n在JavaScript中，空格无关紧要，那么这里发生了什么？为什么表达式没有返回`3`？嗯，这里**自动分号插入**功能在幕后被调用了。实际被评估的代码是这样的：\n\
    \n```\nreturn;\n1 + 2;\n```\n\n为了避免这种情况，要么熟悉这类边界情况，要么就使用分号。\n\n## 总结\n\n我们在本章中涵盖了很多内容：\n\
    \n*   JavaScript 的基本语法规则\n*   值，例如字符串、数字和布尔值\n*   变量及其不同的声明方式\n*   算术运算符、比较运算符和逻辑运算符\n\
    *   条件语句和控制流\n*   `while`循环、`for`循环和`forEach`循环\n*   函数和作用域\n*   数组和数组方法\n*  \
    \ 对象和对象属性，以及全局变量的替代方案\n*   JavaScript 的一些比较古怪的特性\n\n我假设你几乎没有编码知识，如果这描述的是你的起点，而你依然跟上了，那么做得好！\n\
    在下一章中，我们将探索`SvJs`库的主要功能，并熟练地创建基本形状、线条和颜色。\n\n# 3. 关于SVG的一切\n\n掌握了JavaScript的基础知识，你已经准备好使用`SvJs`了，你可以把它想象成你的生成式画笔和调色板。\n\
    在本章中，我们将涵盖：设置我们的SVG画布；如何处理线条和颜色；如何创建一系列简单形状；如何添加文本和标题；如何定义和重用元素；如何使用组、渐变和图案；以及SVG的`viewBox`和视口是如何工作的；在这个过程中，我们将学习`SvJs`库的核心函数，以及它与SVG规范的关系。\n\
    \n## 父级SVG元素\n\n在我们创建任何视觉内容之前，我们需要加载我们的库并设置父级SVG元素。父级SVG，也称为SVG文档片段，是指其父元素（如果有的话）不在SVG命名空间中的那个SVG元素。一个例子是附加到HTML\
    \ DOM节点上的SVG。\n\n这值得一提，仅仅是因为SVG可以包含其他SVG；在这种情况下，只有一个可以被视为父级SVG元素。你可能也会看到它被称为**根元素**。\n\
    \n让我们重新打开我们在[第一章](#538894_1_En_1_Chapter.xhtml)中设置的JavaScript模板文件（它应该位于`sketches/00-template/sketch.js`路径下），并向其中添加以下代码行：\n\
    \n```\n// 父级SVG。\nconst svg = new SvJs();\n```\n\n`new SvJs()`构造函数，如果调用时不带任何参数，会创建一个SVG元素。它也可以用于通过传入元素名称作为字符串来创建任何其他SVG元素。\n\
    \n```\n// 使用SvJs构造函数创建一个圆形元素。\nconst circle = new SvJs('circle');\n```\n\n要将父级SVG元素添加到我们的网页中，我们使用`SvJs`的`addTo()`方法。在这种情况下，我们将传入我们在HTML中之前设置的、`id`为`container`的`<div>`（参见[第一章](#538894_1_En_1_Chapter.xhtml)）。将以下内容添加到模板草图中：\n\
    \n```\nconst container = document.getElementById('container');\nsvg.addTo(container);\n\
    ```\n\n`SvJs`中的大多数函数都是可链式调用的，这意味着你可以使用点号表示法将它们链接在一起，就像这样：\n\n```\nmethodOne().methodTwo();\n\
    ```\n"
