  trans: "\n# 遮罩你的内容\n\n`mask`（遮罩）与`clipPath`（裁剪路径）非常相似，区别在于它允许不同程度的透明度。`clipPath`是一种全有或全无的方式：你要么位于定义其形状的边界内部，要么在外部。而使用`mask`，你可以根据形状的亮度或明度来淡入或淡出内容。因此，在创建遮罩时，最直接的方式是使用黑白两色。白色（`#ffffff`）对应完全透明的区域，而黑色（`#000000`）则对应完全不透明的区域。\n\
    \n在图 4-14 中，三角形是`mask`的形状，将其应用于`rect`后的结果显示在右侧。\n\n![](img/538894_1_En_4_Fig14_HTML.png)\n\
    \n一张示意图展示了一个带有阴影的方形，它被添加到一个单色三角形上，最终生成一个具有与方形阴影相似的渐变色的三角形，背景为深色。\n\n**图 4-14**\
    \  \n遮罩的工作原理\n\n与`clipPath`类似，`mask`元素需要一个`id`，并通过指向此`id`的 URL 引用将其应用于另一个元素。我们要做的是创建一个带有`circle`形状的遮罩，这个`circle`的填充将包含一个径向渐变。然后，我们将它应用于之前创建的`portoPareto`组。\n\
    \n```\n// 创建一个径向渐变。\nsvg.createGradient('radialGrad', 'radial', ['#ffffff', '#ffffff60']);\n\
    // 创建一个遮罩，并在其内部创建一个带有径向渐变的圆形。\nlet mask = svg.create('mask').set({ id: 'mask'\
    \ });\nmask.create('circle').set({\ncx: 500, cy: 500, r: 325, fill: 'url(#radialGrad)',\n\
    });\n// 将遮罩应用于该组。\nportoPareto.set({ mask: 'url(#mask)' });\n```\n\n现在你应该能看到城市景观被裁切成了这个圆形的形状，并且边缘略微淡出。作为最后一步，我添加了一个带渐变的圆形描边，以便更清晰地勾勒出内容。\n\
    \n```\n// 为我们的圆形边框创建一个线性渐变。\nsvg.createGradient('strokeGrad', 'linear', ['#eeeeee',\
    \ '#eeeeee15']);\n// 创建边框并应用渐变。\nsvg.create('circle').set({\ncx: 500, cy: 500,\
    \ r: 345, fill: 'none',\nstroke: 'url(#strokeGrad)', stroke_width: 2.5\n});\n\
    ```\n\n结果的一个变体显示在图 4-15 中。\n\n![](img/538894_1_En_4_Fig15_HTML.png)\n\n一张示意图展示了一个高亮的圆形，内部有若干垂直条，周围环绕着渐变色，背景为深色。\n\
    \n**图 4-15**  \n我们的波尔图帕累托城市景观\n\n## 本章小结\n\n在本章中，我们涵盖了以下内容：\n\n-   坐标、颜色、元素尺寸等的随机化\n\
    -   如何从一维和二维数组中随机选取项目\n-   使用嵌套`for`循环构建规则网格\n-   如何使用`clipPaths`和遮罩\n-   利用偶然性作为触发元素创建的方法\n\
    -   如何使用高斯和帕累托概率分布\n\n在下一章中，我们将学习如何使用噪声（noise）为我们的构图增加一种更有机的随机性。\n\n# 5. 对噪声的需求\n\
    \n在本章中，我们将讨论到目前为止所使用的随机函数的局限性，以及如何通过使用 SvJs 的`Noise`模块来克服这些局限性。我们将探讨什么是噪声及其用途，在本章结束时，我们将在生成式创作的武库中增添一项重要的技术。\n\
    \n## 随机函数的局限\n\n有时，随机性就是过于……嗯，随机。即使我们使用概率分布来塑造随机化值，并将它们约束在结构化模式中，连续值之间的差异也总是带有那种标志性的“断奏”感。换句话说，当并排比较时，这些值总会有一些跳跃和抖动。你不会看到一个值到另一个值的平滑过渡。\n\
    \n别误会我的意思——这通常正是我们想要的，也是随机函数的设计初衷。但是，仅靠随机性很难创造出任何具有有机质感的作品。为此，我们需要噪声。\n"
- fmt: "# Making Noise\n\nIn 1997, Ken Perlin won an Oscar. What made this award unprecedented\
    \ was that Perlin wasn't an actor, director, or soundtrack composer, but a programmer.\
    \ For the movie *TRON*, released in 1982, Perlin had been tasked with the development\
    \ of procedural textures that would make 3D objects look more natural (i.e., organic),\
    \ and the algorithm he devised, named Perlin noise, has since become ubiquitous\
    \ in the world of computer graphics.\n\nYou'll find implementations in image editors\
    \ like GIMP and Photoshop, in vector editors like Inkscape and Illustrator, in\
    \ 3D graphics packages like Blender, and in countless video games down through\
    \ the ages. Minecraft is a great example; those infinite blocky terrains where\
    \ players mine for resources use height maps generated by Perlin noise to determine\
    \ their various peaks and troughs.\n\nSo Perlin noise is everywhere in the graphical\
    \ domain. But what exactly is it?\n\n## Noise Explained\n\nTechnically, noise\
    \ functions do produce random numbers, but they do so in a smoothly ordered fashion,\
    \ and this is what makes the difference. In Figure [5-1](#538894_1_En_5_Chapter.xhtml#Fig1),\
    \ the height of the white lines is randomized using a Perlin noise variable. This\
    \ is an example of one-dimensional noise, that is, noise values that operate along\
    \ a single axis.\n\n![](images/538894_1_En_5_Chapter/538894_1_En_5_Fig1_HTML.png)\n\
    \nAn abstract presents a rectangular-shaped structure with the arrangement of\
    \ a cluster of bright lines in different sizes, against a dark background forming\
    \ a wave pattern.\n\n**Figure 5-1.** A one-dimensional representation of Perlin\
    \ noise values\n\nNoise is by nature multidimensional; Perlin originally designed\
    \ it for 3D spaces, and there are four-dimensional implementations out there too,\
    \ but with SVG being a two-dimensional medium, I'll be sticking to the `x` and\
    \ `y` axes. The particular algorithm Perlin developed works by blending randomized\
    \ values in a gradiented fashion over a given area. This area, or space, is more\
    \ notional than actual; the noise values don't exist on an actual plane or separate\
    \ canvas, but rather in an abstract (and infinite) space that we can retrieve\
    \ values from.\n\nFor example, fetching a noise value at the conceptual coordinates\
    \ of `(15, 20)` would give us some value between `-1` and `1`. And when we slowly\
    \ traverse through this noise space to reach an adjoining coordinate, say `(16,\
    \ 21)`, we get a series of smoothly varied values we can work with. And it's what\
    \ we can do with those values that make noise interesting from an aesthetic perspective.\n\
    \nIn Figure [5-2](#538894_1_En_5_Chapter.xhtml#Fig2), we can see noise represented\
    \ in two dimensions using the full area of a canvas. This example is actually\
    \ pixel based rather than vector based, chosen because it's perhaps the best way\
    \ to visually grasp the notion of a noise space. Here, the alpha component of\
    \ each pixel is varied according to the corresponding noise value, creating a\
    \ cloud-like formation. You can immediately see why it would be useful for creating\
    \ textures.\n\n![](images/538894_1_En_5_Chapter/538894_1_En_5_Fig2_HTML.png)\n\
    \nAn abstract presents a square-shaped structure with cloud-like formation, against\
    \ a dark background.\n\n**Figure 5-2.** A two-dimensional representation of Perlin\
    \ noise values\n\n## The SvJs Noise Module\n\nThe SvJs library comes with its\
    \ own implementation of noise, designed to be simple to use and to have as light\
    \ a footprint as possible. It resides in its own module, so like the `Gen` module,\
    \ we have to import it before we can use it.\n\n```javascript\nimport { Noise\
    \ } from '../../node_modules/svjs/src/index.js';\n```\n\nUnlike `Gen`, which is\
    \ a collection of functions, the `Noise` module is class based, so we first need\
    \ to instantiate it.\n\n```javascript\n// Create an instance of the Noise class.\n\
    let noise = new Noise();\n```\n\nThe class has a single method called `get()`\
    \ that accepts an `x` coordinate and optional `y` coordinate as arguments and\
    \ returns the value at that point in the noise space.\n\n```javascript\nlet noiseValue\
    \ = noise.get(noiseX, noiseY);\n```\n\nThat `noiseValue` won't be much use to\
    \ us as a static value; what we need to do is gradually modify it by traversing\
    \ the noise space. We do this by incrementing the `noiseX` and/or `noiseY` coordinates.\
    \ Here's how this might look within a loop:\n\n```javascript\n// Initialise our\
    \ noise instance and noise co-ordinates first.\nlet noise = new Noise();\nlet\
    \ noiseX = 15, noiseY = 20;\n\n// Run the loop, slowly incrementing the co-ordinates\
    \ to modify the value.\nfor (let i = 0; i < 1000; i += 1) {\n  let noiseValue\
    \ = noise.get(noiseX, noiseY);\n  // ... Do something with noiseValue\n  noiseX\
    \ += 0.003;\n  noiseY += 0.003;\n}\n```\n\nAs you can see, we define the initial\
    \ `noiseX` and `noiseY` coordinates outside the loop, use them to fetch a `noiseValue`\
    \ within it, and then before the loop runs again, increment the coordinates by\
    \ a very small amount. This amount we might refer to as the noise speed or rate\
    \ of change. It's important when working with noise that this rate of change is\
    \ minimal; comparatively large leaps (e.g., by whole numbers) won't yield usable\
    \ results.\n\n## Into the Noise Matrix\n\nLet's copy our template and set up a\
    \ new sketch folder called `12-noise-matrix`, to show how noise can be used to\
    \ alter color values within a grid. At the top of our `sketch.js` file, add in\
    \ the `Noise` module to our import statement like so:\n\n```javascript\nimport\
    \ { SvJs, Gen, Noise } from '../../node_modules/svjs/src/index.js';\n```\n\nNext,\
    \ we're going to shorten the expression that calculates the `svgSize` (and thus\
    \ the dimensions of our `viewport`). Instead of the ternary operator, we can actually\
    \ use the `Math.min()` function, which returns the smallest of two or more values.\
    \ If you remember, all we want to do is set the `svgSize` to whichever of the\
    \ window's `innerWidth` or `innerHeight` is smallest, and `Math.min()` does this\
    \ in the most succinct manner. A small tweak to be sure, but one that hints at\
    \ the many uses of JavaScript's built-in `Math` module.\n\n```javascript\nconst\
    \ svgSize = Math.min(window.innerWidth, window.innerHeight);\n```\n\nI'd recommend\
    \ applying this tweak to our base template too.\n\n### A Noisy Grid\n\nFor this\
    \ composition, we'll be using a familiar technique: we'll be setting up a grid,\
    \ and this grid will act as our matrix (a matrix is, after all, just a grid of\
    \ values). And the matrix we'll be creating in this sketch will mimic the one\
    \ from the movie of the same name. We'll be populating the grid with ones and\
    \ zeros, and the color of these digits will be modulated by noise to achieve that\
    \ cascading, desaturated effect.\n\nCreate an instance of the noise class, and\
    \ then initialize three further variables. Two will take care of our noise `x`\
    \ and `y` coordinates, and in the third, we'll store the noise speed that will\
    \ determine the rate at which we'll increment the noise coordinates.\n\n```javascript\n\
    // Create our noise, the noise x and y co-ordinates, and noise speed.\nlet noise\
    \ = new Noise();\nlet nX = 0, nY = 0;\nlet noiseSpeed = 0.5;\n```\n\nThe next\
    \ block of code should hopefully look familiar. We're setting some grid-related\
    \ variables, and this time we'll omit the `spacing` and `cellSize` variables we\
    \ used in previous sketches and set the `gridSize` to cover the entire `viewBox`.\n\
    \n```javascript\n// Set some grid-related variables.\nlet noiseGrid = svg.create('g');\n\
    let gridSize = 1000;\nlet rows = 80;\nlet increment = gridSize / rows;\n```\n\n\
    Next comes our loop. Instead of starting with the `y` coordinate in the outer\
    \ loop, we're going to start with the `x` coordinate. What this will do is construct\
    \ our grid from top to bottom and then left to right. In other words, we'll fill\
    \ out our columns first rather than the rows, which will allow our noise values\
    \ to flow in a downward motion.\n\nWithin the loop, we'll fetch our noise value\
    \ using the `noise.get()` method, passing in the `nX` and `nY` values we initialized\
    \ earlier.\n\n```javascript\n// Create the noise matrix.\nfor (let x = 0; x <\
    \ gridSize; x += increment) {\n  for (let y = 0; y < gridSize; y += increment)\
    \ {\n    // Fetch the noise value.\n    let noiseValue = noise.get(nX, nY);\n\
    \  }\n}\n```"
  raw: 'Making Noise

    In 1997, Ken Perlin won an Oscar. What made this award unprecedented

    was that Perlin wasn’t an actor, director, or soundtrack composer, but a

    programmer. For the movie *TRON*, released in 1982, Perlin had

    been tasked with the development of procedural textures that would make

    3D objects look more natural (i.e., organic), and the algorithm he

    devised, named Perlin noise, has since become ubiquitous in the world of

    computer graphics.

    You’ll find implementations in image editors like GIMP and Photoshop, in

    vector editors like Inkscape and Illustrator, in 3D graphics packages

    like Blender, and in countless video games down through the ages.

    Minecraft is a great example; those infinite blocky terrains where

    players mine for resources use height maps generated by Perlin noise to

    determine their various peaks and troughs.

    So Perlin noise is everywhere in the graphical domain. But what

    exactly is it?


    Noise Explained


    Technically, noise functions do produce random numbers, but they do so

    in a smoothly ordered fashion, and this is what makes the difference. In

    Figure [5-1](#538894_1_En_5_Chapter.xhtml#Fig1), the height of

    the white lines is randomized using a Perlin noise variable.

    This is an example of one-dimensional noise, that is, noise values that

    operate along a single axis.


    ![](images/538894_1_En_5_Chapter/538894_1_En_5_Fig1_HTML.png)


    An abstract presents a rectangular-shaped structure with the

    arrangement of a cluster of bright lines in different sizes, against a

    dark background forming a wave pattern.


    Figure 5-1

    A one-dimensional representation of Perlin noise values


    Noise is by nature multidimensional; Perlin originally designed it

    for 3D spaces, and there are four-dimensional implementations out there

    too, but with SVG being a two-dimensional medium, I’ll be sticking to

    the x and y axes. The particular algorithm Perlin developed works by

    blending randomized values in a gradiented fashion over a given area.

    This area, or space, is more notional than actual; the noise values

    don’t exist on an actual plane or separate canvas, but rather in an

    abstract (and infinite) space that we can retrieve values from.

    For example, fetching a noise value at the conceptual coordinates of

    (15, 20) would give us some value between -1 and 1\. And when we slowly

    traverse through this noise space to reach an adjoining coordinate, say

    (16, 21), we get a series of smoothly varied values we can work with.

    And it’s what we can do with those values that make noise interesting

    from an aesthetic perspective.


    In Figure [5-2](#538894_1_En_5_Chapter.xhtml#Fig2), we can see

    noise represented

    in two dimensions using the full area of a canvas. This example is

    actually pixel based rather than vector based, chosen because it’s

    perhaps the best way to visually grasp the notion of a noise space.

    Here, the alpha component of each pixel is varied according to the

    corresponding noise value, creating a cloud-like formation. You can

    immediately see why it would be useful for creating textures.


    ![](images/538894_1_En_5_Chapter/538894_1_En_5_Fig2_HTML.png)


    An abstract presents a square-shaped structure with cloud-like

    formation, against a dark background.


    Figure 5-2

    A two-dimensional representation of Perlin noise values


    The SvJs Noise Module


    The SvJs library

    comes with its own implementation of noise, designed to be simple to use

    and to have as light a footprint as possible. It resides in its own

    module, so like the `Gen` module, we have

    to import it before we can use it.


    ```

    import { Noise } from ''../../node_modules/svjs/src/index.js'';

    ```


    Unlike `Gen`,

    which is a collection of functions, the `Noise` module is class

    based, so we first need to instantiate it.


    ```

    // Create an instance of the Noise class.

    let noise = new Noise();

    ```


    The class has a single method called `get()` that accepts an

    x coordinate and optional y coordinate as arguments and returns the

    value at that point in the noise space.


    ```

    let noiseValue = noise.get(noiseX, noiseY);

    ```


    That `noiseValue`

    won’t be much use to us as a static value; what we need to do is

    gradually modify it by traversing the noise space. We do this by

    incrementing the `noiseX` and/or `noiseY` coordinates.

    Here’s how this might look within a loop:


    ```

    // Initialise our noise instance and noise co-ordinates first.

    let noise = new Noise();

    let noiseX = 15, noiseY = 20;

    // Run the loop, slowly incrementing the co-ordinates to modify the value.

    for (let i = 0; i < 1000; i += 1) {

    let noiseValue = noise.get(noiseX, noiseY);

    ... // Do something with noiseValue

    noiseX += 0.003;

    noiseY += 0.003;

    }

    ```


    As you can see, we define the initial `noiseX` and `noiseY` coordinates

    outside the loop, use them to fetch a `noiseValue` within

    it, and then before

    the loop runs again, increment the coordinates by a very small amount.

    This amount we might refer to as the noise speed or rate of change. It’s

    important when working with noise that this rate of change is minimal;

    comparatively large leaps (e.g., by whole numbers) won’t yield usable

    results.


    Into the Noise Matrix


    Let’s copy our template and set up a new sketch folder called `12-noise-matrix`,

    to show how noise can be used to alter color values within a grid. At

    the top of our `sketch.js` file, add

    in the `Noise`

    module to our import

    statement like so:


    ```

    import { SvJs, Gen, Noise } from ''../../node_modules/svjs/src/index.js'';

    ```


    Next, we’re going to shorten the expression that calculates the `svgSize` (and
    thus the

    dimensions of our `viewport`). Instead of

    the ternary operator, we can actually use the `Math.min()` function, which returns

    the smallest of two or more values. If you remember, all we want to do

    is set the `svgSize` to whichever

    of the window’s `innerWidth` or `innerHeight` is

    smallest, and `Math.min()` does this

    in the most succinct manner. A small tweak to be sure, but one that

    hints at the many uses of JavaScript’s built-in `Math` module.


    ```

    const svgSize = Math.min(window.innerWidth, window.innerHeight);

    ```


    I’d recommend applying this tweak to our base template too.


    A Noisy Grid

    For this composition, we’ll be using a familiar technique: we’ll be

    setting up a grid, and this grid will act as our matrix (a matrix is,

    after all, just a grid of values). And the matrix we’ll be creating in

    this sketch will mimic the one from the movie of the same name. We’ll be

    populating the grid with ones and zeros, and the color of these digits

    will be modulated by noise to achieve that cascading, desaturated

    effect.


    Create an instance of the noise class, and then initialize three further

    variables. Two

    will take care of our noise x and y coordinates, and in the third, we’ll

    store the noise speed that will determine the rate at which we’ll

    increment the noise coordinates.


    ```

    // Create our noise, the noise x and y co-ordinates, and noise speed.

    let noise = new Noise();

    let nX = 0, nY = 0;

    let noiseSpeed = 0.5;

    ```


    The next block of code should hopefully look familiar. We’re setting

    some grid-related variables, and this time we’ll omit the `spacing` and `cellSize`
    variables we

    used in previous sketches and set the `gridSize` to cover the

    entire `viewBox`.


    ```

    // Set some grid-related variables.

    let noiseGrid = svg.create(''g'');

    let gridSize = 1000;

    let rows = 80;

    let increment = gridSize / rows;

    ```


    Next comes our loop. Instead of starting with the `y` coordinate in the

    outer loop, we’re going to start with the `x` coordinate. What

    this will do is construct our grid from top to bottom and then left to

    right. In other words, we’ll fill out our columns first rather than the

    rows, which will allow our noise values to flow in a downward

    motion.


    Within the loop, we’ll fetch our noise value using the `noise.get()` method,

    passing in the `nX` and `nY` values we

    initialized earlier.


    ```

    // Create the noise matrix.

    for (let x = 0; x < gridSize; x += increment) {

    for (let y = 0; y < gridSize; y += increment) {

    // Fetch the noise value.

    let noiseValue = noise.get(nX, nY);

    }

    }

    ```'
  trans: "\n# 制造噪点\n\n1997 年，肯·佩林荣获奥斯卡奖。这一奖项之所以史无前例，是因为佩林既非演员、导演，也非配乐师，而是一名程序员。为 1982\
    \ 年上映的电影《创》开发能够让 3D 物体看起来更自然的程序化纹理（即有机质感）时，佩林设计出的算法被命名为**佩林噪声**，此后该算法在计算机图形学领域变得无处不在。\n\
    \n你可以在 GIMP、Photoshop 等图像编辑器，Inkscape、Illustrator 等矢量编辑器，Blender 等 3D 图形软件包，以及历年来无数视频游戏中找到其实现。Minecraft\
    \ 就是绝佳范例：那些玩家开采资源的无限块状地形，正是利用佩林噪声生成的高度图来决定其起伏变化的。\n\n因此，佩林噪声在图形领域无处不在。但它究竟是什么？\n\
    \n## 噪声解析\n\n从技术上讲，噪声函数确实会产生随机数，但其生成方式具有平滑有序的特点——这正是关键所在。在图 5-1 中，白线的高度通过佩林噪声变量随机化处理。这是一维噪声的示例，即仅沿单轴操作的噪声值。\n\
    \n![](img/538894_1_En_5_Fig1_HTML.png)\n\n抽象图中呈现出一个矩形结构，其内部排列着不同尺寸的明亮线条簇，在深色背景上形成波浪图案。\n\
    \n**图 5-1.** 佩林噪声值的一维表示\n\n噪声本质上是多维的；佩林最初为其三维空间设计，如今也存在四维实现。但由于 SVG 是二维媒介，我将坚持使用`x`和`y`轴。佩林开发的特定算法通过在给定区域以渐变方式混合随机化值来实现效果。这个区域或空间更多是概念性的而非实体；噪声值并非存在于实际平面或独立画布上，而是存在于一个我们可以从中检索值的抽象（且无限）空间中。\n\
    \n例如，在概念坐标`(15, 20)`处获取噪声值会得到介于`-1`和`1`之间的某个值。当我们缓慢遍历此噪声空间到达相邻坐标如`(16, 21)`时，会获得一系列可供使用的平滑变化值。正是我们能利用这些值做什么，使得噪声在审美层面变得有趣。\n\
    \n在图 5-2 中，我们可以看到噪声使用整个画布区域以二维形式呈现。此示例实际上基于像素而非矢量，选择它或许是因为这是直观理解噪声空间概念的最佳方式。在此图中，每个像素的\
    \ alpha 分量根据相应的噪声值变化，形成云朵状结构。你立刻就能明白它为何对创建纹理如此有用。\n\n![](img/538894_1_En_5_Fig2_HTML.png)\n\
    \n抽象图中呈现出一个方形结构，带有云朵状形态，背景为深色。\n\n**图 5-2.** 佩林噪声值的二维表示\n\n## SvJs 噪声模块\n\nSvJs\
    \ 库自带噪声实现，设计目标为使用简便且占用空间尽可能小。它位于独立模块中，因此与`Gen`模块类似，使用前需要先导入。\n\n```javascript\n\
    import { Noise } from '../../node_modules/svjs/src/index.js';\n```\n\n与作为函数集合的`Gen`不同，`Noise`模块基于类实现，因此我们需要先实例化它。\n\
    \n```javascript\n// 创建 Noise 类的实例。\nlet noise = new Noise();\n```\n\n该类包含一个名为`get()`的方法，该方法接受`x`坐标和可选的`y`坐标作为参数，并返回噪声空间中该点的值。\n\
    \n```javascript\nlet noiseValue = noise.get(noiseX, noiseY);\n```\n\n静态的`noiseValue`对我们用处不大；我们需要通过遍历噪声空间来逐渐修改它。我们通过递增`noiseX`和/或`noiseY`坐标来实现。以下是在循环中的实现方式：\n\
    \n```javascript\n// 首先初始化噪声实例和噪声坐标。\nlet noise = new Noise();\nlet noiseX = 15,\
    \ noiseY = 20;\n\n// 运行循环，缓慢递增坐标以修改值。\nfor (let i = 0; i < 1000; i += 1) {\n \
    \ let noiseValue = noise.get(noiseX, noiseY);\n  // ... 对 noiseValue 进行处理\n  noiseX\
    \ += 0.003;\n  noiseY += 0.003;\n}\n```\n\n如你所见，我们在循环外定义了初始的`noiseX`和`noiseY`坐标，在循环内使用它们获取`noiseValue`，然后在下次循环运行前以极小的增量递增坐标。这个增量我们可以称之为噪声速度或变化率。在处理噪声时，保持变化率极小非常重要；相对较大的跳跃（例如整数值）不会产生可用结果。\n\
    \n## 进入噪声矩阵\n\n让我们复制模板并创建一个名为`12-noise-matrix`的新草图文件夹，以展示噪声如何用于改变网格内的颜色值。在`sketch.js`文件顶部，将`Noise`模块添加到导入语句中：\n\
    \n```javascript\nimport { SvJs, Gen, Noise } from '../../node_modules/svjs/src/index.js';\n\
    ```\n\n接下来，我们将缩短计算`svgSize`（以及`viewport`尺寸）的表达式。实际上，我们可以使用`Math.min()`函数替代三元运算符，该函数返回两个或多个值中的最小值。如果你还记得，我们只想将`svgSize`设置为窗口`innerWidth`或`innerHeight`中的最小值，而`Math.min()`以最简洁的方式实现了这一点。这无疑是个小调整，但暗示了\
    \ JavaScript 内置`Math`模块的多种用途。\n\n```javascript\nconst svgSize = Math.min(window.innerWidth,\
    \ window.innerHeight);\n```\n\n我建议也将此调整应用到我们的基础模板中。\n\n### 充满噪声的网格\n\n对于这个构图，我们将采用熟悉的技术：建立网格，该网格将充当我们的矩阵（毕竟矩阵只是值的网格）。此草图中创建的矩阵将模仿同名电影中的矩阵。我们将在网格中填充\
    \ 1 和 0，这些数字的颜色将由噪声调制，以实现那种层叠、去饱和的效果。\n\n创建噪声类的实例，然后初始化另外三个变量。其中两个将处理噪声的`x`和`y`坐标，第三个将存储决定噪声坐标递增速率的噪声速度。\n\
    \n```javascript\n// 创建噪声对象、噪声 x、y 坐标以及噪声速度。\nlet noise = new Noise();\nlet nX\
    \ = 0, nY = 0;\nlet noiseSpeed = 0.5;\n```\n\n下一段代码应该看起来似曾相识。我们正在设置一些与网格相关的变量，这次我们将省略之前草图中使用的`spacing`和`cellSize`变量，并将`gridSize`设置为覆盖整个`viewBox`。\n\
    \n```javascript\n// 设置一些网格相关变量。\nlet noiseGrid = svg.create('g');\nlet gridSize\
    \ = 1000;\nlet rows = 80;\nlet increment = gridSize / rows;\n```\n\n接下来是我们的循环。我们将从`x`坐标开始外循环，而不是`y`坐标。这样做的效果是从上到下、从左到右构建网格。换言之，我们将先填充列而非行，这将使我们的噪声值以向下流动的方式传播。\n\
    \n在循环内部，我们将使用`noise.get()`方法获取噪声值，并传入我们之前初始化的`nX`和`nY`值。\n\n```javascript\n//\
    \ 创建噪声矩阵。\nfor (let x = 0; x < gridSize; x += increment) {\n  for (let y = 0;\
    \ y < gridSize; y += increment) {\n    // 获取噪声值。\n    let noiseValue = noise.get(nX,\
    \ nY);\n  }\n}\n```\n"
- fmt: 'Next, let’s create the actual text content. We want a series of ones and zeros
    to fill the grid, with a 50% chance of either digit being chosen. As we learned
    in the last chapter, the `Gen.chance()` function is the simplest way to do this,
    combined with a ternary operator.


    ```

    // Create text displaying either 0 or 1 (50% chance).

    let text = noiseGrid.create(''text'');

    text.content(Gen.chance() ? ''1'' : ''0'');

    ```


    Now we need to set the position of the digit with respect to the `x` and `y` loop
    iterator values and set the intensity of the fill color (i.e., the lightness component
    of the `hsl()` function) with the `noiseValue` variable. We should also set a
    font size and font family while we’re at it.


    ```

    text.set({

    x: x, y: y,

    font_size: 16,

    font_family: ''serif'',

    fill: `hsl(120 20% ${noiseValue}%)`

    });

    ```


    And before we close out our loop, we’ll want to increment our `nX` and `nY` values
    with the `noiseSpeed` variable.


    ```

    nX += noiseSpeed;

    nY += noiseSpeed;

    ```


    To finish off the sketch, outside the loop, call the `moveTo()` function to shift
    the grid to the center of the canvas.


    ```

    // Centre the grid within the viewBox.

    noiseGrid.moveTo(500, 500);

    ```


    You should now see a grid of zeros and ones when you run your sketch. But … they’re
    all black. The color lightness isn’t visibly changing, even though we’re using
    our `noiseValue` to modify it. What’s going on here?


    If you inspect some of the `text` elements in the browser console, you’ll see
    something like the following:


    ```


    ```


    The point to note here is that when we call the `noise.get()` method, the value
    returned is a float between -1 and 1 (with some occasional outliers). The lightness
    component of the `hsl()` function, however, should have values between 0 and 100%,
    so in its raw state, the noise value isn’t very useful here. How might we fix
    this? Couldn’t we just multiply it by a factor of 100? We could, but we’d then
    have an equal amount of numbers in the negative range. And if we tried to remedy
    this with `Math.abs()` to force the negative numbers into a positive range, that
    would destroy the very raison d’être of noise – its smoothly transitioning values.
    So what’s the solution?


    ## Mapping the Noise Values


    This is actually a common challenge in generative art – mapping a series of values
    from one range to another. Thankfully the `Gen` module comes equipped with a function
    that does just this: `Gen.map()`.


    The function requires five arguments, with an optional sixth: the first is the
    value to be mapped to the new range, the second and third arguments define the
    lower and upper bounds of the existing range, and the fourth and fifth arguments
    define the lower and upper bounds of the range to which we want our value mapped.
    The final sixth argument specifies whether a float should be returned. In common
    with other `Gen` functions like `gaussian` and `pareto`, this is set to `true`
    by default, and setting it to `false` rounds the result to the nearest integer.
    The following is an example:


    ```

    // Map a number (5) from one range (0, 10) to another (0, 100).

    let num = 5;

    num = Gen.map(num, 0, 10, 0, 100);

    console.log(num);

    -> 50

    ```


    If we apply the `Gen.map()` function to our `noiseValue` variable, we can retrieve
    a more usable value. We could assign this new mapped value to a new variable,
    or as the preceding example shows us, we can simply reassign the original variable.


    ```

    // Fetch the noise value.

    let noiseValue = noise.get(nX, nY);

    // Map the noise value to a useful range.

    noiseValue = Gen.map(noiseValue, -1, 1, 0, 100, false);

    ```


    Once you’ve done this, you should see some color injected into our matrix (as
    per Figure [5-3](#538894_1_En_5_Chapter.xhtml#Fig3)). Enough we hope to get an
    appreciative nod from Neo.


    ![](images/538894_1_En_5_Chapter/538894_1_En_5_Fig3_HTML.png)


    An abstract presents a square-shaped structure with a series of 1''s and 0''s,
    against a dark background.


    **Figure 5-3** That chunk of the matrix that tastes like chicken


    It’s worth noting that when using a generic `font-family` like `serif`, you essentially
    let the operating system decide which default font to render. For this reason,
    what you see may differ slightly from Figure [5-3](#538894_1_En_5_Chapter.xhtml#Fig3).


    ## Optimize with Style


    We could leave it there and make no further changes to the sketch, but there’s
    one little niggle I can’t leave alone. In total, we have 2,500 `text` elements
    in this sketch, and for each of these elements, the `font-size` and `font-family`
    attributes remain static throughout. This seems quite wasteful.


    ```


    ```


    What we can do is first remove the font attributes set within the loop so that
    the `text.set()` method looks like the following:


    ```

    text.set({

    x: x, y: y, fill: `hsl(120 20% ${noiseValue}%)`

    });

    ```


    Then we can create a `style` element and within it, target all our `text` elements
    at once. Near the top of our sketch, after the parent SVG declaration, include
    the following code:


    ```

    // Set some text styling.

    svg.create(''style'').content(`

    text {

    font-size: 16px;

    font-family: serif;

    }

    `);

    ```


    Note the use of backticks here; this allows us to indent our code just as we would
    with normal CSS. What this CSS does is apply the `font-size` and `font-family`
    to each of our `text` elements, avoiding the use of repetitive inline attributes.
    This is not only a more elegant way of handling static styles, but it can save
    us quite a few kilobytes along the way. In this particular sketch, taking this
    measure resulted in a 40% reduction in the rendered markup – not bad!


    ## Spinning Noise


    In our next sketch, to consolidate some of the concepts covered already, we’re
    going to spin some `line` elements about their center points and vary their line
    lengths and colors with noise. This time we’ll use just a single loop and noise
    dimension.


    Copy the previous sketch folder and name it something like `13-spinning-noise`.
    Remove the `style` element and everything after the background so that we’re left
    with the following boilerplate code:


    ```

    import { SvJs, Gen, Noise } from ''../../node_modules/svjs/src/index.js'';

    // Parent SVG.

    const svg = new SvJs().addTo(document.getElementById(''container''));

    // Viewport and viewBox (1:1 aspect ratio).

    const svgSize = Math.min(window.innerWidth, window.innerHeight);

    svg.set({ width: svgSize, height: svgSize, viewBox: ''0 0 1000 1000'' });

    // Background.

    svg.create(''rect'').set({

    x: 0, y: 0, width: 1000, height: 1000, fill: ''#181818''

    });

    ```


    We’ll then set up our noise-related variables, along with a couple of randomized
    values that will determine our initial hue and the amount of times our loop will
    run.


    ```

    // Noise-related and randomised variables.

    let noise = new Noise();

    let nX = 0;

    let noiseSpeed = 0.025;

    let lines = svg.create(''g'');

    let hue = Gen.random(0, 360);

    let iterations = Gen.random(60, 100);

    ```


    ### Mapping and Constraining


    We can now run the loop. We’ll offset our iteration start point by `10`; for this
    particular sketch, this value just worked better than starting at the usual `0`.
    Within the loop, we’ll fetch the `noiseValue`, and then we’ll extract two further
    variables from this by individually mapping the value to different ranges. One
    will control how much we shift the `hue`, and the other will control the length
    of each line.


    ```

    // Start the dance.

    for (let i = 10; i < iterations; i += 1) {

    let noiseValue = noise.get(nX);

    let hueShift = Gen.map(noiseValue, -1, 1, -180, 180, false);

    let lineLength = Gen.map(noiseValue, -1, 1, 0, 1000, false);

    }

    ```


    After the `lineLength` variable (and still within the loop), set up the first
    of our lines. We will start off with a straight vertical line at `(0, 0)` (the
    top left of our `viewBox`), and we’ll worry about centering things later. As it’s
    a vertical line, the second `x` coordinate won’t change – only the second `y`
    coordinate will.'
