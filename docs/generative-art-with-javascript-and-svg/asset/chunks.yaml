    remain static. It’s also possible to use the shorthand `animation` property, which
    allows for greater concision by declaring all our animation values at once. Only
    use this when familiar with the longhand version though, as the order of values
    `–` while not especially strict `–` can lead to unanticipated behavior if you’re
