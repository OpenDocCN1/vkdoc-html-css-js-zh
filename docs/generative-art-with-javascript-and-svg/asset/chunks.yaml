- fmt: "运行`live-server`命令并导航到我们的模板文件夹后，此时您只会看到一个空白页面。这是因为我们的SVG画布中没有任何内容能使其与背景区分开来。我们将很快通过创建一个用作背景层/画布的矩形来解决这个问题。\n\
    \n正如我们可以使用`set()`来设置值一样，我们也可以使用`get()`来获取值。虽然您可能不会经常用到这个功能，但了解其存在是件好事。例如，以下代码会将我们的`viewBox`值输出到控制台：\n\
    \n```\nconsole.log(svg.get('viewBox'));\n```\n\n通过`get()`方法获取属性值在处理事件监听器或其他值动态更新的场景中会非常有用。\n\
    \n## 更快捷的元素创建\n\n如果我们每次创建新的SVG元素时都要调用`new SvJs`构造函数和`addTo`方法，久而久之可能会有些繁琐。这时，`SvJs`库的`create()`方法就派上了用场，它将这两个步骤合二为一。要创建一个元素并自动将其追加到父级SVG中，我们只需这样写：\n\
    \n```\nsvg.create('elementName');\n```\n\n在创建元素时，除非你确信之后不会再引用它，否则最好将其赋值给一个变量。因此，你可能会将上述代码写成：\n\
    \n```\nconst variableName = svg.create('elementName');\n```\n\n`create()`方法支持链式调用，并且也可以被子元素调用。\n\
    \n## 线条与形状\n\nSVG规范定义了六种基本形状类型：\n\n*   圆形\n*   椭圆\n*   线条\n*   多边形\n*   折线\n*\
    \   矩形\n\n由于我们需要设置一个背景，让我们先从矩形开始。\n\n### 矩形和正方形\n\n在SVG规范中，矩形是`rect`。要创建一个矩形，我们这样写：\n\
    \n```\nsvg.create('rect');\n```\n\n接下来，我们将链式调用`set()`方法，重点关注`rect`元素的以下五个属性：`x`和`y`用来设置其左上角的位置；`width`和`height`用来定义其大小；以及`fill`用来定义其颜色。因为我们想要一个正方形（从技术上讲，正方形只是一种特殊的矩形），只需将`width`和`height`设置为相同的值即可。请将以下代码添加到我们的模板中：\n\
    \n```\n// 背景。\nsvg.create('rect').set({\n  x: 0, y: 0, width: 1000, height: 1000,\
    \ fill: '#181818'\n});\n```\n\n请注意，我们定义背景的位置和尺寸时，是相对于`viewBox`，而不是`viewport`。这能让我们的值保持一致，因为我们事先并不知道`viewport`的大小。现在运行`live-server`，你应该会看到一个比周围背景颜色稍暗的正方形画布。\n\
    \n这足以满足我们的模板需求。如果你之前遗漏了什么，或者只是想确保代码顺序正确，以下是完整的模板`sketch.js`文件：\n\n```\nimport\
    \ { SvJs } from '../../node_modules/svjs/src/index.js';\n\n// 父级SVG。\nconst svg\
    \ = new SvJs().addTo(document.getElementById('container'));\n\n// 视口和viewBox（1:1\
    \ 宽高比）。\nconst svgSize = window.innerWidth > window.innerHeight ? window.innerHeight\
    \ : window.innerWidth;\nsvg.set({ width: svgSize, height: svgSize, viewBox: '0\
    \ 0 1000 1000' });\n\n// 背景。\nsvg.create('rect').set({\n  x: 0, y: 0, width: 1000,\
    \ height: 1000, fill: '#181818'\n});\n```\n\n我们之后编写的任何代码都将特定于正在处理的草图。在复制`00-template`文件夹及其内容并将其重命名为`02-basic-shapes`之前，请确保已保存更改。\n\
    \n## 初次描边\n\n有两个重要的属性几乎可以用于所有图形化的SVG元素（即，那些意图显示在屏幕上的元素）。它们是元素的`fill`和`stroke`。正如我们已经看到的，`fill`定义了元素的内部颜色（或背景）。而`stroke`则定义了元素轮廓（或边框）的颜色。\n\
    如果你没有定义`stroke`，就不会显示描边。如果你定义了描边，它默认的`stroke-width`为`1`。\n`stroke-width`属性之所以重要还有另一个原因：它是一个带连字符的属性的例子。在JavaScript中设置属性时我们不能使用连字符，因为它们会被解释为减法运算符。\n\
    我们有两种方法处理这个问题：可以将它们转换为字符串，即写成`'stroke-width'`而不是`stroke-width`；或者用下划线替换连字符，即`stroke-width`变成`stroke_width`。\n\
    SvJs支持后一种方法，这也是我更喜欢的方式；它速度更快，并且相比在属性对象中混合使用字符串化和非字符串化的属性，看起来也更协调。\n\n理论就讲到这里——让我们来创建一些东西吧！下面的草图是受约瑟夫·阿尔伯斯（Josef\
    \ Albers）启发的色彩错觉图，它展示了仅使用普通矩形就能创作出相当有趣的构图（如图[3-1](#538894_1_En_3_Chapter.xhtml#Fig1)所示）。\n\
    \n![](images/538894_1_En_3_Chapter/538894_1_En_3_Fig1_HTML.png)\n\n一幅抽象画，展示了一个由不同颜色的普通矩形构成的方形结构，背景为深色。\n\
    \n**图 3-1**  \n受约瑟夫·阿尔伯斯启发的色彩错觉\n\n```\nimport { SvJs } from '../../node_modules/svjs/src/index.js';\n\
    \n// 视口大小（1:1 宽高比）。\nconst svgSize = window.innerWidth > window.innerHeight ?\
    \ window.innerHeight : window.innerWidth;\n\n// 父级SVG。\nconst svg = new SvJs().addTo(document.getElementById('container'));\n\
    svg.set({ width: svgSize, height: svgSize, viewBox: '0 0 1000 1000' });\n\n//\
    \ 背景。\nsvg.create('rect').set({\n  x: 0, y: 0, width: 1000, height: 1000, fill:\
    \ '#181818'\n});\n\n// 主橙色正方形。\nsvg.create('rect').set({\n  x: 150, y: 200, width:\
    \ 700, height: 600, rx: 15, fill: '#e56411',\n  stroke: '#fff', stroke_width:\
    \ 30, paint_order: 'stroke'\n});\n\n// 蓝色矩形。\nsvg.create('rect').set({\n  x: 650,\
    \ y: 200, width: 200, height: 600, rx: 15, fill: '#69969f'\n});\n\n// 较小的橙色矩形。\n\
    svg.create('rect').set({\n  x: 200, y: 425, width: 600, height: 150, rx: 20, fill:\
    \ '#b84b08'\n});\n\n// 黄色矩形。\nsvg.create('rect').set({\n  x: 325, y: 200, width:\
    \ 175, height: 600, fill: '#fed322'\n});\n\n// 紫色矩形。\nsvg.create('rect').set({\n\
    \  x: 500, y: 200, width: 175, height: 600, fill: '#49283c'\n});\n```\n\n左右两侧较小的矩形看起来是相同的橙色吗？假设这种错觉成功了，你可能很难给出一个确切的答案。但通过浏览代码，你可以轻松验证它们不仅是相同的颜色，而且形状也相同！\n\
    使矩形具有圆角的是`rx`属性，它表示矩形在x轴上的圆角半径。如果没有定义相应的`ry`属性，则假定你想要相同的值（从而产生均匀的圆角）。\n你可能还在前面的代码中发现了另一个带连字符的属性，即`paint-order`。这个属性决定了给定元素的`fill`和`stroke`的渲染顺序。\n\
    默认顺序是`fill`先渲染（即填充在下方，因此会被`stroke`部分覆盖），但有时让`stroke`先渲染也很有用，因为只有这样我们才能看到完整的`fill`区域被绘制出来（从代码中删除`paint_order:\
    \ 'stroke'`，你就会明白我的意思）。\n\n## 圆形和椭圆\n\n圆形是所有形状中最简单（也可以说是最完美）的。我们通过`cx`和`cy`属性定义其中心位置，并通过`r`属性定义其半径。"
  raw: 'If you run the `live-server` command

    and navigate to our template folder, you’ll just see a blank page at

    this point. This is because our SVG canvas doesn’t contain anything to

    distinguish it from the background. We’ll address this shortly by

    creating a rectangle to act as a background layer/canvas.


    Just as we can `set()` values, we can

    also `get()`

    them. It’s unlikely you’ll find yourself doing this

    too often, but it’s good to be aware the functionality exists. The

    following code, for example, outputs our `viewBox` value to the

    console:


    ```

    console.log(svg.get(''viewBox''));

    ```


    Fetching attribute values via the `get()` method can be

    useful when working with event listeners, or in other cases where the

    values are being updated dynamically.


    Quicker Element Creation


    If we had to call the `new SvJs` constructor

    and the `addTo`

    method each time we created a new SVG element, it might get a

    little tiresome after a while. This is where the SvJs `create()` method comes
    in, as it

    combines these two steps into one. To create an element and

    automatically append it to our parent SVG, we’d simply write


    ```

    svg.create(''elementName'');

    ```


    When creating an element, it’s usually best to assign it to a variable

    in the process, unless you’re sure you won’t need a reference to it

    again later. You might therefore write the aforementioned as


    ```

    const variableName = svg.create(''elementName'');

    ```


    The `create()`

    method is chainable and can be called by child elements too.


    Lines and Shapes


    The SVG spec defines six primitive shape types:


    *   Circles


    *   Ellipses


    *   Lines


    *   Polygons


    *   Polylines


    *   Rectangles


    As we need to set up a background, let’s start with the

    rectangle.


    Rectangles and Squares


    A rectangle is a `rect` in the SVG spec,

    so to create one,

    we’d write


    ```

    svg.create(''rect'');

    ```


    Next, we’ll chain the `set()` method, focusing on the

    following five attributes of the `rect` element: `x` and `y` to set the position

    of its top left corner; `width` and `height` to define its

    size; and `fill`

    to define its color. As we want a square rectangle (as a

    square is technically just a special kind of rectangle), we just need to

    set our width and height to the same value. Add the following code to

    our template:


    ```

    // Background.

    svg.create(''rect'').set({

    x: 0, y: 0, width: 1000, height: 1000, fill: ''#181818''

    });

    ```


    Note that we’re defining our background’s position and dimensions

    relative to the `viewBox`, not the

    `viewport`. This

    keeps our values consistent, as we don’t know in advance what size our

    `viewport` will

    be. If you run `live-server` now, you

    should see a square canvas just a subtle shade darker than the

    surrounding background.


    This will suffice for our template. In case you’ve missed anything

    earlier or just want to ensure your code is in order, here’s the

    template `sketch.js` file in

    full:


    ```

    import { SvJs } from ''../../node_modules/svjs/src/index.js'';

    // Parent SVG.

    const svg = new SvJs().addTo(document.getElementById(''container''));

    // Viewport and viewBox (1:1 aspect ratio).

    const svgSize = window.innerWidth > window.innerHeight ? window.innerHeight :
    window.innerWidth;

    svg.set({ width: svgSize, height: svgSize, viewBox: ''0 0 1000 1000'' });

    // Background.

    svg.create(''rect'').set({

    x: 0, y: 0, width: 1000, height: 1000, fill: ''#181818''

    });

    ```


    Any further code we write will be specific to the sketch we’re

    working on. Make sure you’ve saved your changes before copying the `00-template`
    folder

    and its contents, renaming it to `02-basic-shapes`.


    First Strokes

    There are two important attributes that can be used on practically

    every graphical SVG element (i.e., elements

    that are intended to appear on screen). These are an element’s `fill` and `stroke`.
    As we’ve

    already seen, the `fill` defines an

    element’s interior color (or background). The `stroke`, on the other

    hand, defines the color of an element’s outline (or border).

    If you don’t define a `stroke`, none will

    appear. And if you do define one, its `stroke-width` will

    default to `1`.

    The `stroke-width` attribute is important to

    highlight for another reason: it’s an example of a hyphenated attribute.

    We can’t use hyphens when setting attributes in JavaScript, as they will

    be interpreted as subtraction operators.

    We have two options to deal with this: we can turn them into strings,

    that is, write `''stroke-width''`

    instead of `stroke-width`, or we

    can replace hyphens with underscores, that is, `stroke-width` becomes

    `stroke_width`.

    The latter option is facilitated by SvJs, and it’s the solution I

    prefer; it’s faster and looks less out of place than having stringified

    object properties mixed with others that aren’t strings.


    Enough with the theory for now `–` let’s create

    something! The following sketch is a Josef Albers`–`inspired color

    illusion and shows that with just plain rectangles, it’s possible to

    create a somewhat interesting composition (illustrated in Figure [3-1](#538894_1_En_3_Chapter.xhtml#Fig1)).


    ![](images/538894_1_En_3_Chapter/538894_1_En_3_Fig1_HTML.png)


    An abstract presents a square-shaped structure with plain rectangles

    in different colors, against a dark background.


    Figure 3-1

    A Josef Albers`–`inspired color

    illusion


    ```

    import { SvJs } from ''../../node_modules/svjs/src/index.js'';

    // Viewport size (1:1 aspect ratio).

    const svgSize = window.innerWidth > window.innerHeight ? window.innerHeight :

    window.innerWidth;

    // Parent SVG.

    const svg = new SvJs().addTo(document.getElementById(''container''));

    svg.set({ width: svgSize, height: svgSize, viewBox: ''0 0 1000 1000'' });

    // Background.

    svg.create(''rect'').set({

    x: 0, y: 0, width: 1000, height: 1000, fill: ''#181818''

    });

    // Main orange square.

    svg.create(''rect'').set({

    x: 150, y: 200, width: 700, height: 600, rx: 15, fill: ''#e56411'',

    stroke: ''#fff'', stroke_width: 30, paint_order: ''stroke''

    });

    // Blue rectangle.

    svg.create(''rect'').set({

    x: 650, y: 200, width: 200, height: 600, rx: 15, fill: ''#69969f''

    });

    // Smaller orange rectangle.

    svg.create(''rect'').set({

    x: 200, y: 425, width: 600, height: 150, rx: 20, fill: ''#b84b08''

    });

    // Yellow rectangle.

    svg.create(''rect'').set({

    x: 325, y: 200, width: 175, height: 600, fill: ''#fed322''

    });

    // Purple rectangle.

    svg.create(''rect'').set({

    x: 500, y: 200, width: 175, height: 600, fill: ''#49283c''

    });

    ```


    Do the smaller rectangles on the right and left look like the same

    shade of orange? Assuming this illusion was successful, you might have

    some trouble settling on a definite

    answer. But by browsing the code, you can easily verify that they are

    not only the same shade, but the same shape!

    What gives the rectangles those rounded corners is the `rx` attribute, which

    means its radius on the x axis. If the corresponding `ry` attribute isn’t

    defined, it’s assumed you want the same value (resulting in a uniformly

    curved corner).

    You also might have spotted another hyphenated attribute in the

    preceding code, namely, `paint-order`. This

    determines in what order our `fill` and `stroke` are rendered

    for a given element.

    The default order has `fill` come first

    (i.e., the fill is beneath so it will get partly painted over by the

    `stroke`), but

    sometimes it can be useful to have `stroke` come first, as

    only then will we see the full `fill` dimensions

    painted (remove `paint_order: ''stroke''`

    from the code and you’ll see what I mean).


    Circles and Ellipses


    The circle is the

    simplest (and arguably the most perfect) of all shapes. We define the

    position of its center via `cx` and `cy` attributes and its

    radius via the `r` attribute.'
  trans: "\n运行`live-server`命令并导航到我们的模板文件夹后，此时您只会看到一个空白页面。这是因为我们的 SVG 画布中没有任何内容能使其与背景区分开来。我们将很快通过创建一个用作背景层/画布的矩形来解决这个问题。\n\
    \n正如我们可以使用`set()`来设置值一样，我们也可以使用`get()`来获取值。虽然您可能不会经常用到这个功能，但了解其存在是件好事。例如，以下代码会将我们的`viewBox`值输出到控制台：\n\
    \n```\nconsole.log(svg.get('viewBox'));\n```\n\n通过`get()`方法获取属性值在处理事件监听器或其他值动态更新的场景中会非常有用。\n\
    \n## 更快捷的元素创建\n\n如果我们每次创建新的 SVG 元素时都要调用`new SvJs`构造函数和`addTo`方法，久而久之可能会有些繁琐。这时，`SvJs`库的`create()`方法就派上了用场，它将这两个步骤合二为一。要创建一个元素并自动将其追加到父级\
    \ SVG 中，我们只需这样写：\n\n```\nsvg.create('elementName');\n```\n\n在创建元素时，除非你确信之后不会再引用它，否则最好将其赋值给一个变量。因此，你可能会将上述代码写成：\n\
    \n```\nconst variableName = svg.create('elementName');\n```\n\n`create()`方法支持链式调用，并且也可以被子元素调用。\n\
    \n## 线条与形状\n\nSVG 规范定义了六种基本形状类型：\n\n*   圆形\n*   椭圆\n*   线条\n*   多边形\n*   折线\n\
    *   矩形\n\n由于我们需要设置一个背景，让我们先从矩形开始。\n\n### 矩形和正方形\n\n在 SVG 规范中，矩形是`rect`。要创建一个矩形，我们这样写：\n\
    \n```\nsvg.create('rect');\n```\n\n接下来，我们将链式调用`set()`方法，重点关注`rect`元素的以下五个属性：`x`和`y`用来设置其左上角的位置；`width`和`height`用来定义其大小；以及`fill`用来定义其颜色。因为我们想要一个正方形（从技术上讲，正方形只是一种特殊的矩形），只需将`width`和`height`设置为相同的值即可。请将以下代码添加到我们的模板中：\n\
    \n```\n// 背景。\nsvg.create('rect').set({\n  x: 0, y: 0, width: 1000, height: 1000,\
    \ fill: '#181818'\n});\n```\n\n请注意，我们定义背景的位置和尺寸时，是相对于`viewBox`，而不是`viewport`。这能让我们的值保持一致，因为我们事先并不知道`viewport`的大小。现在运行`live-server`，你应该会看到一个比周围背景颜色稍暗的正方形画布。\n\
    \n这足以满足我们的模板需求。如果你之前遗漏了什么，或者只是想确保代码顺序正确，以下是完整的模板`sketch.js`文件：\n\n```\nimport\
    \ { SvJs } from '../../node_modules/svjs/src/index.js';\n\n// 父级 SVG。\nconst svg\
    \ = new SvJs().addTo(document.getElementById('container'));\n\n// 视口和 viewBox（1:1\
    \ 宽高比）。\nconst svgSize = window.innerWidth > window.innerHeight ? window.innerHeight\
    \ : window.innerWidth;\nsvg.set({ width: svgSize, height: svgSize, viewBox: '0\
    \ 0 1000 1000' });\n\n// 背景。\nsvg.create('rect').set({\n  x: 0, y: 0, width: 1000,\
    \ height: 1000, fill: '#181818'\n});\n```\n\n我们之后编写的任何代码都将特定于正在处理的草图。在复制`00-template`文件夹及其内容并将其重命名为`02-basic-shapes`之前，请确保已保存更改。\n\
    \n## 初次描边\n\n有两个重要的属性几乎可以用于所有图形化的 SVG 元素（即，那些意图显示在屏幕上的元素）。它们是元素的`fill`和`stroke`。正如我们已经看到的，`fill`定义了元素的内部颜色（或背景）。而`stroke`则定义了元素轮廓（或边框）的颜色。\n\
    如果你没有定义`stroke`，就不会显示描边。如果你定义了描边，它默认的`stroke-width`为`1`。\n`stroke-width`属性之所以重要还有另一个原因：它是一个带连字符的属性的例子。在\
    \ JavaScript 中设置属性时我们不能使用连字符，因为它们会被解释为减法运算符。\n我们有两种方法处理这个问题：可以将它们转换为字符串，即写成`'stroke-width'`而不是`stroke-width`；或者用下划线替换连字符，即`stroke-width`变成`stroke_width`。\n\
    SvJs 支持后一种方法，这也是我更喜欢的方式；它速度更快，并且相比在属性对象中混合使用字符串化和非字符串化的属性，看起来也更协调。\n\n理论就讲到这里——让我们来创建一些东西吧！下面的草图是受约瑟夫·阿尔伯斯（Josef\
