    \ 6-13\nVarying the curve factor using values of\n0, 1, and 5\n\nSummary\n\nWith\
    \ paths now a part of your generative arsenal, so many more\npossibilities open\
    \ up for you. To recap, we’ve covered the following:\n\n*   The path data (`d`)\
    \ string format and\n    the flexibility and economies it offers.\n\n*   The difference\
    \ between absolute and relative path\n    commands\n\n*   The `L`,\n    `V`, and\
    \ `H` straight-line\n    commands\n\n*   The `Q`\n    and `T` quadratic\n    Bezier\
    \ curve commands.\n\n*   What control points are and how to harness them\n\n*\
    \   The elliptical arc curve command `A` and its complex\n    array of arguments\n\
    \n*   The `C`\n    and `S` cubic\n    Bezier curve commands\n\n*   Using noise\
    \ and randomness to shape curves\n\n*   The SvJs `createCurve()` method\n\nIn\
    \ the next chapter, we’ll explore motion, animation, and how to make\nour sketches\
    \ interactive.\n\n7. Motion and Interactivity"
  trans: '

    # 变量分组与生成有机曲线


    按照这种方式将变量进行有意义的分组并添加注释来提升清晰度，通常是一种良好的实践。否则，当你之后重新审视代码时，可能很难回忆起最初的设计意图。你还可以更进一步，通过对象来分组（第
    2 章概述的技巧），但这里我不打算这样做。


    接下来我们将进入循环，首先检索噪声值，然后将其重新映射到更合适的范围（使用前面提到的`amplifier`变量）。请注意，这个范围将跨越正负值，因此我们无法预先知道其极性。就我们的曲线而言，这将有助于模拟更有机的运动，因为数值不会总是与原始起点保持一致的偏移，而是更自然地围绕它们变化。在循环外部，包含`moveTo()`方法来使我们的曲线组居中。


    ```

    for (let i = 0; i < numCurves; i += 1) {

    // 检索并映射我们的噪声值。

    let noiseValue = noise.get(n);

    noiseValue = Gen.map(noiseValue, -1, 1, -amplifier, amplifier, false);

    }

    curves.moveTo(500, 500);

    ```


    接下来是曲线坐标。为了清晰起见，我们将为每个调用的命令设置变量，使路径数据（或`d`字符串）的构建不那么笨重。继续编写以下代码，并将其保持在循环内。我们目标曲线的形状与图
    6-10 中所示的曲线相差不大。除此之外，提供的值相当随意，因此可以随意调整它们。


    ```

    // M 命令坐标。

    let mx = 0;

    let my = 0 + (i * 5);

    // C 命令坐标。

    let cpx1 = 0 + noiseValue;

    let cpy1 = -100;

    let cpx2 = 250 + noiseValue;

    let cpy2 = -100;

    let x2 = 300;

    let y2 = 0;

    // S 命令坐标。

    let spx = 350 + noiseValue;

    let spy = 100;

    let x3 = 300;

    let y3 = -50;

    ```


    除了初始的`M`命令坐标外，我们将使用相对坐标来构建曲线（即，我们将前述曲线变量提供给`c`和`s`命令，而不是它们的大写弟兄）。这些在循环设置中效果更好，因为它们始终与最新的坐标值保持同步。唯一需要注意的另一点是，我们非常有选择性地仅让`noiseValue`变量调制了部分值，本例中是十个可能值中的三个。有时微妙的效果最好，但同样，可以随意在此处进行实验。


    变量就绪后，是时候创建曲线本身了。这里我将介绍一种关于模板字面量语法的新技巧。在之前的草图中，我们为每个变量都打开和关闭了`${}`大括号。但是，当这些变量一个接一个出现时，我们实际上可以将它们作为一个数组一次性嵌入。


    ```

    // 创建有机曲线。

    curves.create(''path'').set({

    fill: ''none'',

    stroke: `hsl(${hue} 80% 80% / 0.8)`,

    d: `M ${[mx, my]}

    c ${[cpx1, cpy1, cpx2, cpy2, x2, y2]}

    s ${[spx, spy, x3, y3]}`

    });

    ```


    如果此时运行草图，你会看到一系列曲线，但它们的形状和颜色将始终保持一致。我们还没有递增噪声坐标值——这是一个至关重要的步骤，但非常容易忘记（我自己就多次遗漏了这行代码，导致经常抓耳挠腮）。我们接下来将处理此步骤，同时增加色调值，并通过`noiseValue`变量对其进行微调。作为最后的点缀，我们将添加一些随机的“气泡”（参见图
    6-12）。别问我为什么。


    ![](img/538894_1_En_6_Fig12_HTML.png)


    一张抽象图展示了一个正方形结构，上面有一系列重叠的、带有随机气泡的立方贝塞尔曲线，背景为深色。


    **图 6-12** 噪声调制的有机曲线


    ```

    // 递增噪声和色调。

    n += speed;

    hue = (hue % 360) + (noiseValue / 25);

    // 10% 的概率生成一个“气泡”。

    if (Gen.chance(10)) {

    svg.create(''circle'').set({

    r: Gen.random(5, 50),

    cx: Gen.random(150, 850),

    cy: Gen.random(150, 850),

    fill: `hsl(0 0% 100% / 0.1)`,

    stroke: ''#888''

    });

    }

    ```


    ## 一个更简单的选项


    为每个曲线段处理六个坐标（或者在使用`S`命令时为四个），有时会让人感到有点棘手。能够只用一条平滑曲线连接一系列单个点，而无需担心所有那些额外的控制点，岂不是很棒？


    问得好！SvJs 配备了一个名为`createCurve()`的方法，正好可以做到这一点。在底层，它利用了三次贝塞尔曲线的能力，但抽象掉了控制点，使得构建曲线不再那么令人生畏。这确实牺牲了很大程度的控制权，但在某些情况下，我们可能不需要手动曲线命令所提供的微调级别。使用`createCurve()`方法，我们只需要关心点。


    ```

    // createCurve() 方法的语法。

    createCurve(pointsArray, [curveFactor]);

    ```


    粗略地说，我们可以将其视为一种“连点”方法，主要区别在于我们需要提供点，而不是进行连接。第一个参数`pointsArray`，顾名思义，是一个`[x, y]`坐标对数组。它可以作为标准的一维数组或二维数组（即数组的数组）提供。


    ```

    // 一维点数组。

    let points1D = [25, 30, 45, 20, 80, 10, 90, 40];

    // 相同点的二维数组。

    let points2D = [

    [25, 30], [45, 20], [80, 10], [90, 40]

    ];

    ```


    `curveFactor`参数允许我们修改点之间的张力。值为`0`时，点通过直线连接。值为`1`（默认值）时，张力较松，曲线更平滑。通常，最可用的结果在`0`到`2`的范围内；偏离太远，底层的控制点将重叠并产生一些真正混乱的波形。但在某些情况下，这可能是你想要的。


    在图 6-13 中，我们可以看到上述`curveFactor`值的作用。最上面的曲线设置为`0`，中间的曲线设置为`1`，底部的曲线设置为`5`。浅色的点表示我们的`pointsArray`坐标的位置，仅用于说明目的；正常情况下你不会看到这些被渲染出来。


    ![](img/538894_1_En_6_Fig13_HTML.png)


    一张抽象图展示了一个矩形结构，上面有三条不同的曲线，具有多个波峰和波谷，背景为深色。


    **图 6-13** 使用值 0、1 和 5 改变曲线因子


    ## 总结


    路径现在已成为你生成式工具库的一部分，为你开启了更多可能性。回顾一下，我们涵盖了以下内容：


    *   路径数据（`d`）字符串格式及其提供的灵活性和经济性。

    *   绝对路径命令和相对路径命令之间的区别

    *   `L`、`V`和`H`直线命令

    *   `Q`和`T`二次贝塞尔曲线命令。

    *   什么是控制点以及如何利用它们

    *   椭圆弧曲线命令`A`及其复杂的参数数组

    *   `C`和`S`三次贝塞尔曲线命令

    *   使用噪声和随机性来塑造曲线

    *   SvJs 的`createCurve()`方法


    在下一章中，我们将探索运动、动画以及如何使我们的草图具有交互性。


    ## 7. 运动与交互性

    '
- fmt: "# 交互式生成艺术的核心技术\n\n生成艺术区别于其他艺术形式的一个特点，是其能够融入交互性，并因此吸引观众主动参与。观众——无论是笔记本电脑前的单个用户，还是艺术装置前的一小群人——都可以影响甚至决定最终结果。本质上，这种艺术是*动态*的；它移动、响应、流动，而非固定和最终的。\n\
    \n在本章中，我们将探索交互式艺术的一些底层技术，包括事件监听器、回调函数、光标追踪、碰撞检测，以及如何利用这些技术实时修改我们的 SVG 元素和属性。我们还将深入研究可用于动画化\
    \ SVG 的不同方法，在决定本章剩余部分将采用的方法之前，讨论它们的优缺点。\n\n## 事件监听器\n\n鼠标点击是一个事件，按下键盘上的某个键或点击平板电脑的触摸屏也是如此。当此类事件在网页浏览器上下文中发生时，作为\
    \ JavaScript 程序员，我们可以竖起虚拟的耳朵去监听它们。一旦检测到事件，我们就可以捕获它。捕获事件后做什么由我们决定。我们可以用它来触发任何事情——一条自定义消息、颜色变化、简单的动画、复杂的变换；可能性是无穷无尽的。但首先，我们需要知道如何“监听”。\n\
    \n幸运的是，这很简单：我们可以使用一个名为`addEventListener()`的浏览器原生函数。此函数需要三样东西：一，要附加到的元素（即负责监听的元素）；二，要监听的事件类型（例如，鼠标点击）；三，监听到事件时要执行的操作（即回调函数执行的动作）。其形式如下：\n\
    \n```javascript\n// 为 HTML 或 SVG 元素添加事件监听器。\nelement.addEventListener('eventType',\
    \ doSomething);\n```\n\n这里我们假设回调函数`doSomething()`在代码的其他地方已定义。请注意，在这种情况下，它仅通过名称提供，不带括号。这是为了防止函数被过早触发。而对于匿名函数或箭头函数，情况则不同，它们可以在定义时直接使用，而不会有立即被调用的风险。\n\
    \n```javascript\n// 使用箭头语法定义回调函数。\nelement.addEventListener('eventType', () =>\
    \ {\n  // 在此处执行某些操作...\n});\n```\n\n## 事件类型\n\n我们可以选择监听的事件类型有很多，但我们将重点关注对生成艺术有用的一小部分：键盘事件、表单事件和指针事件类型。\n\
    \n像`keydown`和`keyup`这样的键盘事件类型会捕获打字时敲击按键的不同阶段。像`change`和`input`这样的表单事件类型可以捕获用于输入数据的界面元素（例如滑块、文本字段和下拉菜单）的更新。而指针事件类型，或许对生成艺术而言是最重要的一类，是鼠标和触摸屏事件类型的更现代替代方案，旨在与硬件无关。指针事件类型包括`pointerdown`、`pointermove`、`pointerover`和`pointerup`。出于我们的目的，我们也可以将`click`事件类型——技术上属于鼠标事件——归入此类，因为它也能捕获简单的触摸事件，例如手指轻点。\n\
    \n```javascript\n// 捕获鼠标、手写笔或手指在元素上的移动。\nelement.addEventListener('pointermove',\
    \ () => {\n  // 在此处执行某些操作...\n});\n```\n\n## 事件参数\n\n当事件监听器附加到元素并捕获到一个事件时，该事件可以作为参数传递给回调函数。例如，如果我们向\
    \ HTML 的`document.body`添加一个事件监听器来检测`click`事件，那么`click`事件的属性也将被捕获，并可供回调函数使用。\n\n\
    以下是实际工作方式的示例。在下面的代码中，每次你点击 HTML 页面`body`内的任意位置时，鼠标或指针设备的位置都会被记录到控制台。\n\n```javascript\n\
    // 在点击时记录用户的指针坐标。\ndocument.body.addEventListener('click', (event) => {\n  let\
    \ x = event.clientX;\n  let y = event.clientY;\n  console.log(`x: ${x}, y: ${y}`);\n\
    });\n```\n\n`clientX`和`clientY`属性只是`click`事件内置的众多属性中的两个。完整的列表可以在 MDN（[`developer.mozilla.org/docs/Web/API/Element/click_event`](http://developer.mozilla.org/docs/Web/API/Element/click_event)）上找到，那里还提供了涵盖所有\
    \ DOM 事件的全面文档。\n\n## 触发 SvJs 的保存方法\n\n假设我们有了一个满意的草图，并且想要保存由我们的 JavaScript 生成的实际\
    \ SVG 标记——我们该怎么做？也许最快的方法是打开浏览器的开发者工具，选择“元素”选项卡，检查 DOM 树直到找到根 SVG 元素。然后右键点击它，选择“复制”，再选择嵌套的“复制\
    \ outerHTML”选项。这给了我们想要的 SVG 文件数据，但不是文件本身。因此，作为最后一步，我们需要打开一个文本或代码编辑器，将剪贴板内容粘贴进去，*然后*将其保存为\
    \ SVG 文件。这并不方便。\n\n如果能简单地按下键盘上的某个键，让整个过程自动完成，那就容易多了。SvJs 确实有一个可用于此目的的`save()`方法，但它首先需要被“连接”到一个事件监听器才能触发。我们现在就来完成这项工作。\n\
    \n打开我们之前的任意一个草图，在草图的底部，编写一个函数，以便在我们按下“s”键时调用此方法。事件类型将是`keydown`，它在按下任意键时触发，所以我们需要确保将`event`作为参数传递给我们的回调函数，以便我们能够查询它的`key`属性；正是这个属性告诉我们实际按下的是哪个键。只有当`key`等于“s”时，我们才会触发`save()`方法，并且不区分大小写（这样也能捕获到大写的“S”）。\n\
    \n```javascript\n// 将根 svg 保存为可下载的文件。\ndocument.addEventListener('keydown', (event)\
    \ => {\n  let key = event.key.toLowerCase();\n  if (key === 's') svg.save();\n\
    });\n```\n\n对于以后的任何草图，都可以随意使用上述方法。另外，`save()`方法可以在任何 SVG 元素上调用，这意味着如果你愿意，你可以只保存\
    \ SVG 的一部分——尽管这种用例比较少见。\n\n## 创意光标追踪\n\n在我们展示事件监听器实际应用的第一个示例中，我们演示了如何实现鼠标光标的追踪。我们只需查询鼠标事件的`clientX`和`clientY`坐标即可。这是有意简化了的，因为相对于\
    \ SVG 的`viewport`（它使用自己的坐标空间）来精确追踪鼠标的位置会稍微复杂一些。\n\n### SvJs 的 trackCursor() 方法\n\
    \n为了解决这个问题，SvJs 内置了一个`trackCursor()`方法，可以在根 SVG 元素上调用。它会自动处理附加相关事件监听器（`pointermove`和`pointerleave`）、将光标位置转换到`viewBox`坐标空间，并确保在触摸屏设备上也能出现预期行为。要激活它，只需在主\
    \ SVG 元素上按如下方式调用即可：\n\n```javascript\nsvg.trackCursor();\n```\n\n一旦激活，它会更新父 SVG\
    \ 的两个属性：`cursorX`和`cursorY`，这两个属性告诉我们当前光标位于`viewBox`（而非网页浏览器窗口）中的位置。它还允许我们传入自己的自定义回调函数，以便在光标位置更新时触发。\n\
    \n```javascript\n// 传入自定义回调。\nsvg.trackCursor(() => {\n  // ...执行操作\n});\n```"
  raw: 'One characteristic that tends to distinguish generative art from

    other art forms is its ability to incorporate interactivity, and, as a

    result, active audience participation. This audience `–` whether it be a

    single user on a laptop or a small crowd at an art installation `–` can then influence,

    or even determine, the end result. In essence, such art is

    *dynamic*; it moves; it responds; it flows. It isn’t fixed and

    final.

    In this chapter, we’ll explore some of the underlying techniques of

    interactive art, including event listeners, callback functions, cursor

    tracking, collision detection, and how to use these to alter our SVG

    elements and attributes in real time. We’ll also delve into the

    different methods that can be used to animate SVG and discuss their

    strengths and weaknesses before deciding on the method we’ll adopt for

    the remainder of the chapter.


    Event Listeners

    A mouse click is an event, as is hitting a key on your keyboard, or

    tapping your tablet’s touchscreen display. When events like this occur

    in the context of a web browser, as JavaScript programmers,

    we can prick up our virtual ears and listen out for them. And as soon as

    an event is detected, we can capture it. What we do once we’ve captured

    an event is up to us. We could use it to trigger any number of things

    `–` a custom

    message, a color change, a simple animation, a complex transformation;

    the possibilities are endless. But first we need to know how to

    “listen.”


    Thankfully this is straightforward: we can utilize a browser-native

    function called `addEventListener()`.

    This function needs three things: one, an element to attach itself to

    (i.e., the element that will do the listening); two, the event type to

    listen out for (e.g., a mouse click); and three, what to do when it

    hears it (i.e., the action performed by the callback function). It takes

    the following form:


    ```

    // Adding an event listener to a HTML or SVG element.

    element.addEventListener(''eventType'', doSomething);

    ```


    We are assuming here that the callback function `doSomething()` is

    defined elsewhere in the code. Note that in this case it is supplied by

    name only, without the parentheses. This is so that the function doesn’t

    trigger prematurely. The situation is different with anonymous `–` or arrow `–`
    functions, which

    can be defined there and then without the danger of being immediately

    invoked.


    ```

    // Using arrow syntax to define the callback function.

    element.addEventListener(''eventType'', () => {

    // do something here...

    });

    ```


    Event Types

    There are numerous types of events we can choose to

    listen out for, but we will focus on a small subset useful for

    generative art: keyboard, form, and pointer event types.


    Keyboard event types like `keydown` and `keyup` capture the

    different phases of hitting a key as you type. Form event types like

    `change` and

    `input` can

    capture updates to interface elements for inputting data, such as

    sliders, text fields, and drop-downs. And pointer event types, perhaps

    the most significant of the lot where generative art is concerned, are a

    more modern alternative to mouse and touchscreen event types that aim to

    be more hardware-agnostic. Pointer event types include `pointerdown`, `pointermove`,
    `pointerover`, and

    `pointerup`, and

    for our purposes, we can also consider the `click` event type

    `–` technically a

    mouse event `–`

    as falling under this umbrella, as it can also capture simple touch

    events like a finger tap.


    ```

    // Capturing the movement of a mouse, stylus or finger over an element.

    element.addEventListener(''pointermove'', () => {

    // do something here...

    });

    ```


    Event Parameters

    When an event listener is attached to an element and captures an

    event, that event can then be passed to the callback function as an

    argument. For example, if we were to add an event listener to our HTML

    `document.body`

    to detect `click`

    events, the properties of that `click` event would

    also be captured and could be put to use by the callback function.


    Here’s how this could work in practice. In the following code, the

    position of the mouse or pointer device is logged to the console each

    time you click anywhere within the `body` of the HTML

    page.


    ```

    // Log the user''s pointer co-ordinates on click.

    document.body.addEventListener(''click'', (event) => {

    let x = event.clientX;

    let y = event.clientY;

    console.log(`x: ${x}, y: ${y}`);

    });

    ```


    The `clientX`

    and `clientY`

    properties are just a couple of the many properties built into a `click` event.
    The full

    list can be found over at MDN ([`developer.mozilla.org/docs/Web/API/Element/click_event`](http://developer.mozilla.org/docs/Web/API/Element/click_event)),

    including comprehensive documentation covering the full range of DOM

    events.


    Triggering the SvJs Save Method

    Say we have a sketch we’re happy with, and we wanted to save the

    actual SVG markup generated by our JavaScript `–` how would we go

    about it? Perhaps the quickest way is to open up our browser’s developer

    tools, select the Elements tab, and inspect the DOM tree until we locate

    the root SVG element. Then we can right-click it, select “Copy”, and

    choose the nested “Copy outerHTML” option. This gives us the SVG file

    data that we want, but not the file itself, so as a final step, we need

    to open up a text or code editor, paste our clipboard contents into it,

    and *then* save it as an SVG file. Not exactly convenient.

    It would be far easier to just hit a key on our keyboard and have the

    process happen automatically. SvJs does has a `save()` method that can be used
    for

    this purpose, but it first needs to be “wired up” to an event listener

    in order to fire. Let’s do this now.


    Open up any one of our previous sketches, and at the bottom of the

    sketch, let’s write a function to call this method whenever we hit the

    “s” key. The event type will be `keydown`, which is

    triggered when any key is pressed, so we need to make sure we pass the

    `event` as an

    argument to our callback function so that we can query its `key` property; this
    is

    what tells us the actual key that was pressed. We’ll trigger the `save()` method
    only

    when that `key`

    is equal to “s”, irrespective of case (allowing us to capture the

    capital “S” too).


    ```

    // Save the root svg as a downloadable file.

    document.addEventListener(''keydown'', (event) => {

    let key = event.key.toLowerCase();

    if (key === ''s'') svg.save();

    });

    ```


    Feel free to use the aforementioned for any sketch going forward. And

    incidentally, the `save()` method can be

    called on any SVG element, meaning you can save just a portion of your

    SVG if you prefer `–` though the use

    cases for this are rarer.


    Creative Cursor Tracking

    In our first example of an event listener in action, we showed how

    tracking the mouse cursor might be achieved. We simply had to query the

    `clientX` and

    `clientY`

    coordinates of the mouse event. This was purposely simplified, as

    accurately tracking the position of our mouse relative to the SVG

    `viewport` (which

    uses its own coordinate space) is a bit trickier.


    The SvJs trackCursor( ) Method


    To solve this, SvJs has a built-in `trackCursor()` method that can be

    called on the root SVG element. It automatically takes care of attaching

    the relevant event listeners (`pointermove` and `pointerleave`),

    transforming the cursor position into the `viewBox` coordinate

    space, and ensuring the expected behavior also occurs with touchscreen

    devices. To activate it, it just needs to be called on the main SVG

    element as follows:


    ```

    svg.trackCursor();

    ```


    Once activated, it updates two properties of the parent SVG: `cursorX` and `cursorY`,
    which tell

    us where in the `viewBox` (rather than

    the web browser window) our cursor is currently located. It also allows

    us to pass in our own custom callback function, to be triggered each

    time the cursor position is updated.


    ```

    // Passing in a custom callback.

    svg.trackCursor(() => {

    // ... do stuff

    });

    ```'
  trans: "```markdown\n\n# 交互式生成艺术的核心技术\n\n生成艺术区别于其他艺术形式的一个特点，是其能够融入交互性，并因此吸引观众主动参与。观众——无论是笔记本电脑前的单个用户，还是艺术装置前的一小群人——都可以影响甚至决定最终结果。本质上，这种艺术是*动态*的；它移动、响应、流动，而非固定和最终的。\n\
    \n在本章中，我们将探索交互式艺术的一些底层技术，包括事件监听器、回调函数、光标追踪、碰撞检测，以及如何利用这些技术实时修改我们的 SVG 元素和属性。我们还将深入研究可用于动画化\
    \ SVG 的不同方法，在决定本章剩余部分将采用的方法之前，讨论它们的优缺点。\n\n## 事件监听器\n\n鼠标点击是一个事件，按下键盘上的某个键或点击平板电脑的触摸屏也是如此。当此类事件在网页浏览器上下文中发生时，作为\
    \ JavaScript 程序员，我们可以竖起虚拟的耳朵去监听它们。一旦检测到事件，我们就可以捕获它。捕获事件后做什么由我们决定。我们可以用它来触发任何事情——一条自定义消息、颜色变化、简单的动画、复杂的变换；可能性是无穷无尽的。但首先，我们需要知道如何“监听”。\n\
    \n幸运的是，这很简单：我们可以使用一个名为`addEventListener()`的浏览器原生函数。此函数需要三样东西：一，要附加到的元素（即负责监听的元素）；二，要监听的事件类型（例如，鼠标点击）；三，监听到事件时要执行的操作（即回调函数执行的动作）。其形式如下：\n\
    \n```javascript\n// 为 HTML 或 SVG 元素添加事件监听器。\nelement.addEventListener('eventType',\
    \ doSomething);\n```\n\n这里我们假设回调函数`doSomething()`在代码的其他地方已定义。请注意，在这种情况下，它仅通过名称提供，不带括号。这是为了防止函数被过早触发。而对于匿名函数或箭头函数，情况则不同，它们可以在定义时直接使用，而不会有立即被调用的风险。\n\
    \n```javascript\n// 使用箭头语法定义回调函数。\nelement.addEventListener('eventType', () =>\
    \ {\n  // 在此处执行某些操作...\n});\n```\n\n## 事件类型\n\n我们可以选择监听的事件类型有很多，但我们将重点关注对生成艺术有用的一小部分：键盘事件、表单事件和指针事件类型。\n\
    \n像`keydown`和`keyup`这样的键盘事件类型会捕获打字时敲击按键的不同阶段。像`change`和`input`这样的表单事件类型可以捕获用于输入数据的界面元素（例如滑块、文本字段和下拉菜单）的更新。而指针事件类型，或许对生成艺术而言是最重要的一类，是鼠标和触摸屏事件类型的更现代替代方案，旨在与硬件无关。指针事件类型包括`pointerdown`、`pointermove`、`pointerover`和`pointerup`。出于我们的目的，我们也可以将`click`事件类型——技术上属于鼠标事件——归入此类，因为它也能捕获简单的触摸事件，例如手指轻点。\n\
    \n```javascript\n// 捕获鼠标、手写笔或手指在元素上的移动。\nelement.addEventListener('pointermove',\
    \ () => {\n  // 在此处执行某些操作...\n});\n```\n\n## 事件参数\n\n当事件监听器附加到元素并捕获到一个事件时，该事件可以作为参数传递给回调函数。例如，如果我们向\
    \ HTML 的`document.body`添加一个事件监听器来检测`click`事件，那么`click`事件的属性也将被捕获，并可供回调函数使用。\n\n\
    以下是实际工作方式的示例。在下面的代码中，每次你点击 HTML 页面`body`内的任意位置时，鼠标或指针设备的位置都会被记录到控制台。\n\n```javascript\n\
    // 在点击时记录用户的指针坐标。\ndocument.body.addEventListener('click', (event) => {\n  let\
    \ x = event.clientX;\n  let y = event.clientY;\n  console.log(`x: ${x}, y: ${y}`);\n\
    });\n```\n\n`clientX`和`clientY`属性只是`click`事件内置的众多属性中的两个。完整的列表可以在 MDN（[`developer.mozilla.org/docs/Web/API/Element/click_event`](http://developer.mozilla.org/docs/Web/API/Element/click_event)）上找到，那里还提供了涵盖所有\
    \ DOM 事件的全面文档。\n\n## 触发 SvJs 的保存方法\n\n假设我们有了一个满意的草图，并且想要保存由我们的 JavaScript 生成的实际\
    \ SVG 标记——我们该怎么做？也许最快的方法是打开浏览器的开发者工具，选择“元素”选项卡，检查 DOM 树直到找到根 SVG 元素。然后右键点击它，选择“复制”，再选择嵌套的“复制\
    \ outerHTML”选项。这给了我们想要的 SVG 文件数据，但不是文件本身。因此，作为最后一步，我们需要打开一个文本或代码编辑器，将剪贴板内容粘贴进去，*然后*将其保存为\
    \ SVG 文件。这并不方便。\n\n如果能简单地按下键盘上的某个键，让整个过程自动完成，那就容易多了。SvJs 确实有一个可用于此目的的`save()`方法，但它首先需要被“连接”到一个事件监听器才能触发。我们现在就来完成这项工作。\n\
    \n打开我们之前的任意一个草图，在草图的底部，编写一个函数，以便在我们按下“s”键时调用此方法。事件类型将是`keydown`，它在按下任意键时触发，所以我们需要确保将`event`作为参数传递给我们的回调函数，以便我们能够查询它的`key`属性；正是这个属性告诉我们实际按下的是哪个键。只有当`key`等于“s”时，我们才会触发`save()`方法，并且不区分大小写（这样也能捕获到大写的“S”）。\n\
    \n```javascript\n// 将根 svg 保存为可下载的文件。\ndocument.addEventListener('keydown', (event)\
    \ => {\n  let key = event.key.toLowerCase();\n  if (key === 's') svg.save();\n\
    });\n```\n\n对于以后的任何草图，都可以随意使用上述方法。另外，`save()`方法可以在任何 SVG 元素上调用，这意味着如果你愿意，你可以只保存\
    \ SVG 的一部分——尽管这种用例比较少见。\n\n## 创意光标追踪\n\n在我们展示事件监听器实际应用的第一个示例中，我们演示了如何实现鼠标光标的追踪。我们只需查询鼠标事件的`clientX`和`clientY`坐标即可。这是有意简化了的，因为相对于\
    \ SVG 的`viewport`（它使用自己的坐标空间）来精确追踪鼠标的位置会稍微复杂一些。\n\n### SvJs 的 trackCursor() 方法\n\
    \n为了解决这个问题，SvJs 内置了一个`trackCursor()`方法，可以在根 SVG 元素上调用。它会自动处理附加相关事件监听器（`pointermove`和`pointerleave`）、将光标位置转换到`viewBox`坐标空间，并确保在触摸屏设备上也能出现预期行为。要激活它，只需在主\
    \ SVG 元素上按如下方式调用即可：\n\n```javascript\nsvg.trackCursor();\n```\n\n一旦激活，它会更新父 SVG\
    \ 的两个属性：`cursorX`和`cursorY`，这两个属性告诉我们当前光标位于`viewBox`（而非网页浏览器窗口）中的位置。它还允许我们传入自己的自定义回调函数，以便在光标位置更新时触发。\n\
    \n```javascript\n// 传入自定义回调。\nsvg.trackCursor(() => {\n  // ...执行操作\n});\n```\n\
    \n```"
- fmt: "# Interactive Ellipses\n\nLet’s set up a new sketch to show how `trackCursor()`\
    \ can be put to creative use. Copy our template folder and call it something like\
    \ `17-cursor-tracking`. We’re going to re-create a variation of our very first\
    \ sketch from Chapter [1](#538894_1_En_1_Chapter.xhtml), but this time we’ll make\
    \ it interactive.\n\nBelow the background, initialize the following variables.\
    \ The `ellipses` array is a new addition; we’ll use this to store the created\
    \ ellipses so we can iterate through them afterward.\n\n```\n// Randomise some\
    \ variables.\nlet hue = Gen.random(0, 360);\nlet rotation = Gen.random(0, 360);\n\
    let iterations = Gen.random(50, 100);\n// This array will allow us to iterate\
    \ through our ellipses later.\nlet ellipses = [];\n```\n\nNow for the loop to\
    \ create the ellipses. The code here is more compact than that presented in the\
    \ first chapter, as we’ve since covered more concise ways of achieving certain\
    \ results (like incrementing our `hue`). Another difference of note is the addition\
    \ of the `ellipses.push()` method; this is where we add each ellipse to the aforementioned\
    \ array.\n\n```\n// Run a loop a random number of times to create the ellipses.\n\
    for (let i = 0; i < iterations; i += 1) {\n  // Create our ellipse.\n  let ellipse\
    \ = svg.create('ellipse');\n  ellipse.set({\n    cx: 500,\n    cy: 500,\n    rx:\
    \ 100 + (i * 3),\n    ry: 300 + (i * 2),\n    fill: 'none',\n    stroke: `hsl(${hue}\
    \ 80% 80% / 0.6)`,\n    transform: `rotate(${rotation + (i * 2)} 500 500)`\n \
    \ });\n  // Add the ellipse to the array.\n  ellipses.push(ellipse);\n  // Increment\
    \ the hue.\n  hue = (hue % 360) + 2;\n}\n```\n\nYou should now see a static arrangement\
    \ of ellipses. Our next step is make them dynamic. What we’ll do is activate the\
    \ `trackCursor()` method on the main SVG and pass in an arrow function as a callback.\
    \ Inside this arrow function, we’ll iterate through each item in the `ellipses`\
    \ array using a `forEach()` loop and adjust the `cx` and `cy` coordinates of each\
    \ ellipse relative to our cursor position.\n\n```\n// Adjust the centre point\
    \ of each ellipse relative to our cursor.\nsvg.trackCursor(() => {\n  ellipses.forEach((ellipse)\
    \ => {\n    ellipse.set({\n      cx: svg.cursorX,\n      cy: svg.cursorY\n   \
    \ });\n  });\n});\n```\n\nAnd with this, we have movement – our ellipses glide\
    \ gracefully into life as we create a truly dynamic cursor-guided composition!\
    \ Figure [7-1](#538894_1_En_7_Chapter.xhtml#Fig1) illustrates one possible variation\
    \ with the cursor just south of center. A key-mapped save function is particularly\
    \ useful here (I used it myself to save down Figure [7-1](#538894_1_En_7_Chapter.xhtml#Fig1)),\
    \ as it allows us to capture our SVG without disturbing the composition with inadvertent\
    \ cursor movement (as might happen if we had to click a button).\n\n![](images/538894_1_En_7_Chapter/538894_1_En_7_Fig1_HTML.png)\n\
    \n> An abstract presents a square-shaped structure with an array of ellipses in\
    \ a spinning pattern, against a dark background.\n\n**Figure 7-1** – A cursor-transformed\
    \ array of ellipses\n\nNow that we know how to achieve movement via interactivity,\
    \ it’s time to learn how to make things move independently of our input.\n\n#\
    \ Programming Motion\n\nAs mentioned previously, we have several different methods\
    \ at our disposal for animating SVG. The first one we’ll explore is CSS keyframes,\
    \ which will be familiar territory to most web developers. The second is the method\
    \ native to the SVG format itself – SMIL. The third is the Web Animations API\
    \ (or WAAPI), which is a modern JavaScript-driven API. And the final method is\
    \ a technique popular among generative artists (of the JavaScript variety at least):\
    \ the recursive `requestAnimationFrame` method. Knowledge of each technique and\
    \ their respective strengths and weaknesses should serve you well, irrespective\
    \ of which one we proceed with. We’ll set up a simple sketch that will showcase,\
    \ in a very rudimentary way, all four options. When you’re ready, set up a new\
    \ instance of our template sketch and call it something like `18-making-things-move`.\n\
    \nWhat we’re going to do is create a diamond shape comprised of four overlaid\
    \ squares of different dimensions (as shown in Figure [7-2](#538894_1_En_7_Chapter.xhtml#Fig2))\
    \ and animate each one using a different technique. The following code sets things\
    \ up, and apart from the `transform_origin` attribute (which will ensure more\
    \ consistent animation behavior across the various methods by setting a default\
    \ point of rotation), there’s nothing really new here, so feel free to simply\
    \ copy and paste:\n\n![](images/538894_1_En_7_Chapter/538894_1_En_7_Fig2_HTML.png)\n\
    \n> An abstract presents a square-shaped structure, which has a diamond-shaped\
    \ four overlaid bright squares, against a dark background.\n\n**Figure 7-2** –\
    \ The four shapes we'll make move\n\n```\nimport { SvJs } from '../../node_modules/svjs/src/index.js';\n\
    \n// Parent SVG.\nconst svg = new SvJs().addTo(document.getElementById('container'));\n\
    \n// Viewport and viewBox (1:1 aspect ratio).\nconst svgSize = Math.min(window.innerWidth,\
    \ window.innerHeight);\nsvg.set({ width: svgSize, height: svgSize, viewBox: '0\
    \ 0 1000 1000' });\n\n// Background.\nsvg.create('rect').set({\n  x: 0, y: 0,\
    \ width: 1000, height: 1000, fill: '#181818'\n});\n\n// Arrays to contain our\
    \ shapes and their colours.\nlet palette = ['#34d399', '#6ee7b7', '#a7f3d0', '#d1fae5'];\n\
    let shapes = [];\n\n// Initialise our four shapes.\nfor (let i = 0; i < 4; i +=\
    \ 1) {\n  let size = 500 - (i * 125);\n  let position = 250 + (i * 62.5);\n  let\
    \ shape = svg.create('rect').set({\n    x: position,\n    y: position,\n    width:\
    \ size,\n    height: size,\n    fill: palette[i],\n    transform_origin: '50%\
    \ 50%',\n    transform: 'rotate(45)'\n  });\n  shapes.push(shape);\n}\n```\n\n\
    ## CSS Keyframes\n\nAnimated sequences can be created with CSS using a `@keyframes`\
    \ rule. Much like traditional keyframes used in animation, motion graphics, and\
    \ video editing software, CSS `@keyframes` define the state of certain properties\
    \ at a particular point in time (or step in a sequence). For example, at time\
    \ `t`, our subject might be at position `[x1, y1]`, and at time `t + 5`, the subject\
    \ might have moved to `[x2, y2]`. Keyframes define these points in time, and the\
    \ transition between one state and another is what constitutes the animation.\
    \ We call this process “tweening” (meaning “inbetweening”), as the animation occurs\
    \ in these inbetween states.\n\nThe syntax for CSS `@keyframes` is quite self-explanatory.\
    \ You can set the start and end keyframes of a simple animation with `from` and\
    \ `to` directives, or if you have something a little more complex in mind, you\
    \ can use percentages to specify the point at which certain transitions should\
    \ trigger. Once the `@keyframes` rule is defined, it then needs to be called by\
    \ an element using the `animation-name` property, and we also need to specify\
    \ how long the animation should take (the `animation-duration`). There are other\
    \ optional properties that we can define, such as the `animation-timing-function`\
    \ (also known as easing), which describes *how* we transition from one property\
    \ value to another, and the `animation-iteration-count`, which specifies how many\
    \ times our animation should play.\n\nIn the following code, we’re calling the\
    \ first shape of our array and assigning it an id of `cssShape`. This will enable\
    \ us to easily target the element later. We then set up a `@keyframes` rule called\
    \ `scaleRotate` that rotates its target a full 360 degrees, while simultaneously\
    \ scaling it down along its x axis and up along its y axis (creating a stretching\
    \ effect) before returning it to its original dimensions. And finally we assign\
    \ the animation to the `cssShape` element, specifying the duration, iteration\
    \ count, and timing function."
  raw: 'Interactive Ellipses

    Let’s set up a new sketch to show how `trackCursor()` can be

    put to creative use. Copy our template folder and call it something like

    `17-cursor-tracking`.

    We’re going to re-create a variation of our very first sketch from

    Chapter [1](#538894_1_En_1_Chapter.xhtml), but this time we’ll make it

    interactive.


    Below the background, initialize the following variables. The `ellipses` array
    is a

    new addition;

    we’ll use this to store the created ellipses so we can iterate through

    them afterward.


    ```

    // Randomise some variables.

    let hue = Gen.random(0, 360);

    let rotation = Gen.random(0, 360);

    let iterations = Gen.random(50, 100);

    // This array will allow us to iterate through our ellipses later.

    let ellipses = [];

    ```


    Now for the loop to create the ellipses. The code here is more compact

    than that presented in the first chapter, as we’ve since covered more

    concise ways of achieving certain results (like incrementing our hue).

    Another difference of note is the addition of the `ellipses.push()`

    method; this is where we add each ellipse to the aforementioned array.


    ```

    // Run a loop a random number of times to create the ellipses.

    for (let i = 0; i < iterations; i += 1) {

    // Create our ellipse.

    let ellipse = svg.create(''ellipse'');

    ellipse.set({

    cx: 500,

    cy: 500,

    rx: 100 + (i * 3),

    ry: 300 + (i * 2),

    fill: ''none'',

    stroke: `hsl(${hue} 80% 80% / 0.6)`,

    transform: `rotate(${rotation + (i * 2)} 500 500)`

    });

    // Add the ellipse to the array.

    ellipses.push(ellipse);

    // Increment the hue.

    hue = (hue % 360) + 2;

    }

    ```


    You should now see a static arrangement of ellipses. Our next step is

    make them dynamic. What we’ll do is activate the `trackCursor()` method

    on the main SVG and pass in an arrow function as a callback. Inside this

    arrow function,

    we’ll iterate through each item in the `ellipses` array using

    a `forEach()`

    loop and adjust the `cx` and `cy` coordinates of

    each ellipse relative to our cursor position.


    ```

    // Adjust the centre point of each ellipse relative to our cursor.

    svg.trackCursor(() => {

    ellipses.forEach((ellipse) => {

    ellipse.set({

    cx: svg.cursorX,

    cy: svg.cursorY

    });

    });

    });

    ```


    And with this, we have movement `–` our ellipses glide

    gracefully into life as we create a truly dynamic cursor-guided

    composition! Figure [7-1](#538894_1_En_7_Chapter.xhtml#Fig1) illustrates one

    possible variation with the cursor just south of center. A key-mapped

    save function is particularly useful here (I used it myself to save down

    Figure [7-1](#538894_1_En_7_Chapter.xhtml#Fig1)), as it allows

    us to capture our SVG without disturbing the composition with

    inadvertent cursor movement (as might happen if we had to click a

    button).


    ![](images/538894_1_En_7_Chapter/538894_1_En_7_Fig1_HTML.png)


    An abstract presents a square-shaped structure with an array of

    ellipses in a spinning pattern, against a dark background.


    Figure 7-1

    A cursor-transformed array of ellipses


    Now that we know how to achieve movement via interactivity, it’s time

    to learn how to make things move independently of our input.


    Programming Motion

    As mentioned previously, we have several different methods at our

    disposal for animating SVG. The first one we’ll explore is CSS

    keyframes, which will be familiar territory to most web developers. The

    second is the method native to the SVG format itself `–` SMIL. The third is

    the Web Animations API (or WAAPI), which is a modern JavaScript-driven

    API. And the final method is a technique popular among generative

    artists (of the JavaScript variety at least): the recursive `requestAnimationFrame`

    method.

    Knowledge of each technique and their

    respective strengths and weaknesses should serve you well, irrespective

    of which one we proceed with. We’ll set up a simple sketch that will

    showcase, in a very rudimentary way, all four options. When you’re

    ready, set up a new instance of our template sketch and call it

    something like `18-making-things-move`.


    What we’re going to do is create a diamond shape comprised of four

    overlaid squares of different dimensions (as shown in Figure [7-2](#538894_1_En_7_Chapter.xhtml#Fig2))
    and animate

    each one using a different technique. The following code sets things up,

    and apart from the `transform_origin`

    attribute (which

    will ensure more consistent animation behavior across the various

    methods by setting a default point of rotation), there’s nothing really

    new here, so feel free to simply copy and paste:


