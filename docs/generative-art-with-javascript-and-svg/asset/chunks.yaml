    \n**图 4-3** 随机元素像五彩纸屑般散落\n\n## 规则网格\n\n不受约束的随机性只能让我们走到这一步；我们需要一些技巧来驯服和约束它。在生成艺术领域，一个特别突出的技巧是使用网格，它允许我们结构化地组织随机性。\n\
    \n### 嵌套 For 循环\n\n嵌套 `for` 循环由一个在另一个循环内部运行的循环组成。由于网格由列（沿 x 轴）和行（沿 y 轴）组成，因此嵌套\
    \ `for` 循环在其构建中非常有用。通常的做法是，我们沿 y 轴开始创建行，然后对于每一行，我们沿 x 轴从左向右移动，填充该列中的每个单元格。这种移动方式模拟了计算机历史上将像素数据绘制到显示器的方式：从左上角开始，横向移动，然后向下工作。\n\
    \n因此，外循环将是我们的 y 轴，向下移动。对于 y 轴的每次迭代，内（嵌套）循环将横向移动，填充 x 轴。\n\n```\n// 嵌套循环结构示例。\n\
    for (let y = 0; y < height; y += 1) {\n  for (let x = 0; x < width; x += 1) {\n\
    \    // 代码写在这里。\n  }\n}\n```\n\n让我们创建一个草图来更好地说明这一点。复制并重命名模板文件夹，将其命名为 `07-regular-grids`。在背景下方，我们将设置一个组元素来充当我们的网格容器。\n\
    \n```\n// 创建我们的网格容器组。\nlet grid = svg.create('g');\n```\n\n现在运行我们的 `for` 循环，每次迭代向\
    \ `grid` 添加一个 `rect` 元素。\n\n```\n// 用于可视化网格的嵌套循环。\nfor (let y = 0; y < 700; y\
    \ += 50) {\n  for (let x = 0; x < 700; x += 50) {\n    grid.create('rect').set({\n\
    \      x: x, y: y, width: 40, height: 40, fill: 'none', stroke: '#eee'\n    });\n\
    \  }\n}\n```\n\n我们在这里使用的值并非特别有意义；我们可以选择不同的增量值、迭代次数、正方形的宽度和高度等。我们稍后可以整理这些值。如果你运行\
    \ `live-server`，你会注意到网格偏离中心，位于左上方（因为我们的 `x` 和 `y` 值初始化为 `0`）。我们可以调整 `x` 和 `y`\
    \ 值，直到网格与 `viewBox` 的中心对齐，但这会涉及一些繁琐的试错，并且每次更改网格时都需要调整。相反，让我们使用 SvJs 内置的 `moveTo()`\
    \ 方法。`moveTo()` 方法将给定元素按其中心点移动到新位置。新位置以 `(x, y)` 坐标对的形式传入。此方法对组元素特别有用（因为其中心点不容易计算），但也可以用作\
    \ `transform: translate(x y)` 语法更直观的替代方案。SvJs 还提供了一个相关的 `getCentre()` 方法（`moveTo()`\
    \ 方法内部也使用了该方法），用于获取元素的中心坐标，返回一个包含 `x` 和 `y` 属性的 `object`。当你想将一个元素放置在另一个元素内部时，这非常有用。\n\
    \n循环之后，按如下方式调用 `moveTo()` 方法：\n\n```\n// 将网格居中于 viewBox 内。\ngrid.moveTo(500, 500);\n\
