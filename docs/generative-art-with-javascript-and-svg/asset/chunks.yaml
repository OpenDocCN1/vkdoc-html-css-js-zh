    \ to keep the values between `0` and `360`, and inside this, the `hue` will increment\
    \ by the `hueShift`. We’ll then set both the `opacity` (within the `hsl()` function)\
    \ and the `stroke-width` to `0.5`, which will keep the line nice and delicate.\n\
    \n```\nlet l1 = lines.create('line').set({\nx1: 0, y1: 0, x2: 0, y2: lineLength,\n\
    stroke: `hsl(${Gen.constrain(hue + hueShift, 0, 360)} 80% 80% / 0.5)`,\nstroke_width:\
    \ 0.5\n});\n```\n\nFor the second line, we’ll do much the same, except this time\
    \ we’ll stretch the `lineLength` a little, shift the `hue` in the opposite direction,\
    \ and also reduce its `opacity`.\n\n```\nlet l2 = lines.create('line').set({\n\
    x1: 0, y1: 0, x2: 0, y2: lineLength * 1.1,\nstroke: `hsl(${Gen.constrain(hue -\
    \ hueShift, 0, 360)} 80% 80% / 0.25)`,\nstroke_width: 0.5\n});\n```\n\n## Rotating\
    \ and Translating\n\nThe final step will involve some transforms and the usual\
    \ incrementation of our noise coordinate. We’ll rotate the first line positively\
    \ in a clockwise direction and the second line negatively in an anticlockwise\
    \ direction. For this, we’ll use the SvJs `rotate()` method, which is simpler\
    \ than setting a `transform: rotate()` attribute as we’ve done in some previous\
    \ sketches. It also boasts some additional benefits:\n\n- It rotates relative\
    \ to its own center by default, rather than the top left of the canvas.\n- It\
    \ preserves any existing transforms, rather than overwriting them as the `transform`\
    \ attribute does.\n\nWith that in mind, let’s continue with the sketch and complete\
    \ the loop.\n\n```\nl1.rotate(i);\nl2.rotate(-i);\nnX += noiseSpeed;\n```\n\n\
    And finally, outside the loop, move the lines to the center of the canvas and\
