- fmt: "# Systems Simulations\n\nFrom simple rules, unexpected complexity often emerges;\
    \ this is not only true for fractals, but for a number of natural systems. Simulating\
    \ such systems is usually the business of serious science, but in the more advanced\
    \ areas of generative art, you'll see simulations of basic physics (think gravity,\
    \ mass, density, etc.), particle systems (like fog, fire, and smoke), and organic\
    \ behavior (from single cell interactions to the flocking patterns of birds).\n\
    \nNow, `SVG` isn't always the medium of choice for systems simulations – particle\
    \ systems, for example, will perform better in pixel-based environments like the\
    \ HTML canvas – but performance concerns aside, if you're looking to add an extra\
    \ layer to your compositions, sprinkling a bit of science on top of the art, simulating\
    \ natural systems can certainly be worth the work involved. A single sketch could\
    \ become the basis of an endless stream of creative output, as much application\
    \ as artwork.\n\n`John Conway's Game of Life` is a good example of an organic\
    \ simulation; it's a grid-based, zero-player game that simulates patterns of growth,\
    \ decline, and evolution. Each cell in the grid can be in one of two states: \"\
    alive\" or \"dead.\" Living cells contain a fill color; dead cells do not.\n\n\
    The rules that underpin the game are surprisingly simple, yet complexity can nonetheless\
    \ emerge in the form of unexpected patterns and clusters of cells battling it\
    \ out for survival. These rules are as follows:\n\n1.  Any living cell with either\
    \ one or zero neighbors dies.\n2.  Any living cell with either two or three neighbors\
    \ survives to the next \"generation\" (or iteration).\n3.  Any living cell with\
    \ four or more neighbors dies.\n4.  Any empty (i.e., dead) cell with exactly three\
    \ neighbors spawns to life.\n\nFigure [9-4](#538894_1_En_9_Chapter.xhtml#Fig4)\
    \ shows a game a few generations in. Some clusters (like the square of cells in\
    \ the top left and bottom right corners) are in stasis, meaning they survive but\
    \ don't spread and thrive. Other cells are actively sprawling, exploring, disappearing,\
    \ and re-spawning. It can be fun to watch!\n\n![](images/538894_1_En_9_Chapter/538894_1_En_9_Fig4_HTML.png)\n\
    \nAn abstract presents a square-shaped structure, which has a grid-shaped pattern\
    \ with several squares. Some squares in the center, top left, top right, bottom\
    \ left, and bottom right are highlighted.\n\n**Figure 9-4**  \nA snapshot of a\
    \ Game of Life in action\n\nI'll link to more examples for you to play with at\
    \ [`davidmatthew.ie/generative-art-javascript-svg/#systems-simulations`](http://davidmatthew.ie/generative-art-javascript-svg/%2523systems-simulations%25ef%25bb%25bf),\
    \ including other kinds of simulations.\n\n## Closing Comments\n\nAt this stage,\
    \ I've done enough summarizing, so I'd like to leave you with some (rather opinionated)\
    \ parting tips to support you in your generative endeavors:\n\n- Be comfortable\
    \ never knowing enough. With any kind of coding, there's always so much more to\
    \ know. And that's ok.\n- Try to block off bits of time to play with code; you\
    \ don't need to commit to all-nighters. Small habit-forming steps are more sustainable\
    \ than the odd sprint here and there.\n- Embrace simplicity; generative art doesn't\
    \ have to be complicated to be good.\n- Take inspiration from other artists; reverse-engineer\
    \ examples that inspire you.\n- Don't just copy; understand what you implement,\
    \ and always put your own spin on things. It'll help you develop your own style.\n\
    - Give back. Get involved in the community. Contribute code, constructive critiques,\
    \ or simply leave a positive comment on another artist's work and let them know\
    \ you appreciate their efforts.\n- And finally, appreciate your own efforts, regardless\
    \ of the results. Output isn't everything, and your generative journey is your\
    \ own.\n\n## Index\n\n### A\n\n- `A (or a) command`\n- `addEventListener()`\n\
    - `animate()` function\n- Automatism\n\n### B\n\n- Bitmap images\n\n### C\n\n\
    - callback functions\n- `C command`\n- Circularity\n  - animating circles\n  -\
    \ PI slices\n  - randomized variables\n  - sine/cosine\n- Collision detection\n\
