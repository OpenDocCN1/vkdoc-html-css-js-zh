  trans: "\n# 设计思维\n\n设计思维是一套用于规划和创建以人为中心的设计问题的产品与解决方案时，所运用到的战略性和创造性流程及原则。\n\n本系列以设计与创新为两大关键驱动原则，重点关注但不限于以下领域和主题：\n\
    \n* 用户界面 (UI) 与用户体验 (UX) 设计\n* 设计心理学\n* 人机交互 (HCI)\n* 人因工程学设计\n* 产品开发与管理\n* 虚拟现实与混合现实\
    \ (VR/XR)\n* 以用户为中心的建筑环境与智能家居\n* 无障碍性、可持续性与环境设计\n* 学习与教学设计\n* 策略与最佳实践\n\n本系列丛书面向行业内的设计师、开发者、故事讲述者和问题解决者，旨在帮助他们了解当前创造力前沿的最新发展和最佳实践，创建新的范式与解决方案，并激励创意工作者突破边界，设计出比以往更宏大、更卓越的作品。\n\
    \n更多关于本系列的信息，请访问 [`https://link.springer.com/bookseries/15933`](https://link.springer.com/bookseries/15933)。\n\
    \nISSN 2945-7793  \ne-ISSN 2945-7807  \n设计思维  \nISBN 979-8-8688-0085-6  \ne-ISBN\
    \ 979-8-8688-0086-3  \n[`doi.org/10.1007/979-8-8688-0086-3`](https://doi.org/10.1007/979-8-8688-0086-3)\
    \  \n© David Matthew 2024\n\n本作品受版权保护。所有权利完全由出版商独家授权，无论涉及材料的全部或部分，特别是翻译、重印、重绘插图、朗诵、广播、微缩胶片复制或任何其他实体形式，以及电子信息存储与检索、电子改编、计算机软件，或现在已知或今后开发的类似或不同方法的权利。\n\
    \n本出版物中通用描述性名称、注册商标、商标、服务标志等的使用，即使未明确声明，也不意味着这些名称免于相关的保护性法律和法规，因此可自由使用。\n\n出版商、作者及编辑认为本书中的建议和信息在出版之日是真实准确的。出版商及作者或编辑不对本书所包含的材料或可能存在的任何错误或遗漏提供明示或暗示的保证。对于出版地图中的管辖权主张和机构隶属关系，出版商保持中立。\n\
    \n本 Apress 印记由 Springer Nature 旗下注册公司 APress Media, LLC 出版。\n\n注册公司地址：美国纽约州纽约市新广场\
    \ 1 号，邮编 10004。\n\n*献给创作艺术这一深刻的人类体验。*\n\n## 引言\n\n在开始之前，先提个醒：生成式艺术，以及更广泛的创意编程，可能会成为一种让人沉迷的瘾。\"\
    再来一次迭代\"是你可能从那些身陷其中的不幸艺术家口中听到的口头禅。创意工作者渴望下一次生成式创作的快感，并恰好掺入恰到好处的随机性。\n\n本书的目的是以清晰、合乎逻辑的方式，小剂量地揭示这种计算魔法，让你能够安全且神志清醒地接触这个主题。我们将见证由机械精确性诞生的有机形态，不可预测的色彩铺满屏幕，线条与形状以不可思议的和谐汇聚，以及从简单规则中涌现出的复杂结构。这便是生成式艺术的精髓——一切并非尽在你掌控之中。\n\
    \n话虽如此，对于艺术家而言，这也是一种需要时间、耐心和技巧的媒介——其要求绝不亚于其他艺术媒介。虽然我可能夸大了它对实践者的掌控力，但我真正想表达的是，编程拥有其富有表现力的一面——它可能会令人沮丧、让人头疼，这是肯定的——但它也能引人入胜并激发灵感。如果我能为你装备一些新的生成式工具和技术，并在这个过程中让你对其创造潜力略感兴奋——这些潜力超越了艺术领域，延伸至设计和\
    \ Web 开发——那么本书就远远完成了它的使命。\n\n### 你需要了解什么\n\n作为读者，在阅读本书之前需要了解些什么？如果你对编程的核心概念，如`变量`、`函数`、`循环`和`条件语句`感到得心应手，那么学习过程无疑会更加轻松。这类概念在不同的编程语言中大同小异，主要区别在于语法，因此即使你之前使用的是\
    \ JavaScript 以外的语言，也完全没问题。\n\n如果你没有任何编程经验，我们将在第 2 章介绍所需的概念，但我必须强调，本书并非一本编程入门书籍。最好将第二章视为一本入门手册，一个让你在其他地方更深入学习的跳板。一门简短的入门课程对你会有很大帮助。我个人推荐出色的[`freeCodeCamp.com`](https://freeCodeCamp.com)，我自己也花了大量时间在这个网站学习。它提供了关于`HTML`、`CSS`和`JavaScript`基础知识的免费交互式教程，以及其他更多内容。\n\
    \n对于来自其他语言（如 Python、PHP 或 C#）的读者，阅读第二章可能仍然有价值，以确保你熟悉`JavaScript`的语法和一些特性。\n\n\
    如果你已经是一名有经验的 Web 开发者，根据你的经验水平，可以跳过（或快速浏览）第 2 章。如果你对我们开篇示例（我们将以此结束第 1 章）中使用的任何技术或语法不熟悉，我鼓励你阅读第二章，那里会对它们进行详细解释。Web\
    \ 开发领域非常广阔，对一位开发者来说驾轻就熟的内容，对另一位开发者来说可能还是前沿技术。\n\n### 你将学到什么\n\n我前面提到过，将为你配备一些新工具和技术。现在让我们来详细说明一下。\n\
    \n#### 工具\n\n在工具方面，我们将使用以下内容：\n\n*   `JavaScript`和`SvJs`库。我稍后会详细说明这一点。\n*   一个代码编辑器。这里我将为你提供两种选择：\n\
    \    *   `Visual Studio Code`（一个优秀的开源代码编辑器）\n    *   `CodePen`（一个流行的在线代码编辑器）\n\
    *   如果你选择使用`Visual Studio Code`（我推荐），我们还将使用`Node.js`和`NPM`来管理依赖项（这是作为开发者应该养成的良好习惯）。\n\
    \n所有代码示例都可从`GitHub`和`CodePen`上获取，所以请随意按照你喜欢的任何方式跟进学习。你当然可以两种方式都采用：在本地使用代码编辑器工作，同时在线查看`CodePen`示例以快速获取灵感。为方便起见，我会将所有`CodePen`示例整理并嵌入到[`davidmatthew.ie/generative-art-javascript-svg`](https://davidmatthew.ie/generative-art-javascript-svg)。\n"
- fmt: '### Techniques


    In terms of the techniques we’ll tackle, by the end of this book, you should have
    a good overview of the following:


    - The main functionality of the `SvJs` library and how it relates to the SVG spec

    - Creating generative art sketches with JavaScript using ES6+ syntax

    - Generating primitive SVG shapes

    - Creating iterative variations of sketches by randomizing parameters

    - Using noise to create organic variance

    - Generating complex SVG paths

    - Making sketches interactive

    - Animating sketches

    - Using SVG filters generatively


    We’ll be covering a lot of ground, so don’t put yourself under pressure to understand
    everything. I must have encountered certain programming concepts umpteen times
    before the proverbial penny finally dropped (JavaScript promises anyone?), and
    whenever understanding did finally dawn, it would usually be because I was experimenting
    with something I *wanted* to build, rather than repeating tutorial steps by rote.
    Tutorials and instructional books certainly have their place (I wouldn’t be writing
    this book otherwise), but it’s important that you take what *you* want from them,
    rather than seeing them as syllabi to be strictly followed.


    A sense of play is important, particularly when it comes to art. And although
    I mentioned tools previously, I would prefer if you viewed this book as more of
    a toybox than a toolbox. When I think of tools, I think of problems that need
    fixing, like the loose hinges on that crooked cabinet you’re going to tighten
    any day now. Tools tend to be more functional than fun, and I’d like you to have
    some fun with this book.


    ## Acknowledgments


    I want to thank first those who should always come first: my incredible wife Sandra,
    my beautiful boy Noah, my constant companion Kow, and my amazing mum, who has
    always believed in me.


    Thank you to my technical reviewer Eoin Ó Conchúir, whose expertise and rigorous
    code checking weeded out many an error and prompted further clarity on points
    I had left overly vague. Your contribution means a better book overall, and any
    remaining errors are mine alone.


    Thank you to my editing team at Apress: James Robinson Prior, Gryffin Winkler,
    and James Markham. In the 15 months since embarking on this project, I’ve moved
    house, changed jobs, and, most life-changing of all, welcomed a newborn into my
    life. Amidst all this change (and sometimes chaos), you’ve remained exceptionally
    understanding, flexible, and enthusiastic.


    In the broader generative art and creative coding community, I’d like to thank
    some notable individuals who have inspired my own work and continue to amaze me
    with their generosity and ingenuity: Pablo Almunia, whose excellent `gySVG` library
    was the inspiration behind `SvJs` and who provided invaluable insights for the
    first chapter; Ahmad Moussa (a.k.a. Gorilla Sun) whose writing keeps so many of
    us artists in the loop; Sara Soueidan, whose pioneering work on SVG filters I
    always find myself returning to; Matt Pearson, one of the first authors to ignite
    in me that generative spark; Keith Peters, for helping me and many other coders
    be less afraid of math; and Dan Shiffman, the genius behind the classic work *The
    Nature of Code*, and whose enthusiasm is so infectious I can’t quite capture it
    in words (go watch his YouTube videos under the moniker The Coding Train to see
    what I mean).


    Finally, thank you to my friends and family for all the support. Daire, for your
    sense of humour (and pretending to NFT anything I post to Instagram); Stephen
    (founder of `letsfundit.ie`, a charity well worth a plug) for the office craic
    and always asking how the book was going. Steven S, for getting me through tough
    times. To my new team at UL, thank you for being so welcoming and all-round amazing.
    And to my siblings Brian, Paul, Claire and Sarah, thanks for promising to read
    this book cover to cover (just joking - but you need to at least read the back!).


    ## About the Author About the Technical Reviewer


    # 1. The Beginner’s Path


    Before journeying along any path, the groundwork needs to be in place. In this
    opening chapter, that’s what we’ll do, lay the groundwork. We’ll introduce SVG,
    explain what makes it a uniquely powerful image format, and show how it can be
    used with JavaScript to create generative art. In the process, we’ll set up our
    tools and a template we can use for subsequent sketches.


    ## Why JavaScript and SvJs?


    Most books about generative art use a Java-based language called Processing, or
    its JavaScript port `p5.js`. Processing was created specifically for artists and
    designers new to coding and has a large and active community. So why doesn’t this
    book use it?


    My first forays into generative art were with Processing, so I certainly acknowledge
    its value. I quickly moved to `p5.js` when the library was first released in 2013,
    which allowed generative sketches to be written directly in JavaScript, the language
    of the Web. But when I wanted to integrate some of my own sketches into real-world
    web development projects, its limitations quickly showed. It’s a *large* library,
    clocking in at close to a megabyte at last check, and while that may not sound
    like much, it’s a lot by web development standards.


    The `p5.js` library is built on top of the HTML Canvas API, which I soon discovered
    is actually quite straightforward to use. Using this API directly, I was able
    to achieve much the same results as with `p5.js`, so that became my go-to. However,
    the output of all my sketches (`p5.js` or Canvas) was still resolution-dependent
    bitmap graphics, devoid of any semantic content. What does that mean, and why
    does it matter (to me at least)? Let me explain.


    ### Introducing Scalable Vector Graphics


    Back in the early days of the Web, when dial-up modems were dominant and connecting
    to the Internet was anything but instant, bandwidth came at a premium. File sizes
    had to be super small if you wanted a page to load in your lifetime, and bitmap
    images, such as JPGs and PNGs, were the main bandwidth bottleneck.


    Bitmap images – also known as raster images – are comprised of large chunks of
    data (or bits), and generally speaking, if you want a larger image, you need more
    bits, which means a bigger file size. SVG, on the other hand, is a vector format,
    which is fundamentally different. SVG can be scaled to any dimension, all without
    a corresponding increase in file size, and it is always dazzlingly sharp and crisp.
    This is possible because it doesn’t bother itself with the bits (i.e., pixels)
    needed to paint the image to the screen, but rather describes the image to be
    rendered at a more abstract, semantic level. And it does this in much the same
    way that HTML describes the structure and content of a web page. As the Mozilla
    Developer Network puts it


    > SVG is, essentially, to graphics what HTML is to text.


    The SVG format was not only a powerful solution to a practical bandwidth problem;
    it was a nonproprietary format officially standardized by the World Wide Web Consortium
    (which is as good as future-proofing gets in the world of web technology). The
    stage was set for its adoption as far back as 1999, but unfortunately browser
    vendors dragged their feet and were extremely slow to introduce support. So for
    the longest time (in Internet terms at least), SVG languished in obscurity. It
    only really got the support it deserved with the decline of Flash (Adobe’s proprietary
    format that required a plug-in to run and was often riddled with security vulnerabilities)
    and the rise of responsive design and retina (or high PPI) screens, where its
    scalability and sharpness really shine.


    These days we can use the format freely without worry, but to use it for the odd
    icon and logo is one thing; to tap its full potential is another.'
  raw: '### Techniques


    In terms of the techniques we’ll tackle, by the end of this book, you should have
    a good overview of the following:


    *   The main functionality of the SvJs library and how it relates to the SVG spec


    *   Creating generative art sketches with JavaScript using ES6+ syntax


    *   Generating primitive SVG shapes


    *   Creating iterative variations of sketches by randomizing parameters


    *   Using noise to create organic variance


    *   Generating complex SVG paths


    *   Making sketches interactive


    *   Animating sketches


    *   Using SVG filters generatively


    We’ll be covering a lot of ground, so don’t put yourself under pressure to understand
    everything. I must have encountered certain programming concepts umpteen times
    before the proverbial penny finally dropped (JavaScript promises anyone?), and
    whenever understanding did finally dawn, it would usually be because I was experimenting
    with something I *wanted* to build, rather than repeating tutorial steps by rote.
    Tutorials and instructional books certainly have their place (I wouldn’t be writing
    this book otherwise), but it’s important that you take what *you* want from them,
    rather than seeing them as syllabi to be strictly followed.


    A sense of play is important, particularly when it comes to art. And although
    I mentioned tools previously, I would prefer if you viewed this book as more of
    a toybox than a toolbox. When I think of tools, I think of problems that need
    fixing, like the loose hinges on that crooked cabinet you’re going to tighten
    any day now. Tools tend to be more functional than fun, and I’d like you to have
    some fun with this book.


    Acknowledgments


    I want to thank first those who should always come first: my incredible wife Sandra,
    my beautiful boy Noah, my constant companion Kow, and my amazing mum, who has
    always believed in me.


    Thank you to my technical reviewer Eoin Ó Conchúir, whose expertise and rigorous
    code checking weeded out many an error and prompted further clarity on points
    I had left overly vague. Your contribution means a better book overall, and any
    remaining errors are mine alone.


    Thank you to my editing team at Apress: James Robinson Prior, Gryffin Winkler,
    and James Markham. In the 15 months since embarking on this project, I’ve moved
    house, changed jobs, and, most life-changing of all, welcomed a newborn into my
    life. Amidst all this change (and sometimes chaos), you’ve remained exceptionally
    understanding, flexible, and enthusiastic.


    In the broader generative art and creative coding community, I’d like to thank
    some notable individuals who have inspired my own work and continue to amaze me
    with their generosity and ingenuity: Pablo Almunia, whose excellent gySVG library
    was the inspiration behind SvJs and who provided invaluable insights for the first
    chapter; Ahmad Moussa (a.k.a. Gorilla Sun) whose writing keeps so many of us artists
    in the loop; Sara Soueidan, whose pioneering work on SVG filters I always find
    myself returning to; Matt Pearson, one of the first authors to ignite in me that
    generative spark; Keith Peters, for helping me and many other coders be less afraid
    of math; and Dan Shiffman, the genius behind the classic work The Nature of Code,
    and whose enthusiasm is so infectious I can’t quite capture it in words (go watch
    his YouTube videos under the moniker The Coding Train to see what I mean).


    Finally, thank you to my friends and family for all the support. Daire, for your
    sense of humour (and pretending to NFT anything I post to Instagram); Stephen
    (founder of letsfundit.ie, a charity well worth a plug) for the office craic and
    always asking how the book was going. Steven S, for getting me through tough times.
    To my new team at UL, thank you for being so welcoming and all-round amazing.
    And to my siblings Brian, Paul, Claire and Sarah, thanks for promising to read
    this book cover to cover (just joking - but you need to at least read the back!).


