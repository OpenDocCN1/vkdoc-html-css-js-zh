    \ 6.28 的一半就是 \U0001D745，即 3.14。\n\n![](img/538894_1_En_7_Fig5_HTML.png)\n\n一幅抽象图呈现出一个方形结构，其中有一个圆形，标有六个弧度。一弧度约等于圆周长上等于半径的长度，数值标有\
    \ 3.14 和 6.28。\n\n**图 7-5** 弧度与 \U0001D745 和圆周的关系\n\n关键点是什么？`Math.PI` 弧度相当于 180°，因此\
    \ `Math.PI * 2` 表示一个完整的圆（360°）。所以在我们的循环中，我们将相对于 `Math.PI * 2` 递增放置圆形的角度。为了确保圆形在圆周上均匀分布，我们将\
    \ `Math.PI * 2` 除以 `numCircles`，每次循环运行时，将其乘以迭代器，从而移动到下一个“切片”。\n\n在循环内，定义好圆形元素后，添加以下代码：\n\
    \n```\n// 计算当前角度。\nlet angle = Math.PI * 2 / numCircles * i;\n```\n\n### 正弦与余弦\n\
    \n一旦有了角度，就需要获取对应的正弦和余弦值，你可以将它们视为 x 和 y 坐标。这里我们不深入细节；只需说明，`Math.sin()` 和 `Math.cos()`\
    \ 方法能完美配合，产生圆周运动。\n\n```\n// 获取角度的正弦和余弦值。\nlet sin = Math.sin(angle);\nlet cos\
    \ = Math.cos(angle);\n```\n\n值得注意的是，这些方法本身就非常有用，尤其适用于运动，因为它们能产生平滑、振荡的值。然而，在当前场景中，我们将仅限使用这些值来定位圆形，而不是让它们动起来。为了定位，我们需要将正弦和余弦值映射到更可用的范围，因为默认情况下它们返回\
    \ -1 到 1 之间的值。\n\n我们将相对于 `viewBox` 的中心（即 x 轴和 y 轴均为 500）来定位圆形，并将其重新映射到 700 的范围内。这样得到\
    \ 150 和 850，即中心两侧各 -350 和 +350。\n\n```\n// 将正弦和余弦映射到所需范围。\nlet cx = Gen.map(sin,\
    \ -1, 1, 200, 800, false);\nlet cy = Gen.map(cos, -1, 1, 200, 800, false);\n```\n\
    \n### 让圆形动起来\n\n现在我们可以尝试一个基础动画。先从简单的开始，让圆形从中心向外移动到我们刚才定义的 `cx` 和 `cy` 坐标。\n\n\
    ```\n// 从 (500, 500) 移动到 (cx, cy)。\ncircle.animate({\n  cx: [500, cx, 500],\n\
    \  cy: [500, cy, 500],\n}, {\n  duration: 10000,\n  iterations: Infinity,\n  easing:\
    \ ['ease-in-out']\n});\n```\n\n这能让圆形动起来，但这个序列并不特别有趣。让我们增加更多变化：设置初始和目标半径，利用迭代器值让每个圆形的半径都不同，同时让整个动画旋转起来。在结束循环之前，根据圆形的数量递增\
    \ `hue` 值，以获得漂亮的色彩分布。\n\n```\n// 设置初始和目标半径。\nlet r1 = baseRadius * 2 + (i * 10);\n\
    let r2 = baseRadius / (i + 10);\n// 从 (500, 500) 移动到 (cx, cy)，缩小半径，旋转。\ncircle.animate({\n\
    \  cx: [500, cx, 500],\n  cy: [500, cy, 500],\n  r: [r1, r2, r1],\n  transform:\
    \ ['rotate(0deg)', 'rotate(360deg)']\n}, {\n  duration: 10000,\n  iterations:\
    \ Infinity,\n  easing: ['ease-in-out']\n});\n// 递增色相值。\nhue = (hue % 360) + (180\
    \ / numCircles);\n```\n好了……这样就大大逼近了我们想要实现的催眠吸引力。请参见图 7-6，这是动画进行到约 15% 时的快照。\n\n\
    ![](img/538894_1_En_7_Fig6_HTML.png)\n\n一幅抽象图呈现出一个方形结构，其中有一团圆形呈旋转模式，背景为深色。\n\n\
    **图 7-6** 使用 Web Animations API 实现圆形循环\n\n## 总结\n\n就概念和内容而言，这或许是迄今为止最密集的一章，但我希望你在跟随学习的过程中也获得了一些乐趣。快速回顾一下，我们涵盖了以下内容：\n\
    \n* 事件监听器、事件类型和事件参数\n* 如何保存我们的 SVG 标记\n"
- fmt: "# 如何使用光标追踪制作交互式草图\n\n*   如何使用光标追踪制作交互式草图\n*   使用 CSS 关键帧进行动画\n*   使用 SMIL\
    \ 进行动画\n*    Web 动画 API\n*   使用 `requestAnimationFrame()` 方法进行动画\n*   基本碰撞检测\n\
    *   非常基础的三角学\n\n在下一章也是最后一章中，我们将重点介绍 SVG 滤镜。\n\n## 8. 滤镜效果\n\n除了 SVG 提供的所有矢量功能（正如你从名为“可缩放矢量图形”的格式中所期望的那样），SVG\
    \ 还以 `<filter>` 元素的形式提供了一些非常强大的基于像素的效果。在 GIMP 或 Photoshop 等编辑器中常见的许多图像处理操作，例如模糊、投影和扭曲，实际上也可以在\
    \ SVG 中实现。在本章中，我们将学习如何实现这些效果。\n\n我们不会以任何全面的方式涵盖 SVG 滤镜的功能；那至少需要一本专门的书籍。这是一个庞大的主题，其创作潜力——至少在美学上——常常被忽视。制作出外观糟糕的\
    \ SVG 滤镜非常容易。我将努力避免这个陷阱，并更多地是从生成艺术家的角度，而不是图像编辑器的角度，来呈现一部分滤镜。\n\n### 滤镜基础\n\n在我们深入探讨具体的滤镜效果之前，我们需要了解它们的结构。一个滤镜由一个\
    \ `<filter>` 元素和一个或多个滤镜图元组成。这些图元本身也是元素，它们嵌套在主滤镜元素内部，并且都以字母 `fe`（代表滤镜效果）开头，后跟一个描述性名称。每个图元执行其自身的操作，并且可以通过一系列输入和输出以节点方式连接到其他图元。\n\
    \n让我们看一个仅使用单个图元的原始标记形式的基本示例。\n\n正如你所见，`<filter>` 元素必须嵌套在 `<defs>` 元素内部；与渐变和图案一样，它只有在通过\
    \ `url` 链接到其 `id` 时才会被渲染。在前面的例子中，一个黄色圆圈通过其自身的 `filter` 属性调用滤镜，结果（如图 [8-1](#538894_1_En_8_Chapter.xhtml#Fig1)\
    \ 所示）是一个柔和的模糊效果，由一个名为 `feGaussianBlur` 的图元控制。\n\n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig1_HTML.png)\n\
    \n一幅抽象画，呈现一个明亮的圆形，背景为深色。\n\n**图 8-1**\n一个模糊的圆形\n\n### 输入与输出\n\n让我们检查一个稍微复杂一些的例子，这次说明滤镜图元如何连接在一起。结果将是一个应用到圆形描边的投影，如图\
    \ [8-2](#538894_1_En_8_Chapter.xhtml#Fig2) 所示。\n\n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig2_HTML.png)\n\
    \n一幅抽象画，呈现一个带有渐隐外层的圆形，背景为深色。\n\n**图 8-2**\n一个投影滤镜效果\n\n与之前的例子一样，我们从一个 `feGaussianBlur`\
    \ 图元开始，但你会注意到添加了几个属性：`in` 和 `result`。这些属性也出现在它后面的图元 `feOffset` 中。在最后一个滤镜图元 `feComposite`\
    \ 中，`in` 也存在，还有 `in2`。这些意味着什么？\n\n*   `in` 指的是滤镜图元的输入源。\n*   `in2` 指的是第二个输入源（如果滤镜图元支持此功能）。\n\
    *   `result` 是我们用来标记滤镜图元输出的内容，然后可以将其用作另一个图元的输入。\n\n如果一个滤镜图元是其链中的第一个（如上面的 `feGaussianBlur`），`in`\
    \ 将默认为 `SourceGraphic`；否则，它将默认为前一个图元的 `result`。`SourceGraphic` 仅指应用滤镜的图形元素。`SourceAlpha`\
    \ 也指同一个图形元素，但仅限于其 Alpha 通道（即其不透明度值）。\n\n所以这是第二个例子中发生的事情：\n\n1.  `feGaussianBlur`\
    \ 图元将圆形的 `SourceAlpha` 作为其输入，并对其应用高斯模糊效果。结果（或输出）被命名为 `blur`。\n2.  `feOffset` 图元将\
    \ `blur` 结果作为其输入，并沿着 Y 轴对其进行偏移，此结果被标记为 `offset`。\n3.  `feComposite` 图元将我们原始的 `SourceGraphic`\
    \ 作为第一个输入 `in`，并将 `offset` 的结果作为其第二个输入 `in2`，将它们重新组合在一起。\n\n我们稍后将更详细地讨论其中一些图元，但接下来我们将看看如何从标记转移到使用\
    \ `SvJs` 编写滤镜脚本。\n\n### SvJs 的 createFilter() 方法\n\n也许并不奇怪，`SvJs` 有自己的 `createFilter()`\
    \ 方法来加速滤镜创建过程。它只需要一个参数：一个 `id`，这个 `id` 在将滤镜应用于目标元素时使用。与 `createGradient()` 和 `createPattern()`\
    \ 方法一样，合理的默认值会被初始化，并且检查 `defs` 元素是否已存在的工作会在后台处理。\n\n以下是我们之前第一个例子的 `SvJs` 等效代码，将一个柔和的模糊应用于一个黄色圆形（图\
    \ [8-1](#538894_1_En_8_Chapter.xhtml#Fig1)）。\n\n```javascript\n// 初始化滤镜。\nlet\
    \ filter = svg.createFilter('blur');\n// 创建模糊效果。\nfilter.create('feGaussianBlur').set({\
    \ stdDeviation: 10 });\n// 应用滤镜。\nsvg.create('circle').set({\n    r: 350, cx:\
    \ 500, cy: 500, fill: 'yellow', filter: 'url(#blur)'\n});\n```\n\n### 滤镜区域\n\n\
    当一个滤镜被应用于一个元素时，其活动区域会超出该元素的范围。这允许效果有一定的空间“渗出”（借用印刷术语）。这个空间被称为滤镜区域，一旦滤镜效果超出此区域，就会发生裁剪（见图\
    \ [8-3](#538894_1_En_8_Chapter.xhtml#Fig3)）。\n\n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig3_HTML.png)\n\
    \n一幅抽象画，呈现一个模糊的明亮圆形，背景为深色。\n\n**图 8-3**\n一个被裁剪的滤镜区域\n\n在生成艺术中，我们有时会超出滤镜效果参数预期的值范围，因此如果你的滤镜效果意外被裁剪，了解这个区域很重要。滤镜区域的定义方式与\
    \ `rect` 元素相同：通过 `x`、`y`、`width` 和 `height` 属性。默认情况下，这些值如下：\n\n```\nx: '-10%'\n\
    y: '-10%'\nwidth: '120%'\nheight: '120%'\n```\n\n百分比值是相对于应用滤镜的形状而言的，所以在上述情况下，这相当于在滤镜元素周围有\
    \ `10%` 的内边距。`SvJs` 将此滤镜区域扩大到 `25%`，留出更多尝试空间。如果你需要进一步调整，可以轻松地使用 `set()` 方法进行：\n\
    \n```javascript\nfilter.set({ x: '-15%', y: '-15%', width: '130%', height: '130%'\
    \ });\n```\n\n## 滤镜效果 101\n\n让我们继续看一些简单的自定义滤镜效果。我们已经看到 `feGaussianBlur` 图元在运行，所以我不会在这里单独为它设立一个小节，但值得在继续之前提一下，它的主要属性\
    \ `stdDeviation` 实际上也可以接受两个值，而不仅仅是一个。如果你提供两个值，第一个数字将控制 X 轴上的模糊，第二个数字控制 Y 轴上的模糊。\n\
    \n```javascript\n// 创建一个“运动”模糊效果。\nfilter.create('feGaussianBlur').set({ stdDeviation:\
    \ '20 0' });\n```\n\n### 阴影\n\n我们之前使用三个连接的滤镜图元实现了一个投影，但实际上有一个更简单的方法。在 SVG 规范较新的修订版中，引入了\
    \ `feDropShadow` 图元，它可以接受最多五个属性：`dx`，定义阴影在 X 轴上的偏移；`dy`，对 Y 轴进行同样的操作；`stdDeviation`，控制阴影的模糊程度；以及另外两个可选属性\
    \ `flood-colour` 和 `flood-opacity`，可以修改阴影的颜色和透明度。"
  raw: "*   How to use cursor tracking to make a sketch interactive\n\n*   Animating\
    \ with CSS keyframes\n\n*   Animating with SMIL\n\n*   The Web Animations API\n\
    \n*   Animating with the requestAnimationFrame() method\n\n*   Basic collision\
    \ detection\n\n*   Very basic trigonometry\n\nIn the next and final full chapter,\
    \ we’ll focus on SVG filters.\n\n8. Filter Effects\n\nIn addition to all the vector\
    \ functionality offered by SVG (as you’d\nexpect from a format called Scalable\
    \ Vector Graphics), SVG also provides\nsome very powerful pixel-based effects\
    \ in the form of the `<filter>`\nelement. Many of the kinds of image-manipulation\
    \ operations routinely\nfound in editors like GIMP or Photoshop, such as blurs,\
    \ drop shadows,\nand distortions, can actually be carried out in SVG too. In this\n\
    chapter, we’ll learn how this is done.\nWe won’t be covering the capabilities\
    \ of SVG filters in any kind of\ncomprehensive way; that would require at least\
    \ its own book. It is a\nvast subject and one whose creative potential `–` at\
    \ least\naesthetically `–`\nis often neglected. It’s very easy to make awful-looking\
    \ SVG filters.\nI’ll aim to avoid this pitfall and will be presenting a subset\
    \ of\nfilters more from the perspective of the generative artist than the\nimage\
    \ editor.\n\nFilter Fundamentals\nBefore we explore specific filter effects in\
    \ any depth, we need to\nknow how they’re structured. A filter consists of a single\
    \ `<filter>`\nelement and one or more filter primitives. These primitives, which\
    \ are\nalso elements, are nested within the main filter element, and they all\n\
    begin with the letters `fe` (for filter\neffect) followed by a descriptive name.\
    \ Each performs its own\noperation(s) and can be connected to other primitives\
    \ in a node-like\nmanner using a series of inputs and outputs.\n\nLet’s look at\
    \ a basic example in raw markup form, using just a single\nprimitive.\n\nAs you\
    \ can see, the `<filter>` element must be nested\ninside a `<defs>` element;\n\
    in common with gradients and patterns, it only gets rendered when\nreferenced\
    \ via a `url` link to its `id`. In the preceding\ncase, a yellow circle calls\
    \ the filter via its own `filter` attribute, and\nthe result (shown in Figure\
    \ [8-1](#538894_1_En_8_Chapter.xhtml#Fig1)) is a soft blur,\ncontrolled by a primitive\
    \ named `feGaussianBlur`.\n\n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig1_HTML.png)\n\
    \nAn abstract presents a bright circle, against a dark background.\n\nFigure 8-1\n\
    A blurred circle\n\nThe Ins and Outs\n\nLet’s inspect a slightly more involved\
    \ example, this time illustrating\nhow filter primitives can be connected together.\
    \ The result will\nbe a drop shadow applied to a circle’s stroke, as shown in\
    \ Figure [8-2](#538894_1_En_8_Chapter.xhtml#Fig2).\n\n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig2_HTML.png)\n\
    \nAn abstract presents a circle with a faded outer layer, against a\ndark background.\n\
    \nFigure 8-2\nA drop-shadow filter effect\n\nAs with the previous example, we’re\
    \ starting off with an `feGaussianBlur`\nprimitive, but you’ll notice there’s\
    \ a couple of more attributes added:\n`in` and `result`. These\nattributes are\
    \ also present in the primitive following it, `feOffset`. In the\nfinal filter\
    \ primitive, `feComposite`, `in` is also present,\nalong with `in2`.\nWhat do\
    \ these mean?\n\n*   `in`\n    refers to a filter primitive’s input source.\n\n\
    *   `in2`\n    refers to a second input source, if the filter primitive supports\n\
    \    this.\n\n*   `result`\n    is what we use to label a filter primitive’s output,\
    \ which can then be\n    used as the input for another primitive.\n\nIf a filter\
    \ primitive is the first in its chain (as `feGaussianBlur` is\nabove), `in` will\n\
    default to `SourceGraphic`;\notherwise, it will default to the `result` of the\n\
    preceding primitive. `SourceGraphic` just\nmeans the graphics element to which\
    \ a filter is applied. `SourceAlpha` also\nrefers to this same graphics element\
    \ but is restricted to its alpha\nchannel (i.e., its opacity value).\n\nSo here’s\
    \ what’s happening in this second example:\n\n1.  The `feGaussianBlur`\n    primitive\
    \ takes the `SourceAlpha` of the\n    circle as its input and applies a Gaussian\
    \ blur effect to it. The result\n    (or output) is then named `blur`.\n\n2. \
    \ The `feOffset`\n    primitive takes the `blur` result as its\n    input and\
    \ offsets it along the y axis, and the result of this is\n    labelled `offset`.\n\
    \n3.  The `feComposite` primitive\n    takes our original `SourceGraphic` as the\n\
    \    first input `in`\n    and the result of `offset` as its second\n    input\
    \ `in2`,\n    recombining them.\n\nWe’ll go into some of these primitives in more\
    \ detail\nlater, but next we’ll look at how to move from markup to scripting\n\
    filters with SvJs.\n\nThe SvJs createFilter( ) Method\nPerhaps unsurprisingly,\
    \ SvJs has its own `createFilter()` method\nto speed up the filter creation process.\
    \ It requires just one argument:\nan `id`, and this\n`id` is used when\napplying\
    \ the filter to the target element. As with the `createGradient()` and\n`createPattern()`\n\
    methods, sensible defaults are\ninitialized, and the checking of whether a `defs`\
    \ element already\nexists is taken care of under the hood.\n\nThe following is\
    \ the SvJs equivalent of our first example shown\npreviously, applying a soft\
    \ blur to a yellow circle (Figure [8-1](#538894_1_En_8_Chapter.xhtml#Fig1)).\n\
    \n```\n// Initialise the filter.\nlet filter = svg.createFilter('blur');\n// Create\
    \ the blur effect.\nfilter.create('feGaussianBlur').set({ stdDeviation: 10 });\n\
    // Apply the filter.\nsvg.create('circle').set({\nr: 350, cx: 500, cy: 500, fill:\
    \ 'yellow', filter: 'url(#blur)'\n});\n```\n\nThe Filter Region\n\nWhen a filter\
    \ is applied to an element, its active\nregion extends beyond that element. This\
    \ allows a certain amount of\nspace into which the effect can “bleed,” to use\
    \ a print analogy. This\nspace is known as the filter region, and once a filter’s\
    \ effect extends\nbeyond this region, clipping occurs (see Figure [8-3](#538894_1_En_8_Chapter.xhtml#Fig3)).\n\
    \n![](images/538894_1_En_8_Chapter/538894_1_En_8_Fig3_HTML.png)\n\nAn abstract\
    \ presents a blurred bright circle, against a dark\nbackground.\n\nFigure 8-3\n\
    A clipped filter region\n\nIn generative art, we’ll sometimes stray outside the\
    \ range of values a\nfilter effect parameter might anticipate, so it’s important\
    \ to know\nabout this region if your filter effects are unexpectedly clipped.\
    \ A\nfilter region is defined just as a `rect` element is: by\n`x`, `y`, `width`,\
    \ and `height` attributes. By\ndefault, these values are as follows:\n\n```\n\n\
    The percentage values are relative to the shape to which the filter is\napplied,\
    \ so in the aforementioned, this translates to a `10%` padding\nsurrounding the\
    \ filtered element. SvJs enlarges this filter region to\n`25%`, allowing\nsome\
    \ more room to experiment. If you need to adjust it further, you can\neasily do\
    \ so with the `set()` method:\n\n```\nfilter.set({ x: '-15%', y: '-15%', width:\
    \ '130%', height: '130%' });\n```\n\nFilter Effects 101\n\nLet’s move on to some\
    \ simple custom filter effects. We’ve already seen\nthe `feGaussianBlur`\nprimitive\
    \ in action so I won’t give it its own section here, but it’s\nworth mentioning\
    \ before I move on that its main attribute `stdDeviation` can\nactually accept\
