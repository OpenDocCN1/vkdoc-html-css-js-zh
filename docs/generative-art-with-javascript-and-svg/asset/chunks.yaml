    \ function expressions we’ve just covered. Let’s rewrite the `sum()` function\
    \ as an example.\n\n```javascript\nconst sum = (a, b) => {\n  return a + b;\n\
    }\n```\n\nA little shorter, as you can see. But it can get even more concise than\
    \ this if our function only consists of a single statement that returns a value\
    \ (which exactly describes our `sum()` function). In such a case, we don’t need\
    \ the curly braces or even the `return` statement itself.\n\n```javascript\nconst\
    \ sum = (a, b) => a + b;\n```\n\nBecause the arrow function body consists of just\
    \ a single statement (`a + b`), it is assumed we want the value of this statement\
    \ returned. This is what’s called an implicit return.\n\nNow, not all arrow functions\
    \ can be so neatly condensed, just those that have a single return statement.\
    \ But such one-liners are liberally used throughout most modern JavaScript code\
    \ bases, particularly those that use declarative front-end frameworks like React,\
    \ so it’s worth familiarizing yourself with them.\n\nThere is another reason to\
    \ use arrow functions that stretches a little beyond the scope of this chapter,\
    \ and it’s `this`. What I mean is the `this` keyword, which is a complicated topic\
    \ in JavaScript (and complicated to explain without getting tangled in reflexive\
    \ language). Suffice to say, the value of `this` is more predictable and less\
    \ prone to bugs when used in arrow functions. But don’t worry about `this` for\
    \ now.\n\nInstead, let’s concern ourselves with some data structures that will\
