    \ 也指同一个图形元素，但仅限于其 Alpha 通道（即其不透明度值）。\n\n所以这是第二个例子中发生的事情：\n\n1.  `feGaussianBlur`\
    \ 图元将圆形的 `SourceAlpha` 作为其输入，并对其应用高斯模糊效果。结果（或输出）被命名为 `blur`。\n2.  `feOffset` 图元将\
    \ `blur` 结果作为其输入，并沿着 Y 轴对其进行偏移，此结果被标记为 `offset`。\n3.  `feComposite` 图元将我们原始的 `SourceGraphic`\
    \ 作为第一个输入 `in`，并将 `offset` 的结果作为其第二个输入 `in2`，将它们重新组合在一起。\n\n我们稍后将更详细地讨论其中一些图元，但接下来我们将看看如何从标记转移到使用\
    \ `SvJs` 编写滤镜脚本。\n\n### SvJs 的 createFilter() 方法\n\n也许并不奇怪，`SvJs` 有自己的 `createFilter()`\
    \ 方法来加速滤镜创建过程。它只需要一个参数：一个 `id`，这个 `id` 在将滤镜应用于目标元素时使用。与 `createGradient()` 和 `createPattern()`\
    \ 方法一样，合理的默认值会被初始化，并且检查 `defs` 元素是否已存在的工作会在后台处理。\n\n以下是我们之前第一个例子的 `SvJs` 等效代码，将一个柔和的模糊应用于一个黄色圆形（图\
    \ 8-1）。\n\n```javascript\n// 初始化滤镜。\nlet filter = svg.createFilter('blur');\n\
