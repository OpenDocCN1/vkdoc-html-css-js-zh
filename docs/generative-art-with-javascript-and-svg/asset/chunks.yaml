    view).\nCSS keyframes are more suited to shorter sequences, such as animated\n\
    loading indicators (an art in themselves), UX enhancements, and\nanimations where\
    \ accessibility or browser compatibility is a concern.\nFor more elaborate sequences,\
    \ they can quickly get convoluted and\nawkward to edit. For animating SVG specifically,\
    \ there are many\nattributes that are inaccessible when using CSS, such as masks,\
    \ clip\npaths, and gradients.\nWith SMIL, you’ve got a well-thought-out animation\
    \ format native to\nSVG and one that can access all animation-capable attributes.\
    \ Unlike the\nother methods, it can also retain its animations when the SVG is\n\
    embedded as an image (much like a gif). The negatives? It can become\nquite verbose,\
    \ and its future is rather unclear (back in 2015, support\nfor SMIL was dropped\
    \ from Chrome, but this decision was quickly\nreversed).\nThe Web Animations API,\
    \ or WAAPI, is the most modern animation\nmethod, has more advanced capabilities\
    \ than CSS or SMIL, and in general\nis more flexible and concise. I would recommend\
    \ it over CSS or SMIL for\ngenerative art, but it does have its limitations. It’s\
    \ not suitable for\nopen-ended, exploratory animations, where we’re unsure of\
    \ the end\nresult. Like CSS and SMIL, everything needs to be tightly orchestrated\n\
    and intentional. To go “full generative,” we need something more low\nlevel like\
    \ `requestAnimationFrame()`.\nYes, `requestAnimationFrame()`\ncan make us trudge\
    \ a rather punishing path to achieve relatively meager\nresults, but\nconversely,\
    \ more complicated results can in many cases be achieved in a\nfar more simple\
    \ and elegant manner than they can using other methods\n(I’ll demonstrate this\
    \ in our next example on collision detection). We\njust need to persevere beyond\
    \ the initial pain barrier.\nIt’s also worth noting that there are many solid\
    \ third-party\nlibraries out there to help you animate with SVG; of particular\
    \ note is\nthe GreenSock Animation\nPlatform (GSAP), which is very feature rich\
    \ and offers robust\nperformance and impressive backward compatibility. It’s not\
    \ open source\nhowever, and some of its plug-ins are for paid subscribers only.\n\
    Anime.js is a nice open source alternative."
  trans: '

    ```javascript

    // Define the function.

    function customFunction() {

    // do stuff here...

    // Make the recursive call to requestAnimationFrame().

    requestAnimationFrame(customFunction);

    }

    // Call the function.

    customFunction();

    ```


    此外，`requestAnimationFrame()` 可以向我们的自定义函数传递一个时间戳，这样我们就能根据实时值来同步动画，而不是依赖可能因设备而异的屏幕刷新率。该时间戳包含自动画开始以来经过的毫秒数。现在，让我们继续处理草图，设置一个
    `animate()` 函数，并将时间戳传递给它，以便用它来增加旋转角度。之所以可行，是因为旋转值可以无限递增超过 360° 而仍然保持有效。


    ```javascript

    // Animate the last shape using requestAnimationFrame.

    function animate(time) {

    // Rotate the angle.

    let angle = time;

    // Apply the rotation.

    shapes[3].set({ transform: `rotate(${angle})` });

    // The recursive bit.

    requestAnimationFrame(animate);

    }

    animate();

    ```


    好了，这段代码让我们的最后一个形状动了起来，但我们遇到了几个问题。第一，我们的形状旋转速度快得惊人，与其他形状完全不同步。第二，如果你检查控制台，会看到一个错误，大意是我们在旋转变换中提供了一个`undefined`变量。这个错误只出现一次，这说明当我们的函数首次运行时，`angle`（以及`time`）是`undefined`。这很容易修正；我们只需在`time`为`undefined`时将其重新赋值为`0`即可。在声明`angle`之前添加以下代码，应该能让控制台安静下来：


    ```javascript

    // Prevent errors when the time is undefined on first frame.

    if (time === undefined) time = 0;

    ```


    现在来解决旋转速度问题。我们可以尝试用任意数值除以`time`，直到它减速到与其它形状同步（或接近同步），但这并不令人满意。相反，让我们用已知的信息来推算：


    -   我们的形状应旋转 360°。

    -   这次旋转应耗时五秒（即五千毫秒）。

    -   `time` 以毫秒为单位提供。


    基于上述信息，我们可以推导出一个计算式，得出旋转形状的精确速度：每秒 0.072°（360° 除以 5,000 毫秒）。用以下代码更新之前`angle`直接等于`time`的语句：


    ```javascript

    // Rotate 360° in 5000ms: 360/5000 = 0.072.

    let angle = time * 0.072;

    ```


    这应该能让我们的形状与其他形状同步旋转。然而，让它同步缩放则更具挑战性。为此，我们首先需要在动画循环之外初始化一些变量，这些变量可以帮助我们跟踪某些状态。为什么？因为如果我们试图在循环内部创建这些状态，它们会在每次迭代时被覆盖。缩放增量值需要在上下限之间来回摆动，实现这一目标最直接的方法是跟踪当前缩放值及其极性（即它是向一个方向摆动还是向另一个方向摆动）。为此，我们需要一个布尔值，可以像开关一样来回切换。我们还需要一种方法，使缩放值随时间同步递增，但不直接使用时间戳值，因为那样只会让它无限递增。


    考虑到以上几点，让我们在`animate()`函数之前初始化以下变量：


    ```javascript

    let isPositive = true;

    let scale = 0, tick = 0, prevTime = 0;

    ```


    按如下方式更新动画循环。注释承担了主要的解释工作，因此为了更好地理解每一步，请务必仔细阅读注释。这里的主要收获是，与其他方法相比，使用`requestAnimationFrame()`需要我们做更多的工作。


    ```javascript

    // Animate the final shape using requestAnimationFrame.

    function animate(time) {

    // Prevent errors when the time is undefined on first frame.

    if (time === undefined) time = 0;

    // Rotate 360° in 5000ms: 360/5000 = 0.072.

    let angle = time * 0.072;

    // We need a constant tick value that doesn''t increment indefinitely.

    tick = time - prevTime;

    // Scale by 0.5 in 2500ms: 0.5/2500 = 0.0002.

    scale = isPositive ? scale + (tick * 0.0002) : scale - (tick * 0.0002);

    // Apply the rotation and scale values.

    shapes[3].set({

    transform: `rotate(${angle}) scale(${1 - scale}, ${1 + scale})`

    });

    // Flip the polarity if the scale value falls outside these bounds.

    if (scale < 0) isPositive = !isPositive;

    if (scale > 0.5) isPositive = !isPositive;

    // Capture the time before it increments.

    prevTime = time;

    // The recursive bit.

    requestAnimationFrame(animate);

    }

    animate();

    ```


    现在我们应该能让最后一个形状与其他形状同步旋转和缩放了（或多或少有些偏差）。在某些情况下，你可能会注意到旋转有轻微偏移，或者缩放速度比预期的稍快一些。像这样的差异，更多是与浏览器自动调度和处理其他动画方法的优化有关，而不是`requestAnimationFrame()`本身的性能问题。这些动画方法本意并非像我们在本练习中那样组合使用；通常你会根据要实现的目标，选择一种方法并坚持使用。


    ## 方法总结


    那么，对于生成艺术来说，应该选择哪种方法呢？这个问题没有确定的答案，但以下是我的建议（需要说明的是，这并不是对每种方法优缺点的全面分析，而是从我不可避免的带有偏见的视角进行的大致比较）。CSS
    关键帧更适用于较短的序列，例如动画加载指示器（本身就是一门艺术）、用户体验增强，以及可访问性或浏览器兼容性重要的动画。对于更复杂的序列，它们会很快变得复杂且难以编辑。特别是对于
    SVG 动画，使用 CSS 时许多属性是无法访问的，例如蒙版、裁剪路径和渐变。


    使用 SMIL，你拥有一个原生支持 SVG、设计精良的动画格式，并且可以访问所有支持动画的属性。与其他方法不同，当 SVG 作为图片嵌入时（类似于 gif），它还能保留动画。缺点呢？它可能会变得相当冗长，而且未来前景相当不明朗（早在
    2015 年，Chrome 就停止了对 SMIL 的支持，但这一决定很快被撤销了）。


    Web Animations API（WAAPI）是最现代的动画方法，比 CSS 或 SMIL 拥有更高级的能力，通常也更灵活、更简洁。对于生成艺术，我会推荐它胜过
    CSS 或 SMIL，但它确实有其局限性。它不适用于开放式、探索性的动画（即我们对最终结果不确定的情况）。与 CSS 和 SMIL 一样，所有内容都需要精心编排且有明确意图。要走向“完全生成式”，我们需要像`requestAnimationFrame()`这样更底层的工具。


    是的，`requestAnimationFrame()`可能会让我们在一条相当艰难的道路上跋涉，以取得相对微薄的成果，但反过来，更复杂的结果在很多情况下可以通过比其他方法更简单、更优雅的方式实现（我将在下一个关于碰撞检测的例子中演示这一点）。我们只需要在最初克服困难后坚持下去。


    另外值得注意的是，市面上有许多可靠的第三方库可以帮助您使用 SVG 制作动画；特别值得一提的是 GreenSock 动画平台 (GSAP)，它功能非常丰富，并提供强大的性能和令人印象深刻的向后兼容性。不过它并非开源，并且其部分插件仅对付费订阅者开放。`Anime.js`
    是一个不错的开源替代品。

