- "# TypeScript 中的面向对象\n\nTypeScript 提供了在程序中使用面向对象所需的所有关键工具。\n\n-   类\n-   类的实例\n\
  -   方法\n-   继承\n-   开放递归\n-   封装\n-   委托\n-   多态\n\n类、类的实例、方法和继承已在第 1 章详细讨论过。它们是面向对象程序的构建块，而语言本身以简单的方式使这些成为可能。对于这些概念中的每一个，你只需要一两个语言关键字。\n\
  \n列表中的其他术语值得进一步解释，特别是关于它们如何在 TypeScript 类型系统中工作。以下各节将结合演示每个概念的代码示例，对开放递归、封装、委托和多态的概念进行扩展说明。\n\
  \n> **注意**\n> 尽管本章详细讨论了面向对象，但请勿忘记 JavaScript（以及 TypeScript）是一种多范式语言。特别是，其中有一些优秀的函数式编程特性，即使你在编写面向对象代码时，也不应忽视它们。\n\
  \n## 开放递归\n\n开放递归是递归和后期绑定的组合。当一个类中的方法调用自身时，该调用可以被转发到子类中定义的替代方法。清单 4-1 是一个读取目录内容的类的示例。`FileReader`\
  \ 类根据提供的路径读取内容。任何文件都会被添加到文件树中，但当找到目录时，会递归调用 `this.getFiles`。这些调用将持续到整个路径（包括所有子文件夹）都被添加到文件树中。`fs.readdirSync`\
  \ 和 `fs.statSync` 方法属于 NodeJS，在第 7 章中有更详细的介绍。\n\n> **注意**\n> 我使用了 NodeJS 文件系统调用的同步版本\
  \ `readdirSync` 和 `statSync`，因为它们使示例更简单。在实际程序中，你应该考虑使用标准等效方法 `readdir` 和 `stat`，它们是异步的并接受回调函数。\n\
  \n`LimitedFileReader` 是 `FileReader` 类的子类。当你创建 `LimitedFileReader` 类的实例时，必须指定一个数字来限制该类所表示的文件树的深度。此示例展示了\
  \ `this.getFiles` 的调用如何使用开放递归。如果你创建了一个 `FileReader` 实例，对 `this.getFiles` 的调用是一个简单的递归调用。如果你创建了一个\
  \ `LimitedFileReader` 实例，那么在 `FileReader.getFiles` 方法内对 `this.getFiles` 的相同调用实际上会被分派到\
  \ `LimitedFileReader.getFiles` 方法。\n\n```typescript\nimport * as fs from 'fs';\n\
  interface FileItem {\npath: string;\ncontents: string[];\n}\nclass SyncFileReader\
  \ {\ngetFiles(path: string, depth: number = 0) {\nconst fileTree = [];\nconst files\
  \ = fs.readdirSync(path);\nfor (let file of files) {\nconst stats = fs.statSync(file);\n\
  let fileItem: FileItem;\nif (stats.isDirectory()) {\n// 添加目录及其内容\nfileItem = {\n\
  path: file,\ncontents: this.getFiles(file, (depth + 1))\n};\n} else {\n// 添加文件\n\
  fileItem = {\npath: file,\ncontents: []\n};\n}\nfileTree.push(fileItem);\n}\nreturn\
  \ fileTree;\n}\n}\nclass LimitedFileReader extends SyncFileReader {\nconstructor(public\
  \ maxDepth: number) {\nsuper();\n}\ngetFiles(path: string, depth = 0) {\nif (depth\
  \ > this.maxDepth) {\nreturn [];\n}\nreturn super.getFiles(path, depth);\n}\n}\n\
  // 实例化 LimitedFileReader 的一个实例\nconst fileReader = new LimitedFileReader(1);\n//\
  \ 结果只读取了顶层和一个额外层级\nconst files = fileReader.getFiles('path');\n```\n*清单 4-1. 开放递归*\n\
  \n这个开放递归的例子可以总结如下：\n\n-   当你创建一个新的 `SyncFileReader` 时：\n    -   `fileReader.getFiles`\
  \ 是对 `SyncFileReader.getFiles` 的调用\n    -   `SyncFileReader` 内部的 `this.getFiles`\
  \ 是对 `SyncFileReader.getFiles` 的调用\n-   当你创建一个新的 `LimitedFileReader` 时：\n    - \
  \  `fileReader.getFiles` 是对 `LimitedFileReader.getFiles` 的调用\n    -   `super.getFiles`\
  \ 是对 `SyncFileReader.getFiles` 的调用\n    -   `SyncFileReader` 内部的 `this.getFiles`\
  \ 是对 `LimitedFileReader.getFiles` 的调用\n\n开放递归的妙处在于原始类保持不变，并且无需了解子类提供的特化功能。子类可以重用超类中的代码，从而避免了重复。\n\
  \n## 封装\n\nTypeScript 完全支持封装。类实例可以包含属性以及对这些属性进行操作的方法；这就是数据和行为的封装。属性也可以使用 `private`\
  \ 访问修饰符隐藏，从而对类实例外部的代码隐藏数据。\n\n封装的一个常见用途是数据隐藏：防止从类外部访问数据，除非通过显式操作。清单 4-2 中的示例展示了一个\
  \ `Totalizer` 类，它有一个 `private total` 属性，该属性不能被 `Totalizer` 类外部的代码修改。当外部代码调用该类上定义的方法时，该属性可以发生变化。这消除了以下风险：\n\
  \n-   外部代码添加捐款而未添加税收返还；\n-   外部代码未能验证金额是否为正数；\n-   税收返还计算出现在调用代码的多个地方；\n-   税率出现在外部代码的多个地方。\n\
  \n```typescript\nclass Totalizer {\nprivate total = 0;\nprivate taxRateFactor =\
  \ 0.2;\naddDonation(amount: number) {\nif (amount <= 0) {\nthrow new Error('捐款金额异常');\n\
  }\nconst taxRebate = amount * this.taxRateFactor;\nconst totalDonation = amount\
  \ + taxRebate;\nthis.total += totalDonation;\n}\ngetAmountRaised() {\nreturn this.total;\n\
  }\n}\nconst totalizer = new Totalizer();\ntotalizer.addDonation(100.00);\nconst\
  \ fundsRaised = totalizer.getAmountRaised();\n// 120\nconsole.log(fundsRaised);\n\
  ```\n*清单 4-2. 封装*\n\n封装是帮助你在程序中防止大量重复代码的工具，但它并非神奇地实现这一点。你应该使用 `private` 关键字隐藏属性，以防止外部代码更改值或使用该值控制程序流程。最常见的重复形式之一是逻辑分支，例如\
  \ `if` 和 `switch` 语句，它们基于本应使用 `private` 关键字隐藏的属性来控制程序。当你更改属性时，你需要查找所有这些逻辑分支，这会在你的代码中产生令人担忧的连锁变更。\n\
  \n封装的最大好处在于，它极大地简化了理解代码的任务。类上的私有成员允许你在不查看该类之外的任何代码的情况下，准确理解该成员的用途。你可以保证该成员的每次使用都在你眼前，如果没有使用该成员，你可以安全地删除它，因为知道没有其他代码依赖于它。\n\
  \n一旦你提高了成员的可见性，如果不查看更广泛的代码集合，就无法再了解它是如何被使用的。如果你正在编写一个被其他程序使用的包，你不可能了解该成员的所有用途，因此事情会比私有成员复杂得多。\n\
  \n\n\n### 委托\n\n在程序复用方面，最重要的概念之一就是委托。委托描述的是程序中一个部分将任务移交给另一个部分的情况。在真正的委托中，包装器会将自身的引用传递给委托对象，这使得委托对象能够回调原始包装器。例如，包装器类会调用委托类，并将关键字\
  \ `this` 传递给委托，允许委托调用包装器类中的公有方法。这使得包装器类与委托类能够像子类与超类一样运作。\n\n当包装器不传递自身引用时，这种操作在技术上被称为转发，而非委托。在委托和转发中，你可能会调用一个类的方法，但该类会将处理过程移交给另一个类，如代码清单\
  \ 4-3 所示。如果两个类之间的关系不符合“是一个”原则，那么委托和转发通常是继承的良好替代方案。\n\n**注意**\n\n面向对象中的“是一个”原则涉及描述对象之间的关系，以验证子类确实是超类的一个特化版本。例如，“猫是一种哺乳动物”和“储蓄账户是一种银行账户”。当关系不成立时，通常也很明显，例如，“汽车是一种底盘”不成立，但“汽车有一个底盘”则成立。“有一个”关系需要委托（或转发），而不是继承。\n\
  \n```\ninterface ControlPanel {\nstartAlarm(message: string): any;\n}\ninterface\
  \ Sensor {\ncheck(): any;\n}\nclass MasterControlPanel {\nprivate sensors: Sensor[]\
  \ = [];\nconstructor() {\n// 实例化委托对象 HeatSensor\nthis.sensors.push(new HeatSensor(this));\n\
  }\nstart() {\nfor (let sensor of this.sensors) {\nsensor.check();\n}\nwindow.setTimeout(()\
  \ => this.start(), 1000);\n}\nstartAlarm(message: string) {\nconsole.log('Alarm!\
  \ ' + message);\n}\n}\nclass HeatSensor {\nprivate upperLimit = 38;\nprivate sensor\
  \ = {\nread: function() { return Math.floor(Math.random() * 100); }\n};\nconstructor(private\
  \ controlPanel: ControlPanel) {\n}\ncheck() {\nif (this.sensor.read() > this.upperLimit)\
  \ {\n// 回调包装器\nthis.controlPanel.startAlarm('Overheating!');\n}\n}\n}\nconst controlPanel\
  \ = new MasterControlPanel();\ncontrolPanel.start();\n代码清单 4-3.\n委托\n```\n\n代码清单\
  \ 4-3 是一个简单的委托示例。`ControlPanel` 类将自身传递给 `HeatSensor` 构造函数，这使得 `HeatSensor` 类能够在需要时调用\
  \ `ControlPanel` 的 `startAlarm` 方法。`ControlPanel` 可以协调任意数量的传感器，并且每个传感器在检测到问题时都可以回调\
  \ `ControlPanel` 来触发警报。\n\n我们可以在此基础上进一步扩展，演示可以选择继承或委托的各种决策点。图 4-1 描述了各种汽车组件之间的关系。底盘是构建汽车的基本骨架，是汽车的基础框架。当引擎、传动轴和变速箱安装到底盘上时，这种组合被称为滚动底盘。\n\
  \n![A323824_2_En_4_Fig1_HTML.jpg](img/A323824_2_En_4_Fig1_HTML.jpg)\n\n图 4-1. 封装与继承\n\
  \n对于图中的每个关系，尝试阅读“是一个”和“有一个”这两种替代描述，看看你是否同意图中所示的关系。在进行面向对象编程的这些检查时，我们暂时搁置语法问题，因此你永远不需要使用“是一个”或“有一个”的变体。\n\
  \n### 多态性\n\n在编程中，多态性指的是能够定义一个契约，并让多种不同类型来实现该契约的能力。使用某个实现契约的类的代码，不需要了解具体实现的细节。在\
  \ TypeScript 中，可以通过多种不同形式来实现多态性：\n\n*   由多个类实现的接口；\n*   由多个对象实现的接口；\n*   由多个函数实现的接口；\n\
  *   带有多个特化子类的超类；\n*   任何具有多个相似结构的结构体。\n\n最后一点，“任何具有多个相似结构的结构体”，指的是 TypeScript 的结构类型系统，该系统会接受与所需类型兼容的结构体。这意味着，即使两个函数（或两个具有兼容结构的类，或两个具有相似结构的对象）没有显式实现某个命名类型，只要它们具有相同的签名和返回类型，你就能实现多态性，如代码清单\
  \ 4-4 所示。\n\n```\ninterface Vehicle {\nmoveTo(x: number, y: number);\n}\n// 显式实现接口\n\
  class Car implements Vehicle {\nmoveTo(x: number, y: number) {\nconsole.log('Driving\
  \ to ' + x + ' ' + y);\n}\n}\nclass SportsCar extends Car {\n}\n// 未显式实现 Vehicle\
  \ 接口\nclass Airplane {\nmoveTo(x: number, y: number) {\nconsole.log('Flying to '\
  \ + x + ' ' + y);\n}\n}\nclass Satellite {\nmoveTo(x: number) {\nconsole.log('Targeting\
  \ ' + x);\n}\n}\nfunction navigate(vehicle: Vehicle) {\nvehicle.moveTo(59.9436499,\
  \ 10.7167959);\n}\nconst car = new SportsCar();\nnavigate(car);\nconst airplane\
  \ = new Airplane();\nnavigate(airplane);\nconst satellite = new Satellite();\nnavigate(satellite);\n\
  代码清单 4-4.\n多态性\n```\n\n代码清单 4-4 说明了 TypeScript 中的多态性。`navigate` 函数接受任何与 `Vehicle`\
  \ 接口兼容的类型。具体来说，这意味着任何拥有名为 `moveTo`、且接受最多两个 `number` 类型参数的方法的类或对象。\n\n**注意**\n\n\
  重要的是要记住，如果一个方法接受的参数更少，那么它在结构上就与另一个方法兼容。在许多语言中，即使参数在方法体中未使用，你也必须指定冗余的参数，但在 TypeScript\
  \ 中，你可以省略它。如果契约指定了该参数，调用代码仍然可以传递它，这保证了多态性。\n\n代码清单 4-4 中的 `navigate` 函数将指定的 `Vehicle`\
  \ 发送到位于奥斯陆的挪威计算中心——多态性正是由奥利-约翰·达尔和克利斯登·奈加特在此创造。\n\n该示例中定义的所有类型都与 `Vehicle` 定义兼容；`Car`\
  \ 显式实现了该接口，`SportsCar` 继承自 `Car`，因此它也实现了 `Vehicle` 接口。`Airplane` 并未显式实现 `Vehicle`\
  \ 接口，但它拥有一个兼容的 `moveTo` 方法，因此会被 `navigate` 函数接受。`Satellite` 类代表一个具有固定“y”坐标的交通工具，这意味着只能控制“x”坐标。这种类型仍然是兼容的，因为\
  \ TypeScript 允许接受参数更少的类型。根据结构接受兼容类型是 TypeScript 结构类型系统的一个特性，这在第 3 章中有描述。\n\n\n\n\
  ## SOLID 原则\n\n面向对象编程与其他编程范式一样，并不能避免程序变得混乱或难以维护。这正是五项启发式设计准则——通常被称为 SOLID 原则——存在的原因。\n\
  \nSOLID 原则由罗伯特·C·马丁（Robert C. Martin）整理归纳，并在一系列在线文章和几本书籍中进行了描述（`http://www.objectmentor.com/resources/articles/Principles_and_Patterns.pdf`，2000\
  \ 年；《敏捷原则、模式与实践（C#版）》，Prentice Hall，2006 年）。后来，迈克尔·费瑟斯（Michael Feathers）发现了“SOLID”这个缩写词。幸运的是，原则的顺序并不重要，因此可以重新排列以形成这个更易记的形式。这些原则旨在成为支撑面向对象编程与设计的基本信条。总体而言，这些原则为创建可读性强且可维护的代码提供了指导。\n\
  \n重要的是要记住，软件设计是一个启发式过程。不可能创建像清单一样可以简单遵循的规则。SOLID 原则是帮助您从面向对象的角度思考程序设计的指南，并能帮助您在特定情境下做出明智的设计决策。这些原则还提供了一种通用语言，可用于与其他程序员讨论设计方案。\n\
  \n五项 SOLID 原则如下：\n\n*   **单一职责原则** —— 一个类的变更原因应该只有一个，且只能有一个。\n*   **开闭原则** —— 应该可以在不修改一个类的情况下扩展其行为。\n\
  *   **里氏替换原则** —— 子类应该能够替换其父类。\n*   **接口隔离原则** —— 多个特定于客户端的专用接口优于一个通用接口。\n*   **依赖反转原则**\
  \ —— 依赖抽象，而非具体实现。\n\n以下各部分将分别讨论这五项 SOLID 原则。\n\n### 单一职责原则（SRP）\n\nSRP 要求一个类只能有一个变更原因。在设计类时，您应该致力于将相关功能放在一起，确保它们因相同原因而变更，并将可能因不同原因而变更的功能分开。遵循此原则的程序所拥有的类仅执行少数几项相关的任务。这样的程序很可能具有高内聚性。\n\
  \n术语“内聚性”指的是类或模块内部功能相关性的度量。如果功能不相关，则该类的内聚性低，并且可能因多种不同原因而变更。正确应用 SRP 会带来高内聚性。\n\n\
  当您向程序添加代码时，需要有意识地决定其归属。此原则的大多数违反并非来自那些方法明显与其所属类不匹配的明显情况。更常见的情况是，一个类在一段时间内，在众多不同程序员的维护下，逐渐越过了其最初的设计目的。\n\
  \n在考虑 SRP 时，您不必将思维局限于类，因为该原则具有分形性。您可以将此原则应用于方法，确保每个方法只做一件事，因此只有一个变更原因。您也可以将此原则应用于模块，确保在宏观层面上，模块只有一个责任领域。\n\
  \n清单 4-5 展示了一个典型的违反 SRP 的例子。乍一看，所有的方法似乎都属于 `Movie` 类，因为它们都使用电影属性执行操作。然而，持久化逻辑的出现模糊了将\
  \ `Movie` 类作为对象使用与将其作为数据结构使用的界限。\n\n```\nclass Movie {\nprivate db: DataBase;\n\
  constructor(private title: string, private year: number) {\nthis.db = DataBase.connect('user:pw@mydb',\
  \ ['movies']);\n}\ngetTitle() {\nreturn this.title + ' (' + this.year + ')';\n}\n\
  save() {\nthis.db.movies.save({ title: this.title, year: this.year });\n}\n}\n//\
  \ 电影\nconst movie = new Movie('实习大叔', 2013);\nmovie.save();\n清单 4-5.\n单一职责原则（SRP）违反示例\n\
  ```\n\n为了防止这个类演变成更大的问题，我们可以将这两个关注点分开：`Movie` 类负责与电影相关的行为，而 `MovieRepository` 则负责存储数据，如清单\
  \ 4-6 所示。如果为 `Movie` 类添加新功能，`MovieRepository` 无需任何更改。如果您要更换数据存储设备，`Movie` 类也无需更改。\n\
  \n```\nclass Movie {\nconstructor(private title: string, private year: number) {\n\
  }\ngetTitle() {\nreturn this.title + ' (' + this.year + ')';\n}\n}\nclass MovieRepository\
  \ {\nprivate db: DataBase;\nconstructor() {\nthis.db = DataBase.connect('user:pw@mydb',\
  \ ['movies']);\n}\nsave(movie: Movie) {\nthis.db.movies.save(JSON.stringify(movie));\n\
  }\n}\n// 电影\nconst movie = new Movie('实习大叔', 2013);\n// MovieRepository\nconst movieRepository\
  \ = new MovieRepository();\nmovieRepository.save(movie);\n清单 4-6.\n分离变更原因\n```\n\
  \n如果你牢记单一职责原则，在类级别上关注其责任通常很直接，但在方法级别上可能更为重要，要确保每个方法只执行一项任务，并且其命名方式能揭示该方法预期的行为。“鲍勃大叔”创造了“提取到不能提取为止”这个短语，指的是持续重构方法，直到每个方法的行数都少到只能做一件事。这种广泛重构方法的实践所付出的努力远远值得，因为它能带来设计上的改进。\n\
  \n\n\n### 开闭原则（OCP）\n\nOCP 通常被概括为：软件实体应对扩展开放，对修改关闭。从务实的角度来看，无论你在前期对程序做了多少设计，几乎都无法完全避免后续的修改。然而，修改现有类的风险在于，你可能会无意中引入行为变化，这种变化会波及依赖该类的代码。自动化测试（在第\
  \ 10 章中介绍）可以在一定程度上（但并非完全）缓解这个问题。\n\n要遵循 OCP，你需要考虑程序中可能发生变化的部分。例如，尝试识别任何包含你未来可能希望替换或扩展的行为的类。这其中的一个小问题是，通常我们无法预测未来，而且如果你引入了意在后期才发挥作用的代码，往往风险很大。试图猜测可能发生的事情可能会很麻烦，因为要么这些代码最终从未被使用，要么真正的未来走向与你的预测不符。因此，你需要在应用这个原则时保持务实，这有时意味着只有在实际中第一次遇到问题时才引入相应的代码来解决问题。\n\
  \n牢记这些提醒，遵循 OCP 的一种常见做法是，允许用一个类替换另一个类，从而获得不同的行为。在大多数面向对象语言中，这是一件相当简单的事情，TypeScript\
  \ 也不例外。清单 4-7 展示了一个名为 `RewardPointsCalculator` 的积分卡点数计算类。标准的奖励点数是“在商店每消费一美元，获得四个积分”。当决定为某些\
  \ VIP 客户提供双倍积分时，不是直接在原有的 `RewardPointsCalculator` 类中添加条件分支，而是创建一个名为 `DoublePointsCalculator`\
  \ 的子类来处理新的行为。在这个例子中，子类调用了父类中原有的 `getPoints` 方法，但它也可以完全忽略原始类，以任何它想要的方式计算点数。\n\n如果决定只对某些符合条件的购买行为给予奖励积分，那么可以创建一个类，在调用原始的\
  \ `RewardPointsCalculator` 之前，根据交易类型进行过滤——这同样是扩展应用程序的行为，而不是修改现有的 `RewardPointsCalculator`\
  \ 类。\n\n```\nclass RewardPointsCalculator {\ngetPoints(transactionValue: number)\
  \ {\n// 每消费一美元获得 4 个积分\nreturn Math.floor(transactionValue) * 4;\n}\n}\nclass DoublePointsCalculator\
  \ extends RewardPointsCalculator {\ngetPoints(transactionValue: number) {\nconst\
  \ standardPoints = super.getPoints(transactionValue);\nreturn standardPoints * 2;\n\
  }\n}\nconst pointsCalculator = new DoublePointsCalculator();\n// 800\nalert(pointsCalculator.getPoints(100.99));\n\
  清单 4-7.\n开闭原则（OCP）\n```\n\n通过遵循 OCP，程序更有可能包含可维护和可重用的代码。通过避免在现有类中进行返工，你也可以避免更改后可能在整个程序中引起连锁反应的冲击波。已知可正常工作的代码保持原样不动，而新代码则用于处理新的需求。\n\
  \n### 里氏替换原则（LSP）\n\n在《数据抽象与层次结构》一书中，Barbara Liskov（ [`http://www.sr.ifes.edu.br/∼mcosta/disciplinas/20091/tpa/recursos/p17-liskov.pdf`](http://www.sr.ifes.edu.br/%E2%88%BCmcosta/disciplinas/20091/tpa/recursos/p17-liskov.pdf)\
  \ ，1988）写道：\n\n> 这里所需的是如下替换特性：如果对于类型 S 的每个对象 o1，都存在一个类型 T 的对象 o2，使得在所有以 T 方式定义的程序\
  \ P 中，当 o1 替换 o2 时，程序 P 的行为保持不变，那么 S 是 T 的子类型。——Barbara Liskov\n\n其核心思想是，如果你用一个子类替换一个父类，那么使用该类的代码不应该需要知道替换已经发生。如果你发现自己在程序中测试对象的类型，那么你很可能是违反了\
  \ LSP。该原则的具体要求将在后面描述，以父类 `Animal` 和继承自 `Animal` 的子类 `Cat` 为例进行说明。\n\n-   子类型中方法参数的**逆变**：如果父类有一个方法接受\
  \ `Cat` 类型参数，那么子类方法应接受 `Cat` 或其父类 `Animal` 类型的参数。\n-   子类型中返回类型的**协变**：如果父类有一个方法返回\
  \ `Animal` 类型，那么子类方法应返回 `Animal` 类型，或 `Animal` 的子类型（例如 `Cat`）。\n-   子类型应抛出与父类型相同的异常，或父类型异常的子类型异常：在\
  \ TypeScript 中，你不限于使用异常类；你可以直接指定一个字符串来抛出异常。可以在 TypeScript 中创建错误类，如清单 4-8 所示。关键在于，如果调用代码有一个异常处理块，它不应该被子类抛出的异常所惊到。关于异常处理的更多信息，请参见第\
  \ 8 章。\n\n```\nclass ApplicationError implements Error {\nconstructor(public name:\
  \ string, public message: string) {\n}\n}\nthrow new ApplicationError('示例错误', '发生了一个错误');\n\
  清单 4-8.\n错误类\n```\n\nLSP 通过确保在程序中添加新行为时，新代码可以替代旧代码，从而支持了 OCP。如果一个子类不能直接替换其父类，那么添加一个新的子类将导致整个代码中发生更改，甚至可能导致程序流程被基于对象类型进行分支的条件判断所控制。\n\
  \n\n\n### 接口隔离原则（ISP）\n\n我们经常发现一个接口本质上只是对整个类的描述。这种情况通常发生在接口是在类之后编写的情况下。清单 4-9 展示了一个打印机接口的简单示例，该打印机可以复印、打印和装订文档。由于该接口只是描述打印机所有行为的一种方式，随着新功能的增加（例如，折叠、装入信封、传真、扫描和电子邮件功能最终可能都会出现在`Printer`接口中），它也会随之膨胀。\n\
  \n```\ninterface Printer {\ncopyDocument();\nprintDocument(document: Document);\n\
  stapleDocument(document: Document, tray: number);\n}\n清单 4-9.\n打印机接口\n```\n\nISP\
  \ 指出，我们不应创建这些庞大的接口，而应编写一系列更小、更具体的接口，并由类来实现它们。每个接口描述一组独立的行为，使得代码可以依赖于一个只提供所需行为的小接口。不同的类可以提供这些小接口的实现，而无需实现额外的不相关功能。\n\
  \n清单 4-9 中的 `Printer` 接口使得实现一台只能打印和复印但不能装订的打印机变得不可能——更糟糕的是，必须实现 `staple` 方法来抛出一个错误，表明操作无法完成。随着接口不断变大，一台打印机满足\
  \ `Printer` 接口的可能性会随着时间的推移而降低，并且向接口添加新方法变得困难，因为它会影响多个实现。清单 4-10 展示了一种替代方法，它将方法分组到更具体的接口中，这些接口描述了多个契约，可以由简单的打印机或简单的复印机单独实现，也可以由全能的高级打印机实现。\n\
  \n```\ninterface Printer {\nprintDocument(document: Document);\n}\ninterface Stapler\
  \ {\nstapleDocument(document: Document, tray: number);\n}\ninterface Copier {\n\
  copyDocument();\n}\nclass SimplePrinter implements Printer {\nprintDocument(document:\
  \ Document) {\n//...\n}\n}\nclass SuperPrinter implements Printer, Stapler, Copier\
  \ {\nprintDocument(document: Document) {\n//...\n}\ncopyDocument() {\n//...\n}\n\
  stapleDocument(document: Document, tray: number) {\n//...\n}\n}\n清单 4-10.\n分离后的接口\n\
  ```\n\n遵循 ISP 时，客户端代码不会被强制依赖于它不打算使用的方法。大型接口往往会鼓励以类似大型块的方式组织调用代码，而一系列小型接口则允许客户端实现小型可维护的适配器来与接口通信。\n\
  \n### 依赖倒置原则（DIP）\n\n在传统的面向对象程序中，高层组件依赖低层组件，形成层级结构。组件之间的耦合导致系统僵化，难以修改，并且在引入更改时容易失败。模块也难以复用，因为将其移入新程序时必须同时引入一系列依赖项。\n\
  \n清单 4-11 展示了一个传统依赖关系的简单示例。高层 `LightSwitch` 类依赖于低层 `Light` 类。\n\n```\nclass Light\
  \ {\nswitchOn() {\n//...\n}\nswitchOff() {\n//...\n}\n}\nclass LightSwitch {\nprivate\
  \ isOn = false;\nconstructor(private light: Light) {\n}\nonPress() {\nif (this.isOn)\
  \ {\nthis.light.switchOff();\nthis.isOn = false;\n} else {\nthis.light.switchOn();\n\
  this.isOn = true;\n}\n}\n}\n清单 4-11.\n高层类对低层类的依赖\n```\n\nDIP 明确指出，高层模块不应依赖低层组件，而应依赖抽象。反过来，抽象不应依赖细节，而应依赖更高级的抽象。简单来说，你可以通过依赖接口而不是类来满足\
  \ DIP。\n\n清单 4-12 演示了 DIP 实践中的第一步，即添加一个 `LightSource` 接口来打破 `LightSwitch` 和 `Light`\
  \ 类之间的依赖关系。我们可以通过将 `LightSwitch` 抽象化为一个 `Switch` 接口来继续此设计；`Switch` 接口将依赖 `LightSource`\
  \ 接口，而不是低层的 `Light` 类。\n\n```\ninterface LightSource {\nswitchOn();\nswitchOff();\n\
  }\nclass Light implements LightSource {\nswitchOn() {\n//...\n}\nswitchOff() {\n\
  //...\n}\n}\nclass LightSwitch {\nprivate isOn = false;\nconstructor(private light:\
  \ LightSource) {\n}\nonPress() {\nif (this.isOn) {\nthis.light.switchOff();\nthis.isOn\
  \ = false;\n} else {\nthis.light.switchOn();\nthis.isOn = true;\n}\n}\n}\n清单 4-12.\n\
  实现依赖倒置原则（DIP）\n```\n\nDIP 扩展了 OCP 和 LSP 的概念。通过依赖抽象，代码与类的特定实现细节耦合度更低。这个原则影响巨大，但遵循起来相对简单，因为你需要做的只是提供一个抽象类或一个（或多个接口，同时牢记接口隔离原则）来依赖，而不是依赖一个具体类。\n\
  \n## 设计模式\n\n在软件领域，设计模式提供了已知问题的目录以及针对每个问题的设计方案。这些模式并非过于刻板；相反，它们提供了一套工具集，你可以在每次使用时以不同的方式排列组合。最常用设计模式的权威来源是原始的“四人帮”著作《设计模式：可复用面向对象软件的基础》（Gamma,\
  \ Helm, Johnson, & Vlissides, Addison Wesley, 1995）。\n\n正如 Diaz 和 Harmes 所展示的那样（《Pro\
  \ JavaScript 设计模式》，Apress，2007），可以将这些设计模式迁移到 JavaScript 中。如果能在普通 JavaScript 中实现，那么在\
  \ TypeScript 中也能实现。由于 TypeScript 提供了基于类的面向对象特性，在许多情况下，从传统设计模式示例到 TypeScript 的转换会更加自然。\n\
  \nTypeScript 非常适合设计模式，因为它提供了使用原始目录中所有创建型、结构型和行为型模式以及此后记录的大量其他模式所需的所有语言结构。下一节将通过\
  \ TypeScript 代码示例描述一小部分设计模式。\n\n以下示例演示了策略模式和抽象工厂模式。这只是四人帮原著中描述的 24 种模式中的 2 种。下面将对这些模式进行总体描述，然后用于改进一个小程序的设计。\n\
  \n注意\n\n尽管你可能事先对哪些设计模式能改进程序的设计有想法，但更常见且通常更可取的做法是让模式随着程序的增长而自然显现。如果你预测可能需要的模式，可能会猜错。如果你在扩展代码时让代码暴露问题，就不太可能创建大量不必要的类，也不太可能因遵循错误的设计而迷失方向。\n\
  \n### 策略模式\n\n策略模式允许你封装不同的算法，使它们可以相互替换。在图 4-2 中，`Context` 类将依赖 `Strategy`，后者为具体实现提供了接口。任何实现该接口的类都可以在运行时传递给\
  \ `Context` 类。\n\n策略模式的一个示例将在本节后面的实际示例中展示。\n\n![A323824_2_En_4_Fig2_HTML.jpg](img/A323824_2_En_4_Fig2_HTML.jpg)\n\
  \n*图 4-2. 策略模式*\n\n\n\n### 抽象工厂模式\n\n抽象工厂模式是一种创建型设计模式。它允许你为相关对象的创建指定一个接口，而无需指定它们的具体类。该模式的目标是让一个类依赖于抽象工厂的行为，而抽象工厂将由不同的具体类实现，这些具体类可以在编译时或运行时进行更改。\n\
  \n图 4-3 所示的实际示例以及下文展示了抽象工厂模式的一个例子。\n\n![A323824_2_En_4_Fig3_HTML.jpg](img/A323824_2_En_4_Fig3_HTML.jpg)\n\
  \n图 4-3. 抽象工厂模式\n\n### 实际示例\n\n为了说明策略模式和抽象工厂模式的使用，我们将使用一个洗车示例。洗车服务可以根据司机的消费金额运行不同等级的洗车服务。代码清单\
  \ 4-13 展示了车轮清洁策略，其中包括一个车轮清洁类的接口，以及两个提供基础清洁或高级清洁的策略。\n\n```\ninterface WheelCleaning\
  \ {\ncleanWheels(): void;\n}\nclass BasicWheelCleaning implements WheelCleaning\
  \ {\ncleanWheels() {\nconsole.log('Soaping Wheel');\nconsole.log('Brushing wheel');\n\
  }\n}\nclass ExecutiveWheelCleaning extends BasicWheelCleaning {\ncleanWheels() {\n\
  super.cleanWheels();\nconsole.log('Waxing Wheel');\nconsole.log('Rinsing Wheel');\n\
  }\n}\n代码清单 4-13. 车轮清洁\n```\n\n代码清单 4-14 展示了清洁车身的策略。这与代码清单 4-13 中的 `WheelCleaning`\
  \ 示例类似，但并非必须如此。当我们稍后将该示例转换为使用抽象工厂模式时，`WheelCleaning` 和 `BodyCleaning` 的代码都不会改变。\n\
  \n```\ninterface BodyCleaning {\ncleanBody(): void;\n}\nclass BasicBodyCleaning\
  \ implements BodyCleaning {\ncleanBody() {\nconsole.log('Soaping car');\nconsole.log('Rinsing\
  \ Car');\n}\n}\nclass ExecutiveBodyCleaning extends BasicBodyCleaning {\ncleanBody()\
  \ {\nsuper.cleanBody();\nconsole.log('Waxing car');\nconsole.log('Blow drying car');\n\
  }\n}\n代码清单 4-14. 车身清洁\n```\n\n代码清单 4-15 展示了更新为使用抽象工厂模式之前的 `CarWashProgram` 类。这是一个典型的“知道太多”的类示例。它与具体的清洁类紧密耦合，并负责根据所选程序创建相关类。\n\
  \n```\nclass CarWashProgram {\nconstructor(private washLevel: number) {\n}\nrunWash()\
  \ {\nlet wheelWash: WheelCleaning;\nlet bodyWash: BodyCleaning;\nswitch (this.washLevel)\
  \ {\ncase 1:\nwheelWash = new BasicWheelCleaning();\nwheelWash.cleanWheels();\n\
  bodyWash = new BasicBodyCleaning();\nbodyWash.cleanBody();\nbreak;\ncase 2:\nwheelWash\
  \ = new BasicWheelCleaning();\nwheelWash.cleanWheels();\nbodyWash = new ExecutiveBodyCleaning();\n\
  bodyWash.cleanBody();\nbreak;\ncase 3:\nwheelWash = new ExecutiveWheelCleaning();\n\
  wheelWash.cleanWheels();\nbodyWash = new ExecutiveBodyCleaning();\nbodyWash.cleanBody();\n\
  break;\n}\n}\n}\n代码清单 4-15. 使用抽象工厂模式前的 CarWashProgram 类\n```\n\n抽象工厂本身是一个接口，它描述了每个具体工厂可以执行的操作。在代码清单\
  \ 4-16 中，`ValetFactory` 接口提供了用于获取提供车轮清洁功能的类和提供车身清洁功能的类的方法签名。需要车轮清洁和车身清洁的类可以依赖于这个接口，并与指定实际清洁操作的类保持解耦。\n\
  \n```\ninterface ValetFactory {\ngetWheelCleaning() : WheelCleaning;\ngetBodyCleaning()\
  \ : BodyCleaning;\n}\n代码清单 4-16. 抽象工厂\n```\n\n在代码清单 4-17 中，声明了三个具体工厂，它们分别提供青铜级、白银级或黄金级的洗车服务。每个工厂都提供与所需清洗级别相匹配的适当清洁类。\n\
  \n```\nclass BronzeWashFactory implements ValetFactory {\ngetWheelCleaning() {\n\
  return new BasicWheelCleaning();\n}\ngetBodyCleaning() {\nreturn new BasicBodyCleaning();\n\
  }\n}\nclass SilverWashFactory implements ValetFactory {\ngetWheelCleaning() {\n\
  return new BasicWheelCleaning();\n}\ngetBodyCleaning() {\nreturn new ExecutiveBodyCleaning();\n\
  }\n}\nclass GoldWashFactory implements ValetFactory {\ngetWheelCleaning() {\nreturn\
  \ new ExecutiveWheelCleaning();\n}\ngetBodyCleaning() {\nreturn new ExecutiveBodyCleaning();\n\
  }\n}\n代码清单 4-17. 具体工厂\n```\n\n代码清单 4-18 展示了应用抽象工厂模式后的更新类。`CarWashProgram` 类不再了解任何将执行洗车操作的具体类。`CarWashProgram`\
  \ 现在通过构造函数接收合适的工厂，该工厂将提供执行清洁操作的类。这可以通过编译时机制或动态运行时机制来实现。\n\n```\nclass CarWashProgram\
  \ {\nconstructor(private cleaningFactory: ValetFactory) {\n}\nrunWash() {\nconst\
  \ wheelWash = this.cleaningFactory.getWheelCleaning();\nwheelWash.cleanWheels();\n\
  const bodyWash = this.cleaningFactory.getBodyCleaning();\nbodyWash.cleanBody();\n\
  }\n}\n代码清单 4-18. 使用中的抽象工厂模式\n```\n\n## 混入（Mixins）\n\n混入提供了一种组合应用程序的替代方式，这种方式在设计模式书籍中没有明确涉及。\n\
  \n混入（Mixins）这个名字源自一种可定制的冰淇淋甜点，该甜点最初出现在马萨诸塞州萨默维尔的 Steve's Ice Cream 店铺。这种混入式甜点的理念是，你选择一种冰淇淋，然后添加另一种产品（例如一块糖果棒）来调味。自\
  \ 1973 年出现在 Steve Herrell 的菜单上以来，这种混入（或压入）冰淇淋的概念已风靡全球。\n\n在编程中，混入基于非常相似的概念。通过将多个混入类组合在一起，可以创建增强类，每个混入类都提供一种小的、可复用的行为。这些混入类既部分地作为接口，也部分地作为实现。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例，将英文文本翻译成中文。\n\n\n### TypeScript 混入\n\nTypeScript\
  \ 提供了两种混入风格：原始的简单混入和更新的真正混入。简单混入借助一个额外的函数来实现连接。应用混入的函数如列表 4-19 所示。该函数遍历 `baseCtors`\
  \ 数组中每个混入类的实例成员，并将它们添加到 `derivedCtor` 类中。每次需要将混入应用到某个类时，都会使用此函数，并且在本节的示例中都会看到它的使用。\n\
  \n```typescript\nfunction applyMixins(derivedCtor: any, baseCtors: any[]) {\n  \
  \  baseCtors.forEach(baseCtor => {\n        Object.getOwnPropertyNames(baseCtor.prototype).forEach(name\
  \ => {\n            derivedCtor.prototype[name] = baseCtor.prototype[name];\n  \
  \      });\n    });\n}\n// 列表 4-19. 混入启用函数\n```\n\n在程序中的某个位置添加此函数后，就可以开始使用混入了。在列表\
  \ 4-20 中定义了一系列可复用的混入小类。这些类没有特定的语法。在本示例中，我们定义了一系列可能的行为：`Sings`、`Dances` 和 `Acts`。这些类作为行为菜单，可以混合搭配以创建由不同组合构成的不同风格。\n\
  \n```typescript\nclass Sings {\n    sing() {\n        console.log('Singing');\n\
  \    }\n}\nclass Dances {\n    dance() {\n        console.log('Dancing');\n    }\n\
  }\nclass Acts {\n    act() {\n        console.log('Acting');\n    }\n}\n// 列表 4-20.\
  \ 可复用类\n```\n\n单独来看，这些类太小而无法发挥作用，但它们非常紧密地遵循了单一职责原则。虽然不限于单个方法，但核心思想是每个类代表一种可以通过类名概括的行为。为了使这些混入有用，需要将它们组合成可用的增强类。\n\
  \n在 TypeScript 中，使用 `implements` 关键字，后跟逗号分隔的混入列表来组成混入类。`implements` 关键字旨在表明混入类似于带有实现的接口。你还需要提供与所组合的所有混入相匹配的临时属性，如列表\
  \ 4-21 所示。这些属性将在类声明之后直接调用 `applyMixins` 函数时被替换。\n\n没有任何机制能确保你调用 `applyMixins` 函数时传入的类集合与在\
  \ `implements` 语句中列出的集合一致。你需要负责保持这两个列表同步。\n\n```typescript\nclass Actor implements\
  \ Acts {\n    act: () => void;\n}\napplyMixins(Actor, [Acts]);\n\nclass AllRounder\
  \ implements Acts, Dances, Sings {\n    act: () => void;\n    dance: () => void;\n\
  \    sing: () => void;\n}\napplyMixins(AllRounder, [Acts, Dances, Sings]);\n// 列表\
  \ 4-21. 组合类\n```\n\n`Actor` 和 `AllRounder` 类没有真正的实现，只有由混入提供的实现的占位符。这意味着对于任何给定的行为，程序中只需要更改一个地方。使用增强类与使用程序中的任何其他类没有区别，如列表\
  \ 4-22 所示。\n\n```typescript\nconst actor = new Actor();\nactor.act();\n\nconst allRounder\
  \ = new AllRounder();\nallRounder.act();\nallRounder.dance();\nallRounder.sing();\n\
  // 列表 4-22. 使用类\n```\n\n**注意**\n\n你可能已经注意到，混入看起来有点像多重继承。TypeScript 中不允许多重继承。混入的关键在于使用\
  \ `implements` 关键字而不是 `extends` 关键字，这使得它们更像接口而不是超类。\n\n### 何时使用混入\n\n混入已经在 TypeScript\
  \ 中得到一定支持——那么使用它们时应该注意什么呢？首先也是最重要的，为增强类添加实现的机制未经检查，因此必须非常小心地使用正确的类名列表调用 `applyMixins`\
  \ 函数。这是一个需要充分测试的领域，以避免出现任何令人不快的意外。\n\n决定使用混入还是经典继承通常取决于类之间的关系。在决定继承和委托时，通常使用“是（is\
  \ a）”与“有（has a）”的测试，如前文所述。\n\n*   汽车有一个底盘（A car has a chassis）。\n*   滚动底盘是一个底盘（A\
  \ rolling chassis is a chassis）。\n\n继承仅用于在句子中“是（is a）”关系成立的情况，而委托则用于“有（has a）”更有意义的情况。对于混入，关系最好用“能做（can\
  \ do）”来形容，例如：\n\n*   演员能做表演（An actor can do acting）。或者\n*   演员表演（An actor acts）。\n\
  \n你可以通过使用诸如 `Acting` 或 `Acts` 这样的名称来命名混入，从而强化这种关系。这会使你的类读起来像一个句子，例如“Actor implements\
  \ Acting”。\n\n混入旨在允许将小单元组合成大单元，因此以下场景是使用混入的良好候选：\n\n*   用可选特性组合类，混入即选项。\n*   在许多类上复用相同的行为。\n\
  *   基于相似的特征列表创建许多变体。\n\n### 限制\n\n不能将混入与私有成员一起使用，因为如果这些成员未在增强类中实现，编译器将报错。如果混入和增强类都定义了同名的私有成员，编译器也会报错。\n\
  \n混入的另一个限制是，尽管方法实现会被映射到增强类，但属性值不会被映射；这一点在列表 4-23 中得到了演示。当从混入实现属性时，需要在增强类中对其进行初始化。为避免混淆，最佳做法是在混入中定义所需属性，但不提供默认值。\n\
  \n```typescript\nclass Acts {\n    public message = 'Acting';\n    act() {\n   \
  \     console.log(this.message);\n    }\n}\n\nclass Actor implements Acts {\n  \
  \  public message: string;\n    act: () => void;\n}\napplyMixins(Actor, [Acts]);\n\
  \nconst actor = new Actor();\n// 记录'undefined'，而非'Acting'\nactor.act();\n// 列表 4-23.\
  \ 属性未映射\n```\n\n如果属性不需要绑定到实例，可以使用静态属性，因为这些属性在从混入映射到增强类的方法中仍然可用。列表 4-24 是列表 4-23\
  \ 的更新版本，通过使用静态属性解决了该问题。如果每个实例确实需要不同的值，则应在增强类中初始化实例属性。\n\n```typescript\nclass Acts\
  \ {\n    public static message = 'Acting';\n    act() {\n        alert(Acts.message);\n\
  \    }\n}\n\nclass Actor implements Acts {\n    act: () => void;\n}\napplyMixins(Actor,\
  \ [Acts]);\n\nconst actor = new Actor();\n// 记录'Acting'\nactor.act();\n// 列表 4-24.\
  \ 静态属性可用\n```\n\n\n\n## 真正的混入\n\n真正的混入提供了一种更可靠的机制来支持基于混入的组合。创建演员的等效混入如清单 4-25 所示。`Constructor`类型是一个通用类型，用于描述带有构造函数且可接受零个或多个参数的对象。该混入在`Acts`函数中定义，该函数为任何传入的类扩展一个`message`属性和一个`act`方法。\n\
  \n要将混入应用于某个类，只需调用`Acts`函数并传入目标类即可。当你调用生成的混合类时，该类将拥有其原始成员以及混入的附加成员。\n\n```\ntype\
  \ Constructor = new (...args: any[]) => T;\nfunction Acts(Base: TBase) {\nreturn\
  \ class extends Base {\nmessage: string = 'Acting';\nact() {\nalert(this.message);\n\
  }\n};\n}\nclass Person {\nconstructor(private name: string) {\n}\n}\nconst Actor\
  \ = Acts(Person);\nconst actor = new Actor('Alan');\n// Acting\nactor.act();\n清单\
  \ 4-25.\n真正的混入。\n```\n\n为了展示使用多个混入创建混合类的对比案例，清单 4-26 展示了完整且真正的混入，它等效于之前关于唱歌、跳舞、表演的简单混入。\n\
  \n```\ntype Constructor = new (...args: any[]) => T;\nfunction Sings(Base: TBase)\
  \ {\nreturn class extends Base {\nsing() {\nalert('Singing');\n}\n};\n}\nfunction\
  \ Dances(Base: TBase) {\nreturn class extends Base {\ndance() {\nalert('Dancing');\n\
  }\n};\n}\nfunction Acts(Base: TBase) {\nreturn class extends Base {\nact() {\nalert('Acting');\n\
  }\n};\n}\nclass Person {\nconstructor(private name: string) {\n}\n}\nconst Actor\
  \ = Acts(Person);\nconst AllRounder = Acts(Sings(Dances(Person)));\nconst actor\
  \ = new Actor('Alan');\nactor.act();\nconst allRounder = new AllRounder('Gene');\n\
  allRounder.act();\nallRounder.dance();\nallRounder.sing();\n清单 4-26.\n完整的真正混入。\n\
  ```\n\n真正的混入带来的好处包括：消除了忘记调用`apply mixins`函数的可能性，并且支持所有成员。其语法需要一些功夫来掌握，但一旦你有了`Constructor`类型，剩下的部分就相当简单了。\n\
  \n## 总结\n\nTypeScript 中包含了面向对象编程的所有基本构建块。该语言提供的工具使你能够将在其他语言中学到的所有面向对象原则和实践应用到你的程序中，利用\
  \ SOLID 原则来指导组合，并应用设计模式作为解决常见问题的成熟方案的参考。\n\n面向对象本身并不能解决编写和维护解决复杂问题的程序时所遇到的难题。就像在任何其他编程范式中都可能写出糟糕的代码一样，使用面向对象同样可能写出差的代码；这就是模式与原则如此重要的原因。本章介绍的面向对象元素与第\
  \ 10 章的测试技术相辅相成。\n\n你可以通过编码练习（kata）来练习并提高面向对象的设计技能以及单元测试技能。附录 4 中描述了这些练习，并提供了一些示例供你尝试。\n\
  \n## 关键要点\n\n- TypeScript 拥有编写面向对象程序所需的所有工具。\n- SOLID 原则旨在保持代码的可塑性并防止其腐化。\n- 设计模式是解决常见问题的现有且广为人知的方案。\n\
  - 你不必完全按照描述的方式来实现设计模式。\n- 混入提供了一种替代的组合机制。\n\n"
- '# 5. 理解运行时


  > 糟糕程序员与优秀程序员之间的区别在于理解。也就是说，糟糕的程序员不理解自己在做什么，而优秀的程序员理解。——马克斯·卡纳特-亚历山大


  一旦你的 TypeScript 程序被编译成纯 JavaScript，你就可以在任何地方运行它。JavaScript 可以轻松地在浏览器或服务器上运行；你只需注意，可用的特性会根据代码运行环境的不同而有所差异。本章将解释你在浏览器运行时和服务器运行时之间会遇到的一些差异，并解释所有运行时都共通的一些重要概念，例如事件循环、作用域和事件。



  '
- "# 运行时特性\n\n即使是老旧的浏览器也能让你访问文档对象模型（`DOM`）、鼠标和键盘事件、表单和导航功能。而现代浏览器则会增加离线存储、索引数据库、HTTP\
  \ 请求、地理位置定位，以及用于光线、加速计和距离传感器等设备传感器的一系列应用程序编程接口（`API`）。JavaScript 不仅仅是网络浏览器中最常见的语言；自\
  \ 20 世纪 90 年代初以来，它就已经在服务器上运行。JavaScript 作为服务器端语言的突出地位实际上是通过`NodeJS`得以实现的，这是一项构建在`V8`\
  \ JavaScript 引擎之上的服务器技术。在服务器上运行使得你可以访问数据库、文件系统、加密技术、域名解析、流以及无数其他模块和工具。图 5-1 展示了\
  \ JavaScript 这门语言是如何通过浏览器或服务器提供的 API 而变得强大的。\n\n除非你明确使用允许创建线程的 API（例如 Web Worker\
  \ 或子进程），否则程序中的语句将排队在单个线程上执行。在单个线程上运行程序消除了多线程试图操作同一状态所导致的许多棘手问题，但这确实意味着你需要记住你的代码可能会被排队。一个长时间运行的事件处理器可能会阻止其他事件及时触发，并且队列的执行顺序在细微之处可能有所不同。队列通常按照先进先出的顺序处理，但不同的运行时环境可能会在不同的时间点重新访问队列。例如，一个运行环境可能只在某个函数执行完毕后才会返回队列，但另一个运行环境可能在任何函数移交控制权时（例如通过调用另一个函数）就重新访问队列。在后一种情况下，在调用第二个函数之前，可能会执行另一条语句。尽管这些潜在差异看似令人担忧，但在实践中很少会发现它们会引起任何问题。\n\
  \n除了处理包含所有事件的队列之外，运行时可能还有其他任务需要在同一个线程上处理；例如，浏览器可能需要重绘屏幕。如果你有一个运行时间过长的函数，就可能影响浏览器的重绘速度。为了让浏览器能够每秒绘制\
  \ 60 帧，你需要将任何函数的执行时间控制在 17 毫秒以内。在实践中让函数保持快速运行非常容易，除非你处理的是具有阻塞调用的 API（例如 `localStorage`），或者执行一个长时间运行的循环。\n\
  \n![A323824_2_En_5_Fig1_HTML.jpg](img/A323824_2_En_5_Fig1_HTML.jpg)\n\n**图 5-1.**\
  \ 浏览器环境与服务器环境中的 JavaScript 特性\n\n运行时单线程方法最常见的副作用之一是，间隔计时器和定时器的执行时间可能看起来比指定的时间更长。这是因为它们必须在队列中等待执行。代码清单\
  \ 5-1 展示了一个测试函数，用于计算延迟日志语句的执行时间。调用 `test` 函数会设置一个 50 毫秒的定时器，并测量其触发所需的时间。多次运行这段代码，你会发现得到的结果在\
  \ 50 到 52 毫秒之间，这符合预期。\n\n```\nfunction test() {\nconst testStart = performance.now();\n\
  window.setTimeout(function () {\nconsole.log(performance.now() - testStart);\n},\
  \ 50);\n}\ntest();\n```\n\n**代码清单 5-1.** 排队的定时器\n\n为了模拟一个长时间运行的进程，在代码清单 5-2 的 `test`\
  \ 函数中添加了一个运行 100 毫秒的循环。该循环在设置定时器之后开始，但由于在原始 `test` 函数完成之前没有任何任务出队，定时器执行的时间比之前晚了很多。此示例中记录的时间通常在\
  \ 118 到 130 毫秒的范围内。\n\n```\nfunction test() {\nconst testStart = performance.now();\n\
  window.setTimeout(function () {\nconsole.log(performance.now() - testStart);\n},\
  \ 50);\n// 模拟长时间运行的进程\nconst start = +new Date();\nwhile (+new Date() - start <\
  \ 100) {\n// 延迟 100 毫秒\n}\n}\ntest();\n```\n\n**代码清单 5-2.** 排队的定时器，延迟执行，等待 `test`\
  \ 方法结束\n\n**注意**\n\n所有主流浏览器的最新版本都支持 `performance.now` 高分辨率定时器。这种测量执行时间的方法比使用 `Date`\
  \ 对象更准确。日期基于系统时钟，系统时钟可能每 15 分钟就会同步一次。如果在计时操作期间发生同步，将会影响你的结果。`performance.now` 值来自一个高分辨率定时器，它可以测量亚毫秒级的时间间隔，在页面开始加载时从\
  \ `0` 开始，并且在同步期间不会被调整。\n\n\n\n## 作用域\n\n术语“作用域”指的是一组在给定上下文中可解析的可用标识符。在大多数类 C 语言中，标识符是块级作用域的，这意味着它们只能在定义它们的同一组花括号内使用。在一组花括号内声明的变量在该花括号外部不可用，但花括号内的语句可以访问在花括号外部声明的变量。清单\
  \ 5-3 展示了这种常见的类 C 语言作用域的工作方式。\n\n当你在 JavaScript（以及 TypeScript）中使用 `var` 关键字时，情况并非如此。如果清单\
  \ 5-3 中的代码在 JavaScript 运行时中执行，那么两个语句中记录的值将是相同的；具体来说，你会看到“Outer: 2”，而不是“Outer: 1”。这是因为使用\
  \ `var` 关键字创建的变量的作用域是由函数定义的，而不是由块定义的。\n\n```\nvar scope = 1;\n{\nvar scope = 2;\n\
  // Inner: 2\nconsole.log('Inner: ' + scope);\n}\n// Outer: 1\nconsole.log('Outer:\
  \ ' + scope);\n清单 5-3.\n类 C 语言作用域\n```\n\n清单 5-4 展示了相同的示例，但使用一个函数来为内部变量提供作用域。该函数创建了一个新的上下文，使得内部作用域变量独立于外部作用域变量。在这个示例中，日志语句的工作方式与其他类\
  \ C 语言相同。\n\n```\nvar scope = 1;\n(function () {\nvar scope = 2;\n// Inner: 2\n\
  console.log('Inner: ' + scope);\n}());\n// Outer: 1\nconsole.log('Outer: ' + scope);\n\
  清单 5-4.\n函数作用域\n```\n\nECMAScript 规范中有两种新的变量声明：`let` 和 `const`。`let` 和 `const` 都是块级作用域的，这将使你避免函数作用域变量的许多陷阱。`const`\
  \ 关键字还有一个额外的好处，即防止重新赋值，这意味着变量不能被覆盖（尽管其值可以改变）。\n\n你可以在 TypeScript 代码中使用 `let` 和 `const`。如果你的目标是旧版本的\
  \ JavaScript，编译器将使用降级编译来重命名你的变量，以防止它们受到上下文变化的影响。清单 5-5 重新审视了原始示例，使用 `const` 关键字代替\
  \ `var` 关键字，从而正确地记录了“Inner: 2”和“Outer: 1”。\n\n```\nconst scope = 1;\n{\nconst scope\
  \ = 2;\n// Inner: 2\nconsole.log('Inner: ' + scope);\n}\n// Outer: 1\nconsole.log('Outer:\
  \ ' + scope);\n清单 5-5.\n块级作用域\n```\n\n清单 5-5 的降级编译将 `const` 关键字替换为 `var` 关键字，但将第二个变量重命名为\
  \ `scope_1`，如清单 5-6 所示；这可以防止内部变量覆盖外部变量。编译器足够智能，能够避免命名冲突，因此如果你已经有一个名为 `scope_1` 的变量，编译器会选择另一个名称。\n\
  \n```\nvar scope = 1;\n{\nvar scope_1 = 2;\n// Inner: 2\nconsole.log('Inner: ' +\
  \ scope_1);\n}\n// Outer: 1\nconsole.log('Outer: ' + scope);\n清单 5-6.\n块级作用域变量的降级编译\n\
  ```\n\n由于无论目标运行时是什么，你都可以在 TypeScript 中使用块级作用域变量，因此在 TypeScript 程序中没有理由使用 `var` 关键字。\n\
  \n注意\n\n正如第 1 章所述，推荐的编码风格是对所有变量使用 `const` 关键字，并且仅在你决定允许重新赋值时才使用 `let` 关键字打开变量。\n\
  \n使用块级作用域变量还可以防止变量提升，变量提升会将所有变量视为在其作用域的最顶部声明。这在技术上允许变量在使用之前（即声明它们的代码行之前）被使用，尽管它们的值会是\
  \ `undefined`。清单 5-7 显示了一个变量提升的示例。\n\n```\nfunction lemur() {\n// undefined, but\
  \ technically allowable\nconsole.log(kind);\nvar kind = 'Ruffed Lemur';\n}\nlemur();\n\
  清单 5-7.\n变量提升\n```\n\n如果你在声明块级变量之前访问它，TypeScript 编译器会发出警告，从而防止此类细微的错误，以及清单 5-8 中更令人困惑的错误，在该错误中，你可能会期望日志语句中使用全局变量。在使用\
  \ `var` 关键字时，偶然重用了更广泛作用域中的名称，这导致了我职业生涯中调查过的一些最著名的棘手错误。\n\n```\nvar kind = 'Ring\
  \ Tailed Lemur';\nfunction lemur() {\n// undefined, not 'Ring Tailed Lemur'\nconsole.log(kind);\n\
  var kind = 'Ruffed Lemur';\n}\nlemur();\n清单 5-8.\n变量提升与全局作用域混淆\n```\n\n注意\n\n在你的程序中，避免混淆的最佳方法是尽可能避免向全局作用域添加内容。全局变量的缺失意味着\
  \ TypeScript 编译器可以警告你在变量声明之前使用它们，以及意外省略 `var` 或 `let` 关键字的情况。\n\n\n\n### 回调函数\n\n\
  几乎所有现代 JavaScript API，包括那些提供访问设备传感器读数的新浏览器 API，都通过接受一个在操作完成时执行的回调函数来避免阻塞。回调函数就是你作为参数传入的一个函数，当某个操作完成后，它会被调用。\n\
  \n为了说明回调函数的好处，图 5-2 展示了程序在等待一个阻塞型传感器响应请求时的执行流程。由于请求在整个持续期间阻塞了主线程，因此无法执行任何其他语句。将事件队列阻塞超过几毫秒是不可取的，对于长时间运行的操作必须避免这种情况。涉及文件系统调用、硬件设备调用或跨网络连接调用的操作都可能将程序阻塞过长时间，这是不可接受的。\n\
  \n![A323824_2_En_5_Fig2_HTML.jpg](img/A323824_2_En_5_Fig2_HTML.jpg)\n\n图 5-2. 阻塞式调用\n\
  \n回调函数对于避免这些阻塞请求非常有用。图 5-3 展示了如何使用这种模式来避免在长时间运行过程中阻塞主线程。当发出请求时，一个函数会连同请求一起被传入。随后，主线程能够像往常一样处理事件队列。当长时间运行的过程结束时，回调函数被调用，并传入任何相关的参数。这将回调函数添加到事件队列中，然后依次执行。\n\
  \n![A323824_2_En_5_Fig3_HTML.jpg](img/A323824_2_En_5_Fig3_HTML.jpg)\n\n图 5-3. 使用回调函数\n\
  \n尽管回调函数通常用于在长时间运行过程中避免阻塞程序，但你可以在程序中的任何位置自由地将函数作为参数传递。清单 5-9 演示了这一点。`go` 函数接受一个函数参数。`callback`\
  \ 参数有一个类型注解，限制只能传递那些接受 `string` 参数的函数。`callbackFunction` 满足这个类型注解。\n\n在 `go` 函数体内，使用\
  \ `call` 方法执行回调函数，该方法在 JavaScript 中的所有函数上都可用。\n\n```\nfunction go(callback: (arg:\
  \ string) => void) {\n  callback.call(this, 'Example Argument');\n}\n\nfunction\
  \ callbackFunction(arg: string) {\n  alert(arg);\n}\n\ngo(callbackFunction);\n```\n\
  \n清单 5-9. 将函数作为参数传递\n\n在 `go` 函数内部执行回调函数有三种常见方式。在清单 5-9 中，使用了 `call` 方法。当使用 `call`\
  \ 时，你必须提供一个变量来设置回调函数中 `this` 关键字的上下文。你可以在上下文参数之后跟随任意数量的额外参数；这些参数将被传入回调函数。你也可以使用\
  \ `apply` 方法，它与 `call` 几乎相同，区别在于你以数组形式传递参数，如清单 5-10 所示。如果你的结果已经是一个数组，那么这些值会被展开成独立的参数。\n\
  \n```\nfunction go(callback: (arg: string) => void) {\n  callback.apply(this, ['Example\
  \ Argument']);\n}\n\nfunction callbackFunction(arg: string) {\n  alert(arg);\n}\n\
  \ngo(callbackFunction);\n```\n\n清单 5-10. 使用 `apply`\n\n第三种执行回调函数的方法是直接用圆括号调用该函数，如清单\
  \ 5-11 所示。这种方式不允许设置上下文，因此根据上下文的不同，作用域可能与你的预期有所不同。\n\n```\nfunction go(callback:\
  \ (arg: string) => void) {\n  callback('Example Argument');\n}\n\nfunction callbackFunction(arg:\
  \ string) {\n  alert(arg);\n}\n\ngo(callbackFunction);\n```\n\n清单 5-11. 简单的函数调用\n\
  \n在回调函数上下文之外，`apply` 方法还有一个额外的用途。由于它接受一个包含参数的数组，你可以使用 `apply` 从数组中提取参数。这在清单 5-12\
  \ 中进行了演示。要找出 `numbers` 数组中的最大值，你要么编写一个循环来逐一测试，要么使用每个索引将每个值单独传入 `Math.max` 函数。使用\
  \ `apply` 方法意味着你可以直接传入 `numbers` 数组，并让 `apply` 方法将数组转换为参数列表。因为你没有使用 `apply` 来修改作用域，所以可以将\
  \ `null` 作为第一个参数传入。\n\n```\nconst numbers = [3, 11, 5, 7, 2];\n// 查找最大值的一种脆弱方式\n\
  // const max = Math.max(numbers[0], numbers[1], numbers[2], numbers[3], numbers[4]);\n\
  // 查找最大值的稳健方式\nconst max = Math.max.apply(null, numbers);\n// 11\nconsole.log(max);\n\
  ```\n\n清单 5-12. 使用 `apply` 将数组转换为参数\n\n使用回调函数的模式是将函数作为参数传递的一个例子。下一节将描述这种语言特性的强大之处，以及如何以其他方式使用它。\n\
  \n### 将函数作为参数传递\n\n函数在 JavaScript 中是**一等公民**，这意味着它们可以作为参数传递，作为返回值从另一个函数返回，赋值给变量，并作为对象的属性存储。将函数作为参数传递是提供回调函数的机制。\n\
  \n你可以利用将函数作为参数传递的能力，创建一个简单的观察者模式实现：存储一组订阅者，并从单个类向所有订阅者发布事件。这个简单的观察者模式设计如清单 5-13\
  \ 所示。可以添加任意数量的订阅者，当发布者接收到消息时，它会将消息分发给所有订阅者。\n\n```\ninterface Subscriber {\n  (message:\
  \ string): void;\n}\n\nclass Publisher {\n  private subscribers: Subscriber[] =\
  \ [];\n\n  addSubscriber(subscriber: Subscriber) {\n    this.subscribers.push(subscriber);\n\
  \  }\n\n  notify(message: string) {\n    for (let subscriber of this.subscribers)\
  \ {\n      subscriber(message);\n    }\n  }\n}\n\nconst publisher = new Publisher();\n\
  // 使用箭头函数\npublisher.addSubscriber((message) => console.log('A: ' + message));\n\
  // 使用内联函数\npublisher.addSubscriber(function (message) {\n  console.log('B: ' + message);\n\
  });\n// A: Test message\n// B: Test message\npublisher.notify('Test message');\n\
  ```\n\n清单 5-13. 简单的观察者\n\n注意\n\n当你将函数作为参数传递时，必须省略圆括号；例如，使用 `go(callbackFunction)`\
  \ 而不是 `go(callbackFunction())`；否则函数会被执行，而传递的是其返回值。\n\n一等函数是任何语言中最强大的特性之一。你可以创建**高阶函数**，它们接受函数作为参数，并返回函数作为结果；这提供了更大的灵活性，以及程序中更细粒度的代码可重用性。你也可以参考第\
  \ 1 章，了解更多关于函数柯里化和箭头函数的内容。\n\n\n\n## Promise\n\n引入 Promise 是为了减少回调函数带来的若干问题。当使用一连串的回调时，代码会变得深度嵌套且难以追踪。当考虑错误处理时，回调函数往往会重复编写错误处理代码，进一步增加了理解程序的认知负荷。\n\
  \n原生 `Promise` 对象仅在 ECMAScript 5 之后的版本中可用。如果你的目标对象是这些较新的规范版本，你可以直接使用纯粹的 Promise\
  \ 原生版本。否则，你需要应用一个 polyfill 来添加所需的功能。\n\n为了全面探讨 Promise，我们需要处理一个相当有代表性的示例。通过完成本练习，你将会理解如何使用\
  \ Promise，以及如何创建它们。即使本节中的示例非常简单（它们只是在控制台输出了一些数据），你也能看到回调链导致的问题，以及 Promise 是如何解决嵌套和可读性问题的。\n\
  \n### 简单的回调\n\n第一个示例涉及简单的回调。这个示例允许使用回调，在异步操作完成后将控制权返回给调用代码。我们稍后将对这个程序进行演进，以解决各种问题。\n\
  \n列表 5-14 是我们虚构 API 的起点，它用于异步获取一些数据。`getData` 方法接受一个 id 和一个回调函数，当数据可用时会执行这个回调。依赖数据的代码必须放在这个回调函数内部。\n\
  \n```typescript\ninterface FictitiousData {\n    id: number;\n    name: string;\n\
  }\nclass FictitiousAPI {\n    static data: { [index: number]: FictitiousData } =\
  \ {\n        1: { id: 1, name: 'Aramis' },\n        2: { id: 2, name: 'Athos' },\n\
  \        3: { id: 3, name: 'Porthos' },\n        4: { id: 4, name: 'D\\'Artagnan'\
  \ }\n    };\n    static getData(id: number, callback: (data: FictitiousData) =>\
  \ void) {\n        // 使用超时模拟异步数据访问\n        window.setTimeout(() => {\n        \
  \    const result = this.data[id];\n            if (typeof result == 'undefined')\
  \ {\n                throw new Error('No matching record');\n            }\n   \
  \         callback(result);\n        }, 200);\n    }\n}\n```\n\n该 API 的一个简单用法如列表\
  \ 5-15 所示。一旦异步的 `getData` 函数就绪，它就会执行回调函数，将数据记录到控制台。\n\n```javascript\n// 单次调用：'Aramis'\n\
  FictitiousAPI.getData(1, function (data) {\n    console.log(data.name);\n});\n```\n\
  \n与回调模式相关的一个问题是，它无法处理异步代码中发生的任何异常。无论你在哪里插入 `try/catch` 语句，你都无法在此版本的 API 中处理该错误。\n\
  \n```javascript\n// 错误处理（不起作用）\ntry {\n    FictitiousAPI.getData(5, function (data)\
  \ {\n        console.log(data.name);\n    })\n} catch (ex) {\n    console.log('This\
  \ statement is not reached, the error is not caught!');\n}\n```\n\n当你需要使用回调来链式调用多个操作时，代码会迅速变得嵌套且难以阅读。列表\
  \ 5-17 展示了对类似数据获取调用的嵌套，但当你需要使用多个不同的异步 API 时，也会出现嵌套回调的情况。\n\n```javascript\nFictitiousAPI.getData(1,\
  \ (data) => {\n    console.log(data.name);\n    FictitiousAPI.getData(2, (data)\
  \ => {\n        if (data.name == 'Athos') {\n            console.log(data.id + '\
  \ ' + data.name);\n        } else {\n            console.log(data.name);\n     \
  \   }\n        FictitiousAPI.getData(3, (data) => {\n            console.log(data.name);\n\
  \            FictitiousAPI.getData(4, (data) => {\n                console.log(data.name);\n\
  \                FictitiousAPI.getData(5, (data) => {\n                    console.log(data.name);\n\
  \                })\n            });\n        });\n    });\n});\n```\n\n该程序的输出如下所示：\n\
  \n```\n==== OUTPUT ====\nAramis\n2 Athos\nPorthos\nD'Artagnan\nError: No matching\
  \ record\n```\n\n演进这段代码的第一步是使其能够处理 API 内部发生的错误。之后，我们可以考虑使用 Promise 来改进它。\n\n###\
  \ 回调与错误处理\n\n为了解决错误处理的问题，我们将向回调函数引入一个额外的参数。这是广泛使用回调的程序中的常见模式。通过将错误参数放在第一位，成功情况可以拥有可变数量的参数，而不会影响调用代码期望在哪里找到问题信息。\n\
  \n列表 5-18 展示了 API 的完整第二版，现在它将错误字符串作为第一个参数。在出现问题时，不是抛出错误，而是将错误消息作为第一个参数传递。在成功的情况下，则不传递错误字符串。\n\
  \n```typescript\ninterface FictitiousData {\n    id: number;\n    name: string;\n\
  }\nclass FictitiousAPI {\n    static data: { [index: number]: FictitiousData } =\
  \ {\n        1: { id: 1, name: 'Aramis' },\n        2: { id: 2, name: 'Athos' },\n\
  \        3: { id: 3, name: 'Porthos' },\n        4: { id: 4, name: 'D\\'Artagnan'\
  \ }\n    };\n    static getData(id: number, callback: (error: string, data: FictitiousData)\
  \ => void) {\n        // 使用超时模拟异步数据访问\n        window.setTimeout(() => {\n     \
  \       const result = this.data[id];\n            if (typeof result == 'undefined')\
  \ {\n                callback('No matching record', null);\n                return;\n\
  \            }\n            callback(null, result);\n        }, 200);\n    }\n}\n\
  ```\n\n为了在实际中应用这种新的错误处理模式，列表 5-19 中的简单调用现在需要在访问 `data` 参数之前检查错误。\n\n```javascript\n\
  // 单次调用：'Aramis'\nFictitiousAPI.getData(1, function (error, data) {\n    if (error)\
  \ {\n        console.log('Caught ' + error);\n        return;\n    }\n    console.log(data.name);\n\
  });\n```\n\n同样的检查出现在列表 5-20 中，并且成功地处理了以前无法处理的错误。我们现在可以在成功和出错时执行不同的操作。\n\n```javascript\n\
  // 错误处理\nFictitiousAPI.getData(5, function (error, data) {\n    if (error) {\n \
  \       console.log('Caught ' + error);\n        return;\n    }\n    console.log(data.name);\n\
  });\n```\n\n这种模式的缺点在于错误处理代码的激增，这使得我们的嵌套回调情况变得更加冗长，如列表 5-21 所示。尽管这段代码示例仍然只满足一个非常基本的功能，但现在它成了一个难以理解的复杂列表。\n\
  \n```javascript\nFictitiousAPI.getData(1, (error, data) => {\n    if (error) {\n\
  \        console.log('Caught ' + error);\n        return;\n    }\n    console.log(data.name);\n\
  \    FictitiousAPI.getData(2, (error, data) => {\n        if (error) {\n       \
  \     console.log('Caught ' + error);\n            return;\n        }\n        if\
  \ (data.name == 'Athos') {\n            console.log(data.id + ' ' + data.name);\n\
  \        } else {\n            console.log(data.name);\n        }\n        FictitiousAPI.getData(3,\
  \ (error, data) => {\n            if (error) {\n                console.log('Caught\
  \ ' + error);\n                return;\n            }\n            console.log(data.name);\n\
  \            FictitiousAPI.getData(4, (error, data) => {\n                if (error)\
  \ {\n                    console.log('Caught ' + error);\n                    return;\n\
  \                }\n                console.log(data.name);\n                FictitiousAPI.getData(5,\
  \ (error, data) => {\n                    if (error) {\n                       \
  \ console.log('Caught ' + error);\n                        return;\n           \
  \         }\n                    console.log(data.name);\n                })\n \
  \           });\n        });\n    });\n});\n```\n\n该程序的输出与之前基本相同，如下所示，唯一的区别是错误现在已被处理：\n\
  \n```\n==== OUTPUT ====\nAramis\n2 Athos\nPorthos\nD'Artagnan\nCaught No matching\
  \ record\n```\n\n演进这段代码的下一步是使用 Promise 大幅提高其可读性。\n\n\n\n"
- "# Promise 对象\n\n将 Promise 引入 API 是件相当简单的任务。在代码清单 5-22 中，`getData` 方法的签名被清理了，移除了所有为回调函数引入的参数。这使得签名更好地描述了执行操作所需的内容：在本例中，只需要\
  \ `id`。\n\n该方法的主体被包裹在一个新的 Promise 对象中，该对象始终具有包含两个函数参数的签名。第一个函数将在请求成功时用于兑现（fulfill）该\
  \ Promise。第二个函数用于在发生错误时拒绝（reject）该 Promise。所有 Promise 都有这个签名，但在 TypeScript 中，你可以使用更具体的类型信息来进一步增强这些函数。\n\
  \n在代码清单 5-22 中，`fulfil` 函数有一个带类型的参数 `data`，它将包含 `FictitiousData` 类型的数据，而 `reject`\
  \ 函数有一个字符串类型的 `reason` 参数。这里的类型注解将确保在使用此 Promise 的代码中，自动补全的成员是正确的。你还可以在创建 Promise\
  \ 时使用类型参数来添加此类型信息。\n\n```typescript\ninterface FictitiousData {\n  id: number;\n\
  \  name: string;\n}\n\nclass FictitiousAPI {\n  static data: { [index: number]:\
  \ FictitiousData } = {\n    1: { id: 1, name: 'Aramis' },\n    2: { id: 2, name:\
  \ 'Athos' },\n    3: { id: 3, name: 'Porthos' },\n    4: { id: 4, name: 'D\\'Artagnan'\
  \ }\n  };\n\n  static getData(id: number) {\n    return new Promise((fulfil: (data:\
  \ FictitiousData) => void, reject: (reason: string) => void) => {\n      // 使用超时模拟异步数据访问\n\
  \      window.setTimeout(() => {\n        const result = this.data[id];\n      \
  \  if (typeof result == 'undefined') {\n          reject('没有匹配的记录');\n        }\n\
  \        fulfil(result);\n      }, 200);\n    });\n  }\n}\n```\n\n当我们调用 `getData`\
  \ 方法时，我们现在会返回一个 Promise，如代码清单 5-23 所示。取代回调函数的是，Promise 对象有一个 `then` 方法，它接受一个函数。在这个简单的例子中，Promise\
  \ 的主要好处是它将 `getData` 签名和 `then` 签名的职责分离开来。还有更多实质性的好处即将呈现。\n\n```javascript\n// 单次调用：'Aramis'\n\
  FictitiousAPI.getData(1)\n  .then(function (data) {\n    console.log(data.name);\n\
  \  });\n```\n\n为了处理在满足 Promise 时发生的错误，可以使用 `catch` 方法，如代码清单 5-24 所示。我们现在有了三个各自处理独立职责的项，而不是之前那种所有职责混杂在一起的回调设计。\n\
  \n```javascript\n// 错误处理（起效）\nFictitiousAPI.getData(5)\n  .then(function (data)\
  \ {\n    console.log(data.name);\n  })\n  .catch(function (error) {\n    console.log('捕获到\
  \ ' + error);\n  });\n```\n\n为了更好地展示这些好处，完整的 Promise 链如代码清单 5-25 所示。这段代码的嵌套最少（最多两层，而之前使用带错误处理的回调版本有五层嵌套）。每个\
  \ `then` 函数都相对容易理解，并且所有异常处理都包含在单个 `catch` 中。\n\n```javascript\nFictitiousAPI.getData(1)\n\
  \  .then((data) => {\n    console.log(data.name);\n    return FictitiousAPI.getData(2);\n\
  \  })\n  .then((data) => {\n    if (data.name == 'Athos') {\n      console.log(data.id\
  \ + ' ' + data.name);\n    } else {\n      console.log(data.name);\n    }\n    return\
  \ FictitiousAPI.getData(3);\n  })\n  .then((data) => {\n    console.log(data.name);\n\
  \    return FictitiousAPI.getData(4);\n  })\n  .then((data) => {\n    console.log(data.name);\n\
  \    return FictitiousAPI.getData(5);\n  })\n  .catch((error) => {\n    console.log('捕获到\
  \ ' + error);\n  });\n```\n\n更新后程序的输出与之前相同，但程序更易于阅读。\n\n```\n==== 输出 ====\nAramis\n\
  2 Athos\nPorthos\nD'Artagnan\n捕获到 没有匹配的记录\n```\n\n虽然这个例子使用了单个 `catch`，但为了重现原始回调示例的行为，如果你希望在链的后续处理中继续执行，可以在链中更早的位置插入额外的\
  \ `catch` 块来提前处理错误。Promise 在这方面非常灵活。\n\n即使在嵌套和错误处理方面，Promise 也完全胜过回调，但 Promise 还有一些其他回调根本无法实现的好处。\n\
  \n### 多个 Promise\n\n链式调用多个 Promise 的另一种方式是，使用一个负责从各个子 Promise 获取值的包装 Promise 来聚合它们的结果。Promise\
  \ 内建了一种机制，可以通过简单调用 `Promise.all` 来实现这一点。\n\n代码清单 5-26 展示了将代码清单 5-25 中的 Promise 链折叠成对\
  \ `Promise.all` 的调用。一旦所有 Promise 都被敲定（settled），`then` 块就会接收结果并执行。如果有任何错误，会立即调用 `catch`\
  \ 块；这是一种快速失败（fail-fast）机制。这是表达你的代码需要兑现所有 Promise 才能继续执行的好方法。\n\n```javascript\n\
  Promise.all([\n  FictitiousAPI.getData(1),\n  FictitiousAPI.getData(2),\n  FictitiousAPI.getData(3),\n\
  \  FictitiousAPI.getData(4)\n]).then((values) => {\n  for (let val of values) {\n\
  \    console.log(val.name);\n  }\n}).catch((error) => {\n  console.log('捕获到 ' +\
  \ error);\n});\n```\n\n无论每个单独的 Promise 需要多长时间才能兑现，传递给 `then` 块的值将按照传入的 Promise 顺序排序。就代码清单\
  \ 5-26 而言，结果将始终按 Aramis、Athos、Porthos、D’Artagnan 的顺序排列，即使异步操作以不同的顺序成功完成也是如此。\n\n\
  \n\n#### 最快的 Promise\n\n如果你在调用多个异步操作，并且只关心获取最快的那个结果，可以使用 `Promise.race` 方法。\n\n\
  清单 5-27 展示了在 Promise 竞赛中使用到的清单 5-25 的 Promise 链。第一个落定的 Promise 会导致整个竞赛也落定，其结果要么是那个最快\
  \ Promise 的兑现值，要么是其拒绝原因。即使第一个结果立即可用，但在后台，其他操作仍会继续，这意味着，即使你的竞赛已有胜者，这些操作依然会消耗资源。\n\
  \n```\nPromise.race([\nFictitiousAPI.getData(1),\nFictitiousAPI.getData(2),\nFictitiousAPI.getData(3),\n\
  FictitiousAPI.getData(4)\n]).then((data) => {\nconsole.log(data.name);\n}).catch((error)\
  \ => {\nconsole.log('Caught ' + error);\n});\n清单 5-27.\n最快的 Promise\n```\n\nPromise\
  \ 提供了一种优越的机制来处理异步链、减少嵌套，并简化且标准化错误处理。还有一些有用的标准 Promise 组合方法，允许你同时发起多个异步操作，并在所有 Promise\
  \ 都兑现后，收敛到一个单一的 `then` 块中。\n\nPromise 正逐渐成为处理异步 API 的事实标准机制，浏览器也将基于 Promise 实现特性的改进。例如，清单\
  \ 5-28 中展示的 `XMLHttpRequest` 机制，很可能会被一个用于执行相同操作的、基于 Promise 的 `fetch` API 所取代。\n\
  \n```\nconst request = new XMLHttpRequest();\nrequest.onload = function() {\nif\
  \ (request.status !== 200) {\n// 状态码不太可能被使用，例如重定向\nconsole.log('Status Code:', request.status);\n\
  return;\n}\nconst data = JSON.parse(request.responseText);\nconsole.log(data);\n\
  };\nrequest.onerror = (error) => {\n// 网络故障或状态码是错误\nconsole.log('Error making request:\
  \ ', error);\n};\nrequest.open('get', './api/musketeers.json', true);\nrequest.send();\n\
  清单 5-28.\nXMLHttpRequest\n```\n\n与之等价的 `fetch` API 如清单 5-29 所示。尽管在撰写本文时此特性仍处于实验阶段，但其引入已迫在眉睫。请注意，最终的规范可能与这个示例有所不同。\n\
  \n```\nfetch('./api/musketeers.json')\n.then((response) => {\nif (response.status\
  \ !== 200) {\n// 状态码不太可能被使用，例如重定向或错误\nconsole.log('Status Code:', response.status);\n\
  return;\n}\nreturn response.json();\n}).then((data) => {\nconsole.log(data);\n})\n\
  .catch((error) => {\n// 例如网络故障\nconsole.log('Error making request', error);\n});\n\
  清单 5-29.\nFetch API\n```\n\n随着 Promise 模式越来越为人熟知，像 `Fetch` API 这样的变化将使交互变得更加熟悉和可预测。与几乎总是让程序员需要再次查阅文档的\
  \ `XMLHttpRequest` 不同，你可以通过 `Fetch` API 直接遵循模式来操作，因为它仅仅是一个 Promise 链。你可以期待任何提供异步操作的\
  \ API 都会有类似的改进。\n\n### 事件\n\n事件是 JavaScript 运行时的一个基本概念，因此它也是所有 TypeScript 程序员非常感兴趣的部分。事件监听器通常被附加到用户发起的事件上，例如网页中的触摸、点击、按键以及其它交互，但事件也可以作为一种机制，用于解耦需要触发处理的代码与执行实际工作的代码。\n\
  \n事件在两个不同的阶段处理——捕获阶段和冒泡阶段。\n\n1.  在捕获阶段，事件首先被发送到文档层次结构中最顶层的元素，然后发送到嵌套更深的元素。\n2.\
  \  在冒泡阶段，事件首先被发送到目标元素，然后发送到其祖先元素。\n\n事件阶段作为事件参数的一个属性提供，可以通过 `e.eventPhase` 来访问，其中你的事件参数名为\
  \ `e`。\n\n即使冒着过度强调在单线程事件循环中运行这一观点的风险，也值得牢记，附加到同一事件的多个事件监听器将会顺序执行，而非并行执行，并且一个长时间运行的监听器可能会延迟附加到同一事件的后续监听器的执行。当一个事件被触发时，每个事件监听器都会按照其被附加的顺序进入队列；如果第一个监听器需要\
  \ 2 秒才能运行完毕，第二个监听器至少会被阻塞 2 秒，并且只有在其到达事件队列顶端时才会执行。\n\n```\nclass ClickLogger {\n\
  constructor() {\ndocument.addEventListener('click', this.eventListener);\n}\neventListener(e:\
  \ Event) {\n// 3（冒泡阶段）\nconst phase = e.eventPhase;\nconst tag = (e.target).tagName;\n\
  console.log(`Click event in phase ${phase} detected on element ${tag} by ClickLogger.`);\n\
  }\n}\nconst clickLogger = new ClickLogger();\n清单 5-30.\n事件监听器\n```\n\n清单 5-30 展示了一个类，它将其方法之一\
  \ `eventListener` 附加到文档的 `click` 事件上。当与清单 5-31 中的 HTML 页面结合使用时，这个 `ClickLogger`\
  \ 类将根据被点击的元素输出消息，例如：\n\n-   `Click event detected on element DIV by ClickLogger.`\n\
  -   `Click event detected on element P by ClickLogger.`\n-   `Click event detected\
  \ on element BLOCKQUOTE by ClickLogger.`\n-   `Click event detected on element FOOTER\
  \ by ClickLogger.`\n\n```\nEvent Demo\n\nClicking on different parts of this document\
  \ logs appropriate messages.\n\nAny fool can write code that a computer can understand.\n\
  Good programmers write code that humans can understand.\n\n-Martin Fowler\n\n清单\
  \ 5-31.\n示例文档\n```\n\n注意\n\n添加事件监听器的正确方式是调用 `addEventListener`。版本 9 之前的 Internet\
  \ Explorer 使用另一种 `attachEvent` 方法。你可以使用清单 5-32 中展示的自定义 `addEventCrossBrowser` 函数来针对这两种附加事件的方法。该函数的改进版本将在第\
  \ 5 章中出现。\n\n```\nfunction addEventCrossBrowser(element, eventName, listener) {\n\
  if (element.addEventListener) {\nelement.addEventListener(eventName, listener, false);\n\
  } else if (element.attachEvent) {\nelement.attachEvent('on' + eventName, listener);\n\
  }\n}\nclass ClickLogger {\nconstructor() {\naddEventCrossBrowser(document, 'click',\
  \ this.eventListener);\n}\neventListener(e: Event) {\n// 3（冒泡阶段）\nconst phase =\
  \ e.eventPhase;\nconst tag = (e.target).tagName;\nconsole.log('Click event detected\
  \ on element ' + tag + ' by ClickLogger.');\n}\n}\nconst clickLogger = new ClickLogger();\n\
  清单 5-32.\n跨浏览器事件\n```\n\n你不必局限于任何给定运行时中有限的支持事件列表；你也可以监听并派发自己的自定义事件。\n\n\n\n### TypeScript\
  \ 的自定义事件机制\n\n清单 5-33 展示了自定义事件机制。在某些环境中，只需使用`addEventListener`和`dispatchEvent`即可实现。你可以将自定义数据作为事件的一部分传递，供监听器使用。\n\
  \n```javascript\n// Polyfill for CustomEvent:\n// https://developer.mozilla.org/en/docs/Web/API/CustomEvent\n\
  (function () {\nfunction CustomEvent(event, params) {\nparams = params || { bubbles:\
  \ false, cancelable: false, detail: undefined };\nconst evt = document.createEvent('CustomEvent');\n\
  evt.initCustomEvent(event, params.bubbles, params.cancelable, params.detail);\n\
  return evt;\n};\nCustomEvent.prototype = (window).Event.prototype;\n(window).CustomEvent\
  \ = CustomEvent;\n})();\n// Fix for lib.d.ts\ninterface StandardEvent {\nnew(name:\
  \ string, obj: {}): CustomEvent;\n}\nvar StandardEvent = CustomEvent;\n// Code for\
  \ custom events is below:\nenum EventType {\nMyCustomEvent\n}\nclass Trigger {\n\
  static customEvent(name: string, detail: {}) {\nconst event = new StandardEvent(name,\
  \ detail);\ndocument.dispatchEvent(event);\n}\n}\nclass ListeningClass {\nconstructor()\
  \ {\ndocument.addEventListener(\nEventType[EventType.MyCustomEvent],\nthis.eventListener,\n\
  false);\n}\neventListener(e: Event) {\nconsole.log(EventType[EventType.MyCustomEvent]\
  \ + ' detected by ClickLogger.');\nconsole.log('Information passed: ' + (e).detail.example);\n\
  }\n}\nvar customLogger = new ListeningClass();\nTrigger.customEvent(\nEventType[EventType.MyCustomEvent],\n\
  {\n\"detail\": {\n\"example\": \"Example Value\"\n}\n}\n);\n```\n\n**清单 5-33. 自定义事件**\n\
  \n你可以选择使用事件，或编写事件代码（例如清单 5-13 中的简单观察者模式），以便在程序中分发工作负载。\n\n### 事件阶段\n\n事件会沿着一条从文档根节点到目标元素的传播路径被派发到事件目标。沿着这条路径从根节点到目标元素的每一次推进，都属于事件的捕获阶段，该阶段编号为\
  \ 1。接着，事件到达事件目标，阶段变为目标阶段，编号为 2。最后，事件在冒泡阶段从事件目标沿反向路径流回根节点，该阶段编号为 3。\n\n这些事件阶段如图 5-4\
  \ 所示。引用块中的其他元素不属于根节点与事件目标之间的层级结构，因此它们不在传播路径中。\n\n![A323824_2_En_5_Fig4_HTML.jpg](img/A323824_2_En_5_Fig4_HTML.jpg)\n\
  \n**图 5-4. 事件阶段**\n\n事件为解耦程序中的代码提供了强大的机制。如果你通过触发事件来执行操作，而不是直接调用代码，那么将操作分解为多个单一职责的小型事件监听器就会变得很简单。此外，后续添加更多监听器也是一件轻而易举的事。\n\
  \n## 扩展对象\n\n在 JavaScript 中，几乎所有东西都是对象，这些对象由一组属性组成。每个属性都是一个键值对，键为字符串，值可以是任意类型，包括基本类型、对象和函数。如果值是函数，通常被称为方法。在\
  \ TypeScript 中创建类时，它由 JavaScript 对象表示，但还有许多内置对象可供使用。\n\n所有原生对象都是开放的，这意味着你可以像扩展自己的对象一样轻松地扩展它们。在扩展原生对象时需要谨慎，原因如下：\n\
  \n- 如果每个人都扩展原生对象，这些扩展很可能会相互覆盖，或以不兼容的方式组合。\n- 原生对象的定义将来有可能与你定义的冲突，并且你的实现会隐藏原生实现。\n\
  \n因此，虽然扩展原生对象是可行的，但通常只建议将其作为一种 polyfill 技术来使用，这是一种为较旧的运行时环境添加当前功能的方法。尽管你可能决定遵循不那么严格的规则，但最好还是以\
  \ polyfill 的风格来编写原生对象扩展，这样至少能检测到以下情况之一的发生：\n\n- 原生的功能被添加时，其名称与你的扩展冲突。\n- 其他程序员添加了同名的另一个扩展。\n\
  - 第三方库或框架添加了同名的扩展。\n\n尤其是第三点说明，如果你的程序要作为库供其他程序员使用，那么就不应该编写原生对象扩展。如果库作者经常扩展原生对象，发生冲突的可能性会很高，而获胜者将只是最后加载的那个扩展，因为它会覆盖所有之前的扩展。\n\
  \n**注意**\n\n术语 polyfill（源自一种名为 Polyfilla 的墙面抹平与裂缝填充水泥）由 Remy Sharp（Remy Sharp 的博客，[`http://remysharp.com/2010/10/08/what-is-a-polyfill/`](http://remysharp.com/2010/10/08/what-is-a-polyfill/)，2010\
  \ 年）创造，用于描述一种在原生实现可用时优先使用原生实现，否则便添加缺失原生行为的技术。例如，你会尝试在浏览器中检测某个特性，如果缺失则仅补充该特性。\n\n\
  \n\n### 扩展原型\n\n在清单 5-34 中，原生 `NodeList`（它包含一个 HTML 元素列表）被扩展，增加了一个 `each` 方法，用于为列表中的每个元素执行一个回调函数。该扩展被添加到\
  \ `NodeList.prototype` 上，这意味着所有 `NodeList` 实例都可以使用它。调用 `document.querySelectorAll`\
  \ 会返回一个包含匹配元素的 `NodeList`，现在可以使用 `each` 方法，通过 `getParagraphText` 函数来显示每个元素的内容。使用\
  \ `each` 方法意味着 `for` 循环只需在一个地方定义。\n\n`call` 方法并非将每个元素作为参数传入回调函数，而是将元素绑定到函数的上下文，这意味着\
  \ `getParagraphText` 函数可以使用 `this` 关键字来引用该元素。\n\n```\nNodeList.prototype.each =\
  \ function (callback) {\nfor (let node of this) {\ncallback.call(node);\n}};\nconst\
  \ getParagraphText = function () {\nconsole.log(this.innerHTML);\n};\nconst paragraphs\
  \ = document.querySelectorAll('p');\nparagraphs.each(getParagraphText);\n清单 5-34.\n\
  在 JavaScript 中扩展对象\n```\n\n当你将此代码添加到 TypeScript 程序中时，会产生错误，警告你 `each` 方法在 `NodeList`\
  \ 接口上不存在。你可以在程序中为该接口添加声明来消除这些错误并获得智能的自动补全功能，如清单 5-35 所示。这样做还有一个额外的好处：如果原生对象的更新与你的扩展发生冲突，TypeScript\
  \ 编译器会警告你存在重复的声明。\n\n```\ninterface NodeList {\neach(callback: () => any): void;\n\
  }\nNodeList.prototype.each = function (callback) {\nfor (let node of this) {\ncallback.call(node);\n\
  }\n};\nconst getParagraphText = function () {\nconsole.log(this.innerHTML);\n};\n\
  const paragraphs = document.querySelectorAll('p');\nparagraphs.each(getParagraphText);\n\
  清单 5-35.\n在 TypeScript 中扩展对象\n```\n\n在这个例子中，`each` 方法内的 `this` 关键字没有类型信息，因为它无法被推断出来。这个问题可以按照清单\
  \ 5-36 所示进行改进。通过将元素从上下文 `this` 关键字移到参数中，程序中的自动补全和类型检查得到了改进。这也意味着该函数可以更容易地被复用。`NodeList`\
  \ 和通用的 `NodeListOf` 接口都被扩展了，以提供尽可能严密的类型检查。\n\n```\ninterface NodeList {\neach(callback:\
  \ (element: HTMLElement) => any): void;\n}\ninterface NodeListOf {\neach(callback:\
  \ (element: TNode) => any): void;\n}\nNodeList.prototype.each = function (callback:\
  \ (elem: HTMLElement) => any) {\nfor (let node of this) {\ncallback.call(node, node);\n\
  }\n};\nconst getParagraphText = function (elem: HTMLParagraphElement) {\nconsole.log(elem.innerHTML);\n\
  };\nconst paragraphs = document.querySelectorAll('p');\nparagraphs.each(getParagraphText);\n\
  清单 5-36.\n改进后的 TypeScript 对象扩展\n```\n\n为了使这个解决方案更像一个 polyfill，代码应该在添加 `each` 方法之前检查它是否已经存在。这就是你如何添加一个计划中但目标运行时尚未提供的过渡性特性。你可以在清单\
  \ 5-37 中看到实际应用。\n\n```\nif (!NodeList.prototype.each) {\nNodeList.prototype.each\
  \ = function (callback: (elem: HTMLElement) => any) {\nfor (let node of this) {\n\
  callback.call(node, node);\n}\n};\n}\n清单 5-37.\n将扩展转变为 polyfill\n```\n\n通过原型扩展对象是一种可用于\
  \ TypeScript 中任何对象的技术，包括你自己创建的对象，除非该对象被密封。扩展原型是一种为受你控制的对象添加行为的复杂方法。你可能会倾向于使用该技术来扩展你所使用的库，因为这样你以后就可以升级该库，而不会丢失你自己的添加项。\n\
  \n### 密封对象\n\n如果你担心自己的代码被扩展，可以使用 `Object.seal` 来防止你的实例被扩展。清单 5-38 展示了其他人可能对你的代码进行的典型扩展，清单\
  \ 5-39 展示了如何防止这种情况。`Object.seal` 阻止添加新属性，并将所有现有属性标记为不可配置。但仍然可以修改现有属性的值。\n\n```\n\
  class Lemur {\nconstructor(public name: string) {\n}\n}\nconst lemur = new Lemur('Sloth\
  \ Lemur');\n// 新属性\nlemur.isExtinct = true;\n// true\nconsole.log(lemur.isExtinct);\n\
  清单 5-38.\n扩展后的实例\n```\n\n```\nclass Lemur {\nconstructor(public name: string) {\n\
  }\n}\nconst lemur = new Lemur('Sloth Lemur');\nObject.seal(lemur);\n// 新属性\nlemur.isExtinct\
  \ = true;\n// undefined\nconsole.log(lemur.isExtinct);\n清单 5-39.\n密封实例\n```\n\n\
  你可以使用 `Object.isSealed` 方法来检查一个对象是否被密封，传入要检查的对象即可。还有一系列有用的类似操作 —— 每个操作都可以用在清单 5-38\
  \ 中替换 `Object.seal` 调用，以获得以下示例中描述的结果：\n\n*   `Object.preventExtensions` / `Object.isExtensible`\
  \ 是比 `Object.seal` 更宽松的版本，允许删除属性以及向原型添加属性。\n*   `Object.freeze` / `Object.isFrozen`\
  \ 是比 `Object.seal` 限制性更强的替代方案，它阻止添加或删除属性，并且也阻止更改值。\n\nMark Daggett 所著的 *Expert JavaScript*\
  \ (Apress, 2013) 一书中，对创建、扩展和密封 JavaScript 对象有极好的概述。\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\
  \n\n### 扩展的替代方案\n\n如果只是建议不要扩展原生对象，却不提供解决问题的替代方案，那是不负责任的。本节展示了一个在现代浏览器中 HTML 元素可用的\
  \ `classList` 属性示例。首先展示了 polyfill，然后提供了一个使用外观模式（façade）来在原生 `classList` 或替代版本之间调用的替代方案。\n\
  \n清单 5-40 展示了一个从元素中检索类列表的调用，该调用在旧版浏览器中会失败。`classList` API 实际上提供了添加、移除和切换类的方法——但本例仅演示了检索类名数组的功能。\n\
  \n```\nconst elem = document.getElementById('example');\nconsole.log(elem.classList);\n\
  清单 5-40.\n使用原生 classList\n```\n\n针对此功能可能缺失的一种常见解决方案是使用 polyfill。清单 5-41 展示了一个简单的\
  \ polyfill，它检测 `classList` API 是否存在，然后将其添加到 `HTMLElement` 或 `Element` 的原型上。替换函数将类名字符串拆分成一个数组，或者在没有类名时返回一个空数组。\n\
  \n```\nif (typeof document !== \"undefined\" && !(\"classList\" in document.documentElement))\
  \ {\nconst elementPrototype = (HTMLElement || Element).prototype;\nif (elementPrototype)\
  \ {\nObject.defineProperty(elementPrototype, 'classList', {\nget: function () {\n\
  const list = this.className ? this.className.split(/\\s+/) : [];\nconsole.log('Polyfill:\
  \ ' + list);\n}\n});\n}\n}\nconst elem = document.getElementById('example');\nconsole.log(elem.classList);\n\
  清单 5-41.\nClassList Polyfill\n```\n\n尽管在这个特定场景下使用 polyfill 是正确的解决方案（因为它与原生行为高度匹配，并且通过安全检查确保不会覆盖已存在的原生实现），但审视替代设计也很有价值。在许多情况下，清单\
  \ 5-42 中的解决方案是更稳定的选择，因为它永远不会与原生或库代码冲突。这种方法的缺点是必须修改调用代码以引用外观模式。\n\n```\nclass Elements\
  \ {\nstatic getClassList(elem: HTMLElement) {\nif ('classList' in elem) {\nreturn\
  \ elem.classList;\n}\nreturn elem.className ? elem.className.split(/\\s+/) : [];\n\
  }\n}\nconst elem = document.getElementById('example');\nconsole.log(Elements.getClassList(elem));\n\
  清单 5-42.\nClassList 外观模式\n```\n\n除了比 polyfill 隔离性更好之外，外观模式还有一个主要优点。这段代码的意图非常清晰。在维护代码时，`Elements`\
  \ 类中更简洁、更直接的方法始终比 polyfill 更胜一筹。清晰且可维护的代码总是比巧妙但复杂的解决方案更可取。\n\n## 总结\n\nJavaScript\
  \ 运行时以其古怪和出人意料的行为而闻名，但总体而言，TypeScript 编译器会帮您避开大多数常见错误。使用块级变量声明并保持全局作用域清晰，将有助于编译器为您提供帮助，因此值得使用\
  \ TypeScript 的结构化特性（例如类）以及模块或命名空间来封装函数和变量。\n\n您的多数代码将在单个线程上执行，而回调和 Promise 都有助于在长时间运行的操作期间避免阻塞该线程。Promise\
  \ 比回调更具可读性，并有助于分离不同的关注点。保持函数简短不仅使您的程序更易于维护，还可以使您的程序响应更迅速，因为每次调用函数时，它都会被添加到事件队列的末尾，运行时就有机会在处理队列中最旧的条目之前处理它，避免其等待过久。\n\
  \n您可以监听原生事件并创建自定义事件，也可以使用观察者模式在程序中分发和监听自定义事件。\n\n您可以扩展对象，包括原生对象，但使用中介代码（mediating\
  \ code）来编排调用通常更为合适，以避免与其他库或原生代码的未来扩展发生冲突。您可以通过密封、冻结或阻止扩展来防止对您自己的对象进行扩展。\n\n## 要点\n\
  \n*   避免使用函数作用域的 `var` 关键字，因为 TypeScript 即使对于旧版本的 JavaScript 也能提供块级变量。\n*   回调可以帮助避免阻塞主线程。\n\
  *   无论是使用原生事件还是您自己的发布者，事件都可以防止紧耦合。\n*   您可以扩展所有 JavaScript 对象，而且 JavaScript 中几乎一切都是对象。\n\
  *   您可以密封或冻结对象以防止进一步更改。\n*   您可以通过 polyfill 缺失的行为，在旧平台上使用新功能。\n\n"
- "# 6. 在浏览器中运行 TypeScript\n\n> 所有现代 web 浏览器——包括桌面电脑、游戏机、平板电脑和智能手机——都包含 JavaScript\
  \ 解释器，这使得 JavaScript 成为历史上最普及的编程语言。 ——David Flanagan\n\n尽管 TypeScript 程序可能面向许多不同的运行环境，但其中最广泛的一类运行时无疑是\
  \ web 浏览器。本章在介绍与网页交互、向 web 服务器发起异步请求、在用户本地机器上存储数据以及访问硬件传感器的实用示例之前，先介绍 web 浏览器的一般设计。本章末尾提供了关于模块化程序以及按需加载模块的信息。\n\
  \n注意：本章描述的部分功能是实验性的，并且浏览器的支持有限。要了解哪些浏览器支持特定功能，请访问 Alexis Deveria 的 “Can I use” 项目（\
  \ [`http://caniuse.com/`](http://caniuse.com/) ，2014）。\n\n\n\n## 网页浏览器架构剖析\n\n从\
  \ 1990 年代简单的文档展示，到今天功能完备的应用环境与 3D 游戏显示，网页浏览器的发展可谓日新月异。随着视频、音频、游戏等内容与文档、图片、应用程序一同融入浏览器中的`HTML`文档，对插件、小程序和下载功能的依赖正在迅速减少。\n\
  \n如果你的程序需要依赖浏览器工作，那么对浏览器有所了解是值得的。但如果浏览器相关细节以及某些重要特性的历史并未让你感到兴奋，或者你已对浏览器了如指掌，可以直接跳转到下一节进行更多实践操作。若想进一步了解浏览器的工作原理，请继续阅读。\n\
  \n网页浏览器通常由如图 6-1 所示的组件构成：\n\n*   用户界面\n*   浏览器引擎\n*   渲染引擎\n*   部件引擎\n*   JavaScript\
  \ 解释器\n*   网络\n*   存储\n\n用户界面包括所有浏览器窗口上出现的按钮和文本框，例如地址栏、后退和前进按钮以及刷新按钮。浏览器引擎和渲染引擎负责处理内容显示，占据了浏览器显示区域的主体部分。部件引擎为用户界面和渲染引擎提供公共用户控件，如文本输入框、下拉列表和按钮。\n\
  \n![A323824_2_En_6_Fig1_HTML.jpg](img/A323824_2_En_6_Fig1_HTML.jpg)\n\n图 6-1. 网页浏览器组件\n\
  \n要显示网页，浏览器引擎依靠渲染引擎来呈现`HTML`以及层叠样式表（`CSS`）中定义的相应样式，或者用户自定义覆盖的页面样式。渲染引擎通过网络获取网页、样式表、JavaScript\
  \ 文件和图片等资源。当需要用户交互组件（如文本框）时，会使用部件引擎。JavaScript 解释器运行下载的 JavaScript 代码，进而可能访问存储、网络以及其他可用的应用程序编程接口（`API`）。\n\
  \n总的来说，用户界面、浏览器引擎、渲染引擎和部件引擎工作出色，你无需了解所有细节；但有一个例外是称为“回流”的过程，它可能影响你程序的感知性能。\n\n###\
  \ 回流与帧率\n\n每次网页布局被 JavaScript 或 `CSS` 修改时，布局会被标记为无效，但不会立即更新。回流会重新计算文档中所有元素的大小和位置，通常发生在页面绘制之前。如果\
  \ JavaScript 代码在布局被标记为无效时请求元素的大小或位置，则会触发额外的回流。需要这个额外的回流来确保提供的大小或位置信息是最新的。\n\n列表\
  \ 6-1 展示了一个典型回流问题的函数，它两次使布局无效并导致两次回流。每次对文档设置可能影响布局的值时，布局都会被标记为无效。每次在布局无效时从文档检索值，都会触发回流。虽然列表中的示例导致了两次回流，但如果重复这种错误，可能会导致更多次回流。回流会拖慢你的程序和需要等待重渲染的页面。\n\
  \n```javascript\nconst image = document.getElementById('mainImage');\nconst container\
  \ = document.getElementById('content');\nfunction updateSizes() {\n  // 标记布局为无效\n\
  \  image.style.width = '50%';\n  // 触发一次回流以获取值\n  const imageHeight = image.offsetHeight;\n\
  \  // 标记布局为无效\n  container.classList.add('highlight');\n  // 触发一次回流以获取值\n  const\
  \ containerHeight = container.offsetHeight;\n  return {\n    'imageHeight': imageHeight,\n\
  \    'containerHeight': containerHeight\n  };\n}\nconst result = updateSizes();\n\
  ```\n\n*列表 6-1. 触发多次回流*\n\n通过在从文档检索任何值之前执行使布局无效的操作，可以避免多次回流，如列表 6-2 所示。通过将使布局无效的操作集中在函数开头，且在所有需要回流的操作之前，我们可以减少函数执行过程中所需的总回流次数。\n\
  \n```javascript\nconst image = document.getElementById('mainImage');\nconst container\
  \ = document.getElementById('content');\nfunction updateSizes() {\n  // 使布局无效的操作\n\
  \  image.style.width = '50%';\n  container.classList.add('highlight');\n  // 需要回流的操作\n\
  \  const imageHeight = image.offsetHeight;\n  const containerHeight = container.offsetHeight;\n\
  \  return {\n    'imageHeight': imageHeight,\n    'containerHeight': containerHeight\n\
  \  };\n}\nconst result = updateSizes();\n```\n\n*列表 6-2. 触发单次回流*\n\n通过对这两个示例分别进行循环，每\
  \ 200 毫秒运行一次，可以进行基本测试。虽然两者几乎没有差异，但具有多次回流的第一个版本将刷新率降低到 53 帧/秒，而第二个版本则保持了 57 帧/秒（在我用来测试此代码的计算机上，静态网页的渲染速度为\
  \ 59 帧/秒）。\n\n唯一迫使你必须使用多次回流的情况是，在进行更改后需要获取测量值：例如，在更改元素内容后找到其宽度，然后使用该宽度重新定位元素，这在不回流的情况下无法完成。你仍然可以仔细规划操作，将总回流次数减少到尽可能少。\n\
  \n在测量基于浏览器的程序时，帧率指标是衡量 Web 应用程序感知响应能力的一个良好指标。此测量值可在浏览器工具中找到。\n\n### 有趣的组件\n\n在涉及\
  \ TypeScript 时，JavaScript 解释器以及网络和存储 `API` 是浏览器中最有趣的组件。以下各节将更详细地描述每个组件。\n\n\n\n\
  ## JavaScript 解释器\n\nJavaScript 解释器，也被称为 JavaScript 引擎，承担着大量工作。它不仅要解析和执行 JavaScript\
  \ 程序，还需管理对象和内存、处理事件循环，并与存储、网络、传感器等 API 进行交互。\n\n在浏览器中进行 JavaScript 编程之所以如此有趣（有时也令人沮丧），原因之一在于你会遇到许多不同的\
  \ JavaScript 解释器。在极少数情况下，你甚至可能遇到没有解释器的情况，导致程序无法运行。由于需要支持多种解释器，测试工作量随之增加，因为你必须检查程序在每个\
  \ Web 浏览器中是否都能正常工作。然而，解释器众多也有其优点。其中一个优点是，浏览器厂商都希望宣称自家实现的 JavaScript 引擎速度最快；因此，当它们为争夺榜首位置而竞争时，解释器的运行速度也在不断提升。\n\
  \n在依赖这些不同的解释器来运行程序时，需要主要关注以下几点：\n\n*   它们可能仅支持较旧版本的 ECMAScript 标准。\n*   它们可能会实现一些不属于\
  \ ECMAScript 规范的附加功能。\n*   它们运行相同代码的速度不同，尤其是在不同的操作系统上。\n*   你迟早会遇到完全禁用 JavaScript\
  \ 的最终用户。\n\n**注：** 所有主流浏览器的当前版本均支持 ECMAScript 5。所有领先浏览器都支持 ECMAScript 6（或 ECMAScript\
  \ 2015），但 Internet Explorer 和许多小众浏览器除外。在撰写本文时，仅 Firefox 完全支持 ECMAScript 2016，而 Chrome、Opera\
  \ 和 Edge 对该标准的支持程度在 75% 到 95% 之间。下一组候选推荐标准获得的支持非常有限。请记住：TypeScript 的低版本编译功能允许你使用许多新特性，同时将代码编译为目标\
  \ ECMAScript 5 或 6。\n\n## 网络技术简史\n\nWeb 浏览器中网络技术的发展经历了多个阶段。最早用于更新部分网页（无需替换整个文档）的机制是使用框架集（frameset）。框架集是\
  \ HTML 3.0 规范的一项提议。网站通常采用三分框架集布局，分别用于页眉、导航和内容。当在导航框架中点击一个链接时，内容框架会被替换为一个新的网页，而无需重新加载页眉或导航。框架集的双重目的是：允许部分显示区域独立更新，并允许在无需服务器端处理的情况下包含可重用的组件（如页眉和导航）。\n\
  \n框架集的一个主要问题是，当用户导航时，页面的网址不会更新，因为无论框架集中的框架内显示的是哪个页面，用户看到的仍然是框架集本身。当用户收藏页面或分享页面链接时，无法回到他们导航到的显示状态，而只会显示网站的首页。此外，框架集还会给屏幕阅读器和纯文本浏览器带来各种问题。\n\
  \n替代框架集的是内联框架（`iframe` 元素）。内联框架被放置于另一个文档的 body 中，可以独立更新。虽然仍有可能以类似框架集问题的方式使用 `iframe`，但\
  \ `iframe` 确实提供了一个非常有用的新特性。\n\n在 JavaScript 具备网络能力之前，一些富有进取心和创造力的程序员会使用 `iframe`\
  \ 来模拟实时更新效果。例如，一个指向服务器生成网页的隐藏 `iframe` 会每隔 10 秒通过计时器刷新一次。一旦页面加载完成，就会使用 JavaScript\
  \ 从该 `iframe` 中抓取新数据，并根据 `iframe` 中的隐藏页面更新可见页面的部分内容。这种机制的架构如图 6-2 所示。\n\n![A323824_2_En_6_Fig2_HTML.jpg](img/A323824_2_En_6_Fig2_HTML.jpg)\n\
  \n**图 6-2.** 通过在 `iframe` 中刷新第二个页面来更新网页\n\n正是这种创造性地使用内联框架将数据从服务器传输到网页的做法，启发了 `XMLHTTP`\
  \ 通信（Internet Explorer 5）以及后来标准化的 `XmlHttpRequest` 的发明。这些异步请求具有革命性意义，因为它们在支持基于 Web\
  \ 的应用程序方面发挥了关键作用。使用异步请求会带来各种复杂问题，本章稍后将详细说明，但其重要性无论如何强调都不为过。\n\n最新进入 Web 浏览器的网络技术是\
  \ WebSocket，它提供了浏览器与服务器之间持久的全双工通信。这允许数据同时在两个方向上进行传输。WebSocket 也将在本章后面进行更详细的讨论。\n\
  \n## 在客户端存储数据\n\n在很长一段时间里，JavaScript 程序可用的存储空间仅限于 Cookie 中那微不足道的几千字节，这些数据可能随时毫无征兆地消失。许多浏览器提供一项设置，可以在每次关闭浏览器时清除所有\
  \ Cookie。充其量，Cookie 只能用于存储一个令牌来保持用户在一段时间内的登录状态，而这对于 Web 应用程序来说，确实也是其唯一的主要用途。\n\n\
  在现代浏览器中，用户机器上的存储选项有多种，从简单的键值对本地存储到 NoSQL 索引数据库，不一而足。即使是初始限制的几兆字节，也可以在获得用户许可的情况下增加。本章稍后将通过具体例子解释存储选项。\n\
  \n在用户机器上存储合理数量的数据，使得本地缓存数据成为可能。这可以加速程序的运行，并减少与服务器之间的往返通信次数。它还允许你的 Web 应用程序在离线状态下运行，并在下次连接到网络时与服务器同步数据。\n\
  \n## 文档对象模型\n\n文档对象模型，简称 DOM，是一个用于与 HTML 和 XML 文档进行交互的 Web 浏览器接口。该接口允许你查找元素、获取和更新其内容及属性的信息，并监听用户事件。如果你的程序在与网页交互，那么你就是在使用\
  \ DOM。\n\n本节中的所有示例均使用清单 6-3 中的 HTML 文档。\n\n```\nRunning in a Browser\n\nRunning\
  \ in a Browser\n```\n\n**清单 6-3.** DOM 示例使用的 HTML 文档\n\n该文档是一个 HTML5 网页，包含一个一级标题和一个\
  \ `id` 为“content”的 div。以下示例的目标是获取对该元素的引用，对其进行修改，并监听其内部生成的事件。\n\n\n\n### 查找元素\n\n\
  与 DOM 最常见的交互之一就是在文档中查找元素。有多种方法可以获取元素，如代码清单 6-4 所示。长期以来，`document.getElementById`\
  \ 一直是获取网页元素的标准方法，在 TypeScript 中，该方法返回一个 `HTMLElement` 类型的对象。虽然这是一种常见的查找元素的方式，但它仅能基于元素的\
  \ `id` 属性来获取。\n\n传统的替代 `document.getElementById` 的方法是 `document.getElementsByTagName`。基于\
  \ `id` 获取元素过于具体；而通过标签名查找元素又通常过于笼统。因此，选择器 API 规范引入了 `document.querySelector` 和 `document.querySelectorAll`\
  \ 方法，允许使用 CSS 查询选择器来查找元素。当存在多个可能匹配的元素时，`document.querySelector` 返回第一个匹配的元素，而 `document.querySelectorAll`\
  \ 返回所有匹配的元素。\n\n```\n// HTMLElement\nconst a = document.getElementById('content');\n\
  // Element\nconst b = document.querySelector('#content');\n// HTMLDivElement (由于类型断言)\n\
  const c = document.querySelector('#content');\n代码清单 6-4.\n查找 DOM 元素\n```\n\n当你使用\
  \ `getElementById` 获取元素时，它将返回通用的 `HTMLElement` 类型。使用 `querySelector` 会得到更通用的 `Element`\
  \ 类型。TypeScript 编译器无法确定返回元素的精确类型。如果你想使用特定元素类型的成员，可以使用类型断言来告诉编译器期望的元素类型。这并不能保证运行时类型正确；它只是为你提供正确的自动补全信息和类型检查。\n\
  \n当你使用 `document.getElementsByTagName` 时，不需要类型断言，因为 TypeScript 使用专门的重载签名，根据你提供的标签名返回正确的类型。如代码清单\
  \ 6-5 所示，返回的 `NodeList` 自动包含 `HTMLDivElement` 类型的元素。\n\n```\n// NodeListOf<HTMLDivElement>\n\
  const elements = document.getElementsByTagName('div');\n// HTMLDivElement\nconst\
  \ a = elements[0];\n代码清单 6-5.\n按 HTML 标签获取元素\n```\n\n你最后会遇到的类型是 `document.querySelectorAll`\
  \ 方法返回的 `NodeListOf<Element>`，如代码清单 6-6 所示。尽管如此，你仍然可以使用类型断言来处理你选择的特定 HTML 元素。\n\n\
  ```\n// NodeListOf<Element>\nvar elements = document.querySelectorAll('#content');\n\
  // Element\nvar a = elements[0];\n// HTMLDivElement\nvar b = elements[0];\n代码清单\
  \ 6-6.\n使用 CSS 选择器获取元素\n```\n\n**注意**\n\n你可能已经注意到，在 DOM 中查找元素的各种方法返回不同类型的对象和不同的集合。这并非\
  \ TypeScript 的特性，而是反映了底层的 DOM 规范。在许多情况下，你比编译器更了解元素，可以使用类型断言使类型更具体。\n\n如果你想避免大量使用类型断言，可以将调用包装在泛型函数中，以编排对\
  \ DOM API 的调用。代码清单 6-7 展示了包装函数，允许你以泛型类型参数的形式提供类型提示。\n\n```\nfunction QueryOf<T>(query:\
  \ string): T {\n  return document.querySelector(query) as T;\n}\nconst elem = QueryOf<HTMLDivElement>('div#content');\n\
  \nfunction QueryAllOf<T>(query: string): NodeListOf<T> {\n  return document.querySelectorAll(query)\
  \ as NodeListOf<T>;\n}\nconst elems = QueryAllOf<HTMLDivElement>('div');\n代码清单 6-7.\n\
  泛型包装函数\n```\n\n使用这些包装函数时，你将收到预期类型的返回值。你可以扩展这些函数以包含元素验证，确保找到的元素是预期的类型。\n\n### 更改元素\n\
  \n一旦你找到了想要更改的一个或多个元素，有几种方法可以更新每个元素的内容。\n\n代码清单 6-8 展示了一个简单的替换，通过提供一个新的 HTML 字符串来替换元素的全部内容。元素现有的内容将被丢弃，取而代之的是你提供的字符串。这种方法有几个缺点：不仅需要在程序中硬编码\
  \ HTML 字符串，而且如果使用此方法插入用户生成或第三方内容，可能存在安全风险。从积极的方面看，这是完全替换元素全部内容的最简单方法。\n\n```\nconst\
  \ element = document.querySelector('#content');\nelement.innerHTML = 'Hello World';\n\
  代码清单 6-8.\n更新元素的 HTML\n```\n\n在许多情况下，你更希望在不丢失现有内容的情况下向元素添加内容，而不是替换其全部内容。代码清单 6-9\
  \ 展示了向内容分区进行多次添加，结果所有新元素都被追加。该清单还展示了使用 `document.createElement` 方法来生成元素，而不是使用字符串。\n\
  \n```\nconst element = document.querySelector('#content');\n// 创建并添加第一个元素\nconst\
  \ newElement1 = document.createElement('div');\nnewElement1.textContent = 'Hello\
  \ World';\nelement.appendChild(newElement1);\n// 创建并添加第二个元素\nconst newElement2 =\
  \ document.createElement('div');\nnewElement2.textContent = 'Greetings Earth';\n\
  element.appendChild(newElement2);\n代码清单 6-9.\n使用 appendChild\n```\n\n当你使用 `element.appendChild`\
  \ 时，最新的元素出现在最后。要将最新元素添加到元素的顶部，可以使用 `element.insertBefore` 方法，如代码清单 6-10 所示。传递给 `insertBefore`\
  \ 的第一个参数是新元素，第二个参数是用于定位新元素的参照元素。在示例中，当前的第一个子元素被用作参照，以确保新元素出现在第一位，但你可以使用相同的方法将新元素放置在\
  \ DOM 中的任何位置。\n\n```\nconst element = document.querySelector('#content');\nconst\
  \ newElement2 = document.createElement('div');\nnewElement2.textContent = 'Greetings\
  \ Earth';\nelement.insertBefore(newElement2, element.firstChild);\n代码清单 6-10.\n\
  使用 insertBefore\n```\n\n如果你计划创建一组嵌套的元素添加到页面中，更高效的做法是在将其添加到 DOM 之前构建整个层级结构。这将确保你只使布局失效一次，从而意味着页面重绘次数更少，以反映你的更改。\n\
  \n\n\n### 事件\n\n添加事件监听器有多种不同的方式，有些浏览器在遵循标准的方法上相对滞后。`addEventListener` 方法是添加 DOM\
  \ 事件监听器的标准方式，不过一些旧版浏览器仍依赖 `attachEvent` 方法（该方法还要求事件名称以 `'on'` 作为前缀）。\n\n为了解决跨浏览器兼容性问题，Remy\
  \ Sharp 创建了一个 `addEvent` 方法。该方法不仅简化了浏览器差异，还允许将元素集合（而不仅仅是单个元素）作为参数传递。清单 6-11 是 Remy\
  \ 原始脚本的改编版本，并为该方法添加了类型信息。\n\n```\nexport const addEvent: (elem: Window | Document\
  \ | Element | NodeListOf,\neventName: string, callback: Function) => void = (function\
  \ () {\nif (document.addEventListener) {\n// 处理现代浏览器\nreturn function (elem, eventName,\
  \ callback) {\nif (elem && elem.addEventListener) {\n// 处理单个元素\nelem.addEventListener(eventName,\
  \ callback, false);\n} else if (elem && elem.length) {\n// 处理元素集合（递归）\nfor (let\
  \ i = 0; i < elem.length; i++) {\naddEvent(elem[i], eventName, callback);\n}\n}\n\
  };\n} else {\n// 处理一些旧版浏览器\nreturn function (elem, eventName, callback) {\nif (elem\
  \ && elem.attachEvent) {\n// 处理单个元素\nelem.attachEvent('on' + eventName, function\
  \ () {\nreturn callback.call(elem, window.event);\n});\n} else if (elem && elem.length)\
  \ {\n// 处理元素集合（递归）\nfor (let i = 0; i < elem.length; i++) {\naddEvent(elem[i], eventName,\
  \ callback);\n}\n}\n};\n}\n})();\n清单 6-11.\n跨浏览器增强事件\n```\n\n`addEvent` 方法的两个主要分支处理了浏览器差异，每个分支内部都进行了检查，以处理单个元素或元素集合。当所有浏览器都支持\
  \ `addEventListener` 方法时，该方法的后半部分将变得多余。\n\n在本章中，任何需要事件的地方都将使用此 `addEvent` 方法。\n\n\
  ### 框架与库\n\n有许多框架和库可以帮助处理所有这些 DOM 交互。以下将简要介绍其中几个，当然还有更多可供选择。Martin Beeby 精彩地总结了这些数量庞大的库。\n\
  \n> 如果你选一个名词，加上 .js 或 .io，你大概就能得到一个库。 — Martin Beeby\n\n尽管库的数量有时令人眼花缭乱，但由于有一个眼光独到且乐于发声的社区，高质量的库往往会脱颖而出。大多数可用的库都可以通过你喜欢的包管理器（如\
  \ NPM）添加到程序中；或者你也可以直接下载脚本并手动添加。对于用纯 JavaScript 编写的第三方库，得益于 Definitely Typed 项目，你通常也能找到匹配的类型定义。\n\
  \n[`http://definitelytyped.org/`](http://definitelytyped.org/)\n\n如果你在使用 Visual\
  \ Studio，Mads Kristensen 开发的 Package Installer 是一个扩展，可以加速你的包管理。图 6-3 显示了 RequireJS\
  \ 的“快速安装包”对话框，图 6-4 展示了如何通过 NPM 上的 `@types` 作用域获取类型定义。\n\n![A323824_2_En_6_Fig4_HTML.jpg](img/A323824_2_En_6_Fig4_HTML.jpg)\n\
  \n图 6-4. 在 Visual Studio 中使用包管理器扩展安装类型定义\n\n![A323824_2_En_6_Fig3_HTML.jpg](img/A323824_2_En_6_Fig3_HTML.jpg)\n\
  \n图 6-3. 在 Visual Studio 中使用包管理器扩展安装库\n\n安装包和类型定义会导致你的 `package.json` 文件自动更新依赖项。你也可以直接编辑\
  \ `package.json` 文件，在 dependencies 或 devDependencies 部分添加额外的包名。\n\n如果你没有使用 Visual\
  \ Studio，也可以在命令行上使用命令 `npm install [library-name] --save` 安装依赖包，或使用 `npm install\
  \ [library-name] --save-dev` 安装仅用于开发的依赖包。开发依赖是指那些你的代码的下游使用者不会需要的包。\n\n对于所有 TypeScript\
  \ 项目，推荐使用 NPM 来获取 JavaScript 库及其类型定义。这种方式既能很好地与 Visual Studio 集成，也能很好地与其他流行的编辑器配合。\n\
  \n当你在网页上查找和更改元素的功能与来自服务器的实时数据相结合时，其能力将变得更加强大。下一节将介绍如何向 Web 服务器发送后台请求以保存和检索信息，而无需重新加载整个网页。\n\
  \n## 网络\n\n自 20 世纪 90 年代末问世以来，AJAX 一直主导着 Web 浏览器中 JavaScript 的网络需求。尽管其地位显赫，但网络领域也出现了一些对基于浏览器的应用程序很有用的新成员。本节介绍从浏览器进行通信的三种主要技术，帮助您挑选最适合您程序需求的方法。\n\
  \n### AJAX\n\nAJAX 代表异步 JavaScript 和 XML（Asynchronous JavaScript and XML）。这个名称并不贴切，因为\
  \ XML 并非唯一使用的数据格式，甚至可能不是最常见的格式。AJAX 请求是通过浏览器中的 JavaScript 发起的。请求被发送到服务器，服务器随后发送一个\
  \ HTTP 响应，其响应体可以是纯文本、JSON、HTML、XML，甚至是自定义格式。\n\nHTTP 请求和响应是异步发生的，这意味着它不会阻塞第 5 章所述的\
  \ JavaScript 事件循环。\n\n\n\n#### HTTP Get\n\n清单 6-12 展示了一个简单的 `Ajax` 类，其中包含一个用于执行\
  \ HTTP GET 请求的公共方法。该方法创建了一个新的 `XMLHttpRequest` 对象，这是发起 AJAX 请求的标准方式。随后，一个回调函数被附加到请求的\
  \ `onreadystatechange` 事件上。该回调在请求转换的每个状态都会被调用，但通常你主要关注的是已完成状态。可能的状态包括：\n\n*   `0`\
  \ — 未初始化\n*   `1` — 已设置，但未发送\n*   `2` — 已发送\n*   `3` — 正在传输\n*   `4` — 完成\n\n清单\
  \ 6-12 中的 `Ajax` 类仅在状态为 `4`（完成）时进行解析，并传递包含响应数据和元数据的 `XMLHttpRequest`。HTTP 状态码可能包含\
  \ W3C（1999）维护的 HTTP 规范中描述的任何代码。\n\n`open` 方法接受请求的 HTTP 动词和 URL。第三个参数设置请求是否为异步。最后，在附加了状态变更监听器并使用\
  \ HTTP 动词和 URL 设置好请求后，可以使用 `send` 方法来开始请求。\n\n```\nexport class Ajax {\nprivate\
  \ readonly READY_STATUS_CODE = 4;\nprivate isCompleted(request: XMLHttpRequest)\
  \ {\nreturn request.readyState === this.READY_STATUS_CODE;\n}\nhttpGet(url: string)\
  \ {\nreturn new Promise((resolve, reject) => {\n// Create a request\nconst request\
  \ = new XMLHttpRequest();\n// Attach an event listener\nrequest.onreadystatechange\
  \ = () => {\nif (this.isCompleted(request)) {\nresolve(request);\n}\n};\n// Specify\
  \ the HTTP verb and URL\nrequest.open('GET', url, true);\n// Send the request\n\
  request.send();\n});\n}\n}\nListing 6-12.\nHTTP Get method\n```\n\n**注意**\n\n应始终将\
  \ AJAX 请求设为异步，并使用回调来执行依赖代码。虽然将请求设为同步看起来很便捷，但这会长时间占用事件循环，导致你的应用程序看起来无响应。这些示例中的 `Ajax`\
  \ 类将原生的 `XMLHttpRequest` 包装在类似 Promise 的接口中。`Fetch API` 为异步 HTTP 请求引入了一个基于 Promise\
  \ 的 API，如第 5 章所述。\n\n#### HTTP Post\n\n清单 6-13 中的示例代码是一个 `httpPost` 方法，可以将其添加到清单\
  \ 6-12 的 `Ajax` 类中。除了将 HTTP 动词改为 `'POST'` 之外，还添加了内容类型请求头，数据在请求体中发送。此示例中的数据必须格式化为键/值对，例如\
  \ `'type=5&size=4'`。要发送包含数据的 JSON 字符串，你需要将内容类型设置为 `'application/json'`。\n\n```\n\
  httpPost(url: string, data: string) {\nreturn new Promise((resolve, reject) => {\n\
  const request = new XMLHttpRequest();\nrequest.onreadystatechange = () => {\nif\
  \ (this.isCompleted(request)) {\nresolve(request);\n}\n};\nrequest.open('POST',\
  \ url, true);\nrequest.setRequestHeader('Content-type', 'application/x-www-form-urlencoded');\n\
  request.send(data);\n});\n}\nListing 6-13.\nHTTP Post method\n```\n\n你可以通过指定适当的\
  \ `Content-type`（例如 `application/json` 或 `application/xml`）并以相应的序列化格式传递数据，来发送不同的数据格式。你仅受服务器端程序接受内容的限制。\n\
  \n你可以在需要进行 HTTP 请求时调用 `Ajax` 类，清单 6-14 中展示了一个示例调用。你还可以扩展 `Ajax` 类来处理其他 HTTP 请求，例如\
  \ `PUT` 和 `DELETE`。\n\n```\nimport { Ajax } from './Listing-6-013';\nvar ajax =\
  \ new Ajax();\n// Making a GET request\najax.httpGet('data.html')\n.then((request)\
  \ => {\ndocument.getElementById('content').innerHTML = request.responseText;\n});\n\
  Listing 6-14.\nUsing the Ajax class\n```\n\n如果你试图向不同域发起 AJAX 请求，你会发现在现代浏览器中该请求会被跨域安全特性阻止。即使在同一个网站的不同子域之间，或者\
  \ HTTP 和 HTTPS 页面之间，你也会遇到这种情况。如果你希望启用跨域请求共享（CORS），并且服务器支持，你可以在 AJAX 请求中添加一个额外的请求头，如清单\
  \ 6-15 所示。此请求头会导致发送一个预检 `OPTIONS` 请求，询问服务器是否接受实际请求；如果服务器确认接受跨域通信，则后续会发出实际请求。\n\n\
  ```\nconst request = new XMLHttpRequest();\nrequest.setRequestHeader('X-Requested-With',\
  \ 'XMLHttpRequest');\n// ...\nListing 6-15.\nAllowing CORS, client side\n```\n\n\
  虽然服务器配置超出了本章的范围，但要使服务器支持 CORS，它必须接受并响应在实际跨域请求之前发出的预检 `OPTIONS` 请求，并返回一个 `Access-Control-Allow-Origin`\
  \ 响应头。此头指示服务器愿意与之通信的域。这充当客户端与服务器之间的握手，以验证跨域通信可以继续进行。\n\n### WebSockets\n\nAJAX 最常见的用途之一就是轮询服务器以检查更新。其一种特定实现是长轮询：发起\
  \ AJAX 请求，但服务器延迟响应，直到它有更新要发送。长轮询实现必须处理超时问题和并发请求限制。长轮询在某些服务器上也可能导致问题，因为等待响应的客户端数量可能会占用大量请求线程。\n\
  \nWebSocket 规范通过建立服务器和客户端之间的持久双向通信通道来解决这个问题，该通道可用于向任一方向发送消息。这意味着你可以随时发送消息，而无需重新建立连接，并且可以以相同的方式接收消息。清单\
  \ 6-16 是一个使用 `ws://` 协议与服务器建立通信、监听消息以及向服务器发送消息的简单示例。\n\n```\nconst webSocket = new\
  \ WebSocket('ws://localhost:8080/WS');\nwebSocket.onmessage = (message: MessageEvent)\
  \ => {\n// Log message from server\nconsole.log(message.data);\n}\nwebSocket.send('Message\
  \ To Server');\nListing 6-16.\nEstablishing a WebSocket connection\n```\n\n当你使用完\
  \ WebSocket 连接后，可以通过调用 `webSocket.close()` 来结束通信。如果你想了解更多关于 WebSocket 的信息，可以阅读 Wang、Salim\
  \ 和 Moskovits 合著的 *The Definitive Guide to HTML5 WebSockets*（Apress, 2013）。\n\n\n\
  \n## 实时通信\n\n网络通信的下一次演进是实时点对点音频和视频流传输。`W3C`（2013 年）正在起草的`WebRTC`规范允许在浏览器之间进行流传输，而无需浏览器插件或额外安装的软件。尽管该规范目前支持有限，但这项技术的潜力令人难以置信。浏览器之间可以实现视频和音频通话，而无需中间通信提供商。\n\
  \n`WebRTC`在多个浏览器中处于实验性支持状态，大多数浏览器使用带有前缀的版本来提供该功能，该版本可能会发生变化。要在 TypeScript 中使用`WebRTC`，你需要扩展库定义以包含这些过渡性的浏览器实现。\n\
  \n`WebRTC`的完整实现超出了本书的范围，但清单 6-17 展示了如何捕获包含视频和音频的媒体流，并将其播放到 HTML 页面上的视频元素中。\n\n```\n\
  const constraints = {\naudio: true,\nvideo: {\nwidth: 1280,\nheight: 720\n}\n};\n\
  const videoElement = document.createElement('video');\nvideoElement.setAttribute('width',\
  \ Math.floor(constraints.video.width / 2).toString());\nvideoElement.setAttribute('height',\
  \ Math.floor(constraints.video.height / 2).toString());\ndocument.body.appendChild(videoElement);\n\
  navigator.mediaDevices.getUserMedia(constraints)\n.then(function (mediaStream) {\n\
  const video = document.querySelector('video');\nvideo.srcObject = mediaStream;\n\
  video.onloadedmetadata = function (e) {\nvideo.play();\n};\n})\n.catch(function\
  \ (error) {\nconsole.log(error.name, error.message);\n});\nListing 6-17.\nDisplay\
  \ a video stream\n```\n\n`getUserMedia` 方法接受约束条件，允许你指定要捕获的流特性。这段脚本的结果通常是程序员满意地看到自己被显示在网页上。\n\
  \n获取视频和音频是建立点对点流的第一步，如果你对这项技术感兴趣，有许多专著深入探讨了这个迷人的主题。尽管是`WebRTC`规范的一部分，`getUserMedia`\
  \ API 在点对点通信之外还有其他潜在用途。你可能希望从视频流中抓取图像用于你的程序，甚至以更传统的方式将流发送到服务器。\n\n网络提供了从本地浏览器与服务器或远程对等端通信所需的工具。下一节将介绍本地存储数据，这可以使你的程序在网络不可用时继续工作。\n\
  \n## 存储\n\n自 Cookie 以来，用户机器上的存储发展迅速，Cookie 有大小限制和糟糕的 API。根据你的需求，有几种可用的存储选项，它们具有不同的生命周期、软限制和\
  \ API，可用于在本地保存数据。\n\n会话存储和本地存储具有相同的 API，但它们的生命周期不同。不过，`IndexedDB` 提供了一种更高级的数据存储机制。以下将对这三种存储\
  \ API 进行描述。\n\n### 会话存储\n\n会话存储依附于页面会话。页面会话在页面打开时开始，即使页面在浏览器标签内被重新加载或恢复，会话也会持续。在单独的标签或浏览器窗口中打开相同的页面，会生成一个新的页面会话。\n\
  \n清单 6-18 展示了会话存储 API 的简单性，可以使用`setItem`方法存储简单的键/值对。键和值都必须是字符串，因此对象需要序列化为字符串才能存储。\n\
  \n```\nconst storageKey = 'Example';\n// 第一次为 null，之后每次为 'Stored value'\nconsole.log(sessionStorage.getItem(storageKey));\n\
  sessionStorage.setItem(storageKey, 'Stored value');\nListing 6-18.\nSession storage\n\
  ```\n\n为了演示该存储机制的生命周期，在设置项之前调用了`getItem`方法；当页面首次加载时，会记录`null`值，但在后续刷新时，会记录存储的值。如果你在新标签中打开页面，将再次记录`null`值。如果你浏览页面，在同一标签中访问一个完全不同的页面，然后再次加载原始页面，你会发现值已被保留。只要标签页保持打开状态，会话就会持续，即使在该标签页中加载了其他页面——浏览器甚至可能支持在重启后恢复会话。\n\
  \n```\n// 使用键移除项\nsessionStorage.removeItem(storageKey);\n// 清除所有项\nsessionStorage.clear();\n\
  Listing 6-19.\nRemoving and clearing session storage\n```\n\n清单 6-19 展示了根据键移除项以及清除页面会话存储中所有项的方法。这些方法与前面描述的其他会话存储方法遵循相同的作用域和生命周期。\n\
  \n### 本地存储\n\n本地存储 API 与会话存储 API 相同，但其存储会持续存在，直到用户出于隐私原因将其删除或清除。本地存储还可以从同一域下的多个页面以及多个浏览器和标签页中访问。\n\
  \n由于本地存储项在页面、标签页和浏览器之间共享，它可以用于存储数据缓存以减少网络流量。它还可以用于在没有网络连接时存储用户输入的数据，或存储永远不需要传输的数据，例如临时的应用程序状态。\n\
  \n清单 6-20 包含一个脚本，该脚本在本地存储中存储一个包含当前日期和时间的值。在`storage`事件上附加了一个事件监听器，该事件应在另一个标签页或窗口中进行更改时触发。\n\
  \n```\nimport { addEvent } from './Listing-6-011';\nconst storageKey = 'Example';\n\
  localStorage.setItem(storageKey, 'Stored value ' + Date.now());\naddEvent(window,\
  \ 'storage', (event: StorageEvent) => {\nconsole.log(`${event.key} \"${event.oldValue}\"\
  \ changed to \"${event.newValue}\"`);\n});\nListing 6-20.\nLocal storage and events\n\
  ```\n\n如果你在多个浏览器标签页中运行此脚本，除发起更改的标签页外，每个标签页都会记录本地存储的更改。这使你可以让所有标签页都保持更新，以反映在任何其他标签页中发生的数据更改。\n\
  \n\n\n#### 存储限制\n\n对于会话存储和本地存储，浏览器很可能会遵循 Web 存储规范中描述的一系列限制和配置，该规范同样由 W3C（2014）维护。\n\
  \n浏览器很可能会限制页面初始可用的存储量，以防止恶意耗尽用户磁盘空间的行为。该限制适用于所有子域名，一旦达到限制，将向用户显示提示，请求允许增加分配的存储空间。在提示用户获取权限之前，推荐的存储限制为五兆字节。\n\
  \n为保护用户隐私，浏览器很可能会阻止第三方访问存储。这意味着你只能访问与存储数据同源的存储空间。浏览器可以根据用户偏好清除存储数据（例如，每次关闭浏览器时，或者当数据达到一定留存时间时）。同时，还会为用户提供查看和清除存储的选项，以及将网站加入白名单或黑名单的功能。黑名单网站甚至可能在社区间共享，从而根据大量用户将其列入黑名单的情况来自动阻止对该域名的存储访问。\n\
  \n出于安全原因，你应考虑特定信息是否适合存储，并且应避免在共享域上使用存储，因为共享域上的其他页面也能访问该存储。你无法通过路径限制对存储的访问。例如，以下两个路径都可以访问同一个存储空间：\n\
  \n*   [`www.shared.com/your-site/`](http://www.shared.com/your-site/)\n*   [`www.shared.com/third-party-site/`](http://www.shared.com/third-party-site/)\n\
  \n### IndexedDB\n\n虽然会话存储和本地存储是在键/值存储中保存少量数据的简单便捷方式，但 IndexedDB 允许以结构化方式存储更大量的数据，并可通过索引进行快速搜索。\n\
  \nIndexedDB 被设计为异步工作，这意味着你需要为 API 的每个方法提供一个回调，该回调在操作完成时执行。IndexedDB 有一个同步版本的规范，但目前没有浏览器实现该风格的\
  \ API。通常更推荐使用异步 API，以避免阻塞主线程上的事件循环，因此学习使用异步版本的 IndexedDB 值得付出额外的努力。\n\nIndexedDB\
  \ API 通过清单 6-21 中所示的 `Product` 类来演示。`Product` 类有两个公共属性：`productId` 和 `name`。`productId`\
  \ 将用作数据库中存储项的键。\n\n```\nexport class Product {\nconstructor(public productId: number,\
  \ public name: string) {\n}\n}\n清单 6-21.\nProduct.ts\n```\n\n清单 6-22 显示了一个空的 `ProductDatabase`\
  \ 类。该类将被扩展以执行数据库操作，例如存储、检索和删除产品。这个类还将减少程序代码对 IndexedDB API 的依赖。\n\n```\nimport {\
  \ Product } from './Listing-6-021';\nexport class ProductDatabase {\nconstructor(private\
  \ name: string, private version: number) {\n}\n}\n清单 6-22.\n空的 ProductDatabase.ts\n\
  ```\n\n`ProductDatabase` 构造函数接受数据库 `name` 和 `version` 编号。版本号用于检测本地存储的数据库是否需要升级到新版本。每次更改架构时，都应增加版本号。尽管\
  \ JavaScript 或 TypeScript 中没有原生整数类型，但版本号必须是整数。\n\n#### 需要升级\n\n数据库升级是通过比较本地版本号与程序中的版本号来确定的。如果程序版本号大于本地版本号，则会触发\
  \ `onupgradeneeded` 事件。如果本地没有数据库，也会触发该事件。你可以指定在升级事件中执行的方法，用于处理架构更改并添加任何所需的数据。\n\n\
  清单 6-23 包含了 `ProductDatabase` 类更新后的构造函数，该构造函数发出打开数据库的请求，并为 `onupgradeneeded` 事件添加监听器。如果需要升级，则会调用\
  \ `update` 方法。\n\n```\nimport { Product } from './Listing-6-021';\nexport class\
  \ ProductDatabase {\nconstructor(private name: string, private version: number)\
  \ {\nconst openDatabaseRequest = indexedDB.open(this.name, this.version);\nopenDatabaseRequest.onupgradeneeded\
  \ = this.upgrade;\n}\nupgrade(event: any) {\nconst db = event.target.result;\n//\
  \ keyPath 指定包含 id 的属性\nconst objectStore = db.createObjectStore(\"products\", {\
  \ keyPath: 'productId' });\nobjectStore.createIndex('name', 'name', { unique: false\
  \ });\nobjectStore.transaction.oncomplete = () => {\n// 示例静态数据\nconst products =\
  \ [\nnew Product(1, '我的第一个产品'),\nnew Product(2, '我的第二个产品'),\nnew Product(3, '我的第三个产品')\n\
  ];\n// 添加记录\nconst productStore = db.transaction('products', 'readwrite').objectStore('products');\n\
  for (let product of products) {\nproductStore.add(product);\n}\n}\n}\n}\n清单 6-23.\n\
  支持升级的 ProductDatabase\n```\n\n此示例中的 `update` 方法使用 `createObjectStore` 创建一个产品表。选项参数指定了一个\
  \ `keyPath`，它告诉数据库存储的对象将具有一个 `productId` 属性，该属性将用作唯一键。你也可以通过传递值为 `true` 的 `autoIncrement`\
  \ 选项（而不是传递 `keyPath` 属性）来选择让系统自动为你创建键。\n\n`createIndex` 方法为 `name` 属性添加索引，以加快按名称搜索的速度。可以将索引设为唯一，不过在此示例中，通过将\
  \ `unique` 设置为 `false` 允许了重复项。如果数据库中已包含重复项，尝试创建唯一索引将会失败。\n\n最后，在产品对象存储上创建一个事务，并用它向数据库添加产品。如果需要用静态数据填充数据库，此步骤非常有用。\n\
  \n```\nimport { ProductDatabase } from './Listing-6-023';\nconst versionNumber =\
  \ 1;\nconst db = new ProductDatabase('ExampleDatabase', versionNumber);\n清单 6-24.\n\
  实例化 ProductDatabase\n```\n\n清单 6-24 显示了实例化 `ProductDatabase` 类的代码。虽然构造函数为 `onupgradeneeded`\
  \ 事件分配了事件处理程序，但构造函数将在事件触发之前完成。\n\n\n\n#### 查询数据库\n\n由于 IndexedDB 被设计为异步工作，某些操作可能看起来比预想的更复杂。尽管如此，利用异步特性是值得的——即使这些操作的同步版本最终被浏览器实现也是如此。如果回调链让你感到不适，你可以使用诸如\
  \ Dexie 或 ZangoDB 这样的库，将 IndexedDB 封装成基于 Promise 的接口，这样会清晰得多。你可以在第 5 章了解基于 Promise\
  \ 接口的优势。本章演示的是完整的回调链版本，因为这是原生的浏览器 API。\n\n代码清单 6-25 展示了 `ProductDatabase` 类的一个 `getProduct`\
  \ 方法，该方法处理了数据库打开请求、事务和查询。这使得调用代码只需传入 `productId` 和一个用于处理结果的 `callback`。\n\n```\n\
  getProduct(productId: number, callback: (result: Product) => void) {\n// 打开数据库\n\
  const openDatabaseRequest = indexedDB.open(this.name, this.version);\nopenDatabaseRequest.onsuccess\
  \ = () => {\n// 数据库已打开\nconst db = openDatabaseRequest.result;\n// 在 products 存储对象上启动一个事务\n\
  const productStore = db.transaction(['products']).objectStore('products');\n// 发起查询请求\n\
  const query = productStore.get(productId);\nquery.onsuccess = () => {\ncallback(query.result);\n\
  };\n};\n}\n代码清单 6-25.\ngetProduct 方法\n```\n\n`getProduct` 方法创建一个用于打开数据库的请求，提供一个创建事务的回调，并在连接成功打开后执行查询。你还可以提供一个在\
  \ `on error` 时执行的回调，当数据库无法打开时将会被调用。查询请求也提供了一个回调，该回调会被传入查询结果。\n\n若要使用产品数据库，代码清单 6-26\
  \ 包含一个简单的 HTML 页面，用户可在此输入产品 ID 并查看从数据库获取的结果。\n\n```\nIndexedDB\n\nIndexedDB\n\n\
  产品 ID: \n\n代码清单 6-26.\nHTML 页面\n```\n\n用于收集用户输入的数据并调用 `ProductDatabase` 类的代码如代码清单\
  \ 6-27 所示。通过 `keyup` 事件收集输入框中输入的产品 ID，并将其连同回调一起传递给 `getProduct` 方法，如果在数据库中找到匹配记录，该回调将在网页上显示结果。\n\
  \n```\nimport { addEvent } from './Listing-6-011';\nimport { Product } from './Listing-6-021';\n\
  import { ProductDatabase } from './Listing-6-025';\nconst db = new ProductDatabase('ExampleDatabase',\
  \ 1);\n// 等待在 productId 输入框中输入\naddEvent(document.getElementById('productId'), 'keyup',\
  \ function () {\n// 获取用户输入的 ID，转换为数字\nconst productId = +this.value;\n// 使用该 ID\
  \ 在数据库中搜索\ndb.getProduct(productId, (product) => {\ndocument.getElementById('content').innerHTML\
  \ = product ?\n`产品 ID: ${product.productId} 的结果是: ${product.name}` :\n'无结果';\n});\n\
  });\n代码清单 6-27.\n调用 getProduct\n```\n\n运行此示例将证实，尽管部分代码看起来稍显复杂，但记录的检索速度极快，因为不需要网络往返。数据在离线状态下也可用，这意味着你的程序可以在没有网络连接的情况下继续工作。\n\
  \n#### 添加新记录\n\n向数据库添加新记录比通过查询获取记录（如上一节所示）稍简单一些，因为添加记录少了一个回调。总体模式相同，如代码清单 6-28 所示，在成功回调中请求连接并启动事务。\n\
  \n然后使用 `add` 方法存储产品，该方法接收产品对象，并根据代码清单 6-23 中的数据库配置自动找到 `productId` 属性作为唯一键。\n\n\
  ```\naddProduct(product: Product) {\n// 打开数据库\nconst openDatabaseRequest = indexedDB.open(this.name,\
  \ this.version);\nopenDatabaseRequest.onsuccess = () => {\n// 数据库已打开\nconst db =\
  \ openDatabaseRequest.result;\n// 在 products 存储对象上启动一个事务\nconst productStore = db.transaction('products',\
  \ 'readwrite').objectStore('products');\n// 添加产品\nproductStore.add(product);\n};\n\
  }\n代码清单 6-28.\naddProduct 方法\n```\n\n调用 `addProduct` 方法的代码如代码清单 6-29 所示。由于 `ProductDatabase`\
  \ 类已经处理了连接请求，所有调用代码需要做的只是提供要存储的新产品。\n\n```\nimport { Product } from './Listing-6-021';\n\
  import { ProductDatabase } from './Listing-6-028';\nconst db = new ProductDatabase('ExampleDatabase',\
  \ 1);\nconst newProduct = new Product(4, '新添加的产品');\ndb.addProduct(newProduct);\n\
  代码清单 6-29.\n调用 addProduct\n```\n\n由于数据库在离线状态下可用，因此可以在没有网络连接的情况下存储记录，然后在网络可用时再将其与服务器同步。你可以使用一个暂存表来保存待同步的记录，或者标记记录以显示它们是否已同步。\n\
  \n#### 删除记录\n\n从数据库中删除记录的方法如代码清单 6-30 所示。使用唯一键来标识要移除的记录。同样，需要打开数据库并在产品存储对象上启动一个事务。\n\
  \n```\ndeleteProduct(productId: number) {\n// 打开数据库\nconst openDatabaseRequest =\
  \ indexedDB.open(this.name, this.version);\nopenDatabaseRequest.onsuccess = (event:\
  \ any) => {\n// 数据库已打开\nconst db = openDatabaseRequest.result;\n// 在 products 存储对象上启动一个事务\n\
  const productStore = db.transaction('products', 'readwrite').objectStore('products');\n\
  // 删除产品\nconst deleteRequest = productStore.delete(productId);\n};\n}\n代码清单 6-30.\n\
  deleteProduct 方法\n```\n\n调用删除产品的代码如代码清单 6-31 所示，简单到只需用产品的唯一键调用 `deleteProduct` 即可。\n\
  \n```\nimport { Product } from './Listing-6-021';\nimport { ProductDatabase } from\
  \ './Listing-6-030';\nconst db = new ProductDatabase('ExampleDatabase', 1);\ndb.deleteProduct(4);\n\
  代码清单 6-31.\n调用 deleteProduct\n```\n\n\n\n##### `IDBRequest` 接口\n\n`IDBRequest` 在\
  \ IndexedDB 模型中很常见。无论你是通过 `indexedDB.open`、`objectStore.get`、`objectStore.add` 还是\
  \ `objectStore.delete` 对数据库发起的任何请求，都支持此接口。\n\n这一约定的巧妙之处在于，你可以为这些操作中的任何一个添加监听器，以处理成功和错误事件。在事件处理程序中，你可以访问原始的请求对象，该对象包含以下信息：\n\
  \n*   `result`——请求的结果（如果可用）。\n*   `error`——错误信息（如果可用）。\n*   `source`——请求所对应的索引或对象存储（如果适用）。\n\
  *   `transaction`——请求的事务（如果请求在事务内）；你可以通过调用 `transaction.abort()` 来撤销该事务中的更改。\n*\
  \   `readyState`——状态为 `pending` 或 `done`。\n\n在所有这些示例中，事件处理程序都可以像清单 6-32 所示的那样提供。如果你在编写一个使用\
  \ IndexedDB 的健壮程序，你应该使用这些事件来确保数据库操作成功，并检测任何错误。\n\n```\ndeleteProduct(productId:\
  \ number) {\n// 打开数据库\nconst openDatabaseRequest = indexedDB.open(this.name, this.version);\n\
  openDatabaseRequest.onsuccess = (event: any) => {\n// 数据库已打开\nconst db = openDatabaseRequest.result;\n\
  // 在 products 存储上启动一个事务\nconst productStore = db.transaction('products', 'readwrite').objectStore('products');\n\
  // 添加产品\nconst deleteRequest = productStore.delete(productId);\ndeleteRequest.onsuccess\
  \ = () => {\nconsole.log('删除成功');\n}\ndeleteRequest.onerror = () => {\nconsole.log('删除失败:\
  \ ' + deleteRequest.error.name);\n}\n};\n}\n清单 6-32.\nIDBRequest 约定\n```\n\n本节中的示例都使用了\
  \ TypeScript 箭头函数语法。这并非为了保留 `this` 关键字的含义，而是为了减少代码中本应出现的许多嵌套函数声明所带来的干扰。\n\n####\
  \ 存储机制综述\n\n本节介绍了浏览器中几种可用的存储选择。虽然涉及了大量的示例，但实际上只描述了你可能用到的最常见的存储机制特性。\n\n无论你使用哪种存储机制，都无法保证你存储的数据能够长期持久存在。所有的存储规范都描述了数据可能被删除的情况，包括用户选择手动清除数据时。因此，浏览器提供的任何存储都应被视为具有潜在的不稳定性。\n\
  \n使用浏览器存储时的另一个考虑因素是，许多用户使用不同的设备来访问你的浏览器应用。因此，如果你想让他们在不同设备上获得一致的体验，就需要与你的服务器进行同步。\n\
  \n## 地理位置\n\n地理定位 API 提供了一种单一的机制来获取用户的位置，无论用户的设备是通过全球定位系统还是基于网络的推断来确定实际位置。\n\n只有在用户授权你的应用访问其位置信息时，你才能获取到。因此，你需要提供一个备用机制来处理被拒绝的请求、旧版浏览器以及定位失败的情况。当地理定位失败时，获取位置的常用方法是允许用户输入搜索词来查找他们的位置。\n\
  \n**注意**\n\n大多数网页浏览器只允许在安全上下文中调用地理定位 API，当页面不安全时，甚至不会提示用户授权。\n\n清单 6-33 演示了使用 `getCurrentPosition`\
  \ 方法进行的一次性位置查询。如果请求被批准并成功，将调用 `success` 回调函数，其参数中包含位置信息。位置对象包含纬度和经度，如果可用，还可以包含海拔、方向和速度等附加数据。清单\
  \ 6-33 的输出假设用户位于伦敦眼脚下。\n\n```\nfunction success(pos: Position) {\nconsole.log('您的位置:\
  \ 纬度=' + pos.coords.latitude +\n' 经度=' + pos.coords.longitude +\n' 海拔=' + pos.coords.altitude\
  \ +\n' (精度=' + pos.coords.altitudeAccuracy + ')' +\n' 方向=' + pos.coords.heading\
  \ +\n' 速度=' + pos.coords.speed);\n}\nnavigator.geolocation.getCurrentPosition(success);\n\
  // 您的位置: 纬度 = 51.5033 经度 = 0.1197\n// 海拔 = 15 (精度 = 0)\n// 方向 = 0 速度 = 0\n清单 6-33.\n\
  Geolocation getCurrentPosition\n```\n\n除了获取用户位置的单次读数外，你还可以使用 `watchPosition` 方法来持续监听位置变化。清单\
  \ 6-34 复用了前面示例中的 `success` 回调函数来监听用户位置的变化。此示例的输出假设用户在一秒钟内迅速从伦敦眼顶部移动到了小黄瓜大厦顶部，从而记录下了每秒\
  \ 3379 米的速度。方向以度表示，北为 0 度，东为 90 度，南为 180 度，西为 270 度。\n\n```\nfunction success(pos:\
  \ Position) {\nconsole.log('您的位置: 纬度=' + pos.coords.latitude +\n' 经度=' + pos.coords.longitude\
  \ +\n' 海拔=' + pos.coords.altitude +\n' (精度=' + pos.coords.altitudeAccuracy + ')'\
  \ +\n' 方向=' + pos.coords.heading +\n' 速度=' + pos.coords.speed);\n}\nconst watch\
  \ = navigator.geolocation.watchPosition(success);\n// 您的位置: 纬度 = 51.5033 经度 = 0.1197\n\
  // 海拔 = 135 (精度 = 15)\n// 方向 = 0 速度 = 0\n// 您的位置: 纬度 = 51.5144 经度 = 0.0803\n// 海拔\
  \ = 180 (精度 = 15)\n// 方向 = 60 速度 = 3379\n清单 6-34.\nGeolocation watchPosition\n```\n\
  \n如果你想停止跟踪用户的位置，可以调用 `clearWatch` 方法，并将原始 `watchPosition` 请求的引用传递给它，以结束对位置变化的监听。清单\
  \ 6-35 中的代码结束了前面示例中的监听。\n\n```\nnavigator.geolocation.clearWatch(watch);\n清单 6-35.\n\
  清除监听\n```\n\n如果你需要了解用户位置的请求被拒绝或失败的情况，你可以传递一个额外的回调函数，该函数会在请求失败时被调用。清单 6-36 展示了对 `watchPosition`\
  \ 的更新调用，其中传递了额外的错误处理函数。你也可以为 `getCurrentPosition` 传递一个错误回调。\n\n```\nfunction success()\
  \ {\nconsole.log('成功');\n}\nfunction error() {\nconsole.log('无法获取位置信息。');\n}\nconst\
  \ watch = navigator.geolocation.watchPosition(success, error);\n清单 6-36.\n获取位置失败\n\
  ```\n\n地理定位通常用于根据用户的当前位置定制页面，或者在用户执行某些操作（如发布消息）时将位置作为元数据存储。一旦用户授予了你的网站权限，浏览器可能会存储此授权，以避免用户每次使用网络应用时都弹出提示。大多数浏览器的默认行为是记住安全连接页面的授权，但不记住非安全页面的授权。\n\
  \n\n\n## 传感器\n\n目前已有多个已发布的 API 可用于在浏览器内使用传感器。这在一定程度上要归功于 Mozilla 和诺基亚等组织对智能手机功能的推动，以及\
  \ HTML、CSS 和 JavaScript 在移动平台上获得的关注度。\n\n尽管受到移动设备的影响，但这些 API 的标准是通过万维网联盟（W3C）发布的，这意味着它们与现有的网络标准并存，并且无论设备是否被视为便携式，都可以在浏览器中实现。未来可能发布的\
  \ API 数量会超过本节所介绍的范围，但从给出的示例中你会发现，传感器 API 的实现存在一种明显的模式。\n\n本节介绍的许多 API 最初是 W3C（2014\
  \ 年）提出的一种通用系统信息 API 的一部分，但编辑们决定针对每个 API 单独制定规范，以加快编写标准的速度。例如，如果振动 API 和电池状态 API\
  \ 属于同一个规范，那么对于振动 API 的分歧可能会导致电池状态 API 的延迟发布。\n\n**注意：** 你可以在拥有相应传感器且浏览器实现了相关标准的设备上试用设备传感器事件和\
  \ API。例如，你可以在运行 Firefox 浏览器的 Google Pixel 手机上尝试运动与方向、光线和接近度传感器。\n\n### 电池状态\n\n\
  为了获得电池状态 API 的自动补全和类型检查功能，你需要提供一个包含两个接口的类型定义。这些接口如清单 6-37 所示。`BatteryManager` 接口包含构成电池状态\
  \ API 的属性和事件。`Navigator` 接口扩展了 TypeScript 库中的现有接口，并添加了 `battery` 属性。\n\n```\ninterface\
  \ BatteryManager {\n    charging: boolean;\n    chargingTime: number;\n    dischargingTime:\
  \ number;\n    level: number;\n    onchargingchange: () => any;\n    onchargingtimechange:\
  \ () => any;\n    ondischargingtimechange: () => any;\n    onlevelchange: () =>\
  \ any;\n}\ninterface Navigator {\n    battery: BatteryManager;\n    mozBattery:\
  \ BatteryManager;\n    webkitBattery: BatteryManager;\n}\n```\n\n*清单 6-37. 电池状态的类型定义*\n\
  \n要从电池 API 获取信息，你首先需要检测该特性的存在，然后调用电池管理器上的属性。清单 6-38 是一个完整的示例，演示了如何使用电池管理器在网页上显示信息。\n\
  \n电池的 `level` 以 0 到 1.0 之间的值提供，因此你可以将此值乘以 100 来获得充电百分比。电池信息中给出的所有时间均以秒为单位，你可以根据需要将其转换为分钟或小时。`charging`\
  \ 标志指示电池当前是否连接到电源。\n\n```\nconst battery: BatteryManager = (navigator).battery\n\
  \    || (navigator).mozBattery\n    || (navigator).webkitBattery;\n\nif (battery)\
  \ {\n    const output = document.getElementById('content');\n\n    function updateBatteryStatus()\
  \ {\n        // 获取电池充电水平\n        const charge = Math.floor(battery.level * 100)\
  \ + '%';\n        // 检测电池是否正在充电\n        const charging = battery.charging ? ' 正在充电'\
  \ : ' 正在放电';\n        // 根据充电或放电状态获取剩余时间\n        const timeLeft = battery.charging\n\
  \            ? `剩余充电时间 (${Math.floor(battery.chargingTime / 60)} 分钟)`\n        \
  \    : `剩余放电时间 (${Math.floor(battery.dischargingTime / 60)} 分钟)`;\n        output.innerHTML\
  \ = charge + timeLeft + charging;\n    }\n\n    // 插入或拔出电源时更新显示\n    battery.onchargingchange\
  \ = updateBatteryStatus;\n    // 充电时间变化时更新显示\n    battery.onchargingtimechange =\
  \ updateBatteryStatus;\n    // 放电时间变化时更新显示\n    battery.ondischargingtimechange\
  \ = updateBatteryStatus;\n    // 电池电量变化时更新显示\n    battery.onlevelchange = updateBatteryStatus;\n\
  }\n```\n\n*清单 6-38. 电池状态*\n\n有四个你可以订阅的事件，用于检测电池状态的变化。你可能只对其中一个或某几个感兴趣。例如，尽管使用此 API\
  \ 最常见的目的是像示例中那样显示获取到的信息，但你也可以利用 `onchargingchange` 事件，在设备断开电源时发出警报，无论是为了警告用户，还是作为一种检测设备被盗的基本安全机制。你还可以利用电池信息来感知低电量情况——例如，在电池电量低于\
  \ 20% 时限制应用程序的运行。\n\n**注意：** 电池传感器 API 暂时搁置，以待解决一些隐私问题。\n\n### 接近度传感器\n\n接近度传感器是一个非常简单的\
  \ API，用于确定用户是否离设备很近。通常，该传感器位于手机的顶部，靠近听筒。当用户将手机举到耳边时，API 会检测到有物体靠近听筒。当手机被移开时，设备检测到用户不再靠近。\n\
  \n该传感器的主要用途是，当用户打电话时隐藏屏幕并禁用触摸功能，当用户将手机从耳边移开时重新显示屏幕。尽管接近度传感器的用途比较简单，但你可以为它在你的程序中找到更具创新性的用途。\n\
  \n接近度 API 支持两种不同类型的事件：一种是用户接近事件，它提供一个属性来声明用户是否靠近；另一种是设备接近事件，它提供一个在特定范围内的测量值。设备接近事件的信息将根据具体的实现而有所不同。\n\
  \n```\nimport { addEvent } from './Listing-6-011';\n\ninterface ProximityEvent {\n\
  \    min: number;\n    max: number;\n    value: number;\n    near: boolean;\n}\n\
  \nconst output = document.getElementById('content');\n\nfunction sensorChange(proximity:\
  \ ProximityEvent) {\n    const distance =\n        (proximity.value ? proximity.value\
  \ + ' ' : '') +\n        (proximity.near ? '靠近' : '远离');\n    output.innerHTML =\
  \ distance;\n}\n\n// 靠近或远离\naddEvent(window, 'userproximity', sensorChange);\n//\
  \ 在特定范围内的测量值\naddEvent(window, 'deviceproximity', sensorChange);\n```\n\n*清单 6-39.\
  \ 接近度事件*\n\n与提供管理器并包含可随时测试属性的电池传感器不同，接近度 API 基于 `userproximity` 和 `deviceproximity`\
  \ 事件，这些事件传递一个包含数据的事件参数。如果传感器不可用或设备不支持此 API，这些事件将永远不会触发；否则，每当接近状态发生变化时，就会调用事件处理程序。\n\
  \n### 光线传感器\n\n环境光线传感器提供单一读数，表示以勒克斯为单位的当前环境光。勒克斯单位表示每平方米流明，这是对人眼所见光强度的一种合理表示。晴朗夜晚的满月最多可提供\
  \ 1 勒克斯的光线。办公室照明通常在 300 到 500 勒克斯之间，而电视演播室可能使用 1,000 勒克斯。直射阳光的范围可以从 32,000 到 100,000\
  \ 勒克斯。\n\n光线传感器 API 有一个 `devicelight` 事件，它提供如清单 6-40 所示的单个值。\n\n```\nimport { addEvent\
  \ } from './Listing-6-011';\n\nconst output = document.getElementById('content');\n\
  \nfunction sensorChange(data: DeviceLightEvent) {\n    output.innerHTML = '环境光线读数:\
  \ ' + data.value;\n}\n\naddEvent(window, 'devicelight', sensorChange);\n```\n\n\
  *清单 6-40. 环境光线传感器*\n\n尽管示例中的 `devicelight` 事件提供了最高级别的粒度，但还有一个 `lightlevel` 事件，它返回更抽象的枚举值\
  \ `dim`、`normal` 或 `bright`，具体取决于环境光。\n\n\n\n#### 运动与方向\n\n运动与方向 API 已包含在 TypeScript\
  \ 标准库中，因此无需在现有的`DeviceMotionEvent`类型之上额外声明类型。\n\n清单 6-41 中的示例获取了以米/秒²为单位的加速度`motion`和以度为单位的旋转`rotation`。\n\
  \n```\nimport { addEvent } from './Listing-6-011';\nconst output = document.getElementById('content');\n\
  function sensorChange(event: DeviceMotionEvent) {\nvar motion = event.acceleration;\n\
  var rotation = event.rotationRate;\noutput.innerHTML = 'Motion :' +\nmotion.x +\
  \ '' +\nmotion.y + '' +\nmotion.z + '' +\n'Rotation:' +\nrotation.alpha + '' +\n\
  rotation.beta + '' +\nrotation.gamma + '';\n}\naddEvent(window, 'devicemotion',\
  \ sensorChange);\n```\n\n`acceleration`属性经过归一化处理，以消除重力影响。这种归一化仅能在配备陀螺仪的设备上进行。在没有陀螺仪的情况下，可以使用另一个名为`accelerationIncludingGravity`的属性，该属性在当前朝上/朝下的轴线上额外增加了\
  \ 9.81 的测量值（若设备处于倾斜状态，没有单一轴线直接指向正上方/正下方，则该值会分布在多个轴线上）。例如，如果设备平放且屏幕朝上，您将得到以下值：\n\n\
  * `acceleration: { x: 0, y: 0, z: 0 }`\n* `accelerationIncludingGravity: { x: 0,\
  \ y: 0, z: 9.81 }`\n\n#### 其他设备传感器\n\n正如您在前面的示例中可能注意到的，当传感器提供单一值时，使用 API 的方式存在一种明显的模式。具体来说，您只需更改`sensorApiName`变量，即可更新清单\
  \ 6-42 中的代码，使其适用于光线、温度、噪音或湿度传感器 API。\n\n```\nimport { addEvent } from './Listing-6-011';\n\
  const sensorApiName = 'devicetemperature';\nconst output = document.getElementById('content');\n\
  addEvent(window, sensorApiName, (data) => {\noutput.innerHTML = sensorApiName +\
  \ ' ' + data.value;\n});\n```\n\n此示例中的`sensorApiName`可以更改为以下任一事件名称，以及未来遵循此实现模式的任何事件名称。\n\
  \n* `devicehumidity` — 值为湿度百分比。\n* `devicelight` — 值为以勒克斯为单位的环境光线强度。\n* `devicenoise`\
  \ — 值为以 dBA 为单位的噪音水平。\n* `devicetemperature` — 值为以摄氏度为单位的温度。\n\n#### 传感器综述\n\n设备传感器\
  \ API 展示了网页、Web 应用程序和原生设备之间的界限正在逐渐模糊。这套设备 API 的实验性质使其进展非常缓慢，尤其是当 Mozilla 放弃其基于原生\
  \ HTML 和 JavaScript 操作系统的 Firefox OS 项目之后。\n\n这些 API 中普遍使用的模式——监听在`window`对象上触发的特定事件——意味着您甚至不需要在使用前测试该功能。如果\
  \ API 不可用，该事件根本就不会触发。\n\n简而言之，传感器可用于向用户提供测量数据，但稍加创意，它们也可用于提供有趣的用户交互、自适应界面或富有创意的游戏。也许您会选择根据环境光线更改页面主题，使用运动或旋转来控制页面元素，甚至结合使用光线、运动和噪音传感器来记录用户的睡眠质量。\n\
  \n## Web Workers\n\nJavaScript 被设计为在单线程上运行事件循环，这是您通常应该采用的模型。如果您遇到需要额外线程的情况，可以使用\
  \ Web Workers。Web Workers 允许脚本在后台线程上运行，该线程拥有独立的全局上下文，并可通过事件与生成该线程的任务进行通信。\n\n要创建一个新的\
  \ Worker，需要在后台线程上运行的代码必须包含在一个单独的 JavaScript 文件中。清单 6-43 中的代码展示了`worker.ts`中的代码，该代码将被编译成`worker.js`文件，并在后台线程上运行。\n\
  \n```\ndeclare function postMessage(message: any): void;\nlet id = 0;\nself.setInterval(()\
  \ => {\nid++;\nvar message = {\n'id': id,\n'message': 'Message sent at ' + Date.now()\n\
  };\npostMessage(message);\n}, 1000);\n```\n\n此示例中的`setInterval`方法不是在`window`上调用的，而是在`self`上调用的。这反映了\
  \ Worker 在其自身作用域的独立上下文中运行的事实。`postMessage`事件是将信息从 Worker 发送回主线程的机制，传递给 Worker 或从\
  \ Worker 接收的任何对象都是被复制而非共享的。\n\n创建 Worker 并监听消息的代码如清单 6-44 所示。Worker 通过包含 Worker\
  \ 代码的 JavaScript 文件路径进行实例化。`workerMessageReceived`函数被附加到`message`事件上，每当 Worker 发布消息时都会被调用。\n\
  \n```\nconst worker = new Worker('/Listing-6-043.js');\nfunction workerMessageReceived(event)\
  \ {\nconst response = event.data;\nconsole.log(response.id, response.message);\n\
  };\nworker.addEventListener('message', workerMessageReceived);\n```\n\n如果您多次运行此示例，就会遇到这个实现中的一个缺陷：Worker\
  \ 会立即在后台开始运行，这意味着它可能在消息事件处理器添加之前就开始发布消息。在 JavaScript 中，这个问题通常不会发生，因为在函数完成之前，主线程无法处理事件循环中的其他项目。\n\
  \n如果您需要避免设置 Worker 时可能出现的竞态条件，可以将 Worker 内部的代码封装在一个函数中，并向 Worker 发送一条消息，告知它您已设置了事件监听器并准备好让它开始处理。更新后的\
  \ Worker 代码如清单 6-45 所示。原始的`setInterval`调用被封装在一个函数中，该函数在 Worker 接收到启动消息时被调用。\n\n\
  ```\ndeclare function postMessage(message: any): void;\nlet id = 0;\nfunction start()\
  \ {\nself.setInterval(() => {\nid++;\nconst message = {\n'id': id,\n'message': 'Message\
  \ sent at ' + Date.now()\n};\npostMessage(message);\n}, 1000);\n}\nself.onmessage\
  \ = (event) => {\nif (event.data === 'Start') {\nstart();\n} else {\nconsole.log(event.data);\n\
  }\n}\n```\n\n当 Worker 被创建时，它不会运行消息传递代码，直到它接收到`'Start'`消息。向 Worker 发送启动消息使用了与 Worker\
  \ 向主线程通信相同的`postMessage`机制。通过在添加事件处理器之后发送启动消息，竞态条件得以避免。\n\n```\nconst worker = new\
  \ Worker('/Listing-6-045.js');\nfunction workerMessageReceived(event) {\nconst response\
  \ = event.data;\nconsole.log(response.id, response.message);\n};\nworker.addEventListener('message',\
  \ workerMessageReceived);\nworker.postMessage('Start');\n```\n\n\n  \n## Web Workers\n\
  \n`Web workers` 提供了一种简单的机制，用于在后台线程上处理代码，并且附带在线程之间安全传递消息的模式。尽管使用起来很简单，但如果你发现自己频繁创建\
  \ `web workers`，那可能意味着使用方式不当，尤其是考虑到长时间运行的操作通常遵循回调模式或使用 `promises`，而无需借助 `web workers`。\n\
  \n如果你确实需要执行长时间运行的处理或计算，`web worker` 可以让事件循环在主线程上继续处理，而数字计算则在后台进行。\n\n## 打包你的程序\n\
  \n本节暂时放下有趣 API 的实践示例，来讨论如何打包你的 TypeScript 程序。\n\n当你从 JavaScript 切换到 TypeScript 时，很容易直接将原有的打包策略照搬到\
  \ TypeScript 程序中。常见的情况是，人们切换到 TypeScript 后，使用命名空间来组织程序，并添加一个构建步骤将代码合并到单个文件中，然后进行压缩，最后再纳入最终程序。这种策略适用于规模较小的程序，但如果你的程序持续增长，这种打包方式无法无限扩展。这正是\
  \ TypeScript 原生支持模块加载的原因。\n\n如果你使用模块而不是命名空间来组织程序，你可以使用 `module loader` 在需要时按需获取依赖，只加载程序所需的特定部分。这种按需加载意味着，即使你的程序有数十万行代码，你也只需加载执行当前操作所需的组件，并在需要时（或只在需要时）加载额外的模块。\n\
  \n当你确定程序会保持较小规模时，打包和压缩策略可能是正确的选择，但你仍然可以使用模块来编写程序，并借助 `RequireJS` 优化器等工具来合并输出，而不会限制未来的可能性。\n\
  \n关于模块加载和打包的更多信息，请参阅第 2 章。\n\n## 总结\n\n本章是一场史诗般的速览，涵盖了从浏览器本身到众多 API 的各种多样但有趣的网页浏览器特性，这些\
  \ API 让你能够创建有趣且富有创造性的应用程序。虽然关于许多特性的信息很多，但你随时可以回到本章来刷新记忆。\n\n## 要点\n\n- 通过避免不必要的重排，你的程序会显得响应更快。\n\
  - 有多种方法可以在网页上查找元素。每种方法返回不同的类型，不过你可以使用 `type assertion` 来更改该类型。\n- 在将元素添加到页面之前，先构建一个嵌套的元素集合，这比逐个添加元素更高效。\n\
  - `AJAX` 允许对服务器进行异步调用，并支持多种不同格式的数据。\n- `WebSockets` 提供具有双向通信的持久连接，而 `WebRTC` 允许实时音频和视频流。\n\
  - 你可以使用 `session storage`、`local storage` 或 `IndexedDB` 在本地计算机上存储数据。但数据不保证会持久保存。\n\
  - 你可以获取用户的位置（需经用户许可），浏览器将使用当前可用的最精确的方法来定位。\n- 有许多传感器可以访问，它们都具有相似的实现模式。\n- `Web Workers`\
  \ 在单独的线程中运行，主线程和 worker 线程之间、以及 worker 线程和主线程之间互相发送消息。\n\n"
- "# 在服务器上运行 TypeScript\n\n> 如果你觉得 Node 通过一次只运行一段代码来实现并行性很奇怪，那确实如此。这是我称之为“逆向思维”的一个例子。——Jim\
  \ R. Wilson\n\n在服务器上运行 JavaScript 并不是一个新概念——Netscape Enterprise Server 早在 1994 年就提供了此功能。目前有大量在六种以上不同脚本引擎上运行的服务器端\
  \ JavaScript 实现。除了这些纯 JavaScript 实现之外，JavaScript 还可以在任何具有脚本主机的平台内运行。\n\n虽然 JavaScript\
  \ 语言是所有这些实现的共同点，但每个实现都会提供不同的 API、框架、模块或基类库，用于执行通常在基于浏览器的 JavaScript 程序中不可用的操作。服务器端实现中可用模块的范围至关重要，这也是\
  \ Node 取得巨大成功的原因（也是本章选择它的原因）。\n\nNode 不仅拥有超过 475,000 个可用模块，从简单的助手工具到整个数据库服务器，而且只需一个简单命令就能将它们添加到你的程序中，这要归功于\
  \ Node 包管理器（NPM）。这意味着你只需在命令窗口中输入 `npm install MongoDB`，就可以添加诸如 MongoDB 之类的数据库模块。Node\
  \ 是跨平台的，并为 Windows、Mac OSX、Linux、Docker 和 SunOS 提供安装程序。\n\n为了演示在 TypeScript 中使用\
  \ Node，本章将一个简单的应用程序逐步演变为使用多个模块的应用程序。这既演示了代码本身，也展示了添加包和类型定义的过程。虽然示例展示了 Visual Studio\
  \ 和 Windows 命令提示符的屏幕截图，但你可以轻松地将学到的所有内容转移到其他开发工具和操作系统中，例如 OSX 上的 Sublime Text 2 和\
  \ Terminal，或 Linux 上的 WebStorm 和终端。组合方式多种多样，如果你希望在不同机器上获得类似体验，有几个集成开发环境是跨平台的（Visual\
  \ Studio Code、Cloud9、Eclipse、Sublime Text 2、Vim 和 WebStorm 都可在 Windows、OSX 和 Linux\
  \ 上运行）。\n\n## 安装 Node\n\n你可以从 NodeJS 网站下载适用于所选平台的安装程序：\n\n[`nodejs.org/en/download/`](https://nodejs.org/en/download/)\n\
  \n## 创建新项目\n\n示例程序将从完全空的项目开始。图 7-1 显示了示例项目和解决方案的起始状态，其中包含一个空的 `server.ts` 文件。\n\n\
  如果你使用的是 Visual Studio 2017，可以通过创建一个新的空白 Node.js 应用程序（使用 TypeScript 语言）来复制此设置。如果你使用不同的开发环境，可以简单地启动一个新项目或文件夹，并添加一个空的\
  \ `server.ts` 文件。\n\n![A323824_2_En_7_Fig1_HTML.jpg](img/A323824_2_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1. 空的 TypeScript 项目\n\n为了获得 Node 的自动补全和类型检查，你需要一个描述标准 Node API 的类型定义。最快的方法是使用\
  \ NPM。\n\n\n\n## NPM\n\n您可以使用 `NPM` 来管理生产环境依赖和开发环境依赖。生产环境依赖是应用程序运行时必须存在的模块。开发环境依赖则包含您在编码时才需要、而运行应用程序时不需要的工具和类型定义。\n\
  \n在添加包之前，您需要一个名为 `package.json` 的特殊文件，如清单 7-1 所示。该文件描述了您的程序，包括它所有的依赖项。每当您添加一个生产或开发环境依赖时，此文件都会更新。\n\
  \n```\n{\n\"name\": \"NodeApp\"\n}\n清单 7-1。\n空的 package.json 文件\n```\n\n> 注意：这还不是一个有效的\
  \ `package.json` 文件，有效的版本将在本章稍后部分展示。这个极其精简的版本将使 NPM 示例更容易理解。\n\n一旦您有了 `package.json`\
  \ 文件，添加依赖项只需知道其名称。在下面的所有示例中，我们将使用 Express，这是一个用于 Node 的轻量级 Web 框架。\n\n安装包的第一种机制是\
  \ Visual Studio 的包搜索功能，可以通过右键单击解决方案资源管理器中的 \"npm\" 分支来使用。包管理器 UI 的左侧允许您搜索包，您可以使用右侧底部的表单安装所选包。标准选项会将包的最新版本添加到项目中。\n\
  \n![A323824_2_En_7_Fig2_HTML.jpg](img/A323824_2_En_7_Fig2_HTML.jpg)\n\n*图 7-2. 通过\
  \ Visual Studio 安装 NPM 包*\n\n通过运行清单 7-2 中所示的命令，您也可以获得完全相同的结果。这恰好是 UI 发起的原始命令。从您喜欢的命令行窗口使用\
  \ `NPM` 和 `NodeJS` 都很简单。\n\n```\nnpm install express --save\n清单 7-2。\n通过命令安装 NPM\
  \ 包\n```\n\n无论您使用 UI 还是直接键入命令，安装命令中的 `--save` 标志都会导致 `package.json` 文件被更新以显示该依赖项，如清单\
  \ 7-3 所示。\n\n```\n{\n\"name\": \"NodeApp\",\n\"dependencies\": {\n\"express\": \"\
  ⁴.15.4\"\n}\n}\n清单 7-3。\n更新后的 package.json\n```\n\n这自然而然地引出了添加包的第三种方法，即直接更新 `package.json`\
  \ 文件。如果您在 Visual Studio 中执行此操作，您将获得包名称和版本号的自动补全功能；如图 7-3 所示。\n\n![A323824_2_En_7_Fig3_HTML.jpg](img/A323824_2_En_7_Fig3_HTML.jpg)\n\
  \n*图 7-3. 通过 package.json 安装 NPM 包*\n\n对于类型定义，该依赖项仅在开发时需要，在生产中不需要。您可以通过在包管理器 UI\
  \ 中选择 \"Development\" 依赖项类型，或者在运行安装命令时使用 `--save-dev` 标志（save 标志的变体）来将包标记为开发环境依赖。当通过\
  \ `package.json` 文件添加开发环境依赖时，它应该放在单独的 `devDependencies` 字典中。\n\n```\n{\n\"name\"\
  : \"NodeApp\",\n\"dependencies\": {\n\"express\": \"⁴.15.4\"\n},\n\"devDependencies\"\
  : {\n\"@types/node\": \"⁸.0.26\"\n}\n}\n清单 7-4。\n包含节点类型定义的更新后 package.json\n```\n\
  \n现在您已经成为 NPM 专家，您将能够添加创建可工作的 NodeJS Web 应用程序所需的任何依赖项，这正是本章的主题。\n\n## 简单的 Node 程序\n\
  \n现在项目已经设置好，可以通过一个简单的程序来演示 Node，该程序运行一个 Web 服务器并响应请求。HTTP 服务器只是将所有请求传递给您提供的回调函数。它没有内置的功能来处理不同的请求或路由，或帮助格式化响应（如果您需要这些功能，它们可以在中间件中获得，例如\
  \ Express，这将在本章后面介绍）。\n\n清单 7-5 展示了完整的程序，它创建了一个监听 8080 端口的 http 服务器。所有请求都被传递给 `requestListener`\
  \ 函数，该函数对所有请求给出一个标准的文本响应。`requestListener` 函数被传入两个参数，分别代表 `request` 和 `response`。可以从\
  \ `request` 参数获取信息，例如请求的方法、头部和正文。您可以向 `response` 参数的头部和正文添加内容。您必须通过调用 `response.end()`\
  \ 来表明操作已完成；否则 HTTP 服务器不会向客户端发送任何响应，导致客户端一直等待响应直至超时。\n\n一个引用注释用于指示 Node 类型定义的位置。这允许\
  \ `import` 语句引用 `http` 模块，该模块在项目中不是作为外部模块存在的——`http` 模块将在运行时由 Node 提供。\n\n```\n\
  /// <reference path=\"./node_modules/@types/node/index.d.ts\" />\nimport * as http\
  \ from 'http';\nconst portNumber = 8080;\nfunction requestListener(request: http.ServerRequest,\
  \ response: http.ServerResponse) {\nresponse.writeHead(200, { 'Content-Type': 'text/plain'\
  \ });\nresponse.write('Response Text Here');\nresponse.end();\n}\nhttp.createServer(requestListener).listen(portNumber);\n\
  console.log('Listening on localhost:' + portNumber);\n清单 7-5。\n一个简单的 Node 服务器\n\
  ```\n\n如果您将此示例代码放在名为 `app.ts` 的文件中，您可以从包含源代码的文件夹中运行命令 `node app.js` 来运行此清单中的 http\
  \ 服务器（注意，此命令中传递的是编译后的 JavaScript 文件，而不是 TypeScript 文件）。您应该会在命令窗口中看到消息 \"`Listening\
  \ on localhost:8080`\"，如图 7-4 所示。只要命令窗口保持打开状态，服务器就会一直运行。\n\n![A323824_2_En_7_Fig4_HTML.jpg](img/A323824_2_En_7_Fig4_HTML.jpg)\n\
  \n*图 7-4. 运行程序*\n\n要向服务器发出请求，请打开 Web 浏览器并在地址栏中输入 `localhost:8080`。您应该会收到 \"`Response\
  \ Text Here`\" 消息，如图 7-5 所示。因为所有对服务器的请求都被发送到同一个 `requestListener` 方法，所以您可以在 `localhost:8080`\
  \ 输入任何地址并收到相同的消息，例如 `localhost:8080/Some/Path/Here/` 或 `localhost:8080/?some=query&string=here`。\n\
  \n![A323824_2_En_7_Fig5_HTML.jpg](img/A323824_2_En_7_Fig5_HTML.jpg)\n\n*图 7-5. 从浏览器调用程序*\n\
  \n\n\n## 请求信息\n\n能够如此轻松地启动一个网络服务器固然很好，但几乎可以肯定，你会希望从请求中获取信息，以便提供与所请求内容相匹配的响应。清单 7-6\
  \ 展示了如何获取请求方法和所请求 URL 的信息，这些信息可用于路由请求或获取数据以查找匹配请求的数据。\n\n```\n/// \nimport * as\
  \ http from 'http';\nconst portNumber = 8080;\nfunction requestListener(request:\
  \ http.ServerRequest, response: http.ServerResponse) {\nresponse.writeHead(200,\
  \ { 'Content-Type': 'text/plain' });\nresponse.write('Method: ' + request.method\
  \ + '\\n');\nresponse.write('Url: ' + request.url + '\\n');\nresponse.write('Response\
  \ Text Here');\nresponse.end();\n}\nhttp.createServer(requestListener).listen(portNumber);\n\
  console.log('Listening on localhost:' + portNumber);\n```\n\n在这个例子中，从请求中获取的信息被简单地附加到响应中，以便在发出请求时在浏览器中向你展示这些信息。在地址栏中输入\
  \ `http://localhost:8080/Customers/Smith/John` 后，响应如图 7-6 所示。你可以使用请求的属性来决定如何处理该请求。\n\
  \n![A323824_2_En_7_Fig6_HTML.jpg](img/A323824_2_En_7_Fig6_HTML.jpg)\n\n虽然你可以利用这些信息编写自己的框架来处理发送到\
  \ Node 服务器的请求，但路由请求和从请求中获取信息的工作已经优雅地完成，并且可以作为模块通过 NPM 安装使用。除非你想利用请求信息做一些不寻常的事情，否则你会发现，使用一个为你的程序提供框架的现有模块可以节省时间和精力，同时还能涵盖你未曾计划到的场景。\n\
  \n下一节将介绍如何使用 Express 模块构建应用程序，这是一个轻量级的 Node 网络框架，它不会规定授权、持久化或模板化的具体细节。\n\n## 使用\
  \ Express 编写应用程序\n\n在 Node 中处理原始的请求和响应可以让你接触到 HTTP 通信的底层细节；但在大多数情况下，你并不想亲自处理所有细节。Express\
  \ 模块提供了一个轻量级框架，让你可以专注于应用程序本身，而不是路由和 HTTP 通信。Express 既是一种快速入门的方法，也是一个将你的程序整合在一起的稳健框架。\n\
  \n要使用 Express，你需要同时拥有 Express 依赖项和 Express 类型定义开发依赖项。清单 7-7 展示了该应用程序更完整的 `package.json`\
  \ 文件版本，其中包含了这两个依赖项。\n\n```\n{\n\"name\": \"node-app\",\n\"version\": \"0.0.1\",\n\
  \"description\": \"NodeApp\",\n\"main\": \"server.js\",\n\"author\": {\n\"name\"\
  : \"Steve Fenton\"\n},\n\"dependencies\": {\n\"express\": \"4.15.4\"\n},\n\"devDependencies\"\
  : {\n\"@types/node\": \"8.0.26\",\n\"@types/express\": \"4.0.37\"\n}\n}\n```\n\n\
  `package.json` 文件指出程序的入口点将是名为 `server.js` 的文件，并包含了 Express 依赖项以及来自 `@types` 组织的\
  \ node 和 express 类型定义。\n\n### 简单的 Express 程序\n\n清单 7-8 是基于 Express（而非 `http` 模块）的简单\
  \ Node 程序的更新版本。虽然大体模式相似，但 `requestListener` 是专门添加到应用程序根地址的 HTTP GET 方法上的。\n\n这意味着\
  \ `requestListener` 函数只会针对发送到 `http://localhost:8080/` 的请求被调用。与之前的例子不同，不匹配该路由的请求将会失败，例如，对\
  \ `http://localhost:8080/Customers` 的请求将收到一个 404 响应，并显示消息 \"`Cannot GET /Customers/Smith/John`\"\
  。\n\n```\nimport * as express from 'express';\nconst portNumber = 8080;\nconst app\
  \ = express();\napp.get('/', (request, response) => {\nresponse.send('You requested\
  \ ' + request.query.firstname + ' ' + request.query.lastname);\n})\napp.listen(portNumber,\
  \ 'localhost', () => {\nconsole.log('Listening on localhost:' + portNumber);\n});\n\
  ```\n\n对此示例的正确请求应包含 `firstName` 和 `lastName` 查询字符串参数。Express 将查询字符串映射到 `request.query`\
  \ 属性。完整的示例请求地址为 `http://localhost:8080/?firstname=John&lastname=Smith`，这将导致响应中返回消息\
  \ \"`You requested John Smith`\"，如图 7-7 所示。\n\n![A323824_2_En_7_Fig7_HTML.jpg](img/A323824_2_En_7_Fig7_HTML.jpg)\n\
  \n### 多路由\n\n你可以为程序中的不同路由提供不同的处理器，例如，清单 7-9 中的代码为 `http://localhost:8080/One/` 提供了一个处理器，为\
  \ `http://localhost:8080/Two/` 提供了另一个处理器。Express 为你处理所有路由，并确保正确的函数处理每个请求。\n\n```\n\
  import * as express from 'express';\nconst portNumber = 8080;\nconst app = express();\n\
  app.get('/', (request, response) => {\nresponse.send('You requested ' + request.query.firstname\
  \ + ' ' + request.query.lastname);\n})\napp.get('/One/', (request, response) =>\
  \ {\nresponse.send('You got handler One');\n});\napp.get('/Two/', (request, response)\
  \ => {\nresponse.send('You got handler Two');\n});\napp.listen(portNumber, 'localhost',\
  \ () => {\nconsole.log('Listening on localhost:' + portNumber);\n});\n```\n\n你可以像之前一样在浏览器中测试这些路由，并获得相应的响应：\n\
  \n- `http://localhost:8080/One/` -> \"You got handler One\"\n- `http://localhost:8080/Two/`\
  \ -> \"You got handler Two\"\n\n对未注册的路由发出的请求将导致 404 未找到响应。\n\n\n\n### 处理错误\n\n您可以为应用提供一个通用的错误处理器，只需向`app.use`方法传入一个接受四个参数的函数。在清单\
  \ 7-10 中，`handler`函数已被修改为故意抛出一个错误。该错误处理器通过`app.use`方法设置，在返回 500 响应码之前将错误记录到控制台。\n\
  \n```\nimport * as express from 'express';\nconst portNumber = 8080;\nconst app\
  \ = express();\napp.get('/', (request, response) => {\nthrow new Error('故意抛出的错误！');\n\
  })\napp.listen(portNumber, 'localhost', () => {\nconsole.log('正在监听 localhost:' +\
  \ portNumber);\n});\napp.use(function (error, request, response, next) {\nconsole.error(error.message);\n\
  response.status(500).send('发生了一个错误。');\n});\n清单 7-10.\n通用错误处理器\n```\n\n当您向此版本的应用程序发起请求时，命令窗口将显示完整的错误堆栈，但\
  \ Web 浏览器将显示通用错误信息，如图 7-8 所示。这种方式巧妙地让您能够利用完整的错误信息执行日志记录操作，同时不对外公开任何细节。\n\n![A323824_2_En_7_Fig8_HTML.jpg](img/A323824_2_En_7_Fig8_HTML.jpg)\n\
  \n图 7-8.\n\n浏览器中的通用错误\n\n此示例中的错误处理器很好地演示了 Express 中的中间件概念，这是一组组织成责任链的函数。每个中间件都可以对请求和响应进行操作，使您能够分离横切关注点。在实践中，这意味着您可以避免一个同时负责日志记录、授权和错误处理的处理器，而是为这些职责分别提供独立的中间件。\n\
  \n您可以通过调用`app.use`来添加中间件，其中`app`是您的 Express 应用程序名称。您作为中间件传入的函数必须遵循以下两种签名之一：\n\n\
  *   请求处理器: `(request: Request, response: Response, next: NextFunction) => void`;\n\
  *   错误请求处理器: `(error: any, request: Request, response: Response, next: NextFunction)\
  \ => void;`\n\n每个中间件会依次被调用，并且必须使用`next()`函数调用下一个中间件，或者结束响应。如果没有中间件结束响应，结果将是 404\
  \ 错误。\n\n### Express 书籍项目\n\n现在我们已经介绍了 Node 和 Express 的基本概念，我们将通过一个小型示例应用程序将所有内容整合起来。要跟随操作，您需要安装一些免费软件和一些\
  \ NPM 包。该应用程序将包含多个路由，收集用户输入的数据，并将信息存储在数据库中。\n\n*   来自[`www.mongodb.com/download-center`](http://www.mongodb.com/download-center)的\
  \ MongoDB 社区服务器；\n*   清单 7-11 中所示的 NPM 包。\n\n为了创建应用程序，您将使用 NPM 中的几个额外包，这将使开发更快更简单。安装清单\
  \ 7-11 中`package.json`文件所列的依赖项。这些额外的包有助于解析回传到服务器的表单、与 MongoDB 数据库通信，以及解析我们使用 Pug（一种简单的\
  \ HTML 模板语言）编写的视图。\n\n```\n{\n\"name\": \"pro-typescript-book-app\",\n\"version\"\
  : \"0.0.1\",\n\"description\": \"一个示例书籍应用程序\",\n\"main\": \"server.js\",\n\"types\"\
  : \"server.d.ts\",\n\"author\": {\n\"name\": \"Steve.Fenton\"\n},\n\"dependencies\"\
  : {\n\"body-parser\": \"1.17.2\",\n\"express\": \"4.15.4\",\n\"method-override\"\
  : \"2.3.9\",\n\"mongoose\": \"4.11.9\",\n\"pug\": \"2.0.0-rc.3\"\n},\n\"devDependencies\"\
  : {\n\"@types/body-parser\": \"1.16.5\",\n\"@types/express\": \"4.0.37\",\n\"@types/method-override\"\
  : \"0.0.30\",\n\"@types/mongoose\": \"4.7.21\",\n\"@types/node\": \"8.0.26\",\n\"\
  @types/pug\": \"2.0.4\"\n}\n}\n清单 7-11.\n额外依赖项\n```\n\n应用程序的主入口点将是服务器文件，如清单 7-12\
  \ 所示。此文件包含运行整个应用程序所需的所有依赖项，并有一个根路由用于处理对首页的请求。视图引擎也设置为使用 Pug，模板位于`\"views\"`文件夹中。\n\
  \n```\nimport * as express from 'express';\nimport * as http from 'http';\nimport\
  \ * as path from 'path';\nimport * as bodyParser from 'body-parser';\nimport * as\
  \ methodOverride from 'method-override';\nimport * as routes from './routes/index';\n\
  const portNumber = 8080;\nconst app = express();\napp.set('port', portNumber);\n\
  // 配置视图模板\napp.set('views', path.join(__dirname, 'views'));\napp.set('view engine',\
  \ 'pug');\nhttp.createServer(app).listen(app.get('port'), () => {\nconsole.log('Express\
  \ 服务器正在监听端口 ' + app.get('port'));\n});\napp.use(bodyParser.json());\napp.use(bodyParser.urlencoded({\
  \ extended: true }));\napp.use(methodOverride());\n// 路由\napp.get('/', routes.index);\n\
  // 静态文件，例如 .css 文件\napp.use(express.static('.'));\n清单 7-12.\nServer.ts\n```\n\n\
  处理首页的函数未直接放置在服务器文件中，而是被放在了一个模块中，该模块位于一个包含所有路由处理器的文件夹内。随着应用程序的增长，以这种方式组织代码将使每个文件保持小巧且易于维护。首页路由处理器的内容如清单\
  \ 7-13 所示，它有一个导出函数，该函数使用一个小的数据模型来渲染响应。\n\n```\nimport * as express from 'express';\n\
  /* GET 首页. */\nexport function index(request: express.Request, response: express.Response)\
  \ {\nresponse.render('index', { title: 'Express' });\n};\n清单 7-13.\n/routes/index.ts\n\
  ```\n\n由于我们将 Pug 设置为视图引擎，因此需要提供一个用于首页的模板文件。文件名应与清单 7-13 中调用`response.render`时使用的名称一致。首页的\
  \ Pug 视图如清单 7-14 所示。该模板继承了一个共享布局，这个共享布局可用于为所有页面或页面组提供一致的 HTML 布局。首页模板在共享布局的`\"content\"\
  `区域中插入了一个标题、一个段落和一个锚点标签。\n\n\n```content\n```\nextends layout\nblock content\nh1=\
  \ title\np Welcome to #{title}\na(href='/book') Books\n代码清单 7-14.\n首页的 Pug 模板\n\
  ```\n\n共享布局模板如代码清单 7-15 所示，这是一个简单的 HTML 文档，包含标题、样式表以及一个可供子模板填充的内容块。\n\n```\ndoctype\
  \ html\nhtml\nhead\ntitle= title\nlink(rel='stylesheet', href='/style.css')\nbody\n\
  block content\n代码清单 7-15.\nPug 模板的共享布局\n```\n\n简易样式表的 CSS 代码如代码清单 7-16 所示。可将其放置在根目录下名为`style.css`的文件中。由于我们通过`app.use(express.static('.'));`配置\
  \ Express 服务器处理静态文件，对样式表的请求将由静态文件中间件处理。如果没有这个中间件，即使服务器上确实存在该文件，对样式表的请求也会导致 404 错误。\n\
  \n```\nbody {\npadding: 50px;\nfont: 14px \"Lucida Grande\", Helvetica, Arial, sans-serif;\n\
  }\na {\ncolor: #00B7FF;\n}\n代码清单 7-16.\n样式表\n```\n\n您可以使用代码清单 7-17 所示的命令来运行 Express\
  \ 服务器。服务器启动后，在浏览器中访问`localhost:8080`即可查看页面。\n\n```\nnode server.js\n代码清单 7-17.\n\
  运行 Express 服务器\n```\n\n您应该会看到如图 7-9 所示的输出，这意味着路由、路由处理器、视图模板和样式表均已成功加载。如果点击书籍链接，您将收到一个错误，因为该路由尚未设置处理器。\n\
  \n![A323824_2_En_7_Fig9_HTML.jpg](img/A323824_2_En_7_Fig9_HTML.jpg)\n\n图 7-9.\n\
  首页\n\n目前这个示例演示了如何将路由处理器分离到独立模块中，如何使用 Pug 模板创建视图，以及如何通过中间件启用静态文件。接下来我们将探讨如何连接数据库以存储和检索数据。\n\
  \n#### 添加书籍路由\n\n为了管理书籍列表，应用程序需要支持`/book`路由。要支持一个典型的路由，您需要添加路由处理器模块、Pug 模板，并在 Express\
  \ 应用程序中引用该路由处理器。\n\n代码清单 7-18 展示了处理`/book`地址请求的`book.ts`文件的起始版本。与所有请求处理器一样，`list`函数包含`request`和`response`参数。该处理器对结果调用`response.render`方法，并传入视图名称以及表示待显示数据的模型对象。\n\
  \n```\nimport * as express from 'express';\ndeclare var next: (error: any) => void;\n\
  /* GET /book */\nexport function list(request: express.Request, response: express.Response)\
  \ {\nresponse.render('book', { 'title': 'Books', 'books': [] });\n};\n代码清单 7-18.\n\
  routes/book.ts 文件\n```\n\n为使该处理器正常工作，views 文件夹中必须存在指定名称的视图。代码清单 7-19 展示了`book.pug`模板，它将渲染由请求处理器提供的数据。该模板复用了`layout.pug`文件（这是应用程序的默认布局），并从模型对象中渲染`title`。\n\
  \n```\nextends layout\nblock content\nh1= title\np Welcome to the #{title} page.\n\
  p #{message}\n代码清单 7-19.\nviews/book.pug 文件\n```\n\n要在应用程序中注册此路由，您需要修改`server.ts`文件：添加引用`book.ts`文件的导入语句，并添加路由注册代码。代码清单\
  \ 7-20 展示了将`/book`地址链接到包含请求处理器的`book.ts`文件所需添加的两行代码。\n\n```\nimport * as book from\
  \ './routes/book';\n// ...\n// routes\napp.get('/', routes.index);\napp.get('/book',\
  \ book.list);\n代码清单 7-20.\n对 server.ts 文件的补充\n```\n\n当您运行应用程序并在 Web 浏览器中访问`/book`地址时，应该会看到一个显示“Welcome\
  \ to the Books page.”消息的页面。如果无法访问新页面，请检查命令窗口以查看错误信息。最常见的错误是拼写错误，例如意外地将视图名称输入为`'books'`，而正确的名称应为`'book'`。\n\
  ```\n\n\n### 收集数据\n\n存储数据的第一步是提供一个允许用户输入信息的表单。列表 7-21 展示了更新后的 `book.pug` 模板，该模板现在包含一个表单，用于接收书名、作者以及可选的图书\
  \ ISBN 标识符。\n\nHTML 属性通过在元素名称后的括号中附加相应内容来添加到元素中。每个输入框的 `type` 和 `name` 属性都通过这种方式添加。列表中值得注意的属性是\
  \ ISBN 输入框上的 `pattern` 属性。ISBN 不是必填项，但如果填写了，则必须匹配该属性中提供的模式。\n\n```\nextends layout\n\
  block content\nh1= title\np Welcome to the #{title} page.\np #{message}\nform(method='post')\n\
  fieldset\nlegend Add a Book\ndiv\nlabel Title *\nbr\ninput(type='text', name='book_title',\
  \ required)\ndiv\nlabel Author *\nbr\ninput(type='text', name='author', required)\n\
  div\nlabel ISBN\nbr\ninput(type='text', name='book_isbn', pattern='(?:(?=.{17}$)97[89]\
  \ -{2}[0-9]+[ -][0-9]|97[89][0-9]{10}|(?=.{13}$)(?:[0-9]+[ -]){2}[0-9]+[ -][0-9Xx]|[0-9]{9}[0-9Xx])')\n\
  div\nbutton Save\n列表 7-21.\n向 Pug 视图添加表单\n```\n\n如果您担心需要编写像上面那个能接受各种 ISBN 格式的复杂模式，别担心，这个模式以及许多其他模式都可以在\
  \ HTML5 模式库 [`http://html5pattern.com/`](http://html5pattern.com/) 中找到。当您向输入元素添加\
  \ `pattern` 属性时，输入的文本将会被验证是否与表达式匹配。\n\n为了在表单提交时对其进行处理，必须在 `routes` 目录下的 `book.ts`\
  \ 文件中添加一个处理表单 POST 请求的函数。列表 7-22 展示了包含 `submit` 函数的更新后文件。在此阶段，该函数仅向视图提供一条消息，确认由于尚未建立数据库，因此没有保存任何数据。数据库将在下一节中添加。\n\
  \n```\nimport * as express from 'express';\ndeclare var next: (error: any) => void;\n\
  /* GET /book */\nexport function list(request: express.Request, response: express.Response)\
  \ {\nresponse.render('book', { 'title': 'Books', 'books': [] });\n};\n/* POST /book\
  \ */\nexport function submit(request: express.Request, response: express.Response)\
  \ {\nconst newBook = new Book({\ntitle: request.body.book_title,\nauthor: request.body.author,\n\
  isbn: request.body.book_isbn\n});\nresponse.render('book', { title: 'Books', 'books':\
  \ [newBook] });\n}\n列表 7-22.\n向 book.ts 文件添加处理程序\n```\n\n要将表单 POST 请求发送到 `submit`\
  \ 函数，必须在 `app.ts` 文件中注册路由。列表 7-23 展示了更新后的路由，其中包含新的 POST 路由，该路由会将匹配的请求转发给 `book.submit`\
  \ 函数处理。\n\n```\n// routes\napp.get('/', routes.index);\napp.get('/book', book.list);\n\
  app.post('/book', book.submit);\n列表 7-23.\napp.ts 文件中更新后的路由\n```\n\n如果您编译并运行更新后的应用程序，并访问\
  \ `/book` 地址，您应该会看到允许添加图书的表单。您只有在同时提供书名和作者时才能提交表单。如果您在可选的 ISBN 输入框中输入任何值，则该值必须是有效的格式，例如\
  \ 10 位的 `0-932633-42-0` 或 13 位的 `9780932633422`。\n\n![A323824_2_En_7_Fig10_HTML.jpg](img/A323824_2_En_7_Fig10_HTML.jpg)\n\
  \n图 7-10.\n\n图书页面\n\n当您成功提交表单后，结果尚未保存到数据库中。开发此应用程序的下一步是持久化数据，以便将来能够可靠地检索数据。\n\n\
  ### 安装 Mongoose\n\n在 Node 应用程序中存储数据有多种选择。您可以使用文件系统、关系型数据库（如 MySQL）或 NoSQL 数据库（如\
  \ MongoDB）。在此示例中，MongoDB 将与 Mongoose 配合使用，为应用程序提供数据访问。Mongoose 可以简化验证、查询和类型转换等处理过程。\n\
  \n在您按照本节代码操作之前，需要先设置好数据库。要为您选择的平台下载 MongoDB，请访问 [`https://www.mongodb.com/download-center`](https://www.mongodb.com/download-center)\
  \ 。下载内容只是一个针对您所选平台的简单安装程序。\n\nMongoDB 将您的数据存储在文件系统上，因此您需要设置一个用于存储的文件夹。默认情况下，MongoDB\
  \ 会查找 `c:\\data\\db` 目录，因此您应该在进行下一步之前添加此目录。如果您不添加此文件夹，尝试启动 MongoDB 服务器时会立即停止。如果您愿意，也可以将数据放在不同的目录中。在启动数据库服务器时，您还需要提供\
  \ MongoDB 的路径。现在，只需添加默认目录即可。\n\n要启动 MongoDB 数据库服务器，请在命令窗口中运行列表 7-24 中显示的代码。此命令是针对\
  \ MongoDB 3.4 版本编写的，因此如果您使用的是不同版本，则需要更改路径。\n\n```\nC:\\Program Files\\MongoDB\\\
  Server\\3.4\\bin\\mongod.exe\n列表 7-24.\n运行数据库服务器\n```\n\n您应该会收到一条消息，提示服务器正在“等待端口\
  \ [number] 上的连接”。此消息中显示的数字（通常为 27017）在您从应用程序连接数据库时需要用到。如果遇到任何错误，请仔细检查您是否已设置好 `c:\\\
  data\\db` 目录。\n\nMongoose 模块和类型定义应该已经可用，因为在本章开头已将其添加到 `package.json` 中。现在，您应该已准备好开始保存数据所需的一切。下一节将逐步介绍对\
  \ Express Book 项目所做的更改，以存储和检索用户输入的图书。\n\n\n\n### 存储数据\n\n为了存储用户提交新书时接收到的数据，必须修改\
  \ `routes` 目录中的 `book.ts` 文件，以调用新安装的数据库。\n\n清单 7-25 展示了更新后的处理器：`list` 处理器，用于显示数据库中的书籍；以及\
  \ `submit` 处理器，用于保存新的提交。连接数据库的代码位于函数外部，并在两者之间共享。下文详细介绍了所有更改。\n\n```typescript\n\
  import * as express from 'express';\nimport * as mongoose from 'mongoose';\ndeclare\
  \ var next: (error: any) => void;\n// MongoDB 通常运行在 27017 端口\nmongoose.connect('mongodb://localhost:27017/books',\
  \ { useMongoClient: true });\n// 定义一本图书\ninterface Book extends mongoose.Document\
  \ {\ntitle: string;\nauthor: string;\nisbn: string;\n}\n// 定义图书数据库的模式\nconst bookSchema\
  \ = new mongoose.Schema({\ntitle: String, author: String, isbn: String\n});\nconst\
  \ Book = mongoose.model('Book', bookSchema);\n/* GET /book */\nexport function list(request:\
  \ express.Request, response: express.Response) {\nBook.find({})\n.then((res) =>\
  \ {\nresponse.render('book', { 'title': 'Books', 'books': res });\n})\n.catch((err)\
  \ => {\nreturn next(err);\n});\n};\n/* POST /book */\nexport function submit(request:\
  \ express.Request, response: express.Response) {\nconst newBook = new Book({\ntitle:\
  \ request.body.book_title,\nauthor: request.body.author,\nisbn: request.body.book_isbn\n\
  });\nnewBook.save()\n.then((res) => {\nresponse.redirect('/book');\n})\n.catch((err)\
  \ => {\nreturn next(err);\n});\n}\n```\n\n*清单 7-25. 更新后的 `routes/book.ts` 文件*\n\n\
  数据库连接是通过 `mongoose.connect` 调用建立的。示例中的连接字符串使用端口 27017；你应该使用启动 `MongoDB` 服务器时显示的端口号。当你的应用程序连接到数据库时，每次连接都会记录在\
  \ `MongoDB` 命令窗口中。\n\n`bookSchema` 变量被分配了一个新的 Mongoose 模式。此模式定义了要存储在集合中的文档形状。Mongoose\
  \ 会为你设置 MongoDB 集合，并可以处理默认值和验证。图书模式使用 `title`、`author` 和 `isbn` 属性设置，这些属性都被分配了 `String`\
  \ 类型。模式的定义与 TypeScript 类型注解惊人地相似。由于语句的上下文，TypeScript 编译器足够智能，能够识别出它们不是类型注解；因此，它不会使用类型擦除将其从编译输出中移除。这里的\
  \ `String` 类型并不是 TypeScript 中支持 `string` 类型注解的 `String` 接口，而是 `mongoose.Schema.Types.String`。如果你不小心使用了小写的\
  \ `string` 类型，编译器会给出关于此错误的警告。\n\n`Book` 变量被分配了 Mongoose 创建的模型对象。这让你不必自己实现 `Book`\
  \ 类。你可以使用此模型在需要时创建新的图书实例，就像编写了自己的类一样。\n\n虽然这花了几段文字来解释，但值得重新审视代码清单，以确认仅用三行代码就可以连接到数据库并为图书数据设置模式。此设置用于处理请求的两个函数中。\n\
  \n`list` 函数调用 Mongoose 提供的 `Book.find` 方法来检索记录。你可以向 `find` 方法提供一个对象来过滤结果。该对象可以是图书模式的部分匹配。例如，你可以使用\
  \ `{ author: 'Robert C. Martin' }` 来检索鲍勃大叔的所有书籍。在示例中，空对象表示你想要集合中的所有文档。\n\n由于查询是异步执行的，依赖于结果的代码应放在相应的\
  \ `then` 块中。如果你忘记将代码放在 `then` 块内，响应会在查询完成之前发送。错误使用 `catch` 块处理。`books` 集合被添加到传递给视图的模型对象中。\n\
  \n> **注：** 虽然示例使用空对象查询集合并检索所有书籍，但随着数据库中书籍数量的增加，此查询会变得越来越慢。你可以使用 `skip` 和 `limit`\
  \ 查询方法对结果进行分页。\n\n`submit` 函数使用用户提交的数据实例化一个新的 `Book` 对象，然后调用 Mongoose 提供的 `save`\
  \ 方法。再次强调，数据库调用是异步的，并使用 Promise 在查询完成后继续执行。在代码清单中，当记录成功保存后，响应仅仅是重定向到 `list` 操作。在提交后重定向请求可以防止用户通过刷新浏览器意外地重新提交相同的数据。成功提交后重定向的模式称为“提交后重定向获取”模式。\n\
  \n现在路由处理器已将图书数据传递给视图，可以更新视图以显示数据。添加表格所需的额外标记如清单 7-26 所示。\n\n```pug\ntable\nthead\n\
  tr\nth 标题\nth 作者\nth ISBN\ntbody\nif books\neach book in books\ntr\ntd= book.title\n\
  td= book.author\ntd= book.isbn\n```\n\n*清单 7-26. Pug 表格模板*\n\nPug 模板中的 `each` 循环会为\
  \ `books` 集合中的每一项重复输出嵌套内容。表格单元格使用速记语法（元素名称后跟 `=`）声明。这意味着数据变量无需像标题那样用通常的 `#{}` 分隔符括起来。\n\
  \nPug 的 `each` 循环可以处理空数组，但无法处理未定义的值。示例中 `each` 循环前的 `if` 语句可防止未定义的值传入 `each` 循环。\n\
  \n现在你拥有了一个功能完备的应用程序，可以保存和显示书籍。你可以在表单中输入一本书，如图 7-11 所示。\n\n![A323824_2_En_7_Fig11_HTML.jpg](img/A323824_2_En_7_Fig11_HTML.jpg)\n\
  \n*图 7-11. 完成的图书表单*\n\n当你点击保存按钮时，你的书籍将被存储，并且你将看到图 7-12 中的页面。你可以随时返回应用程序，已存储的书籍仍然可用。\n\
  \n![A323824_2_En_7_Fig12_HTML.jpg](img/A323824_2_En_7_Fig12_HTML.jpg)\n\n*图 7-12.\
  \ 已存储的书籍*\n\n存储在 MongoDB 中的数据是持久化的，这意味着你可以重启机器，数据仍然会被保存。这为你提供了一个永久存储，除非发生彻底的机器故障，在这种情况下，你可能需要考虑合适的数据备份策略。你可以在\
  \ [`https://docs.mongodb.com/manual/core/backups/`](https://docs.mongodb.com/manual/core/backups/)\
  \ 找到更多关于 MongoDB 备份方法的信息。\n\n\n\n## 摘要\n\nJavaScript 对于 Web 服务器而言并不陌生，并且得益于 Node\
  \ 以及通过 Node 包管理器（NPM）提供的成千上万个模块，它已经获得了极大的关注。随着在 Node 上运行的程序规模越来越大，TypeScript 所提供的语言特性和工具的价值也迅速提升。大量的时间可能会浪费在简单的错误上，例如将依赖于异步调用的代码放置在回调函数之外，或者在使用\
  \ `String` 的地方错误地使用了 `string`，而 TypeScript 可以帮助你避免这些常见错误。\n\nExpress 框架是快速上手 Node\
  \ 的一种方式，并且能为那些使用过 Sinatra（或 .NET 中的 Nancy）的程序员提供一些熟悉感。即使对于那些不熟悉这种特定实现风格的开发者来说，路由处理器和视图的分离也大概率是能够识别的。与在\
  \ Node 中处理底层 HTTP 请求和响应相比，使用 Express 将提升你的生产力。\n\n`Mongoose` 对数据库扮演着类似的角色，它提供了许多能提升生产力的快捷方式。如果你想降低一个层级，通过直接调用\
  \ MongoDB 来存储和检索数据以自行处理模型和验证，MongoDB 也并非特别复杂。\n\n尽管本章愉快的沿用了许多 Express 自带的默认设置，但你并不局限于使用这些默认值。只需一行代码即可轻松替换模板引擎和中间件。\n\
  \n## 要点\n\n- JavaScript 在 Web 服务器上运行已有超过 20 年的历史。\n- Node 可以在任何平台上顺利运行。\n- 你可以从\
  \ NPM 中的 `@types` 组织获取 Node 及许多 Node 模块的类型信息。\n- Express 提供了一个轻量级且灵活的应用程序框架，比使用底层\
  \ Node HTTP 请求和响应更容易。\n- Mongoose 和 MongoDB 通过异步 API 提供了简单的持久化功能。\n\n"
- "# 异常、内存与性能\n\n> 异常处理程序的首要职责是把错误从程序员的手中拿出来，然后放到用户那惊讶的脸上。只要牢记这条基本原则，你就不会出大错。 ——维里蒂·斯托布\n\
  \n尽管缺乏语言特性或运行时环境的吸引力，但理解异常和内存管理将帮助你编写出更好的 TypeScript 程序。JavaScript 和 TypeScript\
  \ 中的异常对于使用过 C#、Java、PHP 或许多其他语言的程序员来说可能看起来熟悉，但存在一些细微却重要的差异。异常处理和内存管理这两个主题是密不可分的，因为它们共享一个语言特性，这将在本章后面进行描述。\n\
  \n内存管理这个主题常常被各种传说、谬误和盲目应用的“最佳实践”所主导。本章涉及内存管理和垃圾回收的事实，并解释了如何通过测量数据来检验你的优化想法，而不是应用一个可能收效甚微（甚至比原始代码性能更差）的实践。这将会简要地引出性能这个话题。\n\
  \n## 异常\n\n异常用于指示程序或模块无法继续处理。顾名思义，它们只应在真正异常的情况下被触发。因此得名！通常，异常用于指示程序状态无效或继续处理不安全。\n\
  \n尽管当某个例程接收到一个不合规的值作为参数时，你可能很想抛出异常，但通常更优雅的做法是在不引发异常的情况下处理那些你能预见到的输入。\n\n当你的程序遇到异常时，除非在代码中被处理，否则该异常会显示在控制台中。控制台允许程序员写入消息，并且会自动记录程序运行期间发生的任何异常。\n\
  \n你可以在所有现代 Web 浏览器中检查控制台以查看异常。快捷键因浏览器而异，也因平台而异，但如果 `CTRL + SHIFT + I` 在你的 Windows\
  \ 或 Linux 机器上不起作用，或者 `CMD + OPT + I` 在你的 Mac 上不起作用，你可以尝试 `F12` 键，或者在浏览器的菜单中找到列在“开发者工具”、“浏览器控制台”或类似名称下的工具。对于\
  \ Node 来说，错误和警告输出将出现在你用来运行 HTTP 服务器的控制台窗口中。\n\n\n\n### 抛出异常\n\n要在 TypeScript 程序中引发异常，你需要使用\
  \ `throw` 关键字。虽然你可以在此关键字后跟随任何对象，但最好提供一个包含错误消息的字符串，或者一个包装了错误消息的 `Error` 对象实例。\n\n\
  清单 8-1 展示了为避免不可接受的输入值而抛出的典型异常。当调用 `errorsOnThree` 函数并传入一个数字时，它会返回该数字，除非传入的数字是 3，在这种情况下会引发异常。\n\
  \n```\nfunction errorsOnThree(input: number) {\n  if (input === 3) {\n    throw\
  \ new Error('Three is not allowed');\n  }\n  return input;\n}\nconst result = errorsOnThree(3);\n\
  清单 8-1.\n使用 throw 关键字\n```\n\n此示例中的通用 `Error` 类型可以替换为自定义异常。你可以使用一个实现了 `Error` 接口的类来创建自定义异常，如清单\
  \ 8-2 所示。`Error` 接口确保你的类具有 `name` 和 `message` 属性。\n\n清单 8-2 中的 `toString` 方法并非 `Error`\
  \ 接口所必需，但在许多情况下用于获取错误的字符串表示形式。如果没有此方法，将调用 `Object` 的 `toString` 默认实现，这会在控制台输出“`[object\
  \ Object]`”。通过向 `ApplicationError` 类添加 `toString` 方法，你可以确保在抛出并记录异常时显示适当的消息。\n\n\
  ```\nclass ApplicationError implements Error {\n  public name = 'ApplicationError';\n\
  \  constructor(public message: string) {\n    if (typeof console !== 'undefined')\
  \ {\n      console.log(`Creating ${this.name} \"${message}\"`);\n    }\n  }\n  toString()\
  \ {\n    return `${this.name}: {this.message}`;\n  }\n}\n清单 8-2.\n自定义错误\n```\n\n\
  你可以在 `throw` 语句中使用自定义异常来对已发生的错误类型进行分类。一种常见的异常模式是创建一个通用的 `ApplicationError` 类，并通过继承它来创建更具体的错误类型。任何处理异常的代码随后都可以根据抛出的错误类型采取不同的操作，如下面有关异常处理的章节所示。\n\
  \n清单 8-3 展示了一个特定的 `InputError` 类，它继承自 `ApplicationError` 类。`errorsOnThree` 函数使用\
  \ `InputError` 异常类型来强调该错误是由于输入数据错误而引发的。\n\n```\nclass ApplicationError implements\
  \ Error {\n  public name = 'ApplicationError';\n  constructor(public message: string)\
  \ {\n    if (typeof console !== 'undefined') {\n      console.log(`Creating ${this.name}\
  \ \"${message}\"`);\n    }\n  }\n  toString() {\n    return `${this.name}: {this.message}`;\n\
  \  }\n}\nclass InputError extends ApplicationError {\n}\nfunction errorsOnThree(input:\
  \ number) {\n  if (input === 3) {\n    throw new InputError('Three is not allowed');\n\
  \  }\n  return input;\n}\n清单 8-3.\n使用继承创建特殊异常类型\n```\n\n示例中的 `InputError` 只是扩展了\
  \ `ApplicationError`；它不需要实现任何属性或方法，因为它仅用于在你的程序中提供异常类别。你可以创建扩展 `ApplicationError`\
  \ 的异常类，或者进一步特化 `ApplicationError` 的子类。\n\n注意\n\n你应该将原生的 `Error` 类型视为神圣不可侵犯，并且永远不要抛出这种类型的异常。通过创建作为\
  \ `ApplicationError` 类子类的自定义异常，你可以确保 `Error` 类型保留给你的代码在真正特殊的异常情况之外使用。\n\n### 异常处理\n\
  \n当抛出异常时，除非该异常被处理，否则程序将会终止。要处理异常，你可以使用 `try-catch` 块、`try-finally` 块，甚至是 `try-catch-finally`\
  \ 块。在任何这些情况下，可能导致抛出异常的代码都被包裹在 `try` 块内。\n\n清单 8-4 展示了一个 `try-catch` 块，它处理了来自上一节\
  \ `errorsOnThree` 函数的错误。`catch` 块接受的参数代表被抛出的对象，例如，`Error` 实例或自定义的 `ApplicationError`\
  \ 对象，具体取决于你在 `throw` 语句中使用了哪一个。\n\n```\ntry {\n  const result = errorsOnThree(3);\n\
  } catch (err) {\n  console.log('Error caught, no action taken');\n}\n清单 8-4.\n无条件\
  \ catch 块\n```\n\n`err` 参数的作用域限定在 `catch` 块内，使其等同于使用 `let` 关键字声明的变量，而不是 `var` 关键字，如第\
  \ 4 章所述。\n\n在支持 `try-catch` 块的语言中，通常允许捕获特定的异常类型。这允许 `catch` 块仅适用于特定类型的异常，而对于其他类型的异常，其行为就像没有\
  \ `try-catch` 块一样。建议使用此技术来确保你只处理那些你知道可以恢复的异常，让真正意外的异常终止程序，以防止状态的进一步损坏。\n\n目前没有符合标准的方法来有条件地捕获异常，这意味着你要么捕获所有异常，要么一个都不捕获。如果你只想处理特定类型的异常，可以在\
  \ `catch` 语句中检查类型，并重新抛出任何不匹配类型的错误。\n\n清单 8-5 展示了一个异常处理例程，它处理 `ApplicationError`\
  \ 自定义异常，但重新抛出任何其他类型。在 `if-statement` 内部，`err` 变量的类型被收窄为 `ApplicationError` 类型。\n\
  \n```\ntry {\n  const result = errorsOnThree(3);\n} catch (err) {\n  if (err instanceof\
  \ ApplicationError) {\n    console.log('Error caught, no action taken');\n  }\n\
  \  throw err;\n}\n清单 8-5.\n检查错误的类型\n```\n\n注意\n\n通过仅处理自定义异常，你可以确保只处理你知道可以恢复的异常类型。如果你使用默认的\
  \ `catch` 块而不进行 `instanceof` 检查，你将负责处理程序中可能发生的每种类型的异常。\n\n此示例将允许 catch 块处理 `ApplicationError`\
  \ 或 `ApplicationError` 的子类（例如本章前面描述的 `InputError`）。为了说明在类层次结构的不同级别处理异常的效果，图 8-1\
  \ 展示了一个更复杂的层次结构，它扩展了 `ApplicationError` 和 `InputError` 类。\n\n![A323824_2_En_8_Fig1_HTML.jpg](img/A323824_2_En_8_Fig1_HTML.jpg)\n\
  \n图 8-1.\n\n错误类层次结构\n\n当你选择处理 `InputError` 类别的异常时，你将处理如图 8-2 所示的四种异常：`InputError`、`BelowMinError`、`AboveMaxError`\
  \ 和 `InvalidLengthError`。所有其他异常将被传递给调用栈，就像它们未被处理一样。\n\n![A323824_2_En_8_Fig2_HTML.jpg](img/A323824_2_En_8_Fig2_HTML.jpg)\n\
  \n图 8-2.\n\n处理 InputError 异常\n\n如果你要处理 `ApplicationError` 类别的异常，你将处理层次结构中的所有七个自定义异常，如图\
  \ 8-3 所示。\n\n![A323824_2_En_8_Fig3_HTML.jpg](img/A323824_2_En_8_Fig3_HTML.jpg)\n\
  \n图 8-3.\n\n处理 ApplicationError 异常\n\n\n\n一般而言，你处理的异常应随着程序深入而更加具体。若你在底层代码附近工作，应处理非常具体的异常类型；当工作靠近用户界面时，则应处理更通用的异常。\n\
  \n异常问题将在讨论性能时再次出现，因为在程序中创建和处理异常会带来性能开销。尽管如此，如果你仅用它来指示例程无法继续执行，则无需担心其运行时成本。\n\n##\
  \ 内存\n\n当你使用 TypeScript 或 JavaScript 这类高级语言编写程序时，你将受益于自动内存管理。你创建的所有变量和对象都会自动管理，因此永远不会出现越界、悬空指针或变量损坏的问题。事实上，所有可能遇到的可管理内存问题都已为你处理妥当。然而，仍有一些内存安全类别无法自动处理，例如系统资源耗尽、无法继续处理的内存不足错误。\n\
  \n本节将介绍你可能遇到的问题类型，以及避免这些问题所需掌握的知识。\n\n### 释放资源\n\n在 TypeScript 中，你不太可能遇到非托管资源。大多数\
  \ API 遵循异步模式，接受一个在操作完成时被调用的方法参数。现代 API 会通过 promise 暴露此功能。因此，你的程序永远不需要直接持有非托管资源的引用。例如，如果你想使用检测物体是否靠近传感器的接近\
  \ API，可以使用清单 8-6 中的代码。\n\n```\nconst sensorChange = function (reading) {\nconst\
  \ proximity = reading.near\n? 'Near'\n: 'Far';\nalert(proximity);\n}\nwindow.addEventListener('userproximity',\
  \ sensorChange, true);\n清单 8-6.\n异步模式\n```\n\n异步模式意味着，虽然你可以从接近传感器获取信息，但程序永远不必负责资源或通信渠道。如果你恰好遇到必须管理资源引用的情况，应使用\
  \ `try-finally` 块来确保资源被释放，即使发生错误也不例外。\n\n清单 8-7 中的示例假设可以直接操作接近传感器来获取读数。\n\n```\n\
  const sensorChange = function (reading) {\nvar proximity = reading.near ?\n'Near'\
  \ : 'Far';\nalert(proximity);\n}\nconst readProximity = function () {\nconst sensor\
  \ = new ProximitySensor();\ntry {\nsensor.open();\nconst reading = sensor.read();\n\
  sensorChange(reading);\n} finally {\nsensor.close();\n}\n}\nwindow.setInterval(readProximity,\
  \ 500);\n清单 8-7.\n假设的非托管接近传感器\n```\n\n`finally` 块将确保调用传感器的 `close` 方法，从而执行清理并释放所有资源。即使调用\
  \ `read` 方法或 `sensorChange` 函数时发生错误，`finally` 块也会执行。\n\n对于类似 promise 的接口，其等效示例如清单\
  \ 8-8 所示。使用 promise 时，通常要么执行 `then` 块，要么在出错时执行 `catch` 块。而 `finally` 块在所有情况下都会被调用。\n\
  \n```\nconst sensorChange = function (reading) {\nvar proximity = reading.near ?\n\
  'Near' : 'Far';\nalert(proximity);\n}\nconst readProximity = function () {\nconst\
  \ sensor = new ProximitySensor();\nsensor.open()\n.then(() => {\nreturn sensor.read();\n\
  })\n.then((reading) => {\nsensorChange(reading);\n})\n.finally(() => {\nsensor.close();\n\
  });\n}\nwindow.setInterval(readProximity, 500);\n清单 8-8.\n使用类似 promise 接口的非托管接近传感器\n\
  ```\n\n在前两节中，我介绍了使用 `catch` 进行异常处理和使用 `finally` 进行资源管理。在所有情况下，你都可以将两者结合，同时执行异常和内存管理。\n\
  \n### 垃圾回收\n\n当内存不再需要时，需要将其释放，以便重新分配给程序中的其他对象。用于判断内存是否可以释放的过程称为垃圾回收。根据运行环境的不同，你会遇到多种垃圾回收方式。\n\
  \n旧版网页浏览器可能使用引用计数垃圾回收器，当对象的引用计数达到零时释放内存。如表 8-1 所示。这是一种非常快速的回收方式，因为引用计数达到零时即可立即释放内存。然而，如果两个或多个对象之间创建了循环引用，这些对象将永远不会被垃圾回收，因为它们的计数永远不会达到零。\n\
  \n现代浏览器通过标记-清除算法解决了这个问题，该算法检测所有从根节点可达的对象，并回收不可达的对象。虽然这种回收方式耗时更长，但更不容易导致内存泄漏。为防止浏览器\
  \ UI 冻结，一些 JavaScript 引擎会将垃圾回收插入空闲时间，从而减少对浏览体验的影响。\n\n表 8-1.\n\n引用计数垃圾回收\n\n| 对象\
  \ | 引用计数 | 内存是否释放 |\n| --- | --- | --- |\n| `Object A` | 1 | 否 |\n| `Object B` |\
  \ 1 | 否 |\n| `Object C` | 1 | 否 |\n| `Object D` | 1 | 否 |\n| `Object E` | 0 | 是\
  \ |\n\n表 8-1 中的相同对象如图 8-4 所示。使用引用计数算法，`Object A` 和 `Object B` 会因相互引用而保留在内存中。这些循环引用是旧版浏览器内存泄漏的根源，而标记-清除算法则解决了这个问题。`Object\
  \ A` 和 `Object B` 之间的循环引用不足以让对象在垃圾回收中幸存，因为只有从根节点可访问的对象才会被保留。\n\n![A323824_2_En_8_Fig4_HTML.jpg](img/A323824_2_En_8_Fig4_HTML.jpg)\n\
  \n图 8-4.\n\n标记与清除\n\n大多数现代垃圾回收器会对对象进行分代提升，其中针对短生命周期对象的回收最为频繁和高效。随着对象存活时间增长，它们的检测频率通常会降低，回收速度也可能变慢。一次完整的垃圾回收还可能包含压缩步骤以优化内存使用。\n\
  \n标记-清除垃圾回收算法的使用意味着，在你的 TypeScript 程序中，几乎无需担心垃圾回收或内存泄漏问题。\n\n\n\n## 性能\n\n> 毫无疑问，对效率的追求会导致滥用。程序员浪费大量时间思考或担忧程序中非关键部分的速度，而考虑到调试和维护时，这些提高效率的尝试实际上会产生强烈的负面影响。我们应该放弃对微小效率的执着，大约在\
  \ 97% 的情况下：过早优化是万恶之源。然而，我们也不应放弃那关键的 3%。——唐纳德·克努特\n\n这并非唐纳德·克努特（《带 GOTO 语句的结构化编程》，《计算调查》，1974\
  \ 年）第一次就性能和优化问题被引用，也绝不会是最后一次。至少在这方面，他的言论经受住了时间的考验（尽管它们来自一篇为 GOTO 语句辩护的论文——这种观点随着时间的推移已基本失效）。\n\
  \n如果在出现可衡量的性能问题之前就考虑性能问题，那么你应该避免优化。有许多文章声称使用局部变量比全局变量快，应该避免使用闭包因为它们慢，或者对象属性比变量慢。虽然这些说法通常正确，但将它们作为设计规则会导致糟糕的程序设计。\n\
  \n优化的黄金法则是，你应该衡量两种或多种潜在设计之间的差异，并决定性能提升是否值得你为获得它们而必须做出的设计权衡。\n\n> **注意**  \n> 就你的\
  \ TypeScript 程序而言，测量执行时间需要在多个平台上运行测试。否则，你可能会在一个浏览器中更快，但在另一个浏览器中更慢。\n\n清单 8-9 中的代码将用于演示一个简单的性能测试。将测试轻量级的\
  \ `CommunicationLines` 类。该类包含一个方法，该方法接收一个 `teamSize` 并使用著名的 `n(n–1)/2` 算法计算团队成员之间的沟通线路数量。名为\
  \ `testCommunicationLines` 的函数实例化该类，并成功测试了团队规模为 4 和 10 的两个案例，它们分别有 6 条和 45 条沟通线路。\n\
  \n```\nclass CommunicationLines {\n    calculate(teamSize: number) {\n        return\
  \ (teamSize * (teamSize - 1)) / 2\n    }\n}\n\nfunction testCommunicationLines()\
  \ {\n    const communicationLines = new CommunicationLines();\n    let result =\
  \ communicationLines.calculate(4);\n    if (result !== 6) {\n        throw new Error('Test\
  \ failed for team size of 4.');\n    }\n    result = communicationLines.calculate(10);\n\
  \    if (result !== 45) {\n        throw new Error('Test failed for team size of\
  \ 10.');\n    }\n}\n\ntestCommunicationLines();\n```\n\n*清单 8-9. 计算沟通线路*\n\n清单 8-10\
  \ 中的 `Performance` 类将一个回调函数包装在一个方法中，该方法使用 `performance.now` 方法，并利用第 4 章讨论的高保真计时器来对操作进行计时。为了获得公平的测量结果，`Performance`\
  \ 类默认将代码运行 10,000 次，尽管在调用 `run` 方法时可以覆盖此数字。\n\n`Performance` 类的输出包括执行代码 10,000 次所花费的总时间以及每次迭代的平均时间。\n\
  \n```\nexport class Performance {\n    constructor(private func: Function, private\
  \ iterations: number) {\n    }\n\n    private runTest() {\n        if (!performance)\
  \ {\n            throw new Error('The performance.now() standard is not supported\
  \ in this runtime.');\n        }\n\n        const errors: number[] = [];\n     \
  \   const testStart = performance.now();\n\n        for (let i = 0; i < this.iterations;\
  \ i++) {\n            try {\n                this.func();\n            } catch (err)\
  \ {\n                // Limit the number of errors logged\n                if (errors.length\
  \ < 10) {\n                    errors.push(i);\n                }\n            }\n\
  \        }\n\n        const testTime = performance.now() - testStart;\n\n      \
  \  return {\n            errors: errors,\n            totalRunTime: testTime,\n\
  \            iterationAverageTime: (testTime / this.iterations)\n        };\n  \
  \  }\n\n    static run(func: Function, iterations = 10000) {\n        const tester\
  \ = new Performance(func, iterations);\n        return tester.runTest();\n    }\n\
  }\n```\n\n*清单 8-10. `Performance.ts` 运行器*\n\n要使用 `Performance` 类来测量程序，必须导入代码，并将对\
  \ `testCommunicationLines` 函数的调用替换为将函数传递给 `Performance` 类的 `run` 方法，如清单 8-11 所示。\n\
  \n```\nimport { Performance } from './Listing-8-010';\n\nclass CommunicationLines\
  \ {\n    calculate(teamSize: number) {\n        return (teamSize * (teamSize - 1))\
  \ / 2\n    }\n}\n\nfunction testCommunicationLines() {\n    const communicationLines\
  \ = new CommunicationLines();\n    let result = communicationLines.calculate(4);\n\
  \    if (result !== 6) {\n        throw new Error('Test failed for team size of\
  \ 4.');\n    }\n    result = communicationLines.calculate(10);\n    if (result !==\
  \ 45) {\n        throw new Error('Test failed for team size of 10.');\n    }\n}\n\
  \nconst result = Performance.run(testCommunicationLines);\nconsole.log(result.totalRunTime\
  \ + ' ms');\n```\n\n*清单 8-11. 运行性能测试*\n\n这段代码的结果是，控制台记录的总运行时间为 2.73 ms。这意味着整个 10,000\
  \ 次迭代（即对沟通线路算法的 20,000 次调用）耗时不到 3 ms。在大多数情况下，这样的结果很好地表明你在寻找优化机会时找错了方向。\n\n通过按清单\
  \ 8-12 所示调整代码，可能会得到完全不同的结果。对代码所做的唯一更改是检查对 `communicationLines.calculate` 的调用，该调用中团队规模为\
  \ 4 的结果是 7 条沟通线路。此测试将失败，并引发一个异常。\n\n```\nimport { Performance } from './Listing-8-010';\n\
  \nclass CommunicationLines {\n    calculate(teamSize: number) {\n        return\
  \ (teamSize * (teamSize - 1)) / 2\n    }\n}\n\nfunction testCommunicationLines()\
  \ {\n    const communicationLines = new CommunicationLines();\n    let result =\
  \ communicationLines.calculate(4);\n    if (result !== 7) {\n        throw new Error('Test\
  \ failed for team size of 4.');\n    }\n    result = communicationLines.calculate(10);\n\
  \    if (result !== 45) {\n        throw new Error('Test failed for team size of\
  \ 10.');\n    }\n}\n\nconst result = Performance.run(testCommunicationLines);\n\
  console.log(result.totalRunTime + ' ms');\n```\n\n*清单 8-12. 运行包含异常的性能测试*\n\n运行包含失败测试以及创建和处理异常的代码，总运行时间为\
  \ 214.45 ms——这比第一次测试慢了 78 倍。可以利用这些数据来指导你的设计决策。你可能希望多次重复测试或尝试不同的迭代规模，以确保获得一致的结果。\n\
  \n以下是一些使用清单 8-10 中的 `Performance` 类收集的数据，用以证明本节开头关于优化的论断。使用一个简单但有限的测试，基线时间为每次迭代\
  \ 0.74 ms，结果如下（数字越高表示执行时间越慢）：\n\n- **全局变量**：0.80 ms（每次迭代慢 0.06 ms）\n- **闭包**：1.13\
  \ ms（每次迭代慢 0.39 ms）\n- **属性**：1.48 ms（每次迭代慢 0.74 ms）\n\n在 10,000 次执行中，你可以看到执行时间的微小差异，但重要的是要记住，由于对象复杂度、嵌套深度、创建的对象数量以及许多其他因素的差异，你的程序将返回不同的结果。在进行任何优化之前，请确保你已经进行了测量，以便能够比较更改前后的性能，从而判断它们是否产生了积极的影响。\n\
  \n\n好的，作为高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n## 总结\n\n本章涵盖了三个重要主题，这些主题很可能是任何用\
  \ TypeScript 编写的大型应用程序的基础。在大多数情况下，这三个领域可能是横切关注点，在编写大量需要修改的代码之前考虑它们会更容易。\n\n使用异常来处理程序中真正的异常状态，可以防止程序数据进一步损坏。你应该创建自定义异常来帮助管理不同类型的错误，并在\
  \ `catch` 块中测试类型，以便只处理你知道可以从中恢复的错误。\n\n现代运行时都使用可靠的标记-清除算法来处理内存，该算法不会像早期的引用计数垃圾回收器那样受到循环引用内存泄漏的影响。人们普遍认为，程序员在编写代码时不需要考虑垃圾回收，但如果你能测量到性能问题并发现垃圾回收是问题所在，你可能会决定通过创建更少的对象来帮助垃圾回收器，从而减少其管理负担。\n\
  \n每当你进行优化时，你首先应该测量程序的性能，以证明你在进行更改时对优化的假设是否正确。你应该在多个环境中测量你的更改，以确保在所有环境中都提高了速度。\n\n\
  ## 要点\n\n*   你可以将 `throw` 关键字与任何对象一起使用，但最好使用自定义错误的子类。\n*   你可以使用 `try-catch-finally`\
  \ 块处理异常，在这些块中，你必须指定一个 `catch` 或 `finally` 块，或者根据意愿指定两者。\n*   当处理 Promise 时，你可以使用\
  \ `catch` 块、`finally` 块，或两者都使用。\n*   你无法可靠地仅捕获自定义异常，但你可以在 `catch` 块内测试异常类型。\n* \
  \  你遇到的大多数 API 都将遵循异步或类似 Promise 的模式，但如果你发现必须管理一个资源，请使用 `try-finally` 块进行清理。\n*\
  \   在性能方面，你需要优化前后的测量数据来支持你以优化为名义更改的任何代码。\n\n"
- "# 9. 使用 JavaScript 库\n\n> 我并不是说使用现有的软件或库不好。我的意思是，在最小化一方的努力和最小化另一方的冗余代码之间总是需要权衡。我的意思是，当你从现有库中需要的功能比例非常小（比如说低于\
  \ 20%）时，你应该考虑编写自己的代码。长期背负额外的 80% 可能并不值得。 — Lea Verou\n\n在编写框架、工具包、辅助函数和有用的代码片段方面，JavaScript\
  \ 社区是最活跃的社区之一。如果你搜索任何类型的框架或工具包，你很可能会找到大量的选择。事实上，选择的数量既是祝福也是诅咒，尽管你找到行为驱动测试框架、单元测试框架、模型-视图-控制器（MVC）框架、模型-视图-视图模型（MVVM）框架、网络工具包、浏览器\
  \ polyfill 等都不会有问题。从众多选项中选出一个来使用并非易事。\n\n一旦你权衡了你的选择，你就可以立即开始在 TypeScript 程序中使用该框架。在运行时，你的程序和框架都将是纯\
  \ JavaScript，但在设计时和编译时，你将把 TypeScript 代码与纯 JavaScript 库混合在一起。由于 TypeScript 编译器不知道\
  \ JavaScript 文件中提供的操作，你需要以类型定义的形式提供提示，以获得与 TypeScript 库相同级别的工具支持。\n\n编译器使用类型定义来检查你的程序，语言服务则使用它们在你的开发工具中提供自动补全。所有类型定义都会被编译器擦除，这意味着它们不会给你的生产代码增加任何负担。本章包含一个示例应用程序，演示了当你需要在\
  \ TypeScript 程序中包含第三方 JavaScript 代码时，如何为其创建类型定义。\n\n为了说明类型定义对现有代码的好处，让我们了解一下在纯 JavaScript\
  \ 中使用 jQuery 的典型开发工作流程。\n\n*   输入一个选择器和方法，例如 `$('#elem').on(`\n*   搜索 jQuery 文档中\
  \ `on` 方法的签名\n*   在你的代码和文档之间来回切换以完成你的代码行\n\n这是除了 jQuery 中最常见的操作之外所有操作的典型描述，我还没有提及任何复制和粘贴示例的情况（我们都做过）。如果即使对于最通用的库，我们的开发工作流程也涉及在文档和代码之间来回切换，那么一定有更好的方法。类型定义就是这样一种更好的方法。\n\
  \n通过包含 jQuery 的类型定义，你将获得针对 jQuery 成员的智能自动补全，从而省去在编辑器和文档之间来回切换的麻烦。GitHub 上有一个官方的类型定义仓库（Definitely\
  \ Typed）。所有这些定义都可以从 NPM 上的 Types 组织安装，如图 9-1 所示，或者通过运行清单 9-1 中的命令进行安装。\n\n![A323824_2_En_9_Fig1_HTML.jpg](img/A323824_2_En_9_Fig1_HTML.jpg)\n\
  \n图 9-1. 添加 jQuery 类型定义\n\n请注意，在这两种情况下，类型定义都作为开发依赖项保存，因为它们在运行时不是必需的。\n\n```bash\n\
  npm install @types/jquery --save-dev\n```\n清单 9-1. 类型定义的 NPM 安装命令\n\n但是，在我们通过获取现有类型定义而走得太远之前，让我们从头开始，并涵盖那些可能没有可用定义的场景。这将意味着你可以像处理流行的框架一样，轻松地处理你自己的\
  \ JavaScript 代码，或者一个尚未有社区贡献的冷门库。\n\n## 创建类型定义\n\n为了说明类型定义的创建过程，本章使用 Knockout 作为\
  \ JavaScript 库的示例。Knockout 是一个 MVVM 框架，它通过将模型映射到视图并在发生变化时保持两者同步来简化动态用户界面。虽然使用 Knockout\
  \ 来说明从头开始创建类型定义的过程，但该技术可用于以 TypeScript 能够理解的方式描述任何 JavaScript 代码——甚至是你自己的遗留库。\n\n\
  当然，如果你要向程序中添加像 Knockout 这样的流行库，很可能已经有人完成了创建类型定义的工作。因此，在花时间自己创建之前，请检查 Definitely\
  \ Typed 项目或通过 NPM 的列表（你会找到 `@types/knockout`）。\n\n[`http://definitelytyped.org/`](http://definitelytyped.org/)\n\
  \n如果你使用的开源库未列在列表中，那么在创建了类型定义之后，你可以将其提交给 Definitely Typed 项目，以帮助未来的其他程序员。\n\n正在运行的应用程序示例如图\
  \ 9-2 所示。该应用程序允许你预订座位并从一系列食物选项中进行选择。\n\n![A323824_2_En_9_Fig2_HTML.jpg](img/A323824_2_En_9_Fig2_HTML.jpg)\n\
  \n图 9-2. Knockout 应用程序\n\n\n\n### 使用 Knockout 创建 TypeScript 应用程序\n\n本章中的应用程序允许乘客在航班上预订座位并选择机上餐食。该应用程序由一个\
  \ HTML 页面和一个 `app.ts` 文件组成，后者包含将数据绑定到视图的 Knockout 代码。清单 9-2 展示了该应用程序的视图的 HTML 页面，该页面来源于\
  \ Knockout 教程网站： [`http://learn.knockoutjs.com/`](http://learn.knockoutjs.com/)\n\
  \n本示例中值得关注的部分是 Knockout 用于将视图模型绑定到 HTML 页面的 `data-bind` 属性。每个 `data-bind` 属性都接收一个表达式，该表达式描述了数据应绑定到元素的哪个位置（例如\
  \ `value` 属性或内部的 `text`），以及应显示哪些数据。\n\n```\nKnockout App\n\n您的座位预订 ()\n\n乘客姓名\n\
  餐食\n附加费\n\n移除\n\n预订另一个座位\n 0\">\n总附加费: $\n\n清单 9-2.\nHTML 页面\n```\n\n`app.ts` 文件包含使用\
  \ Knockout 将数据绑定到视图的代码，如清单 9-3 所示。本节不会更改此文件，而是用它来驱动出所需的类型定义，以便消除编译器错误，并为 Knockout\
  \ 提供高质量的自动补全和类型检查。\n\n```\n// 表示座位预订网格中一行的类\nfunction SeatReservation(name, initialMeal)\
  \ {\nvar self = this;\nself.name = name;\nself.meal = ko.observable(initialMeal);\n\
  self.formattedPrice = ko.computed(function () {\nvar price = self.meal().price;\n\
  return price ? \"$\" + price.toFixed(2) : \"无\";\n});\n}\n// 此屏幕的总体视图模型及初始状态\nfunction\
  \ ReservationsViewModel() {\nvar self = this;\n// 不可编辑的目录数据——将从服务器获取\nself.availableMeals\
  \ = [\n{ mealName: \"标准（三明治）\", price: 0 },\n{ mealName: \"高级（龙虾）\", price: 34.95\
  \ },\n{ mealName: \"至尊（整只斑马）\", price: 290 }\n];\n// 可编辑数据\nself.seats = ko.observableArray([\n\
  new SeatReservation(\"史蒂夫\", self.availableMeals[0]),\nnew SeatReservation(\"伯特\"\
  , self.availableMeals[0])\n]);\n// 计算数据\nself.totalSurcharge = ko.computed(function\
  \ () {\nvar total = 0;\nfor (var i = 0; i < self.seats().length; i++)\ntotal +=\
  \ self.seats()[i].meal().price;\nreturn total;\n});\n// 操作\nself.addSeat = function\
  \ () {\nself.seats.push(new SeatReservation(\"\", self.availableMeals[0]));\n}\n\
  self.removeSeat = function (seat) { self.seats.remove(seat) }\n}\nko.applyBindings(new\
  \ ReservationsViewModel(), document.body);\n清单 9-3.\napp.ts 中的程序\n```\n\n如果你将这些文件放入开发环境中，由于\
  \ Knockout 的 `ko` 变量未知，你会收到 TypeScript 编译器的许多错误。这些错误的示例如图 9-3 所示。\n\n![A323824_2_En_9_Fig3_HTML.jpg](img/A323824_2_En_9_Fig3_HTML.jpg)\n\
  \n图 9-3.  \n编译器错误\n\n### 消除编译器错误\n\n如果你只对消除编译器错误感兴趣，那么只需提供一个快速提示，告知编译器你将负责所有使用 `ko`\
  \ 变量并导致错误的代码。提供此提示的类型定义如清单 9-4 所示。\n\n该类型定义通常放在名为 `knockout.d.ts` 的文件中，并通过引用注释或\
  \ `import` 语句在 `app.ts` 中引用它。\n\n```\ndeclare var ko: any;\n清单 9-4.\n快速的类型定义修复\n\
  ```\n\n当你使用这类类型定义时，你放弃了编译器对你的程序的检查，并且你将无法获得自动补全功能。虽然这是一个简单的快速修复方法，但你很可能希望编写更全面的类型定义。\n\
  \n![A323824_2_En_9_Fig4_HTML.jpg](img/A323824_2_En_9_Fig4_HTML.jpg)\n\n图 9-4.  \n\
  第一次迭代\n\n图 9-4 显示编辑器中的类型信息尚无用，但所有错误都已消失。\n\n\n\n### 迭代改进类型定义\n\n编写类型定义的一大优点在于可以增量式地进行。这意味着你可以根据每次增量提供的类型检查和自动补全带来的好处，来决定在类型定义上投入多少精力。\n\
  \n清单 9-5 展示了对 Knockout 类型定义的一次小的增量改进。`Knockout` 接口为应用中使用的所有第一级属性提供了类型信息：`applyBindings`、`computed`、`observable`\
  \ 和 `observableArray`。这四个属性的具体细节没有给出；它们只是被简单地赋值为 `any` 类型。\n\n声明的 `ko` 变量被更新为使用新的\
  \ `Knockout` 接口，而不是之前用来让编译器静默的 `any` 类型。\n\n```\ninterface Knockout {\napplyBindings:\
  \ any;\ncomputed: any;\nobservable: any;\nobservableArray: any;\n}\ndeclare var\
  \ ko: Knockout;\nListing 9-5.\n第一级类型定义\n```\n\n尽管这个更新后的定义很简单，但它可以防止许多常见的错误，否则这些错误只有在应用中观察到不正确行为时才会被发现。清单\
  \ 9-6 展示了两个示例错误，基于这个第一级类型定义，编译器会捕获它们。\n\n```\n// 拼写错误被编译器捕获\nself.meal = ko.observabel(initialMeal);\n\
  // 不存在的方法被编译器捕获\nko.apply(new ReservationsViewModel(), document.body);\nListing\
  \ 9-6.\n错误代码的编译器报错\n```\n\n本应使用 `observable` 却误拼为 `observabel`，以及本应使用 `applyBindings`\
  \ 却调用了不存在的 `apply` 方法，这两者都会导致编译器报错。这是编译器所能达到的极限，因为接口中只指定了名称，而没有指定方法签名。\n\n图 9-5\
  \ 展示了使用更新后的定义所改进的自动补全。虽然成员被列出，但其类型信息尚未提供。\n\n![A323824_2_En_9_Fig5_HTML.jpg](img/A323824_2_En_9_Fig5_HTML.jpg)\n\
  \n图 9-5.\n\n第二次迭代\n\n为了增加类型定义的细节，有必要参考该库的官方文档。在创建定义时参考一次文档，就能省去每次编写代码时都要查阅的麻烦。以\
  \ `applyBindings` 为例，文档指出该方法可以接受以下一个或两个参数：\n\n*   `viewModel`—你想要与它所激活的声明式绑定一起使用的视图模型对象。\n\
  *   `rootNode`（可选）—你想要在其中搜索 `data-bind` 属性的文档部分。\n\n换句话说，`viewModel` 是一个对象且必须提供，而\
  \ `rootNode` 是一个 `HTMLElement` 且是可选的。更新后的 `Knockout` 接口及其附加类型信息如清单 9-7 所示。\n\n```\n\
  interface Knockout {\napplyBindings(viewModel: {}, rootNode?: HTMLElement): void;\n\
  computed: any;\nobservable: any;\nobservableArray: any;\n}\ndeclare var ko: Knockout;\n\
  Listing 9-7.\n'applyBindings' 定义\n```\n\n注意\n\n即使你尚不清楚库中某个函数或对象的确切签名，将类型限制为通用的 `Function`\
  \ 或 `Object` 类型也能防止许多可能的错误，例如传递简单类型。\n\n这个更新后的类型定义提供了更全面的类型检查，确保至少向 `applyBindings`\
  \ 传递一个参数，并且所有传递的参数都是正确的类型。它还允许开发工具提供有用的类型提示和自动补全，如图 9-6 所示。\n\n![A323824_2_En_9_Fig6_HTML.jpg](img/A323824_2_En_9_Fig6_HTML.jpg)\n\
  \n图 9-6.\n\n`applyBindings` 方法的自动补全\n\n另一种扩展类型信息的技术是提供你根据自己对该库的使用情况推断出的签名。应用中 `ko.computed`\
  \ 的两个实例都传入了一个执行计算的函数。你可以更新类型定义，以表明 `computed` 方法期望提供一个函数，如清单 9-8 所示。\n\n如果求值器的返回类型是固定的，你可以在括号内的类型定义中指定它。同样，如果你需要使用\
  \ `computed` 方法返回的值，你可以更新括号外的返回类型以提供返回类型的详细信息。\n\n```\ninterface Knockout {\napplyBindings(viewModel:\
  \ any, rootNode?: any): void;\ncomputed: (evaluator: () => any) => any;\nobservable:\
  \ any;\nobservableArray: any;\n}\ndeclare var ko: Knockout;\nListing 9-8.\n'computed'\
  \ 定义\n\n你可以继续使用官方文档或基于示例推断类型来扩展定义，从而创建清单 9-9 中所示的 `Knockout` 接口。该接口现在包含第一级和第二级类型信息。\n\
  \n```\ninterface Knockout {\napplyBindings(viewModel: {}, rootNode?: HTMLElement):\
  \ void;\ncomputed: (evaluator: () => any) => any;\nobservable: (value: any) => any;\n\
  observableArray: (value: any[]) => any;\n}\ndeclare var ko: Knockout;\nListing 9-9.\n\
  完整的第二级定义\n```\n\n为了完成类型定义，你需要重复这个过程，将每个 `any` 的用法转化为更详细的类型，直到你不再依赖用动态类型来隐藏细节。每当某个定义扩展到难以管理的规模时，你可以使用额外的接口来拆分它，以帮助限制定义中任何特定部分的复杂性。\n\
  \n清单 9-10 演示了\"分而治之\"技术，将 `applyBindings` 方法的细节移到一个单独的 `KnockoutApplyBindings` 接口中。然后在\
  \ `Knockout` 接口中使用这个接口将类型信息绑定到该方法。\n\n```\ninterface KnockoutApplyBindings {\n(viewModel:\
  \ {}, rootNode?: HTMLElement): void;\n}\ninterface Knockout {\napplyBindings: KnockoutApplyBindings;\n\
  computed: (evaluator: () => any) => any;\nobservable: (value: any) => any;\nobservableArray:\
  \ (value: any[]) => any;\n}\ndeclare var ko: Knockout;\nListing 9-10.\n将类型定义拆分为接口\n\
  ```\n\n尽管这个 Knockout 的类型定义远未完成，但它涵盖了运行示例应用程序所需的所有 Knockout 功能。你可以根据需要添加更多类型信息，只在获得合理回报时才投入精力。\n\
  \n\n\n## 转换 JavaScript 应用程序\n\n如果你有一个现有的 JavaScript 应用程序，并打算切换到 TypeScript，处理旧代码有三种可行的策略：\n\
  \n- 编写类型定义\n- 将 JavaScript 文件加入编译\n- 将 JavaScript 代码迁移到 TypeScript 文件中\n\n为自己编写的\
  \ JavaScript 代码编写类型定义是最不理想的方案，因为这会带来大量重复或徒劳的工作。允许编译器包含你的 JavaScript 代码，可以让你开启向 TypeScript\
  \ 迁移的进程；而将其移入 TypeScript 文件则标志着迁移完成。\n\n为了演示 JavaScript 代码的迁移过程，我们将使用清单 9-11 中展示的一个非常基础的\
  \ JavaScript 文件。该文件包含一些任意的旧处理代码，我们希望在新 TypeScript 程序中使用它们。\n\n```\nfunction old_process(name)\
  \ {\nreturn name + ' processed';\n}\n```\n\n调用旧 JavaScript 的新代码如清单 9-12 所示。\n\n\
  ```\nclass NewProcessor {\nprocess(name: string) {\nreturn old_process(name);\n\
  }\n}\n```\n\n当你尝试编译 TypeScript 文件时，会看到错误信息 `mynewlib.ts(3,16): error TS2304: Cannot\
  \ find name 'old_process'`。这是因为编译器无法识别旧代码。\n\n```\ntsc mynewlib.ts --outDir ./dist\n\
  ```\n\n在编写类型定义或尝试将旧库升级为 TypeScript 之前，你可以先启用包含 JavaScript 文件的编译选项。当在编译中包含 JavaScript\
  \ 文件时，最好将输出重定向到单独的文件夹，因为 JavaScript 输入文件不能被覆盖。清单 9-14 展示了允许在编译中包含 JavaScript 文件的编译器命令，并将旧\
  \ JavaScript 文件和新 TypeScript 文件一同加入编译。\n\n```\ntsc myoldlib.js mynewlib.ts --allowJs\
  \ --outDir ./dist\n```\n\n通过将 JavaScript 文件包含在编译中，编译器通常能推断出类型信息，之前的编译错误现在也消失了。\n\
  \n你可以进一步改进代码，如清单 9-15 所示，在 TypeScript 文件中显式声明 JavaScript 依赖关系。\n\n```\n///\nclass\
  \ NewProcessor {\nprocess(name: string) {\nreturn old_process(name);\n}\n}\n```\n\
  \n添加了引用注释后，编译时就不再需要指定 JavaScript 文件了。此外，你的编辑器现在将提供推断出的类型信息作为自动完成提示。\n\n```\ntsc\
  \ mynewlib.ts --allowJs --outDir ./dist\n```\n\n为了进一步改善开发体验，你可以开始将 JavaScript 文件迁移为\
  \ TypeScript 文件，这样可以添加类型注解来完善类型信息，并在编译器无法理解类型时提供帮助。如果 JavaScript 代码特别晦涩，编译器可能无法推断出很多类型。\n\
  \n如果你有大量 JavaScript 文件需要升级，可以先将底层依赖升级为 TypeScript，而其他依赖于这些底层代码的 JavaScript 文件继续引用\
  \ TypeScript 文件的编译输出。在运行时，只要只添加类型注解而不重构程序结构，文件最初是用 TypeScript 还是 JavaScript 编写的并无区别。\n\
  \n最好将任何重构工作留到整个程序都改用 TypeScript 编写之后再进行，因为 TypeScript 的重构支持更加智能。\n\n## 本章小结\n\n\
  几乎所有流行的 JavaScript 库都已经在 Definitely Typed 上列出了类型定义，并通过 NPM 上的 Types 组织发布；但如果你遇到一个比较小众的库，或者一个全新的、尚未收录的库，你可以自己创建类型定义。采用迭代/增量式的方法来编写类型定义，可以让你在投入的时间和精力上获得最大回报，并且你可以利用库的文档来查找类型信息，或者通过阅读示例来推断类型。\n\
  \n你也可以使用相同的类型定义技术来重用自己编写的 JavaScript 代码，但更省时的方法是直接将 JavaScript 代码移入 TypeScript 文件，并添加编译器无法为你推断的所有类型注解。\n\
  \n无论你是在编写类型定义，还是将 JavaScript 升级为 TypeScript，编译器都有可能发现你从未意识到的错误——你可能会惊讶于之前遗漏了多少问题。\n\
  \n## 关键要点\n\n- 类型定义通常放在扩展名为 `.d.ts` 的文件中。\n- 你可以增量地创建新的类型定义——无需一次性投入时间为整个库生成类型信息。\n\
  - 你可以在 TypeScript 编译中包含 JavaScript 文件。\n- 通常，将文件从 JavaScript 升级为 TypeScript，比创建类型定义文件更容易。\n\
  - 由于 JavaScript 是完全动态的，在升级到 TypeScript 时，你很可能会发现并修复一些你从未意识到的错误。\n\n# 自动化测试\n\n>\
  \ 我对任何领域专家的定义是：一个对事情真相了解得足够多，以至于感到害怕的人。——P. J. Plauger\n\n对于任何编写 TypeScript 所设计的那种大型应用程序的人来说，自动化测试都是一个至关重要的主题。通过自动化程序测试，开发者可以将更多时间用于开发新功能，减少修复缺陷的时间。自动化测试对于重构也至关重要。没有任何一种单一的测试方法能够独立提供足够高的缺陷检测率。这意味着需要结合多种测试方法，才能在软件发布前检测出合理数量的缺陷。\n\
  \n这可能会令人惊讶，但实证证据表明，对于不同类型的测试，你将达到以下缺陷检测率，正如 Steve McConnell 在《代码大全》（Microsoft Press，2004\
  \ 年）中所记载的：\n\n- 单元测试最多可检测出 50% 的缺陷。\n- 集成测试最多可检测出 40% 的缺陷。\n- 回归测试最多可检测出 30% 的缺陷。\n\
  \n这些数字表明，随着测试在软件开发生命周期中进行得越晚，就会有更多的缺陷漏网。同时，众所周知，缺陷发现得越晚，修复成本就越高。考虑到这一点，也许测试优先编程是减少缺陷最有效的方法之一（与结对编程并列，因为协作工作方法已被发现能比任何类型的测试检测出更多的缺陷）。测试驱动设计（TDD）的支持者也会很快指出，测试是额外收获，而非\
  \ TDD 的主要目的——TDD 是一种辅助设计内聚代码单元的工具。他们可能是对的，但测试本身也很不错！\n\n本章的目的并非说服你采用测试驱动设计。无论你选择在编码之前编写测试，还是在编写完部分程序后编写测试，或者希望自动化测试而不是手动执行，本章的信息都将对你有用。\n\
  \n> 注意：缩写 TDD 最初是为测试驱动开发（test-driven development）创造的，但后来修订为测试驱动设计（test-driven design），以强调这种方法在帮助塑造程序设计方面所起的作用。\n\
  \n\n\n## 框架选择\n\n有许多用 JavaScript 编写的高质量测试框架可用于测试程序。这里列出了三个最流行的框架，但还有更多未列出的框架，你甚至不需要使用框架，因为直接使用\
  \ TypeScript 代码也可以进行测试。\n\n*   Jasmine\n*   Mocha\n*   Jest\n\n本章中的示例均使用 Jest 编写，Jest\
  \ 是一个易于设置的测试框架，因其与 React 框架的紧密联系而逐渐受到欢迎。\n\n示例中展示的代码涵盖了 FizzBuzz 编程练习的前几个步骤。编程练习是一种通过解决简单问题来逐步挑战设计能力的实践方法。附录\
  \ 4 对编程练习进行了说明。FizzBuzz 练习基于一个儿童游戏，该游戏包含一系列计数规则。在执行练习时，你的目标应该是仅通过游戏中的下一个规则；避免提前思考的诱惑。随着你编写更多代码，设计会逐渐显现，你可以重构程序（只要测试通过，你就没有意外改变行为，这一点可以放心）。\n\
  \n## 使用 Jest 进行测试\n\nJest 是为了补充 React 框架而编写的，但它也可以用于测试任何 TypeScript 或 JavaScript\
  \ 程序。运行 Jest 最常见的方式是通过 Node。其语法简洁易学，对于过去使用过 Jasmine 的人来说会非常熟悉。\n\n### 安装 Jest\n\n\
  将 Jest 添加到项目中最简单的方法是从 NPM 获取包和类型定义。你可以通过将这些包添加到开发依赖项中来实现，如代码清单 10-1 所示。你还会注意到，我们使用\
  \ `package.json` 文件来告诉 Node 哪个框架将处理我们的测试运行。\n\n```\n{\n\"name\": \"fizzbuzz\",\n\
  \"version\": \"1.0.0\",\n\"devDependencies\": {\n\"@types/jest\": \"²¹.1.0\",\n\"\
  jest\": \"²¹.1.0\"\n},\n\"scripts\": {\n\"test\": \"jest\"\n}\n}\n代码清单 10-1.\n包依赖\n\
  ```\n\n下载完这些包后，你就可以开始编写代码了。\n\n### 第一个规范\n\n代码清单 10-2 展示了一个待测试的 `FizzBuzz` 类的简单实现。该类的目的是当给定\
  \ FizzBuzz 游戏中报出的一个数字时，提供正确的答案。完整的实现应返回报出的数字，或者根据该数字是否能被三、五或三和五同时整除，用诸如 \"Fizz\"\
  、\"Buzz\" 或 \"FizzBuzz\" 等游戏词汇替换该数字。\n\n> **注意**  \n> FizzBuzz 游戏通常是在一个群体中进行的。每个人轮流说出从\
  \ 1 开始的序列中的下一个数字。如果数字能被三整除，玩家应该说 \"Fizz\" 而不是数字。如果数字能被五整除，玩家应该说 \"Buzz\"，如果数字能被三和五同时整除，他们应该说\
  \ \"FizzBuzz\"。\n\n与其一次性实现所有这些逻辑，我们使用规范来驱动编程任务。因此，在实现任何超出初始实现（总是返回数字 1）的行为之前，该类需要等待\
  \ Jest 规范。\n\n```\nexport class FizzBuzz {\ngenerate(input: number) {\nreturn 1;\n\
  }\n}\n代码清单 10-2.\nFizzBuzz.ts 中的 FizzBuzz 代码\n```\n\n匹配此行为的 Jest 测试如代码清单 10-3 所示。这个测试代表了你向某人首次解释\
  \ FizzBuzz 规则时对话中的第一句话。例如，\"当报出数字 1 时，你应该说 '1'。\"\n\n```\nimport { FizzBuzz } from\
  \ './FizzBuzz';\ndescribe('一个 FizzBuzz 生成器', () => {\nit('当报出 1 时，应返回数字 1', () =>\
  \ {\nconst fizzBuzz = new FizzBuzz();\nconst result = fizzBuzz.generate(1);\nexpect(result).toBe(1);\n\
  });\n});\n代码清单 10-3.\nFizzBuzz.test.ts 中的 Jest 测试\n```\n\n`describe` 方法接受一组规范的名称和一个测试每个规范的函数。`it`\
  \ 方法表示单个规范。规范集和规范中使用的语言旨在具有人类可读性。在这种情况下，将规范集描述与规范文本结合起来读作：\n\n> 当报出 1 时，一个 FizzBuzz\
  \ 生成器应返回数字 1。\n\n通过仔细选择规范中的语言，你可以从测试套件中获得免费的文档。你甚至可能会想到一种更好的措辞方式，用更人性化的术语来描述这种行为。如果是这样，你应该更改描述以匹配你改进后的措辞。在这些细节上多花些心思是值得的，因为这从长远来看会使规范更有价值。\n\
  \n传递给规范的函数通过实例化 `FizzBuzz` 类、报出数字 1 并检查结果是否为 1 来验证这一声明。\n\nJest 会在文件名包含 `*.test.js`\
  \ 的文件中查找测试，但排除 `node_modules` 文件夹中的文件，因此命名很重要。如果你忘记了这一点，运行 Jest 时将找不到任何测试。\n\n要运行\
  \ Jest，只需在你的项目文件夹中运行代码清单 10-4 所示的命令。\n\n```\nnpm test\n代码清单 10-4.\n运行 Jest\n```\n\
  \n此命令的输出如图 10-1 所示。\n\n![A323824_2_En_10_Fig1_HTML.jpg](img/A323824_2_En_10_Fig1_HTML.jpg)\n\
  \n图 10-1. Jest 测试结果\n\n现在一切设置完毕，可以开始测试了。接下来，你将使用更多的测试来驱动 FizzBuzz 程序的实现。\n\n\n\n\
  ## 驱动实现\n\n现在测试自动化已就位，便可以通过新的规格说明来驱动实现过程。清单 10-5 展示了在 FizzBuzz 游戏中输入数字 2 时的预期行为规格说明。\n\
  \n```\nimport { FizzBuzz } from './FizzBuzz';\ndescribe('一个 FizzBuzz 生成器', () =>\
  \ {\nit('输入 1 时应返回数字 1', () => {\nconst fizzBuzz = new FizzBuzz();\nconst result\
  \ = fizzBuzz.generate(1);\nexpect(result).toBe(1);\n});\nit('输入 2 时应返回数字 2', ()\
  \ => {\nconst fizzBuzz = new FizzBuzz();\nconst result = fizzBuzz.generate(2);\n\
  expect(result).toBe(2);\n});\n});\n```\n\n第二个规格说明将会失败，因为 `FizzBuzz` 类被硬编码为无论输入什么值都返回\
  \ `1`。运行测试的结果如图 10-2 所示。\n\n![A323824_2_En_10_Fig2_HTML.jpg](img/A323824_2_En_10_Fig2_HTML.jpg)\n\
  \n失败消息显示测试“`期望值为：2，实际接收：1`”，这意味着 Jest 测试失败，因为当预期返回 `2` 时，实际返回了 `1`。\n\n为了通过测试，必须按照清单\
  \ 10-6 所示更新 `FizzBuzz` 类。返回输入的任何数字将使现有两个规格说明均通过。尽管你可能知道很快会增加该实现无法覆盖的更多规格说明，但在编写代码前等待测试失败，可以确保每一种变化的测试都在你编写让其通过的代码之前编写并失败。知晓测试会在行为不正确时失败，这将让你在后续重构程序时充满信心。\n\
  \n```\nexport class FizzBuzz {\ngenerate(input: number) {\nreturn input;\n}\n}\n\
  ```\n\n此次更改后重新运行规格说明，所有规格说明都将通过。结果如图 10-3 所示。\n\n![A323824_2_En_10_Fig3_HTML.jpg](img/A323824_2_En_10_Fig3_HTML.jpg)\n\
  \n清单 10-7 展示了驱动 `FizzBuzz` 类实现的下一项规格说明。该规格说明要求输入数字 3 时，应将其替换为单词“Fizz”。\n\n```\n\
  it('输入 3 时应返回\"Fizz\"', () => {\nconst fizzBuzz = new FizzBuzz();\nconst result\
  \ = fizzBuzz.generate(3);\nexpect(result).toBe('Fizz');\n});\n```\n\n在确认该规格说明失败后，你可以更新清单\
  \ 10-8 所示的实现。此次更新同样是能通过测试的最简代码。\n\n```\nclass FizzBuzz {\ngenerate(input: number)\
  \ : string | number {\nif (input === 3) {\nreturn 'Fizz';\n}\nreturn input;\n}\n\
  }\n```\n\n此阶段运行规格说明的结果如图 10-4 所示。阅读测试输出有助于理解测试如何以业务领域的语言描述程序。\n\n![A323824_2_En_10_Fig4_HTML.jpg](img/A323824_2_En_10_Fig4_HTML.jpg)\n\
  \n## 重构\n\n既然已经编写了若干规格说明并实现了使其通过的代码，那么对程序进行重构是值得的。代码重构涉及在不改变行为的前提下改变程序的结构和设计。确认你确实是在重构（而非无意中改变程序实际功能）的最简单方法，就是拥有能够突出显示任何意外变更的自动化测试。\n\
  \n同样值得注意的是，你的测试代码应当像生产代码一样编写精良且易于维护，但抽象程度可以更低。因此，清单 10-9 展示了重构后的规格说明，其中重复的 `FizzBuzz`\
  \ 类实例化被移至 `beforeEach` 方法中，Jest 会在每条规格说明之前自动运行该方法。\n\n```\nimport { FizzBuzz } from\
  \ './FizzBuzz';\ndescribe('一个 FizzBuzz 生成器', () => {\nlet fizzBuzz: FizzBuzz;\n\
  beforeEach(() => {\nfizzBuzz = new FizzBuzz();\n});\nit('输入 1 时应返回数字 1', () => {\n\
  const result = fizzBuzz.generate(1);\nexpect(result).toBe(1);\n});\nit('输入 2 时应返回数字\
  \ 2', () => {\nconst result = fizzBuzz.generate(2);\nexpect(result).toBe(2);\n});\n\
  it('输入 3 时应返回\"Fizz\"', () => {\nconst result = fizzBuzz.generate(3);\nexpect(result).toBe('Fizz');\n\
  });\n});\n```\n\n每当你重构代码时，都应重新运行所有测试，以确保没有改变程序的行为。如果测试套件失败，你可以轻松撤销更改并再次尝试，而非调试程序。每次测试运行之间的迭代应当足够小，以便可以放弃。\n\
  \n```\nexport class FizzBuzz {\ngenerate(input: number): string | number {\nlet\
  \ output = '';\nif (input % 3 === 0) {\noutput += 'Fizz';\n}\nif (input % 5 ===\
  \ 0) {\noutput += 'Buzz';\n}\nreturn output === '' ? input : output;\n}\n}\n```\n\
  \n清单 10-10 中的代码展示了 `FizzBuzz` 类的一个可用版本，它涵盖了返回数字的默认规则以及 `Fizz`、`Buzz` 和 `FizzBuzz`\
  \ 三种变体。此时，尽管 `generate` 方法仍然相当简短，但已能从代码中看出替代设计的雏形。特别是，随着新规则的加入（例如能被 7 整除的数字应返回'Bazz'），你可能会决定引入并适配一种设计模式来捕获特定规则。\n\
  \n**注意：** FizzBuzz 编程练习通常使用称为责任链的设计模式来解决，尽管也存在其他可能的解决方案。\n\n为驱动此实现而创建的规格说明如清单 10-11\
  \ 所示。目前共有八条规格说明，用于覆盖四种可能的响应类型。\n\n\n\n```typescript\nimport { FizzBuzz } from './FizzBuzz';\n\
  describe('A FizzBuzz generator', () => {\nlet fizzBuzz: FizzBuzz;\nconst FIZZ =\
  \ 'Fizz';\nconst BUZZ = 'Buzz'\nconst FIZZ_BUZZ = 'FizzBuzz';\nbeforeEach(() =>\
  \ {\nfizzBuzz = new FizzBuzz();\n});\nit('should return the number 1 when 1 is played',\
  \ () => {\nconst result = fizzBuzz.generate(1);\nexpect(result).toBe(1);\n});\n\
  it('should return the number 2 when 2 is played', () => {\nconst result = fizzBuzz.generate(2);\n\
  expect(result).toBe(2);\n});\nit('should return \"Fizz\" when 3 is played', () =>\
  \ {\nconst result = fizzBuzz.generate(3);\nexpect(result).toBe(FIZZ);\n});\nit('should\
  \ return \"Fizz\" when 6 is played', () => {\nconst result = fizzBuzz.generate(6);\n\
  expect(result).toBe(FIZZ);\n});\nit('should return \"Buzz\" when 5 is played', ()\
  \ => {\nconst result = fizzBuzz.generate(5);\nexpect(result).toBe(BUZZ);\n});\n\
  it('should return \"Buzz\" when 10 is played', () => {\nconst result = fizzBuzz.generate(10);\n\
  expect(result).toBe(BUZZ);\n});\nit('should return \"FizzBuzz\" when 15 is played',\
  \ () => {\nconst result = fizzBuzz.generate(15);\nexpect(result).toBe(FIZZ_BUZZ);\n\
  });\nit('should return \"FizzBuzz\" when 30 is played', () => {\nconst result =\
  \ fizzBuzz.generate(30);\nexpect(result).toBe(FIZZ_BUZZ);\n});\n});\n清单 10-11.\n\
  可正常工作的 FizzBuzz 类的规范\n```\n\n除了测试 `FizzBuzz` 类之外，这些规范还为程序提供了准确的文档。输出结果如图 10-5 所示。你可能会注意到\
  \ Jest 标记了其中一个测试的执行时间（15 ms），这有助于你识别那些拖慢测试套件的测试。\n\n![A323824_2_En_10_Fig5_HTML.jpg](img/A323824_2_En_10_Fig5_HTML.jpg)\n\
  \n**图 10-5.** 包含三个测试且全部通过的测试套件\n\n这些测试是一种可执行的规范——一种活的文档形式，同时也证明了你的程序执行了文档中描述的行为。\n\
  \n### 隔离依赖项\n\n有时你可能需要测试代码中依赖于某个资源的部分，而这会使你的测试变得脆弱。例如，它可能依赖于第三方 API 或特定状态的数据库。如果你需要在测试时不依赖这些依赖项，可以使用本节介绍的技术在测试时对它们进行隔离。\n\
  \n在许多编程语言中，当你需要提供测试替身时，自然而然地会想到使用模拟框架。然而，在 TypeScript 中，创建测试替身非常容易，以至于你可能永远不需要去寻找框架。\n\
  \n清单 10-12 展示了 `FizzBuzz` 类的一个修改版本，它依赖于 `localStorage`（在 TypeScript 中实现了 `Storage`\
  \ 接口）。`constructor` 接收存储对象，`generate` 函数使用它来获取在“Fizz”情况下要显示的显示消息。\n\n```typescript\n\
  class FizzBuzz {\nconstructor(private storage: Storage) {\n}\ngenerate(input: number):\
  \ string | number {\nif (input === 3) {\nreturn this.storage.getItem('FizzText');\n\
  }\nreturn input;\n}\n}\n清单 10-12.\n一个依赖于存储的 FizzBuzz 类\n```\n\n你可以使用一个简单的对象来满足这个依赖，如清单\
  \ 10-13 所示。`storage` 变量恰好匹配了 `Storage` 接口中足够通过测试的部分。与其他编程语言不同，解决测试替身问题的这个方案如此简单；你几乎不需要考虑使用框架来解决这个问题。\n\
  \n```typescript\ndescribe('A FizzBuzz generator', () => {\nit('should return \"\
  FakeFizz\" when 3 is played', () => {\n// 为存储创建一个测试替身\nvar storage: any = {\ngetItem:\
  \ () => 'FakeFizz'\n};\nconst fizzBuzz = new FizzBuzz(storage);\nconst result =\
  \ fizzBuzz.generate(3);\nexpect(result).toBe('FakeFizz');\n});\n});\n清单 10-13.\n\
  使用一个对象\n```\n\n总的来说，你应该坚持使用简单的对象作为测试替身，并且你的测试应该检查结果，而不是具体的实现细节。知道当输入为 3 时得到“Fizz”是一个强有力的行为测试，但检查某个\
  \ `storage` 对象是否被调用以提供一个匹配特定键的值，则根本不是一个好测试，因为当你更改实现细节时，这个测试会失败。\n\n## 总结\n\n希望本章已经证明了自动化测试的价值。然而，如果你仍然持怀疑态度，可以尝试在有测试和没有测试的情况下运行编程练习，看看是否能帮助你下定决心。你可以在附录\
  \ 4 中阅读更多内容。\n\n尽管本章所有示例都使用了 Jest，但使用 Mocha 或 Jasmine 也同样简单，并且两者都提供了同样简洁的语法。无论你使用什么工具来运行测试，都尽量精心设计输出，使其呈现为人类可读的文档形式。这样，如果有人要求提供文档，你只需直接给出测试套件的输出结果即可。\n\
  \n我创建了一个基于 Gherkin 语言的 TypeScript 行为驱动框架，名为 TypeSpec，你可以用它来结合业务规范和测试自动化。但在本章中我使用了\
  \ Jest，因为我更希望程序员从更常用的工具开始。你可以在 GitHub 上找到更多关于 TypeSpec 的信息：\n\n[`https://github.com/Steve-Fenton/TypeSpec`](https://github.com/Steve-Fenton/TypeSpec)\n\
  \n## 要点\n\n*   自动化单元测试比集成测试或回归测试更有效（尽管好的策略是使用多种类型的测试，以获得尽可能最佳的缺陷检测率）。\n*   JavaScript\
  \ 和 TypeScript 有很多框架，但如果你想缩小范围，可以参考 Jest、Jasmine 和 Mocha。\n*   你可以使用 Jest 来编写兼具测试和文档功能的规范。\n\
  *   用规范驱动实现，可以确保当行为不正确时测试会失败。在实现之后编写测试，并不能保证测试一定会失败。\n*   你应该重构生产代码和测试代码。\n*   你可以使用简单的对象来隔离依赖项，这比那些可能将测试与实现过度绑定的精巧工具更可取。\n\
  \n# 附录 1：JavaScript 快速参考\n\n如果你还不熟悉 JavaScript，本快速参考旨在提供你将在 TypeScript 程序中使用的 JavaScript\
  \ 核心功能的概述。在 TypeScript 语言旁边已经描述过的功能，此处不再赘述。\n\n\n\n## 变量\n\n变量用于在 JavaScript 中存储应用程序的状态，可以包含从字符串、数字到对象、函数等任何类型的数据。\n\
  \n列表 A1-1 展示了一些包含简单类型的变量。变量可以在声明的同时赋值，也可以分开声明和赋值。变量的类型会与其最近一次赋值的值相对应。如果未被赋值，变量的值将为\
  \ `undefined`。\n\n声明变量时有两个关键字可供选择：`let` 和 `const`。这两个声明都是块级作用域的，就像大多数使用花括号的语言一样。使用\
  \ `let` 关键字声明变量时，你可以在后续代码中重新给该变量赋值。而使用 `const` 关键字时，则无法重新赋值。对 `const` 变量赋值的限制并不意味着它不可变，只是该变量本身不能被覆盖。在两者之间选择时，建议优先使用\
  \ `const`，当确定需要重新赋值时再升级为 `let`。`let` 和 `const` 都优于 `var` 关键字，因为 `var` 是函数级作用域，而非块级作用域。\n\
  \n```\n// 变量声明\nlet variable;\n// 变量赋值\nvariable = '一个字符串被赋给变量';\n// 动态赋值（将变量类型改为数值）\n\
  variable = 10;\n列表 A1-1.\n变量\n```\n\n你可以在变量中存储数组。可以使用空字面量 `[]` 创建一个新的空数组，并使用 `array.push`\
  \ 添加元素。也可以通过将值放入数组字面量中，一步完成数组的创建和填充，如列表 A1-2 所示。\n\n```\n// 创建空数组并添加值\nconst myArray\
  \ = [];\nmyArray.push(1);\nmyArray.push(3);\nmyArray.push(5);\n// 使用数组字面量添加值\nconst\
  \ myLiteralArray = [1, 3, 5];\n列表 A1-2.\n数组\n```\n\n对象可用于表示复杂结构的数据。对象可以包含属性，每个属性都像一个变量，可以包含字符串、数值、数组、函数以及其他对象。与数组类似，你可以使用空对象字面量\
  \ `{}` 创建空对象，也可以通过将属性放入对象字面量中，一步创建并填充对象。列表 A1-3 展示了这两种方式。\n\n```\n// 对象\nconst myObject\
  \ = {};\nmyObject.title = '示例对象';\nmyObject.value = 5;\n// 对象字面量\nconst myLiteralObject\
  \ = {\ntitle: '示例对象',\nvalue: 5\n};\n列表 A1-3.\n对象\n```\n\n在所有示例中，我们都使用了字面量赋值，而非通过\
  \ `new` 关键字实例化值。虽然可以使用 `new Array()` 创建数组、`new Object()` 创建对象，甚至用 `new String()`\
  \ 创建字符串，但在 JavaScript 中，字面量语法更受推荐。\n\n## 函数\n\n函数可用于在程序中创建可复用的代码块。你可以通过函数声明或函数表达式来创建函数，如列表\
  \ A1-4 所示。\n\n```\n// 函数声明\nfunction myFunction(name) {\nreturn '你好 ' + name;\n\
  }\n// '你好 Steve'\nlet greeting = myFunction('Steve');\n// 函数表达式\nvar myFunctionExpression\
  \ = function (name) {\nreturn '嗨 ' + name;\n};\n// '嗨 Steve'\ngreeting = myFunctionExpression('Steve');\n\
  列表 A1-4.\n函数\n```\n\n使用函数声明创建函数时，该函数在解析阶段被创建，这意味着它在整个程序中，只要作用域可访问的地方都能使用。而使用函数表达式时，函数在运行时才被求值，且只能在作用域可访问且调用代码位于函数表达式之后的位置进行调用。\n\
  \n## 条件语句\n\n条件语句可用于在程序中实现逻辑分支。你可以使用条件语句仅在满足特定条件时执行代码。\n\n`if` 语句允许根据自定义条件（计算结果为\
  \ `true` 或 `false`）进行代码分支。例如，列表 A1-5 中的 `if` 语句会根据 `age` 变量的值执行不同的代码。\n\n```\n//\
  \ If 语句\nconst age = 21;\nif (age > 18) {\n// 当 age 大于 18 时执行的代码\n}\nif (age > 40)\
  \ {\n// 当 age 大于 40 时执行的代码\n} else if (age > 18) {\n// 当 age 大于 18 但小于 41 时执行的代码\n\
  } else {\n// 其他所有情况下执行的代码\n}\n列表 A1-5.\nIf 语句\n```\n\n`switch` 语句适用于基于单个变量控制多个分支，且仅在特定值才会触发分支的场景。列表\
  \ A1-6 展示了一个典型的 `switch` 语句，它可以根据 `style` 变量的值执行不同的代码。如果没有其他条件被执行，则会执行 `default`\
  \ 条件。\n\n```\n// Switch 语句\nconst styles = {\n传统: 1,\n现代: 2,\n后现代: 3,\n未来主义: 4\n\
  };\nconst style = styles.传统;\nswitch (style) {\ncase styles.传统:\n// 为传统风格执行的代码\n\
  break;\ncase styles.现代:\n// 为现代风格执行的代码\nbreak;\ncase styles.后现代:\n// 为后现代风格执行的代码\n\
  break;\ncase styles.未来主义:\n// 为未来主义风格执行的代码\nbreak;\ndefault:\nthrow new Error('未知风格:\
  \ ' + style);\n}\n列表 A1-6.\nSwitch 语句\n```\n\n注意\n\n`switch` 语句与 TypeScript 枚举配合使用效果更佳，枚举将在第\
  \ 1 章中介绍。\n\n## 循环\n\n循环用于在程序中重复执行一段代码。JavaScript 中最常见的循环是 `for` 循环，可用于遍历数组中的每一项并重复执行操作，如列表\
  \ A1-7 所示。\n\n```\nconst names = ['莉莉', '丽贝卡', '黛比', '安'];\nfor (let i = 0; i <\
  \ names.length; i++) {\nconsole.log(names[i]);\n}\n列表 A1-7.\nFor 循环\n```\n\n你可以使用\
  \ `for-of` 循环简化列表 A1-7 中的代码。`for-of` 循环无需用变量跟踪索引值，直接将每次迭代的值赋给一个变量供你使用。列表 A1-8 展示了与第一个示例等价的\
  \ `for-of` 循环；其结果更具表现力且更易读。\n\n```\nconst names = ['莉莉', '丽贝卡', '黛比', '安'];\nfor\
  \ (let name of names) {\nconsole.log(name);\n}\n列表 A1-8.\nFor-of 循环\n```\n\n`while`\
  \ 循环允许重复执行一段代码，直到某个条件满足为止，如列表 A1-9 所示。这种循环常见的用途是向字符串中添加字符，并重复该过程直到字符串达到指定长度。\n\n\
  ```\nlet counter = 10;\nwhile (counter > 0) {\ncounter--;\nconsole.log(counter);\n\
  }\n列表 A1-9.\nWhile 循环\n```\n\n`do-while` 循环与 `while` 循环几乎相同，区别在于它至少会执行一次代码，即使条件不满足。\n\
  \n```\nlet counter = 0;\ndo {\ncounter--;\nconsole.log(counter);\n} while (counter\
  \ > 0);\n列表 A1-10.\nDo-while 循环\n```\n\n列表 A1-10 类似于前面展示的 `while` 循环，只是 `counter`\
  \ 变量已经满足了退出条件（因为它不大于零）。尽管如此，代码仍会在条件评估前执行一次，从而导致循环退出。\n\n\n\n## 字符串\n\n虽然大量的字符串操作可能暗示着设计上的错误，但\
  \ JavaScript 中处理字符串的方式有一些值得了解的显著发展。列表 A1-11 展示了处理字符串的几种机制。\n\n```\nconst name =\
  \ 'Jamie';\n// 传统字符串\nconst classicString = 'Line One\\n' +\n'Line Two\\n' +\n'Line\
  \ Three. Hello ' + name + '!';\n// 反引号字符串\nconst backtickedString = `Line One\n\
  Line Two\nLine Three. Hello ${name}!`;\n// 'Five plus seven is 12.'\nconst expressionString\
  \ = `Five plus seven is ${5 + 7}.`;\n列表 A1-11.\n字符串\n```\n\n传统字符串可以使用单引号或双引号。反引号字符串接受换行符，并允许使用`${}`包围的字符串插值。字符串插值允许插入变量和表达式。\n\
  \n## 期约（Promise）\n\n期约正迅速成为 JavaScript 应用程序的核心特性，并为协调异步操作提供了一种简单的机制。列表 A1-12 展示了如何使用`fetch`\
  \ API 从 URL 检索数据，来通过期约进行编程。\n\n```\nfetch('/Your/URL/').then(function (response)\
  \ {\n// 收到响应\nif (response.status >= 200 && response.status < 300) {\n// 我们得到了一个成功状态码\n\
  }\n}).catch(function (error) {\n// 请求失败\n});\n列表 A1-12.\n使用期约\n```\n\n一个期约包含三个部分：一个调用返回期约的函数（例如`fetch`函数）、一个用于处理`then`结果（成功时调用）的处理程序，以及一个用于处理`catch`结果（发生错误时调用）的处理程序。\n\
  \n```\nlet promise = new Promise(function (resolve, reject) {\nwindow.setTimeout(function\
  \ () {\nif (true) {\nresolve('Success');\n} else {\nreject('Failed');\n}\n}, 1000);\n\
  });\npromise.then(function (message) {\nalert(message);\n}).catch(function (error)\
  \ {\nalert(error);\n});\n列表 A1-13.\n使用自定义期约\n```\n\n当你使用`new Promise`实现自己的期约时，你的函数应接受一些处理程序作为参数，这些处理程序将在成功或失败时被调用。这些处理程序是一种松散的约定；传递给`resolve`和`reject`函数的参数可以是任何类型，尽管按照惯例，`reject`函数应传入一条错误消息。\n\
  \n## 总结\n\n虽然本附录快速介绍了 JavaScript 的一些非常基础的功能，但它们是你开始学习 TypeScript 所需掌握的核心部分。如果某个功能与\
  \ TypeScript 语言有重要关联，我会将其包含在 TypeScript 的相关信息中，而不是放在本附录里。JavaScript 及其在不同执行环境中的内容远比我在此处能介绍的要多得多。\n\
  \n阅读完这个快速入门后，你应该能够毫无障碍地阅读本书，因为所有 TypeScript 语言特性都已详细描述。\n\n# 附录 2：TypeScript 编译器\n\
  \nTypeScript 编译器可能隐藏在你的开发工具背后，但熟悉各种编译器选项仍然非常值得。由于现在有超过 70 个不同的编译器标志，我选择了提供关于更常见选项的更详细信息。编译器本身是为编译整个项目而非单个文件而优化的。针对整个项目运行编译器意味着你只需加载标准库一次，而不是多次。你可能会发现，编译单个文件（包括其所有依赖项）所需的时间几乎与编译整个项目一样长。\n\
  \n编译器名为`tsc.exe`，通常可以在 Windows 上的以下目录中找到：\n\n- `C:\\Program Files (x86)\\Microsoft\
  \ SDKs\\TypeScript\\[Version]\\tsc.exe`\n\n要运行编译器，只需在命令行中调用`tsc`并传入程序的根文件名，如下所示。你可能需要输入`tsc.exe`文件的完整地址。如果你厌倦了输入完整路径，可以将\
  \ TypeScript 文件夹的路径添加到你的环境变量中。\n\n```\ntsc app.ts\n```\n\n你也可以在任何操作系统上使用 Node 运行\
  \ TypeScript 编译器，因为编译器是用 TypeScript 编写的，并编译成了 JavaScript，如下所示。你需要输入`tsc.js`文件（而不是`.ts`文件）的完整路径。\n\
  \n```\nnode tsc.js app.ts\n```\n\n## 获取帮助\n\n如果你在记住编译器的所有选项时遇到困难，可以使用以下命令之一获取帮助，这些命令将显示所有可设置的编译器标志的列表。每个编译器标志都暴露了一个设置，允许你更改编译器的行为。\n\
  \n```\ntsc --help\nnode tsc.js\n```\n\n## 示例文件\n\n为了说明编译器选项之间的一些关键区别，列表 A2-1 中的代码被用于使用一些不同的编译器选项生成输出。\n\
  \n```\nimport * as Dependency from './module';\nexport class Example extends Dependency.BaseClass\
  \ {\nexampleMethod(): number {\nreturn 5;\n}\n}\n// 注释\nlet example = new Example();\n\
  const val = example.exampleMethod();\n列表 A2-1.\n示例 TypeScript 代码\n```\n\n通过检查此列表生成的\
  \ JavaScript，你将了解模块加载和降级编译方面的一些差异。降级编译允许你使用 TypeScript 的最新特性，并将它们转换为与旧版 ECMAScript\
  \ 规范兼容的 JavaScript。当输出基本相似时，我会删除相似的行，以使重要的差异更加突出。\n\n## 常用标志\n\n有一些编译器标志非常常见，你几乎肯定会在某个时候用到它们。这些标志将在以下章节中描述。\n\
  \n\n\n### 模块种类\n\n`module` 编译器标志用于生成加载外部模块的代码，这些模块使用 CommonJS 或 AMD 模块模式。模块类型的有效值为\
  \ `commonjs` 和 `amd`。\n\n```sh\ntsc --module UMD app.ts\n```\n\n通用模块定义（UMD）创建的代码可以在两种主流的模块风格中运行：异步模块定义（AMD）和\
  \ CommonJS。例如，这允许你编写既能在 Web 浏览器中由 RequireJS 加载，又能在服务器端由 Node 加载的代码。这种模式的输出比 AMD\
  \ 或 CommonJS 都要冗长，因为它包含了用于特性检测以使用正确加载风格的代码。\n\n```javascript\n(function (factory)\
  \ {\nif (typeof module === \"object\" && typeof module.exports === \"object\") {\n\
  var v = factory(require, exports);\nif (v !== undefined) module.exports = v;\n}\n\
  else if (typeof define === \"function\" && define.amd) {\ndefine([\"require\", \"\
  exports\", \"./module\"], factory);\n}\n})(function (require, exports) {\n\"use\
  \ strict\";\nexports.__esModule = true;\nvar Dependency = require(\"./module\");\n\
  // Removed for brevity\nexports.Example = Example;\n// Comment\nvar example = new\
  \ Example();\nvar val = example.exampleMethod();\n});\n```\n*列表示例 A2-2. UMD 模块*\n\
  \nAMD 模块的输出在示例 A2-3 中更短，因为它不需要执行特性检测。该代码将与模块加载器（如 RequireJS 和 Dojo Toolkit）兼容。\n\
  \n```javascript\ndefine([\"require\", \"exports\", \"./module\"], function (require,\
  \ exports, Dependency) {\n\"use strict\";\nexports.__esModule = true;\n// Removed\
  \ for brevity\nexports.Example = Example;\n// Comment\nvar example = new Example();\n\
  var val = example.exampleMethod();\n});\n```\n*列表示例 A2-3. AMD 模块*\n\nCommonJS 模块最著名的实现是\
  \ Node，但它们在 MongoDB 和 CouchDB 中也能找到。示例 A2-4 展示了使用 CommonJS 模块标志的输出。\n\n```javascript\n\
  \"use strict\";\nexports.__esModule = true;\nvar Dependency = require(\"./module\"\
  );\n// Removed for brevity\nexports.Example = Example;\n// Comment\nvar example\
  \ = new Example();\nvar val = example.exampleMethod();\n```\n*列表示例 A2-4. CommonJS\
  \ 模块*\n\n一个新兴且值得关注的模块风格是 ECMAScript 模块语法，如示例 A2-5 所示。这种模块加载风格与原始的 TypeScript 代码最为相似。\n\
  \n```typescript\nimport * as Dependency from './module';\n// Removed for brevity\n\
  export { Example };\n// Comment\nvar example = new Example();\nvar val = example.exampleMethod();\n\
  ```\n*列表示例 A2-5. ESNext 模块*\n\nAMD 和 System 模块类型也可以与 `--outFile` 标志一起使用，该标志会将你的程序合并成一个单独的\
  \ JavaScript 文件。在执行此操作之前，请先阅读下面“合并输出”部分中关于此标志的说明。\n\n### ECMAScript 目标版本\n\n`target`\
  \ 标志允许你设置目标 ECMAScript 版本。目前，你可以针对多个版本的 ECMAScript 规范，包括 `ES3`、`ES5`、`ES2015`、`ES2016`、`ES2017`\
  \ 或使用 `ESNext` 表示的最新版本。对于大多数语言特性，编译器会将代码编译到你指定的版本，尽管可能有一小部分特性不可用。\n\n如果你针对 ECMAScript\
  \ 3，则不能在 TypeScript 程序中使用属性，因为它们依赖于 ECMAScript 5 的特性。当添加 ECMAScript 6 选项时，它在编译期间将执行较少的转换。这是因为\
  \ ECMAScript 6 支持许多基本的 TypeScript 特性，例如模块、类、箭头函数和特殊参数类型。ECMAScript 6 支持也应允许新的 JavaScript\
  \ 特性，如 `let`、生成器和解构。\n\n```sh\ntsc --target ES5 app.ts\n```\n\n示例 A2-6 展示了向下编译到\
  \ ECMAScript 5 规范的过程。关键字如 `const` 和 `let` 不能使用，因此它们被替换为 `var` 关键字。在会影响变量作用域的情况下，会生成额外的代码，将\
  \ `var` 关键字封装在一个新的函数作用域中。类被替换为立即调用函数表达式（IIFE）。\n\n```javascript\nimport * as Dependency\
  \ from './module';\nvar Example = (function (_super) {\n__extends(Example, _super);\n\
  function Example() {\nreturn _super !== null && _super.apply(this, arguments) ||\
  \ this;\n}\nExample.prototype.exampleMethod = function () {\nreturn 5;\n};\nreturn\
  \ Example;\n}(Dependency.BaseClass));\nexport { Example };\n// Comment\nvar example\
  \ = new Example();\nvar val = example.exampleMethod();\n```\n*列表示例 A2-6. ES5 目标*\n\
  \n当针对支持你在 TypeScript 中使用的模块加载、类语法和变量声明的最新 ECMAScript 规范版本时，生成的 JavaScript 看起来几乎与你的\
  \ TypeScript 相同，如示例 A2-7 所示。\n\n```typescript\nimport * as Dependency from './module';\n\
  export class Example extends Dependency.BaseClass {\nexampleMethod() {\nreturn 5;\n\
  }\n}\n// Comment\nlet example = new Example();\nconst val = example.exampleMethod();\n\
  ```\n*列表示例 A2-7. ESNext 目标*\n\nTypeScript 跟踪 ECMAScript 提案，这意味着最新版本的 TypeScript\
  \ 和 JavaScript 将非常相似。编译后代码中唯一的实际区别是类型擦除，因为目前没有计划为 JavaScript 添加类型注解。\n\n### 生成声明文件\n\
  \n`declaration` 标志将生成一个后缀为 `.d.ts` 的额外文件，其中包含你代码的环境声明。\n\n```sh\ntsc --declaration\
  \ app.ts\n```\n\n示例 A2-8 展示了生成的声明文件，你可以将其作为程序打包策略的一部分。\n\n```typescript\nimport\
  \ * as Dependency from './module';\nexport declare class Example extends Dependency.BaseClass\
  \ {\nexampleMethod(): number;\n}\n```\n*列表示例 A2-8. app.d.ts 声明文件*\n\n如果你通过包管理器（如\
  \ NPM）打包程序以便使用，此功能非常有用。\n\n### 移除注释\n\n`removeComments` 标志会从输出中删除所有注释，如果你的源代码中有大量注释，这会使输出文件变得更小。\n\
  \n```sh\ntsc --removeComments true app.ts\n```\n\n### 合并输出\n\n你可以使用 `out` 编译器标志将整个\
  \ TypeScript 程序合并到一个输出文件中。使用 `out` 标志时，你还必须为合并后的文件提供一个名称。\n\n```sh\ntsc --out final.js\
  \ app.ts\n```\n\n将整个程序压缩到一个输出文件中的概念与 TypeScript 的目的——编写大型程序——背道而驰。即使你是为了学习习惯而使用\
  \ TypeScript 编写较小的程序，模块加载也是需要养成的关键习惯之一。\n\n## 代码质量标志\n\n以下标志可以帮助你提高代码质量，并在编译时捕获松散之处。如果你正在从头开始编写一个新程序，启用这些标志并遵循编译器的指导应该是一件简单的任务。对于现有程序，你可以决定启用这些标志，修复编译器发现的一些问题，然后再将其关闭。这将使你能够在许多离散的会话中改进代码，直到最终可以永久地保持它们启用。\n\
  \n### 默认值\n\n就代码质量而言，许多选项默认设置为正确的值。以下所有标志的默认值都设置为 `false`，并且应该保持这样：\n\n*   `--allowUnreachableCode`\n\
  *   `--allowUnusedLabels`\n*   `--noImplicitUseStrict`\n*   `--noStrictGenericChecks`\n\
  *   `--suppressExcessPropertyErrors`\n*   `--suppressImplicitAnyIndexErrors`\n\n\
  \n\n### 严格模式开关\n\n在默认设置的基础上，你可以启用严格模式来打开四个最常用的质量标志：\n\n- `--noImplicitAny`：捕获无法推断类型且需要注解的情况。\n\
  - `--noImplicitThis`：捕获`this`关键字具有隐含`any`类型的表达式。\n- `--alwaysStrict`：以严格模式解析，并为每个文件插入`\"\
  use strict\"`语句。\n- `--strictNullChecks`：捕获`null`和`undefined`值，防止意外的未赋值变量和属性。\n\n\
  严格标志的使用示例如下：\n\n```\ntsc --strict true app.ts\n```\n\n### 捕获意外的穿透\n\n`noFallthroughCasesInSwitch`标志会警告你`switch`语句中那些非空且缺少`break`关键字的`case`分支。\n\
  \n```\ntsc --noFallthroughCasesInSwitch true app.ts\n```\n\n清单 A2-9 中的代码展示了一个常见的穿透错误，这种错误往往是意外发生的。只有当`case`分支非空时才会给出穿透错误提示，因为这代表了在可读性和可维护性方面结构不佳的代码。\n\
  \n```\n// 错误：switch 语句中存在穿透 case。\nswitch (num) {\ncase 0:\ncase 1:\n// 允许\nnum\
  \ = num * 2;\nbreak;\ncase 2:\n// 允许\nnum = num * 4;\nbreak;\ncase 2:\n// 不允许\n\
  num = num * 6;\n// 没有 break 语句 - 穿透\ncase 4:\n// 允许\nnum = num * 8;\nbreak;\n}\n\
  清单 A2-9.\n意外的穿透 case\n```\n\n### 捕获缺失的返回语句\n\n`noImplicitReturns`标志会警告你那些存在缺失`return`语句的代码分支的函数或方法。\n\
  \n```\ntsc --noImplicitReturns true app.ts\n```\n\n清单 A2-10 会产生有效的 JavaScript 代码，因为允许省略`return`语句，从而导致返回`undefined`值。任何长期编写\
  \ JavaScript 代码的人都会体会到强制所有代码分支显式返回`return`语句的好处，否则你很可能会对程序的行为感到意外。\n\n```\n// 错误：并非所有代码路径都返回值\n\
  function invert(cond: boolean) {\nif (cond) {\nreturn false;\n}\n// 此处缺少 return\
  \ 语句\n}\n清单 A2-10.\n意外的穿透 case\n```\n\n### 未使用的局部变量\n\n`noUnusedLocals`标志会在变量从未被使用时发出警告。这有助于识别可以删除的冗余代码。\n\
  \n```\ntsc --noUnusedLocals true app.ts\n```\n\n### 未使用的参数\n\n`noUnusedParameters`标志会标记出未使用的函数和方法参数。这个标志比许多其他代码质量标志更棘手，因为有时你可能希望忽略传递给函数的某个参数。你可以使用此标志，直到遇到需要忽略参数的情况，然后如果它给你带来问题，再选择移除它。\n\
  \n```\ntsc --noUnusedParameters true app.ts\n```\n\n## JavaScript 编译\n\n如果你正在从 JavaScript\
  \ 过渡到 TypeScript，当你的代码在这两种语言之间划分时，这些编译器选项可以帮助你弥合差距。\n\n### 允许 JavaScript\n\n`allowJs`标志允许将\
  \ JavaScript 文件包含在编译中。\n\n```\ntsc --allowJs true app.ts\n```\n\n### 检查 JavaScript\n\
  \n`checkJs`标志可以与`allowJs`标志一起使用，它会使编译器报告 JavaScript 文件中的错误。\n\n```\ntsc --allowJs\
  \ true --checkJs true app.ts\n```\n\n# 附录 3：位标志\n\n如第 1 章所述，你可以使用枚举来定义位标志。位标志允许通过开关序列中的各个位来选择或取消选择一系列项目。为了确保枚举中的每个值都对应一个位，编号必须遵循二进制序列，其中每个值都是\
  \ 2 的幂，例如：\n\n```\n1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 以此类推\n\
  ```\n\n清单 A3-1 是第 1 章示例的复制，展示了位标志的实际应用。为了代替手动分配 2 的幂，使用移位运算符来开启相应的位。要向此枚举添加新值，只需为每个新值将右侧操作数递增\
  \ 1 即可。在处理枚举时，TypeScript 编译器会用普通数字替换表达式，而其他地方的其他表达式则保持不变。\n\n- `1 << 0` 替换为 1\n\
  - `1 << 1` 替换为 2\n- `1 << 2` 替换为 4\n- `1 << 3` 替换为 8，以此类推。\n\n```\nenum DiscFlags\
  \ {\nNone = 0,\nDrive = 1 << 0,\nInfluence = 1 << 1,\nSteadiness = 1 << 2,\nConscientiousness\
  \ = 1 << 3\n}\n// 使用标志\nvar personality = DiscFlags.Drive | DiscFlags.Conscientiousness;\n\
  // 测试标志\n// true\nvar hasD = (personality & DiscFlags.Drive) == DiscFlags.Drive;\n\
  // false\nvar hasI = (personality & DiscFlags.Influence) == DiscFlags.Influence;\n\
  // false\nvar hasS = (personality & DiscFlags.Steadiness) == DiscFlags.Steadiness;\n\
  // true\nvar hasC = (personality & DiscFlags.Conscientiousness) == DiscFlags.Conscientiousness;\n\
  清单 A3-1.\n标志\n```\n\n## 位标志详解\n\n清单 A3-1 中的标志在表 A3-1 中进行了说明。由于位标志在大端序中表示为 32 位整数，因此代表最大值的位出现在左侧。为了按它们表示的顺序显示值，“责任心”显示在左侧，因为在示例中它由具有最大值的位表示：8。\n\
  \n表 A3-1. 位标志说明\n\n| 责任心 (8) | 稳健性 (4) | 影响力 (2) | 驱动力 (1) | 二进制 | 十进制 |\n| ---\
  \ | --- | --- | --- | --- | --- |\n| 0 | 0 | 0 | 1 | 0001 | 1 |\n| 0 | 0 | 1 | 0\
  \ | 0010 | 2 |\n| 0 | 1 | 0 | 0 | 0100 | 4 |\n| 1 | 0 | 0 | 0 | 1000 | 8 |\n| 0\
  \ | 0 | 1 | 1 | 0011 | 3 |\n| 1 | 1 | 1 | 1 | 1111 | 15 |\n\n如果标志开启，则该列显示 1。如果标志关闭，则该列显示\
  \ 0。二进制值显示，二进制表示中的每一位对应于枚举中的一个值；每当“驱动力”开启时，最右侧的列将包含 1。这就是用于标志的枚举值必须使用二进制序列的原因，因为只有这种序列才能确保每个标志只影响集合中的单个位。\n\
  \n\n\n## 按位运算\n\n使用位标志还意味着你可以使用按位运算符来操作表示枚举中各项的位。清单 A3-2 使用按位与运算符（`&`）来查找两组标志中的匹配特征。只有在两组标志中都开启的项，在按位与运算的结果中才会被开启；这就是为什么用按位与运算来判断某个值是否被开启。\n\
  \n```\n// personalityA 和 personalityB 都包含 DiscFlags.Influence\nvar personalityA\
  \ = DiscFlags.Drive | DiscFlags.Influence | DiscFlags.Conscientiousness;\nvar personalityB\
  \ = DiscFlags.Influence | DiscFlags.Steadiness;\n// 按位与的结果只包含匹配的标志\n// DiscFlags.Influence\n\
  var matchingTraits = personalityA & personalityB;\n// false\nvar hasD = (matchingTraits\
  \ & DiscFlags.Drive) == DiscFlags.Drive;\n// true\nvar hasI = (matchingTraits &\
  \ DiscFlags.Influence) == DiscFlags.Influence;\n// false\nvar hasS = (matchingTraits\
  \ & DiscFlags.Steadiness) == DiscFlags.Steadiness;\n// false\nvar hasC = (matchingTraits\
  \ & DiscFlags.Conscientiousness) == DiscFlags.Conscientiousness;\n清单 A3-2.\n使用按位与查找匹配项\n\
  ```\n\n各种按位运算的结果如表 A3-2 所示。它们产生以下结果：\n\n*   **按位与**：如果两个集合中的该位均为开启状态，则结果中该位为开启状态。\n\
  *   **按位或**：如果两个集合中任一集合（或两个集合）中的该位为开启状态，则结果中该位为开启状态。\n*   **按位异或**：如果仅有一个集合中的该位为开启状态，则结果中该位为开启状态。如果两个源中均未开启该位，或两个源中都开启了该位，则结果中该位为关闭状态。\n\
  *   **按位取反**：对一个集合进行反转，将所有“开”位关闭，将所有“关”位打开。\n\n表 A3-2.\n\n按位运算\n\n| 第一个集合 | 第二个集合\
  \ | 按位运算 | 结果 |\n| --- | --- | --- | --- |\n| 1011 | 1101 | `&` (按位与) | 1001 |\n\
  | 1001 | 0011 | `|` (按位或) | 1011 |\n| 1011 | 1101 | `^` (按位异或) | 0110 |\n| 1011\
  \ | n/a | `~` (按位取反) | 0100 |\n\n## 附录 4: 编程空手道\n\n自 1999 年编程空手道被创造以来，它们变得越来越流行。如果你想提高编程技能，编程空手道就像一块磨刀石，可以用来磨练你的技巧。本附录将解释什么是编程空手道以及如何充分利用它们。这里提供了一些编程空手道合集和书籍的链接，可以用来练习你的\
  \ TypeScript 编程。\n\n编程空手道是练习编程技巧的一种方法，许多空手道旨在锻炼你的设计能力，并让你熟练掌握工具和工作流程。空手道的题目描述了一个模拟真实编程的问题，有时规模非常小。你可以通过增加约束条件来重复练习某个空手道，例如限制可以使用的语言特性，或者尝试在不使用鼠标的情况下完成空手道。空手道的每种变体都能让你学习或练习不同的技能。\n\
  \n因为编程空手道仅仅是练习，你可以安全地尝试各种想法，因为你随时可以删除代码并从头开始：即使第一次尝试进展顺利，你可能也会选择这样做几次。你甚至可以用空手道来尝试一种新的编程语言或一个新的代码编辑器。\n\
  \n你可以单独进行编程空手道，但与其他程序员结对练习更有价值。你不仅能锻炼编程技能，还能与伙伴分享和学习。小组空手道工作坊（有时称为编程道场）提供了与许多其他程序员结对的机会。你甚至可以在一个编程群组中作为一个大团队来解决一个问题。你的练习方式越多样化，带入实际工作中的经验就越丰富。编程空手道的一些好处如下：\n\
  \n*   学习开发环境的特性，例如键盘快捷键。\n*   练习测试驱动开发、行为驱动开发或其他测试优先技术。\n*   为空手道问题设计面向对象的解决方案。\n\
  *   重构和代码设计练习。\n\n你可以通过改变处理方式让空手道变得更有趣。在与伙伴一起进行编程空手道时，一个有价值的技术是打乒乓球。你编写一个失败的测试来描述一个单一行为，你的伙伴必须编写尽可能简单的代码来通过测试。然后你的伙伴为你编写一个测试，你再用最简单的方式使其通过。你们来回传递问题，轮流编写测试或使其通过。你甚至可能会发现这种练习会融入到你的日常工作中。\n\
  \n在编程空手道中，你可以为自己设定的另一个挑战是：只使用键盘来完成任务。通过摒弃所有其他输入设备，你会发现有趣且实用的键盘快捷键来执行你通常通过点击、选择、触摸等操作来完成的任务。\n\
  \n注意\n\n“编程空手道”一词由“务实的”戴夫·托马斯创造。他还在 [`http://codekata.com/`](http://codekata.com/)\
  \ 维护了一个空手道创意库。\n\n## 进行空手道练习\n\n进行一项编程空手道练习，你只需要以下内容：\n\n*   一个开发环境；\n*   一个测试框架或库（参见第\
  \ 9 章）；\n*   一个空手道问题。\n\n编程空手道旨在让你练习“红-绿-重构”的测试驱动开发周期。这个过程包括：编写一个测试并确保它失败，编写最简单的代码转换来通过测试，以及在设计变得明显时重构代码。空手道让你在小的方面尝试想法，之后你可以将这些想法应用到更大的问题上。当你解决复杂的实际问题时，在编程空手道中获得的技术将指导你找到正确的抽象。\n\
  \n注意\n\n目前需要记住两个重要的术语。**转换**是对代码行为的更改，而**重构**是对代码的更改，但不影响行为。这是你在代码中会进行的仅有的两种代码更改。\n\
  \n当你第一次开始编程空手道时，采用增量方式处理问题会有所帮助。不要读得太远；一次一小步地解决问题。随着信心的增长，你可以尝试解决一个更大的问题，并自己将其分解为独立的测试。\n\
  \n通过实践测试驱动设计这门学科，你可以学习和提高以下几个关键方面：\n\n*   如何将一个复杂问题分解为下一个可执行的单一步骤。\n*   转换（改变代码行为以通过测试）与重构（在不影响行为的情况下改进代码设计）之间的区别；以及如何执行两者。\n\
  *   找到正确的隔离级别，以确保在重构代码时测试不需要更改。\n*   如何用“厚颜无耻”的简单代码通过测试；以及如何推迟引入抽象，直到设计变得明显为止。\n\
  \n你可以使用相同的空手道来锻炼不同的编程技能，例如，在某个场合专注于编写最简单、最易读的代码来解决问题，在另一个场合则尝试不同级别的隔离。你还可以使用之前完成的空手道作为重构代码的起点。\n\
  \n空手道的规则应反映团队的期望；这通常意味着遵循诸如测试优先编程、结对编程和重构等实践。特别是对于 TypeScript，你应该力求实践第 3 章中描述的面向对象编程实践。\n\
  \n\n\n## 示例：Fizz Buzz 编码套路\n\nFizz Buzz 编码套路是编程练习的经典范例。它源于 Imran Ghory 基于儿童游戏 Fizz\
  \ Buzz 设计的求职面试题。原始游戏规则只有寥寥几条，但当程序需要满足这些规则而不断扩展时，其复杂度恰好能催生出多种可能的设计方案。你可以在他的网站上阅读\
  \ Imran 的原始文章：\n\n[`https://imranontech.com/2007/01/24/using-fizzbuzz-to-find-developers-who-grok-coding/`](https://imranontech.com/2007/01/24/using-fizzbuzz-to-find-developers-who-grok-coding/)\n\
  \n通过实践测试驱动设计方法论，你可以学习并提升以下几个关键方面：\n\n-   编写一个输出 1 到 100 数字的程序。\n-   对于任何能被三整除的数字，在输出中用单词\
  \ `Fizz` 替换该数字。\n-   对于任何能被五整除的数字，在输出中用单词 `Buzz` 替换该数字。\n-   对于任何能被三和五同时整除的数字，在输出中用单词\
  \ `FizzBuzz` 替换该数字。\n\n这些要求通常足以让你的编程能力得到充分锻炼。你可以使用这个版本，也可以修改和扩展它；根据游戏的一些变体或添加你自己发明的新规则来调整这个套路完全没有问题。已知的\
  \ Fizz Buzz 替代版本包括：一种基于数字是否包含某个数字（而非被某个数字整除）的规则，另一种则针对序列中的任何质数引入了额外规则。\n\n这是一个很好的套路示例，但还有许多不同的思路可以让你免于枯燥。请参阅附录末尾的参考资料以获取更多信息。\n\
  \n## 通用编码套路规则\n\n为了从测试驱动设计过程中获得最大收益，需要遵守一些纪律要素。这些要素总结如下。你可能会对这些规则、原则和口号感到有些不知所措，如果真是这样，你可以从最少的限制开始，逐步添加，直到感觉已掌握当前的规则集为止。\n\
  \n-   在编写任何实现代码之前，我们要先编写一个测试；这将驱动代码仅满足已知的测试，并促使我们在编写代码之前考虑测试场景。\n-   我们会保持测试与代码的解耦。我们不会为每个函数、类或模块创建测试，而是围绕一组行为创建一组测试。具体的实现细节（即，可能有多个类和方法满足测试）应该在测试中不可见。\n\
  -   我们所做的每一次更改，无论多小，都应产生可工作的代码。当我们重构时，每次停止键入时测试都应该通过。\n\n在继续之前，还有几个朗朗上口的口号需要处理。\n\
  \n-   **安排-行动-断言。** 也称为“三重 A”或 AAA 模式。它描述了你所编写的每个测试的结构，该结构应包含：安排被测程序的代码、执行一个动作，并断言结果。尽管测试结构如此，但从断言开始编写测试是有益的，因为它能让你聚焦于当前问题。\n\
  -   **红-绿-重构。** 这是一个重要概念，涉及在流程的不同阶段使用三种独立的思维模式。当你编写通过测试的代码时，速度比设计更重要；因此你应该编写能通过测试的最简单代码。这一点很重要，因为你应该专注于通过测试，别无他念。只有当你对问题迭代了一段时间，并且所有测试都通过之后，才应切换到`重构`思维模式——并且只有在重构时才应考虑设计。\n\
  \n人们很容易一开始就使用设计模式或其他你认为能为问题提供正确抽象的解决方案来编写程序。然而，容忍代码中的重复，要好过预判一个错误的抽象。代码库中许多最耗时、最复杂的问题，往往直接源于在正确的设计尚不明朗之前就过早地选择了错误的设计。一旦你有了一个可工作的程序，正确的抽象通常就会变得显而易见。此外，通过推迟重构，你的测试更不容易与实现细节耦合。用\
  \ Sandi Metz 和 Katrina Owen 在他们合著的《*99 Bottles of OOP*》一书中的话来说：\n\n> “你不应主动寻求抽象，而应抵制它们，直到它们绝对坚持要被创造出来。”\n\
  \n如果你迫不及待地想开始，请翻回第 10 章，了解使用 Jest 框架编写测试的详细信息。如果你对使用支持业务规范 Gherkin 语法的 TypeScript\
  \ 行为驱动开发框架感兴趣，我在 GitHub 上编写了一个示例供你学习：\n\n[`https://github.com/Steve-Fenton/TypeSpec`](https://github.com/Steve-Fenton/TypeSpec)\n\
  \n## 总结\n\n一旦你练习了 Fizz Buzz 编码套路，网上还有更多可用的资源（例如，[`http://codekata.com`](http://codekata.com)\
  \ ）。但不要局限于现有的编码套路列表；基于你遇到过的游戏或问题自己发明一些套路。最初的编码套路是一次实验，探究生产系统中针对一个真实问题的不同解决方案；因此，如果你正准备为程序添加一个功能，不妨先运行一个套路来生成并评估可能的解决方案。\n\
  \n你可以使用以下资源来了解更多关于编码套路和测试驱动开发的知识。\n\n-   《测试驱动开发：实战》（Addison-Wesley，2002 年），Kent\
  \ Beck 著\n-   《编程道场手册》（Emily Bache，2013 年），Emily Bache 著\n-   《99 Bottles of OOP》（电子书，2016\
  \ 年），Sandi Metz 和 Katrina Owen 著\n-   Ian Cooper 在 NDC 上的演讲：“TDD：哪里出了错？”\n\n[`https://vimeo.com/68375232`](https://vimeo.com/68375232)\n\
