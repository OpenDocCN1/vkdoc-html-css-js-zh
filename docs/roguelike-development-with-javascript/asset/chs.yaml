  ### 总结


  在本章中，我们研究了如何使用程序化生成来生成地牢布局。我们学习了一种许多 Roguelike 游戏使用的常见基本技术，称为*二叉空间分割*，以及如何应用它。


  在继续之前，请确保你理解了`BSPDungeon`类的工作原理，并尝试对其进行大幅修改，确保你开始理解是什么让一个关卡对你来说有趣。


  在下一章中，我们将完成将这个示例打造成一个具有多个层级和胜利条件的休闲 Roguelike 游戏。


