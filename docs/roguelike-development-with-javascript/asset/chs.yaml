- "# 引言\n\n在开始之前，首先要感谢您的购买；没有像您这样好奇的读者，这本书就没有存在的理由。我很高兴能通过本书的各章节及更远的内容，与您一同踏上游戏开发之旅。我们将一起开发一款基于\
  \ Web 技术的休闲 Roguelike 游戏，并更深入地了解这一备受喜爱且经久不衰的游戏类型。\n\n在本书结束时，您将拥有一个工具集和一个游戏，可以用来构建更复杂且更有成就感的\
  \ Roguelike 体验；您还将获得一系列链接和资源，用于进一步探索和学习通用游戏开发以及特定的 Roguelike 技术。\n\n## 本书适合谁\n\n\
  本书面向对 Roguelike 游戏感兴趣的网络开发者和网络游戏开发者。您不需要成为`JavaScript`高手就能处理本书中的代码；我保持了代码的简单和灵活，以便初学者和中级开发者不仅能自信地理解源文件中的内容，还能随心所欲地进行修改。\n\
  \n如果您已经是一名 Roguelike 开发者，但一直使用不同的语言并且对 Web 技术感到好奇，那么本书对您来说将是一次有收获的体验。对于经验丰富的 Roguelike\
  \ 开发者来说，书中展示的一些 Roguelike 技术可能显得基础；请记住，这只是一本入门书籍，任何旅程的第一步通常都是最简单的，而这些初步步骤对于该类型的新手来说是必要的。\n\
  \n## 如何阅读本书\n\n我坚信技术实验的价值，因此我将本书的章节和代码组织得易于理解，并鼓励喜欢动手和好奇的读者深入探索。阅读每一章的最佳方式是先阅读并理解其中呈现的示例，然后大量地玩弄、塑造、制作、调整和实验这些示例，之后再进入下一章。\n\
  \n我们将构建的示例略显基础；它们缺乏让一款游戏成为“你的游戏”的特质。通过修改代码并掌握它，你将创造出独一无二的作品，这总是比我能构建的任何示例都更有成就感。\n\
  \n我们的方法是随着我们阅读各章节并构建更复杂的功能时，反复地工作和修改代码。就像任何 Roguelike 游戏一样，我们会遇到死胡同，会回溯，会找到并修复 Bug。这并不是要呈现一个完美的单一示例，让你从中掌握\
  \ Roguelike 开发的本质；而是要逐步构建，在学习中享受乐趣，并随着我们的想法和知识的发展而不断迭代。没有游戏是从一开始就完美开发的；所有游戏都经历迭代，我们的示例也是如此。\n\
  \n你的旅程从翻开下一页开始。\n\n## 致谢\n\n作者衷心感谢所有了不起的人们，他们几十年如一日地持续创作出色的 Roguelike 内容并免费在线分享。感谢\
  \ RogueBasin^(¹)、Roguelike Celebration^(²)和 roguelikedev^(³)子版块等社区的温暖接纳，没有他们的内容，我将不知从何开始。\n\
  \n感谢 Kenney^(⁴)，他是一位永恒的慷慨源泉，制作了大量免费游戏资源。本书使用了他们的 1-Bit Pack，这是你在屏幕上看到的大部分魅力的来源。\n\
  \n感谢 Jack Oatley^(⁵)，他制作了我们在第 9 章中使用的 Doomed 字体。那个字体太棒了！\n\n感谢徐学桥^(⁶)，他的寻路库是我们地牢中所有危险元素的核心。\n\
  \n感谢 Richard Davies 和 Phaser^(⁷)背后的团队，这是我开发 Web 游戏的梦想库。\n\n感谢 Andrzej Mazur^(⁸)，从早年的\
  \ Firefox OS 时代开始，他就一直激励我创作游戏开发内容。\n\n最后，感谢 Apress 的编辑团队，他们在不断变化的世界中给予了耐心和帮助。\n\n\
  关于作者  \n关于技术审校  \n脚注  \n1  \n2  \n3  \n4  \n5  \n6  \n7  \n8\n\n"
- "# 1. 开始之前\n\n\n\n## 什么是 Roguelike 游戏？\n\n亲爱的读者，欢迎踏上游戏开发之旅的起点；我们将共同历经多个章节，打造一款休闲\
  \ Roguelike 游戏。但在深入探讨之前，我们有必要花些时间来定义和梳理：什么是 Roguelike 游戏、它们源自何处，以及本书将采用何种定义来界定这一类型。\n\
  \n大多数人一致认同，这一切都始于 1980 年代初期诞生的一款名为 *Rogue* 的游戏。这款游戏融合了 1970 年代早期作品的影响，例如基于文字的冒险游戏\
  \ *Colossal Cave Adventure*（它利用互动小说呈现场景的文字描述并收集玩家对动作的文本输入），以及类似 *Dungeons & Dragons*\
  \ 的桌上角色扮演游戏玩法——玩家在充满怪物和宝藏的地牢中探索。*Rogue* 的创新之处在于，它通过使用 ASCII 字符在屏幕上绘制游戏世界（如图 1-1\
  \ 所示）来实现空间化呈现，而非使用自然语言描述；同时，它利用随机生成算法产生迷宫和地牢，实现了无限的可重玩性。每一局 *Rogue* 游戏都是独一无二的体验；你可以反复游玩。\n\
  \n![../images/493112_1_En_1_Chapter/493112_1_En_1_Fig1_HTML.jpg](img/493112_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1  \n在 IBM PC 上运行的 Rogue 游戏画面示例^(⁹)\n\n从那时起，数百款 Roguelike 游戏相继问世。Roguelike\
  \ 是 1980 年代少数至今仍流行、且不断有新鲜作品和创新的游戏类型之一。长寿游戏类型的问题在于，它们会积累大量内容，以至于很难被明确定义。Roguelike\
  \ 社区至今仍在为判定某款游戏是否属于 Roguelike 而争论不休。请注意，许多如今被视为该类型标志性特征的元素在早期并不存在，而且那些早期开发者并不关心自己的游戏算不算\
  \ Roguelike；他们只想做出好游戏。随着时间的推移，这些游戏中的许多逐渐趋同于一套共同特征，这些特征最终成为了该类型的基石。\n\n### 柏林诠释\n\
  \n2008 年，参加国际 Roguelike 开发大会的人们提出了后来被称为**柏林诠释**^(¹⁰) 的定义，试图界定什么是 Roguelike。他们选定了一批经典游戏，并从这些游戏共有的特征中提炼出“什么是\
  \ Roguelike”的定义。这批经典游戏包括 *Rogue*、*NetHack*、*Angband* 和 *ADOM*。根据这些特征，他们进一步将其划分为**高价值因子**和**低价值因子**，如表\
  \ 1-1 和 1-2 所示。一款游戏无需具备所有因子才能被称为 Roguelike，但这份列表有助于我们理解当时该社区的价值观。\n\n表 1-2  \n根据柏林诠释，Roguelike\
  \ 的低价值因子\n\n| 因子 | 解释 |\n| --- | --- |\n| 单人角色 | 游戏聚焦于玩家在整个游戏过程中控制单一角色。 |\n| 敌我相似\
  \ | 适用于玩家的机制和特性同样适用于敌人。 |\n| 战术挑战 | 掌握战术对于通关至关重要。由于程序化生成，你无法单纯靠记忆取胜。 |\n| ASCII\
  \ 显示 | Roguelike 惯常使用 ASCII 字符构建界面。 |\n| 地牢 | 多数 Roguelike 游戏以地牢为基础，包含多层、迷宫和房间。\
  \ |\n| 数值 | 用于表示角色特性和属性的数值会被明确显示。 |\n\n表 1-1  \n根据柏林诠释，Roguelike 的高价值因子\n\n| 因子\
  \ | 解释 |\n| --- | --- |\n| 随机生成 | 世界是随机生成的，因此每局游戏都独一无二。 |\n| 永久死亡 | 游戏中死亡将导致游戏从头开始。\
  \ |\n| 回合制 | 游戏在用户输入后做出反应。玩家可以等待并规划行动，无需担心身后发生变故。 |\n| 网格化 | 游戏以网格形式呈现；玩家和所有其他游戏实体（例如敌人）都放置在该网格上。\
  \ |\n| 无模式化 | 游戏中所有可能的动作都在同一屏幕内完成。无需切换到不同的游戏模式。 |\n| 复杂性 | 游戏足够复杂且灵活，允许玩家在游戏过程中针对挑战采用多种解决方案。\
  \ |\n| 资源管理 | 游戏内资源有限，管理资源是乐趣的一部分。 |\n| 砍杀 | 击杀大量敌人是游戏的一部分。 |\n| 探索与发现 | 游戏要求玩家探索不同关卡，发现神秘物品、实体及其相互作用。\
  \ |\n\n即使在选定的经典游戏中，这些因子也并非总是同时存在。例如，*Angband* 和 *ADOM* 都具有不同的游戏模式。\n\n对于柏林诠释，存在着诸多批评。许多人认为该定义已过时，不能代表\
  \ Roguelike 的当前状态。^(¹¹) 我在本书中引入它，是为了帮助我们思考这些因子，以及哪些因子对我们有价值。将游戏归类到一个不断演变的类型中是相当困难的，而且我认为我们不应花费过多时间纠结于，我们将在本书中共同构建的小游戏是否足够“Roguelike”，以至于配得上这个称号。\n\
  \n### 什么是 Roguelite？\n\n在进一步深入分类的泥潭时，我们还需要了解另一个标签，即使只是为了之后将其否定：Roguelite。传统的 Roguelike\
  \ 游戏奖励玩家投入时间和研究。要在 *NetHack* 这样的游戏中登顶，你需要投入大量时间学习战术和特性，并准备好反复游玩。而像 *Dwarf Fortress*\
  \ 这样一款出色的游戏——按照许多过时的分类方案几乎算不上 Roguelike，但依我拙见，它确实是一款杰出的 Roguelike——若没有其维基页面和相关社区文章，几乎无法有效游玩。\n\
  \n你可能已经猜到，有一整个休闲玩家群体以往并未被传统 Roguelike 游戏所满足。随着智能手机和其他小型移动计算设备的兴起，休闲游戏出现了爆发式增长。人们希望在通勤途中玩游戏。如今最常发布的游戏是那些能轻松上手、无需大量投入就能享受乐趣的“即拿即玩”游戏。Roguelite\
  \ 正是对这类需求的回应。这类游戏易于上手，无需学习复杂机制。它们往往倾向于全图形化界面，可执行的操作也少于更传统的 Roguelike，因而非常受欢迎。\n\n\
  所有这些分类的问题在于界限的划定。你给一款 Roguelite 添加什么额外特征，才会让它越界变成 Roguelike？做出这种区分是否值得？这些都是社区仍在激烈争论的修辞性问题。这种更简化的\
  \ Roguelike 也曾被称为 *Roguelike-like*、*Roguelike-ish* 等标签。这其实并不重要。重要的是，有些人希望能够在 Roguelike\
  \ 游戏中区分出那些更简单、面向休闲玩家的作品。\n\n\n  \n## 本书对 Roguelike 游戏的定义  \n在本书中，我们将 Roguelike 游戏定义为具备以下特征的类别：\
  \  \n*   采用程序化生成技术创建基于格子的世界  \n*   具备永久死亡机制  \n*   采用回合制战斗系统  \n*   包含多个可供玩家探索的关卡\
  \  \n\n## 为什么要开发 Roguelike 游戏？  \n游戏开发本身就充满乐趣，它不仅教会你应对常见编程挑战的众多技巧与方法，这些技能在游戏之外的领域同样适用。Roguelike\
  \ 游戏尤其能吸引热爱计算机科学的人，因为它让你专注于算法、数据结构及其交互。对于喜欢叙事和世界观构建的人来说，它同样是个绝妙的媒介——Roguelike 游戏的生命力正源于机制、主题与玩法的总和。本质上，Roguelike\
  \ 游戏能为你的左右脑提供丰富且引人入胜的实践平台：你的分析思维有大量内容可供思考与实验，而你的创造思维则有更多素材需要雕琢并赋予生命。  \n\nRoguelike\
  \ 游戏是少数几个独立开发者或小团队不逊于大型工作室的游戏类型之一。你的 Roguelike 作品能在业界留下印记，并受到玩家和其他开发者的喜爱。Roguelike\
  \ 社区非常友好且充满参与乐趣，大家乐于分享知识、共同成长。  \n\n许多 3A 大作都在运用 Roguelike 开发所推崇的技术（如程序化生成）来提升游戏可玩性并减少内容创作时间。近年来的独立游戏畅销作不仅将程序化生成用于关卡设计，还拓展到了剧情和敌人设计。永久死亡机制为这些游戏增添了难度层次，吸引了小众但忠实的硬核玩家群体。我可以预见一种趋势：Roguelike\
  \ 开发的核心理念不仅会被主流游戏吸收，更会成为它们品质的亮点。  \n\n我相信 Roguelike 游戏能帮你掌握的技术技能不仅可直接用于游戏开发行业，在其他开发领域同样大有裨益。当你不断优化代码以匹配世界观构建（反之亦然）时，你的创造力也会提升。叙事是一项重要技能，它将使你终身受益。以上列举的理由能帮你向亲友解释为什么投入时间开发\
  \ Roguelike 游戏，并证明这项付出的价值，但最根本的原因是你**想要**开发 Roguelike。这是一项有趣的活动，而你有一个想法——某个值得探索的机制、主题或约束的微光。你的脑海中藏着一个小型地牢，你的创意深藏其中，你希望邀请更多人进入。是的，你可以用关于职业和知识的理性论证来证明学习\
  \ Roguelike 开发的价值，但最有力的理由是情感层面的：你这么做，是因为你热爱它。  \n\n## 为什么要使用 Web 技术？  \n即使你开发的是一款出色的游戏，也很难说服别人真正安装它。每周都有成千上万款游戏涌入主流应用市场，想要脱颖而出极为困难。工作室需要投入巨额营销费用才能说服玩家尝试他们的游戏。用户尝试你游戏的门槛越低，他们真正去尝试的可能性就越高。\
  \  \n\nWeb 技术让我们能够发布无需安装即可在多种设备上畅玩的游戏。基于 Web 的游戏理论上可以在智能手机、平板电脑、笔记本电脑、台式机等设备上运行。你既可以将这些网页游戏发布到主流游戏市场，也可以选择在网络上自主分发。这是以最小阻力实现最广覆盖的方式——用户只需打开网页即可开始游戏。\
  \  \n\n使用 Web 技术的另一个重要方面是：它能缩短向用户推送新版本的间隔。如果你通过持续更新测试版并收集测试者反馈来公开开发游戏，这点尤为重要。你无需重新发布安装包并等待测试者更新——只需更新一个在线网页，所有测试者就能获取并测试最新版本。这种快速迭代不仅对玩家有利，对你同样有益：任何节省时间与麻烦的事情，都能让你解放精力专注于真正重要的东西——你的游戏本身。\
  \  \n\n本书将主要聚焦于`JavaScript`，仅少量涉及`HTML`和`CSS`。`JavaScript`是一种极易上手的语言，对初学者非常友好，同时也能被资深开发者运用得游刃有余。新手能轻松用它做出可用的成果，而不会遇到过多挑战。并非所有语言都能让开发者从入门阶段就开始制作拿得出手的作品，同时又不妨碍未来开发顶尖游戏。通过\
  \ Roguelike 游戏开发提升`JavaScript`技能，是开发者高效升级的绝佳途径。  \n\n虽然其他语言比`JavaScript`运行更快、资源控制更强，且如果你想进入游戏行业也值得学习，但请千万不要认为投入时间学习`JS`是不值得的。正如\
  \ Brendan Eich 所说：“永远押注`JS`！”——如今的`JavaScript`引擎已是功能强大的虚拟机，能让你的 Roguelike 设计发挥到极致。在本书中，你永远不会遇到语言或运行时成为制约的情况。`JS`始终是我们的资产，绝不会成为\
  \ Roguelike 开发之旅的局限。  \n\n\n\n## 为什么选择 Phaser？\n\n市面上有许多优秀的网页游戏开发框架。撰写本书时，我选择使用\
  \ Phaser，因为它可能是 JavaScript 领域最流行的游戏开发框架。如果从原生 JavaScript 开始，我们将被迫重新实现许多底层游戏编程模式。因此，我们将使用一个不限定游戏类型的通用游戏开发框架。游戏中的\
  \ Roguelike 部分将由我们自己实现，但我们将站在巨人的肩膀上，充分利用该框架中针对通用游戏编程特性所付出的辛勤努力。\n\n`Phaser` 易于学习，并经过数千款游戏和数百万玩家的实战检验。它是一个在业界广泛使用的成熟框架，学习它有助于你更接近专业领域人士所使用的工具。无论是业余爱好者还是专业人士，都在使用这个框架。网上有大量学习资料供你深入研究，它同时也是\
  \ Apress 另一本专注于多人游戏开发的书籍所使用的框架，因此将这两本书结合起来，你或许最终能开发出一款多人 Roguelike 游戏，对吧？\n\n`Phaser`\
  \ 让开发适配不同设备屏幕尺寸的游戏变得更加容易。这一点对于扩大我们游戏的受众范围至关重要，因为无论是使用智能手机等小型设备，还是笔记本电脑等较大型设备的用户，都能畅玩我们的\
  \ Roguelike 游戏。\n\n`Phaser` 游戏的一般生命周期和工作流程，与其他基于 Web 或原生的框架类似。如果你将来决定使用其他框架，在这里学到的许多概念将具有可移植性。\n\
  \n值得注意的是，`Phaser` 是一个通用的游戏开发框架；它不会强制或限制你开发特定类型或风格的游戏。它在这一点上非常灵活，你可以将它用于未来的其他项目。话虽如此，我们本可以使用专为\
  \ Roguelike 开发设计的库，这些库通过提供现成的、经过测试的功能（这些功能对大多数 Roguelike 游戏来说既常见又重要）来节省大量工作。我决定不使用这些库，原因有二。\n\
  \n第一个也是最重要的原因是，我认为学习 `Phaser` 对任何从事网页游戏开发的人都至关重要。这使得本书不仅对 Roguelike 开发者有用，也便于那些已经熟悉\
  \ `Phaser` 并希望学习更多 Roguelike 知识的读者入门。\n\n第二个原因是，通过迫使我们自己重新实现某些功能，我们最终能够比简单使用现成包更深入、更有意义地理解它们。这样做的一个积极副作用是，我们会对那些不辞辛劳创建现成\
  \ Roguelike 库的开发者更加心怀敬意。如果你将来尝试使用这些库，你将能更好地理解它们的内部机制。\n\n对我来说，使用 `Phaser` 的另一个重要方面是，它让我们只需一套最基本的工具就能开始开发。我们不需要复杂的样板代码和工具链才能起步。市面上还有其他使用复杂工具的引擎，是的，你也可以将你的\
  \ `Phaser` 环境配置得极其复杂，但我认为对于这本书来说，那会分散太多注意力。我希望专注于用 `Phaser` 构建一个 Roguelike 游戏；我们只会添加完成这项任务所需的最基本工具。在这本书中，我将极度聚焦于简洁性，但\
  \ `Phaser` 同样能服务于你未来更复杂的项目。\n\n## 我们要构建什么\n\n本书的项目是一个基于 Web 的小型 Roguelite 游戏。我们只构建足够让它被识别为\
  \ Roguelike 的功能，而不会让这本书变成一本上千页的“圣经”。这个项目是 Roguelike 开发的初始阶段；如果你喜欢，可以在此基础上深入探索。\n\
  \n关于本书内容组织方式的一个决定，可能颇具争议，因此最好在开始之前就解释清楚。大多数 Roguelike 教程都从程序化生成和地牢开始讲起。而我打算将程序化生成放在本书靠后的章节。当我们讲到那部分时，我们已经知道如何绘制地牢、在其中填满怪物和宝藏，以及游戏玩法是如何运作的。这将使我们能够进行程序化生成的实验，并感知它如何影响游戏玩法，因为静态的游戏部分已经完成。如果游戏的那些部分已经在运行，那么就更容易看出不同的地牢，或者更强大、更普遍且行为更智能的怪物如何改变游戏体验。因此，即使我个人认为程序化生成是\
  \ Roguelike 游戏的主要基石，我也只会在本书的后半部分触及这个话题。\n\n首先，我们将了解 `Phaser` 库，并使用它来绘制一个地牢。然后，我们将添加一个玩家角色并编写游戏循环。一旦这部分工作完成，我们将添加怪物、宝藏和多个关卡。当所有这些部分都到位后，我们将深入探讨程序化生成。\n\
  \n我希望你和我一样对开始编码感到兴奋；在下一章中，我们将学习 `Phaser` 的基础知识，并动手打造我们的第一个地牢。\n\n"
- '# 第二章：Phaser 简介


  这将是一个入门章节，侧重于游戏开发概念以及如何使用 `Phaser`，而不是真正开始构建 Roguelike 游戏。在开始编写代码并学习如何使用 `Phaser`
  构建游戏之前，我们将先逐步了解相关概念和术语。学习了这些概念之后，开发本书的项目将变得容易得多。


  在本章中，我们将涵盖以下内容：


  *   设置工具：让我们的计算机为开发做好准备

  *   游戏开发概念：开发游戏所需的通用术语和理论

  *   `Phaser` 状态：如何将这些概念应用到 `Phaser` 中


  所有后续章节都将建立在本章构建的基础之上，但我们到底要在本书中构建什么呢？


  ## 介绍《*微缩地牢*》


  本书的项目是一个我们称之为《*微缩地牢*》的小型 Roguelite 游戏。这个游戏被设计得很简单，作为你未来探索 Roguelike 游戏的一个 *易于扩展的项目*。你心中需要明确的一个重要方面是，我们希望创建一个简单的原型
  Roguelike 游戏。我们不以创新的机制或玩法为目标；这些会在你个人游戏开发的旅程中逐渐涌现。《*微缩地牢*》更像是一个让我们练习构建 Roguelike
  游戏的练习项目。


  我们的游戏将是一款奇幻题材的地牢探险游戏，玩家将穿越多个程序化生成的关卡，与怪物战斗并获取物品，直到在地牢最深处找到一件魔法物品。我们将慢慢地构建这个游戏。一开始，我们完全不使用任何程序化生成，然后在后期逐步添加并进行实验。


  游戏将具备的主要 Roguelike 特征是：


  *   程序化生成的内容

  *   永久死亡

  *   回合制行动


  那么，带着这些想法，让我们开始设置计算机吧。


  ## 环境设置


  对于《*微缩地牢*》，我们将使用一个非常简单的设置。这是有意为之，这样我们就可以专注于游戏本身，而不是被 JS 开发者们面对的无尽工具选择所困扰。


  我们设置环境的主要目标是让它不碍事，并且在我们构建游戏的过程中保持透明。




  ### 安装 Web 服务器


  你需要安装`Node.js`^(¹³)才能使用本书所需的 Web 服务器。我们将使用长期支持版本，你可以从[`Node.js`官网](https://nodejs.org)找到安装方法。`Phaser`并不强制要求`Node.js`，本书示例也不会直接使用它。你只需要安装一个小型
  Web 服务器来运行示例程序即可。


  大多数基于 Web 的游戏项目都会使用`Node.js`来构建和转译游戏。转译技术能让开发者使用*最新的*JavaScript 特性，同时仍能部署到市面上大多数浏览器。`Node.js`通常用于将最终交付版本打包成更小的文件，以便更高效地部署。本书不会涉及这些内容，因为执行这些任务所选择的工具不仅取决于每位开发者的喜好，还取决于每个项目的具体需求。


  通过将`Node.js`仅作为 Web 服务器使用，并按照我们编写的方式在浏览器中部署和执行 JavaScript 代码，将更容易调试和操作我们的源代码。这种方法的另一个优点是，你无需为了配合我可能任意选择的开发栈而学习新工具。本书中的示例代码简单易懂，便于实验。我希望通过只使用编辑器、浏览器和
  Web 服务器这三种工具，能减少你在修改代码和尝试新内容时遇到的阻碍。希望这种简洁性能激发你动手实践的热情。


  你可以通过打开终端并执行以下命令来验证`Node.js`是否安装正确：


  ```

  $ node -v

  ```


  该命令应返回已安装的`Node.js`版本号。确认`Node.js`安装成功后，请检查`NPM`（`Node.js`包管理器）是否也已安装：


  ```

  $ npm -v

  ```


  现在你可以安装 Web 服务器了。我选择了一个非常简单的具有自动重载功能的服务器，这意味着当你打开示例文件后，如果修改了任何文件并保存，页面会自动重新加载。使用以下命令安装：


  ```

  $ npm i -g live-server

  ```


  这将全局安装`live-server`命令。


  ### 选择代码编辑器


  任何常用的编程编辑器都足以完成我们将要构建的项目。如果你已有自己喜欢的编程编辑器，继续使用即可。如果没有偏好的选择，我推荐使用`Visual Studio Code`^(¹⁴)或`Atom`^(¹⁵)。这两款编辑器对
  JavaScript 工作流都有出色的支持。


  ### 获取源代码


  安装好`Node.js`和选定的编辑器后，你需要获取`Nano Dungeon`的源代码。本书的源代码可通过图书产品页面在 GitHub 上获取，地址为[`www.apress.com/ISBN`](http://www.apress.com/ISBN)。


  本书每章都有一个顶层文件夹，每个章节文件夹中又包含多个示例子文件夹，对应各章使用的不同示例。每个示例都是独立的，不需要用到其文件夹外部的文件。


  ### 运行示例


  在终端中，进入你要运行的示例所在的文件夹。每章有一个顶层文件夹，每个章节文件夹内包含多个子文件夹，存放该章使用的各类示例。


  执行`live-server`命令；服务器将启动并打开一个网页，显示运行中的示例程序。


  ## 游戏运行原理


  在深入探讨`Phaser`和编码之前，我们最好先了解一些常见的游戏开发概念。其中最重要的是**游戏循环**。大多数游戏都将游戏玩法流程绑定到游戏循环上，理解其工作原理有助于你规划并开发各类游戏。


  游戏循环是游戏跳动的心脏，赋予游戏生命并驱动其动画。在大多数游戏中，这颗心脏随着每一帧画面绘制到屏幕而跳动。因此，如果你的游戏以每秒 60 帧运行，那么游戏循环也每秒运行
  60 次。


  在游戏循环的每一次跳动中，它都需要执行相同的任务：判断玩家试图做什么，模拟这些动作的结果，最后将结果绘制到屏幕上。基本上，我们可以将游戏循环总结为三个阶段：获取玩家输入、模拟世界、绘制结果，如图
  2-1 所示。


  ![../images/493112_1_En_2_Chapter/493112_1_En_2_Fig1_HTML.jpg](img/493112_1_En_2_Fig1_HTML.jpg)


  图 2-1 游戏循环


  例如，在（简化版的）《吃豆人》游戏中，游戏循环会从街机摇杆获取用户输入，判断玩家试图移动的方向，然后计算玩家的新位置。接着，它会计算每个幽灵的移动方向并确定它们的新位置。最后，它会在玩家和幽灵移动后绘制它们。这个过程每帧重复，营造出连续动作和运动的错觉。


  （简化版的）《俄罗斯方块》游戏循环也很容易推断：确定玩家试图移动下落方块的方向，计算方块的新位置，并使该方块与其他方块碰撞，如果形成完整行则消除相应部分。检查累积的方块堆是否已到达顶部，如果是，则游戏结束。


  在动作游戏中，游戏循环通常尽可能频繁地运行，并倾向于匹配*每秒帧数*的值。在回合制游戏中，过去常见的是游戏循环会阻塞等待玩家输入，仅运行一次交互后再次阻塞，等待后续输入。如今，即使是回合制游戏，其游戏循环也以与帧率相同的频率运行，并在此基础上模拟回合制机制。这简化了动画和其他游戏部分的实现，通常是使用现成的、不区分游戏类型的库（如`Phaser`）的结果，因为`Phaser`的核心功能并未提供专门的回合制游戏特性。


  在`Nano Dungeon`中，我们将尽可能频繁地运行游戏循环，但仅在玩家有输入时才触发世界变化。这样，当玩家思考下一步行动时，游戏世界的其他部分不会运行。


  现在是时候了解这个概念如何应用于基于`Phaser`的游戏了。


  ## Phaser 简介


  我们将在`Nano Dungeon`中使用`Phaser 3`^(¹⁶)。网上有大量关于`Phaser`的资料，但在搜索时很容易找到`Phaser 2`而非`3`的内容。请注意，尽管两个库都称为`Phaser`，但`Phaser
  2`和`3`的 API 并不相同。你无法在我们的项目中使用`Phaser 2`的代码。


  `Phaser`是一个非常灵活的框架，你可以用它构建简单的玩具或功能完整的复杂游戏。这意味着我们在本书中不会用到`Phaser`的许多功能，因为它们不适用于我们这个简单的游戏。`Phaser`的文档^(¹⁷)非常详尽；如果你想更深入了解本书中展示的任何
  API，不妨查阅一下。


  开始编码前需要理解的第一个概念是`Phaser`的**场景**。




  ### Phaser 场景


  Phaser 游戏由场景构成。每个场景都包含自己的游戏循环，有些简单的游戏甚至只需一个场景即可组成。你可以将场景理解成游戏所经历的不同状态。典型的街机游戏可能包含：一个用于标题画面的场景、一个用于选项画面的场景、一个用于游戏玩法的场景，以及两个用于游戏结束的场景（一个表示获胜，另一个表示失败）。当玩家进行游戏时，游戏会自然地根据需求在这些场景之间流转。我们的大多数示例都只包含单个场景。


  让我们一起来创建一个最简单的场景，并逐行解读代码。本示例的代码位于 `chapter-2/example-1-simple-scene/` 文件夹中。


  ### 一个简单的场景


  本节的示例包含一个 HTML 文件、一个 JS 文件，以及一些用于加载位图字体的辅助资源。所用的 HTML 文件非常简单，其唯一功能就是加载 JS 文件。


  `chapter-2/example-1/index.html`


  ```

  Chapter 2 - Example 1 - Simple Scene

  ```


  本示例的重点在于 JS 文件，它将把 Phaser 场景插入 HTML 中包含的 `div#game` 元素中。下面我将展示 JS 源码并随后进行解释。


  `chapter-2/example-1/game.js`


  ```

  const scene = {

  preload: function () {

  this.load.bitmapFont("arcade", "font/arcade.png",  "font/arcade.xml");

  },

  create: function (){

  this.add.bitmapText(400, 300, "arcade", "Hello Phaser").setOrigin(0.5);

  }

  }

  const config = {

  type: Phaser.AUTO,

  width: 800,

  height: 600,

  backgroundColor: "#000",

  parent: "game",

  pixelArt: true,

  scene: scene,

  physics: {

  default: "arcade",

  arcade: {

  gravity: { y: 0 }

  }

  }

  };

  const game = new Phaser.Game(config);

  ```


  #### 游戏配置对象


  要在 Phaser 中启动游戏，必须有一个配置对象来描述用于初始化库的参数。这些参数在示例的 `config` 对象中定义。有些属性不言自明，例如 `width`、`height`
  和 `backgroundColor`，很容易理解。其他一些则需要进一步解释。


  `type` 属性告诉 Phaser 使用哪种渲染器。有两种可能的渲染器：基于 Canvas 的渲染器或基于 WebGL 的渲染器。WebGL 效果更好，但并非所有浏览器和设备组合都支持。使用
  `Phaser.AUTO` 可以让 Phaser 为其运行的设备选择最佳选项。


  `parent` 属性用于指向应容纳游戏的 HTML 元素。在我们的示例中，我们将其指向任何 `id` 为 `game` 的元素，在我们的 HTML 中它是一个
  `<div>`。


  通常，Phaser 会对绘制到屏幕上的图形使用一些平滑和抗锯齿处理；我们通过将 `pixelArt` 属性设置为 `true` 来禁用这些功能，这将使我们的 roguelike
  游戏感觉更复古、更漂亮。


  `physics` 属性稍微复杂一些。Phaser 捆绑了不同的物理引擎，能够模拟事物在现实世界中的行为方式。这些引擎在复杂性和功能上各不相同，因此你可以选择最适合游戏需求的选项。它们并非用于科学模拟的那种引擎；它们提供的是功能集合和力学机制，帮助你以重力、快速子弹、碰撞等方式实现游戏世界的物理系统。这对于使用移动和射击实体的街机游戏尤其有用。在本示例中我们并未使用该属性，但最好还是加以解释，因为我们必须将其添加到游戏配置对象中。该属性在示例中的作用是选择
  `arcade` 引擎（这是 Phaser 绑定的最简单的物理引擎），并将 `y` 轴的重力设置为零，因为我们制作的是俯视图游戏，不希望物体像掉入世界底部那样向南坠落。


  游戏配置中的最后一个选项指向要加载的 `scene`（场景），这将是下一节的主题。




  #### 场景对象


  与本书后续示例中使用的场景对象相比，这个示例中的场景对象非常简单；尽管如此，它却是一个让我们开始深入了解该类对象的好机会，因为场景对象将是贯穿全书使用最频繁的
  Phaser 概念。


  一个 Phaser 场景既可以使用对象构建，也可以使用类构建；在本示例中，我们使用对象。场景的生命周期会经历不同的状态，开发者可以自由选择只实现对其场景有意义的状态。这些状态是以同步流程调用的
  JavaScript 函数，因此每个回调函数只有在前一个函数执行完毕后才会被调用，如图 2-2 所示。


  ![../images/493112_1_En_2_Chapter/493112_1_En_2_Fig2_HTML.jpg](img/493112_1_En_2_Fig2_HTML.jpg)


  **图 2-2** 场景生命周期


  Phaser 首先调用 `preload` 函数，这让你有机会预加载所需的任何外部资源。在我们的示例中，我们正在加载一种位图字体。这种字体使用一张图片和一个 XML
  文件，因此我们在代码中同时传入它们：


  ```

  this.load.bitmapFont("arcade", "font/arcade.png", "font/arcade.xml");

  ```


  Phaser 中有一个加载器插件，通常通过 `this.load.*` 与之交互；在本例中，我们使用加载器加载 `bitmapFonts`，并将字体命名为 `arcade`。这个名称将在后续的生命周期回调中使用。


  在 `preload` 之后，Phaser 会调用 `create`；这个回调函数用于首次设置你的场景以进行显示。本例的代码只是将一段文本添加到屏幕中央。


  ```

  this.add.bitmapText(400, 300, "arcade", "Hello Phaser").setOrigin(0.5);

  ```


  与加载器插件类似，还有另一个场景插件，即 `GameObjectFactory`。这个花哨的名字让它听起来比实际更难理解。它的作用是方便地向场景添加游戏对象；你通常通过
  `this.add.*` 与之交互。在我们的示例中，我们使用 `arcade` 字体在 400x300 坐标处添加一个 `bitmapText`，用来写入 *Hello
  Phaser*。在进入代码的最后一部分之前，我们应该详细讨论的一个重要概念是坐标系，以及在 `create` 代码末尾的 `.setOrigin(0.5)` 的作用。


  Phaser 主要是一个 2D 游戏引擎，我们使用一个二维坐标系来绘制东西。坐标从 0x0 开始，即画布的左上角，并向下和向右增长。这可能会让那些数学好的读者觉得违反直觉，但大多数计算机图形引擎都是这样工作的。


  当我们使用 `this.add.*` 将游戏对象添加到屏幕时，传入的坐标锚定在游戏对象的左上角。这意味着，如果我们传入的是屏幕中心的坐标，那么添加的游戏对象其左上角将位于该坐标处，而它的主体则在这个坐标点的下方和右方。


  想要居中放置某物，最佳方法是改变这些坐标在特定游戏对象上的锚定方式，即修改其原点。你可以使用游戏对象的 `setOrigin` 方法重新定位被视为原点的坐标。你可以通过阅读其文档来了解更多关于该例程的信息；这里我们向它传入一个参数
  `0.5`，这会导致该游戏对象在 `x` 轴和 `y` 轴上的原点都重新定位到中点。总之，`setOrigin(0.5)` 会使对象的原点坐标从左上角变为对象的中心，从而更容易将其放置在我们想要的位置。


  代码的最后一行初始化游戏对象并加载示例：


  ```

  const game = new Phaser.Game(config);

  ```


  要查看示例，你需要使用 Web 服务器加载 HTML。如果你按照本章开头概述的步骤操作并安装了 `live-server`，则可以使用终端进入 `chapter-2/example-1-simple-scene/`
  文件夹并执行 `live-server`。服务器将启动，浏览器将打开。你应该能看到示例像这样运行：


  *第 2 章，示例 1：在网页浏览器中运行*


  ![../images/493112_1_En_2_Chapter/493112_1_En_2_Figa_HTML.jpg](img/493112_1_En_2_Figa_HTML.jpg)


  这个示例并未包含图 2-2 中展示的所有生命周期方法；它只包含了前两个回调：`preload` 和 `create`；其中没有 `update`，这意味着该场景是一个静态场景，创建后便不再变化。


  与其在这个示例中添加更多代码，不如让我们切换到本章的第二个示例。请在你喜欢的编辑器中打开 `chapter-2/example-2-scene-with-update/`
  文件夹的内容。这个新示例的内容与前一个相同，但我们更改了场景的代码；更具体地说，我们将更改 `create` 的代码并添加 `update` 的代码。让我们从
  `create` 的新代码开始：


  ```

  create: function () {

  this.helloText = this.add.bitmapText(400, 300, "arcade", "Hello Phaser").setOrigin(0.5);

  }

  ```


  这段代码的变化在于，我们不再只是将 `bitmapText` 添加到屏幕中央，而是将该操作的结果赋值给 `this.helloText` 属性。由于 `create`
  和 `update` 将属于同一个对象，我们可以使用 `this.*` 在生命周期函数之间传递游戏对象。


  如图 2-2 所示，`update` 函数会一遍又一遍地调用自身，它是游戏循环跳动的心脏。我们这个示例的目标是让“Hello Phaser”文本向右移动，消失后再从左侧重新出现，就像你在电影中看到的那些滚动字幕屏幕一样。


  ```

  update: function() {

  this.helloText.x += 10;

  if (this.helloText.x > 1000) {

  this.helloText.x = -200;

  }

  }

  ```


  我们可以通过这个 `this.helloText` 引用来访问在 `create` 中添加到场景的 `bitmapText`。游戏对象有很多有用的方法和属性，随着本书的深入我们会逐步解释，但对于这个示例，我们只关心对象的
  `x` 坐标。在每个 `update` 周期中，我们将对象在 `x` 轴上的位置增加 10 个像素。如果我们不采取其他措施，文本将向右消失，一去不返。为了避免这种情况并实现滚动字幕效果，我们设置了一个
  `if` 子句，检查文本是否在屏幕外（记住画布只有 800 像素宽，所以如果文本的 `x` 位置是 1000，则文本已超出画布右侧），并使用负的 `x` 坐标将其重新定位到屏幕左侧。


  使用该文件夹上的 `live-server` Web 服务器加载该演示，将启动示例，你将能够看到滚动字幕效果。


  这个示例包含我们将用于大部分 *Nano Dungeon* 游戏实现的生命周期方法。尽管如此，如果我们根据图 2-1 中概述的流程来思考，你会注意到我们只做了那里显示的三个步骤中的两个：我们正在*模拟世界*，然后*绘制下一帧*；这个示例及之前的示例中都没有用户输入。在本章结束之前，我们需要添加用户输入，这样我们才能拥有一个完整的交互式游戏循环。


  在你的编辑器中打开 `chapter-2/example-3-interactive-gameloop/`。同样，`create` 和 `update` 都有变化。


  在 `create` 中，我们向对象添加了一个属性，以便能够从 `update` 函数中检查光标键的状态。我们的目标是允许用户使用光标键移动文本。为此，我们将使用键盘插件中的
  `createCursorKeys()` 函数，这是一个便捷的函数，它会返回一个反映计算机键盘上四个方向键状态的对象：


  ```

  create: function () {

  this.helloText = this.add.bitmapText(400, 300, "arcade", "Hello Phaser").setOrigin(0.5);

  this.cursors = this.input.keyboard.createCursorKeys();

  }

  ```


  在 `update` 中，我们将按顺序检查每个光标键，并根据按下的键改变文本的位置：


  ```

  update: function () {

  if (this.cursors.left.isDown) {

  this.helloText.x -= 10;

  }

  if (this.cursors.right.isDown) {

  this.helloText.x += 10;

  }

  if (this.cursors.up.isDown) {

  this.helloText.y -= 10;

  }

  if (this.cursors.down.isDown) {

  this.helloText.y += 10;

  }

  }

  ```


  对于按下的每个键，我们从文本的位置上增加或减去 10 个像素，使其向按下的方向移动。启动该演示，你将能够使用计算机键盘上的方向键控制文本的位置。




  ## 练习


  你能将纸带采样与交互式游戏循环结合起来，使得当玩家将文本移出屏幕时，它会从另一侧重新出现吗？


  ### 本章小结


  本章涵盖了大量内容。在继续前进之前，你需要确保已掌握以下关键要点：


  - 游戏循环的概念，以及它如何成为游戏跳动的心脏

  - Phaser 场景的生命周期，包括 `preload()`、`create()` 和 `update()`


  在下一章中，我们将开始编写一款 Roguelike 游戏。到本章结束时，屏幕上将不再只是一个简单的“Phaser 你好”，而是会有一个地下城和一个玩家角色。


