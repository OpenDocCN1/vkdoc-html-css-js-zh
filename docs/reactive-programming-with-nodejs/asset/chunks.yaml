    still remain functional.


    Depending on your infrastructure, the tools used to measure and handled the elasticity
    may vary, usually cloud providers like Amazon and Microsoft’s Azure provide you
    with the tools to automate such processes, but there are always tools you can
    use to manually perform these tasks.


    The point of this requirement is, simply put, that a reactive system should be
    able to react to the current work load and adjust it’s available resources accordingly
    to provide cost-effective performance, meaning, scaling down to save resources
    when they’re not needed, as well as scaling up but only as much as needed, to
    keep the costs of such resources under a certain pre-set roof.


    ### Message Driven


    Finally, reactive systems should have their components communicate using asynchronous
    messages, allowing for most of the requirements I’ve listed. This even allows
    for errors to be treated as messages that can be sent from one component to the
    other.


    As I stated before, this single requirement is the corner stone for all of the
    others, this mechanism provides the necessary foundation for all services to communicate
    with each other, which in turn provides the ability to keep scaling the number
    of processes without affecting their capacity to talk to each other, and which
    in turn, means your system is capable to coming up with a response and sending
    it back to the end-user in a short enough timespan.


    All in all, as you can see, the title “Reactive systems” makes it sound a lot
    bigger than it actually is, in fact, the list of requirements is just a list of
    good design decisions that will help your architecture provide a good user experience
    and to react to both, the user’s input and the changes on it’s environment.'
