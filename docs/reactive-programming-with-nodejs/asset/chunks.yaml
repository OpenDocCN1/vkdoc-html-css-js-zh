    Cheese.prototype.onError = function(fn) {

    var self = this;

    //The first time we set an error handler if we''re dealing with a fromStream case,
    we make sure that

    //the error event is taken care of

    if(this._error_transformations.length == 0 && this._source_name == ''stream'')
    {

    this._stream.on(''error'', function(err) {

    self._execute(0, err, null, self._error_transformations);

    });

    }

    this._error_transformations.push(fn);

    return this;

    };

    module.exports = Cheese;

    ```


    This concludes the analysis of the main library, let me know show you the code
    for the helper functions, which should also provide some interesting read.


    ## The Little Cheese


    This first version of R-Cheese provides a total of nine transformations and are
    exported as individual functions to simplify the task of adding more, simply add
    the new function to the `utils.js` file and export it.


    Even though the exported transformations are quite different from each other,
    the structure of the functions that define them is always the same, they basically
    use the following template:


    ```

    function transformation([params]) {

    var _fn = function([params]) {

    //your code here

    };

    _fn.__fn_type = ''[FUNCTION TYPE IDENTIFIER]'';

    _fn.newInstance = function() {

    //your code here

    };

    return _fn;

    }

    ```


    Every transformation function is actually a wrapper for the actual function that
    does the work. Thanks to the fact that functions in JavaScript are also objects,
    I can add some properties to it, mainly `__fn_type` which is a string identifying
    the type of transformation (this is used by the `_execute` method on the main
    library''s code as you already saw) and the `newInstance` method, which basically
    should return a new instance of the transformation (you can find this method being
    used on the main library''s `each` method).


    So let me now go over each transformation built into the code, some of them have
    already been covered in past chapters and some of them might be new to you, so
    hopefully, with the explanation and the code you should have no problem understanding
    them.


    ## Map, Filter, and Reduce


    These three are the most common ones out there, and I''ve covered them in past
    chapters as well, so there is not a lot to say about them that I haven''t already
    said. So instead, let me just show you the implementation for them:


    ```

    function map(fn) {

    var _fn = function(value, done){

    fn(value, done); //this version of the map function is asynchronous, so it requires
    a callback

    };

    _fn.__fn_type = ''map'';

    _fn.newInstance = function() {

    return map(fn);

    };

    return _fn;

    }

    function filter(fn) {

    var _fn = function(value, done) {

    fn(value, done);

    };

    _fn.__fn_type = ''filter'';

    _fn.newInstance = function() {

    return filter(fn);

    };

    return _fn;

    }

    function reduce(init, fn) {

    var accu = init;

    var listenerSet = false;

    var _fn = function(stream, value, done) {

    accu = fn(accu , value);

    if(!listenerSet) {

    stream.on(''end'', function() {

    done(accu );

    });

    listenerSet = true;

    }

    };

    _fn.__fn_type = ''reduce'';

    _fn.newInstance = function() {

    return reduce(init, fn);

    };

    return _fn;

    }

    ```


    As you can see , all three functions follow the template I showed before. The
    first one, the `map` function is nothing much really, it is the simplest one in
    the bunch, and it only acts as syntactic sugar since all it does, is execute the
    function received as parameter. Because of the `_execute_normal` method on the
    main library, doing a `map` or simply passing an anonymous function to the `then`
    method does the same thing.


    The `filter` function is quite simple as well, in-fact, its code is almost exactly
    the same as the `map` one, with the only difference of a different function type
    identifier, which in turn, tells the main library how to interpret the output
    of this function and what to do with it.


    Finally, the `reduce` function (also known can `scan` in other libraries), will
    accumulate the chunks in the manner specified by the function received, and once
    the stream ends, it will emit the accumulated result. As you can see, that is
    the reason why this function requires the stream to be passed as parameter, it
    needs to subscribe to the `end` event of the internal stream.'
