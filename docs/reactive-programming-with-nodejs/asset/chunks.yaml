    \    if (fn.__type === 'map') {\n      newFn = function(val) {\n        self.next(fn(val));\n\
    \      };\n    }\n  }\n  if (newFn) this.events.push(newFn);\n  return this;\n\
    };\n```\n\n`Streamable` 类提供了著名的 `then` 方法，传递给它的每个函数都会被包装成另一个函数（该函数负责调用事件链中的下一个函数），并添加到一个列表中。一旦触发\
    \ `trigger` 事件，该类将遍历该列表并依次调用每个函数。\n\n## 辅助 `map` 函数\n\n```javascript\nfunction\
    \ map(fn) {\n  var curried = function(val) {\n    return fn(val);\n  };\n  curried.__type\
    \ = 'map';\n  return curried;\n}\n```\n\n> **注意**：你可能已经注意到错误处理非常简单；当然，这是为了简化。最终的代码将包含所有必要的错误处理。\n\
    \n## 增强：使用属性定义替代 `getValues` 方法\n\n为了使代码更具声明性，可以用带 `setter` 的属性定义来替代 `getValues`\
    \ 方法。因此，我们直接移除该方法，并在构造函数中添加以下代码：\n\n```javascript\nfunction ObservableStream()\
    \ {\n  this.values = [];\n  this.error_fn = null;\n  EE.call(this);\n  Object.defineProperty(this,\
    \ 'data', {\n    get: function() {\n      var self = this;\n      var stream =\
    \ new Streamable();\n      self.on('data', function(v) {\n        stream.start(v);\n\
    \      });\n      return stream;\n    }\n  });\n}\n```\n\n现在不再需要 `getValues` 方法，你可以直接使用\
    \ `data` 属性。\n\n## 使用 `ObservableStream` 的示例\n\n以下示例演示了如何使用上述代码转换和处理 `ObservableStream`：\n\
    \n```javascript\nvar fs = require(\"fs\");\nvar dataStream = new ObservableStream();\n\
    \ndataStream.data\n  .then(map(function(x) {\n    return 'filename_' + x + '.txt';\n\
    \  }))\n  .then(fs.readFile)\n  .then(map(function(x) {\n    return '' + x;\n\
    \  }))\n  .then(console.log);\n\nvar stdin = process.stdin;\nstdin.setRawMode(true);\n\
    stdin.resume();\nstdin.on('data', function(input) {\n  var str = input.toString();\n\
    \  dataStream.add(str);\n  if (str == 'x') {\n    process.exit();\n  }\n});\n\
    ```\n\n上述代码包含两个主要部分。第一部分为 `ObservableStream` 进行设置：实例化它并建立转换链。第二部分代表外部数据源。\n\n\
    我们先介绍第二部分，因为从数据流的角度来看，这里是一切开始的地方。这段代码基本上允许你捕获用户每次按下键盘时触发的事件。利用该事件，将接收到的对象转换为 `String`\
    \ 并添加到自定义集合中。额外的 `if` 语句用于确保可以在需要时停止监听并关闭程序。\n\n这部分代码可以替换为任何其他实现，关键点在于：当数据到来时，你将其添加到可观察集合中。数据从哪里来并不重要。\n\
    \n现在，回到代码的第一部分，这里设置了处理数据流的函数链。这些函数非常直观，正如本章前面提到的：声明式代码更容易阅读和理解。\n\n处理步骤如下：\n\n\
    1. 使用 `map` 函数将每个按键字符转换为文件名。\n2. 将文件名传递给 `fs.readFile` 方法，读取对应文件。\n3. 将返回的缓冲区转换为实际的\
    \ `String`。\n4. 最后，将第 3 步的输出（读取的文件内容）传递给最后一步，通过 `console.log` 打印出来。\n\n是的，逻辑非常简单，但它的美妙之处在于你只关注这些逻辑，而不必关心如何读取文件、处理错误等底层细节。\n\
    \n---\n\n## 总结\n\n这一章内容很丰富，涵盖了很多知识点，希望你在阅读过程中也能享受到乐趣！\n\n本章涵盖的主要内容：\n\n- **JavaScript\
    \ 函数式编程要点**：了解了什么是一段代码被认为是函数式的，学习了主要原则，并掌握了一些函数式程序员必须了解的工具。\n- **声明式编程的优势**：再次回顾了声明式编程相对于传统命令式方法的好处。\n\
    - **可观察流（Observable Streams）**：作为函数式响应式编程库的基石，我向你展示了它们的工作原理，并实现了一个简单的版本。\n\n在下一章中，我将探讨响应式编程如何在后端发挥作用，因为响应式编程通常用于前端开发。\n\
    \n---\n\n# 4. 后端响应式编程\n\n现在你已经了解了相关背景知识，终于到了动手实践的时候了。在本章中，我将分析如何将函数式响应式编程（FRP）的优势应用到后端开发中。\n\
    \n为此，我将介绍一组后端程序员常见的用例，首先查看常规实现，然后采用 FRP 方式重新实现相同的用例。\n\n由于我没有自己开发或从现有库中选取的 FRP\
    \ 模块，我将假设已经有一个自定义的 FRP 模块可用。这将在两个方面帮助我：\n\n- 为代码提供所需的支持。\n- 帮助定义即将开发的 FRP 模块的\
    \ API。目前我假设它已经存在，并且所有需要的函数/方法都可用。\n\n到本章结束时，你将拥有足够的理由开始在后端代码中使用响应式编程。为此，我将介绍两个非常常见的用例：\n\
    \n- **带 CRUD 端点的简单 API**：我将创建一个简单的 API，提供单个端点，包含所有 CRUD（创建、读取、更新和删除）功能。\n- **登录**：将向之前开发的\
    \ API 添加一个用于获取认证令牌的端点。\n\n那么，让我们直接开始吧。\n\n## 带 CRUD 端点的 API\n\n对于任何后端开发者来说，这可能是最常见的用例之一。过去你很可能遇到过至少一两个这样的功能，但我们将完整地查看\
    \ CRUD 函数集。\n\n显然，有多种实现方式，每种方式都同样有效。为了本示例的目的，让我们定义一些约束条件。\n"
- fmt: "### The Models\n\nThe API will deal with two models, that way it’ll also include\
    \ some logic dealing with the relationship of both of them. In particular, the\
    \ models will be `User` and `Address`. Each user will have a set of addresses\
    \ and they will have the following structure:\n\n- **User**\n  - `first_name:\
    \ String`\n  - `last_name: String`\n  - `birth_date: Date`\n  - `addresses: [\
    \ Address ]`\n- **Address**\n  - `street_name: String`\n  - `house_number: Number`\n\
    \  - `phone_number: String`\n\n> **Tip:** Attributes like an `Id`, the creation\
    \ date, or any other mandatory basic one are left out of the list and assumed\
    \ added to the models by the framework being used.\n\n#### The API\n\nTable [4-1](#A418015_1_En_4_Chapter.html#Tab1)\
    \ is the list of endpoints that the API will provide with the code. They’re mainly\
    \ the bare minimum needed to provide a RESTful interface to deal with the resources\
    \ represented by the models.\n\n**Table 4-1.** *List of Endpoints for the API\
    \ Being Developed*\n\n| HTTP Method | URL | Description |\n| --- | --- | --- |\n\
    | `GET` | `/users/` | Returns the list of users |\n| `GET` | `/users/:id` | Returns\
    \ the information for one specific user (given by the `id` parameter on the URL)\
    \ |\n| `POST` | `/users` | Creates a new user on the database |\n| `POST` | `/users/:id/addresses`\
    \ | Adds an address to the list of addresses of a given user |\n| `PUT` | `/users/:id`\
    \ | Updates the information of one particular user (note that this does not update\
    \ the information of an address model) |\n| `DELETE` | `/users/:id` | Removes\
    \ the user (and its associated addresses) from the database |\n\n### The Standard\
    \ Implementation\n\nIn order to implement the aforementioned specs, I’ll use a\
    \ set of standard modules. In particular, `Express.JS` (available at [`http://expressjs.com/`](http://expressjs.com/))\
    \ will be the web framework of choice (because let’s face it, it is the de facto\
    \ standard when it comes to web frameworks for Node.js). I’ll also be using `Mongoose`\
    \ ([http://mongoosejs.com/](http://mongoosejs.com/)) as an ORM for the storage\
    \ layer, which will be done over `MongoDB` (this is simply because the lack of\
    \ schema will simplify the development of this use case).\n\nI’ll organize the\
    \ code into three files: `models-crud-api.js` will have the definition of both\
    \ schemas and it will export a dictionary of all the defined schemas; `routes-crud-api.js`\
    \ will have the definition for all endpoints of the API, and it will export the\
    \ router object used to define them; and finally `main-crud-api.js`, which will\
    \ simply contain the main code for the API.\n\nLet’s take a quick look at how\
    \ that code would look like:\n\n**routes-crud-api.js**\n\n```javascript\nvar router\
    \ = require(\"express\").Router(),\nmodels = require(\"./models-crud-api\");\n\
    router.get('/', function(req, res, next) {\nmodels.users.find({})\n.populate('addresses')\n\
    .then(res.json.bind(res))//we make sure the 'this' is correct when the function\
    \ is called\n.catch(next) ;\n});\nrouter.get('/:id', function(req, res, next)\
    \ {\nmodels.users.findById(req.params.id)\n.populate(\"addresses\")\n.then(function(usr)\
    \ {\nif(!usr) {\nreturn res.status(404).json({\nerror: true,\nmsg: 'User not found'\n\
    });\n}\nreturn res.json(usr);\n})\n.catch(next);\n});\nrouter.post('/', function(req,\
    \ res, next) {\nmodels.users.create(req.body)\n.then(function(usr) {\nres.json(usr);\n\
    })\n.catch(next);\n});\nrouter.post('/:id/addresses', function(req, res, next){\n\
    var addressPromise = models.addresses.create(req.body);\nvar userPromise = addressPromise.then(function(address)\
    \ {\nreturn models.users.findById(req.params.id)\n});\nPromise.all([addressPromise,\
    \ userPromise], function([address, user]) {\nuser.addresses.push(address._id);\n\
    return user.save();\n}).then(function(user) {\nreturn res.json(user);\n}).catch(next);\n\
    });\nrouter.put('/:id', function(req, res, next) {\nmodels.users\n.findByIdAndUpdate(req.params.id,\
    \ req.body, {new: true}) //{new: true} makes sure the updated document  is returned\n\
    .then(function(usr) {\nres.json(usr);\n})\n.catch(next);\n});\nrouter.delete('/:id',\
    \ function(req, res, next) {\nmodels.users\n.findByIdAndRemove(req.params.id)\n\
    .then(function() {\nres.sendStatus(200);\n})\n.catch(next);\n});\nmodule.exports\
    \ = router;\n```\n\nFrom the above code, you can see that the main logic for the\
    \ endpoints is not that complicated; you can pretty much map each one to a helper\
    \ method provided by `Mongoose`, with the clear exception of `/:id/addresses`,\
    \ which requires you to do a small amount of thinking in order to understand it\
    \ (first creating the address and then updating the user with the reference, all\
    \ of it using promises).\n\n**models-crud-api.js**\n\n```javascript\nvar usersSchema\
    \ = Schema({\nfirst_name: {\ntype: String,\nrequired: true\n},\nlast_name: {\n\
    type: String,\nrequired: true\n},\nbirth_date: Date,\naddresses: [\n{\nref: 'Address',\n\
    type: Schema.Types.ObjectId\n}]\n});\n```\n\n> **Tip:** Although normal JS code\
    \ convention is `camelCase`, the fields used for the models are expressed using\
    \ `snake_case` because that is the default standard for `MongoDB`.\n\n```javascript\n\
    var usersModel = mongoose.model('User', usersSchema);\nmodule.exports = {\nusers:\
    \ usersModel,\naddresses: addressModel\n};\n```\n\nEntities schemas and models\
    \ definition and final models dictionary export; the rest is your run-of-the-mill\
    \ code, and there is nothing relevant to mention about it.\n\n**main-crud-api.js**\n\
    \n```javascript\nvar express = require(\"express\"),\nbodyParser = require(\"\
    body-parser\"),\nmongoose = require(\"mongoose\"),\nuserRouter = require(\"./routes-crud-api\"\
    );\nvar app = express();\napp.use(bodyParser.json());\napp.use('/users', userRouter);\n\
    //Generic error handler\napp.use(function(err, req, res, next) {\nconsole.error(\"\
    --- Error encountered ---\");\nconsole.error(err);\nres.status(500).json({\nmsg:\
    \ err,\nerror: true\n});\n});\nmongoose.connect('mongodb://localhost/test-chapter4');\n\
    var db = mongoose.connection;\ndb.once('open', function() {\nconsole.log(\"Database\
    \ connection established...\");\napp.listen(3004, function() {\nconsole.log(\"\
    Server started ...\");\n});\n});\n```\n\nThe final or, actually, main file for\
    \ this example and the two relevant bits to mention about it are listed here.\n\
    \n1. The generic error handler defined; this function will be called from the\
    \ endpoint’s code when the `catch` statement is executed. This is very easy to\
    \ test: Simply try to create a user leaving out the last name, that will cause\
    \ a validation error, which will trigger the `catch` clause, which, in turn, will\
    \ call `next` with the error parameter, causing the error handler to be called.\n\
    \n2. The last few lines show how you can start the web server on port `3004`,\
    \ but only after the connection to the database has been established (that is\
    \ what that `open` event means). This is a pretty standard and safe way of initializing\
    \ your application, making sure all services are up, before starting the web server.\n\
    \n### The Functional Reactive Implementation\n\nThis implementation should be\
    \ different, but not in every way. I’m not trying to rewrite the web server, or\
    \ the ORM into being fully reactive; instead, I’m just trying to implement the\
    \ business logic using this paradigm.\n\nIn this particular example, this translates\
    \ to rewriting the router-related code, since that’s where its main logic lays.\
    \ And in order to do that, I’ll transform the endpoints into observable collections,\
    \ where every new request is a new event added. With that in mind, I’ll apply\
    \ a set of transformations to that event that will render the results as you need\
    \ it in every case."
