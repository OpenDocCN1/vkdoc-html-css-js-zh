  trans: '

    ### 他们的动机


    Netflix 后端最初的架构基于一系列 RESTful API，这些 API 提供了一个通用平台，供其多个客户端应用程序依赖。这是它的优点，但缺点在于，由于它是通用的且旨在服务差异巨大的客户端，每个服务只会返回客户端功能所需数据的一部分。


    随着用户数量增长，这种机制最终失控，因为每个客户端加载单个页面需要发起太多请求，而每个请求都会在网络延迟中增加额外耗时（这不仅影响页面加载时间，也影响内部服务通信）。最终，他们决定采用不同的方案。图
    8-1 直观展示了该问题。


    ![A418015_1_En_8_Fig1_HTML.jpg](img/A418015_1_En_8_Fig1_HTML.jpg)


    图 8-1. 原 Netflix 架构机制示意图


    图 8-1 展示了经典 RESTful API 架构的基本思路。该图表示单个客户端为某个功能发起的请求。渲染单个页面可能需要多条信息，因此会发起多个请求，这反过来又为每个请求增加了网络延迟。你可以看到这种情况如何失控。


    取而代之的是，他们决定转变思路，将创建所需数据集所需的逻辑迁移到后端，从而将客户端的任务简化为单个请求（并消除了因网络延迟造成的几乎所有额外时间）。图 8-2
    展示了这一变化如何影响其后端。


    ![A418015_1_En_8_Fig2_HTML.jpg](img/A418015_1_En_8_Fig2_HTML.jpg)


    图 8-2. 客户端请求更少的新架构


    现在，所有关于信息收集及如何整合信息的重要逻辑都已移回 API 的代码中，将图 8-1 中的五个请求减少为一个，本质上将整个过程的网络延迟成本降低到单个请求的水平。


    作为此变更的一部分，并且为了真正实现性能提升，他们还决定采用并发编程，同时将线程安全和并行执行实现中固有的复杂逻辑从客户端开发体验中剥离。基本上，他们需要为在其
    API 上进行开发的工程师提供一种方法，使其能够获得并发编程的全部能力，而无需处理通常伴随而来的繁琐事务。就在那时，他们采用了响应式编程。


    ### 并发性的需求


    后端并发执行对于实现他们寻求的性能提升至关重要，因为否则单个“大型”客户端请求就无法真正与同一客户端使用旧 API 机制发起的多个“小型”请求竞争，原因很简单：得益于
    Web 服务器提供的并发性，这些小请求会并行执行。


    考虑到这一点，Netflix 的精英们评估了所有选项（考虑到他们只使用 Java）。回调和 Future 都不够好；这两种技术都承诺，如果逻辑过于复杂，会很快变得难以控制。


    但是，当他们评估响应式编程模型时，他们意识到这将提供他们所需的并发性，并为开发者提供一个易于使用和易于理解的模型，而正如我之前所说，这反过来将有助于缩短开发周期。正如你可能猜到的，缩短上市时间对大多数人来说是一个巨大的优势。


    仔细想想，响应式模型基于推送而非拉取，简化了从外部服务并发获取数据的任务，尤其是在微服务架构中（这将是理想情况）。开发者无需担心线程或类似结构，因为平台会处理这些；同时从多个来源获取数据只需订阅它们并等待它们推送数据回来。


    为实现这一目标，Netflix 的开发者将微软创建的 `RxJS` 库（我在第 6 章中介绍过）移植到 JVM 上，创建了 `RxJava` (`https://github.com/ReactiveX/RxJava`)。它可以与运行在
    JVM 上的多种语言协同工作，如 Scala、Groovy 和 Clojure。


    ### 成果


    Netflix 在其技术博客中报告称，得益于这些变更以及在后端采用响应式编程，他们的开发者能够成功利用并发编程，而无需应对其常见的典型问题。


    ### 沃尔玛案例


    这个案例具体涉及沃尔玛加拿大分公司，它是沃尔玛的子公司，也是该国最大的零售商之一。在这个特定案例中，早在 2012 年，由于互联网的持续增长以及每天连接网络的新设备，他们的架构开始力不从心，流量峰值开始影响他们，导致用户无法访问其在线商店（参见下方图
    8-3 中的示例），并造成销售损失。像黑色星期五 (`https://en.wikipedia.org/wiki/Black_Friday_%5Bshopping`)
    和网络星期一 (`https://en.wikipedia.org/wiki/Cyber_Monday`) 这样的日子不再是机遇，反而变成了问题（参见下方图
    8-4 中关于 2012 年高峰期流量的图表），因此他们必须采取行动。


    ![A418015_1_En_8_Fig4_HTML.jpg](img/A418015_1_En_8_Fig4_HTML.jpg)


    图 8-4. 高峰期流量增长图表


    ![A418015_1_En_8_Fig3_HTML.jpg](img/A418015_1_En_8_Fig3_HTML.jpg)


    图 8-3. 关于 2012 年沃尔玛在线能力状态的推文截图


    当时，他们的系统基于 Oracle ATG，这需要一个专门的开发团队，并且上市时间太长。其扩展能力也非常有限。总而言之，他们需要改变视角，并且为了能够良好地扩展，他们需要一个全新的事件驱动架构。

    '
- fmt: '### The Proposed Solution


    In order to achieve this, they needed to take a 180° turn, and so they started
    to research options, the winner turned out to be the `Scala` ( [http://www.scala-lang.org/](http://www.scala-lang.org/)
    ), `Akka` ([http://akka.io/](http://akka.io/)), and `Play` ( [https://www.playframework.com/](https://www.playframework.com/)
    ) combo. That technology stack runs on the `JVM`, so that provided a nice migration
    plan for the company, enabling them to ease the developers into the stack while
    doing the migration, instead of going all at once, with the corresponding trouble
    that approach can bring.


    The Web framework (`Play`) would allow them to easily scale up and down their
    Web servers when needed. It would also help them leverage multi-core architectures
    and handle massively superior amounts of concurrent users than their old stack.
    Development times for the teams working on `Play` were between two and three times
    faster than those for the legacy teams.


    With `Scala` and `Akka`, they were able to create a message-driven, reactive back-end
    architecture based on micro-services.


    One of the advantages of going reactive was the simplification of the programming
    tasks; the improved time-to-market would allow them to bust out features much
    faster, just like the case with `Netflix`.


    As it turns out, a reactive approach for a micro-services architecture, because
    with it you can translate the benefits of RP into your architecture, that is,
    it ends up being:


    * `responsive`: meaning that the system will respond in a timely manner if possible.

    * `resilient`: the system will stay responsive no matter what. Components are
    isolated form each other, providing containment in the face of failure.

    * `message - driven`: the entire system relies on asynchronous message passing
    between components. This allows components to transmit failure as messages as
    well.

    * `elastic`: the system will remain responsive under varying workloads.


    ### The Results


    In the next 4 weeks after these changes went live, `Walmart.ca` reported:


    * An increase on conversions of 20%

    * Their mobile orders went up by 98%

    * A reduction of 36% on customer''s page load time

    * And, most importantly, no downtime during the peak traffic days like `Black
    Friday`


    ## One More Case


    As a final study case, instead of looking at another success case, let’s build
    a little proof of concept ourselves, shall we? Using `R-CheeseJS` of course, I’m
    going to show you a pure `Node.js` app. It should provide, next to the code from
    the previous chapter, more practical insight into programming reactive systems.


    The little `PoC` I’m going to build is a Chat app. It’s going to be small, but
    it should be functional enough to make it interesting.


    It’ll have a server to centralize all communications and a client app that can
    be executed as many times as needed. Clients and server will communicate through
    sockets (I’ll use `socket.io`, which can be found at [https://www.npmjs.com/package/socket.io](https://www.npmjs.com/package/socket.io),
    to handle that code), and client-client communication will be done through the
    server.


    A chat app is a great fit for a reactive approach, because there are a lot of
    opportunities to react to different events, such as incoming messages, users logging
    in and out, and even custom commands that can be sent from clients to the server.
    In this particular example, the app will:


    * Allow any client to connect to the server and talk to the rest of the users.

    * Every new login action will notify all connected clients of the event.

    * Every client will be able to send messages that will be broadcast to all other
    clients.

    * Each client can send a command to list all logged users in order to receive
    a list of all participants.

    * Each client can send an exit command, effectively ending its connection to the
    chat server.

    * Every time a client is disconnected, all other clients will be notified of that
    event.

    * If the chat server is closed, all clients will handle that event gracefully.


    The list of modules used for this example is minimal. I tried to keep it that
    way to show the power of the approach and, of course, the language itself:


    * `express.js` ( [https://www.npmjs.com/package/express](https://www.npmjs.com/package/express)
    ) is used to boot up the server, but nothing else.

    * `socket.io` is used to create the chat server and handle all socket-related
    tasks.

    * `socket.io-client` ( [https://www.npmjs.com/package/socket.io-client](https://www.npmjs.com/package/socket.io-client)
    ) provides the ability to create a command line client for `socket.io` instead
    of needing a Web browser (this app is 100% command line).

    * Finally, `winston` ( [https://www.npmjs.com/package/winston](https://www.npmjs.com/package/winston)
    ) is used to simplify logging and message formatting on the console.


    **Note**


    The other dependency that’s not listed in there is the library shown on the previous
    chapter: `rCheese`.


    Figure [8-5](#A418015_1_En_8_Chapter.html#Fig5) shows a screenshot of the output
    from using the chat server (top section of the screen) with two clients (lower
    section of the screen). Let’s look at the code now to understand how this can
    be implemented using `rCheese` in `Node.js`.


    ![A418015_1_En_8_Fig5_HTML.jpg](A418015_1_En_8_Fig5_HTML.jpg)


    **Figure 8-5.** Screenshot of two clients and the chat server interacting'
