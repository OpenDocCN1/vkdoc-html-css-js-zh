- fmt: '# Pull Based Buffers


    Given the benefits of the push strategy, why would we want to go with the opposite?
    Well, for starters, if you have too many consumers (how many are too many will
    depend on the queue you’re using at the moment), the time it takes for the middleware
    (the actual queue) the notification process that takes place to let them know
    about the new message might take too long.


    Also, this type of model is subject to problems with the rate of consumption from
    the subscribers is lower than the rate of productions of the publishers, in that
    case the buffer might run out of memory, or storage of suffer from kind of problem
    that might lead to a system-wide issue (think Denial of Service attack here).


    If instead of giving the queue the responsibility of finding the one subscriber
    that can handle the new message, you get the consumers to query the queue on fixed
    time intervals and pull the messages out, then you remove that problem. Now, the
    queuing solution that you’re using will be hit both, by the consumers and by the
    publishers, this translates into more traffic going into it, so you’ll have to
    take that into account when scaling.


    Pulling also adds another layer of complexity to your consumers, because not only
    do they have to query the queue, they also need to handle race conditions raised
    when several consumers attempt to grab the same message. You only want one of
    them to actually process it, and the rest to move on to the next one.


    Taking out a message from the queue, or marking it as read, or whatever technique
    you use to make sure only one consumer gets it, needs to be atomic, meaning, it
    needs to happen on a single instruction.


    Even though the model for interacting with the queuing solution in this case is
    different, the actual products out there aren’t that different. Most of the message
    queues out there support pull based operations, so `Kafka`, `RabbitMQ`, those
    are all still options, `Redis`’ `Pub/Sub` for instance is not, it will not directly
    work, but you can easily work around it by using a list as your main queue, and
    setting lock keys for your messages, in order to mark them as read before taking
    them out of the queue.


    ## So, Pull or Push?


    As you might’ve guessed by now, there is no simple answer to this question, the
    type of model you choose will depend entirely on your use case. Hopefully both
    descriptions has given you enough information to pick, but just to recap:


    You would normally go with a push based buffer when:


    - You need to keep your logic simple.

    - You don’t have an enormous amount of consumers working in parallel.

    - You’re looking to react to it as soon as the messages arrive.


    On the other hand, you would rather go with a pull based approach when:


    - You are dealing with really high traffic into your system.

    - You want to have control over the rate of consumption of your messages.

    - You want to process the messages in batches, instead of one by one as they come.


    # Creating Reactive Systems


    Over these nine chapters, I’ve covered what Reactive Programming means, I’ve shown
    examples, even created a library that allowed you to do some reactive programming
    yourself, but when it comes to architectural decisions, there are a set of considerations
    that you can have if you want to create reactive systems.


    In this last section of the chapter, I’m going to cover those considerations.
    Reactive systems are meant to be more flexible, loosely coupled and easily scalable
    (we already covered some of it before in the chapter). Essentially making these
    systems easier to develop, more fault tolerant and able to gracefully react to
    errors. And to accomplish this, your systems need to meet the following criteria:


    ## Responsive Systems


    Reactive systems need to be responsive, meaning, they need to always provide feedback
    to the users and they need to do so in a timely manner, a consistent response
    time is a requirement for these systems. In turn it will provide a better user
    experience and better error handling.


    In order to achieve this, as you’ll see, the system needs to comply with the requirements
    listed below, since it needs to be resilient in order to always be responsive,
    it needs to be elastic, in order to always provide a response back to the end
    user in a timely manner and it needs to be message driven to do so, because as
    you probably know by now, elastic scaling comes mainly from micro-service based
    architectures, and in order to communicate those services with each other you’ll
    need some kind of message system.


    ## Resilient to Errors


    Reactive systems are supposed to be resilient to all errors. That doesn’t mean
    your system is 100% error free, instead, it means it can handle unexpected errors
    gracefully, instead of crashing uncontrollably. This in turn, helps ensure the
    previous requirement, since any system that is not resilient will eventually become
    unresponsive at one point or another.


    Achieving an architecture that is resilient and capable of handling all sorts
    of errors and crashes is not simple, in fact several areas need to be taken into
    account, for instance:


    - **Replication**, to ensure redundancy, both of the data and the services. Data
    stores are a good example in this case, they normally provide a cluster mode,
    which not only provides data redundancy but also add back-up server for every
    active master to ensure the service is always working by avoiding single points
    of failure on their architectures.

    - **Containment and isolation** to make sure failure on one component stays independent
    of the rest of the system, it prevents a fatal cascading effect where one simple
    error or unhandled exception crashes a system, which in turn crashes another and
    so on until the entire architecture is unresponsive.

    - **And delegation**, making sure all components can delegate responsibilities
    between each other (like error handling, logging, and so on).


    ## Elastic Scaling


    Elasticity on a system is usually intended to reference its capacity to handle
    varying amounts of load by increasing or decreasing the resources used. During
    the first section of this chapter, this topic was covered and examples were given
    on how to design architectures that are able to scale up or down when needed and
    still remain functional.


    Depending on your infrastructure, the tools used to measure and handle the elasticity
    may vary, usually cloud providers like Amazon and Microsoft’s Azure provide you
    with the tools to automate such processes, but there are always tools you can
    use to manually perform these tasks.


    The point of this requirement is, simply put, that a reactive system should be
    able to react to the current work load and adjust its available resources accordingly
    to provide cost-effective performance, meaning, scaling down to save resources
    when they’re not needed, as well as scaling up but only as much as needed, to
    keep the costs of such resources under a certain pre-set roof.


    ## Message Driven


    Finally, reactive systems should have their components communicate using asynchronous
    messages, allowing for most of the requirements I’ve listed. This even allows
    for errors to be treated as messages that can be sent from one component to the
    other.


    As I stated before, this single requirement is the corner stone for all of the
    others, this mechanism provides the necessary foundation for all services to communicate
    with each other, which in turn provides the ability to keep scaling the number
    of processes without affecting their capacity to talk to each other, and which
    in turn, means your system is capable of coming up with a response and sending
    it back to the end-user in a short enough timespan.


    All in all, as you can see, the title “Reactive systems” makes it sound a lot
    bigger than it actually is, in fact, the list of requirements is just a list of
    good design decisions that will help your architecture provide a good user experience
    and to react to both, the user’s input and the changes on its environment.'
