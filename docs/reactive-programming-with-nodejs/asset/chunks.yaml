- fmt: '### Their Motivation


    The initial architecture behind Netflix’s back-end was based on a series of RESTful
    APIs that provided a generic platform on which their multiple client applications
    could rely. That was the up side to it, the down side, though, was that because
    it was generic and meant to serve very different clients, each service would only
    return a portion of the data needed for the client’s features.


    Those mechanics eventually got out of hand when their users numbers got high enough,
    because every client would need to make too many requests for a single page, and
    for every request, you have to add network latency to the time equation (not only
    affecting page-load times but also affecting internal service communications).
    In the end, they decided to go with a different approach. Check out Figure [8-1](#A418015_1_En_8_Chapter.html#Fig1)
    for a visual representation of that problem.


    ![A418015_1_En_8_Fig1_HTML.jpg](A418015_1_En_8_Fig1_HTML.jpg)


    Figure 8-1. Diagram showing the mechanics of the original Netflix architecture


    Figure [8-1](#A418015_1_En_8_Chapter.html#Fig1) shows the basic idea behind the
    classic RESTful API-based architecture. The image represents a single client’s
    requests for one feature. Several pieces of information might be needed for a
    single page rendering, so several requests are made, which in turn adds network
    latency for every request. You can see how this can get out of hand.


    Instead, they decided to switch things around and moved the logic needed to create
    the required dataset to the back-end, thus simplifying the client’s job to a single
    request (and removing almost all the extra time due to network latency). Figure
    [8-2](#A418015_1_En_8_Chapter.html#Fig2) shows you how the change affected their
    back-end.


    ![A418015_1_En_8_Fig2_HTML.jpg](A418015_1_En_8_Fig2_HTML.jpg)


    Figure 8-2. New architecture with less client requests


    Now all important logic regarding gathering of information and how to put it all
    together has been moved back to the API’s code, reducing all five requests from
    Figure [8-1](#A418015_1_En_8_Chapter.html#Fig1) into a single one, essentially
    reducing the network latency costs of the entire process to that of a single request.


    As a part of the change, and in order to truly achieve performance gains, they
    also decided to embrace concurrent programming while at the same time removing
    the inherently complex logic behind thread safety and parallel execution implementations
    from the client developer experience. Basically, they needed to give the developers
    hacking on their APIs a way to have all the power of concurrent programming without
    all the hustle that normally comes with it, and that was when they adopted reactive
    programming.


    ### The Need for Concurrency


    Concurrent execution on the back-end was crucial to get the performance gain they
    were looking for, because otherwise a single “big” client request would not really
    be able to compete against a bunch of “little” requests done by the same client
    using the old API mechanics, simply due to the fact that those little requests
    would all execute in parallel thanks to the concurrency provided by the Web server.


    With this in mind, the good people at Netflix evaluated all their options (taking
    into account they were only dealing with Java). Callbacks and futures were not
    good enough; both techniques promised to get out of hand quickly if the logic
    got too complex.


    But when they evaluated the reactive programming model, they realized it would
    give them the concurrency they needed and an easy-to-use and easy-to-understand
    model for the developers, which, in turn, would help, as I’ve said in the past,
    with development times. Improving time-to-market is, as you can probably guess,
    a big plus for most people.


    If you think about it, the Reactive Model, by being push-based instead of pull-based,
    simplifies the task of concurrently getting the data from outside services and
    in a micro-services architecture, which would be the ideal case. The developer
    doesn’t have to worry about threads or similar constructs, because the platform
    will take care of that, and getting the data from several sources at the same
    time is just a matter of subscribing to them and waiting for them to push it back.


    To accomplish this, the developers at Netflix ported the `RxJS` library created
    by Microsoft (which I covered in Chapter [6](#A418015_1_En_6_Chapter.html)) into
    the JVM creating `RxJava` (`https://github.com/ReactiveX/RxJava`). It can work
    with many of the languages that work on the JVM, like Scala, Groovy, and Clojure.


    ### The Results


    Netflix has reported on their tech blog that thanks to these changes, and the
    adoption of RP on the back-end, their developers have been able to successfully
    leverage concurrent programming without the typical problems that come with it.


    ### The Case for Walmart


    This case is actually specific to Walmart Canada, a subsidiary of Walmart and
    one of the largest retailers of the country. In this particular case, back in
    2012, due to the ever-growing nature of Internet and the new devices that connect
    to it every day, their architecture started to fall short and traffic peaks started
    to affect them, leaving people out (see Figure [8-3](#A418015_1_En_8_Chapter.html#Fig3)
    below for an example of such a case) of their online store and causing them to
    lose sales. Days like Black Friday (`https://en.wikipedia.org/wiki/Black_Friday_%5Bshopping`)
    and Cyber Monday (`https://en.wikipedia.org/wiki/Cyber_Monday`) were becoming
    a problem instead of an opportunity (see Figure [8-4](#A418015_1_En_8_Chapter.html#Fig4)
    below for a chart of the traffic during peak days in 2012), so they had to act.


    ![A418015_1_En_8_Fig4_HTML.jpg](A418015_1_En_8_Fig4_HTML.jpg)


    Figure 8-4. Chart showing the increase in traffic during peak days


    ![A418015_1_En_8_Fig3_HTML.jpg](A418015_1_En_8_Fig3_HTML.jpg)


    Figure 8-3. Screenshot of a tweet regarding the status of Walmart’s online capabilities
    in 2012


    Back then, their systems were based on Oracle ATG, which required a specialized
    group of developers, and the time to market was too high. Its ability to scale
    up was also very limited. All in all, they needed a change of perspective, and
    in order to scale up properly, they needed a new event-driven architecture.'
