    name: usr.first_name,

    birth_date: usr.birth_date

    }, SECRET , {"expiresIn": "1 day "});

    })

    .then(map(function(t) { return { token: t }; }))

    .done(toJSONResponse)

    .catch(callErrorHandler);

    ```


    那么，转换步骤如下：


    1. 映射以从请求中获取登录数据。

    2. 然后根据这些信息查找用户。

    3. 过滤掉那些在上一步中没有返回用户的请求。

    4. 然后使用一个将于一天后过期的令牌来签署请求。

    5. 将返回对象转换为一个仅包含令牌信息的更简单的 json。

