    of client/server connection handler—basically a stream that would let you write
    messages from the server to the client and at the same time read the messages
    received by the server on the client application.


    In the end, when trying to implement a custom stream, Table [5-1](#A418015_1_En_5_Chapter.html#Tab1)
    will help you understand which methods need to be implemented and when.


    Table 5-1.


    Simple Cheatsheet to Explain When to Implement What Kind of Stream


    | When Doing… | Your Stream Is a… | And You Have to Implement… |

