    Streamable.prototype.start = function(val) {

    this.idx = 0;

    this.next(val);

    };

    Streamable.prototype.next = function(val, result) {

    if(this.idx >= this.events.length) return false;

    var currentFn = this.events[this.idx]

    this.idx++;

    currentFn(val);

    };

    Streamable.prototype.catch = function(errfn) {

    this.error_fn = errfn;

    };

    Streamable.prototype.then = function(fn) {

    var self = this;

    var newFn = null;

    if(!fn.__type) { //if it''s not one of our helper functions...

    if(fn.length > 1) { // checking the number of arguments a function receives. If
    it''s higher than 1, we''re assuming the second parameter is the done callback

    newFn = function(val) {

    fn(val, function(err, result) {

    if(err) return self.error_fn(err);

    self.next(result);

    });

    };

    } else {

    newFn = function(val) {

    self.next(fn(val));

    };

    }

    } else { //if it is...

    if(fn.__type === ''map'') {

    newFn = function(val) {

    self.next(fn(val))

    };

    }

    }

    if(newFn)

    this.events.push(newFn);

    return this; // we return the object, so we

    };

    ```


    The `Streamable` class provides the famous `then` method, and every function that
    is passed to it is wrapped into another function (that handles the call to the
    next function on the chain of events) and added to a list. Once the `trigger`
    event is fired, the class will iterate over that list and call one function after
    another.


    ```

    //Helper map function. This is how a curried function looks:

    function map(fn) {

    var curried = function(val) {

    return fn(val);

    }

    curried.__type = ''map''; //custom parameter so our then function knows how to
    handle us

    return curried;

    }

    ```


    Note


    You probably noticed that the error handling is pretty basic; that is, of course,
    for simplicity reasons. The final code will have all the error handling it needs.


    One extra enhancement that can be made to this code, just to make it a bit more
    declarative, would be to replace the getValues method with a property defined
    with a setter. So we just remove the method altogether, and inside the constructor,
    we add the following code:


    ```

    function ObservableStream() {

    this.values = [];

    this.error_fn = null;

    EE.call(this);

    Object.defineProperty(this, ''data'', {

    get: function() { //getValues'' old code

    var self = this;

    var stream = new Streamable();

    self.on(''data'', function(v) {

    stream.start(v)

    })

    return stream;

    }

    });

    }

    ```


    Now the `getValues` method is no longer required, you can simply use the data
    property.


    And here is an example that uses the above code to transform and work with an
    `ObservableStream`:


    ```

    //We instantiate the Observable Stream and set up the chain of transformations
    we''ll apply to it.

    var fs = require("fs");

    var dataStream = new ObservableStream();

    dataStream.data

    .then(map(function(x) {

    return ''filename_'' + x + ''.txt'';

    }))

    .then(fs.readFile)

    .then(map(function(x) {

    return '''' + x;

    }))

    .then(console.log);

    //The events for our stream will be generated by us when we press a key on our
    keyboard.

    var stdin = process.stdin;

    stdin.setRawMode(true);

    stdin.resume();

    stdin.on(''data'', function(input) {

    var str = input.toString();

    dataStream.add(str)

    if(str == ''x'') { //exit condition so we''re not listening for keystrokes until
    the end of time

    process.exit();

    }

    });

    ```


    There are two main sections in the preceding code. The first one sets everything
    up for the Observable Stream; it instantiates it and it also sets up the chain
    of transformations. The second half of the code represents an external source
    of data.


    Let’s first cover the latter, since it’s where everything starts, from the dataflow
    perspective anyway. This block of code basically allows you to capture the event
    fired every time the user presses a key on the keyboard. With that event, you
    just cast the object received to `String` and add it to your custom collection.
    The extra `if` statement is just there to make sure you can stop listening and
    close the program whenever you want.


    This code could be anything, the important thing here is that you’re adding values
    to your observable collection when they come. Where are they coming from? That’s
    irrelevant.


    Now, the first block of the code from before is where you set up the chain of
    functions that will handle the data coming from the stream. They’re pretty straightforward,
    which corresponds to what I mentioned earlier in this chapter: Descriptive code
    is much easier to read and mentally parse.


    The steps are very simple. For every key pressed:


    1.  Turn that character into a filename with the `map` function.  

    2.  Then pass that into the `fs.readFile` method, so it will read the file with
    that name.  

    3.  There is an extra step here, where you cast the buffer returned into an actual
    `String`.  

    4.  And finally, the output from step 3 (the content of the file read) is passed
    to this last step, which basically prints it out with console.log.


    Yes, the logic is pretty simple, but the beauty of it is that you’re focusing
    on that, not on how to read the file, handle errors, and all that low level jazz.


    ## Summary


    This was a big chapter, I covered a lot in it, and you also got to have some fun
    while reading it—at least I hope you did!


    So to recap, the chapter covered:


    *   Major points about functional programming in JavaScript, you saw what it meant
    for a piece of code to be considered functional, you went over the main principles,
    and you even covered some of the must-know tools any functional programmer should
    master.

    *   You also covered, again, the benefits of declarative programming over the
    good-old imperative approach.

    *   And then you moved into Observable Streams, which are the cornerstone of functional
    reactive programming library. I showed you how they’re supposed to work, and I
    even went over the implementation of one.


    For the next chapter, I will cover how RP is meant to help on the back-end, since
    RP is normally used for front-end development.


    # 4. Reactive Programming on the Back-end


    Now that you know what you’re dealing with, it is finally time to start getting
    your hands dirty. In this chapter, I’m going to analyze how you can take the advantages
    that functional reactive programming (FRP) provides and apply them to the back-end.


    To do that, I will go over a set of sample common use cases for back-end programmers,
    look at a regular implementation, and then take the FRP road and re-implement
    the same use case.


    Since I don’t have a FRP module developed by myself nor picked from the list of
    available ones, I will assume I have a custom one already developed. This will
    help me in two fronts:


    *   It will provide the required support the code needs.

    *   It will help define the API for the soon-to-be-developed FRP module. Right
    now I’ll assume I have it, and that every function/method needed is already available.


    By the end of this chapter, you’ll have all the justification you need to start
    going Reactive on your back-end code. And to do that, I’ll go over two very common
    use cases:


    *   Simple API with CRUD endpoints: I’ll create a simple API that provides a single
    endpoint with all the CRUD (Create, Retrieve, Update and Delete) functionalitiesyou
    need.

    *   Login: An endpoint for retrieving authentication tokens will be added to the
    previously developed API.


    So without further ado, let’s get to it.


    ## API with CRUD Endpoints


    This is probably one of the most common use cases out there for any back-end developer.
    Most likely, you must have encountered at least one or two of these features in
    the past, but I’ll look at the full set of CRUD functions.


    Obviously, there are too many ways to implement this, and each one is just as
    valid as the next, so for the purpose of this example, let’s define some constraints.'
  trans: "\n# JavaScript 响应式编程与 `Streamable` 类\n\n```javascript\nfunction Streamable(triggerCode)\
