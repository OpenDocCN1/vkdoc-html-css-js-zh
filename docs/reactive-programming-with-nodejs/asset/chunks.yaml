  trans: "\n# 总结\n\n通过 Node.js 扩展你的应用，并审视一些有趣且能助你构建更优系统的架构决策，是本书最后一块反应式拼图。你已经阅读并理解了它，现在是时候去实践，并将你（希望是）学到的知识应用到代码中了。\n\
    \n只需记住几个要点：\n\n-   响应式编程与函数式编程是绝佳搭档。\n-   在 Node.js 中，响应式编程几乎都与流有关，所以不要畏惧它们，拥抱它们，你会爱上这种感觉！\n\
    -   如果你还没准备好，请接受 Node.js 的异步思维，这能为你省去很多麻烦。\n-   最后，请记住要恰当地将你的系统设计成可并行化和可扩展的组件。\n\
    \n最后，感谢你陪伴我读完这本书，我真诚地希望你发现它既有用又有趣，并且至少有一件你能从中带走的东西。如果真是这样，那么我的工作就算完成了。\n\n# 索引\n\
