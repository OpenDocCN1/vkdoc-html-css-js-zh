  trans: '

    ### 响应式 vs. 观察者模式


    到目前为止，根据我们所讨论的内容，你可能会认为响应式编程（RP）只是观察者模式的一种实现，使用它就能获得相同的结果。


    事实并非如此。请先考虑一下，我目前并不是特别关注 JavaScript 或任何特定语言，所以首先，当某些语言甚至不支持面向对象编程（OOP）时，你无法真正用
    OOP 的思维来思考（当然，你可以在没有 OOP 的情况下实现类似的功能，但这不在讨论范围内）。即使语言支持，它们在概念上相似，但并不相同。请查看表 1-1
    快速了解。


    **表 1-1.** 观察者模式与响应式编程范式的比较


    | 观察者模式 | 响应式编程 |

    | --- | --- |

    | 旨在向已注册的观察者报告状态。 | 当某个变量的值发生变化时，所有依赖该变量的其他值都会随之更新。 |

    | 作用于整个对象。 | 粒度级别可达到单个原始变量。 |

    | 在被观察对象和观察者之间提供直接通信。换句话说，被观察对象的状态不加任何改变地传递。 | 可以对每个传输的事件应用转换，在传输过程中创建新的事件。 |


    如果你想的话，可以将 RP 视为比简单的观察者实现更进一步，因为你不仅是在通知感兴趣的观察者，还会通过更新相关元素来自动地进行*响应*（明白我的意思了吗？）。


    ## 响应式编程的类型


    RP 有几种方法。它们主要取决于你使用的编程语言，并且都能完成任务，因此选择哪种纯粹是个人偏好问题。


    本节将介绍目前三种最常见的方法：函数式、面向对象式和声明式。


    ### 函数式响应式编程


    除了面向对象式 RP（稍后讨论）之外，函数式 RP（FRP）可能是目前最常用的方法。这可能是因为我们已经讨论过的概念（尤其是如何执行流转换）可以映射到函数式方法上。


    更具体地说，FRP 使用函数式编程的基本构建块（如 `map`、`reduce` 和 `filter`）来处理和转换由我们可能正在处理的异步源生成的事件流。


    后续章节会更详细地介绍 FRP。这里我只快速看一个例子，展示这种方法带来的好处。考虑一个通用的微服务架构，包含两个特定的端点：


    ```

    /users #将返回系统中的用户列表，但只包含最少的数据（仅 id 和全名）

    /users/:id #将返回特定用户的详细信息，可能包括 id、全名、出生日期、地址和电话号码等。

    ```


    当然，这种定义可能不是最聪明的 API 设计，但为了这个示例的目的，我们暂且接受。我想要的是用户列表，但包含每个用户的完整详细信息。


    现在，传统的 Node.js 方法会是这样：


    ```

    request(''/users'', function(users) {

    async.map(users, function(user, done) {

    request(''/users/'' + user.id, function(userData){

    console.log("已获取用户数据: ",  user.id);

    done(null, userData);

    }, function(fullUsers) {

    //将列表返回给客户端

    });

    }

    });

    ```


    上面的代码本身并没有什么问题，部分原因是我使用了 `async` 库（可在 [`http://caolan.github.io/async/`](http://caolan.github.io/async/)
    获取）。如果没有它，遍历用户以请求其完整数据将意味着更多的代码行数，更糟的是，还会在逻辑中引入更多复杂性。这正是 FRP 如此强大的关键所在——开发者的重点应该放在解决手头的问题上（在本例中，是获取一个完整的用户对象列表），而不是如何解决所用技术带来的问题（在本例中，我们指的是请求的异步性）。


    再说一次，上面的代码没有问题，但请查看图 1-4。


    ![A418015_1_En_1_Fig4_HTML.jpg](img/A418015_1_En_1_Fig4_HTML.jpg)


    **图 1-4.** 当前示例采用 RP 方法的弹珠图


    现在看看下面的代码：


    ```

    GetUsers()

    .map(function(u) {

    return ''/users/'' + u.id;

    })

    .pipe(getUserDetails)

    .flatMap();

    ```


    > **注意：** 上面的代码并未引用任何 Node.js 的特定响应式库。其目的是向读者展示使用这种方法所带来的简化。


    诚然，代码之所以简化，也是因为我们没有直接调用 `request` 函数，但它也更易于阅读和理解。即使我们想在流程中添加额外的步骤，回调函数的缩进级别也能保持整齐。


    以下是上述代码逐步发生的事情：


    1.  通过发起请求生成一个用户流，然后返回该用户流。

    2.  我们对流应用一次转换，根据用户对象为每个用户的详细信息端点生成 URL。

    3.  每个 URL 都被管道传输到 `getUserDetails` 函数，该函数将依次请求该 URL 的数据并返回信息。此操作可以异步完成，不会增加任何复杂性，但用户的顺序将会丢失。

    4.  最后，我们展平生成的列表流，得到一个完整的用户对象流。为了本示例的目的，只需假设 `flatMap` 也会将生成的流转换为实际的列表，但这取决于你使用的
    `flatMap` 实现。一旦我开始实现自定义的 FRP 库，我会对此进行更详细的介绍。


    ### 面向对象式响应式编程


    OORP 指出，对象除了属性和方法之外，还具有*反应*（reactions），当它们依赖的数据发生变化时，这些反应会被重新求值。


    让我们看看我之前提到的例子，两个按钮和一个计数器；在这个例子中，按钮是对象，它们可以对事件（如“点击”事件）做出反应。下面的代码使用了流行的前端库 jQuery
    来提供基本的 OORP 功能：


    ```

    // 根据两个按钮生成的事件流设置“counter”的值

    function setCounter() {

    var value = $("#add").data(''values'').length - $("#substract").data(''values'').length;

    $("#counter").text(value);

    }

    $("#substract").click(function() {

    var stream = $(this).data(''values'')

    stream.push(1);

    $(this).data(''values'', stream);

    setCounter();

    });

    $("#add").click(function() {

    var stream = $(this).data(''values'')

    stream.push(1);

    $(this).data(''values'', stream);

    setCounter();

    });

    ```


    > **注意：** 上面的示例明显缺少导入库、设置初始状态等所需的所有样板代码。但这对于阐明 OORP 的要点来说并非必需。


    在示例代码中，你可以清楚地看到 `#counter` 元素的值直接依赖于添加到 `#add` 按钮和 `#substract` 按钮的数组中（代表流）的值。`setCounter`
    函数负责确保这种关系。


    我用于示例的语言是 JavaScript，因为它不是纯粹的响应式语言，所以我必须手动处理一些“魔法”。在这种情况下，依赖于流的最终值的更新必须手动完成。话虽如此，另一方面，当点击事件发生时，系统会自动执行反应的重新求值，而这完全是自动为我们完成的。

