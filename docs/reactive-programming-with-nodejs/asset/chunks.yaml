    This library ([`http://highlandjs.org`](http://highlandjs.org)) is a more generic
    utility module, created by Caolan McMahon ([`https://twitter.com/caolan`](https://twitter.com/caolan))
    and it’s similar in some ways to UnderscoreJS ([`http://underscorejs.org/`](http://underscorejs.org/))
    and AsyncJS ([`http://caolan.github.io/async/`](http://caolan.github.io/async/),
    which he created as well) but built on top of Node-like streams, which basically
    allows it to handle both synchronous and asynchronous code easily.


    One of the main features advertised by this library is the so-called “back pressure,”
    which works great with streams that can’t be paused. Normally, when the client
    consuming the stream can’t handle more data, it will pause it until it’s ready.
    When the source stream can’t be paused, Highland will buffer the data for you
    until you’re ready to resume normal operations.


    With regard to documentation, Highland is probably the weakest of the ones discussed
    here. Although it has a very comprehensive help section on its main website, they
    don’t really list external resources like tutorials, videos, or even books, instead
    you’re left to browse the Internet and find those yourself. The only issue with
    that is that you never know if those resources are up-to-date or not.


    ## License


    Just like with RxJS, the license for HighlandJS is Apache 2.0, so you’re free
    to do whatever you want with this library as long as you add a list of changes
    (if any) made by you and add a copy of the license as well.


    ## Compatibility


    There is no specific mention as to whether this library is compatible with older
    browsers like the previous are; it is only stated that it does work on browsers
    and it’s installation includes a browserify-ready version of the library. It is
    also compatible with Node.js, which is what really matters to you and me (again,
    there is no mention of a specific version of Node, but let’s assume it works on
    modern version of Node).


    ## Code Samples


    One of the main advertised features of Highland.js is the fact you can have the
    same version of your code work with both synchronous and asynchronous data sources,
    thus simplifying development.


    In the following example, I’ll show just that; first I’ll use a simple Array as
    a source for the Stream constructor, and then I’ll switch it up with a file on
    disc, and you’ll see how the rest of the code remains the same:


    ```

    var HL = require("highland");

    var source = [''value1'', ''value2'', ''value3''];

    HL(source).map(function(v) {

    console.log("Calls++");

    return v.toUpperCase();

    });

    ```


    Tip


    To install HighlandJS simply use the npm command: `$ npm install highland`


    Now, if you were to go on and execute the preceding code, something interesting
    will happen: nothing. You see, the aforementioned example demonstrates something
    else advertised by Highland.js, and that is the lazy evaluation of streams. The
    library will not immediately start pulling data from the stream; instead, it will
    let you define your intentions in regards to the transformations you want to exert
    on the stream, and then, you can tell it to start consuming said stream.


    There are a few methods that do this. In fact, they are: `each`, `done`, `apply`,
    `toArray`, `pipe` and `resume`.


    Here’s the same code, but with the extra method call, telling HighlandJS to actually
    start consuming the stream:


    ```

    var HL = require("highland");

    var source = [''value1'', ''value2'', ''value3''];

    HL(source).map(function(v) {

    console.log("Calls++");

    return v.toUpperCase();

    }).toArray(function(arr) {

    console.log(arr);

    });

    ```


    The output of the above code is the following:


    ```

    Calls++

    Calls++

    Calls++

    [ ''VALUE1'', ''VALUE2'', ''VALUE3'' ]

    ```


    So as you can see, this time around the source stream was consumed properly thanks
    to the added `toArray` call.


    Let’s now look at what happens if I wanted to use a file as a source, instead
    of a simple array.


    ```

    var HL = require("highland");

    var fs = require("fs");

    function getData(fname) {

    return function(push, next) {

    fs.readFile(fname, function(err, data) {

    if(err) push(err);

    else {

    var lines = data.toString().split("\n");

    lines.forEach(function(l) {

    push(null, l);

    });

    push(null, HL.nil);//HL.nil indicates the end of the stream

    next();

    }

    });

    };

    }

    HL(getData(''./file4.txt'')).map(function(v) {

    console.log("Calls++");

    return v.toUpperCase();

    }).toArray(function(arr) {

    console.log(arr);

    });

    ```


    As you can appreciate, the consuming call of the stream remains the same, but
    the source of that stream is now a file read asynchronously.


    Error handling is quite simple as well; the earlier code will fail if the path
    to the file is wrong, but using the `errors` method, you can extract the errors
    from the stream and create a new one, after executing an error handling function,
    like so:


    ```

    HL(getData(''./file42.txt'')).map(function(v) {

    console.log("Calls++");

    return v.toUpperCase();

    })

    .errors(function(err, push) {

    if(err.code == ''ENOENT'') { //If the file is not found, simply return an empty
    string so the code is not affected

    push(null, '''');

    } else {

    push(err);

    }

    })

    .toArray(function(arr) {

    console.log(arr);

    });

    ```


    To continue with the file-reading theme, let’s look at another example, similar
    to what I showed with Bacon.js earlier. This time, I’ll have an array of filenames
    and the code will take those filenames, read each file, and return its content:


    ```

    var HL = require("highland");

    var fs = require("fs");

    var readFile = HL.wrapCallback(fs.readFile);

    var filenames = HL([''file1.txt'', ''file2.txt'', ''file3.txt'']);

    filenames

    .map(readFile)

    .parallel(10) //reads up to 10 times at a time

    .each(function(x) {

    console.log("---");

    console.log(x.toString());

    console.log("---");

    });

    ```


    Now, on the preceding code, it’s important to note that up to the `parallel` method
    call, the stream has not been yet been consumed, which means you can still add
    more transformations before the `each` method call, but the latter starts consuming
    the stream, thus pulling values one at the time and adding new transformations
    after it would not be possible. In fact, the only method that can be called after
    `each` is `done`.


    # A Word about Backpressure


    This term was mentioned earlier a few times, and a small explanation was added
    next to it, but the truth is, backpressure is quite a relevant term when it comes
    to stream-based flows, because whether your library implements a strategy for
    it or not will affect the use-cases supported.


    To elaborate, backpressure is the ability of your library to cope with a fast
    producer, meaning when, for some reason, the consumer of the stream is slower
    in processing the chunks than the stream itself takes to produce them.


    There are basically two ways to handle this scenario: either you accept the loss
    of data and just take what you can, or you can’t afford losing data, so you buffer
    it somehow. For each approach, there are different strategies, as mentioned here.


    ## Accepting the Loss of Data


    The following are three different strategies that can be used to handle a chatty
    producer when data loss is accepted.


    ### Debouncing the Stream


    This technique consists of creating a new stream from the original, but the new
    one will only emit data after a given timespan has passed without the original
    stream emitting an event. Basically the debounce operation will filter out events
    emitted by the source stream that are quickly followed by another event.


    ### Sampling Streams


    This one is pretty straightforward: Given a set timespan, it will emit a new event
    with the latest event emitted by the source stream. Of course, any event emitted
    in between two sampling events will be ignored.'
