- fmt: '#### Pausing the Stream


    This method simply consists of pausing the source stream for a given period of
    time and then resuming it. This will drop everything emitted by the source stream
    during the pause interval.


    ### When Losing Is Not an Option


    The following three strategies deal with the use case when your data are too precious
    and you cannot afford to lose them due to an over-verbose producer.


    #### Buffering


    There are a couple of ways you can buffer the events from the original stream
    if you need to; for instance, you can set up a max number of events to buffer
    before pushing them down all together down the line. Or you can set an amount
    of time to put data into the buffer for, and then when the time is up, simply
    push all those values down the line again.


    #### Buffered Pause


    Similar to the previous pause technique, but instead of dropping everything emitted
    by the source stream during the pause time, it will buffer it. Once you resume,
    the buffered events will be triggered one by one, thus allowing your code to operate
    as if nothing happened.


    #### Controlled Streams


    Finally, this technique consists of turning the natural behavior of streams, which
    is a push-based behavior (meaning the producer pushes the events to the consumer),
    into a pull-based one, having the consumers pull as many events as needed on a
    given time interval, thus completely controlling the flow of data from the consumer’s
    point of view.


    ## In Conclusion


    I could keep on adding more code samples for all the libraries reviewed, but the
    truth is, this chapter is meant to give you an example of how things are being
    currently done in the world of functional RP (FRP) libraries for Node.js.


    It is also meant to provide you with inspiration for the Chapter [7](#A418015_1_En_7_Chapter.html),
    when I’ll start filling in the code of the FRP library developed in this book.


