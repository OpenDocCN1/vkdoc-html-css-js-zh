    | Reads only | Readable | _read |

    | Writes only | Writable | _write |

    | Reads and Writes | Duplex | _read, _write |

    | Changes to the data you write | Transform | _transform |'
  trans: '

    ### 编写自定义流


    前面的代码展示了如何使用预置的可读流和可写流，但并未演示如何实现自定义流——原因很简单，一旦你理解了流的概念，就会想抓住一切机会使用它们！（至少我是这样的！）


    我在此提供一个非常简单的示例，展示如何创建符合各类流描述的对象。


    以下代码将在 HTTP 服务器上建立一个端点，通过一组流来接收数据。它将完成以下操作：


    - 获取请求体并将其转换为 JavaScript 对象

    - 为对象添加一个属性

    - 将对象保存到数据库

    - 将对象转换回字符串

    - 将字符串返回给客户端


    ```

    var  inherits = require("util").inherits;

    var streams = require("stream");

    var Transform = streams.Transform;

    //Turns the request''s body into an object

    function GetBody() {

    Transform.call(this, {objectMode: true});

    }

    inherits(GetBody, Transform);

    GetBody.prototype._transform = function(obj, encoding, callback) {

    var str = obj.toString();

    callback(null, JSON.parse(str));

    };

    //Adds the timestamp value

    function AddTimeStamp() {

    Transform.call(this, {objectMode: true});

    }

    inherits(AddTimeStamp, Transform);

    AddTimeStamp.prototype._transform = function(obj, encoding, callback) {

    obj.timestamp = Date.now();

    callback(null, obj);

    };

    //Turns the object into a string

    function ToJSONEncoder() {

    Transform.call(this, {objectMode: true});

    }

    inherits(ToJSONEncoder, Transform);

    ToJSONEncoder.prototype._transform = function(obj, encoding, callback) {

    callback(null, JSON.stringify(obj));

    };

    //Saves the object into the database

    function SaveUserToDB() {

    Transform.call(this, {objectMode: true});

    }

    inherits(SaveUserToDB, Transform);

    SaveUserToDB.prototype._transform = function(obj, encoding, callback) {

    var self = this;

    UserModel.create(obj, function(err, obj) {

    if(err) {

    return callback(err);

    }

    self.push(obj);

    callback();

    });

    };

    var addTimeStamp = new AddTimeStamp();

    var save = new SaveUserToDB();

    var getBody = new GetBody();

    var toJSON = new ToJSONEncoder();

    function handleNewUsers(req, res, next) {

    req

    .pipe(getBody)

    .pipe(addTimeStamp)

    .pipe(save)

    .pipe(toJSON)

    .pipe(res);

    }

    ```


    如你所见，通过创建一组`Transform`流，并利用 Node 中`Request`对象默认是`ReadableStream`、`Response`对象默认是`WritableStream`的特性，即可实现上述所有功能。


    如果你想测试这段代码，还需要先设置好前置代码，以下是前置代码（当然，你需要安装 MongoDB、mongoose 和 express 等依赖）：


    ```

    var mongoose = require("mongoose");

    var express = require("express");

    // --- db

    var Schema = mongoose.Schema;

    var UserSchema = Schema({

    full_name: String,

    birthdate: Date,

    username: String,

    password: String,

    timestamp: Number

    });

    var UserModel = mongoose.model("User", UserSchema);

    mongoose.connect (''mongodb://localhost/test-streams'');

    //--- http server

    var app = express();

    app.post(''/users'', handleNewUsers);

    app.listen(3000, function() {

    console.log("Ready to roll!");

    });

    ```


    这段代码仅负责设置 HTTP 服务器、MongoDB 连接以及定义模型模式。


    **注意**


    在编写类似上述使用`Request`对象流特性的代码时，请避免使用 Express 的`body-parser`中间件模块（可在[`https://www.npmjs.com/package/body-parser`](https://www.npmjs.com/package/body-parser)获取），因为它会影响功能，导致代码无法正常运行。


    最后，我想提醒你注意`SaveUserToDB`这个流——我最初以为它是一个`Duplex`流。它本应将对象写入数据库，然后在后续的`Read`调用中返回数据。但根据前文对`Duplex`和`Transform`流的描述，由于`Read`和`Write`事件并未关联，会导致`Write`操作未完成时`Read`事件就已触发，导致此时无数据可返回。而将流改为`Transform`流可以解决这个问题。


    `Duplex`流适用的典型场景是某种客户端/服务器连接处理器——这种流允许同时从服务器向客户端写入消息，并在客户端应用中读取服务器接收的消息。


    总而言之，当尝试实现自定义流时，表 5-1 将帮助你理解需要实现哪些方法以及何时实现。


    **表 5-1.** 快速指南：何时实现何种流


    | 操作类型 | 流类型 | 需实现的方法 |

    | --- | --- | --- |

    | 仅读取 | Readable | `_read` |

    | 仅写入 | Writable | `_write` |

    | 读取和写入 | Duplex | `_read`, `_write` |

    | 修改写入数据 | Transform | `_transform` |'
- fmt: '# Asynchronous Programming in Node.js


    So far, I''ve talked about using asynchronous functions almost everywhere, but
    I haven''t really given an explanation on what that is. So let''s talk about that,
    shall we?


    Asynchronous (or Async) programming is probably one of the best and, at the same
    time, most confusing features of Node.js.


    What asynchronous programming means, put simply, is that for every asynchronous
    function that you execute, it will not return the results before moving forward
    with the program''s flow. Instead, you''ll need to provide a callback function
    that will be executed once the asynchronous code finishes.


    Figure [5-1](#A418015_1_En_5_Chapter.html#Fig1) shows what would be a regular,
    non-asynchronous flow.


    ![A418015_1_En_5_Fig1_HTML.jpg](A418015_1_En_5_Fig1_HTML.jpg)


    Figure 5-1.


    Simple example of a synchronous flow


    Figure [5-1](#A418015_1_En_5_Chapter.html#Fig1) represents a set of instructions
    that run in a synchronous manner. It is clear that in order to execute `Instruction
    #4`, it needs to wait as long as the long time running instruction takes and then
    wait for `Instruction #3` to finish. But what if `Instruction #4` and `Instruction
    #3` weren''t really related? What if you didn''t really mind in which order `Instruction
    #3` and `Instruction #4` executed in relationship to each other?


    Then you could put the long time running instruction to be executed in an asynchronous
    manner and provide `Instruction #3` as a callback to that, allowing you to execute
    `Instruction #4` much sooner.


    Figure [5-2](#A418015_1_En_5_Chapter.html#Fig2) shows how that would look.


    ![A418015_1_En_5_Fig2_HTML.jpg](A418015_1_En_5_Fig2_HTML.jpg)


    Figure 5-2.


    Example of an asynchronous flow


    `Instruction #4` is executed right after `Instruction #2` starts the asynchronous
    long time running instruction, instead of waiting for it to finish.


    That is, of course, a very simple example of the potential benefits of asynchronous
    programming. It is not always possible to use this approach either. You can do
    this with I/O bound functions, because that''s how Node.js handles I/O (I''ll
    discuss this in a bit, don''t worry), but CPU bound functions, like heavy number
    crunching, will not really work this way and they will block the flow just like
    a synchronous function would, so take that into account when planning your code.


    Finally, like with most in this digital world, nothing comes without a price,
    and the added benefits also come with a nasty trade off: debugging asynchronous
    code can be a real head-breaker.


    Developers are trained to think of their code in the sequential way they write
    it, so debugging a code that is not sequential can be difficult to newcomers.


    For instance, let''s look at the same piece of code both written in synchronous
    and asynchronous manner:


    Synchronous version:


    ```

    var fs = require("fs");

    console.log("About to read the file... ");

    var content = fFs.readFileSync("/path/to/file");

    console.log("File content: ", content);

    ```


    Asynchronous version (with a common mistake):


    ```

    var fs = require("fs");

    console.log("About to read the file...");

    var content = "";

    fs.readFile("/path/to/file", function(err, data) {

    content = data;

    });

    console.log("File content: ", content);

    ```


    If you haven''t guessed it yet, the second code will print:


    ```

    File content:

    ```


    And the reason for that is directly related to the diagram from before. Figure
    [5-3](#A418015_1_En_5_Chapter.html#Fig3) shows what''s going on with the buggy
    asynchronous version.


    ![A418015_1_En_5_Fig3_HTML.jpg](A418015_1_En_5_Fig3_HTML.jpg)


    Figure 5-3.


    A classic asynchronous programming mistake


    It''s pretty clear by looking at Figure [5-3](#A418015_1_En_5_Chapter.html#Fig3)
    why the content of the file is not getting written, because the callback is being
    executed after the last `console.log` line. This is a very common mistake done
    by new developers, not only with Node.js but, more specifically, with AJAX calls
    on the front-end. They set up their code in a way where they try to use the content
    returned by the asynchronous call before it actually ends.


