- fmt: '### Composition


    Function composition is another big pillar of functional programming, because
    along with pure functions it provides us, the developers, the means to create
    complex constructs that stay true to the constraints imposed by the paradigm.


    From a mathematical point of view, function composition looks like this:


    ```

    compose(f(x), g(x)) = f(g(x))

    ```


    Now, if you translate that into JavaScript, composing functions looks like this:


    ```

    var add10 = function(a) { return a + 10; };

    var double = function(b) { return b * 2; };

    var addAndDouble = compose(add10, double); //add10(double(a));

    addAndDouble(10); //returns 40;

    ```


    This example shows a very basic composition, and even though it does help explain
    the basic behavior of this operation, let’s look at a more complex example to
    better understand how much use we can get out of it.


    For this, let’s assume you are working on a TO-DO list application, which, let’s
    face it, is the new Hello World of the programming world. In this application,
    we want to get a list of all the completed tasks, so using pure JavaScript, you’d
    write the following:


    ```

    var doneTasks = tasks.filter(function(t) { return t.done; });

    ```


    You could say that that’s a functional approach; after all you’re passing in a
    pure function as filter, and it works. But we can do one better:


    ```

    var doneTasks = filter(where({done: true}));

    ```


    No I didn’t forget about the `tasks` list, in the example the `doneTasks` variable
    contains a function and not the actual list of filtered tasks, and that function
    would filter whatever list of tasks we pass it as parameter when executed. So
    we have re-usability (yay!). I know I just came up with two new functions and
    I’m not really explaining how they work, but there is a reason for that: I’m not
    done discussing the tools you need to create them. Once you’ve finished reading
    this section of the chapter, you should have all you need to create them yourself.


    That being said, there is another upside to the new approach: the ability to compose,
    say you also want to group that list by user. You can group the tasks using a
    given `partition` function, it would work just like `compose` , but using the
    `Array.prototype.reduce` method, it would create a dictionary of elements indexed
    by the attribute you want.


    ```

    var groupByUser = partition({prop: ''username''});

    var groupedTasks = compose(groupByUser, doneTasks);

    ```


    And now, using two simple functions, you created a third, more complex one that
    remains pure. Even though the `compose` function is quite simple to understand,
    let me show you an implementation for both, `partition` and `compose`:


    ```

    function partition(byProp, list) {

    return list.reduce(function(dict, curr) {

    var idxValue = dict[byProp.prop]; //use the property we passed as parameter

    if( !dict[idxValue] ) dict[idxValue] = []; //initial value

    dict[idxValue].push(curr);

    return dict;

    },{});

    }

    function compose(fn1, fn2) {

    return function() {

    return fn1(fn2.call(fn2, arguments));

    }

    }

    ```


    The function is not really that complex now that you have had a look at it; all
    it has to do is understand how the `reduce` function works, which, simply put,
    allows you to iterate over the values of the array and apply a function to it
    that will reduce all values to only one. The other interesting thing about the
    above code is that it receives two parameters, but on the example I’m only passed
    one, so what gives?!


    This is a perfect time to start talking about currying functions, so let’s!


    ### Currying Functions


    Try to ignore the sudden crave for Indian food you have right now ( [`https://en.wikipedia.org/wiki/Curry`](https://en.wikipedia.org/wiki/Curry)
    ), because this has nothing to do with it (in fact, it’s related to Haskell Curry,
    a mathematician that helped develop this technique). Function currying (as it’s
    normally known), is the act of calling a function with less arguments than it
    needs and that function, instead of running with unpredicted results, returning
    a new function with the given arguments pre-set.


    That was a mouthful, let’s look at a very simple example that will clear things
    up:


    ```

    //simple function

    function add(x, y) { return x+y; }

    //now we curry it

    var curriedAdd  = curry(add);

    var add100 = curriedAdd(100);

    //now we simply...

    console.log(add100(10)); //prints 110

    ```


    Now, going back to the `partition` example from before, the function accepts two
    parameters, but I used it only with one; I passed in the property I want to group
    by, but not the list, so I curried the function and it, in turn, returned a new
    function that only requires the list of items to partition. This, of course, doesn’t
    happen automatically in JavaScript; in order to achieve this, a hidden step is
    implied here, which consists of calling a currying function like I did with the
    `add100` example.


    But function currying, used properly, can be a great tool to help you get a clearer
    syntax, more declarative than imperative.


    Let’s look at a classic: Out of a list of user objects, get a list of user names;
    there are far too many ways to do that, but let’s try to keep it functional, ok?


    ```

    var users = [ {id: 1, name: ''Richard Reed'' } , { id: 2, name: ''John Stewart''
    } ];

    users.map(function(u) {  return u.name; }); //returns [''Richard Reed'', ''John
    Stewart'']

    ```


    The code works, but if you’re striving for declarative over imperative, the function
    definition on that one-liner feels wrong. So what if you curry that function,
    like so:


    ```

    var get = curry(function(prop, o) { return o[prop]; });

    ```


    The preceding declaration is a bit tricky. Remember, `get` is not actually the
    function you want; instead, the one you want is the function returned by `get`
    when called with the list of items you want to extract the property from. This
    way, you can use it with the likes of `map` , `reduce` , `compose` , etc. In this
    particular case, I was using `map` , so let’s see how that would look now:


    ```

    users.map(get(''name''));

    ```


    That was a lot clearer than before, wasn’t it? And you can even go one step further
    if you curry the `map` call, like so:


    ```

    var map = curry(function(list, fn) { return list.map(fn); });

    //now we can do something like:

    var listOfNames = map(get(''name''));

    ```


    And the best part of it? This code is not referencing the list of users at all.
    That means the `listOfNames` variable is referencing a function that you can reuse
    anywhere and even compose with another if you wanted.


    As you can see, function currying provides a level of flexibility higher than
    what you’re used to with simple functions; combine it with composition and you
    have a killer combo. Look at the following code, simply beautiful:


    ```

    /*

    The order of execution is the inverse of the order of the parameters,

    so you have to read it backward:

    * sort by id

    * then get the name of the items, and join those names with a comma

    */

    compose(

    compose(join('', ''), map(get(''name''))),

    sortBy(get(''id''))

    );

    ```


    Simple, clean, and the code almost reads like the comments—forget imperative programming!


    Before I leave this subject alone, let’s demistify the `curry` function, shall
    we? Here is a simple implementation that works for the previous examples:'
