- fmt: "# Adding a New Address\n\nThe final method I’ll review is this one, since\
    \ it presents an extra level of complexity. If you remember from the code before,\
    \ you need to first create the address entity, then associate it to the user somehow.\
    \ Take a look at Figure [4-3](#A418015_1_En_4_Chapter.html#Fig3) to understand\
    \ how the reactive logic would look.\n\n![A418015_1_En_4_Fig3_HTML.jpg](A418015_1_En_4_Fig3_HTML.jpg)\n\
    \nFigure 4-3. Marble diagram for the new address endpoint’s reactive version\n\
    \nIf you remember (go back a few pages if you don’t), the original code combined\
    \ two promises to achieve its goal. The preceding diagram shows a rather longer\
    \ (steps-wise, I mean) solution, but a more direct one as well. If you look at\
    \ it, the solution is pretty straightforward. Take a look at Table [4-4](#A418015_1_En_4_Chapter.html#Tab4)\
    \ for the code comparison.\n\nTable 4-4. Side–by-Side Comparison of the Code Required\
    \ to Create a New Address for a User.\n\n| Reactive Code | Regular Code |\n| ---\
    \ | --- |\n| `var newAddress = new oStream();` `newAddress.data`     `.setVars({'httpResponse':\
    \ get(1), 'userId': function(args) { return args[0].params.id}})`     `.then(get(0))`\
    \     `.then(get('body'))`     `.then(models.addresses.create.bind(models.addresses))`\
    \     `.then(function(address, done) {`     `models.users.findByIdAndUpdate(this.customVars.userId,\
    \ {$push: {'addresses': address.id}}, {new: true}, done);`     `})`     `.then(function(usr,\
    \ done) {`     `models.users.populate(usr, {path: 'addresses'}, done);`     `})`\
    \     `.done(toJSONResponse)`     `.catch(callErrorHandler );` | `router.post('/:id/addresses',\
    \ function(req, res, next){` `var addressPromise = models.addresses.create(req.body);`\
    \ `var userPromise = addressPromise.then(function(address) {` `return models.users.findById(req.params.id)`\
    \ `});` `Promise.all([addressPromise, userPromise], function([address, user])\
    \ {` `user.addresses.push(address._id);` `return user.save();` `}).then(function(user)\
    \ {` `return res.json(user);` `}).catch(next);` `});` |\n\nThis example is also\
    \ showing more lines of code on the reactive approach, but if you look at the\
    \ regular implementation, once the business logic’s complexity increased, extra\
    \ tools were required, either promises (with the added complexity of understanding\
    \ how they work) or good old callback logic, with the added levels of indentation.\
    \ Either way the reactive approach keeps things under control, with one level\
    \ of indentation, maybe a few extra steps; but if you extrapolate and scale up\
    \ your logic, the reactive approach starts to look better and better.\n\n### The\
    \ Helper Functions\n\nThe aforementioned reactive examples reference several helper\
    \ functions that I haven’t shown yet. I’ll list their code here, simply to show\
    \ they’re mostly one-liners.\n\n```\nvar find = function(where, done) {\nreturn\
    \ function() {\nreturn models.users.find(where, done);\n}\n};\nvar populate =\
    \ function(what) {\nreturn function(query) {\nreturn query.populate(what);\n};\n\
    };\nvar execute = function(query, done) {\nreturn query.exec(done);\n};\nvar findById\
    \ = function(id) {\nreturn models.users.findById(id);\n};\nvar findByIdAndUpdate\
    \ = function(params, done) {\nreturn models.users.findByIdAndUpdate(params[0],\
    \ params[1], {new: true} ,done);\n};\nvar findByIdAndDelete = function(id, done)\
    \ {\nreturn models.users.findByIdAndRemove(id, done);\n};\nvar toJSONResponse\
    \ = function(data) {\nreturn this.customVars.httpResponse.json(data);\n};\nvar\
    \ callErrorHandler = function(err) {\nreturn this.customVars.next(err);\n};\n\
    ```\n\nThe interesting bit to reference here is how some of these functions are\
    \ pulling properties of their `this` object, although it is never declared anywhere.\
    \ That is because the context of all functions passed to the `then` method gets\
    \ extended with the properties of the `Stream` to which it is being associated.\
    \ This means that if a function has no context set, it’ll be that of the `Stream`,\
    \ which makes it easy to access properties such as `customVars`, which contains\
    \ the extra variables declared by `setVars`.\n\n## In Conclusion\n\nBy looking\
    \ at the previous code (or the complete bundled code that is available with this\
    \ book), you can see that the premise of using an Observable Stream to handle\
    \ HTTP incoming traffic is perfectly possible. Not only that, but it helps keep\
    \ code complexity under check.\n\nThings like middlewares are also possible. I'll\
    \ look into that in the next example.\n\n# Log-in Service\n\nThe ability to log\
    \ into your application is another of those features you’ve probably done in the\
    \ past—several times in fact, if you’ve been doing application development for\
    \ a while. I’ll look into one particular example, which is authentication against\
    \ a RESTful API using a JSON Web Token.\n\nThis way, you’ll be able to extend\
    \ the previous example, add the authentication endpoint, and, finally, protect\
    \ some of the endpoints by setting up a middleware into the chain of transformations\
    \ you have setup for every collection.\n\n## What Is a JSON Web Token?\n\nIn case\
    \ you were wondering, let me do a quick re-cap of what a JSON Web Token (JWT)\
    \ is and how it will help you achieve what you want.\n\nA JWT ([`http://jwt.io`](http://jwt.io))\
    \ is an open standard (you can find its RFC at [`https://tools.ietf.org/html/rfc7519`](https://tools.ietf.org/html/rfc7519))\
    \ that defines a way of safely transferring information between two sides. This\
    \ is achieved by digitally signing the data transferred—in this case, the request\
    \ sent from the client to the server. The data can be signed either with a secret\
    \ phrase using an HMAC algorithm or using a private/public key pair using RSA.\n\
    \nEither way, it allows developers to authenticate their requests against a RESTful\
    \ service, because it doesn’t require them to maintain any state about the entity\
    \ being authenticated. In order to corroborate the authenticity of the request,\
    \ the signed token is decoded and verified using the contract previously stated\
    \ between client and server. If the verification is successful, then the request\
    \ is valid.\n\nThe token itself is calculated in three simple steps:\n\n- A JSON\
    \ header is set, which contains the type of token (which in this case is JWT)\
    \ and the algorithm used to sign it, something like the following example. Then\
    \ the data are encoded into base 64.\n\n    ```\n    {\n    \"alg\": \"HS256\"\
    ,\n    \"typ\": \"JWT\"\n    }\n    ```\n\n- The payload is created using information\
    \ related to the request, normally this is information about the user (since that\
    \ is the constant part in all requests). This JSON is then encoded using base\
    \ 64.\n\n    ```\n    {\n    \"name\": \"John Doe\",\n    \"isAdmin\": true\n\
    \    }\n    ```\n\n- Finally, the token is created by concatenating both base\
    \ 64 strings from this example and signing that using the algorithm defined in\
    \ the first step. The resulting token looks something like this:\n\n    ```\n\
    \    eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9 .eyJuYW1lIjoiUFdEIiwiaWF0IjoxNDY0NDQxMTc4LCJleHAiOjE0NjQ1Mjc1Nzh9.oc194WsEKcRe29FuUKS9XdvKpX72nt0NuN5FAUVicW4\n\
    \    ```\n\nAnd here is how you would use the JWT token to provide security to\
    \ your API:\n\n- The user makes an unauthenticated request to an endpoint sending\
    \ his/her credentials, in order to authenticate against the system.\n- The API\
    \ checks the credentials, and if they’re valid, then a JWT token is generated\
    \ and returned to the user.\n- The user then will use that token for any subsequent\
    \ request to authenticate without having to re-send the credentials.\n- If the\
    \ system is able to verify the authenticity of the token, then the request is\
    \ carried out, otherwise an error response is returned.\n\nFigure [4-4](#A418015_1_En_4_Chapter.html#Fig4)\
    \ shows the flow between client and server when dealing with JWTs.\n\n![A418015_1_En_4_Fig4_HTML.jpg](A418015_1_En_4_Fig4_HTML.jpg)\n\
    \nFigure 4-4. Client-server interaction during the authentication process"
