    that event.

    *   If the chat server is closed, all clients will handle that event gracefully.


    The list of modules used for this example is minimal. I tried to keep it that
    way to show the power of the approach and, of course, the language itself:


    *   express.js ( [`https://www.npmjs.com/package/express`](https://www.npmjs.com/package/express)
    ) is used to boot up the server, but nothing else.

    *   socket.io is used to create the chat server and handle all socket-related
    tasks.

    *   socket.io-client ( [`https://www.npmjs.com/package/socket.io-client`](https://www.npmjs.com/package/socket.io-client)
    ) provides the ability to create a command line client for socket.io instead of
    needing a Web browser (this app is 100% command line).

    *   Finally, winston ( [`https://www.npmjs.com/package/winston`](https://www.npmjs.com/package/winston)
    ) is used to simplify logging and message formatting on the console.


    Note


    The other dependency that’s not listed in there is the library shown on the previous
    chapter: rCheese.


    Figure [8-5](#A418015_1_En_8_Chapter.html#Fig5) shows a screenshot of the output
    from using the chat server (top section of the screen) with two clients (lower
    section of the screen). Let’s look at the code now to understand how this can
    be implemented using rCheese in Node.js.


    ![A418015_1_En_8_Fig5_HTML.jpg](A418015_1_En_8_Fig5_HTML.jpg)


    Figure 8-5.


    Screenshot of two clients and the chat server interacting'
  trans: '

    ### 拟议解决方案


    为实现这一目标，他们需要做出 180 度的大转弯，于是开始研究各种方案，最终胜出的是`Scala`（[`www.scala-lang.org/`](http://www.scala-lang.org/)）、`Akka`（[`akka.io/`](http://akka.io/)）和`Play`（[`www.playframework.com/`](https://www.playframework.com/)）的组合。这套技术栈运行在`JVM`上，因此为公司提供了良好的迁移计划，使他们能够在迁移过程中逐步引导开发者熟悉该技术栈，而不是一次全部切换，从而避免了相应麻烦。


    Web 框架（`Play`）使他们能够根据需求轻松地上下扩展 Web 服务器。它还能帮助他们充分利用多核架构，处理比旧技术栈庞大得多的并发用户量。使用`Play`的团队开发速度比遗留系统团队快两到三倍。


    借助`Scala`和`Akka`，他们能够创建基于微服务的、消息驱动的响应式后端架构。


    采用响应式架构的优势之一是简化了编程任务；缩短的上市时间使他们能够像`Netflix`那样更快地推出功能。


    事实证明，响应式方法非常适合微服务架构，因为你可以将响应式编程的优势转化为架构特性，即最终具备以下特点：


    *   `responsive`：意味着系统会在可能的情况下及时做出响应。

    *   `resilient`：系统无论发生什么情况都能保持响应。组件之间相互隔离，在出现故障时提供故障隔离。

    *   `message-driven`：整个系统依赖组件之间的异步消息传递。这使得组件也能将故障作为消息传递。

    *   `elastic`：系统能够根据不同的工作负载保持响应。


    ### 成果


    在以上变更上线后的 4 周内，`Walmart.ca`报告了以下成果：


    *   转化率提升了 20%

    *   移动端订单增长了 98%

    *   客户页面加载时间减少了 36%

    *   最重要的是，在`黑色星期五`等流量高峰日期间，没有出现任何停机


    ## 再谈一个案例


    作为最后一个研究案例，我们不打算看另一个成功案例，而是自己动手构建一个小型概念验证，如何？当然，我会使用`R-CheeseJS`，向你展示一个纯粹的`Node.js`应用程序。它应该能结合上一章的代码，为你提供关于编程响应式系统的更多实践见解。


    我打算构建的这个小`PoC`是一个聊天应用。它规模很小，但功能应该足够完善，让它变得有趣。


    它将有一个服务器来集中处理所有通信，以及一个可以根据需要多次运行的客户端应用。客户端和服务器将通过套接字通信（我将使用`socket.io`来处理相关代码，可在[`www.npmjs.com/package/socket.io`](https://www.npmjs.com/package/socket.io)找到），而客户端之间的通信将通过服务器进行。


    聊天应用非常适合采用响应式方法，因为有很多机会可以对不同事件做出响应，例如接收消息、用户登录和退出，甚至客户端向服务器发送的自定义命令。在这个特定示例中，应用将会：


    *   允许任何客户端连接到服务器并与其他用户交谈。

    *   每次新登录操作都会通知所有已连接的客户端。

    *   每个客户端都能发送消息，这些消息将广播给所有其他客户端。

    *   每个客户端都可以发送命令来列出所有已登录用户，从而获取所有参与者的列表。

    *   每个客户端都可以发送退出命令，从而有效结束与聊天服务器的连接。

    *   每当客户端断开连接时，所有其他客户端都会收到该事件的通知。

    *   如果聊天服务器关闭，所有客户端都会优雅地处理该事件。


    本示例使用的模块列表非常精简。我尽量保持这种状态，以展示该方法以及语言本身的能力：


    *   `express.js`（[`www.npmjs.com/package/express`](https://www.npmjs.com/package/express)）仅用于启动服务器，不做他用。

    *   `socket.io`用于创建聊天服务器并处理所有与套接字相关的任务。

    *   `socket.io-client`（[`www.npmjs.com/package/socket.io-client`](https://www.npmjs.com/package/socket.io-client)）提供了创建`socket.io`命令行客户端的能力，而无需
    Web 浏览器（此应用 100%基于命令行）。

    *   最后，`winston`（[`www.npmjs.com/package/winston`](https://www.npmjs.com/package/winston)）用于简化控制台上的日志记录和消息格式化。


    **注意**


    列表中未列出的另一个依赖项是上一章中介绍的库：`rCheese`。


    图 8-5 展示了使用聊天服务器（屏幕上半部分）与两个客户端（屏幕下半部分）交互的输出截图。现在让我们看看代码，了解如何在`Node.js`中使用`rCheese`实现这一功能。


    ![A418015_1_En_8_Fig5_HTML.jpg](img/A418015_1_En_8_Fig5_HTML.jpg)


    **图 8-5.** 两个客户端与聊天服务器交互的截图

