  trans: '

    ### 双流并用而非单流


    我使用了两个流，其中一个用于从用户输入中收集文件名。这个流的事件链上只有一个函数。或许我可以用其他方式处理，比如自定义的 `concat` 函数，但为了简单起见，当前版本已经足够用了。


    一旦这个自定义函数检测到我们按下了 `ENTER` 键，它就会将当前字符串添加到另一个流中，这个流负责处理所有事务并返回神奇的数字。


    对于第二个流，我设置了一个稍长的事件链，旨在逐步处理文件内容并打印最终结果。它们完成了之前提到的所有操作，因此这里无需赘述。


    ### 将函数全面柯里化


    为了让代码更易读，同时也为了与 Observable Streams 的事件链兼容，我对所有主要函数进行了柯里化。也就是说，过滤、归约和映射这些函数都被柯里化成了简化且定制化的版本。由于
    `split` 函数只需要一个参数，所以没有对其进行柯里化。


    ### 可读性大幅提升


    代码背后的逻辑非常简单：我只是想读取一个文件，将其内容转换为 ASCII 码，并计算出最终的数字。但我不妨挑战一下你，用传统的命令式逻辑来编写这段代码。抛开我一直在谈论的那些工具，在不使用它们的情况下编写代码。你会发现抽象层级降低了，而你自己则不得不去解决一些我甚至无需触及的其他问题。


    这就是声明式编程的魅力所在，我们确实应该更深入地探讨它，那么开始讨论吧。


    ## 声明式编程


    在代码中使用声明式方法的一个直接副作用（正如我无数次提及的那样）是：你可以在程序中编写声明式语句，而不是通常的命令式语句。


    简而言之，使用你上面看到的那些工具，你可以编写描述“你想要完成什么”的代码，而不是像通常学的那样，去告诉编译器/解释器“如何完成”你认为最佳的操作，以达到你想要的结果。


    尽管有些语言是纯粹声明式的，比如 `SQL`、`XSL` 和 `Prolog`，但由于 JavaScript 允许你编写函数式代码，你可以将 JS 视为一种部分描述性的编程语言。这只需要开发者有相应的意愿即可。


    别误会，命令式编程和声明式编程一样，都是有效的代码编写方式。而且，你在入门时首先学到的是命令式编程，这完全合情合理；毕竟，早期的计算机，由于使用的是真空管和非常基础的指令集，开发者被迫以逐步的方式编写程序，精确地告诉计算机如何解决一切问题。


    接下来，让我们看一个例子，了解一下从纯粹（或者说大部分是）命令式的实现转向更具声明式的实现后，代码的可读性能有多大的提升。


    ```

    getRemoteData("www.remoteurl.com", function(err, data) {

    if(err) {

    return handleError(err);

    }

    parseData(data, function(err, items) {

    if(err) {

    return handleError(err);

    }

    var names = [];

    for(var i = 0; i < items.length; i++) {

    if(items[i].age > 18) {

    names.push(items[i].name);

    }

    }

    console.log(names.join(", "));

    });

    });

    ```


    上面的代码是命令式代码的一个完美示例。你在做的事情如下：


    - 在预期出错的地方手动检查错误。

    - 创建一个局部变量，仅仅为了遍历数组中的每个元素。

    - 创建一个额外的数组，仅仅为了临时存储提取出的对象名称。


    代码能正常运行，问题不在于效率低下或可能有 bug。不，这里的主要问题在于：


    - 你必须在脑海中解析这段代码。诚然，这个算法并不复杂，但认知负担依然存在——如果你想理解代码试图做什么，你就必须这样做。

    - 扩展这段代码同样需要你阅读并理解你的改动对整个算法产生的影响。


    现在，让我们用声明式的方式来思考。基本上，你需要思考“需要做什么”，而不是直接跳入“如何做”。你想要做的是：


    - 从远程 URL 获取数据。

    - 解析结果。

    - 获取年龄超过 18 岁的对象的名称。

    - 打印出逗号分隔的名称列表。


    这就是你希望应用执行的步骤列表，但其中没有任何内容告诉你它具体应该如何执行。这没问题，你不需要知道，因为你已经拥有处理这些“底层”任务的工具了，例如遍历元素、获取对象属性、或串联步骤以避免担心回调，诸如此类的任务还有很多。


    那么，让我们快速看一下如果用声明式方式编写，你的算法会是什么样：


    ```

    getRemoteData("ww.remoteurl.com")

    .then(parseData)        //获取响应对象并返回对象列表

    .then(filter(over18))

    .then(map(get(''name''))) //获取每个对象的名称

    .then(join(", "))       //获取字符串列表并返回一个字符串

    .then(console.log)      //最终打印出字符串

    .catch(handleError);    //仅用一行代码处理错误

    ```


    这段代码结构非常类似 Promise，因此阅读起来非常容易。调用链上的步骤与我们之前描述的步骤几乎完全一致，所以你可以看到我们的代码有多么声明式。


    我使用了一些你已见过的函数式工具，比如 `map` 和 `get`，还有一些新工具，比如 `join`（另一个柯里化函数，它重现了 `String` 对象的
    `join` 方法），以及将某个函数的结果通过管道传递给另一个函数参数的能力。


    在上述流程中添加一个步骤，比用命令式替代方案要容易得多，因为你无需处理任何现有代码。只需确保你添加的函数的输入和输出与调用链中对应位置的类型匹配即可。


    ## 每个 FRP 语言必须具备的特性


    既然你已经掌握了 FP 的基础知识，并且快速了解了声明式编程，那么你已具备了开始讨论 FRP 所需的工具。


    虽然 JavaScript 并非纯粹的函数式响应式编程语言，而其他语言如 `Haskell` 或 `Elm`（[`http://elm-lang.org`](http://elm-lang.org)）才是，但我将概述任何
    FRP 语言必须具备的主要特性，然后将其与 JavaScript 进行对比，你将看到如何在你自己喜欢的语言中实现这样的特性。

    '
- fmt: '### Observable Streams


    The main characteristic of a functional reactive language should be the ability
    to have native observable streams of events. During Chapters [1](#A418015_1_En_1_Chapter.html)
    and [2](#A418015_1_En_2_Chapter.html), I covered how important these streams are.
    They’re basically the stepping stone to the Reactive part of the language.


    These are the constructs that, when updated, your code will react to, so they’re
    pretty important, mind you! So, what are they, exactly? What are they supposed
    to look like? There are many ways to explain them, but the easiest way to think
    of them is like a composition of the Observer Pattern and the Iterator Pattern.


    On one side, the Observer Pattern dictates:

    - There are two types of objects related to the pattern, the Subject, which is
    the observed object, and the Observers, which are, well, the objects that will
    react to updates on the subject.

    - The subject maintains the list of its observers.

    - When the subject’s state changes, all observers are notified by it. Normally
    executing a pre-established method (usually called `notify`)


    Let’s now take a look at Figure [3-1](#A418015_1_En_3_Chapter.html#Fig1) for a
    visual explanation of what the Observer Pattern looks like.


    ![A418015_1_En_3_Fig1_HTML.jpg](A418015_1_En_3_Fig1_HTML.jpg)


    Figure 3-1. UML diagram for the Observer Pattern (public domain image from Wikipedia
    page on Observer Pattern)


    Figure [3-1](#A418015_1_En_3_Chapter.html#Fig1) shows a classic implementation
    of this pattern, including the mentioned `notify` method and the logic for notifying
    the observers. Now, this pattern is great but it lacks one minor detail: While
    the producer is sending events one after another to all consumers, there is no
    well-defined way to tell them that there are no more events. I’ll get back to
    this later.


    Now, with the Iterator Pattern, you have a much simpler pattern than with the
    Observer Pattern. Here, you’re just trying to decouple the algorithm required
    to traverse a collection, from the actual implementation of the collection. The
    main advantage being that you can re-use the traversing algorithm over different
    types of collections. Figure [3-2](#A418015_1_En_3_Chapter.html#Fig2) provides
    a visual explanation for this pattern.


    ![A418015_1_En_3_Fig2_HTML.jpg](A418015_1_En_3_Fig2_HTML.jpg)


    Figure 3-2. UML diagram for the Iterator Pattern


    Figure [3-2](#A418015_1_En_3_Chapter.html#Fig2) shows the textbook UML diagram
    for this pattern. The collection (which is extending the Aggregate class) can
    create an iterator, and it will provide the methods required to get an item from
    it and to ask if there is a next item to get. That’s a big plus over what you
    just saw with the Observer Pattern, because now you have a way of knowing if there
    are more items in the list or not.


    ### Observer + Iterator = ?


    So, why am I talking about Observer and Iterator all of a sudden? How are Observable
    collections related to these two specific patterns?


    You just saw that the Observer Pattern is very reminiscent of what you want from
    an Observable collection, since the producer is actually in charge of notifying
    the observers, just like I’ve been saying reactive programming works.


    But you also saw how that model is not enough if you also want to be aware of
    the end of the stream of updates. How can you tell when the observed object is
    done sending updates?


    And here is where the iterator pattern comes into play. With it, you can tell
    when the end of the stream comes and you even have a very clean (and more importantly
    standard) way of snatching updates from the stream.


    In other words, an Observable stream is a dynamically updated collection with
    a standard interface to iterate over it.


    So let’s see what a native observable stream looks like on a Functional Reactive
    language like Elm:


    ```

    import Graphics.Element exposing (..)

    import Mouse

    main : Signal Element

    main =

    Signal.map show Mouse.position

    ```


    The syntax of Elm might be unfamiliar to you but the idea of what the code is
    trying to accomplish should be fairly obvious given the declarative nature of
    the code and the incredibly low number of code lines on the snippet.


    The code (taken from one of Elm’s website examples [`http://elm-lang.org/examples/mouse-position`](http://elm-lang.org/examples/mouse-position))
    is printing onscreen the coordinates for the mouse pointer position and updating
    it every time you move the mouse. The `Mouse.position` property is actually an
    observable stream, which is used as input to the `Signal.map` method, which is
    applying the `show` function to each new value of the stream. Like I said, super
    easy!


    What would your JavaScript code look like, if you wanted to do the same, using
    the declarative syntax I’ve been showing you so far? Something along these lines:


    ```

    Mouse.getPosition()

    .then(map(show));

    ```


    Then how would you go about implementing an Observable Stream on JavaScript (more
    specifically using Node.js)? Here is a basic approach at that problem:


    ```

    var EE = require("events");

    var util = require("util");

    function ObservableStream() {

    this.values = [];

    this.error_fn = null;

    EE.call(this);

    }

    util.inherits(ObservableStream, EE);

    ObservableStream.prototype.add = function(value) {

    this.values.push(value);

    this.emit(''data'', value);

    };

    ObservableStream.prototype.getValues = function(){

    var self = this;

    var stream = new Streamable();

    self.on(''data'', function(v) {

    stream.emit(''trigger'', v)

    })

    return stream;

    };

    ```


    The preceding code is the main class the developer should focus on, the public
    one if you will, and it provides the entrance point to the actual heart of the
    library, which is the `Streamable` class (see next). The way this code works is
    simply by emitting a `data` event every time a new item is added to the internal
    collection (which is why I’m using the `EventEmitter` module). As you can see
    on the `getValues` method, the `Streamable` object is listening to this event,
    and every time the event is triggered, the streamable itself fires a new `trigger`
    event, to start the chain of transformations.'
