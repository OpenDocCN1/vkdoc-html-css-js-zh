- fmt: '### The Server


    According to the list of features from before, the chat server can use four streams:
    one to handle the login action, another one to handle the new messages received,
    a third to handle the commands received by the clients. And there is one final
    stream added to handle the exit command. Since it requires a few steps, let''s
    see the code now:


    > **Note**: As you are about to see, when transmitting objects through the Cheese
    streams, they need to be serialized and de-serialized. This is due to the fact
    that the internal stream used by the module is not set to be on object mode, so
    everything has to be a String.


    The entry point for the server is this:


    ```javascript

    var app = require(''express'')();

    var http = require(''http'').Server(app);

    var io = require(''socket.io'')(http);

    var rCheese = require("../cheese");

    var logger = require("./logger");

    var Cheese = rCheese.Cheese;

    var map     = rCheese.Utils.map,

    filter  = rCheese.Utils.filter;

    io.on(''connection'', function(socket){

    socket.on(''login'', function(data) {

    var username = data.username;

    _USERS[username] = setupStreams(username, socket);

    });

    });

    ```


    > **Note**: Although I will be using Winston to handle all logging needs, I''m
    creating a custom logger to handle colors and different logger levels, so all
    that code will be on the `logger.js` file.


    Next you have the `setupStreams` function, which as you might''ve guessed, will
    set up the three main streams for every new user that logs in to the chat server.
    This is the largest function in the entire app, and that is simply because the
    flow for all three streams is determined here:


    ```javascript

    function setupStreams(usrname, socket) {

    var msgs = new Cheese();

    var logins = new Cheese();

    var commands = new Cheese();

    var msgsListener = false;

    var cmdListener = false;

    //== New messages stream

    //It simply broadcasts all messages sent if they have the required attributes

    msgs.fromFn(function(push) {

    if(!msgsListener) {

    msgsListener = true;

    logger.debug("New messages listener set...");

    socket.on(''new_msg'', function(msg) {

    if(msg.username == usrname) {

    push(JSON.stringify(msg)); //serialize object

    }

    });

    }

    })

    .then(filter(function(m, done) {

    var mObj = JSON.parse(m.toString());

    done(null, mObj.msg != '''' && mObj.msg != null && mObj.date != null && mObj.username
    != null);

    }))

    .each(function(obj) {

    //de-serialize object

    logger.debug("Emitting new message: ", obj.toString());

    socket.broadcast.emit(''new_msg'', JSON.parse(obj.toString()));

    });

    //== Commands stream

    commands.fromFn(function(push) {

    if(!cmdListener) {

    cmdListener = true;

    logger.debug("New command listener set...");

    socket.on(''new_cmd'', function(cmd) {

    console.log("new command received: ", cmd.username, usrname);

    if(cmd.username == usrname) {

    push(JSON.stringify(cmd));

    }

    })

    }

    })

    .then(executeCommand)

    .then(filter(function(v, done) {

    done(null, v != null);

    }))

    .onError(function(err) { //format error message so it can be sent back to the
    client

    return JSON.stringify({msg: err.message, date: new Date()});

    })

    .each(sendBackResponse(socket));

    //== Login stream

    logins.fromArray([usrname])

    .then(map(function(username, done) { //turn the username into a message to send
    to everyone else

    var newObj = JSON.stringify ({msg: [username, ''has just logged in.''].join(''
    ''), date: new Date()});

    done(null, newObj);

    }))

    .each(function(obj) {

    logger.info("User logged in, broadcast message sent");

    socket.broadcast.emit(''system_msg'', JSON.parse(obj.toString()));

    });

    return {

    socket: socket,

    msgs: msgs,

    logins: logins,

    commands: commands

    };

    }

    ```


    As you can appreciate, the three first streams are there: `logins`, `commands`,
    and `msgs`. For `commands` and `msgs` I use the same technique to push data into
    them, and I set up a listener for the socket''s correct event. Those listeners
    need a logic check to only be set once, because, as you might (or might not) remember,
    the function passed to `fromFn` is queried every few milliseconds.


    The first stream created is the one for the new messages that arrive from the
    clients, it is meant to only receive the event and broadcast it to all clients,
    but because it''s so easy, I also added a previous validation step, filtering
    out messages that don''t have the required fields.


    The commands stream is also quite simple: Get the command object, execute it,
    and, if the command returns an object, then send it back to the client; otherwise,
    simply filter it out. You''ll see the code for two commands below. One of them
    returns a response that needs to be sent back, and the other ones don''t. This
    stream also handles errors, specifically the "Unknown command" error, which is
    a pretty easy one to cause.


    Finally, the logins stream is created to handle the client''s login message, which
    is the one that triggers this function''s call, so instead of going with a socket
    listener, I''m using the `fromArray` method, passing in an array with only one
    item, the data received as part of the login event. This stream will process the
    event and be terminated afterward. One could argue the benefits of using a stream
    for such a case, but even though there is no need for reactive code for a single
    event, the code and the logic are clean and simple to understand, so I''d say
    it is worth it.


    Let me now show you the last relevant bit of the server''s code: the commands.


    ```javascript

    function executeCommand(cmd) {

    var cmdObj = JSON.parse(cmd.toString());

    var commands = {

    listUsers: listUsersCommand,

    exit: closeConnection

    };

    if(!commands[cmdObj.cmd]) {

    throw new Error("Error: Unknown command");

    } else {

    var result = commands[cmdObj.cmd](cmdObj);

    return (result !== null) ? JSON.stringify(result) : null;

    }

    }

    ```


    The preceding function, which triggers the execution of all commands, is actually
    quite simple. As you can see only two commands are supported, otherwise an error
    is thrown (which is caught by the rCheese module).


    The EXIT command is the first and most complex of the two of them. The logic behind
    it can be split into several steps:


    - Notify all users about the one that''s leaving the chat room.

    - End the connection between client and server.

    - Remove the user from the in-memory list of connected users.

    - Finally, print out a log message on the server console.


    Now, following everything I''ve shown you so far about declarative programming,
    I took those four steps and turned them into a stream of, yet again, one single
    event.'
