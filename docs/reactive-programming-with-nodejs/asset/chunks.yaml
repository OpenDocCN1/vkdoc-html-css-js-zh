- fmt: "# JavaScript 响应式编程与 `Streamable` 类\n\n```javascript\nfunction Streamable(triggerCode)\
    \ {\n  this.events = [];\n  this.idx = 0;\n}\n\nStreamable.prototype.start = function(val)\
    \ {\n  this.idx = 0;\n  this.next(val);\n};\n\nStreamable.prototype.next = function(val,\
    \ result) {\n  if (this.idx >= this.events.length) return false;\n  var currentFn\
    \ = this.events[this.idx];\n  this.idx++;\n  currentFn(val);\n};\n\nStreamable.prototype.catch\
    \ = function(errfn) {\n  this.error_fn = errfn;\n};\n\nStreamable.prototype.then\
    \ = function(fn) {\n  var self = this;\n  var newFn = null;\n  if (!fn.__type)\
    \ {\n    if (fn.length > 1) {\n      newFn = function(val) {\n        fn(val,\
    \ function(err, result) {\n          if (err) return self.error_fn(err);\n   \
    \       self.next(result);\n        });\n      };\n    } else {\n      newFn =\
    \ function(val) {\n        self.next(fn(val));\n      };\n    }\n  } else {\n\
    \    if (fn.__type === 'map') {\n      newFn = function(val) {\n        self.next(fn(val));\n\
    \      };\n    }\n  }\n  if (newFn) this.events.push(newFn);\n  return this;\n\
    };\n```\n\n`Streamable` 类提供了著名的 `then` 方法，传递给它的每个函数都会被包装成另一个函数（该函数负责调用事件链中的下一个函数），并添加到一个列表中。一旦触发\
    \ `trigger` 事件，该类将遍历该列表并依次调用每个函数。\n\n## 辅助 `map` 函数\n\n```javascript\nfunction\
    \ map(fn) {\n  var curried = function(val) {\n    return fn(val);\n  };\n  curried.__type\
    \ = 'map';\n  return curried;\n}\n```\n\n> **注意**：你可能已经注意到错误处理非常简单；当然，这是为了简化。最终的代码将包含所有必要的错误处理。\n\
    \n## 增强：使用属性定义替代 `getValues` 方法\n\n为了使代码更具声明性，可以用带 `setter` 的属性定义来替代 `getValues`\
    \ 方法。因此，我们直接移除该方法，并在构造函数中添加以下代码：\n\n```javascript\nfunction ObservableStream()\
    \ {\n  this.values = [];\n  this.error_fn = null;\n  EE.call(this);\n  Object.defineProperty(this,\
    \ 'data', {\n    get: function() {\n      var self = this;\n      var stream =\
    \ new Streamable();\n      self.on('data', function(v) {\n        stream.start(v);\n\
    \      });\n      return stream;\n    }\n  });\n}\n```\n\n现在不再需要 `getValues` 方法，你可以直接使用\
    \ `data` 属性。\n\n## 使用 `ObservableStream` 的示例\n\n以下示例演示了如何使用上述代码转换和处理 `ObservableStream`：\n\
    \n```javascript\nvar fs = require(\"fs\");\nvar dataStream = new ObservableStream();\n\
    \ndataStream.data\n  .then(map(function(x) {\n    return 'filename_' + x + '.txt';\n\
    \  }))\n  .then(fs.readFile)\n  .then(map(function(x) {\n    return '' + x;\n\
    \  }))\n  .then(console.log);\n\nvar stdin = process.stdin;\nstdin.setRawMode(true);\n\
    stdin.resume();\nstdin.on('data', function(input) {\n  var str = input.toString();\n\
    \  dataStream.add(str);\n  if (str == 'x') {\n    process.exit();\n  }\n});\n\
    ```\n\n上述代码包含两个主要部分。第一部分为 `ObservableStream` 进行设置：实例化它并建立转换链。第二部分代表外部数据源。\n\n\
    我们先介绍第二部分，因为从数据流的角度来看，这里是一切开始的地方。这段代码基本上允许你捕获用户每次按下键盘时触发的事件。利用该事件，将接收到的对象转换为 `String`\
    \ 并添加到自定义集合中。额外的 `if` 语句用于确保可以在需要时停止监听并关闭程序。\n\n这部分代码可以替换为任何其他实现，关键点在于：当数据到来时，你将其添加到可观察集合中。数据从哪里来并不重要。\n\
    \n现在，回到代码的第一部分，这里设置了处理数据流的函数链。这些函数非常直观，正如本章前面提到的：声明式代码更容易阅读和理解。\n\n处理步骤如下：\n\n\
    1. 使用 `map` 函数将每个按键字符转换为文件名。\n2. 将文件名传递给 `fs.readFile` 方法，读取对应文件。\n3. 将返回的缓冲区转换为实际的\
    \ `String`。\n4. 最后，将第 3 步的输出（读取的文件内容）传递给最后一步，通过 `console.log` 打印出来。\n\n是的，逻辑非常简单，但它的美妙之处在于你只关注这些逻辑，而不必关心如何读取文件、处理错误等底层细节。\n\
    \n---\n\n## 总结\n\n这一章内容很丰富，涵盖了很多知识点，希望你在阅读过程中也能享受到乐趣！\n\n本章涵盖的主要内容：\n\n- **JavaScript\
    \ 函数式编程要点**：了解了什么是一段代码被认为是函数式的，学习了主要原则，并掌握了一些函数式程序员必须了解的工具。\n- **声明式编程的优势**：再次回顾了声明式编程相对于传统命令式方法的好处。\n\
    - **可观察流（Observable Streams）**：作为函数式响应式编程库的基石，我向你展示了它们的工作原理，并实现了一个简单的版本。\n\n在下一章中，我将探讨响应式编程如何在后端发挥作用，因为响应式编程通常用于前端开发。\n\
    \n---\n\n# 4. 后端响应式编程\n\n现在你已经了解了相关背景知识，终于到了动手实践的时候了。在本章中，我将分析如何将函数式响应式编程（FRP）的优势应用到后端开发中。\n\
    \n为此，我将介绍一组后端程序员常见的用例，首先查看常规实现，然后采用 FRP 方式重新实现相同的用例。\n\n由于我没有自己开发或从现有库中选取的 FRP\
    \ 模块，我将假设已经有一个自定义的 FRP 模块可用。这将在两个方面帮助我：\n\n- 为代码提供所需的支持。\n- 帮助定义即将开发的 FRP 模块的\
    \ API。目前我假设它已经存在，并且所有需要的函数/方法都可用。\n\n到本章结束时，你将拥有足够的理由开始在后端代码中使用响应式编程。为此，我将介绍两个非常常见的用例：\n\
    \n- **带 CRUD 端点的简单 API**：我将创建一个简单的 API，提供单个端点，包含所有 CRUD（创建、读取、更新和删除）功能。\n- **登录**：将向之前开发的\
    \ API 添加一个用于获取认证令牌的端点。\n\n那么，让我们直接开始吧。\n\n## 带 CRUD 端点的 API\n\n对于任何后端开发者来说，这可能是最常见的用例之一。过去你很可能遇到过至少一两个这样的功能，但我们将完整地查看\
    \ CRUD 函数集。\n\n显然，有多种实现方式，每种方式都同样有效。为了本示例的目的，让我们定义一些约束条件。"
