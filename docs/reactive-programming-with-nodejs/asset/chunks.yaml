    ## The Tools of the Functional Programmer


    So, what can you do with composition, pure functions, and currying? I’ll tell
    you what you can do, you can create the three main functions any good functional
    programmer must know and love (yes, you’ll either love them or hate them, because
    you’ll be using them even without knowing).


    Those functions are `map`, `filterm` and `reduce`. Let’s get to know them a little
    better, although you might’ve used them already, since they’re all part of the
    `Array` object. I’ll show you how they work and what you can do with them.


    ### Map


    Let’s start with the easiest of them. The `map` function is meant to apply a function
    to every element of your list, and with the results from that execution, it creates
    a new list.


    I’ll start with a basic example. Say you have a list of integers and you want
    to calculate the square root of each number, simple with `map`:


    ```javascript

    var numbers = [1, 2, 3, 4, 5, 6];

    var results = numbers.map(function(i) { return Math.sqrt(i); } );

    console.log(results);

    /* Resulting on

    [ 1,

    1.4142135623730951,

    1.7320508075688772,

    2,

    2.23606797749979,

    2.449489742783178 ]

    */

    ```


    So, that was easy. There is even a simplification that can be applied to that,
    the method `Math.sqrt` receives one parameter and returns a value, kind of the
    same signature your anonymous function has, so you can directly write:


    ```javascript

    var numbers = [1, 2, 3, 4, 5, 6];

    var results = numbers.map(Math.sqrt);

    console.log(results);

    ```


    The result is the same in both cases, but the second version is easier to understand,
    more declarative if you will.


    There is a catch here, the applied function must be synchronous, it’s not like
    you can do something like this:


    ```javascript

    var filenames = [''file1.txt'',  ''file2.txt'' ];

    var content = filenames.map(fs.readFile);

    ```


    That won’t work, because the `readFile` method is not returning the actual content,
    so you’ll end up with an array full of `undefined` items if you try to run the
    preceding code, because again, the method I’m using doesn’t return the content;
    in fact, it returns nothing at all. Fear not though, there is a way to do an asynchronous
    `map` and then use the resulting array, it’s just a bit different.


    Like with everything in the world of programming, there is not just one way to
    do this right, particularly. I’ll show you two variants of this asynchronous map,
    one using ECMAScript 6 Promises (because, why not?) and another one using classic
    callback functions. You can pick the one you like the most and use that one.


    ```javascript

    //Map using ECMAScript 6 Promises

    function promiseMap (list, fn) {

    var promises = list.map(function(i) {

    var p = new Promise(function(resolve, reject) {

    fn(i, function(err, result) {

    if(err) return reject(err);

    resolve(result);

    })

    });

    return p;

    });

    return Promise.all(promises);

    }

    ```


    The preceeding code is doing two simple things: First, it creates a list of promises
    and then it returns the promised returned by `Promise.all`, which will be resolved
    when all the promises you pass as parameter get resolved. And the “magic” happens
    inside the promises generated by for `map` loop, they execute the asynchronous
    function (`fn`), and depending on the results from that function, that promise
    either gets resolved or rejected, which, in turn, will impact the result of the
    general promise.


    **Caution**


    The preceding code clearly assumes that you already know what a `Promise` is and
    how you’re supposed to use it. If you haven’t, I encourage you to please go read
    up on the subject ([`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise)).


    And here is how you would use the new promise-based `promiseMap` function in your
    code:


    ```javascript

    //Sample code using promise based map function

    var filenames = [''file1.txt'', ''file2.txt''];

    promiseMap(filenames, fs.readFile)

    .then(function(content) {

    console.log("------- Content of the files ---------");

    content.forEach(function(c) {

    console.log(c.toString());

    });

    })

    .catch(function(err) {

    console.error("There was an error reading your files: ", err);

    });

    ```


    The sample code takes a list of strings (filenames) and applies the `fs.readFile`
    method to each one of them, basically reading each file and pouring its content
    into a new list. Once all items on the list have been processed, and all files
    have been successfully read, the final callback is called, and it will receive
    an array with all the results from the main function execution (`fs.readFile`).


    Another way of dealing with asynchronous functions on a `map` call is using callbacks,
    and for that, you can go with a custom implementation like the one I’m about to
    show you or just rely on a third-party library, like Async.js ([`https://github.com/caolan/async`](https://github.com/caolan/async)).


    ```javascript

    //Map using regular callbacks

    function callbackMap (list, fn, done) {

    var results = [];

    var counter = 0;

    list.forEach(function(i) {

    fn(i, function(err, result) {

    if(err) return done(err);

    results.push(result);

    counter++;

    if( counter == list.length ) {

    done(null, results);

    }

    });

    });

    }

    ```


