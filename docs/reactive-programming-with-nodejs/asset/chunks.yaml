- fmt: '# The Big Cheese


    The main library, which is the one you''ll always have to use, was designed to
    work on top of a Node.js stream, this simplifies things, because I didn''t have
    the need to simulate the way a stream would work (in regards of time-based events,
    data being transferred, and so on), Node already did it for me, so what this library
    does, is it provides a simpler interface to interact with a Node stream and also,
    it provides simple ways to transform the data that flows through it.


    The methods you''ll want to pay attention to from a user point of view are:


    *   `fromStream`: This method will create a Cheese stream from a regular Node.js
    stream (every `data` event on this stream will write to the internal cheese stream).

    *   `fromArray`: Again, this one will create a new Cheese stream from a good old
    Array object. Array items will be emitted every 100 milliseconds (default value)
    or given a delay period provided as a second, optional, parameter.

    *   `fromFn`: The last of the `fromXXX` methods, this one will create a new Cheese
    stream from the emitted values of a function. It basically works like the previous
    one, but it gives you more control over what is emitted and when it is emitted.
    This method receives a second, optional parameter to set the delay for emitting
    the values, just like above (but the default value is 0 milliseconds, since you
    can define the timing from within the function as well. The function passed as
    emitter will receive a single function as parameter, which will have to be called
    every time a new value needs to be emitted.

    *   `merge`: This method will merge the current internal stream with any other
    stream passed as parameter. The order of the resulting data chunks is only determined
    by the timing of the different `data` events.

    *   `then`: This method will simply act as syntactic sugar, allowing you to chain
    transformations over the data chunks being transferred through the stream. It
    only receives a single function per call.

    *   `onError`: Just like the above method, but it sets up a special chain of transformations
    that will take place only when one of the transformation emits an error (either
    by throwing an exception or by passing an error parameter to its callback).

    *   `each`: Finally, this should be the last method to be called on every chain
    of transformations. It starts the execution of the stream up to the point when
    this method is called and receives a final function that will be called at the
    end of the transformation chain with the final resulting value.


    Let''s now look at a few examples of the above methods, and then I''ll show you
    the code for them. The first one shows you how to interact with existing Node.js
    streams using the `fromStream` method:


    ```

    var Cheese  = require("./cheese").Cheese;

    var fs = require("fs");

    var ch = new Cheese();

    var chStream = ch.fromStream(fs.createReadStream(''./test-cheese1.js''));

    chStream

    .each(function(content) {

    console.log(content.toString());

    });

    ```


    As you can see, the above example is quite simple, but it shows both the `fromStream`
    method, and the mandatory usage of the `each` method, without it, the reading
    of the file would''ve never started. You can easily add some transformations to
    it by using the `then` method before calling each, like so:


    ```

    //rewriting the final lines of the previous example

    chStream

    .then(function(chunk) {

    return chunk.toString().toUpperCase();

    })

    .each(function(content) {

    console.log(content.toString());

    });

    ```


    By default you can pass any function to the `then` method, and it will check whether
    it receives one parameter (assuming it''s a synchronous function) or two (assuming
    it''s an asynchronous function) and it will operate accordingly.


    Let''s now look at one final example, with and without error handling:


    ```

    var Cheese = require("r-cheese").Cheese;

    var fs = require("fs");

    var flatMap = require("r-cheese").Utils.flatMap;

    var ch = new Cheese();

    var filenames = [''./test-cheese1.js'', ''./test-cheese23.js''];

    ch.fromArray(filenames)

    .then(flatMap(function(name) {

    return fs.createReadStream(name.toString());

    }))

    .each(function(content) {

    console.log(content.toString());

    });

    ```


    Ignoring for now the use of the `flatMap` function (I''ll get into it in a second),
    the above code simply takes a list of filepaths, and transforms it into the actual
    file content of each element. It also ends up printing the content out. Now if
    one of those filepaths were to have a typo, you''ll end up with an unhandled exception
    printed on screen, because the `fs.createReadStream` line would generate an `error`
    event and you have nothing to handled that event. In fact, because of the way
    Node.js handles the error events and because you''re not listening for it, your
    script will be terminated (I mentioned this in a previous chapter, remember?)


    You can easily fix that by adding error handling using the `onError` method, like
    so:


    ```

    ch.fromArray(filenames)

    .then(flatMap(function(name) {

    return fs.createReadStream(name.toString())

    }))

    .onError(function(e) {

    console.trace(e);

    })

    .each(function(cnt) {

    console.log(cnt.toString());

    });

    ```


    And with that, you''re now safely handling the error event, your script will not
    be prematurely terminated and you''ll have full control over what to do with that
    error.


    **Note**


    The chunks of data that generate an error will not be processed by any of the
    following transformations, but the following chunks will go through the entire
    chain as they should (provided they don''t also generate an error as well).


    Let''s now look at the code for the main library, shall we?


    ```

    var Streams = require("stream");

    var inherits = require("util").inherits;

    var Transform = Streams.Transform;

    function OutputStream() {

    Transform.call(this);

    }

    inherits(OutputStream, Transform);

    OutputStream.prototype._transform = function(chunk, encoding, callback) {

    callback(null, chunk);

    }

    var DEFAULT_ARRAY_DELAY = 100; //ms

    var DEFAULT_FN_DELAY = 0; //ms

    ```


    The preceding lines are simply to define our internal stream, and a couple of
    default values used below.


    ```

    function Cheese(stream, transformations) {

    this._stream = stream || null;

    this._stream_ended = false;

    this._outputStream = new OutputStream();

    if(this._stream !== null) {

    this.fromStream(stream)

    }

    this._transformations = transformations || [];

    this._error_transformations = [];

    this._source_name = null;

    this._source_interval = null;

    this._source_interval_delay = null;

    this._source_interval_origin = null;

    }

    Cheese.prototype.fromStream = function(stream) {

    var self = this;

    this._stream = stream;

    this._source_name = ''stream'';

    this._stream.on(''data'', function(d) {

    self._writeToOutput(d);

    });

    return this;

    };

    Cheese.prototype.fromFn = function(fn, delay) {

    if(typeof delay == ''undefined'') {

    delay = DEFAULT_FN_DELAY;

    }

    this._source_name = ''fn'';

    this._source_interval_delay = delay;

    this._source_interval_origin = fn;

    return this;

    };

    Cheese.prototype.fromArray = function(arr, delay) {

    if(typeof delay == ''undefined'') {

    delay = DEFAULT_ARRAY_DELAY;

    }

    this._source_name = ''array'';

    this._source_interval_delay = delay;

    this._source_interval_origin = arr;

    return this;

    };

    ```


    The previous three methods setup the gathering of events, depending on the source
    (array, function or stream), note that these methods only setup the right values
    on the right variables, only when the `each` method is called, the actual intervals
    will be started (see below).


    ```

    Cheese.prototype._writeToOutput = function(val) {

    if(!this._stream_ended) {

    if(val !== null) {

    val = val.toString();

    }

    this._outputStream.write(val);

    }

    }

    ```'
