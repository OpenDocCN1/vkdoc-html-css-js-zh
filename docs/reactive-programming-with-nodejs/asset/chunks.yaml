    over all items, apply the async function, and keep track of how many callbacks
    are called. Once you reach the right number (equal to the number of items on the
    list), then you can call the `done` function and send the list of results.


    Here’s how you would go about using this function:


    ```javascript

    //Sample code using promise based map function

    var filenames = [''file1.txt'', ''file2.txt''];

    callbackMap(filenames, fs.readFile, function(err, content) {

    if(err) {

    console.error("There was an error reading your files: ", err);

    } else {

    console.log("------- Content of the files ---------");

    content.forEach(function(c) {

    console.log(c.toString());

    });

    }

    });

    ```


    Now instead of setting up two callback functions using `then` and `catch`, you
    can set one anonymous function and receive both the error and the results, a classic
    callback pattern.'
