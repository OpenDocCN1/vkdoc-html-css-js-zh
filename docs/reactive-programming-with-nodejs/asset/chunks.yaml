    \n*   使用输入作为文件名读取文件。\n*   将结果字符串分割成字符数组。\n*   过滤掉不需要的字符。\n*   将每个字符映射到其 ASCII\
    \ 码。\n*   将它们加起来。\n*   将结果数字打印到控制台。\n\n代码如下：\n\n```javascript\nvar fs = require(\"\
    fs\");\nvar functionalUtils = require(\"./func_utils\");\nvar ObservableStream\
    \ = require(\"./ostream\");\n/*\nUtility functions\n*/\nvar filterUnwantedCharacters\
    \ = functionalUtils.curry(functionalUtils.filter, function(c) {\n    return /[a-zA-Z0-9\
    \ ]/.test(c);\n});\nvar mapToInt = functionalUtils.curry(functionalUtils.map,\
    \ function(c) {  return c.charCodeAt(0); } );\nvar addUp = functionalUtils.curry(functionalUtils.reduce,\
    \ function(x, y) { return x + y; });\nvar split = function(str) { return str.toString().split(\"\
    \"); };\n//streams setup\nvar dataStream = new ObservableStream();\ndataStream.data\n\
    \    .then(fs.readFile)\n    .then(split)\n    .then(filterUnwantedCharacters)\n\
    \    .then(mapToInt)\n    .then(addUp)\n    .then(console.log)\n    .catch(function(error)\
    \ { //Error handling!\n        console.log(\"There was an error: \", error);\n\
    \    })\nvar filenameStream = new ObservableStream();\nvar filename = \"\";\n\
    filenameStream.data\n    .then(function(chr) {\n        if(chr.charCodeAt(0) !=\
    \ 13) { //if we're not inputing an enter\n            filename += chr;\n     \
    \   } else {\n            dataStream.add(filename);\n            filename = \"\
    \";\n        }\n    });\nvar stdin = process.stdin ;\nstdin.setRawMode(true);\n\
    stdin.resume();\nstdin.on('data', function(input) {\n    var character = input.toString();\n\
    \    console.log(character);\n    if(character.charCodeAt(0) === 27) process.exit(0);\
    \ //exit with ESC\n    filenameStream.add(character);\n});\n```\n\n你会注意到我引用了两个实际上是自定义的库（`func_utils`和`ostream`），但代码并不在这里，我将在本书后面展示它们的代码；现在，只要知道我们使用的是我已经讨论过的函数就足够了。至于`ObservableStream`对象，暂时不用担心；我很快就会详细讲解它。\n\
    \n> **注意**\n> \n> 顺便提一下，如果你尝试了本书附带的代码，并使用内容为“Bill Gates III”的文件，你可能会发现这个谣言大错特错。所以，真扫兴，但至少你揭穿了它，同时找到了一些乐趣！\n\
    \n代码实际上相当直接，但像往常一样，有几个有趣的地方，让我们来逐一讨论。\n"
- fmt: '### Two Streams Instead of One


    I’m using two streams, one to gather the filename from the user’s input. There
    is only one function on the chain of events for this one. I could probably handle
    it differently, using some form of custom `concat` function, but for simplicity
    reasons, this version of it will do.


    Once this custom function detects we’ve hit the `ENTER` key, it’ll add the current
    string to our other stream, the one that takes care of processing everything and
    returning the magic number.


    For the second stream, I’ve setup a slightly longer chain of events meant to process
    the file’s content step by step and print out the final result. They do everything
    I mentioned before, so there is nothing new to add here.


    ### Curry the Hell Out of the Functions


    To make things easier to read and, just as important, compatible with the Observable
    Streams chain of events, I curried all the main functions. That is, filtering,
    reducing, and mapping, they all got curried into a simplified and customized version.
    There was no need to curry the `split` function, since it only required one parameter.


    ### Readability ++


    The logic behind the code is very simple, I simply wanted to read a file, transform
    its content into ASCII code and find out the resulting number. But I dare you
    to write it using traditional, imperative logic. Leave aside all the tools I’ve
    been talking about and write it without them. The abstraction level will go down,
    and you’ll find yourself trying to solve other problems that I didn''t even have
    to touch.


    So that’s declarative programming for you, and we should definitely talk about
    it some more, so let’s discuss.


    ## Declarative Programming


    An immediate side effect from using a declarative approach on your code is (as
    I’ve said it countless times) the opportunity to write declarative statements
    in your programs instead of the usual imperative ones.


    Put simply, using the tools you saw above, you can write code that describes what
    you want to accomplish, instead of what you normally learn to do, which is tell
    the compiler/interpreter how to do what you think is best, to accomplish the results
    you want.


    Although there are some languages that are purely declarative, like `SQL`, `XSL`,
    and `Prolog`, thanks to JavaScript’s ability to allow you to write functional
    code, you can count JS as a partially descriptive programming language. All that’s
    required is the developer’s willingness to do so.


    Make no mistake, imperative programming is just as valid a way of writing code
    as it is declarative programming, and it makes total sense that it has been the
    first thing you''re taught when starting out; after all, with the first computers,
    with their vacuum tubes and a very basic instruction set, the developers were
    forced to write their programs in a step-by-step manner, telling them exactly
    how to solve everything.


    Let’s now look at an example of how much your code’s readability can change going
    from a purely (or maybe mostly) imperative implementation into a more declarative
    one.


    ```

    getRemoteData("www.remoteurl.com", function(err, data) {

    if(err) {

    return handleError(err);

    }

    parseData(data, function(err, items) {

    if(err) {

    return handleError(err);

    }

    var names = [];

    for(var i = 0; i < items.length; i++) {

    if(items[i].age > 18) {

    names.push(items[i].name);

    }

    }

    console.log(names.join(", "));

    });

    });

    ```


    The preceding code is a perfect example of imperative code. You are:


    - Manually checking for errors whenever you’re supposed to get them.

    - Creating a local variable for the sole purpose of iterating over each element
    of an array.

    - Creating an extra array simply to temporarily store the extracted names of the
    objects.


    The code works, and the problem is not that it is inefficient or that it might
    have bugs. No, the main issue here is:


    - You have to mentally parse the code. Granted it is not that complex of an algorithm,
    but the cognitive load is there, you have to do it if you want to understand what
    the code is trying to do.

    - Extending that code requires, again, that you read it and understand the effects
    of your changes over the entire algorithm.


    Let’s now think in a declarative way. Basically you want to think on what needs
    to be done, instead of jumping into the how. You want to:


    - Get the data from the remote url.

    - Parse the results.

    - Get the names of the objects that are over 18 years old.

    - Print the list of comma-separated names.


    Now that’s the list of steps you want your app to do, but there is nothing in
    there that tells you how it is meant to do it. And that’s fine, you don’t need
    to, because you already have the tools that will handle the “low level” tasks
    of iterating over items, or getting the property of an object, or chaining the
    steps so that you don’t need to worry about callbacks, and the list can go on.


    So let’s take a quick look at what your algorithm would look like if you were
    to write it declaratively:


    ```

    getRemoteData("ww.remoteurl.com")

    .then(parseData)        //gets a response object and returns a list of objects

    .then(filter(over18))

    .then(map(get(''name''))) //gets the names of each object

    .then(join(", "))       //gets a list of strings and returns a string

    .then(console.log)      //finally print out the string

    .catch(handleError);    //one single line for the error handler

    ```


    The code has a very promise-like structure, so reading it is very easy. The steps
    shown on the chain of calls are pretty much the same steps we described earlier,
    so you can see how declarative our code is.


    I’m using some functional tools you’ve already seen, like `map` and `get`, and
    some new ones, like `join` (another curried function that reproduces the `join`
    method of the `String` objects) or the ability to pipe the results of one function
    into the parameters of another one.


    Adding a step into the above flow is considerably easier than doing it with the
    imperative alternative, since you don’t have to deal with any code. Just make
    sure the input and output of your function corresponds to the place in the chain
    where you want to add it.


    ## What Every FRP Language Must Have


    Now that you’ve got the basics of what FP is, and you had a quick overview of
    declarative programming, you have the tools you’ll need to start talking about
    FRP.


    Although JavaScript is not a purely functional reactive language, and there are
    others that are, like `Haskell` or `Elm` ([`http://elm-lang.org`](http://elm-lang.org)),
    I’ll go over the main thing any FRP languages must have and then I’ll compare
    that to JavaScript, and you’ll see how you can implement such a feature in your
    favorite language.'
