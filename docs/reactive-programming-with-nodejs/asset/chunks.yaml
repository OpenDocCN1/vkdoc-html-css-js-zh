    \ 4-3 以了解响应式逻辑的样式。\n\n![A418015_1_En_4_Fig3_HTML.jpg](img/A418015_1_En_4_Fig3_HTML.jpg)\n\
    \n图 4-3. 新地址端点响应式版本的弹珠图\n\n如果你记得（如果不记得，请往回翻几页），原始代码结合了两个 Promise 来实现其目标。上图展示的是一个步骤更长的解决方案，但也更为直接。如果你仔细观察，这个解决方案相当简单明了。请参阅表\
    \ 4-4 查看代码对比。\n\n表 4-4. 为用户创建新地址所需代码的并排对比\n\n| 响应式代码 | 常规代码 |\n| --- | --- |\n\
    | `var newAddress = new oStream();` `newAddress.data`     `.setVars({'httpResponse':\
    \ get(1), 'userId': function(args) { return args[0].params.id}})`     `.then(get(0))`\
    \     `.then(get('body'))`     `.then(models.addresses.create.bind(models.addresses))`\
    \     `.then(function(address, done) {`     `models.users.findByIdAndUpdate(this.customVars.userId,\
    \ {$push: {'addresses': address.id}}, {new: true}, done);`     `})`     `.then(function(usr,\
    \ done) {`     `models.users.populate(usr, {path: 'addresses'}, done);`     `})`\
    \     `.done(toJSONResponse)`     `.catch(callErrorHandler );` | `router.post('/:id/addresses',\
    \ function(req, res, next){` `var addressPromise = models.addresses.create(req.body);`\
    \ `var userPromise = addressPromise.then(function(address) {` `return models.users.findById(req.params.id)`\
    \ `});` `Promise.all([addressPromise, userPromise], function([address, user])\
    \ {` `user.addresses.push(address._id);` `return user.save();` `}).then(function(user)\
    \ {` `return res.json(user);` `}).catch(next);` `});` |\n\n这个例子也显示了响应式方法代码行数更多，但如果你看看常规实现，一旦业务逻辑的复杂性增加，就需要额外的工具，要么是\
    \ Promise（增加了理解其工作原理的复杂性），要么是老式的回调逻辑，并伴有额外的缩进层级。无论哪种方式，响应式方法都保持了对事务的控制，只有一个缩进层级，可能步骤稍多一些；但如果你将逻辑进行外推和规模化扩展，响应式方法就会显得越来越出色。\n\
    \n### 辅助函数\n\n前面提到的响应式示例引用了一些我尚未展示的辅助函数。我将在这里列出它们的代码，只是为了说明它们大部分都是一行代码。\n\n```\n\
    var find = function(where, done) {\nreturn function() {\nreturn models.users.find(where,\
    \ done);\n}\n};\nvar populate = function(what) {\nreturn function(query) {\nreturn\
    \ query.populate(what);\n};\n};\nvar execute = function(query, done) {\nreturn\
    \ query.exec(done);\n};\nvar findById = function(id) {\nreturn models.users.findById(id);\n\
    };\nvar findByIdAndUpdate = function(params, done) {\nreturn models.users.findByIdAndUpdate(params[0],\
    \ params[1], {new: true} ,done);\n};\nvar findByIdAndDelete = function(id, done)\
    \ {\nreturn models.users.findByIdAndRemove(id, done);\n};\nvar toJSONResponse\
    \ = function(data) {\nreturn this.customVars.httpResponse.json(data);\n};\nvar\
    \ callErrorHandler = function(err) {\nreturn this.customVars.next(err);\n};\n\
    ```\n\n这里值得注意的有趣之处在于，其中一些函数是如何从其 `this` 对象中提取属性的，尽管该对象从未在任何地方声明。这是因为传递给 `then`\
    \ 方法的所有函数的上下文，都会被其关联的 `Stream` 的属性所扩展。这意味着如果一个函数没有设置上下文，那么它将是 `Stream` 的上下文，这使得访问诸如\
    \ `customVars` 之类的属性变得容易，该属性包含了由 `setVars` 声明的额外变量。\n\n## 结论\n\n通过查看之前的代码（或本书提供的完整打包代码），你可以看到使用可观察流来处理\
    \ HTTP 传入流量是完全可行的。不仅如此，它还有助于控制代码的复杂性。\n\n中间件等功能也是可行的。我将在下一个示例中探讨这个问题。\n\n# 登录服务\n\
    \n能够登录到你的应用程序是另一个你可能以前就实现过的功能——事实上，如果你从事应用程序开发已经有一段时间，你已经多次实现过。我将探讨一个特定的例子，即使用\
    \ JSON Web Token 对 RESTful API 进行身份验证。\n\n通过这种方式，你将能够扩展前面的例子，添加身份验证端点，并最终通过为你为每个集合设置的转换链设置中间件来保护某些端点。\n\
    \n## 什么是 JSON Web Token？\n\n以防你好奇，让我快速回顾一下什么是 JSON Web Token（JWT）以及它将如何帮助你实现目标。\n\
    \nJWT ([`http://jwt.io`](http://jwt.io)) 是一个开放标准（你可以在 [`https://tools.ietf.org/html/rfc7519`](https://tools.ietf.org/html/rfc7519)\
    \ 找到其 RFC），它定义了一种在双方之间安全传输信息的方式。这是通过对传输的数据（在这种情况下，是从客户端发送到服务器的请求）进行数字签名来实现的。数据可以使用\
    \ HMAC 算法使用密钥短语进行签名，或者使用 RSA 使用私钥/公钥对进行签名。\n\n无论哪种方式，它都允许开发者针对 RESTful 服务验证其请求，因为它不需要他们维护被认证实体的任何状态。为了证实请求的真实性，使用先前在客户端和服务器之间约定的合约对签名令牌进行解码和验证。如果验证成功，则请求有效。\n\
    \n令牌本身是通过三个简单的步骤计算出来的：\n\n-   设置一个 JSON 头部，其中包含令牌类型（此例中为 JWT）和用于签名令牌的算法，如下例所示。然后将数据编码为\
    \ base 64。\n\n    ```\n    {\n    \"alg\": \"HS256\",\n    \"typ\": \"JWT\"\n\
    \    }\n    ```\n\n-   使用与请求相关的信息创建有效载荷，这通常是与用户相关的信息（因为这是所有请求中的常量部分）。然后使用 base\
    \ 64 编码此 JSON。\n\n    ```\n    {\n    \"name\": \"John Doe\",\n    \"isAdmin\"\
    : true\n    }\n    ```\n\n-   最后，通过连接此示例中的两个 base 64 字符串，并使用第一步中定义的算法对其进行签名来创建令牌。生成的令牌看起来像这样：\n\
    \n    ```\n    eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9 .eyJuYW1lIjoiUFdEIiwiaWF0IjoxNDY0NDQxMTc4LCJleHAiOjE0NjQ1Mjc1Nzh9.oc194WsEKcRe29FuUKS9XdvKpX72nt0NuN5FAUVicW4\n\
    \    ```\n\n以下是你如何使用 JWT 令牌为你的 API 提供安全性：\n\n-   用户向端点发出未经身份验证的请求，发送其凭据，以便针对系统进行身份验证。\n\
    -   API 检查凭据，如果有效，则生成一个 JWT 令牌并返回给用户。\n-   然后，用户将在任何后续请求中使用该令牌进行身份验证，而无需重新发送凭据。\n\
    -   如果系统能够验证令牌的真实性，则执行请求，否则返回错误响应。\n\n图 4-4 展示了在处理 JWT 时客户端和服务器之间的流程。\n\n![A418015_1_En_4_Fig4_HTML.jpg](img/A418015_1_En_4_Fig4_HTML.jpg)\n\
    \n图 4-4. 认证过程中的客户端-服务器交互\n"
- fmt: '### Back to the Code


    Let’s get back on track, shall we? Now that you understand how JWT-based authentication
    works, let’s see how you can implement that using traditional programming on the
    back-end, using `ExpressJS`. To generate and verify your tokens, you’ll use an
    NPM module called `jsonwebtoken` (available at [`https://www.npmjs.com/package/jsonwebtoken`](https://www.npmjs.com/package/jsonwebtoken)),
    which provides all the required functionality.


    For this implementation, I’ll extend the code from the previous example. All I
    need are two methods, one to handle the new token endpoint and one to handle the
    verification of the token on every request. I’ll use a middleware for the second
    code, since it’s the more reasonable approach.


    ```

    var router = require("express").Router();

    var jwt = require("jsonwebtoken");

    var models = require("./models-crud-api  ");

    var SECRET =  ''this is a secret phrase'';

    //Handle the new endpoint

    router.post(''/tokens'', function(req, res, next) {

    models.users.findOne({

    username: req.body.username,

    password: req.body.password

    })

    .then(function(usr) {

    if(!usr) {

    return next({error: true, msg: ''User not valid  ''});

    }

    var token = jwt.sign({

    name: usr.first_name,

    birth_date: usr.birth_date

    }, SECRET , {"expiresIn": "1 day "});

    res.json({

    token: token

    });

    })

    .catch(next);

    });

    ```


    > **Note:** The preceding code is handling user authentication in a very unsecure
    and poor way; it is meant to provide an example of how you could go about it,
    but it is highly recommended that you use a proper authentication technique (like
    SALTing your passwords). Also, please note that for this code to work, the username
    and password properties should be added to the user model.


    ```

    function check_token checkToken(req, res, next) {

    var token = req.query.token || req.headers.token;

    //we make sure the url required for requesting a token is not protected

    if(req.url.indexOf("/tokens") !== -1) return next();

    if(!token) {

    return next(''No token provided'');

    }

    jwt.verify(token, SECRET, function(err, decoded) {

    if(err) {

    return next(err);

    }

    next();

    });

    }

    module.exports = {

    router: router,

    checkToken: checkToken

    };

    ```


    On the preceding code, the endpoint function takes care of a simple validation
    of the user''s credentials; if they’re valid, then it’ll sign the token to be
    returned. Then the `checkToken` middleware takes care of securing the endpoints,
    with the exception of `/tokens` since you can’t really send a token before actually
    getting it from the system, can you?


    ### The Reactive Approach


    For the reactive version of this code, I’ll create the logic for the new endpoint,
    which, of course, will be a set of transformations over the stream, and I’ll also
    show you how to implement the token check as part of the transformations instead
    of using the middleware (which, in this case, because I’m keeping the main code
    intact, I can do).


    ```

    newTokens.data

    .setVars({''httpResponse'': get(1)})

    .then(get(0))

    .then(map(function(req) {

    return { username: req.body.username, password: req.body.password };

    }))

    .then(models.users.findOne.bind(models.users))

    .then(filterWithMessage({code: 404, msg: ''Invalid credentials''}, isNotEmpty))

    .then(function(usr) {

    return jwt.sign({

    name: usr.first_name,

    birth_date: usr.birth_date

    }, SECRET , {"expiresIn": "1 day "});

    })

    .then(map(function(t) { return { token: t }; }))

    .done(toJSONResponse)

    .catch(callErrorHandler);

    ```


    So the transformations are as follows:


    1. Map to get the login data from the request.

    2. Then it finds the user with that information.

    3. Filter out requests that don’t return a user from the previous point.

    4. Then sign the request with a token that will expire in one day.

    5. Turn the return object into a simpler json with only the token information.

    6. Print out the response back to the client.


    And like I did before, I’m going to take a look at the marble diagram in Figure
    [4-5](#A418015_1_En_4_Chapter.html#Fig5).


    ![A418015_1_En_4_Fig5_HTML.jpg](A418015_1_En_4_Fig5_HTML.jpg)


    **Figure 4-5.** Marble diagram for the reactive authentication logic


    Figure [4-5](#A418015_1_En_4_Chapter.html#Fig5) is not only showing the ideal
    path, where all credentials are valid, and there are no errors during the set
    of transformations, but it is also showing how some requests will be filtered
    out, due to them not having the right user credentials. The function used to filter
    out those requests is actually using a simple `filter` call, with some extra logic:


    ```

    var filterWithMessage = function(opts, fn) {

    var self = this;

    return function(data) {

    var fnFilter = filter(fn );

    if(fnFilter(data) !== null) {

    return data;

    } else {

    return self

    .customVars

    .httpResponse

    .status(opts.code)

    .json({error: true, msg: opts.msg});

    }

    };

    }

    ```


    Thanks to the little framework I’m using, which is modifying the context of the
    functions I set on the transformation chain, I can directly send the response
    back to the client from within this function like you can see in the `else` block
    from before.


    Finally, checking for the actual authenticity of the token received (if received)
    can be done like I did on the regular approach, simply with an `Express` middleware,
    but I can also add that logic as a couple of `filter` steps to the regular chain,
    and that would allow you to remain independent of the web framework you’re using
    and whether or not it has the middleware capability.


    That being said, here’s the code that you would have to add:


    ```

    list.data

    .setVars({''httpResponse'': get(1), ''next'': get(2)})

    .then(get(0))

    .then(filter(function(req) {

    var token = req.query.token || (req.body && req.body.token);

    return !!token;

    }))

    .then(filter(function(req, done ) {

    var token = req.query.token || (req.body && req.body.token);

    jwt.verify(token, SECRET, done);

    }))

    .then(find({}))

    .then(populate(''addresses''))

    .then(execute)

    .done(toJSONResponse)

    .catch(callErrorHandler);

    ```


    And here is the code for the `filter` function, as you can see, it provides two
    ways to be executed, depending on the number of parameters it receives.


    ```

    function filter(filterFn) {

    var fn = null;

    if(filterFn.length == 1) {

    fn = function(val) {

    if(filterFn(val)) {

    return val;

    }

    return null;

    };

    } else {

    fn = function(val, done) {

    filterFn(val, function(err) {

    if(err) {

    return done(err);

    }

    return done();

    });

    };

    }

    fn.__type = ''filter'';

    return fn;

    }

    ```


    The bolded code on the reactive example is what I added, and you can see how I
    simply added the two checks I had on our middleware from the classic approach,
    whether or not the token is provided, and then whether or not it is valid. The
    catch, here, is that even though the request might get filtered, it needs to provide
    a response to the client, so the request can be closed and the user can understand
    what’s wrong with it. In order to do that, the `filter` function actually calls
    the function you set using the `done` method, assuming it’s the last function
    you want to execute on every transformation.


    If that doesn’t sound too good, there is a second approach, with a fake `filter`
    like I did before:


    ```

    list.data

    .setVars({''httpResponse'': get(1), ''next'': get(2)})

    .then(get(0))

    .then(filterWithMessage({code: 401, msg: ''no token provided''}, function(req)
    {

    var token = req.query.token || (req.body && req.body.token);

    return !!token;

    }))

    .then(filterWithMessage({code: 401, msg: ''unauthorized request''}, function(req,
    done) {

    var token = req.query.token || (req.body && req.body.token);

    jwt.verify(token, SECRET, done);

    }))

    .then(find({}))

    .then(populate(''addresses''))

    .then(execute)

    .done(toJSONResponse)

    .catch(callErrorHandler);

    ```'
