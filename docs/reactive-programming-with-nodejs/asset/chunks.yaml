    \ JavaScript）与之非常契合。网络上针对前端环境的相关文章很多，但遗憾的是，后端领域却没有得到同等的关注。\n\n得益于 Node.js，我们现在在服务器端拥有了一个非常相似的环境，这使得开发者能够以前端开发者在日常工作中使用该技术时的相同方式，来思考响应式编程（甚至函数式响应式编程）。\n\
