    \ new Date()\n  };\n}\n```\n\n## 客户端\n\n本示例中的客户端应用程序也将非常简单。它允许用户登录聊天室、发送消息和命令，同时也能接收来自服务器的消息（如果你愿意，也可以称之为系统消息），其中包含错误通知、命令响应等——基本上就是任何非来自其他客户端的消息。\n\
    \n为了实现上述功能，这次我使用了三个流。一个流负责处理用户输入，这些输入将转换为发送到服务器的消息和命令。另一个流用于处理系统消息，还有一个流用于处理其他用户发送的消息。\n\
    \n输入流很有意思，因为在 Node.js 中，标准输入被表示为一个流，因此你可以从中创建一个 Cheese 流，这极大地简化了从用户收集输入的过程（这原本可能有些复杂）。代码如下：\n\
    \n`client.js`\n\n```\nvar rChees  = require(\"../cheese\");\nvar Cheese  = rChees.Cheese;\n\
    var Utils   = rChees.Utils;\nvar logger  = require(\"./logger\");\nvar map   \
    \  = Utils.map,\n    reduce  = Utils.reduce,\n    takeUntil = Utils.takeUntil,\n\
    \    take    = Utils.take\n\nvar socket = require('socket.io-client')('http://localhost:3000');\n\
    var _USERNAME = null;\n\nprocess.stdin.resume();\nprocess.stdin.setEncoding('utf8');\n\
    \nvar userLoggedIn = false;\n\nvar input = new Cheese(); //从 stdin 获取用户输入\n\n\
    console.log(\"请输入您的用户名: \");\n\nsocket.on('connect', function(){\n  input\n  \
    \  .fromStream(process.stdin)\n    .then(trim)\n    .then(map(toObject))\n   \
    \ .onError(function(err) {\n      console.trace(\"错误:\" , err)\n    })\n    .each(send);\n\
    });\n```\n\n基本上，在连接到聊天服务器之后，会立即开始监听 stdin 事件，幸运的是，当按下 ENTER 键时会触发这些事件。因此，这个流接收到的每个数据块都是用户输入的一行内容。之后，你会修剪它，将其转换为聊天服务器能够识别的对象格式，然后发送出去。`toObject`\
    \ 函数也是一个有趣的函数，因为它负责发送正确的数据。这可能是一条简单的消息、一个命令，甚至是通过网络发送的登录操作的输入。\n\n```\n///辅助函数\n\
    function printMessage(type) {\n  if(!type) type = 'info';\n  return function(str)\
    \ {\n    loggertype);\n  }\n}\n\nfunction send(str) {\n  var msgObj = MsgParser(JSON.parse(str.toString()),\
    \ socket)\n  msgObj.send();\n}\n\nfunction toObject(str, done) {\n  str = str.toString();\n\
    \  var obj = null;\n  if(_USERNAME) {\n    obj = createMsgObj(str, _USERNAME)\n\
    \  } else {\n    obj = createLoginObj(str);\n  }\n  done(null, JSON.stringify(obj));\n\
    }\n\nfunction newCommand(str, username) {\n  var parts = str.split(\" \");\n \
    \ return {\n    type: 'new_cmd',\n    cmd: parts[0].replace(\"/\", \"\"),\n  \
    \  args: parts.slice(1),\n    username: username,\n    date: new Date()\n  };\n\
    }\n\nfunction createMsgObj(inputStr, username) {\n  if(inputStr.charAt(0) == '/')\
    \ {\n    return newCommand(inputStr, username);\n  } else {\n    return {\n  \
    \    type: 'new_msg',\n      msg: inputStr,\n      date: new Date(),\n      username:\
    \ username\n    };\n  }\n}\n\nfunction createLoginObj(newUserName) {\n  _USERNAME\
    \ = newUserName;\n  return {\n    type: 'login',\n    username: newUserName,\n\
    \    date: new Date()\n  };\n}\n\n/*\n为 JSON 对象添加一个方法，使其知道如何通过套接字连接发送自身\n*/\n\
    function MsgParser(msgObj, socket) {\n  msgObj.send = function() {\n    socket.emit(msgObj.type,\
    \ msgObj);\n  };\n  return msgObj;\n}\n\nfunction trim(str) {\n  return str.toString().trim();\n\
    }\n```\n\n同样，一组专注于特定任务的小函数使得在需要时修改和扩展变得非常容易。\n\n另外两个流（系统消息流和用户消息流）非常相似。它们的区别在于数据格式化的方式和打印输出的方式。请看：\n\
    \n```\nvar newMsgListener = false;\nvar newUserMsgListener = false;\n\nvar rcvdSystemMsgs\
    \ = new Cheese(); //用于捕获系统通知的流\nvar userMsgs = new Cheese(); //用于捕获其他用户消息的流\n\n\
    rcvdSystemMsgs\n  .fromFn(newSystemMessage)\n  .then(map(function(msg, done) {\n\
    \    msg = JSON.parse(msg.toString());\n    done(null, [msg.date, msg.msg].join('::'));\n\
    \  }))\n  .each(printMessage('system'));\n\nuserMsgs\n  .fromFn(newUserMessage)\n\
    \  .then(map(function(msg, done) {\n    msg = JSON.parse(msg.toString());\n  \
    \  done(null, [msg.username, \"(\", msg.date, \") - \", msg.msg].join(' '));\n\
    \  }))\n  .each(printMessage());\n\nfunction newSystemMessage(push) {\n  if(!newMsgListener)\
    \ {\n    logger.debug(\"已设置新消息监听器...\")\n    socket.on('system_msg', function(sm)\
    \ {\n      push(JSON.stringify(sm));\n    });\n    newMsgListener = true;\n  }\n\
    }\n\nfunction newUserMessage(push) {\n  if(!newUserMsgListener) {\n    logger.debug(\"\
    已设置新用户消息监听器...\")\n    socket.on('new_msg', function(sm) {\n      push(JSON.stringify(sm));\n\
    \    });\n    newUserMsgListener = true;\n  }\n}\n```\n\n正如你在前面的代码中所看到的，并没有什么特别之处。使用监听器函数将事件送入每个流，就像在服务器代码中一样，每个流只负责格式化数据并以正确的方式输出。仅此而已！\n\
    \n为了处理断开连接的事件，使用了以下代码。它只是打印一条消息并关闭应用程序：\n\n```\nsocket.on('disconnect', function(){\n\
    \  logger.info(\"您与服务器的连接已关闭！再见！\");\n  process.exit(0);\n});\n```\n"
- fmt: "# Summary\n\nWell, you’re almost done with the book, just one more chapter\
    \ left to go! With this chapter, you’ve learned not only that socket-based reactive\
    \ code is possible and looks great but also that big companies are moving away\
    \ from the more traditional programming paradigms and into the reactive one. This\
    \ allows them to improve their dev time, essentially lowering their time-to-market,\
    \ and it provides them with the tools required to create easy-to-maintain, scalable\
    \ systems.\n\nIn the next and final chapter, I’m going to cover the basics of\
    \ how to structure the reactive architecture of your systems, mixed with some\
    \ tips that will come in handy when trying to scale up a Node.js application.\n\
    \n# 9. Scaling Your Reactively Programmed Systems\n\nCongrats! You made it to\
    \ the final chapter of the book! So far you’ve received all the necessary information\
    \ to add functional reactive logic on your Node.js applications, but the truth\
    \ is, all of the examples I’ve showed you so far have been simplified to make\
    \ them fit into the book in a format that would not bore you to death if you wanted\
    \ to actually read the code. Real world applications, the ones that are actually\
    \ out in production, ready for the end-users to access it, need to take other\
    \ things into consideration. In some cases when the expected number of users is\
    \ ever-growing, they need to be able to scale up to address the increasing demand.\n\
    \nScaling up a Node.js application is actually quite simple, especially if you\
    \ plan for it in advance and structure your system’s architecture properly. In\
    \ this chapter, I’m going to cover some of the basics behind scaling Node.js applications\
    \ and specially, reactive systems written in Node.js. So, stay tuned and enjoy\
    \ the final chapter of the book!\n\n## Scaling Node.js\n\nThe single-threaded\
    \ architecture of Node.js sometimes tends to confuse people into thinking that\
    \ it can’t really scale up inside one single server. But the truth is, that in\
    \ fact, that single-threaded model simplifies the task of scaling inside a single\
    \ server, let’s look into that shall we?\n\n> **Note**  \n> Scaling up into several\
    \ servers is quite simple as well, but it is not dependent on the threading model.\
    \ Instead, it depends on the architectural decisions you take. I’ll talk about\
    \ those in a minute too.\n\n### Scaling Inside Your Server\n\nThe first stage\
    \ when it comes to scaling, takes place inside the server, your single-threaded\
    \ application, if executed normally (meaning, without the help of any external\
    \ program, only with the default Node interpreter) then no matter how powerful\
    \ your processor is, and how many cores it has, you’re only using one of them.\n\
    \nI know right! Shocker, but by default, you’re not taking full advantage of whatever\
    \ beast you have for a processor. Fear not though! There are two seemingly different\
    \ ways to accomplish this, and it all depends on what kind of application you’re\
    \ dealing with. I say “seemingly” though, because at the core of both of them,\
    \ we’re dealing with the same thing: processes.\n\nBasically, in order to scale\
    \ on multi-core processor computers, you need multiple processes, that’s it. If\
    \ you’re dealing with your basic calculation intensive app, you’ll probably want\
    \ to spread said calculation between different workers, which basically are processes\
    \ working in parallel and communicating with each other through some kind of protocol\
    \ (I’ll talk more about this further down the chapter, don’t worry).\n\nIf, on\
    \ the other hand, you have your basic webservice application, and you want to\
    \ make sure those services are getting the power of the entire processor, then\
    \ you can use the `cluster` ( [`https://nodejs.org/api/cluster.html`](https://nodejs.org/api/cluster.html)\
    \ ) module, which comes included with your Node.js installation. This module allows\
    \ you to easily create copies of your application to run in parallel, each one\
    \ on a different CPU core. Here’s all the code you’ll need to do just that:\n\n\
    ```\nvar cluster = require('cluster');\nvar http = require('http');\nvar numCPUs\
    \ = require('os').cpus().length;\nif (cluster.isMaster) {\n// Fork workers.\n\
    for (var i = 0; i < numCPUs; i++) {\ncluster.fork();\n}\ncluster.on('exit', function\
    \ (worker, code, signal) {\nconsole.log(\"Worker\",worker.process.pid, \"died\"\
    );\n});\n} else {\nhttp.createServer(function(req, res){\nres.writeHead(200);\n\
    res.end('hello world\\n');\nprocess.exit(0);\n}).listen(8000, function() {\nconsole.log(\"\
    Server Ready!\")\n});\n}\n```\n\nIf you execute that code, once all servers are\
    \ up and running, you’ll see as many copies of the message “Server Ready!” as\
    \ CPU cores you have. And if you visit your localhost at port 8000, you’ll see\
    \ on the console, how some of the workers start to die every time you hit the\
    \ refresh button.\n\n> **Note**  \n> Even though the preceding code makes sure\
    \ to only spawn as many processes as cores are on your CPU, you can change that\
    \ number to anything you need. Set it high enough though, and you'll start getting\
    \ negative performance results of course.\n\nOne of the main take-aways from the\
    \ code shown before, aside from the simplicity of it, is that because workers\
    \ can share TCP connections, you only need to code one single server, with no\
    \ special considerations to the multiple instances you’ll have running, and then\
    \ simply start spawning new workers. You could potentially turn your already coded\
    \ API into a multi-process application with the preceding code, and it would all\
    \ still work!\n\nAll worker processes are handled by the main process (their parent),\
    \ and that’s the one that takes care of distributing the workload between all\
    \ of them. In all operating systems (except for Windows) the default way of doing\
    \ that is by distributing the load in a round robin fashion. In the case of Windows,\
    \ the balancing is left to the Operating System."
  raw: '## Summary


    Well, you’re almost done with the book, just one more chapter left to go! With
    this chapter, you’ve learned not only that socket-based reactive code is possible
    and looks great but also that big companies are moving away from the more traditional
    programming paradigms and into the reactive one. This allows them to improve their
    dev time, essentially lowering their time-to-market, and it provides them with
    the tools required to create easy-to-maintain, scalable systems.


    In the next and final chapter, I’m going to cover the basics of how to structure
    the reactive architecture of your systems, mixed with some tips that will come
    in handy when trying to scale up a Node.js application.


    # 9. Scaling Your Reactively Programmed Systems


    Congrats! You made it to the final chapter of the book! So far you’ve received
    all the necessary information to add functional reactive logic on your Node.js
    applications, but the truth is, all of the examples I’ve showed you so far have
    been simplified to make them fit into the book in a format that would not bore
    you to death if you wanted to actually read the code. Real world applications,
    the ones that are actually out in production, ready for the end-users to access
    it, need to take other things into consideration. In some cases when the expected
    number of users is ever-growing, they need to be able to scale up to address the
    increasing demand.


    Scaling up a Node.js application is actually quite simple, especially if you plan
    for it in advance and structure your system’s architecture properly. In this chapter,
    I’m going to cover some of the basics behind scaling Node.js applications and
    specially, reactive systems written in Node.js. So, stay tuned and enjoy the final
    chapter of the book!


    ## Scaling Node.js


    The single-threaded architecture of Node.js sometimes tends to confuse people
    into thinking that it can’t really scale up inside one single server. But the
    truth is, that in fact, that single-threaded model simplifies the task of scaling
    inside a single server, let’s look into that shall we?


    Note


    Scaling up into several servers is quite simple as well, but it is not dependent
    on the threading model. Instead, it depends on the architectural decisions you
    take. I’ll talk about those in a minute too.


    ### Scaling Inside Your Server


    The first stage when it comes to scaling, takes place inside the server, your
    single-threaded application, if executed normally (meaning, without the help of
    any external program, only with the default Node interpreter) then no matter how
    powerful your processor is, and how many cores it has, you’re only using one of
    them.


    I know right! Shocker, but by default, you’re not taking full advantage of whatever
    beast you have for a processor. Fear not though! There are two seemingly different
    ways to accomplish this, and it all depends on what kind of application you’re
    dealing with. I say “seemingly” though, because at the core of both of them, we’re
    dealing with the same thing: processes.


    Basically, in order to scale on multi-core processor computers , you need multiple
    processes, that’s it. If you’re dealing with your basic calculation intensive
    app, you’ll probably want to spread said calculation between different workers,
    which basically are processes working in parallel and communicating with each
    other through some kind of protocol (I’ll talk more about this further down the
    chapter, don’t worry).


    If, on the other hand, you have your basic webservice application , and you want
    to make sure those services are getting the power of the entire processor, then
    you can use the `cluster(` [`https://nodejs.org/api/cluster.html`](https://nodejs.org/api/cluster.html)
    `)` module, which comes included with your Node.js installation. This module allows
    you to easily create copies of your application to run in parallel, each one on
    a different CPU core. Here’s all the code you’ll need to do just that:


    ```

    var cluster = require(''cluster'');

    var http = require(''http'');

    var numCPUs = require(''os'').cpus().length;

    if (cluster.isMaster) {

    // Fork workers.

    for (var i = 0; i < numCPUs; i++) {

    cluster.fork();

    }

    cluster.on(''exit'', function (worker, code, signal) {

    console.log("Worker",worker.process.pid, "died");

    });

    } else {

    http.createServer(function(req, res){

    res.writeHead(200);

    res.end(''hello world\n'');

    process.exit(0);

    }).listen(8000, function() {

    console.log("Server Ready!")

    });

    }

    ```


    If you execute that code , once all servers are up and running, you’ll see as
    many copies of the message “Server Ready!” as CPU cores you have. And if you visit
    your localhost at port 8000, you’ll see on the console, how some of the workers
    start to die every time you hit the refresh button.


    Note


    Even though the preceding code makes sure to only spawn as many processes as cores
    are on your CPU, you can change that number to anything you need. Set it high
    enough though, and you''ll start getting negative performance results of course.


    One of the main take-aways from the code shown before, aside from the simplicity
    of it, is that because workers can share TCP connections, you only need to code
    one single server, with no special considerations to the multiple instances you’ll
    have running, and the simply start spawning new workers. You could potentially
    turn your already coded API into a multi-process application with the preceding
    code, and it would all still work!


    All worker processes are handled by the main process (their parent), and that’s
    the one that takes care of distributing the workload between all of them. In all
    operating systems (except for Windows) the default way of doing that is by distributing
    the load in a round robin fashion. In the case of Windows, the balancing is left
    to the Operating System.'
  trans: "\n# 总结\n\n好了，你已经快读完这本书了，只剩下最后一章！通过这一章，你不仅了解到基于套接字的响应式代码是可行的，而且看起来很不错，还了解到大公司正在从传统编程范式转向响应式编程范式。这让他们能够缩短开发时间，从而加快产品上市速度，并且为他们提供了创建易于维护、可扩展系统所需的工具。\n\
    \n在下一章也是最后一章中，我将介绍如何构建系统响应式架构的基础知识，同时还会分享一些在扩展 Node.js 应用时会派上用场的技巧。\n\n# 9. 扩展你的响应式编程系统\n\
    \n恭喜！你读到了本书的最后一章！到目前为止，你已经掌握了在 Node.js 应用中添加函数式响应逻辑所需的所有必要信息，但事实上，我目前展示的所有示例都经过了简化，以便在书中呈现，让你在阅读代码时不至于感到枯燥。实际的应用——那些已经投入生产、可供最终用户访问的应用——还需要考虑其他因素。在某些情况下，当预期用户数量不断增长时，应用需要能够进行扩展以应对日益增长的需求。\n\
    \n扩展 Node.js 应用实际上相当简单，特别是如果你提前做好规划，并合理构建系统架构的话。在本章中，我将介绍扩展 Node.js 应用（特别是用 Node.js\
    \ 编写的响应式系统）的一些基础知识。那么，请继续阅读，享受本书的最后一章吧！\n\n## 扩展 Node.js\n\nNode.js 的单线程架构有时会让人们误以为它无法在单台服务器内进行扩展。但事实上，这种单线程模型反而简化了在单台服务器内进行扩展的任务，让我们来看看这是为什么吧？\n\
    \n> **注**  \n> 扩展到多台服务器也同样简单，但这并不依赖于线程模型，而是取决于你所做的架构决策。我稍后会谈到这些。\n\n### 在服务器内进行扩展\n\
    \n扩展的第一阶段发生在服务器内部。默认情况下，如果你的单线程应用是正常运行的（即没有借助任何外部程序，仅使用默认的 Node 解释器），那么无论你的处理器有多强大、有多少个核心，你都只使用了其中一个。\n\
    \n我知道这很令人震惊！但默认情况下，你并没有充分利用你那强大的处理器。不过别担心！有两种看似不同的方法可以解决这个问题，具体取决于你所处理的应用类型。我之所以说“看似”，是因为这两种方法的核心都是同一个东西：进程。\n\
    \n基本上，为了在多核处理器计算机上进行扩展，你需要多个进程。就是这样。如果你正在处理一个计算密集型应用，你可能会希望将计算任务分发给不同的工作进程，这些工作进程本质上是并行工作的，并通过某种协议相互通信（别担心，我将在本章后面进一步讨论这一点）。\n\
    \n另一方面，如果你有一个基本的 Web 服务应用，并且希望确保这些服务能够充分利用整个处理器的性能，那么你可以使用 Node.js 自带的 `cluster`（[`https://nodejs.org/api/cluster.html`](https://nodejs.org/api/cluster.html)\
    \ ）模块。这个模块可以让你轻松创建应用的多个副本并行运行，每个副本运行在不同的 CPU 核心上。以下是实现这一功能所需的全部代码：\n\n```\nvar\
    \ cluster = require('cluster');\nvar http = require('http');\nvar numCPUs = require('os').cpus().length;\n\
    if (cluster.isMaster) {\n// Fork workers.\nfor (var i = 0; i < numCPUs; i++) {\n\
    cluster.fork();\n}\ncluster.on('exit', function (worker, code, signal) {\nconsole.log(\"\
    Worker\",worker.process.pid, \"died\");\n});\n} else {\nhttp.createServer(function(req,\
    \ res){\nres.writeHead(200);\nres.end('hello world\\n');\nprocess.exit(0);\n}).listen(8000,\
    \ function() {\nconsole.log(\"Server Ready!\")\n});\n}\n```\n\n如果你执行这段代码，当所有服务器启动并运行后，你会看到与\
    \ CPU 核心数量相同的“Server Ready!”消息副本。如果你访问本地主机的 8000 端口，你会在控制台中看到，每次你点击刷新按钮时，一些工作进程就会终止。\n\
    \n> **注**  \n> 尽管上述代码确保只生成与 CPU 核心数相同数量的进程，但你可以根据需要更改这个数字。不过，如果设置得过高，当然就会开始出现负面的性能表现。\n\
    \n除了简单之外，上述代码的一个主要启示是：由于工作进程可以共享 TCP 连接，你只需编写一个服务器代码，无需特别考虑你将要运行的多个实例，然后简单地启动新的工作进程即可。你可以使用上述代码将你已有的\
    \ API 转换为多进程应用，而且一切仍然可以正常工作！\n\n所有工作进程都由主进程（它们的父进程）管理，主进程负责在所有工作进程之间分配工作负载。在所有操作系统（Windows\
    \ 除外）中，默认的分配方式是轮询分发负载。在 Windows 系统中，负载平衡则由操作系统本身负责。\n"
- fmt: "### Using an External Tool to Handle your Clustering Needs\n\nThe solution\
    \ I showed before works, you can try it out and see the results, but if you go\
    \ with it for your system, you might start to notice you’re having to manually\
    \ tackle some issues, like:\n\n- Restarting dead workers. If for some reason,\
    \ your workers start to crash, the cluster module will not take care of restarting\
    \ them for you, you’ll have to handle those particular cases by yourself.\n- Elastic\
    \ scaling. This is a particular interesting one, especially when you’re running\
    \ on pay-as-you-use servers, like Amazon’s. How can you optimize the amount of\
    \ workers based on your needs?\n- What about monitoring? Checking the state of\
    \ your workers is also something you don’t get out of the box with the default\
    \ module, but it might be something you need on a production environment.\n\n\
    So to answer the listed needs and more, you can use external tools that simplify\
    \ the clustering process, in particular, I’m going to briefly go over one such\
    \ tool called PM2 (`http://pm2.keymetrics.io/`).\n\nFirst things first, the main\
    \ benefit from PM2 is that you don’t need any code added to your already existing\
    \ app in order to make it work with multiple copies of the same process. Yes,\
    \ the example from before showed that very little code is indeed needed, but even\
    \ so, the added benefits of PM2 make it worth your while as well. So, to install\
    \ it, you simply do:\n\n```\n$ npm install pm2 -g\n```\n\nAnd to start up your\
    \ application with four instances in parallel, just use the following command:\n\
    \n```\n$ pm2 start app.js -i 4\n```\n\n**Tip**  \nIf you want to be sure PM2 starts\
    \ as many workers as cores on your CPU, simply change that `4` with a `0`.\n\n\
    Figure [9-1](#A418015_1_En_9_Chapter.html#Fig1) shows the output from PM2 after\
    \ starting a simple webserver script, with `0` instances, in my case, my processor\
    \ has 4 cores, so I have 4 processes listed. The columns on the table are quite\
    \ self explanatory, the watching column indicates whether the process will be\
    \ restarted or not when a file changes and in order to enable it, you have to\
    \ pass in the `--watch` flag.\n\n![A418015_1_En_9_Fig1_HTML.jpg](A418015_1_En_9_Fig1_HTML.jpg)\n\
    \n**Figure 9-1.** PM2 after being started\n\nNow asides from the nice list of\
    \ processes, you can rest assured, that if one of them is killed, PM2 will take\
    \ care of restarting it, so accidental crashes will not stick.\n\nYou can also\
    \ restart the entire cluster manually, with the `restart` command:\n\n```\n$ pm2\
    \ restart all\n```\n\nAnd, more interestingly, you can grow and shrink your cluster\
    \ dynamically with the `scale` command. Passing in a number will scale (up or\
    \ down) your cluster to have that many processes, prefixing the number with a\
    \ `+` sign, will add that many processes:\n\n```\n$ pm2 scale webserver +3 #add\
    \ 3 processes to the clustering\n$ pm2 scale webserver 1 #downsize the cluster\
    \ to only 1 process\n```\n\nFinally, one last, very nice gem, one that can help\
    \ you update your code on production environments. You see, PM2 enables you to\
    \ update your code without any downtime. It does it by restarting the processes\
    \ one by one, and waiting for one to be fully up before restarting the next one,\
    \ that way the cluster updates itself gradually. For this you can either use the\
    \ `reload` command or the `gracefulReload` one, which instead of forcefully killing\
    \ the cluster processes, it sends a shutdown signal allowing the process to gracefully\
    \ do so.\n\n```\n$ pm2 reload webservice #kills the processes forcefully\n$ pm2\
    \ gracefulReload webservice #sends a shutdown signal to them\n```\n\nYou can catch\
    \ the signal with the following block of code, and do whatever you need then:\n\
    \n```\nprocess.on('message', function(msg) {\n  if (msg === 'shutdown') {\n  \
    \  close_all_connections();\n    delete_cache();\n    server.close();\n    process.exit(0);\n\
    \  }\n});\n```\n\nAs you can see, PM2 can be a very handy tool to have on your…\
    \ production belt, if you will, it packs a very big punch full of useful features\
    \ and it’s super easy to use. But then again, it’s not like it’s your clustering\
    \ silver bullet (there is no such a thing by the way, never), you’ll eventually\
    \ run into some cases where classic clustering does not solve your problems, so\
    \ what do you then? Let’s find out!\n\n### What About Multiprocessing Without\
    \ Clustering?\n\nSo what happens when the `cluster` module is not enough? What\
    \ happens when the solution is not that simple? Like I mentioned before, multiprocessing\
    \ is still the answer, make no mistake, if you want to get the most out of your\
    \ processor, you’ll need to work on splitting up your logic into several Node.js\
    \ processes that can run in parallel, that will ensure you’re using all cores.\n\
    \nBasically you go for a microservices approach, splitting your logic into smaller\
    \ pieces that can work in parallel, so in other words, the more your business\
    \ logic allows you to parallelize its tasks, the more you’ll be able to make out\
    \ of the architecture.\n\nThe upside to this approach, is that if your server\
    \ starts to fall short, you can always migrate to a multi-server architecture\
    \ with minor effort, because the code structure stays basically the same, you\
    \ only need to handle the inter-server communication (dealing with networking\
    \ issues like firewalls, enabling the right ports, and so on).\n\nAs you can probably\
    \ imagine, there is no magic recipe for this particular scenario, you simply figure\
    \ out a way to map your logic into a set of parallel processes (let’s call them\
    \ workers from now on, since that’s what they’ll be doing anyways), and if you\
    \ can have several copies of each worker, even better. Now, normally, for this\
    \ type of setups, the crucial part is not how you spawn new workers, but how you\
    \ handle the communication between them, because you’ll most likely want them\
    \ to send data between different types of workers and eventually save that data\
    \ (the final output) someplace you can use it. And here is where we talk a bit\
    \ about the best options for IPC (Inter-Process-Communication in Node.js)."
  raw: '### Using an External Tool to Handle your Clustering Needs


    The solution I showed before works, you can try it out and see the results, but
    if you go with it for your system, you might start to notice you’re having to
    manually tackle some issues, like:


    *   Restarting dead workers. If for some reason, your workers start to crash,
    the cluster module will not take care of restarting them for you, you’ll have
    to handle those particular cases by yourself.

    *   Elastic scaling. This is a particular interesting one, especially when you’re
    running on pay-as-you-use servers, like Amazon’s. How can you optimize the amount
    of workers based on your needs?

    *   What about monitoring? Checking the state of your workers is also something
    you don’t get out of the box with the default module, but it might be something
    you need on a production environment.


    So to answer the listed needs and more, you can use external tools that simplify
    the clustering process, in particular, I’m going to briefly go over one such tool
    called PM2 ( [`http://pm2.keymetrics.io/`](http://pm2.keymetrics.io/) ).


    First things first , the main benefit from PM2 is that you don’t need any code
    added to your already existing app in order to make it work with multiple copies
    of the same process. Yes, the example from before showed that very little code
    is indeed needed, but even so, the added benefits of PM2 make it worth your while
    as well. So, to install it, you simply do:


    ```

    $ npm install pm2 -g

    ```


    And to start up your application with four instances in parallel, just use the
    following command:


    ```

    $ pm2 start app.js -i 4

    ```


    Tip


    If you want to be sure PM2 starts as many workers as cores on your CPU, simply
    change that 4 with a 0.


    Figure [9-1](#A418015_1_En_9_Chapter.html#Fig1) shows the output from PM2 after
    starting a simple webserver script, with 0 instances, in my case, my processor
    has 4 cores, so I have 4 processes listed. The columns on the table are quite
    self explanatory, the watching column indicates whether the process will be restarted
    or not when a file changes and in order to enable it, you have to pass in the
    `--` `watch` flag.


    ![A418015_1_En_9_Fig1_HTML.jpg](A418015_1_En_9_Fig1_HTML.jpg)


    Figure 9-1.


    PM2 after being started


    Now asides from the nice list of processes, you can rest assured, that if one
    of them is killed, PM2 will take care of restarting it, so accidental crashes
    will not stick.


    You can also restart the entire cluster manually, with the restart command:


    ```

    $ pm2 restart all

    ```


    And, more interestingly, you can grow and shrink your cluster dynamically with
    the scale command. Passing in a number will scale (up or down) your cluster to
    have that many processes, prefixing the number with a + sign, will add that many
    processes:


    ```

    $ pm2 scale webserver +3 #add 3 processes to the clustering

    $ pm2 scale webserver 1 #downsize the cluster to only 1 process

    ```


    Finally, one last, very nice gem , one that can help you update your code on production
    environments. You see, PM2 enables you to update your code without any downtime.
    It does it by restarting the processes one by one, and waiting for one to be fully
    up before restarting the next one, that way the cluster updates itself gradually.
    For this you can either use the `reload` command or the `gracefulReload` one,
    which instead of forcefully killing the cluster processes, it sends a shutdown
    signal allowing the process to gracefully do so.


    ```

    $ pm2 reload webservice #kills the processes forcefully

    $ pm2 gracefulReload webservice #sends a shutdown signal to them

    ```


    You can catch the signal with the following block of code, and do whatever you
    need then:


    ```

    process.on(''message'', function(msg) {

    if (msg === ''shutdown'') {

    close_all_connections();

    delete_cache();

    server.close();

    process.exit(0);

    }

    });

    ```


    As you can see, PM2 can be a very handy tool to have on your… production belt,
    if you will, it packs a very big punch full of useful features and it’s super
    easy to use. But then again, it’s not like it’s your clustering silver bullet
    (there is no such a thing by the way, never), you’ll eventually run into some
    cases where classic clustering does not solve your problems, so what do you then?
    Let’s find out!


    ### What About Multiprocessing Without Clustering ?


    So what happens when the `cluster` module is not enough? What happens when the
    solution is not that simple? Like I mentioned before, multiprocessing is still
    the answer, make no mistake, if you want to get the most out of your processor,
    you’ll need to work on splitting up your logic into several Node.js processes
    that can run in parallel, that will ensure you’re using all cores.


    Basically you go for a microservices approach, splitting your logic into smaller
    pieces that can work in parallel, so in other words, the more your business logic
    allows you to parallelize it’s tasks, the more you’ll be able make out of the
    architecture.


    The upside to this approach, is that if your server starts to fall short , you
    can always migrate to a multi-server architecture with minor effort, because the
    code structure stays basically the same, you only need to handle the inter-server
    communication (dealing with networking issues like firewalls, enabling the right
    ports, and so on).


    As you can probably imagine, there is no magic recipe for this particular scenario,
    you simply figure out a way to map your logic into a set of parallel processes
    (let’s call them workers from now one, since that’s what they’ll be doing anyways),
    and if you can have several copies of each worker, even better. Now, normally,
    for this type of setups, the crucial part is not how you spawn new workers, but
    how you handle the communication between them, because you’ll most like want them
    to send data between different types of workers and eventually save that data
    (the final output) someplace you can use it. And here is were we talk a bit about
    the best options for IPC (Inter-Process-Communication in Node.js).'
  trans: "\n### 使用外部工具满足您的集群需求\n\n我之前展示的方案确实可行，您可以尝试并查看结果，但如果将其用于实际系统，您可能会开始注意到需要手动处理一些问题，例如：\n\
    \n-   重启已停止的工作进程。如果由于某些原因，您的工作进程开始崩溃，集群模块不会自动为您重启它们，您必须自行处理这些特殊情况。\n-   弹性伸缩。这一点尤其有趣，特别是当您在按需付费的服务器（如亚马逊云）上运行时。如何根据您的需求优化工作进程数量？\n\
    -   监控问题呢？默认模块不会为您提供开箱即用的检查工作进程状态的功能，但这在生产环境中可能是您需要的。\n\n因此，为了满足上述需求及更多场景，您可以使用外部工具来简化集群管理过程。具体来说，我将简要介绍一个名为\
    \ PM2 的工具（`http://pm2.keymetrics.io/`）。\n\n首先，PM2 的主要好处是，您无需向现有应用程序添加任何代码，即可使其在同一个进程的多个副本下运行。是的，之前的示例已经表明确实只需要很少的代码，即便如此，PM2\
    \ 的附加功能也值得您投入时间。那么，安装它只需执行：\n\n```\n$ npm install pm2 -g\n```\n\n要并行启动四个应用实例，只需使用以下命令：\n\
    \n```\n$ pm2 start app.js -i 4\n```\n\n**提示**  \n如果您希望 PM2 启动与 CPU 核心数相同的工作进程，只需将\
    \ `4` 替换为 `0`。\n\n图 9-1 显示了启动一个简单的 Web 服务器脚本后，使用 `0` 实例时 PM2 的输出。在我的案例中，我的处理器有\
    \ 4 个核心，所以列出了 4 个进程。表中的列名不言自明，“监控”列指示当文件发生更改时进程是否会重启，要启用此功能，您需要传入 `--watch` 标志。\n\
    \n![A418015_1_En_9_Fig1_HTML.jpg](img/A418015_1_En_9_Fig1_HTML.jpg)\n\n**图 9-1.**\
    \ 启动后的 PM2\n\n现在，除了清晰的进程列表，您可以放心，如果其中一个进程被终止，PM2 会负责重启它，因此意外崩溃不会持续存在。\n\n您还可以使用\
    \ `restart` 命令手动重启整个集群：\n\n```\n$ pm2 restart all\n```\n\n更有趣的是，您可以使用 `scale`\
    \ 命令动态扩展或缩减集群。传入一个数字会将集群扩展（或缩减）到具有该数量进程；在数字前加上 `+` 号，则会增加相应数量的进程：\n\n```\n$ pm2\
    \ scale webserver +3 # 向集群添加 3 个进程\n$ pm2 scale webserver 1 # 将集群缩减到只有 1 个进程\n\
    ```\n\n最后，还有一个非常实用的功能，可以帮助您在生产环境中更新代码。您看，PM2 允许您在不造成任何停机的情况下更新代码。它通过逐个重启进程来实现：等待一个进程完全启动后，再重启下一个，这样集群就会逐步自我更新。为此，您可以使用\
    \ `reload` 命令或 `gracefulReload` 命令，后者不会强制终止集群进程，而是发送一个关闭信号，允许进程优雅地退出。\n\n```\n\
    $ pm2 reload webservice # 强制终止进程\n$ pm2 gracefulReload webservice # 向它们发送关闭信号\n\
    ```\n\n您可以通过以下代码块捕获该信号，并执行任何所需操作：\n\n```\nprocess.on('message', function(msg)\
    \ {\n  if (msg === 'shutdown') {\n    close_all_connections();\n    delete_cache();\n\
    \    server.close();\n    process.exit(0);\n  }\n});\n```\n\n如您所见，PM2 可以成为您……生产工具箱中一个非常趁手的工具，它功能强大，实用特性丰富，而且超级易用。但话说回来，它并非解决集群问题的银弹（顺便说一句，从来就没有这种东西），您最终会遇到一些传统集群无法解决的问题，那该怎么办呢？让我们继续探索！\n\
    \n### 不用集群实现多进程处理怎么样？\n\n那么，当 `cluster` 模块不够用时该怎么办？当解决方案不那么简单时呢？就像我之前提到的，多进程处理仍然是答案，别搞错了。如果您想充分利用您的处理器，就需要将逻辑拆分为多个可以并行运行的\
    \ Node.js 进程，这能确保您使用所有核心。\n\n基本上，您需要采用微服务方法，将逻辑拆分为可以并行工作的更小部分。换句话说，您的业务逻辑越支持任务并行化，您就越能充分利用该架构。\n\
    \n这种方法的好处是，如果您的服务器开始出现不足，您可以轻松地迁移到多服务器架构，因为代码结构基本保持不变，您只需要处理服务器间的通信（处理防火墙等网络问题，启用正确的端口等）。\n\
    \n您大概能想象得到，对于这种特定场景，没有万能的方法。您只需要找到一种方法，将您的逻辑映射到一组并行进程中（从现在起我们称它们为工作进程，因为无论如何它们都在做这件事），如果您能让每个工作进程拥有多个副本，那就更好了。通常，对于这类设置，关键部分不是如何生成新的工作进程，而是如何处理它们之间的通信，因为您很可能会希望它们在不同类型的工作进程之间发送数据，并最终将数据（最终输出）保存到您可以使用的地方。这就是我们要讨论\
    \ Node.js 中 IPC（进程间通信）最佳方案的话题了。\n"
- fmt: '# IPC in High Performance Land


    There are almost too many options when it comes to picking the right way of doing
    IPC in `Node.js`, but thanks to the fact that in this chapter, I’m dealing with
    highly scalable and performant architectures, the options for doing efficient
    IPC are narrowed considerably for us. You see, most IPC modules out there, deal
    with direct process-to-process communication, some even rely on the assumption
    that the processes will always share the same server and as I’ve stated already,
    that might not always be the case, in fact, if you’re truly dealing with a scalable
    solution, you should have this down as a basic assumption: you’ll need several
    servers to handle your different workers.


    So, if direct process-to-process communication is off the table, then what are
    our options? In my experience, using a scalable solution to act as a data buffer
    to distribute the load between the different instances of the same worker type,
    is the right way to go, because:


    1. It allows for processes to transfer data between them at the rate they choose
    (you can either choose to throttle it, or simply go as fast as you have workers
    available).

    2. The buffer solution can scale on its own, thus removing the need for you to
    worry about it, simply configure your buffer to scale and watch it go (more or
    less, but you get my point, you don’t have to worry about things like sharding
    of the data, availability, etc).


    Figure [9-2](#A418015_1_En_9_Chapter.html#Fig2) shows a generic example of what
    I described before, on it, you have represented three different types of workers,
    their types indicate their main tasks, so each task can be parallelized and that
    is also represented on the diagram as multiple instances of the same worker type.
    The communication between types is done using some external solution as data buffers,
    just like I mentioned as well. So in the future, if you’re correctly measuring
    the performance of the system, you can detect which parts of it as under stress
    and adjust accordingly. Say you get overwhelmed by client requests, you can simply
    scale on the “type A” workers, the rest of the system will simply continue to
    process the data as fast as it can, unless of course your “type A” workers are
    generating too much data for the “Data Buffer #1”, in such a case, you can scale
    up that buffer and the rest of the process continues the same. See the pattern?
    Scaling up became super easy from an architectural standpoint, you simply need
    more instances, and finally, if your servers start to become overwhelmed by the
    number of instances, again, you can simply add more servers and spread the workers
    throughout the cluster.


    ![A418015_1_En_9_Fig2_HTML.jpg](A418015_1_En_9_Fig2_HTML.jpg)


    Figure 9-2. Basic example of a multi-worker communication using data buffers


    Figure [9-3](#A418015_1_En_9_Chapter.html#Fig3) shows how the sample architecture
    would look like once you’ve scaled up your “type A” workers and you “Data Buffer
    #1”, like I said, the rest of it is unaffected.


    ![A418015_1_En_9_Fig3_HTML.jpg](A418015_1_En_9_Fig3_HTML.jpg)


    Figure 9-3. The scaled up version of the previous architecture


    Let’s look at some choices of technologies for the data buffers, there are many
    names out there that can do pretty much the same, so lets group them into two
    different categories: push based buffers, and pull based buffers.


    ## Push Based Buffers


    Or in other words, buffers that will push the new data to your workers as soon
    as it becomes available. For this type of buffers, Message Queues are a great
    options, by default most queues work this way. In this model, you have three basic
    actors:


    * A publisher, which takes care of sending the data into the queue and then forgets
    about it.

    * A subscriber, which registers itself into the queue for a specific type of message
    and then waits for them.

    * The actual queue, which receives the messages from the publisher and relays
    them to the first subscriber available.


    The advantages of this approach are:


    * The publishers only need to know how to send the data to the queue, then they
    can forget about it. This simplifies the job of the developer working on this
    process, since they don’t need to worry about retries, lack of consumers, storage
    for the messages, etc.

    * Consumers also benefit from the simpler logic that comes with this approach,
    since they only need register on the queue and then simply wait for it to push
    a message to them.

    * Finally, the queue itself is the one that takes most of the hit, it needs to
    handle the messages in, and the messages out, it needs to handle scalability,
    temp storage for the messages in case of failure, and many other aspects of being
    a functional scalable queue. That being said, the great thing about this, is that
    that’s all taken care of, unless you’re coding your own message queue, you’re
    most likely using one of the common ones, Apache Kafka ( [`http://kafka.apache.org/`](http://kafka.apache.org/)
    ), RabbitMQ ( [`https://www.rabbitmq.com`](https://www.rabbitmq.com) ), Redis’
    Pub/Sub ( [`http://redis.io/`](http://redis.io/) ) to name just a few.


    Depending on your particular needs, you might want to go with one or the other,
    for instance, if you’re dealing with a huge incoming traffic (say 100k requests
    / second) you might want to go with Kafka, if on the other hand, you have complex
    routing logic for messages, you might want to consider going with RabbitMQ. So
    you see, even though the approach is the same on all of them (and I just named
    three options), they’re not all exactly the same, so reading up on the major options
    out there might be a good idea.


    Just to illustrate how easy it can be to interact with one of these queues, here
    is a simple example of a publisher and a consumer (subscriber) that work with
    RabbitMQ, this example is using the module `amqp` ( [`https://www.npmjs.com/package/amqp`](https://www.npmjs.com/package/amqp)
    ):


    ```

    // == CONSUMER CODE ==

    var amqp = require(''amqp'');

    var connection = amqp.createConnection({ host: ''localhost'' });

    // add this for better debuging

    connection.on(''error'', function(e) {

    console.log("Error from amqp: ", e);

    });

    // Wait for connection to become established.

    connection.on(''ready'', function () {

    console.log("Listening for messages...");

    connection.queue(''my-queue'', function (q) {

    // Catch all messages

    q.bind(''#'');

    // Receive messages

    q.subscribe(function (message) {

    // Print messages to stdout

    console.log(message.data.toString());

    });

    });

    });

    //== PUBLISHER CODE ==

    var amqp = require(''amqp'');

    var connection = amqp.createConnection({ host: ''localhost'' });

    // add this for better debuging

    connection.on(''error'', function(e) {

    console.log("Error from amqp: ", e);

    });

    // Wait for connection to become established.

    connection.on(''ready'', function () {

    // Use the default ''amq.topic'' exchange

    connection.publish(''my-queue'', ''Test message'');

    console.log("Message sent!");

    });

    ```


    Nothing fancy, you can split the preceding code into two files, first execute
    the consumer so it can subscribe to Rabbit and then execute the publisher, it
    will send a message to the queue that will be received and printed by the consumer.'
