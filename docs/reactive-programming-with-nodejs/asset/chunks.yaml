    # 并行流程


    并行流程的核心思想是：程序可以并行运行一组不相关的任务，但只有在所有任务都执行完毕后，才会调用提供的回调函数（以收集它们的集体输出结果）。


    基本上，这就是我要表达的意思：


    ```

    // functionX 符号是对各个独立函数的引用

    parallel([function1, function2, function3, function4], function(data) {

    /// 等它们全部完成后，对合并后的输出进行处理

    })

    ```


    为了知道每个函数何时执行完毕，它们需要用操作结果来执行一个回调函数。回调将是它们收到的唯一参数，所以让我们看看这个`parallel`函数：


    ```

    function parallel(funcs, callback) {

    var results = [],

    callsToCallback = 0;

    funcs.forEach(function(fn) { // 遍历所有函数

    fn(done);

    });

    function done(data) { // 函数执行完毕时会调用这个函数，并将结果传递到这里

    results.push(data);

    if(++callsToCallback == funcs.length) {

    callback(results);

    }

    }

    }

    ```


    **注意：** 由于在`parallel`执行期间调用的函数具有异步特性，最终回调中结果的顺序无法保证。某些在开始时执行的异步函数，可能比后面执行的函数返回结果所需的时间更长。需要额外的代码来确保最终结果列表是有序的。


    前面的实现是我试图演示的一个非常简单的版本，但它完成了任务：它以类似并行的方式运行一组函数（你会看到，由于 Node.js 运行在单线程中，真正的并行是不可能的，所以这是我们能达到的最接近的结果）。


    这种控制流在处理对外部服务的调用时特别有用。


    让我们看一个实际示例：假设你的程序需要执行多个操作，这些操作虽然彼此不相关，但都需要在用户看到结果之前完成。例如，从数据库加载书籍列表，查询外部服务获取本周新书的消息，并将请求记录到文件中。如果你按顺序执行所有这些任务，等待一个完成后再运行下一个，那么用户很可能会遇到响应延迟，因为执行所需的总时间将是所有单个时间的总和。


    但如果可以并行执行所有这些任务，那么总时间实际上就等于执行最慢的那个任务所用的时间。


    让我们看看这两种情况：


    **串行方式（耗时更长）**


    ```

    //请求处理代码...

    //假设 "db" 已经初始化，并提供了数据库接口

    db.query("books", {limit:1000, page: 1}, function(books) {

    services.bookNews.getThisWeeksNews(function(news) {

    services.logging.logRequest(request, function() { //没有返回值，但我们需要调用它，以便知道日志记录完成

    response.render({listOfBooks: books, bookNews: news})

    })

    })

    })

    ```


    **并行方式（耗时更少）**


    ```

    //请求处理代码...

    parallel([

    function(callback) { db.query("books", {limit: 1000, page: 1}, callback) }),

    function(callback) { services.bookNews.getThisWeeksNews(callback) }),

    function(callback) { services.logRequest(request, callback) })

    ], function(data) {

    var books = findData(''books'', data)

    var news = findData(''news'', data)

    response.render({listOfBooks: books, bookNews: news})

    })

    ```


    前面的代码展示了每种方法的外观。`findData`函数简单地查找`data`数组，并根据项目结构返回所需的对象（第一个参数）。在这个`parallel`的实现中，它之所以必要，是因为（正如我之前提到的）你无法确定函数完成并返回结果的顺序。


    除了代码将获得明显的速度提升之外，它也更易于阅读，并且更容易向并行流程中添加新任务：只需在数组中添加一个新项即可。


    # 串行流程


    串行流程提供了一种简单的方法来指定需要按特定顺序执行的函数列表。这种解决方案不像之前那样提供速度提升，但它确实提供了编写此类代码并保持其整洁的能力，从而远离通常所说的“回调地狱”。


    让我们看看我们想要实现的目标：


    ```

    serial([

    function1, function2, function3

    ], function(data) {

    //对合并后的结果进行处理

    });

    ```


    而不是像这样：


    ```

    function1(function(data1)  {

    function2(function(data2) {

    function3(function(data3) {

    //对所有输出进行处理

    }

    }

    }

    ```


    你可以看到，如果函数数量持续增长，第二段代码会变得难以管理。因此，串行方法将帮助你保持代码的组织性和可读性。


    让我们看看`serial`函数的一个可能实现：


    ```

    function serial(functions, done) {

    var fn = functions.shift(); // 从列表中取出第一个函数

    var results = [];

    fn(next);

    function next(result) {

    results.push(result); // 保存结果，以便在不再有函数需要执行时传递给最终回调。

    var nextFn = functions.shift();

    if (nextFn) nextFn(next);

    else done(results);

    }

    }

    ```


    这些函数还有更多变体，例如使用错误参数自动处理错误，或者在并行流程中限制并发函数的数量。


    总而言之，异步编程是 Node.js 开发者生活中不可或缺的一部分。所有操作都利用了 Node 的异步 I/O（我稍后将讨论这一点），因此理解它的工作原理以及如何利用它的强大功能，无疑会对你设计响应式库有所帮助。


    有关一个功能完备且经过测试、专注于异步编程的库，请查看 ASYNC.JS（可在 [`github.com/caolan/async`](https://github.com/caolan/async)
    获取）。


    ## 异步 I/O


    异步编程的一个特定案例涉及 Node.js 提供的这个非常有趣的特性：异步 I/O。


    此特性与 Node.js 的内部架构高度相关。正如我之前所说，Node 不提供多线程；它实际上在单个线程内运行，该线程内部运行着一个事件循环（见图 5-4）。


    ![A418015_1_En_5_Fig4_HTML.jpg](img/A418015_1_En_5_Fig4_HTML.jpg)


    **图 5-4.** 展示事件循环如何工作以提供异步 I/O 的示意图


    简而言之，Node.js 的设计理念是：I/O 操作是每个操作的实际瓶颈，而不是处理能力。因此，node 进程接收到的每个请求都将在事件循环内工作，直到发现一个
    I/O 操作。当这种情况发生时，回调将被注册到一个单独的队列中，而主程序的流程将继续。一旦 I/O 操作完成，回调将被触发，其内部的代码将被执行。

    '
- fmt: '# 异步事件流


    标题也可以是“异步事件的流”。无论如何，本章这一节的目标是将我目前讨论的所有内容串联起来。


    在第3章中，我展示了一些处理这类情况的基础代码，它们确实能工作。但由于Node已经提供了原生流，因此有必要概述所有选项，这样在后续章节中，你可以从这些不同的选项中汲取灵感，创建出优秀的库。


    为了演示，我将使用一个名为`event-stream`的外部模块（可在[`https://www.npmjs.com/package/event-stream`](https://www.npmjs.com/package/event-stream)获取）。但别担心，它的一切基础都是Node的内置流，因此其原理依然适用。


    该库本质上提供了一套辅助方法，让你能够操作和处理流，而这些流又可以轻松地处理异步任务。如果你还记得前几页的内容，`SaveUserToDB`流无法被设置为`Duplex`流，相反，由于对数据库的异步调用，我不得不使用`Transform`流。


    借助`event-stream`模块，修复这个问题不仅简单，而且实际上有几种方法可以实现。让我们先看看该库提供的所有辅助方法。


    ## `through`


    该方法是对之前问题的解决方案。它创建了一个`Duplex`流，我们可以控制其中的数据流，从而让你将异步过程转化为同步过程。它接受两个可选参数：一个`write`函数和一个`end`函数。你会注意到没有`read`方法，这是因为它是一种特殊的`Duplex`，具有预定义的`read`方法。它会重新发射你在`write`方法中通过`data`事件发射的任何内容。


    让我演示一下。以下是`SaveUserToDB`流的重写方式：


    ```javascript

    var es = require("event-stream");

    var save = es.through(function write(data) {

    var self = this;

    this.pause();

    //You need to pause the stream, to make sure the saving operation is done

    UserModel.create(data, function(err, obj) {

    if(err) {

    return self.emit(''error'', err);

    }

    self.resume();

    //you can then resume the stream and emit the new object

    self.emit(''data'', obj);

    });

    }, function end() {

    this.emit(''end'');

    });

    ```


    ## `map`


    该方法接受两个参数：实际数据和必须在函数末尾调用的回调函数。


    我在前一章已经介绍了`map`函数的作用，因此在这种情况下，只需理解这个特定的`map`是一个自定义的`through`函数，它会重新发射你作为接收回调函数第二个参数传递的任何内容。了解这一点后，你可以再次重新实现`SaveUserToDB`流，如下所示：


    ```javascript

    var es = require("event-stream");

    var save = es.map(function(data, callback) {

    var self = this;

    UserModel.create(data, function(err, obj) {

    if(err) {

    //the first argument of the callback is the error returned

    return callback(err);

    }

    callback(null, obj);

    });

    });

    ```


    ## `split`


    该方法的工作方式与`String#split`方法类似，但其默认值是换行符，而不是空字符串。它不是分割单个字符串，而是将一个流分解并重新组装，以便结果分割的每个部分都是一个数据块。


    一个简单的例子是，如果你想处理文本文件中的每个单词，可以这样做：


    ```javascript

    var es = require("event-stream");

    var fs = require("fs");

    fs.createReadStream(''myfile.txt'')

    .pipe(es.split('' ''))

    .pipe(es.map(function(word, cb) {

    cb(null, word.toUpperCase());

    });

    ```


    显然，你不需要仅仅为了将文档分割成单词而这样做，但这仍然可以作为示例。


    ## `join`


    这个方法有点令人困惑，因为名称暗示它是`split`的反向操作，可以撤销你对它所做的任何操作。


    该方法在每个发出的数据块后添加一个分隔符（它接受的唯一属性）。因此，实际上，对于每一块数据，它会发射两个新块：分隔符和实际数据。所以你可以这样做：


    ```javascript

    var es = require("event-stream");

    var fs = require("fs");

    var writer = fs.createWriteStream(''./output-join.txt'');

    fs.createReadStream(''./event-stream-join.js'')

    .pipe(es.split(" "))

    .pipe(es.map(function(str, done) {

    done(null, str.toUpperCase());

    }))

    .pipe(es.join("\n"))

    .pipe(writer);

    ```


    实际上，上面的代码将文本文件分割成单词，将每个单词转换为大写，然后将每个单词保存到文件中，但末尾带有一个换行符。


    **提示**


    如果在`join`方法中传入一个`String`而不是函数，那么该函数将在流结束时被调用，它接收的唯一参数将是所有连接成单个`String`的数据块列表。


    ## `merge`


    该方法负责合并多个流。这意味着它将合并每个传入流的结果数据，一旦所有流都发出了`end`事件，它就会结束。


    一个简单的例子如下：


    ```javascript

    var es = require("event-stream");

    var fs = require("fs");

    es.merge([

    fs.createReadStream(''input1.txt''),

    fs.createReadStream(''input2.txt'')

    ]).pipe(fs.createWriteStream(''output.log''));

    ```


    注意，合并的流之间不保证顺序，因此保存的数据不会先包含一个文件的内容，然后再包含第二个文件的内容。两个文件的内容可能交织在一起（取决于每个文件内容的长度）。


    ## `readable`


    正如方法名称所示，它创建一个`Readable`流，该流与一个异步函数配合作为数据源。换句话说，接收的函数（接受的唯一参数）接受两个参数：一个计数器和一个回调。该函数必须始终调用回调以推进数据流，并且只能调用一次；后续调用将无效。


    然而，它可以在一次调用中使用`data`事件发射多个数据块。以下是你的`read`函数的基本结构：


    ```javascript

    var es = require("event-stream");

    es.readable(function(count, callback) {

    if(hasEnded) { //for some reason the stream is no longer reading

    this.emit(''end'');

    }

    //... your code here

    this.emit(''data'', chunk); //you can do this as many times as you need to.

    callback();

    });

    ```


    **注意**


    在前面的代码示例中，变量`hasEnded`仅仅是某种指示流已结束的逻辑条件的占位符。你需要将其替换为对业务逻辑有意义的任何内容。


    该模块还提供了其他方法，如`duplex`、`child`、`wait`、`parse`等，但主要方法就是上面这些。如果你想了解更多，可以查看该模块npm页面上的完整文档（可在[`https://www.npmjs.com/package/event-stream`](https://www.npmjs.com/package/event-stream)获取）。


    ## 结论


    正如你所见，该模块提供的辅助方法与第3章中描述的方法非常相似，但同时也有所不同，因为它们是创建新的流，而不是修改流经某个流的数据。


    这个模块和之前讨论的可观察流（Observable Streams）将用于创建本书响应式库的最终版本。'
  raw: '## Asynchronous Streams of Events


    The heading could also be Streams of Asynchronous events. Either way, the point
    of this section of the chapter is to tie together everything I’ve talked about
    so far.


    In Chapter [3](#A418015_1_En_3_Chapter.html) I showed some basic code on how to
    handle this type of situation, and it works, but since Node already provides native
    Streams, it’s important to go over all options, so that in the future chapters,
    you can draw from these different options and create a great library.


    For the purpose of this demonstration, I’ll use an external module called event-stream
    (available at [`https://www.npmjs.com/package/event-stream`](https://www.npmjs.com/package/event-stream)
    ), but don’t worry, it uses Node’s built-in streams as the basis of everything,
    so it still applies.


    This library basically provides a set of helper methods that will let you manipulate
    and deal with streams that, in turn, can easily deal with asynchronous tasks.
    If you remember from a few pages ago, the `SaveUserToDB` stream could not be made
    a Duplex stream, instead I had to go with a Transform stream, because of the asynchronous
    call to the database.


    Well, with the help of the event-stream module , fixing this is not only simple,
    but there are actually a couple of ways to do it. Let’s first look at all the
    helper methods provided by the library.


    ### Through


    This method is the solution to the problem from before. It creates a Duplex stream
    on which we can control the flow of data, allowing you to turn an asynchronous
    process into a synchronous one. It accepts two optional parameters, a `write`
    function and an `end` function. You’ll notice that there is no `read` method,
    and that is because it’s a special kind of Duplex, with a predefined `read` method.
    It re-emits whatever you emit with the `data` event on the `write` method.


    Let me show you. Here is how the `SaveUserToDB` stream can be re-written:


    ```

    var es = require("event-stream");

    var save = es.through(function write(data) {

    var self = this;

    this.pause();

    //You need to pause the stream, to make sure the saving operation is done

    UserModel.create(data, function(err, obj) {

    if(err) {

    return self.emit(''error'', err);

    }

    self.resume();

    //you can then resume the stream and emit the new object

    self.emit(''data'', obj);

    });

    }, function end() {

    this.emit(''end'');

    });

    ```


    ### Map


    This method accepts two parameters: the actual data and a callback function that
    must be called at the end of the function.


    I’ve covered what the map function does in a previous chapter, so in this case
    it should be enough to understand that this particular map, is a custom `through`
    function that re-emits whatever you send as the second parameter of the received
    callback. So knowing this, you can re-implement the `SaveUserToDB` stream yet
    again, like so:


    ```

    var es = require("event-stream");

    var save = es.map(function(data, callback) {

    var self = this;

    UserModel.create(data, function(err, obj) {

    if(err) {

    //the first argument of the callback is the error returned

    return callback(err);

    }

    callback(null, obj);

    });

    });

    ```


    ### Split


    This method works similarly to how the `String#split` method works, but its default
    value is the end-of-line character instead of the empty string. Instead of splitting
    a single string, this method will break up a stream and reassemble it, so that
    every part of the resulting split, is a chunk of data.


    An easy example for this would be if you wanted to process each word of a text
    document, you could do something like the following:


    ```

    var es = require("event-stream");

    var fs = require("fs");

    fs.createReadStream(''myfile.txt'')

    .pipe(es.split('' ''))

    .pipe(es.map(function(word, cb) {

    cb(null, word.toUpperCase());

    });

    ```


    Clearly you don’t need to split a document into words to do just that, but it
    serves as an example nonetheless.


    ### Join


    This one is a bit confusing, because the name would suggest that it is the opposite
    of split, which would allow you to undo whatever you did with it.


    This adds a separator (the only attribute it accepts) after each chunk emitted,
    so in practice, for every bit of data, it is emitting two new ones, the separator
    and the actual data. So you can do something like the following:


    ```

    var es = require("event-stream");

    var fs = require("fs");

    var writer = fs.createWriteStream(''./output-join.txt'');

    fs.createReadStream(''./event-stream-join.js'')

    .pipe(es.split(" "))

    .pipe(es.map(function(str, done) {

    done(null, str.toUpperCase());

    }))

    .pipe(es.join("\n"))

    .pipe(writer);

    ```


    Effectively the code above is splitting a text file into words, making each word
    uppercase and then saving each word into a file but with a new-line character
    at the end.


    Tip


    If instead of passing in a `String` as parameter to the `join` method, you pass
    in a function, then that function will be called once the stream ends, and the
    only parameter it will receive will be the list of chunks emitted but all concatenated
    as a single String.


    ### Merge


    This method takes care of merging several streams, and that means that it will
    merge the resulting data from each of the passed streams, and once all of them
    have issued the end event, then it will end .


    A simple example of this would be:


    ```

    var es = require("event-stream");

    var fs = require("fs");

    es.merge([

    fs.createReadStream(''input1.txt''),

    fs.createReadStream(''input2.txt'')

    ]).pipe(fs.createWriteStream(''output.log''));

    ```


    Note that no ordering is ensured between the merged streams, so the saved data
    will not have the content of one file first, and the second later. The content
    of both files could be intertwined (depending on how lengthy the content of each
    file is).


    ### Readable


    As the name of this method indicates, it creates a Readable stream , one that
    works with an asynchronous function as source of data. In other words, the function
    received (the only parameter accepted) accepts two arguments: a counter and a
    callback. The function must always call the callback in order to advance the flow
    of data, and it can only call it once; further calls will have no effect.


    It can, however, emit several chunks of data in a single call, using the `data`
    event. Here is the basic structure of your read function:


    ```

    var es = require("event-stream");

    es.readable(function(count, callback) {

    if(hasEnded) { //for some reason the stream is no longer reading

    this.emit(''end'');

    }

    //... your code here

    this.emit(''data'', chunk); //you can do this as many times as you need to.

    callback();

    });

    ```


    Note


    In the preceding code example, the variable `hasEnded` is merely a placeholder
    for some kind of logical condition that indicates the stream has ended. You would
    need to replace it with whatever makes sense to your business logic.


    There are other methods provided by the module, like duplex, child, wait, parse,
    etc., but the main ones are the ones from earlier. If you wish to know more, you
    can check the full documentation on the module’s npm page (available at [`https://www.npmjs.com/package/event-stream`](https://www.npmjs.com/package/event-stream)
    ).


    ### In Conclusion


    As you can see, the helper methods provided by this module are very similar to
    those described in Chapter [3](#A418015_1_En_3_Chapter.html) but, at the same
    time, different in the sense that they create new streams instead of modifying
    the data flowing through one.


    This module and the Observable Streams discussed before will be used to create
    the final version of this book''s reactive library.'
  trans: '

    # 异步事件流


    标题也可以是“异步事件的流”。无论如何，本章这一节的目标是将我目前讨论的所有内容串联起来。


    在第 3 章中，我展示了一些处理这类情况的基础代码，它们确实能工作。但由于 Node 已经提供了原生流，因此有必要概述所有选项，这样在后续章节中，你可以从这些不同的选项中汲取灵感，创建出优秀的库。


    为了演示，我将使用一个名为`event-stream`的外部模块（可在[`https://www.npmjs.com/package/event-stream`](https://www.npmjs.com/package/event-stream)获取）。但别担心，它的一切基础都是
    Node 的内置流，因此其原理依然适用。


    该库本质上提供了一套辅助方法，让你能够操作和处理流，而这些流又可以轻松地处理异步任务。如果你还记得前几页的内容，`SaveUserToDB`流无法被设置为`Duplex`流，相反，由于对数据库的异步调用，我不得不使用`Transform`流。


