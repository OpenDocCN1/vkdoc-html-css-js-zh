- fmt: '# Parallel Flow


    The idea behind parallel flow is that the program can run a set of non-related
    tasks in parallel but only call the callback function provided (to gather their
    collective outputs) after all tasks have finished executing.


    Basically, this is what I’m talking about:


    ```

    //functionX symbols are references to individual functions

    parallel([function1, function2, function3, function4], function(data) {

    ///do something with the combined output once they all finished

    })

    ```


    In order to know when each of the functions have finished execution, they’ll have
    to execute a callback function with the results of their operation. The callback
    will be the only attribute they receive, so let’s look at the `parallel` function:


    ```

    function parallel(funcs, callback) {

    var results = [],

    callsToCallback = 0;

    funcs.forEach(function(fn) { // iterate over all functions

    fn(done);

    });

    function done(data) { // the functions will call this one when they finish and
    they’ll pass the results here

    results.push(data);

    if(++callsToCallback == funcs.length) {

    callback(results);

    }

    }

    }

    ```


    **Note:** Because of the asynchronous nature of the functions called during the
    execution of `parallel`, the order of the results on the final callback can’t
    be assured. Some of the asynchronous functions that execute at the beginning might
    take longer to return results than the ones executed later. Extra code would be
    needed to ensure that the final list of results is sorted.


    The previous implementation is a very simple version of what I’m trying to demonstrate,
    but it fulfills its task: It runs a set of functions in a parallel-like way (you’ll
    see that since Node.js runs in a single thread, true parallelism is not possible,
    so this is as close as we can get).


    This type of control flow is particularly useful when dealing with calls to external
    services.


    Let’s look at a practical example: Assume your program needs to do several operations
    that, despite not being related to each other, need to happen before the user
    can see the results. For instance, load the list of books from the database, query
    an external service to get news from new books out this week, and log the request
    into a file. If you were to execute all those tasks in a series, waiting for one
    to finish before the next one can be run, then the user would most probably suffer
    a delay on the response, since the total time needed for the execution would be
    the sum of all individual times.


    But if instead you can execute all of them in parallel, then the total time would
    actually equal the time it took to the slowest task to execute.


    Let’s look at both cases:


    **Serial way (takes longer)**


    ```

    //request handling code...

    //assume "db" is already initialized and provides an interface to the data base

    db.query("books", {limit:1000, page: 1}, function(books) {

    services.bookNews.getThisWeeksNews(function(news) {

    services.logging.logRequest(request, function() { //nothing returned, but we need
    to call it so we know the logging finished

    response.render({listOfBooks: books, bookNews: news})

    })

    })

    })

    ```


    **Parallel way (takes a lot less time)**


    ```

    //request handling code...

    parallel([

    function(callback) { db.query("books", {limit: 1000, page: 1}, callback) }),

    function(callback) { services.bookNews.getThisWeeksNews(callback) }),

    function(callback) { services.logRequest(request, callback) })

    ], function(data) {

    var books = findData(''books'', data)

    var news = findData(''news'', data)

    response.render({listOfBooks: books, bookNews: news})

    })

    ```


    The preceding code shows how each approach would look. The `findData` function
    simply looks into the `data` array and, based on the structure of the items, returns
    the desired one (first parameter). In this implementation of `parallel` it is
    needed because (as I mentioned before) you can’t be sure in which order the functions
    finished and sent their results back.


    Aside from the clear speed boost that the code will get, it’s also easier to read
    and easier to add new tasks to the parallel flow: Just add a new item to the array.


    # Serial Flow


    The serial flow provides the means to easily specify a list of functions that
    need to be executed in a particular order. This solution doesn’t provide a speed
    boost, like the previous one did, but it does provide the ability to write such
    code and keep it clean, staying away from what is normally known as callback hell.


    Let’s look at what we’re trying to accomplish:


    ```

    serial([

    function1, function2, function3

    ], function(data) {

    //do something with the combined results

    });

    ```


    Instead of having something like:


    ```

    function1(function(data1)  {

    function2(function(data2) {

    function3(function(data3) {

    //do something with all the output

    }

    }

    }

    ```


    You can see how the second piece of code can get out of hand if the number of
    functions keeps growing. So the serial approach will help you keep the code organized
    and readable.


    Let’s look at a possible implementation of the `serial` function:


    ```

    function serial(functions, done) {

    var fn = functions.shift(); //get the first function off the list

    var results = [];

    fn(next);

    function next(result) {

    results.push(result); //save the results to be passed into the final callback
    once we don''t have any more functions to execute.

    var nextFn = functions.shift();

    if (nextFn) nextFn(next);

    else done(results);

    }

    }

    ```


    There are more variations to these functions, like using an error parameter to
    handle errors automatically or limiting the number of simultaneous functions on
    the parallel flow.


    All in all, asynchronous programming is an integral part of the Node.js developer’s
    life. Everything takes advantage of Node’s asynchronous I/O (which I’ll talk about
    in a minute), so understanding how it works and how you can leverage its power
    in your favor will definitely help you when designing the reactive library.


    For a fully functional and tested library that thrives on asynchronous programming,
    please check out ASYNC.JS (available at [https://github.com/caolan/async](https://github.com/caolan/async)).


    ## Asynchronous I/O


    A specific case of Asynchronous programming relates to this very interesting feature
    provided by Node.js: Asynchronous I/O.


    This feature is highly related to the internal architecture of Node.js. As I’ve
    said before, Node doesn’t provide multithreading; it actually works with a single
    thread inside which it runs an event loop (see Figure 5-4).


    ![A418015_1_En_5_Fig4_HTML.jpg](A418015_1_En_5_Fig4_HTML.jpg)


    **Figure 5-4.** Diagram showing how the Event Loop works to provide Async I/O


    In a nutshell, Node.js was designed with the mindset that I/O operations are the
    actual bottleneck on every operation, not the processing power, so every request
    received by the node process will work inside the event loop until an I/O operation
    is found. When that happens, the callback will be registered on a separate queue,
    and the main program’s flow will continue. Once the I/O operation finishes, the
    callback will be triggered and the code inside it will be run.'
