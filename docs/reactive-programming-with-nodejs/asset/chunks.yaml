    then return it on the following Read call, but as it turns out, due to what I
    described earlier (when talking about Duplex v Transform streams), the Read and
    Write events are not linked, so I would get the Read event before the Write was
    done and therefore I would have nothing to return at that point. This is solved
    by turning the Stream into a Transform stream.


