- fmt: '# Take and Take Some More


    There are three variants of the `take` function here, the simple one will accept
    a fixed amount of chunks from the stream and then it will end it, this is the
    `take` function. The second one, the `takeUntil` function, will accept chunks
    from the source of data until the condition of the function passed as parameter
    is met (basically, when the function returns `true`). And finally, `takeWhile`,
    which is quite similar to `takeUntil`, but the condition is the opposite, it will
    accept chunks while the condition is met, afterwards, the data will not flow past
    this point.


    Let''s first take a look at their code:


    ```

    function take(number) {

    var counter = 0;

    var max = number;

    var _fn = function(stream, value, done) {

    counter++;

    if(counter == max) {

    stream.end();

    }

    return done(null, value);

    };

    _fn.__fn_type = ''take'';

    _fn.newInstance = function() {

    return take(number);

    };

    return _fn;

    }

    function takeUntil(condition) {

    var _fn = function(stream, value, done) {

    if(condition.length === 1) {

    if(condition(value)) {

    return stream.end();

    }

    return done(null, value);

    } else {

    condition(value, function(err, resp) {

    if(!!resp === true) {

    return stream.end();

    }

    return done(err, value);

    });

    }

    };

    _fn.__fn_type = ''take'';

    _fn.newInstance = function() {

    return takeUntil(condition);

    };

    return _fn;

    }

    function takeWhile(condition) {

    var _fn = function(stream, value, done) {

    if(condition.length === 1) {

    if(!condition(value)) {

    return stream.end();

    }

    return done(null, value);

    } else {

    condition(value, function(err, resp) {

    if(!!resp === false) {

    return stream.end();

    }

    return done(err, value);

    });

    }

    };

    _fn.__fn_type = ''take'';

    _fn.newInstance = function() {

    return takeWhile(condition);

    };

    return _fn;

    }

    ```


    Their code is very similar to each other, and they even share the same function
    type identifier, because the main library can handle the three of them in the
    same manner. Finally, both `takeUntil` and `takeWhile` accept both an asynchronous
    and a synchronous function as the condition for deciding when to stop. Figure
    [7-1](#A418015_1_En_7_Chapter.html#Fig1) gives you an example of how all three
    variations behave.


    ![A418015_1_En_7_Fig1_HTML.jpg](A418015_1_En_7_Fig1_HTML.jpg)


    Figure 7-1.


    Marble diagram showing the differences between all three take methods


    Let''s quickly check out a code sample for these methods:


    ```

    var cheese = require("./cheese").Cheese;

    var _ = require("lodash");

    var take = require("./cheese").Utils.take;

    var takeUntil = require("./cheese").Utils.takeUntil;

    var takeWhile = require("./cheese").Utils.takeWhile;

    var ch = new cheese();

    var ch1 = new cheese();

    var ch2 = new cheese();

    ch.fromArray(_.range(100)).then(take(10)).each(function(v) {

    console.log("Ch: ", v.toString());

    });

    ch1.fromArray(_.range(100)).then(takeWhile(function(v) {

    //the value needs to be coerced into an integer, because all data that flows through
    the stream is casted into a String .

    return +v  10;

    }))

    .each(function(v) {

    console.log("Ch2: ", v.toString());

    })

    ```


    As you''ve probably guessed already, all three variations are doing the same thing,
    only taking the first 10 elements of the stream and then closing it.


    # Splitting Your Chunks


    This one is pretty straightforward, nothing much to say about it, it is simply
    a shortcut to doing a `map` and then a string `split` inside it. By default it
    will split your strings on an array of single characters unless you pass it a
    separator string.


    The result of this function is an array of values, which incidentally can be turned
    into a new stream using `flatMap`.


    Here is the code for this transformation:


    ```

    function split(separator) {

    var _fn = function(value) {

    return value.toString().split(separator || "");

    }

    _fn.__fn_type = ''split'';

    _fn.newInstance = function() {

    return _fn;

    }

    return _fn;

    }

    ```


    Now, let’s check out this example regarding the usage of `split` and `flatMap`
    together:


    ```

    var cheese = require("./cheese").Cheese;

    var flatMap = require("./cheese").Utils.flatMap;

    var split = require("./cheese").Utils.split;

    var ch = new cheese();

    var words = ["test", "goodbye"];

    ch.fromArray(words)

    .then(split())

    .then(flatMap(function(arr) {

    return arr

    }))

    .onError(function(e) {

    console.trace(e)

    })

    .each(function(cnt) {

    console.log("Ch: ", cnt.toString());

    });

    ```


    The output of the above code, might not be exactly what you think, check it Figure
    [7-2](#A418015_1_En_7_Chapter.html#Fig2) for a screenshot:


    ![A418015_1_En_7_Fig2_HTML.jpg](A418015_1_En_7_Fig2_HTML.jpg)


    Figure 7-2.


    Mixed output of the above code


    Because the `flatMap` function is actually creating two different streams, one
    from each array returned by `split`, you end-up with two source streams working
    in parallel, as if you had just merged them into one, that is the reason why some
    of those letters are mixed and it''s not just one word after the other.'
