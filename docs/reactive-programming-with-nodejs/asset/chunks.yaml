    ### 回到代码


    让我们回归正轨吧，好吗？现在你已经理解了基于 JWT 的身份验证是如何工作的，接下来看看如何使用 `ExpressJS` 在后端通过传统编程方式来实现它。为了生成和验证令牌，你将使用一个名为
    `jsonwebtoken` 的 NPM 模块（可在 [`https://www.npmjs.com/package/jsonwebtoken`](https://www.npmjs.com/package/jsonwebtoken)
    获取），它提供了所有必需的功能。


    在本实现中，我将扩展上一个示例中的代码。我只需要两个方法：一个用于处理新的令牌端点，另一个用于处理每个请求的令牌验证。对于第二个代码块，我将使用一个中间件，因为这是更合理的方式。


    ```

    var router = require("express").Router();

    var jwt = require("jsonwebtoken");

    var models = require("./models-crud-api  ");

    var SECRET =  ''this is a secret phrase'';

    //Handle the new endpoint

    router.post(''/tokens'', function(req, res, next) {

    models.users.findOne({

    username: req.body.username,

    password: req.body.password

    })

    .then(function(usr) {

    if(!usr) {

    return next({error: true, msg: ''User not valid  ''});

    }

    var token = jwt.sign({

    name: usr.first_name,

    birth_date: usr.birth_date

    }, SECRET , {"expiresIn": "1 day "});

    res.json({

    token: token

    });

    })

    .catch(next);

    });

    ```


