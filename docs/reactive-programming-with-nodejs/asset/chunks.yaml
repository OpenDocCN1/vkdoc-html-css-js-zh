- fmt: '### FlatMap and the Plot Thickens


    This one is the first of the three most complex transformations provided in this
    code, the next two deal with timing issues, but that''s not the case here.


    I''ve been using this transformation on several examples in this chapter without
    going into much details, so you might''ve already picked up on what it is that
    this function is supposed to do, or maybe you''re as baffled by it as I was the
    first 10 times I read about, so let me try to explain it as simply as possible.


    The `flatMap` function has the ability to create a new stream from the returned
    value of the function it receives. Now that returned value should be something
    that the library knows how to use as a source of data for a stream, that is:


    - Another stream (check out example where `flatMap` returns the resulting stream
    of executing `fs.createReadStream`).

    - An array (checkout the example shown before).

    - A function, which of course would have to comply with the required behavior
    expected by `fromFn`.


    If used right, this transformation can provide a great deal of flexibility to
    your streams. Checkout Figure [7-3](#A418015_1_En_7_Chapter.html#Fig3) to see
    how it works.


    ![A418015_1_En_7_Fig3_HTML.jpg](A418015_1_En_7_Fig3_HTML.jpg)


    Figure 7-3. A marble diagram showing a simplified version of how `flatMap` can
    transform a stream


    Figure [7-3](#A418015_1_En_7_Chapter.html#Fig3) takes care of putting graphically,
    what I''ve explained above, how for each observable element returned by the function
    passed to `flatMap`, the transformation returns a new stream, and how those resulting
    streams are actually all working in parallel and mixing their values (just like
    in the `split` example from before).


    The code for this transformation is as follows (this function also provides the
    developer with the ability to have both a synchronous and an asynchronous function
    as parameter of `flatMap`):


    ```

    function flatMap(fn) {

    var _fn;

    var observable;

    var newStream = null;

    function setEachEvent(stream, observable, error_transforms, done) {

    if(Array.isArray(observable)) {

    stream.fromArray(observable)

    } else if(typeof observable === ''function'') {

    stream.fromFn(observable);

    } else if(observable instanceof _streams) {

    stream.fromStream(observable);

    }

    error_transforms.forEach(function(et) {

    stream.onError(et);

    })

    //for each item emitted by newStream

    //insert it into the original stream

    //**at the right place**

    stream.each(function(v) {

    done(null, v);

    });

    }

    if(fn.length == 1) {

    _fn = function(value, error_transforms, done) {

    newStream = new Cheese();

    try {

    observable = fn(value);

    } catch (e) {

    return done(e);

    }

    setEachEvent(newStream, observable, error_transforms, done);

    };

    } else {

    _fn = function(value, error_transforms, done) {

    newStream = new Cheese();

    fn(value, function(err, observable) {

    if(err) {

    return done(err);

    }

    setEachEvent(newStream, observable, error_transforms, done);

    });

    };

    }

    _fn.__fn_type = ''flatMap'';

    _fn.newInstance = function() {

    return flatMap(fn);

    }

    return _fn;

    }

    ```


    Quite literally, the transformation is creating a new stream from the resulting
    output of the passed function. The `done` callback is the link back to the original
    chain of transformations and the `_fn` function is also receiving the chain of
    error transformations to make sure the new stream is aware of it (that way if
    an error occurs on the new stream, the same chain of error transformations is
    applied in a transparent way for the developer).


    ### Dealing With Time


    The last two transformations deal with the timing of events on the stream, because
    sometimes dealing with every single chunk of data received is not what the developer
    needs, in fact, some of those events might be repeated, especially if they''re
    user generated events (not applicable for the back-end but click events on the
    front-end are a very common example here).


    That is why two transformations are provided to deal with such cases (although
    more exist and can easily be added if required): `debounce` and `throttle`. And
    although they might seem to be doing the same thing at first glance, their behavior
    is not exactly the same and the results might be unpredictable if one is used
    when the other should''ve been.


    Let''s start with `debounce` first, the idea behind this one, is that given a
    stream of events, you want to remove the ones that are too close together for
    whatever reason, so you can set a delay time and tell the transformation to `debounce`
    the events using that delay. Let''s see Figure [7-4](#A418015_1_En_7_Chapter.html#Fig4)
    first and then I''ll explain more:


    ![A418015_1_En_7_Fig4_HTML.jpg](A418015_1_En_7_Fig4_HTML.jpg)


    Figure 7-4. Marble diagram for the `debounce` function


    So, again, given a stream of events, debouncing them based on a time delay, means
    emitting only the last event received after there have been no other events for
    the last [delay] period of time. In the diagram of Figure [7-4](#A418015_1_En_7_Chapter.html#Fig4),
    the input is debounced by 3 milliseconds, which means that after a value is received,
    if no other value is received within those 3 milliseconds then it will be emitted
    otherwise it will be ignored. That is why values 2,3,4 and 5 are ignored by 6
    is emitted.


    Now, on the other hand, throttling a stream is similar, yet, different. For this
    one, what it means is that it will emit one event every time the delay is up,
    and if several events happened in the middle, only the last one will be emitted,
    and the rest will be ignored. Figure [7-5](#A418015_1_En_7_Chapter.html#Fig5)
    shows the diagram for throttle:


    ![A418015_1_En_7_Fig5_HTML.jpg](A418015_1_En_7_Fig5_HTML.jpg)


    Figure 7-5. Marble diagram for the `throttle` transformation


    Using the same source stream and the same time delay, you can see how the result
    is different from the previous one, in this case, the values 2 and 5 are also
    emitted, because they were the last ones received during the 3 millisecond intervals.


    Here are two code examples that show how you can use `throttle` and `debounce`
    in your code (they''re made up example with no real world application but you''ll
    get to that in future chapters, don''t worry):


    ```

    var cheese = require("r-cheese").Cheese;

    var ch = new cheese();

    var debounce = require("r-cheese").Utils.debounce;

    var source = [

    //v is the value to emit, d is the delay to wait before emitting it.

    {v: "hola", d: 10},

    {v: "adios", d: 1},

    {v: "goodbye", d: 1},

    {v: "hello", d: 5}];

    var lastTimestamp = 0;

    var index = 0;

    ch.fromFn(function(push) {

    if(Date.now() - lastTimestamp > source[index].d) {

    console.log("Pushing value: ", source[index].v)

    push(source[index].v)

    lastTimestamp = Date.now();

    index++;

    }

    if(index == source.length) {

    push(null);

    }

    }).then(debounce(5)).each(function(n) {

    console.log("::Received value: ", n.toString());

    });

    ```


    The above example for the `debounce` function will emit a series of values in
    different moments of time, with a debounce set of 5 milliseconds, the output is
    shown on Figure [7-6](#A418015_1_En_7_Chapter.html#Fig6):


    ![A418015_1_En_7_Fig6_HTML.jpg](A418015_1_En_7_Fig6_HTML.jpg)


    Figure 7-6. Output of `debounce` example


