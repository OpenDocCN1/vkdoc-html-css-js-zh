    It simply takes care of setting up the HTTP server and the MongoDB connection
    and defining the schema for the model.


    Caution


    When writing code that uses the stream properties of the Request object like the
    previous one, refrain from using the `body-parse` (available at [`https://www.npmjs.com/package/body-parser`](https://www.npmjs.com/package/body-parser)
    ) middleware module for Express, because it will affect it, and your code will
    not work.


    Finally, I’d like to draw your attention to the `SaveUserToDB` stream, which originally
