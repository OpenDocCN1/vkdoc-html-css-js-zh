    marble 图和示例之后，我几乎无需再多做解释。


    # 警告


    Node.js 中创建的间隔在时间精度上并非超级精确，当您设置一个间隔每 X 毫秒执行一个函数时，它实际上至少每 X 毫秒执行一次。这意味着 Node.js
    会尽力遵守设定的时间，但唯一确定的是函数不会提前执行。当您的间隔时间足够长时，不会出现问题，但如果您处理的是非常短的时间限制（如 10 毫秒或更少），则可能会遇到时间问题。


    # 总结


    希望本章能让您获得最后的洞见，以充分理解并在 Node.js 中采用函数式响应式编程。


    本章描述的库是您创建自己的 FRP 库的框架，您可以根据需要添加额外的转换。这些转换大多会是现有转换的变体，或许还有一些新的，但您应该拥有实现这一切所需的一切。


    现在您已经拥有了这个库，在下一章中，我将分析一些后端 FRP 的示例，包括他人完成的示例，以及一个使用 R-CheeseJS 解决的具体案例。


    # 8. 实践概览


    迄今为止，本书已向您介绍了关于函数式响应式编程（FRP）的所有理论。您还拥有一个可运行的 FRP 库实现可供实践，因此您可能会想：还有什么呢？


    本章中，我将介绍一些现实世界公司采用响应式方式的示例，并尝试分析他们的原因和结果。请注意，尽管这些公司未必专门为此目的使用 Node.js，但响应式范式仍然适用，您可以将相关情况推广到实际场景中。


    最后，因为我知道您想要更多代码，我将通过创建一个可用的应用程序（考虑到您将从本书阅读代码的限制，并且我不想让您感到厌烦）来展示更多代码，该应用程序基于 R-Cheese
    库运行。


    ## Netflix 的案例


    Netflix 可能是目前全球最热门的公司之一，哪怕仅仅是因为其品牌在有互联网的地方几乎家喻户晓。但并非所有人都经常想到的是，Netflix 同样也是一家优秀的
    IT 公司！


    由于其流媒体业务所带来的技术挑战，Netflix 不断被迫突破其使用的技术边界。多年来，他们一直是企业级 Node.js 的主要倡导者之一。而最近，他们又在前端和后端都推行函数式响应式方法。由于他们慷慨地在技术博客（[`techblog.netflix.com`](http://techblog.netflix.com)）上分享了经验，我现在可以对此进行介绍。

