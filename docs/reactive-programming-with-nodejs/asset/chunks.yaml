- fmt: "# Reactive 101\nElectronic supplementary material The online version of this\
    \ chapter (doi:[10.1007/978-1-4842-2152-5_1](http://dx.doi.org/10.1007/978-1-4842-2152-5_1))\
    \ contains supplementary material, which is available to authorized users.\n\n\
    The concept of reactive programming (RP) is one of those “old new concepts” that\
    \ tend to fade out of style for a while and then resurface a few years later,\
    \ when no one is looking. This behavior causes new generations of developers,\
    \ specially the early-adopter kind, to initially see it as a revolutionary new\
    \ thing that they need to use.\n\nBut the truth in this case is that the actual\
    \ concept is not exactly new; in fact you’ll see that it has been around for over\
    \ 30 years.\n\nIn this chapter I introduce the concept of RP, talk about who created\
    \ it and when, and describe the types of problems it tries to solve and the different\
    \ types of styles there are. By the end, you'll have all the information you need\
    \ to get you started in the reactive path.\n\n## Defining Reactive Programming\n\
    For me to be able to define RP I need something more than just Wikipedia’s definition,\
    \ I need to talk about when the term was initially mentioned, the type of problems\
    \ it tries to solve, and the different types of RP styles there are.\n\n### The\
    \ Origins of Reactive Programming\nThe concept of RP has been around since 1985.\
    \ It was coined by David Harel and Amir Pnueli back then, in their paper titled\
    \ “On the Development of Reactive Systems” (available at [`www.wisdom.weizmann.ac.il/~harel/SCANNED.PAPERS/ReactiveSystems.pdf`](http://www.wisdom.weizmann.ac.il/%7Eharel/SCANNED.PAPERS/ReactiveSystems.pdf)).\
    \ In it, the authors describe reactive systems as:\n\n> Reactive systems… are\
    \ repeatedly prompted by the outside world and their role is to continuously respond\
    \ to external inputs.\n\nAlthough their definition of reactive systems was never\
    \ meant just for software projects, I’ll keep the book focused on that, since\
    \ it’s what we’re interested in. The same thing was done a few years later by\
    \ Gerard Berry, who in 1989 expanded the concept of reactive systems on the software\
    \ development context in his paper “Real Time Programming: Special Purpose or\
    \ General Purpose Languages” (available at [`https://hal.archives-ouvertes.fr/inria-00075494/document`](https://hal.archives-ouvertes.fr/inria-00075494/document)):\n\
    \n> It is convenient to distinguish roughly between three kinds of computer programs.\
    \ Transformational programs compute results from a given set of inputs; typical\
    \ examples are compilers or numerical computation programs. Interactive programs\
    \ interact at their own speed with users or with other programs; from a user point\
    \ of view a time-sharing system is interactive. Reactive programs also maintain\
    \ a continuous interaction with their environment, but at a speed which is determined\
    \ by the environment, not by the program itself. Interactive programs work at\
    \ their own pace and mostly deal with communications, while reactive programs\
    \ only work in response to external demands and mostly deal with accurate interrupt\
    \ handling. Real-time programs are usually reactive. However, there are reactive\
    \ program that are not usually considered as being real-time, such as protocols,\
    \ system drivers or man-machine interface handlers. All reactive programs require\
    \ a common programming style. Complex applications usually require establishing\
    \ cooperation between the three kinds of programs. For example, a programmer uses\
    \ a man-machine interface involving menus, scroll bars and other reactive devices.\
    \ The reactive interface permits him to tell the interactive operating systems\
    \ to start transformational computations such as program compilations.\n\nTo put\
    \ it another way, RP describes a system that receives input from outside sources\
    \ and is constantly processing them at the speed in which they come.\n\nAnd from\
    \ that, we can also gather that there is a very tight relationship between real-time\
    \ projects and RP, so we will be keeping this in mind for future chapters when\
    \ we start working on our own library.\n\nInterestingly enough and to add a bit\
    \ more to our History Channel moment, reactive systems are designed around dataflows,\
    \ which is another old-but-goodie programming paradigm—in this case, from the\
    \ 1960s. So let’s quickly go into what dataflows are so we can have a better understanding\
    \ of how reactive systems are built, shall we?\n\n### Dataflows 101\nJust like\
    \ RP, dataflow programming (created by Jack Dennis and his graduate students at\
    \ MIT in the 60s) is another of the many programming paradigms out there. In this\
    \ particular case, it works by modeling programs as directed graphs of data flowing\
    \ between operations.\n\nIn this case, the nodes of the graph are the operations\
    \ to be done over the data, and all they need to be executed is their input to\
    \ be available. So in contrast with a more classic programming paradigm (like\
    \ sequential or procedural programming), coming up with an architecture to do\
    \ parallel processing is quite simple, because the only relevant information to\
    \ the entire system is the available data (forget about keeping state, just worry\
    \ about input and output data).\n\nDataflow programs or even dataflow architectures\
    \ are very simple to scale out and grow when handling great amounts of information,\
    \ especially compared to more traditional programs that tend to do everything\
    \ at once instead of splitting the workload between processing units (nodes on\
    \ the graph).\n\nTo put it simply, a dataflow language is one that handles the\
    \ streams of information (data) and sends them from instruction to instruction,\
    \ using flow control statements (like `if` statements) to control the actual flow\
    \ of that stream.\n\nSome examples of that are:\n\n- Unix pipes ([`https://en.wikipedia.org/wiki/Pipeline_(Unix`](https://en.wikipedia.org/wiki/Pipeline_(Unix)))\n\
    - LabVIEW ([`www.ni.com/labview/esa/`](http://www.ni.com/labview/esa/))\n- Ptolemy\
    \ II ([`http://ptolemy.berkeley.edu/ptolemyII/`](http://ptolemy.berkeley.edu/ptolemyII/))\n\
    - Shake ([`https://en.wikipedia.org/wiki/Shake_(software`](https://en.wikipedia.org/wiki/Shake_(software)))\n\
    - And many more…\n\n> Note  \n> This is but a simple introduction to the topic\
    \ of dataflows. If you’re interested in knowing more about the subject, I suggest\
    \ you find a more specific book about it, such as *Dataflow and Reactive Programming\
    \ Systems: A Practical Guide* by Matt Carkci (you can find it on Amazon by searching\
    \ for its name)."
  raw: '# 1. Reactive 101


    Electronic supplementary material The online version of this chapter (doi:[10.​1007/​978-1-4842-2152-5_​1](http://dx.doi.org/10.1007/978-1-4842-2152-5_1))
    contains supplementary material, which is available to authorized users.


    The concept of reactive programming (RP) is one of those “old new concepts” that
    tend to fade out of style for a while and then resurface a few years later, when
    no one is looking. This behavior causes new generations of developers, specially
    the early-adopter kind, to initially see it as a revolutionary new thing that
    they need to use.


    But the truth in this case is that the actual concept is not exactly new; in fact
    you’ll see that it has been around for over 30 years.


    In this chapter I introduce the concept of RP, talk about who created it and when,
    and describe the types of problems it tries to solve and the different types of
    styles there are. By the end, you''ll have all the information you need to get
    you started in the reactive path.


    ## Defining Reactive Programming


    For me to be able to define RP I need something more than just Wikipedia’s definition,
    I need to talk about when the term was initially mentioned, the type of problems
    it tries to solve, and the different types of RP styles there are.


    ### The Origins of Reactive Programming


    The concept of RP has been around since 1985\. It was coined by David Harel and
    Amir Pnueli back then, in their paper titled “On the Development of Reactive Systems”
    (available at [`www.wisdom.weizmann.ac.il/~harel/SCANNED.PAPERS/ReactiveSystems.pdf`](http://www.wisdom.weizmann.ac.il/%7Eharel/SCANNED.PAPERS/ReactiveSystems.pdf)
    ). In it, the authors describe reactive systems as:


    > Reactive systems… are repeatedly prompted by the outside world and their role
    is to continuously respond to external inputs.


    Although their definition of reactive systems was never meant just for software
    projects, I’ll keep the book focused on that, since it’s what we’re interested
    in. The same thing was done a few years later by Gerard Berry, who in 1989 expanded
    the concept of reactive systems on the software development context in his paper
    “Real Time Programming: Special Purpose or General Purpose Languages” (available
    at [`https://hal.archives-ouvertes.fr/inria-00075494/document`](https://hal.archives-ouvertes.fr/inria-00075494/document)
    ):


    > It is convenient to distinguish roughly between three kinds of computer programs.
    Transformational programs compute results from a given set of inputs; typical
    examples are compilers or numerical computation programs. Interactive programs
    interact at their own speed with users or with other programs; from a user point
    of view a time-sharing system is interactive. Reactive programs also maintain
    a continuous interaction with their environment, but at a speed which is determined
    by the environment, not by the program itself. Interactive programs work at their
    own pace and mostly deal with communications, while reactive programs only work
    in response to external demands and mostly deal with accurate interrupt handling.
    Real-time programs are usually reactive. However, there are reactive program that
    are not usually considered as being real-time, such as protocols, system drivers
    or man-machine interface handlers. All reactive programs require a common programming
    style. Complex applications usually require establishing cooperation between the
    three kinds of programs. For example, a programmer uses a man-machine interface
    involving menus, scroll bars and other reactive devices. The reactive interface
    permits him to tell the interactive operating systems to start transformational
    computations such as program compilations.


    To put it another way, RP describes a system that receives input from outside
    sources and is constantly processing them at the speed in which they come.


    And from that, we can also gather that there is a very tight relationship between
    real-time projects and RP, so we will be keeping this in mind for future chapters
    when we start working on our own library.


    Interestingly enough and to add a bit more to our History Channel moment, reactive
    systems are designed around dataflows, which is another old-but-goodie programming
    paradigm—in this case, from the 1960s. So let’s quickly go into what dataflows
    are so we can have a better understanding of how reactive systems are built, shall
    we?


    ### Dataflows 101


    Just like RP, dataflow programming (created by Jack Dennis and his graduate students
    at MIT in the 60s) is another of the many programming paradigms out there. In
    this particular case, it works by modeling programs as directed graphs of data
    flowing between operations.


    In this case, the nodes of the graph are the operations to be done over the data,
    and all they need to be executed is their input to be available. So in contrast
    with a more classic programming paradigm (like sequential or procedural programming),
    coming up with an architecture to do parallel processing is quite simple, because
    the only relevant information to the entire system is the available data (forget
    about keeping state, just worry about input and output data).


    Dataflow programs or even dataflow architectures are very simple to scale out
    and grow when handling great amounts of information, especially compared to more
    traditional programs that tend to do everything at once instead of splitting the
    workload between processing units (nodes on the graph).


    To put it simply, a dataflow language is one that handles the streams of information
    (data) and sends them from instruction to instruction, using flow control statements
    (like `if` statements) to control the actual flow of that stream.


    Some examples of that are:


    *   Unix pipes ( [`https://en.wikipedia.org/wiki/Pipeline_(Unix`](https://en.wikipedia.org/wiki/Pipeline_(Unix)
    `)`)

    *   LabVIEW ( [`www.ni.com/labview/esa/`](http://www.ni.com/labview/esa/) `)`

    *   Ptolemy II ( [`http://ptolemy.berkeley.edu/ptolemyII/`](http://ptolemy.berkeley.edu/ptolemyII/)
    `)`

    *   Shake ( [`https://en.wikipedia.org/wiki/Shake_(software`](https://en.wikipedia.org/wiki/Shake_(software)
    `))`

    *   And many more…


    Note


    This is but a simple introduction to the topic of dataflows. If you’re interested
    in knowing more about the subject, I suggest you find a more specific book about
    it, such as Dataflow and Reactive Programming Systems: A Practical Guide by Matt
    Carkci (you can find it on Amazon by searching for its name).'
  trans: "\n# React 式编程入门\n本书的电子补充材料可在本章的在线版本中获取（doi:[10.1007/978-1-4842-2152-5_1](http://dx.doi.org/10.1007/978-1-4842-2152-5_1)），该材料仅供授权用户使用。\n\
    \nReact 式编程（RP）的概念属于那种“老派新概念”，往往会在一段时间内淡出潮流，然后在几年后，当无人注意时又重新浮出水面。这种现象使得新一代开发者，尤其是那些早期采用者，最初会将其视为需要掌握的革命性新事物。\n\
    \n但事实是，这一概念并非全新；实际上，你会发现它已经存在了 30 多年。\n\n在本章中，我将介绍 RP 的概念，探讨其诞生背景与创始人，描述它试图解决的问题类型，以及存在的不同风格。到本章结束时，你将掌握开启\
    \ React 式编程之路所需的所有信息。\n\n## 定义 React 式编程\n要定义 RP，我需要的不仅仅是维基百科的定义，还需要讨论这个术语最初被提及的时间、它试图解决的问题类型，以及现有的不同\
    \ RP 风格。\n\n### React 式编程的起源\nRP 的概念自 1985 年起就已存在。它由 David Harel 和 Amir Pnueli\
    \ 在当时的论文《论 React 式系统的开发》（可于[`www.wisdom.weizmann.ac.il/~harel/SCANNED.PAPERS/ReactiveSystems.pdf`](http://www.wisdom.weizmann.ac.il/%7Eharel/SCANNED.PAPERS/ReactiveSystems.pdf)获取）中提出。在文中，作者将\
    \ React 式系统描述为：\n\n> React 式系统……会反复受到外部世界的提示，其作用是持续对外部输入做出响应。\n\n尽管他们对 React 式系统的定义并不局限于软件项目，但本书将聚焦于此，因为这是我们感兴趣的领域。几年后，Gerard\
    \ Berry 也做了类似的工作，他于 1989 年在论文《实时编程：专用语言还是通用语言》（可于[`https://hal.archives-ouvertes.fr/inria-00075494/document`](https://hal.archives-ouvertes.fr/inria-00075494/document)获取）中，在软件开发背景下扩展了\
    \ React 式系统的概念：\n\n> 大致区分三种计算机程序是方便的。转换式程序从给定的输入集计算出结果；典型的例子是编译器或数值计算程序。交互式程序以自身速度与用户或其他程序进行交互；从用户角度看，分时系统是交互式的。React\
    \ 式程序也与环境保持持续交互，但交互速度由环境决定，而非程序本身。交互式程序按自身节奏运行，主要处理通信；而 React 式程序仅在响应外部请求时工作，主要处理精确的中断处理。实时程序通常是\
    \ React 式程序。然而，也有一些 React 式程序通常不被视为实时程序，例如协议、系统驱动程序或人机界面处理器。所有 React 式程序都需要共同的编程风格。复杂的应用程序通常需要建立这三种程序之间的协作。例如，程序员使用涉及菜单、滚动条和其他\
    \ React 式设备的人机界面。该 React 式界面允许他告诉交互式操作系统启动转换式计算，如程序编译。\n\n换句话说，RP 描述了一个从外部源接收输入，并以输入到达的速度持续处理这些输入的系统。\n\
    \n由此，我们还可以推断出实时项目与 RP 之间存在非常紧密的关系，因此在后续章节中，当我们开始构建自己的库时，将牢记这一点。\n\n有趣的是，再补充一点历史背景，React\
    \ 式系统是围绕数据流设计的，而数据流是另一个“老旧但优秀”的编程范式——这次是来自 20 世纪 60 年代。那么，让我们快速了解一下什么是数据流，以便更好地理解\
    \ React 式系统是如何构建的，好吗？\n\n### 数据流入门\n与 RP 一样，数据流编程（由 Jack Dennis 及其在麻省理工学院的研究生在\
    \ 20 世纪 60 年代创建）是众多编程范式中的一种。在这种特定情况下，它的工作原理是将程序建模为操作之间数据流动的有向图。\n\n在这种情况下，图的节点是对数据执行的操作，而执行这些操作所需的全部条件是它们的输入可用。因此，与更经典的编程范式（如顺序编程或过程式编程）相比，提出一个用于并行处理的架构相当简单，因为整个系统中唯一相关的信息就是可用数据（忘记状态维护，只需关注输入和输出数据）。\n\
    \n数据流程序甚至数据流架构在处理大量信息时非常容易扩展和增长，特别是与那些倾向于一次性完成所有工作而不将工作负载拆分到处理单元（图中的节点）上的传统程序相比。\n\
    \n简单来说，数据流语言是一种处理信息流（数据）并将其从一条指令发送到另一条指令的语言，它使用流控制语句（如 `if` 语句）来控制该流的实际流向。\n\n\
    以下是一些例子：\n\n- Unix 管道 ([`https://en.wikipedia.org/wiki/Pipeline_(Unix`](https://en.wikipedia.org/wiki/Pipeline_(Unix)))\n\
    - LabVIEW ([`www.ni.com/labview/esa/`](http://www.ni.com/labview/esa/))\n- Ptolemy\
    \ II ([`http://ptolemy.berkeley.edu/ptolemyII/`](http://ptolemy.berkeley.edu/ptolemyII/))\n\
    - Shake ([`https://en.wikipedia.org/wiki/Shake_(software`](https://en.wikipedia.org/wiki/Shake_(software)))\n\
    - 以及更多……\n\n> 注意  \n> 这仅仅是对数据流主题的简单介绍。如果你有兴趣了解更多相关内容，我建议你寻找一本更专业的书籍，例如 Matt Carkci\
    \ 的《数据流与 React 式编程系统：实用指南》（你可以在亚马逊上搜索书名找到它）。\n"
- fmt: "### How Dataflows and Reactive Programming Are Related\n\nAs we’ve seen, dataflows\
    \ dictate that information can flow from node to node, where each node is an operation\
    \ done on the data transmitted. This flow is one-way, in the sense that once the\
    \ piece of data reaches the end node, the process is done. It can start again\
    \ with another piece of data, but that’s not strictly required.\n\nReactive programming,\
    \ on the other hand, could be thought of as dataflows on steroids, for the following\
    \ reasons:\n\n- With RP we gain the concept of event streams, a source of continuous\
    \ data where we can subscribe as the source for our operations.\n- Because we\
    \ now have the streams, we can also apply transformations to these streams, essentially\
    \ creating new ones from the original one.\n- One specific transformation we can\
    \ apply to them, is the merge of several streams, a powerful operation that allows\
    \ us to work with several streams at once.\n- So basically, one can say that a\
    \ dataflow routine is what happens to one particular piece of information that\
    \ comes through one event stream.\n\nIn order to make the point completely clear,\
    \ please look at Figure [1-1](#A418015_1_En_1_Chapter.html#Fig1), which shows\
    \ how a simple case of two variables being added can be incorporated into a reactive\
    \ diagram with two continuous streams of numbers.\n\n![A418015_1_En_1_Fig1_HTML.jpg](A418015_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1. Marble diagram showing the addition of values from two different\
    \ streams\n\nFigure [1-1](#A418015_1_En_1_Chapter.html#Fig1) shows each event\
    \ on each stream as a circle, then a merge operation being done on both streams\
    \ to create a new one, with a pair of numbers on each event. Finally, we add both\
    \ numbers to return only one to yet, another stream. The horizontal lines represent\
    \ time, and you can clearly see where the dataflow diagram fits into this one,\
    \ basically cutting vertically through all layers of the reactive diagram.\n\n\
    **Note:** This particular example makes the assumption that all events on both\
    \ streams will be added at exactly the same time, thus simplifying the merging\
    \ task.\n\n### What Is RP Good For?\n\nThe classic example everyone gives when\
    \ they're trying to explain how a reactive system works is that of a spreadsheet.\
    \ Current spreadsheet software, like that of Google Docs, Microsoft Excel, or\
    \ LibreOffice, all provide the ability to create formulas that depend on the values\
    \ of certain cells, something like this:\n\n```\n=sum(A1:A20)\n```\n\nThe code\
    \ is very simple to understand, it will execute the mathematical sum of all values\
    \ from cell A1 to, and including, the value of A20. Now the neat thing about this\
    \ formula is not its result but the fact that we’re referencing the actual cells\
    \ involved in the calculation and not only their values. This effectively means\
    \ that we can affect the content of those cells and the final result will be updated\
    \ accordingly.\n\nNow let’s extrapolate that concept and apply it to our day-to-day\
    \ programming language of choice. I’m not going to focus on the paradigm we’re\
    \ using just now—it's not important at the moment. Now let's say we have some\
    \ Node.js code. If you could subscribe to what happens to a particular variable,\
    \ something like the following:\n\n```\nvar myVariable = \"initial value\";\n\
    myVariable.onchange(function(new_vaule) {\n  //... act accordingly\n});\n```\n\
    \nJust think how simple your code would become if you had the ability to do that\
    \ instead of needing to monitor the value of the variable for any change and manually\
    \ executing the registered callback functions.\n\nNow let’s take the previous\
    \ example one step further. Let’s think of any change to a specific variable as\
    \ an event, and let’s consider for a second that any response from an asynchronous\
    \ service call is a change on the receiving variable (meaning on the variable\
    \ you save the async response to), which would turn that response into an event\
    \ as well. We can register to those event streams and react when new data are\
    \ available.\n\nFor front-end programmers, this paradigm is probably very familiar,\
    \ since they normally handle that type of mechanics when registering mouse-related\
    \ event handlers (just to name one example). But that’s already built into the\
    \ DOM; the beauty of this is that we can do it for any type of service. For API\
    \ calls, for instance, we can register one or more callbacks and just let them\
    \ handle the responses when they start getting back to us.\n\nThe same goes to\
    \ back-end developers, even though Node developers aren’t that used to working\
    \ with events (they have them, they’re just not that common on the back-end, that’s\
    \ all), turning every database connection and every file read event into a source\
    \ for an event stream could definitely simplify the code and the way we handle\
    \ things like errors.\n\nBut wait! There is more! One more actually. With the\
    \ aforementioned characteristics, reactive libraries all over are implementing\
    \ transformations over the events on the streams, while at the same time treating\
    \ these events as immutable entities. What this effectively means is that we can\
    \ create new streams of events by mixing and chaining these transformations.\n\
    \nLet’s look at a basic example. Consider the front-end comment from earlier.\
    \ Streams of click events are probably one of the most common ones you’ll find\
    \ there. Now, what if you wanted to just capture the left-click events but also\
    \ keep the full list of click events available for other parts of our code? Easy\
    \ peasy, as Figure [1-2](#A418015_1_En_1_Chapter.html#Fig2) shows.\n\n![A418015_1_En_1_Fig2_HTML.jpg](A418015_1_En_1_Fig2_HTML.jpg)\n\
    \nFigure 1-2. Sample marble diagram showing a filtering operation over mouse clicks\n\
    \nThe diagram shows how new events appear on the stream as time moves forward\
    \ (horizontal lines) and the operation being done over the initial stream (filter)\
    \ in order to create a new one.\n\nLet’s take a more complex example. Say you\
    \ have two buttons, Add and Subtract, and you want your code to add 1 to a counter\
    \ every time you click the Add button, and to subtract 1 from the same counter\
    \ every time you click Subtract. Figure [1-3](#A418015_1_En_1_Chapter.html#Fig3)\
    \ illustrates this.\n\n![A418015_1_En_1_Fig3_HTML.jpg](A418015_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3. Marble diagram showing a merge operation between two streams\n\n\
    Figure [1-3](#A418015_1_En_1_Chapter.html#Fig3) translates actual events to just\
    \ a stream of numbers (1 or –1) and then we merge them, creating a new one. Each\
    \ value returned by this new “counter” stream will be handled by a function that\
    \ will simply add the returned value to the current counter shown on screen. Simple,\
    \ yet powerful.\n\nSo basically, to sum things up and answer the original question\
    \ in a more concise way, RP allows you, the developer, to handle streams of asynchronous\
    \ events with ease and transform them into new streams. It is a paradigm that\
    \ can be applied both for the back-end as well as for the front-end."
  raw: '### How Dataflows and Reactive Programming Are Related


    As we’ve seen, dataflows dictate that information can flow from node to node,
    where each node is an operation done on the data transmitted. This flow is one-way,
    in the sense that once the piece of data reaches the end node, the process is
    done. It can start again with another piece of data, but that’s not strictly required.


    Reactive programming, on the other hand, could be thought of as dataflows on steroids,
    for the following reasons:


    *   With RP we gain the concept of event streams, a source of continuous data
    where we can subscribe as the source for our operations.

    *   Because we now have the streams, we can also apply transformations to these
    streams, essentially creating new ones from the original one.

    *   One specific transformation we can apply to them, is the merge of several
    streams, a powerful operation that allows us to work with several streams at once.

    *   So basically, one can say that a dataflow routine is what happens to one particular
    piece of information that comes through one event stream.


    In order to make the point completely clear, please look at Figure [1-1](#A418015_1_En_1_Chapter.html#Fig1),
    which shows how a simple case of two variables being added can be incorporated
    into a reactive diagram with two continuous streams of numbers.


    ![A418015_1_En_1_Fig1_HTML.jpg](A418015_1_En_1_Fig1_HTML.jpg)


    Figure 1-1.


    Marble diagram showing the addition of values from two different streams


    Figure [1-1](#A418015_1_En_1_Chapter.html#Fig1) shows each event on each stream
    as a circle, then a merge operation being done on both streams to create a new
    one, with a pair of numbers on each event. Finally, we add both numbers to return
    only one to yet, another stream. The horizontal lines represent time, and you
    can clearly see where the dataflow diagram fits into this one, basically cutting
    vertically through all layers of the reactive diagram.


    Note


    This particular example makes the assumption that all events on both streams will
    be added at exactly the same time, thus simplifying the merging task.


    ### What Is RP Good For?


    The classic example everyone gives when they''re trying to explain how a reactive
    system works is that of a spreadsheet . Current spreadsheet software , like that
    of Google Docs, Microsoft Excel, or LibreOffice, all provide the ability to create
    formulas that depend on the values of certain cells, something like this:


    ```

    =sum(A1:A20)

    ```


    The code is very simple to understand, it will execute the mathematical sum of
    all values from cell A1 to, and including, the value of A20\. Now the neat thing
    about this formula is not its result but the fact that we’re referencing the actual
    cells involved in the calculation and not only their values. This effectively
    means that we can affect the content of those cells and the final result will
    be updated accordingly. Just like magic, only not.


    Now let’s extrapolate that concept and apply it to our day-to-day programming
    language of choice. I’m not going to focus on the paradigm we’re using just now—it''s
    not important at the moment. Now let''s say we have some Node.js code. If you
    could subscribe to what happens to a particular variable, something like the following:


    ```

    var myVariable = "initial value";

    myVariable.onchange(function(new_vaule) {

    //... act accordingly

    });

    ```


    Just think how simple your code would become if you had the ability to do that
    instead of needing to monitor the value of the variable for any change and manually
    executing the registered callback functions.


    Now let’s take the previous example one step further. Let’s think of any change
    to a specific variable as an event, and let’s consider for a second that any response
    from an asynchronous service call is a change on the receiving variable (meaning
    on the variable you save the asynch response to), which would turn that response
    into an event as well. We can register to those event streams and react when new
    data are available.


    For front-end programmers , this paradigm is probably very familiar, since they
    normally handle that type of mechanics when registering mouse-related event handlers
    (just to name one example). But that’s already built into the DOM; the beauty
    of this is that we can do it for any type for service. For API calls, for instance,
    we can register one or more callbacks and just let them handle the responses when
    they start getting back to us.


    The same goes to back-end developers , even though Node developers aren’t that
    used to working with events (they have them, they’re just not that common on the
    back-end, that’s all), turning every database connection and every file read event
    into a source for an event stream could definitely simplify the code and the way
    we handle things like errors.


    But wait! There is more! One more actually. With the aforementioned characteristics
    , reactive libraries all over are implementing transformations over the events
    on the streams, while at the same time treating these events as immutable entities.
    What this effectively means is that we can create new streams of events by mixing
    and chaining these transformations.


    Let’s look at a basic example. Consider the front-end comment from earlier. Streams
    of click events are probably one of the most common ones you’ll find there. Now,
    what if you wanted to just capture the left-click events but also keep the full
    list of click events available for other parts of our code? Easy peasy, as Figure
    [1-2](#A418015_1_En_1_Chapter.html#Fig2) shows.


    ![A418015_1_En_1_Fig2_HTML.jpg](A418015_1_En_1_Fig2_HTML.jpg)


    Figure 1-2.


    Sample marble diagram showing a filtering operation over mouse clicks


    The diagram shows how new events appear on the stream as time moves forward (horizontal
    lines) and the operation being done over the initial stream (filter) in order
    to create a new one.


    Let’s take a more complex example. Say you have two buttons, Add and Subtract,
    and you want your code to add 1 to a counter every time you click the Add button,
    and to subtract 1 from the same counter every time you click Subtract. Figure
    [1-3](#A418015_1_En_1_Chapter.html#Fig3) illustrates this.


    ![A418015_1_En_1_Fig3_HTML.jpg](A418015_1_En_1_Fig3_HTML.jpg)


    Figure 1-3.


    Marble diagram showing a merge operation between two streams


    Figure [1-3](#A418015_1_En_1_Chapter.html#Fig3) translates actual events to just
    a stream of numbers (1 or –1) and then we merge them, creating a new one. Each
    value returned by this new “counter” stream will be handled by a function that
    will simply add the returned value to the current counter shown on screen. Simple,
    yet powerful.


    So basically, to sum things up and answer the original question in a more concise
    way, RP allows you, the developer, to handle streams of asynchronous events with
    ease and transform them into new streams It is a paradigm that can be applied
    both for the back-end as well as for the front-end.'
  trans: "\n### 数据流与响应式编程的关系\n\n如我们所见，数据流规定了信息可以在节点间流动，每个节点都是对传输数据执行的一项操作。这种流动是单向的，也就是说，一旦数据到达末端节点，流程就结束了。它可以随另一份数据重新开始，但这并非强制要求。\n\
    \n另一方面，响应式编程可以被看作数据流的增强版，原因如下：\n\n-   借助 RP，我们获得了事件流的概念，这是一个连续的数据源，我们可以订阅它作为我们操作的源头。\n\
    -   既然我们有了流，我们也可以对这些流应用转换，本质上是从原始流创建新的流。\n-   我们可以对它们应用的一种特定转换是合并多个流，这是一种强大的操作，允许我们同时处理多个流。\n\
    -   所以基本上，我们可以说，一个数据流例程就是一个通过某个事件流传入的特定信息片段所发生的情况。\n\n为了完全说清楚这一点，请查看图 1-1，它展示了两个变量相加的简单案例如何被纳入一个带有两个连续数字流的响应式图中。\n\
    \n![A418015_1_En_1_Fig1_HTML.jpg](img/A418015_1_En_1_Fig1_HTML.jpg)\n\n图 1-1。展示来自两个不同流的值相加的弹珠图\n\
    \n图 1-1 将每个流上的每个事件显示为一个圆圈，然后对两个流执行合并操作以创建一个新流，每个事件上有一对数字。最后，我们将两个数字相加，只返回一个数字给另一个流。水平线代表时间，你可以清楚地看到数据流图在其中的位置，基本上是垂直切入响应式图的所有层级。\n\
    \n**注意：** 这个特定例子假设两个流上的所有事件将在完全相同的时间被相加，从而简化了合并任务。\n\n### RP 有什么用？\n\n人们在尝试解释响应式系统如何工作时，给出的经典例子就是电子表格。当前的电子表格软件，如\
    \ Google Docs、Microsoft Excel 或 LibreOffice，都提供了创建依赖于某些单元格值的公式的能力，类似这样：\n\n```\n\
    =sum(A1:A20)\n```\n\n这段代码非常容易理解，它将计算从单元格 A1 到 A20（含）所有值的数学总和。这个公式的妙处不在于其结果，而在于我们引用的是参与计算的实际单元格，而不仅仅是它们的值。这实际上意味着我们可以修改这些单元格的内容，最终结果也会相应更新。\n\
    \n现在让我们将这个概念外推，并将其应用到我们日常选择的编程语言中。我不打算关注我们目前使用的范式——这在当下并不重要。现在假设我们有一些 Node.js\
    \ 代码。如果你能订阅某个特定变量的变化，比如像下面这样：\n\n```\nvar myVariable = \"initial value\";\nmyVariable.onchange(function(new_vaule)\
    \ {\n  //... 做出相应处理\n});\n```\n\n试想一下，如果你具备这种能力，而无需监控变量值的变化并手动执行注册的回调函数，你的代码会变得多么简单。\n\
    \n现在让我们把前面的例子再推进一步。我们将对特定变量的任何更改视为一个事件，并暂时考虑异步服务调用的任何响应都是接收变量（即保存异步响应的那个变量）的一个变化，这也会把该响应变成一个事件。我们可以注册到这些事件流，并在新数据可用时做出响应。\n\
    \n对于前端程序员来说，这个范式可能非常熟悉，因为他们在注册鼠标相关事件处理器时（仅举一例），通常会处理这种类型的机制。但这已经是 DOM 内置的功能；其美妙之处在于我们可以为任何类型的服务做到这一点。例如，对于\
    \ API 调用，我们可以注册一个或多个回调，并让它们在开始返回响应时就处理这些响应。\n\n这同样适用于后端开发者，尽管 Node 开发者并不那么习惯于处理事件（他们有事件，只是在后端不那么常见而已），将每个数据库连接和每个文件读取事件都变成事件流的来源，无疑可以简化代码以及我们处理错误之类事情的方式。\n\
    \n但等等！还有更多！实际上还有一个。凭借上述特性，各地的响应式库都在对流上的事件应用转换，同时将这些事件视为不可变实体。这实际上意味着我们可以通过混合和链接这些转换来创建新的事件流。\n\
    \n让我们看一个基本示例。想想之前的前端评论。点击事件流可能是那里最常见的之一。现在，如果你只想捕获左键点击事件，但同时又要为代码的其他部分保留完整的点击事件列表，该怎么办？非常简单，如图\
    \ 1-2 所示。\n\n![A418015_1_En_1_Fig2_HTML.jpg](img/A418015_1_En_1_Fig2_HTML.jpg)\n\
    \n图 1-2。展示对鼠标点击执行过滤操作的示例弹珠图\n\n该图展示了随着时间推移（水平线），新事件如何在流上出现，以及对初始流执行的操作（过滤）以便创建一个新流。\n\
    \n让我们看一个更复杂的例子。假设你有两个按钮，“加”和“减”，并且你希望代码在每次点击“加”按钮时给计数器加 1，每次点击“减”按钮时从同一计数器减 1。图\
    \ 1-3 说明了这一点。\n\n![A418015_1_En_1_Fig3_HTML.jpg](img/A418015_1_En_1_Fig3_HTML.jpg)\n\
    \n图 1-3。展示两个流之间合并操作的弹珠图\n\n图 1-3 将实际事件转换为一个数字流（1 或 –1），然后我们将它们合并，创建一个新的流。这个新的“计数器”流返回的每个值将由一个函数处理，该函数只需将返回的值加到屏幕上显示的当前计数器上。简单，却强大。\n\
    \n所以，基本上，为了总结并以更简洁的方式回答最初的问题，RP 允许你（开发者）轻松处理异步事件流，并将它们转换为新的流。这是一个既可以应用于后端也可以应用于前端的范式。\n"
- fmt: '### Reactive vs. Observer Pattern


    With everything talked about so far, you might say that RP is just an implementation
    of the observer pattern and that by using that, you would get the same results.


    Not quite. Consider for a moment that I’m not really focusing on JavaScript just
    yet, or any language for that matter, so first off, you can’t really think in
    object-oriented programming (OOP) terms when some languages don’t even speak it
    (you might accomplish something similar without OOP, mind you, but that’s outside
    the point). And even if they do, conceptually they’re similar but not the same.
    Check out Table [1-1](#A418015_1_En_1_Chapter.html#Tab1) for a quick look.


    **Table 1-1.** Comparison of the Observer Pattern vs. the RP Paradigm


    | Observer Pattern | Reactive Programming |

    | --- | --- |

    | Meant to report state to registered observers. | When the value of a variable
    changes, all other values that depend on it will consequently get updated. |

    | Works on whole objects. | Level of granularity reaches the single primitive
    variable. |

    | Offers direct communication between observed objects and observers. In other
    words, the state of the observed object is transmitted without any change. | Transformations
    can be applied to each transmitted event, creating new ones on the way. |


    If you want, you can think of RP as going one step further from a simple observer
    implementation, since you’re not just notifying the interested observer, you’re
    also automatically reacting (see what I did there?) accordingly by updating the
    related elements.


    ## Types of Reactive Programming


    There are several approaches to RP. They mainly depend on the programming language
    you’re using, and they all get the job done, so picking the right one is purely
    a preference thing.


    This section looks at the three most common approaches these days: functional,
    object-oriented, and declarative.


    ### Functional Reactive Programming


    Next to object-oriented RP (discussed soon), functional RP (FRP) is probably the
    most common approach currently being used. And that might be because the concepts
    already discussed (especially how stream transformations can be done) can be mapped
    to a functional approach.


    To be more specific, FRP uses the building blocks of functional programming (like
    `map`, `reduce`, and `filter`) to process and transform the streams of events
    generated by the asynchronous sources that we might be dealing with.


    Future chapters go into more detail about FRP. Here I’ll just look at a quick
    example of the benefits you can get from this approach. Think of a generic microservice
    architecture, with two particular endpoints:


    ```

    /users #will return the list of users on the system, but with minimum data (only
    id and full name)

    /users/:id #will return the details of a particular user, which could imply things
    like id, full name, date of birth, address and telephone number.

    ```


    Granted that this definition might not be the smartest API design, but let’s go
    with it for the purpose of this example. What I want from this is the list of
    users, but with full details on each of them.


    Now a traditional Node.js approach would be to do something like:


    ```

    request(''/users'', function(users) {

    async.map(users, function(user, done) {

    request(''/users/'' + user.id, function(userData){

    console.log("User data obtained for user: ",  user.id);

    done(null, userData);

    }, function(fullUsers) {

    //return the list to the client

    });

    }

    });

    ```


    Nothing wrong with the preceding code, actually, and that is in part because I’m
    using the `async` library (available at [`http://caolan.github.io/async/`](http://caolan.github.io/async/)).
    Without it, the iteration between users to request their full data would have
    meant quite a lot more lines of code and, even worse, more logic thrown into the
    mix. And this is key to why FRP is so great—the focus of the developer should
    be on solving the problem at hand (in this case, getting a list of full user objects)
    and not on how to solve the problems presented by the technology used (in this
    case, we’re referring to the asynchronicity of the requests).


    Again, there is nothing wrong with the preceding code, but look at Figure [1-4](#A418015_1_En_1_Chapter.html#Fig4).


    ![A418015_1_En_1_Fig4_HTML.jpg](A418015_1_En_1_Fig4_HTML.jpg)


    **Figure 1-4.** Marble diagram with the RP approach of the current example


    And now look at the following code:


    ```

    GetUsers()

    .map(function(u) {

    return ''/users/'' + u.id;

    })

    .pipe(getUserDetails)

    .flatMap();

    ```


    > **Note:** The preceding code is not referencing any specific reactive library
    for Node.js. Its purpose is to show the reader the simplifications that come from
    using this approach.


    Granted, the code is also simplified because we’re not directly calling the `request`
    function, but it is also much easier to read and simpler to understand. The indentation
    level of the callbacks is kept in check, even if we were to add an extra step
    in the flow.


    Here’s what’s happening in the preceding code, step-by-step:


    1. Generate a stream of users, by making the request and then returning the stream
    of users back.

    2. We’re applying one transformation to the stream, generating urls for each user''s
    details endpoint based on the user objects.

    3. Each url is piped to the `getUserDetails` function, which will in turn request
    the data from that URL and return the information. This operation can be done
    asynchronously without any added complexity, but the order of the users will be
    lost.

    4. Finally, we flatten the resulting stream of lists, and get a stream of full
    user objects. For the purpose of this example, just assume that `flatMap` also
    turns the resulting stream into an actual list, but that would depend on the implementation
    of `flatMap` you’re using. I’ll go into more detail about that once I start implementing
    the custom FRP library.


    ### Object-Oriented Reactive Programming


    OORP states that objects will have reactions (asides from properties and methods)
    that will be re-evaluated when the data they depend on changes.


    Let’s look at the example I talked about before, two buttons and a counter; in
    this example, the buttons are objects and they can react to events, like “click”
    events. The following code uses the popular front-end library jQuery to provide
    the basic OORP functionality:


    ```

    //Sets the value of the “counter” based on the streams of events generated by
    both buttons

    function setCounter() {

    var value = $("#add").data(''values'').length - $("#substract").data(''values'').length;

    $("#counter").text(value);

    }

    $("#substract").click(function() {

    var stream = $(this).data(''values'')

    stream.push(1);

    $(this).data(''values'', stream);

    setCounter();

    });

    $("#add").click(function() {

    var stream = $(this).data(''values'')

    stream.push(1);

    $(this).data(''values'', stream);

    setCounter();

    });

    ```


    > **Note:** The preceding example clearly lacks all the boilerplate code needed
    to import the library, set up the initial state, and so on. That is not needed
    to make the point of OORP.


    In the example code, you can clearly see that the `#counter` element’s value depends
    directly on the values added to the streams represented by the arrays on the `#add`
    button and the `#substract` one. The `setCounter` function takes care of ensuring
    that relationship.


    The language I’m using for the example is JavaScript, and because it isn’t purely
    reactive, I have to manually handle some of the magic. In this case, the update
    on the final value depending on the streams has to be done manually. That being
    said, on the other hand, the reaction re-evaluation is done automatically by the
    system when a click event occurs, and that is completely done for us.'
