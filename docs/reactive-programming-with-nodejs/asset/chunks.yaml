    in JSON format). Table [4-2](#A418015_1_En_4_Chapter.html#Tab2) shows the implementation
    of the diagram in Figure [4-1](#A418015_1_En_4_Chapter.html#Fig1).


    Table 4-2.


    Side-by-Side Comparison of the Code for Listing Users


    | Reactive Code | Regular Implementation |

    | --- | --- |

    | `var list = new oStream();` | `router.get(''/'', function(req, res, next) {`
    |

    |     `list.data` |     `models.users.find({})` |

    |     `.setVars({''httpResponse'': get(1),` |         `.populate(''addresses'')`
    |

    |     `''next'': get(2)})` |         `.then(res.json.bind(res))` |

    |     `.then(find({}))` |         `.catch(next);` |

    |     `.then(populate(''addresses''))` | `});` |

    |     `.then(execute)` |   |

    |     `.done(toJSONResponse)` |   |

    |     `.catch(callErrorHandler);` |   |


    It’s true, our new version has more code than the old one, but that is sometimes
    an unfortunate side effect of a higher level of abstraction. It might be difficult
    to see the benefits of our approach with solely this example, so let’s keep going.


    Note


    You might have noticed that in the previous comparison the reactive code does
    not show the router-related part while the regular implementation does. This is
    because for the reactive version of the application, I have split the routing
    and the actual business logic, while on the regular version they were both the
    same.


    The helper functions are described further ahead in this chapter, so don’t worry
    if you don’t understand how they work just yet. You will.


    ##### Creating a New User


    Creating users is another of the simple ones, since it relies entirely on the
    ORM''s methods. Still let’s take a look at how you would structure your logic
    in Figure [4-2](#A418015_1_En_4_Chapter.html#Fig2).


    ![A418015_1_En_4_Fig2_HTML.jpg](A418015_1_En_4_Fig2_HTML.jpg)


    Figure 4-2.


    Marble diagram describing the reactive logic of creating a new user


    Sadly, because you’re dealing with a non-reactive web framework, you have to manually
    deal with the parameters of the request (which is what the first step of the process
    is). After that, you just get the body of the request, create and perform the
    `save` query, and, finally, return the JSON representation of the new user.


    Now take a look at Table [4-3](#A418015_1_En_4_Chapter.html#Tab3) for a view of
    the new code.


    Table 4-3.


    Side-by-Side Comparison of the Code Required to Create a New User


    | Reactive Code | Regular Code |

    | --- | --- |

    | `newUsers.data`     `.setVars({''httpResponse'': get(1), ''next'': get(2)})`
        `.then(get(0))`     `.then(get(''body''))`     `.then(models.users.create.bind(models.users))`
        `.done(toJSONResponse)`     `.catch(callErrorHandler);` | `router.post(''/'',
    function(req, res, next) {`     `models.users.create(req.body)`         `.then(function(usr)
    {`         `res.json(usr);`         `})`         `.catch(next);` `});` |


    One thing to note about the code is that since you’re passing the `create` method
    from Mongoose on the 4^(th) `then` call, you need to correctly bind it to the
    model. Otherwise the function will be executed without a context and it will fail.


    Note


    I’ll skip over the update a user, delete a user ,and get a user’s data methods,
    because they’re pretty much the same as the one earlier. They will be provided
    as part of the code bundle of the book.'
  trans: '

    #### 路由器文件


    让我们先回顾一下之前的实现中的这个文件；那里编写了所有业务逻辑，同时也是 Express 完成路由匹配的地方。对于本次实现，我将从中移除业务逻辑，仅保留路由匹配，代码如下所示：


    ```

    var collections = require("./collections-rfrp  "),

    router = require("express").Router(),

    _ = require("lodash");

    var mapping = {

    ''/'': {

    ''get'': collections.listUsersCollection,

    ''post'': collections.newUsersCollection

    },

    ''/:id'': {

    ''get'': collections.getUserDataColection,

    ''put'': collections.updateUserCollection,

    ''delete'': collections.deleteUsersCollection

    },

    ''/:id/addresses'': {

    ''post'': collections.newAddressCollection

    }

    };

    ```


    这段 JSON 将每个端点映射到不同的可观察集合，而以下代码负责将请求、响应以及每次请求接收到的 `next` 函数添加到对应的集合中。


    ```

    //we set up the urls

    _.each(mapping, function (actions, url) {

    _.each(actions, function(collection, method) {

    routermethod { //this is the code that every route will actually execute

    collection.add(arguments);  //we pass the arguments object because we want to
    have access to all three parameters in one

    });

    });

    });

    module.exports = router;

    ```


    正如我之前提到的，这段代码非常简单。它实际上并不具备响应式或其他特性，只是负责将新事件添加到对应的集合中。


    #### 新的业务逻辑


    从上述代码可以明显看出，每个端点的逻辑都被移到了独立的 `ObservableStream` 对象中，这样你就可以相应地转换这些流。让我们先将每个转换代码与原始实现中对应的代码进行逐一比较。


    ##### 列出所有用户


    这种情况下的常规代码非常简单。在此例中，你需要执行以下操作：


    *   请求所有用户。

    *   填充他们的地址。

    *   将结果以 JSON 对象形式输出。


    图 4-1 展示了如何使用弹珠图设计响应式版本。


    ![A418015_1_En_4_Fig1_HTML.jpg](img/A418015_1_En_4_Fig1_HTML.jpg)


    图 4-1.


    列出用户的响应式版本弹珠图


    它从 HTTP 请求流转变为查询对象流，最终成为查询结果流（然后以 JSON 格式输出给 HTTP 客户端）。表 4-2 展示了图 4-1 中图示的实现。


    表 4-2.


    列出用户代码的逐行对比


    | 响应式代码 | 常规实现 |

    | --- | --- |

    | `var list = new oStream();` | `router.get(''/'', function(req, res, next) {`
    |

    |     `list.data` |     `models.users.find({})` |

    |     `.setVars({''httpResponse'': get(1),` |         `.populate(''addresses'')`
    |

    |     `''next'': get(2)})` |         `.then(res.json.bind(res))` |

    |     `.then(find({}))` |         `.catch(next);` |

    |     `.then(populate(''addresses''))` | `});` |

    |     `.then(execute)` |   |

    |     `.done(toJSONResponse)` |   |

    |     `.catch(callErrorHandler);` |   |


    确实，我们的新版本代码比旧版本多了一些，但这有时是更高抽象级别带来的不可避免的副作用。仅凭这个例子可能很难看出我们方法的好处，所以我们继续往下看。


    > **注意：** 你可能已经注意到，在上面的对比中，响应式代码没有显示与路由器相关的部分，而常规实现中则显示了。这是因为对于应用的响应式版本，我将路由和实际业务逻辑分开了，而在常规版本中，它们是合在一起的。


    辅助函数将在本章后面进一步描述，所以如果你暂时不理解它们的工作原理，不必担心。你很快会明白的。


    ##### 创建新用户


    创建用户是另一个简单的操作，因为它完全依赖于 ORM 的方法。不过，我们还是来看看如何设计图 4-2 中的逻辑结构。


    ![A418015_1_En_4_Fig2_HTML.jpg](img/A418015_1_En_4_Fig2_HTML.jpg)


    图 4-2.


    描述创建新用户响应式逻辑的弹珠图


    遗憾的是，由于你正在处理一个非响应式的 Web 框架，你必须手动处理请求的参数（这是流程的第一步）。之后，你只需获取请求体，创建并执行 `save` 查询，最后返回新用户的
    JSON 表示。


    现在来看表 4-3 以了解新代码。


    表 4-3.


    创建新用户所需代码的逐行对比


    | 响应式代码 | 常规代码 |

    | --- | --- |

    | `newUsers.data`     `.setVars({''httpResponse'': get(1), ''next'': get(2)})`
        `.then(get(0))`     `.then(get(''body''))`     `.then(models.users.create.bind(models.users))`
        `.done(toJSONResponse)`     `.catch(callErrorHandler);` | `router.post(''/'',
    function(req, res, next) {`     `models.users.create(req.body)`         `.then(function(usr)
    {`         `res.json(usr);`         `})`         `.catch(next);` `});` |


    关于代码需要注意的一点是，由于你在第 4 个 `then` 调用中传递了 Mongoose 的 `create` 方法，你需要正确地将其绑定到模型。否则，该函数将在没有上下文的情况下执行并失败。


    > **注意：** 我将跳过更新用户、删除用户和获取用户数据的方法，因为它们与前面的大致相同。这些方法将作为本书代码包的一部分提供。

