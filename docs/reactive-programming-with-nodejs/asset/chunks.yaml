    \ [ Address ]`\n*   Address\n    *   `street_name: String`\n    *   `house_number:\
    \ Number`\n    *   `phone_number: String`\n\nTip\n\nAttributes like an Id, the\
    \ creation date, or any other mandatory basic one are left out of the list and\
    \ assumed added to the models by the framework being used.\n\n#### The API\n\n\
    Table [4-1](#A418015_1_En_4_Chapter.html#Tab1) is the list of endpoints that the\
    \ API will provide with the code. They’re mainly the bare minimum needed to provide\
    \ a RESTful interface to deal with the resources represented by the models.\n\n\
    Table 4-1.\n\nList of Endpoints for the API Being Developed\n\n| HTTP Method |\
    \ URL | Description |\n| --- | --- | --- |\n| `GET` | `/users/` | Returns the\
    \ list of users |\n| `GET` | `/users/:id` | Returns the information for one specific\
    \ user (given by the id parameter on the url) |\n| `POST` | `/users` | Creates\
    \ a new user on the database |\n| `POST` | `/users/:id/addresses` | Adds an address\
    \ to the list of addresses of a given user |\n| `PUT` | `/users/:id` | Updates\
    \ the information of one particular user (note that this does not update the information\
    \ of an address model) |\n| `DELETE` | `/users/:id` | Removes the user (and its\
    \ associated addresses) from the database |\n\n### The Standard Implementation\n\
    \nIn order to implement the aforementioned specs, I’ll use a set of standard modules,\
    \ in particular, Express.JS(available at [`http://expressjs.com/`](http://expressjs.com/)\
    \ ) will be the web framework of choice (because let’s face it, it is the de facto\
    \ standard when it comes to web frameworks for Node.js). I’ll also be using Mongoose\
    \ ([http://​mongoosejs.​com/​](http://mongoosejs.com/)) as an ORM for the storage\
    \ layer, which will be done over MongoDB (this is simply because the lack of schema\
    \ will simplify the development of this use case).\n\nI’ll organize the code into\
    \ three files: `models-crud-api.js` will have the definition of both schemas and\
    \ it will export a dictionary of all the defined schemas; `routes-crud-api.js`\
    \ will have the definition for all enpdoints of the API, and it will export the\
    \ router object used to define them; and finally `main-crud-api.js,` which will\
    \ simply contain the main code for the API.\n\nLet’s take a quick look at how\
    \ that code would look like:\n\nroutes-crud-api.js\n\n```\nvar router = require(\"\
    express\").Router(),\nmodels = require(\"./models-crud-api\");\nrouter.get('/',\
    \ function(req, res, next) {\nmodels.users.find({})\n.populate('addresses')\n\
    .then(res.json.bind(res))//we make sure the 'this' is correct when the function\
    \ is called\n.catch(next) ;\n});\nrouter.get('/:id', function(req, res, next)\
    \ {\nmodels.users.findById(req.params.id)\n.populate(\"addresses\")\n.then(function(usr)\
    \ {\nif(!usr) {\nreturn res.status(404).json({\nerror: true,\nmsg: 'User not found'\n\
    });\n}\nreturn res.json(usr);\n})\n.catch(next);\n});\nrouter.post('/', function(req,\
    \ res, next) {\nmodels.users.create(req.body)\n.then(function(usr) {\nres.json(usr);\n\
    })\n.catch(next);\n});\nrouter.post('/:id/addresses', function(req, res, next){\n\
    var addressPromise = models.addresses.create(req.body);\nvar userPromise = addressPromise.then(function(address)\
    \ {\nreturn models.users.findById(req.params.id)\n});\nPromise.all([addressPromise,\
    \ userPromise], function([address, user]) {\nuser.addresses.push(address._id);\n\
    return user.save();\n}).then(function(user) {\nreturn res.json(user);\n}).catch(next);\n\
    });\nrouter.put('/:id', function(req, res, next) {\nmodels.users\n.findByIdAndUpdate(req.params.id,\
    \ req.body, {new: true}) //{new: true} makes sure the updated document  is returned\n\
    .then(function(usr) {\nres.json(usr);\n})\n.catch(next);\n});\nrouter.delete('/:id',\
    \ function(req, res, next) {\nmodels.users\n.findByIdAndRemove(req.params.id)\n\
    .then(function() {\nres.sendStatus(200);\n})\n.catch(next);\n});\nmodule.exports\
    \ = router;\n```\n\nFrom the above code, you can see that the main logic for the\
    \ endpoints is not that complicated; you can pretty much map each one to a helper\
    \ method provided by Mongoose, with the clear exception of `/:id/addresses,` which\
    \ requires you to do a small amount of thinking in order to understand it (first\
    \ creating the address and then updating the user with the reference, all of it\
    \ using promises).\n\nmodels-crud-api.js\n\n```\nvar usersSchema = Schema({\n\
    first_name: {\ntype: String,\nrequired: true\n},\nlast_name: {\ntype: String,\n\
    required: true\n},\nbirth_date: Date,\naddresses: [\n{\nref: 'Address',\ntype:\
    \ Schema.Types.ObjectId\n}]\n});\n```\n\nTip\n\nAlthough normal JS code convention\
    \ is camelCase, the fields used for the models are expressed using snake_case\
    \ because that is the default standard for MongoDB.\n\n```\nvar usersModel = mongoose.model('User',\
    \ usersSchema);\nmodule.exports = {\nusers: usersModel,\naddresses: addressModel\n\
    };\n```\n\nEntities schemas and models definition and final models dictionary\
    \ export; the rest is your run-of-the-mill code, and there is nothing relevant\
    \ to mention about it.\n\nmain-crud-api.js\n\n```\nvar express = require(\"express\"\
    ),\nbodyParser = require(\"body-parser\"),\nmongoose = require(\"mongoose\"),\n\
    userRouter = require(\"./routes-crud-api\");\nvar app = express();\napp.use(bodyParser.json());\n\
    app.use('/users', userRouter);\n//Generic error handler\napp.use(function(err,\
    \ req, res, next) {\nconsole.error(\"--- Error encountered ---\");\nconsole.error(err);\n\
    res.status(500).json({\nmsg: err,\nerror: true\n});\n});\nmongoose.connect('mongodb://localhost/test-chapter4');\n\
    var db = mongoose.connection;\ndb.once('open', function() {\nconsole.log(\"Database\
    \ connection established...\");\napp.listen(3004, function() {\nconsole.log(\"\
    Server started ...\");\n});\n});\n```\n\nThe final or, actually, main file for\
    \ this example and the two relevant bits to mention about it are listed here.\n\
    \nThe generic error handler defined; this function will be called from the endpoint’s\
    \ code when the catch statement is executed. This is very easy to test: Simply\
    \ try to create a user leaving out the last name, that will cause a validation\
    \ error, which will trigger the catch clause, which, in turn, will call `next`\
    \ with the error parameter, causing the error handler to be called.\n\nThe last\
    \ few lines show how you can start the web server on port 3004, but only after\
    \ the connection to the database has been established (that is what that `open`\
    \ event means). This is a pretty standard and safe way of initializing your application,\
    \ making sure all services are up, before starting the web server.\n\n### The\
    \ Functional Reactive Implementation\n\nThis implementation should be different,\
    \ but not in every way. I’m not trying to rewrite the web server, or the ORM into\
    \ being fully reactive; instead, I’m just trying to implement the business logic\
    \ using this paradigm.\n\nIn this particular example, this translates to rewriting\
    \ the router-related code, since that’s where its main logic lays. And in order\
    \ to do that, I’ll transform the endpoints into observable collections, where\
    \ every new request is a new event added. With that in mind, I’ll apply a set\
    \ of transformations to that event that will render the results as you need it\
    \ in every case."
  trans: "\n### 模型\n\n该 API 将处理两个模型，因此也会包含一些处理两者关系的逻辑。具体而言，这两个模型是 `User` 和 `Address`。每个用户将拥有一个地址集合，其结构如下：\n\
    \n- **用户**\n  - `first_name: String`\n  - `last_name: String`\n  - `birth_date:\
    \ Date`\n  - `addresses: [ Address ]`\n- **地址**\n  - `street_name: String`\n \
    \ - `house_number: Number`\n  - `phone_number: String`\n\n> **提示：** 像 `Id`、创建日期或任何其他必需的通用属性均未列入此列表，并假定由所使用的框架自动添加到模型中。\n\
    \n#### API 接口\n\n表 4-1 列出了该 API 将配合代码提供的端点。它们主要是提供 RESTful 接口所需的最低限度，用于操作模型所代表的资源。\n\
    \n**表 4-1.** *正在开发的 API 的端点列表*\n\n| HTTP 方法 | URL | 描述 |\n| --- | --- | --- |\n\
    | `GET` | `/users/` | 返回用户列表 |\n| `GET` | `/users/:id` | 返回特定用户（由 URL 中的 `id`\
    \ 参数指定）的信息 |\n| `POST` | `/users` | 在数据库中创建新用户 |\n| `POST` | `/users/:id/addresses`\
    \ | 向指定用户的地址列表中添加一个地址 |\n| `PUT` | `/users/:id` | 更新特定用户的信息（注意：这不会更新地址模型的信息） |\n\
    | `DELETE` | `/users/:id` | 从数据库中删除用户（及其关联的地址） |\n\n### 标准实现\n\n为了实现上述规范，我将使用一组标准模块。具体来说，`Express.JS`（可在\
    \ [`http://expressjs.com/`](http://expressjs.com/) 获取）将是首选的 Web 框架（因为坦率地说，它是 Node.js\
    \ 领域 Web 框架的事实标准）。我还将使用 `Mongoose`（[`mongoosejs.com/`](http://mongoosejs.com/)）作为存储层的\
    \ ORM，存储层将基于 `MongoDB`（这仅仅是因为缺乏模式将简化此用例的开发）。\n\n我将代码组织成三个文件：`models-crud-api.js`\
    \ 将包含两个模式的定义，并导出所有已定义模式的字典；`routes-crud-api.js` 将包含 API 所有端点的定义，并导出用于定义它们的路由对象；最后，`main-crud-api.js`\
    \ 将仅包含 API 的主代码。\n\n让我们快速看一下代码的大致样子：\n\n**routes-crud-api.js**\n\n```javascript\n\
    var router = require(\"express\").Router(),\nmodels = require(\"./models-crud-api\"\
    );\nrouter.get('/', function(req, res, next) {\nmodels.users.find({})\n.populate('addresses')\n\
    .then(res.json.bind(res))//we make sure the 'this' is correct when the function\
    \ is called\n.catch(next) ;\n});\nrouter.get('/:id', function(req, res, next)\
    \ {\nmodels.users.findById(req.params.id)\n.populate(\"addresses\")\n.then(function(usr)\
    \ {\nif(!usr) {\nreturn res.status(404).json({\nerror: true,\nmsg: 'User not found'\n\
    });\n}\nreturn res.json(usr);\n})\n.catch(next);\n});\nrouter.post('/', function(req,\
    \ res, next) {\nmodels.users.create(req.body)\n.then(function(usr) {\nres.json(usr);\n\
    })\n.catch(next);\n});\nrouter.post('/:id/addresses', function(req, res, next){\n\
    var addressPromise = models.addresses.create(req.body);\nvar userPromise = addressPromise.then(function(address)\
    \ {\nreturn models.users.findById(req.params.id)\n});\nPromise.all([addressPromise,\
    \ userPromise], function([address, user]) {\nuser.addresses.push(address._id);\n\
    return user.save();\n}).then(function(user) {\nreturn res.json(user);\n}).catch(next);\n\
    });\nrouter.put('/:id', function(req, res, next) {\nmodels.users\n.findByIdAndUpdate(req.params.id,\
    \ req.body, {new: true}) //{new: true} makes sure the updated document  is returned\n\
    .then(function(usr) {\nres.json(usr);\n})\n.catch(next);\n});\nrouter.delete('/:id',\
    \ function(req, res, next) {\nmodels.users\n.findByIdAndRemove(req.params.id)\n\
    .then(function() {\nres.sendStatus(200);\n})\n.catch(next);\n});\nmodule.exports\
    \ = router;\n```\n\n从上述代码可以看出，端点的核心逻辑并不复杂；基本上可以将每个端点映射到 `Mongoose` 提供的某个辅助方法，但\
    \ `/:id/addresses` 明显是个例外，它需要花一点心思才能理解（先是创建地址，然后更新用户以添加引用，整个过程都使用了 promise 链）。\n\
    \n**models-crud-api.js**\n\n```javascript\nvar usersSchema = Schema({\nfirst_name:\
    \ {\ntype: String,\nrequired: true\n},\nlast_name: {\ntype: String,\nrequired:\
    \ true\n},\nbirth_date: Date,\naddresses: [\n{\nref: 'Address',\ntype: Schema.Types.ObjectId\n\
    }]\n});\n```\n\n> **提示：** 尽管普通的 JS 代码约定使用 `camelCase`，但模型中使用的字段却是 `snake_case`，因为这是\
    \ `MongoDB` 的默认标准。\n\n```javascript\nvar usersModel = mongoose.model('User', usersSchema);\n\
    module.exports = {\nusers: usersModel,\naddresses: addressModel\n};\n```\n\n实体模式、模型定义以及最终模型字典的导出；其余都是常规代码，没有什么需要特别提及的。\n\
    \n**main-crud-api.js**\n\n```javascript\nvar express = require(\"express\"),\n\
    bodyParser = require(\"body-parser\"),\nmongoose = require(\"mongoose\"),\nuserRouter\
    \ = require(\"./routes-crud-api\");\nvar app = express();\napp.use(bodyParser.json());\n\
    app.use('/users', userRouter);\n//Generic error handler\napp.use(function(err,\
    \ req, res, next) {\nconsole.error(\"--- Error encountered ---\");\nconsole.error(err);\n\
    res.status(500).json({\nmsg: err,\nerror: true\n});\n});\nmongoose.connect('mongodb://localhost/test-chapter4');\n\
    var db = mongoose.connection;\ndb.once('open', function() {\nconsole.log(\"Database\
    \ connection established...\");\napp.listen(3004, function() {\nconsole.log(\"\
    Server started ...\");\n});\n});\n\n本示例的最后一个（实际上是主）文件，以及其中需要提及的两个相关要点，如下所示。\n\n\
    1. 定义了通用错误处理程序；当执行 `catch` 语句时，将调用此函数。这很容易测试：只需尝试创建一个未填写 `last_name` 的用户，这将引发验证错误，从而触发\
    \ `catch` 子句，进而调用带有错误参数的 `next`，最终导致错误处理程序被调用。\n\n2. 最后几行展示了如何仅在数据库连接建立之后（即 `open`\
    \ 事件所代表的含义），在端口 `3004` 上启动 Web 服务器。这是一种非常标准且安全的初始化应用程序的方式，确保在启动 Web 服务器之前所有服务都已就绪。\n\
    \n### 函数式响应式实现\n\n这种实现方式应该有所不同，但并非方方面面都不同。我并非试图将 Web 服务器或 ORM 完全重写为响应式；而只是尝试使用这种范式来实现业务逻辑。\n\
    \n在这个特定的例子中，这转化为重写与路由相关的代码，因为这里才是主要逻辑所在。为了做到这一点，我将端点转换为可观察集合，其中每个新请求都是一个被添加的新事件。基于此，我将对该事件应用一系列转换，使其在每个场景下都能按需生成结果。\n"
- fmt: '#### The Router File


    Let’s first take a look at this file back on the previous implementation; that
    was where all the logic was written, but it was also where the route matching
    was done by Express. For this implementation, I’ll remove the business logic from
    there and only leave route matching, and here is what that code looks like:


    ```

    var collections = require("./collections-rfrp  "),

    router = require("express").Router(),

    _ = require("lodash");

    var mapping = {

    ''/'': {

    ''get'': collections.listUsersCollection,

    ''post'': collections.newUsersCollection

    },

    ''/:id'': {

    ''get'': collections.getUserDataColection,

    ''put'': collections.updateUserCollection,

    ''delete'': collections.deleteUsersCollection

    },

    ''/:id/addresses'': {

    ''post'': collections.newAddressCollection

    }

    };

    ```


    This JSON is mapping every endpoint to a different observable collection, and
    the following code takes care of adding the request, the response, and the `next`
    function received upon every request to the corresponding collection.


    ```

    //we set up the urls

    _.each(mapping, function (actions, url) {

    _.each(actions, function(collection, method) {

    router[method](url, function() { //this is the code that every route will actually
    execute

    collection.add(arguments);  //we pass the arguments object because we want to
    have access to all three parameters in one

    });

    });

    });

    module.exports = router;

    ```


    As I mentioned before, the code is very simple. This isn’t really reactive or
    anything; instead, it just takes care of adding the new events to the corresponding
    collections.


    #### The New Business Logic


    As is evidenced from the above code, each endpoint’s logic got moved into a separate
    `ObservableStream` object, this way you can transform the streams accordingly.
    Let’s first compare each transformation code side by side with it’s homologue
    on the original implementation.


    ##### Listing All Users


    The regular code for this case is pretty simple. In this case, what you need is
    to do the following:


    *   Requests all users.

    *   Populate their addresses.

    *   Print the result as a JSON object.


    Figure [4-1](#A418015_1_En_4_Chapter.html#Fig1) shows you how you would go about
    designing the reactive version using a marbles diagram.


    ![A418015_1_En_4_Fig1_HTML.jpg](A418015_1_En_4_Fig1_HTML.jpg)


    Figure 4-1.


    Marble diagram for the reactive version of listing users


    It went from a stream of HTTP requests into a stream of query objects and ended
    up being a stream of query results (which are then printed out to the HTTP client
    in JSON format). Table [4-2](#A418015_1_En_4_Chapter.html#Tab2) shows the implementation
    of the diagram in Figure [4-1](#A418015_1_En_4_Chapter.html#Fig1).


    Table 4-2.


    Side-by-Side Comparison of the Code for Listing Users


    | Reactive Code | Regular Implementation |

    | --- | --- |

    | `var list = new oStream();` | `router.get(''/'', function(req, res, next) {`
    |

    |     `list.data` |     `models.users.find({})` |

    |     `.setVars({''httpResponse'': get(1),` |         `.populate(''addresses'')`
    |

    |     `''next'': get(2)})` |         `.then(res.json.bind(res))` |

    |     `.then(find({}))` |         `.catch(next);` |

    |     `.then(populate(''addresses''))` | `});` |

    |     `.then(execute)` |   |

    |     `.done(toJSONResponse)` |   |

    |     `.catch(callErrorHandler);` |   |


    It’s true, our new version has more code than the old one, but that is sometimes
    an unfortunate side effect of a higher level of abstraction. It might be difficult
    to see the benefits of our approach with solely this example, so let’s keep going.


    > **Note:** You might have noticed that in the previous comparison the reactive
    code does not show the router-related part while the regular implementation does.
    This is because for the reactive version of the application, I have split the
    routing and the actual business logic, while on the regular version they were
    both the same.


    The helper functions are described further ahead in this chapter, so don’t worry
    if you don’t understand how they work just yet. You will.


    ##### Creating a New User


    Creating users is another of the simple ones, since it relies entirely on the
    ORM''s methods. Still let’s take a look at how you would structure your logic
    in Figure [4-2](#A418015_1_En_4_Chapter.html#Fig2).


    ![A418015_1_En_4_Fig2_HTML.jpg](A418015_1_En_4_Fig2_HTML.jpg)


    Figure 4-2.


    Marble diagram describing the reactive logic of creating a new user


    Sadly, because you’re dealing with a non-reactive web framework, you have to manually
    deal with the parameters of the request (which is what the first step of the process
    is). After that, you just get the body of the request, create and perform the
    `save` query, and, finally, return the JSON representation of the new user.


    Now take a look at Table [4-3](#A418015_1_En_4_Chapter.html#Tab3) for a view of
    the new code.


    Table 4-3.


    Side-by-Side Comparison of the Code Required to Create a New User


    | Reactive Code | Regular Code |

    | --- | --- |

    | `newUsers.data`     `.setVars({''httpResponse'': get(1), ''next'': get(2)})`
        `.then(get(0))`     `.then(get(''body''))`     `.then(models.users.create.bind(models.users))`
        `.done(toJSONResponse)`     `.catch(callErrorHandler);` | `router.post(''/'',
    function(req, res, next) {`     `models.users.create(req.body)`         `.then(function(usr)
    {`         `res.json(usr);`         `})`         `.catch(next);` `});` |


    One thing to note about the code is that since you’re passing the `create` method
    from Mongoose on the 4th `then` call, you need to correctly bind it to the model.
    Otherwise the function will be executed without a context and it will fail.


    > **Note:** I’ll skip over the update a user, delete a user, and get a user’s
    data methods, because they’re pretty much the same as the one earlier. They will
    be provided as part of the code bundle of the book.'
