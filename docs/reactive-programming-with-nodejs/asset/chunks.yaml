    ```

    function debounce(delay) {

    var lastTimestamp = null;

    var debounced = false;

    var listeners = [];

    var _fn = function(cheese, value, index, handler, transforms, done) {

    var now = null;

    if(debounced) {

    return done(cheese._outputStream);

    }

    /*

    Remove all active listeners on outgoing stream

    */

    listeners = cheese._outputStream.listeners(''data'');

    listeners.map(function(fn) {

    cheese._outputStream.removeListener(''data'', fn);

    });

    /*

    Overwrite the main listener for the ''data'' event on the outgoing stream.

    This way we can control when to actually start the transformations and when to

    ignore the data

    */

    cheese._outputStream.on(''data'', function(v) {

    now = Date.now();

    if(!lastTimestamp) {

    lastTimestamp = Date.now();

    }

    if(now - lastTimestamp > delay) {

    cheese._execute(index, v, handler, transforms);

    }

    lastTimestamp = now;

    });

    debounced = true;

    return done(cheese._outputStream);

    };

    _fn.__fn_type = ''debounce'';

    _fn.newInstance = function() {

    return debounce(delay);

    };

    return _fn;

    }

    function throttle(delay) {

    var throttled = false;

    var listeners = [];

    var bufferedValue = null;

    var interval = null;

    var _fn = function(cheese, value, index, handler, transforms, done) {

    if(throttled) {

    return done(cheese._outputStream);

    }

    listeners = cheese._outputStream.listeners(''data'');

    listeners.forEach(function(fn) {

    cheese._outputStream.removeListener(''data'', fn);

    });

    bufferedValue = value;

    //buffer the last value emitted by  the stream until the moment is right to pass
    it along

    cheese._outputStream.on(''data'', function(v) {

    bufferedValue = v;

    });

    if(!interval) { //we start the interval when the first event arrives

    interval =  setInterval(function() {

    if(bufferedValue !== null) {

    cheese._execute(index, bufferedValue, handler, transforms);

    bufferedValue = null;

    }

    }, delay);

    }

    //make sure we clear the active interval when we''re done

    cheese._outputStream.on(''finish'', function() {

    clearInterval(interval);

    })

    throttled = true;

    };

    _fn.__fn_type = ''throttle'';

    _fn.newInstance = function() {

    return throttle(delay);

    };

    return _fn;

    }

    ```


    Despite having a similar behavior, their implementations are quite different as
    you can see, `debounce` needs to pay a lot of attention to timing whilst `throttle`
    simply sets an interval and buffers the last value received until the interval
    is fired. The rest of the logic is quite self explanatory now that you''ve seen
    the marble diagrams and the examples there is very little for me to explain.


    # Caution


    The intervals created in Node.js are not super precise in regards of their timing,
    when you set an interval to execute a function every X milliseconds, it actually
    will execute it at least every X milliseconds. What that means is that Node.js
    tries it''s best to comply with the timing set but the only sure thing is that
    the function will not be executed before time. When your interval timing is high
    enough, you won''t have a problem, but if you''re dealing with very low time limits
    (like 10 milliseconds or less), you might start running into timing issues.


