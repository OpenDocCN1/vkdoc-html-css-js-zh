  raw: '### In Conclusion


    This is another clear example of how the declarative nature of your code allows
    you to simplify the logic behind it—specifically, to the external reader, someone
    who isn’t the author but needs to understand it. The middleware’s code was simple,
    but yet, it managed to make it more readable by removing the `IFs` and transforming
    its logic into two simple `filter` statements. If you think about it, the current
    approach allowed you to create a filtering middleware without actually looking
    to implement a middleware. How awesome is that?!


    The same can be said for the endpoint’s logic—it was simple enough, but with the
    code, it’s much easier to read and understand than before.


    ## Summary


    This chapter was all about providing practical evidence that you can use functional
    reactive programming on the back-end of your applications, and that by doing so,
    you can improve some aspects of your code, like readability and maintainability.


    Hopefully, with the examples provided, that point was made, and you’ll be interested
    in applying these concepts to your own code. That being said, I still need to
    go over the actual framework’s code, which will come in future chapters.


    As for the next chapter, I’ll go over some of the advantages of using Node.js
    for a FRP framework.


    # 5. Enter Node.js


    Although you already saw how to apply the reactive concepts on the back-end from
    a practical standpoint, I haven’t really talked about how why using Node.js is
    such a good idea for this.


    Instead of looking at code, which you did plenty of in the Chapter [4](#A418015_1_En_4_Chapter.html),
    in this chapter I’ll try to hit the theory aspect of Node. That means I’ll take
    a hard, long look at things like `EventEmitters` and `Streams`, and you’ll see
    how asynchronous programming works and why Node.js is so good at it. Finally,
    asynchronous streams of events, which I already covered a bit in a previous chapter.


    By the end of the chapter, you should have a better understanding of the tools
    provided by Node that will allow you to create the reactive framework I keep promising.
    Some of these tools will only be mentioned, and some of them will be used in future
    chapters.


    ## Event Emitters and Event Streams


    In this section of the chapter, I’ll go over one of the tools that will help you
    achieve your goal. The `EventEmitter` module comes native with Node.js since its
    early versions and will provide you the ability to propagate messages using an
    event system not different from the one present on browsers (I’m talking about
    UI events here).


    I’ll also go over Streams in Node. Just like the `EventEmitters`, streams are
    native to Node.js and use some of the things seen on `EventEmitters` and then
    add some more magic to provide a very familiar and interesting interface to deal
    with streams of data.


    ### Event Emitters


    An interesting fact about event emitters is that you’ve probably used them already
    without even knowing. Some of the core functionalities of Node extend this module
    and provide you with custom events to listen to. For instance, the `process` object
    allows you to react to events like `uncaughtException, which` the server returned
    by the `http` module’s `createServer` method, and allows you to listen for special
    events called `request`, and so on.


    So, what exactly are event emitters? Easily enough, this module will allow you
    to emit events, but more to the point, it will provide an API for the developer
    to listen to, react to, and even emit custom events.


    Here are some facts about the `EventEmitter` that might be useful:


    *   You can set as many listeners to an event as you want.

    *   When an event is triggered, the listeners are all called one by one and in
    order, according to the order they were set.

    *   You can set up the listeners to either be triggered every time the event is
    received or just the first time.

    *   Because of the previous bullet points, there are two ways to add listeners
    to an event, either by appending them to the list (by using the `on`, or the `once`
    methods) or by prepending them (with either the `prependOnceListener` method or
    the `prependListener` one).

    *   The listener function doesn’t have to have any specific signature to be valid.
    Any parameter passed to the event during triggering will automatically be passed
    to this function, in the same order.

    *   There is a special ‘`error`’ event that, when triggered and left without any
    listeners, will close the node application.

    *   So in other words, with EventEmitters, you can control the flow of your logic
    using events, much like you can do on the front-end, when you set up your logic
    to be initialized after the page is done loading, or like when you setup an AJAX
    request upon clicking on a link.

    *   In particular, this mechanic is great when you have an asynchronous process
    that might need to send back data to the client using it in several occasions
    mid-process.


    For instance, imagine a function that needs to make three different asynchronous
    requests before finishing, and in mid-process it also needs to report back the
    progress after finishing each internal request. You can easily do this with the
    help of EventEmitters, by emitting a custom `progress` event to which the client
    can subscribe. Let’s look at a quick example:


    ```

    var EventEmitter  = require("events"),

    request = require("request"),

    async = require("async");

    function myAsyncEmitter() {}

    myAsyncEmitter.prototype = new EventEmitter();

    myAsyncEmitter.prototype.process = function() {

    var self = this;

    var doneRequests = 0;

    var urls = [

    "http://www.google.com",

    "http://www.youtube.com",

    "http://www.facebook.com"

    ];

    async.map(urls, function(url, done) {

    request.get(url, function(err, data) {

    doneRequests++;

    self.emit(''progress'', (doneRequests / urls.length) * 100);

    done(err, data.body);

    });

    }, function(err, results) {

    self.emit(''done'', results);

    });

    };

    var AE = new myAsyncEmitter() ;

    AE.on(''progress'', function(percentage) {

    console.log("Percentage done: ", percentage, "%");

    });

    AE.once(''done'', function(data) {

    console.log("Process over, this is the data: ", data);

    });

    AE.process();

    ```


    Note


    To simplify the code, I’m using the Async.js and Request.js (available from [`https://github.com/request/request`](https://github.com/request/request)
    ) libraries to provide helper functions that will help you handle the asynchronous
    calls and the actual requests. They are not required to test the EventEmitter;
    it is simply a matter of keeping the focus on the interesting bit, which in this
    case is the Event Emitter.


    The previous code is a basic example of what I mentioned before, my custom emitter
    is extending Node’s Event module, to gain access to the desired logic and then
    I’m using it by setting up the listeners for both events, `progress` and `done`.
    Because I know the `done` event will be called only once, I set the listener using
    the `once` method, but of course, it could’ve been done with the `on` method;
    in this case it would’ve made no difference (it’s merely a measure to increase
    code readability) .'
  trans: "\n### 总结\n\n这是又一个清晰的示例，展示了代码的声明式特性如何简化其背后的逻辑——特别是对于外部读者，即那些并非作者但需要理解代码的人。中间件的代码虽然简单，但它通过移除`IFs`并将其逻辑转化为两个简单的`filter`语句，使代码更具可读性。仔细想想，当前的方法让你无需真正实现一个中间件，就能创建一个过滤中间件。这难道不棒吗？\n\
    \n端点逻辑也同样如此——它本身已经足够简单，但经过代码处理后，阅读和理解起来比以前容易得多。\n\n## 本章小结\n\n本章的核心目标是提供实践证据，证明你可以在应用后端使用函数式响应式编程，并且这样做可以改善代码的某些方面，例如可读性和可维护性。\n\
    \n希望所提供的示例能够阐明这一点，并且你会对这些概念在自己代码中的应用产生兴趣。话虽如此，我仍需在后续章节中讲解实际框架的代码。\n\n至于下一章，我将介绍使用\
    \ Node.js 构建 FRP 框架的一些优势。\n\n# 5. 进入 Node.js\n\n虽然你已经从实践角度看到了如何在后端应用响应式概念，但我还没有真正讨论为什么使用\
    \ Node.js 是一个如此好的选择。\n\n在第四章（参见 4）中你已经看了大量代码，而在本章中，我将重点探讨 Node 的理论方面。这意味着我会深入审视诸如`EventEmitters`和`Streams`之类的内容，你将了解异步编程是如何工作的，以及为什么\
    \ Node.js 在这方面如此出色。最后，我还会涉及之前章节已经部分介绍过的异步事件流。\n\n在本章结束时，你应该能更好地理解 Node 提供的工具，这些工具将帮助你创建我一直承诺的响应式框架。其中一些工具只会被提及，而另一些将在未来章节中使用。\n\
    \n## 事件发射器与事件流\n\n在本节的这一部分，我将介绍一个有助于你实现目标的工具。`EventEmitter`模块自 Node.js 早期版本起就作为原生模块存在，它允许你使用一个与浏览器端（这里指的是\
    \ UI 事件）没有本质区别的事件系统来传播消息。\n\n我还将介绍 Node 中的 Streams（流）。与`EventEmitters`类似，流也是 Node.js\
    \ 的原生模块，它使用了`EventEmitters`中的一些概念，并在此基础上增加了更多神奇的特性，从而提供了一个非常熟悉且有趣的接口来处理数据流。\n\n\
    ### 事件发射器\n\n关于事件发射器的一个有趣事实是，你可能已经无意中使用过它们。Node 的一些核心功能会扩展该模块，并提供自定义事件供你监听。例如，`process`对象允许你对诸如`uncaughtException`之类的事件做出响应；而由`http`模块的`createServer`方法返回的服务器，则允许你监听名为`request`的特殊事件，诸如此类。\n\
    \n那么，事件发射器到底是什么？简单来说，这个模块允许你发射事件，但更重要的是，它为开发者提供了一套 API，用于监听、响应甚至发射自定义事件。\n\n以下是关于`EventEmitter`的一些可能有用的特性：\n\
    \n*   你可以为一个事件设置任意数量的监听器。\n*   当事件被触发时，所有监听器会按照它们被设置的顺序依次被调用。\n*   你可以将监听器设置为每次事件被触发时都执行，或仅在第一次触发时执行。\n\
    *   基于上一点，有两种方式向事件添加监听器：要么将其追加到列表末尾（使用`on`或`once`方法），要么将其添加到列表开头（使用`prependOnceListener`或`prependListener`方法）。\n\
    *   监听器函数无需特定的签名即可生效。触发事件时传递给事件的任何参数都会自动传递给该函数，且顺序保持不变。\n*   有一个特殊的 '`error`'\
    \ 事件，当它被触发且没有任何监听器时，会导致 Node 应用程序关闭。\n*   换句话说，通过`EventEmitters`，你可以使用事件来控制逻辑流，就像在前端开发中，你可以将逻辑设置为在页面加载完成后初始化，或者像在点击链接时设置\
    \ AJAX 请求一样。\n*   特别地，当你有一个异步进程需要在处理过程中多次向客户端回传数据时，这种机制非常有用。\n\n例如，假设有一个函数需要在完成之前发起三个不同的异步请求，并且在处理过程中，它还需要在完成每个内部请求后报告进度。借助`EventEmitters`，你可以轻松实现这一点：通过发射一个客户端可以订阅的自定义`progress`事件。让我们来看一个快速示例：\n\
    \n```\nvar EventEmitter  = require(\"events\"),\nrequest = require(\"request\"\
    ),\nasync = require(\"async\");\nfunction myAsyncEmitter() {}\nmyAsyncEmitter.prototype\
    \ = new EventEmitter();\nmyAsyncEmitter.prototype.process = function() {\nvar\
    \ self = this;\nvar doneRequests = 0;\nvar urls = [\n\"http://www.google.com\"\
    ,\n\"http://www.youtube.com\",\n\"http://www.facebook.com\"\n];\nasync.map(urls,\
    \ function(url, done) {\nrequest.get(url, function(err, data) {\ndoneRequests++;\n\
    self.emit('progress', (doneRequests / urls.length) * 100);\ndone(err, data.body);\n\
    });\n}, function(err, results) {\nself.emit('done', results);\n});\n};\nvar AE\
    \ = new myAsyncEmitter() ;\nAE.on('progress', function(percentage) {\nconsole.log(\"\
    Percentage done: \", percentage, \"%\");\n});\nAE.once('done', function(data)\
    \ {\nconsole.log(\"Process over, this is the data: \", data);\n});\nAE.process();\n\
    ```\n\n> **注意**  \n> 为了简化代码，我使用了`Async.js`和`Request.js`（可从 [`https://github.com/request/request`](https://github.com/request/request)\
    \ 获取）库来提供辅助函数，帮助你处理异步调用和实际的请求。测试`EventEmitter`本身并不需要它们；这只是为了将重点集中在有趣的部分——也就是本例中的事件发射器。\n\
    \n上面的代码是我之前提到的概念的一个基本示例：我的自定义发射器继承了 Node 的`Event`模块以获取所需逻辑，然后通过为`progress`和`done`这两个事件设置监听器来使用它。由于我知道`done`事件只会被调用一次，所以我使用`once`方法设置了监听器，当然，也可以使用`on`方法；在这种情况下，两者没有任何区别（这仅仅是为了提高代码可读性而采取的一种措施）。\n"
- fmt: "### Streams\n\nLike the Event Emitters, Streams are native constructs provided\
    \ by Node.js and are often either left unused by developers or misunderstood.\
    \ And just like with `EventEmitters`, you’ve probably used more than one stream\
    \ already and didn’t even notice.\n\nSo in this section, I want to go over the\
    \ module and show how it relates to both the `EventEmitters` seen earlier and\
    \ the overall goal of this book. Hopefully you’ll find similarities between what\
    \ I’ve shown you so far and this.\n\nThere are four types of streams available\
    \ from this module:\n\n- **Readable streams**: will provide the API to read data\
    \ from a given source.\n- **Writable streams**: will allow you to write continuous\
    \ chunks of data to a given destination.\n- **Duplex streams**: a combination\
    \ of Readable and Writable streams, allowing you to both write to and read from\
    \ a given source.\n- **Transform streams**: a kind of duplex streams that allow\
    \ you to transform the data while reading it and writing it.\n\nEach stream also\
    \ has two modes, one in which you can read and write any JavaScript type (except\
    \ for `null`) called **Object Mode**, and the default one, in which anything passing\
    \ through a stream is either a `String` or a `Buffer`. So if my math is right,\
    \ we have the total of eight different streams to choose, so I’ll dive a little\
    \ deeper into each one to show the API they provide and how you would have to\
    \ go about implementing each type of stream.\n\n#### Readable Streams\n\nReadable\
    \ streams allow you to wrap a given source of data into a standard API that will\
    \ let you consume the information provided, either by manually pooling the source\
    \ or simply by reacting to its arrival.\n\nThere are several very common readable\
    \ streams that developers use almost daily, for instance:\n\n- HTTP response objects\
    \ on the client side (meaning any application that connects to your API)\n- HTTP\
    \ request objects on the server side\n- TCP sockets\n- Child process `stdin` and\
    \ `stderr`\n- Etc.\n\nAll the different streams provide a set of methods or events\
    \ that we can use to either read or write the data. In the case of a readable\
    \ stream, it will either emit a `data` event every time there is a new chunk of\
    \ data (or a new object available, depending on whether we’re on Object Mode or\
    \ not) or you can pipe the output of the reader into a writable stream. The latter\
    \ gives you no control over what’s going on, you simply plug the output of one\
    \ stream to the input of another, and the system takes care of the rest for you.\n\
    \nHere is a simple example of piping. The following code will connect three different\
    \ streams together:\n\n```javascript\nvar fs = require(\"fs\"),\nzlib = require(\"\
    zlib\");\nvar r = fs.createReadStream('file.txt');\nvar z = zlib.createGzip();\n\
    var w = fs.createWriteStream('file.txt.gz');\nr.pipe(z).pipe(w);\n```\n\nThe previous\
    \ code is creating three different streams and piping them together in the last\
    \ line. The end result will be the ability to zip a given file and save it to\
    \ disk.\n\nSimply to show the equivalent code when doing it without piping, here\
    \ is how you would go about it:\n\n```javascript\nvar fs = require(\"fs\"),\n\
    zlib = require(\"zlib\");\nvar r2 = fs.createReadStream('file.txt');\nvar z2 =\
    \ zlib.createGzip();\nvar w2 = fs.createWriteStream('file.txt.gz');\nw2.on('open',\
    \ function() {\n  r2.on('data', function(chunk) {\n    console.log(\"data chunk:\
    \ \", chunk);\n    z2.write(chunk);\n  });\n  z2.on('data', function(data) {\n\
    \    console.log(\"-- gzip chunk --\");\n    w2.write(data);\n  });\n  r2.on('end',\
    \ function() {\n    z2.end();\n  });\n  z2.on('end', function () {\n    w2.end();\n\
    \  });\n});\n```\n\nClearly, the code is a bit longer, and there is more to handle\
    \ manually, but sometimes that is needed, even if it’s just to add some debugging\
    \ messages like in the previous code.\n\nThis code is showing one particular event\
    \ that is very useful when dealing with readable streams: the `data` event. This\
    \ event will be fired every time there is a newly available chunk of data ready\
    \ to be consumed by your code.\n\nReadable streams can also emit the `readable`\
    \ event, which happens whenever there are data available to be read. In this case,\
    \ the consumer would have to call the `read` method of the stream in order to\
    \ get that next bit of data. This would come in handy when you require extra layers\
    \ of control over the behavior of your stream—particularly the previous event\
    \ would only let you know once new data were received, while this one would let\
    \ you decide what to do once data are available and before they are actually received\
    \ (depending on your logic, you could read it or ignore it).\n\nThere are other\
    \ useful, though simpler, events emitted by readable streams, such as the `end`\
    \ event, emitted to notify that there are no more data to be read; the `close`\
    \ event, emitted once there are no more events to emit; and the `error` event,\
    \ which I already covered.\n\n#### Writable Streams\n\nIn the case of writable\
    \ streams, they work just like the opposite of readable streams: They wrap the\
    \ destination of your data into an easy-to-use container. And just like with any\
    \ other stream, you can pipe other streams to it, or you can manually write to\
    \ it.\n\nSome common writable streams are:\n\n- `fs` write streams\n- `zlib` streams\
    \ (like you saw above)\n- crypto streams\n\nUsing these streams is pretty straightforward.\
    \ The main methods you’ll want to know about are `write` to actually send data\
    \ to it and `end` to close it. I’ve already shown how they work on the previous\
    \ code sample, so I’m not going to bore you with them again.\n\nSince all streams\
    \ are also `EventEmitters`, they will trigger some specific events. In the case\
    \ of the writables, you should pay special attention to:\n\n- `drain`: This event\
    \ is triggered after a `stream.write` call returns `false`. Once this event is\
    \ triggered, then the writing can be resumed. This event can be triggered by your\
    \ stream when the destination of your writes has been overwhelmed and needs some\
    \ time before the next chunk of data can be sent.\n- `error`: This one is common\
    \ to all `EventEmitters`, so please, whenever you’re creating a stream, set a\
    \ handler for this event; otherwise, your entire application will crash if this\
    \ error is not handled.\n\n#### Duplex and Transform Streams\n\nThese two types\
    \ of streams are actually based on the previous two. You have the Duplex stream,\
    \ which is simply (and obviously) a stream that implements both the Readable and\
    \ the Writable interfaces (like a TCP socket).\n\nAnd then you have the Transform\
    \ streams, which are Duplex streams, but with the variation that allows you to\
    \ change the input it receives into something else before it becomes the output.\
    \ In other words, you could, for instance, create a Transform stream that receives\
    \ JavaScript Objects and writes JSON strings into some storage system.\n\nThe\
    \ main difference between a Duplex and a Transform stream, aside from the obvious,\
    \ of course, is that for the Duplex stream, the Read and Write events are being\
    \ handled in parallel of each other, meaning individually. The Write action/event\
    \ is not tied to the Read that one would expect to come before, so if you’re dealing\
    \ with asynchronous processes (which in Node.js you most probably will be), take\
    \ that into account. I’ll show you a specific case of this below."
  raw: '### Streams


    Like the Event Emitters, Streams are native constructs provided by Node.js and
    are often either left unused by developers or misunderstood. And just like with
    EventEmitters, you’ve probably used more than one stream already and didn’t even
    notice.


    So in this section, I want to go over the module and show how it relates to both
    the EventEmitters seen earlier and the overall goal of this book. Hopefully you’ll
    find similarities between what I’ve shown you so far and this.


    There are four types of streams available from this module:


    *   Readable streams: will provide the API to read data from a given source.

    *   Writable streams: will allow you to write continues chunks of data to a given
    destination.

    *   Duplex streams: a combination of Readable and Writable streams, allowing you
    to both write to and read from a given source.

    *   Transform streams: a kind of duplex streams that allow you to transform the
    data while reading it and writing it.


    Each stream also has two modes, one in which you can read and write any JavaScript
    type (except for `null`) called Object Mode, and the default one, in which anything
    passing through a stream is either a String or a Buffer. So if my math is right,
    we have the total of eight different streams to choose, so I’ll dive a little
    deeper into each one to show the API they provide and how you would have to go
    about implementing each type of stream.


    #### Readable Streams


    Readable streams allow you to wrap a given source of data into a standard API
    that will let you consume the information provided, either by manually pooling
    the source or simply by reacting to its arrival.


    There are several very common readable streams that developers use almost daily,
    for instance:


    *   HTTP response objects on the client side (meaning any application that connects
    to your API)

    *   HTTP request objects on the server side

    *   TCP sockets

    *   Child process `stdin a`nd `stderr`

    *   Etc.


    All the different streams provide a set of methods or events that we can use to
    either read or write the data. In the case of a readable stream, it will either
    emit a ‘`data`’ event every time there is a new chunk of data (or a new object
    available, depending on whether we’re on Object more or not) or you can pipe the
    output of the reader into a writable stream. The latter gives you no control over
    what’s going on, you simply plug the output of one stream to the input of another,
    and the system takes care of the rest for you.


    Here is a simple example of piping . The following code will connect three different
    streams together:


    ```

    var fs = require("fs"),

    zlib = require("zlib");

    var r = fs.createReadStream(''file.txt'');

    var z = zlib.createGzip();

    var w = fs.createWriteStream(''file.txt.gz'');

    r.pipe(z).pipe(w);

    ```


    The previous code is creating three different streams and piping them together
    in the last line. The end result will be the ability to zip a given file and save
    it to disk.


    Simply to show the equivalent code when doing it without piping, here is how you
    would go about it:


    ```

    var fs = require("fs"),

    zlib = require("zlib");

    var r2 = fs.createReadStream(''file.txt'');

    var z2 = zlib.createGzip();

    var w2 = fs.createWriteStream(''file.txt.gz'');

    w2.on(''open'', function() {

    r2.on(''data'', function(chunk) {

    console.log("data chunk: ", chunk);

    z2.write(chunk);

    });

    z2.on(''data'', function(data) {

    console.log("-- gzip chunk --");

    w2.write(data);

    });

    r2.on(''end'', function() {

    z2.end();

    });

    z2.on(''end'', function (){

    w2.end();

    });

    });

    ```


    Clearly, the code is a bit longer, and there is more to handle manually, but sometimes
    that is needed, even if it’s just to add some debugging messages like in the previous
    code.


    This code is showing one particular event that is very useful when dealing with
    readable streams: the `data` event. This event will be fired every time there
    is a newly available chunk of data ready to be consumed by your code.


    Readable streams can also emit the `readable` event, which happens whenever there
    are data available to be read. In this case, the consumer would have to call the
    `read` method of the stream in order to get that next bit of data. This would
    come in handy when you require extra layers of control over the behavior of your
    stream—particularly the previous event would only let you know once new data were
    received, while this one would let you decide what to do once data are available
    and before they are actually received (depending on your logic, you could read
    it or ignore it).


    There are other useful, though simpler, events emitted by readable streams, such
    as the `end` event, emitted to notify that there are no more data to be read;
    the `close` event, emitted once there are no more events to emit; and the `error`
    event, which I already covered.


    #### Writable Streams


    In the case of writable streams , they work just like the opposite of readable
    streams: They wrap the destination of your data into an easy-to-use container.
    And just like with any other stream, you can pipe other streams to it, or you
    can manually write to it.


    Some common writable streams are:


    *   fs write streams

    *   zlib streams (like you saw above)

    *   crypto streams


    Using these streams is pretty straightforward. The main methods you’ll want to
    know about are `write` to actually send data to it and `end` to close it. I’ve
    already shown how they work on the previous code sample, so I’m not going to bore
    you with them again.


    Since all streams are also EventEmitters , they will trigger some specific events.
    In the case of the writables, you should pay special attention to:


    *   `drain`: This event is triggered after a `stream.write` call returns `false`.
    Once this event is triggered, then the writing can be resumed. This event can
    be triggered by your stream when the destination of your writes has been overwhelmed
    and needs some time before the next chunk of data can be sent.

    *   `error`: This one is common to all EventEmitters, so please, whenever you’re
    creating a stream, set a handler for this event; otherwise, your entire application
    will crash if this error is not handled.


    #### Duplex and Transform Streams


    These two types of streams are actually based on the previous two. You have the
    Duplex stream, which is simply (and obviously) a stream that implements both the
    Readable and the Writable interfaces (like a TCP socket).


    And then you have the Transform streams, which are Duplex streams, but with the
    variation that allows you to change the input it receives into something else
    before it becomes the output. In other words, you could, for instance, create
    a Transform stream that receives JavaScript Objects and writes JSON strings into
    some storage system.


    The main difference between a Duplex and a Transform stream, aside from the obvious,
    of course, is that for the Duplex stream, the Read and Write events are being
    handled in parallel of each other, meaning individually. The Write action/event
    is not tied to the Read that one would expect to come before, so if you’re dealing
    with asynchronous processes (which in Node.js you most probably will be), take
    that into account. I’ll show you a specific case of this below.'
  trans: "\n### 流\n\n与事件发射器类似，流是 Node.js 提供的原生构造，常常被开发者忽略或误解。而且就像 `EventEmitters`\
    \ 一样，你可能已经使用过不止一个流，甚至自己都没注意到。\n\n因此在本节中，我想深入讲解这个模块，并展示它如何与之前看到的 `EventEmitters`\
    \ 以及本书的总体目标相关联。希望你能发现我迄今所讲内容与这部分之间的相似之处。\n\nNode.js 的这个模块提供了四种类型的流：\n\n-   **可读流**：提供从指定源读取数据的\
    \ API。\n-   **可写流**：允许你将连续的数据块写入指定目标。\n-   **双工流**：可读流和可写流的结合，允许你向指定源写入数据和从中读取数据。\n\
    -   **转换流**：一种特殊的双工流，允许你在读取和写入数据时对数据进行转换。\n\n每种流还有两种模式：一种是 **对象模式**，允许你读取和写入任何\
    \ JavaScript 类型（`null` 除外）；另一种是默认模式，流中传输的任何内容都是 `String` 或 `Buffer`。如果我没算错的话，我们总共有八种不同的流可供选择，因此我将更深入地探讨每一种流，展示它们提供的\
    \ API，以及你需要如何实现每种类型的流。\n\n#### 可读流\n\n可读流允许你将指定的数据源封装到一个标准 API 中，让你能够通过手动轮询源或被动响应数据到达的方式来消费所提供的信息。\n\
    \n开发者几乎每天都会遇到几种非常常见的可读流，例如：\n\n-   客户端的 HTTP 响应对象（指任何连接到你的 API 的应用程序）\n-   服务端的\
    \ HTTP 请求对象\n-   TCP 套接字\n-   子进程的 `stdin` 和 `stderr`\n-   等等。\n\n所有不同类型的流都提供一组方法或事件，我们可以用它们来读取或写入数据。对于可读流，每当有新的数据块（或根据是否处于对象模式，有新的对象可用）时，它会触发\
    \ `data` 事件，或者你可以将读取器的输出通过管道连接到可写流。后者让你无法控制具体过程，你只需将一个流的输出连接到另一个流的输入，系统就会为你处理其余的事情。\n\
    \n下面是一个管道连接的简单示例。以下代码将连接三个不同的流：\n\n```javascript\nvar fs = require(\"fs\"),\n\
    zlib = require(\"zlib\");\nvar r = fs.createReadStream('file.txt');\nvar z = zlib.createGzip();\n\
    var w = fs.createWriteStream('file.txt.gz');\nr.pipe(z).pipe(w);\n```\n\n上面的代码创建了三个不同的流，并在最后一行通过管道将它们连接起来。最终结果是将指定文件压缩并保存到磁盘。\n\
    \n为了显示不使用管道连接时的等效代码，下面是你可能需要采用的方法：\n\n```javascript\nvar fs = require(\"fs\"),\n\
    zlib = require(\"zlib\");\nvar r2 = fs.createReadStream('file.txt');\nvar z2 =\
    \ zlib.createGzip();\nvar w2 = fs.createWriteStream('file.txt.gz');\nw2.on('open',\
    \ function() {\n  r2.on('data', function(chunk) {\n    console.log(\"data chunk:\
    \ \", chunk);\n    z2.write(chunk);\n  });\n  z2.on('data', function(data) {\n\
    \    console.log(\"-- gzip chunk --\");\n    w2.write(data);\n  });\n  r2.on('end',\
    \ function() {\n    z2.end();\n  });\n  z2.on('end', function () {\n    w2.end();\n\
    \  });\n});\n```\n\n很明显，这段代码更长一些，需要手动处理的事情也更多，但有时这是必要的，即使只是为了像上面的代码一样添加一些调试信息。\n\
    \n这段代码展示了一个在处理可读流时非常有用的特定事件：`data` 事件。每当有新的数据块可供你的代码消费时，此事件就会被触发。\n\n可读流也可以触发\
    \ `readable` 事件，该事件在有数据可读时发生。在这种情况下，消费者必须调用流的 `read` 方法才能获取下一段数据。当你需要对流的行为进行额外控制时，这会非常有用——特别是，前一个事件只会在收到新数据时通知你，而\
    \ `readable` 事件则允许你在数据可用但实际接收之前决定如何处理（根据你的逻辑，你可以选择读取或忽略它）。\n\n可读流还有其他有用但更简单的事件，例如\
    \ `end` 事件，用于通知没有更多数据可读；`close` 事件，在不再有事件可触发时触发；以及我已经介绍过的 `error` 事件。\n\n####\
    \ 可写流\n\n对于可写流来说，它们的工作方式与可读流正好相反：它们将数据的目标封装到一个易于使用的容器中。就像任何其他流一样，你可以将其他流通过管道连接到它，也可以手动写入。\n\
    \n一些常见的可写流包括：\n\n-   `fs` 写入流\n-   `zlib` 流（就像你上面看到的那样）\n-   加密流\n\n使用这些流非常简单。你需要了解的主要方法是：`write`\
    \ 用于实际发送数据，`end` 用于关闭流。我在前面的代码示例中已经展示了它们的工作原理，所以这里不再赘述。\n\n由于所有流也都是 `EventEmitters`，它们会触发一些特定事件。对于可写流，你应特别注意：\n\
    \n-   `drain`：当 `stream.write` 调用返回 `false` 后触发此事件。一旦此事件被触发，就可以恢复写入。当写入目标不堪重负，需要一些时间才能发送下一个数据块时，你的流可能会触发此事件。\n\
    -   `error`：这个事件在所有 `EventEmitters` 中都很常见，因此，无论何时创建流，请务必为此事件设置一个处理程序；否则，如果此错误未被处理，整个应用程序将会崩溃。\n\
    \n#### 双工流和转换流\n\n这两种类型的流实际上基于前面两种流。双工流是一个（显而易见地）同时实现了可读和可写接口的流（例如一个 TCP 套接字）。\n\
    \n然后是转换流，它是一种双工流，但不同之处在于它允许你在输入变为输出之前对其进行更改。换句话说，例如，你可以创建一个接收 JavaScript 对象并将\
    \ JSON 字符串写入某个存储系统的转换流。\n\n除了显而易见的区别之外，双工流和转换流的主要区别在于，对于双工流，读取和写入事件是并行处理的，也就是相互独立的。写入操作/事件并不依赖于预期先发生的读取事件，因此，如果你正在处理异步进程（在\
    \ Node.js 中你很可能会这样），请务必考虑这一点。下面我将展示一个具体案例。\n"
- fmt: '### Writing Your Custom Stream


    The previous code shows an example of how to use both a premade readable and a
    premade writable stream, but what it doesn’t do is show you how to implement your
    own custom streams, because let’s face it, once you understand streams, you’ll
    want to use them every chance you get! (At least that’s what happened to me!)


    I provide a very simple example here to show how easy is it to create objects
    that comply with the descriptions of each type of stream.


    The following code will set up an endpoint on an HTTP server that receives data
    and through a set of streams. It will:


    - Get the body of the request and transform it into a JavaScript object.

    - Add one attribute to it.

    - Save it to a database.

    - Transform it back into a String.

    - Return the string back to the client.


    ```

    var  inherits = require("util").inherits;

    var streams = require("stream");

    var Transform = streams.Transform;

    //Turns the request''s body into an object

    function GetBody() {

    Transform.call(this, {objectMode: true});

    }

    inherits(GetBody, Transform);

    GetBody.prototype._transform = function(obj, encoding, callback) {

    var str = obj.toString();

    callback(null, JSON.parse(str));

    };

    //Adds the timestamp value

    function AddTimeStamp() {

    Transform.call(this, {objectMode: true});

    }

    inherits(AddTimeStamp, Transform);

    AddTimeStamp.prototype._transform = function(obj, encoding, callback) {

    obj.timestamp = Date.now();

    callback(null, obj);

    };

    //Turns the object into a string

    function ToJSONEncoder() {

    Transform.call(this, {objectMode: true});

    }

    inherits(ToJSONEncoder, Transform);

    ToJSONEncoder.prototype._transform = function(obj, encoding, callback) {

    callback(null, JSON.stringify(obj));

    };

    //Saves the object into the database

    function SaveUserToDB() {

    Transform.call(this, {objectMode: true});

    }

    inherits(SaveUserToDB, Transform);

    SaveUserToDB.prototype._transform = function(obj, encoding, callback) {

    var self = this;

    UserModel.create(obj, function(err, obj) {

    if(err) {

    return callback(err);

    }

    self.push(obj);

    callback();

    });

    };

    var addTimeStamp = new AddTimeStamp();

    var save = new SaveUserToDB();

    var getBody = new GetBody();

    var toJSON = new ToJSONEncoder();

    function handleNewUsers(req, res, next) {

    req

    .pipe(getBody)

    .pipe(addTimeStamp)

    .pipe(save)

    .pipe(toJSON)

    .pipe(res);

    }

    ```


    As you can see, you can do all that by creating a set of `Transform` streams and
    leveraging the fact that the `Request` object is also a `ReadableStream` and that
    the `Response` object is a `WritableStream` by default on Node.


    If you want to test this code, you’ll also need the setup code that comes before
    it, so here it is (and, of course, you’ll need this to install the dependencies
    like MongoDB, mongoose and express):


    ```

    var mongoose = require("mongoose");

    var express = require("express");

    // --- db

    var Schema = mongoose.Schema;

    var UserSchema = Schema({

    full_name: String,

    birthdate: Date,

    username: String,

    password: String,

    timestamp: Number

    });

    var UserModel = mongoose.model("User", UserSchema);

    mongoose.connect (''mongodb://localhost/test-streams'');

    //--- http server

    var app = express();

    app.post(''/users'', handleNewUsers);

    app.listen(3000, function() {

    console.log("Ready to roll!");

    });

    ```


    It simply takes care of setting up the HTTP server and the MongoDB connection
    and defining the schema for the model.


    **Caution**


    When writing code that uses the stream properties of the `Request` object like
    the previous one, refrain from using the `body-parse` (available at [`https://www.npmjs.com/package/body-parser`](https://www.npmjs.com/package/body-parser))
    middleware module for Express, because it will affect it, and your code will not
    work.


    Finally, I’d like to draw your attention to the `SaveUserToDB` stream, which originally
    I thought of as a `Duplex` stream. It would write the object into the database
    and then return it on the following `Read` call, but as it turns out, due to what
    I described earlier (when talking about `Duplex` v `Transform` streams), the `Read`
    and `Write` events are not linked, so I would get the `Read` event before the
    `Write` was done and therefore I would have nothing to return at that point. This
    is solved by turning the Stream into a `Transform` stream.


    A good example of when a `Duplex` stream would come in handy would be some kind
    of client/server connection handler—basically a stream that would let you write
    messages from the server to the client and at the same time read the messages
    received by the server on the client application.


    In the end, when trying to implement a custom stream, Table 5-1 will help you
    understand which methods need to be implemented and when.


    **Table 5-1.** Simple Cheatsheet to Explain When to Implement What Kind of Stream


    | When Doing… | Your Stream Is a… | And You Have to Implement… |

    | --- | --- | --- |

    | Reads only | Readable | `_read` |

    | Writes only | Writable | `_write` |

    | Reads and Writes | Duplex | `_read`, `_write` |

    | Changes to the data you write | Transform | `_transform` |'
