- fmt: "# Summary\n\nHopefully this chapter has shed some light on a very misunderstood\
    \ and often forgotten feature of Node.js.\n\nBuilt-in streams will be a great\
    \ tool when dealing with reactive code on the back-end, like you’ve seen in past\
    \ chapters. So now that you know how to use them you can start tinkering yourself!\n\
    \nThe next chapter will cover the main libraries out there that deal specifically\
    \ with reactive programming in JavaScript—particularly in Node.js.\n\n**Footnotes**\
    \  \n\\[1\\] (This is of course a rough approximation, since the time added by\
    \ the parallel function needs to be taken into account for an exact number.)\n\
    \n# 6. Overview of the Land\n\nSo far, in this book I’ve covered what reactive\
    \ programming (RP) is, how useful it can be on the back end, and, finally, how\
    \ Node.js is such a great match for it. I even went ahead and showed some code\
    \ alternatives on how to accomplish a reactive back end.\n\nIn this chapter, before\
    \ I go deep into the creation of this book’s reactive library, I want to go over\
    \ the current libraries out there. Some of them are not really meant for Node.js,\
    \ and some of them are, but the important thing here is that it’s all JavaScript\
    \ and you might end up learning from them, even though they can’t really be used\
    \ as they are being used on the back end.\n\nBy the end of this chapter, you should\
    \ have all you need to start getting your hands dirty with the code for the reactive\
    \ library that’s coming up.\n\n## Reactive Extension for JavaScript: RxJS\n\n\
    Also known as the Reactive Extension for JavaScript (please look at [`http://reactivex.io/`](http://reactivex.io/)),\
    \ `RxJS` is, as of this writing, in version 4.0 and it’s one of the most popular\
    \ reactive libraries out there.\n\nThis project is actively developed by Microsoft,\
    \ but there is a huge open source community behind it as well, helping improve\
    \ the library. For such contributions, they do provide a Wiki page in case you’re\
    \ interested (which you can find at [`https://github.com/Reactive-Extensions/RxJS/wiki/Contributions`](https://github.com/Reactive-Extensions/RxJS/wiki/Contributions)).\
    \ But bear in mind that by the looks of it, they are the only ones who get to\
    \ decide which features are good for the “product” and which aren’t, so bug fixes\
    \ and documentation improvements are welcomed; new features, however, will have\
    \ to be discussed before even considering them. This is probably due to the fact\
    \ that Rx is a suite of libraries for multiple languages, all based on the same\
    \ principles, so adding a new feature to one would imply adding that same feature\
    \ to the rest of them.\n\nAnother benefit of it being backed by such a big organization\
    \ is that this library has a huge amount of documentation behind it. I’m not just\
    \ talking about online tutorials, there are also several books and workshops available\
    \ too. You can get the full list of resources from their Github page ([`https://github.com/Reactive-Extensions/RxJS#resources`](https://github.com/Reactive-Extensions/RxJS#resources)).\n\
    \n### License\n\nThis library is distributed under the Apache License, version\
    \ 2.0 ([`http://www.apache.org/licenses/LICENSE-2.0`](http://www.apache.org/licenses/LICENSE-2.0)),\
    \ which basically means you can use it for commercial products without a problem\
    \ and you can modify it and distribute it, but if you do, you’ll have to include\
    \ a list of the changes you made and a copy of the license as well. So all in\
    \ all, you’re pretty much free to do whatever you want with it, as long as you\
    \ comply with some basic rules.\n\n### Compatibility\n\n`RxJS` is compatible with\
    \ all major browsers all the way back to some pretty scary versions—to be more\
    \ specific, Internet Explorer 6+, Firefox 1.0+, and Chrome 4+. Hopefully you’re\
    \ not really using such archaic versions of these browsers, but just in case.\n\
    \nAmazingly enough, this library is also compatible with Node.js, from version\
    \ 0.4 and above, so the code samples I’ll show will be tested directly in Node\
    \ (woohoo!).\n\n### Code Samples\n\nAbout those samples, since this is actually\
    \ Node-compatible, that’s what I’ll use for them. The first code sample is something\
    \ pretty basic to get you started.\n\n**Note**  \nIn order to use `RxJS` with\
    \ Node, you’ll have to install the `rx` package and the `node-rx` bindings using\
    \ the classic `npm install` command: `$ npm install rx` and `$ npm install node-rx`.\n\
    \n```javascript\nvar rx = require(\"rx\");\nvar rxnode = require(\"rx-node\")\
    \ ;\nvar subscription = rxnode.fromReadableStream(process.stdin);\nsubscription.filter(function(line)\
    \ {\nvar matches = line.toString().match(/[a]{1}/g);\nreturn matches !== null\
    \ && matches.length > 5;\n})\n.subscribe(function (x) {\nconsole.log(x.toString());\n\
    });\n```\n\nAs you can see, the Node.js bindings are compatible with Node’s streams\
    \ (check out Chapter [5](#A418015_1_En_5_Chapter.html) if you want to know more\
    \ about those). In this case I’m simply using the `stdin` stream, which I can\
    \ subscribe to after setting up a simple filtering function. In other words, the\
    \ earlier code will let you enter a sentence, and once you hit enter (which is\
    \ when the `data` event of the `stdin` stream is triggered) it will count the\
    \ number of A’s on it. If it’s higher than 5, then it’ll print the line again;\
    \ otherwise it will do nothing.\n\nThe code might be simple, but it’s enough to\
    \ get you started. Basically you’ll always be following the same pattern:\n\n\
    * Find a stream to use.\n* Configure a set of transformations/operations on the\
    \ data of the stream.\n* Finally, subscribe to the stream, passing a final function\
    \ to use, which will receive the final version of the data chunk sent with the\
    \ `data` event.\n\n**Tip**  \nIf you’re using a custom stream with custom events,\
    \ you can pass the `end` event name and the `data` event name (in that order)\
    \ to the `fromStream` method after the actual stream.\n\nLet’s look at one more\
    \ example. This is the re-write of an example from Chapter [5](#A418015_1_En_5_Chapter.html),\
    \ where the script would read a file as a stream and split it into words, change\
    \ those words so they’re all in capital letters, and then print the words out\
    \ on a new line for each word.\n\n```javascript\nvar rx = require(\"rx\");\nvar\
    \ noderx = require(\"rx-node\");\nvar fs = require(\"fs\");\nvar stream = noderx.fromStream(fs.createReadStream('./test-rxjs2.js'));\n\
    stream\n.flatMap(function(s){ return s.toString().split(\" \")  })\n.map(function(str)\
    \ {\nreturn str.toUpperCase();\n})\n.subscribe(function(b) {\nconsole.log(b.toString());\n\
    });\n```\n\nBecause `RxJs` has no helper methods like the ones provided by the\
    \ `event-stream` (remember the `split` method?) module, in order to split the\
    \ lines and make the words the new chunks of data on the stream, I used the `flatMap`\
    \ method. This method takes the returned value from its function, which might\
    \ be an Observable or something that can be made an Observable (such as an Array\
    \ in our case), and flattens it and returns a stream that emits chunks of this\
    \ new item."
  raw: '## Summary


    Hopefully this chapter has shed some light on a very misunderstood and often forgotten
    feature of Node.js.


    Built-in streams will be a great tool when dealing with reactive code on the back-end,
    like you’ve seen in past chapters. So now that you know how to use them you can
    start tinkering yourself!


    The next chapter will cover the main libraries out there that deal specifically
    with reactive programming in JavaScript—particularly in Node.js.


    Footnotes [1](#A418015_1_En_5_Chapter.html#Fn1_source)


    This is of course a rough approximation, since the time added by the parallel
    function needs to be taken into account for an exact number.


    # 6. Overview of the Land


    So far, in this book I’ve covered what reactive programming (RP) is, how useful
    it can be on the back end, and, finally, how Node.js is such a great match for
    it. I even went ahead and showed some code alternatives on how to accomplish a
    reactive back end.


    In this chapter, before I go deep into the creation of this book’s reactive library,
    I want to go over the current libraries out there. Some of them are not really
    meant for Node.js, and some of them are, but the important thing here is that
    it’s all JavaScript and you might end up learning from them, even though they
    can’t really be used as they are being used on the back end.


    By the end of this chapter, you should have all you need to start getting your
    hands dirty with the code for the reactive library that’s coming up.


    ## Reactive Extension for JavaScript: RxJS


    Also known as the Reactive Extension for JavaScript (please look at [`http://reactivex.io/`](http://reactivex.io/)
    `)`, RxJS is, as of this writing, in version 4.0 and it’s one of the most popular
    reactive libraries out there.


    This project is actively developed by Microsoft , but there is a huge open source
    community behind it as well, helping improve the library. For such contributions,
    they do provide a Wiki page in case you’re interested (which you can find at [`https://github.com/Reactive-Extensions/RxJS/wiki/Contributions`](https://github.com/Reactive-Extensions/RxJS/wiki/Contributions)
    ). But bear in mind that by the looks of it, they are the only ones who get to
    decide which features are good for the “product” and which aren’t, so bug fixes
    and documentation improvements are welcomed; new features, however, will have
    to be discussed before even considering them. This is probably due to the fact
    that Rx is a suite of libraries for multiple languages, all based on the same
    principles, so adding a new feature to one would imply adding that same feature
    to the rest of them.


    Another benefit of it being backed by such a big organization is that this library
    has a huge amount of documentation behind it. I’m not just talking about online
    tutorials, there are also several books and workshops available too. You can get
    the full list of resources from their Github page ( [`https://github.com/Reactive-Extensions/RxJS#resources`](https://github.com/Reactive-Extensions/RxJS#resources)
    ).


    ### License


    This library is distributed under the Apache License, version 2.0 ( [`http://www.apache.org/licenses/LICENSE-2.0`](http://www.apache.org/licenses/LICENSE-2.0)
    `)`, which basically means you can use it for commercial products without a problem
    and you can modify it and distribute it, but if you do, you’ll have to include
    a list of the changes you made and a copy of the license as well. So all in all,
    you’re pretty much free to do whatever you want with it, as long as you comply
    with some basic rules.


    ### Compatibility


    RxJS is compatible with all major browsers all the way back to some pretty scary
    versions—to be more specific, Internet Explorer 6+, Firefox 1.0+, and Chrome 4+.
    Hopefully you’re not really using such archaic versions of these browsers, but
    just in case.


    Amazingly enough, this library is also compatible with Node.js, from version 0.4
    and above, so the code samples I’ll show will be tested directly in Node (woohoo!).


    ### Code Samples


    About those samples, since this is actually Node-compatible, that’s what I’ll
    use for them. The first code sample is something pretty basic to get you started.


    Note


    In order to use RxJS with Node, you’ll have to install the `rx` package and the
    `node-rx` bindings using the classic npm install command: `$npm install rx` and
    `$npm install node-rx`.


    ```

    var rx = require("rx");

    var rxnode = require("rx-node") ;

    var subscription = rxnode.fromReadableStream(process.stdin);

    subscription.filter(function(line) {

    var matches = line.toString().match(/[a]{1}/g);

    return matches !== null && matches.length > 5;

    })

    .subscribe(function (x) {

    console.log(x.toString());

    });

    ```


    As you can see, the Node.js bindings are compatible with Node’s streams (check
    out Chapter [5](#A418015_1_En_5_Chapter.html) if you want to know more about those).
    In this case I’m simply using the `stdin` stream, which I can subscribe to after
    setting up a simple filtering function. In other words, the earlier code will
    let you enter a sentence, and once you hit enter (which is when the ‘`data`’ event
    of the `stdin` stream is triggered) it will count the number of A’s on it. If
    it’s higher than 5, then it’ll print the line again; otherwise it will do nothing.


    The code might be simple , but it’s enough to get you started. Basically you’ll
    always be following the same pattern:


    *   Find a stream to use.

    *   Configure a set of transformations/operations on the data of the stream.

    *   Finally, subscribe to the stream, passing a final function to use, which will
    receive the final version of the data chunk sent with the ‘`data`’ event.


    Tip


    If you’re using a custom stream with custom events, you can pass the `end` event
    name and the `data` event name (in that order) to the `fromStream` method after
    the actual stream.


    Let’s look at one more example. This is the re-write of an example from Chapter
    [5](#A418015_1_En_5_Chapter.html), where the script would read a file as a stream
    and split it into words, change those words so they’re all in capital letters,
    and then print the words out on a new line for each word.


    ```

    var rx = require("rx");

    var noderx = require("rx-node");

    var fs = require("fs");

    var stream = noderx.fromStream(fs.createReadStream(''./test-rxjs2.js''));

    stream

    .flatMap(function(s){ return s.toString().split(" ")  })

    .map(function(str) {

    return str.toUpperCase();

    })

    .subscribe(function(b) {

    console.log(b.toString());

    });

    ```


    Because RxJs has no helper methods like the ones provided by the `event-stream`
    (remember the `split` method?) module, in order to split the lines and make the
    words the new chunks of data on the stream, I used the `flatMap` method. This
    method takes the returned value from its function, which might be an Observable
    or something that can be made an Observable (such as an Array in our case), and
    flattens it and returns a stream that emits chunks of this new item.'
  trans: "\n# 总结\n\n希望本章能让你对 Node.js 中一个常被误解且常被遗忘的特性有所了解。\n\n内置流将成为在后端处理响应式代码的绝佳工具，正如你在前几章中所见。所以现在你知道了如何使用它们，就可以开始自己动手实践了！\n\
    \n下一章将涵盖目前专门处理 JavaScript（尤其是 Node.js）中响应式编程的主要库。\n\n**脚注**  \n\\[1\\] （当然，这只是一个粗略的近似，因为要得到精确的数字，还需要考虑并行函数所增加的时间。）\n\
    \n# 6. 领域概览\n\n到目前为止，我在本书中介绍了什么是响应式编程（RP）、它在后端的巨大价值，以及 Node.js 为何与其如此契合。我甚至进一步展示了一些实现响应式后端的代码方案。\n\
    \n在本章中，在深入探讨如何创建本书的响应式库之前，我想先回顾一下目前已有的库。有些库并非专为 Node.js 设计，而有些则是。但重要的是，它们全都是 JavaScript，尽管它们无法完全按原样在后端使用，但你仍可能从中学到东西。\n\
    \n到本章结束时，你应该已掌握所有必要知识，可以开始动手编写即将介绍的响应式库的代码了。\n\n## 针对 JavaScript 的响应式扩展：RxJS\n\
    \n也被称为针对 JavaScript 的响应式扩展（请查阅 [`http://reactivex.io/`](http://reactivex.io/)），`RxJS`\
    \ 在撰写本文时已发布至 4.0 版本，是目前最流行的响应式库之一。\n\n该项目由微软积极开发，但背后也有一个庞大的开源社区协助改进该库。若你对此感兴趣，他们提供了一个\
    \ Wiki 页面（可在 [`https://github.com/Reactive-Extensions/RxJS/wiki/Contributions`](https://github.com/Reactive-Extensions/RxJS/wiki/Contributions)\
    \ 找到）。但请注意，根据目前情况来看，他们似乎是唯一有权决定哪些功能适合“产品”、哪些不适合的群体，因此欢迎提交错误修复和文档改进；然而，新功能在考虑之前必须经过讨论。这可能是因为\
    \ Rx 是一套基于相同原则的多语言库集合，为其中一个库添加新功能就意味着要为其他所有库也添加同样的功能。\n\n由如此大型的组织支持还有一个好处，那就是这个库拥有海量的文档资源。我指的不只是在线教程，还有许多相关的书籍和工作坊。你可以从他们的\
    \ GitHub 页面（[`https://github.com/Reactive-Extensions/RxJS#resources`](https://github.com/Reactive-Extensions/RxJS#resources)）获取完整的资源列表。\n\
    \n### 许可证\n\n该库采用 Apache 许可证 2.0 版（[`http://www.apache.org/licenses/LICENSE-2.0`](http://www.apache.org/licenses/LICENSE-2.0)）进行分发。这基本上意味着你可以将其用于商业产品而无需担心，也可以修改和分发它，但如果你这样做，你必须附上你所做的更改列表以及许可证的副本。总而言之，只要遵守一些基本规则，你几乎可以自由地用它做任何你想做的事。\n\
    \n### 兼容性\n\n`RxJS` 兼容所有主流浏览器，甚至包括一些相当古老的版本——具体来说，是 Internet Explorer 6+、Firefox\
    \ 1.0+ 和 Chrome 4+。希望你没有真正使用这些过时的浏览器版本，但以防万一。\n\n令人惊讶的是，该库也与 Node.js 兼容，支持 0.4\
    \ 及以上版本，因此我将展示的代码示例将直接在 Node 中进行测试（呜呼！）。\n\n### 代码示例\n\n关于这些示例，由于它实际上与 Node 兼容，我将使用\
    \ Node 来运行它们。第一个代码示例非常基础，帮助你入门。\n\n**注意**  \n要在 Node 中使用 `RxJS`，你需要使用经典的 `npm\
    \ install` 命令安装 `rx` 包和 `node-rx` 绑定：`$ npm install rx` 和 `$ npm install node-rx`。\n\
    \n```javascript\nvar rx = require(\"rx\");\nvar rxnode = require(\"rx-node\")\
    \ ;\nvar subscription = rxnode.fromReadableStream(process.stdin);\nsubscription.filter(function(line)\
    \ {\nvar matches = line.toString().match(/[a]{1}/g);\nreturn matches !== null\
    \ && matches.length > 5;\n})\n.subscribe(function (x) {\nconsole.log(x.toString());\n\
    });\n```\n\n如你所见，Node.js 绑定与 Node 的流兼容（如果你想知道更多相关信息，请查看第 5 章）。在这个例子中，我只是简单地使用了\
    \ `stdin` 流，在设置了一个简单的过滤函数之后，我就可以订阅它了。换句话说，这段代码允许你输入一个句子，一旦你按下回车键（这会触发 `stdin`\
    \ 流的 `data` 事件），它就会统计句子中字母 A 的数量。如果数量大于 5，它会再次打印该行；否则什么也不做。\n\n代码可能很简单，但足以让你入门。基本上你总是遵循相同的模式：\n\
    \n* 找到一个要使用的流。\n* 为流的数据配置一组转换/操作。\n* 最后，订阅该流，并将一个最终要使用的函数传递给它，该函数将接收通过 `data`\
    \ 事件发送的数据块的最终版本。\n\n**提示**  \n如果你使用的是带有自定义事件的自定义流，你可以在实际流之后，将 `end` 事件名称和 `data`\
    \ 事件名称（按此顺序）传递给 `fromStream` 方法。\n\n我们再来看一个例子。这是对第 5 章中一个例子的重写，该脚本会将文件作为流读取，并将其拆分为单词，将这些单词全部转换成大写字母，然后每个单词单独打印在一行上。\n\
    \n```javascript\nvar rx = require(\"rx\");\nvar noderx = require(\"rx-node\");\n\
    var fs = require(\"fs\");\nvar stream = noderx.fromStream(fs.createReadStream('./test-rxjs2.js'));\n\
    stream\n.flatMap(function(s){ return s.toString().split(\" \")  })\n.map(function(str)\
    \ {\nreturn str.toUpperCase();\n})\n.subscribe(function(b) {\nconsole.log(b.toString());\n\
    });\n```\n\n因为 `RxJs` 没有像 `event-stream` 模块（还记得 `split` 方法吗？）提供的那些辅助方法，为了拆分行并使单词成为流中新的数据块，我使用了\
    \ `flatMap` 方法。这个方法会获取其函数返回的值（可能是一个 Observable 或可以变成 Observable 的东西，在这个例子中是一个数组），将其展平，并返回一个发出这些新数据项的流。\n"
- fmt: '# Bacon.js


    `Bacon.js` is a nice little library for doing Functional Reactive Programming
    in JavaScript. As of this writing, its version is `0.7.84` and although the number
    might give you the wrong idea (it being pre-version 1 and all), it’s been around
    for over 3 years now and it’s quite popular. It’s downloaded over 14,000 times
    each month according to NPM’s stats, and in Github (`https://github.com/baconjs/bacon.js`)
    it has over 5,000 stars.


    It’s not clearly stated who the main author of this library is, although after
    a bit of digging it appears to be Mr. Juha Paananen. You can find a list of active
    contributors on Github (`https://github.com/orgs/baconjs/people`). Its documentation
    appears to be quite comprehensive; they list quite a few resources, like tutorials
    and even a video example (`https://github.com/baconjs/bacon.js/wiki/Documentation`).


    And finally, if you feel like you need to ask a question, they do have an active
    Google Group for you (`https://groups.google.com/forum/?fromgroups#!forum/baconjs`)
    and an active chat room at Gitter (`https://gitter.im/baconjs/bacon.js`).


    ## License


    In the case of `Bacon.js`, the license is one of the most permissive ones out
    there: MIT License. It basically states that you can do pretty much anything with
    it as long as you properly add a copyright notice and add a copy of the license.


    ## Compatibility


    According to its author, the library doesn’t really mess with the prototype of
    existing objects on the language, except in two specific cases:


    - On a browser environment, it adds the `Bacon` object to the `window` instance.

    - If `jQuery` is defined, it adds the method `asEventStream` to it.


    With that in mind, the library should be quite compatible with anything else you’re
    using in your project.


    As for browser and Node’s version compatibility, it’s been tested with all major
    browsers on all modern versions (as stated on Bacon’s readme file) and it works
    with all of them, because it doesn’t use any browser-dependent feature. Same thing
    for Node, since it doesn’t use anything from the actual browser, this library
    is pure JavaScript, which makes it compatible with Node as well.


    ## Code Samples


    In the case of `Bacon.js`, you won’t need an extra library with `Node.js` bindings
    because like I already mentioned earlier, this library is 100% environment-agnostic
    JavaScript. That being said, here’s a simple example showing how easy it is to
    create new streams from custom events:


    ```

    var bacon = require("baconjs");

    var fs = require("fs");

    process.stdin.resume();

    process.stdin.setEncoding(''utf8'');

    var util = require(''util'');

    function readFilenames(sink) {

    process.stdin.on(''data'', function (text) {

    sink(text.trim());

    });

    }

    //Create a new EventStream from a custom function

    var filenames = bacon.fromBinder(readFilenames);

    filenames.onValue(function(name) { //tap into the stream to know what''s going
    on

    console.log("-- New filename: ", name, " --");

    })

    var names = filenames.scan([], function(acc, name) { //grab 2 filenames at a time

    return acc.length === 2 ? [name] : acc.concat(name);

    });

    var groupfilenames = names.filter(function(acc) { //once we have 2 move on, otherwise,
    stop here

    return acc.length === 2;

    })

    .flatMap(bacon.fromArray); //turn the new array into a stream

    groupfilenames.onValue(function(fnames) {

    console.log(''['', fnames, '']'');

    });

    groupfilenames.flatMap(function(name) {

    return bacon.fromNodeCallback(fs.readFile, name);

    });

    .onValue(function(content) {

    //print out the content of the files

    console.log(content.toString());

    });

    ```


    Tip


    Installing `Bacon.js` on your `Node.js` project is quite simple. All you need
    is to issue the following command: `$ npm install baconjs`


    The preceding code lets the user enter two filenames, then those names are transformed
    into the actual content of those files. This is all achieved by a series of transformations:


    - A stream is created using the `fromBinder` method, so that every time the user
    hits ENTER a new chunk of data is emitted (a new filename).

    - Then using the `scan` method, I group the chunks on groups of two.

    - By filtering groups that have less than two elements, I’m essentially stopping
    the flow of data through the stream until each group has two filenames.

    - The first `flatMap` method coupled with the result of `fromArray` will turn
    each array into a new stream, which will emit the filenames, but of course, this
    new stream will have a limited amount of events (only two!).

    - Finally, the second `flatMap` method will turn the asynchronous callback of
    the `fs.readFile` method into a stream, making it possible for you to read the
    content of each file within your stream.


    So you can see what I mean on each step, I’ve added intermediate calls to the
    `onValue` method. Figure [6-1](#A418015_1_En_6_Chapter.html#Fig1) represents the
    output of the script and it will show you how each stream is affected by the transformations
    applied to it.


    ![A418015_1_En_6_Fig1_HTML.jpg](A418015_1_En_6_Fig1_HTML.jpg)


    Figure 6-1. Output from executing the preceding code


    Figure [6-1](#A418015_1_En_6_Chapter.html#Fig1) shows the output from executing
    the script. You can see where the user inputs the filenames and what happens in
    between and after as well.


    Let’s look at one more example before leaving this library behind. The following
    code shows how easy it is to grab a single common source of data, split it into
    several streams, and then merge them together.


    ```

    var fs = require("fs");

    var bacon = require("baconjs");

    var freadStream = fs.createReadStream("file3.txt");

    function readFile(sink) {

    freadStream.on(''data'', function(chunk) {

    sink(chunk);

    });

    }

    var fstream = bacon.fromBinder(readFile);

    var charStream = fstream.map(function(chunk) {

    return chunk.toString().split("");

    }).flatMap(bacon.fromArray);

    var onlyNumbers = charStream.filter(function(v) {

    return !isNaN(+v);

    });

    var onlyChars = charStream.filter(function(v) {

    return isNaN(+v);

    });

    var all = onlyNumbers.merge(onlyChars);

    onlyNumbers

    .onValue(function(n) {

    console.log("#", n);

    });

    onlyChars

    .onValue(function(c) {

    console.log("''", c, "''");

    });

    all

    .scan([], function(acc, c) {

    return acc.concat(c);

    })

    .onValue(function(a) {

    console.log("-", a, "-");

    });

    ```


    The code is very simple, but the potential behind it is what matters in this case.
    You could transform each stream individually and then merge them back together.
    In the preceding code, the merge is actually done into an array, so the result
    will be an ever-growing array of value. Figure [6-2](#A418015_1_En_6_Chapter.html#Fig2)
    shows the output of the execution.


    ![A418015_1_En_6_Fig2_HTML.jpg](A418015_1_En_6_Fig2_HTML.jpg)


    Figure 6-2. Output from executing the preceding code'
