  raw: '## Summary


    Scaling your applications with Node.js and having a look at some interesting architectural
    decisions that in turn, will help you create better systems was the final piece
    to the reactive puzzle that this book is. You’ve read it, you got it, now it’s
    time for you to go and start applying what you (hopefully) learned into your code.


    Just remember a few tips:


    *   Reactive and functional programing are a great match.

    *   When it comes to Node.js, reactive programming is almost all about streams,
    so don’t fear them, embrace them and you’ll love it!

    *   If you haven’t yet, accept Node’s asynchronous mentality, it will save you
    a lot of trouble.

    *   And finally, remember to properly design your system into components that
    you can parallelize and scale.


    Finally, let me thank you for accompanying me throughout the book, I sincerely
    hope you’ve found it useful and interesting and that there is at least one thing
    you can take away from it, if that’s the case, then my work is done.


