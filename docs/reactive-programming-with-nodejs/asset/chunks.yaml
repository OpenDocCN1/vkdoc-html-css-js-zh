    2.  The buffer solution can scale on its own, thus removing the need for you to
    worry about it, simply configure your buffer to scale and watch it go (more or
    less, but you get my point, you don’t have to worry about things like sharding
    of the data, availability, etc).  


    Figure [9-2](#A418015_1_En_9_Chapter.html#Fig2) shows a generic example of what
    I described before , on it, you have represented three different types of workers,
    their types indicate their main tasks, so each task can be parallelized and that
    is also represented on the diagram as multiple instances of the same worker type.
    The communication between types is done using some external solution as data buffers,
    just like I mentioned as well. So in the future, if you’re correctly measuring
    the performance of the system, you can detect which parts of it as under stress
    and adjust accordingly. Say you get overwhelmed by client requests, you can simply
    scale on the “type A” workers, the rest of the system will simply continue to
    process the data as fast as it can, unless of course your “type A” workers are
    generating too much data for the “Data Buffer #1”, in such a case, you can scale
    up that buffer and the rest of the process continues the same. See the pattern?
    Scaling up became super easy from an architectural standpoint, you simply need
    more instances, and finally, if your servers start to become overwhelmed by the
    number of instances, again, you can simply add more servers and spread the workers
    throughout the cluster.


    ![A418015_1_En_9_Fig2_HTML.jpg](A418015_1_En_9_Fig2_HTML.jpg)


    Figure 9-2.


    Basic example of a multi-worker communication using data buffers


    Figure [9-3](#A418015_1_En_9_Chapter.html#Fig3) shows how the sample architecture
    would look like once you’ve scaled up your “type A” workers and you “Data Buffer
    #1”, like I said, the rest of it is unaffected.


    ![A418015_1_En_9_Fig3_HTML.jpg](A418015_1_En_9_Fig3_HTML.jpg)


    Figure 9-3.


    The scaled up version of the previous architecture


    Let’s look at some choices of technologies for the data buffers, there are many
    names out there that can do pretty much the same, so lets group them into two
    different categories: push based buffers, and pull based buffers.


    #### Push Based Buffers


    Or in other words, buffers that will push the new data to your workers as soon
    as it becomes available. For this type of buffers, Message Queues are a great
    options, by default most queues work this way. In this model, you have three basic
    actors:


    *   A publisher, which takes care of sending the data into the queue and then
    forgets about it.

    *   A subscriber, which registers itself into the queue for a specific type of
    message and then waits for them.

    *   The actual queue, which receives the messages from the publisher and relays
    them to the first subscriber available.

    *   The advantages of this approach are:

    *   The publishers only need to know how to send the data to the queue, then they
    can forget about it. This simplifies the job of the developer working on this
    process, since they don’t need to worry about retries, lack of consumers, storage
    for the messages, etc.

    *   Consumers also benefit from the simpler logic that comes with this approach,
    since they only need register on the queue and then simply wait for it to push
    a message to them.

    *   Finally, the queue itself is the one that takes most of the hit, it needs
    to handle the messages in, and the messages out, it needs to handle scalability,
    temp storage for the messages in case of failure, and many other aspects of being
    a functional scalable queue. That being said, the great thing about this, is that
    that’s all taken care of, unless you’re coding your own message queue, you’re
    most likely using one of the common ones, Apache Kafka ( [`http://kafka.apache.org/`](http://kafka.apache.org/)
    ), RabbitMQ ( [`https://www.rabbitmq.com`](https://www.rabbitmq.com) ), Redis’
    Pub/Sub ( [`http://redis.io/`](http://redis.io/) ) to name just a few.


    Depending on your particular needs, you might want to go with one or the other,
    for instance, if you’re dealing with a huge incoming traffic (say 100k requests
    / second) you might want to go with Kafka, if on the other hand, you have complex
    routing logic for messages, you might want to consider going with RabbitMQ. So
    you see, even though the approach is the same on all of them (and I just named
    three options), they’re not all exactly the same, so reading up on the major options
    out there might be a good idea.


    Just to illustrate how easy it can be to interact with one of these queues, here
    is a simple example of a publisher and a consumer (subscriber) that work with
    RabbitMQ, this example is using the module amqp ( [`https://www.npmjs.com/package/amqp`](https://www.npmjs.com/package/amqp)
    ):


    ```

    // == CONSUMER CODE ==

    var amqp = require(''amqp'');

    var connection = amqp.createConnection({ host: ''localhost'' });

    // add this for better debuging

    connection.on(''error'', function(e) {

    console.log("Error from amqp: ", e);

    });

    // Wait for connection to become established.

    connection.on(''ready'', function () {

    console.log("Listening for messages...");

    connection.queue(''my-queue'', function (q) {

    // Catch all messages

    q.bind(''#'');

    // Receive messages

    q.subscribe(function (message) {

    // Print messages to stdout

    console.log(message.data.toString());

    });

    });

    });

    //== PUBLISHER CODE ==

    var amqp = require(''amqp'');

    var connection = amqp.createConnection({ host: ''localhost'' });

    // add this for better debuging

    connection.on(''error'', function(e) {

    console.log("Error from amqp: ", e);

    });

    // Wait for connection to become established.

    connection.on(''ready'', function () {

    // Use the default ''amq.topic'' exchange

    connection.publish(''my-queue'', ''Test message'');

    console.log("Message sent!");

    });

    ```


    Nothing fancy, you can split the preceding code into two files, first execute
    the consumer so it can subscribe to Rabbit and then execute the publisher, it
    will send a message to the queue that will be received and printed by the consumer.'
