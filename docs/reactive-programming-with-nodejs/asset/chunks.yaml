- fmt: '### Example #3 – Handling Throttleable Input Streams


    This is not a simple pattern that can be replaced like with the first two examples;
    this example deals with the case where you have an input stream with events that
    happen too fast and need to be throttled.


    To make matters more specific and provide a better example, let’s write down a
    use case for a fictional app:


    - You want your application to let the user input a word or a phrase and, while
    the user is still typing, lookup a translation for that string.

    - You’ll want this application to be a command line Node.js application.

    - Because you’re hitting an external service to provide the translation, you’ll
    also want to handle retries in case the communication to that service fails.


    With that in mind, here is what that code would look like, using traditional imperative,
    non-reactive programming:


    ```

    var stdin = process.stdin;

    stdin.setRawMode(true);

    stdin.resume();

    var currentWord = '''';

    var retries = 0;

    stdin.on(''data'', function(input) {

    input = input.toString();

    currentWord += input;

    console.log(currentWord) //Show the input to the user

    if(input.charCodeAt(0) === 27) process.exit(0); //exit with ESC

    if(input.charCodeAt(0) === 13) { //start a new input string with ENTER

    currentWord = "";

    console.log(" ");

    }

    if(currentWord.length > 0) {

    getTranslation(currentWord, retries, callback);

    }

    })

    /**

    The callback that handles the translation response

    @err is the error message, or null if there is no error

    @trans is the translation string

    @attempt is the current attempt being made

    @string is the string that you''re trying to translate

    */

    function callback(err, trans, attempt, string) {

    if(err) {

    console.error(err, " - retries: ", attempt);

    if(attempt < 3) {

    return getTranslation(string, attempt + 1, callback);

    } else {

    retries = 0;

    return console.log("Fatal error, retrying is not helping: ", err)

    }

    }

    console.log("''",trans,"''")

    }

    //Fake translation service below

    var __DICT__ = {

    "hello": "Hola",

    "yes": "Sí",

    "no": "No",

    "i": "Yo",

    "i do not understand":"Yo no comprendo",

    "who": "Quién",

    "why": "Por qué",

    "test": "prueba",

    "who are you": "Quién eres"

    };

    function getTranslation(word, retry, cb) {

    //simulate a service call by sleeping for a few seconds

    var high = 5

    var low = 1;

    var sleepTime = Math.random() * (high - low) + low;

    word = word.toLowerCase();

    setTimeout(function() {

    var translation = null;

    if( translation = __DICT__[word]) {

    return cb(null, translation, retry, word);

    } else {

    return cb("No translation found for: " + word, null, retry, word);

    }

    }, sleepTime * 1000)

    }

    ```


    **Note**


    As you can see, I’m actually faking the external service call, but for the purpose
    of this example, the simplicity of the code will help us keep our focus where
    it should go.


    Right off the bat, there are a couple of problems to be solved that I can think
    of by looking at that code:


    - Because the app won’t wait until the ENTER key is pressed, you’ll need to react
    on every keystroke, and therefore, you’ll want to avoid trying to translate the
    unfinished word or phrase. So you’ll have to deal with this somehow.

    - Due to the continuous input and the asynchronous nature of the external service
    calls, you might run into a timing issue. If the system is able to translate part
    of your phrase while you’re typing it and that response arrives AFTER the final
    phrase''s translation does, you can end up with the wrong result.


    Now, even though the above code clearly works to an extent, like you’ve already
    seen, some quirks have not been handled. This is not to say it can’t be fixed,
    but doing so would take a lot more work and code than what I’m willing to put
    into this example, especially because in a minute, I’ll provide a solution to
    it that requires you to write less code.


    So, let’s take a look at Figure [2-4](#A418015_1_En_2_Chapter.html#Fig4), and
    then I’ll code it using a functional reactive pseudo-code.


    ![A418015_1_En_2_Fig4_HTML.jpg](A418015_1_En_2_Fig4_HTML.jpg)


    Figure 2-4. Marble diagram showing the RP approach to the translation problem


    In Figure [2-4](#A418015_1_En_2_Chapter.html#Fig4), you can see the problems we
    mentioned earlier:


    - Continuous requests for the translation service

    - Out-of-order responses due to possible delays on the translation services


    How can you fix those problems? Very simple, using a functional RP approach, you
    can transform the initial keystrokes stream into something easier to handle, and
    from there, you can keep transforming the stream into something you can translate.
    Let’s look at the code:


    ```

    readInput()

    . throttle(300)

    .scan('''', ''.concat'')

    .flatMapLatest(function(word) {

    return retry(getTranslation(word), 3);

    })

    .pipe(printTranslation)

    ```


    It’s still not using any library so the code is kept generic, I’ll get to that
    eventually, don’t worry. Although the code should be easy to understand, some
    of the names are not helping, so let’s quickly go over the six lines above:


    1.  This one is pretty clear. It reads the standard input and creates a stream
    with the keystrokes.

    2.  The second one solves one of the previous problems: Reacting to every keystroke,
    by throttling the event generation from the source stream, you’re essentially
    reacting to bursts of events every 300 milliseconds, thus decreasing the number
    of translation requests you end up doing.

    3.  The third one performs a concatenation of all throttled keystrokes into a
    single string that can then be passed as a new event.

    4.  The fourth one is the most complex to understand. `flatMap` will create a
    parallel stream to handle the function passed as a parameter, and that function
    will return a new stream.

    5.  Inside the function mentioned above, you have the `retry` call, which should
    be part of whatever library you’re using. It will return the new stream, and it
    will handle retries of the `getTranslation` call if it fails.

    6.  Finally, the last step will print out the translation result. This one is
    pretty clear.


    You can see how much simpler the algorithm got by looking at the new diagram in
    Figure [2-5](#A418015_1_En_2_Chapter.html#Fig5).


    ![A418015_1_En_2_Fig5_HTML.jpg](A418015_1_En_2_Fig5_HTML.jpg)


    Figure 2-5. Marble diagram for the new RP solution with throttle


    A quick look at the diagram shows very graphically what happens to the keystrokes
    throughout the entire dataflow proposed previously. In the end, and obviously
    assuming the throttling step divides the input into two, you end up with only
    two calls to the translation service instead of the four that would’ve taken place
    using the original code, and thanks to the `flatMapLatest` function, only the
    result of the second translate call is accepted.


    It is true that what was achieved here could’ve been done using classical imperative
    programming, but the extra effort and extra lines of code are not really worth
    it if you compare it to this functional reactive approach.


    ### Summary


    This chapter covered some of the most common cases that you might be interested
    in solving using RP. You saw how they’re handled by regular imperative programming,
    how complicated they are to solve if you take into account every edge case, and,
    finally, how much simpler they are if you approach them with RP.


