    never happened… Thank you! Introduction


    Reactive programming is clearly a trend these days, a lot of front-end developers
    are starting to take it into account because the nature their work (event-based,
    javascript) lends well to it. A lot is being written about it on the web for that
    environment but, sadly, the back-end is not getting the same amount of attention.


    Thanks to Node.js, we now have a very similar environment on the server side that
    can allow developers to think in terms of RP (or even Functional Reactive Programming)
    in the same manner that front-end developers think when using that technique on
    their day-to-day.


    This book will be interesting to Node.js developers (or even other back-end devevelopers)
    because it will provide them with a new and different way to solve the problems
    they have everyday.


    So, sit back, relax, and enjoy the book!


    Acknowledgments


    I’d like to thank the amazing technical reviewer involved in the project, Phil
    Nash, whose great feedback was a crucial contribution to the making of this book.


    I’d also like to thank the rest of the Apress editorial team, whose guidance helped
    me through the process of writing this book.'
