- fmt: '# 3. Functional Reactive Programming


    In the previous chapters I’ve tried to keep the code examples as independent of
    everything else as possible (especially the reactive code examples), which is
    why I haven’t mentioned any particular library just yet, and that is why you can’t
    just copy and paste some of it and just run it.


    One of the main things to note about the previous chapters is that most of the
    reactive examples were made using concepts of functional programming (`map`, passing
    functions as variables, etc.) so it should not be a surprise for you that the
    topic of this chapter is, indeed, functional reactive programming.


    In this chapter, you’ll start getting closer to the actual act of coding working
    code (hooray!) and you’ll do that by tackling the following topics:


    - An introduction to functional programming (FP) in JavaScript. Here I’ll go over
    the relevant bits of FP. I’ll try to go over them quickly and show some code examples
    to help explain how they work internally and how they can help us on our tasks.

    - The main tools of a functional programmer. Related to the previous point, I’ll
    cover the three main tools any functional programmer should learn to love, `map`,
    `reduce` and `filter`.

    - How to deal with observable streams of events.


    ## An Intro to Functional Programming in JavaScript


    The topic of FP in JavaScript is, to be honest, a topic in and of itself, and
    I could easily write an entire book about it. That being said, I’ll try to summarize
    that topic here, in one chapter. The chapter will cover the most important parts
    about FP, leaving the heavy theory mostly out. If, by the end of this chapter,
    you’re left wanting to learn more about this subject, please go and get one of
    those books (like Becoming Functional by Joshua Backfield or Functional Thinking
    by Neal Ford), they’re definitely worth it.


    With that out of the way, let’s begin by defining some concepts that will be used
    throughout this chapter: pure functions, composition, currying, and monads.


    **Remember**


    The following explanation will be done in the context of JavaScript, so if you’re
    already familiar with a more generic version of these concepts, bear in mind I’m
    limiting the explanation to keep things simple and easy to understand.


    ### Pure Functions


    In FP, there is this concept of pure functions, which might strike you as a weird
    thing to define, considering you’ve being dealing with functions (or methods)
    basically your entire development life (if you haven’t, I just don’t know what
    kind of strange language you’ve been programming on).


    So what does it take for a function to be pure then? A pure function must comply
    with the following two statements:


    - It cannot have unforeseen side effects when executed. In other words, a function
    must return the exact same result every time it is called with the same parameters.

    - It can only depend on the parameters it receives for its internal logic. Meaning
    that even when there is no side effect from its execution, it can’t depend on
    external values to perform its calculations because those values might change,
    thus affecting the function''s result, which in turn goes against the previous
    point.


    Table 3-1 shows a quick example.


    **Table 3-1.** Examples of Pure and Impure Functions


    | Pure Function | Impure Function |

    | --- | --- |

    | ```function pure(a, b, c, d) {  return a + b + c + d;}``` | ```var sum = 0;function
    impure(a,b,c,d) {  sum = a + b + c; //modifies an external variable  return a
    + b + c + d;}``` |

    | ```function pure(a, b) {  var mult = 2;  return (a+b) * mult;}``` | ```var mult
    = 2;function impure(a, b) {  return (a+b) * mult;}``` |


    The examples in Table 3-1 clearly show the unwanted side effect of the impure
    function on the first row and the unwanted external dependency on the second row.
    In both cases, the execution of the impure functions would yield unwanted results.


    The concept of pure functions is fairly simple, yet crucial to the implementation
    of functional programming, so it is important that you understand it completely.
    As an additional note, even though this is not directly related to FP, having
    pure functions as part of your code simplifies the cognitive load on the developers
    using or reading your code, since the effort to understand the logic inside your
    functions is now considerably lower. Another benefit of this type of functions
    is that they’re much easier to test since they only rely on their input values.'
