  'split': this._execute_split.bind(this),\n'take': this._execute_take_transform.bind(this),\
  \ //负责处理所有 3 种类型的 take\n'debounce': this._execute_debounce_throttle.bind(this),\n\
  'throttle': this._execute_debounce_throttle.bind(this),\n'flatMap': this._execute_flatmap.bind(this)\n\
  };\nif(execs[fnType]) {\nexecsfnType;\n} else {\nthis._execute_normal(idx, value,\
  \ handler, transforms);\n}\n};\n```\n\n上述方法负责选择正确的辅助方法，以执行转换链当前位置的辅助函数。基本上，库提供的每个辅助函数（您很快就会看到）都有一个`__fn_type`属性，该属性标识了辅助函数的类型（例如，`map`函数对应\"\
  `map`\"，所有不同的`take`函数对应\"`take`\"等）。因此，`_execute`方法可以使用该属性来选择要使用的正确辅助方法，或者默认使用能够处理通用转换函数的方法。\n\
  \n以下方法通过订阅`data`事件并将每个数据块写入内部流（即所有数据写入的公共流），来处理将新流合并到当前流中的操作。\n\n\n\n`Cheese.prototype.merge\
  \ = function(newStream) {\nvar self = this;\nnewStream.on('data', function(d) {\n\
  self._writeToOutput(d);\n});\nreturn this;\n}\nCheese.prototype.each = function(handler)\
  \ {\nvar self = this;\nvar index = 0;\n//我们需要在此处创建一个新的转换列表，以便当触发'data'事件时，只有当前的转换列表\n\
  //会被该处理器执行\nvar transforms = this._transformations.map(function(t) {\nif(t.newInstance)\
  \ {\nreturn t.newInstance();\n}\nreturn t;\n});\n//启动转换链\nthis._outputStream.on('data',\
  \ function(d) {\nself._execute(index, d, handler, transforms);\n});\nthis._outputStream.on('finish',\
  \ function() {\nself._endSource();\n});\nif(this._source_name == 'fn' && !this._source_interval)\
  \ {\nself._source_interval = setInterval(function() {\nself._source_interval_origin(function(value)\
  \ {\nif(value === null) {\nreturn self._endSource();\n}\nself._writeToOutput(value);\n\
  })\n}, self._source_interval_delay);\n}\nif(this._source_name == 'array' && !this._source_interval)\
  \ {\nthis._source_interval = setInterval(function() {\nif(self._source_interval_origin.length\
  \ > 0) {\nself._writeToOutput(self._source_interval_origin.shift());\n} else {\n\
  self._endSource();\n}\n}, this._source_interval_delay);\n}\n};\n```\n\n从开发者的角度来看，前一个方法承担了一个简单的职责，但如你所见，它在内部处理了好几项任务：\n\
  \n- 它会创建调用时点转换列表的一份副本。这样你就可以在流的不同位置调用它，以便在数据转换过程中做出部分响应（在上一章讨论 Bacon.js 库时，我展示过类似的例子）。\n\
  - 它还负责启动转换链。在此之前你一直在设置转换，但直到该方法被调用时，数据才会在链中流动。\n- 它确保在流结束时调用`_endSource`方法（若你将函数作为数据源，这一点尤其有用）。\n\
  - 最后，它为从非流数据源（如函数和数组）拉取数据创建所需的定时器。\n\n另外，请注意为数组源设置的定时器会在没有更多待发射元素时调用`_endSource`，而为函数源设置的定时器则不会。这意味着函数必须写入一个`null`值来通知数据已全部发送完毕。\n\
  \n下面这三个方法简短易懂，但为了完整性，我快速过一遍：\n\n- `_endSource`：该方法根据数据源类型以适当方式结束数据源。对于基于定时器的数据源，它会清除定时器；对于流，它会结束流。若后续添加更多类型的数据源，则需扩展此方法。\n\
  - `then`：简单的方法，将转换添加到列表中并返回对象自身，以保持链式调用。\n- `onError`：该方法设置错误处理链并向其中添加函数。如果数据源是流，它还会订阅`error`事件，从而确保应用不会被\
  \ Node.js 意外终止。\n\n```\nCheese.prototype._endSource = function() {\nthis._stream_ended\
  \ = true;\nswitch(this._source_name) {\ncase 'stream':\nthis._stream.end();\nbreak;\n\
  case 'array':\ncase 'fn':\nthis._outputStream.end();\nclearInterval(this._source_interval);\n\
  break;\n}\n};\nCheese.prototype.then = function(fn) {\nthis._transformations.push(fn);\n\
  return this;\n};\nCheese.prototype.onError = function(fn) {\nvar self = this;\n\
  //如果是 fromStream 的情况，首次设置错误处理器时，确保\n//正确处理 error 事件\nif(this._error_transformations.length\
  \ == 0 && this._source_name == 'stream') {\nthis._stream.on('error', function(err)\
  \ {\nself._execute(0, err, null, self._error_transformations);\n});\n}\nthis._error_transformations.push(fn);\n\
  return this;\n};\nmodule.exports = Cheese;\n```\n\n至此，主库的分析结束。接下来让我展示辅助函数的代码，这些内容读起来也颇有启发。\n\
  \n## Little Cheese 小芝士\n\nR-Cheese 的第一个版本总共提供了九个转换函数，并将它们作为独立函数导出，以简化添加新函数的任务：只需将新函数添加到`utils.js`文件并导出即可。\n\
  \n尽管导出的转换函数彼此差异很大，但定义它们的函数结构始终相同，它们基本遵循以下模板：\n\n```\nfunction transformation([params])\
  \ {\nvar _fn = function([params]) {\n//你的代码写在这里\n};\n_fn.__fn_type = '[函数类型标识符]';\n\
  _fn.newInstance = function() {\n//你的代码写在这里\n};\nreturn _fn;\n}\n```\n\n每个转换函数实际上都是执行实际工作的函数的包装器。由于\
  \ JavaScript 中的函数也是对象，我可以为它们添加一些属性，主要是`__fn_type`（一个标识转换类型的字符串，正如你之前所见，主库代码中的`_execute`方法会用到它）和`newInstance`方法（它基本上应该返回转换的一个新实例，你可以在主库的`each`方法中找到它的用法）。\n\
  \n现在让我逐一介绍内置于代码中的每个转换函数。其中一些在前几章已经讨论过，另一些可能对你来说是新的，希望通过解释和代码，你能轻松理解它们。\n\n## Map、Filter\
  \ 和 Reduce\n\n这三个是最常见的转换，我在前几章也已经介绍过，所以没什么特别需要补充的了。因此，我直接展示它们的实现：\n\n```\nfunction\
  \ map(fn) {\nvar _fn = function(value, done){\nfn(value, done); //此版本的 map 函数是异步的，因此需要回调函数\n\
  };\n_fn.__fn_type = 'map';\n_fn.newInstance = function() {\nreturn map(fn);\n};\n\
  return _fn;\n}\nfunction filter(fn) {\nvar _fn = function(value, done) {\nfn(value,\
  \ done);\n};\n_fn.__fn_type = 'filter';\n_fn.newInstance = function() {\nreturn\
  \ filter(fn);\n};\nreturn _fn;\n}\nfunction reduce(init, fn) {\nvar accu = init;\n\
  var listenerSet = false;\nvar _fn = function(stream, value, done) {\naccu = fn(accu\
  \ , value);\nif(!listenerSet) {\nstream.on('end', function() {\ndone(accu );\n});\n\
  listenerSet = true;\n}\n};\n_fn.__fn_type = 'reduce';\n_fn.newInstance = function()\
  \ {\nreturn reduce(init, fn);\n};\nreturn _fn;\n}\n```\n\n如你所见，所有三个函数都遵循我之前展示的模板。第一个`map`函数其实没太大玄机，它是这些函数中最简单的一个，本质上只是语法糖，因为它所做的就是执行作为参数传入的函数。由于主库中的`_execute_normal`方法，执行`map`或直接将匿名函数传递给`then`方法效果相同。\n\
  \n`filter`函数也非常简单，事实上它的代码几乎与`map`完全一样，唯一的区别是函数类型标识符不同，这反过来告诉主库如何解释该函数的输出以及如何处理它。\n\
  \n最后，`reduce`函数（在其他库中也被称为`scan`）会按照传入函数指定的方式累积数据块，并在流结束时发射累积结果。正如你所见，这就是该函数需要将流作为参数传入的原因——它需要订阅内部流的`end`事件。\n\
  \n\n\n"
- '# 不断取用


  此处提供了 `take` 函数的三种变体。第一种是简单的 `take` 函数，它会从数据流中接受固定数量的数据块，然后终止数据流。第二种是 `takeUntil`
  函数，它会从数据源中接受数据块，直到作为参数传入的函数所定义的条件满足为止（基本上，当该函数返回 `true` 时）。最后是 `takeWhile`，它与 `takeUntil`
  非常相似，但条件正好相反：只要条件满足，它就会接受数据块，此后，数据将无法通过此节点。


  首先，让我们看看它们的代码：


  ```

  function take(number) {

  var counter = 0;

  var max = number;

  var _fn = function(stream, value, done) {

  counter++;

  if(counter == max) {

  stream.end();

  }

  return done(null, value);

  };

  _fn.__fn_type = ''take'';

  _fn.newInstance = function() {

  return take(number);

  };

  return _fn;

  }

  function takeUntil(condition) {

  var _fn = function(stream, value, done) {

  if(condition.length === 1) {

  if(condition(value)) {

  return stream.end();

  }

  return done(null, value);

  } else {

  condition(value, function(err, resp) {

  if(!!resp === true) {

  return stream.end();

  }

  return done(err, value);

  });

  }

  };

  _fn.__fn_type = ''take'';

  _fn.newInstance = function() {

  return takeUntil(condition);

  };

  return _fn;

  }

  function takeWhile(condition) {

  var _fn = function(stream, value, done) {

  if(condition.length === 1) {

  if(!condition(value)) {

  return stream.end();

  }

  return done(null, value);

  } else {

  condition(value, function(err, resp) {

  if(!!resp === false) {

  return stream.end();

  }

  return done(err, value);

  });

  }

  };

  _fn.__fn_type = ''take'';

  _fn.newInstance = function() {

  return takeWhile(condition);

  };

  return _fn;

  }

  ```


  它们的代码彼此非常相似，甚至共享同一个函数类型标识符，因为主库可以用相同的方式处理这三种函数。最后，`takeUntil` 和 `takeWhile` 都接受异步和同步函数作为决定何时停止的条件。图
  7-1 给出了这三种变体行为方式的示例。


  ![A418015_1_En_7_Fig1_HTML.jpg](img/A418015_1_En_7_Fig1_HTML.jpg)


  **图 7-1.** 大理石图展示了三种 `take` 方法之间的差异


  让我们快速查看一下这些方法的代码示例：


  ```

  var cheese = require("./cheese").Cheese;

  var _ = require("lodash");

  var take = require("./cheese").Utils.take;

  var takeUntil = require("./cheese").Utils.takeUntil;

  var takeWhile = require("./cheese").Utils.takeWhile;

  var ch = new cheese();

  var ch1 = new cheese();

  var ch2 = new cheese();

  ch.fromArray(_.range(100)).then(take(10)).each(function(v) {

  console.log("Ch: ", v.toString());

  });

  ch1.fromArray(_.range(100)).then(takeWhile(function(v) {

  // the value needs to be coerced into an integer, because all data that flows through
  the stream is casted into a String .

  return +v  10;

  }))

  .each(function(v) {

  console.log("Ch2: ", v.toString());

  })

  ```


  正如你可能已经猜到的那样，这三种变体都做着同样的事情：只取数据流的前 10 个元素，然后关闭它。


