- "# 4. 后端响应式编程\n\n现在你已经了解了相关背景知识，终于到了动手实践的时候了。在本章中，我将分析如何将函数式响应式编程（FRP）的优势应用到后端开发中。\n\
  \n为此，我将介绍一组后端程序员常见的用例，首先查看常规实现，然后采用 FRP 方式重新实现相同的用例。\n\n由于我没有自己开发或从现有库中选取的 FRP 模块，我将假设已经有一个自定义的\
  \ FRP 模块可用。这将在两个方面帮助我：\n\n- 为代码提供所需的支持。\n- 帮助定义即将开发的 FRP 模块的 API。目前我假设它已经存在，并且所有需要的函数/方法都可用。\n\
  \n到本章结束时，你将拥有足够的理由开始在后端代码中使用响应式编程。为此，我将介绍两个非常常见的用例：\n\n- **带 CRUD 端点的简单 API**：我将创建一个简单的\
  \ API，提供单个端点，包含所有 CRUD（创建、读取、更新和删除）功能。\n- **登录**：将向之前开发的 API 添加一个用于获取认证令牌的端点。\n\n\
  那么，让我们直接开始吧。\n\n## 带 CRUD 端点的 API\n\n对于任何后端开发者来说，这可能是最常见的用例之一。过去你很可能遇到过至少一两个这样的功能，但我们将完整地查看\
  \ CRUD 函数集。\n\n显然，有多种实现方式，每种方式都同样有效。为了本示例的目的，让我们定义一些约束条件。\n\n\n\n### 模型\n\n该 API\
  \ 将处理两个模型，因此也会包含一些处理两者关系的逻辑。具体而言，这两个模型是 `User` 和 `Address`。每个用户将拥有一个地址集合，其结构如下：\n\
  \n- **用户**\n  - `first_name: String`\n  - `last_name: String`\n  - `birth_date:\
  \ Date`\n  - `addresses: [ Address ]`\n- **地址**\n  - `street_name: String`\n  -\
  \ `house_number: Number`\n  - `phone_number: String`\n\n> **提示：** 像 `Id`、创建日期或任何其他必需的通用属性均未列入此列表，并假定由所使用的框架自动添加到模型中。\n\
  \n#### API 接口\n\n表 4-1 列出了该 API 将配合代码提供的端点。它们主要是提供 RESTful 接口所需的最低限度，用于操作模型所代表的资源。\n\
  \n**表 4-1.** *正在开发的 API 的端点列表*\n\n| HTTP 方法 | URL | 描述 |\n| --- | --- | --- |\n\
  | `GET` | `/users/` | 返回用户列表 |\n| `GET` | `/users/:id` | 返回特定用户（由 URL 中的 `id` 参数指定）的信息\
  \ |\n| `POST` | `/users` | 在数据库中创建新用户 |\n| `POST` | `/users/:id/addresses` | 向指定用户的地址列表中添加一个地址\
  \ |\n| `PUT` | `/users/:id` | 更新特定用户的信息（注意：这不会更新地址模型的信息） |\n| `DELETE` | `/users/:id`\
  \ | 从数据库中删除用户（及其关联的地址） |\n\n### 标准实现\n\n为了实现上述规范，我将使用一组标准模块。具体来说，`Express.JS`（可在\
  \ [`http://expressjs.com/`](http://expressjs.com/) 获取）将是首选的 Web 框架（因为坦率地说，它是 Node.js\
  \ 领域 Web 框架的事实标准）。我还将使用 `Mongoose`（[`mongoosejs.com/`](http://mongoosejs.com/)）作为存储层的\
  \ ORM，存储层将基于 `MongoDB`（这仅仅是因为缺乏模式将简化此用例的开发）。\n\n我将代码组织成三个文件：`models-crud-api.js`\
  \ 将包含两个模式的定义，并导出所有已定义模式的字典；`routes-crud-api.js` 将包含 API 所有端点的定义，并导出用于定义它们的路由对象；最后，`main-crud-api.js`\
  \ 将仅包含 API 的主代码。\n\n让我们快速看一下代码的大致样子：\n\n**routes-crud-api.js**\n\n```javascript\n\
  var router = require(\"express\").Router(),\nmodels = require(\"./models-crud-api\"\
  );\nrouter.get('/', function(req, res, next) {\nmodels.users.find({})\n.populate('addresses')\n\
  .then(res.json.bind(res))//we make sure the 'this' is correct when the function\
  \ is called\n.catch(next) ;\n});\nrouter.get('/:id', function(req, res, next) {\n\
  models.users.findById(req.params.id)\n.populate(\"addresses\")\n.then(function(usr)\
  \ {\nif(!usr) {\nreturn res.status(404).json({\nerror: true,\nmsg: 'User not found'\n\
  });\n}\nreturn res.json(usr);\n})\n.catch(next);\n});\nrouter.post('/', function(req,\
  \ res, next) {\nmodels.users.create(req.body)\n.then(function(usr) {\nres.json(usr);\n\
  })\n.catch(next);\n});\nrouter.post('/:id/addresses', function(req, res, next){\n\
  var addressPromise = models.addresses.create(req.body);\nvar userPromise = addressPromise.then(function(address)\
  \ {\nreturn models.users.findById(req.params.id)\n});\nPromise.all([addressPromise,\
  \ userPromise], function([address, user]) {\nuser.addresses.push(address._id);\n\
  return user.save();\n}).then(function(user) {\nreturn res.json(user);\n}).catch(next);\n\
  });\nrouter.put('/:id', function(req, res, next) {\nmodels.users\n.findByIdAndUpdate(req.params.id,\
  \ req.body, {new: true}) //{new: true} makes sure the updated document  is returned\n\
  .then(function(usr) {\nres.json(usr);\n})\n.catch(next);\n});\nrouter.delete('/:id',\
  \ function(req, res, next) {\nmodels.users\n.findByIdAndRemove(req.params.id)\n\
  .then(function() {\nres.sendStatus(200);\n})\n.catch(next);\n});\nmodule.exports\
  \ = router;\n```\n\n从上述代码可以看出，端点的核心逻辑并不复杂；基本上可以将每个端点映射到 `Mongoose` 提供的某个辅助方法，但 `/:id/addresses`\
  \ 明显是个例外，它需要花一点心思才能理解（先是创建地址，然后更新用户以添加引用，整个过程都使用了 promise 链）。\n\n**models-crud-api.js**\n\
  \n```javascript\nvar usersSchema = Schema({\nfirst_name: {\ntype: String,\nrequired:\
  \ true\n},\nlast_name: {\ntype: String,\nrequired: true\n},\nbirth_date: Date,\n\
  addresses: [\n{\nref: 'Address',\ntype: Schema.Types.ObjectId\n}]\n});\n```\n\n\
  > **提示：** 尽管普通的 JS 代码约定使用 `camelCase`，但模型中使用的字段却是 `snake_case`，因为这是 `MongoDB` 的默认标准。\n\
  \n```javascript\nvar usersModel = mongoose.model('User', usersSchema);\nmodule.exports\
  \ = {\nusers: usersModel,\naddresses: addressModel\n};\n```\n\n实体模式、模型定义以及最终模型字典的导出；其余都是常规代码，没有什么需要特别提及的。\n\
  \n**main-crud-api.js**\n\n```javascript\nvar express = require(\"express\"),\nbodyParser\
  \ = require(\"body-parser\"),\nmongoose = require(\"mongoose\"),\nuserRouter = require(\"\
  ./routes-crud-api\");\nvar app = express();\napp.use(bodyParser.json());\napp.use('/users',\
  \ userRouter);\n//Generic error handler\napp.use(function(err, req, res, next) {\n\
  console.error(\"--- Error encountered ---\");\nconsole.error(err);\nres.status(500).json({\n\
  msg: err,\nerror: true\n});\n});\nmongoose.connect('mongodb://localhost/test-chapter4');\n\
  var db = mongoose.connection;\ndb.once('open', function() {\nconsole.log(\"Database\
  \ connection established...\");\napp.listen(3004, function() {\nconsole.log(\"Server\
  \ started ...\");\n});\n});\n\n本示例的最后一个（实际上是主）文件，以及其中需要提及的两个相关要点，如下所示。\n\n1. 定义了通用错误处理程序；当执行\
  \ `catch` 语句时，将调用此函数。这很容易测试：只需尝试创建一个未填写 `last_name` 的用户，这将引发验证错误，从而触发 `catch` 子句，进而调用带有错误参数的\
  \ `next`，最终导致错误处理程序被调用。\n\n2. 最后几行展示了如何仅在数据库连接建立之后（即 `open` 事件所代表的含义），在端口 `3004`\
  \ 上启动 Web 服务器。这是一种非常标准且安全的初始化应用程序的方式，确保在启动 Web 服务器之前所有服务都已就绪。\n\n### 函数式响应式实现\n\n\
  这种实现方式应该有所不同，但并非方方面面都不同。我并非试图将 Web 服务器或 ORM 完全重写为响应式；而只是尝试使用这种范式来实现业务逻辑。\n\n在这个特定的例子中，这转化为重写与路由相关的代码，因为这里才是主要逻辑所在。为了做到这一点，我将端点转换为可观察集合，其中每个新请求都是一个被添加的新事件。基于此，我将对该事件应用一系列转换，使其在每个场景下都能按需生成结果。\n\
  \n\n\n#### 路由器文件\n\n让我们先回顾一下之前的实现中的这个文件；那里编写了所有业务逻辑，同时也是 Express 完成路由匹配的地方。对于本次实现，我将从中移除业务逻辑，仅保留路由匹配，代码如下所示：\n\
  \n```\nvar collections = require(\"./collections-rfrp  \"),\nrouter = require(\"\
  express\").Router(),\n_ = require(\"lodash\");\nvar mapping = {\n'/': {\n'get':\
  \ collections.listUsersCollection,\n'post': collections.newUsersCollection\n},\n\
  '/:id': {\n'get': collections.getUserDataColection,\n'put': collections.updateUserCollection,\n\
  'delete': collections.deleteUsersCollection\n},\n'/:id/addresses': {\n'post': collections.newAddressCollection\n\
  }\n};\n```\n\n这段 JSON 将每个端点映射到不同的可观察集合，而以下代码负责将请求、响应以及每次请求接收到的 `next` 函数添加到对应的集合中。\n\
  \n```\n//we set up the urls\n_.each(mapping, function (actions, url) {\n_.each(actions,\
  \ function(collection, method) {\nroutermethod { //this is the code that every route\
  \ will actually execute\ncollection.add(arguments);  //we pass the arguments object\
  \ because we want to have access to all three parameters in one\n});\n});\n});\n\
  module.exports = router;\n```\n\n正如我之前提到的，这段代码非常简单。它实际上并不具备响应式或其他特性，只是负责将新事件添加到对应的集合中。\n\
  \n#### 新的业务逻辑\n\n从上述代码可以明显看出，每个端点的逻辑都被移到了独立的 `ObservableStream` 对象中，这样你就可以相应地转换这些流。让我们先将每个转换代码与原始实现中对应的代码进行逐一比较。\n\
