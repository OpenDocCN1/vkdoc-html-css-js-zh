  - **声明式编程的优势**：再次回顾了声明式编程相对于传统命令式方法的好处。

  - **可观察流（Observable Streams）**：作为函数式响应式编程库的基石，我向你展示了它们的工作原理，并实现了一个简单的版本。


  在下一章中，我将探讨响应式编程如何在后端发挥作用，因为响应式编程通常用于前端开发。


