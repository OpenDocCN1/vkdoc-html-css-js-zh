- '# 总结


  好了，你已经快读完这本书了，只剩下最后一章！通过这一章，你不仅了解到基于套接字的响应式代码是可行的，而且看起来很不错，还了解到大公司正在从传统编程范式转向响应式编程范式。这让他们能够缩短开发时间，从而加快产品上市速度，并且为他们提供了创建易于维护、可扩展系统所需的工具。


  在下一章也是最后一章中，我将介绍如何构建系统响应式架构的基础知识，同时还会分享一些在扩展 Node.js 应用时会派上用场的技巧。


