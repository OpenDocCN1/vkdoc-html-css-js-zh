  trans: '

    # 允许玩家攀爬梯子


    为了让玩家能够攀爬梯子，我们必须能够判断他们是否正在尝试攀爬。同时，我们还需要暂停重力和侧向移动，这样玩家就不会从梯子上掉下来或滑落：


    ```

    class Player {

    constructor(sprite, rectangle) {

    this.sprite = sprite

    this.rectangle = rectangle

    this.velocityX = 0

    this.maximumVelocityX = 8

    this.accelerationX = 2

    this.frictionX = 0.9

    this.velocityY = 0

    this.maximumVelocityY = 30

    this.accelerationY = 3

    this.jumpVelocity = -30

    this.climbingSpeed = 10

    this.isOnGround = false

    this.isOnLadder = false

    }

    animate(state) {

    if (state.keys[37]) { // 左

    this.velocityX = Math.max(

    this.velocityX - this.accelerationX,

    this.maximumVelocityX * -1,

    )

    }

    if (state.keys[39]) { // 右

    this.velocityX = Math.min(

    this.velocityX + this.accelerationX,

    this.maximumVelocityX,

    )

    }

    this.velocityX *= this.frictionX

    this.velocityY = Math.min(

    this.velocityY + this.accelerationY,

    this.maximumVelocityY,

    )

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    const me = this.rectangle

    const you = object.rectangle

    const collides = object.collides

    if (me.x < you.x + you.width &&

    me.x + me.width > you.x &&

    me.y < you.y + you.height &&

    me.y + me.height > you.y) {

    if (object.constructor.name === "Ladder") {

    if (state.keys[38] || state.keys[40]) {

    this.isOnLadder = true

    this.isOnGround = false

    this.velocityY = 0

    this.velocityX = 0

    }

    if (state.keys[38]) {

    this.rectangle.y -= this.climbingSpeed

    }

    if (state.keys[40] &&

    me.y + me.height < you.y + you.height) {

    this.rectangle.y += this.climbingSpeed

    }

    }

    // ...省略

    }

    })

    if (state.keys[32] && this.isOnGround) {

    this.velocityY = this.jumpVelocity

    this.isOnGround = false

    }

    this.rectangle.x += this.velocityX

    if (!this.isOnLadder) {

    this.rectangle.y += this.velocityY

    }

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    ```


    这段代码摘自 [`http://codepen.io/assertchris/pen/jrzrPw`](http://codepen.io/assertchris/pen/jrzrPw)。


    在这段代码中，我们创建了一个 `isOnLadder` 变量，以便判断玩家是否静止地站在梯子上。在常规的碰撞检测过程中，我们记录玩家碰撞的对象是否为梯子。如果是，并且玩家按下了上箭头键，我们就让玩家开始攀爬。`isOnLadder`
    仅在玩家按下上箭头键时被设置为 `true`，这也是我们一开始需要这个变量的原因。


    然后，我们重置了玩家的速度以及与跳跃相关的属性。我们还直接修改了玩家的矩形位置。如果按下了上箭头键，我们就将玩家向上移动。


    ## 总结


    在本章中，我们添加了梯子和固定平台。现在，我们的玩家可以跳跃和攀爬梯子来穿越关卡。这是 2D 平台游戏中两个基本元素。


    在这一点上，你应该清楚你的游戏想要做成什么样子。我投入使用了很棒的角色包。你可以在 Graphic River（ [`https://graphicriver.net`](https://graphicriver.net)
    ）找到其他素材。


    # 7. 楼梯


    我们实现了跳跃和攀爬作为垂直穿越关卡的主要方式。这些动作很棒，但它们将关卡设计限制在了平台和梯子。让我们通过实现楼梯（或类似的爬坡动作）来扩展我们的设计选项。


    对于这部分内容，我们需要创建更多的角色美术资源，并构建由多种角色类型组成的更复杂的方块。让我来解释我的意思……


    ## 构建斜坡


    我已经创建了新的斜坡角色。我们还需要添加几个新的对象类型：贴花（decal）和斜坡（slope）。贴花将是一种非碰撞类型，而斜坡则可以通过玩家的碰撞检测算法来识别：


    ```

    class LeftSlope {

    get collides() {

    return false

    }

    constructor(sprite, rectangle) {

    this.sprite = sprite

    this.rectangle = rectangle

    }

    animate(state) {

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    class RightSlope {

    get collides() {

    return false

    }

    constructor(sprite, rectangle) {

    this.sprite = sprite

    this.rectangle = rectangle

    }

    animate(state) {

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    class Decal {

    get collides() {

    return false

    }

    constructor(sprite, rectangle) {

    this.sprite = sprite

    this.rectangle = rectangle

    }

    animate(state) {

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    // ...稍后

    game.addObject(

    new LeftSlope(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/slope-left.png",

    ),

    new PIXI.Rectangle(

    0 + 250,

    window.innerHeight - 64 - 64 + 1,

    64,

    64,

    ),

    ),

    )

    game.addObject(

    new RightSlope(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/slope-right.png",

    ),

    new PIXI.Rectangle(

    0 + 250 + 64 + 128,

    window.innerHeight - 64 - 64 + 1,

    64,

    64,

    ),

    ),

    )

    game.addObject(

    new Decal(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/hill-base.png",

    ),

    new PIXI.Rectangle(

    0 + 250,

    window.innerHeight - 64 + 1,

    128,

    64,

    ),

    ),

    )

    game.addObject(

    new Box(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/hill-top.png",

    ),

    new PIXI.Rectangle(

    0 + 250 + 64,

    window.innerHeight - 64 - 64 + 1,

    128,

    64,

    ),

    ),

    )

    ```


    这段代码摘自 [`http://codepen.io/assertchris/pen/dpmOEJ`](http://codepen.io/assertchris/pen/dpmOEJ)。


    我们需要在地面之后添加这些对象，否则地面会遮挡它们。它们共同构成了一座小巧美观的小山丘。我们可以跳到它的顶部，但当我们试图在这些对象上攀爬或下降时，事情就开始变得棘手了。不过，它看起来还不错，如图
    7-1 所示：


    ![A435434_1_En_7_Fig1_HTML.jpg](img/A435434_1_En_7_Fig1_HTML.jpg)


    图 7-1. 小山丘


    ## 爬坡


    为了让我们的玩家能够在斜坡上移动，我们需要再次调整碰撞检测算法：


    ```

    if (me.x < you.x + you.width &&

    me.x + me.width > you.x &&

    me.y < you.y + you.height &&

    me.y + me.height > you.y) {

    if (object.constructor.name === "LeftSlope") {

    const meCenter = Math.round(me.x + (me.width / 2))

    const youRight = you.x + you.width

    const youBottom = you.y + you.height

    const highest = you.y - me.height

    const lowest = youBottom - me.height

    this.isOnGround = true

    this.isOnSlope = true

    me.y = lowest - (meCenter - you.x)

    me.y = Math.max(me.y, highest)

    me.y = Math.min(me.y, lowest)

    if (me.y >= lowest || me.y <= highest) {

    this.isOnSlope = false

    }

    return

    }

    if (object.constructor.name === "RightSlope") {

    const meCenter = Math.round(me.x + (me.width / 2))

    const youBottom = you.y + you.height

    const highest = you.y - me.height

    const lowest = youBottom - me.height

    this.isOnGround = true

    this.isOnSlope = true

    me.y = lowest - (you.x + you.width - meCenter)

    me.y = Math.max(me.y, highest)

    me.y = Math.min(me.y, lowest)

    if (me.y >= lowest || me.y <= highest) {

    this.isOnSlope = false

    }

    return

    }

    if (collides && this.velocityY > 0 && you.y >= me.y) {

    this.isOnGround = true

    this.velocityY = 0

    return

    }

    // ...剩余的碰撞检测代码

    }

    if (state.keys[32] && this.isOnGround) {

    this.velocityY = this.jumpVelocity

    this.isOnGround = false

    this.isOnSlope = false

    }

    ```


    这段代码摘自 [`http://codepen.io/assertchris/pen/dpmOEJ`](http://codepen.io/assertchris/pen/dpmOEJ)。


    如果玩家与 `LeftSlope` 碰撞，我们不会像处理方块那样进行碰撞处理。相反，我们会根据玩家在斜坡右侧的距离来减小玩家的 `y` 坐标（从而将角色向上移动）。换句话说，随着玩家的
    `x` 增加，他们的 `y` 坐标会减少。


    对于 `RightSlope`，我们只需交换 `x` 和 `y` 的关系，当玩家的 `x` 增加时，将他们向下移动。我们还希望玩家能够在斜坡上跳跃，所以需要将
    `isOnGround` 设置为 `true`。


    最后，如果玩家的底部边缘与斜坡的顶部边缘相同（或小于），我们将 `isOnSlope` 设置为 `false`，这样玩家就能在水平轴上正确移动了。


    ## 停留在地面之上


    如果你一直在跟随代码操作，你可能已经注意到了一个奇怪的视觉错误。似乎玩家可以在碰撞检测阻止他们之前，部分地陷入地板之下。


    我们可以通过在相应碰撞发生时重置玩家的 `y` 坐标来解决这个错误：


    ```

    if (collides && this.velocityY > 0 && you.y >= me.y) {

    me.y = you.y - me.height + 1

    this.isOnGround = true

    this.velocityY = 0

    return

    }

    if (collides && this.velocityY < 0 && you.y + you.height >= me.y) {

    me.y = you.y + you.height

    this.velocityY = 0

    return

    }

    if (collides && this.velocityX > 0 && you.x >= me.x) {

    me.x = you.x - me.width

    this.velocityX = 0

    return

    }

    if (collides && this.velocityX < 0 && you.x <= me.x) {

    this.velocityX = 0

    return

    }

    这段代码摘自 http://codepen.io/assertchris/pen/dpmOEJ。

    ```


    现在，当玩家撞到某物时，他们会立即被推回到边界之外。这将阻止玩家陷入地板。

