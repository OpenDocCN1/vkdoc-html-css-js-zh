- fmt: '# Shooting


    Let’s finish up by adding the ability to shoot in the direction of the crosshair.
    To do so, we need to create another type of object:


    ```

    class Bullet extends Decal {

    animate(state) {

    const rect = state.player.rectangle

    this.x = this.x || rect.x + rect.width

    this.y = this.y || rect.y + (rect.height / 2)

    this.angle = this.angle || state.angle

    this.rotation = this.rotation || state.rotation

    this.radius = this.radius || 0

    this.radius += 15

    const targetX = this.x + Math.cos(this.angle) * this.radius

    const targetY = this.y - Math.sin(this.angle) * this.radius

    this.sprite.x = targetX

    this.sprite.y = targetY

    this.sprite.rotation = this.rotation

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/YGaYvy`](http://codepen.io/assertchris/pen/YGaYvy).


    `Bullet` animates differently to most of the other object types in that it modifies
    its state with each tick. The pattern of `this.x = this.x || something` is useful
    for initializing values once. It’s important that we store things like `x`, `y`,
    `angle`, and `rotation` only when the bullet is fired, or they will continue to
    change as we move the player or crosshair.


    The `radius` starts at the front of the player and increases in the direction
    the crosshair was when the bullet was fired. We also rotate the bullet sprite
    to match the same angle. This requires us to store `rotation` alongside `angle`
    in the mouse event listener. We also have to create new bullets when the mouse
    is clicked:


    ```

    element.addEventListener("mousedown", (event) => {

    this.state.clicks[event.which] = {

    "clientX": event.clientX,

    "clientY": event.clientY,

    }

    if (event.button === 0) { // left click

    const rect = this.player.rectangle

    const bullet = new Bullet(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/bullet.png",

    ),

    new PIXI.Rectangle(

    rect.x + rect.width, rect.y, 8, 8,

    ),

    )

    this.addObject(bullet)

    setTimeout(() => {

    this.removeObject(bullet)

    }, 250)

    }

    })

    element.addEventListener("mousemove", (event) => {

    this.state.mouse.clientX = event.clientX

    this.state.mouse.clientY = event.clientY

    const rect = this.player.rectangle

    const centerX = (window.innerWidth / 2) + (rect.width / 2)

    const centerY = (window.innerHeight / 2) + (rect.height / 2)

    const deltaX = event.clientX - centerX

    const deltaY = centerY - event.clientY

    const rotationX = event.clientX - centerX

    const rotationY = event.clientY - centerY

    this.state.angle = Math.atan2(deltaY, deltaX)

    this.state.rotation = Math.atan2(rotationY, rotationX)

    })

    // ...remaining event listeners

    ```


    This is from [`http://codepen.io/assertchris/pen/YGaYvy`](http://codepen.io/assertchris/pen/YGaYvy).


    We calculate the `rotation` similarly to how we calculate the `angle`, but we
    flip the vertical axis. When the player clicks, we create a new `bullet` (positioned
    in front of the player) and add it to the game.


    After `250` milliseconds, we want to remove the bullet. This is so that bullets
    don’t slow down the animation cycle when they’re no longer required. We need to
    add the `removeObject` method to the `Game` class:


    ```

    removeObject(object) {

    this.state.objects = this.state.objects.filter(

    function(next) {

    return next !== object

    }

    )

    this.stage.removeChild(object.sprite)

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/YGaYvy`](http://codepen.io/assertchris/pen/YGaYvy).


    We’ll explore more projectile behavior when we create mobs to shoot in the next
    chapter.


    # Summary


    In this chapter, we looked at ways to create custom cursors and shoot projectiles.
    We discovered a bit of helpful trigonometry to constrain a crosshair to a certain
    radius around the player and then to push bullets beyond that.


    Experiment with the speed and appearance of your projectiles. Perhaps you’re building
    a medieval game, and your projectiles are magical bolts. Think about adding vertical
    acceleration so your bullets drop to the ground after some distance.


    # 10. Mobs


    What fun would this game be if the player were to go through it all alone? What
    we need now are mindless mobs (or blobs if you prefer) to patrol and/or otherwise
    complicate the hero’s path.


    ## Patrolling blobs


    In this chapter, we’re going to add patrolling blobs, which means we need another
    class to encapsulate their logic:


    ```

    class Blob extends Box {

    constructor(sprite, rectangle) {

    super(sprite, rectangle)

    this.limit = 200

    this.left = true

    }

    animate(state) {

    if (this.left) {

    this.rectangle.x -= 2

    }

    if (!this.left) {

    this.rectangle.x += 2

    }

    this.limit -= 2

    if (this.limit <= 0) {

    this.left = !this.left

    this.limit = 200

    }

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/XjEExz`](http://codepen.io/assertchris/pen/XjEExz).


    This time we’re setting a couple of properties in the constructor. We still want
    the parent constructor applied, so we call `super`, providing the expected `sprite`
    and `rectangle` parameters.


    Then, in the `animate` method, we move the blob `2` pixels to the left or right
    (depending on whether the blob is moving `left` or not). Once the blob moves `200`
    pixels in the same direction, we turn it around (and reset the `200` pixels for
    the other direction).


    We should dot a few of these around our level:


    ```

    game.addObject(

    new Blob(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/blob-idle-1.png",

    ),

    new PIXI.Rectangle(

    width - 450,

    height - 64 - 48,

    48,

    48,

    ),

    ),

    )

    ```


    This is from [`http://codepen.io/assertchris/pen/XjEExz`](http://codepen.io/assertchris/pen/XjEExz).


    This code will place the blob next to the starting position of the player as shown
    in Figure 10-1 (at least in my level). It’s fun to watch it move back and forth
    and even have the player jump on its head.


    ![A435434_1_En_10_Fig1_HTML.jpg](A435434_1_En_10_Fig1_HTML.jpg)


    **Figure 10-1. Patrolling blob**


    ## Shooting mobs


    In the last chapter, we added the ability for our player to shoot projectiles.
    Let’s put those to use by adding some collision detection to the bullets themselves:


    ```

    class Bullet extends Decal {

    animate(state) {

    const rect = state.player.rectangle

    this.x = this.x || rect.x + rect.width

    this.y = this.y || rect.y + (rect.height / 2)

    this.angle = this.angle || state.angle

    this.rotation = this.rotation || state.rotation

    this.radius = this.radius || 0

    this.radius += 10

    const targetX = this.x + Math.cos(this.angle) * this.radius

    const targetY = this.y - Math.sin(this.angle) * this.radius

    this.rectangle.x = targetX

    this.rectangle.y = targetY

    this.sprite.x = targetX

    this.sprite.y = targetY

    this.sprite.rotation = this.rotation

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    const me = this.rectangle

    const you = object.rectangle

    if (me.x  you.x &&

    me.y  you.y) {

    if (object.constructor.name === "Blob") {

    state.game.removeObject(object)

    state.game.removeObject(this)

    }

    }

    })

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/XjEExz`](http://codepen.io/assertchris/pen/XjEExz).


    This collision detection logic is similar to the first pass we did in the `Player`
    class. We don’t need to check for things like slopes or ladders. All we’re interested
    in is whether the bullet collides with a blob. If so, we remove both from the
    game.


    > **Note:** I’ve also slightly decreased the bullet speed. It’s not very realistic
    to think that a player can almost catch up to a speeding bullet, but it does feel
    a bit better this way.


    It’s not as elegant as if the blob had steadily decreasing health, but we’ll revisit
    the topic in a bit.


    # Summary


    In this chapter, we added a simple kind of mob to the game. We also empowered
    our bullets to dispatch these mobs. They’re not the most intelligent (or even
    durable) mobs, but they are a start.


    This is where you can be really creative. What if you added gravity to the movement
    of the mobs? Or made them stationary until the player moved closer? What if they
    could shoot back?'
