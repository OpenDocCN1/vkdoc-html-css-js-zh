    # 7. Stairs


    We''ve implemented jumping and climbing as the main ways to traverse a level vertically.
    These actions are great, but they limit level design to consist of platforms and
    ladders. Let''s expand our design options by implementing stairs (or the similar
    action of walking up slopes).


    We''ll need to create even more sprite artwork for this part and build more complex
    boxes composed of multiple sprite types. Let me show you what I mean...


