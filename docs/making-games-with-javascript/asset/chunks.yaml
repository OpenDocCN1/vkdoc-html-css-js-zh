    \  }\n}\n```\n\n这段代码来自 [`http://codepen.io/assertchris/pen/qaokJj`](http://codepen.io/assertchris/pen/qaokJj)。\n\
    \n我们首先需要定义宽度和高度。虽然我们假设玩家和方块都是圆形，但我们只需要将宽度的一半作为半径即可。\n\n接下来，我们检查状态中的每个对象。我们可以忽略玩家对象，因为我们不需要知道它自身何时发生碰撞。不过，其他所有对象都需要检查。\n\
    \n当两个圆形的圆心之间的距离小于它们半径之和时，它们就会发生碰撞。它们的中点靠得太近，以至于其边界必然重叠。\n\n我们快速检查一下玩家移动的方向是否与方块所在的方向一致。如果是这种情况，我们就阻止玩家向该方向移动。\n\
    \n试试看吧。看到非方块形状的物体相互阻挡是很有趣的。当然，要让这个简单的算法生效，所有物体都必须是完美的圆形。\n\n## 检测矩形碰撞\n\n检测矩形碰撞几乎和检测圆形碰撞一样简单。请继续把圆形图片换成方块图片。你甚至可以根据方块的方形特征调整精灵名称。\n\
    \n这一回，我们将玩家视为矩形。与使用半径不同，我们需要检查玩家矩形与任意方块之间是否存在空隙。这种检测方法称为**轴对齐边界框碰撞检测**（简称 AABB）。\n\
    \n如果没有空隙，并且玩家想要向方块所在的方向移动，我们就阻止这种情况发生：\n\n```\nlet move = true\nstate.objects.forEach((object)\
    \ => {\n  if (object === this) {\n    return\n  }\n  if (this.x < object.x + object.w\
    \ &&\n    this.x + this.w > object.x &&\n    this.y < object.y + object.h &&\n\
    \    this.y + this.h > object.y) {\n    if (this.velocityX > 0 && object.x >=\
    \ this.x) {\n      move = false\n    }\n  }\n})\nif (move) {\n  this.x += this.velocityX\n\
    }\n```\n\n这段代码来自 [`http://codepen.io/assertchris/pen/qaokJj`](http://codepen.io/assertchris/pen/qaokJj)\n\
    \n这些是检测碰撞的简单方法，但还有其他的方法。有一种方法使用基于投影的向量数学（`www.sevenson.com.au/actionscript/sat`）来确定重叠。另一种方法则检查多边形的每条线段，看是否有任何线段相交（[`http://stackoverflow.com/questions/9043805/test-if-two-lines-intersect-javascript-function`](http://stackoverflow.com/questions/9043805/test-if-two-lines-intersect-javascript-function)）。这可真够复杂的。\n\
    \n你甚至可以尝试让一组圆形相互碰撞。那可能很有趣。在图 4-1 中，我将让这个小角色在这些小方块中跑动一会儿……\n\n![A435434_1_En_4_Fig1_HTML.jpg](img/A435434_1_En_4_Fig1_HTML.jpg)\n\
    \n**图 4-1.** 玩家与方块\n\n## 总结\n\n本章我们探讨了几种可用于检测玩家精灵与游戏中其他各种对象之间碰撞的方法。\n\n花点时间重新排列方块和圆形，这样你就能初步感受你的第一个游戏关卡可能是什么样子了。\n\
    \n# 5. 重力\n\n在本章中，我们将优化代码结构，并为我们的游戏添加重力效果。重力方面的大部分工作我们已经完成了，因此完成余下部分应该相对简单。"
- fmt: '# Cleaning up our existing code


    We need to clean up a few things! First, let’s swap out `x`, `y`, `w`, and `h`
    (both in `Box` and `Player`) with `PIXI.Rectangle`. They have these properties,
    but they also interact with the rest of `PIXI` in interesting ways.


    ```

    class Player {

    constructor(sprite, rectangle) {

    this.sprite = sprite

    this.rectangle = rectangle

    this.velocityX = 0

    this.maximumVelocityX = 8

    this.accelerationX = 2

    this.frictionX = 0.9

    }

    animate(state) {

    if (state.keys[37]) { // left

    this.velocityX = Math.max(

    this.velocityX - this.accelerationX,

    this.maximumVelocityX * -1,

    )

    }

    if (state.keys[39]) { // right

    this.velocityX = Math.min(

    this.velocityX + this.accelerationX,

    this.maximumVelocityX,

    );

    }

    this.velocityX *= this.frictionX

    let move = true

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    const me = this.rectangle

    const you = object.rectangle

    if (me.x  you.x &&

    me.y  you.y) {

    if (this.velocityX  0 && you.x >= me.x) {

    move = false

    }

    }

    })

    if (move) {

    this.rectangle.x += this.velocityX

    }

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    class Box {

    constructor(sprite, rectangle) {

    this.sprite = sprite

    this.rectangle = rectangle

    }

    animate(state) {

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/ALyXKq`](http://codepen.io/assertchris/pen/ALyXKq).


    Notice how much code we can delete? The comparisons get a little verbose, but
    they’re nothing a local variable or two can’t fix. I also realized that we can
    move the initial `x` and `y` set operations to `animate`.


    Next, I want to encapsulate the event, renderer, and stage logic into a `Game`
    class:


    ```

    class Game {

    constructor() {

    this.state = {

    "keys": {},

    "clicks": {},

    "mouse": {},

    "objects": [],

    }

    this.animate = this.animate.bind(this)

    }

    get stage() {

    if (!this._stage) {

    this._stage = this.newStage()

    }

    return this._stage

    }

    set stage(stage) {

    this._stage = stage

    }

    newStage() {

    return new PIXI.Container()

    }

    get renderer() {

    if (!this._renderer) {

    this._renderer = this.newRenderer()

    }

    return this._renderer

    }

    set renderer(renderer) {

    this._renderer = renderer

    }

    newRenderer() {

    return new PIXI.autoDetectRenderer(

    window.innerWidth,

    window.innerHeight,

    this.newRendererOptions(),

    )

    }

    newRendererOptions() {

    return {

    "antialias": true,

    "autoResize": true,

    "transparent": true,

    "resolution": 2,

    }

    }

    animate() {

    requestAnimationFrame(this.animate)

    this.state.renderer = this.renderer

    this.state.stage = this.stage

    this.state.objects.forEach((object) => {

    console.log(object)

    object.animate(this.state)

    })

    this.renderer.render(this.stage)

    }

    addEventListenerTo(element) {

    element.addEventListener("keydown", (event) => {

    this.state.keys[event.keyCode] = true

    })

    element.addEventListener("keyup", (event) => {

    this.state.keys[event.keyCode] = false

    })

    element.addEventListener("mousedown", (event) => {

    this.state.clicks[event.which] = {

    "clientX": event.clientX,

    "clientY": event.clientY,

    }

    })

    element.addEventListener("mouseup", (event) => {

    this.state.clicks[event.which] = false

    })

    element.addEventListener("mousemove", (event) => {

    this.state.mouse.clientX = event.clientX

    this.state.mouse.clientY = event.clientY

    })

    }

    addRendererTo(element) {

    element.appendChild(this.renderer.view)

    }

    addObject(object) {

    this.state.objects.push(object)

    this.stage.addChild(object.sprite)

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/ALyXKq`](http://codepen.io/assertchris/pen/ALyXKq).


    Notice the class getters and setters. They’re useful for filling optional dependencies
    as needed. We can override `renderer` and `stage` if we need to, but they have
    sensible defaults too.


    The only notable difference here is that we no longer require sprites to be added
    to the stage separately from adding objects to the state.


    I''m in two minds about this. On the one hand, what’s going on is much clearer
    if we add the sprites to the stage by hand. On the other, will we be adding sprites
    (joined to objects) without adding the objects? I don’t think so.


    Perhaps we’ll come back and change that later. For now, it makes things a little
    cleaner. Let’s add the sprites we had before:


    ```

    const game = new Game()

    game.addObject(

    new Box(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/box.png",

    ),

    new PIXI.Rectangle(

    (window.innerWidth / 2) - 150,

    (window.innerHeight / 2) - 35,

    44,

    44,

    ),

    ),

    )

    game.addObject(

    new Box(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/box.png",

    ),

    new PIXI.Rectangle(

    (window.innerWidth / 2) + 150,

    (window.innerHeight / 2) + 35,

    44,

    44,

    ),

    ),

    )

    game.addObject(

    new Player(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/player-idle.png",

    ),

    new PIXI.Rectangle(

    window.innerWidth / 2,

    window.innerHeight / 2,

    44,

    56,

    ),

    ),

    )

    game.addEventListenerTo(window)

    game.addRendererTo(document.body)

    game.animate()

    ```


    This is from [`http://codepen.io/assertchris/pen/ALyXKq`](http://codepen.io/assertchris/pen/ALyXKq).


    That looks much better! We now have enough control to set starting points for
    each game object. But you’ll see that after the first frame, the `animate` methods
    take over. Things like gravity and collisions will start to control how the game
    progresses. It was always going to be like that, however, so this file now feels
    like it too.


    At this point, we could confine the events and renderer to a smaller set of elements.
    We could also add any number of objects to the game from here. Everything else
    game-related is inside the `Game` class. Everything else player- or box-related
    is inside those classes. It’s neat!'
