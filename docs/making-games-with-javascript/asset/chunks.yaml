    ## Walking up slopes


    To get our player moving up slopes, we need to once again adjust the collision
    detection algorithm:


    ```

    if (me.x  you.x &&

    me.y  you.y) {

    if (object.constructor.name === "LeftSlope") {

    const meCenter = Math.round(me.x + (me.width / 2))

    const youRight = you.x + you.width

    const youBottom = you.y + you.height

    const highest = you.y - me.height

    const lowest = youBottom - me.height

    this.isOnGround = true

    this.isOnSlope = true

    me.y = lowest - (meCenter - you.x)

    me.y = Math.max(me.y, highest)

    me.y = Math.min(me.y, lowest)

    if (me.y >= lowest || me.y = lowest || me.y  0 && you.y >= me.y) {

    this.isOnGround = true

    this.velocityY = 0

    return

    }

    // ...remaining collision detection code

    }

    if (state.keys[32] && this.isOnGround) {

    this.velocityY = this.jumpVelocity

    this.isOnGround = false

    this.isOnSlope = false

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/dpmOEJ`](http://codepen.io/assertchris/pen/dpmOEJ).


    If the player collides with the `LeftSlope`, we don''t collide as we did with
    boxes. Instead, we decrease the player''s `y` coordinate (which moves the player
    sprite upward) by however far to the right of the slope the player is. In other
    words, as the player''s `x` increases, their top decreases.


    For the `RightSlope`, we just swap the `x` and `y` relationship, moving the player
    down as their `x` increases. We also want the player to be able to jump up the
    slope, so we need to set `isOnGround` to `true`.


    Finally, if the player''s bottom edge is the same (or less) than the slope''s
    top edge, we set `isOnSlope` to `false`, so that the player will move correctly
    on the horizontal axis.


    ## Staying above the floor


    If you''ve been following along with the code, you''ve probably noticed a strange
    visual bug. It seems the player can fall partway through the floor before the
    collision detection stops them.


    We can get around this bug by resetting the `y` player coordinates for the appropriate
    collision:


    ```

    if (collides && this.velocityY > 0 && you.y >= me.y) {

    me.y = you.y - me.height + 1

    this.isOnGround = true

    this.velocityY = 0

    return

    }

    if (collides && this.velocityY  0 && you.x >= me.x) {

    this.velocityX = 0

    return

    }

    This is from http://codepen.io/assertchris/pen/dpmOEJ.

    ```


    Now, when the player bumps up against something, it''ll be pushed just outside
    again. This will stop the player from sinking into the floor.'
