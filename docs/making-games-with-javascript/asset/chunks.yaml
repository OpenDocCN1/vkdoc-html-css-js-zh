- fmt: '# Custom crosshairs


    Before we can display custom crosshairs, we need a way to disable the default
    mouse cursor. Fortunately for us, CSS already includes this mechanism:


    ```css

    body {

    background: url("path/to/sprites/background.png");

    color: grey;

    font-family: helvetica, arial;

    font-size: 20px;

    cursor: none;

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/YGaYvy`](http://codepen.io/assertchris/pen/YGaYvy).


    Just by adding `cursor: none` to `body`, we can hide the default cursor from the
    game screen. Then, let’s add the crosshair as a new decal:


    ```javascript

    const crosshair = new Decal(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/crosshair.png",

    ),

    new PIXI.Rectangle(

    0, 0, 18, 18,

    ),

    )

    game.addObject(crosshair)

    game.crosshair = crosshair

    ```


    This is from [`http://codepen.io/assertchris/pen/YGaYvy`](http://codepen.io/assertchris/pen/YGaYvy).


    The crosshair can now be seen at the top left (zoom out in your browser window)
    of the game screen. That’s not where we want it, though. What we really want is
    for it to be in proximity to the player, but at an angle directly between the
    center of the player and the mouse cursor.


    Let’s capture the cursor position and calculate the angle between the mouse cursor
    and the player:


    ```javascript

    element.addEventListener("mousemove", (event) => {

    this.state.mouse.clientX = event.clientX

    this.state.mouse.clientY = event.clientY

    const rect = this.player.rectangle

    const centerX = (window.innerWidth / 2) + (rect.width / 2)

    const centerY = (window.innerHeight / 2) + (rect.height / 2)

    const deltaX = event.clientX - centerX

    const deltaY = centerY - event.clientY

    this.state.angle = Math.atan2(deltaY, deltaX)

    })

    ```


    This code is from [`http://codepen.io/assertchris/pen/YGaYvy`](http://codepen.io/assertchris/pen/YGaYvy).


    This code is a little tricky to read, but all it’s doing is getting the width
    and height of a triangle between the mouse cursor and the player. We get the angle
    from that triangle and store it in the game state. The cursor is going to use
    this (once we replace `cursor = new Decal` with `cursor = new Cursor`):


    ```javascript

    class Ladder extends Box {

    get collides() {

    return false

    }

    }

    class LeftSlope extends Box {

    get collides() {

    return false

    }

    }

    class RightSlope extends Box {

    get collides() {

    return false

    }

    }

    class Decal extends Box {

    get collides() {

    return false

    }

    }

    class Crosshair extends Decal {

    animate(state) {

    const rect = state.player.rectangle

    const centerX = rect.x + (rect.width / 2)

    const centerY = rect.y + (rect.height / 2)

    const radius = 70

    const targetX = centerX + Math.cos(state.angle) * radius

    const targetY = centerY - Math.sin(state.angle) * radius

    this.sprite.x = targetX

    this.sprite.y = targetY

    }

    }

    ```


    This code is from [`http://codepen.io/assertchris/pen/YGaYvy`](http://codepen.io/assertchris/pen/YGaYvy).


    Before we dive into the `Crosshair.animate` method, notice how I’ve shortened
    the definitions of `Ladder`, `LeftSlope`, `RightSlope`, and `Decal`? We can use
    the `extends` keyword to inherit the behavior of `Box`.


    > **Note**: Inheritance doesn’t always lead to good code architecture, but in
    this simple case, it works well for us.


    Using the angle we calculated (in the `mousemove` event listener), we calculate
    the point where the crosshair needs to be rendered (see Figure [9-1](#A435434_1_En_9_Chapter.html#Fig1)).


    ![A435434_1_En_9_Fig1_HTML.jpg](A435434_1_En_9_Fig1_HTML.jpg)


    **Figure 9-1.** Fixed crosshair


    # Custom keys


    Until now, we’ve been moving the player with the arrow keys. That’s okay if we
    only need to use the keyboard, but we’ve just added mouse aim. Let’s add the popular
    WASD movement keys to `Player.animate`:


    ```javascript

    animate(state) {

    if (state.keys[37] || state.keys[65]) { // left

    this.velocityX = Math.max(

    this.velocityX - this.accelerationX,

    this.maximumVelocityX * -1,

    )

    }

    if (state.keys[39] || state.keys[68]) { // right

    this.velocityX = Math.min(

    this.velocityX + this.accelerationX,

    this.maximumVelocityX,

    )

    }

    // ...velocity calculations

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    const me = this.rectangle

    const you = object.rectangle

    const collides = object.collides

    if (me.x < you.x + you.width &&

    me.x + me.width > you.x &&

    me.y < you.y + you.height &&

    me.y + me.height > you.y) {

    if (object.constructor.name === "Ladder") {

    if (state.keys[38] || state.keys[40] ||

    state.keys[87] || state.keys[83]) {

    this.isOnLadder = true

    this.isOnGround = false

    this.velocityY = 0

    this.velocityX = 0

    }

    if (state.keys[38] || state.keys[87]) {

    this.rectangle.y -= this.climbingSpeed

    }

    if (state.keys[40] || state.keys[83] &&

    me.y + me.height < you.y + you.height) {

    this.rectangle.y += this.climbingSpeed

    }

    if (me.y <= you.x - me.height) {

    this.isOnLadder = false

    }

    return

    }

    // ...remaining collision detection

    }

    })

    // ...remaining calculations

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/YGaYvy`](http://codepen.io/assertchris/pen/YGaYvy).


    We’ve added `state.keys[65]` and `state.keys[68]` as alternative left and right
    keys. Then, for moving up and down ladders, we’ve also added `state.keys[87]`
    and `state.keys[83]`.'
