- fmt: '# Summary


    In this chapter, we learned how to make slopes the player can walk up (without
    needing to jump). These concepts translate to the implementation of stairs in
    an old castle.


    Try creating stairs of your own. Perhaps your stairs will be steeper or shallower
    than mine, and you’ll need to adjust the rate at which your player ascends or
    descends.


    # 8. Camera Locking


    So far, we’ve limited the levels to the size of our browser window. That’s okay
    for a proof of concept, but real levels require more space than we’re currently
    able to give.


    I’ve got a couple things planned to overcome this limitation. First we’re going
    to lock the camera to the player so that it moves as the player moves. Then we’re
    going to increase the size of the level so that it can be any size we need.


    ## Wrapping with a camera


    PixiJS doesn’t support any kind of free-moving camera through which to render
    the scene, but we don’t need one. Instead of moving the renderer or scene, we
    can wrap it in an HTML element and move that. We’ll need to change how we embed
    the game:


    ```

    click to focus


    .camera, .focus-target {

    width: 100%;

    height: 100%;

    position: absolute;

    top: 0;

    left: 0;

    }

    .focus-target {

    padding: 25px;

    text-align: center;

    }


    game.addEventListenerTo(window)

    game.addRendererTo(document.querySelector(".camera"))

    game.animate()

    ```


    These are from [`http://codepen.io/assertchris/pen/WGzkym`](http://codepen.io/assertchris/pen/WGzkym).


    We begin by creating a camera that takes up the entire screen space. Then, instead
    of appending the scene to `document.body`, we append it to `.camera` instead.
    This gives us the ability to transform `.camera` in interesting ways:


    ```

    animate() {

    requestAnimationFrame(this.animate)

    this.state.renderer = this.renderer

    this.state.stage = this.stage

    this.state.objects.forEach((object) => {

    object.animate(this.state)

    })

    if (this.player) {

    const offsetLeft = Math.round(

    this.player.rectangle.x - (window.innerWidth / 2)

    ) * -1

    const offsetTop = Math.round(

    this.player.rectangle.y - (window.innerHeight / 2)

    ) * -1

    this.element.style = `

    transform:

    scale(1.2)

    translate(${offsetLeft}px)

    translateY(${offsetTop}px)

    `

    }

    this.renderer.render(this.stage)

    }

    // ...later

    const player = new Player(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/player-idle.png",

    ),

    new PIXI.Rectangle(

    Math.round(window.innerWidth / 2),

    Math.round(window.innerHeight / 2),

    44,

    56,

    ),

    )

    game.addObject(player)

    game.player = player

    ```


    This is from [`http://codepen.io/assertchris/pen/WGzkym`](http://codepen.io/assertchris/pen/WGzkym).


    We need to create the `player` object slightly differently. Instead of adding
    it directly to `game`, we declare it as a constant. We still add it to `game`,
    but we also assign it as a property.


    This means we can reference it inside `Game.animate`. We get the `x` and `y` coordinates
    of the player, and then subtract half the screen `innerWidth` and `innerHeight`
    so that the player will be roughly in the center of the screen.


    Then we use CSS transformations to move `.camera` left and up by the amounts we
    just calculated. We can also scale the camera up a little, so things look slightly
    zoomed in (see Figure [8-1](#A435434_1_En_8_Chapter.html#Fig1)). As this code
    is in `Game.animate`, it will update every time the player is rendered, which
    means it will move as the player moves.


    ![A435434_1_En_8_Fig1_HTML.jpg](A435434_1_En_8_Fig1_HTML.jpg)


    **Figure 8-1.** Zoomed and locked


    ## Growing levels


    This leads to an interesting discovery. When the player is standing on top of
    my platform and then jumps, they go through the top of the rendered scene (and
    disappear). This is due to the fixed height of the scene (which is the same as
    the window height).


    To fix this, we need to change how we define the game’s dimensions and how we
    place objects inside it:


    ```

    constructor(w, h) {

    this.w = w

    this.h = h

    this.state = {

    "keys": {},

    "clicks": {},

    "mouse": {},

    "objects": [],

    }

    this.animate = this.animate.bind(this)

    }

    newRenderer() {

    return new PIXI.autoDetectRenderer(

    this.w, this.h, this.newRendererOptions(),

    )

    }

    // ...later

    const width = window.innerWidth

    const height = window.innerHeight + 200

    const game = new Game(

    width,

    height,

    )

    game.addObject(

    new Box(

    new PIXI.extras.TilingSprite.fromImage(

    "path/to/sprites/floor-tile.png",

    width,

    64,

    ),

    new PIXI.Rectangle(

    0,

    height - 64,

    width,

    64,

    ),

    ),

    )

    // ...remaining object definitions

    ```


    This is from [`http://codepen.io/assertchris/pen/WGzkym`](http://codepen.io/assertchris/pen/WGzkym).


    We change the `Game` to accept `width` and `height` constructor parameters. Then,
    instead of using `window.innerWidth` and `window.innerHeight` everywhere, we use
    the same width and height we provide to `game`.


    Until now, we’ve added our game objects relative to the screen edges. This allows
    us to change the width and height quite easily, without having to reposition all
    our game objects. Now we need to replace all instances of the previous (global)
    widths and heights with the `width` and `height` constants.


    The only place we don’t remove the global references is in the camera locking
    code we just added. These need to be relative to the window (not the entire level
    size), so they can stay as they are.


    ## Summary


    In this chapter, we learned how to expand our levels beyond the confines of the
    window. Now that we can lock the camera to the player, we can create sprawling
    labyrinths and awe-inspiring castles.


    Take some time to consider how you’d improve the background and borders of each
    level so they’re not as empty as mine are. Perhaps you might want to create animated
    backgrounds that express the tone and location of each level.


    # 9. Projectiles


    Our game is full of keyboard control, but what about the mouse? This chapter is
    all about projectiles; how to fire them and how they move.


    In this chapter, we’re going to add a few new, popular keyboard controls (WASD),
    and mouse aiming and shooting. Along the way we’ll add a custom crosshair. This
    is going to be fun.'
