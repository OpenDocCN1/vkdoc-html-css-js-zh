- fmt: '# 1. Introduction


    Electronic supplementary material The online version of this chapter (doi:[10.1007/978-1-4842-2493-9_1](http://dx.doi.org/10.1007/978-1-4842-2493-9_1))
    contains supplementary material, which is available to authorized users.


    I''m a gamer. I''ve been a gamer since before I was a programmer. And yet I’ve
    never tried to build a game…until now. A few weeks ago, a coworker sketched a
    simple, beautiful platform game. The moment I saw it; I knew I wanted to build
    it.


    Knowing where to begin is always hard. Many books and tutorials about making games
    are often written in Java, C++, or some other language you haven’t learned yet.
    So the complexity of making games increases when you also need to learn new languages.


    Instead, I’m going to use modern JavaScript to make games for web browsers. They’re
    effortless to use and they work everywhere. If you’ve ever wanted to make a game,
    join me. We’ll start with nothing and build fun games in no time at all.


    If you have questions, feel free to ask me on Twitter: [`https://twitter.com/assertchris`](https://twitter.com/assertchris).


    # 2. The Game Loop


    Game loops are an essential part of every game. In this chapter, we’re going to
    set the stage for our game by creating a solid workflow and environment. We’ll
    see a few helpful libraries and render our first game character. This is gonna
    be fun!


    ## Setting the stage for our game


    We’re going to build games using the latest JavaScript standards and language
    features. This is usually where I’d show you how to create a JavaScript-built
    chain, but we’re going to do something different....


    For this book, we’re going to do all of our coding in a hosted service called
    CodePen. It looks like the code in Figure [2-1](#A435434_1_En_2_Chapter.html#Fig1).


    ![A435434_1_En_2_Fig1_HTML.jpg](A435434_1_En_2_Fig1_HTML.jpg)


    Figure 2-1. CodePen


    There are a few benefits to this approach:


    1. We don’t need to cover JavaScript build chains. They are subjective, brittle,
    and distracting.

    2. We can use SCSS (enhanced stylesheets) for free.

    3. You don’t have to set anything up to start interacting with the source code.


    We’re going to use a JavaScript library, called PixiJS ([`www.pixijs.com`](http://www.pixijs.com)).
    It’s a rendering library that will smooth over the browser inconsistencies. It’s
    not a game engine or a physics engine, so we’re still going to learn and code
    those aspects ourselves. PixiJS will just allow us to get to those things sooner.


    We’re using PixiJS `v4`. It’s entirely possible that newer versions are available
    by the time you read this. The concepts should be universal, though the syntax
    might have changed.


    We can add PixiJS to our CodePens by clicking on Settings ➤ JavaScript, and adding
    the following URL to the PixiJS CDN script: [`https://cdnjs.cloudflare.com/ajax/libs/pixi.js/4.0.0/pixi.min.js`](https://cdnjs.cloudflare.com/ajax/libs/pixi.js/4.0.0/pixi.min.js).
    This process is shown in Figure [2-2](#A435434_1_En_2_Chapter.html#Fig2).


    ![A435434_1_En_2_Fig2_HTML.jpg](A435434_1_En_2_Fig2_HTML.jpg)


    Figure 2-2. Adding PixiJS to CodePen


    ## Creating sprites


    Sprites are a common name for visual objects in a game. We can move them around
    (though often they are responsible for moving themselves around) on the screen.
    We can interact with them.


    Mario ([`https://en.wikipedia.org/wiki/Mario`](https://en.wikipedia.org/wiki/Mario))
    is a sprite, the platforms he walks on are sprites, and the clouds in the background
    are sprites. Think of sprites as slices of a design file, which we paint over
    abstract data structures. Those abstract data structures have a position, and
    sometimes a velocity. Those abstract data structures are what we apply game rules
    to. They are our power-ups and enemies.


    So how do we make them? Let’s start by creating a small PNG image. We’re using
    PNG because it allows us to make parts of the sprite texture transparent. You
    can also use JPEG images for your sprites if you want to.


    Then we need to create a renderer, a stage, and a sprite:


    ```

    const renderer = new PIXI.autoDetectRenderer(

    window.innerWidth,

    window.innerHeight,

    {

    "antialias": true,

    "autoResize": true,

    "transparent": true,

    "resolution": 2,

    },

    )

    document.body.appendChild(renderer.view)

    const sprite = new PIXI.Sprite.fromImage(

    "path/to/sprites/player-idle.png",

    )

    sprite.x = window.innerWidth / 2

    sprite.y = window.innerHeight / 2

    const stage = new PIXI.Container()

    stage.addChild(sprite)

    const animate = function() {

    requestAnimationFrame(animate)

    renderer.render(stage)

    }

    animate()

    ```


    This is from [`http://codepen.io/assertchris/pen/qaobAz`](http://codepen.io/assertchris/pen/qaobAz).


    Ok, there’s a lot going on here! Let’s look at this code in steps:


    1. We create a renderer. Renderers are what convert PixiJS abstractions (sprites,
    textures, etc.) into canvas or WebGL graphics. We don’t have to interact with
    them, but we always have to have a renderer in order for our PixiJS stuff to show
    up. We tell the renderer to take up the full width and height of the browser window.
    We also tell it to anti-alias our graphics and bump them up to retina resolution.
    We tell it to have a transparent background, and to resize all graphics to fit
    on the screen.

    2. Then we create a new instance of `PIXI.Sprite`, using the PNG image we created
    earlier. By default, it has a position of `x = 0` and `y = 0`. We can position
    it in the center of the screen instead. We have to create a root sprite container,
    often called a stage, and append the sprite to the stage. It’s less complicated
    than it sounds. Think of HTML documents. They have a root `html` element, which
    we add all other elements to. This is the same kind of thing.

    3. Finally, we create an animate function and make sure that the renderer renders
    our stage and sprite. We’re using the `requestAnimationFrame` function as a way
    rendering without blocking the JavaScript thread. There’s a long discussion we
    could have about that. For now, it’s only important to know that `requestAnimationFrame`
    happens many times a second. The goal is for our game is to render between 30
    and 60 frames per second, while doing all sorts of player and world calculations
    in the background. This is the function we need to use for that all to go smoothly.'
  raw: '# 1. Introduction


    Electronic supplementary material The online version of this chapter (doi:[10.​1007/​978-1-4842-2493-9_​1](http://dx.doi.org/10.1007/978-1-4842-2493-9_1))
    contains supplementary material, which is available to authorized users.


    I''m a gamer. I''ve been a gamer since before I was a programmer. And yet I’ve
    never tried to build a game…until now. A few weeks ago, a coworker sketched a
    simple, beautiful platform game. The moment I saw it; I knew I wanted to build
    it.


    Knowing where to begin is always hard. Many books and tutorials about making games
    are often written in Java, C++, or some other language you haven’t learned yet.
    So the complexity of making games increases when you also need to learn new languages.


    Instead, I’m going to use modern JavaScript to make games for web browsers. They’re
    effortless to use and they work everywhere. If you’ve ever wanted to make a game,
    join me. We’ll start with nothing and build fun games in no time at all.


    If you have questions, feel free to ask me on Twitter: [`https://twitter.com/assertchris`](https://twitter.com/assertchris)
    .


    # 2. The Game Loop


    Game loops are an essential part of every game. In this chapter, we’re going to
    set the stage for our game by creating a solid workflow and environment. We’ll
    see a few helpful libraries and render our first game character. This is gonna
    be fun!


    ## Setting the stage for our game


    We’re going to build games using the latest JavaScript standards and language
    features. This is usually where I’d show you how to create a JavaScript-built
    chain, but we’re going to do something different....


    For this book, we’re going to do all of our coding in a hosted service called
    CodePen . It looks like the code in Figure [2-1](#A435434_1_En_2_Chapter.html#Fig1).


    ![A435434_1_En_2_Fig1_HTML.jpg](A435434_1_En_2_Fig1_HTML.jpg)


    Figure 2-1.


    CodePen


    There are a few benefits to this approach:


    1.  We don’t need to cover JavaScript build chains. They are subjective, brittle,
    and distracting.  

    2.  We can use SCSS (enhanced stylesheets) for free.  

    3.  You don’t have to set anything up to start interacting with the source code.
     


    We’re going to use a JavaScript library, called PixiJS ( [`www.pixijs.com`](http://www.pixijs.com)
    ). It’s a rendering library that will smooth over the browser inconsistencies.
    It’s not a game engine or a physics engine, so we’re still going to learn and
    code those aspects ourselves. PixiJS will just allow us to get to those things
    sooner.


    We’re using PixiJS `v4`. It’s entirely possible that newer versions are available
    by the time you read this. The concepts should be universal, though the syntax
    might have changed.


    We can add PixiJS to our CodePens by clicking on Settings ➤ JavaScript, and adding
    the following URL to the PixiJS CDN script: [`https://cdnjs.cloudflare.com/ajax/libs/pixi.js/4.0.0/pixi.min.js`](https://cdnjs.cloudflare.com/ajax/libs/pixi.js/4.0.0/pixi.min.js)
    . This process is shown in Figure [2-2](#A435434_1_En_2_Chapter.html#Fig2).


    ![A435434_1_En_2_Fig2_HTML.jpg](A435434_1_En_2_Fig2_HTML.jpg)


    Figure 2-2.


    Adding PixiJS to CodePen


    ## Creating sprites


    Sprites are a common name for visual objects in a game. We can move them around
    (though often they are responsible for moving themselves around) on the screen.
    We can interact with them.


    Mario ( [`https://en.wikipedia.org/wiki/Mario`](https://en.wikipedia.org/wiki/Mario)
    ) is a sprite, the platforms he walks on are sprites, and the clouds in the background
    are sprites. Think of sprites as slices of a design file, which we paint over
    abstract data structures. Those abstract data structures have a position, and
    sometimes a velocity. Those abstract data structures are what we apply game rules
    to. They are our power-ups and enemies.


    So how do we make them? Let’s start by creating a small PNG image. We’re using
    PNG because it allows us to make parts of the sprite texture transparent. You
    can also use JPEG images for your sprites if you want to.


    Then we need to create a renderer, a stage, and a sprite:


    ```

    const renderer = new PIXI.autoDetectRenderer(

    window.innerWidth,

    window.innerHeight,

    {

    "antialias": true,

    "autoResize": true,

    "transparent": true,

    "resolution": 2,

    },

    )

    document.body.appendChild(renderer.view)

    const sprite = new PIXI.Sprite.fromImage(

    "path/to/sprites/player-idle.png",

    )

    sprite.x = window.innerWidth / 2

    sprite.y = window.innerHeight / 2

    const stage = new PIXI.Container()

    stage.addChild(sprite)

    const animate = function() {

    requestAnimationFrame(animate)

    renderer.render(stage)

    }

    animate()

    ```


    This is from [`http://codepen.io/assertchris/pen/qaobAz`](http://codepen.io/assertchris/pen/qaobAz)
    .


    Ok, there’s a lot going on here! Let’s look at this code in steps:


    1.  We create a renderer. Renderers are what convert PixiJS abstractions (sprites,
    textures, etc.) into canvas or WebGL graphics. We don’t have to interact with
    them, but we always have to have a renderer in order for our PixiJS stuff to show
    up. We tell the renderer to take up the full width and height of the browser window.
    We also tell it to anti-alias our graphics and bump them up to retina resolution.
    We tell it to have a transparent background, and to resize all graphics to fit
    on the screen.  

    2.  Then we create a new instance of `PIXI.Sprite`, using the PNG image we created
    earlier. By default, it has a position of `x = 0` and `y = 0`. We can position
    it in the center of the screen instead. We have to create a root sprite container,
    often called a stage, and append the sprite to the stage. It’s less complicated
    than it sounds. Think of HTML documents. They have a root `html` element, which
    we add all other elements to. This is the same kind of thing.  

    3.  Finally, we create an animate function and make sure that the renderer renders
    our stage and sprite. We’re using the `requestAnimationFrame` function as a way
    rendering without blocking the JavaScript thread. There’s a long discussion we
    could have about that. For now, it’s only important to know that `requestAnimationFrame`
    happens many times a second. The goal is for our game is to render between 30
    and 60 frames per second, while doing all sorts of player and world calculations
    in the background. This is the function we need to use for that all to go smoothly.'
