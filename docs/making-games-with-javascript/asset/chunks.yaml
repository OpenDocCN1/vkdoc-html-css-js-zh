    In order for players to be able to climb ladders, we have to be able to tell if
    they''re trying to climb one. We also then have to suspend gravity and side motion
    so they don''t fall off or slide off:


    ```

    class Player {

    constructor(sprite, rectangle) {

    this.sprite = sprite

    this.rectangle = rectangle

    this.velocityX = 0

    this.maximumVelocityX = 8

    this.accelerationX = 2

    this.frictionX = 0.9

    this.velocityY = 0

    this.maximumVelocityY = 30

    this.accelerationY = 3

    this.jumpVelocity = -30

    this.climbingSpeed = 10

    this.isOnGround = false

    this.isOnLadder = false

    }

    animate(state) {

    if (state.keys[37]) { // left

    this.velocityX = Math.max(

    this.velocityX - this.accelerationX,

    this.maximumVelocityX * -1,

    )

    }

    if (state.keys[39]) { // right

    this.velocityX = Math.min(

    this.velocityX + this.accelerationX,

    this.maximumVelocityX,

    )

    }

    this.velocityX *= this.frictionX

    this.velocityY = Math.min(

    this.velocityY + this.accelerationY,

    this.maximumVelocityY,

    )

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    const me = this.rectangle

    const you = object.rectangle

    const collides = object.collides

    if (me.x  you.x &&

    me.y  you.y) {

    if (object.constructor.name === "Ladder") {

    if (state.keys[38] || state.keys[40]) {

    this.isOnLadder = true

    this.isOnGround = false

    this.velocityY = 0

    this.velocityX = 0

    }

    if (state.keys[38]) {

    this.rectangle.y -= this.climbingSpeed

    }

    if (state.keys[40] &&

    me.y + me.height < you.y + you.height) {

    this.rectangle.y += this.climbingSpeed

    }

    }

    // ...snip

    }

    })

    if (state.keys[32] && this.isOnGround) {

    this.velocityY = this.jumpVelocity

    this.isOnGround = false

    }

    this.rectangle.x += this.velocityX

    if (!this.isOnLadder) {

    this.rectangle.y += this.velocityY

    }

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/jrzrPw`](http://codepen.io/assertchris/pen/jrzrPw).


    In this code, we create an `isOnLadder` variable so we can tell if the player
    is standing still on a ladder. During the usual collision detection, we note whether
    the object the player is colliding with is a ladder or not. If so, and they are
    pressing the up arrow, we start them climbing. `isOnLadder` is only set if they
    are pressing the up arrow, which is why we need that variable to begin with.


    We then reset player velocity and the properties related to jumping. We also directly
    alter the player rectangle. If the up arrow is being pressed, we move the player
    up.


    ## Summary


    In this chapter, we added ladders and stationary platforms. Our players can now
    jump and climb ladders to navigate levels. These are two essential elements of
    2D platform games.


