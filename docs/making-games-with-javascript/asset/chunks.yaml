- fmt: '### Natural player movement


    The player can now move a bit. It doesn’t feel great, though. The moment we let
    go of an arrow key, the action just grinds to a halt. The game has only one speed:
    slow.


    What we need is some acceleration to allow the player to speed up in a given direction.
    We could also use some friction to slow the player down when they are no longer
    accelerating. Let’s add these:


    ```

    class Player {

    constructor(sprite, x, y) {

    this.sprite = sprite

    this.x = x

    this.y = y

    this.velocityX = 0

    this.maximumVelocityX = 8

    this.accelerationX = 2

    this.frictionX = 0.9

    this.sprite.x = this.x

    this.sprite.y = this.y

    }

    animate(state) {

    if (state.keys[37]) { // left

    this.velocityX = Math.max(

    this.velocityX - this.accelerationX,

    this.maximumVelocityX * -1

    )

    }

    if (state.keys[39]) { // right

    this.velocityX = Math.min(

    this.velocityX + this.accelerationX,

    this.maximumVelocityX

    )

    }

    this.velocityX *= this.frictionX

    this.x += this.velocityX

    // if (state.clicks[1]) { // left click

    //   this.x = state.clicks[1].clientX

    // }

    this.sprite.x = this.x

    this.sprite.y = this.y

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/rrdZYB`](http://codepen.io/assertchris/pen/rrdZYB).


    Whoa there, tiger! Let’s review this in steps:


    1.  We’ve created a handful of properties: velocity, maximum velocity, acceleration,
    and friction. We’ve set them to reasonable defaults. Feel free to experiment with
    their values until you appreciate what each one does.

    2.  We can begin to track the acceleration of our player in either direction.
    If we’re pressing the left key, we start to accelerate the player in that direction.
    There’s a maximum acceleration that the player can have so they don’t continue
    to gain speed.

    3.  Without some kind of counterforce, the player will continue to move in the
    same direction. This is like what happens in space where there is no air resistance
    or gravity to counteract momentum. We define this counterforce as friction and
    multiply the velocity by it. Without acceleration, this means the momentum tends
    toward zero. This gives the appearance that the player has stopped.


    ### Summary


    We’ve started to make our game interactive. We can now press the arrow keys and
    see our player’s sprite move smoothly around the scene.


    We’ve also made things a little less jarring by adding acceleration and deceleration
    to the sprite’s movement. This logic will inform how we create other mechanics
    (like gravity).


    Take a moment to adjust your acceleration properties so your player’s sprite moves
    just right for your game. You can also try mapping other keys to the left and
    right actions.


    # 4. Collision Detection


    It’s time for us to talk about collision detection. It affects obvious parts of
    our game, like walls we can’t walk through. Like floors we can’t fall through.
    It also affects obscure parts of our game like weapon projectiles and checkpoints.


    We’re not going to get to gravity yet. Nor are we going to look at player health
    or respawning. Floors, projectiles, and checkpoints are interesting, but they
    deserve sections of their own. In this chapter, we’re going to create impassable
    objects. We’re going to learn ways of knowing whether two objects occupy the same
    space.


    I’ve spent a bit of time researching this topic. It seems there are many ways
    of working out whether two things occupy the same space. Some of them are easy
    to explain and implement. We’ll look at those. Other ways are not easy. They’re
    still cool, though.


    ### Creating boxes


    The player is only one of many objects that will exist on the screen at one time.
    Our game is a platform game, so we can expect at least one platform on screen
    at any given time.


    Platforms have some interesting characteristics. Sometimes they allow players
    to fall down through them. Like when you’re standing on a platform and you hold
    down and press jump (at the same time). Some games take that sequence to mean
    that you want to fall through the platform.


    Similarly, some games allow players to jump through the bottom of platforms. This
    enables vertical movement without having gaps in overhead platforms.


    Sometimes platforms even move!


    Platforms are so special that we’ll spend a few sections just implementing their
    different behaviors. But right now we’re going to focus on another common object.
    The generic box.


    Think of this box as an ancestor of the platform. It may share some platform functionality,
    but the main reason it exists is for things to collide with it. Especially things
    like the player.


    The boxes we’re going to make might not even look like boxes. When we get to implementing
    gravity, we’ll need a wide, thin box to keep the player from falling out of the
    world. We''ll also need tall, thin boxes to stop the player from running off the
    side of the floor. We’ll make walls out of them. We may even make boxes out of
    the boxes. Big, wooden, “jump on me to get to higher things” boxes.


    Ok, enough talking.


    ```

    class Box {

    constructor(sprite, x, y, w, h) {

    this.sprite = sprite

    this.x = x

    this.y = y

    this.w = w

    this.h = h

    this.sprite.x = this.x

    this.sprite.y = this.y

    }

    animate(state) {

    this.sprite.x = this.x

    this.sprite.y = this.y

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/qaokJj`](http://codepen.io/assertchris/pen/qaokJj).


    To make this class, I copied and pasted the `Player` class and deleted a bunch
    of stuff. I did have to add a width and height property to it. We''ll get to that
    in a bit.


    Next, we need to add two of these boxes to the stage:


    ```

    const playerSprite = new PIXI.Sprite.fromImage(

    "path/to/sprites/player-idle.png",

    )

    const player = new Player(

    playerSprite,

    window.innerWidth / 2,

    window.innerHeight / 2,

    44,

    56,

    )

    const blob1Sprite = new PIXI.Sprite.fromImage(

    "path/to/sprites/blob-idle-1.png",

    )

    const blob1 = new Player(

    blob1Sprite,

    (window.innerWidth / 2) - 150,

    (window.innerHeight / 2) - 35,

    48,

    48,

    )

    const blob2Sprite = new PIXI.Sprite.fromImage(

    "path/to/sprites/blob-idle-2.png",

    )

    const blob2 = new Player(

    blob2Sprite,

    (window.innerWidth / 2) + 150,

    (window.innerHeight / 2) + 35,

    48,

    48,

    )

    const stage = new PIXI.Container()

    stage.addChild(playerSprite)

    stage.addChild(blob1Sprite)

    stage.addChild(blob2Sprite)

    let state = {

    "renderer": renderer,

    "stage": stage,

    "keys": {},

    "clicks": {},

    "mouse": {},

    "objects": [

    player,

    blob1,

    blob2,

    ],

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/qaokJj`](http://codepen.io/assertchris/pen/qaokJj).


    That’s strange! I’ve created two new `Box` instances and called them `blob`s.
    That’s because we’re about to look at…'
