- fmt: '# Handling events


    Gamepad events work slightly differently than the keyboard and mouse events we’ve
    seen so far. Due to their experimental support, we need to capture them in a certain
    way, inside `Game.animate`:


    ```

    constructor(w, h) {

    this.w = w

    this.h = h

    this.state = {

    "game": this,

    "keys": {},

    "clicks": {},

    "mouse": {},

    "buttons": {},

    "objects": [],

    "player": null,

    "crosshair": null,

    }

    this.animate = this.animate.bind(this)

    }

    // ...later

    animate() {

    requestAnimationFrame(this.animate)

    this.state.renderer = this.renderer

    this.state.stage = this.stage

    this.state.player = this.player

    this.state.crosshair = this.crosshair

    let gamepads = []

    if (navigator.getGamepads) {

    gamepads = navigator.getGamepads()

    }

    if (navigator.webkitGetGamepads) {

    gamepads = navigator.webkitGetGamepads

    }

    if (gamepads) {

    const gamepad = gamepads[0]

    gamepad.buttons.forEach((button, i) => {

    this.state.buttons[i] = button.pressed

    })

    }

    // ...remaining animation code

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/WGzYgA`](http://codepen.io/assertchris/pen/WGzYgA).


    We need to try a few different approaches before we find the gamepad list supported
    by the browser we’re using. I’m using a modern version of Chrome, which supports
    the JavaScript Gamepad API.


    We capture the pressed state of each button and store it in the `state.buttons`
    object (that we initialized in the `constructor`). Considering how much complexity
    we’ve added to `Player.animate`, I think it’s time we refactored a bit of it:


    ```

    animate(state) {

    const leftKey = state.keys[37] || state.keys[65]

    const leftButton = state.buttons && state.buttons[13]

    const rightKey = state.keys[39] || state.keys[68]

    const rightButton = state.buttons && state.buttons[14]

    const upKey = state.keys[38] || state.keys[87]

    const upButton = state.buttons && state.buttons[11]

    const jumpKey = state.keys[32]

    const jumpButton = state.buttons && state.buttons[0]

    if (leftKey || leftButton) {

    this.velocityX = Math.max(

    this.velocityX - this.accelerationX,

    this.maximumVelocityX * -1,

    )

    }

    if (rightKey || rightButton) {

    this.velocityX = Math.min(

    this.velocityX + this.accelerationX,

    this.maximumVelocityX,

    )

    }

    this.velocityX *= this.frictionX

    this.velocityY = Math.min(

    this.velocityY + this.accelerationY,

    this.maximumVelocityY,

    )

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    const me = this.rectangle

    const you = object.rectangle

    const collides = object.collides

    if (me.x  you.x &&

    me.y  you.y) {

    if (object.constructor.name === "Ladder") {

    if (upKey || upButton) {

    this.rectangle.y -= this.climbingSpeed

    this.isOnLadder = true

    this.isOnGround = false

    this.velocityY = 0

    this.velocityX = 0

    }

    if (me.y <= you.x - me.height) {

    this.isOnLadder = false

    }

    return

    }

    // ...remaining collision detection code

    }

    })

    if ((jumpKey || jumpButton) && this.isOnGround) {

    this.velocityY = this.jumpVelocity

    this.isOnGround = false

    this.isOnSlope = false

    }

    // ...remaining movement code

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/WGzYgA`](http://codepen.io/assertchris/pen/WGzYgA).


    Here we’ve defined a number of constants (to represent pressed keyboard keys and
    gamepad buttons). It’s easy to assume a keyboard is present, but gamepads are
    less of a certainty.


    That’s why we combine a couple different keyboard keys into a single check, but
    each gamepad button check requires that we first make sure any gamepad buttons
    have been defined.


    With this code, we’ve mapped the direction buttons (D-Pad) and the jump button
    (A on PS-compatible controller) to the corresponding player actions.


    ## Triggers and joysticks


    Triggers and joysticks are significantly more difficult (and prone to differences
    in gamepad design) than buttons. I’m using a PS-compatible Logitech gamepad, and
    the triggers are mapped to the `gamepad.axes` object, as are the joysticks.


    The captured values range from `-1` through to `1`, on all 6 axes. At rest, the
    joysticks are not exactly `0`, which means we need to use some Epsilon value ([`https://en.wikipedia.org/wiki/Epsilon`](https://en.wikipedia.org/wiki/Epsilon)),
    or rounding, to determine whether the axis is at rest.


    We’d also need to revise our trigonometric equations to account for the difference
    in input values/scale. I guess what I’m saying is we need to consider which gamepads
    we care to support, and the browsers our players will need in order to use them.


    ## Summary


    In this chapter, we dipped our toes into the ocean of gamepads. We’re lucky enough
    to live in a time where browsers are gaining support for using gamepads with JavaScript,
    but there’s still a lot of work to be done before it becomes easy or common.


    If you’re feeling brave, perhaps you would like to try your hand at mapping your
    gamepad’s triggers and joysticks to game actions (like targeting and shooting
    projectiles).


    I’d like to take a moment to thank you for reading this book. It’s been a brief
    but thrilling project for me, and I hope you have learned and enjoyed it as much
    as I have (if not more).


    As I said in the beginning: feel free to contact me with questions or suggestions
    for improvement. Given the dynamic nature of the examples, I will be able to fix
    bugs and add comments about how they can be improved.


    My Twitter profile is [`https://twitter.com/assertchris`](https://twitter.com/assertchris).


    On occasion, I’ll also stream as I code. You can join in, ask questions (in real-time)
    and learn along with me.


    My Twitch channel is [`https://www.twitch.tv/assertchris`](https://www.twitch.tv/assertchris).


