- fmt: "## Detecting Circle Collisions\n\nI want you to create circles for these first\
    \ few boxes. The type of collision detection we’re going to do first, is with\
    \ circles. It’s okay that the box has a width and height instead of a radius.\
    \ You won’t use this kind of collision detection often, unless your platform game\
    \ has a lot of circles in it.\n\nLet’s see how this kind of detection works:\n\
    \n```\nclass Player {\n  constructor(sprite, x, y, w, h) {\n    this.sprite =\
    \ sprite\n    this.x = x\n    this.y = y\n    this.w = w\n    this.h = h\n   \
    \ this.velocityX = 0\n    this.maximumVelocityX = 8\n    this.accelerationX =\
    \ 2\n    this.frictionX = 0.9\n    this.sprite.x = this.x\n    this.sprite.y =\
    \ this.y\n  }\n  animate(state) {\n    if (state.keys[37]) { // left\n      this.velocityX\
    \ = Math.max(\n        this.velocityX - this.accelerationX,\n        this.maximumVelocityX\
    \ * -1,\n      )\n    }\n    if (state.keys[39]) { // right\n      this.velocityX\
    \ = Math.min(\n        this.velocityX + this.accelerationX,\n        this.maximumVelocityX,\n\
    \      );\n    }\n    this.velocityX *= this.frictionX\n    let move = true\n\
    \    state.objects.forEach((object) => {\n      if (object === this) {\n     \
    \   return\n      }\n      var deltaX = this.x - object.x\n      var deltaY =\
    \ this.y - object.y\n      var distance = Math.sqrt(\n        deltaX * deltaX\
    \ + deltaY * deltaY,\n      );\n      if (distance < (this.w / 2 + object.w /\
    \ 2)) {\n        if (this.velocityX > 0 && object.x >= this.x) {\n          move\
    \ = false\n        }\n        if (this.velocityX < 0 && object.x <= this.x) {\n\
    \          move = false\n        }\n      }\n    });\n    if (move) {\n      this.x\
    \ += this.velocityX\n    }\n    this.sprite.x = this.x\n    this.sprite.y = this.y\n\
    \  }\n}\n```\n\nThis is from [`http://codepen.io/assertchris/pen/qaokJj`](http://codepen.io/assertchris/pen/qaokJj).\n\
    \nThe first thing we need to do is define a width and height. Although we’re pretending\
    \ that our players and boxes are circles, we only need half a width as a radius.\n\
    \nNext we check each object in the state. We can ignore the player object because\
    \ we don’t need to know when something collides with itself. We do need to check\
    \ everything else, though.\n\nCircles collide when the distance between their\
    \ origins is less than their combined radii. Their middle points are so close\
    \ that their lines have to be overlapping.\n\nWe do a quick check to see whether\
    \ the direction the player is moving in is where the box is. If that’s the case,\
    \ then we prevent the player from moving in that direction.\n\nGive it a go. It’s\
    \ pretty fun to see how non-squares block each other. Of course they all have\
    \ to be perfect circles for this simple algorithm to work.\n\n## Detecting Rectangle\
    \ Collisions\n\nDetecting collisions of rectangles is almost as easy as circles.\
    \ Go ahead and swap the blob image for a box image. You can even adjust the sprite\
    \ names to reflect the squareness of your boxes.\n\nThis time around, we’ll treat\
    \ the player like a rectangle. Instead of radii, we need to check if there are\
    \ gaps between the player rectangle and either box. We call this axis-aligned\
    \ bounding box collision detection (or AABB for short).\n\nIf there is no gap,\
    \ and the player wants to move in the direction of the box, then we prevent that\
    \ from happening:\n\n```\nlet move = true\nstate.objects.forEach((object) => {\n\
    \  if (object === this) {\n    return\n  }\n  if (this.x < object.x + object.w\
    \ &&\n    this.x + this.w > object.x &&\n    this.y < object.y + object.h &&\n\
    \    this.y + this.h > object.y) {\n    if (this.velocityX > 0 && object.x >=\
    \ this.x) {\n      move = false\n    }\n  }\n})\nif (move) {\n  this.x += this.velocityX\n\
    }\n```\n\nThis is from [`http://codepen.io/assertchris/pen/qaokJj`](http://codepen.io/assertchris/pen/qaokJj)\n\
    \nThese are simple methods for detecting collisions, but there are others. There’s\
    \ one that uses projection-based vector mathematics (`www.sevenson.com.au/actionscript/sat`)\
    \ to determine overlap. There’s another that checks each line, in a couple of\
    \ polygons, to see if any lines intersect ([`http://stackoverflow.com/questions/9043805/test-if-two-lines-intersect-javascript-function`](http://stackoverflow.com/questions/9043805/test-if-two-lines-intersect-javascript-function)).\
    \ It’s crazy.\n\nYou can even experiment with groups of circles colliding together.\
    \ That might be fun. In Figure [4-1](#A435434_1_En_4_Chapter.html#Fig1), I’m going\
    \ to run this little character into these little boxes for a bit…\n\n![A435434_1_En_4_Fig1_HTML.jpg](A435434_1_En_4_Fig1_HTML.jpg)\n\
    \n**Figure 4-1.** Players and boxes\n\n## Summary\n\nIn this chapter, we looked\
    \ at a couple methods we can use to detect collisions between player sprites and\
    \ various other objects in the game.\n\nTake some time to rearrange the boxes\
    \ and blobs so you can get a feel for how your first game level might look.\n\n\
    # 5. Gravity\n\nIn this chapter, we’re going to work on our code structure and\
    \ add gravity to our game. We’ve already done most of the work for gravity, so\
    \ it should be relatively straightforward to finish it up."
  raw: '## Detecting circle collisions


    I want you to create circles for these first few boxes. The type of collision
    detection we’re going to do first, is with circles. It’s okay that the box has
    a width and height instead of a radius. You won’t use this kind of collision detection
    often, unless your platform game has a lot of circles in it.


    Let’s see how this kind of detection works:


    ```

    class Player {

    constructor(sprite, x, y, w, h) {

    this.sprite = sprite

    this.x = x

    this.y = y

    this.w = w

    this.h = h

    this.velocityX = 0

    this.maximumVelocityX = 8

    this.accelerationX = 2

    this.frictionX = 0.9

    this.sprite.x = this.x

    this.sprite.y = this.y

    }

    animate(state) {

    if (state.keys[37]) { // left

    this.velocityX = Math.max(

    this.velocityX - this.accelerationX,

    this.maximumVelocityX * -1,

    )

    }

    if (state.keys[39]) { // right

    this.velocityX = Math.min(

    this.velocityX + this.accelerationX,

    this.maximumVelocityX,

    );

    }

    this.velocityX *= this.frictionX

    let move = true

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    var deltaX = this.x - object.x

    var deltaY = this.y - object.y

    var distance = Math.sqrt(

    deltaX * deltaX + deltaY * deltaY,

    );

    if (distance  0 && object.x >= this.x) {

    move = false

    }

    }

    });

    if (move) {

    this.x += this.velocityX

    }

    this.sprite.x = this.x

    this.sprite.y = this.y

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/qaokJj`](http://codepen.io/assertchris/pen/qaokJj)
    .


    The first thing we need to do is define a width and height. Although we’re pretending
    that our players and boxes are circles, we only need half a width as a radius.


    Next we check each object in the state. We can ignore the player object because
    we don’t need to know when something collides with itself. We do need to check
    everything else, though.


    Circles collide when the distance between their origins is less than their combined
    radii. Their middle points are so close that their lines have to be overlapping.


    We do a quick check to see whether the direction the player is moving in is where
    the box is. If that’s the case, then we prevent the player from moving in that
    direction.


    Give it a go. It’s pretty fun to see how non-squares block each other. Of course
    they all have to be perfect circles for this simple algorithm to work.


    ## Detecting rectangle collisions


    Detecting collisions of rectangles is almost as easy as circles. Go ahead and
    swap the blob image for a box image. You can even adjust the sprite names to reflect
    the squareness of your boxes.


    This time around, we’ll treat the player like a rectangle. Instead of radii, we
    need to check if there are gaps between the player rectangle and either box. We
    call this axis-aligned bounding box collision detection (or AABB for short).


    If there is no gap, and the player wants to move in the direction of the box,
    then we prevent that from happening:


    ```

    let move = true

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    if (this.x  object.x &&

    this.y  object.y) {

    if (this.velocityX  0 && object.x >= this.x) {

    move = false

    }

    }

    })

    if (move) {

    this.x += this.velocityX

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/qaokJj`](http://codepen.io/assertchris/pen/qaokJj)


    These are simple methods for detecting collisions, but there are others. There’s
    one that uses projection-based vector mathematics (`www.sevenson.com.au/actionscript/sat`)
    to determine overlap. There’s another that checks each line, in a couple of polygons,
    to see if any lines intersect ( [`http://stackoverflow.com/questions/9043805/test-if-two-lines-intersect-javascript-function`](http://stackoverflow.com/questions/9043805/test-if-two-lines-intersect-javascript-function)
    ). It’s crazy.


    You can even experiment with groups of circles colliding together. That might
    be fun. In Figure [4-1](#A435434_1_En_4_Chapter.html#Fig1), I’m going to run this
    little character into these little boxes for a bit…


    ![A435434_1_En_4_Fig1_HTML.jpg](A435434_1_En_4_Fig1_HTML.jpg)


    Figure 4-1.


    Players and boxes


    ## Summary


    In this chapter, we looked at a couple methods we can use to detect collisions
    between player spites and various other objects in the game.


    Take some time to rearrange the boxes and blobs so you can get a feel for how
    your first game level might look.


    # 5. Gravity


    In this chapter, we’re going to work on our code structure and add gravity to
    our game. We’ve already done most of the work for gravity, so it should be relatively
    straightforward to finish it up.'
  trans: "\n## 检测圆形碰撞\n\n我希望你为前几个方块创建圆形。我们首先要做的碰撞检测类型，就是针对圆形的。即使方块有宽度和高度而不是半径也没关系。除非你的平台游戏中有大量圆形，否则你不会经常用到这种碰撞检测方式。\n\
