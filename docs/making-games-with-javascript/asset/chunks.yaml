- fmt: '# The Game Loop


    The game loop will control the flow of our game. It’s a repetitive process of
    reading input, calculating changes in state, and rendering output to the screen.


    So far we’ve set up a lot of scaffolding and all we’re doing is rendering a static
    image. Let’s move it around a bit! To begin with, we’re going to create a `Player`
    class so we can track the position of the player:


    ```

    class Player {

    constructor(sprite, x, y) {

    this.sprite = sprite

    this.x = x

    this.y = y

    this.sprite.x = this.x

    this.sprite.y = this.y

    }

    animate(state) {

    this.x += 5

    if (this.x > window.innerWidth) {

    this.x = 0

    }

    this.sprite.x = this.x

    this.sprite.y = this.y

    }

    }

    ```


    This is from [http://codepen.io/assertchris/pen/qaobAz](http://codepen.io/assertchris/pen/qaobAz).


    This is what JavaScript classes look like in ES2015 and beyond. The `Player` class
    has a constructor, which we use to store a reference to the sprite, and the initial
    `x` and `y` position.


    It also has an `animate` method, which we will call many times a second. We can
    use the method to figure out if the player needs to change position or do something
    else. In this case, we increment the sprite `x` position a bit. If the player/sprite
    moves off the right-hand side of the screen, we move it back to the left-hand
    side of the screen.


    We also have to change how we create the sprite:


    ```

    const player = new Player(

    sprite,

    window.innerWidth / 2,

    window.innerHeight / 2,

    )

    stage.addChild(sprite)

    let state = {

    "renderer": renderer,

    "stage": stage,

    }

    const animate = function() {

    requestAnimationFrame(animate)

    player.animate(state)

    renderer.render(stage)

    }

    ```


    This is from [http://codepen.io/assertchris/pen/qaobAz](http://codepen.io/assertchris/pen/qaobAz).


    Now we’re beginning to see the loop in our game. As you can see in Figure [2-3](#A435434_1_En_2_Chapter.html#Fig3),
    many times a second, we’re telling our player to animate. The player takes into
    account some internal logic and adjusts its sprite. The renderer renders the output,
    and what we see is a smooth animation.


    ![A435434_1_En_2_Fig3_HTML.jpg](A435434_1_En_2_Fig3_HTML.jpg)


    Figure 2-3. Moving sprites


    The only thing we’re lacking here is input, but we’ll get to that soon…


    ## Summary


    In this chapter, we managed to set up a game environment (using CodePen). We were
    briefly introduced to PixiJS and saw how to render our player’s sprite on the
    screen.


    We also animated the player’s sprite and learned how to use the `requestAnimationFrame`
    function.


    Take a moment to look for sprite graphics for your game. Fork the CodePen, and
    customize it a little. It’s important that you get a feel for creating sprites
    and manipulating them. This is the start of your game!


    # Player Input


    What’s the difference between a movie and a game? Player input! In fact, it’s
    such a critical piece of game design that games are often defined by how they
    take player input.


    Racing games rely on constant, subtle input. If you lift your fingers from the
    keyboard, or lift your foot off the pedal, you lose momentum. If you don’t enter
    the right combination of keys, your flight simulation will crash.


    Platform games, like the one we’re building, need input from both hands. Often
    the right-hand side of the keyboard is for movement. Often the left-hand side
    of the keyboard is for player actions, like shooting or opening doors.


    Perhaps you want to design a platform game like Terraria ([https://terraria.org](https://terraria.org)),
    which uses the mouse for player actions and projective aim. Perhaps you want to
    use WASD to move your player around the screen. Let’s get to work!


    ## Detecting input


    When I first tried detecting input, I tried to add event listeners to everything.
    I tried adding event listeners to the player and event listeners to the stage.
    Aaaand things got out of hand.


    The trick is to detect events at the highest level and save details of them to
    a game state object. Last time we created this kind of state object and passed
    it to the player’s `animate` method. Let’s expand on that state:


    ```

    let state = {

    "renderer": renderer,

    "stage": stage,

    "keys": {},

    "clicks": {},

    "mouse": {},

    }

    window.addEventListener("keydown", function(event) {

    state.keys[event.keyCode] = true

    })

    window.addEventListener("keyup", function(event) {

    state.keys[event.keyCode] = false

    })

    window.addEventListener("mousedown", function(event) {

    state.clicks[event.which] = {

    "clientX": event.clientX,

    "clientY": event.clientY,

    }

    })

    window.addEventListener("mouseup", function(event) {

    state.clicks[event.which] = false

    })

    window.addEventListener("mousemove", function(event) {

    state.mouse.clientX = event.clientX

    state.mouse.clientY = event.clientY

    })

    ```


    This is from [http://codepen.io/assertchris/pen/rrdZYB](http://codepen.io/assertchris/pen/rrdZYB).


    We began by adding the renderer and state to the game state object. Now we’ve
    added `keys`, `clicks`, and `mouse` properties, which track buttons and movement.


    Note


    For this next part, I had to adjust the CSS of `index.html` so that the canvas
    is absolutely positioned. This made it possible to track the mouse movement more
    accurately. Check out the source code to see the change.


    As we add more objects to the game, we’ll pass the game state object to each of
    them. They can use it to work out what they should do when the player interacts
    with the game. Let’s remove the current player movement and add input-driven movement:


    ```

    animate(state) {

    if (state.keys[37]) { // left

    this.x = Math.max(

    0, this.x - 5

    )

    }

    if (state.keys[39]) { // right

    this.x = Math.min(

    window.innerWidth - 64, this.x + 5

    )

    }

    if (state.clicks[1]) { // left click

    this.x = state.clicks[1].clientX

    }

    this.sprite.x = this.x

    this.sprite.y = this.y

    }

    ```


    This is from [http://codepen.io/assertchris/pen/rrdZYB](http://codepen.io/assertchris/pen/rrdZYB).


    Little actually changes in the `animate` method. We check for two arrow keys and
    move if the player pressed one of them. We also check if the player has clicked
    and immediately move if so.


    Tip


    Pay no attention to the `Math` functions and magic number `64`. These are just
    there to prevent the player sprite from going offscreen. We’ll remove these things
    when we start building walls….


    ![A435434_1_En_3_Fig1_HTML.jpg](A435434_1_En_3_Fig1_HTML.jpg)


    Figure 3-1. Player input'
