- fmt: '# 11. Health


    I''ve played very few games where the first mistake leads to instant failure.
    Usually, there''s quite a lead-up to the final moment of failure. Sonic ( [`https://en.wikipedia.org/wiki/Sonic_the_Hedgehog`](https://en.wikipedia.org/wiki/Sonic_the_Hedgehog)
    ) loses his rings, Mario loses his powers.


    The goal of this chapter is for us to implement a health system so that the player
    has a chance to make mistakes and learn from them.


    ## Taking damage


    There is only one way the player can fail (in our game, so far): jumping off the
    edge of the level. That''s not a realistic failure condition, however, because
    well-constructed levels will be built up in such a way that the player can never
    reach outside the bounds of the level.


    Before we can work out the details of loss of health, we need to introduce another
    mechanism to cause the health loss. Here, we''re going to introduce a mechanic
    that causes us to lose health (and momentarily lose control) when we come into
    contact with a slime.


    To start with, we''re going to have to introduce more collision detection logic
    in `Player.animate` :


    ```

    if (object.constructor.name === "Blob" && !this.invulnerable) {

    if (this.velocityX >= 0) {

    this.velocityX = -10

    } else {

    this.velocityX = 10

    }

    this.velocityY *= -1

    this.invulnerable = true

    this.sprite.alpha = 0.5

    setTimeout(() => {

    this.invulnerable = false

    this.sprite.alpha = 1

    }, 2000)

    if (typeof this.onHurt === "function") {

    this.onHurt.apply(this)

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/qaoyPo`](http://codepen.io/assertchris/pen/qaoyPo)
    .


    We previously added collision detection, specific to the `Blob`, to `Bullet.animate`.
    Now, we''re adding it to `Player.animate` so that the player will "take damage"
    when they come into contact with a `Blob`.


    **Note:** I''ve hard-coded a lot of things here and previously. You are free to
    abstract the hard-coded values out, but I''ve opted not to do that in every instance
    to save time and to keep things simple. For instance, you could remove the `alpha`
    logic entirely and provide the constructor with the `invulnerable` duration.


    Now when the player and the blob connect, the player is thrown up and backward
    from the blob. The player also enters an invulnerable state, which means they
    won''t lose all health within `2000` milliseconds. Now that we have a way to hurt
    the player, let''s do something about it.


    ## Showing health


    Notice that bit about `onHurt`? I didn''t want to hard-code the interface changes
    that will display the player''s current health. By invoking a user-provided function,
    we can outsource that behavior to the code that creates the player.


    It''s tempting to try and fit everything into the PixiJS model, but we''re coding
    in a web environment. Instead of rendering the player''s health through our PixiJS
    renderer and scene, we''re going to display the health bar using HTML and CSS.
    And, since we have a way to tie the internal damage behavior to the external environment
    (through `onHurt`), this shouldn''t be too difficult.


    Let''s create the HTML elements required:


    ```

    click to focus


    .camera, .hud, .focus-target {

    width: 100%;

    height: 100%;

    position: absolute;

    top: 0;

    left: 0;

    }

    .hud {

    .heart {

    width: 32px;

    height: 28px;

    background-image: url("path/to/sprites/heart-red.png");

    position: absolute;

    top: 15px;

    }

    .heart-1 {

    left: 15px;

    }

    .heart-2 {

    left: 57px;

    }

    .heart-3 {

    left: 99px;

    }

    .heart-grey {

    background-image: url("path/to/sprites/heart-grey.png");

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/qaoyPo`](http://codepen.io/assertchris/pen/qaoyPo)
    .


    This mark-up adds three red hearts to the top left of the screen. We''re going
    to turn each gray as the player gets hurt:


    ```

    let hearts = 3

    player.onHurt = function() {

    document.querySelector(".heart-" + hearts)

    .className += " heart-grey"

    hearts--

    if (hearts < 1) {

    alert("game over!")

    game.removeObject(player)

    game.removeObject(crosshair)

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/qaoyPo`](http://codepen.io/assertchris/pen/qaoyPo)
    .


    This is a lot simpler than I expected at first. Each time the `onHurt` function
    is invoked, we fetch the element related to the number of hearts we have left,
    and turn it gray as shown in Figure [11-1](#A435434_1_En_11_Chapter.html#Fig1)
    (thanks to that `.heart-grey` class we added earlier).


    ![A435434_1_En_11_Fig1_HTML.jpg](A435434_1_En_11_Fig1_HTML.jpg)


    **Figure 11-1.** Taking damage


    If the player has used up their last heart, we pop up an alert (though this would
    probably be better as a stylized "game over" message), and remove the player and
    crosshair from the game.


    ## Summary


    In this chapter, we added the first legitimate way for players to fail. Now that
    there''s some danger, the experience should be more enjoyable.


    We also create a way to tie internal events (like the player getting hurt) with
    external behavior. You don''t have to kill the player off when they get hurt.
    You could try teleporting them back to the start of the level or reducing their
    abilities. The choice is yours.


    # 12. Animation


    We''re nearing the end of our brief but enjoyable journey. It''s time to start
    adding some finishing touches. For instance, our sprites are too stoic. Let''s
    animate them!


    ## Animating the player


    The player sprite is one of the first and most important parts of the entire game.
    We could spend ages staring at the little critter, and it would be very boring
    if we didn''t add a bit of animation.


    Fortunately, PixiJS provides a few tools, to make this process easier. Let''s
    start using one of them:


    ```

    const playerIdleLeftImages = [

    "path/to/sprites/player-idle-1.png",

    "path/to/sprites/player-idle-2.png",

    "path/to/sprites/player-idle-3.png",

    "path/to/sprites/player-idle-4.png",

    ]

    const playerIdleLeftTextures =

    playerIdleLeftImages.map(function(image) {

    return PIXI.Texture.fromImage(image)

    })

    const playerIdleLeftSprite =

    new PIXI.MovieClip(playerIdleLeftTextures)

    playerIdleLeftSprite.play()

    playerIdleLeftSprite.animationSpeed = 0.12

    const player = new Player(

    playerIdleLeftSprite,

    new PIXI.Rectangle(

    Math.round(width / 2),

    Math.round(height / 2),

    48,

    56,

    ),

    )

    player.idleLeftSprite = playerIdleLeftSprite

    ```


    This is from [`http://codepen.io/assertchris/pen/ALyPGw`](http://codepen.io/assertchris/pen/ALyPGw)
    .


    We''ve replaced the `new PIXI.Sprite.fromImage` with `new PIXI.MovieClip`. We
    started by creating an array of images (which any good sprite pack should have)
    and creating new `PIXI.Texture` objects for each.


    We need to call `play` for the animation to start, and adjusting the animation
    speed can''t hurt. We''ll see why it''s a good idea to store a reference to the
    animation, shortly.


    **Tip:** No static image can do this animation justice. Check out the CodePen
    to see it move!'
