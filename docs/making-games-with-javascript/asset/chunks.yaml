  trans: '

    # 11. 生命值


    我玩过的游戏中，很少有因第一个失误就立即失败的。通常，最终失败前会有一段很长的铺垫。索尼克（ [`https://en.wikipedia.org/wiki/Sonic_the_Hedgehog`](https://en.wikipedia.org/wiki/Sonic_the_Hedgehog)
    ）会失去他的金环，马里奥会失去他的能力。


    本章的目标是让我们实现一个生命值系统，让玩家有机会犯错并从中学习。


    ## 承受伤害


    （到目前为止，在我们的游戏中）玩家只有一种方式会失败：从关卡边缘跳下。然而，这并非一个真实的失败条件，因为精心设计的关卡会通过布局确保玩家永远无法到达关卡边界之外。


    在制定生命值损失的细节之前，我们需要引入另一种机制来触发生命值损失。在这里，我们将引入一种机制：当玩家与史莱姆接触时，会损失生命值（并短暂失去控制）。


    首先，我们需要在 `Player.animate` 中增加更多的碰撞检测逻辑：


    ```

    if (object.constructor.name === "Blob" && !this.invulnerable) {

    if (this.velocityX >= 0) {

    this.velocityX = -10

    } else {

    this.velocityX = 10

    }

    this.velocityY *= -1

    this.invulnerable = true

    this.sprite.alpha = 0.5

    setTimeout(() => {

    this.invulnerable = false

    this.sprite.alpha = 1

    }, 2000)

    if (typeof this.onHurt === "function") {

    this.onHurt.apply(this)

    }

    }

    ```


    这段代码来自 [`http://codepen.io/assertchris/pen/qaoyPo`](http://codepen.io/assertchris/pen/qaoyPo)
    。


    之前，我们在 `Bullet.animate` 中添加了针对 `Blob` 的碰撞检测。现在，我们将其添加到 `Player.animate`，这样当玩家与
    `Blob` 接触时就会“受到伤害”。


    **注意：** 我在这里及之前硬编码了很多东西。你可以自由地将硬编码的值抽象出来，但我选择不在每个实例中都这样做，以节省时间并保持简单。例如，你可以完全移除
    `alpha` 逻辑，并通过构造函数提供 `invulnerable` 的持续时间。


    现在，当玩家与史莱姆碰撞时，玩家会被向后上方弹开。玩家还会进入无敌状态，这意味着在 `2000` 毫秒内不会损失所有生命值。既然我们有了伤害玩家的方法，接下来就该处理它了。


    ## 显示生命值


    注意到 `onHurt` 那段代码了吗？我不想将显示玩家当前生命值的界面更改硬编码。通过调用用户提供的函数，我们可以将该行为外包给创建玩家的代码。


    虽然试图将所有内容都塞进 PixiJS 模型很诱人，但我们是在 Web 环境中编码。我们不通过 PixiJS 渲染器和场景来渲染玩家的生命值，而是使用 HTML
    和 CSS 来显示生命条。而且，由于我们有办法通过 `onHurt` 将内部伤害行为与外部环境联系起来，这应该不会太难。


    让我们创建所需的 HTML 元素：


    ```

    click to focus


    .camera, .hud, .focus-target {

    width: 100%;

    height: 100%;

    position: absolute;

    top: 0;

    left: 0;

    }

    .hud {

    .heart {

    width: 32px;

    height: 28px;

    background-image: url("path/to/sprites/heart-red.png");

    position: absolute;

    top: 15px;

    }

    .heart-1 {

    left: 15px;

    }

    .heart-2 {

    left: 57px;

    }

    .heart-3 {

    left: 99px;

    }

    .heart-grey {

    background-image: url("path/to/sprites/heart-grey.png");

    }

    }

    ```


    这段代码来自 [`http://codepen.io/assertchris/pen/qaoyPo`](http://codepen.io/assertchris/pen/qaoyPo)
    。


    这个标记在屏幕左上角添加了三颗红心。当玩家受伤时，我们将它们逐一变为灰色：


    ```

    let hearts = 3

    player.onHurt = function() {

    document.querySelector(".heart-" + hearts)

    .className += " heart-grey"

    hearts--

    if (hearts < 1) {

    alert("game over!")

    game.removeObject(player)

    game.removeObject(crosshair)

    }

    }

    ```


    这段代码来自 [`http://codepen.io/assertchris/pen/qaoyPo`](http://codepen.io/assertchris/pen/qaoyPo)
    。


    这比我最初预想的要简单得多。每次调用 `onHurt` 函数时，我们都会获取与剩余心数对应的元素，并将其变为灰色，如图 11-1 所示（这要归功于我们之前添加的
    `.heart-grey` 类）。


    ![A435434_1_En_11_Fig1_HTML.jpg](img/A435434_1_En_11_Fig1_HTML.jpg)


    **图 11-1.** 承受伤害


    如果玩家用完了最后一颗心，我们会弹出一个警告（尽管将其设计成样式化的“游戏结束”消息可能会更好），并从游戏中移除玩家和准星。


    ## 本章小结


    在本章中，我们添加了第一种合理的玩家失败方式。既然存在了危险，游戏体验应该会更加有趣。


    我们还创建了一种将内部事件（如玩家受伤）与外部行为联系起来的方法。你不必在玩家受伤时就将其淘汰。你可以尝试将他们传送回关卡起点，或降低他们的能力。选择权在你手中。


    # 12. 动画


    我们短暂而愉快的旅程即将结束。是时候添加一些收尾工作了。例如，我们的精灵太呆板了。让我们为它们添加动画吧！


    ## 为玩家添加动画


    玩家精灵是整个游戏中最早也是最重要的部分之一。我们可以花很多时间盯着这个小家伙，如果不添加一点动画，那将非常无聊。


    幸运的是，PixiJS 提供了一些工具来简化这个过程。让我们开始使用其中一个：


    ```

    const playerIdleLeftImages = [

    "path/to/sprites/player-idle-1.png",

    "path/to/sprites/player-idle-2.png",

    "path/to/sprites/player-idle-3.png",

    "path/to/sprites/player-idle-4.png",

    ]

    const playerIdleLeftTextures =

    playerIdleLeftImages.map(function(image) {

    return PIXI.Texture.fromImage(image)

    })

    const playerIdleLeftSprite =

    new PIXI.MovieClip(playerIdleLeftTextures)

    playerIdleLeftSprite.play()

    playerIdleLeftSprite.animationSpeed = 0.12

    const player = new Player(

    playerIdleLeftSprite,

    new PIXI.Rectangle(

    Math.round(width / 2),

    Math.round(height / 2),

    48,

    56,

    ),

    )

    player.idleLeftSprite = playerIdleLeftSprite

    ```


    这段代码来自 [`http://codepen.io/assertchris/pen/ALyPGw`](http://codepen.io/assertchris/pen/ALyPGw)
    。


    我们用 `new PIXI.MovieClip` 替换了 `new PIXI.Sprite.fromImage`。我们首先创建了一个图像数组（任何好的精灵包都应该包含这些），并为每个图像创建了新的
    `PIXI.Texture` 对象。


    我们需要调用 `play` 来启动动画，调整动画速度也无妨。我们很快就会明白为什么存储对动画的引用是个好主意。


    **提示：** 没有静态图像能完美展现这个动画。请查看 CodePen 来观看它的运动效果！

    '
- fmt: '# Swapping animations


    We can animate more than just how the player looks standing still. For instance,
    we can add animation for walking, jumping, and even for getting hurt. Let’s begin
    by adding the running animation. Together, the animation initialization code looks
    like this:


    ```

    const playerIdleLeftImages = [

    "path/to/sprites/player-idle-1.png",

    "path/to/sprites/player-idle-2.png",

    "path/to/sprites/player-idle-3.png",

    "path/to/sprites/player-idle-4.png",

    ]

    const playerIdleLeftTextures =

    playerIdleLeftImages.map(function(image) {

    return PIXI.Texture.fromImage(image)

    })

    const playerIdleLeftSprite = new PIXI.MovieClip(playerIdleLeftTextures)

    playerIdleLeftSprite.play()

    playerIdleLeftSprite.animationSpeed = 0.12

    const playerRunLeftImages = [

    "path/to/sprites/player-run-1.png",

    "path/to/sprites/player-run-2.png",

    "path/to/sprites/player-run-3.png",

    "path/to/sprites/player-run-4.png",

    "path/to/sprites/player-run-5.png",

    "path/to/sprites/player-run-6.png",

    "path/to/sprites/player-run-7.png",

    "path/to/sprites/player-run-8.png",

    "path/to/sprites/player-run-9.png",

    "path/to/sprites/player-run-10.png",

    ]

    const playerRunLeftTextures =

    playerRunLeftImages.map(function(image) {

    return PIXI.Texture.fromImage(image)

    })

    const playerRunLeftSprite = new PIXI.MovieClip(playerRunLeftTextures)

    playerRunLeftSprite.play()

    playerRunLeftSprite.animationSpeed = 0.2

    const player = new Player(

    playerIdleLeftSprite,

    new PIXI.Rectangle(

    Math.round(width / 2),

    Math.round(height / 2),

    48,

    56,

    ),

    )

    player.idleLeftSprite = playerIdleLeftSprite

    player.runLeftSprite = playerRunLeftSprite

    game.addObject(player)

    game.player = player

    ```


    This is from [`http://codepen.io/assertchris/pen/ALyPGw`](http://codepen.io/assertchris/pen/ALyPGw).


    Adding animation is really fun, but it can also be pretty tedious. We need to
    crop and export each frame of each action. Then we need to stitch them all together
    in many image arrays and animated sprites.


    It’s good to assign a reference to each animated sprite to `player`. That way,
    we can swap them inside `Player.animate`:


    ```

    this.rectangle.x += this.velocityX

    if (!this.isOnLadder && !this.isOnSlope) {

    this.rectangle.y += this.velocityY

    }

    if (this.isOnGround && Math.abs(this.velocityX)  0.5) {

    state.game.stage.removeChild(this.sprite)

    state.game.stage.addChild(this.runLeftSprite)

    this.sprite = this.runLeftSprite

    }

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    ```


    This is from [`http://codepen.io/assertchris/pen/ALyPGw`](http://codepen.io/assertchris/pen/ALyPGw).


    At the end of the `animate` method, we can check if the player is still moving
    (much). If not, we swap whatever sprite is presently visible with the idle animation.


    If the player is still moving, we swap the visible sprite for the run animation.
    This logic only works in a single direction, but we can extrapolate the behavior
    to encompass a broad range of animations and directions.


    ## Summary


    In this chapter, we added a bit of animation (not the patrolling mob kind) to
    the game. We could spend hours watching the player’s hair bob up and down.


    There are many different kinds of animation we could add:


    *   Jumping and/or falling

    *   Getting hurt

    *   Landing (with a puff of dust)

    *   Climbing ladders

    *   Shooting a projectile (holding a weapon)


    We’ve added just two, but there are tons more you could add. The key to these
    is finding (or designing) a good sprite pack; and stitching everything together
    nicely. If you can do that, you can make a beautifully animated game!


    # 13. Sounds


    Some of my fondest gaming memories are of the music and sounds I listened to as
    I played my favorite games. Whether it is the music of Bastion and Fez or the
    sounds of Stardew, our ears help us fully appreciate the game.


    ## Adding background music


    There’s nothing like a good soundtrack to immerse you in a game. The best games
    swap background music based on the player’s mood and location. We’re going to
    start with something simpler than that:


    ```

    game.addEventListenerTo(window)

    game.addRendererTo(document.querySelector(".camera"))

    game.animate()

    const music = new Audio("path/to/sounds/background.mp3")

    music.loop = true

    music.play()

    ```


    Before you click this link, turn your volume down – it plays music.


    This is from [`http://codepen.io/assertchris/pen/wzmQWb`](http://codepen.io/assertchris/pen/wzmQWb).


    It’s actually pretty easy to play sounds in modern browsers. A quick search for
    a looping MP3 and this new `Audio` object are just about all we need. We do, however,
    need to set the `loop` property to `true` if we want the background music track
    to loop.


    **Note:** There’s no easy way to make `Audio` objects loop without the possibility
    of having a gap in between. You may want to consider an alternative solution,
    like SoundManager2 ([https://github.com/scottschiller/SoundManager2](https://github.com/scottschiller/SoundManager2)).


    ## Adding action and event sounds


    Adding game sound effects (for events and action initiated by the player), requires
    that we jump into where the actions and events happen:


    ```

    element.addEventListener("keydown", (event) => {

    this.state.keys[event.keyCode] = true

    if (event.keyCode === 32) {

    new Audio("path/to/sounds/jump.wav").play()

    }

    })

    ```


    This is from [`http://codepen.io/assertchris/pen/wzmQWb`](http://codepen.io/assertchris/pen/wzmQWb).


    The first time we try to jump, the sound effect seems to take a moment to load
    before playing. We could solve this by preloading all sounds before the player
    can start to move.


    In fact, it’s generally good practice to preload all game assets (like fonts,
    images, and sounds) before the game begins. In the case of sounds, we only need
    to add the following code, before the game starts to preload it:


    ```

    new Audio("path/to/sounds/jump.wav").load()

    ```


    This will start the loading process, and the sound file should be loaded by the
    time it is used (as long as the Internet connection is fast enough). There are
    other ways to ensure all sound files are loaded, but they complicate the process
    quite a bit. It’s a topic for another time, I think…


    ## Summary


    In this chapter, we took a brief look at how to embed background music and action/event
    sounds into our game. Modern browsers provide good tools for this, but we can
    always fall back to libraries like SoundManager2 if we need to support older browsers
    or if we need greater control over playback.


    Buying many sounds, music files, and sprites (or sprite packs) can be expensive.
    You may want to involve graphic and sound artists in the process of making a game
    instead.


    # 14. Gamepads


    We’re almost done now. Before we part ways, I thought it would be fun to experiment
    with gamepads. They’re only supported via JavaScript in a few browsers, but they
    sure are fun to use!'
