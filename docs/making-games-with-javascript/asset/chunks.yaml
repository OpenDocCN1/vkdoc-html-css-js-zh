    This is from [`http://codepen.io/assertchris/pen/ALyXKq`](http://codepen.io/assertchris/pen/ALyXKq).


    Here, we’ve added a floor as wide as the whole scene. I’ve used a tiling texture
    and `new PIXI.extras.TilingSprite.fromImage` to render it on in the scene. I’ve
    also moved the two crates to block the player from running off the edge of the
    floor. They collide in the same way as before. Now, let’s see about adding that
    gravity:


    ```

    class Player {

    constructor(sprite, rectangle) {

    this.sprite = sprite

    this.rectangle = rectangle

    this.velocityX = 0

    this.maximumVelocityX = 8

    this.accelerationX = 2

    this.frictionX = 0.9

    this.velocityY = 0

    this.maximumVelocityY = 30

    this.accelerationY = 3

    this.jumpVelocity = -30

    this.isOnGround = false

    }

    animate(state) {

    if (state.keys[37]) { // left

    this.velocityX = Math.max(

    this.velocityX - this.accelerationX,

    this.maximumVelocityX * -1,

    )

    }

    if (state.keys[39]) { // right

    this.velocityX = Math.min(

    this.velocityX + this.accelerationX,

    this.maximumVelocityX,

    )

    }

    this.velocityX *= this.frictionX

    this.velocityY = Math.min(

    this.velocityY + this.accelerationY,

    this.maximumVelocityY,

    )

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    var me = this.rectangle

    var you = object.rectangle

    if (me.x  you.x &&

    me.y  you.y) {

    if (this.velocityY > 0 && you.y >= me.y) {

    this.velocityY = 0

    return

    }

    if (this.velocityY  0 && you.x >= me.x) {

    this.velocityX = 0

    return

    }

    }

    })

    this.rectangle.x += this.velocityX

    this.rectangle.y += this.velocityY

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/ALyXKq`](http://codepen.io/assertchris/pen/ALyXKq).


    We begin by creating a set of properties to match the ones we made to track horizontal
    movement. We don’t need vertical friction since that level of detail is often
    omitted from platform games.


    We also have to track vertical and horizontal collisions. When the collision is
    with the player and a platform/floor, then we stop the downward velocity. When
    it’s against a ceiling, we replace upward velocity with the force of gravity.


    ## Allowing players to jump


    Jumping is simply reversing gravity for a short time:


    ```

    animate(state) {

    if (state.keys[37]) { // left

    this.velocityX = Math.max(

    this.velocityX - this.accelerationX,

    this.maximumVelocityX * -1,

    )

    }

    if (state.keys[39]) { // right

    this.velocityX = Math.min(

    this.velocityX + this.accelerationX,

    this.maximumVelocityX,

    )

    }

    this.velocityX *= this.frictionX

    this.velocityY = Math.min(

    this.velocityY + this.accelerationY,

    this.maximumVelocityY,

    )

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    var me = this.rectangle

    var you = object.rectangle

    // ...snip

    if (state.keys[32] && this.isOnGround) {

    this.velocityY = this.jumpVelocity

    this.isOnGround = false

    }

    this.rectangle.x += this.velocityX

    this.rectangle.y += this.velocityY

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    ```


    This is from [`http://codepen.io/assertchris/pen/ALyXKq`](http://codepen.io/assertchris/pen/ALyXKq).


    With this code, we’ve mapped the space key to jump. We add the keyboard check
    after the collision check because we only want our player to jump if they are
    standing on a platform or floor.


    ![A435434_1_En_5_Fig1_HTML.jpg](A435434_1_En_5_Fig1_HTML.jpg)


    **Figure 5-1.** Adding gravity


    Now it''s possible to create levels out of boxes, to give some of them visible
    textures, and to jump around them. Spend some time making a level and jumping
    around in it!


    ## Summary


    In this chapter, we cleaned up the game code. Each part is now self-contained—from
    the box to the player to the game itself. That will make it easier for the individual
    game objects to manage themselves.


    We also created a floor and basic walls (out of crates) so that the player won’t
    fall out of the world. Finally, we added the ability for the player to jump. It’s
    now possible to construct a traversable level!


    # 6. Ladders


    It would be pretty limiting if players could only move upward by jumping through
    gaps, or by jumping on boxes. Those aren’t the only options, though. We still
    have to learn about elevators, stairs, and ladders. Let’s start by building a
    ladder!


    ## Creating our first ladder


    Let’s begin our ladder by copying the `Box` class:


    ```

    class Ladder {

    constructor(sprite, rectangle) {

    this.sprite = sprite

    this.rectangle = rectangle

    }

    animate(state) {

    this.sprite.x = this.rectangle.x

    this.sprite.y = this.rectangle.y

    }

    }

    // ...later

    game.addObject(

    new Box(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/platform.png",

    ),

    new PIXI.Rectangle(

    window.innerWidth - 400,

    window.innerHeight - 64 - 200,

    256,

    64,

    ),

    ),

    )

    game.addObject(

    new Ladder(

    new PIXI.extras.TilingSprite.fromImage(

    "path/to/sprites/ladder.png",

    44,

    200,

    ),

    new PIXI.Rectangle(

    window.innerWidth - 250,

    window.innerHeight - 64 - 200,

    44,

    200,

    ),

    ),

    )

    ```


    This is from [`http://codepen.io/assertchris/pen/jrzrPw`](http://codepen.io/assertchris/pen/jrzrPw).


    You’ll need to make `ladder.png` and `platform.png` images. Be sure to add these
    to the game before adding the player, or the ladder sprites will be in front of
    the player sprite.


    You’ll notice that the player bumps into the ladder as if it were a box. We’ll
    need to add a few getters to our boxes and ladders so that the collision detection
    can decide whether they still collide with each other:


    ```

    state.objects.forEach((object) => {

    if (object === this) {

    return

    }

    const me = this.rectangle

    const you = object.rectangle

    const collides = object.collides

    if (me.x  you.x &&

    me.y  you.y) {

    if (collides && this.velocityY > 0 && you.y >= me.y) {

    this.isOnGround = true

    this.velocityY = 0

    return

    }

    if (collides && this.velocityY  0 && you.x >= me.x) {

    this.velocityX = 0

    return

    }

    }

    })

    ```


    This is from [`http://codepen.io/assertchris/pen/jrzrPw`](http://codepen.io/assertchris/pen/jrzrPw).


    We give `Box` and `Ladder` a `collides` property so that `Player.animate` can
    ignore collisions with objects that players shouldn’t collide with. If we were
    going to allow multiple players in the same game/level, then we would also add
    a `collides` property to `Player`. That is, unless we wanted multiple players
    to collide with each other.


    ![A435434_1_En_6_Fig1_HTML.jpg](A435434_1_En_6_Fig1_HTML.jpg)


    **Figure 6-1.** Platforms and ladders'
