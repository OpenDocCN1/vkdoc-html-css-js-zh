    0 + 32,

    window.innerHeight - 44 - 64,

    44,

    44,

    ),

    ),

    )

    game.addObject(

    new Box(

    new PIXI.Sprite.fromImage(

    "path/to/sprites/box.png",

    ),

    new PIXI.Rectangle(

    window.innerWidth - 32 - 44,

    window.innerHeight - 44 - 64,

    44,

    44,

