  \n**图 4-1.** 玩家与方块\n\n## 总结\n\n本章我们探讨了几种可用于检测玩家精灵与游戏中其他各种对象之间碰撞的方法。\n\n花点时间重新排列方块和圆形，这样你就能初步感受你的第一个游戏关卡可能是什么样子了。\n\
