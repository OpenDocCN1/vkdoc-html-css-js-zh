  我们为 `Box` 和 `Ladder` 赋予了 `collides` 属性，以便 `Player.animate` 可以忽略与玩家不应碰撞的对象的碰撞。如果我们要允许同一个游戏/关卡中存在多个玩家，那么我们也需要为
