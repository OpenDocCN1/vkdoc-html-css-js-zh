  ## 本章小结


  在本章中，我们添加了第一种合理的玩家失败方式。既然存在了危险，游戏体验应该会更加有趣。


  我们还创建了一种将内部事件（如玩家受伤）与外部行为联系起来的方法。你不必在玩家受伤时就将其淘汰。你可以尝试将他们传送回关卡起点，或降低他们的能力。选择权在你手中。


