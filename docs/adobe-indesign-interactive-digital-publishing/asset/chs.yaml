- '# 12.10 营销 EPUB


  如果你想销售 EPUB，你需要一个在线托管商。最受欢迎的托管商是面向 Kindle 电子阅读器的亚马逊和面向 iOS 设备的苹果。为了覆盖最广泛的潜在买家，你需要同时考虑这两个内容托管商。


  在你采取任何行动之前，甚至在创建 EPUB 之前，你都需要彻底审查提供商对其销售图书的要求。你需要了解 EPUB 中可以包含什么、不能包含什么、特定的格式规则以及一长串其他要求。


  ## 12.10.1 通过亚马逊分发


  像亚马逊和苹果这样的大型内容提供商要求你遵循其出版指南中规定的标准。对于亚马逊，你可以通过 [`www.kdp.amazon.com`](http://www.kdp.amazon.com)
  查找出版指南和帮助信息。


  你必须创建一个亚马逊账户。如果你已有用于购物的账户，可以使用相同的登录名和密码。如果你没有账户，则需要注册一个新账户。如果你想将现有账户与用于出版的账户分开，可以创建第二个账户。


  遗憾的是，KDP 网页上没有指向 KF8 网页的链接。要查看有关 KF8 格式的指南和帮助信息，请访问 [`http://www.amazon.com/gp/feature.html?docId=1000729511`](http://www.amazon.com/gp/feature.html?docId=1000729511)，或者直接在谷歌搜索窗口中输入“KF8”。在谷歌中看到的第一个链接是指向
  KF8 格式页面的链接，如图 12-40 所示。


  ![A432409_1_En_12_Fig40_HTML.jpg](img/A432409_1_En_12_Fig40_HTML.jpg)


  图 12-40.


  Kindle KF8 网页


  在该网页的右侧，你会找到许多帮助页面的链接。其中有一个是“Kindle 出版指南”的链接。点击该链接，会打开一个 PDF 文档。该文档有 91 页，包含了大量关于亚马逊为
  Kindle 设备制作图书所制定的标准和要求的信息。在为在 `Amazon.com` 上分发而创建 EPUB 之前，请务必彻底审阅该文档。


  请注意，在 KF8 网页上，你会看到一个 Adobe InDesign 插件的链接。不必费心下载这个插件。它一直处于测试阶段，并且只支持到 InDesign CS6。它不支持
  InDesign CC。


  要通过亚马逊分发图书，你需要仔细查看 Kindle 直接出版网页上概述的步骤。在网页浏览器中输入“Kindle Direct Publishing”以搜索指向亚马逊网页的链接。你看到的第一个结果就是亚马逊详细介绍如何在
  `Amazon.com` 上上传和出版电子书信息的链接。




  ### 12.10.2 通过 Apple iTunes 发布


  Apple 也有发布指南，你需要遵守这些指南才能在 Apple iTunes 商店中托管书籍。同样，你需要在 `http://developer.apple.com`
  注册一个 Apple 账户。创建账户是免费的，你需要先创建账户，才能继续查找有关通过 iTunes 发布的信息。


  创建账户后，登录 `www.itunesconnect.apple.com`。点击 iTunes Connect 网页上的 `Resources and Help`（资源与帮助）按钮，即可找到指南和帮助信息。点击
  `iBooks Store Formatting Guidelines`（iBooks Store 格式指南）和 `iBooks Publisher User
  Guide`（iBooks 出版商用户指南）链接。在创建打算通过 Apple iTunes 分发的 EPUB 之前，请彻底审阅这些文档。在 Apple 的网站上，你可以找到格式化出版物并上传至
  Apple 所需的所有信息。


  首次登录 Apple 的 iTunes Connect 网页时，除了 `Resources and Help`（资源与帮助）按钮外，你还会看到 `My Books`（我的书籍）和
  `Sales and Trends`（销售与趋势）按钮。Apple 让你可以在 `Sales and Trends`（销售与趋势）网页上轻松跟踪出版物的销售情况，如图
  12-41 所示，在该网页的 `My Books`（我的书籍）页面上可以看到你的出版物列表。


  `![A432409_1_En_12_Fig41_HTML.jpg](img/A432409_1_En_12_Fig41_HTML.jpg)`


  图 12-41. 销售与趋势网页


  在每个书名下方，你可以看到下拉菜单，分别显示按国家/地区统计的、销售你书籍的商店数量，以及未销售你书籍的商店数量。我在 Apple 上发布的一本书显示有 51
  家商店在售，1 家商店未售。当我点击 `Not in 1 Store`（1 家商店未售）按钮时，下拉菜单显示该书在中国地区不可用。


  在 Apple iTunes 上发布书籍后，务必定期访问 iTunes Connect 网站。你可以查看销售进度以及按国家/地区统计的销售商店数量。


  ### 12.10.3 使用其他电子书经销商


  你可能希望将书籍分发到 Amazon 和 Apple 之外的其他渠道。一旦创建了有效的 EPUB，大部分工作就完成了。不同电子书经销商之间的差异可能包括：是否将封面作为单独文件包含、是否添加前言和/或致谢页、是否需要获取
  ISBN 编号或由托管方获取 ISBN 编号、段落样式是否需要 HTML 标签等。


  每家电子书经销商都在其网站上提供了帮助页面，说明你需要准备的内容以及如何上传文件。要探索其他电子书经销商，可以搜索 Kobo、Nook Press、Smashwords，或直接搜索电子书经销商以找到小型出版商列表。当你浏览不同网站时，请查找每家出版商要求的发布指南和标准。


  ## 12.11 总结


  本章全部关于可重排 EPUB。你学习了如何创建可重排 EPUB、正确创建 EPUB 的一些最佳实践、如何打开 EPUB 归档并查看其内容，以及从 InDesign
  导出到可重排 EPUB 格式时的各种注意事项。


  你还了解了向可重排 EPUB 添加交互性的局限性，以及一些允许你添加交互性的变通方法。


  就交互式 EPUB 而言，可重排 EPUB 的限制非常大。当你向文档添加交互性并导出为固定版式 EPUB 时，束缚就解开了。在下一章中，你将学习创建固定版式 EPUB
  的所有优势。


  '
- "# 13. 创建固定版式 EPUB\n\n在第 12 章中，我讨论了可重排 EPUB。如果你阅读了该章，肯定知道创建可重排 EPUB 需要大量工作。你需要不断导出为\
  \ EPUB，检查结果，然后不可避免地返回 InDesign 对出版物进行更正和修改。之后必须再次导出并检查结果。在计算机屏幕上看到的版面和设计，往往与电子书阅读器中的显示效果不同。\n\
  \n固定版式 EPUB 则完全不同。固定版式 EPUB 与从 InDesign 导出的 PDF 文件非常相似。其版面和结构通常在最终导出时得以保留，并且你添加到文档中的所有交互性在固定版式\
  \ EPUB 中均得到支持。\n\n可重排 EPUB 自 InDesign CS 4 以来就已存在。固定版式 EPUB 相对较新。它是作为 InDesign CS\
  \ 6 中的导出选项引入的。作为一种较新的文件格式，你会发现电子书阅读器以及在设备上支持查看内容的工具存在一些局限性。不过，市场正在发展壮大；随着开发者们加紧提供对该格式的更多支持，我关于在设备上查看固定版式\
  \ EPUB 的讨论内容很可能会发生变化。\n\n\n\n## 13.1 理解可重排式与固定版式 EPUB 的差异\n\n在创建用于导出为固定版式 EPUB 的文档时，你会发现相较于处理可重排式\
  \ EPUB，既有许多优势，也有一些劣势。固定版式 EPUB 的优势包括以下几点：\n\n*   **易于创建**：在 InDesign 中创建文档时，几乎所有设计方面都能轻松地完整导出到固定版式\
  \ EPUB。你无需锚定对象；可以将文本置于图像之上，添加透明度，按你希望在最终版式中呈现的方式格式化文本和图形，并且 InDesign 在 99.9% 的情况下都能导出为有效的固定版式\
  \ EPUB。\n*   **保持设计完整性**：你在屏幕上看到的**所见即所得**视图会被捕捉到固定版式 EPUB 中。文本绕排、首字下沉、嵌套样式等都能精确呈现，与你导出的\
  \ PDF 文档中的效果完全一致。\n*   **开放标准**：PDF 基于 PostScript，其代码不可编辑；而固定版式 EPUB 是一种开放标准，其底层代码完全可访问，就像可重排式\
  \ EPUB 一样。\n*   **支持交互性**：你在 InDesign 文档中添加的所有交互功能，包括超链接和交叉引用、书签、多状态对象、动画、按钮和事件、音频以及视频，在固定版式\
  \ EPUB 中都得到支持。\n*   **创作自由**：在固定版式 EPUB 中，你可以获得与用于打印和导出为 PDF 的文件相同的创作自由。你可以随心所欲地设计文档，无需费力使用各种工具就能使最终结果在电子阅读器中按照你喜欢的方式呈现。\n\
  \n当然，当你选择一种格式而非另一种格式时，在获得每项优势的同时，也可能发现一些劣势。单一格式无法囊括其对应格式的所有特性。你会发现的固定版式 EPUB 的劣势包括以下几点：\n\
  \n*   **无法重排以适应小型设备**：页面尺寸可以适配智能手机等小型设备，但文本会与页面尺寸保持比例关系，无法像可重排式 EPUB 那样自由放大或缩小。\n\
  *   **支持查看固定版式 EPUB 的设备较少**：对于可重排式 EPUB，有大量可安装在平板电脑和手机上的电子阅读器应用支持查看 EPUB。然而，对于固定版式\
  \ EPUB，支持它们的应用则要少得多。（有关支持的设备列表，请参见第 12 章的“在设备上查看 EPUB”一节）。\n*   **字体必须嵌入**：某种程度而言，你可能会认为这是一个优势。然而，在计划分发的文档中嵌入字体，需要你研究是否可以合法地嵌入这些字体。你必须遵守字体供应商的许可协议，并彻底调查你在文档中包含某种字体的权利。对于可重排式\
  \ EPUB，你可以选择是否嵌入字体。固定版式 EPUB 则没有选择权，InDesign 会自动嵌入字体。（有关嵌入字体及其许可的更多信息，请参见本章后面的“使用字体”一节）。\n\
  *   **创建无障碍版式更具挑战性**：如果你想创建无障碍的固定版式 EPUB，你需要比创建可重排式 EPUB 做更多的工作。图像中的替代文本（Alt 标签）在固定版式\
  \ EPUB 中不起作用。你需要编辑 CSS 并修改设计，以便为不了解 CSS 的屏幕阅读器包含图像和对象的标题。\n*   **Kindle 不完全支持**：截至撰写本文时，你可以将固定版式\
  \ EPUB 转换为 Kindle KF8/MOBI 格式，但无法获得其他电子阅读器支持的所有交互功能。亚马逊正在不断更新其 KF8/MOBI 格式，因此最终你可能会看到这种变化，使\
  \ Kindle 设备获得更强的交互支持。\n\n### 13.1.1 剖析固定版式 EPUB 的结构\n\n正如我在第 12 章中提到的，你可以将 `.epub`\
  \ 文件转换为 `.zip` 文件，然后解压内容以访问 HTML 文件。对于固定版式 EPUB，你也可以这样做。在可重排式 EPUB 中，你可能有一个或多个 HTML\
  \ 文件，这些文件基于 InDesign 文档中的文章。而在固定版式 EPUB 中，每一页都是一个 HTML 文件。在图 13-1 中，你可以看到左侧来自可重排式\
  \ EPUB 的 HTML 文件，以及右侧来自固定版式 EPUB 的 HTML 文件。\n\n![A432409_1_En_13_Fig1_HTML.jpg](img/A432409_1_En_13_Fig1_HTML.jpg)\n\
  \n图 13-1.\n\nOEBPS 文件夹中可重排式 EPUB（左）和固定版式 EPUB（右）的 HTML 文件\n\n当你检查某个固定版式文件中的 HTML\
  \ 时，会看到文本带有异常多的标签。HTML 中的每个单词都用一个单独的类标签和绝对位置进行标记，如图 13-2 所示。\n\n![A432409_1_En_13_Fig2_HTML.jpg](img/A432409_1_En_13_Fig2_HTML.jpg)\n\
  \n图 13-2.\n\n固定版式 EPUB 中的每个单词都用一个单独的类标签和绝对位置进行标记\n\n当你查看固定版式 EPUB 的 HTML 时，你会注意到，实际上不可能为文档中的文本编写代码。你可以对\
  \ HTML 进行编辑，但 InDesign 在导出为固定版式方面近乎完美，你无需担心对 HTML 进行任何编辑。\n\n### 13.1.2 为特定体裁的书籍进行设计\n\
  \n当你在规划为某本书使用哪种格式时，可以考虑表 13-1 中列出的建议。该表列出了可能受益于固定版式 EPUB 的书籍，以及那些可能受益于创建可重排式 EPUB\
  \ 的书籍。在许多情况下，PDF 文件效果很好。然而，如果你选择 EPUB 格式，则应考虑最适合你所部署文档类型的格式。\n\n表 13-1.\n\n固定版式与可重排式\
  \ EPUB\n\n| 固定版式 EPUB | 可重排式 EPUB |\n| --- | --- |\n| 宣传册 | 散文 |\n| 儿童读物 | 小说 |\n\
  | 漫画书 | 诗集 |\n| 烹饪书 | 专业期刊/文章 |\n| 图像小说 | 参考书 |\n| 摄影集 | 大众图书 |\n| 旅行指南 | 用户手册 |\n\
  | 教程 | 白皮书 |\n| 教科书 |   |\n\n表 13-1 只是关于哪些类型的书籍可能更适合使用某一种 EPUB 格式的基本指导。你可能会发现某些书籍体裁存在重叠，例如无插图的教科书更适合可重排式\
  \ EPUB，可能包含动画的用户手册更适合固定版式，而带有插图和旁白的诗集则更适用于固定版式 EPUB。一般来说，如果你的文档包含大量图像和/或图形以及交互功能，你可能希望创建固定版式\
  \ EPUB。如果你的文档以文字为主，图形处理较少且没有交互功能，那么通常可重排式 EPUB 效果最好。\n\n## 13.2 设置图形格式\n\n像 Photoshop\
  \ 文件这样的光栅图像需要符合与设备阅读器一致的规范。与可重排式 EPUB 的情况一样，你应该查看内容托管网站以获取指南，尤其是在你的 EPUB 中使用照片时。\n\
  \n\n\n### 13.2.1 准备图像\n\n图像应仅保存为以下两种格式之一：`JPEG` 和 `PNG`。原则上，除非图像需要透明背景，否则优先使用 `JPEG`\
  \ 而非 `PNG`。`PNG` 文件在电子书阅读器设备上的渲染速度比 `JPEG` 文件更慢。\n\n关于图像的另一个考量是文件分辨率。像 Apple 这样的内容提供商要求图像大小不超过\
  \ 2M 像素。因此，在 Photoshop 中打开文件时，请查看标尺并将度量单位更改为像素（或点）。或者，你也可以选择“图像 ➤ 图像大小”来检查文件大小。你还可以在\
  \ Photoshop 的状态栏中查看文档大小。如果将 Photoshop 标尺上显示的水平值和垂直值相乘，即可得到照片的总像素数。如果该数值超过两百万像素，则需要对照片进行降采样或更改其物理尺寸。在图\
  \ [13-3] 中，你可以看到打开的 Photoshop 文档中可见的标尺，当水平值与垂直值相乘时，图像像素数超过了 200 万。另请注意，文档大小报告了水平和垂直像素值。总像素数也会在“图像大小”（图像\
  \ ➤ 图像大小）对话框中显示。\n\n![A432409_1_En_13_Fig3_HTML.jpg](img/A432409_1_En_13_Fig3_HTML.jpg)\n\
  \n图 13-3. 将水平值与垂直值相乘以确定总图像分辨率\n\n在使用封面图像并将文档中的首页栅格化为封面时，应选择 `150ppi` 作为默认选项。`150ppi`\
  \ 是在保持视觉质量和控制文件大小之间的最佳平衡点。（有关栅格化封面图像的更多信息，请参阅本章后面的“导出为固定版式 EPUB 格式”部分）。\n\n**注意**\n\
  \n除非你使用其他程序创建 EPUB，否则 InDesign 会根据你导出的文件格式自动处理文件转换和降采样。\n\n### 13.2.2 应用对象样式\n\n\
  在第 [12] 章中，我讨论了为文档中的每个元素创建样式。我们研究了在添加效果、透明度和投影时创建对象样式。在应用样式方面，固定版式 EPUB 比重排 EPUB\
  \ 宽容得多。即使不创建对象样式，你也可以应用效果、透明度和投影。\n\n当你处于设计模式时，使用样式是合理的。如果需要编辑文本和对象属性，或者页面包含大量文本和图像，那么创建样式总是一个好主意。然而，对于渲染固定版式\
  \ EPUB 来说，样式并非必需。\n\n### 13.2.3 处理透明度\n\n在创建重排 EPUB 时，你可能还记得：无法在图像上叠加可编辑文本，也无法在图像上添加带透明度的框架，除非将所有组件栅格化并合成为一个图形。一旦将文本栅格化，它将无法被搜索，也不再是可编辑文本。\n\
  \n对于固定版式 EPUB，你可以在图像上添加文本，也可以为出现在图像上方的框架添加透明度。你无需担心对象的锚定，因为在 InDesign 中看到的版面布局在固定版式\
  \ EPUB 中会得到保留。如图 [13-4] 所示，一个带有透明度和文本的框架出现在图像上方，且文本是可编辑的。\n\n![A432409_1_En_13_Fig4_HTML.jpg](img/A432409_1_En_13_Fig4_HTML.jpg)\n\
  \n图 13-4. 你可以在图像上添加文本和透明对象，并且在固定版式 EPUB 中，文本保持可编辑状态\n\n## 13.3 处理交互性\n\n我在第三部分中讨论的所有功能在固定版式\
  \ EPUB 中都能完美运行。由于本书是关于交互式数字出版的，我们希望充分利用 InDesign 提供的功能，在我们的出版物中添加交互元素。正如你在第 [12]\
  \ 章中所知，在重排 EPUB 中添加交互性受到限制，有时需要变通方法才能为 EPUB 添加一些交互性。而使用固定版式 EPUB，你可以使用 InDesign\
  \ 的所有功能来创建交互性，无需任何变通方法。\n\n### 13.3.1 创建书签\n\n向文档添加书签有助于创建目录。对于我在第 [12] 章中讨论的重排\
  \ EPUB，你可以在让 InDesign 生成导航目录时使用段落样式。而在固定版式 EPUB 中，某些页面可能没有章节标题甚至文本，但你希望这些页面成为目录的一部分。在生成目录时，你可以使用书签作为源，我将在后面的“创建导航目录”部分进行说明。\n\
  \n**向文档添加书签**\n\n要向文档添加书签，请执行以下操作：\n\n1.  打开书签面板。选择“窗口 ➤ 交互 ➤ 书签”。书签面板将打开，如图 [13-5]\
  \ 所示。\n\n    ![A432409_1_En_13_Fig5_HTML.jpg](img/A432409_1_En_13_Fig5_HTML.jpg)\n\
  \n    图 13-5. 已填充书签的书签面板  \n\n2.  导航到要添加书签的页面。你需要手动创建文档中的所有书签。  \n\n3.  创建新书签。单击面板底部的“创建新书签”图标，或打开书签面板菜单并选择“新建书签”。第一个书签在面板中显示为\
  \ `书签 1`。文本处于高亮状态，以便你为书签输入描述性名称。  \n\n4.  继续在文档中导航并添加书签。滚动浏览文档，为你希望出现在目录中的每个页面添加一个书签。\
  \  \n\n在本章后面的“创建导航目录”部分中，我们将探讨如何在创建导航目录时使用书签作为源。\n\n### 13.3.2 创建超链接\n\n你可以使用超链接链接到文档内的页面、电子邮件帐户、在线\
  \ URL 和文本锚点。\n\n**创建超链接**\n\n要创建超链接，请执行以下操作：\n\n1.  选择文本或对象，然后打开超链接面板（窗口 ➤ 交互 ➤\
  \ 超链接）。  \n\n2.  单击“创建新超链接”图标，或打开面板菜单并选择“新建超链接”。  \n\n3.  在“新建超链接”对话框中，从“链接到”下拉菜单中选择要链接到的项目。对于页面链接，选择“页面”，如图\
  \ [13-6] 所示。\n\n    ![A432409_1_En_13_Fig6_HTML.jpg](img/A432409_1_En_13_Fig6_HTML.jpg)\n\
  \n    图 13-6. 从“链接到”下拉菜单中选择“页面”以链接到文档中的某个页面  \n\n4.  单击“确定”，超链接即设置完成。当你导出到固定版式 EPUB\
  \ 时，在设备上点击该链接即可打开目标页面。\n\n### 13.3.3 使用富媒体\n\n视频和音频可以添加到固定版式 EPUB 中，这与添加到重排 EPUB\
  \ 的方式非常相似。虽然某些电子书阅读器可能支持除 `MP3` 以外的音频格式，并且某些阅读器支持诸如 `.mov` 和 `.avi` 等视频格式，但你仍应计划将所有音频转换为\
  \ `MP3`，将所有视频文件转换为采用 `H.264` 编码的 `MP4` 或 `M4v` 格式。最终，一些电子书阅读器可能会停止对旧格式的支持，转而采用更新的标准。\n\
  \n固定版式 EPUB 支持自动播放，但 iOS 设备除外。Apple 早在 iOS 6 版本中就禁用了自动播放功能。因此，用户需要点击视频才能播放。\n\n\
  ### 13.3.4 使用动画\n\n第 [8] 章中涵盖的所有动画在固定版式 EPUB 中均受支持。使用 EPUB 交互预览面板时看到的结果，通常与在固定版式\
  \ EPUB 中看到的结果一致。使用动画时无需任何变通方法，所有动画预设都能在固定版式 EPUB 中正常工作。\n\n\n\n### 13.3.5 使用多状态对象\n\
  \n第 9 章中介绍的多状态对象在固定版式 EPUB 中均受支持，同时也支持嵌套的多状态对象。\n\n#### 创建弹出窗口\n\n有一种实用的按钮操作与多状态对象不完全相关，即使用“显示/隐藏”按钮操作。当你想要创建图像、文本框架或多状态对象的弹出视图时，此操作非常有用。遵循以下步骤创建一个弹出窗口：\n\
  \n1.  在 InDesign 中打开一个包含图像的页面。此处我用图像来说明如何使用弹出窗口。你也可以使用其他版式，但图像对此示例来说效果很好。\n2.  创建弹出窗口。在我的示例中，我使用一个填充了颜色并添加了少许透明度的文本框架。在右上角，我添加了一个\
  \ `X` 来表示关闭框，如图 13-7 所示。将这些对象编组。\n\n    ![A432409_1_En_13_Fig7_HTML.jpg](img/A432409_1_En_13_Fig7_HTML.jpg)\n\
  \n    图 13-7.\n\n    在图像上方创建的弹出窗口\n3.  在图像上方的左下角或右下角创建一个图标。此图标代表一个按钮，用于提示用户点击该按钮时会触发某些操作。\n\
  4.  将图标转换为按钮。打开“按钮和表单”面板，选中图标图像。点击“转换为按钮”图标创建一个按钮，并为其命名。在我的示例中，我将按钮命名为 `Show Popup`。此时不要为按钮添加任何操作。\n\
  5.  将弹出窗口框架转换为按钮。选中弹出窗口，点击“按钮和表单”面板中的“创建新按钮”图标。为按钮添加一个名称。在我的示例中，我将按钮命名为 `Popup`，如图\
  \ 13-8 所示。\n\n    ![A432409_1_En_13_Fig8_HTML.jpg](img/A432409_1_En_13_Fig8_HTML.jpg)\n\
  \n    图 13-8.\n\n    将对象转换为按钮\n6.  添加一个按钮操作。选中第二个按钮（名为 `Popup`），点击加号图标添加操作。从“操作”下拉菜单中选择“显示/隐藏按钮和表单”。在“操作”下拉菜单下方的列表中，你会看到这两个按钮。此按钮的作用是显示图标并隐藏弹出窗口。因此，点击按钮名称（`Popup`）旁的默认\
  \ `X`，并点击名称旁的图标，直到眼睛图标上出现反斜杠（`\\`）。点击 `Show Popup` 名称旁的图标，并点击该框直到看到眼睛图标。这些操作分别用于隐藏弹出窗口和显示图标按钮。\n\
  7.  添加第二个按钮操作。选中按钮（`Show Popup`），并显示 `Popup` 和关闭按钮，如图 13-9 所示。在我的示例中，我还添加了一个透明屏幕来调暗版式中的视频。\n\
  \n    ![A432409_1_En_13_Fig9_HTML.jpg](img/A432409_1_En_13_Fig9_HTML.jpg)\n\n  \
  \  图 13-9.\n\n    将按钮操作设置为“显示/隐藏按钮和表单”\n8.  打开“EPUB 交互性预览”窗口并测试按钮。当你点击按钮图标时，应能看到弹出窗口出现，如图\
  \ 13-10 所示。要关闭弹出窗口，请点击 `Popup` 按钮。`Popup` 按钮图标将再次显示。\n\n    ![A432409_1_En_13_Fig10_HTML.jpg](img/A432409_1_En_13_Fig10_HTML.jpg)\n\
  \n    图 13-10.\n\n    “EPUB 交互性预览”窗口中显示的弹出窗口\n\n## 13.4 创建导航目录\n\n对于固定版式 EPUB 来说，目录并非必需。能够显示固定版式\
  \ EPUB 的电子阅读器会为每个页面生成缩略图。当你在文档中滑动浏览时，设备底部会显示缩略图。然而，如果文档篇幅较长，你可能仍需要创建一个目录。\n\n在可重排\
  \ EPUB 中创建目录时，你会使用段落样式和目录样式选项。对于固定版式 EPUB，你可能有新的章节页面不包含文本。你可能在希望按逻辑分割文档的位置放置了动画或图像。要在段落样式不实用时创建目录，你可以创建书签并将其用于目录样式。（要在\
  \ InDesign 文档中创建书签，请参阅本章前面的“创建书签”部分。）\n\n创建书签后，选择 `文件 ➤ 导出`（或按 `Ctrl/⌘+E`），并将格式选为\
  \ `EPUB（固定版式）`。在“EPUB – 固定版式导出选项”对话框的“常规”设置中，从“导航目录”下拉菜单中选择 `书签`，如图 13-11 所示。\n\n\
  ![A432409_1_En_13_Fig11_HTML.jpg](img/A432409_1_En_13_Fig11_HTML.jpg)\n\n图 13-11.\n\
  \n从“导航目录”下拉菜单中选择 `书签`\n\n点击 `确定`。文件即被导出为固定版式 EPUB。当你打开内容页面时，会发现目录已根据书签构建完成，如图 13-12\
  \ 所示。\n\n![A432409_1_En_13_Fig12_HTML.jpg](img/A432409_1_En_13_Fig12_HTML.jpg)\n\
  \n图 13-12.\n\n固定版式 EPUB 中的目录页面\n\n## 13.5 使用字体\n\n在固定版式 EPUB 中，你无法选择是否嵌入字体。InDesign\
  \ 会替你做出选择，并且你在“导出为 EPUB（固定版式）”选项中无法禁用字体嵌入。InDesign 会在固定版式 EPUB 中嵌入 TrueType 和 OpenType\
  \ 字体。较旧的 PostScript 字体格式无法嵌入。\n\n### 13.5.1 了解字体许可\n\n由于 InDesign 会嵌入你在固定版式 EPUB\
  \ 中使用的字体，因此你需要做一些研究，以确定你是否可以合法地以这种方式使用它们。你可能以 24.95 美元的价格购买了一种字体，但你购买的字体可能仅被授权用于打印文档。当你查看字体供应商的网站时，可以找到在网页、EPUB、PDF\
  \ 等用途中的许可要求。你以 24.95 美元购买的同一字体，嵌入 EPUB 的成本可能高达 200-500 美元。此外，你可能会发现，EPUB 的许可证可能只允许你在一个\
  \ EPUB 中使用该字体一次。有些情况确实荒谬至极，你的最佳实践是远离那些收取过高费用的字体供应商——尤其是针对单个 EPUB 使用的情况。\n\n你最好的选择是使用\
  \ Adobe Typekit 字体。所有通过你的 Creative Cloud 订阅在 Typekit 上可用于桌面的字体，均可合法地嵌入 EPUB 中，无需额外费用。\n\
  \n### 13.5.2 使用可接受的字体属性\n\n在开始一个项目时，最好将各种字符组合导出到固定版式 EPUB 中，以确保你使用的字符能正确转换到 EPUB。一些高级\
  \ OpenType 字符属性无法导出到 EPUB，有些只能部分导出，而另一些则完全失败。例如，花体连字无法导出到固定版式 EPUB，其效果与 InDesign\
  \ 中的页面版式差异很大。手动字距调整和 OpenType 分数同样不起作用。\n\n如图 13-13 所示，在 InDesign 中设置的原始文本（左侧）显示了一些在\
  \ EPUB 文档（右侧）中丢失的文本属性。\n\n![A432409_1_En_13_Fig13_HTML.jpg](img/A432409_1_En_13_Fig13_HTML.jpg)\n\
  \n图 13-13.\n\n在 InDesign 中设置并导出到固定版式 EPUB 的文本（左侧为 InDesign 中的排版，右侧为导出至固定版式 EPUB\
  \ 的结果）\n\n旧式数字在 InDesign CC 2015 中可以正常导出。如果你使用的是旧版 InDesign，旧式数字将无法正常导出。第一组分数源自\
  \ OpenType，第二组分数是使用字符字形设置的。\n\n\n\n## 13.6 导出为固定版式 EPUB 格式\n\n要创建固定版式 EPUB，其导出过程与导出可重排\
  \ EPUB 类似。选择 `文件` ➤ `导出` 命令，或按 `Ctrl/⌘+E`，然后在 `保存类型`（Windows）或 `格式`（Macintosh）下拉菜单中选择\
  \ `EPUB（固定版式）`。\n\n此时会弹出 `EPUB – 固定版式导出选项` 对话框，默认显示 `常规` 面板，如图 13-14 所示。\n\n![A432409_1_En_13_Fig14_HTML.jpg](img/A432409_1_En_13_Fig14_HTML.jpg)\n\
  \n图 13-14. `EPUB – 固定版式导出选项` 对话框中的 `常规` 面板\n\n### 13.6.1 使用常规导出选项\n\n与可重排 EPUB 相比，固定版式\
  \ EPUB 的常规导出选项有几点不同。在 `导出范围` 中，你可以选择页面范围。`封面` 选项与导出为可重排 EPUB 时相同。你可以选择不导出封面、将第一页栅格化为封面，或选择一张图片作为封面。\n\
  \n在 `导航目录` 下拉菜单中，你可以选择 `书签` 来生成目录。\n\n在 `跨页控制` 下拉菜单中，你可以选择生成的 EPUB 文档中跨页的显示方式。在此处所做的选择会写入\
  \ `OPF` 文件的元数据标签中，该文件控制页面视图（在 HTML 文件中也称为视口）。你的选项包括：\n\n- **基于文档设置**：使用此设置，通过 `文档设置`\
  \ 对话框（`文件` ➤ `文档设置`）中的设置来导出固定版式 EPUB。在 `文档设置` 中，你可以选择单页或对页。你还可以指定页面大小和方向。使用 `基于文档设置`\
  \ 菜单选项导出 EPUB 时，将应用 `文档设置` 中的所有设置。\n- **将跨页转换为横向页面**：如果你的文档设置为对页，则可以将所有跨页转换为单个横向页面。\n\
  - **启用合成跨页**：如果你的文档设置为单页，此选项允许你导出具有对页的 EPUB。无论文档如何设置，这都会强制导出的文档创建对页。\n- **禁用跨页**：如果文档设置为对页，但希望将\
  \ EPUB 导出为单页，则使用此选项将跨页拆分。\n\n### 13.6.2 使用转换设置\n\n点击左侧窗格中的 `转换设置`，右侧窗格将显示转换设置，如图\
  \ 13-15 所示。\n\n![A432409_1_En_13_Fig15_HTML.jpg](img/A432409_1_En_13_Fig15_HTML.jpg)\n\
  \n图 13-15. `EPUB – 固定版式导出选项` 对话框中的 `转换设置` 面板\n\n转换设置主要涉及如何处理图像。实际操作中，建议将 `格式` 设置为\
  \ `自动`，`分辨率` 选择 `150ppi`。对于 JPEG 图像，将 `品质` 设为 `高`。无需担心 GIF 选项。固定版式 EPUB 应仅使用 JPEG\
  \ 和 PNG 格式。\n\n### 13.6.3 使用 CSS 面板\n\n点击左侧窗格中的 `CSS` 后，右侧窗格会发生变化，但并没有太多选项可供选择。InDesign\
  \ 会自动处理所有 CSS 的编写，你无需担心是否需要选择输出 CSS。有一个按钮可以点击以向导出内容添加样式表，但通常很少会用到。实际操作中，导出固定版式 EPUB\
  \ 时，保持 CSS 选项为默认值即可。\n\n### 13.6.4 添加 JavaScript\n\nInDesign 会为固定版式 EPUB 自动生成自己的\
  \ JavaScript。如果你有想要添加到文件中的 JavaScript，可以通过点击左侧窗格中的 `JavaScript`，然后点击 `添加 JavaScript`\
  \ 按钮来添加脚本。除非你是一个熟练的 JavaScript 程序员，否则请保持此对话框为默认设置。\n\n### 13.6.5 使用元数据\n\n`元数据`\
  \ 面板用于提供文件标题、创作者/作者、创建日期、出版商、复制权限以及文档主题等字段的元数据，如图 13-16 所示。\n\n![A432409_1_En_13_Fig16_HTML.jpg](img/A432409_1_En_13_Fig16_HTML.jpg)\n\
  \n图 13-16. 导出选项中的 `元数据` 面板\n\n请勿修改 `标识符` 字段。InDesign 会生成自己的标识符。这不是添加 ISBN 号码的地方。在将\
  \ EPUB 发送到托管服务之前，请填写文本框并提供相关信息。\n\n### 13.6.6 定位阅读器应用\n\n`EPUB – 固定版式导出选项` 对话框的最后一个面板是\
  \ `阅读器应用` 面板。选择阅读器应用的方式与导出为可重排 EPUB 时非常相似。选择桌面电脑上的阅读器应用，文件导出后会自动在所选应用中打开。\n\n###\
  \ 13.6.7 验证 EPUB\n\nInDesign 在导出有效的固定版式 EPUB 方面表现出色。如果你将文档导出为固定版式 EPUB 且未报告任何错误，那么可以非常确信该\
  \ EPUB 是有效文档，并符合 EPUB 标准。\n\n如果你编辑了任何 HTML 或 CSS 文档，则应使用 EPUB 验证应用程序运行该 EPUB。有关验证\
  \ EPUB 的更多信息，请参见第 12 章。\n\n## 13.7 查看固定版式 EPUB\n\n通常，导出任何格式的 EPUB 时，应首先在桌面阅读器上预览文档。如果文档显示正常，则将文件传输到设备并在多台设备上预览，然后再将文件部署到内容提供商。\n\
  \n虽然对于在桌面电脑和设备上查看可重排电子阅读器有许多选择，但固定版式阅读器的选择较少。截至目前，你可以通过 Google Chrome 浏览器的 `Readium`\
  \ 扩展、Apple iBooks 以及 Adobe Digital Editions（4.0 及以上版本）查看固定版式 EPUB。固定版式 EPUB 可以转换为\
  \ Kindle KF8/MOBI 格式，但如果你创建了交互式文档，则会丢失大量交互性。\n\n电子书世界的发展日新月异。因此，本书出版时可能还有其他值得使用的阅读器。目前，你可以使用\
  \ Apple iBooks（桌面版和设备版）或 Adobe Digital Editions 来查看固定版式 EPUB。在 Windows 和 Android\
  \ 系统上，你可以使用 Windows 和 Android 设备上的 Adobe Digital Editions（`ADE`）。\n\n你添加到固定版式 EPUB\
  \ 中的所有交互功能都可以在电脑和设备的 iBooks 和 ADE 中查看。\n\n此外，Kobo 阅读器也提供了对查看固定版式 EPUB 的同等支持。\n\n\
  ## 13.8 总结\n\n在本章中，我们研究了如何导出固定版式 EPUB，并观察了可以与固定版式 EPUB 一起使用的所有交互功能。正如你所见，你的交互式文档在固定版式格式下比可重排\
  \ EPUB 格式更具多样性。\n\n在下一章中，我们将探讨导出到 Adobe Publish Online 时，在文档中使用各种交互功能的另一种方法。\n\n\
  \n\n"
- "# 14. 发现 Adobe Publish Online\n\nAdobe 在 InDesign CC 2015 中引入了 Publish Online，在开发期间最初被称为\
  \ Publish Online（预览版）。不要低估这个 InDesign 中出色的新功能，以及你能用它做的不可思议的事情。\n\n你既可以重新利用为印刷设计的内容，也可以创建一个新文档。在这两种情况下，你都可以利用我在之前章节中讨论的几乎所有交互功能。你不需要专门的查看器，几乎所有设备（包括智能手机、平板电脑、笔记本电脑、便携式电脑和台式电脑）上都可以看到内容和交互效果。\n\
  \n完成作品后，你可以与任何人分享你的文档，方法是：将文档嵌入网站或博客、托管 URL 链接、通过电子邮件将链接发送给朋友和同事、发布到 Facebook 或分享到\
  \ Twitter 账户。\n\n在本章中，我将介绍如何创建用于 Publish Online 的文档，以及如何分享你的作品。\n\n## 14.1 在 Publish\
  \ Online 中使用交互功能\n\n我在之前章节中介绍的 InDesign 交互功能都被支持。你可以使用动画、媒体、多状态对象、按钮和超链接（URL、电子邮件、页面目标、目录标记、索引标记和交叉引用超链接）。在撰写本文时，不支持你在\
  \ Acrobat PDF 中可以执行的一些操作，例如更改图层可见性或向按钮添加 JavaScript。这些限制存在于 InDesign 中，并且 Publish\
  \ Online 需要直接从 InDesign 导出。因此，如果你无法在 InDesign 中创建它，它就无法在 Publish Online 中工作。此外，由于\
  \ Publish Online 是使用 HTML5 和 JavaScript 编写的，因此不支持 SWF 文件。\n\n在覆盖面板中找到的许多功能也不被支持。遗憾的是，诸如可滚动框架和使用网页内容等功能目前尚不可用。\n\
  \n在固定版式 EPUB 和交互式 PDF 文档中不支持的、但你可以使用 Publish Online 完成的一些事情包括：\n\n*   **多页跨页：**\
  \ 你可以创建超过两页的跨页。在 Publish Online 中查看时，你可以让跨页带有动效。例如，你可以使用全景图像在屏幕上自动滚动。\n*   **多种页面大小：**\
  \ InDesign 支持创建具有不同页面大小的文档。在线文档会保持各个页面的尺寸。\n*   **交互式 Google 地图：** 你可以在 InDesign\
  \ 文档中插入显示交互式 Google 地图的 HTML 代码。地图的交互性在固定版式 EPUB 和交互式 PDF 文件中会丢失，但你可以在 Publish Online\
  \ 文档中使用交互式 Google 地图。\n*   **Adobe Animate 文件：** Adobe Animate（以前称为 Adobe Edge Animate）将动画提升到了一个新水平。Adobe\
  \ Animate 类似于 Adobe Flash，你可以创建非常令人印象深刻的动画。文件是用 HTML5 和 JavaScript 编写的，因此它们可以在所有平台上播放。当你从\
  \ Animate 导出文件时，请在发布设置（文件 ➤ 发布设置）对话框中选择 Adobe 部署包（`.oam`）选项。OAM 文件可以导入 InDesign\
  \ 并发布为在线文档。来自 Adobe Animate 的 OAM 文件在 Publish Online 和固定版式 EPUB 中得到支持，但不支持在交互式 PDF\
  \ 中使用。\n\n## 14.2 使用 Publish Online\n\n在 Adobe InDesign 中提供的所有文档创建选项中，使用 Publish\
  \ Online 是创建数字出版物最简单的方法。只需简单的菜单选择即可打开“Publish Online 选项”对话框，在其中进行一些选择，然后单击“确定”将文件发送到\
  \ Adobe 的服务器。任何使用任何类型设备、任何操作系统的人都可以查看你的作品。由于所有内容都在网页浏览器中查看，因此无需专门的阅读器。\n\n与 InDesign\
  \ 中可用的所有其他文档导出方式不同，一旦你使用 Publish Online 发布了文档，你就无法访问保存的文件。该文件会被发送到 Adobe 的服务器并驻留在那里，直到你将其删除。返回给你的是一个\
  \ URL，你可以将其复制并用作网站或博客中的超链接，通过电子邮件分享，或直接分享到你的 Facebook 和 Twitter 账户。\n\n**提示**\n\n\
  保持你已发布的在线文档整洁。如果你没有使用某些文档，请将它们从 Adobe 的服务器中删除。帮助 Adobe 将其存储负担降至最低。\n\n### 14.2.1\
  \ 发布文档\n\n你首先需要像为任何其他类型的导出一样创建你的数字出版物。Publish Online 为你提供的一项功能是发布 Google 交互式地图。让我们从创建指向\
  \ Google 地图的链接开始，然后研究如何发布文档。\n\n#### 14.2.1.1 向文档添加 Google 地图\n\n要向文档添加交互式地图，请登录\
  \ Google 地图并搜索一个地图位置。在我的示例中，我将哥斯达黎加作为一个目的地，因此我们在“搜索 Google 地图”文本框中输入 `Costa Rica`，然后单击搜索图标。到达地图位置后，打开菜单（Google\
  \ 地图中的左上角），然后单击“分享或嵌入地图”链接。\n\n当屏幕显示“分享或嵌入地图”的选项时，单击“嵌入地图”，如图 14-1 所示。文本框中的文本会被选中。按\
  \ Ctrl/⌘+C 复制 URL。\n\n![A432409_1_En_14_Fig1_HTML.jpg](img/A432409_1_En_14_Fig1_HTML.jpg)\n\
  \n**图 14-1.** 单击“嵌入地图”并复制 URL\n\n打开你的 InDesign 文档，然后选择“对象”➤“插入 HTML”。你会看到一长串代码。在代码中找到宽度和高度（请参见图\
  \ 14-2），然后编辑这些值以匹配你希望地图在文档中占据的尺寸。单击“确定”，等待几分钟，直到看到地图出现在文档中心。\n\n![A432409_1_En_14_Fig2_HTML.jpg](img/A432409_1_En_14_Fig2_HTML.jpg)\n\
  \n**图 14-2.** 将宽度和高度值编辑为你希望地图在文档中占据的尺寸\n\n当地图出现在文档中时，你可以使用选择工具在页面上移动它。如果地图太大或太小，请检查文档顶部和左侧的标尺以确定你需要的精确尺寸。删除地图，再次选择“对象”➤“插入\
  \ HTML”，粘贴 URL，并编辑宽度和高度。单击“确定”并检查地图的大小。\n\n你可以使用我在之前章节中讨论过的任何其他交互元素，例如动画、MSO、富媒体、超链接等。文档定稿后，你就可以发布了。\n\
  \n\n\n#### 14.2.1.2 提交文档以在线发布\n\n要通过 Publish Online 发布文档，请选择 `File ➤ Publish Online`\
  \ 或单击 `InDesign` 窗口顶部的 `Publish Online` 按钮，随后将打开 `Publish Online Options` 对话框。默认面板为\
  \ `General`。在 `General` 面板中，您可以提供与文档文件名不同的 `Title`（标题）和 `Description`（描述）（参见图 14-3）。\n\
  \n![A432409_1_En_14_Fig3_HTML.jpg](img/A432409_1_En_14_Fig3_HTML.jpg)\n\n图 14-3.\
  \ 为 `Title` 和 `Description` 输入名称\n\n您可以通过选择可用选项来发布所有页面或指定范围的页面。通过单击相应的单选按钮，您可以将文档导出为单页或跨页。\n\
  \n`Publish Online Options` 中的第二个面板是 `Advanced`。单击左侧列的 `Advanced` 以打开 `Advanced`\
  \ 面板，如图 14-4 所示。面板顶部，您可以为封面缩略图进行选择。当有人在社交媒体上分享您的内容时，此图像将被用作封面。您可以选择文档中的第一页作为缩略图图像，也可以滚动浏览页面并选择您希望显示为缩略图的页面。如果您想使用图像文件，请单击\
  \ `Choose Image`，然后点击文件夹图标浏览您的电脑，并选择 `GIF`、`PNG` 或 `JPEG` 图像。\n\n![A432409_1_En_14_Fig4_HTML.jpg](img/A432409_1_En_14_Fig4_HTML.jpg)\n\
  \n图 14-4. 单击左窗格中的 `Advanced` 以打开高级选项\n\n在 `Image Settings` 区域，您可以选择三种支持的格式之一，或保留默认的\
  \ `Automatic` 让 `InDesign` 自动选择格式。除非您有特殊原因要将所有图像转换为某种可接受的格式，否则请使用 `Automatic` 选项。`Automatic`\
  \ 将优化性能。\n\n对于 `Resolution`，您可以使用 `96ppi` 制作较低分辨率的文档，或者选择 `HiDPI` 以获得更高分辨率的图像。如果您的文档很长且包含许多图像，下载时间将更长。您可以尝试测试不同选项，找到最适合您设计的选项。\n\
  \n对于 `JPEG Image Quality`，请像处理大多数 EPUB 文档一样，选择 `High` 作为标准。对于 `GIF` 选项，如果文件中有任何渐变或颜色阴影，请选择\
  \ `Adaptive`。如果是纯色，您的最佳选择可能是 `Web`。\n\n在 `Publish Online Options` 对话框中设置完所有选项后，单击\
  \ `OK`，您的文件将上传到 Adobe 的服务器。如果上传时间较长，您可以继续在 `InDesign` 中工作。\n\n上传完成后，您将看到 `Publish\
  \ Online` 屏幕，如图 14-5 所示。在这里您可以进行多种选择，包括以下内容：\n\n*   **View Document**：单击 `View Document`\
  \ 按钮，您的文档将加载到默认网络浏览器中。在 Mac 上，文件会加载到 `Safari` 中（假设 `Safari` 是默认浏览器）。在 Windows 10\
  \ 上，文件会在 `Microsoft Edge` 中打开。如果未安装 `Edge`，文件会在 `Internet Explorer` 中打开。如果您使用 Windows\
  \ 10，可能需要切换应用程序并打开 `Edge` 才能查看文件。在 Mac 上，`Safari` 窗口会覆盖在 `InDesign` 窗口之上。\n*   **Copy**：如果您想复制\
  \ URL，请单击复制按钮，URL 地址将复制到您的剪贴板。如果您想在之后的网页或博客网站中使用该链接，可以将其粘贴到文本编辑器中。\n*   **Share\
  \ on Social Networks**：单击 `Facebook` 图标、`Twitter` 图标或 `E-mail` 图标，可在相应网站上分享。如果选择\
  \ `E-mail`，您的默认电子邮件客户端将打开一个新邮件窗口，文件描述会放在邮件主题行中，文件名和 URL 会添加到邮件正文中。\n\n![A432409_1_En_14_Fig5_HTML.jpg](img/A432409_1_En_14_Fig5_HTML.jpg)\n\
  \n图 14-5. 当文档完成下载时，会出现 `Publish Online` 屏幕，您可以在其中找到多种选择\n\n如果您分享到 `Facebook` 或 `Twitter`，系统会提示您先登录账户。\n\
  \n*   **Close**：单击 `Close` 按钮关闭窗口。\n\n### 14.2.2 更改已发布文档中的查看属性\n\n当您单击 `View Document`\
  \ 时，您将看到已发布的内容以及一些提供查看和分享选项的按钮。在图 14-6 中，您可以看到屏幕底部的图标，用于这些选项。其中包括：\n\n1.  **Toggle\
  \ Thumbnails**：默认视图是窗口底部不显示缩略图。在图 14-6 中，我单击了 `Toggle Thumbnails` 按钮，所有页面缩略图都显示在浏览器窗口底部。由于此文档仅包含一页，因此您只能看到一个缩略图。要返回默认视图，请再次单击\
  \ `Toggle Thumbnails` 按钮。\n2.  **Zoom buttons**：单击带有 `+` 符号的放大镜可放大文档。单击带有 `–` 符号的放大镜可缩小。\n\
  3.  **Full Screen**：单击此按钮进入全屏模式。再次单击退出全屏模式。\n4.  **Share**：单击 `Share` 按钮打开一个窗口，您可以在其中复制\
  \ URL、分享到 `Facebook` 或 `Twitter`，或添加到新电子邮件中。\n5.  **Report Abuse**：单击此按钮时，会打开一个窗口，您可以在其中对包含\
  \ `Defamation`（诽谤）、`Pornography`（色情）、`Abuse`（滥用）、`Copyright`（版权）或 `Other`（其他）选项的菜单进行滥用投诉。将出现一个姓名栏供您输入姓名，一个电子邮件栏供您添加电子邮件地址，以及一个评论框供您进一步描述投诉内容。填写完信息后，单击\
  \ `Submit` 按钮，投诉将发送给 Adobe。\n    **Caution**：Adobe 会监控投诉，并努力保护最终用户免受非法和不法内容的侵害。创建内容时，请牢记要保持内容清洁并遵守版权法。\n\
  6.  **Language**：弹出菜单包含语言选项。单击该按钮打开菜单。两个选项包括：\n    *   **Embed**：此选项生成一个“嵌入代码”，允许您将\
  \ Publish Online 文档嵌入到另一个网站中。单击 `Embed` 会打开一个窗口，为您提供多种文档尺寸选项和嵌入代码。嵌入代码类似于我之前在“向文档添加\
  \ Google 地图”一节中讨论的 `Google Maps` 所使用的代码。如果默认尺寸不满足您的需求，您可以在文本编辑器中编辑宽度和高度。\n    *\
  \   **Turn OFF Volume**：单击此按钮可关闭文档中的声音。\n\n![A432409_1_En_14_Fig6_HTML.jpg](img/A432409_1_En_14_Fig6_HTML.jpg)\n\
  \n图 14-6. 查看出版物时，您会看到几个控制查看和分享的按钮\n\n### 14.2.3 使用 Web Dashboard\n\n管理您的在线内容是通过\
  \ `InDesign` 中的一个单独菜单命令来处理的。请记住，当您使用 `Publish Online` 上传文件时，您无法编辑或更新该文件。每次在 `InDesign`\
  \ 文件中进行更改时，您都需要删除文件并上传新文件，或者直接用编辑过的新文件替换现有文件。\n\n要在 `InDesign` 中删除和管理文件，请选择 `File\
  \ ➤ Web Dashboard`。选择此命令后，您已发布的文档将显示在您的默认网络浏览器中。您必须使用 Adobe ID 登录才能查看文件。\n\n在屏幕左侧，您会看到按最后发布日期排序的已发布文档列表。当鼠标悬停在一个文档上时，浏览器窗口右侧会出现一个\
  \ `Delete` 按钮，如图 14-7 所示。单击 `Delete`，文件即被移除。如果您想打开已发布的文档，请单击文档缩略图。\n\n![A432409_1_En_14_Fig7_HTML.jpg](img/A432409_1_En_14_Fig7_HTML.jpg)\n\
  \n图 14-7. 当鼠标悬停在一个出版物上时，会出现一个 `Delete` 按钮\n\n\n\n## 14.3 总结\n\n在本章中，你学习了如何为 Adobe\
  \ Publish Online 服务导出文件。你学习了如何导出交互式文档、查看结果以及使用 Web 仪表板监控文件。你还学习了如何将文件发布到 Facebook\
  \ 和 Twitter 账户，以及如何复制 URL 以便在网站上使用。\n\n在下一章中，我们将探讨如何创建交互式 PDF 文件。\n\n"
- "# 15. 创建交互式 PDF 文件\n\n便携式文档格式（PDF）文件可以在所有设备上查看。每部手机、平板电脑和计算机都配有某种 PDF 查看器。在台式机和笔记本电脑上，免费的\
  \ Adobe Reader 软件是主流的 PDF 查看器。在手机和平板电脑上，则有多种免费或付费的查看器可供选择。\n\n无论你使用哪种 PDF 查看器，PDF\
  \ 文件通常都能按创建时的原样显示文档，包括图像、文本格式和字体嵌入。使用 PDF 的缺点是，一些交互功能在手机和平板电脑上不受支持。在台式机和笔记本电脑上，你可以获得更广泛的交互功能支持。\n\
  \n在本章中，我将讨论如何从 Adobe InDesign 导出交互式 PDF 文件、添加交互性，以及直接在 Adobe Acrobat 中执行若干添加交互性的任务。所有\
  \ Creative Cloud 用户都可以下载 Adobe Acrobat。如果你不是 Creative Cloud 订阅用户，则需要购买 Adobe Acrobat\
  \ 或其他 PDF 编辑程序。免费的 Adobe Reader 应用程序不具备编辑功能。\n\n## 15.1 准备 Acrobat 工作区\n\n如果你是 Creative\
  \ Cloud 应用程序的用户，但从未使用过 Adobe Acrobat，那么当你第一次看到 Acrobat 用户界面时，可能会怀疑这个应用程序是否真的是 Adobe\
  \ Systems 开发的。所有 Creative Cloud 应用程序以及 Adobe Photoshop Elements 都使用非常相似的用户界面。然而，Adobe\
  \ Acrobat 团队却独树一帜，Acrobat 并不遵循你在其他所有 Creative Cloud 应用程序中看到的用户界面设计标准。\n\n### 15.1.1\
  \ 创建自定义界面\n\n在 Adobe Acrobat 中，你应该创建一个自定义工作区，以便能够快速选择用于交互式 PDF 的各种工具。首先，打开 Adobe\
  \ Acrobat。文档窗格中不需要打开任何文档。\n\n点击窗口左上角的 `Tools`（工具），如图 15-1 所示。\n\n![A432409_1_En_15_Fig1_HTML.jpg](img/A432409_1_En_15_Fig1_HTML.jpg)\n\
  \n图 15-1.\n\n点击 Acrobat 窗口左上角的 `Tools`（工具）以打开工具窗口\n\n展开 `Edit PDF`（编辑 PDF）类别，点击\
  \ `Add`（添加）。点击 `Open`（打开），编辑工具便会出现在 Acrobat 窗口顶部的工具栏中，如图 15-2 所示。\n\n![A432409_1_En_15_Fig2_HTML.jpg](img/A432409_1_En_15_Fig2_HTML.jpg)\n\
  \n图 15-2.\n\n点击 `Edit`（编辑）来编辑文档中的文本\n\n你打开的工具会显示在右侧窗格中，并且在你打开其他 PDF 文件时也可使用。\n\n\
  ## 15.2 从 InDesign 导出为 PDF\n\n当你在 InDesign 中选择 `File ➤ Export`（文件 ➤ 导出）时，对于要导出的\
  \ PDF 类型，你有两个不同的选项。在 `Export`（导出）对话框的 `Save as Type`（Windows 系统）或 `Format`（Macintosh\
  \ 系统）菜单顶部，你可以找到 `Adobe PDF (Interactive)`（Adobe PDF（交互式）），后面跟着 `Adobe PDF (Print)`（Adobe\
  \ PDF（打印））。对于交互式文档，你显然需要使用 `Interactive`（交互式）选项。如果你想导出用于打印的 PDF 文档，则使用 `Print`（打印）选项。\n\
  \n### 15.2.1 使用“导出为交互式 PDF”对话框\n\n当你选择 `File ➤ Export`（文件 ➤ 导出）或按下 `Ctrl/⌘+E`，选择\
  \ `Adobe PDF (Interactive)`（Adobe PDF（交互式）），然后点击 `Save`（保存）时，会打开`Export to Interactive\
  \ PDF`（导出为交互式 PDF）对话框，如图 15-3 所示。\n\n![A432409_1_En_15_Fig3_HTML.jpg](img/A432409_1_En_15_Fig3_HTML.jpg)\n\
  \n图 15-3.\n\n打开`Export to Interactive PDF`（导出为交互式 PDF）对话框\n\n在该对话框中，你有几个选项，包括以下内容：\n\
  \n1.  `Page Range`（页面范围）：如果要导出一个页面范围，请点击 `Range`（范围）单选按钮并输入页码。例如输入 `3–5` 可导出第 3\
  \ 页至第 5 页。\n2.  `Pages / Spreads`（页面/跨页）：对于单页版式，请使用 `Pages`（页面）。如果你有对页，并且希望最终 PDF\
  \ 中的对页显示为单个宽页，请点击 `Spreads`（跨页）。\n3.  `View`（视图）：从菜单中，你可以选择不同的缩放选项。如果你希望整个页面都适合屏幕，请选择\
  \ `Fit Page`（适应页面）。无论屏幕尺寸如何，所有用户都将在文档窗格中看到整个页面。\n4.  `Layout`（布局）：如果你在此菜单中选择 `Default`（默认），则\
  \ PDF 视图将遵循每台计算机上的首选项设置。用户可以将首选项设置为单页文档或连续模式查看 PDF。（当你滚动页面时，随着上一页的底部滚出视线，你将看到下一页的顶部。）如果你总是希望你的\
  \ PDF 文档以单页方式查看，以便用户在滚动页面时能自动吸附到下一页（或任何其他布局视图），请从菜单中选择该选项。当选择了除 `Default`（默认）之外的选项时，`Layout`（布局）视图会覆盖单个计算机的首选项，并强制所有用户以相同的布局视图查看你的\
  \ PDF。\n5.  `Open in Full Screen Mode`（以全屏模式打开）：全屏模式是一种视图模式，在此模式下，所有 PDF 查看器的用户界面元素（如工具栏、菜单、滚动条等）都被隐藏。以全屏模式打开\
  \ PDF 的缺点是，每次打开 PDF 时，用户都会看到一个必须关闭的警告对话框。不幸的是，由于 Adobe 采取了许多安全措施以防止 PDF 在你不知情的情况下更改你的计算机，这是一个不得已而为之的“必要之恶”。\n\
  6.  `Flip Pages`（翻页）：如果启用了 `Full Screen Mode`（全屏模式）进行导出，你可以让 PDF 自动翻页。你可以在文本框中输入数值来确定翻页间隔。\n\
  7.  `Page Transitions`（页面过渡）：页面过渡发生在你浏览页面时。你可以选择保留 PDF 中包含的任何页面过渡，或从菜单中选择多种不同的过渡效果。\n\
  8.  `Forms and Media`（表单和媒体）：点击 `Include All`（包含全部）单选按钮，以包含放置在你的 InDesign 页面上的所有媒体文件和表单字段。\n\
  9.  `Embed Page Thumbnails`（嵌入页面缩略图）：始终禁用此选项。切勿勾选它。PDF 文档中的缩略图会在导航窗格内的 `Pages`（页面）窗格中显示每页的缩略图图像。自\
  \ Acrobat 6 以来，当打开 PDF 文档时会即时生成缩略图。如果你嵌入了页面缩略图，会增加额外开销，并且最终文件会更大。\n10. `View After\
  \ Exporting`（导出后查看）：如果你想在导出完成后自动在 Acrobat 查看器（Adobe Acrobat 或 Adobe Reader）中打开导出的\
  \ PDF 文档，请勾选此框。\n11. `Create Acrobat Layers`（创建 Acrobat 图层）：在所有类型的交互式文档中，PDF 是唯一支持图层的。例如，如果你有一个多语言文档，你可以将所有图形和图像放在一个图层上，并在单独的图层上创建文本。然后，你可以使用按钮让文档的读者切换图层视图。\n\
  12. `Tagged PDF`（标记 PDF）：点击 `Create Tagged PDF`（创建标记 PDF），以便屏幕阅读器用户可以通读你的文档。点击 `Use\
  \ Structure for the Tab Order`（使用结构作为 Tab 键顺序），这将继承表单字段等内容的 Tab 键顺序。\n13. `Publish\
  \ Online`（在线发布）：勾选此框以将文档添加为 Publish Online 文件。（有关 `Publish Online`（在线发布）的更多信息，请参见第\
  \ 14 章。）\n    *   `Compression`（压缩）：为文档中的图像选择压缩类型、`JPEG Quality`（JPEG 质量）和 `Resolution`（分辨率）。\n\
  \    *   `Advanced`（高级）：选项包括显示 `File Name`（文件名）或 `Document Title`（文档标题），以及选择 `Language`（语言）。\n\
  14. `Security`（安全）：点击 `Security`（安全）按钮打开 `Security`（安全）对话框。你可以添加打开 PDF 的密码保护、限制对\
  \ PDF 的编辑，或同时进行两者设置。\n\n\n\n### 15.2.2 在 InDesign 中准备版面\n\n在处理交互式 PDF 文件时，需要进行一些特殊处理，并且可以取得一些有趣的效果。本节将介绍这两方面的内容。你将了解到一些适用于交互式\
  \ PDF 的最佳实践，这些在创建固定布局和 Adobe Publish Online 文档时则无需考虑。\n\n#### 15.2.2.1 突破常规思维\n\n\
  交互式 PDF 文件可以实现的一个有趣效果是，设计包含超出页面边界的对象或图像的文档。这只能通过 PDF 文档实现，而唯一能产生此效果的程序是 Adobe InDesign。在图\
  \ 15-4 中，你会看到一个在 Acrobat 中显示的 PDF 页面。请注意页面左侧的菠萝，它超出了页面边界。这类似于一种越界效果，你可以使用 Adobe\
  \ Photoshop Elements 来创建。\n\n![A432409_1_En_15_Fig4_HTML.jpg](img/A432409_1_En_15_Fig4_HTML.jpg)\n\
  \n图 15-4。\n\n只有交互式 PDF 文档才能包含超出页面边界的元素 超出页面边界\n\n你可能有一辆驶出屏幕的自行车、一个正在踢球的足球运动员、一个冲浪者正在驾驭波浪，或者其他想要为最终文档增添一点立体感的设计元素。这是一项相当简单的任务，我们逐步说明如下：\n\
  \n1.  在主页上放置一个对象。必须将超出边界的对象放置在主页上。打开**页面**面板，双击用于页面上其他设计元素的主页。\n2.  确保对象的中心点在页面边界内。你必须确保中心点位于页面边界内。如果希望小元素位于页面边界之外，请在页面区域内创建一个无描边、无填充的框架，并将其与这个小元素成组。成组对象的中心点必须位于页面区域内。\n\
  3.  将对象转换为按钮。选择对象，打开**按钮和表单**面板。为该对象创建一个新按钮。无需担心分配动作，只需确保该对象是一个按钮即可。\n4.  导出为交互式\
  \ PDF。选择**文件** ➤ **导出**（或按 `Ctrl`/`⌘`+`E`），然后选择 **Adobe PDF（交互式）**。如果勾选了**导出后查看**，PDF\
  \ 会在默认的 PDF 查看器中打开。接下来，你需要使用 Adobe Acrobat 完成最后的工作。\n5.  锁定按钮。如果用户点击并拖动鼠标，按钮可能会移动并被完全限制在页面区域内。为防止这种情况发生，请使用**选择对象**工具右键点击按钮，打开弹出菜单。（按键盘上的\
  \ `R` 键可访问**选择对象**工具。）从菜单中选择**属性**。默认情况下，会打开**常规属性**对话框。在左下角，勾选**锁定**复选框，如图 15-5\
  \ 所示。\n\n    ![A432409_1_En_15_Fig5_HTML.jpg](img/A432409_1_En_15_Fig5_HTML.jpg)\n\
  \n    图 15-5。\n\n    锁定按钮以防止意外移动\n6.  调整用户界面（可选）。如果你不希望文档以全屏模式打开，可以隐藏部分界面选项。选择**文件**\
  \ ➤ **属性**或按 `Ctrl`/`⌘`+`D`。**文档属性**对话框打开。点击**初始视图**选项卡，并在**用户界面选项**区域中选择你想要隐藏的选项。你无法隐藏所有三个界面选项。通常，你需要勾选的选项是**隐藏菜单栏**和**隐藏工具栏**。不过，理想情况下，如果你创建了带有超出页面边界对象的设计，你可能会希望选择以全屏模式查看文件。\n\
  \n#### 15.2.2.2 选择交互元素\n\n并非 Adobe InDesign 中所有可用的交互元素都能直接导出到交互式 PDF。此外，在 Adobe\
  \ InDesign 中可以创建的一些交互元素，最好在 Adobe Acrobat 中处理。\n\n在表 15-1 中，你看到的是常见交互项目列表。请注意，MSO\
  \ 不受支持，而且你无法为其创建变通方法——嗯，也不是完全不行。你可以创建用于显示/隐藏其他按钮的按钮，其工作方式与 MSO 有些类似。\n\n表 15-1.\n\
  \n导出到交互式 PDF 的 InDesign 元素\n\n| 交互元素 | 在 PDF 中可接受 | 最好在 Acrobat 中创建 | 需要变通方法 |\n\
  | --- | --- | --- | --- |\n| 动画 | 否* |  | 需要变通方法 |\n| 表格动画 | 否* |  | 需要变通方法 |\n\
  | 按钮 | 是 | 在 Acrobat 中创建 |  |\n| 交叉引用 | 是 | 在 Acrobat 中创建 |  |\n| 超链接 | 是 | 在 Acrobat\
  \ 中创建 |  |\n| MSO | 否 |  | 没有变通方法 |\n| 叠印 | 否 |  | 没有变通方法 |\n| 富媒体 | 是，有一些限制（许多移动\
  \ PDF 查看器不支持在 PDF 文件中播放视频） |  |  |\n\n\\* 可以创建变通方法来显示动画\n\n你可能需要特别留意两件事：超链接和交叉引用。在\
  \ Adobe InDesign 中，当你创建超链接或交叉引用时，InDesign 会创建一个目标。在 Adobe Acrobat 的术语中，这些被称为命名目标。例如，如果你想要一个按钮，其动作设置为查看下一页、上一页或特定页面，InDesign\
  \ 会创建一个目标，然后你设置事件以跳转到该目标。\n\n将 InDesign 的目标与 Adobe Acrobat 进行对比。在 Acrobat 中，如果你想要导航页面，你可以设置一个按钮转到下一页、上一页或特定页面，而无需创建命名目标。命名目标会增加\
  \ PDF 文件的额外开销，如果文档中有许多目标，文件大小就不会那么小。作为最佳实践，请在 Acrobat 中创建所有超链接和交叉引用，以尽可能保持文件大小最小。\n\
  \n## 15.3 在 Acrobat 中创建超链接\n\n如表 15-1 所述，你应将所有超链接和交叉引用留待 Acrobat 处理，而不是在 Adobe InDesign\
  \ 中创建它们。你有两种选择来创建导航按钮：可以使用按钮，也可以使用链接。\n\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\
  \n\n### 15.3.1 使用按钮进行页面导航\n\n与链接相比，按钮的优势在于它们可以在多个页面上复制。因此，如果你想创建一个能将用户带到下一页的按钮，你可以创建一个带有按钮动作的按钮，然后在多个页面间复制它。\n\
  \n#### 创建用于页面导航的交互式按钮\n\n若要创建用于页面导航的交互式按钮，请执行以下操作：\n\n1.  在 Acrobat 中打开一个多页文档。\n\
  2.  在第一页上创建一个按钮。点击按钮工具，并在你想要按钮出现的位置绘制一个按钮。\n3.  添加按钮填充（可选）。如果页面上有符号或图标，则无需创建带外观的按钮。如果没有任何提示表明点击按钮会进行导航，则需要以某种方式创建按钮，让用户清楚地知道该元素是一个按钮。你可以选择用颜色填充按钮内容，或者向按钮添加图形。创建按钮后，按钮字段名称窗口会立即在按钮上打开。为按钮键入一个名称，例如\
  \ `Go Next`，然后点击“所有属性”。\n4.  在“按钮属性”对话框中，点击“外观”标签页，然后点击“填充颜色”图标。从弹出菜单中选择“无颜色”。点击“选项”标签页。在“布局”菜单中，您可以选择“标签和图标”、“仅标签”或“仅图标”。在此示例中，我们将使用“仅图标”。\n\
  5.  选择“仅图标”后，Acrobat 有一个小问题：除非您先更改“行为”，否则无法选择图标。从“行为”菜单中选择“推送”，然后“选择图标”按钮变为可用。点击“选择图标”，弹出“选择图标”对话框。点击“浏览”打开“打开”窗口，在您的硬盘上导航以找到要使用的图标。在“打开”窗口中点击，然后点击“打开”（参见图\
  \ 15-6）。\n\n![A432409_1_En_15_Fig6_HTML.jpg](img/A432409_1_En_15_Fig6_HTML.jpg)\n\
  \n**图 15-6.** 找到要用于按钮表面的对象，然后点击“打开”\n\n在“高级”窗口中，您有一些选项来定位按钮字段中的图标。\n\n6.  点击“按钮属性”的“选项”标签页中的“高级”以调整大小和缩放比例。\n\
  7.  设置动作。仍在“按钮属性”对话框中，点击“动作”标签页。在“选择动作”菜单中选择“执行菜单项”，然后点击“添加”。“菜单项”对话框打开。找到“视图-页面导航-下一页”项目并选中它。点击“确定”，然后点击“关闭”按钮关闭“按钮属性”对话框。\n\
  8.  创建第二个按钮。按照步骤 3 和 4 中的相同过程创建第二个按钮。对于此按钮，在“菜单项”菜单中选择“视图-页面导航-上一页”。\n\n#### 使用\
  \ JavaScript 替代“执行菜单项”动作\n\n作为使用“执行菜单项”动作的替代方法，您可以添加一个简单的 JavaScript。在“动作”标签页中，从“选择动作”菜单中选择“运行\
  \ JavaScript”。点击“添加”，JavaScript 编辑器打开。键入以下内容：\n\n```\nthis.pageNum++;\n```\n\n点击“确定”，JavaScript\
  \ 被添加到按钮。要导航到上一页，请在 JavaScript 编辑器中键入以下代码：\n\n```\nthis.pageNum--;\n```\n\n如果您想导航到文档中的特定页面，请键入以下代码：\n\
  \n```\nthis.pageNum=5;\n```\n\nJavaScript 是从零开始的，因此此代码将打开文档中的第 6 页。JavaScript 区分大小写，因此请确保完全按照所示的大小写进行。\n\
  \n> **注意：** 用于页面导航的 JavaScript 和其他自定义 JavaScript 应仅用于桌面 PDF 查看器。大多数移动 PDF 查看器无法识别\
  \ JavaScript。\n\n9.  复制按钮。如果您在第一页上创建了按钮，请右键单击“下一页”按钮。从菜单中选择“跨页面复制”。在“复制字段”对话框中，点击“自”单选按钮，在文本框中键入\
  \ `1`，然后键入最后一页的页码（参见图 15-7）。例如，如果您的文档有 20 页，请在第一个文本框中键入 `1`，在第二个文本框中键入 `20`。对“上一页”按钮执行相同操作。在第一页上，删除“上一页”按钮。转到文档的最后一页，双击该按钮打开按钮属性。点击“动作”，选择“执行菜单项”，然后点击“编辑”以编辑该动作。选择“视图-导航-第一页”。\n\
  \n![A432409_1_En_15_Fig7_HTML.jpg](img/A432409_1_En_15_Fig7_HTML.jpg)\n\n**图 15-7.**\
  \ 在“复制字段”对话框中输入页面范围\n\n10. 点击“按钮属性”中的“关闭”，然后点击按钮以确保它们正常工作。\n\n> **注意：** 您需要使用“手形”工具来点击按钮。在键盘上按\
  \ `H` 键以使用手形工具。\n\n### 15.3.2 链接到 URL\n\n如果你想从文本中的 URL 创建链接，则无需在 InDesign 中执行任何操作。在\
  \ InDesign 中添加 URL 只会增加 PDF 文档的额外开销。大多数 PDF 查看器会自动打开文本中包含的 URL，前提是它们的键入方式如下：\n\n\
  [`http://www.mycompany.com`](http://www.mycompany.com) 或 [`www.mycompany.com`](http://www.mycompany.com)，其中\
  \ `mycompany.com` 是您要链接到的 URL。\n\n## 15.4 在 Acrobat 中更改图层视图\n\n能够更改图层视图为交互式文档增加了一个新的维度，这是\
  \ PDF 文档独有的功能。在 Acrobat 术语中，图层被称为 OCG（可选内容组）。您可以将 OCG 用作文档中多状态对象的变通方法，这些文档中有多种语言或任何其他类型的交互性，您希望在其中更改页面上的对象、图像和/或文本视图。\n\
  \n在图 15-8 中，您看到在 Acrobat 中以全屏模式查看的文档。当前视图显示带有西班牙语文本的文档。在“English”字样上方有一个按钮。当用户点击该按钮时，图像和图形保持不变，但文本变为英语。\n\
  \n![A432409_1_En_15_Fig8_HTML.jpg](img/A432409_1_En_15_Fig8_HTML.jpg)\n\n**图 15-8.**\
  \ 点击“English”按钮，英语图层将显示出来\n\n### 15.4.1 在 InDesign 中设置分层文件\n\n在一个新的 InDesign 文档中，您可以在图层面板中添加三个图层。在此示例中，我使用两个图层用于语言，一个图层用于图像/对象。如果您创建类似的布局，请将图层命名为\
  \ `Object`、`English` 和 `Spanish`，或您想要在其他两个图层上显示的任何名称。在所有图层上都保持不变且可见的内容可以放置在 `Objects`\
  \ 图层上。\n\n如果您想为添加按钮的区域添加图标或文本，请在添加按钮以更改视图的两个图层上创建它们。\n\n完成设计后，导出为交互式 PDF。务必在“导出为交互式\
  \ PDF”对话框中选中“创建 Acrobat 图层”（参见图 15-3）。\n\n\n\n### 15.4.2 创建用于查看图层的按钮\n\n当您创建彼此重叠的按钮时，需要添加三种不同的操作类型。您需要在点击按钮后隐藏它，显示第二个按钮，并更改图层视图。所有表单域都会出现在所有图层上，因此您无法同时隐藏图层和按钮。按钮会保留在所有图层上，所以如果不严格按照步骤操作，可能会有点混乱。\n\
  \n当您打开包含 Acrobat 图层（Layer）的 PDF 时，\"图层\"面板会在导航窗格（文档最左侧）中打开。点击导航窗格中的\"图层\"图标以打开面板。在文件名的左侧，您会看到一个小三角形。点击该三角形以展开图层，如图\
  \ 15-9 所示。\n\n![A432409_1_En_15_Fig9_HTML.jpg](img/A432409_1_En_15_Fig9_HTML.jpg)\n\
  \n图 15-9. 点击\"图层\"面板图标，然后点击文件名左侧的白色小方块\n\n您需要让图层处于可见状态，才能继续创建按钮。\n\n#### 添加按钮以更改图层视图\n\
  \n要添加更改图层视图的按钮，请执行以下操作：\n\n1.  创建一个按钮。\n2.  点击工具栏中的\"按钮\"工具，并拖动鼠标在您希望按钮出现的位置上拉出一个矩形。为按钮命名。在本示例中，在单词\"\
  English\"上方创建按钮。\n3.  创建第二个按钮并为其命名。将第二个按钮移开，使其不与第一个按钮重叠。这样将更容易分配属性和测试结果。\n4.  双击第一个按钮以打开\"\
  按钮属性\"。如果页面上有文本或图标，请点击\"外观\"选项卡，并将填充设置为\"无\"。\n5.  添加一个操作。最终，这些按钮会放置在相同的空间内。因此，默认情况下一个按钮会隐藏另一个。您需要一个操作来隐藏当前按钮，然后显示第二个按钮，最后显示相应的图层。在\"\
  操作\"选项卡中，选择\"显示/隐藏域\"，然后点击\"添加\"。\"显示/隐藏域\"对话框随即打开。当前您正在处理\"English\"按钮，因此您希望显示\"\
  Spanish\"按钮，如图 15-10 所示。做出选择后，点击\"确定\"关闭对话框。\n\n    ![A432409_1_En_15_Fig10_HTML.jpg](img/A432409_1_En_15_Fig10_HTML.jpg)\n\
  \n    图 15-10. 在\"显示/隐藏域\"对话框中选择合适的属性\n\n6.  为同一个按钮添加第二个操作。当\"操作\"选项卡仍为第一个按钮打开时，创建另一个\"\
  显示/隐藏域\"操作。这次您需要点击\"English\"项目（我们正在处理的按钮）并将其隐藏。选择\"English\"，点击\"隐藏\"单选按钮，然后点击\"\
  确定\"关闭对话框。\n7.  添加一个操作来查看图层。您需要将希望从按钮点击中继承的可见和隐藏图层置于视图中。因此，在\"按钮属性\"对话框打开时，查看导航窗格，并点击\"\
  Spanish\"上的眼睛图标（当点击\"English\"按钮时，\"Spanish\"图层将变为可见）。同时，通过点击眼睛图标隐藏\"English\"图层，使其从视图中消失，如图\
  \ 15-10 所示。现在可以添加操作了。打开\"选择操作\"菜单，选择\"设置图层可见性\"。点击\"添加\"按钮，Acrobat 会显示一个警告对话框，提示您所选操作将设置为当前状态。点击\"\
  确定\"，即设置了以下操作：显示\"Spanish\"按钮、隐藏\"English\"按钮、显示\"Spanish\"图层。\n8.  在\"按钮属性\"对话框打开时，点击第二个按钮，并确保\"\
  操作\"选项卡可见。为此按钮设置类似的操作。您需要反转\"显示/隐藏\"按钮的选项选择。将第一个\"显示/隐藏\"操作设置为隐藏\"Spanish\"按钮。将第二个\"\
  显示/隐藏域\"操作设置为显示\"English\"按钮。在导航窗格中更改图层视图，以显示\"English\"图层并隐藏\"Spanish\"图层。选择\"\
  设置图层可见性\"并添加该操作。点击\"按钮属性\"中的\"关闭\"。\n9.  测试结果。按钮在页面上彼此分开，这样更容易测试结果。点击一个按钮，查看其是否按预期执行。该按钮应消失，而第二个按钮应准备好可供使用。点击它，检查图层可见性和按钮视图是否正常工作。如果不行，您需要返回\"\
  按钮属性\"进行一些更改。当一切按预期运行后，将一个按钮移动到另一个按钮之上（通过点击拖动或使用\"对齐\"面板）。\n\n#### 使用 JavaScript\
  \ 更改图层视图\n\n处理按钮操作的一个更简单的方法是使用 JavaScript。以下脚本只需要放在一个按钮上，每次点击该按钮时，它都会更改图层视图。要添加用于运行\
  \ JavaScript 操作的脚本如下：\n\n```\nvar docOCGs = this.getOCGs();\nfor (var i=0; i < docOCGs.length;\
  \ i++)\n{\nif(docOCGs[i].name == \"Spanish\")\n{\ndocOCGs[i].state = !docOCGs[i].state;\n\
  }\nif(docOCGs[i].name == \"English\")\n{\ndocOCGs[i].state = !docOCGs[i].state;\n\
  }\n}\n```\n\n您可以轻松地从此处复制文本，并将其添加到您想要切换图层视图的文档中。只需确保引号内的名称与您的图层名称匹配即可。\n\n\n\n###\
  \ 15.4.3 创建许可协议\n\n利用 Acrobat 图层可以完成的一项有趣功能是，让文档的首页显示一份许可协议。在首页上，你会看到一份许可协议和两个按钮。如果用户点击**不同意**，该按钮会强制\
  \ Acrobat 关闭文件。如果用户点击**同意**，则图层视图会发生变化，显示文档内容并隐藏许可协议。在图 15-11 中，你可以看到 PDF 首页上显示的此类协议。\n\
  \n![A432409_1_En_15_Fig11_HTML.jpg](img/A432409_1_En_15_Fig11_HTML.jpg)\n\n图 15-11。带有许可协议的\
  \ PDF 首页\n\n基本上，当用户点击**同意**按钮时，该按钮只是更改了图层的状态。为了保护你的内容，你需要使用 Acrobat 安全功能对文件进行保护。按\
  \ `Ctrl/⌘+D` 打开**文档属性**窗口，然后点击**安全性**。在**安全设置**选项卡中，从**安全方法**下拉菜单中选择**密码安全**。选择**密码安全**后，会弹出**密码安全\
  \ - 设置**对话框。在**权限**区域，打开**允许更改**菜单，选择类似**注释、填写表单字段和签署现有签名域**的选项，如图 15-12 所示。这样可以防止用户访问导航窗格中的**图层面板**，并仅允许添加表单字段数据、注释和签署现有的数字签名字段。\n\
  \n![A432409_1_En_15_Fig12_HTML.jpg](img/A432409_1_En_15_Fig12_HTML.jpg)\n\n图 15-12。选择注释、填写表单字段和签署现有签名域\n\
  \n创建此类文档的一个注意事项是，由于文件是受保护的，因此用户点击**同意**按钮并打开内容图层后，保存文件并不会改变图层的可见性。文件将始终以显示许可协议的状态打开，用户每次打开文档都需要点击**同意**。\n\
  \n## 创建许可协议\n\n请看图 15-11。以下是创建许可协议的方法：\n\n你需要从一个包含至少两个图层的 InDesign 文件开始。在我的示例中，一个图层在\
  \ 101 页上显示内容。许可协议位于第 1 页的第二个图层上。该图层在其余页面上为空。\n\n我将文件导出为 PDF，并在**导出为交互式 PDF** 对话框中勾选了**创建\
  \ Acrobat 图层**。\n\n## 添加接受按钮\n\n我使用按钮工具创建了一个**接受**按钮。然后为按钮添加了以下 JavaScript：\n\n\
  ```\nvar docOCGs = this.getOCGs();\nfor (var i=1; i < docOCGs.length; i++)\n{\n\
  if(docOCGs[i].name == \"LicenseAgreement\")\ndocOCGs[i].state = false;\nelse\ndocO\
  \ CGs[i].state = true;\n}\nthis.setOCGOrder( [] );\n```\n\n这段 JavaScript 基本上将状态视图从当前图层状态更改为\
  \ `LicenseAgreement` 状态。换句话说，当用户点击**接受**按钮时，状态会发生改变，内容会显示出来。\n\n## 添加不同意按钮\n\n如果用户点击此按钮，表示他们不同意许可协议的条款。因此，我们只需指示\
  \ Acrobat 打开一个警告对话框，告知用户文档将关闭。当用户在警告对话框中点击**确定**时，文件就会关闭。处理此操作的 JavaScript 如下：\n\
  \n```\nvar msg = \"好的，此文档即将关闭\";\napp.alert(msg);\nthis.closeDoc();\n```\n\n即使你不是\
  \ JavaScript 程序员也无需担心。只需创建一个按钮，并为该按钮的动作选择**运行 JavaScript**。点击**添加**，然后输入你在此处看到的按钮代码。对于**接受**按钮，你只需要修改包含\
  \ `\"LicenseAgreement\"` 的那一行。这是文件中图层的名称。如果你使用了不同的图层名称，只需在引号之间输入该名称即可。\n\n对于**接受**按钮，信息显示在第二个脚本的引号之间。你可以通过输入自己的文本来更改该信息。只需确保你的信息位于引号之间，并且其余代码完全按照你在此处看到的格式添加到\
  \ JavaScript 动作中即可。\n\n> **警告**：你需要为 PDF 文件添加安全设置，以防止用户手动显示和隐藏图层。\n\n### 15.4.4\
  \ 使用多个图层\n\n请看图 15-13。文档右侧有四个按钮。这些按钮用于更改页面左侧房屋平面图的图层视图。当用户点击**固定装置**时，固定装置会消失。再次点击**固定装置**，固定装置会重新出现。这种设置就像一个多状态对象，按钮可以切换到不同的状态视图。\n\
  \n![A432409_1_En_15_Fig13_HTML.jpg](img/A432409_1_En_15_Fig13_HTML.jpg)\n\n图 15-13。按钮用于显示/隐藏房屋平面图的不同视图\n\
  \n你可以使用**设置可见性**按钮动作为按钮分配不同的图层视图。这样做需要打开**图层面板**，查看所需的图层视图，然后设置动作。一个更简单的方法是使用 JavaScript。\n\
  \n显示/隐藏**文本**图层的代码如下（见图 15-14）：\n\n![A432409_1_En_15_Fig14_HTML.jpg](img/A432409_1_En_15_Fig14_HTML.jpg)\n\
  \n图 15-14。用于显示/隐藏文本图层的 JavaScript 代码\n\n```\nvar docOCGs = this.getOCGs();\nfor\
  \ (var i=0; i < docOCGs.length; i++)\n{\nif(docOCGs[i].name == \"Text\")\n{\ndocOCGs[i].state\
  \ = !docOCGs[i].state;\n}\n}\n```\n\n倒数第三行代码是一个开关，用于打开/关闭图层视图。一旦你为一个按钮编写了代码，为其他按钮复制代码就很容易了。只需复制代码，将其粘贴到另一个按钮的**运行\
  \ JavaScript** 动作中，并更改图层名称。在此示例中，图层的名称是 `Text`、`Fixtures`、`Walls` 和 `Tile & Carpet`。你只需将每个按钮对应的\
  \ `\"Text\"` 替换为其他图层的名称即可。通过复制和粘贴 JavaScript，你可以快速完成按钮动作的设置。\n\n\n\n## 15.5 在交互式\
  \ PDF 中使用媒体\n\nAcrobat 支持多种媒体格式。如我在第 10 章所述，最佳格式是用于音频的 `.mp3` 文件，以及 H.264 编码的 M4V\
  \ 和 MP4 文件。在 PDF 文件中使用音频和视频有两种方法：你可以从包含音频和视频的 InDesign 文档中导出，也可以使用 Acrobat 中的工具添加音频和视频文件。大多数情况下，你应先将文件放置在\
  \ InDesign 中，然后导出为交互式 PDF。\n\n在 Acrobat 中，你可以选择在文档中视频出现的位置查看视频文件，也可以选择在浮动窗口中查看视频。要启用浮动窗口视图，右键单击视频上的“选择对象”工具，在打开的上下文菜单中选择“属性”。在媒体的“属性”对话框中，你可以打开“编辑视频”对话框中的“启动设置”选项卡（如图\
  \ 15-15 所示），并选择“在浮动窗口中播放内容”。\n\n![A432409_1_En_15_Fig15_HTML.jpg](img/A432409_1_En_15_Fig15_HTML.jpg)\n\
  \n图 15-15。  \n点击“文档 JavaScript”打开“文档 JavaScript”对话框\n\n你在 InDesign 中为播放、暂停、停止等创建的按钮在\
  \ PDF 文档中均可使用。控制器的工作方式也与固定布局和 Adobe Publish Online 文档中的相同。如果你愿意，也可以在 Acrobat 中创建用于管理视频的按钮。在按钮的“操作”选项卡中，针对处理你文档的\
  \ Acrobat 查看器版本，你有多种选择，包括：\n\n*   **多媒体操作（Acrobat 9 及更高版本）：** 对在 Acrobat 或 Adobe\
  \ Reader 9 或更高版本中查看的 PDF 使用此选项。\n*   **播放媒体（兼容 Acrobat 5）：** 这是一个旧标准，你很可能不会用到。\n\
  *   **播放媒体（兼容 Acrobat 6）：** 当你确定文档的查看者使用的是 Adobe Reader（或 Acrobat）9 或更早版本时，使用此操作。\n\
  \n有时，提醒用户他们必须使用特定版本或更高版本的 Acrobat 或 Adobe Reader 可能会很有帮助。如果你的文档最好在 Reader/Acrobat\
  \ 9 版中查看，那么你可以在文件中添加一个警告对话框。仅当有人使用的版本早于你指定的版本时，该警告对话框才会打开。这是一个简单的 JavaScript，你可以在文档打开时将其添加到文档中。我们将文档打开时出现的\
  \ JavaScript 称为文档级 JavaScript。\n\n在编写 JavaScript 之前，你必须访问“文档 JavaScript”对话框。点击 Acrobat\
  \ 窗口左上角的“工具”，找到“JavaScript”按钮。点击“打开”，这些工具便会加载到 Acrobat 工具栏中。在这些工具中，你会找到“文档 JavaScript”。点击此按钮打开“文档\
  \ JavaScript”对话框，如图 15-15 所示。\n\n为脚本键入一个名称，然后点击“添加”按钮。“JavaScript 编辑器”会打开（同样如图 15-15\
  \ 所示）。在“JavaScript 编辑器”窗口中键入以下代码：\n\n```\n//查看器版本是否低于 9.0\nif(app.viewerVersion\
  \ < 9.0)\n{\nvar msg = \"部分功能在低于 9.0 版的 Acrobat 查看器中无法正常工作。\";\napp.alert(msg);\n\
  }\n```\n\n在这段代码中，第一行文本是注释行，不会被执行。第二行代码检查正在使用的 PDF 查看器的版本。如果查看器版本低于 9.0，则执行消息字段。在这种情况下，会打开一个警告对话框，显示你在代码括号中看到的内容。最后一行代码指示\
  \ Acrobat 打开该警告对话框。\n\n如果你在 PDF 文件中包含了一些仅在特定版本的 PDF 查看器中才能正常工作的内容，你应该在文档级 JavaScript\
  \ 中包含类似的代码。\n\n有关使用媒体的更多信息，请参见第 10 章。\n\n## 15.6 让动画在 PDF 文档中播放\n\n如果你通读了第 8 章，其中我谈到了在\
  \ InDesign 中创建动画，你可能会感到有点兴奋。毕竟，在 InDesign 中处理动画能为你的出版物注入新的活力，而且相当有趣。但是，当我说交互式 PDF\
  \ 文件不支持 InDesign 动画时，你可能会失去一些兴奋感。不过别担心，因为我在这里就是要告诉你如何让你在 InDesign 中创建的所有动画都能在交互式\
  \ PDF 文件中播放。\n\n你可能注意到了，“按钮和表单”面板中有三个部分。顶部部分包括页面导航、转到 URL、显示和隐藏按钮以及对声音和视频的支持。下一个部分写着“仅限\
  \ SWF/EPUB”。在这里你才能找到对动画的支持。\n\n你在这里得到的线索是，动画不能导出为 PDF，但它们可以像处理 SWF 文件一样被处理。要绕过对动画缺乏支持的问题，你只需将动画转换为\
  \ SWF，它们随后便能在 PDF 中正常播放。尽管 SWF 和 Adobe Flash 的使用正在减少，但 Acrobat DC 仍然支持 SWF，而且在一切都被转换为\
  \ HTML5 和 JavaScript 之前，我们很可能会看到它在一段时间内持续获得支持。不过请记住，此技术仅适用于安装了 Adobe Flash Player\
  \ 的台式机和笔记本电脑，不适用于手机或平板电脑。\n\n## 在 PDF 中播放动画\n\n要实现在 PDF 中播放动画，请遵循以下步骤：\n\n1. 创建一个包含动画的\
  \ PDF 文档。你可以使用“动画”面板中的任意一个（共 48 个不同预设）。有关使用这些预设的更多信息，请参阅第 8 章。  \n2. 选择**文件** ➤\
  \ **导出**或按 `Ctrl/⌘+E`。从“保存类型”菜单（Windows）或“格式”菜单（Macintosh）中选择“Flash Player SWF”。\
  \  \n3. 在“导出 SWF”对话框中设置属性，如图 15-16 所示。取消选中“生成 HTML”。确保在“交互和媒体”区域中选中“包含全部”单选按钮。将背景设置为“透明”。（注意：SWF\
  \ 在 PDF 中不会是透明的。你需要在 PDF 文档中，在 Acrobat 中进行编辑）。点击**确定**。\n\n    ![A432409_1_En_15_Fig16_HTML.jpg](img/A432409_1_En_15_Fig16_HTML.jpg)\n\
  \n    图 15-16。  \n    为导出到`Flash Player SWF`设置属性。\n\n4. 打开一个新的 InDesign 文档并置入 SWF\
  \ 文件。  \n5. 选择你刚置入的 SWF 文件并打开“媒体”面板。选中“页面加载时播放”复选框。  \n6. 选择**文件** ➤ **导出**或按 `Ctrl/⌘+E`，从“保存类型”菜单中选择“交互式\
  \ PDF”。  \n7. 检查结果。如果选中“导出后查看”，文件将在 Acrobat 中打开。  \n8. 点击“选择对象”工具（`R`），然后右键单击 SWF\
  \ 文件。会打开“编辑 SWF”对话框，如图 15-17 所示。从菜单中选择“属性”。在“编辑 SWF”对话框中，确保“启用时间”菜单选项设置为“包含内容所在页面已打开”。选中“透明背景”复选框，然后点击**确定**。保存文件。\n\
  \n    ![A432409_1_En_15_Fig17_HTML.jpg](img/A432409_1_En_15_Fig17_HTML.jpg)\n\n\
  \    图 15-17。  \n    在“编辑 SWF”对话框中启用“透明”。\n\n现在，当 PDF 打开时，动画就会播放。\n\n\n\n## 15.7\
  \ 导出交互式表格\n\n众所周知，在 **SWF/EPUB 专属**区域中为 InDesign 设置的任何按钮操作，都是设计用于在 SWF 文件中查看的。如果你使用多状态对象\
  \ (MSO) 和按钮创建了一个用于查看状态的交互式表格，那么显然需要一种变通方法才能在导出的 PDF 中查看其交互性。\n\n**注意：** 此类交互性仅在安装了\
  \ Flash Player 的台式电脑和笔记本电脑上的 PDF 中可见。\n\n设置方式与导出带有动画的 PDF 非常相似。你需要先从 InDesign 导出一个\
  \ SWF 文件，然后将该 SWF 文件导入，最后再将其导出为交互式 PDF 文档。\n\n### 15.7.1 设置交互式表格\n\n在图 15-18 中，你会看到一个包含表格的\
  \ InDesign 版面。该表格使用了一些简单的 MSO 和几个按钮来查看不同的状态。我在此用一个简单的例子来说明这个过程。你可以使用 MSO 创建更复杂的设计，正如我在第\
  \ 8 章中解释的那样。有关在 InDesign 中创建表格的更多信息，请参阅第 5 章。\n\n![A432409_1_En_15_Fig18_HTML.jpg](img/A432409_1_En_15_Fig18_HTML.jpg)\n\
  \n**图 15-18.** InDesign 表格版面在四个表格单元格中显示水果图像\n\n显示水果图像的四个表格单元格就是 MSO。当你查看第一个单元格的对象状态时，只看到两个状态。一个状态显示香蕉，另一个状态显示地图，如图\
  \ 15-19 中第一个表格单元格的 MSO 所示。\n\n![A432409_1_En_15_Fig19_HTML.jpg](img/A432409_1_En_15_Fig19_HTML.jpg)\n\
  \n**图 15-19.** 四个 MSO 中的第一个\n\n在图像下方的文本上方出现一个按钮。在“按钮和表单”面板中，为按钮操作选择 `转到下一个状态`，如图\
  \ 15-20 所示。四个单元格各只需要一个按钮。单击一次显示地图，再次单击返回水果图像。\n\n![A432409_1_En_15_Fig20_HTML.jpg](img/A432409_1_En_15_Fig20_HTML.jpg)\n\
  \n**图 15-20.** 按钮操作设置为 `转到下一个状态`\n\n添加 MSO 和按钮操作后，复制表格和按钮，并将它们粘贴到新的 InDesign 文档中。粘贴表格和按钮时，可能会发现按钮丢失了`转到下一个状态`操作。\n\
  \n你需要在“按钮和表单”面板中重置操作。使用 SWF 预览面板预览设计，并确保单击按钮可以更改状态。一切正常后，选择`文件 ➤ 导出`（`Ctrl/⌘+E`）并将文件导出为\
  \ Flash Player (SWF)。\n\n删除原始文件中的表格和按钮。建议保存一份文档副本，并将其命名为类似 `Fruit_No Table.indd`\
  \ 的文件。删除表格和按钮后，选择`文件 ➤ 置入`并置入 SWF 文件。\n\n### 15.7.2 导出为交互式 PDF\n\n置入 SWF 文件后，选择`文件\
  \ ➤ 导出`（`Ctrl/⌘+E`）并选择 Adobe PDF（交互式）。勾选`导出后查看`复选框，然后在`导出为交互式 PDF` 对话框中单击`确定`。\n\
  \n该文件将在默认的 PDF 查看器中打开。你应该将 Adobe Acrobat 设置为默认查看器，以便能够编辑 PDF 文件。\n\n首次在 PDF 查看器中查看文档时，可能会在屏幕左上角看到一个\
  \ Flash 图标，页面上没有显示其他内容，如图 15-21 所示。\n\n![A432409_1_En_15_Fig21_HTML.jpg](img/A432409_1_En_15_Fig21_HTML.jpg)\n\
  \n**图 15-21.** InDesign 导出的默认视图\n\n### 15.7.3 在 Acrobat 中调整属性\n\n单击 Acrobat 工具栏中的`选择对象`工具。如果该工具不可用，请按键盘上的\
  \ `R` 键访问该工具。必须将 Acrobat 的“常规首选项”设置为使用单键加速键，才能使用键盘快捷键访问工具。\n\n右键单击 SWF 覆盖层，然后从上下文菜单中选择`属性`。随即打开\
  \ SWF 文件的属性调整选项。在`编辑 SWF` 对话框的`启动设置`选项卡中，从`启用条件`菜单中选择`当包含内容的页面被打开时`（参见图 15-22）。\n\
  \n![A432409_1_En_15_Fig22_HTML.jpg](img/A432409_1_En_15_Fig22_HTML.jpg)\n\n**图 15-22.**\
  \ 从`启用条件`菜单中选择`当包含内容的页面被打开时`，并勾选`透明背景`复选框\n\n勾选`透明背景`复选框，然后在`编辑 SWF` 对话框中单击`确定`。保存文件并在\
  \ Acrobat 中重新打开。当打开页面播放 SWF 文件时，应看到 SWF 覆盖层透明，并且可以看到表格周围的背景，如图 15-23 所示。\n\n![A432409_1_En_15_Fig23_HTML.jpg](img/A432409_1_En_15_Fig23_HTML.jpg)\n\
  \n**图 15-23.** 重新打开文件后，应看到 SWF 覆盖层变为透明\n\n单击按钮，对象状态应随之改变。\n\n## 15.8 在 PDF 中使用多状态对象\n\
  \n在交互式 PDF 文件中，无法直接导出带有多状态对象的文档。但是，你可以遵循导出动画时的相同路径，使按钮能够推进 MSO 中的状态，并且还可以让嵌套的 MSO\
  \ 在台式电脑的 Acrobat PDF 中正常工作。\n\n与准备包含动画的文件一样，首先需要将所有包含按钮和 MSO 的图层导出到 Flash Player\
  \ (SWF) 文件。在包含背景和其他设计元素的 InDesign 文档中置入该 SWF 文件，然后导出为交互式 PDF。\n\n当文件在 Acrobat 中打开时，使用`选择对象`工具打开上下文菜单并选择`属性`。在`编辑\
  \ SWF` 对话框中，从`启用条件`菜单中选择`当包含内容的页面被打开时`，并勾选`透明背景`复选框。保存文件并在 Acrobat 中重新打开。\n\n单击按钮以显示不同的对象状态。如果使用了嵌套的\
  \ MSO，请单击按钮以推进嵌套 MSO 中的状态。有关使用多状态对象的更多信息，请参阅第 9 章。\n\n## 15.9 总结\n\n如本章所述，在 InDesign\
  \ 中创建的许多交互性并不能直接在 Acrobat 中得到支持。但是，通过一些变通方法，你可以成功播放动画、处理多状态对象，并在 Acrobat 中创建各种资源和\
  \ JavaScript，从而帮助你使用交互式 PDF 文件实现预期目标。\n\n在下一章中，我们将探讨一些帮助你在 InDesign 中设置和创建交互式文档的技巧。\n\
  \n## 第五部分：技巧与诀窍\n\n"
- "# 16. 创建数字出版文档的技巧\n\n通过遵循一些版面设计和最终定稿的注意事项与技巧，你可以为所有数字出版物创造出更好的设计。这里所有的技巧都是免费的，不会花费你额外的金钱——它们只是一些值得思考的点子。\n\
  \n\n\n## 16.1 在 Adobe Photoshop 中编辑图像\n\n页面上一张精美的图片无可替代。图形能吸引读者的注意力，并让观众聚焦于你的信息。图形需要清晰、干净，并在页面中“脱颖而出”。\n\
  \n所有照片，尤其是那些在摄影棚外拍摄的照片，都需要一些校正——即便是用高端数码相机拍摄的图像也不例外。你可以在 Photoshop 的 Camera Raw\
  \ 转换器中打开图像，并应用编辑功能执行以下操作：\n\n*   在“基本”面板中，调整色温。\n*   在“基本”面板中，调整曝光和对比度。\n*   在“基本”面板中，调整高光和阴影。\n\
  *   在“基本”面板中，调整饱和度、清晰度和自然饱和度。\n*   在“镜头校正”面板中，使用相机配置文件并进行镜头校正。\n*   使用拉直工具拉直照片，使其不偏离地平线。\n\
  *   如果你必须使用一张无法在 RGB 模式下改善的照片，请将其转换为黑白，或创建一张高调照片并应用棕褐色调（参见图 16-1）。\n\n    ![A432409_1_En_16_Fig1_HTML.jpg](img/A432409_1_En_16_Fig1_HTML.jpg)\n\
  \n    图 16-1. 左侧为原始图像。右侧为同一图像转换为灰度、创建高调图像并应用棕褐色调后的效果\n\n## 16.2 创建缩略图草图\n\n软件开发者们不断为平板电脑推出草图程序，希望主导市场。近期研究表明，超过\
  \ 66% 的平面设计师仍然更喜欢使用素描本和 2 号铅笔这种传统方法。\n\n在设计新概念时，通过坐在沙滩上、在山间休息、骑自行车或做任何其他能帮助你放松的活动来解放你的思绪。一天结束时，在约\
  \ 2.5 英寸的方块内创建 50 个缩略图草图。快速绘制它们，如果你不擅长绘画，可以使用简笔人物。你可能会讨厌所有的草图（参见图 16-2）。\n\n![A432409_1_En_16_Fig2_HTML.jpg](img/A432409_1_En_16_Fig2_HTML.jpg)\n\
  \n图 16-2. 为一个新概念画出缩略图草图\n\n去睡觉，第二天早上起床后，回顾你的草图。挑出三四个你认为有可行性的草图，并绘制一些粗略稿。挑选出你认为最适合的设计，然后去你的电脑前开始创建图形并整合你的设计。\n\
  \n## 16.3 使用网格\n\n在 InDesign 的母版页上创建一个主网格。在浏览文档时，你可能需要修改单个页面的网格。选择 `布局 ➤ 边距和分栏`，并在“栏”区域的“数量”文本框中输入一个值。从顶部标尺拖出标尺线以创建水平参考线（参见图\
  \ 16-3）。\n\n![A432409_1_En_16_Fig3_HTML.jpg](img/A432409_1_En_16_Fig3_HTML.jpg)\n\
  \n图 16-3. 一个七栏网格。\n\n## 16.4 使用黄金比例\n\n自然界中的图案遵循着被称为“黄金比例”或“黄金分割”的路径。找到一张你可以从网上下载的、具有黄金比例形状的矢量艺术图。将此图放在其自己的图层上，并使用图层面板显示/隐藏该图。在页面中工作时，放置元素使其沿着黄金比例路径排列。你可以翻转黄金比例模板，并根据布局将其顺时针或逆时针旋转（参见图\
  \ 16-4）。\n\n![A432409_1_En_16_Fig4_HTML.jpg](img/A432409_1_En_16_Fig4_HTML.jpg)\n\
  \n图 16-4. 图层上的黄金比例有助于在页面上定位元素\n\n黄金比例可能并不适用于每个页面，但它可以在许多布局中提供帮助。在文档页面中尝试使用它，它可以为你提供一些微调文本框架和对象的线索。\n\
  \n## 16.5 考虑方向与动感\n\n布局中的每个页面都应将读者引入页面。大段的文字对读者来说并不有趣。你需要添加一些技巧使页面更有趣。添加空白区域和对象，并定位元素，使其将读者的注意力保持在页面中心。对于图像，让照片中的人物视线朝向页面中心，而不是偏离页面。对于文字，你可以混合对齐方式，使文字对齐暗示朝向中心的方向（参见图\
  \ 16-5）。\n\n![A432409_1_En_16_Fig5_HTML.jpg](img/A432409_1_En_16_Fig5_HTML.jpg)\n\
  \n图 16-5. 文字和图像的对齐方式可以帮助读者聚焦于页面中心\n\n## 16.6 了解色彩心理学\n\n色彩被创造性地用于在设计里捕捉某种情绪或情感。在选择颜色时，要注意这些颜色所代表的情绪或情感类型（参见图\
  \ 16-6）。\n\n![A432409_1_En_16_Fig6_HTML.jpg](img/A432409_1_En_16_Fig6_HTML.jpg)\n\
  \n图 16-6. 显示原色和互补色的色轮\n\n*   暖色：红色、橙色和黄色。这些颜色代表幸福和热情，并传达出一种力量感和活力感。\n*   冷色：蓝色、紫色和绿色。这些颜色代表平静、稳定和专业性。它们能建立信任感。\n\
  *   互补色：这些颜色在色轮上位置相对。例如，红色和绿色是互补色。\n\n## 16.7 运用字体和谐\n\n正如色彩能营造情绪和情感一样，字体选择同样影响着设计的情感表达。选择能够帮助你传达信息且相互协调的字体。你可以通过互联网搜索找到大量关于字体排印学的信息。搜索哪些字体搭配起来效果好。在网页浏览器中，搜索“搭配效果好的字体”或类似的检索词。你经常会发现一些提供\
  \ 10 到 20 种字体组合建议的文章。将感兴趣的文章转换成 PDF 文档，并在创建新设计项目时将它们放在手边。\n\n如果你没有设计经验，或许可以先坚持使用十种搭配效果最好的顶级字体。随着你对字体排印学了解得更多，你可以拓宽你的字体选择范围。\n\
  \n## 16.8 在 Adobe Bridge 中添加元数据\n\n数字出版文档中的 Alt 标签对于依赖屏幕阅读器阅读数字内容的视觉障碍人士尤其重要。设计中的所有对象和图像都应该有对每个图形的描述。\n\
  \n### 在 Adobe Bridge 中打开图像\n\n你可以通过在 Adobe Bridge 中打开所有图像来加快工作流程。\n\n1.  在将所有照片和矢量艺术图像导入\
  \ InDesign 之前，将它们放在一个文件夹中。 \n2.  打开 Adobe Bridge 并导航到你的图像文件夹。 \n3.  单击每个图像，然后在 Bridge\
  \ 窗口右侧打开“元数据”选项卡。 \n4.  在“IPTC 核心”类别中，在“说明”字段中输入描述该图像的描述性文本正文。 \n5.  在出版物中选择每个图像，然后选择\
  \ `对象 ➤ 对象导出选项`。 \n6.  在 `对象导出选项` 对话框中，单击 `Alt 文本` 选项卡（参见图 16-7）。\n\n    ![A432409_1_En_16_Fig7_HTML.jpg](img/A432409_1_En_16_Fig7_HTML.jpg)\n\
  \n    图 16-7. `对象导出选项` 对话框 \n7.  打开 `Alt 文本来源` 菜单，并选择 `来自 XMP-说明` 选项。 \n8.  所有图像和对象都被标记后，导出你的文件。\n\
  \n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例，将给定的英文文本翻译成中文。\n\n\n## 16.9 使用 InDesign 脚本\n\
  \n使用 `InDesign` 脚本可以极大地帮助创建版面。通过安装和运行脚本，你可以加快工作进度。搜索互联网可以找到大量免费的或只需象征性购买的 `InDesign`\
  \ 脚本。\n\n在浏览互联网时，请登录 [`www.indesignsecrets.com`](http://www.indesignsecrets.com)。`InDesign\
  \ Secrets` 网站拥有丰富的信息，专门为 `InDesign` 用户提供提示和技巧。该网站还有大量关于 `InDesign` 脚本的文章，并且提供了一些可供下载的脚本。\n\
  \n## 使用 InDesign 脚本\n\n下载脚本后，你需要将其安装在正确的文件夹中。\n\n1.  在 `InDesign` 中打开 `脚本面板`。`InDesign`\
  \ 脚本有两个位置：`应用程序`文件夹和`用户`文件夹。选择 `用户` 文件夹。\n2.  在 Windows 上，选择 `在资源管理器中显示` 以找到 `脚本`\
  \ 文件夹。（在 Macintosh 上，选择 `在访达中显示`。）该文件夹将在你的桌面上打开。\n3.  将要添加的新脚本复制到该文件夹中，或者在 `用户`\
  \ 文件夹内创建一个新文件夹，然后复制要添加的脚本（见图 16-8）。\n\n![A432409_1_En_16_Fig8_HTML.jpg](img/A432409_1_En_16_Fig8_HTML.jpg)\n\
  \n图 16-8. 打开 `脚本面板` 并选择 `用户`。打开 `脚本面板` 菜单并选择 `在资源管理器中显示`（Windows）或 `在访达中显示`（Macintosh）\n\
  \n## 16.10 打包文件\n\n在处理文档时，你可能会忘记导入到 `InDesign` 中的图像和其他资源的位置。如果你更改了资源的文件位置，则在打开文档时，`InDesign`\
  \ 会报告链接缺失。\n\n完成出版物后，让 `InDesign` 帮你组织出版物中的所有内容。选择 `文件 ➤ 打包`。在 `打包` 对话框中，查看摘要信息，然后单击\
  \ `打包`。`InDesign` 会告知你内容将被添加到的文件夹名称。你可以接受默认文件夹或更改文件夹名称。在最后一个屏幕中单击 `打包`，`InDesign`\
  \ 文件、所有资源和所有字体都将被添加到一个文件夹中。\n\n当你想要进行编辑时，可以删除原始文件夹并使用打包的文件夹。由于字体也已复制到该文件夹，当你重新打开文档时，就不会有任何缺少字体的问题了。\n\
  \n## 16.11 总结\n\n在本章中，你学习了一些设计技巧，可以为你的交互式文档创建更好的版面。你对设计和排版了解得越多，你的文档就会显得越专业。\n\n\
  在下一章中，我们将探讨一些项目构想。\n\n"
- '# 17. 更多项目构想


  你可能出于专业需求需要创建数字出版物，但使用 `InDesign` 的工具来创建各种文档（你可以与同事、朋友、家人和合作伙伴发布和分享）会更有趣。你越多地使用本书中介绍的方法，你就会开发出越多的应用程序来创建文档，不仅限于专业用途，也可用于休闲娱乐。


  ## 17.1 撰写你的自传


  许多人常说，“你应该写本书。”人们常常认为自己的过往经历非常有趣，以至于应该将这些事件记录在出版物中。如果你曾想过写这样一本书，那么现在就是时候了。


  你可以创建一个可重排的 `EPUB`，并添加照片、音频和视频来编写一个有趣的故事。这可能不会被出版社看中，进而改编成汤姆·汉克斯或詹妮弗·劳伦斯主演的电影，但你很可能会从认识你的人那里得到很多赞誉。


  从一个个人故事开始你的写作生涯，并与朋友和家人分享。


  ## 17.2 创作一本儿童读物


  构思一个可能让你的孩子或家人感兴趣的故事，并规划一本交互式图书。儿童读物有很多图片，当你添加动画和音频时，孩子们会在平板电脑上玩上一整天（见图 17-1）。


  ![A432409_1_En_17_Fig1_HTML.jpg](img/A432409_1_En_17_Fig1_HTML.jpg)


  图 17-1. 一本儿童读物的封面


  不必担心自己不是一位伟大的艺术家。有些卡通人物看起来根本就不像 DC 漫画的绘图。你可以先从搜索互联网上的人物和动物角色画开始。下载一些图像文件，并将它们用作
  `Adobe Illustrator` 等绘图程序中的模板。如果不用于公开发行，则无需担心版权问题。修改这些图画，使其与你下载的图像略有不同，这样就没什么问题了。


  将图像文件导入 `InDesign`。至于文本，可以参考一些儿童读物，了解特定年龄段的孩子在每页上应该有多少文本。对于年幼的孩子，一行文本就足够了。


  使用运动路径为对象添加动画效果，并引入声音。你可以从互联网上的许多网站下载免版税的声音。最重要的是构思一个孩子们感兴趣的故事，或许还能传递一些信息。


  完成设计后，创建一个固定版式的 `EPUB` 并将其加载到平板电脑上。这可能需要一些功夫，但孩子们会享受它一段时间。不过要注意，他们可能会要求你写更多的书。


  ## 17.3 创建一本 EPUB 食谱


  这是整理你一些最喜爱食谱的好方法。包括传统的配料表、准备时间和烹饪时间，你还可以添加视频。当你在厨房准备一些最喜爱的菜肴时，拍摄视频。在 `Adobe Media
  Encoder` 中优化视频，并将它们放入 `InDesign` 文档中。


  这个项目可以随着时间的推移持续开发。将你的文件放在手边，当你拍摄了新视频时，将其连同文本和照片一起添加到文档中。当你准备发布时，将文件导出为固定版式的 `EPUB`。对于喜欢你的美食的朋友来说，这可能会是一份不错的圣诞礼物。


  ## 17.4 制作一张圣诞贺卡


  说到圣诞节（或任何其他场合），你可能想考虑制作一张贺卡。你可以在卡片中添加视频、照片和音频，并与你圣诞名单上的所有人分享这张卡片。


  使用 `Adobe Publish Online` 发布文档。向你名单上的人发送一封包含 `URL` 的电子邮件，这样他们就可以查看你的贺卡了。


  ## 17.5 分享活动邀请函


  你可能有一个社交聚会、公司野餐、派对、婚礼、周年纪念或其他特殊场合的邀请函，你想邀请精选的朋友和家人前来。当你添加动画时，这份邀请函会得到很多关注。


  创建一个 `Adobe Publish Online` 文档，并与你想邀请参加活动的人分享 `URL`。


  ## 17.6 在 Facebook 上发布活动


  如果你不需要限制特定活动的受众——比如体育赛事、足球比赛、当地小学的儿童剧、政治集会或其他此类活动——你可能想让很多人知道这个消息。


  创建一个带有一些特色的动画文档。让它变得有趣，这样人们就会想看它好几次。


  使用 `Adobe Publish Online` 发布文档，并在你的 Facebook 时间线上分享该文件。定期查看你的 Facebook 账户，看看你获得了多少个赞。




  ## 17.7 创建动态商业图表


  如果你在一家公司工作、担任董事会成员，或者想为需要创意商业图表的朋友提供帮助，可以使用 InDesign 中的动画功能，精心设计一个能清晰展示图表信息的方案。


  你可以创建动态的柱状图、爆炸式饼图、动画折线图，以及任何你认为合适的图表呈现方式。


  将动画复制到新文档中，并导出为 SWF（播放器）文件。将 SWF 文件导入 InDesign 文档，然后导出为交互式 PDF。你可以在笔记本电脑上展示该图表，或将
  PDF 发送给其他用户。


  ## 17.8 在文档中使用 QuickTime VR 影片


  要创建 QuickTime VR 影片文件，你需要一款能将照片拼接在一起以最终生成影片文件的程序。可以使用像 Pano2VR 这样的程序，你可以从 [`http://ggnome.com/pano2vr`](http://ggnome.com/pano2vr)
  下载。你可以使用该程序的演示模式进行试用，无需购买。在演示模式下，生成的文件会显示水印。如果你购买了该程序，水印就会消失。


  以 360° 视角拍摄多张照片，然后在 Pano2VR 中将它们拼接起来。你可以在想要出售的房屋内部拍照。生成影片文件后，将其置入 InDesign 并导出为交互式
  PDF。


  你可以通过点击并拖动鼠标来滚动浏览影片文件的 360° 视图。


  ## 17.9 在 Photoshop 中拼接全景文件


  拍摄多张全景场景的照片。使用三脚架，并让每张照片重叠约 25%。将相机以竖拍模式放置在三脚架上，拍摄一系列照片。


  在 Adobe Photoshop 的 Camera Raw 对话框中打开所有照片。选择屏幕最左侧胶片中的所有照片，然后从下拉菜单中选择 `合并到全景图`，或按
  `Ctrl/⌘+M`。在 Photoshop 中打开合并后的照片，根据需要进行裁剪和降采样。


  将全景图像置入 InDesign，然后在 `选项` 菜单的 `固定布局导出选项常规` 窗格中选择 `将跨页转换为横向`。


  ## 17.10 通过 Dropbox 共享多个 URL


  如果你有几个使用 Adobe Publish Online 创建的文档，你可能希望轻松访问它们，并定期向他人提供文件链接。为了追踪这些文件和 URL，请创建一个包含每个
  URL 的纯文本文档。


  将该文档放入 Dropbox 的 `Public` 文件夹中，用户可以请求获取 URL 地址，或者你可以指导用户下载文件。当他们用文本编辑器打开该文档时，只需点击某个
  URL 即可访问相应文件。这适用于固定布局、PDF 或 Adobe Publish Online 文档。对于固定布局和 Adobe PDF 文件，你需要将它们上传到
  Dropbox 的 `public` 文件夹。


  ## 17.11 总结


  在本章中，我提供了一些项目创意。你可以从其中一个项目入手，然后运用想象力构思你想要着手进行的其他项目。InDesign 非常强大，唯一的限制就是你自身的想象力。只要你能想象到，几乎都能在
  InDesign 中创建出来。


  如果你是 InDesign 和/或创建交互式文档的新手，希望本书能帮助你入门。你练习得越多，就越能熟练掌握 Adobe InDesign。


  我鼓励你在互联网上探索，并访问 [`www.InDesignSecrets.com`](http://www.indesignsecrets.com) 获取使用
  InDesign 的技巧、窍门和有用的指导教程。此外，还可以访问 [`www.epubsecrets.com`](http://www.epubsecrets.com)
  获取创建 EPUB 的有用信息。另一个获取优质信息的来源是 [`http://creativepro.com`](http://creativepro.com)。在这个网站上，你可以学到许多使用
  InDesign 的技巧和方法，以及关于设计和排版的实用理念。


  我衷心希望你能发现本书所含信息的有用之处和价值。如果你有任何问题或意见，请发送电子邮件至 `ted@tedpadova.com`。




