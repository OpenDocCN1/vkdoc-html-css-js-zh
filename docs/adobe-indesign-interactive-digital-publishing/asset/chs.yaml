  \ 图 6-24。单击 `Words` 并从下拉菜单中选择 `En Spaces`\n8.  添加一个新嵌套样式。单击 `New Nested Style` 按钮，并在菜单中选择\
  \ `Author`。在我的示例中，我为 `Author` 添加了一个字符样式。\n9.  设置分隔符。单击 `through` 打开一个下拉菜单，并在菜单中选择\
  \ `Up To`。我们在左括号字符之前停止上一个字符样式。在 `Words` 文本框中键入一个左括号字符。\n10. 创建一个新嵌套样式。单击 `New Nested\
  \ Style` 按钮，并在下拉菜单中选择 `Year Published`。单击 `through` 打开下拉菜单并选择 `Up To`。单击 `Words`\
  \ 并键入一个右括号字符。在我的示例中，我添加了另一个字符样式并将其命名为 `Year Published`。\n11. 单击 `OK` 并应用样式。在另一个要使用相同嵌套样式的段落中单击光标。在图\
  \ 6-25 中，你可以看到我用于其余段落的嵌套样式格式。\n\n    ![A432409_1_En_6_Fig25_HTML.jpg](img/A432409_1_En_6_Fig25_HTML.jpg)\n\
  \n    图 6-25。在一个段落中单击光标，然后在段落面板中单击样式名称以将样式应用于该段落\n\n#### 6.4.2.4 创建嵌套行样式\n\n假设你想要更改引导段落的章节标题中前几行的字符属性。例如，将前几行文本设置为全部大写或小型大写字母。如果你为全部大写或小型大写字母设置了一个字符样式，并将其应用于前两行文本，如图\
  \ 6-26 所示，那一切都没问题。\n\n![A432409_1_En_6_Fig26_HTML.jpg](img/A432409_1_En_6_Fig26_HTML.jpg)\n\
  \n图 6-26. 前两行文本是小型大写字母\n\n你可以将该字符样式包含在一个段落样式中，并将同一样式应用于文档中的多个段落。然而，问题是，如果你将该样式应用于两栏或三栏布局中的段落，或者你调整了文本框的大小使其变大或变小，会发生什么？\n\
  \n在图 6-27 中，你可以看到当我们调整文本框大小以适应两栏布局时发生的情况。两栏布局中的小型大写文本贯穿了几乎五行文本。\n\n![A432409_1_En_6_Fig27_HTML.jpg](img/A432409_1_En_6_Fig27_HTML.jpg)\n\
  \n图 6-27. 限制在两栏布局中的文本显示小型大写字母跨越了超过两行\n\n我们可以通过创建嵌套行样式来克服这个问题。\n\n#### 创建嵌套行样式\n\n\
  要创建嵌套行样式，请遵循以下步骤：\n\n1.  创建一个字符样式。在我的示例中，我为小型大写字母创建了一个字符样式。你可以在 `Basic Character\
  \ Formats` 窗格的 `Case` 下拉菜单中找到 `Small Caps` 选项。\n2.  打开 `Paragraph Style Options`。在我的示例中，段落样式名称为\
  \ `1^(st) Body Copy`。右键单击 `Paragraph Styles` 面板中的样式名称，并选择 `Edit \"1^(st) Body Copy\"\
  `。\n3.  打开 `Drop Caps and Nested Styles` 窗格。单击左窗格中的 `Drop Caps and Nested Styles`。\n\
  4.  创建一个新的嵌套行样式。单击对话框底部的 `New Line Style`，并选择 `Small Caps` 字符样式。单击 `1`（表示行数）并键入\
  \ `2`，如图 6-28 所示。\n\n    ![A432409_1_En_6_Fig28_HTML.jpg](img/A432409_1_En_6_Fig28_HTML.jpg)\n\
  \n    图 6-28。添加一个新的嵌套行样式\n5.  单击 `OK` 并将该样式应用于一个新段落。在图 6-29 中，你可以看到该样式应用于两个不同的分栏。注意，小型大写字母仅出现在每个文本块的前两行文本中。\n\
  \n    ![A432409_1_En_6_Fig29_HTML.jpg](img/A432409_1_En_6_Fig29_HTML.jpg)\n\n  \
  \  图 6-29。在一个段落中单击，然后点击包含该嵌套行样式的段落样式\n\n\n\n## 6.5 创建列表样式\n\n`InDesign` 为您提供了许多创建列表的选项。您可能已经创建过项目符号列表或编号列表，并发现某些编辑任务有些令人困惑。也许您想更改项目符号样式或让数字右对齐。经过一番令人沮丧的尝试后，您可能放弃了创建列表，转而使用制表位标尺来格式化列表。我知道你们中的一些人可能这样做过。我知道你们就在那里。我不会告诉任何人。这是我们之间的秘密。希望读完本节后，您无需再为创建列表而采用这类变通方法。\n\
  \n### 6.5.1 创建项目符号列表样式\n\n创建项目符号列表时，项目符号在文本框架内是无法编辑的。项目符号的指定方式有以下几种：单击`控制面板`中`段落`设置里的`项目符号列表`图标；从`文字`菜单中选择`项目符号和编号`；单击`控制面板`中最右侧的图标并从下拉菜单中选择`项目符号和编号`；或者通过添加新的段落样式。列表在`InDesign`中随处可见，并且您有多种方法可以创建它们。在本练习中，我们将在`段落样式面板`中进行操作。\n\
  \n在图 6-30 中，您可以看到一个未设置格式的文本框架（上方），以及添加了用于设置首字下沉和项目符号列表的段落样式后的效果（下方）。\n\n![A432409_1_En_6_Fig30_HTML.jpg](img/A432409_1_En_6_Fig30_HTML.jpg)\n\
  \n图 6-30。\n\n格式化的文本（下方）包含一个用于项目符号列表的段落样式 创建项目符号列表样式\n\n以下是创建格式化列表的方法：\n\n1.  创建一个字符样式。在我的示例中，我为首字下沉和颜色创建了一个字符样式。我可以在首字下沉和项目符号中应用同一个字符样式。我只更改了首字下沉的颜色和字偶间距，以使首字下沉与文本保持一点距离。字偶间距不会影响项目符号字符，您唯一能看到的变化就是项目符号的颜色。\n\
  2.  创建一个新的段落样式。按住`Alt 键/⌥键`并单击`段落样式面板`中的`创建新样式`图标。为样式键入一个名称，然后在左侧面板中点击`项目符号和编号`。\n\
  3.  选择项目符号字符。`InDesign` 会为您提供一个不同项目符号样式的列表。默认样式是一个圆点。这些样式看起来都不太好，因此我们可以通过添加一个新字符来修改样式。在`段落样式选项`对话框中点击`添加`，如图\
  \ 6-31 所示。此时会打开一个与`字形面板`非常相似的对话框。\n\n    ![A432409_1_En_6_Fig31_HTML.jpg](img/A432409_1_En_6_Fig31_HTML.jpg)\n\
  \n    图 6-31。\n\n    在`段落样式选项`对话框的`项目符号和编号`窗格中点击`添加`\n4.  选择字体。在我的示例中，我通过打开`字体系列`下拉菜单并选择`Wingdings`字体来选取该字体。\n\
  5.  选择一个字符。找到您想要的字符并双击，或者点击`添加`按钮，然后点击`确定`。您将返回到`段落样式选项`对话框，新字符会出现在`项目符号字符`列表中。选择该字符即可将默认值替换为您的新字符。\n\
  6.  调整项目符号和文本的位置。在`段落样式选项`对话框的`项目符号或编号位置`中，您可以看到针对`左缩进`、`首行缩进`和`制表符缩进`的调整选项。确保选中`预览`复选框，然后根据您的喜好调整项目符号和文本的位置。当您编辑这些值时，会看到结果的动态预览。点击`确定`。将此样式应用到您的段落，您应该会看到一个类似于图\
  \ 6-30 所示的列表。\n\n与其他段落样式一样，您可以选择文本，然后在`段落样式面板`中点击`项目符号列表`样式，以将该样式定义应用到其他段落。\n\n\
  ### 6.5.2 创建编号列表样式\n\n创建编号列表与创建项目符号列表的操作非常相似。如果您希望编号的格式与列表文本不同，则可以定义一个字符样式。然后创建一个新的段落样式，并在`新建段落样式`对话框中进行调整（见图\
  \ 6-32）。\n\n![A432409_1_En_6_Fig32_HTML.jpg](img/A432409_1_En_6_Fig32_HTML.jpg)\n\
  \n图 6-32。\n\n为编号列表创建新样式\n\n如图 6-32 所示，在`列表类型`中选择了`编号`。我为编号创建了一个字符样式，并从`字符样式`下拉菜单中选择了`编号列表`字符样式。此样式仅更改了编号的颜色。在`段落样式选项`对话框的底部，我对编号的位置进行了调整。点击`确定`，新样式便创建完成。您可以像应用项目符号列表样式一样，将此样式应用到列表中。选择文本，然后在`段落样式面板`中点击段落样式名称即可。\n\
  \n默认情况下，每次将同一样式应用到不同的文本主体时，`InDesign` 都会生成新的编号。如果出于某种原因，编号从第一个文本主体延续到了新的编号列表，请选择`文字`\
  \ ➤ `项目符号和编号列表` ➤ `重新开始编号`。\n\n如果您想将编号列表转换为可编辑的文本，请选择该列表，然后选择`文字` ➤ `项目符号和编号列表`\
  \ ➤ `将项目符号和编号转换为文本`。\n\n### 6.5.3 对齐数字\n\n由于您无法选择编号列表中的数字，因此无法更改对齐方式或为数字设置制表符。您需要返回到`段落样式选项`对话框，或者从菜单中选择`项目符号和编号`。如果您有一个应用了样式的编号列表，例如图\
  \ 6-33 顶部的列表，您可以编辑该段落样式（或创建一个新样式）并更改数字对齐方式。在图 6-33 的底部，您可以看到`对齐`菜单命令设置为`右对齐`，并且位置选项也略有更改，以创建您所看到的外观。\n\
  \n![A432409_1_En_6_Fig33_HTML.jpg](img/A432409_1_En_6_Fig33_HTML.jpg)\n\n图 6-33。\n\
  \n数字右对齐\n\n## 6.6 使用对象样式\n\n版面中的每个元素都是一个对象。文本存在于文本框架内，而框架就是对象。您置入`InDesign`的文件是对象。您在`InDesign`中绘制的任何内容都是对象。描边也是对象。更改对象的属性时，您可以将这些格式设置捕获到对象样式中。为文本框架添加填充和透明度，您可以将填充和透明度包含在对象样式中。为对象应用文本绕排，您可以将文本绕排设置添加到对象样式中。应用我在第\
  \ 4 章中介绍的任何效果，您都可以将这些效果属性添加到对象样式定义中。创建对象样式时，您在`新建对象样式`对话框中设置对象样式属性。在这个对话框中，您会发现大量的开关和选项。\n\
  \n在创建对象样式时，您无法应用的设置非常少。在对象样式中无法控制的内容包括对象在页面上的大小和位置。某些变换操作也无法包含在对象样式中。您无法修改或创建色板、创建渐变或创建颜色的淡印。与对象样式能够实现的功能相比，这个限制列表非常简短。\n\
  \n\n\n### 探索“对象样式选项”对话框\n\n要了解 `对象样式选项` 对话框中可用的选项，我们先从简单的开始。在图 6-34 中，你可以看到我为章节编号文字应用的一些效果。我对文字使用了投影和浮雕效果。当对文字应用此类效果时，你需要将文字转换为轮廓，或者选中文本框再应用效果。你不能选中文本框内部的文字然后直接应用效果。\n\
  \n![A432409_1_En_6_Fig34_HTML.jpg](img/A432409_1_En_6_Fig34_HTML.jpg)\n\n**图 6-34.**\
  \ 包含投影、斜面和浮雕效果的文字\n\n在此示例中，我为文字创建了一个段落样式。文字位于一个单独的文本框中，你可以将该独立文本框锚定到显示其余文字的文本框上。设置好文字属性和文本框位置后，选中文本框并打开\
  \ `对象样式` 面板。按下 `Alt/⌥` 键并点击 `创建新样式` 图标，即可打开 `对象样式选项` 对话框，如图 6-35 所示。\n\n![A432409_1_En_6_Fig35_HTML.jpg](img/A432409_1_En_6_Fig35_HTML.jpg)\n\
  \n**图 6-35.** `Alt/⌥`+点击 `对象样式` 面板中的 `创建新样式` 图标以打开 `对象样式选项` 对话框\n\n如你所见，`对象样式选项`\
  \ 对话框中有许多可供编辑的选项。这些选项包括：\n\n- 在对话框顶部，你可以为样式输入名称。注意，你还有一个快捷键选项。按下 `Ctrl/Command`+`Alt/⌥`+`Shift`\
  \ 与（数字小键盘键）的任意组合，即可添加快捷键。\n- 在对话框左侧，有各种可以包含在样式定义中的选项。请注意，默认情况下段落样式会显示一条水平线。这表示该选项不会被包含在对象样式定义中。由于我在打开\
  \ `对象样式选项` 对话框之前添加了段落样式，因此我希望将该段落样式包含到定义中。单击一次复选框，水平线会变为对勾标记，表示该段落样式将被包含在对象样式定义中。\n\
  \n> **注：** 复选框中的水平线与未勾选的复选框含义相同。水平线代表中性设置，与该选项相关的任何内容均不包含在样式定义中。\n\n- 在 `基本属性` 下方，你会看到一系列效果。我为对象添加了投影、斜面和浮雕，因此这些项被包含在样式定义中。\n\
  - 需要理解的一点是，当你看到复选框中有水平线或没有任何标记时，这两种情况本质上是一样的。带有这些标记的项不会被包含在样式定义中。假设你想在样式定义中只包含单个项，`文本绕排`\
  \ 就是一个很好的例子。要将所有选项都改为水平线，请按下 `Alt/⌥` 键并点击 `文本绕排与其他`。此操作会使文本绕排项被禁用（以水平线表示）。再次按下 `Alt/⌥`\
  \ 并点击 `文本绕排` 项，则其他所有项都会被禁用，而文本绕排项被启用。本质上，第一次点击会关闭所选中的项，第二次点击则在关闭其余项的同时开启该项。当你应用带有此定义的对象样式时，唯一应用到对象上的就是文本绕排。\n\
  - 在效果下方是 `导出选项`。这些选项与通过选择 `对象` ➤ `对象导出选项` 打开的 `对象导出选项` 对话框中的选项相同。我将在第 12 章讲解如何将文档导出为可重排\
  \ EPUB 时，更详细地介绍 `对象导出选项`。目前，只需知道这些选项位于 `对象样式选项` 对话框中即可，我们会在后面的第 12 章探讨它们对于可重排 EPUB\
  \ 的重要性。\n- 在右侧，你看到的是 `样式设置` 列表。点击向右的箭头可以深入查看嵌套项。`对象样式选项` 的这个区域是信息性的。你可以查看到对象样式定义中每一项所使用的设置。\n\
  \n乍一看，`对象样式选项` 对话框可能有点吓人。它是 InDesign 中最大的对话框之一，并且充满了各种选择。学习如何使用 `对象样式选项` 的最佳方法就是直接上手并开始创建对象样式。这正是我们在下一节“创建和应用对象样式”中要做的事情。\n\
  \n\n\n### 6.6.2 创建并应用对象样式\n\n格式化一个对象可能会花费不少时间。如果你想将相同的格式应用于另一个对象，就必须重复这些步骤，或者在某些情况下，可以复制一个已格式化的对象，然后用新内容替换原有内容。所有这些都比实际需要的工作量大得多。借助对象样式，你可以让\
  \ InDesign 替你完成大部分工作。\n\n在图 6-36 中，你会看到一个包含文本的对象框架、一个内嵌对象以及应用于该框架的效果。这个对象非常适合创建对象样式。\n\
  \n![A432409_1_En_6_Fig36_HTML.jpg](img/A432409_1_En_6_Fig36_HTML.jpg)\n\n图 6-36.\
  \ 一个已格式化并准备好创建新对象样式的对象\n\n#### 创建对象样式\n\n要为类似对象创建对象样式，请执行以下操作：\n\n1.  **格式化一个对象。**\
  \ 与我们创建段落样式和字符样式的方式类似，最好是先打造出你想要的精确外观，然后再创建样式。在图 6-36 中，我创建了一个对象框架，添加了一些文本，并应用了一个段落样式。我选取了两个对象，将它们编组，然后将该组内嵌到文本段落的最后一行。我向框架添加了投影、斜面和浮雕效果，还添加了一些透明度。\n\
  2.  **创建一个新的对象样式。** 当对象外观完全符合你的要求后，选中该对象，按住 `Alt/⌥` 键，然后单击“对象样式”面板中的“创建新样式”图标。此时会打开“新建对象样式”对话框。\n\
  3.  **命名新样式。** 创建任何类型的样式时，都要养成先输入名称的习惯。在“样式名称”文本框中键入一个描述性的名称。\n4.  **添加快捷键。** 如果这是一个你会频繁在文档中使用的样式，请为其添加快捷键。与字符样式和段落样式一样，你可以使用\
  \ `Ctrl/Command`、`Alt/⌥`、`Shift` 修饰键以及键盘上的数字小键盘键。将光标点击到“快捷键”文本框中，然后按下 `Shift` 键和一个数字小键盘键。在我的示例中，我使用了\
  \ `Shift+Num 1`，如图 6-37 所示。\n\n    ![A432409_1_En_6_Fig37_HTML.jpg](img/A432409_1_En_6_Fig37_HTML.jpg)\n\
  \n    图 6-37. 键入名称并添加快捷键\n\n5.  **启用段落样式。** 如果在你的格式化中使用了段落样式，则需要在“基本属性”中启用“段落样式”项目。在我的示例中，我使用了一个段落样式，因此我点击了默认显示为水平线的复选框，勾选标记随即出现在“段落样式”旁边。这样，该选项便被启用了。\n\
  6.  **单击“确定”。** 完成“对象样式选项”的编辑后，单击“确定”。新样式便会添加到“对象样式”面板中。\n7.  **应用该样式。** 点击另一个对象，然后在“对象样式”面板中单击该对象样式的名称，或按下对应的快捷键。在图\
  \ 6-38 中，你可以看到左侧是用于捕获样式的原始框架，中间是一个新的布局，右侧则是将样式应用于新布局后的效果。\n\n    ![A432409_1_En_6_Fig38_HTML.jpg](img/A432409_1_En_6_Fig38_HTML.jpg)\n\
  \n    图 6-38. 原始框架（左），新布局（中），应用样式后，以及右侧显示快捷键的“对象样式”面板\n\n### 6.6.3 创建单一属性的对象样式\n\
  \n有时你可能只想在对象样式定义中使用单个格式化属性。例如，你可能想在所有框架上都应用一个转角效果。然而，这些框架可能还具有其他不同的属性，比如框架填充颜色、描边值等等。当你创建一个对象样式时，InDesign\
  \ 会自动启用多项样式属性。你需要关闭除所需样式属性之外的所有其他属性。\n\n#### 创建包含单一属性的样式\n\n要创建包含单一属性的样式，请遵循以下步骤：\n\
  \n1.  **创建一个新的对象样式。** 在编辑单一属性时，你不需要先格式化对象再创建对象样式。\n2.  **命名样式并指定快捷键**，如果你会频繁使用该样式的话。\n\
  3.  **选择单个样式属性。** 按住 `Alt/⌥` 键并点击你想编辑的项目旁边的复选框。再次按住 `Alt/⌥` 键并点击以启用该项目。\n4.  **编辑该项目的选项。**\
  \ 在我的示例中，我只想使用转角效果。我希望样式的其他属性在使用时保持中性或不受影响。点击该属性的名称，右侧窗格会随之变化。点击左侧窗格中的“描边与转角效果”。在“新建对象样式”对话框中会显示该效果的所有选项。在我的示例中，我为对象的右上角和左下角添加了\
  \ 16 像素的圆角。设置如图 6-39 所示。完成后单击“确定”，新样式便会添加到“对象样式”面板中。\n\n    ![A432409_1_En_6_Fig39_HTML.jpg](img/A432409_1_En_6_Fig39_HTML.jpg)\n\
  \n    图 6-39. 直接在“新建对象样式”对话框中编辑对象属性\n\n    **注意：** InDesign CC 2017 额外增加了用于设置起始和终止箭头缩放比例的文本框。如果你使用的是\
  \ InDesign CC 2017 之前的版本，你的“描边和转角选项”会与图 6-39 所示有所不同。\n\n5.  **应用该样式。** 点击一个对象，然后点击样式名称或使用快捷键。在我的示例中，有三个框架被分配了不同的颜色和不同的描边值。当我将对象样式应用于每个对象时，唯一改变的就是转角选项，如图\
  \ 6-40 所示。\n\n    ![A432409_1_En_6_Fig40_HTML.jpg](img/A432409_1_En_6_Fig40_HTML.jpg)\n\
  \n    图 6-40. 将具有转角效果的对象样式应用于不同颜色和描边值的框架\n\n\n\n### 创建带有锚定对象的对象样式\n\n在第 5 章中，我讨论了将对象锚定到表格单元格，并指出需要使用对象样式通过\
  \ GREP 模式查找/更改向多个单元格添加对象。然而，我当时没有深入介绍如何创建用于锚定对象的对象样式。现在，是时候讨论如何将对象样式与锚定对象结合使用了。\n\
  \n在图 6-41 中，您会看到一个文本框架以及该框架中每个段落旁边的图像。这些图像被锚定到每个段落的第一行文本。要设置此文档，我们需要将一个框架锚定到相应的文本行，调整锚定选项，然后为锚定对象指定一个对象样式。\n\
  \n![A432409_1_En_6_Fig41_HTML.jpg](img/A432409_1_En_6_Fig41_HTML.jpg)\n\n**图 6-41.**\
  \ 文本框架旁边的锚定对象\n\n**使用锚定对象创建对象样式**\n\n以下是使用锚定对象创建对象样式的方法：\n\n1.  **将框架锚定到第一段文本。**\
  \ 我们从一个文本框架和一个文档页面上的框架开始此操作。单击该框架，并将蓝色小方块拖到第一行文本的第一个字符之前。您可能需要放大文档，以便将锚点定位到第一个字符的左侧。当您将锚点拖到文本框架时，会看到一个箭头，其下方和右侧有一个小的`T`字符。当您将光标移到文本框架时，光标上会出现一个竖线。将竖线移动到第一个字符的左侧。\n\
  2.  **打开“锚定对象选项”对话框。** 单击该框架，您会在右上角看到一个小锚点图标。按 `Alt`/`⌥` 并单击该图标以打开“锚定对象选项”对话框。您也可以使用\
  \ `Object` ➤ `Anchored Object` ➤ `Options` 菜单命令，或右键单击锚定对象并从上下文菜单中选择 `Anchored Object`\
  \ ➤ `Options`。\n3.  **调整锚定对象选项。** 在“锚定对象选项”对话框中，单击右上角的参考点。然后为“锚定位置”单击中间左侧的参考点。调整偏移量。在我的示例中，我输入了\
  \ `110` 作为 `X-Offset`，`-12` 作为 `Y-Offset`，如图 6-42 所示。单击 `OK` 关闭对话框。\n\n    ![A432409_1_En_6_Fig42_HTML.jpg](img/A432409_1_En_6_Fig42_HTML.jpg)\n\
  \n    **图 6-42.** 做出选择后，单击 `OK` 接受更改\n\n4.  **打开“新建对象样式”对话框。** 选择锚定对象，然后按 `Alt`/`⌥`\
  \ 并单击“对象样式”面板中的“创建新样式”图标。将打开“新建对象样式”对话框。\n5.  **编辑“新建对象样式”对话框中的选项。** 为新的对象样式键入一个名称。单击“框架适合选项”，右侧窗格将更改以显示“框架适合选项”的选择。从适合菜单中选择“按比例填充内容”，如图\
  \ 6-43 所示。单击“常规”并确保已启用“将样式应用于选定项”。单击 `OK` 创建新样式。\n\n    ![A432409_1_En_6_Fig43_HTML.jpg](img/A432409_1_En_6_Fig43_HTML.jpg)\n\
  \n    **图 6-43.** 编辑框架适合选项\n\n6.  **复制并粘贴锚定对象。** 此文档页面只有几段文本。如果我们有多个页面，并且需要向每个段落添加框架，我们可能会使用\
  \ GREP 模式来搜索文档并自动将框架添加到每个段落。不过，在这个示例中，我们只需复制粘贴几次即可。\n7.  **单击锚定对象，并按 `Ctrl`/`⌘`+`C`\
  \ 复制该对象。** 将光标单击到第二段第一个字符之前，然后按 `Ctrl`/`⌘`+`V` 粘贴。将光标插入到第三段第一个字符之前，再次按 `Ctrl`/`⌘`+`V`\
  \ 粘贴。最终结果应如图 6-41 所示。\n\n---\n\n## 6.7 创建表格单元格和表格样式\n\n当我们创建段落样式和字符样式时，我们通常先创建段落，然后创建字符样式。本质上，我们是先创建整体，再创建部分。在处理表格时，您的工作流程正好相反。我们先创建部分，再创建整体。在表格术语中，这意味着我们先创建单元格样式，然后再创建表格样式。\n\
  \n为单元格和表格创建样式的方式与创建段落样式和字符样式类似。您首先使用多种格式选项来格式化单元格，然后创建单元格样式。对于表格，工作流程是相同的。您首先使用单元格样式格式化表格，然后创建表格样式。\n\
  \n### 6.7.1 格式化表格\n\n当您准备一个需要添加单元格样式和表格样式的表格时，第一步是格式化表格中的所有内容，使其外观完全符合您的要求。在图 6-44\
  \ 中，您会看到一个格式化好的表格。所有单元格都设置了文本属性，表格有页眉行和页脚行，并且表格包含字符样式和段落样式。这是为创建单元格样式和表格样式而设置表格的第一步。\n\
  \n![A432409_1_En_6_Fig44_HTML.jpg](img/A432409_1_En_6_Fig44_HTML.jpg)\n\n**图 6-44.**\
  \ 在创建单元格样式和表格样式之前，使用所有表格和单元格属性格式化表格\n\n为单元格中的文本创建段落样式，并添加字符样式以确保样式中没有覆盖。在继续创建单元格样式之前完成此操作。\n\
  \n### 6.7.2 命名单元格样式\n\n您可以随意命名单元格样式，但如果遵循一些固定的命名约定，您的工作会轻松得多。在图 6-45 中，您会看到“表格样式选项”对话框。我们稍后将在“创建表格样式”一节中继续处理此对话框。现在，我想将您的注意力吸引到对话框底部“单元格样式”区域。请注意，有五个选项可供选择单元格样式。您需要为那些与主体样式不同的单元格格式创建单元格样式。在我的示例中，我创建了五种不同的单元格样式，并将它们命名为\
  \ `Header`、`Footer`、`Body`、`Left Column` 和 `Right Column`。当我打开“表格样式选项”对话框时，对于需要从五个下拉菜单中选取的单元格样式，就没有任何混淆了。\n\
  \n![A432409_1_En_6_Fig45_HTML.jpg](img/A432409_1_En_6_Fig45_HTML.jpg)\n\n**图 6-45.**\
  \ 一个表格样式可以为最多五个单独的项目使用单元格样式\n\n创建单元格样式时，请记住，在创建表格样式时，您需要在“表格样式选项”对话框中选取样式。如果您使用了一些不同的命名约定，可能很难为相应的菜单项选择正确的样式。\n\
  \n\n\n### 6.7.3 创建单元格样式\n\n创建单元格样式的方法与创建字符样式和段落样式类似。你首先需要格式化一个单元格，然后打开`单元格样式`面板（选择`窗口`\
  \ ➤ `样式` ➤ `单元格样式`）。\n\n将光标点击在单元格内。你无需选中单元格内容或单元格本身。只需将光标点击在单元格内，然后点击`单元格样式`面板底部的`创建新样式`图标。此时会弹出`单元格样式选项`对话框，如图\
  \ 6-46 所示。\n\n![A432409_1_En_6_Fig46_HTML.jpg](img/A432409_1_En_6_Fig46_HTML.jpg)\n\
  \n图 6-46.\n\n按住`Alt/⌥`键并点击`单元格样式`面板中的`创建新样式`图标。\n\n与在 InDesign 中创建的其他样式一样，首要任务是为此样式命名。如果你已创建了一个样式，并希望基于前一个样式来创建下一个样式，请从`基于`下拉菜单中选择一个样式名称。例如，假设你为正文文本创建了一个样式，并希望将某个单元格内的文本设为斜体。那么你可以创建一个新的单元格样式，并将其基于`正文`样式。`正文`样式中的所有属性都会添加到你的新样式中，唯一的区别就是添加了斜体文本。\n\
  \n如果你希望为某个单元格样式使用键盘快捷键，请在`快捷键`文本框中点击，然后按下 `Ctrl/⌘+Alt/⌥+Shift+`（一个`数字小键盘`键）的任意组合。\n\
  \n为表头、表尾和正文文本（即表头与表尾之间、表格左右两侧之间的所有单元格）创建单元格样式。\n\n### 6.7.4 创建表格样式\n\n在继续创建表格样式之前，请先检查你的工作。确保你已使用段落样式、字符样式和单元格样式定义了所有单元格的格式。确认所有样式均已应用后，通过点击`表格样式`面板中的`创建新样式`图标来打开`表格样式`面板（`窗口`\
  \ ➤ `样式` ➤ `表格样式`）。此时会弹出`表格样式选项`对话框，如图 6-47 所示。\n\n![A432409_1_En_6_Fig47_HTML.jpg](img/A432409_1_En_6_Fig47_HTML.jpg)\n\
  \n图 6-47.\n\n按住`Alt/⌥`键并点击`表格样式`面板中的`创建新样式`图标，即可打开`表格样式选项`对话框。\n\n为样式命名。如果你想指定键盘快捷键，请按下\
  \ `Ctrl/Command+Alt/⌥+Shift+`（一个`数字小键盘`键）的任意组合。\n\n如果希望行有交替的填充，请点击左侧窗格中的`填色`。为第一种颜色选择一种填色颜色和色调，为下一行选择另一种颜色和色调。如果你有表头和表尾，请跳过第一行和最后一行。点击`确定`，该表格样式便会出现在`表格样式`面板中。\n\
  \n### 6.7.5 应用表格样式\n\n在图 6-48 中，你看到的是一个未设置格式的表格。如果我想将表格样式应用于这个新表格，我需要选中该表格。点击单元格内的任意位置，然后按\
  \ `Ctrl/⌘+A` 进行`全选`，或者将光标置于表格的左上角。等待光标变为斜向箭头后点击，即可选中整个表格。\n\n![A432409_1_En_6_Fig48_HTML.jpg](img/A432409_1_En_6_Fig48_HTML.jpg)\n\
  \n图 6-48.\n\n一个没有格式的表格\n\n打开`表格样式`面板，点击你想要应用到所选表格的表格样式。遗憾的是，InDesign 中的表格样式并非完美无缺。你总是需要进行一些小的清理和重新格式化。在图\
  \ 6-49 中，你可以看到左上角的单元格需要清除填充颜色，并且正文行右侧的描边需要去除。当将表格样式应用于原始、未格式化的表格时，这类编辑操作十分常见。\n\n\
  ![A432409_1_En_6_Fig49_HTML.jpg](img/A432409_1_En_6_Fig49_HTML.jpg)\n\n图 6-49.\n\
  \n将表格样式应用于未格式化的表格后，需要进行一些清理工作\n\n我在格式化图 6-49 所示的表格时用到的一个小技巧是关于表尾行的。我合并了该行第一个单元格右侧的单元格。但是，我保留了表尾行的第一个单元格不变。由于左列的文字是左对齐的，如果表尾处只设一个单行，那么文字就会向左对齐。通过在表尾行保留一个无描边、无填充的单独单元格，当我应用表格样式时，表尾行就能正确格式化。重新格式化表尾行并非难题，但当文档中有大量表格时，消除额外清理工作的需要有助于你更快地完成文档编辑。\n\
  \n## 6.8 熟悉 GREP\n\n仅看到 GREP 这个名字可能就会吓到一些人。当你看到 GREP 的定义是“使用正则表达式进行全局搜索并打印”时，可能会增添几分焦虑。当你了解到\
  \ GREP 是 UNIX 系统中的命令行实用工具时，你的担忧可能就达到顶峰了。在某种程度上，如果你是一个右脑型的艺术家，对编码没什么兴趣，你的担心是有道理的。有些\
  \ GREP 表达式非常复杂，需要具备一定的编码知识和能力。然而，在 InDesign 中使用 GREP 的好处在于，有许多简单易行的例程可以让你轻松地应用于页面布局中。\n\
  \n首先，让我们从 InDesign 的角度来理解 GREP 是什么。你使用 GREP 模式来搜索文档，并用新模式、单词、字符或其他内容替换该模式。模式可以是类似日期（例如，2017\
  \ 年 1 月 1 日）这样的东西。这里的日期就是一个模式。“姓氏，名字，中间名首字母”是姓名的一种模式。以 q（或任何其他字符）开头并以 y（或任何其他字符）结尾的单词也是一种模式。几乎所有你能轻松定义的字符组合，都可以被视为一种模式。\n\
  \nInDesign 中的 GREP 可用于定位文本模式，并将这些文本替换为其他文本、更改文本格式或删除文本。举一个实际例子，你可能希望搜索括号内的所有单词，并将其字体样式更改为斜体。或者，你可能希望搜索所有电子邮件地址，并更改文本颜色或为地址添加下划线。你可能希望删除双空格或多余的回车符。所有这些例子都可以通过搜索\
  \ GREP 模式并将其替换为另一种模式来轻松处理。\n\nGREP 代码可以在`查找/更改`对话框中添加，你也可以在`段落样式选项`对话框中创建 GREP 样式。InDesign\
  \ 中没有专门用于 GREP 样式或表达式的独立面板。\n\n\n\n### 6.8.1 理解保留字符\n\nGREP 表达式看上去可能类似这样：\n\n```\n\
  (?<=\\().+?(?=\\))\n```\n\n如果我们在“查找/更改”对话框的 GREP 选项卡中输入这段代码，该表达式将搜索括号内的任何文本，但不包括括号本身。如果你更改了括号内语句的文本或字体，内容会发生变化，而括号字符保持不变。\n\
  \nGREP 表达式使用保留字符，这意味着某些字符具有特定的含义，GREP 不会将它们解释为字面意义的字符。例如，在上面的表达式中，问号 `?`、加号 `+`\
  \ 和句点 `.` 都是 GREP 的保留字符。问号 `?` 是 GREP 用来表示可能存在也可能不存在某物的代码。加号 `+` 表示一个或多个实例（例如一个或多个字符）。句点\
  \ `.` 是一个“通配符”，可以匹配任何字符。\n\n假设你想要搜索美元符号并将其替换为另一种货币的符号。美元符号也是一个保留字符。在 GREP 术语中，它表示段落结尾。如果你想再次搜索加号，就不能在\
  \ GREP 搜索中直接输入 `+`，因为 GREP 会将 `+` 解释为一个或多个实例。\n\n当你想要搜索在 GREP 中具有特殊含义的字符时，解决方法是转义保留字符。你需要输入一个反斜杠加上该字符。例如，如果我想搜索美元符号，我会输入\
  \ `\\$`；搜索加号 `+` 则输入 `\\+`；查找句点则输入 `\\.`。你也可以通过将保留字符放在方括号 `[$]` 中来转义它们。\n\n了解这些特殊字符中的许多能帮助你更好地理解\
  \ GREP。此外，知道如何转义保留字符可以帮助你调试自己创建的一些表达式。\n\n### 6.8.2 使用 GREP 搜索与查找\n\n关于 GREP 有很多内容要讨论，我希望能涵盖几个有助于设计项目的\
  \ GREP 表达式，尤其是在你希望导出为可重排 EPUB 格式时，更是如此。以下表达式不仅用于创建可重排 EPUB，在某些情况下，它们对于可重排 EPUB 格式来说是必不可少的。让我们来看几个你可能经常使用的表达式。\n\
  \n#### 6.8.2.1 消除段落末尾的空格、字符和回车符\n\n你可能会在段落末尾添加一个回车符以提供段落间距，或者你可能放置了客户创建的需要纳入设计的文本，其中包含双回车符。如果导出为可重排\
  \ EPUB 格式，EPUB 格式会忽略额外的回车符。在段落之后添加空间的唯一方法是使用段落样式，并在样式定义中调整“段后距”设置。\n\n另一件可能非常麻烦的事情是你的文档中使用了不同于设计中所包含字体的字体间距。每次打开文档时，你都会看到一个警告对话框，提示你缺少字体。\n\
  \n消除多余的空格和回车符是 GREP 查找和更改的一个很好的应用。\n\n**执行 GREP 搜索并消除字符**\n\n要执行 GREP 搜索并消除字符，请执行以下操作：\n\
  \n1.  单击一个段落或一个文章。如果要搜索包含多个文章的文档，可以跳过此步骤，并选择在“查找/更改”对话框中搜索整个文档。\n2.  按 `Ctrl/⌘+F`\
  \ 打开“查找/更改”对话框。由于我们要输入 GREP 表达式，请点击“查找/更改”对话框中的 GREP 选项卡。\n3.  在“查找内容”文本框中输入表达式。在本例中，以下表达式将查找段落末尾的空白并删除多个回车符。它非常简单，即使是最不自信的程序员也能轻松复制这个表达式：\n\
  \n    ```\n    \\s+$\n    ```\n\n    该表达式只有四个字符——一个反斜杠、一个用于表示任意空白的小写字母 `s`、一个用于表示一个或多个实例的\
  \ `+`，以及一个用于表示段落结尾位置的 `$` 符号。如果你忘记了一些保留字符，InDesign 可以帮你一点小忙。你不会在 GREP 面板中找到所有保留字符，但可以通过打开\
  \ `@` 菜单来选择许多常用定义。只输入 `\\s+`，并将 `$` 符号排除在表达式之外。点击 `@` 符号打开“查找内容”菜单，向下滚动到“位置”。在子菜单中，选择“段落末尾”，如图\
  \ 6-50 所示。`$` 符号会被添加到“查找内容”文本框的表达式后面。\n\n    ![A432409_1_En_6_Fig50_HTML.jpg](img/A432409_1_En_6_Fig50_HTML.jpg)\n\
  \n    图 6-50. 点击 @ 符号打开“查找内容”菜单，并在“位置”子菜单中选择“段落末尾”\n4.  将“更改为”文本框保留为默认值。要删除段落末尾的多余空格并删除多个段落，你可以将“更改为”文本框留空。InDesign\
  \ 会将表达式搜索并替换为空，这等同于删除空格和回车符。\n5.  点击“查找”。在尝试更改所有实例之前，先点击“查找”按钮几次来测试你的表达式。如果你通过选择\
  \ `视图 ➤ 其他 ➤ 显示隐含字符` 来显示隐藏字符，会很有帮助。\n6.  当你点击“查找”时，应该会在文档中看到第一个找到的匹配项被选中。如果出现提示未找到任何内容的警告框，请点击文章中的光标位置，然后再次点击“查找”。你可以在不关闭“查找/更改”对话框的情况下点击文档中的文本框架。\n\
  7.  全部更改。如果点击“查找”按钮时一切正常，并且你确信 InDesign 找到了你想要查找的表达式，请点击“全部更改”。在图 6-51 中，你可以看到左侧是包含问题文本的文本框架，右侧是我应用\
  \ GREP 查找/更改后修正后的结果。\n\n    ![A432409_1_En_6_Fig51_HTML.jpg](img/A432409_1_En_6_Fig51_HTML.jpg)\n\
  \n    图 6-51. 执行查找/更改后，空白和多余的段落回车符被消除了\n\n\n\n#### 6.8.2.2 格式化列表\n\n请看图 6-52。这个数字列表是一团糟。某些行插入了制表符，而其他行却使用了不同数量的空格。您的列表可能没这么乱，但如果您从客户那里获取文本文档，就会发现许多人仍然没有正确使用标尺，而是用空格来格式化列表。当您调整文本框大小时，这些格式都会乱套。这个文档需要使用\
  \ GREP 来修复。\n\n![A432409_1_En_6_Fig52_HTML.jpg](img/A432409_1_En_6_Fig52_HTML.jpg)\n\
  \n**图 6-52.** 格式混乱的编号列表\n\n为了清理这个列表，我执行了以下编辑操作：\n\n1.  创建字符样式。如果您想为编号应用与文本不同的颜色，可以创建一个字符样式。在这个例子中，我创建了一个字符样式，并且只更改了文本颜色。\n\
  2.  创建段落样式。点击“**段落样式**”面板中的“**创建新样式**”图标；此时会打开“**段落样式选项**”对话框。为这个样式输入一个名称。\n3. \
  \ 在左侧面板中点击“**项目符号和编号**”。在右侧面板中，打开“**字符样式**”菜单，为编号颜色选择字符样式，然后点击“**确定**”以创建新的段落样式。\n\
  4.  打开“**查找/更改**”对话框。按 `Ctrl/⌘` 键打开“**查找/更改**”对话框，然后点击“**GREP**”选项卡。\n5.  在“**查找内容**”文本框中添加一个\
  \ GREP 表达式。我们要搜索的是每个段落开头的一个或多个数字，后面跟一个句点（也可能没有），如果我们对数字后没有句点的行应用同样的表达式，可能还有一些空格（也可能没有），再后面是任何内容。要添加这个表达式，以下代码执行了搜索：\n\
  \n    ```\n    ^\\d+\\.?\\s*(.)\n    ```\n\n    在这段代码中，`^` 用于定位段落的开头。`\\d` 表示任意数字，`+`\
  \ 表示一次或多次。`\\.` 用于查找句点，`?` 表示句点可能存在也可能不存在。`\\s` 用于查找可能存在也可能不存在的空格。表达式末尾有一个句点。然而，这个句点出现在括号\
  \ `(.)` 中。我们需要将句点放在括号中的原因是，运行这个表达式会复制段落开头的数字。如果添加了 `(.)`，数字会被添加，但在运行“**更改/全部更改**”后会立即被删除。在“**更改为**”文本框中，您会看到\
  \ `$1`，如图 6-53 所示。这个表达式会选取括号中的内容。您需要在“**查找/更改**”对话框的底部更改格式。点击放大镜图标，会打开“**更改格式设置**”对话框。在此对话框中选择“**段落样式**”，然后点击“**确定**”返回“**查找/更改**”对话框，如图\
  \ 6-53 所示。\n\n    ![A432409_1_En_6_Fig53_HTML.jpg](img/A432409_1_En_6_Fig53_HTML.jpg)\n\
  \n    **图 6-53.** 添加“查找内容”、“更改为”和“更改格式”设置\n\n6.  点击“**查找**”按钮确保表达式找到了正确的模式，然后点击几次“**更改**”以确认替换是准确的。如果更改不起作用，您可以随时撤销。当您确认一切正常后，点击“**全部更改**”。新的格式化列表出现在图\
  \ 6-54 中。\n\n    ![A432409_1_En_6_Fig54_HTML.jpg](img/A432409_1_En_6_Fig54_HTML.jpg)\n\
  \n    **图 6-54.** 运行“全部更改”后，列表的格式发生了变化\n\n#### 6.8.2.3 保存预设（查询）\n\n如果您发现自己经常使用某个\
  \ GREP “查找/更改”表达式，那么您可能不希望每次更改格式时都重新输入代码。幸运的是，InDesign 为您提供了一个保存查询的选项。点击“**查找/更改**”对话框中的“**保存查询**”按钮，并为查询输入一个名称。点击“**确定**”，该查询就会被添加到“**查询**”下拉菜单中。在我的示例中，我输入了\
  \ `Numbered Lists` 并点击了“**保存查询**”按钮。新的查询显示在图 6-55 中，以及用于更改编号列表格式的代码。\n\n![A432409_1_En_6_Fig55_HTML.jpg](img/A432409_1_En_6_Fig55_HTML.jpg)\n\
  \n**图 6-55.** 点击“保存查询”将查询保存为预设\n\n### 6.8.3 创建 GREP 样式\n\n正如我在本章前面提到的，没有专门的 GREP\
  \ 面板用于创建 GREP 样式。您可以创建 GREP 样式，但这在“**段落样式选项**”对话框中进行处理。当您在“**查找/更改**”对话框中保存查询时，该查询是应用程序级别的，这意味着您可以在其他\
  \ InDesign 文档中使用该表达式。当您创建 GREP 样式时，该表达式是文档级别的，这意味着代码仅保存在您创建该样式的文档中。您可以打开“**段落样式**”面板并将包含\
  \ GREP 样式的样式加载到新文档中，但这是您能够保留代码的唯一方式。\n\n如果您发现自己经常使用 GREP 样式，可以创建一个包含段落样式、字符样式、对象样式、表格单元格样式、表格样式和\
  \ GREP 样式的主文档。在处理新文档时，将样式加载到相应的面板中。InDesign 的妙处在于，您可以（通过样式面板菜单“**载入样式**”）只从各个面板中加载您想要的样式，并为每个面板导入的样式做出选择。这样就不会使您的样式面板过于杂乱。\n\
  \n到目前为止，我们探讨了在“**查找/更改**”对话框中创建 GREP 表达式。在您完成一个故事的编辑后，通过“**查找/更改**”来更改模式是没问题的。但是，如果您需要对使用\
  \ GREP 查找和更改后的内容进行额外编辑怎么办？您需要重新运行“**查找/更改**”。通过将 GREP 样式添加到段落样式，您在段落中所做的任何更改都会自动更新。当我们实际创建一些\
  \ GREP 样式时，这一点会变得更加清晰。\n\n现在，让我们看看一些可以在“**段落样式**”面板中添加的 GREP 样式。\n\n\n\n#### 6.8.3.1\
  \ 创建 OpenType 分数\n\n当你想要创建真正的分数时，`GREP` 样式是一个不错的选择。无需尝试设置上标和下标来凑合出一个分数，你可以使用 OpenType\
  \ 字体来创建更美观的分数。与其通过一系列步骤来创建一个分数，不如让 `GREP` 样式替你完成这项工作。\n\n**注意**  \nOpenType 分数在可重排版式或固定版式的\
  \ EPUB 中均无法生效。你可以在交互式 PDF 中使用它们。有关在可重排版式 EPUB 中使用分数的更多信息，请参阅第 12 章。\n\n**使用 GREP\
  \ 样式创建真正的分数**\n\n要添加一个能将基数词转换为分数的 `GREP` 样式，请执行以下操作：\n\n1.  创建一个段落样式。如果你希望所有正文副本都使用分数转换，请使用正文样式，或者创建一个新的段落样式。\n\
  2.  添加 `GREP` 表达式。编辑一个段落样式或创建一个新样式。在“段落样式选项”对话框中，单击左侧窗格中的 `GREP` 样式。默认情况下，你会在“应用到文本”字段中看到一个\
  \ `\\d+`。起初，你似乎无法编辑该表达式。这个对话框看起来像是一个半成品。但是，你可以在此添加代码。只需单击默认代码，“应用到文本”文本框就会变为可用状态，你可以在此删除默认表达式并输入自己的代码。要在文本中查找分数，请键入以下代码：\n\
  \n    ```\n    \\d+/\\d+\n    ```\n\n    这段代码非常简单。我们查找一个或多个数字 `\\d+`，后跟一个斜杠 `/`，再后跟一个或多个数字\
  \ `\\d+`。这非常容易。\n3.  创建一个字符样式。下一步是创建一个字符样式。你可以使用一个已正确格式化的字符样式，也可以在不离开“段落样式选项”对话框的情况下创建字符样式。点击表达式上方的行，会出现一个下拉菜单。滚动到菜单底部并选择“新建字符样式”。此时会打开“新建字符样式”对话框。\n\
  4.  设置字符样式格式。单击左侧窗格中的 `OpenType 功能`。当 `OpenType 功能`窗格打开时，勾选`分数`复选框，如图 6-56 所示。在我的示例中，我还更改了字符的颜色并将字体样式设置为粗体。这是可选的。我这样做只是为了让你在图\
  \ 6-57 中能更轻松地看到截图。\n\n    ![A432409_1_En_6_Fig57_HTML.jpg](img/A432409_1_En_6_Fig57_HTML.jpg)\n\
  \n    图 6-57. 文本框中的文本使用了 OpenType 分数\n\n    ![A432409_1_En_6_Fig56_HTML.jpg](img/A432409_1_En_6_Fig56_HTML.jpg)\n\
  \n    图 6-56. 设置字符样式格式以使用 OpenType 分数\n5.  为样式命名并返回“段落样式选项”对话框。在“样式名称”文本框中键入名称，然后单击\
  \ `确定` 返回“段落样式选项”对话框。\n6.  在“段落样式选项”对话框中单击 `确定`。在你应用该样式的文本框（一个或多个）中，文本将被格式化，如图 6-57\
  \ 所示。如果你在文本框中键入新的分数，新文本将使用 `分数` 字符样式进行格式化。\n\n#### 6.8.3.2 格式化数字和首字母缩写词\n\n当你排版并使用首字母缩写词和数字时，快速扫一眼往往会觉得这些字符太大了。根据你使用的字体，它们可能会显得很突兀。在许多情况下，你可能希望将首字母缩写词和数字的字号设置得比段落样式中“`基本字符格式`”定义所用的字号小一个或两个点。在图\
  \ 6-58 的上半部分，你可以看到一个段落中的几个首字母缩写词和数字。这些首字母缩写词和数字明显看起来比正文要大。这是使用 `GREP` 样式的好时机，你可以通过它来降低首字母缩写词和数字的字号。\n\
  \n![A432409_1_En_6_Fig58_HTML.jpg](img/A432409_1_En_6_Fig58_HTML.jpg)\n\n图 6-58.\
  \ 首字母缩写词和数字通常看起来比段落中的字号要大\n\n**降低数字和首字母缩写词的字号**\n\n要降低字号，请执行以下操作：\n\n1.  为文本设置一个段落样式。在我的示例中，我使用了“正文”样式。\n\
  2.  编辑段落样式。右键单击段落样式并选择“编辑‘正文’”（或你使用的任何段落样式名称）。\n3.  打开 GREP 样式。单击左侧窗格中的 `GREP 样式`\
  \ 以打开 `GREP 样式`面板。\n4.  添加一个字符样式。默认表达式 `\\d+` 适用于数字。单击“应用样式”并向下滚动到“新建字符样式”。\n5.\
  \  设置字体大小。在“新建字符样式选项”对话框中，单击“基本字符格式”。\n6.  减小字体的字号。在我的示例中，我将字体的字号设置为 22 磅。我将字号减小到\
  \ 20 磅，然后单击 `确定` 返回“段落样式选项”对话框。\n7.  添加另一个 GREP 样式。单击“新建 GREP 样式”按钮，第一组 `GREP` 样式下方会出现新的一组。\n\
  8.  键入表达式。单击“应用到文本”字段并键入以下代码：\n\n    ```\n    \\u\\u+\n    ```\n\n    此表达式搜索大写字符\
  \ `\\u`，并重复执行以避免选中仅首字母大写的单词。\n9.  添加一个字符样式。用于数字的同一个字符样式也可以用于首字母缩写词。打开“应用样式”菜单，选择为数字表达式创建的字符样式。单击\
  \ `确定`；最终结果显示在图 6-58 的底部。\n\n如你所见，你可以在“段落样式选项”对话框中叠加使用 `GREP` 样式。如果你有一些难以编写完整表达式的例程，你可以尝试将它们分解，并编写几个\
  \ `GREP` 样式。\n\n有许多 `GREP` 模式，其代码可在博客文章和网站上找到。搜索互联网，你可能会找到一些可以复制并用于文档的模式。\n\n##\
  \ 6.9 总结\n\n本章我们涵盖了很多内容。你学习了如何使用字符样式和段落样式、对象样式、表格和单元格样式以及 `GREP` 样式。样式对于 EPUB 至关重要，它们能让在\
  \ InDesign 中的排版工作变得轻松许多。当你需要修改文档或编辑由同事或其他用户创建的文档时，你会体会到样式的妙用。你对样式了解得越多，处理任何 InDesign\
  \ 任务的速度就越快。\n\n本章结束了对在 InDesign 中工作的一些基础知识和要点的回顾。从第 7 章开始，我们将探讨交互性。下一章我们将首先理解超链接。\n\
  \n## 第三部分  \n添加交互性\n\n"
- "# 7. 创建超链接\n\n如果你在互联网上探索过，肯定知道超链接。每次你点击一个 `HREF` 标签（与按钮或文本相关联）并跳转到新位置时，你就体验了超链接的目标位置。\n\
  \n超链接有两部分：源和目标位置。在 InDesign 中，源可以是文本、文本框、图像、对象、交互式元素和对象框架。超链接的目标位置可以是 URL、启动默认电子邮件应用程序、文档内的页面、文档内包含的锚点以及指向外部文档的链接。\n\
  \n如你所见，InDesign 超链接的功能远不止打开网页那么简单。在本章中，我将介绍如何从各种源创建超链接，以及如何为各种目标位置设置它们。\n\n**警告**\
  \  \n正如我在第 15 章中讨论的那样，在导出到交互式 PDF 文档时，应避免在 InDesign 中创建超链接。请使用 Acrobat 的工具来处理 PDF\
  \ 文件中的所有超链接创建。\n\n\n\n## 7.1 了解超链接的基础知识\n\n`InDesign` 超链接可以链接到 URL、外部文件、电子邮件客户端、文档内的页面、文本锚点和共享目标。共享目标由两个或多个源共享。当目标被共享时，它们会以层级结构出现在`超链接面板`中，并嵌套在一个文件夹下。当不共享时，每个目标会单独列在面板中。\n\
  \n### 7.1.1 熟悉超链接面板\n\n`InDesign` 文档中的所有超链接都会显示在`超链接面板`中，如图 7-1 所示。要打开此面板，请选择 `窗口\
  \ ➤ 交互 ➤ 超链接`。该面板包含许多用于处理超链接的选项。\n\n*   `URL`：当你点击一个对象（文本、文本框、图像、对象、矩形框、形状等）时，`URL`\
  \ 文本框会变为可编辑状态。要链接到外部 URL，请在文本框中输入 URL 地址。\n*   `名称`：你会在`名称`右侧看到两个相邻的图标。第一个是页面图标。面板中的每个超链接都带有一个表示超链接类型的图标。图标旁边是一个数字，对应超链接所在的页码。如果你点击该数字，`InDesign`\
  \ 会跳转到该页面并选中源。\n*   每个超链接还带有颜色编码。绿色圆圈表示 URL 有效。红色圆圈表示 URL 无效。点击有效图标会带你跳转到目标位置。\n\
  *   `刷新 URL 状态`：点击此按钮可刷新列表。\n*   `创建新超链接`：必须在文档中选中某个对象后，此图标才会变为可用。当文本或对象被选中时，点击该图标即可创建新超链接。\n\
  *   `垃圾桶图标`：要删除一个超链接，请在`名称`列表中点击你想要删除的那个超链接，然后点击`垃圾桶图标`。\n\n![A432409_1_En_7_Fig1_HTML.jpg](img/A432409_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1. 选择 `窗口 ➤ 交互 ➤ 超链接` 以打开`超链接面板`\n\n`超链接面板`有大量的菜单命令，如图 7-2 所示。要打开菜单，请点击`超链接面板`右上角的图标。菜单打开后，包含以下选项：\n\
  \n*   `新建超链接`：点击此菜单项可创建新超链接。其行为与点击`超链接面板`底部的`创建新超链接`图标相同。\n*   `从 URL 新建超链接`：如果你在文档的文本中选中了一个\
  \ URL，点击此菜单项会创建一个指向该 URL 的新超链接。\n*   `将 URL 转换为超链接`：请谨慎使用此功能。`InDesign` 不区分有效 URL\
  \ 和无效 URL。如果你有类似 `realize.It` 的文本，`InDesign` 也会创建一个 URL。在 `InDesign` 中，任何句子结尾处有一个句点且下一个单词之间没有空格的文本，都会被当作\
  \ URL 处理。\n*   `删除超链接`：使用此命令的结果与使用`超链接面板`中的`垃圾桶图标`相同。\n*   `新建超链接目标`：点击此菜单项，会打开一个对话框，你可以在其中为页面、文本锚点或\
  \ URL 选择目标。\n*   `编辑超链接`：在`超链接面板`中选中一个超链接，然后点击此菜单项以打开`编辑超链接`对话框。在`编辑超链接`对话框中，你可以编辑\
  \ URL 或更改目标、选择字符样式以及编辑 PDF 选项。\n*   `超链接目标选项`：点击此菜单项，会打开`超链接目标选项`对话框。在其他更改中，你可以修改超链接的名称。（请注意，你也可以在`超链接面板`中通过点击名称、稍作停顿、再次点击，然后为名称输入新文本来更改超链接名称）。超链接名称对目标没有影响。你可以一边工作一边重命名超链接名称，并为超链接的作用添加更具描述性的名称。\n\
  *   `删除未使用的目标`：当你完成工作并准备发布时，使用此命令是一个好习惯。`InDesign` 会删除文档中所有未使用的目标。\n*   `转到源`：这类似于点击`超链接面板`中超链接名称右侧的数字。当你选择此命令时，`InDesign`\
  \ 会跳转到源所在的页面并选中该源。\n*   `转到目标`：点击此命令，会执行超链接动作。如果超链接是一个 URL，该 URL 会在你的默认网页浏览器中打开。如果目标是某个页面，`InDesign`\
  \ 会跳转到目标页面，依此类推。\n*   `重命名超链接`：此功能略显多余，因为你已有另外两种方法可以重命名超链接。当你点击此菜单项时，会打开一个简单的对话框，你可以在其中输入新名称。\n\
  *   `重置超链接`：假设你有一个源是某些文本的超链接。后来你意识到希望该超链接使用不同的源。你可以选中新的源，然后在`超链接面板`中选中该超链接并选择`重置超链接`。新的源将使用从原始源建立起来的超链接目标。\n\
  *   `更新超链接`：当你链接到外部文档（如 PDF 文件）时，请使用此菜单项。如果你更改了文件名或位置，请选中`超链接面板`中的超链接并点击`更新超链接`。\n\
  *   `排序`：默认情况下，你不能在`超链接面板`中移动超链接。但是，如果你在菜单中选择`排序 ➤ 手动`，就可以在列表中上下拖拽项目。其他排序选项包括`按名称`和`按类型`，你可以按超链接的名称排序，也可以按目标类型排序。\n\
  *   `小面板行`：当你选择此命令时，列表中的字体变小，以便你可以在面板中看到更长的列表。\n*   `自动更新 URL 状态`：默认情况下，此项是勾选的。如果你离线工作，可以取消勾选此项，等你重新在线时再启用它。启用后，`InDesign`\
  \ 会自动更新 URL 状态，并为你提供有效和无效 URL 的实时反馈。\n\n![A432409_1_En_7_Fig2_HTML.jpg](img/A432409_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2. 打开`超链接面板`菜单以访问超链接选项\n\n### 7.1.2 使用超链接样式\n\n当你在 `InDesign` 文档中创建第一个超链接时，你可能不会立即意识到，但\
  \ `InDesign` 实际上为你创建了一个`字符样式`。（有关`字符样式`的更多信息，请参阅第 6 章。）\n\n打开`字符样式面板`（`窗口 ➤ 样式 ➤\
  \ 字符样式`）。`字符样式面板`随即打开。如果你想更改该样式的属性，请在`字符样式面板`中右键点击 `Hyperlink` 样式并选择`编辑 Hyperlink`（这里的\
  \ `Hyperlink` 是`字符样式`的名称）。`字符样式选项`对话框会打开，如图 7-3 所示，你可以在其中更改字体、字号、行距、文本颜色等。我在第 6\
  \ 章中详细解释了如何使用`字符样式选项`对话框。\n\n![A432409_1_En_7_Fig3_HTML.jpg](img/A432409_1_En_7_Fig3_HTML.jpg)\n\
  \n图 7-3. 当你创建第一个超链接时，`InDesign` 会自动创建一个`字符样式`\n\n\n\n### 7.1.3 编辑超链接\n\n若要编辑超链接以更改目标、URL、字符样式或\
  \ PDF 外观，请在`超链接面板`中选择该超链接，然后从`超链接面板菜单`中选取`编辑超链接`。此时将打开`编辑超链接`对话框，如图 7-4 所示。\n\n\
  ![A432409_1_En_7_Fig4_HTML.jpg](img/A432409_1_En_7_Fig4_HTML.jpg)\n\n**图 7-4.**\
  \ 在`超链接面板菜单`中点击`编辑超链接`\n\n你在`编辑超链接`对话框中可能会注意到的其中一项是`共享超链接目标`复选框。如果该复选框未选中，且你有一长串使用相同目标的超链接，你可能想要编辑它们并勾选此复选框。这些超链接将嵌套在`超链接面板`的一个文件夹中，如果你的文档包含许多不同的超链接，这将使其更易于管理。\n\
  \n### 7.1.4 编辑超链接目标\n\n点击`超链接面板菜单`中的`超链接目标选项`，打开`超链接目标选项`对话框，如图 7-5 所示。文档中的所有超链接目标都会列在`目标`菜单中。当你添加新目标时，它们会被动态添加到该菜单中。\n\
  \n![A432409_1_En_7_Fig5_HTML.jpg](img/A432409_1_En_7_Fig5_HTML.jpg)\n\n**图 7-5.**\
  \ 在`超链接面板菜单`中点击`超链接目标选项`\n\n在此对话框中，你可以更改目标类型、更改超链接名称，并且如果目标是 URL，还可以更改 URL。\n\n\
  ## 7.2 链接到 URL\n\n如你所见，InDesign 提供了一套非常完备的用于处理超链接的功能和命令。现在你已经熟悉了这些对话框和`超链接面板`，是时候在文档中创建一些超链接了。\n\
  \n### 创建超链接\n\n要创建一个打开 URL 的超链接，请执行以下操作：\n\n1.  选择一些文本、一个对象、图片，或拖拽创建一个`矩形框`。在我的示例中，我选择了一些文本，如图\
  \ 7-6 所示。如果你有多个文本框想使用，请选中它们并进行编组（`Ctrl/⌘+G`）。\n\n    ![A432409_1_En_7_Fig6_HTML.jpg](img/A432409_1_En_7_Fig6_HTML.jpg)\n\
  \n    **图 7-6.** 选择文本或编组的多个文本框，并打开`超链接面板`\n\n2.  选中编组项目，打开`超链接面板`。点击`创建新超链接`图标。在`URL`文本框中添加超链接的\
  \ URL，然后按`Enter/Return`键。\n3.  检查`超链接面板`。如果你输错了 URL，InDesign 会通过将圆圈图标变为红色来向你报告任何无效的\
  \ URL。请确认圆圈显示为绿色。\n4.  重命名超链接。默认情况下，超链接名称源自 URL 地址。如果你有一个长 URL，最好将其更改为简短的描述性名称。在`超链接面板`中点击一次该名称，稍作停顿，然后再点击一次。当文本被选中时，输入一个新名称。或者，你也可以在`超链接面板`中选择`重命名超链接`。\n\
  5.  检查链接目标。点击`超链接面板`中的绿色圆圈。如果 URL 将你带到了预期的位置，则说明 URL 工作正常。如果得到意外结果，请检查`超链接面板`中的\
  \ URL。\n\n## 7.3 链接到电子邮件客户端\n\n当你链接到电子邮件客户端时，会在默认的电子邮件客户端中创建一封新邮件。你可以控制目标电子邮件地址、主题行，甚至邮件内容。一切从`超链接面板`开始，你在其中创建指向电子邮件地址的新超链接。\n\
  \n你可能有一份文档，希望获得内容读者的反馈，想要分享文件链接中的附加信息，或者希望读者以任何其他方式与你沟通。创建电子邮件超链接相当简单。但当需要在`超链接`文本框中添加较长的文本行时，事情就变得稍微复杂一些。\n\
  \n### 7.3.1 创建电子邮件超链接\n\n首先，我们来看看如何创建一个相当简单的电子邮件超链接。\n\n#### 创建电子邮件超链接\n\n要创建你的第一个电子邮件超链接，请按照以下步骤操作：\n\
  \n1.  在文档中选择一个对象、文本或其他项目，然后点击`超链接面板`中的`创建新超链接`图标。此时会打开`新建超链接`对话框。\n2.  从`链接到`菜单中选择`电子邮件`。在`地址`字段中键入一个有效的电子邮件地址。键入主题行（可选），如图\
  \ 7-7 所示。点击`确定`。\n\n    ![A432409_1_En_7_Fig7_HTML.jpg](img/A432409_1_En_7_Fig7_HTML.jpg)\n\
  \n    **图 7-7.** 从`链接到`菜单中选择`电子邮件`\n\n3.  注意`超链接面板`中的 URL。你会看到一些代码以及电子邮件地址（见图 7-8）。\n\
  \n    ![A432409_1_En_7_Fig8_HTML.jpg](img/A432409_1_En_7_Fig8_HTML.jpg)\n\n    **图\
  \ 7-8.** 添加电子邮件链接后的`超链接面板`\n\n4.  点击`超链接面板`中的电子邮件图标以测试该地址。你应该会看到一个新的消息窗口在你的默认电子邮件客户端中打开。如果一切正常，你就完成了电子邮件链接任务。\n\
  \n这个电子邮件链接是一个简单的任务。要探索电子邮件链接的更多选项，你可以在消息字段中添加描述，创建指向外部文件的链接，并将所有信息添加到`超链接面板`中的 URL\
  \ 名称中。\n\n### 7.3.2 创建带消息的电子邮件超链接\n\n在 InDesign 中，用于输入 URL 链接的行非常小，并且没有其他添加 URL\
  \ 信息的方式。即使是允许你编辑 URL 的对话框，其文本框也只有一行。如果你有一个长 URL 并且需要编辑其中的信息，比较好的做法是在 InDesign 的粘贴板上创建文本，然后将文本复制粘贴到\
  \ URL 文本行中。\n\n在图 7-9 中，你看到了 InDesign 粘贴板上的文本。该文本包含一个可以下载 PDF 文档的超链接。我添加了一些回车换行以便于编写并使其更具可读性。编写完代码后，你需要删除回车换行，这样就得到了一行文本。\n\
  \n![A432409_1_En_7_Fig9_HTML.jpg](img/A432409_1_En_7_Fig9_HTML.jpg)\n\n**图 7-9.**\
  \ 在 InDesign 粘贴板上键入电子邮件内容的信息\n\n这还没完。你需要删除所有空格，并将其替换为`%20`。你可能见过这样显示的网址，因为 URL 地址行中不允许有空格。\n\
  \n> **注意：** URL 行中不允许有空格。`%20` 是 URL 字符串中空格的 ASCII 编码值。\n\n与其手动整理，不如使用脚本来自动处理格式。此脚本来自\
  \ Keith Gilbert，网址为 [www.gilbertconsulting.com](http://www.gilbertconsulting.com)。我加载了\
  \ Keith 的脚本并在粘贴板上的文本上运行。结果如图 7-10 所示。\n\n![A432409_1_En_7_Fig10_HTML.jpg](img/A432409_1_En_7_Fig10_HTML.jpg)\n\
  \n**图 7-10.** 在运行 Keith Gilbert 的`用实体替换空格`脚本后，所有空格都被替换为正确的代码。\n\n> **注意：** Keith\
  \ Gilbert 是一位作家、会议演讲者和顾问，专精于 InDesign 和 Adobe DPS。他的网站（[www.gilbertconsulting.com](http://www.gilbertconsulting.com)）提供了大量关于数字出版的信息以及他编写的一些精巧的\
  \ InDesign 脚本。他的两套脚本（数字出版包 1 和数字出版包 2）对于从事 DPS 和数字出版工作的人来说是非常好的工具，我强烈建议你去看看。\n\n\
  运行脚本后，复制文本并将其粘贴到 URL 文本字段中。\n\n\n\n## 7.4 链接到页面\n\n你可能会想在文件中创建一些交叉引用，方便读者跳转阅读与特定主题相关的内容，或者创建一个链接到各章节的目录页。\n\
  \n### 链接到页面\n\n使用“超链接”面板可以轻松链接到页面：\n\n1.  要链接到文档中的某个页面，请打开“超链接”面板并选择一个源。此源可以是文本或图形。单击“超链接”面板中的`创建新超链接`按钮。此时将打开`新建超链接目标`对话框，如图\
  \ 7-11 所示。\n\n    ![A432409_1_En_7_Fig11_HTML.jpg](img/A432409_1_En_7_Fig11_HTML.jpg)\n\
  \n    **图 7-11。**\n\n    选择`页面`并选择页码。\n\n2.  在`链接到`菜单中选择`页面`，然后在`页面`菜单中选择页码。你的文档中的所有页面都会列在该菜单中。单击`确定`以创建超链接。\n\
  \n另一种页面导航方式是链接到锚点。（有关创建锚点的更多信息，请参见第 4 章和第 12 章。）\n\n### 链接到锚点\n\n要链接到锚点，请执行以下操作：\n\
  \n1.  在文本框架中单击文字工具，或选择框架内的文本，然后打开“超链接”面板。\n\n2.  打开“超链接”菜单，选择`新建超链接目标`。此时将打开`新建超链接目标`对话框。\n\
  \n3.  从`类型`菜单中选择`文本锚点`，并为文本锚点输入一个名称（见图 7-12）。默认名称为`锚点 1`，后续添加到文档中的锚点依次为`锚点 2`、`锚点\
  \ 3`，依此类推。最好为锚点赋予一个描述性名称，尤其是当文档中有很多锚点时。\n\n    ![A432409_1_En_7_Fig12_HTML.jpg](img/A432409_1_En_7_Fig12_HTML.jpg)\n\
  \n    **图 7-12。**\n\n    要创建一个锚点作为目标，请单击光标或选择文本，然后在`新建超链接目标`对话框中选择`文本锚点`。到目前为止，我们创建了目标，但尚未指定源。\n\
  \n4.  创建一个框架，选择一个对象，或为源选择文本。\n\n5.  在“超链接”面板中，单击`创建新超链接`按钮。\n\n6.  当`新建超链接`对话框打开时，在`链接到`菜单中选择`锚点`，然后在`文本锚点`菜单中选择锚点名称。\n\
  \n当你创建指向文本锚点的超链接时，该超链接会在“超链接”面板中显示为锚点符号。你可以通过单击“超链接”面板中的锚点符号轻松检查该超链接。如果链接设置正确，InDesign\
  \ 将跳转到链接目标所在的页面。\n\n## 7.5 本章小结\n\n在本章中，我们开始了在 InDesign 中创建交互式元素的旅程。超链接只是为文档添加交互性的众多方法之一。\n\
  \n本章我们从一些简单的任务入手。当你开始学习其他交互功能（如下一章将介绍的动画）时，事情会变得更加复杂。\n\n"
- '# 8. 处理动画


  Adobe InDesign 并非动画工具。你可以在 Adobe Animate CC 和 Adobe After Effects 中找到更多创建动画的机会。不过，Adobe
  InDesign 也确实提供了一套令人印象深刻的功能，使你能够创建各种动画。


  InDesign 中的动画可以导出到固定版式 EPUB、交互式 PDF（需要变通方法——且仅限桌面计算机）和 Adobe Publish Online。重排式
  EPUB 和 DPS/AEMM 文档不支持动画。


  在本章中，我们将探索如何创建动画，并对其进行设置使其在支持动画的文档中播放。我将介绍如何使用动画预设、设置持续时间和速度、使用运动路径，以及将动画与多状态对象结合使用。此外，我还提供了一些项目构思，并逐步引导你完成创建类似设计所需的步骤。


  ## 8.1 了解“动画”面板


  实际上，创建 InDesign 动画时需要使用两个面板：“动画”面板和“定时”面板。在本节中，我将讨论如何使用“动画”面板，稍后在“在‘定时’面板中对动画重新排序”一节中，我将介绍如何使用该面板来设置持续时间、速度以及同时播放关联的动画。


  在 InDesign 中对文本和对象进行动画处理时，你应该同时打开这两个面板。它们协同工作，帮助你创建要添加到文档中的动画。你还会经常用到“图层”面板，因此最好设置好工作环境以便轻松访问这三个面板。


  ### 8.1.1 使用动画预设


  在 InDesign 中创建一个新文档，并创建一个对象（矩形、椭圆或多边形）。选择该对象，然后打开“动画”面板，如图 8-1 所示。“动画”面板包含 48 个预设，用于控制五种基本动画设置，包括：运动路径、缓动（速度和持续时间）、旋转、缩放和不透明度。在该面板中，你可以有多种选择来设置动画的属性。你的选择包括以下内容：




  '
- "# 动画面板指南\n\n1. **动画面板菜单**：点击面板右上角的图标即可打开菜单。在菜单顶部，您将看到`保存`选项。在面板中进行各种选择后，您可以将设置保存为预设。\n\
  \n2. **预览**：动画的顶部区域会显示一个代理预览，预览内容对应于您从`预设`菜单中选定的动画。\n\n3. **名称**：该名称来源于`图层面板`。创建动画时，您应在`图层面板`中为对象和文本框架命名。或者，如果您在此处更改了对象名称，`图层面板`中的名称也会随之改变。\n\
  \n4. **预设**：`预设`菜单为您提供了大量不同的动画选项。当您从`预设`菜单中选择一个动画时，`动画面板`顶部的预览窗口会显示该动画的代理视图。\n\n\
  5. **事件**：请注意文本旁边的向下箭头。点击该箭头可打开一个菜单，您可以在其中选择事件触发器。默认情况下，事件触发器设置为`页面加载时`，这意味着当页面被查看时动画将播放。菜单右侧有一个图标。点击此图标可创建一个将触发事件的按钮。\n\
  \n6. **持续时间**：在文本框中，您可以设置最小可接受值`.125`，这将加快动画速度；或将其设置为`60`秒，从而减慢动画速度。\n\n7. **播放**：通过输入`1`到`99`之间的数值，您可以设定动画想要播放的次数。\n\
  \n8. **循环**：勾选此框可使动画循环播放，反复进行。\n\n9. **速度**：在`速度`菜单中，您可以选择`来自预设`、`无`、`渐入`、`渐出`以及`渐入并渐出`。缓动可加速动画。当您选择`渐入`时，动画最初缓慢出现，随后加速。`渐出`则正好相反。`渐入并渐出`则是缓慢开始，加速，最后再缓慢结束。\n\
  \n10. **动画**：`动画`菜单包含三个选项：\n    * **从当前外观**：如果您让一个球体执行缩小动画，那么“从”外观会以您在`InDesign`中放置球体时的大小为起点。随着动画进行，球体会缩小。\n\
  \    * **到当前外观**：动画从一个外观运行到当前外观。例如，如果您从一个小球开始，而页面上小球显示为大尺寸，那么您将小球从较小的对象放大到当前较大的外观。\n\
  \    * **到当前位置**：如果让一个球体弹跳，动画将在设计中球体出现的当前位置结束。\n\n11. **旋转**：`旋转`可将对象旋转最多`7,200°`。\n\
  \n12. **缩放**：`缩放`可使对象放大或缩小。可用的最大尺寸为`7,200%`。\n\n13. **不透明度**：您对于不透明度只有两个选择：`淡入`和`淡出`。其范围是`0%`到`100%`（或`100%`到`0%`）。\n\
  \n14. **可见性**：您可以选择在动画播放前将其隐藏，并且可以通过启用相应的复选框，在动画播放完毕后将其隐藏。\n\n15. **预览**：点击面板左下角的图标，可在`EPUB\
  \ 交互`面板中预览动画。按住`Alt/⌥`键并点击，可在`SWF 预览面板`中预览动画。\n\n16. **动画代理**：`预览`图标右侧的图标非常有用。点击该图标，会显示一个灰色方框作为代理，用以指示动画的起点或终点。\n\
  \n17. **定时面板**：点击`动画代理`右侧的下一个图标，可打开`定时面板`。\n\n18. **转换为运动路径**：在面板的右下侧，您会找到`转换为运动路径`。您在文档中绘制的任何线条，无论是直线还是贝塞尔曲线，都可以用作运动路径。当您选择一个对象和一条路径，然后点击此图标时，路径的描边粗细会消失，对象将沿着该路径运动。\n\
  \n19. **移除动画**：选择一个已分配了动画的对象，然后点击垃圾桶图标。此操作将移除该动画（您的对象仍保留在文档窗口中）。\n\n20. **轴点**：点击九个点之一来设置轴或原点。例如，如果您想从中心旋转对象，请点击中心方块。`动画面板`菜单中的第二个项目是`管理预设`。选择此选项，会打开一个窗口，其中列出了所有预设。您可以删除自定义预设、复制预设、加载预设文件以及将预设保存到新文件。`InDesign`的默认预设无法删除。\n\
  \n![A432409_1_En_8_Fig1_HTML.jpg](img/A432409_1_En_8_Fig1_HTML.jpg)\n\n图 8-1. 在文档窗口中选择一个对象并打开`动画面板`\n\
  \n`动画面板`菜单中的其余项目与本列表讨论的内容相同，唯一的例外是`预览选择 SWF`。您可以选择一个对象，并在`SWF`预览窗口中仅预览该对象的动画。\n\n\
  ### 8.1.2 创建动画\n\n既然我们已经了解了`动画面板`中的所有开关和切换选项，那么让我们来轻松愉快地创建几个简单的动画吧。\n\n### 创建动画\n\
  \n1. 在`InDesign`中创建一个新文档。使用一种`EPUB`页面尺寸。在我的示例中，我将把`用途`设置为`移动设备`，`页面尺寸`设置为`iPad`，方向设置为横向。\n\
  \n2. 选择`文件 ➤ 置入`，将一个对象放置在页面上。如果您想要一个背景图形，请先置入背景，然后再置入对象。该对象可以是图像或插图。我们将使用一个预设来制作这个动画，使其从左侧飞入，因此请将对象移至页面中心偏右的位置（参见图\
  \ 8-2）。\n\n   ![A432409_1_En_8_Fig2_HTML.jpg](img/A432409_1_En_8_Fig2_HTML.jpg)\n\
  \n   图 8-2. 选中一个对象后，在`动画面板`中设置该动画的属性\n\n3. 选择该对象并打开`动画面板`。\n\n4. 在`动画面板`中设置动画属性。打开`预设`菜单，选择`从左侧飞入`，然后在`持续时间`中输入`2`。在`动画属性`中，从菜单中选择`到当前位置`，将`不透明度`设置为`淡入`，并勾选`隐藏直到动画开始`复选框。设置后应如图\
  \ 8-2 所示。\n\n5. 预览动画。点击`动画面板`中的`预览页面：EPUB` 图标（面板左下角）。在某些情况下，您可能需要点击`EPUB 交互预览面板`左下角的`播放`按钮（指向右方的三角形）来播放动画。当您将文件导出为固定版式`EPUB`时，动画会在页面加载时播放。这是`定时面板`中的默认设置。您将看到一个简短的动画：从不透明度`0%`开始，对象向右移动并淡入，直至不透明度达到`100%`。\n\
  \n## 8.2 使用运动路径\n\n大多数动画预设都使用了运动路径。运动路径定义了动画的长度和方向。当您在`动画面板`中选择一个预设时，`InDesign`会为您创建路径。您可以编辑运动路径，使其变长或变短、改变路径方向、为路径添加点，以及移动各个点来创建向上、向下、向左和向右的方向。此外，您还可以使用`钢笔`工具或`铅笔`工具创建自定义运动路径。\n\
  \n\n\n### 8.2.1 编辑运动路径\n\n沿用之前的示例，我们来看看动画效果。当你选中对象时，会看到一条水平线，右侧带有一个箭头。这是一条运动路径线，箭头指示了对象在播放动画时的移动方向。\n\
  \n**提示：** 如果你想查看动画的精确起始位置，请单击`显示动画代理`图标（面板底部左起第二个图标）。代理会在动画沿路径开始或结束的位置显示一个灰色方块。\n\
  \n假设你想增加运动路径的距离。请单击`工具`面板中的`选择`工具（或按`V`键），然后点击路径。选中路径后，移动端点即可延长（或缩短）路径。\n\n假设你希望球（在此示例中，我使用一个足球）在向右移动时带有轻微的弹跳效果。我们来看看如何实现这一点。\n\
  \n#### 向运动路径添加点\n\n1.  使用`钢笔`工具创建一条路径。\n2.  选中路径后，在`工具`面板中选择`添加锚点工具`（按住鼠标按钮单击`钢笔`工具，然后从菜单中选择`添加锚点工具`，或按`=`键）。\n\
  3.  点击路径以添加一个锚点，如图 8-3 所示。\n\n    ![A432409_1_En_8_Fig3_HTML.jpg](img/A432409_1_En_8_Fig3_HTML.jpg)\n\
  \n    **图 8-3.** 使用`添加锚点工具`，点击路径添加一个点。\n\n4.  选择`转换方向点工具`（也在`钢笔`工具子菜单中）并拖动一个点以创建贝塞尔曲线。\n\
  5.  使用`直接选择工具`（`工具`面板中的白色箭头）将点移动到动画需要跟随的位置。\n6.  移动到另一个位置，重复相同的操作。\n\n当你预览动画时，会看到对象根据你在路径上移动点的位置而上下移动。\n\
  \n### 8.2.2 创建自定义运动路径\n\n当你在`动画`面板中使用预设时，InDesign 会为你创建一条运动路径。你不必依赖 InDesign 提供的运动路径方向。你可以使用`钢笔`工具或`铅笔`工具创建任意路径并绘制。\n\
  \n#### 创建自定义运动路径\n\n请按照以下步骤创建自定义运动路径：\n\n1.  在 InDesign 中创建一个新文档。\n2.  使用 EPUB 页面尺寸之一。在我的示例中，我使用\
  \ iPad 并将方向设置为横向。\n3.  选择`文件 ➤ 置入`，在页面上放置一个对象。\n4.  如果你想要背景图形，先放置背景，再放置对象。对象可以是图像或插图。\n\
  5.  使用`钢笔`工具或`铅笔`工具绘制一条代表你希望对象遵循的运动路径。\n6.  选中路径，按住`Shift`键点击对象以同时选中两者，然后点击`动画`面板中的`转换为运动路径`按钮，如图\
  \ 8-4 所示。\n\n    ![A432409_1_En_8_Fig4_HTML.jpg](img/A432409_1_En_8_Fig4_HTML.jpg)\n\
  \n    **图 8-4.** 选择对象和路径，然后点击`动画`面板中的`转换为运动路径`按钮。\n\n7.  现在，对象将沿着自定义运动路径进行动画。\n\
  8.  在`动画`面板中，从`速度`菜单中选择`缓入缓出`。\n9.  我们将为动画添加一点特色。在我的示例中，足球将缓慢启动，在弧顶加速，然后在射门时减速。\n\
  10. 调整缩放比例。\n11. 对于此示例，将对象缩放至 20%。随着球动画并远离视线，球的尺寸会缩小到更小。\n12. 点击`动画`面板中的`预览跨页：EPUB`按钮来预览动画。\n\
  \n动画的最后一帧显示对象在路径末端缩小尺寸（见图 8-5）。\n\n![A432409_1_En_8_Fig5_HTML.jpg](img/A432409_1_En_8_Fig5_HTML.jpg)\n\
  \n**图 8-5.** 动画结束时显示足球已被缩小。\n\n## 8.3 显示和隐藏动画\n\n你可以显示/隐藏任何类型的动画并触发播放。此外，你还可以显示/隐藏任何对象（文本、图像、插图、视频等）。执行此类操作所需的唯一要素是一个按钮。\n\
  \n如果你能组织好元素并为它们命名以描述其用途，在 InDesign 中的操作会轻松得多。在图 8-6 中，你会看到一个包含三个按钮的版面。我想要点击一个按钮并分配一个动作来启动动画并显示正在动画化的项目。\n\
  \n![A432409_1_En_8_Fig6_HTML.jpg](img/A432409_1_En_8_Fig6_HTML.jpg)\n\n**图 8-6.**\
  \ 包含三个按钮的版面。\n\n要实现我想要的结果，需要完成几件事。首先，我需要将对象放置在不同的图层上。我为前三个按钮设置一个图层，为想要动画化的对象设置另一个单独的图层。当所有对象都设置好动画后，你会看到图\
  \ 8-7 中的结果。图中的三个文本框也是按钮。我使用按钮动作来隐藏当前视图并返回默认视图。\n\n![A432409_1_En_8_Fig7_HTML.jpg](img/A432409_1_En_8_Fig7_HTML.jpg)\n\
  \n**图 8-7.** 将不同的对象放置在单独的图层上。\n\n让我们一步步看如何添加按钮来触发动画。\n\n#### 在按钮点击时飞入元素\n\n1.  设置文件的第一步是创建动画。三个文本框均设置为从底部飞入。将第一个文本框拖到页面边缘下方。\n\
  2.  打开`动画`面板。选择`从底部飞入`预设。默认情况下，动画在页面加载时触发。\n3.  打开`事件`的下拉箭头，取消选中`页面加载时`。\n4.  将`持续时间`设置为\
  \ 1.5 秒，选择`淡入`，并勾选`隐藏直到动画开始`。\n5.  运动路径比所需的要短得多。点击路径并将底部端点向下移动到所需的动画起始点，如图 8-8 所示。\n\
