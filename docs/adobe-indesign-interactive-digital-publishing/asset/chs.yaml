  \n    图 6-23. 为相应的文本元素选择一个字符样式\n5.  标识分隔符。在我的示例中，ISBN 号以冒号结尾。将默认的 `through` 选择保留为默认值，并在最后一个字段中键入一个冒号\
  \ (`:`)。当你看到 `Words` 时，单击光标即可键入冒号字符。\n6.  添加一个新嵌套样式。段落中接下来出现的项目是书名。单击 `New Nested\
  \ Style` 按钮创建另一个样式并打开下拉菜单。从菜单中选择 `Book Title`。`Book Title` 是我在文档中创建的另一个字符样式。\n7.\
  \  标识分隔符。我在书名后添加了一个半身空格。单击 `Words`，会打开一个下拉菜单。从菜单中选择 `En Spaces`，如图 6-24 所示。\n\n\
