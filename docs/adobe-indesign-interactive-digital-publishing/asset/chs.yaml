  ## 引言\n\n本书全面讲解如何利用 Adobe InDesign CC 2017 创建具有交互性的数字出版文档。我将从讨论 Adobe InDesign 及其核心基础知识开始，这些知识是创建\
  \ InDesign 文档并将其转换为可在电脑及平板电脑、智能手机等设备上查看的格式所必需的。\n\n在第一部分，我们从基础知识入手，包括创建工作区、设置偏好、创建面板，以及使用在处理任何类型文档时都会用到的\
  \ InDesign 工具。\n\n在第二部分，我们探讨文本和图形的处理。我们会研究字体管理和设置类型属性，学习使用与文本格式化相关的各种面板、故事编辑器以及文档拼写检查。此外，我还会讲解图形的导入与处理、表格的创建，以及段落、字符、图形、表格和表单元格样式的创建与应用。\n\
  \n在第三部分，我们将为设计添加交互元素。我会介绍如何添加超链接、交叉引用和书签。我们将深入探讨 InDesign 中提供的多种不同动画效果，然后继续学习如何使用多状态对象改变对象和文本视图。本部分的最后一章专门讨论富媒体，我们将研究如何在文档中使用音频和视频。\n\
  \n第四部分介绍如何将文档从 InDesign 导出为多种不同格式。我们会探讨如何创建可重排版式和固定版式的 EPUB、创建交互式 PDF 文档，以及使用 InDesign\
  \ 卓越的新功能——Adobe Publish Online。针对每种不同的文件导出格式，我们都会研究如何格式化文本和图形，可以添加哪些类型的动画和交互功能，并探索一些变通方案来添加某种格式通常不支持的交互元素。第四部分的每一章还涵盖了在台式电脑和设备上查看不同文件格式的内容。此外，我还会讲解与内容托管相关的问题，以及你在准备文件以通过内容提供商托管文档时需要了解的知识。\n\
  \n第五部分提供了一些关于创建数字出版文档的技巧，以及供你探索的各种项目创意。\n\n在 Adobe InDesign 数字出版方面，你可以创建五种不同类型的文档：为可重排版式\
  \ EPUB、固定版式 EPUB、交互式 PDF、Adobe Publish Online（预览版）以及 Adobe 数字出版系统/解决方案 (DPS)/AEM\
  \ 设计的文档。\n\n除了最后一种，本书均会涉及。在后续章节中，你不会找到任何关于 DPS 的讨论。DPS 是创建交互式杂志的绝佳工具，然而对于个人用户而言，其许可费用高得惊人。DPS\
  \ 专为像《时代》、《体育画报》、康泰纳仕出版物等大型出版社设计。本书的绝大多数读者无疑更感兴趣的是服务较小的客户群体，或使用这些工具自行发布内容。因此，本书中删除了关于\
  \ DPS 的内容。\n\n在创建交互式数字出版文档时，你会发现有多种方法可以帮助客户拓宽影响力。你可以将为印刷而设计的 InDesign 文档重新利用，将文件托管在网站和社交媒体网站上。你可以使文档更具动态感和吸引力，为消费者提供更丰富的体验。一旦你开始探索\
  \ InDesign 为你提供的更富创意的表达机会，你很可能会将数字出版作为拓展客户服务的另一条途径。\n\n## 第一部分：数字出版基础\n\n第一部分将详细探讨数字出版文档及使用\
  \ Adobe InDesign 的基础知识。我将讲解如何设置偏好、使用工作区、创建新文档、使用主页以及如何导入资源。我还会介绍为你的设计创建字体和颜色调色板，并且会穿插一些关于自定义键盘快捷键的内容。\n\
  \n\n\n## 第二部分：在 Adobe InDesign 中创建文档\n\n本部分内容全部关于创建 InDesign 文档，以及您在准备包含交互元素的导出文件时所需了解的基础知识。\n\
  \n在第 3 章中，我介绍了文本格式的设置。我们将学习如何使用文本框、使用字形以及创建首字下沉。我们会介绍如何格式化段落、为字符添加描边、使用`文章编辑器`、创建路径文本以及实现文本绕排。我还会讲解如何使用拼写检查器以及纠正文档中的拼写错误。\n\
  \n第 4 章完全围绕图形展开。我将介绍如何导入图形、使用描边并创建自定义描边、在 InDesign 内部创建艺术对象、变换与对齐对象，以及添加效果与透明度的内容。\n\
  \n在第 5 章中，我们将学习如何在 InDesign 中创建表格。我会介绍一些表格基础知识、创建表格的多种方法、探讨表格工具与命令，并创建各种自定义表格。\n\
  \n第 6 章讲述的是样式。我会介绍如何创建字符样式、段落样式、对象样式、单元格样式、表格样式以及`GREP`样式。我们将探讨如何清除单元格覆盖以及如何在段落样式中格式化单元格样式以消除覆盖。我还会介绍如何创建首字下沉和嵌套样式、管理列表，以及处理项目符号和编号样式。\n\
  \n## 第三部分：添加交互性\n\n在第三部分，我们将学习如何向您的 InDesign 文档中添加交互元素。\n\n在第 7 章中，我会介绍如何创建超链接并链接到\
  \ URL 以及文档内的页面。我们将学习使用`超链接面板`以及处理超链接时可用的各种选项。\n\n第 8 章将带您进入动画的世界，并介绍在创建和管理 InDesign\
  \ 动画时所拥有的海量机会。我们将学习几种动画预设，以及如何修改预设并设置各种动画属性。我们会学习使用按钮来控制动画的显示/隐藏，并使用`时间轴面板`。我们还将探讨如何创建带有滚动文本、运动路径的动画，为动画添加声音，以及使用多状态对象的动画。最后，我会向您介绍几个不同的动画项目。\n\
  \n第 9 章介绍如何使用多状态对象（MSO）。我们将学习`对象状态面板`、如何创建 MSO、在 MSO 中添加/删除不同的对象状态、如何添加用于查看不同状态的按钮事件、嵌套\
  \ MSO，以及如何隐藏各种状态。\n\n第 10 章介绍如何使用富媒体。我首先会解释一些视频文件的基础知识、视频压缩以及如何使用`InDesign 媒体面板`。随后我们将学习如何导入视频、添加视频遮罩，以及如何在视频中使用\
  \ MSO。\n\n## 第四部分：发布文档\n\n第四部分介绍如何创建最终文档，以便发布并在各种设备上查看。\n\n在第 11 章中，我以简短的一章开启本部分，介绍如何将您已发布的文档上传到各种设备。我将讲解如何将文件上传到设备和\
  \ URL、通过 URL 复制文件，以及使用`Dropbox`进行文件交换。\n\n在第 12 章中，我们将学习如何创建并导出为可重排 EPUB 格式。我会介绍一些具体细节，包括如何正确格式化文件以导出为可重排\
  \ EPUB、使用各种导出选项以及标记样式。我们将学习如何打开 EPUB 文件并检查其内容。我还会介绍如何向可重排 EPUB 添加交互性，以及需要针对某些交互资源使用的一些变通方法。我们还将学习如何查看\
  \ EPUB 以及如何使用内容托管服务商和提供商。\n\n在第 13 章中，我们从可重排 EPUB 转向固定版式 EPUB。在固定版式中，您在 InDesign\
  \ 中创建的大部分交互性都可以按设计原样导出并查看。我首先会通过探讨可重排 EPUB 与固定版式 EPUB 之间的区别来开启本章。我们将学习如何准备图形、引入交互元素、创建目录，并了解导出为固定版式\
  \ EPUB 时可用的多种不同导出选项。我还会介绍如何在多种设备上查看导出结果。\n\n在第 14 章中，我们将学习 Adobe Publish Online。这是\
  \ InDesign 中用于发布交互式文档的最佳功能之一。您可以将 Publish Online 文档添加到 Facebook、Twitter 账户以及网站中。我会介绍如何导出到\
  \ Publish Online 以及如何管理您的文档。\n\n在第 15 章中，我将介绍如何创建交互式 PDF 文件。我们会学习如何设置 Acrobat 工作区、如何将文档从\
  \ InDesign 导出为 Adobe 交互式 PDF、如何使用 Acrobat 图层、在 Acrobat 内部创建超链接、处理媒体文件、处理 SWF 文件以及创建交互式表格。您在\
  \ InDesign 中可以执行的许多交互式任务在 Acrobat 中可能无法生效。为此，我提供几种变通方法，以最大程度地将交互式文档成功导出为 Adobe 交互式\
  \ PDF。\n\n\n\n## 第五部分：技巧与诀窍\n\n最后两章将为您提供创建交互式文档的技巧和思路。\n\n在第 16 章中，我将介绍十个创建数字出版文档的技巧。\n\
  \n在第 17 章中，我提供了一些项目创意。\n\n接下来将详细讲解设置交互式 InDesign 版面、将文档导出为可重排和固定版式 EPUB、Adobe Publish\
  \ Online 以及交互式 PDF 时的技巧、方法和说明。请与我一同踏上交互式数字出版的探索之旅。\n\n## 致谢\n\n首先，我要感谢 Apress 出版社的员工们在本书出版过程中给予的帮助。非常感谢我的策划编辑\
