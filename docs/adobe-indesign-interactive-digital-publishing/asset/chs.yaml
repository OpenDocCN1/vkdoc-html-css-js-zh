- "# 第一个圆形按钮的设置\n\n13. 对另外两个圆形按钮重复相同的步骤。\n\n14. 接下来，打开图层面板并显示文本框。我们也将这些框设为按钮。现在让我们为按钮分配动作。此图层上的所有三个按钮都设置为隐藏所有文本框。当用户点击第一个图层上的按钮时，文本框会显示出来。当用户点击文本框时，视图将恢复为默认视图。\n\
