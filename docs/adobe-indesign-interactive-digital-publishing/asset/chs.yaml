  \n**图 8-11.** 在 EPUB 交互性预览面板中测试结果\n\n## 8.4 在“定时”面板中重新排序动画\n\n如果您想更改动画的顺序，请打开“定时”面板。如图\
  \ 8-12 所示，您会在面板中看到动画项目列表。如果您想重新排序动画，只需点击并拖动某个动画到新位置即可。例如，对象从篮子右侧开始淡入。我们希望香蕉先淡入，然后是木瓜，接着是菠萝，依此类推。\n\
  \n![A432409_1_En_8_Fig12_HTML.jpg](img/A432409_1_En_8_Fig12_HTML.jpg)\n\n**图 8-12.**\
  \ 动画在“定时”面板中显示\n\n要让香蕉首先出现，请在“定时”面板中点击 `banana.ai` 并将其向上移动到堆栈顶部。接下来，点击并拖动 `pineapple.ai`\
  \ 动画，将其向上移动到 `banana.ai` 动画下方，如图 8-12 所示。\n\n### 8.4.1 链接动画\n\n有时您可能希望一个动画与另一个动画同时播放。以水果篮为例，假设我们希望篮子里所有的水果同时淡入。您可以在“定时”面板中处理此操作。\n\
  \n点击您希望链接在一起以便同时播放的动画。要在“定时”面板中以连续顺序选择项目，请点击一个动画，然后按住 Shift 键选择最后一个动画。第一个和最后一个之间的所有动画都会被选中。要以非连续顺序选择项目，请点击一个动画，然后按\
  \ `Ctrl/⌘-点击`。\n\n选择好希望同时播放的动画后，点击“定时”面板中的“一起播放”按钮（参见图 8-12）。“一起播放”按钮位于面板底部的右数第二个。\n\
  \n### 8.4.2 延迟动画播放\n\n默认情况下，动画设置为在页面加载时播放，这意味着当您在查看器中打开动画时，动画就会开始播放。如果您想延迟播放，请在“延迟”文本框中输入一个值。您可以输入介于\
  \ 0.001 到 60 秒之间的值。\n\n## 8.5 自动滚动文本\n\nAdobe DPS（数字出版解决方案）文档包含可滚动的框架，查看者可以点击该框架并滚动框架内的文本。这是\
  \ DPS 文档中一项出色的功能。您可以创建这样的设计：大量文本副本不会影响页面设计。设计师们一直在与那些希望在页面上放置比美观布局更实际更多的文本的客户作斗争。\n\
  \n不幸的是，截至撰写本文时，可滚动框架在固定版式 EPUB、交互式 PDF 和在线发布（预览）文档中不受支持。但是，您可以为文本副本添加动画效果，使其看起来像是文本在文档中滚动。在这个示例中，我使用了一个表格，但您也可以使用文本框来创建相同的效果。在图\
  \ 8-13 中，您可以看到一个动画表格从页面底部飞入的最终效果。\n\n![A432409_1_En_8_Fig13_HTML.jpg](img/A432409_1_En_8_Fig13_HTML.jpg)\n\
  \n**图 8-13.** 一个被设置为从页面底部滚动进入的表格\n\n注意页面底部的渐变。渐变逐渐过渡为透明。要创建渐变，请绘制一个矩形或框架，然后选择 `Object\
  \ ➤ Effects ➤ Gradient Feather`。您也可以点击控制面板中的效果图标 (`fx`) 来打开效果菜单。\n\n添加渐变羽化效果会使动画看起来像是表格在页面上向上移动时正在改变不透明度。表格需要出现在图层堆栈中渐变的下方，才能使效果正确动画化。在图\
  \ 8-14 中，您可以看到图层面板，其中表格位于渐变的下方。\n\n![A432409_1_En_8_Fig14_HTML.jpg](img/A432409_1_En_8_Fig14_HTML.jpg)\n\
  \n**图 8-14.** 动画对象应出现在图层面板中渐变羽化效果的下方\n\n### 创建滚动文本动画\n\n要创建类似的动画，请遵循以下步骤：\n\n1.\
  \ 在设置为 90° 的矩形或框架上创建渐变羽化效果。\n\n2. 将文本框或表格放置在页面边界边缘。在我的示例中，动画设置为从底部飞入。因此，我将表格放置在页面下方的剪贴板上。确保文本框（或表格）出现在图层面板中渐变的下方，如图\
  \ 8-14 所示。\n\n3. 应用动画。\n\n4. 打开“动画”面板，为您希望动画飞入的位置选择动画预设。在我的示例中，我使用了 `Fly-In from\
  \ Bottom`。在“动画”菜单中选择 `To Current Location`。对于不透明度，选择 `None`。勾选 `Hide until Animated`\
  \ 并将持续时间设置为 6 秒。\n\n5. 调整位置。\n\n6. 将文本框/表格移动到动画结束时的最终位置，如图 8-15 所示。\n\n   ![A432409_1_En_8_Fig15_HTML.jpg](img/A432409_1_En_8_Fig15_HTML.jpg)\n\
  \n   **图 8-15.** 将对象移动到最终位置\n\n7. 调整运动路径。\n\n8. 点击运动路径的起点（参见图 8-15）并将其移动到页面边缘。确保动画从页面边缘开始并移动到当前位置。\n\
  \n9. 检查“定时”面板。\n\n10. 注意此示例中的“定时”面板（参见图 8-16）。我将所有水果链接在一起以同时淡入。该组显示在“定时”面板的顶部。在水果淡入之后，文本/表格开始动画。\n\
  \n    ![A432409_1_En_8_Fig16_HTML.jpg](img/A432409_1_En_8_Fig16_HTML.jpg)\n\n  \
  \  **图 8-16.** 动画顺序在“定时”面板中显示\n\n11. 预览动画。点击“定时”面板中的 `Preview Spread: EPUB` 按钮来预览动画。\n\
  \n\n\n## 8.6 为动画添加音效\n\n添加音效能让动画更加生动。音频文件需要保存为 `.mp3` 格式。如果你有 `.wav` 或 `.aiff` 格式的音频文件，可以使用\
  \ Adobe Media Encoder 将其转换为 `.mp3` 格式。\n\n如果需要获取音频文件，可以在 [`www.Freesound.org`](http://www.freesound.org)\
  \ 找到许多免费下载资源。浏览丰富的 Freesound 库，你会发现大量不同的音效。\n\n准备好音频文件和动画后，就可以为动画项目添加音效了。在 InDesign\
  \ 中，音频文件的导入方式与其他资源相同。选择 **文件 ➤ 置入** 并放置音频文件。默认情况下，音频文件会在 InDesign 的版面视图中显示一个海报图形。当你在\
  \ EPUB 交互预览窗口中查看该文件，或导出文档时，会在音频文件底部看到一个控制条。如果版面中的海报图像尺寸过小，控制条可能难以查看和使用。\n\n如果打算使用按钮来控制播放，可以将音频文件的导入尺寸设置得很小（例如\
  \ 1 像素 × 1 像素）以使其不碍事。此外，你可以将音频文件添加到单独的图层中，如图 8-17 所示。\n\n![A432409_1_En_8_Fig17_HTML.jpg](img/A432409_1_En_8_Fig17_HTML.jpg)\n\
  \n图 8-17。\n\n如果无法将音频文件放置在填充对象后方，请将音频帧尺寸设置为 1 像素 × 1 像素\n\n### 8.6.1 设置媒体属性\n\n放置音频文件后，打开\
  \ **媒体** 面板。默认情况下，你会在预览区域看到一个扬声器图标。如果你将海报图像设置为 `无`，则音频图标将不会显示在音频帧中。\n\n你在此处需要进行的唯一设置是勾选\
  \ `页面加载时播放` 复选框。你可以使用按钮来触发声音事件，但如果不使用按钮，则勾选此复选框。\n\n### 8.6.2 同步音频与动画\n\n如果你希望音频文件与动画同步播放，需要在\
  \ **定时** 面板中进行同步设置。打开 **定时** 面板，选择要与音频文件同步的动画。按住 Shift 键单击选择音频文件，然后点击面板底部的 `一起播放`\
  \ 按钮。\n\n## 8.7 结合多状态对象使用动画\n\n有时你可能有多个不同的动画希望在按钮事件中播放。你可能希望根据读者点击按钮来让多个不同的对象和文本框产生动画效果。问题在于，点击按钮时，你只能看到图层堆栈中的第一个项目或项目组产生动画。为了解决这个问题，你可以使用多状态对象\
  \ (MSO)，并分配不同的按钮来显示 MSO 中的不同状态。我们将在第 9 章 更详细地介绍 MSO。\n\n查看图 8-18。你将看到在 MSO 的一个状态上播放两个动画的最终效果。页面底部的地图是按钮。当用户点击一个按钮时，大地图会改变，右侧的文字会从左侧飞入，中间的解释框会使用\
  \ `放大` 动画进行缩放。\n\n![A432409_1_En_8_Fig18_HTML.jpg](img/A432409_1_En_8_Fig18_HTML.jpg)\n\
  \n图 8-18。\n\n动画播放后看到的最终 MSO 状态\n\n要构建类似的设计，你需要遵循一系列步骤。首先，必须使用 **图层** 面板来简化工作，并且每个图层都应具有描述性名称。如果不合理利用\
  \ **图层** 面板，你很容易迷失方向。\n\n窗口左侧的大地图是一个置入的对象。另外两个对象则是动画对象。你首先创建动画并预览每个动画，以确保其能正常播放。完成动画制作后，将对象编组。在我的示例中，我有七个组。每组编组完成后，创建一个多状态对象。底部的按钮用于触发相应的对象状态。听起来很简单，对吧？要查看项目是如何设置的，请按照以下步骤操作。\n\
  \n## 创建多状态对象\n\n1.  创建一个新的 InDesign 文档。\n\n2.  打开 **图层** 面板，将图层 1 重命名为 `背景`。如果希望在设计中添加任何背景图像或标题文本，将这些对象添加到背景图层。隐藏背景图层并创建一个新图层。在我的设计中，我使用了七个图层来分别显示每个国家/州。你可以预先创建所有预计会用到的图层，也可以在后续布局设计过程中逐步创建。\n\
  \n3.  命名一个新图层，并将对象和文本放置在该图层上。在我的示例中，我从加利福尼亚州开始。我将加州的大地图放在左侧，添加一个解释框，并添加一个包含文字的文本框。\n\
  \n4.  为第一个对象制作动画。我们从右侧的文本框开始。我们希望这个框从左侧飞入。将文本框移动到右侧。如果需要参考线来对齐其他所有文本框，可以从左侧标尺拖出一条参考线。打开\
  \ **动画** 面板，选择 `从左侧飞入` 预设。将动画设置为 `当前位置`。点击对象并将运动路径向左移动，使动画从地图的右侧开始（见图 8-19）。\n\n\
  ![A432409_1_En_8_Fig19_HTML.jpg](img/A432409_1_En_8_Fig19_HTML.jpg)\n\n图 8-19。\n\
  \n调整运动路径，使其从地图右侧开始\n\n5.  为第二个对象制作动画。在我的示例中，中间的对象使用 `放大` 预设进行动画制作。我们将比例设置为 150%。根据放置时对象的大小，你可能需要稍微调整比例。不断预览动画，直到效果符合你的要求。\n\
  \n6.  设置按钮事件。在我的示例中，页面底部有小地图和文字。选择一个对象及其对应的文字，并将它们编组（`对象 ➤ 编组` 或 `Ctrl/⌘+G`）。选中编组后的对象，打开\
  \ **按钮和表单** 面板并创建一个新按钮。（点击新建按钮图标或从类型菜单中选择 `按钮`。）点击 `+` 图标添加一个事件。从动画菜单中选择该事件。再次点击\
  \ `+` 图标，并从动画菜单中选择第二个动画（见图 8-20）。\n\n\n好的，作为高级文档工程师，我已根据您提供的格式要求和注意事项，对原文进行了翻译和排版。\n\
  \n\n![A432409_1_En_8_Fig20_HTML.jpg](img/A432409_1_En_8_Fig20_HTML.jpg)\n*图 8-20.\
  \ 在“按钮和表单”面板中添加动画*\n\n7.  **检查时间轴面板。** 选中按钮后，打开“时间轴”面板，确认动画按照您希望的顺序播放。如果需要更改顺序，请在“时间轴”面板中点击并上下拖动动画。\n\
  8.  **预览动画。** 点击“动画”面板中的预览图标。点击“播放”按钮播放动画。如果动画显示不正确，您需要返回对象并仔细检查动画。\n9.  **将项目编组。**\
  \ 在创建 MSO 时，选择您希望在某个给定状态下显示的所有项目，并将它们编组（`Ctrl/⌘+G`）。\n10. **在图层面板中重命名该组。** 默认情况下，InDesign\
  \ 会将编组的项目放在一个新图层上，并将图层名称添加为组名。在处理动画组时，请将其更改为一个描述性的名称。在我的示例中，我将图层重命名为 `California`。\n\
  11. **按照相同的步骤创建其他动画组。** 请确保在完成每个组后预览动画。\n\n至此，您可以创建一个新的多状态对象。\n\n我在第 9 章中详细介绍了多状态对象。为了让您了解本项目的进展方向，我从编组的对象和动画创建了一个\
  \ MSO。您可以在图 8-21 中看到不同的对象状态。版式底部的按钮操作被分配了触发器，用于查看 MSO 中的不同状态。我们将在第 9 章中讨论具体操作方法。现在，您需要知道的是，可以创建包含不同状态（这些状态下包含内容和动画）的\
  \ MSO，并通过单击按钮来查看不同的状态。\n\n![A432409_1_En_8_Fig21_HTML.jpg](img/A432409_1_En_8_Fig21_HTML.jpg)\n\
  *图 8-21. “对象状态”面板显示根据“图层”面板中指定的名称命名的每个状态的名称*\n\nMSO 和动画可以在固定版式的电子书阅读器和 Adobe Publish\
  \ Online（预览）中查看。对于交互式 PDF 文档，您需要创建一种变通方法。有关动画和交互式 PDF 的更多信息，请参见第 15 章。\n\n## 8.8\
  \ 探索一些项目创意\n\n您可以使用动画创建大量项目。为了激发您的创造力，我将在这里讨论几个。剩下的就看您的了。只要跳出思维定势，您就会发现许多使用 InDesign\
  \ 动画功能的新颖有趣的方式。\n\n### 8.8.1 为徽标添加动画\n\n当您添加交互性、视频、声音和动画时，数字出版物在许多方面都比印刷品更具优势。印刷品需要一个引人注目的图形或醒目的标题来吸引读者进入文档或故事。在创建出版物时，您应该尝试思考如何让读者融入内容。让它变得有趣，让它充满动感，并提供一些惊喜元素。这些方法能保证在瞬间抓住读者的注意力。\n\
  \n对于数字出版文档，一种引人注目的方法是在首页添加一个影片文件或动画。与其使用简单的标题，不如让封面变得有趣，并创造出相当酷的效果。\n\n在图 8-22 中，是一个商业文档的封面。这可以是一份年度报告、财务报告、五年计划或任何其他此类商业文档。图中所示的封面包含几个动画，具体如下：\n\
  \n*   **竖线：** 您在图中看到的竖线是从中心开始绘制的两条线。\n*   **动画文本：** 第一行文本逐个字符地出现。在第一行文本出现后，单词 `THE`\
  \ 从顶部飞入。单词 `MARKET` 淡入。\n*   **动画徽标：** 竖线左侧的徽标旋转到当前外观。\n\n![A432409_1_En_8_Fig22_HTML.jpg](img/A432409_1_En_8_Fig22_HTML.jpg)\n\
  *图 8-22. 包含动画的商业文档封面 为徽标添加动画*\n\n要创建类似的设计，请遵循以下步骤：\n\n1.  **创建一个新的 InDesign 文档。**\
  \ 使用您想要查看文档的设备上的输出设置。在我的示例中，我使用 iPad。在“图层”面板中，将默认图层命名为 `Background`，并为一个矩形框架应用颜色。如果您希望背景为白色，则无需填充矩形形状或框架。\n\
  2.  **绘制两条竖线。**\n3.  **在每条线上绘制一个框架，并用与背景相同的颜色填充这些框架。**\n4.  **为线条添加动画。** 选择上方线条上方的顶部框架，打开“动画”面板。从“预设”菜单中选择\
  \ `Appear`。从“动画”菜单中选择 `From Current Appearance`，然后点击“动画”菜单下方、“旋转”菜单右侧的“参考点”图标中的顶部中央方块，如图\
  \ 8-23 所示。编辑 H 文本框并输入零 (`0`)。对于“不透明度”，从菜单中选择 `None`。对第二个框架重复这些步骤，隐藏底部线条，但点击“参考点”图标中的底部中央方块。\n\
  \n![A432409_1_En_8_Fig23_HTML.jpg](img/A432409_1_En_8_Fig23_HTML.jpg)\n*图 8-23.\
  \ 为线条和框架添加动画时设置原点*\n\n5.  **设置“时间轴”面板以一起播放线条动画。** 打开“时间轴”面板并选择这两个动画。点击“一起播放”图标。\n\
  6.  **为单词 FRUIT 添加动画。** 文本由单独的文本框架组成——每个字符一个框架。按您希望它们动画化的顺序选择所有字符，然后打开“动画”面板。从“预设”菜单中选择\
  \ `Appear`。将“持续时间”设置为 `.125` 秒，并勾选“隐藏直到动画化”。**注意：** 默认情况下，动画按您选择的顺序播放。\n7.  **为单词\
  \ THE 添加动画。** 选择该单词，然后从“预设”菜单中选择 `Fly In From Top`。移动运动路径，使动画从页面顶部开始。\n8.  **为单词\
  \ MARKET 添加动画。** 该单词在字符动画完成后简单地淡入。选择该单词，然后从“预设”菜单中选择 `Fade In`。对于“不透明度”，从菜单命令中选择\
  \ `Fade Out`。我们知道这似乎与动画相矛盾，但请相信我，这会产生您期望的动画效果。\n9.  **为徽标添加动画。** 选择徽标，然后选择 `Rotate`\
  \ ➤ `180 CW`。在“旋转”文本框中输入 `720°`，并勾选“隐藏直到动画化”复选框。\n10. **预览文档。** 点击“动画”面板中的预览图标以预览结果。\n\
  \n这种动画可以在固定版式 EPUB 和 Adobe Publish Online（预览）中查看。对于交互式 PDF，您需要创建一种变通方法，如我在第 15 章中所述。\n\
  \n\n\n### 8.8.2 创建商业图表\n\n你可以通过各种设计让静态图表变得有趣。然而，为商业图表添加一些动画效果会使其更具吸引力。你可以先通过动画展示图表的一部分来引导观众关注关键点，然后再淡入其余部分，或者选择添加辅助动画。\n\
  \n有许多不同的动画可以添加到图表中。你可以分解饼图的不同扇区并使其移入或移出，让柱状图从基线向上运动，为折线图中的线条添加动画，等等。\n\n在这个示例中，我使用一个简单的折线图来演示一些可能性。在图\
  \ 8-24 中，你会看到图表完成动画后的最终效果。在这个图表中，我们为线条添加动画并淡入数据点。从底部行开始，每条线条仿佛被绘制出来，随后第二个数据点出现，线条继续延伸到最后一个数据点。接下来，中间线条以相同方式动画，最后是顶部线条。\n\
  \n![A432409_1_En_8_Fig24_HTML.jpg](img/A432409_1_En_8_Fig24_HTML.jpg)\n\n**图 8-24.**\
  \ 动画完成后的折线图\n\n#### 创建动画图表\n\n要创建类似的动画图表，请执行以下操作：\n\n1.  在一个新的 InDesign 文档中，为图表网格和文本添加元素，然后添加所有其他非动画内容。\n\
  2.  放置好背景元素后，锁定 `Background` 图层，并为动画创建一个新图层。\n3.  绘制线条。关于动画线条，需要理解的主要一点是，你必须先绘制一条水平线。你不能绘制一条斜线，然后像图\
  \ 8-24 中那样沿着路径为其添加动画。绘制一条水平线后，使用 `Rotate` 工具旋转线条。当线条旋转到合适角度后，你可以使用 `Direct Selection`\
  \ 工具移动端点，根据需要使线条变短或变长。以相同方式继续绘制多条线条，并将其放置在与图 8-24 中类似的位置。务必在 `Layers` 面板中使用描述性名称命名这些线条。对于底部线条，我使用的图层名称如\
  \ `Line Bottom 1`、`Line Bottom 2` 等等。\n4.  添加数据点。我在线条上方添加了数据点，以隐藏任何轻微偏移。这样，动画时线条看起来就是一条连续的线。请确保在\
  \ `Layers` 面板中使用描述性名称命名数据点。我将数据点命名为 `Point Bottom 1`、`Point Bottom 2` 等等。\n5.  创建线条动画。你可以选择所有线条并添加一个统一的动画。你可能需要为单个线条更改的唯一设置是\
  \ `Animation` 面板中的原点。选中线条后，打开 `Animation` 面板。从 `Preset` 菜单中选择 `Appear`。将持续时间设置为\
  \ 0.75 到 1 秒。从 `Animate` 菜单中选择 `To Current Appearance`。在 `Scale` 文本框中，为宽度输入 `0%`（这会在动画期间保持宽度恒定）。将\
  \ `H`（高度）设置保留为 100%。点击 `Reference Point` 图标中的左下角方块。为 `Opacity` 选择 `None`，并勾选 `Hide\
  \ Until Animated`（见图 8-25）。\n\n![A432409_1_En_8_Fig25_HTML.jpg](img/A432409_1_En_8_Fig25_HTML.jpg)\n\
  \n**图 8-25.** `Animation` 面板中所需的设置\n\n6.  更改原点。在我的示例中，底部和中间组的最后一条线条需要调整原点。选中这两条线条，点击\
  \ `Animation` 面板中的 `Reference Point` 图标左上角。确保检查所有设置。当你在 `Animation` 面板中进行调整时，其他某些项目可能会发生变化。\n\
  7.  为数据点添加动画。选中所有数据点，在 `Animation` 面板的 `Preset` 菜单中选择 `Appear`。将持续时间设置为 0.25，`Opacity`\
  \ 设置为 `None`，并勾选 `Hide Until Animated`。\n8.  设置线条和数据点的时间。打开 `Timing` 面板。选中属于同一组的线条和数据点。这些名称来自\
  \ `Layers` 面板。如果你使用描述性名称命名图层，这项任务会容易得多。这是因为，正如你在图 8-17 中所见，`Timing` 面板会显示这些描述性名称。你需要关联图\
  \ 8-17 中看到的项目。从面板顶部开始，底部行的第二条线条与底部行的第二个数据点关联。当动画播放时，数据点会在第二条线条开始绘制时出现。\n9.  预览最终设计。当动画按你设计的方式运行正常时，就可以将其发布到固定版式\
  \ EPUB 和 Adobe Publish Online（预览）中供人查看了。如果你希望将此类图表包含在交互式 PDF 中，则需要一种变通方法，我将在第 15\
  \ 章中讨论。\n\n## 8.9 总结\n\nInDesign 为你提供了大量的动画预设。本章仅涉及了其中一部分。不过，所有预设的设置方式都类似。你需要关注\
  \ `Animation` 面板中的选项并理解这些设置。尝试使用几种预设，并创建一些你自己的动画来练习。\n\n在下一章中，我们将离开动画，探索多状态对象（MSO）的世界。你会发现\
  \ MSO 在文档中有许多绝佳用途，下一章将详细解释如何创建和使用它们。\n\n"
- '# 9. 使用多状态对象更改对象视图


  多状态对象（通常称为 MSO）为交互式出版物带来了丰富的可能性。MSO 可用于固定版式 EPUB 和 Adobe Publish Online（预览）。你可以通过一种变通方法将包含
  MSO 的文档导出为交互式 PDF 文件，但遗憾的是，它们只在桌面电脑上有效。截至目前，我还没有找到支持 PDF 文件中 MSO 的 PDF 阅读器。


  你可以使用 MSO 查看幻灯片、更改页面内文本、图像和对象的视图。你可以在不同状态中播放动画（如第 8 章所述），并且可以将 MSO 嵌套在其他 MSO 中。


  使用多状态对象为数字出版物带来了巨大的机遇，这是印刷文档无法复制的。MSO 的使用范围只受限于你的想象力。


  ## 9.1 使用对象状态面板


  开始讨论 MSO 时，我们先来看一下所有操作发生的地方——`Object States` 面板。如果你尚未为交互式文档设置工作区，请选择 **窗口** ➤ **交互**
  ➤ **对象状态**。如果该面板已在你工作区内，请点击 `Object States` 面板。默认情况下，该面板打开时除创建新 MSO 外无其他可用选项。当你创建新的
  MSO 时，面板会显示与 MSO 内容相关的信息，如图 9-1 所示。


  ![A432409_1_En_9_Fig1_HTML.jpg](img/A432409_1_En_9_Fig1_HTML.jpg)


  **图 9-1.** 选择 **窗口** ➤ **交互** ➤ **对象状态** 以打开 `Object States` 面板


  在 `Object States` 面板中，一旦你创建了新的 MSO，你会找到以下选项：




  '
- "# 1. 对象状态面板概述\n\n**对象名称**：默认情况下，当您首次向文档添加新的 MSO 时，`对象名称`为`多状态 1`。即使文档中只有一个 MSO，您也应该在此文本框中输入描述性名称。养成命名`对象名称`和`状态`名称的习惯，以便在您重新查看文档或分配按钮操作时更加轻松。\n\
  \n**状态**：在`对象名称`下方的列表中，显示了 MSO 中各状态及其缩略图。单击某个状态，该状态便会显示在文档窗口中。您可以轻松选中某个状态，然后在文档中通过双击该状态来编辑其内容。默认情况下，状态名称依次为`状态\
  \ 1`、`状态 2`、`状态 3`等。如需重命名状态，请单击一次，稍作停顿，再单击一次，然后为状态输入新名称。您应该为 MSO 中的所有状态添加描述性名称。\n\
  \n**对象状态菜单**：单击`对象状态面板`右上角的图标，即可打开`对象状态`菜单。您可以在此选择多个菜单项，包括以下内容：\n\n- **新建状态**：单击`新建状态`可创建新的\
  \ MSO，或复制现有 MSO 中选定的状态。\n- **删除状态**：在面板中选择一个状态，然后单击即可从 MSO 中删除该状态。\n- **隐藏直至触发**：如果您希望\
  \ MSO 在文档打开时处于隐藏状态，请单击此项。当您单击分配了查看某个状态的按钮时，该状态便会在文档中打开。\n- **向状态添加对象**：选择一个状态，然后按住\
  \ `Shift` 键单击页面中不属于该状态的对象。随后，当您选择此命令时，该对象将被添加到该状态中。\n- **粘贴至状态**：如果您复制了一个对象并希望将其粘贴到\
  \ MSO 中，请单击此项，将剪贴板上的内容粘贴到当前可见的 MSO 状态中。\n- **将状态释放为对象**：单击菜单中的此项时，选定的状态会从 MSO 中提取出来，但其余状态仍包含在\
  \ MSO 中。此菜单命令与`删除状态`命令的区别在于，提取出的状态会保留在文档中，而`删除状态`则类似于剪切状态，会将其从文档中移除。\n- **将所有状态释放为对象**：当您想要重新开始时，此命令非常有用，例如，您可能需要进行多次编辑，然后再重新创建\
  \ MSO。选择此命令后，MSO 会从文档中删除，但其所有内容仍然保留。\n- **将所有多状态对象重置为第一状态**：如果您选择了除第一状态以外的某个状态，此命令会将默认视图重置为在文档中查看时打开第一状态。\n\
  - **面板选项**：默认情况下，缩略图设置为显示最小视图。如果您单击`面板选项`，则会打开一个弹出菜单，您可以在其中选择将缩略图更改为更大的视图。\n- **预览跨页**：单击此按钮可在`EPUB\
  \ 交互预览面板`中预览文档。按住 `Alt/⌥` 键并单击，可在`SWF 预览面板`中预览。\n- **将复制的对象粘贴到选定状态**：当您想要创建嵌套的 MSO\
  \ 时，此按钮非常有用。您可以将一个 MSO 粘贴到某个给定状态中，更改状态视图，再将另一个 MSO 粘贴到第二个状态中，依此类推。嵌套 MSO 需要一点技巧，我将在“创建嵌套\
  \ MSO”一节中解释。\n- **创建新状态**：单击此按钮可根据文档中选定的对象创建 MSO，或复制现有 MSO 中选定的状态。单击此按钮所产生的效果与单击`新建状态`菜单命令相同。\n\
  - **删除选定状态**：单击一个状态，然后单击垃圾桶图标，该状态便会从 MSO 中删除。使用垃圾桶图标与从菜单中选择`删除状态`的效果相同。\n\n## 9.2\
  \ 创建多状态对象\n\n要创建新的多状态对象，您必须在页面上选中一些对象。这些对象可以是图像、对象、文本框，或是它们的组合。一旦选中图像/对象和/或文本框，请单击`对象状态面板`右下角的`将所选内容转换为多状态对象`图标，或打开`对象状态面板`菜单并单击`新建状态`。\n\
  \n当您创建 MSO 时，如果这是您在文档中创建的第一个 MSO，`对象状态面板`会将其命名为`多状态 1`。您创建的下一个 MSO 将被命名为`多状态 2`，依此类推。\n\
  \n在对象名称下方，您会看到创建 MSO 时选中的每个对象都对应一个独立的状态。如果您将对象放置在有图层名称的图层上，状态名称将继承图层名称。如果这些对象被放置在\
  \ InDesign 的同一图层上，您将看到不同状态被命名为`状态 1`、`状态 2`等，如图 9-2 所示。\n\n![A432409_1_En_9_Fig2_HTML.jpg](img/A432409_1_En_9_Fig2_HTML.jpg)\n\
  \n**图 9-2.** 如果您没有将对象放置在具有图层名称的图层上，MSO 将使用默认名称\n\n您的首要任务是为对象名称和各个状态名称添加一些描述性名称。如果您想通过按钮事件触发状态视图，这将使您的工作变得轻松得多。\n\
  \n通常，MSO 中的第一个项目会被选中，成为该 MSO 的默认视图。实际上，MSO 的工作方式类似于处理图层。您可以隐藏一个图层（或状态），然后下一个图层（或状态）便会显示出来。如果您单击`对象状态面板`中的某个状态，该状态将成为默认视图。在图\
  \ 9-3 中，我为对象名称和各个状态添加了名称。我还选中了`日落`。如果我们关闭`对象状态面板`，`日落`状态将成为默认视图。\n\n![A432409_1_En_9_Fig3_HTML.jpg](img/A432409_1_En_9_Fig3_HTML.jpg)\n\
  \n**图 9-3.** 编辑了对象名称和状态名称的 MSO。\n\n要编辑状态的名称，请单击该状态名称一次，稍作停顿，然后再次单击。状态名称即被选中，您可以输入一个新名称。\n\
  \n如果您想缩放 MSO，首先需要选中它。当您选中 MSO 时，您会看到其边界框上出现一条虚线。您可以使用`选择`工具单击并拖拽划过 MSO 来选中它，或者单击边界框的边缘直到看到虚线。MSO\
  \ 被选中后，您可以像缩放任何图形一样缩放它；也就是说，按住 `Ctrl/⌘+Shift` 键并拖动角手柄即可。\n\n### 创建新的 MSO\n\n请按照以下步骤创建新的\
  \ MSO：\n\n1.  在 InDesign 文档中导入一些图像，使用几个文本框，或同时使用两者。\n2.  （可选）对齐对象。\n3.  打开`对齐面板`（`窗口\
  \ ➤ 对象和版面 ➤ 对齐`）。对象不必非要对齐，但如果您有多个相同大小的对象，对齐后它们在页面上看起来会更美观。选中所有对象，然后单击`水平居中对齐`或`左对齐`图标。再次单击`垂直居中对齐`或`顶对齐`图标。**注意：**\
  \ 如果您想在一个状态下对齐多个对象，您必须将这些对象编组。\n4.  创建一个新的多状态对象。使用`选择`工具框选所有对象，然后打开`对象状态面板`。单击`将所选内容转换为多状态对象`按钮，或打开`对象状态面板`菜单并选择`新建状态`。\n\
  5.  为 MSO 命名，并为每个状态命名。MSO 的默认名称是`多状态 1`。在`对象名称`文本框中输入更具描述性的名称。如果对象没有放置在单独的图层上，您应该会看到`状态\
  \ 1`、`状态 2`等。要更改状态名称，请单击名称一次，稍作停顿，然后再次单击。为每个状态输入新名称。在图 9-4 中，您可以看到我创建的 MSO，并为对象名称和状态名称添加了名称。\n\
  \n\n\n## 9.3 编辑 MSO\n\n![A432409_1_En_9_Fig4_HTML.jpg](img/A432409_1_En_9_Fig4_HTML.jpg)\n\
  \n**图 9-4.** 为对象名称键入一个名称，并重命名每个状态的名称。\n\n6. 设置默认视图。堆栈中的第一项通常会被选中，当 MSO 在页面上显示时，它将成为默认视图。要将视图更改为另一个状态，请点击您希望作为默认视图显示的状态。\n\
  \n> **注意：** 当您在**对象状态面板**中点击某个状态时，没有用于确认操作的**确定**按钮。您只需点击，该状态便会成为默认状态。\n\n## 9.3\
  \ 编辑 MSO\n\n在图 9-1 中，您会看到一些用于编辑 MSO 的选项。我为每个菜单命令提供了简要说明，但现在我们要更详细地探讨其中一些选项。在处理 MSO\
  \ 时，您可能需要移除状态、添加状态、编辑状态的内容，或者添加一些空内容，以使 MSO 中的某个状态显示为空。让我们从更深入地研究这些任务开始。\n\n###\
  \ 9.3.1 删除状态\n\n在图 9-5 中，您可以看到一个 MSO 以及在**对象状态面板**中被选中的最后一个状态。与**对象状态面板**相对应，您还可以看到文档中正在查看的状态。\n\
  \n![A432409_1_En_9_Fig5_HTML.jpg](img/A432409_1_En_9_Fig5_HTML.jpg)\n\n**图 9-5.**\
  \ MSO 中的最后一个状态被选中。\n\n如果您想移除底部的状态，有两种方法可以处理状态的删除。理解这两种选项及其作用对您来说很重要。\n\n如果您点击面板中的垃圾桶图标，或打开**对象状态**菜单并选择**删除**，或者右键点击该状态并选择**删除**，则该状态将从\
  \ MSO 中被永久删除，同时该对象也会从您的文档中被删除。除非您按 `Ctrl/⌘+Z` 撤销此操作，否则无法恢复。如果您绝对确定要从文档中删除该状态/对象，这样做没问题。\n\
  \n另一种移除状态的方法是，选中该状态，然后在**对象状态面板**菜单中选择**将状态释放为对象**，或者右键点击该状态并选择**将状态名称释放为对象**，其中\
  \ `state name` 是对象状态的名称。使用此方法时，该状态会从 MSO 中移除，但状态会转换回对象并保留在文档中。因此，第一种方法是从文档中彻底删除该状态，而第二种方法则是移除状态但保留文档中的内容。\n\
  \n> **提示：** 如果您不确定是否要从文档中删除某个状态/对象，并且想将其暂时保留，以防以后可能重用，可以创建一个新图层并将其命名为类似 `Not Used`\
  \ 的名称。将释放的状态对象移至该图层，并在**图层面板**中隐藏该图层。该对象会保留在您的文档中，但会从布局中隐藏。您可以随时前往该图层，将该对象移动到另一个可见的图层中。\n\
  \n### 9.3.2 将状态释放为对象\n\n当我们选中一个状态并在**对象状态面板**中选择**将状态释放为对象**时，我们知道会发生什么。该状态会转换为一个对象，并保留在文档中。假设您想重新开始。比如说，您需要做大量工作来编辑\
  \ MSO 内的对象，并且您想添加新状态，也许还要删除一些其他状态。\n\n重新开始的方法是将所有状态都转换回对象。为此，请选中 MSO，然后在**对象状态**菜单中选择**将所有状态释放为对象**。这些状态会转换为对象，并像您创建\
  \ MSO 时一样，相互堆叠在相同的位置。在图 9-6 中，您可以看到左侧有一个 MSO，右侧是将其所有状态释放为对象后的效果。\n\n![A432409_1_En_9_Fig6_HTML.jpg](img/A432409_1_En_9_Fig6_HTML.jpg)\n\
  \n**图 9-6.** 选中一个 MSO，然后选择**将所有状态释放为对象**。\n\n从这里开始，您可以移动这些对象、进行编辑、向 MSO 添加新对象以及删除对象。编辑完成后，只需选中所有对象，然后点击**将所选内容转换为多状态对象**按钮，或者在**对象状态面板**菜单中选择**新建状态**。\n\
  \n### 9.3.3 添加新状态\n\n假设您正在处理一个布局并创建了一个 MSO。之后，您意识到还有另一个状态要添加到该 MSO 中。这个状态可能是包含更多内容的状态，或者您可能希望将默认视图设置为空白视图，以便内容仅在用户点击按钮时才出现。\n\
  \n我们以空白状态为例。在 MSO 可见的情况下，在该 MSO 上方绘制一个无描边且无填充的框架。框架可以很小，并且不需要占据 MSO 的整个边界区域。\n\n\
  同时选中 MSO 和该框架，然后点击**对象状态面板**中的**将所选内容转换为多状态对象**按钮，或者打开菜单并选择**新建状态**。该框架将作为新状态添加到\
  \ MSO 中。您可以重复使用此方法向 MSO 添加新状态。\n\n> **注意：** 当您选中对象并查看**对象状态面板**底部的按钮时，工具提示显示为**将所选内容转换为多状态对象**。当您向现有\
  \ MSO 添加新状态时，工具图标会变为一个左下角带有 `+` 符号的空白页面，并且工具提示显示为**将对象添加到可见状态**。\n\n如果您创建了一个空白状态，并希望它作为默认视图显示，请在**对象状态面板**中将该状态拖到堆栈顶部并选中它，如图\
  \ 9-7 所示。当用户打开文档时，添加了 MSO 的位置不会显示任何内容。如果您为查看不同状态分配了按钮，则每次点击按钮时都会看到相应的状态。\n\n![A432409_1_En_9_Fig7_HTML.jpg](img/A432409_1_En_9_Fig7_HTML.jpg)\n\
  \n**图 9-7.** 默认状态为空，并显示在堆栈顶部。\n\n### 9.3.4 选择状态中的内容\n\n假设在某个给定状态下有多个不同的对象，而您想删除这些对象或修改它们的外观。当您点击\
  \ MSO 时，您选中的是 MSO 本身。双击，您会选中 MSO 中当前选中状态内的一个对象。如果某个给定状态下有多个对象，按下 `Shift` 键并再次点击，您可以选中两个对象。如果您再次按下\
  \ `Shift` 键并点击，则前两个对象会被取消选中，而第三个对象会被选中。InDesign 不允许您通过 `Shift`-点击在某个给定状态下选中超过两个对象。\n\
  \n假设您在地图上有许多图钉，而您想更改这些图钉的外观或调整它们的大小。选择对象的最佳方式是在**图层面板**中。当然，这意味着您需要有组织良好的图层，并且图层应使用描述性名称进行命名。\n\
  \n打开**图层面板**，点击图层名称最右侧的框，或者按下 `Alt/⌥` 键并点击图层名称以选中该项目，如图 9-8 所示。要选择多个对象，请在点击图层名称右侧的框或按住\
  \ `Alt/⌥` 键点击图层名称时，同时按下 `Shift` 键。\n\n![A432409_1_En_9_Fig8_HTML.jpg](img/A432409_1_En_9_Fig8_HTML.jpg)\n\
  \n**图 9-8.** 在**图层面板**中点击图层名称最右侧的框以选中该对象。\n\n> **注意：** 当您按下 `Alt/⌥` 键并点击图层名称时，您会选中目标图层上的所有内容。如果您需要选择图层上的单个对象，请在**图层面板**中展开以查看单个对象，然后`Shift`-点击各个对象，或者按下\
  \ `Alt/⌥` 键并点击每个对象名称。\n\n\n\n### 9.3.5 将内容粘贴到 MSO 中\n\n这项任务你会经常用到，尤其是在创建嵌套 MSO 时，稍后我将在“创建嵌套\
  \ MSO”一节中解释这一点。如果你复制了一个对象或文本框，打开`对象状态面板`，选择一个特定状态，然后点击`对象状态面板`右下角的`将复制的对象粘贴到所选状态`按钮，如图\
  \ 9-9 所示。\n\n![A432409_1_En_9_Fig9_HTML.jpg](img/A432409_1_En_9_Fig9_HTML.jpg)\n\
  \n图 9-9.\n\n点击`将复制的对象粘贴到所选状态`，将剪贴板上的内容粘贴到该状态中\n\n当你只有一个对象要粘贴到某个状态时，这种方法很好用。在文档中查看该状态，并将对象放置在你希望它在状态中显示的位置。选择`编辑`\
  \ ➤ `剪切`，将对象剪切到剪贴板。在`对象状态面板`中选择该状态，然后点击按钮粘贴对象。\n\n然而，当你想要将多个对象粘贴到某个状态时，可能会遇到问题。如果你将对象放置在你希望它们在状态中显示的位置，并使用相同的方法进行剪切并点击`将复制的对象粘贴到所选状态`，最终结果会是粘贴后的对象并未出现在你预期的位置。\n\
  \n为了将多个对象精确添加到指定位置，你需要采用不同的方法：\n\n- 将对象移动到它们应该出现的位置，但不要复制或剪切。\n- 选中对象后，按住 `Shift`\
  \ 键并点击 MSO（确保在选中 MSO 时，其边界框上出现虚线），如图 9-10 所示。\n\n    ![A432409_1_En_9_Fig10_HTML.jpg](img/A432409_1_En_9_Fig10_HTML.jpg)\n\
  \n    图 9-10.\n\n    选择对象和 MSO\n- 当包括 MSO 和目标状态在内的所有对象都在`对象状态面板`中可见时，将光标移到`对象状态面板`中的按钮上。注意，工具提示现在显示为`将对象添加到可见状态`。\n\
  - 点击该按钮，对象就会被添加到`对象状态面板`中所选的状态中。\n\n当你想要将按钮添加到各个状态时，这个方法尤其有用。这些按钮仅在特定状态可见时才处于活动状态。\n\
  \n## 9.4 创建按钮以更改状态视图\n\n除非你能更改视图以查看堆栈中的其他状态，否则 MSO 的价值不大。要更改视图，你可以创建一个可以循环浏览每个状态的单个按钮，或者创建多个单独的按钮来查看各个状态。例如，假设你想设置一个类似幻灯片的功能。你可以创建一个按钮，当读者单击或点按该按钮时，它会逐个推进各个状态。你也可以使用图片的缩略图，并将每个缩略图转换为一个按钮。当读者单击或点按某个按钮时，该缩略图对应的大图就会显示出来。\n\
  \n在按钮点击时显示不同状态的选择，是在`按钮和表单面板`中处理的。当你选择一个对象并打开`按钮和表单面板`时，点击`转换为按钮`图标（面板右下角），或者从`类型`菜单中选择`按钮`。然后，点击`按钮和表单面板`中的`+`图标，打开一个包含多个选项的菜单，如图\
  \ 9-11 所示。\n\n![A432409_1_En_9_Fig11_HTML.jpg](img/A432409_1_En_9_Fig11_HTML.jpg)\n\
  \n图 9-11.\n\n点击`+`图标打开`动作`菜单\n\n对于 MSO，你可以选择的选项是`转到下一个/上一个状态`或`转到状态`。如果你选择`转到下一个状态`，读者单击或点按一个按钮即可查看下一个状态。再次单击/点按，则会打开下一个状态，依此类推。这样一来，只需要一个按钮就能推进状态视图。如果你选择`转到状态`，则该动作会显示分配给特定按钮的状态。此行为旨在配合多个按钮使用，每个按钮分配不同的状态视图。\n\
  \n### 创建分配了独立状态的按钮\n\n要创建分配了独立状态的按钮，请按照以下步骤操作：\n\n1.  创建一个 MSO。\n2.  按照前面“创建多状态对象”一节中的步骤，在\
  \ InDesign 页面中添加一个 MSO。创建你想要用作按钮的图标或文本，以便查看各个状态。将第一个对象转换为按钮。在我的示例中，我使用了图 9-12 中文档左侧的苹果切片作为按钮。选择第一个对象，打开`按钮和表单面板`。从`类型`菜单中选择`按钮`（或点击面板底部的`转换为按钮`图标）。为按钮输入一个名称。\n\
  \n    ![A432409_1_En_9_Fig12_HTML.jpg](img/A432409_1_En_9_Fig12_HTML.jpg)\n\n  \
  \  图 9-12.\n\n    创建你想要用作按钮的独立对象或文本\n3.  设置按钮动作。\n4.  点击`+`图标打开`动作`菜单，并选择`转到状态`。如果你希望一个按钮能循环浏览不同的状态，请选择`转到下一个状态`。\n\
  5.  选择对象和状态。默认情况下，如果你的跨页上只包含一个 MSO，则该 MSO 会以其名称显示在`对象`菜单中。当你使用不同的按钮来打开不同的状态时，你需要在`状态`菜单中指定对应的状态。在我的示例中，对象名称为`水果描述`，顶部的按钮显示名为`葡萄`的第一个状态。第二个按钮设置为打开名为`梨`的下一个状态，依此类推。每个状态都在`状态`菜单中被选中。`状态`菜单仅在您使用`转到状态`动作时可用。如果您选择`转到下一个状态`，则无法在`状态`菜单中选择不同的状态。InDesign\
  \ 会假定您想循环浏览各个状态。\n6.  完成其余按钮的分配。同样，如果你有多个用于查看不同状态的按钮，请对剩余按钮重复相同的步骤（步骤 3 到步骤 5）。如果你只有一个设置为`转到下一个状态`的按钮，并希望用它来循环浏览不同的状态，那么你在`按钮和表单面板`中的工作就完成了，可以准备预览了。\n\
  7.  预览文档。点击`按钮和表单面板`左下角的`预览跨页`图标。在`EPUB 交互预览`窗口中，点击按钮以确保其工作正常。\n\n## 9.5 创建嵌套 MSO\n\
  \n假设你有一个 MSO，其中包含欧洲之旅的各种状态。你有一些图片和文字，展示了意大利、法国、英国和德国的不同地点。当你点击意大利的按钮时，会显示一张图片和一段文字（或者该状态中的任何内容）。假设你想展示你参观过的一些景点，但仅限于意大利境内的景点。你创建了第二个\
  \ MSO，其中包含罗马斗兽场、万神殿、比萨斜塔、梵蒂冈博物馆等的图片和描述。在这种情况下，你将有一套按钮用于选择不同的国家，另一套按钮用于浏览单个国家对应的内容。\n\
  \n\n\n### 9.5.1 在一个多状态对象内粘贴另一个多状态对象\n\n尽管本节标题暗示你可以将一个多状态对象（MSO）粘贴到另一个多状态对象内部，但在处理\
  \ MSO 时，你无法使用 `编辑` ➤ `粘贴入` 命令。你需要使用其他方法在 MSO 内部粘贴 MSO。\n\n在此示例中，我们需要嵌套 MSO，以便通过点击按钮切换到下一个州/省，从而查看各个国家/地区内的不同站点。使用我在上一节（“创建用于切换状态视图的按钮”）中讨论的示例，我们将使用相同的\
  \ MSO，并针对不同的水果（而非国家/地区）创建第二个 MSO。\n\n**嵌套多状态对象**\n\n要嵌套 MSO，你需要使用一点小技巧。具体操作如下：\n\
  \n1.  在 InDesign 文档中创建一个 MSO。对于此示例，我们使用在“创建用于切换状态视图的按钮”一节中创建的第一个 MSO。\n2.  为第二个\
  \ MSO 创建内容。如果页面上有背景元素，请使用`图层面板`并隐藏背景。为第二个 MSO 的内容创建一个新图层。添加对象、文本或两者，并将每个对象编组。创建要在新\
  \ MSO 中使用的其他内容。使用`对齐面板`对齐对象。\n3.  创建第二个 MSO。选择对象，然后从`对象状态面板`菜单中选择`新建状态`，或单击面板中的`将所选内容转换为多状态对象`图标。此时，你可能会认为可以直接剪切第二个\
  \ MSO，选择你想要它出现的状态，然后从`编辑`菜单中选择`粘贴入`。但不幸的是，当你剪切或复制 MSO 时，`粘贴入`命令是不可用的。\n4.  将 MSO\
  \ 锚定到一个空文本框架。你应该打开`对象状态面板`并选择要用于第二个 MSO 的状态。将第二个 MSO 定位在你希望它在第一个 MSO 内出现的位置。创建一个文本框架——一个没有描边、没有填充、没有文本的小框架。单击第二个\
  \ MSO，然后从锚点拖动到空文本框架，如图 [9-13] 所示。\n\n    ![A432409_1_En_9_Fig13_HTML.jpg](img/A432409_1_En_9_Fig13_HTML.jpg)\n\
  \n    **图 9-13.** 将第二个 MSO 锚定到一个空文本框架\n5.  剪切文本框架。\n6.  选择文本框架，然后选择`编辑` ➤ `剪切`或按\
  \ `Ctrl/⌘+X`。剪切文本框架时，MSO 也会被剪切，两者都将被放入剪贴板。\n7.  将剪贴板内容粘贴到选定的状态中。\n8.  不使用`编辑` ➤\
  \ `粘贴入`命令，而是单击`对象状态面板`中的`将复制的对象粘贴到选定的状态`按钮（参见图 [9-14]）。确保在`对象状态面板`中选中了要粘贴到的目标状态。\n\
  \n    ![A432409_1_En_9_Fig14_HTML.jpg](img/A432409_1_En_9_Fig14_HTML.jpg)\n\n  \
  \  **图 9-14.** 单击`将复制的对象粘贴到选定的状态`\n9.  添加按钮以查看第二个 MSO 中的不同状态。在图层堆栈的顶部创建一个新图层。为“下一个”和“上一个”视图按钮绘制框架。如果你在\
  \ MSO 的状态中已有显示按钮点击方向的美术字，例如左右箭头，你可以创建无描边和无填充的框架并将其转换为按钮。如果状态中没有美术字，请创建或导入一个图形并将其转换为按钮。\n\
  10. 重复相同的步骤（步骤 2 到 7）以添加 MSO 并将其锚定到第一个 MSO 中的不同状态。\n\n### 9.5.2 为嵌套的 MSO 添加按钮\n\n\
  创建嵌套的 MSO 后，下一步是添加用于更改第二个 MSO 状态视图的按钮。你可以创建`转到下一个状态`和`转到上一个状态`按钮，或者创建一个可以循环到下一个状态的按钮。在这方面，MSO\
  \ 会循环遍历其状态。\n\n**为嵌套的 MSO 添加按钮**\n\n1.  第一步是创建按钮，但不用担心为按钮添加任何事件。你需要在完成向 MSO 添加按钮后处理动作。要将按钮放入给定的状态，你需要将按钮定位在你希望它们作为活动区域的位置，然后选择`编辑`\
  \ ➤ `剪切`。\n2.  打开`对象状态面板`，单击要添加按钮的状态。如果你有多个状态并想添加一个`下一项`和`上一项`按钮，则需要将它们添加到每个状态中。\n\
  3.  将按钮放在剪贴板上后，单击`对象状态面板`中的`将复制的对象粘贴到选定的状态`按钮。\n4.  单击面板中的下一个状态，然后使用`对象状态面板`中的同一按钮粘贴对象。\n\
  5.  将所有按钮粘贴到各个状态后，你需要分配按钮动作。对于每个按钮，你需要根据按钮类型添加`转到下一个状态`或`转到上一个状态`动作。\n\n你可以在图 [9-14]\
  \ 中看到我的示例。默认视图在右侧显示加利福尼亚州的地图。在“Samplers”一词上有一个可以打开嵌套 MSO 的按钮。在嵌套的 MSO 上，我们有覆盖整个状态的不可见按钮，以便用户点击或轻触时，他们会看到下一个状态。在此示例中，当用户点击加利福尼亚州地图时，右侧会变为“Robotic\
  \ Farming”，如图 [9-15] 所示。\n\n![A432409_1_En_9_Fig15_HTML.jpg](img/A432409_1_En_9_Fig15_HTML.jpg)\n\
  \n**图 9-15.** 嵌套 MSO 在 MSO 右侧显示并前进到下一个状态时的外观\n\n\n\n## 9.6 显示/隐藏对象状态\n\n到目前为止，你已经学会了如何创建\
  \ MSO（多状态对象）以及如何通过按钮触发事件。你现在知道如何前往一个给定的对象状态，也知道了如何在 MSO 中切换到下一个状态。然而，到目前为止你所完成的操作，都是在按钮事件上显示一个对象状态，但当点击另一个按钮时，你还没有隐藏之前显示的对象状态。为了更清楚地说明这一点，请查看图\
  \ 9-16。\n\n![A432409_1_En_9_Fig16_HTML.jpg](img/A432409_1_En_9_Fig16_HTML.jpg)\n\
  \n**图 9-16.** 设计中的窗口是按钮\n\n当你点击一个按钮时，一个图形会出现在相应的窗口中。继续点击按钮，每个窗口都会显示一张图片，如图 9-17\
  \ 所示。\n\n![A432409_1_En_9_Fig17_HTML.jpg](img/A432409_1_En_9_Fig17_HTML.jpg)\n\n\
  **图 9-17.** 当用户点击每个按钮时，窗口中出现图片\n\n在这个特定的设计中，最好将文件设置为在每个相应的窗口中仅显示一张图片。当用户点击一个按钮时，之前的图片被隐藏，同时新图片出现。这样，当用户与文档交互时，只有一张图片是可见的。\n\
  \n## 创建只有单个状态可见的状态\n\n要创建一个页面上只有单个状态可见的效果，请执行以下操作：\n\n1.  正确设置文件。对于这类文档，最好使用图层。在本例中，我有一个用于空窗口的图层，一个用于已占用窗口的图层，以及一个包含其余素材的背景图层。\n\
  2.  在图片旁边绘制一个空框架（无描边和无填充）。\n3.  选择该框架和图片。（见图 9-18。）\n\n    ![A432409_1_En_9_Fig18_HTML.jpg](img/A432409_1_En_9_Fig18_HTML.jpg)\n\
  \n    **图 9-18.** 选择空框架和图片\n4.  创建一个 MSO。\n5.  命名不同的状态。在本例中，我使用从顶部开始的数字 1-9 来命名，如图\
  \ 9-19 所示。将空状态命名为`Empty`、`Home`或任何容易识别为空白状态的名称。\n\n    ![A432409_1_En_9_Fig19_HTML.jpg](img/A432409_1_En_9_Fig19_HTML.jpg)\n\
  \n    **图 9-19.** 已命名的对象状态\n6.  选择每个窗口并将其转换为按钮。\n7.  从第一个按钮开始，将按钮操作设置为`Go to State`，并从`State`下拉菜单中选择`1`，如图\
  \ 9-20 所示。\n\n    ![A432409_1_En_9_Fig20_HTML.jpg](img/A432409_1_En_9_Fig20_HTML.jpg)\n\
  \n    **图 9-20.** 将每个窗口转换为按钮，并将操作设置为`Go To State`\n8.  继续将其余的空窗口转换为按钮，并将操作设置为`Go\
  \ To State`。\n\n当用户点击一个按钮时，该按钮下方的图片就会出现。当用户点击第二个按钮时，前一张图片被隐藏，同时新图片进入视野。\n\n## 9.7\
  \ 总结\n\n在本章中，我们学习了多状态对象。你学会了如何创建 MSO 以及如何通过添加、更改和删除特定状态来编辑它们，如何添加空白状态，以及如何设置默认状态。你还学会了如何嵌套\
  \ MSO、将 MSO 锚定到文本框架以及粘贴到状态内部。\n\n关于 MSO 的使用还有很多东西要学。一旦你熟悉了创建和设置 MSO 属性，你就会发现它们可以应用于固定版式\
  \ EPUB 和`Publish Online`文档的许多用途。\n\n在下一章中，你将学习如何在 InDesign 文档中包含富媒体（视频和音频）。\n\n"
- "# 10. 使用富媒体\n\n你可能会认为使用音频和视频是一项简单的任务，因为 InDesign 可以轻松导入音频和视频。然而，在数字出版方面，如果你不是视频专家，确实有很多东西需要学习。\n\
  \n你需要熟悉使用正确的媒体格式、如何裁剪视频上那些难看的黑条、为视频添加海报帧、将视频压缩到尽可能小的尺寸、为视频添加遮罩等等。在本章中，我将介绍如何准备你的媒体，并提供一些技巧，以便在为导出为各种格式时获得最佳效果。\n\
  \n## 10.1 准备媒体\n\n如果能够用智能手机或摄像机拍摄视频，将文件下载到电脑，放入 InDesign，然后导出为你想要用于数字出版文档的格式，那就太好了。然而，现实是，在拍摄视频后，在将文件放入\
  \ InDesign 之前，你还有一些工作要做。\n\n### 10.1.1 使用正确的媒体格式\n\n简单地说，在准备媒体时，你应该使用两种文件格式。这些文件格式包括：\n\
  \n*   **音频：** 在你的出版物中使用音频文件时，只有一个选择。你必须将文件保存为`.mp3`格式。如果你有`.aiff`、`.wav`或其他格式，你需要将音频转换为`.mp3`。\n\
  *   **视频：** InDesign 支持 Flash `FLV`、`F4V`和`SWF`格式。但是，Apple 用户无法在其 iOS 设备上查看这些内容。你可以使用的最佳格式，并且是支持查看视频文件的所有设备均可使用的格式，是采用`H.264`编码的`MP4`或`M4V`格式。\n\
  \n如果你有媒体文件，可以使用 Adobe Creative Cloud 应用程序将大多数音频和视频格式转换为可接受的格式。对于音频文件，你可以使用 Adobe\
  \ Audition 或 Adobe Media Encoder 转换文件。有关使用 Media Encoder 的更多信息，请参阅本章后面的“使用 Adobe\
  \ Media Encoder”部分。如果你不是 Creative Cloud 订阅者，可以通过在互联网上搜索找到一些免费的音频转换应用程序和价格适中的应用程序。\n\
  \n转换视频最好使用 Adobe Media Encoder。但是，你需要是 Creative Cloud 订阅者才能使用 Media Encoder。与音频转换器类似，你也可以通过互联网搜索找到许多不同的视频转换应用程序。\n\
  \n> **注意：** 仅对音频文件使用`.MP3`格式，对视频文件使用采用`H.264`编码的`MP4`或`M4V`格式。\n\n### 10.1.2 旋转视频\n\
  \n你可能有一些用智能手机拍摄的视频文件，这些视频可能是以竖屏模式拍摄的。当你预览视频时，它显示为旋转状态。你可以使用 Adobe Photoshop 轻松解决此问题。\n\
  \n- **在 Photoshop 中打开视频：** 要理解视频是由一系列不同的帧组成的。如果你尝试进行一些调整（例如在某一帧上绘画），则该调整仅应用于相应的帧。你可以裁剪一帧，并且该裁剪操作会应用于后续所有帧。不过，在某些情况下，你可能想要使用智能对象来确保所有编辑都应用于所有帧。\n\
  - **将视频图层转换为智能对象：** 当你在 Photoshop 中对视频进行调整时，需要将视频转换为智能对象。要执行此操作，请在“图层”面板中右键单击视频文件，然后选择`转换为智能对象`，如图\
  \ 10-1 所示。\n\n    ![A432409_1_En_10_Fig1_HTML.jpg](img/A432409_1_En_10_Fig1_HTML.jpg)\n\
  \n    **图 10-1.** 将图层转换为智能对象\n- **变换视频图层：** 此时，你可以使用 Photoshop 的变换工具来旋转视频。选择`图像`\
  \ ➤ `旋转`，然后根据所需的旋转方向选择`90°顺时针`或`90°逆时针`。\n- **渲染视频：** 完成编辑后，选择`文件` ➤ `导出` ➤ `渲染视频`。在`渲染视频`对话框中，选择视频的格式和大小，如图\
  \ 10-2 所示，然后单击`渲染`。\n\n    ![A432409_1_En_10_Fig2_HTML.jpg](img/A432409_1_En_10_Fig2_HTML.jpg)\n\
  \n    **图 10-2.** 设置视频导出属性并单击`渲染`以渲染视频\n\n请注意，从 Photoshop 渲染的视频在导出的文件中会带有一些开销。从\
  \ Photoshop 导出视频后，你应该始终使用 Adobe Media Encoder 来压缩视频并减小文件大小。\n\n\n\n### 10.1.3 编辑视频\n\
  \n假设你想要调整视频的亮度、色彩校正和对比度，或者想要将视频从 RGB 色彩转换为灰度并应用棕褐色调。对这些类型的调整，最佳解决方案是使用 **Adobe Photoshop**。像\
  \ Adobe Premiere 和 Adobe After Effects 这样的程序可以帮助你制作出一些惊艳的效果，但这需要深入学习新的应用程序。如果你是\
  \ Photoshop 用户，那么你可以直接在 Photoshop 中轻松完成所需的大多数调整。\n\n当你在 Photoshop 中打开视频时，必须将图层转换为智能对象，正如我在上一节“旋转视频”中讨论的那样。对于亮度和对比度调整、色彩校正，甚至将视频转换为灰度，最佳方案是使用\
  \ Camera Raw 滤镜。一旦视频被转换为智能对象，选择 `滤镜 ➤ Camera Raw 滤镜`。Camera Raw 滤镜将打开，如图 10-3 所示。\n\
  \n![A432409_1_En_10_Fig3_HTML.jpg](img/A432409_1_En_10_Fig3_HTML.jpg)\n\n图 10-3.\
  \ 将视频图层转换为智能对象后，打开 Camera Raw 滤镜\n\n如果你之前没有使用过 Camera Raw 滤镜，第一次打开时，这个对话框可能会看起来很复杂。但是，在这个窗口中你只需要处理少数几个调整选项。这些调整包括：\n\
  \n*   **色温**：向左或向右移动色温滑块，可以使视频看起来偏冷或偏暖。在某些情况下，这里没有绝对的对错。你只需要让视频呈现出你想要的视觉效果。在其他情况下，你可能会发现某个视频确实需要调暖或调冷。使用此滑块进行调整。\n\
  *   **曝光**：你可能会有一个在黄昏或夜晚拍摄的视频片段需要稍微提亮，或者有一个过曝的视频片段需要稍微压暗。向左或向右移动曝光滑块来调整曝光。\n*  \
  \ **对比度**：要增加对比度，请将滑块稍微向右移动。要降低对比度，请将其向左移动。注意不要过度增加或减少对比度。\n*   **高光与阴影**：我把这两个调整选项放在一起，因为几乎每个图像或视频片段都需要调整高光和阴影。高光可能是云层等视频片段中最亮的区域。阴影可能是风景中的树木，其阴影区域丢失了细节。将高光滑块向左移动以增加亮部区域的细节，将阴影滑块向右移动以突出暗部区域的更多细节。\n\
  \n> **注意**：照片或视频片段中最亮和最暗区域之间的度量称为动态范围。市面上最好的单反相机和摄像机拥有大约 10 档光圈的范围。人眼的动态范围约为 18\
  \ 档光圈。因此，所有用于捕捉静帧和视频片段的数码设备都会截断媒体文件中最亮和最暗的区域。通过使用高光/阴影调整，你可以恢复一些通常能改善媒体文件的丢失数据。\n\
  \n*   **清晰度、鲜艳度和饱和度**：向右移动滑块以增加中间调、鲜艳度和饱和度。数字出版相对于印刷品的一个优势是所见即所得（WYSIWYG）。进行在屏幕上看起来不错的调整。你将在查看你作品的所有设备上看到类似的结果。\n\
  *   要将 RGB 视频片段转换为灰度，只需将饱和度滑块向左移动到头，以降低颜色饱和度。\n\n#### 应用棕褐色调\n\n要应用棕褐色调，请在降低片段饱和度后，单击右上角的色调曲线图标。\n\
  \n1.  单击“点曲线”选项卡，然后从“通道”菜单中选择“红色”。\n2.  单击对角线中间，并在“输出”文本框中输入 `141`。\n3.  从“通道”菜单中选择“绿色”，然后单击线条中间的一个点。\n\
  4.  在“输出”文本框中输入 `131`。\n5.  从“通道”菜单中选择“蓝色”，然后单击线条中间的一个点。在“输出”文本框中输入 `119`。（参见图 10-4。）\n\
  \n![A432409_1_En_10_Fig4_HTML.jpg](img/A432409_1_En_10_Fig4_HTML.jpg)\n\n图 10-4.\
  \ 在“色调曲线”选项卡中对每个通道进行调整\n\n这些调整为你提供了在视频上创建棕褐色调效果的起点。你可以调整色调曲线点来加深或减淡棕褐色效果。\n\n在 Camera\
  \ Raw 转换器中完成调整后，单击“确定”，然后选择 `文件 ➤ 导出 ➤ 渲染视频`。\n\n### 10.1.4 裁剪视频\n\n视频的两侧、顶部和底部出现了那些讨厌的黑条。如何去除它们？你可以使用以下两种方法之一来裁剪视频：\n\
  \n1.  在 Photoshop 中打开视频。使用裁剪工具裁剪视频，然后使用 `文件 ➤ 导出 ➤ 渲染视频` 导出视频文件。\n2.  你也可以在 InDesign\
  \ 中裁剪掉视频上任何不需要的侧边栏。移动包含视频的框架手柄来裁剪视频。如果使用此方法裁剪，你可能会丢失控制器，并且需要在布局中添加播放、暂停和停止视频的按钮。\n\
  \n如果你可以接受丢失控制器，请选择 `文件 ➤ 置入` 并导入一个视频片段。移动边界框以裁剪边缘，如图 10-5 所示。裁剪视频仅适用于固定布局的 EPUB，在\
  \ iBooks 和 Adobe Digital Editions 上均支持，并且当你导出到 Adobe Publish Online（预览版）时也适用。对于交互式\
  \ PDF 文件，如果你在 InDesign 中裁剪视频，则裁剪区域将不会在 PDF 文档中生效。为了在交互式 PDF 文档中移除裁剪区域，你需要在 Photoshop\
  \ 中裁剪视频。\n\n![A432409_1_En_10_Fig5_HTML.jpg](img/A432409_1_En_10_Fig5_HTML.jpg)\n\
  \n图 10-5. 在 InDesign 中裁剪视频\n\n### 10.1.5 移动控制器\n\n如果你将动画和动画表格转换为视频文件（正如我将在第 12 章中解释的那样），你可能希望将控制器向下移动一点，以便视频控制器不会遮挡最下面一行数据。你可以重新排列版式的\
  \ EPUB 中向下移动控制器，但此视图仅在桌面版电子书阅读器上生效。设备上的电子书阅读器会将控制器显示在视频顶部。要了解如何将控制器移动到视频下方，请参见第\
  \ 12 章。\n\n## 10.2 使用 Adobe Media Encoder\n\n由于用户会下载你的出版物，你需要控制文件大小，避免过长的下载时间。你可能身处拥有\
  \ 4G 网络的区域，下载速率可能超过 40 Mbps。但是，有些查看你作品的人可能生活在第三世界国家，甚至美国农村地区，那里仍在使用拨号连接。在以上两种情况下，带宽都很窄，连接速度可能比你习惯的速度要慢得多。因此，作为经验法则，请尽量将你的视频文件控制在每分钟小于\
  \ 10MB，并在出版物中仅使用短视频片段。\n\n\n\n### 10.2.1 选择预设\n\n打开 Adobe Media Encoder 时，你会看到一个略显复杂的画面。这是因为其中有大量预设，允许你将视频导出为不同尺寸的多种设备，以及高清、标清等各种质量格式。\n\
  \n使用 Media Encoder 的第一步是导入视频。你可以点击“队列”字样正下方的 `+` 图标，也可以直接将视频片段拖拽到队列面板中。\n\n将媒体文件加载到\
  \ Media Encoder 后，点击默认预设选项旁边的向下箭头即可选择预设，如图 10-6 所示。请选择一个你想用于导出视频的预设。\n\n![A432409_1_En_10_Fig6_HTML.jpg](img/A432409_1_En_10_Fig6_HTML.jpg)\n\
  \n图 10-6. 从预设菜单选择一个预设\n\n在 Media Encoder 窗口的左侧，你会看到预设浏览器。如果你选中某个预设并右键点击其名称，可以通过在弹出的菜单中选择“预设设置”来打开预设设置。我通常会对预设做一项调整。如果你滚动预设设置窗口，在窗口底部会找到比特率设置。你可以尝试降低目标比特率和最大比特率的值。将两者都设为\
  \ `0.59` 作为起始值，如图 10-7 所示。最终，你需要测试渲染结果，确保视频达到你期望的质量标准。\n\n![A432409_1_En_10_Fig7_HTML.jpg](img/A432409_1_En_10_Fig7_HTML.jpg)\n\
  \n图 10-7. 右键点击预设浏览器中的预设，并选择“预设设置”以打开所选预设的设置\n\n调整比特率时请务必谨慎。如果数值降得过低，视频画面会出现斑驳瑕疵，整体质量很可能无法令人满意。\n\
  \n选择预设并完成其他调整后，点击队列面板右上角的绿色右向箭头。Media Encoder 会在视频渲染时显示进度条。\n\n### 10.2.2 保存预设\n\
  \n如果你对预设进行了更改（例如更改了比特率），你可能希望将这些设置保存为一个新预设。这样，每次想使用相同设置时，就无需再打开预设设置窗口进行调整。\n\n要创建新预设，请在预设设置窗口（如图\
  \ 10-7 所示）中进行调整，并为你的新预设输入一个描述性名称。你可以保留默认名称的一部分，然后在名称末尾添加一些文本，以便在长长的预设列表中轻松识别。在我的示例中，我使用了“Apple\
  \ TV, iPad, iPhone, 3G and Newer – 360 Widescreen 29.5”预设，并将其重命名为“Apple iPad 360\
  \ Wide 0.5 Bitrate”。你必须先完成新预设的命名。如果在更改名称之前就选择“保存副本”，你将无法回头编辑名称。\n\n更改新预设名称后，点击“保存副本”。屏幕上可能看不出太多变化，但副本已保存，并且会出现在左侧窗格预设列表的最顶部。导入一个视频并打开预设列表，你应该会看到新预设出现在菜单顶部。\n\
  \n为了让您了解我所实现的文件压缩效果，我的原始媒体片段在对“Apple iPad 360P Widescreen 23.9”预设进行调整后为 104MB。使用默认预设后，我将文件大小减小到\
  \ 9.0MB。使用调整后的预设（降低了比特率）后，文件大小减小到了 6.5MB。我成功将视频大小比默认预设进一步减小了 2.5MB。考虑到用户下载您的数字出版物，这节省了相当大的流量。\n\
  \n## 10.3 使用媒体面板控制媒体\n\n准备好视频后，你会发现将视频添加到数字出版物的后续步骤要轻松得多，也更有趣一些。\n\n在 InDesign 中导入视频，就像导入其他内容一样。选择“文件”\
  \ ➤ “置入”，选择一个视频，然后点击“确定”。你也可以从媒体面板导入视频。打开媒体面板：点击“窗口” ➤ “交互” ➤ “媒体”。媒体面板打开后，点击右下角的“置入视频或音频文件”按钮。\n\
  \n### 10.3.1 使用媒体面板\n\n当你导入视频并打开媒体面板时，会看到所有可用于调整媒体片段播放方式的选项，如图 10-8 所示。\n\n![A432409_1_En_10_Fig8_HTML.jpg](img/A432409_1_En_10_Fig8_HTML.jpg)\n\
  \n图 10-8. 导入视频后，你可以在媒体面板中选择多个选项\n\n让我们看看使用媒体面板时你拥有的所有选项：\n\n*   **选项**：如果你希望媒体在页面可见时自动播放，请勾选“载入页面时播放”复选框。你也可以通过按钮触发播放，或者让用户直接点击视频帧。如果你使用按钮，或者希望用户点击视频帧，则不要启用“载入页面时播放”复选框。你还可以选择循环播放媒体文件（反复播放）。如媒体面板中提示，媒体循环功能不适用于交互式\
  \ PDF 文件。\n\n注：“载入页面时播放”功能在设备上不起作用。从 iOS 6 开始，苹果公司禁用了在页面加载时播放视频的功能，以保护那些按运营商流量计费的用户的利益。在大多数设备和电子阅读器上，你需要点击视频或播放控件才能播放视频。\n\
  \n\n\n**Poster**：海报图像是媒体剪辑的默认视图。海报图像可以从视频帧中派生。您可以选择`None`不使用任何图像，选择`Standard`（会显示一个难看的视频图标），或选择`From\
  \ Image`。如果选择`From Image`，将打开一个对话框，您可以在其中定位并导入图像文件。在大多数情况下，您会希望使用视频帧，方法为选择`From\
  \ Current Frame`。使用`Media Panel`（媒体面板）中预览区域下方的滑块，移动它直到找到您想用作海报图像的帧。当页面在查看器中加载时，海报图像会立即显示。当您找到帧后，点击`Poster`菜单右侧的圆圈图标。您也可以定位一个帧，打开菜单并选择`From\
  \ Current Frame`，这也会将当前视图中的帧用作海报图像。\n\n**Controller**：对于控制器皮肤，您有大量的选择。这些皮肤是出现在媒体剪辑底部的媒体控制器。如果您选择一些简单的皮肤（例如`SkinOverPlay`），控制器只有一个按钮——一个播放按钮和一个恢复按钮。请记住，如果在`InDesign`中裁剪视频，您会丢失控制器。当导出到`Publish\
  \ Online`和`EPUB`时，网络浏览器和电子阅读器会使用它们自己的控制器。此处的设置仅适用于交互式 PDF。\n\n**Show Controller\
  \ on Rollover**：如果您使用控制器，则应勾选此框。当用户将鼠标悬停或点击媒体时，控制器会出现。将鼠标移开或点击视频框外部，则会关闭控制器。\n\n\
  **Navigation Points**：您可以向媒体剪辑添加标记，这些标记将在用户点击按钮时将其发送到某个位置。点击`+`图标，在当前视图中的帧上添加一个标记。滚动剪辑，并在相应位置添加另一个标记。\n\
  \n**Preview Spread**：您可以通过点击`Media Panel`（媒体面板）左下角的按钮，在`EPUB Interactivity Preview\
  \ Panel`（EPUB 交互性预览面板）或`SWF Preview Panel`（SWF 预览面板）中预览跨页。要预览 SWF，请按住`Alt/⌥`键并点击`Media\
  \ Panel`中的`EPUB Interactivity Preview`图标。\n\n**Place a Video from a URL**：如果您有一个很大的媒体剪辑，不适合包含在出版物中，您可以让媒体从网站流式传输。点击此按钮，并在其中输入文件位置的\
  \ URL。\n\n**Set Options for Exporting Interactive PDF**：在打开的对话框中，您的选择是：当出版物是交互式\
  \ PDF 文档时，使用`Adobe Reader`或`Acrobat`中的浮动窗口。如果您有 SWF 文件，请务必不要使用此选项。浮动窗口会布满 PDF 查看器的页面，您无法将其移动到想要的位置。\n\
  \n**Place Video or Audio File**：使用此按钮导入媒体。\n\n> 注意：您可以导入音频文件以及以 MP3 格式保存的视频文件。\n\
  \n### 10.3.2 使用按钮控制导航点\n\n导航点使文档的读者能够跳转到媒体剪辑中的不同部分。用户通常会点击分配给导航点的按钮。\n\n使用按钮控制导航点\n\
  \n要了解如何完成此任务，请执行以下操作：\n\n1.  将媒体剪辑导入`InDesign`后，为其添加导航点。请参见图 10-8 以帮助您添加导航点。\n2.\
  \  在页面布局中，在媒体剪辑旁边创建按钮。这些对象可以是文本框、图像或同时包含文本和图像。如果同时使用了文本和图标或图像，请将这些项目编组。选中该对象后，打开`Buttons\
  \ and Forms Panel`（按钮和表单面板），并从菜单中选择`Button`。\n3.  将第一个按钮分配到一个导航点。在`Buttons and Forms\
  \ Panel`（按钮和表单面板）中，点击`+`图标添加新动作。\n4.  从菜单中选择`Video`，然后选择您要使用的视频剪辑。如果页面上只有一个视频，`InDesign`会默认使用当前视频。\n\
  5.  在`Options`菜单中，选择`Play from Navigation Point`。在`Point`菜单中，选择您希望与该按钮关联的导航点，如图\
  \ 10-9 所示。\n\n    ![A432409_1_En_10_Fig9_HTML.jpg](img/A432409_1_En_10_Fig9_HTML.jpg)\n\
  \n    图 10-9。\n\n    从相应菜单中选择视频、选项和点\n6.  重复相同的步骤（步骤 2-3）以向不同按钮添加类似的事件。请记住，您必须选择一个新按钮，然后分别向第二个、第三个等按钮添加动作。\n\
  7.  预览跨页。点击`Buttons and Forms Panel`（按钮和表单面板）左下角的`Preview`图标，在`EPUB Interactivity\
  \ Preview Panel`（EPUB 交互性预览面板）中进行预览。\n\n\n\n## 10.4 创建视频遮罩\n\n也许你想为视频添加一个边框，或者让公司标志出现在视频上方。你可以通过创建视频遮罩来添加此类元素。需要注意的一点是，视频等互动元素应放置在自己的图层上。这并非必须，但会让你的\
  \ InDesign 工作轻松许多。\n\n另一点需要注意的是，在创建复合路径或 MSO 时，同一图层上不应有任何其他对象。如果你在创建复合路径或 MSO 时意外选中了其他对象，情况会变得非常混乱。只需将不同对象放置在不同图层上，并在拼版时锁定图层，就能保持整洁。\n\
  \n## 创建视频遮罩\n\n要了解如何创建视频遮罩，请遵循以下步骤：\n\n1.  如果你希望设计中出现背景对象，请将它们添加到最底层图层，并将该图层命名为\
  \ `Background`。锁定背景层，然后创建两个新图层。将一个图层命名为 `Video`，另一个图层命名为 `MSO` 或类似名称。\n2.  将遮罩放置在\
  \ `MSO` 图层上。在我的示例中，我使用了一个包含地图插图的边框框架，如图 10-10 所示。\n\n    ![A432409_1_En_10_Fig10_HTML.jpg](img/A432409_1_En_10_Fig10_HTML.jpg)\n\
  \n    图 10-10.\n\n    添加遮罩并将其放置在单独的图层上\n\n3.  选中遮罩的所有对象，然后选择**对象** > **路径** > **建立复合路径**。创建复合路径就像制作一个甜甜圈，你可以透过中心看到东西。在我的示例中，边框和地图可以填充，而对象的其余部分是透明的。\n\
  4.  为路径着色。此步骤为可选。如果你想要颜色填充，请选中该路径，然后从**色板**面板中应用颜色。（只需选中对象，然后点击面板中你想要应用的颜色即可。）\n\
  5.  创建多状态对象。这是重要的一步。如果不创建 MSO，你将无法将遮罩移动到视频上方。\n6.  在 `Video` 图层上导入视频。锁定所有其他图层，然后选中\
  \ `Video` 图层。接着选择**文件** > **置入**并导入视频。\n7.  在**图层**面板中调整顺序。如果遮罩位于视频下方，你需要移动 `Mask`\
  \ 图层，使其在图层面板堆栈中位于视频上方。\n8.  设置视频在页面加载时播放。选中视频并打开**媒体**面板。勾选**加载页面时播放**复选框。\n9. \
  \ 预览结果。点击**媒体**面板中的**预览**图标。如果所有步骤都正确执行，你应该能看到视频在遮罩后面播放。在图 10-11 中，你可以看到我们示例的结果。\n\
  \n    ![A432409_1_En_10_Fig11_HTML.jpg](img/A432409_1_En_10_Fig11_HTML.jpg)\n\n\
  \    图 10-11.\n\n    播放视频时，它会出现在遮罩后面\n\n如果你的遮罩覆盖了视频的底部，你将无法访问任何控制器皮肤。如果你希望用户能够播放、暂停和停止视频，可以添加按钮来执行这些操作。创建一个按钮并打开**按钮和表单**面板。点击\
  \ `+` 图标，然后从**动作**菜单中选择**视频**。如果你的设计中只有一个视频，默认视频会出现在**视频**菜单中。在**选项**菜单中，选择**播放**或其他你希望处理视频的方式。为不同的选项（如**暂停**、**停止**等）创建多个按钮。\n\
  \n## 10.5 添加多状态对象\n\n如果你阅读过第 9 章，你就会知道 InDesign 中使用多状态对象的功能有多么强大。Adobe Systems 那些出色的软件工程师为\
  \ InDesign 用户提供了惊人的工具，使你能够创建出色的交互式文档。\n\n在富媒体方面，你可以使用 MSO 来显示/隐藏视频。这为你提供了更大的版面空间，读者可以看到内容，并且只需点击一下按钮，就会出现一个类似弹出视频的窗口。读者观看视频后，可以关闭它并返回版面。\n\
  \n在图 10-12 中，我们有这样一个文档。页面底部的文本和图形与 **观看视频** 文字以及文字上方的一个按钮一起出现。\n\n![A432409_1_En_10_Fig12_HTML.jpg](img/A432409_1_En_10_Fig12_HTML.jpg)\n\
  \n图 10-12.\n\n在 **观看视频** 文字上方有一个播放按钮\n\n当读者点击该按钮时，会打开一个视频。在图 10-13 中，你可以看到点击按钮的结果。MSO\
  \ 包含一个空框架和一个带有透明黑色矩形的框架。矩形内部是视频。\n\n![A432409_1_En_10_Fig13_HTML.jpg](img/A432409_1_En_10_Fig13_HTML.jpg)\n\
  \n图 10-13.\n\n当读者点击按钮时，MSO 中的第二个状态打开\n\n### 添加 MSOs\n\n设置方法如下：\n\n1.  创建两个框架，并将其中一个填充为黑色。\n\
  2.  对黑色框架应用一些透明度。使用**对象** > **效果** > **透明度**命令，调整黑色矩形的透明度。另一个框架没有填充和描边。当文档打开时，会显示**空状态**，隐藏黑色矩形和视频。\n\
  3.  为这两个矩形创建一个 MSO，并在**对象状态**面板中为其命名。选中这两个对象，打开**对象状态**面板，然后点击**创建新状态**按钮或从**对象状态面板**菜单中选择**新建状态**。\n\
  4.  绘制一个文本框架，并显示视频状态。在**对象状态**面板中，选中视频状态。在视频状态上绘制一个小文本框架。\n5.  将视频锚定到文本框架。将视频锚点拖到文本框架上。要了解有关嵌套\
  \ MSO 的更多信息，请参阅第 9 章。\n6.  剪切文本框架。在这种情况下，视频也会被剪切。\n7.  将文本框架和视频粘贴到视频状态中。在**对象状态**面板中，点击**将复制的对象粘贴到选中状态**。请确保你在**对象状态**面板中选中的是正确的状态。在此示例中，视频状态被选中。\n\
  8.  创建一个按钮，范围从 MSO 顶部到 **观看视频** 文字上方。到目前为止，一切设置正确。但是，我们需要让读者在观看视频后能返回版面。这就是我们隐藏视频的地方。在视频遮罩的右上角有一个关闭框。我们将使用这个元素作为关闭按钮。\n\
  9.  设置按钮动作。在**按钮和表单**面板中，选择**转到状态**，然后选中**空状态**。当读者点击按钮时，视频和透明框架就会消失。\n\n你可以使用图标或文本供读者点击以隐藏视频状态，但这整个过程有点复杂，我想尽可能简化它。\n\
  \n## 10.6 总结\n\n在本章中，我们学习了如何将视频导入 InDesign，以及如何设置视频播放的各种属性。我们还学习了如何使用 MSO 和创建视频遮罩。\n\
  \n到目前为止，你已经学习了向 InDesign 文档添加交互性的多种方法。你可以使用 **EPUB 交互性预览面板**在 InDesign 中预览结果，但交互式文档的最终用途是在各种设备上查看这些文件。\n\
  \n在下一章中，我们将探讨将文件上传到查看设备的各种方法。\n\n"
- "# 第四部分  \n发布文档\n\n\n\n"
- "# 11. 上传和下载文件\n\n数字出版文档格式多样，可通过多种不同类型的阅读器查看，并且能在多种不同设备上访问。某些阅读器可以直接打开你复制到台式电脑、笔记本电脑和安卓设备上的文件。苹果的封闭生态系统阻止你将文件直接从电脑复制到\
  \ iOS 设备，除非使用第三方应用程序。因此，在创作完你的杰作后，接下来的问题是：“如何将文件放到设备上？”以及“如何将文件添加到我的应用程序中？”\n\n\
  当你在设备（尤其是在台式机和笔记本电脑上）启动应用程序时，大多数应用程序允许你在设备本地上使用 `文件 ➤ 打开` 命令来打开文件。当你使用平板电脑和移动设备时，你要么通过\
  \ Wi-Fi 连接，要么让平板电脑或移动设备的应用程序能够从设备的某个位置访问文件。\n\n有许多不同的文件共享工具可供使用，以及多种不同的方法将文件放到设备上并使其能被阅读器识别。我不会在本章中涵盖所有选项，而是会介绍几种使用不同应用程序访问文件的流行方法。\n\
  \n在第 12 章中，我将讨论在各类`电子书`阅读器中预览 `EPUB` 文件。不过，在预览文件之前，你需要知道如何将文件放到设备上以便查看它们。在本章中，我将讨论电脑与设备之间的文件交换。\n\
  \n## 11.1 将文件从电脑传输到设备\n\n为数字出版物准备文件通常在你的台式机或笔记本电脑上完成。整理好内容后，你需要将文件发送到可能查看你内容的设备应用程序。\n\
  \n根据你使用的电脑操作系统（Windows 或 `Mac OS X`），将文件上传到设备会存在一些特性和差异。\n\n### 11.1.1 从非 iOS 设备传输文件\n\
  \n从 Windows 电脑向设备传输文件相对容易。几乎所有能通过电脑 USB 端口插入的设备，都会打开一个菜单，让你选择如何处理文件。就像插入 U 盘一样，你可以查看设备的内容。文件夹是可见的，只需将文件从电脑拖放到设备即可。同样的方法适用于安卓设备、`Kobo\
  \ 电子阅读器`、亚马逊 `Kindle`、索尼 `电子阅读器` 以及巴诺 `Nook`。\n\n更复杂的一步是知道将文件放置在哪个文件夹中，以便应用程序可以查看它。你的平板电脑上可能有存放\
  \ `图书`、`电子书`、`下载`、`数字版本`、`Amazon`、`Kindle`、`Kobo` 等的位置。有些`电子阅读器`可以访问几乎所有可能存储文件的位置，而其他`电子阅读器`则需要特定的目录位置。你可能需要打开你想要查看的阅读器，寻找一个`导入文件`的按钮。测试你是否能从多个不同的文件夹导入文件，并将文件从平板电脑复制到某个应用程序。四处摸索一下，你最终会找到为每个`电子阅读器`应用程序存储文档的正确位置。\n\
  \n### 11.1.2 将文件传输到 iOS 设备\n\n你有几种方法可以将文件从电脑传输到 iOS 设备。\n\n#### 11.1.2.1 使用 Apple\
  \ iTunes\n\n苹果在 `iTunes` 12 版本中做了许多更改，如果你运行的是最新版本的 `iTunes`，你可能会发现尝试将 `EPUB` 和 PDF\
  \ 文件放入 `iBooks` 简直是一场噩梦。`iTunes` 中不再有`图书`选项卡，左侧也不再显示你的 iOS 设备。你无法像以前在早期版本的 `iTunes`\
  \ 中那样同步书籍。即使你将 `EPUB` 和 PDF 文件添加到电脑上的 `iBooks` 中，你也很可能在设备上的 `iBooks` 应用中看到这些书籍时遇到问题。这真的非常令人沮丧。\n\
  \n与其花大量时间试图弄清楚这个烂摊子，我建议你绕过 `iTunes`，使用 `Dropbox`，正如我稍后在本章“使用 `Dropbox`”一节中所解释的那样。\n\
  \n## 11.2 使用 Android File Transfer\n\n`Android File Transfer` 由谷歌开发，旨在为 `Macintosh`\
  \ 用户提供一种将安卓设备连接到 `Macintosh` 电脑的方法。你可以从 [`https://www.android.com/filetransfer/`](https://www.android.com/filetransfer/)\
  \ 下载这个免费应用程序。\n\n安装 `Android File Transfer` 后，通过 USB 线将安卓设备连接到 Mac，然后启动该应用程序。当你需要在\
  \ `Macintosh` 上运行的 `InDesign` 中测试创建的文档，并希望将文件复制到安卓设备时，这个应用程序非常有用。一旦连接到电脑，你就可以访问文件和文件夹，如图\
  \ 11-1 所示。你可以将文档拖放到安卓设备中（最大 4GB）。\n\n![A432409_1_En_11_Fig1_HTML.jpg](img/A432409_1_En_11_Fig1_HTML.jpg)\n\
  \n图 11-1. `Android File Transfer` 让你可以访问 `Macintosh` 上的文件和文件夹\n\n### 11.2.1 使用 iExplorer\n\
  \n苹果的封闭生态系统阻止你访问 iOS 设备上的文件和文件夹。为了查看要将文件从电脑复制到 iOS 设备的目标文件夹，你需要一个第三方应用程序。`Macroplant`\
  \ 出品的 `iExplorer` 能胜任此工作。你可以从 [`www.macroplant.com`](http://www.macroplant.com)\
  \ 下载免费演示版。如果你想继续使用该程序，需要支付 35 美元购买许可证。\n\n下载并安装 `iExplorer` 后，将你的 iOS 设备连接到 `Macintosh`\
  \ 并启动 `iExplorer`。如图 11-2 所示，你可以访问 iOS 设备的文件和文件夹。你可以删除文件，并将文件从电脑拖放到 iOS 设备上的文件夹中。\n\
  \n![A432409_1_En_11_Fig2_HTML.jpg](img/A432409_1_En_11_Fig2_HTML.jpg)\n\n图 11-2.\
  \ `iExplorer` 让你可以访问 iOS 设备的文件和文件夹\n\n\n\n## 11.3 通过网址复制文件\n\n在平板电脑和智能手机上运行的 PDF\
  \ 阅读器中，通过网页浏览器传输文件是一种非常常见的方式。有趣的是，大多数第三方 PDF 阅读器都使用这种方法，而 Adobe 自家的 Adobe Acrobat\
  \ Reader 却不支持通过网页浏览器传输文件。在平板或智能手机上使用 Adobe Acrobat Reader 时，你需要通过 Document Cloud、iCloud、Google\
  \ Drive 或 Dropbox 访问托管在网站上的 PDF 文件。\n\n如果你使用第三方 PDF 阅读器，可能会在应用中看到一个 Wi-Fi 图标，例如图\
  \ 11-3 中 GoodReader 所示图标。系统会提供两种通过 URL 访问电脑的方法。\n\n![A432409_1_En_11_Fig3_HTML.jpg](img/A432409_1_En_11_Fig3_HTML.jpg)\n\
  \n图 11-3. PDF 阅读器通常提供 Wi-Fi 传输选项，以便将 PDF 文件从电脑传输到 iOS 设备\n\n点击 Wi-Fi 图标，会打开一个帮助屏幕，其中提供了将\
  \ iOS 设备连接到电脑的方法信息。如图 11-4 所示，你可以在电脑的网页浏览器中输入一个 IP 地址，或者访问一个 Bonjour 地址。\n\n![A432409_1_En_11_Fig4_HTML.jpg](img/A432409_1_En_11_Fig4_HTML.jpg)\n\
  \n图 11-4. 帮助屏幕提供了如何将 iOS 设备与电脑连接的信息\n\n请注意，这两种方法都提示你需要输入一个地址，并在其后加上 `:8080`。这是所有允许使用地址传输文件的应用的通用做法。\n\
  \n如果我们使用网页浏览器，那么在电脑上打开浏览器并输入应用帮助屏幕中提供的 URL。如果使用 Bonjour 地址，则前往 Mac 桌面，然后进入访达界面，按下\
  \ ⌘+K 或选择“前往”➤“连接到服务器”。使用 Bonjour 地址时，你无需担心需要在其他应用（如网页浏览器）中操作。一旦在“连接到服务器”对话框中输入地址，就会打开一个窗口，显示\
  \ PDF 阅读器文件所在位置，如图 11-5 所示。\n\n![A432409_1_En_11_Fig5_HTML.jpg](img/A432409_1_En_11_Fig5_HTML.jpg)\n\
  \n图 11-5. 使用 Bonjour 地址连接后，会打开一个新窗口，显示用于建立连接的应用中的文件\n\n你还会发现该文件夹已挂载到你的硬盘上。因此，如果你有多个文件需要添加和/或编辑，这种方法可以让你更轻松地添加文件、更新文件和删除文件。\n\
  \n你看到的这个窗口就像任何其他文件夹一样。只需将文件拖放到已挂载的驱动器中，即可将它们添加到你的 iOS 设备。你也可以删除文件并重命名。你可以通过创建新文件夹并将文件嵌套在文件夹中来组织文件。请记住，在进行更改时，必须保持\
  \ Wi-Fi 传输屏幕（如图 11-5 所示）处于打开状态。\n\n## 11.4 使用 Dropbox\n\nDropbox 是一款云存储应用，可让你在所有设备上共享文件。你可以在每台设备（电脑、平板电脑和移动设备）上安装\
  \ Dropbox。在选择云存储程序时，你有很多选项可选，例如 Apple 的 iCloud、Microsoft 的 OneDrive、JustCloud、ZipCloud\
  \ 等等。在所有可用的云存储选项中，我认为 Dropbox 是最好的全能型服务，并且可以从 [`www.dropbox.com`](http://www.dropbox.com)\
  \ 免费下载。\n\n要在电脑与其他设备之间同步文件，你需要在电脑上下载并安装 Dropbox。你还需要在所有用于设备间传输文件的设备上安装 Dropbox。Dropbox\
  \ 适用于 iOS、Android、Mac OS X 和 Windows。\n\n### 11.4.1 使用 Dropbox 界面\n\n要安装 Dropbox，请登录\
  \ Dropbox 网站 ([`www.dropbox.com`](http://www.dropbox.com)) 并回答几个问题（名字、姓氏、电子邮件地址并提供密码）。同意\
  \ Dropbox 条款并点击“注册”按钮。接下来你看到的屏幕会提供账户类型选择。你可以选择 Basic（免费）账户、Pro 账户（每月 9.99 美元）或 Business\
  \ 套餐（允许五个或更多用户使用该账户，每位用户每月 15 美元）。对于免费账户，请确认已选中 Basic 项并点击“继续”。点击“继续”后，应用安装程序将自动下载到你的电脑。\n\
  \n一旦安装程序完成下载，双击安装程序并等待 Dropbox 完成安装。Dropbox 的操作方式与你电脑上的其他应用略有不同。你无需从“程序文件夹”（Windows）或“应用程序文件夹”（Macintosh）中启动它。相反，Dropbox\
  \ 会向你的桌面添加一个文件夹。该文件夹看起来就像你电脑上的任何其他文件夹一样。但是，当你将文件拖放到该文件夹中时，文件就会被添加到云端，任何已登录 Dropbox\
  \ 应用的移动设备都可以看到该文件。\n\n**提示：** 对于 Macintosh 用户，你可以将 Dropbox 文件夹添加到文件夹视图的收藏夹列表中。将文件夹拖到打开的文件夹左侧列表中。当\
  \ Dropbox 显示为收藏夹时，你可以将文件拖到此项目上，或者点击以打开 Dropbox 文件夹，如图 11-6 所示。\n\n![A432409_1_En_11_Fig6_HTML.jpg](img/A432409_1_En_11_Fig6_HTML.jpg)\n\
  \n图 11-6. Dropbox 作为 Macintosh 上的收藏夹\n\n为了从本地电脑上传文件，你需要登录你的 Dropbox 账户。当你通过网页浏览器登录时，屏幕中央会显示存储在\
  \ Dropbox 云存储中的文件，如图 11-7 所示。左侧是多个项目的链接，包括：\n\n\n\n*   `Recents`：最近文件列表。\n*   `Files`：点击“文件”，屏幕刷新并显示名称列下的文件。\n\
  *   `Team`：与他人协作。\n*   `Paper`：与团队成员实时编辑。\n*   `Photos`：点击此链接，即可打开一个幻灯片，展示您上传到 Dropbox\
  \ 账户的照片。\n*   `Sharing`：点击“共享”时，屏幕会发生变化，您会找到一个用于共享文件的按钮。您的账户可以有多个共享文件夹。点击该按钮，将弹出“共享文件夹”对话框。您可以选择共享新文件夹或向已有共享文件夹添加更多人员。做出选择后，点击“共享文件夹”对话框中的“下一步”按钮。随后您将进入一个屏幕，在该屏幕中您可以复制一个\
  \ URL 并通过电子邮件客户端发送，或者您可以选择让 Dropbox 发送一封电子邮件。电子邮件的收件人可以访问您添加到共享文件夹中的文件；即使没有 Dropbox\
  \ 账户的用户也能访问这些文件。\n*   您还可以右键单击计算机上 Dropbox 文件夹中出现的文件，然后选择“共享 Dropbox 链接”。选择此菜单命令后，链接将被复制到剪贴板。您可以打开电子邮件客户端并将链接粘贴到新邮件中。同样，收件人无需\
  \ Dropbox 账户即可访问文件。\n*   `Links`：这与共享类似。当您共享链接时，链接的收件人可以点击查看内容并选择下载链接的文件。在您的台式电脑上，右键单击桌面\
  \ Dropbox 文件夹中的文件，然后选择“共享 Dropbox 链接”。链接 URL 会被复制到剪贴板，您可以将其粘贴到电子邮件中。在网站上，将鼠标光标悬停在文件名上，然后点击出现的“共享”按钮。会弹出一个窗口。输入收件人的电子邮件地址并点击“发送”。您已链接的所有文件都会显示在“链接”列中。\n\
  *   `Events`：点击“事件”，您会看到您在 Dropbox 账户中所做所有更改的时间线，例如共享文件、上传文件、链接到您账户的其他电脑和设备列表等。\n\
  *   `File Requests`：点击“文件请求”，您可以发送请求，让用户向您发送文件。您可以为消息添加标题，并指定一个文件夹让其他用户在其中发送文件。点击“下一步”按钮，会显示一个\
  \ URL 链接。您可以复制该链接并粘贴到新电子邮件中，或提供您请求其发送文件的用户的电子邮件地址，Dropbox 会代您发送邮件。\n*   `Work Features`：管理员服务和文件恢复。\n\
  \n![A432409_1_En_11_Fig7_HTML.jpg](img/A432409_1_En_11_Fig7_HTML.jpg)\n\n**图 11-7.**\
  \ Dropbox 的登录界面\n\n当您安装 Dropbox 时，您会在 Dropbox 网站上获得一个账户页面，并在本地硬盘上获得一个本地文件夹。您可以将文件和文件夹添加到您的本地文件夹中，文件会自动上传到\
  \ Dropbox。您可以在所有安装了 Dropbox 应用的其他移动设备上看到所有文件，但这些列表只是原始文件的别名（链接）。这在平板电脑和智能手机上尤其有用，因为您不会为可能用不到的文件占用大量磁盘空间。点击一个链接，文件就会下载到该设备。\n\
  \n> **注意**\n> \n> 请记住，在台式电脑和笔记本电脑上，Dropbox 文件夹中的任何文件实际上都会下载到每台电脑上。这与平板电脑和智能手机上的行为不同，在平板电脑和智能手机上，文件会列出但不会下载，直到您手动指示应用进行下载。\n\
  \n### 11.4.2 在设备上加载文件\n\n要学习本节内容，您需要下载 Dropbox 并将其安装到您的计算机上。登录[`www.dropbox.com`](http://www.dropbox.com)，按照步骤提供您的姓名（名和姓）、电子邮件地址和密码。勾选同意条款和条件的复选框，然后点击“下一步”。选择免费的基本账户，然后点击“继续”。应用程序安装程序将开始下载。双击安装程序以将应用程序添加到您的计算机。\n\
  \n在设备（平板电脑或智能手机）上，登录设备的应用商店。对于 iOS 设备，点击“App Store”图标登录苹果的 App Store。搜索“Dropbox”并安装应用程序。在\
  \ Android 设备上，点击“Play Store”图标并搜索“Dropbox”。当 Dropbox 页面打开时，点击“安装”。\n\n将一些文件从您的计算机复制到\
  \ Dropbox 文件夹。（安装 Dropbox 时，系统会向您的计算机添加一个文件夹。）打开该文件夹并将一些文件拖入该文件夹。使用此方法实际上是将文件从您的计算机移动到您的\
  \ Dropbox 文件夹。您也可以在 Windows 上右键单击一个文件，然后选择“移动到 Dropbox”。\n\n如果您想将文件的副本添加到 Dropbox\
  \ 文件夹，请在 Mac 上按住 Option 键并将文件拖到文件夹中。在 Windows 上，右键单击一个文件，然后选择“发送到” ➤ “Dropbox”。在\
  \ Mac 和 Windows 上，您也可以复制文件并将其粘贴到 Dropbox 文件夹中。\n\n在您的其中一台设备上启动 Dropbox。您添加到计算机上\
  \ Dropbox 中的文件会列在您设备上的 Dropbox 中。您可以将多种不同类型的文件复制到 Dropbox，例如 Microsoft Office 文件、纯文本文件、照片、PDF、EPUB\
  \ 等。当您点击其中一个文件时，您将在 Dropbox 中看到文档的预览。该文件尚未下载到您的设备。Dropbox 仅打开文档的预览，以便您可以轻松浏览各种文件并找到您要使用的文件。\n\
  \n由于我们主要关注 EPUB 和 PDF，让我们看看如何将文件从 Dropbox 获取到设备阅读器中。\n\n\n\n### 向设备添加 EPUB 文件\n\n\
  在安卓设备上，当你在 Dropbox 中点击一个 EPUB 文件时，会弹出一个屏幕，显示可用于查看文档的应用。文件扩展名应为 `.epub`。要在某个应用中查看\
  \ EPUB，请点击 Dropbox 窗口中的文件名。点击**始终**可永久使用某个特定阅读器打开 EPUB，或点击**仅一次**仅在该阅读器中查看该 EPUB\
  \ 一次（参见图 11-8）。当你再次点击一个 EPUB 文件时，需要再次选择**始终**或**仅一次**。\n\n![A432409_1_En_11_Fig8_HTML.jpg](img/A432409_1_En_11_Fig8_HTML.jpg)\n\
  \n**图 11-8.** 点击你想用来打开已下载文件的阅读器\n\n> **注意**\n> 你在设备上看到的列表仅显示存储在云端 Dropbox 文件夹中的内容。这些文件存储在云端（Dropbox\
  \ 服务器上）。只有当你将文件添加到某个查看应用或点击文件将其添加到设备时，Dropbox 中的文件才会下载到你的设备。这能让你的设备免受大量文件存储的困扰，这些文件你可能并不想放在设备上。\n\
  \n在 Macintosh 电脑上，我也使用 Dropbox 而非 iTunes 来添加文件。如果你使用 12 版本之前的 iTunes 添加图书，iTunes\
  \ 需要同步你的资料库。你资料库中的所有书籍都会重新同步。如果你有很多书，同步资料库会花费一些时间。如果你需要多次查看更新，你就会浪费大量时间等待 iTunes\
  \ 完成资料库同步任务。\n\n在 iOS 设备上使用 Dropbox，你可以在 iBooks 或设备上安装的其他任何 EPUB 阅读器中打开 EPUB 文件。在\
  \ iOS 设备上点击 Dropbox 中的文件名，该文件就会下载到设备上。你首先看到的屏幕可能有预览，也可能没有。如果你看到如图 11-9 所示的无预览屏幕，不必惊慌；文件仍然在那里。\n\
  \n![A432409_1_En_11_Fig9_HTML.jpg](img/A432409_1_En_11_Fig9_HTML.jpg)\n\n**图 11-9.**\
  \ 点击 Dropbox 应用中的文件名，文件会在 Dropbox 中打开\n\n点击右上角的分享图标，Dropbox 会打开一个类似图 11-10 所示的屏幕。你可以分享文件，也可以在某个应用中打开文件。点击**打开方式**按钮，选择用于查看文件的应用。\n\
  \n![A432409_1_En_11_Fig10_HTML.jpg](img/A432409_1_En_11_Fig10_HTML.jpg)\n\n**图 11-10.**\
  \ 点击 Dropbox 应用中的文件名，文件会在 Dropbox 中打开\n\n点击**打开方式**后，屏幕会发生变化，显示设备上所有可以查看 EPUB 的应用。如果你想在\
  \ iBooks 中查看文件，请点击**在 iBooks 中打开**，如图 11-11 所示，或者选择其他应用来预览文档。使用这种方法向 iOS 设备添加 EPUB\
  \ 比使用 iTunes 快得多。\n\n![A432409_1_En_11_Fig11_HTML.jpg](img/A432409_1_En_11_Fig11_HTML.jpg)\n\
  \n**图 11-11.** 点击你想用来查看 EPUB 的应用\n\n有关在设备上查看 EPUB 文档的更多信息，请参阅第 13 章。\n\n### 向设备添加\
  \ PDF 文件\n\n你可以使用 Dropbox 在移动设备上打开 PDF 文件。在 Dropbox 应用中找到该文件，然后点击向下的箭头打开一个菜单，如图\
  \ 11-12 所示。菜单中有多个选项。你需要的是**打开方式**。点击**打开方式**，屏幕会发生变化，显示设备上安装的所有 PDF 阅读器。\n\n![A432409_1_En_11_Fig12_HTML.jpg](img/A432409_1_En_11_Fig12_HTML.jpg)\n\
  \n**图 11-12.** 点击右上角的图标打开菜单\n\n许多电子书阅读器都支持查看 PDF 文件，如图 11-13 所示。不过，你的最佳选择是在 Adobe\
  \ Acrobat Reader 中查看 PDF，或者使用第三方阅读器，例如 GoodReader。点击你想使用的阅读器，文件就会在目标阅读器中打开。\n\n\
  ![A432409_1_En_11_Fig13_HTML.jpg](img/A432409_1_En_11_Fig13_HTML.jpg)\n\n**图 11-13.**\
  \ 点击你想使用的 PDF 阅读器，文件会在此阅读器中打开\n\n如果你想在 iPhone 或 iPad 上的 iBooks 中打开 PDF，请按照相同步骤在\
  \ Dropbox 中打开 PDF 文件，选择**打开方式**，然后选择 iBooks。文件会在 iBooks 中打开，并添加到你的 iBooks 书架上。\n\
  \n## 总结\n\n本章简要讨论了如何将文件从电脑传输到各种设备。我们探讨了通过 USB 设备和 Apple iTunes 复制文件，以及将文件复制到 PDF\
  \ 阅读器和电子书阅读器的方法。\n\n要复制文件，你首先需要在硬盘上有一个要复制的文件。在下一章中，我们将开始探索如何将内容从 Adobe InDesign\
  \ 导出为各种格式。我们介绍的第一种格式是导出为可重排 EPUB。\n\n"
- "# 创建可重排 EPUB\n\nEPUB 分为两种类型：可重排版式和固定版式。可重排 EPUB 通常用于长文档，例如小说和篇幅较长的阅读材料。固定版式 EPUB\
  \ 则是看起来类似于 PDF 文件的文档。其文字和对象的版式与组织在很大程度上模仿了版式设计。\n\n在交互性方面，可重排 EPUB 比固定版式 EPUB 受限得多。你不能在可重排\
  \ EPUB 中使用按钮来改变事件，也不能直接查看动画。这些类型的交互性仅在固定版式 EPUB 中可用。\n\n然而，可重排 EPUB 并不完全局限于静态内容。你可以导入音频和视频文件，并且可以创建在可重排\
  \ EPUB 中正常运行的超链接。你还可以通过一些变通方法添加一些动画，尽管这有点笨拙。\n\n本章全部内容都是关于创建可重排 EPUB。它展示了创建符合常见\
  \ EPUB 标准的 EPUB 所需了解的许多最佳实践和注意事项。在第 13 章中，我们将探讨如何创建固定版式 EPUB。\n\n## 理解可重排 EPUB\n\
  \nEPUB 几乎完全在平板电脑和智能手机等设备上查看。尽管如此，你也可以在台式电脑上查看可重排 EPUB。要查看 EPUB，你需要在你的设备上安装一个能够打开\
  \ EPUB 文件的应用（例如 `story.epub`，其中文件扩展名是公认的 EPUB 格式），这种应用通常被称为电子书阅读器。你可以获取适用于 iOS、Android\
  \ 和 Linux 操作系统以及台式电脑的多种不同电子书阅读器。\n\n大多数电子书阅读器都内置了调整字体大小和更改字体的工具。当字体大小放大或缩小时，可重排\
  \ EPUB 会重新排列内容，使其适应设备上显示的页面大小——因此得名“可重排”。\n\n所有电子书阅读器都会寻找扩展名为 `.epub` 的文件。当文件扩展名为\
  \ `.epub` 时，它就可以在电子书阅读器中打开——前提是内容是按 EPUB 文件格式创建的。`.epub` 文件本身不过是一个包含 XHTML 文件的压缩\
  \ `.zip` 存档。本质上，EPUB 就像网站一样，你可以通过滑动设备上的手势在网页之间导航。\n\n了解什么是 EPUB 有助于你理解文本格式化的某些方面。你需要遵循\
  \ HTML 使用的标准，并使用标签、`div`、CSS 以及相关的 HTML 编码。幸运的是，InDesign 负责处理 HTML 和 CSS 的编写，并且几乎总能生成一个有效的\
  \ EPUB，可以在几乎任何带有任意电子书阅读器的设备上查看。\n\n\n\n## 12.2 为可重排 EPUB 设置格式\n\n由于 EPUB 是 HTML\
  \ 文件的集合，在导出为 EPUB 格式时，你需要考虑一些设计因素。若内容的格式和结构组织不当，可能会导致一些奇怪且意想不到的后果。在 InDesign 中预览的布局，在电子阅读器中可能会大相径庭。请看图\
  \ 12-1。这是 Adobe InDesign 预览模式下的一个布局。\n\n![A432409_1_En_12_Fig1_HTML.jpg](img/A432409_1_En_12_Fig1_HTML.jpg)\n\
  \n**图 12-1.** Adobe InDesign 预览模式中的布局\n\n当你导出此文件并在桌面电脑的电子阅读器中查看时，可能会看到类似图 12-2 的样子。在页面顶部，你会看到照片图像，后面跟着包含颜色的框。由于章节编号和标题的文本颜色设置为纸张色，文本不显示，且并未被设置在框内。\n\
  \n![A432409_1_En_12_Fig2_HTML.jpg](img/A432409_1_En_12_Fig2_HTML.jpg)\n\n**图 12-2.**\
  \ 与图 12-1 相同的 InDesign 布局在电子阅读器中的显示效果\n\n正如我在前几章中提到的，在创建可重排 EPUB 时，你需要对所有内容使用样式。你还需要调整阅读顺序，以便图形和文本按照你期望的顺序出现。简而言之，在导出为\
  \ EPUB 格式之前，你需要在 InDesign 中控制相当多的格式设置。\n\n### 12.2.1 为可重排 EPUB 设置文本格式\n\n在 InDesign\
  \ 中，你可以轻松地移动文本框、添加回车键来增加段落间距、添加首字下沉、为文本框添加分栏和边距、添加行缩进以及为图形添加文本绕排。你无需创建样式（尽管应该创建）即可使布局达到你想要的效果。\n\
  \n然而，对于 EPUB，在设置文本格式时你需要关注每一个细节，并且你在 InDesign 中执行的某些格式设置任务无法转换到 EPUB 格式。例如，设置多栏页面无法转换到\
  \ EPUB 格式。将文本框彼此分开以创建空白区域的做法在 EPUB 中不会被保留，添加多个制表符和回车键同样无效。\n\n#### 理解文本格式设置指南\n\n\
  以下是准备导出为 EPUB 的文档时需要遵循的一些指南：\n\n- **为段落和文本添加样式**：我已经说过很多次，每个段落以及任何格式覆盖都需要转换为样式。如果你添加了粗体、斜体或彩色文本，则需要创建字符样式。\n\
  - **为首字下沉添加样式**：创建首字下沉时，你需要添加一个字符样式，用于定义首字下沉字符的格式。\n- **添加空白区域**：在 HTML 中，你需要使用\
  \ `<break>` 标签来强制在段落间换行或硬中断。创建 EPUB 时，你需要使用样式，并通过添加上/下间距来增加段落间的空间。\n- **对齐文本**：在段落样式中包含文本对齐方式。不要在没有定义样式的情况下在控制面板中对齐文本。\n\
  - **锚定对象和图像**：如果你希望对象在你的布局中出现在同一页面的相同位置，则不能使用浮动对象。如果你希望对象紧邻文本包含在内，则需要将对象锚定到文本。如果不锚定对象，所有对象都会显示在文本的末尾。例如，如果你有一本书，一个故事跨越了多页，那么图像和对象会出现在故事的结尾。作为实践，使用自定义设置或基线对齐来锚定对象。不要使用行内锚定。关于如何在文本中锚定对象的更多信息，请参阅本章后面的“格式化图形”部分。\n\
  - **修正所有格式覆盖**：使用样式面板中的“重新定义样式”设置来重新定义样式，并在段落样式中格式化字符时使用字符样式。\n- **字体**：嵌入字体时尽量使用\
  \ Typekit 字体。这些字体无需任何许可即可嵌入。对于所有其他字体，请始终检查嵌入字体的权限。不支持 OpenType 分数。\n- **列表**：在 HTML\
  \ 中，有由标签定义的有序列表和无序列表。在 InDesign 中，你需要为创建的每个列表设置样式。\n- **分页符**：如果你希望章节页或某个部分从页面顶部开始，则需要调整段落样式选项对话框中的保留选项。在“段落样式选项”对话框的“保留选项”选项卡中，从“起始段落”下拉菜单中选择一个选项。\n\
  - **规则线**：你可以在文本上方和下方添加规则线。如果使用规则线，则需要使用段落样式，并在“段落样式选项”对话框中添加规则线。不要在页面上段落之间绘制规则线。\n\
  - **文本绕排**：你可以创建文本绕排并导出到 EPUB，但需要遵循与使用对象和图像时相同的规则。设置文本绕排选项后，需要将对象锚定到你希望其定位的文本位置。\n\
  \n#### 清理布局\n\n你可以使用“查找/更改”对话框搜索格式化的文本覆盖，并将其更改为字符样式。\n\n以下是如何搜索字体样式并将格式更改为字符样式的步骤：\n\
  \n1.  选择“编辑”➤“查找/更改”以打开“查找/更改”对话框。\n2.  单击“文本”以打开“文本”选项卡，并单击“查找格式”框。此时会打开“查找格式设置”对话框。\n\
  3.  单击“基本字符选项”，然后从“字体样式”下拉菜单中选择“粗体”。单击“确定”返回“查找/更改”对话框。你可以在对话框中选择任何格式。例如，假设你想搜索“粗体”字体。\n\
  4.  选择一个字符样式。单击“更改格式”框，打开“更改格式设置”对话框。从“字符样式”下拉菜单中选择一个样式。如果你没有样式，请从菜单中选择“新建字符样式”并创建一个新的字符样式。单击“确定”返回“查找/更改”对话框。\n\
  5.  单击“查找”，然后单击“更改”。测试“查找/更改”条件，并先单击一次“查找”按钮，如图 12-3 所示。文本中第一次出现粗体字的地方应被高亮显示。单击“更改”并观察结果。粗体字体应被更改为新格式（纯文本、彩色文本、斜体等——取决于你在字符样式中定义的设置）。\n\
  \n    ![A432409_1_En_12_Fig3_HTML.jpg](img/A432409_1_En_12_Fig3_HTML.jpg)\n\n  \
  \  **图 12-3.** 使用“查找/更改”来搜索并更改格式\n\n6.  全部更改。当一切看起来工作正常时，单击“全部更改”以全局更改文档中的文本。\n\n\
  > **注意**：你可以在“搜索”下拉菜单中对“所有文档”、“当前打开的文档”、“一篇故事”和“到故事末尾”进行更改。\n\n\n\n#### 查找覆盖项\n\n\
  你可以从互联网下载一个由 Mark Autret 编写的出色 InDesign 脚本，名为 `FindChangeLocalFormatting`。请登录 [`http://www.indiscripts.com/post/2010/05/show-local-formatting-in-indesign-cs4`](http://www.indiscripts.com/post/2010/05/show-local-formatting-in-indesign-cs4)\
  \ 或在 Google 中搜索“Find Change Local Formatting”。下载该脚本并安装在 Scripts 文件夹中。有关安装脚本的更多信息，请参见第\
  \ 6 章。\n\n运行此脚本时，文档中的所有覆盖项都会以不可打印的删除线标记出来，如图 12-4 所示。当你消除覆盖项时，删除线标记也会随之消失。如果你从客户那里获取文本并需要进行大量清理工作，这个脚本可以为你节省大量时间。\n\
  \n![A432409_1_En_12_Fig4_HTML.jpg](img/A432409_1_En_12_Fig4_HTML.jpg)\n\n图 12-4.\n\
  \n打开脚本面板，双击 `FindChangeLocalFormatting` 脚本，即可在带有覆盖项的文本上看到删除线。注意\n\n此脚本适用于所有 InDesign\
  \ CC 2015.2 及更早版本的用户。如果你使用的是 InDesign CC 2015.3 及以上版本，则可以使用段落样式面板菜单中的“切换样式覆盖项高亮显示”功能。\n\
  \n#### 自动化覆盖项修正\n\n计算机本应让生活更轻松，并神奇地为我们执行任务，而无需我们手动进行更改，对吗？如果我们只需点击一个按钮，所有文本覆盖项就能转换为不同的字符样式，那该多好啊？好吧，在\
  \ InDesign 中，确实可以实现一些神奇的事情。\n\n同样，这种魔法以脚本的形式出现。这个脚本是由 Theunis DeJong（又名 jongware）编写的\
  \ `PerfectPrepText`，你可以在我最喜欢的 InDesign 资源网站 InDesignSecrets.com 上找到它（[`www.indesignsecrets.com/downloads/PerfectPrepText.zip`](http://www.indesignsecrets.com/downloads/PerfectPrepText.zip)）。下载并安装该脚本。这是\
  \ David Blatner 和 Anne-Marie Concepcion 在其 [`www.indesignsecrets.com`](http://www.indesignsecrets.com)\
  \ 网站上为 InDesign 社区提供的众多有用工具之一。\n\n安装脚本后，双击 `preptext`，所有局部覆盖项都会转换为字符格式。在图 12-5 中，你会看到字符样式面板中有两个字符样式。我并未创建这些字符样式。`preptext.jsx`\
  \ 找到了局部覆盖项，创建了新的字符样式，并将这些样式应用到了覆盖项上。\n\n![A432409_1_En_12_Fig5_HTML.jpg](img/A432409_1_En_12_Fig5_HTML.jpg)\n\
  \n图 12-5.\n\n使用 `preptext.jsx` 脚本向字符样式面板添加了新的字符样式\n\n开发者们不断创作新的脚本，其中许多人不收取任何费用或只要求少量捐赠。要发现\
  \ InDesign 工具的最新最棒功能，请定期登录 InDesignSecrets（[`www.indesignsecrets.com`](http://www.indesignsecrets.com)）。如果你找到了一个对你有帮助的脚本，而开发者要求小额捐赠，请务必捐赠几美元。能够让开发者因他们的辛勤工作获得一些报酬意义重大，这会激励他们继续为整个\
  \ InDesign 用户社区创作更多有用的脚本。\n\n### 12.2.2 格式化图形\n\n在第 6 章中，我讨论了如何使用对象样式面板。当你为对象添加某些效果时，需要创建一个对象样式。像投影或斜面和浮雕这样的效果，除非你定义并将其样式应用于对象，否则在某些\
  \ EPUB 中不会显示。\n\n你还需要将对象锚定在文本中，这样对象就不会出现在 EPUB 的最后一页。\n\n以下是在 EPUB 中使用图形时需要考虑的一些事项。\n\
  \n#### 准备图像\n\n可重排 EPUB 旨在供阅读。人们使用各种显示 EPUB 的应用程序在设备上阅读小说、书籍、报告等。在创建 EPUB 时，你希望抓住最大的可用市场，让你的文档能被尽可能多的人访问。一个重要的、热衷于阅读的少数群体是有视觉障碍的人。无法在电脑或设备上看到文本的人，通常使用屏幕阅读器或文本转语音软件来为他们朗读文本文件。\n\
  \n屏幕阅读器在处理计算机文件时表现出色，但它们需要你的一点帮助才能使文档完全可访问。对于图像，你需要为图像文件添加一个标签。这些标签是 `Alt`（替代）标签，你可以在其中提供图像的文本描述。你可能有像\
  \ `img_001.jpg`、`DCIM677.tiff`、`photo1.psd` 或其他文件名这样的图像。当屏幕阅读器遇到没有 `Alt` 标签的图像时，它会直接读出文件名。这对使用屏幕阅读器的人来说显然会造成混淆。\n\
  \n你可以在照片编辑应用程序、Adobe Bridge 或直接在 InDesign 中为图像添加 `Alt` 标签。基本上，前两个是最佳选择。这完全取决于你。你可以在\
  \ Adobe Bridge 中查看 InDesign 资源的“链接”文件夹，并在 IPTC 核心描述中添加描述字段，如图 12-6 所示。添加图像的简短描述。例如，公司红绿配色的徽标图像。\n\
  \n![A432409_1_En_12_Fig6_HTML.jpg](img/A432409_1_En_12_Fig6_HTML.jpg)\n\n图 12-6.\n\
  \n在 Adobe Bridge 中添加 `Alt` 标签\n\n在将图像置入 InDesign 之前，使用 Adobe Bridge 添加所有 `Alt` 标签。请确保使用\
  \ IPTC 核心数据区域中的同一个字段。数据会从 Adobe Bridge 自动保存为 XMP 数据。\n\n另一种向图像添加 `Alt` 标签的方法是在 InDesign\
  \ 中。选择一个图像，然后选择“对象”➤“对象导出选项”。当“对象导出选项”对话框打开时，“替代文本”选项卡默认处于显示状态。你可以选择添加自定义文本，或通过从“替代文本来源”菜单中选择一个菜单项来导入带有描述的\
  \ XMP 数据。如果选择“自定义”，你可以键入你想要的 `Alt` 标签文本，如图 12-7 所示。\n\n![A432409_1_En_12_Fig7_HTML.jpg](img/A432409_1_En_12_Fig7_HTML.jpg)\n\
  \n图 12-7.\n\n从“替代文本来源”中选择“自定义”，然后键入描述\n\n你使用的具体方法各有利弊。如果在 Bridge 中添加描述，你可以快速添加上\
  \ `Alt` 标签的数据。如果你在 InDesign 中添加 `Alt` 标签，则每置入一个图像，都需要打开“对象导出选项”对话框。在 InDesign 中添加\
  \ `Alt` 标签的优势在于，你可以使用与页面布局上下文相关的描述。在 Bridge 中，图像本身是相同的；但在某些情况下，图像的使用背景可能会影响你的描述。\n\
  \n这是一个个人选择。我更喜欢在 Adobe Bridge 中添加描述。这种方法似乎快得多。如果你确实在 Bridge 中添加了描述，那么就不要使用“对象导出选项”对话框来导入\
  \ XMP 数据。有一种更好的方法可以使用对象样式从 Bridge 导入数据。\n\n\n\n#### 使用对象样式\n\n如果你只有少量图片（六张或更少），不使用对象样式也能应付。但如果你在\
  \ EPUB 中使用了十几张甚至更多图片，最好为它们创建对象样式。在某些情况下，这必不可少，而在其他情况下，它也能帮你加快工作流程。\n\n你希望在对象样式中设置的几个内容包括\
  \ `Alt` 标签（如果你使用 Adobe Bridge 添加 `Alt` 标签）和定位对象位置。新建一个对象样式，然后在左侧窗格中点击 `Alt 文本`。从\
  \ `Alt 文本来源` 下拉菜单中选择 `来自 XMP 描述`，如图 12-8 所示。如果你在 Bridge 的 IPTC 核心数据中的 `描述` 字段里添加了\
  \ `Alt` 标签，那么所有图片的描述都将通过该对象样式处理。要验证描述是否已成功导入，请打开 `对象导出选项` 对话框并检查 `Alt 文本` 选项卡。你应该能看到从\
  \ XMP 数据中导入的描述。\n\n![A432409_1_En_12_Fig8_HTML.jpg](img/A432409_1_En_12_Fig8_HTML.jpg)\n\
  \n图 12-8. 选择“来自 XMP 描述”以导入 XMP 数据\n\n对象样式的另一个重要设置是定位对象的位置。如果你有一些对象位置使用了 `行上方`，而另一些使用了与书脊对齐，那么你可以基于为\
  \ `Alt` 标签所使用的样式创建两个样式。取消选中所有选项，只为你的图片选择所需的 `定位对象选项` 来设置特定位置，但在 `常规面板` 中，将此样式基于你为\
  \ `Alt` 文本所使用的样式名称。\n\n要为定位对象创建样式，请按 `Alt`/⌥+点击 `对象样式面板` 中的 `创建新样式` 图标。将此样式基于 `Alt\
  \ 文本` 样式，并取消选中面板中所有其他选项。然后在左侧窗格中点击 `定位对象选项`。\n\n在为 EPUB 定位对象时，实践中不要使用 `嵌入`。你应该选择\
  \ `行上方`，如图 12-9 所示。在此处，你可以设置段前/段后间距并选择对齐方式。如果你从 `位置` 下拉菜单中选择 `自定义`，则可以选择相对于书脊的对齐方式并调整偏移量。当启用\
  \ `预览` 复选框时，你可以看到在 `定位对象选项` 中所做的选择在布局中对象的位置。\n\n![A432409_1_En_12_Fig9_HTML.jpg](img/A432409_1_En_12_Fig9_HTML.jpg)\n\
  \n图 12-9. 选择“行上方”并调整“段前间距”和“段后间距”设置\n\n#### 定位对象\n\n如果你有一段文本，并希望某个对象出现在文本中的某个位置，则需要定位该对象。如果浮动对象未定位到文本，它们总是会出现在你的\
  \ EPUB 末尾。\n\n有些人尝试添加换行符和回车符，以便在文本框中为嵌入对象留出合适的空间。你可以剪切一个对象，在文本框中点击光标，然后粘贴来创建一个嵌入对象。你也可以按住\
  \ `Shift` 键并拖动定位控件（选中对象顶部的蓝色方框）到你想要定位对象的文本行。使用嵌入对象在页面上定位可能很麻烦，有时还会在某些电子阅读器中产生意外结果。你的解决方案和最佳实践是在\
  \ `定位对象选项` 对话框中使用 `行上方` 选项。\n\n要定位一个对象，请点击并拖动定位控件（选中对象框上的蓝色方框）到你希望对象在文本中出现的位置。你马上会注意到对象并没有移动，也看不到对象放置位置的预览。别担心，我们可以解决这个问题。\n\
  \n定位对象后，你可以通过以下两种方式之一修改其位置：选择定位对象，然后选择 `对象` ➤ `定位对象` ➤ `选项` 以打开 `定位对象选项` 对话框；或者使用我之前在“使用对象样式”一节中讨论的对象样式。如果你有多个对象，那么创建对象样式是最佳选择。\n\
  \n之前在图 12-9 中，你已经看到了 `对象样式选项` 对话框中定位对象位置的选项。请务必启用 `预览` 复选框，以便在 `对象样式选项` 对话框中进行调整时，能在文档中实时查看效果。\n\
  \n#### 编组对象\n\n如果你向一个框架添加文本，文本和框架颜色在 EPUB 中显示正常。你可能会在不同电子阅读器之间看到一些细微差异，但大多数情况下，你为框架分配的属性（例如内边距）在\
  \ EPUB 中都会被保留。\n\n如果出于某种原因，你有一个文本框位于几何图形之上，你需要将这些对象编组（`对象` ➤ `编组` 或 `Ctrl`/⌘+`G`），然后定位它们。\n\
  \n\n\n#### 文本换行\n\n在 EPUB 中可以给对象设置文本换行，但只能应用于矩形对象。你不能使用`Text Wrap Panel`或`Float\
  \ Left`、`Float Right`来使用圆形或椭圆形。\n\n#### 为对象设置文本换行\n\n以下描述了如何在 InDesign 中为对象设置文本换行，以便导出到可重排的\
  \ EPUB：\n\n1.  在要锚定对象的段落之前添加一个回车符。如果将对象锚定在段落开头，第一行文本可能无法正确换行，并且对象会遮挡第一行部分文本。\n2.\
  \  锚定对象。将所选对象顶部的蓝色方块拖到您希望对象出现的文本框架位置。当对象被锚定后，您会看到一个锚点图标，如图 12-10 所示。  \n    ![A432409_1_En_12_Fig10_HTML.jpg](img/A432409_1_En_12_Fig10_HTML.jpg)\
  \  \n    **图 12-10.** 在对象旁边查看`Text Wrap Panel`以查看位置和文本换行偏移量。\n3.  打开`Text Wrap Panel`。打开`Text\
  \ Wrap Panel`（`Window` ➤ `Text Wrap` 或按 `Ctrl/⌘+Alt/⌥+W`）。\n4.  为对象应用文本换行。选择对象并将其移动到合适位置。在`Text\
  \ Wrap Panel`中单击`Wrap Around bounding box`图标（左起第二个）。通过在`Offset`文本框中输入值来调整偏移量。进行调整时，您会在文档页面上看到结果，如图\
  \ 12-10 所示。\n5.  创建对象样式。选择对象，按`Alt/⌥`，然后在`Object Style Panel`中单击`Create New Style`。\n\
  6.  设置锚定对象的属性。在`Object Style Options`对话框中，单击左侧窗格中的`Anchored Objects`。从`Position`下拉菜单中，确保选择了`Custom`，如图\
  \ 12-11 所示。（不要将`Inline`作为`Position`的选择。）由于在创建样式之前应用了文本换行，新的对象样式捕获了文本换行设置。单击`OK`关闭`Object\
  \ Style Options`对话框。  \n    ![A432409_1_En_12_Fig11_HTML.jpg](img/A432409_1_En_12_Fig11_HTML.jpg)\
  \  \n    **图 12-11.** 将单独的对象分组，并将单个对象锚定到文本框架。\n7.  打开`Object Export Options`对话框。选择对象，然后选择`Object`\
  \ ➤ `Object Export Options`。单击对话框中的`EPUB and HTML`选项卡。\n8.  调整`Object Export Options`。启用`Custom\
  \ Layout`并选择`Float Left`（如果对象位于文本框架右侧，则选择`Float Right`），如图 12-12 所示。  \n    ![A432409_1_En_12_Fig12_HTML.jpg](img/A432409_1_En_12_Fig12_HTML.jpg)\
  \  \n    **图 12-12.** 从`Custom Layout`下拉菜单中选择`Float Left`或`Float Right`。\n9.  导出为\
  \ EPUB。选择`File` ➤ `Export`或按`Ctrl/⌘+E`。选择`EPUB (Reflowable)`作为文件格式并单击`Save`。将打开`EPUB\
  \ – Reflowable Layout Export Options`对话框，如图 12-13 所示。  \n    ![A432409_1_En_12_Fig13_HTML.jpg](img/A432409_1_En_12_Fig13_HTML.jpg)\
  \  \n    **图 12-13.** 从`CSS Size`菜单中选择`Relative to Text Flow`。\n10. 调整对象设置。在`EPUB\
  \ – Reflowable Layout Export Options`对话框的左侧窗格中单击`Object`。确保第一个复选框已启用，如图 12-13 所示，并且`CSS\
  \ Size`选项设置为`Relative to Text Flow`。\n11. 单击`OK`并导出文件。\n12. 在桌面计算机上预览文档。在此示例中，使用`Adobe\
  \ Digital Editions (ADE)`进行预览。将文件添加到`ADE`库后，双击该文件将其打开。如图 12-14 所示，文本换行在 EPUB 预览中得到了保留。\
  \  \n    ![A432409_1_En_12_Fig14_HTML.jpg](img/A432409_1_En_12_Fig14_HTML.jpg) \
  \ \n    **图 12-14.** 在 Adobe Digital Editions 中查看 EPUB。\n\n如果您希望在段落中间围绕对象设置文本换行，步骤与在段落开头围绕对象设置类似，但有一些例外。首先，不要在段落内使用回车符。将对象锚定在段落内部并将其移动到合适位置。InDesign\
  \ 中的页面视图应接近您希望在 EPUB 中看到的视图。\n\n此外，不要使用`Object Export Options`中的`Float Left`或`Float\
  \ Right`。从`Custom Layout`下拉菜单中选择`Alignment and Spacing`。导出为`EPUB (Reflowable)`。\n\
  \n> **注意**  \n> 本书涵盖在 Adobe InDesign CC 2015 中创建内容。如果您使用的是较早版本的 InDesign，设置文本换行的过程会非常不同。\n\
  \n#### 栅格化对象\n\nEPUB 中的页面几何形状非常特定且有些苛刻。如果您想围绕圆形对象设置文本换行或绘制对角线和不规则形状，这些对象在 EPUB 中会显示为矩形形状，或者通常导致外观与您在\
  \ InDesign 中看到的视图不同。\n\n为了优化不规则形状的外观，您可以栅格化该形状，然后应用文本换行，或者让这些形状像在布局中一样显示。在图 12-15\
  \ 中，您会看到围绕椭圆形状的文本换行。要产生这种效果，您需要栅格化该框架。  \n![A432409_1_En_12_Fig15_HTML.jpg](img/A432409_1_En_12_Fig15_HTML.jpg)\
  \  \n**图 12-15.** 围绕椭圆框架的文本换行。\n\n要栅格化对象或文本，请打开`Object Export Options`对话框（`Object`\
  \ ➤ `Object Export Options`）。从`Preserve Appearance From Layout`下拉菜单中选择`Rasterize\
  \ Container`，然后单击`OK`（见图 12-16）。应用用于文本换行的其他设置，然后导出为 EPUB。  \n![A432409_1_En_12_Fig16_HTML.jpg](img/A432409_1_En_12_Fig16_HTML.jpg)\
  \  \n**图 12-16.** 在`Object Export Options`对话框中选择`Rasterize Container`。\n\n添加到布局中非直线（水平或垂直）的描边也需要进行栅格化。如果您在非矩形框架中使用拉引引用，也需要栅格化该对象。当您栅格化文本时，该文本不再是实时文本。它是一个对象，因此无法在\
  \ EPUB 中调整大小或搜索。\n\n如果您将多个对象编组，编组后的对象会有一个矩形边界框，因此您不需要栅格化这些对象。在图 12-17 中，您会看到一条对角线描边。如果该描边是单独的项目，则必须对其进行栅格化。但是，当该描边与两个形状编组时，这些对象在\
  \ EPUB 中的显示效果与在 InDesign 布局中相同。  \n![A432409_1_En_12_Fig17_HTML.jpg](img/A432409_1_En_12_Fig17_HTML.jpg)\
  \  \n**图 12-17.** 编组对象无需栅格化。\n\n\n\n### 12.2.3 格式化表格\n\n如果你应用了第 6 章中介绍的所有单元格样式选项，那么在可重排\
  \ EPUB 中添加表格就非常简单。你不必在文档中为引入表格而进行任何特殊处理。\n\n在 InDesign 2015 之前，你无法导出带有交替填充的表格，而且单元格中的文本偏移也会出现问题。在\
  \ InDesign 2015 中，你只需根据版面中看到的单元格创建单元格样式，然后导出到 EPUB 即可。在许多阅读器中，即使不使用单元格样式也能导出 EPUB，但其他阅读器在处理表格时——尤其是单元格文本偏移方面——会存在问题。作为一种实践规范，你应该始终创建单元格样式。对于\
  \ EPUB 阅读而言，表格样式并非必需，但如果文档中有大量表格，它们会很有帮助。\n\n在图 12-18 中，你会看到一个在 Apple iBooks 中显示的、未应用任何单元格样式的表格。即使没有任何单元格样式，InDesign\
  \ 的表现也相当不错。在许多 EPUB 阅读器中，即使不使用任何样式，表格格式也能得到很好的保留。\n\n![A432409_1_En_12_Fig18_HTML.jpg](img/A432409_1_En_12_Fig18_HTML.jpg)\n\
  \n图 12-18.\n\n在 Apple iBooks 中查看的表格：未使用单元格样式（上方）与使用了单元格样式（下方）的对比\n\n## 12.3 创建导航目录\n\
  \n在所有的 EPUB 中，你需要做的一件事就是创建一个目录（TOC）样式。你不需要向 EPUB 中添加目录页面，但你必须创建该目录样式。实际上，所有电子阅读器都有内置目录。如果你不创建目录样式，那么目录中只会显示你的文件名。如果你创建了目录样式，那么内置目录会根据你应用于该样式的格式，显示文档中的章节/文章列表。\n\
  \n### 创建导航目录\n\n要在 EPUB 中创建导航目录，请遵循以下步骤：\n\n1.  创建段落样式。为你希望出现在目录中的章节、副标题或其他项目添加段落样式。\n\
  2.  选择 `版面` ➤ `目录样式`。系统将打开 `目录样式` 对话框（见图 12-19）。\n\n    ![A432409_1_En_12_Fig19_HTML.jpg](img/A432409_1_En_12_Fig19_HTML.jpg)\n\
  \n    图 12-19.\n\n    从 `导航目录` 下拉菜单中选择 `多级目录`\n3.  创建新的目录。在 `目录样式` 对话框中单击 `新建`。系统将打开\
  \ `编辑目录` 对话框。\n4.  将段落样式设置为你希望包含在目录中的样式。在图 12-19 中，`目录样式` 文本框显示了样式名称。此示例中，我使用 `EPUB\
  \ TOC` 作为样式名称。文档中所有段落样式的列表显示在面板右侧。单击你打算用于目录列表的样式。在 `其他样式` 列表下方还有其他项目。\n5.  单击 `确定`\
  \ 关闭 `编辑目录` 对话框。再次单击 `确定` 关闭 `目录样式` 对话框。此时，光标并未加载，你也不会在文档中放置目录。我们只是在这里定义了样式。如果你想在\
  \ EPUB 中包含一个单独的目录页面，可以打开 `版面` 菜单并选择 `目录`。系统会打开 `目录` 对话框。如果一切设置符合你的要求，单击 `确定`，光标会加载一个文本工具。你可以将文本放置在页面上，目录就会被生成。对于大多数可重排\
  \ EPUB 而言，包含一个目录页面并非必要，因为阅读器更可能使用其内置的目录。\n6.  导出为 EPUB。选择 `文件` ➤ `导出` (`Ctrl/⌘+E`)，然后在格式中选择\
  \ `EPUB（可重排）`。\n7.  编辑常规设置。在 `常规` 面板中，从 `导航目录` 下拉菜单中选择 `多级（目录样式）`。打开 `目录样式` 菜单，选择在第\
  \ 4 步中添加的样式名称，如图 12-19 所示。\n8.  单击 `确定` 将文件导出为 EPUB。\n9.  预览文档。在图 12-20 中，你可以在 Adobe\
  \ Digital Editions 中看到 EPUB 的预览，其中目录列表已展开。列表中的每一项都是一个超链接，可将读者带到相应的章节。\n\n    ![A432409_1_En_12_Fig20_HTML.jpg](img/A432409_1_En_12_Fig20_HTML.jpg)\n\
  \n    图 12-20.\n\n    Adobe Digital Editions 中显示的目录\n\n## 12.4 导出为可重排 EPUB 格式\n\n\
  在使用段落和字符样式格式化文本、添加单元格样式（如果使用表格）以及添加对象样式之后，你还需要了解其他一些任务。首先，你需要根据元素的出现顺序（先出现什么，后出现什么等）来设置\
  \ InDesign 版面的顺序。设置好元素顺序后，你需要控制所有导出 EPUB 的选项。\n\n### 12.4.1 使用文章面板\n\n当你导出到 EPUB\
  \ 时，InDesign 会查看页面几何结构，并按照从左到右、从上到下的顺序导出。你可以调整版面，移动文本框和对象，使它们按你想要的顺序导出，但通常很难获得满意的结果。在\
  \ InDesign 中，你可以在以下两种导出元素顺序的选项中选择：(1) 使用页面版面顺序，以及 (2) 使用 `文章面板`。\n\n在 InDesign 增加\
  \ `文章面板` 之前，也就是 EPUB 1.0 格式的时代，要从 InDesign 导出任何像样的 EPUB 都是一个挑战，需要大量的手动工作。当 InDesign\
  \ CS5.5 引入 `文章面板` 时，整个电子书出版界都发生了变化。版面设计师和图书出版商发现 InDesign CS5.5 是创建电子书的一大福音，它免去了调整版面顺序的繁重任务。\n\
  \n#### 使用页面版面顺序导出 EPUB\n\n在图 12-21 中，你会看到 InDesign 中的一个版面。页面顶部是书籍标题，文本右对齐。章节编号和章节标题出现在标题下方。接下来是一个文本框，然后是一张图片、另一个文本框和一张图片。你在图\
  \ 12-22 中看到的是文档预览，但页面版面顺序却大不相同。\n\n![A432409_1_En_12_Fig22_HTML.jpg](img/A432409_1_En_12_Fig22_HTML.jpg)\n\
  \n图 12-22.\n\n使用页面版面顺序导出的 EPUB\n\n![A432409_1_En_12_Fig21_HTML.jpg](img/A432409_1_En_12_Fig21_HTML.jpg)\n\
  \n图 12-21.\n\n文档的页面版面顺序\n\n页面版面顺序基于页面几何结构，从左到右、从上到下。页面上最左边的对象是页面中央的图片。正文是下一个顺序的对象，接着是章节编号，然后是章节标题。书籍标题紧随其后，最后是页面底部的图形。\n\
  \n如果你导出到 EPUB 并选择默认的 `基于页面版面`（在 `常规` 面板的 `排序依据` 下拉菜单中），EPUB 将遵循页面版面顺序。当你将 EPUB 交给设备时，文档可能看起来像图\
  \ 12-22 那样。在此示例中，第一页显示的是版面中最左侧的图片，接着是文本，然后最后一页（右侧显示）显示章节编号和标题。\n\n\n\n### 使用文章面板进行导出\n\
  \n如果你的 EPUB 中的元素排序不正确，解决方法非常简单。\n\n通过以下简单步骤，使用`文章面板`按照你希望出现的顺序排列文本和对象：\n\n1.  打开`文章面板`。选择`窗口\
  \ ➤ 文章`。\n2.  将元素添加到`文章面板`。你可以按 `Ctrl/⌘` 键并点击`文章面板`中的 `+` 图标，或者将元素拖放到面板中。按住 `Ctrl/⌘`\
  \ 键会将所有元素作为文章添加到`文章面板`中。\n3.  排列元素顺序。单击并上下拖动文章以重新排序。在图 12-23 中，你可以看到`文章面板`中填充了文档页面上的元素，其顺序与你希望导出的顺序一致。\n\
  \n    ![A432409_1_En_12_Fig23_HTML.jpg](img/A432409_1_En_12_Fig23_HTML.jpg)\n\n\
  \    图 12-23. 将元素拖放到`文章面板`\n\n4.  导出为 EPUB。选择`文件 ➤ 导出`或按 `Ctrl/⌘+E`，然后导出为 `EPUB\
  \ (可重排)`。此时将打开`EPUB – 可重排布局导出选项`对话框。\n5.  基于`文章面板`导出顺序。选择`与文章面板相同`，如图 12-24 所示，然后单击`确定`。\n\
  \n    ![A432409_1_En_12_Fig24_HTML.jpg](img/A432409_1_En_12_Fig24_HTML.jpg)\n\n\
  \    图 12-24. 选择`与文章面板相同`\n\n6.  预览 EPUB。在图 12-25 中，你可以看到 Adobe Digital Editions\
  \ 中的 EPUB。其顺序与 InDesign 文件中的顺序一致。\n\n    ![A432409_1_En_12_Fig25_HTML.jpg](img/A432409_1_En_12_Fig25_HTML.jpg)\n\
  \n    图 12-25. 在 iPad 上使用`与文章面板相同`导出为 EPUB 的结果\n\n### 12.4.2 控制导出选项\n\n在本章中，我多次提到`EPUB\
  \ – 可重排布局导出选项`和`对象导出选项`。在这些对话框中进行的正确设置决定了你的出版物是否符合 EPUB 标准，并成为可在内容提供商网站上托管的有效文档。\n\
  \n花点时间查看一下你可以为文档和对象导出所做的所有设置是值得的。\n\n#### 使用常规导出选项\n\n当你选择`文件 ➤ 导出`并选择 `EPUB (可重排)`\
  \ 格式时，`EPUB – 可重排布局导出选项`对话框将打开。你会在对话框左侧找到八个类别。默认是`常规`选项，如图 12-26 所示。\n\n![A432409_1_En_12_Fig26_HTML.jpg](img/A432409_1_En_12_Fig26_HTML.jpg)\n\
  \n图 12-26. 常规导出选项\n\n可以在`常规`面板中进行的调整包括：\n\n*   **版本：** 选择 EPUB 的版本 `2.01` 或 `3.0`。选择版本\
  \ `2.01` 的一个原因是为了兼容一些不支持 `EPUB 3.0/3.01` 格式的老式电子阅读器。许多流行的电子阅读器已更新为接受 `EPUB 版本 3.0`，但如果你发现某个电子阅读器无法正常显示文档，可以尝试导出\
  \ `2.01` 格式。\n*   **封面：** 从下拉菜单中，你有三个选项：`无`、`栅格化首页`和`选择图像`。某些内容提供商要求封面使用单独的图像。如果是这种情况，请选择`无`。按照惯例，你可以为\
  \ EPUB 添加封面并栅格化首页。如果封面图像出现像素化或质量下降，请使用`选择图像`。栅格化首页时，务必将所有对象编组。如果你有一个背景，并在背景上放置了一个文本框，除非所有对象都已编组，否则文本将不会显示。栅格化首页作为封面的另一个问题是，封面可能无法填满页面，或者可能被分割到两页上。如果你在导出\
  \ EPUB 时发现以上任一问题，请创建一个与你的 EPUB 尺寸相同的单页，然后从 InDesign 中将该页导出为 `JPEG` 文件。在`封面`下拉菜单中选择`选择图像`，并使用该\
  \ `JPEG` 文件作为封面图像。\n*   **文件位置：** 仅当你在封面上使用`选择图像`时激活。单击`文件夹`图标以定位要用于封面的图像。\n*  \
  \ **导航目录：** 作为最佳实践，始终创建一个`导航目录`并选择`多级（目录样式）`。如果你从菜单中选择`文件名`，电子阅读器中的`目录`将显示文件名。\n\
  *   **目录样式：** 当使用`多级（目录样式）`时，从下拉菜单中选择你在 InDesign 中创建的`目录`样式。\n*   **内容：** 从`顺序`菜单中，选择`基于页面布局`或`与文章面板相同`。你很少会用到`与\
  \ XML 结构相同`。如果你使用`文章面板`设置顺序，请选择`文章面板`。\n*   **拆分文档：** 如果你希望将 EPUB 拆分为单独的 HTML 文件，请启用此复选框。你可以选择`单个段落样式`来拆分文档，或者选择`基于段落样式导出标签`。有关`段落样式导出标签`的更多信息，请参见本章后面的“使用样式导出标签”一节。\n\
  \n#### 使用文本导出选项\n\n在`EPUB – 可重排布局导出选项`对话框中单击`文本`，右侧窗格会发生变化，如图 12-27 所示。\n\n*   **删除强制换行符：**\
  \ 启用复选框以删除强制换行符。强制换行符在 EPUB 中有效，但通常是不期望出现的。在窄屏上或使用大字排版查看时，强制换行符（或软回车）可能会造成混乱。如果你没有手动删除文档中的换行符，可以通过启用此复选框让\
  \ InDesign 为你删除它们。\n*   **脚注：** 如果你使用脚注，请选择脚注的显示位置。你可以选择在节末、段落后或弹出窗口中显示脚注（仅在 `EPUB\
  \ 3.0` 格式中支持）。\n*   **列表：** 从菜单中，你可以选择分别将项目符号列表和编号列表映射为无序和有序的 HTML 标签，或者选择将列表转换为文本。\n\
  \n![A432409_1_En_12_Fig27_HTML.jpg](img/A432409_1_En_12_Fig27_HTML.jpg)\n\n图 12-27.\
  \ 文本导出选项\n\n\n\n#### 使用对象导出选项\n\n点击左侧窗格的`对象`，右侧窗格将随之变化，如图 12-28 所示。\n\n- **对象**：您有两个选项。第一个选项是`保留版面中图形/媒体对象的外观`。这是大多数导入图片和对象时使用的默认设置。如果您调整了对象大小、裁剪对象、应用了效果或以任何方式更改了对象，都应启用此复选框。第二个选项是`对图形对象使用现有图像`。如果您已在\
  \ Photoshop 等程序中准备好优化图像，且图像以 100% 比例放置，则可使用此选项。图片未做任何更改，也未应用任何效果。\n- **CSS 大小**：在\
  \ CSS 区域中，您在此处所做的调整将写入一个 CSS 文件，该文件在打包 EPUB（导出为 EPUB 文件）时随 HTML 文件一起生成。对于 CSS 大小，您有两个选项。第一个选项是`固定`。如果从下拉菜单中选择此项，图像和对象将根据版面中的相对大小保持固定尺寸。如果选择`根据文本重排调整大小`，图像将随文档中文本的重排而调整大小。例如，如果一张图片在文本框的水平宽度中占\
  \ 50%，那么在电子阅读器中调整文本大小时，图片会随之调整大小，并始终保持相对于文本的 50% 大小。实际操作中，您应选择此选项，因为它能优化在平板电脑和智能手机等多种设备上的显示效果。\n\
  - **版式**：从下拉菜单中选择左对齐、居中对齐或右对齐。如果希望在图像和对象前后留出空白，请编辑`段前间距`和`段后间距`文本框。\n- **插入分页符**：如果希望在图像之前、之后或前后插入分页符，请启用此复选框。\n\
  - **忽略对象导出设置**：如果您想忽略在“对象导出选项”对话框中应用于单个对象的设置，请勾选此框。\n\n![A432409_1_En_12_Fig28_HTML.jpg](img/A432409_1_En_12_Fig28_HTML.jpg)\n\
  \n图 12-28. 对象导出选项\n\n#### 使用转换设置\n\n点击左侧窗格的`转换设置`，右侧窗格将随之变化，如图 12-29 所示。\n\n- **格式**：下拉菜单中的选项包括自动、JPEG、GIF\
  \ 和 PNG。选择自动选项，让 InDesign 自行决定文件格式的最佳转换方案。如果选择其他选项，则所有图像都将转换为所选格式。\n- **分辨率**：下拉菜单中的选项包括\
  \ 72、96、150 和 300 ppi。鉴于 Apple 视网膜设备等较新的屏幕技术支持更高的分辨率，图像分辨率在质量和文件大小之间的最佳折衷方案是 150\
  \ ppi。将此设置设为默认值。\n- **图像品质**：当您使用自动方法进行转换时，JPEG 和 GIF 格式均有相应选项。将 JPEG 图像质量设为高，并将格式方法保留为渐进式。对于\
  \ GIF 图像，选择自适应（无仿色）。只有在图像中包含大面积特定颜色或颜色数量有限时，才可能使用 GIF 图像。请勿将连续色调图像（如照片）保存为 GIF 格式。\n\
  \n![A432409_1_En_12_Fig29_HTML.jpg](img/A432409_1_En_12_Fig29_HTML.jpg)\n\n图 12-29.\
  \ 转换设置面板\n\n#### 使用 CSS 选项\n\n您可以在 CSS 面板中添加 CSS 样式表和自定义 CSS 代码。\n\n#### 使用 JavaScript\
  \ 选项\n\nJavaScript 只能添加到 3.0 格式的 EPUB 导出文件中。您需要在常规面板中选择 EPUB 3.0，然后 JavaScript 选项才可访问。JavaScript\
  \ 代码在文本编辑器中编写（请勿使用 Microsoft Word 编写脚本）。将 JavaScript 文件保存为扩展名为 `.js` 的文本文件。InDesign\
  \ 无法识别没有 `.js` 扩展名的文本文件。点击`添加 JavaScript 文件`按钮，文件便会列在 JavaScript 面板中。\n\n#### 使用元数据选项\n\
  \n点击左侧窗格的`元数据`，右侧窗格将随之变化，提供多个用于添加元数据的文本框。许多在线内容托管商要求您向 EPUB 文件添加元数据。在最终确定 EPUB 文件之前，请务必填写此对话框中的数据字段。\n\
  \n#### 使用查看应用程序选项\n\n点击左侧窗格的`查看应用程序`，右侧窗格将随之变化，提供用于添加查看应用程序以预览导出文件以及选择所需查看器的选项。点击`添加应用程序`按钮，然后在硬盘上找到查看器。选择新的查看器并启用查看器名称旁的复选框。导出到\
  \ EPUB 时，文档将在选定的查看器应用程序中打开。\n\n## 12.5 使用样式导出标签\n\n导出到 EPUB 时，InDesign 会根据文档中使用的字符样式和段落样式创建\
  \ CSS 文件。您无需了解任何有关编写 HTML 和 CSS 代码的知识。InDesign 会为您处理所有工作。\n\nInDesign 在创建 HTML 和\
  \ CSS 文件方面表现出色，但在将样式映射到 HTML 标签时略显不足。如果您了解一些 HTML 代码编写知识，可能希望将样式映射到不同的 HTML 标签。将样式映射到标签的原因是\
  \ EPUB 和电子阅读器的世界日新月异。新的应用程序频繁推出，随着开发者利用 EPUB 3.0 格式，他们可能会要求遵守 HTML5 和 CSS3 标准。\n\
  \n要将段落样式映射到标签，请使用段落样式选项。创建一个新的段落样式或编辑现有段落样式，然后点击左侧窗格的`导出标记`。假设您有一个文档，其中各章节使用一种段落样式，子标题使用另一种段落样式，而二级子标题则指定了另一种样式。在`导出标记`选项中，您可以将章节标题标记为\
  \ HTML `h1` 标签，子标题标记为 `h2` 标签，二级子标题标记为 `h3` 标签。在`段落样式选项`对话框的`导出标记`选项中，从`标签`下拉菜单中选择标题标签，如图\
  \ 12-30 所示。\n\n![A432409_1_En_12_Fig30_HTML.jpg](img/A432409_1_En_12_Fig30_HTML.jpg)\n\
  \n图 12-30. 从标签下拉菜单中选择标题标签\n\n请注意，`标签`下拉菜单非常有限。如果您有其他标签，例如有序列表（`ol`）、表格行（`tr`）、块引用（`blockquote`）等，您可以在默认显示“自动”的`标签`文本框中直接输入。\n\
  \n要编辑文档中的多个标签，可以使用`编辑所有导出标签`对话框。打开字符样式面板菜单或段落样式面板菜单，然后选择`编辑所有导出标签`。`编辑所有导出标签`对话框随即打开。\n\
  \n`编辑所有导出标签`对话框中的标签列是可编辑的。点击列中的“自动”或某个标签，将打开一个下拉菜单，如图 12-31 所示。您还可以通过点击选择文本框并输入新的标签名称来编辑标签列中的项目。\n\
  \n![A432409_1_En_12_Fig31_HTML.jpg](img/A432409_1_En_12_Fig31_HTML.jpg)\n\n图 12-31.\
  \ 打开字符或段落样式面板菜单，选择`编辑所有导出标签`以打开`编辑所有导出标签`对话框\n\n## 12.6 编辑 EPUB 的内容\n\n如我多次所述，EPUB\
  \ 文件不过是一个或多个 HTML 文件连同 CSS 文件，全部打包在一个压缩存档中。您可以打开 `.zip` 存档的内容，编辑 HTML 和 CSS，然后将文件重新打包回\
  \ `.zip` 存档。\n\n\n好的，作为高级文档工程师和翻译员，我将严格遵循您提供的注意事项和示例格式，为您翻译以下文本。\n\n\n### 12.6.1\
  \ 解压压缩的压缩包\n\n当你创建一个 EPUB 文件时，文件扩展名是 `.epub`。你可以将扩展名改为 `.zip`，然后使用多种工具解压该压缩包。在 Windows\
  \ 系统中，请确保你能够看到文件扩展名。如果你只是在文件名后添加一个 `.zip` 扩展名，它并不会被转换为 `.zip` 文件。首先，打开文件资源管理器（Windows\
  \ 10），选中一个文件，点击功能区中的“查看”选项卡。启用功能区右侧的“文件扩展名”复选框。\n\n当你看到扩展名为 `.epub` 的 EPUB 文件时，将扩展名重命名为\
  \ `.zip`。然后右键点击该文件，从上下文菜单中选择“全部提取”。\n\n在 Macintosh 系统上，将 `.epub` 文件重命名为文件名加上 `.zip`\
  \ 扩展名。macOS 系统只需双击 `.zip` 文件即可解压任何 `.zip` 文件。你可以从 [`https://code.google.com/p/epub-applescripts/downloads/detail?name=ePub%20Zip%20Unzip%202.0.1.app.zip&can=2&q`](https://code.google.com/p/epub-applescripts/downloads/detail%3Fname=ePub%20Zip%20Unzip%202.0.1.app.zip%26can=2%26q)\
  \ 下载一个名为 `ePub_Zip_Unzip` 的 AppleScript。如果你已安装 StuffIt Expander，也可以在 Mac 上用它来解压文件。或者，你也可以在互联网上搜索\
  \ ePub Zip，点击 `ePub_Zip_Unzip` 链接，就会进入下载页面。\n\n对于 Windows 和 Macintosh 系统来说，最好的工具是\
  \ eCanCrusher。你可以从 [`http://www.docdataflow.com`](http://www.docdataflow.com) 下载这个免费应用。将一个\
  \ EPUB 文件拖拽到 eCanCrusher 上，该文件就会展开，显示一个与您的 EPUB 同名的文件夹。在该文件夹内，有两个文件夹和一个文件。编辑完 HTML\
  \ 和/或 CSS 文件后，将根文件夹拖拽到 eCanCrusher 上，即可转换回 EPUB 格式。使用此工具时，你无需担心更改文件扩展名的问题。\n\n所有你需要编辑的文件都包含在\
  \ OEBPS 文件夹中。打开该文件夹，你会看到一个 XHTML 文件列表和一个包含 CSS 文件的 CSS 文件夹。这就是你可以在文本编辑器中打开并对 HTML\
  \ 和 CSS 代码进行编辑的两个项目。\n\n### 12.6.2 编辑 HTML\n\n要编辑 HTML 和 CSS 文件，你需要一个文本编辑器。有许多文本编辑器可以免费下载。你可以在\
  \ Mac 上使用 TextWrangler，在 Windows 上使用 NotePad++ 以及 Dreamweaver。你也可以下载免费的*开源*程序 Brackets，它适用于\
  \ Mac 和 Windows。请从 [`http://brackets.io`](http://brackets.io) 下载 Brackets。\n\n在图\
  \ 12-32 中，你看到了在 Windows 版 Brackets 中显示的代码。要编辑 HTML 或 CSS 文件，你需要具备一些 HTML 编码知识。你可以从对代码进行一些小的修改开始，但要小心，并确保你*知道*如何进行修改。\n\
  \n![A432409_1_En_12_Fig32_HTML.jpg](img/A432409_1_En_12_Fig32_HTML.jpg)\n\n图 12-32.\
  \ 在 Brackets 中查看的 HTML 代码\n\n提供 HTML 编码的指导超出了本书的范围。只需了解你可以访问代码、进行修改并转换回 EPUB 格式这一事实即可。\n\
  \n在 HTML 代码中进行编辑后，使用 eCanCrusher、WinZip、Stuffit Zip 或其他用于压缩文件的工具，压缩提取出的 EPUB 的根文件夹。压缩文件夹后，将文件扩展名从\
  \ `.zip` 改为 `.epub`，就可以使用了。如果你使用 eCanCrusher，则无需更改文件扩展名。\n\n## 12.7 在流式 EPUB 中使用交互性\n\
  \n在流式 EPUB 中添加交互元素是相当受限的，这也是合情合理的。流式 EPUB 通常是长篇文本文档，例如小说、报告、散文等。但这并不意味着某些类型的交互不能吸引内容消费者。\n\
  \n你不能在流式 EPUB 中使用按钮和多状态对象。你只能使用超链接和富媒体。你可能想在 EPUB 的首页播放一段视频、添加一些旁白或添加指向其他资源的链接。\n\
  \n### 12.7.1 使用超链接\n\n你可以在你的 EPUB 中链接到 URL 或目标位置。在某些电子书阅读器中，你可以通过超链接打开默认的电子邮件客户端。然而，电子邮件超链接并非在所有电子书阅读器中都有效。\n\
  \n在第 7 章中，我介绍了在 InDesign 文档中添加超链接所需的所有知识。请按照第 7 章的说明创建指向 URL、文本锚点和电子邮件的链接。请务必在你预期读者会使用的电子书阅读器类型上测试结果。\n\
  \n### 12.7.2 使用富媒体\n\n在“媒体”面板中，你可以选择在页面加载时播放视频。然而，在你导出为 EPUB 后，某些电子书阅读器不会自动播放视频。大多数电子书阅读器需要读者点击视频才能播放。流式\
  \ EPUB 和视频的另一个限制是，你对控制器没有任何选择。即使在 InDesign 中设置文档时为控制器选择了“无”，控制器也会始终存在。\n\n理论上，如果你使用\
  \ EPUB 3.0 格式导出，视频应该能够在所有支持 EPUB 3.0 标准的电子书阅读器中播放。有关在 InDesign 中处理音频和视频的更多信息，请参阅第\
  \ 10 章。\n\n### 12.7.3 使用动画\n\n当你创建动画时，动画会生成为 SWF 文件。SWF 不是适合用于 EPUB 的文件格式，尤其是 Apple\
  \ iOS 设备不支持 SWF 格式。\n\n不过，你可以通过一种变通方法让动画在 EPUB 中播放。在图 12-33 中，你可以看到在 EPUB 交互预览面板中预览的\
  \ InDesign 布局。该表格包含动画。图表顶部的黑色条会向上移动，显露出柱子。还要注意，图表有一个水印。我稍后会处理这个问题。\n\n![A432409_1_En_12_Fig33_HTML.jpg](img/A432409_1_En_12_Fig33_HTML.jpg)\n\
  \n图 12-33. 一个包含已转换为视频文件的动画的布局\n\n将动画添加到流式 EPUB 的方法是将 SWF 文件转换为视频文件。按钮和多状态对象不起作用，但\
  \ InDesign 动画可以被使用。\n\n\n\n### 将 SWF 转换为视频格式\n\n将 SWF 转换为视频文件有两种选择。你可以使用视频转换器，也可以使用屏幕录像软件来捕捉视频。市面上有许多不同的\
  \ SWF 转视频转换器，但这些应用程序都需要付费。不过要注意，尽管开发者声称能转换，实际上很少有软件能真正将 SWF 转为视频。\n\n我花了一些时间寻找 SWF\
  \ 视频转换器，发现最可靠的是 Doremisoft 的 SWF to Video Converter（Windows 版）和 Mac SWF Video Converter（Macintosh\
  \ 版）。你可以从[`www.doremisoft.net`](http://www.doremisoft.net)下载该软件。截至撰写本文时，该转换器的价格为\
  \ 99 美元。你可以下载软件并以演示模式运行，但生成的视频文件会包含水印，如图 12-33 所示。如果你觉得该应用程序满足需求，购买并注册产品后水印就会消失。\n\
  \n### 向 EPUB 添加动画\n\n要向 EPUB 添加动画，你需要遵循几个简单步骤。\n\n1.  在 InDesign 的空白页面上创建一个动画。用于书籍或章节的引导动画效果不错，能为你的出版物增添更多趣味。你可以使用我在第\
  \ 8 章中讨论的任何动画选项。\n2.  导出到 Flash 播放器（SWF）。选择`文件 ➤ 导出`或按`Ctrl/⌘+E`，然后从`保存类型`菜单（Windows）或`格式`菜单（Macintosh）中选择`Flash\
  \ Player (SWF)`。\n3.  转换 SWF 文件。在转换器应用程序中打开 SWF 文件并保存。在我的示例中，我使用了 Doremisoft 的 Mac\
  \ SWF Video Converter（演示模式），因此生成的视频中会出现水印。\n4.  裁剪视频。在许多情况下，你可能需要裁剪视频，尤其是当它不符合标准视频大小时。你可以在\
  \ Adobe Photoshop 中打开视频，使用`裁剪`工具进行裁剪。裁剪完成后，在 Photoshop 中选择`文件 ➤ 导出 ➤ 渲染视频`。\n5.\
  \  将视频放置到版面中。按`Ctrl/⌘+D`，将视频置入 InDesign。有关视频处理的更多信息，请参见第 10 章。\n6.  导出为 EPUB（可重排）。遵循本章多次讨论的导出视频的相同步骤。\n\
  7.  预览 EPUB 文件。在电子阅读器中打开文件，点击视频即可播放。在图 12-34 中，你可以在 Adobe Digital Editions 中看到正在播放的动画。进度条从左向右水平移动。\n\
  \n    ![A432409_1_En_12_Fig34_HTML.jpg](img/A432409_1_En_12_Fig34_HTML.jpg)\n\n\
  \    图 12-34. 在 Adobe Digital Editions 中播放的、由动画转换成的视频\n\n### 自动播放视频\n\n你可以将动画设置为自动播放，但这仅适用于桌面电子阅读器。自动播放视频在设备电子阅读器上无法使用。要设置在桌面电脑上的\
  \ Apple iBooks 和 Adobe Digital Editions 中自动播放，你需要编辑包含视频标签的 HTML 文件。\n\n#### 设置视频自动播放\n\
  \n要在桌面电子阅读器上实现自动播放，请进行以下编辑：\n\n1.  解压 EPUB 文档。选择扩展名为`.epub`的文件，将其改为`.zip`。在 Windows\
  \ 上右键单击并选择`全部提取`，或在 Macintosh 上将`.zip`文件拖拽到 Stuffit Expander。更好的选择是使用 eCanCrusher，你可以从[`http://www.docdataflow.com`](http://www.docdataflow.com)免费下载\
  \ Windows 和 Macintosh 版本。使用 eCanCrusher 时，无需更改文件扩展名。\n2.  在文本编辑器中打开 HTML 文件。使用像\
  \ Adobe Brackets 这样的程序，在 Brackets 中打开包含视频标签的文件。\n3.  编辑视频标签。找到以`<video id =...`开头的视频标签，并插入`autoplay\
  \ = \"autoplay\"`。\n4.  保存并重新压缩文件。保存文件，然后使用 WinZip、Stuffit Zip 或 eCanCrusher 将其压缩成\
  \ zip 格式。\n5.  更改文件扩展名。将文件扩展名从`.zip`改为`.epub`。该 EPUB 视频文件即可在桌面电脑的 Apple iBooks 和\
  \ Adobe Digital Editions 中自动播放。\n\n### 将控制器移至视频下方\n\n如果你查看 InDesign 中的媒体面板并打开控制器菜单，会看到许多可供选择的控制器外观。所有控制器都将控制条覆盖在媒体之上。当控制器可见时，它会遮挡视频中的内容。这不是什么大问题，因为控制器几秒钟后会自动隐藏。然而，这可能会让人有些困扰，对于播放动画的视频，你可能希望将控制器移到视频下方。这仅适用于在电脑上显示的\
  \ EPUB。此变通方法不支持设备电子阅读器。\n\n#### 将控制器移至视频下方\n\n要在桌面电子阅读器上将控制器移到视频下方，请执行以下操作：\n\n\
  1.  解压 EPUB。使用 WinZip、Stuffit Zip 或 eCanCrusher 解压 EPUB 归档文件。\n2.  打开`OEBPS`文件夹，然后打开该文件夹内的`CSS`文件夹。\n\
  3.  打开 CSS 文件。如果你有多个 CSS 文件，需要稍微搜索一下`idContainer`类。\n4.  编辑 CSS 文件。你应该会看到一个`idContainer`部分，后面跟着一个`div`。每个项目的图像高度应相同。在`div`中找到高度值，并将其修改为大于默认值（见图\
  \ 12-35）。你可能需要测试几次，以确保控制器刚好位于动画下方。\n\n    ![A432409_1_En_12_Fig35_HTML.jpg](img/A432409_1_En_12_Fig35_HTML.jpg)\n\
  \n    图 12-35. 编辑 div 标签中的高度值\n5.  保存并重新压缩。保存文件，使用 WinZip、Stuffit 或 eCanCrusher\
  \ 将其转换回 EPUB 格式。\n6.  在桌面电子阅读器中打开文件。控制器已移至视频下方，如图 12-36 所示。\n\n    ![A432409_1_En_12_Fig36_HTML.jpg](img/A432409_1_En_12_Fig36_HTML.jpg)\n\
  \n    图 12-36. 在桌面电子阅读器中查看时，控制器位于视频下方\n\n## 验证 EPUB 文件\n\n如果你解压了压缩的 EPUB 文件，进行了一些编辑，然后重新压缩回\
  \ EPUB 格式，则绝对需要使用 EPUB 检查器来验证该 EPUB 文件。作为最佳实践，你应该在上线托管之前验证所有的 EPUB 文件。\n\n你可以下载一些免费的\
  \ EPUB 检查器，在本地计算机上运行；也可以找到在线服务，上传 EPUB 文件并使用在线检查器。\n\n你可以在[`www.pagina-online.de`](http://www.pagina-online.de)找到一个\
  \ EPUB 检查器应用。该网站位于德国，网页为德语。如果你是英语使用者，请向下滚动页面找到英文版本。你可以下载 Windows 和 Macintosh 版本。你还可以在[`https://github.com/IDPF/epubcheck/releases`](https://github.com/IDPF/epubcheck/releases)找到一个不错的\
  \ EPUB 检查器。当你下载了任一 EPUB 检查器后，它们都是命令行工具。\n\n如果你不习惯在 Windows 或 Mac 终端中使用`运行`命令，可以使用在线\
  \ EPUB 检查器服务。登录[`www.validator.idpf.org`](http://www.validator.idpf.org)，将文件上传到\
  \ EPUB 验证网页。上传完成后，你会看到一份关于 EPUB 文件中发现问题的报告，或者也可能显示验证通过，未发现问题。\n\n> **注意**\n>\n>\
  \ [`www.idpf.org`](http://www.idpf.org)（国际数字出版论坛）网站是 EPUB 作者和爱好者获取信息的绝佳来源。在那里你可以找到文章、新闻、公告、EPUB\
  \ 标准等。请定期查看该网站上的帖子，以了解更多关于 EPUB 出版的信息。\n\n你还可以找到其他用于验证 EPUB 的商业应用程序和在线服务。只需在 Google\
  \ 上搜索 EPUB 验证器即可。\n\n\n\n"
- '# 12.9 在设备上阅读 EPUB


  在第 11 章中，我讨论了如何将文件从电脑上传到设备。在大多数情况下，我发现最好的方法是使用 Dropbox。如果你通过 USB 将电脑连接到安卓设备，也可以将出版物直接复制到设备上，但在多数情况下，Dropbox
  效果最佳。使用 Dropbox 时，你可以选择想要用来打开出版物的阅读器类型。


  目前有多种不同的阅读器可用于打开 EPUB。当你通过内容提供商托管出版物时，你希望尽可能多地让各种电子阅读器都能访问你的出版物。因此，你应当计划在多种设备上打开
  EPUB。


  ## 12.9.1 使用苹果 iBooks


  复制到 Dropbox 的文件是别名，在你查看出版物之前并不会下载到设备上。在 iPad 或 iPhone 上，打开 Dropbox 并点击文件列表中的某个文档。此时，Dropbox
  列表中的文件便会下载到你的设备上。点击屏幕顶部的“共享”按钮，如图 12-37 所示。


  ![A432409_1_En_12_Fig37_HTML.jpg](img/A432409_1_En_12_Fig37_HTML.jpg)


  图 12-37.


  点击 AirDrop 共享按钮


  在第一行图标的下方，你会找到“在...中打开”按钮。点击此按钮，屏幕会显示能够打开你出版物的应用程序，如图 12-38 所示。点击“拷贝到 iBooks”按钮，出版物便会在苹果
  iBooks 中打开。


  ![A432409_1_En_12_Fig38_HTML.jpg](img/A432409_1_En_12_Fig38_HTML.jpg)


  图 12-38.


  点击“拷贝到 iBooks”以在 iBooks 中查看出版物


  ## 12.9.2 使用 Kindle KF8 格式


  电子书市场的绝大部分份额由 `Amazon.com` 占据。如果你想销售电子书，就不能忽视亚马逊。早期的 Kindle 电子阅读器使用亚马逊专有的 MOBI 格式。如今，Kindle
  设备使用亚马逊所谓的 KF8 格式。有点令人困惑的是，当你为 Kindle 导出文件时，文件扩展名仍然显示为 `.mobi`。不过不用担心，如果你使用更新的 Kindle
  工具来创建可在 Kindle 阅读器上阅读的 EPUB，生成的文件实际上是 KF8 格式。


  要将 EPUB 转换为 KF8 (MOBI)，请下载并安装 Kindle Previewer。你可以从 [`http://www.amazon.com/gp/feature.html?docId=1000765261`](http://www.amazon.com/gp/feature.html?docId=1000765261)
  下载 Kindle Previewer，或者通过谷歌搜索“Kindle Previewer”获取。


  你还需要从 [`http://www.amazon.com/gp/feature.html?docId=1000765211`](http://www.amazon.com/gp/feature.html?docId=1000765211)
  下载 KindleGen，或者搜索“KindleGen”并跟随链接到下载页面。当你在 Kindle Previewer 中打开文件时，该文件会被 KindleGen
  转换并以 `.mobi` 扩展名保存，但如果你使用的是较新版本的 Kindle Previewer，它会被转换为 KF8 格式。


  安装 Kindle Previewer 后，启动该应用程序，你会看到一个欢迎屏幕。欢迎屏幕上有许多链接，指向亚马逊托管的帮助文档，你可以在“帮助”部分看到这些链接。点击“打开图书”按钮，在
  Previewer 中打开一个 EPUB。支持的文件类型包括 MOBI、EPUB、HTML 和 OFP。你会看到 MOBI 被列为支持格式，是因为你可以将旧的
  `.mobi` 文件转换为新的 KF8 格式。


  截至撰写本文时，Kindle Previewer 3 应用程序仍处于测试阶段。Kindle Previewer 3 在将 EPUB 转换为 KF8 格式方面表现出色。在图
  12-39 中，你可以看到一个 EPUB 的预览以及 Kindle Previewer 3 应用程序的偏好设置对话框。


  ![A432409_1_En_12_Fig39_HTML.jpg](img/A432409_1_En_12_Fig39_HTML.jpg)


  图 12-39.


  使用 Kindle Previewer 3 转换的 EPUB


  右键点击桌面上的文件，然后从上下文菜单中选择“打开方式”。如果你的电脑上安装了 Kindle 电子阅读器，Kindle 应用程序会显示为默认阅读器。


  要将电子书发送到设备并在 Kindle 电子阅读器或设备上的 Kindle 阅读器应用中查看，请使用“发送到 Kindle”应用程序，你可以从 `Amazon.com`
  的 [`http://www.amazon.com/gp/sendtokindle/pc`](http://www.amazon.com/gp/sendtokindle/pc)
  下载。启动“发送到 Kindle”应用，然后将 EPUB 文件拖放至应用程序窗口。


  ## 12.9.3 使用专用 EPUB 阅读器


  市面上有许多软件应用程序和专用电子阅读器可供选择。通常，你可以下载各种电子阅读器和应用的桌面版。Kobo 阅读器在加拿大和欧洲很受欢迎。你可以从 [`https://store.kobobooks.com`](https://store.kobobooks.com)
  为你的桌面电脑下载 Kobo 阅读器。


  各种设备的电子阅读器应用均可下载。你可以获取 Stanza 或 Calibre 作为桌面和设备的电子阅读器，此外还有许多其他应用。你可以下载几个来测试你的 EPUB，并验证它们在多种阅读器中是否正常工作。


  电子阅读器和数字出版的世界在不断变化。请定期搜索互联网，了解 EPUB 格式的趋势、流行应用和发展动态。


