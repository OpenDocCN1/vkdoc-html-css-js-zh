- "# 第一部分  \n数字出版基础\n\n"
- "# 第 1 章 理解数字出版\n\n在处理数字出版的文档时，有许多需要了解的内容。文件格式种类繁多，阅读设备也各不相同。而且每当你回头一看，新的东西又层出不穷。这足以让你头晕目眩。\n\
  \n在开始创建文档之前，你需要明确自己打算制作哪种类型的出版物，以及使用哪种设备来展示你的作品。在此基础上，你还需进行一些调研，以确保所创建的内容符合在线出版商的要求。\n\
  \n在本章中，我首先定义“数字出版”这一术语，以便我们对接下来的章节内容有共同的理解。我还会讨论文件格式和阅读设备。我将尽力为你提供众多理由，说明为什么 **Adobe\
  \ InDesign** 是任何类型出版文档的首选程序，并建议你遵循的工作流程，以创建格式规范且有效的 EPUB 文件。\n\n在阅读本章及后续章节时，请记住，你无需掌握本书讨论的所有内容。你可能只对\
  \ Kindle 电子书感兴趣，因此可以略过与 Kindle 无关的讨论。或者你可能只对 Apple iBooks 感兴趣，同样可以略过所有与 iBooks 无关的内容。我努力为你提供数字出版创作与发行的广阔视野，由你自行决定哪些特定领域与你的工作相关。\n\
  \n## 1.1 定义数字出版\n\n就本书而言，我们来拆分“数字出版”这个术语。首先看看广义上的出版，然后再看“数字”的含义。\n\n出版被定义为文学作品、音乐或信息的制作与传播过程——即向公众提供信息的活动。\n\
  \n当我们谈及“数字”一词时，它通常指数值数据。然而，更广泛的定义则包括以电子形式提供、可被计算机读取和操作的信息。\n\n简单来说，我们将“数字出版”视为可供在电子设备上查看的内容（文本、图形和图像），这些设备包括智能手机、平板电脑、智能电视、计算机以及任何其他能够显示供人类消费的内容的电子设备。\n\
  \n如今我们熟悉的电子内容涵盖了网页、杂志、文章、书籍、宣传册、简报、手册等，一直到单页项目，如贺卡和邀请函。\n\n## 1.2 理解文件格式\n\n要了解数字出版中使用的文件类型，我们还需要知道哪些设备会显示我们的内容。这两者紧密相连，很难分开讨论。为了清晰起见，请查看表\
  \ 1-1。\n\n表 1-1. 文件格式与显示设备\n\n| 文件格式 | 文件类型 | 显示设备 |\n| --- | --- | --- |\n| HTML\
  \ | `.html`、文本 | 台式机、手机、平板电脑 |\n| EPUB（流式布局） | `.epub`、`.mobi`* | 电子阅读器、台式机、手机、平板电脑\
  \ |\n| EPUB（固定布局） | `.epub`、`.kf8` | 电子阅读器、台式机、手机、平板电脑 |\n| PDF（交互式与静态） | `.pdf`\
  \ | 台式机、手机、平板电脑 |\n| Adobe Publish Online | HTML、Adobe 专有格式** | 台式机、手机、平板电脑 |\n\n\
  \\* `MOBI` 是 Amazon Kindle 用于在 Kindle 阅读器上查看 EPUB 的格式。** 此处列出 Adobe 专有格式是因为 Publish\
  \ Online 的内容会上传到 Adobe 的服务器，你无法访问最终文件。\n\n## 1.3 熟悉显示设备\n\n用于显示内容的软件和/或设备有多种选择。你可以在台式机或笔记本电脑上查看内容以测试效果，并相对确信内容能在特定设备上正确显示。在某些情况下，你可以将设备连接到计算机，并直接在特定设备上查看内容。\n\
  \n### 1.3.1 在桌面应用程序中预览内容\n\n你可以将多种不同的查看应用程序下载到计算机上，用于预览你的作品。我强烈建议在上传任何内容到内容提供商之前进行此操作。\n\
  \n可供选择的选项包括：\n\n*   **HTML**：我们大多数人都熟悉网页浏览应用程序，如 MS Edge、Internet Explorer、Firefox、Safari、Google\
  \ Chrome 等。这些应用程序用于查看网页。对于某些 EPUB 工作，你可能希望安装 Google Chrome，因为 Chrome 可以借助免费的 Readium\
  \ 应用程序（用于 Google Chrome）来预览 EPUB 文档。\n*   **EPUB**：EPUB3 文档有两种类型：流式布局和固定布局。流式 EPUB\
  \ 用于支持字号更改和文本（有时也包括图像）随字号增大或减小而重排的电子阅读器。固定布局 EPUB 类似于 PDF 文档，提供完整的所见即所得视图。用于桌面预览\
  \ EPUB 的应用程序包括 Adobe Digital Editions（4.0 及以上版本），如图 1-1 所示，以及 Apple iBooks 和 Readium（从\
  \ Google Chrome 启动）。此外，还有适用于 iOS 和 Android 设备的各种电子阅读器。\n\n    ![A432409_1_En_1_Fig1_HTML.jpg](img/A432409_1_En_1_Fig1_HTML.jpg)\n\
  \n    图 1-1. 在 Adobe Digital Editions 中显示的电子书\n\n> **注**  \n> EPUB 市场在不断变化。更多的电子阅读器正在被推出，支持\
  \ EPUB 创建的应用程序也不断发布。如果你在 EPUB 出版方面是认真的，请定期搜索互联网，寻找能帮助你开发和展示作品的新产品。\n\n*   **MOBI**：Kindle\
  \ EPUB 需要不同类型的阅读器。你可以从 Amazon 下载 Kindle Preview 并安装到计算机上。Kindle Previewer 会按 Kindle\
  \ 设备上的显示效果来展示你的 EPUB。\n*   **PDF**：桌面查看器包括 Adobe Reader、Adobe Acrobat 以及 Mac 上的\
  \ Preview，此外还有各种第三方应用程序。在智能手机和平板电脑上，查看 PDF 也有很多选择。某些应用程序提供添加评论注释、填写表单、支持 EPUB 以及支持多媒体查看等功能。Adobe\
  \ 发布了免费的 Adobe Reader 用于查看 PDF 文档。其他应用程序要么免费，要么以象征性费用出售。\n\n\n\n### 1.3.2 在计算机上获取\
  \ EPUB 内容\n\n作为数字出版工作流程的第一步，你需要获取必要的工具，以便在计算机及/或设备上预览 EPUB。我推荐的工具包括：\n\n-   **Kindle\
  \ Previewer**：在 [`http://www.amazon.com/gp/feature.html?docId=1000765261`](http://www.amazon.com/gp/feature.html?docId=1000765261)\
  \ 为 Mac 或 Windows 系统下载 `Kindle Previewer` 应用程序。\n-   **Apple iBooks**：遗憾的是，`iBooks`\
  \ 仅适用于 Mac 系统，并且无法在 Windows 上模拟 `iBooks` 阅读器。对于 Mac 用户，你可以使用 `iTunes` 并通过 USB 线将\
  \ iPad 连接到电脑，直接在设备上预览内容。但是，如果你的书库中有大量图书，则需要等待 iPad 与 `iTunes` 同步完成。一个更简单的方法是使用 `Dropbox`。你可以将\
  \ EPUB 上传到 `Dropbox`，然后在 Windows、Android 设备和 iPad 上访问电子书。请访问 `Dropbox.com` 并为你的设备下载相应版本。\n\
  -   **Kobo 阅读器**：`Kobo` 是当今增长最快的电子阅读器之一。你可以从 [`https://www.kobo.com/desktop`](https://www.kobo.com/desktop)\
  \ 下载适用于 `Kobo` 的桌面阅读器。\n-   **Android File Transfer**：你可以使用 `Android File Transfer`\
  \ 工具为 Android 设备传输文件，该工具可在 [`http://android-file-manager.en.softonic.com`](http://android-file-manager.en.softonic.com)\
  \ 找到。\n-   **Adobe Digital Editions**：`ADE` 4.0 及以上版本现在支持 EPUB 3 格式，可用于预览可重排和固定版式\
  \ EPUB。`ADE` 适用于 Windows 和 Macintosh 系统。你可以从 [`http://www.adobe.com/solutions/ebook/digital-editions/download.html`](http://www.adobe.com/solutions/ebook/digital-editions/download.html)\
  \ 免费下载此应用程序。\n-   **Readium**：`Readium` 是 `Google Chrome` 浏览器的一个插件。请从 [`https://support.google.com/chrome/answer/95346?hl=en`](https://support.google.com/chrome/answer/95346?hl=en)\
  \ 安装 `Google Chrome`。安装 Chrome 后，访问 Chrome 网上应用店 [`https://chrome.google.com/webstore/category/apps`](https://chrome.google.com/webstore/category/apps)\
  \ 并搜索 `Readium`，然后下载并安装该插件。\n\n### 1.3.3 在电子阅读设备上预览 EPUB 内容\n\n桌面预览应用程序通常运行良好；然而，它们并非完美无缺，使用桌面应用程序时可能无法获得文档的精确视图。通常，你会使用桌面应用程序来预览在\
  \ InDesign 文件中所做的编辑，然后在设备上预览整个出版物。你可能拥有的设备包括：\n\n-   **Apple iPad**：你可以通过 USB 线将\
  \ iPad 直接连接到电脑，在 `iTunes` 中拖放 EPUB 文件进行预览（见图 1-2），或者使用 `Dropbox` 上传 EPUB 文件并下载到你的\
  \ iPad 上。\n\n    ![A432409_1_En_1_Fig2_HTML.jpg](img/A432409_1_En_1_Fig2_HTML.jpg)\n\
  \n    图 1-2. 通过 `Dropbox` 下载后在 iPad 上显示的 EPUB\n\n-   **Kobo 阅读器**：你可以将 Kobo 阅读器连接到电脑，通过\
  \ USB 线直接在 Kobo 上预览 EPUB。如果你没有 Kobo 阅读器，可以使用 `Kobo Desktop Reader`（见图 1-3）。\n\n\
  \    ![A432409_1_En_1_Fig3_HTML.jpg](img/A432409_1_En_1_Fig3_HTML.jpg)\n\n    图\
  \ 1-3. 在 `Kobo Desktop Reader` 上显示的 EPUB\n\n-   **Kindle**：你可以将 EPUB 转换为 Kindle\
  \ 的 `.mobi` 格式，然后使用 `Kindle Previewer` 预览这个 Mobi 格式的文件。遗憾的是，在将最终文件提交给亚马逊之前，你无法将\
  \ Kindle 阅读器连接到电脑直接在设备上预览。要将 EPUB 转换为 MOBI，你可以使用 `KindleGen`，该工具可在 [`http://www.amazon.com/gp/feature.html?docId=1000765211`](http://www.amazon.com/gp/feature.html?docId=1000765211)\
  \ 从亚马逊免费下载。`KindleGen` 在 Mac 或 Windows 的命令行中运行。如需更方便的转换器，你可以从 Softonic 网站 [`http://ebook-converter.en.softonic.com`](http://ebook-converter.en.softonic.com)\
  \ 免费下载适用于 Windows 的 `eBook Converter`。对于 Macintosh 版本，请访问 [`http://ebook-converter-mac.en.softonic.com/mac/download?ex=SWH-1608.6`](http://ebook-converter-mac.en.softonic.com/mac/download?ex=SWH-1608.6)。此转换器允许你将文档转换为\
  \ MOBI 格式，同时也支持将 PDF 文档转换为 MOBI 格式。\n-   **Barnes & Noble Nook**：将你的 Nook 平板电脑连接到电脑，找到文件夹（Mac\
  \ 的 Finder 或 Windows 的资源管理器）：`My Nook > My Files > Books`。将一个 EPUB 文件拖放到该文件夹中，即可在设备上查看。\n\
  \n几乎所有设备都允许你在将出版物提交给在线平台之前，先在计算机上进行预览。\n\n## 1.4 为什么选择 InDesign？\n\n本书的主要内容是在 Adobe\
  \ InDesign 中进行设计创作。我们选择 InDesign 而非其他应用程序的原因在于，InDesign 提供了众多工具，使你能够创建动态且引人入胜的文档。使用\
  \ InDesign 可以做到的事情包括：\n\n-   **添加动画**：动画在固定版式 EPUB、仅桌面计算机可用的交互式 PDF 文件（有一些变通方法）和\
  \ Adobe Publish Online 中均受支持。我将在第 8 章中讨论如何创建 InDesign 动画。\n-   **使用多状态对象**：你可以使用多状态对象（MSO）制作幻灯片，按钮事件在固定版式\
  \ EPUB、交互式 PDF（仅桌面计算机，有变通方法）和 Adobe Publish Online 中受支持。我在第 9 章中涵盖了所有你需要了解的关于 MSO\
  \ 的知识。\n-   **包含富媒体**：音频和视频文件在可重排 EPUB、固定版式 EPUB、PDF 文件（有一些限制）和 Adobe Publish Online\
  \ 中均受支持。请查看第 10 章，了解如何在你的出版物中包含视频和声音。\n-   **创建交叉引用和超链接**：在所有格式中都受支持。第 7 章涵盖了超链接和交叉引用。\n\
  -   **组织内容流**：借助 InDesign 的“文章”面板，你可以确保在可重排 EPUB 中，对象和文本框完全按照你期望的顺序显示。\n-   **使用样式**：InDesign\
  \ 支持样式表（这对创建任何 EPUB 都至关重要），不仅支持字符样式和段落样式，还支持表格样式和单元格样式。\n-   **直接导出为 EPUB3**：InDesign\
  \ CC 2015 及更高版本支持将可重排和固定版式 EPUB 导出为 EPUB3 格式。\n\nInDesign 还为你提供了更多工具和命令。你拥有绝佳的机会来使用“对象导出选项”、使用\
  \ HTML 标签标记样式、使用图层（对复杂页面至关重要）、应用特殊效果以及从各种来源导入资源。\n\nAdobe InDesign 是一个出色的程序，它为你提供了庞大的工具集，用于创建几乎任何类型的数字出版文档。\n\
  \n## 1.5 设置 EPUB 工作流程\n\nEPUB 内容提供商制定了详尽的指南，你需要在上传内容之前遵循这些指南。你需要了解特定平台是否支持富媒体、首字下沉、图像和对象的投影、封面图片是作为单独文件还是包含在出版物内、目录的结构等等。\n\
  \n对于 EPUB，你的工作流程比发布 PDF 文档和使用 Adobe Publish Online (APO) 时要复杂得多。对于 PDF 和 APO，你可以预览作品，无需进行验证。通常所见即所得，如果在你的计算机上看起来不错，通常就可以将文件上传给内容提供商。但对于\
  \ EPUB，你还需要几个额外的步骤，如图 1-4 所示。\n\n![A432409_1_En_1_Fig4_HTML.jpg](img/A432409_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4. 典型的 EPUB 开发工作流程\n\n让我们更详细地了解每个步骤：\n\n\n\n*   **研究：** 如果你打算在 Apple、Amazon\
  \ 或其他内容提供商上分发 EPUB，这些提供商通常会有你需要遵循的指南。对于 Apple 的 iBooks，截至撰写本文时，Apple Asset Guide\
  \ 5.1 修订版 2 文档以 PDF 文件形式托管在 [`https://itunesconnect.apple.com/docs/iBooksAssetGuide5.1Revision2.pdf`](https://itunesconnect.apple.com/docs/iBooksAssetGuide5.1Revision2.pdf)。对于\
  \ Kindle 图书，截至撰写本文时，Amazon Kindle 出版指南 2015.2 版可从 [`http://kindlegen.s3.amazonaws.com/AmazonKindlePublishingGuidelines.pdf`](http://kindlegen.s3.amazonaws.com/AmazonKindlePublishingGuidelines.pdf)\
  \ 下载。Kobo 用户指南可从 [`http://download.kobobooks.com/writinglife/en-US/KWL-User-Guide.pdf`](http://download.kobobooks.com/writinglife/en-US/KWL-User-Guide.pdf)\
  \ 下载。对于 Barnes & Noble Nook，你可以登录 Nook Press 网站 [`https://www.nookpress.com/ebooks`](https://www.nookpress.com/ebooks)\
  \ 查找更多信息。关于 Sony eReader 指南，请查阅 [`https://docs.sony.com/release/PRST2.pdf`](https://docs.sony.com/release/PRST2.pdf)。Smashwords\
  \ 风格指南可从 [`https://www.smashwords.com/books/view/52`](https://www.smashwords.com/books/view/52)\
  \ 下载。对于 ISSUU，你可以在 [`http://help.issuu.com/hc/en-us/articles/204816098-How-to-upload-and-publish-on-issuu`](http://help.issuu.com/hc/en-us/articles/204816098-How-to-upload-and-publish-on-issuu)\
  \ 找到视频和指南。网上还有许多其他文档可以帮助你了解更多关于电子书出版的信息。你可以找到操作指南、格式指南、自助出版指南等等，只需在网上搜索出版指南即可。与其查阅众多不同的内容托管平台，不如将范围缩小到最受欢迎的两个。最大的两个分销商是\
  \ Amazon Kindle 和 Apple iBooks。如果你刚开始涉足电子书出版，请在开始在 InDesign 中排版文档之前，仔细阅读 Apple 和\
  \ Kindle 的指南。\n\n*   **创建文档：** 当你熟悉了所选出版商的出版指南后，就可以开始创建文档了。这个过程需要在预览内容和编辑文档之间反复切换。你通常会在一页上工作，将其导出为\
  \ EPUB，然后返回 InDesign 进行编辑。了解电子书的构成非常重要。EPUB 文档就像一个包含在压缩文件中的完整网站。有一些工具可以用来解压文件，打开\
  \ HTML 和 CSS 文档，并对 HTML 进行一些修改。我将在第 12 章介绍编辑 HTML 和 CSS 的内容。如果你不是程序员或不熟悉编写代码，现在不必担心。我们只会介绍一些简单的步骤来对文档进行修改。\n\
  \n*   **导出为 EPUB：** 使用 InDesign CC，你有两种导出 EPUB 的选择：可重排文本和固定布局。使用 `文件 ➤ 导出` 菜单中的导出选项（如图\
  \ 1-5 所示），选择你想要分发的 EPUB 类型。你需要检查导出窗口各个面板中的所有选项，以创建最终的文档。\n\n    ![A432409_1_En_1_Fig5_HTML.jpg](img/A432409_1_En_1_Fig5_HTML.jpg)\n\
  \n    *图 1-5.* InDesign 导出选项\n\n*   **预览 EPUB：** 在你打算使用的所有设备的桌面应用程序中进行预览。\n\n* \
  \  **在设备上预览：** 连接 iPad、Android 平板电脑、Kobo 阅读器或任何其他允许预览作品的设备。\n\n*   **验证你的 EPUB：**\
  \ 从 InDesign 导出时会进行一些验证。为确保你的 EPUB 有效，最后请使用验证检查器或验证服务来验证你的文档。你可以从 [`https://github.com/IDPF/epubcheck`](https://github.com/IDPF/epubcheck)\
  \ 下载一个 EPUB 检查器，它通过命令行运行。如果你想要更简单的解决方案，可以看看这里列出的几个。国际数字出版论坛 (IDPF) 托管了一个网站，你可以在该网站上上传\
  \ EPUB 进行验证。请访问 [`http://validator.idpf.org`](http://validator.idpf.org)。Sigil 是一个桌面应用程序，可以让你编辑\
  \ HTML 和 CSS 代码，它也可以验证 EPUB。你可以从 [`http://sigil.en.softonic.com`](http://sigil.en.softonic.com)\
  \ 下载免费的 Windows 和 Mac 版本。Mac 用户可以免费下载 AppleScript ePubCheck，网址为 [`https://code.google.com/p/epub-applescripts/downloads/detail?name=ePubCheck_3.0b5.zip&can=2&q`](https://code.google.com/p/epub-applescripts/downloads/detail%3Fname=ePubCheck_3.0b5.zip%26can=2%26q)``=``。只需将你的\
  \ EPUB 文件拖放到此脚本上即可。一个用于编辑 HTML 和验证 EPUB 的价格较高的应用程序是 Oxygen。如果你愿意花 200 美元或更多购买其中一个\
  \ Oxygen 应用程序，请访问 [`http://www.oxygenxml.com/download.html`](http://www.oxygenxml.com/download.html)。\n\
  \n*   **上传到内容提供商：** 发布作品的最后一步是将你的文档上传到内容提供商。这一步的前提是你已经在该提供商处注册了账户，提供了所有必要的标识符和付款信息，并且为要求提供\
  \ ISBN 的提供商获取了 ISBN 号码。\n\n## 1.6 本章小结\n\n本章介绍了 EPUB、EPUB 格式以及在各种阅读设备上查看 EPUB 的基本知识。一旦你确定了最终产品的目标设备，开始开发过程就会容易得多。\n\
  \n至此，你已经准备好了解如何排版文档以便在各种设备上查看。当然，选择的程序是 Adobe InDesign，我们将从了解一些与在 Adobe InDesign\
  \ 中工作的基础知识开始，踏上 EPUB 创作的旅程。\n\n"
- "# 第二章 开始使用 InDesign\n\n有些读者可能是 InDesign 的新手，因此我将用本章简要介绍 InDesign 中一些有助于你快速上手的重要功能。这只是对你在程序中创建设计所需了解的一些工具和命令的概述。\n\
  \n如果你打算处理 EPUB、动画、交互式元素，并将你的 InDesign 文件导出为 EPUB、交互式 PDF，或使用 Adobe Publish Online（预览版），你绝对希望个性化设置\
  \ InDesign，以便根据你从事的工作类型来配置工具、菜单、面板和首选项。\n\n在本章中，我将讨论如何创建自定义工作区、修改首选项和键盘快捷键、创建模板以及自定义预设，以根据一般需求个性化工作环境。我的建议可能包含也可能不包含你特定工作所需的所有选项，但我提供了一个起点。在阅读本章时，请随意修改一些设置。\n\
  \n我还介绍了一些使用重要功能（如使用字体、主页、创建网格）的基础知识，以及你需要了解的在 InDesign 中导入素材的知识。本书篇幅有限，无法详尽解释如何使用\
  \ InDesign 提供的所有功能。如果你想了解更多关于使用 InDesign 的信息，我建议你查阅 Wiley 出版社出版的《Adobe InDesign\
  \ CS 达人迷》或《Adobe InDesign CS 圣经》。\n\n## 2.1 设置数字出版工作区\n\n你对工作区面板位置和键盘快捷键所做的所有更改都可以保存为自定义工作区。当你启动\
  \ InDesign 并选择一个工作区时，你为自定义工作环境所做的所有设置都会恢复为之前保存的设置。如果你移动了面板并弄乱了工作区，你可以轻松地将其恢复为原始的保存设置。当你查看可供选择的各种工作区选项时，你会多次保存设置并覆盖已保存的工作区设置，以创建最终的工作区。\n\
  \n\n\n### 2.1.1 定位工作区选项\n\n打开 InDesign，观察窗口右上角。默认情况下，您可能会看到 `Essentials`（基本功能）字样并带有一个向下箭头，如图\
  \ 2-1 所示。如果您的 InDesign 窗口中没有工作区选项，则说明应用程序栏未显示（仅限 Mac）。请选择 `Window ➤ Application\
  \ Bar`（窗口 ➤ 应用程序栏），工作区菜单便会显示。点击箭头打开菜单，您会发现 Adobe 为您提供的几个工作区。请注意，菜单中还有 `New Workspace`（新建工作区）和\
  \ `Delete Workspace`（删除工作区）选项。稍后我将介绍这些功能。现在，您只需了解菜单中有哪些工作区和选项即可。\n\n![A432409_1_En_2_Fig1_HTML.jpg](img/A432409_1_En_2_Fig1_HTML.jpg)\n\
  \n图 2-1.\n\n点击 `Essentials`（基本功能）旁的向下箭头，打开工作区菜单\n\n### 2.1.2 整理面板\n\n要开始为数字出版创建个性化工作区，请注意\
  \ Adobe 已为您提供了 `Digital Publishing`（数字出版）工作区。然而，本书中将用到的所有面板并非都包含在 `Digital Publishing`（数字出版）工作区中。您需要从某个起点开始，因此请在工作区菜单中选择\
  \ `Digital Publishing`（数字出版）。这将为您提供一个绝佳的起点。\n\n当您选择一个工作区时，首先看到的界面变化是 InDesign 窗口右侧的面板。稍后我们将添加一些面板。现在，您需要了解的是，可以通过将面板从“面板停靠区”拖出，使其脱离停靠区。点击\
  \ `Liquid Layout`（版面调整）并将其从面板停靠区拖出，如图 2-2 所示。它将成为浮动面板，您可以在 InDesign 窗口中移动它。使用浮动面板有助于您在创建文档时处理某些特定项目。就我们目前的目的而言，我们只需点击面板右上角（Windows）或左上角（Macintosh）的\
  \ `X` 按钮将其关闭。\n\n![A432409_1_En_2_Fig2_HTML.jpg](img/A432409_1_En_2_Fig2_HTML.jpg)\n\
  \n图 2-2.\n\n点击浮动面板中的 `X` 按钮以关闭面板\n\n当您希望重新调整用于打印的文档，并更改设计以适应 EPUB 或“在线发布”时，`Liquid\
  \ Layout`（版面调整）选项会很有帮助。但对于您其余的工作，它用处不大。\n\n您可以打开面板以显示面板图标和面板名称。默认情况下，交互式面板会显示图标和面板名称。要显示面板停靠区右侧的面板名称，请将光标移到分隔线上并向左拖动。\n\
  \n另一个您不常用的面板是 `Preflight`（印前检查）面板。将其从面板停靠区移出并关闭。\n\n您可以通过点击面板并向上或向下拖动来重新排列面板列表。同样，如果面板有两列，您可以将面板从一个列表拖到另一个列表。当您将面板拖到新位置时，请注意面板名称上方出现的蓝色条。该蓝色条显示面板将要放置的位置。\n\
  \n### 2.1.3 向工作区添加面板\n\nInDesign 拥有大量面板，它们都列在 `Window`（窗口）菜单中，或作为独立项目，或嵌套在分组中。要打开一个面板，请选择\
  \ `Window ➤ <面板名称>`，例如，位于 `Window`（窗口）菜单顶部的 `Articles`（文章）面板（见图 2-3）。\n\n![A432409_1_En_2_Fig3_HTML.jpg](img/A432409_1_En_2_Fig3_HTML.jpg)\n\
  \n图 2-3.\n\n点击 `Window`（窗口）以打开 `Window`（窗口）菜单\n\n请注意，在图 2-4 中，`Articles`（文章）面板与另外两个面板捆绑在一起。要单独移除\
  \ `Articles`（文章）面板，请点击其名称并将其从捆绑组中拖出。将各个独立面板从嵌套组中拖出，以分离所有面板。然后将每个面板拖到面板停靠区。您可以通过在面板停靠区中向上或向下拖动，或在面板停靠区的各列之间拖动，随时按您喜欢的顺序整理面板。\n\
  \n![A432409_1_En_2_Fig4_HTML.jpg](img/A432409_1_En_2_Fig4_HTML.jpg)\n\n图 2-4.\n\n\
  `Articles`（文章）面板与另外两个面板捆绑在一起\n\n请注意，在 `Window`（窗口）菜单中，有几个窗格带有向右的尖括号，表示有子菜单，例如 `Type\
  \ and Tables`（文字和表格）菜单命令。当您将光标放在 `Type and Tables`（文字和表格）上时，会弹出一个子菜单，其选项从 `Character`（字符）开始，到子菜单底部的\
  \ `Table`（表格）结束。当您选择其中一项时，面板会以浮动面板的形式打开，您可以在 InDesign 工作区中移动它，或将其停靠在面板停靠区中。\n\n\
  现在，您应该已经了解如何访问面板并将其移动到面板停靠区了。在图 2-5 中，您可以看到我建议用于创建自定义工作区（您可能用于 EPUB 和数字出版文档）的面板。这些面板包括：\n\
  \n\n\n*   **文章**：如果你从 InDesign 导出可重排 EPUB 并选择布局顺序，所有图像通常会出现在文档末尾。在 InDesign CS 5.5\
  \ 及“文章”面板引入之前，要让图像按照与设计类似的阅读顺序出现在文本段落之间是一项挑战。“文章”面板让这一过程变得容易许多，结合锚定对象（有关“文章”面板和锚定对象的更多信息，请参见第\
  \ 12 章），你可以轻松创建阅读顺序模拟布局的可重排 EPUB。\n*   **颜色**：“颜色”组包含几个你可能想添加到工作区的面板。其中包括：\n   \
  \ *   **色板**：“色板”面板使你能够将颜色应用于文本和对象。\n    *   **渐变**：这是个人选择。如果你的文档包含带有渐变的对象，请将该面板添加到面板停靠区。如果你不使用渐变，则不要添加。\n\
  \    *   **Adobe 颜色主题**：此面板可访问以前称为 Adobe Kuler 的功能。你可以创建各种调色板并将它们添加到“色板”面板。我将在本章后面的“创建调色板”部分介绍这一点。\n\
  *   **效果**：“效果”面板除其他功能外，使你能够对对象使用混合模式，并向文本和对象添加透明度。\n*   **交互**：“窗口”菜单中的“交互”菜单项包含用于创建交互式作品的面板，例如固定版式\
  \ EPUB、交互式 PDF 和 Adobe Publish Online (预览)。将这些面板添加到你的工作区。其中包括：\n    *   **动画**：你可以通过多种方式为文本和对象设置动画，这些将在第\
  \ 8 章中介绍。动画可以在固定版式和 Adobe Publish Online 中查看。对于交互式 PDF，你需要一种变通方法，如我在第 14 章所述。\n\
  \    *   **书签**：在 EPUB 和交互式 PDF 中使用目录的替代方案时，书签会很有帮助。\n    *   **按钮和表单**：按钮用于在固定版式\
  \ EPUB、交互式 PDF 和 Adobe Publish Online 中触发事件。表单域仅用于 PDF 文档。\n*   **EPUB 交互性预览**：这是一个预览面板，允许你按页面和按文档预览\
  \ EPUB 布局以及动画。\n*   **超链接**：可以设置超链接以链接到 EPUB、交互式 PDF 和 Adobe Publish Online 中的页面、锚点和\
  \ URL。\n*   **媒体**：“媒体”面板用于预览视频和声音，并从视频内部或外部文档向视频添加海报图像。你还可以在页面加载时触发视频播放。\n*   **对象状态**：此面板用于多状态对象\
  \ (MSO)，可在固定版式 EPUB、交互式 PDF（仅在使用变通方法的台式计算机上）和 Adobe Publish Online 中查看。有关 MSO 的详细说明，请参见第\
  \ 10 章。\n*   **SWF 预览**：Adobe Flash SWF 文件现在不用于大多数交互式文档，但交互式 PDF 仍支持 SWF，iOS 设备除外。如果你的工作包含交互式\
  \ PDF，请将此面板添加到面板停靠区。\n*   **计时**：“计时”面板与“动画”面板结合使用。\n*   **图层**：对于你创建的任何类型的文档，使用图层都是必不可少的。当你使用动画和\
  \ MSO 时，“图层”面板是一大福音。\n*   **链接和页面**：这些面板对于任何设计都至关重要。“链接”面板可帮助你识别缺失的链接并更新链接。“页面”面板允许你从文档中添加/删除页面。\n\
  *   **对齐**：在“对象和布局”面板中，你会在子菜单中找到“对齐”。当你需要对齐和分布对象时，此面板很有用。它对于处理 MSO 尤其有帮助。\n*   **描边**：“描边”面板允许你更改线宽和样式。\n\
  *   **样式**：子菜单中出现许多不同的面板。你应该从列表中添加以下几个，包括：\n    *   **字符样式**：字符样式和段落样式对于创建 EPUB\
  \ 或你在 InDesign 中创建的任何其他文档都是必需的。对于 EPUB，你需要使用样式识别所有正文文本和显示类型。这些样式将导出到 HTML 和 CSS\
  \ 文件中，你可以在 HTML 编辑器中轻松进行编辑。\n    *   **段落样式**：原因与字符样式相同。你需要使用它们，尤其是对于 EPUB。\n  \
  \  *   **对象样式**：当你想要将效果应用于对象并将相同的效果设置匹配到其他对象时，对象样式将为你节省大量时间。\n    *   **单元格和表格样式**：如果你在文档中使用表格，则应创建单元格和表格样式。\n\
  *   **文本绕排**：“文本绕排”面板允许你使文本围绕对象排列并设置偏移距离。\n*   **工具**：“工具”面板显示 InDesign 窗口左侧的各个工具。此面板对于所有文档都是必不可少的。\n\
  *   **应用程序框架 (仅限 Mac)**：对于 Macintosh 用户，你可能想要选择“应用程序框架”。“应用程序框架”可消除桌面上任何分散注意力的背景。在\
  \ Windows 上启动 InDesign 时，默认情况下始终使用“应用程序框架”。\n\n![A432409_1_En_2_Fig5_HTML.jpg](img/A432409_1_En_2_Fig5_HTML.jpg)\n\
  \n**图 2-5.** 为获得最佳交互式文档开发工作流程而组织的面板\n\n### 2.1.4 保存新工作区\n\n鉴于你可能需要进行一些需要修改自定义工作区的其他调整，一旦设置好面板，就应该保存该工作区。打开“工作区”菜单，然后选择“新建工作区”。在打开的对话框中，为工作区提供一个名称。在此示例中，由于“数字出版物”已经是一个工作区，我们将新的自定义工作区称为\
  \ `EPUB`。在“名称”文本字段中键入名称，然后单击“确定”。默认情况下，面板位置会随工作区一起保存。\n\n在工作会话期间，你可能会将面板移出面板停靠区，并将它们排列在\
  \ InDesign 窗口周围。如果要返回到已保存的工作区，请打开“工作区”菜单并选择“重置 [工作区名称]”，其中工作区名称是你保存工作区时使用的名称。\n\n\
  如果你对工作区进行了其他调整，请使用相同的菜单命令。没有更新工作区的选项，因此你需要选择“新建工作区”并键入相同的名称以覆盖上次保存的工作区。\n\n## 2.3\
  \ 修改键盘快捷键\n\n键盘快捷键是指当你按下修饰键与某个按键组合时应用于某个编辑操作的快捷键。例如，按 `Ctrl/⌘+N` 会打开新建文档窗口。许多默认键盘快捷键非常适合你的设计创作。不过，你可能希望在自定义键盘快捷键列表中更改其中一些快捷键。\n\
  \n要打开“键盘快捷键”，请选择**编辑** ➤ **键盘快捷键**。“键盘快捷键”窗口将打开，如图 2-9 所示。\n\n![A432409_1_En_2_Fig9_HTML.jpg](img/A432409_1_En_2_Fig9_HTML.jpg)\n\
  \n**图 2-9.**“键盘快捷键”窗口显示所有默认快捷键\n\n要创建新列表，请单击窗口右侧的**新建集**按钮。为你的自定义键盘快捷键提供一个名称，然后单击“确定”。此操作仅复制默认设置，但你可以在新集中删除或添加快捷键。\n\
  \n在窗口顶部，有一个“产品区域”菜单。打开菜单，你将找到顶级菜单、面板菜单、工具、脚本以及其他各种可以添加或更改键盘快捷键的区域列表。\n\n\n\n###\
  \ 2.3.1 重新设置粘贴快捷键\n\n从列表中选择`编辑`菜单，向下滚动到`粘贴`选项。点击`粘贴`，然后在`当前快捷键`列表中选择`Ctrl/⌘+V`命令并点击`移除`按钮将其删除。我们将把`粘贴`（将剪贴板中的任意对象粘贴到文档中心）替换为`原位粘贴`，后者会将复制的内容直接粘贴到原对象的上方。你会发现这个快捷键比`粘贴`更常用，尤其是在处理多状态对象时。\n\
  \n删除`粘贴`后，点击列表中的`原位粘贴`并按下`Ctrl/⌘+V`。旧快捷键仍会保留在`当前快捷键`列表中，因此请点击该旧快捷键（`Ctrl/Alt+V`\
  \ 或 `⌘/⌥+V`）并点击`移除`按钮。完成这些步骤后，你的窗口应如图 2-10 所示。\n\n![A432409_1_En_2_Fig10_HTML.jpg](img/A432409_1_En_2_Fig10_HTML.jpg)\n\
  \n**图 2-10.** 为菜单命令`原位粘贴`添加了自定义快捷键\n\n**注意：** 当你对面板视图进行更改后，需要重新保存工作区，以便为窗口调整捕获新的尺寸。\n\
  \n我在此提供了一些我常用的快捷键。你可以根据自己的工作内容选择并修改更多快捷键。不必一次性修改大量快捷键，而是从少数几个容易记住的快捷键开始；之后你可以返回`键盘快捷键`窗口，对你的自定义设置进行补充编辑。\n\
  \n### 2.3.2 为表格单元格中的制表符添加快捷键（仅限 Windows）\n\n如果你经常处理表格，你会希望在不使用菜单命令的情况下快速在表格中移动。当你在表格中按下`Tab`键时，光标会移动到下一个单元格。在\
  \ Macintosh 系统中，如果要在单元格内插入制表符，你需要按`Option+Tab`。在 Windows 系统中，如果按`Alt+Tab`，则会触发系统应用切换器。\n\
  \n在 InDesign 中，通过菜单命令在单元格内插入制表符的方法是：选择`文字` > `插入特殊字符` > `制表符`。\n\n要为在表格单元格内插入制表符添加键盘快捷键，可以在`键盘快捷键`对话框的`产品区域`中打开`文字菜单`，向下滚动到`插入特殊字符:\
  \ 其他: 制表符`。使用类似`Alt+F1`（功能键）或你希望使用的任意功能键。如果你经常需要在表格单元格内插入制表符，一个键盘快捷键将有助于加快你的工作速度。\n\
  \n## 2.4 创建新建文档预设\n\n当你选择`文件` > `新建文档`时，默认设置为创建用于印刷的文档——这在我们创建数字出版物时几乎不相关。你可以更改默认设置，也可以在`新建文档`窗口中添加自定义预设。\n\
  \n按`Ctrl/⌘+N`打开`新建文档`窗口。从`用途`菜单中选择`移动设备`。在`页面大小`中，你可以选择 iPad、Kindle Fire 或 Android\
  \ 的尺寸，或设置自定义页面大小。就本教程而言，我们选择 iPad 作为尺寸。点击`横向`或`纵向`选择`方向`。在`边距`中，点击`锁形`图标以解锁四个调整项。将上、左、右边距设为\
  \ 44 磅，下边距设为 88 磅。对于 iPad 上的文档来说，这种尺寸的边距会很合适，能让内容避开滚动条。取消勾选`主要文本框架`（见图 2-11）。\n\n\
  ![A432409_1_En_2_Fig11_HTML.jpg](img/A432409_1_En_2_Fig11_HTML.jpg)\n\n**图 2-11.**\
  \ iPad 的自定义设置\n\n**注意：** 图 2-11 是 InDesign CC 2017 的截图。如果你使用的是早期版本的 InDesign，请从`用途`菜单中选择`数字出版`。\n\
  \n此时，你可以将这些设置指定为新的默认设置。每次打开`新建文档`时，默认值都将是你在此处应用的设置。如果你有几种不同类型的出版物，你可能不希望将这些设置设为新的默认值，但你可能需要时常调取这些设置。\n\
  \n点击`文档预设`菜单旁边的`存储预设`按钮。当窗口打开时，你可以输入`[默认]`，使新设置成为新建文档的默认选择。点击`确定`，会弹出一个警告对话框，提示该名称已存在。点击`是`覆盖之前的默认设置。\n\
  \n**提示：** 如果你想使用默认的新建文档并跳过`新建文档`窗口，请按`Ctrl+Alt+N`（Windows）或`⌘+Option+N`（Macintosh）。\n\
  \n如果你想创建一个新的预设，请在`存储预设`对话框中提供一个名称，然后点击`确定`。\n\n## 2.5 创建调色板\n\n设计师们深知为新的项目创建调色板的重要性，但有些读者可能是想出版自己电子书的作者，并没有设计背景。因此，我想简要介绍一些在设计项目中创建调色板和使用字体时的重要设计技巧。\n\
  \n\n\n### 2.5.1 创建调色板\n\n您拥有一个绝佳的机会，可以利用 `InDesign` 创建由各种色调、互补色、类似色、三元色、粉彩等颜色组成的调色板。我在此不深入讨论色彩理论。只想为您指明一条追随资深设计师和著名艺术家的方向。\n\
  \n在 `InDesign` 中，打开 `Adobe 颜色主题面板`。如果工作区没有显示`颜色主题面板`，请选择 `窗口 ➤ 颜色 ➤ 颜色主题`。对于使用 Creative\
  \ Cloud 应用程序之前旧版 Adobe 软件的用户，此面板曾被称为 `Adobe Kuler`。\n\n面板中有三个选项卡，如图 2-12 所示。第一个选项卡是\
  \ `创建`。在此，您可以根据从显示`类似色`的菜单中选择的多个选项来创建颜色。打开菜单，从列出的颜色关系中选择一项。移动滑块选择一种色相，您将看到一组五种颜色。您可以点击颜色光谱上方的圆圈并移动它们来调整鲜艳度和饱和度。确定一组颜色后，您可以在面板底部输入名称并点击\
  \ `保存`，将这些颜色添加到`色板面板`中。此时会弹出`保存到库`对话框。选择一个库或创建一个`新库`，然后点击`保存`。要访问这些颜色，请点击`我的主题`选项卡。\n\
  \n![A432409_1_En_2_Fig12_HTML.jpg](img/A432409_1_En_2_Fig12_HTML.jpg)\n\n**图 2-12.**\
  \ `颜色主题面板`中的`创建`选项卡，让您能够创建自定义颜色集。\n\n> **注意：** 您必须拥有 Adobe ID 才能保存颜色色板。如果没有 Adobe\
  \ ID，请登录 [`www.adobe.com`](http://www.adobe.com) 并点击`登录`按钮。页面切换后，点击`获取 Adobe ID`。此\
  \ ID 让您能使用许多 Adobe 服务，并且对于您在创建数字出版文档时的工作至关重要。\n\n您可能希望将库中的色板添加到`InDesign 色板面板`中。要将颜色组添加到`色板面板`，请从`我的主题面板`中打开一个库，滚动窗口以定位要添加到色板的颜色。将光标置于`操作`上，会弹出一个菜单。在弹出的菜单中点击`添加到色板`，这些颜色即被添加到`色板面板`中的一个新文件夹中。\n\
  \n`颜色主题`真正酷的地方在于`探索`选项卡。在此，您可以搜索各种不同的选项。您可能想要一个大地色调或天空色调的调色板。只需在`搜索`字段中输入文本，然后按\
  \ `Enter/Return` 键。通常，您会看到一长串搜索结果。\n\n我最喜欢的搜索项之一是搜索绘画大师。如果您想要一组鲜艳的颜色，可以搜索一些印象派艺术家的名字，例如\
  \ Monet 或 Van Gogh。如果您想要后印象派时期的风格，例如像塞尚使用的那种清晰结构搭配强烈鲜艳的颜色，只需在`探索`选项卡的搜索文本框中输入 `Cezanne`。按\
  \ `Enter/Return` 键后，系统会返回一个列表，您可以从中将各种颜色集添加到`InDesign 色板面板`中。在图 2-13 中，您可以看到搜索 `Cezanne`\
  \ 的结果。如果您想要更具当代感的风格，只需搜索当代艺术家即可。可能性是无穷无尽的。而且，在 `Adobe 颜色主题面板`中随意探索本身就乐趣无穷。\n\n![A432409_1_En_2_Fig13_HTML.jpg](img/A432409_1_En_2_Fig13_HTML.jpg)\n\
  \n**图 2-13.** 在`探索`选项卡中搜索 `Cezanne` 的结果。\n\n使用`颜色主题面板`不会让您成为色彩理论和运用的大师，但它是一个起点，尤其对没有设计背景的人来说非常有帮助。使用`颜色主题面板`的一个好处是，在\
  \ Adobe Photoshop 和 Adobe Illustrator 中也能找到相同的面板。如果您在这些应用程序中创建素材，可以轻松同步您的调色板。\n\n\
  ### 2.5.2 创建字体调色板\n\n如果您不是设计师，那么对字体以及在设计中选择何种字体有个基本了解将会大有裨益。互联网上有大量信息，介绍哪些字体搭配效果好，以及应避免哪些字体组合。在选择同一大型字体系列（例如\
  \ `Univers` 或 `Helvetica Neue`）中的多种字体时，通常比较安全。\n\n为出版物选择字体时，您可以考虑同一历史时期的字体、同一设计师的字体、具有相似字身高度的字体，在很多情况下，您也可以选择截然相反、对比强烈的字体。应该避免的是风格冲突，例如在同一作品中使用\
  \ `Eurostile` 和 `Cochin`。\n\n您应仔细考虑用于**正文**和**标题**的字体。您可以在互联网上搜索了解更多关于哪些字体搭配效果好的信息。如果要在设计作品中引入第三种字体，也许是像\
  \ `Rockwell` 或 `Museo Slab` 这样的粗衬线体，或是像 `Bickham Script` 这样的正式手写体，或像 `Zapfino` 这样的书法字体。\n\
  \n#### 2.5.2.1 使用正确的字体类型\n\n在创建可重排 EPUB 时，字体选择不那么重要，因为最终读者可以在其阅读设备上少数已安装的字体中进行选择。但所有其他类型的出版物确实需要您做出良好的字体选择。\n\
  \n在出版物中应使用的字体类型是 **TrueType** 和 **OpenType** 字体。请远离其他字体类型，因为在设备上查看文档时可能会遇到一些问题。\n\
  \n您还需要确保拥有在文档中嵌入字体的权利。这对于固定版式、交互式 PDF 和 Adobe Online 出版物非常重要。字体公司可能允许您在设计中使用的字体，但并未授予您嵌入该字体的许可。有关许可和嵌入字体的更多信息，请参见第\
  \ 13 章。\n\n\n\n### 2.5.2.2 使用 Adobe Typekit\n\n如果你是 Creative Cloud 用户（我建议任何严肃的文档开发者都订阅\
  \ Adobe Creative Cloud），你可以通过 Adobe Typekit 使用字体。Adobe Typekit 的字体可以嵌入到你的出版物中，并且对\
  \ Creative Cloud 用户免费使用。\n\n要访问 Typekit，请从控制面板打开 `字体` 菜单，然后点击 `从 Typekit 添加字体`（见图\
  \ 2-14）。\n\n![A432409_1_En_2_Fig14_HTML.jpg](img/A432409_1_En_2_Fig14_HTML.jpg)\n\
  \n图 2-14.\n\nAdobe 的 Typekit 网站让你能够从一个令人印象深刻的字体库中同步字体\n\n进入 Typekit 后，你可以按分类和属性搜索字体。点击右侧面板中的某个分类项目，查看字重、字宽、x\
  \ 高度、对比度等属性，然后点击你喜欢的字体属性。\n\n当你找到想要使用的字体时，将鼠标悬停在左侧面板中的该字体上。会弹出一个菜单，你可以点击 `使用字体`。点击\
  \ `使用字体` 后，会打开一个窗口，你可以在其中勾选该字体族中想要同步到电脑的字体。点击 `同步所选字体`，如图 2-15 所示。当字体同步到电脑完成后，会有一个消息窗口通知你字体已准备就绪。\n\
  \n![A432409_1_En_2_Fig15_HTML.jpg](img/A432409_1_En_2_Fig15_HTML.jpg)\n\n图 2-15.\n\
  \n点击 `同步所选字体` 将字体同步到你的电脑\n\n注意\n\n你必须拥有有效的互联网连接才能将 Typekit 字体同步到电脑，并且必须每 30 天连接一次互联网以维持你的\
  \ CC 许可证。\n\n回到 InDesign，当你打开 `字体` 菜单时，你会看到菜单左上角的 `筛选`，旁边有两个图标。选择一个字体，点击星形图标将其添加到“收藏列表”。`收藏列表`\
  \ 会出现在字体菜单的顶部。如果你安装了很多字体，`收藏列表` 可以避免你滚动长列表来查找字体。请注意，当你打开 `字体` 菜单时，你会看到一些实心星形和空心星形。当字体名称旁边出现实心星形时，表示该字体属于\
  \ `收藏列表`。如果你想从 `收藏列表` 中移除某个字体，点击该星形即可。当星形变为空心时，该字体便从 `收藏列表` 中移除（见图 2-16）。\n\n![A432409_1_En_2_Fig16_HTML.jpg](img/A432409_1_En_2_Fig16_HTML.jpg)\n\
  \n图 2-16.\n\n显示实心星形的字体属于菜单顶部的 `收藏列表`\n\n另一个图标用于筛选字体。你系统上安装的所有字体都会显示在字体列表中。点击 `筛选`\
  \ 图标，列表将只显示 Typekit 字体。当仅使用 Typekit 字体进行设计项目，并且需要在布局中切换字体时，这会使工作变得简单。\n\n## 2.6\
  \ 熟悉图层面板\n\n在处理复杂设计时，使用 `图层面板` 至关重要。如果你使用动画和嵌套的多状态对象，你可能需要隔离项目以使工作更容易。在你的设计工作中，只需要了解关于使用图层的几个要点。\n\
  \n### 2.6.1 命名图层\n\n当你创建新图层时，为每个图层命名非常重要。提供一个描述性的名称，以便你能轻松找到与内容关联的图层。要创建新图层，请按住\
  \ `Alt/⌥` 键并点击 `图层面板` 底部的新建图层图标。这将打开 `新建图层` 窗口，你可以在创建图层时添加名称。\n\n### 2.6.2 选择图层上的对象\n\
  \n当图层上有对象并且你想要选择一个项目时，请使用 `图层面板`。打开任何嵌套的组，然后点击一个对象或文本。要选择该对象，请点击图层名称右侧的方块。如果你想选择多个对象，请按住\
  \ `Shift` 或 `Ctrl/⌘` 键点击，分别用于连续和非连续选择。\n\n### 2.6.3 在图层间移动对象\n\n如果你想把一个对象从一个图层移动到另一个图层，请打开\
  \ `图层面板`，点击对象名称右侧的方块图标，并将其拖到目标图层。当你添加新对象时，该对象会出现在活动图层上（在 `图层面板` 中选中的图层）。如果你不小心在选中的图层上创建了一个对象，而你想把它放到其他图层上，只需在\
  \ `图层面板` 中将该方块拖到目标图层即可。\n\n### 2.6.4 粘贴对象\n\n通常情况下，当你复制一个项目并想将其粘贴到文档中时，你会希望将其粘贴到复制该项目的原始图层上。要在同一图层上粘贴，请打开\
  \ `图层面板` 菜单并选择 `粘贴时记住图层`。\n\n### 2.6.5 隐藏和锁定图层\n\n如果你的设计很复杂，隐藏某个图层或锁定某个图层以确保额外的内容不会被添加到不需要的图层上，可能会更容易。在\
  \ `图层面板` 中，要隐藏图层，请点击眼睛图标。要锁定图层，请点击眼睛图标和图层名称之间的列（见图 2-17）。\n\n![A432409_1_En_2_Fig17_HTML.jpg](img/A432409_1_En_2_Fig17_HTML.jpg)\n\
  \n图 2-17.\n\n点击图层名称旁边的眼睛图标来显示/隐藏\n\n提示\n\n要隐藏或锁定除选中图层之外的所有图层，请按住 `Alt/⌥` 键并点击眼睛（显示/隐藏）图标，或点击眼睛图标（锁定/解锁）与图层名称之间的列。要显示所有图层或解锁图层，请使用相同的快捷键。\n\
  \n如果你以前从未使用过图层的程序，遵循这些简单的步骤可以帮助你在创建设计时快速上手。\n\n## 2.7 使用主页\n\n当对象放置在主页上时，该对象将出现在所有分配给该主页的页面上。例如，如果你有主页\
  \ A、主页 B 和主页 C，并且第 1-3 页都分配给了主页 A，那么你放置在主页 A 上的任何对象都会出现在第 1-3 页上。\n\n主页项目不会出现在可回流\
  \ EPUB 中，但其他类型的数字出版物可以通过将页码、页眉、徽标等项目放置到主页上而受益。\n\n要向主页添加页码，请从 `页面面板` 打开主页。双击你想用于所有带页码页面的主页。创建一个文本框，然后选择\
  \ `文字 ➤ 插入特殊字符 ➤ 标记 ➤ 当前页码`。设置文本的字体和大小，页码就会出现在分配给该主页的所有页面上。\n\n注意\n\n主页项目不会出现在可回流\
  \ EPUB 中。\n\n如果你想创建一个新的主页，但又希望在新的主页分配的页面上也使用页码，请打开页面菜单并选择 `新建主页`。在 `新建主页` 对话框中，从\
  \ `基于主页` 菜单中选择包含页码的主页（见图 2-18）。InDesign 会使用第一个主页的内容，并允许你在新主页上添加额外的项目，这些项目将出现在分配给第二个主页的所有页面上。\n\
  \n![A432409_1_En_2_Fig18_HTML.jpg](img/A432409_1_En_2_Fig18_HTML.jpg)\n\n图 2-18.\n\
  \n选择 `基于主页` 以将给定主页的所有内容添加到一个新的主页上\n\n\n\n"
- '# 2.8 使用网格


  利用网格可以帮助你在设计工作中增加结构和秩序。创建网格后，你会发现布局文档比在页面上随机放置文本、图像和对象要容易得多。网格有助于在设计中提升清晰度和精致感，并能帮助你为文档建立秩序和一致性。


  网格可以添加到主页中，也可以添加到单个页面上。当将网格应用于某个已有主页网格的页面时，页面网格会取代主页网格，即应用于页面的网格具有优先权。换句话说，页面网格会覆盖主页网格。例如，你可以在主页上添加一个七栏网格，使所有页面遵循同一网格布局。然而，在文档的第
  3 页，你可能想使用一个两栏网格。当你将两栏网格应用于该页面时，七栏网格就会消失。


  无论是在主页还是单个页面上添加网格，都通过相同的菜单命令处理。选择 `布局 ➤ 边距和分栏` 以打开 `边距和分栏` 对话框，如图 2-19 所示。在“栏”区域中，输入你希望网格包含的栏数。


  ![A432409_1_En_2_Fig19_HTML.jpg](img/A432409_1_En_2_Fig19_HTML.jpg)


  图 2-19.


  在 `边距和分栏` 对话框中设置网格


  请记住，当你创建一个网格（例如一个九栏网格）时，你所有的元素并不都需要包含在单个栏内。你可以让文本框架跨两栏，图像跨五栏，侧边栏占一栏。


  '
- '# 2.9 导入资源


  添加到设计中的大多数资源都通过使用 `文件 ➤ 置入` 命令来处理。你可以通过这一个菜单命令导入照片、对象、视频、音频文件、PDF 页面以及来自其他 InDesign
  文件的页面。


  在某些情况下，你可能需要在 InDesign 中粘贴对象。通常，最好使用 `文件 ➤ 置入` 来导入图像。但在其他情况下，粘贴对象可能是更好的选择。例如，如果你有一个
  Adobe Illustrator 文件，并且想要访问其中的单个对象，请在 Illustrator 中选择这些对象，然后选择 `编辑 ➤ 复制`。打开 InDesign
  并选择 `编辑 ➤ 粘贴`。当你粘贴 Illustrator 图稿时，可以单独选择每个元素，并更改其填充、描边和变换等属性（参见图 2-20）。


  ![A432409_1_En_2_Fig20_HTML.jpg](img/A432409_1_En_2_Fig20_HTML.jpg)


  图 2-20.


  粘贴的 Illustrator 图稿（左）和置入的 Illustrator 图稿（右）


  如果你在 InDesign 中置入一个 Illustrator 文件，其内容将被编组，你无法在 InDesign 中取消该图稿的编组来隔离和更改单个对象的属性。


  '
- '# 2.10 使用查找/更改


  InDesign 拥有所有软件程序中最好的 `查找/更改` 工具之一。查找一个单词并将其更改为另一个单词非常直接，无需过多解释。然而，InDesign 中的 `查找/更改`
  对话框能提供的远不止查找单词。你还可以查找和更改诸如空白、换行符、回车符、元数据和其他变量、符号和标记等更多内容。此外，InDesign 还允许你搜索和替换 GREP
  模式和样式。


  ## 2.10.1 更改格式


  假设你在文档中添加了一些换行符（`Shift+Enter/Return`），而不是回车符（`Enter/Return`）。重排式 EPUB 无法像其他类型的文档那样解释换行符，因此你应避免使用它们。


  如果你想用回车符替换换行符，请通过选择 `编辑 ➤ 查找/更改` 打开 `查找/更改` 对话框。在 `查找/更改` 对话框中，点击 `查找内容` 文本框右侧的
  `@` 符号。选择 `强制换行符`，如图 2-21 所示。


  ![A432409_1_En_2_Fig21_HTML.jpg](img/A432409_1_En_2_Fig21_HTML.jpg)


  图 2-21.


  点击 `@` 符号打开菜单，并选择一项用于查找格式


  在 `更改为` 区域，点击 `@` 符号并选择 `段落结束符`。如果你想替换整个文档中的所有实例，请从 `搜索` 菜单中选择 `文档`。点击面板右侧的 `全部更改`，InDesign
  会将所有换行符实例更改为回车符。


  ## 2.10.2 搜索 GREP 模式


  `GREP` 代表**全局搜索正则表达式并打印**。在 `查找/更改` 窗口中，你会看到一个 `GREP` 选项卡。当你使用此选项卡进行搜索时，InDesign
  会搜索模式和表达式。


  假设你在版式中使用上标和下标添加了分数。你想将这些分数更改为支持分数的字体中的字形。在 `查找/更改` 窗口的 `GREP` 选项卡中，你可以搜索所有使用了上标和下标的分数。


  在 `查找内容` 文本框中，输入：`\d+/\d+`（参见图 2-22）。


  ![A432409_1_En_2_Fig22_HTML.jpg](img/A432409_1_En_2_Fig22_HTML.jpg)


  图 2-22.


  输入用于在文档中查找分数的代码，然后点击 `查找下一个` 按钮


  这行简单的代码将查找文档中的任何分数。点击 `查找下一个` 按钮，InDesign 会显示搜索到的第一个匹配表达式。


  互联网上有很多不同的 GREP 代码可供你使用。只需搜索 GREP 模式，你就会找到许多可以在 InDesign 中使用的表达式。有关使用 GREP 的更多信息，请参见第
  6 章。


  ## 2.10.3 保存查询


  在 `查找/更改` 对话框的顶部，你会看到 `查询`。点击默认项打开菜单，你会发现一些已保存为预设的搜索项。当你执行搜索并多次使用某个搜索时，可以将该搜索添加为新的查询。


  点击 `垃圾桶` 图标左侧的 `保存查询` 按钮，将打开 `保存查询` 对话框。输入名称并点击 `确定`。你新保存的查询现在将作为菜单选项出现在 `查询` 菜单中。


  '
- '# 2.11 总结


  在本章中，我们探讨了如何设置 InDesign 环境，并根据个人设计偏好定制工具和功能。我们了解了如何创建颜色和字体面板、创建网格和页码，以及如何使用图层面板。你学习了如何导入资源、执行搜索，以及如何查找/更改文本和格式。


  你应该将本章视为对你需要使用 InDesign 执行的一些重要任务的通用介绍。在下一章中，我们将深入探讨如何创建文档以及如何格式化文本。


  '
- '# 第二部分

  在 Adobe InDesign 中创建文档


  '
- "# 3. 格式化文本\n\n所有出版物，无论是印刷出版还是数字出版，都包含文本和图形。对于任何旨在作为印刷材料或在任何设备上查看的文档来说，文本都至关重要。文本的外观和设计，与出版物的整体物理布局和外观同样重要。很简单，在\
  \ InDesign 中，不向文档页面添加文本，你就寸步难行。\n\n在处理文本方面，InDesign 功能强大。你可以以几乎每一种可以想象到的方式对文本进行布局和格式化。并且\
  \ InDesign 为你提供了丰富的工具和命令集，所有这些都旨在帮助你设置字体并实现排版的杰作。\n\n在本章中，我们将探讨设置字体的多种方式，以及如何管理和格式化文本。除了在文档中管理和格式化文本之外，你还需要了解大量关于创建字符样式和段落样式的知识。这对于你创建的任何文档都至关重要。我将在第\
  \ 6 章中介绍样式。现在，让我们先看看一些关于在 InDesign 中设置字体你需要了解的基本内容。\n\n\n\n## 3.1 使用文本框架\n\n在 InDesign\
  \ 中了解文字的首要问题是，所有文本都存在于文本框架中。如果你在工具面板中选择`文字`工具，然后在文档页面上单击，不会发生任何事情。InDesign 需要一个文本框架。与文字处理程序、文本编辑器、Adobe\
  \ Illustrator 等绘图程序以及 Adobe Photoshop 等图像编辑程序不同，在这些软件中，你单击文字工具，光标就会开始闪烁，准备让你输入文本，而\
  \ InDesign 的行为则不同。InDesign 需要一个由你创建或由 InDesign 为你创建的文本框架，具体取决于你如何向文档添加文本。\n\n###\
  \ 3.1.1 创建文本框架\n\n要向文档添加文本，你需要创建文本框架或导入文本，在这种情况下，InDesign 会为你创建文本框架。如果你从一个新文档开始并想添加文本，有几种方法可以创建文本框架。\n\
  \n- **创建文本框架**：使用`文字`工具，点击并拖动以绘制一个矩形。此操作会创建一个文本框架。当你松开鼠标按钮时，熟悉的闪烁光标默认会出现在框架的左上角。\n\
  - **创建框架**：选择工具面板中的`矩形框架`、`椭圆框架`或`多边形框架`工具，然后绘制一个框架。点击工具面板中的`文字`工具，然后在框架内部单击。该框架现在变成了一个文本框架。\n\
  - **创建形状**：点击`矩形`、`椭圆`或`多边形`工具并创建一个形状。点击工具面板中的`文字`工具，然后单击该形状。该框架现在是一个文本框架。\n- **创建线条**：使用`直线`工具或`钢笔`工具创建一条线。按住鼠标按钮点击工具面板中的`文字`工具，以弹出文字工具栏，选择`路径文字`工具，然后输入文本。\n\
  - **在文档中粘贴文本**：复制其他程序中的任何文本，然后选择`编辑` ➤ `粘贴`（`Ctrl`/`⌘`+`V`）。此操作会将剪贴板内容粘贴到 InDesign\
  \ 文档中。粘贴后，InDesign 会创建一个包含所粘贴文本的文本框架。\n- **导入文本**：当你选择`文件` ➤ `置入`并选择一个文本文件时，文本将被导入，同时\
  \ InDesign 会创建一个文本框架。\n\n### 3.1.2 了解文本框架的构成\n\n文本框架有几个常见属性，在向出版物中添加文本时，你应该熟悉这些属性。如图\
  \ 3-1 所示，这些属性包括：\n\n1. **入口**：通过框架左上角小正方形的外观，入口可以告诉你文本是否已串接，或者该文本段落是否为串接的起始端。图 3-1\
  \ 左侧的框架显示一个空正方形。这表示框架起始处没有文本被串接。换句话说，该框架显示该文本是一个段落的开头。右侧的入口显示一个小的箭头，表示该文本之前有一个文本框架。换句话说，第二个框架是一个段落的延续。\n\
  2. **出口**：文本框架右下角的正方形是出口。这可以告诉你一个文本段落的结束，或者是否有更多文本被串接到另一个文本框架。在图 3-1 中，左侧的出口处有一个箭头，右侧的出口处有一个`+`符号。箭头表示该段落被串接到另一个文本框架，而`+`符号表示段落中还有更多文本尚未被放入文档。这通常被称为溢流文本。每当你在文本框架中看到`+`符号时，InDesign\
  \ 都会提示你段落中还有更多文本。当你导出为 PDF 或对文件进行印前检查时，InDesign 会在错误对话框中提示文档包含溢流文本。\n3. **控制柄**：当你选择一个文本框架时，框架的边角和中点处会出现控制柄。使用`选择`工具点击并拖动控制柄可以调整框架大小。\n\
  4. **串接线**：你可以通过选择`视图` ➤ `其他` ➤ `显示(隐藏)文本串接`来开启或关闭显示文本串接的线条。文本串接线显示了文本框架的链接顺序以及框架是如何链接在一起的。\n\
  5. **描边**：图 3-1 中左侧的文本框架显示的是无边框的框架。右侧则显示了一个带边框的框架。你可以通过在“描边”面板中进行选择来为文本框架添加边框。\n\
  6. **填充**：文本框架可以像任何其他对象一样进行填充。选择框架，打开“色板”或“颜色”面板。在选中框架的情况下单击一种颜色，框架就会被填充为所选颜色。\n\
  7. **角选项调整**：文本框架右侧的小黄框用于更改角选项。点击小黄框，框架上会出现四个黄色菱形。向左或向右点击并拖动菱形，可以同时调整所有四个角。按住`Shift`键并拖动，则可以调整单个角。\n\
  \n![A432409_1_En_3_Fig1_HTML.jpg](img/A432409_1_En_3_Fig1_HTML.jpg)\n\nFigure 3-1.\
  \ 两个选中的文本框架\n\n### 3.1.3 使用文本框架选项\n\n当你在工具面板中选择`文字`工具并点击包含文本的文本框架内部时，你会看到熟悉的闪烁光标。点击并拖动可以选中文本。在键盘上打字即可向框架中添加文本。\n\
  \n如果你选择`选择`工具并点击某个框架，则该框架会被视为一个对象。如果你想更改文本的属性，请使用`文字`工具并点击文本框架内部。然后你可以从`文字`菜单中选择选项。如果你想更改框架的属性，则需要再次切换到`选择`工具并点击该框架。作为对象，你可以在`对象`菜单中找到相关选项。选中框架后，选择`对象`\
  \ ➤ `文本框架选项`。这时会打开“文本框架选项”对话框，如图 3-2 所示。\n\n![A432409_1_En_3_Fig2_HTML.jpg](img/A432409_1_En_3_Fig2_HTML.jpg)\n\
  \nFigure 3-2. 使用选择工具选中文本框架，然后选择对象 ➤ 文本框架选项\n\n**提示：** 使用`选择`箭头工具双击文本框架，该工具会切换为`文字`工具，你便可以在框架中选择文本或输入新文本。\n\
  \n在“文本框架选项”对话框中，你可以通过将`栏数`从默认的 1 栏更改为任意所需数量，将框架分为多栏。你可以通过在`栏间距`文本框中输入新值来更改栏间距（栏与栏之间的间距）。\n\
  \n**注意：** 带有多个栏的文本框架在导出为可重排的 EPUB 时会恢复为单栏。\n\n如果你想在文本和框架之间创建一些空间（类似于内边距设置），请编辑`内边距`文本框。“内边距”区域中的链接图标用于在链接激活时，在框架所有边上均匀设置内边距值。如果你想分别调整每一边，请点击链接，使图标显示为断开的链条，然后单独设置每一边。\n\
  \n要在框架中垂直对齐文本，请从`对齐`菜单中选择选项。如果你希望在调整文本框架大小时避免出现溢流文本，请点击“文本框架选项”对话框中的`自动调整大小`选项。自动调整大小的可用选项显示在图\
  \ 3-3 的菜单中。\n\n![A432409_1_En_3_Fig3_HTML.jpg](img/A432409_1_En_3_Fig3_HTML.jpg)\n\
  \nFigure 3-3. 点击自动调整大小，然后从自动调整大小菜单中选择一个选项\n\n当你调整控制柄并重新调整文本框架大小，或编辑文本时，框架会调整到能够容纳框架中所有文本的尺寸。换句话说，你无法将框架大小调整到低于能够显示所有文本的尺寸。\n\
  \n\n\n## 3.2 使用字符面板\n\n与 InDesign 中的许多功能一样，你有多种方式可以更改属性。设置字体选项也是如此。例如，你可以通过打开 `Type`\
  \ 菜单并选择所需字体来选取字体。`Font` 菜单会显示 InDesign 中所有可用的字体。你也可以在控制面板中打开 `Fonts` 菜单。第三种选择字体的方法是打开字符面板中的\
  \ `Font` 菜单，如图 3-4 所示。\n\n![A432409_1_En_3_Fig4_HTML.jpg](img/A432409_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4. 系统安装的所有字体列表会显示在字符面板字体菜单中\n\n使用 `Type` ➤ `Font` 菜单与其他两种方法的区别在于，控制面板和字符面板都提供了字体筛选选项。如果你点击控制面板或字符面板中的\
  \ `Tk` 图标，则仅会显示 Typekit 字体（见图 3-5）。再次点击，则会显示系统中加载的所有字体。\n\n![A432409_1_En_3_Fig5_HTML.jpg](img/A432409_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5. 点击 `Tk` 图标，菜单中将仅显示 Typekit 字体\n\n控制面板和字符面板提供许多相同的选项。请随意使用适合你的那一个。当你选择 `Type`\
  \ 工具时，请注意控制面板左上角有两个图标——`A` 字符和一个 `¶`（段落标记）符号。点击 `A` 字符，面板会发生变化，显示字符属性选项。点击段落标记 `¶`，控制面板会发生变化，显示段落属性选项。\n\
  \n**提示：** 控制面板是访问字符和段落工具的快速便捷方式。熟悉其选项并经常使用它。在控制面板中设置选项比使用菜单命令要快得多。\n\n### 3.2.1\
  \ 使用字符面板选项\n\n在字符面板（如图 3-6 所示）和控制面板中找到的基本排版设置选项包括：\n\n*   **字体菜单：** 点击向下箭头以打开字体菜单。在此菜单中进行选择即可选择一种字体。\n\
  *   **字体样式菜单：** 如果在意字体菜单中选择了 Helvetica，你实际上选择了整个字体系列。在字体样式菜单中，你可以选择类似 Helvetica\
  \ Bold 的选项，这是 Helvetica 字体系列中的一种字体。\n*   **字号：** 为所选字体选择点大小。\n*   **行距：** 行距表示一行文本的基线与下一行文本的基线之间的距离。选择“自动”时，行距将是字体大小的\
  \ 120%（或比字体大小大两个点）。你可以选择其他值来增加或减少行距。\n*   **字偶间距：** 字偶间距是字符之间的距离。许多字体内置了字偶间距对。例如，当你输入\
  \ `Ty`、`Wa`、`Ke`、`Va` 及类似字符时，每对中的第二个字符会稍微缩进到第一个大写字母下方。你还可以选择“视觉”和“度量”。如果选择“视觉”，字偶间距会稍微紧凑一些。\n\
  *   **字间距：** 此设置决定了选定内容、一行文本、一个段落或一段文字中所有字符之间的距离，具体取决于你更改字间距时选择的文本。你可以通过在菜单中选择值或在文本框中输入自定义值，来使所有字符彼此靠得更近或更远。\n\
  *   **垂直缩放：** 用于垂直缩放文本。\n*   **水平缩放：** 用于水平缩放文本。\n*   **基线偏移：** 你可以通过点击箭头或在文本框中输入值，将文本在基线上方或下方进行偏移。\n\
  *   **倾斜：** 使用此选项可以人为地将文字变为斜体。\n*   **语言：** 从语言菜单中选择一种语言，用于拼写检查和断字。\n\n![A432409_1_En_3_Fig6_HTML.jpg](img/A432409_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6. 字符面板中的排版选项\n\n#### 缩放和倾斜文字\n\n有时你可能会想使用字符面板中的水平缩放、垂直缩放或倾斜选项。我的建议是**永远不要**使用这些控件。\n\
  \n排版远不止是简单的图形设计或插入一些文本的插图。字体系列是精心制作的艺术品，在字符大小、宽度、x-高度、上升部和下降部等方面都有精确的细节。字体设计师花费大量时间创造新的字体系列，并且非常注重字符在大小和形态上如何组合在一起。\n\
  \n当你缩放或倾斜文字时，就像是在毕加索或康定斯基的画作上泼洒油漆。\n\n### 3.2.2 使用字符面板菜单\n\n与 InDesign 中的其他面板一样，字符面板也带有一个菜单，你可以在其中选择更多选项。点击字符面板中的菜单图标（右上角）即可打开菜单，如图\
  \ 3-7 所示。\n\n![A432409_1_En_3_Fig7_HTML.jpg](img/A432409_1_En_3_Fig7_HTML.jpg)\n\
  \n图 3-7. 点击字符面板中的菜单图标以打开菜单\n\n该菜单为你提供了以下选项：全部大写字母、小型大写字母、上标/下标、下划线、删除线、使用连字（字符对，例如\
  \ `fl`、`fi`、`ffi` 等，这些字符组合本身被视为一个单一字符），以及一些用于设置下划线和删除线格式的选项。应用于所选文本时，“不换行”将不会断开某个单词。这对于保持某些单词对不分开、防止长\
  \ URL 换行或防止特定单词内断字非常有用。\n\n字符面板菜单中的另一个菜单项是 OpenType。当你选择字符面板菜单中的 OpenType 命令时，会显示\
  \ OpenType 字体的选项。如图 3-8 所示，在使用 OpenType 字体时，你有很多选择。我在此不逐一解释每个选项。要熟悉这些选项，可以多尝试使用\
  \ OpenType 字体并观察效果。许多选项都是不言自明的。\n\n![A432409_1_En_3_Fig8_HTML.jpg](img/A432409_1_En_3_Fig8_HTML.jpg)\n\
  \n图 3-8. 使用 OpenType 字体时有更多选项\n\n作为一般规则，应避免全部使用大写字母输入文本。相反，例如，如果你希望某个副标题以全大写形式显示，请以小写字母输入该副标题，然后改用“全部大写字母”命令。\n\
  \n\n\n## 3.3 使用字形面板\n\n字形是特定字体中的单个字符。字体中不同字形的数量取决于你所使用的字体类型。对于 OpenType 字体，你拥有标准字体，其字符集较为有限；此外你还有专业字体，可提供更多字形。如果你想从多种特殊字符中进行选择，请使用专业字体，如\
  \ Clarendon Text Pro、Adobe Caslon Pro、Myriad Pro、Minion Pro、Warnock Pro，或任何名称中包含“Pro”字样的字体。\n\
  \n要查看字体中的所有字符，请选择“窗口”➤“文字和表”➤“字形”以打开字形面板，或打开“文字”菜单并选择“字形”。如果字形面板已位于工作区中，请单击面板停靠区中的“字形”。字形面板将打开，如图\
  \ 3-9 所示。\n\n![A432409_1_En_3_Fig9_HTML.jpg](img/A432409_1_En_3_Fig9_HTML.jpg)\n\
  \n图 3-9.\n\n选择“文字”➤“字形”，或单击面板停靠区中的“字形”面板名称以打开字形面板\n\n当前活动的字体会显示在字形面板中。如果你想更改字体，请打开面板左下角的“字体”菜单。从“显示”菜单中，你可以选择显示“整个字体”，或从多种选项中进行选择，例如“数学符号”、“货币”、“比例数字”、“小型大写字母”等等。在菜单中进行选择可以缩小显示范围，以便你轻松定位所选字体中的特殊字符。\n\
  \n在字形面板的右下角，你可以选择放大或缩小字符。如果字符显示过小且难以辨认，请单击“放大”图标（以两个大山峰图标表示）。\n\n假设你想添加一个字符，用于项目符号列表中的项目符号。从“显示”菜单中选择“符号”，显示范围将缩小，仅显示字体中的符号字符。找到你想使用的符号并双击它。该符号将被添加到文档中当前光标所在位置，同时也会显示在字形面板顶部的“最近使用”栏中，如图\
  \ 3-10 所示。\n\n![A432409_1_En_3_Fig10_HTML.jpg](img/A432409_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10.\n\n双击字符可将其插入光标所在位置，该字符会自动添加到“最近使用”列表中\n\n通过使用字形面板，你无需记忆快捷键即可输入商标、版权符号以及在设置字体时需要的任何其他特殊字符。\n\
  \n## 3.4 为字符添加笔画\n\n我不会断言你绝不应该为字符添加笔画。事实上，在某些情况下，添加笔画效果相当不错。一个例子是《体育画报》刊头中应用的精美字体设计，其中为字符添加了多道笔画。在创作刊头时，《体育画报》的艺术家们需要设计出一种能够与封面任何类型的照片搭配使用的刊头。由于体育报道涵盖夜间赛事、白色雪坡上的滑雪、黎明和黄昏时的拍摄等等，因此刊头必须在各种色调和颜色的背景上都清晰可见。\n\
  \n传统的刊头采用了白色填充的字体。字体包含一道粗中灰色笔画、一道细黑色笔画、一道厚重的黑色投影，以及一道柔和的黑色投影。应用了多道笔画和投影。最终效果是设计精美的刊头，能够与封面上的任何照片形成良好对比（见图\
  \ 3-11）。\n\n![A432409_1_En_3_Fig11_HTML.jpg](img/A432409_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11.\n\n为字符添加笔画，使其能与任何颜色背景形成对比\n\n在为字体应用笔画时，应避免添加厚重的黑色笔画或对字符毫无益处的装饰性设计。黄金法则是：“保持简洁优雅。”\n\
  \n## 3.5 设置段落属性\n\n到目前为止，我们已经了解了如何格式化单个字符和单词。接下来，让我们继续探讨 InDesign 为我们提供的用于格式化段落的众多选项。你可以使用段落面板设置段落格式选项，也可以使用控制面板进行许多与段落面板中相同的选择。使用控制面板时，请单击段落（`¶`）符号（段落标记）。\n\
  \n\n\n### 3.5.1 使用“段落”面板\n\n如果工作区中包含“段落”面板，请单击“面板停靠区域”中的`段落`。如果看不到“段落”面板，请选择`窗口\
  \ ➤ 文字与表格 ➤ 段落`，即可打开“段落”面板，如图 3-12 所示。\n\n![A432409_1_En_3_Fig12_HTML.jpg](img/A432409_1_En_3_Fig12_HTML.jpg)\n\
  \n图 3-12. 单击“面板停靠区域”中的`段落`，或选择`窗口 ➤ 文字与表格 ➤ 段落`，以打开“段落”面板\n\n您将在“段落”面板中找到以下选项：\n\
  \n- **对齐**：在第一行中，您将找到一系列对齐功能的选项。前三个是左对齐、居中对齐和右对齐。接下来的四个是用于两端对齐文本的各种对齐选项。最后两个是朝向书脊的对齐（左和右）。\n\
  - **左缩进**：整个段落会根据您在文本框中添加的值进行缩进。\n- **右缩进**：从右侧缩进段落。\n- **首行左缩进**：缩进段落中的第一行。\n-\
  \ **末行右缩进**：将段落中的最后一行向右缩进。\n- **段前距**：在段落前添加间距。\n- **段后距**：在段落后添加间距。\n- **首字下沉行数**：设置首字下沉的行数。\n\
  - **首字下沉一个或多个字符**：如果您想使用整个单词或几个字符作为首字下沉，请在文本框中输入数字，并确保设置了行数（参见“首字下沉行数”）。\n- ** shading（底纹）**：选中`底纹`复选框可为单个段落添加颜色底纹。从下拉菜单中选择一种颜色。如果您的多个段落被回车或段前/段后距分隔，则只有文本区域会显示底纹，如图\
  \ 3-13 左侧所示。如果您希望框架内的所有文本都带有底纹，如图 3-13 右侧所示，则需要在“段落底纹”对话框中进行调整。\n    - 要打开“段落底纹”对话框，请从“段落”面板菜单中选择`段落底纹`。此时将打开“段落底纹”对话框，如图\
  \ 3-14 所示。要延续图 3-14 中文本框架的底纹，请首先单击链条图标以断开左侧、右侧、顶部和底部设置的链接。在`顶部`文本框中添加数值，以覆盖段落之间的间距。在本示例中，第一段之后的段后距设置为\
  \ 14 点；因此，在`顶部`文本框中输入 14 点即可充分覆盖该间隙。\n\n    ![A432409_1_En_3_Fig14_HTML.jpg](img/A432409_1_En_3_Fig14_HTML.jpg)\n\
  \n    图 3-14. 在“段落底纹”对话框中进行编辑并勾选`预览`\n\n    - 在“段落底纹”对话框中，将该对话框移至您正在编辑的文本框架旁边并勾选`预览`。进行编辑后，按\
  \ `Tab` 键预览结果（参见图 3-14）。\n\n    ![A432409_1_En_3_Fig13_HTML.jpg](img/A432409_1_En_3_Fig13_HTML.jpg)\n\
  \n    图 3-13. 默认的`段落底纹`（左图）以及在“段落底纹”对话框中编辑后的`段落底纹`（右图）\n\n- **连字**：启用`连字`复选框以应用连字符连接。\n\
  - **对齐到基线网格**：单击第一个图标可关闭对齐到基线网格。单击第二个图标可开启对齐到基线网格。网格和参考线在`InDesign 首选项`中设置。如果需要更改网格线细分，请按\
  \ `⌥/Alt` 并单击其中一个图标。`首选项`对话框中将打开`网格`首选项选项。在此处进行调整，然后单击`确定`以更改网格大小。\n\n### 3.5.2\
  \ 使用“段落”面板菜单\n\n正如“字符”面板为您提供了丰富的字符设置选项一样，“段落”面板为您提供了另一组用于格式化段落的选项，如图 3-15 所示。\n\n\
  ![A432409_1_En_3_Fig15_HTML.jpg](img/A432409_1_En_3_Fig15_HTML.jpg)\n\n图 3-15. 单击“段落”面板右上角的图标以打开面板菜单\n\
  \n再次说明，我不会解释面板中所有可用的选项。请查阅 `Adobe InDesign 帮助`文档以深入了解各种选项。您可能经常使用的一些设置包括`跨栏`、`段落线`和`项目符号和编号`。\n\
  \n选择某个选项时，`InDesign` 会打开一个对话框，您可以在其中选择希望如何表示给定设置。对于`跨栏`，您可以在“跨栏”对话框中选择单栏、多栏或拆分栏。对于`段落线`，您可以选择在段落上方和/或下方设置线条，指定线型和线粗、线条颜色，以及线条相对于段落出现的距离。对于`项目符号和编号`，您可以选择项目符号或编号（用于编号列表）、字符和对齐方式。\n\
  \n用于字符和段落格式的排版选项非常丰富。大多数人不会使用 `InDesign` 提供的所有功能。人们倾向于选择与其工作类型相符的选项。如果您是 `InDesign`\
  \ 的新手，请熟悉这两个面板和`控制面板`，并使用您需要的选项。随着您在工作中变得更加熟练，可以探索其他功能，这些功能有助于节省时间并提高制作效率。\n\n##\
  \ 3.6 在路径上创建文字\n\n在“工具”面板中，有两个文字工具。默认工具是`文字工具`。如果在“工具”面板中单击`文字工具`并按住鼠标按钮，则会弹出一个工具栏，您可以同时看到这两个工具。第二个工具是`路径文字工具`。您可以使用此工具在路径上添加文字。\n\
  \n路径可以是您使用`钢笔工具`或线条工具绘制的任何路径，也可以是您使用形状工具绘制的任何形状。您可以将文字添加到椭圆、矩形、多边形、其他形状以及自由形状的线条上。\n\
  \n在图 3-16 中，您可以看到一些路径文字示例。当您使用`路径文字工具`单击路径时，I 形光标会在您单击的位置开始闪烁。输入文本，文本将沿着路径排列。\n\n\
  ![A432409_1_En_3_Fig16_HTML.jpg](img/A432409_1_En_3_Fig16_HTML.jpg)\n\n图 3-16. 路径文字的一些示例\n\
  \n使用“路径文字”时，您可以更改一些选项。选择该路径，然后选择`文字 ➤ 路径文字 ➤ 选项`以打开“路径文字选项”对话框。\n\n默认效果是`彩虹`。您可以选择其他选项，例如`倾斜`、`3D\
  \ 带状`、`阶梯`和`重力`。当您更改效果时，会看到许多不同的结果，如图 3-17 所示。您还可以控制文字相对于基线的位置。默认情况下是对齐到`基线`。您还可以选择对齐到`上升线`、`下降线`和`居中`，并在相邻的`到路径`菜单中为`顶部`、`底部`和`居中`做出选择。`间距`文本框使您能够调整字符间距。\n\
  \n![A432409_1_En_3_Fig17_HTML.jpg](img/A432409_1_En_3_Fig17_HTML.jpg)\n\n图 3-17.\
  \ 打开“路径文字选项”对话框以细化文字相对于形状的位置\n\n\n\n## 3.7 在故事编辑器中编辑文本\n\nInDesign 的故事编辑器就像是在软件内部内置了一个文字处理程序。与专业的文字处理软件相比，故事编辑器虽然非常简单，但功能强大，它让你无需退出\
  \ InDesign 程序即可编辑文本。\n\n故事编辑器的一个实用功能是编辑存在溢流文本的文本框架中的内容。你可能希望在一个特定的文本框架处结束一段文字，但文本发生了溢流，因此你需要进行一些编辑，使副本内容适合该框架。\n\
  \n要打开故事编辑器，请先在文本框架中点击文字工具，然后选择 `编辑 ➤ 在故事编辑器中编辑` 或按 `Ctrl/⌘+Y` 键。故事编辑器窗口会显示在你的 InDesign\
  \ 文档上方，如图 3-18 所示。\n\n![A432409_1_En_3_Fig18_HTML.jpg](img/A432409_1_En_3_Fig18_HTML.jpg)\n\
  \n图 3-18. 选择 `编辑 ➤ 在故事编辑器中编辑` 或按 `Ctrl/⌘+Y` 键，在故事编辑器中打开文本\n\n如图 3-18 所示，故事编辑器的底部有一条水平线，线的左侧显示有“溢流”字样。这条线表示文本框架中当前所有溢流的文本。\n\
  \n在故事编辑器中，你可以剪切、复制和粘贴文本。你也可以使用“查找/更改”对话框来搜索文本和 GREP 模式，并替换文本。如果在故事编辑器内部右键单击鼠标，你会在菜单中找到许多格式选项，如图\
  \ 3-19 所示。\n\n![A432409_1_En_3_Fig19_HTML.jpg](img/A432409_1_En_3_Fig19_HTML.jpg)\n\
  \n图 3-19. 在故事编辑器中右键单击可打开上下文菜单\n\n在 InDesign 中进行文档排版时，你会发现故事编辑器非常有用，尤其是在发现文本框架中有溢流文本时。\n\
  \n## 3.8 创建文本绕排\n\n当你以线性方式（即一个接一个地在文本段落之间）放置对象时，设计可能会显得乏味。在某些情况下，当你将文本绕排到图像周围时，可以创造出更有趣的设计。你可以设计一个页面，让文本流动并成为图像的一部分，从而形成一种图形化的表达，类似于图\
  \ 3-20。\n\n![A432409_1_En_3_Fig20_HTML.jpg](img/A432409_1_En_3_Fig20_HTML.jpg)\n\
  \n图 3-20. 文本绕排到图像周围\n\n### 3.8.1 使用文本绕排面板\n\n要围绕图像绕排文本，你需要使用 InDesign 中的文本绕排面板。要访问该面板，请选择\
  \ `窗口 ➤ 文本绕排` 或按 `Ctrl/⌘+Alt/⌥+W` 键。文本绕排面板会打开，如图 3-21 所示。\n\n![A432409_1_En_3_Fig21_HTML.jpg](img/A432409_1_En_3_Fig21_HTML.jpg)\n\
  \n图 3-21. 选择 `窗口 ➤ 文本绕排` 以打开文本绕排面板\n\n该面板中的重要选项包括：\n\n- **无文本绕排**：默认情况下，此选项处于选中状态。表示对象未应用文本绕排。\n\
  - **沿定界框绕排**：此选项使文本围绕对象的所有边进行绕排。\n- **沿形状绕排**：当你希望文本沿着形状的轮廓绕排时，请使用此选项。\n- **对象跳跃**：选择此选项时，文本会从对象的顶部跳跃到底部。水平方向不会发生绕排。\n\
  - **跳转到下一栏**：文本会从图像的顶部跳转到下一栏。文本框架需要链接在一起，文本才能流向下一栏。\n- **边距**：点击链接图标可取消边的链接，或再次点击可链接所有四个边。在文本框中输入数值，可以使文本与图形之间产生偏移。\n\
  \n> **提示**：在偏移文本框中点击，然后按键盘上的向上箭头键可增加数值。按向下箭头键可减小偏移值。\n\n- **绕排选项**：在下拉菜单中，你可以选择在右侧绕排、左侧绕排、两侧绕排、朝向书脊绕排、远离书脊绕排以及最大区域绕排。（如果对象靠近栏的一侧，那么最大区域就是另一侧，因此绕排只会在那一侧进行。）\n\
  \n### 3.8.2 沿形状绕排\n\n要围绕图像和对象绕排文本，你需要经过几个步骤。InDesign 无法自动检测图像和对象的边缘，除非你正确地设置了图像并告知\
  \ InDesign 你想要沿形状绕排。\n\n对于光栅图像（如 Photoshop 文件），你可以使用剪切路径，或者直接使用位于带有透明度的图层上的图像。将文件保存为\
  \ `.psd` 格式，然后在 InDesign 中导入该图像。打开文本绕排面板，然后点击“沿形状绕排”图标。你可能还看不到文本沿形状绕排。\n\n文本没有绕排的原因是，你还没有告诉\
  \ InDesign 去检测形状的边缘。点击“沿形状绕排”图标后，打开 `对象` 下拉菜单，选择 `剪切路径 ➤ 选项`。在“剪切路径”对话框中，打开 `类型`\
  \ 菜单，选择 `检测边缘`。现在，文本应该会围绕形状绕排，如图 3-22 所示。\n\n![A432409_1_En_3_Fig22_HTML.jpg](img/A432409_1_En_3_Fig22_HTML.jpg)\n\
  \n图 3-22. 当你想沿形状绕排文本时，务必在 `类型` 菜单中选择 `检测边缘`\n\n有趣的是，如果在 InDesign 中创建文本轮廓，例如选中一个单词或字符，然后选择\
  \ `文字 ➤ 创建轮廓`（`Ctrl/⌘+Shift+O`），该文本字符会被转换为一个可编辑的对象。如果你想围绕一个已转为对象的字符绕排文本，只需选中该对象，然后在文本绕排面板中点击“沿形状绕排”图标即可。\n\
  \nAdobe Illustrator 和其他矢量图稿在导入 InDesign 时行为会有所不同。当你在 InDesign 中选中一个导入的矢量对象，并在文本绕排面板中点击“沿形状绕排”图标时，你无法实现沿形状绕排。同样，你必须从\
  \ `类型` 菜单中选择 `检测边缘`，才能使文本围绕图像的形状绕排。\n\n请记住，如果你发现文本绕排效果不如预期，请检查 `类型` 菜单，确保你已经在该菜单中选中了\
  \ `检测边缘`。\n\n## 3.9 运行拼写检查\n\n在发布文档之前，设计流程的最后一步是检查拼写错误。我使用 Microsoft Word 已经快 30\
  \ 年了，在升级到 Word 2016 之前，我对 Word 的拼写检查功能一直有意见。而 InDesign 的拼写检查则直观且易于使用。\n\n### 3.9.1\
  \ 探索拼写检查选项\n\n拼写检查功能位于“编辑”菜单中。当你选择 `编辑 ➤ 拼写检查` 时，会出现一个子菜单，提供四个选项：\n\n- **拼写检查**：选择此选项后，“拼写检查”对话框会打开。在“拼写检查”对话框中，InDesign\
  \ 会报告拼写错误，并提供几个编辑拼写的选项。\n- **动态拼写**：乍一看，你可能会认为此选项可以在你输入时自动更正错误。但实际情况并非如此。InDesign\
  \ 会在它认为拼写错误的单词下方显示一条波浪线。当线条为红色时，表示 InDesign 判断该单词拼写错误。当线条为绿色时，表示拼写正确但存在其他问题。例如，如果你输入的一个句子以小写字母开头，并且单词拼写正确，InDesign\
  \ 会显示一条绿色波浪线，因为句子中的第一个单词应该以大写字母开头。因此，这条线指示的错误类型并非单纯的拼写错误。\n- **自动更正**：当你勾选“自动更正”后，InDesign\
  \ 会在你输入时自动将常见的拼写错误和输入错误替换为正确的拼写。\n- **用户词典**：点击此菜单项，会打开“用户词典”对话框。你可以向用户词典添加单词，从文本文件导入单词，或者用新词典替换现有词典。\n\
  \n\n\n### 3.9.2 检查拼写错误\n\n选择 `编辑 ➤ 拼写检查 ➤ 检查拼写`，打开如图 3-23 所示的`检查拼写`对话框。你需要在此对话框中选择的第一项是对话框底部的`搜索`菜单。你可以选择`所有文档`，此时\
  \ InDesign 将搜索所有打开的文档。可以选择`文档`，此时 InDesign 将搜索该打开文档中的所有故事。下一个选项是`故事`。当光标位于某个文本框架内并选择`故事`时，InDesign\
  \ 将搜索相应的故事，并忽略未与选中框架链接的其他文本框架。你可以搜索至`故事末尾`。如果你将光标置于故事中间并选择此选项，InDesign 将搜索到故事末尾然后停止。菜单中的最后一项是`选区`。如果你在框架中选中文本并选择此选项，InDesign\
  \ 将仅搜索选中的文本，然后停止搜索。\n\n![A432409_1_En_3_Fig23_HTML.jpg](img/A432409_1_En_3_Fig23_HTML.jpg)\n\
  \n*图 3-23. 选择 `编辑 ➤ 拼写检查 ➤ 检查拼写` 以打开 `检查拼写` 对话框*\n\n在选定搜索内容后，InDesign 会将第一个拼写错误的单词列在`未在词典中`文本框中。如果\
  \ InDesign 能给出正确的拼写建议，建议会显示在`建议更正`框中。若找到合适的更正项，点击框中的更正建议，该单词会被放入`更改为`文本框。点击`更改`按钮，选中的单词即被替换为建议的更正。如果同一个单词出现多次，可点击`全部更改`，InDesign\
  \ 将纠正所有拼写错误的单词。\n\n如果使用了外来语单词，请退出`检查拼写`对话框，将光标置于该外来语单词之前。点击`控制面板`中的 `A` 图标以选择`字符`选项，然后从`控制面板`中选择一个词典，如图\
  \ 3-24 所示。\n\n![A432409_1_En_3_Fig24_HTML.jpg](img/A432409_1_En_3_Fig24_HTML.jpg)\n\
  \n*图 3-24. 为特定语言单词选择对应的语言词典*\n\n选择 `编辑 ➤ 拼写检查 ➤ 检查拼写` 打开`检查拼写`对话框，如果单词拼写正确，InDesign\
  \ 会跳过该单词并跳至下一个拼写错误。如果单词拼写错误，则可能会出现一个建议更正列表，此时应选择正确的拼写并点击`更改`或`全部更改`。\n\n### 3.9.3\
  \ 更正文档中的拼写错误\n\n如果在文本框架中点击鼠标右键，会弹出一个菜单，其中包含多个更改字符属性和访问若干菜单命令的选项。如果右键点击一个拼写错误的单词，菜单会发生变化，仅提供与拼写错误相关的选项。菜单顶部是一个`建议更正`。如果建议正确，在菜单中选择它，InDesign\
  \ 便会将单词更改为正确拼写。\n\n> **注意**  \n> 为了在文档中看到拼写错误的单词（单词下方的红色波浪线），必须勾选 `编辑 ➤ 拼写检查 ➤ 动态拼写检查`，并且必须处于`正常`视图（而非`预览`视图）下。\n\
  \n## 3.10 本章小结\n\n在本章中，我们学习了文本操作，涉及设置字体、格式化文本、使用各种字体特性以及设置多种属性。你学会了如何选择字体、使用 Adobe\
  \ 的 Typekit，以及在设置字体时的一些注意事项。\n\n在下一章中，我们将离开文字排版，探讨在使用图形和对象时需要的许多 InDesign 功能。\n\n"
- "# 4. 使用图形\n\n在第 3 章中，我介绍了许多在操作文本时可用的功能。相信我，第 3 章 仅触及了在 InDesign 中对文本所能做操作的一小部分。然而，通读第\
  \ 3 章后，你应该为在 InDesign 中设置字体打下了基础。\n\n在本章中，我将介绍使用图形，包括图像、对象以及所有非文本的素材。同样地，我也只能浅谈在\
  \ InDesign 中使用图形，因为图形处理远比我能在此分享的要丰富得多。但希望这足以让你开始为数字出版物添加图形，并探索一些奇妙的效果。\n\n将图形导入\
  \ InDesign 相对直接，因此没什么挑战性。真正需要更多学习和掌握的是，在将这些图像和对象导入 InDesign 后，你能对它们进行哪些操作。\n\n在本章中，我们将探讨将图形导入布局、在\
  \ InDesign 中创建图形对象、应用颜色，以及在对象上运用特殊效果的精妙方法。\n\n## 4.1 导入图形\n\n所有图形，包括图像、插画作品、影片文件、SWF\
  \ 文件，以及文本文件和音频文件，都使用相同的菜单命令导入。选择 `文件 ➤ 置入` 以将素材导入 InDesign。除了较短的文本段落和一些矢量艺术插画外，你应该始终使用`置入`命令，而不是将元素复制粘贴到\
  \ InDesign 中。唯一的例外是在向项目添加 Adobe Illustrator 作品时。当你复制粘贴 Illustrator 作品时，可以访问 Illustrator\
  \ 绘制的所有独立路径。而当你置入 Illustrator 作品时，则无法分解插画。\n\n### 4.1.1 置入单个对象\n\n当你选择 `文件 ➤ 置入`\
  \ 时，会打开`置入`对话框，如图 4-1 所示。在对话框底部，你会找到几个复选框。左侧是`显示导入选项`。启用此复选框后，会在放置对象前打开另一个对话框。在`导入选项`中，你可以对页面范围（如果打算置入多页文档，如\
  \ PDF 文件）、图像属性、颜色配置文件和分层文档的图层进行一些选择。\n\n![A432409_1_En_4_Fig1_HTML.jpg](img/A432409_1_En_4_Fig1_HTML.jpg)\n\
  \n*图 4-1. 选择 `文件 ➤ 置入` 以打开 `置入` 对话框*\n\n下一个复选框是`替换所选项目`。如果你选中了一个图像框架并选择此选项，则框架中的所有内容都将被新导入的内容替换。最后一个复选框是`创建静态题注`。使用此复选框可基于文件名添加题注。\n\
  \n如果在点击`置入`对话框中的`打开`之前选中了`显示导入选项`，则会打开`导入选项`对话框。根据文件类型，选项会发生变化。在图 4-2 中，我选择了一个 Adobe\
  \ Illustrator 文件。你看到的选项与矢量艺术作品相关。如果你选择图像文件，选项会有所不同。\n\n![A432409_1_En_4_Fig2_HTML.jpg](img/A432409_1_En_4_Fig2_HTML.jpg)\n\
  \n*图 4-2. 在 `置入` 对话框中点击 `打开` 后，会显示另一个对话框中的 `导入选项`*\n\n无论文件类型如何，你都会看到正在放置文件的预览。如果该文件正是你想要的，点击`确定`，光标就会加载相应的对象。\n\
  \n> **注意**  \n> 当你使用`置入`命令导入文件时，该文件会被放置在一个框架内。与文本一样，所有图形都存在于框架内。\n\n\n\n### 4.1.2\
  \ 放置多个对象\n\n如果你有多个对象，并希望将其排列成网格或类似表格的布局，请选择 `文件` ➤ `置入`。通过按住 `Ctrl/⌘+单击`（非连续选择）来选择对象，然后单击\
  \ `打开`。拖动已加载的光标，在按住鼠标按钮的同时，按下键盘上的 `上箭头` 键可创建行，按下 `右箭头` 键可创建列。这就是 InDesign 的 `网格化`\
  \ 功能。\n\n当参考线显示出的矩形数量恰好能容纳你想要导入的对象数量时，松开鼠标按钮，所有对象都会被放置到按列和行排列的框架中，如图 4-3 所示。\n\n\
  ![A432409_1_En_4_Fig3_HTML.jpg](img/A432409_1_En_4_Fig3_HTML.jpg)\n\n图 4-3. 单击并拖动已加载的光标，按下\
  \ `上箭头` 键创建行，按下 `右箭头` 键添加列\n\n### 4.1.3 将对象适配到框架中\n\n你在 InDesign 中置入的所有对象都会被放置到框架内部。在控制面板中，有多个选项可用于调整对象如何适配框架。在图\
  \ 4-4 中，你可以看到控制面板中包括以下适配选项：\n\n1.  `按比例填充框架`：单击此项可用对象填充框架，同时保持对象的比例。图像的宽度或高度之一将填满框架，图像的一部分可能会被裁剪。\n\
  2.  `按比例适配内容到框架`：单击此项可将内容按比例适配到框架大小。\n3.  `适配内容到框架`：单击此项后，内容将适配到框架，但会失去比例。使用此选项时，你可能会看到对象出现一些变形。\n\
  4.  `适配框架到内容`：实际使用时，你应该对大多数图像采用此选项。框架将根据内容的大小进行调整。对于文本框，框架大小会适配其中的文本内容。这可以消除可能过大并妨碍页面上其他布局项的框架。\n\
  5.  `内容居中`：使用此项可将内容在框架内水平和垂直居中。\n6.  `自动适配`：启用此复选框可使内容自动适配框架。请参阅下一节“调整对象大小”，以更全面地了解\
  \ `自动适配` 如何帮助你。\n\n![A432409_1_En_4_Fig4_HTML.jpg](img/A432409_1_En_4_Fig4_HTML.jpg)\n\
  \n图 4-4. 使用控制面板中的适配选项来调整适配设置\n\n### 4.1.4 调整对象大小\n\nInDesign 在大多数其他 Creative Cloud\
  \ 程序中是个异类。在其他程序中，你按住 `Shift` 键并拖动控制柄即可按比例调整对象大小。如果在 InDesign 中使用此方法，你调整的是框架的大小，而非对象的大小。如果框架小于对象，那么在拖动框架四周的控制柄时，你会裁剪对象（见图\
  \ 4-5）。\n\n![A432409_1_En_4_Fig5_HTML.jpg](img/A432409_1_En_4_Fig5_HTML.jpg)\n\n\
  图 4-5. 左侧为使用按键修饰符调整大小的对象，右侧为启用 `自动适配`（见控制面板中的复选框）的情况——在不使用修饰键或未启用 `自动适配` 时移动角控制柄的效果\n\
  \n要调整对象大小，你可以使用两种方法。如果禁用了 `自动适配` 复选框，请按住 `Ctrl/⌘+Shift` 键并拖动控制柄。务必在移动控制柄之前按下键盘上的这些键。\n\
  \n第二种方法使用 `自动适配` 复选框。如果启用了 `自动适配` 复选框，你可以按住 `Shift` 键并拖动控制柄来调整对象大小。对象将按比例调整大小。如果你想使用\
  \ `Shift+拖动` 来调整对象大小，需要为每个对象启用 `自动适配`。如果要调整多个对象的大小，请按 `Ctrl/⌘+A` 选择这些对象，然后启用 `自动适配`\
  \ 复选框。\n\n一旦为某个对象设置了 `自动适配`，它就会一直保留在该对象上。如果你以后想要裁剪图像，需要禁用 `自动适配` 复选框，然后拖动控制柄来裁剪框架内的图像。\n\
  \n你对导入的图像和对象所做的所有编辑都是非破坏性的，这意味着你不会永久性地改变对象本身。例如，如果你裁剪了一张图像，保存文件，然后在另一个编辑会话中再次打开它，你可以拖出框架来显示之前被裁剪的区域。\n\
  \n\n## 4.2 为置入的图像应用色彩\n\n为图像着色最常见的用途之一就是为纹理添加色彩。你可以在互联网上找到大量免版税的纹理图片。下载这些文件并在 Photoshop\
  \ 中打开。\n\n若要在 InDesign 中对栅格图像进行着色，需要遵循一些规则。文件必须是灰度模式或位图（文件中所有颜色信息必须被移除）。图像必须保存为拼合后的（单图层）`.psd`\
  \ 或 `.tif` 文件。\n\n导入图像后，请注意该图像位于一个框架内部。默认情况下，当你使用选择工具点击时，框架会被选中。如果你应用色彩，色彩会应用于框架而非图像。双击框架以选中图像，然后才能应用色彩。\n\
  \n**警告**\n\n当你使用选择工具点击框架时，点击会选中框架。当你使用选择工具双击框架时，你会选中框架内部的内容（或称为内容）。\n\n为了更好地理解这一切是如何运作的，让我们一步步来完成在\
  \ InDesign 中为图像着色的操作。\n\n1.  在 Photoshop 中准备文件。如果文件是 RGB 图像，你需要将其转换为灰度模式。选择“图像 ➤\
  \ 模式 ➤ 灰度”，或者使用 Photoshop 中的“调整”面板，点击“创建新的黑白调整图层”图标。然后拼合图层，并将其保存为 `.psd` 或 `.tif`\
  \ 文件。\n2.  打开一个 InDesign 文件或创建一个新文档。\n3.  在 InDesign 中置入图像。选择“文件 ➤ 置入”并导入图像。通过拖动图像将其定位到所需位置。在我的示例中，我置入了一个用作背景的纹理，如图\
  \ 4-6 所示。\n\n![A432409_1_En_4_Fig6_HTML.jpg](img/A432409_1_En_4_Fig6_HTML.jpg)\n\
  \n**图 4-6.** 在 InDesign 文件中置入图像\n\n4.  选择吸管工具。假设你想使用已应用在文档中某个对象上的颜色，请在“工具”面板中点击吸管工具，或按键盘上的\
  \ `I` 键。确保你选中了吸管工具。在“工具”面板中，有两个吸管工具：一个是吸管，另一个是颜色主题工具。颜色主题工具图标下方带有一组微小的色板。如果你看到选中了此工具，请再次按键盘上的\
  \ `I` 键，吸管工具即被选中。或者，你也可以在“色板”面板中点击一种颜色。\n5.  点击一个对象以吸取颜色。如果你的对象是从 Adobe Illustrator\
  \ 等矢量绘图程序导入的矢量文件，则会弹出一个警告对话框，提示采样基于图像的低分辨率代理。在大多数情况下，对矢量对象进行颜色采样是没问题的。点击对话框中的“确定”，该颜色将显示为“工具”面板中新的默认前景色。\n\
  6.  将颜色添加到你的“色板”面板。右键单击“工具”面板中的前景色色板，选择“添加到色板”。\n7.  将色彩应用于导入的灰度图像。你会看到吸管图标的外观发生变化，吸管从指向左下角变为指向右下角。点击一个对象将应用所选颜色。如果你的图像未被选中，请按住\
  \ `Ctrl`/`⌘` 键并双击图像以选中图像本身而非框架。松开修饰键后吸管工具仍处于选中状态，然后点击图像。\n8.  更改色调。由于已将颜色添加到“色板”面板，你可以调整色调。点击新颜色，然后点击“色调”的右向箭头。向左拖动滑块以调整色调，如图\
  \ 4-7 所示。\n\n![A432409_1_En_4_Fig7_HTML.jpg](img/A432409_1_En_4_Fig7_HTML.jpg)\n\
  \n**图 4-7.** 调整色调\n\n**注意**\n\n当你在选中的图像上移动光标时，如果看到选择箭头图标，则表示选中了框架。如果看到抓手图标，则表示选中了图像。当你向对象应用色彩时，如果颜色显得不透明且比预期暗得多，则你可能将色彩应用到了框架而非图像上。撤销该步骤，双击图像以选中它，然后再应用色彩。\n\
  \n## 4.3 绘制描边\n\n多年前，大约在 20 世纪 90 年代中后期，QuarkXPress 是主流的排版软件，也是图形设计师和广告公司的核心工具。设计师用它来做所有事情，包括创建徽标、插画作品以及绘制图标和符号。当文件被送到服务商输出到印前设备时，服务商的技术人员为了在这些高端设备上打印文件而绞尽脑汁。当时的排版软件根本无法妥善处理设计师用来向文档添加对象的诸多方法——这些对象在屏幕上看起来很好，但打印出来时就问题百出。\n\
  \n软件开发者很快意识到，设计师喜欢坚守一个他们熟悉的软件，并在其偏好的程序中创建一切。有些人早在 Adobe Illustrator 支持多个画板之前，就使用它创建多页版面。有些设计师在制作海报和小册子时，则完全依赖\
  \ Adobe Photoshop。版面设计师在绘制形状和自定义描边时，会使用他们偏爱的软件。\n\n随着 InDesign 的成熟，Adobe 提供了更高级的方法来创建自定义描边和对象。如今，对于那些创建交互式数字出版文档的人来说，在制作自定义按钮、精美边框、3D\
  \ 对象、透视绘图以及具有各种特效的对象时，可能完全无需离开 InDesign。你会发现 InDesign 中用于绘制插画的工具既丰富又令人印象深刻。此外，你在\
  \ InDesign 中创建的所有内容同样适用于印前和印刷。\n\n### 4.3.1 使用描边工具\n\n你可以使用钢笔工具、铅笔工具和直线工具绘制描边。描边也可以应用于形状和框架。在图\
  \ 4-8 中，你可以看到使用这三种绘图工具绘制的描边、应用于形状的描边以及应用于文本框的描边。\n\n![A432409_1_En_4_Fig8_HTML.jpg](img/A432409_1_En_4_Fig8_HTML.jpg)\n\
  \n**图 4-8.** 应用于线条、形状和带文本框架的描边\n\n对于对象和文本，你还可以添加填色。描边出现在对象的外部，而填色则出现在描边的内部。\n\n\n\
  \n### 4.3.2 使用“描边”面板\n\n“**描边**”面板用于更改描边属性。选择“`窗口 ➤ 描边`”（`F10`）即可打开“**描边**”面板，如图\
  \ 4-9 所示。\n\n![A432409_1_En_4_Fig9_HTML.jpg](img/A432409_1_En_4_Fig9_HTML.jpg)\n\
  \n图 4-9.\n\n选择“`窗口 ➤ 描边`”或按 `F10` 键打开“**描边**”面板\n\n“**描边**”面板为您提供了多个选项，包括：\n\n*\
  \   **粗细**：在文本框中输入一个值，或从下拉菜单中选择描边粗细的不同尺寸。\n*   **端点**：提供了三种端点样式。您可以使用默认的“`平头端点`”，此时描边的起点和终点与描边宽度相同，没有端点。点击第二个图标可应用**圆头端点**，为描边添加圆形末端。选择第三个图标可使用**投射端点**，此时端点会向描边两端外侧延伸。\n\
  *   **斜接限制**：当您使用“`钢笔工具`”或“`铅笔工具`”绘制线条时，线条的连接处可能出现“`平头端点`”且同一路径上带有尖角——类似于图 4-11\
  \ 左侧所示的情况。如果提高“`斜接限制`”值，则可以消除“`平头端点`”，如图 4-10 右侧所示。编辑“`斜接限制`”值的缺点是，最终可能会出现大小不一的尖角，如图\
  \ 4-10 所示。\n\n    ![A432409_1_En_4_Fig10_HTML.jpg](img/A432409_1_En_4_Fig10_HTML.jpg)\n\
  \n    图 4-10.\n\n    斜接限制设置为默认值 `4x`（左侧）和斜接限制设置为 `13x`（右侧）\n\n> **注意**\n> 仅当选择了“`斜接连接`”选项时，才能编辑“`斜接限制`”。\n\
  \n*   **连接**：包括“`斜接连接`”、“`圆角连接`”和“`斜面连接`”三个选项。\n*   **对齐描边**：可选择“`描边居中对齐`”、“`描边内侧对齐`”和“`描边外侧对齐`”。\n\
  *   **类型**：打开下拉菜单，可从一长列描边样式中进行选择。\n*   **起点/终点**：从下拉菜单中选择不同的箭头及其他起点/终点选项。\n*   **间隙颜色**：有时，您可能希望使用虚线，并希望用某种颜色或该颜色的淡色填充虚线之间的间隙。如果描边类型为实线，此选项无效。\n\
  *   **间隙淡色**：通过在文本框中输入数值或移动点击右向箭头后出现的滑块，来更改间隙颜色的淡色值。\n\n如果您发现文档中多次使用到具有相同属性的描边，可以为描边设置一个文档偏好。创建新文档后，请勿选择文档页面上的任何内容。打开“**描边**”面板，设置您希望用于所绘制或应用于框架的描边的属性。这些设置将成为新的默认值（仅适用于当前打开的文档），这样每次您绘制或应用描边时，就无需在“**描边**”面板中进行其他编辑了。\n\
  \n### 4.3.3 创建自定义描边\n\n在 Adobe Illustrator 中，您可以使用“**外观**”面板来创建对象，并为单个对象应用多个描边和/或填充。遗憾的是，InDesign\
  \ 没有“**外观**”面板，并且在撰写本文时，我们还无法像在 Adobe Illustrator 中那样强大地处理 InDesign 中的描边。不过，好消息是，我们可以使用一些变通方法和技巧，超越“**描边**”面板中的选项，创造出一些有趣的效果。\n\
  \n要创建新的自定义描边，请打开“**描边**”面板菜单并选择“`描边样式`”。系统将打开“`描边样式`”对话框，如图 4-11 所示。\n\n![A432409_1_En_4_Fig11_HTML.jpg](img/A432409_1_En_4_Fig11_HTML.jpg)\n\
  \n图 4-11.\n\n从“**描边**”面板菜单中选择“`描边样式`”以打开“`描边样式`”对话框\n\n在“`描边样式`”对话框中，您可以看到 InDesign\
  \ 为您提供的一些默认样式。您可以通过单击“`新建`”按钮来修改和编辑这些样式。如果在单击“`新建`”时未选择任何样式，InDesign 会为新建样式添加“`新建描边样式`”名称。如果您选择了一种样式并单击“`新建`”，InDesign\
  \ 会沿用该样式名称，并在名称末尾添加“`副本`”，如图 4-13 所示。这确保了您不会覆盖默认样式。默认描边样式无法编辑或删除。\n\n在“`名称`”字段下方，您可以看到“`类型`”下拉菜单。您可以选择添加“`条纹`”、“`点线`”或“`虚线`”描边。如果您选择诸如“`粗细\
  \ – 细 – 粗细`”之类的样式并单击“`新建`”（见图 4-12），您将在“`新建描边样式`”对话框中看到当前样式。\n\n![A432409_1_En_4_Fig12_HTML.jpg](img/A432409_1_En_4_Fig12_HTML.jpg)\n\
  \n图 4-12.\n\n在“`描边样式`”对话框中点击一种描边样式，然后单击“`新建`”。“`新建描边样式`”对话框将打开，您可以在其中编辑描边样式\n\n\
  有三种编辑可以应用于描边样式：\n\n*   **删除描边**：点击“`条纹`”预览区域中的一条描边，并将其拖离对话框。这将从样式中删除该描边。\n*   **调整描边大小**：每条描边左侧都有一个标记，带有从\
  \ `0%` 到 `100%` 的刻度尺。要调整描边大小，请单击并向上或向下拖动其中一个标记。\n*   **添加描边**：将光标点击到（对话框中描边之间的）某个间隙处，以添加一条新描边。向上或向下拖动标记以调整新描边的大小。\n\
  \n为新的描边样式键入一个名称，然后单击“`确定`”。新样式将添加到“**描边**”面板的“`类型`”下拉菜单中。\n\n#### 创建新描边样式\n\n为了更清晰一点，让我们通过执行以下步骤来创建一个新的描边样式：\n\
  \n1.  打开“**描边**”面板，然后从“**描边**”面板菜单中选择“`描边样式`”。\n\n    **注意**\n    无需在 InDesign 中打开文档即可创建新的描边样式。\n\
  \n2.  在“`描边样式`”面板中点击“`粗细 – 细 – 粗细`”。\n3.  单击“`新建`”以打开“`新建描边样式`”对话框。InDesign 添加到新样式名称中的名称是“`粗细\
  \ – 细 – 粗细副本`”。在“`条纹`”区域，您可以看到此样式的三条描边，如图 4-13 所示。\n\n    ![A432409_1_En_4_Fig13_HTML.jpg](img/A432409_1_En_4_Fig13_HTML.jpg)\n\
  \n    图 4-13.\n\n    “`粗细 – 细 – 粗细`”样式的“`新建描边样式`”对话框\n\n4.  点击顶部描边并将其向上拖动，使描边变细。\n\
  5.  向下移动底部标记以将描边尺寸调小。\n6.  点击描边之间的间隙以添加一条新描边。使此描边比其他两条更粗。\n7.  再添加一条描边，如图 4-14 所示。您可以根据喜好自由调整描边的大小。在我的示例中，您可以在图\
  \ 4-14 中看到编辑后描边大小的结果。\n\n    ![A432409_1_En_4_Fig14_HTML.jpg](img/A432409_1_En_4_Fig14_HTML.jpg)\n\
  \n    图 4-14.\n\n    调整两条描边大小并添加两条描边后的新样式编辑结果\n\n8.  为新样式键入一个名称，然后单击“`确定`”。\n9.\
  \  应用描边。\n10. 您可以对线条、框架、对象或文字应用描边。在我的示例中，我将描边应用到了一个框架上，如图 4-15 所示。\n\n    ![A432409_1_En_4_Fig15_HTML.jpg](img/A432409_1_En_4_Fig15_HTML.jpg)\n\
  \n    图 4-15.\n\n    应用了新描边样式的框架\n\n11. 为描边应用颜色（可选）。\n12. 应用描边后，打开“`色板`”面板，点击您想要用作描边颜色的颜色。请确保在点击颜色色板时，在“`色板`”面板中选中了“`描边`”。最终结果如图\
  \ 4-15 所示。\n\n\n\n### 4.3.4 保存和加载自定义描边样式\n\n如果在 InDesign 中未打开任何文档时创建自定义描边样式，则新建文档时该自定义描边样式可用，且一直存在直至你将其删除。\n\
  \n但是，如果在打开文档时创建描边样式，则描边样式专属于该文档。当你关闭文档或新建文档时，之前在打开的文档中添加的任何描边样式都会丢失。\n\n你可以将描边样式保存到文件中，并在希望将自定义描边用于\
  \ InDesign 中创建的任何文档时加载它们。要在打开文档时保存一个或多个描边样式，请从`描边面板`菜单中选择`描边样式`。此时将打开`描边样式`对话框。你必须在`描边样式`对话框中选择一个或多个自定义描边，才能激活`保存`按钮。选择一个描边并单击`保存`。\n\
  \nInDesign 允许你将描边样式保存到硬盘上的任意位置。你可以将它们添加到存放特定设计项目资源的文件夹中，或者保存到根文件夹以便在多个文档中使用。单击`保存`按钮时，将打开`另存为`对话框。为自定义设置集键入一个名称，在硬盘上导航至要保存该设置集的目标位置，然后单击`保存`。\n\
  \n当你新建文档并希望使用自定义描边集时，请打开`描边样式`对话框并单击`加载`。此时将打开`打开文件`对话框。导航到硬盘并找到要加载的自定义设置集。选择该设置集并单击`打开`。该自定义设置集现在即可在`描边面板`的`类型`菜单中使用。\n\
  \n一旦加载了自定义描边样式集并保存了文档，此后每次处理该文档时就无需再加载该设置集了。保存文档后，这些描边样式便成为文档的一部分。\n\n### 4.3.5\
  \ 使用描边为对象分层\n\n自定义描边样式的一个限制是，你不能为不同的描边使用多种颜色。如果你使用`粗细 – 细 – 粗细`作为描边样式，并在`色板面板`中单击以应用颜色，则所有单独的描边都将接受相同的颜色值。InDesign\
  \ 将每个描边样式视为一个单一的描边。（截至目前）无法在`描边样式`对话框中进行选择，以便为同一样式中的不同描边应用不同的颜色。\n\n解决此问题的方法是创建一个描边样式并将其应用于一个对象（例如一个框架），然后创建该对象的副本，并对其应用另一种颜色的描边。\n\
  \n#### 使用描边为对象分层\n\n让我们看看如何实现为多个描边添加不同颜色。\n\n1. 打开`描边面板`，并从`描边面板`菜单中选择`描边样式`。  \n\
  2. 在`描边样式面板`中单击`细 – 粗`，然后单击`新建`。在我的示例中，我想创建两个尺寸相同但颜色不同的描边。对于外侧描边，我想要纯黑色，内侧描边为红色。我先从红色的内侧描边开始。\
  \  \n3. 通过单击并将顶部描边拖离对话框来删除它。  \n4. 将描边高度设置为 50%。  \n5. 键入名称，然后单击`确定`。我们称此样式为`空 –\
  \ 粗`。  \n6. 创建一个新的描边样式。我想创建一个与第一个样式完全相反的样式。在第一个样式中，底部有一个占 50% 的描边。现在我想创建一个底部为空、顶部有一个约\
  \ 10% 描边的新样式（类似于你在图 4-16 中看到的情况）。我们称此样式为`细 – 空`。\n\n    ![A432409_1_En_4_Fig16_HTML.jpg](img/A432409_1_En_4_Fig16_HTML.jpg)\n\
  \n    图 4-16.\n\n    创建第二个样式并命名为`细 - 空`  \n7. 单击`确定`退出`描边样式`对话框。  \n8. 将`空 – 粗`样式（我们创建的第一个样式）应用于一个框架。\
  \  \n9. 在`描边面板`中将`粗细`设置为 20 点，并将`对齐`设置为`描边对齐到外侧`。  \n10. 从`色板面板`中应用一种颜色。在我的示例中，我使用了渐变。\
  \  \n11. 选择该框架，然后选择`编辑` ➤ `复制`（`Ctrl/⌘+C`）。  \n12. 选择`编辑` ➤ `原位粘贴`。新副本将精确位于页面上原始框架的相同位置之上。\
  \  \n13. 选择前景框架，并应用`细 – 空描边样式`。  \n14. 在`描边面板`中将`粗细`设置为 20 点，并将`对齐`设置为`描边对齐到内侧`。\
  \  \n15. 在`色板面板`中选择`黑色`作为描边颜色。  \n\n最终结果如图 4-17 所示。\n\n![A432409_1_En_4_Fig17_HTML.jpg](img/A432409_1_En_4_Fig17_HTML.jpg)\n\
  \n图 4-17.\n\n应用于框架的两个不同颜色的描边\n\n你可以通过复制和粘贴框架，并对每个框架应用不同的描边颜色和粗细来创建多个描边。你需要记住的是，描边样式的开发需要包含描边和空白（即表示所需样式的间隙），并且描边粗细必须相同。\n\
  \n### 4.3.6 调整箭头大小\n\n在 InDesign CC 2017 之前的版本中，调整箭头大小的唯一方法是调整描边粗细。箭头无法独立于描边粗细进行大小调整。现在，在\
  \ InDesign CC 2017 中，你可以同时且独立地调整箭头和描边的大小。\n\n在图 4-18 中，你会看到两个带有箭头的描边。第二个描边有一个起始箭头和一个结束箭头。显然，此处为了说明问题，箭头尺寸被放大了。在`描边面板`中，你会看到`缩放`选项有一个链式链接。当链接断开时，如图\
  \ 4-18 所示，你可以独立于描边粗细来缩放箭头。在相应的文本框中输入值以调整箭头大小。如图 4-18 所示，第二条线的`起始`箭头设置为 125%，而`结束`点设置为\
  \ 175%。\n\n![A432409_1_En_4_Fig18_HTML.jpg](img/A432409_1_En_4_Fig18_HTML.jpg)\n\
  \n图 4-18.\n\n编辑`缩放`文本框以调整箭头大小\n\n## 4.4 绘制对象\n\n到目前为止，在本章中我们了解了如何使用`直线工具`、`铅笔工具`和`钢笔工具`绘制描边。描边绘制只是\
  \ InDesign 中可用绘图功能的一小部分。你不会想在 InDesign 中创建复杂的技术图纸或插画，这类作品最好在 Adobe Illustrator 中完成。然而，创建按钮、图标、徽标以及中等复杂形状都在\
  \ InDesign 强大的对象处理工具能力范围之内。\n\n### 4.4.1 创建几何形状\n\n在`工具面板`中，当你单击`矩形工具`并按住鼠标按钮以打开隐藏工具时，可以使用三种几何形状。这里有`矩形工具`、`椭圆工具`和`多边形工具`。\n\
  \n要绘制其中一种形状，请在`工具面板`中选择一种形状工具，然后使用该工具单击并拖动以创建形状。如果要从中点开始绘制，请在绘制时按下`Alt/⌥`键。如果要约束形状（例如绘制正方形或正圆），请在绘制时按下`Shift`键。如果你开始在文档页面上绘制，并希望在绘制过程中移动形状，请在按住鼠标按钮的同时按下`空格键`，在页面上移动形状，然后继续绘制。\n\
  \n\n\n### 4.4.1 绘制多种形状\n\n假设您想创建一个包含多种形状的网格——类似于日历设计。在工具面板中点击一种形状工具，按住`Shift`键并拖拽出一个形状。在鼠标按钮和`Shift`键都按下的状态下，按`向右箭头`键可添加一列。按`向上箭头`键可添加一行。继续按`向右`和`向上箭头`键可添加更多列和行。在图\
  \ 4-19 中，您可以看到使用箭头键添加列和行所产生的多个正方形。\n\n![A432409_1_En_4_Fig19_HTML.jpg](img/A432409_1_En_4_Fig19_HTML.jpg)\n\
  \n图 4-19. 绘制时按下`向右`和`向上箭头`键，即可创建额外的列和行\n\n#### 4.4.1.2 绘制指定尺寸的形状\n\n如果您想绘制指定尺寸的形状，请在工具面板中点击所需的形状，然后在文档中点击。相应的工具对话框将打开。在图\
  \ 4-20 中，我在文档中点击了多边形工具，随后多边形对话框打开。\n\n![A432409_1_En_4_Fig20_HTML.jpg](img/A432409_1_En_4_Fig20_HTML.jpg)\n\
  \n图 4-20. 点击一种形状工具，然后在页面上点击，即可打开相应的形状对话框\n\n在对话框中输入`宽度`和`高度`值，然后点击`确定`。形状将以形状对话框中设定的尺寸被创建。\n\
  \n#### 4.4.1.3 转换形状\n\n您可以使用`对象 ➤ 转换形状`菜单，然后从子菜单中的九种形状里选择一种，来将形状转换为不同的形状。在路径查找器面板中可以找到一种更简便的转换形状的方法。选择`窗口\
  \ ➤ 对象和版面 ➤ 路径查找器`以打开该面板。\n\n如果您绘制了多个形状并希望将它们转换为另一种形状，请选中所有形状，然后在路径查找器面板中点击一种新形状。在图\
  \ 4-21 中，我将图 4-19 中所示的形状转换成了三角形。\n\n![A432409_1_En_4_Fig21_HTML.jpg](img/A432409_1_En_4_Fig21_HTML.jpg)\n\
  \n图 4-21. 点击路径查找器面板中的某个“转换形状”选项\n\n#### 4.4.1.4 编辑路径\n\n使用`钢笔`工具绘制路径时，您可能希望连接路径、闭合路径或反转路径。如果您绘制了一个几何形状，您可能想开放一条路径。在路径查找器面板中，您可以找到用于编辑路径的选项。\n\
  \n在面板顶部，您会找到四个路径选项。第一项是`连接路径`。点击路径查找器路径（从左到右）后会出现底部一行：`连接路径`、`开放闭合路径`、`闭合开放路径`和`更改路径方向（反转路径）`。使用`开放闭合路径`选项时，您不会看到对象发生变化。InDesign\
  \ 会断开路径，而您需要使用`直接选择`工具来移动路径断开处的点。\n\n#### 4.4.1.5 编辑角\n\n您可以使用多种方法更改形状和路径上的角选项。InDesign\
  \ 支持五种不同的角修改选项。默认为`无`。当选择`无`时，角会按照您绘制原始路径时的样式显示。您可以将一个或多个角更改为`花式`、`斜角`、`内陷`、`反向圆角`和`圆角`。在图\
  \ 4-22 中，您可以看到将角选项更改为这五种选项后的效果。\n\n![A432409_1_En_4_Fig22_HTML.jpg](img/A432409_1_En_4_Fig22_HTML.jpg)\n\
  \n图 4-22. InDesign 提供了五种角选项\n\n更改角选项可以通过使用`对象 ➤ 角选项`菜单命令来完成。当您选择该菜单命令时，“角选项”对话框会打开。您可以编辑单个角或所有角，并选择五种角选项之一。您还可以将应用于角的大小设置为更小或更大。`预览`复选框使您能够动态预览结果。\n\
  \n您也可以使用控制面板来更改角。在控制面板中选择一个角选项，并编辑大小文本框。按`Alt/⌥`键并点击大小文本框旁边的方形图标，即可打开“角选项”对话框。\n\
  \n也许更改角选项的最佳方式是在路径上直接编辑。当您绘制一个几何形状时，您会看到每个角和各边中点处有控制柄。这些控制柄用于缩放和旋转对象。您还会在靠近右上角处找到一个黄色方块。点击黄色方块，InDesign\
  \ 会在每个角处显示四个黄色菱形，如图 4-23 所示。\n\n![A432409_1_En_4_Fig23_HTML.jpg](img/A432409_1_En_4_Fig23_HTML.jpg)\n\
  \n图 4-23. 点击形状上的黄色方块，角上会出现黄色菱形\n\n要修改所有角，请点击并拖动一个菱形。默认效果是圆角。当您将菱形从角处拖开时，形状会变为带有圆角的物体。如果您想编辑单个角，请按住`Shift`键并拖动该角。如果您想更改角的样式，请按住`Alt/⌥`键并点击一个菱形。\n\
  \n使用形状上的菱形来编辑角的好处在于，您无需离开该对象即可进行编辑。您会发现，这种方法比打开对话框或使用控制面板更快。\n\n### 4.4.2 创建星爆和装饰图案\n\
  \n您可以创建可能用作图形元素和按钮的星爆和装饰图案。作为对象，您可以像对在 InDesign 中创建的任何其他对象一样，对这些项目应用描边和填充。\n\n####\
  \ 4.4.2.1 创建星爆\n\n当您使用`多边形`工具绘制形状时，默认会得到一个六边形。您可以通过在工具面板中双击`多边形`工具，轻松更改多边形的属性。此时将打开“多边形设置”对话框，如图\
  \ 4-24 所示。\n\n![A432409_1_En_4_Fig24_HTML.jpg](img/A432409_1_En_4_Fig24_HTML.jpg)\n\
  \n图 4-24. 在工具面板中双击`多边形`工具以打开“多边形设置”对话框\n\n在“多边形设置”对话框中，输入边数的值。要获得星爆效果，请使用一个夸张的数字，如\
  \ 20。对于“星形内陷”值，请使用一个较大的值，如 50%。此设置会将中心向内拉，从而在对象的末端形成大的尖刺。点击`确定`，然后为对象应用渐变或颜色，如图\
  \ 4-25 所示。\n\n![A432409_1_En_4_Fig25_HTML.jpg](img/A432409_1_En_4_Fig25_HTML.jpg)\n\
  \n图 4-25. 一个内陷 50% 的 20 边形\n\n“多边形设置”对话框没有预览选项，您在创建对象时不会看到动态预览。如果您想更改外观、增加更多边数或更改内陷值，请再次双击`多边形`工具。您上次所做的设置会出现在“多边形设置”对话框中。编辑这些值并点击`确定`。如果您需要完善对象，只需再次双击`多边形`工具并编辑数值即可。\n\
  \n\n\n"
- "# 创建装饰图案\n\n利用自由绘制的线条，再借助变换功能稍加处理，即可轻松创建装饰图案。\n\n要创建类似螺旋图案的效果，请遵循以下步骤：\n\n1. 单击`铅笔`工具，绘制一个简短、粗略的形状。\n\
  2. 你不需要成为艺术家。最终结果的妙处在于，任何粗略的形状都能创造出漂亮的图案。\n3. 变换形状。\n4. 单击控制面板最左侧中间靠下的方块，将参考点设置在底部中心。选择`对象\
  \ ➤ 变换 ➤ 旋转`。此时会打开`旋转`对话框。\n5. 设置变换角度。\n6. 你可以在`角度`文本框中输入任意数值。只需确保该值能被 360 整除即可。在我的示例中，我使用了\
  \ 10°。单击`复制`，创建形状旋转 10°后的副本。\n7. 变换序列。\n8. 选择`对象 ➤ 再次变换 ➤ 再次变换序列`。请注意，`再次变换序列`菜单项有一个键盘快捷键。按下`Ctrl/⌘+Alt/⌥+4`。持续按下该快捷键，直到形状旋转回第一个对象。\n\
  9. 根据你的喜好应用描边、颜色、渐变等效果。\n10. 在图 4-26 中，你可以看到我用`铅笔`工具绘制的原始粗略形状。该形状右侧的三个图案展示了应用了描边设置和带渐变的描边颜色的形状。\n\
  \n![A432409_1_En_4_Fig26_HTML.jpg](img/A432409_1_En_4_Fig26_HTML.jpg)\n\n图 4-26.\
  \ 从简单的粗略形状创建螺旋图案\n\n使用这些步骤的妙处在于，每当你创建一个新的自由形状，你也就创造了一个新图案。可以稍加尝试，并像我稍后在“创建按钮”一节中讨论的那样，使用渐变、斜角和浮雕效果，以及像我稍后在“使用霓虹效果”一节中讨论的那样，应用一些霓虹效果。\n\
  \n**提示**  \n你可以将在`InDesign`中创建的对象与其它 Creative Cloud 编辑程序（如`Adobe Illustrator`和`Photoshop`）共享。选择`窗口\
  \ ➤ CC 库`。将对象拖到`CC 库面板`中。在其他 Creative Cloud 程序中，打开`库面板`，将对象拖放到你的文档中。你无法在其他程序中分解或扩展该对象，但当你在其他程序的布局中需要通用设计元素时，可以使用这些对象。\n\
  \n## 使用路径查找器\n\n在`路径查找器面板`中，你可以找到路径查找器选项和转换点选项。对于路径查找器选项，你需要两个或更多对象才能使用面板中的五个选项。对于转换点选项，你需要选择路径上的一个或多个点来应用四个选项之一。\n\
  \n要理解路径查找器选项，你需要对路径有一个基本的了解。当你使用`钢笔`工具 (`P`) 绘制路径，并使用`直接选择`工具 (`A`) 选中该路径时，你会看到整个路径、锚点（显示为路径上的微小白色方块）、线段（锚点之间的路径）、方向线（当选中某个锚点时）、方向点（方向线的末端）以及端点（路径末端的点）（见图\
  \ 4-27）。\n\n![A432409_1_En_4_Fig27_HTML.jpg](img/A432409_1_En_4_Fig27_HTML.jpg)\n\
  \n图 4-27. 路径由若干组件构成\n\n使用`路径查找器面板`，你可以修改形状之间的相互关系。`路径查找器面板`中的选项包括：\n\n*   **合并：**\
  \ 选择两个对象，单击此选项，这些对象将合并成一个单一对象。\n*   **减去顶层：** 此选项会减去最前面的对象。当对象被减去时，底部的对象看起来像是被挖空了一样。\n\
  *   **交集：** 在两个对象重叠处，`交集`选项会删除交集周围的所有内容。\n*   **排除重叠：** 对象相交的区域会从对象中删除。\n*   **减去底层：**\
  \ 此选项与`减去顶层`相反。最底部的对象会被删除。\n\n在图 4-28 中，你可以看到使用每个路径查找器选项后的结果。\n\n![A432409_1_En_4_Fig28_HTML.jpg](img/A432409_1_En_4_Fig28_HTML.jpg)\n\
  \n图 4-28. 路径查找器选项有五种可选\n\n### 使用转换点选项\n\n在`路径查找器面板`中，针对转换点的四个选项包括：\n\n*   **普通：**\
  \ 选择路径上的点，单击此选项可消除方向线。\n*   **转角：** 默认情况下，方向线有两半（或两侧）。当你移动一个方向点时，方向线的两半/两侧都会移动。你可以分割方向线，使得只有一半/侧能独立于另一半移动。选择曲线路径上的一个点，单击此工具。锚点将变为独立的方向线。\n\
  *   **平滑：** 选择一个角点（没有方向线），单击此选项，即可将该点转换为带有方向线的平滑点。\n*   **对称：** 将选定的点更改为带有方向线的平滑点。\n\
  \n## 使用脚本\n\n有几个脚本支持在`InDesign`中绘制对象。要查看这些脚本，请打开`脚本面板`（`窗口 ➤ 实用程序 ➤ 脚本`）。当`脚本面板`打开时，你会找到一个`应用程序`文件夹。从`应用程序`向下钻取到`示例`，再到`JavaScript`。这里有许多脚本可用于协助处理对象。\n\
  \n#### 添加辅助线\n\n要执行脚本，请在`脚本面板`中双击脚本名称。选择一个对象，然后双击脚本名称 (`AddGuides`)。此时会打开`添加辅助线`对话框。你可以为对象添加辅助线以确定其中心，方法是在对话框中取消选中不必要的复选框，只启用`水平中心`和`垂直中心`。单击`确定`，辅助线便会添加到所选对象的水平和垂直中心，如图\
  \ 4-29 所示。\n\n![A432409_1_En_4_Fig29_HTML.jpg](img/A432409_1_En_4_Fig29_HTML.jpg)\n\
  \n图 4-29. 使用`AddGuides`脚本为选定对象的中心添加辅助线\n\n#### 添加点\n\n`AddPoints`脚本在路径上的对象中点处添加点。绘制一个形状，然后在`脚本面板`中双击该脚本名称。锚点将被添加到现有节点之间。\n\
  \n#### 创建角效果\n\n选择一个形状，然后双击`CornerEffects`脚本。会打开一个`角效果`对话框，你可以在其中选择五种角效果中的任意一种。你可以设置`偏移`量，并选择要将效果应用于哪些角。\n\
  \n#### 使用霓虹效果\n\n`Neon`是一个精巧的脚本。你可以在描边上使用此效果。绘制一条描边或一个对象，然后双击`Neon`脚本。`Neon`对话框将会打开。在`Neon`对话框中，你可以选择渐变的步数，并定义起点（`从`），以及`描边颜色`、`描边粗细`和`描边色调`。你可以为终点（`到`）选择`描边粗细`和`描边色调`的选项，并选择目标图层或为霓虹效果创建一个新图层。单击`确定`，霓虹效果便会应用于对象的描边或路径上。在图\
  \ 4-30 中，你可以看到应用于对象和描边的霓虹效果结果。\n\n![A432409_1_En_4_Fig30_HTML.jpg](img/A432409_1_En_4_Fig30_HTML.jpg)\n\
  \n图 4-30. 选择一条描边或路径，然后运行`Neon`脚本，在描边上创建霓虹效果\n\n\n\n#### 使用路径效果\n\n`PathEffects`脚本为您提供了多种转换形状的选项——类似于\
  \ Photoshop 中的滤镜。选择一个形状，然后双击`PathEffects`脚本，即可打开`PathEffects`对话框。在您想要创建的效果类型中，共有九种选择。在图\
  \ 4-31 中，您可以看到这九种效果应用于三角形、正方形、椭圆和多边形的示例。\n\n![A432409_1_En_4_Fig31_HTML.jpg](img/A432409_1_En_4_Fig31_HTML.jpg)\n\
  \n*图 4-31. `PathEffects`脚本让您能在选定对象上创建九种不同的效果*\n\n### 复制与对齐对象\n\n在页面上添加对象后，您通常需要复制、旋转或倾斜它，而面对多个对象时，您常常需要对齐或分布它们。幸运的是，InDesign\
  \ 为您提供了多种完成所有这些任务的工具和方法。\n\n#### 了解变换的基本要素\n\n在我们深入探讨如何创建变换之前，有两件重要的事情需要了解。第一，使用`Alt/⌥`键可以复制操作结果。如果您按住`Alt/⌥`键并单击拖动一个对象，您就复制了它。当您在`控制面板`中按住`Alt/⌥`键并单击某个变换工具时，同样会复制对象。请记住，当您对\
  \ InDesign 对象应用许多操作时，如果同时使用`Alt/⌥`键，就会复制这些对象。\n\n第二件需要了解的事情是，当您变换对象时，变换是基于当前活动参考点进行的。在页面上绘制一个对象，然后查看`控制面板`的左上角。您会看到一个正方形，其中心、四个角和各边的中点处都有小方块。这些就是您变换对象时将使用的参考点。在图\
  \ 4-32 中，活动参考点是中心。因此，如果我旋转一个对象，旋转将以中心锚点为基准进行。如果我单击左上角的参考点，旋转则以左上角锚点为基准进行。\n\n![A432409_1_En_4_Fig32_HTML.jpg](img/A432409_1_En_4_Fig32_HTML.jpg)\n\
  \n*图 4-32. 中心的方块为黑色，表示当前活动参考点位于中心*\n\n您并不局限于在`控制面板`中选择参考点的九种选项。当您在`工具面板`中选择一个变换工具后，可以在选定对象上的任意位置单击。此时会显示一个带有四条互成\
  \ 90°虚线的微小虚线圆，指示出参考点。再次单击，该图标将移动到新的位置。\n\n当您对对象应用变换时，首要任务是选择参考点。如果您想在变换的同时复制对象，请按住`Alt/⌥`键并单击您想要的变换工具。\n\
  \n#### 复制对象\n\n在 InDesign 中，复制项目有多种方法。传统的`剪切`、`复制`和`粘贴`、`原位粘贴`以及`粘贴入`命令只是其中几种复制方式。我们知道，当您按住`Alt/⌥`键并拖动对象时，您也能创建一个副本。\n\
  \n##### 使用“复制”命令\n\n请注意，在`编辑`菜单中有一个`复制`命令。假设您通过`Alt/⌥`拖动复制了一个项目，然后选择邻近的另一个对象并选择`编辑\
  \ ➤ 复制`，第二个对象会被复制，并放置在与第一次复制相同的水平（或垂直）平面上。在图 4-33 中，左侧是一个我通过`Alt/⌥`并垂直向下拖动复制的对象。当我选择第一行中的第二个对象并选择`编辑\
  \ ➤ 复制`时，第二个项目被复制，并放置在与第一个复制对象相同的水平位置上（见图 4-33 右侧）。\n\n![A432409_1_En_4_Fig33_HTML.jpg](img/A432409_1_En_4_Fig33_HTML.jpg)\n\
  \n*图 4-33. 复制一个对象后，选择另一个对象并选择`编辑 ➤ 复制`*\n\nInDesign 会记住偏移值，因此您可以移动到不同页面，选择对象，然后选择`编辑\
  \ ➤ 复制`。复制出的对象将定位在相同的偏移位置上。\n\n##### 使用“步长和重复”\n\n要复制多个对象，您可以使用`编辑 ➤ 步长和重复`命令。在页面上选择一个对象，然后选择`编辑\
  \ ➤ 步长和重复`。将打开`步长和重复`对话框，如图 4-34 所示。\n\n![A432409_1_En_4_Fig34_HTML.jpg](img/A432409_1_En_4_Fig34_HTML.jpg)\n\
  \n*图 4-34. 选择一个对象，然后选择`步长和重复`以打开`步长和重复`对话框*\n\n在`步长和重复`对话框中，您可以沿着列或行复制对象，也可以创建包含多列和多行的网格。当您启用`预览`复选框时，偏移值很容易确定。当您更改偏移值时，您会看到结果的动态预览。当您以正确的偏移值创建出所需数量的副本时，请单击`确定`。\n\
  \n##### 使用快捷键复制\n\n单击一个对象，按住`Alt/⌥`键，然后点击并拖动到新位置。松开`Alt/⌥`键，但保持鼠标按钮按下。用另一只手按`上箭头键`可垂直创建副本，按`右箭头键`可水平创建副本（见图\
  \ 4-35）。您可以多次按`上箭头键`和`右箭头键`来创建一个类似于使用`步长和重复`时创建的网格。\n\n![A432409_1_En_4_Fig35_HTML.jpg](img/A432409_1_En_4_Fig35_HTML.jpg)\n\
  \n*图 4-35. 按住`Alt/⌥`键并将对象拖动到新位置。松开`Alt/⌥`键，然后按`上箭头键`和`右箭头键`*\n\n在 InDesign 术语中，像图\
  \ 4-35 那样在一个网格中创建多个对象通常被称为*网格化*。\n\n##### 使用精确测量值复制\n\n假设您想要复制一个或多个对象，并使副本出现在原始对象下方\
  \ 300 像素的位置。首先要做的是在`控制面板`中设置参考点——比如设置为左上角。然后看参考点的右侧，您会看到两个文本框。这些就是`X`和`Y` `位置`文本框。\n\
  \n要向下移动对象，请使用`Y 位置`文本框。将光标移到右侧，并通过单击`链`形链接来取消设置的关联（见图 4-36）。在`Y 位置`文本框中输入`+300`。按住`Alt/⌥`键并按`Enter/Return`键。通过按住`Alt/⌥`，该项目被复制，如图\
  \ 4-36 所示。\n\n![A432409_1_En_4_Fig36_HTML.jpg](img/A432409_1_En_4_Fig36_HTML.jpg)\n\
  \n*图 4-36. 在`X`或`Y 位置`文本框中输入一个值，然后按`Alt+Enter/Return`*\n\n\n\n### 4.5.3 对齐与分布对象\n\
  \n当你在页面上创建多个对象时，经常需要对它们进行对齐和/或分布，尤其是在你没有使用“步长和重复”或“网格化组”功能，而是手动添加对象的情况下。\n\n要使用对齐和分布工具，请打开“对齐”面板。选择\
  \ `窗口 ➤ 对象和版面 ➤ 对齐`，或按 `Shift+F7`，即可打开“对齐”面板，如图 4-37 所示。你也可以使用控制面板中的对齐和分布选项。\n\n\
  ![A432409_1_En_4_Fig37_HTML.jpg](img/A432409_1_En_4_Fig37_HTML.jpg)\n\n图 4-37. 选择\
  \ `窗口 ➤ 对象和版面 ➤ 对齐` 或按 `Shift+F7` 以打开“对齐”面板\n\n**注**：如果你没有看到图 4-37 中显示的所有选项，请打开面板菜单并选择\
  \ `显示选项`。\n\n在“对齐”面板的顶部有两行图标。第一行图标用于对齐对象。你可以选择左对齐、水平居中对齐、右对齐、顶对齐、垂直居中对齐和底对齐。第二行图标用于分布对象，其选项与第一行图标基本相同。分布对象时，还有一个用于设置对象间距的额外选项。启用\
  \ `使用间距` 复选框，并在文本字段中输入你希望对象之间的间距值。\n\n在“对齐”面板中，一个重要的选择是告诉 InDesign 你要以什么为基准进行对齐。点击\
  \ `对齐依据` 图标，可以打开一个下拉菜单。菜单中有五种不同的选择。通常情况下，你会希望将对象对齐到选区，这是默认选项。然而，有时你可能需要将对象对齐到页面边距、页面或跨页。\n\
  \n在 `对齐依据` 菜单中，另一个选择是“对齐关键对象”。当你选中多个对象，然后再次点击其中一个对象时，该对象即被指定为关键对象。关键对象会显示一个粗边框。默认的关键对象是最上方、最左侧、最下方或最右侧的对象。假设你有几个在页面上垂直位置不同的对象，如图\
  \ 4-38 所示。如果你选中所有对象并希望顶对齐，最上方的对象就是默认的关键对象。然而，如果你希望将所有这些对象与第三个对象对齐，你可以再次点击第三个对象，将其设为关键对象。这样，所有其他对象都会移动到第三个对象的垂直位置。\n\
  \n![A432409_1_En_4_Fig38_HTML.jpg](img/A432409_1_En_4_Fig38_HTML.jpg)\n\n图 4-38.\
  \ 在选中的对象组中按 `Ctrl/⌘` 键以指定关键对象\n\n在“对齐”面板的底部，你可以看到“分布间距”选项。这里有两个图标。左侧图标用于垂直间距，右侧图标用于水平间距。启用\
  \ `使用间距` 复选框，并在文本框中输入一个间距值。\n\n**注**：所有文本要么包含在路径上，要么包含在框架内。路径和框架都是对象；因此，你可以同样使用对齐选项来对齐文本框和路径上的文本。\n\
  \n## 4.6 变换对象\n\nInDesign 提供了用于变换对象的工具和菜单命令。你可以使用“工具”面板、“变换”面板、“控制”面板、`对象 ➤ 变换`\
  \ 和 `对象 ➤ 再次变换` 命令来以多种方式变换对象。\n\n### 4.6.1 使用工具面板\n\n在“工具”面板中，你可以找到四个变换工具，包括：\n\n\
  *   **自由变换工具** (`E`)：选择该工具或按键盘上的 `E` 键。“自由变换工具”允许你以不同方式变换对象。拖动手柄可以缩放对象。将工具移动到手柄外侧并拖动可以旋转对象。将手柄拖过对侧或对向手柄可以翻转对象。轻微拖动一个手柄，然后按\
  \ `Ctrl/⌘` 键并拖动可以倾斜对象。按 `Ctrl/⌘+Alt/⌥` 键并拖动可以从对象两侧进行倾斜。\n*   **旋转工具** (`R`)：长按“自由变换工具”上的鼠标按钮，打开工具弹出菜单。选择“旋转工具”或按键盘上的\
  \ `R` 键。在控制面板中设置参考点，然后点击并绕参考点拖动以进行旋转。\n*   **缩放工具** (`S`)：首先设置参考点，然后点击该工具或按键盘上的\
  \ `S` 键，并拖动一个手柄以缩放对象。\n*   **倾斜工具** (`O`)：设置参考点，然后点击该工具或按键盘上的 `O` 键，并拖动以倾斜对象。\n\n\
  ### 4.6.2 使用变换面板\n\n选择 `窗口 ➤ 对象和版面 ➤ 变换` 以打开“变换”面板。在该面板中，你拥有工具和菜单命令的组合来处理变换，如图 4-39\
  \ 所示。\n\n![A432409_1_En_4_Fig39_HTML.jpg](img/A432409_1_En_4_Fig39_HTML.jpg)\n\n\
  图 4-39. 选择 `窗口 ➤ 对象和版面 ➤ 变换` 以打开“变换”面板\n\n注意，在“变换”面板中，你可以设置参考点并应用不同的变换。`X`, `Y`\
  \ 文本框是对象在页面上的水平和垂直位置。你可以编辑这些值来将对象移动到不同位置。`W` 和 `H` 文本框用于设置对象的宽度和高度。右侧和下方的箭头文本框用于按百分比缩放对象。最后两项是按角度旋转和按百分比缩放的选项。\n\
  \n面板上方三分之二部分的菜单选项是你可以使用变换工具和控制面板工具应用的变换。底部部分对于确定如何处理描边和效果缩放至关重要。默认情况下，所有选项都是启用的。\n\
  \n### 4.6.3 使用控制面板\n\n在控制面板中，你拥有与“变换”面板中非常相似的选项。你可以按百分比缩放、按角度旋转和倾斜、顺时针和逆时针旋转，以及水平或垂直翻转对象。在控制面板中变换工具的右侧，你会看到一个大的\
  \ `P` 字符。默认情况下，该字符垂直显示，类似于你在文本框内键入字符时的样子。如果你应用了变换，该字符会模仿变换的类型。例如，如果你水平翻转一个对象，该字符也会水平翻转。要清除所有变换，请右键单击控制面板中的\
  \ `P` 字符，然后选择 `清除变换`。\n\n如果你想在变换对象的同时复制对象，请按住 `Alt/⌥` 键并点击控制面板中的变换工具。例如，在图 4-40\
  \ 中，你可以在打开的文档（左侧）中看到一个三角形。如果你想复制并翻转该三角形，使其显示为图 4-40 右侧所示的样子，请按住 `Alt/⌥` 键并点击 `水平翻转`\
  \ 工具。当然，在这个例子中，我会在执行变换之前，将我的参考点设置到中间右侧。\n\n![A432409_1_En_4_Fig40_HTML.jpg](img/A432409_1_En_4_Fig40_HTML.jpg)\n\
  \n图 4-40. 按住 `Alt/⌥` 键并点击控制面板中的变换选项，可同时进行复制与变换\n\n\n\n### 4.6.4 使用菜单命令\n\n`InDesign`\
  \ 提供了两个包含变换相关命令的菜单项。`对象 ➤ 变换` 菜单中包含的变换命令，与 `工具面板` 和 `变换面板` 中的类似。选择 `移动`、`缩放`、`旋转`\
  \ 和 `切变` 会打开各自的对话框，你可以在其中输入该变换类型的数值。\n\n当你选择 `对象 ➤ 再次变换` 时，会看到四个菜单项。这些菜单命令代表了实现变换的一些真正强大功能。选中一个对象并将其旋转\
  \ 30° 是个不错的功能，但算不上令人印象深刻。复制一个对象并将其旋转 10° 也不错，但同样不算出彩。\n\n然而，如果你想缩放一个对象、旋转 30° 并稍微移动它，而你还有\
  \ 15 个对象需要应用相同的缩放、旋转和移动变换时，情况会怎样？这正是这些菜单命令大显身手的地方，它们相当令人印象深刻。\n\n在图 4-41 中，你可以看到我对每行第一个黑色对象进行变换后，应用于五个红色对象的变换效果。我没有复制红色对象，而是使用了\
  \ `再次变换` 菜单命令。以下是操作方法的说明。\n\n1.  **再次变换。** 在第一行中，我按 `Alt/⌥` 键将第二个对象向右拖动。然后我执行了 `对象\
  \ ➤ 再次变换 ➤ 再次变换` 菜单命令。此命令将重复对对象执行的最后一次变换。\n2.  **再次变换。** 在第二行中，我应用了相同的命令。不过，这次我稍微旋转了黑色对象，选中了第二行中的五个红色对象，然后选择了\
  \ `对象 ➤ 再次变换 ➤ 再次变换`。请注意，所有五个红色对象作为一个整体一起旋转了。\n3.  **逐个再次变换。** 在第三行中，我旋转了黑色对象，选中了五个红色对象，然后选择了\
  \ `对象 ➤ 再次变换 ➤ 逐个再次变换`。此操作会变换这些对象，并且它们保持在同一垂直位置。\n4.  **再次变换序列。** 在第四行中，我应用了多个变换。我缩放并旋转了黑色对象，然后将其向下移动了一点。我应用了\
  \ `对象 ➤ 再次变换 ➤ 再次变换序列` 命令。请注意，右侧红色对象上出现了与 `再次变换` 类似的阶梯效果。\n5.  **逐个再次变换序列。** 在最后一行，我对第一列中的黑色对象应用了相同的缩放、旋转和移动变换。我选中了最后一行中的五个红色对象，然后选择了\
  \ `对象 ➤ 再次变换 ➤ 逐个再次变换序列`。此菜单命令会复制变换和移动效果，并且所有对象都位于相同的垂直位置。\n\n![A432409_1_En_4_Fig41_HTML.jpg](img/A432409_1_En_4_Fig41_HTML.jpg)\n\
  \n图 4-41. 使用 `再次变换` 菜单命令的效果\n\n请注意，在 `再次变换` 子菜单中，唯一有键盘快捷键的项是 `再次变换序列` 命令。在大多数工作会话中，你会发现这个命令是你最常用的。当你需要使用\
  \ `逐个再次变换序列` 时，则需要使用菜单命令。你使用此命令的频率可能远低于按 `Ctrl/⌘+Alt/⌥+4` 来变换一个序列。\n\n## 4.7 应用效果与透明度\n\
  \n`InDesign` 中可对对象和导入文件进行的另一类功能丰富的编辑，体现在 `效果面板` 中提供的众多选项上。你可以对图像和对象应用透明度、添加投影、应用斜角、发光和羽化，以创建惊人的效果。此外，你还拥有许多在其他程序（如\
  \ `Illustrator` 和 `Photoshop`）中才能找到的混合模式。\n\n你可以将文本转换为轮廓并修改锚点来改变字体的形状，还可以创建文字蒙版，使图像和对象显示在文字字符内部。你可以创建复合路径、封闭路径，并使用\
  \ `路径查找器` 选项来添加、减去和连接路径。总而言之，`InDesign` 为你提供了许多工具和菜单命令，帮助你实现设计作品中所需的艺术构想。\n\n###\
  \ 4.7.1 探索 InDesign 效果\n\n为图像、对象和文本添加效果，能为设计带来生命力，例如投影、3D 效果、发光和透明度，这些效果对于数字出版物和印刷品同等重要。除了在数字出版文档中使用的明显设计特性外，效果还能帮助你为图标和元素增添一丝精致感，这些元素可能用于更改对象状态、播放媒体或跳转到超链接目标。\n\
  \n\n### 4.7.2 使用`效果`面板\n\n要开启学习并使用 InDesign 效果之旅，你需要先熟悉`效果`面板。要打开`效果`面板，请选择`窗口 ➤\
  \ 效果`。`效果`面板随即打开，如图 4-42 所示。\n\n![A432409_1_En_4_Fig42_HTML.jpg](img/A432409_1_En_4_Fig42_HTML.jpg)\n\
  \n图 4-42. 选择`窗口 ➤ 效果`以打开`效果`面板\n\n在`效果`面板中，你将找到以下选项：\n\n- **混合模式**：打开显示有`正常`的下拉菜单。InDesign\
  \ 中的混合模式与 Adobe Illustrator 中的相同。Adobe Photoshop 中有更多混合模式，但 InDesign 中提供的模式足以让你以多种不同方式按堆叠顺序混合对象。\n\
  - **不透明度**：向左移动滑块，或在文本框中输入数值，即可为所选对象添加透明度。此设置的效果与使用`对象 ➤ 效果 ➤ 透明度`命令或从`效果`面板菜单中选择`透明度`相同。\n\
  - **目标**：你首先需要决定的是要针对哪个目标应用效果或透明度。InDesign 为你提供了四个选项：\n    - **对象**：`对象`项及其后的三项允许你针对不同区域。选择`对象`可将透明度和效果应用于整个对象。\n\
  \    - **描边**：如果你有一个框架，可以针对描边（而非填充和对象本身）仅对描边应用效果和透明度。\n    - **填充**：如果你有一个框架，并希望仅对填充应用效果或透明度，请选择此项。\n\
  \    - **文本**：选择一个文本框架，即可对框架中的所有文本应用效果或透明度。\n- **隔离混合**：当你更改对象的混合模式并将其与下方的对象混合时（例如使用`正片叠底`使堆叠顶部的对象变暗），堆叠中所有下方的项目都会受到该混合模式的影响。假设你有三个项目彼此堆叠。你对最顶部的项目应用了`正片叠底`混合模式。该混合模式会穿透堆叠中的每个项目，并对所有项目应用相同的混合。如果你想混合堆叠中的前两个项目，需要先将它们编组。然后启用`隔离混合`复选框。前两个已编组项目下方的所有项目将不受影响且不会发生混合。在图\
  \ 4-43 中，你可以看到应用 `正片叠底` 混合模式时*不*启用（左）和*启用*（右）隔离混合的效果。\n\n![A432409_1_En_4_Fig43_HTML.jpg](img/A432409_1_En_4_Fig43_HTML.jpg)\n\
  \n图 4-43. 未启用与启用隔离混合时添加混合模式的效果\n\n- **挖空组**：使用此选项可挖空所选组中每个项目的不透明度和混合属性。在某种程度上，这类似于创建复合路径。当你绘制两个同心圆，选择它们，然后选择`复合路径`时，中心圆会变得透明——就像一个甜甜圈。`挖空组`在使用透明度和效果时行为类似。\n\
  - **Fx**：当你对某个项目应用效果后，会注意到 `fx` 图标出现在`效果`面板的右上角。当你想将同一效果应用于另一个对象时，请单击并拖动 `fx` 图标到该对象上。目标对象会采用在`效果`面板中为第一个对象创建的相同格式。在某种程度上，这类似于使用对象样式。\n\
  - **效果面板菜单**：`效果`面板菜单中的选项包括：\n    - **隐藏选项**：选择此项可缩小`效果`面板尺寸，隐藏`隔离混合`和`挖空组`复选框。\n\
  \    - **效果**：其子菜单列出了所有可以应用于项目的不同效果（见图 4-44）。选择任意一个子菜单命令，将打开`效果`窗口，如图 4-45 所示。\n\
  \n![A432409_1_En_4_Fig45_HTML.jpg](img/A432409_1_En_4_Fig45_HTML.jpg)\n\n图 4-45.\
  \ 在`效果`窗口中点击`斜面和浮雕`\n\n![A432409_1_En_4_Fig44_HTML.jpg](img/A432409_1_En_4_Fig44_HTML.jpg)\n\
  \n图 4-44. 点击`效果`子菜单中的任一项目以打开`效果`窗口\n\n    - **清除效果**：清除应用于某个项目的所有效果。\n    - **清除所有透明度**：清除所选对象上的所有透明度。\n\
  \    - **全局光**：选择此项时，将打开`全局光`对话框。你有两个选项：`角度`和`高度`。`角度`设置是光源的方向。`高度`用于调整光的强度。当你创建一个效果并在`效果`窗口中使用了`全局光`，然后将此项目复制并粘贴到另一个\
  \ InDesign 文档中（该文档已通过此对话框设置了`全局光`），粘贴的对象将继承你在该文档中的设置。仅当你希望版式中所有对象的光照方向和强度一致时，才使用此选项。\n\
  \    - **面板底部的按钮包括**：\n        - **清除所有效果并使对象不透明**：单击此图标可移除效果和透明度。\n        - **fx**：单击以打开`效果`选项的下拉菜单。此菜单与在`效果`面板菜单和`控制面板`菜单中访问到的菜单相同。\n\
  \        - **垃圾筒**：选择一个项目并点击以清除效果。如果该项目应用了任何透明度，则透明度保持不变。\n\n在常规工作流程中，你打开`效果`面板，选择目标，然后使用面板菜单或下拉`fx`菜单，选择所需效果。\n\
  \n### 4.7.3 使用`效果`窗口\n\n`效果`窗口中可供你使用的选项和开关数量之多，远非本章所能详述。你在窗口左窗格中可以选择的十个项目，会根据你选择的项目显示不同的选项。例如，当选中`斜面和浮雕`项目时，查看一下`效果`菜单，如图\
  \ 4-45 所示。你会在窗口的右上方看到一个用于`样式`的菜单。你可以在此选择要应用的斜面与浮雕类型。该菜单下方是`方法`菜单，其中有更多选择，再往下是`方向`菜单，也有更多选择。你可以找到用于控制大小、柔化和深度的文本框。窗口右下半部分提供了角度和高度、高光和阴影、混合模式以及不透明度设置的选项。\n\
  \n点击左列中的另一个项目以选择其他类型的效果，窗口会提供不同的选项。当你第一次打开`效果`窗口时，可能会感到眼花缭乱甚至有些望而生畏。\n\n目前，请记住这个窗口是所有操作发生的地方，当你想应用某个效果时，就是在这里设置所需效果的属性。我们将在本节稍后部分探讨其中一些效果。\n\
  \n\n\n### 4.7.4 创建投影\n\n打开“效果”面板菜单并选择“效果”时，请注意子菜单中唯一带有键盘快捷键的效果是“投影”。创建投影是目前为止 InDesign\
  \ 版面设计师使用最频繁的效果。\n\n你可以为设计中的任何对象（文本、图像、对象、描边、路径等）应用投影。要添加投影，请选中对象并按 `Ctrl/⌘+Alt/⌥+M`，或从“效果”面板的\
  \ `fx` 菜单中选择“投影”。\n\n此时“效果”窗口会打开，并在左侧窗格中选中“投影”。默认情况下，不透明度设置为 75%。我建议你在创建投影时，将其不透明度降低到\
  \ 35–40%。我很少使用不透明度为 75% 的投影。你想要实现的效果是简洁而优雅。投影并非主角，它们只是辅助性的“配角”，帮助将聚光灯投射到主要对象上。添加投影是为了给你的文本或对象带来一丝生机与立体感。\n\
  \n在图 4-46 中，你可以看到我为一些文本应用投影时使用的设置。当启用了“预览”复选框时，你在“效果”窗口中进行调整的同时，可以看到调整效果的动态预览。\n\
  \n![A432409_1_En_4_Fig46_HTML.jpg](img/A432409_1_En_4_Fig46_HTML.jpg)\n\n图 4-46.\
  \ 启用了“预览”复选框的文本投影\n\n在图 4-46 中，我将不透明度设置为 35% 以淡化阴影。投影的默认混合模式是“正片叠底”。我保留了默认的混合模式，但通过点击“模式”菜单旁边的色板，并从“色板”面板中选择了一种蓝色，从而更改了投影的颜色。\n\
  \n我将“大小”距离设置为 5 像素，使阴影更靠近文字，但将“扩展”设置为 10%，以便将边缘更远地融合开来。“杂色”设置是你应该会在许多效果中用到的一项。对于印刷，你可以将杂色数量设置为\
  \ 1 或 2 像素。对于屏幕显示，请将“杂色”设置为 5 像素。这会在阴影中添加少量杂色，使其看起来不那么生硬。\n\n对于屏幕显示，你无需担心“对象使阴影挖空”选项。第二个复选框用于多种效果。例如，如果你同时应用了投影和斜面和浮雕效果，则应启用“阴影与其他效果交互”复选框。\n\
  \n### 4.7.5 创建按钮\n\n继投影之后，InDesign 用户第二常用的效果是“斜面和浮雕”。在为数字出版准备文档时，你会发现 InDesign 中“斜面和浮雕”效果有很多用途。其最常见的用途之一便是创建自定义按钮。你可以使用按钮来设置超链接操作（如我在第\
  \ 7 章所述）、启动动画（如我在第 8 章所述）、更改对象状态（如我在第 6 章所述），或为媒体创建播放/暂停/停止按钮（如我在第 10 章所述）。\n\n\
  #### 4.7.5.1 调整斜面和浮雕选项\n\nInDesign 在“按钮和表单”面板中提供了许多默认按钮，但当你可以使用 InDesign 效果创建一些更有趣的按钮时，为何还要使用\
  \ InDesign 自带的按钮呢？\n\n要创建带有斜面和浮雕效果的按钮，请选择一个对象或在页面上绘制一个对象。为对象应用颜色填充。在我的示例中，我给一个椭圆应用了非常浅的灰色。在大多数情况下，对于白色对象，你应该添加一点黑色，而不是直接使用纯白色。接下来，打开“效果”面板（`Ctrl+Shift+F10`），并从“效果”面板的\
  \ `fx` 下拉菜单中选择“斜面和浮雕”。\n\n对于我的按钮，我使用了“内斜面”，并将“大小”设置为 4 像素，“软化”设置为 6 像素，“方法”设置为“平滑”，方向保留默认的“向上”。在“着色”部分，我希望光源从顶部照射，因此将“角度”设置为\
  \ 90°。\n\n“高度”调整就像是在高光和阴影之间取得平衡。当你在“高度”文本框中将值提高到 70–80 这样的较高数值时，阴影会变亮，并且在高光区域会出现一点光泽。我将“高光”和“阴影”的不透明度都设置为\
  \ 70°，如图 4-47 所示。\n\n![A432409_1_En_4_Fig47_HTML.jpg](img/A432409_1_En_4_Fig47_HTML.jpg)\n\
  \n图 4-47. 应用于椭圆的斜面和浮雕选项设置\n\n#### 4.7.5.2 添加内阴影\n\n你不必将效果限制于仅应用在一个对象上。在完成斜面和浮雕设置后，你可以选择“效果”左侧窗格中的任意项目并添加更多效果。在图\
  \ 4-48 中，你可以看到在添加了斜面和浮雕效果后，又对同一个对象应用了轻微的内阴影。我将不透明度设置为 17%，距离值设置为 1 像素，并在“选项”区域中将“大小”和“阻塞”分别设置为\
  \ 7 像素和 20%。“阻塞”可以使内阴影边缘更硬朗，看起来羽化程度更低，从而在对象内部形成一点环形效果。\n\n![A432409_1_En_4_Fig48_HTML.jpg](img/A432409_1_En_4_Fig48_HTML.jpg)\n\
  \n图 4-48. 内阴影效果使用的选项\n\n“内阴影”效果窗格中的最后一个设置是“杂色”。在图 4-48 中，你可以看到我为“内阴影”使用的选项。\n\n\
  #### 4.7.5.3 为带有斜面和浮雕效果的对象添加投影\n\n天哪！如果不添加投影，我们还能做什么呢？设计师喜欢在各种对象上使用投影。所以，我们就不与他们争论了，并给我们的按钮再添加一个效果。不过，我们的投影将是一个非常轻微的效果——刚好足以暗示对象从页面上微微浮起，并在其周围添加阴影。\n\
  \n通过在左侧窗格中点击“投影”，从“内阴影”效果切换到“投影”。我首先将不透明度设置为 35%，以淡化阴影（默认值为 70%）。然后我将“距离”和 Y 偏移量都仅设置为\
  \ 3 像素。\n\n在“效果”面板的“选项”区域中，我将“大小”设置为 5 像素，“扩展”设置为 2%，并添加了 5% 的“杂色”。在“投影”效果的右侧，你会找到一个“阴影与其他效果交互”复选框。在此示例中，启用该复选框不会产生太大区别，但在使用其他效果时，你可能会发现它很有必要。例如，如果你在椭圆形状上看到一个大的方形投影，你可能就需要启用此复选框。作为一项原则，我通常会启用它，除非明显没有必要。\n\
  \n在图 4-49 中，你可以看到我在已应用其他效果的基础上添加投影所使用的设置。请注意，你应用到对象上的所有效果的复选框都已被启用。\n\n![A432409_1_En_4_Fig49_HTML.jpg](img/A432409_1_En_4_Fig49_HTML.jpg)\n\
  \n图 4-49. 投影效果的选项设置\n\n请记住，在应用效果时，大多数情况下并没有绝对的对错。这最终取决于你个人对所创建效果的构想，以及你认为对象上的效果在你整体设计中的契合程度。我在这里提供了一些我使用的设置选项，但你的品味可能大不相同。这完全没问题。这是你自己的设计，你可以自由地进行实验，并按自己的意愿创建效果。\n\
  \n\n\n#### 4.7.5.4 复制效果\n\n到目前为止，我创建了一个按钮，并为其应用了斜面和浮雕、内阴影以及投影效果。假设我想将这个按钮用作设计中的媒体播放按钮。我有一个指向右方的三角形形状，它能提示观众点击或轻触按钮后会发生什么操作。但我想将按钮上的相同效果也应用到三角形上。\n\
  \n在 InDesign 中，这很简单。你无需选中三角形并逐一设置所有效果。只需选中带有效果的按钮，并在打开“效果”面板的情况下，将面板右上角的 `fx` 图标拖拽到三角形（或任何其他你想要复制效果的对象）上。当你将\
  \ `fx` 图标拖向目标对象时，会看到光标变为带有 `+` 符号的手形图标。看到光标变化时，松开鼠标按钮——瞧，所有应用于按钮的效果都会同样应用到目标对象上。\n\
  \n将第二个对象移动到按钮的中心，然后选中这两个对象，按下 `Ctrl/⌘+G` 将它们编组。如图 4-50 所示的图形现在就可以转换为按钮了。有关创建按钮的更多信息，请参见第\
  \ 9 章。\n\n![A432409_1_En_4_Fig50_HTML.jpg](img/A432409_1_En_4_Fig50_HTML.jpg)\n\n\
  图 4-50.\n\n将“效果”面板中的 `fx` 图标拖拽到其他对象上，以应用复制的效果\n\n### 4.7.6 创建双斜面效果\n\n使用效果时的一个限制是，你无法对文本的填充和描边分别应用不同的效果。\n\
  \n请看图 4-51。在这个示例中，我想添加一个 20 磅的描边，并且希望斜面和浮雕以及投影效果仅应用于文本本身，而非描边。要实现这种效果，我需要创建两个对象并将它们叠放在一起。\n\
  \n![A432409_1_En_4_Fig51_HTML.jpg](img/A432409_1_En_4_Fig51_HTML.jpg)\n\n图 4-51.\n\
  \n当你在堆叠中拥有两个对象时，即可获得双斜面和浮雕效果。\n创建双斜面效果\n\n要了解如何创建这种效果，请按照以下步骤操作：\n\n1. 在页面上的文本框架中添加一些文本。创建文本后，双击其中一个手柄，使框架紧密贴合文本。\n\
  2. 选中文本框架，在“效果”面板中单击“文本”，然后应用斜面和浮雕效果。根据你的喜好使用选项。在我的示例中，我使用了内斜面，选择了“凿刻硬边”，并将“大小”设置为\
  \ 2。我将“阴影角度”设置为 90°，“高度”设置为 60°，并将“高光”和“阴影”的“不透明度”都设置为 100%。\n3. 应用投影。同样，使用你想要的投影设置，但让阴影看起来非常微妙。在我的示例中，我将阴影“不透明度”设置为\
  \ 40%，将“距离”设置为 5 磅，“角度”设置为 90°。我将“Y 偏移”设置为 1 磅，以使阴影紧贴文本。我将“大小”设置为 2 像素，“扩展”设置为 7%，并添加了\
  \ 5% 的“杂色”。\n4. 复制带有效果的文本。\n5. 就地粘贴。选择 `编辑 > 就地粘贴`，将副本直接粘贴到原文本的正上方。\n6. 添加描边。我想给文本添加一个非常粗的描边。双击文本以在文本中获取插入点，然后按下\
  \ `Ctrl/⌘+A` 选中所有文本。请务必要选中文本，而不是框架。打开“描边”面板并设置描边的大小。在我的示例中，我将描边大小设置为 20 磅。\n7. 为描边添加颜色。不要为描边颜色使用纯纸色，而是添加一点黑色。在我的示例中，我为描边颜色添加了\
  \ 5% 的黑色。\n8. 设置堆叠顺序。带有描边的副本需要位于应用了斜面和浮雕的文本之后。按下 `Ctrl/⌘` 键并单击以选中位于最底层的对象。右键单击打开上下文菜单，选择\
  \ `对象 > 排列 > 置于顶层`。\n9. 为文本添加颜色。在我的示例中，我为文本应用了渐变。\n\n由于我们没有从文本创建轮廓，因此文本仍然是可编辑的。你可以编辑堆叠中的两个对象，并轻松地更改文本。\n\
  \n### 4.7.7 挖空文本\n\n当你想要创建类型蒙版时，在“效果”面板中使用“挖空组”非常有用。在图 4-52 中，我使用的类型被挖空了，并通过文字显示出其背后的图像——就像类型蒙版一样。\n\
  \n![A432409_1_En_4_Fig52_HTML.jpg](img/A432409_1_En_4_Fig52_HTML.jpg)\n\n图 4-52.\n\
  \n文本被挖空，在文字内部显示图像\n挖空文本\n\n要实现这种效果，请执行以下操作：\n\n1. 在图像上绘制一个框架或矩形。\n2. 选中框架，然后在框架内单击“文字”工具。要调整偏移和对齐，你可以选择\
  \ `对象 > 文本框架选项` 并编辑偏移和垂直对齐。\n3. 设置框架颜色。你可以为框架使用纸色填充，或使用 5% 的黑色填充。\n4. 更改文本颜色。将用于框架的相同颜色应用于文本。在我的示例中，我使用了\
  \ 5% 的黑色填充，因此我选中文本并对其应用 5% 的黑色填充。\n5. 选择“格式效果容器”（`J`）。在“色板”面板中，单击面板顶部色板旁边的 `T` 图标以设置“格式效果容器”，或者按下键盘上的\
  \ `J` 键。\n6. 打开“效果”面板，将文本混合模式设置为“正片叠底”。在“效果”面板中，你可以选择多个对象。在“对象”列表的底部是“文本”。单击“文本”，然后从下拉菜单中选择“正片叠底”，如图\
  \ 4-53 所示。\n\n   ![A432409_1_En_4_Fig53_HTML.jpg](img/A432409_1_En_4_Fig53_HTML.jpg)\n\
  \n   图 4-53.\n\n   选择文本对象，并在“效果”面板中选择“正片叠底”\n7. 挖空组。单击“效果”面板中的“对象”，然后启用“挖空组”复选框。\n\
  \n同样，文本是可编辑的。你可以通过在文本中设置文本插入光标，按下 `Ctrl/⌘+A` 全选所有文本，然后输入新文本来更改文本。新文本将保留挖空组效果。\n\n\
  ### 4.7.8 反射文字\n\n你见过一些很酷的文字效果，比如带有渐变的反射文字。它看起来像是文字在水面、玻璃、草坪或许多其他背景上逐渐淡出成倒影。别再羡慕那些能创作出酷炫效果的人了。现在你可以将反射文字添加到你的设计中，比如你在图\
  \ 4-54 中看到的相当简单的效果。\n\n![A432409_1_En_4_Fig54_HTML.jpg](img/A432409_1_En_4_Fig54_HTML.jpg)\n\
  \n图 4-54.\n\n带有反射效果的文字\n创建反射文字效果\n\n要创建反射文字效果，请按照以下步骤操作：\n\n1. 创建一个文本框架并添加一些文字。使用“选择”工具双击其中一个手柄，使框架紧密贴合文字。\n\
  2. 设置参考点。单击“控制”面板中参考点的底部中间方格。\n3. 反射文字的副本。按下 `Alt/⌥` 键，然后单击“控制”面板中的“垂直翻转”工具。\n4.\
  \ 检查文字的位置。放大到文字（`Ctrl/⌘+空格键`），并在页面周围拖拽以查看文字。如果反射的文字没有接触到上方的文字，请使用“上方向键”微调，使两个框架中的文字彼此接触。\n\
  5. 创建渐变羽化。单击“工具”面板中的“渐变羽化”工具，或按下 `Shift+G`。从反射文字的顶部向下拖拽以创建渐变。如果你不喜欢渐变效果，可以再次单击并拖拽。重复此操作，直到渐变效果令你满意。\n\
  6. 倾斜反射的文字。不要忘记在“控制”面板中设置参考点。将控制点设置为顶部中心。选择“切变”工具，然后从文字下方的中心位置向左单击并拖拽。\n\n这个示例是创建反射文字的一个简单任务。当你想在不同背景上反射文字，并为文字使用不同颜色时，可以遵循相同的步骤。\n\
  \n\n\n### 4.7.9 创建 3D 箭头\n\n在 3D 对象方面，InDesign 无法与 Adobe Illustrator 和 Adobe Photoshop\
  \ 中能创建出的 3D 效果相媲美。不过，你仍可运用一些技巧来创建 3D 对象和透视图。你所需要的只是一点诀窍和想象力。\n\n3D 对象会带给观者一种跃然纸上的感觉。通过在数字出版文档中添加\
  \ 3D 对象，你可以吸引用户对内容及按钮操作的注意力。以图 4-55 为例。文档的读者应该能一目了然地看出，点击或轻按箭头右侧的徽标和 URL 会跳转到公司网站。由于\
  \ URL 指定了一个目标位置，大多数人会凭直觉知道，点击或轻按此区域很可能会将浏览者带到该超链接的目标位置。\n\n![A432409_1_En_4_Fig55_HTML.jpg](img/A432409_1_En_4_Fig55_HTML.jpg)\n\
  \n**图 4-55.** 3D 对象可以吸引读者对某种交互形式的注意\n\n图 4-55 中的 3D 箭头是一个夸张的提示，表明页面上存在超链接。像这样的效果是一些小技巧，你可以利用它们轻松地将读者的注意力吸引到某种交互上。\n\
  \n#### 创建 3D 箭头\n\n以下是我用来创建 3D 箭头的一些步骤：\n\n1.  创建一个椭圆。椭圆的高度应与图 4-55 中看到的类似。\n2.\
  \  复制/原位粘贴。复制椭圆，选择**编辑** ➤ **原位粘贴**，或按 `Ctrl/⌘+Alt/⌥+V`。\n3.  将形状转换为矩形。选择粘贴的副本，选择**对象**\
  \ ➤ **转换形状** ➤ **矩形**。\n4.  将矩形的左边缘移至椭圆的中点。通过向右拖动矩形来实现。使用选择箭头移动形状。按住**Shift**键以约束水平移动。矩形的左侧应与下方椭圆的中点对齐，如图\
  \ 4-56 所示。\n\n![A432409_1_En_4_Fig56_HTML.jpg](img/A432409_1_En_4_Fig56_HTML.jpg)\n\
  \n**图 4-56.** 将矩形的左边缘移动到椭圆的中点\n\n5.  合并形状。选中两个形状，打开**路径查找器面板**（**窗口** ➤ **对象和版面**\
  \ ➤ **路径查找器**）。在路径查找器面板中单击**添加**图标。\n6.  复制对象。\n7.  将视图中的对象发送到底层。此时，文档中应有一个框架。将该对象发送到框架后面。\n\
  8.  锁定对象或将其隐藏在一个图层上。选中对象，选择**对象** ➤ **锁定**，或按 `Ctrl/⌘+L`。这样做的目的是，在接下来的几步操作中，杜绝任何意外选中该对象的可能。\n\
  9.  原位粘贴。复制的对象仍在剪贴板上。选择**编辑** ➤ **原位粘贴**，或按 `Ctrl/⌘+Alt/⌥+V`。\n10. 删除粘贴对象底部的两个点。单击**直接选择**工具（或按键盘上的\
  \ `A` 键）。单击对象以显示锚点。选中右下角的点，按住**Shift**键，再点击下边的中点。按**Delete**键，此时对象应如图 4-57 所示。\n\
  \n![A432409_1_En_4_Fig57_HTML.jpg](img/A432409_1_En_4_Fig57_HTML.jpg)\n\n**图 4-57.**\
  \ 删除底部两个点\n\n11. 复制一个对象副本。按住 `Alt/⌥` 键并将对象向上拖动约 50 点。\n12. 使用**直接选择**工具选择两个形状上的左端两个点。按键盘上的\
  \ `A` 键激活直接选择工具，然后框选两个形状上的左边两个点。\n13. 打开路径查找器面板，单击**连接路径**工具。\n14. 为两个对象应用渐变填充。通过渐变填充在两个对象之间创造细微区别，使其表现出一定的深度感，如图\
  \ 4-58 所示。\n\n![A432409_1_En_4_Fig58_HTML.jpg](img/A432409_1_En_4_Fig58_HTML.jpg)\n\
  \n**图 4-58.** 对两个对象应用渐变\n\n15. 绘制箭头头部。绘制一个正方形，然后选择**对象** ➤ **转换形状** ➤ **三角形**。选中该对象，单击控制面板中的**顺时针旋转\
  \ 90°**工具。\n16. 合并对象。将箭头头部移动到形状的右侧。同时选中三角形和前景的形状，然后在路径查找器面板中单击**添加**图标。为了让箭头头部更精致一点，单击顶部和底部的锚点，然后按几次**向左箭头键**，使其看起来更像箭头头部，如图\
  \ 4-59 所示。\n\n![A432409_1_En_4_Fig59_HTML.jpg](img/A432409_1_En_4_Fig59_HTML.jpg)\n\
  \n**图 4-59.** 某些文字效果需要先将文字转换为轮廓\n\n如果需要调整对象大小，请使用**选择箭头**工具单击并拖动控制手柄。如果你使用 `Shift+拖动`，别忘了在控制面板中启用**自动调整**。\n\
  \n### 4.7.10 将文字轮廓镂空\n\n到目前为止，我们探讨了如何使用实时文字来实现几种效果。在某些情况下，你需要在应用效果之前将文字转换为轮廓。一个例子是，当你使用重叠的框架，并且希望镂空背景框架中的文字时。使用实时文字无法创建这种效果。\n\
  \n文档中的任何文字都可以转换为轮廓，这意味着文字不再可编辑，而是变成了包含路径和锚点的图形。通常，你应该尽量减少将文字转换为轮廓，尤其是在创建可重排的 EPUB\
  \ 时。内容提供者希望文字是活的，以便可以被搜索，并且读者可以在可重排的 EPUB 中更改字体和字号。\n\n添加一些转换为轮廓的文字（例如章节标题和特殊效果）可以通过内容提供者的审核。但是，在创建可重排的\
  \ EPUB 时，你需要将这些文字的数量控制在最低限度。\n\n在图 4-59 中，你看到的效果中，将文字转换为轮廓是必要的。该图像有一个边框，并且文字的顶部跟随边框的颜色，仿佛应用了描边一样。然而，图像外部的文字却没有显示描边。\n\
  \n#### 将文字轮廓镂空\n\n创建类似图 4-59 的效果相当容易。你只需注意正确的编辑顺序。让我们看看如何创建这种效果：\n\n1.  在 InDesign\
  \ 页面中置入一张图像。按 `Ctrl/⌘+D` 打开**置入**对话框，找到你想要置入的图像。在置入对话框中选择它，然后单击**打开**。\n2.  为框架添加描边。这一步很重要。你必须为图形框架添加描边。打开**描边面板**，应用一个较大的描边——比如\
  \ 6 点。\n3.  添加一个文字框架。输入文字，并将文字向下移动，使文字的顶部稍微覆盖在描边之上。\n4.  将文字转换为轮廓。选中文字框架，选择**文字**\
  \ ➤ **创建轮廓**。\n5.  复制文字轮廓。\n6.  从背景（图像）中减去最前面的对象（文字轮廓）。选中文字和图像，在**路径查找器面板**中单击**减去**图标（左起第二个）。\n\
  7.  原位粘贴。\n8.  选择**编辑** ➤ **原位粘贴**（`Ctrl/⌘+Alt/⌥+V`）。\n\n如果你严格遵循了这些步骤，你应该会看到与图 4-59\
  \ 所示类似的效果。\n\n\n\n### 创建拼图效果\n\n在 Photoshop 和 Photoshop Elements 中，你可以使用拼图效果，将一张照片分割开来，创建出一种每块拼图都可以移动、变换并应用各种效果的拼图效果。\n\
  \n在 InDesign 中，你也可以创建一种拼图效果。但是，你无法创建任意形状的拼图块。你在 InDesign 中能创建的拼图效果会生成一个方形网格。然后你可以将网格拆分开来并应用效果。在图\
  \ 4-60 中，你会看到在 InDesign 文档中创建的拼图效果。\n\n![A432409_1_En_4_Fig60_HTML.jpg](img/A432409_1_En_4_Fig60_HTML.jpg)\n\
  \n图 4-60.\n\n你可以直接在 InDesign 中创建拼图效果 创建拼图效果\n\n要创建此效果，你需要借助脚本。使用脚本时，网格的分割部分会断开，你就可以移动和变换这些拼图块。请按照以下步骤创建类似效果：\n\
  \n1. 在 InDesign 页面中放置一张照片。\n2. 双击 `MakeGrid` 脚本。选中图像并打开“脚本”面板。打开“应用程序”文件夹，然后打开“示例”文件夹，最后打开“JavaScript”文件夹。向下滚动找到\
  \ `MakeGrid`。双击 `MakeGrid` 脚本。此时会打开 `MakeGrid` 对话框。\n3. 设置网格属性。将行数和列数设置为网格中所需的数量。在我的示例中，我使用了九行和五列。将行距和列距设置为\
  \ 0（零）。点击“确定”，网格便创建完成。\n4. 添加投影（可选）。投影可以让各个拼图块易于区分。选中所有拼图块，打开“效果”面板，然后从 `fx` 下拉菜单中选择“投影”。在“投影”窗口中，将“距离”设置为\
  \ 0，并将“大小”设置为 3 像素。点击“确定”，网格便会显示出细微的分割线，如图 4-61 所示。\n\n    ![A432409_1_En_4_Fig61_HTML.jpg](img/A432409_1_En_4_Fig61_HTML.jpg)\n\
  \n    图 4-61.\n\n    添加投影以便看到分割线\n\n5. 移动、缩放和/或旋转单个拼图块。每个拼图块都是可选中的。使用“选择”工具按照你的喜好移动、缩放和旋转拼图块。\n\
  \n### 创建复古风格\n\n如果你是 1983 年以后出生的，你的阁楼里可能没有存放任何宝丽来照片。如果你和我一样是个老家伙，你可能有一堆宝丽来照片，以及幻灯片、底片和照片打印件，希望有一天能扫描并转换成数字形式。\n\
  \n如果你无法扫描宝丽来照片，你可以使用 InDesign 中的各种效果来创建宝丽来外观，使用描边并在描边中添加一点黑色（大约 5–7%），使填充看起来略带灰色。我喜欢使用原始的宝丽来照片并进行扫描。扫描的图像会带上一些灰尘和淀粉颗粒，这能增添一点复古感。\n\
  \n在图 4-62 中，你可以看到一张我手头有的宝丽来照片。我扫描了这张照片，使边框与原始照片完全一致。照片上有一些污点，但我想再添加一点。于是我在左下角放置了一个咖啡渍的\
  \ Photoshop 文件，并将透明度设置为 40%。\n\n![A432409_1_En_4_Fig62_HTML.jpg](img/A432409_1_En_4_Fig62_HTML.jpg)\n\
  \n图 4-62.\n\n宝丽来照片非常适合营造复古风格\n\n我想在边框上添加一张不同的照片，于是我在旧照片收藏中翻找，找到了一张几年前与圣诞老人的旧照片。我画了一个框架，将照片放在宝丽来扫描图的上方，然后通过选择\
  \ `对象 ➤ 排列 ➤ 置于顶层` 将咖啡渍移到堆叠顺序的最上面。\n\n我应用了投影，并将不透明度设置为 40%，距离设置为 2 像素，角度设置为 90°，大小设置为\
  \ 5 像素，扩展设置为 7%，并添加了 5% 的噪点。\n\n像这样添加一张照片，可能适合用于通过 Adobe Publish Online 发送给家人和朋友的设计的圣诞贺卡。要了解如何使用\
  \ Publish Online，请查看第 14 章。\n\n本章讨论的各种效果只是冰山一角。效果面板中有如此多的选项，不可能在这里全部涵盖。有关更多信息，并发现使用\
  \ InDesign 效果可以做的许多酷炫事情，请搜索互联网。首先，可以访问 [`www.indesignsecrets.com`](http://www.indesignsecrets.com)\
  \ 网站，浏览 David Blatner、Anne-Marie Concepcion 及其贡献者发布的众多文章。还可以查看 Adobe 发布的许多帮助文档和视频。作为起点，请访问\
  \ InDesign 效果介绍：[`https://helpx.adobe.com/indesign/how-to/create-special-effects.html`](https://helpx.adobe.com/indesign/how-to/create-special-effects.html).\n\
  \n## 使用链接面板\n\n在 InDesign 中置入对象时，这些文件会链接到存储原始对象的硬盘驱动器或其他源位置。如果你移动、编辑或删除了源图像，则当你打开包含这些链接的文件时，InDesign\
  \ 会打开一个警报对话框。\n\n在“链接”面板中，你可以找到文档中置入的所有对象的列表。如果你在“正常”模式下查看文档并显示框架边缘，则已缺失或已修改的链接会在放置图像的每个框架中显示警告图标或缺失图标（红色问号圆圈）。已修改对象和缺失对象也会显示在“链接”面板中，如图\
  \ 4-63 所示。\n\n![A432409_1_En_4_Fig63_HTML.jpg](img/A432409_1_En_4_Fig63_HTML.jpg)\n\
  \n图 4-63.\n\n缺失和已修改的链接显示在文档页面和“链接”面板中\n\n黄色警告图标表示链接对象在导入 InDesign 后被修改过。你可以通过单击文档窗口中的警告图标或双击“链接”面板中的图标来轻松更新链接。\n\
  \n红色问号圆圈表示 InDesign 找不到文件位置。你可能已将对象移动到了其他源、其他文件夹或硬盘上的其他位置。\n\n若要重新链接缺失文件，请单击文档窗口中的缺失图标，双击“链接”面板中的缺失图标，或单击“链接”面板底部的“重新链接”图标（显示为链条）。双击缺失图标或使用其他查找链接的方法时，会打开“定位”对话框。导航到链接文件所在的位置，选择该文件，然后单击“打开”。\n\
  \n## 打包文件\n\n有时你可能会在一个文档中导入许多对象，而这些对象可能分散在你的硬盘各处。如果在放置对象之前没有将每个对象添加到一个共同的文件夹，那么这可能会造成组织上的噩梦。\n\
  \n一旦检查了“链接”面板并确认文档没有缺失或已修改的链接，请选择 `文件 ➤ 打包`。InDesign 会打开一个摘要屏幕，并报告文档中发现的任何错误。如果一切正常，请单击“打包”对话框底部的“打包”按钮。\n\
  \n单击“打包”后，下一个窗格用于打印说明。如果这些信息对你没有帮助，请单击“继续”。最后一个屏幕是“打包出版物”屏幕。选择目标位置并单击“打包”。InDesign\
  \ 会将你的文档、所有链接的资源以及所有文档字体添加到一个共同的文件夹中。\n\n\n\n### 4.10 本章小结\n\n通过阅读本章，您可以看到 InDesign\
  \ 为您提供了丰富的功能和方法来处理对象和图像。您学习了如何导入图像、在 InDesign 中创建图形、为对象和形状应用自定义设置，以及多种显示图形的方法。\n\
  \n在下一章中，我们将介绍表格的使用。您将学习如何格式化表格单元格和整个表格、在表格中使用文本和图像，以及为表格添加交互功能。\n\n"
- "# 5. 创建表格\n\n如果您在 90 年代初上网冲浪，您会在网景浏览器中看到大量表格。颜色通常非常单调，使用的是我称之为“网景灰”（红、绿、蓝均设置为 128，产生中灰色）的颜色。那时的网站在图形化方面不如今天这么吸引人，我们也没有\
  \ CSS（层叠样式表）。但早期的 HTML 版本确实提供了创建表格的标签来显示表格数据，借助 `border=0` 标签，网页设计师可以创建网格布局。那些早期的网页设计可以使用\
  \ HTML 表格标签来更简洁地显示表格数据，而不是仅仅在段落标签内添加文本。\n\n有些人可能会争辩说，自 1996 年底 CSS 出现以来，由于 `Div`\
  \ 标签和 CSS 的存在，网页设计师可以避免在网页设计中使用表格，这样做在很大程度上是可避免的。\n\n然而，当谈到在 InDesign 中创建的表格时，版面设计师的艺术天赋可以达到新的高度。对象的基础可能是一个表格，但表格数据的外观可以通过如此多的创意方式来表达，以至于结果看起来都不像表格了。\n\
  \n为了深入探讨一些表格的创意使用方法，首先您需要了解 InDesign 表格的基础知识。之后，我们可以探索多种变化，并着眼于超越传统表格设计，实现更有趣的布局。\n\
  \n在本章中，我将讨论创建表格的基础知识以及如何格式化表格单元格。然后，我会继续介绍一些创意方法，帮助您创建更具动态性和趣味性的表格设计。\n\n## 5.1\
  \ 理解表格的基础知识\n\n您需要理解的一个重要的基本概念是，表格与文本及所有其他对象一样，都存在于框架内。这一点很好，因为如果您有一个想要跨页或多页显示的表格，您可以单击框架的导出端口，导航到另一页，然后点击以扩展表格。\n\
  \n就像文本框一样，包含表格的框架中可能存在溢出的文本，在普通视图模式下查看文档时，您会看到一个溢出标记。您也可以控制拐角设计，就像我们在第 4 章中介绍的图形对象那样。当您选择一个框架时，单击黄色方块，四个菱形图标会出现在拐角处。可以一起或单独移动菱形以更改拐角选项。按下\
  \ `Ctrl/⌘+Alt/⌥` 并单击黄色菱形可以更改拐角效果。（有关编辑拐角的更多信息，请参阅第 4 章。）尽管表格确实有拐角控制功能，但最好还是在表格后面创建一个框架并应用拐角效果。如果表格单元格中有数据，拐角效果可能会干扰数据。\n\
  \n您还可以通过缩放、倾斜和反射来变换表格。使用第 4 章中描述的方法对表格进行变换。您可以在表格单元格中放置图形对象、格式化单元格内的文本，以及为表格单元格添加描边。您可以将对象锚定到单个单元格，也可以在文本框内锚定表格。\n\
  \n要将表格锚定到文本框，请单击框架顶部的蓝色方块并将其拖动到文本框中所需的位置。按住 `Shift` 并拖动，可使对象成为文本框中的内联对象；或按住 `Alt/⌥`\
  \ 并拖动，以打开“锚定对象选项”对话框。\n\n## 5.2 掌握表格指南\n\n处理表格时，您需要做的第一件事就是创建表格。InDesign 为您提供了四种创建表格的方法。您可以使用菜单命令、将现有文本转换为表格，以及从电子表格或文字处理程序导入数据。我们来看看每种方法。\n\
  \n**创建表格**\n\n1.  使用表格填充边距参考线。在页面上未选择任何内容的情况下，打开“表格”菜单并选择“创建表格”。将打开“创建表格”对话框，如图\
  \ 5-1 所示。在“创建表格”对话框中，您可以设置行数和列数，并指示是否需要表头行和/或表尾行。如果您有表格样式（如我在第 6 章中所述），您可以从“表格样式”下拉菜单中选择该样式。单击“确定”，光标将加载表格枪。\n\
  \n    ![A432409_1_En_5_Fig1_HTML.jpg](img/A432409_1_En_5_Fig1_HTML.jpg)\n\n    图\
  \ 5-1。从“表格”菜单中选择“创建表格”，将打开“创建表格”对话框\n\n2.  单击文档页面。如果您在边距参考线顶部附近单击，表格将填充边距参考线之间的区域，如图\
  \ 5-2 左侧所示。\n\n    ![A432409_1_En_5_Fig2_HTML.jpg](img/A432409_1_En_5_Fig2_HTML.jpg)\n\
  \n    图 5-2。单击并拖动以为表格设置自定义大小\n\n3.  为新表格指定大小。此项目与您创建表格的第一种方法类似。在您希望表格出现的文本框中的某处单击。然后选择\
  \ `表格 ➤ 插入表格`，在“创建表格”对话框中指定表格属性，然后单击“确定”。\n\n4.  将文本转换为表格。您可以将在 InDesign 中键入或置入的文本转换为表格。选择要转换为表格的文本，然后选择\
  \ `表格 ➤ 将文本转换为表格`。将打开“将文本转换为表格”对话框，如图 5-3 所示。在此对话框中，您可以选择列分隔符和行分隔符。\n\n    ![A432409_1_En_5_Fig3_HTML.jpg](img/A432409_1_En_5_Fig3_HTML.jpg)\n\
  \n    图 5-3。选择列数和行数以及列分隔符，然后单击“确定”\n\n5.  如果文本由逗号分隔，且每行末尾有回车符，请从“列分隔符”下拉菜单中选择“逗号”。将“行分隔符”保留为默认的“段落”选项。同样，如果文本包含制表符，请为“列分隔符”选择“制表符”。\n\
  \n6.  单击“确定”，InDesign 会将文本转换为表格。\n\n7.  导入数据。在 InDesign 中创建表格的最后一种方法是从文本文档导入文本。您可以导入仅保存为纯文本的文件以及\
  \ RTF 文件，但数据的转换效果不如导入 Microsoft Excel 文件那么整齐。您也可以使用 CSV 格式导入文件，但同样不如导入 Excel 电子表格那么清晰。如果您使用\
  \ OpenOffice 和 IBM Lotus Symphony 等开源应用程序，则需要将文件保存为 Excel 格式。\n\n8.  您使用 `文件 ➤ 置入`\
  \ 命令来导入电子表格数据。您可以选择两种方式之一来处理数据。将数据作为静态文本块导入，或者选择将数据链接到电子表格。如果您希望链接数据，以便每次在电子表格应用程序中进行编辑时，InDesign\
  \ 中的数据都能更新，则需要调整首选项设置。\n\n9.  按 `Ctrl/⌘+K` 打开 InDesign 首选项。单击左侧窗格中的“文件处理”。在右侧窗格中，启用“置入文本和电子表格文件时创建链接”复选框，如图\
  \ 5-4 所示。置入数据文件并单击“确定”，将打开“导入选项”对话框。\n\n    ![A432409_1_En_5_Fig4_HTML.jpg](img/A432409_1_En_5_Fig4_HTML.jpg)\n\
  \n    图 5-4。选择列数和行数，然后单击“确定”\n\n\n\n在图 5-5 中，你会看到对话框的标题显示为`Microsoft Excel Import\
  \ Options`，括号内包含文件名。对话框的标题会根据你选择导入的文件类型而变化。\n\n![A432409_1_En_5_Fig5_HTML.jpg](img/A432409_1_En_5_Fig5_HTML.jpg)\n\
  \n图 5-5. 导入 Excel 电子表格时的导入选项\n\n在`Import Options`对话框中，你可以为工作簿中的工作表、单元格区域以及一些格式选项做出选择。点击`OK`，表格数据便会作为表格导入。如果你将表格与数据链接，那么对原始电子表格进行任何更改后，可能需要更新该链接。关于链接对象的更多信息，请参见第\
  \ 4 章。\n\n## 5.3 使用表格工具与命令\n\n你首先会注意到菜单栏中有一个`Table`菜单，这表明你拥有许多与表格相关的命令。`InDesign`为你提供了一系列专门用于处理表格的命令，它们整齐地放置在`Table`菜单中，如图\
  \ 5-6 所示。\n\n![A432409_1_En_5_Fig6_HTML.jpg](img/A432409_1_En_5_Fig6_HTML.jpg)\n\
  \n图 5-6. 单击菜单栏中的`Table`以打开表格菜单\n\n与`InDesign`中的许多其他功能类似，`Control Panel`中也有许多与菜单命令相同的选项。此外，当你选中一个表格或表格中的某个单元格时，可以右键单击鼠标打开一个上下文菜单，从而轻松访问许多表格命令。\n\
  \n### 5.3.1 使用表格菜单\n\n在深入探讨`Table`菜单中的命令之前，你应该知道，自`InDesign CC 2015`起，存在两种不同类型的表格单元格：文本单元格和图形单元格。显然，当你在单元格中输入文本时，该单元格会被解释为文本单元格；当你在单元格中置入图形时，该单元格会被转换为图形单元格。话虽如此，让我们来看看在`InDesign`中可用于格式化表格的一些`Table`菜单命令。\n\
  \n#### 5.3.1.1 使用表格选项\n\n在`Table`菜单的`Table Options`子菜单中，你拥有多个选项。要使用子菜单选项，你必须先选中表格。你可以将类型工具点击在某个单元格中，此时子菜单命令便会激活。你也可以将光标移动到表格的左上角，当光标变为一个\
  \ 45 度角的箭头时，单击即可选中整个表格。\n\n使用上述任一方法，然后选择`Table` ➤ `Table Options`，并选择任意一个子菜单项，或者按`Ctrl/⌘+Alt/⌥+Shift+B`组合键，即可打开`Table\
  \ Options`对话框，如图 5-7 所示。请注意，在对话框顶部，你会看到对应五个子菜单项的选项卡。因此，无论你选择哪个子菜单项，通过选择一个`Table\
  \ Options`子菜单命令或按`Ctrl/⌘+Shift+B`组合键，你都能访问所有这些选项卡。\n\n![A432409_1_En_5_Fig7_HTML.jpg](img/A432409_1_En_5_Fig7_HTML.jpg)\n\
  \n图 5-7. 按`Ctrl/⌘+Shift+B`组合键，打开`Table Options`对话框\n\n`Table Options`对话框中有五个选项卡。当你选择`Table\
  \ Setup`子菜单命令或按`Ctrl/⌘+Alt/⌥+Shift+B`组合键时，默认打开的是`Table Setup`选项卡。\n\n*   **`Table\
  \ Setup`（表格设置）**：你可以在`Table Dimensions`（表格尺寸）区域更改行数和列数，并添加表头行和表尾行。对于表格边框，需指定边框的粗细、颜色和描边类型。你可以创建间隙并使用纸色填充（如果你的背景是白色），这样设计就不会看起来像表格。\n\
  \    *   将`Table Spacing`（表格间距）保持为默认值。如果你希望在文本框架内的表格前后添加间距，请使用段落样式，我将在第 6 章中解释。在`Draw`（绘制）下拉菜单中，你可以选择将行和列的单元格描边显示在`Front`（前面）。\n\
  *   **`Row Strokes`（行描边）**：此选项卡中的设置与列行的描边相关，如图 5-8 所示。在`Alternating Pattern`（交替模式）下拉菜单中，你可以交替显示行的描边模式（例如为交替的行应用不同的描边或颜色）。`InDesign`允许你将模式应用于每隔一至三行。如果你想交替超过三行，请选择`Custom`（自定义）。\n\
  \n    ![A432409_1_En_5_Fig8_HTML.jpg](img/A432409_1_En_5_Fig8_HTML.jpg)\n\n    图\
  \ 5-8. 在`Table Options`对话框中点击`Row Strokes`选项卡\n    *   **`First/Next`（第一行/下一行）**：如果你想交替超过三行，请在文本框中输入一个值，`Alternating\
  \ Pattern`将变为`Custom Row`。对于`Type`（类型）、`Color`（颜色）和`Tint`（色调），从下拉菜单中选择`Stroke`（描边）样式，在`Color`下拉菜单中为交替行选择颜色，并在`Tint`文本框中更改颜色色调值。如果你希望行之间使用默认`Paper`（纸色）以外的间隙颜色，请从下拉菜单中选择一种颜色。\n\
  \    *   **`Gap Color/Tint`（间隙颜色/色调）**：这些设置仅适用于条纹、点线和虚线描边。如果你使用的是实线描边样式，则下拉菜单不可用。为条纹、虚线和点之间的间隙选择颜色和色调。\n\
  \    *   **`Skip First/Last`（跳过第一行/最后一行）**：编辑文本框中的数值，以指定模式中要跳过的行数。\n    *   **`Preserve\
  \ Local Formatting`（保留局部格式）**：如果你希望之前应用于表格的格式化描边保持有效，请启用此复选框。\n*   **`Column Strokes`（列描边）**：`Column\
  \ Strokes`选项卡提供与`Row Strokes`选项卡相同的选项，只是这些设置应用于列描边。\n*   **`Fills`（填充）**：对于单元格填充，你有类似于行描边的选项。你可以选择交替模式、从下拉菜单中选择颜色、对选中的颜色应用色调，并跳过第一行/最后一行。\n\
  *   **`Headers and Footers`（表头与表尾）**：在最后一个选项卡中，你拥有添加一个或多个表头行和/或表尾行的选项。当表格跨列或跨页拆分时，使用表头和表尾尤其有用。如果你在此选项卡中添加了表头和/或表尾，表格的每个拆分部分都会显示它们。\n\
  \n\n\n#### 5.3.1.2 设置单元格选项\n\n选择 `表格 ➤ 单元格选项 ➤ 文本` 或按 `Ctrl/⌘+Alt/⌥+B` 时，将打开`单元格选项`对话框并显示在`文本`选项卡。单元格选项与表格选项类似，对话框顶部有多个选项卡，如图\
  \ 5-9 所示。在此对话框中进行的所有设置都将应用于选定的表格单元格。\n\n- **文本**：`文本`选项卡包含单元格内文本的选项。您可以为文本添加偏移值、垂直对齐文本、偏移文本基线、将内容裁剪到单元格以及旋转文本。\n\
  - **图形**：表格单元格可以是文本单元格或图形单元格。单击`图形`选项卡，您可以对图形单元格进行调整，例如调整内嵌值和将内容裁剪到单元格。\n- **描边和填色**：您可以对单个单元格应用描边和填色。与表格描边的区别在于，您可以针对单元格的单个边应用描边和颜色，如图\
  \ 5-10 所示。单击对话框顶部的网格线可以取消选择或重新选择描边。应用描边值或颜色时，选定的描边将受到影响。请注意，您也可以在`控制面板`中选择表格中的描边。\n\
  \n![A432409_1_En_5_Fig10_HTML.jpg](img/A432409_1_En_5_Fig10_HTML.jpg)\n\n*图 5-10。默认情况下，所有描边均处于选中状态。单击某个描边可取消选中，并将描边粗细和颜色应用于其余选中的描边。*\n\
  \n- **行和列**：如果您希望将行高设置为固定值，请打开`行高`下拉菜单并选择`精确`。\n- **对角线**：单击`对角线`选项卡，您可以从四个选项中选择：`无`、从单元格左上角到右下角的\
  \ 45 度角、从单元格左下角到右上角的 45 度角，以及两条对角线（形如 X）。您可以选择将对角线描边置于底层，或使其显示在文本或对象的上方。\n\n![A432409_1_En_5_Fig9_HTML.jpg](img/A432409_1_En_5_Fig9_HTML.jpg)\n\
  \n*图 5-9。按 `Ctrl/⌘+Alt/⌥+B` 键，`单元格选项`对话框将打开。*\n\n#### 5.3.1.3 插入、删除和选择单元格\n\n在`表格`菜单中的`单元格选项`之后，您会找到三个菜单项，分别用于插入行和列；删除行、列和表格；以及选择单元格、行和列，选择页眉行和页脚行，以及选择表格。\n\
  \n#### 5.3.1.4 合并单元格/取消合并单元格\n\n选择表格中的单元格，然后选择 `表格 ➤ 合并单元格`。这些单元格将合并为一个单元格。如果要取消合并单元格，请选择一个合并单元格，然后选择\
  \ `表格 ➤ 取消合并单元格`。\n\n#### 5.3.1.5 水平/垂直拆分单元格\n\n您可以水平和/或垂直拆分单个单元格。当您选择一个单元格并选择任一命令时，该单元格将被均匀拆分。\n\
  \n#### 5.3.1.6 在行前/后粘贴\n\n这些命令与复制到剪贴板的行和列有关。复制一行或一列后，选择在选定的行/列的`前方粘贴`或`后方粘贴`。\n\n\
  #### 5.3.1.7 将单元格转换为图形和文本单元格\n\n要使用这些命令，单元格中不得包含任何文本/图形。选择一个空单元格，然后选择将文本单元格转换为图形单元格或将图形单元格转换为文本单元格。\n\
  \n#### 5.3.1.8 转换行\n\n当您选择 `表格 ➤ 转换行` 时，您会看到三个选项：`转换为页眉行`、`转换为主体行`（主体行是页眉行和页脚行之间的所有行）和\
  \ `转换为页脚行`。\n\n#### 5.3.1.9 均匀分布行/列\n\n选择一个列或行范围，然后选择 `表格 ➤ 均匀分布行`（或`列`）。所选行的高度或列的宽度将均匀分布。\n\
  \n#### 5.3.1.10 导航行\n\n选择一个表格，然后选择 `表格 ➤ 转到行`。将打开`转到行`对话框，如图 5-11 所示。如果您的表格包含页眉和页脚，您会看到一个下拉菜单，您可以在其中选择`主体`、`页眉`和`页脚`。在菜单右侧的文本框中输入一个值，即可跳转到该行。此选项最常用于跨多页的长表格。\n\
  \n![A432409_1_En_5_Fig11_HTML.jpg](img/A432409_1_En_5_Fig11_HTML.jpg)\n\n*图 5-11。选择\
  \ `表格 ➤ 转到行` 可打开`转到行`对话框。*\n\n#### 5.3.1.11 编辑页眉和页脚\n\n`表格`菜单中的最后两个菜单项是`编辑页眉`和`编辑页脚`。当您选择其中一个命令时，相应页眉/页脚的最左侧单元格将被选中。\n\
  \n### 5.3.2 使用控制面板\n\n选择一个或多个单元格或选择一个表格，`控制面板`将会改变，为您提供编辑行、列和单元格的选项。在图 5-12 中，您可以看到选定的表格以及`控制面板`中可用的选项。这些选项是`表格`菜单命令的子集。\n\
  \n![A432409_1_En_5_Fig12_HTML.jpg](img/A432409_1_En_5_Fig12_HTML.jpg)\n\n*图 5-12。选择一个表格，`控制面板`将显示用于编辑表格的选项。*\n\
  \n在`控制面板`中，您将找到以下内容：\n\n- **字体和字体样式**：从下拉菜单中选择字体和字体样式。\n- **字体大小和行距**：单击箭头图标或在相邻文本框中输入数值以更改字体大小和行距。\n\
  - **对齐**：单击八个图标之一可更改所选单元格中的文本对齐方式。\n- **垂直对齐**：单击四个图标之一，可将单元格内的文本垂直对齐到顶部、居中、底部或两端对齐。\n\
  - **文本旋转**：单击四个图标之一，可将文本旋转到图标所示的旋转方向。\n- **行数/列数**：单击文本框左侧的图标可选择文本框中的相应文本。单击箭头键或在文本框中输入数值。\n\
  - **合并/取消合并单元格**：选择两个或多个单元格，然后单击`合并单元格`图标可合并这些单元格。选择一个合并单元格，然后单击`取消合并单元格`图标可取消合并。\n\
  - **描边颜色/填色**：单击右箭头打开一个下拉菜单，显示`色板面板`中的颜色。选择一种颜色应用于单元格填色或描边。\n- **粗细/描边样式**：编辑文本框或为边框和单元格的描边粗细选择一个选项。打开`描边样式`下拉菜单并选择一种描边样式。\n\
  - **目标描边**：该网格与您在单元格选项的描边和填色中看到的图 5-10 相同。单击`控制面板`中您希望从选择的描边属性编辑选项中排除的描边。\n- **单元格和表样式**：这些选项与您为单元格和表格创建的样式有关。有关如何创建和使用单元格和表样式的信息，请参阅第\
  \ 6 章。\n- **列宽和行高调整**：从下拉菜单中选择`精确`可将行高设置为固定值。选择`至少`，然后单击箭头或在文本框中输入文本以调整行和列的大小。\n\
  - **内嵌距**：编辑文本框或单击箭头以调整单元格的上、下、左、右内嵌距。\n\n\n\n## 5.4 创建新表格\n\n上一节“使用表格工具和命令”是一个参考指南，您可以将其标记出来，以便在需要查找创建表格时所用的正确命令或工具时随时翻阅。现在，我们来实际查看工作流程并创建一个表格。\n\
  \n在本练习中，我们将学习如何着手创建并格式化一个简单的表格。在图 5-13 中，您可以看到一个在 InDesign 中创建的相当简单的表格。要创建类似于图中所示的表格，请执行以下操作：\n\
  \n![A432409_1_En_5_Fig13_HTML.jpg](img/A432409_1_En_5_Fig13_HTML.jpg)\n\n图 5-13.\
  \ 在 InDesign 中创建的表格 创建新表格\n\n1.  创建新表格。首先，让我们从头开始创建一个新表格。选择 `表格 -> 创建表格`，或按 `Ctrl/⌘+Alt/⌥+Shift+T`。此时将打开`创建表格`对话框。\n\
  2.  指定行和列。要创建与图 5-13 类似的设计，请在`正文行`中输入 `5`，在`列`中输入 `3`。对于这个简单的表格，我们不需要`表头行`，因此在指定行和列后单击`确定`。\n\
  3.  设置第一行的行高。使用`选择`箭头双击表格，并选中第一行。将光标移至第一行的最左侧，当看到向右的箭头时，单击鼠标。在`控制面板`中，将行高`精确`设置为\
  \ 36 像素（见图 5-14）。\n\n![A432409_1_En_5_Fig14_HTML.jpg](img/A432409_1_En_5_Fig14_HTML.jpg)\n\
  \n图 5-14. 表格粗略设置\n\n4.  将接下来的四行行高设置为 100 像素。单击从第二行到最后一行的左向箭头以选中它们，并再次在`控制面板`中将大小`精确`设置为\
  \ 100 像素（见图 5-15）。\n\n![A432409_1_En_5_Fig15_HTML.jpg](img/A432409_1_En_5_Fig15_HTML.jpg)\n\
  \n图 5-15. 按 `Ctrl/⌘+Shift+T` 打开`制表符标尺`\n\n5.  设置列宽。将光标移至表格顶部并选中第一列。将列宽设置为 100 像素。选中接下来的两列，并将宽度设置为\
  \ 220 像素（见图 5-16）。\n\n![A432409_1_En_5_Fig16_HTML.jpg](img/A432409_1_En_5_Fig16_HTML.jpg)\n\
  \n图 5-16. 单击`控制面板`中的`对齐按钮`工具\n\n6.  将单元格转换为图形单元格。单击`文字`工具，然后单击左侧列的第二行单元格。向下拖动以选中这四个单元格。选择`表格\
  \ -> 将单元格转换为图形单元格`。\n7.  在图形单元格中置入图形对象。您可以使用任何类型的图形——照片、绘图、InDesign 艺术品等等。选择`文件\
  \ -> 置入`，并单击一个图形单元格以将文件置入其中。如果页面上有作品，请将其复制并单击该图形单元格。选择`编辑 -> 粘贴入`。将图形置入第一列的四行中。\n\
  8.  添加一些内联图形。在我的示例中，第二列中有另一个图形。由于该列中也有文本，您可以将图形作为内嵌对象添加。复制一个图形，并单击单元格中的插入点。选择`编辑\
  \ -> 粘贴`或按 `Ctrl/⌘+V`。\n9.  在包含内联图形的单元格中设置制表位。选择`文字 -> 制表符`或按 `Ctrl/⌘+Shift+T` 打开`制表符标尺`。在内联图形的右侧设置一个制表位，如图\
  \ 5-15 所示。将光标单击到其中一个单元格中，然后在 Mac 上按 `Option -> Tab`。在 Windows 上，选择`文字 -> 插入特殊字符\
  \ -> 制表符`。输入一些文本。在我的示例中，我输入了国家名称。\n10. 设置垂直对齐。选中第二列底部的四行，并单击`控制面板`中的`底端对齐`图标，如图\
  \ 5-16 所示。这会将文本和图形对齐到单元格底部。\n11. 向最后一列添加文本。在我的示例中，最后一列的第一行文本是右对齐的。其他行文本是左对齐的。您可以在`控制面板`中设置类型属性，就像对文本框中的任何文字进行设置一样。选中单元格中的第一行文本，并单击`控制面板`中的`右对齐`图标。选中单元格中的其余文本，并单击`控制面板`中的`左对齐`图标。\n\
  12. 向第一行添加反白文字。通过单击第一行左侧的向左箭头选中第一行，并单击`色板面板`中的`前景色`色板。将颜色设置为`黑色`。单击`文字`工具，然后单击第一行的第一个单元格。在`色板面板`中将填充颜色设置为`纸色`，并为第一列输入一个标题（见图\
  \ 5-17）。按 `Tab` 键，为第二列添加文字。再次按 `Tab` 键，为最后一列添加文字。\n\n![A432409_1_En_5_Fig17_HTML.jpg](img/A432409_1_En_5_Fig17_HTML.jpg)\n\
  \n图 5-17. 将行填充颜色设置为黑色，并将文字颜色设置为纸色\n\n13. 设置文字对齐。选中第一行，并单击`控制面板`中的`居中对齐`工具。单击`控制面板`中的`垂直居中`工具以垂直对齐文字。\n\
  14. 添加交替行填充。将光标单击到一个单元格中，或者将光标移到所选表格的左上角，并单击斜向箭头以选中整个表格。选择`表格 -> 表格选项 -> 交替填色`以打开`表格选项`对话框中的`填色`选项卡（见图\
  \ 5-18）。从`交替模式`下拉菜单中选择`每隔一行`。从下拉菜单中选择`第一行`和`下一行`的颜色，并为每个颜色输入一个`色调`值。在`跳过前`文本框中输入\
  \ `1`。单击`确定`，表格看起来应类似于图 5-13 所示。\n\n![A432409_1_En_5_Fig18_HTML.jpg](img/A432409_1_En_5_Fig18_HTML.jpg)\n\
  \n图 5-18. 为交替行单元格填充颜色选择颜色和色调\n\n## 5.5 设计创意图表\n\n与其逐一浏览一系列展示表格数据并说明表格可用选项的表格，不如让我们看看一些设计表格的创意方法，以便将其包含在您的数字出版文档中。\n\
  \n您可以使用第 3 章中介绍的许多功能，我在其中讨论了格式化文本以及将不同的文字格式应用于表格单元格中的文本。您还可以使用我在第 4 章中介绍的许多处理图形的不同技巧。\n\
  \n为了让您的工作更加轻松，使用样式（字符样式、段落样式、图形样式和表格样式）将是您的一大优势。但我还没有开始讨论样式，这是第 6 章的主题。现在，让我们先看一些创建有趣表格的技巧。如果您需要对多个单元格应用编辑时需要使用重复步骤，请先查看第\
  \ 6 章，然后再返回到本章。\n\n\n\n### 5.5.1 圆角与锚定对象\n\n你可以为表格设置圆角；然而，其效果往往难以达到预期。请记住，创建表格时涉及两个不同的对象——表格本身及其容器框架。如果你为容器框架设置了圆角，表格会与框架产生偏移。如果尝试选中表格，你将找不到任何可控制的圆角选项。你需要使用其他方法来创建圆角效果。\n\
  \n在创建表格时，锚定对象非常重要。查看图 5-19。在该表格中，我为第一列中的对象设置了圆角，并将其锚定到文本框。要使单元格同时包含文本和图形，你需要将对象锚定到单元格文本字段。\n\
  \n![A432409_1_En_5_Fig19_HTML.jpg](img/A432409_1_En_5_Fig19_HTML.jpg)\n\n**图 5-19.**\
  \ 一个带有圆角和锚定对象的表格\n\n**注意**\n\n想要查看锚定线，请选择 `视图 ➤ 其他 ➤ 显示文本串接`，或按下 `Ctrl/⌘+Alt/⌥+Y`。你必须在**正常**视图模式下才能看到串接线。\n\
  \n图 5-19 中的圆角应用于一个框架。包含表格的文本框被粘贴到这个框架中（通过 `编辑 > 贴入内部`），从而营造出表格边框带有圆角的外观。由于第 1 列中的对象已被锚定，因此剪切并粘贴表格时会包含所有元素。\n\
  \n在图 5-20 中，你可以看到另一个类似表格的例子。锚定对象是位于单元格交叉点处的菱形。这营造出单元格具有斜角的视觉效果。\n\n![A432409_1_En_5_Fig20_HTML.jpg](img/A432409_1_En_5_Fig20_HTML.jpg)\n\
  \n**图 5-20.** 菱形形状即为锚定对象\n\n**设计创意表格**\n\n以下是我创建该表格的方法。\n\n1.  **创建表格**。我创建了一个六行四列的表格。我将第一行的高度设置为\
  \ 125 像素，第二行设置为 33 像素，其余行设置为 75 像素。最后这个设置非常重要。所有包含菱形的行高度必须相同，稍后我在讨论复制对象时会解释原因。\n\
  2.  **格式化表格**。我将第一行填充为黑色，并将文字颜色设置为“纸色”，以此实现反白效果。我将内部描边值设置为 4 点，并为第三行下方的描边应用了颜色。我还将反白单元格的描边设置为\
  \ 4 点，并应用了“纸色”。初始设置时，我在第 2 列和第 3 列的文本中添加了逗号。这便于稍后添加菱形对象后，将逗号转换为段落回车符。\n3.  **创建菱形对象**。你可以创建一个圆形、正方形或其他形状。在我的示例中，我打开了`字形面板`，并在`Wingdings`字体中查找菱形形状。我将一个菱形添加到文档中，并将文本转换为轮廓。我没有添加描边，只设置了颜色填充。我也在表格的左侧创建了这个对象。\n\
  4.  **锚定对象**。按住 `Alt/⌥` 键，将锚点拖拽至第一个文本框。在我的示例中，我将锚点拖拽至第一行第二列中，刚好位于文本的左侧。当你按住 `Alt/⌥`\
  \ 键拖拽锚点时，`锚定对象选项`对话框将自动打开。\n5.  **设置`锚定对象选项`**。参考点默认位于左下角位置，这没问题。锚定位置是左侧（在此例中为单元格文本的左侧），这也没问题。你需要更改的一项内容是`X\
  \ 相对于`。打开下拉菜单并选择`锚点标记`，如图 5-21 所示，然后点击确定。\n\n![A432409_1_En_5_Fig21_HTML.jpg](img/A432409_1_En_5_Fig21_HTML.jpg)\n\
  \n**图 5-21.** 按住 `Alt/⌥` 键同时将锚点拖拽到文本框，以打开`锚定对象选项`对话框\n6.  **将对象移动到正确位置**。将对象拖拽到行列描边的第一个交叉点。\n\
  7.  **创建一个`对象样式`**。我一直避免在 InDesign 中讨论样式表的使用，因为我有整整一章的内容专门介绍样式，尤其是图形样式。然而，除非你创建一个`对象样式`，否则这个设计工作确实无法继续。打开`窗口`菜单，选择`样式\
  \ ➤ 对象样式`。当面板打开后，点击面板底部的`创建新样式`图标。点击该对象，然后选择新创建的样式，确保图形继承了该样式。有关创建`对象样式`的更多信息，请参阅第\
  \ 6 章。\n8.  **查看锚定线**。选择 `视图 ➤ 其他 ➤ 显示文本串接`，或按下 `Ctrl/⌘+Alt/⌥+Y`。确保你处于**正常**视图模式，而非**预览**视图模式。如果锚点已正确设置在文本字段中，你应该会看到一条从该对象延伸到第二列第三行文本段落开头的蓝色虚线，如图\
  \ 5-22 所示。\n\n![A432409_1_En_5_Fig22_HTML.jpg](img/A432409_1_En_5_Fig22_HTML.jpg)\n\
  \n**图 5-22.** 选择 `视图 ➤ 其他 ➤ 显示文本串接` 或按下 `Ctrl/⌘+Alt/⌥+Y` 以查看文本串接\n9.  **剪切对象**。选中锚定的对象，按下\
  \ `Ctrl/⌘+X` 将其剪切到剪贴板。\n10.  **选择要更改的单元格**。拖拽光标选中所有要添加锚定对象的单元格。在我的示例中，我从第三行第二列到最后一行的第四列范围内的单元格是我想更改的目标。\n\
  11.  **打开`查找/更改`对话框**。在第 3 章中，你已经初步了解了如何使用 GREP 模式进行查找和替换。你需要使用 GREP 模式进行查找和替换，以便将对象添加到所有行列交叉点。要确保此操作正常执行，所有行的高度必须相同，并且所有文本内边距的值也必须一致，这一点非常重要。\n\
  12.  **选择 `编辑 ➤ 查找/更改`** 以打开`查找/更改`对话框。点击`GREP`选项卡以打开`GREP`窗格。\n13.  **设置`GREP 查找/更改`参数**。打开`查找内容`菜单（带向下箭头的`@`符号）。选择`位置`，然后选择`段落开头`，如图\
  \ 5-23 所示。这就是为什么我们需要连接句子，并使用稍后要更改为回车符的逗号。我们希望每个单元格内只有一个段落。返回菜单，选择`通配符 ➤ 任意字符`。这指示\
  \ InDesign 将锚点位置设置在段落开头，无论第一个字符是什么都适用。\n\n![A432409_1_En_5_Fig23_HTML.jpg](img/A432409_1_En_5_Fig23_HTML.jpg)\n\
  \n**图 5-23.**\n\n\n\n### 5.5.2 使用浮动对象\n\n点击 `GREP` 选项卡，然后打开 `查找内容` 菜单。  \n14. 打开\
  \ `更改为` 菜单。选择 `其他 ➤ 剪贴板内容：带格式`。由于我们将带有文本锚点的对象剪切到了剪贴板，此选项将使用该对象和锚点作为替换内容。再次打开 `更改为`\
  \ 菜单，选择 `已找到 ➤ 已找到的文本`。此项确保你不会删除段落中的第一个字符。  \n15. 执行 `查找/更改 GREP` 搜索。在 `搜索` 下拉菜单中选择\
  \ `选区`，点击 `查找下一个`，然后点击 `更改` 来测试搜索，确保一切正常工作。如果更改操作在正确位置（第三行，第二列）创建了对象，那么一切应该正常。点击\
  \ `全部更改`，你的表格就应该被这些对象填满了。  \n16. 设置段落回车符。现在应该很明显，为什么我需要确保单元格中没有多余的回车符。`查找/更改 GREP`\
  \ 的更改会在每个段落的开头停止，而不是只在列单元格中的单个段落处停止。在我的示例中，我在想要回车符的位置使用了不带空格的逗号（`,`）。要将逗号改为回车符，首先选择包含你想要更改的文本的列。在我的示例中，第三列第二行以下的文本中，在我想实际使用回车符的位置使用的是逗号（见图\
  \ 5-24）。选中单元格后，打开 `查找/更改` 对话框（`编辑 ➤ 查找/更改`），点击 `文本` 选项卡。在 `查找内容` 字段中输入一个逗号。在 `更改为`\
  \ 文本框中输入插入符号和 `p` (`^p`)。点击 `全部更改` 按钮，替换结果应显示为段落，同时逗号被删除。\n\n![A432409_1_En_5_Fig24_HTML.jpg](img/A432409_1_En_5_Fig24_HTML.jpg)\n\
  \n图 5-24. 选择你要替换字符的单元格\n\n17. 添加框架并描边。这是最后一步，因为如果你在表格上方添加框架，编辑单元格和表格属性时就会遇到麻烦。最好在最后创建框架，或者将其放在一个图层上并隐藏起来，或者在设置表格时将其置于背景并锁定（`Ctrl/z+L`）。在我的示例中，我在表格周围绘制了一个框架，添加了\
  \ 20 点描边，并将填充设置为无。调整框架大小，使其与表格边缘略微重叠，然后选中它。选择 `对象 ➤ 排列 ➤ 置于顶层`（或按 `Ctrl/⌘+Shift+]-右中括号键`）将框架置于表格顶部。\n\
  \n这整个过程看起来工作量很大。实际上，工作量确实很大！但是，一旦你创建了几个带有装饰性边框和锚定对象的表格，你应该就能轻松地完成这些步骤，并开始创建一些有趣的表格设计了。\n\
  \n### 5.5.2 使用浮动对象\n\n有时你无法将所有对象都锚定到单元格中。至少，试图让单元格拥有合适的宽度以便将对象锚定在正确位置，可能会让你抓狂。与其费力调整锚点设置，你可能会发现使用浮动对象要容易得多。\n\
  \n在图 5-25 中，设计被设置为一个表格。该表格有三行四列。行与行之间是 20 点的白色描边。这造成了一种错觉，即该设计不是一个表格，而是彼此偏移的独立框架。\n\
  \n![A432409_1_En_5_Fig25_HTML.jpg](img/A432409_1_En_5_Fig25_HTML.jpg)\n\n图 5-25.\
  \ 此表格有三行四列，行与行之间用大面积的白色描边分隔\n\n使用表格时遇到的一个问题是，你无法像使用多个对象那样创建堆叠顺序——至少在 5-25 所示的设计中是这样。3D\
  \ 箭头几乎像是从单元格后面穿出来。实际上，箭头的顶部是与单元格紧贴在一起的——这是我们在插图程序中尽量避免的情况。元素之间总有可能出现微小的间隙。\n\n无法将箭头放在表格后面创建堆叠顺序的原因是，单元格是用白色边框构建的。例如，在\
  \ Harvest 单元格中，单元格宽度超出了箭头的左侧，因为外部边框设置为 20 点。该单元格的顶部和左侧都有白色边框。因此，你无法将箭头的顶部部分置于单元格之后，所以紧贴单元格是你唯一的选择。\n\
  \n我没有使用锚定对象，而是添加了元素并尽可能将它们放置到位。全部完成后，你需要将所有元素编组。你可以在所有数字出版文档（包括可重排的 EPUB）中使用这种类型的表格设计。\n\
  \n### 5.5.3 在单元格偏移中锚定对象\n\n在图 5-26 中，你可以看到一个相当简单的表格，我为文字使用了单元格偏移。箭头锚定在文本上，使得每个单元格中每行文字的左侧都留出充足的空间来放置箭头。\n\
  \n![A432409_1_En_5_Fig26_HTML.jpg](img/A432409_1_En_5_Fig26_HTML.jpg)\n\n图 5-26.\
  \ 此表格有三行三列，箭头锚定在第二列和第三列的单元格中\n\n要创建这种表格，我执行了以下操作：\n\n1.  创建一个表格。在我的示例中，我创建了一个三行三列的表格。水平线设置为\
  \ 20 点并填充为白色，这造成了存在多个对象的假象，尽管我们只有一个表格。  \n2.  设置单元格内边距。在第二列和第三列中，我为每一行设置了不同的内边距值。你可以在\
  \ `控制面板` 中轻松更改内边距值，并在更改时动态查看结果。  \n3.  创建箭头。我使用了 `Wingding` 字体，并在 `字形面板`（`文字 ➤ 字形`\
  \ 或 `Alt/⌥+Shift+F11`）中找到了一个箭头。我设置了文字，然后将文字转换为轮廓。  \n4.  锚定箭头。我将箭头锚定到每一行和每一列的文本中。如果你创建一个\
  \ `对象样式`，这个任务会更容易。  \n5.  调整箭头大小。由于箭头被转换成了轮廓，每个箭头现在都是一个矢量对象，你可以轻松调整其大小。选择 `直接选择`\
  \ 工具，将箭头的左侧向左拖动。这样会拉长箭头。\n\n\n\n### 5.5.4 变换表格\n\n你可以使用第 4 章描述的变换技术，在 InDesign 中变换表格。在变换表格之前，请务必确定表格的格式和设计已最终完成。在图\
  \ 5-27 中，你可以看到我在变换表格前创建的设计。\n\n![A432409_1_En_5_Fig27_HTML.jpg](img/A432409_1_En_5_Fig27_HTML.jpg)\n\
  \n图 5-27。\n\n这个表格有三行三列，并包含粘贴在图形框架内的内联图形和对象。\n\n如果单元格中包含对象，你必须谨慎执行变换操作。对设置在文本单元格中的内联对象以及粘贴在图形单元格中的对象进行分组，可以轻松旋转或倾斜而不会出现问题。然而，如果你尝试缩放表格，单元格内的对象将无法保持在单元格内。你可能需要在事后单独缩放这些对象，并将其移动到合适的位置。\n\
  \n### 变换表格\n\n我按如下步骤创建了图 5-27 所示的表格：\n\n1.  **创建表格。** 选择 `Table ➤ Create Table`。当\
  \ `Create Table` 对话框打开时，输入列数和行数的值。在我的示例中，我创建了一个三列三行的表格。\n2.  **格式化单元格大小。** 在我的表格中，我在`控制面板`中将行高和列宽设置为\
  \ 125 像素。我在`控制面板`右侧的下拉菜单中选择`精确`，并在相邻的文本框中输入 125。我选中整个表格，并将所有描边值设置为 0。\n3.  **填充单元格。**\
  \ 在我的示例中，我将中心单元格转换为图形单元格，并将一个编组对象粘贴到该单元格内。我向其他单元格添加了文本，并使用`控制面板`中的文本旋转选项，将文本方向设置为你在图\
  \ 5-28 中看到的四个视图。我向外围单元格添加了渐变填充，并为图形框架添加了实色填充。\n\n    ![A432409_1_En_5_Fig28_HTML.jpg](img/A432409_1_En_5_Fig28_HTML.jpg)\n\
  \n    图 5-28。\n\n    将描边设置为 20 磅，并使用`路径文字`工具向路径添加文字（左图）。将`基线偏移`设置为 -6 磅（右图）。\n4.\
  \  **添加按钮。** 每个文本单元格的顶部都有一个按钮。我使用`路径文字`工具创建了一条描边，并沿路径设置了文字（图 5-28，左图）。我将描边值设置为 20\
  \ 磅，并单击`描边面板`中的`圆头端点`图标。我向描边应用了一种颜色，并将基线设置为 -6 磅。你可以在`控制面板`中设置基线，或者按 `Alt/⌥+Down\
  \ Arrow` 向下移动基线偏移（见图 5-29）。然后，我将文字在路径上居中对齐（`Ctrl/z+Shift+C`），并水平拖动描边的末端以匹配文字长度。在创建一条路径描边后，我将其复制了三份，并为每条路径应用了不同的文字和颜色。\n\
  \n    ![A432409_1_En_5_Fig29_HTML.jpg](img/A432409_1_En_5_Fig29_HTML.jpg)\n\n  \
  \  图 5-29。\n\n    旋转、倾斜和缩放后的表格。\n5.  **编组所有对象。** 用选框选中整个表格，然后选择 `Object ➤ Group`\
  \ 将对象编组。\n6.  **变换表格。** 我使用`自由变换`工具旋转了表格，并使用`倾斜`工具对其进行了倾斜。我还稍微缩放了一下表格，但图形发生了移动且未能正确缩放。我不得不移动图形单元格内的对象并单独缩放它。要选择图形，双击表格，然后双击图形。最终结果如图\
  \ 5-29 所示。\n\n### 5.5.5 创建照片网格\n\n你可以使用 `File ➤ Place` 命令将多张照片放置到网格中，并可以使用 `Object\
  \ ➤ Captions` 子菜单命令添加静态和动态题注。然而，表格在将照片放置到网格方面为你提供了更大的自由度。你可以轻松地更改单元格之间的距离，从无描边到粗描边，并为描边应用不同的颜色。使用表格为你提供了极大的自由度，并提供了管理表格中照片的简便方法。\n\
  \n在图 5-30 中，我创建了一个两列两行的表格，向你展示一个如何展示照片网格的示例。\n\n![A432409_1_En_5_Fig30_HTML.jpg](img/A432409_1_En_5_Fig30_HTML.jpg)\n\
  \n图 5-30。\n\n一个在图形单元格中放置了照片的表格。\n\n使用表格的一个优势是，你可以轻松调整单元格之间的列宽。如果使用 `File ➤ Place`\
  \ 放置多张照片，你也可以通过使用修饰键达到相同效果，但这会极大地扭曲你的身体动作。你需要按下键盘上的 `Up` 和 `Right Arrow` 键来确定网格单元格。在列设置正确后，你需要调整列宽。在按住鼠标按钮的同时，按下\
  \ `Ctrl/⌘` 键，然后再按方向键。与使用表格相比，使用修饰键的繁琐操作是一种折磨。\n\n我发现使用表格处理起来更简单的另一件事是在表格单元格内创建多状态对象。我将在第\
  \ 9 章中介绍如何创建多状态对象。现在，你只需认识到，多状态对象通常用于在页面的同一位置更改状态视图。例如，如果你想要创建一个按钮，用于在单个表格单元格内浏览多张照片，那么你可以创建多状态对象并添加一个按钮来切换不同的状态。\n\
  \n完成对象设置的方法非常简单。将一张照片放入表格单元格的图形框架中。复制该框架并将其粘贴到你的文档中。复制该框架，并在复制的框架中放置另一张照片。你可以根据需要添加任意数量的框架。使用`对齐面板`对齐对象，并通过光标拖过组来选中它们。打开`对象状态面板`并创建多状态对象。剪切该对象，然后单击表格中的图形框架。选中该图形单元格，选择\
  \ `Edit ➤ Paste Into`，对象状态即被粘贴到图形框架中。然后，你创建一个按钮来切换各个状态。\n\n如果这听起来现在有点令人困惑，请耐心等待，直到你阅读第\
  \ 9 章。到时，我会详细解释如何使用多状态对象，以及如何创建能够切换状态的按钮。\n\n\n\n### 5.5.6 放大单元格\n\n您可能希望吸引读者注意表格中某个特定单元格的内容。在图\
  \ 5-31 中，您会看到一个放大镜展示地图放大视图的示例。这种技术可以放大单元格的内容，并将读者的注意力吸引到该表格单元格上。\n\n![A432409_1_En_5_Fig31_HTML.jpg](img/A432409_1_En_5_Fig31_HTML.jpg)\n\
  \n图 5-31. 一个在图形单元格中放置照片的表格：放大单元格\n\n要创建此设计，我执行了以下操作：\n\n1.  创建放大镜。我按住 `Alt/⌥+Shift`\
  \ 键，从中心绘制一个约束的圆形形状。我选择了`缩放`工具，按住 `Alt/⌥` 键，点击该圆形以打开`缩放`对话框。然后我将圆形缩小 75% 并点击`复制`。文档页面上有了两个圆形后，我选中两者，选择`对象\
  \ ➤ 路径 ➤ 建立复合路径`。我将描边设置为 4 点，并为描边颜色选择黑色。\n2.  对于手柄，我绘制了一个矩形并添加了圆角。我在矩形的左上侧添加了一些白色描边，并对矩形应用了`斜面浮雕`效果。然后我将对象编组并旋转了手柄。\n\
  3.  创建椭圆框架。我选择了`椭圆框架`工具，绘制了一个比放大镜复合路径对象内部稍大的圆形。\n4.  放置照片。我选择`文件 ➤ 置入`，并置入了原始照片。\n\
  5.  粘贴到椭圆框架内。我将置入的照片剪切到剪贴板，然后选中圆形框架。接着选择`编辑 ➤ 粘贴入`。\n6.  将放大镜移至顶层。我选中放大镜框架，选择`对象\
  \ ➤ 排列 ➤ 置于顶层 (Ctrl/z+Shift+])`。\n7.  调整照片大小。我选中照片并将其放大。\n8.  编组并定位对象。我选中地图和放大镜元素，将它们编组。然后将对象移动到所需位置。\n\
  \n您可以将同样的技术应用于表格单元格框架。当使用表格单元格时，首先通过删除要放大的区域之外的列和行来简化表格。尽量使表格变得尽可能小而简单，只保留您想要放大的单元格。\n\
  \n**注意：** 当您尝试剪切表格并使用`粘贴入`命令时，InDesign 有崩溃的倾向。\n\n当表格大小调整合适后，剪切表格并粘贴到图形框架中。按住 `Ctrl/⌘+Shift`\
  \ 键并向外拖动控制柄来调整表格单元格的大小。当大小接近您想要的大小时，剪切表格并粘贴到图形框架中。\n\n选中图形框架的内容有点棘手。如果您双击包含文本单元格的内容，光标会在单元格中变为\
  \ I 型光标。双击单元格后，按键盘上的 `Esc` 键。此操作将选中该单元格。将光标向左移动，选中任何相邻的行，再向上移动选中任何相邻的列。当表格被选中时，使用键盘上的方向键将内容定位在框架内。\n\
  \n**提示：** 当您选中一个对象并按方向键时，对象每次移动一个像素。若要更大步长（10 点）移动，请按住 `Shift` 键再按方向键。\n\n### 5.5.7\
  \ 使用表格脚本\n\n与许多其他可以使用脚本执行的编辑序列一样，互联网上有许多低价和免费的脚本专门用于处理表格。我最喜欢的一个是日历生成脚本。这个脚本非常强大，只需在`脚本`面板中双击一个脚本名称，即可创建一个月、几个月、一年或几年的日历。\n\
  \n#### 5.5.7.1 下载和安装脚本\n\nAdobe InDesign 日历向导由 Scott Selberg 创建，您可以在 [`www.scourceforge.net`](http://www.scourceforge.net)\
  \ 找到该 InDesign 脚本。进入主页后，在搜索字段中输入 `calendar`，您将看到一份文档列表，其中一个是 Adobe InDesign 日历向导。\n\
  \n您也可以通过在浏览器搜索字段中输入 `InDesign Calendar Script` 来找到下载链接。无论哪种方式，您都会找到下载页面。进入下载页面后，点击`下载`按钮。\n\
  \n下载完成后，解压压缩包。要安装脚本，请在 InDesign 中打开您的脚本文件夹。打开 `JavaScripts` 文件夹，右键单击以打开上下文菜单。选择`在资源管理器中显示`（Windows）或`在访达中显示`（Macintosh）。将下载的脚本复制到选择`显示`时打开的文件夹中。\n\
  \n#### 5.5.7.2 运行日历脚本\n\n安装脚本后，双击`脚本`文件夹中的 `calendarWizard.js` 脚本。Adobe InDesign\
  \ 日历向导对话框将打开，如图 5-32 所示。\n\n![A432409_1_En_5_Fig32_HTML.jpg](img/A432409_1_En_5_Fig32_HTML.jpg)\n\
  \n图 5-32. 在脚本面板中双击 `calendarWizard.js` 文件以打开日历向导\n\n在此对话框中，您有多种选择。您可以从左上角的下拉菜单中选择月份范围。您可以从与`首月`和`末月`菜单相邻的菜单中选择年份。要在日历中包含节假日，请启用向导右侧的某个复选框。您可以选择添加显示在右上角和左上角、用于显示上个月和下个月的小日历。您还可以选择颜色空间和页面尺寸。查看向导中的选项，做出选择，然后点击`确定`。\n\
  \n日历打开后如图 5-33 所示。这只是您在互联网上可以找到的众多帮助处理表格的脚本之一。您还可以获取其他脚本，帮助您在其它编辑任务中提高效率。\n\n![A432409_1_En_5_Fig33_HTML.jpg](img/A432409_1_En_5_Fig33_HTML.jpg)\n\
  \n图 5-33. 使用 `calendarWizard.js` 脚本创建的日历\n\n**注释：** 您在互联网上找到的许多脚本都是免费或低价下载的。许多开发者会请求捐赠。如果您使用某个脚本并觉得它有价值，请给开发者一些酬劳。对于投入时间为您提供这些优秀工具（这些工具能在您设计过程中提供巨大帮助）的人来说，5-10\
  \ 美元将意义重大。\n\n## 5.6 总结\n\n在本章中，我们探讨了创建表格。您学习了如何格式化表格和表格单元格，如何设计创意表格，如何变换表格，以及如何为表格添加一些交互性。正如您在阅读本章时所看到的，InDesign\
  \ 中的表格远不止是包含数据的网格。您可以发挥创意，设计出与传统表格截然不同的表格。我们还探讨了在表格中锚定对象。当您创建可重排的 EPUB 时，锚定对象和锚定表格将变得非常重要，您将在后续章节中看到这一点。\n\
  \n在下一章中，我们将继续讨论资源的使用，并研究与为文本创建样式相关的至关重要的功能。在导出为 EPUB 时，样式是必须的，下一章将包含您需要了解的关于处理文本样式的全部内容。\n\
  \n\n\n"
- "# 6. 创建与应用样式\n\n字符、段落、表格以及框架和线条等对象，都可以被赋予样式。简单来说，样式会捕捉你应用于文本、表格单元格、表格和对象的所有属性。一旦创建了样式，你就可以在整个设计中将该样式应用于其他文本、表格单元格、表格或对象。这能显著提升编辑流程的速度和效率。\n\
  \n样式不仅能帮助你在 InDesign 中更快速、更高效地工作，在创建可重排式 EPUB 时，它们更是绝对必需的。在其他数字出版文档中，你可以勉强避开样式，但可重排式\
  \ EPUB 的行为方式不同。你需要使用样式来精确地显示你的出版物。\n\n在本章中，我将介绍如何创建字符、段落、表格、对象和 GREP 样式。\n\n## 6.1\
  \ 熟悉样式\n\n字符、段落和单元格样式可以通过 `控制面板` 或其他相应面板来创建和应用。当你选择 `窗口` ➤ `样式` 时，会打开一个子菜单，显示五种不同的样式类型。当你选择一个子菜单命令时，它将打开相应的面板。这些面板包括：\n\
  \n- `单元格样式`：单元格样式适用于表格单元格。\n- `字符样式`：字符样式可以应用于单个字符或几个单词，但不应用于整个段落。\n- `对象样式`：对象样式可以应用于任何非文本项目，例如图像和对象。\n\
  - `段落样式`：段落样式涉及应用于段落的样式。\n- `表格样式`：表格样式应用于表格。最佳实践是在创建表格样式之前先创建单元格样式。\n- `GREP 样式`：GREP\
  \ 样式没有单独的面板。你可以在 `段落样式选项` 对话框中创建 GREP 样式。\n\n样式捕捉了给定样式项目的格式。例如，字符样式应用于文本属性，单元格样式应用于表格单元格属性，依此类推。\n\
  \n单元格样式仅限于特定类型的格式设置。你可以在单元格样式中包含颜色和边框，但不能包含单元格宽度和行高。\n\n创建样式有两种方法。你可以将某个项目精确地设置为你想要的格式。例如，如果你想创建一个字符样式，你可以设置字体、字体样式、行距、文本颜色、基线偏移等，检查文本确保其显示完全符合你的要求，然后打开\
  \ `字符样式面板`，从选定的文本创建一个新样式。新样式会继承所有文本属性并将其包含在样式中。\n\n创建样式的另一种方法是，取消选择页面上的所有文本（或对象、单元格、表格），然后打开相应的样式面板（例如字符样式面板），点击面板底部的\
  \ `创建新样式` 图标。所有样式面板的底部都有 `创建新样式` 图标。当你点击 `创建新样式` 面板图标时，会打开一个对话框，你可以在其中设置样式的属性。\n\
  \n创建样式最简单的方法是将你想要的格式应用于某个项目，然后点击 `创建新样式` 图标，该图标会捕捉所有的格式。\n\n创建样式后，你可以将样式应用于布局中的其他项目。例如，如果你为正文副本创建了一个段落样式，请点击包含正文副本的任意段落内部，然后在\
  \ `段落样式面板` 中点击相应的样式。所选段落中的所有文本和段落格式都将采用样式定义中的属性。\n\n使用样式的真正威力在于当你想要更改各种属性时。假设你有一个包含显示类小标题的文档。你随后添加了另一个小标题，发现文本无法完全适合一行。也许可以将字号减小半磅，文本就能适应列宽了。对于这种情况，你可以轻松地编辑样式，更改字体大小，然后在\
  \ `样式` 对话框中点击 `确定`。所有使用相同样式名称的文本都会在整个文档中更新。如果你有 1000 个小标题，只需一次简单的编辑就能全部更改。\n\n`样式面板`\
  \ 菜单包含更多选项，我们将在本章后面介绍创建各种样式类型时看到其中的一些。现在，请尽力理解创建样式的价值，以及它们如何帮助你优化设计工作流程。\n\n## 6.2\
  \ 创建与应用段落样式\n\n请注意，我是在讨论字符样式之前先谈论段落样式的。原因在于，在你的工作流程中，你应该先创建段落样式，然后再着手创建字符样式。这是 InDesign\
  \ 中最常见的工作流程步骤。\n\n段落样式应用于整个段落。创建样式后，不应更改段落内的任何内容。如果需要在段落内更改文本属性，则必须使用字符样式。如果你确实在段落样式中对文本进行了更改，就会产生覆盖。你应该避免覆盖，尤其是在将文件导出为\
  \ EPUB 格式时。\n\n\n\n### 6.2.1 创建段落样式\n\n要使用段落样式，您需要使用段落样式面板。选择 `窗口 ➤ 样式 ➤ 段落样式` 打开段落样式面板，如图\
  \ 6-1 所示。\n\n![A432409_1_En_6_Fig1_HTML.jpg](img/A432409_1_En_6_Fig1_HTML.jpg)\n\
  \n图 6-1.\n\n选择 `窗口 ➤ 样式 ➤ 段落样式` 以打开段落样式面板\n\n打开面板时，您会看到面板中已有一个样式。基本段落样式是 InDesign\
  \ 的默认样式。您无法删除基本段落样式。\n\n有两种方法可用于创建段落样式。同样，在使用各种样式面板时，也有两种方法可以创建任何其他样式。如果您在文档中没有选择任何内容，并单击段落样式面板底部的**创建新样式**图标（或打开段落样式面板菜单并选择`新建段落样式`），则会打开“新建段落样式”对话框。（参见图\
  \ 6-2。）\n\n![A432409_1_En_6_Fig2_HTML.jpg](img/A432409_1_En_6_Fig2_HTML.jpg)\n\n\
  图 6-2.\n\n格式化段落之后，将光标置于段落内，按下 `Alt/⌥` 键，并单击段落样式面板中的**创建新样式**图标\n\n此时，您可以使用各种选项来格式化您的段落。如图\
  \ 6-2 所示，您有许多选项可用于处理文本、缩进和间距、字符颜色、断字等。\n\n另一种创建新段落样式的方法是：首先按照您的要求格式化一个段落，包括字体样式、行距、段前和/或段后间距、对齐方式、断字等。让段落完全符合您的要求，然后再创建段落样式。我强烈推荐这种方法。\n\
  \n格式化段落之后，将光标置于段落内，按下 `Alt/⌥` 键，并单击**创建新样式**图标，或者使用段落样式菜单并选择`新建段落样式`。当您使用修饰键时，“新建段落样式”对话框会打开。\n\
  \n最终结果是新段落样式捕获了您的所有格式设置。在图 6-2 中，您可以看到一个段落的格式设置以及位于格式化文本左侧的“新建段落样式”对话框。我在创建新段落样式时，将文本光标单击在了该段落内。在这个段落中，我更改了字体、字号和行距，为首行文本添加了缩进，将断字设置为\
  \ 20（从而基本上消除了所有断字），平衡了参差不齐的行，并在段落之后添加了一些间距。\n\n请注意在图 6-2 中，样式名称已从默认名称——`段落样式 1`——更改为`正文`。创建新样式时，为样式添加描述性名称是个好主意。还要注意在图\
  \ 6-3 中，您会在“常规”面板中看到一个复选框`将样式应用于选定内容`。勾选此框并点击`确定`，样式即被创建并应用于该段落。您还会看到一个`添加到 CC 库`的复选框。\n\
  \n![A432409_1_En_6_Fig3_HTML.jpg](img/A432409_1_En_6_Fig3_HTML.jpg)\n\n图 6-3.\n\n\
  选中多个段落，然后单击段落样式面板中的段落样式名称，将同一样式应用于所选段落\n\n您还会看到“常规”面板中出现一个键盘快捷键。要向段落样式添加快捷键，请单击“常规”面板中的`快捷键`文本框，并按下\
  \ `Ctrl/⌘+Alt/⌥+Shift+`（数字键盘上的数字键）的任意组合。键盘快捷键会显示在段落样式面板中，这样就能很好地提醒您为不同样式分配了哪些按键。创建正文时，每次都使用相同的键盘快捷键来创建正文文本样式。您可以选择\
  \ `Ctrl/⌘+1` 用于所有正文样式，这样便于记忆。\n\n### 6.2.2 应用段落样式\n\n一旦创建了段落样式，您可能希望将同一样式应用于文档中的其他段落。为此，请单击光标并拖过要应用相同样式的段落。如果您想将样式应用于一个故事中的所有段落，请按\
  \ `Ctrl/⌘+A` 选择所有链接在一起的文本框内的所有文本。选中文本后，单击段落样式面板中的段落样式名称。在图 6-3 中，您可以看到`正文`样式已应用于页面上的所有文本。\n\
  \n### 6.2.3 修改样式\n\n假设您想要更改段落样式中的某个属性。也许您想更改字体、字体样式、段后间距、首行缩进或任何其他段落属性。您可以通过两种方式之一访问“段落样式选项”对话框。双击样式名称，或使用上下文菜单，方法是右键单击段落样式面板中的样式名称，然后选择`编辑\
  \ \"<样式名称>\"`。\n\n作为一种实践，您应该始终使用上下文菜单。如果您的光标位于用于标题、标注或某些其他文本的段落中，并且您双击了一个样式名称，则第一次单击会应用该样式，第二次单击会打开“段落样式选项”对话框。如果您使用双击方法来打开“段落样式选项”对话框，很容易将样式应用到错误的文本上。始终在段落样式面板中右键单击并选择`编辑\
  \ \"<样式名称>\"`，这样就不会无意中为光标所在的文本分配段落样式。\n\n在图 6-4 中，我编辑了`正文`样式。我选择了`基本字符格式`并将字体从`Cambria`更改为`Minion\
  \ Pro`。当启用`预览`复选框时，您可以动态预览您的编辑。请注意在图 6-4 中，所有使用`正文`样式定义的文本都已更改为`Minion Pro`。\n\n\
  ![A432409_1_En_6_Fig4_HTML.jpg](img/A432409_1_En_6_Fig4_HTML.jpg)\n\n图 6-4.\n\n\
  启用`预览`复选框，您所做的编辑将动态反映在文档中\n\n### 6.2.4 重新定义样式\n\n假设您在文档中更改了使用段落样式的文本属性。在图 6-5 中，您可以看到一个我更改了字体的文本段落。该文本已使用`正文`样式定义。当我更改文本时，您会在段落样式面板中发现样式名称旁边有一个\
  \ `+` 符号。此标记提示您该段落样式存在覆盖。\n\n![A432409_1_En_6_Fig5_HTML.jpg](img/A432409_1_En_6_Fig5_HTML.jpg)\n\
  \n图 6-5.\n\n当您直接在文档中编辑文本属性时，样式名称会显示一个文本覆盖，以样式名称旁边的 `+` 符号表示\n\n如果您想清除覆盖并恢复为原始样式的文本格式，请按下\
  \ `Alt/⌥` 键并单击加号符号。文本将恢复为`正文`样式。\n\n假设您希望将段落样式更改为您应用于某个段落的新格式属性。要更改段落样式使其接受新的文本格式，请将文本光标置于新格式化的文本中，然后打开样式名称上的上下文菜单，并选择`重新定义样式`。段落样式会被修改，并采用光标所在文本的属性。\n\
  \n\n\n### 6.2.5 基于另一样式创建样式\n\n样式可以按父子关系进行设置。例如，如果你有一个`正文副本`样式，并创建一个新样式，则可以让新样式基于`正文副本`样式。你赋予新样式的所有属性都会生效。但是，如果你在`正文副本`样式中更改了其他属性，这些更改会反映到新样式中。为了更清楚地说明这一点，让我们查看图\
  \ 6-6。\n\n![A432409_1_En_6_Fig6_HTML.jpg](img/A432409_1_En_6_Fig6_HTML.jpg)\n\n\
  图 6-6.\n\n文档中的文本，第一段与其他段落具有不同的文本属性，展示了基于另一样式创建样式的效果。\n\n引导段横跨两栏，使用不同的字体，没有段落缩进，并且字体大小大于页面上的其他文本。让我们为第一段定义一个样式。\n\
  \n1.  创建一个新样式。将光标点击到该段落中，按下`Alt/⌥`键，并点击`段落样式面板`中的`创建新样式`图标。此时会打开`新建段落样式`对话框。为新样式键入一个名称。在我的示例中，我使用`正文第一段`作为样式名称。\n\
  2.  设置一个`基于`样式。查看样式名称下方的下拉菜单。第一项标题为`基于`，如图 6-7 所示。打开此菜单，你将看到打开文档中所有段落样式的列表。选择`正文副本`，则该样式将基于`正文副本`样式。\n\
  \n    ![A432409_1_En_6_Fig7_HTML.jpg](img/A432409_1_En_6_Fig7_HTML.jpg)\n\n    图\
  \ 6-7.\n\n    打开`基于`下拉菜单并选择`正文副本`。\n\n3.  点击`确定`以创建样式。\n4.  编辑`正文副本`样式。在`段落样式面板`中右键点击`正文副本`样式，然后选择`编辑正文副本`。\n\
  5.  更改文本的颜色。点击左侧窗格中的`字符颜色`，然后在`字符颜色`菜单中点击不同的颜色。\n6.  点击`确定`。注意页面上的文本。`正文副本`样式和第一段的颜色都已更改。第一段的其他属性保持不变，如图\
  \ 6-8 所示。\n\n    ![A432409_1_En_6_Fig8_HTML.jpg](img/A432409_1_En_6_Fig8_HTML.jpg)\n\
  \n    图 6-8.\n\n    使用两种不同样式的文本只更改了颜色。\n\n创建基于另一样式的新样式，能为你提供一些强大的编辑能力。你可以对父样式进行更改，这些更改会反映到子段落样式中，而不会干扰你想在子样式中保留的特定项目。\n\
  \n### 6.2.6 使用保留选项\n\n此功能对于创建可重排 EPUB 的用户特别有帮助。假设你希望所有章节都从页面顶部开始，并且在双页布局中让新章节出现在右侧页面。调整文本框大小和添加回车符无法实现此目的。你需要使用一个名为`保留选项`的功能。\n\
  \n使用`保留选项`：\n\n按照以下步骤操作，了解如何在双页布局中将新章节放置在右侧页面（右页）的顶部：\n\n1.  查看图 6-9。在此图中，你看到一个右侧页面，新章节从右下栏开始。`第\
  \ 9 章`文本被分配了`章节编号`样式。我们想将章节编号、标题以及后续文本移动到右侧页面的顶部。\n\n    ![A432409_1_En_6_Fig9_HTML.jpg](img/A432409_1_En_6_Fig9_HTML.jpg)\n\
  \n    图 6-9.\n\n    新章节位于页面的右下侧。\n\n2.  创建一个新的段落样式。按下`Alt/⌥`键，并点击`段落样式面板`中的`创建新样式`图标。\n\
  3.  命名样式。在我的示例中，我键入`新章节`作为样式名称。\n4.  基于另一样式创建样式。在我的示例中，我从`常规面板`的`基于`下拉菜单中选择`章节编号`。\n\
  5.  打开`保留选项`选项卡。点击`段落样式选项`左侧窗格中的`保留选项`。\n6.  选择`在下个奇数页`。在`保留选项`窗格中，打开`段落起始`下拉菜单并选择`在下个奇数页`。\n\
  7.  点击`确定`。现在下一个章节将定位在奇数页的顶部，如图 6-10 所示。\n\n    ![A432409_1_En_6_Fig10_HTML.jpg](img/A432409_1_En_6_Fig10_HTML.jpg)\n\
  \n    图 6-10.\n\n    章节从下一个奇数页的顶部开始。\n\n## 6.3 创建并应用字符样式\n\n当你需要偏离段落样式，对段落中的某些字符进行特殊设置时，字符样式就派上用场了。例如，如果你创建了一个段落样式，然后决定更改某个单词的字体样式（例如添加粗体或斜体字符），段落样式无法适应新的字符格式，这就会产生所谓的覆盖。在图\
  \ 6-11 中，你可以看到一个使用了样式的段落。然而，该段落中有四个单词使用了粗体斜体文本，而段落其余部分则未设置任何粗体文本。\n\n![A432409_1_En_6_Fig11_HTML.jpg](img/A432409_1_En_6_Fig11_HTML.jpg)\n\
  \n图 6-11.\n\n样式名称右侧的`+`符号表示该样式中存在覆盖。\n\n如果你打开`段落样式面板`，你会看到`正文副本`样式名称右侧有一个`+`符号。这个加号表示该段落样式中存在覆盖。你需要纠正这个问题。\n\
  \n提示\n\n如果你将光标移到任何样式面板中的`+`符号上，工具提示会显示如何清除覆盖以及覆盖的原因。\n\n\n\n### 6.3.1 创建字符样式\n\n\
  创建字符样式的方法与创建段落样式类似。与段落样式一样，最佳做法是先格式化文本，再创建样式。\n\n创建字符样式的步骤如下：\n\n1. 在文本段落中创建一个段落样式。将该样式应用于一个或多个段落。\n\
  2. 选中部分文本并将字体样式更改为粗体。我想为使用粗体的文本创建一个新的字符样式。首先选中文本，然后从字符控制面板中选择字体样式。\n3. 为斜体文本创建一个新的字符样式。选中文本并从控制面板中选择字体样式。\n\
  4. 打开字符样式面板。打开字符样式面板（`窗口` ➤ `样式` ➤ `字符样式`，或按 `Shift+F11`——见图 6-12）。\n\n   ![A432409_1_En_6_Fig12_HTML.jpg](img/A432409_1_En_6_Fig12_HTML.jpg)\n\
  \n   图 6-12. 按 `Shift+F11` 打开字符样式面板\n\n5. 选中已设置粗体格式的文本。\n6. 创建一个新的字符样式。选中文本后，按住\
  \ `Alt/⌥` 键并单击字符样式面板中的 `创建新样式` 图标。按住 `Alt/⌥` 键时，将打开“新建字符样式”对话框，如图 6-13 所示。\n\n \
  \  ![A432409_1_En_6_Fig13_HTML.jpg](img/A432409_1_En_6_Fig13_HTML.jpg)\n\n   图 6-13.\
  \ 按住 `Alt/⌥` 键并单击字符样式面板中的 `创建新样式` 图标\n\n7. 在 `样式名称` 文本框中为样式输入一个名称。由于已经格式化了文本，因此无需再指定其他属性。不过，在“新建字符样式”对话框中还有一项需要处理。选中\
  \ `将样式应用于选区` 复选框。创建新样式时，默认情况下该样式不会应用于任何文本。选中此复选框后，样式将被创建并应用于选中的文本。单击 `确定`。\n8. 重复相同步骤，选中斜体文本并创建一个新的字符样式。\n\
  9. 查看字符样式面板。如图 6-14 右侧所示，字符样式面板显示了添加到面板中的新样式名称，其中一个是粗体文本的样式。在左侧，注意段落样式面板中的 `正文副本`\
  \ 名称现在显示时没有覆盖（没有 `+` 符号）。\n\n   ![A432409_1_En_6_Fig14_HTML.jpg](img/A432409_1_En_6_Fig14_HTML.jpg)\n\
  \n   图 6-14. 字符样式不会影响除字符样式定义之外的任何段落格式\n\n**提示：** 你也可以为字符样式指定键盘快捷键。在字符样式面板中，单击 `快捷键`\
  \ 文本字段，然后输入任意 `Ctrl/Command+Alt/⌥+Shift+`（数字小键盘按键）组合。与段落样式快捷键一样，快捷键会显示在字符样式面板中字符样式名称的旁边。\n\
  \n使用字符样式的妙处在于，字符样式不会影响段落中的任何其他属性以及你创建的任何段落样式。它只会影响你选中并用于创建样式的文本格式。一旦创建了字符样式，无论使用何种段落格式，你都可以将其与其他段落样式结合使用。在图\
  \ 6-14 中，你可以看到粗体字符样式应用于使用不同字体和不同段落样式格式化的文本。文本中唯一的变化是粗体样式。\n\n### 6.3.2 重新定义字符样式\n\
  \n假设我们在字符样式面板中有一个字符样式，该样式已应用于某些文本，现在你想通过为文本应用不同的颜色来进行细微编辑。如果你选中文本并在色板面板中更改颜色，会看到一个覆盖——尽管不是在字符样式面板中。覆盖会出现在段落样式面板中，如图\
  \ 6-13 所示。如果你打开字符样式面板菜单，会看到 `重新定义样式` 菜单项呈灰色不可用状态。\n\nInDesign 将覆盖视为段落样式的一部分。原因是，当你创建字符样式并应用编辑时，InDesign\
  \ 为字符样式处理的唯一内容正是你所更改的属性。文本中的所有其他项目保持不变。因此，当你为字符样式应用斜体类型时，没有向该样式添加颜色信息。颜色信息属于段落样式。\n\
  \n要正确编辑字符样式，你可以尝试以下操作：\n\n1. 单击要更改的文本，然后 `Alt/⌥+单击` 字符样式面板中的 `创建新样式` 图标。你可以编辑现有的字符样式，但所有你想要设置斜体的文本都会应用颜色更改。最好基于原始字符样式创建一个新样式。\n\
  2. 为样式命名，并使其基于现有样式。为样式键入一个新名称。在我的示例中，我使用 `斜体 绿色` 作为样式名称。我从 `基于` 下拉菜单中选择 `斜体`。\n\
  3. 编辑文本属性。在我的示例中，我想更改文本颜色。我单击左侧窗格中的 `字符颜色`，然后在面板中单击一种颜色。\n4. 单击 `确定`。将新样式应用于你想要设置为斜体并带有颜色的文本。\n\
  \n在图 6-15 中，你可以看到添加了新样式后的字符样式面板。如果你决定通过单击不同的颜色色板来更改文本颜色，并打开字符样式菜单，则 `重新定义样式` 菜单项变为可用。由于我们在字符样式格式中更改了颜色属性，因此对更改内容所做的任何更改都会在字符样式面板中得到体现。\n\
  \n![A432409_1_En_6_Fig15_HTML.jpg](img/A432409_1_En_6_Fig15_HTML.jpg)\n\n图 6-15.\
  \ 添加新字符样式后的字符样式面板\n\n### 6.3.3 删除样式\n\n如果你想删除文档中的样式，应首先查看样式定义。如果你有一个基于另一个样式的样式，并且想要删除父样式，则所有子样式都会受到影响。根据你选择重新指定样式的操作，可能会产生一些意外结果。\n\
  \n如果要删除子样式，你可以将其应用于面板中的另一个样式。例如，假设我想删除带颜色的斜体文本。也许我后来决定只想要黑色文本。我会将字符样式面板中的 `斜体 绿色`\
  \ 样式拖到面板的垃圾桶图标上。执行此操作时，我可以将样式替换为我创建的另一个样式，该样式会出现在字符样式面板中。\n\n将样式拖到字符样式面板的垃圾桶图标，将打开“删除字符样式”对话框。从\
  \ `替换为` 下拉菜单中选择一个样式来替换第一个样式，如图 6-16 所示。\n\n![A432409_1_En_6_Fig16_HTML.jpg](img/A432409_1_En_6_Fig16_HTML.jpg)\n\
  \n图 6-16. 将样式拖到样式面板的垃圾桶图标，将打开“删除字符样式”对话框\n\n选择一个替换样式并单击 `确定`。你可以用同样的方法从其他样式面板中删除样式。\n\
  \n\n\n## 6.4 创建首字下沉和嵌套样式\n\n在制作可重排 EPUB 时，它们主要是文本文档，这合情合理。可重排 EPUB 旨在供人阅读。你可以添加一些有趣的图标、插画，甚至采用不同的文本处理方式，将读者带入页面。首字下沉就是这种效果的典型例子。添加一个首字下沉，改变文本颜色，能在一定程度上打破页面的单调，增加一些趣味性。\n\
  \n如果说有一项功能在 1996 年让 InDesign 领先于 QuarkXPress，那必定是嵌套样式。嵌套样式在 InDesign CS 1 中被引入，并立即被许多曾将\
  \ QuarkXPress 作为首选排版软件的人所接受。正如你将在本节中看到的，嵌套样式为你提供了一些强大的编辑功能。\n\n### 6.4.1 创建首字下沉字符样式\n\
  \n为首字下沉创建样式实际上需要同时使用段落样式和字符样式。在“段落样式选项”对话框中，你可以将首字下沉作为样式定义的一部分包含在内。在“字符样式选项”中，你为用于首字下沉的字符分配属性，并为该首字下沉创建一个字符样式。如果不创建字符样式，当你编辑字体属性（例如更改字体或字形）时，将会产生覆盖。\n\
  \n在“控制面板”的段落选项中，有一个用于应用首字下沉的设置。问题在于，如果你使用“控制面板”创建首字下沉，就会对你应用于段落的样式产生一个覆盖，如图 6-17\
  \ 所示。然而，从“控制面板”开始操作并非一个坏主意。你可以试验一下希望首字下沉占用的行数以及想使用的字体。这些设置同样可以在“段落样式选项”对话框中找到，并且借助动态预览，你可以在“段落样式选项”对话框中工作时轻松查看首字下沉的效果。这是一个个人偏好问题。我更喜欢先使用“控制面板”调整首字下沉和字符设置，之后再处理覆盖问题。\n\
  \n![A432409_1_En_6_Fig17_HTML.jpg](img/A432409_1_En_6_Fig17_HTML.jpg)\n\n图 6-17.\
  \ 在“控制面板”中添加首字下沉会导致分配给段落的段落样式产生覆盖\n\n> **提示**  \n> 要在控制面板中将首字下沉的行数和首字下沉大小按一个点递增，请点击控制面板中“首字下沉”工具旁边的文本框，并按向上箭头键增加一行。按\
  \ **Shift + 向上箭头键** 可跳至四行。\n\n### 创建首字下沉字符样式\n\n若要将首字下沉添加到文本段落中，并为该首字下沉定义样式，请遵循以下步骤：\n\
  \n1. 选择段落中的第一个字符，右键单击“段落样式”面板中的段落样式名称。这些步骤假定你已经为你想要添加首字下沉的段落定义了段落样式。在本例中，我们直接以“段落样式选项”对话框为起点。右键单击“段落样式”面板中的段落样式名称，然后选择编辑“`<样式名称>`”。\n\
  2. 在左侧窗格中单击“首字下沉和嵌套样式”。\n3. 设置首字下沉属性。在“段落样式选项”对话框中输入首字下沉的行数。在此示例中，我们使用一个字符作为首字下沉，因此将“字符”文本框保留为默认值。选中“预览”复选框，以便能够动态查看你的编辑效果，如图\
  \ 6-18 所示。\n\n![A432409_1_En_6_Fig18_HTML.jpg](img/A432409_1_En_6_Fig18_HTML.jpg)\n\
  \n图 6-18. 输入希望用于首字下沉的行数值\n\n4. 创建一个新的字符样式。你不必离开“段落样式选项”对话框即可创建新的字符样式。打开“段落样式选项”对话框中的“字符样式”下拉菜单，然后从菜单中选择“新建字符样式”，如图\
  \ 6-18 所示。\n5. 设置文字属性。为字符样式输入一个名称。在我的示例中，我使用 `Drop Cap` 作为字符样式名称。设置字体并为其选择一种颜色。从“段落样式选项”对话框中创建字符样式时，你面临的一个缺点是无法看到编辑效果的动态预览，即使你启用了“预览”复选框也是如此。这就是为什么我喜欢先在“控制面板”中设置首字下沉选项，然后再处理段落样式覆盖问题的原因。\n\
  6. 设置字偶间距。你需要在“新建字符样式”对话框中进行的另一项编辑是为文本行添加一些字偶间距。默认情况下，InDesign 会将文本推到首字下沉的右侧——紧靠着首字字符。你需要添加一点呼吸空间。单击“基本字符格式”，并在字偶间距文本框中输入大约\
  \ 40（参见图 6-19）。如果你的编辑需要一些修改，你可以在离开“段落样式选项”对话框后随时修改字符样式。\n\n![A432409_1_En_6_Fig19_HTML.jpg](img/A432409_1_En_6_Fig19_HTML.jpg)\n\
  \n图 6-19. 从“字符样式选项”对话框的“基本字符格式”面板为文本行添加字偶间距\n\n7. “新建字符样式”对话框。你返回到“段落样式选项”对话框，“首字下沉”窗格显示了用于首字下沉的字符样式以及结果的动态预览。\n\
  \n当你返回文档页面并检查“段落样式”和“字符样式”面板时，你会发现样式上没有覆盖。\n\n### 6.4.2 创建嵌套样式\n\n正如我在本章前面以及本书引言中所述，当嵌套样式在\
  \ InDesign CS 1 中引入时，对 Adobe 来说，它们是排版领域的一个游戏规则改变者。在 Adobe 推出 InDesign 时，它在捕捉排版应用程序市场份额方面面临着一场艰难的战斗。企业和大型出版社花费了大量资金安装和更新\
  \ QuarkXPress 的副本，许多公司还重金投资了 Quark XTensions（类似于插件）。有些专业 XTensions 每个售价超过 8500 美元！对于\
  \ Adobe 来说，要说服企业界、独立设计师和广告公司放弃 QuarkXPress，并将 Adobe InDesign 视为他们的首选排版程序，是一个巨大的挑战。\n\
  \nAdobe 需要一种“哇塞”因素，不是作为插件，而是作为硬编码到应用程序中的功能。Adobe InDesign 众多天才般创新中的第一个就是嵌套样式。嵌套样式使创建目录、年度报告、产品手册及其他类似文档的排版人员能够更高效地工作。\n\
  \n从某种程度上说，嵌套样式是将多个字符样式集中到一个段落样式中。观察图 6-20。第一段没有使用样式定义进行格式化。ISBN 文本和数字设置为 14.5 磅，文本为斜体。书名以粗体显示，字号为\
  \ 16 磅。作者姓名是斜体，字号也是 16 磅。日期设置为 14.5 磅，而括号设置为 16 磅。\n\n![A432409_1_En_6_Fig20_HTML.jpg](img/A432409_1_En_6_Fig20_HTML.jpg)\n\
  \n图 6-20. 第一段应用了文本格式设置，但尚未定义样式\n\n我们可以使用 InDesign 的嵌套样式功能捕获所有这些文本属性，并将它们包含在一个单独的段落样式中。初次看到嵌套样式选项时，可能会觉得令人生畏。然而，只要对其创建方式稍加了解，你就会发现它们很容易构建并应用于你的数字出版文档。\n\
  \n\n\n#### 6.4.2.1 使用特殊字符\n\n要创建嵌套样式，你需要一些分隔符。分隔符是一个字符，你可以在其中告知 InDesign 样式的开始或结束位置。冒号、句点、逗号、制表符等都可以用作分隔符。然而，有时你可能会在希望开始或结束样式的字符之间留有一个空格。按下键盘上的空格键并不能提供分隔符。你需要插入一些特殊字符。\n\
  \n选择 `Type` ➤ `Insert White Space`。在 `White Space` 子菜单中，你将看到几个选项，如图 6-21 所示。你可能用作分隔符的一些字符包括：\n\
  \n- `En Space` (半身空格)：半身空格的宽度等于当前字体的字符 `n` 的宽度。半身空格会根据你使用的字体而变化。\n- `Em Space` (全身空格)：全身空格的宽度等于当前字体的字符\
  \ `m` 的宽度。全身空格也会根据你使用的字体而变化。\n\n![A432409_1_En_6_Fig21_HTML.jpg](img/A432409_1_En_6_Fig21_HTML.jpg)\n\
  \n图 6-21. 选择 `Type` ➤ `Insert White Space` 以打开 `White Space` 子菜单\n\n这两个字符应该能够处理当你没有其他字符可用作分隔符时的分隔符需求。\n\
  \n#### 6.4.2.2 创建字符样式\n\n你需要为每一组属性与段落正文不同的字符创建一个字符样式。在我的示例中，我为 ISBN 号、书名、作者名和出版年份创建了字符样式。我的示例中的\
  \ `Character Styles` 面板如图 6-22 所示。\n\n![A432409_1_En_6_Fig22_HTML.jpg](img/A432409_1_En_6_Fig22_HTML.jpg)\n\
  \n图 6-22. 为文本属性的每个变化创建字符样式\n\n#### 6.4.2.3 创建嵌套样式\n\n在本示例中，我使用图 6-18 中第一段格式化后的文本，同时也使用如图\
  \ 6-20 所示的字符样式。\n\n如果你想使用其他示例跟着操作，请务必格式化文本、创建字符样式，并在字符样式格式之间插入用于开始和结束点的分隔符。\n\n\
  #### 创建嵌套样式\n\n请按照以下步骤创建嵌套样式：\n\n1.  单击包含要格式化为嵌套样式的文本的段落。按住 `Alt`/`⌥` 键并按 `Paragraph\
  \ Styles` 面板中的 `Create new style` 图标。为样式键入一个名称。在我的示例中，我使用 `Nested Style` 作为样式名称。\n\
  2.  打开 `Drop Caps and Nested Styles` 窗格。单击左窗格中的 `Drop Caps and Nested Styles`。\n\
  3.  添加一个新嵌套样式。单击 `New Nested Style` 按钮。\n4.  从下拉菜单中选择一个字符样式。在我的示例中，`ISBN` 样式是段落中出现的第一个样式。打开菜单并选择\
