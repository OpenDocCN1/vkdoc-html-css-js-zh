  7.  打开`图层`面板并隐藏文本框。现在你可以访问默认按钮。\n8.  将此图层上的三个圆圈转换为按钮。此时，你已拥有所需的所有按钮，现在可以为它们分配动作。\n\
  9.  点击第一个圆形按钮，然后点击`按钮和表单`面板中的`+`图标。\n10. 从下拉菜单中选择`动画`，然后选择你想要动画化的项目。在我的示例中，我将文本框按钮命名为`Text_Btn1`、`Text_Btn2`和`Text_Btn3`。这种命名约定使我能够轻松分辨要分配动作的项目及其位置。第一个圆形按钮设置为对`Text_Btn1`项目运行动画，第二个圆形按钮对`Text_Btn2`运行动画，依此类推。\n\
