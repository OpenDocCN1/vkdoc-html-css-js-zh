    \ the Author and About the Technical Reviewer About the Author About the Technical\
    \ Reviewer\n\n# 1. What Makes a Good CLI?\n\nIn this chapter, you’ll take a look\
    \ at successful command-line clients and what they do well. This will help you\
    \ understand the problems users face, and thus help you build better command-line\
    \ clients with Node.js later in the book.\n\n## CLI Basics\n\nLet’s first take\
    \ a look at how users typically use a command-line interface (CLI). Most of the\
    \ time, users sit in front of a keyboard and interact with a terminal. You should\
    \ use simple and recognizable commands for the CLI. But sadly, just using easily\
    \ recognizable commands won’t get you far enough.\n\nThe problem will be easier\
    \ to understand if you take a look at a bad CLI:\n\n```\n$ my-example-cli -A -a\
    \ 16 r foo.html\nerror: undefined is not a function\n```\n\nIn this example, you\
    \ have to enter cryptic commands that are then answered by a cryptic error message.\
    \ You might ask, “What does `-A -a 16 r` mean?” and “Why I am getting an error\
    \ back; am I using it wrong?” and “What does the error mean, and how can I get\
    \ my task done?”\n\nSo what makes a good CLI? In short, a successful CLI is one\
    \ that makes users successful and happy.\n\nLet’s try creating a CLI by using\
    \ the following three principles :\n\n*   You never get stuck in the CLI.\n* \
    \  It is simple and supports power users.\n*   You can use it for so many things.\n\
    \n## You Never Get Stuck\n\nNobody likes to be in a traffic jam, stuck, just moving\
    \ a few feet each minute. You want to reach your target destination in the fastest\
    \ and most comfortable way. The same applies to your users: they become extremely\
    \ unhappy when tools are standing in their way. They just want to get their tasks\
    \ done.\n\nNever getting stuck means that you should always offer your users a\
    \ way to solve their tasks. A command should never be a dead end. Additionally,\
    \ you should avoid every source of friction in your command-line tool .\n\nTo\
    \ better illustrate this, let’s take a look at Git and npm—two very successful\
    \ command-line tools.\n\nThe following example uses Git:\n\n```\n$ git poll\n\
    git: 'poll' is not a git command. See 'git --help'.\nDid you mean this?\npull\n\
    ```\n\nIn this example, I entered the wrong command, `poll`, instead of `pull`.\
    \ Fortunately, Git offers a way to continue my work and finish the task.\n\nGit\
    \ is basically saying, “Hey, Robert, it looks like you entered the wrong command,\
    \ but if you type in `git --help`, you can see a list of all the existing commands.\
    \ And, hey, it looks like you typed `git poll`; did you mean `git pull`?”\n\n\
    npm, another successful CLI client , offers the same concept:\n\n```\n$ npm ragrragr\n\
    Usage: npm \nwhere  is one of:\naccess, add-user, adduser, apihelp, author, bin,\
    \ bugs, c,\ncache, completion, config, ddp, dedupe, deprecate, dist-tag,\ndist-tags,\
    \ docs, edit, explore, faq, find, find-dupes, get,\nhelp, help-search, home, i,\
    \ info, init, install, issues, la,\nlink, list, ll, ln, login, logout, ls, outdated,\
    \ owner,\npack, prefix, prune, publish, r, rb, rebuild, remove, repo,\nrestart,\
    \ rm, root, run-script, s, se, search, set, show,\nshrinkwrap, star, stars, start,\
    \ stop, t, tag, test, tst, un,\nuninstall, unlink, unpublish, unstar, up, update,\
    \ upgrade,\nv, verison, version, view, whoami\nnpm  -h     quick help on \nnpm\
    \ -l           display full usage info\nnpm faq          commonly asked questions\n\
    npm help   search for help on \nnpm help npm     involved overview\nSpecify configs\
    \ in the ini-formatted file:\n/Users/robert/.npmrc\nor on the command line via:\
    \ npm  —key value\nConfig info can be viewed via: npm help config\nnpm@5.5.1 /Users/robert/.nvm/versions/node/v9.1.0/lib/node_modules/npm\n\
    ```\n\nIn this example, I tried to put garbage into npm, so npm offers some friendly\
    \ help: “Hey, Robert, I don’t know that command, but here are all the commands\
    \ that are possible. You can use them like this and get help about them by typing\
    \ in `npm help <command>`.”\n\nLike Git, npm immediately offers help to enable\
    \ me to finish my task, even if I have no idea how to use npm at all."
