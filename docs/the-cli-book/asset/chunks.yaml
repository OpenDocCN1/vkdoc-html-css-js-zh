- fmt: "# 3. Making Our CLI More Accessible\n\nIn the preceding chapter, we built\
    \ a solid base for our command-line tool. We loaded our first command, and the\
    \ whole program is executable on the command line. We will now focus on usability\
    \ and accessibility. We will look at how to improve error handling and provide\
    \ our users with a guiding hand, even if the program crashes. With JSON support\
    \ and shorthand, we’ll bring a smile to the faces of our power users. We’ll also\
    \ create different formats for our documentation. Before our first production\
    \ release, we’ll add a flexible system for managing configuration.\n\n## Error\
    \ Handling\n\nYou already learned that no user enjoys cryptic error messages and\
    \ stacktraces. Sadly, that is still the case for our lounger application. Making\
    \ the application more accessible should be our first priority.\n\nRight now,\
    \ lounger doesn’t do anything about wrong input for the `isonline` command:\n\n\
    ```\n$ lounger isonline ragrragr\n$\n```\n\nAnother caveat to consider is, are\
    \ we handling errors correctly so people can use the command-line client in their\
    \ bash scripts?\n\n```\n$ lounger isonline ragrragr\n$ echo $?\n```\n\nWouldn’t\
    \ it be nicer to give users a hint about the correct usage of the program right\
    \ away, without opening any documentation? Nobody enjoys sitting in front of a\
    \ black terminal, having no idea what to do. While we are at it, we can also fix\
    \ the wrong exit code, which is currently signaling a successfully executed program.\n\
    \nWhy isn’t our `console.error` call in `bin/lounger-cli` printing anything? It\
    \ turns out that we introduced a subtle bug: we forgot the `.catch` for our promise-returning\
    \ call in `lib/isonline.js`. Given that the API function `isOnline` rejects the\
    \ promise, we have no handler in the `cli` function to take care of it. No problem—we’ll\
    \ add the `.catch` right now:\n\n```\nfunction cli (url) {\nreturn new Promise((resolve,\
    \ reject) => {\nisOnline(url).then((results) => {\n// print on stdout for terminal\
    \ users\nObject.keys(results).forEach((entry) => {\nlet msg = 'seems to be offline\
    \ or no database server';\nif (results[entry]) {\nmsg = 'seems to be online';\n\
    }\nconsole.log(entry, msg);\nresolve(results);\n});\n}).catch(reject);  // add\
    \ the missing catch\n});\n}\nexports.cli = cli;\n```\n\nOur next try is a bit\
    \ more successful:\n\n```\n$ lounger isonline ragrragr\n[Error: Invalid URI \"\
    ragrragr\"]\n```\n\nNot sure if you are happy with it? I’m not! Just imagine someone\
    \ who has never used Node.js or the terminal, or maybe even someone who is completely\
    \ new to computers. The `Invalid URI` message won’t help them much to get their\
    \ task done. Twenty years ago, they would have had to get a book from the library\
    \ in order to find out what a URI is, and today they would have to search Google\
    \ for it. Instead, they could have fun with our CLI and get things done! In the\
    \ next section, we will take a look at how to improve error messages that originate\
    \ from wrong input.\n\n### Handling Usage Errors\n\nUsage errors comprise everything\
    \ related to wrong usage of the interface. Usually, it’s wrong input that’s causing\
    \ trouble. Often the argument order is switched by accident. Fortunately, we can\
    \ fix this issue by adding validations for the arguments in `isonline.js`.\n\n\
    If the user does not provide a URL to the CLI, we’ll have a new error with the\
    \ message `Usage: lounger isonline <url>`, which describes how the user should\
    \ use the command. We set the type of the error to `EUSAGE`, which will be important\
    \ later. In lounger, all errors that are thrown because the user provided the\
    \ wrong input get the type `EUSAGE`. All other cases related to bugs don’t get\
    \ the type `EUSAGE`:\n\n```\nfunction cli (url) {\nreturn new Promise((resolve,\
    \ reject) => {\nif (!url) {\nconst err = new Error('Usage: lounger isonline ');\n\
    err.type = 'EUSAGE';\nreturn reject(err);\n}\n```\n\nThe less-than sign and greater-than\
    \ sign around `url` indicate that it is a required argument and not optional.\
    \ The last command in the block rejects the promise with our error and returns,\
    \ in order to prevent the execution of the following code.\n\n**Tip**\n\nEarly\
    \ returns are useful for reducing cyclomatic complexity. Cyclomatic complexity\
    \ is a measurement of the complexity of code. For example, code appears more complex\
    \ when `if` and `else` blocks are nested, as these nested blocks make it harder\
    \ for the human brain to reason about the flow of the program’s execution.\n\n\
    Additionally, we have to check whether the URL is valid:\n\n```\nif (!/^(http:|https:)/.test(url))\
    \ {\nconst err = new Error([\n'invalid protocol, must be https or http',\n'Usage:\
    \ lounger isonline '\n].join('\\n'));\nerr.type = 'EUSAGE';\nreturn reject(err);\n\
    }\n```\n\nIn this case, we set the error type to `EUSAGE` again and reject the\
    \ promise. Additionally, we tell the user that we expect a valid URL with a protocol\
    \ that is usable for us.\n\nOn our next try, we will get a slightly better result:\n\
    \n```\n$ ./bin/lounger-cli isonline dsf\n{ [Error: invalid protocol, must be https\
    \ or http\nUsage: lounger isonline ] type: 'EUSAGE' }\n```\n\nAs we reject the\
    \ promise, the `console.error` that we added in `bin/lounger-cli` prints the error\
    \ object. By adding a few lines of code, we can format it so humans can read it\
    \ better. We will install the `npmlog` logger for it (hint: `npm i` is short for\
    \ `npm install`):\n\n```\n$ npm i --save npmlog\n```\n\nWe require the logger\
    \ at the top of `bin/lounger-cli`, the file where we catch the rejected promise:\n\
    \n```\nconst log = require('npmlog');\n```\n\nNext, we add the `errorHandler`\
    \ function to `bin/lounger-cli`. If the error is a usage error (of type `EUSAGE`),\
    \ we log the message and exit with error code `1`. All other errors are logged\
    \ using `log.error(err)` for now:\n\n```\nfunction errorHandler (err) {\nif (!err)\
    \ {\nprocess.exit(1);\n}\nif (err.type === 'EUSAGE') {\nerr.message && log.error(err.message);\n\
    process.exit(1);\n}\nlog.error(err);\nprocess.exit(1);\n}\n```\n\nNow we have\
    \ to switch from the old `console.error` call to our new error-handling function:\n\
    \n```\nlounger.load().then(() => {\nlounger.cli[cmd]\n.apply(null, parsed.argv.remain)\n\
    .catch(errorHandler);\n}).catch(errorHandler);\n```\n\nCool—let’s see if it works:\n\
    \n```\n$ lounger isonline\nERR! Usage: lounger isonline \n$ echo $?\n```\n\nFigure\
    \ 3-1 shows the result. That looks a lot better!\n\n![A456043_1_En_3_Fig1_HTML.jpg](A456043_1_En_3_Fig1_HTML.jpg)\n\
    \n**Figure 3-1** A usage error resulting from providing the wrong input to the\
    \ CLI"
