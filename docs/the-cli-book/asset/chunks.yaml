    ## Summary


    In this chapter, we created the first basic building block for our command-line
    client. We now have a solid foundation for an extensible command-line client.
    We also added our first command. Yet we are still far from a product that our
    users would love and promote. Our CLI still has rough edges and is missing a lot
    of the features that successful CLIs have. We will fix those issues in the next
    chapter, where we’ll look at at usability and accessibility.'
  trans: '

    ### 确保 Lounger 已加载


    确保 `lounger` 已正确引导是合理的做法，尤其是在编程环境中使用时。为追踪异步引导状态，我们将 `lounger.loaded` 设置为 `false`：


    ```

    const lounger = { loaded: false };

    ```


    同时，我们还存储了模块的当前版本：


    ```

    lounger.version = pkg.version;

    ```


    我们需要一个位置来存储 API 和 CLI 命令。由于引导过程是异步的，如果有人试图在引导完成前访问已暴露的函数，我们将抛出错误：


    ```

    const api = {}, cli = {};

    Object.defineProperty(lounger, ''commands'', {

    get: () => {

    if (lounger.loaded === false) {

    throw new Error(''请先运行 lounger.load'');

    }

    return api;

    }

    });

    Object.defineProperty(lounger, ''cli'', {

    get: () => {

    if (lounger.loaded === false) {

    throw new Error(''请先运行 lounger.load'');

    }

    return cli;

    }

    });

    ```


    当 `lounger.loaded` 为 `false`，并且我们尝试访问 `lounger.cli` 和 `lounger.api` 上的属性时，`Object.defineProperty`
    的自定义 getter 会抛出错误。


    该机制同样适用于 Node.js REPL 中的自动补全功能（当你按下 Tab 键尝试补全时）。试试看吧！


    文件的最后部分是实际的引导过程，在此过程中，我们获取 `lib` 文件夹中的所有文件，如果它们是 JavaScript 文件且不是当前正在操作的文件 `lounger.js`，则对其执行
    require 操作。


    引导 `lounger` 的函数名为 `lounger.load`。此处我们使用了具名函数。在应用程序崩溃时，具名函数在堆栈跟踪中会很有帮助：


    ```

    lounger.load = function load () {

    return new Promise((resolve, reject) => {

    });

    };

    ```


    `fs.readdir` 函数将列出目录中的所有文件。我们遍历 `fs.readdir` 返回的文件列表：


    ```

    lounger.load = function load () {

    return new Promise((resolve, reject) => {

    fs.readdir(__dirname, (err, files) => {

    files.forEach((file) => {

    });

    });

    });

    };

    ```


    如果文件不是 JS 文件，或者就是 `lounger.js` 本身，我们通过提前返回来忽略它：


    ```

    if (!/\.js$/.test(file) || file === ''lounger.js'') {

    return;

    }

    ```


    在其他所有情况下，我们假设找到了一条适用于 `lounger` 的命令。我们从文件名的 `.js` 之前提取所有内容，并将其保存为 `cmd`：


    ```

    const cmd = file.match(/(.*)\.js$/)[1];

    ```


    我们 require 该文件：


    ```

    const mod = require(''./'' + file);

    ```


    如果文件将 API 命令导出为 `api` 属性，我们将其暴露在 `lounger.commands` 上。所有 CLI 命令都可在 `lounger.cli`
    上获取：


    ```

    if (mod.cli) {

    cli[cmd] = mod.cli;

    }

    if (mod.api) {

    api[cmd] = mod.api;

    }

    ```


    在 `forEach` 循环完成且所有命令都加载完毕后，我们可以将 `lounger.loaded` 设置为 `true`。这将阻止我们之前添加的检查抛出错误：


    ```

    lounger.loaded = true;

    ```


    最后一步，我们 resolve 这个 promise：


    ```

    resolve(lounger);

    ```


    完整的 `lounger.load` 函数如下所示：


    ```

    lounger.load = function load () {

    return new Promise((resolve, reject) => {

    fs.readdir(__dirname, (err, files) => {

    files.forEach((file) => {

    if (!/\.js$/.test(file) || file === ''lounger.js'') {

    return;

    }

    const cmd = file.match(/(.*)\.js$/)[1];

    const mod = require(''./'' + file);

    if (mod.cli) {

    cli[cmd] = mod.cli;

    }

    if (mod.api) {

    api[cmd] = mod.api;

    }

    });

    lounger.loaded = true;

    resolve(lounger);

    });

    });

    };

    ```


    我们差点忘记导出 `lounger`，因此在文件末尾添加了 `module.exports`：


    ```

    module.exports = lounger;

    ```


    我们现在就可以使用这段代码了：


    ```

    $ node

    > const lounger = require(''./lib/lounger.js''); lounger.load().then(console.log);

    Promise {  }

    > { loaded: true, version: ''1.0.0'', load: [Function: load] }

    > lounger.commands

    { isonline: [Function: isOnline] }

    > lounger.cli

    { isonline: [Function: cli] }

    > lounger.commands.isonline(''http://localhost:5984'').then(console.log);

    Promise {  }

    > { ''http://localhost:5984'': true }

    ```


    本节的最后一步是让 `lounger` 能在终端本身上使用。为此，我们已经创建了 `bin` 文件夹。现在是将名为 `lounger-cli.js` 的文件放入
    `bin` 的时候了！


    ### 一种从命令行交互的优雅方式


    npm 有一个很好的特性：如果我们把一个 JavaScript 文件添加到模块的 `package.json` 文件中名为 `bin` 的属性里，当我们全局安装这个包时（使用
    `npm install -g lounger`），npm 会将其添加到我们的 `PATH` 环境变量中。


    如果我们定义了 `bin` 属性并且 `lounger` 已全局安装，它将以 `lounger`（即我们的包名）的形式在终端上可用——非常方便！为了通知用户某个包是设计为全局安装的，我们可以在
    `package.json` 中添加 `preferGlobal: true`（参见 [`docs.npmjs.com/files/package.json#preferglobal`](https://docs.npmjs.com/files/package.json#preferglobal)）。


    为了启用这两个特性，我们在 `package.json` 中添加以下两行：


    ```

    "bin": "./bin/lounger-cli",

    "preferGlobal": true,

    ```


    此外，如果我们在 Linux 或 macOS 上运行，还必须使 `bin/lounger-cli` 文件具有可执行权限：


    ```

    $ chmod +x bin/lounger-cli

    ```


    我们的 `lounger-cli` 文件的第一行将是一个 shebang 行。这告诉 Linux/Unix shell 用户，必须使用 Node.js 来运行我们的文件：


    ```

    #!/usr/bin/env node

    ```


    之后，我们加载 `lib/lounger.js`，这是我们的命令行工具的核心：


    ```

    const lounger = require(''../lib/lounger.js'');

    ```


    下一步是解析我们的命令行参数。在这个案例中，我们使用 `nopt` 模块来实现这一目的（使用 `npm i --save nopt` 安装它）。我们也可以自己解析参数，但像
    `nopt` 这样久经考验的模块提供了更多功能，并且更易于使用。我们通过访问 `parsed.argv.remain` 来获取传入的命令：


    ```

    const nopt = require(''nopt'');

    const parsed = nopt({}, {}, process.argv, 2);

    const cmd = parsed.argv.remain.shift();

    ```


    下一步是通过调用 `lounger.load` 来启动客户端，这将引导客户端并填充 `lounger.commands` 和 `lounger.cli`。在
    promise 被 resolve 之后，我们调用在命令行上传入的命令：


    ```

    lounger.load().then(() => {

    lounger.cli[cmd]

    .apply(null, parsed.argv.remain)

    .catch((err) => {

    console.error(err);

    });

    }).catch((err) => {

    console.error(err);

    });

    ```


    由于每个命令都返回一个 promise，我们使用 `catch` 来捕获错误，然后将它们打印到控制台。


    我们现在可以在命令行上测试这个极简的命令行客户端了：


    ```

    $ npm install -g .

    $ lounger isonline http://test.example.com

    http://test.example.com 似乎离线或没有数据库

    ```


    假设我们的 PouchDB/CouchDB 服务器正在运行：


    ```

    $ lounger isonline http://localhost:5984

    http://localhost:5984 似乎在线

    ```


    与其每次修改代码后都运行 `npm install -g .`，不如在模块目录中运行 `npm link`。这会将全局安装链接到当前目录，这意味着只要目录不变，每次更改都会立即可用。


    **注意**

    本节的代码可以在 `sourcecode/client-bootstrap` 中找到。


    **选择你喜欢的风格**

    npm 上有无数优秀的参数解析库。`nopt` 的一些替代品包括 `commander`、`optimist` 和 `yargs`。


    ## 总结


    在本章中，我们为命令行客户端创建了第一个基础构建块。现在，我们为开发一个可扩展的命令行客户端打下了坚实的基础。我们还添加了第一个命令。然而，距离打造出一个用户喜爱并愿意推广的产品，我们还有很长的路要走。我们的
    CLI 仍然有些粗糙，并且缺少许多成功 CLI 所具备的功能。我们将在下一章中解决这些问题，届时我们将重点关注可用性和可访问性。

