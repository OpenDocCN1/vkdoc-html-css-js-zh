    \ 80  \n本章小结 82  \n\n第 4 章：使用流迁移大量数据 83  \n`cat` 命令 84  \n第一个流 85  \n转换流与可写流 87\
    \  \n创建包装转换流 88  \n将结果管道化到可写流 91  \n流式导入命令 95  \n设计命令 98  \n创建目标数据库 98  \n本章小结\
    \ 104  \n\n附录 A：技巧与窍门 105  \n测试 105  \n使用 SemVer 进行语义化版本控制 105  \nGreenkeeper\
    \ 106  \n索引 107  \n\n关于作者与技术评审  \n关于作者  \n关于技术评审  \n\n# 1. 什么是好的 CLI？\n\n在本章中，你将审视那些成功的命令行客户端以及它们的出色之处。这将帮助你理解用户面临的问题，从而帮助你在本书后续内容中，用\
    \ Node.js 构建更好的命令行客户端。\n\n## CLI 基础\n\n首先，我们来看看用户通常如何使用命令行界面。大多数时候，用户坐在键盘前，与终端交互。你应该为\
    \ CLI 使用简单且易于识别的命令。但遗憾的是，仅仅使用易于识别的命令还远远不够。\n\n如果你看一个糟糕的 CLI 示例，问题会更容易理解：\n\n```\n\
    $ my-example-cli -A -a 16 r foo.html\nerror: undefined is not a function\n```\n\
    \n在这个例子中，你必须输入晦涩难懂的命令，然后收到一条同样晦涩的错误信息。你可能会问：“`-A -a 16 r` 是什么意思？”，“为什么我收到了错误信息，是我用错了吗？”以及“这个错误信息是什么意思，我怎样才能完成我的任务？”\n\
    \n那么，是什么造就了一个好的 CLI？简而言之，一个成功的 CLI 就是能让用户成功且满意。\n\n让我们尝试使用以下三个原则来创建一个 CLI：\n\n\
    * 你永远不会在 CLI 中卡住。\n* 它既简单又支持高级用户。\n* 你可以用它做很多事情。\n\n## 永不卡壳\n\n没人喜欢堵在路上，卡在车流里，每分钟只能挪动几英尺。我们总想以最快、最舒适的方式到达目的地。这同样适用于你的用户：当工具成为他们前进的阻碍时，他们会非常不高兴。他们只想完成自己的任务。\n\
    \n“永不卡壳”意味着你应该始终为用户提供解决任务的方法。一个命令绝不应该是一条死胡同。此外，你应该避免命令行工具中任何可能引起摩擦的地方。\n\n为了更好地说明这一点，让我们来看看\
    \ Git 和 npm——两个非常成功的命令行工具。\n\n下面的例子使用了 Git：\n\n```\n$ git poll\ngit: 'poll' 不是一个\
    \ git 命令。参见 'git --help'。\n你是不是想输入：\npull\n```\n\n在这个例子中，我输错了命令，将 `pull` 输成了 `poll`。幸运的是，Git\
    \ 提供了一种让我继续工作并完成任务的途径。\n\nGit 基本上在说：“嘿，Robert，看起来你输错了命令，但如果你输入 `git --help`，你可以看到所有现有命令的列表。而且，嘿，看起来你输入了\
    \ `git poll`；你是不是想输入 `git pull`？”\n\nnpm，另一个成功的 CLI 客户端，也提供了相同的理念：\n\n```\n$ npm\
    \ ragrragr\n用法: npm <command>\n其中 <command> 可以是以下之一：\naccess, add-user, adduser,\
    \ apihelp, author, bin, bugs, c,\ncache, completion, config, ddp, dedupe, deprecate,\
    \ dist-tag,\ndist-tags, docs, edit, explore, faq, find, find-dupes, get,\nhelp,\
    \ help-search, home, i, info, init, install, issues, la,\nlink, list, ll, ln,\
    \ login, logout, ls, outdated, owner,\npack, prefix, prune, publish, r, rb, rebuild,\
    \ remove, repo,\nrestart, rm, root, run-script, s, se, search, set, show,\nshrinkwrap,\
    \ star, stars, start, stop, t, tag, test, tst, un,\nuninstall, unlink, unpublish,\
    \ unstar, up, update, upgrade,\nv, verison, version, view, whoami\n\nnpm -h  \
    \   获取 <command> 的快速帮助\nnpm -l     显示完整用法信息\nnpm faq    常见问题解答\nnpm help <term>\
    \  搜索关于 <term> 的帮助\nnpm help npm     概览\n\n配置以 ini 格式文件指定：\n/Users/robert/.npmrc\n\
    或在命令行通过以下方式指定：npm <command> —key value\n配置信息可通过以下方式查看：npm help config\n\nnpm@5.5.1\
    \ /Users/robert/.nvm/versions/node/v9.1.0/lib/node_modules/npm\n```\n\n在这个例子中，我试图向\
    \ npm 输入垃圾信息，因此 npm 提供了一些友好的帮助：“嘿，Robert，我不知道那个命令，但这里列出了所有可用的命令。你可以像这样使用它们，并通过输入\
    \ `npm help <command>` 来获取关于它们的帮助。”\n\n像 Git 一样，npm 立即提供帮助，让我能够完成任务，即使我完全不知道如何使用\
    \ npm。\n"
- fmt: "### Still Lost? Man Pages Will Help\n\nWhat if I still need help? Maybe I\
    \ want to get help before trying out any commands. Turns out, there’s a reliable\
    \ way to find documentation on Unix or Linux: manual pages, or man pages, shown\
    \ in Figure [1-1](#A456043_1_En_1_Chapter.html#Fig1).\n\n![A456043_1_En_1_Fig1_HTML.jpg](A456043_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1\n\nThe man page for `git pull`\n\nMan pages are quite nice, as you\
    \ don’t need the Internet to open them. You can also stay in the same terminal\
    \ window to read them and don’t have to switch to another window (such as a browser).\n\
    \nBut some users don’t know about man pages or don’t like to use them. Others\
    \ will be working on Windows, which can’t handle man pages natively, so Git and\
    \ `npm` offer their documentation as web pages, as shown in Figure [1-2](#A456043_1_En_1_Chapter.html#Fig2).\n\
    \n![A456043_1_En_1_Fig2_HTML.jpg](A456043_1_En_1_Fig2_HTML.jpg)\n\nFigure 1-2\n\
    \nThe documentation web site of the Git project\n\nBoth Git and `npm` use a trick:\
    \ they write their documentation once (for example, in Markdown or AsciiDoc) and\
    \ use that initial source as a base. Later, they convert those base documents\
    \ to different formats (for example, to HTML).\n\nIf you look at the online man\
    \ pages of Git and `npm`, you will notice that their web sites frame the content\
    \ with a header and a sidebar. Figure [1-3](#A456043_1_En_1_Chapter.html#Fig3)\
    \ and Figure [1-4](#A456043_1_En_1_Chapter.html#Fig4) illustrate this with the\
    \ different versions for the command `npm publish`.\n\n![A456043_1_En_1_Fig4_HTML.jpg](A456043_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4\n\nThe documentation web site for `npm publish`\n\n![A456043_1_En_1_Fig3_HTML.jpg](A456043_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nThe man page for `npm publish`\n\n### Error Handling\n\nSometimes\
    \ things go horribly wrong. Let’s look at my example of a bad CLI again:\n\n```\n\
    $ my-example-cli -A -a 16 r foo.py\nevents.js:85\nthrow er; // Unhandled 'error'\
    \ event\n^\nError: ENOENT, open 'cli.js'\nat Error (native)\n```\n\nIn this case,\
    \ you are getting back a stacktrace without much context. For most people, these\
    \ stacktraces look cryptic, especially for people who don't write Node.js on a\
    \ daily basis.\n\nAnd it is even worse: you really can't tell whether you just\
    \ hit a bug in the CLI or you are using it in the wrong way. Imagine your users\
    \ in this situation. Looking at that small terminal, with no idea what to do,\
    \ they get extremely frustrated.\n\nOne thing `nmo` supports is usage errors.\
    \ Here is what they look like:\n\n```\n$ nmo cluster dsf\nERR! Usage:\nnmo cluster\
    \ get [], []\nnmo cluster add , , \nnmo cluster join \n```\n\nIf a user tries\
    \ to use a command in the wrong way, `nmo` will indicate immediately how to use\
    \ the command to get the job done. No need to open the documentation.\n\n`nmo`\
    \ also shows stacktraces to a user if `nmo` crashes:\n\n```\n$ nmo cluster join\
    \ anemone\nERR! df is not defined\nERR! ReferenceError: df is not defined\nERR!\
    \     at /Users/robert/apache/nmo/lib/cluster.js:84:5\nERR!     at cli (/Users/robert/apache/nmo/lib/cluster.js:68:27)\n\
    ERR!     at /Users/robert/apache/nmo/bin/nmo-cli.js:32:6\nERR!\nERR! nmo: 1.0.1\
    \ node: v9.1.0\nERR! please open an issue including this log on https://github.com/robertkowalski/nmo/issues\n\
    ```\n\n`nmo` adds the current `nmo` and Node.js version to the stacktrace, as\
    \ `npm` does. We also ask the user to copy the stacktrace and to open an issue\
    \ containing the stacktrace.\n\nThe reports make it easy for a team to identify\
    \ the bug, solve it, and release a new version of `nmo` by seeing the stacktrace.\n\
    \nAnd, again, the user is not stuck. The user gets help to solve the task, and\
    \ in the worst case, you help the user through your issue tracker.\n\n## It Supports\
    \ Power Users\n\nPower users are important for your CLI. They are the users who\
    \ will talk about your CLI and increase its overall adoption by spreading the\
    \ word. The following subsections cover ways to improve interactions with power\
    \ users.\n\n### Shortcuts\n\nMost power users use your CLI multiple times every\
    \ day. An easy way to support them is to provide shortcuts.\n\n`npm` has lots\
    \ of shortcuts. For instance, `npm i` is the short form for `npm install`. Git\
    \ lets you define your own shortcuts in the `.gitconfig` file. I use `git co`\
    \ as a shortcut for `git checkout`, for example.\n\n### Scripting\n\nAt some point,\
    \ your command-line client will become very successful; people will love it and\
    \ start using it in creative ways. The CLI will suddenly run on Jenkins, as part\
    \ of deployment in a Chef or Puppet run, or your users will use your CLI in ways\
    \ you never could have imagined!\n\nSooner or later, automated processes will\
    \ also use your CLI. To make your CLI even more successful, it's a good idea to\
    \ support scripting.\n\n#### Exit Codes\n\nOperating systems use exit codes to\
    \ signal whether a command was successful. You will get back a `0` if your recent\
    \ command was successful. Getting back a `1` indicates a general error.\n\nExit\
    \ codes are useful for users who want to wrap your command-line client in a bash\
    \ script.\n\nHere is an example:\n\n```\n$ git poll\ngit: 'poll' is not a git\
    \ command. See 'git --help'.\nDid you mean this?\npull\n$ echo $?\n```\n\nGit\
    \ notifies you that something went wrong; you are getting back a `1` as the exit\
    \ code. With proper exit codes, every writer of a bash script can handle unsuccessful\
    \ commands.\n\n#### JSON Output\n\nIn `nmo`, every command that gives back information\
    \ supports JSON-formatted output:\n\n```\n$ nmo cluster get --json\n{ anemone:\n\
    { node1: 'http://node1.local',\nnode2: 'http://node2.local',\nnode3: 'http://node3.local'\
    \ } }\n```\n\nJSON support enables users to process data easily in the programming\
    \ language of their choice, as most languages support JSON. Users can spawn a\
    \ child process in language x and listen to `stdout` for the output. They can\
    \ also directly pipe the output into a consumer on the shell:\n\n```\n$ nmo cluster\
    \ get --json | consumer.py\n```\n\nJSON output gives users a lot of flexibility.\n\
    \n#### The API in the Command-Line Client\n\nAnother concept can make scripting\
    \ easier. I call it the API in the command-line client:\n\n```javascript\nconst\
    \ nmo = require('nmo');\nnmo.load({}).then(() => {\nnmo.commands.cluster\n.get('testcluster',\
    \ 'node1@127.0.01')\n.then((res) => {\nconsole.log(res);\n});\n});\n```\n\nIn\
    \ `nmo`, every command is exposed on `nmo.commands`. If a user wants to use `nmo`\
    \ as part of their node scripts, they are able to require it. The JavaScript API\
    \ is documented like the CLI.\n\nThe JavaScript API enables users to embed `nmo`\
    \ in their Node.js scripts for complex processes. They could even fork `nmo` and\
    \ embed it into their own command-line client.\n\n### Configuration\n\nPower users\
    \ love configuration. Because they use command-line clients a lot, maybe multiple\
    \ times a day, it is no surprise that they want some features enabled by default.\
    \ But in rare cases, they don't want the default setting.\n\n`npm` supports option\
    \ arguments on the command line:\n\n```\n$ npm i hapi --registry=https://reg.example.org\n\
    /Users/robert\n└── hapi@9.0.4\n```\n\nThis command downloads the package `hapi`\
    \ from a private registry at `https://reg.example.org`.\n\nBut I can also set\
    \ this private registry as the new default registry:\n\n```\n$ npm config set\
    \ registry https://reg.example.org\n```\n\n`npm` writes the new registry into\
    \ the config:\n\n```\n$ cat ~/.npmrc\nloglevel=http\nregistry=https://reg.example.org\n\
    ```\n\nThe next time I try to install a package, `npm` will use my new default\
    \ registry, `https://reg.example.org`:\n\n```\n$ npm i hapi\n```\n\nIf I don't\
    \ want to use this new default registry, I can pass an argument to the CLI, and\
    \ it will use the alternate registry just for this call:\n\n```\n$ npm i hapi\
    \ --registry=https://registry.npmjs.org\n/Users/robert\n└── hapi@9.0.4\n```\n\n\
    That means we have choices between default configurations and command-line arguments\
    \ in `npm`, and this combination is extremely powerful."
  raw: "### Still Lost? Man Pages Will Help\n\nWhat if I still need help? Maybe I\
    \ want to get help before trying out any commands . Turns out, there’s a reliable\
    \ way to find documentation on Unix or Linux: manual pages, or man pages, shown\
    \ in Figure [1-1](#A456043_1_En_1_Chapter.html#Fig1).\n\n![A456043_1_En_1_Fig1_HTML.jpg](A456043_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1\n\nThe man page for git pull\n\nMan pages are quite nice, as you\
    \ don’t need the Internet to open them. You can also stay in the same terminal\
    \ window to read them and don’t have to switch to another window (such as a. a\
    \ browser).\n\nBut some users don’t know about man pages or don’t like to use\
    \ them. Others will be working on Windows, which can’t handle man pages natively,\
    \ so Git and npm offer their documentation as web pages, as shown in Figure [1-2](#A456043_1_En_1_Chapter.html#Fig2).\n\
    \n![A456043_1_En_1_Fig2_HTML.jpg](A456043_1_En_1_Fig2_HTML.jpg)\n\nFigure 1-2\n\
    \nThe documentation web site of the Git project\n\nBoth Git and npm use a trick:\
    \ they write their documentation once (for example, in Markdown or AsciiDoc) and\
    \ use that initial source as a base. Later, they convert those base documents\
    \ to different formats (for example, to HTML).\n\nIf you look at the online man\
    \ pages of Git and npm, you will notice that their web sites frame the content\
    \ with a header and a sidebar. Figure [1-3](#A456043_1_En_1_Chapter.html#Fig3)\
    \ and Figure [1-4](#A456043_1_En_1_Chapter.html#Fig4) illustrate this with the\
    \ different versions for the command `npm publish`.\n\n![A456043_1_En_1_Fig4_HTML.jpg](A456043_1_En_1_Fig4_HTML.jpg)\n\
    \nFigure 1-4\n\nThe documentation web site for npm publish\n\n![A456043_1_En_1_Fig3_HTML.jpg](A456043_1_En_1_Fig3_HTML.jpg)\n\
    \nFigure 1-3\n\nThe man page for npm publish\n\n### Error Handling\n\nSometimes\
    \ things go still horribly wrong. Let’s look at my example of a bad CLI again:\n\
    \n```\n$ my-example-cli -A -a 16 r foo.py\nevents.js:85\nthrow er; // Unhandled\
    \ 'error' event\n^\nError: ENOENT, open 'cli.js'\nat Error (native)\n```\n\nIn\
    \ this case, you are getting back a stacktrace without much context. For most\
    \ people, these stacktraces look cryptic, especially for people who don’t write\
    \ Node.js on a daily basis.\n\nAnd it is even worse: you really can’t tell whether\
    \ you just hit a bug in the CLI or you are using the it in the wrong way. Imagine\
    \ your users in this situation. Looking at that small terminal, with no idea what\
    \ to do, they get extremely frustrated.\n\nOne thing nmo supports is usage errors.\
    \ Here is what they look like:\n\n```\n$ nmo cluster dsf\nERR! Usage:\nnmo cluster\
    \ get [], []\nnmo cluster add , , \nnmo cluster join \n```\n\nIf a user tries\
    \ to use a command in the wrong way, nmo will indicate immediately how to use\
    \ the command to get the job done. No need to open the documentation.\n\nnmo also\
    \ shows stacktraces to a user if nmo crashes:\n\n```\n$ nmo cluster join anemone\n\
    ERR! df is not defined\nERR! ReferenceError: df is not defined\nERR!     at /Users/robert/apache/nmo/lib/cluster.js:84:5\n\
    ERR!     at cli (/Users/robert/apache/nmo/lib/cluster.js:68:27)\nERR!     at /Users/robert/apache/nmo/bin/nmo-cli.js:32:6\n\
    ERR!\nERR! nmo: 1.0.1 node: v9.1.0\nERR! please open an issue including this log\
    \ on https://github.com/robertkowalski/nmo/issues\n```\n\nnmo adds the current\
    \ nmo and Node.js version to the stacktrace, as npm does. We also ask the user\
    \ to copy the stacktrace and to open an [issue containing the stacktrace](https://github.com/robertkowalski/nmo/issues/1).\n\
    \n[The reports](https://github.com/robertkowalski/nmo/issues/1) make it easy for\
    \ a team to identify the bug, solve it, and release a new version of nmo by seeing\
    \ the stacktrace.\n\nAnd, again, the user is not stuck. The user gets help to\
    \ solve the task, and in the worst case, you help the user through your issue\
    \ tracker.\n\n## It Supports Power Users\n\nPower users are important for your\
    \ CLI. They are the users who will talk about your CLI and increase its overall\
    \ adoption by spreading the word. The following subsections cover ways to improve\
    \ interactions with power users.\n\n### Shortcuts\n\nMost power users use your\
    \ CLI multiple times every day. An easy way to support them is to provide shortcuts.\n\
    \nnpm has lots of shortcuts . For instance, `npm i` is the short form for `npm\
    \ install`. Git lets you define your own shortcuts in the `.git`config file. I\
    \ use `git co` as a shortcut for `git checkout`, for example.\n\n### Scripting\n\
    \nAt some point, your command-line client will become very successful; people\
    \ will love it and start using it in creative ways. The CLI will suddenly run\
    \ on Jenkins, as part of deployment in a Chef or Puppet run, or your users will\
    \ use your CLI in ways you never could have imagined!\n\nSooner or later, automated\
    \ processes will also use your CLI. To make your CLI even more successful, it’s\
    \ a good idea to support scripting.\n\n#### Exit Codes\n\nOperating systems use\
    \ exit codes to signal whether a command was successful. You will get back a `0`\
    \ if your recent command was successful. Getting back a `1` indicates a general\
    \ error.\n\nExit codes are useful for users who want to wrap your command-line\
    \ client in a bash script.\n\nHere is an example:\n\n```\n$ git poll\ngit: 'poll'\
    \ is not a git command. See 'git --help'.\nDid you mean this?\npull\n$ echo $?\n\
    \n```\n\nGit notifies you that something went wrong; you are getting back a `1`\
    \ as the exit code. With proper exit codes, every writer of a bash script can\
    \ handle unsuccessful commands.\n\n#### JSON Output\n\nIn nmo, every command that\
    \ gives back information supports JSON-formatted output:\n\n```\n$ nmo cluster\
    \ get --json\n{ anemone:\n{ node1: 'http://node1.local',\nnode2: 'http://node2.local',\n\
    node3: 'http://node3.local' } }\n```\n\nJSON support enables users to process\
    \ data easily in the programming language of their choice, as most languages support\
    \ JSON. Users can spawn a child process in language x and listen to `stdout` for\
    \ the output. They can also directly pipe the output into a consumer on the shell:\n\
    \n```\n$ nmo cluster get --json | consumer.py\n```\n\nJSON output gives users\
    \ a lot of flexibility.\n\n#### The API in the Command-Line Client\n\nAnother\
    \ concept can make scripting easier. I call it the API in the command-line client:\n\
    \n```\nconst nmo = require('nmo');\nnmo.load({}).then(() => {\nnmo.commands.cluster\n\
    .get('testcluster', 'node1@127.0.01')\n.then((res) => {\nconsole.log(res);\n});\n\
    });\n```\n\nIn nmo, every command is exposed on `nmo.commands`. If a user wants\
    \ to use nmo as part of their node scripts, they are able to require it. The JavaScript\
    \ API is [documented like the CLI](http://apache.github.io/couchdb-nmo/api/nmo-cluster.html).\n\
    \nThe JavaScript API enables users to embed nmo in their Node.js scripts for complex\
    \ processes. They could even fork nmo and embed it into their own command-line\
    \ client.\n\n### Configuration\n\nPower users love configuration. Because they\
    \ use command-line clients a lot, maybe multiple times a day, it is no surprise\
    \ that they want some features enabled by default. But in rare cases, they don’t\
    \ want the default setting.\n\nnpm supports option arguments on the command line:\n\
    \n```\n$ npm i hapi --registry=https://reg.example.org\n/Users/robert\n└── hapi@9.0.4\n\
    ```\n\nThis command downloads the package `hapi` from a private registry at [`https://reg.example.org`](https://reg.kowalski.gd)\
    \ .\n\nBut I can also set this private registry as the new default registry:\n\
    \n```\n$ npm config set registry https://reg.example.org\n```\n\nnpm writes the\
    \ new registry into the config:\n\n```\n$ cat ~/.npmrc\nloglevel=http\nregistry=https://reg.example.org\n\
    ```\n\nThe next time I try to install a package, npm will use my new default registry,\
    \ [`https://reg.example.org`](https://reg.kowalski.gd/) :\n\n```\n$ npm i hapi\n\
    ```\n\nIf I don’t want to use this new default registry, I can pass an argument\
    \ to the CLI, and it will use the alternate registry just for this call:\n\n```\n\
    $ npm i hapi --registry=https://registry.npmjs.org\n/Users/robert\n└── hapi@9.0.4\n\
    ```\n\nThat means we have choices between default configurations and command-line\
    \ arguments in npm, and this combination is extremely powerful."
  trans: "\n### 还是不知所措？手册页来帮忙\n\n如果还是需要帮助怎么办？也许我想在尝试任何命令之前先获取帮助。事实证明，在 Unix 或 Linux\
    \ 上查找文档有一种可靠的方法：手册页，也称为 man 页，如图 1-1 所示。\n\n![A456043_1_En_1_Fig1_HTML.jpg](img/A456043_1_En_1_Fig1_HTML.jpg)\n\
    \n图 1-1\n\n`git pull` 的手册页\n\n手册页相当不错，因为你无需联网就能打开它们。你也可以停留在同一个终端窗口中阅读，无需切换到另一个窗口（比如浏览器）。\n\
    \n但有些用户不知道手册页，或者不喜欢使用它们。其他人则可能使用 Windows，它本身无法处理手册页，因此 Git 和 `npm` 将其文档以网页形式提供，如图\
    \ 1-2 所示。\n\n![A456043_1_En_1_Fig2_HTML.jpg](img/A456043_1_En_1_Fig2_HTML.jpg)\n\
    \n图 1-2\n\nGit 项目的文档网站\n\nGit 和 `npm` 都使用了一个技巧：它们一次性编写文档（例如，使用 Markdown 或 AsciiDoc），并将此初始源码作为基础。然后，它们将这些基础文档转换成不同的格式（例如，转换成\
    \ HTML）。\n\n如果你查看 Git 和 `npm` 的在线手册页，你会注意到它们的网站用页眉和侧边栏将内容框起来。图 1-3 和图 1-4 用 `npm\
    \ publish` 命令的不同版本说明了这一点。\n\n![A456043_1_En_1_Fig4_HTML.jpg](img/A456043_1_En_1_Fig4_HTML.jpg)\n\
    \n图 1-4\n\n`npm publish` 的文档网站\n\n![A456043_1_En_1_Fig3_HTML.jpg](img/A456043_1_En_1_Fig3_HTML.jpg)\n\
    \n图 1-3\n\n`npm publish` 的手册页\n\n### 错误处理\n\n有时事情会出大错。让我们再看看我之前那个糟糕 CLI 的例子：\n\
    \n```\n$ my-example-cli -A -a 16 r foo.py\nevents.js:85\nthrow er; // Unhandled\
    \ 'error' event\n^\nError: ENOENT, open 'cli.js'\nat Error (native)\n```\n\n在这种情况中，你得到的只是一个没什么上下文的堆栈跟踪。对大多数人来说，这些堆栈跟踪看起来很晦涩，尤其是对于那些不是每天编写\
    \ Node.js 的人来说。\n\n而且情况更糟：你根本无法判断你是遇到了 CLI 的 bug 还是用错了方式。想象一下你的用户处于这种境地。看着那个小小的终端，完全不知道该怎么办，他们会感到极其挫败。\n\
    \n`nmo` 支持的一个特性是使用错误。以下是它的表现：\n\n```\n$ nmo cluster dsf\nERR! 用法:\nnmo cluster\
    \ get [], []\nnmo cluster add , , \nnmo cluster join \n```\n\n如果用户尝试以错误方式使用命令，`nmo`\
    \ 会立即指示如何正确使用该命令以完成任务。无需打开文档。\n\n如果 `nmo` 崩溃，它也会向用户显示堆栈跟踪：\n\n```\n$ nmo cluster\
    \ join anemone\nERR! df is not defined\nERR! ReferenceError: df is not defined\n\
    ERR!     at /Users/robert/apache/nmo/lib/cluster.js:84:5\nERR!     at cli (/Users/robert/apache/nmo/lib/cluster.js:68:27)\n\
    ERR!     at /Users/robert/apache/nmo/bin/nmo-cli.js:32:6\nERR!\nERR! nmo: 1.0.1\
    \ node: v9.1.0\nERR! 请在此日志在 https://github.com/robertkowalski/nmo/issues 上创建一个\
    \ issue\n```\n\n和 `npm` 一样，`nmo` 会将当前的 `nmo` 和 Node.js 版本添加到堆栈跟踪中。我们还要求用户复制堆栈跟踪，并创建一个包含该堆栈跟踪的\
    \ issue。\n\n这些报告使得团队能通过查看堆栈跟踪轻松地识别 bug，解决它，并发布新版本的 `nmo`。\n\n再次强调，用户不会卡住。用户会得到帮助来完成任务，在最坏的情况下，你也可以通过\
    \ issue 跟踪器帮助用户。\n\n## 支持高级用户\n\n高级用户对你的 CLI 很重要。他们是会谈论你的 CLI 并通过口口相传提高其整体采用率的用户。以下小节介绍了改善与高级用户交互的方法。\n\
    \n### 快捷方式\n\n大多数高级用户每天会多次使用你的 CLI。支持他们的一种简单方法是提供快捷方式。\n\n`npm` 有很多快捷方式。例如，`npm\
    \ i` 是 `npm install` 的简写。Git 允许你在 `.gitconfig` 文件中定义自己的快捷方式。例如，我使用 `git co` 作为\
    \ `git checkout` 的快捷方式。\n\n### 脚本化\n\n在某个时候，你的命令行客户端会变得非常成功；人们会喜欢它，并开始创造性地使用它。CLI\
    \ 会突然在 Jenkins 上运行，作为 Chef 或 Puppet 运行中部署的一部分，或者你的用户会以你从未想象过的方式使用你的 CLI！\n\n自动化进程迟早也会使用你的\
    \ CLI。为了使你的 CLI 更加成功，支持脚本化是个好主意。\n\n#### 退出码\n\n操作系统使用退出码来指示命令是否成功。如果你最近执行的命令成功，你将得到一个\
    \ `0`。得到 `1` 则表示一般性错误。\n\n退出码对于那些想将你的命令行客户端包装在 bash 脚本中的用户很有用。\n\n以下是一个示例：\n\n\
    ```\n$ git poll\ngit: 'poll' is not a git command. See 'git --help'.\nDid you\
    \ mean this?\npull\n$ echo $?\n```\n\nGit 通知你出了问题；你得到返回的退出码是 `1`。有了正确的退出码，每个 bash\
    \ 脚本的编写者都可以处理不成功的命令。\n\n#### JSON 输出\n\n在 `nmo` 中，每个返回信息的命令都支持 JSON 格式的输出：\n\n\
    ```\n$ nmo cluster get --json\n{ anemone:\n{ node1: 'http://node1.local',\nnode2:\
    \ 'http://node2.local',\nnode3: 'http://node3.local' } }\n```\n\n支持 JSON 使用户能够轻松地使用他们选择的编程语言处理数据，因为大多数语言都支持\
    \ JSON。用户可以在语言 x 中生成一个子进程，并监听 `stdout` 以获取输出。他们也可以直接将输出通过管道输送给 shell 上的消费者：\n\n\
    ```\n$ nmo cluster get --json | consumer.py\n```\n\nJSON 输出给用户带来了很大的灵活性。\n\n####\
    \ 命令行客户端中的 API\n\n另一个概念可以使脚本化变得更容易。我称之为命令行客户端中的 API：\n\n```javascript\nconst nmo\
    \ = require('nmo');\nnmo.load({}).then(() => {\nnmo.commands.cluster\n.get('testcluster',\
    \ 'node1@127.0.01')\n.then((res) => {\nconsole.log(res);\n});\n});\n```\n\n在 `nmo`\
    \ 中，每个命令都暴露在 `nmo.commands` 上。如果用户想将 `nmo` 作为其 Node.js 脚本的一部分使用，他们可以引入它。JavaScript\
    \ API 的文档与 CLI 的文档类似。\n\nJavaScript API 使用户能够将 `nmo` 嵌入到他们的 Node.js 脚本中，以处理复杂流程。他们甚至可以派生\
    \ `nmo` 并将其嵌入到自己的命令行客户端中。\n\n### 配置\n\n高级用户喜欢配置。因为他们经常使用命令行客户端，可能一天好几次，所以他们希望某些功能默认启用也就不足为奇了。但在少数情况下，他们不想要默认设置。\n\
    \n`npm` 在命令行上支持选项参数：\n\n```\n$ npm i hapi --registry=https://reg.example.org\n\
    /Users/robert\n└── hapi@9.0.4\n```\n\n此命令从 `https://reg.example.org` 的私有注册表下载包\
    \ `hapi`。\n\n但我也可以将此私有注册表设置为新的默认注册表：\n\n```\n$ npm config set registry https://reg.example.org\n\
    ```\n\n`npm` 将新的注册表写入配置：\n\n```\n$ cat ~/.npmrc\nloglevel=http\nregistry=https://reg.example.org\n\
    ```\n\n下次我尝试安装包时，`npm` 将使用我的新默认注册表 `https://reg.example.org`：\n\n```\n$ npm i\
    \ hapi\n```\n\n如果我不想使用这个新的默认注册表，我可以向 CLI 传递一个参数，它就会仅针对此次调用使用备用注册表：\n\n```\n$ npm\
    \ i hapi --registry=https://registry.npmjs.org\n/Users/robert\n└── hapi@9.0.4\n\
    ```\n\n这意味着我们在 `npm` 中可以在默认配置和命令行参数之间进行选择，这种组合非常强大。\n"
- fmt: '## You Can Use It for So Many Things!


    Let’s take a look at the last principle: you can use a CLI for so many things.
    Whenever I have to do a task multiple times, and it fits into the domain of my
    command-line client, I’ll just add it as a new command. This habit turns into
    a win-win situation: you have to do fewer boring tasks, and your users are happy
    because they get a new feature and also have to do fewer monkey tasks. This makes
    your command-line client even more successful.


    Let’s take `npm` as an example. When `npm` was in its early days, it didn’t have
    a command for listing outdated packages. You had to run a full update for all
    packages and then check which packages were updated and which were not. The addition
    of the command scratched an itch for its author, but also for all users of `npm`.
    Sadly, it can be quite hard to spot common pain points, especially if you work
    with multiple teams or a lot of people. Additionally, most of us are suffering
    organizational blindness after working on the same topic for a long time. But
    if you identify a task that you can automate for you and your users, you will
    be hugely rewarded!


    ## Summary


    Most issues with command-line interfaces are not related to technical problems.
    Your users should always have an idea about the next steps, especially if things
    go wrong. Observing someone who uses your CLI for the first time can help you
    get new ideas for improvements. It''s important to have a solid base to be able
    to attract first users.


    As soon as a solid user experience exists, additions such as shortcuts make your
    CLI more interesting. Power users, especially, will love them.


    # 2. Writing a Database Administration Tool with Node.js


    In this chapter, we will write a database administration tool named `lounger`
    and follow the principles that make a good CLI. The code for every section is
    available at [https://github.com/theclibook/theclibook/tree/1.0/sourcecode](https://github.com/theclibook/theclibook/tree/1.0/sourcecode),
    which you can access via a link at the end of each section. The main repository
    is at [https://github.com/theclibook/theclibook](https://github.com/theclibook/theclibook).
    If you want to play with the code, don’t forget to run `npm install` in the folder
    for the section you want to test. The code also has a test suite that you can
    run with `npm test`.


    We’ll start with the setup of the development environment. We’ll install and start
    a small PouchDB instance. Then we’ll create our first command. To make the command-line
    tool extensible, we’ll also add a bootstrapping part. With a proper bootstrap,
    we’ll load every command and configuration that we add over time. We’ll finish
    the chapter with a first runnable version of the tool that we’ll be able to execute
    on the command line.


    ## Why Use Node.js?


    I sometimes get asked why I write command-line clients using Node.js. For me,
    the main reasons are as follows:


    * A huge ecosystem with modules in every flavor

    * Fast development speed

    * Writing JavaScript is fun!


    For me, these reasons make Node.js the perfect platform for writing command-line
    clients.


    ## Setting Up the Database Server


    Our first step is to get the database server squared away. This involves a setup
    process, PouchDB installation, and a bit of troubleshooting.


    ### Setting Up


    We will write our command-line client in ES6/7, which brings a lot of improvements
    to JavaScript. In order to use it, we have to install Node 8.x from [https://nodejs.org](https://nodejs.org).
    If you want to support older Node.js versions, I recommend the Babel transpiler
    to transpile the code to ES5-compatible code. You can get Babel at [https://babeljs.io/](https://babeljs.io/).


    The tool that we’ll write will be a small database administration tool for CouchDB/PouchDB.
    There are multiple ways to get a development database server up and running.


    One way is to install Erlang and CouchDB for your operating system. You can download
    official packages from [http://couchdb.apache.org](http://couchdb.apache.org),
    and many Linux distributions have CouchDB in their package repositories too.


    I think the easiest way is to either use the PouchDB server that is available
    in the source code for this book or to get a CouchDB instance at [https://cloudant.com](https://cloudant.com),
    which is free until you hit a limit.


    ### Using the PouchDB Database Server


    The PouchDB database server is located in `sourcecode/database`. In order to use
    it, we have to install the needed dependencies:


    ```

    $ cd sourcecode/database

    $ npm install

    ```


    To boot the database, we just run the following:


    ```

    $ npm run start

    ```


    We can now interact with the database server via HTTP, as CouchDB and PouchDB
    are databases with an HTTP API. If you don’t know how to get `curl`, take a look
    at the following "Troubleshooting" section.


    ```

    $ curl -XGET http://127.0.0.1:5984/

    {"express-pouchdb":"Welcome!","version":"1.0.1","vendor":{"name":"PouchDB authors","version":"1.0.1"},"uuid":"4fad2c01-ba32-4249-8278-8786e877c397"}

    ```


    Let’s create a database called `people`:


    ```

    $ curl -XPUT http://127.0.0.1:5984/people

    {"ok":true}

    ```


    We can now insert documents into our `people` database:


    ```

    $ curl -XPOST http://127.0.0.1:5984/people -d ''{"name": "Rocko Artischocko",
    \

    "likes": ["Burritos", "Node.js", "Music"] }'' -H ''Content-Type: application/json''

    {"ok":true,"id":"21b5ad83-0ad6-47c7-86f8d9636113160a","rev":"1-411894affa038a6fd7a164e1bfd84146"}

    ```


    Using the ID, we can retrieve documents from the database:


    ```

    $ curl -XGET http://127.0.0.1:5984/people/21b5ad83-0ad6-47c7-86f8-d9636113160a

    {"name":"Rocko Artischocko","likes":["Burritos","Node.js","Music"],"_id":"21b5ad83-0ad6-47c7-86f8-d9636113160a","_rev":"1-411894affa038a6fd7a164e1bfd84146"}

    ```


    Great! You should have a database up and running! If you have trouble, the next
    section will help you.


    ### Troubleshooting


    Sometimes the installation of a database server doesn’t go as we want it to. For
    Windows and Mac users, this section covers how to get a missing `curl` program.
    For Linux users, this section solves a typical error related to file watchers
    on Linux systems.


    #### Getting curl


    `curl` is a command-line client for HTTP requests. It is available for all major
    operating systems. macOS users can install it by using `brew`. For Windows, builds
    are available at [http://curl.haxx.se/download.html](http://curl.haxx.se/download.html).'
  raw: '## You Can Use It for So Many Things!


    Let’s take a look at the last principle: you can use a CLI for so many things.
    Whenever I have to do a task multiple times, and it fits into the domain of my
    command-line client, I’ll just add it as a new command. This habit turns into
    a win-win situation: you have to do fewer boring tasks, and your users are happy
    because they get a new feature and also have to do fewer monkey tasks. This makes
    your command-line client even more successful.


    Let’s take npm as an example. When npm was in its early days, it didn’t have a
    command for listing outdated packages. You had to run a full update for all packages
    and then check which packages were updated and which were not. The addition of
    the command scratched an itch for its author, but also for all users of npm. Sadly,
    it can be quite hard to spot common pain points, especially if you work with multiple
    teams or a lot of people. Additionally, most of us are suffering organizational
    blindness after working on the same topic for a long time. But if you identify
    a task that you can automate for you and your users, you will be hugely rewarded!


    ## Summary


    Most issues with command-line interfaces are not related to technical problems.
    Your users should always have an idea about the next steps, especially if things
    go wrong. Observing someone who uses your CLI for the first time can help you
    get new ideas for improvements. It''s important to have a solid base to be able
    to attract first users.


    As soon as a solid user experience exists, additions such as shortcuts make your
    CLI more interesting. Power users, especially, will love them.


    # 2. Writing a Database Administration Tool with Node.js


    In this chapter, we will write a database administration tool named lounger and
    follow the principles that make a good CLI. The code for every section is available
    at [https://​github.​com/​theclibook/​theclibook/​tree/​1.​0/​sourcecode](https://github.com/theclibook/theclibook/tree/1.0/sourcecode),
    which you can access via a link at the end of each section. The main repository
    is at [https://​github.​com/​theclibook/​theclibook](https://github.com/theclibook/theclibook). If
    you want to play with the code, don’t forget to run `npm install` in the folder
    for the section you want to test. The code also has a test suite that you can
    run with `npm test`.


    We’ll start with the setup of the development environment. We’ll install and start
    a small PouchDB instance. Then we’ll create our first command. To make the command-line
    tool extensible, we’ll also add a bootstrapping part. With a proper bootstrap,
    we’ll load every command and configuration that we add over time. We’ll finish
    the chapter with a first runnable version of the tool that we’ll be able to execute
    on the command line.


    ## Why Use Node.js ?


    I sometimes get asked why I write command-line clients using Node.js. For me,
    the main reasons are as follows:


    *   A huge ecosystem with modules in every flavor

    *   Fast development speed

    *   Writing JavaScript is fun!


    For me, these reasons make Node.js the perfect platform for writing command-line
    clients.


    ## Setting Up the Database Server


    Our first step is to get the database server squared away. This involves a setup
    process, PouchDB installation, and a bit of troubleshooting.


    ### Setting Up


    We will write our command-line client in ES6/7, which brings a lot of improvements
    to JavaScript. In order to use it, we have to install Node 8.x from [`https://nodejs.org`](https://nodejs.org)
    . If you want to support older Node.js versions, I recommend the Babel transpiler
    to transpile the code to ES5-compatible code. You can get Babel at [`https://babeljs.io/`](https://babeljs.io/)
    .


    The tool that we’ll write will be a small database administration tool for CouchDB/PouchDB.
    There are multiple ways to get a development database server up and running.


    One way is to install Erlang and CouchDB for your operating system. You can download
    official packages from [`http://couchdb.apache.org`](http://couchdb.apache.org)
    , and many Linux distributions have CouchDB in their package repositories too.


    I think the easiest way is to either use the PouchDB server that is available
    in the source code for this book or to get a CouchDB instance at [`https://cloudant.com`](https://cloudant.com)
    , which is free until you hit a limit.


    ### Using the PouchDB Database Server


    The PouchDB database server is located in `sourcecode/database`. In order to use
    it, we have to install the needed dependencies:


    ```

    $ cd sourcecode/database

    $ npm install

    ```


    To boot the database, we just run the following:


    ```

    $ npm run start

    ```


    We can now interact with the database server via HTTP, as CouchDB and PouchDB
    are databases with an HTTP API. If you don’t know how to get curl, take a look
    at the following “Troubleshooting” section.


    ```

    $ curl -XGET http://127.0.0.1:5984/

    {"express-pouchdb":"Welcome!","version":"1.0.1","vendor":{"name":"PouchDB authors","version":"1.0.1"},"uuid":"4fad2c01-ba32-4249-8278-8786e877c397"}

    ```


    Let’s create a database called `people`:


    ```

    $ curl -XPUT http://127.0.0.1:5984/people

    {"ok":true}

    ```


    We can now insert documents into our `people` database:


    ```

    $ curl -XPOST http://127.0.0.1:5984/people -d ''{"name": "Rocko Artischocko",
    \

    "likes": ["Burritos", "Node.js", "Music"] }'' -H ''Content-Type: application/json''

    {"ok":true,"id":"21b5ad83-0ad6-47c7-86f8d9636113160a","rev":"1-411894affa038a6fd7a164e1bfd84146"}

    ```


    Using the ID, we can retrieve documents from the database:


    ```

    $ curl -XGET http://127.0.0.1:5984/people/21b5ad83-0ad6-47c7-86f8-d9636113160a

    {"name":"Rocko Artischocko","likes":["Burritos","Node.js","Music"],"_id":"21b5ad83-0ad6-47c7-86f8-d9636113160a","_rev":"1-411894affa038a6fd7a164e1bfd84146"}

    ```


    Great! You should have a database up and running! If you have trouble, the next
    section will help you.


    ### Troubleshooting


    Sometimes the installation of a database server doesn’t go as we want it to. For
    Windows and Mac users, this section covers how to get a missing curl program.
    For Linux users, this section solves a typical error related to file watchers
    on Linux systems.


    #### Getting curl


    curl is a command-line client for HTTP requests. It is available for all major
    operating systems. macOS users can install it by using `brew` . For Windows, builds
    are available at [`http://curl.haxx.se/download.html`](http://curl.haxx.se/download.html)
    .'
  trans: '

    ## 你可以用它做这么多事情！


    让我们来看最后一条原则：**你**可以用 CLI 做很多事情。每当我需要多次执行某项任务，并且该任务属于命令行客户端的领域时，我就会把它添加为一个新命令。这种习惯会变成双赢的局面：你减少了无聊的任务，用户也很高兴，因为他们获得了新功能，同样也减少了重复劳动。这会让你的命令行客户端更加成功。


    让我们以`npm`为例。在`npm`早期，它没有列出过时包的命令。你必须对所有包进行完整更新，然后检查哪些包更新了，哪些没有。这个命令的添加解决了其作者的一个痛点，同时也解决了所有`npm`用户的痛点。遗憾的是，发现常见的痛点可能相当困难，尤其是当你有多个团队或与很多人合作时。此外，在长期研究同一个主题后，我们大多数人都容易产生组织性盲点。但如果你能识别出一项可以为你和用户自动化的任务，你将获得巨大的回报！


    ## 总结


    命令行界面的大多数问题都与技术问题无关。你的用户应该始终清楚下一步该怎么做，尤其是在出现问题的时候。观察首次使用你 CLI 的人，可以帮助你获得新的改进思路。拥有一个坚实的基础对于吸引第一批用户至关重要。


    一旦有了可靠的用户体验，快捷方式等新增功能会让你的 CLI 更有趣。尤其是高级用户，他们会非常喜欢这些功能。


    # 2. 使用 Node.js 编写数据库管理工具


    在本章中，我们将编写一个名为`lounger`的数据库管理工具，并遵循构建优秀 CLI 的原则。每个章节的代码都可以在 [`github.com/theclibook/theclibook/tree/1.0/sourcecode`](https://github.com/theclibook/theclibook/tree/1.0/sourcecode)
    获取，你可以通过每章末尾的链接访问。主仓库地址是 [`github.com/theclibook/theclibook`](https://github.com/theclibook/theclibook)。如果你想运行代码，别忘了在你想要测试的章节文件夹中运行`npm
    install`。代码还包含一个测试套件，你可以使用`npm test`运行。


    我们将从开发环境的设置开始。我们将安装并启动一个小的 PouchDB 实例。然后我们将创建第一个命令。为了使命令行工具可扩展，我们还将添加一个引导部分。通过正确的引导，我们将加载随时间添加的每个命令和配置。本章将以该工具的第一个可运行版本结束，届时我们可以在命令行上执行它。


    ## 为什么选择 Node.js？


    有时会有人问我为什么用 Node.js 编写命令行客户端。对我来说，主要原因如下：


    *   拥有各种类型模块的庞大生态系统

    *   快速的开发速度

    *   编写 JavaScript 很有趣！


    对我来说，这些原因使得 Node.js 成为编写命令行客户端的完美平台。


    ## 设置数据库服务器


    我们的第一步是搞定数据库服务器。这涉及到设置过程、PouchDB 安装以及一些故障排除。


    ### 环境设置


    我们将使用 ES6/7 编写命令行客户端，这为 JavaScript 带来了许多改进。为了使用它，我们需要从 [`nodejs.org`](https://nodejs.org)
    安装 Node 8.x。如果你想支持更老的 Node.js 版本，我建议使用 Babel 转译器将代码转译为 ES5 兼容的代码。你可以从 [`babeljs.io/`](https://babeljs.io/)
    获取 Babel。


    我们要编写的工具将是一个用于 CouchDB/PouchDB 的小型数据库管理工具。有多种方法可以启动并运行一个开发数据库服务器。


    一种方法是为你的操作系统安装 Erlang 和 CouchDB。你可以从 [`couchdb.apache.org`](http://couchdb.apache.org)
    下载官方包，并且许多 Linux 发行版的软件仓库中也包含了 CouchDB。


    我认为最简单的方法是使用本书源代码中提供的 PouchDB 服务器，或者在 [`cloudant.com`](https://cloudant.com) 获取一个
    CouchDB 实例，该服务在你达到限制之前是免费的。


    ### 使用 PouchDB 数据库服务器


    PouchDB 数据库服务器位于`sourcecode/database`目录下。要使用它，我们必须安装所需的依赖项：


    ```

    $ cd sourcecode/database

    $ npm install

    ```


    要启动数据库，只需运行以下命令：


    ```

    $ npm run start

    ```


    现在，我们可以通过 HTTP 与数据库服务器交互，因为 CouchDB 和 PouchDB 都是具有 HTTP API 的数据库。如果你不知道如何获取`curl`，请查看下面的“故障排除”部分。


    ```

    $ curl -XGET http://127.0.0.1:5984/

    {"express-pouchdb":"Welcome!","version":"1.0.1","vendor":{"name":"PouchDB authors","version":"1.0.1"},"uuid":"4fad2c01-ba32-4249-8278-8786e877c397"}

    ```


    让我们创建一个名为`people`的数据库：


    ```

    $ curl -XPUT http://127.0.0.1:5984/people

    {"ok":true}

    ```


    现在我们可以向`people`数据库插入文档了：


    ```

    $ curl -XPOST http://127.0.0.1:5984/people -d ''{"name": "Rocko Artischocko",
    \

    "likes": ["Burritos", "Node.js", "Music"] }'' -H ''Content-Type: application/json''

    {"ok":true,"id":"21b5ad83-0ad6-47c7-86f8d9636113160a","rev":"1-411894affa038a6fd7a164e1bfd84146"}

    ```


    使用这个 ID，我们可以从数据库中检索文档：


    ```

    $ curl -XGET http://127.0.0.1:5984/people/21b5ad83-0ad6-47c7-86f8-d9636113160a

    {"name":"Rocko Artischocko","likes":["Burritos","Node.js","Music"],"_id":"21b5ad83-0ad6-47c7-86f8-d9636113160a","_rev":"1-411894affa038a6fd7a164e1bfd84146"}

    ```


    太好了！你的数据库应该已经启动并运行了！如果遇到问题，下一节会帮助你。


    ### 故障排除


    有时数据库服务器的安装并不像我们期望的那样顺利。对于 Windows 和 Mac 用户，本节将介绍如何获取缺失的`curl`程序。对于 Linux 用户，本节将解决
    Linux 系统上与文件监视器相关的一个典型错误。


    #### 获取 curl


    `curl`是一个用于 HTTP 请求的命令行客户端。它适用于所有主流操作系统。macOS 用户可以使用`brew`安装它。对于 Windows，可以在 [`curl.haxx.se/download.html`](http://curl.haxx.se/download.html)
    获取构建版本。

    '
- fmt: '### Fixing a File-Watcher Error


    On Linux, I got an error because my user already watched too much files:


    ```

    $ npm run start

    > theclibook-database@1.0.0 start /home/rocko/clibook/sourcecode/database

    > pouchdb-server --in-memory

    fs.js:1236

    throw error;

    ^

    Error: watch ./log.txt ENOSPC

    at exports._errnoException (util.js:874:11)

    at FSWatcher.start (fs.js:1234:19)

    at Object.fs.watch (fs.js:1262:11)

    at Tail.watch (/home/rocko/clibook/sourcecode/database/node_modules/pouchdb-server/node_modules/tail/tail.js:83:32)

    at new Tail (/home/rocko/clibook/sourcecode/database/node_modules/pouchdb-server/node_modules/tail/tail.js:72:10)

    at /home/rocko/clibook/sourcecode/database/node_modules/pouchdb-server/lib/logging.js:69:20

    at FSReqWrap.cb [as oncomplete] (fs.js:212:19)

    npm ERR! Linux 3.13.0-71-generic

    npm ERR! argv "/home/rocko/.nvm/versions/node/v4.2.3/bin/node" "/home/rocko/.nvm/versions/node/v4.2.3/bin/npm"
    "run" "start"

    npm ERR! node v4.2.3

    npm ERR! npm  v3.5.1

    npm ERR! code ELIFECYCLE

    npm ERR! theclibook-database@1.0.0 start: `pouchdb-server --in-memory`

    npm ERR! Exit status 1

    npm ERR!

    npm ERR! Failed at the theclibook-database@1.0.0 start script ''pouchdb-server
    --in-memory''.

    npm ERR! Make sure you have the latest version of node.js and npm installed.

    npm ERR! If you do, this is most likely a problem with the theclibook-database
    package,

    npm ERR! not with npm itself.

    npm ERR! Tell the author that this fails on your system:

    npm ERR!     pouchdb-server --in-memory

    npm ERR! You can get information on how to open an issue for this project with:

    npm ERR!     npm bugs theclibook-database

    npm ERR! Or if that isn''t available, you can get their info via:

    npm ERR!     npm owner ls theclibook-database

    npm ERR! There is likely additional logging output above.

    npm ERR! Please include the following file with any support request:

    npm ERR!     /home/rocko/clibook/sourcecode/database/npm-debug.log

    ```


    I fixed the problem by raising the file limit via this command:


    ```

    $ echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo
    sysctl -p

    ```


    Hopefully, you have a working database server now. The next section focuses on
    the development of our command-line tool.


    ## Performing a Simple Status Check


    Our first command will check whether the database is up and running. Our users
    can use this command to see whether the database server is running, and we can
    use the command internally for the commands which require a running database.


    The command for checking whether a database server is online looks like this:


    ```

    $ lounger isonline http://192.168.0.1:5984

    http://192.168.0.1:5984 is up and running

    ```


    The API looks like this:


    ```

    $ lounger.commands.isonline(''http://example.com'')

    ```


    It’s often helpful to write down a planned command, in order to get a feeling
    for it. After you have settled on a name and signature for the command, you can
    start with its development. In this case, we have to start creating our tool from
    scratch.


    ### Starting from Scratch


    To get started, we have to create a `package.json` file. Luckily, `npm` provides
    a nice assistant for creating these files. You can see the finished process in
    Figure [2-1](#A456043_1_En_2_Chapter.html#Fig1).


    ![A456043_1_En_2_Fig1_HTML.jpg](A456043_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    The assistant from `npm init` to create a `package.json` file


    ```

    $ npm init

    ```


    We then just answer the questions `npm` asks us.


    Additionally, we have to create three folders: `test`, `lib`, and `bin`. The `test`
    folder will contain our unit and integration tests, and `lib` will contain the
    core of our command-line client. The `bin` folder will contain a small wrapper
    that will boot up the core of our client.


    `CouchDB` and `PouchDB` both return a welcome message when we access the root
    URL at `http://localhost:5984`.


    ```

    $ curl localhost:5984

    ```


    `CouchDB` returns the following:


    ```

    {"couchdb":"Welcome","uuid":"17ed4b2d8923975cf658e20e219faf95","version":"1.5.0","vendor":{"version":"14.04","name":"Ubuntu"}}

    ```


    `PouchDB` returns this:


    ```

    {"express-pouchdb":"Welcome!","version":"1.0.1","vendor":{"name":"PouchDB authors","version":"1.0.1"},"uuid":"4fad2c01-ba32-4249-8278-8786e877c397"}

    ```


    We will use this behavior to check whether the database is online.


    ### A Helping Ecosystem


    As already mentioned, Node.js has a great ecosystem. It has many battle-proven
    modules that can help us solve our tasks.


    For our status check, we will use the `request` module to handle our HTTP requests.
    `mocha` will run our test suite, and `nock` will help us mock HTTP responses without
    having to boot a database instance for the test suite.


    The arguments `--save` and `--save-dev` will add the packages to the `dependencies`
    and `devDependencies` sections of our `package.json` file, respectively. The development
    dependencies are needed just for development, not for running the package in production:


    ```

    $ npm i --save request

    $ npm i --save-dev mocha nock

    ```


    After running the commands, we should have everything we need for now.


    **Choose your own flavors**


    There are many good test runners for Node.js. Some alternatives to `mocha` are
    the npm modules `tap`, `tape`, or `lab`.


    My `package.json` file looks like this now:


    ```

    {

    "name": "lounger",

    "version": "1.0.0",

    "description": "a tool for couchdb/pouchdb administration",

    "main": "lib/lounger.js",

    "directories": {

    "test": "test"

    },

    "dependencies": {

    "request": "^2.67.0"

    },

    "devDependencies": {

    "mocha": "^2.3.4",

    "nock": "^5.2.1"

    },

    "scripts": {

    "test": "mocha -R spec"

    },

    "keywords": [

    "couchdb",

    "pouchdb"

    ],

    "author": "Robert Kowalski "

    }

    ```


    Various development techniques such as test-driven development (TDD) are beyond
    the scope of this book. But if you are really into TDD, you can write failing
    tests with `mocha` before we implement the actual code. A few suggestions:


    * Detect whether the database is online.

    * Detect offline databases.

    * Detect whether something is online, but not a `CouchDB`/`PouchDB` database.

    * Ensure that only valid URLs are accepted.


    Written in `mocha` and ES6, we get a few failing tests in `test/isonline.js`:


    ```

    ''use strict'';

    const assert = require(''assert'');

    const nock = require(''nock'');

    describe(''isonline'', () => {

    it(''detects if the database is online'', () => {

    assert.equal(''foo'', ''to implement'');

    });

    it(''detects offline databases'', () => {

    assert.equal(''foo'', ''to implement'');

    });

    it(''detects if something is online, but not a CouchDB/PouchDB'', () => {

    assert.equal(''foo'', ''to implement'');

    });

    it(''just accepts valid urls'', () => {

    assert.equal(''foo'', ''to implement'');

    });

    });

    ```


    To run the test suite , we have to type either `npm test` or `npm t` on the terminal.


    **Note**


    The code for this section can be found at `sourcecode/client-boilerplate`.'
