    \ to know where to put the data, so we will need to pass it the database URL.\
    \ As the methods of the stream are called for each chunk, we have to store the\
    \ passed URL as `this.url`:\n\n```javascript\nclass CouchBulkImporter extends\
    \ Writable {\n  constructor (options) {\n    if (!options) {\n      options =\
    \ {};\n    }\n    if (!options.url) {\n      const msg = [\n        'options.url\
    \ must be set',\n        'example:',\n        \"new CouchBulkImporter({url: 'http://localhost:5984/baseball'})\"\
    \n      ].join('\\n')\n      throw new Error(msg);\n    }\n    options.objectMode\
    \ = true;\n    super(options);\n    // sanitise url, remove trailing slash\n \
    \   this.url = options.url.replace(/\\/$/, '');\n  }\n}\n```\n\nTo implement a\
    \ child of a `Writable` stream, we have to implement the `_write` method. Like\
    \ the `_transform` method of the `Transform` stream, the `_write` method is called\
    \ for every chunk that is passed to the stream from the previous producer. In\
    \ our case, we send the JSON chunks as JSON to the database by using `request`.\
