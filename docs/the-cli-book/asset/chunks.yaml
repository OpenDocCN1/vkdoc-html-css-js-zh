- fmt: '# The Internals of the `isonline` Command


    Let’s create and edit the `lib/isonline.js` file. The file name is important,
    as we will use it later during the bootstrap of the client. As a first step, we
    have to require our dependency `request`:


    ```javascript

    ''use strict'';

    const request = require(''request'');

    ```


    To make a request, we create the `isOnline` function, which will take a URL and
    send the request:


    ```javascript

    function isOnline (url) {

    return new Promise((resolve, reject) => {

    request({

    uri: url,

    json: true

    }, (err, res, body) => {

    ```


    If there is no HTTP service at all listening on the specified URL, we resolve
    the promise with an object that contains the URL as a key, and `false` as a value:


    ```javascript

    if (err && (err.code === ''ECONNREFUSED'' || err.code === ''ENOTFOUND'')) {

    return resolve({[url]: false});

    }

    ```


    For all other errors, we reject the promise:


    ```javascript

    // any other error

    if (err) {

    return reject(err);

    }

    ```


    If we get a `Welcome` response from CouchDB or PouchDB, we can safely assume that
    the database server is online:


    ```javascript

    // maybe we got a welcome from CouchDB / PouchDB

    const isDatabase = (body.couchdb === ''Welcome'' ||

    body[''express-pouchdb''] === ''Welcome!'');

    return resolve({[url]: isDatabase});

    ```


    As a last step, we have to export the function:


    ```javascript

    exports.api = isOnline;

    ```


    Here is the whole function:


    ```javascript

    function isOnline (url) {

    return new Promise((resolve, reject) => {

    request({

    uri: url,

    json: true

    }, (err, res, body) => {

    // db is down

    if (err && (err.code === ''ECONNREFUSED'' || err.code === ''ENOTFOUND'')) {

    return resolve({[url]: false});

    }

    // any other error

    if (err) {

    return reject(err);

    }

    // maybe we got a welcome from CouchDB / PouchDB

    const isDatabase = (body.couchdb === ''Welcome'' ||

    body[''express-pouchdb''] === ''Welcome!'');

    return resolve({[url]: isDatabase});

    });

    });

    }

    exports.api = isOnline;

    ```


    We can try our function on the Node.js REPL:


    ```

    $ node

    > const isonline = require(''./lib/isonline.js'').api;

    undefined

    > isonline(''http://example.com'').then(console.log);

    Promise {  }

    > { ''http://example.com'': false }

    > isonline(''http://doesnotexist.example.com'').then(console.log);

    Promise {  }

    > { ''http://doesnotexist.example.com'': false }

    > isonline(''http://localhost:5984'').then(console.log);

    Promise {  }

    > { ''http://localhost:5984'': true }

    ```


    Congratulations! We just finished the first part, the API for our new command!


    ## The CLI Part


    It would be frustrating for end users if that was the command-line interface they
    had to use. The output is not easily readable, and the functionality is not easy
    to understand. The API function doesn’t print to the console, which is perfect
    for an API, but not desirable for a CLI. Running the API function even requires
    some Node.js knowledge. So let’s add a nice CLI function to our `isonline.js`
    file and export it as `cli`:


    ```javascript

    function cli (url) {

    return new Promise((resolve, reject) => {

    });

    }

    exports.cli = cli;

    ```


    Like our other functions, this function returns a promise. We then call `isOnline`
    and print the result on `stdout` for the users who use the command-line client
    on the terminal:


    ```javascript

    isOnline(url).then((res) => {

    Object.keys(results).forEach((entry) => {

    let msg = ''seems to be offline'';

    if (results[entry]) {

    msg = ''seems to be online'';

    }

    // print on stdout for terminal users

    console.log(entry, msg);

    resolve(results);

    });

    });

    ```


    The full code:


    ```javascript

    function cli (url) {

    return new Promise((resolve, reject) => {

    isOnline(url).then((res) => {

    Object.keys(results).forEach((entry) => {

    let msg = ''seems to be offline'';

    if (results[entry]) {

    msg = ''seems to be online'';

    }

    // print on stdout for terminal users

    console.log(entry, msg);

    resolve(results);

    });

    });

    });

    }

    exports.cli = cli;

    ```


    It is important to note that we export the command for the API as `exports.api`,
    while we export the CLI command under the `cli` property.


    **Note:** The code for this section can be found at `sourcecode/the-status-check`.


    # Booting the Tool


    Lounger still needs the code that makes it usable on the command line. It also
    lacks a comfortable way to run our API commands. Right now, we have just one command,
    but we’ll add more soon. To make all commands easy to use, we have to load all
    available commands into a namespace. The `lib/lounger.js` file will take care
    of that.


    The `lounger.js` file is the heart of our command-line client. We require the
    `fs` module, as we have to list the files that could contain commands:


    ```javascript

    ''use strict'';

    const fs = require(''fs'');

    ```


    We also require `package.json` and expose the current version of the module as
    a property on the lounger object, which will come in handy later:


    ```javascript

    const pkg = require(''../package.json'');

    ```'
