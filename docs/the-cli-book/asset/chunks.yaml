    ## Performing a Simple Status Check


    Our first command will check whether the database is up and running. Our users
    can use this command to see whether the database server is running, and we can
    use the command internally for the commands which require a running database.


    The command for checking whether a database server is online looks like this:


    ```

    $ lounger isonline http://192.168.0.1:5984

    http://192.168.0.1:5984 is up and running

    ```


    The API looks like this:


    ```

    $ lounger.commands.isonline(''http://example.com'')

    ```


    It’s often helpful to write down a planned command, in order to get a feeling
    for it. After you have settled on a name and signature for the command, you can
    start with its development. In this case, we have to start creating our tool from
    scratch.


    ### Starting from Scratch


    To get started, we have to create a `package.json` file. Luckily, npm provides
    a nice assistant for creating these files. You can see the finished process in
    Figure [2-1](#A456043_1_En_2_Chapter.html#Fig1).


    ![A456043_1_En_2_Fig1_HTML.jpg](A456043_1_En_2_Fig1_HTML.jpg)


    Figure 2-1


    The assistant from npm init to create a package.json file


    ```

    $ npm init

    ```


    We then just answer the questions npm asks us.


    Additionally, we have to create three folders: `test`, `lib`, and `bin`. The `test`
    folder will contain our unit and integration tests, and `lib` will contain the
    core of our command-line client. The `bin` folder will contain a small wrapper
    that will boot up the core of our client.


    CouchDB and PouchDB both return a welcome message when we access the root URL
    at `http://localhost:5984`.


    ```

    $ curl localhost:5984

    ```


    CouchDB returns the following:


    ```

    {"couchdb":"Welcome","uuid":"17ed4b2d8923975cf658e20e219faf95","version":"1.5.0","vendor":{"version":"14.04","name":"Ubuntu"}}

    ```


    PouchDB returns this:


    ```

    {"express-pouchdb":"Welcome!","version":"1.0.1","vendor":{"name":"PouchDB authors","version":"1.0.1"},"uuid":"4fad2c01-ba32-4249-8278-8786e877c397"}

    ```


    We will use this behavior to check whether the database is online.


    ### A Helping Ecosystem


    As already mentioned, Node.js has a great ecosystem. It has many battle-proven
    modules that can help us solve our tasks.


    For our status check, we will use the `request` module to handle our HTTP requests.
    `mocha` will run our test suite, and `nock` will help us mock HTTP responses without
    having to boot a database instance for the test suite.


    The arguments `--save` and `--save-dev` will add the packages to the `dependencies`
    and `devDependencies` sections of our `package.json file, respectively`. The development
    dependencies are needed just for development, not for running the package in production:


    ```

    $ npm i --save request

    $ npm i --save-dev mocha nock

    ```


    After running the commands, we should have everything we need for now.


    Choose your own flavors


    There are many good test runners for Node.js. Some alternatives to `mocha` are
    the npm modules `tap`, `tape,` or `lab`.


    My `package.json` file looks like this now:


    ```

    {

    "name": "lounger",

    "version": "1.0.0",

    "description": "a tool for couchdb/pouchdb administration",

    "main": "lib/lounger.js",

    "directories": {

    "test": "test"

    },

    "dependencies": {

    "request": "^2.67.0"

    },

    "devDependencies": {

    "mocha": "^2.3.4",

    "nock": "^5.2.1"

    },

    "scripts": {

    "test": "mocha -R spec"

    },

    "keywords": [

    "couchdb",

    "pouchdb"

    ],

    "author": "Robert Kowalski "

    }

    ```


    Various development techniques such as test-driven development (TDD) are beyond
    the scope of this book. But if you are really into TDD, you can write failing
    tests with `mocha` before we implement the actual code. A few suggestions:


    *   Detect whether the database is online.

    *   Detect offline databases.

    *   Detect whether something is online, but not a CouchDB/PouchDB database.

    *   Ensure that only valid URLs are accepted.


    Written in `mocha` and ES6, we get a few failing tests in `test/isonline.js`:


    ```

    ''use strict'';

    const assert = require(''assert'');

    const nock = require(''nock'');

    describe(''isonline'', () => {

    it(''detects if the database is online'', () => {

    assert.equal(''foo'', ''to implement'');

    });

    it(''detects offline databases'', () => {

    assert.equal(''foo'', ''to implement'');

    });

    it(''detects if something is online, but not a CouchDB/PouchDB'', () => {

    assert.equal(''foo'', ''to implement'');

    });

    it(''just accepts valid urls'', () => {

    assert.equal(''foo'', ''to implement'');

    });

    });

    ```


    To run the test suite , we have to type either `npm test` or `npm t` on the terminal.


    Note


    The code for this section can be found at `sourcecode/client-boilerplate`.'
