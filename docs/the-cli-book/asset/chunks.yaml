    Object.keys(results).forEach((entry) => {

    let msg = ''seems to be offline'';

    if (results[entry]) {

    msg = ''seems to be online'';

    }

    // 为终端用户打印到 stdout

    console.log(entry, msg);

    resolve(results);

    });

    });

    ```


    完整代码：


    ```javascript

