    ### Designing the Command


    Let’s think a bit about the command we are going to build. A CSV can have different
    delimiters; some use semicolons as a delimiter, whereas others use commas or tabs.
    The symbols to denote a comment can also change. In our previous implementations,
    we used fixed values:


    ```

    const opts = {comment: ''#'', delimiter: '';'', columns: true};

    ```


    For a real-world use case, the symbols for the delimiter and comment must be configurable.
    The CSV input is usually a file.


    Here is a possible CLI:


    ```

    $ lounger csv transfer   [--delimiter=;] [--comment=#] [--chunksize=200]

    ```


    The `csv` command is open to extension and can host all CSV-related commands in
    the future. The command reads quite nicely and is easy to remember: `lounger csv
    transfer <file> <database>` reads almost as `lounger [do] csv transfer [from]
    <file> [to] <database>`. Sane defaults help us avoid passing optional modifiers
    at all, but in case we need to modify them, we can change every important aspect
    of our import.


    I’m not sure whether you noticed it, but when we played with our streams, we would
    have had to create the target database by using curl in advance. It would be handy
    if our CLI users didn’t have to create the target database on their own. Our goal
    is to help them solve their tasks as quickly and easily as possible, so we should
    automatically create databases as necessary. As a next step, we will add a helper
    to create the database .'
