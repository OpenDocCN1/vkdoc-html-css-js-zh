    ''comment'': [String],

    ''chunksize'': [Number]

    }, {''j'': ''--json''}, process.argv, 2);

    ```


    That’s it! We created a command that is able to stream large amounts of data into
    our database.


    If you are interested in a stream pipeline that would stream data from MongoDB
    to CouchDB, you can take a look at [`https://github.com/robertkowalski/couchbulkimporter/blob/master/examples/mongo.js`](https://github.com/robertkowalski/couchbulkimporter/blob/master/examples/mongo.js)
    .


    Note


    The code for this section is at `sourcecode/streams`. Enjoy!


    ## Summary


    With streams, we have a way to work with large amounts of data that don’t fit
    into memory. Based on streams, we built a data importer that can handle very large
    amounts of data. As a last step, we integrated everything into the command-line
    client. Hopefully, you enjoyed our adventure into streams!


    ## Appendix A: Tips and Tricks


    This short appendix provides some tips and tricks regarding Node.js development
    in general.


    ### Testing


    With proper unit and integration tests in place, ensure that new features or bug
    fixes don’t introduce regressions. A lot of great services provide a hosted continuous
    integration (CI) environment. They can test every pull request before it is merged,
    which makes reviewing code a lot easier. A popular service for hosted CI is Travis
    CI. Travis CI is free for open source projects.


    ### Semantic Versioning with SemVer


    I recommend following semantic versioning with SemVer ( [`http://semver.org/`](http://semver.org/)
    ). SemVer divides the version number of a release into three areas: MAJOR.MINOR.PATCH.
    The version 3.5.8 would have 3 as the MAJOR version level, 5 as the MINOR version
    level, and 8 as the PATCH level. If a new release includes a breaking change,
    the MAJOR version number is bumped. A new feature would need just a minor version
    bump, and bug fixes would require a bump of only the PATCH section.


    Here’s an example: My package has version 3.5.7\. I add a new feature that does
    not break backward compatibility. My next release would be 3.6.0.


    This way, your users have an idea of whether a release might break their production
    code (MAJOR), contains a new feature (MINOR), or include a bug fix (PATCH). A
    great tool to help you make the right decision for the next version bump is semantic-release
    ( [`www.npmjs.com/package/semantic-release`](https://www.npmjs.com/package/semantic-release)
    ).'
  trans: '

    ### 创建目标数据库


    为了让用户使用起来更便捷，我们将添加一个创建目标数据库的函数。这样一来，可以确保命令工作流不会遇到重大障碍。`createTargetDatabase` 函数是一个辅助函数，它将
    `request` 封装成 Promise。如果数据库已创建（HTTP 状态码 201 或 200），或者数据库已存在（HTTP 状态码 412），则 Promise
    将会被 resolve；其他所有状态都会导致 Promise 被 reject：


    ```

    function createTargetDatabase (url) {

    return new Promise((resolve, reject) => {

    request({

    json: true,

    uri: url,

    method: ''PUT'',

    body: {}

    }, function (er, res, body) {

    if (er && (er.code === ''ECONNREFUSED'' || er.code === ''ENOTFOUND'')) {

    const err = new Error(

    ''无法连接到 '' + url + ''。请检查数据库是否在运行''

    );

    err.type = ''EUSAGE'';

    return reject(err);

    }

    if (er) {

    return reject(er);

    }

    const code = res.statusCode;

    if (code !== 200 && code !== 201 && code !== 412) {

    const msg = ''CouchDB 服务器响应：\n 状态：'' +

    res.statusCode + ''\n 正文：'' + JSON.stringify(body);

    return reject(new Error(msg));

    }

    resolve();

    });

    });

    }

    ```


    如果出现 `ECONNREFUSED` 或 `ENOTFOUND` 错误，我们可以合理地推断数据库当前处于离线状态，并请用户检查数据库是否可用。我再怎么强调**正确处理错误**的重要性也不为过。来看这个例子，我们收到了
    `ECONNREFUSED` 错误：


    ```

    $ ./bin/lounger-cli csv transfer test/fixtures/test.csv http://127.0.0.1:1337/testimport

    ERR! connect ECONNREFUSED 127.0.0.1:5984

    ERR! Error: connect ECONNREFUSED 127.0.0.1:5984

    ERR!     at Object.exports._errnoException (util.js:870:11)

    ERR!     at exports._exceptionWithHostPort (util.js:893:20)

    ERR!     at TCPConnectWrap.afterConnect [as oncomplete] (net.js:1063:14)

    ERR!

    ERR!

    ERR! lounger: 1.0.0 node: v9.1.0

    ERR! 请在 http://example.com/lounger/issues 上提交包含此日志的 issue

    ```


    根据用户之前使用 Node.js 的经验，他们可能会非常困惑。他们唯一能继续下去的方法就是去问搜索引擎或者提交一个 issue。收到 issue 后，我们乏味的工作就是关闭它，并告诉他们可能是
    URL 拼写错误了。


    在编写 `createTargetDatabase` 函数之后，我们应该已经准备好了所有辅助函数。像往常一样，我们通过实现 API 命令来开始实现主要的 CLI
    函数，然后我们将用 CLI 函数来包装它。


    分隔符和注释选项在配置文件中定义，或者通过命令行传递。要知道它们的值，我们需要与 `lounger.config` 交互。要访问 `lounger.config`，我们需要引入它：


    ```

    const lounger = require(''./lounger.js'');

    ```


    主要的 API 函数会检查是否提供了所有必要的参数，如果配置文件中或命令行没有传入配置，则应用默认值。如果数据库尚不存在，我们会创建它，并将任务委托给 `importFromCsvFile`
    辅助函数：


    ```

    exports.api = {

    transfer: bulkdocsImport

    };

    function bulkdocsImport (file, targetDb) {

    return new Promise((resolve, reject) => {

    const opts = {};

    if (!file && !targetDb) {

    return reject(new Error(''缺少 file 和/或 targetDb 参数''));

    }

    opts.delimiter = lounger.config.get(''delimiter'') || '';'';

    opts.comment = lounger.config.get(''comment'') || ''#'';

    opts.chunksize = lounger.config.get(''chunksize'') || 200;

    createTargetDatabase(targetDb)

    .then(() => {

    return importFromCsvFile(file, targetDb, opts);

    }).catch(reject);

    });

    }

    ```


    `importFromCsvFile` 函数接收源 CSV 文件、URL 和选项，并创建流管道。与我们之前在 `streams-example.js` 中的代码相比，主要区别在于我们添加了适当的错误处理来捕获所有错误：


    ```

    function importFromCsvFile (file, url, opts) {

    return new Promise((resolve, reject) => {

    const options = {comment: opts.comment, delimiter: opts.delimiter, columns: true};

    const parser = parse(options);

    const input = fs.createReadStream(file);

    input

    .pipe(parser)

    .on(''error'', reject)

    .pipe(new TransformToBulkDocs({bufferedDocCount: opts.chunksize}))

    .on(''error'', reject)

    .pipe(new CouchBulkImporter({url: url}))

    .on(''error'', reject);

    });

    }

    ```


    CLI 函数最终包装了我们的 API 方法，并增加了友好的错误信息：


    ```

    exports.cli = importCli;

    function importCli (cmd, file, target) {

    return new Promise((resolve, reject) => {

    if (!cmd || cmd !== ''transfer'' || !file || !target) {

    const err = new Error(

    ''使用方法：lounger csv transfer   [--delimiter=;] [--comment=#] [--chunksize=200]''

    );

    err.type = ''EUSAGE'';

    return reject(err);

    }

    return bulkdocsImport(file, target).catch(reject);

    });

    }

    ```


    我们引入了三个新选项：`delimiter`、`comment` 和 `chunksize`。`lounger.config` 允许我们的用户通过使用配置文件来设置默认值。此外，我们还需要确保这些选项能在命令行上被解析。在
    `bin/lounger-cli` 中，我们需要向 `nopt` 注册我们的可选参数：


    ```

    const parsed = nopt({

    ''json'': [Boolean],

    ''delimiter'': [String],

    ''comment'': [String],

    ''chunksize'': [Number]

    }, {''j'': ''--json''}, process.argv, 2);

    ```


    搞定了！我们创建了一个能够将大量数据流式传输到数据库的命令。


    如果你对一个能将数据从 MongoDB 流式传输到 CouchDB 的流管道感兴趣，可以查看 [`https://github.com/robertkowalski/couchbulkimporter/blob/master/examples/mongo.js`](https://github.com/robertkowalski/couchbulkimporter/blob/master/examples/mongo.js)。


    注意


    本节代码位于 `sourcecode/streams`。欢迎使用！


    ## 总结


    通过流，我们找到了一种处理无法加载到内存中的大量数据的方法。基于流的概念，我们构建了一个能够处理海量数据的导入器。作为最后一步，我们将所有内容集成到了命令行客户端。希望你喜欢这段关于流的探险之旅！


    ## 附录 A：技巧与建议


    这个简短的附录提供了一些关于 Node.js 开发的一般性技巧与建议。


    ### 测试


    通过完善的单元测试和集成测试，可以确保新功能或错误修复不会引入回归问题。许多优秀的服务提供商都提供托管的持续集成（CI）环境。它们可以在每个拉取请求合并之前进行测试，这大大简化了代码审查工作。一个流行的托管
    CI 服务是 Travis CI。Travis CI 对开源项目是免费的。


    ### 使用 SemVer 进行语义化版本控制


    我建议遵循 SemVer（[`http://semver.org/`](http://semver.org/)）的语义化版本控制规范。SemVer 将版本的版本号分为三个部分：MAJOR.MINOR.PATCH。版本
    3.5.8 中，3 是主版本号，5 是次版本号，8 是补丁号。如果新版本包含不兼容的 API 修改，则主版本号递增。新增功能只需递增次版本号，而错误修复则只需递增补丁号。


    举个例子：我的包版本是 3.5.7。我添加了一个不影响向后兼容性的新功能。我的下一个版本就会是 3.6.0。


    通过这种方式，你的用户就能大致了解某个版本是否会破坏他们的生产代码（主版本）、是否包含新功能（次版本），或者是否包含错误修复（补丁）。semantic-release（[`www.npmjs.com/package/semantic-release`](https://www.npmjs.com/package/semantic-release)）是一个能帮助你为下一个版本号递增做出正确决定的优秀工具。

    '
