- fmt: "### Extending the Build Script\n\nIn order to build the web site, we have\
    \ to add code to `build.js`. We start by adding another cleanup function for our\
    \ web-site files, so we can start with a blank slate every time:\n\n```\nfunction\
    \ cleanUpWebsite () {\n  rimraf.sync(__dirname + '/website/');\n  mkdirp.sync(__dirname\
    \ + '/website/');\n}\n```\n\nOur web site has different targets than the man pages.\
    \ We add a new function, `getTargetForWebsite`. Currently, our Markdown files\
    \ are prefixed with `lounger-`, which comes in handy for the man pages, but is\
    \ not very useful for our web site. Instead, we want to prefix files with their\
    \ type; an API document, for example, would have the prefix `api-`. This way,\
    \ we can put pages for the API next to the ones for the CLI, which makes linking\
    \ easier. The first lines of the `getTargetForWebsite` function will take care\
    \ of that task and replace the `lounger-` prefix with a type-specific prefix.\
    \ After we replace the prefix, we set the file ending from `.md` to `.html`. The\
    \ final target folder for our compiled results will be `./website`, so we have\
    \ to take care that the directories are set up right. The difference with `getTargetForManpages`\
    \ is that we use the `website` folder instead of `man` and that we also take care\
    \ of the path for the `doc/website/index.md` file:\n\n```\nfunction getTargetForWebsite\
    \ (currentFile, type) {\n  let target = currentFile;\n  // modify the filename\
    \ a bit for our html file:\n  // prefix all cli functions with cli- instead of\
    \ lounger-\n  // prefix all api functions with api- instead of lounger-\n  if\
    \ (type === 'cli') {\n    target = currentFile.replace(/lounger-/, 'cli-');\n\
    \  }\n  if (type === 'api') {\n    target = currentFile.replace(/lounger-/, 'api-');\n\
    \  }\n  // set the file ending to html\n  target = target.replace(/\\.md$/, '.html');\n\
    \  // replace the source dir with the target dir\n  target = target\n    .replace(['doc',\
    \ 'cli'].join(path.sep), 'website')\n    .replace(['doc', 'api'].join(path.sep),\
    \ 'website')\n    .replace(['doc', 'website'].join(path.sep), 'website');\n  return\
    \ target;\n}\n```\n\nThe last item that is missing for our web site is something\
    \ like a table of contents. `getTocForWebsite` will create a listing of our API\
    \ and CLI functions. Later we will insert the table of contents into the `TOC`\
    \ placeholder of the template.\n\nThe TOC itself gets a nested list of the files\
    \ we compile. In the future, it might make sense to replace the whole system with\
    \ a template engine such as `Handlebars`, `Jade`, or `Nunjucks`. I could definitely\
    \ write a second book about static web-site generation, plus the numerous possible\
    \ toolchains, but I’m trying to keep it simple for now and just use plain ES6\
    \ templates.\n\nAfter starting an unordered list with `<ul>`, we iterate over\
    \ the types of our sources again. The files of our `websiteIndex` type are unwanted,\
    \ and we return early in their case. For all others, we take the type of each\
    \ section and use it as the first list element. It shows the type of each section\
    \ (API or CLI) and acts as a heading.\n\nAfter we get a heading, we iterate over\
    \ each file from the current section. As the link text differs a bit from the\
    \ actual hyperlink, we create a constant called `file` and an additional `linktext`\
    \ constant. For both, we must get rid of the `lounger-` prefix. To create the\
    \ reference that is used as `href`, we must change the `.md` to an `.html` ending.\
    \ The link text should not have a file ending at all, so we remove its `.md` ending:\n\
    \n```\nfunction getTocForWebsite () {\n  let toc = '';\n  Object.keys(sources).forEach(type\
    \ => {\n    // we don't want the index in our toc for now\n    if (type === 'websiteIndex')\
    \ {\n      return;\n    }\n    toc += `<li>${type}`;\n    sources[type].forEach(currentFile\
    \ => {\n      const prefix = type === 'cli' ? 'cli-' : 'api-';\n      const file\
    \ = path.basename(currentFile)\n        .replace('lounger-', prefix)\n       \
    \ .replace(/\\.md/, '.html');\n      const linktext = path.basename(currentFile)\n\
    \        .replace('lounger-', '')\n        .replace(/\\.md/, '');\n      toc +=\
    \ `<ul><li><a href=\"${file}\">${linktext}</a></li></ul>`;\n    });\n    toc +=\
    \ '</li>';\n  });\n  toc += '</ul>';\n  return toc;\n}\n```\n\nWe can now take\
    \ the small functions we created and create the main build function, `buildWebsite`,\
    \ from them. The `templateFile` constant describes where we can find our template\
    \ file, `template.html`, which we created at the beginning:\n\n```\nconst templateFile\
    \ = __dirname + '/doc/website/template.html';\n```\n\nThe next step is to replace\
    \ the placeholders in the templates with the generated table of contents and the\
    \ different content for each API or CLI method.\n\nIn `buildWebsite`, we call\
    \ `cleanUpWebsite` to remove any outdated files as a first step. We read the template\
    \ with `fs.readFileSync` and get the table of contents. We then iterate over our\
    \ sources. This time, we don’t spawn a child process with `marked-man`; we just\
    \ use `marked`, which outputs HTML. After we get the target for the current file\
    \ of the web site, we replace the `CONTENT` placeholder with it. `TOC` gets replaced\
    \ with the table of contents, which is saved in `toc` at the top of the main function.\
    \ Moving the read operation of the template and the creation of the TOC out of\
    \ the loops improves the performance of our build, as we don’t have to call them\
    \ for every new file. The rendered content finally gets written to the disk by\
    \ using `fs.writeFileSync` again. The last line in the code snippet finally calls\
    \ `buildWebsite` in order to build our web site when we run `build.js`:\n\n```\n\
    function buildWebsite () {\n  cleanUpWebsite();\n  const template = fs.readFileSync(templateFile,\
    \ 'utf8');\n  const toc = getTocForWebsite();\n  Object.keys(sources).forEach(type\
    \ => {\n    sources[type].forEach(currentFile => {\n      // convert markdown\
    \ to website content\n      const out = spawnSync('node', [\n        './node_modules/marked/bin/marked',\n\
    \        currentFile\n      ]);\n      const target = getTargetForWebsite(currentFile,\
    \ type);\n      const rendered = template\n        .replace('__CONTENT__', out.stdout)\n\
    \        .replace('__TOC__', toc);\n      // write output to target file\n   \
    \   fs.writeFileSync(target, rendered, 'utf8');\n    });\n  });\n}\nbuildWebsite();\n\
    ```\n\nWe can now run our build again and take a look at our web site, shown in\
    \ Figure [3-3](#A456043_1_En_3_Chapter.html#Fig3), which appears in the `website`\
    \ folder:\n\n![A456043_1_En_3_Fig3_HTML.jpg](A456043_1_En_3_Fig3_HTML.jpg)\n\n\
    **Figure 3-3** The minimal website for lounger generated from our Markdown\n\n\
    ```\n$ npm run docs\n```\n\nThe site is still missing some content as well as\
    \ a nice stylesheet. As I already mentioned, building web sites is a topic for\
    \ a whole new book, and I want to leave it like this for now. Feel free to add\
    \ more content and styles to the web site. Nevertheless, we just created something\
    \ that we can deploy to GitHub pages or any other hoster. The best thing about\
    \ it is that we can ship it with our command-line client as additional documentation\
    \ for everyone who can’t use or doesn’t like man pages. We will use both types\
    \ of documentation in our next section when we create a help system.\n\n> **Note**\
    \  \n> The code for this section can be found at `sourcecode/documentation`.\n\
    \n## More Help\n\nWe have some documentation, but lounger still has some rough\
    \ edges. If users try to access a command that does not exist, they won’t get\
    \ any advice on how to continue:\n\n```\n$ lounger foobar\n```\n\nA user who calls\
    \ lounger with no arguments at all also doesn’t get support:\n\n```\n$ lounger\n\
    ```\n\nWhat’s missing is a help page that explains how our users can get their\
    \ tasks done. It would be awesome if they could open our documentation (web pages\
    \ or man pages) right from the terminal. Our users shouldn’t have to care about\
    \ man pages or have to find out where we host our web site. The desired behavior\
    \ of lounger is as follows:\n\n1. The CLI prints a general help message if it\
    \ was called without a command or if a passed command doesn’t exist. This message\
    \ gives the user a hint on how to proceed further to get the task done.\n2. It\
    \ is easy to get additional help for a command.\n\nThis way, we offer help where\
    \ the user needs it. No need to switch over to Google and search for help. In\
    \ next two sections, we add the required functionality to lounger."
  raw: '#### Extending the Build Script


    In order to build the web site, we have to add code to `build.js`. We start by
    adding another cleanup function for our web-site files, so we can start with a
    blank slate every time:


    ```

    function cleanUpWebsite () {

    rimraf.sync(__dirname + ''/website/'');

    mkdirp.sync(__dirname + ''/website/'');

    }

    ```


    Our web site has different targets than the man pages. We add a new function,
    `getTargetForWebsite`. Currently, our Markdown files are prefixed with `lounger-`,
    which comes in handy for the man pages, but is not very useful for our web site.
    Instead, we want to prefix files with their type; an API document, for example,
    would have the prefix `api-`. This way, we can put pages for the API next to the
    ones for the CLI, which makes linking easier. The first lines of the `getTargetForWebsite
    function` will take care of that task and replace the `lounger-` prefix with a
    type-specific prefix. After we replace the prefix, we set the file ending from
    `.md` to `.html`. The final target folder for our compiled results will be `./website`,
    so we have to take care that the directories are set up right. The difference
    with `getTargetForManpages` is that we use the `website` folder instead of `man`
    and that we also take care of the path for the `doc/website/index.md` file:


    ```

    function getTargetForWebsite (currentFile, type) {

    let target = currentFile;

    // modify the filename a bit for our html file:

    // prefix all cli functions with cli- instead of lounger-

    // prefix all api functions with api- instead of lounger-

    if (type === ''cli'') {

    target = currentFile.replace(/lounger-/, ''cli-'');

    }

    if (type === ''api'') {

    target = currentFile.replace(/lounger-/, ''api-'');

    }

    // set the file ending to html

    target = target.replace(/\.md$/, ''.html'');

    // replace the source dir with the target dir

    target = target

    .replace([''doc'', ''cli''].join(path.sep), ''website'')

    .replace([''doc'', ''api''].join(path.sep), ''website'')

    .replace([''doc'', ''website''].join(path.sep), ''website'');

    return target;

    }

    ```


    The last item that is missing for our web site is something like a table of contents.
    `getTocForWebsite` will create a listing of our API and CLI functions. Later we
    will insert the table of contents into the `TOC` placeholder of the template.


    The TOC itself gets a nested list of the files we compile. In the future, it might
    make sense to replace the whole system with a template engine such as `Handlebars`,
    `Jade`, or `Nunjucks`. I could definitely write a second book about static web-site
    generation, plus the numerous possible toolchains, but I’m trying to keep it simple
    for now and just use plain ES6 templates.


    After starting an unordered list with `<ul>,` we iterate over the types of our
    sources again. The files of our `websiteIndex` type are unwanted, and we return
    early in their case. For all others, we take the type of each section and use
    it as the first list element. It shows the type of each section (API or CLI) and
    acts as a heading.


    After we get a heading , we iterate over each file from the current section. As
    the link text differs a bit from the actual hyperlink, we create a constant called
    `file` and an additional `linktext` constant. For both, we must get rid of the
    `lounger-` prefix. To create the reference that is used as `href,` we must change
    the `.md` to an `.html` ending. The link text should not have a file ending at
    all, so we remove its `.md` ending:


    ```

    function getTocForWebsite () {

    let toc = '''';

    Object.keys(sources).forEach(type => {

    // we don''t want the index in our toc for now

    if (type === ''websiteIndex'') {

    return;

    }

    toc += `${type}`;

    sources[type].forEach(currentFile => {

    const prefix = type === ''cli'' ? ''cli-'' : ''api-'';

    const file = path.basename(currentFile)

    .replace(''lounger-'', prefix)

    .replace(/\.md/, ''.html'');

    const linktext = path.basename(currentFile)

    .replace(''lounger-'', '''')

    .replace(/\.md/, '''');

    toc += `${linktext}`;

    });

    toc += '''';

    });

    toc += '''';

    return toc;

    }

    ```


    We can now take the small functions we created and create the main build function,
    `buildWebsite,` from them. The `templateFile` constant describes where we can
    find our template file, `template.html,` which we created at the beginning:


    ```

    const templateFile = __dirname + ''/doc/website/template.html'';

    ```


    The next step is to replace the placeholders in the templates with the generated
    table of contents and the different content for each API or CLI method.


    In `buildWebsite,` we call `cleanUpWebsite` to remove any outdated files as a
    first step. We read the template with `fs.readFileSync` and get the table of contents.
    We then iterate over our sources. This time, we don’t spawn a child process with
    `marked-man;` we just use `marked`, which outputs HTML. After we get the target
    for the current file of the web site, we replace the `CONTENT` placeholder with
    it. `TOC` gets replaced with the table of contents, which is saved in `toc` at
    the top of the main function. Moving the read operation of the template and the
    creation of the TOC out of the loops improves the performance of our build, as
    we don’t have to call them for every new file. The rendered content finally gets
    written to the disk by using `fs.writeFileSync` again. The last line in the code
    snippet finally calls `buildWebsite` in order to build our web site when we run
    `build.js`:


    ```

    function buildWebsite () {

    cleanUpWebsite();

    const template = fs.readFileSync(templateFile, ''utf8'');

    const toc = getTocForWebsite();

    Object.keys(sources).forEach(type => {

    sources[type].forEach(currentFile => {

    // convert markdown to website content

    const out = spawnSync(''node'', [

    ''./node_modules/marked/bin/marked'',

    currentFile

    ]);

    const target = getTargetForWebsite(currentFile, type);

    const rendered = template

    .replace(''__CONTENT__'', out.stdout)

    .replace(''__TOC__'', toc);

    // write output to target file

    fs.writeFileSync(target, rendered, ''utf8'');

    });

    });

    }

    buildWebsite();

    ```


    We can now run our build again and take a look at our web site, shown in Figure
    [3-3](#A456043_1_En_3_Chapter.html#Fig3), which appears in the `website` folder:


    ![A456043_1_En_3_Fig3_HTML.jpg](A456043_1_En_3_Fig3_HTML.jpg)


    Figure 3-3


    The minimal website for lounger generated from our Markdown


    ```

    $ npm run docs

    ```


    The site is still missing some content as well as a nice stylesheet. As I already
    mentioned, building web sites is a topic for a whole new book, and I want to leave
    it like this for now. Feel free to add more content and styles to the web site.
    Nevertheless, we just created something that we can deploy to GitHub pages or
    any other hoster. The best thing about it is that we can ship it with our command-line
    client as additional documentation for everyone who can’t use or doesn’t like
    man pages. We will use both types of documentation in our next section when we
    create a help system.


    Note


    The code for this section can be found at `sourcecode/documentation`.


    ## More Help


    We have some documentation, but lounger still has some rough edges. If users try
    to access a command that does not exist, they won’t get any advice on how to continue:


    ```

    $ lounger foobar

    ```


    A user who calls lounger with no arguments at all also doesn’t get support:


    ```

    $ lounger

    ```


    What’s missing is a help page that explains how our users can get their tasks
    done. It would be awesome if they could open our documentation (web pages or man
    pages) right from the terminal. Our users shouldn’t have to care about man pages
    or have to find out where we host our web site. The desired behavior of lounger
    is as follows:


    1.  The CLI prints a general help message if it was called without a command or
    if a passed command doesn’t exist. This message gives the user a hint on how to
    proceed further to get the task done.  

    2.  It is easy to get additional help for a command.  


    This way, we offer help where the user needs it. No need to switch over to Google
    and search for help. In next two sections, we add the required functionality to
    lounger.'
  trans: "\n### 扩展构建脚本\n\n为了构建网站，我们必须在 `build.js` 中添加代码。首先，为网站文件添加另一个清理函数，这样每次都能从空白状态开始：\n\
    \n```\nfunction cleanUpWebsite () {\n  rimraf.sync(__dirname + '/website/');\n\
    \  mkdirp.sync(__dirname + '/website/');\n}\n```\n\n我们的网站与手册页有不同的目标。我们添加一个新函数\
    \ `getTargetForWebsite`。目前，我们的 Markdown 文件都以 `lounger-` 作为前缀，这对手册页很方便，但对我们的网站用处不大。相反，我们希望用其类型作为文件前缀；例如，API\
    \ 文档的前缀将是 `api-`。这样，我们可以将 API 页面放在 CLI 页面旁边，便于链接。`getTargetForWebsite` 函数的前几行将处理此任务，并用特定类型的前缀替换\
    \ `lounger-` 前缀。替换前缀后，我们将文件后缀从 `.md` 改为 `.html`。我们编译结果的最终目标文件夹是 `./website`，因此我们必须确保目录设置正确。与\
    \ `getTargetForManpages` 的不同之处在于，我们使用 `website` 文件夹而不是 `man`，并且我们还处理了 `doc/website/index.md`\
    \ 文件的路径：\n\n```\nfunction getTargetForWebsite (currentFile, type) {\n  let target\
    \ = currentFile;\n  // 为我们的 html 文件稍微修改文件名：\n  // 用 cli- 前缀替换所有 cli 函数的 lounger-\
    \ 前缀\n  // 用 api- 前缀替换所有 api 函数的 lounger- 前缀\n  if (type === 'cli') {\n    target\
    \ = currentFile.replace(/lounger-/, 'cli-');\n  }\n  if (type === 'api') {\n \
    \   target = currentFile.replace(/lounger-/, 'api-');\n  }\n  // 将文件后缀设置为 html\n\
    \  target = target.replace(/\\.md$/, '.html');\n  // 将源目录替换为目标目录\n  target = target\n\
    \    .replace(['doc', 'cli'].join(path.sep), 'website')\n    .replace(['doc',\
    \ 'api'].join(path.sep), 'website')\n    .replace(['doc', 'website'].join(path.sep),\
    \ 'website');\n  return target;\n}\n```\n\n我们的网站还缺少一个类似目录的东西。`getTocForWebsite`\
    \ 将创建我们 API 和 CLI 函数的列表。稍后，我们会将目录插入到模板的 `TOC` 占位符中。\n\n目录本身包含一个我们编译的文件的嵌套列表。将来，用\
    \ `Handlebars`、`Jade` 或 `Nunjucks` 这样的模板引擎替换整个系统可能是有意义的。我绝对可以再写一本关于静态网站生成及其众多可能工具链的书，但我目前尽量保持简单，只使用纯\
    \ ES6 模板。\n\n在开始一个无序列表 `<ul>` 后，我们再次遍历源的类型。我们不需要 `websiteIndex` 类型的文件，对于这些类型我们提前返回。对于其他所有类型，我们获取每个部分的类型并将其用作第一个列表元素。它显示每个部分（API\
    \ 或 CLI）的类型，并充当标题。\n\n获得标题后，我们遍历当前部分的每个文件。由于链接文本与实际超链接略有不同，我们创建了一个名为 `file` 的常量和一个额外的\
    \ `linktext` 常量。对于两者，我们都必须去掉 `lounger-` 前缀。为了创建用作 `href` 的引用，我们必须将 `.md` 后缀改为\
    \ `.html`。链接文本不应包含任何文件后缀，因此我们移除其 `.md` 后缀：\n\n```\nfunction getTocForWebsite ()\
    \ {\n  let toc = '';\n  Object.keys(sources).forEach(type => {\n    // 我们目前不希望在目录中包含索引\n\
    \    if (type === 'websiteIndex') {\n      return;\n    }\n    toc += `<li>${type}`;\n\
    \    sources[type].forEach(currentFile => {\n      const prefix = type === 'cli'\
    \ ? 'cli-' : 'api-';\n      const file = path.basename(currentFile)\n        .replace('lounger-',\
    \ prefix)\n        .replace(/\\.md/, '.html');\n      const linktext = path.basename(currentFile)\n\
    \        .replace('lounger-', '')\n        .replace(/\\.md/, '');\n      toc +=\
    \ `<ul><li><a href=\"${file}\">${linktext}</a></li></ul>`;\n    });\n    toc +=\
    \ '</li>';\n  });\n  toc += '</ul>';\n  return toc;\n}\n```\n\n现在，我们可以利用创建的小函数，从中构建主要构建函数\
    \ `buildWebsite`。`templateFile` 常量描述了我们在开始时创建的模板文件 `template.html` 的位置：\n\n```\n\
    const templateFile = __dirname + '/doc/website/template.html';\n```\n\n下一步是用生成的目录以及每个\
    \ API 或 CLI 方法的不同内容来替换模板中的占位符。\n\n在 `buildWebsite` 中，我们首先调用 `cleanUpWebsite` 来删除任何过时的文件。我们使用\
    \ `fs.readFileSync` 读取模板，并获取目录。然后我们遍历源。这一次，我们不会使用 `marked-man` 生成子进程；我们只使用 `marked`，它输出\
    \ HTML。在获取网站当前文件的目标后，我们用其替换 `CONTENT` 占位符。`TOC` 被替换为目录，该目录保存在主函数顶部的 `toc` 中。将模板的读取操作和\
    \ TOC 的创建移出循环，可以提高构建的性能，因为我们不必为每个新文件都调用它们。最后，使用 `fs.writeFileSync` 将渲染后的内容写入磁盘。代码片段中的最后一行最终调用\
    \ `buildWebsite`，以便在我们运行 `build.js` 时构建网站：\n\n```\nfunction buildWebsite () {\n\
    \  cleanUpWebsite();\n  const template = fs.readFileSync(templateFile, 'utf8');\n\
    \  const toc = getTocForWebsite();\n  Object.keys(sources).forEach(type => {\n\
    \    sources[type].forEach(currentFile => {\n      // 将 markdown 转换为网站内容\n   \
    \   const out = spawnSync('node', [\n        './node_modules/marked/bin/marked',\n\
    \        currentFile\n      ]);\n      const target = getTargetForWebsite(currentFile,\
    \ type);\n      const rendered = template\n        .replace('__CONTENT__', out.stdout)\n\
    \        .replace('__TOC__', toc);\n      // 将输出写入目标文件\n      fs.writeFileSync(target,\
    \ rendered, 'utf8');\n    });\n  });\n}\nbuildWebsite();\n```\n\n现在我们可以再次运行构建，并查看出现在\
    \ `website` 文件夹中的网站，如图 3-3 所示：\n\n![A456043_1_En_3_Fig3_HTML.jpg](img/A456043_1_En_3_Fig3_HTML.jpg)\n\
    \n**图 3-3** 由我们的 Markdown 生成的 lounger 最小化网站\n\n```\n$ npm run docs\n```\n\n该网站仍然缺少一些内容以及一个漂亮的样式表。正如我已经提到的，构建网站是一个可以写一整本书的话题，我目前就打算保持这样。欢迎随意为网站添加更多内容和样式。尽管如此，我们刚刚创建了一些可以部署到\
    \ GitHub Pages 或任何其他托管服务的东西。最好的一点是，我们可以将其与命令行客户端一起发布，作为那些无法使用或不喜欢手册页的人的额外文档。在下一节中，当我们创建帮助系统时，我们将使用这两种文档类型。\n\
    \n> **注意**  \n> 本节代码可在 `sourcecode/documentation` 找到。\n\n## 更多帮助\n\n我们已经有一些文档，但\
    \ lounger 仍然有些粗糙。如果用户尝试访问一个不存在的命令，他们不会得到任何如何继续的建议：\n\n```\n$ lounger foobar\n\
    ```\n\n一个不带任何参数调用 lounger 的用户也得不到支持：\n\n```\n$ lounger\n```\n\n缺少的是一个解释用户如何完成任务的帮助页面。如果他们能直接从终端打开我们的文档（网页或手册页），那就太棒了。我们的用户不应关心手册页，也不必找出我们托管网站的地址。lounger\
    \ 的预期行为如下：\n\n1. 如果 CLI 在未带命令或传递的命令不存在时被调用，它会打印一条通用帮助信息。这条信息提示用户如何进一步操作来完成任务。\n\
    2. 可以轻松获得某个命令的额外帮助。\n\n这样，我们在用户需要的地方提供帮助。无需切换到 Google 搜索帮助。在接下来的两节中，我们将为 lounger\
    \ 添加所需的功能。\n"
- fmt: "### General Help with a List of Commands\n\nTo add the general help screen,\
    \ we start by creating a new library function, `lib/help.js`. The first function\
    \ will print some friendly help text to the user. The help text gets constructed\
    \ in a helper function (no pun intended).\n\nWe can get all of our available commands\
    \ by calling `Object.keys(lounger.cli)`. We chain a `.join(', ')` call to separate\
    \ each command with a comma and a space:\n\n```\nconst lounger = require('./lounger.js');\n\
    function getGeneralHelpMessage () {\n  const commands = Object.keys(lounger.cli).join(',\
    \ ');\n```\n\nThe next part is a template string that explains how to use `lounger`.\
    \ We add all available commands that are exposed on the command-line interface.\
    \ We also explain that users without a clue can run `lounger help` together with\
    \ the command they are interested in to get detailed help for a command. We also\
    \ provide an example of how to call the help.\n\nThe final line indicates which\
    \ version of `lounger` the user is running, which comes in handy in various situations.\
    \ Usually, people forget which version of a package they have installed. Imagine\
    \ a user who just read a blog article about `lounger` version 2.3, which has a\
    \ great new feature to try. The user installed `lounger` some time ago, and, sadly,\
    \ the command is available only since version 2.3 (which was released three days\
    \ ago). In this case, the user can get immediate feedback that an older version\
    \ is running.\n\nHere is the whole `getGeneralHelpMessage` function:\n\n```\n\
    function getGeneralHelpMessage () {\n  const commands = Object.keys(lounger.cli).join(',\
    \ ');\n  const message = `Usage: lounger \nThe available commands for lounger\
    \ are:\n${commands}\nYou can get more help on each command with: lounger help\
    \ \nExample:\nlounger help isonline\nlounger v${lounger.version} on Node.js ${process.version}`;\n\
    \  return message;\n}\n```\n\nThat’s already it for the general help message.\
    \ Next, we are going to extend the help system further.\n\n### Help for Each Command\n\
    \nA simple system for accessing help for each command in our command-line client\
    \ is invaluable. The next function we’ll build will try to open the man page if\
    \ possible. It will fall back to the web site version for Windows users.\n\nThe\
    \ `opener` module does a great job opening files on different operating systems.\
    \ This also applies to HTML files, as we want to open them in the default browser\
    \ of the current operating system. So we install `opener` as our next dependency:\n\
    \n```\n$ npm install --save opener\n```\n\nWe then require `opener` at the top\
    \ of `help.js`:\n\n```\nconst opener = require('opener');\n```\n\nWe also have\
    \ to spawn the `man` command later and find out the absolute path for our web-site\
    \ files:\n\n```\nconst spawnSync = require('child_process').spawnSync;\nconst\
    \ path = require('path');\n```\n\nThe core module `os` can help us find out if\
    \ we are running on Windows:\n\n```\nconst isWindows = require('os').platform()\
    \ === 'win32';\n```\n\nWe then have to spawn the `man` command or open the default\
    \ browser for the desired functionality. With `stdio: inherit` for the spawn command,\
    \ we can see and interact with the output of the spawned process:\n\n```\nfunction\
    \ openDocumentation (command) {\n  if (isWindows) {\n    const htmlFile = path.resolve(__dirname\
    \ + '/../website/cli-' + command + '.html');\n    return opener('file:///' + htmlFile);\n\
    \  }\n  spawnSync('man', ['lounger-' + command], {stdio: 'inherit'});\n}\n```\n\
    \nThe last task is putting all our helper functions together. If a command is\
    \ not available, we print the general help. If the command exists, we open the\
    \ man page or the browser, depending on the operating system:\n\n```\nexports.cli\
    \ = help;\nfunction help (command) {\n  return new Promise((resolve, reject) =>\
    \ {\n    if (!lounger.cli[command]) {\n      console.log(getGeneralHelpMessage());\n\
    \    } else {\n      openDocumentation(command);\n    }\n    resolve();\n  });\n\
    }\n```\n\nIf you want, you can also add code to enable the user to configure the\
    \ type of documentation that is opened. Maybe Linux users prefer the web-site\
    \ version of the docs. We can already try the new `help` command, as it gets picked\
    \ up by our `lounger.js` file (Figure 3-4).\n\n![A456043_1_En_3_Fig4_HTML.jpg](A456043_1_En_3_Fig4_HTML.jpg)\n\
    \nFigure 3-4: Our help command in action\n\nOur final task in this section is\
    \ to make sure to print general help when the user does not enter a command at\
    \ all. In `bin/lounger-cli`, we require the `help.js` file and modify the `lounger.load`\
    \ call. In case we don’t find the command in `lounger.cli`, we print the general\
    \ help:\n\n```\nconst help = require('../lib/help.js');\nlounger.load(parsed).then(()\
    \ => {\n  if (!lounger.cli[cmd]) {\n    return help.cli();\n  }\n  lounger.cli[cmd]\n\
    \    .apply(null, parsed.argv.remain)\n    .catch(errorHandler);\n}).catch(errorHandler);\n\
    ```\n\nCongrats! We are finished with the help system now and have made significant\
    \ progress! Feel free to play around with our new help system by entering these\
    \ commands:\n\n```\n$ lounger blerg\n$ lounger\n$ lounger help\n$ lounger help\
    \ isonline\n```\n\n**Note:** The code for this section is located at `sourcecode/help-system`.\n\
    \n## Configuration\n\nRequiring our users to add their favorite settings as flags\
    \ by hand every time they use `lounger` can be cumbersome. A configuration file\
    \ enables our users to save the settings they need every day. It would be nice\
    \ if we could support this feature to make our power users happier.\n\n### Creating\
    \ the Configuration File\n\nIt is common practice to put the configuration files\
    \ for command-line tools into the home directory of the user. The home directory\
    \ is different for every operating system, but the `osenv` module can help us\
    \ find the current home directory:\n\n```\n$ npm install --save osenv\n```\n\n\
    We have to see whether a `loungerrc` configuration exists in our home directory,\
    \ and if not, we have to create an empty one. We do that in `lounger-cli`, in\
    \ order to keep the API functions free of the side effect. This is the changed\
    \ `lounger-cli` file, where we added a `require` call for `osenv` and created\
    \ a configuration file right after the argument parsing. We also add the path\
    \ to the config file to our parsed arguments:\n\n```\n#!/usr/bin/env node\nconst\
    \ lounger = require('../lib/lounger.js');\nconst pkg = require('../package.json');\n\
    const log = require('npmlog');\nconst nopt = require('nopt');\nconst help = require('../lib/help.js');\n\
    const osenv = require('osenv');\nconst fs = require('fs');\nconst parsed = nopt({\n\
    \  'json': [Boolean]\n}, {'j': '--json'}, process.argv, 2);\nconst home = osenv.home();\n\
    parsed.loungerconf = home + '/' + '.loungerrc';\nif (!fs.existsSync(parsed.loungerconf))\
    \ {\n  fs.writeFileSync(parsed.loungerconf, '');\n}\n```"
  raw: "### General Help with a List of Commands\n\nTo add the general help screen,\
    \ we start by creating a new library function, `lib/help.js`. The first function\
    \ will print some friendly help text to the user. The help text gets constructed\
    \ in a helper function (no pun intended).\n\nWe can get all of our available commands\
    \ by calling `Object.keys(lounger.cli)`. We chain a `.join(', ')` call to separate\
    \ each command with a comma and a space:\n\n```\nconst lounger = require('./lounger.js');\n\
    function getGeneralHelpMessage () {\nconst commands = Object.keys(lounger.cli).join(',\
    \ ');\n```\n\nThe next part is a template string that explains how to use lounger.\
    \ We add all available commands that are exposed on the command-line interface.\
    \ We also explain that users without a clue can run `lounger help` together with\
    \ the command they are interested in to get detailed help for a command. We also\
    \ provide an example of how to call the help.\n\nThe final line indicates which\
    \ version of lounger the user is running, which comes in handy in various situations.\
    \ Usually, people forget which version of a package they have installed. Imagine\
    \ a user who just read a blog article about lounger version 2.3, which has a great\
    \ new feature to try. The user installed lounger some time ago, and, sadly, the\
    \ command is available only since version 2.3 (which was released three days ago).\
    \ In this case, the user can get immediate feedback that an older version is running.\n\
    \nHere is the whole `getGeneralHelpMessage function`:\n\n```\nfunction getGeneralHelpMessage\
    \ () {\nconst commands = Object.keys(lounger.cli).join(', ');\nconst message =\
    \ `Usage: lounger \nThe available commands for lounger are:\n${commands}\nYou\
    \ can get more help on each command with: lounger help \nExample:\nlounger help\
    \ isonline\nlounger v${lounger.version} on Node.js ${process.version}`;\nreturn\
    \ message;\n}\n```\n\nThat’s already it for the general help message. Next, we\
    \ are going to extend the help system further.\n\n### Help for Each Command\n\n\
    A simple system for accessing help for each command in our command-line client\
    \ is invaluable. The next function we’ll build will try to open the man page if\
    \ possible. It will fall back to the web site version for Windows users.\n\nThe\
    \ `opener` module does a great job opening files on different operating systems.\
    \ This also applies to HTML files, as we want to open them in the default browser\
    \ of the current operating system. So we install `opener` as our next dependency:\n\
    \n```\n$ npm install --save opener\n```\n\nWe then require `opener` at the top\
    \ of `help.js`:\n\n```\nconst opener = require('opener');\n```\n\nWe also have\
    \ to spawn the `man` command later and find out the absolute path for our web-site\
    \ files:\n\n```\nconst spawnSync = require('child_process').spawnSync;\nconst\
    \ path = require('path');\n```\n\nThe core module `os` can help us find out if\
    \ we are running on Windows:\n\n```\nconst isWindows = require('os').platform()\
    \ === 'win32';\n```\n\nWe then have to spawn the `man` command or open the default\
    \ browser for the desired functionality. With `stdio: inherit` for the spawn command\
    \ , we can see and interact with the output of the spawned process:\n\n```\nfunction\
    \ openDocumentation (command) {\nif (isWindows) {\nconst htmlFile = path.resolve(__dirname\
    \ + '/../website/cli-' + command + '.html');\nreturn opener('file:///' + htmlFile);\n\
    }\nspawnSync('man', ['lounger-' + command], {stdio: 'inherit'});\n}\n```\n\nThe\
    \ last task is putting all our helper functions together. If a command is not\
    \ available, we print the general help. If the command exists, we open the man\
    \ page or the browser, depending on the operating system:\n\n```\nexports.cli\
    \ = help;\nfunction help (command) {\nreturn new Promise((resolve, reject) =>\
    \ {\nif (!lounger.cli[command]) {\nconsole.log(getGeneralHelpMessage());\n} else\
    \ {\nopenDocumentation(command);\n}\nresolve();\n});\n}\n```\n\nIf you want, you\
    \ can also add code to enable the user to configure the type of documentation\
    \ that is opened. Maybe Linux users prefer the web-site version of the docs. We\
    \ can already try the new `help` command, as it gets picked up by our `lounger.js`\
    \ file (Figure [3-4](#A456043_1_En_3_Chapter.html#Fig4)).\n\n![A456043_1_En_3_Fig4_HTML.jpg](A456043_1_En_3_Fig4_HTML.jpg)\n\
    \nFigure 3-4\n\nOur help command in action\n\nOur final task in this section is\
    \ to make sure to print general help when the user does not enter a command at\
    \ all. In `bin/lounger-cli,` we require the `help.js` file and modify the `lounger.load`\
    \ call. In case we don’t find the command in `lounger.cli`, we print the general\
    \ help:\n\n```\nconst help = require('../lib/help.js');\nlounger.load(parsed).then(()\
    \ => {\nif (!lounger.cli[cmd]) {\nreturn help.cli();\n}\nlounger.cli[cmd]\n.apply(null,\
    \ parsed.argv.remain)\n.catch(errorHandler);\n}).catch(errorHandler);\n```\n\n\
    Congrats! We are finished with the help system now and have made significant progress!\
    \ Feel free to play around with our new help system by entering these commands:\n\
    \n```\n$ lounger blerg\n$ lounger\n$ lounger help\n$ lounger help isonline\n```\n\
    \nNote\n\nThe code for this section is located at `sourcecode/help-system`.\n\n\
    ## Configuration\n\nRequiring our users to add their favorite settings as flags\
    \ by hand every time they use lounger can be cumbersome. A configuration file\
    \ enables our users to save the settings they need every day. It would be nice\
    \ if we could support this feature to make our power users happier.\n\n### Creating\
    \ the Configuration File\n\nIt is common practice to put the configuration files\
    \ for command-line tools into the home directory of the user. The home directory\
    \ is different for every operating system, but the `osenv` module can help us\
    \ find the current home directory:\n\n```\n$ npm install --save osenv\n```\n\n\
    We have to see whether a `loungerrc` configuration exists in our home directory,\
    \ and if not, we have to create an empty one. We do that in `lounger-cli`, in\
    \ order to keep the API functions free of the side effect. This is the changed\
    \ `lounger-cli` file, where we added a `require` call for `osenv` and created\
    \ a configuration file right after the argument parsing. We also add the path\
    \ to the config file to our parsed arguments:\n\n```\n#!/usr/bin/env node\nconst\
    \ lounger = require('../lib/lounger.js');\nconst pkg = require('../package.json');\n\
    const log = require('npmlog');\nconst nopt = require('nopt');\nconst help = require('../lib/help.js');\n\
    const osenv = require('osenv');\nconst fs = require('fs');\nconst parsed = nopt({\n\
    'json': [Boolean]\n}, {'j': '--json'}, process.argv, 2);\nconst home = osenv.home();\n\
    parsed.loungerconf = home + '/' + '.loungerrc';\nif (!fs.existsSync(parsed.loungerconf))\
    \ {\nfs.writeFileSync(parsed.loungerconf, '');\n}\n```"
  trans: "\n### 命令列表的通用帮助\n\n要添加通用帮助界面，我们首先创建一个新的库函数 `lib/help.js`。第一个函数将向用户输出一些友好的帮助文本。帮助文本将在辅助函数中构建。\n\
    \n我们可以通过调用 `Object.keys(lounger.cli)` 获取所有可用的命令，然后链式调用 `.join(', ')` 方法，在每个命令之间用逗号和空格分隔：\n\
    \n```\nconst lounger = require('./lounger.js');\nfunction getGeneralHelpMessage\
    \ () {\n  const commands = Object.keys(lounger.cli).join(', ');\n```\n\n接下来是一个模板字符串，用于解释如何使用\
    \ `lounger`。我们添加所有在命令行界面上公开的可用命令。同时，我们说明，如果用户毫无头绪，可以运行 `lounger help` 加上他们感兴趣的命令，以获取该命令的详细帮助。我们还提供了一个如何调用帮助的示例。\n\
    \n最后一行显示用户当前运行的 `lounger` 版本，这在各种情况下都非常实用。通常，人们会忘记自己安装的软件包版本。想象一下，一位用户刚刚读到一篇关于\
    \ `lounger` 2.3 版本的博客文章，其中有一个很棒的新功能可以尝试。用户很早以前就安装了 `lounger`，但遗憾的是，该命令仅从 2.3 版本（三天前发布）才开始可用。在这种情况下，用户可以立即收到反馈，提示当前运行的是旧版本。\n\
    \n以下是完整的 `getGeneralHelpMessage` 函数：\n\n```\nfunction getGeneralHelpMessage ()\
    \ {\n  const commands = Object.keys(lounger.cli).join(', ');\n  const message\
    \ = `Usage: lounger \nThe available commands for lounger are:\n${commands}\nYou\
    \ can get more help on each command with: lounger help \nExample:\nlounger help\
    \ isonline\nlounger v${lounger.version} on Node.js ${process.version}`;\n  return\
    \ message;\n}\n```\n\n通用帮助信息就这些内容了。接下来，我们将进一步扩展帮助系统。\n\n### 每个命令的帮助\n\n在我们的命令行客户端中，为每个命令提供一个简单的帮助访问系统是非常有价值的。我们将要构建的下一个函数会尝试打开手册页（如果可能的话）。对于\
    \ Windows 用户，它将回退到网站版本。\n\n`opener` 模块在不同操作系统中打开文件方面表现出色。这也适用于 HTML 文件，因为我们希望在当前操作系统的默认浏览器中打开它们。因此，我们安装\
    \ `opener` 作为下一个依赖：\n\n```\n$ npm install --save opener\n```\n\n然后，我们在 `help.js`\
    \ 的顶部引入 `opener`：\n\n```\nconst opener = require('opener');\n```\n\n接下来，我们还需要生成\
    \ `man` 命令，并找到网站文件的绝对路径：\n\n```\nconst spawnSync = require('child_process').spawnSync;\n\
    const path = require('path');\n```\n\n核心模块 `os` 可以帮助我们判断是否在 Windows 上运行：\n\n```\n\
    const isWindows = require('os').platform() === 'win32';\n```\n\n然后，我们需要生成 `man`\
    \ 命令，或者为所需功能打开默认浏览器。通过为生成命令设置 `stdio: inherit`，我们可以查看生成的进程输出并与之交互：\n\n```\nfunction\
    \ openDocumentation (command) {\n  if (isWindows) {\n    const htmlFile = path.resolve(__dirname\
    \ + '/../website/cli-' + command + '.html');\n    return opener('file:///' + htmlFile);\n\
    \  }\n  spawnSync('man', ['lounger-' + command], {stdio: 'inherit'});\n}\n```\n\
    \n最后一个任务是将所有辅助函数整合在一起。如果某个命令不可用，则打印通用帮助。如果命令存在，则根据操作系统打开手册页或浏览器：\n\n```\nexports.cli\
    \ = help;\nfunction help (command) {\n  return new Promise((resolve, reject) =>\
    \ {\n    if (!lounger.cli[command]) {\n      console.log(getGeneralHelpMessage());\n\
    \    } else {\n      openDocumentation(command);\n    }\n    resolve();\n  });\n\
    }\n```\n\n如果你愿意，还可以添加代码，让用户配置打开哪种类型的文档。也许 Linux 用户更喜欢文档的网站版本。我们现在就可以尝试新的 `help`\
    \ 命令，因为它会被我们的 `lounger.js` 文件识别（图 3-4）。\n\n![A456043_1_En_3_Fig4_HTML.jpg](img/A456043_1_En_3_Fig4_HTML.jpg)\n\
    \n图 3-4：我们的帮助命令运行中\n\n本节最后一个任务是确保在用户未输入任何命令时打印通用帮助。在 `bin/lounger-cli` 中，我们引入\
    \ `help.js` 文件并修改 `lounger.load` 调用。如果在 `lounger.cli` 中找不到该命令，我们就打印通用帮助：\n\n```\n\
    const help = require('../lib/help.js');\nlounger.load(parsed).then(() => {\n \
    \ if (!lounger.cli[cmd]) {\n    return help.cli();\n  }\n  lounger.cli[cmd]\n\
    \    .apply(null, parsed.argv.remain)\n    .catch(errorHandler);\n}).catch(errorHandler);\n\
    ```\n\n恭喜！我们现在完成了帮助系统，并取得了重大进展！欢迎通过输入以下命令来尝试我们的新帮助系统：\n\n```\n$ lounger blerg\n\
    $ lounger\n$ lounger help\n$ lounger help isonline\n```\n\n**注意：** 本节代码位于 `sourcecode/help-system`。\n\
    \n## 配置\n\n要求用户每次使用 `lounger` 时都手动添加他们喜欢的设置作为标志可能很繁琐。配置文件可以让用户保存他们每天需要的设置。如果能够支持这个功能，让我们的高级用户更满意，那就太好了。\n\
    \n### 创建配置文件\n\n通常的做法是将命令行工具的配置文件放在用户的主目录中。每个操作系统的主目录都不同，但 `osenv` 模块可以帮助我们找到当前的主目录：\n\
    \n```\n$ npm install --save osenv\n```\n\n我们需要检查主目录中是否存在 `loungerrc` 配置文件，如果不存在，则创建一个空文件。我们在\
    \ `lounger-cli` 中执行此操作，以保持 API 函数没有副作用。这是修改后的 `lounger-cli` 文件，我们在其中添加了对 `osenv`\
    \ 的 `require` 调用，并在参数解析后立即创建了一个配置文件。我们还将配置文件的路径添加到了解析后的参数中：\n\n```\n#!/usr/bin/env\
    \ node\nconst lounger = require('../lib/lounger.js');\nconst pkg = require('../package.json');\n\
    const log = require('npmlog');\nconst nopt = require('nopt');\nconst help = require('../lib/help.js');\n\
    const osenv = require('osenv');\nconst fs = require('fs');\nconst parsed = nopt({\n\
    \  'json': [Boolean]\n}, {'j': '--json'}, process.argv, 2);\nconst home = osenv.home();\n\
    parsed.loungerconf = home + '/' + '.loungerrc';\nif (!fs.existsSync(parsed.loungerconf))\
    \ {\n  fs.writeFileSync(parsed.loungerconf, '');\n}\n```\n"
- fmt: '### The Heart of Our Configuration System


    The config itself will use ini-formatted config files in order to store and read
    settings. The `config-chain` module loads configurations with different priorities
    based on the order we load them. It also supports ini-formatted files.


    Let’s create a `lib/config.js` file and require `config-chain`:


    ```

    $ npm i --save config-chain

    ''use strict'';

    const cc = require(''config-chain'');

    ```


    `config-chain` is able to manage multiple configurations. It will override configuration
    settings according to the order we load them.


    For our use case, we want the options provided as arguments on the command line
    to have the highest priority. They should override the options from the config
    file. As the loading of the file is done asynchronously, we have to listen to
    the `load` event emitted by `config-chain` after it is finished. For programmatic
    use of lounger with `loungr.load` and the API functions no file based configuration
    is needed. In those cases we don’t try to load the file. On all errors, we reject
    our promise and pass the error object:


    ```

    exports.loadConfig = loadConfig;

    function loadConfig (nopts) {

    return new Promise((resolve, reject) => {

    let cfg;

    if (!nopts.loungerconf) {

    cfg = cc(nopts)

    .on(''load'', () => {

    resolve(cfg);

    }).on(''error'', reject);

    } else {

    cfg = cc(nopts)

    .addFile(nopts.loungerconf, ''ini'', ''config'')

    .on(''load'', () => {

    resolve(cfg);

    }).on(''error'', reject);

    }

    });

    };

    ```


    The config object that is returned from `config-chain` has nice `get` and `set`
    methods. We can even save the config back to the configuration file after changing
    the config by using the `save` method. For now, we have to integrate `loadConfig`
    into the bootstrap of lounger. Do you remember the `config.get` method in `lounger.js`
    from the previous chapter? We will replace it with the config object that is returned
    by our `load` function.


    First, we have to load our config in `lounger.js`:


    ```

    const config = require(''./config.js'');

    ```


    In `lounger.load`, we are going to load the config:


    ```

    lounger.load = function load (opts) {

    return new Promise((resolve, reject) => {

    config

    .loadConfig(opts)

    .then((cfg) => {

    });

    ```


    The other content of `lounger.load`, including the `fs.readdir` call, is moved
    into the callback of the chained `then` function:


    ```

    lounger.load = function load (opts) {

    return new Promise((resolve, reject) => {

    config.loadConfig(opts)

    .then((cfg) => {

    lounger.config = cfg;

    fs.readdir(__dirname, (err, files) => {

    files.forEach((file) => {

    if (!/\.js$/.test(file) || file === ''lounger.js'') {

    return;

    }

    const cmd = file.match(/(.*)\.js$/)[1];

    const mod = require(''./'' + file);

    if (mod.cli) {

    cli[cmd] = mod.cli;

    }

    if (mod.api) {

    api[cmd] = mod.api;

    }

    });

    lounger.loaded = true;

    resolve(lounger);

    });

    }).catch(reject);

    });

    };

    ```


    If we now run lounger, it will create a config file for us in our home directory.
    On macOS my config is at `~/.loungerrc`.


    After the file is created (don’t forget to run lounger at least one time), we
    can set JSON output to `true` in `~/.loungerrc`:


    ```

    json = true

    ```


    Just try out `lounger isonline http://example.com`, and lounger will print JSON
    now. We can still override the config on the command line:


    ```

    $ lounger isonline --no-json

    ```


    ### A Helper to Edit the Configuration


    Because manually editing `~/.loungerrc` is not very user-friendly, we will build
    a `lounger config` command. This command should be used to show the config and
    its values and to set config values.


    Here is the proposed CLI:


    ```

    $ lounger config set json true

    $ lounger config get json

    ```


    The API could look like this:


    ```

    lounger.commands.set(''json'', true)

    lounger.commands.get(''json'')

    ```


    `config-chain` offers the data provided in the loaded config file as `.sources.config.data`.
    For JSON formatted output, we return the whole config if no key is provided:


    ```

    const data = lounger.config.sources.config.data;

    if (lounger.config.get(''json'') && !key) {

    resolve(data);

    return;

    }

    ```


    If a key is provided, we build a JSON object that contains only the value for
    our key:


    ```

    if (lounger.config.get(''json'') && key) {

    resolve({[key]: data[key]});

    return;

    }

    ```


    Given that we don’t want JSON formatted output and did provide a key, we return
    the value:


    ```

    if (key) {

    resolve(lounger.config.sources.config.data[key]);

    return;

    }

    ```


    In the last case, where the `json` setting is set to `false`, and no key was provided,
    we simply read the unparsed ini file:


    ```

    resolve(fs.readFileSync(lounger.config.sources));

    ```


    Here is the whole `get` function:


    ```

    function get (key) {

    return new Promise((resolve, reject) => {

    const data = lounger.config.sources.config.data;

    if (lounger.config.get(''json'') && !key) {

    resolve(data);

    return;

    }

    if (lounger.config.get(''json'') && key) {

    resolve({[key]: data[key]});

    return;

    }

    if (key) {

    resolve(lounger.config.sources.config.data[key]);

    return;

    }

    resolve(fs.readFileSync(lounger.config.sources));

    });

    }

    ```


    Modifying the config is done by the `set` function. It takes a key and a value,
    calls `set` on the `config-chain` object, and resolves the promise after the values
    are written to the disk:


    ```

    function set (key, value) {

    return new Promise((resolve, reject) => {

    if (!key && !value) {

    reject(new Error(''key and value required''));

    return;

    }

    lounger.config.set(key, value, ''config'');

    lounger.config.on(''save'', () => {

    resolve();

    });

    lounger.config.save(''config'');

    });

    }

    ```


    As a last step, we have to expose both commands:


    ```

    exports.api = {

    get: get,

    set: set

    };

    ```


    We build the CLI functionality on top of our API functions. The main difference
    between the API and CLI functions is that the CLI function has side effects for
    the `get` command: it prints the result to the console. We also add some nice
    error messages to make it easier for our users to use. They get instructions on
    how to run the command if they don’t use it properly:


    ```

    exports.cli = cli;

    function cli (cmd, key, value) {

    return new Promise((resolve, reject) => {

    function getUsageError () {

    const err = new Error([

    ''Usage:'',

    '''',

    ''lounger config get []'',

    ''lounger config set  '',

    ].join(''\n''));

    err.type = ''EUSAGE'';

    return err;

    }

    if (!cmd || (cmd !== ''get'' && cmd !== ''set'')) {

    const err = getUsageError();

    return reject(err);

    }

    if (cmd === ''get'') {

    return get(key).then((result) => {

    console.log(result);

    }).catch(reject);

    }

    if (cmd === ''set'') {

    if (!key && !value) {

    const err = getUsageError();

    return reject(err);

    }

    return set(key, value).catch(reject);

    }

    });

    }

    ```


    Great! We have a config command now! Here is our config command in action:


    ```

    $ lounger config set json true

    $ lounger config set foo bar

    $ lounger config get

    { json: true, foo: ''bar'' }

    $ lounger config get json

    { json: true }

    ```


    We fulfilled all points and are ready for an initial release!


    Note


    The code for this section is at `sourcecode/config`.'
  raw: '### The Heart of Our Configuration System


    The config itself will use ini-formatted config files in order to store and read
    settings. The `config-chain` module loads configurations with different priorities
    based on the order we load them. It also supports ini-formatted files .


    Let’s create a `lib/config.js` file and require `config-chain`:


    ```

    $ npm i --save config-chain

    ''use strict'';

    const cc = require(''config-chain'');

    ```


    `config-chain` is able to manage multiple configurations. It will override configuration
    settings according to the order we load them.


    For our use case, we want the options provided as arguments on the command line
    to have the highest priority. They should override the options from the config
    file. As the loading of the file is done asynchronously, we have to listen to
    the `load` event emitted by `config-chain` after it is finished. For programmatic
    use of lounger with loungr.load and the API functions no file based configuration
    is needed. In those cases we don’t try to load the file. On all errors, we reject
    our promise and pass the error object:


    ```

    exports.loadConfig = loadConfig;

    function loadConfig (nopts) {

    return new Promise((resolve, reject) => {

    let cfg;

    if (!nopts.loungerconf) {

    cfg = cc(nopts)

    .on(''load'', () => {

    resolve(cfg);

    }).on(''error'', reject);

    } else {

    cfg = cc(nopts)

    .addFile(nopts.loungerconf, ''ini'', ''config'')

    .on(''load'', () => {

    resolve(cfg);

    }).on(''error'', reject);

    }

    });

    };

    ```


    The config object that is returned from `config-chain` has nice `get` and `set`
    methods. We can even save the config back to the configuration file after changing
    the config by using the `save` method. For now, we have to integrate `loadConfig`
    into the bootstrap of lounger. Do you remember the `config.get` method in `lounger.js`
    from the previous chapter? We will replace it with the config object that is returned
    by our `load` function.


    First, we have to load our config in `lounger.js`:


    ```

    const config = require(''./config.js'');

    ```


    In `lounger.load,` we are going to load the config:


    ```

    lounger.load = function load (opts) {

    return new Promise((resolve, reject) => {

    config

    .loadConfig(opts)

    .then((cfg) => {

    });

    ```


    The other content of `lounger.load,` including the `fs.readdir` call, is moved
    into the callback of the chained `then` function:


    ```

    lounger.load = function load (opts) {

    return new Promise((resolve, reject) => {

    config.loadConfig(opts)

    .then((cfg) => {

    lounger.config = cfg;

    fs.readdir(__dirname, (err, files) => {

    files.forEach((file) => {

    if (!/\.js$/.test(file) || file === ''lounger.js'') {

    return;

    }

    const cmd = file.match(/(.*)\.js$/)[1];

    const mod = require(''./'' + file);

    if (mod.cli) {

    cli[cmd] = mod.cli;

    }

    if (mod.api) {

    api[cmd] = mod.api;

    }

    });

    lounger.loaded = true;

    resolve(lounger);

    });

    }).catch(reject);

    });

    };

    ```


    If we now run lounger, it will create a config file for us in our home directory.
    On macOS my config is at `~/.loungerrc`.


    After the file is created (don’t forget to run lounger at least one time), we
    can set JSON output to `true` in `~/.loungerrc`:


    ```

    json = true

    ```


    Just try out `lounger isonline` `http://example.com`, and lounger will print JSON
    now. We can still override the config on the command line:


    ```

    $ lounger isonline --no-json

    ```


    ### A Helper to Edit the Configuration


    Because manually editing `~/.loungerrc` is not very user-friendly, we will build
    a `lounger config` command. This command should be used to show the config and
    its values and to set config values.


    Here is the proposed CLI:


    ```

    $ lounger config set json true

    $ lounger config get json

    ```


    The API could look like this:


    ```

    lounger.commands.set(''json'', true)

    lounger.commands.get(''json'')

    ```


    `config-chain` offers the data provided in the loaded config file as `.sources.config.data`.
    For JSON formatted output, we return the whole config if no key is provided:


    ```

    const data = lounger.config.sources.config.data;

    if (lounger.config.get(''json'') && !key) {

    resolve(data);

    return;

    }

    ```


    If a key is provided, we build a JSON object that contains only the value for
    our key:


    ```

    if (lounger.config.get(''json'') && key) {

    resolve({[key]: data[key]});

    return;

    }

    ```


    Given that we don’t want JSON formatted output and did provide a key, we return
    the value:


    ```

    if (key) {

    resolve(lounger.config.sources.config.data[key]);

    return;

    }

    ```


    In the last case, where the `json` setting is set to `false`, and no key was provided,
    we simply read the unparsed ini file:


    ```

    resolve(fs.readFileSync(lounger.config.sources));

    ```


    Here is the whole `get` function:


    ```

    function get (key) {

    return new Promise((resolve, reject) => {

    const data = lounger.config.sources.config.data;

    if (lounger.config.get(''json'') && !key) {

    resolve(data);

    return;

    }

    if (lounger.config.get(''json'') && key) {

    resolve({[key]: data[key]});

    return;

    }

    if (key) {

    resolve(lounger.config.sources.config.data[key]);

    return;

    }

    resolve(fs.readFileSync(lounger.config.sources));

    });

    }

    ```


    Modifying the config is done by the `set` function. It takes a key and a value,
    calls `set` on the `config-chain` object, and resolves the promise after the values
    are written to the disk:


    ```

    function set (key, value) {

    return new Promise((resolve, reject) => {

    if (!key && !value) {

    reject(new Error(''key and value required''));

    return;

    }

    lounger.config.set(key, value, ''config'');

    lounger.config.on(''save'', () => {

    resolve();

    });

    lounger.config.save(''config'');

    });

    }

    ```


    As a last step, we have to expose both commands:


    ```

    exports.api = {

    get: get,

    set: set

    };

    ```


    We build the CLI functionality on top of our API functions. The main difference
    between the API and CLI functions is that the CLI function has side effects for
    the `get` command: it prints the result to the console. We also add some nice
    error messages to make it easier for our users to use. They get instructions on
    how to run the command if they don’t use it properly:


    ```

    exports.cli = cli;

    function cli (cmd, key, value) {

    return new Promise((resolve, reject) => {

    function getUsageError () {

    const err = new Error([

    ''Usage:'',

    '''',

    ''lounger config get []'',

    ''lounger config set  '',

    ].join(''\n''));

    err.type = ''EUSAGE'';

    return err;

    }

    if (!cmd || (cmd !== ''get'' && cmd !== ''set'')) {

    const err = getUsageError();

    return reject(err);

    }

    if (cmd === ''get'') {

    return get(key).then((result) => {

    console.log(result);

    }).catch(reject);

    }

    if (cmd === ''set'') {

    if (!key && !value) {

    const err = getUsageError();

    return reject(err);

    }

    return set(key, value).catch(reject);

    }

    });

    }

    ```


    Great! We have a config command now! Here is our config command in action:


    ```

    $ lounger config set json true

    $ lounger config set foo bar

    $ lounger config get

    { json: true, foo: ''bar'' }

    $ lounger config get json

    { json: true }

    ```


    We fulfilled all points and are ready for an initial release!


    Note


    The code for this section is at `sourcecode/config`.'
  trans: '

    ### 配置系统的核心


    配置系统本身将使用 ini 格式的配置文件来存储和读取设置。`config-chain`模块会根据我们加载配置的顺序为不同配置项设定优先级。它还支持 ini
    格式的文件。


    让我们创建一个`lib/config.js`文件并引入`config-chain`：


    ```

    $ npm i --save config-chain

    ''use strict'';

    const cc = require(''config-chain'');

    ```


    `config-chain`能够管理多个配置项。它会根据加载配置的顺序来覆盖配置设置。


    在我们的用例中，我们希望命令行参数中提供的选项拥有最高优先级。它们应该能够覆盖配置文件中的选项。由于文件加载是异步完成的，我们必须监听`config-chain`加载完成后发出的`load`事件。对于通过`lounger.load`和
    API 函数进行的程序化使用，不需要基于文件的配置。在这些情况下，我们不会尝试加载文件。如果出现任何错误，我们会拒绝 Promise 并传递错误对象：


    ```

    exports.loadConfig = loadConfig;

    function loadConfig (nopts) {

    return new Promise((resolve, reject) => {

    let cfg;

    if (!nopts.loungerconf) {

    cfg = cc(nopts)

    .on(''load'', () => {

    resolve(cfg);

    }).on(''error'', reject);

    } else {

    cfg = cc(nopts)

    .addFile(nopts.loungerconf, ''ini'', ''config'')

    .on(''load'', () => {

    resolve(cfg);

    }).on(''error'', reject);

    }

    });

    };

    ```


    `config-chain`返回的配置对象具有方便的`get`和`set`方法。我们甚至可以在修改配置后使用`save`方法将配置保存回配置文件。现在，我们必须将`loadConfig`集成到
    lounger 的启动过程中。还记得上一章`lounger.js`中的`config.get`方法吗？我们将用`load`函数返回的配置对象替换它。


    首先，我们必须在`lounger.js`中加载配置：


    ```

    const config = require(''./config.js'');

    ```


    在`lounger.load`中，我们将加载配置：


    ```

    lounger.load = function load (opts) {

    return new Promise((resolve, reject) => {

    config

    .loadConfig(opts)

    .then((cfg) => {

    });

    ```


    `lounger.load`的其他内容，包括`fs.readdir`调用，被移到链式`then`函数的回调中：


    ```

    lounger.load = function load (opts) {

    return new Promise((resolve, reject) => {

    config.loadConfig(opts)

    .then((cfg) => {

    lounger.config = cfg;

    fs.readdir(__dirname, (err, files) => {

    files.forEach((file) => {

    if (!/\.js$/.test(file) || file === ''lounger.js'') {

    return;

    }

    const cmd = file.match(/(.*)\.js$/)[1];

    const mod = require(''./'' + file);

    if (mod.cli) {

    cli[cmd] = mod.cli;

    }

    if (mod.api) {

    api[cmd] = mod.api;

    }

    });

    lounger.loaded = true;

    resolve(lounger);

    });

    }).catch(reject);

    });

    };

    ```


    如果我们现在运行 lounger，它将在我们的主目录中创建一个配置文件。在 macOS 上，我的配置位于`~/.loungerrc`。


    创建文件后（别忘了至少运行一次 lounger），我们可以在`~/.loungerrc`中将 JSON 输出设置为`true`：


    ```

    json = true

    ```


    只需尝试运行 `lounger isonline http://example.com`，lounger 现在就会打印 JSON 格式的输出。我们仍然可以在命令行上覆盖配置：


    ```

    $ lounger isonline --no-json

    ```


    ### 一个编辑配置的辅助工具


    因为手动编辑`~/.loungerrc`对用户不太友好，所以我们将构建一个`lounger config`命令。这个命令应该用于显示配置及其值，以及设置配置值。


    以下是提议的 CLI 界面：


    ```

    $ lounger config set json true

    $ lounger config get json

    ```


    相应的 API 可能如下所示：


    ```

    lounger.commands.set(''json'', true)

    lounger.commands.get(''json'')

    ```


    `config-chain`将加载的配置文件中提供的数据作为`.sources.config.data`提供。对于 JSON 格式的输出，如果没有提供键，我们将返回整个配置：


    ```

    const data = lounger.config.sources.config.data;

    if (lounger.config.get(''json'') && !key) {

    resolve(data);

    return;

    }

    ```


    如果提供了键，我们将构建一个仅包含该键对应值的 JSON 对象：


    ```

    if (lounger.config.get(''json'') && key) {

    resolve({[key]: data[key]});

    return;

    }

    ```


    如果我们不希望输出 JSON 格式并且提供了键，则返回值：


    ```

    if (key) {

    resolve(lounger.config.sources.config.data[key]);

    return;

    }

    ```


    在最后一种情况下，当`json`设置为`false`且未提供键时，我们将直接读取未经解析的 ini 文件：


    ```

    resolve(fs.readFileSync(lounger.config.sources));

    ```


    以下是完整的`get`函数：


    ```

    function get (key) {

    return new Promise((resolve, reject) => {

    const data = lounger.config.sources.config.data;

    if (lounger.config.get(''json'') && !key) {

    resolve(data);

    return;

    }

    if (lounger.config.get(''json'') && key) {

    resolve({[key]: data[key]});

    return;

    }

    if (key) {

    resolve(lounger.config.sources.config.data[key]);

    return;

    }

    resolve(fs.readFileSync(lounger.config.sources));

    });

    }

    ```


    修改配置通过`set`函数完成。它接受一个键和一个值，在`config-chain`对象上调用`set`，并在值写入磁盘后解析 Promise：


    ```

    function set (key, value) {

    return new Promise((resolve, reject) => {

    if (!key && !value) {

    reject(new Error(''key and value required''));

    return;

    }

    lounger.config.set(key, value, ''config'');

    lounger.config.on(''save'', () => {

    resolve();

    });

    lounger.config.save(''config'');

    });

    }

    ```


    作为最后一步，我们必须暴露这两个命令：


    ```

    exports.api = {

    get: get,

    set: set

    };

    ```


    我们在 API 函数的基础上构建 CLI 功能。API 函数和 CLI 函数的主要区别在于，CLI 函数对于`get`命令有副作用：它会将结果打印到控制台。我们还添加了一些友好的错误消息，以便用户更容易使用。如果用户使用不当，他们会得到如何运行命令的说明：


    ```

    exports.cli = cli;

    function cli (cmd, key, value) {

    return new Promise((resolve, reject) => {

    function getUsageError () {

    const err = new Error([

    ''Usage:'',

    '''',

    ''lounger config get []'',

    ''lounger config set  '',

    ].join(''\n''));

    err.type = ''EUSAGE'';

    return err;

    }

    if (!cmd || (cmd !== ''get'' && cmd !== ''set'')) {

    const err = getUsageError();

    return reject(err);

    }

    if (cmd === ''get'') {

    return get(key).then((result) => {

    console.log(result);

    }).catch(reject);

    }

    if (cmd === ''set'') {

    if (!key && !value) {

    const err = getUsageError();

    return reject(err);

    }

    return set(key, value).catch(reject);

    }

    });

    }

    ```


    太棒了！我们现在就有了一个配置命令！以下是我们的配置命令实际运行的效果：


    ```

    $ lounger config set json true

    $ lounger config set foo bar

    $ lounger config get

    { json: true, foo: ''bar'' }

    $ lounger config get json

    { json: true }

    ```


    我们已经满足了所有要点，可以准备进行初始发布了！


    注意


    本节代码位于`sourcecode/config`目录下。

    '
- fmt: "# Our First Release and Tips\n\nYou can publish open source modules after\
    \ registering an account at the npm registry. After registering the account, you\
    \ just have to type `npm publish` to publish your module to the registry. Before\
    \ we publish `lounger`, I want to mention that there are some nice ways to optimize\
    \ the published packages. In this section, I will explain how to optimize your\
    \ package in terms of size and installation time.\n\nOne way to keep the installation\
    \ size small is to add an `.npmignore` file to the root directory. It works like\
    \ a `.gitignore` file, and npm won't include the listed files and directories\
    \ in the published package.\n\nDepending on the types of the files that aren't\
    \ needed when using the module, we can save a lot of space on the hard disks of\
    \ our users. We can save them a lot of bandwidth too.\n\nWe can save some space\
    \ by excluding our unit and integration tests as well as the source for the compiled\
    \ documentation:\n\n```\n/test/\n/docs/\nbuild.js\n.DS_Store\nnpm-debug.log\n\
    ```\n\nAnother great way to speed up installation time is to include all production\
    \ dependencies in the published module. We can tell npm to bundle them with our\
    \ module by adding them as `bundleDependencies` to our `package.json`:\n\n```\n\
    \"bundleDependencies\": [\n\"config-chain\",\n\"nopt\",\n\"npmlog\",\n\"opener\"\
    ,\n\"osenv\",\n\"request\"\n],\n```\n\nBundling the dependencies reduces the installation\
    \ time a lot, as we omit all the small HTTP requests for each dependency and their\
    \ dependencies during installation. With the current npm, installation time is\
    \ reduced from 20 seconds to 5 seconds for a broadband connection. Bundling the\
    \ dependencies also makes sure that our package is still installable even if a\
    \ module was unpublished.\n\nWhen we now run `npm publish`, we will publish a\
    \ highly optimized version of our package.\n\n**Note**  \nThe code for this section\
    \ is at `sourcecode/first-release`.\n\n## Summary\n\nIn this chapter, we made\
    \ a lot of progress. We enhanced the usability of our client. We also created\
    \ systems for help and configuration. The command-line client supports JSON output\
    \ and shortcuts. Oh, and I have to congratulate you! You made your first release\
    \ of the tool. Along the way, you've learned a few tricks to enhance the installation\
    \ experience for the user. This gives you a solid foundation for the next chapter,\
    \ where we'll cover streams to handle large amounts of data.\n\n# 4. Migrating\
    \ Large Amounts of Data by Using Streams\n\nIn the preceding chapter, we made\
    \ sure that our users will enjoy our CLI. We also published our first release.\
    \ Now we want to take a look at a more advanced topic: streams. Streams are a\
    \ very powerful feature in Node.js for processing large amounts of data. With\
    \ traditional buffering, we quickly run into memory problems, because all the\
    \ data just doesn't fit into the memory of the computer. Streams enable us to\
    \ process data in small slices. Node.js streams work like Unix streams on the\
    \ terminal, where you pipe data from a producer into a consumer by using the pipe\
    \ symbol (`|`). We will take a look at how piping works by exploring the `cat`\
    \ command. Afterward, we will create our own streams and integrate them into our\
    \ command-line client.\n\n## The cat Command\n\nThe `cat` program prints the content\
    \ of files to `stdout`. In this example, I am piping the output of the `cat` program\
    \ into `tr` to change all letters from our `package.json` to uppercase letters:\n\
    \n```\n$ cat sourcecode/first-release/package.json | tr 'a-z' 'A-Z'\n```\n\nIt\
    \ works with all output on `stdout`:\n\n```\n$ echo \"i shout?\" | tr 'a-z' 'A-Z'\n\
    ```\n\nStreams in Unix and in Node.js enable us to compose small programs or modules\
    \ that do one thing well to get our task done. They handle backpressure, which\
    \ means that a fast producer will automatically slow down if it is piped into\
    \ a slow consumer.\n\nThe most used streams in Node are the `Readable`, `Writable`,\
    \ and `Transform` streams. They are base classes that can be used to build your\
    \ own custom streams. Other stream types, such as the `Duplex` stream and the\
    \ `Passthrough` stream, aren't covered in the book. The `Readable` stream is used\
    \ to read input data, the `Transform` stream is usually used to modify chunks\
    \ of data, and the `Writable` stream accepts data to write it somewhere (for example,\
    \ into a file).\n\nToday we will write a command that will use streams for piping\
    \ data from CSV files into CouchDB/PouchDB. We could also write an importer to\
    \ migrate data from a database (for example, Postgres or MongoDB), but with plain\
    \ CSV files, we don't have to install a new database. The principle applies to\
    \ both source types, files, and databases. At the end of the chapter, I will provide\
    \ a link to an example for a Node.js stream pipeline that migrates data from MongoDB\
    \ to CouchDB/PouchDB.\n\n## The First Stream\n\nBuilding streams can be a bit\
    \ tricky sometimes. We start by creating the file `stream-example.js` in the root\
    \ dir of our module.\n\nOur first iteration will output our CSV contents to `stdout`.\
    \ We will use it to learn how streams work and build our importer on top of it\
    \ later. To develop, we need a CSV file; we can save it to `test/fixtures/test.csv`:\n\
    \n```\ntime;location\nmarch;austin,us\napril;boston,us\noctober;bristol,uk\nfebruary;hermigua,es\n\
    march;hermigua,es\napril;havana,cu\n```\n\nLuckily, we don't have to write our\
    \ own streaming CSV parser:\n\n```\n$ npm install --save csv-parse\n```\n\nWe\
    \ require the `fs` and `util` modules. The `fs` module is needed to read the CSV\
    \ file from disk. We also need to require the CSV parser:\n\n```\nconst parse\
    \ = require('csv-parse');\nconst fs = require('fs');\nconst Transform = require('stream').Transform;\n\
    ```\n\nOur custom stream, called `MyTransformStream`, inherits from `stream.Transform`.\
    \ We set the stream into `objectMode` to be able to process the JSON input from\
    \ the CSV parser:\n\n```\nclass MyTransformStream extends Transform {\nconstructor\
    \ (options = { objectMode: true }) {\noptions.objectMode = true;\nsuper(options);\n\
    }\n}\n```\n\nA `Transform` stream has to implement one method: `_transform`. This\
    \ method is part of the class we just created and called for every chunk of data\
    \ that we are processing. In the `_transform` method, we can transform the chunks\
    \ to something new. The transformed data is then pushed to the next consumer by\
    \ using `this.push`. Once we are finished, we call the `done` callback to signal\
    \ that we are finished with this chunk. Right now, we just want to take a look\
    \ at what a chunk looks like:\n\n```\n_transform (chunk, encoding, done) {\nconsole.log('chunk:\
    \ ', chunk);\nthis.push(chunk);\ndone();\n}\n```\n\nAs a last step, we have to\
    \ pipe the CSV file into the CSV parser, and the parsed output into our custom\
    \ stream:\n\n```\nconst opts = {comment: '#', delimiter: ';', columns: true};\n\
    const parser = parse(opts);\nconst input = fs.createReadStream(__dirname + '/test/fixtures/test.csv');\n\
    input\n.pipe(parser)\n.pipe(new MyTransformStream());\n```\n\nWhen we now run\
    \ `node streams-example.js`, we get this output:\n\n```\n$ node streams-example.js\n\
    chunk:  { time: 'march', location: 'austin,us' }\nchunk:  { time: 'april', location:\
    \ 'boston,us' }\nchunk:  { time: 'october', location: 'bristol,uk' }\nchunk: \
    \ { time: 'february', location: 'hermigua,es' }\nchunk:  { time: 'march', location:\
    \ 'hermigua,es' }\nchunk:  { time: 'april', location: 'havana,cu' }\n```\n\nEvery\
    \ chunk is a JSON object. Every time we call `done` and there is still input produced,\
    \ `_transform` is called with the next chunk. We could take every chunk and post\
    \ it against the CouchDB/HTTP API now. We would keep our memory footprint super\
    \ low, but we would also send a lot of HTTP requests, and the whole migration\
    \ would take a long time. A healthy compromise is to buffer a few chunks and post\
    \ them against the bulk APIs of CouchDB/PouchDB. This way, we don't buffer all\
    \ existing data and run out of memory. We also will be finished earlier with our\
    \ import, as we don't have to send so many HTTP requests.\n\n**Note**  \nThe code\
    \ for this section can be found at `sourcecode/streams/streams-example.js`."
  raw: '## Our First Release and Tips


    You can publish open source modules after registering an account at the npm registry.
    After registering the account, you just have to type `npm publish` to publish
    your module to the registry. Before we publish lounger, I want to mention that
    there are some nice ways to optimize the published packages. In this section,
    I will explain how to optimize your package in terms of size and installation
    time.


    One way to keep the installation size small is to add an `.npmignore` file to
    the root directory. It works like a `.gitignore` file, and npm won’t include the
    listed files and directories in the published package.


    Depending on the types of the files that aren’t needed when using the module,
    we can save a lot of space on the hard disks of our users. We can save them a
    lot of bandwidth too.


    We can save some space by excluding our unit and integration tests as well as
    the source for the compiled documentation:


    ```

    /test/

    /docs/

    build.js

    .DS_Store

    npm-debug.log

    ```


    Another great way to speed up installation time is to include all production dependencies
    in the published module. We can tell npm to bundle them with our module by adding
    them as `bundleDependencies` to our `package.json`:


    ```

    "bundleDependencies": [

    "config-chain",

    "nopt",

    "npmlog",

    "opener",

    "osenv",

    "request"

    ],

    ```


    Bundling the dependencies reduces the installation time a lot, as we omit all
    the small HTTP requests for each dependency and their dependencies during installation.
    With the current npm, installation time is reduced from 20 seconds to 5 seconds
    for a broadband connection. Bundling the dependencies also makes sure that our
    package is still installable even if a module was unpublished.


    When we now run `npm publish`, we will publish a highly optimized version of our
    package.


    Note


    The code for this section is at `sourcecode/first-release`.


    ## Summary


    In this chapter, we made a lot of progress. We enhanced the usability of our client.
    We also created systems for help and configuration. The command-line client supports
    JSON output and shortcuts. Oh, and I have to congratulate you! You made your first
    release of the tool. Along the way, you’ve learned a few tricks to enhance the
    installation experience for the user. This gives you a solid foundation for the
    next chapter, where we’ll cover streams to handle large amounts of data.


    # 4. Migrating Large Amounts of Data by Using Streams


    In the preceding chapter, we made sure that our users will enjoy our CLI. We also
    published our first release. Now we want to take a look at a more advanced topic:
    streams. Streams are a very powerful feature in Node.js for processing large amounts
    of data. With traditional buffering, we quickly run into memory problems, because
    all the data just doesn’t fit into the memory of the computer. Streams enable
    us to process data in small slices. Node.js streams work like Unix streams on
    the terminal, where you pipe data from a producer into a consumer by using the
    pipe symbol (`|`). We will take a look at how piping works by exploring the `cat`
    command. Afterward, we will create our own streams and integrate them into our
    command-line client.


    ## The cat Command


    The `cat` program prints the content of files to `stdout`. In this example, I
    am piping the output of the `cat` program into `tr` to change all letters from
    our `package.json` to uppercase letters:


    ```

    $ cat sourcecode/first-release/package.json | tr ''a-z'' ''A-Z''

    ```


    It works with all output on `stdout`:


    ```

    $ echo "i shout?" | tr ''a-z'' ''A-Z''

    ```


    Streams in Unix and in Node.js enable us to compose small programs or modules
    that do one thing well to get our task done. They handle backpressure, which means
    that a fast producer will automatically slow down if it is piped into a slow consumer.


    The most used streams in Node are the `Readable`, `Writable`, and `Transform`
    streams. They are base classes that can be used to build your own custom streams.
    Other stream types, such as the `Duplex` stream and the `Passthrough` stream ,
    aren’t covered in the book. The `Readable` stream is used to read input data,
    the `Transform` stream is usually used to modify chunks of data, and the `Writable`
    stream accepts data to write it somewhere (for example, into a file).


    Today we will write a command that will use streams for piping data from CSV files
    into CouchDB/PouchDB. We could also write an importer to migrate data from a database
    (for example, Postgres or MongoDB), but with plain CSV files, we don’t have to
    install a new database. The principle applies to both source types, files, and
    databases. At the end of the chapter, I will provide a link to an example for
    a Node.js stream pipeline that migrates data from MongoDB to CouchDB/PouchDB.


    ## The First Stream


    Building streams can be a bit tricky sometimes. We start by creating the file
    `stream-example.js` in the root dir of our module.


    Our first iteration will output our CSV contents to `stdout`. We will use it to
    learn how streams work and build our importer on top of it later. To develop,
    we need a CSV file; we can save it to `test/fixtures/test.csv` :


    ```

    time;location

    march;austin,us

    april;boston,us

    october;bristol,uk

    february;hermigua,es

    march;hermigua,es

    april;havana,cu

    ```


    Luckily, we don’t have to write our own streaming CSV parser:


    ```

    $ npm install --save csv-parse

    ```


    We require the `fs` and `util` modules . The `fs` module is needed to read the
    CSV file from disk. We also need to require the CSV parser:


    ```

    const parse = require(''csv-parse'');

    const fs = require(''fs'');

    const Transform = require(''stream'').Transform;

    ```


    Our custom stream, called `MyTransformStream` , inherits from `stream.Transform`.
    We set the stream into `objectMode` to be able to process the JSON input from
    the CSV parser:


    ```

    class MyTransformStream extends Transform {

    constructor (options = { objectMode: true }) {

    options.objectMode = true;

    super(options);

    }

    }

    ```


    A `Transform` stream has to implement one method: `_transform`. This method is
    part of the class we just created and called for every chunk of data that we are
    processing. In the `_transform` method, we can transform the chunks to something
    new. The transformed data is then pushed to the next consumer by using `this.push`.
    Once we are finished, we call the `done` callback to signal that we are finished
    with this chunk. Right now, we just want to take a look at what a chunk looks
    like:


    ```

    _transform (chunk, encoding, done) {

    console.log(''chunk: '', chunk);

    this.push(chunk);

    done();

    }

    ```


    As a last step, we have to pipe the CSV file into the CSV parser, and the parsed
    output into our custom stream :


    ```

    const opts = {comment: ''#'', delimiter: '';'', columns: true};

    const parser = parse(opts);

    const input = fs.createReadStream(__dirname + ''/test/fixtures/test.csv'');

    input

    .pipe(parser)

    .pipe(new MyTransformStream());

    ```


    When we now run `node streams-example.js` , we get this output:


    ```

    $ node streams-example.js

    chunk:  { time: ''march'', location: ''austin,us'' }

    chunk:  { time: ''april'', location: ''boston,us'' }

    chunk:  { time: ''october'', location: ''bristol,uk'' }

    chunk:  { time: ''february'', location: ''hermigua,es'' }

    chunk:  { time: ''march'', location: ''hermigua,es'' }

    chunk:  { time: ''april'', location: ''havana,cu'' }

    ```


    Every chunk is a JSON object. Every time we call `done` and there is still input
    produced, `_transform` is called with the next chunk. We could take every chunk
    and post it against the CouchDB / HTTP API now. We would keep our memory footprint
    super low, but we would also send a lot of HTTP requests, and the whole migration
    would take a long time. A healthy compromise is to buffer a few chunks and post
    them against the bulk APIs of CouchDB/PouchDB. This way, we don’t buffer all existing
    data and run out of memory. We also will be finished earlier with our import,
    as we don’t have to send so many HTTP requests.


    Note


    The code for this section can be found at `sourcecode/streams/streams-example.js`.'
  trans: "\n# 首次发布与优化技巧\n\n在 npm 注册中心注册账号后，你就可以发布开源模块。完成注册后，只需输入 `npm publish` 即可将模块发布到注册中心。在发布\
    \ `lounger` 之前，我想介绍一些优化发布包的好方法。本节将讲解如何从体积和安装时间两个维度优化你的包。\n\n保持安装体积小巧的方法之一是在根目录添加\
    \ `.npmignore` 文件。它的工作方式类似 `.gitignore` 文件，npm 不会将其中列出的文件和目录包含在发布的包中。\n\n根据使用模块时不需要的文件类型，我们可以为用户节省大量硬盘空间，同时也能节省大量带宽。\n\
    \n通过排除单元测试、集成测试以及编译文档的源文件，我们可以节省一些空间：\n\n```\n/test/\n/docs/\nbuild.js\n.DS_Store\n\
    npm-debug.log\n```\n\n另一个显著加快安装速度的好方法是将所有生产依赖都包含在发布的模块中。我们可以通过将它们添加为 `package.json`\
    \ 中的 `bundleDependencies` 来告诉 npm 将它们与模块打包在一起：\n\n```\n\"bundleDependencies\"\
    : [\n\"config-chain\",\n\"nopt\",\n\"npmlog\",\n\"opener\",\n\"osenv\",\n\"request\"\
    \n],\n```\n\n打包依赖可以大大缩短安装时间，因为在安装过程中我们省略了每个依赖项及其依赖项的小型 HTTP 请求。使用当前的 npm，宽带连接的安装时间从\
    \ 20 秒减少到 5 秒。同时，打包依赖还能确保即使某个模块被取消发布，我们的包仍然可以安装。\n\n现在运行 `npm publish`，我们将发布一个高度优化版本的包。\n\
    \n**注意**  \n本节的代码位于 `sourcecode/first-release`。\n\n## 本章小结\n\n在本章中，我们取得了很大进展。我们增强了客户端的可用性，还创建了帮助和配置系统。命令行客户端现在支持\
    \ JSON 输出和快捷方式。哦，我必须恭喜你！你成功发布了工具的第一个版本。在此过程中，你还学到了一些技巧来提升用户的安装体验。这为下一章打下了坚实基础，届时我们将探讨如何使用流处理大量数据。\n\
    \n# 4. 使用流迁移大量数据\n\n在前一章中，我们确保了用户会喜欢我们的 CLI，并发布了第一个版本。现在我们来探讨一个更高级的话题：流。流是 Node.js\
    \ 中处理大量数据的一个非常强大的特性。使用传统的缓冲方式，我们很快就会遇到内存问题，因为所有数据无法全部装入计算机内存。而流使我们能够分片处理数据。Node.js\
    \ 流的工作方式类似于终端中的 Unix 流，你可以使用管道符号（`|`）将数据从生产者传输到消费者。我们将通过探索 `cat` 命令来了解管道的工作原理。随后，我们将创建自己的流并将其集成到命令行客户端中。\n\
    \n## cat 命令\n\n`cat` 程序将文件内容输出到 `stdout`。在这个例子中，我将 `cat` 程序的输出通过管道传给 `tr`，将 `package.json`\
    \ 中的所有字母转换为大写：\n\n```\n$ cat sourcecode/first-release/package.json | tr 'a-z'\
    \ 'A-Z'\n```\n\n它适用于 `stdout` 上的所有输出：\n\n```\n$ echo \"i shout?\" | tr 'a-z' 'A-Z'\n\
    ```\n\nUnix 和 Node.js 中的流使我们能够组合出只做好一件事的小型程序或模块，从而完成任务。它们处理背压，这意味着当快速生产者连接到慢速消费者时，生产者会自动减速。\n\
    \nNode 中最常用的流是 `Readable`、`Writable` 和 `Transform` 流。它们是可用于构建自定义流的基类。其他流类型，例如\
    \ `Duplex` 流和 `Passthrough` 流，本书不涉及。`Readable` 流用于读取输入数据，`Transform` 流通常用于修改数据块，而\
    \ `Writable` 流接收数据并将其写入某处（例如文件）。\n\n今天我们将编写一个命令，使用流将 CSV 文件中的数据通过管道传输到 CouchDB/PouchDB\
    \ 中。我们也可以编写一个导入器来从数据库（例如 Postgres 或 MongoDB）迁移数据，但使用纯 CSV 文件则无需安装新的数据库。该原理同样适用于文件和数据库这两种数据源。在本章末尾，我将提供一个示例链接，展示如何构建\
    \ Node.js 流管道，将数据从 MongoDB 迁移到 CouchDB/PouchDB。\n\n## 第一个流\n\n构建流有时会有点棘手。我们首先在模块的根目录下创建文件\
    \ `stream-example.js`。\n\n我们的第一个迭代版本会将 CSV 内容输出到 `stdout`。我们将用它来学习流的工作原理，并在此基础上构建导入器。开发时，我们需要一个\
    \ CSV 文件；可以将其保存到 `test/fixtures/test.csv`：\n\n```\ntime;location\nmarch;austin,us\n\
    april;boston,us\noctober;bristol,uk\nfebruary;hermigua,es\nmarch;hermigua,es\n\
    april;havana,cu\n```\n\n幸运的是，我们不需要自己编写流式 CSV 解析器：\n\n```\n$ npm install --save\
    \ csv-parse\n```\n\n我们引用 `fs` 和 `util` 模块。`fs` 模块用于从磁盘读取 CSV 文件。我们还需要引用 CSV 解析器：\n\
    \n```\nconst parse = require('csv-parse');\nconst fs = require('fs');\nconst Transform\
    \ = require('stream').Transform;\n```\n\n我们的自定义流名为 `MyTransformStream`，继承自 `stream.Transform`。我们将流设置为\
    \ `objectMode`，以便能够处理来自 CSV 解析器的 JSON 输入：\n\n```\nclass MyTransformStream extends\
    \ Transform {\nconstructor (options = { objectMode: true }) {\noptions.objectMode\
    \ = true;\nsuper(options);\n}\n}\n```\n\n`Transform` 流必须实现一个方法：`_transform`。该方法是我们刚刚创建的类的一部分，在处理每个数据块时被调用。在\
    \ `_transform` 方法中，我们可以将数据块转换为新的内容。转换后的数据随后通过 `this.push` 推送给下一个消费者。处理完成后，我们调用\
    \ `done` 回调来表明该数据块处理完毕。目前，我们只是想看看数据块的样子：\n\n```\n_transform (chunk, encoding,\
    \ done) {\nconsole.log('chunk: ', chunk);\nthis.push(chunk);\ndone();\n}\n```\n\
    \n最后一步，我们需要将 CSV 文件通过管道传给 CSV 解析器，再将解析后的输出传给我们的自定义流：\n\n```\nconst opts = {comment:\
    \ '#', delimiter: ';', columns: true};\nconst parser = parse(opts);\nconst input\
    \ = fs.createReadStream(__dirname + '/test/fixtures/test.csv');\ninput\n.pipe(parser)\n\
    .pipe(new MyTransformStream());\n```\n\n现在运行 `node streams-example.js`，我们会得到以下输出：\n\
    \n```\n$ node streams-example.js\nchunk:  { time: 'march', location: 'austin,us'\
    \ }\nchunk:  { time: 'april', location: 'boston,us' }\nchunk:  { time: 'october',\
    \ location: 'bristol,uk' }\nchunk:  { time: 'february', location: 'hermigua,es'\
    \ }\nchunk:  { time: 'march', location: 'hermigua,es' }\nchunk:  { time: 'april',\
    \ location: 'havana,cu' }\n```\n\n每个数据块都是一个 JSON 对象。每次我们调用 `done` 并且仍有输入产生时，`_transform`\
    \ 会被下一个数据块再次调用。我们现在可以将每个数据块通过 HTTP 请求发往 CouchDB/HTTP API。这样内存占用会非常低，但也会发送大量 HTTP\
    \ 请求，整个迁移过程会耗时很长。一个折中的好办法是缓冲少量数据块，然后通过 CouchDB/PouchDB 的批量 API 进行提交。这样既能避免缓存所有现有数据导致内存溢出，也能因为减少\
    \ HTTP 请求数量而更快完成导入。\n\n**注意**  \n本节的代码可以在 `sourcecode/streams/streams-example.js`\
    \ 找到。\n"
- fmt: '# The Transform and Writable Stream


    For our next stream, we will create the file `streams-bulk-example.js` in the
    root directory of lounger. It will take the objects from the CSV parsing stream
    and buffer them. At a given limit, it will pass the buffered objects to the next
    consumer. The result passed to the next consumer is ready to get posted against
    the `CouchDB`/`PouchDB` bulk docs API endpoint. The `CouchDB`/`PouchDB` bulk API
    accepts an array of objects wrapped with `{"docs": []}`.


    ## Creating a Wrapping Transform Stream


    We start with the same set of modules to develop the `Transform` stream:


    ```

    const parse = require(''csv-parse'');

    const fs = require(''fs'');

    const Transform = require(''stream'').Transform;

    ```


    The name of our stream will be `TransformToBulkDocs` and it will take options
    as an object. Using the options, we can specify the number of documents to buffer:


    ```

    class TransformToBulkDocs extends Transform {

    constructor (options = { objectMode: true, bufferedDocCount: 200 }) {

    options.objectMode = true;

    super(options);

    ```


    The empty array for `this.buffer` will be our buffer:


    ```

    this.buffer = [];

    this.bufferedDocCount = options.bufferedDocCount;

    ```


    Here is the whole class without the `_transform` method:


    ```

    class TransformToBulkDocs extends Transform {

    constructor (options = { objectMode: true, bufferedDocCount: 200 }) {

    options.objectMode = true;

    super(options);

    this.buffer = [];

    this.bufferedDocCount = options.bufferedDocCount;

    }

    }

    ```


    In the `_transform` method, we add every chunk to our buffer:


    ```

    _transform (chunk, encoding, done) {

    this.buffer.push(chunk);

    ```


    If the buffer has grown big enough, we call the method `this.push`, which we inherited
    from the base `Transform` stream. `this.push(args)` tells Node that we want to
    pass `args` to the next consumer in our stream pipeline. We then empty the buffer
    for new data that might arrive:


    ```

    if (this.buffer.length >= this.bufferedDocCount) {

    this.push({docs: this.buffer});

    this.buffer = [];

    }

    done();

    }

    ```


    Here is the whole `_transform` method:


    ```

    _transform (chunk, encoding, done) {

    this.buffer.push(chunk);

    if (this.buffer.length >= this.bufferedDocCount) {

    this.push({docs: this.buffer});

    this.buffer = [];

    }

    done();

    }

    ```


    The last part of our file is almost identical to our first streams example:


    ```

    const opts = {comment: ''#'', delimiter: '';'', columns: true};

    const parser = parse(opts);

    const input = fs.createReadStream(__dirname + ''/test/fixtures/test.csv'');

    input

    .pipe(parser)

    .pipe(new TransformToBulkDocs());

    ```


    We add a temporary `console.log` to our code to see if it works:


    ```

    if (this.buffer.length >= this.bufferedDocCount) {

    this.push({docs: this.buffer});

    console.log({docs: this.buffer});

    this.buffer = [];

    }

    ```


    When we run `node streams-bulk-example.js`, we see that it doesn’t work! Why?


    The problem is that we don’t have enough documents to reach the default document
    count of 200. The same applies to the remaining documents of a set. If we have
    250 initial documents as input, the first 200 are pushed to the next consumer,
    but the remaining 50 are lost. Luckily, the Node.js developers were aware of the
    problem and provided the `_flush` method. Unlike the `_transform` method, the
    `_flush` method doesn’t have to be implemented to make a `Transform` stream work.
    Instead, we can choose to implement it if we need it.


    The `_flush` method of a `Transform` class will get called at the very end, after
    all data is consumed by the stream, but before the stream emits the `end` event
    that signals the end of the stream. `_flush` will get called at the very end,
    and if we still have a few buffered documents, we push them to the next consumer:


    ```

    _flush (done) {

    this.buffer.length && this.push({docs: this.buffer});

    done();

    }

    ```


    That’s our first custom stream! Don’t forget to remove the `console.log` call
    we added!


    The next consumer in our pipeline will take the collected documents and post them
    against the `CouchDB`/`PouchDB` bulk docs endpoint. As the streams are able to
    handle backpressure, the other streams will wait until we’ve successfully added
    the documents to `CouchDB`/`PouchDB`. They will continue to pass us data down
    the pipeline after we are able to pull in the next collection of documents.


    The next stream we will build accepts the data from the `Transform` stream and
    writes it into the database. We will add that stream next.'
