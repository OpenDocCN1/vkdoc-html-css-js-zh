    \ res.statusCode + '\\n Body: ' + JSON.stringify(body);\n        return done(new\
    \ Error(msg));\n      }\n      done();\n    });\n  }\n}\n```\n\n### Designing\
    \ the Command\n\nLet's think a bit about the command we are going to build. A\
