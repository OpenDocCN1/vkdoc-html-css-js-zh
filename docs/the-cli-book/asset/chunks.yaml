- fmt: '# Documentation


    The last step to finish our `isonline` command is to add proper documentation.
    We will write this documentation in Markdown. We need documentation for the API
    and CLI commands. The API docs will live in `doc/api`, and the CLI commands will
    live in `doc/cli`. I know that most programmers hate writing documentation, but
    it will help us a lot: new users will be able to get up and running easier, and
    we won''t lose them before they had the chance to enjoy our product. Additionally,
    we make our lives easier by documenting the functionality once, so people don''t
    have to open issues or ask in a chat how they can use a command. It''s a win-win
    situation. We start with `doc/api/lounger-isonline.md`, which describes the API
    that is available at `lounger.commands`:


    ```

    lounger-isonline(3) -- check if a database is online

    ====================================================

    ```


    The heading describes our command as `lounger-isonline(3)` and then adds a short
    explanation of what the command is about. The number in parentheses describes
    the type of the section. For a man page, a library function is noted by a `3`,
    and a user command would be a `1` (spoiler: our CLI command is a user command).


    The next section describes how our users can use the command:


    ```

    ## SYNOPSIS

    lounger.commands.isonline(url)

    ```


    The last part is a detailed description of how the command works:


    ```

    ## DESCRIPTION

    Check if a CouchDB / PouchDB database is available on the current

    network.

    url:

    The url must be a String and must be a url using the http or https

    protocol.

    The command returns a promise. The promise returns an Object. The key of the Object
    is the provided url and the values are of type Boolean.

    true indicates an online CouchDB / PouchDB node.

    ```


    That''s it for the API part. We can now add the text for `doc/cli/lounger-isonline.md`:


    ```

    lounger-isonline(1) -- check if a database is online

    ====================================================

    lounger isonline  [--json]

    ## DESCRIPTION

    :

    Check if a database node is currently online or available.

    isonline prints the result as human readable output. JSON output is also supported
    by passing the --json flag.

    ```


    With the small `1` in `lounger-isonline(1)`, we are signaling that this help section
    explains a user command. The less-than and greater-than symbols in `<url>` show
    the user that `url` is a mandatory argument; without it, the command won''t work.
    The square brackets of `[--json]` mean that the `--json` flag is an optional command.
    With our first documentation pages ready, we can move to the next section and
    render it into various output formats.


    ## Rendering the Documentation


    Now that we have the sources for our documentation, we can start to build our
    documentation from our sources with `marked` and `marked-man`:


    ```

    $ npm i --save-dev marked marked-man

    ```


    A makefile would be a great fit for generating the documentation from the source.
    Sadly, it is hard to get makefiles to work on Windows, so we will write our build
    steps in JavaScript. In the root directory of lounger, we create the file `build.js`.
    Additionally, we have to install `mkdirp` and `rimraf`; `mkdirp` provides the
    functionality we know from the Linux command `mkdir -p` in a cross-platform way:
    it creates directories and subdirectories recursively. The `rimraf` module brings
    us the equivalent of `rm -rf` to the Node.js platform: deleting directories recursively.
    We also will use the `glob` module to match all needed files for our documentation
    build:


    ```

    $ npm i --save-dev mkdirp rimraf glob

    ```


    Our first function will be a function to clean a fresh folder structure where
    we can save our man pages:


    ```

    ''use strict'';

    const mkdirp = require(''mkdirp'');

    const rimraf = require(''rimraf'');

    const glob = require(''glob'');

    const path = require(''path'');

    function cleanUpMan () {

    rimraf.sync(__dirname + ''/man/'');

    // re-create the target directory

    mkdirp.sync(__dirname + ''/man/'');

    }

    ```


    We have to find out which Markdown files are available for the compile. Our sources
    for documentation are at `doc/api` or at `doc/cli`. Additionally, we will have
    some content in `doc/website` that is specific to the web site (the content for
    `index.html`).


    The `getSources` function helps us to get the full path to the Markdown files
    for each type of source (`api`, `doc`, `website`). It returns the relative path
    of the matching glob and then uses the `path.resolve` function to get the full
    path in a cross-platform way.


    ```

    function getSources (type) {

    const files = glob.sync(''doc/'' + type + ''/*.md'');

    return files.map(file => path.resolve(file));

    }

    ```


    The `sources` object stores an array of the found files for each type:


    ```

    const sources = {

    api: getSources(''api''),

    cli: getSources(''cli''),

    websiteIndex: getSources(''website''),

    };

    ```


    We can clean up our target directory now and get a list of file names that we
    want to convert. We still need to find out the target path and file name for the
    converted files. Man pages have different file endings, depending on the kind
    of functionality they describe. Our man pages for the CLI would get the ending
    `.1` (user commands), and our API function would get the ending `.3` (library
    functions). We also have to change `doc/cli/` and `doc/api/` in the path of the
    file to our target directory, `man/`. We have to take special care of the path
    separators. On Windows, the separators are `\\` instead of `/`. That means the
    path `doc/api` becomes `doc\\api` on Windows. The good news is that we can access
    the current path separator by using `path.sep` in Node.js (the separator is provided
    by the core module `path`):


    ```

    function getTargetForManpages (currentFile, type) {

    let target;

    // set the right section for the man page on unix systems

    if (type === ''cli'') {

    target = currentFile.replace(/\.md$/, ''.1'');

    }

    if (type === ''api'') {

    target = currentFile.replace(/\.md$/, ''.3'');

    }

    // replace the source dir with the target dir

    // do it for the windows path (doc\\api) and the unix path (doc/api)

    target = target

    .replace([''doc'', ''cli''].join(path.sep), ''man'')

    .replace([''doc'', ''api''].join(path.sep), ''man'');

    return target;

    }

    ```


    Right now, we just want to create man pages from our documents in the `api` and
    `cli` folders.


    Based on these building blocks, we can create the final `buildMan` function that
    will finally build our man pages. It will make use of the functions we just created
    and spawn a child process that compiles the Markdown files by using `marked-man`.
    We will use the `spawnSync` function from the Node core to spawn the processes.
    As we write the result to the file system, we have to require the `fs` module,
    too.'
