    \ CLI"
  trans: "\n# 3. 让我们的 CLI 工具更易上手\n\n在上一章中，我们为命令行工具打下了坚实基础。我们加载了第一个命令，整个程序已可在命令行中执行。现在我们将专注于可用性与易用性。我们将探讨如何改进错误处理，如何在程序崩溃时为用户提供引导。通过支持\
    \ JSON 格式和简写命令，我们将让高级用户感到满意。我们还将为文档创建不同的输出格式。在首次生产环境发布前，我们将添加一个灵活的配置管理系统。\n\n\
    ## 错误处理\n\n您已经知道，没有用户喜欢晦涩难懂的错误信息和堆栈跟踪。遗憾的是，我们的 `lounger` 应用目前正是如此。提升应用的易用性应该是我们的首要任务。\n\
    \n目前，`lounger` 对 `isonline` 命令的错误输入没有任何反应：\n\n```\n$ lounger isonline ragrragr\n\
    $\n```\n\n另一个需要考虑的问题是：我们是否正确处理了错误，以便用户可以在 bash 脚本中使用命令行客户端？\n\n```\n$ lounger\
    \ isonline ragrragr\n$ echo $?\n```\n\n让用户无需查阅文档就能立刻获得程序正确用法的提示，这样不是更好吗？没有人喜欢坐在黑漆漆的终端前，完全不知道下一步该做什么。趁此机会，我们还可以修复错误的退出码——目前它显示的是程序成功执行。\n\
    \n为什么我们在 `bin/lounger-cli` 中的 `console.error` 调用没有输出任何内容？原来我们引入了一个细微的 bug：我们忘记了为\
    \ `lib/isonline.js` 中返回 Promise 的调用添加 `.catch`。由于 API 函数 `isOnline` 会拒绝（reject）Promise，我们在\
    \ `cli` 函数中没有任何处理器来捕获它。没问题——我们马上添加 `.catch`：\n\n```\nfunction cli (url) {\nreturn\
    \ new Promise((resolve, reject) => {\nisOnline(url).then((results) => {\n// 在终端用户的标准输出上打印\n\
    Object.keys(results).forEach((entry) => {\nlet msg = '似乎离线或没有数据库服务器';\nif (results[entry])\
    \ {\nmsg = '似乎在线';\n}\nconsole.log(entry, msg);\nresolve(results);\n});\n}).catch(reject);\
    \  // 添加缺失的 catch\n});\n}\nexports.cli = cli;\n```\n\n再次尝试，结果略有改善：\n\n```\n$ lounger\
    \ isonline ragrragr\n[Error: Invalid URI \"ragrragr\"]\n```\n\n不确定你是否满意？我是不满意的！试想一个从未使用过\
    \ Node.js 或终端的用户，甚至可能是个电脑新手。“无效 URI”这条消息很难帮助他们完成任务。二十年前，他们可能需要去图书馆借书才能弄明白 URI\
    \ 是什么，而今天他们得去谷歌搜索。他们本可以使用我们的 CLI 愉快地完成任务！在下一节中，我们将探讨如何改进由错误输入引发的错误信息。\n\n### 处理使用错误\n\
    \n使用错误包括所有与接口误用相关的问题。通常，错误的输入是导致问题的根源。参数顺序也常常被意外调换。幸运的是，我们可以通过在 `isonline.js`\
    \ 中添加参数验证来修复此问题。\n\n如果用户没有向 CLI 提供 URL，我们将生成一个新的错误，其消息为 `Usage: lounger isonline\
    \ <url>`，用于描述用户应如何使用该命令。我们将错误类型设置为 `EUSAGE`，这将在后续变得重要。在 `lounger` 中，所有因用户提供错误输入而抛出的错误都会获得类型\
    \ `EUSAGE`。其他与 bug 相关的情况则不会获得此类型：\n\n```\nfunction cli (url) {\nreturn new Promise((resolve,\
    \ reject) => {\nif (!url) {\nconst err = new Error('Usage: lounger isonline ');\n\
    err.type = 'EUSAGE';\nreturn reject(err);\n}\n```\n\n`url` 周围的尖括号表示它是必填参数，而非可选。代码块中的最后一条命令会拒绝（reject）Promise\
    \ 并返回，从而阻止后续代码的执行。\n\n**提示**\n\n尽早返回有助于降低圈复杂度。圈复杂度是衡量代码复杂度的指标。例如，当 `if` 和 `else`\
    \ 代码块嵌套时，代码会显得更复杂，因为这些嵌套代码块使人脑更难理清程序的执行流程。\n\n此外，我们还需要检查 URL 是否有效：\n\n```\nif\
    \ (!/^(http:|https:)/.test(url)) {\nconst err = new Error([\n'无效协议，必须是 https 或\
    \ http',\n'Usage: lounger isonline '\n].join('\\n'));\nerr.type = 'EUSAGE';\n\
    return reject(err);\n}\n```\n\n在此例中，我们再次将错误类型设置为 `EUSAGE` 并拒绝 Promise。同时，我们告知用户，我们期望一个包含可用协议的有效\
    \ URL。\n\n再次尝试，我们会得到略微更好的结果：\n\n```\n$ ./bin/lounger-cli isonline dsf\n{ [Error:\
    \ 无效协议，必须是 https 或 http\nUsage: lounger isonline ] type: 'EUSAGE' }\n```\n\n由于我们拒绝了\
    \ Promise，添加到 `bin/lounger-cli` 中的 `console.error` 会打印错误对象。通过添加几行代码，我们可以将其格式化，以便人类更易阅读。为此，我们将安装\
    \ `npmlog` 日志记录器（提示：`npm i` 是 `npm install` 的简写）：\n\n```\n$ npm i --save npmlog\n\
    ```\n\n我们在 `bin/lounger-cli` 文件（即捕获被拒绝 Promise 的文件）的顶部引入该日志记录器：\n\n```\nconst\
    \ log = require('npmlog');\n```\n\n接下来，我们在 `bin/lounger-cli` 中添加 `errorHandler`\
    \ 函数。如果错误是使用错误（类型为 `EUSAGE`），我们会记录消息并以错误码 `1` 退出。所有其他错误暂时使用 `log.error(err)` 记录：\n\
    \n```\nfunction errorHandler (err) {\nif (!err) {\nprocess.exit(1);\n}\nif (err.type\
    \ === 'EUSAGE') {\nerr.message && log.error(err.message);\nprocess.exit(1);\n\
    }\nlog.error(err);\nprocess.exit(1);\n}\n```\n\n现在我们需要将旧的 `console.error` 调用替换为新的错误处理函数：\n\
    \n```\nlounger.load().then(() => {\nlounger.cli[cmd]\n.apply(null, parsed.argv.remain)\n\
    .catch(errorHandler);\n}).catch(errorHandler);\n```\n\n太棒了——让我们看看它是否有效：\n\n```\n\
    $ lounger isonline\nERR! Usage: lounger isonline \n$ echo $?\n```\n\n图 3-1 展示了结果。看起来好多了！\n\
    \n![A456043_1_En_3_Fig1_HTML.jpg](img/A456043_1_En_3_Fig1_HTML.jpg)\n\n**图 3-1**\
    \ 由于向 CLI 提供错误输入而产生的使用错误\n"
- fmt: '### Providing Further Guidance


    We still haven’t dealt with other errors: errors from dependencies we use, or
    evil bugs that sneak in, like reference errors. To simulate such an error, we
    can add a call to a nonexistent function in the `cli` function:


    ```

    function cli (url) {

    return new Promise((resolve, reject) => {

    doesNotExist();

    ```


    If we now run the command-line client, we get this:


    ```

    $ lounger isonline http://example.com

    ERR! ReferenceError: doesNotExist is not defined

    ```


    If I had just downloaded the command-line client and tried to use it, I would
    be quite puzzled. Say I started a new job and tried to use the same tool that
    my coworkers were using, but downloaded a newer release with bugs. I would be
    stuck, with no further information about how to continue. To be honest, if I hadn’t
    programmed in JavaScript for years, this stacktrace would really puzzle me!


    Most people would just stop using our program and switch to an alternative. Very
    few would go on a journey of finding out where to submit an issue or even write
    a PR. Usually, computers are frustrating, and people don’t want to spend multiple
    hours trying to find someone to help them with a cryptic message. So how about
    making this process as easy as possible, reducing the friction where we can?


    `npm` itself supports a `bugs` property in `package.json`. If we add the following
    to the `package.json` file of `lounger`, a call to `npm bugs` will open [`http://example.com/lounger/issues`](http://example.com/lounger/issues)
    in a browser for us:


    ```

    "bugs": {

    "url": "http://example.com/lounger/issues"

    },

    ```


    Cool—we have a central place for storing the URL to our issue tracker. We can
    also add the URL to our stacktraces, in order to make submitting bugs for our
    users easier. We need to require `package.json` in `bin/lounger-cli`, the file
    where we print our errors anyway:


    ```

    const pkg = require(''./package.json'');

    ```


    By altering our `errorHandler`, we make it print full stacktraces. Additionally,
    we ask the user to open an issue, as it is pretty clear right now that the error
    was not a usage error that was caught by our validations :


    ```

    function errorHandler (err) {

    if (!err) {

    process.exit(1);

    }

    if (err.type === ''EUSAGE'') {

    err.message && log.error(err.message);

    process.exit(1);

    }

    err.message && log.error(err.message);

    if (err.stack) {

    log.error('''', err.stack);

    log.error('''', '''');

    log.error('''', '''');

    log.error('''', ''lounger:'', pkg.version, ''node:'', process.version);

    log.error('''', ''please open an issue including this log on '' + pkg.bugs.url);

    }

    process.exit(1);

    }

    ```


    OK, here’s the next try:


    ```

    $ lounger isonline http://example.com

    ERR! doesNotExist is not defined

    ERR! ReferenceError: doesNotExist is not defined

    ERR!     at /home/rocko/clibook/sourcecode/error-handling/lib/isonline.js:35:7

    ERR!     at cli (/home/rocko/clibook/sourcecode/error-handling/lib/isonline.js:34:10)

    ERR!     at /home/rocko/clibook/sourcecode/error-handling/bin/lounger-cli:15:6

    ERR!

    ERR!

    ERR! lounger: 1.0.0 node: v9.1.0

    ERR! please open an issue including this log on http://example.com/lounger/issues

    ```


    Awesome! The stacktrace with line numbers is useful for us. The current version
    of the program and the Node.js environment help us, too. In case the command-line
    client really hits a wall, we receive a lot of information in order to debug the
    process. Even more important: the user gets all the information needed to create
    an issue. We remove a lot of friction from the process by directly pointing to
    the issue tracker and providing all information that is needed to describe the
    bug—no long back and forth about the current Node version or the missing logfile!


    **Note**


    The code for this section can be found at `sourcecode/error-handling`.


    ## JSON Support and Shorthand


    JSON support is useful for all users who want to take the output from the CLI
    and process it programatically with their own tools. By adding a `--json` flag
    to our `isonline` command, we can add this useful feature with a few lines of
    code. We have to tell our argument parser about it; in this case, we are telling
    `nopt` that we want to have `--json` handled as a Boolean in `bin/lounger-cli`:


    ```

    const parsed = nopt({

    ''json'': [Boolean]

    }, {''j'': ''--json''}, process.argv, 2);

    ```


    Based on the type `Boolean`, `nopt` will automatically also add `--no-json` for
    us, which will come in handy when we add additional configuration by file later.
    Additionally, we register a shorthand option for our power users: they can use
    `-j` instead of `--json`.


    We then pass the result `parsed` into `lounger.load`:


    ```

    const parsed = nopt({

    ''json'': [Boolean]

    }, {''j'': ''--json''}, process.argv, 2);

    const cmd = parsed.argv.remain.shift();

    lounger.load(parsed).then(() => {

    lounger.cli[cmd]

    .apply(null, parsed.argv.remain)

    .catch(errorHandler);

    }).catch(errorHandler);

    ```


    `lounger.load` adds a `lounger.config.get` command and makes it available for
    us as part of the bootstrap:


    ```

    lounger.load = function load (opts) {

    return new Promise((resolve, reject) => {

    lounger.config = {

    get: (key) => {

    return opts[key];

    }

    };

    fs.readdir(__dirname, (err, files) => {

    ```


    We require `lounger.js` in our `isonline.js` file:


    ```

    const lounger = require(''./lounger.js'');

    ```


    As a last step, we check for the `json` flag in our `cli` function after we get
    the results back:


    ```

    isOnline(url).then((results) => {

    if (lounger.config.get(''json'')) {

    console.log(results);

    resolve(results);

    return;

    }

    ```


    That’s it! We can test the command:


    ```

    $ lounger isonline http://example.com

    http://example.com seems to be offline or no database server

    $ lounger isonline http://example.com --json

    { ''http://example.com'': false }

    $ lounger isonline http://example.com -j

    { ''http://example.com'': false }

    ```


    Our users can now pipe the output on their terminals into other consumers and
    process the results. We also added our first command-line flag to `lounger` to
    modify the execution of a command. Great!


    **Note**


    The code and tests for this section are in `sourcecode/json-flags`.'
