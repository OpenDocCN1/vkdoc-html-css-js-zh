    Command-line clients are everywhere. Almost everyone, at least in tech, is using
    them.


    Many successful command-line clients are available: the Linux project has Git,
    and the Node.js project has npm. We use some of them multiple times a day. Apache
    CouchDB recently got nmo (pronounced nemo ), a tool to manage the database cluster.
    We can learn a lot from successful command-line interfaces in order to write better
    command-line clients.


    When I started to become interested in command-line clients, I realized that the
    Web hosts a lot of discussions and information about writing APIs. The Web is
    full of tutorials that can teach you how to build APIs, especially REST APIs,
    but almost nothing can be found about writing good command-line interfaces (CLIs).
    This book explains what makes a good CLI. In the second part of the book, you
    will build a small command-line client to learn how to use Node.js to create great
    command-line clients that people love.


    The goal of the book is to show the principles for building a successful command-line
    client. The provided code should give you a good understanding of what is important
    to build successful command-line clients and how to implement them.


    Every section has its own code examples. Before you run the code, you have to
    run `npm install` in the folder provided for that section.


    You can download the code samples from [`https://github.com/theclibook/theclibook/archive/1.0.zip`](https://github.com/theclibook/theclibook/archive/1.0.zip)
    .


    I hope you enjoy the book.


    Acknowledgments


    I want to thank Michelle Phung and Klaus Trainer for their input on the very first
    version of this book.


    I’m also deeply indebted to Isaac Schlueter, who merged my first patch to npm.
    Without your support, I wouldn’t have dived into the art of great command-line
    interfaces. This is also the right place to thank Domenic Denicola for his impact
    on my work over the years.


    Big thanks to Louise Corrigan, Nancy Chen, Massimo Nardone, and James Markham
    from Apress for their kind feedback and support.


    I also have to thank my family: my parents, for the invaluable support they provided
    since I was born. My sister, for being a wonderful sister. I hope this book makes
    you proud!'
