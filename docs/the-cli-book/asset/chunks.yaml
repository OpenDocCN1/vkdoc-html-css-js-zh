  trans: '

    # 文档


    完成 `isonline` 命令的最后一步是添加合适的文档。我们将用 Markdown 编写这份文档。我们需要为 API 和 CLI 命令编写文档。API
    文档将位于 `doc/api` 目录，CLI 命令文档将位于 `doc/cli` 目录。我知道大多数程序员讨厌编写文档，但这能给我们带来很多好处：新用户能够更快地上手使用，我们也不会在用户有机会享受产品之前就失去他们。此外，通过一次性记录功能，我们能让自己的工作更轻松，这样人们就不必提交
    issue 或在聊天中询问如何使用某个命令了。这是一个双赢的局面。我们从 `doc/api/lounger-isonline.md` 开始，它描述了位于 `lounger.commands`
    的 API：


    ```

    lounger-isonline(3) -- 检查数据库是否在线

    ===========================================

    ```


    标题将我们的命令描述为 `lounger-isonline(3)`，然后添加了对该命令的简短说明。括号中的数字表示章节的类型。对于 man 手册页，库函数用
    `3` 表示，用户命令用 `1` 表示（剧透：我们的 CLI 命令就是一个用户命令）。


    下一部分描述了用户如何使用该命令：


    ```

    ## 概要

    lounger.commands.isonline(url)

    ```


    最后一部分是对命令工作原理的详细描述：


    ```

    ## 描述

    检查 CouchDB / PouchDB 数据库在当前网络上是否可用。

    url：

    url 必须是字符串，并且必须是使用 http 或 https 协议的 url。

    该命令返回一个 promise。该 promise 返回一个对象。对象的键是提供的 url，值是布尔类型。

    true 表示在线 CouchDB / PouchDB 节点。

    ```


    API 部分就这些了。现在我们可以为 `doc/cli/lounger-isonline.md` 添加文本内容：


    ```

    lounger-isonline(1) -- 检查数据库是否在线

    ===========================================

    lounger isonline  [--json]

    ## 描述

    ：

    检查数据库节点当前是否在线或可用。

    isonline 以人类可读的格式输出结果。通过传入 --json 标志，也支持 JSON 格式输出。

    ```


    通过 `lounger-isonline(1)` 中的小 `1`，我们表明这个帮助章节解释的是一个用户命令。`<url>` 中的尖括号向用户表明 `url`
    是一个必需参数；没有它，命令就无法工作。`[--json]` 的方括号表示 `--json` 标志是一个可选参数。准备好我们的第一批文档页面后，我们可以进入下一部分，将其渲染为各种输出格式。


    ## 渲染文档


    现在我们有了文档的源文件，可以开始使用 `marked` 和 `marked-man` 从源文件构建文档：


    ```

    $ npm i --save-dev marked marked-man

    ```


    Makefile 非常适合从源文件生成文档。遗憾的是，很难让 Makefile 在 Windows 上工作，所以我们将用 JavaScript 编写构建步骤。在
    lounger 的根目录中，我们创建 `build.js` 文件。此外，我们还需要安装 `mkdirp` 和 `rimraf`；`mkdirp` 以跨平台的方式提供了我们熟悉的
    Linux 命令 `mkdir -p` 的功能：它可以递归地创建目录和子目录。`rimraf` 模块则为 Node.js 平台带来了相当于 `rm -rf`
    的功能：递归删除目录。我们还将使用 `glob` 模块来匹配文档构建所需的所有文件：


    ```

    $ npm i --save-dev mkdirp rimraf glob

    ```


    我们的第一个函数将是一个用于清理一个全新的文件夹结构的函数，我们可以在其中保存 man 手册页：


    ```

    ''use strict'';

    const mkdirp = require(''mkdirp'');

    const rimraf = require(''rimraf'');

    const glob = require(''glob'');

    const path = require(''path'');

    function cleanUpMan () {

    rimraf.sync(__dirname + ''/man/'');

    // 重新创建目标目录

    mkdirp.sync(__dirname + ''/man/'');

    }

    ```


    我们需要找出哪些 Markdown 文件可用于编译。我们的文档源文件位于 `doc/api` 或 `doc/cli`。此外，我们在 `doc/website`
    中还有一些专门用于网站的内容（`index.html` 的内容）。


    `getSources` 函数帮助我们获取每种源文件类型（`api`、`doc`、`website`）对应的 Markdown 文件的完整路径。它返回匹配的
    glob 的相对路径，然后使用 `path.resolve` 函数以跨平台的方式获取完整路径。


    ```

    function getSources (type) {

    const files = glob.sync(''doc/'' + type + ''/*.md'');

    return files.map(file => path.resolve(file));

    }

    ```


    `sources` 对象为每种类型存储了找到的文件数组：


    ```

    const sources = {

    api: getSources(''api''),

    cli: getSources(''cli''),

    websiteIndex: getSources(''website''),

    };

    ```


    现在我们可以清理目标目录，并获取要转换的文件名列表。我们仍然需要找出转换后文件的目标路径和文件名。Man 手册页根据其描述的功能类型有不同的文件后缀。我们的
    CLI 手册页将获得后缀 `.1`（用户命令），API 函数将获得后缀 `.3`（库函数）。我们还必须将文件路径中的 `doc/cli/` 和 `doc/api/`
    替换为我们的目标目录 `man/`。我们需要特别注意路径分隔符。在 Windows 上，分隔符是 `\\` 而不是 `/`。这意味着路径 `doc/api`
    在 Windows 上会变成 `doc\\api`。好消息是，我们可以通过 Node.js 中的 `path.sep` 来访问当前平台的路径分隔符（该分隔符由核心模块
    `path` 提供）：


    ```

    function getTargetForManpages (currentFile, type) {

    let target;

    // 在 Unix 系统上设置 man 手册页的正确章节

    if (type === ''cli'') {

    target = currentFile.replace(/\.md$/, ''.1'');

    }

    if (type === ''api'') {

    target = currentFile.replace(/\.md$/, ''.3'');

    }

    // 将源目录替换为目标目录

    // 分别处理 Windows 路径（doc\\api）和 Unix 路径（doc/api）

    target = target

    .replace([''doc'', ''cli''].join(path.sep), ''man'')

    .replace([''doc'', ''api''].join(path.sep), ''man'');

    return target;

    }

    ```


    目前，我们只想从 `api` 和 `cli` 文件夹中的文档创建 man 手册页。


