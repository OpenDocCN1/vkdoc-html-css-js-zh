- "# 1. 什么是好的 CLI？\n\n在本章中，你将审视那些成功的命令行客户端以及它们的出色之处。这将帮助你理解用户面临的问题，从而帮助你在本书后续内容中，用\
  \ Node.js 构建更好的命令行客户端。\n\n## CLI 基础\n\n首先，我们来看看用户通常如何使用命令行界面。大多数时候，用户坐在键盘前，与终端交互。你应该为\
  \ CLI 使用简单且易于识别的命令。但遗憾的是，仅仅使用易于识别的命令还远远不够。\n\n如果你看一个糟糕的 CLI 示例，问题会更容易理解：\n\n```\n\
  $ my-example-cli -A -a 16 r foo.html\nerror: undefined is not a function\n```\n\n\
  在这个例子中，你必须输入晦涩难懂的命令，然后收到一条同样晦涩的错误信息。你可能会问：“`-A -a 16 r` 是什么意思？”，“为什么我收到了错误信息，是我用错了吗？”以及“这个错误信息是什么意思，我怎样才能完成我的任务？”\n\
  \n那么，是什么造就了一个好的 CLI？简而言之，一个成功的 CLI 就是能让用户成功且满意。\n\n让我们尝试使用以下三个原则来创建一个 CLI：\n\n*\
  \ 你永远不会在 CLI 中卡住。\n* 它既简单又支持高级用户。\n* 你可以用它做很多事情。\n\n## 永不卡壳\n\n没人喜欢堵在路上，卡在车流里，每分钟只能挪动几英尺。我们总想以最快、最舒适的方式到达目的地。这同样适用于你的用户：当工具成为他们前进的阻碍时，他们会非常不高兴。他们只想完成自己的任务。\n\
  \n“永不卡壳”意味着你应该始终为用户提供解决任务的方法。一个命令绝不应该是一条死胡同。此外，你应该避免命令行工具中任何可能引起摩擦的地方。\n\n为了更好地说明这一点，让我们来看看\
  \ Git 和 npm——两个非常成功的命令行工具。\n\n下面的例子使用了 Git：\n\n```\n$ git poll\ngit: 'poll' 不是一个\
  \ git 命令。参见 'git --help'。\n你是不是想输入：\npull\n```\n\n在这个例子中，我输错了命令，将 `pull` 输成了 `poll`。幸运的是，Git\
  \ 提供了一种让我继续工作并完成任务的途径。\n\nGit 基本上在说：“嘿，Robert，看起来你输错了命令，但如果你输入 `git --help`，你可以看到所有现有命令的列表。而且，嘿，看起来你输入了\
  \ `git poll`；你是不是想输入 `git pull`？”\n\nnpm，另一个成功的 CLI 客户端，也提供了相同的理念：\n\n```\n$ npm\
  \ ragrragr\n用法: npm <command>\n其中 <command> 可以是以下之一：\naccess, add-user, adduser,\
  \ apihelp, author, bin, bugs, c,\ncache, completion, config, ddp, dedupe, deprecate,\
  \ dist-tag,\ndist-tags, docs, edit, explore, faq, find, find-dupes, get,\nhelp,\
  \ help-search, home, i, info, init, install, issues, la,\nlink, list, ll, ln, login,\
  \ logout, ls, outdated, owner,\npack, prefix, prune, publish, r, rb, rebuild, remove,\
  \ repo,\nrestart, rm, root, run-script, s, se, search, set, show,\nshrinkwrap, star,\
  \ stars, start, stop, t, tag, test, tst, un,\nuninstall, unlink, unpublish, unstar,\
  \ up, update, upgrade,\nv, verison, version, view, whoami\n\nnpm -h     获取 <command>\
  \ 的快速帮助\nnpm -l     显示完整用法信息\nnpm faq    常见问题解答\nnpm help <term>  搜索关于 <term> 的帮助\n\
  npm help npm     概览\n\n配置以 ini 格式文件指定：\n/Users/robert/.npmrc\n或在命令行通过以下方式指定：npm\
  \ <command> —key value\n配置信息可通过以下方式查看：npm help config\n\nnpm@5.5.1 /Users/robert/.nvm/versions/node/v9.1.0/lib/node_modules/npm\n\
  ```\n\n在这个例子中，我试图向 npm 输入垃圾信息，因此 npm 提供了一些友好的帮助：“嘿，Robert，我不知道那个命令，但这里列出了所有可用的命令。你可以像这样使用它们，并通过输入\
  \ `npm help <command>` 来获取关于它们的帮助。”\n\n像 Git 一样，npm 立即提供帮助，让我能够完成任务，即使我完全不知道如何使用\
  \ npm。\n\n\n\n### 还是不知所措？手册页来帮忙\n\n如果还是需要帮助怎么办？也许我想在尝试任何命令之前先获取帮助。事实证明，在 Unix 或\
  \ Linux 上查找文档有一种可靠的方法：手册页，也称为 man 页，如图 1-1 所示。\n\n![A456043_1_En_1_Fig1_HTML.jpg](img/A456043_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1\n\n`git pull` 的手册页\n\n手册页相当不错，因为你无需联网就能打开它们。你也可以停留在同一个终端窗口中阅读，无需切换到另一个窗口（比如浏览器）。\n\
  \n但有些用户不知道手册页，或者不喜欢使用它们。其他人则可能使用 Windows，它本身无法处理手册页，因此 Git 和 `npm` 将其文档以网页形式提供，如图\
  \ 1-2 所示。\n\n![A456043_1_En_1_Fig2_HTML.jpg](img/A456043_1_En_1_Fig2_HTML.jpg)\n\
  \n图 1-2\n\nGit 项目的文档网站\n\nGit 和 `npm` 都使用了一个技巧：它们一次性编写文档（例如，使用 Markdown 或 AsciiDoc），并将此初始源码作为基础。然后，它们将这些基础文档转换成不同的格式（例如，转换成\
  \ HTML）。\n\n如果你查看 Git 和 `npm` 的在线手册页，你会注意到它们的网站用页眉和侧边栏将内容框起来。图 1-3 和图 1-4 用 `npm\
  \ publish` 命令的不同版本说明了这一点。\n\n![A456043_1_En_1_Fig4_HTML.jpg](img/A456043_1_En_1_Fig4_HTML.jpg)\n\
  \n图 1-4\n\n`npm publish` 的文档网站\n\n![A456043_1_En_1_Fig3_HTML.jpg](img/A456043_1_En_1_Fig3_HTML.jpg)\n\
  \n图 1-3\n\n`npm publish` 的手册页\n\n## 错误处理\n\n有时事情会出大错。让我们再看看我之前那个糟糕 CLI 的例子：\n\n\
  ```\n$ my-example-cli -A -a 16 r foo.py\nevents.js:85\nthrow er; // Unhandled 'error'\
  \ event\n^\nError: ENOENT, open 'cli.js'\nat Error (native)\n```\n\n在这种情况中，你得到的只是一个没什么上下文的堆栈跟踪。对大多数人来说，这些堆栈跟踪看起来很晦涩，尤其是对于那些不是每天编写\
  \ Node.js 的人来说。\n\n而且情况更糟：你根本无法判断你是遇到了 CLI 的 bug 还是用错了方式。想象一下你的用户处于这种境地。看着那个小小的终端，完全不知道该怎么办，他们会感到极其挫败。\n\
  \n`nmo` 支持的一个特性是使用错误。以下是它的表现：\n\n```\n$ nmo cluster dsf\nERR! 用法:\nnmo cluster get\
  \ [], []\nnmo cluster add , , \nnmo cluster join \n```\n\n如果用户尝试以错误方式使用命令，`nmo`\
  \ 会立即指示如何正确使用该命令以完成任务。无需打开文档。\n\n如果 `nmo` 崩溃，它也会向用户显示堆栈跟踪：\n\n```\n$ nmo cluster\
  \ join anemone\nERR! df is not defined\nERR! ReferenceError: df is not defined\n\
  ERR!     at /Users/robert/apache/nmo/lib/cluster.js:84:5\nERR!     at cli (/Users/robert/apache/nmo/lib/cluster.js:68:27)\n\
  ERR!     at /Users/robert/apache/nmo/bin/nmo-cli.js:32:6\nERR!\nERR! nmo: 1.0.1\
  \ node: v9.1.0\nERR! 请在此日志在 https://github.com/robertkowalski/nmo/issues 上创建一个 issue\n\
  ```\n\n和 `npm` 一样，`nmo` 会将当前的 `nmo` 和 Node.js 版本添加到堆栈跟踪中。我们还要求用户复制堆栈跟踪，并创建一个包含该堆栈跟踪的\
  \ issue。\n\n这些报告使得团队能通过查看堆栈跟踪轻松地识别 bug，解决它，并发布新版本的 `nmo`。\n\n再次强调，用户不会卡住。用户会得到帮助来完成任务，在最坏的情况下，你也可以通过\
  \ issue 跟踪器帮助用户。\n\n## 支持高级用户\n\n高级用户对你的 CLI 很重要。他们是会谈论你的 CLI 并通过口口相传提高其整体采用率的用户。以下小节介绍了改善与高级用户交互的方法。\n\
  \n### 快捷方式\n\n大多数高级用户每天会多次使用你的 CLI。支持他们的一种简单方法是提供快捷方式。\n\n`npm` 有很多快捷方式。例如，`npm\
  \ i` 是 `npm install` 的简写。Git 允许你在 `.gitconfig` 文件中定义自己的快捷方式。例如，我使用 `git co` 作为 `git\
  \ checkout` 的快捷方式。\n\n### 脚本化\n\n在某个时候，你的命令行客户端会变得非常成功；人们会喜欢它，并开始创造性地使用它。CLI 会突然在\
  \ Jenkins 上运行，作为 Chef 或 Puppet 运行中部署的一部分，或者你的用户会以你从未想象过的方式使用你的 CLI！\n\n自动化进程迟早也会使用你的\
  \ CLI。为了使你的 CLI 更加成功，支持脚本化是个好主意。\n\n#### 退出码\n\n操作系统使用退出码来指示命令是否成功。如果你最近执行的命令成功，你将得到一个\
  \ `0`。得到 `1` 则表示一般性错误。\n\n退出码对于那些想将你的命令行客户端包装在 bash 脚本中的用户很有用。\n\n以下是一个示例：\n\n```\n\
  $ git poll\ngit: 'poll' is not a git command. See 'git --help'.\nDid you mean this?\n\
  pull\n$ echo $?\n```\n\nGit 通知你出了问题；你得到返回的退出码是 `1`。有了正确的退出码，每个 bash 脚本的编写者都可以处理不成功的命令。\n\
  \n#### JSON 输出\n\n在 `nmo` 中，每个返回信息的命令都支持 JSON 格式的输出：\n\n```\n$ nmo cluster get --json\n\
  { anemone:\n{ node1: 'http://node1.local',\nnode2: 'http://node2.local',\nnode3:\
  \ 'http://node3.local' } }\n```\n\n支持 JSON 使用户能够轻松地使用他们选择的编程语言处理数据，因为大多数语言都支持 JSON。用户可以在语言\
  \ x 中生成一个子进程，并监听 `stdout` 以获取输出。他们也可以直接将输出通过管道输送给 shell 上的消费者：\n\n```\n$ nmo cluster\
  \ get --json | consumer.py\n```\n\nJSON 输出给用户带来了很大的灵活性。\n\n#### 命令行客户端中的 API\n\n\
  另一个概念可以使脚本化变得更容易。我称之为命令行客户端中的 API：\n\n```javascript\nconst nmo = require('nmo');\n\
  nmo.load({}).then(() => {\nnmo.commands.cluster\n.get('testcluster', 'node1@127.0.01')\n\
  .then((res) => {\nconsole.log(res);\n});\n});\n```\n\n在 `nmo` 中，每个命令都暴露在 `nmo.commands`\
  \ 上。如果用户想将 `nmo` 作为其 Node.js 脚本的一部分使用，他们可以引入它。JavaScript API 的文档与 CLI 的文档类似。\n\n\
  JavaScript API 使用户能够将 `nmo` 嵌入到他们的 Node.js 脚本中，以处理复杂流程。他们甚至可以派生 `nmo` 并将其嵌入到自己的命令行客户端中。\n\
  \n## 配置\n\n高级用户喜欢配置。因为他们经常使用命令行客户端，可能一天好几次，所以他们希望某些功能默认启用也就不足为奇了。但在少数情况下，他们不想要默认设置。\n\
  \n`npm` 在命令行上支持选项参数：\n\n```\n$ npm i hapi --registry=https://reg.example.org\n/Users/robert\n\
  └── hapi@9.0.4\n```\n\n此命令从 `https://reg.example.org` 的私有注册表下载包 `hapi`。\n\n但我也可以将此私有注册表设置为新的默认注册表：\n\
  \n```\n$ npm config set registry https://reg.example.org\n```\n\n`npm` 将新的注册表写入配置：\n\
  \n```\n$ cat ~/.npmrc\nloglevel=http\nregistry=https://reg.example.org\n```\n\n\
  下次我尝试安装包时，`npm` 将使用我的新默认注册表 `https://reg.example.org`：\n\n```\n$ npm i hapi\n```\n\
  \n如果我不想使用这个新的默认注册表，我可以向 CLI 传递一个参数，它就会仅针对此次调用使用备用注册表：\n\n```\n$ npm i hapi --registry=https://registry.npmjs.org\n\
  /Users/robert\n└── hapi@9.0.4\n```\n\n这意味着我们在 `npm` 中可以在默认配置和命令行参数之间进行选择，这种组合非常强大。\n\
  \n\n\n## 你可以用它做这么多事情！\n\n让我们来看最后一条原则：**你**可以用 CLI 做很多事情。每当我需要多次执行某项任务，并且该任务属于命令行客户端的领域时，我就会把它添加为一个新命令。这种习惯会变成双赢的局面：你减少了无聊的任务，用户也很高兴，因为他们获得了新功能，同样也减少了重复劳动。这会让你的命令行客户端更加成功。\n\
  \n让我们以`npm`为例。在`npm`早期，它没有列出过时包的命令。你必须对所有包进行完整更新，然后检查哪些包更新了，哪些没有。这个命令的添加解决了其作者的一个痛点，同时也解决了所有`npm`用户的痛点。遗憾的是，发现常见的痛点可能相当困难，尤其是当你有多个团队或与很多人合作时。此外，在长期研究同一个主题后，我们大多数人都容易产生组织性盲点。但如果你能识别出一项可以为你和用户自动化的任务，你将获得巨大的回报！\n\
  \n## 总结\n\n命令行界面的大多数问题都与技术问题无关。你的用户应该始终清楚下一步该怎么做，尤其是在出现问题的时候。观察首次使用你 CLI 的人，可以帮助你获得新的改进思路。拥有一个坚实的基础对于吸引第一批用户至关重要。\n\
  \n一旦有了可靠的用户体验，快捷方式等新增功能会让你的 CLI 更有趣。尤其是高级用户，他们会非常喜欢这些功能。\n\n"
- '# 2. 使用 Node.js 编写数据库管理工具


  在本章中，我们将编写一个名为`lounger`的数据库管理工具，并遵循构建优秀 CLI 的原则。每个章节的代码都可以在 [`github.com/theclibook/theclibook/tree/1.0/sourcecode`](https://github.com/theclibook/theclibook/tree/1.0/sourcecode)
  获取，你可以通过每章末尾的链接访问。主仓库地址是 [`github.com/theclibook/theclibook`](https://github.com/theclibook/theclibook)。如果你想运行代码，别忘了在你想要测试的章节文件夹中运行`npm
  install`。代码还包含一个测试套件，你可以使用`npm test`运行。


  我们将从开发环境的设置开始。我们将安装并启动一个小的 PouchDB 实例。然后我们将创建第一个命令。为了使命令行工具可扩展，我们还将添加一个引导部分。通过正确的引导，我们将加载随时间添加的每个命令和配置。本章将以该工具的第一个可运行版本结束，届时我们可以在命令行上执行它。


  ## 为什么选择 Node.js？


  有时会有人问我为什么用 Node.js 编写命令行客户端。对我来说，主要原因如下：


  *   拥有各种类型模块的庞大生态系统

  *   快速的开发速度

  *   编写 JavaScript 很有趣！


  对我来说，这些原因使得 Node.js 成为编写命令行客户端的完美平台。


  ## 设置数据库服务器


  我们的第一步是搞定数据库服务器。这涉及到设置过程、PouchDB 安装以及一些故障排除。


  ### 环境设置


  我们将使用 ES6/7 编写命令行客户端，这为 JavaScript 带来了许多改进。为了使用它，我们需要从 [`nodejs.org`](https://nodejs.org)
  安装 Node 8.x。如果你想支持更老的 Node.js 版本，我建议使用 Babel 转译器将代码转译为 ES5 兼容的代码。你可以从 [`babeljs.io/`](https://babeljs.io/)
  获取 Babel。


  我们要编写的工具将是一个用于 CouchDB/PouchDB 的小型数据库管理工具。有多种方法可以启动并运行一个开发数据库服务器。


  一种方法是为你的操作系统安装 Erlang 和 CouchDB。你可以从 [`couchdb.apache.org`](http://couchdb.apache.org)
  下载官方包，并且许多 Linux 发行版的软件仓库中也包含了 CouchDB。


  我认为最简单的方法是使用本书源代码中提供的 PouchDB 服务器，或者在 [`cloudant.com`](https://cloudant.com) 获取一个
  CouchDB 实例，该服务在你达到限制之前是免费的。


  ### 使用 PouchDB 数据库服务器


  PouchDB 数据库服务器位于`sourcecode/database`目录下。要使用它，我们必须安装所需的依赖项：


  ```

  $ cd sourcecode/database

  $ npm install

  ```


  要启动数据库，只需运行以下命令：


  ```

  $ npm run start

  ```


  现在，我们可以通过 HTTP 与数据库服务器交互，因为 CouchDB 和 PouchDB 都是具有 HTTP API 的数据库。如果你不知道如何获取`curl`，请查看下面的“故障排除”部分。


  ```

  $ curl -XGET http://127.0.0.1:5984/

  {"express-pouchdb":"Welcome!","version":"1.0.1","vendor":{"name":"PouchDB authors","version":"1.0.1"},"uuid":"4fad2c01-ba32-4249-8278-8786e877c397"}

  ```


  让我们创建一个名为`people`的数据库：


  ```

  $ curl -XPUT http://127.0.0.1:5984/people

  {"ok":true}

  ```


  现在我们可以向`people`数据库插入文档了：


  ```

  $ curl -XPOST http://127.0.0.1:5984/people -d ''{"name": "Rocko Artischocko", \

  "likes": ["Burritos", "Node.js", "Music"] }'' -H ''Content-Type: application/json''

  {"ok":true,"id":"21b5ad83-0ad6-47c7-86f8d9636113160a","rev":"1-411894affa038a6fd7a164e1bfd84146"}

  ```


  使用这个 ID，我们可以从数据库中检索文档：


  ```

  $ curl -XGET http://127.0.0.1:5984/people/21b5ad83-0ad6-47c7-86f8-d9636113160a

  {"name":"Rocko Artischocko","likes":["Burritos","Node.js","Music"],"_id":"21b5ad83-0ad6-47c7-86f8-d9636113160a","_rev":"1-411894affa038a6fd7a164e1bfd84146"}

  ```


  太好了！你的数据库应该已经启动并运行了！如果遇到问题，下一节会帮助你。


  ### 故障排除


  有时数据库服务器的安装并不像我们期望的那样顺利。对于 Windows 和 Mac 用户，本节将介绍如何获取缺失的`curl`程序。对于 Linux 用户，本节将解决
  Linux 系统上与文件监视器相关的一个典型错误。


  #### 获取 curl


  `curl`是一个用于 HTTP 请求的命令行客户端。它适用于所有主流操作系统。macOS 用户可以使用`brew`安装它。对于 Windows，可以在 [`curl.haxx.se/download.html`](http://curl.haxx.se/download.html)
  获取构建版本。




  ### 解决文件监听器错误


  在 Linux 系统上，我遇到了一个错误，原因是我的用户已监听了过多文件：


  ```

  $ npm run start

  > theclibook-database@1.0.0 start /home/rocko/clibook/sourcecode/database

  > pouchdb-server --in-memory

  fs.js:1236

  throw error;

  ^

  Error: watch ./log.txt ENOSPC

  at exports._errnoException (util.js:874:11)

  at FSWatcher.start (fs.js:1234:19)

  at Object.fs.watch (fs.js:1262:11)

  at Tail.watch (/home/rocko/clibook/sourcecode/database/node_modules/pouchdb-server/node_modules/tail/tail.js:83:32)

  at new Tail (/home/rocko/clibook/sourcecode/database/node_modules/pouchdb-server/node_modules/tail/tail.js:72:10)

  at /home/rocko/clibook/sourcecode/database/node_modules/pouchdb-server/lib/logging.js:69:20

  at FSReqWrap.cb [as oncomplete] (fs.js:212:19)

  npm ERR! Linux 3.13.0-71-generic

  npm ERR! argv "/home/rocko/.nvm/versions/node/v4.2.3/bin/node" "/home/rocko/.nvm/versions/node/v4.2.3/bin/npm"
  "run" "start"

  npm ERR! node v4.2.3

  npm ERR! npm  v3.5.1

  npm ERR! code ELIFECYCLE

  npm ERR! theclibook-database@1.0.0 start: `pouchdb-server --in-memory`

  npm ERR! Exit status 1

  npm ERR!

  npm ERR! Failed at the theclibook-database@1.0.0 start script ''pouchdb-server --in-memory''.

  npm ERR! Make sure you have the latest version of node.js and npm installed.

  npm ERR! If you do, this is most likely a problem with the theclibook-database package,

  npm ERR! not with npm itself.

  npm ERR! Tell the author that this fails on your system:

  npm ERR!     pouchdb-server --in-memory

  npm ERR! You can get information on how to open an issue for this project with:

  npm ERR!     npm bugs theclibook-database

  npm ERR! Or if that isn''t available, you can get their info via:

  npm ERR!     npm owner ls theclibook-database

  npm ERR! There is likely additional logging output above.

  npm ERR! Please include the following file with any support request:

  npm ERR!     /home/rocko/clibook/sourcecode/database/npm-debug.log

  ```


  我通过以下命令提高文件限制解决了这个问题：


  ```

  $ echo fs.inotify.max_user_watches=524288 | sudo tee -a /etc/sysctl.conf && sudo
  sysctl -p

  ```


  希望现在你的数据库服务器能正常运行了。下一节我们将重点开发命令行工具。


  ## 执行简单的状态检查


  我们的第一个命令将检查数据库是否已启动并正在运行。用户可以使用此命令查看数据库服务器是否在运行，而我们可以在需要运行数据库的命令内部使用此命令。


  检查数据库服务器是否在线的命令如下所示：


  ```

  $ lounger isonline http://192.168.0.1:5984

  http://192.168.0.1:5984 is up and running

  ```


  其 API 如下所示：


  ```

  $ lounger.commands.isonline(''http://example.com'')

  ```


  将计划执行的命令写下来通常有助于形成直观感受。确定命令名称和签名后，便可开始开发。在这种情况下，我们必须从头开始创建工具。


  ### 从零开始


  首先，我们必须创建一个 `package.json` 文件。幸运的是，`npm` 提供了一个便捷助手来创建这些文件。你可以在图 2-1 中看到完成的流程。


  ![A456043_1_En_2_Fig1_HTML.jpg](img/A456043_1_En_2_Fig1_HTML.jpg)


  图 2-1


  使用`npm init`助手创建`package.json`文件


  ```

  $ npm init

  ```


  然后我们只需回答 `npm` 提出的问题。


  此外，我们还需创建三个文件夹：`test`、`lib` 和 `bin`。`test` 文件夹将包含我们的单元测试和集成测试，`lib` 文件夹将包含命令行客户端的核心代码，而
  `bin` 文件夹将包含一个小型包装器，用于启动客户端的核心。


  当我们访问 `http://localhost:5984` 的根 URL 时，`CouchDB` 和 `PouchDB` 都会返回一条欢迎消息。


  ```

  $ curl localhost:5984

  ```


  `CouchDB` 返回以下内容：


  ```

  {"couchdb":"Welcome","uuid":"17ed4b2d8923975cf658e20e219faf95","version":"1.5.0","vendor":{"version":"14.04","name":"Ubuntu"}}

  ```


  `PouchDB` 返回以下内容：


  ```

  {"express-pouchdb":"Welcome!","version":"1.0.1","vendor":{"name":"PouchDB authors","version":"1.0.1"},"uuid":"4fad2c01-ba32-4249-8278-8786e877c397"}

  ```


  我们将利用此行为来检查数据库是否在线。


  ### 强大的生态系统


  如前所述，Node.js 拥有强大的生态系统。它有许多久经考验的模块可以帮助我们完成任务。


  对于状态检查，我们将使用 `request` 模块来处理 HTTP 请求。`mocha` 将运行我们的测试套件，而 `nock` 将帮助我们模拟 HTTP 响应，而无需为测试套件启动数据库实例。


  `--save` 和 `--save-dev` 参数会将包分别添加到 `package.json` 文件的 `dependencies` 和 `devDependencies`
  部分。开发依赖仅在开发时需要，在生产环境中运行包时不需要：


  ```

  $ npm i --save request

  $ npm i --save-dev mocha nock

  ```


  运行这些命令后，我们应该拥有目前所需的一切。


  **选择你喜欢的工具**


  Node.js 有许多优秀的测试运行器。`mocha` 的一些替代方案包括 npm 模块 `tap`、`tape` 或 `lab`。


  我的 `package.json` 文件现在看起来像这样：


  ```

  {

  "name": "lounger",

  "version": "1.0.0",

  "description": "a tool for couchdb/pouchdb administration",

  "main": "lib/lounger.js",

  "directories": {

  "test": "test"

  },

  "dependencies": {

  "request": "².67.0"

  },

  "devDependencies": {

  "mocha": "².3.4",

  "nock": "⁵.2.1"

  },

  "scripts": {

  "test": "mocha -R spec"

  },

  "keywords": [

  "couchdb",

  "pouchdb"

  ],

  "author": "Robert Kowalski "

  }

  ```


  测试驱动开发等各种开发技术超出了本书的范围。但如果你真的热衷于 TDD，可以在实现实际代码之前，使用 `mocha` 编写会失败的测试。一些建议：


  * 检测数据库是否在线。

  * 检测离线数据库。

  * 检测某个服务是否在线，但并非 `CouchDB`/`PouchDB` 数据库。

  * 确保只接受有效的 URL。


  使用 `mocha` 和 ES6 编写，我们在 `test/isonline.js` 中得到了一些会失败的测试：


  ```

  ''use strict'';

  const assert = require(''assert'');

  const nock = require(''nock'');

  describe(''isonline'', () => {

  it(''detects if the database is online'', () => {

  assert.equal(''foo'', ''to implement'');

  });

  it(''detects offline databases'', () => {

  assert.equal(''foo'', ''to implement'');

  });

  it(''detects if something is online, but not a CouchDB/PouchDB'', () => {

  assert.equal(''foo'', ''to implement'');

  });

  it(''just accepts valid urls'', () => {

  assert.equal(''foo'', ''to implement'');

  });

  });

  ```


  要运行测试套件，我们必须在终端中输入 `npm test` 或 `npm t`。


  **注意**


  本节代码位于 `sourcecode/client-boilerplate`。




  ## `isonline` 命令的内部原理


  让我们创建并编辑 `lib/isonline.js` 文件。该文件名非常重要，因为在之后的客户端启动引导过程中会用到它。第一步，我们需要引入依赖项 `request`：


  ```javascript

  ''use strict'';

  const request = require(''request'');

  ```


  为了发起请求，我们创建 `isOnline` 函数，该函数将接收一个 URL 并发送请求：


  ```javascript

  function isOnline (url) {

  return new Promise((resolve, reject) => {

  request({

  uri: url,

  json: true

  }, (err, res, body) => {

  ```


  如果在指定 URL 上根本没有监听的 HTTP 服务，我们用一个包含该 URL 作为键、`false` 作为值的对象来 resolve 这个 promise：


  ```javascript

  if (err && (err.code === ''ECONNREFUSED'' || err.code === ''ENOTFOUND'')) {

  return resolve({[url]: false});

  }

  ```


  对于其他所有错误，我们 reject 这个 promise：


  ```javascript

  // 任何其他错误

  if (err) {

  return reject(err);

  }

  ```


  如果我们从 CouchDB 或 PouchDB 收到 `Welcome` 响应，就可以安全地假定数据库服务器是在线的：


  ```javascript

  // 也许我们收到了 CouchDB / PouchDB 的欢迎信息

  const isDatabase = (body.couchdb === ''Welcome'' ||

  body[''express-pouchdb''] === ''Welcome!'');

  return resolve({[url]: isDatabase});

  ```


  最后一步，我们需要导出该函数：


  ```javascript

  exports.api = isOnline;

  ```


  以下是完整的函数代码：


  ```javascript

  function isOnline (url) {

  return new Promise((resolve, reject) => {

  request({

  uri: url,

  json: true

  }, (err, res, body) => {

  // 数据库宕机

  if (err && (err.code === ''ECONNREFUSED'' || err.code === ''ENOTFOUND'')) {

  return resolve({[url]: false});

  }

  // 任何其他错误

  if (err) {

  return reject(err);

  }

  // 也许我们收到了 CouchDB / PouchDB 的欢迎信息

  const isDatabase = (body.couchdb === ''Welcome'' ||

  body[''express-pouchdb''] === ''Welcome!'');

  return resolve({[url]: isDatabase});

  });

  });

  }

  exports.api = isOnline;

  ```


  我们可以在 Node.js REPL 上测试这个函数：


  ```

  $ node

  > const isonline = require(''./lib/isonline.js'').api;

  undefined

  > isonline(''http://example.com'').then(console.log);

  Promise {  }

  > { ''http://example.com'': false }

  > isonline(''http://doesnotexist.example.com'').then(console.log);

  Promise {  }

  > { ''http://doesnotexist.example.com'': false }

  > isonline(''http://localhost:5984'').then(console.log);

  Promise {  }

  > { ''http://localhost:5984'': true }

  ```


  恭喜！我们刚刚完成了第一部分，也就是新命令的 API！


  ### CLI 部分


  如果这就是最终用户必须使用的命令行界面，那将会令人沮丧。输出不易阅读，功能也不易理解。API 函数不会向控制台打印内容，这对于 API 来说非常完美，但对于 CLI
  来说并不理想。运行 API 函数甚至需要一些 Node.js 知识。所以，让我们为 `isonline.js` 文件添加一个漂亮的 CLI 函数，并将其导出为
  `cli`：


  ```javascript

  function cli (url) {

  return new Promise((resolve, reject) => {

  });

  }

  exports.cli = cli;

  ```


  像我们的其他函数一样，这个函数返回一个 promise。然后我们调用 `isOnline`，并将结果打印到 `stdout`，供在终端上使用命令行客户端的用户查看：


  ```javascript

  isOnline(url).then((res) => {

  Object.keys(results).forEach((entry) => {

  let msg = ''seems to be offline'';

  if (results[entry]) {

  msg = ''seems to be online'';

  }

  // 为终端用户打印到 stdout

  console.log(entry, msg);

  resolve(results);

  });

  });

  ```


  完整代码：


  ```javascript

  function cli (url) {

  return new Promise((resolve, reject) => {

  isOnline(url).then((res) => {

  Object.keys(results).forEach((entry) => {

  let msg = ''seems to be offline'';

  if (results[entry]) {

  msg = ''seems to be online'';

  }

  // 为终端用户打印到 stdout

  console.log(entry, msg);

  resolve(results);

  });

  });

  });

  }

  exports.cli = cli;

  ```


  需要注意的是，我们将 API 的命令导出为 `exports.api`，而将 CLI 命令导出在 `cli` 属性下。


  **注意：** 本节代码可在 `sourcecode/the-status-check` 中找到。


  ## 启动工具


  Lounger 仍然需要使其能够在命令行上使用的代码。它还缺少一种方便的方式来运行我们的 API 命令。目前，我们只有一个命令，但很快我们会添加更多。为了让所有命令易于使用，我们必须将所有可用的命令加载到一个命名空间中。`lib/lounger.js`
  文件将负责处理这件事。


  `lounger.js` 文件是我们命令行客户端的核心。我们引入 `fs` 模块，因为需要列出可能包含命令的文件：


  ```javascript

  ''use strict'';

  const fs = require(''fs'');

  ```


  我们还引入了 `package.json`，并将模块的当前版本作为 lounger 对象的一个属性公开，这在以后会派上用场：


  ```javascript

  const pkg = require(''../package.json'');

  ```




  ### 确保 Lounger 已加载


  确保 `lounger` 已正确引导是合理的做法，尤其是在编程环境中使用时。为追踪异步引导状态，我们将 `lounger.loaded` 设置为 `false`：


  ```

  const lounger = { loaded: false };

  ```


  同时，我们还存储了模块的当前版本：


  ```

  lounger.version = pkg.version;

  ```


  我们需要一个位置来存储 API 和 CLI 命令。由于引导过程是异步的，如果有人试图在引导完成前访问已暴露的函数，我们将抛出错误：


  ```

  const api = {}, cli = {};

  Object.defineProperty(lounger, ''commands'', {

  get: () => {

  if (lounger.loaded === false) {

  throw new Error(''请先运行 lounger.load'');

  }

  return api;

  }

  });

  Object.defineProperty(lounger, ''cli'', {

  get: () => {

  if (lounger.loaded === false) {

  throw new Error(''请先运行 lounger.load'');

  }

  return cli;

  }

  });

  ```


  当 `lounger.loaded` 为 `false`，并且我们尝试访问 `lounger.cli` 和 `lounger.api` 上的属性时，`Object.defineProperty`
  的自定义 getter 会抛出错误。


  该机制同样适用于 Node.js REPL 中的自动补全功能（当你按下 Tab 键尝试补全时）。试试看吧！


  文件的最后部分是实际的引导过程，在此过程中，我们获取 `lib` 文件夹中的所有文件，如果它们是 JavaScript 文件且不是当前正在操作的文件 `lounger.js`，则对其执行
  require 操作。


  引导 `lounger` 的函数名为 `lounger.load`。此处我们使用了具名函数。在应用程序崩溃时，具名函数在堆栈跟踪中会很有帮助：


  ```

  lounger.load = function load () {

  return new Promise((resolve, reject) => {

  });

  };

  ```


  `fs.readdir` 函数将列出目录中的所有文件。我们遍历 `fs.readdir` 返回的文件列表：


  ```

  lounger.load = function load () {

  return new Promise((resolve, reject) => {

  fs.readdir(__dirname, (err, files) => {

  files.forEach((file) => {

  });

  });

  });

  };

  ```


  如果文件不是 JS 文件，或者就是 `lounger.js` 本身，我们通过提前返回来忽略它：


  ```

  if (!/\.js$/.test(file) || file === ''lounger.js'') {

  return;

  }

  ```


  在其他所有情况下，我们假设找到了一条适用于 `lounger` 的命令。我们从文件名的 `.js` 之前提取所有内容，并将其保存为 `cmd`：


  ```

  const cmd = file.match(/(.*)\.js$/)[1];

  ```


  我们 require 该文件：


  ```

  const mod = require(''./'' + file);

  ```


  如果文件将 API 命令导出为 `api` 属性，我们将其暴露在 `lounger.commands` 上。所有 CLI 命令都可在 `lounger.cli`
  上获取：


  ```

  if (mod.cli) {

  cli[cmd] = mod.cli;

  }

  if (mod.api) {

  api[cmd] = mod.api;

  }

  ```


  在 `forEach` 循环完成且所有命令都加载完毕后，我们可以将 `lounger.loaded` 设置为 `true`。这将阻止我们之前添加的检查抛出错误：


  ```

  lounger.loaded = true;

  ```


  最后一步，我们 resolve 这个 promise：


  ```

  resolve(lounger);

  ```


  完整的 `lounger.load` 函数如下所示：


  ```

  lounger.load = function load () {

  return new Promise((resolve, reject) => {

  fs.readdir(__dirname, (err, files) => {

  files.forEach((file) => {

  if (!/\.js$/.test(file) || file === ''lounger.js'') {

  return;

  }

  const cmd = file.match(/(.*)\.js$/)[1];

  const mod = require(''./'' + file);

  if (mod.cli) {

  cli[cmd] = mod.cli;

  }

  if (mod.api) {

  api[cmd] = mod.api;

  }

  });

  lounger.loaded = true;

  resolve(lounger);

  });

  });

  };

  ```


  我们差点忘记导出 `lounger`，因此在文件末尾添加了 `module.exports`：


  ```

  module.exports = lounger;

  ```


  我们现在就可以使用这段代码了：


  ```

  $ node

  > const lounger = require(''./lib/lounger.js''); lounger.load().then(console.log);

  Promise {  }

  > { loaded: true, version: ''1.0.0'', load: [Function: load] }

  > lounger.commands

  { isonline: [Function: isOnline] }

  > lounger.cli

  { isonline: [Function: cli] }

  > lounger.commands.isonline(''http://localhost:5984'').then(console.log);

  Promise {  }

  > { ''http://localhost:5984'': true }

  ```


  本节的最后一步是让 `lounger` 能在终端本身上使用。为此，我们已经创建了 `bin` 文件夹。现在是将名为 `lounger-cli.js` 的文件放入
  `bin` 的时候了！


  ### 一种从命令行交互的优雅方式


  npm 有一个很好的特性：如果我们把一个 JavaScript 文件添加到模块的 `package.json` 文件中名为 `bin` 的属性里，当我们全局安装这个包时（使用
  `npm install -g lounger`），npm 会将其添加到我们的 `PATH` 环境变量中。


  如果我们定义了 `bin` 属性并且 `lounger` 已全局安装，它将以 `lounger`（即我们的包名）的形式在终端上可用——非常方便！为了通知用户某个包是设计为全局安装的，我们可以在
  `package.json` 中添加 `preferGlobal: true`（参见 [`docs.npmjs.com/files/package.json#preferglobal`](https://docs.npmjs.com/files/package.json#preferglobal)）。


  为了启用这两个特性，我们在 `package.json` 中添加以下两行：


  ```

  "bin": "./bin/lounger-cli",

  "preferGlobal": true,

  ```


  此外，如果我们在 Linux 或 macOS 上运行，还必须使 `bin/lounger-cli` 文件具有可执行权限：


  ```

  $ chmod +x bin/lounger-cli

  ```


  我们的 `lounger-cli` 文件的第一行将是一个 shebang 行。这告诉 Linux/Unix shell 用户，必须使用 Node.js 来运行我们的文件：


  ```

  #!/usr/bin/env node

  ```


  之后，我们加载 `lib/lounger.js`，这是我们的命令行工具的核心：


  ```

  const lounger = require(''../lib/lounger.js'');

  ```


  下一步是解析我们的命令行参数。在这个案例中，我们使用 `nopt` 模块来实现这一目的（使用 `npm i --save nopt` 安装它）。我们也可以自己解析参数，但像
  `nopt` 这样久经考验的模块提供了更多功能，并且更易于使用。我们通过访问 `parsed.argv.remain` 来获取传入的命令：


  ```

  const nopt = require(''nopt'');

  const parsed = nopt({}, {}, process.argv, 2);

  const cmd = parsed.argv.remain.shift();

  ```


  下一步是通过调用 `lounger.load` 来启动客户端，这将引导客户端并填充 `lounger.commands` 和 `lounger.cli`。在 promise
  被 resolve 之后，我们调用在命令行上传入的命令：


  ```

  lounger.load().then(() => {

  lounger.cli[cmd]

  .apply(null, parsed.argv.remain)

  .catch((err) => {

  console.error(err);

  });

  }).catch((err) => {

  console.error(err);

  });

  ```


  由于每个命令都返回一个 promise，我们使用 `catch` 来捕获错误，然后将它们打印到控制台。


  我们现在可以在命令行上测试这个极简的命令行客户端了：


  ```

  $ npm install -g .

  $ lounger isonline http://test.example.com

  http://test.example.com 似乎离线或没有数据库

  ```


  假设我们的 PouchDB/CouchDB 服务器正在运行：


  ```

  $ lounger isonline http://localhost:5984

  http://localhost:5984 似乎在线

  ```


  与其每次修改代码后都运行 `npm install -g .`，不如在模块目录中运行 `npm link`。这会将全局安装链接到当前目录，这意味着只要目录不变，每次更改都会立即可用。


  **注意**

  本节的代码可以在 `sourcecode/client-bootstrap` 中找到。


  **选择你喜欢的风格**

  npm 上有无数优秀的参数解析库。`nopt` 的一些替代品包括 `commander`、`optimist` 和 `yargs`。


  ## 总结


  在本章中，我们为命令行客户端创建了第一个基础构建块。现在，我们为开发一个可扩展的命令行客户端打下了坚实的基础。我们还添加了第一个命令。然而，距离打造出一个用户喜爱并愿意推广的产品，我们还有很长的路要走。我们的
  CLI 仍然有些粗糙，并且缺少许多成功 CLI 所具备的功能。我们将在下一章中解决这些问题，届时我们将重点关注可用性和可访问性。




