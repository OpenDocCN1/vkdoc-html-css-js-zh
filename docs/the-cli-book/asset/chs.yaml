  \ 中找到。\n\n## JSON 支持与简写命令\n\nJSON 支持对于所有希望从 CLI 获取输出，并使用自有工具以编程方式处理这些输出的用户都很有用。通过为我们的\
  \ `isonline` 命令添加一个 `--json` 标志，只需几行代码就能增加这个实用功能。我们必须告知参数解析器这一点；在这里，我们告诉 `nopt`，我们希望将\
  \ `--json` 视为一个布尔值，处理在 `bin/lounger-cli` 中：\n\n```\nconst parsed = nopt({\n'json':\
  \ [Boolean]\n}, {'j': '--json'}, process.argv, 2);\n```\n\n基于 `Boolean` 类型，`nopt`\
  \ 会自动为我们添加 `--no-json` 选项，这在之后我们通过文件添加额外配置时会很方便。此外，我们为高级用户注册了一个简写选项：他们可以使用 `-j`\
  \ 代替 `--json`。\n\n然后，我们将解析结果 `parsed` 传递给 `lounger.load`：\n\n```\nconst parsed =\
  \ nopt({\n'json': [Boolean]\n}, {'j': '--json'}, process.argv, 2);\nconst cmd =\
  \ parsed.argv.remain.shift();\nlounger.load(parsed).then(() => {\nlounger.cli[cmd]\n\
  .apply(null, parsed.argv.remain)\n.catch(errorHandler);\n}).catch(errorHandler);\n\
  ```\n\n`lounger.load` 添加了一个 `lounger.config.get` 命令，并将其作为引导程序的一部分供我们使用：\n\n```\n\
  lounger.load = function load (opts) {\nreturn new Promise((resolve, reject) => {\n\
  lounger.config = {\nget: (key) => {\nreturn opts[key];\n}\n};\nfs.readdir(__dirname,\
  \ (err, files) => {\n```\n\n我们在 `isonline.js` 文件中引入 `lounger.js`：\n\n```\nconst\
  \ lounger = require('./lounger.js');\n```\n\n最后一步，在 `cli` 函数中获取结果后，检查 `json` 标志：\n\
  \n```\nisOnline(url).then((results) => {\nif (lounger.config.get('json')) {\nconsole.log(results);\n\
  resolve(results);\nreturn;\n}\n```\n\n这样就完成了！我们可以测试一下命令：\n\n```\n$ lounger isonline\
  \ http://example.com\nhttp://example.com seems to be offline or no database server\n\
  $ lounger isonline http://example.com --json\n{ 'http://example.com': false }\n\
  $ lounger isonline http://example.com -j\n{ 'http://example.com': false }\n```\n\
  \n现在，我们的用户可以将终端上的输出通过管道传输给其他消费者，并处理结果。我们还为 `lounger` 添加了第一个命令行标志，用于修改命令的执行方式。太棒了！\n\
  \n**注意**\n\n本节的代码和测试位于 `sourcecode/json-flags` 中。\n\n\n\n## 文档\n\n完成 `isonline`\
  \ 命令的最后一步是添加合适的文档。我们将用 Markdown 编写这份文档。我们需要为 API 和 CLI 命令编写文档。API 文档将位于 `doc/api`\
  \ 目录，CLI 命令文档将位于 `doc/cli` 目录。我知道大多数程序员讨厌编写文档，但这能给我们带来很多好处：新用户能够更快地上手使用，我们也不会在用户有机会享受产品之前就失去他们。此外，通过一次性记录功能，我们能让自己的工作更轻松，这样人们就不必提交\
  \ issue 或在聊天中询问如何使用某个命令了。这是一个双赢的局面。我们从 `doc/api/lounger-isonline.md` 开始，它描述了位于 `lounger.commands`\
  \ 的 API：\n\n```\nlounger-isonline(3) -- 检查数据库是否在线\n===========================================\n\
  ```\n\n标题将我们的命令描述为 `lounger-isonline(3)`，然后添加了对该命令的简短说明。括号中的数字表示章节的类型。对于 man 手册页，库函数用\
  \ `3` 表示，用户命令用 `1` 表示（剧透：我们的 CLI 命令就是一个用户命令）。\n\n下一部分描述了用户如何使用该命令：\n\n```\n### 概要\n\
  lounger.commands.isonline(url)\n```\n\n最后一部分是对命令工作原理的详细描述：\n\n```\n### 描述\n检查 CouchDB\
  \ / PouchDB 数据库在当前网络上是否可用。\nurl：\nurl 必须是字符串，并且必须是使用 http 或 https 协议的 url。\n该命令返回一个\
  \ promise。该 promise 返回一个对象。对象的键是提供的 url，值是布尔类型。\ntrue 表示在线 CouchDB / PouchDB 节点。\n\
  ```\n\nAPI 部分就这些了。现在我们可以为 `doc/cli/lounger-isonline.md` 添加文本内容：\n\n```\nlounger-isonline(1)\
  \ -- 检查数据库是否在线\n===========================================\nlounger isonline  [--json]\n\
  ### 描述\n：\n检查数据库节点当前是否在线或可用。\nisonline 以人类可读的格式输出结果。通过传入 --json 标志，也支持 JSON 格式输出。\n\
  ```\n\n通过 `lounger-isonline(1)` 中的小 `1`，我们表明这个帮助章节解释的是一个用户命令。`<url>` 中的尖括号向用户表明\
  \ `url` 是一个必需参数；没有它，命令就无法工作。`[--json]` 的方括号表示 `--json` 标志是一个可选参数。准备好我们的第一批文档页面后，我们可以进入下一部分，将其渲染为各种输出格式。\n\
  \n### 渲染文档\n\n现在我们有了文档的源文件，可以开始使用 `marked` 和 `marked-man` 从源文件构建文档：\n\n```\n$ npm\
  \ i --save-dev marked marked-man\n```\n\nMakefile 非常适合从源文件生成文档。遗憾的是，很难让 Makefile\
  \ 在 Windows 上工作，所以我们将用 JavaScript 编写构建步骤。在 lounger 的根目录中，我们创建 `build.js` 文件。此外，我们还需要安装\
  \ `mkdirp` 和 `rimraf`；`mkdirp` 以跨平台的方式提供了我们熟悉的 Linux 命令 `mkdir -p` 的功能：它可以递归地创建目录和子目录。`rimraf`\
  \ 模块则为 Node.js 平台带来了相当于 `rm -rf` 的功能：递归删除目录。我们还将使用 `glob` 模块来匹配文档构建所需的所有文件：\n\n\
  ```\n$ npm i --save-dev mkdirp rimraf glob\n```\n\n我们的第一个函数将是一个用于清理一个全新的文件夹结构的函数，我们可以在其中保存\
  \ man 手册页：\n\n```\n'use strict';\nconst mkdirp = require('mkdirp');\nconst rimraf\
  \ = require('rimraf');\nconst glob = require('glob');\nconst path = require('path');\n\
  function cleanUpMan () {\nrimraf.sync(__dirname + '/man/');\n// 重新创建目标目录\nmkdirp.sync(__dirname\
  \ + '/man/');\n}\n```\n\n我们需要找出哪些 Markdown 文件可用于编译。我们的文档源文件位于 `doc/api` 或 `doc/cli`。此外，我们在\
  \ `doc/website` 中还有一些专门用于网站的内容（`index.html` 的内容）。\n\n`getSources` 函数帮助我们获取每种源文件类型（`api`、`doc`、`website`）对应的\
  \ Markdown 文件的完整路径。它返回匹配的 glob 的相对路径，然后使用 `path.resolve` 函数以跨平台的方式获取完整路径。\n\n```\n\
  function getSources (type) {\nconst files = glob.sync('doc/' + type + '/*.md');\n\
  return files.map(file => path.resolve(file));\n}\n```\n\n`sources` 对象为每种类型存储了找到的文件数组：\n\
  \n```\nconst sources = {\napi: getSources('api'),\ncli: getSources('cli'),\nwebsiteIndex:\
  \ getSources('website'),\n};\n```\n\n现在我们可以清理目标目录，并获取要转换的文件名列表。我们仍然需要找出转换后文件的目标路径和文件名。Man\
  \ 手册页根据其描述的功能类型有不同的文件后缀。我们的 CLI 手册页将获得后缀 `.1`（用户命令），API 函数将获得后缀 `.3`（库函数）。我们还必须将文件路径中的\
  \ `doc/cli/` 和 `doc/api/` 替换为我们的目标目录 `man/`。我们需要特别注意路径分隔符。在 Windows 上，分隔符是 `\\\\\
  ` 而不是 `/`。这意味着路径 `doc/api` 在 Windows 上会变成 `doc\\\\api`。好消息是，我们可以通过 Node.js 中的 `path.sep`\
  \ 来访问当前平台的路径分隔符（该分隔符由核心模块 `path` 提供）：\n\n```\nfunction getTargetForManpages (currentFile,\
  \ type) {\nlet target;\n// 在 Unix 系统上设置 man 手册页的正确章节\nif (type === 'cli') {\ntarget\
  \ = currentFile.replace(/\\.md$/, '.1');\n}\nif (type === 'api') {\ntarget = currentFile.replace(/\\\
  .md$/, '.3');\n}\n// 将源目录替换为目标目录\n// 分别处理 Windows 路径（doc\\\\api）和 Unix 路径（doc/api）\n\
  target = target\n.replace(['doc', 'cli'].join(path.sep), 'man')\n.replace(['doc',\
  \ 'api'].join(path.sep), 'man');\nreturn target;\n}\n```\n\n目前，我们只想从 `api` 和 `cli`\
  \ 文件夹中的文档创建 man 手册页。\n\n基于这些构建块，我们可以创建最终的 `buildMan` 函数，该函数将最终构建我们的 man 手册页。它将使用我们刚刚创建的函数，并生成一个子进程，该子进程通过使用\
  \ `marked-man` 来编译 Markdown 文件。我们将使用 Node 核心的 `spawnSync` 函数来生成进程。由于我们要将结果写入文件系统，我们也需要引入\
  \ `fs` 模块。\n\n\n\n```javascript\nconst fs = require('fs');\nconst spawnSync = require('child_process').spawnSync;\n\
  ```\n\n首要任务是进行清理，以创建一个不包含先前构建任何文件的全新目标目录。然后我们遍历源码，为需要生成的新文件确定目标路径。接着，通过 `fs.writeFileSync`\
  \ 将文件写入硬盘。我们会停止网站索引的执行，因为目前我们并不想将其用于手册页面。在下一次迭代中，我们完全可以为 lounger 手册页面添加一个主页：\n\n\
  ```javascript\nfunction buildMan () {\ncleanUpMan();\nObject.keys(sources).forEach(type\
  \ => {\nsources[type].forEach(currentFile => {\nif (type === 'websiteIndex') {\n\
  return;\n}\n// 将 Markdown 转换为手册页面\nconst out = spawnSync('node', [\n'./node_modules/marked-man/bin/marked-man',\n\
  currentFile\n]);\nconst target = getTargetForManpages(currentFile, type);\n// 将输出写入目标文件\n\
  fs.writeFileSync(target, out.stdout, 'utf8');\n})\n});\n}\nbuildMan();\n```\n\n\
  通过最后一行代码中的 `buildMan()` `;`，我们每次用 Node 运行该脚本时都会启动构建流程。对 `package.json` 稍作修改，就可以将其变为一个\
  \ npm 脚本，并在发布前运行构建，这样用户在安装时就不必自行编译任何内容了。这能确保每位用户都获得完全相同的包内容，并加快安装速度。\n\n在 `package.json`\
  \ 中，我们修改 `scripts` 部分，并添加 `build` 和 `prepublishOnly` 条目。`prepublishOnly` 条目是 npm\
  \ 的一个特殊钩子。每次我们将包发布到注册表之前，它都会运行：\n\n```json\n\"scripts\": {\n\"test\": \"mocha -R\
  \ spec\",\n\"docs\": \"node ./build\",\n\"prepublishOnly\": \"npm run docs\"\n},\n\
  ```\n\n自从 npm 5 版本起，`prepublish` 已被弃用。它仍然可以工作，但对于构建步骤，建议使用 `prepublishOnly` 或 `prepare`\
  \ 代替。\n\nnpm 还为手册页面提供了一个很棒的功能：npm 可以为用户安装它们，这样 Linux/Unix 用户就可以通过 `man <command>`\
  \ 在终端中查看。要做到这一点，我们必须在 `package.json` 中添加另一个条目，即在 `directories` 部分添加 `man` 条目：\n\n\
  ```json\n\"directories\": {\n\"man\": \"./man\"\n},\n```\n\n该条目指向本地的手册页面目录。如果你使用的是\
  \ Unix/Linux 系统，可以看看手册页面现在是否生效：\n\n```\n$ npm run docs\n> lounger@1.0.0 docs /home/rocko/clibook/sourcecode/documentation\n\
  > node ./build\n$ npm install -g .\n> lounger@1.0.0 prepublish /home/rocko/clibook/sourcecode/documentation\n\
  > npm run docs\n> lounger@1.0.0 docs /home/rocko/clibook/sourcecode/documentation\n\
  > node ./build\n/home/rocko/.nvm/versions/node/v9.1.0/bin/lounger -> /home/rocko/.nvm/versions/node/v9.1.0/lib/node_modules/lounger/bin/lounger-cli\n\
  /home/rocko/.nvm/versions/node/v9.1.0/lib\n└── lounger@1.0.0\n```\n\n现在我们可以输入命令来显示手册页面，该页面将显示在屏幕上（图\
  \ 3-2）：\n\n![A456043_1_En_3_Fig2_HTML.jpg](img/A456043_1_En_3_Fig2_HTML.jpg)\n\n\
  **图 3-2** 我们的命令行客户端 lounger 的手册页面\n\n```\n$ man lounger-isonline\n```\n\n也可以选择特定的段落：\n\
  \n```\n$ man 3 lounger-isonline\n$ man 1 lounger-isonline\n```\n\n手册页面准备就绪后，我们就可以专注于\
  \ HTML 输出了。\n\n#### 提供 HTML 输出\n\n对于基于 HTML 的文档，我们现在需要添加 HTML 特定的部分。我们将在模块的 `doc`\
  \ 文件夹中创建一个名为 `website` 的文件夹。它将包含用于“框定”文档输出的网站模板。\n\n在 `website` 文件夹中，我们放置一个包含基本标记的\
  \ `template.html` 文件，最重要的是占位符：\n\n```html\n<!DOCTYPE html>\n<html>\n  <head>\n \
  \   <title>The lounger manual & documentation</title>\n  </head>\n  <body>\n   \
  \ <h1>lounger</h1>\n    <div id=\"content\">__CONTENT__</div>\n    <div id=\"toc\"\
  >__TOC__</div>\n  </body>\n</html>\n```\n\n我们需要为网站根目录创建一些内容来欢迎用户。我会提供一个非常简短的示例。通常，登录页面应该让用户了解命令行客户端是做什么的，或许还可以演示一下。录屏是展示一些核心功能的绝佳方式。关于在网站上放些什么内容的灵感，欢迎访问\
  \ [`apache.github.io/couchdb-nmo`](http://apache.github.io/couchdb-nmo) ，这是我编写的命令行客户端的页面。除了\
  \ `doc/website` 中的模板，我们还将自定义的索引页面添加为 `index.md`：\n\n```markdown\n# 欢迎使用 Lounger\n\
  Lounger 是 CouchDB 和 PouchDB 的友好管理工具。\n\n## 你需要 Node.js > 8 才能使用 lounger\nnpm install\
  \ -g lounger\n你可以用 lounger 做的事情：\n\n## 检查 CouchDB / PouchDB 实例是否在线\nlounger isonline\
  \ http://example.com\n```\n\n这个页面很简约，但简要概述了 lounger 的功能。它还展示了访客如何安装，并提示他们需要 Node.js——并非所有人都安装了\
  \ Node.js，有些人可能从未听说过 npm。请记住：我们的目标是尽可能让新用户轻松上手，以免他们卡住。在下一节中，我们将实现渲染 Markdown 所需的功能。\n\
  \n\n\n### 扩展构建脚本\n\n为了构建网站，我们必须在 `build.js` 中添加代码。首先，为网站文件添加另一个清理函数，这样每次都能从空白状态开始：\n\
  \n```\nfunction cleanUpWebsite () {\n  rimraf.sync(__dirname + '/website/');\n \
  \ mkdirp.sync(__dirname + '/website/');\n}\n```\n\n我们的网站与手册页有不同的目标。我们添加一个新函数 `getTargetForWebsite`。目前，我们的\
  \ Markdown 文件都以 `lounger-` 作为前缀，这对手册页很方便，但对我们的网站用处不大。相反，我们希望用其类型作为文件前缀；例如，API 文档的前缀将是\
  \ `api-`。这样，我们可以将 API 页面放在 CLI 页面旁边，便于链接。`getTargetForWebsite` 函数的前几行将处理此任务，并用特定类型的前缀替换\
  \ `lounger-` 前缀。替换前缀后，我们将文件后缀从 `.md` 改为 `.html`。我们编译结果的最终目标文件夹是 `./website`，因此我们必须确保目录设置正确。与\
  \ `getTargetForManpages` 的不同之处在于，我们使用 `website` 文件夹而不是 `man`，并且我们还处理了 `doc/website/index.md`\
  \ 文件的路径：\n\n```\nfunction getTargetForWebsite (currentFile, type) {\n  let target\
  \ = currentFile;\n  // 为我们的 html 文件稍微修改文件名：\n  // 用 cli- 前缀替换所有 cli 函数的 lounger-\
  \ 前缀\n  // 用 api- 前缀替换所有 api 函数的 lounger- 前缀\n  if (type === 'cli') {\n    target\
  \ = currentFile.replace(/lounger-/, 'cli-');\n  }\n  if (type === 'api') {\n   \
  \ target = currentFile.replace(/lounger-/, 'api-');\n  }\n  // 将文件后缀设置为 html\n \
  \ target = target.replace(/\\.md$/, '.html');\n  // 将源目录替换为目标目录\n  target = target\n\
  \    .replace(['doc', 'cli'].join(path.sep), 'website')\n    .replace(['doc', 'api'].join(path.sep),\
  \ 'website')\n    .replace(['doc', 'website'].join(path.sep), 'website');\n  return\
  \ target;\n}\n```\n\n我们的网站还缺少一个类似目录的东西。`getTocForWebsite` 将创建我们 API 和 CLI 函数的列表。稍后，我们会将目录插入到模板的\
  \ `TOC` 占位符中。\n\n目录本身包含一个我们编译的文件的嵌套列表。将来，用 `Handlebars`、`Jade` 或 `Nunjucks` 这样的模板引擎替换整个系统可能是有意义的。我绝对可以再写一本关于静态网站生成及其众多可能工具链的书，但我目前尽量保持简单，只使用纯\
  \ ES6 模板。\n\n在开始一个无序列表 `<ul>` 后，我们再次遍历源的类型。我们不需要 `websiteIndex` 类型的文件，对于这些类型我们提前返回。对于其他所有类型，我们获取每个部分的类型并将其用作第一个列表元素。它显示每个部分（API\
  \ 或 CLI）的类型，并充当标题。\n\n获得标题后，我们遍历当前部分的每个文件。由于链接文本与实际超链接略有不同，我们创建了一个名为 `file` 的常量和一个额外的\
  \ `linktext` 常量。对于两者，我们都必须去掉 `lounger-` 前缀。为了创建用作 `href` 的引用，我们必须将 `.md` 后缀改为 `.html`。链接文本不应包含任何文件后缀，因此我们移除其\
  \ `.md` 后缀：\n\n```\nfunction getTocForWebsite () {\n  let toc = '';\n  Object.keys(sources).forEach(type\
  \ => {\n    // 我们目前不希望在目录中包含索引\n    if (type === 'websiteIndex') {\n      return;\n\
  \    }\n    toc += `<li>${type}`;\n    sources[type].forEach(currentFile => {\n\
  \      const prefix = type === 'cli' ? 'cli-' : 'api-';\n      const file = path.basename(currentFile)\n\
  \        .replace('lounger-', prefix)\n        .replace(/\\.md/, '.html');\n   \
  \   const linktext = path.basename(currentFile)\n        .replace('lounger-', '')\n\
  \        .replace(/\\.md/, '');\n      toc += `<ul><li><a href=\"${file}\">${linktext}</a></li></ul>`;\n\
  \    });\n    toc += '</li>';\n  });\n  toc += '</ul>';\n  return toc;\n}\n```\n\
  \n现在，我们可以利用创建的小函数，从中构建主要构建函数 `buildWebsite`。`templateFile` 常量描述了我们在开始时创建的模板文件 `template.html`\
  \ 的位置：\n\n```\nconst templateFile = __dirname + '/doc/website/template.html';\n\
  ```\n\n下一步是用生成的目录以及每个 API 或 CLI 方法的不同内容来替换模板中的占位符。\n\n在 `buildWebsite` 中，我们首先调用\
  \ `cleanUpWebsite` 来删除任何过时的文件。我们使用 `fs.readFileSync` 读取模板，并获取目录。然后我们遍历源。这一次，我们不会使用\
  \ `marked-man` 生成子进程；我们只使用 `marked`，它输出 HTML。在获取网站当前文件的目标后，我们用其替换 `CONTENT` 占位符。`TOC`\
  \ 被替换为目录，该目录保存在主函数顶部的 `toc` 中。将模板的读取操作和 TOC 的创建移出循环，可以提高构建的性能，因为我们不必为每个新文件都调用它们。最后，使用\
  \ `fs.writeFileSync` 将渲染后的内容写入磁盘。代码片段中的最后一行最终调用 `buildWebsite`，以便在我们运行 `build.js`\
  \ 时构建网站：\n\n```\nfunction buildWebsite () {\n  cleanUpWebsite();\n  const template\
  \ = fs.readFileSync(templateFile, 'utf8');\n  const toc = getTocForWebsite();\n\
  \  Object.keys(sources).forEach(type => {\n    sources[type].forEach(currentFile\
  \ => {\n      // 将 markdown 转换为网站内容\n      const out = spawnSync('node', [\n   \
  \     './node_modules/marked/bin/marked',\n        currentFile\n      ]);\n    \
  \  const target = getTargetForWebsite(currentFile, type);\n      const rendered\
  \ = template\n        .replace('__CONTENT__', out.stdout)\n        .replace('__TOC__',\
  \ toc);\n      // 将输出写入目标文件\n      fs.writeFileSync(target, rendered, 'utf8');\n\
  \    });\n  });\n}\nbuildWebsite();\n```\n\n现在我们可以再次运行构建，并查看出现在 `website` 文件夹中的网站，如图\
  \ 3-3 所示：\n\n![A456043_1_En_3_Fig3_HTML.jpg](img/A456043_1_En_3_Fig3_HTML.jpg)\n\
  \n**图 3-3** 由我们的 Markdown 生成的 lounger 最小化网站\n\n```\n$ npm run docs\n```\n\n该网站仍然缺少一些内容以及一个漂亮的样式表。正如我已经提到的，构建网站是一个可以写一整本书的话题，我目前就打算保持这样。欢迎随意为网站添加更多内容和样式。尽管如此，我们刚刚创建了一些可以部署到\
  \ GitHub Pages 或任何其他托管服务的东西。最好的一点是，我们可以将其与命令行客户端一起发布，作为那些无法使用或不喜欢手册页的人的额外文档。在下一节中，当我们创建帮助系统时，我们将使用这两种文档类型。\n\
  \n> **注意**  \n> 本节代码可在 `sourcecode/documentation` 找到。\n\n## 更多帮助\n\n我们已经有一些文档，但\
  \ lounger 仍然有些粗糙。如果用户尝试访问一个不存在的命令，他们不会得到任何如何继续的建议：\n\n```\n$ lounger foobar\n```\n\
  \n一个不带任何参数调用 lounger 的用户也得不到支持：\n\n```\n$ lounger\n```\n\n缺少的是一个解释用户如何完成任务的帮助页面。如果他们能直接从终端打开我们的文档（网页或手册页），那就太棒了。我们的用户不应关心手册页，也不必找出我们托管网站的地址。lounger\
  \ 的预期行为如下：\n\n1. 如果 CLI 在未带命令或传递的命令不存在时被调用，它会打印一条通用帮助信息。这条信息提示用户如何进一步操作来完成任务。\n\
  2. 可以轻松获得某个命令的额外帮助。\n\n这样，我们在用户需要的地方提供帮助。无需切换到 Google 搜索帮助。在接下来的两节中，我们将为 lounger\
  \ 添加所需的功能。\n\n\n\n### 命令列表的通用帮助\n\n要添加通用帮助界面，我们首先创建一个新的库函数 `lib/help.js`。第一个函数将向用户输出一些友好的帮助文本。帮助文本将在辅助函数中构建。\n\
  \n我们可以通过调用 `Object.keys(lounger.cli)` 获取所有可用的命令，然后链式调用 `.join(', ')` 方法，在每个命令之间用逗号和空格分隔：\n\
  \n```\nconst lounger = require('./lounger.js');\nfunction getGeneralHelpMessage\
  \ () {\n  const commands = Object.keys(lounger.cli).join(', ');\n```\n\n接下来是一个模板字符串，用于解释如何使用\
  \ `lounger`。我们添加所有在命令行界面上公开的可用命令。同时，我们说明，如果用户毫无头绪，可以运行 `lounger help` 加上他们感兴趣的命令，以获取该命令的详细帮助。我们还提供了一个如何调用帮助的示例。\n\
  \n最后一行显示用户当前运行的 `lounger` 版本，这在各种情况下都非常实用。通常，人们会忘记自己安装的软件包版本。想象一下，一位用户刚刚读到一篇关于 `lounger`\
  \ 2.3 版本的博客文章，其中有一个很棒的新功能可以尝试。用户很早以前就安装了 `lounger`，但遗憾的是，该命令仅从 2.3 版本（三天前发布）才开始可用。在这种情况下，用户可以立即收到反馈，提示当前运行的是旧版本。\n\
  \n以下是完整的 `getGeneralHelpMessage` 函数：\n\n```\nfunction getGeneralHelpMessage () {\n\
  \  const commands = Object.keys(lounger.cli).join(', ');\n  const message = `Usage:\
  \ lounger \nThe available commands for lounger are:\n${commands}\nYou can get more\
  \ help on each command with: lounger help \nExample:\nlounger help isonline\nlounger\
  \ v${lounger.version} on Node.js ${process.version}`;\n  return message;\n}\n```\n\
  \n通用帮助信息就这些内容了。接下来，我们将进一步扩展帮助系统。\n\n### 每个命令的帮助\n\n在我们的命令行客户端中，为每个命令提供一个简单的帮助访问系统是非常有价值的。我们将要构建的下一个函数会尝试打开手册页（如果可能的话）。对于\
  \ Windows 用户，它将回退到网站版本。\n\n`opener` 模块在不同操作系统中打开文件方面表现出色。这也适用于 HTML 文件，因为我们希望在当前操作系统的默认浏览器中打开它们。因此，我们安装\
  \ `opener` 作为下一个依赖：\n\n```\n$ npm install --save opener\n```\n\n然后，我们在 `help.js`\
  \ 的顶部引入 `opener`：\n\n```\nconst opener = require('opener');\n```\n\n接下来，我们还需要生成\
  \ `man` 命令，并找到网站文件的绝对路径：\n\n```\nconst spawnSync = require('child_process').spawnSync;\n\
  const path = require('path');\n```\n\n核心模块 `os` 可以帮助我们判断是否在 Windows 上运行：\n\n```\n\
  const isWindows = require('os').platform() === 'win32';\n```\n\n然后，我们需要生成 `man`\
  \ 命令，或者为所需功能打开默认浏览器。通过为生成命令设置 `stdio: inherit`，我们可以查看生成的进程输出并与之交互：\n\n```\nfunction\
  \ openDocumentation (command) {\n  if (isWindows) {\n    const htmlFile = path.resolve(__dirname\
  \ + '/../website/cli-' + command + '.html');\n    return opener('file:///' + htmlFile);\n\
  \  }\n  spawnSync('man', ['lounger-' + command], {stdio: 'inherit'});\n}\n```\n\n\
  最后一个任务是将所有辅助函数整合在一起。如果某个命令不可用，则打印通用帮助。如果命令存在，则根据操作系统打开手册页或浏览器：\n\n```\nexports.cli\
  \ = help;\nfunction help (command) {\n  return new Promise((resolve, reject) =>\
  \ {\n    if (!lounger.cli[command]) {\n      console.log(getGeneralHelpMessage());\n\
  \    } else {\n      openDocumentation(command);\n    }\n    resolve();\n  });\n\
  }\n```\n\n如果你愿意，还可以添加代码，让用户配置打开哪种类型的文档。也许 Linux 用户更喜欢文档的网站版本。我们现在就可以尝试新的 `help`\
  \ 命令，因为它会被我们的 `lounger.js` 文件识别（图 3-4）。\n\n![A456043_1_En_3_Fig4_HTML.jpg](img/A456043_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4：我们的帮助命令运行中\n\n本节最后一个任务是确保在用户未输入任何命令时打印通用帮助。在 `bin/lounger-cli` 中，我们引入 `help.js`\
  \ 文件并修改 `lounger.load` 调用。如果在 `lounger.cli` 中找不到该命令，我们就打印通用帮助：\n\n```\nconst help\
  \ = require('../lib/help.js');\nlounger.load(parsed).then(() => {\n  if (!lounger.cli[cmd])\
  \ {\n    return help.cli();\n  }\n  lounger.cli[cmd]\n    .apply(null, parsed.argv.remain)\n\
  \    .catch(errorHandler);\n}).catch(errorHandler);\n```\n\n恭喜！我们现在完成了帮助系统，并取得了重大进展！欢迎通过输入以下命令来尝试我们的新帮助系统：\n\
  \n```\n$ lounger blerg\n$ lounger\n$ lounger help\n$ lounger help isonline\n```\n\
  \n**注意：** 本节代码位于 `sourcecode/help-system`。\n\n## 配置\n\n要求用户每次使用 `lounger` 时都手动添加他们喜欢的设置作为标志可能很繁琐。配置文件可以让用户保存他们每天需要的设置。如果能够支持这个功能，让我们的高级用户更满意，那就太好了。\n\
  \n### 创建配置文件\n\n通常的做法是将命令行工具的配置文件放在用户的主目录中。每个操作系统的主目录都不同，但 `osenv` 模块可以帮助我们找到当前的主目录：\n\
  \n```\n$ npm install --save osenv\n```\n\n我们需要检查主目录中是否存在 `loungerrc` 配置文件，如果不存在，则创建一个空文件。我们在\
  \ `lounger-cli` 中执行此操作，以保持 API 函数没有副作用。这是修改后的 `lounger-cli` 文件，我们在其中添加了对 `osenv`\
  \ 的 `require` 调用，并在参数解析后立即创建了一个配置文件。我们还将配置文件的路径添加到了解析后的参数中：\n\n```\n#!/usr/bin/env\
  \ node\nconst lounger = require('../lib/lounger.js');\nconst pkg = require('../package.json');\n\
  const log = require('npmlog');\nconst nopt = require('nopt');\nconst help = require('../lib/help.js');\n\
  const osenv = require('osenv');\nconst fs = require('fs');\nconst parsed = nopt({\n\
  \  'json': [Boolean]\n}, {'j': '--json'}, process.argv, 2);\nconst home = osenv.home();\n\
  parsed.loungerconf = home + '/' + '.loungerrc';\nif (!fs.existsSync(parsed.loungerconf))\
  \ {\n  fs.writeFileSync(parsed.loungerconf, '');\n}\n```\n\n\n\n### 配置系统的核心\n\n\
  配置系统本身将使用 ini 格式的配置文件来存储和读取设置。`config-chain`模块会根据我们加载配置的顺序为不同配置项设定优先级。它还支持 ini 格式的文件。\n\
  \n让我们创建一个`lib/config.js`文件并引入`config-chain`：\n\n```\n$ npm i --save config-chain\n\
  'use strict';\nconst cc = require('config-chain');\n```\n\n`config-chain`能够管理多个配置项。它会根据加载配置的顺序来覆盖配置设置。\n\
  \n在我们的用例中，我们希望命令行参数中提供的选项拥有最高优先级。它们应该能够覆盖配置文件中的选项。由于文件加载是异步完成的，我们必须监听`config-chain`加载完成后发出的`load`事件。对于通过`lounger.load`和\
  \ API 函数进行的程序化使用，不需要基于文件的配置。在这些情况下，我们不会尝试加载文件。如果出现任何错误，我们会拒绝 Promise 并传递错误对象：\n\n\
  ```\nexports.loadConfig = loadConfig;\nfunction loadConfig (nopts) {\nreturn new\
  \ Promise((resolve, reject) => {\nlet cfg;\nif (!nopts.loungerconf) {\ncfg = cc(nopts)\n\
  .on('load', () => {\nresolve(cfg);\n}).on('error', reject);\n} else {\ncfg = cc(nopts)\n\
  .addFile(nopts.loungerconf, 'ini', 'config')\n.on('load', () => {\nresolve(cfg);\n\
  }).on('error', reject);\n}\n});\n};\n```\n\n`config-chain`返回的配置对象具有方便的`get`和`set`方法。我们甚至可以在修改配置后使用`save`方法将配置保存回配置文件。现在，我们必须将`loadConfig`集成到\
  \ lounger 的启动过程中。还记得上一章`lounger.js`中的`config.get`方法吗？我们将用`load`函数返回的配置对象替换它。\n\n\
  首先，我们必须在`lounger.js`中加载配置：\n\n```\nconst config = require('./config.js');\n```\n\
  \n在`lounger.load`中，我们将加载配置：\n\n```\nlounger.load = function load (opts) {\nreturn\
  \ new Promise((resolve, reject) => {\nconfig\n.loadConfig(opts)\n.then((cfg) =>\
  \ {\n});\n```\n\n`lounger.load`的其他内容，包括`fs.readdir`调用，被移到链式`then`函数的回调中：\n\n```\n\
  lounger.load = function load (opts) {\nreturn new Promise((resolve, reject) => {\n\
  config.loadConfig(opts)\n.then((cfg) => {\nlounger.config = cfg;\nfs.readdir(__dirname,\
  \ (err, files) => {\nfiles.forEach((file) => {\nif (!/\\.js$/.test(file) || file\
  \ === 'lounger.js') {\nreturn;\n}\nconst cmd = file.match(/(.*)\\.js$/)[1];\nconst\
  \ mod = require('./' + file);\nif (mod.cli) {\ncli[cmd] = mod.cli;\n}\nif (mod.api)\
  \ {\napi[cmd] = mod.api;\n}\n});\nlounger.loaded = true;\nresolve(lounger);\n});\n\
  }).catch(reject);\n});\n};\n```\n\n如果我们现在运行 lounger，它将在我们的主目录中创建一个配置文件。在 macOS 上，我的配置位于`~/.loungerrc`。\n\
  \n创建文件后（别忘了至少运行一次 lounger），我们可以在`~/.loungerrc`中将 JSON 输出设置为`true`：\n\n```\njson\
  \ = true\n```\n\n只需尝试运行 `lounger isonline http://example.com`，lounger 现在就会打印 JSON\
  \ 格式的输出。我们仍然可以在命令行上覆盖配置：\n\n```\n$ lounger isonline --no-json\n```\n\n### 一个编辑配置的辅助工具\n\
  \n因为手动编辑`~/.loungerrc`对用户不太友好，所以我们将构建一个`lounger config`命令。这个命令应该用于显示配置及其值，以及设置配置值。\n\
  \n以下是提议的 CLI 界面：\n\n```\n$ lounger config set json true\n$ lounger config get json\n\
  ```\n\n相应的 API 可能如下所示：\n\n```\nlounger.commands.set('json', true)\nlounger.commands.get('json')\n\
  ```\n\n`config-chain`将加载的配置文件中提供的数据作为`.sources.config.data`提供。对于 JSON 格式的输出，如果没有提供键，我们将返回整个配置：\n\
  \n```\nconst data = lounger.config.sources.config.data;\nif (lounger.config.get('json')\
  \ && !key) {\nresolve(data);\nreturn;\n}\n```\n\n如果提供了键，我们将构建一个仅包含该键对应值的 JSON 对象：\n\
  \n```\nif (lounger.config.get('json') && key) {\nresolve({[key]: data[key]});\n\
  return;\n}\n```\n\n如果我们不希望输出 JSON 格式并且提供了键，则返回值：\n\n```\nif (key) {\nresolve(lounger.config.sources.config.data[key]);\n\
  return;\n}\n```\n\n在最后一种情况下，当`json`设置为`false`且未提供键时，我们将直接读取未经解析的 ini 文件：\n\n```\n\
  resolve(fs.readFileSync(lounger.config.sources));\n```\n\n以下是完整的`get`函数：\n\n```\n\
  function get (key) {\nreturn new Promise((resolve, reject) => {\nconst data = lounger.config.sources.config.data;\n\
  if (lounger.config.get('json') && !key) {\nresolve(data);\nreturn;\n}\nif (lounger.config.get('json')\
  \ && key) {\nresolve({[key]: data[key]});\nreturn;\n}\nif (key) {\nresolve(lounger.config.sources.config.data[key]);\n\
  return;\n}\nresolve(fs.readFileSync(lounger.config.sources));\n});\n}\n```\n\n修改配置通过`set`函数完成。它接受一个键和一个值，在`config-chain`对象上调用`set`，并在值写入磁盘后解析\
  \ Promise：\n\n```\nfunction set (key, value) {\nreturn new Promise((resolve, reject)\
  \ => {\nif (!key && !value) {\nreject(new Error('key and value required'));\nreturn;\n\
  }\nlounger.config.set(key, value, 'config');\nlounger.config.on('save', () => {\n\
  resolve();\n});\nlounger.config.save('config');\n});\n}\n```\n\n作为最后一步，我们必须暴露这两个命令：\n\
  \n```\nexports.api = {\nget: get,\nset: set\n};\n```\n\n我们在 API 函数的基础上构建 CLI 功能。API\
  \ 函数和 CLI 函数的主要区别在于，CLI 函数对于`get`命令有副作用：它会将结果打印到控制台。我们还添加了一些友好的错误消息，以便用户更容易使用。如果用户使用不当，他们会得到如何运行命令的说明：\n\
  \n```\nexports.cli = cli;\nfunction cli (cmd, key, value) {\nreturn new Promise((resolve,\
  \ reject) => {\nfunction getUsageError () {\nconst err = new Error([\n'Usage:',\n\
  '',\n'lounger config get []',\n'lounger config set  ',\n].join('\\n'));\nerr.type\
  \ = 'EUSAGE';\nreturn err;\n}\nif (!cmd || (cmd !== 'get' && cmd !== 'set')) {\n\
  const err = getUsageError();\nreturn reject(err);\n}\nif (cmd === 'get') {\nreturn\
  \ get(key).then((result) => {\nconsole.log(result);\n}).catch(reject);\n}\nif (cmd\
  \ === 'set') {\nif (!key && !value) {\nconst err = getUsageError();\nreturn reject(err);\n\
  }\nreturn set(key, value).catch(reject);\n}\n});\n}\n```\n\n太棒了！我们现在就有了一个配置命令！以下是我们的配置命令实际运行的效果：\n\
  \n```\n$ lounger config set json true\n$ lounger config set foo bar\n$ lounger config\
  \ get\n{ json: true, foo: 'bar' }\n$ lounger config get json\n{ json: true }\n```\n\
  \n我们已经满足了所有要点，可以准备进行初始发布了！\n\n注意\n\n本节代码位于`sourcecode/config`目录下。\n\n\n\n"
- "# 首次发布与优化技巧\n\n在 npm 注册中心注册账号后，你就可以发布开源模块。完成注册后，只需输入 `npm publish` 即可将模块发布到注册中心。在发布\
  \ `lounger` 之前，我想介绍一些优化发布包的好方法。本节将讲解如何从体积和安装时间两个维度优化你的包。\n\n保持安装体积小巧的方法之一是在根目录添加\
  \ `.npmignore` 文件。它的工作方式类似 `.gitignore` 文件，npm 不会将其中列出的文件和目录包含在发布的包中。\n\n根据使用模块时不需要的文件类型，我们可以为用户节省大量硬盘空间，同时也能节省大量带宽。\n\
  \n通过排除单元测试、集成测试以及编译文档的源文件，我们可以节省一些空间：\n\n```\n/test/\n/docs/\nbuild.js\n.DS_Store\n\
  npm-debug.log\n```\n\n另一个显著加快安装速度的好方法是将所有生产依赖都包含在发布的模块中。我们可以通过将它们添加为 `package.json`\
  \ 中的 `bundleDependencies` 来告诉 npm 将它们与模块打包在一起：\n\n```\n\"bundleDependencies\": [\n\
  \"config-chain\",\n\"nopt\",\n\"npmlog\",\n\"opener\",\n\"osenv\",\n\"request\"\n\
  ],\n```\n\n打包依赖可以大大缩短安装时间，因为在安装过程中我们省略了每个依赖项及其依赖项的小型 HTTP 请求。使用当前的 npm，宽带连接的安装时间从\
  \ 20 秒减少到 5 秒。同时，打包依赖还能确保即使某个模块被取消发布，我们的包仍然可以安装。\n\n现在运行 `npm publish`，我们将发布一个高度优化版本的包。\n\
  \n**注意**  \n本节的代码位于 `sourcecode/first-release`。\n\n## 本章小结\n\n在本章中，我们取得了很大进展。我们增强了客户端的可用性，还创建了帮助和配置系统。命令行客户端现在支持\
  \ JSON 输出和快捷方式。哦，我必须恭喜你！你成功发布了工具的第一个版本。在此过程中，你还学到了一些技巧来提升用户的安装体验。这为下一章打下了坚实基础，届时我们将探讨如何使用流处理大量数据。\n\
  \n"
- "# 4. 使用流迁移大量数据\n\n在前一章中，我们确保了用户会喜欢我们的 CLI，并发布了第一个版本。现在我们来探讨一个更高级的话题：流。流是 Node.js\
  \ 中处理大量数据的一个非常强大的特性。使用传统的缓冲方式，我们很快就会遇到内存问题，因为所有数据无法全部装入计算机内存。而流使我们能够分片处理数据。Node.js\
  \ 流的工作方式类似于终端中的 Unix 流，你可以使用管道符号（`|`）将数据从生产者传输到消费者。我们将通过探索 `cat` 命令来了解管道的工作原理。随后，我们将创建自己的流并将其集成到命令行客户端中。\n\
  \n## cat 命令\n\n`cat` 程序将文件内容输出到 `stdout`。在这个例子中，我将 `cat` 程序的输出通过管道传给 `tr`，将 `package.json`\
  \ 中的所有字母转换为大写：\n\n```\n$ cat sourcecode/first-release/package.json | tr 'a-z' 'A-Z'\n\
  ```\n\n它适用于 `stdout` 上的所有输出：\n\n```\n$ echo \"i shout?\" | tr 'a-z' 'A-Z'\n```\n\
  \nUnix 和 Node.js 中的流使我们能够组合出只做好一件事的小型程序或模块，从而完成任务。它们处理背压，这意味着当快速生产者连接到慢速消费者时，生产者会自动减速。\n\
  \nNode 中最常用的流是 `Readable`、`Writable` 和 `Transform` 流。它们是可用于构建自定义流的基类。其他流类型，例如 `Duplex`\
  \ 流和 `Passthrough` 流，本书不涉及。`Readable` 流用于读取输入数据，`Transform` 流通常用于修改数据块，而 `Writable`\
  \ 流接收数据并将其写入某处（例如文件）。\n\n今天我们将编写一个命令，使用流将 CSV 文件中的数据通过管道传输到 CouchDB/PouchDB 中。我们也可以编写一个导入器来从数据库（例如\
  \ Postgres 或 MongoDB）迁移数据，但使用纯 CSV 文件则无需安装新的数据库。该原理同样适用于文件和数据库这两种数据源。在本章末尾，我将提供一个示例链接，展示如何构建\
  \ Node.js 流管道，将数据从 MongoDB 迁移到 CouchDB/PouchDB。\n\n## 第一个流\n\n构建流有时会有点棘手。我们首先在模块的根目录下创建文件\
  \ `stream-example.js`。\n\n我们的第一个迭代版本会将 CSV 内容输出到 `stdout`。我们将用它来学习流的工作原理，并在此基础上构建导入器。开发时，我们需要一个\
  \ CSV 文件；可以将其保存到 `test/fixtures/test.csv`：\n\n```\ntime;location\nmarch;austin,us\n\
  april;boston,us\noctober;bristol,uk\nfebruary;hermigua,es\nmarch;hermigua,es\napril;havana,cu\n\
  ```\n\n幸运的是，我们不需要自己编写流式 CSV 解析器：\n\n```\n$ npm install --save csv-parse\n```\n\n\
  我们引用 `fs` 和 `util` 模块。`fs` 模块用于从磁盘读取 CSV 文件。我们还需要引用 CSV 解析器：\n\n```\nconst parse\
  \ = require('csv-parse');\nconst fs = require('fs');\nconst Transform = require('stream').Transform;\n\
  ```\n\n我们的自定义流名为 `MyTransformStream`，继承自 `stream.Transform`。我们将流设置为 `objectMode`，以便能够处理来自\
  \ CSV 解析器的 JSON 输入：\n\n```\nclass MyTransformStream extends Transform {\nconstructor\
  \ (options = { objectMode: true }) {\noptions.objectMode = true;\nsuper(options);\n\
  }\n}\n```\n\n`Transform` 流必须实现一个方法：`_transform`。该方法是我们刚刚创建的类的一部分，在处理每个数据块时被调用。在\
  \ `_transform` 方法中，我们可以将数据块转换为新的内容。转换后的数据随后通过 `this.push` 推送给下一个消费者。处理完成后，我们调用 `done`\
  \ 回调来表明该数据块处理完毕。目前，我们只是想看看数据块的样子：\n\n```\n_transform (chunk, encoding, done) {\n\
  console.log('chunk: ', chunk);\nthis.push(chunk);\ndone();\n}\n```\n\n最后一步，我们需要将\
  \ CSV 文件通过管道传给 CSV 解析器，再将解析后的输出传给我们的自定义流：\n\n```\nconst opts = {comment: '#', delimiter:\
  \ ';', columns: true};\nconst parser = parse(opts);\nconst input = fs.createReadStream(__dirname\
  \ + '/test/fixtures/test.csv');\ninput\n.pipe(parser)\n.pipe(new MyTransformStream());\n\
  ```\n\n现在运行 `node streams-example.js`，我们会得到以下输出：\n\n```\n$ node streams-example.js\n\
  chunk:  { time: 'march', location: 'austin,us' }\nchunk:  { time: 'april', location:\
  \ 'boston,us' }\nchunk:  { time: 'october', location: 'bristol,uk' }\nchunk:  {\
  \ time: 'february', location: 'hermigua,es' }\nchunk:  { time: 'march', location:\
  \ 'hermigua,es' }\nchunk:  { time: 'april', location: 'havana,cu' }\n```\n\n每个数据块都是一个\
  \ JSON 对象。每次我们调用 `done` 并且仍有输入产生时，`_transform` 会被下一个数据块再次调用。我们现在可以将每个数据块通过 HTTP\
  \ 请求发往 CouchDB/HTTP API。这样内存占用会非常低，但也会发送大量 HTTP 请求，整个迁移过程会耗时很长。一个折中的好办法是缓冲少量数据块，然后通过\
  \ CouchDB/PouchDB 的批量 API 进行提交。这样既能避免缓存所有现有数据导致内存溢出，也能因为减少 HTTP 请求数量而更快完成导入。\n\n\
  **注意**  \n本节的代码可以在 `sourcecode/streams/streams-example.js` 找到。\n\n\n\n## 转换流与可写流\n\
  \n接下来要创建的流，我们将在 lounger 的根目录中新建 `streams-bulk-example.js` 文件。该文件将从 CSV 解析流中获取对象并进行缓冲。当达到指定限制时，它会将缓冲的对象传递给下一个消费者。传递给下一个消费者的结果已准备好用于提交至\
  \ `CouchDB`/`PouchDB` 的批量文档 API 端点。`CouchDB`/`PouchDB` 的批量 API 接受一个被 `{\"docs\"\
  : []}` 包裹的对象数组。\n\n### 创建包裹转换流\n\n我们从开发 `Transform` 流所需的相同模块集合开始：\n\n```\nconst\
  \ parse = require('csv-parse');\nconst fs = require('fs');\nconst Transform = require('stream').Transform;\n\
  ```\n\n我们的流将被命名为 `TransformToBulkDocs`，它将接收一个对象作为选项。通过选项，我们可以指定要缓冲的文档数量：\n\n```\n\
  class TransformToBulkDocs extends Transform {\nconstructor (options = { objectMode:\
  \ true, bufferedDocCount: 200 }) {\noptions.objectMode = true;\nsuper(options);\n\
  ```\n\n用于 `this.buffer` 的空数组将成为我们的缓冲器：\n\n```\nthis.buffer = [];\nthis.bufferedDocCount\
  \ = options.bufferedDocCount;\n```\n\n以下是不包含 `_transform` 方法的完整类：\n\n```\nclass\
  \ TransformToBulkDocs extends Transform {\nconstructor (options = { objectMode:\
  \ true, bufferedDocCount: 200 }) {\noptions.objectMode = true;\nsuper(options);\n\
  this.buffer = [];\nthis.bufferedDocCount = options.bufferedDocCount;\n}\n}\n```\n\
  \n在 `_transform` 方法中，我们将每个数据块添加到缓冲器中：\n\n```\n_transform (chunk, encoding, done)\
  \ {\nthis.buffer.push(chunk);\n```\n\n如果缓冲器增长到足够大，我们调用 `this.push` 方法，该方法继承自基础 `Transform`\
  \ 流。`this.push(args)` 告知 Node 我们希望将 `args` 传递给流管道中的下一个消费者。然后我们清空缓冲器，以便接收可能到达的新数据：\n\
  \n```\nif (this.buffer.length >= this.bufferedDocCount) {\nthis.push({docs: this.buffer});\n\
  this.buffer = [];\n}\ndone();\n}\n```\n\n以下是完整的 `_transform` 方法：\n\n```\n_transform\
  \ (chunk, encoding, done) {\nthis.buffer.push(chunk);\nif (this.buffer.length >=\
  \ this.bufferedDocCount) {\nthis.push({docs: this.buffer});\nthis.buffer = [];\n\
  }\ndone();\n}\n```\n\n我们文件的最后一部分与第一个流示例几乎相同：\n\n```\nconst opts = {comment: '#',\
  \ delimiter: ';', columns: true};\nconst parser = parse(opts);\nconst input = fs.createReadStream(__dirname\
  \ + '/test/fixtures/test.csv');\ninput\n.pipe(parser)\n.pipe(new TransformToBulkDocs());\n\
  ```\n\n我们向代码中添加一个临时的 `console.log` 来验证是否正常工作：\n\n```\nif (this.buffer.length >=\
  \ this.bufferedDocCount) {\nthis.push({docs: this.buffer});\nconsole.log({docs:\
  \ this.buffer});\nthis.buffer = [];\n}\n```\n\n当我们运行 `node streams-bulk-example.js`\
  \ 时，发现它没有生效！为什么？\n\n问题在于我们没有足够的文档来达到默认的 200 个文档计数。同样的道理也适用于一组中剩余的文档。如果我们初始有 250\
  \ 个文档作为输入，前 200 个会被推送到下一个消费者，但剩下的 50 个会丢失。幸运的是，Node.js 开发者意识到了这个问题，并提供了 `_flush`\
  \ 方法。与 `_transform` 方法不同，`_flush` 方法并非实现 `Transform` 流的必需方法。相反，我们可以在需要时才选择实现它。\n\
  \n`Transform` 类的 `_flush` 方法会在流消费完所有数据之后、但在流触发标志流结束的 `end` 事件之前，在最后时刻被调用。`_flush`\
  \ 会在最后时刻被调用，如果此时我们仍有少量缓冲的文档，我们可以将它们推送给下一个消费者：\n\n```\n_flush (done) {\nthis.buffer.length\
  \ && this.push({docs: this.buffer});\ndone();\n}\n```\n\n这就是我们第一个自定义流！别忘了移除我们添加的\
  \ `console.log` 调用！\n\n管道中的下一个消费者将接收收集到的文档，并将它们提交给 `CouchDB`/`PouchDB` 的批量文档端点。由于流能够处理背压，其他流会等待我们成功将文档添加到\
  \ `CouchDB`/`PouchDB` 后，再继续沿着管道向我们传递数据。\n\n接下来我们要构建的流将接收来自 `Transform` 流的数据，并将其写入数据库。我们将在下一步添加该流。\n\
  \n\n\n#### 将结果通过管道传输至可写流\n\n现在，我们将数据通过管道传输至一个`Writable`流，并将其添加到`streams-bulk-example.js`文件中。`Writable`流可以接收来自消费者的数据，并将其导向新位置。一个`Writable`文件流会将数据分块写入硬盘。\n\
  \n```javascript\nconst Writable = require('stream').Writable;\n```\n\n我们的`Writable`流需要知道数据存储的位置，因此需要向其传递数据库\
  \ URL。由于流的每个方法都会针对每个数据块被调用，我们需要将传递进来的 URL 存储为`this.url`：\n\n```javascript\nclass\
  \ CouchBulkImporter extends Writable {\n  constructor (options) {\n    if (!options)\
  \ {\n      options = {};\n    }\n    if (!options.url) {\n      const msg = [\n\
  \        'options.url must be set',\n        'example:',\n        \"new CouchBulkImporter({url:\
  \ 'http://localhost:5984/baseball'})\"\n      ].join('\\n')\n      throw new Error(msg);\n\
  \    }\n    options.objectMode = true;\n    super(options);\n    // sanitise url,\
  \ remove trailing slash\n    this.url = options.url.replace(/\\/$/, '');\n  }\n\
  }\n```\n\n要实现`Writable`流的子类，我们需要实现`_write`方法。与`Transform`流的`_transform`方法类似，`_write`方法会在每个从前一个生产者传递到该流的数据块被调用时执行。在我们的例子中，我们通过`request`将\
  \ JSON 数据块以 JSON 格式发送到数据库。在成功将数据发送到`/_bulk_docs` API 端点后，我们调用`done`回调来表明已准备好接收新的数据块：\n\
  \n```javascript\n_write (chunk, enc, done) {\n  request({\n    json: true,\n   \
  \ uri: this.url + '/_bulk_docs',\n    method: 'POST',\n    body: chunk\n  }, function\
  \ (err, res, body) {\n    if (err) {\n      return done(err);\n    }\n    if (!/²../.test(res.statusCode))\
  \ {\n      const msg = 'CouchDB server answered: \\n Status: ' +\n        res.statusCode\
  \ + '\\n Body: ' + JSON.stringify(body);\n      return done(new Error(msg));\n \
  \   }\n    done();\n  });\n}\n```\n\n我们还需要在文件中引入`request`：\n\n```javascript\nconst\
  \ request = require('request');\n```\n\n要使用该流，我们必须将数据通过管道传输进去。我们更新`streams-bulk-example.js`的最后部分：\n\
  \n```javascript\ninput\n  .pipe(parser)\n  .pipe(new TransformToBulkDocs())\n  .pipe(new\
  \ CouchBulkImporter({url: 'http://127.0.0.1:5984/travel'}));\n```\n\n在创建数据库`travel`并运行脚本后，我们导入\
  \ CSV 文件：\n\n```bash\n$ curl -X PUT http://localhost:5984/travel\n{\"ok\":true}\n\
  $ node streams-bulk-example.js\n$ curl http://localhost:5984/travel/_all_docs\n\
  {\"total_rows\":6,\"offset\":0,\"rows\":[{\"id\":\"3444bf7c-65c0-438f-f8e8-7f55124f1736\"\
  ,\"key\":\"3444bf7c-65c0-438f-f8e8-7f55124f1736\",\"value\":{\"rev\":\"1-37fcd2e5b40939805b8e043da44f9b1d\"\
  }},{\"id\":\"568c3b0f-78fe-43a2-9eac-06620cfaa595\",\"key\":\"568c3b0f-78fe-43a2-9eac-06620cfaa595\"\
  ,\"value\":{\"rev\":\"1-e047788bac9aada0564fc928642d3960\"}},{\"id\":\"5d170e63-d845-4e45-f760-97e30cbc4b21\"\
  ,\"key\":\"5d170e63-d845-4e45-f760-97e30cbc4b21\",\"value\":{\"rev\":\"1-6f1794e4eb24b60665fe02c2624d53eb\"\
  }},{\"id\":\"9cd34a61-8a48-4b88-afbf-7fd6e3c9cf42\",\"key\":\"9cd34a61-8a48-4b88-afbf-7fd6e3c9cf42\"\
  ,\"value\":{\"rev\":\"1-747b11a103cc0fe31d1c546ef70d69c0\"}},{\"id\":\"cc7da504-438a-40c1-842b-4722b63c9a37\"\
  ,\"key\":\"cc7da504-438a-40c1-842b-4722b63c9a37\",\"value\":{\"rev\":\"1-0f9e7add8b7fbb773dc7d3081475d855\"\
  }},{\"id\":\"f09811c5-43ec-4a6d-bd3b-b34b3674676d\",\"key\":\"f09811c5-43ec-4a6d-bd3b-b34b3674676d\"\
  ,\"value\":{\"rev\":\"1-d677c5bbbee1bbbe45f6128a9cf1fe8d\"}}]}\n```\n\n我们可以通过使用数据库自动分配给每个文档的\
  \ ID 来访问单个文档：\n\n```bash\n$ curl http://localhost:5984/travel/3444bf7c-65c0-438f-f8e8-7f55124f1736\n\
  {\"time\":\"february\",\"location\":\"hermigua,es\",\"_id\":\"3444bf7c-65c0-438f-f8e8-7f55124f1736\"\
  ,\"_rev\":\"1-37fcd2e5b40939805b8e043da44f9b1d\"}\n```\n\n看起来很棒！看来我们已经万事俱备，可以在命令行客户端中使用这些底层流处理函数了。\n\
  \n> **注意：** 本节代码位于 `sourcecode/streams/streams-bulk-example.js`。\n\n## 流式导入命令\n\n\
  在本章的剩余部分，我们将复用刚刚创建的自定义流实现。在实际项目中，我会为我们的两个流创建两个模块，使其可以在多个项目中复用。现在，我们可以将`CouchBulkImporter`和`TransformToBulkDocs`流的代码复制到`lib/csv.js`中，该文件将作为我们导入命令的核心：\n\
  \n```javascript\nconst parse = require('csv-parse');\nconst fs = require('fs');\n\
  const Transform = require('stream').Transform;\nconst util = require('util');\n\
  const Writable = require('stream').Writable;\nconst request = require('request');\n\
  const lounger = require('./lounger.js');\n\nclass TransformToBulkDocs extends Transform\
  \ {\n  constructor (options) {\n    if (!options) {\n      options = {};\n    }\n\
  \    if (!options.bufferedDocCount) {\n      options.bufferedDocCount = 200;\n \
  \   }\n    options.objectMode = true;\n    super(options);\n    this.buffer = [];\n\
  \    this.bufferedDocCount = options.bufferedDocCount;\n  }\n\n  _transform (chunk,\
  \ encoding, done) {\n    this.buffer.push(chunk);\n    if (this.buffer.length >=\
  \ this.bufferedDocCount) {\n      this.push({docs: this.buffer});\n      this.buffer\
  \ = [];\n    }\n    done();\n  }\n\n  _flush (done) {\n    this.buffer.length &&\
  \ this.push({docs: this.buffer});\n    done();\n  }\n}\n\nclass CouchBulkImporter\
  \ extends Writable {\n  constructor (options) {\n    if (!options) {\n      options\
  \ = {};\n    }\n    if (!options.url) {\n      const msg = [\n        'options.url\
  \ must be set',\n        'example:',\n        \"new CouchBulkImporter({url: 'http://localhost:5984/baseball'})\"\
  \n      ].join('\\n');\n      throw new Error(msg);\n    }\n    options.objectMode\
  \ = true;\n    super(options);\n    // sanitize url, remove trailing slash\n   \
  \ this.url = options.url.replace(/\\/$/, '');\n  }\n\n  _write (chunk, enc, done)\
  \ {\n    request({\n      json: true,\n      uri: this.url + '/_bulk_docs',\n  \
  \    method: 'POST',\n      body: chunk\n    }, function (err, res, body) {\n  \
  \    if (err) {\n        return done(err);\n      }\n      if (!/²../.test(res.statusCode))\
  \ {\n        const msg = 'CouchDB server answered: \\n Status: ' +\n          res.statusCode\
  \ + '\\n Body: ' + JSON.stringify(body);\n        return done(new Error(msg));\n\
  \      }\n      done();\n    });\n  }\n}\n```\n\n### 设计命令行\n\n让我们思考一下即将构建的命令。CSV\
  \ 文件可以有不同的分隔符；有些使用分号作为分隔符，而有些则使用逗号或制表符。表示注释的符号也可能不同。在我们之前的实现中，我们使用了固定值：\n\n```javascript\n\
  const opts = {comment: '#', delimiter: ';', columns: true};\n```\n\n对于实际应用场景，分隔符和注释符号必须是可配置的。CSV\
  \ 输入通常来自文件。\n\n以下是一个可能的 CLI 示例：\n\n```bash\n$ lounger csv transfer   [--delimiter=;]\
  \ [--comment=#] [--chunksize=200]\n```\n\n`csv`命令具有良好的扩展性，未来可以承载所有与 CSV 相关的命令。该命令读起来非常顺畅且易于记忆：`lounger\
  \ csv transfer <file> <database>` 读起来几乎就像 `lounger [do] csv transfer [from] <file>\
  \ [to] <database>`。合理的默认值帮助我们完全避免传递可选修饰符，但如果需要修改它们，我们可以更改导入的每个重要方面。\n\n我不确定你是否注意到，在我们之前使用流的时候，必须提前通过\
  \ curl 创建目标数据库。如果我们的 CLI 用户不必自行创建目标数据库，那将非常方便。我们的目标是帮助他们尽可能快速、轻松地完成任务，因此我们应该在必要时自动创建数据库。接下来，我们将添加一个辅助函数来创建数据库。\n\
  \n\n\n### 创建目标数据库\n\n为了让用户使用起来更便捷，我们将添加一个创建目标数据库的函数。这样一来，可以确保命令工作流不会遇到重大障碍。`createTargetDatabase`\
  \ 函数是一个辅助函数，它将 `request` 封装成 Promise。如果数据库已创建（HTTP 状态码 201 或 200），或者数据库已存在（HTTP\
  \ 状态码 412），则 Promise 将会被 resolve；其他所有状态都会导致 Promise 被 reject：\n\n```\nfunction createTargetDatabase\
  \ (url) {\nreturn new Promise((resolve, reject) => {\nrequest({\njson: true,\nuri:\
  \ url,\nmethod: 'PUT',\nbody: {}\n}, function (er, res, body) {\nif (er && (er.code\
  \ === 'ECONNREFUSED' || er.code === 'ENOTFOUND')) {\nconst err = new Error(\n'无法连接到\
  \ ' + url + '。请检查数据库是否在运行'\n);\nerr.type = 'EUSAGE';\nreturn reject(err);\n}\nif\
  \ (er) {\nreturn reject(er);\n}\nconst code = res.statusCode;\nif (code !== 200\
  \ && code !== 201 && code !== 412) {\nconst msg = 'CouchDB 服务器响应：\\n 状态：' +\nres.statusCode\
  \ + '\\n 正文：' + JSON.stringify(body);\nreturn reject(new Error(msg));\n}\nresolve();\n\
  });\n});\n}\n```\n\n如果出现 `ECONNREFUSED` 或 `ENOTFOUND` 错误，我们可以合理地推断数据库当前处于离线状态，并请用户检查数据库是否可用。我再怎么强调**正确处理错误**的重要性也不为过。来看这个例子，我们收到了\
  \ `ECONNREFUSED` 错误：\n\n```\n$ ./bin/lounger-cli csv transfer test/fixtures/test.csv\
  \ http://127.0.0.1:1337/testimport\nERR! connect ECONNREFUSED 127.0.0.1:5984\nERR!\
  \ Error: connect ECONNREFUSED 127.0.0.1:5984\nERR!     at Object.exports._errnoException\
  \ (util.js:870:11)\nERR!     at exports._exceptionWithHostPort (util.js:893:20)\n\
  ERR!     at TCPConnectWrap.afterConnect [as oncomplete] (net.js:1063:14)\nERR!\n\
  ERR!\nERR! lounger: 1.0.0 node: v9.1.0\nERR! 请在 http://example.com/lounger/issues\
  \ 上提交包含此日志的 issue\n```\n\n根据用户之前使用 Node.js 的经验，他们可能会非常困惑。他们唯一能继续下去的方法就是去问搜索引擎或者提交一个\
  \ issue。收到 issue 后，我们乏味的工作就是关闭它，并告诉他们可能是 URL 拼写错误了。\n\n在编写 `createTargetDatabase`\
  \ 函数之后，我们应该已经准备好了所有辅助函数。像往常一样，我们通过实现 API 命令来开始实现主要的 CLI 函数，然后我们将用 CLI 函数来包装它。\n\n\
  分隔符和注释选项在配置文件中定义，或者通过命令行传递。要知道它们的值，我们需要与 `lounger.config` 交互。要访问 `lounger.config`，我们需要引入它：\n\
  \n```\nconst lounger = require('./lounger.js');\n```\n\n主要的 API 函数会检查是否提供了所有必要的参数，如果配置文件中或命令行没有传入配置，则应用默认值。如果数据库尚不存在，我们会创建它，并将任务委托给\
  \ `importFromCsvFile` 辅助函数：\n\n```\nexports.api = {\ntransfer: bulkdocsImport\n\
  };\nfunction bulkdocsImport (file, targetDb) {\nreturn new Promise((resolve, reject)\
  \ => {\nconst opts = {};\nif (!file && !targetDb) {\nreturn reject(new Error('缺少\
  \ file 和/或 targetDb 参数'));\n}\nopts.delimiter = lounger.config.get('delimiter')\
  \ || ';';\nopts.comment = lounger.config.get('comment') || '#';\nopts.chunksize\
  \ = lounger.config.get('chunksize') || 200;\ncreateTargetDatabase(targetDb)\n.then(()\
  \ => {\nreturn importFromCsvFile(file, targetDb, opts);\n}).catch(reject);\n});\n\
  }\n```\n\n`importFromCsvFile` 函数接收源 CSV 文件、URL 和选项，并创建流管道。与我们之前在 `streams-example.js`\
  \ 中的代码相比，主要区别在于我们添加了适当的错误处理来捕获所有错误：\n\n```\nfunction importFromCsvFile (file, url,\
  \ opts) {\nreturn new Promise((resolve, reject) => {\nconst options = {comment:\
  \ opts.comment, delimiter: opts.delimiter, columns: true};\nconst parser = parse(options);\n\
  const input = fs.createReadStream(file);\ninput\n.pipe(parser)\n.on('error', reject)\n\
  .pipe(new TransformToBulkDocs({bufferedDocCount: opts.chunksize}))\n.on('error',\
  \ reject)\n.pipe(new CouchBulkImporter({url: url}))\n.on('error', reject);\n});\n\
  }\n```\n\nCLI 函数最终包装了我们的 API 方法，并增加了友好的错误信息：\n\n```\nexports.cli = importCli;\n\
  function importCli (cmd, file, target) {\nreturn new Promise((resolve, reject) =>\
  \ {\nif (!cmd || cmd !== 'transfer' || !file || !target) {\nconst err = new Error(\n\
  '使用方法：lounger csv transfer   [--delimiter=;] [--comment=#] [--chunksize=200]'\n\
  );\nerr.type = 'EUSAGE';\nreturn reject(err);\n}\nreturn bulkdocsImport(file, target).catch(reject);\n\
  });\n}\n```\n\n我们引入了三个新选项：`delimiter`、`comment` 和 `chunksize`。`lounger.config` 允许我们的用户通过使用配置文件来设置默认值。此外，我们还需要确保这些选项能在命令行上被解析。在\
  \ `bin/lounger-cli` 中，我们需要向 `nopt` 注册我们的可选参数：\n\n```\nconst parsed = nopt({\n'json':\
  \ [Boolean],\n'delimiter': [String],\n'comment': [String],\n'chunksize': [Number]\n\
  }, {'j': '--json'}, process.argv, 2);\n```\n\n搞定了！我们创建了一个能够将大量数据流式传输到数据库的命令。\n\n\
  如果你对一个能将数据从 MongoDB 流式传输到 CouchDB 的流管道感兴趣，可以查看 [`https://github.com/robertkowalski/couchbulkimporter/blob/master/examples/mongo.js`](https://github.com/robertkowalski/couchbulkimporter/blob/master/examples/mongo.js)。\n\
  \n注意\n\n本节代码位于 `sourcecode/streams`。欢迎使用！\n\n## 总结\n\n通过流，我们找到了一种处理无法加载到内存中的大量数据的方法。基于流的概念，我们构建了一个能够处理海量数据的导入器。作为最后一步，我们将所有内容集成到了命令行客户端。希望你喜欢这段关于流的探险之旅！\n\
  \n"
- "# 附录 A：技巧与建议\n\n这个简短的附录提供了一些关于 Node.js 开发的一般性技巧与建议。\n\n## 测试\n\n通过完善的单元测试和集成测试，可以确保新功能或错误修复不会引入回归问题。许多优秀的服务提供商都提供托管的持续集成（CI）环境。它们可以在每个拉取请求合并之前进行测试，这大大简化了代码审查工作。一个流行的托管\
  \ CI 服务是 Travis CI。Travis CI 对开源项目是免费的。\n\n## 使用 SemVer 进行语义化版本控制\n\n我建议遵循 SemVer（[`http://semver.org/`](http://semver.org/)）的语义化版本控制规范。SemVer\
  \ 将版本的版本号分为三个部分：MAJOR.MINOR.PATCH。版本 3.5.8 中，3 是主版本号，5 是次版本号，8 是补丁号。如果新版本包含不兼容的\
  \ API 修改，则主版本号递增。新增功能只需递增次版本号，而错误修复则只需递增补丁号。\n\n举个例子：我的包版本是 3.5.7。我添加了一个不影响向后兼容性的新功能。我的下一个版本就会是\
  \ 3.6.0。\n\n通过这种方式，你的用户就能大致了解某个版本是否会破坏他们的生产代码（主版本）、是否包含新功能（次版本），或者是否包含错误修复（补丁）。semantic-release（[`www.npmjs.com/package/semantic-release`](https://www.npmjs.com/package/semantic-release)）是一个能帮助你为下一个版本号递增做出正确决定的优秀工具。\n\
  \n\n\n## Greenkeeper\n\n跟踪项目中哪些依赖项有新版本需要更新可能是一件乏味的事情。更新本身（在 `package.json` 文件中修改版本号）也并非世上最有趣的任务。一项令人兴奋的新服务是\
  \ [`http://greenkeeper.io`](http://greenkeeper.io)。一旦你为项目注册了它，它就会向你发送包含依赖项更新版本的拉取请求。如果你的测试套件已就绪并且所有状态都是“绿灯”，那么你只需合并来自\
  \ Greenkeeper 机器人的拉取请求即可。\n\n测试、自动运行测试的持续集成服务、SemVer 以及 Greenkeeper 结合起来才能真正发挥它们的优势。\n\
