  ## 前言\n\n命令行客户端无处不在。几乎每个人，至少在技术领域，都在使用它们。\n\n许多成功的命令行客户端可供使用：Linux 项目有 Git，Node.js\
  \ 项目有 npm。我们每天都会多次使用其中的一些。Apache CouchDB 最近推出了 `nmo`（发音为 *nemo*），一个用于管理数据库集群的工具。我们可以从成功的命令行界面中学到很多东西，以便编写出更好的命令行客户端。\n\
  \n当我开始对命令行客户端产生兴趣时，我意识到网络上有很多关于编写 API 的讨论和信息。网络上有大量教程可以教你如何构建 API，尤其是 REST API，但关于如何编写优秀的命令行界面（CLI）的资料却几乎找不到。本书解释了优秀\
  \ CLI 的构成要素。在本书的第二部分，你将构建一个小型命令行客户端，学习如何使用 Node.js 创建人们喜爱的、出色的命令行客户端。\n\n本书的目标是展示构建成功命令行界面的原则。所提供的代码应能让你很好地理解构建成功命令行界面的关键要素以及如何实现它们。\n\
  \n每个章节都有其独立的代码示例。在运行代码之前，你需要在对应章节的文件夹中运行 `npm install`。\n\n你可以从 [`https://github.com/theclibook/theclibook/archive/1.0.zip`](https://github.com/theclibook/theclibook/archive/1.0.zip)\
