    # 3. 解构


    对象字面量和数组可能是JavaScript中使用最广泛的符号之一。这些JavaScript符号的流行甚至扩展到了语言之外，体现在`JSON`数据格式中。在JavaScript中，对象和数组通常用于分组数据，并且存在多种模式，以便在需要时系统地从中提取数据。ES6通过一个称为解构的过程，使这一过程更加容易和简单，进一步扩展了这种能力。


    ## 对象和数组的解构


    解构基本上是一种将数据结构分解为更小部分，以便更容易访问其数据并从对象或数组中提取多个值的便捷方式。为了更好地理解解构，只需将其视为从对象或数组进行结构化赋值。考虑以下示例：


    ```javascript

    var letters = [''a'', ''b'', ''c''],

    x = letters[0],

    y = letters[1],

    z = letters[2];

    console.log( x, y, z );             // a b c

    ```


    在上面的例子中，我们给一个名为`letters`的数组赋值，然后通过`letters`变量上的索引给变量`x`、`y`和`z`赋值。让我们看另一个使用对象的例子：


    ```javascript

    var numbers = {a: 1, b: 2, c: 3},

    a = numbers.a,

    b = numbers.b,

    c = numbers.c;

    console.log( a, b, c );             // 1 2 3

    ```


    在这个例子中，我们使用`numbers.a`的值来给变量`a`赋值，类似地，使用`numbers.b`和`numbers.c`来给`b`和`c`赋值。ES6通过一种称为解构的新专用语法，使这种结构化赋值模式更加简单。这种语法消除了对临时中间变量（`letters`和`numbers`）的需求。考虑以下示例：


    ```javascript

    var [ x, y, z ] = [''a'', ''b'', ''c''];

    var { a: a, b: b, c: c } = {a: 1, b: 2, c: 3};

    console.log( x, y, z );             // a b c

    console.log( a, b, c );             // 1 2 3

    ```


    注意


    我们通常习惯在赋值语句的右侧看到像`{a: a, b:b, c:c }`和`[x, y, z]`这样的对象和数组语法。解构翻转了这种模式，将它们放在左侧，并带有变量声明关键字，允许你将右侧分解为单独的值，并将它们分配给左侧的变量。


    如前面的两个示例所示，在ES6之前，从对象和数组中获取信息并将其放入局部变量需要更多的代码。想象一下，你需要从一个非常大的对象或数组中提取值，并将它们存储到同名的变量中。你必须编写大量代码逐个赋值，但使用解构，这个过程简化为一个单一的赋值语句。


    使用解构将数据结构分解为更小的部分，使得获取所需数据变得更加容易。此外，ES6中的解构使用了对象和数组字面量语法，这对传统的JavaScript用户来说已经非常熟悉。


    ### 对象解构语法


    让我们更仔细地看一下对象解构语法。我们看到的对象解构语法是：


    ```javascript

    var { a: a, b: b, c: c } = {a: 1, b: 2, c: 3};

    ```


    在这个例子中，你可以注意到，被赋值的变量名与返回对象的属性名相同。但它们不必相同，你可以为被赋值的局部变量使用任何名称。但是，如果它们相同，则可以通过省略`"a:
    "`部分来进一步缩短语法。这个声明语句可以直接写成：


    ```javascript

    var { a, b, c } = {a: 1, b: 2, c: 3};

    console.log( a, b, c );             // 1 2 3

    ```


    使用更短的语法而不是长形式对我们来说非常有意义，除非你想将属性赋值给一个不同的变量名。但是在使用长形式时，有一个重要的细微差别你需要小心。考虑以下示例：


    ```javascript

    var { a: foo, b: bar, c: baz } = {a: 1, b: 2, c: 3};

    console.log( foo, bar, baz );         // 1 2 3

    console.log( a, b, c );               // ReferenceError

    ```'
