- fmt: '# Object Literal Extensions


    ES6 introduces some new extensions for Object Literals.


    To declare object literals, currently using variables we have to use the following
    coding pattern:


    ```

    var price = 4.20, quantity = 20;

    var invoiceData = {

    price: price,

    quantity: quantity

    };

    console.log(invoiceData);

    ```


    Declaring `price` and `quantity` twice is kind of redundant, but now ES6 offers
    a shorthand making writing this simpler. Check the following example:


    ```

    const price = 4.20, quantity = 20;

    const invoiceData = {

    price,

    quantity

    };

    console.log(invoiceData);

    ```


    We can just list the field once and the object literal in ES6 is smart enough
    to interpret that we want a field called `price` and want the context data set
    to the value of the variable called `price`. This shorthand notation reduces code
    and also makes it easier to read.


    ES6 also gives us a short notation to write functions in an object literal. Check
    the following code snippet, for example:


    ```

    const price = 4.20, quantity = 20;

    const invoiceData = {

    price,

    quantity,

    calculateTotal() {

    return this.price * this.quantity;

    }

    };

    console.log(invoiceData.calculateTotal());

    ```


    In the above shorthand notation, you no longer need the keyword `function`. When
    we use the function shorthand within an object literal, `this` refers to the context
    of the code just like an arrow function. It does not refer to the object that
    contains the function. It behaves exactly like an arrow function.


    Note that you can use dynamic field names in an object literal:


    ```

    const field = ''dynamicRandom'';

    const price = 5.99;

    const quantity = 2;

    const invoiceData = {

    [field]: price,

    quantity,

    calculateTotal() {

    return this.price * this.quantity;

    }

    };

    console.log(invoiceData);

    // { dynamicRandom: 5.99,

    //   quantity: 2,

    //   caculateTotal: [Function: calculateTotal] }

    ```


    The field in the object gets assigned the name `dynamicField`. You can actually
    use an entire expression and make naming properties even more dynamic:


    ```

    const field = ''dynamicRandom'';

    const price = 5.99, quantity = 2;

    const invoiceData = {

    [field + "-01"]: price,

    quantity,

    calculateTotal() {

    return this.price * this.quantity;

    }

    };

    console.log(invoiceData);

    // { dynamicRandom-01: 5.99,

    //   quantity: 2,

    //   caculateTotal: [Function: calculateTotal] }

    ```


    You can actually create a dynamic field name in a method as well. They work with
    setters and getters as well.


    ## Template Literals and Delimiters


    Strings in JavaScript have been historically limited, lacking the capabilities
    one might expect coming from other programming languages. ES6 introduces Template
    Literals, which provide you a way to define strings with additional functionalities
    like:


    * String interpolation

    * Embedded expressions

    * Multiline strings without hacks

    * String formatting


    Template Literals use backticks (`` ` ``) rather than the single or double quotes.
    Template literals, in the end, always produce strings. A template literal can
    be written as follows:


    ```

    let user = `Kevin`;

    ```


    Template literals allow string substitutions that provide us a way to substitute
    any valid JavaScript expression inside a string. Template Literals can contain
    placeholders for string substitution using the `${ }` syntax. Consider the following
    example:


    ```

    console.log(`Hi ${user}!`); // Hi Kevin!

    ```


    In the above example, the template literal is delimited by backticks (`` ` ``)
    and the interpolated expressions inside the literal are delimited by `${` and
    `}`.


    We can also substitute a lot more than variable names. Template Literals allow
    us to use expression interpolation to embed readable inline math, for example:


    ```

    let a = 10;

    let b = 20;

    console.log(`Sum of ${a} and ${b} is ${a+b}`);

    ```


    Template literals also allow you to add multiline strings easily (without the
    use of `\n`):


    ```

    console.log(`I am line-one

    I am line-two`);

    // I am line-one

    // I am line-two

    ```


    ## Tagged Template Literals


    A more advanced form of template literals are tagged template literals. Tagged
    Templates transform a Template String by placing a function name before the template
    string. For example:


    ```

    output`Hi, my name is ${name} and I love ${language}`;

    ```


    This expression can be transformed into a function call that takes two kinds of
    parameters:


    1. Array of literal strings, that is `["Hi, my name is", "and I love", " "]`

    2. Substitutions, that is, `name`, `language`.


    The total number of Literal Strings are always one greater than the number of
    Substitutions. You can consider each substitution wrapped around by two literals
    on each side. That''s why there is an empty string as the last element in the
    array of literal strings above.


    Therefore, the above tagged template can be written as:


    ```

    output(["Hi, my name is ", " and I love ", ""], name, language)

    ```


    The tag functions are typically defined using rest arguments to allow easier parameter
    handling. The above function can be defined as:


    ```

    function output(literals, ...substitutions) {

    let result = "";

    // concatenate literal strings and substitutions

    for (let i=0; i<substitutions.length; i++) {

    result += literals[i] + substitutions[i];

    }

    // concatenate the last element in the literals array

    // there is always one element more than the substitutions array

    result += literals[literals.length - 1];

    return result;

    }

    const  name = ''John'',

    language = ''JavaScript'';

    let text = output`Hi, my name is ${name} and I love ${language}`

    console.log(text); // Hi, my name is John and I love JavaScript

    ```


    Since these functions receive the parts of a Template String as arguments, you
    can then decide how to use the strings and substitutions to determine the final
    output of your string. For instance, you can use the `output` function to convert
    all the characters into uppercase, converge the input into a hash-string, or anything
    you may want.


    ### Iterating with `for...of`


    Over the last two decades in JavaScript, we have been iterating using the `for`,
    `for-in`, and `forEach` (in case of arrays). ES6 introduces another structure,
    the `for...of` loop, which allows iterating over iterable objects such as `array`,
    `map`, `set`, `string`, etc. We will be looking at iterators and iterables more
    closely later in this book. Consider a simple for-loop for iterating over an array:


    ```

    let names = [''matt'', ''smith'', ''jack''];

    for (let i = 0; i<names.length; i++) {

    console.log(names[i]);

    }

    // matt

    // smith

    // jack

    ```'
