- fmt: '### Block Scoping with `let` and `const`


    Quite simply, block scoping means that a new scope is created between a pair of
    `{ }`. The variables declared using the keywords `let` and `const` only exist
    within the innermost block that surrounds them.


    In the following example, what do you think will be printed to the console when
    you execute the following code snippet?


    ```

    let nbr = 42;

    {

    let nbr = 1000;

    }

    console.log(nbr);

    ```


    The value `42` is printed to the console, because the second `nbr` variable is
    scoped to the block within which it is declared and does not affect the `nbr`
    variable outside of the block, where it remains `42`. Normally, you wouldn’t use
    a block like that unless it were in a control flow statement like an `if` condition
    or in a loop, but this explains how a variable is block scoped.


    We now know that `var` is bound to function scope, whereas `let` and `const` are
    block scopes, which means if you''ve got a set of curly brackets (a block of code),
    you have a block scope. But, the catch is you can declare a variable inside of
    its block scope only once.


    On the other hand, unlike `let`, `const` creates immutable variables. The values
    of the variables created using `const` need to be assigned during declaration
    and cannot be changed later in the program.


    Consider the following example:


    ```

    const value = 42;

    console.log(value);   // 42

    value = 1000;         // TypeError

    ```


    **Note**


    Trying to change the value of a `const` variable will throw a `TypeError`. Changing
    an immutable binding in strict mode only causes an exception `SetMutableBinding()`.


    Make sure that you always initialize the variable with a value declared using
    `const`; otherwise it will throw an error. Consider the following example:


    ```

    const item;  // SyntaxError: Missing initializer in const declaration

    ```


    If you need a constant with an `undefined` value, you''d still have to do something
    like this:


    ```

    const value = undefined;

    ```


    If you know that the value of your variables is not going to change throughout
    your code, you should be using `const`; otherwise use `let` to declare your variables.
    We recommend moving away from the practice of using `var` to declare variables
    as it is cleaner, more efficient, and easy to debug if you use block scoping.
    `let` and `const` avoid the source of misunderstanding, especially for programmers
    with expectations set by languages with block scope. `let` and `const` throw an
    exception if you try to access the variables declared by them outside the blocks
    they were declared and do away with hoisting, helping you localize the effects
    of your code fragments.


    Consider the following example to understand how hoisting affects the variables
    declared using the keyword `var`:


    ```

    console.log(nbr);  // undefined

    var nbr = 42;

    ```


    The above example prints `undefined` to the console because of hoisting. When
    we declare the variable `nbr` using `var`, due to hoisting it becomes equivalent
    to declaring the variable at the start of the scope with its value set to `undefined`.
    But if you moved the `console.log` statement after the declaration, it would print
    the number `42`, due to the fact that entering the scope of the variable declared
    using `var`, that is, its surrounding function, creates a binding. The variable
    is then initialized by setting the value to `undefined`. When the execution reaches
    the declaration, this variable is then set to the specified value in the assignment
    statement.


    Let''s take a look at a similar example using `let`:


    ```

    console.log(nbr); // Reference Error: nbr is not defined

    let nbr = 42;

    ```


    This would actually give you a `Reference Error: nbr is not defined` since no
    hoisting takes place here. This can be a big help in debugging different types
    of bugs that can be caused by a variable being used before it is declared. This
    `Reference Error` is technically called a Temporal Dead Zone (TDZ) error because
    you are accessing a variable that''s been declared but not yet initialized.


    ### More on Temporal Dead Zones


    The main takeaway from this discussion is that `let` and `const` declare variables
    with a temporal dead zone (TDZ) , in contrast to the hoisting that happens when
    you use `var`. The variable in the Temporal Dead Zone is not yet initialized with
    any value. A memory binding is created and remains uninitialized when the variable
    is declared. Trying to get or set the variable at this point raises a `Reference
    Error`. When the program flow reaches the declaration, the variable is then set
    to the value specified in the statement; otherwise it is set to `undefined` if
    there is no assignment in the statement.


    `const` works in a similar fashion, the only difference being that it needs an
    initializing value during declaration, which cannot be changed later.


    ```

    let data = true;

    if (true) { // enter new scope, TDZ starts

    // Uninitialized binding for "data" is created

    console.log(data); // ReferenceError

    let data; // TDZ ends, "data" is initialized with "undefined"

    }

    console.log(data); // true

    ```


    As soon as the initialization occurs with the assignment of a value to the variable,
    the TDZ ends.


    The temporal dead zone primarily exists to catch errors. You should not be able
    to access a variable before it is declared, and even if you do by accident you
    should be warned about it. TDZ was the best solution for `const` to work the way
    it does and having `let` also having a TDZ makes switching between them very easy.
    TDZs helps us ensure that a variable in runtime always has the correct value.


    ```

    if (true) {

    console.log(typeof anUndeclaredVariable); // ''undefined''

    console.log(typeof random); // ReferenceError (TDZ)

    let random;

    }

    ```


    Even if you try to access a variable in the temporal dead zone using `typeof`,
    you will get an exception. `typeof` is a safe way to check if a variable exists
    or not. But if a variable is declared using `let` further down in the code, it
    will throw a TDZ error because that variable is in the temporal dead zone when
    you call `typeof`. Therefore, it is a good practice to always make variable declarations
    at the top of your scope. This check is also useful for conditionally creating
    global variables using `var`. You can check if a global variable exists by doing
    something like this:


    ```

    if (typeof globalVariable === ''undefined'') {

    var globalVariable = { ··· };

    }

    ```


    **Note**


    `const` is used to declare an immutable variable but it does not make the value
    contained in the variable immutable.


    In the following code snippet `obj` is a constant, but the value it points to
    is mutable; therefore you can add a property to it but you cannot assign a different
    value to `obj`.


    ```

    const obj = {};

    obj.key = 42;

    console.log(obj.key); // 42

    obj = {}; // TypeError

    ```


    If you wanted to you could make the value itself immutable by freezing it.


    ```

    const obj = Object.freeze({});

    obj.key = 42;

    console.log(obj);   // {}

    ```


    Remember that `Object.freeze()` is shallow. It will only freeze the properties
    of the object passed to it. Only one level of properties of the object become
    immutable and not the objects that might be stored in its properties.'
