- fmt: '# Rest and Spread Operators


    JavaScript has always had the feature of allowing functions to be passed fewer
    or more parameters than formally specified in the function declaration without
    any problems. Default Parameters, as discussed earlier, help you accept fewer
    values as parameters and still have the other parameters assigned a value.


    Many modern programming languages provide the ability for the function to accept
    a variable number of parameters. ES6 introduces this much needed feature to JavaScript
    with Rest Parameters. You now have the ability to pass a function a dynamic number
    of parameters very easily. If you wanted to do this in ES5 you would have to put
    all the values in a data container data type like an array. The Rest Parameters
    simplify this entire process.


    **Note:** Do not confuse this term to the web services concept of REST. This has
    nothing to do with REST in web services. Rest here refers to gathering up parameters
    and putting them all into a single array. Spread refers to spreading out the elements
    of an array (or even a string).


    Let’s look at an example:


    ```

    var showCollections = function (id, ...collection) {

    console.log(collection instanceof Array);

    };

    showCollections(42, "movies", "music");  // true

    ```


    The `...` symbol is the rest symbol. It precedes a named parameter. This named
    parameter will become an Array that will just gather up all the remaining parameters
    passed to the function. Hence here, `collection` is set to an array. To make this
    more clear if we execute the above program this way:


    ```

    var showCollections = function (id, ...collection) {

    console.log(collection);

    };

    showCollections(42, "movies", "music"); // ["movies", "music"]

    ```


    The Rest parameter gathers up all the remaining parameters after the `id` parameter
    and makes it into an array called `collection`. Excluding the first defined parameter
    `''id''`, everything will be placed in the Array.


    If we call the same function by passing it just one value which is the `id`, it
    logs out an empty array `[]`.


    Let’s look at the `length` property of the function. If we call `showCollections.length`,
    it will give us the number of parameters in the function.


    ```

    var showCollections = function (id, ...collection) {};

    console.log(showCollections.length); // 1

    ```


    The `length` property ignores the Rest parameter. In this case, it is 1. The `length`
    property of the function only counts the number of named parameters excluding
    the rest parameter. Now let''s look at the case where we check the `arguments.length`
    inside the function:


    ```

    var showCollections = function (id, ...collection) {

    console.log(arguments.length);

    };

    showCollections(123, "movies", "music"); // 3

    ```


    We already had an `arguments` object, which we can use to check all the parameters
    passed to a function without having to define each parameter specifically. Remember
    we can have both named and unnamed parameters in a function. In this case, even
    though we have two parameters in the function definition, `arguments` object is
    going to refer back to the original function call and three is the number of arguments
    passed to the function.


    In the ES4 specification, Rest parameters were meant to replace `arguments` and
    `arguments` object was completely done away with, but ES4 never came into being
    and in ES6, this concept was reintroduced, but this time the `''arguments''` has
    not been removed from the language.


    We can use the Rest operator in a function constructor. Check the following where
    we are creating a new function that has a rest parameter and returns the very
    first argument that is passed into it.


    ```

    var getFirst = new Function("...args", "return args[0]");

    console.log(getFirst(1, 2));   // 1

    ```


    ## The Spread Operator


    The spread operator, which is also denoted by `...` before an array, does essentially
    the reverse operation of a rest operator. It spreads out an array and passes the
    values into the specified function. Consider the following example:


    ```

    let values = [200, 300, 400];

    let newSet = [100, ...values, 500]

    console.log(newSet);  // [100, 200, 300, 400, 500]

    ```


    The spread operator is very closely related to the rest parameters. In this particular
    format as a spread operator, `...` is used like a concatenation or insertion mechanism
    where the `values` array is inserted in between existing values to assign the
    newly formed array to `newSet`.


    In case of the rest parameters, you can combine multiple arguments into a single
    array, while in case of the spread operator you can specify a single array that
    can be split into separate arguments that can be passed into a function or method.
    Let us look at another example using the `Math.max()` method and the spread operator:


    ```

    let numbers = [-25, 100, 42, -1000];

    console.log(Math.max(...numbers, 900));        // 900

    ```


    In the above case, `Math.max` is passed five arguments, the first four being -25,
    100, 42, and -1000 and another fifth argument we added 900. The result is the
    maximum among them which is 900. Therefore, the spread operator spreads out the
    values in an array as arguments in a function call.


    The spread operator helps in handling arguments to be passed to a function as
    arrays much easier. Just like the rest operator, you can use the spread operator
    in a function constructor as well.


    If we try to spread out an empty array, which might be missing two values like
    `[,,]` the last comma is considered a trailing comma that is ignored. The parameters
    spread out would also be `undefined`. Consider the following example:


    ```

    function printInput(...input) {

    console.log(input);

    }

    let input = [,,];

    printInput(...input); // [undefined, undefined]

    ```'
