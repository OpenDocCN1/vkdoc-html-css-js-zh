    them available privately to the other methods defined in the class. The dynamically
    created symbol value can be saved to a scoped class variable that can be accessed
    only by the internal methods of the class, shielding the private properties from
    unwanted and casual discovery. Consider the following code snippet, for example:


    ```

    const age = Symbol("age");

    class Person {

    constructor(value) {

    this[age] = value;

    }

    getAge() {

    console.log(this[age]);

    }

    }

    const jack = new Person(23);

    console.log(jack);

    // Person {}

    console.log(jack.age);

    // undefined

    console.log(jack[Symbol("age")]);

    // undefined

    jack.getAge();

    // 23

    ```


    In this example, we have a `Person` class that creates a private property using
    Symbols to store the age of the person. As apparent from the code snippet, the
    property is non-enumerable since it returns an empty object and can only be accessed
    via the exposed `getAge()` method . Since Symbols are always unique, accessing
    the private property by creating the symbol with the same label age: `Symbol("age")`
    will only create a new unique symbol, and it will not be able to access the desired
    property of the object.


    ## Symbols and Registry


    So far, we have talked about local symbols and how you can access them by obtaining
    a reference. Symbols can also be placed in a global registry, from where they
    can be accessed across different contexts known as realms. A realm is a context
    in which pieces of code exist such as the page your application is running in,
    or an `<iframe>` within your page, or a web worker with their context containing
    global variables and loaded modules.


    Symbols come with a special power to be available throughout the runtime-wide
    symbol registry, and you can use the following methods to add symbols to the runtime-wide
    symbol registry:


    ```

    Symbol.for(key) and Symbol.keyFor(symbol).

    ```


    ## Symbol.for(key)


    This method looks up existing symbols in the runtime-wide symbol registry with
    the given key. If a symbol with that key exists in the global registry, that symbol
    is returned. If no symbol with that key is found in the registry, a new symbol
    gets created. Consider the following code snippet, for example, where the first
    call to `Symbol.for(''myCar'')` creates a symbol, adds it to the registry, and
    returns it; and the second call returns that same symbol because the key is already
    in the runtime-wide symbol registry:


    ```

    Symbol.for(''myCar'') === Symbol.for(''myCar'')

    // true

    ```


    The runtime global registry keeps track of all the symbols created using `Symbol.for(key)`
    method , which can be accessed across different realms. For instance, a symbol
    created anywhere in your webpage can be accessed in an iframe’s context as well.
    Check the following code snippet (you can run this in your browser’s console):


    ```

    // create an iframe

    const frame = document.createElement(''iframe'');

    // append the iframe to body

    document.body.appendChild(frame);

    console.log(Symbol.for(''temperature'') === frame.contentWindow.Symbol.for(''temperature''));

    // true

    ```


    In the above example, Global Symbol from the webpage’s context is identical to
    the Global Symbol in the iframe, which tells us that the symbols created using
    `Symbol.for(key)` method can be accessed across different realms.


    ## Symbol.keyFor(symbol)


    `Symbol.keyFor(symbol)` retrieves the key from the global symbol registry that
    was associated with the given symbol when the symbol was added to the registry.
    It returns undefined when the symbol is not found in the registry.


    ```

    const symbol = Symbol.for(''myHouse'');

    console.log(Symbol.keyFor(symbol)); // myHouse

    const myCat = Symbol();

    Symbol.keyFor(myCat); // undefined

    ```


    ## Built-In Symbols


    ES6 comes with a range of symbols that are predefined in the language specification,
    most of which expose some meta properties and behaviors of JavaScript objects.
    Some of the well-known symbols are the following:


    `Symbol.hasInstance` - which allows us to determine whether an object is the instance
    of the constructor. It is called by instanceof operator internally.


    Another one is `Symbol.iterator` that we will be digging into later in this book.
    It holds the default iterator of an object. Arrays, Sets, Maps, and WeakMaps have
    a non-enumerable `[Symbol.iterator]` property present in their structure.


    ## Summary


    Symbols are a new primitive type introduced to JavaScript in ES6 . They can be
    incredibly helpful when you want to avoid name clashes in property keys, especially
    in cases where you don’t want to take chances on overriding native properties
    of an object. Symbols, being non-enumerable, provide an advantage by creating
    protected properties, preventing them from being discovered casually as you have
    to specifically look for symbols to find them.


    # 7. Arrays and Collections


    Up until this point, we have covered many new and improved features and functionalities
    that ES6 offers. In this chapter, we will look at a few more enhancements to data
    types like arrays and collections. ES6 brings to the JavaScript language many
    new static properties and methods that extend the functionality of built-in natives
    and objects. We will take a look at the extended features of the Array type and
    some of the new data structure abstractions that are now native components of
    the language.


    ## Arrays and New Methods


    Over the years, many popular JavaScript libraries like Underscore and Lodash have
    evolved with the array data structure being one of the most commonly extended
    features. Therefore, over time it had become increasingly necessary to have built-in
    support in the language for a range of array functionalities made common by these
    libraries. In this section, we will introduce all the new ES6 array functionalities
    and look into a few use cases where they shine.


    We now have a few new static and prototype methods that the language offers to
    help you create, manipulate, fill, and filter arrays. First let’s take a look
    at the static methods: `Array.from()` and `Array.of()`, and then we will explore
    the new prototype methods introduced for Arrays in ES6.


    ### Array.from()


    Prior to ES6, in order to convert the array-like objects (e.g., `arguments` and
    `NodeList`) to a true array, we needed to use hacks like calling `Array.prototype.slice.call()`
    on the `arguments` or `NodeList` to convert the objects into arrays. Consider
    the following example, where you have a list of elements present in the DOM:


    ```

    Apple

    Mango

    Orange

    Litchi

    Banana


    var listItems = document.querySelectorAll(''li'');

    // converting NodeList to an array

    listItems = Array.prototype.slice.call(listItems);

    // using Array methods on the newly converted array

    listItems.map(item => { console.log(item.innerText) });

    // Apple

    // Mango

    // Orange

    // Litchi

    // Banana

    ```


    With ES6, we now have a more straightforward solution for converting array-like
    objects like the ones described in the above example, into arrays. The new `Array.from`
    static method allows us to create arrays from any array-like or iterable objects.
    Before we move forward though, let’s clearly understand what we actually mean
    by array-like objects. These are simply the objects that have a length property
    or indexed elements. For example, consider the following object:


    ```

    const customers = {

    ''0'': ''matt'',

    ''1'': ''ian'',

    ''2'': ''mikhail'',

    ''3'': ''akia'',

    ''4'': ''vincent'',

    length: 5

    };

    ```


    Now, if we were to convert this object into an array, we can do it using the `Array.from()`
    syntax simply like this:


    ```

    Array.from(customers).forEach(customer => {

    console.log(customer);

    });

    ```


    In this example, we just passed into the function the customer object, and in
    turn it returns an array formed from the individual elements. Let’s look at the
    specific `Array.from` syntax:


    ```

    Array.from(arrayLike[, mapFn[, thisArg]])

    ```'
