    \    <p>查看控制台了解详情</p>\n    <script src=\"./dist/bundle.js\"></script>\n</body>\n\
    </html>\n```\n\n要编译你的 `.js` 文件，你可以在终端中运行以下命令：\n\n```\nwebpack\n```\n\n你也可以将 `webpack`\
    \ 与以下附加标志一起使用：\n\n* `webpack` 用于为开发环境构建一次。\n* `webpack -p` 用于为生产环境构建一次（压缩）。\n\
