    ## Iterables and Iterators


    A lot of effort has been put into the latest release of the ECMAScript standard
    to improve the way we organize our code. ES6 has a whole new traversing mechanism
    that makes it really simple and easy to implement an iterable and an iterator.
    This version of JavaScript introduces a set of protocols called as Iterator and
    Iterable Protocols, which should be implemented by any JavaScript object to become
    an iterator or an iterable. Before moving ahead and discussing these protocols,
    let’s take a look at iterables and iterators in JavaScript:


    Put simply, an iterator pattern is a structured pattern for fetching information
    from a collection of elements, element by element, in a specific order. It is
    an object with a specific interface designed for iteration. This pattern has always
    been around and has been used in JavaScript through custom objects, but with ES6,
    we are introduced to an implicit standardization of the iterators pattern. Many
    existing data structures in JavaScript now expose an iterator, and you can also
    construct your own iterator using the same standard, providing you with maximum
    interoperability.


    An Iterable is a simple representation of a series of elements that can be iterated
    over. It does not have any iteration state such as a “current element.” Instead,
    it has one method that produces an Iterator.


    An Iterator is the object with an iteration state. All iterator objects come with
    a `next()` method that is used to return the next object in the collection. The
    object returned from the `next()` method has two properties. Namely:


    (i) `value`, which is the next value in the collection; and

    (ii) `done`, which is a `Boolean` that signals whether the sequence has ended,
    that is, it is `false` as long as there are values in the sequence to return and
    only returns `true` when the collection has run out of values.


    Each call to the `next()` method produces the next value in the collection. Once
    all the values of the collection are iterated, calling the `next()` method will
    return the `value` as `undefined` and `done` as `true`.


    With all that said, let’s look at how you can manually implement an iterator in
    ES6:


    ```

    function myIterator(data) {

    let currentIndex = 0;

    return {

    next: () => {

    const done = (currentIndex >= data.length);

    const value = !done ? data[currentIndex] : undefined;

    currentIndex += 1;

    return {

    done,

    value

    };

    }

    };

    }

    const itrObj = myIterator([41, 42, 43]);

    itrObj.next();  // { value: 41, done: false }

    itrObj.next();  // { value: 42, done: false }

    itrObj.next();  // { value: 43, done: false }

    itrObj.next();  // { value: undefined, done: true }

    // for all further calls

    console.log(itrObj.next());    // { value: undefined, done: true }

    ```


    In the above code snippet, the `myIterator()` function returns an object that
    has a `next()` method, when called each time returns the next value of the collection.
    After the last element, the `done` value of the object returned becomes `true`
    and the `value` returned is always `undefined`.'
