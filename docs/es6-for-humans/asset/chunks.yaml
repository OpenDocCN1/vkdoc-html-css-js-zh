    ## Destructuring Using the rest Syntax


    Using the rest operators along with the destructuring pattern can be a very powerful
    concise syntax to variable assignments in ES6\. We have already explored the rest
    pattern in the previous chapter. Now let us take a look at it in conjunction with
    the destructing pattern. Consider the following example:


    ```

    var num1, num2, rest;

    var x, y, z;

    [num1, num2, ...rest] = [1, 2, 3, 4, 5];

    [x, y, z] = [1, 2, 3, 4, 5];

    console.log(num1);        // 1

    console.log(num2);        // 2

    console.log(rest);        // [3, 4, 5]

    console.log(x, y, z)      // 1 2 3

    ```


    In the above example, using destructuring we assign values to the variables `num1,
    num2,` and `rest` (using the rest operator for only rest). We do the exact same
    for another set of variables `x, y,` and `z`. But if you notice the output when
    we assign values using an array containing five numbers, the first two values
    get assigned to `num1` and `num2,` but the remaining ones get gathered into an
    array and get assigned to the variable `rest` because we used a rest operator
    along with it. Compare this to the second destructuring statement where only the
    value 3 is assigned to `z`.


    An important point note here is the fact that a [SyntaxError](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/SyntaxError%23The%20SyntaxError%20object%20represents%20an%20error%20when%20trying%20to%20interpret%20syntactically%20invalid%20code.)
    will be thrown if a trailing comma is used on the left-hand side with a rest element.
    Look the following example:


    ```

    var [a, b,] = [1, 2, 3];

    console.log(a, b)               // 1 2

    var [num1, ...num2,] = [1, 2, 3];

    // SyntaxError: rest element may not have a trailing comma

    ```


    Therefore, keep in mind that even though a trailing comma in a simple destructuring
    statement does not make any difference, you should not use it after the rest element
    in the destructuring statement.


