    ```

    Symbol() !== Symbol()         // true

    ```


    Hence, symbols are always unique and can be of incredible use in various cases.
    Let’s take a look at their applications in the next section.


    ### Applications of Symbols


    Symbols, by their very nature, are mainly used as unique property keys because
    a symbol can never clash with any other property `(symbol or string)` of the object,
