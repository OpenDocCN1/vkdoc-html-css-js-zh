    # 可迭代协议


    可迭代协议允许你自定义 JavaScript 对象的迭代行为。该协议规定，所有可迭代对象都必须通过 `[Symbol.iterator]` 属性实现 `@@iterator`
    方法。每当需要迭代某个对象时，就会调用此方法。该方法不接受参数，并返回默认的迭代器，可用于从可迭代对象中获取值。内置的可迭代对象，例如 `Array`、`Map`、`Set`
    等，都有默认的 `@@iterator` 方法，允许我们遍历相应的集合。


    ## 迭代器协议


    迭代器协议定义了一种从可迭代对象获取值序列的标准方式。该协议规定，迭代器对象必须定义一个 `next()` 方法，该方法不接受参数，并返回一个包含两个属性的对象：`done`
    和 `value`。


    ## 作为可迭代对象的迭代器


    如果一个迭代器本身也是可迭代对象，那么它可以直接与 `for...of` 循环一起使用。你可以通过为迭代器提供 `Symbol.iterator` 属性（该属性返回迭代器自身）来使其成为可迭代对象。请看下面的代码片段，我们将一个迭代器变成了可迭代对象，然后使用
    `for...of` 循环进行遍历：


    ```javascript

    const infiniteSequenceGenerator = {

    currentNumber: 0,

    // 使 "infiniteSequenceGenerator" 这个迭代器成为可迭代对象

    [Symbol.iterator]() {

    return this;

    },

    next() {

    return {

    value: this.currentNumber++,

    done: false

    }

    }

    };

    const iter = infiniteSequenceGenerator[Symbol.iterator]();

    console.log(iter === infiniteSequenceGenerator);   // true

    console.log(iter.next().value);   // 0

    console.log(iter.next().value);   // 1

    console.log(iter.next().value);   // 2

    console.log(iter.next().value);   // 3

    for (let item of iter) {

    if (item > 20) break;

    console.log( item );

    }

    // 4

    // 5

    // 6

    // 7

    // ... 20

    ```


    在上面的示例中，请注意我们是如何直接对可迭代对象使用 `for...of` 循环的，但内部实际上使用了 `next()` 方法，因为在 `for...of`
    循环中我们得到的数字列表是从 `4` 开始的，我们已经在循环开始前手动使用 `next()` 方法调用了迭代器四次。


    ## 迭代器中的 `return()` 和 `throw()`


    迭代器还有两个可选的方法：`return()` 和 `throw()`。大多数内置迭代器并未实现这两个方法，但它们在生成器的上下文中确实具有重要作用，我们将在本章后面部分进行探讨。


    在某些情况下，你可能希望最后一个 `{done: true, value: undefined}` 项的 `value` 不是 `undefined`，而是某个其他值。这就是
    `return()` 方法的用武之地。`return()` 方法用于向迭代器发送信号，表明使用该迭代器的代码将不再从迭代器中请求更多的值。当迭代器已消耗完所有值，或遇到异常终止时，可以使用此方法，以便执行清理操作，如关闭数据库连接、保存文件或关闭文件。如果
    `return()` 方法存在，当集合被耗尽时，它将自动被调用；当然，也可以手动调用。`return()` 方法接受一个可选参数，该参数通常作为返回对象中的
    `value` 值传回。


    另一方面，`throw()` 用于向迭代器发出关于可能发生的异常或错误的信号。迭代器对 `throw()` 信号的处理方式可以与 `return()` 不同，因为它不意味着像
    `return()` 那样完全停止。我们将在生成器章节中更详细地研究这些方法。


    ## 生成器


    简单来说，生成器是可以暂停的函数。在 ES6 之前，JavaScript 的函数一旦开始运行，就必须运行到完成，期间无法中断任何执行。随着 ES6 的到来，通过生成器，我们引入了一种不同类型的函数，它不像普通函数那样总是运行到完成，而是可以在执行过程中暂停和恢复循环。


    生成器是一种允许我们创建特殊类型迭代器的函数，其执行可以被挂起并保留上下文。如果一个函数包含一个或多个 `yield` 表达式，并且使用了 `function
    *` 语法，那么它就是一个生成器：


    ```javascript

    function *gen() {

    yield 42;

    }

    ```


    在这种语法中，`*` 的位置并不重要。生成器可以通过以下几种方式编写：


    ```javascript

    function *gen()  { .. }

    function* gen()  { .. }

    function * gen() { .. }

    function*gen()   { .. }

    ```


    尽管如此，在代码中使用生成器时，最好保持风格一致。在本书的其余部分，我们将使用第一种格式。


    ## 生成器函数


    生成器函数通过执行函数体中的 `yield` 关键字来暂停，`yield` 可以在函数体中使用任意多次。你可以通过 `yield` 表达式返回值。请看下面的例子，我们从一个生成器中
    yield 了值 `42`：


    ```javascript

    function *generator () {

    yield 42;

    }

    ```


    生成器执行起来就像任何其他函数一样，你也可以向它传递参数。唯一的区别在于，执行生成器并不会真正运行其内部的代码。它只是生成了一个迭代器，可以用来执行其内部的代码。


    ```javascript

    function *gen() {

    yield "Hello";

    yield "from";

    yield "generator";

    }

    ```


    现在，如果我们调用这个生成器函数，它不会被执行；相反，它会返回一个迭代器，用于执行其内部的代码。


    ```javascript

    let obj = gen();

    ```


    在上面这个生成器中，开头的操作会先运行，然后 `yield` 语句会暂停生成器的执行，直到调用 `next()` 方法。方法 `obj.next()` 会继续执行
    `gen`，直到遇到下一个 `yield` 表达式：


    ```javascript

    console.log(obj.next());   // { value: "Hello", done: false}

    console.log(obj.next());   // { value: "from", done: false}

    console.log(obj.next());   // { value: "generator", done: false}

    console.log(obj.next());   // { value: undefined, done: true}

    ```


    `yield` 可以在生成器内部使用任意多次。它也可以是循环的一部分，用于表示重复的暂停点。请注意，`yield` 不仅仅是一个暂停点，它在暂停生成器时还会发出一个值。


    ```javascript

    function *infiniteNumbers() {

    var n = 1;

    while (true) {

    yield n++;

    }

    }

    var numbers = infiniteNumbers(); // 返回一个可迭代对象

    console.log(numbers.next()); // { value: 1, done: false }

    console.log(numbers.next()); // { value: 2, done: false }

    console.log(numbers.next()); // { value: 3, done: false }

    ```


    每次调用 `yield` 时，yield 出来的值就成为序列中的下一个值。没有提供值的 `yield` 语句仅表示该值为 `undefined`。


    ## 与生成器通信


    在上一节中，我们看到了生成器如何使用 `yield` 语句向我们的代码通信。我们也可以通过 `yield` 向生成器函数传递一个值，并在执行恢复时在生成器函数内部使用这些值。请看下面的代码片段：


    ```javascript

    function *calculator() {

    const num1 = yield "I am a calculator";

    const num2 = yield "I add numbers";

    console.log(`Sum is: ${num1 + num2}`);

    }

    const myGenerator = calculator();

    console.log(myGenerator.next());

    // { value: ''I am a calculator'', done: false }

    console.log(myGenerator.next(2));

    // { value: ''I add numbers'', done: false }

    console.log(myGenerator.next(3));

    // Sum is: 5

    // { value: undefined, done: true }

    ```

