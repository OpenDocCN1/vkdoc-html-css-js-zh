    myMap.set(keyObj, "value associated with keyObj");

    myMap.set(keyFunc, "value associated with keyFunc");

    ```


    请注意，`set()`方法是可链式调用的，因此你也可以这样做：


    ```

    myMap.set(keyString, "value associated with ''a string''")

    .set(keyObj, "value associated with keyObj")

    .set(keyFunc, "value associated with keyFunc");

    myMap.size; // 3

    // 获取值

    myMap.get(keyString);    // "value associated with ''a string''"

    myMap.get(keyObj);       // "value associated with keyObj"

    myMap.get(keyFunc);      // "value associated with keyFunc"

    ```


    #### 检查键的相等性


    `Map()`中的键相等性基于“same-value”算法，该算法与`===`运算符类似，但将`NaN`视为等于自身（尽管通常`NaN !== NaN`），这意味着当使用`NaN`作为键时，它将返回之前使用`NaN`作为键设置的map对象。请看以下代码片段：


    ```

    let myMap = new Map();

    myMap.set(NaN, "not a number");

    myMap.get(NaN); // "not a number"

    ```


    请注意，你也可以通过一个包含键/值对的可迭代对象来创建map：


    ```

    let myMap = new Map([

    [ 1, ''apple'' ],

    [ 2, ''banana'' ],

    [ 3, ''orange'' ]

    ]);

    ```


    此外，maps可以使用`for...of`或`forEach()`进行迭代：


    ```

    for (let [key, value] of myMap) {

    console.log(key + " = " + value);

    }

    // 1 = apple

    // 2 = banana

    // 3 = orange

    ```


    Maps还支持`keys()`、`values()`和`entries()`方法：


    ```

    for (let key of myMap.keys()) {

    console.log(key);

    }

    // 1

    // 2

    // 3

    for (let value of myMap.values()) {

    console.log(value);

    }

    // apple

    // banana

    // orange

    for (let [key, value] of myMap.entries()) {

    console.log(key + " = " + value);

    }

    // 1 = apple

    // 2 = banana

    // 3 = orange

    ```


    如果你是一位经验丰富的JS开发者，你会知道对象是创建无序键/值对作为数据结构的主要机制。然而，使用对象作为maps并不能让我们使用非字符串值作为键。


    此时，你一定会想，何时该使用maps，何时不该使用maps而使用对象。当你需要一个键/值集合时，你应该始终使用`Map`，因为对象本质上并不是设计用来作为集合的，因此没有有效的方法来确定对象拥有的属性数量。当你遍历对象的属性时，你也会得到其原型属性。当然，有一些解决方法，但当你遍历对象的属性时，属性不一定会按照插入的顺序被检索到。这就是为什么在JavaScript程序中需要键/值集合时，推荐使用maps。


    另一个好的判断指标是，当你事先不知道集合的键时，即这些键是从数据库读取或由用户输入的，这意味着它们不一定是字符串或数字。相反，当你在编写代码时就知道对象拥有哪些属性以及有多少属性时，即当它们的结构是静态的时，你应该使用对象。


    ### WeakMap


    `WeakMaps`类似于普通的`Maps`，但方法更少，并且在垃圾回收方面存在一些差异。`WeakMap`是一种键被弱引用的`Map`，这意味着如果对键的所有引用都丢失了，并且没有更多对值的引用，那么`WeakMap`不会阻止其键被垃圾回收。因此，你无需担心`WeakMaps`的内存泄漏。通常，当你需要存储与DOM节点等相关的元数据时，你会希望有这样的行为，这样当DOM元素不再被关注时，它们可以被从内存中释放。


    `WeakMap`最大的限制是它是不可迭代的，这与`Map`不同——这意味着它不支持`entries()`、`keys()`、`values()`、`forEach()`和`clear()`方法。这里需要注意的另一件事是，与`Map`不同，在`WeakMap`中，每个键都必须是`object`。


    尽管它拥有与`Map`几乎相同的API，但我们无法迭代`WeakMap`集合。我们甚至无法确定集合的长度，因为这里我们没有`size`属性。`WeakMap`只有四个方法：


    *   `delete(key)`

    *   `has(key)`

    *   `get(key)`

    *   `set(key, value)`


    ```

    let wMap = new WeakMap();

    wMap.set(''a'', ''b'');

    // Uncaught TypeError: Invalid value used as weak map key

    const o1 = {},

    o2 = () => {},

    o3 = window;

    wMap.set(o1, 42);

    wMap.set(o2, "hello");

    wMap.set(o3, undefined);

    wMap.get(o3); // undefined, 因为这就是设置的值

    wMap.has(o1); // true

    wMap.delete(o1);

    wMap.has(o1); // false

    ```


