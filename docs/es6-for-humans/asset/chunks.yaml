    \ method traps all the “get property accessor” invocations and checks if the property\
    \ exists and if its value is greater than 0, and if it does, its value is decremented\
    \ and the message `Enjoy your ${property}` is returned; otherwise, the message\
    \ is `Sorry, We are out of ${property}s!` is returned. This “get” trap can be\
    \ used to trap all the getter events on the target object. Similarly, you can\
    \ also intercept setter events. Check the following code snippet, for example:\n\
    \n```javascript\nconst restaurant = {\n  soda: 5\n};\nconst restHandler = {\n\
    \  set: function(target, property, value) {\n    target[property] = value;\n \
    \   console.log(`${property} has been added to inventory`);\n  }\n}\nconst restProxy\
    \ = new Proxy(restaurant, restHandler);\nrestProxy.beer = 10;\n// beer has been\
    \ added to inventory\n```\n\nIn this example, we overwrite the set property accessor\
    \ method, which overrides the default assignment. Proxies can be extremely useful\
    \ when it comes to validation. We can easily validate the passed value for an\
    \ object using set handler. For example, let’s suppose that we are creating a\
    \ voting application and only people above 18 years of age and having residency\
    \ of the country are allowed to vote:\n\n```javascript\nconst voterValidator =\
    \ {\n  set: function(obj, prop, value) {\n    if (prop === \"age\") {\n      if\
    \ (!Number.isInteger(value)) {\n        throw new TypeError(\"Input age is not\
    \ an integer\");\n      }\n      if (value < 18) {\n        throw new RangeError(\"\
    Input age seems invalid\");\n      }\n    } else if (prop === \"residency\") {\n\
    \      if (value === false) {\n        throw new Error(\"Residency is mandatory\
    \ to vote\");\n      }\n    }\n    // The default behavior to store the value\n\
    \    obj[prop] = value;\n    // Indicate success\n    return true;\n  }\n};\n\
    const person = new Proxy({}, voterValidator);\nperson.age = 23;\nperson.residency\
    \ = false;     // Throws an exception\nperson.age = \"young\";         // Throws\
    \ an exception\nperson.age = 200;             // Throws an exception\n```\n\n\
    Another good use case for `set` trap would be data-binding, where you can have\
    \ a callback method in place, which will be invoked when a property is set and\
    \ that callback method can react to the changes made to the target object’s property.\n\
    \nBesides setters and getters, proxy offers a range of other traps that you can\
    \ set up. Below are some of those traps that can help you understand proxy better.\n\
    \n### has\n\n`has` is used to trap \"in\" operator. `has` can be incredibly useful\
    \ if you want to hide a particular property of an object. We can return false\
    \ even if the property is present on an object. Check out the following example\
    \ where we are hiding `beer` inventory from the `restaurant` object using the\
    \ `has` method to trap \"in\" operator.\n\n```javascript\nconst restaurant = {\n\
    \  soda: 5,\n  beer: 10\n};\nconst restHandler = {\n  has: function(target, property)\
    \ {\n    if (property === \"beer\") {\n      return false;\n    }\n    return\
    \ property in target;\n  }\n}\nconst restProxy = new Proxy(restaurant, restHandler);\n\
