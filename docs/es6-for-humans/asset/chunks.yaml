    string as an argument into the `Symbol()` method:


    ```

    const chocolate = Symbol("this is my chocolate");

    console.log(chocolate);

    // Symbol(this is my chocolate)

    console.log(chocolate.toString());

    // "Symbol(this is my chocolate)"

    ```


