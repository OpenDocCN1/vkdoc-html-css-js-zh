- fmt: '# Summary


    Meta Programming in ES6 offers us a way to modify the behavior of the internal
    language features by providing us low-level hooks into the code mechanics of the
    program. It comes in three forms: introspection, self-modification, and intercession.


    In this chapter, we learned about the new `Proxy` and `Reflect` API, which help
    us with implementing different forms of meta programming. We also looked at some
    interesting examples where `Proxy` helped us with managing private properties
    in an object. We learned about various trap handler methods that come with `Proxy`,
    and their one-to-one mapped static `Reflect` methods and how we can use them in
    our applications to our advantage. As future ECMAScript versions are shaping up,
    we expect to see more interesting meta programming features that will allow us
    to play around with the default internal operations of the language more extensively.


    # 11. Beyond ES6


    As already described in the first chapter, the ES6 release is very big, and it
    is a significant update to the existing versions of JavaScript, namely ES5. We
    have gone over all the major changes extensively in the previous chapters of this
    book. It took more than six years for TC39 to come up with a new version of the
    language and involved introducing a lot of radically new concepts and functionalities
    into the language. One of the major decisions taken by the committee toward the
    end of the release was that they would not wait too long before coming to a conclusion
    and releasing new features as it was done previously. They decided to officially
    name ES6 as ES2015 and going forward, smaller incremental updates would be released
    for the language and it would be denoted by the year of release. In this chapter,
    we will be looking at the changes and newer features that are a part of ES2016
    and ES2017.


    ## ES2016


    ES2016 is a small incremental update to the existing ES2015 (ES6) release with
    the introduction of the `Array.prototype.includes` and the Exponentiation operator
    `(**)`. You can also check the KangaX compatibility table to see how well the
    new features of ES2016 are supported on different browsers and platforms that
    support JavaScript: [`https://kangax.github.io/compat-table/es2016plus/`](https://kangax.github.io/compat-table/es2016plus/).


    ### The `includes` method on Arrays


    ES2016 introduces the `includes` method to the Array prototype in JavaScript.
    You can check if an element exists in an Array using this method. It will return
    a Boolean value based on whether or not the element passed to it is a part of
    the array it is used on. Consider the following example:


    ```

    [''apple'', ''banana'', ''carrot''].includes(''apple'');    //true

    [''apple'', ''banana'', ''carrot''].includes(''orange'');   //false

    ```


    As you can see in the above example, using the `includes` method on an array of
    fruits returns `true` if the element passed to it is a part of the array, otherwise
    it returns `false`. This check traditionally in JavaScript was done using the
    `indexOf` method, which returns the index of the number if present, otherwise
    -1. So basically the above example is equivalent to:


    ```

    [''apple'', ''banana'', ''carrot''].indexOf(''apple'') >= 0;    //true

    [''apple'', ''banana'', ''carrot''].indexOf(''orange'') >= 0;   //false

    ```


    The above two statements work exactly like the previous example using `includes`,
    but the major difference between `includes()` and `indexOf()` is the way they
    interact with the value `NaN` (Not a Number), which helps in identifying the value.


    ```

    const arr = [NaN];

    arr.includes(NaN);              // true

    arr.indexOf(NaN);               // -1

    ```


    From this example, it is apparent that `indexOf` cannot be used to check for `NaN`
    values inside an array, but the `includes` method allows us to check if a `NaN`
    value exists inside an array.


    ### The Exponentiation Operator `**`


    The exponentiation operator is a new arithmetic operator introduced in ES2016
    that is very much like its counterpart in languages like Python, where a double
    asterisk is used to calculate the exponent value of a number. It is equivalent
    to the traditional `pow()` function of the Math library.


    ```

    let a = 2;

    let b = 3;

    a ** b               //8

    Math.pow(a, b)       // 8

    ```


    Using the exponentiation Operator is a quick way to calculate the value when a
    number is raised to the corresponding power like in this case 2 raised to the
    power of 3 is 8.


    ## ES2017


    ES2017 brings in two major new features to the language, namely, Async functions
    and atomics with Shared memory. It also includes other simpler features like `Object.entries()`,
    `Object.values()`, `Object.getOwnPropertyDescriptors()`, `padStart`, `padEnd`,
    and the ability to use trailing commas in function parameter lists and calls.
    Let us look at each of them in greater detail.


    ### Asynchronous Functions


    ES2017 introduces an exciting new way of dealing with asynchronous code, which
    is the way of life in JavaScript. We have already been introduced to a popular
    way of handling asynchronous operations with promises. ES2017 further builds on
    this pattern by making it work in an synchronous manner using `async` and `await`
    keywords. To understand this properly, consider the following example, where we
    are simply creating a function that returns a promise:


    ```

    function getData(site) {

    return fetch(site)

    .then(request => request.json())

    }

    ```


    For the above example, invoking the `getData()` function would return a promise,
    which will get settled in the context of our execution asynchronously. Now using
    the `async`/`await` keyword, we can have the above promise-based approach to take
    advantage of the generator pattern and make our code behave synchronously. `async`
    always returns a promise, which can be resolved to a value and `await` suspends
    the execution until the promise is settled. We can rewrite the above example with
    the `async`/`await` keywords as follows:


    ```

    async function getData(site) {

    let request = await fetch(url);

    let text = await request.text();

    return JSON.parse(text);

    }

    ```


    Note that the `await` keyword works with promises only, and casts the expression
    into a promise if it''s not one. You can also use `async` in function expressions,
    method definitions, and arrow functions like the following examples:


    ```

    // Using function expression:

    const getData = async function () {};

    // Using method definition:

    const item = { async getData() {} }

    // Using arrow function:

    const item = async () => {};

    ```


    You might be curious about the `await` keyword used in the previous example: the
    `await` operator waits for the operand, that is, the promise to be settled and
    if the promised is fulfilled, its result is the fulfillment value and if the promise
    is rejected, it throws the rejection value. Therefore, we can use a traditional
    `try`/`catch` block with `async`/`await` to handle the promises in a better way.'
