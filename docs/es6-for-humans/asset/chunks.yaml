- fmt: '# Atomics and Shared Memory


    Anyone used to `WebWorker`s will already be aware of the process of creating workers.
    They are created by allocating `Worker` objects and passing into them the script
    that needs to be run. The worker communicates over a message channel, and many
    types of data can be sent through this channel, and the type and structure is
    preserved when it arrives at the destination. In ES2017, to allocate shared memory
    you can simply use the `SharedArrayBuffer` constructor. It is just like a normal
    `ArrayBuffer` but its memory is shared.


    Also, this new spec in ES2017 brings to us the concept of new low-level `Atomics`
    namespace object, which along with the `SharedArrayBuffer` constructor, provides
    us with primitive building blocks for higher-level concurrency abstractions. You
    can use these features to share data from a `SharedArrayBuffer` object among several
    web workers and the core thread. This lets you be able to profit from being able
    to easily share data among workers, giving you better coordination among them.
    A more detailed tutorial and specification on this topic written by Lars Hansen,
    the original proposal writer for Shared Memory and `Atomics`, can be found online
    at the following link: [`https://github.com/tc39/ecmascript_sharedmem/blob/master/TUTORIAL.md`](https://github.com/tc39/ecmascript_sharedmem/blob/master/TUTORIAL.md),
    but it is outside the scope of this book.


    # Object.entries() and Object.values()


    `Object.entries()` and `Object.values()` are two new methods introduced in ES2017.
    The `Object.entries()` method, when run on an object, returns the object’s own
    enumerable property `[key, value]` pairs in the same order as that provided by
    a `for-in` loop. But unlike the `for-in` loop it does not enumerate properties
    in the prototype chain. Similarly the `Object.values()` when passed an object
    returns an array of its own enumerable property values:


    ```javascript

    const myObj = { a: 1, b: 42 };

    Object.entries(myObj);     // [[''a'', 1], [''b'', 42]]

    Object.values(myObj);      // [1, 42]

    ```


    As you can see in the above example, when the `Object.entries()` method is passed,
    the object returns an array with its key/value pairs, while `Object.values()`
    method returns the property values.


    # padStart and padEnd


    The `padStart()` and `padEnd()` methods are two new string methods introduced
    in ES2017 that help in adding padding to a string so that the resulting string
    is of the length passed into them as the first parameter. You can also pass in
    a second optional parameter of another string you can use to pad instead of the
    default space. Consider the following examples:


    ```javascript

    ''string''.padStart(10);           // "    string"

    ''string''.padStart(10, "abc");    // "abcastring"

    ''string''.padStart(10,"123465");  // "1234string"

    ''string''.padStart(8, "0");       // "00string"

    ''string''.padStart(3);            // "string"

    ''string''.padEnd(10);             // "string    "

    ''string''.padEnd(10, "abc");      // "stringabca"

    ''string''.padEnd(8, "123456");    // "string12"

    ''string''.padEnd(1);              // "string"

    ```


    As you can see in the examples above, the added padding to the given string makes
    it so that the resulting string length is either greater than the length of the
    first parameter based on how long its original is; if the given length is greater,
    the adequate amount of padding is added to the string at the start or the end
    based on which method you use. You can also use a second parameter to use a different
    string to pad instead of spaces.


    # Object.getOwnPropertyDescriptors()


    As the name suggests, the `Object.getOwnPropertyDescriptors()` is a new method
    in ES2017 that lets you precisely examine the description of all the own properties
    of the given object. The property in a JavaScript object usually consists of a
    name that is a string and a property descriptor. The descriptor is a record of
    the property value, Boolean `writable`, a `get` function, a `set` function, a
    Boolean `configurable`, and a Boolean `enumerable`. Consider the following example:


    ```javascript

    const myObj = {

    [Symbol(''mySymbol'')]: 42,

    get random() { return ''test'' },

    };

    console.log(Object.getOwnPropertyDescriptors(myObj));

    // Object {random: Object, Symbol(mySymbol): Object}

    // {random:{

    //     configurable: true,

    //     enumerable: true,

    //     get: function random(),

    //     set: undefined}

    //[Symbol(''mySymbol'')]:{

    //     configurable: true,

    //     enumerable: true,

    //     value: 42,

    //     writable: true}

    //}

    ```


    The output of using the `Object.getOwnPropertyDescriptors()` on an object like
    `myObj` will more or less be like above. Note that all of the above features are
    fairly new and experimental so you might not always get the exact same results.
    That being said, they are becoming more and more standard now.


    # Trailing Commas in Function Parameter Lists & Calls


    This feature in ES2017 is a simple syntax update. Prior to introducing this feature,
    having a comma after the last function parameter was not allowed in JavaScript
    even though the rest of the spec had this fairly commonly as in the case of Arrays
    and Object Literals. With this update in ES2017, you have a more uniform trailing
    commas syntax across JavaScript. So you can do something like this:


    ```javascript

    const trailFunct = function(x, y, z,) {

    //function body

    }

    ```


    This is purely a syntax update to the language and has no significant change on
    the behavior or functionalities in the language.'
