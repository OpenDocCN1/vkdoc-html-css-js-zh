- fmt: '就像函数一样，在ES6中有两种定义类的方式。我们来看看每种方式。


    ## 类声明


    正如前面例子所示，类声明非常简单。你使用`class`关键字后跟一个类名来声明一个类，按照惯例类名通常使用`TitleCase`（首字母大写）写法。这里需要注意的一点是，类名在类定义内部的行为表现类似于常量，这意味着你不能在类内部使用类名来覆盖它：


    ```

    class SimpleClass {

    constructor() {

    SimpleClass = "42";      // 执行时会抛出错误

    }

    }

    SimpleClass = "42";              // 声明后可以正常工作

    ```


    与函数声明不同，类声明不会被提升（hoisted）。类似于`let`和`const`，类声明会处于暂时性死区（TDZ），直到执行到达类声明的位置。因此，你需要在访问类之前声明它，否则会引发`ReferenceError`：


    ```

    const b = new Bike(); // ReferenceError

    class Bike {}

    ```


    在上面的例子中，由于类尚未声明，它存在于暂时性死区中，因此当你尝试使用`new`关键字初始化一个新实例时，会抛出一个引用错误。


    ## 类表达式


    除了类声明之外，在ES6中定义新类的第二种方式是通过类表达式。它们与函数表达式完全相同，并且和函数表达式一样，也可以是匿名的。请看下面的例子：


    ```

    const Circle = class {

    constructor() {

    this.radius = 20;

    }

    }

    ```


    注意，在上面的例子中，`class`关键字后面缺少标识符；这使它成为一个匿名的类表达式。除了变量声明外，这些类表达式还可以用于向函数传递参数。考虑以下代码片段，它有一个用于创建汽车的工厂函数：


    ```

    function carFactory(car) {

    return new car();

    }

    const Toyota  = carFactory(class {

    start() {

    console.log("Your car is ready to roll");

    }

    stop() {

    console.log("Shutting down the engines");

    }

    });

    Toyota.start();

    // Your car is ready to roll

    Toyota.stop();

    // Shutting down the engines

    ```


    工厂函数接受类定义作为参数，并返回传入参数的类的对象。在编程语言中，如果一个实体可以作为参数传递、从函数返回、被修改以及赋值给变量，它就被认为是该语言的一等公民。函数式编程在JavaScript中流行的众多原因之一，就是因为函数是语言的一等公民，这使我们能够最大程度地利用函数，并轻松创建高阶函数。在ES6中，与函数类似，类也是语言的一等公民，允许将类作为参数传递给函数（如上面的例子所示），以及通过类表达式将其赋值给变量。


    ## 类方法和访问器属性


    在ES6之前，你需要使用`Object.defineProperty()`来使一个方法不可枚举，但在ES6中，类的所有方法都是不可枚举的。这些方法被附加到原型（prototype）上，这使得该方法可以被类的所有实例共享，从而提供了一种节省内存的有效方式。


    在ES6中定义类方法的语法类似于对象字面量的方法简写（即，不带`function`关键字的函数）：


    ```

    class AeroPlane {

    constructor(model, capacity) {

    this.model = model;

    this.capacity = capacity;

    }

    getData() {

    console.log(`You''re flying a ${this.model} aeroplane`);

    console.log(`This plane can fly with ${this.capacity} passengers`);

    }

    }

    const jet = new AeroPlane("Jet", 60);

    jet.getData();

    // You''re flying a Jet aeroplane

    // This plane can fly with 60 passengers

    console.log(jet.hasOwnProperty("getData"));                     // false

    console.log(jet.__proto__.hasOwnProperty("getData"));           // true

    ```


    上面的例子展示了一个`AeroPlane`类，我们在构造每个实例时初始化名为`model`和`capacity`的实例属性。`getData()`方法声明告诉`AeroPlane`类的实例，它们将拥有一个`getData()`方法，无论何时调用该方法，都会返回该方法的执行结果。这个`getData()`方法会自动添加到原型中。用ES5的方式重新创建上面的例子将是：


    ```

    function AeroPlane(model, capacity) {

    this.model = model;

    this.capacity = capacity;

    }

    AeroPlane.prototype.getData = function() {

    console.log("You''re flying a " + this.model + " aeroplane");

    console.log("This plane can fly with " + this.capacity + " passengers");

    }

    var jet = new AeroPlane("Jet", 60);

    jet.getData();

    // You''re flying a Jet aeroplane

    // This plane can fly with 60 passengers

    ```


    ES6类还允许你在原型上创建访问器属性。我们可以使用`get`和`set`关键字放在标识符前面来分别创建getter和setter属性。这些属性描述符是不可枚举的，并且可以通过在类的原型上使用`Object.getOwnPropertyDescriptor()`来访问，因为这些属性驻留在原型对象上。例如，请考虑以下代码片段：


    ```

    class AeroPlane {

    constructor(model, capacity) {

    this._model = model;

    this._capacity = capacity;

    }

    get model() {

    return this._model;

    }

    get capacity() {

    return this._capacity;

    }

    set model(model) {

    this._model = model;

    }

    set capacity(capacity) {

    this._capacity = capacity;

    }

    }

    const jet = new AeroPlane("Jet", 100);

    console.log(jet.capacity);

    // 100

    console.log(Object.getOwnPropertyDescriptor(AeroPlane.prototype, "model"));

    /*

    {

    get: [Function: get model],

    set: [Function: set model],

    enumerable: false,

    configurable: true

    }

    */

    ```


    在上面的例子中，你必须注意，我们在类定义中的属性名前添加了一个`_`（下划线）。让我们使用下面的代码片段来看看我们为什么这么做：


    ```

    class StudyGroup {

    constructor(name) {

    this.name = name;

    }

    set name(newName) {

    this.name = newName;

    }

    }

    const jsGroup = new StudyGroup("js");

    // RangeError: Maximum call stack size exceeded

    ```


    如果你尝试运行上面的代码片段，你会看到一个`RangeError`，提示超出最大调用堆栈大小，这是因为你的setter属性在递归地设置自身，导致无限函数调用。因此，你绝不能让你的setter方法名与属性名相同，因为在setter内部通过其自身名称访问属性setter会创建一个无限递归的函数调用。


    如果你此时想知道为什么首先要使用setter和getter，以下是一些应该考虑使用它们的原因：'
  raw: 'Just like in the case of functions, there are two ways in which you can define
    classes in ES6\. Let us look at each of them.


    ### Class Declarations


    As seen in the previous example, class declarations are pretty simple. You declare
    a class using the "`class`" keyword followed by a class-name, which is generally
    by convention written in `TitleCase`. A good thing to note here is that the name
    of a class behaves as if it is a constant inside the class definition, which means
    you cannot overwrite a class using the class name inside itself:


    ```

    class SimpleClass {

    constructor() {

    SimpleClass = "42";      // throws an error during execution

    }

    }

    SimpleClass = "42";              // works fine after the declaration

    ```


    Unlike function declarations, class declarations are not hoisted. Similar to `let`
    and `const`, class declarations reside in the temporal dead zone (TDZ) until the
    execution reaches the point of class declaration. Therefore, you need to declare
    your class before accessing it, otherwise a ReferenceError will occur:


    ```

    const b = new Bike(); // ReferenceError

    class Bike {}

    ```


    In the above example, since the class has not already been declared, it exists
    in the TDZ and so when you try to initialize a new instance using the new keyword,
    a reference error is thrown.


    ### Class Expressions


    Apart from Class declarations, the second way of defining new classes in ES6 is
    through Class Expressions. They are identical to function expressions, and just
    like function expressions they can also be anonymous. Consider the following example:


    ```

    const Circle = class {

    constructor() {

    this.radius = 20;

    }

    }

    ```


    Notice, in the above example, how the identifier is missing after the class keyword;
    this makes it an anonymous class expression. Besides variable declarations, these
    class expressions can also be used to be pass arguments into functions. Consider
    the following code snippet that has a factory function to create cars:


    ```

    function carFactory(car) {

    return new car();

    }

    const Toyota  = carFactory(class {

    start() {

    console.log("Your car is ready to roll");

    }

    stop() {

    console.log("Shutting down the engines");

    }

    });

    Toyota.start();

    // Your car is ready to roll

    Toyota.stop();

    // Shutting down the engines

    ```


    The factory function takes in the class definition as an argument and returns
    the object of the class passed in as the argument. In programming languages, if
    an entity can be passed as an argument, returned from a function, modified, and
    assigned to a variable, it is considered to be a first-class citizen of the language.
    One of the many reasons that functional programming is popular with JavaScript
    is because of functions being the first-class citizen of the language, allowing
    us to use functions to the fullest extent and easily creating higher order functions.
    In ES6, similar to functions, classes are also the first-class citizens of the
    language, allowing a class to be passed as an argument to functions, as seen in
    the above example, and assigned to a variable using class expressions.


    ## Class Methods and Accessor Properties


    Prior to ES6 you needed the `Object.defineProperty()` to make a method non-enumerable,
    but in ES6 all methods of a class are non-enumerable. These methods are attached
    to the prototype, which enables the method to be shared by all instances of the
    class, providing an efficient way to conserve memory.


    The syntax for defining methods of a class in ES6 is similar to the object literal
    method shorthand (i.e., functions without the function keyword):


    ```

    class AeroPlane {

    constructor(model, capacity) {

    this.model = model;

    this.capacity = capacity;

    }

    getData() {

    console.log(`You''re flying a ${this.model} aeroplane`);

    console.log(`This plane can fly with ${this.capacity} passengers`);

    }

    }

    const jet = new AeroPlane("Jet", 60);

    jet.getData();

    // You''re flying a Jet aeroplane

    // This plane can fly with 60 passengers

    console.log(jet.hasOwnProperty("getData"));                     // false

    console.log(jet.__proto__.hasOwnProperty("getData"));           // true

    ```


    The above example shows a class `AeroPlane` where we initialize the instance properties
    named model and capacity upon construction of each instance. The `getData()` method
    declaration tells the instances of our `AeroPlane` class that they will have a
    `getData()` method, which will return the results of this method, whenever that
    method is called. This `getData()` method gets automatically added to the prototype.
    The ES5 way to re-create the above example would be:


    ```

    function AeroPlane(model, capacity) {

    this.model = model;

    this.capacity = capacity;

    }

    AeroPlane.prototype.getData = function() {

    console.log("You''re flying a " + this.model + " aeroplane");

    console.log("This plane can fly with " + this.capacity + " passengers");

    }

    var jet = new AeroPlane("Jet", 60);

    jet.getData();

    // You''re flying a Jet aeroplane

    // This plane can fly with 60 passengers

    ```


    ES6 classes also allow you to create accessor properties on the prototype. We
    can use get and set keywords before the identifiers to create getter and setter
    properties respectively. These property descriptors are non-enumerable and can
    be accessed using `Object.getOwnPropertyDescriptor()` on the class’s prototype,
    since these properties reside on the prototype object. Consider the following
    code snippet, for example:


    ```

    class AeroPlane {

    constructor(model, capacity) {

    this._model = model;

    this._capacity = capacity;

    }

    get model() {

    return this._model;

    }

    get capacity() {

    return this._capacity;

    }

    set model(model) {

    this._model = model;

    }

    set capacity(capacity) {

    this._capacity = capacity;

    }

    }

    const jet = new AeroPlane("Jet", 100);

    console.log(jet.capacity);

    // 100

    console.log(Object.getOwnPropertyDescriptor(AeroPlane.prototype, "model"));

    /*

    {

    get: [Function: get model],

    set: [Function: set model],

    enumerable: false,

    configurable: true

    }

    */

    ```


    In the above example, you must note that we have added an _ (underscore) before
    property names inside the class definition. Let’s take a look at why we did that,
    using the following code snippet:


    ```

    class StudyGroup {

    constructor(name) {

    this.name = name;

    }

    set name(newName) {

    this.name = newName;

    }

    }

    const jsGroup = new StudyGroup("js");

    // RangeError: Maximum call stack size exceeded

    ```


    If you try to run the above code snippet, you would see a RangeError stating Maximum
    call stack size exceeded, which is because of your setter property recursively
    setting itself, going into an infinite function call. Therefore, you must never
    have your setter method name the same as that of your property because accessing
    the property setter by its own name inside the setter creates an infinite recursive
    function call.


    At this point, if you’re wondering why use setters and getters in the first place,
    here are some reasons why you should consider using them:'
