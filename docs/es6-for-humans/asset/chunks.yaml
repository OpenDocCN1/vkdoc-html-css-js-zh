    # `for...of` 循环


    这种格式本身完全没问题，但通过新语法，我们不再需要初始化并跟踪循环计数器变量（`i`）。我们可以用更少、更简洁的代码实现相同的迭代逻辑。查看以下使用`for-of`语法编写的代码片段：


    ```javascript

    let names = [''matt'', ''smith'', ''jack''];

    for (let name of names) {

    console.log(name);

    }

    // matt

    // smith

    // jack

    ```


    请注意，使用`for...of`循环遍历的值必须是可迭代对象。可迭代对象就是能够产生迭代器的对象，循环会使用这个迭代器。`for...of`循环不仅适用于数组，也适用于其他可迭代对象，例如`DOM`的`NodeList`对象、`arguments`对象和`String`对象。与数组一样，`for-of`循环使得遍历这些非数组序列更加容易。例如，考虑以下代码片段：


    ```javascript

    for (let char of ''Bye'') {

    console.log(char);

    }

    // B

    // y

    // e

    ```


    注意


    重要的是不要将`for...of`与更旧的`for...in`循环语法混淆，后者用于遍历对象的可枚举属性（或键）。


    `for...of`循环结构的应用和优势将在本书后面详细讨论迭代器和可迭代对象时变得更加清晰。本节仅旨在介绍新的`for...of`循环语法及其在数组和字符串等数据结构中的用法。


    ## 总结


    如果你是一名 JavaScript 程序员，你可能已经注意到我们编写 JavaScript 时存在的一些小问题，尽管它的语法与其他语言相比相当合理且直接。ES6
    通过引入大量新语法和对 JavaScript 现有模式的更改，试图解决许多这些问题。有许多新概念需要你去熟悉。引入的许多新模式旨在解决先前版本语言中的现有挑战，并简化
    JavaScript 编程过程。它们有助于编写更清晰的代码、更快地调试、用更少的代码行实现逻辑，并避免混淆。


    像`let`和`const`这样的新关键字用于变量声明，为 JavaScript 引入了块级作用域，带来了其他编程语言中常见的功能，使得编写更健壮的代码更容易，并有助于调试过程。像箭头函数这样的特性，不仅有助于编写更短、更美观的函数，还引入了特定行为，你可以在特定情况下使用，比如简化`this`关键字的使用。


    通过本章，我们还向你介绍了新概念，如函数参数的默认值以及`Rest`和`Spread`运算符。将函数参数的“剩余”部分收集到一个数组中的模式现在只需使用三个点。我们还讨论了模板字面量如何为模板化和字符串操作赋予我们更多能力。最后，我们了解了新的`for...of`循环结构，用于遍历可迭代对象，而无需使用额外的计数器变量。


    在本章中，我们只介绍了一些重要的新语法特性，但在接下来的几章中，我们将看到更多新特性，如解构、类和模块、迭代器和生成器、元编程等。敬请期待。


    # 3. 解构


    对象字面量和数组可能是 JavaScript 中使用最广泛的符号之一。这些 JavaScript 符号的流行甚至扩展到了语言之外，体现在`JSON`数据格式中。在
    JavaScript 中，对象和数组通常用于分组数据，并且存在多种模式，以便在需要时系统地从中提取数据。ES6 通过一个称为解构的过程，使这一过程更加容易和简单，进一步扩展了这种能力。


    ## 对象和数组的解构


    解构基本上是一种将数据结构分解为更小部分，以便更容易访问其数据并从对象或数组中提取多个值的便捷方式。为了更好地理解解构，只需将其视为从对象或数组进行结构化赋值。考虑以下示例：


    ```javascript

    var letters = [''a'', ''b'', ''c''],

    x = letters[0],

    y = letters[1],

    z = letters[2];

    console.log( x, y, z );             // a b c

    ```


    在上面的例子中，我们给一个名为`letters`的数组赋值，然后通过`letters`变量上的索引给变量`x`、`y`和`z`赋值。让我们看另一个使用对象的例子：


    ```javascript

    var numbers = {a: 1, b: 2, c: 3},

    a = numbers.a,

    b = numbers.b,

    c = numbers.c;

    console.log( a, b, c );             // 1 2 3

    ```


    在这个例子中，我们使用`numbers.a`的值来给变量`a`赋值，类似地，使用`numbers.b`和`numbers.c`来给`b`和`c`赋值。ES6
    通过一种称为解构的新专用语法，使这种结构化赋值模式更加简单。这种语法消除了对临时中间变量（`letters`和`numbers`）的需求。考虑以下示例：


    ```javascript

    var [ x, y, z ] = [''a'', ''b'', ''c''];

    var { a: a, b: b, c: c } = {a: 1, b: 2, c: 3};

    console.log( x, y, z );             // a b c

    console.log( a, b, c );             // 1 2 3

    ```


    注意


    我们通常习惯在赋值语句的右侧看到像`{a: a, b:b, c:c }`和`[x, y, z]`这样的对象和数组语法。解构翻转了这种模式，将它们放在左侧，并带有变量声明关键字，允许你将右侧分解为单独的值，并将它们分配给左侧的变量。


    如前面的两个示例所示，在 ES6 之前，从对象和数组中获取信息并将其放入局部变量需要更多的代码。想象一下，你需要从一个非常大的对象或数组中提取值，并将它们存储到同名的变量中。你必须编写大量代码逐个赋值，但使用解构，这个过程简化为一个单一的赋值语句。


    使用解构将数据结构分解为更小的部分，使得获取所需数据变得更加容易。此外，ES6 中的解构使用了对象和数组字面量语法，这对传统的 JavaScript 用户来说已经非常熟悉。


    ### 对象解构语法


    让我们更仔细地看一下对象解构语法。我们看到的对象解构语法是：


    ```javascript

    var { a: a, b: b, c: c } = {a: 1, b: 2, c: 3};

    ```


    在这个例子中，你可以注意到，被赋值的变量名与返回对象的属性名相同。但它们不必相同，你可以为被赋值的局部变量使用任何名称。但是，如果它们相同，则可以通过省略`"a:
    "`部分来进一步缩短语法。这个声明语句可以直接写成：


    ```javascript

    var { a, b, c } = {a: 1, b: 2, c: 3};

    console.log( a, b, c );             // 1 2 3

    ```


    使用更短的语法而不是长形式对我们来说非常有意义，除非你想将属性赋值给一个不同的变量名。但是在使用长形式时，有一个重要的细微差别你需要小心。考虑以下示例：


    ```javascript

    var { a: foo, b: bar, c: baz } = {a: 1, b: 2, c: 3};

    console.log( foo, bar, baz );         // 1 2 3

    console.log( a, b, c );               // ReferenceError

    ```

