- fmt: "# ES6 类与继承\n\n`ES6` 引入了 `extends` 关键字，允许创建一个类作为另一个类的子类。继承让我们能够将另一个类的状态和行为合并到我们自己的类中。从父类扩展子类可以防止代码重复。考虑以下示例：\n\
    \n```javascript\nclass AeroPlane {\n  constructor(capacity) {\n    this.capacity\
    \ = capacity;\n  }\n  showCapacity() {\n    console.log(`Capacity of this plane:\
    \ ${this.capacity}`);\n  }\n}\nclass FighterPlane {\n  constructor(capacity) {\n\
    \    this.capacity = capacity;\n  }\n  showCapacity() {\n    console.log(`Capacity\
    \ of this plane: ${this.capacity}`);\n  }\n  fire() {\n    console.log(\"Loading\
    \ weapons and firing\");\n  }\n}\n```\n\n在上面的示例中，数据属性 `capacity` 和方法 `showCapacity`\
    \ 在两个类中重复出现。我们可以通过让 `FighterPlane` 继承自 `AeroPlane` 来轻松消除这种重复，从而将 `AeroPlane` 的状态和行为合并到\
    \ `FighterPlane` 中。考虑以下示例，其中 `FighterPlane` 类使用 `extends` 关键字从父类 `AeroPlane` 继承：\n\
    \n```javascript\nclass AeroPlane {\n  constructor(capacity) {\n    this.capacity\
    \ = capacity;\n  }\n  showCapacity() {\n    console.log(`Capacity of this plane:\
    \ ${this.capacity}`);\n  }\n}\nclass FighterPlane extends AeroPlane {\n  fire()\
    \ {\n    console.log(\"Loading weapons and firing\");\n  }\n}\nconst phantom =\
    \ new FighterPlane(2);\nphantom.showCapacity();\n// Capacity of this plane: 2\n\
    phantom.fire();\n// Loading weapons and firing\n```\n\n如果你也想在派生类中定义构造函数方法，你需要使用\
    \ `super()`，它允许在派生类中调用父类的构造函数。`super()` 负责初始化上下文，因此你必须在构造函数方法中访问上下文（`this`）之前调用\
    \ `super()`；否则会导致错误。\n\n如果未定义构造函数，则在创建类的新实例时会使用所有给定的参数自动调用 `super()`，如下例所示：\n\n\
    ```javascript\nclass FighterPlane extends AeroPlane {\n  // 没有构造函数\n  fire() {\n\
    \    console.log(\"Loading weapons and firing\");\n  }\n}\n// 等价于\nclass FighterPlane\
    \ extends AeroPlane {\n  constructor(...args) {\n    super(...args);\n  }\n  fire()\
    \ {\n    console.log(\"Loading weapons and firing\");\n  }\n}\n```\n\n## 继承静态属性\n\
    \n`ES6` 允许我们将父类的静态属性继承到子类中。考虑以下示例，其中 `AeroPlane` 的静态方法在其派生类（`FighterPlane`）上被调用：\n\
    \n```javascript\nclass AeroPlane {\n  static radio() {\n    console.log(\"Radio\
    \ works\");\n  }\n}\nclass FighterPlane extends AeroPlane {}\nFighterPlane.radio();\n\
    // Radio works\n```\n\n在这段代码中，一个新的静态方法 `radio()` 被添加到 `AeroPlane` 类中。通过继承，此方法可以作为\
    \ `FighterPlane.radio()` 使用，其行为方式与 `AeroPlane.radio()` 方法相同。\n\n## 方法重写\n\n父类的方法可以在派生类内部被同名的父类方法轻松覆盖。例如，检查以下代码片段，其中父类（`AeroPlane`）中的\
    \ `fly()` 方法在派生类（`FighterPlane`）内部被重写：\n\n```javascript\nclass AeroPlane {\n \
    \ constructor(capacity) {\n    this.capacity = capacity;\n  }\n  showCapacity()\
    \ {\n    console.log(`Capacity of this plane: ${this.capacity}`);\n  }\n  fly()\
    \ {\n    console.log(\"Engines on, and the plane will take off soon\");\n  }\n\
    }\nclass FighterPlane extends AeroPlane {\n  fly() {\n    console.log(\"Engines\
    \ on, and the plane is gone\");\n  }\n  fire() {\n    console.log(\"Loading weapons\
    \ and firing\");\n  }\n}\nconst phantom = new FighterPlane(2);\nphantom.fly();\n\
    // Engines on, and the plane is gone\nphantom.showCapacity();\n// 2\n```\n\n如果你希望访问父类版本的方法，你可以通过\
    \ `super.fly()` 来实现，如下所示：\n\n```javascript\nclass FighterPlane extends AeroPlane\
    \ {\n  fly() {\n    super.fly();\n    console.log(\"Engines on, and the plane\
    \ is gone\");\n  }\n}\n```\n\n这确保了每次在 `FighterPlane` 的实例上调用 `fly()` 方法时，首先会调用父类的该方法。除了方法，你也可以重写构造函数；例如，考虑以下代码片段：\n\
    \n```javascript\nclass AeroPlane {\n  constructor(capacity, color) {\n    this.capacity\
    \ = capacity;\n    this.color = color;\n  }\n}\nclass FighterPlane extends AeroPlane\
    \ {\n  constructor(color) {\n    // 这个战斗机是双座的\n    super(2, color);\n  }\n}\n\
    const phantom = new FighterPlane(\"grey\");\nconsole.log(phantom.capacity);  \
    \     // 2\n```\n\n## 可继承的内置对象\n\n`ES6` 使得继承自内置类（如 `Array`，`String`，`RegEx` 等）变得非常容易，这在需要像栈、队列或任何其他链表结构这样的数据结构时非常有用。你也可以利用此功能根据需求为数组提供额外的辅助方法，例如\
    \ `first`，`last`，`shuffle` 等。\n\n考虑以下代码片段，我们通过扩展内置的 `String` 类来实现一个 `ReversedString`\
    \ 数据类型：\n\n```javascript\nclass ReversedString extends String {\n  print() {\n\
    \    return this.split('').reverse().join('');\n  }\n}\nconst str = new ReversedString(\"\
    Awesome\");\nconsole.log(str.print());\n// emosewA\n```\n\n## 总结\n\n`ES6` 类将 JavaScript\
    \ 中构建伪类以模仿其他编程语言中基于类的开发模式的现有模式正式化。它们使 JavaScript 中的继承更易于使用，并为你提供了语法糖，以便用更简单的基于类的语法实现\
    \ JavaScript 的经典原型继承模型。\n\n在本章中，我们研究了 `ES6` 中的类如何在底层使用原型继承，通过在类原型上定义非静态方法，而所有静态方法则定义在类本身上，使得所有类方法都不可枚举。我们还学习了新的基于类的继承语法，它允许你从基类创建派生类，也允许你继承自\
    \ JavaScript 中的内置类，如 `Array`，`String` 和其他数据类型。总的来说，类是对 JavaScript 非常重要的语法补充，通过提供简洁的语法，使我们能够以更清晰的方式声明自定义对象类型。\n\
    \n# 5. 模块\n\nJavaScript 在其早期阶段，最初是作为 Web 浏览器的一种简单脚本语言开始的。因此，它最初是建立在“一切都是共享的”方法之上的。但随着时间的推移，随着语言的发展以及\
    \ JavaScript 应用程序变得越来越复杂，这种加载代码的方法开始变得更容易出错且令人困惑。这与大多数高级语言使用如模块和包等概念来帮助定义代码作用域的事实形成对比。在\
    \ `ES6` 之前，JavaScript 应用程序中的所有内容，包括应用程序不同文件中的代码，都共享相同的作用域。这正是模块发挥作用的地方，它们有助于更好地管理和引入代码分离，减少命名冲突等问题并提高数据安全性。JavaScript\
    \ 开发者被迫求助于外部库来引入模块以帮助解决这些特定问题，但有了 `ES6`，模块现在已成为该语言的官方组成部分。\n\n## 模块系统及一点历史\n\n\
    过去，JavaScript 有两个主要的模块系统：异步模块定义 (AMD) 和 `CommonJS`。`CommonJS` 是 `Node.js` 中常用实现的模块标准。它具有简洁的语法，专为同步加载和服务器设计。另一方面，`AMD`\
    \ 是 `RequireJS` 中的流行实现，其语法稍显复杂，允许它在没有 `eval()` 或编译步骤的情况下工作。它专为异步加载和浏览器设计。两者在浏览器中都不是原生可用的。"
  raw: 'ES6 introduces the extends keyword to allow creation of a class as a child
    of another class. Inheritance lets us incorporate another class’s state and behavior
    into our own. Extending a class from its parent class prevents code duplication.
    Consider the following example:


    ```

    class AeroPlane {

    constructor(capacity) {

    this.capacity = capacity;

    }

    showCapacity() {

    console.log(`Capacity of this plane: ${this.capacity}`);

    }

    }

    class FighterPlane {

    constructor(capacity) {

    this.capacity = capacity;

    }

    showCapacity() {

    console.log(`Capacity of this plane: ${this.capacity}`);

    }

    fire() {

    console.log("Loading weapons and firing");

    }

    }

    ```


    In the above example, the data property capacity and the method `showCapacity`
    are repeated between both of the classes. We can easily eliminate this duplication
    by having `FighterPlane` inherit from `AeroPlane` , allowing the state and behavior
    of `AeroPlane` to be incorporated into the `FighterPlane`. Consider the following
    example where class `FighterPlane` inherits from the parent class `AeroPlane`
    using the extends keyword:


    ```

    class AeroPlane {

    constructor(capacity) {

    this.capacity = capacity;

    }

    showCapacity() {

    console.log(`Capacity of this plane: ${this.capacity}`);

    }

    }

    class FighterPlane extends AeroPlane {

    fire() {

    console.log("Loading weapons and firing");

    }

    }

    const phantom = new FighterPlane(2);

    phantom.showCapacity();

    // Capacity of this plane: 2

    phantom.fire();

    // Loading weapons and firing

    ```


    If you wish to define a constructor method in derived classes as well, you would
    need to use `super()`, which allows the parent class’s constructor to be called
    in the derived class. `super()` is responsible for initializing the context, therefore,
    you must call `super()` before accessing the context `(this)` inside the constructor
    method; otherwise it will result in an error.


    If no constructor is defined, then `super()` is automatically called for with
    all the given arguments when a new instance of the class is created, as in the
    following example:


    ```

    class FighterPlane extends AeroPlane {

    // no constructor

    fire() {

    console.log("Loading weapons and firing");

    }

    }

    // is equivalent to

    class FighterPlane extends AeroPlane {

    constructor(...args) {

    super(...args);

    }

    fire() {

    console.log("Loading weapons and firing");

    }

    }

    ```


    ## Inheriting Static Properties


    ES6 allows us to inherit static properties of a parent class into a child class.
    Consider the following example where a static method of `AeroPlane` is called
    on its derived class `(FighterPlane)`:


    ```

    class AeroPlane {

    static radio() {

    console.log("Radio works");

    }

    }

    class FighterPlane extends AeroPlane {}

    FighterPlane.radio();

    // Radio works

    ```


    In this code, a new static `radio()` method is added to the `AeroPlane` class.
    Using inheritance, this method is available as `FighterPlane.radio()` and behaves
    in the same manner as the `AeroPlane.radio()` method .


    ## Method Overriding


    The methods of the parent class can easily be shadowed with the same name on the
    parent class, inside the derived class. For instance, check the following code
    snippet where `fly()` method from the parent class `(AeroPlane)` is being overridden
    inside the derived class `(FighterPlane)`:


    ```

    class AeroPlane {

    constructor(capacity) {

    this.capacity = capacity;

    }

    showCapacity() {

    console.log(`Capacity of this plane: ${this.capacity}`);

    }

    fly() {

    console.log("Engines on, and the plane will take off soon");

    }

    }

    class FighterPlane extends AeroPlane {

    fly() {

    console.log("Engines on, and the plane is gone");

    }

    fire() {

    console.log("Loading weapons and firing");

    }

    }

    const phantom = new FighterPlane(2);

    phantom.fly();

    // Engines on, and the plane is gone

    phantom.showCapacity();

    // 2

    ```


    If you wish to access the parent class version of the method, you can do so using
    `super.fly()` as follows:


    ```

    class FighterPlane extends AeroPlane {

    fly() {

    super.fly();

    console.log("Engines on, and the plane is gone");

    }

    }

    ```


    This ensures that first, the parent class’s method will be called every time the
    `fly()` method is called on the FighterPlane’s instance. Besides methods, you
    can also override constructors; consider the following code snippet, for example:


    ```

    class AeroPlane {

    constructor(capacity, color) {

    this.capacity = capacity;

    this.color = color;

    }

    }

    class FighterPlane extends AeroPlane {

    constructor(color) {

    // This fighterplane is 2-seater

    super(2, color);

    }

    }

    const phantom = new FighterPlane("grey");

    console.log(phantom.capacity);       // 2

    ```


    ## Inheritable Built-Ins


    ES6 makes it really easy to inherit from built-in classes like Array, String,
    RegEx, etc., which can be really helpful in cases where you need data structures
    like stacks, queues, or any other linked-list structures. You can also utilize
    this functionality to avail additional helper methods on arrays like first, last,
    shuffle, etc., based on your needs.


    Consider the following code snippet where we are implementing a `ReversedString`
    data type by extending String built-in class:


    ```

    class ReversedString extends String {

    print() {

    return this.split('''').reverse().join('''');

    }

    }

    const str = new ReversedString("Awesome");

    console.log(str.print());

    // emosewA

    ```


    ## Summary


    ES6 classes formalize an existing pattern in JavaScript of building pseudo-classes
    mimicking the class-based development pattern in other programming languages.
    They make inheritance in JavaScript easier to use and provide you with syntactic
    sugar to implement the classical prototypal inheritance model of JavaScript with
    simpler class-based syntax.


    In this chapter, we looked at how classes in ES6 use prototypal inheritance under
    the hood, by defining non-static methods on the class prototype, while all the
    static methods are defined on the class itself, making all of the class methods
    non-enumerable. We also learned about the new class-based inheritance syntax that
    lets you create derived classes from a base class, also allowing you to inherit
    from built-in classes like Arrays, Strings, and other data types in JavaScript.
    On the whole, classes are a very important syntax addition to JavaScript, enabling
    us to declare custom object types in a much cleaner manner by offering a concise
    syntax.


    # 5. Modules


    JavaScript, in its early days, started out as a simple scripting language for
    the web browser. Hence it was originally built with an approach where “everything
    was shared.” But over time, as the language evolved and as JavaScript applications
    started getting more and more complex, this approach to loading code started to
    become a lot more error prone and confusing. Contrast this to the fact that most
    high-level languages use concepts like modules and packages to help with defining
    code scope. Prior to ES6, everything inside a JavaScript application, including
    code across different files of the application, shared the same scope. This is
    where modules come in to help better manage and introduce code separation, reducing
    problems like naming collisions and increasing data security. JavaScript developers
    were forced to resort to external libraries to incorporate modules to help with
    these particular issues, but with ES6, modules have now been included as an official
    part of the language.


    ## Module Systems and a Little History


    In the past, JavaScript has had two major module systems: the Asynchronous Module
    Definition (AMD) and CommonJS. CommonJS is a commonly implemented module standard
    in Node.js. It has a concise syntax and is designed for synchronous loading and
    servers. AMD, on the other hand, is a popular implementation in RequireJS with
    a slightly more complex syntax that allows it to work without eval() or a step
    for compilation. It is designed for asynchronous loading and browsers. Both are
    not natively available in browsers.'
