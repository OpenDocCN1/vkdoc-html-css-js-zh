    \ > 0) {\n      target[property] -= 1;\n      return `享受您的${property}吧`;\n   \
    \ }\n    return `抱歉，我们的${property}已经卖完了！`;\n  }\n};\nconst restProxy = new Proxy(restaurant,\
    \ restHandler);\nconsole.log(restProxy.soda);\n// 享受您的 soda 吧\nconsole.log(restProxy.soda);\n\
    // 享受您的 soda 吧\nconsole.log(restProxy.soda);\n// 抱歉，我们的 sodas 已经卖完了！\nconsole.log(restProxy.burger);\n\
    // 享受您的 burger 吧\nconsole.log(restProxy.burger);\n// 抱歉，我们的 burgers 已经卖完了！\n```\n\
    \n在上面的示例中，我们有一个 `restaurant` 对象，其中包含可用库存的列表和数量。我们使用代理来包裹 `restaurant` 对象，这使我们能够拦截（或“捕获”）`restaurant`\
    \ 对象的原生操作，并对其执行修改后的行为。这里，`handler` 对象包含一个针对 get 属性访问器的陷阱，该陷阱在被调用时接收 `target` 和属性名。此方法会捕获所有“get\
    \ 属性访问器”的调用，并检查该属性是否存在且其值是否大于 0，如果是，则将其值减 1，并返回消息 `享受您的${property}吧`；否则，返回消息 `抱歉，我们的${property}已经卖完了！`。这个“get”陷阱可用于捕获目标对象上的所有\
    \ getter 事件。类似地，你也可以拦截 setter 事件。例如，请看下面的代码片段：\n\n```javascript\nconst restaurant\
    \ = {\n  soda: 5\n};\nconst restHandler = {\n  set: function(target, property,\
    \ value) {\n    target[property] = value;\n    console.log(`${property} 已添加到库存中`);\n\
    \  }\n}\nconst restProxy = new Proxy(restaurant, restHandler);\nrestProxy.beer\
    \ = 10;\n// beer 已添加到库存中\n```\n\n在这个示例中，我们重写了 set 属性访问器方法，覆盖了默认的赋值操作。在进行验证时，代理可能非常有用。我们可以使用\
    \ set 处理程序轻松验证传递给对象的值。例如，假设我们在创建一个投票应用，只有年满 18 岁且拥有该国居留权的人才能投票：\n\n```javascript\n\
    const voterValidator = {\n  set: function(obj, prop, value) {\n    if (prop ===\
    \ \"age\") {\n      if (!Number.isInteger(value)) {\n        throw new TypeError(\"\
    输入的年龄不是整数\");\n      }\n      if (value < 18) {\n        throw new RangeError(\"\
    输入的年龄无效\");\n      }\n    } else if (prop === \"residency\") {\n      if (value\
    \ === false) {\n        throw new Error(\"必须有居留权才能投票\");\n      }\n    }\n   \
    \ // 存储值的默认行为\n    obj[prop] = value;\n    // 表示成功\n    return true;\n  }\n};\n\
    const person = new Proxy({}, voterValidator);\nperson.age = 23;\nperson.residency\
    \ = false;     // 抛出异常\nperson.age = \"young\";         // 抛出异常\nperson.age =\
    \ 200;             // 抛出异常\n```\n\n`set` 陷阱的另一个很好的用例是数据绑定，你可以在其中设置一个回调方法，当属性被设置时会调用该方法，并且该回调方法可以对目标对象属性的更改做出响应。\n\
    \n除了 setter 和 getter，代理还提供了一系列你可以设置的其他陷阱。以下是一些可以帮助你更好地理解代理的陷阱。\n\n### has\n\n\
    `has` 用于拦截 `in` 操作符。如果你想隐藏对象的某个特定属性，`has` 会非常有用。即使该属性存在于对象上，我们也可以返回 `false`。请看下面的示例，我们使用\
    \ `has` 方法拦截 `in` 操作符，从而隐藏 `restaurant` 对象中的 `beer` 库存。\n\n```javascript\nconst\
    \ restaurant = {\n  soda: 5,\n  beer: 10\n};\nconst restHandler = {\n  has: function(target,\
    \ property) {\n    if (property === \"beer\") {\n      return false;\n    }\n\
    \    return property in target;\n  }\n}\nconst restProxy = new Proxy(restaurant,\
    \ restHandler);\nconsole.log(\"beer\" in restProxy);    // false\nconsole.log(\"\
    soda\" in restProxy);    // true\n```\n\n在上面的示例中，所有 `in` 操作符的调用都会被 `has` 方法捕获，如果属性名是\
    \ `\"beer\"`，则返回 `false`；否则保持默认行为（检查属性是否在目标对象中）。请注意，`has` 只能帮助你阻止通过 `in` 操作符检测特定属性。该属性仍然是可枚举的，并且可以通过\
    \ `for...in` 循环访问。\n"
- fmt: '### ownKeys


    `ownKeys`用于拦截通过`Object.keys()`、`Object.getOwnPropertyNames()`或`Object.getOwnSymbolProperties()`访问自有属性和自有符号属性的行为。它还可以与`has`陷阱处理器结合使用，以增强目标对象属性的私密性（请注意，这些属性仍然不是完全私有的）：


    ```

    const restaurant = {

    soda: 5,

    beer: 10

    };

    const restHandler = {

    has: function(target, property) {

    if (property === "beer") {

    return false;

    }

    return property in target;

    },

    ownKeys: function(target) {

    return ["soda"];

    }

    }

    const restProxy = new Proxy(restaurant, restHandler);

    console.log("beer" in restProxy);          // false

    console.log(Object.keys(restProxy));       // ["soda"]

    ```


    你还可以添加另一个陷阱处理器：`getOwnPropertyDescriptor`，它用于拦截`Object.getOwnPropertyDescriptor()`调用，以进一步增强私密性。


    ### apply


    `apply`用于拦截函数调用。它接受三个参数：


    *   `target`：行为被修改的目标函数；

    *   `context`：调用时作为`this`传递给目标函数的上下文；

    *   `args`：调用时传递的参数。


    看看下面的代码片段，我们使用`apply`陷阱处理器对最终账单金额应用季节性折扣：


    ```

    function getBill(amount) {

    return amount;

    }

    const billHandler = {

    apply: function(target, context, args) {

    console.log("Applying Discount of 35%");

    return args[0] - (args[0] * 0.35);

    }

    }

    const billProxy = new Proxy(getBill, billHandler);

    console.log(billProxy(300));

    // Applying Discount of 35%

    // 195

    ```


    由于这里的目标对象是一个函数，这些也被称为函数陷阱，你也可以为`.call()`和`.bind()`方法设置陷阱。


    到目前为止，我们已经介绍了足够多的陷阱处理器，让你对整体概念有所了解。我们看到了`Proxy`如何帮助我们拦截设置器（setter）和获取器（getter）、装饰对象、添加验证规则、增强私密性，以及本质上修改对象的默认行为。你可以通过以下链接探索更多陷阱处理器：[`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming)。


    ## Revocable Proxy


    ES6允许我们创建可撤销的代理。`Proxy.revocable()`方法用于创建一个可撤销的代理对象。与代理对象类似，它也需要一个处理器和一个目标对象，并返回一个新创建的可撤销代理对象。


    一个可撤销代理对象有两个属性：`proxy`和`revoke`。


    ```

    const { proxy, revoke } = Proxy.revocable(target, handler);

    ```


    其中：


    *   `proxy` – 通过`new Proxy(target, handler)`调用创建的`Proxy`对象。

    *   `revoke` – 一个无参函数，用于使代理失效（关闭）。


    如果调用了`revoke()`函数，代理将变得不可用，这意味着对处理器的任何陷阱都会抛出`TypeError`。代理一旦被撤销，将保持撤销状态并可被垃圾回收。后续对`revoke`的调用没有进一步效果。请看下面的代码片段示例：


    ```

    const restaurant = {

    soda: 10,

    beer: 5

    };

    const { proxy, revoke } = Proxy.revocable(restaurant, {});

    console.log(proxy.soda);   // 10

    console.log(proxy.beer);   // 5

    revoke();

    console.log(proxy.soda);   // TypeError: Revoked

    ```


    由于可撤销代理允许你完全切断代理及其陷阱，它可以在某些情况下用于增强对象的安全性，例如在检测到试图访问私有属性时撤销代理。我们可以修改上面的示例来增强`beer`属性的私密性，如下所示：


    ```

    const restaurant = {

    soda: 10,

    beer: 5

    };

    const resthandler = {

    get: function(target, property) {

    if (property === "beer") {

    revoke();

    return undefined;

    }

    return target[property];

    }

    }

    const { proxy, revoke } = Proxy.revocable(restaurant, resthandler);

    console.log(proxy.soda);    // 10

    console.log(proxy.beer);    // undefined

    console.log(proxy.soda);    // TypeError: Revoked

    ```


    在上面的示例中，如果访问了`beer`属性，我们会返回`undefined`并撤销代理，从而切断通过代理对目标对象的后续调用。


    到目前为止，我们已经了解了 ES6 中的自修改和中介（intercession）机制。现在，让我们来看看通过内省（introspection）实现的反射。


    ### Reflect


    `Reflect`是一个内置的全局对象，提供了一系列内省方法。这些方法本质上是收集关于对象运行时元操作的信息。除了已有的内省方法如`typeof`、`instanceof`等，`Reflect`作为一个单一对象包装器，封装了许多仅通过
    JavaScript 引擎内部可访问的重要内部方法。`Reflect`的一个简单实现如下：


    ```

    const restaurant = {

    soda: 10,

    beer: 5

    };

    console.log(Reflect.ownKeys(restaurant));

    // ["soda", "beer"]

    ```


    请注意，`Reflect`是一个静态对象，因此不能与`new`关键字一起使用。


    对于 ES6 `Proxy`中的每一个陷阱方法，`Reflect`中都有一个对应的反射方法。因此，`Reflect`也适用于在代理中实现陷阱。查看下面的代码片段，我们在代理中使用了`Reflect`：


    ```

    const restaurant = {

    soda: 2,

    beer: 5

    };

    const restHandler = {

    get: function(target, property) {

    if (property === "beer") {

    return undefined;

    }

    return Reflect.get(target, property);

    }

    };

    const restProxy = new Proxy(restaurant, restHandler);

    console.log(restProxy.beer);

    // undefined

    console.log(restProxy.soda);

    // 2

    ```


    再次说明，在上面的示例中，我们阻止了对`beer`的访问，并使用`Reflect.get()`来访问目标对象的其他属性。你应该优先使用`Reflect`而不是传统的`target[property]`方式的原因之一是：如果在非对象目标上使用`Reflect.get`，它会抛出错误，而`target[property]`则简单地返回`undefined`。因此，在这里使用`Reflect.get`是一个好习惯。查看下面的代码片段示例，我们尝试在一个非对象目标上获取属性：


    ```

    console.log(Reflect.get(1, "name"));

    // TypeError: Reflect.get called on non-object

    console.log(1["name"]);

    // undefined

    ```


    除此之外，在`Function.prototype`上调用方法时，也建议使用`Reflect`，因为如果参数列表为`null`或`undefined`，`Function.prototype.apply`会用无参方式调用函数，而`Reflect.apply`会抛出错误。另一个原因是`Reflect`提供了更简洁的语法，而`Function.prototype`显得过于冗长。查看下面的代码片段示例：


    ```

    function sayHello() {

    console.log(`${this.name} says hello`);

    }

    const person = {

    name: "Jack"

    };

    Function.prototype.apply.call(sayHello, person);

    // Jack says hello

    Reflect.apply(sayHello, person);

    // TypeError: CreateListFromArrayLike called on non-object

    Reflect.apply(sayHello, person, []);

    // Jack says hello

    ```


    类似地，还有许多其他有用的静态函数，其中一些与代理处理器方法同名，以下是一些常见的可用的函数：


    *   `Reflect.get()` – 返回属性值的函数。

    *   `Reflect.set()` – 为属性赋值的函数。如果更新成功，返回布尔值`true`。

    *   `Reflect.getPrototypeOf()` – 与`Object.getPrototypeOf()`相同。

    *   `Reflect.has()` – 作为函数的`in`操作符。返回一个布尔值，指示是否存在自有或继承的属性。'
  raw: '### ownKeys


    `ownKeys` is used to trap the access of the owned properties and owned symbol
    properties via `Object.keys(), Object.getOwnPropertyNames()` or `Object.getOwnSymbolProperties()`
    `.` This can also be used in combination with the has trap handler to strengthen
    the privacy of the target object properties. (Note that these properties would
    still not be completely private):


    ```

    const restaurant = {

    soda: 5,

    beer: 10

    };

    const restHandler = {

    has: function(target, property) {

    if (property === "beer") {

    return false;

    }

    return property in target;

    },

    ownKeys: function(target) {

    return ["soda"];

    }

    }

    const restProxy = new Proxy(restaurant, restHandler);

    console.log("beer" in restProxy);          // false

    console.log(Object.keys(restProxy));       // ["soda"]

    ```


    You can also add another trap handler: `getOwnPropertyDescriptor`, which traps
    the `Object.getOwnPropertyDescriptor()` calls, to enhance the privacy.


    ### apply


    apply is used to trap a function invocation. It takes three arguments:


    *   target: the target function whose behavior is being modified;

    *   context: the context passed as this to target on invocation;

    *   args: the arguments passed when applying the call.


    Take a look at the following code snippet, for example, where we are applying
    a season discount on the final billing amount using the apply trap handler:


    ```

    function getBill(amount) {

    return amount;

    }

    const billHandler = {

    apply: function(target, context, args) {

    console.log("Applying Discount of 35%");

    return args[0] - (args[0] * 0.35);

    }

    }

    const billProxy = new Proxy(getBill, billHandler);

    console.log(billProxy(300));

    // Applying Discount of 35%

    // 195

    ```


    Since the target object here is a function, these are also called as function
    traps, and you can alternatively have traps for `.call()` and `.bind()` methods
    also


    Up until this point, we have covered enough trap handlers to give you an overall
    picture. We have seen how Proxy helps us intercepting setters and getters, decorating
    objects, adding validation rules, enhancing privacy, and essentially modifying
    the default behavior of an object. You can explore through more trap handlers
    at the following link: - [`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming)
    .


    ## Revocable Proxy


    ES6 allows us to create proxies that can be revoked. `Proxy.revocable()` method
    is used to create a revocable proxy object. Similar to a proxy object, it also
    takes a handler and a target object and returns a newly created revocable proxy
    object.


    A revocable proxy object has two properties: proxy and revoke.


    ```

    const { proxy, revoke } = Proxy.revocable(target, handler);

    ```


    where,


    *   proxy – A Proxy object created with new Proxy (target, handler) call

    *   revoke – A function with no argument to invalidate (switch off) the proxy.


    If the `revoke()` function gets called, the proxy becomes unusable, which means
    any trap to a handler will throw a `TypeError`. Once a proxy is revoked, it will
    remain revoked and can be garbage collected. Subsequent calls of revoke have no
    further effect. Check the following code snippet, for example:


    ```

    const restaurant = {

    soda: 10,

    beer: 5

    };

    const { proxy, revoke } = Proxy.revocable(restaurant, {});

    console.log(proxy.soda);   // 10

    console.log(proxy.beer);   // 5

    revoke();

    console.log(proxy.soda);   // TypeError: Revoked

    ```


    Since Revocable Proxy allows you to completely cut off the Proxy and its traps,
    it can be useful in cases to enhance the security of an object where if attempts
    to access a private property has been made, the proxy can be revoked. We can modify
    the above example to enhance the privacy of beer property as follows:


    ```

    const restaurant = {

    soda: 10,

    beer: 5

    };

    const resthandler = {

    get: function(target, property) {

    if (property === "beer") {

    revoke();

    return undefined;

    }

    return target[property];

    }

    }

    const { proxy, revoke } = Proxy.revocable(restaurant, resthandler);

    console.log(proxy.soda);    // 10

    console.log(proxy.beer);    // undefined

    console.log(proxy.soda);    // TypeError: Revoked

    ```


    In the above example, we are returning undefined and revoking the proxy if `beer`
    property is accessed, cutting off further calls to the target object via proxy.


    Up until this point, we have seen how self-modification and intercession works
    in ES6\. Now, let’s take a look at Reflection through introspection.


    ### Reflect


    Reflect is a built-in global object that provides a range of introspection methods.
    These methods essentially gather information about the runtime-level meta-operations
    on objects. Besides already existing introspection methods like `typeof`, `instanceof`,
    etc., Reflect serves as a single object wrapper for a collection of many significant
    internal methods that are available exclusively through the JavaScript engine
    internals. A simple implementation of Reflect would look like this:


    ```

    const restaurant = {

    soda: 10,

    beer: 5

    };

    console.log(Reflect.ownKeys(restaurant));

    // ["soda", "beer"]

    ```


    Note that Reflect is a static object and therefore cannot be used with the new
    keyword.


    For every trap method in ES6 Proxy, there is a matching reflection method available
    in Reflect. Therefore, Reflect is also useful for implementing traps in proxies.
    Check the following code snippet where we are using Reflect with Proxy:


    ```

    const restaurant = {

    soda: 2,

    beer: 5

    };

    const restHandler = {

    get: function(target, property) {

    if (property === "beer") {

    return undefined;

    }

    return Reflect.get(target, property);

    }

    };

    const restProxy = new Proxy(restaurant, restHandler);

    console.log(restProxy.beer);

    // undefined

    console.log(restProxy.soda);

    // 2

    ```


    Again, in the above example, we are preventing the access to beer and using `Reflect.get()`
    to access other properties of the target object. One of the reasons why you should
    prefer using Reflect over the traditional target[property] way is this: if `Reflect.get`
    is used on a non-object target, it will throw an error, whereas target[property]
    would simply return undefined. Therefore, it is a good practice to use `Reflect.ge`t
    here. Check the following code snippet, for example, where we are trying to get
    a property on a non-object target:


    ```

    console.log(Reflect.get(1, "name"));

    // TypeError: Reflect.get called on non-object

    console.log(1["name"]);

    // undefined

    ```


    Besides this, it is also recommended to use Reflect when calling methods on `Function.prototype`,
    because if the arguments list is `null` or `undefined`, `Function.prototype.apply`
    will call the function with no arguments, whereas `Reflect.apply` will throw an
    error. Another reason is that Reflect offers a shorter syntax, whereas `Function.prototype`
    looks much too verbose. Take a look at the following code snippet, for example:


    ```

    function sayHello() {

    console.log(`${this.name} says hello`);

    }

    const person = {

    name: "Jack"

    };

    Function.prototype.apply.call(sayHello, person);

    // Jack says hello

    Reflect.apply(sayHello, person);

    // TypeError: CreateListFromArrayLike called on non-object

    Reflect.apply(sayHello, person, []);

    // Jack says hello

    ```


    Similarly, there are many other useful static functions, some of which have the
    same names as the proxy handler methods, and here are some common ones that can
    be helpful:


    *   Reflect.get() – A function that returns the value of properties.

    *   Reflect.set() – A function that assigns values to properties. Returns a Boolean
    that is true if the update was successful.

    *   Reflect.getPrototypeOf() – Same as Object.getPrototypeOf().

    *   Reflect.has() – The in operator as function. Returns a Boolean indicating
    whether an own or inherited property exists.'
