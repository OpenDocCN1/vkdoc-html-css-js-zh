- fmt: '### 2\. Method Invocation


    Method invocation means an object’s method is called and in this case, `this`
    is the object that owns the method in a method invocation.


    ```

    let myObj = {

    name: ''fancy'',

    operation: function() {

    console.log(this);

    }

    }

    myObj.operation(); // { name: ''fancy'', operation: [Function: operation]}

    ```


    Method Invocation, that is, on calling `myObj.operation()`, `[myObj object]` will
    be printed in the console.


    Now, let’s try this:


    ```

    let x = myObj.operation;

    x(); // Window

    ```


    Here, `x` refers to the `operation()` method inside `[myObj object]`. Calling
    `x()` would mean that we are making a function invocation instead of a method
    invocation and therefore, `this` will refer to the `Global` (or `Window`) object.


    If we were to call `x` with the `[myObj object]` (for method invocation), we will
    have to use `.call()` method:


    ```

    let x = myObj.operation;

    x(); // Window

    x.call(myObj); // { name: ''fancy'', operation: [function]}

    ```


    ### 3\. Constructor Invocation


    Constructor invocation happens when an object is created using the `new` keyword.
    Consider the following example:


    ```

    function Employee(name, department, salary) {

    this.name = name;

    this.department = department;

    this.salary = salary;

    console.log("Welcome " + this.name + "!");

    }

    let john = new Employee(''John'', ''Sales'', 4000);

    // Welcome John!

    ```


    `new Employee(''John'', ''Sales'', 4000)` is a constructor invocation of the `Employee`
    function. The result of execution is a new object and `this` refers to the newly
    created object.


    The constructor function `Employee()` can be written as a class in ES6 that we
    will discuss later in this book.


    ### `this` in Arrow Functions


    Let’s take a look at how `this` works inside an Arrow function. Arrow Functions
    are designed to lexically bind the context, which means that `this` refers to
    the enclosing context where the arrow function is defined. Unlike a normal function,
    an arrow function does not create its own execution context, but takes `this`
    from the outer function where it is defined. Consider the following code:


    ```

    function Employee(firstName, department, salary) {

    this.firstName = firstName;

    this.department = department;

    this.salary = salary;

    this.getInfo = function() {

    // outer function context = Employee object

    return function () {

    // inner function context = Global object

    console.log(this.firstName + " from " +

    this.department + " earns " + this.salary);

    };

    }

    }

    let jim = new Employee(''Jim'', ''Finance'', 5200);

    ```


    In the above example, we created a constructor function called `Employee` and
    created a new employee object called `jim` using the constructor function with
    the `new` keyword. In order to print the employee information, we need to use
    the function returned by `jim.getInfo()`. Check the following code snippet:


    ```

    let printInfo = jim.getInfo();

    printInfo();  // undefined from undefined earns undefined

    ```


    Here, `printInfo` refers to the inner function and since we are simply making
    a function invocation, `this` refers to the `Global` object that does not have
    any `Employee` properties and hence produces `undefined` whenever a property on
    `this` is used.


    Let''s look at how `this` behaves differently if we replace the inner function
    with an arrow function:


    ```

    function Employee(firstName, department, salary) {

    this.firstName = firstName;

    this.department = department;

    this.salary = salary;

    this.getInfo = function() {

    // outer function context = Employee object

    return () => {

    // inner function context = surrounding context = Employee object

    console.log(this.firstName + " from " +

    this.department + " earns " + this.salary);

    };

    }

    }

    let jim = new Employee(''Jim'', ''Finance'', 5200);

    let printInfo = jim.getInfo();

    printInfo();  // Jim from Finance earns 5200

    ```


    In this case, the `this` keyword refers to the context of the function enclosing
    the arrow function unlike the previous case where it referred to the `Global`
    object. At this point, it is important to note that arrow functions do not change
    their context on invocation. Consider the following example:


    ```

    function Employee() {

    this.firstName = ''Mike'',

    this.department = ''HR'',

    this.salary = 4500,

    this.getContext = () => {

    console.log(this);

    }

    }

    let mark = new Employee();

    mark.getContext(); // [Employee object]

    let context = mark.getContext;

    context(); // [Employee object] (regardless of a function invocation)

    ```


    In the above example, the context of the arrow function was set on declaration
    and it cannot be changed. An important thing to note here is that you cannot “rebind”
    an arrow function. The context is always fixed. Check the following code snippet
    for an example:


    ```

    var details = {

    number: 42,

    operation: function () {

    return () => console.log(this.number);

    }

    };

    var details2 = {

    number: 84

    };

    details.operation().bind(details2)(); // 42

    ```


    In the above example, we are setting the `details2` number to 84. But we know
    we cannot bind a new object to the arrow function. The engine does not throw any
    error, it just ignores the bind completely. So 42 is printed even if we call the
    `operation` method with the `details2` object. This also applies to `call` and
    `apply`. So with an arrow function, calls to `bind`, `call`, or `apply` will not
    be able to change the value of `this`.


    It is clear from this example that inside a function the value of the `this` keyword
    cannot be changed. The value of `this` inside a function will remain constant,
    but you will still be able to use `bind`, `call`, and `apply` on arrow functions.


    ```

    var product = (x, y) => x * y;

    console.log(product.call(null, 2, 3));           // 6

    console.log(product.apply(null, [2, 3]));        // 6

    var multiply = product.bind(null, 2, 3);

    console.log(multiply ());                        // 6

    ```


    Apart from the lexical `this`, arrow functions also have lexical `arguments`.
    They don''t have their own `arguments` array but instead inherit from their parent.
    There are no `this`, `super`, `arguments`, and `new.target` bindings for arrow
    functions, so the value of `this`, `super`, `arguments`, and `new.target` inside
    a function is the nearest containing non-arrow function.


    **Note**


    Normally in JavaScript extra newlines between code do not mean anything and the
    code still works properly, but with arrow functions, it is a problem. We cannot
    put the arrow symbol on a newline. ES6 forbids a line break between the parameter
    definition and the arrow of an arrow function.


    Another important aspect of Arrow functions is that they cannot be called with
    `new` since they do not have the construct method and cannot be used as constructors.
    They will produce an error when used with `new`. Check the example below:


    ```

    var newFn = () => {},

    object = new newFn();  // error - you can''t use arrow functions with ''new''

    ```


    Normally when a function is declared in ES5, it has a `prototype` property that
    is used in construction functions. But since you cannot use `new` on an arrow
    function, there is no need for a `prototype`. Hence, functions declared using
    arrow function, do not have access to a `prototype` field.


    ```

    var details = () => 42;

    console.log(details.hasOwnProperty("prototype")); // false

    ```


    Similar to non-arrow functions that do not have duplicate named parameters in
    strict mode, arrow functions cannot have duplicate named parameters in either
    strict or non-strict mode.'
