- fmt: "ES6 took a long time to become official. The deadline for ES6 proposals was\
    \ May 2011 and no major proposals were considered after that; but starting with\
    \ the later versions, TC39 decided to time-box releases and release a new version\
    \ every year with smaller incremental changes using whatever features are approved\
    \ by that time. Hence the committee decided to change the naming convention of\
    \ the versions to denote the year of release. Hence the official name of ES6 was\
    \ changed to ECMAScript 2015 just before the final release, but the name ES6 was\
    \ so widely used for years that ES2015 is still commonly referred to as ES6 and\
    \ that’s why we chose to refer to the new specification as ES6 throughout this\
    \ book. But going forward, ES versions will be officially referred to by their\
    \ year of release. So when we say ES6, we are referring to the broader changes\
    \ in ES2015.\n\nTo look at ES6 from a bird’s eye view, the specification drafts\
    \ are divided into four major parts: the goals, the requirements, the means, and\
    \ the themes. The goals aspire to fix the common pitfalls in JavaScript and add\
    \ new features, while the requirements state that both of them need to be done\
    \ in such a way that it does not break any existing code, while preserving the\
    \ lightweight nature of the language.\n\nWe won’t be digging into all the goals\
    \ here. But you should know that these goals aspire to make it a better language\
    \ for writing complex applications, libraries, etc. Keeping versioning simple\
    \ and incremental, ES6 avoids versioning; this is best described by the philosophy\
    \ of One JavaScript. For example, in ES6 everything is ES6 code: there are no\
    \ parts that are specific only to ES5.\n\nES6 aims to provide better support for\
    \ large applications and library creation. It offers enhancements like classes,\
    \ modules, lexical block scoping, iterators, generators, native language support\
    \ for promises, and much more.\n\nThe development of ECMAScript Standard is community\
    \ driven and the requirements and features of the language will still continue\
    \ to evolve for betterment in the future releases.\n\n## One JavaScript\n\nIn\
    \ principle, when there is a new version of a language implementation, it is a\
    \ chance to clean it up and remove old outdated features and make way for newer,\
    \ better implementations. This leads to versioning, which basically implies that\
    \ each piece of code needs to be linked to a specific version of the language.\
    \ For example in Python, to shift between Python 2 and Python 3, one would need\
    \ to migrate the code base. But this option would not be feasible for the web\
    \ and a language like JavaScript. You will always have old chunks code that you\
    \ will encounter on the Internet.\n\nSo the ES specification aspires to upgrade\
    \ the language and avoid versioning. This is done by always being backward compatible,\
    \ that is, all valid ES5 code is also valid for ES6 code. Therefore, ES6 is designed\
    \ to not have any breaking changes and none of the previous features are removed.\
    \ Hence in theory specifying the version is not required for the engines. So instead\
    \ of removing existing features, you introduce new and better features.\n\nWhat\
    \ does this mean for you, a JavaScript developer? Since ES6 is a superset of ES5\
    \ you will not need to migrate any old code. Your existing JS code is valid ES6\
    \ code as well. Therefore to reiterate there is nothing you need to do. Therefore,\
    \ everything you learned and use in existing JavaScript can be brought over to\
    \ ES6, and it has more and better tools to add to your existing arsenal. This\
    \ can be really helpful if you wish to incrementally port your current system\
    \ into ES6 because everything is backward compatible.\n\n## Using ES6\n\nMany\
    \ JavaScript environments including web browsers and Node.js are actively working\
    \ on implementing all the features of ECMAScript 6 and later. But it will take\
    \ some time before ES6 is universally supported all across the Internet. At the\
    \ time of writing this book, the latest version of chrome has 97% of features\
    \ implemented and Safari has 100% of the features implemented. You can check the\
    \ current feature-wise support for all engines at [`http://kangax.github.io/compat-table/es6/`](http://kangax.github.io/compat-table/es6/)\
    \ .\n\nUntil all of ES6 features are universally supported we need a way of converting\
    \ ES6 into compatible JavaScript code. This is where transpiling comes in. Transpiling\
    \ (transformation + compiling) is a technique in which we use special tools to\
    \ transform ES6 code into its closest equivalent, ES5 code, to work on older browsers\
    \ or environments.\n\nConsider the following ES6 code:\n\n```\nconst fruits =\
    \ [\"apples\", \"bananas\", \"oranges\"];\nlet store = {\nfruits\n};\nstore.fruits;\
    \ // [\"apples\", \"bananas\", \"oranges\"]\n```\n\nThis roughly transpiles to:\n\
    \n```\nvar fruits = [\"apples\", \"bananas\", \"oranges\"];\nvar store = {\nfruits:\
    \ fruits\n};\nstore.fruits; // [\"apples\", \"bananas\", \"oranges\"]\n```\n\n\
    Some ES6 features can work simply by using polyfills or shims, which are simple\
    \ patterns that define a new behavior in an older environment. You can also run\
    \ and transpile small pieces of ES6 code online in your browser through ES6 REPLs\
    \ like [`https://jsfiddle.net/`](https://jsfiddle.net/) and [`babeljs.io/repl/`](http://babeljs.io/repl/)\
    \ . But for larger projects, you would need to use any of the available transpilers.\
    \ We recommend using Babel, which is one of the most popular JavaScript transpilers\
    \ available today.\n\n## Setting Up ES6 Using Babel and webpack\n\nIn order to\
    \ use ES6 in your projects today, there are a set of build tools you will need\
    \ to get things up and running. In this section, we will be discussing a few build\
    \ tools, and we will be setting up an ES6 Boilerplate that you can use as a starter\
    \ kit for your ES6 projects.\n\n### Transpiling with Babel\n\nBabel.js is an awesome\
    \ tool that lets you transpile your ES6 code into ES5 code that can then be run\
    \ in current JavaScript environments. Babel supports the latest version of JavaScript\
    \ through syntax transformers, and these plug-ins allow you to use new syntax,\
    \ without waiting for browser support.\n\nThe first step is to install Babel on\
    \ your local machine using npm.\n\nNote\n\nBefore you continue, make sure you\
    \ have Node.js and npm already installed. If you don’t have node and npm installed,\
    \ you can visit [`https://nodejs.org/en/`](https://nodejs.org/en/) to set up your\
    \ development environment.\n\n```\nnpm install -g babel-cli\n```\n\nNow, you can\
    \ run any file with ES6 code from your command line using:\n\n```\nbabel-node\
    \ \n```\n\nBut transpiling every file manually isn’t efficient and, in most cases,\
    \ isn’t the solution for managing large projects. So let’s set up an ES6 starter\
    \ kit that will help you automate the build process and make the development process\
    \ more efficient.\n\n### Setting Up an ES6 Boilerplate\n\nIn order to transpile\
    \ an ES6 project, we will be using `babel-loader` and `webpack` that will help\
    \ us generate a bundled output with all the transpiled code and related dependencies.\n\
    \n#### Start a New Project\n\nRun the following set of commands in your terminal\
    \ to start a new project:\n\n```\nmkdir es6-boilerplate\ncd es6-boilerplate\n\
    npm init –yes\n```\n\n`npm init` creates a new project with its own `package.json`\
    \ and `–yes` flag prevents `npm` from prompting you from any options and will\
    \ use the defaults."
