    ## Summary


    If you have been a JavaScript programmer, you might be aware of a few quirks in
    the way we write JavaScript even though it has a fairly reasonable and straightforward
    syntax similar to other languages. ES6 tries to address many of these issues by
    bringing in a lot of new syntax and changes to existing patterns in JavaScript.
    There are plenty of new concepts for you to become familiar with. Many of the
    new patterns introduced aim at addressing existing challenges in previous versions
    of the language and easing the process of programming in JavaScript. They help
    in writing cleaner code, debugging faster, implementing logic in fewer lines,
    and avoiding confusion.


    New keywords like `let` and `const` for variable declarations introduce block
    scoping to JavaScript, bringing in functionality common to other programming languages,
    making it easier to write more robust code and aid in the process of debugging.
    Features like Arrow functions, while helping in writing shorter and nicer-looking
    functions, also bring in specific behaviors that you can use for particular situations,
    like making the use of the `this` keyword more simple.


    Through this chapter, we also introduced to you new concepts like default values
    for function parameters and the Rest and Spread operators . The pattern of gathering
    the "rest" of the parameters of a function into an array is now merely using three
    dots. We also discussed how template literals grant us more power for templating
    and string manipulations. Finally, we looked at the new `for...of` loop structure
    for iterating over the iterables without having to use an additional counter variable.


    We have only introduced a few new important syntax features in this chapter, but
    over the course of the next few chapters, we will be looking at many more new
    features like Destructuring, Classes and Modules, Iterators and Generators, Meta
    Programming, etc. So stay tuned.


    # 3. Destructuring


    Object literals and arrays are probably some of the most widely used notations
    in JavaScript. The popularity of these JavaScript notations is further extended
    to even outside the language with their presence in the JSON data format . Objects
    and arrays are commonly used to group data in JavaScript and there exists various
    patterns to systematically fetch data from these defined structures when we need
    them. ES6 further extends this process by making it easier and simpler through
    a process called destructuring.


    ## Destructuring of Objects and Arrays


    Destructuring is basically a convenient way of breaking the data structure into
    smaller pieces to access its data more easily and extract multiple values from
    Objects or Arrays. To understand destructuring better, simply think of it as a
    structured assignment from an object or array. Consider the following example,


    ```

    var letters = [''a'', ''b'', ''c''],

    x = letters[0],

    y = letters[1],

    z = letters[2];

    console.log( x, y, z );             // a b c

    ```


    In the above example, we assigned values to an array called `letters` and then
    the `x, y,` and `z` variables using indices on the `letters` variable. Let us
    look at another such example using objects:


    ```

    var numbers = {a: 1, b: 2, c: 3},

    a = numbers.a,

    b = numbers.b,

    c = numbers.c;

    console.log( a, b, c );             // 1 2 3

    ```


    In this example, we use the `numbers.a` value to assign the value of the variable
    `a` and similarly `numbers.b & numbers.c` for `b` and `c` variables. ES6 makes
    this pattern of structured assignment simpler through a new and dedicated syntax
    called destructuring. This syntax eliminates the need for the temporary, intermediate
    variables – letters and numbers. Consider the following examples:


    ```

    var [ x, y, z ] = [''a'', ''b'', ''c''];

    var { a: a, b: b, c: c } = {a: 1, b: 2, c: 3};

    console.log( x, y, z );             // a b c

    console.log( a, b, c );             // 1 2 3

    ```


    Note


    We are commonly used to seeing an object and array syntax like `{a: a, b:b, c:c
    }` and `[x, y, z]` on the right side of an assignment statement. Destructuring
    flips this pattern and puts them on the left side with a variable declaration
    keyword, and lets you decompose the right side into individual values to be assigned
    to the variables on the left side.


    As seen in the previous two examples, prior to ES6, fetching information from
    objects and arrays and putting them into local variables needed a lot more code.
    Imagine you needed to extract values from a very large object or array and store
    them in variables of the same name. You would have to write a lot of code assigning
    values to them one by one, but using destructuring, this process gets reduced
    to a single assignment statement.


    Breaking the data structure into smaller parts using destructuring makes fetching
    the data you need much easier. Furthermore, destructuring in ES6 uses the object
    and array literal notation syntax, which traditional users of JavaScript are already
    familiar with.


    ### Object Destructuring Syntax


    Let us take a look at the object destructuring syntax a little more closely. The
    Object Destructuring syntax as we have seen is,


    ```

    var { a: a, b: b, c: c } = {a: 1, b: 2, c: 3};

    ```


    In this example, you can notice that we used the same name for the variables being
    assigned and the properties of the returned object. They do not have to be the
    same, though, you can use any name for the local variables being assigned. But
    in case they are the same, the syntax can be further shortened by leaving out
    the `"a: "` part of the notation. This declaration statement can simply be written
    as,


    ```

    var { a, b, c } = {a: 1, b: 2, c: 3};

    console.log( a, b, c );             // 1 2 3

    ```


    It makes a lot of sense for us to use the smaller syntax instead of the long form,
    unless you want to assign a property to a different variable name, but there is
    an important nuance you need to be careful about when using the long form. Consider
    the following example,


    ```

    var { a: foo, b: bar, c: baz } = {a: 1, b: 2, c: 3};

    console.log( foo, bar, baz );         // 1 2 3

    console.log( a, b, c );               // ReferenceError

    ```'
