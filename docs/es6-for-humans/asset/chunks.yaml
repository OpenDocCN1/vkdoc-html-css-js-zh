- fmt: '# JavaScript Modules Guide


    ## Introduction


    All the exports in the module become accessible as properties of the declared
    object. This creates a new namespace since the object does not exist within the
    actual module.


    It is important to note that irrespective of the number of times the module is
    imported in the import statements, it will only be executed once. When the import
    is executed, the module is stored in memory and reused for all subsequent imports.
    The file storing the module is executed only once.


    ### Importing Default Values


    Importing default values from a module is as simple as:


    ```javascript

    import multiply from "./moduleFile.js";

    ```


    This import statement imports the default value from the module. Notice that we
    do not use any curly braces unlike when we import named exports. The name `multiply`
    in this case is local and will be used to refer to the default value imported
    from the module.


    In case of modules that export both default and non-default values, you can import
    all the bindings using a single statement:


    ```javascript

    export let message = "42 is the answer to the everything.";

    export default function(a, b) {

    return a * b;

    }

    import multiply, { message } from "./moduleFile.js";

    console.log(multiply (21, 2));    // 42

    console.log(message);             // "42 is the answer to the everything."

    ```


    You need to use a comma to separate the default local name and the non-default
    identifiers listed inside curly braces. Make sure to always have the default before
    the non-default values.


    Another way to import a default module with a specific local name would be:


    ```javascript

    import { default as multiply, message } from "./moduleFile.js";

    ```


    In this case, just like the previous example, `multiply` stores the default module
    exported from `moduleFile.js`. We will be discussing renaming identifiers using
    `as` keyword later in this chapter.


    ### Exporting an Imported Binding


    In case you need to re-export a binding that you imported into the module, you
    can do that using an export statement:


    ```javascript

    import { message } from "./moduleFile.js";

    // some javascript code

    export message;

    ```


    In this example, we imported the binding `message` from `moduleFile.js` and again
    exported the same binding. You can also do this in one statement instead of two
    like this:


    ```javascript

    export { multiply } from "./moduleFile.js";

    ```


    Furthermore, you can re-export everything using the wildcard `*` like in the following
    example:


    ```javascript

    export * from "./moduleFile.js";

    ```


    In the above example, everything from `moduleFile.js` is exported out of the current
    module, including the default value.


    ### Renaming Identifiers


    In many cases you might not want to use the original name of the imported variable,
    function, or class because it can cause a conflict with other declarations in
    the code. ES6 helps you solve this issue by letting you rename exports and imports
    using the `as` keyword:


    ```javascript

    function sum(a, b) {

    return a + b;

    }

    export { sum as add };

    ```


    In this example, `sum` is the local name of the exported function. But the function
    is exported as `add` and needs to be imported in another module using its exported
    name `add`:


    ```javascript

    import { add } from "./moduleFIle.js";

    ```


    Similarly, if you want to use a different name when you import the identifier,
    you can do something like this:


    ```javascript

    import { add as sum } from "./moduleFile.js";

    console.log(typeof add);            // "undefined"

    console.log(sum(1, 2));             // 3

    ```


    Here, the exported name `add` is imported as `sum`. Therefore, technically there
    is no identifier named `add` available for use in the rest of the code. It can
    only be referred to as `sum`.


    You can also rename an identifier to default to make it a default export:


    ```javascript

    function multiply(a, b) {

    return a * b;

    }

    export { multiply as default };

    ```


    Similarly, as we discussed before, you can import defaults after renaming them
    as well:


    ```javascript

    import { default as multiply, message } from "moduleFile.js";

    console.log(multiply(1, 2));      // 2

    console.log(message);             // "42 is the answer to the everything."

    ```


    Since `default` is a keyword in JavaScript, it cannot otherwise be used as a variable,
    function, or class name. Hence, the use of `default` to rename an export can be
    considered a special case to create a consistency with how non-default exports
    are defined. This syntax is useful if you want to use a single export statement
    to specify multiple exports, including the default, at once.


    ## Loading Modules


    ES6 does not specifically define how to load modules. This is because one of the
    design goals for the module specification was to remain agnostic to the environment
    where it is implemented. Instead of creating a specification that would work on
    all JavaScript environments, ES6 only specifies the syntax. Browsers and Node.js
    need to decide how to implement the `HostResolveImportedModule`, which is the
    internal operation to which ES6 abstracts the loading mechanism.


    ## Modules in Web Browsers


    There are many ways of using JavaScript inside your web applications but the primary
    way of inserting JavaScript inside HTML is through the `<script>` tag. The `<script>`
    tag has a `src` attribute letting you inform the application that the script is
    at a particular location. Another way is to directly include code inside the tag.
    You can also use workers to load JavaScript. Let us look at each of these mechanisms
    in the context of modules.


    ### Loading Modules with `<script>`


    The `<script>` element loads JavaScript files as scripts by default. It is equivalent
    to explicitly mentioning the `type` attribute with the content type as `text/javascript`.
    In order to support modules, the value `module` was added to type options. For
    example:


    ```javascript

    import { multiply } from "./moduleFile.js";

    let result = multiply(1, 2);

    ```


    Unlike scripts, modules use `import` to specify other files that need to be loaded
    for it to execute correctly. For this functionality to work properly, the module
    type for the script element always behaves as if the `defer` attribute was applied.
    The `defer` attribute is optional for loading script files but is always applied
    for loading module files. The module file starts getting downloaded as soon as
    the HTML parser encounters a `<script type="module">` element. So all modules
    are executed in the order in which they appear.


    ### Loading Modules Asynchronously in Browsers


    You might have already used the `async` attribute of the `<script>` tag in HTML.
    When you use this attribute inside the script tag, it lets the browser know that
    the script needs to be executed as soon as it has been fetched and is available.
    Therefore the order in which async scripts are executed is not synchronous. They
    are executed as soon as they are available, whichever order they might have been
    declared. You can use the same asynchronous process of execution when it comes
    to modules. The only small thing to keep in mind is that the import resources
    need to be fetched first before the module can be executed.


    ## Common Pitfalls


    Modules can be extremely useful in compartmentalizing code and creating reusable
    logical components. But there are a few pitfalls you should be aware of to use
    them effectively. In this section, we will be discussing these pitfalls in detail.


    ### Syntax


    Remember that both `export` and `import` need to be used only at the top level
    and cannot be part of other statements or functions. For example, the following
    code will throw a syntax error:


    ```javascript

    if (condition) {

    export condition;

    // SyntaxError: ''import'' and ''export'' may only appear at the top level

    }

    ```


    Here, the export statement is part of an `if` statement, which throws an error.
    Exports and imports cannot be executed conditionally or dynamically in any way.
    This also stands true in case of using import-export statements in a `try-catch`
    block. The `export` and `import` keywords were specifically designed to be static
    so that text editors could easily provide the information that is available from
    a specific module when it is imported.


    ### Read-Only Bindings'
