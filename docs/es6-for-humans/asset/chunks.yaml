    ## Map and WeakMap


    ES6 introduces a new set of data structures called `Map` and `WeakMap`, which
    are fundamentally a hash table or a dictionary as referred in Python or C#. ES6
    Maps provide a simple API to store objects by an arbitrary key, a pretty essential
    functionality required in many JavaScript programs. We will go into details about
    each of them in this section.


    ### Map


    We actually use maps in JavaScript all the time. In fact, every object can be
    considered a `Map`. An object is made of keys (always strings) and values, whereas
    in Map, any value (both objects and primitive values) can be used as either a
    key or a value.


    In `Map`, keys can be of any type: `string`, `Boolean, number, object`, or `function`.
    Have a look at this piece of code:


    ```

    let myMap = new Map();

    const keyString = "a string",

    keyObj = {},

    keyFunc = () => {};

    // setting the values

    myMap.set(keyString, "value associated with ''a string''");

    myMap.set(keyObj, "value associated with keyObj");

    myMap.set(keyFunc, "value associated with keyFunc");

    ```


    Note that the set() method is chainable so you can alternatively do this:


    ```

    myMap.set(keyString, "value associated with ''a string''")

    .set(keyObj, "value associated with keyObj")

    .set(keyFunc, "value associated with keyFunc");

    myMap.size; // 3

    // getting the values

    myMap.get(keyString);    // "value associated with ''a string''"

    myMap.get(keyObj);       // "value associated with keyObj"

    myMap.get(keyFunc);      // "value associated with keyFunc"

    ```


    #### Checking Keys Equality


    Key equality in Map() is based on the “same-value” algorithm, which is similar
    to the === operator but also considers NaN to be equal to NaN (even though generally
    NaN !== NaN), which means NaN when used as a key will return map objects that
    were previously set using NaN as the key. Consider the following code snippet,
    for example:


    ```

    let myMap = new Map();

    myMap.set(NaN, "not a number");

    myMap.get(NaN); // "not a number"

    ```


    Note that you can also create a map via an iterable over key/value pairs:


    ```

    let myMap = new Map([

    [ 1, ''apple'' ],

    [ 2, ''banana'' ],

    [ 3, ''orange'' ]

    ]);

    ```


    Also, maps can be iterated over using for...of or forEach():


    ```

    for (let [key, value] of myMap) {

    console.log(key + " = " + value);

    }

    // 1 = apple

    // 2 = banana

    // 3 = orange

    ```


    Maps also support keys(), values (), and entries() methods:


    ```

    for (let key of myMap.keys()) {

    console.log(key);

    }

    // 1

    // 2

    // 3

    for (let value of myMap.values()) {

    console.log(value);

    }

    // apple

    // banana

    // orange

    for (let [key, value] of myMap.entries()) {

    console.log(key + " = " + value);

    }

    // 1 = apple

    // 2 = banana

    // 3 = orange

    ```


    If you are a seasoned JS developer, you know that objects are the primary mechanism
    for creating unordered key/value pairs as data structures. However, using objects
    as maps does not give us the ability to use a non-string value as a key.


    At this point, you must be wondering, when and when not to use maps over objects.
    You should always use a Map when you need a key/value collection, because objects
    inherently were not designed to be used as collections, and as a result there’s
    no efficient way to determine the number of properties an object has. When you
    loop over an object’s properties, you also get its prototype properties. Of course
    there are some workarounds for this but when you loop over an object’s properties,
    the properties won’t necessarily be retrieved in the same order they were inserted.
    That’s why it is recommended to use maps when you need a key/value collection
    in your JavaScript program.


    A good indicator would also be the case where you don’t know the keys of the collection
    beforehand, that is, they are being read from the database or input by the user,
    which means they don’t necessarily have to be a string or a number. In contrast,
    you should be using objects when you know which and how many properties the object
    has while writing the code, that is, when their shape is static.


    ### WeakMap


    WeakMaps are similar to normal Maps, albeit with fewer methods and some differences
    with regards to garbage collection. A `WeakMap` is a `Map` in which the keys are
    weakly referenced, which means a `WeakMap` doesn’t prevent its keys from being
    garbage collected if all references to the key are lost and there are no more
    references to the value. Therefore, you don’t have to worry about memory leaks
    with WeakMaps. Usually you want this behavior when storing metadata related to
    something like a DOM node such that DOM elements should be released from memory
    when they’re no longer of interest.


    The biggest limitation in a `WeakMap` is that it is not iterable, as opposed to
    Map – which means it does not support `entries(), keys(), values(), forEach(),`
    and `clear()` methods. Another thing to note here is that, in `WeakMap`, as opposed
    to a `Map`, every key must be an `object`.


    Although it has almost the same API like a `Map`, we can’t iterate over the `WeakMap`
    collection. We can’t even determine the length of the collection because we don’t
    have a size attribute here. A `WeakMap` only has four methods:


    *   delete(key)

    *   has(key)

    *   get(key)

    *   set(key, value)


    ```

    let wMap = new WeakMap();

    wMap.set(''a'', ''b'');

    // Uncaught TypeError: Invalid value used as weak map key

    const o1 = {},

    o2 = () => {},

    o3 = window;

    wMap.set(o1, 42);

    wMap.set(o2, "hello");

    wMap.set(o3, undefined);

    wMap.get(o3); // undefined, because that is the set value

    wMap.has(o1); // true

    wMap.delete(o1);

    wMap.has(o1); // false

    ```


    ## Set and WeakSet


    Sets and WeakSets are yet another collection type introduced in ES6\. If you come
    from programming languages like Python, you would know how incredibly helpful
    sets can be. Let’s take a look at them in this section.


    ### Set


    `Set` objects are collections of unique values. Duplicate values are ignored,
    as the collection must have all unique values. Sets are fast and the values can
    be primitive types or object references.


