  trans: '

    # 1\. ES6 入门指南


    如今，全球约有 46%的人口能够接入互联网，并且这一数字还在稳步增长。当你阅读这段文字时，世界各地正有人通过互联网服务预订出租车、航班，或是在高档餐厅预定双人桌；关键在于，如今的互联网已让人们的生活变得更加便捷。每天都有越来越多的
    Web 应用被创建出来，旨在节省人们的时间、提供更高标准的舒适度，或仅仅是为了娱乐。这些应用可以随时随地访问，其中许多都是使用`JavaScript`构建的。


    根据 StackOverflow 开发者调查，`JavaScript`是地球上最常用的编程语言。Web 平台的普适性正推动开发者比其他任何语言都更多地使用`JavaScript`，这进而催生了像`Node.js`这样的`JavaScript`平台，像`Angular`和`React`这样的前端框架，以及像`MEAN`（`MongoDB`、`ExpressJS`、`AngularJS`和`NodeJS`）这样的完整
    Web 技术栈。


    本书将讨论`ES 2015`（通常被称为`ES6`）及之后版本的核心概念，同时聚焦于最佳开发实践。当你读完本书时，你将深刻理解核心`ES6`的概念、特性及其在现代开发工作流中的适用性。


    ## ES6 规范


    多年来，`ECMAScript 6`（`ES6`）一直在研发中。但在 2015 年 6 月 17 日，第 109 届 Ecma 全体大会批准了第 6 版`ECMA-262`标准，正式对我们所熟知并热爱的`JavaScript`进行了一次重大升级。


    `JavaScript`，更具体地说是`ECMAScript`的演进，主要由社区驱动，而`TC39`是负责此事的官方委员会。`TC39`主要由代表各方利益的成员组成，例如各大浏览器公司及其他受邀成员。他们定期会面与沟通，负责维护和升级`ECMAScript`编程语言及其扩展其能力的库的标准。在此过程中，他们审议和评估关于补充和附加技术以演进`ES`的提案。如果你有兴趣了解更多或查看他们会议的议程和纪要，这些内容都在
    GitHub 上公开（`https://github.com/tc39/tc39-notes`）。


    `ECMAScript`标准的设计流程围绕提案展开，这些提案通常是开发者社区对新特性或现有特性升级的热门请求。由于`TC39`参与者众多，进行协作设计工作较为困难，因此通常会指派一到两名委员会成员作为“负责人”，负责维护一个提案、进行设计工作并向委员会汇报。


    一个提案要成为标准，必须经过多个阶段。提案的初始特性草图，也被称为“稻草人提案”，是委员会讨论的第一阶段；如果委员会认同其重要性，它将被视为正式提案。随后，该提议的特性至少需要在两个主要的`JavaScript`引擎中实现，以收集社区反馈并进一步演进提案。一旦提案通过这些阶段并整合了反馈，`TC39`便会批准它，并将其纳入新版的`ECMAScript`标准中。


    ## ECMA、ECMAScript 和 JavaScript 的历史


    对于不了解`JavaScript`历史的人来说，看到诸如`JavaScript`、`ECMAScript`、不同的版本号，以及其他流行的分支如`ActionScript`、`JScript`和`TypeScript`等众多不同名称时，会很快变得非常困惑——而这些其实都是`JavaScript`的不同形式。


    `JavaScript`最初由布兰登·艾奇（Brendan Eich）开发，作为 Netscape 浏览器中使用的 Web 脚本语言。由于当时`Java`日益流行，出于营销原因选择了这个名字，尽管它与`Java`毫无关系。为了将语言和规范标准化，它被提交给了`ECMA
    International`——一个专注于信息和通信技术及消费电子产品标准化的机构。最终，在`ECMA-262`中标准化的语言被简称为`ECMAScript`或`ES`，因为`JavaScript`是
    Sun 公司的商标，现在归 Oracle 所有。尽管如此，大家仍然普遍称这种语言为`JavaScript`。在以`ECMAScript`为核心的不同实现中存在许多变体，例如微软为
    Internet Explorer 稍作修改后采用的`JScript`。另一个衍生的例子是 Adobe 开发的`ActionScript`。


    最初的版本`ES1`和`ES2`分别于 1997 年和 1998 年发布。但在 1999 年，`ES3`版本是一次重大升级，引入了诸如正则表达式、改进的字符串处理、更多控制语句、更好的错误处理以及`try
    catch`异常处理等许多我们今天在`JavaScript`中常用的增强功能。它在各大主流浏览器和引擎中有着广泛的基础实现形式。


    在`ES3`发布后，`ES4`的工作进展顺利，但涉及许多根本性的变革和庞大的范围。更新的特性包括新语法、模块、类、经典继承、私有对象成员、可选类型注解等。提议的变更导致了社区内各利益相关方在技术和政治上的诸多分歧，最终导致其在
    2003 年被搁置。部分提议的特性被纳入到像`ActionScript`和`Jscript.NET`这样的实现中。在收到这些实现的反馈后，`TC39`于 2005
    年决定恢复`ES4`的工作。但此时社区内部已经出现巨大分裂，形成了两个主要阵营，在前进方向上存在分歧。


    由微软和雅虎等公司支持的替代版本，在对现有规范进行较少特性添加和改进方面，被称为`ECMAScript 3.1`。由于阵营之间未能达成共识，且`JavaScript`的未来充满不确定性，数年内没有取得重大进展。最终在
    2008 年，`TC39`在`ES4`和`ES3.1`之间达成了共识。`ECMAScript 3.1`最终被标准化为`ECMA-262`的第五版，也称为`ECMAScript
    5`，而为了避免混淆，委员会从未发布过`ECMAScript 4`标准。`ES5`将是一个小规模的增量更新，同时他们将致力于下一个主要版本，该版本将比`ES4`更为温和，放弃了诸如包、命名空间和早期绑定等许多提议特性。由于此次会议的性质，这个提议的版本被代号为`ES
    Harmony`。


    `ES5`于 2009 年 12 月发布，是目前现代浏览器中支持最广泛的版本。它带来了对标准库的许多增强，并通过严格模式更新了语言语义。


    当`ES Harmony`的计划对于一个单一版本来说显得过于雄心勃勃时，他们将优先级最高的第一批特性拆分出来，并代号为`ES.Next`，以避免重蹈`ES4`的覆辙而使用版本号进行草率命名；一旦成熟，该规范便被命名为`ECMAScript
    6`。

