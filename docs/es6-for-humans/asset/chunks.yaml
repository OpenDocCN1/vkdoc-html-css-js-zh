    ```

    function sum( [ num1, num2 = 0 ] ) {

    console.log( num1 + num2 );

    }

    sum( [ 1, 2 ] );         // 3

    sum( [ 1 ] );            // 1

    sum( [  ] );             // NaN

    ```


