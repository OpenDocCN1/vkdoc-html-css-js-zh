  trans: "\nES6 经过漫长的时间才正式定稿。ES6 提案的截止日期是 2011 年 5 月，此后不再考虑任何重大提案；但从后续版本开始，TC39 决定采用时间箱式发布，每年发布一个包含增量小改动的新版本，使用当时已获批的任何特性。因此，委员会决定更改版本的命名约定，以表明发布年份。因此，ES6\
    \ 的官方名称在最终发布前改为 ECMAScript 2015，但 ES6 这个名称多年来被广泛使用，以至于 ES2015 仍然常被称为 ES6，这也是我们在本书中始终将新规范称为\
    \ ES6 的原因。但展望未来，ES 版本将正式以其发布年份命名。所以当我们说 ES6 时，我们指的是 ES2015 中更广泛的改动。\n\n从宏观角度来看，ES6\
    \ 规范草案分为四个主要部分：目标、要求、方法和主题。目标旨在修复 JavaScript 中的常见缺陷并添加新特性，而要求则指出这两点必须在不破坏任何现有代码的同时，保持语言的轻量级特性。\n\
    \n我们不会在此深入探讨所有目标。但你应该知道，这些目标旨在使其成为更适合编写复杂应用程序、库等的语言。ES6 保持版本控制的简单和增量性，避免了版本分裂；“单一\
    \ JavaScript”哲学对此做了最好的描述。例如，在 ES6 中，一切都是 ES6 代码：不存在仅针对 ES5 的部分。\n\nES6 旨在为大型应用程序和库的创建提供更好的支持。它提供了诸如类、模块、词法块作用域、迭代器、生成器、对\
    \ Promise 的原生语言支持等增强功能。\n\nECMAScript 标准的开发是由社区驱动的，该语言的特性要求在未来版本中将持续演進，以便做得更好。\n\
    \n## 单一 JavaScript\n\n原则上，当语言实现的新版本出现时，这是一个清理旧有过时特性、为更新更好的实现让路的机会。这导致了版本分裂，这基本上意味着每段代码都需要关联到语言的特定版本。例如在\
    \ Python 中，要在 Python 2 和 Python 3 之间切换，就需要迁移代码库。但这种选择对于 Web 和像 JavaScript 这样的语言是不可行的。你总会遇到互联网上遗留的旧代码块。\n\
    \n因此，ES 规范致力于升级语言并避免版本分裂。这是通过始终保持向后兼容来实现的，也就是说，所有有效的 ES5 代码也是有效的 ES6 代码。因此，ES6\
    \ 被设计为没有任何破坏性的更改，并且不会移除任何以前的特性。所以理论上，引擎不需要指定版本。因此，与其移除现有特性，不如引入新的、更好的特性。\n\n这对你，一位\
    \ JavaScript 开发者，意味着什么？由于 ES6 是 ES5 的超集，你将无需迁移任何旧代码。你现有的 JS 代码同样是有效的 ES6 代码。因此，重申一遍，你无需做任何事。因此，你在现有\
    \ JavaScript 中学到并使用的所有东西都可以迁移到 ES6，并且它有更多更好的工具可以添加到你的现有技能库中。如果你希望逐步将当前系统移植到 ES6，这将非常有用，因为一切都是向后兼容的。\n\
    \n## 使用 ES6\n\n许多 JavaScript 环境，包括 Web 浏览器和 Node.js，都在积极致力于实现 ECMAScript 6 及后续版本的所有特性。但要在整个互联网上普遍支持\
    \ ES6 还需要一些时间。在编写本书时，最新版本的 Chrome 已实现 97% 的特性，Safari 已实现 100% 的特性。你可以通过 [`http://kangax.github.io/compat-table/es6/`](http://kangax.github.io/compat-table/es6/)\
    \ 查看所有引擎当前按特性划分的支持情况。\n\n在所有 ES6 特性得到普遍支持之前，我们需要一种将 ES6 转换为兼容 JavaScript 代码的方法。这就是转译\
    \ (transpiling) 的作用所在。转译（转换 + 编译）是一种技术，我们使用特殊工具将 ES6 代码转换为其最接近的等价物——ES5 代码，以便在旧版浏览器或环境中运行。\n\
    \n考虑以下 ES6 代码：\n\n```\nconst fruits = [\"apples\", \"bananas\", \"oranges\"];\n\
    let store = {\nfruits\n};\nstore.fruits; // [\"apples\", \"bananas\", \"oranges\"\
    ]\n```\n\n它大致转译成：\n\n```\nvar fruits = [\"apples\", \"bananas\", \"oranges\"];\n\
    var store = {\nfruits: fruits\n};\nstore.fruits; // [\"apples\", \"bananas\",\
    \ \"oranges\"]\n```\n\n一些 ES6 特性只需使用 polyfill 或 shim 即可工作，这些是简单模式，用于在旧环境中定义新行为。你也可以通过\
    \ ES6 REPL（如 [`https://jsfiddle.net/`](https://jsfiddle.net/) 和 [`babeljs.io/repl/`](http://babeljs.io/repl/)）在浏览器中在线运行和转译小段\
    \ ES6 代码。但对于大型项目，你需要使用任何可用的转译器。我们推荐使用 Babel，它是当今最流行的 JavaScript 转译器之一。\n\n## 使用\
    \ Babel 和 webpack 搭建 ES6 环境\n\n为了在今天的项目中使用 ES6，你需要一套构建工具来启动和运行。在本节中，我们将讨论一些构建工具，并搭建一个\
    \ ES6 样板项目，你可以将其作为 ES6 项目的入门套件。\n\n### 使用 Babel 进行转译\n\nBabel.js 是一个很棒的工具，它能让你将\
    \ ES6 代码转译成 ES5 代码，然后可以在当前的 JavaScript 环境中运行。Babel 通过语法转换器支持最新版本的 JavaScript，这些插件允许你使用新的语法，而无需等待浏览器支持。\n\
    \n第一步是使用 npm 在你的本地机器上安装 Babel。\n\n注意\n\n在继续之前，请确保你已经安装了 Node.js 和 npm。如果你尚未安装\
    \ node 和 npm，可以访问 [`https://nodejs.org/en/`](https://nodejs.org/en/) 来搭建你的开发环境。\n\
    \n```\nnpm install -g babel-cli\n```\n\n现在，你可以从命令行使用以下命令运行任何包含 ES6 代码的文件：\n\n\
    ```\nbabel-node \n```\n\n但是，手动转译每个文件效率不高，并且在大多数情况下，不是管理大型项目的解决方案。所以让我们搭建一个 ES6\
    \ 入门套件，它将帮助你自动化构建过程，并使开发过程更高效。\n\n### 搭建 ES6 样板项目\n\n为了转译一个 ES6 项目，我们将使用 `babel-loader`\
    \ 和 `webpack`，它们将帮助我们生成一个包含所有转译代码及相关依赖的捆绑输出。\n\n#### 启动一个新项目\n\n在你的终端中运行以下一组命令来启动一个新项目：\n\
    \n```\nmkdir es6-boilerplate\ncd es6-boilerplate\nnpm init –yes\n```\n\n`npm init`\
    \ 创建一个具有其自身 `package.json` 的新项目，`–yes` 标志阻止 `npm` 提示你任何选项，并将使用默认设置。\n"
- fmt: "## Install webpack and webpack-dev-server\n\nWebpack is a very flexible module\
    \ bundler that takes modules with dependencies and generates static assets representing\
    \ those modules. We will be using webpack to let `babel-loader` transpile our\
    \ ES6 code into traditional ES5 code and generate a bundled output file.\n\n```\n\
    npm install –-save-dev webpack\n```\n\nBesides webpack, we need to use `webpack-dev-server`\
    \ to serve our app and transpile the code on the fly. But, note that `webpack-dev-server`\
    \ is a development server and should not be used for production.\n\n```\nnpm install\
    \ –-save-dev webpack-dev-server\n```\n\n**Note:** To read more about webpack and\
    \ `webpack-dev-server` in detail, you can visit [https://webpack.js.org/concepts/](https://webpack.js.org/concepts/)\
    \ .\n\n## Install Babel in the Project\n\nYou can install babel into your project\
    \ very easily using the following npm packages:\n\n```\nnpm install --save-dev\
    \ babel-loader babel-core babel-preset-es2015\n```\n\nThe next step is to configure\
    \ babel to use ES2015 presets by adding a new file `.babelrc` in the root directory\
    \ of your project with the following JSON:\n\n```\n{\n\"presets\": [\"es2015\"\
    ]\n}\n```\n\nYour `package.json` file should more or less look like this:\n\n\
    ```\n{\n\"name\": \"es6-boilerplate\",\n\"version\": \"1.0.0\",\n\"description\"\
    : \"ES6 Boilerplate\",\n\"devDependencies\": {\n\"babel-core\": \"^6.24.1\",\n\
    \"babel-loader\": \"^6.4.1\",\n\"babel-preset-es2015\": \"^6.24.1\",\n\"webpack\"\
    : \"^2.4.1\",\n\"webpack-dev-server\": \"^2.4.2\"\n}\n}\n```\n\nNow, create a\
    \ new `index.html` file and `index.js` file in the root directory of your project.\
    \ And your current project directory should look like the following:\n\n```\n\
    .\n├── index.html\n├── node_modules\n├── package.json\n├── index.js\n```\n\n##\
    \ Configuring Webpack\n\nThe next step is to set up webpack by creating a configuration\
    \ file - `webpack.config.js` in the root directory of your project.\n\nA webpack\
    \ configuration file is a CommonJS-style module where a configuration object is\
    \ exported out of this module.\n\n```js\n// webpack.config.js\nmodule.exports\
    \ = {\nentry: './index.js',\noutput: {\npath: './dist',\nfilename: 'bundle.js'\n\
    }\n};\n```\n\nHere, `entry` is the path to the source of your project and webpack\
    \ will analyze your entry file for dependencies and generate a bundled output\
    \ (which includes all the dependency modules). Note that only the entry module\
    \ is executed on startup.\n\n## Add Loaders\n\nLoaders allow you to preprocess\
    \ files as you load them. Loaders provide a powerful way to handle front-end build\
    \ steps and can transform files from a different language, like CoffeeScript to\
    \ JavaScript or inline images as data URLs. For example, `babel-loader` uses Babel\
    \ to load ES2015 files.\n\nSo now, modify `webpack.config.js` to process all `.js`\
    \ files using `babel-loader`:\n\n```js\nmodule.exports = {\nentry: './index.js',\n\
    output: {\npath: __dirname + '/dist',\npublicPath: '/dist/',\nfilename: 'bundle.js'\n\
    },\nmodule: {\nrules: [{\ntest: /\\.js$/,\nexclude: /node_modules/,\nuse: 'babel-loader'\n\
    }]\n}\n};\n```\n\nThe above configuration implies the following:\n\n1. `./index.js`\
    \ is the entry point of the application.\n2. Output will be generated in `./dist/bundle.js`.\n\
    3. We are processing every `.js` file using the `babel-loader`, excluding `node_modules`\
    \ to avoid external libraries going through Babel, slowing down compilation.\n\
    \n## Adding Your Generated `bundle.js` Script to Your `index.html`\n\nNow we can\
    \ include the `bundle.js` script into our html file to run the code.\n\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n  \
    \  <title>ES6 Boilerplate</title>\n</head>\n<body>\n    <h1>ES6 Boilerplate</h1>\n\
    \    <p>Check console for details</p>\n    <script src=\"./dist/bundle.js\"></script>\n\
    </body>\n</html>\n```\n\nTo compile your `.js` file, you can run the following\
    \ command in your terminal:\n\n```\nwebpack\n```\n\nYou can also use the following\
    \ additional flags with `webpack`:\n\n* `webpack` for building once for development.\n\
    * `webpack -p` for building once for production (minification).\n* `webpack -w`\
    \ for continuous incremental build in development (fast!).\n* `webpack -d` to\
    \ include source maps.\n\n**Pro Tip:** We can achieve prettier output using `webpack\
    \ --progress --colors` that adds a progress bar and colors in the webpack output\
    \ in the terminal.\n\n## Setting Up a Development Server\n\nTo start a development\
    \ server to test your code, you can run the following command:\n\n```\nwebpack-dev-server\
    \ -d --progress --colors\n```\n\nThis binds a small node-express server on `localhost:8080`,\
    \ which serves your static assets as well as the bundle (compiled automatically).\
    \ It automatically updates the browser page when a bundle is recompiled.\n\nWe\
    \ can also add these webpack commands to your `package.json` scripts.\n\n```json\n\
    \"scripts\": {\n\"start\": \"webpack-dev-server --hot --inline\",\n\"watch\":\
    \ \"webpack -w -d\",\n\"build\": \"webpack -p\"\n},\n```\n\nNow, you can use this:\n\
    \n* `npm start` to run a dev server at `localhost:8080` and watch for/recompile\
    \ on changes.\n* `npm run watch` to only watch for/recompile on changes on your\
    \ own web-server.\n* `npm run build` to generate a minified, production-ready\
    \ build.\n\nLet’s try this out with a `helloWorld()` function inside our `index.js`\
    \ file:\n\n```js\nconst helloWorld = () => {\nconsole.log(\"Hello! We are all\
    \ set!\");\nconsole.log(\"Arrow functions are working\");\n};\nhelloWorld();\n\
    ```\n\nTo ensure everything is working perfectly, you can run `npm start` in your\
    \ terminal and check the server running at `http://localhost:8080`.\n\nYou can\
    \ run `npm run watch` to see the transpiled code in your `bundle.js` file located\
    \ inside the `dist` directory, which will have this chunk of transpiled ES5 code:\n\
    \n```js\nfunction(module, exports) {\n\"use strict\";\nvar helloWorld = function\
    \ sayHello() {\nconsole.log(\"Hello! We are all set!\");\nconsole.log(\"Arrow\
    \ functions are working\");\n};\nhelloWorld();\n}\n```\n\nFinally, we also recommend\
    \ using ESLint in your project to use best practices and avoid errors while writing\
    \ your code. You can find the above boilerplate code at [https://github.com/metagrover/ES6-boilerplate](https://github.com/metagrover/ES6-boilerplate)\
    \ , which also has an `.eslintrc` file that contains the standard rules and configurations\
    \ we use."
  raw: '#### Install webpack and webpack-dev-server


    Webpack is a very flexible module bundler that takes modules with dependencies
    and generates static assets representing those modules. We will be using webpack
    to let babel-loader transpile our ES6 code into traditional ES5 code and generate
    a bundled output file.


    ```

    npm install –-save-dev webpack

    ```


    Besides webpack, we need to use `webpack-dev-server` to serve our app and transpile
    the code on the fly. But, note that `webpack-dev-server` is a development server
    and should not be used for production.


    ```

    npm install –-save-dev webpack-dev-server

    ```


    Note


    To read more about webpack and webpack-dev-server in detail, you can visit [`https://webpack.js.org/concepts/`](https://webpack.js.org/concepts/)
    .


    #### Install Babel in the Project


    You can install babel into your project very easily using the following npm packages:


    ```

    npm install --save-dev babel-loader babel-core babel-preset-es2015

    ```


    The next step is to configure babel to use ES2015 presets by adding a new file
    .babelrc in the root directory of your project with the following JSON:


    ```

    {

    "presets": ["es2015"]

    }

    ```


    Your package.json file should more or less look like this:


    ```

    {

    "name": "es6-boilerplate",

    "version": "1.0.0",

    "description": "ES6 Boilerplate",

    "devDependencies": {

    "babel-core": "^6.24.1",

    "babel-loader": "^6.4.1",

    "babel-preset-es2015": "^6.24.1",

    "webpack": "^2.4.1",

    "webpack-dev-server": "^2.4.2"

    }

    }

    ```


    Now, create a new `index.html` file and `index.js` file in the root directory
    of your project And your current project directory should look like the following:


    ```

    .

    ├── index.html

    ├── node_modules

    ├── package.json

    ├── index.js

    ```


    #### Configuring Webpack


    The next step is to set up webpack by creating a configuration file - `webpack.config.`
    `js` in the root directory of your project.


    A webpack configuration file is a CommonJS-style module where a configuration
    object is exported out of this module.


    ```

    // webpack.config.js

    module.exports = {

    entry: ''./index.js'',

    output: {

    path: ''./dist'',

    filename: ''bundle.js''

    }

    };

    ```


    Here, entry is the path to the source of your project and webpack will analyze
    your entry file for dependencies and generate a bundled output (which includes
    all the dependency modules). Note that only the entry module is executed on startup.


    #### Add Loaders


    Loaders allow you to preprocess files as you load them. Loaders provide a powerful
    way to handle front-end build steps and can transform files from a different language,
    like CoffeeScript to JavaScript or inline images as data URLs. For example, babel-loader
    uses Babel to load ES2015 files.


    So now, modify `webpack.config.js` to process all .js files using babel-loader:


    ```

    module.exports = {

    entry: ''./index.js'',

    output: {

    path: __dirname + ''/dist'',

    publicPath: ''/dist/'',

    filename: ''bundle.js''

    },

    module: {

    rules: [{

    test: /\.js$/,

    exclude: /node_modules/,

    use: ''babel-loader''

    }]

    }

    };

    ```


    The above configuration implies the following:


    1.  ‘./index.js’ is the entry point of the application.  

    2.  Output will be generated in ‘./dist/bundle.js’.  

    3.  We are processing every .js using the `babel-loader`, excluding `node_modules`
    to avoid external libraries to go through Babel, slowing down compilation.


    ### Adding Your Generated bundle.js script to your index.html


    Now we can include the bundle.js script into our html file to run the code.


    ```


    ES6 Boilerplate


    ES6 Boilerplate

    Check console for details


    ```


    To compile your .js file, you can run the following command in your terminal:


    ```

    webpack

    ```


    You can also use following additional flags with `webpack`:


    *   webpack for building once for development.

    *   webpack -p for building once for production (minification).

    *   webpack -w for continuous incremental build in development (fast!).

    *   webpack -d to include source maps.


    Pro Tip We can achieve prettier output using webpack – progress – colors that
    add a progress bar and colors in the webpack output in the terminal.


    #### Setting Up a Development Server


    To start a development server to test your code, you can run the following command:


    ```

    webpack-dev-server -d --progress --colors

    ```


    This binds a small node-express server on localhost:8080, which serves your static
    assets as well as the bundle (compiled automatically). It automatically updates
    the browser page when a bundle is recompiled.


    We can also add these webpack commands to your package.json scripts.


    ```

    "scripts": {

    "start": "webpack-dev-server --hot --inline",

    "watch": "webpack -w -d",

    "build": "webpack -p"

    },

    ```


    Now, you can use this:


    *   npm start to run a dev server at localhost:8080 and watch for/recompile on
    changes.

    *   npm run watch to only watch for/recompile on changes on your own web-server.

    *   npm run build to generate a minified, production-ready build.


    Let’s try this out with a `helloWorld()` function inside our `index.js` file:


    ```

    const helloWorld = () => {

    console.log("Hello! We are all set!");

    console.log("Arrow functions are working");

    };

    helloWorld();

    ```


    To ensure everything is working perfectly, you can run `npm start` in your terminal
    and check the server running at `http://localhost:8080`.


    You can run `npm run watch` to see the transpiled code in your `bundle.js file`
    located inside the dist directory, which will have this chunk of transpiled ES5
    code:


    ```

    function(module, exports) {

    "use strict";

    var helloWorld = function sayHello() {

    console.log("Hello! We are all set!");

    console.log("Arrow functions are working");

    };

    helloWorld();

    }

    ```


    Finally, we also recommend using ESLint in your project to use best practices
    and avoid errors while writing your code. You can find the above boilerplate code
    at [`https://github.com/metagrover/ES6-boilerplate`](https://github.com/metagrover/ES6-boilerplate)
    , which also has an `.eslintrc` file that contains the standard rules and configurations
    we use.'
