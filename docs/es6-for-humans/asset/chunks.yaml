    \ 中构建伪类以模仿其他编程语言中基于类的开发模式的现有模式正式化。它们使 JavaScript 中的继承更易于使用，并为你提供了语法糖，以便用更简单的基于类的语法实现\
    \ JavaScript 的经典原型继承模型。\n\n在本章中，我们研究了 `ES6` 中的类如何在底层使用原型继承，通过在类原型上定义非静态方法，而所有静态方法则定义在类本身上，使得所有类方法都不可枚举。我们还学习了新的基于类的继承语法，它允许你从基类创建派生类，也允许你继承自\
    \ JavaScript 中的内置类，如 `Array`，`String` 和其他数据类型。总的来说，类是对 JavaScript 非常重要的语法补充，通过提供简洁的语法，使我们能够以更清晰的方式声明自定义对象类型。\n\
    \n# 5. 模块\n\nJavaScript 在其早期阶段，最初是作为 Web 浏览器的一种简单脚本语言开始的。因此，它最初是建立在“一切都是共享的”方法之上的。但随着时间的推移，随着语言的发展以及\
    \ JavaScript 应用程序变得越来越复杂，这种加载代码的方法开始变得更容易出错且令人困惑。这与大多数高级语言使用如模块和包等概念来帮助定义代码作用域的事实形成对比。在\
    \ `ES6` 之前，JavaScript 应用程序中的所有内容，包括应用程序不同文件中的代码，都共享相同的作用域。这正是模块发挥作用的地方，它们有助于更好地管理和引入代码分离，减少命名冲突等问题并提高数据安全性。JavaScript\
    \ 开发者被迫求助于外部库来引入模块以帮助解决这些特定问题，但有了 `ES6`，模块现在已成为该语言的官方组成部分。\n\n## 模块系统及一点历史\n\n\
    过去，JavaScript 有两个主要的模块系统：异步模块定义 (AMD) 和 `CommonJS`。`CommonJS` 是 `Node.js` 中常用实现的模块标准。它具有简洁的语法，专为同步加载和服务器设计。另一方面，`AMD`\
    \ 是 `RequireJS` 中的流行实现，其语法稍显复杂，允许它在没有 `eval()` 或编译步骤的情况下工作。它专为异步加载和浏览器设计。两者在浏览器中都不是原生可用的。\n"
- fmt: '当 TC39 决定在 ES6 中实现模块规范时，他们没有采用已有的两种方案，而是提出了一种新的实现方法。他们的目标是同时满足 CommonJS 和
    AMD 的用户。这种新方法建立在两者之上，并试图解决开发者在这两种实现中经常遇到的许多问题。


    ES6 模块提供了来自 AMD 和 CommonJS 的特性。它们使用紧凑的语法和静态模块结构，有助于代码优化、静态检查和消除死代码。它还像 CommonJS
    一样支持循环依赖，并像 AMD 一样支持异步加载和可配置的模块加载。


    终结 CommonJS 和 AMD 之间的碎片化，并拥有一个统一的本地模块标准，带来了额外的好处，例如废弃了传统上用于使同一文件能在不同系统中使用的 UMD（通用模块定义）模式。


    ## 传统 JavaScript 中的模块模式


    为了帮助我们更好地理解模块，在进入 ES6 模块之前，我们将用传统 JavaScript 实现模块模式。简单来说，模块是一个包含内部变量和函数的函数，可以通过返回一个“公共
    API ”来暴露给外部环境，该 API 通过拥有数据闭包的方法来访问函数内的数据。为了说明这一点，我们使用模块模式编写一个函数：


    ```

    function Message(text) {

    function printMessage() {

    console.log("This is the message: " + text + "!");

    }

    return {

    printMessage: printMessage

    };

    }

    var printer = Message("test");

    printer.printMessage();          // This is the message: test!

    ```


    在此示例中，变量`printer`被赋值为带有参数"`test.`"的函数`Message`。`Message`是实现模块模式的函数，它为`printer`提供了一个公共
    API，该 API 可以访问其内部函数`printMessage`，作为打印`text`参数的方法。


    ## ES6 中的模块


    ES6 中的模块使得将代码划分和分离成更小的独立片段变得更加容易，这些片段可以在需要时被重用并注入到其他地方，从而使测试代码的过程更加容易，因为模块与主代码解耦。模块在异步加载脚本方面也很有用，可以提高应用的加载时间。但模块系统对
    JavaScript 来说并不新鲜。


    模块就是被从其他文件加载到 JavaScript 代码中的 JavaScript 文件。但理解这与脚本的加载方式有何不同非常重要。如果我们将 JavaScript
    模块的语义与传统脚本加载进行比较，会发现一些关键区别。首先，模块始终在严格模式下运行，而传统脚本则可以更改。如果你查看模块的顶级作用域，`this`的值是`undefined`，并且在顶层创建的变量不会出现在共享的全局作用域中。你需要从模块内部获取的任何东西都必须显式地导出，我们才能在模块外部使用它们。现在，让我们通过理解导入和导出绑定的能力，来了解模块的核心价值。


    ## 导出


    `export`关键字可用于将模块内部的代码部分暴露给其他模块。你可以从模块中导出一个变量、一个函数或一个类声明。未从模块导出的变量、函数或类在模块外部不可访问。让我们看几个例子：


    ```

    export var text = "ES6 is awesome";

    export let name = "Ian Murawski";

    export const number = 7;

    ```


    在此示例中，你正在导出`text`、`name`和`number`，它们使用不同的变量声明关键字声明。你也可以从模块中导出一个函数或类。考虑以下示例：


    ```

    export function add(a, b) {

    return a + b;

    }

    export class Rectangle {

    constructor(length, width) {

    this.length = length;

    this.width = width;

    }

    }

    ```


    在这段代码片段中，我们正在导出函数`add`和类`Rectangle`。你也可以导出一个模块私有的现有函数。


    ```

    function multiply(a, b) {

    return a * b;

    }

    export { multiply };

    ```


    从这个例子中，我们可以看到不仅可以导出一个函数声明——而且还可以导出一个对模块私有函数的引用。


    此时，理解这一点很重要：只有带有名称的函数或类声明才能以这种方式导出，所有这些导出都被称为命名导出。你不能从模块中导出匿名函数或类，除非它们被标记为使用`default`关键字指定的`default`导出。你可以在一个模块中有多个命名导出，但只能有一个默认导出。同时使用两者是可能的，但通常最佳实践是将它们分开。


    ### 默认导出


    在 Node.js 中，模块只导出单个值是常见的做法。即使在前端 JavaScript 中，当我们为模型和组件使用类时，每个模块一个类也是常见的做法。ES6
    模块被设计为选取一个默认导出，作为主要的导出值。


    可以使用`default`关键字将单个变量、函数或类指定为模块的默认导出。在一个模块中，你只能有一个值作为默认导出。在模块内对多个导出使用该关键字会引发错误。默认导出有助于简化从模块导入导出的语法。


    ```

    export default function(a, b) {

    return a * b;

    }

    ```


    在此示例中，该函数作为其默认值从模块导出。你可以注意到该函数如何不需要名称，因为它是默认导出，并且模块本身代表该函数，允许你省略函数的名称。你也可以为其分配一个名称，并使用`default`导出函数名称。考虑以下示例：


    ```

    function multiply(a, b) {

    return a * b;

    }

    export default multiply;

    ```


    ## 导入


    一旦设置了包含相关导出的模块，就可以通过使用`import`关键字在另一个模块内访问它。import 语句包含两部分：你要导入的标识符以及应从哪里导入这些标识符的模块。这是其基本形式的语句：


    ```

    import { identifier1, identifier2 } from "./moduleFile.js";

    ```


    在上面的语句中，`identifier1`和`identifier2`是从`moduleFile.js`导入的绑定。


    模块通过`from`关键字后一个表示包含模块的文件路径的字符串来指定。请注意，绑定列表看起来像一个解构对象，但请记住它不是。此外，绑定类似于使用`const`定义的变量，也就是说，你不能使用相同的名称定义任何其他变量，也不能导入另一个具有相同名称的模块。


    使用上述语法，你可以从模块中导入特定的绑定，如下所示：


    ```

    // importing the functions sum and multiply

    import { sum, multiply } from "./ moduleFile.js";

    console.log(sum(1, 7));                // 8

    console.log(multiply(2, 3));           // 6

    ```


    这里，有两个绑定从`moduleFile`模块导入：`sum and multiply`可以像本地定义的标识符一样使用。但让我们考虑一种情况，即你想要导入模块中所有可用的导出，而无需显式地按名称声明它们。这可以通过使用通配符`*`并将导入的标识符作为对象的属性来实现。


    ```

    // import everything

    import * as example from "./ moduleFile.js";

    console.log(example.sum(1,7));          // 8

    console.log(example.multiply(2, 3));    // 6

    ```


    在这段代码中，`moduleFile`中所有导出的绑定都被加载到一个名为`example`的对象中。'
  raw: 'When TC39 decided to implement the module spec in ES6, rather than using one
    of these two, they came up with a new approach for implementing it. Their goal
    was to cater to both users of CommonJS and AMD. This new approach built upon both
    of them and tried to solve many of the problems commonly faced by developers in
    these implementations.


    The ES6 modules provide features from both AMD and CommonJS. They use a compact
    syntax and a static module structure that aids in code optimization, static checking,
    and eliminating dead code. It also comes with support for cyclic dependencies
    like in the case of CommonJS and has support for asynchronous loading and configurable
    module loading like in AMD.


    Ending the fragmentation between CommonJS and AMD and having a single native standard
    for modules brings with it additional advantages such as doing away with the UMD
    (Universal Module Definition) pattern traditionally used to enable the same file
    to be used with different systems.


    ## The Module Pattern in Traditional JavaScript


    To help us better understand Modules before getting into ES6 modules, we will
    implement the module pattern in traditional JavaScript. Put simply, a module is
    a function with inner variables and functions, which can then be exposed to an
    outside environment by returning a “public API ,” which gives access to the data
    inside the function via methods that have closures over the data. To illustrate
    this, let us write a function using the module pattern:


    ```

    function Message(text) {

    function printMessage() {

    console.log("This is the message: " + text + "!");

    }

    return {

    printMessage: printMessage

    };

    }

    var printer = Message("test");

    printer.printMessage();          // This is the message: test!

    ```


    Here in this example, the variable `printer` is assigned a function `Message`
    with an argument "`test.`" `Message` is the function implementing the module pattern,
    which gives a `printer` a public API with access to its inner function `printMessage`
    as a method that prints out the `text` parameter.


    ## Modules in ES6


    Modules in ES6 make it easier to compartmentalize and separate code into smaller
    stand-alone snippets that can then be reused and injected into other places as
    and when they are required, making the process of testing your code easier as
    the modules are decoupled from the primary code. Modules are also useful in loading
    scripts asynchronously, improving load times of apps. But module systems are not
    exactly new to JavaScript.


    Modules are simply JavaScript files that are loaded into JavaScript code from
    other files. But it is important to understand how this differs from the way scripts
    are loaded. If we consider the semantics of a JavaScript module in comparison
    to traditional script loading, a few key differences become apparent. First, modules
    always run in strict mode unlike traditional scripts where it can be changed.
    If you look at the top-level scope of the module, the value of `this` is `undefined`
    and the variables created at the top level are not present in the shared global
    scope. Anything and everything that you need from inside the module has to be
    explicitly exported for us to be able to use them outside the module. Let us now
    take a look at the core value of a module by understanding the ability to import
    and export binding.


    ## Exporting


    The ‘export’ keyword can be used to expose parts of code inside modules to other
    modules. You can export a variable, a function, or a class declaration from a
    module. Variables, Functions, or Classes not exported from a module are not accessible
    outside the module. Let us look at a few examples:


    ```

    export var text = "ES6 is awesome";

    export let name = "Ian Murawski";

    export const number = 7;

    ```


    Here in this example, you are exporting `text`, `name`, and `number`, all declared
    using different variable declaration keywords. You can also export a function
    or a Class from the module. Consider the following examples:


    ```

    export function add(a, b) {

    return a + b;

    }

    export class Rectangle {

    constructor(length, width) {

    this.length = length;

    this.width = width;

    }

    }

    ```


    In this code snippet we are exporting the function `add` and Class `Rectangle`.
    You can also export an existing function that is private to the module as well.


    ```

    function multiply(a, b) {

    return a * b;

    }

    export { multiply };

    ```


    From this example, we can see that not just a function declaration – but also
    a reference to a private function of the module – can be exported.


    At this point it is important to understand that only functions or class declarations
    with names can be exported in this way, and all such exports are referred to as
    Named Exports. You cannot export anonymous functions or classes from a module
    unless they are marked as `default` Exports specified using the `default` keyword.
    You can have multiple named exports in a module but only one default export. It
    is possible to use both at the same time, but usually it is good practice to keep
    them separate.


    ### Default Exports


    In Node.js, it is a common practice to have modules that export only single values.
    Even in front-end JS where we use classes for models and components, one class
    per module is a common practice. An ES6 module is built to pick a default export
    that will be the main exported value.


    A single variable, function, or class can be specified as the default export of
    the module using the `default` keyword. You can have only one value as a default
    export inside a module. Using the keyword on more than one export inside the module
    will raise an error. Default exports help in reducing the syntax for importing
    exports from a module.


    ```

    export default function(a, b) {

    return a * b;

    }

    ```


    In this example, the function is exported from the module as its default. You
    can notice how the function does not require a name as it is the default, and
    the module itself represents the function, allowing you to omit the name for the
    function. You can also assign it a name and export the function name using default.
    Consider the following example:


    ```

    function multiply(a, b) {

    return a * b;

    }

    export default multiply;

    ```


    ## Importing


    Once a module with the relevant exports is set up, it can be accessed inside another
    module by using the import keyword. There are two parts to an import statement:
    the identifier you’re importing and the module from which those identifiers should
    be imported. This is the statement in its basic form:


    ```

    import { identifier1, identifier2 } from "./moduleFile.js";

    ```


    In the above statement `identifier1` and `identifier2` are the bindings imported
    from moduleFile.js.


    The module is specified using a string representing the path to the file containing
    the module after the from keyword. Notice that the list of bindings looks like
    a destructured object but remember that it is not. Also the bindings are like
    variables defined using `const`, that is, you cannot define any other variables
    using the same name or import another module with the same name.


    Using the above syntax, you can import specific bindings from a module as follows,


    ```

    // importing the functions sum and multiply

    import { sum, multiply } from "./ moduleFile.js";

    console.log(sum(1, 7));                // 8

    console.log(multiply(2, 3));           // 6

    ```


    Here, there are two bindings imported from the moduleFile module: `sum and multiply`
    can be used just like locally defined identifiers. But let us consider the case
    where you want to import all the exports available in the module without having
    to explicitly declare them by name. This can be done using the wildcard * and
    importing the identifiers as properties of an object.


    ```

    // import everything

    import * as example from "./ moduleFile.js";

    console.log(example.sum(1,7));          // 8

    console.log(example.multiply(2, 3));    // 6

    ```


    In this code, all exported bindings in moduleFile are loaded into an object called
    `example`.'
