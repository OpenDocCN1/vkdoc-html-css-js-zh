- fmt: '请注意，在钳位数组（clamped arrays）的情况下，所有超出范围的值都会被设置为范围内最近的值，即第一个或最后一个元素。`Uint8ClampedArray`类型化数组表示一个8位无符号整数的数组，值被钳位在0-255之间，这意味着如果你指定一个超出`[0,255]`范围的值，则会设置0或255。如果你指定一个非整数，则会设置最近的整数。


    ### 类型化数组与普通数组


    类型化数组和普通数组在某些方面相似：它们都有`length`属性，并且在两种情况下，都可以使用`[]`运算符访问数组中的元素。类型化数组也支持所有标准数组方法。但它们在多方面存在差异。


    JavaScript中的类型化数组类似于C、C++等其他编程语言中的数组，其中数组的所有元素类型相同，这与JavaScript中的数组不同，后者元素可以是任何类型。类型化数组对所有元素都有严格的类型要求。


    类型化数组不能有空元素。它们总是用0值进行初始化，而普通数组中的值可以是空的（`undefined`）。请查看以下代码片段：


    ```

    const buffer = new ArrayBuffer(16);

    const float32View = new Float32Array(buffer);

    let arr = new Array(10);

    console.log(float32View); // Float32Array [0, 0, 0, 0]

    console.log(arr); // [,,,,,,,,,]

    ```


    类型化数组受到多种浏览器API的支持：`File API`、`XMLHttpRequest`、`Fetch API`、`Canvas`、`WebSockets`、`WebGL`、`Web
    Audio API`、`Media elements`等。目前，类型化数组的某些功能可能并非所有浏览器和JavaScript引擎都支持，因此你可以在`https://kangax.github.io/compat-table/es6/#typed_arrays`检查目标JavaScript引擎的可用性。


    ## Map 和 WeakMap


    ES6引入了一组新的数据结构，称为`Map`和`WeakMap`，它们本质上是一个哈希表或字典，类似于Python或C#中的概念。ES6 Maps提供了一个简单的API，用于通过任意键存储对象，这是许多JavaScript程序中必不可少的核心功能。我们将在本节中详细介绍它们。


    ### Map


    实际上，我们一直在JavaScript中使用Map。事实上，每个对象都可以被视为一个`Map`。对象由键（始终是字符串）和值组成，而在`Map`中，任何值（包括对象和原始值）都可以用作键或值。


    在`Map`中，键可以是任何类型：`string`、`Boolean`、`number`、`object`或`function`。请看这段代码：


    ```

    let myMap = new Map();

    const keyString = "a string",

    keyObj = {},

    keyFunc = () => {};

    // 设置值

