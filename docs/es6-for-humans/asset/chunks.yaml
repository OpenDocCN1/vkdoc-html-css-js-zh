    ```

    let myObj = {

    name: ''fancy'',

    operation: function() {

    console.log(this);

    }

    }

    myObj.operation(); // { name: ''fancy'', operation: [Function: operation]}

    ```


    方法调用，即调用 `myObj.operation()` 时，控制台会打印出 `[myObj object]`。


    现在，让我们尝试以下代码：


    ```

    let x = myObj.operation;

    x(); // Window

    ```


    此处，`x` 引用了 `[myObj object]` 中的 `operation()` 方法。调用 `x()` 意味着我们进行的是函数调用而非方法调用，因此，`this`
    将指向 `Global`（或 `Window`）对象。


    如果我们想使用 `[myObj object]` 来调用 `x`（进行方法调用），就必须使用 `.call()` 方法：


    ```

    let x = myObj.operation;

    x(); // Window

    x.call(myObj); // { name: ''fancy'', operation: [function]}

    ```


    ### 3\. 构造函数调用


    构造函数调用发生在使用 `new` 关键字创建对象时。请考虑以下示例：


    ```

    function Employee(name, department, salary) {

    this.name = name;

    this.department = department;

    this.salary = salary;

    console.log("Welcome " + this.name + "!");

    }

    let john = new Employee(''John'', ''Sales'', 4000);

    // Welcome John!

    ```


    `new Employee(''John'', ''Sales'', 4000)` 是对 `Employee` 函数的构造函数调用。执行结果是一个新对象，并且
    `this` 指向这个新创建的对象。


    构造函数 `Employee()` 可以用 ES6 中的 class 来编写，我们将在本书后面讨论。


    ### 箭头函数中的 `this`


    让我们看看 `this` 在箭头函数内部是如何工作的。箭头函数旨在词法上绑定上下文，这意味着 `this` 指向定义箭头函数时的封闭上下文。与普通函数不同，箭头函数不会创建自己的执行上下文，而是从定义它的外部函数中获取
    `this`。请考虑以下代码：


    ```

    function Employee(firstName, department, salary) {

    this.firstName = firstName;

    this.department = department;

    this.salary = salary;

    this.getInfo = function() {

    // 外部函数上下文 = Employee 对象

    return function () {

    // 内部函数上下文 = Global 对象

    console.log(this.firstName + " from " +

    this.department + " earns " + this.salary);

    };

    }

    }

    let jim = new Employee(''Jim'', ''Finance'', 5200);

    ```


    在上面的示例中，我们创建了一个名为 `Employee` 的构造函数，并使用该构造函数和 `new` 关键字创建了一个名为 `jim` 的新员工对象。为了打印员工信息，我们需要使用
    `jim.getInfo()` 返回的函数。请查看以下代码片段：


    ```

    let printInfo = jim.getInfo();

    printInfo();  // undefined from undefined earns undefined

    ```


    这里，`printInfo` 指向内部函数。由于我们只是进行函数调用，`this` 指向 `Global` 对象，该对象没有任何 `Employee` 属性，因此每当使用
    `this` 上的属性时都会产生 `undefined`。


    让我们看看如果用箭头函数替换内部函数，`this` 的行为会有什么不同：


    ```

    function Employee(firstName, department, salary) {

    this.firstName = firstName;

    this.department = department;

    this.salary = salary;

    this.getInfo = function() {

    // 外部函数上下文 = Employee 对象

    return () => {

    // 内部函数上下文 = 包围它的上下文 = Employee 对象

    console.log(this.firstName + " from " +

    this.department + " earns " + this.salary);

    };

    }

    }

    let jim = new Employee(''Jim'', ''Finance'', 5200);

    let printInfo = jim.getInfo();

    printInfo();  // Jim from Finance earns 5200

    ```


    在这种情况下，`this` 关键字指向的是包围箭头函数的函数的上下文，而不是之前指向 `Global` 对象的情况。这里需要注意的是，箭头函数不会在调用时改变它们的上下文。请考虑以下示例：


    ```

    function Employee() {

    this.firstName = ''Mike'',

    this.department = ''HR'',

    this.salary = 4500,

    this.getContext = () => {

    console.log(this);

    }

    }

    let mark = new Employee();

    mark.getContext(); // [Employee object]

    let context = mark.getContext;

    context(); // [Employee object] (无论是否是函数调用)

    ```


    在上面的示例中，箭头函数的上下文在声明时就被设置，并且无法更改。这里需要注意的是，你无法“重新绑定”一个箭头函数。上下文始终是固定的。请查看以下代码片段以获取示例：


    ```

    var details = {

    number: 42,

    operation: function () {

    return () => console.log(this.number);

    }

    };

    var details2 = {

    number: 84

    };

    details.operation().bind(details2)(); // 42

    ```


    在上面的示例中，我们将 `details2` 的 number 设置为 84。但知道我们无法将新对象绑定到箭头函数。引擎不会抛出任何错误，它只是完全忽略了
    `bind`。因此，即使我们用 `details2` 对象调用 `operation` 方法，也会打印出 42。这也适用于 `call` 和 `apply`。因此，对于箭头函数，调用
    `bind`、`call` 或 `apply` 将无法改变 `this` 的值。


    从这个例子中可以清楚地看出，函数内部 `this` 关键字的值是无法更改的。函数内部 `this` 的值将保持不变，但你仍然可以在箭头函数上使用 `bind`、`call`
    和 `apply`。


    ```

    var product = (x, y) => x * y;

    console.log(product.call(null, 2, 3));           // 6

    console.log(product.apply(null, [2, 3]));        // 6

    var multiply = product.bind(null, 2, 3);

    console.log(multiply ());                        // 6

    ```


    除了词法上的 `this`，箭头函数还具有词法上的 `arguments`。它们没有自己的 `arguments` 数组，而是从父级继承。箭头函数没有 `this`、`super`、`arguments`
    和 `new.target` 绑定，因此函数内部的 `this`、`super`、`arguments` 和 `new.target` 的值是最近的包含非箭头函数里的相应值。


    **注意**


    通常情况下，在 JavaScript 中，代码之间的额外换行符没有任何意义，代码仍然可以正常工作，但对于箭头函数来说，这是一个问题。我们不能将箭头符号放在新行上。ES6
    禁止在箭头函数的参数定义和箭头之间出现换行。


    箭头函数的另一个重要方面是，它们不能与 `new` 一起调用，因为它们没有构造方法，也不能用作构造函数。当与 `new` 一起使用时，它们会产生错误。请查看下面的示例：


    ```

    var newFn = () => {},

    object = new newFn();  // 错误 - 你不能对箭头函数使用 ''new''

    ```


    通常，在 ES5 中声明函数时，它有一个用于构造函数的 `prototype` 属性。但由于你不能对箭头函数使用 `new`，因此也就不需要 `prototype`。因此，使用箭头函数声明的函数无法访问
    `prototype` 字段。


    ```

    var details = () => 42;

    console.log(details.hasOwnProperty("prototype")); // false

    ```


    与严格模式下不允许重复命名参数的非箭头函数类似，箭头函数无论在严格模式还是非严格模式下都不能有重复的命名参数。

