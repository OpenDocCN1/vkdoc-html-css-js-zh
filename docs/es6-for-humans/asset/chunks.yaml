    循环，这种循环在遍历集合中的项目时需要额外跟踪当前索引位置。让我们看看如何利用迭代器和生成器在我们的应用程序中高效地处理数据。


    ## 可迭代对象和迭代器


    在最新发布的 ECMAScript 标准中，我们投入了大量精力来改进代码的组织方式。ES6 引入了一套全新的遍历机制，使得实现可迭代对象和迭代器变得非常简单和容易。这一版本的
    JavaScript 引入了一组称为迭代器协议和可迭代对象协议的协议，任何 JavaScript 对象都应实现这些协议才能成为迭代器或可迭代对象。在继续讨论这些协议之前，让我们先了解一下
    JavaScript 中的可迭代对象和迭代器：


    简而言之，迭代器模式是一种结构化的模式，用于按特定顺序逐个从元素集合中获取信息。它是一个具有特定接口、专为迭代设计的对象。这种模式一直存在，并通过自定义对象在
    JavaScript 中使用，但通过 ES6，我们迎来了迭代器模式的隐性标准化。JavaScript 中的许多现有数据结构现在都公开了迭代器，你也可以使用相同的标准构建自己的迭代器，从而获得最大的互操作性。


    可迭代对象是一系列可以迭代的元素的简单表示。它没有任何迭代状态，例如“当前元素”。相反，它有一个生成迭代器的方法。


    迭代器是带有迭代状态的对象。所有迭代器对象都有一个 `next()` 方法，用于返回集合中的下一个对象。`next()` 方法返回的对象具有两个属性，即：


    (i) `value`，表示集合中的下一个值；

    (ii) `done`，是一个布尔值，用于指示序列是否结束。也就是说，只要序列中还有值要返回，它就是 `false`；只有当集合中的值已全部返回时，它才返回
    `true`。


    每次调用 `next()` 方法都会生成集合中的下一个值。遍历完集合的所有值后，再次调用 `next()` 方法将返回 `value` 为 `undefined`
    且 `done` 为 `true`。


    综上所述，让我们看看如何在 ES6 中手动实现一个迭代器：


    ```

    function myIterator(data) {

    let currentIndex = 0;

    return {

    next: () => {

    const done = (currentIndex >= data.length);

    const value = !done ? data[currentIndex] : undefined;

    currentIndex += 1;

    return {

    done,

    value

    };

    }

    };

    }

    const itrObj = myIterator([41, 42, 43]);

    itrObj.next();  // { value: 41, done: false }

    itrObj.next();  // { value: 42, done: false }

    itrObj.next();  // { value: 43, done: false }

    itrObj.next();  // { value: undefined, done: true }

    // 此后所有调用

    console.log(itrObj.next());    // { value: undefined, done: true }

    ```


    在上述代码片段中，`myIterator()` 函数返回一个含有 `next()` 方法的对象，每次调用该方法都会返回集合中的下一个值。在最后一个元素之后，返回对象的
    `done` 值变为 `true`，且返回的 `value` 始终为 `undefined`。

