    \ notice how we modified the structure of the `cake` object using `Object.defineProperty()`.\
    \ Self-modification deals with the ability to access or create new properties\
    \ and modify the structure of a program in runtime.\n\n- **Intercession** – when\
    \ your code modifies the default behavior, resulting in affecting the rest of\
    \ the code. Intercession deals with modification of semantics of the language,\
    \ or adding new constructs to your program at runtime. This is new to ES6 and\
    \ we will learn more about it later in this chapter.\n\nES6 introduces meta programming\
    \ using three new APIs: `Symbol`, `Proxy`, and `Reflect`. Previously in this book,\
    \ we have seen how symbols allow us to create unique and immutable identifiers.\
    \ They offer us a way to efficiently create unique and non-enumerable properties\
    \ for an object, which can be good for separating the metadata of the object from\
    \ its public interface. Symbols also help us customize the default iteration behavior\
    \ of an object, essentially offering Reflection (self-modification) by enabling\
    \ us to modify the behavior of a program or create new (and unique) properties\
    \ on an object in runtime. Now let’s take a look at what `Proxy` and `Reflect`\
    \ bring to the table.\n\n## Proxies in ES6\n\nProxies represent intercession forms\
    \ of meta programming. Proxy objects allow us to intercept any program’s behavior.\
    \ They enable us to modify the operations of an object and implement custom behaviors.\
    \ In simpler words, there are many operations that can be performed on an object,\
    \ and proxies help us to modify such operations and implement desired behaviors.\
    \ These operations can be property lookup, assignment, enumeration, function invocation,\
    \ etc.\n\nA proxy object wraps the target object and modifies its behavior. We\
    \ can create a proxy using:\n\n```javascript\nconst proxy = new Proxy(target,\
    \ handler);\n```\n\nwhere `target` is the object whose behaviors are being modified\
    \ and `handler` is an object whose properties are functions (referred as traps),\
    \ which are called when various operations are performed against the proxy. Handler\
    \ objects allow us to define the new behavior of the target object. It enables\
    \ us to perform extra logic in addition to forwarding the operations onto the\
    \ target/wrapped object.\n\n## Traps in Proxy Handler\n\nA handler object offers\
    \ a list of methods that serve as traps for a proxy. These methods are optional\
    \ and if a trap has not been defined, the default behavior is to forward the operation\
    \ to the target.\n\nMost common traps are for getters and setters. Take a look\
    \ at the following code snippet, for example, where we have defined a trap for\
    \ the get property accessor method:\n\n```javascript\nconst restaurant = {\n \
    \ soda: 2,\n  burger: 1\n};\nconst restHandler = {\n  get: function(target, property)\
    \ {\n    if (property in target && target[property] > 0) {\n      target[property]\
    \ -= 1;\n      return `Enjoy your ${property}`;\n    }\n    return `Sorry, We\
    \ are out of ${property}s!`;\n  }\n};\nconst restProxy = new Proxy(restaurant,\
    \ restHandler);\nconsole.log(restProxy.soda);\n// Enjoy your soda\nconsole.log(restProxy.soda);\n\
    // Enjoy your soda\nconsole.log(restProxy.soda);\n// Sorry, We are out of sodas!\n\
    console.log(restProxy.burger);\n// Enjoy your burger\nconsole.log(restProxy.burger);\n\
    // Sorry, We are out of burgers!\n```\n\nIn the above example, we have a `restaurant`\
