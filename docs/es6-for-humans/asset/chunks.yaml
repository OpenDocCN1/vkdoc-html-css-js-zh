    # 原子操作与共享内存


    任何熟悉 `WebWorker` 的人都已经了解创建工作进程的过程。通过分配 `Worker` 对象并将需要运行的脚本传入其中来创建它们。工作进程通过消息通道进行通信，多种类型的数据都可以通过此通道发送，并且当数据到达目的地时，其类型和结构会保持不变。在
    ES2017 中，要分配共享内存，你可以直接使用 `SharedArrayBuffer` 构造函数。它就像一个普通的 `ArrayBuffer`，但其内存是共享的。


    此外，ES2017 中的这个新规范还为我们带来了新的底层 `Atomics` 命名空间对象的概念，它与 `SharedArrayBuffer` 构造函数一起，为我们提供了用于构建更高级别并发抽象的基本构建块。你可以使用这些特性在多个
    Web Worker 和主线程之间共享 `SharedArrayBuffer` 对象中的数据。这使你能受益于轻松地在 Worker 之间共享数据，从而更好地协调它们之间工作。关于此主题的更详细教程和规范（由共享内存和
    `Atomics` 的原始提案作者 Lars Hansen 编写）可以在以下链接中找到：[`https://github.com/tc39/ecmascript_sharedmem/blob/master/TUTORIAL.md`](https://github.com/tc39/ecmascript_sharedmem/blob/master/TUTORIAL.md)，但这超出了本书的范围。


    # Object.entries() 和 Object.values()


    `Object.entries()` 和 `Object.values()` 是 ES2017 中引入的两个新方法。`Object.entries()` 方法在对象上运行时，会以
    `for-in` 循环提供的相同顺序返回该对象自身的可枚举属性 `[key, value]` 对。但与 `for-in` 循环不同，它不会枚举原型链上的属性。类似地，`Object.values()`
    在传入对象时，会返回一个包含其自身可枚举属性值的数组：


    ```javascript

    const myObj = { a: 1, b: 42 };

    Object.entries(myObj);     // [[''a'', 1], [''b'', 42]]

    Object.values(myObj);      // [1, 42]

    ```


    正如你在上面的示例中所看到的，当传入 `Object.entries()` 方法时，该对象会返回一个包含其键/值对的数组，而 `Object.values()`
    方法则返回属性值。


    # padStart 和 padEnd


    `padStart()` 和 `padEnd()` 方法是 ES2017 中引入的两个新的字符串方法，它们有助于向字符串添加填充，以便结果字符串的长度等于作为第一个参数传入的值。你还可以传入第二个可选参数（另一个字符串）来代替默认的空格进行填充。思考以下示例：


    ```javascript

    ''string''.padStart(10);           // "    string"

    ''string''.padStart(10, "abc");    // "abcastring"

    ''string''.padStart(10,"123465");  // "1234string"

    ''string''.padStart(8, "0");       // "00string"

    ''string''.padStart(3);            // "string"

    ''string''.padEnd(10);             // "string    "

    ''string''.padEnd(10, "abc");      // "stringabca"

    ''string''.padEnd(8, "123456");    // "string12"

    ''string''.padEnd(1);              // "string"

    ```


    正如你在上面的示例中所看到的，添加到给定字符串的填充使得最终结果字符串的长度要么大于第一个参数的长度，具体取决于原始字符串的长度；如果给定的长度更大，则会根据你使用的方法在字符串的开头或结尾添加适当数量的填充。你也可以使用第二个参数来使用不同的字符串代替空格进行填充。


    # Object.getOwnPropertyDescriptors()


    顾名思义，`Object.getOwnPropertyDescriptors()` 是 ES2017 中的一个新方法，它允许你精确检查给定对象所有自身属性的描述。JavaScript
    对象中的属性通常由一个字符串名称和一个属性描述符组成。描述符是属性值、布尔值 `writable`、`get` 函数、`set` 函数、布尔值 `configurable`
    和布尔值 `enumerable` 的记录。思考以下示例：


    ```javascript

    const myObj = {

    [Symbol(''mySymbol'')]: 42,

    get random() { return ''test'' },

    };

    console.log(Object.getOwnPropertyDescriptors(myObj));

    // Object {random: Object, Symbol(mySymbol): Object}

    // {random:{

    //     configurable: true,

    //     enumerable: true,

    //     get: function random(),

    //     set: undefined}

    //[Symbol(''mySymbol'')]:{

    //     configurable: true,

    //     enumerable: true,

    //     value: 42,

    //     writable: true}

    //}

    ```


    在像 `myObj` 这样的对象上使用 `Object.getOwnPropertyDescriptors()` 的输出将大致如上所示。请注意，上述所有特性都相当新且是实验性的，因此你可能不总是能得到完全相同的结果。话虽如此，它们现在正变得越来越标准化。


    # 函数参数列表与调用中的尾逗号


    ES2017 中的这个特性是一个简单的语法更新。在引入此特性之前，即使规范的其他部分（如数组和对象字面量的情况）中已普遍允许，但在 JavaScript 中是不允许在最后一个函数参数后面有逗号的。通过
    ES2017 的这一更新，你在整个 JavaScript 中拥有了更统一的尾逗号语法。所以你可以这样做：


    ```javascript

    const trailFunct = function(x, y, z,) {

    // 函数体

    }

    ```


    这纯粹是语言的一个语法更新，对该语言的行为或功能没有重大改变。

    '
