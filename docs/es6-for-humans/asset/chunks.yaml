  trans: '

    ## 摘要


    JavaScript 是当今 Web 上最强大的语言之一，并且其能力还在不断增强。`ES6`（官方名称为`ES2015`）及其后续版本为 JavaScript
    带来了全新的范式。正如我们将在后续章节中看到的，对于传统 JavaScript 开发者而言，存在大量新内容。但对于现有 JavaScript 开发者来说，了解这些新特性至关重要，以便在越来越多特性成为浏览器和框架世界主流时保持领先。


    JavaScript 的发展速度比以往任何时候都快，而转译器与填补/垫片（shims/polyfills）是助你始终站在语言发展前沿的重要工具。`ECMAScript
    6` 为该语言带来了非常广泛的新增功能，其中每个特性都经过社区的仔细考量、深入讨论并被选定为标准的一部分。现在，我们开发者有责任使用并应用这一新标准到我们的产品中，以更好地服务用户。


    你可能会问自己，这些改变是否值得。将`ES6`集成到你的项目和工作是否必要？你真的需要改变现有的做事方式吗？我们想说的是：“是的，这是值得的”，并且通过本书，我们希望能鼓励你适应这个新世界。即使你在告别旧方式时遇到一些阻力，我们建议你坚持下去并改变你的实践。


    JavaScript 社区充满活力且动态十足，一切都在快速变化。现在，`ES6/ES2015` 知识已成为 JavaScript 开发者的必备技能。新的语言结构不仅变得流行，而且得到了广泛支持。掌握`ES6`的内部机制将让你能够构建现代应用程序，获得更强大的语言能力，并帮助你提升编程技能。


    通过`ES6`，你将能够使用更强大的编程概念，例如实用的面向对象代码以及其他一些在过去根本无法实现的新特性。我们希望向你介绍现代化的工作流程和工具（如`Babel`和`Webpack`），使应用程序开发更快、更愉快。你将能够衡量代码质量，并编写更易于测试的
    JavaScript。


    # ES6 中的新语法


    `ECMAScript 6` 引入的新特性代表了未来 JavaScript 应用程序构建的基础。在本章中，我们将探讨`ES6`语法的变化和新增内容，这些内容有助于修复之前
    JavaScript 版本中存在的许多问题。我们将详细讨论声明变量和定义作用域的新方式。我们还将介绍新概念，如箭头函数、默认函数参数、展开与剩余运算符以及对象字面量扩展。


    ## 变量声明：let、const 与块级作用域


    过去，JavaScript 中的所有变量都使用关键字`var`声明。这些变量是函数作用域的，意味着它们的作用域受限于包含它们的函数，这对于来自其他语言的开发者来说有时会造成混淆。因此，如果需要创建一个具有自身作用域的新块，你必须将所需代码包裹在一个常规函数或立即调用函数表达式中。


    以下是常规函数级作用域的示例：


    ```

    var price = 10; // 全局声明

    function showPrice() {

    var price = 12; // 使用 var 的局部声明

    console.log(price); // 12

    }

    showPrice();

    console.log(price); // 10

    ```


    以下是使用 IIFE 的函数级作用域示例：


    ```

    var price = 10; // 全局声明

    (function () {

    var price = 12; // 使用 var 的局部声明

    console.log(price); // 12

    })();

    console.log(price); // 10

    ```


    上述代码表明，变量 `price` 现在的作用域限定在包含它的函数内，并且变更不会泄露到父作用域（在本例中为全局作用域）。新值 `price = 12` 仅在包含它的函数作用域内可用。


    如果我们用块作用域（‘if’块）替换函数作用域，代码如下：


    ```

    var price = 10;

    if (price) {

    price = 12;

    console.log(price); // 12

    }

    console.log(price); // 12

    ```


    上述代码清楚地表明，‘if’块内部的变更泄露到了父作用域，这告诉我们`var`声明绑定的是函数作用域，并不会创建块级作用域。


    在`ES6`之前，JavaScript 使用函数作用域，但在大多数编程语言中，块级作用域比函数作用域更常见。随着`ES6`的到来，我们现在有了两种额外的变量声明方式：`let`和`const`，它们声明的变量都是块级作用域的。

