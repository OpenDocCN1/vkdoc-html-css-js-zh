- fmt: "# ES6 Modules\n\nES6 `import` statements only produce read-only bindings to\
    \ the corresponding variables, functions, or classes. Therefore, the module that\
    \ imports them cannot change its value. But the module that exports an identifier\
    \ can make changes to it. For example:\n\n```javascript\n// moduleFile.js starts\
    \ here\nexport var message = \"Message from moduleFile\";\nexport function setMessage(newText)\
    \ {\n    message = newText;\n}\n// moduleFile.js ends here\n\n// file.js\nimport\
    \ { message, setMessage } from \"./moduleFile.js\"\nconsole.log(message);    \
    \      // \"Message from moduleFile\"\nsetMessage(\"New Message\");\nconsole.log(message);\
    \          // \"New Message\"\nmessage = \"This is another message\";      //\
    \ error\n```\n\nIn the above example, we import two bindings from the module,\
    \ `message` and `setMessage`. The function `setMessage()` can change the value\
    \ of the variable `message` but when you try to directly change the value it throws\
    \ an error.\n\n## Destructing an Import Statement and Using Variables\n\nEven\
    \ though the import statement looks like destructuring, it is not. Hence, the\
    \ following code is invalid and will throw an error:\n\n```javascript\nimport\
    \ { toto: { tata } } from 'someModule'; // error\n```\n\nYou have to also keep\
    \ in mind that an import statement should not depend on anything that needs to\
    \ be computed during runtime. Therefore, something like the following example\
    \ will also throw an error:\n\n```javascript\nimport toto from \"someModule\"\
    \ + tata; // error\n```\n\nHence, try and make sure not to use any such complicated\
    \ mechanisms while importing from a module.\n\n## Using `eval()`\n\nYou cannot\
    \ use `eval()` on modules since they are a high-level construct for it. `eval()`\
    \ usually accepts scripts that do not allow `import` or `export`.\n\n## Module\
    \ Specifier\n\nIn all of the examples above, we used a relative path in the module\
    \ specifier like `\"./moduleFile.js\"`. When browsers try to run this code, they\
    \ understand them in the following manner:\n\n- `/` resolves to the root directory\n\
    - `./` resolves to the current directory\n- `./` resolves to the parent directory\n\
    \n## Summary\n\nModules in ES6 provide new ways to extend the functionality of\
    \ JavaScript. They help in better organizing code and maintaining a more modular\
    \ semantic code base. ES6 introduces new keywords like `import`, `export`, and\
    \ `default` to make the use of modules possible. You no longer need to use UMD\
    \ or additional modules systems like CommonJS or AMD as ES6 brings in the best\
    \ of both worlds.\n\nUsing modules you can write reusable and better packaged\
    \ code. Modules do not modify the global scope, unlike scripts, giving you a lesser\
    \ chance for error. You have to specifically export all the values out of the\
    \ module if you want to use them elsewhere.\n\n# Symbols in ES6\n\nSince way back\
    \ in 1996, around the time when JavaScript was first standardized and ECMA attempted\
    \ to carve out a standard specification, there have been five primitive data types\
    \ in JavaScript: Boolean, Number, String, Undefined, and Null where each type\
    \ represents a value. But now ES6 introduces a brand new primitive data type -\
    \ Symbol. In this chapter, we will go over, in detail, this new primitive type\
    \ and its applications.\n\n## Symbols\n\nSymbols represent a unique value and\
    \ at its heart, a symbol is a unique token that is guaranteed to never clash with\
    \ any other Symbol. Symbols in ES6 can be created using a factory function. The\
    \ `Symbol()` method can be used to create a new symbol. Consider the following\
    \ example:\n\n```javascript\nconst foo = Symbol();\nconsole.log(typeof foo); \
    \     // \"symbol\"\n```\n\nEvery time you call the factory function, a new and\
    \ unique symbol is created. The output from the `typeof` on a symbol type is `\"\
    symbol\"`, and this is the primary way to identify symbols.\n\n**Note:** Symbols\
    \ in ES6 do not have a literal form like other primitives.\n\nOptionally, while\
    \ creating a Symbol you can also give it a label by passing a string as an argument\
    \ into the `Symbol()` method:\n\n```javascript\nconst chocolate = Symbol(\"this\
    \ is my chocolate\");\nconsole.log(chocolate);\n// Symbol(this is my chocolate)\n\
    console.log(chocolate.toString());\n// \"Symbol(this is my chocolate)\"\n```\n\
    \nThe label passed in as the argument does not affect the value of the Symbol.\
    \ It has no other consequence except for being a string to describe the symbol\
    \ while printing it. It is also useful when you call `.toString()` method on the\
    \ returned symbol, which converts the symbol into a string. This label is shown\
    \ when you write the symbol to `console.log()`, and possibly in error messages.\
    \ This can be helpful for debugging purposes.\n\nNote that you should not be using\
    \ the `new` keyword for creating symbols. Symbols do not have an object constructor;\
    \ therefore you cannot create a Symbol using the `new` keyword:\n\n```javascript\n\
    const bar = new Symbol();           // Type Error\n```\n\nAs mentioned before,\
    \ a symbol is always unique and two symbols can never be the same. You can, however,\
    \ create multiple symbols with the same label but the returned symbols would always\
    \ be unique. Check the following code snippet for an example:\n\n```javascript\n\
    const kit = Symbol(\"hello\");\nconst kat = Symbol(\"hello\");\nconsole.log(kit\
    \ === kat);       // false\n```\n\nOr you can simply try:\n\n```javascript\nSymbol()\
    \ !== Symbol()         // true\n```\n\nHence, symbols are always unique and can\
    \ be of incredible use in various cases. Let's take a look at their applications\
    \ in the next section.\n\n### Applications of Symbols\n\nSymbols, by their very\
    \ nature, are mainly used as unique property keys because a symbol can never clash\
    \ with any other property (symbol or string) of the object, which can be incredibly\
    \ helpful in cases where you don't want to take chances on overriding native properties\
    \ of an object. Symbols are also commonly used to create anonymous (or private\
    \ in some sense) properties for the internal use of a class or an object type.\
    \ Consider the following example, where we have an object `Person` with some \"\
    public\" properties:\n\n```javascript\nlet Person = {\n    name: \"John\",\n \
    \   age: 14,\n    location: \"New York\"\n}\n```\n\nNow let's suppose we want\
    \ to add a private method to the `Person` object. We can do that using Symbols\
    \ as follows:\n\n```javascript\nlet votingEligibility = Symbol();\nPerson[votingEligibility]\
    \ = function() {\n    return this.age >= 18;\n}\n```\n\nLet's look at the `Person`\
    \ object now, and you can see that an anonymous method has been added to it:\n\
    \n```javascript\nconsole.log(Person);\n// {name: \"John\", age: 14, location:\
    \ \"New York\"}\n// If you are running this in a recent version of Google Chrome,\n\
    // you will see - Symbol(): [Function] property as well\n```\n\nYou can also use\
    \ computed property keys here, which we have already discussed in a previous chapter:\n\
    \n```javascript\nlet Person = {\n    name: \"John\",\n    age: 14,\n    location:\
    \ \"New York\",\n    [Symbol()]: function() {\n        return this.age >= 18;\n\
    \    }\n}\n```\n\nThe Symbol property is non-enumerable and anonymous. Therefore,\
    \ when using the `for...in` loop, symbol properties of the object won't be accessible\
    \ while traversing, and since it is anonymous, it will not be listed in the resultant\
    \ array of `Object.getOwnPropertyNames()` method. However, you can get the Symbol\
    \ property using `Object.getOwnPropertySymbols()`. For example:\n\n```javascript\n\
    Object.getOwnPropertyNames(Person);\n// [\"name\", \"age\", \"location\"]\nObject.getOwnPropertySymbols(Person);\n\
    // [Symbol()]\n```\n\nLet us take a look at how you would use `Object.getOwnPropertySymbols()`\
    \ in the previous example where we created the `Person` object:\n\n```javascript\n\
    let canVote = Object.getOwnPropertySymbols(Person)[0];\nPerson[canVote]();\n//\
    \ false\n```\n\n**Note:** We saw that `Object.getOwnPropertySymbols()` returns\
    \ an array of Property Symbols associated with an object, hence these properties\
    \ are accessible and not private. But using symbols, we definitely have the advantage\
    \ of not discovering these properties casually.\n\nYou can also achieve this by\
    \ using the reference created to bind the property with the `Person` object. Remember\
    \ how we created the symbol using `let votingEligibility = Symbol();`. Therefore:\n\
    \n```javascript\nPerson[votingEligibility]();\n// false\n```"
