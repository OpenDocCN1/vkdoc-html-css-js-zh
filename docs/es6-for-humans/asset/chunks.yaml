- fmt: '### Using Arrow Functions


    Whenever you have a short single-statement inline function expression with a computed
    return value and the function does not make a `this` reference or a self-reference,
    you can replace it with an arrow function.


    If you have functions that use the `var self = this` hack to deal with the `this`
    issue, or a `.bind(this)` call for proper `this` binding, arrow functions were
    built to help out with this exact problem. For example, consider the following
    code snippet where we are waiting for 1 second to toggle `btn-active` class on
    `btn` click.


    ```javascript

    $(''.btn'').on(''click'', function() {

    var self = this;

    setTimeout(function() {

    $(self).toggleClass(''btn-active'');

    }, 1000);

    });

    ```


    Without arrow functions, we would need to store the context in a variable to be
    able to access it inside our `setTimeout` function. This can be simply rewritten
    with arrow functions as this:


    ```javascript

    $(''.btn'').on(''click'', function() {

    setTimeout(() => {

    $(this).toggleClass(''btn-active'');

    }, 1000);

    });

    ```


    Hence, along with shorter and more concise syntax, arrow functions handle the
    `this` keyword a little differently, making it easier to manage the code in many
    situations.


    ### Default Function Parameters


    Unlike the common pattern in other languages, functions in JavaScript are unique
    in that they allow you to call them by passing any number of parameters irrespective
    of the parameters declared in the function definition. This gives the developer
    an opportunity to use any value for the parameters in case no argument is specified.
    In ES5, if the argument is not specified, its value would be set to `undefined`.
    The pattern commonly used to set defaults for unspecified parameters was something
    like this:


    ```javascript

    function getSum(a,b) {

    a = (a !== undefined) ? a : 1;

    b = (b !== undefined) ? b : 41;

    console.log( a + b );

    }

    getSum();            // 42

    getSum(1, 2);        // 3

    getSum(10);          // 51

    getSum(null, 6);     // 6

    ```


    ES6 tries to streamline this process by giving us the ability to set a default
    value to the parameter in the function declaration statement itself.


    ```javascript

    var getSum2 = function(a = 1, b = 41) {

    console.log(a + b);

    }

    getSum2();            // 42

    getSum2(1, 2);        // 3

    getSum2(10);          // 51

    getSum2(null, 6);     // 6

    ```


    When we call the function, if we do not specify any argument, the default value
    of the parameter gets used. The syntax to specify a default value is the parameter
    followed by an equal sign `=` and an expression after that.


    ```javascript

    var getAnswer = function(number = 42, item = "universe") {

    console.log(number + " is the answer to " + item);

    }

    getAnswer(undefined, "life"); // 42 is the answer to life

    ```


    Here, we are passing `undefined` as the first parameter, and ES6 will use the
    default value 42 instead.


    Function default values can be more than just simple values like 42; they can
    be any valid expression, even a function call. You can use complex expressions
    as default values for parameters. Default value expressions are evaluated lazily,
    meaning they''re run only if a parameter''s argument is not present or is `undefined`.


    ```javascript

    var getName = function(firstName = "John", lastName = "Doe") {

    console.log(firstName + " " + lastName);

    }

    getName("Jane"); // Jane Doe

    ```


    You can also access the other variables in the expression used as the default
    value.


    ```javascript

    var defaultName = "John";

    var getName = function(firstName = defaultName, lastName = "Doe") {

    console.log(firstName + " " + lastName);

    }

    getName(); // John Doe

    ```


    You can also access a function when specifying a default for an argument.


    ```javascript

    var getFirstName = () => "John";

    var getName = function(firstName = getFirstName(), lastName = "Doe") {

    console.log(firstName + " " + lastName);

    }

    getName(); // John Doe

    ```


    In the above few examples, if we try to check the number of arguments:


    ```javascript

    var getName = function(firstName, lastName = "Doe") {

    console.log(arguments.length);

    }

    getName("John"); // 1

    ```


    Even though the second argument gets a default value, `arguments.length` only
    returns the number of arguments passed to it.


    Let’s take a look at a little more complicated example:


    ```javascript

    var getPrice = function(quantity = price, price = 5) {

    console.log(quantity + ", " + price);

    }

    getPrice(); // ReferenceError: price is not defined

    ```


    Think of the function declaration and arguments like a scope. The parameters of
    a function declaration are in their own scope between the parentheses `(...)`.
    Do not confuse this with the function body scope. JavaScript has not yet reached
    the `price` declaration when evaluating `quantity`, and hence it does not know
    the value of `price`. The reference to an identifier in a default value expression
    first matches the formal parameters'' scope before looking to an outer scope.


    Like we discussed in the section on `let` declarations, ES6 has a TDZ that does
    not allow the variable to be accessed before it is initialized. Therefore, in
    the above example, a TDZ reference error occurs when you try to use a parameter
    before it is declared.


    Another awesome feature of the default parameters in ES6 is that they work even
    when creating a dynamic function:


    ```javascript

    var getNumber = new Function("number = 42", "return number;");

    console.log(getNumber()); // 42

    ```'
