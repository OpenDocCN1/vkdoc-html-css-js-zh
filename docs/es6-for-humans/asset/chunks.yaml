    \ Promise 可能会被拒绝，但如果使用第一种方式，这个拒绝无法被捕获——导致错误在你的应用中被忽略。而使用第二种方式，无论是来自 `somePromise()`\
    \ 还是 `onResolved()` 的错误，都可以在 `catch()` 方法中得到处理。如果我们有多个 `then()` 调用，错误会一直传递下去，直到遇到错误处理器。因此，建议在所有\
    \ Promise 链的末尾都加上一个 `catch()` 方法。\n\n## 使用 `Promise.all` 组合 Promise\n\n`Promise.all`\
    \ 接收一个 Promise 数组（或任何可迭代对象），并返回一个 Promise。当可迭代参数中的所有 Promise 都 resolve 时，该返回的\
    \ Promise 会 resolve；如果任何一个 Promise 拒绝，它就会以第一个拒绝的 Promise 的原因 reject。\n\n如果传入的任意一个\
    \ Promise 被拒绝，那么所有 Promise 会立即以该拒绝的 Promise 的值 reject，并丢弃所有其他 Promise，无论它们是否已\
    \ resolve。注意，如果传入一个空数组，该方法会立即 resolve。\n\n```\nconst p1 = Promise.resolve(3);\n\
    const p2 = 42;\nconst p3 = new Promise((resolve, reject) => {\n  setTimeout(resolve,\
    \ 100, \"foo\");\n});\nPromise.all([p1, p2, p3]).then(values => {\n  console.log(values);\
    \ // [3, 42, \"foo\"]\n});\n```\n\n然而，在某些情况下，你可能不想等待数组中的所有 Promise 都 resolve，而只是想获取数组中第一个完成的\
    \ Promise 的结果。在这种情况下，可以使用 `Promise.race()`。\n\n`Promise.race()` 也接收一个 Promise\
    \ 数组，但与 `Promise.all()` 不同，它会在数组中第一个 Promise 完成时立即兑现其返回的 Promise。例如，假设我们想从 API\
    \ 端点获取一些 JSON 数据，但不想无限等待响应。在这种情况下，我们只想使用一个默认值。我们可以使用 `Promise.race()` 来实现这一点：\n\
    \n```\n// 一个在给定时间（t）后超时的 Promise\nfunction delay(t) {\n  return new Promise((resolve,\
    \ reject) => {\n    setTimeout(resolve, t);\n  });\n}\n// 哪个 Promise 先完成，其结果就会被传递到我们的处理器中\n\
    Promise.race([\n    fetchData(),\n    delay(5000).then(() => { data: \"test\"\
    \ })\n  ])\n  .then((res) => {\n    // 如果 fetchData() 耗时超过 5 秒，这里将是 \"test\"\n\
    \    console.log(\"data:\", res.data);\n  })\n  .catch(function(err) {\n    console.log(\"\
    error:\", err);\n  });\n```\n\n在这个例子中，`delay()` 函数返回一个在 `t` 毫秒后 resolve 的新 Promise。然后我们为该返回的\
    \ Promise 附加一个处理器，返回默认的用户对象 `{user: \"guest\"}`。这确保了如果在 5 秒内从服务器获取到用户数据，我们将获得用户详情；否则将使用一个访客用户。\n\
    \n## 总结\n\nPromise 已成为处理大量异步操作的标准方法。在本章中，我们学习了如何正确使用 Promise 来编写易于阅读的代码，这使得它们比传统回调函数更容易调试。它们允许我们组合异步\
    \ API，并让我们用真正的 Promise 封装不符合规范的 Promise API 或回调 API。与回调和事件不同，Promise 帮助我们避免竞态条件，并确保其表示的值的不可变性。Promise\
    \ 让我们能够以同步风格编写异步代码，拥有平坦的缩进和单一的异常处理通道。\n\n# 10. 元编程\n\n“元”这个术语描述了某种本质上自指的特性。在编程领域，元编程意味着对程序本身的编程进行编程。它可以检查或修改程序的结构，或者改变语言本身的工作方式。ES6\
    \ 引入了一系列与元编程相关的重要特性，为程序的代码机制提供了底层钩子。在本章中，我们将深入探讨这些特性，并了解元编程在 JavaScript 中是如何工作的。\n\
    \n## ES5 与 ES6 中元编程概述\n\n元编程的概念对 JavaScript 来说并不新鲜。你可能每天都在使用元编程，甚至没有意识到这一点。例如，检查一个对象是否是另一个对象的原型，我们使用\
    \ `a.isPrototypeOf(b)`。这就是元编程的一种形式。通常，所有 `Object.*` 方法都可以被视为元编程的一种形式。元编程提供了一种利用语言特性和功能的方法，使你能够创建更灵活的程序，并高效地处理应用程序的自定义需求。\n\
    \n元编程的一个关键策略是反射。它允许我们在运行时检查或修改程序的结构，或者改变内部行为（特别是元数据属性和函数）。ES6 通过三种形式的元编程提供了反射能力。\n\
    \n元编程有三种形式：自省、自我修改和调解。\n\n- **自省（Introspection）** – 当代码检查自身时，例如：`a.isPrototypeOf(b)`\
    \ 就是自省。`typeof`、`instanceof` 也是自省操作符，因为它们收集有关代码的信息。\n- **自我修改（Self-modification）**\
    \ – 当你修改程序的结构时。一个例子是 `Object.defineProperty()` 方法，它可以在对象上定义一个新属性，或者修改已有属性（如果存在的话）。\n"
- fmt: "```javascript\nlet cake = {};\nconsole.log(cake);      // {}\nObject.defineProperty(cake,\
    \ \"ingredients\", {\n  value: [\"sugar\", \"all things nice\"],\n  enumerable:\
    \ true,\n  configurable: true,\n  writable: true\n});\nconsole.log(cake);\n//\
