    # 4. Classes in ES6


    If you are coming from object oriented programming languages like C++, Java, or
    Python, you must already be aware of how classes work. Prior to ES6, classes never
    existed in JavaScript, but from the early days, many patterns have existed to
    emulate classical class-oriented development. The concept of classes was teased
    in various different forms, primarily due to the fact that classes and classical
    inheritance could not be supported inside JavaScript in a clean straightforward
    way. This left a lot of traditional developers from other languages confused because
    classes and inheritance in JavaScript are not the primary method of creating similar
    or related objects.


    The syntax and coding patterns tried to use class-oriented development in hidden
    ways inside the prototype system with things like `new`, `instanceOf`, and the
    `constructor` property. Many libraries like JSClass, Classify.js, etc., existed
    to make JavaScript feel like it supported traditional classes. Hence even though
    a lot of conventional JS developers did not think there was a need for Classes
    in its traditional sense, just the sheer number of libraries influenced TC39 to
    introduce “classes” in ES6. The goal was to make them look similar to real classes,
    which was done by introducing the `class` keyword and a related mechanism for
    declaring them.


    ## Classes in ES6


    The class pattern was widely debated and argued on through the design process
    of ES6 and a compromise was reached. It is important here to understand that ES6
    classes do not work exactly the same way as in other object oriented languages.
    That said, TC39 is still in the process of adding more features post-ES6 to augment
    classes to bring them closer to the classical definition.


    Conceptually, there is no Class in traditional JavaScript. A class in ES6 is simply
    a function under the hood. It is nothing more than syntactical sugar over Objects
    and Prototypes, offering a convenient declarative form for class patterns that
    encourage interoperability. This new `class` keyword in ES6 supports prototype-based
    inheritance, constructors, super calls, instance, and static methods.


    Let’s look at how you’d write the most basic form of class declaration in ES6,
    which is very similar to how classes are defined in other languages. Consider
    the following example:


    ```

    class Car {

    constructor(brand) {

    this.brand = brand;

    }

    }

    const myTesla = new Car("Tesla");

    console.log(myTesla.hasOwnProperty("brand"));  // true

    console.log(typeof Car);                       // function

    ```


    In this example, `brand` is the property assigned on the `myTesla` object. This
    object can also be represented in an object literal form as follows:


    ```

    const myTesla = {

    brand: "Tesla"

    };

    ```


    The above example is a simple representation of how you can create a class with
    an optional `constructor` method that will be called when an object of this class
    is instantiated. Classes in ES6 don’t add any functionality to what we already
    have in the language; they are just a simpler syntax for building the objects.
    Any arguments passed into `new Car()` will be received as parameters to the `constructor`
    method of `Car`, and you can use those parameters to initialize instances of the
    same class. Therefore, the `constructor()` method is where you initialize your
    object’s properties and these properties are enumerable. Also, since the `constructor()`
    method is optional, you can declare an empty class like the one in the following
    example:


    ```

    class EmptyClass {

    }

    ```


    If you don’t define a `constructor()` method inside a class, the JavaScript engine
    will insert an empty one for you:


    ```

    class EmptyClass {

    /* JavaScript inserts an empty constructor:

    constructor () { }

    */

    }

    ```


    Now that we know how and where to initialize properties in a class, let’s look
    at how you can define methods. Class declarations allow you to define methods
    on a class without the use of a `function` keyword:


    ```

    class Car {

    constructor(brand) {

    this.brand = brand;

    }

    start() {

    console.log(`Your ${this.brand} is ready to go!`);

    }

    }

    const myTesla = new Car("Tesla");

    myTesla.start();

    // Your Tesla is ready to go!

    ```


    In the above example, we defined a `start()` method inside the class definition,
    which accesses the `brand` property of the class using `this` keyword. This method
    gets automatically attached to the class’s prototype and hence is non-enumerable.
    We will discuss this and class methods in greater detail later in this chapter,
    but first, let’s take a look at the different ways in which we can define classes
    in ES6.


