- fmt: "# `catch()` Method and Promise Chaining\n\nThe `catch()` method is useful\
    \ for error handling in promise composition. Similar to `then()` method, it also\
    \ returns a promise, but only deals with the rejected cases. `catch()` method\
    \ behaves as an abbreviation for `then(null, onRejected)`. We will learn more\
    \ about handling errors later in this chapter.\n\n## Chaining of Promises\n\n\
    Since `.then()` and `.catch()` always return a new promise, it is easy to chain\
    \ promises with extreme control over how and where the errors are handled. Chaining\
    \ promises allows asynchronous operations to be chained together, so that they\
    \ are guaranteed to happen in the correct and expected order, resulting in code\
    \ that looks almost synchronous. Consider the following example:\n\n```\nconst\
    \ bond = new Promise((resolve, reject) => {\n  resolve(\"Bond\");\n});\nbond.then((str)\
    \ => `${str}, James ${str}`)\n  .then((str) => `Hello, I'm ${str}!`)\n  .then((str)\
    \ => console.log(str));\n// Hello, I'm Bond, James Bond!\n```\n\nAbove is a simple\
    \ example of how chaining promises can help in a sequential executing of different\
    \ tasks and get the end result. Let's take a look at the following code snippet\
    \ that is more realistic example of how chaining of promises can be beneficial\
    \ with asynchronous tasks:\n\n```\ngetPaymentFromUser\n  .then(displayTransactionDetails)\n\
    \  .then(queueTransactionEmail)\n  .then(redirectToOrdersPage)\n  .catch(logError)\n\
    ```\n\nHere, `getPaymentFromUser` returns a promise, and each function in the\
    \ promise chain gets called with the return value of the previous handler once\
    \ it has completed. In this example, `displayTransactionDetails()` will wait for\
    \ `getPaymentFromUser()` to complete before starting, and `queueTransactionEmail()`\
    \ will wait for `displayTransactionDetails()` to complete before starting, and\
    \ so on. It is important to note that `logError()` will only run if any of the\
    \ previous promises reject. This serializes the calls without blocking the main\
    \ execution thread and guaranteeing that the executing of these operations will\
    \ happen in the serial order.\n\n## Error Handling\n\nPreviously in this chapter,\
    \ we discussed how we can handle errors while consuming promises using any of\
    \ the following ways:\n\n```\nsomePromise().then(onResolved, onRejected);\n//\
    \ or simply using catch()\nsomePromise()\n  .then(onResolved)\n  .catch(onRejected);\n\
    ```\n\nBut which one should you prefer and why? The answer to this question lies\
    \ in the very scenario where your `onResolved()` function throws an error. The\
    \ promise returned from `then()` method will be rejected, but using the first\
    \ way, the rejection cannot be caught — resulting in the error to get swallowed\
    \ in your app. But using the second way, errors originating from both `somePromise()`\
    \ and `onResolved()` can be handled at the `catch()` method. If we have more than\
    \ one `then()` call, then the error is passed on until there is an error handler.\
    \ Therefore, it is recommended to end all promise chains with a `catch()` method.\n\
    \n## Combining Promises with `Promise.all`\n\n`Promise.all` takes an array of\
    \ promises (or any iterable) and returns a promise that resolves when all of the\
    \ promises in the iterable argument have resolved, or rejects with the reason\
    \ of the first passed promise that rejects.\n\nIf any of the passed in promises\
    \ rejects, then all the promises immediately reject with the value of the promise\
    \ that rejected, discarding all the other promises whether or not they have resolved.\
    \ Note that if an empty array is passed, then this method resolves immediately.\n\
    \n```\nconst p1 = Promise.resolve(3);\nconst p2 = 42;\nconst p3 = new Promise((resolve,\
    \ reject) => {\n  setTimeout(resolve, 100, \"foo\");\n});\nPromise.all([p1, p2,\
    \ p3]).then(values => {\n  console.log(values); // [3, 42, \"foo\"]\n});\n```\n\
    \nHowever, in some cases, you may not want to wait for all the promises in your\
    \ array to resolve, but simply want to get the results of the first promise in\
    \ the array to fulfill. In that scenario, `Promise.race()` can be used.\n\n`Promise.race()`\
    \ also takes an array of promises, but unlike `Promise.all()`, it will fulfill\
    \ its returned promise as soon as the first promise in that array fulfills. For\
    \ example, consider the case where we want to fetch some JSON data from an API\
    \ endpoint, but we don't want to wait forever for the response. In that case,\
    \ we just want to use a default value instead. We can implement this using `Promise.race()`:\n\
    \n```\n// A Promise that times out after given time (t)\nfunction delay(t) {\n\
    \  return new Promise((resolve, reject) => {\n    setTimeout(resolve, t);\n  });\n\
    }\n// Whichever Promise fulfills first is the result passed to our handler\nPromise.race([\n\
    \    fetchData(),\n    delay(5000).then(() => { data: \"test\" })\n  ])\n  .then((res)\
    \ => {\n    // this will be \"test\" if fetchData() takes longer than 5 sec.\n\
    \    console.log(\"data:\", res.data);\n  })\n  .catch(function(err) {\n    console.log(\"\
    error:\", err);\n  });\n```\n\nIn this example, the `delay()` function returns\
    \ a new promise that resolves after `t` milliseconds. We then attach a handler\
    \ to that returned promise to return our default user object `{user: \"guest\"\
    }`, which ensures that if we get user data from our server within 5 seconds, we\
    \ will get the user details; otherwise a guest user will be used.\n\n## Summary\n\
    \nPromises have become the standard approach for dealing with large amounts of\
    \ asynchronous operations. In this chapter, we learned how promises, when used\
    \ correctly, produce easy-to-read code, which makes them easier to debug than\
    \ traditional callbacks. They allow us to combine asynchronous APIs and let us\
    \ to wrap non-spec compliant promise APIs or callback APIs with real promises.\
    \ Unlike callbacks and events, promises help us avoid race conditions and assure\
    \ immutability of the value represented by it. Promises let us write asynchronous\
    \ code in a synchronous fashion, with flat indentation and a single exception\
    \ channel.\n\n# 10. Meta Programming\n\nThe term \"meta\" characterizes something\
    \ that is characteristically self-referential. In terms of programming, meta programming\
    \ means to program the programming of the program itself. It could be inspecting\
    \ or modifying the structure of the program, or changing the way things work in\
    \ the language itself. ES6 introduces a great set of features around meta programming,\
    \ providing low-level hooks into the code mechanics of the program. In this chapter,\
    \ we will dig into those features in details and see how meta programming works\
    \ in JavaScript.\n\n## Meta Programming in ES5 and ES6 Overview\n\nThe concept\
    \ of meta programming is not new to JavaScript. You're probably using meta programming\
    \ every day without even realizing it. For example, checking whether an object\
    \ is a prototype of another object, we use `a.isPrototypeOf(b)`. This is a form\
    \ of meta programming. Generally, all of the `Object.*` methods can be considered\
    \ a form of meta programming. Meta programming provides a way to utilize the features\
    \ and capabilities of the language, enabling you to make programs with greater\
    \ flexibility and efficiently handle custom needs of your applications.\n\nA key\
    \ strategy of meta programming is reflection. It allows us to inspect, or modify\
    \ the structure of a program, or alter the behavior of the internals (specifically\
    \ metadata properties and functions) of a program at runtime. ES6 offers reflection\
    \ using three forms of meta programming.\n\nThere are three forms of meta programming:\
    \ introspection, self-modification, and intercession.\n\n- **Introspection** –\
    \ when you have a code inspecting itself, for example: `a.isPrototypeOf(b)` is\
    \ introspection. `typeof`, `instanceof` are also introspection operators as they\
    \ gather information about the code.\n- **Self-modification** – when you modify\
    \ the structure of a program. One such example would be `Object.defineProperty()`\
    \ method, which defines a new property on an object or modifies the existing one\
    \ if it exists."
  raw: 'The `catch()` method is useful for error handling in promise composition.
    Similar to `then()` method, it also returns a promise, but only deals with the
    rejected cases. `catch()` method behaves as an abbreviation for `then(null, onRejected)`.
    We will learn more about handling errors later in this chapter.


    ### Chaining of Promises


    Since `.then()` and `.catch()` always return a new promise, it is easy to chain
    promises with extreme control over how and where the errors are handled. Chaining
    promises allows asynchronous operations to be chained together, so that they are
    guaranteed to happen in the correct and expected order, resulting in code that
    looks almost synchronous. Consider the following example:


    ```

    const bond = new Promise((resolve, reject) => {

    resolve("Bond");

    });

    bond.then((str) => `${str}, James ${str}`)

    .then((str) => `Hello, I’m ${str}!`)

    .then((str) => console.log(str));

    // Hello, I’m Bond, James Bond!

    ```


    Above is a simple example of how chaining promises can help in a sequential executing
    of different tasks and get the end result. Let’s take a look at the following
    code snippet that is more realistic example of how chaining of promises can be
    beneficial with asynchronous tasks:


    ```

    getPaymentFromUser

    .then(displayTransactionDetails)

    .then(queueTransactionEmail)

    .then(redirectToOrdersPage)

    .catch(logError)

    ```


    Here, `getPaymentFromUser` returns a promise, and each function in the promise
    chain gets called with the return value of the previous handler once it has completed.
    In this example, `displayTransactionDetails()` will wait for `getPaymentFromUser()`
    to complete before starting, and `queueTransactionEmail()` will wait for `displayTransactionDetails()`
    to complete before starting, and so on. It is important to note that `logError()`
    will only run if any of the previous promises reject. This serializes the calls
    without blocking the main execution thread and guaranteeing that the executing
    of these operations will happen in the serial order.


    ### Error Handling


    Previously in this chapter, we discussed how we can handle errors while consuming
    promises using any of the following ways:


    ```

    somePromise().then(onResolved, onRejected);

    // or simply using catch()

    somePromise()

    .then(onResolved)

    .catch(onRejected);

    ```


    But which one should you prefer and why? The answer to this question lies in the
    very scenario where your `onResolved()` function throws an error. The promise
    returned from `then()` method will be rejected, but using the first way, the rejection
    cannot be caught — resulting in the error to get swallowed in your app. But using
    the second way, errors originating from both `somePromise()` and `onResolved()`
    can be handled at the `catch()` method. If we have more than one `then()` call,
    then the error is passed on until there is an error handler. Therefore, it is
    recommended to end all promise chains with a catch() method.


    ## Combining Promises with `Promises.all`


    Promise.all takes an array of promises (or any iterable) and returns a promise
    that resolves when all of the promises in the iterable argument have resolved,
    or rejects with the reason of the first passed promise that rejects.


    If any of the passed in promises rejects, then all the promises immediately reject
    with the value of the promise that rejected, discarding all the other promises
    whether or not they have resolved. Note that if an empty array is passed, then
    this method resolves immediately.


    ```

    const p1 = Promise.resolve(3);

    const p2 = 42;

    const p3 = new Promise((resolve, reject) => {

    setTimeout(resolve, 100, "foo");

    });

    Promise.all([p1, p2, p3]).then(values => {

    console.log(values); // [3, 42, "foo"]

    });

    ```


    However, in some cases, you may not want to wait for all the promises in your
    array to resolve, but simply want to get the results of the first promise in the
    array to fulfill. In that scenario, `Promise.race()` can be used.


    Promise.race() also takes an array of promises, but unlike Promise.all(), it will
    fulfill its returned promise as soon as the first promise in that array fulfills.
    For example, consider the case where we want to fetch some JSON data from an API
    endpoint, but we don’t want to wait forever for the response. In that case, we
    just want to use a default value instead. We can implement this using Promise.race():


    ```

    // A Promise that times out after given time (t)

    function delay(t) {

    return new Promise((resolve, reject) => {

    setTimeout(resolve, t);

    });

    }

    // Whichever Promise fulfills first is the result passed to our handler

    Promise.race([

    fetchData(),

    delay(5000).then(() => { data: "test" })

    ])

    .then((res) => {

    // this will be "test" if fetchData() takes longer than 5 sec.

    console.log("data:", res.data);

    })

    .catch(function(err) {

    console.log("error:", err);

    });

    ```


    In this example, the `delay()` function returns a new promise that resolves after
    t milliseconds. We then attach a handler to that returned promise to return our
    default user object `{user: "guest"}`, which ensures that if we get user data
    from our server within 5 seconds, we will get the user details; otherwise a guest
    user will be used.


    ## Summary


    Promises have become the standard approach for dealing with large amounts of asynchronous
    operations . In this chapter, we learned how promises, when used correctly, produce
    easy-to-read code, which makes them easier to debug than traditional callbacks.
    They allow us to combine asynchronous APIs and let us to wrap non-spec compliant
    promise APIs or callback APIs with real promises. Unlike callbacks and events,
    promises help us avoid race conditions and assure immutability of the value represented
    by it. Promises let us write asynchronous code in a synchronous fashion, with
    flat indentation and a single exception channel.


    # 10. Meta Programming


    The term “meta” characterizes something that is characteristically self-referential.
    In terms of programming, meta programming means to program the programming of
    the program itself. It could be inspecting or modifying the structure of the program,
    or changing the way things work in the language itself. ES6 introduces a great
    set of features around meta programming, providing low-level hooks into the code
    mechanics of the program. In this chapter, we will dig into those features in
    details and see how meta programming works in JavaScript.


    ## Meta Programming in ES5 and ES6 Overview


    The concept of meta programming is not new to JavaScript. You’re probably using
    meta programming every day without even realizing it. For example, checking whether
    an object is a prototype of another object, we use `a.isPrototypeOf(b)`. This
    is a form of meta programming. Generally, all of the `Object.*` methods can be
    considered a form of meta programming. Meta programming provides a way to utilize
    the features and capabilities of the language, enabling you to make programs with
    greater flexibility and efficiently handle custom needs of your applications.


    A key strategy of meta programming is reflection. It allows us to inspect, or
    modify the structure of a program, or alter the behavior of the internals (specifically
    metadata properties and functions) of a program at runtime. ES6 offers reflection
    using three forms of meta programming.


    There are three forms of meta programming: introspection, self-modification, and
    intercession.


    *   Introspection – when you have a code inspecting itself, for example: `a.isPrototypeOf(b)`
    is introspection. `typeof`, `instanceof` are also introspection operators as they
    gather information about the code.

    *   Self-modification – when you modify the structure of a program. One such example
    would be `Object.defineProperty()` method, which defines a new property on an
    object or modifies the existing one if it exists:'
