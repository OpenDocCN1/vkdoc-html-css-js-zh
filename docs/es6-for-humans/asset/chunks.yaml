    that is guaranteed to never clash with any other Symbol. Symbols in ES6 can be
    created using a factory function. The `Symbol()` method can be used to create
    a new symbol. Consider the following example:


    ```

    const foo = Symbol();

    console.log(typeof foo);      // "symbol"

    ```


    Every time you call the factory function, a new and unique symbol is created.
    The output from the `typeof` on a symbol type is `"symbol,"` and this is the primary
    way to identify symbols:


    Note


    Symbols in ES6 do not have a literal form like other primitives.


