    ]\n}\n```\n\n你的 `package.json` 文件应该大致如下所示：\n\n```\n{\n\"name\": \"es6-boilerplate\"\
    ,\n\"version\": \"1.0.0\",\n\"description\": \"ES6 Boilerplate\",\n\"devDependencies\"\
    : {\n\"babel-core\": \"⁶.24.1\",\n\"babel-loader\": \"⁶.4.1\",\n\"babel-preset-es2015\"\
    : \"⁶.24.1\",\n\"webpack\": \"².4.1\",\n\"webpack-dev-server\": \"².4.2\"\n}\n\
    }\n```\n\n现在，在你的项目根目录下创建一个新的 `index.html` 文件和 `index.js` 文件。你当前的项目目录应该如下所示：\n\n\
    ```\n.\n├── index.html\n├── node_modules\n├── package.json\n├── index.js\n```\n\
    \n## 配置 Webpack\n\n下一步是通过在项目根目录下创建一个配置文件 `webpack.config.js` 来设置 webpack。\n\n\
    一个 webpack 配置文件是一个 CommonJS 风格的模块，它从中导出一个配置对象。\n\n```js\n// webpack.config.js\n\
    module.exports = {\nentry: './index.js',\noutput: {\npath: './dist',\nfilename:\
    \ 'bundle.js'\n}\n};\n```\n\n这里，`entry` 是你的项目源文件的路径，webpack 会分析你的入口文件以获取依赖关系，并生成一个打包后的输出（包含所有依赖模块）。请注意，启动时只会执行入口模块。\n\
    \n## 添加加载器\n\n加载器让你可以在加载文件时对它们进行预处理。加载器提供了一种强大的方式来处理前端构建步骤，并且可以将文件从不同的语言（如 CoffeeScript）转换为\
    \ JavaScript，或将内联图像转换为数据 URL。例如，`babel-loader` 使用 Babel 来加载 ES2015 文件。\n\n所以现在，修改\
