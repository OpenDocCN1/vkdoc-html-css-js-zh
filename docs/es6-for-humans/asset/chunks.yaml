- fmt: '# The Iterable Protocol


    The iterable protocol allows you to customize the iteration behavior of JavaScript
    objects. This protocol states that all objects that are iterables must implement
    the `@@iterator` method using the `[Symbol.iterator]` property. This method is
    called whenever an object needs to be iterated. It takes no arguments and returns
    the default iterator, which can be used to obtain the values out of the iterable.
    Built-in iterables such as `Array`, `Map`, `Set`, etc., have a default `@@iterator`
    method, which allows us to traverse the respective collections.


    ## Iterator Protocol


    The iterator protocol defines a standard way to get a sequence of values out of
    an iterable object. This protocol states that an iterator object must define a
    `next()` method that takes no arguments and returns an object with two properties:
    `done` and `value`.


    ## Iterator as an Iterable


    If an iterator is also an iterable, it can directly be used with the `for...of`
    loop. You can make an iterator an iterable by providing it with the `Symbol.iterator`,
    which returns the iterator itself. Take a look at the following code snippet where
    we are making an iterable from an iterator, and then using the `for...of` loop
    to iterate over:


    ```javascript

    const infiniteSequenceGenerator = {

    currentNumber: 0,

    // making the "infiniteSequenceGenerator" iterator an iterable

    [Symbol.iterator]() {

    return this;

    },

    next() {

    return {

    value: this.currentNumber++,

    done: false

    }

    }

    };

    const iter = infiniteSequenceGenerator[Symbol.iterator]();

    console.log(iter === infiniteSequenceGenerator);   // true

    console.log(iter.next().value);   // 0

    console.log(iter.next().value);   // 1

    console.log(iter.next().value);   // 2

    console.log(iter.next().value);   // 3

    for (let item of iter) {

    if (item > 20) break;

    console.log( item );

    }

    // 4

    // 5

    // 6

    // 7

    // ... 20

    ```


    In the above example, notice how we can directly use the `for...of` loop with
    an iterable, but internally it uses the `next()` method since we got the list
    of numbers starting from `4` in the `for...of` loop, having called the iterator
    four times before starting the loop using the `next()` method manually.


    ## `return()` and `throw()` in Iterators


    An iterator also has two additional optional methods: the `return()` and `throw()`,
    which are not implemented on most built-in iterators, but they definitely have
    a lot of relevance in the context of generators, which we will be looking into
    later in this chapter.


    There might be cases where you may want the last item with `{done: true, value:
    undefined}` to have some value other than being `undefined`. This is where `return()`
    comes in. The `return()` method is used to send a signal to an iterator that the
    code using the iterator will not call for anymore values from the iterator. It
    could be used when the iterator has consumed all the values or when it has encountered
    an unusual termination, allowing it to perform a cleanup operation like killing
    a database connection, saving, or closing a file. If present, `return()` will
    be called automatically when the collection has been exhausted, or it can also
    be called manually as well. The `return()` method takes it as an optional argument,
    which is generally sent back as the value in the returned object.


    `throw()` on the other hand, is used to signal the iterator about an exception
    or an error that might have occurred. This can be used differently by an iterator
    compared to the signal from the `return()` method because it does not imply a
    complete stop like `return()` does. We will be looking into these methods more
    closely in the generators section.


    ## Generators


    In simple words, Generators are functions that can be paused. Prior to ES6, JavaScript
    only had functions that would run to completion before anything could interrupt
    their execution. With ES6, a different kind of function has been introduced to
    us through generators that do not always run to completion like functions, but
    they can pause and resume cycle midway through executions.


    A generator is a function that allows us to create a special type of iterator,
    whose execution can be suspended and retained while keeping the context. A function
    is a generator if it contains one or more `yield` expressions and if it uses the
    `function *` syntax:


    ```javascript

    function *gen() {

    yield 42;

    }

    ```


    In this syntax, the position of the `*` is not very significant. A generator can
    be written in any of the following ways:


    ```javascript

    function *gen()  { .. }

    function* gen()  { .. }

    function * gen() { .. }

    function*gen()   { .. }

    ```


    Nonetheless, it is preferable to maintain consistency in style when you use a
    generator in your code. We will use the first format in the rest of this book.


    ## Generator Function


    A generator function is paused by executing a `yield` keyword in the body of the
    function, which can be used any number of times in the function body. You can
    return a value from a `yield` expression. Check the following example where we
    are yielding the value `42` from a generator:


    ```javascript

    function *generator () {

    yield 42;

    }

    ```


    A Generator executes just like any other function and you can pass arguments in
    it. The only difference being that executing a generator doesn''t really run the
    code inside it. It simply produces an iterator that can be used to execute the
    code inside it.


    ```javascript

    function *gen() {

    yield "Hello";

    yield "from";

    yield "generator";

    }

    ```


    Now if we call this generator function, it will not be executed; instead it returns
    an iterator that will be used to execute the code inside it.


    ```javascript

    let obj = gen();

    ```


    In the generator above, the operations in the beginning would run and then the
    `yield` statement would pause the execution of the generator until the `next()`
    method is called. The method `obj.next()` continues the execution of `gen`, until
    the next `yield` expression:


    ```javascript

    console.log(obj.next());   // { value: "Hello", done: false}

    console.log(obj.next());   // { value: "from", done: false}

    console.log(obj.next());   // { value: "generator", done: false}

    console.log(obj.next());   // { value: undefined, done: true}

    ```


    `yield` can be used any number of times inside a generator. It can also be a part
    of a loop to represent a repeated pause location. Note that `yield` is not just
    a pause point, it also sends out a value when pausing the generator.


    ```javascript

    function *infiniteNumbers() {

    var n = 1;

    while (true) {

    yield n++;

    }

    }

    var numbers = infiniteNumbers(); // returns an iterable object

    console.log(numbers.next()); // { value: 1, done: false }

    console.log(numbers.next()); // { value: 2, done: false }

    console.log(numbers.next()); // { value: 3, done: false }

    ```


    Each time `yield` is called, the yielded value becomes the next value in the sequence.
    A `yield` statement without a value provided just implies that the value is `undefined`.


    ## Communicating with Generators


    In the previous section, we saw how generators communicate to our code using `yield`
    statements. We can also pass a value via `yield` to the generator function and
    use those values inside the generator function when the execution resumes. Take
    a look at the following code snippet, for example:


    ```javascript

    function *calculator() {

    const num1 = yield "I am a calculator";

    const num2 = yield "I add numbers";

    console.log(`Sum is: ${num1 + num2}`);

    }

    const myGenerator = calculator();

    console.log(myGenerator.next());

    // { value: ''I am a calculator'', done: false }

    console.log(myGenerator.next(2));

    // { value: ''I add numbers'', done: false }

    console.log(myGenerator.next(3));

    // Sum is: 5

    // { value: undefined, done: true }

    ```'
