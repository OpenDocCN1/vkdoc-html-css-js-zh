    itrObj.next(); // { value: 42, done: false }

    itrObj.next(); // { value: 43, done: false }

    itrObj.next(); // { value: undefined, done: true }

    ```


    When the `@@iterator` method at `Symbol.iterator` is invoked for the given array
    `arr`, it will create a new iterator. Note that a fresh iterator is created every
    time it is invoked. Built-in ES6 data structures that are iterables have this
    behavior, allowing the values to be iterated over using the `next()` method.


    Let’s take a look at primitive string values as an example,


    ```

    const message = "Ian is an awesome student";

    const itrObj = message[Symbol.iterator]();

    itrObj.next();      // { value: "I", done: false }

    itrObj.next();      // { value: "a", done: false }

    ..

    ```


    In the above example, we are able to iterate over each character of the String
    `message` using the `next()` method. ES6 also allows us to iterate over the new
    data structures, like `Map` and `Set` collections. Let’s take a look at `Map`
    as an example:


    ```

    const permissionMap = new Map();

    permissionMap.set("admin", {read: true, write: true, del: true});

    permissionMap.set("student", {read: true, write: false, del: false});

    permissionMap.set("faculty", {read: true, write: true, del: false});

    permissionMap.set("staff", {read: true, write: false, del: true});

    const permissions= permissionMap[Symbol.iterator]();

    console.log(permissions.next());

    // {value: [''admin'', { read: true, write: true, del: true }], done: false}

    console.log(permissions.next());

    // {value: [''student'', { read: true, write: false, del: false }], done: false}

    console.log(permissions.next());

    // {value: [''faculty'', { read: true, write: true, del: false }], done: false}

    console.log(permissions.next());

    // {value: [''staff'', { read: true, write: false, del: true }], done: false}

    console.log(permissions.next());

    // {value: undefined, done: true}

    ```


    In the above example, we have created a map for the permissions for different
    user types as the key. We can simply create a new iterator by invoking the `@@iterator`
    method and iterate over the values using `next()`. A good thing to note here is
    that these collections also provide API method(s) to generate an iterator, for
    example, you can get the iterator of a map using the `entries()` method:


    ```

    const permissionEntries = permissionMap.entries();

    console.log(permissionEntries.next());

    // {value: [''admin'', { read: true, write: true, del: true }], done: false}

    console.log(permissionEntries.next());

    // {value: [''student'', { read: true, write: false, del: false }], done: false}

    ```


    ## Iteration Protocols


    Now that we have a basic understanding of iterators and iterables, let’s talk
    about those protocols we briefly discussed at the beginning of this chapter. There
    are two iteration protocols: the iterable protocol and the iterator protocol.
    These protocols can be implemented by any object respecting some conventions.


    ### Iterable Protocol'
