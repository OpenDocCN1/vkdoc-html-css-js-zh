- fmt: '# 1\. Getting Started with ES6


    Around 46% of the world’s population have Internet access today and the numbers
    are steadily increasing. While you’re reading this, there are people out there
    who are using Internet services to book a cab, or a flight, or a table for two
    at a fancy restaurant; the point is that the Internet today has made people’s
    lives easier. More and more web apps are being built everyday with the goals of
    saving people time, providing them with a higher standard of comfort or simply
    for entertainment. These apps are accessible on the go, and a lot of them are
    built using `JavaScript`.


    According to the StackOverflow Developer Survey , `JavaScript` is the most commonly
    used programming language on earth. The ubiquity of the web platform is driving
    developers to use `JavaScript` more than any other language, leading to the evolution
    of `JavaScript` platforms like `Node.js`, front-end frameworks like `Angular`
    & `React`, and complete webstacks like `MEAN` (`MongoDB`, `ExpressJS`, `AngularJS`
    and `NodeJS`).


    This book discusses the core concepts of `ES 2015` (popularly referred to as `ES6`)
    and beyond, while focusing on the best development practices. By the time you
    finish reading this book, you will have a good understanding of core `ES6` concepts,
    features, and their applicability in the modern-day development workflow.


    ## ES6 The Specification


    For many years `ECMAScript 6` (`ES6`) had been in the works but on June 17, 2015,
    the 109th Ecma General Assembly approved the 6th Edition of `ECMA-262` standards,
    making official a major upgrade to what we know and love as `JavaScript`.


    The evolution of `JavaScript`, more specifically `ECMAScript`, is primarily community
    driven and `TC39` is the official committee in charge of it. `TC39` is primarily
    constituted by members that represent various stakeholders like the major browser
    companies and other invited members. They meet and communicate on a regular basis
    and are tasked with maintaining and upgrading the standard for the `ECMAScript`
    programming language and the libraries that extend its capabilities. In the process,
    they consider and evaluate the proposals for complementary and additional technologies
    for evolving `ES`. If you are interested in knowing more or checking out the agendas
    and minutes of their meetings, they are all available online on GitHub ( `https://github.com/tc39/tc39-notes`
    ).


    The design process for `ECMAScript` standards is built around proposals that are
    usually popular requests from the developer community for new features or upgrades
    to existing ones. Since `TC39` has a large number of participants, making it difficult
    to do collaborative design work, usually one or two committee members are assigned
    as champions responsible for maintaining a proposal and to do design work and
    report back to the committee.


    For a proposal to become a standard, it has to go through multiple stages. The
    initial feature sketch of the proposal, which is also referred to as a “Strawman
    proposal,” is the first stage discussed by the committee and if it agrees that
    it is important, it is considered an official proposal. The proposed feature then
    needs to be implemented at least by two major `JavaScript` engines to get feedback
    from the community and evolve the proposal further. Once the proposal passes through
    these stages and incorporates feedback, `TC39` approves it and will include it
    in the new edition of the `ECMAScript` standard.


    ## History of ECMA, ECMAScript, and JavaScript


    For someone unaware of the history of `JavaScript`, it can get pretty confusing
    quickly with so many different names like `JavaScript`, `ECMAScript`, different
    version numbers, and other popular offshoots like `ActionScript`, `JScript`, and
    `TypeScript`, which are all different forms of `JavaScript`.


    `JavaScript` was originally developed by Brendan Eich as a scripting language
    for the web for use in the Netscape browsers . The name itself was chosen for
    marketing reasons due to the rising popularity of `Java` around the time, even
    though it had nothing to do with `Java`. In an attempt to standardize the language
    and the specification, it was submitted to `ECMA International` , a body for standardization
    of information and communication technology and consumer electronics. Eventually,
    the language standardized in `ECMA-262` was just called `ECMAScript` or `ES` in
    abbreviated form, since `JavaScript` was a name trademarked by Sun and now belongs
    to Oracle. None the less, the language is still commonly referred to as `JavaScript`
    by everyone. There were many variations in implementations with `ECMAScript` as
    the backbone, like a slightly different adoption for the Internet Explorer by
    Microsoft called `JScript`. `ActionScript` is another example of a derived language
    developed by Adobe.


    The initial versions `ES1` and `ES2` were released in 1997 and 1998, but in 1999,
    the `ES3` release was a major upgrade with new features like regular expressions,
    improved string handling, more control statements, better error handling, and
    try catch exception handling among many other enhancements that we commonly use
    in `JavaScript` today. It had a widespread base implementation in various forms
    across major browsers and engines.


    After the release of `ES3`, work on `ES4` was well under way with many radical
    changes and a massive scope. Updated features included new syntax, modules, classes,
    classical inheritance, private object members, optional type annotations, and
    more. The proposed changes led to many differences, both technical and political,
    among various stakeholders in the community, resulting in it being put on hold
    in 2003. Parts of the proposed features made their way into implementations like
    `ActionScript` and `Jscript.NET`. After receiving feedback from these implementations,
    `TC39` decided to resume work on `ES4` in 2005, but by this time there was a big
    split in the community and two major groups had formed with differences on the
    way forward.


    The alternate version championed by companies like Microsoft and Yahoo with fewer
    feature additions and improvements to the existing spec was referred to as `ECMAScript
    3.1`. Because there was no consensus between the groups and the future of `JavaScript`
    was questionable, there was no major progress for a few years. Finally, in 2008
    `TC39` came to a consensus between `ES4` and `ES3.1`. `ECMAScript 3.1` was eventually
    standardized as the fifth edition of `ECMA-262`, also described as `ECMAScript
    5`, and the committee never released an `ECMAScript 4` standard to avoid confusion.
    `ES5` would be a small incremental update and they would work on the next major
    release, which would be more modest than `ES4`, dropping many proposed features
    like packages, namespaces, and early binding. This proposed release was code named
    `ES Harmony` due to the nature of the meeting.


    `ES5` was released in December 2009, and it is currently the most widely supported
    version in modern browsers today. It came with many enhancements to the standard
    library and updated language semantics via a strict mode.


    When it was apparent that plans for `ES Harmony` were becoming too ambitious for
    a single release, they split up the first set of features with the highest priority
    and code named the release `ES. Next`, to avoid premature naming with a version
    number in light of what happened with `ES4`, once it matured the specification
    was called `ECMAScript 6`.'
