    has no other consequence except for being a string to describe the symbol while
    printing it. It is also useful when you call `.toString()` method on the returned
    symbol, which converts the symbol into a string. This label is shown when you
    write the symbol to `console.log()`, and possibly in error messages. This can
    be helpful for debugging purposes.


