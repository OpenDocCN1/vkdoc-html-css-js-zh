    `callback (element, index, array)` criteria, the return value is -1.


    Consider the following code snippet, for example:


    ```

    result = inventory.findIndex((fruit) => fruit.name === ''apples'');

    console.log(result);             // 0

    result = inventory.findIndex((fruit) => fruit.name === ''grapes'');

    console.log(result);             // -1

    ```


    This method is similar to the `indexOf()` method from ES5, which simply locates
    the element in the array. With the `indexOf()` method, you can only search for
    an element inside an array; it doesn’t support a callback method. Whereas in case
    of the `findIndex()` method, we have the capability to apply a condition to which
    the element at the returned index position must satisfy.


    ### `Array.prototype.fill()`


    This is a very simple method that allows us to fill all the elements of an array
    with a static value. It also takes optional start and end index values.


    Consider the following code snippet:


    ```

    [1, 2, 3].fill(4);         // [4, 4, 4]

    [1, 2, 3].fill(4, 1);      // [1, 4, 4]

    [1, 2, 3].fill(4, 1, 2);   // [1, 4, 3]

    ```


    The input value can be arbitrary, not necessarily a number, character, or any
    other primitive type. It can be an object, for example:


    ```

    new Array(4).fill({});     // [{}, {}, {}]

    ```


    ### `Array.prototype.copyWithin()`


    The `copyWithin()` method copies the sequence of array elements within the array
    to the position starting at `target`. The elements that should be copied are taken
    from the `(start, end)` range. The `start` argument is optional and defaults to
    0. Also, the `end` argument is also optional and defaults to the length of the
    array.


    The syntax of `copyWithin()` method looks like this:


    ```

    Array.prototype.copyWithin(target, start = 0, end = this.length)

    ```


    Let’s start with a simple example. Consider the following code snippet:


    ```

    let fruits = ["apples", "bananas", "oranges", "grapes", "guava", "watermelon"];

    fruits.copyWithin(4);

    console.log(fruits);

    // ["apples", "bananas", "oranges", "grapes", "apples", "bananas"]

    ```


    `fruits.copyWithin(4)` considers the `target` index at 4, which is "guava." It
    further determines the items to be copied will be taken as `start` at 0 (default)
    and `end` at 6 (length of the array). You can obviously specify start and end
    values as per your needs:


    ```

    fruits = ["apples", "bananas", "oranges", "grapes", "guava", "watermelon"];

    fruits.copyWithin(4, 1, 3);

    console.log(fruits);

    // ["apples", "bananas", "oranges", "grapes", "bananas", "oranges"]

    ```


    The `copyWithin()` method also accepts negative `start` indices, negative `end`
    indices, and negative `target` indices. Let’s look at an example using that:


    ```

    [1, 2, 3, 4, 5].copyWithin(-3, -4, -1);    // [1, 2, 2, 3, 4]

    ```


    In this example, `-3` as the `target` index determines the `start` position as
    the `third` element from the last of the array (which is `3` in the input array).
    It further determines the `start` and `end` values as `2` and `5` (the `fourth`
    and `first` element from the end of the array), respectively.


    ## Typed Arrays


    Typed arrays in ES6 provide an efficient way for accessing and manipulating binary
    data. Before ES6, JavaScript was not very good at handling binary data. Typed
    arrays help in improving the performance when it comes to handling binary data.


    With typed arrays, JavaScript engines do not have to deduce the type of the array.
    If you make an ordinary array in JavaScript, and only store floating-point numbers
    in it, your JavaScript engine may optimistically decide that it’s an array of
    floating-point numbers and optimize the code for it. The performance can then
    be equivalent to that of typed arrays. But, let’s consider a case where you have
    an array of floating-point numbers and at some point in your code, you store an
    object in an element. In this case, your JavaScript engine has to de-optimize
    and regenerate code that makes the array generic again. Therefore, with Typed
    arrays, things are much simpler as they’re guaranteed to be one type, and you
    just can’t store other things like objects in them. The fact they’re much simpler
    means that less-sophisticated JavaScript engines can easily implement them, and
    you can achieve a consistent performance throughout.


    The architecture of a typed array is comprised of a buffer and a view. A buffer
    is an object that represents a chunk of data. We can’t directly manipulate the
    contents of a buffer. In order to access the memory contained in the buffer, we
    need to use a view. A view enables us to read and write the data content of the
    buffer.


    So, typed arrays have two separate classes: `ArrayBuffer` and `DataView`. The
    `ArrayBuffer` contains our data and the `DataView` provides a custom view into
    this data, which represents the buffer in a specific format and enables data access
    and manipulation.


    ### Basics of Using Typed Arrays


    Check the following code snippet; here we are creating an `ArrayBuffer` and then
    a specific `DataView` to handle the data inside that buffer:


    ```

    const buffer = new ArrayBuffer(16);

    const int32View = new Int32Array(buffer);

    for (let i = 0; i < int32View.length; i++) {

    int32View[i] = i * 2;

    }

    console.log(int32View); // [0, 2, 4, 6]

    ```


    Typed array views provide views for all the usual numeric types like Int8, Uint32,
    Float64, etc. You can check all the types and their respective size and description
    in Table 7-1.


    **Table 7-1.** Typed array views


    | Type | Size in bytes | Description |

    | --- | --- | --- |

    | Int8Array | 1 | 8-bit signed integer |

    | Uint8Array | 1 | 8-bit unsigned integer |

    | Uint8ClampedArray | 1 | 8-bit unsigned integer (clamped) |

    | Int16Array | 2 | 16-bit signed integer |

    | Uint16Array | 2 | 16-bit unsigned integer |

    | Int32Array | 4 | 32-bit signed integer |

    | Uint32Array | 4 | 32-bit unsigned integer |

    | Float32Array | 4 | 32-bit floating-point number |

    | Float64Array | 8 | 64-bit floating-point number |'
