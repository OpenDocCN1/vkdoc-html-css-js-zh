- fmt: '# Setters and Getters


    Setters and getters allow us to encapsulate the behavior associated with getting
    or setting of the object’s property, which makes the code more extendible as you
    can easily add more functionalities like validation of the input or some transformations
    of the input data based on your needs. Also, it can be helpful to inherit these
    validation or transformation functionalities to child classes and have them in
    place or modify as per the application’s needs.


    At times, it may seem like a good idea to have an alternate representation of
    the property exposed to the user via property accessors, hiding the internal representation
    of the property.


    Having property accessor methods allow us to set different access levels, for
    example, the getter can be public but the setter method could be protected for
    certain group of users.


    You should also note that the setter must have exactly one formal parameter, which
    means you should create individual setters and getters for each property of the
    class instance.


    ## Computed Method Names


    Similar to object literals, methods inside a class can have computed names. This
    also applies to getter and setter accessor properties of the class. As seen with
    object literals, the computed method names can be wrapped with `[ ]`; check the
    following code snippet for an example:


    ```

    const methodName = "getColor";

    const propName = "color";

    class AeroPlane {

    constructor(color) {

    this._color = color

    }

    [methodName]() {

    return this._color;

    }

    get [propName]() {

    return this[`_${propName}`];

    }

    set [propName](value) {

    return this[`_${propName}`] = value;

    }

    }

    const whiteJet = new AeroPlane("white");

    console.log(whiteJet.color);

    // white

    ```


    In the above example, we are computing the method name and getter and setter accessor
    property names inside the class definition by wrapping them with `[ ]`. We are
    also using the string literals to evaluate the dynamic property name inside the
    getter and setter methods.


    ## Class Properties and Privacy


    So far, we have seen how we can add properties to a class’s instance by defining
    the property inside the constructor method in the class definition. However, all
    the properties we have seen so far are public properties, which can be accessed
    easily outside the class definition without using the setter or getter methods.
    There has been a long-term discussion around private properties in the JavaScript
    community. Unfortunately, prior to ES6, private properties never existed in JavaScript
    so they had to be faked. And the most common convention was to prefix the property
    or method name with an underscore, which we saw in the previous example.


    With ES6, there are a couple of ways for managing data privacy inside a class.


    ## Using Constructor Environments


    The idea of having methods and properties stored inside the constructor environment,
    capturing the variables in a closure, ensures that these methods or properties
    would not be added to the prototype and are only accessible to the constructor
    and to the functions it created.


    ```

    class AeroPlane {

    constructor(capacity) {

    this.checkCapacity = function(value) {

    if (capacity >= value) {

    return true;

    }

    return false;

    }

    }

    }

    const jet = new AeroPlane(200);

    console.log(jet.checkCapacity(100));    // true

    console.log(jet.capacity);              // undefined

    ```


    In the above example, the constructor environment stores the parameters and local
    variables, keeping class properties (here, `capacity`) private by making it inaccessible
    outside the constructor. This keeps the private data completely safe and inaccessible
    from the class’s instance.


    ### Using WeakMaps


    Before we move forward to see how WeakMaps help in keeping the data private inside
    classes, let’s take a quick look at what WeakMaps are. A `WeakMap` is a new data
    type introduced in ES6. They are simply a collection of keys and values with the
    main constraint of having an object as the keys. We will be learning more about
    them in detail later in this book. But for now, you should note that you can create
    a `WeakMap` using the following:


    ```

    const myMap = new WeakMap();

    ```


    and you can use `set` and `get` methods on the returned `WeakMap` to store and
    retrieve a value associated with it:


    ```

    const myMap = new WeakMap();

    const myObj = { name: "jack" };

    myMap.set(myObj, "developer");

    console.log(myMap.get(myObj));

    // developer

    ```


    As seen in the above code snippet, we are using an object as the key to store
    a value inside a `WeakMap`.


    One of the other features of `WeakMap`s is that they do not prevent garbage collection
    in case there would be no other reference to the object. Therefore, using WeakMap
    to store properties of a class helps in keeping the data private, and it destroys
    those private properties whenever an instance associated with the class is destroyed.


    ```

    const data = new WeakMap();

    class AeroPlane {

    constructor(seats) {

    data.set(this, {

    capacity: seats

    });

    }

    get seats() {

    return data.get(this).capacity;

    }

    set seats(value) {

    data.get(this).capacity = value;

    }

    }

    const jet = new AeroPlane(200);

    console.log(jet.capacity);                // undefined

    console.log(jet.seats);                   // 200

    ```


    In the above example, we are using a `WeakMap` to keep the data private and exposing
    setters and getters to interact with the private data of the class. But it comes
    at the cost of keeping your `WeakMap` hidden from the outside world. As long as
    it is hidden from outside access, your properties will remain safe and private.


    Besides `WeakMap`s, ES6 also provides another new technique to keep the data private
    (or rather, prevent it from casual access) using Symbols, which we will learn
    later in this book.


    ## Static Methods and Properties


    With classes, you can also define properties and methods that are a part of a
    class and not particularly any instance of that class. These methods and properties
    are associated with the class, and not with the instances of the class, which
    is often useful in creating utility functions for an application. ES6 allows you
    to easily create static methods by using the `static` keyword before the method
    name:


    ```

    class AeroPlane {

    constructor(capacity) {

    this.capacity = capacity;

    }

    static radio(message) {

    console.log(`Message from broadcast: ${message}`)

    }

    }

    AeroPlane.radio("Sky is clear");

    // Message from broadcast: Sky is clear

    ```


    As mentioned before, it is important to note that the static methods and properties
    are accessed directly from their class, and you cannot access a static method
    or property from the instance of the class. Therefore, static methods also cannot
    access the properties or methods defined on an instance of the class using `this`.


    At the time of writing this book, ES6 does not support creating properties with
    `static` keywords. There is a proposal for adding them to the language specification,
    but until this proposal is accepted and the implementation gets released, you
    can either use static getters and setters or manually attach a static property
    to a class as follows:


    ```

    class AeroPlane {

    constructor(capacity) {

    this.capacity = capacity;

    }

    }

    AeroPlane.color = "white";

    console.log(AeroPlane.color);

    // white

    console.log(AeroPlane.capacity);

    // undefined

    ```


    In this example, notice how we are able to access the static property using the
    class-name, and it returns `undefined` on a non-static property.


