    \ 使用 `webpack --progress --colors` 可以美化输出，它会在终端的 webpack 输出中添加一个进度条和颜色。\n\n##\
    \ 设置开发服务器\n\n要启动开发服务器来测试你的代码，你可以运行以下命令：\n\n```\nwebpack-dev-server -d --progress\
    \ --colors\n```\n\n这会在 `localhost:8080` 上绑定一个小的 node-express 服务器，它提供你的静态资源以及（自动编译的）打包文件。当打包文件被重新编译时，它会自动更新浏览器页面。\n\
    \n我们还可以将这些 webpack 命令添加到你的 `package.json` 的脚本中。\n\n```json\n\"scripts\": {\n\"\
    start\": \"webpack-dev-server --hot --inline\",\n\"watch\": \"webpack -w -d\"\
    ,\n\"build\": \"webpack -p\"\n},\n```\n\n现在，你可以使用这个：\n\n* `npm start` 在 `localhost:8080`\
    \ 上运行一个开发服务器，并监听/重新编译更改。\n* `npm run watch` 仅在你自己的 web 服务器上监听/重新编译更改。\n* `npm\
    \ run build` 生成一个压缩的、可用于生产环境的构建。\n\n让我们用 `index.js` 文件中的一个 `helloWorld()` 函数来试试这个：\n\
    \n```js\nconst helloWorld = () => {\nconsole.log(\"Hello! We are all set!\");\n\
    console.log(\"Arrow functions are working\");\n};\nhelloWorld();\n```\n\n为确保一切运行正常，你可以在终端中运行\
    \ `npm start`，并检查服务器是否在 `http://localhost:8080` 上运行。\n\n你可以运行 `npm run watch`\
    \ 来查看位于 `dist` 目录下的 `bundle.js` 文件中的转译代码，其中将包含如下这段转译后的 ES5 代码：\n\n```js\nfunction(module,\
    \ exports) {\n\"use strict\";\nvar helloWorld = function sayHello() {\nconsole.log(\"\
    Hello! We are all set!\");\nconsole.log(\"Arrow functions are working\");\n};\n\
    helloWorld();\n}\n```\n\n最后，我们还建议在项目中使用 ESLint，以在编写代码时遵循最佳实践并避免错误。你可以在 [`github.com/metagrover/ES6-boilerplate`](https://github.com/metagrover/ES6-boilerplate)\
    \ 找到上述样板代码，该仓库还包含一个 `.eslintrc` 文件，其中包含我们使用的标准规则和配置。\n"
- fmt: '## Summary


    JavaScript is one of the most powerful languages on the Web today, and it is only
    getting stronger. `ES6`, or officially `ES2015` and the versions that follow,
    brings in a new paradigm to JavaScript. As we will see in the next few chapters,
    there is a lot of new stuff for a conventional JavaScript developer. But it is
    important for existing JavaScript developers to become aware of the new features
    to stay ahead of the curve as more and more features become mainstream in the
    world of browsers and frameworks.


    JavaScript is moving quicker than ever before and transpilers and shims/polyfills
    are important tools to keep you on the forefront of where the language is headed.
    `ECMAScript 6` comes with a very extensive list of new additions to the language
    and each of these features was carefully considered, discussed at length, and
    chosen by the community to become a part of the standard. Now it’s up to us developers
    to use and apply the new standard to our products to better serve the people using
    them.


    You might be asking yourself, is the change worth it. Is integrating `ES6` into
    your projects and work necessary and do you really need to change the existing
    ways of doing things. We would like to say "Yes, it is worth it," and through
    this book we aspire to encourage you to adapt to this new world. Even if you face
    some resistance in moving away from the old ways, we suggest you stick with it
    and change your practices.


    The JavaScript community is extremely vibrant and dynamic with things changing
    at a rapid rate. `ES6/ES2015` knowledge is now expected among JavaScript developers.
    The new language constructs have not only become popular, but are now also widely
    supported. Mastering the inner workings of `ES6` will let you build modern applications
    and give you access to a more powerful language and help you improve your programming
    skills.


    Through `ES6`, you will have access to more powerful programming concepts like
    practical object oriented code among other new features that were simply not possible
    in the past. We hope to introduce you a modern workflow and tools like `Babel`
    and `Webpack` to make application development faster and more enjoyable. You will
    then be able to measure code quality and write more testable JavaScript.


    # New Syntax in ES6


    The new features introduced in `ECMAScript 6` represent the foundation upon which
    JavaScript applications will be built in the future. In this chapter we will take
    a look at the changes and new additions to the `ES6` syntax that help in fixing
    a lot of things that went wrong with the previous versions of JavaScript. We will
    discuss in detail about new ways of declaring variables and defining scope. We
    will also introduce new concepts like arrow functions, default function parameters,
    spread and rest operators, and object literal extensions.


    ## Variable Declarations: let, const, and Block Scoping


    In the past, all variables in JavaScript were declared using the keyword `var`.
    These variables were function scoped, meaning their scope was within the function
    enclosing them, and this could sometimes be confusing to developers coming from
    other languages. So, if you needed to create a new block with its own scope, you
    would have to wrap your desired code inside a regular function or an immediately
    invoked function expression.


    Following is an example of regular function level scopes:


    ```

    var price = 10; // Global Declaration

    function showPrice() {

    var price = 12; // Local Declaration using var

    console.log(price); // 12

    }

    showPrice();

    console.log(price); // 10

    ```


    Following is an example of function level scopes with IIFE:


    ```

    var price = 10; // Global Declaration

    (function () {

    var price = 12; // Local Declaration using var

    console.log(price); // 12

    })();

    console.log(price); // 10

    ```


    The above code demonstrates that the variable `price` is now scoped to the enclosing
    function and the changes are not leaked to the parent scope, in this case global
    scope. The new value `price = 12` is only available inside the enclosing function
    scope.


    If we replace the function scope with a block scope ( ‘if’ block), it looks like
    this:


    ```

    var price = 10;

    if (price) {

    price = 12;

    console.log(price); // 12

    }

    console.log(price); // 12

    ```


    The above code makes it clear that the changes inside the ‘if’ block are leaked
    to the parent scope, which tells us that the `var` declarations are bound to the
    function scope and does not create block scopes.


    Prior to `ES6`, JavaScript used functional scoping, but block scoping is more
    common than functional scoping across most programming languages. With `ES6`,
    we now have two additional ways for declaring variables, `let` and `const`, both
    of which declare variables that are block scoped.'
