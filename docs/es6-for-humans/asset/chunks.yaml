    ### 使用 `let` 和 `const` 进行块级作用域


    简单来说，块级作用域是指在一对 `{ }` 之间创建了一个新的作用域。使用关键字 `let` 和 `const` 声明的变量只存在于包裹它们的最内层块中。


    在下面的示例中，你认为执行这段代码片段时控制台会打印什么？


    ```

    let nbr = 42;

    {

    let nbr = 1000;

    }

    console.log(nbr);

    ```


    控制台会打印值 `42`，因为第二个 `nbr` 变量的作用域限定在其声明的块内部，不会影响块外部的 `nbr` 变量，外部变量仍为 `42`。通常，你不会这样使用一个块，除非它位于像
    `if` 条件或循环这样的控制流语句中，但这解释了变量如何实现块级作用域。


    我们现在知道，`var` 受函数作用域约束，而 `let` 和 `const` 则是块级作用域。这意味着如果你有一组花括号（一个代码块），你就有一个块级作用域。但需要注意的是，在每个块级作用域中，你只能声明一次变量。


    另一方面，与 `let` 不同，`const` 创建的是不可变的变量。使用 `const` 创建的变量必须在声明时赋值，并且之后在程序中不能更改。


    请看下面的例子：


    ```

    const value = 42;

    console.log(value);   // 42

    value = 1000;         // TypeError

    ```


    **注意**


    尝试更改 `const` 变量的值会抛出 `TypeError`。在严格模式下更改不可变绑定只会引发异常 `SetMutableBinding()`。


    请确保始终为使用 `const` 声明的变量初始化一个值；否则会抛出错误。请看下面的例子：


    ```

    const item;  // SyntaxError: Missing initializer in const declaration

    ```


    如果你需要一个值为 `undefined` 的常量，你仍然需要这样做：


    ```

    const value = undefined;

    ```


    如果你知道变量的值在整个代码中不会改变，你应该使用 `const`；否则使用 `let` 来声明变量。我们建议摒弃使用 `var` 声明变量的做法，因为如果你使用块级作用域，代码会更清晰、更高效，并且易于调试。`let`
    和 `const` 避免了误解的来源，尤其是对于习惯了具有块级作用域语言的程序员来说。如果你试图在声明变量的块外部访问由 `let` 和 `const` 声明的变量，它们会抛出异常，并且不会发生提升，这有助于你限定代码片段的影响范围。


    请参考以下示例，理解提升如何影响使用关键字 `var` 声明的变量：


    ```

    console.log(nbr);  // undefined

    var nbr = 42;

    ```


    由于提升，上述例子会在控制台打印 `undefined`。当我们使用 `var` 声明变量 `nbr` 时，由于提升，这等同于在作用域的开头声明该变量，并将其值设置为
    `undefined`。但是，如果你将 `console.log` 语句移动到声明之后，它会打印数字 `42`，这是因为进入使用 `var` 声明的变量的作用域（即其外围函数）会创建一个绑定。然后通过将值设置为
    `undefined` 来初始化该变量。当执行到达声明处时，该变量会被设置为赋值语句中指定的值。


    让我们看一个使用 `let` 的类似例子：


    ```

    console.log(nbr); // Reference Error: nbr is not defined

    let nbr = 42;

    ```


    这实际上会给你一个 `Reference Error: nbr is not defined`，因为这里没有发生提升。这有助于调试由变量在声明之前被使用引起的各种类型的错误。这种
    `Reference Error` 在技术上被称为暂时性死区（TDZ）错误，因为你正在访问一个已声明但尚未初始化的变量。


    ### 关于暂时性死区的更多内容


    本讨论的主要收获是，`let` 和 `const` 声明的变量具有暂时性死区（TDZ），这与使用 `var` 时发生的提升形成对比。暂时性死区中的变量尚未用任何值初始化。当变量被声明时，会创建一个内存绑定，但保持未初始化状态。此时尝试获取或设置该变量会引发
    `Reference Error`。当程序流到达声明处时，该变量会被设置为语句中指定的值；如果语句中没有赋值，则设置为 `undefined`。


    `const` 的工作方式类似，唯一的区别是它需要在声明时提供一个初始值，该值之后不能更改。


    ```

    let data = true;

    if (true) { // 进入新作用域，TDZ 开始

    // 为 "data" 创建未初始化的绑定

    console.log(data); // ReferenceError

    let data; // TDZ 结束，"data" 被初始化为 "undefined"

    }

    console.log(data); // true

    ```


    一旦通过给变量赋值完成初始化，TDZ 就结束了。


    暂时性死区的主要目的是捕获错误。你不应该能在声明变量之前访问它，即使你意外访问了，也应该得到警告。TDZ 是让 `const` 按现有方式工作的最佳解决方案，而让
    `let` 也拥有 TDZ 使得在两者之间切换非常容易。TDZ 帮助我们确保变量在运行时始终具有正确的值。


    ```

    if (true) {

    console.log(typeof anUndeclaredVariable); // ''undefined''

    console.log(typeof random); // ReferenceError (TDZ)

    let random;

    }

    ```


    即使你尝试使用 `typeof` 访问暂时性死区中的变量，也会得到异常。`typeof` 是检查变量是否存在的安全方法。但如果一个变量稍后使用 `let`
    在代码中声明，那么当你调用 `typeof` 时，它会抛出一个 TDZ 错误，因为该变量正处于暂时性死区中。因此，一个良好的实践是始终将变量声明放在作用域的顶部。这项检查对于使用
    `var` 有条件地创建全局变量也很有用。你可以通过以下方式检查全局变量是否存在：


    ```

    if (typeof globalVariable === ''undefined'') {

    var globalVariable = { ··· };

    }

    ```


    **注意**


    `const` 用于声明一个不可变的变量，但这并不会使变量中包含的值变成不可变的。


    在以下代码片段中，`obj` 是一个常量，但它所指向的值是可变的；因此你可以向其添加属性，但无法为 `obj` 赋另一个值。


    ```

    const obj = {};

    obj.key = 42;

    console.log(obj.key); // 42

    obj = {}; // TypeError

    ```


    如果你愿意，可以通过冻结来使值本身变成不可变的。


    ```

    const obj = Object.freeze({});

    obj.key = 42;

    console.log(obj);   // {}

    ```


    请记住，`Object.freeze()` 是浅层冻结。它只会冻结传递给它的对象的直接属性。只有对象的第一层属性变得不可变，而存储在其属性中的对象则不会。

