- fmt: "仔细观察这个例子。这种模式看起来可能很直接：左侧从右侧的对象表示法`{ a: foo, b: bar, c: baz }`中获取值。但实际上它是相反的。它并不是我们通常习惯的“目标：源”模式，而更准确地说是其逆模式，即“源：目标”模式。为什么会这样令人困惑呢？如果你换个角度看，这个模式会更有意义。考虑以下赋值语句：\n\
    \n```\nvar foo = 42, bar = 100;\nvar obj = { a: foo, b: bar };\nvar { a: FOO,\
    \ b: BAR } = obj;\nconsole.log( FOO, BAR );              // 42 100\n```\n\n在这个例子中，`a`和`b`指的是对象的属性，而在对象解构赋值语句中，`a`和`b`同样代表对象属性。回想一下之前在简化代码的例子中，我们提到可以省略`a:`部分，正是这个原因。在这个例子中，如果你去掉语法中的`a:`和`b:`部分，你将只剩下`FOO`和`BAR`。这种语法有时会令人困惑，但如果你将其理解为相应的属性名和值彼此映射，就很容易掌握了：在这个例子中，`foo`被赋值给`FOO`，`bar`被赋值给`BAR`，使用的就是`a`和`b`属性名。\n\
    \n使用对象解构，你实际上可以通过同一个属性值来设置多个变量的值。考虑以下示例：\n\n```\nvar { x: foo, x: bar } = { x:\
    \ 42 };\nconsole.log( foo );  // 42\nconsole.log( bar );  // 42\n```\n\n在这种情况下，`foo`和`bar`都通过对象的`x`属性获取其值。\n\
    \n在解构声明语句中，你可以根据情况和需求自由使用`let`、`const`或`var`。但请确保语句中始终存在赋值操作，即语句的右侧是必需的。\n\n```\n\
    var { x, y };         // syntax error!\nlet { x, y };         // syntax error!\n\
    const { x, y };       // syntax error!\n```\n\n以上所有声明都会导致语法错误，因为解构声明中缺少初始化器。虽然我们知道`const`在所有情况下都需要初始化器，但使用解构时，`var`和`let`也需要初始化器。\n\
    \n### 使用解构进行赋值\n\n到目前为止，在我们的讨论中，我们只看到了使用解构声明语句的情况。但解构也可以用于赋值语句。考虑以下使用之前例子中的`getChars()`和`getNumbers()`函数的示例：\n\
    \n```\nvar a, b, c, x, y, z;\n[x, y ,z] = getChars();\n( { a, b, c } = getNumbers()\
    \ );\nconsole.log( x, y, z );             // a b c\nconsole.log( a, b, c );  \
    \           // 1 2 3\n```\n\n在这个例子中，`x`、`y`、`z`、`a`、`b`和`c`在声明后都通过解构进行了赋值。\n\n\
    > **注意**\n> \n> 你必须始终在对象解构赋值语句周围加上括号。这是因为左花括号用于表示块语句的开始。周围的括号则表示该花括号应被解释为在赋值语句中使用解构的表达式。\n\
    \n你也可以在变量通过解构赋值后更改它们的值。考虑以下示例：\n\n```\nlet item = {\nname: \"Apples\",\nquantity:\
    \ 5\n},\nname = \"Oranges\",\nquantity = 3;\n// assigning different values using\
    \ destructuring\n({ name, quantity } = item);\nconsole.log(name);          //\
    \ \"Apples\"\nconsole.log(quantity);      // 5\n```\n\n在这个例子中，`name`、`quantity`和`item`在一个声明语句中初始化了值。然后，`name`和`quantity`通过从`item`中解构获取值而被赋予了新值。\n\
    \n## 默认值\n\n当使用解构从没有相应属性名的对象中给变量赋值时，该变量的值会被设置为`undefined`。例如：\n\n```\nvar item\
    \ = {\nname: \"Apples\",\nquantity: 5\n};\nvar { name, quantity, value } = item;\n\
    console.log(name);           // \"Apples\"\nconsole.log(quantity);       // 5\n\
    console.log(value);          // undefined\n```\n\n在这个例子中，一个额外的变量`value`在`item`中没有对应的属性，它被声明在解构语句中。当`name`和`quantity`从`item`获取各自的值时，`value`被设置为`undefined`。\n\
    \n此外，与其让额外的变量值为`undefined`，你也可以选择在指定属性缺失的情况下为其定义一个默认值。为此，只需在属性名后面使用等号`=`并指定一个默认值，如下所示：\n\
    \n```\nvar item = {\nname: \"Apples\",\nquantity: 5\n};\nvar { name = \"Oranges\"\
    , quantity = 3, value = 25 } = item;\nconsole.log(name);          // \"Apples\"\
    \nconsole.log(quantity);      // 5\nconsole.log(value);         // 25\n```\n\n\
    在这个例子中，变量`quantity`和`value`分别被赋予了默认值`3`和`25`。由于没有`item.value`属性，变量`value`使用了其默认值`25`。这与我们之前章节中看到的函数默认参数值的工作方式类似。\n\
    \n> **注意**\n> \n> 只有在`item`中缺少某个属性时，默认值（如果未指定则为`undefined`）才会被赋给该变量。\n\n你也可以在长格式的解构赋值语句中使用默认值。但此时代码可能会变得混乱且有些令人困惑。考虑以下示例：\n\
    \n```\nvar { a, b, c: c = 3, d: FOO = 42 } = {a: 1, b: 2};\nconsole.log( a, b,\
    \ c, FOO );     // 1 2 3 42\n```\n\n在这种情况下，变量`a`和`b`被声明并设置为右侧对象字面量中它们对应的属性值，但由于对象中不存在属性`c`，其值被设置为默认值`3`。声明的变量`FOO`也被设置为其默认值`42`，因为对象中不存在对应的属性`d`。这里你需要记住我们之前讨论的“目标：源”语法，这有时会导致混淆。因此，除非绝对必要，否则最好避免这种混合的编码风格。\n\
    \n另一个建议是，避免在解构语句中使用对象或数组作为默认值。这同样会导致任何阅读你代码的人（包括你自己）感到困惑。请看下面的例子：\n\n```\nvar\
    \ a = 1, b = 2, c = 3;\nvar obj = { a: { b: 42 }, c: { b: c } };\n( { b: a = {\
    \ b: b } } = obj );\n( { c: b = { b: c } } = obj );\n( { a: c = { b: a } } = obj\
    \ );\nconsole.log( a.b, b.b, c.b );\n```\n\n尝试猜测`console.log`语句的输出会是什么。如果你猜出是`\"\
    2 3 42\"`，那完全正确。但你明白为什么这会令人困惑了。\n\n## 嵌套解构\n\n解构语法，与对象字面量语法非常相似，可用于导航到嵌套对象内部以检索信息。如果你解构的值包含嵌套的对象或数组，你也可以解构这些嵌套的值。这里有一个例子：\n\
    \n```\nlet items = {\ncount : 2,\nname: \"fruits\",\napple: {\nquantity: 5,\n\
    value: 25\n},\norange: {\nquantity: 3,\nvalue: 5\n}\n};\nlet { apple: { quantity\
    \ }} = items;\nconsole.log(quantity);        // 5\n```\n\n这里的花括号用于表示我们需要首先深入到`items`对象内部的`apple`属性一级，然后获取`quantity`属性。根据我们之前的讨论，我们知道`':'`之前的标识符表示我们需要去的位置，而右侧则进行赋值。如果冒号后面跟着一个花括号，则表示目标位于对象的下一个嵌套深度层级，以此类推。\n\
    \n由于空的花括号在对象解构中是合法的，你在使用嵌套解构时必须非常小心。考虑以下示例："
  raw: 'Observe this example closely. The pattern may seem very straightforward where
    the left side gets the values from the right side inside the object notation `{
    a: foo, b: bar, c: baz }`. But it is actually the other way around. It is not
    the “target: source” pattern we are commonly used to, but more accurately it is
    the inverse, that is, the “source: target” pattern. Why this confusion though?
    This pattern will make more sense if you look at it in a different way. Consider
    the following assignment:


    ```

    var foo = 42, bar = 100;

    var obj = { a: foo, b: bar };

    var { a: FOO, b: BAR } = obj;

    console.log( FOO, BAR );              // 42 100

    ```


    In this example, `a` and `b` refer to the properties of the object and in the
    object destructuring assignment statement, `a` and `b` also represent the object
    properties. Remember how in a previous example where we shortened the code, we
    said we could leave out the `a:` part. It is precisely for this reason. In this
    example, if you get rid of the `a:` and `b:` sections of the syntax, you will
    be left with `FOO` and `BAR`. This syntax can sometimes be confusing, but it can
    be simple to grasp it,\ if you think of it as corresponding property names and
    values being mapped to each other: in this case `foo` get assigned to `FOO` and
    `bar` to `BAR` using the `a` and `b` property names.


    Using Object Destructuring, you can actually set the value of multiple variables
    using the same property value. Consider the following example:


    ```

    var { x: foo, x: bar } = { x: 42 };

    console.log( foo );  // 42

    console.log( bar );  // 42

    ```


    In this case both `foo` and `bar` get their value using the `x` property of the
    object.


    You are free to use `let`, `const,` or `var` depending on the situation and requirement
    in a destructuring declaration statement. But be sure to always have an assignment
    in the statement, that is, a right-hand side is required for the statement.


    ```

    var { x, y };         // syntax error!

    let { x, y };         // syntax error!

    const { x, y };       // syntax error!

    ```


    All of the above declarations result in a syntax error because of a missing initializer
    in the destructuring declaration. While we know that `const` requires an initializer
    in all cases, when using destructuring `var` and `let, they` also require initializers.


    ### Assignment Using Destructuring


    So far in our discussion we have only seen cases where we use destructuring declarations
    statements. But destructuring can also be used in assignment statements. Consider
    the following example using `getChars()` and `getNumbers()` functions from the
    previous examples,


    ```

    var a, b, c, x, y, z;

    [x, y ,z] = getChars();

    ( { a, b, c } = getNumbers() );

    console.log( x, y, z );             // a b c

    console.log( a, b, c );             // 1 2 3

    ```


    In this example the `x, y, z, a, b,` and `c` are all assigned using destructuring
    after they are declared.


    Note


    You must always use parentheses around an object destructuring assignment statement.
    This is because an opening curly brace is used to denote the start of a block
    statement. The parentheses around it denote that the curly brace should be interpreted
    as an expression used in an assignment statement using destructuring.


    You can also change the values of variables after they are assigned using destructuring.
    Consider the following example,


    ```

    let item = {

    name: "Apples",

    quantity: 5

    },

    name = "Oranges",

    quantity = 3;

    // assigning different values using destructuring

    ({ name, quantity } = item);

    console.log(name);          // "Apples"

    console.log(quantity);      // 5

    ```


    In this example, `name`, `quantity,` and `item` are initialized with values in
    a single declaration statement. Then `name` and `quantity` are assigned new values
    by fetching values from item using destructuring.


    ## Default Values


    When using destructuring to assign a value to a variable using an object that
    does not have the corresponding property name, its value is set to `undefined`.
    For example:


    ```

    var item = {

    name: "Apples",

    quantity: 5

    };

    var { name, quantity, value } = item;

    console.log(name);           // "Apples"

    console.log(quantity);       // 5

    console.log(value);          // undefined

    ```


    In this example, an extra variable value that does not have a corresponding property
    inside `item` is declared in the destructuring statement. It gets set to `undefined`
    while `name` and `quantity` get their respective values from `item`.


    Additionally, instead of giving the extra variables a value of `undefined`, you
    can also choose to define a default value in case of the absence of the specified
    property. To do so, just use an equals sign `(=)` after the property name and
    specify a default value, like this:


    ```

    var item = {

    name: "Apples",

    quantity: 5

    };

    var { name = "Oranges", quantity = 3, value = 25 } = item;

    console.log(name);          // "Apples"

    console.log(quantity);      // 5

    console.log(value);         // 25

    ```


    In this example, the variables `quantity` and `value` are given 3 and 25 as their
    default values respectively. Since there is no `item.value` property, the variable
    `value` uses its default value 25\. This works similarly to the default parameter
    values for functions that we saw in the previous chapter.


    Note


    The default value (or `undefined` if not specified) will only be assigned to the
    variable in case of a missing property in the item.


    You can also use default values in the long form of a destructuring assignment
    statement. But at this point the code can start getting dirty and a little confusing.
    Consider the following example:


    ```

    var { a, b, c: c = 3, d: FOO = 42 } = {a: 1, b: 2};

    console.log( a, b, c, FOO );     // 1 2 3 42

    ```


    In this case, the variables `a` and `b` are declared and set to their corresponding
    property values from the object literal on the right-hand side, but since the
    property `c` does not exist in this object, its value is set to the default value
    of `3`. The declared variable `FOO` is also set to its default value `42` since
    the corresponding property `d` is not present in the object. Here is where you
    need to remember the “target:source” syntax we discussed above, which can sometimes
    lead to confusion. So it might be best to avoid this mixed coding style unless
    absolutely necessary.


    Another suggestion we have is to avoid using an object or array as the default
    value inside a destructuring statement. This also can lead to confusion for anyone
    reading your code, including yourself. Take a look at the following example:


    ```

    var a = 1, b = 2, c = 3;

    var obj = { a: { b: 42 }, c: { b: c } };

    ( { b: a = { b: b } } = obj );

    ( { c: b = { b: c } } = obj );

    ( { a: c = { b: a } } = obj );

    console.log( a.b, b.b, c.b );

    ```


    Try guessing what would be the output of the `console.log` statement. Full credit
    to you if you guessed `"2 3 42."` But you get the idea why this can be confusing.


    ## Nested Destructuring


    The destructuring syntax, very much like the Object Literal syntax, can be used
    to navigate inside nested objects to retrieve information. If the values you''re
    destructuring have nested objects or arrays, you can destructure those nested
    values as well. Here’s an example:


    ```

    let items = {

    count : 2,

    name: "fruits",

    apple: {

    quantity: 5,

    value: 25

    },

    orange: {

    quantity: 3,

    value: 5

    }

    };

    let { apple: { quantity }} = items;

    console.log(quantity);        // 5

    ```


    Curly braces here are used to denote that we have to first go down one level to
    the `apple` property inside the items object and then fetch the property `quantity`.
    From our previous discussion, we know that the identifier before the `‘:’` denotes
    the location we need to go to and the right side assigns a value. If a curly brace
    is present after the colon, it denotes that the destination is nested in the next
    depth level of the object and so on.


    Since empty curly braces can be legal in object destructuring, you have to be
    very careful while using nested destructuring. Consider the following example:'
