- fmt: '# Variables Declarations in loops


    `for` loops (`for`, `for-in`, `for-of`) let you declare variables in their heads.
    But the way you declare these variables using `var`, `let`, or `const` changes
    things. Let’s look at each of these cases.


    In a basic `for`-loop, using `var` creates a single binding for that variable:


    ```

    let arr = [];

    for (var i=0; i < 3; i++) {

    arr.push(function () { return i });

    }

    let value = arr[0]();

    console.log(value); // 3

    ```


    You might have expected the output to be 0, but the output is 3 because a closure
    gets formed over the variable `i` at the end of the loop. `i` is set to 3 and
    each instance of `i` in the body refers to the same binding. Therefore, the function
    always returns 3. Now let’s take a look at the case where `i` is declared using
    `let`:


    ```

    let arr = [];

    for (let i=0; i < 3; i++) {

    arr.push(function () { return i });

    }

    let value = arr[0]();

    console.log(value); // 0

    ```


    When we use `let` in a `for`-loop, each iteration of the loop will get its own
    `i` variable and any closures created close over their own value of `i`.


    In the case of `const`, it works similar to `var` because the initial assigned
    value to a `const` variable will not change again.


    ```

    for (const i=0; i<3; i++) {

    console.log(i);

    }

    // TypeError: Assignment to constant variable (due to i++)

    ```


    ## Variable Declarations with Function Parameters and Global Scope


    If you declare a variable using `let` inside a function, having the same name
    as a parameter, ES6 will throw a static (load-time) error.


    ```

    function fn(param) {

    let param; // SyntaxError: Identifier ''param'' has already been declared

    }

    ```


    Doing the same with a `var` does nothing, because it is just equivalent to re-declaring
    a variable. Another way of fixing this issue would be using a `let` inside a block,
    but the new variable declared will only shadow the parameter:


    ```

    function fn(param) {

    {

    let param;

    }

    }

    ```


    The global object in JavaScript (`window` in browsers and `global` in Node.js)
    has always been confusing. That’s why in ES6 a distinction was introduced. Consider
    the following example:


    ```

    let notGlobal = "hello";

    var isGlobal = "what up";

    { console.log(notGlobal); } // hello

    { console.log(isGlobal); } // what up

    global.isGlobal //''what up''

    global.notGlobal // undefined

    ```


    All properties of the global objects are global variables. Therefore, in the global
    scope `var` declarations and function declarations create such properties. But
    global variables created using `let` and `const` declarations will not be properties
    of the global object.


    # Arrow Functions


    Arrow Functions are another major syntax update in ES6. Arrow functions are functions
    defined using a new syntax, the “fat” arrow `=>`. The arrow is based on a similar
    concept from CoffeeScript. They help in making code more readable by opting out
    of the `function` and `return` syntax and read the same way the function executes.
    In this section, we will discuss in detail about how arrow functions are used
    and when it makes sense to use them.


    The basic syntax of an arrow function is as follows:


    ```

    var fn = data => data;

    ```


    The first part of the left-hand side of the assignment statement is the argument
    that is provided to the function. If there is only one argument, you do not need
    any additional syntax. The next part is the arrow and then the expression that
    is to be returned. In this case it just returns the argument. The function is
    effectively equivalent to:


    ```

    var fn = function(data) {

    return data;

    };

    ```


    Consider another example:


    ```

    let getNumber = () => 42;

    console.log(typeof getNumber); // function

    console.log(getNumber()); // 42

    ```


    In the code above, we declare a new function called `getNumber` and assign it
    using an arrow function. The empty parentheses `()` denotes that the function
    has no parameters and finally, the function returns the value 42. In arrow functions,
    we can leave out the `return` keyword. The expression specified after the arrow
    will get returned as long as it is not wrapped in `{ }`.


    ```

    var getPrice = (quantity, tax) => (quantity * 5) * (1 + tax);

    console.log(getPrice(2, .095)); //  10.95

    ```


    Note that you can skip the parentheses `()` in case of exactly one parameter,
    but you will always need to use it when you have zero or more than one parameter.


    If you want to specify a more traditional function block with more than one expression
    you need to wrap the body in braces. But you would specifically need to use the
    `return` keyword to specify the return value. Check the following code snippet
    for an example:


    ```

    var getPrice = (quantity, tax) => {

    let price = (quantity * 5)

    price *= (1 + tax);

    return price;

    }

    console.log(getPrice(2, .095)); //  10.95

    ```


    Curly braces represent the function’s body. If you want the arrow function to
    return an object literal outside the body, you must wrap the literal in parentheses.
    For example:


    ```

    var getNumber = data => ({ data: "check", number: 42 });

    // effectively equivalent to:

    var getNumber = function(data) {

    return {

    data: "check",

    number: 42

    };

    };

    ```


    An object literal wrapped in parentheses shows that the braces are an object literal
    instead of the function body.


    ## Using Arrow Functions to Create IIFEs


    Functions in JavaScript can be used to create immediately invoked function expressions
    or IIFEs. You could define an anonymous function and call it without having any
    reference to it. This is an effective pattern to shield the expression from the
    rest of the program.


    ```

    var fn = function(number) {

    return {

    getNumber: function() {

    return number;

    }

    };

    }(42);

    console.log(fn.getNumber());      // 42

    ```


    In the code above, an IIFE is used to create the `getNumber()` method, which uses
    the `number` argument as a return value, ensuring the `number` property is effectively
    a private member of the returned object. Something very similar can be achieved
    using an arrow function as well by wrapping it in parentheses.


    ```

    var fn = ((number) => {

    return {

    getNumber: function() {

    return number;

    }

    };

    })(42);

    console.log(fn.getNumber());      // 42

    ```


    One distinction to note is that arrow functions are function expressions and are
    not function declarations. They are anonymous function expressions that have no
    named reference for the purposes of recursion or event binding or unbinding.


    There’s more to arrow functions than just the pretty and cleaner syntax. Arrow
    functions do save us a few lines of code and characters, but the real purpose
    of the arrow functions is to handle the `this` keyword within functions. `this`
    behaves differently inside an arrow function. But before we discuss that, in the
    next section let’s take a look at how the `this` keyword works in general.


    ## A Tale about this


    In JavaScript, `this` is the current execution context of a function. Let’s take
    a look at what it means in the following scenarios:


    ### 1. Function Invocation


    Invocation of the `getContext()` function in Chrome will print the `Window` object
    in the console. That’s because the context of the `getContext()` is `Window/Global
    object`. At the time `getContext()` is called, JavaScript automatically sets `this`
    as the `global` object, which in a browser is `Window`.


    ```

    function getContext() {

    console.log(this); // Global or Window

    }

    ```


    When `this` is used outside any `function` scope, it also refers to the `global`
    scope. Check the following code snippet:


    ```

    if (this === window) {

    console.log("this refers to the Global context");

    }

    ```


    **Note:** If you’re in strict mode (`"use strict"`), `this` would be `undefined`.'
