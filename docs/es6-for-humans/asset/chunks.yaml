    同样，自定义类也可以通过这种方式创建私有成员，使其仅能被类中定义的其他方法私有访问。动态创建的符号值可以保存到作用域内的类变量中，该类变量只能被类的内部方法访问，从而保护私有属性不被无意或随意发现。例如，请看以下代码片段：


    ```

    const age = Symbol("age");

    class Person {

    constructor(value) {

    this[age] = value;

    }

    getAge() {

    console.log(this[age]);

    }

    }

    const jack = new Person(23);

    console.log(jack);

    // Person {}

    console.log(jack.age);

    // undefined

    console.log(jack[Symbol("age")]);

    // undefined

    jack.getAge();

    // 23

    ```


    在这个例子中，我们有一个 `Person` 类，它使用符号创建了一个私有属性来存储人的年龄。从代码片段中可以看出，该属性是不可枚举的，因为它返回一个空对象，并且只能通过公开的
    `getAge()` 方法访问。由于符号总是唯一的，通过创建具有相同标签 `age` 的符号 `Symbol("age")` 来访问私有属性，只会创建一个新的唯一符号，而无法访问对象的所需属性。


    ## 符号与注册表


    到目前为止，我们已经讨论了局部符号以及如何通过获取引用访问它们。符号也可以放在一个全局注册表中，通过它可以在不同的上下文（称为领域）中访问。领域是代码片段存在的上下文，例如应用程序运行的页面、页面中的
    `<iframe>`，或包含全局变量和已加载模块的 web worker 上下文。


    符号拥有一项特殊能力，可以存在于整个运行时符号注册表中，你可以使用以下方法将符号添加到运行时符号注册表中：


    ```

    Symbol.for(key) 和 Symbol.keyFor(symbol)。

    ```


    ## Symbol.for(key)


    此方法在运行时符号注册表中查找具有给定键的现有符号。如果在全局注册表中存在具有该键的符号，则返回该符号。如果在注册表中未找到具有该键的符号，则会创建一个新符号。例如，考虑以下代码片段，其中第一次调用
    `Symbol.for(''myCar'')` 创建一个符号，将其添加到注册表并返回；第二次调用则返回同一个符号，因为该键已存在于运行时符号注册表中：


    ```

    Symbol.for(''myCar'') === Symbol.for(''myCar'')

    // true

    ```


    运行时全局注册表会跟踪所有使用 `Symbol.for(key)` 方法创建的符号，这些符号可以在不同的领域之间访问。例如，在网页中任何地方创建的符号也可以在
    iframe 的上下文中访问。查看以下代码片段（你可以在浏览器控制台中运行）：


    ```

    // 创建一个 iframe

    const frame = document.createElement(''iframe'');

    // 将 iframe 附加到 body

    document.body.appendChild(frame);

    console.log(Symbol.for(''temperature'') === frame.contentWindow.Symbol.for(''temperature''));

    // true

    ```


    在上面的示例中，来自网页上下文的全局符号与 iframe 中的全局符号完全相同，这表明使用 `Symbol.for(key)` 方法创建的符号可以在不同领域之间访问。


    ## Symbol.keyFor(symbol)


    `Symbol.keyFor(symbol)` 从全局符号注册表中检索与给定符号关联的键，该键是在将符号添加到注册表时关联的。如果在注册表中未找到该符号，则返回
    undefined。


    ```

    const symbol = Symbol.for(''myHouse'');

    console.log(Symbol.keyFor(symbol)); // myHouse

    const myCat = Symbol();

    Symbol.keyFor(myCat); // undefined

    ```


    ## 内置符号


    ES6 附带了一系列语言规范中预定义的符号，其中大部分暴露了 JavaScript 对象的一些元属性和行为。一些众所周知的符号如下：


    `Symbol.hasInstance` - 允许我们确定对象是否是构造函数的实例。它由 instanceof 运算符在内部调用。


    另一个是 `Symbol.iterator`，我们将在本书后面深入探讨。它保存对象的默认迭代器。数组、集合（Set）、映射（Map）和弱映射（WeakMap）在其结构中都有一个不可枚举的
    `[Symbol.iterator]` 属性。


    ## 总结


    符号是 ES6 中引入 JavaScript 的一种新的原始类型。当你想避免属性键的名称冲突时，它们非常有用，特别是在你不想冒险覆盖对象的原生属性的情况下。符号因其不可枚举性，通过创建受保护的属性提供优势，防止这些属性被轻易发现，因为你必须专门查找符号才能找到它们。


    # 7. 数组与集合


    到目前为止，我们已经涵盖了 ES6 提供的许多新的和改进的特性和功能。在本章中，我们将介绍数组和集合等数据类型的更多增强功能。ES6 为 JavaScript
    语言带来了许多新的静态属性和方法，扩展了内置原生对象和对象的功能。我们将探讨 Array 类型的扩展特性，以及一些现在已成为语言原生组件的新数据结构抽象。


    ## 数组与新方法


    多年来，许多流行的 JavaScript 库（如 Underscore 和 Lodash）都随着数组数据结构的发展而发展，数组是最常被扩展的特性之一。因此，随着时间的推移，语言对这些库中常见的数组功能提供内置支持变得越来越必要。在本节中，我们将介绍所有新的
    ES6 数组功能，并研究一些它们表现出色的用例。


    我们现在有了语言提供的几个新的静态方法和原型方法，可帮助你创建、操作、填充和过滤数组。首先，让我们看看静态方法：`Array.from()` 和 `Array.of()`，然后我们将探索
    ES6 中为数组引入的新原型方法。


    ### Array.from()


    在 ES6 之前，为了将类数组对象（例如 `arguments` 和 `NodeList`）转换为真正的数组，我们需要使用一些技巧，比如在 `arguments`
    或 `NodeList` 上调用 `Array.prototype.slice.call()` 来将对象转换为数组。考虑以下示例，其中 DOM 中存在一个元素列表：


    ```

    Apple

    Mango

    Orange

    Litchi

    Banana


    var listItems = document.querySelectorAll(''li'');

    // 将 NodeList 转换为数组

    listItems = Array.prototype.slice.call(listItems);

    // 在新转换的数组上使用数组方法

    listItems.map(item => { console.log(item.innerText) });

    // Apple

    // Mango

    // Orange

    // Litchi

    // Banana

    ```


    有了 ES6，我们现在有了一个更直接的解决方案，用于将像上例中描述的类数组对象转换为数组。新的 `Array.from` 静态方法允许我们从任何类数组或可迭代对象创建数组。不过，在继续之前，让我们清楚地理解我们所说的类数组对象具体是什么意思。这些就是具有
    length 属性或索引元素的对象。例如，考虑以下对象：


    ```

    const customers = {

    ''0'': ''matt'',

    ''1'': ''ian'',

    ''2'': ''mikhail'',

    ''3'': ''akia'',

    ''4'': ''vincent'',

    length: 5

    };

    ```


    现在，如果我们想把这个对象转换为数组，我们可以使用 `Array.from()` 语法像这样简单地实现：


    ```

    Array.from(customers).forEach(customer => {

    console.log(customer);

    });

    ```


    在这个例子中，我们只是将客户对象传递给了函数，而它就返回了一个由各个元素组成的数组。让我们看看具体的 `Array.from` 语法：


    ```

    Array.from(arrayLike[, mapFn[, thisArg]])

    ```

