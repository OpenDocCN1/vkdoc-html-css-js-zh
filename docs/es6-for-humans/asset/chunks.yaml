    \ for around $2010\n// New York to Auckland takes 40h 20m in Emirates airlines\
    \ for around $1904\n```\n\n在上面的例子中，`genFlights()`是一个生成器函数，它返回一个迭代器。在调用返回的迭代器的`next()`方法时，生成器执行到第一个`yield`语句，该语句调用了`getFlightDurations()`。`getFlightDurations()`是一个异步函数，它使用`setTimeout`将执行延迟\
    \ 1.2 秒，并在迭代器上调用`next()`方法，确保`flightDurations`能被正确赋值。`flightPrices`同理，当`getFlightPrices()`中再次调用`next()`方法时，输出结果会被打印到控制台。如果我们在这里没有使用`yield`，`flightDurations`和`flightPrices`只会被赋值为`undefined`，因为在赋值时函数本身返回了`undefined`。使用`yield`语句可以防止在`setTimeout`函数执行之前赋值。这就是生成器如何帮助我们编写阻塞式异步代码，使代码看起来更同步。\n\
    \n## 提前完成\n\n在本章前面，我们讨论了迭代器有两个可选方法：`return(...)`和`throw(...)`，它们在生成器上下文中具有很大相关性。一旦调用这些方法，它们会立即结束暂停生成器中的序列。例如，请看以下代码片段：\n\
    \n```javascript\nfunction *getFruits() {\n  yield \"apple\";\n  yield \"orange\"\
    ;\n  yield \"banana\";\n}\nconst fruitIterator = getFruits();\nconsole.log(fruitIterator.next());\
    \           // {value: 'apple', done: false}\nconsole.log(fruitIterator.return(\"\
    kiwi\"));  // {value: 'kiwi', done: true}\nconsole.log(fruitIterator.next());\
    \           // {value: undefined, done: true}\n```\n\n在上面的例子中，`return(\"kiwi\"\
    )`返回了传入的参数值`\"kiwi\"`并结束序列，因此`done`为`true`。这等同于在生成器函数中有一个返回值，不过你应该始终牢记，遍历从生成器获得的序列时，不包括`{\
    \ done: true }`所表示的值。例如，检查以下代码片段，我们正在遍历集合`fruitIterator`，它只包含在源生成器中调用`return()`方法之前\
    \ yield 出的元素：\n\n```javascript\nfunction *getFruits() {\n  yield \"apple\";\n\
    \  yield \"orange\";\n  yield \"banana\";\n  return \"kiwi\";\n  yield \"watermelon\"\
    ;\n}\nconst fruitIterator = getFruits();\nfor (let fruit of fruitIterator) {\n\
    \  console.log(fruit);\n}\n// apple\n// orange\n// banana\n```\n\n你也可以通过将代码包装在`try-finally`块中来避免序列立即终止，确保无论序列是提前完成还是`yield`语句耗尽，`finally`子句中的代码都会执行。这在序列结束后执行清理或关闭操作时非常有用。例如，请看以下代码片段：\n\
    \n```javascript\nfunction *getFruits() {\n  try {\n    yield \"apple\";\n    yield\
    \ \"orange\";\n    yield \"banana\";\n  }\n  finally {\n    console.log(\"You\
    \ must always eat a big watermelon\");\n    yield \"watermelon\";\n  }\n}\nconst\
    \ fruitIterator = getFruits();\nconsole.log(fruitIterator.next());\n// { value:\
    \ 'apple', done: false }\nconsole.log(fruitIterator.return(\"kiwi\"));\n// You\
    \ must always eat a big watermelon\n// { value: 'watermelon', done: false }\n\
    console.log(fruitIterator.next());\n// { value: 'kiwi', done: true }\nconsole.log(fruitIterator.next());\n\
    // { value: undefined, done: true }\n```\n\n在上面的例子中，一旦`finally`块中的表达式执行完毕，序列将以`value`为`'kiwi'`且`done`为`true`终止，其中`'kiwi'`是作为参数传递给`return(...)`方法的。\n\
    \n类似地，`throw(...)`也会停止生成器的执行，但它永远不会被自动调用。当您可能想要警告用户一些意外错误时，这个方法会很有用，利用`try-catch`块在生成器中启用错误处理。例如，请看以下代码片段：\n\
    \n```javascript\nfunction *getFruits() {\n  yield \"apple\";\n  yield \"orange\"\
    ;\n  yield \"spinach\";\n  yield \"watermelon\"\n}\nconst fruitIterator = getFruits();\n\
    for (let fruit of fruitIterator) {\n  try {\n    console.log(fruit);\n    if (fruit\
    \ === \"spinach\") {\n      fruitIterator.throw(\"Vegetable Found\");\n    }\n\
    \  }\n  catch (err) {\n    console.log(`Exception: ${err}`);\n  }\n}\n// apple\n\
    // orange\n// spinach\n// Exception: Vegetable Found\n```\n\n注意`\"watermelon\"\
    `从未从生成器 yield 出来，因为当`\"spinach\"`被返回时调用了`throw()`，从而停止了序列的执行。\n\n## 总结\n\nES6\
    \ 引入的迭代器和生成器提供了对集合中存储值的顺序访问，并允许我们自定义遍历这些值的方式。ES6 还引入了一组新的协议来定义迭代器和可迭代对象，称为迭代协议。在本章中，我们学习了如何使用独特的`Symbol.iterator`属性定义对象的默认迭代器。当在对象上提供`Symbol.iterator`时，该对象被视为可迭代对象。\n\
    \n在本章的后半部分，我们还学习了生成器函数，它由星号（*）字符和函数体中的一个或多个`yield`语句表示。它们是特殊类型的函数，可以在执行过程中暂停和恢复。\n\
    \n# 9. ES6 中的 Promise\n\n众所周知，JavaScript 在设计上是单线程的。在浏览器中，它使用事件处理来并发管理许多任务。JavaScript\
    \ 引擎管理一个事件队列，当事件发生时，会调用注册的处理函数。如果你有传统 JavaScript 的经验，那么你很清楚理解异步编程是正确使用 JavaScript\
    \ 的必备条件。使用异步的主要模式是通过回调函数。ES6 为标准 JavaScript 规范带来了一个新特性 —— Promise（一些新的和最新的 JS\
    \ 库和框架中已有的特性），它解决了回调（唯一的异步方法）中的许多重大问题。\n\n## Promise 概述\n"
- fmt: '在某些需要等待异步操作完成然后执行任务的情况下，JavaScript 严重依赖回调函数，允许代码执行绕过长时间运行的任务继续进行。您一定已经知道`setTimeout`、`XMLHttpRequest`以及所有基于浏览器的异步函数都是基于回调的。虽然这个概念在理论上简单易懂，但它可能导致一些非常令人困惑且难以理解的代码，尤其是在需要在回调之后进行回调（嵌套回调）的情况下，这通常被称为“回调地狱”。例如，考虑以下代码片段，其中必须先发生
    X，然后发生 Y，最后发生 Z：


    ```

    x = getData();

    y = getMoreData(x);

    z = getMoreData(y);

    ```


    在 ES6 之前，您可以异步获取`x`，然后将其作为参数传递给获取`y`的函数，对`z`也是如此，使用回调的方式如下：


    ```

    getData(function(x){

    getMoreData(x, function(y){

    getMoreData(y, function(z){

    ...

    });

    });

    });

    ```


    在实际应用中，当您有大量回调函数时，这可能会变得越来越复杂，从而形成回调金字塔。这些回调金字塔无处不在——在处理 HTTP 请求、数据库操作、动画、进程间通信以及其他各种场景中都会出现。通常，使用回调函数的代码会变得更难理解、重构和测试。


    这就是 Promise 的用武之地。Promise 为我们提供了一种更可控的模式来处理异步处理。它们代表了一个可以在未来某个时间点处理的值，并提供了一种摆脱回调地狱的方法。与基于回调的方法相比，Promise
    为执行、组合和管理异步操作提供了一种更简单的替代方案。它们还使得代码的逻辑流程更容易理解。


    ES6 原生支持 Promise。一个 Promise 是一个等待异步操作完成的对象，当该操作完成时，该 Promise 要么被兑现（fulfilled），要么被拒绝（rejected）。一个
    Promise 对象可以处于以下三种状态之一：


    *   `fulfilled` – 当 Promise 成功时

    *   `rejected` – 当 Promise 失败时

    *   `pending` – 当它既未兑现也未拒绝时


    一个待定（pending）的 Promise 可能会转换为兑现（fulfilled）或拒绝（rejected）状态，并且当 Promise 被兑现或拒绝时，它被认为已敲定（settled）。需要注意的是，一个已敲定的
    Promise 是不可变的，这意味着一旦 Promise 被敲定，就不能重新敲定。


    ## 创建 Promise


    Promise 是使用`new Promise()`构造函数创建的，该构造函数接受一个执行器（一个函数），该函数有两个参数：


    *   第一个参数（通常命名为`resolve`）是一个函数，当未来值就绪时，即 Promise 被兑现时，会调用该函数；

    *   第二个参数（通常命名为`reject`）是一个函数，如果它无法解决未来值，则调用该函数来拒绝 Promise。


    执行器启动一些异步工作，然后一旦完成，就调用`resolve`或`reject`函数来兑现 Promise，或者如果发生错误则拒绝它。


    一个简单的 Promise 如下所示：


    ```

    const p = new Promise((resolve, reject) => {

    if (/* some condition */) {

    resolve(/* some value */);  // fulfilled successfully

    } else {

    reject(/* some reason */);  // error, rejected

    }

    });

    ```


    第二个方法（`reject`）是可选的，您可以只使用`resolve`方法来创建 Promise，如下面的代码片段所示，其中 Promise 分别被兑现和拒绝：


    ```

    new Promise(resolve => resolve()) // promise is fulfilled

    new Promise((resolve, reject) => reject()) // promise is rejected

    ```


    您也可以使用以下方式创建一个立即兑现的 Promise：


    ```

    const sayHello = Promise.resolve("hello!");

    ```


    类似地，您也可以使用`Promise.reject(value)`来拒绝一个 Promise。不带值地兑现或拒绝 Promise 并不十分有用。通常，一个
    Promise 会兑现为某个值，该值可能是来自 HTTP 请求、动画或其他异步操作的结果。


    一旦创建，一个 Promise 只能被敲定，这意味着它要么被兑现，要么被拒绝。并且如上所述，由于已敲定的 Promise 是不可变的，因此已敲定的值或失败原因不能被更改（该值也可以是`undefined`）。然而，一个对象可以用作已兑现的值，并且对象的属性可能会发生改变。


    ### 使用`then()`和`catch()`消费 Promise


    一旦创建了 Promise，它可以作为一个值传递，本质上表示未来值的占位符。当 Promise 被兑现时，可以使用`.then()`方法来消费这个值。此方法接受一个函数，该函数将在
    Promise 被兑现时被传递已兑现的值。例如，考虑以下代码片段：


    ```

    const p = new Promise((resolve, reject) => resolve(42));

    p.then((val) => console.log(val)); // 42

    ```


    每个 Promise 都必须有一个`.then()`方法，它实际上接受两个可能的参数。第一个参数是 Promise 被兑现时要调用的函数，第二个参数是 Promise
    被拒绝时要调用的函数，如图 [9-1](#A431489_1_En_9_Chapter.html#Fig1) 所示。


    ![A431489_1_En_9_Fig1_HTML.gif](A431489_1_En_9_Fig1_HTML.gif)


    图 9-1.


    一个待定的 Promise 可以被兑现或拒绝，并使用`.then()`方法进行处理


    ```

    p.then((value) => { console.log("Promise Fulfilled:", value) },

    (error) => { console.log("Promise Rejected: ", error) });

    ```


    如果给定的 Promise 总是被解决，我们可以为了简单起见省略第二个参数。查看以下示例，其中顾客在订单下达五秒后收到他的披萨：


    ```

    const pizza = new Promise((resolve) => {

    console.log("Getting your pizza in 5 seconds...");

    setTimeout(() => {

    resolve("Onion Pizza");

    }, 5000);

    });

    pizza.then(

    (item) => { console.log(`Order Received: ${item}`) },

    (error) => { console.log("Something went wrong with your pizza") }

    );

    // Getting your pizza in 5 seconds...

    // Order Received: Onion Pizza

    ```


    此示例演示了两件事：


    *   首先，我们附加到 Promise 上的处理程序是在所有其他代码异步运行之后才被调用的。

    *   其次，兑现处理程序仅在 Promise 被兑现时被调用，并传入它被解决时的值（在我们的例子中，是洋葱披萨）。拒绝处理程序也是如此。


    这是另一个消费 Promise 的典型示例，其中`getRentalList(location)`是异步的，并使用返回 Promise 的 Web 服务返回给定位置当前可用的租赁房产列表：


    ```

    const housingPromise = getRentalList("London");

    housingPromise.then(

    (res) => {

    if (res.properties && res.properties.length > 0) {

    console.log(`We found the houses for you: ${res.properties}`);

    } else {

    console.log(`Sorry, no housing is available in ${res.location}`);

    }

    },

    (error) => {

    console.log(`Something went wrong: ${error}`);

    }

    );

    ```


    如果您只对拒绝 Promise 感兴趣，可以省略第一个参数并将其传递为`null`。例如，查看以下代码片段：


    ```

    const networkReq = new Promise((resolve, reject) => {

    reject("No Server Found");

    });

    networkReq.then(

    null,

    (error) => { console.log(error); }

    );

    ```


    一方面，如果处理程序在`.then()`调用中返回一个值，它会在返回时自动包装在一个 Promise 中。这些`.then()`调用可以被链式调用。我们将在下一节详细讨论
    Promise 链式调用的工作原理。另一方面，您也可以使用`catch()`方法以更紧凑的方式处理被拒绝的 Promise。例如，您可以重写上面的示例如下：


    ```

    networkReq.catch((error) => { console.log(error); });

    ```'
  raw: 'In cases where it is required to wait for an asynchronous operation to complete
    and then perform a task, JavaScript heavily relies on callbacks, allowing the
    code execution to proceed past the long-running task. You must already know that
    `setTimeout` , `XMLHttpRequest` , and all browser-based asynchronous functions
    are callback based. While the concept is simple and easy to understand in theory,
    it can lead to some really confusing and difficult-to-follow code, especially
    in cases when it is needed to make a callback after a callback (nested callbacks
    ), which is more often termed “Callback Hell.” Consider the following code snippet,
    for example, where X must happen before Y must happen before Z:


    ```

    x = getData();

    y = getMoreData(x);

    z = getMoreData(y);

    ```


    Prior to ES6, you could have asynchronously fetched x and then passed it as an
    argument to fetch y and similarly for z, using callbacks as follows:


    ```

    getData(function(x){

    getMoreData(x, function(y){

    getMoreData(y, function(z){

    ...

    });

    });

    });

    ```


    This can get more and more complex in real-life applications where you have lots
    of callback functions, which can lead to a callback pyramid. These callback pyramids
    appear everywhere – in handling HTTP requests, database manipulation, animation,
    interprocess communication, and all manners of other places. Generally, codes
    using callback functions can become harder to follow, refactor, and test.


    This is where promises come in. Promises give us a way to handle asynchronous
    processing in a more controlled pattern. They represent a value that can be handled
    at some point in the future, and offer an escape from the callback hell Promises
    provide a simpler alternative for executing, composing, and managing asynchronous
    operations in comparison to callback-based approaches. They also allow the logical
    flow of the code to be much easier to follow.


    ES6 has native support for promises. A promise is an object that is waiting for
    an asynchronous operation to complete, and when that operation completes, the
    promise is either fulfilled or rejected. A promise object can be any of these
    three states:


    *   fulfilled – when the promise succeeds

    *   rejected – when the promise fails

    *   pending – when it’s neither fulfilled or rejected


    A pending promise may transition into a fulfilled or rejected state, and the promise
    is considered to be settled when it’s either fulfilled or rejected. It is important
    to note a settled promise is immutable, which means that once a promise is settled,
    it cannot be resettled.


    ## Creating a Promise


    Promises are created using the new `Promise()` constructor that accepts an executor
    (a function) that takes two parameters:


    *   The first parameter (typically named resolve) is a function that is called
    with the future value when it''s ready, that is, when the promise is fulfilled;

    *   And the second parameter (typically named reject) is a function that is called
    to reject the promise if it can''t resolve the future value.


    The executor initiates some asynchronous work and then, once that completes, calls
    either the resolve or reject function to resolve the promise or else reject it
    if an error occurred.


    A simple Promise looks like this:


    ```

    const p = new Promise((resolve, reject) => {

    if (/* some condition */) {

    resolve(/* some value */);  // fulfilled successfully

    } else {

    reject(/* some reason */);  // error, rejected

    }

    });

    ```


    The second method (`reject`) is optional, and you can very well create a promise
    with only the resolve method, as demonstrated in the code snippet below where
    the promises are fulfilled and rejected, respectively:


    ```

    new Promise(resolve => resolve()) // promise is fulfilled

    new Promise((resolve, reject) => reject()) // promise is rejected

    ```


    You can also create an immediately resolved promise using:


    ```

    const sayHello = Promise.resolve("hello!");

    ```


    Similarly, you can also reject a promise using `Promise.reject(value)`. Resolving
    or rejecting a promise without a value isn’t very useful. Usually, a promise will
    resolve to some value that could be a result from an HTTP request, animation,
    or some other asynchronous operation.


    A promise, once created, can only be settled, meaning it can either be fulfilled
    or rejected. And as stated above, since a settled promise is immutable, the settled
    value or failure reason cannot be changed (the value can be `undefined` as well).
    However, an object may be used as the fulfilled value, and object properties may
    mutate.


    ### Consuming a Promise with `then()` and `catch()`


    Once a promise is created, it can be passed around as a value, essentially representing
    a placeholder for a future value. This value can be consumed when the promise
    is fulfilled using `.then()` method. This method takes a function that will be
    passed to the resolved value of the Promise once it is fulfilled. Consider the
    following code snippet, for example:


    ```

    const p = new Promise((resolve, reject) => resolve(42));

    p.then((val) => console.log(val)); // 42

    ```


    Every promise must have a .`then()` method that actually takes two possible parameters.
    The first parameter is the function to be called when the promise is fulfilled
    and the second parameter is a function to be called if the promise is rejected
    as depicted in Figure [9-1](#A431489_1_En_9_Chapter.html#Fig1).


    ![A431489_1_En_9_Fig1_HTML.gif](A431489_1_En_9_Fig1_HTML.gif)


    Figure 9-1.


    A pending promise can be fulfilled or rejected and handled using .then() method


    ```

    p.then((value) => { console.log("Promise Fulfilled:", value) },

    (error) => { console.log("Promise Rejected: ", error) });

    ```


    If a given promise always gets resolved, we can omit the second parameter for
    simplicity. Check out the following example where the customer gets his pizza
    five seconds after the order:


    ```

    const pizza = new Promise((resolve) => {

    console.log("Getting your pizza in 5 seconds...");

    setTimeout(() => {

    resolve("Onion Pizza");

    }, 5000);

    });

    pizza.then(

    (item) => { console.log(`Order Received: ${item}`) },

    (error) => { console.log("Something went wrong with your pizza") }

    );

    // Getting your pizza in 5 seconds...

    // Order Received: Onion Pizza

    ```


    This example demonstrates two things:


    *   First, that the handlers we attached to the promise were called after all
    other code ran, asynchronously.

    *   Second, that the fulfillment handler was called only when the promise was
    fulfilled, with the value it was resolved with (in our case, the onion pizza).
    The same holds true for the rejection handler.


    Here’s another typical example of consuming a promise, where `getRentalList(location)`
    is asynchronous and returns the list of currently available rental properties
    at the given location using a web service that returns a promise:


    ```

    const housingPromise = getRentalList("London");

    housingPromise.then(

    (res) => {

    if (res.properties && res.properties.length > 0) {

    console.log(`We found the houses for you: ${res.properties}`);

    } else {

    console.log(`Sorry, no housing is available in ${res.location}`);

    }

    },

    (error) => {

    console.log(`Something went wrong: ${error}`);

    }

    );

    ```


    If you’re only interested in rejecting a promise, you can omit the first parameter
    and pass it as null. Check the following code snippet, for example:


    ```

    const networkReq = new Promise((resolve, reject) => {

    reject("No Server Found");

    });

    networkReq.then(

    null,

    (error) => { console.log(error); }

    );

    ```


    On the one hand, if a handler returns a value in the a `.then()` call, it is automatically
    wrapped in a promise when returned. These .then() calls can be chained. We will
    get into the details of how the chaining of promises work in the next section.
    On the other hand, you can also handle a rejected promise in a more compact way
    using the `catch()` method. For instance, you can rewrite the above example as
    follows:


    ```

    networkReq.catch((error) => { console.log(error); });

    ```'
  trans: '

    在某些需要等待异步操作完成然后执行任务的情况下，JavaScript 严重依赖回调函数，允许代码执行绕过长时间运行的任务继续进行。您一定已经知道`setTimeout`、`XMLHttpRequest`以及所有基于浏览器的异步函数都是基于回调的。虽然这个概念在理论上简单易懂，但它可能导致一些非常令人困惑且难以理解的代码，尤其是在需要在回调之后进行回调（嵌套回调）的情况下，这通常被称为“回调地狱”。例如，考虑以下代码片段，其中必须先发生
    X，然后发生 Y，最后发生 Z：


    ```

    x = getData();

    y = getMoreData(x);

    z = getMoreData(y);

    ```


    在 ES6 之前，您可以异步获取`x`，然后将其作为参数传递给获取`y`的函数，对`z`也是如此，使用回调的方式如下：


    ```

    getData(function(x){

    getMoreData(x, function(y){

    getMoreData(y, function(z){

    ...

    });

    });

    });

    ```


    在实际应用中，当您有大量回调函数时，这可能会变得越来越复杂，从而形成回调金字塔。这些回调金字塔无处不在——在处理 HTTP 请求、数据库操作、动画、进程间通信以及其他各种场景中都会出现。通常，使用回调函数的代码会变得更难理解、重构和测试。


    这就是 Promise 的用武之地。Promise 为我们提供了一种更可控的模式来处理异步处理。它们代表了一个可以在未来某个时间点处理的值，并提供了一种摆脱回调地狱的方法。与基于回调的方法相比，Promise
    为执行、组合和管理异步操作提供了一种更简单的替代方案。它们还使得代码的逻辑流程更容易理解。


    ES6 原生支持 Promise。一个 Promise 是一个等待异步操作完成的对象，当该操作完成时，该 Promise 要么被兑现（fulfilled），要么被拒绝（rejected）。一个
    Promise 对象可以处于以下三种状态之一：


    *   `fulfilled` – 当 Promise 成功时

    *   `rejected` – 当 Promise 失败时

    *   `pending` – 当它既未兑现也未拒绝时


    一个待定（pending）的 Promise 可能会转换为兑现（fulfilled）或拒绝（rejected）状态，并且当 Promise 被兑现或拒绝时，它被认为已敲定（settled）。需要注意的是，一个已敲定的
    Promise 是不可变的，这意味着一旦 Promise 被敲定，就不能重新敲定。


    ## 创建 Promise


    Promise 是使用`new Promise()`构造函数创建的，该构造函数接受一个执行器（一个函数），该函数有两个参数：


    *   第一个参数（通常命名为`resolve`）是一个函数，当未来值就绪时，即 Promise 被兑现时，会调用该函数；

    *   第二个参数（通常命名为`reject`）是一个函数，如果它无法解决未来值，则调用该函数来拒绝 Promise。


    执行器启动一些异步工作，然后一旦完成，就调用`resolve`或`reject`函数来兑现 Promise，或者如果发生错误则拒绝它。


    一个简单的 Promise 如下所示：


    ```

    const p = new Promise((resolve, reject) => {

    if (/* some condition */) {

    resolve(/* some value */);  // fulfilled successfully

    } else {

    reject(/* some reason */);  // error, rejected

    }

    });

    ```


    第二个方法（`reject`）是可选的，您可以只使用`resolve`方法来创建 Promise，如下面的代码片段所示，其中 Promise 分别被兑现和拒绝：


    ```

    new Promise(resolve => resolve()) // promise is fulfilled

    new Promise((resolve, reject) => reject()) // promise is rejected

    ```


    您也可以使用以下方式创建一个立即兑现的 Promise：


    ```

    const sayHello = Promise.resolve("hello!");

    ```


    类似地，您也可以使用`Promise.reject(value)`来拒绝一个 Promise。不带值地兑现或拒绝 Promise 并不十分有用。通常，一个
    Promise 会兑现为某个值，该值可能是来自 HTTP 请求、动画或其他异步操作的结果。


    一旦创建，一个 Promise 只能被敲定，这意味着它要么被兑现，要么被拒绝。并且如上所述，由于已敲定的 Promise 是不可变的，因此已敲定的值或失败原因不能被更改（该值也可以是`undefined`）。然而，一个对象可以用作已兑现的值，并且对象的属性可能会发生改变。


    ### 使用`then()`和`catch()`消费 Promise


    一旦创建了 Promise，它可以作为一个值传递，本质上表示未来值的占位符。当 Promise 被兑现时，可以使用`.then()`方法来消费这个值。此方法接受一个函数，该函数将在
    Promise 被兑现时被传递已兑现的值。例如，考虑以下代码片段：


    ```

    const p = new Promise((resolve, reject) => resolve(42));

    p.then((val) => console.log(val)); // 42

    ```


    每个 Promise 都必须有一个`.then()`方法，它实际上接受两个可能的参数。第一个参数是 Promise 被兑现时要调用的函数，第二个参数是 Promise
    被拒绝时要调用的函数，如图 9-1 所示。


    ![A431489_1_En_9_Fig1_HTML.gif](img/A431489_1_En_9_Fig1_HTML.gif)


    图 9-1.


    一个待定的 Promise 可以被兑现或拒绝，并使用`.then()`方法进行处理


    ```

    p.then((value) => { console.log("Promise Fulfilled:", value) },

    (error) => { console.log("Promise Rejected: ", error) });

    ```


    如果给定的 Promise 总是被解决，我们可以为了简单起见省略第二个参数。查看以下示例，其中顾客在订单下达五秒后收到他的披萨：


    ```

    const pizza = new Promise((resolve) => {

    console.log("Getting your pizza in 5 seconds...");

    setTimeout(() => {

    resolve("Onion Pizza");

    }, 5000);

    });

    pizza.then(

    (item) => { console.log(`Order Received: ${item}`) },

    (error) => { console.log("Something went wrong with your pizza") }

    );

    // Getting your pizza in 5 seconds...

    // Order Received: Onion Pizza

    ```


    此示例演示了两件事：


    *   首先，我们附加到 Promise 上的处理程序是在所有其他代码异步运行之后才被调用的。

    *   其次，兑现处理程序仅在 Promise 被兑现时被调用，并传入它被解决时的值（在我们的例子中，是洋葱披萨）。拒绝处理程序也是如此。


    这是另一个消费 Promise 的典型示例，其中`getRentalList(location)`是异步的，并使用返回 Promise 的 Web 服务返回给定位置当前可用的租赁房产列表：


    ```

    const housingPromise = getRentalList("London");

    housingPromise.then(

    (res) => {

    if (res.properties && res.properties.length > 0) {

    console.log(`We found the houses for you: ${res.properties}`);

    } else {

    console.log(`Sorry, no housing is available in ${res.location}`);

    }

    },

    (error) => {

    console.log(`Something went wrong: ${error}`);

    }

    );

    ```


    如果您只对拒绝 Promise 感兴趣，可以省略第一个参数并将其传递为`null`。例如，查看以下代码片段：


    ```

    const networkReq = new Promise((resolve, reject) => {

    reject("No Server Found");

    });

    networkReq.then(

    null,

    (error) => { console.log(error); }

    );

    ```


    一方面，如果处理程序在`.then()`调用中返回一个值，它会在返回时自动包装在一个 Promise 中。这些`.then()`调用可以被链式调用。我们将在下一节详细讨论
    Promise 链式调用的工作原理。另一方面，您也可以使用`catch()`方法以更紧凑的方式处理被拒绝的 Promise。例如，您可以重写上面的示例如下：


    ```

    networkReq.catch((error) => { console.log(error); });

    ```

