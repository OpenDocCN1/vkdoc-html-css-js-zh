    \ Symbol 的值。除了在打印 Symbol 时用作描述该 Symbol 的字符串之外，它没有其他作用。当你对返回的 Symbol 调用 `.toString()`\
    \ 方法（该方法将 Symbol 转换为字符串）时，它也非常有用。当你将 Symbol 写入 `console.log()` 以及可能的错误消息时，该标签会显示出来。这对于调试目的非常有帮助。\n\
    \n请注意，你不应该使用 `new` 关键字来创建 Symbol。Symbol 没有对象构造函数；因此你不能使用 `new` 关键字创建 Symbol：\n\
    \n```javascript\nconst bar = new Symbol();           // 类型错误\n```\n\n如前所述，Symbol\
    \ 永远是唯一的，两个 Symbol 永远不可能相同。但是，你可以使用相同的标签创建多个 Symbol，但返回的 Symbol 始终是唯一的。查看以下代码片段示例：\n\
    \n```javascript\nconst kit = Symbol(\"你好\");\nconst kat = Symbol(\"你好\");\nconsole.log(kit\
    \ === kat);       // false\n```\n\n或者你可以简单地尝试：\n\n```javascript\nSymbol() !==\
    \ Symbol()         // true\n```\n\n因此，Symbol 永远是唯一的，并且在各种情况下都有其不可思议的用途。让我们在下一节中看看它们的应用。\n\
    \n### Symbol 的应用\n\n从本质上讲，Symbol 主要用作唯一的属性键，因为一个 Symbol 永远不会与对象的任何其他属性（Symbol\
    \ 或字符串）发生冲突，这在你不希望冒险覆盖对象的原生属性时非常有用。Symbol 也常用于为类或对象类型的内部使用创建匿名（或在某种程度上是私有的）属性。考虑以下示例，其中我们有一个名为\
    \ `Person` 的对象，它包含一些“公共”属性：\n\n```javascript\nlet Person = {\n    name: \"John\"\
