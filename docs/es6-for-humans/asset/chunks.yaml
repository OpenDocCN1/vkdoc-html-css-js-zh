    when passed in an array of two values `1 and 2` prints their sum `3`, but when
    passed only one value `1`, it outputs `1` due to the fact that `num2` has a default
    value of `0` assigned. When no value is passed to the destructured array, it prints
    `NaN` (Not a Number) because even though `num2` defaults to `0, num1` is set to
    `undefined`.


    When you need to provide a function with a large set of parameters, a common pattern
    is to create an object with properties specifying the parameters and passing the
    object into the function. But the problem with this pattern is the fact that it
    is incredibly hard to guess what input the function requires just by looking at
    the function definition. You will have to go over the body of the function to
    be able to understand the different inputs required by the function. Consider
    the following example where the function takes in an options object:


    ```

    function createObj(name, value, options) {

