- fmt: "在上面的例子中，第一次调用`next()`时，生成器yield出`\"I am a calculator\"`字符串然后暂停。第二次调用`next(2)`时，传入的值会被赋值给`num1`，因为在生成器内部，我们指定了在`yield\
    \ \"I am a calculator\"`处yield出的任何值都会赋值给`num1`，`num2`同理。因此，第三次调用`next()`时，`Sum\
    \ is: 5`被打印到控制台，并且由于没有更多的`yield`语句，`undefined`被作为值返回。\n\n生成器与代码良好通信的这种行为在异步编程场景中非常有用。生成器可以使你的异步代码看起来像同步代码。考虑另一个例子，演示生成器和异步代码如何良好协作：\n\
    \n```javascript\nfunction getFlightDurations() {\n  setTimeout(() => {\n    flightIterator.next({\n\
    \      Qatar: \"39h 0m\",\n      Emirates: \"40h 20m\"\n    });\n  }, 1200);\n\
    }\nfunction getFlightPrices() {\n  setTimeout(function(){\n    flightIterator.next({\n\
    \      Qatar: \"$2010\",\n      Emirates: \"$1904\"\n    })\n  }, 1000);\n}\n\
    function *getFlights() {\n  const allFlights = [\"Qatar\", \"Emirates\"];\n  const\
    \ flightDurations = yield getFlightDurations();\n  const flightPrices = yield\
    \ getFlightPrices();\n  for (let flight of allFlights) {\n    console.log(`New\
    \ York to Auckland takes ${flightDurations[flight]} in ${flight} airlines for\
    \ around ${flightPrices[flight]}`);\n  }\n}\nconst flightIterator = getFlights();\n\
    flightIterator.next();\n// New York to Auckland takes 39h 0m in Qatar airlines\
    \ for around $2010\n// New York to Auckland takes 40h 20m in Emirates airlines\
    \ for around $1904\n```\n\n在上面的例子中，`genFlights()`是一个生成器函数，它返回一个迭代器。在调用返回的迭代器的`next()`方法时，生成器执行到第一个`yield`语句，该语句调用了`getFlightDurations()`。`getFlightDurations()`是一个异步函数，它使用`setTimeout`将执行延迟1.2秒，并在迭代器上调用`next()`方法，确保`flightDurations`能被正确赋值。`flightPrices`同理，当`getFlightPrices()`中再次调用`next()`方法时，输出结果会被打印到控制台。如果我们在这里没有使用`yield`，`flightDurations`和`flightPrices`只会被赋值为`undefined`，因为在赋值时函数本身返回了`undefined`。使用`yield`语句可以防止在`setTimeout`函数执行之前赋值。这就是生成器如何帮助我们编写阻塞式异步代码，使代码看起来更同步。\n\
    \n## 提前完成\n\n在本章前面，我们讨论了迭代器有两个可选方法：`return(...)`和`throw(...)`，它们在生成器上下文中具有很大相关性。一旦调用这些方法，它们会立即结束暂停生成器中的序列。例如，请看以下代码片段：\n\
    \n```javascript\nfunction *getFruits() {\n  yield \"apple\";\n  yield \"orange\"\
    ;\n  yield \"banana\";\n}\nconst fruitIterator = getFruits();\nconsole.log(fruitIterator.next());\
    \           // {value: 'apple', done: false}\nconsole.log(fruitIterator.return(\"\
    kiwi\"));  // {value: 'kiwi', done: true}\nconsole.log(fruitIterator.next());\
    \           // {value: undefined, done: true}\n```\n\n在上面的例子中，`return(\"kiwi\"\
    )`返回了传入的参数值`\"kiwi\"`并结束序列，因此`done`为`true`。这等同于在生成器函数中有一个返回值，不过你应该始终牢记，遍历从生成器获得的序列时，不包括`{\
    \ done: true }`所表示的值。例如，检查以下代码片段，我们正在遍历集合`fruitIterator`，它只包含在源生成器中调用`return()`方法之前yield出的元素：\n\
    \n```javascript\nfunction *getFruits() {\n  yield \"apple\";\n  yield \"orange\"\
    ;\n  yield \"banana\";\n  return \"kiwi\";\n  yield \"watermelon\";\n}\nconst\
    \ fruitIterator = getFruits();\nfor (let fruit of fruitIterator) {\n  console.log(fruit);\n\
    }\n// apple\n// orange\n// banana\n```\n\n你也可以通过将代码包装在`try-finally`块中来避免序列立即终止，确保无论序列是提前完成还是`yield`语句耗尽，`finally`子句中的代码都会执行。这在序列结束后执行清理或关闭操作时非常有用。例如，请看以下代码片段：\n\
    \n```javascript\nfunction *getFruits() {\n  try {\n    yield \"apple\";\n    yield\
    \ \"orange\";\n    yield \"banana\";\n  }\n  finally {\n    console.log(\"You\
    \ must always eat a big watermelon\");\n    yield \"watermelon\";\n  }\n}\nconst\
    \ fruitIterator = getFruits();\nconsole.log(fruitIterator.next());\n// { value:\
    \ 'apple', done: false }\nconsole.log(fruitIterator.return(\"kiwi\"));\n// You\
    \ must always eat a big watermelon\n// { value: 'watermelon', done: false }\n\
    console.log(fruitIterator.next());\n// { value: 'kiwi', done: true }\nconsole.log(fruitIterator.next());\n\
    // { value: undefined, done: true }\n```\n\n在上面的例子中，一旦`finally`块中的表达式执行完毕，序列将以`value`为`'kiwi'`且`done`为`true`终止，其中`'kiwi'`是作为参数传递给`return(...)`方法的。\n\
    \n类似地，`throw(...)`也会停止生成器的执行，但它永远不会被自动调用。当您可能想要警告用户一些意外错误时，这个方法会很有用，利用`try-catch`块在生成器中启用错误处理。例如，请看以下代码片段：\n\
    \n```javascript\nfunction *getFruits() {\n  yield \"apple\";\n  yield \"orange\"\
    ;\n  yield \"spinach\";\n  yield \"watermelon\"\n}\nconst fruitIterator = getFruits();\n\
    for (let fruit of fruitIterator) {\n  try {\n    console.log(fruit);\n    if (fruit\
    \ === \"spinach\") {\n      fruitIterator.throw(\"Vegetable Found\");\n    }\n\
    \  }\n  catch (err) {\n    console.log(`Exception: ${err}`);\n  }\n}\n// apple\n\
    // orange\n// spinach\n// Exception: Vegetable Found\n```\n\n注意`\"watermelon\"\
    `从未从生成器yield出来，因为当`\"spinach\"`被返回时调用了`throw()`，从而停止了序列的执行。\n\n## 总结\n\nES6引入的迭代器和生成器提供了对集合中存储值的顺序访问，并允许我们自定义遍历这些值的方式。ES6还引入了一组新的协议来定义迭代器和可迭代对象，称为迭代协议。在本章中，我们学习了如何使用独特的`Symbol.iterator`属性定义对象的默认迭代器。当在对象上提供`Symbol.iterator`时，该对象被视为可迭代对象。\n\
    \n在本章的后半部分，我们还学习了生成器函数，它由星号（*）字符和函数体中的一个或多个`yield`语句表示。它们是特殊类型的函数，可以在执行过程中暂停和恢复。\n\
    \n# 9. ES6中的Promise\n\n众所周知，JavaScript在设计上是单线程的。在浏览器中，它使用事件处理来并发管理许多任务。JavaScript引擎管理一个事件队列，当事件发生时，会调用注册的处理函数。如果你有传统JavaScript的经验，那么你很清楚理解异步编程是正确使用JavaScript的必备条件。使用异步的主要模式是通过回调函数。ES6为标准JavaScript规范带来了一个新特性\
    \ —— Promise（一些新的和最新的JS库和框架中已有的特性），它解决了回调（唯一的异步方法）中的许多重大问题。\n\n## Promise概述"
  raw: 'In the above example, the first time `next()` was called, the generator yields
    the `"I am a calculator"` string and pauses. The second time the value from the
    `next(2)` will be assigned to `num1`, because inside the generator, we specified
    that whatever value is yielded at `yield "I am a calculator"` gets assigned to
    `num1`, and similarly for `num2`. Hence, the third time `next()` was called, `Sum
    is: 5` was printed to the console and since there was no more `yield` statements,
    `undefined` was returned as the value.


    This behavior of generators to communicate well with our code can be really helpful
    in cases of asynchronous programming. Generators can make your asynchronous code
    look synchronous. Consider another example that demonstrates how generators and
    asynchronous code work well together:


    ```

    function getFlightDurations() {

    setTimeout(() => {

    flightIterator.next({

    Qatar: "39h 0m",

    Emirates: "40h 20m"

    });

    }, 1200);

    }

    function getFlightPrices() {

    setTimeout(function(){

    flightIterator.next({

    Qatar: "$2010",

    Emirates: "$1904"

    })

    }, 1000);

    }

    function *getFlights() {

    const allFlights = ["Qatar", "Emirates"];

    const flightDurations = yield getFlightDurations();

    const flightPrices = yield getFlightPrices();

    for (let flight of allFlights) {

    console.log(`New York to Auckland takes ${flightDurations[flight]} in ${flight}
    airlines for around ${flightPrices[flight]}`);

    }

    }

    const flightIterator = getFlights();

    flightIterator.next();

    // New York to Auckland takes 39h 0m in Qatar airlines for around $2010

    // New York to Auckland takes 40h 20m in Emirates airlines for around $1904

    ```


    In the above example, `genFlights()` is a generator function that returns an iterator.
    On calling the `next()` method of the returned iterator, the generator execution
    gets to the first `yield` statement where `getFlightDurations()` is invoked. `getFlightDurations()`
    is an asynchronous function that uses `setTimeout` to delay the execution by 1.2s
    and calls `next()` method on the iterator guaranteeing that `flightDurations`
    will be correctly assigned. The same happens with `flightPrices` and once the
    `next()` method is called again in `getFlightPrices()`, the output is logged out
    to the console. If we were not using yield here, `flightDurations` and `flightPrices`
    would simply be assigned as `undefined` since the function itself would return
    `undefined` at the time of assignment. Having a `yield` statement prevents the
    value from being assigned until the `setTimeout` function has executed. This is
    how generators help us write blocking code when using asynchronous operations,
    making the code look more synchronous.


    ## Completing Early


    Earlier in this chapter, we discussed about the iterators having two optional
    methods : `return(...)` and `throw(...),` which have a lot of relevance in the
    context of generators. These methods end the sequence in a paused generator as
    soon as they are called. Take a look at the following code snippet, for example:


    ```

    function *getFruits() {

    yield "apple";

    yield "orange";

    yield "banana";

    }

    const fruitIterator = getFruits();

    console.log(fruitIterator.next());           // {value: ''apple'', done: false}

    console.log(fruitIterator.return("kiwi"));  // {value: ''kiwi'', done: true}

    console.log(fruitIterator.next());           // {value: undefined, done: true}

    ```


    In the above example, `return("kiwi")` returns the same value `"kiwi"` passed
    as the argument and ends the sequence resulting in `done` to be `true`. This is
    equivalent to having a return value in the generator function, although you should
    always keep in mind that traversing the sequence obtained from a generator does
    not include the value that signals `{ done: true }`. Check the following code
    snippet, for example, where we are iterating over the collection `fruitIterator`
    `,` which only contains the elements yielded before the `return()` method was
    invoked in the source generator:


    ```

    function *getFruits() {

    yield "apple";

    yield "orange";

    yield "banana";

    return "kiwi";

    yield "watermelon";

    }

    const fruitIterator = getFruits();

    for (let fruit of fruitIterator) {

    console.log(fruit);

    }

    // apple

    // orange

    // banana

    ```


    You can also avoid the immediate sequence termination by wrapping up the code
    inside `try-finally` block ensuring that the code with the `finally` clause will
    execute in case of completion, whether early or when the `yield` statements are
    exhausted. This can be helpful in performing any cleanup or closing operations
    after the sequence has ended. Check the following code snippet, for example:


    ```

    function *getFruits() {

    try {

    yield "apple";

    yield "orange";

    yield "banana";

    }

    finally {

    console.log("You must always eat a big watermelon");

    yield "watermelon";

    }

    }

    const fruitIterator = getFruits();

    console.log(fruitIterator.next());

    // { value: ''apple'', done: false }

    console.log(fruitIterator.return("kiwi"));

    // You must always eat a big watermelon

    // { value: ''watermelon'', done: false }

    console.log(fruitIterator.next());

    // { value: ''kiwi'', done: true }

    console.log(fruitIterator.next());

    // { value: undefined, done: true }

    ```


    In the above example, once the expressions in the finally block have been executed,
    the sequence will terminate with the `value` as `''kiwi''` and `done` as `true`,
    where `''kiwi''` was passed as the argument in the `return(...)` method.


    Similarly, `throw(...)` also stops the execution of the generator but it is never
    called automatically. This method can be useful in cases where you may want to
    warn the user about some unexpected errors, utilizing a `try-catch` block to enable
    error handling in generators. Check the following code snippet , for example:


    ```

    function *getFruits() {

    yield "apple";

    yield "orange";

    yield "spinach";

    yield "watermelon"

    }

    const fruitIterator = getFruits();

    for (let fruit of fruitIterator) {

    try {

    console.log(fruit);

    if (fruit === "spinach") {

    fruitIterator.throw("Vegetable Found");

    }

    }

    catch (err) {

    console.log(`Exception: ${err}`);

    }

    }

    // apple

    // orange

    // spinach

    // Exception: Vegetable Found

    ```


    Notice how `"watermelon"` never got yielded from the generator because `throw()`
    was called when `"spinach"` was returned, halting the execution of the sequence.


    ## Summary


    Iterators and Generators introduced in ES6 provide a sequential access to the
    values stored in a collection and also allow us to customize the way we traverse
    these values. ES6 also introduces a new set of protocols to define iterators and
    iterables known as Iteration protocols. In this chapter, we learned about defining
    the default iterator of an object using the unique [ `Symbol.iterator` `]` property.
    When `Symbol.iterator` is provided on an object, the object is considered an iterable.


    In the latter half of this chapter, we also learned about Generator functions,
    which are indicated by a star (*) character and one or more yield statements in
    their function body. They are special types of functions that can be paused and
    resumed midway through executions.


    # 9. Promises in ES6


    JavaScript, as we know it, is single threaded by design. In browsers, it uses
    event handling to manage a lot of tasks concurrently. The JavaScript Engine manages
    an event queue and when an event occurs, the registered handler function is called.
    If you have any experience with traditional JavaScript, then you are already well
    aware of the fact that understanding asynchronous programming is a must to properly
    be able to use JavaScript. The main pattern for using asynchrony is through the
    callback function. ES6 brings to the standard JavaScript specification a new feature
    Promises (a feature available in some of the new and latest JS libraries and frameworks)
    that solves many of the significant problems in the callbacks – the only approach
    to async.


