- '# JavaScript 模块指南


  ## 引言


  模块中的所有导出都将作为已声明对象的属性被访问。这会创建一个新的命名空间，因为该对象并不存在于实际模块中。


  需要注意的是，无论模块在导入语句中被导入多少次，它都只会被执行一次。当导入被执行时，该模块会被存储在内存中，并供所有后续导入重用。存储该模块的文件只会被执行一次。


  #### 导入默认值


  从模块中导入默认值非常简单：


  ```javascript

  import multiply from "./moduleFile.js";

  ```


  该导入语句从模块中导入了默认值。请注意，与导入命名导出不同，这里我们没有使用任何花括号。此例中的名称 `multiply` 是本地的，用于引用从模块中导入的默认值。


  对于同时导出默认值和非默认值的模块，你可以使用一条语句来导入所有绑定：


  ```javascript

  export let message = "42 is the answer to the everything.";

  export default function(a, b) {

  return a * b;

  }

  import multiply, { message } from "./moduleFile.js";

  console.log(multiply (21, 2));    // 42

  console.log(message);             // "42 is the answer to the everything."

  ```


  你需要使用逗号来分隔默认的本地名称和花括号内列出的非默认标识符。请确保始终将默认值放在非默认值之前。


  另一种为默认模块指定特定本地名称的导入方式是：


  ```javascript

  import { default as multiply, message } from "./moduleFile.js";

  ```


  在此例中，与上一个示例类似，`multiply` 存储了从 `moduleFile.js` 导出的默认模块。我们将在本章后续部分讨论使用 `as` 关键字重命名标识符。


  #### 导出已导入的绑定


  如果你需要重新导出已导入到模块中的绑定，可以使用导出语句：


  ```javascript

  import { message } from "./moduleFile.js";

  // 一些 JavaScript 代码

  export message;

  ```


  在此示例中，我们从 `moduleFile.js` 导入了绑定 `message`，并再次导出了相同的绑定。你也可以使用一条语句而不是两条来完成此操作，如下所示：


  ```javascript

  export { multiply } from "./moduleFile.js";

  ```


  此外，你可以使用通配符 `*` 重新导出所有内容，如下例所示：


  ```javascript

  export * from "./moduleFile.js";

  ```


  在上述示例中，来自 `moduleFile.js` 的所有内容（包括默认值）都会从当前模块中导出。


  #### 重命名标识符


  在许多情况下，你可能不想使用导入的变量、函数或类的原始名称，因为它可能与代码中的其他声明发生冲突。ES6 通过允许你使用 `as` 关键字重命名导出和导入来帮助你解决此问题：


  ```javascript

  function sum(a, b) {

  return a + b;

  }

  export { sum as add };

  ```


  在此示例中，`sum` 是导出函数的本地名称。但该函数被导出为 `add`，需要在另一个模块中使用其导出的名称 `add` 来导入：


  ```javascript

  import { add } from "./moduleFIle.js";

  ```


  同样，如果你想在导入标识符时使用不同的名称，可以这样做：


  ```javascript

  import { add as sum } from "./moduleFile.js";

  console.log(typeof add);            // "undefined"

  console.log(sum(1, 2));             // 3

  ```


  在这里，导出名称 `add` 被作为 `sum` 导入。因此，从技术上讲，在代码的其余部分没有名为 `add` 的标识符可供使用，它只能被引用为 `sum`。


  你还可以将标识符重命名为 `default` 以使其成为默认导出：


  ```javascript

  function multiply(a, b) {

  return a * b;

  }

  export { multiply as default };

  ```


  类似地，正如我们之前讨论过的，你也可以在重命名后导入默认值：


  ```javascript

  import { default as multiply, message } from "moduleFile.js";

  console.log(multiply(1, 2));      // 2

  console.log(message);             // "42 is the answer to the everything."

  ```


  由于 `default` 是 JavaScript 中的关键字，因此它不能用作变量、函数或类名。因此，使用 `default` 重命名导出可以被视为一种特殊情况，以与定义非默认导出的方式保持一致。如果你想使用单条导出语句同时指定多个导出（包括默认值），这种语法会非常有用。


  #### 加载模块


  ES6 并未具体定义如何加载模块。这是因为模块规范的设计目标之一就是保持与实现环境的无关性。ES6 没有创建一种适用于所有 JavaScript 环境的规范，而只是指定了语法。浏览器和
  Node.js 需要决定如何实现 `HostResolveImportedModule`，这是 ES6 抽象出加载机制的内部操作。


  #### Web 浏览器中的模块


  在 Web 应用程序中使用 JavaScript 的方法有很多，但将 JavaScript 插入 HTML 的主要方式是通过 `<script>` 标签。`<script>`
  标签有一个 `src` 属性，用于告知应用程序脚本位于特定位置。另一种方式是直接将代码包含在标签内部。你也可以使用 workers 来加载 JavaScript。让我们在模块的上下文中逐一探讨这些机制。


  ### 使用 `<script>` 加载模块


  默认情况下，`<script>` 元素将 JavaScript 文件作为脚本加载。这等同于显式地将 `type` 属性设置为内容类型 `text/javascript`。为了支持模块，`module`
  值被添加到了类型选项中。例如：


  ```javascript

  import { multiply } from "./moduleFile.js";

  let result = multiply(1, 2);

  ```


  与脚本不同，模块使用 `import` 来指定为了正确执行而需要加载的其他文件。为了使其功能正常工作，`script` 元素的模块类型始终表现得如同应用了 `defer`
  属性一样。`defer` 属性对于加载脚本文件是可选的，但对于加载模块文件始终是应用的。一旦 HTML 解析器遇到 `<script type="module">`
  元素，模块文件就会开始被下载。因此，所有模块都按照它们出现的顺序执行。


  #### 在浏览器中异步加载模块


  你可能已经在 HTML 中使用了 `<script>` 标签的 `async` 属性。当你在 script 标签中使用此属性时，它让浏览器知道脚本在获取并可用后需要立即执行。因此，异步脚本的执行顺序不是同步的。它们一旦可用就会立即执行，无论它们被声明的顺序如何。对于模块，你可以使用相同的异步执行过程。唯一需要记住的一点是，在模块可以执行之前，需要先获取导入资源。


  ### 常见陷阱


  模块在分隔代码和创建可重用的逻辑组件方面非常有用。但是，为了有效使用它们，你需要了解一些陷阱。在本节中，我们将详细讨论这些陷阱。


  #### 语法


  请记住，`export` 和 `import` 都只能在顶层使用，不能成为其他语句或函数的一部分。例如，以下代码将抛出语法错误：


  ```javascript

  if (condition) {

  export condition;

  // SyntaxError: ''import'' and ''export'' may only appear at the top level

  }

  ```


  这里，导出语句是 `if` 语句的一部分，这会抛出错误。导出和导入不能以任何方式被条件性地或动态地执行。在 `try-catch` 块中使用 import-export
  语句时也是如此。`export` 和 `import` 关键字被特意设计为静态的，以便文本编辑器能够在导入特定模块时轻松地提供该模块中可用的信息。


  #### 只读绑定




  '
- "# ES6 模块\n\nES6 的 `import` 语句只会创建指向相应变量、函数或类的**只读绑定**。因此，导入这些绑定的模块无法修改其值。但导出标识符的模块可以对其进行修改。例如：\n\
  \n```javascript\n// moduleFile.js 从这里开始\nexport var message = \"模块文件中的消息\";\nexport\
  \ function setMessage(newText) {\n    message = newText;\n}\n// moduleFile.js 在这里结束\n\
  \n// file.js\nimport { message, setMessage } from \"./moduleFile.js\"\nconsole.log(message);\
  \          // \"模块文件中的消息\"\nsetMessage(\"新消息\");\nconsole.log(message);        \
  \  // \"新消息\"\nmessage = \"这是另一条消息\";      // 报错\n```\n\n在上述示例中，我们从模块中导入了两个绑定：`message`\
  \ 和 `setMessage`。函数 `setMessage()` 可以更改变量 `message` 的值，但如果你尝试直接更改该值，则会抛出错误。\n\n\
  #### 解构导入语句与使用变量\n\n尽管 import 语句看起来像是解构，但事实并非如此。因此，以下代码是无效的，将会抛出错误：\n\n```javascript\n\
  import { toto: { tata } } from 'someModule'; // 报错\n```\n\n你还需要牢记一点：import 语句不能依赖于任何需要在运行时计算的内容。因此，类似下面的示例也会抛出错误：\n\
  \n```javascript\nimport toto from \"someModule\" + tata; // 报错\n```\n\n因此，在导入模块时，请确保不要使用任何此类复杂的机制。\n\
  \n## 使用 `eval()`\n\n你不能在模块上使用 `eval()`，因为模块对于 `eval()` 来说是一种高级结构。`eval()` 通常接受不允许使用\
  \ `import` 或 `export` 的脚本。\n\n## 模块标识符\n\n在上述所有示例中，我们在模块标识符中使用了相对路径，例如 `\"./moduleFile.js\"\
  `。当浏览器尝试运行此代码时，它们会按以下方式理解这些路径：\n\n- `/` 解析为根目录\n- `./` 解析为当前目录\n- `./` 解析为父目录\n\n\
  ## 总结\n\nES6 中的模块为扩展 JavaScript 的功能提供了新的方式。它们有助于更好地组织代码，并维护更具模块化语义的代码库。ES6 引入了新的关键字，如\
  \ `import`、`export` 和 `default`，使得模块的使用成为可能。由于 ES6 集成了两者的优点，你不再需要使用 UMD 或诸如 CommonJS\
  \ 或 AMD 之类的额外模块系统。\n\n使用模块，你可以编写可重用且封装性更好的代码。与脚本不同，模块不会修改全局作用域，从而降低了出错的可能性。如果你想在其他地方使用模块中的值，你必须专门将它们从模块中导出。\n\
  \n"
- "# ES6 中的 Symbol\n\n早在 1996 年，也就是 JavaScript 首次被标准化、ECMA 试图制定出标准规范的时候，JavaScript\
  \ 就已经有五种原始数据类型：布尔型、数字型、字符串型、未定义型和空值型，每种类型都代表一个值。但现在，ES6 引入了一种全新的原始数据类型——Symbol。在本章中，我们将详细讲解这种新的原始类型及其应用。\n\
  \n## Symbols\n\nSymbol 表示一个唯一的值，其本质是一个保证永远不会与其他 Symbol 冲突的唯一令牌。ES6 中的 Symbol 可以通过一个工厂函数来创建。`Symbol()`\
  \ 方法可用于创建一个新的 Symbol。考虑以下示例：\n\n```javascript\nconst foo = Symbol();\nconsole.log(typeof\
  \ foo);      // \"symbol\"\n```\n\n每次调用工厂函数，都会创建一个新的、唯一的 Symbol。对 Symbol 类型使用 `typeof`\
  \ 运算符，其输出是 `\"symbol\"`，这是识别 Symbol 的主要方式。\n\n**注意：** ES6 中的 Symbol 不像其他原始类型那样具有字面量形式。\n\
  \n（可选地）在创建 Symbol 时，你也可以通过向 `Symbol()` 方法传递一个字符串作为参数来为其添加标签：\n\n```javascript\n\
  const chocolate = Symbol(\"这是我的巧克力\");\nconsole.log(chocolate);\n// Symbol(这是我的巧克力)\n\
  console.log(chocolate.toString());\n// \"Symbol(这是我的巧克力)\"\n```\n\n作为参数传入的标签不会影响\
  \ Symbol 的值。除了在打印 Symbol 时用作描述该 Symbol 的字符串之外，它没有其他作用。当你对返回的 Symbol 调用 `.toString()`\
  \ 方法（该方法将 Symbol 转换为字符串）时，它也非常有用。当你将 Symbol 写入 `console.log()` 以及可能的错误消息时，该标签会显示出来。这对于调试目的非常有帮助。\n\
  \n请注意，你不应该使用 `new` 关键字来创建 Symbol。Symbol 没有对象构造函数；因此你不能使用 `new` 关键字创建 Symbol：\n\n\
  ```javascript\nconst bar = new Symbol();           // 类型错误\n```\n\n如前所述，Symbol 永远是唯一的，两个\
  \ Symbol 永远不可能相同。但是，你可以使用相同的标签创建多个 Symbol，但返回的 Symbol 始终是唯一的。查看以下代码片段示例：\n\n```javascript\n\
  const kit = Symbol(\"你好\");\nconst kat = Symbol(\"你好\");\nconsole.log(kit === kat);\
  \       // false\n```\n\n或者你可以简单地尝试：\n\n```javascript\nSymbol() !== Symbol()   \
  \      // true\n```\n\n因此，Symbol 永远是唯一的，并且在各种情况下都有其不可思议的用途。让我们在下一节中看看它们的应用。\n\n\
  ### Symbol 的应用\n\n从本质上讲，Symbol 主要用作唯一的属性键，因为一个 Symbol 永远不会与对象的任何其他属性（Symbol 或字符串）发生冲突，这在你不希望冒险覆盖对象的原生属性时非常有用。Symbol\
  \ 也常用于为类或对象类型的内部使用创建匿名（或在某种程度上是私有的）属性。考虑以下示例，其中我们有一个名为 `Person` 的对象，它包含一些“公共”属性：\n\
  \n```javascript\nlet Person = {\n    name: \"John\",\n    age: 14,\n    location:\
  \ \"New York\"\n}\n```\n\n现在，假设我们想向 `Person` 对象添加一个私有方法。我们可以像下面这样使用 Symbol 来实现：\n\
  \n```javascript\nlet votingEligibility = Symbol();\nPerson[votingEligibility] =\
  \ function() {\n    return this.age >= 18;\n}\n```\n\n现在让我们看看 `Person` 对象，你会发现一个匿名方法已经被添加到其中：\n\
  \n```javascript\nconsole.log(Person);\n// {name: \"John\", age: 14, location: \"\
  New York\"}\n// 如果你在较新版本的 Google Chrome 中运行此代码，\n// 你还会看到 - Symbol(): [Function]\
  \ 属性\n```\n\n你也可以在这里使用计算属性键，我们已经在之前的章节中讨论过这一点：\n\n```javascript\nlet Person = {\n\
  \    name: \"John\",\n    age: 14,\n    location: \"New York\",\n    [Symbol()]:\
  \ function() {\n        return this.age >= 18;\n    }\n}\n```\n\nSymbol 属性是不可枚举且匿名的。因此，在使用\
  \ `for...in` 循环时，遍历过程中无法访问对象的 Symbol 属性；并且由于它是匿名的，它也不会被列在 `Object.getOwnPropertyNames()`\
  \ 方法的结果数组中。但是，你可以使用 `Object.getOwnPropertySymbols()` 来获取 Symbol 属性。例如：\n\n```javascript\n\
  Object.getOwnPropertyNames(Person);\n// [\"name\", \"age\", \"location\"]\nObject.getOwnPropertySymbols(Person);\n\
  // [Symbol()]\n```\n\n让我们看看在上一个创建 `Person` 对象的示例中如何使用 `Object.getOwnPropertySymbols()`：\n\
  \n```javascript\nlet canVote = Object.getOwnPropertySymbols(Person)[0];\nPerson[canVote]();\n\
  // false\n```\n\n**注意：** 我们看到 `Object.getOwnPropertySymbols()` 会返回一个与对象关联的属性 Symbol\
  \ 数组，因此这些属性是可访问的，而不是私有的。但是通过使用 Symbol，我们确实拥有不会随意发现这些属性的优势。\n\n你也可以通过使用创建的引用来将属性绑定到\
  \ `Person` 对象来实现这一点。还记得我们是使用 `let votingEligibility = Symbol();` 来创建 Symbol 的吗？因此：\n\
  \n```javascript\nPerson[votingEligibility]();\n// false\n```\n\n\n\n同样，自定义类也可以通过这种方式创建私有成员，使其仅能被类中定义的其他方法私有访问。动态创建的符号值可以保存到作用域内的类变量中，该类变量只能被类的内部方法访问，从而保护私有属性不被无意或随意发现。例如，请看以下代码片段：\n\
  \n```\nconst age = Symbol(\"age\");\nclass Person {\nconstructor(value) {\nthis[age]\
  \ = value;\n}\ngetAge() {\nconsole.log(this[age]);\n}\n}\nconst jack = new Person(23);\n\
  console.log(jack);\n// Person {}\nconsole.log(jack.age);\n// undefined\nconsole.log(jack[Symbol(\"\
  age\")]);\n// undefined\njack.getAge();\n// 23\n```\n\n在这个例子中，我们有一个 `Person` 类，它使用符号创建了一个私有属性来存储人的年龄。从代码片段中可以看出，该属性是不可枚举的，因为它返回一个空对象，并且只能通过公开的\
  \ `getAge()` 方法访问。由于符号总是唯一的，通过创建具有相同标签 `age` 的符号 `Symbol(\"age\")` 来访问私有属性，只会创建一个新的唯一符号，而无法访问对象的所需属性。\n\
  \n### 符号与注册表\n\n到目前为止，我们已经讨论了局部符号以及如何通过获取引用访问它们。符号也可以放在一个全局注册表中，通过它可以在不同的上下文（称为领域）中访问。领域是代码片段存在的上下文，例如应用程序运行的页面、页面中的\
  \ `<iframe>`，或包含全局变量和已加载模块的 web worker 上下文。\n\n符号拥有一项特殊能力，可以存在于整个运行时符号注册表中，你可以使用以下方法将符号添加到运行时符号注册表中：\n\
  \n```\nSymbol.for(key) 和 Symbol.keyFor(symbol)。\n```\n\n## Symbol.for(key)\n\n此方法在运行时符号注册表中查找具有给定键的现有符号。如果在全局注册表中存在具有该键的符号，则返回该符号。如果在注册表中未找到具有该键的符号，则会创建一个新符号。例如，考虑以下代码片段，其中第一次调用\
  \ `Symbol.for('myCar')` 创建一个符号，将其添加到注册表并返回；第二次调用则返回同一个符号，因为该键已存在于运行时符号注册表中：\n\n\
  ```\nSymbol.for('myCar') === Symbol.for('myCar')\n// true\n```\n\n运行时全局注册表会跟踪所有使用\
  \ `Symbol.for(key)` 方法创建的符号，这些符号可以在不同的领域之间访问。例如，在网页中任何地方创建的符号也可以在 iframe 的上下文中访问。查看以下代码片段（你可以在浏览器控制台中运行）：\n\
  \n```\n// 创建一个 iframe\nconst frame = document.createElement('iframe');\n// 将 iframe\
  \ 附加到 body\ndocument.body.appendChild(frame);\nconsole.log(Symbol.for('temperature')\
  \ === frame.contentWindow.Symbol.for('temperature'));\n// true\n```\n\n在上面的示例中，来自网页上下文的全局符号与\
  \ iframe 中的全局符号完全相同，这表明使用 `Symbol.for(key)` 方法创建的符号可以在不同领域之间访问。\n\n## Symbol.keyFor(symbol)\n\
  \n`Symbol.keyFor(symbol)` 从全局符号注册表中检索与给定符号关联的键，该键是在将符号添加到注册表时关联的。如果在注册表中未找到该符号，则返回\
  \ undefined。\n\n```\nconst symbol = Symbol.for('myHouse');\nconsole.log(Symbol.keyFor(symbol));\
  \ // myHouse\nconst myCat = Symbol();\nSymbol.keyFor(myCat); // undefined\n```\n\
  \n#### 内置符号\n\nES6 附带了一系列语言规范中预定义的符号，其中大部分暴露了 JavaScript 对象的一些元属性和行为。一些众所周知的符号如下：\n\
  \n`Symbol.hasInstance` - 允许我们确定对象是否是构造函数的实例。它由 instanceof 运算符在内部调用。\n\n另一个是 `Symbol.iterator`，我们将在本书后面深入探讨。它保存对象的默认迭代器。数组、集合（Set）、映射（Map）和弱映射（WeakMap）在其结构中都有一个不可枚举的\
  \ `[Symbol.iterator]` 属性。\n\n## 总结\n\n符号是 ES6 中引入 JavaScript 的一种新的原始类型。当你想避免属性键的名称冲突时，它们非常有用，特别是在你不想冒险覆盖对象的原生属性的情况下。符号因其不可枚举性，通过创建受保护的属性提供优势，防止这些属性被轻易发现，因为你必须专门查找符号才能找到它们。\n\
  \n"
- '# 7. 数组与集合


  到目前为止，我们已经涵盖了 ES6 提供的许多新的和改进的特性和功能。在本章中，我们将介绍数组和集合等数据类型的更多增强功能。ES6 为 JavaScript
  语言带来了许多新的静态属性和方法，扩展了内置原生对象和对象的功能。我们将探讨 Array 类型的扩展特性，以及一些现在已成为语言原生组件的新数据结构抽象。


  ## 数组与新方法


  多年来，许多流行的 JavaScript 库（如 Underscore 和 Lodash）都随着数组数据结构的发展而发展，数组是最常被扩展的特性之一。因此，随着时间的推移，语言对这些库中常见的数组功能提供内置支持变得越来越必要。在本节中，我们将介绍所有新的
  ES6 数组功能，并研究一些它们表现出色的用例。


  我们现在有了语言提供的几个新的静态方法和原型方法，可帮助你创建、操作、填充和过滤数组。首先，让我们看看静态方法：`Array.from()` 和 `Array.of()`，然后我们将探索
  ES6 中为数组引入的新原型方法。


  ### Array.from()


  在 ES6 之前，为了将类数组对象（例如 `arguments` 和 `NodeList`）转换为真正的数组，我们需要使用一些技巧，比如在 `arguments`
  或 `NodeList` 上调用 `Array.prototype.slice.call()` 来将对象转换为数组。考虑以下示例，其中 DOM 中存在一个元素列表：


  ```

  Apple

  Mango

  Orange

  Litchi

  Banana


  var listItems = document.querySelectorAll(''li'');

  // 将 NodeList 转换为数组

  listItems = Array.prototype.slice.call(listItems);

  // 在新转换的数组上使用数组方法

  listItems.map(item => { console.log(item.innerText) });

  // Apple

  // Mango

  // Orange

  // Litchi

  // Banana

  ```


  有了 ES6，我们现在有了一个更直接的解决方案，用于将像上例中描述的类数组对象转换为数组。新的 `Array.from` 静态方法允许我们从任何类数组或可迭代对象创建数组。不过，在继续之前，让我们清楚地理解我们所说的类数组对象具体是什么意思。这些就是具有
  length 属性或索引元素的对象。例如，考虑以下对象：


  ```

  const customers = {

  ''0'': ''matt'',

  ''1'': ''ian'',

  ''2'': ''mikhail'',

  ''3'': ''akia'',

  ''4'': ''vincent'',

  length: 5

  };

  ```


  现在，如果我们想把这个对象转换为数组，我们可以使用 `Array.from()` 语法像这样简单地实现：


  ```

  Array.from(customers).forEach(customer => {

  console.log(customer);

  });

  ```


  在这个例子中，我们只是将客户对象传递给了函数，而它就返回了一个由各个元素组成的数组。让我们看看具体的 `Array.from` 语法：


  ```

  Array.from(arrayLike[, mapFn[, thisArg]])

  ```




  在语法`arrayLike`中，`arrayLike`是一个类数组或可迭代对象，`mapFn`（可选参数）是一个映射函数，可应用于数组的每个元素。`thisArg`是另一个可选参数，其值在执行`mapFn`时用作`this`。


  `Array.from()`会尝试检查其第一个参数是否可迭代，如果是，则使用迭代器生成值并复制到返回的数组中。但如果传入一个类数组对象，其行为与`slice()`或`apply()`相同，即简单地循环访问从
  0 到对象长度的数值命名属性值。


  如果现在将上述示例与可选参数`mapFn`结合使用，代码如下所示：


  ```

  Array.from(customers, customer => {

  console.log(customer);

  });

  ```


  注意，我们移除了`forEach`方法，并使用第二个参数作为映射函数来遍历结果数组。


  #### `Array.of()`


  ES6 引入的另一个非常实用的方法是`Array.of()`，它允许你轻松创建元素数组。`Array.of()`接受一个项目列表作为参数，并将其作为数组返回。请看以下示例：


  ```

  let arr = Array.of(10, 20, 30, 40);

  console.log(arr); // [10, 20, 30, 40]

  ```


  你可能会疑惑这与传统的`Array(...)`构造函数有何不同。你也可以使用`Array()`语法通过数组构造方法来创建数组。但`Array.of()`与`Array`构造函数的区别在于它们处理单个数字作为参数的方式。`Array`构造函数有一个非常奇怪的行为：如果只传入一个数字，它不会创建包含该数字值的单元素数组，而是创建一个空数组，并以该数字作为其长度，所有元素都被设置为`undefined`。


  `Array.of()`静态方法解决了这个问题，现在是首选的函数形式数组构造函数。


  请看以下示例：


  ```

  const arr1 = Array.of(10);

  console.log(arr1); // [10]

  console.log(arr1.length);      // 1

  const arr2 = Array(10);

  console.log(arr2); // [,,,,,,,,,]

  console.log(arr2.length);      // 10

  ```


  从上面的示例可以看出，`Array.of(10)`创建了一个包含单个数字`[10]`的数组，而`new Array(10)`方法创建了一个长度为 10 的空数组。说到这里，我们需要理解为什么在第一种情况下要使用构造函数，而不是像`a
  = [1, 2, 3]`这样的字面量语法。例如，当你有一个回调函数需要将传入的参数包装成数组时，或者当你需要子类化`Array`并希望在子类实例中创建或初始化元素时，就会使用构造函数。


  现在我们已经了解了 ES6 中为数组引入的两个新静态方法，接下来深入探讨 ES6 中为`Array`原型引入的新原型方法。


  ### 新的`Array.prototype`方法


  在讨论了创建数组的新方法之后，让我们看看 ES6 中引入的新数组方法如何帮助我们轻松访问和操作存储在数组中的数据。在本节中，我们将介绍新的`Array.prototype`方法，包括`entries()`、`keys()`、`values()`、`find()`、`findIndex()`、`fill()`和`copyWithin()`，并通过一些实际示例来理解这些方法如何帮助我们轻松访问和操作数据。


  #### `Array.prototype.entries()`


  `entries()`方法返回一系列值，但通过迭代器逐个暴露它们，而不是一次性作为一个数组返回。你将在后续章节中更详细地学习迭代器，但这里我们先对迭代器做一个快速介绍。


  迭代器一次从集合中访问一个项目，同时跟踪其在序列中的当前位置。它提供了一个`next()`方法，该方法返回序列中的下一个项目。`next()`方法返回一个包含两个属性的对象：`done`和`value`，其中`value`表示集合中的项目，`done`是一个布尔值，当可迭代对象的所有元素都被迭代完毕时，其值为`true`。


  每个可迭代对象（例如数组）都必须实现可迭代协议，这意味着该对象（或其原型链上的某个对象）必须有一个属性，其键为`Symbol.iterator`。`Symbol.iterator`是
  ES6 的另一个新增特性，我们将在本书后面讨论，但现在可以将其视为一种定义永远不会与常规对象键冲突的特殊键的方式。


  让我们来看一个数组，它是一个可迭代对象，以及它可以生成的用于消费其值的迭代器：


  ```

  const arr = [11,12,13];

  const itr = arr[Symbol.iterator]();

  itr.next(); // { value: 11, done: false }

  itr.next(); // { value: 12, done: false }

  itr.next(); // { value: 13, done: false }

  itr.next(); // { value: undefined, done: true }

  ```


  现在我们对迭代器和可迭代对象有了基本了解，让我们仔细看看`Array.prototype.entries()`方法如何帮助我们遍历数组。此方法返回一个新的`Array
  Iterator`对象，该对象包含数组中每个索引的键/值对。例如，考虑以下代码片段：


  ```

  const breakfast = [''apples'', ''bananas'', ''oranges''];

  const eBreakfast = breakfast.entries();

  console.log(eBreakfast.next().value); // [0, ''apples'']

  console.log(eBreakfast.next().value); // [1, ''bananas'']

  console.log(eBreakfast.next().value); // [2, ''oranges'']

  ```


  你也可以使用`for-of`循环来遍历从`breakfast.entries()`调用返回的迭代器：


  ```

  for (let entry of eBreakfast) {

  console.log(entry);

  }

  // [0, ''apples'']

  // [1, ''bananas'']

  // [2, ''oranges'']

  ```


  类似地，还有另外两个数组方法可以分别访问键和值。让我们来看看它们。


  #### `Array.prototype.keys()`


  此方法返回一个新的`Array Iterator`，其中包含数组中每个索引的键：


  ```

  const breakfast = [''apples'', ''bananas'', ''oranges''];

  const kBreakfast = breakfast.keys();

  console.log(kBreakfast.next().value); // 0

  console.log(kBreakfast.next().value); // 1

  console.log(kBreakfast.next().value); // 2

  ```


  #### `Array.prototype.values()`


  此方法返回一个新的`Array Iterator`对象，其中包含数组中每个索引的值：


  ```

  const breakfast = [''apples'', ''bananas'', ''oranges''];

  const vBreakfast = breakfast.values();

  console.log(vBreakfast.next().value); // apples

  console.log(vBreakfast.next().value); // bananas

  console.log(vBreakfast.next().value); // oranges

  ```


  #### `Array.prototype.find()`


  `find()`方法允许你遍历数组，并返回第一个与数组的`callback(element, index, array)`匹配的项目。此方法还允许你选择性地为`this`传递上下文绑定。换句话说，`find()`方法返回数组中第一个使测试函数返回`true`的值；否则返回`undefined`。`find()`方法的语法如下：


  ```

  arr.find(callback[, thisArg])

  ```


  其中`callback`是测试函数，它对每个值执行，并接受三个参数：


  ```

  element, index and array.

  function callback(element, index, array) {

  // 基于某些条件返回 true 或 false

  }

  ```


  考虑以下代码片段：


  ```

  const inventory = [

  {name: ''apples'', quantity: 2},

  {name: ''bananas'', quantity: 0},

  {name: ''oranges'', quantity: 5}

  ];

  let result = inventory.find((fruit) => fruit.name === ''apples'');

  console.log(result);             // {name: ''apples'', quantity: 2}

  ```




  上述示例展示了如何轻松地在给定数组中查找与`fruit.name`匹配`''apples''`的`第一个`元素。你也可以使用`find()`方法获取特定索引位置的元素，例如：


  ```

  result = inventory.find((fruit, i) => i > 2);

  console.log(result);             // {name: ''oranges'', quantity: 5}

  ```


  如上所述，如果在数组中未找到元素，`find()`方法返回`undefined`：


  ```

  result = inventory.find((fruit, i) => i > 10);

  console.log(result);             // undefined

  ```


  下一个参数`thisArg`允许你为`this`可选地传递一个上下文绑定；例如，考虑以下代码片段：


  ```

  function eligibleToVote(age) {

  return age >= this.legalAge;

  }

  function foo() {

  this.legalAge = 18;

  const result = [10, 12, 23, 26, 32].find(eligibleToVote, this);

  console.log(result);

  }

  foo();     // 23

  ```


  在这个例子中，`foo`的上下文作为第二个参数传递给`find()`方法，因此`eligibleToVote()`中的`this`指向`foo`的上下文，而`this.legalAge`的值为`18`。


  你可能会认为这个方法类似于 ES5 中的`filter()`方法，但请注意`filter()`总是返回一个匹配项的数组（并且可能返回多个匹配项），而`find()`只返回一个元素（数组中第一个满足条件的元素）。


  ### `Array.prototype.findIndex()`


  此方法是`find()`的等价方法。它不返回元素本身，而是返回索引位置。如果集合中没有元素满足`callback (element, index, array)`的条件，则返回值为
  -1。


  例如，考虑以下代码片段：


  ```

  result = inventory.findIndex((fruit) => fruit.name === ''apples'');

  console.log(result);             // 0

  result = inventory.findIndex((fruit) => fruit.name === ''grapes'');

  console.log(result);             // -1

  ```


  此方法类似于 ES5 中的`indexOf()`方法，它仅定位数组中的元素。使用`indexOf()`方法，你只能搜索数组中的元素；它不支持回调函数。而使用`findIndex()`方法，我们可以应用一个条件，返回的索引位置上的元素必须满足该条件。


  ### `Array.prototype.fill()`


  这是一个非常简单的方法，允许我们用静态值填充数组的所有元素。它还可以接受可选的起始和结束索引值。


  考虑以下代码片段：


  ```

  [1, 2, 3].fill(4);         // [4, 4, 4]

  [1, 2, 3].fill(4, 1);      // [1, 4, 4]

  [1, 2, 3].fill(4, 1, 2);   // [1, 4, 3]

  ```


  输入值可以是任意值，不一定是数字、字符或任何其他原始类型。它可以是一个对象，例如：


  ```

  new Array(4).fill({});     // [{}, {}, {}]

  ```


  ### `Array.prototype.copyWithin()`


  `copyWithin()`方法将数组中的元素序列复制到以`target`为目标起始位置。要复制的元素取自`(start, end)`范围。`start`参数是可选的，默认为
  0。同样，`end`参数也是可选的，默认为数组的长度。


  `copyWithin()`方法的语法如下：


  ```

  Array.prototype.copyWithin(target, start = 0, end = this.length)

  ```


  我们先从一个简单的例子开始。考虑以下代码片段：


  ```

  let fruits = ["apples", "bananas", "oranges", "grapes", "guava", "watermelon"];

  fruits.copyWithin(4);

  console.log(fruits);

  // ["apples", "bananas", "oranges", "grapes", "apples", "bananas"]

  ```


  `fruits.copyWithin(4)`将`target`索引设为 4，即"guava"。然后，它将确定要复制的元素`start`为 0（默认值），`end`为
  6（数组长度）。当然，你可以根据需要指定起始和结束值：


  ```

  fruits = ["apples", "bananas", "oranges", "grapes", "guava", "watermelon"];

  fruits.copyWithin(4, 1, 3);

  console.log(fruits);

  // ["apples", "bananas", "oranges", "grapes", "bananas", "oranges"]

  ```


  `copyWithin()`方法也接受负值的`start`索引、负值的`end`索引和负值的`target`索引。让我们看一个使用负值的例子：


  ```

  [1, 2, 3, 4, 5].copyWithin(-3, -4, -1);    // [1, 2, 2, 3, 4]

  ```


  在这个例子中，`target`索引为`-3`，确定了起始位置为数组倒数第三个元素（在输入数组中是`3`）。然后确定`start`和`end`值分别为`2`和`5`（分别是数组的第四个和最后一个元素，但这里`-4`对应的索引是
  2，`-1`对应的索引是 5，表述需准确：-4 对应数组第四个元素，即 2；-1 对应数组最后一个元素，即 5）。


  #### 类型化数组


  ES6 中的类型化数组提供了一种高效访问和操作二进制数据的方法。在 ES6 之前，JavaScript 不太擅长处理二进制数据。在处理二进制数据时，类型化数组有助于提高性能。


  使用类型化数组，JavaScript 引擎不必推断数组的类型。如果你在 JavaScript 中创建一个普通数组，并且只存储浮点数，你的 JavaScript
  引擎可能会乐观地认为它是一个浮点数数组，并为其优化代码。此时性能可以与类型化数组相当。但是，假设你有一个浮点数数组，并且代码中某个时刻，你在一个元素中存储了一个对象。在这种情况下，你的
  JavaScript 引擎必须取消优化并重新生成代码，使数组恢复为通用类型。因此，使用类型化数组，事情要简单得多，因为它们保证是单一类型，并且你不能在其中存储对象等其他内容。它们更简单这一事实意味着不那么复杂的
  JavaScript 引擎可以轻松实现它们，并且你可以获得一致的性能。


  类型化数组的架构由缓冲区和视图组成。缓冲区是一个表示数据块的对象。我们不能直接操作缓冲区的内容。为了访问缓冲区中包含的内存，我们需要使用视图。视图使我们能够读写缓冲区的数据内容。


  因此，类型化数组有两个独立的类：`ArrayBuffer`和`DataView`。`ArrayBuffer`包含我们的数据，而`DataView`提供了对此数据的自定义视图，该视图以特定格式表示缓冲区，并支持数据访问和操作。


  ### 使用类型化数组的基础知识


  查看以下代码片段；这里我们创建一个`ArrayBuffer`，然后创建一个特定的`DataView`来处理该缓冲区内的数据：


  ```

  const buffer = new ArrayBuffer(16);

  const int32View = new Int32Array(buffer);

  for (let i = 0; i < int32View.length; i++) {

  int32View[i] = i * 2;

  }

  console.log(int32View); // [0, 2, 4, 6]

  ```


  类型化数组视图为所有常用的数值类型提供了视图，如 Int8、Uint32、Float64 等。你可以在表 7-1 中查看所有类型及其各自的大小和描述。


  **表 7-1.** 类型化数组视图


  | 类型 | 大小（字节） | 描述 |

  | --- | --- | --- |

  | Int8Array | 1 | 8 位有符号整数 |

  | Uint8Array | 1 | 8 位无符号整数 |

  | Uint8ClampedArray | 1 | 8 位无符号整数（钳制） |

  | Int16Array | 2 | 16 位有符号整数 |

  | Uint16Array | 2 | 16 位无符号整数 |

  | Int32Array | 4 | 32 位有符号整数 |

  | Uint32Array | 4 | 32 位无符号整数 |

  | Float32Array | 4 | 32 位浮点数 |

  | Float64Array | 8 | 64 位浮点数 |




  请注意，在钳位数组（clamped arrays）的情况下，所有超出范围的值都会被设置为范围内最近的值，即第一个或最后一个元素。`Uint8ClampedArray`类型化数组表示一个
  8 位无符号整数的数组，值被钳位在 0-255 之间，这意味着如果你指定一个超出`[0,255]`范围的值，则会设置 0 或 255。如果你指定一个非整数，则会设置最近的整数。


  #### 类型化数组与普通数组


  类型化数组和普通数组在某些方面相似：它们都有`length`属性，并且在两种情况下，都可以使用`[]`运算符访问数组中的元素。类型化数组也支持所有标准数组方法。但它们在多方面存在差异。


  JavaScript 中的类型化数组类似于 C、C++等其他编程语言中的数组，其中数组的所有元素类型相同，这与 JavaScript 中的数组不同，后者元素可以是任何类型。类型化数组对所有元素都有严格的类型要求。


  类型化数组不能有空元素。它们总是用 0 值进行初始化，而普通数组中的值可以是空的（`undefined`）。请查看以下代码片段：


  ```

  const buffer = new ArrayBuffer(16);

  const float32View = new Float32Array(buffer);

  let arr = new Array(10);

  console.log(float32View); // Float32Array [0, 0, 0, 0]

  console.log(arr); // [,,,,,,,,,]

  ```


  类型化数组受到多种浏览器 API 的支持：`File API`、`XMLHttpRequest`、`Fetch API`、`Canvas`、`WebSockets`、`WebGL`、`Web
  Audio API`、`Media elements`等。目前，类型化数组的某些功能可能并非所有浏览器和 JavaScript 引擎都支持，因此你可以在`https://kangax.github.io/compat-table/es6/#typed_arrays`检查目标
  JavaScript 引擎的可用性。


  ## Map 和 WeakMap


  ES6 引入了一组新的数据结构，称为`Map`和`WeakMap`，它们本质上是一个哈希表或字典，类似于 Python 或 C#中的概念。ES6 Maps 提供了一个简单的
  API，用于通过任意键存储对象，这是许多 JavaScript 程序中必不可少的核心功能。我们将在本节中详细介绍它们。


  #### Map


  实际上，我们一直在 JavaScript 中使用 Map。事实上，每个对象都可以被视为一个`Map`。对象由键（始终是字符串）和值组成，而在`Map`中，任何值（包括对象和原始值）都可以用作键或值。


  在`Map`中，键可以是任何类型：`string`、`Boolean`、`number`、`object`或`function`。请看这段代码：


  ```

  let myMap = new Map();

  const keyString = "a string",

  keyObj = {},

  keyFunc = () => {};

  // 设置值

  myMap.set(keyString, "value associated with ''a string''");

  myMap.set(keyObj, "value associated with keyObj");

  myMap.set(keyFunc, "value associated with keyFunc");

  ```


  请注意，`set()`方法是可链式调用的，因此你也可以这样做：


  ```

  myMap.set(keyString, "value associated with ''a string''")

  .set(keyObj, "value associated with keyObj")

  .set(keyFunc, "value associated with keyFunc");

  myMap.size; // 3

  // 获取值

  myMap.get(keyString);    // "value associated with ''a string''"

  myMap.get(keyObj);       // "value associated with keyObj"

  myMap.get(keyFunc);      // "value associated with keyFunc"

  ```


  #### 检查键的相等性


  `Map()`中的键相等性基于“same-value”算法，该算法与`===`运算符类似，但将`NaN`视为等于自身（尽管通常`NaN !== NaN`），这意味着当使用`NaN`作为键时，它将返回之前使用`NaN`作为键设置的
  map 对象。请看以下代码片段：


  ```

  let myMap = new Map();

  myMap.set(NaN, "not a number");

  myMap.get(NaN); // "not a number"

  ```


  请注意，你也可以通过一个包含键/值对的可迭代对象来创建 map：


  ```

  let myMap = new Map([

  [ 1, ''apple'' ],

  [ 2, ''banana'' ],

  [ 3, ''orange'' ]

  ]);

  ```


  此外，maps 可以使用`for...of`或`forEach()`进行迭代：


  ```

  for (let [key, value] of myMap) {

  console.log(key + " = " + value);

  }

  // 1 = apple

  // 2 = banana

  // 3 = orange

  ```


  Maps 还支持`keys()`、`values()`和`entries()`方法：


  ```

  for (let key of myMap.keys()) {

  console.log(key);

  }

  // 1

  // 2

  // 3

  for (let value of myMap.values()) {

  console.log(value);

  }

  // apple

  // banana

  // orange

  for (let [key, value] of myMap.entries()) {

  console.log(key + " = " + value);

  }

  // 1 = apple

  // 2 = banana

  // 3 = orange

  ```


  如果你是一位经验丰富的 JS 开发者，你会知道对象是创建无序键/值对作为数据结构的主要机制。然而，使用对象作为 maps 并不能让我们使用非字符串值作为键。


  此时，你一定会想，何时该使用 maps，何时不该使用 maps 而使用对象。当你需要一个键/值集合时，你应该始终使用`Map`，因为对象本质上并不是设计用来作为集合的，因此没有有效的方法来确定对象拥有的属性数量。当你遍历对象的属性时，你也会得到其原型属性。当然，有一些解决方法，但当你遍历对象的属性时，属性不一定会按照插入的顺序被检索到。这就是为什么在
  JavaScript 程序中需要键/值集合时，推荐使用 maps。


  另一个好的判断指标是，当你事先不知道集合的键时，即这些键是从数据库读取或由用户输入的，这意味着它们不一定是字符串或数字。相反，当你在编写代码时就知道对象拥有哪些属性以及有多少属性时，即当它们的结构是静态的时，你应该使用对象。


  #### WeakMap


  `WeakMaps`类似于普通的`Maps`，但方法更少，并且在垃圾回收方面存在一些差异。`WeakMap`是一种键被弱引用的`Map`，这意味着如果对键的所有引用都丢失了，并且没有更多对值的引用，那么`WeakMap`不会阻止其键被垃圾回收。因此，你无需担心`WeakMaps`的内存泄漏。通常，当你需要存储与
  DOM 节点等相关的元数据时，你会希望有这样的行为，这样当 DOM 元素不再被关注时，它们可以被从内存中释放。


  `WeakMap`最大的限制是它是不可迭代的，这与`Map`不同——这意味着它不支持`entries()`、`keys()`、`values()`、`forEach()`和`clear()`方法。这里需要注意的另一件事是，与`Map`不同，在`WeakMap`中，每个键都必须是`object`。


  尽管它拥有与`Map`几乎相同的 API，但我们无法迭代`WeakMap`集合。我们甚至无法确定集合的长度，因为这里我们没有`size`属性。`WeakMap`只有四个方法：


  *   `delete(key)`

  *   `has(key)`

  *   `get(key)`

  *   `set(key, value)`


  ```

  let wMap = new WeakMap();

  wMap.set(''a'', ''b'');

  // Uncaught TypeError: Invalid value used as weak map key

  const o1 = {},

  o2 = () => {},

  o3 = window;

  wMap.set(o1, 42);

  wMap.set(o2, "hello");

  wMap.set(o3, undefined);

  wMap.get(o3); // undefined, 因为这就是设置的值

  wMap.has(o1); // true

  wMap.delete(o1);

  wMap.has(o1); // false

  ```


  ## Set 和 WeakSet


  `Sets`和`WeakSets`是 ES6 中引入的另一种集合类型。如果你来自像 Python 这样的编程语言，你会知道集合是多么有用。让我们在本节中看看它们。


  #### Set


  `Set`对象是唯一值的集合。重复值将被忽略，因为集合必须包含所有唯一的值。`Sets`速度很快，值可以是原始类型或对象引用。


  查看以下代码片段以了解有关集合及其方法的更多信息：




  ```

  let mySet = new Set([1, 1, 2, 2, 3, 3]);

  mySet.size; // 3

  mySet.has(1); // true

  mySet.add(''strings'');

  mySet.delete(''strings''); // true

  mySet.has(''strings''); // false

  mySet.add({ a: 1, b:2 });

  mySet.size; // 4

  mySet.clear(); // 清空集合

  mySet.size; // 0

  ```


  请注意，与映射（Maps）类似，在 `Set` 中 `NaN` 也等于 `NaN`。你可以使用 `forEach` 方法或 `for...of` 循环按照插入顺序遍历集合：


  ```

  mySet = new Set([1, 1, 2, 2, 3, 3, { a: 1, b:2 }]);

  mySet.forEach((item) => {

  console.log(item);

  });

  // 1

  // 2

  // 3

  // Object { a: 1, b: 2 }

  for (let value of mySet) {

  console.log(value);

  }

  // 1

  // 2

  // 3

  // Object { a: 1, b: 2 }

  ```


  如果你需要一个包含唯一元素的动态列表，用于在下拉菜单中渲染或作为输入框的自动建议，集合（Sets）会非常有用。使用 `Set` 可以确保你的建议列表永远不会出现重复值，并省去了检查重复的麻烦。


  #### WeakSet


  与 `WeakMap` 类似，`WeakSet` 对象允许你在集合中存储对象的弱引用，这意味着 `WeakSet` 不会阻止其元素被垃圾回收。`WeakSet`
  中的对象只出现一次；它在集合中是唯一的。


  `WeakMap` 中的值必须是唯一的 `对象` 引用。如果没有其他内容引用 `WeakSet` 中存在的对象，它将被垃圾回收。


  与 `WeakMap` 非常相似，`WeakSet` 是不可遍历的，也没有 `size` 属性。`WeakSet` 仅支持三种方法：


  - `add(value)`

  - `has(value)`

  - `delete(value)`


  ```

  let ws = new WeakSet();

  const obj = {};

  const foo = {};

  ws.add(window);

  ws.add(obj);

  ws.has(window); // true

  ws.has(foo);    // false，foo 尚未添加到集合中

  ws.delete(window); // 从集合中移除 window

  ws.has(window);    // false，window 已被移除

  ```


  当你需要在集合中利用垃圾回收能力时，应优先使用 `WeakSet` 而非 `Set`。另一个典型用例是标记某个对象具有某些属性。请参考以下示例：


  ```

  const fruits = new WeakSet();

  class Fruit {

  constructor() {

  fruits.add(this);

  }

  getName() {

  if (!fruits.has(this)) {

  throw new TypeError("getName() 在不相容的对象上被调用！");

  } else {

  // 返回名称

  }

  }

  }

  ```


  这是一种很好的方式，可以防止在非类构造函数创建的对象上使用类方法。


  ## 总结


  在本章中，我们学习了 ES6 中引入的、用于使用数组和集合处理及操作数据的新有效方法。这些新特性为 ES6 之前处理起来很棘手的常见用例提供了内置解决方案。借助新的数组方法，你可以在
  JavaScript 程序中轻松创建和管理数组。我们还学习了 ES6 中引入的新数组原型方法，这些方法帮助我们高效地遍历和访问存储在数组中的元素。我们还讨论了在处理
  JavaScript 中的二进制数据时，类型数组如何帮助你提升性能。在本章后半部分，我们学习了 ES6 中引入的新集合类型：映射（Maps）、弱映射（WeakMaps）、集合（Sets）和弱集合（WeakSets），它们具有可靠的功能集和有效的用例。


  至此，你应该对在 JavaScript 应用程序中使用这些新数据类型充满信心。在下一章中，我们将深入探讨之前简要介绍过的可迭代对象和迭代器，并学习 ES6 中引入的生成器概念。


