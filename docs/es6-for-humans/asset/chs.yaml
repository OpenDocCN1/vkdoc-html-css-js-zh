  \ `for` 循环，这种循环在遍历集合中的项目时需要额外跟踪当前索引位置。让我们看看如何利用迭代器和生成器在我们的应用程序中高效地处理数据。\n\n## 可迭代对象和迭代器\n\
  \n在最新发布的 ECMAScript 标准中，我们投入了大量精力来改进代码的组织方式。ES6 引入了一套全新的遍历机制，使得实现可迭代对象和迭代器变得非常简单和容易。这一版本的\
  \ JavaScript 引入了一组称为迭代器协议和可迭代对象协议的协议，任何 JavaScript 对象都应实现这些协议才能成为迭代器或可迭代对象。在继续讨论这些协议之前，让我们先了解一下\
  \ JavaScript 中的可迭代对象和迭代器：\n\n简而言之，迭代器模式是一种结构化的模式，用于按特定顺序逐个从元素集合中获取信息。它是一个具有特定接口、专为迭代设计的对象。这种模式一直存在，并通过自定义对象在\
  \ JavaScript 中使用，但通过 ES6，我们迎来了迭代器模式的隐性标准化。JavaScript 中的许多现有数据结构现在都公开了迭代器，你也可以使用相同的标准构建自己的迭代器，从而获得最大的互操作性。\n\
  \n可迭代对象是一系列可以迭代的元素的简单表示。它没有任何迭代状态，例如“当前元素”。相反，它有一个生成迭代器的方法。\n\n迭代器是带有迭代状态的对象。所有迭代器对象都有一个\
  \ `next()` 方法，用于返回集合中的下一个对象。`next()` 方法返回的对象具有两个属性，即：\n\n(i) `value`，表示集合中的下一个值；\n\
  (ii) `done`，是一个布尔值，用于指示序列是否结束。也就是说，只要序列中还有值要返回，它就是 `false`；只有当集合中的值已全部返回时，它才返回 `true`。\n\
  \n每次调用 `next()` 方法都会生成集合中的下一个值。遍历完集合的所有值后，再次调用 `next()` 方法将返回 `value` 为 `undefined`\
  \ 且 `done` 为 `true`。\n\n综上所述，让我们看看如何在 ES6 中手动实现一个迭代器：\n\n```\nfunction myIterator(data)\
  \ {\nlet currentIndex = 0;\nreturn {\nnext: () => {\nconst done = (currentIndex\
  \ >= data.length);\nconst value = !done ? data[currentIndex] : undefined;\ncurrentIndex\
  \ += 1;\nreturn {\ndone,\nvalue\n};\n}\n};\n}\nconst itrObj = myIterator([41, 42,\
  \ 43]);\nitrObj.next();  // { value: 41, done: false }\nitrObj.next();  // { value:\
  \ 42, done: false }\nitrObj.next();  // { value: 43, done: false }\nitrObj.next();\
  \  // { value: undefined, done: true }\n// 此后所有调用\nconsole.log(itrObj.next()); \
  \   // { value: undefined, done: true }\n```\n\n在上述代码片段中，`myIterator()` 函数返回一个含有\
  \ `next()` 方法的对象，每次调用该方法都会返回集合中的下一个值。在最后一个元素之后，返回对象的 `done` 值变为 `true`，且返回的 `value`\
  \ 始终为 `undefined`。\n\n\n\nES6 通过引入 `[Symbol.iterator]` 简化了迭代器的实现过程，该属性用于指定对象的默认迭代器。这个键持有\
  \ `@@iterator` 方法，它是本章后续将讨论的可迭代协议的基础。每当需要对对象进行迭代时（例如在 `for..of` 循环开始时），其 `@@iterator`\
  \ 方法会被无参数调用。该方法返回对象的默认迭代器。在 ES6 中，`@@` 表示一个众所周知的符号。此处，`@@iterator` 指定了存储在对象键 `[Symbol.iterator]`\
  \ 上的迭代器函数。因此，对于上述示例，`@@iterator` 方法将返回 `next()` 函数：\n\n```\nmyIterator[Symbol.iterator]\
  \ = function () {\n  return {\n    next: function () {}\n  }\n}\n```\n\n使用符号作为键来持有迭代器方法，可确保它永远不会与常规对象键冲突。现在，让我们来看一下上述示例在\
  \ ES6 中替换为 `Symbol.iterator` 后的相同场景：\n\n```\nconst arr = [41, 42, 43];\nconst itrObj\
  \ = arr[Symbol.iterator]();\nitrObj.next(); // { value: 41, done: false }\nitrObj.next();\
  \ // { value: 42, done: false }\nitrObj.next(); // { value: 43, done: false }\n\
  itrObj.next(); // { value: undefined, done: true }\n```\n\n当为给定数组 `arr` 调用 `Symbol.iterator`\
  \ 处的 `@@iterator` 方法时，会创建一个新的迭代器。请注意，每次调用时都会创建一个全新的迭代器。可迭代的 ES6 内置数据结构均具有此行为，允许通过\
  \ `next()` 方法对值进行迭代。\n\n让我们以原始字符串值为例：\n\n```\nconst message = \"Ian is an awesome\
  \ student\";\nconst itrObj = message[Symbol.iterator]();\nitrObj.next();      //\
  \ { value: \"I\", done: false }\nitrObj.next();      // { value: \"a\", done: false\
  \ }\n..\n```\n\n在上述示例中，我们能够使用 `next()` 方法对字符串 `message` 的每个字符进行迭代。ES6 还允许我们对新的数据结构（如\
  \ `Map` 和 `Set` 集合）进行迭代。让我们以 `Map` 为例：\n\n```\nconst permissionMap = new Map();\n\
  permissionMap.set(\"admin\", {read: true, write: true, del: true});\npermissionMap.set(\"\
  student\", {read: true, write: false, del: false});\npermissionMap.set(\"faculty\"\
  , {read: true, write: true, del: false});\npermissionMap.set(\"staff\", {read: true,\
  \ write: false, del: true});\nconst permissions= permissionMap[Symbol.iterator]();\n\
  console.log(permissions.next());\n// {value: ['admin', { read: true, write: true,\
  \ del: true }], done: false}\nconsole.log(permissions.next());\n// {value: ['student',\
  \ { read: true, write: false, del: false }], done: false}\nconsole.log(permissions.next());\n\
  // {value: ['faculty', { read: true, write: true, del: false }], done: false}\n\
  console.log(permissions.next());\n// {value: ['staff', { read: true, write: false,\
  \ del: true }], done: false}\nconsole.log(permissions.next());\n// {value: undefined,\
  \ done: true}\n```\n\n在上例中，我们为不同用户类型的权限创建了一个映射，并以用户类型作为键。我们可以通过调用 `@@iterator` 方法简单地创建一个新的迭代器，并使用\
  \ `next()` 对值进行迭代。此处值得注意的一点是，这些集合还提供了用于生成迭代器的 API 方法，例如，你可以使用 `entries()` 方法获取映射的迭代器：\n\
  \n```\nconst permissionEntries = permissionMap.entries();\nconsole.log(permissionEntries.next());\n\
  // {value: ['admin', { read: true, write: true, del: true }], done: false}\nconsole.log(permissionEntries.next());\n\
  // {value: ['student', { read: true, write: false, del: false }], done: false}\n\
  ```\n\n#### 迭代协议\n\n现在我们已对迭代器和可迭代对象有了基本了解，接下来谈谈本章开头简要讨论过的那些协议。迭代协议共有两种：可迭代协议和迭代器协议。任何遵守特定约定的对象都可以实现这些协议。\n\
  \n#### 可迭代协议\n\n\n\n#### 可迭代协议\n\n可迭代协议允许你自定义 JavaScript 对象的迭代行为。该协议规定，所有可迭代对象都必须通过\
  \ `[Symbol.iterator]` 属性实现 `@@iterator` 方法。每当需要迭代某个对象时，就会调用此方法。该方法不接受参数，并返回默认的迭代器，可用于从可迭代对象中获取值。内置的可迭代对象，例如\
  \ `Array`、`Map`、`Set` 等，都有默认的 `@@iterator` 方法，允许我们遍历相应的集合。\n\n#### 迭代器协议\n\n迭代器协议定义了一种从可迭代对象获取值序列的标准方式。该协议规定，迭代器对象必须定义一个\
  \ `next()` 方法，该方法不接受参数，并返回一个包含两个属性的对象：`done` 和 `value`。\n\n#### 作为可迭代对象的迭代器\n\n\
  如果一个迭代器本身也是可迭代对象，那么它可以直接与 `for...of` 循环一起使用。你可以通过为迭代器提供 `Symbol.iterator` 属性（该属性返回迭代器自身）来使其成为可迭代对象。请看下面的代码片段，我们将一个迭代器变成了可迭代对象，然后使用\
  \ `for...of` 循环进行遍历：\n\n```javascript\nconst infiniteSequenceGenerator = {\ncurrentNumber:\
  \ 0,\n// 使 \"infiniteSequenceGenerator\" 这个迭代器成为可迭代对象\n[Symbol.iterator]() {\nreturn\
  \ this;\n},\nnext() {\nreturn {\nvalue: this.currentNumber++,\ndone: false\n}\n\
  }\n};\nconst iter = infiniteSequenceGenerator[Symbol.iterator]();\nconsole.log(iter\
  \ === infiniteSequenceGenerator);   // true\nconsole.log(iter.next().value);   //\
  \ 0\nconsole.log(iter.next().value);   // 1\nconsole.log(iter.next().value);   //\
  \ 2\nconsole.log(iter.next().value);   // 3\nfor (let item of iter) {\nif (item\
  \ > 20) break;\nconsole.log( item );\n}\n// 4\n// 5\n// 6\n// 7\n// ... 20\n```\n\
  \n在上面的示例中，请注意我们是如何直接对可迭代对象使用 `for...of` 循环的，但内部实际上使用了 `next()` 方法，因为在 `for...of`\
  \ 循环中我们得到的数字列表是从 `4` 开始的，我们已经在循环开始前手动使用 `next()` 方法调用了迭代器四次。\n\n## 迭代器中的 `return()`\
  \ 和 `throw()`\n\n迭代器还有两个可选的方法：`return()` 和 `throw()`。大多数内置迭代器并未实现这两个方法，但它们在生成器的上下文中确实具有重要作用，我们将在本章后面部分进行探讨。\n\
  \n在某些情况下，你可能希望最后一个 `{done: true, value: undefined}` 项的 `value` 不是 `undefined`，而是某个其他值。这就是\
  \ `return()` 方法的用武之地。`return()` 方法用于向迭代器发送信号，表明使用该迭代器的代码将不再从迭代器中请求更多的值。当迭代器已消耗完所有值，或遇到异常终止时，可以使用此方法，以便执行清理操作，如关闭数据库连接、保存文件或关闭文件。如果\
  \ `return()` 方法存在，当集合被耗尽时，它将自动被调用；当然，也可以手动调用。`return()` 方法接受一个可选参数，该参数通常作为返回对象中的\
  \ `value` 值传回。\n\n另一方面，`throw()` 用于向迭代器发出关于可能发生的异常或错误的信号。迭代器对 `throw()` 信号的处理方式可以与\
  \ `return()` 不同，因为它不意味着像 `return()` 那样完全停止。我们将在生成器章节中更详细地研究这些方法。\n\n### 生成器\n\n\
  简单来说，生成器是可以暂停的函数。在 ES6 之前，JavaScript 的函数一旦开始运行，就必须运行到完成，期间无法中断任何执行。随着 ES6 的到来，通过生成器，我们引入了一种不同类型的函数，它不像普通函数那样总是运行到完成，而是可以在执行过程中暂停和恢复循环。\n\
  \n生成器是一种允许我们创建特殊类型迭代器的函数，其执行可以被挂起并保留上下文。如果一个函数包含一个或多个 `yield` 表达式，并且使用了 `function\
  \ *` 语法，那么它就是一个生成器：\n\n```javascript\nfunction *gen() {\nyield 42;\n}\n```\n\n在这种语法中，`*`\
  \ 的位置并不重要。生成器可以通过以下几种方式编写：\n\n```javascript\nfunction *gen()  { .. }\nfunction*\
  \ gen()  { .. }\nfunction * gen() { .. }\nfunction*gen()   { .. }\n```\n\n尽管如此，在代码中使用生成器时，最好保持风格一致。在本书的其余部分，我们将使用第一种格式。\n\
  \n#### 生成器函数\n\n生成器函数通过执行函数体中的 `yield` 关键字来暂停，`yield` 可以在函数体中使用任意多次。你可以通过 `yield`\
  \ 表达式返回值。请看下面的例子，我们从一个生成器中 yield 了值 `42`：\n\n```javascript\nfunction *generator\
  \ () {\nyield 42;\n}\n```\n\n生成器执行起来就像任何其他函数一样，你也可以向它传递参数。唯一的区别在于，执行生成器并不会真正运行其内部的代码。它只是生成了一个迭代器，可以用来执行其内部的代码。\n\
  \n```javascript\nfunction *gen() {\nyield \"Hello\";\nyield \"from\";\nyield \"\
  generator\";\n}\n```\n\n现在，如果我们调用这个生成器函数，它不会被执行；相反，它会返回一个迭代器，用于执行其内部的代码。\n\n```javascript\n\
  let obj = gen();\n```\n\n在上面这个生成器中，开头的操作会先运行，然后 `yield` 语句会暂停生成器的执行，直到调用 `next()`\
  \ 方法。方法 `obj.next()` 会继续执行 `gen`，直到遇到下一个 `yield` 表达式：\n\n```javascript\nconsole.log(obj.next());\
  \   // { value: \"Hello\", done: false}\nconsole.log(obj.next());   // { value:\
  \ \"from\", done: false}\nconsole.log(obj.next());   // { value: \"generator\",\
  \ done: false}\nconsole.log(obj.next());   // { value: undefined, done: true}\n\
  ```\n\n`yield` 可以在生成器内部使用任意多次。它也可以是循环的一部分，用于表示重复的暂停点。请注意，`yield` 不仅仅是一个暂停点，它在暂停生成器时还会发出一个值。\n\
  \n```javascript\nfunction *infiniteNumbers() {\nvar n = 1;\nwhile (true) {\nyield\
  \ n++;\n}\n}\nvar numbers = infiniteNumbers(); // 返回一个可迭代对象\nconsole.log(numbers.next());\
  \ // { value: 1, done: false }\nconsole.log(numbers.next()); // { value: 2, done:\
  \ false }\nconsole.log(numbers.next()); // { value: 3, done: false }\n```\n\n每次调用\
  \ `yield` 时，yield 出来的值就成为序列中的下一个值。没有提供值的 `yield` 语句仅表示该值为 `undefined`。\n\n#### 与生成器通信\n\
  \n在上一节中，我们看到了生成器如何使用 `yield` 语句向我们的代码通信。我们也可以通过 `yield` 向生成器函数传递一个值，并在执行恢复时在生成器函数内部使用这些值。请看下面的代码片段：\n\
  \n```javascript\nfunction *calculator() {\nconst num1 = yield \"I am a calculator\"\
  ;\nconst num2 = yield \"I add numbers\";\nconsole.log(`Sum is: ${num1 + num2}`);\n\
  }\nconst myGenerator = calculator();\nconsole.log(myGenerator.next());\n// { value:\
  \ 'I am a calculator', done: false }\nconsole.log(myGenerator.next(2));\n// { value:\
  \ 'I add numbers', done: false }\nconsole.log(myGenerator.next(3));\n// Sum is:\
  \ 5\n// { value: undefined, done: true }\n```\n\n\n\n在上面的例子中，第一次调用`next()`时，生成器\
  \ yield 出`\"I am a calculator\"`字符串然后暂停。第二次调用`next(2)`时，传入的值会被赋值给`num1`，因为在生成器内部，我们指定了在`yield\
  \ \"I am a calculator\"`处 yield 出的任何值都会赋值给`num1`，`num2`同理。因此，第三次调用`next()`时，`Sum\
  \ is: 5`被打印到控制台，并且由于没有更多的`yield`语句，`undefined`被作为值返回。\n\n生成器与代码良好通信的这种行为在异步编程场景中非常有用。生成器可以使你的异步代码看起来像同步代码。考虑另一个例子，演示生成器和异步代码如何良好协作：\n\
  \n```javascript\nfunction getFlightDurations() {\n  setTimeout(() => {\n    flightIterator.next({\n\
  \      Qatar: \"39h 0m\",\n      Emirates: \"40h 20m\"\n    });\n  }, 1200);\n}\n\
  function getFlightPrices() {\n  setTimeout(function(){\n    flightIterator.next({\n\
  \      Qatar: \"$2010\",\n      Emirates: \"$1904\"\n    })\n  }, 1000);\n}\nfunction\
  \ *getFlights() {\n  const allFlights = [\"Qatar\", \"Emirates\"];\n  const flightDurations\
  \ = yield getFlightDurations();\n  const flightPrices = yield getFlightPrices();\n\
  \  for (let flight of allFlights) {\n    console.log(`New York to Auckland takes\
  \ ${flightDurations[flight]} in ${flight} airlines for around ${flightPrices[flight]}`);\n\
  \  }\n}\nconst flightIterator = getFlights();\nflightIterator.next();\n// New York\
  \ to Auckland takes 39h 0m in Qatar airlines for around $2010\n// New York to Auckland\
  \ takes 40h 20m in Emirates airlines for around $1904\n```\n\n在上面的例子中，`genFlights()`是一个生成器函数，它返回一个迭代器。在调用返回的迭代器的`next()`方法时，生成器执行到第一个`yield`语句，该语句调用了`getFlightDurations()`。`getFlightDurations()`是一个异步函数，它使用`setTimeout`将执行延迟\
  \ 1.2 秒，并在迭代器上调用`next()`方法，确保`flightDurations`能被正确赋值。`flightPrices`同理，当`getFlightPrices()`中再次调用`next()`方法时，输出结果会被打印到控制台。如果我们在这里没有使用`yield`，`flightDurations`和`flightPrices`只会被赋值为`undefined`，因为在赋值时函数本身返回了`undefined`。使用`yield`语句可以防止在`setTimeout`函数执行之前赋值。这就是生成器如何帮助我们编写阻塞式异步代码，使代码看起来更同步。\n\
  \n## 提前完成\n\n在本章前面，我们讨论了迭代器有两个可选方法：`return(...)`和`throw(...)`，它们在生成器上下文中具有很大相关性。一旦调用这些方法，它们会立即结束暂停生成器中的序列。例如，请看以下代码片段：\n\
  \n```javascript\nfunction *getFruits() {\n  yield \"apple\";\n  yield \"orange\"\
  ;\n  yield \"banana\";\n}\nconst fruitIterator = getFruits();\nconsole.log(fruitIterator.next());\
  \           // {value: 'apple', done: false}\nconsole.log(fruitIterator.return(\"\
  kiwi\"));  // {value: 'kiwi', done: true}\nconsole.log(fruitIterator.next());  \
  \         // {value: undefined, done: true}\n```\n\n在上面的例子中，`return(\"kiwi\")`返回了传入的参数值`\"\
  kiwi\"`并结束序列，因此`done`为`true`。这等同于在生成器函数中有一个返回值，不过你应该始终牢记，遍历从生成器获得的序列时，不包括`{ done:\
  \ true }`所表示的值。例如，检查以下代码片段，我们正在遍历集合`fruitIterator`，它只包含在源生成器中调用`return()`方法之前 yield\
  \ 出的元素：\n\n```javascript\nfunction *getFruits() {\n  yield \"apple\";\n  yield \"\
  orange\";\n  yield \"banana\";\n  return \"kiwi\";\n  yield \"watermelon\";\n}\n\
  const fruitIterator = getFruits();\nfor (let fruit of fruitIterator) {\n  console.log(fruit);\n\
  }\n// apple\n// orange\n// banana\n```\n\n你也可以通过将代码包装在`try-finally`块中来避免序列立即终止，确保无论序列是提前完成还是`yield`语句耗尽，`finally`子句中的代码都会执行。这在序列结束后执行清理或关闭操作时非常有用。例如，请看以下代码片段：\n\
  \n```javascript\nfunction *getFruits() {\n  try {\n    yield \"apple\";\n    yield\
  \ \"orange\";\n    yield \"banana\";\n  }\n  finally {\n    console.log(\"You must\
  \ always eat a big watermelon\");\n    yield \"watermelon\";\n  }\n}\nconst fruitIterator\
  \ = getFruits();\nconsole.log(fruitIterator.next());\n// { value: 'apple', done:\
  \ false }\nconsole.log(fruitIterator.return(\"kiwi\"));\n// You must always eat\
  \ a big watermelon\n// { value: 'watermelon', done: false }\nconsole.log(fruitIterator.next());\n\
  // { value: 'kiwi', done: true }\nconsole.log(fruitIterator.next());\n// { value:\
  \ undefined, done: true }\n```\n\n在上面的例子中，一旦`finally`块中的表达式执行完毕，序列将以`value`为`'kiwi'`且`done`为`true`终止，其中`'kiwi'`是作为参数传递给`return(...)`方法的。\n\
  \n类似地，`throw(...)`也会停止生成器的执行，但它永远不会被自动调用。当您可能想要警告用户一些意外错误时，这个方法会很有用，利用`try-catch`块在生成器中启用错误处理。例如，请看以下代码片段：\n\
  \n```javascript\nfunction *getFruits() {\n  yield \"apple\";\n  yield \"orange\"\
  ;\n  yield \"spinach\";\n  yield \"watermelon\"\n}\nconst fruitIterator = getFruits();\n\
  for (let fruit of fruitIterator) {\n  try {\n    console.log(fruit);\n    if (fruit\
  \ === \"spinach\") {\n      fruitIterator.throw(\"Vegetable Found\");\n    }\n \
  \ }\n  catch (err) {\n    console.log(`Exception: ${err}`);\n  }\n}\n// apple\n\
  // orange\n// spinach\n// Exception: Vegetable Found\n```\n\n注意`\"watermelon\"`从未从生成器\
  \ yield 出来，因为当`\"spinach\"`被返回时调用了`throw()`，从而停止了序列的执行。\n\n## 总结\n\nES6 引入的迭代器和生成器提供了对集合中存储值的顺序访问，并允许我们自定义遍历这些值的方式。ES6\
  \ 还引入了一组新的协议来定义迭代器和可迭代对象，称为迭代协议。在本章中，我们学习了如何使用独特的`Symbol.iterator`属性定义对象的默认迭代器。当在对象上提供`Symbol.iterator`时，该对象被视为可迭代对象。\n\
  \n在本章的后半部分，我们还学习了生成器函数，它由星号（*）字符和函数体中的一个或多个`yield`语句表示。它们是特殊类型的函数，可以在执行过程中暂停和恢复。\n\
  \n"
- '# 9. ES6 中的 Promise


  众所周知，JavaScript 在设计上是单线程的。在浏览器中，它使用事件处理来并发管理许多任务。JavaScript 引擎管理一个事件队列，当事件发生时，会调用注册的处理函数。如果你有传统
  JavaScript 的经验，那么你很清楚理解异步编程是正确使用 JavaScript 的必备条件。使用异步的主要模式是通过回调函数。ES6 为标准 JavaScript
  规范带来了一个新特性 —— Promise（一些新的和最新的 JS 库和框架中已有的特性），它解决了回调（唯一的异步方法）中的许多重大问题。


  ### Promise 概述




  在某些需要等待异步操作完成然后执行任务的情况下，JavaScript 严重依赖回调函数，允许代码执行绕过长时间运行的任务继续进行。您一定已经知道`setTimeout`、`XMLHttpRequest`以及所有基于浏览器的异步函数都是基于回调的。虽然这个概念在理论上简单易懂，但它可能导致一些非常令人困惑且难以理解的代码，尤其是在需要在回调之后进行回调（嵌套回调）的情况下，这通常被称为“回调地狱”。例如，考虑以下代码片段，其中必须先发生
  X，然后发生 Y，最后发生 Z：


  ```

  x = getData();

  y = getMoreData(x);

  z = getMoreData(y);

  ```


  在 ES6 之前，您可以异步获取`x`，然后将其作为参数传递给获取`y`的函数，对`z`也是如此，使用回调的方式如下：


  ```

  getData(function(x){

  getMoreData(x, function(y){

  getMoreData(y, function(z){

  ...

  });

  });

  });

  ```


  在实际应用中，当您有大量回调函数时，这可能会变得越来越复杂，从而形成回调金字塔。这些回调金字塔无处不在——在处理 HTTP 请求、数据库操作、动画、进程间通信以及其他各种场景中都会出现。通常，使用回调函数的代码会变得更难理解、重构和测试。


  这就是 Promise 的用武之地。Promise 为我们提供了一种更可控的模式来处理异步处理。它们代表了一个可以在未来某个时间点处理的值，并提供了一种摆脱回调地狱的方法。与基于回调的方法相比，Promise
  为执行、组合和管理异步操作提供了一种更简单的替代方案。它们还使得代码的逻辑流程更容易理解。


  ES6 原生支持 Promise。一个 Promise 是一个等待异步操作完成的对象，当该操作完成时，该 Promise 要么被兑现（fulfilled），要么被拒绝（rejected）。一个
  Promise 对象可以处于以下三种状态之一：


  *   `fulfilled` – 当 Promise 成功时

  *   `rejected` – 当 Promise 失败时

  *   `pending` – 当它既未兑现也未拒绝时


  一个待定（pending）的 Promise 可能会转换为兑现（fulfilled）或拒绝（rejected）状态，并且当 Promise 被兑现或拒绝时，它被认为已敲定（settled）。需要注意的是，一个已敲定的
  Promise 是不可变的，这意味着一旦 Promise 被敲定，就不能重新敲定。


  #### 创建 Promise


  Promise 是使用`new Promise()`构造函数创建的，该构造函数接受一个执行器（一个函数），该函数有两个参数：


  *   第一个参数（通常命名为`resolve`）是一个函数，当未来值就绪时，即 Promise 被兑现时，会调用该函数；

  *   第二个参数（通常命名为`reject`）是一个函数，如果它无法解决未来值，则调用该函数来拒绝 Promise。


  执行器启动一些异步工作，然后一旦完成，就调用`resolve`或`reject`函数来兑现 Promise，或者如果发生错误则拒绝它。


  一个简单的 Promise 如下所示：


  ```

  const p = new Promise((resolve, reject) => {

  if (/* some condition */) {

  resolve(/* some value */);  // fulfilled successfully

  } else {

  reject(/* some reason */);  // error, rejected

  }

  });

  ```


  第二个方法（`reject`）是可选的，您可以只使用`resolve`方法来创建 Promise，如下面的代码片段所示，其中 Promise 分别被兑现和拒绝：


  ```

  new Promise(resolve => resolve()) // promise is fulfilled

  new Promise((resolve, reject) => reject()) // promise is rejected

  ```


  您也可以使用以下方式创建一个立即兑现的 Promise：


  ```

  const sayHello = Promise.resolve("hello!");

  ```


  类似地，您也可以使用`Promise.reject(value)`来拒绝一个 Promise。不带值地兑现或拒绝 Promise 并不十分有用。通常，一个 Promise
  会兑现为某个值，该值可能是来自 HTTP 请求、动画或其他异步操作的结果。


  一旦创建，一个 Promise 只能被敲定，这意味着它要么被兑现，要么被拒绝。并且如上所述，由于已敲定的 Promise 是不可变的，因此已敲定的值或失败原因不能被更改（该值也可以是`undefined`）。然而，一个对象可以用作已兑现的值，并且对象的属性可能会发生改变。


  #### 使用`then()`和`catch()`消费 Promise


  一旦创建了 Promise，它可以作为一个值传递，本质上表示未来值的占位符。当 Promise 被兑现时，可以使用`.then()`方法来消费这个值。此方法接受一个函数，该函数将在
  Promise 被兑现时被传递已兑现的值。例如，考虑以下代码片段：


  ```

  const p = new Promise((resolve, reject) => resolve(42));

  p.then((val) => console.log(val)); // 42

  ```


  每个 Promise 都必须有一个`.then()`方法，它实际上接受两个可能的参数。第一个参数是 Promise 被兑现时要调用的函数，第二个参数是 Promise
  被拒绝时要调用的函数，如图 9-1 所示。


  ![A431489_1_En_9_Fig1_HTML.gif](img/A431489_1_En_9_Fig1_HTML.gif)


  图 9-1.


  一个待定的 Promise 可以被兑现或拒绝，并使用`.then()`方法进行处理


  ```

  p.then((value) => { console.log("Promise Fulfilled:", value) },

  (error) => { console.log("Promise Rejected: ", error) });

  ```


  如果给定的 Promise 总是被解决，我们可以为了简单起见省略第二个参数。查看以下示例，其中顾客在订单下达五秒后收到他的披萨：


  ```

  const pizza = new Promise((resolve) => {

  console.log("Getting your pizza in 5 seconds...");

  setTimeout(() => {

  resolve("Onion Pizza");

  }, 5000);

  });

  pizza.then(

  (item) => { console.log(`Order Received: ${item}`) },

  (error) => { console.log("Something went wrong with your pizza") }

  );

  // Getting your pizza in 5 seconds...

  // Order Received: Onion Pizza

  ```


  此示例演示了两件事：


  *   首先，我们附加到 Promise 上的处理程序是在所有其他代码异步运行之后才被调用的。

  *   其次，兑现处理程序仅在 Promise 被兑现时被调用，并传入它被解决时的值（在我们的例子中，是洋葱披萨）。拒绝处理程序也是如此。


  这是另一个消费 Promise 的典型示例，其中`getRentalList(location)`是异步的，并使用返回 Promise 的 Web 服务返回给定位置当前可用的租赁房产列表：


  ```

  const housingPromise = getRentalList("London");

  housingPromise.then(

  (res) => {

  if (res.properties && res.properties.length > 0) {

  console.log(`We found the houses for you: ${res.properties}`);

  } else {

  console.log(`Sorry, no housing is available in ${res.location}`);

  }

  },

  (error) => {

  console.log(`Something went wrong: ${error}`);

  }

  );

  ```


  如果您只对拒绝 Promise 感兴趣，可以省略第一个参数并将其传递为`null`。例如，查看以下代码片段：


  ```

  const networkReq = new Promise((resolve, reject) => {

  reject("No Server Found");

  });

  networkReq.then(

  null,

  (error) => { console.log(error); }

  );

  ```


  一方面，如果处理程序在`.then()`调用中返回一个值，它会在返回时自动包装在一个 Promise 中。这些`.then()`调用可以被链式调用。我们将在下一节详细讨论
  Promise 链式调用的工作原理。另一方面，您也可以使用`catch()`方法以更紧凑的方式处理被拒绝的 Promise。例如，您可以重写上面的示例如下：


  ```

  networkReq.catch((error) => { console.log(error); });

  ```




  '
- "# `catch()` 方法与 Promise 链式调用\n\n`catch()` 方法在 Promise 组合中用于错误处理非常有用。与 `then()`\
  \ 方法类似，它也会返回一个 Promise，但只处理被拒绝的情况。`catch()` 方法相当于 `then(null, onRejected)` 的简写形式。我们将在本章后面进一步学习如何处理错误。\n\
  \n## Promise 的链式调用\n\n由于 `.then()` 和 `.catch()` 始终返回一个新的 Promise，因此可以轻松地链式调用 Promise，同时高度控制错误处理的方式和位置。链式调用允许将异步操作串联起来，确保它们按照正确且预期的顺序执行，从而使代码看起来几乎是同步的。请看以下示例：\n\
  \n```\nconst bond = new Promise((resolve, reject) => {\n  resolve(\"Bond\");\n});\n\
  bond.then((str) => `${str}, James ${str}`)\n  .then((str) => `Hello, I'm ${str}!`)\n\
  \  .then((str) => console.log(str));\n// Hello, I'm Bond, James Bond!\n```\n\n上面是一个简单的示例，展示了链式调用如何帮助按顺序执行不同任务并获得最终结果。让我们看看下面这段更实际的代码片段，它演示了链式调用在处理异步任务时的优势：\n\
  \n```\ngetPaymentFromUser\n  .then(displayTransactionDetails)\n  .then(queueTransactionEmail)\n\
  \  .then(redirectToOrdersPage)\n  .catch(logError)\n```\n\n这里，`getPaymentFromUser`\
  \ 返回一个 Promise，链中的每个函数都会在前一个处理器完成后，被调用并传入其返回值。在这个例子中，`displayTransactionDetails()`\
  \ 会等待 `getPaymentFromUser()` 完成后再开始；`queueTransactionEmail()` 会等待 `displayTransactionDetails()`\
  \ 完成后再开始，依此类推。需要注意的是，`logError()` 仅在之前的任意一个 Promise 被拒绝时才会执行。这种方式将调用串行化，而不会阻塞主执行线程，并确保这些操作按顺序执行。\n\
  \n#### 错误处理\n\n在本章前面，我们讨论了在消费 Promise 时如何处理错误，可以通过以下任意一种方式：\n\n```\nsomePromise().then(onResolved,\
  \ onRejected);\n// 或者直接使用 catch()\nsomePromise()\n  .then(onResolved)\n  .catch(onRejected);\n\
  ```\n\n但你应该更倾向于哪一种方式，为什么呢？这个问题的答案取决于你的 `onResolved()` 函数是否会抛出错误。`then()` 方法返回的 Promise\
  \ 可能会被拒绝，但如果使用第一种方式，这个拒绝无法被捕获——导致错误在你的应用中被忽略。而使用第二种方式，无论是来自 `somePromise()` 还是 `onResolved()`\
  \ 的错误，都可以在 `catch()` 方法中得到处理。如果我们有多个 `then()` 调用，错误会一直传递下去，直到遇到错误处理器。因此，建议在所有 Promise\
  \ 链的末尾都加上一个 `catch()` 方法。\n\n## 使用 `Promise.all` 组合 Promise\n\n`Promise.all` 接收一个\
  \ Promise 数组（或任何可迭代对象），并返回一个 Promise。当可迭代参数中的所有 Promise 都 resolve 时，该返回的 Promise\
  \ 会 resolve；如果任何一个 Promise 拒绝，它就会以第一个拒绝的 Promise 的原因 reject。\n\n如果传入的任意一个 Promise\
  \ 被拒绝，那么所有 Promise 会立即以该拒绝的 Promise 的值 reject，并丢弃所有其他 Promise，无论它们是否已 resolve。注意，如果传入一个空数组，该方法会立即\
  \ resolve。\n\n```\nconst p1 = Promise.resolve(3);\nconst p2 = 42;\nconst p3 = new\
  \ Promise((resolve, reject) => {\n  setTimeout(resolve, 100, \"foo\");\n});\nPromise.all([p1,\
  \ p2, p3]).then(values => {\n  console.log(values); // [3, 42, \"foo\"]\n});\n```\n\
  \n然而，在某些情况下，你可能不想等待数组中的所有 Promise 都 resolve，而只是想获取数组中第一个完成的 Promise 的结果。在这种情况下，可以使用\
  \ `Promise.race()`。\n\n`Promise.race()` 也接收一个 Promise 数组，但与 `Promise.all()` 不同，它会在数组中第一个\
  \ Promise 完成时立即兑现其返回的 Promise。例如，假设我们想从 API 端点获取一些 JSON 数据，但不想无限等待响应。在这种情况下，我们只想使用一个默认值。我们可以使用\
  \ `Promise.race()` 来实现这一点：\n\n```\n// 一个在给定时间（t）后超时的 Promise\nfunction delay(t)\
  \ {\n  return new Promise((resolve, reject) => {\n    setTimeout(resolve, t);\n\
  \  });\n}\n// 哪个 Promise 先完成，其结果就会被传递到我们的处理器中\nPromise.race([\n    fetchData(),\n\
  \    delay(5000).then(() => { data: \"test\" })\n  ])\n  .then((res) => {\n    //\
  \ 如果 fetchData() 耗时超过 5 秒，这里将是 \"test\"\n    console.log(\"data:\", res.data);\n\
  \  })\n  .catch(function(err) {\n    console.log(\"error:\", err);\n  });\n```\n\
  \n在这个例子中，`delay()` 函数返回一个在 `t` 毫秒后 resolve 的新 Promise。然后我们为该返回的 Promise 附加一个处理器，返回默认的用户对象\
  \ `{user: \"guest\"}`。这确保了如果在 5 秒内从服务器获取到用户数据，我们将获得用户详情；否则将使用一个访客用户。\n\n## 总结\n\n\
  Promise 已成为处理大量异步操作的标准方法。在本章中，我们学习了如何正确使用 Promise 来编写易于阅读的代码，这使得它们比传统回调函数更容易调试。它们允许我们组合异步\
  \ API，并让我们用真正的 Promise 封装不符合规范的 Promise API 或回调 API。与回调和事件不同，Promise 帮助我们避免竞态条件，并确保其表示的值的不可变性。Promise\
  \ 让我们能够以同步风格编写异步代码，拥有平坦的缩进和单一的异常处理通道。\n\n"
- "# 10. 元编程\n\n“元”这个术语描述了某种本质上自指的特性。在编程领域，元编程意味着对程序本身的编程进行编程。它可以检查或修改程序的结构，或者改变语言本身的工作方式。ES6\
  \ 引入了一系列与元编程相关的重要特性，为程序的代码机制提供了底层钩子。在本章中，我们将深入探讨这些特性，并了解元编程在 JavaScript 中是如何工作的。\n\
  \n## ES5 与 ES6 中元编程概述\n\n元编程的概念对 JavaScript 来说并不新鲜。你可能每天都在使用元编程，甚至没有意识到这一点。例如，检查一个对象是否是另一个对象的原型，我们使用\
  \ `a.isPrototypeOf(b)`。这就是元编程的一种形式。通常，所有 `Object.*` 方法都可以被视为元编程的一种形式。元编程提供了一种利用语言特性和功能的方法，使你能够创建更灵活的程序，并高效地处理应用程序的自定义需求。\n\
  \n元编程的一个关键策略是反射。它允许我们在运行时检查或修改程序的结构，或者改变内部行为（特别是元数据属性和函数）。ES6 通过三种形式的元编程提供了反射能力。\n\
  \n元编程有三种形式：自省、自我修改和调解。\n\n- **自省（Introspection）** – 当代码检查自身时，例如：`a.isPrototypeOf(b)`\
  \ 就是自省。`typeof`、`instanceof` 也是自省操作符，因为它们收集有关代码的信息。\n- **自我修改（Self-modification）**\
  \ – 当你修改程序的结构时。一个例子是 `Object.defineProperty()` 方法，它可以在对象上定义一个新属性，或者修改已有属性（如果存在的话）。\n\
  \n\n\n```javascript\nlet cake = {};\nconsole.log(cake);      // {}\nObject.defineProperty(cake,\
  \ \"ingredients\", {\n  value: [\"sugar\", \"all things nice\"],\n  enumerable:\
  \ true,\n  configurable: true,\n  writable: true\n});\nconsole.log(cake);\n// {\
  \ ingredients: [ 'sugar', 'all things nice' ] }\n```\n\n在上述示例中，请注意我们是如何使用 `Object.defineProperty()`\
  \ 修改 `cake` 对象结构的。自修改指的是在运行时访问或创建新属性以及修改程序结构的能力。\n\n- **中介** – 当你的代码修改了默认行为，从而影响到其余代码时，就涉及中介。中介处理的是语言语义的修改，或者在运行时向程序添加新结构。这是\
  \ ES6 中的新特性，我们将在本章后续内容中进一步了解。\n\nES6 通过三个新的 API 引入了元编程：`Symbol`、`Proxy` 和 `Reflect`。在本书前面的内容中，我们已经看到符号如何让我们创建唯一且不可变的标识符。它们为我们提供了一种高效的方式，为对象创建唯一且不可枚举的属性，这对于将对象的元数据与其公共接口分离非常有用。符号还能帮助我们自定义对象的默认迭代行为，本质上是通过允许我们在运行时修改程序行为或为对象创建新的（且唯一的）属性，来提供反射（自修改）能力。现在，让我们来看看\
  \ `Proxy` 和 `Reflect` 带来了什么。\n\n## ES6 中的代理\n\n代理代表了元编程的中介形式。代理对象允许我们拦截任何程序的行为。它们使我们能够修改对象的操作并实现自定义行为。简而言之，对象上可以执行许多操作，而代理帮助我们修改这些操作并实现所需的行为。这些操作可以是属性查找、赋值、枚举、函数调用等。\n\
  \n代理对象会包裹目标对象并修改其行为。我们可以通过以下方式创建代理：\n\n```javascript\nconst proxy = new Proxy(target,\
  \ handler);\n```\n\n其中，`target` 是其行为被修改的对象，`handler` 是一个对象，其属性是函数（称为陷阱），当对代理执行各种操作时会调用这些函数。处理程序对象允许我们定义目标对象的新行为。它使我们能够在将操作转发给目标/被包裹对象之外，执行额外的逻辑。\n\
  \n## 代理处理程序中的陷阱\n\n处理程序对象提供了一系列方法，这些方法作为代理的陷阱。这些方法是可选的，如果未定义陷阱，则默认行为是将操作转发给目标对象。\n\
  \n最常见的陷阱是针对 getter 和 setter 的。例如，请看下面的代码片段，我们在其中为 get 属性访问器方法定义了一个陷阱：\n\n```javascript\n\
  const restaurant = {\n  soda: 2,\n  burger: 1\n};\nconst restHandler = {\n  get:\
  \ function(target, property) {\n    if (property in target && target[property] >\
  \ 0) {\n      target[property] -= 1;\n      return `享受您的${property}吧`;\n    }\n\
  \    return `抱歉，我们的${property}已经卖完了！`;\n  }\n};\nconst restProxy = new Proxy(restaurant,\
  \ restHandler);\nconsole.log(restProxy.soda);\n// 享受您的 soda 吧\nconsole.log(restProxy.soda);\n\
  // 享受您的 soda 吧\nconsole.log(restProxy.soda);\n// 抱歉，我们的 sodas 已经卖完了！\nconsole.log(restProxy.burger);\n\
  // 享受您的 burger 吧\nconsole.log(restProxy.burger);\n// 抱歉，我们的 burgers 已经卖完了！\n```\n\
  \n在上面的示例中，我们有一个 `restaurant` 对象，其中包含可用库存的列表和数量。我们使用代理来包裹 `restaurant` 对象，这使我们能够拦截（或“捕获”）`restaurant`\
  \ 对象的原生操作，并对其执行修改后的行为。这里，`handler` 对象包含一个针对 get 属性访问器的陷阱，该陷阱在被调用时接收 `target` 和属性名。此方法会捕获所有“get\
  \ 属性访问器”的调用，并检查该属性是否存在且其值是否大于 0，如果是，则将其值减 1，并返回消息 `享受您的${property}吧`；否则，返回消息 `抱歉，我们的${property}已经卖完了！`。这个“get”陷阱可用于捕获目标对象上的所有\
  \ getter 事件。类似地，你也可以拦截 setter 事件。例如，请看下面的代码片段：\n\n```javascript\nconst restaurant\
  \ = {\n  soda: 5\n};\nconst restHandler = {\n  set: function(target, property, value)\
  \ {\n    target[property] = value;\n    console.log(`${property} 已添加到库存中`);\n  }\n\
  }\nconst restProxy = new Proxy(restaurant, restHandler);\nrestProxy.beer = 10;\n\
  // beer 已添加到库存中\n```\n\n在这个示例中，我们重写了 set 属性访问器方法，覆盖了默认的赋值操作。在进行验证时，代理可能非常有用。我们可以使用\
  \ set 处理程序轻松验证传递给对象的值。例如，假设我们在创建一个投票应用，只有年满 18 岁且拥有该国居留权的人才能投票：\n\n```javascript\n\
  const voterValidator = {\n  set: function(obj, prop, value) {\n    if (prop ===\
  \ \"age\") {\n      if (!Number.isInteger(value)) {\n        throw new TypeError(\"\
  输入的年龄不是整数\");\n      }\n      if (value < 18) {\n        throw new RangeError(\"\
  输入的年龄无效\");\n      }\n    } else if (prop === \"residency\") {\n      if (value\
  \ === false) {\n        throw new Error(\"必须有居留权才能投票\");\n      }\n    }\n    //\
  \ 存储值的默认行为\n    obj[prop] = value;\n    // 表示成功\n    return true;\n  }\n};\nconst\
  \ person = new Proxy({}, voterValidator);\nperson.age = 23;\nperson.residency =\
  \ false;     // 抛出异常\nperson.age = \"young\";         // 抛出异常\nperson.age = 200;\
  \             // 抛出异常\n```\n\n`set` 陷阱的另一个很好的用例是数据绑定，你可以在其中设置一个回调方法，当属性被设置时会调用该方法，并且该回调方法可以对目标对象属性的更改做出响应。\n\
  \n除了 setter 和 getter，代理还提供了一系列你可以设置的其他陷阱。以下是一些可以帮助你更好地理解代理的陷阱。\n\n### has\n\n`has`\
  \ 用于拦截 `in` 操作符。如果你想隐藏对象的某个特定属性，`has` 会非常有用。即使该属性存在于对象上，我们也可以返回 `false`。请看下面的示例，我们使用\
  \ `has` 方法拦截 `in` 操作符，从而隐藏 `restaurant` 对象中的 `beer` 库存。\n\n```javascript\nconst\
  \ restaurant = {\n  soda: 5,\n  beer: 10\n};\nconst restHandler = {\n  has: function(target,\
  \ property) {\n    if (property === \"beer\") {\n      return false;\n    }\n  \
  \  return property in target;\n  }\n}\nconst restProxy = new Proxy(restaurant, restHandler);\n\
  console.log(\"beer\" in restProxy);    // false\nconsole.log(\"soda\" in restProxy);\
  \    // true\n```\n\n在上面的示例中，所有 `in` 操作符的调用都会被 `has` 方法捕获，如果属性名是 `\"beer\"`，则返回\
  \ `false`；否则保持默认行为（检查属性是否在目标对象中）。请注意，`has` 只能帮助你阻止通过 `in` 操作符检测特定属性。该属性仍然是可枚举的，并且可以通过\
  \ `for...in` 循环访问。\n\n\n\n### ownKeys\n\n`ownKeys`用于拦截通过`Object.keys()`、`Object.getOwnPropertyNames()`或`Object.getOwnSymbolProperties()`访问自有属性和自有符号属性的行为。它还可以与`has`陷阱处理器结合使用，以增强目标对象属性的私密性（请注意，这些属性仍然不是完全私有的）：\n\
  \n```\nconst restaurant = {\nsoda: 5,\nbeer: 10\n};\nconst restHandler = {\nhas:\
  \ function(target, property) {\nif (property === \"beer\") {\nreturn false;\n}\n\
  return property in target;\n},\nownKeys: function(target) {\nreturn [\"soda\"];\n\
  }\n}\nconst restProxy = new Proxy(restaurant, restHandler);\nconsole.log(\"beer\"\
  \ in restProxy);          // false\nconsole.log(Object.keys(restProxy));       //\
  \ [\"soda\"]\n```\n\n你还可以添加另一个陷阱处理器：`getOwnPropertyDescriptor`，它用于拦截`Object.getOwnPropertyDescriptor()`调用，以进一步增强私密性。\n\
  \n### apply\n\n`apply`用于拦截函数调用。它接受三个参数：\n\n*   `target`：行为被修改的目标函数；\n*   `context`：调用时作为`this`传递给目标函数的上下文；\n\
  *   `args`：调用时传递的参数。\n\n看看下面的代码片段，我们使用`apply`陷阱处理器对最终账单金额应用季节性折扣：\n\n```\nfunction\
  \ getBill(amount) {\nreturn amount;\n}\nconst billHandler = {\napply: function(target,\
  \ context, args) {\nconsole.log(\"Applying Discount of 35%\");\nreturn args[0] -\
  \ (args[0] * 0.35);\n}\n}\nconst billProxy = new Proxy(getBill, billHandler);\n\
  console.log(billProxy(300));\n// Applying Discount of 35%\n// 195\n```\n\n由于这里的目标对象是一个函数，这些也被称为函数陷阱，你也可以为`.call()`和`.bind()`方法设置陷阱。\n\
  \n到目前为止，我们已经介绍了足够多的陷阱处理器，让你对整体概念有所了解。我们看到了`Proxy`如何帮助我们拦截设置器（setter）和获取器（getter）、装饰对象、添加验证规则、增强私密性，以及本质上修改对象的默认行为。你可以通过以下链接探索更多陷阱处理器：[`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Meta_programming)。\n\
  \n## 可撤销代理（Revocable Proxy）\n\nES6 允许我们创建可撤销的代理。`Proxy.revocable()`方法用于创建一个可撤销的代理对象。与代理对象类似，它也需要一个处理器和一个目标对象，并返回一个新创建的可撤销代理对象。\n\
  \n一个可撤销代理对象有两个属性：`proxy`和`revoke`。\n\n```\nconst { proxy, revoke } = Proxy.revocable(target,\
  \ handler);\n```\n\n其中：\n\n*   `proxy` – 通过`new Proxy(target, handler)`调用创建的`Proxy`对象。\n\
  *   `revoke` – 一个无参函数，用于使代理失效（关闭）。\n\n如果调用了`revoke()`函数，代理将变得不可用，这意味着对处理器的任何陷阱都会抛出`TypeError`。代理一旦被撤销，将保持撤销状态并可被垃圾回收。后续对`revoke`的调用没有进一步效果。请看下面的代码片段示例：\n\
  \n```\nconst restaurant = {\nsoda: 10,\nbeer: 5\n};\nconst { proxy, revoke } = Proxy.revocable(restaurant,\
  \ {});\nconsole.log(proxy.soda);   // 10\nconsole.log(proxy.beer);   // 5\nrevoke();\n\
  console.log(proxy.soda);   // TypeError: Revoked\n```\n\n由于可撤销代理允许你完全切断代理及其陷阱，它可以在某些情况下用于增强对象的安全性，例如在检测到试图访问私有属性时撤销代理。我们可以修改上面的示例来增强`beer`属性的私密性，如下所示：\n\
  \n```\nconst restaurant = {\nsoda: 10,\nbeer: 5\n};\nconst resthandler = {\nget:\
  \ function(target, property) {\nif (property === \"beer\") {\nrevoke();\nreturn\
  \ undefined;\n}\nreturn target[property];\n}\n}\nconst { proxy, revoke } = Proxy.revocable(restaurant,\
  \ resthandler);\nconsole.log(proxy.soda);    // 10\nconsole.log(proxy.beer);   \
  \ // undefined\nconsole.log(proxy.soda);    // TypeError: Revoked\n```\n\n在上面的示例中，如果访问了`beer`属性，我们会返回`undefined`并撤销代理，从而切断通过代理对目标对象的后续调用。\n\
  \n到目前为止，我们已经了解了 ES6 中的自修改和中介（intercession）机制。现在，让我们来看看通过内省（introspection）实现的反射。\n\
  \n### Reflect\n\n`Reflect`是一个内置的全局对象，提供了一系列内省方法。这些方法本质上是收集关于对象运行时元操作的信息。除了已有的内省方法如`typeof`、`instanceof`等，`Reflect`作为一个单一对象包装器，封装了许多仅通过\
  \ JavaScript 引擎内部可访问的重要内部方法。`Reflect`的一个简单实现如下：\n\n```\nconst restaurant = {\nsoda:\
  \ 10,\nbeer: 5\n};\nconsole.log(Reflect.ownKeys(restaurant));\n// [\"soda\", \"\
  beer\"]\n```\n\n请注意，`Reflect`是一个静态对象，因此不能与`new`关键字一起使用。\n\n对于 ES6 `Proxy`中的每一个陷阱方法，`Reflect`中都有一个对应的反射方法。因此，`Reflect`也适用于在代理中实现陷阱。查看下面的代码片段，我们在代理中使用了`Reflect`：\n\
  \n```\nconst restaurant = {\nsoda: 2,\nbeer: 5\n};\nconst restHandler = {\nget:\
  \ function(target, property) {\nif (property === \"beer\") {\nreturn undefined;\n\
  }\nreturn Reflect.get(target, property);\n}\n};\nconst restProxy = new Proxy(restaurant,\
  \ restHandler);\nconsole.log(restProxy.beer);\n// undefined\nconsole.log(restProxy.soda);\n\
  // 2\n```\n\n再次说明，在上面的示例中，我们阻止了对`beer`的访问，并使用`Reflect.get()`来访问目标对象的其他属性。你应该优先使用`Reflect`而不是传统的`target[property]`方式的原因之一是：如果在非对象目标上使用`Reflect.get`，它会抛出错误，而`target[property]`则简单地返回`undefined`。因此，在这里使用`Reflect.get`是一个好习惯。查看下面的代码片段示例，我们尝试在一个非对象目标上获取属性：\n\
  \n```\nconsole.log(Reflect.get(1, \"name\"));\n// TypeError: Reflect.get called\
  \ on non-object\nconsole.log(1[\"name\"]);\n// undefined\n```\n\n除此之外，在`Function.prototype`上调用方法时，也建议使用`Reflect`，因为如果参数列表为`null`或`undefined`，`Function.prototype.apply`会用无参方式调用函数，而`Reflect.apply`会抛出错误。另一个原因是`Reflect`提供了更简洁的语法，而`Function.prototype`显得过于冗长。查看下面的代码片段示例：\n\
  \n```\nfunction sayHello() {\nconsole.log(`${this.name} says hello`);\n}\nconst\
  \ person = {\nname: \"Jack\"\n};\nFunction.prototype.apply.call(sayHello, person);\n\
  // Jack says hello\nReflect.apply(sayHello, person);\n// TypeError: CreateListFromArrayLike\
  \ called on non-object\nReflect.apply(sayHello, person, []);\n// Jack says hello\n\
  ```\n\n类似地，还有许多其他有用的静态函数，其中一些与代理处理器方法同名，以下是一些常见的可用的函数：\n\n*   `Reflect.get()` –\
  \ 返回属性值的函数。\n*   `Reflect.set()` – 为属性赋值的函数。如果更新成功，返回布尔值`true`。\n*   `Reflect.getPrototypeOf()`\
  \ – 与`Object.getPrototypeOf()`相同。\n*   `Reflect.has()` – 作为函数的`in`操作符。返回一个布尔值，指示是否存在自有或继承的属性。\n\
  \n\n\n"
- '# 摘要


  ES6 中的元编程通过为程序代码机制提供底层钩子，使我们能够修改语言内部特性的行为。它有三种形式：内省、自我修改和中介。


  在本章中，我们学习了新的`Proxy`和`Reflect` API，它们帮助我们实现不同形式的元编程。我们还看到了一些有趣的示例，其中`Proxy`帮助我们管理对象中的私有属性。我们了解了`Proxy`提供的各种陷阱处理方法，以及它们一一对应的静态`Reflect`方法，并探讨了如何在应用程序中充分利用这些方法。随着未来
  ECMAScript 版本的发展，我们预期将看到更多有趣的元编程特性，从而更广泛地摆弄语言的默认内部操作。


  '
- '# 11. 超越 ES6


  正如第一章所述，ES6 的发布版本非常庞大，是对现有 JavaScript 版本（即 ES5）的重要更新。我们在本书的前几章中已经全面介绍了所有主要变化。TC39
  花费了六年多的时间才推出新版本的语言，并引入了大量全新的概念和功能。委员会在版本发布末期做出的一项重大决定是：他们不会再像以前那样花费太长时间才得出结论并发布新功能。他们决定正式将
  ES6 命名为 ES2015，并在此后以逐年递增的方式发布更小规模的增量更新，并以发布年份命名。在本章中，我们将探讨 ES2016 和 ES2017 中的变化和新特性。


  ### ES2016


  ES2016 是对现有 ES2015（ES6）版本的一次小型增量更新，引入了`Array.prototype.includes`方法和求幂运算符`**`。你还可以查看
  KangaX 兼容性表格，了解支持 JavaScript 的不同浏览器和平台对 ES2016 新特性的支持程度：[`https://kangax.github.io/compat-table/es2016plus/`](https://kangax.github.io/compat-table/es2016plus/)。


  #### 数组的`includes`方法


  ES2016 为 JavaScript 中的数组原型引入了`includes`方法。你可以使用此方法检查数组中是否存在某个元素。它会根据传递给它的元素是否属于调用该方法的数组的一部分，返回一个布尔值。请参考以下示例：


  ```

  [''apple'', ''banana'', ''carrot''].includes(''apple'');    //true

  [''apple'', ''banana'', ''carrot''].includes(''orange'');   //false

  ```


  如上例所示，在水果数组上使用`includes`方法，如果传递给它的元素是数组的一部分，则返回`true`，否则返回`false`。在 JavaScript 中，传统上这种检查是通过`indexOf`方法完成的，该方法如果存在则返回元素的索引，否则返回-1。所以，上面的示例实际上等同于：


  ```

  [''apple'', ''banana'', ''carrot''].indexOf(''apple'') >= 0;    //true

  [''apple'', ''banana'', ''carrot''].indexOf(''orange'') >= 0;   //false

  ```


  上述两个语句的工作方式与之前使用`includes`的示例完全一致。但`includes()`和`indexOf()`的主要区别在于它们与值`NaN`（非数字）的交互方式，这有助于识别该值。


  ```

  const arr = [NaN];

  arr.includes(NaN);              // true

  arr.indexOf(NaN);               // -1

  ```


  从这个示例可以明显看出，`indexOf`不能用于检查数组中的`NaN`值，但`includes`方法允许我们检查数组中是否存在`NaN`值。


  ### 求幂运算符 `**`


  求幂运算符是 ES2016 中引入的一个新的算术运算符，它与 Python 等语言中的对应运算符非常相似，使用双星号来计算数字的幂值。它等同于 Math 库中传统的`pow()`函数。


  ```

  let a = 2;

  let b = 3;

  a ** b               //8

  Math.pow(a, b)       // 8

  ```


  使用求幂运算符是一种快速计算数值的方法，当数字被提升到相应幂次时，例如本例中 2 的 3 次方等于 8。


  ### ES2017


  ES2017 为该语言带来了两个主要的新特性，即异步函数和带共享内存的 Atomics。它还包括其他更简单的特性，如`Object.entries()`、`Object.values()`、`Object.getOwnPropertyDescriptors()`、`padStart`、`padEnd`，以及在函数参数列表和调用中使用尾后逗号的能力。让我们更详细地了解每一个特性。


  #### 异步函数


  ES2017 引入了一种处理异步代码的令人兴奋的新方式，而异步代码是 JavaScript 的生存之道。我们已经了解了一种使用 Promise 处理异步操作的流行方法。ES2017
  在此基础上进一步构建，通过使用`async`和`await`关键字，使其以同步方式工作。为了正确理解这一点，请考虑以下示例，我们只是简单地创建了一个返回 Promise
  的函数：


  ```

  function getData(site) {

  return fetch(site)

  .then(request => request.json())

  }

  ```


  对于上面的示例，调用`getData()`函数将返回一个 Promise，该 Promise 将在我们的执行上下文中异步地得到解决。现在使用`async`/`await`关键字，我们可以利用基于
  Promise 的方法来发挥生成器模式的优势，使我们的代码表现得像同步代码。`async`始终返回一个可以被解析为值的 Promise，而`await`会暂停执行，直到
  Promise 被解决。我们可以使用`async`/`await`关键字重写上面的示例，如下所示：


  ```

  async function getData(site) {

  let request = await fetch(url);

  let text = await request.text();

  return JSON.parse(text);

  }

  ```


  请注意，`await`关键字仅适用于 Promise，如果表达式不是 Promise，它会将其转换为 Promise。你还可以在函数表达式、方法定义和箭头函数中使用`async`，如下例所示：


  ```

  // 使用函数表达式：

  const getData = async function () {};

  // 使用方法定义：

  const item = { async getData() {} }

  // 使用箭头函数：

  const item = async () => {};

  ```


  你可能对上一个示例中使用的`await`关键字感到好奇：`await`运算符会等待操作数（即 Promise）被解决，如果 Promise 被履行，其结果就是兑现值；如果
  Promise 被拒绝，它会抛出拒绝值。因此，我们可以使用传统的`try`/`catch`块配合`async`/`await`，以更好的方式处理 Promise。




  #### 原子操作与共享内存


  任何熟悉 `WebWorker` 的人都已经了解创建工作进程的过程。通过分配 `Worker` 对象并将需要运行的脚本传入其中来创建它们。工作进程通过消息通道进行通信，多种类型的数据都可以通过此通道发送，并且当数据到达目的地时，其类型和结构会保持不变。在
  ES2017 中，要分配共享内存，你可以直接使用 `SharedArrayBuffer` 构造函数。它就像一个普通的 `ArrayBuffer`，但其内存是共享的。


  此外，ES2017 中的这个新规范还为我们带来了新的底层 `Atomics` 命名空间对象的概念，它与 `SharedArrayBuffer` 构造函数一起，为我们提供了用于构建更高级别并发抽象的基本构建块。你可以使用这些特性在多个
  Web Worker 和主线程之间共享 `SharedArrayBuffer` 对象中的数据。这使你能受益于轻松地在 Worker 之间共享数据，从而更好地协调它们之间工作。关于此主题的更详细教程和规范（由共享内存和
  `Atomics` 的原始提案作者 Lars Hansen 编写）可以在以下链接中找到：[`https://github.com/tc39/ecmascript_sharedmem/blob/master/TUTORIAL.md`](https://github.com/tc39/ecmascript_sharedmem/blob/master/TUTORIAL.md)，但这超出了本书的范围。


  '
- '# Object.entries() 和 Object.values()


  `Object.entries()` 和 `Object.values()` 是 ES2017 中引入的两个新方法。`Object.entries()` 方法在对象上运行时，会以
  `for-in` 循环提供的相同顺序返回该对象自身的可枚举属性 `[key, value]` 对。但与 `for-in` 循环不同，它不会枚举原型链上的属性。类似地，`Object.values()`
  在传入对象时，会返回一个包含其自身可枚举属性值的数组：


  ```javascript

  const myObj = { a: 1, b: 42 };

  Object.entries(myObj);     // [[''a'', 1], [''b'', 42]]

  Object.values(myObj);      // [1, 42]

  ```


  正如你在上面的示例中所看到的，当传入 `Object.entries()` 方法时，该对象会返回一个包含其键/值对的数组，而 `Object.values()`
  方法则返回属性值。


  '
- '# padStart 和 padEnd


  `padStart()` 和 `padEnd()` 方法是 ES2017 中引入的两个新的字符串方法，它们有助于向字符串添加填充，以便结果字符串的长度等于作为第一个参数传入的值。你还可以传入第二个可选参数（另一个字符串）来代替默认的空格进行填充。思考以下示例：


  ```javascript

  ''string''.padStart(10);           // "    string"

  ''string''.padStart(10, "abc");    // "abcastring"

  ''string''.padStart(10,"123465");  // "1234string"

  ''string''.padStart(8, "0");       // "00string"

  ''string''.padStart(3);            // "string"

  ''string''.padEnd(10);             // "string    "

  ''string''.padEnd(10, "abc");      // "stringabca"

  ''string''.padEnd(8, "123456");    // "string12"

  ''string''.padEnd(1);              // "string"

  ```


  正如你在上面的示例中所看到的，添加到给定字符串的填充使得最终结果字符串的长度要么大于第一个参数的长度，具体取决于原始字符串的长度；如果给定的长度更大，则会根据你使用的方法在字符串的开头或结尾添加适当数量的填充。你也可以使用第二个参数来使用不同的字符串代替空格进行填充。


  '
- '# Object.getOwnPropertyDescriptors()


  顾名思义，`Object.getOwnPropertyDescriptors()` 是 ES2017 中的一个新方法，它允许你精确检查给定对象所有自身属性的描述。JavaScript
  对象中的属性通常由一个字符串名称和一个属性描述符组成。描述符是属性值、布尔值 `writable`、`get` 函数、`set` 函数、布尔值 `configurable`
  和布尔值 `enumerable` 的记录。思考以下示例：


  ```javascript

  const myObj = {

  [Symbol(''mySymbol'')]: 42,

  get random() { return ''test'' },

  };

  console.log(Object.getOwnPropertyDescriptors(myObj));

  // Object {random: Object, Symbol(mySymbol): Object}

  // {random:{

  //     configurable: true,

  //     enumerable: true,

  //     get: function random(),

  //     set: undefined}

  //[Symbol(''mySymbol'')]:{

  //     configurable: true,

  //     enumerable: true,

  //     value: 42,

  //     writable: true}

  //}

  ```


  在像 `myObj` 这样的对象上使用 `Object.getOwnPropertyDescriptors()` 的输出将大致如上所示。请注意，上述所有特性都相当新且是实验性的，因此你可能不总是能得到完全相同的结果。话虽如此，它们现在正变得越来越标准化。


  #### 函数参数列表与调用中的尾逗号


  ES2017 中的这个特性是一个简单的语法更新。在引入此特性之前，即使规范的其他部分（如数组和对象字面量的情况）中已普遍允许，但在 JavaScript 中是不允许在最后一个函数参数后面有逗号的。通过
  ES2017 的这一更新，你在整个 JavaScript 中拥有了更统一的尾逗号语法。所以你可以这样做：


  ```javascript

  const trailFunct = function(x, y, z,) {

  // 函数体

  }

  ```


  这纯粹是语言的一个语法更新，对该语言的行为或功能没有重大改变。




