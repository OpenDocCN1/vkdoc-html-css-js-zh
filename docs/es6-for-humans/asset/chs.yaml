- "# 3. 解构\n\n对象字面量和数组可能是 JavaScript 中使用最广泛的符号之一。这些 JavaScript 符号的流行甚至扩展到了语言之外，体现在`JSON`数据格式中。在\
  \ JavaScript 中，对象和数组通常用于分组数据，并且存在多种模式，以便在需要时系统地从中提取数据。ES6 通过一个称为解构的过程，使这一过程更加容易和简单，进一步扩展了这种能力。\n\
  \n## 对象和数组的解构\n\n解构基本上是一种将数据结构分解为更小部分，以便更容易访问其数据并从对象或数组中提取多个值的便捷方式。为了更好地理解解构，只需将其视为从对象或数组进行结构化赋值。考虑以下示例：\n\
  \n```javascript\nvar letters = ['a', 'b', 'c'],\nx = letters[0],\ny = letters[1],\n\
  z = letters[2];\nconsole.log( x, y, z );             // a b c\n```\n\n在上面的例子中，我们给一个名为`letters`的数组赋值，然后通过`letters`变量上的索引给变量`x`、`y`和`z`赋值。让我们看另一个使用对象的例子：\n\
  \n```javascript\nvar numbers = {a: 1, b: 2, c: 3},\na = numbers.a,\nb = numbers.b,\n\
  c = numbers.c;\nconsole.log( a, b, c );             // 1 2 3\n```\n\n在这个例子中，我们使用`numbers.a`的值来给变量`a`赋值，类似地，使用`numbers.b`和`numbers.c`来给`b`和`c`赋值。ES6\
  \ 通过一种称为解构的新专用语法，使这种结构化赋值模式更加简单。这种语法消除了对临时中间变量（`letters`和`numbers`）的需求。考虑以下示例：\n\
  \n```javascript\nvar [ x, y, z ] = ['a', 'b', 'c'];\nvar { a: a, b: b, c: c } =\
  \ {a: 1, b: 2, c: 3};\nconsole.log( x, y, z );             // a b c\nconsole.log(\
  \ a, b, c );             // 1 2 3\n```\n\n注意\n\n我们通常习惯在赋值语句的右侧看到像`{a: a, b:b, c:c\
  \ }`和`[x, y, z]`这样的对象和数组语法。解构翻转了这种模式，将它们放在左侧，并带有变量声明关键字，允许你将右侧分解为单独的值，并将它们分配给左侧的变量。\n\
  \n如前面的两个示例所示，在 ES6 之前，从对象和数组中获取信息并将其放入局部变量需要更多的代码。想象一下，你需要从一个非常大的对象或数组中提取值，并将它们存储到同名的变量中。你必须编写大量代码逐个赋值，但使用解构，这个过程简化为一个单一的赋值语句。\n\
  \n使用解构将数据结构分解为更小的部分，使得获取所需数据变得更加容易。此外，ES6 中的解构使用了对象和数组字面量语法，这对传统的 JavaScript 用户来说已经非常熟悉。\n\
  \n#### 对象解构语法\n\n让我们更仔细地看一下对象解构语法。我们看到的对象解构语法是：\n\n```javascript\nvar { a: a, b:\
  \ b, c: c } = {a: 1, b: 2, c: 3};\n```\n\n在这个例子中，你可以注意到，被赋值的变量名与返回对象的属性名相同。但它们不必相同，你可以为被赋值的局部变量使用任何名称。但是，如果它们相同，则可以通过省略`\"\
  a: \"`部分来进一步缩短语法。这个声明语句可以直接写成：\n\n```javascript\nvar { a, b, c } = {a: 1, b: 2,\
  \ c: 3};\nconsole.log( a, b, c );             // 1 2 3\n```\n\n使用更短的语法而不是长形式对我们来说非常有意义，除非你想将属性赋值给一个不同的变量名。但是在使用长形式时，有一个重要的细微差别你需要小心。考虑以下示例：\n\
  \n```javascript\nvar { a: foo, b: bar, c: baz } = {a: 1, b: 2, c: 3};\nconsole.log(\
  \ foo, bar, baz );         // 1 2 3\nconsole.log( a, b, c );               // ReferenceError\n\
  ```\n\n\n\n仔细观察这个例子。这种模式看起来可能很直接：左侧从右侧的对象表示法`{ a: foo, b: bar, c: baz }`中获取值。但实际上它是相反的。它并不是我们通常习惯的“目标：源”模式，而更准确地说是其逆模式，即“源：目标”模式。为什么会这样令人困惑呢？如果你换个角度看，这个模式会更有意义。考虑以下赋值语句：\n\
  \n```\nvar foo = 42, bar = 100;\nvar obj = { a: foo, b: bar };\nvar { a: FOO, b:\
  \ BAR } = obj;\nconsole.log( FOO, BAR );              // 42 100\n```\n\n在这个例子中，`a`和`b`指的是对象的属性，而在对象解构赋值语句中，`a`和`b`同样代表对象属性。回想一下之前在简化代码的例子中，我们提到可以省略`a:`部分，正是这个原因。在这个例子中，如果你去掉语法中的`a:`和`b:`部分，你将只剩下`FOO`和`BAR`。这种语法有时会令人困惑，但如果你将其理解为相应的属性名和值彼此映射，就很容易掌握了：在这个例子中，`foo`被赋值给`FOO`，`bar`被赋值给`BAR`，使用的就是`a`和`b`属性名。\n\
  \n使用对象解构，你实际上可以通过同一个属性值来设置多个变量的值。考虑以下示例：\n\n```\nvar { x: foo, x: bar } = { x: 42\
  \ };\nconsole.log( foo );  // 42\nconsole.log( bar );  // 42\n```\n\n在这种情况下，`foo`和`bar`都通过对象的`x`属性获取其值。\n\
  \n在解构声明语句中，你可以根据情况和需求自由使用`let`、`const`或`var`。但请确保语句中始终存在赋值操作，即语句的右侧是必需的。\n\n```\n\
  var { x, y };         // syntax error!\nlet { x, y };         // syntax error!\n\
  const { x, y };       // syntax error!\n```\n\n以上所有声明都会导致语法错误，因为解构声明中缺少初始化器。虽然我们知道`const`在所有情况下都需要初始化器，但使用解构时，`var`和`let`也需要初始化器。\n\
  \n#### 使用解构进行赋值\n\n到目前为止，在我们的讨论中，我们只看到了使用解构声明语句的情况。但解构也可以用于赋值语句。考虑以下使用之前例子中的`getChars()`和`getNumbers()`函数的示例：\n\
  \n```\nvar a, b, c, x, y, z;\n[x, y ,z] = getChars();\n( { a, b, c } = getNumbers()\
  \ );\nconsole.log( x, y, z );             // a b c\nconsole.log( a, b, c );    \
  \         // 1 2 3\n```\n\n在这个例子中，`x`、`y`、`z`、`a`、`b`和`c`在声明后都通过解构进行了赋值。\n\n> **注意**\n\
  > \n> 你必须始终在对象解构赋值语句周围加上括号。这是因为左花括号用于表示块语句的开始。周围的括号则表示该花括号应被解释为在赋值语句中使用解构的表达式。\n\
  \n你也可以在变量通过解构赋值后更改它们的值。考虑以下示例：\n\n```\nlet item = {\nname: \"Apples\",\nquantity:\
  \ 5\n},\nname = \"Oranges\",\nquantity = 3;\n// assigning different values using\
  \ destructuring\n({ name, quantity } = item);\nconsole.log(name);          // \"\
  Apples\"\nconsole.log(quantity);      // 5\n```\n\n在这个例子中，`name`、`quantity`和`item`在一个声明语句中初始化了值。然后，`name`和`quantity`通过从`item`中解构获取值而被赋予了新值。\n\
  \n#### 默认值\n\n当使用解构从没有相应属性名的对象中给变量赋值时，该变量的值会被设置为`undefined`。例如：\n\n```\nvar item\
  \ = {\nname: \"Apples\",\nquantity: 5\n};\nvar { name, quantity, value } = item;\n\
  console.log(name);           // \"Apples\"\nconsole.log(quantity);       // 5\n\
  console.log(value);          // undefined\n```\n\n在这个例子中，一个额外的变量`value`在`item`中没有对应的属性，它被声明在解构语句中。当`name`和`quantity`从`item`获取各自的值时，`value`被设置为`undefined`。\n\
  \n此外，与其让额外的变量值为`undefined`，你也可以选择在指定属性缺失的情况下为其定义一个默认值。为此，只需在属性名后面使用等号`=`并指定一个默认值，如下所示：\n\
  \n```\nvar item = {\nname: \"Apples\",\nquantity: 5\n};\nvar { name = \"Oranges\"\
  , quantity = 3, value = 25 } = item;\nconsole.log(name);          // \"Apples\"\n\
  console.log(quantity);      // 5\nconsole.log(value);         // 25\n```\n\n在这个例子中，变量`quantity`和`value`分别被赋予了默认值`3`和`25`。由于没有`item.value`属性，变量`value`使用了其默认值`25`。这与我们之前章节中看到的函数默认参数值的工作方式类似。\n\
  \n> **注意**\n> \n> 只有在`item`中缺少某个属性时，默认值（如果未指定则为`undefined`）才会被赋给该变量。\n\n你也可以在长格式的解构赋值语句中使用默认值。但此时代码可能会变得混乱且有些令人困惑。考虑以下示例：\n\
  \n```\nvar { a, b, c: c = 3, d: FOO = 42 } = {a: 1, b: 2};\nconsole.log( a, b, c,\
  \ FOO );     // 1 2 3 42\n```\n\n在这种情况下，变量`a`和`b`被声明并设置为右侧对象字面量中它们对应的属性值，但由于对象中不存在属性`c`，其值被设置为默认值`3`。声明的变量`FOO`也被设置为其默认值`42`，因为对象中不存在对应的属性`d`。这里你需要记住我们之前讨论的“目标：源”语法，这有时会导致混淆。因此，除非绝对必要，否则最好避免这种混合的编码风格。\n\
  \n另一个建议是，避免在解构语句中使用对象或数组作为默认值。这同样会导致任何阅读你代码的人（包括你自己）感到困惑。请看下面的例子：\n\n```\nvar a\
  \ = 1, b = 2, c = 3;\nvar obj = { a: { b: 42 }, c: { b: c } };\n( { b: a = { b:\
  \ b } } = obj );\n( { c: b = { b: c } } = obj );\n( { a: c = { b: a } } = obj );\n\
  console.log( a.b, b.b, c.b );\n```\n\n尝试猜测`console.log`语句的输出会是什么。如果你猜出是`\"2 3 42\"\
  `，那完全正确。但你明白为什么这会令人困惑了。\n\n#### 嵌套解构\n\n解构语法，与对象字面量语法非常相似，可用于导航到嵌套对象内部以检索信息。如果你解构的值包含嵌套的对象或数组，你也可以解构这些嵌套的值。这里有一个例子：\n\
  \n```\nlet items = {\ncount : 2,\nname: \"fruits\",\napple: {\nquantity: 5,\nvalue:\
  \ 25\n},\norange: {\nquantity: 3,\nvalue: 5\n}\n};\nlet { apple: { quantity }} =\
  \ items;\nconsole.log(quantity);        // 5\n```\n\n这里的花括号用于表示我们需要首先深入到`items`对象内部的`apple`属性一级，然后获取`quantity`属性。根据我们之前的讨论，我们知道`':'`之前的标识符表示我们需要去的位置，而右侧则进行赋值。如果冒号后面跟着一个花括号，则表示目标位于对象的下一个嵌套深度层级，以此类推。\n\
  \n由于空的花括号在对象解构中是合法的，你在使用嵌套解构时必须非常小心。考虑以下示例：\n\n\n\n```javascript\nlet { apple: {}\
  \ } = items;\nconsole.log(apple);      // ReferenceError: apple is not defined\n\
  ```\n\n此解构语句没有绑定任何变量，由于右侧的花括号，`apple`并不会被创建为变量绑定，而是作为`items`对象内部的一个位置进行探查。在这种情况下，如果你想要为变量`apple`创建绑定，应该使用`=`来定义默认值，而不是使用`:`来定义位置，例如：\n\
  \n```javascript\nlet { apple = {} } = items;\nconsole.log(apple);      // {quantity:\
  \ 5, value: 25}\n```\n\n我们再看一个使用嵌套数组解构的例子。你可以在整体模式中插入另一个数组模式，解构操作就会深入到嵌套数组中：\n\n\
  ```javascript\nlet fruits = [ \"apple\", [ \"blueberry\", \"raspberry\" ], \"orange\"\
  \ ];\nlet [ fruit1, [ fruit2 ], fruit4 ] = fruits;\nconsole.log(fruit1);       //\
  \ \"apple\"\nconsole.log(fruit2);       // \"blueberry\"\nconsole.log(fruit4); \
  \      // \"orange\"\n```\n\n在这个例子中，变量`fruit2`会被赋值为从第二个数组（表示`fruits`数组中的浆果）中获取的`\"\
  blueberry\"`。解构语句中`fruit2`周围的额外方括号是必要的，用于解包`fruits`数组及其内部的浆果数组。与我们之前看到对象类似，你可以拥有任意深度的嵌套数组，并且需要在解构语句中使用相应的符号来从中提取值。\n\
  \n我们可以为对象和数组的解构构建复杂的表达式，以获取正确的值并将其分配给不同的变量，无论对象或数组嵌套多深，或者混合了对象和数组，只需借助解构的力量，使用一条语句即可完成。请看下面的例子：\n\
  \n```javascript\nlet student = {\n  name: \"Tony\",\n  courses: {\n    english:\
  \ {\n      id: 1,\n      score: 7\n    },\n    math: {\n      id: 2,\n      score:\
  \ 9\n    }\n  },\n  scoreRange: [0, 10]\n};\nlet {\n  courses: { english },\n  scoreRange:\
  \ [ minScore ]\n} = student;\nconsole.log(english.id);        // 1\nconsole.log(english.score);\
  \     // 7\nconsole.log(minScore);          // 0\n```\n\n这段代码将`student.courses.english`和`student.scoreRange[0]`分别提取到`english`和`minScore`中。在这个例子中，`courses`和`scoreRange`都是解构模式中的变量，它们从`student`对象中的相应属性获取值。当你需要从复杂的\
  \ JSON 结构中获取某些特定数据或值，而无需遍历整个结构时，这种方法非常有用。\n\n## 使用剩余语法进行解构\n\n在解构模式中使用剩余运算符，可以成为\
  \ ES6 中变量赋值的一种非常强大且简洁的语法。我们已经在上一章中探讨了剩余模式。现在，让我们看看它与解构模式结合使用的例子。请看下面的示例：\n\n```javascript\n\
  var num1, num2, rest;\nvar x, y, z;\n[num1, num2, ...rest] = [1, 2, 3, 4, 5];\n\
  [x, y, z] = [1, 2, 3, 4, 5];\nconsole.log(num1);        // 1\nconsole.log(num2);\
  \        // 2\nconsole.log(rest);        // [3, 4, 5]\nconsole.log(x, y, z)    \
  \  // 1 2 3\n```\n\n在上面的例子中，我们使用解构将值赋给变量`num1`、`num2`和`rest`（仅对`rest`使用了剩余运算符）。我们对另一组变量`x`、`y`和`z`执行了完全相同的操作。但如果你注意到输出结果，当我们使用包含五个数字的数组赋值时，前两个值被赋给了`num1`和`num2`，但其余的值被收集到一个数组中并赋给了变量`rest`，因为我们对其使用了剩余运算符。将此与第二个解构语句进行对比，在第二个语句中，`z`只被赋值为`3`。\n\
  \n这里需要重点注意的一点是，如果在左侧对剩余元素使用了尾随逗号，则会抛出`SyntaxError`。请看以下示例：\n\n```javascript\nvar\
  \ [a, b,] = [1, 2, 3];\nconsole.log(a, b)               // 1 2\nvar [num1, ...num2,]\
  \ = [1, 2, 3];\n// SyntaxError: rest element may not have a trailing comma\n```\n\
  \n因此，请记住，尽管在简单的解构语句中尾随逗号不会有任何影响，但你**不应**在解构语句中的剩余元素之后使用它。\n\n#### 解构参数\n\n解构语法除了为我们提供更简单的声明和赋值语法外，还可以在传递函数参数时使用。前面讨论过的所有解构变体，在参数解构中同样适用。解构还与其他\
  \ ES6 函数参数特性（如默认参数值和剩余参数）很好地融合在一起。\n\n让我们看一个使用解构数组参数的简单示例：\n\n```javascript\nfunction\
  \ sum( [ num1, num2 = 0 ] ) {\n  console.log( num1 + num2 );\n}\nsum( [ 1, 2 ] );\
  \         // 3\nsum( [ 1 ] );            // 1\nsum( [  ] );             // NaN\n\
  ```\n\n在上面的例子中，有几点需要注意：当向`sum()`函数传入包含两个值`1 和 2`的数组时，它会打印它们的和`3`；但当只传入一个值`1`时，由于`num2`被分配了默认值`0`，它会输出`1`。当没有向解构数组传入任何值时，它会打印`NaN`（Not\
  \ a Number），因为尽管`num2`默认为`0`，但`num1`被设置为`undefined`。\n\n当你需要为函数提供大量参数时，一种常见的模式是创建一个对象，其属性指定参数，然后将该对象传入函数。但这种模式的问题在于，仅通过查看函数定义，很难猜测函数需要什么样的输入。你需要遍历函数体才能了解函数所需的不同输入。请看下面这个函数接受选项对象的示例：\n\
  \n```javascript\nfunction createObj(name, value, options) {\n  let obj = {};\n \
  \ obj.x = options.a;\n  obj.y = options.b;\n  obj.z = options.c;\n  obj[name] =\
  \ value;\n  return obj;\n}\nlet options = {a: 1, b: 2, c: 3};\nlet testObj = createObj('test',\
  \ 4, options);\nconsole.log(testObj)// {x:1, y:2, z:3, test:4}\n```\n\n这里，`options`对象是函数`createObj`所需的参数之一，但解构可以帮助我们更好地读取和获取函数内部所需的\
  \ options 属性。我们可以使用解构参数重写函数定义，如下所示：\n\n```javascript\nfunction createObj(name, value,\
  \ {x:a, y:b, z:c}) {\n  // 返回对象的代码\n}\n```\n\n这个函数的行为与上一个示例完全相同，但由于第三个参数使用解构从`options`对象中获取相应的值，因此仅通过查看函数定义就能轻松理解函数所需的输入。而且，这些值甚至可以在函数调用语句本身中直接赋值。因此，你可以使用默认值、混合的对象和数组模式，以及与你读取的属性不同的变量名。\n\
  \n**注意**：解构参数的行为与常规参数类似，如果没有传入，它们会被设置为`undefined`。\n\n使用对象解构参数的能力还为我们带来了额外的好处：它们使我们能够在参数列表中的任何位置拥有可选参数。请看下面的示例：\n\
  \n\n\n```\nfunction printNums( { num1, num2 } ) {\nconsole.log( num1, num2 );\n\
  }\nprintNums( { num2: 1, num1: 2 } );           // 2 1\nprintNums( { num2: 42 }\
  \ );                   // undefined 42\n```\n\n在此示例中，`printNums()` 函数将两个数字打印出来，这些数字是通过解构包含\
  \ `num1` 和 `num2` 属性的对象作为参数传入的。请注意，在第一次函数调用中，你可以通过先指定 `num2` 再指定 `num1` 来交换参数的顺序。类似地，通过只指定\
  \ `num2`，实际上你可以将第一个预期参数 `num1` 的值设置为 `undefined`。\n\n此时，有必要指出解构默认值和函数参数默认值在行为上的区别。请看以下示例：\n\
  \n```\nfunction foo({ num1 = 42 } = {}, { num2 } = { num2: 42 }) {\nconsole.log(\
  \ num1, num2 );\n}\nfoo();                               // 42 42\nfoo( {}, {} );\
  \                       // 42 undefined\n```\n\n在此示例中，如果不看输出结果，可能看起来我们以两种不同方式为 `num1`\
  \ 和 `num2` 都声明了默认值 `42`。第一次函数调用也表明了这一点。但第二次函数调用——向函数中传入了两个空对象——则揭示了一个不同的情况。\n\n\
  如果仔细观察，这两种声明参数值的方式存在细微差别。在上面的例子中，函数 `foo` 接受两个参数：\n\n*   `{ num1 = 42 } = {}`\n\
  *   `{ num2 } = { num2: 42 }`\n\n当没有参数传给函数时，第一个参数默认为一个空对象 `{}`，但由于它使用了对象解构，因此无论在什么情况下，只要传入的参数对象中没有\
  \ `num1` 这个属性，命名参数 `num1` 都会默认为 `42`。\n\n对于第二个参数，它的默认参数值是一个对象 `{ num2: 42 }`。当没有提供第二个参数给函数时，该参数会默认使用这个对象。由于左侧是解构对象，当参数默认使用该对象时，`num2`\
  \ 被设置为 `42`。但是，如果将一个空对象 `{}` 作为第二个参数传入，则默认值永远不会被使用，然后对传入的空对象 `{}` 进行 `{ num2 }`\
  \ 解构，导致 `num2` 被设置为 `undefined`。\n\n## 总结\n\n随着你在 JavaScript 中处理数据，你会逐渐意识到通过分解对象和数组来逐个检查其组成部分以提取特定信息的必要性。在\
  \ ES6 之前，开发者需要编写相当多的代码来解构数据，但现在他们可以使用 ES6 带来的新解构语法，就所需编写的代码量而言，这个过程变得简单得多。\n\n此外，解构有助于使函数的对象参数更加明确。使用解构，你可以拥有默认值而无需检查属性是否存在于对象中，并且现在我们可以通过为属性提供默认值来使可选属性更加明确。显式可见的内容使代码更易于维护，因为你无需猜测或阅读整个函数就能弄清楚。\n\
  \n"
- '# 4. ES6 中的类


  如果你来自 C++、Java 或 Python 等面向对象编程语言，你一定已经了解类是如何工作的。在 ES6 之前，JavaScript 中从未存在过类，但从早期开始，就已经存在许多模式来模拟经典的面向类开发。类的概念以各种不同的形式被尝试，这主要是因为无法在
  JavaScript 内部以一种简洁直接的方式支持类和经典继承。这导致了许多来自其他语言的传统开发者感到困惑，因为在 JavaScript 中，类和继承并不是创建相似或相关对象的主要方法。


  这些语法和编码模式试图在原型系统内部，以隐藏的方式使用面向类开发，比如使用 `new`、`instanceOf` 和 `constructor` 属性。许多库，如
  JSClass、Classify.js 等，都试图让 JavaScript 看起来支持传统的类。因此，尽管许多传统的 JS 开发者认为不需要传统意义上的类，但仅仅因为存在数量庞大的此类库，就影响了
  TC39 在 ES6 中引入“类”。其目标是让它们看起来像真正的类，这通过引入 `class` 关键字和相关的声明机制来实现。


  ### ES6 中的类


  在 ES6 的设计过程中，类的模式被广泛争论和讨论，并最终达成了一项折衷方案。重要的是要理解，ES6 的类的工作方式与其他面向对象语言并非完全相同。也就是说，TC39
  仍在 ES6 之后陆续添加更多特性来增强类，使其更接近经典定义。


  从概念上讲，传统的 JavaScript 中并没有“类”。ES6 中的类本质上只是一个函数。它只不过是对对象和原型的语法糖，提供了一种方便的声明式形式来实现类模式，从而促进互操作性。ES6
  中这个新的 `class` 关键字支持基于原型的继承、构造函数、`super` 调用、实例方法和静态方法。


  让我们看看如何在 ES6 中编写最基本形式的类声明，这与在其他语言中定义类非常相似。考虑以下示例：


  ```

  class Car {

  constructor(brand) {

  this.brand = brand;

  }

  }

  const myTesla = new Car("Tesla");

  console.log(myTesla.hasOwnProperty("brand"));  // true

  console.log(typeof Car);                       // function

  ```


  在这个示例中，`brand` 是赋值在 `myTesla` 对象上的属性。这个对象也可以用对象字面量的形式表示如下：


  ```

  const myTesla = {

  brand: "Tesla"

  };

  ```


  上面的例子简单展示了如何创建一个带有可选 `constructor` 方法的类，当该类的对象被实例化时，此方法将被调用。ES6 中的类并没有为语言中已有的功能添加任何新功能；它们只是构建对象的更简洁语法。任何传入
  `new Car()` 的参数都将被 `Car` 的 `constructor` 方法接收作为参数，你可以使用这些参数来初始化同一类的实例。因此，`constructor()`
  方法是初始化对象属性的地方，这些属性是可枚举的。同时，由于 `constructor()` 方法是可选的，你可以声明一个像下面例子中的空类：


  ```

  class EmptyClass {

  }

  ```


  如果你没有在类中定义 `constructor()` 方法，JavaScript 引擎会为你插入一个空构造函数：


  ```

  class EmptyClass {

  /* JavaScript 会插入一个空构造函数：

  constructor () { }

  */

  }

  ```


  现在我们知道如何在类中初始化属性以及在哪里初始化属性，接下来看看如何定义方法。类声明允许你定义类的方法而无需使用 `function` 关键字：


  ```

  class Car {

  constructor(brand) {

  this.brand = brand;

  }

  start() {

  console.log(`你的 ${this.brand} 已经准备出发！`);

  }

  }

  const myTesla = new Car("Tesla");

  myTesla.start();

  // 你的 Tesla 已经准备出发！

  ```


  在上面的例子中，我们在类定义中定义了一个 `start()` 方法，它使用 `this` 关键字访问类的 `brand` 属性。这个方法会自动附加到类的原型上，因此它是不可枚举的。我们将在本章后面更详细地讨论这一点以及类方法，但首先，让我们看看在
  ES6 中定义类的不同方式。


  #### 在 ES6 中定义类




  就像函数一样，在 ES6 中有两种定义类的方式。我们来看看每种方式。


  #### 类声明


  正如前面例子所示，类声明非常简单。你使用`class`关键字后跟一个类名来声明一个类，按照惯例类名通常使用`TitleCase`（首字母大写）写法。这里需要注意的一点是，类名在类定义内部的行为表现类似于常量，这意味着你不能在类内部使用类名来覆盖它：


  ```

  class SimpleClass {

  constructor() {

  SimpleClass = "42";      // 执行时会抛出错误

  }

  }

  SimpleClass = "42";              // 声明后可以正常工作

  ```


  与函数声明不同，类声明不会被提升（hoisted）。类似于`let`和`const`，类声明会处于暂时性死区（TDZ），直到执行到达类声明的位置。因此，你需要在访问类之前声明它，否则会引发`ReferenceError`：


  ```

  const b = new Bike(); // ReferenceError

  class Bike {}

  ```


  在上面的例子中，由于类尚未声明，它存在于暂时性死区中，因此当你尝试使用`new`关键字初始化一个新实例时，会抛出一个引用错误。


  #### 类表达式


  除了类声明之外，在 ES6 中定义新类的第二种方式是通过类表达式。它们与函数表达式完全相同，并且和函数表达式一样，也可以是匿名的。请看下面的例子：


  ```

  const Circle = class {

  constructor() {

  this.radius = 20;

  }

  }

  ```


  注意，在上面的例子中，`class`关键字后面缺少标识符；这使它成为一个匿名的类表达式。除了变量声明外，这些类表达式还可以用于向函数传递参数。考虑以下代码片段，它有一个用于创建汽车的工厂函数：


  ```

  function carFactory(car) {

  return new car();

  }

  const Toyota  = carFactory(class {

  start() {

  console.log("Your car is ready to roll");

  }

  stop() {

  console.log("Shutting down the engines");

  }

  });

  Toyota.start();

  // Your car is ready to roll

  Toyota.stop();

  // Shutting down the engines

  ```


  工厂函数接受类定义作为参数，并返回传入参数的类的对象。在编程语言中，如果一个实体可以作为参数传递、从函数返回、被修改以及赋值给变量，它就被认为是该语言的一等公民。函数式编程在
  JavaScript 中流行的众多原因之一，就是因为函数是语言的一等公民，这使我们能够最大程度地利用函数，并轻松创建高阶函数。在 ES6 中，与函数类似，类也是语言的一等公民，允许将类作为参数传递给函数（如上面的例子所示），以及通过类表达式将其赋值给变量。


  ## 类方法和访问器属性


  在 ES6 之前，你需要使用`Object.defineProperty()`来使一个方法不可枚举，但在 ES6 中，类的所有方法都是不可枚举的。这些方法被附加到原型（prototype）上，这使得该方法可以被类的所有实例共享，从而提供了一种节省内存的有效方式。


  在 ES6 中定义类方法的语法类似于对象字面量的方法简写（即，不带`function`关键字的函数）：


  ```

  class AeroPlane {

  constructor(model, capacity) {

  this.model = model;

  this.capacity = capacity;

  }

  getData() {

  console.log(`You''re flying a ${this.model} aeroplane`);

  console.log(`This plane can fly with ${this.capacity} passengers`);

  }

  }

  const jet = new AeroPlane("Jet", 60);

  jet.getData();

  // You''re flying a Jet aeroplane

  // This plane can fly with 60 passengers

  console.log(jet.hasOwnProperty("getData"));                     // false

  console.log(jet.__proto__.hasOwnProperty("getData"));           // true

  ```


  上面的例子展示了一个`AeroPlane`类，我们在构造每个实例时初始化名为`model`和`capacity`的实例属性。`getData()`方法声明告诉`AeroPlane`类的实例，它们将拥有一个`getData()`方法，无论何时调用该方法，都会返回该方法的执行结果。这个`getData()`方法会自动添加到原型中。用
  ES5 的方式重新创建上面的例子将是：


  ```

  function AeroPlane(model, capacity) {

  this.model = model;

  this.capacity = capacity;

  }

  AeroPlane.prototype.getData = function() {

  console.log("You''re flying a " + this.model + " aeroplane");

  console.log("This plane can fly with " + this.capacity + " passengers");

  }

  var jet = new AeroPlane("Jet", 60);

  jet.getData();

  // You''re flying a Jet aeroplane

  // This plane can fly with 60 passengers

  ```


  ES6 类还允许你在原型上创建访问器属性。我们可以使用`get`和`set`关键字放在标识符前面来分别创建 getter 和 setter 属性。这些属性描述符是不可枚举的，并且可以通过在类的原型上使用`Object.getOwnPropertyDescriptor()`来访问，因为这些属性驻留在原型对象上。例如，请考虑以下代码片段：


  ```

  class AeroPlane {

  constructor(model, capacity) {

  this._model = model;

  this._capacity = capacity;

  }

  get model() {

  return this._model;

  }

  get capacity() {

  return this._capacity;

  }

  set model(model) {

  this._model = model;

  }

  set capacity(capacity) {

  this._capacity = capacity;

  }

  }

  const jet = new AeroPlane("Jet", 100);

  console.log(jet.capacity);

  // 100

  console.log(Object.getOwnPropertyDescriptor(AeroPlane.prototype, "model"));

  /*

  {

  get: [Function: get model],

  set: [Function: set model],

  enumerable: false,

  configurable: true

  }

  */

  ```


  在上面的例子中，你必须注意，我们在类定义中的属性名前添加了一个`_`（下划线）。让我们使用下面的代码片段来看看我们为什么这么做：


  ```

  class StudyGroup {

  constructor(name) {

  this.name = name;

  }

  set name(newName) {

  this.name = newName;

  }

  }

  const jsGroup = new StudyGroup("js");

  // RangeError: Maximum call stack size exceeded

  ```


  如果你尝试运行上面的代码片段，你会看到一个`RangeError`，提示超出最大调用堆栈大小，这是因为你的 setter 属性在递归地设置自身，导致无限函数调用。因此，你绝不能让你的
  setter 方法名与属性名相同，因为在 setter 内部通过其自身名称访问属性 setter 会创建一个无限递归的函数调用。


  如果你此时想知道为什么首先要使用 setter 和 getter，以下是一些应该考虑使用它们的原因：




  '
- '# 设置器与访问器


  设置器（setter）和访问器（getter）允许我们封装与对象属性获取或设置相关的行为，这使得代码更具扩展性，因为你可以根据需求轻松添加更多功能，例如输入验证或对输入数据的一些转换。此外，将这些验证或转换功能继承给子类，并根据应用需求进行保留或修改也会很有帮助。


  有时，通过属性访问器向用户暴露属性的另一种表示形式，同时隐藏属性的内部表示形式，似乎是个不错的主意。


  拥有属性访问器方法允许我们设置不同的访问级别，例如，访问器可以是公开的，但设置器方法可以针对特定用户群设置为受保护的。


  你还应注意，设置器必须有且只有一个形式参数，这意味着你应该为类实例的每个属性创建独立的设置器和访问器。


  ## 计算式方法名


  与对象字面量类似，类内部的方法也可以拥有计算式名称。这也适用于类的访问器和设置器访问器属性。正如在对象字面量中所见，计算式方法名可以用`[ ]`包裹起来；请查看以下代码片段作为示例：


  ```

  const methodName = "getColor";

  const propName = "color";

  class AeroPlane {

  constructor(color) {

  this._color = color

  }

  [methodName]() {

  return this._color;

  }

  get [propName]() {

  return this[`_${propName}`];

  }

  set propName {

  return this[`_${propName}`] = value;

  }

  }

  const whiteJet = new AeroPlane("white");

  console.log(whiteJet.color);

  // white

  ```


  在上例中，我们通过将方法名和访问器与设置器访问器属性名包裹在`[ ]`内，在类定义中对其进行计算。我们还在访问器和设置器方法内部使用字符串字面量来求值动态属性名。


  #### 类属性与隐私


  到目前为止，我们已经看到如何通过在类定义的构造函数方法内定义属性来向类的实例添加属性。然而，我们目前看到的所有属性都是公共属性，可以在类定义外部不使用设置器或访问器方法就能轻松访问。JavaScript
  社区中关于私有属性的讨论由来已久。遗憾的是，在 ES6 之前，JavaScript 中从未存在过私有属性，因此必须模拟它们。最常见的约定是在属性或方法名称前加上下划线，我们在前面的示例中已经看到过。


  在 ES6 中，有几种方法可以在类内部管理数据隐私。


  #### 使用构造函数环境


  将方法和属性存储在构造函数环境中，并在闭包中捕获变量，这种思路确保这些方法或属性不会被添加到原型中，并且只能由构造函数及其创建的函数访问。


  ```

  class AeroPlane {

  constructor(capacity) {

  this.checkCapacity = function(value) {

  if (capacity >= value) {

  return true;

  }

  return false;

  }

  }

  }

  const jet = new AeroPlane(200);

  console.log(jet.checkCapacity(100));    // true

  console.log(jet.capacity);              // undefined

  ```


  在上面的示例中，构造函数环境存储了参数和局部变量，通过使类属性（此处为`capacity`）在构造函数外部不可访问，从而保持其私有性。这使得私有数据完全安全，并且无法从类实例访问。


  #### 使用 WeakMaps


  在我们继续了解 WeakMaps 如何帮助在类内部保持数据私有之前，让我们快速了解一下什么是 WeakMaps。`WeakMap` 是 ES6 中引入的一种新数据类型。它们只是一个键值对的集合，主要限制是必须使用对象作为键。我们将在本书后面更详细地学习它们。但目前，你应该注意，你可以使用以下方式创建
  `WeakMap`：


  ```

  const myMap = new WeakMap();

  ```


  并且你可以在返回的 `WeakMap` 上使用 `set` 和 `get` 方法来存储和检索与之关联的值：


  ```

  const myMap = new WeakMap();

  const myObj = { name: "jack" };

  myMap.set(myObj, "developer");

  console.log(myMap.get(myObj));

  // developer

  ```


  如上述代码片段所示，我们使用一个对象作为键来在 `WeakMap` 内部存储值。


  `WeakMap` 的另一个特性是，如果对对象没有其他引用，它们不会阻止垃圾回收。因此，使用 WeakMap 来存储类的属性有助于保持数据私有，并且每当与类关联的实例被销毁时，它也会销毁这些私有属性。


  ```

  const data = new WeakMap();

  class AeroPlane {

  constructor(seats) {

  data.set(this, {

  capacity: seats

  });

  }

  get seats() {

  return data.get(this).capacity;

  }

  set seats(value) {

  data.get(this).capacity = value;

  }

  }

  const jet = new AeroPlane(200);

  console.log(jet.capacity);                // undefined

  console.log(jet.seats);                   // 200

  ```


  在上面的示例中，我们使用 `WeakMap` 来保持数据私有，并公开设置器和访问器来与类的私有数据进行交互。但这样做的代价是，需要将你的 `WeakMap` 对外部世界隐藏。只要它对外部访问是隐藏的，你的属性就会保持安全且私有。


  除了 `WeakMap` 之外，ES6 还提供了另一种新技术来保持数据私有（或者更确切地说，防止随意访问），即使用 Symbols，我们将在本书后面学习。


  #### 静态方法与属性


  使用类，你还可以定义属于类本身而非类的任何特定实例的属性和方法。这些方法和属性与类关联，而不是与类的实例关联，这通常有助于为应用程序创建实用函数。ES6 允许你通过在方法名之前使用
  `static` 关键字轻松创建静态方法：


  ```

  class AeroPlane {

  constructor(capacity) {

  this.capacity = capacity;

  }

  static radio(message) {

  console.log(`Message from broadcast: ${message}`)

  }

  }

  AeroPlane.radio("Sky is clear");

  // Message from broadcast: Sky is clear

  ```


  如前所述，需要重点注意的是，静态方法和属性是直接从其类中访问的，你不能从类的实例访问静态方法或属性。因此，静态方法也不能使用 `this` 访问在类的实例上定义的属性或方法。


  在编写本书时，ES6 不支持使用 `static` 关键字创建属性。有一个关于将它们添加到语言规范的提案，但在此提案被接受且实现发布之前，你可以使用静态访问器和设置器，或者手动将静态属性附加到类，如下所示：


  ```

  class AeroPlane {

  constructor(capacity) {

  this.capacity = capacity;

  }

  }

  AeroPlane.color = "white";

  console.log(AeroPlane.color);

  // white

  console.log(AeroPlane.capacity);

  // undefined

  ```


  在这个例子中，请注意我们如何使用类名访问静态属性，而对非静态属性则返回 `undefined`。


  ## 类继承与 super 关键字




  '
- "# ES6 类与继承\n\n`ES6` 引入了 `extends` 关键字，允许创建一个类作为另一个类的子类。继承让我们能够将另一个类的状态和行为合并到我们自己的类中。从父类扩展子类可以防止代码重复。考虑以下示例：\n\
  \n```javascript\nclass AeroPlane {\n  constructor(capacity) {\n    this.capacity\
  \ = capacity;\n  }\n  showCapacity() {\n    console.log(`Capacity of this plane:\
  \ ${this.capacity}`);\n  }\n}\nclass FighterPlane {\n  constructor(capacity) {\n\
  \    this.capacity = capacity;\n  }\n  showCapacity() {\n    console.log(`Capacity\
  \ of this plane: ${this.capacity}`);\n  }\n  fire() {\n    console.log(\"Loading\
  \ weapons and firing\");\n  }\n}\n```\n\n在上面的示例中，数据属性 `capacity` 和方法 `showCapacity`\
  \ 在两个类中重复出现。我们可以通过让 `FighterPlane` 继承自 `AeroPlane` 来轻松消除这种重复，从而将 `AeroPlane` 的状态和行为合并到\
  \ `FighterPlane` 中。考虑以下示例，其中 `FighterPlane` 类使用 `extends` 关键字从父类 `AeroPlane` 继承：\n\
  \n```javascript\nclass AeroPlane {\n  constructor(capacity) {\n    this.capacity\
  \ = capacity;\n  }\n  showCapacity() {\n    console.log(`Capacity of this plane:\
  \ ${this.capacity}`);\n  }\n}\nclass FighterPlane extends AeroPlane {\n  fire()\
  \ {\n    console.log(\"Loading weapons and firing\");\n  }\n}\nconst phantom = new\
  \ FighterPlane(2);\nphantom.showCapacity();\n// Capacity of this plane: 2\nphantom.fire();\n\
  // Loading weapons and firing\n```\n\n如果你也想在派生类中定义构造函数方法，你需要使用 `super()`，它允许在派生类中调用父类的构造函数。`super()`\
  \ 负责初始化上下文，因此你必须在构造函数方法中访问上下文（`this`）之前调用 `super()`；否则会导致错误。\n\n如果未定义构造函数，则在创建类的新实例时会使用所有给定的参数自动调用\
  \ `super()`，如下例所示：\n\n```javascript\nclass FighterPlane extends AeroPlane {\n  //\
  \ 没有构造函数\n  fire() {\n    console.log(\"Loading weapons and firing\");\n  }\n}\n\
  // 等价于\nclass FighterPlane extends AeroPlane {\n  constructor(...args) {\n    super(...args);\n\
  \  }\n  fire() {\n    console.log(\"Loading weapons and firing\");\n  }\n}\n```\n\
  \n#### 继承静态属性\n\n`ES6` 允许我们将父类的静态属性继承到子类中。考虑以下示例，其中 `AeroPlane` 的静态方法在其派生类（`FighterPlane`）上被调用：\n\
  \n```javascript\nclass AeroPlane {\n  static radio() {\n    console.log(\"Radio\
  \ works\");\n  }\n}\nclass FighterPlane extends AeroPlane {}\nFighterPlane.radio();\n\
  // Radio works\n```\n\n在这段代码中，一个新的静态方法 `radio()` 被添加到 `AeroPlane` 类中。通过继承，此方法可以作为\
  \ `FighterPlane.radio()` 使用，其行为方式与 `AeroPlane.radio()` 方法相同。\n\n#### 方法重写\n\n父类的方法可以在派生类内部被同名的父类方法轻松覆盖。例如，检查以下代码片段，其中父类（`AeroPlane`）中的\
  \ `fly()` 方法在派生类（`FighterPlane`）内部被重写：\n\n```javascript\nclass AeroPlane {\n  constructor(capacity)\
  \ {\n    this.capacity = capacity;\n  }\n  showCapacity() {\n    console.log(`Capacity\
  \ of this plane: ${this.capacity}`);\n  }\n  fly() {\n    console.log(\"Engines\
  \ on, and the plane will take off soon\");\n  }\n}\nclass FighterPlane extends AeroPlane\
  \ {\n  fly() {\n    console.log(\"Engines on, and the plane is gone\");\n  }\n \
  \ fire() {\n    console.log(\"Loading weapons and firing\");\n  }\n}\nconst phantom\
  \ = new FighterPlane(2);\nphantom.fly();\n// Engines on, and the plane is gone\n\
  phantom.showCapacity();\n// 2\n```\n\n如果你希望访问父类版本的方法，你可以通过 `super.fly()` 来实现，如下所示：\n\
  \n```javascript\nclass FighterPlane extends AeroPlane {\n  fly() {\n    super.fly();\n\
  \    console.log(\"Engines on, and the plane is gone\");\n  }\n}\n```\n\n这确保了每次在\
  \ `FighterPlane` 的实例上调用 `fly()` 方法时，首先会调用父类的该方法。除了方法，你也可以重写构造函数；例如，考虑以下代码片段：\n\n\
  ```javascript\nclass AeroPlane {\n  constructor(capacity, color) {\n    this.capacity\
  \ = capacity;\n    this.color = color;\n  }\n}\nclass FighterPlane extends AeroPlane\
  \ {\n  constructor(color) {\n    // 这个战斗机是双座的\n    super(2, color);\n  }\n}\nconst\
  \ phantom = new FighterPlane(\"grey\");\nconsole.log(phantom.capacity);       //\
  \ 2\n```\n\n#### 可继承的内置对象\n\n`ES6` 使得继承自内置类（如 `Array`，`String`，`RegEx` 等）变得非常容易，这在需要像栈、队列或任何其他链表结构这样的数据结构时非常有用。你也可以利用此功能根据需求为数组提供额外的辅助方法，例如\
  \ `first`，`last`，`shuffle` 等。\n\n考虑以下代码片段，我们通过扩展内置的 `String` 类来实现一个 `ReversedString`\
  \ 数据类型：\n\n```javascript\nclass ReversedString extends String {\n  print() {\n \
  \   return this.split('').reverse().join('');\n  }\n}\nconst str = new ReversedString(\"\
  Awesome\");\nconsole.log(str.print());\n// emosewA\n```\n\n## 总结\n\n`ES6` 类将 JavaScript\
  \ 中构建伪类以模仿其他编程语言中基于类的开发模式的现有模式正式化。它们使 JavaScript 中的继承更易于使用，并为你提供了语法糖，以便用更简单的基于类的语法实现\
  \ JavaScript 的经典原型继承模型。\n\n在本章中，我们研究了 `ES6` 中的类如何在底层使用原型继承，通过在类原型上定义非静态方法，而所有静态方法则定义在类本身上，使得所有类方法都不可枚举。我们还学习了新的基于类的继承语法，它允许你从基类创建派生类，也允许你继承自\
  \ JavaScript 中的内置类，如 `Array`，`String` 和其他数据类型。总的来说，类是对 JavaScript 非常重要的语法补充，通过提供简洁的语法，使我们能够以更清晰的方式声明自定义对象类型。\n\
  \n"
- '# 5. 模块


  JavaScript 在其早期阶段，最初是作为 Web 浏览器的一种简单脚本语言开始的。因此，它最初是建立在“一切都是共享的”方法之上的。但随着时间的推移，随着语言的发展以及
  JavaScript 应用程序变得越来越复杂，这种加载代码的方法开始变得更容易出错且令人困惑。这与大多数高级语言使用如模块和包等概念来帮助定义代码作用域的事实形成对比。在
  `ES6` 之前，JavaScript 应用程序中的所有内容，包括应用程序不同文件中的代码，都共享相同的作用域。这正是模块发挥作用的地方，它们有助于更好地管理和引入代码分离，减少命名冲突等问题并提高数据安全性。JavaScript
  开发者被迫求助于外部库来引入模块以帮助解决这些特定问题，但有了 `ES6`，模块现在已成为该语言的官方组成部分。


  ## 模块系统及一点历史


  过去，JavaScript 有两个主要的模块系统：异步模块定义 (AMD) 和 `CommonJS`。`CommonJS` 是 `Node.js` 中常用实现的模块标准。它具有简洁的语法，专为同步加载和服务器设计。另一方面，`AMD`
  是 `RequireJS` 中的流行实现，其语法稍显复杂，允许它在没有 `eval()` 或编译步骤的情况下工作。它专为异步加载和浏览器设计。两者在浏览器中都不是原生可用的。




  当 TC39 决定在 ES6 中实现模块规范时，他们没有采用已有的两种方案，而是提出了一种新的实现方法。他们的目标是同时满足 CommonJS 和 AMD 的用户。这种新方法建立在两者之上，并试图解决开发者在这两种实现中经常遇到的许多问题。


  ES6 模块提供了来自 AMD 和 CommonJS 的特性。它们使用紧凑的语法和静态模块结构，有助于代码优化、静态检查和消除死代码。它还像 CommonJS
  一样支持循环依赖，并像 AMD 一样支持异步加载和可配置的模块加载。


  终结 CommonJS 和 AMD 之间的碎片化，并拥有一个统一的本地模块标准，带来了额外的好处，例如废弃了传统上用于使同一文件能在不同系统中使用的 UMD（通用模块定义）模式。


  #### 传统 JavaScript 中的模块模式


  为了帮助我们更好地理解模块，在深入探讨 ES6 模块之前，我们将使用传统 JavaScript 实现模块模式。简单来说，模块是一个包含内部变量和函数的函数，它可以通过返回一个“公共
  API”来暴露给外部环境，该 API 通过拥有数据闭包的方法来访问函数内的数据。为了说明这一点，我们使用模块模式编写一个函数：


  ```

  function Message(text) {

  function printMessage() {

  console.log("This is the message: " + text + "!");

  }

  return {

  printMessage: printMessage

  };

  }

  var printer = Message("test");

  printer.printMessage();          // This is the message: test!

  ```


  在此示例中，变量 `printer` 被赋值为带有参数 "`test`" 的函数 `Message`。`Message` 是实现模块模式的函数，它为 `printer`
  提供了一个公共 API，该 API 可以访问其内部函数 `printMessage`，作为打印 `text` 参数的方法。


  ### ES6 中的模块


  ES6 中的模块使得将代码划分和分离成更小的独立片段变得更加容易，这些片段可以在需要时被重用并注入到其他地方，从而使测试代码的过程更加容易，因为模块与主代码解耦。模块在异步加载脚本方面也很有用，可以提高应用的加载时间。但模块系统对
  JavaScript 来说并不新鲜。


  模块就是被从其他文件加载到 JavaScript 代码中的 JavaScript 文件。但理解这与脚本的加载方式有何不同非常重要。如果我们将 JavaScript
  模块的语义与传统脚本加载进行比较，会发现一些关键区别。首先，模块始终在严格模式下运行，而传统脚本则可以更改其模式。如果你查看模块的顶级作用域，`this` 的值是
  `undefined`，并且在顶层创建的变量不会出现在共享的全局作用域中。你需要从模块内部获取的任何东西都必须显式地导出，我们才能在模块外部使用它们。现在，让我们通过理解导入和导出绑定的能力，来了解模块的核心价值。


  #### 导出


  `export` 关键字可用于将模块内部的代码部分暴露给其他模块。你可以从模块中导出一个变量、一个函数或一个类声明。未从模块导出的变量、函数或类在模块外部不可访问。让我们看几个例子：


  ```

  export var text = "ES6 is awesome";

  export let name = "Ian Murawski";

  export const number = 7;

  ```


  在此示例中，你正在导出 `text`、`name` 和 `number`，它们使用不同的变量声明关键字声明。你也可以从模块中导出一个函数或类。考虑以下示例：


  ```

  export function add(a, b) {

  return a + b;

  }

  export class Rectangle {

  constructor(length, width) {

  this.length = length;

  this.width = width;

  }

  }

  ```


  在这段代码片段中，我们正在导出函数 `add` 和类 `Rectangle`。你也可以导出一个模块私有的现有函数。


  ```

  function multiply(a, b) {

  return a * b;

  }

  export { multiply };

  ```


  从这个例子中，我们可以看到不仅可以导出一个函数声明——而且还可以导出一个对模块私有函数的引用。


  此时，理解这一点很重要：只有带有名称的函数或类声明才能以这种方式导出，所有这些导出都被称为命名导出。你不能从模块中导出匿名函数或类，除非它们被标记为使用 `default`
  关键字指定的 `default` 导出。你可以在一个模块中有多个命名导出，但只能有一个默认导出。同时使用两者是可能的，但通常最佳实践是将它们分开。


  #### 默认导出


  在 Node.js 中，模块只导出单个值是常见的做法。即使在前端 JavaScript 中，当我们为模型和组件使用类时，每个模块一个类也是常见的做法。ES6 模块被设计为选取一个默认导出，作为主要的导出值。


  可以使用 `default` 关键字将单个变量、函数或类指定为模块的默认导出。在一个模块中，你只能有一个值作为默认导出。在模块内对多个导出使用该关键字会引发错误。默认导出有助于简化从模块导入导出的语法。


  ```

  export default function(a, b) {

  return a * b;

  }

  ```


  在此示例中，该函数作为其默认值从模块导出。你可以注意到该函数如何不需要名称，因为它是默认导出，并且模块本身代表该函数，允许你省略函数的名称。你也可以为其分配一个名称，并使用
  `default` 导出函数名称。考虑以下示例：


  ```

  function multiply(a, b) {

  return a * b;

  }

  export default multiply;

  ```


  #### 导入


  一旦设置了包含相关导出的模块，就可以通过使用 `import` 关键字在另一个模块内访问它。import 语句包含两部分：你要导入的标识符以及应从哪里导入这些标识符的模块。这是其基本形式的语句：


  ```

  import { identifier1, identifier2 } from "./moduleFile.js";

  ```


  在上面的语句中，`identifier1` 和 `identifier2` 是从 `moduleFile.js` 导入的绑定。


  模块通过 `from` 关键字后一个表示包含模块的文件路径的字符串来指定。请注意，绑定列表看起来像一个解构对象，但请记住它不是。此外，绑定类似于使用 `const`
  定义的变量，也就是说，你不能使用相同的名称定义任何其他变量，也不能导入另一个具有相同名称的模块。


  使用上述语法，你可以从模块中导入特定的绑定，如下所示：


  ```

  // 导入函数 sum 和 multiply

  import { sum, multiply } from "./ moduleFile.js";

  console.log(sum(1, 7));                // 8

  console.log(multiply(2, 3));           // 6

  ```


  这里，有两个绑定从 `moduleFile` 模块导入：`sum` 和 `multiply` 可以像本地定义的标识符一样使用。但让我们考虑一种情况，即你想要导入模块中所有可用的导出，而无需显式地按名称声明它们。这可以通过使用通配符
  `*` 并将导入的标识符作为对象的属性来实现。


  ```

  // 导入所有内容

  import * as example from "./ moduleFile.js";

  console.log(example.sum(1,7));          // 8

  console.log(example.multiply(2, 3));    // 6

  ```


  在这段代码中，`moduleFile` 中所有导出的绑定都被加载到一个名为 `example` 的对象中。




