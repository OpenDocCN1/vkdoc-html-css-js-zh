  \ Edge 中的周选择器\n\n## 其他视觉元素\n\n有几个元素用于向表单提供视觉信息，而不是接受用户输入。您无疑见过`label`元素，因为它几乎用于每个表单。其他元素如`output`、`meter`和`progress`有更专门的用途，但可能非常有用。\n\
  \n#### 标签\n\n我在本章开头介绍了`label`元素，但没有详细说明。您需要为表单中的字段添加标题，以便用户知道在每个字段中输入什么。然而，正如我在本章中多次演示的，您可以在表单中包含内容，而无需使用`label`元素。由于\
  \ HTML5 注重语义，作为标题（或标签）的内容应通过将其放入`label`元素中来称为标签。\n\n`label`元素应该与其描述的`input`元素关联，有两种方法可以实现。我个人更倾向于简单地将`input`元素嵌入到`label`元素内部。另一种选择是使用`label`元素的`for`属性。`for`属性指定了输入类型的`id`。当然，这要求您为`input`元素分配一个唯一的`id`。这两种技术如下所示：\n\
  \n```html\n<p>Deliver to: <br />\n\n<label>\n\nAddress:\n\n<input type=\"text\"\
  \ size=\"30\" name=\"Address\" />\n\n</label>\n\n<label>\n\nZipCode:\n\n<input type=\"\
  text\" maxlength=\"5\" size=\"5\" name=\"Zip\" />\n\n</label>\n\n<label for=\"telephone\"\
  >Phone #:</label>\n\n<input type=\"tel\" id=\"telephone\" name=\"Phone\" />\n\n\
  </p>\n```\n\n使用关联的`label`元素有一个优点（除了更好的语义之外）。如果您点击一个`label`元素，关联的`input`元素将获得焦点，用户可以开始向其中输入数据。\n\
  \n在前面的示例中，如果您点击**Deliver to:** 文本，则不会发生任何事情。但如果您点击**Address:**、**ZipCode:** 或 **Phone\
  \ #:** 文本，关联的`input`元素将被选中。\n\n### Output 元素\n\n如果表单有输入，那么它们也可以有输出，这似乎也很合理，对吧？在\
  \ HTML5 之前，答案是否定的，但现在我们有了`output`元素。它用于计算出的数据，这些数据通常基于用户的输入，但并非直接输入。例如，在选择完所有披萨选项后，您会希望显示应付款总额。这正是`output`元素的用途。\n\
  \n当页面首次加载时，您可能不知道`output`元素的值。您可以使用默认值（如 0），或者添加`hidden`属性使其不显示。一旦输入了必要的值，您可以在客户端执行计算并更新`output`元素。然而，在我们的披萨订单示例中，您可能需要将表单提交到服务器，而回发响应将设置`output`元素的内容。\n\
  \n您应该为计算出的值添加一个标签，可以像这样将其嵌套在`label`元素内：\n\n```html\n<p>\n\n<label>Total due:\n\n\
  <output id=\"total\" name=\"Total\">$0.00</output>\n\n</label>\n\n</p>\n```\n\n\
  `output`元素支持`for`属性，您可以在其中指定用于计算此值的输入元素。每个输入元素的`id`应包含在`for`属性中，用空格分隔。\n\n### Meter\
  \ 元素\n\n`meter`元素类似于我前面描述的`range`元素，它显示一个值，不是作为具体数字，而是通过其在刻度线上的位置来显示。然而，用户无法更改`meter`元素的值。\n\
  \n`meter`元素类似于汽车中的温度表。我并不关心温度是 205° 还是 210°，我只想知道它是否*正常*。有一天我开车去上班，开了一会儿后碰巧注意到温度表显示在低温区域。我觉得这很有趣，但并没有太担心。过了一会儿，我看到它显示发动机运行温度比正常高；我觉得这更有趣了。不久，它超出了刻度范围，我知道自己有麻烦了。您可能已经猜到了，我的节温器卡住了。起初它卡在开启状态，然后卡在了关闭状态。温度表通过简单地将值显示为低温、正常、高温或“靠边停车！”告诉我需要知道的一切。\n\
  ```\n\n\n"
- '# HTML 表单元素


  ## `<meter>` 元素


  `meter` 元素的工作原理与此相同。通过指定 `min` 和 `max` 属性来定义刻度，然后 `value` 属性会在该连续区间内显示对应的位置。与温度计类似，你可以在该刻度内定义范围，以指示**最佳值**所在区域。`meter`
  元素支持定义这些范围的 `low`、`high` 和 `optimum` 属性。


  然而，这可能有点难以理清，因为最佳范围可能位于刻度的低端、高端，或者中间某个位置。你如何设置这些属性取决于不同的场景。


  图 8-22 展示了每种场景，并说明了每种情况下应如何设置这些属性。


  ![](img/index-178_1.png)


  ![](img/index-178_2.jpg)


  **图 8-22.** *定义最佳范围*


  为了测试这一点，以下标记将为每种场景创建三个 `meter` 元素，并在每个元素上设置 `value` 属性，以测试所有三个范围。在 Chrome 中渲染的结果内容如
  图 8-23 所示。


  ```

