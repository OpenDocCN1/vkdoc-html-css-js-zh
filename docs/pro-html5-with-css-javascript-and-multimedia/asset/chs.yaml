  \ DB\n\n**练习 25-1. 创建 Web 项目**\n\n1. 使用基本标记创建一个名为 `Chess.html` 的新网页：\n\n```\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n<title>第 25 章 -\
  \ 国际象棋</title>\n<script src=\"Data.js\" defer></script>\n<script src=\"Chess.js\"\
  \ defer></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n2. 然后使用以下代码创建一个 `Chess.js`\
  \ 脚本文件：\n\n```\n\"use strict\";\n```\n\n3. 在 `Chess.html` 文件的空 body 元素中添加一个 `div`\
  \ 元素，使用以下标记：\n\n```\n<div>\n<canvas id=\"board\" width =\"600\" height =\"600\"\
  >\n不支持\n</canvas>\n</div>\n```\n\n4. 在 Web 项目中添加一个 `Images` 文件夹。\n\n5. 棋子的图像包含在源代码下载文件中。这些与[第\
