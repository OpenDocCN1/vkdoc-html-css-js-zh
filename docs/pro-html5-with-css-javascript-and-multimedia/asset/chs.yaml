  ```

  <input type="url" name="Website" placeholder="http://www.apress.com" size="50" />

  <input type="text" value="Read-only text" readonly name="ReadOnly" />

  <input type="text" value="Disabled text" disabled />

  <label for="iComments">Comments:</label>

  <textarea id="iComments" rows="3" cols="50" wrap="hard" maxlength="250" name="Comments">

  </textarea>

  ```


  在电子邮件字段上，将`size`设置为 100 以使其足够大以容纳一个或两个电子邮件地址。这还具有`multiple`属性以允许输入多个地址。密码字段使用`minlength`和`maxlength`属性提供客户端长度验证。电话号码字段包含一个支持美国电话号码的正则表达式模式。`placeholder`属性还提供了号码格式的提示。


  这包括一个禁用和一个只读文本框，以便您了解它们工作方式的差异。对于这两种情况，值都是通过`value`属性设置的，因为它无法在表单上输入。您可以突出显示只读字段上的文本并复制它，但无法在禁用字段上执行此操作。最后，注释字段使用一个`textarea`元素，显示三行文本。其最大长度为
  250 个字符。


  如果您将这些输入元素添加到本章开头显示的初始表单中，它看起来将类似于图 8-4。


  ***图 8-4.** 添加示例文本字段*


  光标应位于搜索框中，因为该元素具有`autofocus`属性。当您提交表单时，如果任何验证失败，表单将显示错误，如图 8-5 所示。


  ***图 8-5.** 显示验证错误*




  #### 选择元素


  有几种结构允许你在表单上呈现一组固定的选项。复选框和单选按钮可以通过 `input` 元素的 `type` 属性来创建。下拉列表则通过 `select` 和 `option`
  元素来创建。


  ## 复选框


  复选框用于表示布尔值，例如“可用？”或“可以打电话？”。值为真时选中，值为假时取消选中。通过将 `input` 元素的 `type` 属性设置为 `checkbox`
  来创建复选框。


  当你希望从一组选项中允许多选时，也可以使用复选框。例如，如果你正在订购披萨并选择配料，你可能希望列出所有可用的项目，如蘑菇、香肠、橄榄等，并在每个项目旁边放一个复选框。从技术上讲，每个项目都是一个具有布尔值的独立字段：你要蘑菇吗？你要香肠吗？


  要指示复选框已被选中，请使用布尔属性 `checked`。如果存在此属性，则复选框被选中；否则不选中。提交表单时，只有选中的元素才会包含在表单数据中，而 `value`
  属性决定了实际提交的内容。如果你希望数据为 `CanCall=true`，那么将 `name` 属性设置为 `CanCall`，`value` 属性设置为 `true`。在披萨示例中，你可以将所有复选框的
  `name` 属性设置为 `Topping`，并将 `value` 属性设置为 `Mushrooms`、`Sausage` 或 `Olives`。提交表单时，每个被选中的复选框都会提交一个
  `Topping` 字段及其对应的值。


  > **提示：** 复选框要么选中要么未选中；没有不确定的值。HTML5 不支持三态复选框（选中、未选中、未指定），尽管有一些 JavaScript 解决方案可以提供此功能。例如，[请参阅
  http://jquer.in/jquery-plugins-for-html5-forms/tristate/](http://jquer.in/jquery-plugins-for-html5-forms/tristate/)


  `input` 元素并不显示任何文本。`name` 和 `value` 属性仅在提交数据时使用。你可以为每个 `input` 元素使用一个 `label` 元素，或者简单地将内容环绕在复选框周围。例如，选定的配料可以这样呈现：


  ```html

  <p>配料：


  <input type="checkbox" name="Topping" value="Mushrooms" />蘑菇？


  <input type="checkbox" name="Topping" value="Sausage" />香肠？


  <input type="checkbox" name="Topping" value="Olives" />橄榄？


  </p>

  ```


  当 `required` 属性用于 `type="checkbox"` 的 `input` 元素时，表示在提交表单之前必须选中该复选框。当用户需要在继续之前确认某些事项（例如条款和条件）时，你会用到此功能。


  ## 单选按钮


  通过使用 `input` 元素并将 `type` 属性设置为 `radio` 来创建单选按钮。单选按钮的工作方式与复选框非常相似：`checked` 属性指示是否被选中；只有选中的值才会被提交；`value`
  属性指定应提交的文本。


  主要区别在于，单选按钮通常作为一组按钮提供，并且一组中只能选择一个单选按钮。当选中一个单选按钮时，该组中所有其他元素的 `checked` 属性都会被移除。单选按钮组由
  `name` 属性决定。所有具有相同 `name` 属性值的元素被视为同一组。


  回到我们的披萨示例。假设你提供三种类型的饼皮：薄皮、厚皮和深盘。你可以添加三个单选按钮，它们的 `name` 属性都设置为 `Crust`。每个按钮的值不同，分别为
  `Thin`、`Thick` 或 `DeepDish`。提交表单时，例如，如果选择了厚皮选项，该字段将提交为 `Crust="Thick"`。和复选框一样，你可以在单选按钮周围定义额外的文本：


  ```html

  <p>饼皮：


  <input type="radio" name="Crust" value="Thin" />薄皮


  <input type="radio" name="Crust" value="Thick" />厚皮


  <input type="radio" name="Crust" value="DeepDish" />深盘


  </p>

  ```


  你可以通过在其中一个单选按钮上添加 `checked` 属性来默认选中一个选项。如果你要求必须进行选择，请将 `required` 属性添加到其中一个单选按钮上；哪个按钮添加该属性无关紧要。在多个按钮上添加
  `required` 属性没有额外效果。如果存在 `required` 属性，浏览器将不会提交表单，直到选中其中一个单选按钮，如图 8-6 所示。


  > **图 8-6.** 验证必选的单选按钮


  ## 下拉列表


  对于前两种输入类型，所有选项始终可见。使用复选框可以进行多项选择；使用单选按钮每组只能选择一个。然而，对于下拉列表，在用户点击下拉菜单之前，只显示选中的选项，然后才显示可用选项。


  使用 `select` 元素创建下拉列表。在 `select` 元素内部，为每个可用选项包含一个 `option` 元素。在 `select` 元素上设置 `name`
  属性，以指定提交表单时将发送的字段名。在 `option` 元素上使用 `value` 属性，以指示选中该选项时将提交的字段值。


  `option` 元素可以通过嵌套在 `optgroup` 元素内来进行分组。这仅用于视觉目的，对提交的数据或选项的选中与取消选中没有影响。当选项列表相对较长时，`optgroup`
  元素会很有帮助。`optgroup` 元素有一个必需的 `label` 属性。在此处指定组文本，该文本会显示在选项之前。`optgroup` 元素中的选项也会进行缩进。


  默认情况下，第一个选项将被选中并在提交表单时提交。你可以通过将 `selected` 属性添加到所需的 `option` 元素，来选择另一个选项作为默认选项。只有一个选项应具有
  `selected` 属性；如果多个选项具有 `selected` 属性，则除最后一个外，其他都将被忽略。


  通过选择另一个选项来取消选中当前选项。没有办法取消选中选项使得没有任何选项被选中。为了解决这个问题，你可以包含一个*未选中*的选项，其 `value` 属性设置为空字符串。通常你会为其指定一个显示字符串，例如
  `请选择`。如果选择了此选项，则会向服务器提交一个空字符串。你可以在 `select` 元素上添加 `required` 属性，以要求选择某个其他选项（该选项的
  `value` 属性非空）。


  可以像这样创建一个带有分组的下拉列表。其渲染结果如图 8-7 所示。


  ```html

  <p>附加品：


  <select name="Addons" required>


  <option value="">请选择...</option>


  <option value="None">仅披萨</option>


  <optgroup label="附加品">


  <option value="Wings">一份布法罗鸡翅</option>


  <option value="GarlicBread">添加蒜香面包</option>


  </optgroup>


  </select>


  </p>

  ```


  > **图 8-7.** 带有分组的选择选项


  在此示例中，初始选项的 `value` 属性为空，并且 `select` 元素具有 `required` 属性。用户在提交表单之前需要在此下拉菜单中做出选择。


  ## 多选列表


  如果你添加了 `multiple` 属性，`select` 元素允许你选择多个选项。使用 `multiple` 属性后，用户界面会显著改变。这不再是一个只显示选中选项的下拉列表。相反，它更像一个显示所有选项的简单列表。你可以通过设置
  `size` 属性来控制可见选项的数量。如果选项多于该数量，用户可以通过滚动列表来查看它们。




  '
- "# 使用多选列表\n\n要选择多个选项，您需要在单击所需选项的同时按住`Ctrl`键。您也可以先选择一个选项，按住`Shift`键，再选择另一个选项，这将选中两者之间的所有选项。在不按住`Ctrl`或`Shift`键的情况下单击某个选项，将会首先取消所有选项的选中状态。\n\
  \n为了演示这一点，我们使用一个多选列表框（如以下代码所示）重新实现`Toppings`字段。选择几个选项后，其渲染效果将如图 8-8 所示。\n\n```html\n\
  <select name=\"Toppings\" multiple size=\"4\">\n  <option label=\"Mushrooms?\" value=\"\
  Mushrooms\" />\n  <option label=\"Sausage?\" value=\"Sausage\" />\n  <option label=\"\
  Olives?\" value=\"Olives\" />\n</select>\n```\n\n![](img/index-166_1.jpg)\n\n**图\
  \ 8-8.** 使用多选列表框\n\n> **注意：** `size`属性也支持下拉列表（即不包含`multiple`属性的情况）。这将始终显示指定数量的选项。然而，从用户界面（UI）角度看，这样做通常没有意义。\n\
  \n当表单提交时，发布的数据将与使用复选框的初始实现完全相同。`name`属性定义了所使用的字段名称，`value`属性指定了提交时的字符串。每个被选中的选项都会提交一个独立的字段。\n\
  \n---\n\n#### 其他类型\n\n有几种用于特殊用途的其他输入类型，每种都有特定的属性来控制这些元素的独特方面。\n\n## 数字（Number）\n\
  \n数字输入类型相当直接。它的行为很像文本框，但只允许输入数字。它允许输入小数值，但不会强制任何特定的格式或数字类型（例如仅限整数）。如果需要这些限制，您可以像前面描述的那样使用`pattern`属性。\n\
  \n您可以使用`min`和`max`属性来指定此字段的允许范围。浏览器将确保输入的数字在此范围内。大多数浏览器还提供上下箭头，可用于递增或递减当前值。这仅适用于整数，如果预期输入小数值则无效。\n\
  \n以下是数字输入字段的典型实现：\n\n```html\n<p>Number of utensils:\n  <input type=\"number\" min=\"\
  1\" max=\"4\" value=\"1\" name=\"Utensils\" />\n</p>\n```\n\n## 颜色（Color）\n\n颜色输入类型将显示所选颜色的示例。点击该示例时，浏览器会显示一个颜色选择器，如图\
  \ 8-9 所示。\n\n![](img/index-167_1.jpg)\n\n**图 8-9.** 一个颜色选择器示例\n\n当表单提交时，所选颜色将以 RGB\
  \ 表示法提供。例如，绿色指定为`#00ff00`。然而，如果进行 URL 编码，井号（`#`）会被替换为`%23`。\n\n> **注意：** 截至撰写本文时，只有\
  \ Chrome、Firefox 和 Opera 支持颜色输入类型。\n\n## 文件（File）\n\n使用文件输入类型可以轻松选择一个或多个文件。如果您希望允许选择多个文件，请添加`multiple`属性。您还可以通过使用`accept`属性来提供所需文件类型的提示。该属性接受一个以逗号分隔的\
  \ MIME 类型列表，例如`text/css`。您可以使用通配符，例如以下几种常见值：\n\n- `text/*` - 文本文件\n- `image/*` -\
  \ 图像文件\n- `audio/*` - 音频文件\n- `video/*` - 视频文件\n\n![](img/index-168_1.jpg)\n\n您也可以列出一个或多个文件扩展名，例如`accept=\"\
  .jpg, .gif\"`。以下是一个包含两个输入字段的简单示例。第一个可以选择单个音频文件；第二个可以选择一个或多个扩展名为`.jpg`或`.png`的图像文件：\n\
  \n```html\n<p>Select file(s) to upload:\n  <input type=\"file\" name=\"music\" accept=\"\
  audio/*\" />\n  <input type=\"file\" name=\"pictures\" multiple accept=\".jpg, .png\"\
  \ />\n</p>\n```\n\n> **注意：** `accept`属性有助于引导用户选择合适的文件类型。但是，\n\n\n\n"
- "# 文件输入与范围输入\n\n用户通常可以轻松覆盖默认设置并选择不同类型的文件。但服务器端代码应始终验证文件是否为正确的类型。\n\n图 8-10 和图 8-11\
  \ 分别展示了 Chrome 和 Firefox 中的输入按钮及文件对话框。\n\n***图 8-10.** Chrome 中的文件输入与对话框*\n\n![](img/index-169_1.jpg)\n\
  \n*第 8 章 ■ HTML 表单元素*\n\n***图 8-11.** Firefox 中的文件输入与对话框*\n\n如您所见，其格式和具体功能可能有所不同，但基本能力是一致的。\n\
  \n## 范围（Range）\n\n范围输入类型在 W3C 规范中也被称为“不精确的数字输入控件”。它通常用于当具体数值不如其在某种尺度上的相对值重要时。\n\n\
  不过，此输入类型最终会有一个数值。其用户界面呈现为一个滑块，用户可以拖动它，并根据其位置确定一个值。\n\n范围输入类型具有 `min` 和 `max` 属性，用于定义滑块两端的值。当滑块位于刻度左侧（或底部）时，其值为\
  \ `min` 属性指定的值。`max` 属性必须大于 `min` 属性，但两者或其中之一可以为负值。\n\n您还可以指定 `step` 属性，该属性定义了滑块上的停止点。例如，将\
  \ `step` 属性设置为 `10` 将只允许您以 10 的间隔停止。默认值为 `1`，这将确保用户只能选择整数。如果您将值设置为 `any`，则没有预设的停止点，用户可以在任意位置停止。\n\
  \n■ **注意**：设置 `step=\"any\"` 时要小心，因为该值将是一个浮点数，例如 `44.9814126394052`（我在测试时恰好得到了这个值）。由于这被称为“不精确的数字输入控件”，这可能是您不想要的精度。如果您需要比\
  \ `1` 更精细的粒度，可以对 `step` 属性使用小数值，例如 `.1`。\n\n![](img/index-170_1.jpg)\n\n![](img/index-170_2.jpg)\n\
  \n![](img/index-170_3.jpg)\n\n![](img/index-170_4.jpg)\n\n*第 8 章 ■ HTML 表单元素*\n\n\
  您可以在滑块上方显示刻度标记，以指示停止点的位置。但要做到这一点，您必须使用 `datalist` 元素来定义它们。为每个需要显示刻度标记的位置添加一个带有 `value`\
  \ 属性的 `option` 元素。然后，在 `input` 元素中使用 `list` 属性引用该 `datalist`。例如：\n\n```\n<datalist\
  \ id=\"SurveyStops\">\n  <option value=\"0\" />\n  <option value=\"10\" />\n  <option\
  \ value=\"20\" />\n  <option value=\"30\" />\n  <option value=\"40\" />\n  <option\
  \ value=\"50\" />\n</datalist>\n\n<p>您对订购流程的满意度如何？\n  <input type=\"range\" name=\"\
  Survey\" min=\"0\" max=\"50\" step=\"10\" list=\"SurveyStops\" />\n</p>\n```\n\n\
  不同浏览器实现之间的用户界面差异很大。例如，Chrome、Firefox、IE 和 Opera 对此标记的渲染效果分别如图 8-12、8-13、8-14 和 8-15\
  \ 所示。\n\n***图 8-12.** Chrome 中的范围输入类型*\n\n***图 8-13.** Firefox 中的范围输入类型*\n\n***图\
  \ 8-14.** IE 中的范围输入类型*\n\n***图 8-15.** Opera 中的范围输入类型*\n\n由于停止点和刻度标记是独立定义的，它们不必相同。您可以将停止点设置为每隔\
  \ 5 一个，而刻度标记设置为每隔 10 一个。当然，它们也可以完全不同步，例如每 7 个标记一个刻度，而 `step` 设置为 `10`。然而，这会让用户感到困惑，应避免这样做。\n\
  \n在撰写本文时，Firefox 不支持刻度标记，如图 8-13 所示。此外，在 IE 11 中，如果您没有通过 `datalist` 元素指定刻度标记，它会自动根据\
  \ `step` 属性显示它们。在 IE 和 Edge 中，当用户点击输入字段时，选中的数值会显示在滑块上方。\n\n*第 8 章 ■ HTML 表单元素*\n\
  \n## 隐藏输入（Hidden Input）\n\n\n\n`<input>`元素也支持`hidden`类型。正如你所料，这种类型没有用户界面；用户无法看到或修改它的值。不过，当表单提交时，它会与其他元素一起提交。这允许你在提交的数据中包含一些硬编码的内容。例如，假设你有多个表单提交到同一个服务器地址，你可以在隐藏输入字段中包含使用的是哪个页面。为此，只需在标记中设置`value`属性即可。\n\
  \n这种类型的另一个更常见的应用是捕获通过 JavaScript 收集的数据。例如，你可以使用 JavaScript 获取用户的位置，并将其包含在表单数据中。在这种情况下，`value`属性是通过\
  \ JavaScript 设置的。\n\n#### 日期与时间数据\n\nHTML5 规范定义了许多与日期/时间值相关的输入类型。其中五种类型得到了大多数主流浏览器的支持，而\
  \ Firefox 是最显著的例外。此外，IE 也不支持这些类型，但它们可以在 Edge 浏览器中工作。如果不被支持，这些输入元素将显示为简单的文本框。你应该包含`placeholder`属性来指示预期的格式。在支持该输入类型的浏览器中，`placeholder`会被忽略。\n\
  \n这五种类型是：\n\n- `date` - 不含时间部分的日期\n- `datetime-local` - 日期和时间；时间为（浏览器的）本地时间 - 不支持世界时或时区\n\
  - `time` - 本地时间；同样不支持时区\n- `month` - 特定的年份和月份\n- `week` - 特定的周，表示为年份和周数（1-53）\n\n\
  > **注意**：是的，通常一年只有 52 周。然而，52 * 7 只有 364 天，所以每年会多出一天，大约每四年会多出两天。因此，每五到六年，我们就会有一个第\
  \ 53 周。\n\n这些类型都允许使用`min`和`max`属性来定义允许输入值的范围。\n\n然而，浏览器对这些属性的支持程度参差不齐。对于`month`和`week`类型，没有任何浏览器支持它们。对于其他三种类型，它们在大多数情况下得到支持，但并不一致。\n\
  \n不过，你应该始终提供额外的客户端或服务器端验证，而不是依赖浏览器。\n\n你应该酌情定义这些属性，因为在支持它们的浏览器中，浏览器可以提供更好的用户体验。\n\
  \n`step`属性也针对这些类型进行了定义。不过，目前它仅支持`time`和`datetime-local`类型。用户界面通常会提供向上/向下箭头，让用户可以在允许的值之间滚动。规范并未明确说明`step`属性应如何使用。支持该属性的浏览器主要将其用于秒数。例如，如果你设置`step=\"\
  15\"`，单击向上箭头将使所选时间增加 15 秒。\n\n与其他输入类型一样，你可以通过添加`value`属性来设置初始值。如果未指定，字段通常会使用当前日期（或时间）。这可能会受到`min`和`max`属性的影响。例如，如果`min`属性是未来的日期，那么它通常会成为初始值。初始值仅影响日期选择器和滚动功能。除非在标记中提供了值，否则在用户输入值之前，字段的实际值将为`null`。\n\
