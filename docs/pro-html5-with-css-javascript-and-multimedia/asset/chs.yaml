  \ 0 到 7，从左到右、从上到下。`height`和`width`属性表示图像的大小，会根据棋子类型而变化。`killed`属性用于表示棋子是否已被捕获。被捕获的图像将不显示。将以下代码添加到`Chess.js`中：\n\
  \n```javascript\n// Define a class to store the piece properties\nfunction ChessPiece()\
  \ {\n  this.image = null;\n  this.x = 0;\n  this.y = 0;\n  this.height = 0;\n  this.width\
  \ = 0;\n  this.killed = false;\n}\n```\n\n6. 将以下函数添加到`Chess.js`文件中。这实现了`drawPiece()`函数，该函数根据类属性绘制单个棋子。它还实现了`drawAllPieces()`函数，该函数将绘制`pieces`数组中定义的每一个棋子。\n\
  \n```javascript\n// Draw a chess piece\nfunction drawPiece(p) {\n  if (!p.killed)\n\
