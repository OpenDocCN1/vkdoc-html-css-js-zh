  \        markRestroom(map, restrooms[i].lat, restrooms[i].long);\n    }\n}\n\nfunction\
  \ markRestroom(map, lat, long) {\n    var pushpinOptions = { icon: '/images/restroom.gif',\
  \ width: 35, height: 35 };\n    var pushpin = new Microsoft.Maps.Pushpin\n     \
  \   (new Microsoft.Maps.Location(lat, long), pushpinOptions);\n    map.entities.push(pushpin);\n\
  }\n```\n\n5. 在`DisplayMap()`函数末尾添加此函数调用，以显示额外图钉：\n\n```javascript\n// 显示洗手间位置\n\
  markRestrooms(map);\n```\n\n6. 刷新浏览器，您应能看到洗手间位置处出现图钉，如图 26-8 所示。\n\n![图 26-8](img/index-521_1.jpg)\n\
  \n***图 26-8.** 添加洗手间图钉*\n\n> **注意**：此数据纯属虚构。若您碰巧在阅读此书时身处旧金山 39 号码头，请勿依照此地图寻找洗手间。\n\
  \n地图 API 还能实现更多功能，例如显示前往所选地点的导航路线，甚至显示当前交通拥堵区域。欢迎访问交互式 SDK：[`www.bing.com/api/maps/sdk/mapcontrol/isdk`](http://www.bing.com/api/maps/sdk/mapcontrol/isdk)。您可以逐一体验各项功能，地图下方会显示对应的\
  \ JavaScript 代码。\n\n### 本章小结\n\n在本章中，您将地理定位功能与 Bing Maps 相结合，创建了非常实用的网站。\n\n地理定位请求异步处理。获取地理定位对象后，调用其`getCurrentPosition()`函数并指定成功和失败的回调函数。获取位置后，`Position`对象会传递给回调函数，其中包含纬度、经度和估算精度。若客户端具有\
  \ GPS 功能，`Position`对象还会包含海拔、速度和方向。\n\nBing Maps 等地图平台易于使用且能轻松集成到网页中。在本应用中，您展示了地图并以当前位置为中心，同时添加图钉标注附近洗手间位置。\n\
  \n## 附录 A\n\n## AJAX\n\n在传统 Web 应用（有时称为旧式方法）中，页面渲染后用户进行交互（如登录、输入搜索条件或选择选项），信息随后回传至服务器，新页面返回并在浏览器中渲染。这必然需要服务器往返通信以及下载和渲染新页面。但还有另一种响应更迅速的方式：使用第[18](http://dx.doi.org/10.1007/978-1-4842-2463-2_18)章介绍的\
  \ DOM 操作技术直接更新当前页面。为此需要从服务器获取数据，这便是 Ajax 的用武之地。Ajax 的另一个常见用途是仅下载部分页面，在用户阅读已下载内容时，Ajax\
  \ 在后台加载剩余页面。\n\n*Ajax*是异步 JavaScript 与 XML（Asynchronous JavaScript And XML）的缩写。Ajax\
  \ 与其说是一项技术，不如说是一种使用多种技术的设计模式。简而言之，Ajax 就是客户端运行的 JavaScript 代码通过服务器调用来获取数据。调用时会注册回调函数处理响应。最初开发此技术时，XML\
  \ 是预期的响应格式，因此得名。但响应并非必须为 XML，如今多数情况下会采用 JSON 或 HTML 格式。\n\n该概念最早出现在 Internet Explorer\
  \ 5 中，使用名为`XMLHTTP`的 ActiveX 对象。其他浏览器随后推出了提供类似功能的`XMLHttpRequest`对象。从 IE7 开始，微软也支持`XMLHttpRequest`对象。\n\
  \n> **注意**：Ajax 用于与 RESTful Web 服务通信。要使用 Ajax，您需要了解 RESTful Web 服务的基础知识，例如 HTTP\
  \ 动词以及请求与响应标头。如果您不熟悉这些内容，建议阅读此文：[`www.drdobbs.com/web-development/restful-web-services-a-tutorial/240169069`](http://www.drdobbs.com/web-development/restful-web-services-a-tutorial/240169069)\n\
  \n## 发起请求\n\n要发起请求，您需要创建`XMLHttpRequest`对象的实例。然后执行以下操作：\n\n- 指定回调函数处理`readystatechange`事件（稍后详述）。\n\
  - 打开连接，指定 HTTP 动词（如`GET`、`POST`、`PUT`或`DELETE`）以及要调用的 Web 服务 URL。\n- 设置所需的请求标头。\n\
  - 发送请求。\n\n© Mark J. Collins 2017\n\n\n\n# 附录 A：AJAX\n\nM. J. Collins，《精通 HTML5：CSS、JavaScript\
  \ 与多媒体》，DOI 10.1007/978-1-4842-2463-2_27\n\n一个简单的 GET 请求，代码可能如下所示：\n\n```\nvar myRequest\
  \ = new XMLHttpRequest();\n\nmyRequest.onreadystatechange = displayResults;\n\n\
  myRequest.open(\"GET\", url);\n\nmyRequest.setRequestHeader(\"Content-Type\", \"\
  application/json\");\n\nmyRequest.send();\n```\n\n如果使用 POST 或 PUT 动词，你很可能需要在请求正文中传递数据。在这种情况下，数据通过\
  \ `send()` 方法传递。例如：\n\n```\nmyRequest.send(body);\n```\n\n> **警告**：通常情况下，Ajax 调用只能发送到与调用页面同域的服务。例如，如果你的页面来源是\
  \ `http://someDomain.com`，那么你只能调用 URL 以 `http://someDomain.com` 开头的服务。存在绕过这些限制的方法，但这超出了本书的讨论范围。\n\
  \n更多信息，请参阅以下文章：[`developer.mozilla.org/en-US/docs/Web/HTTP/Access_control_CORS`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Access_control_CORS)\n\
  \n## 处理响应\n\n你可能已经注意到，有一个单独的回调函数会在请求的就绪状态（或简称状态）每次发生变化时被调用。当收到响应或发生错误时，状态会发生变化，因此你的回调函数需要处理这两种情况。共有五种可能的状态值，当状态变为其中任何一种时，该函数都会被调用：\n\
  \n- 0 - UNSENT（未发送）\n- 1 - OPENED（已打开）\n- 2 - HEADERS_RECEIVED（已收到响应头）\n- 3 - LOADING（加载中）\n\
  - 4 - DONE（完成）\n\n在大多数情况下，你不会关心中间状态，只需要知道请求何时完成。你可以使用常量 `XMLHttpRequest.DONE`，其值为\
  \ 4。回调函数通常会以如下代码开始，以忽略所有其他状态转换：\n\n```\nif (myRequest.readyState === XMLHttpRequest.DONE)\
  \ {\n    // ... 执行某些操作\n}\n```\n\n你还应该将此代码包装在 try/catch 块中，因为某些错误（例如网络错误）会生成异常。接下来你需要做的是检查请求的状态。就绪状态只告诉你请求已完成；你仍然不知道它是否成功。这通过检查\
  \ `status` 属性来完成，如下所示：\n\n```\nswitch(myRequest.status) {\n    case 500:  // 服务器错误\n\
  \        // ...\n        break;\n    case 404:  // 未找到\n        // ...\n       \
  \ break;\n    case 200:  // 成功\n        // ...\n        break;\n}\n```\n\n> **提示**：返回的状态值是\
  \ HTTP 规范（http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html）定义的标准 HTTP 状态码。这篇\
  \ Mozilla 文章提供了一个更简化的版本：[`developer.mozilla.org/en-US/docs/Web/HTTP/Status`](https://developer.mozilla.org/en-US/docs/Web/HTTP/Status)。\n\
  \n假设你获得了成功的状态码 200，那么你需要从响应消息中提取数据。数据将位于 `responseText` 属性中，你需要根据预期的格式对其进行转换。例如，如果返回的是\
  \ JSON，你可以像这样获取实际对象：`var data = JSON.parse(myRequest.responseText);`\n\n#### 总结\n\
  \n你通常会使用一个函数来发送请求，并使用另一个不同的函数来处理响应。`XMLHttpRequest` 对象需要被两个函数共享，因此你需要在函数作用域之外声明它。综合起来，一个简单的解决方案如清单\
  \ A-1 所示。\n\n***清单 A-1.*** 一个简单的 Ajax 示例\n\n```\nvar myRequest;\nvar responseData;\n\
  \nfunction getData() {\n    myRequest = new XMLHttpRequest();\n    myRequest.onreadystatechange\
  \ = getResponse;\n    myRequest.open(\"GET\", \"http://someDomain.com/resource\"\
  );\n    myRequest.setRequestHeader(\"Content-Type\", \"application/json\");\n  \
  \  myRequest.send();\n}\n\nfunction getResponse() {\n    try {\n        // ...\n\
  \    } catch (e) {\n        // ...\n    }\n}\n```\n\n\n\n# 排版后的内容\n\n```\nif (myRequest.readyState\
  \ === XMLHttpRequest.DONE) {\n\nswitch(myRequest.status) {\n\ncase 500:\n\nbreak;\n\
  \ncase 404:\n\nbreak;\n\ncase 200:\n\nresponseData = JSON.parse(myRequest.responseText);\n\
  \nbreak;\n\n}\n\n}\n\n}\n\ncatch(ex) {\n\nconsole.log(\"Ajax error: \" + ex.Description);\n\
  \n}\n\n}\n```\n\n当调用`getData()`函数时，假设请求成功，`responseData`对象将保存从服务器返回的数据。当然，您可能需要对数据进行一些处理。为此，`getResponse()`函数应调用另一个函数，该函数将使用刚刚提取的数据。\n\
