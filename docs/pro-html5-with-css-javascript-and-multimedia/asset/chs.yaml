- "# Markdown 文档排版\n\n截至撰写本文时，IE 和 Edge 浏览器均不支持 `min-content` 和 `max-content` 属性。不过，可以使用自定义的\
  \ `-ms-grid` 属性作为替代方案。你需要先将容器放置在另一个父元素（实际上是祖父元素）中，然后将属性应用于该祖父元素。因此，HTML 代码将如下所示：\n\
  \n```\n<div class=\"grandParent\">\n  <div class=\"container\">container\n    <div>Fourscore\
  \ and 20 years ago,</div>\n    <div>our fathers brought forth to this continent</div>\n\
  \    ...\n  </div>\n</div>\n```\n\n我设置了类属性，以便可以通过以下附加规则来设置其样式：\n\n```css\n.grandParent\
  \ {\n  border: none;\n  margin: 0px;\n  display: -ms-grid;\n  -ms-grid-columns:\
  \ max-content;\n}\n```\n\n新增的祖父级 div 仅用于分配样式属性；我们不希望绘制额外的框。因此，清除了 `border` 和 `margin`\
  \ 属性。然后，将 `display` 属性设置为 `-ms-grid`，并设置自定义的 `-ms-grid-columns` 属性。由于这些是带前缀的属性或值，除\
  \ IE 和 Edge 之外的所有其他浏览器都会忽略它们。\n\n完成这些更改后，所有其他浏览器中的页面渲染效果将与之前保持一致。\n\n然而，IE9 及以上版本以及\
  \ Edge 浏览器也会以相同的方式显示内容。你也可以使用 `min-content` 替代 `max-content`，容器的大小将基于单词“proposition”。\n\
  \n## Min-Content 示例\n\n前面的示例有些刻意为之，旨在演示 `min-content` 和 `max-content` 的工作原理。当你拥有图像和文本等混合内容时，`min-content`\
  \ 属性最为实用。文本可以自动换行以适应几乎任何大小的容器，但图像则不能。为了演示一个更实用的示例，我将使用一个包含较长标题的 figure 元素。以下是标记代码：\n\
  \n```html\n<figure>\n  <img src=\"HTML5Badge.png\" alt=\"HTML5 Badge\" />\n  <figcaption>\n\
  \    The HTML5 badge is a well-recognized symbol in the web design community.\n\
  \  </figcaption>\n</figure>\n```\n\n`figure` 元素包含两个子元素：一个图像和一个标题。我在第 4 章中解释过，这是为图像添加标题的首选方法。\n\
  \n默认情况下，这使用块级布局，因此标题将位于图像下方，并占据其容器（即 `figure` 元素）的整个宽度。`figure` 元素本身也是一个块级元素，因此它会占据窗口的整个宽度。如果窗口足够宽，较长的标题将显示在一行上。\n\
  \n![index-203_1.png](img/index-203_1.png)\n\n第 10 章 ■ 内容定位\n\n理想情况下，你希望标题根据需要自动换行，使其始终位于图像下方。这正是\
  \ `min-content` 属性大显身手的地方。添加以下 CSS 规则即可实现这一效果。\n\n```css\nfigure {\n  border: 1px\
  \ solid black;\n  margin: 1px;\n  width: -moz-max-content;\n  width: min-content;\n\
  }\n```\n\n此规则还设置了边框和外边距，以便你更直观地查看布局效果。在大多数浏览器中，渲染结果如图 10-8 所示。\n\n***图 10-8.** 在\
  \ figure 中使用 `min-content`*\n\n## 盒模型尺寸\n\n正如我在第 2 章中解释的那样，分配给元素的空间除了实际元素内容外，还包括内边距、边框和外边距。请务必记住，我目前介绍的尺寸设置仅适用于实际内容。实际占用的空间可能更大，有时甚至会大很多，具体取决于这些其他设置。\n\
  \n当你尝试对齐具有不同属性的元素时，这可能会导致问题。为了演示这一点，请考虑以下标记代码：\n\n```html\n<section>\n  <article\
  \ class=\"bigBorder\">I am really padded!</article>\n  <article class=\"smallBorder\"\
  >Me, not so much.</article>\n</section>\n```\n\n![index-204_1.jpg](img/index-204_1.jpg)\n\
  \n第 10 章 ■ 内容定位\n\n`section` 元素包含两个 `article` 元素，每个元素都有一些简单的文本内容。每个 `article` 元素都有不同的类属性。现在应用以下\
  \ CSS 规则：\n\n```css\narticle {\n  width: 300px;\n  height: 60px;\n  margin: 1px;\n\
  }\n\n.bigBorder {\n  padding: 30px;\n  border: 10px solid olive;\n}\n```\n\n\n```css\n\
  .smallBorder {\n  padding: 5px;\n  border: 2px solid olive;\n}\n```\n\n首先，将 `article`\
  \ 元素设置为固定尺寸：300px × 60px。然后通过类选择器应用不同的 `padding` 和 `border` 设置。内容渲染效果如图 10-9 所示。\n\
  \n***图 10-9.** 不同尺寸的元素*\n\n鉴于两个元素都被设置为相同尺寸，结果可能会有些令人意外。实际上它们的尺寸确实相同，但周围的 `padding`\
  \ 和 `border` 不同。你可以通过补偿额外的 `padding` 和 `border` 来解决此问题，将第一个元素的宽度设置得更小（准确来说是缩小 66px）。\n\
  \n不过，利用新增的 `box-sizing` 属性有更简便的方法。该属性指定如何应用 `height` 和 `width` 属性。默认值 `content-box`\
  \ 表示尺寸仅作用于实际元素内容。或者，你可以将其设置为 `border-box`，尺寸属性将在 `padding` 和 `border` 添加后生效。我们可以通过添加以下\
  \ CSS 规则来修正：\n\n```css\n* {\n  box-sizing: border-box;\n}\n```\n\n![图 10-10](img/index-205_1.jpg)\n\
  \n第 10 章 ■ 定位内容\n\n请记住，[第 9 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_9)中提到星号是通用选择器，意味着此规则适用于所有元素。有了这条规则，所有尺寸属性都将包含\
  \ `padding` 和 `border`。调整后，内容渲染效果如图 10-10 所示。\n\n***图 10-10.** 尺寸完全相同的元素*\n\n■ **注意：**\
  \ 还有其他一些已定义的宽度设置，但浏览器对这些设置的支持尚不完善。如果你想尝试这些设置，Mozilla 网站提供了更多信息：[`developer.mozilla.org/en-US/docs/Web/CSS/width`](https://developer.mozilla.org/en-US/docs/Web/CSS/width)\n\
  \n### 浮动\n\n`float` 属性用于使块级内容对齐到其包含元素的左侧或右侧边缘。例如，为元素添加 `float: left;` 将使其左对齐。\n\n\
  容器中后续的内容将环绕浮动内容进行排列。例如，以下标记包含一个 `div` 元素，其后跟随一段文本内容。\n\n```html\n<header>\n  <div>div</div>\n\
  \  <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod ...</p>\n\
  </header>\n```\n\n添加以下 CSS 规则将在 `div` 元素周围增加一些空间，并使其向左浮动，从而允许文本环绕。渲染效果如图 10-11 所示。\n\
  \n```css\nheader > div {\n  padding: 25px;\n  float: left;\n}\n```\n\n![图 10-11](img/index-206_1.png)\
  \  \n![图 10-11b](img/index-206_2.png)\n\n第 10 章 ■ 定位内容\n\n***图 10-11.** 使用 `float:\
  \ left`*\n\n请记住，块级内容通常占据其容器的整个宽度。为元素设置 `float` 属性后，后续内容将像内联内容一样被定位。额外的元素将位于浮动内容的右侧。如果它们也设置了\
  \ `float: left`，后续内容将继续向右排列。为了演示这一点，我将添加更多 `div` 元素。之前的 CSS 规则将使所有这些元素都 `float:\
  \ left`，渲染效果如图 10-12 所示。\n\n```html\n<header>\n  <div>div 1</div>\n  <div>div 2</div>\n\
  \  <div>div 3</div>\n  <div>div 4</div>\n  <div>div 5</div>\n  <div>div 6</div>\n\
  \  <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod ...</p>\n\
  </header>\n```\n\n***图 10-12.** 多个浮动 `div` 元素*\n\n■ **提示：** 使用 `float: right;` 将使内容对齐到容器的右侧。后续的浮动块将位于第一个块的左侧，这实际上会使它们以相反顺序渲染。\n\
  \n![图 10-13](img/index-207_1.png)\n\n第 10 章 ■ 定位内容\n\n#### 清除浮动\n\n`float` 属性还会影响后续内容的定位。浮动元素向左或向右对齐，但后续内容可以继续内联显示，而不是像普通块级内容那样另起一行。为了说明这一点，以下标记创建了四个\
  \ `div` 元素，并使用内联样式显式设置 `float` 属性。\n\n```html\n<section>\n  <div style=\"float:\
  \ left; padding: 25px\">div 1</div>\n  <div style=\"padding: 25px\">div 2</div>\n\
  \  <div style=\"float: right; padding: 25px\">div 3</div>\n  <div style=\"padding:\
  \ 25px\">div 4</div>\n</section>\n```\n\n第一个元素向左浮动。第二个元素未浮动，但由于前一个元素是浮动的，它仍在同一行上继续显示。由于此元素未浮动，它将占据当前行的剩余空间。第三个元素向右浮动，最后一个元素则定位在左侧并占据该行的剩余空间。效果如图\
  \ 10-13 所示。\n\n***图 10-13.** 演示浮动与非浮动内容*\n\n如果你想取消先前浮动对后续元素的影响，可以使用 `clear` 属性。\n\
  \n这不会影响前一个元素的定位方式，但会消除浮动对后续元素的影响。`clear` 属性可以设置为 `left`、`right` 或 `both`。因此，你可以移除所有先前浮动的影响，或仅移除左浮动或右浮动的影响。为了演示，我将在之前的标记中添加\
  \ `clear` 属性，渲染效果如图 10-14 所示。\n\n```html\n<section>\n  <div style=\"float: left;\
  \ padding: 25px\">div 1</div>\n  <div style=\"clear: left; padding: 25px\">div 2</div>\n\
  \  <div style=\"float: right; padding: 25px\">div 3</div>\n  <div style=\"clear:\
  \ right; padding: 25px\">div 4</div>\n</section>\n```\n\n![图 10-14](img/index-208_1.png)\n\
  \n第 10 章 ■ 定位内容\n\n***图 10-14.** 使用 `clear` 属性*\n\n第一个 `div` 按预期左对齐。第二个 `div` 定位在下一行，像普通块级内容一样占据整行。\n\
  \n为了举一个稍微复杂的例子，我将使用 `:nth-of-type` 选择器让奇数元素向左浮动，偶数元素向右浮动，同时使用 `clear` 属性移除对先前浮动的影响。\n\
  \n这将使左对齐和右对齐的 `div` 元素垂直堆叠，而不是内联排列。同时，为容器元素设置 `background-color` 以演示我将要解决的另一个问题。\n\
  \n```css\nheader {\n  background-color: #f3f3f3;\n}\n\nheader > div {\n  padding:\
  \ 25px;\n}\n\nheader > div:nth-of-type(odd) {\n  float: left;\n  clear: left;\n\
  }\n\nheader > div:nth-of-type(even) {\n  float: right;\n  clear: right;\n}\n```\n\
  \n这从 `header > div` 选择器中移除了 `float: left;` 声明，并使用[第 9 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_9)中描述的\
  \ `:nth-of-type` 伪类创建了新的选择器。这些选择器使用了 `even` 和 `odd` 关键字。\n\n渲染效果如图 10-15 所示。\n\n\
  ![图 10-15](img/index-209_1.jpg)  \n![图 10-15b](img/index-209_2.jpg)\n\n第 10 章 ■\
  \ 定位内容\n\n***图 10-15.** 使用左浮动和右浮动*\n\n#### 包含浮动\n\n图 10-15 展示了浮动的一个常见问题。基本上，浮动内容在计算容器高度时不会被考虑。为了更清楚地看到这一点，我将使用以下\
  \ CSS 规则（将 `display` 属性设置为 `none`）移除文本。\n\n```css\nheader > p {\n  display: none;\n\
  }\n```\n\n渲染后，你会看到左侧有奇数 `div` 元素，右侧有偶数 `div` 元素，中间没有任何文本。如果你使用浏览器工具检查 `header` 元素，会发现元素的高度被设置为\
  \ 0，如图 10-16 所示。\n\n***图 10-16.** 在 Chrome 中检查 `header` 元素*\n\n![图 10-16](img/index-210_1.jpg)\n\
  \n第 10 章 ■ 定位内容\n\n\n我为 `header` 元素设置了灰色背景，由于 `div` 元素位于 `header` 元素内部，我期望它们也具有灰色背景。然而，由于\
  \ `header` 元素的计算高度为 0，因此没有显示灰色区域。类似地，在图 10-15 中，你可以看到只有部分 `div` 元素具有灰色背景，因为文本没有浮动内容那么大。\n\
  \n乍一看，这似乎是浏览器的一个 bug；父元素的大小没有考虑其子元素。然而，这种行为有一个重要的原因。浮动内容旨在跨越多个块。例如，图 10-17 中显示的布局有三个带有文本内容的\
  \ `div` 元素。浮动内容跨越了其中两个。\n\n***图 10-17.** 跨越块的浮动内容*\n\n如果第一个 `div` 的大小包含了浮动内容，那么第二个\
  \ `div` 要到浮动内容结束后才开始，这会留下大量空白空间。在我们的场景中，当我们希望将浮动内容包含在尺寸计算中时，至少有两种常见的解决方案可以实现这一点。\n\
  \n### 设置溢出\n\n最简单的解决方案（尽管可能不那么直观）是使用 `overflow` 属性。这指定了当元素的内容超出其容器区域时，浏览器应如何处理。`overflow`\
  \ 属性支持以下值：\n\n- `visible` - 这是默认值，表示溢出内容应显示而不影响容器。正如我所展示的，容器高度为零，但其所有内容仍然显示出来。\n\
  - `hidden` - 内容被裁剪，因此容器外部的任何内容都不可见。\n- `scroll` - 即使内容适合容器内部，也会始终创建水平和垂直滚动条。\n-\
  \ `auto` - 仅当内容溢出容器时才创建滚动条；否则不创建。\n\n第 10 章 ■ 定位内容\n\n然而，在这种场景下，使用除 `visible` 之外的任何值，浏览器都会在计算容器大小时考虑浮动内容。这解决了背景颜色未覆盖所有\
  \ `div` 元素的问题。使用 `scroll`，你还会得到滚动条，这可能不是你想要的。我建议为任何包含浮动内容的容器使用 `overflow: auto;`\
  \ 来解决此问题。\n\n### 使用伪元素\n\n另一种解决方案是使用 `::after` 伪元素在容器之后创建额外的内容，并对该内容使用 `clear` 属性。例如，添加此\
  \ CSS 规则将在浮动内容之后添加内容。\n\n```\nheader::after {\n  content: \"\";\n  display: block;\n\
  \  clear: both;\n}\n```\n\n必需的 `content` 声明被设置为空字符串，因此这不会添加任何实际内容。然而，伪元素将具有 `clear:\
  \ both;` 声明。这会导致内容“出现在”浮动内容之后，但仍然是容器的一部分。这也会强制将浮动内容包含在容器大小中。\n\n### 内联块\n\n在本章开头，我告诉过你\
  \ `display` 属性有两个基本值：`block` 和 `inline`，并且我演示了它们的工作方式。实际上，`display` 属性有相当多的可用值。其中大部分与表格有关，我将在[第\
  \ 13 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_13)中介绍。但我将在此处解释 `inline-block`\
  \ 值。\n\n正如我所解释的，`block` 元素使用其父元素的整个宽度，并且每个 `block` 元素创建一个新行。相比之下，`inline` 元素仅使用所需的水平空间，后续元素在现有行上继续，必要时换行。\n\
  \n使用 `inline` 元素时存在一些限制，例如无法设置 `height` 和 `width` 属性。在前面的一些示例中，当有一行框时，必须将它们创建为 `block`\
  \ 内容并使用 `float` 属性来允许它们水平排列。\n\n以下标记在 `nav` 元素内创建了六个 `div` 元素：\n\n```\n<nav>\n \
  \ <div>div a</div>\n  <div>div b</div>\n  <div>div c</div>\n  <div>div d</div>\n\
  \  <div>div e</div>\n  <div>div f</div>\n</nav>\n```\n\n![](img/index-212_1.png)\n\
  \n第 10 章 ■ 定位内容\n\n默认情况下，每个 `div` 元素都将显示为 `block` 内容并位于单独的行上。但是，我们可以使用 `inline-block`\
  \ 来允许它们排列在一行上（或者在必要时换行）。这通过如下 CSS 规则应用：\n\n```\nnav>div {\n  display: inline-block;\n\
  \  width: 75px;\n  height: 25px;\n  vertical-align: bottom;\n  clear: both;\n}\n\
  ```\n\n这还设置了 `div` 元素的 `height` 和 `width`。需要 `clear` 属性来清除上一个示例中的浮动（如果你使用浮动，你会发现你也会经常使用\
  \ `clear`）。\n\nCSS 规则还设置了 `vertical-align` 属性，以便所有元素的底部边缘将对齐。由于它们大小相同，对齐并不是真正的问题。为了更有趣，我将使用此\
  \ CSS 规则调整某些元素的高度，这将使每隔一个元素变大。\n\n结果如图 10-18 所示。\n\n```\nnav>div:nth-of-type(even)\
  \ {\n  height: 35px;\n}\n```\n\n***图 10-18.** 使用具有对齐功能的 `inline-block`*\n\n### 定位\n\
  \n到目前为止，我们在本章中处理的所有元素都是静态定位的。这是默认行为，其中元素使用 `block` 或 `inline` 布局一个接一个地排列。这是通过设置\
  \ `position: static;` 来定义的，但由于这是默认值，因此实际上不必将其添加到你的 CSS 中。\n\n`position` 属性有多个值，我将解释每一个：\n\
  \n- `static` - 这是默认值；内容根据其在文档中的位置和分配的流属性进行定位。\n- `relative` - 元素位置相对于其正常流位置进行偏移。\n\
  - `absolute` - 元素定位在特定位置；不为它分配空间。\n- `fixed` - 元素相对于视口定位；其在屏幕上的位置在滚动文档时不会改变。\n\n\
  第 10 章 ■ 定位内容\n\n■ **提示** 非静态定位的内容有时被称为*定位*内容。这不是一个很有见地的术语，因为所有内容都是定位的；只是定位方式不同。但是，如果你看到该术语，它通常适用于使用\
  \ `relative`、`absolute` 或 `fixed` 位置值的内容。\n\n#### 相对定位\n\n使用相对定位时，内容的定位方式与静态定位相同，只是它会从其原始计算位置偏移。元素的移动不会影响其他元素的位置。基于元素原始位置为其分配的空间仍然保留。这通常会导致一些内容重叠以及空白区域。\n\
  \n将 `position` 属性设置为 `relative` 后，你可以使用 `top`、`bottom`、`left` 或 `right` 属性指定偏移量。如果你想将元素向下移动，请将\
  \ `top` 属性设置为其应调整的距离。类似地，要向上移动位置，请使用 `bottom` 属性。要将元素向右移动，请使用 `left` 属性。这起初可能看起来是相反的，但它类似于增加左边距，这将把元素推向右方。\n\
  \n■ **提示** 将 `top` 属性设置为正值会将元素向下移动；使用负值会将元素向上移动。所以 `top: -20px;` 和 `bottom: 20px;`\
  \ 是等效的。同样，将 `left` 属性设置为负值与将 `right` 属性设置为正值效果相同。\n\n\n\n为了演示相对定位，我将使用以下标记，它创建了四个`div`元素。\n\
  \n```\n<header>\n<div class=\"square red\">div 1</div>\n<div class=\"square yellow\"\
  >div 2</div>\n<div class=\"square blue\">div 3</div>\n<div class=\"square green\"\
  >div 4</div>\n</header>\n```\n\n我还会使用以下 CSS 规则为每个方块设置背景色。（如果你对我选择的颜色感到好奇，我特意使用了较浅的颜色，因为它们在打印时效果更好，尤其是在使用灰度进行黑白打印时。）\n\
  \n```css\n.red {\n  background-color: pink;\n}\n.yellow {\n  background-color: yellow;\n\
  }\n.blue {\n  background-color: cyan;\n}\n.green {\n  background-color: chartreuse;\n\
  }\n```\n\n![index-214_1.png](img/index-214_1.png)\n\n## 第 10 章 ■ 定位内容\n\n每个`div`元素都分配了`square`类，并且每个元素也有一个不同的颜色类。然后使用一对类选择器完成定位：\n\
  \n```css\nheader>div.square {\n  padding: 0px;\n  float: left;\n  clear: none;\n\
  \  width: 100px;\n  height: 100px;\n}\n\n.blue {\n  position: relative;\n  top:\
  \ 20px;\n  left: 20px;\n}\n```\n\n我将此示例的标记和 CSS 规则添加到之前示例使用的同一个文件中，其中已经有一个`header>div`选择器。这个新的选择器`header>div.square`更具体，因此会覆盖任何冲突的声明。我在[第\
  \ 2 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_2)中解释了特异性规则。之前的声明设置了`padding`、`float`和`clear`属性；但是，我希望这些新的方块`div`元素具有不同的样式，因此这些特定的声明被覆盖了。\n\
  \n> **注意：** 请注意这里设置了`clear: none;`，这是该属性的默认值。有时在覆盖不太具体的规则时，你必须设置默认值。\n\n蓝色类选择器设置了相对位置并指定了偏移量。只有一个`div`元素具有此类，因此只有包含蓝色类的`div`会被偏移。渲染结果如图\
  \ 10-19 所示。\n\n**图 10-19.** 演示相对定位\n\n请注意，现在蓝色`div`的顶部和左边缘附近有多余的空间，并且蓝色`div`与绿色`div`重叠。还要注意，`header`元素的背景并未覆盖整个蓝色`div`。正如我所说，偏移是在元素上执行的，不对其他元素进行任何调整。所有其他内容都基于元素的原始位置（在应用偏移之前）进行定位。\n\
  \n![index-215_1.png](img/index-215_1.png)\n\n## 第 10 章 ■ 定位内容\n\n> **提示：** 如果你想移动一个元素，并且希望新位置和原始位置在正常（静态）内容流中都被保留，请改用`margin`属性。这会给元素增加额外的空间，使其看起来像是被移动了。但是，剩余内容会基于元素尺寸的新增大小进行调整。\n\
  \n#### 绝对定位\n\n绝对定位与相对定位类似，不同之处在于元素被完全从内容流中移除。原始位置不被保留；就好像该元素从未存在过一样。它使用相同的`top`、`bottom`、`left`和`right`属性来指定位置。然而，使用绝对定位的棘手之处在于确定定位上下文。\n\
  \n明确地说，`position`属性的`relative`或`absolute`值都会使元素相对于某物定位。两者都使用`top`、`bottom`、`left`或`right`属性指定偏移。\n\
  \n设置`position: relative;`将使元素相对于其原始位置定位。使用`position: absolute;`将使元素相对于其定位上下文定位。\n\
  \n当使用相对或绝对定位时，就会创建定位上下文。当使用绝对定位时，浏览器会遍历元素的祖先，查找具有`position`属性设置为`absolute`或`relative`的最近祖先。如果未找到，则使用文档作为默认定位上下文。\n\
  \n\n\n为了演示这一点，我将添加以下 CSS 规则：\n\n```\nheader {\n  position: relative;\n}\n```\n\n\
  这将使每个`header`元素成为一个定位上下文。但请注意，我没有指定偏移量。\n\n这不会影响`header`元素；它的定位方式将与使用静态定位时一样。然而，如果它的任何子元素使用了绝对定位，它们将基于`header`元素的位置进行定位。\n\
  \n在修改了`header`之后，我将创建`blue`类选择器。`blue`的`div`现在应该基于`header`元素进行定位，其上边缘位于`header`上方\
  \ 10 像素处，右边缘距离`header`的右边缘 50 像素，如图 10-20 所示。\n\n```\n.blue {\n  position: absolute;\n\
  \  top: -10px;\n  right: 50px;\n}\n```\n\n**图 10-20.** 基于父元素位置的绝对定位\n\n![图 10-20](img/index-216_1.jpg)\n\
  \n第 10 章 ■ 定位内容\n\n#### 固定定位\n\n固定定位与绝对定位相同，区别在于定位上下文始终是视口（viewport）。无论文档如何滚动（水平或垂直），内容将始终保持在屏幕上的同一位置。为了演示这一点，我将通过将之前的\
  \ CSS 规则替换为以下内容来更改`blue`的`div`的位置：\n\n```\n.blue {\n  position: fixed;\n  top: 50px;\n\
  \  left: 0px;\n}\n```\n\n`top`或`bottom`属性是必需的；否则内容将不会显示。在这个例子中，我设置了内容的上边缘将从窗口顶部开始\
  \ 50 像素。`left`或`right`属性是可选的；如果省略，将使用`left: 0px;`。渲染结果如图 10-21 所示。\n\n**图 10-21.**\
  \ 使用固定定位\n\n## Z-Index\n\n`x`轴指的是页面上的水平方向，`y`轴是垂直方向。由于网页是二维的，实际上并没有`z`轴，尽管它被用来描述重叠内容如何堆叠在其他内容之上。因此，`z-index`属性，从某种意义上说，定义了堆叠顺序。具有最高`z-index`的内容将位于最上层。\n\
  \n![图 10-22](img/index-217_1.jpg)\n\n第 10 章 ■ 定位内容\n\n对于静态定位的内容，您不需要关心`z-index`。实际上，`z-index`仅适用于非静态定位的内容。然而，对于其他定位值（`relative`、`absolute`和`fixed`），您需要考虑“堆叠顺序”。\n\
  \n`z-index`的默认值为 0。因此，如果所有内容都具有相同的`z-index`，浏览器如何知道哪个放在最上面？这里有一些需要遵循的规则。\n\n首先，所有非静态定位的内容将位于其他内容之上。回头看看图\
  \ 10-19、10-20 和 10-21，注意`blue`的`div`始终位于其他内容之上。如果您不希望这种行为，将`z-index`设置为`-1`，该内容将出现在静态定位的内容下方。\n\
  \n其次，在文档中位于后面的内容将位于先前内容之上。为了测试这一点，我将添加以下规则，使`green`的`div`使用固定定位：\n\n```\n.green\
  \ {\n  position: fixed;\n  top: 70px;\n  left: 20px;\n}\n```\n\n`green`的`div`现在将固定在`blue`的`div`附近，但由于它在文档中位于其后，它将出现在`blue`的`div`之上，如图\
  \ 10-22 所示。您可以尝试对`yellow`的`div`进行同样的操作，您会发现它将位于`blue`的`div`之下，因为它出现在它之前。\n\n**图\
  \ 10-22.** 显示两个固定元素\n\n在确定显示顺序时，浏览器使用*堆叠上下文*。堆叠上下文是在文档级别为所有静态定位的内容创建的。每当使用`relative`、`absolute`或`fixed`定位时，就会创建一个新的堆叠上下文。该元素内的所有子元素都使用相同的堆叠上下文。\n\
  \n\n\n"
- "# 排版后的文档\n\n子元素也可以使用定位值之一并创建新的堆叠上下文。这可能会引起一些混淆，因为这些上下文是分层的。例如，假设有两个堆叠上下文，第一个的`z-index`为\
  \ 1，第二个的`z-index`为 2。然后，你在第一个堆叠上下文内部添加一个具有相对定位的子元素，并将其`z-index`设置为 3。然而，第二个上下文（`z-index`为\
  \ 2）中的所有内容都将位于第一个上下文（`z-index`为 1）之上。子上下文（`z-index`为 3）仅影响第一个上下文中元素的排序。\n\n第 10\
  \ 章 ■ 定位内容\n\n■ **注意**：将`opacity`属性设置为小于 1 也会创建新的堆叠上下文。随后创建新堆叠上下文的子元素实际上将成为子上下文，排序可能不会按预期发生。如果你感兴趣，有一篇文章对此进行了更详细的解释：[`philipwalton.com/articles/what-no-one-told-you-about-z-index`](https://philipwalton.com/articles/what-no-one-told-you-about-z-index)。\n\
  \n## 居中内容\n\n在结束本章关于定位的内容之前，我需要解释一个简单的居中技巧。`margin`属性定义了元素与其相邻元素之间的空间。如果将其设置为`auto`，则左右外边距将被计算为在父元素内居中内容。\n\
  \n要尝试这个，我将创建一个带有`class`属性设置为`center`的单个`div`元素：\n\n```\n<div class=\"center\"></div>\n\
  ```\n\n然后，我将使用以下 CSS 规则来居中它。这将设置`width`和`height`属性以及背景颜色。\n\n```\n.center {\n  width:\
  \ 100px;\n  height: 30px;\n  background-color: teal;\n  margin: 0 auto;\n}\n```\n\
  \n`margin`设置为`0 auto`，这将导致`div`在水平方向上居中。\n\n#### 总结\n\n在本章中，我涵盖了许多控制内容在 HTML 文档中如何定位的主题。在布局内容时有大量可用选项，这是\
  \ CSS 中最棘手的概念之一。在决定如何安排内容时，请考虑这些技术并选择最适合的那一种：\n\n- **块级布局** - 占据其父元素的整个宽度，并始终在新行开始。\n\
  - **内联布局** - 旨在从一个元素水平流向另一个元素。\n- **指定大小** - 使用绝对、相对或最大尺寸，并根据内容设置大小。\n- **盒模型尺寸**\
  \ - 自动在尺寸计算中考虑内边距和边框。\n- **浮动** - 将内容向左或向右浮动，并让其他内容环绕。\n- **内联块** - 允许通常表现为块级的内容水平流动。\n\
  - **相对定位** - 相对于其计算出的位置偏移内容。\n- **绝对或固定定位** - 独立于 DOM 进行定位。\n- **居中** - 使用`margin`属性。\n\
  \n在下一章中，我将解释可用于主要格式化文本内容的 CSS 特性。\n\n**第 11 章**\n\n**文本样式**\n\n在本章中，我将演示可用于格式化 HTML\
  \ 文档文本部分的 CSS 属性。我将从选择字体和各种字体特性开始，然后介绍你可以使用的文本格式化功能。我将介绍间距和对齐以及控制换行和分页的方法。我还会解释一些杂项主题，例如颜色、不透明度和光标，这些并非文本格式化所特有。\n\
  \n### 字体\n\n格式化文本时最基本的因素是选择字体。可用的字体似乎无穷无尽，简单的字体更改就能对网页产生显著效果。字体是一组符号，在排版学中称为字形，这些符号映射到一个字符集。例如，浏览器将根据当前字体中字母“A”映射到的字形来显示它。\n\
  \n#### 获取字体\n\n浏览器可以通过三种方式获取字体定义以便渲染。\n\n#### 网页安全字体\n\n\n\n"
- "# 文本样式\n\n## 网络安全字体\n\n第一种被称为*网络安全字体*，这个说法其实有些名不副实。所有操作系统都内置了字体；为了在屏幕上显示文本，需要字体将每个字符代码映射到字形。浏览器可以使用这些内置字体中的任何一种。但问题是，并非所有操作系统都支持同一套字体。网络安全字体是指那些普遍被大多数设备支持的字体。这与其说是科学，不如说是艺术，没有哪种字体能在所有操作系统上获得\
  \ 100%的支持。不过，有一些字体，如 Arial、Verdana、Times New Roman 和 Courier New，是比较稳妥的选择。在 [`www.cssfontstack.com/`](http://www.cssfontstack.com/)\
  \ 上有篇文章展示了这些字体在 Windows 和 Mac 上的可用性（遗憾的是，它没有显示 Android 或 iOS 上的覆盖情况）。\n\n## Web\
  \ 字体\n\n你可能已经意识到，使用网络安全字体，你的选择范围是有限的。第二种方法能显著增加你的选项，那就是使用*Web 字体*。Web 字体由浏览器下载，就像\
  \ CSS 和图片文件等其他资源一样。这种方法有两个缺点：\n\n-   较旧的浏览器不支持 Web 字体；不过，这只会影响一小部分且日益减少的用户群体。\n\
  -   额外的下载可能会减慢页面的加载速度，特别是当你使用多种 Web 字体时。这些字体通常会被浏览器缓存，所以通常只影响首次加载。\n\n如果你有兴趣使用 Web\
  \ 字体，请访问 [`fonts.google.com/`](https://fonts.google.com/)。截至撰写本文时，该网站提供了 808 个字体族，并拥有一个出色的用户界面用于预览和选择字体。选择字体后，该网站会提供如何将其包含到\
  \ HTML 文档中的说明。要包含一个 Web 字体，你可以像这样使用 `link` 元素：\n\n```html\n<link href=\"https://fonts.googleapis.com/css?family=Cabin\"\
  \ rel=\"stylesheet\">\n```\n\n或者，你也可以使用 `@import` 规则将字体包含在 CSS 文件中，如下所示：\n\n```css\n\
  @import url(//fonts.googleapis.com/css?family=Cabin);\n```\n\n两种方式达到的效果相同。使用 `link`\
  \ 元素将其放在标记中，而 `@import` 规则则在 CSS 中完成。我建议使用 `@import`，这样所有样式更改都集中在 CSS 文件中。\n\n如果你之后决定更改字体，应该无需修改\
  \ HTML 标记就能做到。\n\n前面提到的 CSS 字体栈网站也提供了一个很好的用户界面，用于选择字体、配置 CSS 以及预览字体定义。它同样引用了相同的\
  \ `fonts.googleapis.com` 网站来获取实际的字体资源。\n\n## 自定义字体\n\n第三种方法是将你自己的字体定义嵌入到 CSS 文件中。就像图片一样，定义字体也有多种格式。TrueType\
  \ 字体（TTF）已经存在大约 30 年了，它和 OpenType 字体（OTF）一起，是在台式电脑上安装字体的标准格式。主流浏览器也支持这些格式。但是，Web\
  \ 开放字体格式（WOFF）是 W3C 推荐的标准，并且也被大多数浏览器支持。此外，WOFF 2.0 的受欢迎程度和支持度也在不断提升。\n\n创建字体定义超出了本书的范围。但是，一旦你创建或购买了字体定义文件，就可以将其复制到你的\
  \ Web 服务器上。然后，你需要使用 `@font-face` 规则在 CSS 文件中引用它。就像音频和视频文件一样，你可以提供多种文件格式，以便浏览器根据其支持的类型进行选择。例如，为了支持\
  \ TTF、WOFF 和 WOFF2.0，你需要包含如下规则。当然，你需要在服务器上提供这些文件格式的每一种。\n\n```css\n@font-face {\n\
  \  font-family: 'CustomFont';\n  src: url('custom.ttf') format('truetype'),\n  \
  \     url('custom.woff') format('woff'),\n       url('custom.woff2') format('woff2');\n\
  }\n```\n\n还有其他提供字体的网站，例如 [`www.fontsquirrel.com/`](https://www.fontsquirrel.com/)\
  \ 和 [`www.fontex.org/`](http://www.fontex.org/)。这两个网站都提供字体文件下载，你需要将这些文件托管到你的 Web\
  \ 服务器上，并作为自定义字体进行引用。\n\n#### 字体族\n\n字体通过术语*族*来标识。Arial、Courier New 和 Times New Roman\
  \ 这些术语就是字体族。在前面的自定义字体示例中，我们定义了 `font-family` 属性，CSS 后续就是通过这个属性来选择它的。此外还有一组通用字体族，图\
  \ 11-1 展示了每种字体族的示例：\n\n-   **cursive（手写体）** - 该字体族的字体模仿手写体而非印刷体。有时字符之间会相互连接，给人一种手写的感觉。\n\
  -   **fantasy（幻想体）** - 这些字体更具装饰性，带有装饰或非标准的字符表现。\n-   **monospace（等宽体）** - 等宽字体的所有字符都具有相同的宽度。\n\
  -   **sans-serif（无衬线体）** - sans 意为“没有”，serif 是一个额外的笔画，通常是渐变的末端。所以无衬线字体没有这些额外的标记，通常看起来更朴素。\n\
  -   **serif（衬线体）** - 这些是更传统的字体，尤其在印刷文本中。你现在读到的就是这种字体。\n\n***图 11-1.** 示例通用字体族*\n\
  \n因此，浏览器拥有一组可供使用的字体，无论是操作系统原生字体、链接的 Web 字体还是嵌入的自定义字体。你可以像这样使用 `font-family` 属性来选择使用哪一种：\n\
  \n```css\np {\n  font-family: Cabin;\n}\n```\n\n但是，由于你无法保证每个浏览器都支持这种字体，你应该提供一些额外的选项作为后备方案。这被称为*字体栈*。你可以通过逗号分隔来指定多个字体族。例如：\n\
  \n```css\np {\n  font-family: Cabin, Verdana, sans-serif;\n}\n```\n\n浏览器会按顺序处理这些字体，所以把你的首选放在第一位。你应该总是以一个通用字体结尾，这样至少能得到一个与你预期相似的字体。前面的示例使用了一种典型方法：先放自定义字体或\
  \ Web 字体，接着放一个类似的网络安全字体，最后放一个通用字体族。你可以通过将 `Cabin` 改为 `Cabin1`，然后将 `Verdana` 改为 `Verdana1`\
  \ 来测试这一点。每次修改后，你都应该注意到字体变了，但仍然与首选相似。\n\n**注意：** 如果字体族名称包含标点符号或数字，例如 `Modern No.\
  \ 20`，你需要将名称用引号括起来。\n\n#### 字体设置\n\n然而，选择字体族只是第一步。还有其他属性，如字号、字重和字体样式，可以更精确地配置字体。还有一些高级功能可以让你更有力地处理特殊情况。\n\
  \n### 字体样式\n\n`font-style` 属性用于选择斜体字体。有三个可能的值：`normal`（默认）、`italic` 和 `oblique`。Oblique\
  \ 意为倾斜或偏斜。`oblique` 关键字支持度不太好，通常会产生与 `italic` 相同的效果。\n\n### 字号\n\n历史上，字号是以字母“M”的宽度来衡量的；但现在，它代表了大写字母的高度。当然，在非西方字符集中，这个定义可能并不完全适用。\n\
  \n在设置字体大小时，有数量惊人的选项。其值是一个距离单位，我在第二章中解释了所有可用于定义距离的单位。附录 C 的参考资料中也总结了这些单位。\n\n```markdown\n\
  \n# 字体大小与样式\n\n设计师应避免使用绝对尺寸（如`12px`）。若用户因无障碍需求调整字体大小，绝对尺寸将无法随之改变。使用相对尺寸还有助于页面设计，尤其在处理响应式布局时。因此，除了标准距离单位外，还有多种设置字体大小的方法。\n\
  \n浏览器定义了一组关键字，它们会根据用户的字体设置映射到物理单位：\n\n- `xx-small`\n- `x-small`\n- `small`\n- `medium`\n\
  - `large`\n- `x-large`\n- `xx-large`\n\n这些关键字允许你设置字体大小，同时仍允许用户根据需要增大或减小字体。\n\n还有两个关键字可相对于父元素的字体大小设置字体：\n\
  \n- `smaller`\n- `larger`\n\n它们会按与上述关键字之间大致相同的幅度调整字体大小。例如，若父元素使用`small`，则使用`larger`大致相当于选择`medium`。\n\
  \n你也可以将字体大小表示为父元素字体大小的百分比。设置`font-size: 120%;`将使字体比父元素的字体大 20%。\n\n我在第 2 章中描述的一些距离单位是相对单位。例如，`em`单位基于当前字体大小，而`rem`基于根元素的字体大小。还有视口相对单位，如`vh`，它代表视口高度的\
  \ 1%。\n\n> **提示**：有一篇好文章在[`css-tricks.com/almanac/properties/f/font-size/`](https://css-tricks.com/almanac/properties/f/font-size/)，其中提供了各种大小调整方法的示例。\n\
  \n## 字重\n\n`font-weight`属性用于设置粗体字体，它支持两个值：`normal`（默认）和`bold`。不过，你也可以将其设置为具体值：`100`、`200`、`300`、`400`、`500`、`600`、`700`、`800`或`900`。\n\
  \n大多数字体仅支持常规和粗体字形，可能不支持全部 9 种字重。对于仅支持常规和粗体的字体，`100`-`500`将映射为常规，`600`-`900`将映射为粗体。对于支持更精确值的字体，`normal`关键字映射为`400`，`bold`映射为`700`。\n\
  \n还有相对关键字，可相对于父元素的字体设置字重。使用`lighter`将使字重比父元素更轻，`bolder`则相反。为了演示大小和字重的相对值，请考虑以下标记：\n\
  \n```html\n<p class=\"relative\">\n  This is going to be big, <strong>big, <strong>big</strong></strong>.\n\
  </p>\n```\n\n此文本包含一个嵌套在另一个`strong`元素内部的`strong`元素。我在第 5 章中解释过，这具有语义含义，表示这段文本非常重要。为了设置样式，以下\
  \ CSS 规则考虑了这种含义。\n\n```css\n.relative {\n  font-family: Arial;\n  font-size: medium;\n\
  }\n\nstrong {\n  font-size: larger;\n  font-weight: bolder;\n}\n```\n\n第一条规则仅选择字体并将字体大小设置为`medium`。下一条规则使用了大小和字重的相对值：`larger`和`bolder`。按此方式实现后，嵌套的`strong`元素将两次应用`larger`和`bolder`值。结果如图\
  \ 11-2 所示。\n\n**图 11-2.** 演示相对大小和字重\n\n## 颜色\n\n字体颜色通过`color`属性设置。我在第 2 章中解释了各种颜色单位，它们在附录\
  \ C 的参考资料中也有总结。你还可以设置`opacity`属性，指定一个从 0 到 1 的数字，其中 1 表示完全不透明，0 表示完全透明。你也可以使用`rgba()`或`hsla()`函数同时设置`color`和`opacity`属性。\n\
  \n## 字距调整\n\n```\n\n\n一般情况下，每个字符由一个矩形定义的空间所占据。在使用比例字体时，每个字符的宽度都不相同。然而，有些字符更像三角形，例如大写的`A`和`V`是最典型的例子。如果这两个字符连在一起（比如`VA`），使用矩形模型时，它们之间会显得有额外的空间。另一个例子是句点或逗号紧挨着像`T`或`Y`这样顶部沉重的字符。\n\
  \n字距调整（*Kerning*）是一种消除这种空间的功能，使字符之间的间距更一致。\n\n这由`font-kerning`属性控制。该属性支持以下值：\n\n\
  - `auto` - 这是默认值，允许浏览器决定何时应使用该功能。在多数情况下，字距调整会启用；但对于较小的字体大小，浏览器通常会将其关闭。\n- `normal`\
  \ - 这将强制字距调整始终开启。\n- `none` - 这将关闭字距调整。\n\n解释字距调整效果的最佳方式是通过演示。以下标记包含两个段落，它们的字符相同；第一个段落包含`kerning`类，第二个段落包含`noKerning`类。\n\
  \n```\n<p class=\"kerning\">T,VAY. - with kerning</p>\n<p class=\"noKerning\">T,VAY.\
  \ - w/o kerning</p>\n```\n\n然后，以下 `CSS` 规则将为两个段落分配一个大号衬线字体，并根据`class`属性设置`font-kerning`属性。渲染结果如图\
  \ 11-3 所示。\n\n```\n.kerning, .noKerning {\n    font-family: serif;\n    font-size:\
  \ 48px;\n}\n```\n\n![](img/index-225_1.png)\n\n**图 11-3** 演示字距调整\n\n```\n.kerning\
  \ {\n    font-kerning: normal;\n}\n.noKerning {\n    font-kerning: none;\n}\n```\n\
  \n注意当字距调整开启时，`V`、`A`和`Y`字符的矩形会重叠。此外，句点和逗号也更靠近`T`和`Y`字符。\n\n### 拉伸（Stretch）\n\n字体大小描述的是字体的高度，而非宽度。某些字体提供了多种具有不同字符宽度的版本。较宽的字体称为*拉伸（stretched）*，较窄的字体称为*压缩（condensed）*。\n\
  \n您可以使用`font-stretch`属性来控制宽度。以下是定义的值：\n\n- `ultra-condensed`\n- `extra-condensed`\n\
  - `condensed`\n- `semi-condensed`\n- `normal`\n- `semi-expanded`\n- `expanded`\n\
  - `extra-expanded`\n- `ultra-expanded`\n\n特定的字体可能不支持所有这些选项，浏览器会选择最接近请求值的可用宽度。此属性对仅提供一种宽度的字体没有影响。作为演示，以下标记有两个段落：一个带有`stretched`类，另一个带有`condensed`类。后续的\
  \ `CSS` 选择了 `Arial` 字体，并对这两个类应用了`font-stretch`属性。结果如图 11-4 所示。\n\n```\n<p class=\"\
  stretched\">stretched</p>\n<p class=\"condensed\">condensed</p>\n```\n\n```\n.stretched,\
  \ .condensed {\n    font-family: arial;\n    font-size: 48px;\n}\n.stretched {\n\
  \    font-stretch: extra-expanded;\n}\n.condensed {\n    font-stretch: extra-condensed;\n\
  }\n```\n\n**图 11-4** 演示 `font-stretch`\n\n### 变体大写（Variant Capitals）\n\n`font-variant-caps`属性允许您为小写字符使用大写字形。此功能不受\
  \ `IE` 或 `Edge` 浏览器支持，并且也受限于字体的功能。该属性支持以下值：\n\n- `all-petite-caps` - 如果支持，小写和大写字符都将使用特小号大写字形。如果不支持，则两者都将使用小型大写字形。\n\
  - `all-small-caps` - 小写和大写字符都将使用小型大写字形。\n- `normal` - 这是默认值，将禁用大写字形的使用。\n- `petite-caps`\
  \ - 仅小写字符将使用特小号字形；如果不支持，则改用小型大写字形。\n- `small-caps` - 小型大写字形将用于小写字符；大写字符将使用正常字形。\n\
  \n\n\n• `titling-caps` - 为大写和小写字符使用特殊字形，这些字形被设计为在长段文本使用大写字符时不会显得过于粗重。如果不支持这些字形，则此属性会被忽略。\n\
  • `unicase` - 仅对大写字符使用小型大写字形。这会导致大写字符与小写字符尺寸相同。\n\n![](img/index-227_1.png)\n![](img/index-227_2.png)\n\
  \n## 第 11 章 ■ 文本样式\n\n作为一个快速演示，下面的标记包含一个带有`smallCaps`类的段落，并且 CSS 将`font-variant-caps`属性设置为`small-caps`。在大多数浏览器中的渲染效果如图\
  \ 11-5 所示。\n\n```html\n<p class=\"smallCaps\">使用小型大写字母</p>\n```\n\n```css\n.smallCaps\
  \ {\n  font-size: x-large;\n  font-variant-caps: small-caps;\n}\n```\n\n***图 11-5.**\
  \ 演示小型大写字母*\n\n### 数字\n\n`font-variant-numeric`属性提供了控制某些数字内容呈现方式的能力。例如，像 1st、2nd\
  \ 和 3rd 这样的序数可以显示为上标。同样，分数可以渲染为对角线形式（½）或堆叠形式。IE、Edge 或 Safari 目前不支持此属性。此外，这要求字体支持这些特殊字形。我发现对角线分数似乎相当一致地工作，但其他特性大部分时间都不起作用。如果你想进一步研究，Mozilla\
  \ 对 W3C 推荐标准定义的选项有一个很好的解释，可以在[`developer.mozilla.org/en-US/docs/Web/CSS/font-variant-numeric`](https://developer.mozilla.org/en-US/docs/Web/CSS/font-variant-numeric)找到。\n\
  \n可以通过以下标记和 CSS 来演示对角线分数。其渲染效果如图 11-6 所示。\n\n```html\n<p class=\"diagonal\">1/2\
  \ 2/3 3/4 4/5</p>\n```\n\n```css\n.diagonal {\n  font-family: Verdana;\n  font-size:\
  \ xx-large;\n  font-variant-numeric: diagonal-fractions;\n}\n```\n\n***图 11-6.**\
  \ 演示对角线分数*\n\n### 特性设置\n\n`font-feature-settings`属性提供了低级访问权限，以控制特定字体的高级特性。它可以通过设置字体特定的配置值来修改\
  \ OpenType 字体特性。只有在无法通过其他属性实现所需效果时才应使用此属性。在[`css-tricks.com/almanac/properties/f/font-feature-settings/`](https://css-tricks.com/almanac/properties/f/font-feature-settings/)有一个关于此属性的好文章。但是，请检查你使用的字体支持哪些特性。\n\
  \n## 第 11 章 ■ 文本样式\n\n### 简写符号\n\n我在第[2 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_2)中解释过，通常可以使用简写符号通过单个声明设置多个属性。`font`属性就是一个很好的例子。使用单个声明，你可以设置以下属性：\n\
  \n* `font-family`\n* `font-size`\n* `font-weight`\n* `font-style`\n* `font-stretch`\n\
  * `font-variant`\n* `line-height`（本章稍后解释）\n\n但是，有一些限制。`font-family`和`font-size`是必需的；其他的是可选的。`font-family`属性必须列在最后。如果指定了`font-weight`、`font-style`或`font-variant`属性，它们必须放在`font-size`之前。如果违反了这些规则中的任何一条，整个声明将被忽略。如果指定了`line-height`属性，它必须紧跟在`font-size`属性之后，并且两者之间应该用斜杠（`/`）字符分隔。\n\
  \n> **警告**：`font-stretch`属性相对较新，可能不被某些浏览器支持。如果不支持且它被包含在简写符号中，整个声明将被忽略。因此，你不应该包含`font-stretch`，而应单独指定它。\n\
  \n使用简写符号时，有几个预定义的关键字可以用来设置所有字体属性，以匹配操作系统使用的字体。这些是支持的字体值：\n\n* `caption`\n* `icon`\n\
  * `menu`\n* `message-box`\n* `small-caption`\n* `status-bar`\n\n例如，设置`font: icon;`将使用与桌面图标匹配的字体。\n\
  \n> **提示**：谷歌在这篇文章中提供了对字体的很好的概述：[`developers.google.com/fonts/docs/getting_started`](https://developers.google.com/fonts/docs/getting_started)。这篇文章还演示了一些高级技术，例如字体效果。其中许多效果仅受\
  \ Chrome 浏览器支持，因此要注意这一点；但它仍然是很有用的信息。\n\n## 第 11 章 ■ 文本样式\n\n### 文本格式化\n\n还有一些 CSS\
  \ 属性可以用来控制文本的格式化方式，例如对齐和缩进。你还可以使用阴影和其他效果来装饰文本。\n\n#### 水平对齐\n\n`text-align`属性定义了文本在其块内如何水平对齐。主要的值有`left`、`right`、`center`和`justify`，它们的工作原理正如你所预期的那样。有两个新值，`start`和`end`，Edge\
  \ 目前还不支持它们。`start`值对于从左到右的语言等同于`left`，但在从右到左的语言中则是右对齐。如果使用了`justify`，则`text-justify`属性指定了两端对齐的方法。默认方法是在单词之间添加空格。目前对`text-justify`属性的支持非常少。\n\
  \n#### 缩进\n\n`text-indent`属性指定了块的第一个行应该如何缩进（或悬挂缩进）。它以绝对或相对单位输入一个距离。负值表示第一行是悬挂缩进的。也可以使用百分比，它将占包含块宽度的百分比。\n\
  \n#### 溢出\n\n如果文本无法换行到下一行，它可能会溢出其水平空间。我稍后会在本章中解释换行属性。当这种情况发生时，并且`overflow`属性没有设置为`visible`，无法容纳的文本部分将被隐藏。`text-overflow`指定了浏览器应如何处理这种情况。有两个关键字可以使用：`clip`和`ellipsis`。`clip`值只是裁剪文本，但`ellipsis`值会在块内包含一个省略号（…），表明还有更多文本无法显示。这也会减少可以显示的文本量。\n\
  \n> **注意**：此属性的 W3C 规范提供了一个或两个参数。如果指定了单个参数，它表示在块的右侧要做什么。如果指定了两个参数，它们分别指定左侧和右侧。然而，目前只有\
  \ Firefox 支持双值版本。\n\n作为演示，以下标记包含一个相当长的单词。CSS 规则随后设置了一个固定宽度并将`overflow`设置为`hidden`。最后，使用`text-overflow:\
  \ ellipsis;`来指示应该显示省略号。其渲染效果如图 11-7 所示。\n\n```html\n<p class=\"overflow\">Supercalifragilisticexpialidocious</p>\n\
  ```\n\n```css\n.overflow {\n  font-size: large;\n  border: 1px solid black;\n  width:\
  \ 150px;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n```\n\n![](img/index-230_1.png)\n\
  ![](img/index-230_2.png)\n\n## 第 11 章 ■ 文本样式\n\n***图 11-7.** 设置`text-overflow`属性*\n\
  \n#### 引号\n\n引号在几种情况下由浏览器自动创建。最常见的是当使用`quote`（`q`）元素时。浏览器还会检测是否存在嵌套的引用元素，例如：\n\n\
  \n\n"
- "# 排版后的文本\n\n**<q>**你什么意思<q>我不敢相信他说了<q>不</q></q>？**</q>** 在此情况下，外层引号会使用双引号，内层引号会使用单引号。显示效果为：“你什么意思‘我不敢相信他说了’不“？””。不过，你可以使用\
  \ `quotes` 属性来控制引号所使用的字符。例如，以下 CSS 规则将告知浏览器对外层引号使用花括号，对内层引号使用方括号。`quotes` 属性提供了四个字符串值；前两个用于外层引号，后两个用于内层引号。\n\
  \n```\n* {\n  quotes: \"{\" \"}\" \"[\" \"]\"\n}\n```\n\n另一种需要输入引号的情况是使用 `::before`\
  \ 和 `::after` 伪元素时。为了演示这一点，下面的标记包含一个带有内嵌引用的段落：\n\n```html\n<p class=\"quote\">他说，<q>找到了！</q></p>\n\
  ```\n\n接着，这些 CSS 规则使用伪元素在文本前后添加引号。正如我在第 [9](http://dx.doi.org/10.1007/978-1-4842-2463-2_9)\
  \ 章中解释的那样，`content` 属性用于指定应向所选元素追加或前置的内容。在此情况下，它被设置为 `open-quote` 和 `close-quote`\
  \ 关键字。\n\n```css\n.quote::before {\n  content: open-quote;\n}\n\n.quote::after {\n\
  \  content: close-quote;\n}\n```\n\n应用这些 CSS 规则后，两个示例的渲染结果如图 11-8 所示。\n\n***图 11-8.**\
  \ 演示 quotes 属性*\n\n![](img/index-231_1.jpg)\n\n请注意，`找到了！` 周围的引号使用的是内层引号。因为引号是由伪元素添加的；浏览器将\
  \ `<q>` 元素视为嵌套在外层引号之内。如果在伪元素中改用 `no-open-quote` 和 `no-close-quote` 关键字，则不会渲染外层引号，但\
  \ `<q>` 元素仍会像嵌套使用内层引号一样被处理。\n\n#### 阴影\n\n为了增添有趣的效果，你可以使用 `text-shadow` 属性为文本添加阴影。该属性接受一个颜色值和三个距离值。颜色值可以作为第一个或最后一个参数。从技术上讲它是可选的；但为了获得最佳兼容性，你应始终包含它。某些浏览器（如\
  \ Safari）在未指定颜色时将不会显示阴影。大部分浏览器会默认将颜色设为文本颜色。\n\n三个距离值分别为 x 偏移量、y 偏移量和模糊半径，且必须按此顺序提供。模糊半径定义了原始文本图像的扩散范围。模糊半径越大，阴影就越宽越淡。该参数可选，默认为\
  \ 0。x 和 y 偏移量为必填项，表示阴影相对于文本的位置。正值将向右和向下偏移；负值则向左和向上偏移。\n\n为了演示文本阴影的不同效果，下面的标记包含三个拥有相同文本和不同类值的段落。为每个类定义了一条不同的\
  \ CSS 规则，其 `text-shadow` 属性值各不相同。渲染结果如图 11-9 所示。\n\n```html\n<p class=\"shadow\"\
  >这段文本有阴影</p>\n<p class=\"background\">这段文本有阴影</p>\n<p class=\"blurred\">这段文本有阴影</p>\n\
  ```\n\n```css\n.shadow {\n  font-size: xx-large;\n  text-shadow: 10px 5px 1px gray;\n\
  }\n\n.background {\n  font-size: xx-large;\n  text-shadow: 0px 0px 5px gray;\n}\n\
  \n.blurred {\n  font-size: xx-large;\n  text-shadow: 10px 5px 10px gray;\n}\n```\n\
  \n***图 11-9.** 演示文本阴影*\n\n## 大小写\n\n`text-transform` 属性可用于强制改变文本的大小写。它仅影响字符在浏览器中的渲染方式；在\
  \ DOM 中，文本保留其原始值。`text-transform` 属性支持以下值：\n\n\n\n"
- "# 文本样式与排版\n\n## 大小写转换\n\n- `capitalize` - 每个单词的首字母转换为大写。但请注意，这不支持标题大小写规则，即标题中间诸如“a”或“the”之类的单词不会被大写。\n\
  - `uppercase` - 所有字符转换为大写。\n- `lowercase` - 所有字符转换为小写。\n- `none` - 不进行任何更改（用于覆盖之前的规则）。\n\
  \n**注意** 某些语言具有独特的大小写规则，浏览器对此的支持程度各不相同。有些情况下这些规则会被正确处理，而有些则不会。\n\n### 间距与对齐\n\n\
  您可以使用`CSS`属性控制 HTML 文档中文本的间距。您还可以定义浏览器应如何处理内容中的空白字符。内联元素的垂直对齐可以通过`vertical-align`属性实现。\n\
  \n#### 基本间距\n\n有三个简单的`CSS`属性允许您控制字母、单词和行之间的间距。这些属性无需过多解释，我将简要描述它们：\n\n- `letter-spacing`\
  \ - 正值会在字符之间创建额外间距，负值会减少间距并可能导致重叠。允许除百分比外的所有距离单位，包括像素等绝对值和`em`、`rem`、`vw`等相对单位。默认值为`normal`，允许字体执行标准间距（包括两端对齐）。\n\
  - `word-spacing` - 影响单词和内联元素之间的间距。允许使用任何距离单位；但只有`Firefox`支持百分比。值可以是绝对值或相对值，但不支持负值。默认值为`normal`。\n\
  - `line-height` - 指定每行文本使用的垂直空间。默认值为`normal`，大约比字体大小多 20%。`line-height`可以指定为数字（如`1.2`）或百分比（如`120%`），这些值会乘以字体大小；或者指定为距离单位（如`20px`或`3em`）。避免使用绝对距离单位，因为这可能会产生意外结果。`line-height`属性也可以使用我之前解释过的`font`简写符号进行设置。\n\
  \n![](img/index-233_1.png)\n\n第 11 章 ■ 文本样式\n\n### 处理空白字符\n\n在[第 1 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_1)中，我提到空白字符通常被忽略，除非内容位于`pre`元素内部，这是默认行为。但是，您可以通过`white-space`属性更改空白字符的处理方式。它支持以下值：\n\
  \n- `normal` - 默认值。空白字符序列被压缩为单个空格，换行符被视为空格。文本仅在需要填充块时进行换行。\n- `nowrap` - 空白字符的压缩方式与`normal`相同，但文本从不换行。\n\
  - `pre` - 功能类似于`pre`元素；保留空白字符，文本仅在换行符处换行。\n- `pre-wrap` - 功能类似于`pre`值，但文本也会在必要时换行以填充块。\n\
  - `pre-line` - 空白字符的压缩方式与`normal`值相同，但文本会在换行符处换行，并且在必要时也会换行以填充块。\n\n为了演示这一点，我将使用我在[第\
  \ 4 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_4)中介绍的亨利·沃兹沃斯·朗费罗的诗。这次，它将位于一个普通的段落元素内，而不是预格式化元素中，但我可以使用`CSS`实现相同的效果。\n\
  \n```html\n<p class=\"whitespace\">I heard the bells on Christmas Day\n\nTheir old,\
  \ familiar carols play,\n\nAnd wild and sweet\n\nThe words repeat\n\nOf peace on\
  \ earth, good-will to men!</p>\n```\n\n仅应用默认样式时，此文本将位于单行上，或根据窗口宽度在必要时换行。但是，以下`CSS`规则将把它视为预格式化文本，如图\
  \ 11-10 所示。\n\n```css\n.whitespace {\n  font-family: monospace;\n  white-space:\
  \ pre;\n}\n```\n\n\n\n### **图 11-10.** 在 CSS 中处理预格式化文本\n\n## 第 11 章 ■ 文本样式\n\n####\
  \ 垂直对齐\n\n垂直对齐可能比较棘手。`vertical-align` 属性用于此目的，但其行为并非总是直观易懂。它对于表格单元格效果很好，这将在第 [13](http://dx.doi.org/10.1007/978-1-4842-2463-2_13)\
  \ 章中介绍。对于其他内容，它仅适用于内联元素和内联块元素。对于内联内容（包括内联块），定义了以下值：\n\n-   `baseline` - 元素的基线与父元素的基线对齐。\n\
  -   `bottom` - 元素的底部与当前行的底部对齐。\n-   `middle` - 这个值可能与你预期的略有不同；元素的中间与父元素的基线加上父元素小写字母`x`高度的一半对齐。\n\
  -   `sub` - 基线与父元素的下标基线对齐。\n-   `super` - 基线与父元素的上标基线对齐。\n-   `text-bottom` - 元素的底部与父元素的底部对齐。\n\
  -   `text-top` - 元素的顶部与父元素的顶部对齐。\n-   `top` - 元素的顶部与当前行的顶部对齐。\n\n你也可以使用绝对或相对单位输入一个距离值，这将调整此元素的基线相对于父元素基线的位置。也可以使用百分比，它会乘以行高。也允许使用负值。\n\
  \n除了`top`和`bottom`值之外，对齐都是基于父元素的。为了演示这一点，我将使用以下标记，在一个段落元素内放置两个`span`元素。\n\n```\n\
  <p id=\"Align\">\n  X\n  <span class=\"large\">Large </span>\n  <span class=\"small\"\
  >Small</span>\n  X\n</p>\n```\n\n段落是父元素，我在`span`元素前后都包含了一个“X”，以便你可以直观地看到`span`元素所要对齐的父元素位置。然后，我将创建三条\
  \ CSS 规则。第一条规则简单地定义了父元素的字体。\n\n```\n#Align {\n  font-family: Verdana;\n  font-size:\
  \ 36px;\n}\n```\n\n```\n.large {\n  font-size: 48px;\n  vertical-align: text-bottom;\n\
  }\n```\n\n```\n.small {\n  font-size: 24px;\n  vertical-align: text-top;\n}\n```\n\
  \n![图 11-11 预览](img/index-235_1.png)\n\n接下来的两条规则设置了`span`元素的字体大小，并设置了`vertical-align`属性。大号字体对齐到底部，小号字体对齐到顶部。结果如图\
  \ 11-11 所示。\n\n### **图 11-11.** 演示垂直对齐\n\n你可能已经注意到，文本并没有像你预期的那样完美对齐。这是因为浏览器计算基线以及用于执行对齐的其他因素的方式。如果你想进一步研究这个问题，可以看看\
  \ [`christopheraue.net/2014/03/05/vertical-align/`](http://christopheraue.net/2014/03/05/vertical-align/)\
  \ 上的一篇好文章。\n\n作为第二个示例，我将把一个固定大小的`div`元素与一个文本元素对齐。以下是标记；有两个带有`align`类的`div`元素。每个里面都有一个带有`box`类的空`div`元素和一个包含一些文本的`span`元素。\n\
  \n```\n<div class=\"align\">\n  <div class=\"solid box\"></div>\n  <span>Solid Box</span>\n\
  </div>\n<br />\n<div class=\"align\">\n  <div class=\"outline box\"></div>\n  <span>Outline\
  \ Box</span>\n</div>\n```\n\n为了设置样式，以下 CSS 规则将使第一个内部`div`显示为一个实心方块，第二个显示为一个轮廓方块。`box`这个`div`和`span`元素都将`vertical-align`属性设置为`middle`。渲染结果如图\
  \ 11-12 所示。\n\n```\n.align {\n  display: inline-block;\n  font-size: 48px;\n}\n\n\
  .box {\n  display: inline-block;\n  height: 10px;\n  width: 10px;\n  border: 1px\
  \ solid black;\n  vertical-align: middle;\n}\n\n.solid {\n  background-color: black;\n\
  }\n\n.align>span {\n  vertical-align: middle;\n}\n```\n\n![图 11-12 预览](img/index-236_1.png)\n\
  \n### **图 11-12.** 将方块与文本对齐\n\n### 断开\n\n有一些 CSS 属性可以用来控制何时应发生换行和分页。分页主要用在打印文档时。\n\
  \n#### 单词换行\n\n`overflow-wrap` 属性决定了可以在何处插入换行符以换行文本，使其适应其容器的宽度。`normal` 值表示只能在单词之间、在断字位置（`wbr`）元素处或在硬连字符或软连字符处插入换行符。这些已在第\
  \ [5](http://dx.doi.org/10.1007/978-1-4842-2463-2_5) 章中解释过。`break-word` 值表示可以在任意点断开单词，以适应允许的空间。\n\
  \n> **注意：** 大多数浏览器支持 `word-wrap` 属性，但它已被 `overflow-wrap` 取代。`word-wrap` 属性可能会在很长一段时间内继续得到支持，但你应该改用\
  \ `overflow-wrap`。\n\n还有一个额外的 `word-break` 属性，它与 `overflow-wrap` 类似。它支持 `normal`\
  \ 和 `break-all` 值，这些值大致相当于 `overflow-wrap` 的 `normal` 和 `break-word` 属性。`word-break`\
  \ 属性还支持 `keep-all` 值，主要适用于中文、日文和韩文。`overflow-wrap: break-word;` 和 `word-break: break-all;`\
  \ 在不同浏览器和上下文中的行为存在一些细微差别。除非你正在处理这些特定语言，否则我建议坚持使用 `overflow-wrap` 属性。\n\n当换行符插入到单词中间时，你可能还想在行尾添加一个连字符，以表明单词还在继续。`hyphens`\
  \ 属性控制这种情况的发生时间，并支持以下值：\n\n- `none` - 断词时从不使用连字符。\n- `manual` - 仅当在单词断开处存在硬连字符或软连字符字符时才使用连字符。\n\
  - `auto` - 默认值。它的工作方式类似于 `manual`，区别在于，当语言特定的资源确定适合使用连字符时，也可能会添加连字符。当然，这依赖于语言特定的支持，而这种支持目前非常有限。在大多数情况下，它的功能类似于\
  \ `manual`。\n\n#### 分页\n\n在渲染要打印的 HTML 时，你可以控制如何生成分页。有三个属性可以应用：\n\n- `page-break-after`\
  \ - 定义在元素末尾应用的规则。\n- `page-break-before` - 指定应在元素之前应用的分页规则。\n- `page-break-inside`\
  \ - 指示是否允许在元素内部进行分页。\n\n对于这些属性中的每一个，默认值都是 `auto`，它不定义任何规则；浏览器通常会在页面的底部换到新的一页。`page-break-inside`\
  \ 属性支持另一个值 `avoid`。使用此值可以防止在特定元素中间分页。例如，如果你不想在标题元素中间分页，创建以下规则：\n\n```\nheader {\n\
  \  page-break-inside: avoid;\n}\n```\n\n另外两个属性 `page-break-before` 和 `page-break-after`，除了\
  \ `auto` 和 `avoid` 之外，还支持以下值：\n\n- `always` - 应始终在元素之前（或之后）进行分页。\n- `left` - 工作方式类似于\
  \ `always`，但它可能生成一个或两个分页符，以强制下一页为左手页。\n- `right` - 与 `left` 类似，只是下一页将是右手页。\n\n例如，你可以使用\
  \ `page-break-before` 属性为每个 `h1` 元素强制分页。你也可以根据文档的结构，对每个 `section` 或 `article` 元素执行相同操作。\n\
  \n> **注意：** 这些分页属性正在被通用的 `break` 属性取代。例如，`page-break-after` 将被 `break-after` 取代。但是，在撰写本文时，尚不支持这些新属性。\n\
  \n### 光标\n\n\n\n"
- "# 光标形状\n\n鼠标在网页上移动时，光标的形状能提供重要的反馈信息。例如，当悬停在链接上时，光标通常会变成手指指向的手掌形状。通过使用`cursor`属性并选择预定义的关键字，可以轻松设置光标形状。例如：\n\
  \n```css\na {\n  cursor: pointer;\n}\n```\n\n与其在此列出所有选项，不如参考以下 Mozilla 文章，该文章列出了所有选项并附有示例图片：<https://developer.mozilla.org/en-US/docs/Web/CSS/cursor>。您也可以将鼠标悬停在选项上，在您的操作系统中查看它们的具体外观。光标由操作系统控制，实际形状会根据您使用的操作系统而有所不同。\n\
  \n您还可以通过指定图像文件的 URL 来定义自己的光标。使用自定义光标时，应同时包含一个预定义关键字作为后备方案，以防图像文件不被支持。可以像这样定义多个光标：\n\
  \n```css\na {\n  cursor: url(custom.png), url(fallback.cur), crosshair;\n}\n```\n\
  \n#### 总结\n\n在本章中，我解释了如何使用网页安全字体和网络字体，以及如何配置通过 CSS 控制的各种文本样式属性。CSS 提供了许多属性，让您可以出色地控制文本的排列方式。在下一章中，我将演示如何使用边框和背景来增强\
  \ HTML 文档中的内容。\n\n---\n\n"
- "# 第 12 章 边框与背景\n\n### 边框\n\n在前几章的一些示例中，我通过在元素周围添加边框来帮助可视化它们所占用的空间。我使用了如下的 CSS 规则：\n\
  \n```css\nborder: 1px solid black;\n```\n\n这使用了简写符号，设置了边框的三个主要方面：宽度、样式和颜色。这相当于分别设置每个属性：\n\
  \n```css\nborder-width: 1px;\nborder-style: solid;\nborder-color: black;\n```\n\n\
  #### 基本样式\n\n共有八种边框样式，如图 12-1 所示。所有主流浏览器都支持这些样式，尽管具体实现因浏览器而异。\n\n---\n\n**图 12-1.**\
  \ 基本边框样式\n\n© Mark J. Collins 2017  \nM. J. Collins, *Pro HTML5 with CSS, JavaScript,\
  \ and Multimedia*, DOI 10.1007/978-1-4842-2463-2_12\n\n---\n\n为了创建此演示，我使用了以下标记，创建了八个\
  \ `div` 元素，每个元素都带有 `box` 类属性以及针对八种样式各自的特定类。\n\n```html\n<section>\n  <div class=\"\
  box solid\">solid</div>\n  <div class=\"box double\">double</div>\n  <div class=\"\
  box dashed\">dashed</div>\n  <div class=\"box dotted\">dotted</div>\n  <div class=\"\
  box inset\">inset</div>\n  <div class=\"box outset\">outset</div>\n  <div class=\"\
  box ridge\">ridge</div>\n  <div class=\"box groove\">groove</div>\n</section>\n\
  ```\n\n为了更容易观察，我使用了以下样式规则，为这些元素设置固定大小、背景色，并使文本居中。\n\n```css\nsection {\n  background-color:\
  \ lightyellow;\n}\n\n.box {\n  display: inline-block;\n  width: 100px;\n  height:\
  \ 50px;\n  margin: 10px;\n  background-color: lightblue;\n  text-align: center;\n\
  \  line-height: 50px;\n}\n```\n\n以下规则仅通过类选择器设置边框样式；未指定宽度和颜色，允许浏览器使用默认值。\n\n```css\n\
  .solid { border-style: solid; }\n.double { border-style: double; }\n.dashed { border-style:\
  \ dashed; }\n.dotted { border-style: dotted; }\n.inset { border-style: inset; }\n\
  .outset { border-style: outset; }\n.ridge { border-style: ridge; }\n.groove { border-style:\
  \ groove; }\n```\n\n默认宽度为 `3px`，对于简单样式，默认颜色为黑色。然而，后四种样式使用多种颜色来实现 3D 效果。为了使这一点更明显，我通过将以下规则添加到\
  \ `box` 选择器中来使边框更宽。结果如图 12-2 所示。\n\n```css\nborder-width: 12px;\n```\n\n---\n\n\
  **图 12-2.** 加宽后的边框效果\n\n\n\n### 使用更宽的边框\n\n你也可以像这样调整颜色：\n\n`border-color: green;`\n\
  \n对于前四种样式，由于它们使用纯色，`border-color`属性的工作方式与预期完全相同。然而，3D 样式会使用明暗组合来创建阴影效果。\n\n当你指定颜色时，大多数浏览器会针对亮部采用该颜色，并针对阴影区域使用黑色。例如，Chrome\
  \ 会将其渲染为图 12-3 所示。\n\n### 在 Chrome 中使用 3D 效果和颜色\n\n在我看来，这削弱了 3D 效果，看起来不太真实。相比之下，Firefox\
  \ 使用指定颜色的浅色和深色色调，效果要好得多，如图 12-4 所示。\n\n### 在 Firefox 中使用 3D 效果和颜色\n\n#### 单独边缘\n\
  \n`border-style`、`border-width` 和 `border-color` 这些属性实际上本身也是简写属性。你可以分别为每条边指定属性。例如：\n\
  \n```\n.solid {\n  border-top-width: 3px;\n  border-right-width: 6px;\n  border-bottom-width:\
  \ 9px;\n  border-left-width: 12px;\n}\n```\n\n![](img/index-242_1.jpg)\n![](img/index-242_2.png)\n\
  \n第 12 章 ■ 边框与背景\n\n对于每条边也有一个简写形式，允许你通过单个声明指定宽度、样式和颜色，如下所示：\n\n```\n.double {\n\
  \  border-top: 3px solid red;\n  border-right: 6px dashed blue;\n  border-bottom:\
  \ 9px dotted green;\n  border-left: 12px double orange;\n}\n```\n\n**注意** 能做到并不意味着应该做。CSS\
  \ 语法为你控制边框属性提供了极大的灵活性。然而，作为一般设计原则，边框在边缘周围应保持一致。看一下图 12-5 混合边框属性时的糟糕效果。如果你不统一应用边框，3D\
  \ 效果当然会完全失效。\n\n### 混合边框属性\n\n为了演示单独边框属性的更恰当用法，我将创建一个新的`<p>`元素并应用以下 CSS 规则：\n\n\
  ```\n<p class=\"standOut\">Make this stand out!</p>\n.standOut {\n  border-top:\
  \ 2px solid black;\n  border-bottom: 2px solid black;\n  display: inline-block;\n\
  \  text-align: center;\n  font-size: xx-large;\n}\n```\n\n我只设置了顶部和底部边缘的实线边框，这将在文本上方和下方添加一条线，如图\
  \ 12-6 所示。\n\n### 仅使用顶部和底部边框\n\n![](img/index-243_1.jpg)\n\n第 12 章 ■ 边框与背景\n\n####\
  \ 圆角\n\n你可以通过设置 `border-radius` 属性轻松创建圆角。例如，要将所有四个角设置为半径为 5px 的圆角，请使用：\n\n`border-radius:\
  \ 5px;`\n\n同样，这实际上是一个简写属性；你也可以分别设置各个值。然而，圆角应用于角而不是边，因此各个属性如下：\n\n- `border-top-left-radius`\n\
  - `border-top-right-radius`\n- `border-bottom-right-radius`\n- `border-bottom-left-radius`\n\
  \n你也可以通过单个 `border-radius` 声明指定多个值。如我所示，传递单个值会调整所有四个角。如果传递两个值，第一个将应用于左上角和右下角，第二个应用于右上角和左下角。如果传递三个值，第一个将应用于左上角，第二个应用于右上角和左下角，第三个应用于右下角。如果传递四个值，每个值将应用于不同的角，从左上角开始按顺时针顺序进行。\n\
  \n为了演示这一点，我将向 `box` 类选择器添加以下声明。这将使左上角和右下角的半径大于其他两个角。渲染结果如图 12-7 所示。\n\n`border-radius:\
  \ 20px 10px;`\n\n### 应用不同的圆角半径\n\n\n\n"
- "# CSS 边框与背景\n\n每个角实际上有两个半径：一个水平方向，一个垂直方向。如图 12-8 所示。\n\n![](img/index-244_1.png)\n\
  \n**图 12-8.** 椭圆角解释\n\n如果只提供一个值（如前面的示例），它将同时用于`x`半径和`y`半径。在这种情况下，边框形状是一个圆形。输入两个值的语法是用`/`字符分隔它们。\n\
  \n例如：\n\n```\nborder-radius: 5px / 10px;\n```\n\n如果为每个角指定不同的半径，先指定`x`值，然后添加`/`，再输入`y`值。可以为`x`半径提供\
  \ 1-4 个值，为`y`半径提供 1-4 个值。不必为`x`和`y`使用相同数量的值。例如，可以为`x`提供一个值，为`y`提供四个值，反之亦然。举例说明，以下声明集合是等效的：\n\
  \n```\nborder-radius: 20px 10px 5px / 5px 10px;\n```\n\n等效于：\n\n```\nborder-top-left-radius:\
  \ 20px / 5px;\nborder-top-right-radius: 10px / 10px;\nborder-bottom-right-radius:\
  \ 5px / 5px;\nborder-bottom-left-radius: 10px / 10px;\n```\n\n在前面的示例中，半径指定为绝对长度；但是，也可以将其指定为元素尺寸的百分比。一个特别有趣的应用是像这样设置半径，渲染结果如图\
  \ 12-9 所示。\n\n```\nborder-radius: 50% / 50%;\n```\n\n![](img/index-245_1.jpg)\n\n\
  **图 12-9.** 使用椭圆边框\n\n#### 使用图像\n\n除了八种标准边框样式外，还可以使用图像获得几乎无限的灵活性。图像文件通过`border-image-source`属性指定：\n\
  \n```\nborder-image-source: url(pattern.png);\n```\n\n### 切片\n\n图像文件具有固定大小，但添加边框的元素可能会根据内容收缩和增长。也可以将图像边框应用于不同形状和大小的元素。为了有效处理这个问题并避免图像失真，图像文件被*切片*成碎片并重新组装。边框图像使用指定的偏移值被切分为九个区域，如图\
  \ 12-10 所示。\n\n![](img/index-246_1.jpg)\n\n**图 12-10.** 切片边框图像\n\n这些偏移量通过`border-image-slice`属性指定，提供上、右、下、左的值：\n\
  \n```\nborder-image-slice: 20 25 30 35;\n```\n\n这些值指定为不带单位的数字；对于位图图像，它们将被解释为像素；对于光栅图像（如\
  \ SVG），则被解释为坐标。也可以将这些值指定为百分比，表示整体图像宽度（或高度）的比例。按照典型的 CSS 方式，也可以提供少于四个的值。单个值将用于所有四个偏移量。如果提供两个值，第一个用于顶部和底部，第二个用于左侧和右侧。如果提供三个值，第一个是顶部偏移量，第二个是左右偏移量，第三个是底部偏移量。还可以在值列表中的任何位置包含关键字`fill`。如果省略，图像的中心部分将被丢弃。如果指定了`fill`，中心将作为背景使用。\n\
  \n### 分配空间\n\n现在有了八个（或九个）碎片，需要定义如何使用它们来创建边框。第一步是为边框分配空间。最简单的方法是定义一条普通的实线边框，并使用透明颜色。例如：\n\
  \n```\nborder: 35px solid transparent;\n```\n\n这不会添加可见的边框，但会在现有元素周围定义一个 35 像素宽的空间。后续的边框属性将应用于此空间。另一种方法是使用`border-image-width`属性：\n\
  \n```\nborder-image-width: 35px;\n```\n\n这也会分配一个 35 像素宽的空间，但有一个非常重要的区别。`border`属性会在元素外部分配空间。例如，如果一个元素是\
  \ 100 像素宽的正方形，添加边框将使总占用空间增加到 170 像素。然而，`border-image-width`属性会在元素内部分配空间。同样是 100\
  \ 像素的正方形，现在只有 30 像素可用于渲染实际内容。可以通过`border-image-outset`属性进行调整。\n\n```\nborder-image-outset:\
  \ 35px;\n```\n\n这将把每个边缘的位置向外移动；左边缘向左移动指定的距离，右边缘向右移动，等等。现在元素的实际内容将拥有原始的 100 像素正方形。然而，这引入了另一个问题：`border-image-outset`属性不会在\
  \ DOM 中分配额外的空间；相邻元素的位置不会改变，可能导致溢出情况。这可以通过增加外边距来解决。因此，需要以下声明：\n\n```\nborder-image-width:\
  \ 35px;\nborder-image-outset: 35px;\nmargin: 35px;\n```\n\n> **提示**：为简单起见，我为这些属性中的每一个传递单个值来定义宽度、外移量和外边距，这将为所有四个边缘使用相同的距离。也可以指定两个、三个或四个值，按照前面描述的方式应用。\n\
  \n如我所述，使用`border`属性是最简单的方法。但无论哪种方式，现在在元素周围都有一个 35 像素宽的条带，用于显示图像碎片。\n\n### 组装\n\n\
  回到八个或九个图像碎片；现在将它们组装到分配的空间中。图 12-10 说明了如何将图像文件切片成区域。类似的进程也会发生在正在添加边框的元素上。沿边缘的窄条的宽度由边框宽度定义（在当前示例中为\
  \ 35 像素）。顶部和底部条带的长度由元素宽度决定。同样，左右边缘的长度由元素高度决定。角落部分由边框宽度定义：在这种情况下是一个 35 像素的正方形。\n\n\
  来自图像文件的对应切片随后被缩放以适合边框的空间。角落部分相当直接。实际上，如果将切片的偏移量设置为与边框宽度相同，则无需缩放；角落完全不会变形。然而，边缘通常需要相当大的缩放，特别是在为不同大小的元素添加边框时。有几种选项可以通过`border-image-repeat`属性解决这个问题。\n\
  \n- `stretch` — 图像文件中的碎片根据需要进行拉伸或收缩以适应边框。如果切片偏移量与边框宽度相同，通常只需要在一个方向上进行此操作。\n  \n\
  \  ![](img/index-248_1.jpg)\n\n- `repeat` — 碎片根据需要重复多次以填充空间，通常最后一个实例会裁剪部分副本。\n\n\
  - `round` — 碎片像`repeat`选项一样重复，但只使用整数个碎片，并且单个碎片会被缩放以适应空间。这可以防止渲染部分副本。\n\n为了演示这一点，我使用了一个带有动物印花图案（我想这是美洲豹）的图像文件，用于边框。标记将创建一个简单的`div`元素：\n\
  \n```\n<div class=\"pattern\"></div>\n```\n\n\n\nCSS 规则将设置固定的宽度和高度，然后定义一个 35 像素的边框。我还使用了`35`作为切片偏移量，这样角落就不会被缩放。无论实际元素的大小如何，边缘部分只会在一个方向上缩放。如果图像被拉伸，由于所使用的图案，这种拉伸会稍微明显一些，因此我使用了`repeat`选项。最终的\
  \ CSS 规则如下，元素渲染结果如图 12-11 所示。\n\n```\n.pattern {\n  width: 350px;\n  height: 250px;\n\
  \  margin: 10px;\n  border: 35px solid transparent;\n  border-image-source: url(pattern.png);\n\
  \  border-image-slice: 35;\n  border-image-repeat: repeat;\n}\n```\n\n**图 12-11.**\
  \ 使用 `repeat` 的图像边框\n\n![](img/index-249_1.jpg)\n\n如果仔细观察边框，可以看到因为使用了`repeat`选项，图像被拼接在一起的痕迹。不过，由于该图案整体具有随机性，除非放大查看，否则这种痕迹并不十分明显。这展示了`stretch`、`repeat`和`round`选项之间的权衡。有些图像适合拉伸，而有些则适合重复。\n\
  \n> **注意：** 图像边框不支持圆角。如果你为边框应用了`border-radius`属性，元素本身会显示圆角，但其周围的可见边框仍然会是方角。\n\n\
  为了进一步演示，我将为一个图像添加边框。这张图像是乔治·华盛顿的一幅著名肖像画，我在第[7](http://dx.doi.org/10.1007/978-1-4842-2463-2_7)章中使用过它。边框使用了一张画框的图片。以下是实现此效果的标记和\
  \ CSS 规则。\n\n```html\n<img src=\"G_Wash.jpg\" alt=\"G. Washington\" />\n```\n\n\
  ```css\nimg {\n  margin: 10px;\n  width: 350px;\n  border: 34px solid transparent;\n\
  \  border-image-source: url(\"frame.jpg\");\n  border-image-slice: 34;\n  border-image-repeat:\
  \ stretch;\n}\n```\n\nCSS 与第一个示例类似；我仅指定了图像元素的宽度，以便画像能保持其原始宽高比。边框配置基本相同，只是我使用了`stretch`选项。由于我将切片偏移量和边框宽度都设置为`34px`，角落不会被缩放。边缘部分大多是直线，因此沿着该维度拉伸它们不会显得失真。这同时也避免了图像片段的拼接，而拼接在这种图像上会更加显眼。结果如图\
  \ 12-12 所示。\n\n**图 12-12.** 使用 `stretch` 选项\n\n![](img/index-250_1.jpg)\n\n####\
  \ 渐变\n\n作为最后一种边框选项，你还可以使用颜色渐变。渐变允许颜色在一个区域内逐渐变化。它们常用于背景，我将在本章后面进行演示。它们同样可以应用于边框。渐变有两种类型：\n\
  \n- **线性渐变** - 颜色从一条边（或一个角）向对边（或对角）变化。\n- **径向渐变** - 颜色随着从中心向外移动而变化。\n\n渐变的结果本质上是一幅图像。它不是需要下载的资源；然而，它可以在\
  \ CSS 中任何需要图像的位置使用。要使用渐变边框，你需要将渐变定义为`border-image-source`属性的值。\n\n### 线性渐变\n\n顾名思义，线性渐变由一条穿过元素中心的线定义，这条线被称为渐变线。如图\
  \ 12-13 所示。渐变线以一个角度定义，该角度从垂直轴开始顺时针测量；图 12-13 中的渐变线大约为 130°。线的方向很重要；如果你希望起点在右侧，则在该角度上加\
  \ 180°。\n\n**图 12-13.** 定义线性渐变\n\n渐变线也可以使用`to`关键字来指定。在`to`关键字之后，指定其中一条边（`top`、`right`、`bottom`或`left`）。因此，`to\
  \ right`将创建一个从左到右的水平渐变。如果你希望渐变从一个角到对角，则将终点角指定为一对边。例如，`to bottom left`，渐变将从对角（即右上角）开始，结束于左下角。这对边的顺序可以调换。\n\
  \n![](img/index-251_1.jpg)\n\n颜色沿着这条线在多个点被指定。至少需要指定起点和终点的颜色。你还可以指定一个或多个颜色停靠点，这些点被定义为起点和终点之间总距离的百分比。在这些指定的点之间，颜色会逐渐变化。为了简单演示，以下标记创建了一个空的`div`元素，CSS\
  \ 规则将其边框定义为线性渐变。\n\n```html\n<div class=\"linear\"></div>\n```\n\n```css\n.linear\
  \ {\n  width: 350px;\n  height: 150px;\n  margin: 10px;\n  border: 35px solid yellow;\n\
  \  border-image: linear-gradient(130deg, red, yellow 20%, green 80%, blue);\n  border-image-slice:\
  \ 1;\n}\n```\n\n这创建了一个线性渐变，颜色从红色、黄色、绿色到蓝色逐渐变化。然而，由于两个颜色停靠点非常接近起点和终点，大部分颜色将介于黄色和绿色之间，起点处有少量红色，终点处有少量蓝色。渲染结果如图\
  \ 12-14 所示。\n\n**图 12-14.** 使用线性渐变作为边框\n\n> **注意：** 某些浏览器可能不支持渐变，因此你应该设置一个纯色作为后备方案。（目前，Safari\
  \ 浏览器不支持边框渐变）。与之前示例中将纯色边框设置为透明不同，这里应该将其设置为一种颜色，以便在渐变无法使用时作为替代。此外，`border-image-slice`属性是必需的，但你可以将其设置为`1`。由于渐变会根据元素大小自动缩放，因此无需实际对图像进行切片和重新组装。\n\
  \n![](img/index-252_1.jpg)\n\n### 径向渐变\n\n径向渐变从其中心点开始，颜色向外移动时均匀变化。如图 12-15 所示。渐变结束时的最终形状可以是圆形或椭圆形。与线性渐变类似，你必须指定起始和结束颜色，也可以在这两者之间定义一个或多个颜色停靠点。\n\
  \n**图 12-15.** 径向渐变\n\n要定义径向渐变，你需要指定以下细节：\n\n- **最终形状** - 可以是`circle`或`ellipse`；默认为`ellipse`。\n\
  - **范围** - 渐变的最终大小由以下关键字之一决定：（`farthest-corner`、`farthest-side`、`closest-corner`、`closest-side`）。\n\
  - **起始位置** - 如果省略，默认为元素的中心。它被指定为与左上角的偏移量。\n- **颜色停靠点** - 0% 表示起点，100% 表示终点形状。\n\n\
  ![](img/index-253_1.jpg)\n\n为了演示，以下标记创建了一个空的`div`元素，CSS 规则定义了一个要与之配合使用的径向渐变。渲染结果如图\
  \ 12-16 所示。\n\n```html\n<div class=\"radial\"></div>\n```\n\n```css\n.radial {\n\
  \  width: 350px;\n  height: 150px;\n  margin: 20px;\n  border: 35px solid yellow;\n\
  \  border-image: radial-gradient(ellipse farthest-corner at 175px 0px, yellow 0%,\
  \ orange 75%, green 100%);\n  border-image-slice: 1;\n}\n```\n\n**图 12-16.** 带有径向渐变的边框\n\
  \n### 盒子阴影\n\n在上一章中，我解释了如何配置文本阴影。你可以使用`box-shadow`属性在几乎所有元素上实现类似的效果。该属性接受多个值；有些是必需的，但许多是可选的。如果提供，这些值应按以下顺序排列：\n\
  \n\n\n"
- "# 盒子阴影 (Box Shadows)\n\n- `inset` - （可选）如果未包含此值，阴影将绘制在元素外部，就像元素位于周围区域之上。如果指定了 `inset`，阴影将绘制在元素内部，就像元素沉入其周围区域之下。\n\
  - `x offset` - （必需）阴影的水平偏移量；负值将使阴影位于元素的左侧。\n- `y offset` - （必需）阴影的垂直偏移量；负值将使阴影位于元素的上方。\n\
  \n![](img/index-254_1.png)\n\n**第 12 章 ■ 边框与背景**\n\n- `blur radius` - （可选）指定阴影超出其原始大小的扩散程度。较大的值会产生更大但更浅的阴影。如果未提供，默认为\
  \ `0`；不允许使用负值。\n- `spread radius` - （可选）定义阴影的相对大小。默认值为 `0`，意味着阴影与元素大小相同。负值会使阴影缩小，正值则使其变大。\n\
  - `color` - （技术上可选，但为了最大兼容性应提供）使用任何颜色单位定义阴影的颜色。\n\n阴影本质上是一个新元素，在 Z 轴上位于原始元素的正下方。其大小和位置相对于原始元素。要计算阴影的大小和位置，原始元素的形状会根据\
  \ `x` 和 `y` 偏移值进行移动。然后根据 `spread radius` 指定的值进行拉伸或收缩。这在图 12-17 中进行了说明。阴影使用指定的颜色作为实心填充背景。如果定义了\
  \ `blur radius`，其边缘会以模糊效果向指定大小之外拉伸。\n\n***图 12-17.** 计算阴影位置和大小*\n\n`box-shadow`\
  \ 有两种常见用途。一种是让元素看起来从页面中凸起。这通常通过将阴影稍微向下和向右移动来实现，如图 12-18 所示。这通过以下声明实现：\n\n```\nbox-shadow:\
  \ 10px 10px 5px black;\n```\n\n![](img/index-255_1.jpg)\n\n![](img/index-255_2.jpg)\n\
  \n**第 12 章 ■ 边框与背景**\n\n***图 12-18.** 使元素从页面凸起*\n\n另一种技术是通过在所有侧边添加模糊效果来柔化元素的线条，如图\
  \ 12-19 所示。这通过以下声明实现，该声明保持与原始元素相同的大小和位置，仅使模糊效果可见：\n\n```\nbox-shadow: 0px 0px 15px\
  \ black;\n```\n\n***图 12-19.** 在元素周围添加模糊效果*\n\n> **注意：** 如果使用了 `border-radius`，阴影也将具有圆角。它遵循与原始元素相同的形状。\n\
  \n## 轮廓 (Outlines)\n\n轮廓是绘制在元素周围的框，类似于边框。重要的区别在于它不占用任何空间；它绘制在现有元素分配空间的上方。因此，轮廓通常与\
  \ `:hover` 等伪类一起使用，因为可以在不影响页面布局的情况下添加或移除该框。定义轮廓时，可以指定以下属性：\n\n- `outline-color`\n\
  - `outline-style`\n- `outline-width`\n\n这些属性可以单独设置，也可以像定义边框一样使用 `outline` 简写符号。支持的样式值与边框样式支持的八个值相同（`solid`、`double`、`dashed`、`dotted`、`inset`、`outset`、`ridge`\
  \ 和 `groove`）。你也可以使用值 `none`，这将隐藏轮廓。\n\n![](img/index-256_1.png)\n\n**第 12 章 ■ 边框与背景**\n\
  \n此外，`outline-offset` 属性在元素和轮廓之间添加内边距。例如，添加此属性将使轮廓在所有方向上偏移 `5` 像素。这无法通过 `outline`\
  \ 简写属性实现。\n\n```\noutline-offset: 5px;\n```\n\n> **注意：** `outline-offset` 属性目前不支持\
  \ IE 或 Edge。\n\n以下标记创建了一个 `div` 元素，CSS 规则为其添加了轮廓，渲染结果如图 12-20 所示。\n\n```html\n<div\
  \ class=\"outline\">This is an outline</div>\n```\n\n```css\n.outline {\n  outline:\
  \ 1px solid black;\n  outline-offset: 5px;\n}\n```\n\n***图 12-20.** 演示轮廓*\n\n> **注意：**\
  \ 边框越宽，轮廓占用的空间就越大。它不会调整元素的位置，而是将框叠加到现有空间上。该框始终位于被勾勒元素的*外部*，因此不会影响元素本身，但可能会溢出到相邻元素中。\n\
  \n## 背景 (Backgrounds)\n\n为元素设置背景基本上有两种选择：颜色或图像。要使用颜色，只需使用第 [2](http://dx.doi.org/10.1007/978-1-4842-2463-2_2)\
  \ 章中解释的任何颜色单位设置 `background-color` 属性。这些也在附录 C 的参考资料中进行了总结。使用图像时，还有一些属性控制图像的显示方式。\n\
  \n### 图像属性\n\n可以使用 `background-image` 属性为元素指定背景图像。这相当简单；只需指定要使用的图像文件的 URL。你可以指定多个图像，它们将按指定的顺序堆叠在一起。但是，还有几个其他属性会影响图像的渲染方式。\n\
  \n**第 12 章 ■ 边框与背景**\n\n### 附着 (Attachment)\n\n`background-attachment` 属性定义图像如何定位，并支持以下值：\n\
  \n- `fixed` - 图像相对于窗口保持固定；滚动窗口对背景图像没有影响。\n- `local` - 图像相对于元素的内容固定。如果滚动内容，背景图像将随之滚动。\n\
  - `scroll` - （这是默认值）图像相对于元素固定。它会随元素移动，但如果元素内部的内容被滚动，背景不会滚动。\n\n此外，由于可以指定多个图像，因此也可以为\
  \ `background-attachment` 属性指定多个值。每个值用逗号分隔，并按指定顺序应用于相应的图像。\n\n### 原点 (Origin)\n\n\
  对于 `local` 和 `scroll` 选项，`background-origin` 属性定义图像的包含矩形。支持以下值：\n\n- `border-box`\
  \ - 背景扩展到元素边框的外边缘。\n- `content-box` - 背景仅覆盖实际元素内容区域（不包括内边距和边框）。\n- `padding-box`\
  \ - 背景包括元素内容和内边距，但不包括边框。\n\n### 重复 (Repeat)\n\n`background-repeat` 属性指定背景图像是否以及如何重复以填充所需空间。图像可以在水平和垂直方向上重复，你可以为\
  \ `background-repeat` 属性提供两个不同的值。第一个值适用于水平行为，第二个值用于垂直重复。允许以下值：\n\n- `no-repeat`\
  \ - 图像不重复，可能留下未被图像覆盖的区域。\n- `repeat` - （默认）根据需要尽可能多地重复图像，最后一个重复图像通常被裁剪。\n- `round`\
  \ - 重复图像，但仅显示完整图像。然后均匀拉伸显示的图像以填充任何剩余间隙。\n- `space` - 仅重复完整图像，类似于 `round` 选项。但是，不是拉伸图像来填充间隙，而是在它们之间留下均匀的间距。第一个和最后一个图像固定在左右边缘（或底部和顶部），间距位于图像之间。\n\
  \n**第 12 章 ■ 边框与背景**\n\n\n\n"
- "# CSS 背景属性\n\n## 单值简写\n\n还存在一种简写方式，可以用单个值同时指定水平和垂直行为。如果使用单个值如`no-repeat`、`repeat`、`round`或`space`，它将同时应用于水平和垂直方向的值。此外，`repeat-x`表示水平方向使用`repeat`，垂直方向使用`no-repeat`。同样地，`repeat-y`表示相反的情况。\n\
  \n■ **注意**：截至撰写本文时，`round`和`space`值在 Firefox 或 Safari 中不受支持。\n\n#### 位置\n\n`background-position`\
  \ 属性用于指定图像相对于其原点的位置。默认值为 `0 0`，表示左上角。位置可以使用以下关键字之一指定：`top`、`right`、`bottom`、`left`\
  \ 或 `center`。也可以指定为一对距离值（相对或绝对），用空格分隔。如果使用多个图像，也可以指定多个位置，这些位置应用逗号分隔。\n\n## 大小\n\n\
  图像的大小通过 `background-size` 属性指定。大小可以使用以下关键字之一指定：\n\n- `contain` - 图像在保持原始宽高比的同时尽可能放大。这通常意味着在某一维度上，图像周围会有空白区域。该图像通常居中，除非被\
  \ `background-position` 属性覆盖。\n- `cover` - 图像在保持宽高比的同时尽可能放大。然而，为了覆盖较小的维度，图像通常在另一维度上被裁剪。\n\
  \n或者，你可以指定单个距离值（相对或绝对），这将定义背景的宽度。在这种情况下，高度将设置为 `auto`。你也可以指定两个值，用空格分隔：第一个定义宽度，第二个定义高度。关键字\
  \ `auto` 可以与单个或双值输入一起使用。它指定该维度基于图像的内在大小或根据需要设置以保持宽高比。如果有多个图像，也可以提供多个大小，用逗号分隔。\n\n\
  #### 裁剪\n\n`background-clip` 属性指定背景应在何处被裁剪。此属性允许你控制背景是否应延伸到元素的内边距和边框区域。\n\n支持以下值：\n\
  \n- `border-box` - 背景延伸到元素边框的外边缘。\n- `content-box` - 背景仅覆盖实际元素内容区域（不包括内边距和边框）。\n\
  - `padding-box` - 背景包括元素内容和内边距，但不包括边框。\n\n■ **注意**：这些值与 `background-origin` 属性相同，实际上\
  \ `background-clip` 的工作原理与 `background-origin` 非常相似。需要明确的是，`background-origin` 决定图像的定位，即图像与哪个矩形对齐。而\
  \ `background-clip` 属性决定背景结束的矩形，无论是对于颜色还是图像背景。\n\n## 背景简写\n\n通常的做法是使用 `background`\
  \ 简写符号，在单个声明中指定多个背景属性。以下属性可以在 `background` 简写中设置：\n\n- `background-image`\n- `background-position`\n\
  - `background-size`\n- `background-repeat`\n- `background-attachment`\n- `background-origin`\n\
  - `background-clip`\n- `background-color`\n\n所有这些属性都是可选的。通常，顺序无关紧要，但 `background-size`\
  \ 必须直接跟在 `background-position` 之后（如果两者都使用），并且它们之间应用斜杠（`/`）分隔。其他属性用空格分隔。\n\n我之前提到过，可以在背景中定义多个图像，这些被称为图层。使用简写时，应为第一个图层指定所有所需的属性，然后添加逗号，再指定下一个图层的属性。单个图层的属性一起声明，每个图层用逗号分隔。`background-color`\
  \ 属性只能在最后一个图层上设置。\n\n使用 `background` 简写时，任何未指定的属性都将设置为默认值。如果在某个声明中指定了一个背景属性（例如 `background-position`），然后在另一个声明中使用简写设置，则先前对\
  \ `background-position` 的设置将被撤销并恢复为默认值。例如，考虑以下情况。背景将不会居中，因为简写只提供了颜色属性；位置已恢复为默认值。\n\
  \n```css\ndiv {\n    background-position: center;\n    background: red;\n}\n```\n\
  \n## 示例\n\n为了快速演示，我将回到本章开头的边框示例，并用图像替换背景颜色，使用 `background` 快捷键。CSS 规则现在如下所示：\n\n\
  ```css\nsection {\n    /*background-color: lightyellow;*/\n    background: url(smiley.png)\
  \ scroll space;\n}\n```\n\n![](img/index-260_1.jpg)\n\n我使用了 `scroll` 作为 `background-attachment`，因为我希望图像固定到包含元素。由于图像相对较小，我需要在两个方向上重复；但是，我不希望任何面部被裁剪，只剩下半张脸。`round`\
  \ 值可以实现这一点，但会通过拉伸图像来填补间隙而导致图像变形。`space` 值是 `background-repeat` 选项的合适选择。渲染结果如图 12-21\
  \ 所示。\n\n***图 12-21.** 使用重复背景图像*\n\n为了演示渐变的使用，我将用线性渐变替换它，通过 `background-image` 属性设置。在此示例中，我使用方向关键字而不是角度来定义渐变线。渲染结果如图\
  \ 12-22 所示。\n\n```css\nsection {\n    /*background-color: lightyellow;*/\n    /*background:\
  \ url(smiley.png) scroll space;*/\n    background-image: linear-gradient(to right\
  \ bottom, #FFF, #0EE);\n}\n```\n\n![](img/index-261_1.jpg)\n\n***图 12-22.** 使用背景渐变*\n\
  \n当装裱图片时，通常使用衬板来在图片和实际边框之间提供边界。在 CSS 中，可以通过结合使用 `background` 和 `border` 属性来实现相同的效果。我将使用乔治·华盛顿的画作来展示如何做到这一点。我会在之前演示的\
  \ CSS 规则中添加内边距和背景颜色。结果如图 12-23 所示。\n\n```css\nimg {\n    margin: 10px;\n    width:\
  \ 350px;\n    border: 34px solid transparent;\n    border-image-source: url(\"frame.jpg\"\
  );\n    border-image-slice: 34;\n    border-image-repeat: stretch;\n    padding:\
  \ 30px;\n    background-color: silver;\n}\n```\n\n![](img/index-262_1.jpg)\n\n***图\
  \ 12-23.** 为图片添加衬板*\n\n■ **提示**：如果你想创建多个衬板，可以通过将图像元素放入一个 `div` 元素中来实现。将图像的 `background`\
  \ 设置为内层衬板，`div` 的 `background` 设置为外层衬板。然后将边框放在 `div` 上而不是图像上。\n\n作为最终演示，我将向 `body`\
  \ 元素添加一个固定的背景图像：\n\n```css\nbody {\n    background: url(smiley.png) fixed no-repeat\
  \ center;\n}\n```\n\n这将使用相同的笑脸图像，但使其固定到窗口。当滚动时，背景图像不会随内容移动。`no-repeat` 值设置了 `background-repeat`。\n\
  \n\n\n"
