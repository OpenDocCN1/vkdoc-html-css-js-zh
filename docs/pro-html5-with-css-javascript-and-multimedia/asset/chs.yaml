- "# 第 25 章 ■ Indexed DB\n\n#### 创建数据库\n\n现在你已经准备好创建并使用本地 Indexed DB 数据库来配置和显示棋盘上的棋子了。初始阶段，数据将从静态数据加载，你只需简单地显示开局阵型。稍后，你将通过更新对象存储中的棋子位置来实现动画效果。\n\
  \n你需要向数据库中填充一些数据。在本应用程序中，你只需使用 `Data.js` 脚本中声明的数据，并将其复制到对象存储中。对于其他应用，这些数据可能从服务器下载或由用户输入获得。\n\
  \n#### 打开数据库\n\n将清单 25-3 所示的代码添加到 `Chess.js` 脚本中，紧跟在 `drawBoard()` 调用之后（并在 `drawBoard()`\
  \ 函数实现之前）。\n\n**清单 25-3.** 打开数据库\n\n```\nvar dbEng = window.indexedDB ||\n  window.webkitIndexedDB\
  \ || // Chrome\n  window.mozIndexedDB || // Firefox\n  window.msIndexedDB; // IE\n\
  var db; // 这是数据库的句柄\nif (!dbEng)\n  alert(\"此浏览器不支持 IndexedDB\");\nelse {\n  var\
  \ request = dbEng.open(\"Chess\", 1);\n  request.onsuccess = function (event) {\n\
  \    db = event.target.result;\n  }\n  request.onerror = function (event) {\n  \
  \  alert(\"请允许浏览器打开数据库\");\n  }\n  request.onupgradeneeded = function (event) {\n\
  \    configureDatabase(event);\n  }\n}\n```\n\n如果无法访问 `indexedDB` 对象，则说明浏览器不支持它。在本演示中，你可以简单地使用\
  \ `alert()` 来通知用户并停止后续处理。\n\n然后，此代码使用 `indexedDB` 对象打开 Chess 数据库，并指定使用的版本号。`open()`\
  \ 方法返回一个 `IDBOpenDBRequest` 对象，正如我之前所述。你将为此请求附加三个事件处理程序。\n\n- `onsuccess`：此事件处理程序仅保存对数据库的引用。稍后你将在此处添加更多逻辑。请注意，数据库是从\
  \ `event.target.result` 属性中获取的，所有结果都通过该属性返回。\n- `onerror`：浏览器无法打开数据库的主要原因在于浏览器已阻止\
  \ IndexedDB 功能。出于安全原因，该功能可能被禁用。在这种情况下，系统会提示用户允许访问。或者，你也可以\n```\n\n\n# 排版后的内容\n\n\
  请选择显示错误信息。\n\n- `onupgradeneeded`：如果数据库不存在或指定的版本不是当前版本，则会触发此事件。这会调用`configureDatabase()`函数，接下来你将实现该函数。\n\
  \n#### 定义数据库结构\n\n将列表 25-4 中显示的代码添加到`Chess.js`脚本中，以实现`configureDatabase()`函数。\n\n\
  **列表 25-4.** 定义数据库结构\n\n```\nfunction configureDatabase(e) {\n    alert(\"Configuring\
  \ database - current version is \" + e.oldVersion +\n        \", requested version\
  \ is \" + e.newVersion);\n    db = e.currentTarget.result;\n    // Remove all existing\
  \ data stores\n    var storeList = db.objectStoreNames;\n    for (var i = 0; i <\
  \ storeList.length; i++) {\n        db.deleteObjectStore(storeList[i]);\n    }\n\
  \    // Store the piece types\n    var typeStore = db.createObjectStore\n      \
  \  (\"pieceType\", { keyPath: \"name\" });\n    for (var i in pieceTypes){\n   \
  \     typeStore.add(pieceTypes[i]);\n    }\n    // Create the piece data store (you'll\
  \ add\n    // the data later)\n    var pieceStore = db.createObjectStore\n     \
  \   (\"piece\", { autoIncrement: true });\n    pieceStore.createIndex\n        (\"\
  piecePosition\", \"pos\", { unique: true });\n}\n```\n\n第 25 章 ■ IndexedDB\n\n**■\
  \ 注意** 如果数据库不存在或不是当前版本，则会调用`configureDatabase()`函数。对于版本变更，你可以使用`db.version`属性获取当前版本，然后进行必要的调整。另外，传递给`onupgradeneeded`事件处理器的事件对象将包含`e.oldVersion`和`e.newVersion`属性。为了简化本项目中的操作，你将简单地删除所有对象存储并从头重建数据库。这将清除所有现有数据。对于这个例子来说没问题，但在大多数情况下，你需要尽可能保留数据。\n\
  \n数据库对象的`objectStoreNames`属性包含所有已创建对象存储的名称列表。要移除所有现有对象存储，列表中的每个名称都会被传递给`deleteObjectStore()`方法。\n\
  \n最初，你将使用`createObjectStore()`方法创建两个数据存储。\n\n- `pieceType`：包含每种棋子类型的对象，例如兵、车或王。\n\
  - `piece`：包含每个棋子的对象，黑方 16 个，白方 16 个。\n\n#### 指定对象键\n\n创建对象存储时，你必须在调用`createObjectStore()`方法时指定存储的名称。你还可以指定一个或多个可选参数。只支持两个参数。\n\
  \n- `keypath`：指定为属性名称的集合。如果使用单个属性，你可以将其指定为字符串而不是字符串集合。这定义了将用作键的对象属性（或多个属性）。如果未指定`keypath`，则必须使用键生成器或提供键值来定义键，稍后将在本节中解释。\n\
  - `autoIncrement`：如果为`true`，表示键由对象存储按顺序分配。\n\n存储中的每个对象都必须具有唯一的键。有三种指定键的方法。\n\n-\
  \ 使用`keypath`参数指定一个或多个定义唯一键的属性。当添加对象时，`keypath`用于根据对象的属性生成键。\n- 使用键生成器。如果指定了`autoIncrement`，对象存储将基于内部计数器分配键。\n\
  - 添加对象时提供键值。如果你没有指定键路径或使用键生成器，则在将对象添加到存储时必须提供键。\n\n对于`pieceType`存储，你将使用`keypath`。`name`属性将指定类型，例如兵或马。这将是每个对象的唯一值。这也是将用于检索对象的值，因此这非常适合作为键路径。创建对象存储后，来自`pieceTypes[]`数组的数据将被复制到`pieceType`存储中。\n\
  \n**■ 注意** 在`onupgradeneeded`事件处理程序中，无需显式创建事务即可将数据添加到对象存储。存在一个隐式事务，该事务是在响应`onupgradeneeded`事件时创建的。\n\
  \n第 25 章 ■ IndexedDB\n\n#### 创建索引\n\n对于`piece`存储，棋子数据中没有自然可用的键，因此你将使用键生成器。它会生成唯一的键，但这些键没有实际意义；它们只是为了满足唯一约束而创建的合成键。最初在绘制棋盘时，你将检索所有对象，因此不需要知道键是什么。\n\
  \n稍后，你将需要检索一个棋子以便移动它。你将根据棋子在其棋盘上的位置来找到它。为此，你将基于`pos`属性向存储添加一个索引。由于没有两个棋子可以占据同一个格子，`pos`属性可以用作唯一索引。通过将其指定为唯一索引，如果你尝试插入一个位置与现有对象相同的新对象，将会收到错误。\n\
  \n**■ 注意** 由于`pos`属性是唯一的，你可能会想将其用作键。但是，因为你会移动棋子，它们的位置会发生变化，使用经常变化的键被认为是一种糟糕的设计模式。对于\
  \ IndexedDB 来说，这尤其有问题，因为你实际上无法更改键；你必须删除当前对象，然后使用新键重新添加它。\n\n创建索引时，你必须像这样指定一个`keypath`：\n\
  \n```\npieceStore.createIndex\n    (\"piecePosition\", \"pos\", { unique: true });\n\
  ```\n\n在这种情况下，`pos`属性是这个索引的键路径。`keypath`可能包含多个属性，在这种情况下，索引将基于所选属性的组合。当对象存储具有索引时，当对象被添加到存储中时，索引会自动填充。\n\
  \n#### 重置棋盘\n\n你已经创建了`piece`对象存储，但尚未填充数据。你将在单独的函数中执行此操作。\n\n为了理解原因，让我解释一下数据库生命周期。第一次显示网页时，数据库会被打开，由于它不存在，将创建一个新数据库。这是因为会触发`onupgradeneeded`事件，并且你实现了这个事件处理器来创建对象存储。当再次显示页面（或简单刷新）时，由于数据库已存在，将跳过此步骤。\n\
  \n稍后，当你开始移动棋子以及删除它们时，你希望在重新加载页面时将它们移回初始位置。你可以使用此方法来实现。现在，你将使用以下代码向`Chess.js`脚本添加一个`resetBoard()`函数。此函数不是在数据库创建时调用，而是在页面加载时调用。\n\
  \n```\nfunction resetBoard() {\n    var xact = db.transaction([\"piece\"], \"readwrite\"\
  );\n    var pieceStore = xact.objectStore(\"piece\");\n    var request = pieceStore.clear();\n\
  \    request.onsuccess = function(event) {\n        for (var i in pieces) {\n  \
  \          pieceStore.put(pieces[i]);\n        }\n    }\n}\n```\n\n第 25 章 ■ IndexedDB\n\
  \n此代码使用读写模式创建一个事务，并仅指定`piece`对象存储，因为这是你唯一需要访问的。然后从事务中获取`piece`存储。`clear()`方法用于从存储中删除所有对象。最后，`pieces[]`数组中的所有对象都被复制到对象存储中。\n\
  \n现在，将下面以粗体显示的代码添加到`onsuccess`事件处理器中。这将在数据库打开后调用`resetBoard()`函数。\n\n**■ 注意** `onupgradeneeded`事件被触发，其事件处理器必须在`onsuccess`事件被触发之前完成。这确保了数据库在使用前已被正确配置。\n\
  \n```\nvar request = dbEng.open(\"Chess\", 1);\nrequest.onsuccess = function (event)\
  \ {\n    db = event.target.result;\n    **// Add the pieces to the board**\n   \
  \ **resetBoard();**\n}\n```\n\n\n\n# 提示\n- **提示**：在`resetBoard()`函数中，你调用了`put()`方法（重复了\
  \ 32 次）。然而，你没有获取任何响应对象或实现任何事件处理器。这段代码看起来是同步执行的。\n\n实际上，这些调用是异步处理的，并且在两种情况下都会返回响应对象，但返回值被忽略了。你可以为这些请求实现`onsuccess`和`onerror`事件处理器。\n\
  \n在这个例子中，你取了一点巧。由于不像检索数据时需要结果值，你不需要处理`onsuccess`事件。因为这些调用位于一个事务内，其他事务对这些对象存储的后续使用将被阻塞，直到更新完成。\n\
  \n#### 绘制棋子\n\n到目前为止，你已经打开了数据库，并在必要时配置了对象存储。你还用初始位置填充了棋子存储。现在你可以绘制棋子了。为此，你将实现一个`drawAllPieces()`函数来遍历所有棋子，以及一个`drawPiece()`函数来显示单个图像。这些函数类似于你在[第\
  \ 23 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_23)中创建的同名函数。\n\n然而，这些函数的数据将从新数据库中检索。\n\
  \n`drawAllPieces()`函数将使用一个游标来处理`piece`对象存储中的所有对象。\n\n对于每个棋子，它将提取必要的属性并将它们传递给`drawPiece()`函数。然后`drawPiece()`函数必须访问`pieceType`存储以获取类型属性（如高度和宽度），并在适当的位置显示图像。\n\
  \n# 第 25 章 ■ IndexedDB\n\n#### 使用游标\n\n从对象存储中检索数据时，如果你想使用键检索单个记录，请使用`get()`方法（我将在后面描述）。你也可以使用索引选择一个或多个对象，我将在本章后面解释这一点。要获取所有棋子，你需要访问整个对象存储，这将通过使用游标来完成。\n\
  \n创建事务并获取对象存储后，你将调用它的`openCursor()`方法。这将返回一个`IDBRequest`对象，你需要为其提供一个`onsuccess`事件处理器。当事件触发时，它只提供第一个对象。你可以通过调用`continue()`方法获取下一个对象。为了演示这一点，将清单\
  \ 25-5 中所示的函数添加到`Chess.js`脚本中。\n\n***清单 25-5.*** 绘制棋子\n\n```\nfunction drawAllPieces()\
  \ {\n\nvar xact = db.transaction([\"piece\", \"pieceType\"]);\n\nvar pieceStore\
  \ = xact.objectStore(\"piece\");\n\nvar cursor = pieceStore.openCursor();\n\ncursor.onsuccess\
  \ = function (event) {\n\nvar item = event.target.result;\n\nif (item) {\n\nif (!item.value.killed)\
  \ {\n\ndrawPiece(item.value.type,\n\nitem.value.color,\n\nitem.value.row,\n\nitem.value.column,\n\
  \nxact);\n\n}\n\nitem.continue();\n\n}\n\n}\n\n}\n```\n\n这段代码创建了一个将同时使用`piece`和`pieceType`对象存储的事务。模式未指定，默认值为`readonly`。然后它获取`piece`对象存储并调用其`openCursor()`方法。`onsuccess`事件处理器从事件对象（使用`event.target.result`）获取第一个对象。如果棋子未被吃掉，则调用`drawPiece()`函数显示它（你将在下一步实现该函数）。我稍后会解释`killed`属性。你传入它所需的所有属性，如`type`、`color`、`row`和`column`。你还需要传入事务对象，以便`drawPiece()`函数可以使用同一事务访问`pieceType`存储。\n\
  \n调用`continue()`方法将导致同一事件再次触发，这次在`event.target.result`属性中提供下一个对象。如果没有更多对象，则`result`属性将为`null`。这就是你获知所有对象已处理完毕的方式。\n\
  \n# 第 25 章 ■ IndexedDB\n\n`openCursor()`方法提供了一些基本功能来过滤返回的对象。如果未提供参数，它将返回存储中的所有对象。你可以使用以下方式之一指定键范围：\n\
  \n- `IDBKeyRange.only()`：指定单个值，仅返回匹配的记录。\n- `IDBKeyRange.lowerBound()`：仅返回大于指定值的键值。默认情况下这是包含性的，因此它也会返回键值完全匹配的对象，但你可以更改此设置，使其仅返回更大的值。\n\
  - `IDBKeyRange.upperBound()`：工作方式与`lowerBound()`类似，不同之处在于它返回小于或等于指定值的值。我将在本章后面演示这一点。\n\
  - `IDBKeyRange.bound()`：允许你同时指定下限和上限。你还可以指示这些值中的任一个是否为包含性的。这些值的默认值为`false`，表示不包含。\n\
  \n你还可以向`openCursor()`函数传递第二个参数，以指定返回记录的方向。支持的值定义在`IDBCursorDirection`枚举中。可能的值如下：\n\
  \n- `next`：按递增键顺序返回下一条记录（这是默认值）。\n- `prev`：返回前一条记录。\n- `nextunique`：返回具有不同键的下一条记录；这忽略重复的键。\n\
  - `prevunique`：返回前一条记录，忽略重复的键。\n\n以下示例将返回键大于 3 且小于等于 7 的对象，并按降序返回它们。创建键范围时的最后两个参数表示下限不包含，而上限包含。打开游标时，第二个参数指定应使用反向方向。\n\
  \n```\nvar keyRange = IDBKeyRange.bound(3, 7, false, true);\n\nstore.openCursor(keyRange,\
  \ IDBCursorDirection.prev);\n```\n\n#### 检索单个对象\n\n现在你将实现`drawPiece()`函数，该函数将在棋盘上绘制单个棋子。它必须首先访问`pieceType`对象存储以获取图像细节。在这种情况下，你将使用其键检索单个对象。`pieceType`对象存储的键是`type`属性。将清单\
  \ 25-6 中所示的函数添加到`Chess.js`脚本中。\n\n***清单 25-6.*** 绘制单个棋子\n\n```\nfunction drawPiece(type,\
  \ color, row, column, xact) {\n\nvar typeStore = xact.objectStore(\"pieceType\"\
  );\n\nvar request = typeStore.get(type);\n\nrequest.onsuccess = function (event)\
  \ {\n\nvar img;\n\nif (color === \"black\") {\n\nimg = images[event.target.result.blackImage];\n\
  \n}\n\nelse {\n\nimg = images[event.target.result.whiteImage];\n\n}\n\nchessContext.drawImage(img,\n\
  \n(75 - event.target.result.width) / 2 + (75 * column),\n\n73 - event.target.result.height\
  \ + (75 * row),\n\nevent.target.result.width,\n\nevent.target.result.height);\n\n\
  }\n\n}\n```\n\n此代码使用传入的同一个事务对象。它获取`pieceType`对象存储，然后调用其`get()`方法。`onsuccess`事件处理器获取必要的属性并调用画布的`drawImage()`方法。有关在画布上绘制图像的更多信息，请参阅[第\
  \ 23 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_23)。\n\n现在，通过添加如下所示以粗体显示的代码，在`open()`调用的`onsuccess`事件处理器中添加对`drawAllPieces()`的调用。\n\
  \n```\nrequest.onsuccess = function (event) {\n\ndb = event.target.result;\n\n//\
  \ 将棋子添加到棋盘上\n\nresetBoard();\n\n// 在初始位置绘制棋子\n\ndrawAllPieces();\n\n}\n```\n\n####\
  \ 测试应用程序\n\n现在你可以测试应用程序了，它将显示初始起始位置。刷新浏览器，你应该会看到一个警告，告知正在配置数据库，如图 25-3 所示。\n\n***图\
  \ 25-3.*** 显示正在配置数据库的警告\n\n\n\n# 再次运行此应用程序时，无需再进行此配置。棋盘应如图 25-4 所示。\n\n**图 25-4.**\
  \ 已完成静态棋子布局的棋盘\n\n---\n\n**提示**：若要从计算机中删除数据库，可找到其存储文件夹并删除对应的子文件夹。以我的机器上的 Firefox\
  \ 为例，路径为 `C:\\Users\\Mark\\AppData\\Roaming\\Mozilla\\Firefox\\Profiles\\p1i1rsab.default\\\
  storage\\default`。此文件夹中每个数据库都有一个子文件夹，子文件夹名称包含协议（`http`）、域名和端口（如有）。对于我的应用程序，该子文件夹名为\
  \ `http+++localhost+25519`。删除此文件夹并重启浏览器。由于必须新建数据库，页面将重新配置。对于 Chrome，文件路径为：`C:\\\
  Users\\Mark\\AppData\\Local\\Google\\Chrome\\User Data\\Default\\IndexedDB`。\n\n\
  如果在 Chrome 中打开 `Chess.html` 文件，可通过开发者工具访问此数据库。选择“Application”链接，然后展开“Storage”部分的\
  \ `IndexedDB` 项，如图 25-5 所示。\n\n![](img/index-496_1.jpg)\n\n**图 25-5.** 在 Chrome\
  \ 中查看数据库\n\n---\n\n#### 移动棋子\n\n现在你可以通过移动棋子来让棋盘动态起来了。这里将使用第 23 章中用过的相同预设走法。只需更新棋子的位置并重新绘制棋盘即可移动一个棋子。\n\
  \n不过有一个复杂情况：如果某次移动吃掉了棋子，你需要将其从棋盘上移除。目前，你只需从存储中删除该对象即可，但本章末尾会介绍更好的方法。\n\n### 定义走法\n\
  \n既然你现在对数据库已经相当熟悉了，就把走法也存储在数据库中吧。一次走法由起始位置和终止位置定义。例如，“将 `e2` 处的棋子移动到 `e3`”。你将对这些走法从\
  \ 1 到 7 编号，以便按正确顺序执行。你需要一个新的对象存储来保存走法详情。为此，需要指定一个新版本，这将触发 `onupgradeneeded` 事件。然后，在\
  \ `configureDatabase()` 函数中添加逻辑来创建新存储。\n\n---\n\n**练习 25-2. 添加走法存储**\n\n1. 在调用 `drawBoard()`\
  \ 函数之前，将以下代码添加到 `Chess.js` 脚本的开头。\n\n```javascript\nvar moves = [\n  { id: 1, start:\
  \ \"e2\", end: \"e3\" },\n  { id: 2, start: \"e7\", end: \"e5\" },\n  { id: 3, start:\
  \ \"f1\", end: \"c4\" },\n  { id: 4, start: \"h7\", end: \"h6\" },\n  { id: 5, start:\
  \ \"d1\", end: \"f3\" },\n  { id: 6, start: \"g7\", end: \"g6\" },\n  { id: 7, start:\
  \ \"f3\", end: \"f7\" }\n];\n```\n\n2. 将以下以粗体显示的代码添加到 `configureDatabase()` 函数的末尾。这将在配置数据库时创建并填充走法存储。\n\
  \n```javascript\npieceStore.createIndex\n(\"piecePosition\", \"pos\", { unique:\
  \ true });\n\n// 存储走法\nvar moveStore = db.createObjectStore\n(\"move\", { keyPath:\
  \ \"id\" });\nfor (var i in moves) {\n  moveStore.add(moves[i]);\n}\n```\n\n3. 在\
  \ `open()` 调用中，将版本号改为 2（如粗体所示）。这将导致下次加载页面时触发 `onupgradeneeded` 事件。\n\n```javascript\n\
  if (!dbEng)\n  alert(\"此浏览器不支持 IndexedDB\");\nelse {\n  var request = dbEng.open(\"\
  Chess\", 2);\n```\n\n**注意**：在此示例中，`configureDatabase()` 函数会直接删除所有现有数据存储，然后重新创建它们。之所以可以这样做，是因为你无需操心维护任何现有数据；这些数据都是用预设值重新加载的。在许多场景中，你不能这样做，而需要根据当前版本进行具体更改。例如，如果请求版本\
  \ 5 而当前版本是 2，则需要先添加版本 3 的更改，再添加版本 4 的更改，最后添加版本 5 的更改。在规划结构变更时务必牢记这一点。\n\n---\n\n\
  ### 转换位置\n\n\n\n# 排版后的内容\n\n棋子存储区中的对象具有 `row`、`column` 和 `pos` 属性。`row` 和 `column`\
  \ 属性遵循第 23 章中使用的相同约定，即左上角方格位于 `0,0`。这与 canvas 的工作方式一致，并简化了 `drawPiece()` 的实现。相比之下，`pos`\
  \ 属性使用国际象棋中广泛使用的记谱法，从左到右移动时，列（棋盘纵线）依次为 `a` 到 `h`。从棋盘底部移动到顶部时，行（棋盘横线）依次为 `1` 到 `8`。因此，`a1`\
  \ 表示左下角的方格。\n\n在开始移动棋子的繁重工作之前，你将创建一个函数，用于将 `pos` 属性转换为 `row` 和 `column` 属性。例如，当一个棋子被移动到\
  \ `e3` 时，你需要将 `e3` 转换为对应的 `row` 和 `column` 坐标，即 `5`（行）和 `4`（列）。将清单 25-7 所示的函数添加到\
  \ `Chess.js` 脚本中。\n\n***清单 25-7.*** 实现 `computeRowColumn()` 函数\n\n```\nfunction\
  \ computeRowColumn(oStart, end) {\n  oStart.pos = end;\n  switch (end.substring(0,\
  \ 1)) {\n    case \"a\": oStart.column = 0; break;\n    case \"b\": oStart.column\
  \ = 1; break;\n    case \"c\": oStart.column = 2; break;\n    case \"d\": oStart.column\
  \ = 3; break;\n    case \"e\": oStart.column = 4; break;\n    case \"f\": oStart.column\
  \ = 5; break;\n    case \"g\": oStart.column = 6; break;\n    case \"h\": oStart.column\
  \ = 7; break;\n  }\n  oStart.row = 8 - parseInt(end.substr(1, 1));\n}\n```\n\n`oStart`\
  \ 参数是在起始位置（在我们的示例中为 `e2`）找到的棋子存储区对象。`end` 参数是结束位置 `e3`，该值会被复制到 `pos` 属性，因为这将变为棋子的新位置。\n\
  \n然后，这段代码使用一个 `switch` 语句将 `a`–`h` 的棋盘纵线记法转换为 `0`–`7` 的坐标。该坐标随后存储在 `column` 属性中。`row`\
  \ 属性的计算方式是取位置字符串的最后一位数字，然后用 `8` 减去该数字。\n\n#### 执行移动\n\n就像你在第 23 章中所做的那样，你将使用一个计时器每隔两秒执行下一步移动。你需要一个计时器变量，以便在动画完成时清除该计时器。你还需要跟踪当前的移动步数。在调用\
  \ `drawBoard()` 方法之前，将以下两个以粗体显示的变量添加到 `Chess.js` 脚本中。\n\n```\nvar moveNumber = 1;\n\
  var timer;\ndrawBoard();\n```\n\n**第 25 章 ■ Indexed DB**\n\n移动一个棋子最多需要进行五次数据库调用：\n\
  \n1.  从移动存储区获取下一个对象（该对象定义了起始和结束位置）。\n2.  获取起始位置的对象。\n3.  获取结束位置的对象（如果该移动是吃子，则只会有一个对象）。\n\
  4.  移除结束位置的对象（此步骤仅在某些移动时需要）。\n5.  更新起始位置的对象（将其移动到结束位置）。\n\n这些调用都将使用同一个事务进行。正如我在本章开头演示的那样，你需要为每一个调用嵌套\
  \ `onsuccess` 事件处理程序。将清单 25-8 所示的 `makeNextMove()` 函数添加到 `Chess.js` 脚本中。\n\n***清单\
  \ 25-8.*** 实现 `makeNextMove()` 函数\n\n```\nfunction makeNextMove() {\n  var xact\
  \ = db.transaction([\"move\", \"piece\"], \"readwrite\");\n  var moveStore = xact.objectStore(\"\
  move\");\n\n  moveStore.get(moveNumber).onsuccess = function (e1) {\n    var startPos\
  \ = e1.target.result.start;\n    var endPos = e1.target.result.end;\n    var startKey\
  \ = null;\n    var oStart = null;\n    var pieceStore = xact.objectStore(\"piece\"\
  );\n    var index = pieceStore.index(\"piecePosition\");\n\n    index.getKey(startPos).onsuccess\
  \ = function (e2) {\n      startKey = e2.target.result;\n      index.get(startPos).onsuccess\
  \ = function (e3) {\n        oStart = e3.target.result;\n        // 如果结束位置存在棋子，我们需要更新它以防止出现重复的\
  \ pos 索引\n        removePiece(endPos, oStart, startKey, pieceStore);\n      }\n\
  \    }\n  }\n}\n```\n\n\n\n# 此函数会创建一条事务，同时访问移动存储和棋子存储。模式设置为`readwrite`，因为棋子存储中的对象将被修改。接着它获取移动存储，并调用其`get()`方法，传入当前棋步（即表格的键）。这将返回一个对象，并在`onsuccess`事件处理程序中从结果中提取起始位置和结束位置。\n\
  \n## 第 25 章 ■ IndexedDB\n\n**提示**：请注意，这段代码并未显式定义`request`变量。相反，`onsuccess`事件处理程序直接附加在数据库调用上。在前面的示例中，我声明了一个`request`变量，然后将事件处理程序附加到该变量上，以帮助你理解操作过程。然而，将事件处理程序直接附加到方法上也能达到相同效果，并且让代码更简洁一些。\n\
  \n# 获取对象键\n\n对于棋子存储，你使用了键生成器，因此键并非对象的一部分。`makeNextMove()`函数中的代码将使用基于`pos`属性建立的索引，来检索起始位置处的对象（如果终点位置有棋子，也会检索该位置的对象）。要更新或删除对象，你需要获取其键。\n\
  \n在检索起始位置的棋子对象时，这段代码首先从事务中获取棋子存储。然后从中获取`piecePosition`索引。要获取键值，你需要调用`index.getKey()`方法，该方法会返回所请求起始位置的键。该键值存储在`startKey`变量中。\n\
  \n要获取所需的对象，你需要调用`index.get()`方法，并传入要搜索的位置。这会返回所请求起始位置处的对象，并将其存储在`oStart`变量中。\n\n\
  在这两种情况下，数据都会通过`result`属性返回。同时，处理结果的事件处理程序采用了嵌套形式。\n\n获取到必要的数据后，会调用`removePiece()`方法，并传入以下参数：\n\
  \n* `end`：被移动棋子的终点位置\n* `oStart`：表示被移动棋子的对象\n* `startID`：`oStart`对象的键\n* `pieceStore`：将用于执行更新的棋子存储\n\
  \n# 执行更新\n\n现在你将实现`removePiece()`函数。这个函数的名字可能有些误导，因为它只在必要时才会移除棋子。将清单 25-9 中的代码添加到\
  \ Chess.js 脚本中，以实现`removePiece()`函数：\n\n**清单 25-9.** `removePiece()`的实现\n\n```javascript\n\
  function removePiece(endPos, oStart, startKey, pieceStore) {\n    var index = pieceStore.index(\"\
  piecePosition\");\n    index.getKey(endPos).onsuccess = function(e4) {\n       \
  \ var endKey = e4.target.result;\n        if (endKey) {\n            pieceStore.delete(endKey).onsuccess\
  \ = function(e5) {\n                movePiece(oStart, startKey, endPos, pieceStore)\n\
  \            }\n        } else\n            movePiece(oStart, startKey, endPos,\
  \ pieceStore);\n    }\n}\n```\n\n这段代码获取终点位置的键。如果那里有棋子，它会调用`delete()`方法将其移除，然后在`delete()`方法的`onsuccess`处理程序中调用`movePiece()`函数。\n\
  \n请注意，它并没有检索对象；执行删除操作只需要键。如果那里没有棋子，则直接调用`movePiece()`函数。调用`movePiece()`函数时，它会传入所需的全部数据，包括对象、对象键、终点位置以及将要使用的对象存储。\n\
  \n现在你将实现`movePiece()`函数，该函数将最终执行实际的更新操作。要更新对象，你需要调用`put()`方法。与之前添加棋子时使用的`add()`方法不同，`put()`方法同时需要对象和键。如果不存在具有指定键的对象，则会添加该对象。将清单\
  \ 25-10 所示的`movePiece()`方法添加到 Chess.js 脚本的末尾。\n\n**清单 25-10.** 实现`movePiece()`函数\n\
  \n```javascript\nfunction movePiece(oStart, startID, end, pieceStore) {\n    computeRowColumn(oStart,\
  \ end);\n```\n\n\n\n```javascript\nvar startUpdateReq = pieceStore.put(oStart, startID);\n\
  \nstartUpdateReq.onsuccess = function (event) {\n\nmoveNumber++;\n\ndrawBoard();\n\
  \ndrawAllPieces();\n\nif (moveNumber > 7) {\n\nclearInterval(timer);\n\nchessContext.font\
  \ = \"30pt Arial\";\n\nchessContext.fillStyle = \"black\";\n\nchessContext.fillText(\"\
  Checkmate!\", 200, 220);\n\n}\n\n}\n\n}\n```\n\n此代码首先使用之前创建的 `computeRowColumn()`\
  \ 函数计算行和列属性。然后更新对象。在 `onsuccess` 事件处理程序中，它递增 `moveNumber` 变量，并使用现有函数绘制棋盘和所有棋子。最后，如果是最后一步，则清除计时器，并在画布上绘制“将死！”文本。\n\
  \n#### 启动动画\n\n最后一步是启动计时器，以调用 `makeNextMove()` 函数。你将在 `open()` 调用的 `onsuccess` 事件处理程序中执行此操作。添加以粗体显示的代码：\n\
  \n```javascript\nvar request = dbEng.open(\"Chess\", 2);\n\nrequest.onsuccess =\
  \ function (event) {\n\ndb = event.target.result;\n\n// 添加棋子到棋盘\n\nresetBoard();\n\
  \n// 在初始位置绘制棋子\n\ndrawAllPieces();\n\n// 启动动画\n\ntimer = setInterval(makeNextMove,\
  \ 2000);\n\n}\n```\n\n保存更改并刷新浏览器。由于你更改了数据库版本，你应该会看到提示数据库正在配置的警报。经过一系列移动后，你应该会看到如图\
  \ 25-6 所示的完整棋盘。\n\n**图 25-6.** 完整的棋盘\n\n#### 追踪被吃掉的棋子\n\n当吃掉一个棋子时，你直接删除了该对象，这在棋子不需要显示时是有效的。但是，如果你希望应用程序追踪被吃掉的棋子，你可能希望将该对象保留在存储中。现在，我将展示如何更改代码，使其更新对象而不是删除它。我还将展示如何查询此存储以列出已被吃掉的棋子。\n\
  \n第一步是更改 `removePiece()` 函数。与其删除目标位置的棋子对象，不如更新它并设置 `killed` 属性。由于存在唯一索引，你还需要更改 `pos`\
  \ 属性。因为棋子不显示，所以位置可以是任意值。为了确保其唯一性，你可以在其唯一 ID 前加上前缀 `X`。此外，通过在前面加上 `X`，你将能够查询到它们，稍后我会解释。\n\
  \n注释掉 `delete()` 调用，并添加以粗体显示的代码：\n\n```javascript\nfunction removePiece(end, oStart,\
  \ startID, pieceStore) {\n\nvar index = pieceStore.index(\"piecePosition\");\n\n\
  index.getKey(end).onsuccess = function (e4) {\n\nvar endKey = e4.target.result;\n\
  \nif (endKey) {\n\n// pieceStore.delete (endKey).onsuccess = function (e5) {\n\n\
  // movePiece(oStart, startID, pieceStore);\n\n//}\n\nindex.get(endPos).onsuccess\
  \ = function (e5) {\n\nvar oEnd = e5.target.result;\n\noEnd.pos = 'x' + endKey;\n\
  \noEnd.killed = true;\n\npieceStore.put(oEnd, endKey).onsuccess = function (e6)\
  \ {\n\nmovePiece(oStart, startKey, endPos, pieceStore);\n\n}\n\n}\n\n}\n\nelse\n\
  \nmovePiece(oStart, startID, end, pieceStore);\n\n}\n\n}\n```\n\n现在，将清单 25-11 中所示的代码添加到\
  \ Chess.js 脚本中，以实现 `displayCapturedPieces()` 函数：\n\n**清单 25-11.** `displayCapturedPieces()`\
  \ 的实现\n\n```javascript\nfunction displayCapturedPieces() {\n\nvar xact = db.transaction([\"\
  piece\"]);\n\nvar textOut = \"\";\n\nvar pieceStore = xact.objectStore(\"piece\"\
  );\n\nvar index = pieceStore.index(\"piecePosition\");\n\nvar keyRange = IDBKeyRange.lowerBound(\"\
  x\");\n\nvar cursor = index.openCursor(keyRange);\n\ncursor.onsuccess = function\
  \ (event) {\n\nvar item = event.target.result;\n\nif (item) {\n\ntextOut += \" -\
  \ \" + item.value.color + \" \" +\n\nitem.value.type + \"\\r\\n\";\n\nitem.continue();\n\
  \n}\n\nelse if (textOut.length > 0)\n\nalert(\"以下棋子已被吃掉:\\r\\n\" + textOut);\n\n\
  }\n\n}\n```\n\n\n\n此代码使用单一的 piece 存储创建了一个只读事务。然后获取该存储及其`piecePosition`索引。它使用`x`作为下界定义了一个键范围。这将只返回以`x`或更大字符开头的对象。由于棋盘上的棋子位置以`a`到`h`开头，这些棋子将被排除在外。代码随后遍历游标，将棋子详情拼接成一个文本字符串。结果通过`alert()`函数显示。\n\
  \n![](img/index-504_1.jpg)\n\n## 第 25 章 ■ IndexedDB\n\n**注意** 请注意，键范围中的字符串比较是区分大小写的。如果你使用了大写的`x`，这将无法生效，因为小写的`a`位于大写的`x`之后。W3C\
  \ 规范提供了关于比较规则如何运作的详细信息。详情请参阅文章 [www.w3.org/TR/IndexedDB/#key-construct](http://www.w3.org/TR/IndexedDB/#key-construct)。\n\
  \n现在，你需要在动画完成后调用此函数。在`movePiece()`函数中显示“将杀！”文本后，添加以下代码行：\n\n```\ndisplayCapturedPieces();\n\
  ```\n\n保存修改并刷新浏览器。动画结束后，你应该会看到如图 25-7 所示的警告框。\n\n***图 25-7.** 列出已捕获的棋子*\n\n####\
  \ 总结\n\n在本章中，你速成学习了 IndexedDB。IndexedDB 能做的事情非常多。由于数据存储在客户端，你避免了与服务器的往返通信。通过一个相当简单的应用程序，你利用了这项新技术的大部分功能。最大的挑战可能是习惯异步处理。示例应用程序通过`onsuccess`事件处理器提供了大量嵌套连续调用的示例。以下是需要记住的一些关键概念：\n\
  \n- 创建数据库，并在数据库打开时通过响应`onupgradeneeded`事件处理器来创建其结构。如有必要，使用版本号来强制升级。\n- 存储中的对象必须有一个唯一的键，可以通过内联键的键路径或外联键的键生成器来定义。你也可以在添加对象时手动提供键。\n\
  - 所有数据访问（读取和写入）都必须通过事务对象完成。创建事务时，必须指定作用域，即它将使用的对象存储列表，以及所需的访问类型。\n- 你可以向一个对象存储添加一个或多个索引。每个索引将对象中的键路径映射到该对象的键。\n\
  - 使用游标来处理对象存储中的多个对象。可以通过指定键范围来过滤选中的对象。\n- 向对象存储添加对象，并在之后更新它。\n- 从对象存储中检索对象。\n- 通过指定对象的键，从对象存储中删除对象。\n\
  - 使用索引的`getKey()`方法获取对象的键。\n- 使用对象存储的`put()`方法来添加或更新对象。`put()`方法需要对象和键。如果指定的键不存在，则会添加该对象。\n\
  \n下一章将演示如何在网页中使用地理定位和地图功能。\n\n---\n\n## 第 26 章 ■ 地理定位与地图\n\n本章将演示两项技术，它们提供了强大的功能，使你能够轻松创建一些有用的网站。地理定位提供了一个标准化的\
  \ API，用于确定客户端的位置。地图技术增加了在地图上显示该位置以及其他兴趣点的能力。这两者共同构成了一个有许多实用应用的平台。\n\n在本章中，你将使用地理定位\
  \ API 来查找你当前的位置。该位置的精度会因可用硬件和环境的不同而有很大差异。然而，HTML5 定义了一个在所有设备上使用的标准 API，因此你可以提供与设备无关的解决方案。\n\
  \n仅知道经纬度坐标并不实用。为了利用这些数据，你将使用 Bing Maps API 在地图上显示该位置。然后，你可以标记更多的兴趣点，并查看它们与你当前位置的相对关系。\n\
  \n### 理解地理定位\n\n虽然严格来说并非 HTML5 规范的一部分，但 W3C 已定义了一个用于访问地理定位信息的标准 API，该 API 得到了所有主流浏览器当前版本的支持。然而，确定位置的技术因设备能力和客户端环境的不同而有很大差异。\n\
  \n#### 概览地理定位技术\n\n有几种技术可用于确定当前位置，包括以下内容：\n\n- **全球定位系统（GPS）：** GPS 与卫星通信，以极高的精度确定当前位置，尤其是在农村地区。城市中的高楼大厦会影响精度，但在大多数情况下，GPS\
  \ 能提供良好的结果。最大的限制是它在室内效果不佳。使用 GPS，设备必须配备特定的 GPS 硬件，但这在移动设备上已越来越常见。\n- **Wi-Fi 定位：**\
  \ Wi-Fi 网络覆盖范围相对较短，像 Skyhook Wireless 这样的系统维护着一个庞大的 Wi-Fi 网络及其位置数据库。只要连接到某个 Wi-Fi\
  \ 网络，就能对位置有相当准确的了解。然而，你通常可能处于多个网络的覆盖范围内，系统可以利用三角测量法以更高的精度确定位置。当然，这要求你的设备支持 Wi-Fi\
  \ 功能，并且在没有 Wi-Fi 网络的农村地区无法工作。\n- **手机基站三角测量：** 这使用了与 Wi-Fi 定位相同的原理，只是使用的是手机基站。但它的精度较低，因为基站覆盖范围大得多。由于所有手机都能与基站通信，这项技术应用广泛。\n\
  - **IP 地址段：** 每台连接到互联网的设备都有一个 IP 地址，通常由 ISP 提供。每个 ISP 都拥有一个可用的 IP 地址段，这些地址段通常按地理位置分配。因此，你连接到互联网时所使用的\
  \ IP 地址可以提供大致的位置信息，通常是一个大城市区域。然而，有几种因素（如 NAT 地址）可能导致不准确的结果。\n\n以上每种技术都有不同的硬件要求，并提供不同级别的精度。通过地理定位规范，你可以轻松地向浏览器请求当前位置，并让浏览器根据当前硬件和对外部来源（包括卫星、基站和\
  \ Wi-Fi 网络）的访问情况，确定提供该位置的最佳方式。\n\n#### 使用地理定位数据\n\n大多数人认为地理定位是一种提供逐向导航的设备，但这只是该技术的一种应用。当然，这需要只有通过\
  \ GPS 才能获得的精确位置。然而，即使当前的位置信息没那么精确，你的网站仍然可以利用这些信息创造价值。例如，即使位置仅由 IP 地址确定，这通常也足以设置默认语言。你可能需要允许最终用户覆盖此设置，但你的大多数受众将会看到以其母语显示的初始页面。\n\
  \n\n\n# 地理定位与地图绘制\n\n在检索当前位置时，地理定位服务也会返回估计精度。你的应用程序应据此决定提供哪些功能。例如，假设你正在为美国邮政服务创建一个网页，用于显示最近的邮局位置。如果当前位置的精度很高，网页可以显示地图，标示当前位置及附近的邮局。此外，它还可以提供前往每个邮局的预估驾车时间。\n\
  \n然而，如果位置精度较低，页面可以显示一张地图，展示该区域内邮局的分布位置。用户大概知道自己身处何处，并可根据这些信息确定最佳选择。但如果精度很差，页面应提示用户输入邮政编码，然后根据用户输入显示最近的邮局。因此，根据精度不同，应用程序可以优雅地降级功能。\n\
  \n### 使用地理定位 API\n\n为演示如何使用地理定位 API，你将创建一个简单的网页，调用该 API 来确定当前位置。最初，这些数据将以文本形式显示在网页上。稍后，你将在地图上显示该位置。\n\
  \n#### 创建 Web 项目\n\n首先，创建一个与前面章节项目结构相似的网页。\n\n**练习 26-1. 创建 Web 项目**\n\n1. 使用基本标记创建一个名为\
  \ `Geolocation.html` 的新网页：\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \    <meta charset=\"utf-8\" />\n    <title>第 26 章 - 地理定位</title>\n    <script src=\"\
  Geolocation.js\" defer></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n2. 然后使用以下代码创建一个\
  \ `Geolocation.js` 脚本文件：\n\n```javascript\n\"use strict\";\n```\n\n3. 在 `Geolocation.html`\
  \ 文件的空 `body` 元素中添加一个 `div` 元素，使用以下标记：\n\n```html\n<div>\n    <span id=\"lbl\">\
  \ </span>\n</div>\n```\n\n#### 使用地理定位对象\n\n地理定位 API 由 `geolocation` 对象提供，你可以通过 `navigator`\
  \ 对象访问它，如下所示：\n\n```javascript\nnavigator.geolocation\n```\n\n如果返回的是假值（如 `null`\
  \ 或 `undefined`），则说明当前浏览器不支持地理定位。你可以使用如下代码检查支持情况：\n\n```javascript\nif (!navigator.geolocation)\
  \ {\n    alert(\"地理定位不受支持\");\n} else {\n    // 使用地理定位执行某些操作\n}\n```\n\n要获取当前位置，请使用\
  \ `getCurrentPosition()` 函数，该函数接受三个参数：\n\n- 成功调用时执行的回调函数\n- 发生错误时调用的错误回调函数\n- 包含零个或多个选项的\
  \ `PositionOptions` 集合\n\n最后两个参数可以省略。支持以下选项：\n\n- `maximumAge`：浏览器可以缓存之前的位置并在不实际尝试定位的情况下返回该结果。但\
  \ `maximumAge` 属性指定了在不重新查询当前位置的情况下，先前位置可被重复使用的时间（以毫秒为单位）。\n- `timeout`：`timeout`\
  \ 属性指定了浏览器应等待 `geolocation` 对象响应的最长时间，同样以毫秒表示。\n- `enableHighAccuracy`：这只是一个对浏览器的提示。如果你特定目的不需要更高精度，将此设置为\
  \ `false` 可能会获得更快的响应或消耗更少的电量，这对移动设备来说是一个考虑因素。\n\n如果调用成功，位置信息将传递给指定的回调函数。`Position`\
  \ 对象包含一个 `coords` 对象，其中包含以下必需属性：\n\n- `latitude`（以度为单位指定）\n- `longitude`（以度为单位指定）\n\
  - `accuracy`（以米为单位指定）\n\n此外，根据环境和可用硬件，可能还会提供以下可选属性。如果不支持这些属性，它们将被设置为 `null`。（可选属性通常仅在启用\
  \ GPS 时可用）。\n\n\n\n- `altitude`（以米为单位）\n- `altitudeAccuracy`（以米为单位）\n- `heading`（以度为单位；正北为\
  \ 0，正西为 90，以此类推；静止时值为`NaN`）\n- `speed`（以米/秒为单位，静止时值为 0）\n\n这些属性可以通过回调函数获取，如下所示：\n\
  \n```javascript\nfunction successCallback(pos) {\n  var lat = pos.coords.latitude;\n\
  \  var long = pos.coords.longitude;\n  var accuracy = pos.coords.accuracy + \" meters\"\
  ;\n}\n```\n\n如果调用不成功，`PositionError` 对象将被传递给错误回调函数。该对象包含一个 `code` 属性和一个 `message`\
  \ 属性。错误码可能取三个值之一。\n\n- 1：`PERMISSION_DENIED`\n- 2：`POSITION_UNAVAILABLE`\n- 3：`TIMEOUT`\n\
  \n> **警告：** 你的应用会获取位置信息并直接显示（后续会将其绘制在地图上）。然而，你的脚本很容易将这些信息传回服务器，这是一个潜在的隐私问题。由于浏览器无法控制客户端如何利用这些信息，出于隐私考虑，浏览器可能会阻止对\
  \ `geolocation` 对象的访问。在这种情况下，会返回 `PERMISSION_DENIED` 错误码。我稍后会对此进行演示。\n\n### 第 26\
  \ 章 ■ 地理定位与地图\n\n如果客户端正在移动，并且你想持续监控当前位置，你可以通过 `setInterval()` 函数重复调用 `getCurrentLocation()`\
  \ 函数。为了简化这一过程，`geolocation` 对象包含一个 `watchPosition()` 函数。该函数与 `getCurrentLocation()`\
  \ 函数接收相同的三个参数（成功回调、错误回调和选项）。每当位置发生变化时，就会调用回调函数。`watchPosition()` 函数返回一个定时器句柄。当你想要停止监控位置时，可以将此句柄传递给\
  \ `clearWatch()` 函数，如下所示：`var handle = geolocation.watchPosition(callback);`\n\n\
  ```javascript\n...\ngeolocation.clearWatch(handle);\n```\n\n#### 显示位置\n\n现在，你将为你的应用添加代码，以获取当前位置并显示它。网页中有一个\
  \ `id` 为 `lbl` 的 `span` 元素。你将获取 `geolocation` 对象并调用其 `getCurrentLocation()` 函数。\n\
  \n成功回调函数和错误回调函数都会在 `span` 元素中显示相应的结果。\n\n**练习 26-2. 显示位置**\n\n1. 将以下代码添加到 `Geolocation.js`\
  \ 脚本中。\n\n```javascript\nvar lbl = document.getElementById(\"lbl\");\nvar latitude\
  \ = 0;\nvar longitude = 0;\n\nif (navigator.geolocation) {\n  navigator.geolocation\n\
  \    .getCurrentPosition(showLocation,\n      errorHandler,\n      {\n        maximumAge:\
  \ 100,\n        timeout: 6000,\n        enableHighAccuracy: true\n      });\n} else\
  \ {\n  alert(\"Geolocation not suported\");\n}\n\nfunction showLocation(pos) {\n\
  \  // 保存坐标供后续使用\n  latitude = pos.coords.latitude;\n  longitude = pos.coords.logitude;\n\
  \  lbl.innerHTML =\n    \"您的纬度：\" + pos.coords.latitude +\n    \"，经度：\" + pos.coords.longitude\
  \ +\n    \"（精确度：\" + pos.coords.accuracy + \" 米）\";\n}\n```\n\n![](img/index-511_1.jpg)\n\
  ![](img/index-511_2.png)\n![](img/index-511_3.jpg)\n\n2. 在浏览器中显示 `Geolocation.html`\
  \ 文件。当网站首次尝试访问 `geolocation` 对象时，你会看到一个类似图 26-1 所示的提示。\n\n***图 26-1.** 请求地理定位访问权限的提示*\n\
  \n> **注意：** 我在此演示中使用的是 Edge 浏览器。如果你使用不同的浏览器，此提示的行为可能略有不同。\n\n3. 要测试错误处理程序，请选择“否”选项。页面应显示一条错误消息，如图\
  \ 26-2 所示。\n\n***图 26-2.** 显示访问被拒绝的错误*\n\n\n\n4.  使用不同的浏览器打开`Geolocation.html`文件。您当前的定位应如图\
  \ 26-3 所示。\n\n***图 26-3.** 显示当前定位*\n\n**第 26 章 ■ 地理定位与地图绘制**\n\n我使用的是普通局域网连接的机器，没有蜂窝网络或\
  \ GPS 支持，因此它通过 IP 地址来确定位置。因此，定位精度估计为 1.8 公里（约 1 英里）。\n\n■ **注意** 地理定位功能在所有现代浏览器上均可使用。但是，如果你在较老的浏览器（如\
  \ IE 8）上尝试此应用，将会看到地理定位不受支持的警报。\n\n### 使用地图平台\n\n仅显示经纬度并不有趣（或实用）。然而，将你的位置与其他兴趣点相关联则更有用。在地图上显示这些信息，并辅以道路和其他参考点，才能真正发挥其价值。幸运的是，地图技术已变得非常先进且易于获取，实现这一点非常简单。\n\
  \n■ **注意** 为了本章的演示，我将使用必应地图。还有其他可用的地图平台。如果你感兴趣，可以查阅[`en.wikipedia.org/wiki/Comparison_of_web_map_services`](http://en.wikipedia.org/wiki/Comparison_of_web_map_services)上的文章，了解不同地图服务的概述。\n\
  \n#### 创建必应地图账户\n\n要使用必应地图，你首先需要设置一个账户，这对开发者来说是免费的。创建账户后，你将获得一个密钥，在访问地图 API 时需要包含此密钥。我将带你完成设置账户的流程。\n\
  \n**练习 26-3. 创建必应地图账户**\n\n1.  访问必应地图网站，地址为：[www.microsoft.com/maps/create-a-bing-maps-key.aspx](http://www.microsoft.com/maps/create-a-bing-maps-key.aspx)。\n\
  2.  你需要获取一个密钥来访问地图 API。转到“基础密钥”（Basic Key）选项卡。一个免费的、基础级别的密钥足以完成这些练习。点击页面底部的“获取基础密钥”（Get\
  \ the Basic Key）链接。\n3.  在下一页，你需要使用 Windows Live ID 登录。如果你没有，请点击“创建”（Create）按钮来创建一个账户。\n\
  4.  登录后，你应该会看到如图 26-4 所示的“创建账户”（Create account）页面。\n\n    ![](img/index-513_1.jpg)\n\
  \n    **第 26 章 ■ 地理定位与地图绘制**\n\n    ***图 26-4.** “创建账户”页面*\n\n5.  输入账户名称。这仅用于在你拥有多个账户时进行标识；输入“testing”即可。电子邮件地址应从你的\
  \ Windows Live 账户自动填入。确保选中复选框以同意使用条款。点击“保存”（Save）按钮创建账户。\n\n    ![](img/index-514_1.jpg)\n\
  \n    **第 26 章 ■ 地理定位与地图绘制**\n\n6.  从“我的账户”（My account）菜单中，选择“我的密钥”（My keys）链接。你可能还没有任何现有密钥，页面将显示“创建密钥”（Create\
  \ key）对话框。如果没有，请点击链接创建一个新密钥。\n7.  在“创建密钥”（Create key）页面，输入应用程序名称，例如`HTML5 test`。对于\
  \ URL，请输入**http://localhost**，并在应用程序类型中选择“通用 Windows 应用”（Universal Windows app），如图\
  \ 26-5 所示。点击“提交”（Submit）按钮。\n\n    ***图 26-5.** 创建密钥*\n\n    ■ **注意** 必应地图会监控你的密钥使用情况。但是，因为你并未实际将其部署到面向公众的网站，所以这一点实际上并不适用。如果你正在开发商业应用程序，可以出于开发目的使用免费密钥，但对于正式网站，你需要购买一个密钥。\n\
  \n8.  密钥生成后，它应该会显示在页面上。请保存此密钥，因为你稍后将用到它。\n\n#### 添加地图\n\n现在，你将向网页中添加地图。首先，在页面中添加一个`div`元素，该元素将包含地图。\n\
  \n你还需要添加一个对用于操作地图的脚本的引用。然后，你将显示地图，并将其中心点设置为你的当前位置。\n\n**第 26 章 ■ 地理定位与地图绘制**\n\n\
  **练习 26-4. 添加地图**\n\n1.  将以下粗体显示的代码添加到`body`元素中，这将添加用于显示地图的`div`。\n\n    ```html\n\
  \    <body>\n        <div>\n            <span id=\"lbl\"> </span>\n        </div>\n\
  \        <div id=\"map\">\n        </div>\n    </body>\n    ```\n\n2.  创建一个`Geolocation.css`样式表，并添加以下样式规则，该规则将设置包含地图的`div`的大小。\n\
  \n    ```css\n    #map {\n        width: 800px;\n        height: 1000px;\n     \
