- "# 第 25 章 ■ 索引数据库\n\n#### 配置棋子\n\n你将使用图像文件来表示国际象棋棋子。在将它们添加到画布之前，需要为每个棋子创建一个 `Image`\
  \ 对象，并指定其 `src` 属性。你还需要将这些对象放入一个数组中，以便更轻松地通过编程方式选择所需的图像。\n\n此外，你需要定义将加载到对象存储中的数据。`pieceTypes[]`\
  \ 数组定义了显示每个棋子所需的属性，例如高度和宽度。它还指定了 `images[]` 数组中黑子和白子图像对应的索引。`pieces[]` 数组包含上一章中使用的相同详细信息，例如行和列，并定义了\
  \ 32 个棋子的起始位置。\n\n将清单 25-2 中显示的代码添加到新的 `Data.js` 脚本文件中。此文件也包含在源代码下载中，因此你可以直接将其复制到你的\
  \ Web 项目中，而无需重新输入这些数据。\n\n**清单 25-2.** 定义静态数据\n\n```\n// 定义象棋棋子图像\nvar imgPawn =\
  \ new Image();\nvar imgRook = new Image();\nvar imgKnight = new Image();\nvar imgBishop\
  \ = new Image();\nvar imgQueen = new Image();\nvar imgKing = new Image();\nvar imgPawnW\
  \ = new Image();\nvar imgRookW = new Image();\nvar imgKnightW = new Image();\nvar\
  \ imgBishopW = new Image();\nvar imgQueenW = new Image();\nvar imgKingW = new Image();\n\
  \n// 指定每个图像的源文件\nimgPawn.src = \"images/pawn.png\";\nimgRook.src = \"images/rook.png\"\
  ;\nimgKnight.src = \"images/knight.png\";\nimgBishop.src = \"images/bishop.png\"\
  ;\nimgQueen.src = \"images/queen.png\";\nimgKing.src = \"images/king.png\";\nimgPawnW.src\
  \ = \"images/wpawn.png\";\nimgRookW.src = \"images/wrook.png\";\nimgKnightW.src\
  \ = \"images/wknight.png\";\nimgBishopW.src = \"images/wbishop.png\";\nimgQueenW.src\
  \ = \"images/wqueen.png\";\nimgKingW.src = \"images/wking.png\";\n\n// 定义 Image\
