  ### 第 1 章：超文本标记语言


  ## 链接元素


  `link` 元素用于引用额外的外部资源，这些资源可分为两类。第一类链接用于加载渲染源文档所需的资源——其中最常见的是层叠样式表。第二类是链接到其他相关文档。读者可以选择导航到这些文档，但它们并非渲染当前页面所必需的。


  `link` 元素使用自闭合标签，并且链接的资源完全通过属性来指定。这是通过定义资源地址的 `href` 属性和 `rel` 属性来完成的。`rel` 属性是
  **relationship**（关系）的缩写，指示源文档与链接资源之间的关系。


  以下是一些典型的 `link` 元素：


  ```html

  <link rel="stylesheet" type="text/css" href="Sample.css" />

  <link rel="icon" type="image/x-icon" href="HTMLBadge.ico" />

  <link rel="alternate" type="text/plain" href="TextPage.txt" />

  ```


  这将加载一个名为 `Sample.css` 的 CSS 文件和一个名为 `HTMLBadge.ico` 的图标文件。请注意，`type` 属性指示了文件的格式。对于样式表，这是可选的，因为默认类型为
  `text/css`。对于其他文件，例如图标文件，由于也可能使用 `.png` 或 `.bmp` 文件，因此需要指定该属性。最后一个链接引用的是该页面的纯文本版本。


  我将在下一章中解释样式表。图标文件会显示在浏览器标签页中，如图 1-3 所示。它也会在书签、收藏夹以及历史记录等其他地方使用。


  **图 1-3.** 在浏览器中显示指定的图标


  > **注意：** `link` 元素可用于因各种原因引用多种不同类型的资源。不幸的是，术语 *relationship*（关系）并不总能很好地传达此属性的含义。对于诸如
  `stylesheet` 和 `icon` 等一些最常见的值，将其解释为资源类型可能比关系更恰当。而对于像 `first`、`next` 和 `alternate`
  这样的值，关系 (relationship) 确实是合适的术语。然而，为了保持一致性，`rel` 属性被用于所有链接的资源。


  表格 1-1 和 1-2 列出了 `link` 元素中普遍支持的当前 `rel` 值。还有其他一些值已被弃用，但可能在短期内仍受支持。此外，截至撰写本文时，还有一些值已被提出但尚未被采纳。这里列出的值是你应该在新文档中使用的。这些值的官方规范可以在
  [`www.w3.org/TR/html5/links.html#linkTypes`](https://www.w3.org/TR/html5/links.html#linkTypes)
  找到。


  ---


  ### 第 1 章：超文本标记语言


  ### 表 1-1. 资源类型关系


  | Rel | 描述 |

  |-----|-------------|

  | `icon` | 如前所述，加载页面使用的图标。使用此关系时，支持 `sizes` 属性，以便使用所需的大小，因为图标文件通常包含多种尺寸。`type` 属性预期为图像文件类型，例如
  `"image/x-icon"` 或 `"image/png"`。 |

  | `prefetch` | 通知浏览器可能稍后需要该外部资源，并应尽可能提前加载。 |

  | `preload` | 告知浏览器当前文档将需要该相关资源，并应尽快加载。 |

  | `stylesheet` | 加载层叠样式表；`type` 属性可选，默认为 `text/css`。 |


  ### 表 1-2. 引用类型关系


  | Rel | 描述 |

  |-----|-------------|

  | `alternate` | 引用源文档的替代形式。这可以以不同方式使用，稍后将详细说明。 |

  | `author` | 引用提供源文档作者信息的资源。这通常是一个 `mailto` 引用，例如 `href=mailto://markc@thecreativepeople.com`，它将向作者发送电子邮件。也可以是一个包含作者详细信息的网页链接。
  |

  | `help` | 引用提供当前网页帮助信息的页面。 |

  | `next` | 用于引用系列中的下一个文档。 |

  | `license` | 指定指向提供许可详细信息的页面的链接。 |

  | `pingback` | 提供指向 pingback 服务的链接。这用于在另一个页面链接到该页面时通知该页面。这主要用于博客和社交媒体网站。有关此技术的更多详细信息，请参见
  [`www.w3.org/wiki/Pingback`](https://www.w3.org/wiki/Pingback)。 |

  | `prev` | 指向系列中前一个文档的链接。 |

  | `search` | 引用的文档可用于在当前文档或网站内进行搜索。 |


  > **注意：** `rel` 属性也可以用在锚点（`a`）元素和 `area` 元素中。这将在[第 7 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_7)中介绍。在这些元素中还可以使用其他在
  `link` 元素中不支持的 `rel` 值。这里列出的值仅在 `link` 元素中受支持。


  `alternate` 关系链接有多种使用方式，但它们都遵循链接到提供源文档替代形式的另一个资源这一基本概念。主要有两种类型的替代文档：


  * **类型** – 该链接以不同格式引用当前文档。使用 `type` 属性指定替代文档的类型，例如 `type="application/pdf"`。一个常见的用途是将文档作为订阅源（如
  ATOM）提供。在这种情况下，`type` 属性指定为 `type="application/atom+xml"`。

  * **语言** – 该链接引用当前文档翻译成另一种语言的版本。为此，使用 `hreflang` 属性指定引用文档的语言。例如，`hreflang="es"`。


  这两种变体可以组合在单个 `link` 元素中。例如，如果当前文档的法语版本以 PDF 文档形式提供，则使用 `type="application/pdf" hreflang="fr"`。


  `next` 和 `prev` 链接用于链接属于系列文档的一部分：例如，如果你有一篇文章分三部分发布。第一和第二部分应使用 `next` 关系提供指向下一部分的链接。同样，第二和第三部分应使用
  `prev` 关系提供指向前一部分的链接。在许多情况下，`previous` 关系仍然受支持，其作用与 `prev` 相同。一些较旧的值如 `first`、`last`
  和 `up` 现已过时。


  > **提示：** 正如我之前所说，`head` 元素中实际上没有实际内容，尽管可以说 `title` 元素可以算作内容。`head` 元素的目的是提供关于文档的元数据。`link`
  元素也是如此；将它们添加到 `head` 元素中不会在你的页面上生成用户可以导航的超链接。如果你想要一个实际的超链接，你需要在 `body` 中添加一个 `anchor`
  元素。


  提供 `link` 元素类似于在书中提供扉页；通常没有人会阅读它，但提供这些细节是一种良好的做法。在在线文档中这更为重要，因为搜索引擎依赖这些细节。




  '
- "# 样式元素\n\n`preload` 和 `prefetch` 这两种关联关系很相似。两者都是向浏览器提示应加载某个资源，以便在需要时可用。主要区别在于紧迫性。`preload`\
  \ 关系表示该资源应在整个页面渲染过程的早期加载。当前文档会用到它，因此指示浏览器尽快加载。\n\n相比之下，`prefetch` 用于那些可能稍后才会用到的资源，也许是在后续页面中。资源应当被加载，但不应拖慢当前页面的加载速度。\n\
  \n元素的特定样式属性（如 `color` 或 `size`）可以直接在元素上明确指定，这被称为内联样式。然而，更常见且更推荐的做法是定义一组规则，用于确定应用到整个文档的特定样式属性。下一章将描述这些规则如何实现。\n\
  \n这些规则要么包含在外部样式表中（并通过 `link` 元素引用），要么在 `style` 元素中定义。在这方面，`style` 元素与 `script` 元素有些相似，只是它包含的是\
  \ CSS 内容而非 JavaScript。\n\n> **提示** `style` 元素和 `script` 元素有一个重大区别。`script` 元素用于包含\
  \ JavaScript，既可以写在 `script` 元素的内容中，也可以通过 `src` 属性引用外部文件。而包含样式时，你使用 `style` 元素来定义样式；但加载外部文件则需使用\
  \ `link` 元素。另一个区别是，`link` 元素只能放在 `head` 元素内部；`style` 元素可以放在 `head` 或 `body` 元素中，尽管这一用法尚未得到广泛支持。\n\
  \n## 第 1 章 ■ 超文本标记语言\n\n一个非常简单的 `style` 元素可能看起来像这样：\n\n```html\n<style>\nhtml {\n\
  \  color: red;\n}\n</style>\n```\n\n这将把 `html` 元素内所有元素的 `color` 属性设置为 `red`，正如我所解释的，`html`\
  \ 元素是整个文档的根元素。这意味着文档中的所有内容都将变为 `red`（红色）。\n\n`style` 元素支持 `media` 属性，允许你包含一个 *媒体查询*。媒体查询是一个布尔表达式，可以有条件地应用一组样式。只有当表达式计算结果为\
  \ `true` 时，这些样式才会被应用。媒体查询最初是为了让同一文档在打印时能有不同的格式。例如，以下样式仅在打印文档时应用：\n\n```html\n<style\
  \ media=\"print\">\nhtml {\n  color: black;\n}\n</style>\n```\n\n然而，媒体查询已得到显著增强，使你能根据多种不同因素调整样式。其常见用途之一是创建响应式设计，即页面的格式和布局会根据屏幕分辨率自动调整。媒体查询将在[第\
  \ 9 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_9)中更详细地介绍。\n\n> **注意** 通常 `style`\
  \ 元素放在 `head` 元素中。唯一的例外是使用 `scoped` 属性时。`scoped` 属性表示样式仅应用于父元素及其所有后代元素。截至撰写本文时，`scoped`\
  \ 属性仅受 Firefox 浏览器支持。\n\n"
- '# 基础元素


  `base` 元素用于定义文档中所有其他引用应使用的基础 URL。这允许你在其他地方使用相对 URL。这可以节省一些输入，并且在需要更改基础地址时也很方便。`base`
  元素支持两个特定属性：`href`，用于定义基础 URL；以及 `target`，用于指定选择链接时的默认行为。


  一个 `base` 元素可能看起来像这样：


  ```html

  <base href="www.thecreativepeople.com/html5" target="_self" />

  ```




  '
- '# 注意

  `base` 元素应为 `head` 元素的第一个子元素，或至少位于任何 `link` 元素之前，以确保基础地址能应用于后续的 `link` 元素。


  ### 第 1 章：超文本标记语言


  如你所见，`base` 元素使用自闭合标签。将 `target` 属性设置为 `_self` 表示链接应在与当前页面相同的窗口和标签页中打开。这一行为可通过特定链接中设置不同的
  `target` 值来覆盖。`target` 属性支持的值如下：


  - `_blank` - 在新窗口或标签页中打开

  - `_self` - 在当前窗口或标签页中打开（若未指定 `target`，此为默认值）

  - `_parent` - 在父框架中打开

  - `_top` - 在最顶层框架中打开


  '
- "# 注意\nHTML5 不支持 `frameset` 和 `frame` 元素，因此除非你使用 `iframe`，否则 `_parent` 和 `_top`\
  \ 值不适用。关于浏览上下文的详细信息，请参阅规范 [`www.w3.org/TR/html5/browsers.html#windows`](https://www.w3.org/TR/html5/browsers.html#windows)。\n\
  \n### 摘要\n\n在本章中，我讲解了创建 HTML 文档（常被称为标记）的基本语法。同时，我还介绍了可包含在 `head` 元素中的细节内容。本书第 2\
  \ 节将描述可用于文档实际内容的元素。\n\n下一章将介绍层叠样式表（CSS）以及如何为标记添加样式。\n\n将样式与内容分离有助于构建更易维护的网页。\n\n\
  在本书第 2 节的学习过程中，每章都将基于前一章创建的网页进行构建。本章的重点是 `head` 元素。列表 1-2 展示了基于本章内容生成的示例网页。\n\n\
  ***列表 1-2.*** 示例 HTML 文档\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\" manifest=\"\
  sample.appcache\">\n<head>\n  <meta charset=\"utf-8\" />\n  <meta name=\"author\"\
  \ content=\"Mark J Collins\" />\n  <meta name=\"description\" content=\"Sample HTML\
  \ document\" />\n  <title>HTML5 Sample</title>\n  <link rel=\"icon\" type=\"image/x-icon\"\
  \ href=\"HTMLBadge.ico\" />\n  <link rel=\"alternate\" type=\"application/pdf\"\
  \ href=\"MainPage.pdf\" />\n  <link rel=\"author\" href=\"mailto:markc@thecreativepeople.com\"\
  \ />\n  <link rel=\"author\" type=\"text/html\" href=\"http://www.thecreativepeople.com\"\
  \ />\n  <style>\n    html {\n      color: red;\n    }\n  </style>\n  <style media=\"\
  print\">\n    html {\n      color: black;\n    }\n  </style>\n</head>\n<body>\n\
  \  <h1>Hello World!</h1>\n</body>\n</html>\n```\n\n正如预期，生成的网页（如图 1-4 所示）内容极少，但标题和图标会显示在浏览器标签页中。\n\
  \n***图 1-4.** 第 1 章的最终网页*\n\n包含图标文件在内的完整解决方案可在源代码下载中找到。下一章，我们将用外部样式表替换 `style` 元素。\n\
  \n### 第 2 章：层叠样式表\n\n本章我将介绍 HTML 开发的第二部分：层叠样式表。在创建 HTML 文档时，将实际内容与样式规则分离始终是一个好习惯。原因有以下几点。\n\
  \n- **关注点分离** - 这通常是一种合乎逻辑的职责（和技能）划分：作者擅长文字工作，而平面设计师则懂得如何运用字体、颜色和布局使文章在视觉上更具吸引力。这并非说一个人不能同时做好两件事，但你通常会发现一个人更擅长其中一项。\n\
  - **一致性** - 在不同内容上应用一套标准样式，通常能带来更一致的外观与体验。\n- **可复用性** - 只需对相同内容应用不同样式，便可在多个网站上重复使用同一篇文章。\n\
  - **可维护性** - 内容往往更加稳定，而样式则常来常去。你可以为网页换上新外观，而无需更新实际内容。\n\n#### 样式指南\n\n那么，如何实现这种与内容独立定义的丰富样式呢？解决方案包含两个部分。首先，要有组织良好且经过恰当注释的内容，以提供上下文信息。然后，你需要定义一组规则，规定如何将适当的样式属性应用于所需元素集合。\n\
  \n#### 组织内容\n\n尽管内容中不应包含显式的格式化，但标识需要特殊处理的文本是恰当且可取的。例如，需要强调的单词或短语应放在 `em` 元素中。同样，当你想要对某事做出强烈强调时，应将其放入\
  \ `strong` 元素，如下所示：\n\n```html\n<p>这件<em>需要</em>被强调，不要<strong>忘记</strong>它！</p>\n\
  ```\n\n你可能已经知道，`em` 元素的默认样式是使字体变为斜体，而 `strong` 元素通常为粗体。然而，这里的关键点在于，使用 `em` 元素并非因为你想要文本变成斜体；相反，你是在指示该文本需要强调。样式表的创建者将决定如何实现这种强调。他们可能选择使用不同的字体或颜色，而非斜体。\n\
  \n© Mark J. Collins 2017  \nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and\
  \ Multimedia*, DOI 10.1007/978-1-4842-2463-2_2\n\n**提示** 请记住，你的样式表可能并非唯一读取内容的东西。屏幕阅读器（如盲文输出设备或文本转语音软件）可能会解读你的\
  \ `em` 和 `strong` 元素。\n\n希望这能让你深刻理解：内容中提供的上下文信息，其用途可能远超我们当前的想象。\n\n另一个要点是，`em` 和\
  \ `strong` 这类元素应当一致使用。我将在第 4-9 章介绍所有可用的语义元素。你应该了解每个元素的用途及使用时机。最终，在 `em` 和 `strong`\
  \ 之间做出抉择将归结为判断力的考量。你需要制定一些指南，以便每个人都清楚何时使用哪个元素合适。\n\n#### 应用样式\n\n一旦有了格式良好且注释充分的内容，你就可以应用所需的样式。样式表由一组*规则*组成。规则有时也被称为*规则集*或*规则块*。一条规则包含一个*选择器*（用于定义应用该规则的元素集合）以及一个或多个*声明*。每个声明设置单一属性的值。规则的一般形式如下：\n\
  \n```\n选择器 { 声明; 声明; ...}\n```\n\n声明包含一个属性和值，用冒号分隔，例如 `color:red`，将元素的 `color` 属性设置为红色。规则的各部分如图\
  \ 2-1 所示；选择器为 `p`，选中所有段落元素，声明设置了 `font-size` 和 `color` 属性。\n\n***图 2-1.** CSS 规则的组成部分*\n\
  \n与 HTML 一样，CSS 中会忽略空格，因此通常写成如下形式：\n\n```css\np {\n  font-size:10px;\n  color:red;\n\
  }\n```\n\n关于这些规则的“最佳”格式化方式存在一些争论，没有绝对的对错。不过，我将遵循这种风格，因为它似乎最为普遍。\n\n与 HTML 不同，CSS\
  \ 本身并非层次结构，因此规则不会通过缩进来显示与其他规则的关系。\n\n\n\n"
- "# CSS 核心概念与规范\n\n#### CSS3 规范\n\n与 HTML 类似，CSS 的能力由一套不断演进的规范定义。当前已发布的推荐标准是 CSS\
  \ 2.1，下一版草案被称为 `CSS3`。然而，`CSS3` 已被拆分为超过 50 个“模块”，每个模块都有独立的规范。截至本文撰写时，其中一些模块已成为 W3C\
  \ 官方推荐标准（`REC`）；但许多仍处于提案推荐标准（`PR`）或候选推荐标准（`CR`）状态。W3C 鼓励使用这些规范中的任何一个。还有相当多的模块处于工作草案（`WD`）状态，尚未准备好广泛采用。\n\
  \n> **提示**：由于每个 CSS 模块的状态都在不断变化，要了解每个模块的完整最新状态，请参阅 [www.w3.org/Style/CSS/current-work](http://www.w3.org/Style/CSS/current-work)\
  \ 上的文章。\n\n所以，实际的 `CSS3`“规范”目前还是一个移动的目标，浏览器对这些规范的支持也会有所不同。不过，已经有许多很酷的功能可以普遍使用了，我将在第[9-15\
  \ 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_9)中演示它们。\n\n**提示**：这是一份多年前由 Natalie\
  \ Downe 制作的演示文稿，其中包含许多编写优秀 CSS 的建议（[`clearleft.s3.amazonaws.com/2008/cssSystems_notes_small.pdf`](http://clearleft.s3.amazonaws.com/2008/cssSystems_notes_small.pdf)）。虽然有些内容略显过时，但大部分在今天仍然非常适用。我建议你快速浏览一下，它相当容易阅读。但最重要的是，我希望她对\
  \ CSS 的热忱能感染你。编写优秀的软件既是科学也是艺术。我可以教你科学……但艺术不是那么容易学会的。\n\n---\n\n#### CSS 概念\n\n在本章的剩余部分，我将介绍样式表工作的基本概念。在第[9](http://dx.doi.org/10.1007/978-1-4842-2463-2_9)章到第[15](http://dx.doi.org/10.1007/978-1-4842-2463-2_15)章，我会更详细地介绍每个概念。\n\
  \n#### 选择器\n\n选择器非常强大，尤其是在 `CSS3` 中有了许多改进，但掌握它们可能需要一些努力。我将在这里简要解释它们，然后在第[9 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_9)中详细介绍。最常见的选择器之一是**元素选择器**。在其最简单的形式中，你指定声明应该应用到的元素类型。例如：\n\
  \n```css\nem {\n  font-style: italic;\n}\n\nstrong {\n  font-weight: bold;\n}\n\
  ```\n\n使用这条规则，所有在强调元素中的内容将使用斜体字体。同样，所有在 `strong` 元素中的内容将使用粗体字体。正如我之前提到的，这些是这些元素的默认样式。浏览器有自己的内部样式表来定义这些默认样式。因此，即使你不提供任何样式规则，内容也会使用默认规则以合理的方式呈现。\n\
  \n选择器通常具有级联性，因此 `body` 选择器会选择所有 `body` 元素以及所有位于 `body` 元素内部的元素。选择器还可以以各种方式组合。例如，逗号分隔符用作逻辑或运算符。因此，`h1,\
  \ h2, h3` 会选择所有位于 `h1` 元素、`h2` 元素或 `h3` 元素内部的元素。同样，空格分隔符是逻辑与运算符。所以 `h1 p` 会选择所有位于\
  \ `h1` 元素且同时位于 `p` 元素内部的元素。\n\n#### 声明\n\n选择器决定规则应用于哪些元素，而声明则指定应用于这些选中元素的样式属性。在许多情况下，每个声明设置单个属性的值。名称和值由冒号分隔，声明以分号结束，例如：`color:red;`。你可以设置的样式属性似乎无穷无尽，我将在第[10\
  \ 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_10)到第[15 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_15)中演示它们。\n\
  \nCSS 支持快捷方式，允许你在单个声明中指定多个属性。`margin` 属性就是一个很好的例子。`margin` 属性指定元素与其相邻元素之间的空间量。上方、下方、左侧和右侧的空间可以独立指定。要将它们全部设置为\
  \ 5 像素，可以使用以下声明：\n\n```css\nmargin-top: 5px;\nmargin-right: 5px;\nmargin-bottom:\
  \ 5px;\nmargin-left: 5px;\n```\n\nCSS 还允许你在一个简短的声明中设置所有四个值：\n\n```css\nmargin: 5px\
  \ 5px 5px 5px;\n```\n\n声明中的四个值分别指定上、右、下、左的边距值。\n\n> **提示**：这里的值顺序很重要，因为值不是通过名称而是通过顺序来确定的。为了帮助记住正确的顺序，想一下时钟。一天从午夜（上方）开始，然后顺时针继续到\
  \ 3 点（右侧），然后到 6 点（下方），最后到 9 点（左侧）。\n\n不过，这个快捷方式还可以进一步缩短。如果未提供右侧值，它将设置为与左侧边距相同的值。同样，下方边距将使用与上方边距相同的值。所以也可以这样设置：\n\
  \n```css\nmargin: 5px 5px;\n```\n\n这里只指定了上方和右侧的值；下方设置为与上方相同的值，左侧设置为与右侧相同的值。最后，由于所有值都相同，你也可以使用最简单的快捷方式：\n\
  \n```css\nmargin: 5px;\n```\n\n---\n\n#### 单位\n\n在我之前的示例中，我使用了一些任意单位来设置字体大小、颜色和边距。让我们看看最常用的可用单位。\n\
  \n### 距离单位\n\n距离单位（有时称为长度或大小）在许多声明中使用，并支持多种类型。基本的绝对单位包括英寸（`in`）、厘米（`cm`）、毫米（`mm`）和四分之一毫米（`q`）。\n\
  \n这些单位无需过多解释，大家都知道英寸和厘米是什么。然而，它们在排版领域的“近亲”——派卡（`pc`）、点（`pt`）和像素（`px`）——似乎更为普遍。1\
  \ 英寸等于 6 派卡、72 点或 96 像素。\n\n> **警告**：单位像素（`px`）并不等同于设备像素，除非你的设备分辨率恰好是 96 dpi（每英寸点数）。为了避免混淆，W3C\
  \ 文档中将其称为“视觉角度单位”。然而，这个单位仍然普遍被称为像素。它的定义是 1/96 英寸；请注意，实际的设备像素数可能不同。\n\n使用这些绝对单位的一个基本缺点是，它们很少与现实世界的尺寸相关。一个屏幕上的实际尺寸与另一个屏幕可能差别很大，这取决于设备分辨率。绝对单位在打印时更有用，因为物理尺寸能更准确地呈现。对于正常的屏幕显示，推荐使用相对单位。有两种类型的相对尺寸：字体相对和视口相对。\n\
  \n\n\n"
- '# 字体相对单位


  字体相对单位是相对于字体大小而言的，通常指当前字体的尺寸。这些单位包括字体大小（`em`）、字符高度（`ex`）、零宽度（`ch`）和根字体大小（`rem`）。术语“em”来源于排版领域，曾用于表示大写字母“M”的宽度。如今，字体大小被定义为字体的高度，包括其上下的空间。`em`
  单位等同于字体大小。例如，如果字体大小是 `12px`，那么 `1em = 12px`。


  **提示：** `&emsp;` 字符会创建一个宽度为 `1em` 的空格。同样，`&mdash;` 字符会创建一个长度为 `1em` 的破折号（连字符）。有趣的是，`&ensp;`
  字符会创建一个宽度为 `1/2em` 的空格。


  `ex` 单位定义为小写字母“x”的高度。类似地，`ch` 单位定义为数字“0”的宽度。当特定字体不包含“x”或“0”字符时，会使用一些特殊规则。如果无法用其他方式定义
  `ex` 或 `ch` 单位，则会使用 `1/2em` 的值。


  `em`、`ex` 和 `ch` 单位都基于当前字体定义。在一个典型的 HTML 文档中，会使用不同的字体大小，而字体相对单位会根据当前使用的字体相应地进行调整。例如，在
  `h1` 元素中，`em` 的值通常大于段落（`p`）元素。相比之下，`rem` 单位基于根元素的字体大小，正如我在前一章所述，根元素通常是 `html` 元素。因此，`rem`
  单位在整个文档中的值始终相同。所以，如果你希望元素大小基于当前字体，请使用 `em`（或 `ex`、`ch`）；但如果希望大小保持不变，请使用 `rem`。


  '
- '# 视口相对单位


  视口相对单位包括视口宽度（`vw`）、视口高度（`vh`）、视口最小值（`vmin`）和视口最大值（`vmax`）。这些单位表示适用视口尺寸的 `1%`。例如，如果设备（或浏览器窗口）的视口宽
  `600` 像素、高 `400` 像素，那么 `1vw = 6px`，`1vh = 4px`。`vmin` 单位基于视口的最小尺寸，在这种情况下为 `400`
  像素，所以 `1vmin = 4px`。这与视口的方向无关。类似地，`vmax` 基于最大尺寸，所以 `1vmax = 6px`。


  **提示：** 虽然严格来说不算“单位”，但距离尺寸也可以指定为百分比，例如 `width: 20%;`。按此方式定义时，宽度表示为包含元素的百分比。相比之下，`vw`
  和 `vh` 是相对于初始包含块的百分比，初始包含块即整个窗口的尺寸。


  '
- '# 颜色单位


  颜色属性由红、绿、蓝各分量的值定义。标准形式是将每个分量指定为从 `0` 到 `xFF` 的十六进制值。颜色由六位数字定义，其中前两位定义红色分量，中间两位定义绿色分量，最后两位定义蓝色分量。以此方式指定时，十六进制数前面需加上井号（`#`）。例如，黑色定义为
  `#000000`，白色定义为 `#FFFFFF`。


  有几种替代方式可指定颜色属性。第一种是每个分量仅使用一位数字。例如，白色可定义为 `#FFF`。按此格式表达时，两位数字形式通过复制一位数字得到。因此 `#567`
  会转换为 `#556677`。


  对于偏好以十进制值输入的用户，可以使用 `rgb()` 函数。`rgb()` 函数接受三个参数，即红、绿、蓝分量，以 `0` 到 `255` 之间的十进制值表示。（`255`
  是 `xFF` 的十进制等效值。）使用此格式，白色指定为 `rgb(255,255,255)`。为了更简便，还可以指定最大值的百分比。按此方法，白色定义为 `rgb(100%,100%,100%)`。


  **提示：** 还有一个 `rgba()` 函数，它包含第四个参数 alpha，用于指定不透明度。alpha 的值可以在 `0` 到 `1` 之间。值为 `1`
  表示完全不透明，值为 `0` 表示完全透明。


  有十六个关键字可以定义特定的颜色值，例如 `red`、`blue` 和 `black`。你可以使用其中一个关键字，而无需指定 RGB 值。这些关键字以及它们各自的
  RGB 等效值列在附录 C 的参考资料中。此外，CSS3 定义了许多扩展颜色关键字，这些关键字得到了许多浏览器的支持。你可以在 [`www.w3.org/TR/css3-color/#svg-color`](https://www.w3.org/TR/css3-color/)
  找到完整列表。


  使用 RGB 定义颜色始于第一代彩色阴极射线管（CRT）的引入。CRT 能够显示三种颜色：红色、绿色和蓝色。屏幕上的每个点或像素都可以独立调节这三种颜色的强度。因此，使用
  RGB 术语是基于现有硬件能力的结果。虽然我们最终可能需要用 RGB 值来渲染特定颜色，但使用色相、饱和度和亮度（HSL）是一种更直观的颜色表达方式。


  色相以角度表示。想象一个色轮，红色在 `0°`，绿色在 `120°`，蓝色在 `240°`。介于之间的颜色是相邻颜色的相对混合。饱和度表示颜色的强度，以百分比表示，`100%`
  为完全饱和，`0%` 为灰色。亮度也以百分比表示，`100%` 为白色，`0%` 为黑色。典型值为 `50%`。随着亮度增加，颜色会变淡并开始呈现白色。随着亮度降低，颜色变暗，最终变为黑色。


  要使用色相、饱和度和亮度定义颜色，请使用 `hsl()` 函数。纯红色可表示为 `hsl(0,100%,50%)`。第一个参数默认以度为单位，因此无需添加单位。你还可以使用
  `hsla()` 函数，它包含用于指定不透明度的 alpha 参数。


  **注意：** W3C 关于单位的规范可在 [`www.w3.org/TR/css3-values`](https://www.w3.org/TR/css3-values)
  找到。关于颜色单位的更多详情，请参见 [`www.w3.org/TR/css3-color`](https://www.w3.org/TR/css3-color)。


  '
- "# 关键字\n\n在大多数样式声明中，有少数关键字可以作为“单位”使用。它们是 `auto`、`inherit`、`initial`、`revert` 和 `unset`。\n\
  \n- `inherit` — `inherit` 关键字表示该属性应使用其父元素的值。大多数属性默认会继承，因此将值设置为 `inherit` 实际上不会改变任何内容；它无论如何都会继承父元素的值。添加它可能有助于更好地表达作者的意图。你可能想创建一条规则，使用\
  \ `inherit` 来覆盖另一条规则的值。\n\n- `initial` — `initial` 关键字用于将属性重置为初始默认设置。在许多情况下，这指的是浏览器的默认值。例如，默认颜色通常是黑色，因此\
  \ `color: initial;` 会将颜色设置为黑色。截至撰写本文时，任何版本的 Internet Explorer 均不支持此关键字。\n\n- `auto`\
  \ — `auto` 值有点棘手，其行为会因使用位置而异。例如，设置 `padding: auto;` 会自动调整左右内边距以将内容居中。设置 `height:\
  \ auto;` 会使得高度自动增长以适配内部内容。\n\n- `revert` — `revert` 关键字指定浏览器应忽略任何作者样式，并使用浏览器的默认值。截至撰写本文时，许多浏览器尚不支持此关键字。\n\
  \n- `unset` — `unset` 关键字是 `inherit` 和 `initial` 的组合。基本上，它对所有可继承属性表现得像 `inherit`，对其余属性表现得像\
  \ `initial`。\n\n\n\n`properties`。与 `revert` 一样，`unset` 关键字不受某些浏览器支持。\n\n#### 优先级\n\
  \n选择器返回元素集合，这些集合可能重叠。结果是多个规则可以应用于同一元素。如果一个规则设置字体大小，另一个设置颜色，第三个设置背景，则没有冲突。然而，如果一个规则将颜色设为红色，另一个设为绿色，会发生什么？这时就需要应用优先级规则。\n\
  \n#### 样式表来源\n\n首先，样式表有三种来源：\n\n- **作者**：这些是 Web 开发者创建的样式表，通常提到样式表时指的就是它。\n- **用户**：用户也可以创建样式，专门用于控制网页在自己浏览器上的显示方式。\n\
  - **用户代理**：用户代理（Web 浏览器）拥有默认样式表。例如，如果你创建了一个没有样式规则的文档，浏览器会使用默认的字体系列和大小显示内容。这些实际上是在浏览器特定的样式表中定义的。\n\
  \n渲染页面时，浏览器必须处理来自所有这些来源的样式，以确定每个元素的适当样式。当规则冲突时，作者样式表优先级高于用户样式表，用户样式表优先级高于用户代理样式（浏览器默认值）。\n\
  \n> **提示**：你可能会发现查看默认浏览器样式表很有用。它们通常是可以获取的，尽管你可能需要做一些搜索才能找到。例如，你可以使用这个链接查看 Chrome\
  \ 使用的样式表：[`trac.webkit.org/browser/trunk/Source/WebCore/css/html.css`](http://trac.webkit.org/browser/trunk/Source/WebCore/css/html.css)\n\
  \n## 特指度规则\n\n此外，即使在作者样式表内部，也可能存在冲突的声明。例如，一个样式表可能包含以下内容：\n\n```css\np {\n  color:\
  \ black;\n}\n\nheader p {\n  color: red;\n}\n```\n\n`header` 元素内的 `p` 元素被两个规则同时选中，那么哪一个会生效？在这种情况下，适用特指度规则，该规则规定使用更具体的选择器，也就是\
  \ `header p` 选择器。\n\n由于存在多种选择器，确定哪个更具体并不像你想象的那么简单。`ID` 选择器被认为比类或属性选择器更具体，而类或属性选择器又比元素选择器更具体。\n\
  \n当应用特指度规则逻辑时，浏览器会分析每个选择器，并根据使用的选择器类型为其打分。这个分数由四个值组成：\n\n1.  内联样式的数量（包含 `style`\
  \ 属性的元素）\n2.  `ID` 选择器的数量\n3.  类、属性或伪类选择器的数量\n4.  元素选择器的数量\n\n分析会比较第一个值，只有在平局时才会继续比较下一个值。因此，如果一个选择器包含\
  \ `ID` 选择器而另一个没有，则无需进一步分析。包含 `ID` 选择器的获胜。最后，如果所有四个值都相同，则采用最后出现的规则来打破平局。\n\n> **提示**：理解这些优先级规则很重要，因为冲突会发生，你需要知道如何处理它们。不过，你应该规划好你的样式表以避免冲突。\n\
  \n## `!important` 关键字\n\n一个“王牌”是 `!important` 关键字。如果在样式规则中使用它，它将覆盖所有其他规则。你可以这样添加\
  \ `!important` 关键字：\n\n```css\np {\n  color: red !important;\n}\n```\n\n请记住，`!important`\
  \ 关键字应用于声明，而不是规则。它仅适用于单个声明，并且必须在你希望应用它的每个声明上重复使用。\n\n如果两个冲突的规则都使用了 `!important`\
  \ 关键字，则优先级将根据我前面提到的规则确定。然而，当涉及到样式表的来源时，它们的应用顺序是相反的。用户样式表中的 `!important` 规则会覆盖作者样式表中的\
  \ `!important` 规则。\n\n这有一个重要的应用（并非双关语）。这允许用户覆盖作者对某些属性的样式。例如，视障人士可能需要增大字体大小。`!important`\
  \ 标签将确保此样式不会被覆盖。\n\n> **警告**：你可能想使用 `!important` 关键字来快速修复并覆盖层叠的样式规则。考虑到我刚才描述的所有优先级规则，你不应该需要这样做。我建议将其作为最后的手段。过度使用\
  \ `!important` 关键字会使你的样式表难以维护。\n\n#### 盒模型\n\n文档中的每个元素都占据一定的空间，这取决于该元素的内容。此外，诸如内边距和外边距等因素也会影响这一点。内边距是内容与元素边框之间的空间。外边距是边框与相邻元素之间的空间。如图\
  \ 2-2 所示。\n\n![图 2-2](img/index-51_1.png)\n\n***图 2-2.** 盒模型*\n\n我之前解释过 `margin`\
  \ 属性。同样，你可以使用 `padding` 声明来指定内边距。内边距和外边距非常相似；主要区别在于内边距位于边框内部。\n\n在确定使用的空间时，请记住包括边框宽度。例如，如果内边距设置为\
  \ `10px`，外边距设置为 `5px`，并且 `border-width` 设置为 `3px`，则（除了实际元素内容之外）使用的空间为 `(2 * 10)\
  \ + (2 * 5) + (2 * 3) = 36px`。\n\n### 厂商前缀\n\n哦，走在技术前沿的乐趣！与 HTML5 的其他领域一样，浏览器厂商对\
  \ CSS 规范的支持程度各不相同。然而，在许多情况下，这些厂商会在新属性成为官方推荐标准之前就实现它们。事实上，CSS3 规范中的许多内容已经可以在一个或多个浏览器中使用了。\n\
  \n当浏览器厂商添加不属于 CSS3 推荐标准的新特性时，该属性会被赋予一个特定于厂商的前缀，以表明这是一个非标准特性。如果这成为推荐标准的一部分，前缀最终会被移除。为了利用一些较新的属性，你可能需要使用特定于厂商的属性，并且由于你希望页面能在所有厂商的浏览器上工作，你需要添加所有这些属性。例如，要指定边框圆角，除了标准的\
  \ `border-radius` 属性外，你可能还需要像这样设置所有特定于厂商的属性：\n\n```css\nheader {\n  -moz-border-radius:\
  \ 25px;\n  -webkit-border-radius: 25px;\n  -ms-border-radius: 25px;\n  border-radius:\
  \ 25px;\n}\n```\n\n表 2-1 列出了最常见的厂商前缀。还有其他一些，但此表涵盖了绝大多数浏览器。\n\n***表 2-1.** 厂商前缀*\n\
  \n| 前缀 | 浏览器厂商 |\n| :--- | :--- |\n| `-moz-` | Firefox |\n| `-webkit-` | Chrome,\
  \ Safari, Opera |\n| `-ms-` | Internet Explorer |\n\n你不能盲目地假设所有带厂商前缀的属性都与标准属性具有相同的名称（只是加上前缀），尽管大多数情况确实如此。这里有一篇好文章列出了许多特定于厂商的属性：[`peter.sh/experiments/vendor-prefixed-css-property-overview`](http://peter.sh/experiments/vendor-prefixed-css-property-overview)\n\
  \n\n[overview](http://peter.sh/experiments/vendor-prefixed-css-property-overview)。遗憾的是，这个页面已经有一段时间没有更新，可能已经过时了。如果你发现某个标准属性在特定浏览器中不工作，你可能需要做些研究，看看他们的开发者网站上是否有可用的带前缀属性。例如，通过这个链接查看\
  \ Webkit 扩展: [`developer.mozilla.org/en-US/docs/Web/CSS/Reference/Webkit_Extensions.`](https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Webkit_Extensions)\n\
  \n> **警告**: 你应该始终将标准属性放在最后，这样它才能覆盖特定于供应商的版本。\n\n某些浏览器会同时支持两者，虽然大多数情况下实现方式相同，但有时特定于供应商的版本行为会有所不同。\n\
  \n#### 样式属性\n\n`style` 属性不属于样式表的一部分，但它的目的类似，因此我将在此进行解释。`style` 属性是所有元素都支持的全局属性之一。它允许你在单个元素上设置一个或多个声明。虽然普通样式规则包含一个选择器，用于确定该规则应用于哪些元素，但由于\
  \ `style` 属性直接包含在元素中，因此不需要选择器。使用 `style` 属性被称为**内联样式**。一个使用内联样式的示例元素可能看起来像这样:\n\n\
  ```html\n<p style=\"font-size: 1.5rem; color: hsla(175, 80%, 60%, .8);\">\nHello\
  \ World!\n</p>\n```\n\n> **提示**: 在上面的示例中，我使用了之前解释过的 `rem` 单位，因此字体将比根字体大小大 50%。颜色由色相\
  \ 175°（介于绿色和蓝色之间）、饱和度 80%、明度 60% 和透明度 80% 定义。\n\n与其他属性一样，其值在双引号内指定。该值由一个或多个声明组成。这些声明的格式与样式表中的声明完全相同：一个名称/值对，用冒号分隔，并以分号结束。你可以在\
  \ `style` 属性中设置任何在外部样式表中可以设置的属性。\n\n> **警告**: 我把`style` 属性留到最后才讲，是希望你永远不要使用它。通过包含内联样式，你就不再分离内容和样式了。如果你后来决定蓝绿色字体不好看，仅仅通过修改\
  \ CSS 是无法修复的。请记住，内联样式的优先级高于任何基于 CSS 的规则。\n\n#### 总结\n\n在本章中，我解释了创建样式表时使用的一些基本概念。我们将通过创建几个可以包含在网页中的外部样式表来应用这些概念。\n\
  \n首先，我们将从一个非常简单的样式表开始，如清单 2-1 所示。这个文件名为 `Initial.css`。\n\n***清单 2-1.**`Initial.css`\
  \ 文件*\n\n```css\n/* Make sure the non-content elements are hidden */\nhead, title,\
  \ meta, script, link, style, base {\n    display: none;\n}\n\n/* Default styling\
  \ for emphasis and strong elements */\nem {\n    font-style: italic;\n}\n\nstrong\
  \ {\n    font-weight: bold;\n}\n\n/* Style the text */\nbody>h1 {\n    font-size:\
  \ 1.5rem;\n    color: hsla(175, 80%, 60%, .8);\n}\n```\n\n第一条规则确保你在第 [1 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_1)学到的非内容元素不会被显示。浏览器的默认样式表无论如何都会设置这些。第二条规则设置了我之前讨论过的\
  \ `强调` 和 `重要` 元素的属性。再次强调，这些是默认样式。最后一条规则使用我在本章中解释的 `rem` 和 `hsla` 单位设置了文本的字体大小和颜色。\n\
  \n接下来，我们将创建第二个用于打印模式的 CSS 文件。这个文件如清单 2-2 所示，命名为 `Print.css`。\n\n***清单 2-2.**`Print.css`\
  \ 文件*\n\n```css\nbody>h1 {\n    color: black;\n}\n\nbody {\n    border: 1px solid;\n\
  \    border-color: black;\n    border-radius: 25px;\n    padding: 24px;\n}\n```\n\
  \n这包含两条规则：第一条将颜色设置为黑色，第二条为整个文档添加边框。\n\n最后，修改 `MainPage.html` 文件，用下面的 `link` 元素替换两个\
  \ `style` 元素。这将引用新的 CSS 文件，而不是在 HTML 文档中指定样式规则。\n\n```html\n<link rel=\"stylesheet\"\
  \ href=\"Initial.css\" />\n<link rel=\"stylesheet\" href=\"Print.css\" media=\"\
  print\" />\n```\n\n`Initial.css` 在引用时没有使用媒体属性，因此它将同时应用于屏幕和打印模式。`Print.css` 文件将仅在打印模式下使用。请注意，两个文件都使用了\
  \ `body>h1` 选择器，由于它们完全相同，因此具有相同的特异性。这依赖于后定义的规则会覆盖前一条规则的行为。\n\n`Initial.css` 文件包含一个\
  \ `font-size` 声明，而 `Print.css` 文件没有，因此 `font-size` 将同时应用于屏幕和打印模式。只有 `color` 属性在打印模式下被覆盖。\n\
  \n现在显示网页，你应该会看到“Hello World!”文本以蓝绿色字体显示。然后从浏览器中打印文档。根据你使用的浏览器，输出应该类似于图 2-3 所示。\n\
  \n***图 2-3.** HTML 文档的打印版本*\n\n注意标题（在 `title` 元素中指定）显示在页面顶部。\n\n> **注意**: 每个浏览器处理打印模式的方式不同。有些左对齐标题，有些在页面顶部放置\
  \ URL，有些包含页码，有些显示打印日期。\n\n下一章将介绍本书的第三个主要领域：JavaScript。本章将解释 JavaScript 语言的概念，这是第\
  \ 4 和第 5 部分所讨论主题的基础。\n\n### 第 3 章：JavaScript 基础\n\n在本章中，我将解释 HTML5 开发的第三大支柱：JavaScript。在第\
  \ [16](http://dx.doi.org/10.1007/978-1-4842-2463-2_16) 章至第 [20](http://dx.doi.org/10.1007/978-1-4842-2463-2_20)\
  \ 章中，我将演示你可以使用 JavaScript 在 HTML5 网页中做的许多事情。但本章中，我必须首先解释这门语言本身。\n\n## JavaScript\
  \ 介绍\n\n这里内容很多，因为 JavaScript 语言非常强大。起初可能会觉得有些别扭，特别是对于那些具有 C++ 或 C# 等编译语言背景的人来说。但这并不难学；我将在这里解释这些基本概念，然后你将在后面的章节中应用它们。\n\
  \n#### 对象\n\nJavaScript 中的主要构建块是*对象*。对象是元素的集合；每个元素可以是*属性*或*方法*。属性保存单个数据值，而方法将执行某个定义为函数的操作。另一种说法是，属性只是一个在对象上定义的变量（注意\
  \ `var` 关键字）。同样，方法是一个在对象上定义的函数。\n\n创建对象最简单的方法是通过一组名称/值对来指定成员，如下所示：\n\n```javascript\n\
  var myObject = {\n    color: \"Red\",\n    count: 5\n};\n```\n\n> **注意**: 你可能熟悉使用\
  \ JavaScript 对象表示法 (JSON) 格式化数据。这正是这种表示法，也是 JSON 的来源。\n\n你也可以使用这种表示法定义方法，如下所示：\n\
  \n```javascript\nvar myObject = {\n    color: \"Red\",\n    count: 5,\n    log:\
  \ function () {\n        console.log(\"Quantity: \" + this.count + \", Color: \"\
  \ + this.color);\n    }\n};\n```\n\n以这种方式创建对象有时被称为*对象字面量*表示法。名为 `myObject` 的对象包含两个属性，`color`\
  \ 和 `count`，以及一个函数 `log()`。然后你可以使用点表示法访问这些属性和函数，如下所示：\n\n```javascript\nwindow.alert(myObject.color);\n\
  myObject.log();\n```\n\n\n"
- "# 提示\n\n本段代码演示了两种流行的调试方法。在 `window` 对象上调用 `alert()` 函数会显示一个模态对话框，其中包含传递给该函数的文本。在\
  \ `console` 对象上调用 `log()` 函数会将指定的文本写入浏览器控制台，你可以通过浏览器提供的开发者工具访问该控制台。请注意，`window`\
  \ 和 `console` 是包含属性和函数的对象。它们将在第 [16 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_16)和[第\
  \ 17 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_17)中详细解释。\n\n另一种创建对象的方法是使用对象构造函数。这需要使用\
  \ `new` 关键字并调用默认构造函数。以下代码将创建完全相同的对象：\n\n```\nvar redObject = new Object();\nredObject.color\
  \ = \"Red\";\nredObject.count = 5;\nredObject.log = function() {\n    console.log(\"\
  Quantity: \" + this.count + \", Color: \" + this.color);\n}\n```\n\n如果你需要一个主要用于存储数据的简单对象，JSON\
  \ 风格可能稍微更直观、更简洁。然而，对于面向函数的对象，构造函数风格提供了更强大的功能，我稍后将对此进行说明。\n\n例如，如果你需要第二个实例来计算你的绿色物品，只需像这样重复代码：\n\
  \n```\nvar greenObject = new Object();\ngreenObject.color = \"Green\";\ngreenObject.count\
  \ = 7;\ngreenObject.log = function() {\n    console.log(\"Quantity: \" + this.count\
  \ + \", Color: \" + this.color);\n}\n```\n\n然后，你可以在代码中使用这两个对象，例如：\n\n```\nif (greenObject.count\
  \ > redObject.count) {\n    console.log(\"You have more green items than red item\"\
  );\n}\n```\n\n#### 构造函数\n\n请注意，你必须在两个对象中都定义 `log()` 方法。如果你熟悉基于类的语言（如 C#），这可能会显得有些奇怪。类被用作模板，从中创建该类的每个实例。当你使用类来创建对象时，所有属性和方法的定义都会从类中复制过来。\n\
  \n然而，JavaScript 不使用类。相反，你可以通过创建一个构造函数来重用对象定义。在前面的示例中，你使用了通用构造函数 `Object()`，它创建了一个空对象。但你可以像这样定义一个自定义构造函数：\n\
  \n```\nfunction Item(){\n    this.color = undefined;\n    this.count = 0;\n    this.log\
  \ = function() {\n        console.log(\"Quantity: \" + this.count + \", Color: \"\
  \ + this.color);\n    };\n}\n```\n\n构造函数是用于实例化对象的函数。这个构造函数创建了一个名为 `color` 的属性，但未定义其值。它还创建了一个名为\
  \ `count` 的属性，并将其初始化为零。`log()` 方法也被定义，并使用这两个属性。现在，你可以通过调用 `Item()` 构造函数，使用这个原型来创建一个对象：\n\
  \n```\nvar redObject = new Item();\nredObject.color = \"Red\";\nredObject.count\
  \ = 5;\n```\n\n你需要为该实例设置属性值，但无需设置方法。然后你可以像之前创建的其他对象一样使用它。将此代码添加到脚本中，会将 `color` 和\
  \ `count` 属性写入控制台，就像之前一样：\n\n```\nredObject.log();\n```\n\n像任何其他函数一样，构造函数可以接受参数，这通常用于初始化属性。例如，你可以重写构造函数，使其接受一个\
  \ `color` 和一个 `count` 参数：\n\n```\nfunction Item(color, count){\n    this.color =\
  \ color;\n    this.count = count;\n    this.log = function () {\n        console.log(\"\
  Quantity: \" + this.count + \", Color: \" + this.color);\n    };\n}\n```\n\n然后像这样创建\
  \ `greenObject` 变量：\n\n```\nvar greenObject = new Item(\"Green\", 7);\n```\n\n你不能拥有多个同名的构造函数。例如，你不能同时定义一个\
  \ `Item()` 构造函数和一个 `Item(color, count)` 构造函数。如果这样做，第二个定义将替换第一个定义。\n\n然而，参数是可选的，因此你可以定义一个接受两个参数的构造函数，但调用它时可以不传参。如果你打算这样使用它，构造函数应该处理未定义的参数，例如像这样提供默认值：\n\
  \n```\nfunction Item(color, count){\n    this.color = color;\n    this.count = count;\n\
  \    // 处理缺失的参数\n    if (color == undefined){this.color = \"Black\";}\n    if (count\
  \ == undefined){this.count = 0;}\n    this.log = function () {\n        console.log(\"\
  Quantity: \" + this.count + \", Color: \" + this.color);\n    };\n}\n```\n\n####\
  \ 原型\n\n所有对象都有一个原型。原型是一个模型或蓝图，实际对象从中实例化出来。\n\n如果你需要额外的属性怎么办？你可以像这样向现有对象添加一个属性：\n\
  \n```\ngreenObject.isAvailable = true;\n```\n\n这将仅向 `greenObject` 添加 `isAvailable`\
  \ 属性；但是，如果你将其添加到 `Item` 原型中，那么新属性将对所有实例可用。你可以通过访问构造函数上的 `prototype` 属性来修改原型：\n\n\
  ```\nItem.prototype.isAvailable = true;\n```\n\n这会在原型上定义新属性并将其初始化为 `true`。现在，所有通过\
  \ `Item()` 构造函数创建的对象都将拥有 `isAvailable` 属性：\n\n```\nvar blueObject = new Item(\"\
  Blue\", 3);\nif (blueObject.isAvailable){\n    console.log(\"The blue object is\
  \ available\");\n}\n```\n\n你可以以相同的方式向原型添加方法：\n\n```\nItem.prototype.add = function(n){this.count\
  \ += n;};\n```\n\n#### 继承\n\n让我们深入探讨一下。考虑以下 JavaScript 代码：\n\n```\nvar blueObject\
  \ = new Item(\"Blue\", 3);\nconsole.log(blueObject);\n```\n\n这将使用 `Item()` 构造函数创建一个\
  \ `blueObject`，并将结果输出到控制台。在展开部分条目后，控制台窗口将类似于 图 3-1。\n\n![图 3-1](img/index-59_1.jpg)\n\
  \n***图 3-1.** 在控制台窗口中显示对象*\n\n`color` 和 `count` 属性的值被显示出来，并且 `log()` 方法也如预期列出。\n\
  \n注意 `__proto__` 属性，它被定义为 `Object` 类型。这就是原型属性。如果展开它，你会看到 `isAvailable` 属性和 `add()`\
  \ 方法，以及 `Item()` 构造函数。\n\n> **提示** 你可以通过像 `o.newProperty = 5;` 这样简单定义来向对象添加属性和方法。你也可以通过在构造函数原型上定义它们来向原型添加，例如\
  \ `Item.prototype.newProperty = 5;`。向对象添加仅影响该对象，但向原型添加则使新属性对所有使用该构造函数的对象可用。\n\n\
  正如我在本章开头所述，对象是属性和/或方法的集合。这些被称为其*自身*成员。术语*自身*表示这些成员直接由对象拥有，而非继承而来。每个对象也有一个原型，它本身也是一个对象，并拥有自己的成员。\n\
  \n当从对象访问一个成员（例如 `o.someProperty`）时，JavaScript 会首先在 `o` 对象自身的成员集合中查找 `someProperty`。如果在那里找不到，搜索将会在对象的原型中进行。\n\
  \n#### 使用原型\n\nJavaScript 通过一种称为*原型继承*的方法支持继承。这意味着一个原型本身作为一个对象，也会有一个 `prototype`\
  \ 属性。当然，这个原型也可以有自己的原型，以此类推。这被称为*原型链*。\n\n注意，`Item` 原型中还有另一个列为成员的 `__proto__` 属性。这是所有对象都派生自的\
  \ `Object` 原型。如果你在控制台窗口中展开它，会发现许多方法列表，例如你之前用过的 `Object()` 构造函数和 `toString()` 方法。但它没有\
  \ `__proto__` 属性；这是原型链的终点。\n\n\n\n### Tip\n在某些浏览器（如 IE）中，`Object` 原型的 `__proto__`\
  \ 属性会显示为 `null` 值。这实际上更准确：所有对象都有一个 `prototype` 属性，但如果没有进一步的继承，该属性将为 `null`。\n\n\
  ## 第 3 章 JavaScript 要点\n\n了解了这点后，你可以通过简单地将 `prototype` 属性赋值为父类构造函数来建立继承关系。假设你希望创建一个新对象\
  \ `SpecialItem`，使其继承自 `Item`。创建 `SpecialItem()` 构造函数：\n\n```javascript\nfunction\
  \ SpecialItem(name) {\n  this.name = name;\n  this.describe = function() {\n   \
  \ console.log(this.name + \": color=\" + this.color);\n  };\n}\n```\n\n这会创建一个由构造函数初始化的\
  \ `name` 属性，同时创建一个 `describe()` 方法，用于将名称和颜色属性输出到控制台。要设置继承关系，按如下方式设置 `prototype`\
  \ 属性：\n\n```javascript\n// 使用原型继承建立继承关系\nSpecialItem.prototype = new Item();\n```\n\
  \n由于构造函数中未指定 `color` 和 `count` 属性，因此使用了默认值。你可以通过在 `SpecialItem()` 构造函数中添加 `color`\
  \ 和 `count` 参数，并将其传递给 `Item()` 构造函数来解决这个问题。修改 `SpecialItem()` 构造函数，添加加粗部分的代码：\n\n\
  ```javascript\nfunction SpecialItem(name, color, count) {\n  Item.call(this, color,\
  \ count);\n  this.name = name;\n  this.describe = function() {\n    console.log(this.name\
  \ + \": color=\" + this.color);\n  };\n}\n```\n\n这里使用了父对象的 `call()` 方法，我将在本章后面解释。使用\
  \ `SpecialItem()` 构造函数创建对象后，你可以同时访问 `log()` 方法和 `describe()` 方法。要验证这一点，添加以下代码：\n\
  \n```javascript\nvar special = new SpecialItem(\"Widget\", \"Purple\", 4);\nspecial.log();\n\
  special.describe();\nconsole.log(special);\n```\n\n控制台窗口将类似于图 3-2。\n\n![图 3-2](img/index-61_1.png)\n\
  \n**图 3-2.** 测试 `specialItem()` 构造函数\n\n### 使用 `create` 方法\n\n还有一种实现继承的技术，称为*经典继承*。它使用\
  \ `Object.create()` 函数来建立父对象和子对象之间的关系。\n\n要使用这种方法，你需要使用 `create()` 方法定义子对象的 `prototype`。例如，用以下代码替换之前设置\
  \ `SpecialItem.prototype` 的语句：\n\n```javascript\n// 使用经典继承建立继承关系\nSpecialItem.prototype\
  \ = Object.create(Item.prototype);\nSpecialItem.prototype.constructor = SpecialItem;\n\
  ```\n\n你可以使用与之前相同的代码测试 `SpecialItem()` 的新实现：\n\n```javascript\nvar special = new\
  \ SpecialItem(\"Widget\", \"Purple\", 4);\nspecial.log();\nspecial.describe();\n\
  console.log(special);\n```\n\n新对象的功能与之前相同，但元素的继承方式不同。注意，大多数属性和方法都显示在子类中，而不是父类原型中，如图\
  \ 3-3 所示。\n\n![图 3-3](img/index-62_1.png)\n\n**图 3-3.** 使用经典继承的 `SpecialItem` 对象\n\
  \n### 使用 `class` 关键字\n\nECMAScript 6 引入了一些新关键字，使 JavaScript 中的继承对于熟悉基于类的继承的开发者来说更易用。这些关键字包括\
  \ `class`、`constructor`、`extends` 和 `super`。此方法底层实现与之前使用 `Object.create()` 方法的方式完全相同。它使用了一些新关键字和微小的语法变化，但实现了相同的功能。\n\
  \n#### 注意\n虽然浏览器支持正在迅速增长，但并非所有浏览器都支持 ECMAScript 6 的所有功能。以下链接展示了当前可用的功能：http://kangax.github.io/compat-table/es6\n\
  \n`Item()` 和 `SpecialItem()` 函数的完整实现见列表 3-1。\n\n**列表 3-1.** 演示 `class` 关键字\n\n\n\
  ```javascript\nclass Item {\n\n  constructor(color, count) {\n\n    this.color =\
  \ color;\n\n    this.count = count;\n\n    this.log = function () {\n\n      console.log(\"\
  数量: \" + this.count + \", 颜色: \" + this.color);\n\n    };\n\n  }\n\n}\n\nclass SpecialItem\
  \ extends Item {\n\n  constructor(name, color, count) {\n\n    super(color, count);\n\
  \n    this.name = name;\n\n    this.describe = function () {\n\n      console.log(this.name\
  \ + \": 颜色=\" + this.color);\n\n    }\n\n  }\n\n};\n```\n\n为确保每种方法之间的解决方案等效，请添加以下代码来定义\
  \ `isAvailable` 和 `add()` 成员。这与之前使用的代码完全相同。\n\n```javascript\nItem.prototype.isAvailable\
  \ = true;\n\nItem.prototype.add = function(n){this.count += n;};\n```\n\n虽然这段代码使用了新的\
  \ `class` 关键字，但它定义的构造函数与之前创建的相同。`extends` 关键字定义了父构造函数的名称，而 `super` 关键字则替代了调用父构造函数的\
  \ `Item.call(this);` 语句。\n\n要测试这一点，请使用与之前相同的调用。运行后，控制台窗口将显示与图 3-3 完全相同的内容。\n\n```javascript\n\
  var special = new SpecialItem(\"小部件\", \"紫色\", 4);\n\nspecial.log();\n\nspecial.describe();\n\
  \nconsole.log(special);\n```\n\n**警告** 当调用继承的方法时，`this` 的值将指向被调用的对象，不一定是定义该方法的对象。在前面的示例中，调用\
  \ `special.log()` 时，`this` 指向 `SpecialItem` 对象，即使 `log()` 方法是在 `Item()` 构造函数上定义的。当子类重写其父类的任何成员时，请务必牢记这一点。\n\
  \n## 重写成员\n\n无论使用哪种语法实现继承，处理重写成员的方式都是相同的。如前所述，每个对象都有一组成员，这些成员称为自有属性（或成员）。允许自有成员与继承对象中的成员同名，对此没有任何限制。\n\
  \n当访问属性或调用方法时，JavaScript 首先会查找具有指定名称的自有成员。如果未找到，则会沿着原型链向上查找。对于方法而言，其工作方式很可能与你预期的一致。如果子对象中定义了该方法，则会使用子对象的实现；否则，将调用父对象的方法。\n\
  \n对于属性，如果父对象和子对象中存在同名的属性，则会有两个独立的实例，各自拥有不同的值。具体使用哪一个取决于作用域，这一点我将在后面解释。\n\n#### 属性\n\
  \n我之前对属性的概念一带而过，是因为我想先重点介绍对象、原型和继承。现在让我稍微回顾一下，更详细地解释属性。\n\n正如你所见，属性可以是简单数据类型（字符串、数字和布尔值）之一。你无需显式声明数据类型；相反，JavaScript\
  \ 会根据赋给它的值来推断数据类型。随着新值的赋值，数据类型可能会发生变化。例如：\n\n```javascript\nvar test = \"某个字符串\"\
  ;\n\ntest = 5;\n\ntest = true;\n```\n\n这段代码首先创建了一个字符串，然后将其更改为数字，最后更改为布尔值。要验证数据类型确实发生了变化，可以运行以下代码：\n\
  \n```javascript\nvar test = \"某个字符串\";\n\nconsole.log(test + ': ' + isNaN(test));\n\
  \ntest = 5;\n\nconsole.log(test + ': ' + isNaN(test));\n```\n\n如果传入的值不是数字数据类型，`isNaN()`\
  \ 函数将返回 `true`。如果运行这段代码，你会在控制台中看到类似下面的内容：\n\n```\n某个字符串: true\n\n5: false\n```\n\
  \n#### 数组\n\nJavaScript 中的数组就是属性的集合。数组本身有一个名称，可以是对象的成员，也可以是一个变量。数组中的项目通过数字索引进行访问。数组使用字面量表示法创建，例如：\n\
  \n```javascript\nvar colors = [\"红色\", \"绿色\", \"蓝色\", \"黄色\", \"紫色\", \"橙色\"];\n\
  ```\n\n你还可以创建一个空数组，并使用 `push()` 方法向其中添加项目：\n\n```javascript\nvar colors = [];\n\n\
  colors.push(\"红色\");\n\ncolors.push(\"绿色\");\n```\n\n\n"
- "# JavaScript 基础\n\n要访问数组中的某个元素，需要指定它的索引。例如，`colors[0]` 将返回字符串 `\"red\"`。\n\n`length`\
  \ 属性表示数组中有多少个元素。由于索引是从 0 开始的，因此 `length` 属性总是指向最后一个元素之后的位置。所以你也可以通过以下方式在数组末尾添加元素：\n\
  \n```js\ncolors[colors.length] = \"blue\";\n```\n\n**提示：** 数组中的元素通过从 0 开始的数字索引来访问。数组不支持命名索引（或键）。如果你需要通过名称访问某个项，应将其创建为命名属性或变量，而不是数组元素。\n\
  \n一个数组可以包含不同类型的元素。在同一个数组中包含数字、字符串和对象引用是完全允许的。根据你使用数组的方式，这在逻辑上可能并不正确，但 JavaScript\
  \ 并不会阻止你这样做。\n\n你可以使用 `for` 循环遍历数组中的元素：\n\n```js\nfor (var i=0; i < colors.length;\
  \ i++) {\n  console.log(colors[i]);\n}\n```\n\n#### 属性\n\n所有属性都有一组可被读取和更新的特性（attribute）。这些特性如下：\n\
  \n- `value` — 属性的值；这是默认属性。\n- `writable` — 如果属性可以被更新，则设置为 `true`。\n- `enumerable`\
  \ — 如果枚举对象成员时应包含此属性，则设置为 `true`。\n- `configurable` — 如果属性可以被删除，并且其特性可以被修改，则设置为 `true`。\n\
  \n你可以使用 `getOwnPropertyDescriptor()` 方法来访问*属性描述符*。属性描述符是一组命名值，用于指定这些特性的值。例如，考虑以下代码：\n\
  \n```js\nfunction Item(color, count) {\n  this.color = color;\n  this.count = count;\n\
  }\n\nvar redObject = new Item(\"Red\", 5);\nconsole.log(Object.getOwnPropertyDescriptor(redObject,\
  \ \"color\"));\n```\n\n这将输出 `redObject` 的 `color` 属性的特性。控制台会显示如下内容：`Object {value:\
  \ \"Red\", writable: true, enumerable: true, configurable: true}`\n\n`getOwnPropertyDescriptor()`\
  \ 方法接收两个参数：第一个参数是包含该属性的对象；第二个参数是属性的名称。它返回一个属性描述符。\n\n你可以使用 `Object.defineProperty()`\
  \ 方法更新这些特性。该方法的头两个参数分别是一个对象和一个属性名称，与 `getOwnPropertyDescriptor()` 方法类似。然后，你传入一个属性描述符作为第三个参数。你只需要指定想要更改的值。例如，如果你希望\
  \ `color` 属性为只读，可以这样调用：\n\n```js\nObject.defineProperty(redObject, \"color\", {\
  \ writable: false });\n```\n\n你也可以使用 `defineProperty()` 方法创建新属性，这样你就可以在属性首次创建时设置这些特性。如果你传入一个不存在的属性名称，则会创建一个新属性。以下代码在\
  \ `Item()` 构造函数中添加了 `size` 属性：\n\n```js\nfunction Item(color, count) {\n  this.color\
  \ = color;\n  this.count = count;\n  Object.defineProperty(this, \"size\",\n   \
  \ {value: 7, writable: true, enumerable: false, configurable: true});\n}\n```\n\n\
  你还可以通过调用属性的 `propertyIsEnumerable()` 方法来确定它是否可枚举。\n\n#### 特殊类型\n\n除了三种简单类型之外，还有两种特殊的数据类型：`null`\
  \ 和 `undefined`。`null` 数据类型通常用于属性是一个对象引用，但该对象尚未创建（或引用尚未设置）的情况。你可以使用 `null` 关键字将属性设置为\
  \ `null`（`test = null;`）。\n\n`undefined` 数据类型表示该值尚未被定义。考虑以下代码：\n\n```js\nvar x =\
  \ null;\nvar y;\n\nconsole.log(typeof x);\nconsole.log(typeof y);\n```\n\n变量 `x`\
  \ 已被设置为 `null`，`typeof` 运算符将返回 `\"object\"`。相比之下，变量 `y` 未被定义，`typeof` 运算符将返回 `\"\
  undefined\"`。\n\n你可以使用数字作为属性名称；但是，你需要像访问数组索引一样使用方括号来访问该属性。例如：\n\n```js\nvar myEnum\
  \ = {1: \"Red\", 2: \"Green\", 3: \"Blue\"};\nconsole.log(myEnum[2]);\n```\n\n####\
  \ 其他主题\n\nJavaScript 有一些特殊的行为，或者至少对 JavaScript 新手来说不太容易理解。以下我将简要介绍它们。\n\n#### 比较运算符\n\
  \nJavaScript 支持典型的比较运算符，例如小于、大于等。我不打算详细说明，因为它们大多不言自明。如果你想进一步探索，Mozilla 有一篇关于这个主题的好文章（<https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/Comparison_Operators>）。\n\
  \n不过，有一个地方我需要详细说明。JavaScript 区分等同性（equivalence）和相等性（equality）。例如，数字 `12` 和字符串 `\"\
  12\"` 被视为等同，但并不相等。在这里，等同性意味着如果两个对象被转换为相同的数据类型，它们将具有相同的值。相等性则意味着两个对象具有相同的类型和值。这有时被称为*严格相等*。\n\
  \n标准运算符，如等于（`==`）、小于（`<`）、大于或等于（`>=`），使用的是等同性概念。为了测试严格相等性，JavaScript 提供了 `===` 和\
  \ `!==` 运算符。例如，`a === b` 将使用严格相等性比较对象 `a` 和 `b`。同样，你可以使用 `!==` 来测试不严格相等。\n\n**提示：**\
  \ 我使用“等同性”和“相等性”这两个术语，因为它们能更准确地描述这些概念。然而，你经常会看到用“相等性”来指代等同性，而用“严格相等性”来表示相等性。`===`\
  \ 和 `!==` 运算符是 JavaScript 中相对较新的补充。在此之前，所有的比较运算符都是基于等同性的，我们使用等于运算符（`==`）并称之为等于。现在我们有了一个真正表示相等的运算符（`===`）。\n\
  \n#### 变量作用域\n\n变量的*作用域*决定了它可以在何处被访问。如果变量在函数体外部声明，它将具有*全局作用域*，这简单意味着所有函数都可以访问它。此外，单个实例由所有函数共享；如果一个函数修改了它的值，那么在它被使用的任何地方，它都会具有这个新值。并且，该变量在浏览器关闭之前一直可用。\n\
  \n在函数内部声明的变量被视为具有*局部作用域*。该变量仅对函数内部的代码可用。一旦函数返回，该变量就不再可用。每次调用函数时，都会创建该变量的一个新实例，因此调用之间不会共享值。函数参数始终具有局部作用域。\n\
  \n最后一种作用域类型是*块级作用域*，它将变量的访问限制在其被声明的*块*内。一个块由围绕它的花括号 `{}` 定义，例如在 `if` 或 `for` 语句中。块级作用域是\
  \ JavaScript 中相对较新的功能（在 ECMAScript 第 6 版中引入）。由于 JavaScript 最初不支持块级作用域，例如在 `if` 语句中声明的变量，整个函数都可以访问。如果\
  \ JavaScript 突然开始强制执行块级作用域，现有的应用程序将会失败。\n\n相反，块级作用域是通过使用 `let` 关键字而不是 `var` 来选择性地应用的。考虑以下函数定义：\n\
  \n```js\nfunction testScope() {\n  var localScope = 5;\n  if (localScope > 3) {\n\
  \    var localScope2 = 7;\n    let blockScope = 4;\n  }\n}\n```\n\n\n```markdown\n\
  \n`console.log(localScope2 + blockScope);` // 输出 11\n\n}\n\n`console.log(localScope2);`\
  \ // 输出 7\n\n`console.log(blockScope);` // 这将失败\n\n}\n\n`testScope();`\n\n`localScope`\
  \ 变量是使用传统的 `var` 关键字声明的，它在 `if` 块外部是可用的。然而，`blockScope` 变量是使用 `let` 关键字声明的，它在 `if`\
  \ 块外部不可用。无论如何，在 `testScope()` 函数外部，局部作用域或块作用域的变量都是不可访问的。\n\n变量作用域中一个棘手的问题是多个变量使用了相同的名称声明。\n\
  \n这不会产生错误，但你可能无法得到预期的结果。例如，请看以下代码：\n\n`var x = 1;` // 全局作用域\n\n```\nfunction testX(x1){\n\
  \    var x = 2; // 局部作用域\n    console.log(\"传入的原始 x 值: \" + x1);\n    console.log(\"\
  局部作用域的 x: \" + x);\n}\n\ntestX(x);\nconsole.log(\"全局作用域的 x: \" + x);\n```\n\n一个名为\
  \ `x` 的变量在全局作用域和局部作用域中都被创建了。它们实际上是两个不同的对象，各自拥有自己的值。全局作用域对象的值被传入函数，并在函数内作为参数 `x1`\
  \ 可用。\n\n函数声明了一个名为 `x` 的变量；这是一个新对象，与第一个对象无关，只是它们名字相同。任何引用 `x` 的代码都会使用局部对象；函数不可能访问全局作用域的变量。这被称为*隐藏*对象。在函数内设置\
  \ `x` 的值只会改变局部变量。当这段代码执行时，控制台会输出以下内容：\n\n```\noriginal x value passed in: 1\nlocal-scoped\
  \ x: 2\nglobal-scoped x: 1\n```\n\n**注意：** 如果你在函数内使用变量但没有用 `var` 或 `let` 关键字声明，它将被创建为全局作用域变量。例如，如果在函数中添加语句\
  \ `x=5;`，变量 `x` 将是全局变量。你应该始终使用 `var` 或 `let` 声明变量，以使你的意图清晰。\n\n#### 严格模式\n\n当使用*严格模式*时，未声明的变量是不被允许的，并且会导致错误。否则，如果不处于严格模式，JavaScript\
  \ 会为你声明变量。虽然这看起来是个好主意，但可能导致意外结果。例如，考虑以下代码：\n\n```\nvar myIntervalCounter = 0;\n\n\
  for (var i=0; i < 10; i++)\n{\n    if (i % 2 == 0) { myInterbalCounter = i * 2;\
  \ }\n}\n\nconsole.log(myIntervalCounter);\n```\n\n注意在 `for` 循环中 `myIntervalCounter`\
  \ 变量拼写错了。在非严格模式下，会创建一个新变量并设置其值，而不是更新原变量。本应被更新的变量从未被设置，其值仍为 0。\n\n![](img/index-69_1.jpg)\n\
  \n你可以通过在脚本顶部添加以下内容来开启严格模式：\n\n```\n\"use strict\";\n```\n\n这将为整个文件开启严格模式。或者，你也可以通过在函数定义的第一行添加它，将其应用于特定函数。在严格模式下，之前的代码会生成一个错误，如图\
  \ 3-4 所示。\n\n***图 3-4.** 严格模式错误*\n\n**提示：** 严格模式还有其他一些细微差别，例如不允许你使用保留关键字命名变量。Mozilla\
  \ 有一篇很好的文章详细解释了严格模式的功能，网址为 [`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode)。\n\
  \n#### 函数\n\n我们之前已经看过函数，使用函数创建对象。函数也是一个对象，可以像属性一样作为对象成员添加。这满足了面向对象封装的要求。\n\n函数也可以像其他任何类型的变量一样被定义。因此，函数可以在全局作用域（函数体外）中定义，但也可以在其他函数内部定义。考虑以下代码：\n\
  \n```\nvar functionA = function(){\n    var x = 1;\n    var functionB = function(){\n\
  \        var y = 2;\n        var functionC = function(){\n            var z = 3;\n\
  \            console.log(x+y+z);\n        }\n    }\n}\n```\n\n在这里，`functionA()`\
  \ 在局部作用域中声明了 `functionB()`，后者又在局部作用域中创建了 `functionC()`。这被称为*词法作用域*，即在一个函数内部定义另一个函数。\n\
  \n每个函数定义了一个新的作用域。`functionA()` 在全局作用域中。在花括号之间定义了一个新的局部作用域；我们称其为作用域 A，它包含变量 `x` 和\
  \ `functionB()`。在 `functionB()` 的花括号内部，定义了另一个作用域；我们称其为作用域 B。它包含变量 `y` 和 `functionC()`。类似地，在\
  \ `functionC()` 内部有第三个局部作用域，包含变量 `z`。\n\n此时，没有任何函数被调用；你只是在定义它们。只有 `functionA()`\
  \ 具有全局作用域，并且它是你唯一可以调用的函数。让我们重写这段代码，加入一些函数调用，以便观察实际效果。内部函数 `functionB()` 可以调用 `functionC()`，因为它位于\
  \ `functionB()` 的作用域内。\n\n类似地，`functionA()` 可以调用 `functionB()`。由于 `functionA()`\
  \ 是全局作用域，你可以直接调用它。\n\n```\nvar functionA = function(){\n    var x = 1;\n    var\
  \ functionB = function(){\n        var y = 2;\n        var functionC = function(){\n\
  \            var z = 3;\n            console.log(x+y+z);\n        }\n        functionC();\n\
  \    }\n    functionB();\n}\n\nfunctionA();\n```\n\n注意，`functionC()` 可以访问 `functionA()`\
  \ 和 `functionB()` 中的局部作用域变量。\n\n这被称为*闭包*。闭包发生在内部函数访问其外部（包含）函数中的变量时。内部函数也可以访问外部函数的局部作用域中的函数和变量。所以\
  \ `functionC()` 可以调用 `functionB()`。它也可以调用 `functionA()`，因为这是全局作用域的。但如果它这样做（在当前的例子中），你会陷入无限循环。\n\
  \n**注意：** 请记住，`functionA()` 不能调用 `functionC()`。一个函数可以访问其局部作用域以及作用域链中往前的任何东西；但它不能访问作用域链中更靠后的任何东西。\n\
  \n所以你不能直接调用 `functionC()`。真的不能吗？实际上，如果返回了对它的引用，你就可以调用它；这是闭包的一种常见用法。只有 `functionB()`\
  \ 可以访问 `functionC()`，但函数与其他任何变量一样都是对象，可以作为返回值提供给调用者。我稍微重写一下代码来演示这一点。\n\n```\nvar\
  \ functionA = function(){\n    var x = 1;\n    var functionB = function(){\n   \
  \     var y = 2;\n        var functionC = function(){\n            var z = 3;\n\
  \            console.log(x+y+z);\n        }\n        return functionC;\n    }\n\
  \    return functionB();\n}\n\nvar closure = functionA();\nclosure();\n```\n\n在\
  \ `functionB()` 内部，不是调用 `functionC()`，而是返回该函数。注意 `return` 语句中没有括号。这仅仅是返回名为 `functionC`\
  \ 的变量（它恰好是一个函数），而不实际执行它。在 `functionA()` 内部，它确实调用了 `functionB()` 并返回了 `functionB()`\
  \ 返回的值，即对 `functionC()` 的引用。\n\n调用 `functionA()` 只是返回一个函数引用，该引用存储在 `closure` 变量中。`closure`\
  \ 变量现在有了对 `functionC()` 的引用。任何时候你想调用 `functionC()`，只需调用 `closure()`。\n\n#### 上下文\n\
  \n`this` 关键字指的是当前的执行上下文，但有时并不清楚 *this* 是什么。这就像去一家餐厅，告诉你的服务员“你想再来一些*这个*。” 希望你已经指明了*这个*是什么，否则你可能得不到你想要的。JavaScript\
  \ 有时就是这样。\n\n```\n\n\n`this` 关键字引用单个对象。例如，在函数内部，`this` 指向调用该函数的对象。在包含属性和方法的典型对象中，`this`\
  \ 通常指向其所属对象。例如：\n\n```\nvar myObject = {\n    color: \"Red\",\n    count: 5,\n \
  \   log: function () {\n        console.log(\"Quantity: \" + this.count + \", Color:\
  \ \" + this.color);\n    }\n};\n```\n\n这里，`log()` 函数使用 `this.count` 来访问其所属对象中的属性。然而，有一个非常重要的点：`this`\
  \ 的值直到函数被调用时才确定……并且该值通常被设置为调用该函数的对象，尽管这一点可以被覆盖。所以，在这个例子中，我们期望 `log()` 函数通过类似 `myObject.log();`\
  \ 的方式被调用，在这种情况下，`myObject` 将是调用对象。\n\n如果将一个函数用作回调，例如事件处理器，则调用对象很可能不是其所属对象。例如，如果该函数处理按钮的\
  \ `onclick` 事件，那么调用对象将是该按钮。\n\n`call()` 函数允许你调用一个函数并指定 `this` 的值。我将用以下代码来演示：\n\n\
  ```\nfunction Vehicle(weight, cost) {\n    this.weight = weight;\n    this.cost\
  \ = cost;\n}\n\nfunction Truck(weight, cost, axles, length) {\n    Vehicle.call(this,\
  \ weight, cost);\n    this.axles = axles;\n    this.length = length;\n}\n\nvar tonka\
  \ = new Truck(5, 25, 3, 15);\nconsole.log(tonka);\n```\n\n你可能认识 `Vehicle()` 函数；这是一种创建对象的典型方式，通常通过如下语句调用：\n\
  \n```\nvar v = new Vehicle(5, 25);\n```\n\n这将创建一个具有两个属性 (`weight` 和 `cost`) 的对象，并用提供的值进行初始化。`Truck()`\
  \ 函数类似，初始化了 `axles` 和 `length` 属性。但请注意该函数的第一行：\n\n```\nVehicle.call(this, weight,\
  \ cost);\n```\n\n这使用了 `call()` 函数来调用 `Vehicle()`，并向其传递了当前的 `this` 值，该值是对 `Truck`\
  \ 对象的引用。当 `Vehicle()` 函数以这种方式被调用时，`weight` 和 `cost` 属性会被添加到 `Truck` 对象上，而不是 `Vehicle`\
  \ 对象上。将新的 `tonka` 变量发送到控制台日志即可验证这一点。你应该会看到以下输出：\n\n```\nTruck {weight: 5, cost:\
  \ 25, axles: 3, length: 15}\n```\n\n注意，`call()` 函数传入了三个参数。第一个参数被用作函数内部的 `this` 值。其余参数则被传递给被调用的函数。`apply()`\
  \ 函数的工作方式与 `call()` 函数完全相同，唯一的区别是额外的参数以数组形式传递。以下两行代码实现相同的功能：\n\n```\nVehicle.call(this,\
  \ weight, cost);\n// 或者\nVehicle.apply(this, [weight, cost]);\n```\n\n你可以任选其一使用，这只是一个偏好问题。然而，`apply()`\
  \ 可以用于参数数量可变的列表。你可以动态构建数组，然后将其作为第二个参数传递给 `apply()`。\n\n`call()` 和 `apply()` 函数都会立即调用它们所作用的函数。因此，当你执行\
  \ `Vehicle.call(...)` 时，`Vehicle()` 函数会被立即调用。如果你只想设置好调用但实际并不立即执行呢？例如，当你正在设置一个在点击事件发生时执行的回调函数。这可能会像这样：\n\
  \n```\nmyButton.click(myHandler);\n```\n\n正如我前面提到的，当 `myHandler()` 被调用时，`this` 将是按钮对象。如果你想要一个不同的\
  \ `this` 值，你不能使用 `call()` 或 `apply()`，因为你尚未调用该处理器；你只是在为事件触发时的调用做准备。要解决这个问题，可以像这样使用\
  \ `bind()` 函数：\n\n```\nmyButton.click(myHandler.bind(newThis));\n```\n\n现在，当事件发生时，`myHandler()`\
  \ 函数将被调用，并且其 `this` 值将是传入的值 `newThis`。你可以通过在 `this` 引用之后列出它们来向函数传递额外的参数，就像 `call()`\
  \ 函数那样。\n\n\n\n"
- "# JavaScript 函数与命名空间\n\n通常情况下，当您在 JavaScript 中定义一个函数时，您只是定义了它；它还没有被调用。如果您希望它运行，您必须随后调用它。例如：\n\
  \n```\nvar myFunction = function() {\n  doSomething();\n}\n```\n\n现在，如果您想调用它，您需要添加一条像\
  \ `myFunction();` 这样的语句。或者，您可以将该函数定义为一个**立即调用函数表达式**（IIFE），发音为“iffy”。\n\n您可以通过将函数放在一对圆括号内，然后添加一对开闭圆括号来将其转换为\
  \ IIFE，如下所示：\n\n```\n(function() {\n  doSomething();\n})();\n```\n\n如果这段代码定义在全局作用域中，那么\
  \ `doSomething()` 函数会在脚本被解析时立即执行。\n\n#### 命名空间\n\n在 JavaScript 中，全局作用域内的所有对象都需要具有唯一的名称，以避免名称冲突。请记住，浏览器上运行的所有脚本共享全局作用域。因此，即使您的代码没有冲突，其他第三方脚本也在全局作用域中拥有对象。如果您将所有对象都放在全局作用域中，与其他对象使用相同名称发生冲突的可能性就会大大增加。为了编写良好的防御性代码，您应该使用命名空间来组织代码。\n\
  \n命名空间是一种按层次结构组织代码的技术。一个对象的完全限定名称包含其在层次结构中定义的路径。因此，即使您有两个都名为 `Item` 的类，只要它们位于不同的路径（命名空间）中，它们的完全限定名称就是唯一的。\n\
  \n虽然 JavaScript 不直接支持 `namespace` 关键字，但命名空间的概念可以很容易地通过嵌套对象来实现。这里的基本原则是：在全局作用域中创建一个单一对象，然后将所有其他内容作为该全局对象的成员添加进去。例如，以下代码在全局作用域中创建了一个单一对象，然后创建了一些嵌套对象来定义一个层次结构。\n\
  \n```\nvar mySample = {}; // 全局对象\n\n// 定义命名空间层次结构\nmySample.things = {};\nmySample.things.helpers\
  \ = {};\nmySample.otherThings = {};\n\n// 向命名空间中添加内容\nmySample.things.count = 0;\n\
  mySample.things.helpers.logger = function (msg) {\n  console.log(msg);\n}\n```\n\
  \n如果您的代码分布在多个文件中，或者您在多个地方需要这段代码，您需要确保对象不会被创建两次。您可以通过使用 `||` 运算符来实现这一点：`this.mySample\
  \ = this.mySample || {};`\n\n一个未定义的对象会返回 `falsy` 值，因此 `||` 运算符会继续执行语句的下一部分，即创建该对象。如果该对象已经被创建，这会返回\
  \ `true`，其余代码将被跳过。\n\n您的所有代码都会使用 `mySample` 对象内的对象，因此非常关键的一点是，这个对象必须在任何其他代码执行之前被创建。最简单的方法是在脚本开头将其包含在一个\
  \ IIFE 中，所以让我们将其重写为一个 IIFE：\n\n```\n(function () {\n  window.mySample = window.mySample\
  \ || {};\n\n  // 在层次结构中添加其他节点\n  window.mySample.things = window.mySample.things\
  \ || {};\n  window.mySample.things.helpers = window.mySample.things.helpers || {};\n\
  \  window.mySample.otherThings = window.mySample.otherThings || {};\n\n  // 设置快捷方式\n\
  \  window.helpers = window.mySample.things.helpers;\n\n  // 现在添加一些成员\n  window.mySample.things.count\
  \ = window.mySample.things.count || 0;\n  window.mySample.things.helpers.logger\
  \ = function (msg) {\n    console.log(msg);\n  }\n})();\n```\n\n请注意，`var` 关键字被移除，并替换为了\
  \ `window` 对象；这指的是全局作用域。通过将 `mySample` 定义在 `window` 对象上，您可以使其在任何地方都可用。\n\n最后，我偷偷加入了一个快捷方式，这样我就可以使用较短的引用来访问命名空间。您可以通过遵循命名空间层次结构（`mySample`、`things`、`helpers`）来访问\
  \ `logger()` 方法。但您也可以直接从快捷方式 `helpers` 访问它：\n\n`mySample.things.helpers.logger(\"\
  some text\");`\n\n\n\n"
- "# JavaScript 基础\n\n#### 命名空间\n\n`helpers.logger(\"some more text\");`\n\n> **提示**\
  \ 实现命名空间概念还有其他方式。如需了解这些变体的示例，请参阅 [`addyosmani.com/blog/essential-js-namespacing`](https://addyosmani.com/blog/essential-js-namespacing)\
  \ 上的文章。同时，这还假设不存在名为 `mySample` 或 `helpers` 的其他全局对象。你可能需要在这些名称前加上公司名称或缩写，以确保唯一性。\n\
  \n#### 异常\n\nJavaScript 支持 `try/catch/finally` 模式，这与你在 C# 等其他语言中看到的类似。\n\n可能失败的代码应放入\
  \ `try` 块中。如果在 `try` 块内引发了异常，则将执行 `catch` 块。无论是否发生错误，`finally` 块始终会执行。\n\n你还可以使用\
  \ `throw()` 函数在代码中生成异常。这使你可以将错误处理放在 `catch` 块中，从而使主代码更清晰。以下是这些结构的一个简单示例：\n\n```javascript\n\
  try {\n  var x = 5;\n  var y = 0;\n  if (y == 0) {\n    throw(\"不能除以零\")\n  }\n\
  \  console.log(x/y);\n}\ncatch(e) {\n  console.log(\"错误: \" + e);\n}\nfinally {\n\
  \  console.log(\"Finally 块已执行\");\n}\n```\n\n`finally` 块是放置任何必要的清理代码的好地方，这些代码即使在发生错误时也需要运行。`catch`\
  \ 和 `finally` 块都是可选的，但你至少需要其中一块。\n\n#### Promise\n\n*Promise* 是处理异步函数调用的一种标准化方式。实际上，它只是一个带有两个参数的回调函数：一个函数在成功时被调用，另一个在失败时被调用。Promise\
  \ 可以处于以下三种状态之一：\n\n- **待定（Pending）** - 操作尚未完成\n- **已完成（Fulfilled）** - 操作成功完成\n-\
  \ **已拒绝（Rejected）** - 处理过程中发生错误\n\n有时，已完成和已拒绝被统称为已决。让我们看一个使用 Promise 的简单示例。`getNumber()`\
  \ 函数等待 2 秒，然后生成一个介于 0 和 100 之间的随机数。如果你请求一个偶数且随机数为偶数，则该函数返回成功。\n\n```javascript\n\
  function getNumber(bEven) {\n  return new Promise(function (fulfill, reject) {\n\
  \    // 执行某些长时间运行的任务\n    window.setTimeout(\n      function () {\n        var i\
  \ = Math.round((Math.random() * 100), 0);\n        if ((i % 2 != 0 && bEven) ||\n\
  \            (i % 2 == 0 && !bEven)) {\n          reject(i);\n        }\n      \
  \  else {\n          fulfill(i);\n        }\n      }, 2000);\n  });\n}\n```\n\n\
  `getNumber()` 函数返回一个 `Promise` 对象，该对象是一个带有两个参数的函数。工作在这个内部函数中完成。由于代码位于 `getNumber()`\
  \ 函数内部，因此它可以访问其变量，例如 `bEven` 参数。`fulfill()` 和 `reject()` 函数的引用被传入内部函数，当内部函数完成时，会调用其中一个。\n\
  \n要调用此代码，请添加以下内容：\n\n```javascript\nvar p = getNumber(true);\np.then(\n  function\
  \ (i) { console.log(\"Promise 已完成, i = \" + i); },\n  function (i) { console.log(\"\
  Promise 已拒绝, i = \" + i); }\n);\nconsole.log(\"Promise 已创建...\");\n```\n\n这将调用 `getNumber()`\
  \ 函数请求一个偶数。该函数立即返回一个 `Promise` 对象。然后调用 `Promise` 对象的 `then()` 成员，传入两个匿名函数。第一个将在成功时调用，第二个在失败时调用。此时，`getNumber()`\
  \ 函数尚未完成；它处于待定状态。然后，`Promise` 对象会执行其中一个匿名回调函数。\n\n你也可以捕获错误回调，而不是将其传递给 `Promise`\
  \ 对象。例如，以下方式可以实现相同的效果：\n\n```javascript\np.then(\n  function (i) { console.log(\"\
  Promise 已完成, i = \" + i); }\n)\n.catch(\n  function (i) { console.log(\"Promise\
  \ 已拒绝, i = \" + i); }\n);\n```\n\n#### 数组方法\n\n处理数组时有相当多的内置功能。我将在此解释更常见的方法，并在附录\
  \ C 的参考部分提供完整列表。\n\n### 访问元素\n\n正如我之前提到的，填充数组的最简单方法是使用字面量表示法。例如，这将创建一个包含六个字符串元素的数组：\n\
  \n```javascript\nvar arr = [\"red\", \"green\", \"blue\", \"yellow\", \"orange\"\
  , \"purple\"];\n```\n\n第一个元素的索引为 0，其余元素的索引按顺序分配。\n\n元素通过其索引进行访问。要获取第二个元素的值，请使用 `arr[1]`，它将返回字符串\
  \ `\"green\"`。你可以通过直接设置来更新值，例如 `arr[2] = \"azure\"`。这将用 `\"azure\"` 替换 `\"blue\"\
  ` 元素。你还可以使用 `delete` 关键字删除元素：`delete arr[3]`。这将删除索引 3 处的值 (`\"yellow\"`)，但在数组中留下一个空元素。\n\
  \nJavaScript 在处理越界错误方面非常宽容。例如，在上述数组中，有六个元素，每个元素通过索引 0-5 引用。调用 `arr[8]` 不会导致错误，而是返回\
  \ `undefined`。同样，你可以调用 `arr[8] = \"brown\"`，数组将自动增长以容纳九个元素，第九个元素的值为 `\"brown\"`。这会在数组中留下一些空洞；`arr[6]`\
  \ 和 `arr[7]` 将是 `undefined`，但 `arr[8]` 将返回 `\"brown\"`。\n\n有两种添加新元素的方法：`unshift()`\
  \ 将元素添加到数组的开头，`push()` 将元素添加到数组的末尾：\n\n```javascript\narr.unshift(\"white\");\n\
  arr.push(\"black\");\n```\n\n执行此操作后，`\"white\"` 将位于列表的开头，`\"black\"` 位于末尾。原始六个元素将按原始顺序位于两者之间。这两种方法都返回添加元素后数组的新大小。你还可以通过\
  \ `length` 属性获取大小：\n\n```javascript\nvar numberOfElements = arr.length;\n```\n\n\
  还有相应的方法来移除第一个和最后一个元素。`pop()` 方法返回最后一个元素并将其从数组中移除。同样，`shift()` 方法返回第一个元素并将其从数组中移除。\n\
  \n`shift()` 和 `unshift()` 方法因其需要调整元素索引而得名。数组中的第一个元素的索引为 0。当在开头添加新元素时，它将位于索引 0，这意味着每个现有元素的索引都需要递增或上移。同样，移除第一个元素需要索引下移。\n\
  \n> **提示** 你可以通过使用 `push()` 和 `pop()` 方法来实现栈的功能。栈使用后进先出（LIFO），意味着最后添加的元素最先被移除。使用\
  \ `push()` 将元素添加到末尾，然后 `pop()` 将移除最后添加的元素。要实现队列（先进先出，FIFO），请使用 `unshift()` 添加新元素，并使用\
  \ `pop()` 移除队列中最旧的元素。\n\n### 输出数组\n\n`valueOf()` 方法将返回数组作为值集合。这是数组对象的默认方法；如果你访问数组而不调用其任何方法，则会调用此方法。\n\
  \n此外，你可以通过调用 `toString()` 方法轻松地将数组的内容输出为一组逗号分隔的值。如果你需要使用不同的分隔符字符串输出元素，请使用 `join()`\
  \ 方法。该方法接受一个参数，指定将放置在每个元素之间的字符串。\n\n如果你不向 `join()` 方法传递任何参数，它将使用逗号字符。例如，如果你有一个名为\
  \ `arr` 的数组，以下四个语句将输出其内容：前两个作为字符串集合，后两个作为包含逗号分隔值的单个字符串。\n\n```javascript\nconsole.log(arr);\n\
  console.log(arr.valueOf());\nconsole.log(arr.toString());\nconsole.log(arr.join());\n\
  ```\n\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您提供的注意事项和示例，对以下英文文本进行翻译。\n\n\n"
- "# JavaScript 中的数组操作方法\n\nJavaScript 中有几种可用的数组操作方法，我将在此简要说明。其中一些方法会修改现有数组，而另一些则不会，而是返回一个新数组。请密切注意这一细节。\n\
  \n## `concat()` 方法\n\n`concat()` 方法用于合并两个或多个数组，并将元素返回到一个新数组中。现有数组不会被修改。`concat()`\
  \ 方法在第一个数组上调用，而其他数组作为参数传入。例如：\n\n```\nvar arr1 = [\"a\", \"b\", \"c\"];\nvar arr2\
  \ = [\"x\", \"y\", \"z\"];\nvar combined = arr1.concat(arr2);\n```\n\n生成的数组 `combined`\
  \ 将包含元素 `a`、`b`、`c`、`x`、`y` 和 `z`。如果你需要合并超过两个数组，只需将其他数组作为附加参数传入即可。\n\n## `slice()`\
  \ 方法\n\n使用 `slice()` 方法可以创建一个包含现有数组子集的新数组，而不会改变现有数组。传入起始和结束索引以指定要返回哪些元素。请注意，起始索引是包含的，但结束索引是不包含的。因此，调用\
  \ `arr.slice(2, 4);` 将返回索引 2 和 3 的元素。结束参数是可选的；如果省略，则返回从起始索引开始的所有元素。\n\n你还可以在调用 `slice`\
  \ 时使用负值，这将从右侧开始计数。例如，`arr.slice(-3, -1);` 将返回倒数第二个元素以及它前面的那个元素。这种语法可能看起来不太直观；然而，如果你将数组长度加到这些参数上，就更容易理解了。\n\
  \n例如，以下两条语句将返回完全相同的结果：\n\n```\narr.slice(-3, -1);\narr.slice(arr.length-3, arr.length-1);\n\
  ```\n\n**提示：** 如果你想获取最后 `n` 个元素，请将 `-n` 用作第一个参数，将 `length` 用作第二个参数。例如，要获取最后 5 个元素，请使用\
  \ `arr.slice(-5, length);`。\n\n## `splice()` 方法\n\n`splice()` 方法可以同时执行删除数组中的元素以及在指定位置插入新元素的操作。第一个参数指定删除开始的位置，同时也是插入新元素的位置。第二个参数指示应删除多少个元素。如果你不想删除任何元素，请输入\
  \ `0`。要插入元素，请将它们作为附加参数传入。\n\n你可以使用 `splice()` 方法仅删除元素，也可以仅插入元素，还可以同时执行这两项操作。例如：\n\
  \n```\narr.splice(2, 1); // 删除索引 2 处的一个元素\narr.splice(2, 0, \"teal\", \"pink\");\
  \ // 在索引 2 处添加两个元素\narr.splice(2, 1, \"teal\", \"pink\"); // 删除 1 个元素并插入 2 个\n```\n\
  \n**注意：** `splice()` 方法会返回一个包含被删除元素的数组。在这方面，它的工作方式与 `slice()` 方法类似。事实上，`arr.splice(2,1);`\
  \ 和 `arr.slice(2,1);` 将返回相同的结果。然而，与 `slice()` 不同，`splice()` 方法会修改调用它的数组。调用 `slice()`\
  \ 会保持原数组不变，但调用 `splice()` 会从数组中移除元素。当然，如果你使用 `splice()` 来插入元素，数组也会被更新。\n\n## `sort()`\
  \ 方法\n\n`sort()` 方法会修改现有数组。它接受一个可选参数，用于指定在排序过程中使用的回调函数。如果未提供，`sort()` 方法会在必要时将每个元素转换为字符串，然后按字母顺序对字符串进行排序。考虑以下代码：\n\
  \n```\nvar numbers = [1, 33, 7, 12, 5];\nnumbers.sort();\n```\n\n执行 `sort()` 方法后，元素将变为\
  \ `[1, 12, 33, 5, 7]`，这可能不是你想要的。要纠正这一点，你需要提供一个比较函数。此函数接收两个参数，它们将是数组中的两个元素。如果元素相等（就它们应如何排序而言），它应返回\
  \ `0`；如果第一个元素应排在第二个元素之前，则返回 `-1`；如果第一个元素应排在第二个元素之后，则返回 `1`。\n\n以下代码定义了一个 `numericSort()`\
  \ 函数，并将其传递给 `sort()` 方法。调用此方法后，元素将按数字顺序 `[1, 5, 7, 12, 33]` 排序。\n\n```\nfunction\
  \ numericSort(a, b){\n    if(isNaN(a) || isNaN(b)) return 0; // 如果不是数字，则无法比较\n \
  \   if(a == b) return 0;\n    if(a < b) return -1;\n    if(a > b) return 1;\n}\n\
  \nvar numbers = [1, 33, 7, 12, 5];\nnumbers.sort(numericSort);\n```\n\n## `reverse()`\
  \ 方法\n\n`reverse()` 方法通过反转其元素的顺序来修改现有数组。它不接受任何参数，并返回修改后的数组。以下代码将输出元素 `[3, 2, 1]`。\n\
  \n```\nvar numbers = [1, 2, 3];\nnumbers.reverse();\nconsole.log(numbers);\n```\n\
  \n### 搜索\n\n数组对象提供了几种在数组中查找元素的方法。`indexOf()` 方法返回指定元素首次出现的索引。例如，`arr.indexOf(\"\
  red\");` 将返回第一个值为 `\"red\"` 的元素。类似地，`arr.lastIndexOf(\"red\");` 将返回最后一次出现的位置。\n\n\
  这两种方法都使用严格相等性来执行搜索，这意味着如果你要查找 `\"12\"` 而数组包含数字 `12`，则无法找到它。`indexOf()` 方法从数组开头开始向前搜索，直到找到第一个匹配项。`lastIndexOf()`\
  \ 方法从数组末尾开始向后扫描。\n\n两种方法都支持一个 `fromIndex` 参数，该参数指定搜索应从何处开始。如果未指定，则搜索从头开始（对于 `lastIndexOf()`\
  \ 则是从末尾开始）。也支持负值，表示搜索应从距离数组末尾这么多个元素的位置开始。如果使用负数来定义搜索的起始位置，`indexOf()` 的搜索仍然是向前的，而\
  \ `lastIndexOf()` 的搜索仍然是向后的。\n\n```\nvar arr = [\"red\", \"green\", \"blue\", \"\
  yellow\", \"blue\", \"purple\"]; \narr.indexOf(\"blue\"); // 返回 2\narr.lastIndexOf(\"\
  blue\"); // 返回 4\narr.indexOf(\"blue\", 3); // 返回 4\narr.lastIndexOf(\"blue\", -3);\
  \ // 返回 2\n```\n\n`find()` 和 `findIndex()` 方法将使用你定义的回调函数来搜索数组中的元素。这使你可以完全控制搜索逻辑。`find()`\
  \ 方法返回元素，而 `findIndex()` 返回元素的索引。这两种方法都会遍历数组中的元素，执行指定的回调函数。当回调函数返回 `true` 时，搜索停止，并返回当前元素或其索引。\n\
  \n回调函数可以有三个输入参数，但只有第一个是必需的：\n\n- `element` - 当前正在评估的数组元素\n- `index` - 当前元素的索引\n\
  - `array` - 正在其中搜索的数组对象\n\n例如，如果你想从数组中查找第一种原色，可以将回调函数实现为：\n\n```\nfunction isPrimary(color,\
  \ index, array) {\n    if (color == \"red\" || color == \"blue\" || color == \"\
  yellow\"){\n        return true;\n    }\n    return false;\n}\n```\n\n然后调用 `find()`\
  \ 方法，并传入 `isPrimary()` 函数：\n\n```\nconsole.log(arr.find(isPrimary));\n```\n\n`find()`\
  \ 和 `findIndex()` 方法都支持第二个可选参数。这允许调用者在调用回调函数时定义 `this` 的值。\n\n### 创建子集\n\n`filter()`\
  \ 函数不会修改数组，而是返回一个新数组，该数组是原数组的一个子集。要实现过滤逻辑，你必须指定一个回调函数，该函数将为数组中的每个元素调用。如果元素应包含在子集中，则该函数返回\
  \ `true`，否则返回 `false`。\n\n此回调函数的工作方式与 `find()` 方法使用的回调函数相同。实际上，你可以对两者使用相同的函数：\n\n\
  ```\nvar subset = arr.filter(isPrimary);\nconsole.log(subset);\n```\n\n这不会影响现有数组，但会返回一个包含\
  \ `[\"red\", \"blue\", \"yellow\", \"blue\"]` 的新数组。\n\n\n\n`map()` 方法会创建一个新数组，其中包含原始数组中每个元素对应的一个元素。它遍历数组中的元素，调用指定的回调函数。该函数会返回一个新元素，该元素是原始元素经过某种转换后的结果。例如，你可能希望将一个字符串数组转换为大写形式。\n\
  \n为了使用之前的 `numbers` 数组进行测试，我们可以实现 `isOdd()` 函数：\n\n```\nfunction isOdd(element,\
  \ index, array) {\n  if (isNaN(element)) { return false; }\n  if (element % 2 !=\
  \ 0) { return true; }\n  return false;\n}\n```\n\n**第 3 章 ■ JavaScript 要点**\n\n\
  该函数返回一个布尔值：如果数字是奇数则返回 `true`，否则返回 `false`。当将此函数传递给 `map()` 方法时，你将获得一个由布尔值组成的新数组：\n\
  \n```\nvar boolArray = numbers.map(isOdd);\nconsole.log(boolArray);\n```\n\n`every()`\
  \ 和 `some()` 方法与 `find()` 和 `filter()` 方法类似，都需要你提供一个返回布尔值的回调函数，该函数会对数组中的每个元素进行调用。`find()`\
  \ 方法返回第一个使函数返回 `true` 的元素，而 `filter()` 方法返回所有使函数返回 `true` 的元素。\n\n`every()` 方法在函数对数组中的每个元素都返回\
  \ `true` 时返回 `true`。`some()` 方法则在函数对数组中的任意（部分）元素返回 `true` 时返回 `true`。可以尝试以下代码进行测试：\n\
  \n```\nconsole.log(numbers.some(isOdd)); // 返回 true\nconsole.log(numbers.every(isOdd));\
  \ // 返回 false\n```\n\n**处理**\n\n有一些有用的方法可以对数组中的元素执行某些处理操作。我们从最简单的 `forEach()` 方法开始。\n\
  \n`forEach()` 方法会遍历数组中的所有元素，并调用指定的函数。你必须定义将要执行的函数，并将该函数作为参数传递给 `forEach()` 方法。与我们之前看到的其他回调函数类似，该函数有一个必需参数，即当前正在执行操作的特定元素。此外，还有两个可选参数：元素的索引以及正在被处理的数组本身。该函数可能如下所示：\n\
  \n```\nfunction process(item, index, array) {\n  console.log(\"[\" + index + \"\
  ]: \" + item + \", in array \", array.toString());\n}\n```\n\n然后，调用 `forEach()`\
  \ 方法，添加以下代码：\n\n```\narr.forEach(process);\n```\n\n控制台输出应该如下所示：\n\n```\n[0]: white,\
  \ in array white,red,green,blue,yellow,orange,purple,black\n[1]: red, in array white,red,green,blue,yellow,orange,purple,black\n\
  [2]: green, in array white,red,green,blue,yellow,orange,purple,black\n[3]: blue,\
  \ in array white,red,green,blue,yellow,orange,purple,black\n[4]: yellow, in array\
  \ white,red,green,blue,yellow,orange,purple,black\n[5]: orange, in array white,red,green,blue,yellow,orange,purple,black\n\
  [6]: purple, in array white,red,green,blue,yellow,orange,purple,black\n[7]: black,\
  \ in array white,red,green,blue,yellow,orange,purple,black\n```\n\n`reduce()` 方法及其对应的\
  \ `reduceRight()` 方法将数组转换为单个值。解释该方法工作原理的最佳方式是描述一个具体的使用场景。例如，你有一个包含数值的数组，并希望计算这些数值的总和。为此，你需要遍历所有元素并累加元素值。\n\
  \n**第 3 章 ■ JavaScript 要点**\n\n与 `forEach()` 方法类似，你需要向 `reduce()` 方法提供一个函数。该函数有两个必需参数。第一个参数是一个累加器，它保存了上一个元素处理后的中间结果，或者如果是第一个元素，则保存一个初始值。第二个参数是当前正在调用该函数的元素。该函数还有两个可选参数，与\
  \ `forEach()` 方法相同，即索引和数组引用。该函数将当前元素与累加器合并，并返回结果。以下是实现求和用例的方法：\n\n\n\n```javascript\n\
  function sumArray(total, item, index, array) {\n    return total + item;\n}\n\n\
  var arr = [1, 3, 5, 2, 8, 1];\nconsole.log(numbers);\nvar sum = arr.reduce(sumArray,\
  \ 0);\nconsole.log(sum);\n```\n\n注意，`reduce()`方法包含第二个参数，它是累加器的初始值。因此，在首次调用`sumArray()`函数时，`total`参数的值为`0`。\n\
  \n`reduceRight()`方法与`reduce()`的功能相同，不同之处在于它从数组末尾开始，按逆序迭代元素。当顺序无关紧要时（例如求和操作），`reduce()`或`reduceRight()`会产生相同的结果。\n\
  \n### 本章小结\n\n我在本章中介绍了大量内容。虽然这远未涵盖所有特性，但它为你提供了所需基础知识的良好入门。如果你对 JavaScript 还比较陌生，我建议你仔细阅读下载代码中的`SampleScript.js`文件，并确保理解代码的用途。\n\
  \n在第 [16](http://dx.doi.org/10.1007/978-1-4842-2463-2_16) 章至第 [20](http://dx.doi.org/10.1007/978-1-4842-2463-2_20)\
  \ 章中，你将广泛使用 JavaScript 来增强你的 HTML5 应用程序。第 21 至 26 章的高级内容也会大量运用这些 JavaScript 特性。\n\
  \n在下一章中，我将演示用于为 HTML 文档提供结构的 HTML 元素。\n\n"
- '# 第二部分 - HTML


  在本节中，我将讲解可用的 HTML 元素，以及如何以及何时使用它们。我在第 [1](http://dx.doi.org/10.1007/978-1-4842-2463-2_1)
  章中已经介绍了其中一部分：那些用于提供文档结构和元数据的元素。现在，我将深入探讨 HTML 元素的核心内容。


  HTML5 完全围绕语义展开；在本节中你会反复读到这一点。选择使用哪个元素至关重要，它传达了内容的含义或用途。


  在接下来的五章中，我将尽力阐明*为什么*应该使用每个元素，当然，我也会提供*如何*使用它们的演示和示例。


  本节中各章节的内容组织如下，每章描述一组元素：


  - **4) 结构元素**，例如 `header`、`footer`、`section`、`aside` 和 `div`。这些元素创建了一个支撑其余内容的骨架。

  - **5) 文本元素**——有大量主要包含文本内容的元素，每个元素都提供特定的语义含义。

  - **6) 表格元素**——这些元素用于排列逻辑上属于行和列的表格数据。

  - **7) 嵌入式元素**，例如 `img`、`audio` 和 `video`。

  - **8) 表单元素**，包括 `input`、`button`、`label` 以及其他用于创建数据输入表单的元素。


  ## 第 4 章：HTML 结构元素


  我在第 [1](http://dx.doi.org/10.1007/978-1-4842-2463-2_1) 章中简要介绍了 HTML 的基本语法，然后解释了
  `head` 元素内部的信息。`head` 元素中没有可显示的内容；其中的数据供浏览器、屏幕阅读器或搜索引擎等应用程序使用。现在我们将注意力转向 `body`
  元素；这里才是内容所在之处。


  ### 内容分类


  HTML5 中定义了 100 多个元素。我在第 [1](http://dx.doi.org/10.1007/978-1-4842-2463-2_1) 章中已经解释了一部分，在接下来的五章中，我将演示其余的元素。元素按内容分类进行组织，并且基于这些分类存在通用规则，这些规则定义了元素可以在哪里使用以及它可以包含什么内容。


  一个元素可以属于多个类别，也有少数元素不属于任何类别。


  - **元数据** - 这些元素已在第 [1](http://dx.doi.org/10.1007/978-1-4842-2463-2_1) 章中解释过；它们没有实质内容，但提供关于
  HTML 文档的元数据以及供处理文档的应用程序使用的信息。

  - **分区** - 这些元素用于将页面组织成各个部分，也用于构建文档大纲。




  '
- "# HTML5 内容类别\n\n- **标题（Heading）** - 这些元素用于在章节内定义标题和副标题。\n- **嵌入内容（Embedded）** -\
  \ 嵌入元素用于在文档中插入非 HTML 内容，如图像。这些将在[第 7 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_7)中介绍。\n\
  - **交互内容（Interactive）** - 这些元素提供用户交互功能。常见的例子有`button`或`input`字段。\n- **表单（Form）**\
  \ - 表单元素用于捕获用户输入，并进一步分为几个子类别。我将在[第 8 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_8)中解释这些内容。\n\
  - **短语内容（Phrasing）** - 这些元素用于标记文本，或更确切地说是短语，这些短语组合起来形成段落。这些元素将在[第 5 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_5)中演示。\n\
  - **流内容（Flow）** - 绝大多数元素都属于这个类别。这些元素包含实际内容，如文本或某些嵌入内容（如图像或视频）。使用“流”这个术语是因为这些元素占据空间，并且通常从一个元素流向下一个元素，横向或纵向排列。\n\
  \n附录 C 中的参考资料包含了所有 HTML5 元素的字母顺序列表，并指出了每个元素所属的类别。\n\n© Mark J. Collins 2017  \n\
  M. J. Collins, *Pro HTML5 with CSS, JavaScript, and Multimedia*, DOI 10.1007/978-1-4842-2463-2_4\
  \  \n第 4 章 ■ 结构化 HTML 元素\n\n> **注意** 大多数不属于任何内容类别的元素仅用作特定元素的子元素。例如，`table`元素属于流内容类别，但`tr`和`td`等子元素不被分配类别，因为它们仅在表格内使用。\n\
  \n本章将解释如何使用分区和标题元素来组织你的 HTML 文档。\n\n#### 分区内容\n\n将 HTML 文档组织成逻辑分区是一个好主意，尤其对于较大的文档。在\
  \ HTML5 之前，使用分区（`div`）元素来对内容进行分组，并且可以像这样嵌套：\n\n```\n<div>\n  <div>\n    <div>\n\
  \    </div>\n  </div>\n</div>\n```\n\n不幸的是，`div`可用于因多种不同原因对内容进行分组，而这些原因对读者来说并不明显。HTML5\
  \ 引入了一些新的元素，提供了更具体的语义分组。这些元素中的每一个都用于将内容分组为更大的单元。然而，每个元素对内容进行分组的原因各不相同。你可以使用通用的`div`元素来完成分组；而使用更具体的元素是为了明确*为什么*要建立这个分组。因此，请密切关注每个元素的特定用途，并根据你想要实现的目标使用正确的元素。\n\
  \n### 分区（Section）\n\n`section`元素用于将内容组织成逻辑分区。回想一下你为学校作业写的论文，其中会有引言、三个主要论点和结论。\n\n\
  这些部分在 HTML 中都将表示为`section`。此外，`section`元素可以像`div`元素一样嵌套。如果你的每个主要论点都有子论点，你可以对每个子论点使用一个`section`。\n\
  \n在选择`section`元素时，有两个指导原则。首先，分区应该按主题划分；你是根据所呈现的材料来组织内容。其次，分区应该线性流动。\n\n例如，引言流向第一个主要论点，依此类推。当我在讨论`aside`元素时，这种原则的反面会更加明显。\n\
  \n### 文章（Article）\n\n`article`元素用于对可以独立存在的内容进行分组。这通常用于内容被重复使用的情况。如果你拿起当地的周日报纸阅读你最喜欢的漫画连载，你可能没有意识到，但同样的漫画连载被收录在世界各地的报纸中。同样的概念也适用于网站，联合内容会被包含在多个页面中。这些内容应放置在`article`元素中，因为这些内容独立于页面的其余部分。\n\
  \n\n\n"
- "# 结构化 HTML 元素\n\n然而，`article`元素最常见的用途之一是在博客中。博客中的每篇文章通常是独立的内容，并且通常被分组到`article`元素中。此外，发布到博客的评论也通常放在`article`元素中。\n\
  \n你可以在任何适合使用`section`元素的地方使用`article`元素，只要内容是独立且可重用的。一个较大的文章通常会像我之前描述的那样，使用`section`元素按主题进行组织。此外，`article`元素可以包含其他`article`元素，就像包含评论的博客文章那样。\n\
  \n## `aside`元素\n\n`aside`元素用于对不属于文档正常流程的内容进行分组。这可以是用于参考目的的支持性信息，或者关于作者的信息。它也可以是不相关的信息，例如广告位或事件日历。\n\
  \n`aside`元素通常以侧边栏的形式呈现，这样它就不会中断其他内容的流程。然而，这将由 CSS 决定；内容作者的工作是表明一组内容不属于正常的文档内容流。这是通过`aside`元素完成的。\n\
  \n## `nav`元素\n\n`nav`元素用于对一组链接进行分组。一个典型的例子是页面上有某种菜单，用于跳转到内部书签或其他相关页面。另一个例子是你提供指向更多信息或相关材料的链接。\n\
  \n你不需要把每个链接都放进`nav`元素中。但如果你有主要由链接组成的内容，请将其放入`nav`元素中。这将表明此部分内容提供了导航功能。\n\n## `address`元素\n\
  \n`address`元素不属于分区内容。我在这里描述它是因为它用于为整个文档或特定文章提供联系信息。要将其用于单个文章，它应该放在`article`元素内部的某处。如果它适用于文档，则必须放在`body`元素内部；这通常放在`footer`元素中。\n\
  \n> **提示：** `address`元素旨在提供与文档或文章相关的联系信息。这可以包括电子邮件地址、URL、电话号码、邮寄地址或任何其他与作者沟通的方式。它可能命名为`contact`会更好，因为这才是它的用途。你不应该用它来描述一个地址，除非该地址是作为联系信息提供的。\n\
  \n以下是在`footer`中包含`address`元素的示例：\n\n```html\n<footer>\n  <p>Closing content</p>\n\
  \  <address>\n    <p>Provided by\n      <a href=\"mailto:mcollins@theCreativePeople.com\"\
  >Mark J. Collins</a>\n    </p>\n    <p>For more information\n      <a href=\"www.theCreativePeople.com\"\
  >visit his website</a>\n    </p>\n  </address>\n</footer>\n```\n\n`address`元素的默认样式是以斜体显示文本。此`footer`的默认样式将如图\
  \ 4-1 所示。\n\n***图 4-1.** 默认地址样式*\n\n#### 大纲\n\n在 HTML5 规范中，有一个关于文档大纲的概念，被称为大纲算法。作为内容根元素的`body`元素在文档大纲中创建一个顶层节点。添加任何分区元素（`section`、`article`、`aside`或`nav`）都会在大纲中创建一个新的节。嵌入额外的分区元素会向大纲中添加更多节点。这里的想法是，通过简单地嵌套分区元素，就为你的文档创建了一个显式的大纲。\n\
  \n### 显式节\n\n让我们通过创建一个包含一些嵌套节的 HTML 文档来测试这一点。创建没有标签的大纲并不有趣。因此我们将在每个节中添加一个`h1`元素来给它命名。示例文档如清单\
  \ 4-1 所示。\n\n***清单 4-1.** 使用节创建文档大纲*\n\n```html\n<body>\n```\n\n\n\n"
- "# 我的示例页面\n\n## 导航\n\n## 顶层\n\n### 主内容\n\n#### 精选内容\n\n#### 文章\n\n##### 文章 1\n\n\
  ### 相关内容\n\n`Chapter 4 ■ StruCtural htMl eleMentS`\n\n#### HTML 参考\n\n#### 图书列表\n\
  \n##### 图书 1\n\n如果仅使用默认样式在浏览器中渲染此页面，页面将显示为 `Figure 4-2.`。\n\n**图 4-2.** 应用默认样式的示例文档\n\
  \n请注意，尽管所有标签都使用了同一个 `h1` 元素，但每个标签的字体却各不相同。样式会根据元素在文档大纲中的位置自动更新。\n\n`Chapter 4 ■\
  \ StruCtural htMl eleMentS`\n\n**注意：**`aside` 元素位于主区块下方，而非侧边。各区块的对齐方式将通过 CSS 控制。我将在\
  \ `Cha[pter 13.](http://dx.doi.org/10.1007/978-1-4842-2463-2_13)` 中对此进行说明。\n\n为了进一步说明这一点，有一个便捷的网页可以读取你的\
  \ HTML 文档并显示其大纲。你可以访问 `https://gsnedders.html5.org/outliner` 这个网站。粘贴你的 HTML 文档，然后点击“Outline\
  \ this”按钮。显示的大纲将类似于 `Figure 4-3.`。\n\n**图 4-3.** 查看文档大纲\n\n#### 文档标题\n\nHTML5 支持文档标题元素。除了本例中使用的\
  \ `h1` 元素外，还有 `h2`、`h3`、`h4`、`h5` 和 `h6` 元素。每个元素都用于指示标题在文档大纲中应处的指定层级。`h1`–`h6` 元素的默认样式与显式大纲文档中使用的样式相同。\n\
  \n在 HTML5 之前，区块元素尚不存在。但是，使用 `h1`–`h6` 元素，你可以提供隐式区块。如果前一个标题使用了 `h2` 元素，而当前标题使用了 `h3`，则会隐式定义一个新的区块。同样，从\
  \ `h3` 回到 `h2` 则会关闭当前区块。\n\n若要创建具有类似大纲的文档，你可以使用 `h1`–`h6` 元素创建隐式区块。\n\n你不需要在所有地方都使用\
  \ `h1` 元素，而是使用不同的元素来指示其在层级结构中的级别。以下 HTML 将生成完全相同的大纲（以及浏览器中的输出）：\n\n```html\n<body>\n\
  \  <h1>我的示例页面</h1>\n  <h2>导航</h2>\n  <h2>顶层</h2>\n  <h3>主内容</h3>\n  <h4>精选内容</h4>\n\
  \  <h4>文章</h4>\n  <h5>文章 1</h5>\n  <h3>相关内容</h3>\n  <h4>HTML 参考</h4>\n  <h4>图书列表</h4>\n\
  \  <h5>图书 1</h5>\n</body>\n```\n\n`Chapter 4 ■ StruCtural htMl eleMentS`\n\n然而，W3C\
  \ 的官方建议是不要依赖区块元素的轮廓。\n\n`Figure 4-4 shows` 显示了 W3C 文档（`http://www.w3.org/TR/html5/sections.html`）中的警告信息。\n\
  \n**图 4-4.** 关于轮廓算法的警告\n\n你绝对应该使用区块元素来将 HTML 文档组织成各个区块。此警告是建议，在可行的情况下，你也应根据文档层级使用相应的\
  \ `h1`–`h6` 元素。\n\n`article` 元素适用于可复用的内容。在这种情况下，内容通常不与主 HTML 文档位于同一文件中。它可能从数据库中读取、通过某种内容提要提供或从单独的文件中提取。它可能对该内容被插入的文档大纲一无所知。`article`\
  \ 应从 `h1` 级别开始，并根据需要包含额外的区块元素。当 `article` 被包含到文档中时，实际的大纲级别将根据插入时的当前层级进行调整。\n\n\n\
  \n■ **注意** 创建大纲的具体算法在 W3C 推荐标准中有详细说明，你可以通过以下地址查看：[`www.w3.org/TR/html5/sections.html#outlines`](http://www.w3.org/TR/html5/sections.html#outlines)\n\
  \n#### 页眉与页脚\n\n在组织页面时，你还应考虑在顶部添加一个 `header` 元素，在底部添加一个 `footer` 元素。这些元素可用于对文档某一部分的引言或结语内容进行分组。\n\
  \n与 `article` 或 `section` 等分区元素不同，`header` 和 `footer` 元素不会在文档大纲中创建新的分区。它们仅用于对所在分区的内容进行分组。通常你会在\
  \ `body` 元素中使用 `header` 和 `footer` 元素来定义页面页眉和页脚。它们也可以放置在子分区（例如 `section` 元素）内部。在这种情况下，它们仅对该分区的引言内容进行分组。\n\
  \n![](img/index-91_1.png)\n\n#### 规划页面布局\n\n在创建新网页之前，最好先勾勒出基本的页面结构。这有助于你直观地了解整体布局，并看清元素是如何嵌套在一起的。\n\
  \n本章中我将演示的页面将在顶部使用 `header` 和 `nav` 元素，在底部使用 `footer` 元素。中间的主区域将使用一个 `section` 元素，并包含两个并排的区域，每个区域都包含一系列\
  \ `article` 标签。较大的区域将被另一个 `section` 元素包裹，并提供主要内容，这些内容被组织成 `article` 元素。右侧较小的区域将使用一个\
  \ `aside` 元素，其中包含一个 `section` 元素。该 `section` 元素将包含一系列 `article` 元素，用于展示相关信息。图 4-5\
  \ 展示了该页面布局。\n\n***图 4-5.** 规划页面布局*\n\n■ **注意** 此示意图在元素之间显示了间距，以便于理解。在实际网页中，大多数情况下，通过将\
  \ `margin` 属性设置为 0 可以移除这些间距。\n\n#### 分区根元素\n\n有少部分 HTML 元素被称为分区根元素，它们拥有自己的大纲，且不参与文档其余部分的大纲。`body`\
  \ 元素便是其中之一，尽管这可以说是一个特例；`body` 元素的大纲也就是文档的大纲。此类别中的其他元素包括 `blockquote`、`details`、`fieldset`、`figure`\
  \ 和 `td`。我将在第 8 章中解释 `fieldset` 元素，在第 6 章中解释 `td` 元素。\n\n### Blockquote\n\n当你需要在文档中包含一段长引用时，可以使用\
  \ `blockquote` 元素。引用的内容放置在 `blockquote` 元素内部，可以包含多个元素，包括标题文本、段落和嵌入内容。一个简单的引用示例如下：\n\
  \n```\n<blockquote cite=\"www.apress.com\">\n<h1>引用</h1>\n<p>这是一段引用</p>\n</blockquote>\n\
  ```\n\n标题文本（`h1`–`h6`）会在引用内部定义分区，但这些分区不会成为文档大纲的一部分。你可以通过将 `blockquote` 元素添加到文档中，并使用我之前提到的大纲工具来运行验证这一点。\n\
  \n除了全局属性，`blockquote` 元素还支持 `cite` 属性。使用该属性来标识引用来源的 URL，或包含引用相关信息的资源地址。\n\n■ **提示**\
  \ `cite` *属性*提供了有关引用的详细信息，但不会（至少通常不会）显示出来。浏览器可以使用这些信息，但它基本上作为元数据提供。要显示来源或引用信息，应使用\
  \ `cite` *元素*，该元素将在下一章中解释。\n\n### Details\n\n`details` 元素允许你创建可折叠的内容区域。在 `details`\
  \ 元素内部，你可以包含一个可选的 `summary` 元素，该元素包含在元素折叠时显示的内容。如果未使用 `summary` 元素，则折叠时显示的文本将是“详情”。\n\
  \n`details` 元素的其余内容在折叠时将被隐藏。`details` 元素的初始状态为折叠状态。如果你希望在页面加载时显示内容，请添加 `open` 布尔属性。\n\
  \n```\n<details open>\n<summary>这是折叠文本</summary>\n<h1>详情</h1>\n<p>这些是可折叠的详情内容</p>\n\
  </details>\n```\n\n同样，与其他分区根元素一样，你可以在 `details` 元素中包含 `h1`–`h6` 元素，这些元素将为 `details`\
  \ 定义一个大纲。但是，这些分区不会包含在文档大纲中。\n\n![](img/index-93_1.jpg)\n\n■ **注意** 截至撰写本文时，`details`\
  \ 元素不受 Internet Explorer 或 Edge 浏览器支持，并且 Firefox 浏览器也未完全支持。\n\n### Figure\n\n`figure`\
  \ 元素用于对自包含的内容进行分组，这些内容在逻辑上可以移动到其他位置而不会影响文档的主要流程。`figure` 元素的一个独特功能是能够在内容中包含标题。\n\
  \n`figure` 元素通常用于将图像或其他嵌入内容与标题组合在一起。它也可用于将文本（例如代码清单）与标题组合在一起。\n\n要添加标题，请在 `figure`\
  \ 元素内包含 `figcaption` 元素。`figcaption` 元素必须是 `figure` 元素中的第一个或最后一个子元素。如果 `figcaption`\
  \ 元素是第一个子元素，标题将位于内容上方。否则，标题将位于内容下方。\n\n以下是一个包含嵌入图像的简单 `figure` 示例。在 Chrome 浏览器中的渲染效果如下图所示（图\
  \ 4-6）。\n\n```\n<figure>\n<h1>图形</h1>\n<img src=\"HTML5Badge.png\" alt=\"HTML5\"\
  \ />\n<figcaption>官方 HTML5 徽标</figcaption>\n</figure>\n```\n\n***图 4-6.** 使用 figure/figcaption\
  \ 元素*\n\n#### 分组元素\n\n上一节描述了用于将 HTML 文档组织成更小分区的元素，以及与文档大纲相关的元素。现在我将解释其余的分组元素。\n\n\
  这些元素主要用于语义目的，不会影响大纲。\n\n### 段落\n\n段落（`p`）元素用于定义一个段落，即包含单一思想或观点的文本部分。它通常在视觉上与其他段落有所区别。例如，在本书中，大多数段落的首行会缩进，以使段落更醒目。`p`\
  \ 元素的默认样式会设置外边距，从而在段落之间增加一些额外的空白。\n\n`p` 元素可能是最被滥用的元素之一。我再怎么强调也不为过——所选元素应基于其语义含义。段落是文档中一个独特的部分，包含单一思想或观点。如果这描述了你正在添加的内容，请使用\
  \ `p` 元素。如果不是，请继续寻找。下一章将描述短语元素，其中某一种可能更合适。\n\n如果使用了合适的元素，默认样式通常也会是合理的。但你不应基于元素自带的样式来选择元素。只要一致地使用合适的元素，就可以通过\
  \ CSS 轻松更改样式。\n\n### 水平线\n\n在 HTML4 中，`hr` 元素用于创建水平线。由于 HTML5 为其元素提供了更多的语义定义，该元素已被重新定义为主题分隔。当话题发生转变时，它通常放置在段落之间。\n\
  \n\n\n\n`hr` 元素仍会渲染为水平线以保持向后兼容。当然，这可以通过 CSS 进行修改。`hr` 元素内没有内容，且无需闭合标签。添加一个 `hr`\
  \ 元素的方式如下：\n\n```html\n<p>段落 1</p>\n\n<hr />\n\n<p>段落 2</p>\n```\n\n## 预格式化\n\n\
  放置在预格式化（`pre`）元素中的内容将完全按照输入方式呈现，包括空白字符。正如我在第 1 章中所解释的，浏览器通常会忽略空白字符，包括回车符、制表符和额外空格。使用\
  \ `pre` 元素可以告知浏览器保留这些字符。默认样式会使用等宽字体，这也有助于保持格式。\n\n> **注：** `pre` 元素是少数例外之一，其使用并非主要出于语义原因。\n\
  \n`pre` 元素用于包含已经格式化且需要保持该格式的内容。包含代码片段就是一个很好的例子。`pre` 元素的另一个常见用途是包含诗歌。例如：\n\n```html\n\
  <pre>我听到圣诞节的钟声响起\n\n它们演奏着古老而熟悉的颂歌，\n\n甜美而狂野\n\n词句反复吟唱\n\n人间和平，善意待人！</pre>\n```\n\
  \n<cite>亨利·沃兹沃思·朗费罗 - 1863 年，公共领域</cite>\n\n这在浏览器中的渲染效果如图 4-7 所示。\n\n**图 4-7：**\
  \ 使用 `pre` 元素\n\n尝试将 `pre` 元素替换为标准段落（`p`）元素。内容将显示在一行上，并根据页面宽度自动换行。\n\n> **注：** 这里有一个小趣闻：这首诗是美国内战期间由亨利·沃兹沃思·朗费罗所作。他在不久前失去了妻子，随后得知儿子查尔斯在战斗中受伤。正值圣诞时节，听到教堂钟声奏响颂歌，他开始怀疑是否真的存在和平与善意。这首诗反映了作者对此的挣扎，并在结尾得出结论：只要教堂钟声仍在敲响，希望就依然存在。\n\
  \n## 主要内容\n\n`main` 元素用于表示其内容呈现了文档的主要目的或主题。\n\n它标识了文档的核心和中心主题。因此，`main` 元素不能放置在\
  \ `article`、`aside`、`footer`、`header` 或 `nav` 元素内部，因为这些元素用于辅助性内容。此外，每个文档只能有一个 `main`\
  \ 元素，这一点应相当明确。`main` 元素中的内容应具有文档独特性，不应与其他文档共享。\n\n当然，`main` 元素可以根据需要划分为多个部分。虽然对在\
  \ `main` 元素中包含 `article`、`aside` 或 `nav` 元素没有限制，但这通常被认为是糟糕的实践。`article` 包含可复用或独立的内容，因此很少在文档中具有独特性。`aside`\
  \ 元素用于不属于主要内容流的内容，很可能不属于 `main` 元素所保留的中心主题。然而，如果 `aside` 或 `article` 元素的内容满足 `main`\
  \ 元素的标准，也可以使用它们。\n\n`main` 元素没有默认样式；它的使用纯粹是语义性的。使用它有助于屏幕阅读器或搜索引擎等应用程序直接跳转到文档的核心内容。\n\
  \n## 分区\n\n我将 `div` 元素留到了最后。正如我之前提到的，在 HTML5 之前，`div` 元素用于所有类型的分组。现在我们有了专门用于特定目的的新元素：按主题划分（`section`）、独立或可复用内容（`article`）、正常流程之外（`aside`）以及导航（`nav`）。此外，还有一些可用于语义分组的元素，如\
  \ `main`、`figure` 和 `blockquote` 元素。`div` 元素则用于所有其他分组需求。\n\n\n\n\n"
- "# HTML5 结构化元素\n\n## 使用 `div` 元素进行样式控制\n\n`div` 元素的一个常见用途是将样式应用于其所有子元素。大多数样式属性会从父元素继承。因此，在\
  \ `div` 元素上设置一个属性将向下传播到 `div` 内的所有元素。例如，你可能需要根据用户输入或网页状态隐藏或显示某些内容。通过将所有内容放在一个 `div`\
  \ 中，你可以简单地更新 `div` 属性。\n\n#### 列表元素\n\n现在我们来学习用于列出内容的元素，例如项目符号列表。然而，HTML5 中的列表并不局限于一系列项目符号或编号项。任何时候你有一个事物列表，即使这些“事物”是大的内容块，你也应该考虑将它们创建在这些列表元素之一中。再次强调，这关乎语义；将内容放在列表中可以清楚地表明你在枚举一个列表。\n\
  \n### 列表\n\nHTML5 既支持使用 `ol` 元素的有序列表，也支持使用 `ul` 元素的无序列表。除了有序列表可用的一些额外属性外，它们的工作方式基本相同。对于任何一种列表，元素的顺序都是固定的，由项在列表中的包含顺序决定。根据语义选择合适的类型。如果列表的顺序没有意义，请使用无序列表。例如，如果你列出一些流行的运动，如\
  \ Football、Baseball 和 Basketball，请使用无序列表。相反，如果你要指定最受欢迎的三项运动，你可能希望按受欢迎程度列出它们。在这种情况下，顺序是有意义的，你应该使用有序列表。\n\
  \n无序列表的默认样式是为每个项添加某种类型的项目符号，并且所有项使用相同的符号。对于有序列表，默认样式将使用数字，并且数字将按顺序分配。\n\n列表（无论有序还是无序）中的项由列表项元素\
  \ `li` 表示。可以包含在 `ul` 或 `ol` 元素内的唯一元素是 `li` 元素。但是，你可以在 `li` 元素内放置任何流元素。清单 4-2 展示了一个简单的无序列表和一个有序列表。\n\
  \n使用默认样式，这将呈现如图 4-8. 所示。\n\n***清单 4-2.*** 示例无序列表和有序列表\n\n```html\n<h2>Book Topics</h2>\n\
  \n<ul>\n  <li>HTML</li>\n  <li>CSS</li>\n  <li>JavaScript</li>\n</ul>\n\n<h2>HTML\
  \ Chapters</h2>\n\n<ol start=\"4\">\n  <li>Structural Elements</li>\n  <li>Text\
  \ Elements</li>\n  <li>Table Elements</li>\n  <li>Embedded Elements</li>\n  <li>Form\
  \ Elements</li>\n</ol>\n```\n\n![](img/index-97_1.png)\n\n第 4 章 ■ 结构化 HTML 元素\n\n\
  ***图 4-8.** 示例无序列表和有序列表*\n\n如前所述，有序列表支持一些额外的属性。最常见的是 `start` 属性，我在前面的例子中使用过。在这个例子中，我列出了本书中介绍\
  \ HTML 元素的章节。前三章包含了介绍性材料，因此关于 HTML 的第一章就是本章，[第 4 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_4)。`start`\
  \ 属性指示用于第一个 `li` 元素的数字；在本例中是 4。如果省略，编号将从 1 开始。\n\n`reversed` 属性是一个布尔属性，用于按倒序分配数字。例如，如果你要列出最受欢迎的三项运动并希望将最受欢迎的放在最后，你会使用此属性。编号将是倒序的：3，2，1。如果你未指定\
  \ `start` 属性，则第一个项的数字会被设置为使得最后一个元素为 1。如果你在一个列表中放入十个项并指定了 `reversed` 属性但没有指定 `start`\
  \ 属性，则项将从 10 到 1 编号。如果你同时指定了 `start` 和 `reversed`，第一个项将使用 `start` 属性中指定的值，其余项将依次递减，因此你最终可能得到负数。\n\
  \n> **提示：** `reversed` 属性不会改变 `li` 元素的顺序。它们始终按照在列表中的包含顺序渲染。`reversed` 属性仅影响项的编号。\n\
  \n`type` 属性指定要使用的“编号”类型。以下是支持的值：\n\n- `1` - 使用数字（如果未指定，这是默认值）\n- `A` - 使用大写字母（例如\
  \ A, B, C, D）\n- `a` - 使用小写字母\n- `I` - 使用大写罗马数字（例如 I, II, III, IV）\n- `i` - 使用小写罗马数字\n\
  \n无论为 `type` 指定了什么值，`start` 属性始终是数字。它将被转换为适当的类型表示。例如，如果你指定了 `4` 并且 `type` 是 `I`，则第一个元素将使用\
  \ `IV`。\n\n> **注意：** 字母或罗马数字不支持零或负数。如果需要这些值，它们将以数字形式显示。例如，如果你在列表中有五个项，并将 `ol` 元素指定为\
  \ `<ol start=\"3\" type=\"a\" reversed>`，则编号将是 `c, b, a, 0, -1`。\n\n你可以使用列表来呈现一系列链接，例如菜单。例如：\n\
  \n```html\n<nav>\n  <h1>Navigation</h1>\n  <ul>\n    <li><a href=\"/\">Home</a></li>\n\
  \    <li><a href=\"http://www.apress.com\">Apress</a></li>\n    <li><a href=\"http://www.theCreativePeople.com\"\
  >My Site</a></li>\n  </ul>\n</nav>\n```\n\n这将显示一个带项目符号的链接列表。但是，使用 CSS，你可以以多种方式呈现它，包括按钮或水平排列的链接。我将在[第\
  \ 13 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_13)中演示这一点。\n\n## 描述列表\n\n描述列表元素\
  \ `dl` 用于定义术语列表。它被实现为一组名称/值对。它常用于创建词汇表。在这种情况下，名称是要定义的术语，值是这些术语的定义或描述。你可以在 `dl` 元素内放置一系列术语元素\
  \ `dt` 和描述元素 `dd`。\n\n例如，一个简单的 `dl` 元素可能像这样使用：\n\n```html\n<dl>\n  <dt>Term1</dt>\n\
  \  <dd>Definition</dd>\n  <dt>Term2</dt>\n  <dd>Definition</dd>\n</dl>\n```\n\n\
  > **注意：** 在 HTML4 中，`dl` 元素被称为定义列表，旨在定义一个术语列表。HTML5 中的语法没有改变，但名称已更改为描述列表，以传达该元素的更广泛用途。在\
  \ HTML5 中，它用于提供术语/描述对的组合。\n\n清单 4-3 说明了如何使用此模式来列出一系列书籍以及每本书的描述。图 4-9 显示了在仅使用默认格式的浏览器中将如何显示。\n\
  \n![](img/index-99_1.png)\n\n第 4 章 ■ 结构化 HTML 元素\n\n***清单 4-3.*** 使用 dl、dt 和 dd\
  \ 元素\n\n```html\n<dl>\n  <dt>Beginning WF</dt>\n  <dd>\n    Indexed by feature so\
  \ you can find answers easily and written in an accessible style,\n    Beginning\
  \ WF shows how Microsoft's Workflow Foundation (WF) technology can be used in a\
  \ wide\n    variety of applications.\n  </dd>\n  <dt>Office 2010 Workflow</dt>\n\
  \  <dd>\n    Workflow is the glue that binds information worker processes, users,\
  \ and artifacts—\n    without it, information workers are just islands of data and\
  \ potential. Office 2010 Workflow\n    walks you through implementing workflow solutions.\n\
  \  </dd>\n  <dt>Pro Access 2010 Development</dt>\n  <dd>\n    Pro Access 2010 Development\
  \ is a fundamental resource for developing business\n    applications that take\
  \ advantage of the features of Access 2010. You'll learn how to build\n    database\
  \ applications, create Web-based databases, develop macros and VBA tools for Access\n\
  \    applications, integrate Access with SharePoint, and much more.\n  </dd>\n</dl>\n\
  ```\n\n***图 4-9.** 渲染描述列表*\n\n\n\n然而，你并不局限于这种一对一映射。`dl` 元素的另一种用途是列出带有分组标题的事物组。你可以通过使用\
  \ `dt` 元素作为分组标题，`dd` 元素作为组成员来实现这一点。例如，清单 4-4 包含了纽约洋基队的首发阵容，按位置类别整理。图 4-10 显示了该内容的默认渲染效果。\n\
  \n![index-100_1.png](img/index-100_1.png)\n\n**清单 4-4.** 为每个术语使用多个描述元素\n\n```\n\
  <h2>New York Yankees Starting Lineup</h2>\n\n<dl>\n\n<dt>内野手</dt>\n\n<dd>Teixeira,\
  \ 一垒手</dd>\n\n<dd>Castro, 二垒手</dd>\n\n<dd>Gregorius, 游击手</dd>\n\n<dd>Torreyes, 三垒手</dd>\n\
  \n<dd>McCann, 捕手</dd>\n\n<dt>外野手</dt>\n\n<dd>Hicks, 左外野手</dd>\n\n<dd>Ellsbury, 中外野手</dd>\n\
  \n<dd>Ackley, 右外野手</dd>\n\n<dt>指定打击</dt>\n\n<dd>Rodriguez, DH</dd>\n\n<dt>投手</dt>\n\
  \n<dd>Gausman, 右投</dd>\n\n<dd>Wilson, 右投</dd>\n\n<dd>Tillman, 右投</dd>\n\n<dd>Price,\
  \ 左投</dd>\n\n<dd>Porcello, 右投</dd>\n\n</dl>\n```\n\n**图 4-10.** 纽约洋基队首发阵容\n\n另一种可能是让多个术语引用同一个描述项。你也可以这样做，但需要将同类术语放在一起。例如：\n\
  \n```\n<dl>\n\n<dt>Hicks, 左外野手</dt>\n\n<dt>Ellsbury, 中外野手</dt>\n\n<dt>Ackley, 右外野手</dt>\n\
  \n<dd>外野手 - 棒球中在内场菱形区域后方草地（即外场）上进行防守的位置。这些位置包括左外野手、中外野手和右外野手。</dd>\n\n</dl>\n```\n\
  \n`dt` 元素理应相对简短，例如一个单词或短语。对于 `dt` 元素中可以包含哪些类型的元素，有特定的限制。你不能在 `dt` 元素内部使用标题、页脚或任何分区内容。即便如此，也并没有什么能阻止你在\
  \ `dt` 元素中包含段落的文本内容。然而，从语义规则的角度来看，这样做是不恰当的。`dl` 元素用于描述术语列表，而一个文本段落并非术语。\n\n`dd`\
  \ 元素则没有此类限制。你可以在 `dd` 元素中放置任何流式内容，包括分区内容和嵌入内容。\n\n#### 内联框架\n\n`iframe` 元素用于在当前文档中嵌入另一个网页。我将在此简要介绍，我们将在第\
  \ 17 章更详细地探讨。你可以使用如下标记包含一个 `iframe`：\n\n```\n<iframe src=\"http://www.apress.com\"\
  \ width=\"100%\" height=\"400\">\n\n<p>您的浏览器不支持 iframe</p>\n\n</iframe>\n```\n\n\
  只有在浏览器不支持 `iframe` 元素时，`iframe` 元素内部的容才会被渲染。`iframe` 元素支持多个属性，可用于配置元素的渲染方式以及允许哪些选项。\n\
  \n- `allowfullscreen` - 如果指定了此布尔属性，则嵌入页面中的脚本可以通过调用 `requestFullScreen()` 方法切换到全屏模式。\n\
  - `height` - `iframe` 元素的高度，以像素或相对于父页面的百分比表示。\n- `name` - 当从父文档中提供指向 `iframe` 的链接时，可以使用\
  \ `name` 属性。\n- `sandbox` - 可用于限制在嵌入页面中可以执行的操作。这将在第 17 章中介绍。\n- `src` - 用于指定要嵌入的页面的\
  \ URL。\n- `srcdoc` - 如果指定并受支持，`srcdoc` 属性将覆盖 `src` 属性的值。这通常与 `sandbox` 属性一起使用。\n\
  - `width` - `iframe` 元素的宽度，以像素或相对于父页面的百分比表示。\n\n## 已弃用的元素\n\n一些分组元素已从 HTML5 规范中移除。我将在此简要描述它们。为了确保向后兼容性，这些元素可能还会被支持一段时间。但是，你不应在任何新的开发工作中使用它们。\n\
  \n`hgroup`\n\n\n\n### `hgroup` 元素\n\n`hgroup` 元素曾用于对 `h1`–`h6` 元素进行分组，并在文档大纲中仅保留第一个标题，隐藏其余标题。例如，若你希望为某个章节同时设置主标题和副标题，可能会使用\
  \ `h1` 元素作为主标题，`h2` 作为副标题。然而，`h2` 元素会在文档大纲中开始一个新的章节。\n\n将两者放入 `hgroup` 元素中，则只会创建一个单独的章节，并使用\
  \ `h1` 标题。\n\n建议的做法是，不使用 `hgroup` 元素，而是将主标题和副标题放入 `header` 元素中。主标题应使用 `h1`–`h6`\
  \ 元素来定义章节，并加入文档大纲。其余标题内容，如副标题或标语，应放在 `p` 或 `span` 标签中，然后通过 CSS 进行适当的样式设置。更多信息和示例，请参阅\
  \ W3C 规范：\n\n[`www.w3.org/TR/html5/common-idioms.html#sub-head`](http://www.w3.org/TR/html5/common-idioms.html#sub-head)\n\
  \n### `dir` 元素\n\n目录列表 (`dir`) 元素曾用于展示目录列表。此列表中的项目包含在 `li` 元素中。`dir` 元素在 HTML5 中已被弃用。你应该使用无序列表\
  \ (`ul`) 代替。\n\n### `frame` 和 `frameset` 元素\n\n`frame` 和 `frameset` 元素曾用于将页面组织成多个部分。这包括逻辑分区和页面布局。逻辑分区现在可以借助我之前介绍的分区内容来实现，例如\
  \ `section`、`aside` 和 `article`。布局则通过 CSS 配置，我将在第 [13](http://dx.doi.org/10.1007/978-1-4842-2463-2_13)\
  \ 章中进行演示。\n\n#### 小结\n\n在本章中，我演示了用于组织内容的所有 HTML 元素。这些元素为内容分组提供了语义含义。\n\n文档通过使用分区内容来组织，以定义文档的较大区块。这些内容与标题元素\
  \ (`h1`–`h6`) 共同定义了文档大纲。`header` 和 `footer` 元素用于标识文档级别以及章节内的引言和结论内容。\n\n分区根元素包括\
  \ `blockquote`、`details` 和 `figure` 元素，它们拥有自己的章节，不影响文档大纲。\n\n还有其他几个分组元素不影响大纲，但在较低层面提供语义分组。这些包括\
  \ `main`、段落 (`p`)、水平线 (`hr`) 和分区 (`div`) 元素。\n\n预格式化 (`pre`) 元素主要用于保留内容的格式，而非出于语义原因。最后，有序列表\
  \ (`ol`)、无序列表 (`ul`) 和描述列表 (`dl`) 提供了呈现项目列表的方式。\n\n通过使用这些元素，你可以为内容提供语义细节，这将使得应用一致的样式规则更加容易。即使没有自定义\
  \ CSS，文档也会开始呈现出“形状”，因为默认样式会根据每个元素的语义目的一致地渲染内容。\n\n清单 4-5 中显示的 HTML 文档演示了本章描述的所有技术。\n\
  \n此文档也可在源代码下载中找到。在下一章中，我将开始在此结构上放置一些实际内容。我将解释为文本内容提供语义含义的各种元素。\n\n## 第 4 章 ■ 结构性\
  \ HTML 元素\n\n***清单 4-5.*** 第 4 章的完整 HTML 文档\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"author\" content=\"Mark\
  \ J Collins\" />\n<meta name=\"description\" content=\"Sample HTML document\" />\n\
  <title>HTML5 Sample</title>\n<link rel=\"stylesheet\" href=\"Initial.css\" />\n\
  <link rel=\"stylesheet\" href=\"Print.css\" media=\"print\" />\n<link rel=\"icon\"\
  \ type=\"image/x-icon\" href=\"HTMLBadge.ico\" />\n<link rel=\"alternate\" type=\"\
  application/pdf\" href=\"MainPage.pdf\" />\n<link rel=\"author\" href=\"mailto:markc@thecreativepeople.com\"\
  \ />\n</head>\n```\n\n\n\n"
