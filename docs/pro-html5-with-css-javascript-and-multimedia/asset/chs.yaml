  \ 全局属性\n\n以下属性在所有 HTML 元素中都受支持。\n\n#### 通用属性\n\n- `accesskey` - 用于定义键盘快捷键，以激活或聚焦此元素。实际触发该快捷键的键盘组合取决于浏览器和操作系统。更多信息请参阅这篇文章：[`developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/accesskey`](https://developer.mozilla.org/en-US/docs/Web/HTML/Global_attributes/accesskey)。\n\
  - `id` - 一个唯一标识符，这是一个不能包含任何空格字符的字符串，并且在整个 HTML 文档中必须唯一。\n- `tabindex` - 一个整数，指定使用\
  \ Tab 命令时导航到该元素的顺序。\n\n#### 格式化属性\n\n- `class` - 一个以空格分隔的分类列表，主要用于应用样式。\n- `hidden`\
  \ - 一个布尔属性，如果存在，表示该元素当前不可见。\n- `style` - 包含一个或多个 CSS 声明，用于为元素提供内联样式。\n\n#### 文本属性\n\
  \n- `dir` - 指示文本方向，`ltr` 或 `rtl`。默认值为 `auto`，将根据其内容的字符集以及继承的值进行设置（详情请参见第 [5](http://dx.doi.org/10.1007/978-1-4842-2463-2_5)\
  \ 章）。\n- `lang` - 指示内容的语言。\n- `spellcheck` - 一个布尔属性，如果存在，表示应对文本进行拼写和语法验证。\n- `translate`\
  \ - 如果浏览器翻译页面时应该翻译元素的内容，则设置为 `yes`；如果不应该翻译，则设置为 `no`。\n\n#### 拖放属性\n\n（详情请参见第 [24](http://dx.doi.org/10.1007/978-1-4842-2463-2_24)\
  \ 章）\n\n- `draggable`\n- `dropzone`\n\n#### 其他属性\n\n- `contenteditable` - 如果内容可编辑，则设置为\
  \ `true` 或空字符串；如果不可编辑，则设置为 `false`。\n- `contextmenu` - 指示某个上下文菜单的 `id`（目前浏览器支持度较低）。\n\
  - `data-*` - 这些是自定义属性，浏览器不会使用，但在客户端脚本中很有用。\n\n\n# 自闭合标签\n\n- `title` - 关于一个元素的附加信息。\n\
  \n## 自闭合标签\n\n以下 HTML5 元素是自闭合标签，这意味着它们没有单独的开放标签和闭合标签。这也意味着除了属性之外，它们也没有任何内容，因为内容位于开放标签和闭合标签之间。这些也被称为空元素或\
  \ void 元素。\n\n- `<area />` - 图像中的一个可选区域\n- `<base />` - 文档中任意相对路径的根路径\n- `<br />`\
  \ - 一个换行符，呈现效果类似于回车\n- `<col />` - 定义表格中的一列\n- `<embed />` - 嵌入的内容\n- `<hr />` -\
  \ 水平分割线，用于表示主题变化\n- `<iframe />` - 在当前文档中嵌入另一个网页\n- `<img />` - 一张图片或照片\n- `<input\
  \ />` - 一个输入字段，例如表单中的文本框或复选框\n- `<link />` - 链接外部资源或相关资源\n- `<meta />` - 提供关于当前文档的元数据\n\
  - `<param />` - 对象元素内部的一个参数\n- `<source />` - 用于引用视频或音频元素的源\n- `<track />` - 指定视频或音频元素的轨道\n\
  - `<wbr />` - 一个单词换行机会，表明此处可以换行\n\n在 HTML5 中，自闭合标签末尾的“/”是可选的，斜杠前的空格也是可选的。然而，在使用\
  \ XHTML（例如使用 XML MIME 类型）时，斜杠是必需的，不过这种情况通常很少见。但我曾见过一些应用程序试图通过一个简单的 XML 验证器来运行 HTML\
  \ 以进行验证，如果缺少斜杠字符，验证器会报错。\n\n在 Web 开发者中，关于是否包含斜杠字符似乎存在着相当激烈的争论。然而，那些反对使用斜杠的人主要是出于可读性的考虑，这实际上是一个个人偏好的问题。\n\
  \n# 输入类型\n\n单个`input`元素用于所有类型的数据输入，从复选框到日期选择器。`type`属性定义了`input`元素的功能。支持的`type`如下所列。\n\
  \n| 类型 | 描述 | 备注 |\n|------|------|------|\n| `button` | 一个按钮，没有默认操作 | |\n| `checkbox`\
  \ | 一个复选框 | 使用`checked`属性来默认选中 |\n| `color` | 选择一种颜色 | 选择颜色的用户界面可能因浏览器而异 |\n| `date`*\
  \ | 选择日期，不包含时间元素 | |\n| `datetime-local`* | 选择日期和时间 | 未定义时区，这是浏览器的本地时间 |\n| `email`\
  \ | 一个接受有效电子邮件地址的文本框 | 验证仅检查格式。如果要输入多个电子邮件，请使用`multiple`属性 |\n| `file` | 从客户端设备中选择一个文件\
  \ | `accept`属性指定允许的文件类型。使用`multiple`属性来选择多个文件 |\n| `hidden` | 没有用户界面，但可以有一个随表单一起提交的值\
  \ | |\n| `image` | 一个显示图像的按钮 | 使用`src`属性定义要使用的图像 |\n| `month`* | 一个仅选择月份和年份（无日）的日期选择器\
  \ | |\n| `number` | 一个接受数值的文本框 | |\n| `password` | 输入被隐藏，例如每个字符显示为星号 | |\n| `radio`\
  \ | 类似于复选框，但同一组中只能选中一个 | |\n| `range` | 一个选择相对值的滑块 | `min`、`max`和`step`属性定义了其功能\
  \ |\n| `reset` | 一个将输入字段重置为原始默认值的按钮 | |\n| `search` | 用于输入搜索条件的文本框 | |\n| `submit`\
  \ | 默认操作为提交表单的按钮 | |\n| `tel` | 一个接受有效电话号码的文本框 | 必须通过`pattern`属性提供格式规则 |\n| `text`\
