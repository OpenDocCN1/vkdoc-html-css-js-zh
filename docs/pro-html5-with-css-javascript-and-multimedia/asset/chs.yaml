- "# 排版结果\n\n此处的思路是，你引用其他来源的内容，并因该内容在当前语境中的相关性而添加强调。关键点在于，与强调元素（importance）和着重元素（emphasis）的区别是，这种强调并非原文原有，而是后加的，只因它在当前语境中具有相关性。\n\
  \n这种做法有两种常见应用场景。首先，你可以使用关联元素（mark）来高亮引用内容中与当前用法特别相关的部分。例如：\n\n```html\n<p>\n\"请仔细听好了：**<mark>**\
  \ 不会增加新税收**</mark>** \"，总统候选人乔治·H·W·布什在 1988 年宣称。然而，1990 年的预算协议却在多个领域增加了税收。\n</p>\n\
  ```\n\n默认样式会将背景色设置为黄色，如图 5-1 所示。\n\n![图 5-1. 使用关联元素高亮文本](img/index-108_1.png)\n\n\
  关联元素的第二个常见用途是在显示搜索结果时。它用于高亮显示符合指定搜索条件的单词或短语。例如，如果某人搜索“HTML”这个词，而页面显示了包含该文本的文章。在这种情况下，你可能需要高亮显示所有出现“HTML”文本的地方。关联元素（mark）正是用于实现这一目的。\n\
  \n**提示** 请记住，关联元素（mark）用于高亮从其他来源引用的文本，且原文中原本并没有强调。不要用它来强调原创文本；而应使用其他元素，例如强调元素（importance）或着重元素（emphasis）。\n\
  \n## 替代语音 (i)\n\n`i` 元素在 HTML4 中用于表示斜体显示，但在 HTML5 中被赋予了语义含义。以下是 W3C 规范对其的描述：\n\n\
  *`i` 元素代表一段与周围内容相隔离的文本，不传达任何额外的强调或重要性，其传统排版表现为斜体文本；例如，生物分类学名称、技术术语、来自其他语言的惯用短语、一段思绪或船名。*\n\
  \n本质上，当文本需要以与周围文本不同的样式呈现，但你无需暗示任何更高的重要性或强调时，就应该使用 `i` 元素。遗憾的是，这个定义并非十分具体，且往往与我接下来要描述的\
  \ `b` 元素有所重叠。\n\n然而，规范进一步提供了适合使用 `i` 元素的示例。这些场景可以概括为使用一种*替代语音*，我认为这有助于理解该元素何时适用。\n\
  \n如果文本引用了某人的话语，而你希望在其中插入一段思绪，请使用此元素，例如：\n\n```html\n<p>\n\"同学们，注意了！\" **<i>** 我怀疑他们到底有没有在听我说话。\
  \ **</i>** \"谁准备好明天的考试了？\"\n</p>\n```\n\n这段思绪是一种不同的语音，因为它是在头脑中而非从口中说出的。另一个例子是当某人用英语说话时，引用了一个外来词或短语。这与文本其余部分语音不同，因为它是一种不同的语言。\n\
  \n```html\n<p>\n\"这需要一些... **<i>** 我说不出的气质**</i>** 。\"\n</p>\n```\n\n该概念的另一种应用是使用技术术语。此处语音发生了变化，因为它从日常英语变成了熟悉度有限的术语。\n\
  \n```html\n<p>\n\"他并非真的秃顶，只是他的头上严重缺乏 **<i>** 毛囊菌**</i>** 。\"\n</p>\n```\n\n在所有这些示例中，文本都通过替代语音\
  \ (i) 元素进行标识，以指示语音或语气的变化：无论是从一种语言切换到另一种语言，从言语转为内心独白，还是从日常用语切换为技术行话。默认样式会将其渲染为斜体，如图\
  \ 5-2 所示。\n\n![图 5-2.](img/index-109_1.png)\n\n\n\n### **图 5-2.** 备选声音元素的渲染效果\n\n\
  #### `small`（小号文本）\n\n你是否听过“阅读小字”这种说法？通常指那些虽然有时被忽略，但却很重要的法律术语。HTML5 定义了 `small`\
  \ 元素，你可以将这类内容放入其中。\n\n`small` 元素适用于提供与主要内容通常无关的细节性短文本。\n\n请使用 `small` 元素来放置版权信息、免责声明或其他法律信息。你也可以用它来包含披露声明、许可详情，或注明材料来源。不要将\
  \ `small` 元素用于主文档流之外的大块内容，这类情况应使用 `aside` 元素。\n\n■ **注意** 在 HTML4 中，`small` 元素被用来使字体变小。而在\
  \ HTML 中，它已被重新定义为提供语义含义，尤其是针对法律细节。不要仅仅为了让字体变小而使用 `small` 元素，这一操作应在 CSS 中完成。\n\n\
  `small` 元素并不暗示任何较低的重要性。事实上，`small` 元素中的细节往往非常重要。如果内容是主流程之外的法律细节，请将其放入 `small` 元素中。如果它同时也是重要信息，还应将其包含在表示重要性的元素（`strong`）内。\n\
  \n#### 删除线（`s`）\n\n删除线元素（`s`）用于表示不再具有*相关性*或*准确性*的内容。“相关”和“准确”这两个术语来自 HTML5 规范，是你在判断删除线元素是否为语义正确选择时需要考虑的关键概念。\n\
  \n■ **警告** 在 HTML4 中，`s` 和 `strike` 元素都受支持，用于以删除线字体渲染文本。但在 HTML5 中，`strike` 元素已被废弃。\n\
  \n在大多数情况下，如果信息不准确，你通常会直接修正；不相关的数据则会删除或替换。然而，如果你希望突出显示已做出的更改，可以保留旧文本，但将其包裹在删除线元素中，如下所示：\n\
  \n```\n<p>\n  限时优惠 **<s>$9.95</s>** $7.99 即可获得...\n</p>\n```\n\n在此例中，`$9.95` 的价格已不再准确，价格已更新为\
  \ `$7.99`。但显示先前价格是为了展示降价幅度。\n\n■ **提示** 不要使用删除线元素来表示已删除的文本。用于此目的的是删除（`del`）和插入（`ins`）元素，我将在本章后面进行解释。\n\
  \n假设你有一个页面，列出了某支体育队伍所有主场比赛的日期和时间。这些信息可能每个都链接到可预订比赛座位的页面。那么，你可以将所有已结束或已售罄的比赛放入删除线元素中。你保留这些比赛列表，因为它们可能是有用的信息，但对于当前预订座位的目的而言已不相关。\n\
  \n在我给出的示例中，删除线元素内的内容都是文本，默认样式会以删除线字体渲染。然而，删除线元素用于其语义含义，因此它也适用于其他类型的内容，如图像、音频/视频以及输入控件。你需要在\
  \ CSS 中定义如何渲染不准确或不相关的图像，但将其包含在 HTML 的删除线元素内，在语义上绝对是有效的。\n\n#### 文体偏移（`b`）\n\nHTML4\
  \ 中的旧加粗元素（`b`）在 HTML5 中被重新定义为**文体偏移**内容，且不传递重要性。我在这里用了一个非常清晰的名称来称呼它：*文体偏移*。以下是 HTML5\
  \ 规范对其的定义：\n\n*`b` 元素表示一段文本区间，出于实用目的而吸引注意力，但不传递任何额外的重要性，也不暗示存在替代性内容。*\n\n\n\n"
- "# HTML 语义化元素指南\n\n## 语气或情绪\n\n例如文档摘要中的关键词、评论中的产品名称、交互式文本驱动软件中的可操作词或文章导语。\n\n换句话说，当文本需要以某种方式突出显示，而之前描述的其他元素都不适用时，应使用此元素。它并不重要，不需要任何强调，也不反映另一种语气或情绪。然而，出于其他原因，你希望引起读者对此文本的注意。\n\
  \n规范继续列举了一些应使用样式偏移（`stylistically offset`）元素的示例：\n\n- 关键词\n- 产品名称\n- 可操作词\n- 文章导语（开头段落）\n\
  \n由于此元素是故意通用的，最好包含一个`class`属性，指明该元素为何需要突出显示。这不仅明确了语义含义，还使`CSS`能够根据使用原因进行不同的样式设置。例如：\n\
  \n```html\n<p>\n  文本高亮元素包括<b class=\"keyword\">重要性</b>、\n  <b class=\"keyword\"\
  >强调</b>以及<b class=\"keyword\">另一种语气</b>。\n</p>\n```\n\n**提示：** 样式偏移元素（`<b>`）是最通用的元素，仅应在没有更具体的元素适用时使用。\n\
  \n## 未明确说明的内容（`<u>`）\n\n下划线元素（`<u>`）在`HTML4`中用于指定应加下划线的文本。除了像`<b>`和`<i>`元素那样纯粹的表现性之外，`<u>`元素也常被避免使用，因为带下划线的文本常被误认为是超链接。然而，`<u>`元素在`HTML5`中被赋予了“未明确说明内容”（*unarticulated*）的语义含义。\n\
  \n规范对于何时使用此元素并不十分明确，仅举了两个示例：拼写错误的单词和中文专有名词。规范的实际定义是：“一种未明确说明、但明确呈现的非文本注释。”本质上，这意味着当你需要注释文本（让其以不同格式显示）但没有其他元素能清晰定义你这样做的原因时，应使用`<u>`元素。\n\
  \n规范进一步指出，通常有更合适的元素可用：\n\n> 在大多数情况下，另一个元素可能更合适：表示加重语气应使用`<em>`元素；表示关键词或短语，根据上下文应使用`<b>`元素或`<mark>`元素；表示书名应使用`<cite>`元素；为文本标注明确的文本注释应使用`<ruby>`元素；表示科技术语、分类名称、音译、某种想法或西方文本中的船名，应使用`<i>`元素。\n\
  \n换句话说，请将此作为最后的手段。那么何时应使用`<u>`元素？让我们看看给出的两个示例。当指示拼写错误的单词时，标准惯例是加下划线。同样，为中文专有名词加下划线也是一种标准做法。在西方语言中，专有名词通过首字母大写来指示。而在中文中，指示专有名词的方法则是加下划线。因此，如果你包含中文内容，专有名词应包含在`<u>`元素中。\n\
  \n对于这两个示例，你都有需要以某种方式注释的文本；其他元素均不具备合适的语义含义，且公认的惯例是加下划线。然而，通常情况下，只要没有更具体的元素适用，你都可以使用`<u>`元素。\n\
  \n与`<b>`元素一样，你应该包含一个`class`属性来说明文本被注释的原因，因为元素本身并不能明确这一点。例如，以下内容突出显示了文中的拼写、语法和用词错误：\n\
  \n```html\n<p>\n  请务必**<u class=\"spelling\">检查</u>**你的**<u class=\"usage\">四</u>**个拼写**<u\
  \ class=\"grammar\">错误</u>**。\n</p>\n```\n\n你可以在`CSS`中使用`class`属性来改变下划线的颜色。例如，对拼写错误使用红色下划线，对语法错误使用绿色下划线。\n\
  \n**提示：** 如果你只想简单地给文本加下划线，而不表示“未明确说明的标注”的语义含义，请将文本放入`<span>`标签中，并使用`CSS`应用下划线样式。\n\
  \n## 元素回顾\n\n我用英语写这本书，并且假设你们中的大多数人都能相当流利地阅读英语。然而，`HTML`用于渲染世界上任何语言。重要性、强调等语义概念是通用的，但它们在网页上的物理表示方式可能因语言或文化而异。这也是内容作者应关注这些元素的语义含义而非其默认表示的另一个原因。\n\
  \n- **重要性** - `<strong>` - 不应错过的关键点或核心概念\n- **强调** - `<em>` - 以强调方式阅读，发音不同的内容\n\
  - **相关性** - `<mark>` - 为参考目的而高亮显示的文本\n- **另一种语气** - `<i>` - 外来词、科技术语等\n- **小号文本**\
  \ - `<small>` - 主流程之外的法律细节短文本\n- **删除线** - `<s>` - 不再准确或相关的内容\n- **样式偏移** - `<b>`\
  \ - 需要突出显示的关键词或其他短语\n- **未明确说明的内容** - `<u>` - 指示拼写或语法错误、专有名词或姓氏\n\n**提示：** W3C 提供了一篇简短但有用的文章，解释了更通用的元素`<b>`和`<i>`应在何时以及如何使用。可以在\
  \ [`www.w3.org/International/questions/qa-b-and-i-tags`](http://www.w3.org/International/questions/qa-b-and-i-tags)\
  \ 找到。我建议通读此文，其中的示例非常有帮助。\n\n### 其他语义短语\n\n`HTML5`提供了几个具有非常特定用途的元素。如果这些元素符合你正在添加的内容，请使用它们来提供适当的语义信息。\n\
  \n### 代码、示例、键盘输入和变量\n\n如果你在记录一个计算机应用程序，`<code>`、`<kbd>`和`<samp>`元素有助于区分这些类型的内容。`<var>`元素在此场景以及其他场景（如包含公式）中也很有用。这些都属于内联短语元素，通常不跨段落。\n\
  \n`<code>`元素表示某种计算机代码的一部分，通常是源代码或某种计算机脚本。它也可以用于文件名、数据库表或服务器名。基本上，`<code>`元素用于任何计算机程序可识别的文本。\n\
  \n**提示：** 没有明确的机制来指示源代码的计算机语言。然而，建议使用`class`属性，并以`language-`为前缀。例如：\n\n```html\n\
  <code class=\"language-javascript\">Item.prototype.isAvailable = true;</code>\n\
  ```\n\n在我看来，接下来的两个元素`<kbd>`和`<samp>`命名不当。`<kbd>`元素标识输入到计算机中的内容，例如键盘输入。相反地，`<samp>`元素用于指示某种计算机输出的内容，例如屏幕上的提示符或写入控制台窗口或日志文件的文本。规范有时称此为样本输出，`samp`这个名字即由此而来。\n\
  \n这里的关键点是：`<kbd>`用于输入，`<samp>`用于输出。它们也可以用在`<code>`元素内，因为它们都是计算机程序可识别的。然而，`<kbd>`和`<samp>`更具体，在适当的情况下应优先于`<code>`使用。\n\
  \n\n\n如果代码片段超过一行，应将代码元素包含在预格式化（`pre`）元素内。正如前一章所述，预格式化元素会保留空白字符，并完全按照输入时的原样渲染内容。\n\
  \n在代码片段内部，可以使用变量元素（`var`）来标识变量，这有助于提高代码的可读性。变量元素的默认样式是使用斜体字体。\n\n以下 HTML 代码包含一段\
  \ `JavaScript` 代码。其默认渲染效果见图 5-3。\n\n```\n<pre>\n<code class=\"language-javascript\"\
  >\nthis.log = function () {\n\tconsole.log(\"Quantity: \" + <var> this.count</var>\
  \ + \", Color: \" + <var> this.color</var> );\n};\n</code>\n</pre>\n```\n\n***图\
  \ 5-3.** 使用 code、pre 和 var 元素*\n\n**提示** 键盘元素（`kbd`）和示例元素（`samp`）用于语义目的，指示内容是向计算机程序输入或从计算机程序输出的内容。它们也可以嵌套使用。例如，当输出的某部分是被回显到屏幕上的输入时，输入应放在键盘元素内，而整个输出则应放在示例元素内。\n\
  \n变量元素也可以在其他上下文中使用。例如：\n\n`<p>长度为 <var> l</var>、宽度为 <var> w</var> 的矩形的面积为 <var>\
  \ l</var> * <var> w</var> 。</p>`\n\n## 缩写词与定义\n\n缩写元素（`abbr`）用于包含缩写词或首字母缩略词的完整形式。\n\
  \n缩写形式作为元素的内容提供（位于开始和结束标签之间）。`title` 属性包含缩写词的完整版本，该版本在鼠标悬停于缩写词上之前不会显示。\n\n例如，以下代码在缩写元素中使用了术语\
  \ `HTML`，其渲染效果见图 5-4。\n\n`<p>使用 <abbr title=\"超文本标记语言\"> HTML</abbr> 极大地促进了基于 Web\
  \ 的应用程序的普及。<br /></p>`\n\n***图 5-4.** 显示缩写词*\n\n`title` 属性是可选的。如果没有 `title` 属性，缩写元素仅表明所包含的文本是一个缩写词或首字母缩略词。这可能会很有用，尤其是在你想应用不同样式时。如果指定了\
  \ `title` 属性，它应仅包含完整形式。如果用完整形式替换缩写词，句子应仍然读得通。\n\n定义实例元素（`dfn`）用于标识正在被定义的术语。将被定义的术语放在定义实例元素内，而实际的定义放在该元素之外，通常在其后面。例如，以下代码表明术语\
  \ `HTML` 正在被定义。\n\n`<p><dfn>HTML</dfn> 是一种添加语义信息以支持内容丰富格式化的标准化方式。</p>`\n\nW3C 规范规定，如果使用了\
  \ `dfn` 元素，则最近的父元素必须包含对该 `dfn` 元素内术语的定义。在此示例中，包含 `dfn` 元素的段落元素也包含了该术语的定义。\n\n定义实例元素的默认样式是以斜体显示文本。在本书中，术语首次出现时以斜体显示，后跟其定义。定义实例元素为此技术提供了语义框架。\n\
  \n与缩写元素一样，你也可以包含一个 `title` 属性，当鼠标悬停在该元素上时会显示该属性。此外，如果你希望能够在文档后面再次使用该术语时引用该定义，可以包含一个\
  \ `id` 属性。例如，此标记演示了同时使用 `title` 和 `id` 属性。在第二段中，使用了术语 `HTML` 并带有一个指向最初定义的链接。\n\n\
  `<p><dfn id=\"htmlDef\" title=\"超文本标记语言\" >HTML</dfn> 是一种添加语义信息以支持内容丰富格式化的标准化方式。<br\
  \ /></p>`\n\n`<p>学习 <a href=\"#htmlDef\"> HTML</a> 当然是值得且有收获的。</p>`\n\n当被定义的术语也是一个缩写词或首字母缩略词时，你可以像这样同时使用缩写元素和定义实例元素：\n\
  \n`<p><dfn><abbr title=\"超文本标记语言\">HTML</abbr></dfn> 是一种添加语义信息以支持内容丰富格式化的标准化方式。</p>`\n\
  \n你可以通过在定义实例元素中简单地包含 `title` 属性来实现悬停文本展开缩写。然而，使用缩写元素提供了语义含义，明确了 `title` 是缩写词的完整形式。\n\
  \n## 下标与上标\n\n如果你需要将文本显示为下标，请使用下标元素（`sub`）。这会使字符比其他字符略微降低。类似地，使用上标元素（`sup`）可以使文本显示得更高。例如，以下代码的渲染效果见图\
  \ 5-5。\n\n`<p>H<sub> 2</sub> O 是水的化学分子式。<br />e=mc<sup> 2</sup> 是质能等价公式。</p>`\n\n\
  ***图 5-5.** 使用下标和上标*\n\n**注意** 不应纯粹出于展示目的使用下标和上标元素。仅当不使用它们会改变内容含义时才应使用。例如，没有上标的\
  \ `e=mc2` 含义不同；上标中的字符 `2` 意味着变量应被平方。同样，在某些语言中，字符的上标或下标会改变单词的含义。\n\n下标元素也可以作为变量元素（`var`）的一部分使用，我之前演示过这一点。\n\
  \n## 时间\n\n`time` 元素允许你为指向时间点的文本提供语义含义。然后你可以使用 `datetime` 属性来包含一个机器可读的版本。例如：\n\n\
  `<p>您的复诊预约将在 <time datetime=\"2016-06-28\"> 星期二</time> 后的一周。</p>`\n\n`datetime`\
  \ 属性不会显示；它仅提供给可能需要访问此信息的脚本和其他应用程序使用。如果你希望显示实际日期，请将其放在 `time` 元素的内容部分。\n\n如本例所示，`datetime`\
  \ 属性可以包含一个特定的日期。它也可以同时指定时间和日期，或者仅指定时间本身。`datetime` 属性的格式有多种不同方式。W3C 规范提供了许多带有示例的详细信息，可以在\
  \ `http://www.w3.org/TR/html5/text-level-semantics.html#the-time-element` 找到。\n\n\
  ## 编辑\n\n如果你想显示对文档所做的更改，可以将它们包含在插入元素（`ins`）和删除元素（`del`）中。将从原始版本中删除的内容放在删除元素中，并将添加的内容放在插入元素（`ins`）中。如果文本发生了变化，请将原始版本放在删除元素中，将新版本放在插入元素中。\n\
  \n例如，以下 HTML 显示了《独立宣言》初稿在最终版本发布前是如何被编辑的。\n\n`<p>我们认为这些真理是`\n\n\n\n**<del cite=\"\
  https://www.loc.gov/exhibits/declara/ruffdrft.html\" datetime=\"1776-06-28\">**\
  \ 神圣\n\n& 不可否认；**</del><ins>** 不言而喻，**</ins>** 人人生而平等<del> & 独立**</del>** ，**<del>**\
  \ 从这种平等诞生中，他们获得了固有且不可剥夺的权利**</del><ins>** 造物主赋予他们若干不可剥夺的权利**</ins>** ，**<del>**\
  \ 其中包括保护生命、自由和追求幸福的权利；**</del><ins>** 其中包括生命权、自由权和追求幸福的权利。**</ins>**\n\n这些元素的默认样式是对新文本加下划线，对删除文本加删除线，如图\
  \ e 5-6.所示。\n\n![](img/index-117_1.png)\n\n## 第 5 章 ■ HTML 元素的措辞\n\n**图 5-6.** 默认编辑渲染效果示意\n\
  \n除了全局属性外，插入元素和删除元素都支持两个特定属性：\n\n- `cite` - 使用此属性来指明更改的来源。如果使用，该属性值应为指向在线资源的引用。此属性不会显示，但可被搜索引擎以及脚本使用。\n\
  - `datetime` - 指明更改发生的日期/时间。标准格式为 `YYYY-MM-DDThh:mm:ss` *(时区)*。\n\n**■ 提示** 当然，你始终可以通过\
  \ CSS 和 JavaScript 更改默认样式。例如，你可以在页面上提供一个选项，仅显示最终版本。为此，可以将删除元素的样式设置为 `display: none`，并对插入元素使用标准样式。而通过隐藏插入元素并对删除元素使用标准样式，你也可以显示原始版本。\n\
  \n#### 引用\n\n在上一章中，我介绍了 `blockquote` 元素，它是一种结构元素，用于包含长篇引用及其相关元素。现在，我将介绍使用引用的推荐技术，包括\
  \ `blockquote`、行内引用（`q`）和引用来源（`cite`）元素。\n\n当你想在当前句子或段落中包含一段简短引用时，请使用行内引用（`q`）元素。例如：\n\
  ```html\n<p>\n    正如亚伯拉罕·林肯曾说的，**<q>** 无论你是什么人，都做一个好人**</q>** 。\n</p>\n```\n行内引用不会开始一个新段落，其内容会像其他措辞元素（如\
  \ `strong` 或强调）一样，从上一个元素延续下来。此外，行内引用不应跨越多个段落。\n\n相比之下，`blockquote` 元素定义了一个新的区块，就像\
  \ `div` 或更具语义的元素（如 `aside` 和 `section`）一样。它可以包含多个段落以及其他元素，包括标题文本和页脚。例如，以下 HTML 的渲染效果见图\
  \ 5-7。\n```html\n<blockquote>\n    <h1>葛底斯堡演说</h1>\n    <p>\n        八十七年前，我们的先辈在这个大陆上创立了一个新国家，它孕育于自由之中，奉行一切人生而平等的原则。\n\
  \    </p>\n    <p>\n        现在我们正从事一场伟大的内战，以考验这个国家，或者任何一个孕育于自由并奉行上述原则的国家，是否能够长久存在下去。我们在这场战争的一个伟大战场上集会。我们来此，是为了将战场的一部分奉献给那些为使这个国家能够生存下去而献出自己生命的人，作为他们最后的安息之地。我们这样做是完全应该且正当的。\n\
  \    </p>\n    <footer>\n        <small>亚伯拉罕·林肯，1864 年</small>\n    </footer>\n\
  \    <cite>\n        <a href=\"http://www.abrahamlincolnonline.org/lincoln/speeches/gettysburg.htm\"\
  >\n            葛底斯堡演说\n        </a>\n    </cite>\n</blockquote>\n```\n**图 5-7.**\
  \ 块引用的默认渲染效果\n\n所有引用都应注明出处，以尊重来源。由于行内引用不能包含除其他措辞元素之外的元素，因此引用使用之前解释过的 `cite` 属性来注明。\n\
  \n`cite` 属性的值应为指向提供有关该引用更多信息的页面的 URL。此信息通常不会由浏览器显示。要提供可视化的引用标注，你需要在行内引用元素之外添加额外的文本，例如本例中的“正如亚伯拉罕·林肯曾说的”。\n\
  \n对于块引用，引用通过 `cite` 元素进行标注。被引用来源的名称（例如“葛底斯堡演说”）应放在 `cite` 元素内部。如果你还想包含一个链接，请为此目的添加一个锚点（`a`）标签。通过将其放入\
  \ `cite` 元素内部，链接的语义含义变得更加明显。\n\n**■ 提示** 由于 `blockquote` 是一个流式元素，你几乎可以在其中包含任何内容。例如，你可以包含一张图片，或一个音频或视频片段。如果你想包含一幅《蒙娜丽莎》的图片，将其置于\
  \ `blockquote` 元素中能清楚地表明你是在引用他人的作品。同时，在 `blockquote` 中包含一个 `cite` 元素来注明作品名称“蒙娜丽莎”，并添加其他内容以表明它是由列奥纳多·达·芬奇于约\
  \ 1506 年绘制的。\n\n## Span\n\n`span` 元素是一个通用容器，不提供任何语义含义。但是，你可以在 `span` 元素上使用属性来指明语义信息。`class`\
  \ 属性是用于此目的最常用的属性，但还有其他属性，如 `lang` 和 `dir`，也可能很有用。\n\n考虑以下 HTML：\n```html\n<p>\n\
  \    三原色是 <span class=\"red\">红色</span>、<span class=\"blue\">蓝色</span> 和 <span class=\"\
  yellow\">黄色</span>。\n</p>\n```\n`span` 元素没有语义含义；它也没有默认样式。没有任何 CSS 规则时，此内容中的 `span`\
  \ 元素不会产生任何效果。但是，你可以使用 CSS 来改变这些文本部分的字体颜色或背景颜色。\n\n## 添加换行符\n\n有几种方法可以用于在文档中添加空白。这些方法可以强制或建议在文本内进行换行。\n\
  \n### 换行\n\n换行元素（`br`）在文本中插入一个换行符。回顾上一章，浏览器会忽略 HTML 中的空白字符。如果你需要文本从新的一行开始，请在文本之前或前一个文本之后插入一个换行元素。例如：\n\
  ```html\n<p>\n    八十七年前，**<br />**\n    我们的先辈在这片大陆上创立了**<br />**\n    一个新国家，它孕育于自由之中**<br\
  \ />**\n    并奉行一切人生而平等的原则。**<br />**\n</p>\n```\n换行元素是一个*空*元素，意味着它在开始和结束标签之间没有内容。事实上，HTML5\
  \ 并不区分开始标签（`<br>`）和结束标签（`</br>`）。如果你输入\n```html\nOne <br> Two </br> Three\n```\n\
  每个单词都会显示在不同行，因为开始和结束标签都会产生一个换行。HTML5 相当宽松，允许 `<br>`、`</br>`、`<br/>` 和 `<br />` 作为有效语法。在本书中，我将一致使用\
  \ `<br />` 格式约定来处理所有自闭合标签。\n\n**■ 注意** 不要仅仅为了在元素之间添加垂直间距而使用换行元素。这应该通过 CSS 样式来完成。换行元素只应在你需要强制文本换到新行时使用。格式化地址块就是一个很好的例子。\n\
  \n### 单词换行时机\n\n浏览器会自动换行文本，以使其适合为元素定义的水平空间。有几种方法可以控制用于换行的规则，我将在第 [10](http://dx.doi.org/10.1007/978-1-4842-2463-2_10)\
  \ 章中介绍。换行通常发生在单词之间存在空白或标点符号的位置。但是，如果你遇到一个相当长的单词，这种方式可能不会如你所愿地工作。\n\n\n\n"
- "# 关于单词换行与软连字\n\n如果你不允许单词被断开，那么当长单词必须从下一行开始时，可能会导致某一行出现大量空白。更糟的是，如果单词本身在一行内放不下，它就会溢出所分配的区域。如果你允许单词被断开，它可能会在不太理想的位置断开。\n\
  \n`<wbr>`（单词换行机会元素）用于指示在需要时，单词可以在何处断开。例如，考虑以下 HTML：\n\n```html\n<p style=\"width:\
  \ 70px; word-wrap: break-word\">\n  Supercalifragilisticexpialidocious<br />\n \
  \ --<br />\n  Super<wbr />cali<wbr />fragilistic<wbr />expiali<wbr />docious\n</p>\n\
  ```\n\n内联样式将段落的宽度设置为 70 像素，并在必要时允许单词换行。英语中最长的单词 `Supercalifragilisticexpialidocious`\
  \ 被包含了两次。第二个实例在合乎逻辑的位置包含了`<wbr>`元素，这样即使换行，单词仍然可读。其渲染结果如图 5-8 所示。正如你所见，第二个实例在更合理的位置进行了换行。\n\
  \n***图 5-8.** 演示单词换行机会元素*\n\n■ **注意** 好吧，也许 `Supercalifragilisticexpialidocious`\
  \ 并不是一个真正的单词。但它同时被收录在韦氏词典和牛津词典中。这个无意义词的变体已经存在一段时间了。这个特定的版本因迪士尼 1964 年的电影《欢乐满人间》而闻名。\n\
  \n你可能永远不需要断开这么长的单词。然而，`<wbr>`的一个有用应用场景是显示 URL，URL 通常可能相当长，并且通常不包含任何空白字符。你可以在精心挑选的位置放置`<wbr>`元素，这样如果\
  \ URL 需要换行，它仍然能以合理的方式显示。\n\n---\n\n"
- "# 连字符\n\n`<wbr>`元素标识了单词在必要时可以断开并换行到下一行的逻辑位置。你也可以使用连字符或*软连字*来实现这一点。\n\n连字符（`-`）即使单词不需要换行也会显示出来。然而，软连字是一个插入到单词中的不可见字符。它使用\
  \ `&shy;` 输入。连字符和软连字都会告诉浏览器换行点可以出现在哪里。软连字仅在单词实际在该位置换行时才显示出来。\n\n■ **提示** 你也可以使用\
  \ Unicode 表示法 `&#173;` 来指定软连字。\n\n为了尝试这一点，让我们修改示例 HTML，使用软连字来包含第三个 `Supercalifragilisticexpialidocious`\
  \ 实例。\n\n```html\n<p style=\"width: 70px; word-wrap: break-word\">\n  Supercalifragilisticexpialidocious<br\
  \ />\n  --<br />\n  Super<wbr />cali<wbr />fragilistic<wbr />expiali<wbr />docious<br\
  \ />\n  --<br />\n  Super&shy;cali&shy;fragilistic&shy;expiali&shy;docious\n</p>\n\
  ```\n\n呈现结果将如图 5-9 所示。\n\n***图 5-9.** 使用软连字*\n\n当包装 URL 时，你不希望包含连字符，因为当行重新组合在一起时，你会得到多余的字符，导致\
  \ URL 不正确。在这种情况下，请使用`<wbr>`元素。然而，对于像 `Supercalifragilisticexpialidocious` 这样的单词，你应该使用软连字（`&shy;`），因为你希望显示一个连字符来表明单词在下一行继续。\n\
  \n#### 双向文本\n\n在某些语言中，例如希伯来语和阿拉伯语，文本是从右到左书写的。浏览器通常能很好地处理从右到左的语言。只需在 `<html>` 元素上将\
  \ `dir` 属性设置为 `rtl`，在大多数情况下就能正确渲染。当然，也会有一些你需要处理的情况，为此，你首先需要理解*Unicode 双向算法*，下面我将进行解释。\n\
  \n## 文本方向\n\n\n\n"
- "# 字符串与双向文本\n\n字符串本质上是一个字符数组。逻辑顺序指的是字符在内存中的排列顺序。例如，希伯来语中表示“快乐”的单词包含四个字符：\n\n1. אַ\n\
  2. שְׁ\n3. רֵ\n4. י\n\n这是逻辑顺序。然而，由于希伯来语是一种从右向左书写的语言，其视觉顺序（即渲染效果）为：ירֵשא\n\n■ **注意**：实际上，如果你将这些字符逐个粘贴到\
  \ Microsoft Word 甚至记事本中，顺序会自动反转。粘贴字符后，尝试使用左右箭头键导航，你会发现一些有趣的现象：`Home`键会将光标移动到单词的右侧，而右箭头键实际上会向左移动。\n\
  \n每个 Unicode 字符都有一个方向属性，用于指示其排序方式（从左到右或从右到左）。当你输入字符时，光标会自动越过当前字符（移动到其右侧），指示下一个字符的位置。如果你使用的是从右向左的字符集，则输入时光标会移动到字符的左侧。这是根据输入的字符自动发生的。\n\
  \n然而，在使用从右向左的字符集时，如果你输入一个数字，光标会移动到它的右侧。这是因为数字始终是从左到右排列的，即使出现在从右向左的语言中也是如此。这就是使用“双向”术语的原因：在一个文本块中，混合了从左到右和从右到左的文本。\n\
  \n每个部分被称为一个“方向段”，它是一个沿单一方向流动的字符串。\n\n## 流动方向\n\n通常，内联内容的每个部分都是从左到右流动的，因为这是默认方向。方向通过`dir`属性设置，这是一个可以应用于任何元素的全局属性。如果整个页面使用的是从右向左的语言，请在`html`元素上设置方向：\n\
  \n```html\n<html dir=\"rtl\">\n```\n\n![图 index-123_1](img/index-123_1.png)\n\n\
  第五章：解析 HTML 元素\n\n如果只有部分文本是从右向左的，请将`dir`属性设置在适当的容器元素上，例如`div`、`p`或`span`标签。`dir`属性会从父元素继承，如果未另行指定，`html`元素的默认值为`ltr`。在双向算法中，这被称为“基础方向”。\n\
  \n空格和标点符号被视为中性字符，因为它们可以同时用于从左到右和从右向左的语言。如果两个方向相同的字符之间存在一个或多个中性字符，则这些中性字符将被假定为具有相同的方向，并包含在同一个方向段中。不同方向段之间的中性字符将使用基础方向。这意味着它们将被包含在与基础方向相同的一个方向段中。同样，文本块开头或结尾的中性字符也将使用基础方向。如果该方向与相邻段的方向匹配，则它们将被包含在内；否则，它们将形成自己的方向段。\n\
  \n例如，考虑以下标记。图 5-10 说明了每个方向段。\n\n```html\n<p>\nIn Hebrew, this יֵרְׁשַא means happy.\n\
  </p>\n```\n\n***图 5-10.** 方向段示意图*\n\n图 5-5 中较短、较粗的下划线表示方向由基础方向确定的内容。如果基础方向是`ltr`，则这些字符也将是`ltr`，并且会有三个方向段，只有四个希伯来字符位于单独的方向段中。\n\
  \n然而，如果基础方向是`rtl`，则会有四个方向段，因为句子末尾的句点将是`rtl`，必须位于其自己的方向段中。这些方向段中的每一个也将从右向左流动。因此，按照我们习惯的从左到右阅读顺序，会先看到一个句点，然后是“means\
  \ happy,”，接着是一个希伯来单词，最后是“In Hebrew, this.”。\n\n\n\n### 方向语境中的数字字符\n数字字符属于弱类型字符，处理方式略有不同。一串数字字符始终从左到右渲染；但它们被视为前文方向序列的一部分，即使前文是右到左方向也是如此。例如，请看以下代码：\n\
  \n```html\n<p>\n  <span>!123</span> <span>יֵרְׁשַא</span> <span>456!</span><br />\n\
  </p>\n```\n\n文本 `456` 将按从左到右渲染，但会被视为希伯来文方向序列的一部分，即从右到左。`456` 文本将出现在希伯来文之后，这意味着它会位于其左侧。\n\
  \n文本 `123` 处于其自有的从左到右方向序列中，这意味着如果基准方向是 `ltr`（从左到右），它会位于 `456` 的左侧。该段落将渲染为 `!123\
  \ 456י רֵשְׁאַ!`\n\n然而，如果基准方向是 `rtl`（从右到左），则所有方向序列都将变为从右到左。每个 `<span>` 元素将按相反顺序渲染（从我们的从左到右视角来看），希伯来文位于中间，`123`\
  \ 文本在其右侧，`456` 在其左侧。\n\n### 紧密包裹\n在解释了双向算法的作用之后，我们来看看一些操纵它的方法，以确保得到期望的结果。第一种方法是*紧密包裹*每个短语。这意味着文本中可能使用不同方向的每个部分都放置在其自己的元素中，并在每个元素上使用\
  \ `dir` 属性来明确设置方向。\n\n例如，之前的 HTML 中 `123` 和 `456` 短语在基准方向为 `ltr` 时出现了一个意想不到的问题。为了便于说明，我已经将每个短语放入其自己的\
  \ `span` 元素中。要解决这个问题，只需像这样设置 `dir` 属性：\n\n```html\n<p>\n  <span dir=\"ltr\">!123</span>\
  \ <span dir=\"rtl\">יֵרְֹשַא</span> <span dir=\"ltr\">456!</span>\n</p>\n```\n\n\
  现在，文本在从左到右和从右到左模式下都将按预期渲染。\n\n> **提示** 在紧密包裹方向短语时，不必使用 `span` 元素。如果该文本出于语义原因已经位于一个独立的元素中，你可以将\
  \ `dir` 属性添加到现有元素上。\n\n### 使用隔离\n有时你需要插入来自数据库或用户输入的动态文本，并且不知道文本的方向。在这种情况下，请将动态文本放在双向隔离元素\
  \ `<bdi>` 内，如下所示：\n\n```html\n<p>\n  The user entered <mark> <bdi> user input </bdi>\
  \ </mark> on this form.\n</p>\n```\n\n如果动态文本已经位于其自身的元素中，请按照上例所示，将 `bdi` 元素嵌套在内部。`bdi`\
  \ 元素将 `dir` 属性默认设置为 `auto`。这使得动态文本的方向能够根据其内容来确定。它还告诉浏览器在渲染相邻文本时忽略此文本的方向。这是通过在该元素上设置\
  \ CSS 属性 `unicode-bidi: isolate` 来实现的。\n\n> **备注** 你也可以通过设置 `dir=\"auto\"` 并应用 CSS\
  \ 规则 `unicode-bidi: isolate` 来在不使用 `bdi` 元素的情况下实现同样的效果。然而，使用 `bdi` 元素提供了语义含义，是实现这一目标的最佳方式。\n\
  \n每当你在一个元素上使用 `dir` 属性时，`unicode-bidi: isolate` 规则会自动应用。前面描述的紧密包裹方法也在建立隔离。此外，之前\
  \ `123` 和 `456` 文本的问题也可以简单地通过将右到左文本放在 `bdi` 元素内来解决：\n\n```html\n!123 <bdi>יֵרְׁשַא</bdi>\
  \ 456!\n```\n\n### 覆盖方向\n你还可以通过使用双向覆盖元素 `<bdo>` 来覆盖文本方向。例如：\n\n```html\n<p>\n  <bdo>יֵרְׁשַא</bdo><br\
  \ />\n  <bdo dir=\"rtl\">Supercalifragilisticexpialidocious</bdo>\n</p>\n```\n\n\
  在第一行中，未设置 `dir` 属性，它将从父元素继承。在第二行中，`dir` 属性被明确设置为 `rtl`，因此该单词将反向拼写，无论之前的基准方向是什么。\n\
  \n\n\n如果基础方向为默认的 `ltr`，则渲染结果如图 5-11 所示。\n\n**图 5-11.** 覆盖文本方向\n\n■ **注意** 除非是为了好玩，否则很少有必要使用\
  \ `bdo` 元素。你可能会好奇 `supercalifragilisticexpialidocious` 倒过来拼写是什么样子。但对于阅读希伯来语的人来说，前面的例子看起来同样奇怪。\n\
  \n在所有其他元素中，`dir` 属性定义其子元素的流动方向。`bdo` 元素是一个特例；当在 `bdo` 元素中使用 `dir` 属性时，它会影响文本方向。\n\
  \n■ **提示** 有关双向文本的更多信息，W3C 提供了几篇有用的文章，你可以在 [`www.w3.org/International/tutorials/bidi-xhtml`](http://www.w3.org/International/tutorials/bidi-xhtml)\
  \ 找到。\n\n## Ruby\n\n`ruby` 元素用于使用小文本注释内容，这称为 ruby 注释。Ruby 注释用于东亚排版，主要针对日语、中文和韩语，以辅助发音。被注释的内容包含在\
  \ `ruby` 元素中。\n\n在 `ruby` 元素内部，还有一个或多个 `rt` 元素。这些是实际的注释。Ruby 注释的名称来源于排版术语中一种非常小的字体（通常为\
  \ 5.5 磅）。此文本通常显示在主内容上方。如果有多个，则额外的注释会显示在侧面。\n\n以下内容显示了一些常见货币符号，并用它们的名称和货币代码进行注释：\n\
  \n![](img/index-126_1.jpg)\n\n```\n<p>\n<ruby>$<rp>(</rp><rt>Dollar</rt><rt>USD</rt><rp>)</rp></ruby><br\
  \ />\n<ruby>€<rt>Euro</rt><rt>EUR</rt></ruby><br />\n<ruby>£<rt>Pound Sterling<rt>GBP</ruby><br\
  \ />\n<ruby>¥<rt>Japanese Yen</rt><rt>YEN</rt></ruby><br />\n</p>\n```\n\n如果 `rt`\
  \ 元素后面跟着另一个 `rt` 元素、`rp` 元素或结束的 `ruby` 标签，则它不需要结束标签。为了演示这一点，上面关于英镑符号的代码没有使用结束标签。\n\
  \n如果浏览器不支持 `ruby`，注释将简单地内联显示在主内容之后。为了实现回退功能，你应该用圆括号将它们包裹起来，以明确注释不是主要内容流的一部分。为此，请使用\
  \ `rp` 元素。当支持 `ruby` 时，`rp` 元素会被隐藏。USD 货币条目演示了 `rp` 元素的使用。\n\n上述 HTML 的渲染结果如图 5-12\
  \ 所示（由于注释使用了非常小的字体，我在此截图时放大了不少）。\n\n**图 5-12.** 渲染 ruby 注释\n\n■ **提示** 这些 ruby 注释类似于我本章前面描述的\
  \ `abbr` 和 `small` 元素。虽然你当然可以在其他场景中使用 ruby 注释，但它们主要是为东亚语言设计的。对于其他场景，请考虑改用 `abbr`\
  \ 或 `small` 元素。关于 ruby 的一些背景信息，请参见 [`html5doctor.com/ruby-rt-rp-element`](http://html5doctor.com/ruby-rt-rp-element)\
  \ 上的文章。\n\n#### 总结\n\n在为 HTML 文档包含内容选择元素时，请仔细选择。当然，你可以把所有内容都放在段落或 `span` 标签中，它也能“工作”。但每个元素都为你的内容提供了语义。这最终将使你的文档更易于维护，并且在编写\
  \ CSS 时，你会庆幸自己当初这样做了。\n\n在下一章中，我将演示如何将表格数据组织到 HTML 文档中。将内容放入行和列是呈现某些类型数据的绝佳方式。\n\
  \n## 第 6 章：表格 HTML 元素\n\n在本章中，我将向你展示如何将内容组织成由行和列组成的表格。有很多场景需要显示项目列表，而表格是完美的解决方案。在第\
  \ 4 章中，我 [`dx.doi.org/10.1007/978-1-4842-2463-2_4`](http://dx.doi.org/10.1007/978-1-4842-2463-2_4)。\n\
  \n\n\n根据我的分析，现在我将对所提供的文本应用格式化规则。\n\n### 表格 HTML 元素\n\n表格通过有序列表和无序列表（`ol`、`ul`）元素来演示。然而，这些元素虽然支持多行，但只能支持单列。如果你需要将一行组织成多列，表格是可行的方法。\n\
  \n> **警告：** 表格应仅用于呈现表格数据，例如电话列表或团队排名。不要使用表格来定义文档多个部分的布局。例如，如果你想让一个 `<aside>` 元素与主部分右对齐，请使用\
  \ CSS 而不是表格。我将在第 [13](http://dx.doi.org/10.1007/978-1-4842-2463-2_13) 章中解释如何做到这一点。\n\
  \n### 简单表格\n\n我将从一个非常简单的表格开始，该表格有三行三列。使用 `<table>` 元素来定义表格。在 `<table>` 元素内部，使用表格行（`<tr>`）元素来定义每一行。在每一行内，使用表格单元格（`<td>`）元素来定义该行中每个单元格的内容。例如，清单\
  \ 6-1 中的 HTML 将呈现为图 6-1 所示。\n\n**清单 6-1。** 创建简单表格\n```\n<table>\n<tr>\n<td>一</td>\n\
  <td>二</td>\n<td>三</td>\n</tr>\n<tr>\n<td>四</td>\n<td>五</td>\n<td>六</td>\n</tr>\n\
  <tr>\n<td>七</td>\n<td>八</td>\n<td>九</td>\n</tr>\n</table>\n```\n© Mark J. Collins\
  \ 2017\nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and Multimedia*，DOI 10.1007/978-1-4842-2463-2_6\n\
  \n![图 6-1](img/index-128_1.png)\n**图 6-1。** *一个简单表格*\n\n> **注意：** HTML4 在 `<table>`、`<tr>`\
  \ 和 `<td>` 元素上支持许多用于定义表格格式的属性，例如 `border`、`bgcolor`、`width` 和 `align`。在 HTML5 中，这些属性已被弃用，转而使用\
  \ CSS 来实现此目的。在第 [13](http://dx.doi.org/10.1007/978-1-4842-2463-2_13) 章中，我将解释如何使用\
  \ CSS 的功能来设置表格样式。\n\n如果你想为表格添加标题，请将 `<caption>` 元素作为 `<table>` 元素内的第一个子元素（在第一行之前）添加。例如：\n\
  ```\n<table>\n  <caption>简单表格</caption>\n  <tr>\n```\n尽管标题位于行详细信息之前，但使用 CSS，你可以将标题在视觉上放置在相对于实际表格的任意位置。\n\
  \n### 列标题和行标题\n\n如果你想在某个单元格中放置列标题或行标题，则应使用表格标题单元格（`<th>`）元素而不是 `<td>` 元素。表格标题单元格元素的默认样式是使文本变为粗体。更重要的是，使用此元素提供了语义信息，表明其内容描述了一组单元格。\n\
  \n使用表格标题单元格元素时，你应该指定其 `scope` 属性。这定义了标题内容所描述的单元格集合。对于列标题，使用 `scope=\"col\"`；对于行标题，使用\
  \ `scope=\"row\"`。其他可能的值是 `colgroup` 和 `rowgroup`，我将在本章后面解释。\n\n`scope` 属性在大多数浏览器中不会影响内容的呈现方式。然而，这些信息在某些应用程序（例如屏幕阅读器）中可能很有用。\n\
  \n清单 6-2 演示了一个使用列标题和行标题的表格。该表格列出了三个数字（2、3 和 4）以及这些数字的平方值和立方值。第一行包含列标题，每一行的第一个单元格包含行标题。其结果如图\
  \ 6-2 所示。\n\n**清单 6-2。** 使用列标题和行标题\n```\n<table>\n<caption>平方与立方</caption>\n<tr>\n\
  <td></td> <!-- 空单元格 -->\n<th scope=\"col\">数字</th>\n<th scope=\"col\">平方</th>\n\
  <th scope=\"col\">立方</th>\n</tr>\n<tr>\n<th scope=\"row\">二</th>\n<td>2</td>\n<td>4</td>\n\
  <td>8</td>\n</tr>\n<tr>\n<th scope=\"row\">三</th>\n<td>3</td>\n<td>9</td>\n<td>27</td>\n\
  </tr>\n<tr>\n<th scope=\"row\">四</th>\n<td>4</td>\n<td>16</td>\n<td>64</td>\n</tr>\n\
  </table>\n```\n![图 6-2](img/index-129_1.jpg)\n**图 6-2。** *使用列标题和行标题*\n\n\n\n"
- "# 排版后内容\n\n## 关于表格单元格的注意事项\n\n**提示**：请注意第一行中的空单元格。即使该单元格中没有内容，也必须定义它，以便其他单元格正确对齐。每一行中的单元格数量应相同。如果某行中省略了一个单元格，则该行的最后一个单元格将为空。\n\
  \n### 列组\n\n通过使用表格表头单元格元素（`<th>`）作为标题，使用表格单元格元素（`<td>`）作为普通内容，可以轻松地以不同方式设置它们的样式。但是，您可能希望将某些普通单元格列与其他列进行不同的样式设置。例如，在前面的示例中，您可能希望\
  \ `Squared` 和 `Cubed` 列的格式与 `Number` 列不同。您可以将这些列包含在列组（`<colgroup>`）元素中，然后对列组元素应用样式来实现这一点。\n\
  \n有两种使用列组元素的方法。首先，使用 `span` 属性指定该组将包含多少列。列被顺序分配给组。如果第一个组跨两列，它将包含前两列。如果下一个组跨一列，它将是表格中的第三列。要将前一个示例中的最后两列放入它们自己的组中，只需在第一行之前添加以下加粗的代码：\n\
  \n```\n<table>\n<caption>Squares and Cubes</caption>\n<colgroup span=\"1\"></colgroup>\n\
  <colgroup span=\"1\"></colgroup>\n<colgroup span=\"2\" style=\"background-color:\
  \ #b6ff00\"></colgroup>\n<tr>\n```\n\n前两个组各跨一列：行标题列和 `Number` 列。`span` 属性的默认值是 1，因此您也可以省略这些列组元素上的\
  \ `span` 属性。最后一个组跨越剩余的两列，即 `Squared` 和 `Cubed` 值。我已在此组上添加了一个 `style` 属性，以便您可以看到如何使用该组，但这通常应在\
  \ CSS 中处理。通过这些添加，表格现在呈现为图 6-3 所示。\n\n***图 6-3.** 使用样式添加列组*\n\n另一种方法是在列组元素中使用列（`<col>`）元素，而不是使用\
  \ `span` 属性。对于每个应包含的列，在组中包含一个列元素。列的分配顺序与第一种方法相同。您也可以在列元素上使用 `span` 属性。\n\n**注意**：在列组（`<colgroup>`）元素中，您不能同时包含\
  \ `span` 属性和一个或多个列（`<col>`）元素。您可以使用任何一种方法，但不能在同一组中同时使用。\n\n为了演示第二种方法，以下加粗的代码可以替换前面的列组元素。在此示例中，我将前两列放在一个组中，而不是单独的组中。在第一个组中，有两个列元素表示该组中有两列。在第二个组中，使用一个带有\
  \ `span` 属性的列元素来表示包含两列。\n\n```\n<table>\n<caption>Squares and Cubes</caption>\n\
  <colgroup>\n  <col style=\"background-color: #f00\"/>\n  <col />\n</colgroup>\n\
  <colgroup style=\"background-color: #b6ff00\">\n  <col span=\"2\" />\n</colgroup>\n\
  <tr>\n```\n\n第二种方法的一个优点是您可以在列元素和列组元素上定义样式。您可以通过列组元素对一组列应用样式，或者如前面的示例所示，使用列元素对特定列应用样式。此表格的第一列呈现为红色背景，如图\
  \ 6-4.\n\n***图 6-4.** 同时使用 `col` 和 `colgroup` 元素*\n\n如果您使用任一方法定义了列组，则可以在定义表格表头单元格（`<th>`）元素的\
  \ `scope` 时使用它们。将 `scope` 属性设置为 `colgroup` 将指示标题文本应用于当前列组中的列。\n\n## 表格标题和页脚\n\n\
  通常，表格顶部会有一行或多行列标题，接着是多行数据，底部会有一行或多行汇总数据。您可以使用已经讨论过的元素来实现这一点。由于 HTML5 完全关乎语义，因此有额外的元素可用于区分属于标题或页脚的行与构成表格主体的行。通常，在\
  \ HTML 中提供尽可能多的信息是一个好主意。这还将在以后应用样式时提供更多选项。\n\n如果有列标题，应将其放在表格头部（`<thead>`）元素中。如果有汇总信息，这些行应放在表格页脚（`<tfoot>`）元素中。构成表格主要部分的其余行应放在表格主体（`<tbody>`）元素中。列表\
  \ 6-3 中显示了一个简单示例。\n\n***列表 6-3.** 带有标题和页脚的表格*\n\n```\n<table>\n<caption>Scoreboard</caption>\n\
  <thead>\n  <tr>\n    <th>Inning</th>\n    <th>Runs</th>\n    <th>Hits</th>\n   \
  \ <th>Errors</th>\n  </tr>\n</thead>\n<tbody>\n  <tr><td>1</td><td>0</td><td>1</td><td>0</td></tr>\n\
  \  <tr><td>2</td><td>2</td><td>5</td><td>0</td></tr>\n  <tr><td>3</td><td>0</td><td>1</td><td>1</td></tr>\n\
  \  <tr><td>4</td><td>0</td><td>0</td><td>0</td></tr>\n  <tr><td>5</td><td>1</td><td>2</td><td>0</td></tr>\n\
  \  <tr><td>6</td><td>0</td><td>1</td><td>0</td></tr>\n  <tr><td>7</td><td>0</td><td>0</td><td>0</td></tr>\n\
  \  <tr><td>8</td><td>1</td><td>3</td><td>1</td></tr>\n  <tr><td>9</td><td>1</td><td>2</td><td>0</td></tr>\n\
  </tbody>\n<tfoot>\n  <tr><td>Final</td><td>5</td><td>15</td><td>2</td></tr>\n</tfoot>\n\
  </table>\n```\n\n**注意**：在 HTML4 中，表格页脚元素必须放在任何主体元素之前。在 HTML5 中，这一限制已被移除，因此您可以将页脚放在其逻辑上所属的主体之后。然而，无论页脚元素放置在何处，它都将在表格末尾渲染。因此，包含多个表格页脚元素是没有意义的。这不会导致错误，但所有页脚元素都会合并到表格底部。\n\
  \n表格头部、主体和页脚元素本身不会影响表格的渲染方式。使用默认样式，此示例表格的格式如图 6-5 所示。这三个元素都是可选的，您可以包含它们的任意组合。\n\n\
  ***图 6-5.** 使用表格头部和页脚元素*\n\n`<thead>`、`<tbody>` 或 `<tfoot>` 元素内的行被视为一个**行组**。在定义表格表头单元格元素的\
  \ `scope` 属性时，使用 `rowgroup` 值指示标题文本应用于当前行组。\n\n一个表格内可以有多个表格主体部分。如果您有一个大表格并希望将其分成多个部分，这将特别有用。您也可以拥有多个表格头部元素，以便在每个主体元素之前放置不同的标题文本。正如我之前提到的，只会有一个页脚元素，并且它将在表格的末尾。\n\
  \n## 跨单元格\n\n在 HTML5 中处理表格时，您可以将几个相邻的单元格合并为一个单元格。这类似于电子表格中的合并单元格。HTML 表格的单元格由表格单元格（`<td>`）和表格表头单元格（`<th>`）元素组成，如前所述。每个元素占据表格网格中的一个单元格。但是，这两个元素都支持\
  \ `colspan` 和 `rowspan` 属性。两个属性的默认值都是 1，因此每个元素恰好占一个空间。\n\n\n\n"
- '# HTML 表格元素与嵌入内容


  ## 使用 `colspan` 和 `rowspan` 合并表格单元格


  假设你有一个包含五列的表格。每个表格行元素总共包含五个 `td` 或 `th` 元素（这些元素可以互换使用）。如果你将其中一个元素的 `colspan` 属性设置为
  `2`，它将占据两个单元格的空间，并且该行只需要四个元素。如图 6-6 所示。


  **图 6-6.** 使用 `colspan` 属性


  第一行包含五个元素。然而，第二行只有四个元素，因为其中一个元素占据了两个单元格。这与之前我在 `colgroup` 或 `col` 元素中解释的 `span`
  属性的工作方式类似。


  `rowspan` 属性的工作方式与之相同，区别在于单元格是向下扩展（包含其下方的单元格），而非向右扩展。当然，你也可以同时包含 `colspan` 和 `rowspan`
  属性。在这种情况下，合并后的单元格将同时变得更宽和更高，如图 6-7 所示。


  **图 6-7.** 使用 `colspan` 和 `rowspan` 属性


  这会给后续的行元素带来一些有趣的副作用。在图 6-7 所示的表格中，第二行只有四个元素，因为一个元素占用了两个单元格。然而，在第三行中，单元格 2 和 3 已经被上一行的合并单元格分配掉了。只剩下三个可用单元格，因此第三行只会添加三个元素。第四行也是如此。


  ## 构建元素周期表


  现在，让我们应用这个概念来构建元素周期表。如果你上过基础化学课，很可能见过这个表的某个版本。它以表格形式列出了所有元素。列和行具有特殊含义，与其原子结构有关。例如，最后一列的所有元素被称为稀有气体；其左侧的列包含所有卤族元素。


  由于这种表格布局，网格中会存在空隙，尤其是在前几行。虽然我们可以创建大量空单元格，但更好的做法是将这些空单元格合并成一个单元格。


  ## 第 6 章：表格 HTML 元素


  此表格的部分 HTML 代码如清单 6-4 所示。为简洁起见，我已省略了表格的最后四行。下载的代码将包含完整的源代码。完整表格有十八列、七行数据以及两行表头。


  **清单 6-4.** 元素周期表源代码


