  第一行有一个元素跨越了十列和四行。在随后的三行中，我添加了注释以指示被跳过的单元格位置。这些空间被那个大的合并单元格占据。我在前四行中使用 `th` 元素来处理所有标题数据以及空单元格。


  ## 添加 CSS 来格式化表格


  我将在第 [13](http://dx.doi.org/10.1007/978-1-4842-2463-2_13) 章中解释如何使用 CSS 格式化表格。不过现在，为了让这个表格看起来熟悉，我会添加一些非常简单的
  CSS。因为元素太多，添加内联样式不切实际。在 `head` 元素中，我将添加以下 `style` 元素：


  ```css

  <style>


  #Periodic td {


  width: 35px;


  border: 1px solid black;


  padding: 1px;


  margin: 1px;


  text-align: center;


  }


  </style>

  ```


  这个选择器会找到所有位于 `id` 为 `Periodic`（即该表格元素的 `id`）的元素内部的 `td` 元素。这些声明设置了每个元素的宽度，并使文本居中并添加边框。元素周期表将呈现如图
  6-8 所示的效果。


  ![](img/index-136_1.png)


  ![](img/index-136_2.png)


  **图 6-8.** 元素周期表


  为了能够看到合并的单元格，请在 `style` 元素中添加以下以粗体显示的 CSS 规则。这将为 `th` 元素添加边框并设置背景色。


  ```css

  <style>


  #Periodic td {


  width: 35px;


  border: 1px solid black;


  padding: 1px;


  margin: 1px;


  text-align: center;


  }


  #Periodic th {


  border: 1px solid black;


  background-color: #0ff;


  padding: 1px;


  margin: 1px;


  text-align: center;


  }


  </style>

  ```


  现在表格将呈现如图 6-9 所示的效果。


  **图 6-9.** 为 `th` 元素设置样式


  请注意表格中间的大块区域。它有四行高、十列宽。整个区域周围有一个边框，因为它被视为一个单一的单元格。


  ### 本章小结


  在本章中，我解释了如何使用 `table` 元素来呈现表格数据。一个表格由行组成，行由 `tr` 元素表示。每一行包含一组 `td` 和/或 `th` 元素。列并没有明确定义，而是基于
  `td` 或 `th` 元素的存在来推断。例如，每行的第一个元素被视为第一列。


  你可以使用 `colgroup` 和/或 `col` 元素来定义列。这实际上并不会创建或定义任何表格单元格，但允许你将样式应用于特定列或列组。出于语义目的，你还可以将表格行分组到
  `thead`、`tbody` 和 `tfoot` 元素中。


  最后，你可以使用 `colspan` 和 `rowspan` 属性将单元格合并为一个单元格。由于合并后的单元格会占用更多空间，因此包含合并单元格的那一行所需的元素会更少。


  使用 `rowspan` 属性尤其有趣，它要求你在后续行中跳过一些单元格。我建议你在表格中添加注释以指示被跳过的单元格。


  在下一章中，我将解释如何在文档中包含嵌入内容，例如图像。


  我还会演示如何使用原生的 `audio` 和 `video` 元素。


  '
- '# 第 7 章：嵌入 HTML 元素


  在本章中，我将演示 HTML5 文档中可用的嵌入元素。到目前为止我所研究的内容（主要是文本）都是在 HTML 文档中提供的。然而，对于嵌入元素，内容是由外部文件（如图像或视频剪辑）提供的。HTML
  文档通过某个嵌入元素提供对该文件的引用。我将首先演示用于提供指向其他资源的超链接的 `a` 元素。然后，我会解释三种最常见的嵌入元素：`img`、`audio`
  和 `video`；本章大部分内容将解释这三个元素的功能。


  `audio` 和 `video` 元素也被视为交互元素，因为用户通常会通过用户界面来操作它们。例如，他们可能想要播放、暂停、快退或调整音量。




  '
- "# 嵌入式 HTML 元素\n\n本章将介绍用于这些交互的原生控件。在[第 21 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_21)中，我将演示如何使用\
  \ JavaScript 实现自定义控件。\n\nHTML5 还支持 `embed` 和 `object` 元素，它们允许你引用用于渲染内容的自定义插件。其他嵌入式元素，例如标量矢量图形（`svg`）和\
  \ `canvas`，需要专门的章节进行详细描述，我将分别在[第 22 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_22)和[第\
  \ 23 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_23)中介绍它们。\n\n### 锚点\n\n从技术上讲，锚点（`a`）元素并不属于嵌入式内容范畴。我将其放在此处，是因为它不适合放在其他任何章节中。然而，理解锚点元素（以及一般情况下的资源导航）对于本章及后续章节至关重要。\n\
  \n锚点元素用于将内容转换为超链接。锚点元素内部的内容可以是除交互式内容之外的任何类型的流式内容或短语内容。锚点元素支持 `href` 属性，该属性定义了链接将要导航到的\
  \ URL。例如：\n\n```\n<a href=\"http://www.apress.com\">\nApress\n</a>\n```\n\n元素内部的内容（此处为“Apress”）将被渲染，当用户点击该内容时，浏览器将渲染\
  \ `href` 属性中指定的 URL。锚点元素内的文本内容通常会带有下划线。锚点元素内的内容也可以是图像，我将在本章后面进行说明。\n\n© Mark J.\
  \ Collins 2017  \nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and Multimedia*,\
  \ DOI 10.1007/978-1-4842-2463-2_7\n\n`href` 属性还可以提供指向当前页面中特定元素的链接。例如，设置 `href=\"\
  #Chapter5\"` 将会滚动当前文档，使得 `id` 属性设置为 `Chapter5` 的元素出现在视口中。此外，链接资源不一定是网络资源。URL 的第一部分指定了协议（例如\
  \ `http:`），但还有其他类型的资源可供链接。以下是一些常用的类型：\n\n- `http:` – 网络资源\n- `ftp:` – 文件传输\n- `mailto:`\
  \ – 发送电子邮件\n- `tel:` – 拨打电话号码（尤其适用于移动设备）\n- `file:` – 打开文件\n\n`target` 属性用于指定链接资源的显示位置。该属性值指示了应使用的浏览上下文。我在[第\
  \ 4 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_4)中解释过浏览上下文。有多个可用值，但最常用的是 `_self`（默认值）和\
  \ `_blank`。使用 `_self` 或不指定 `target` 属性，将导致链接资源在当前上下文中显示。通常，这意味着浏览器将离开当前页面并加载一个新页面。如果指定\
  \ `_blank`，链接资源将在新标签页或窗口中显示。\n\n如果链接资源是一个应下载而非由浏览器渲染的文件，请使用 `download` 属性。包括文件应保存的默认名称：例如，`download=\"\
  MyPicture.png\"`。当用户点击链接时，将显示文件保存对话框，并且此文件名将被设置为默认值。但是，不允许使用 `/` 和 `\\` 字符，因此无法设置默认的文件路径。\n\
  \n还有几个其他属性可以包含在内，它们仅提供关于链接资源的语义信息：\n\n- `hreflang` – 指示链接资源的语言\n- `rel` – 定义与链接资源的关系（更多信息请参见[第\
  \ 1 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_1)）\n- `type` – 指示资源的 MIME 类型\n\
  \n### 图像\n\n最常用的嵌入式元素是图像。在我们这个视觉导向的世界里，几乎找不到没有图像的网页；很多网页大部分内容都是图像（或视频）。图像元素没有内容，即开始标签和结束标签之间没有内容。事实上，它是我在[第\
  \ 1 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_1)中列出的自闭合标签之一。这些有时被称为*空*元素，因为它们的“内容”完全通过其属性进行配置。\n\
  \n图像元素的格式如下：\n\n```\n<img src=\"Media/HTML5.jpg\" alt=\"The HTML5 Badge logo\" />\n\
  ```\n\n图像有两个必需的属性：`src` 和 `alt`。`src` 属性指定了所引用图像文件的 URL。在 `alt` 属性中提供图像的文本描述。如果图像无法下载或文件格式不受支持，则会显示此文本。非可视化浏览器（如屏幕阅读器）也会使用此信息。\n\
  \n图像可以以多种文件格式存储。这些格式之间的差异主要在于数据的压缩方式以及支持的颜色数量。每种格式在某些场景下表现更佳。现实情况是，我们将继续使用多种格式，而\
  \ HTML5 规范并未指定必须支持哪些文件格式。\n\n> **提示：** 如果你坚持使用三种主流格式——JPEG、GIF 和 PNG——在可预见的未来你应该会很安全。所有浏览器都支持这些格式，并且它们将长期存在。TIFF\
  \ 和 BMP 也得到了相当好的支持，但通常不被视为网络友好型格式，因为它们的文件大小相对较大，会拖慢下载速度。这里有一篇好文章介绍了所有五种文件类型及其最佳适用场景：[`1stwebdesigner.com/image-file-types`](http://1stwebdesigner.com/image-file-types)。这里有另一篇来自摄影师视角、内容相似的的文章：[`users.wfu.edu/matthews/misc/graphics/formats/formats.html`](http://users.wfu.edu/matthews/misc/graphics/formats/formats.html)。\n\
  \n图像元素还支持 `height` 和 `width` 属性。如果使用，单位必须设置为像素；不能使用相对单位来设置。如果未提供，将使用图像文件本身的固有尺寸。指定这些属性的一个好处是可以在下载完成之前预先分配空间。如果未指定，页面布局可能会在图像可用后发生变化。\n\
  \n### 多来源\n\n图像元素包含 `srcset` 和 `sizes` 属性，允许你指定一组图像文件及其相关信息，以便浏览器选择最合适的一个进行下载和渲染。我将通过演示这些属性旨在解决的用例来解释它们。\n\
  \n### 像素比选择\n\n在典型的移动设备或平板设备上，相同空间内通常包含更多的像素。例如，我的 24 英寸纯平显示器分辨率为 1920 x 1200 像素。我\
  \ 5 英寸的 Lumia 手机分辨率几乎一样高，为 1280 x 720 像素。显示器的像素密度为 93 像素/英寸（PPI）；手机为 294 PPI，大约是前者的三倍。\n\
  \n考虑到这一点，你可能希望根据像素密度提供同一图像的多个缩放版本。这通过使用 `srcset` 属性并提供以逗号分隔的图像源列表以及 `x` 描述符来实现。`1x`\
  \ 描述符对应典型的桌面分辨率；`2x` 描述符用于像素密度两倍的设备。例如，以下代码定义了图像文件的两个额外版本：\n\n```\n<img src=\"Media/HTML5.jpg\"\
  \ alt=\"The HTML5 Badge logo\"\nsrcset=\"Media/HTML5_2.jpg 2x, Media/HTML5_3.jpg\
  \ 3x\"/>\n```\n\n\n\n`src`属性仍需保留，以防浏览器不支持`srcset`属性。同时，`src`属性中的图像默认使用`1x`描述符，因此无需在`srcset`属性中重复包含`1x`选项。\n\
  \n**提示** 当你在`<img>`元素中指定多个文件时，需要为网站提供多个版本的图片；但浏览器只会下载其中一个。这些方案不仅能提升用户体验，还能改善性能。\n\
  \n## 第 7 章 嵌入式 HTML 元素\n\n### 视口选择\n\n假设你有一张希望横跨整个屏幕（或窗口）宽度的图片。你可以通过 CSS 将图片宽度设置为`100%`来实现。如果使用大屏显示器（如我的\
  \ 24 英寸显示器），图片会按需拉伸。图片可能为了保持宽高比而被垂直拉伸，也可能固定高度导致图片变形。这两种结果可能都并非你所预期。\n\n为解决这一场景，你可以结合使用`srcset`和`sizes`属性，根据*视口*宽度指定不同的图片文件。视口即网页的可见区域。在移动设备上，它等于设备尺寸；在桌面端，则取决于浏览器窗口的大小。\n\
  \n从作者的角度看，解决这个用例的方法其实很简单：告知浏览器每张图片的宽度，以及图片在宽度上应占用的空间。浏览器会据此决定下载哪个文件。所有这些决策仅涉及图片宽度和视口宽度。\n\
  \n#### 第一步：定义图片宽度\n\n你需要使用`srcset`属性，但这里用的是`w`描述符而非`x`描述符。例如，若图片宽度为 300 像素，则描述符应设为`300w`。\n\
  \n```html\nsrcset=\"Media/HTML5.jpg 300w, Media/HTML5_2.jpg 150w\"\n```\n\n当使用`w`描述符时，支持`srcset`属性的浏览器会忽略`src`属性。与`x`描述符（默认值为`1x`）不同，`w`描述符没有默认值，因此你仍需提供`src`属性，但仅用于不支持`srcset`的旧浏览器。\n\
  \n#### 第二步：使用`sizes`属性\n\n浏览器在解析文档、下载 CSS 文件并应用所有 CSS 规则后，才能最终确定图片宽度。但为加速渲染过程，图片会在\
  \ CSS 应用之前预加载。因此，浏览器需要一些提示来决定下载哪些文件，这正是`sizes`属性的作用。\n\n`sizes`属性是一个提示，用于指定渲染后图片的预期宽度。我在第[2\
  \ 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_2)中解释过，距离单位可以是固定单位（如像素）或相对单位。`sizes`属性支持所有这些单位，但在此场景下，相对于视口宽度指定最为实用。例如，若图片占满宽度，则设为`sizes=\"\
  100vw\"`；若仅占一半，则设为`50vw`。\n\n如果网页采用分栏布局，栏数可能由视口尺寸决定。大屏上可能有四栏，此时`sizes`属性应为`25vw`。但随着视口缩小，栏数可能减至三栏、两栏，最终一栏。为支持这种变化，`sizes`属性的值需要根据视口动态调整。\n\
  \n你可能会疑问为什么`sizes`是复数形式。实际上，它支持逗号分隔的列表，允许你指定多个值。每个值可以通过媒体查询来限定生效条件。我将在第[9 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_9)详细讲解媒体查询。以下示例根据视口宽度将`sizes`设为`25vw`、`33vw`、`50vw`或`100vw`：\n\
  \n```html\nsizes=\"(max-width: 600px) 25vw, (max-width: 400px) 33vw, (max-width:\
  \ 200px) 50vw, 100vw\"\n```\n\n当视口宽度至少为 600 像素时，显示四栏，因此`sizes`设为`25vw`。随着视口缩小，栏数减少，单张图片的相对尺寸增大。\n\
  \n#### 应用示例：基于设备尺寸选择图片\n\n例如，假设你想展示 Arnold Friberg 的名画《福吉谷的祈祷》。在宽屏设备上，你会希望显示完整的画作，如图\
  \ 7-1 所示。\n\n![图 7-1](img/index-142_1.jpg)  \n![图 7-1](img/index-142_2.jpg)\n\n\
  **图 7-1.** Arnold Friberg 的《福吉谷的祈祷》\n\n然而，如果网页在竖屏模式的移动设备上渲染，你可能希望显示裁剪后的版本，如图 7-2\
  \ 所示。\n\n**图 7-2.** 裁剪版\n\n你可以通过如下`srcset`属性实现：\n\n```html\n<figure>\n  <img src=\"\
  Media/G_Wash_Wide.jpg\" alt=\"The Prayer at Valley Forge\"\n       srcset=\"Media/G_Wash_Narrow.jpg\
  \ 422w, Media/G_Wash_Wide.jpg 885w\"\n       width=\"100%\"/>\n  <footer><small>Copyright\
  \ © Friberg Fine Art</small></footer>\n  <figcaption>Arnold Friberg's The Prayer\
  \ at Valley Forge</figcaption>\n</figure>\n```\n\n**注意** 新的`<picture>`元素正在提议中，以进一步辅助图片文件选择。截至本书撰写时，该元素仅受\
  \ Chrome 浏览器支持，故本书未予涵盖。如果你感兴趣，可以关注此特性。以下是当前规范的链接：  \n[`html.spec.whatwg.org/multipage/embedded-content.html#the-picture-element`](https://html.spec.whatwg.org/multipage/embedded-content.html#the-picture-element)\n\
  \n### 图像映射（Image Map）\n\n你可以轻松地将图片转换为超链接，只需将其放入锚点标签内：\n\n```html\n<a href=\"https://html.spec.whatwg.org/multipage/embedded-content.html\"\
  >\n  <img src=\"Media/HTML5.jpg\" alt=\"The HTML5 Badge logo\" />\n</a>\n```\n\n\
  这里用图片代替了文本作为内容。点击图片的任何位置都会导航到`href`属性中的地址。如果图片无法加载，`alt`属性中的文本会作为超链接显示。\n\n然而，如果你希望仅在点击图片的特定区域时才触发链接，则需要设置图像映射。你也可以在单张图片上定义多个区域，每个区域导航至不同的链接。为演示此功能，我创建了一张包含红色正方形、绿色圆形和蓝色三角形的图片。图片高\
  \ 50 像素，宽 150 像素，如图 7-3 所示。\n\n**图 7-3.** 包含三个形状的示例图片\n\n`<map>`元素可以放在 HTML 文档中的任何位置（无论在使用该映射的图片之前或之后）。通过`name`属性设置名称，在图片中使用时通过此名称引用。你可以创建多个映射，但每个映射的名称必须唯一。\n\
  \n`<map>`元素包含一个或多个`<area>`元素。每个`<area>`元素定义图片的一个区域及其点击后跳转的`href`。以下是针对图 7-3 中每个形状定义链接的`<map>`元素：\n\
  \n```html\n<map name=\"shapeMap\">\n  <area shape=\"rect\" coords=\"0,0,50,50\"\
  \ alt=\"square\" title=\"Square\" />\n  <!-- 此处继续添加圆形和三角形的 area 元素 -->\n</map>\n\
  ```\n\n\n\n### 图像映射\n\n```html\n<img src=\"Media/Shapes.png\" alt=\"Shapes\" width=\"\
  150\" height=\"50\" usemap=\"#shapeMap\" />\n<map name=\"shapeMap\">\n  <area shape=\"\
  rect\" coords=\"0,0,50,50\" alt=\"square\" title=\"Square\"\n        href=\"https://en.wikipedia.org/wiki/Square\"\
  \ />\n  <area shape=\"circle\" coords=\"75,25,25\" alt=\"circle\" title=\"Circle\"\
  \n        href=\"https://en.wikipedia.org/wiki/Circle\" />\n  <area shape=\"poly\"\
  \ coords=\"101,50,126,0,150,50\" alt=\"triangle\" title=\"Triangle\"\n        href=\"\
  https://en.wikipedia.org/wiki/Triangle\" />\n</map>\n```\n\n区域由`shape`属性和`coords`属性中的一组逗号分隔的坐标定义。支持三种形状：矩形（`rect`）、圆形（`circle`）和多边形（`poly`）。对于矩形，`coords`属性中应有四个值：左上角的`x`和`y`坐标，以及右下角的`x`和`y`坐标。对于圆形，应有三个值：圆心的`x`和`y`坐标以及半径。对于多边形，`coords`属性会有可变数量的坐标对，每对指定一个点的`x`和`y`坐标，这些点集合定义多边形。在本例中，有三个点：左下角、三角形的顶部和右下角。\n\
  \n**提示**：你可以定义一个没有`href`属性的区域，这被称为死区：一个不可点击的区域。此外，如果你想要定义一个覆盖整个图像的区域，请设置`shape=\"\
  default\"`，并且不要指定`coords`属性。\n\n`area`元素也支持`target`、`rel`和`download`属性，它们的工作方式与其他超链接相同。如果图像无法显示，`alt`属性用作超链接文本。你还可以指定`title`属性，当鼠标悬停在可点击区域时会显示为悬停文本，如图\
  \ 7-4 所示。\n\n***图 7-4.** 显示悬停文本*\n\n要将映射链接到图像，你需要在`img`元素上设置`usemap`属性。该属性的值是`map`元素的名称，前面加一个井号。例如：\n\
  \n```html\n<img src=\"Media/Shapes.png\" alt=\"Shapes\" width=\"150\" height=\"\
  50\" usemap=\"#shapeMap\" />\n```\n\n**提示**：这个示例有点刻意，主要是为了演示图像映射的功能。如果你真的想根据点击的形状链接到一个页面，更好的做法是为每个形状创建单独的图像，并将它们放入各自的锚标签中。\n\
  \n---\n\n### 音频\n\nHTML5 中的`audio`元素使得在 HTML 文档中嵌入音频变得极其容易。由于主流浏览器现在已经统一了标准文件格式，这变得更加简单。我喜欢将嵌入的文件（如音频和视频剪辑）放在\
  \ Web 应用程序的单独文件夹中。这样可以在我开发和维护的 HTML 文件与那些不是通过 HTML 创建的内容之间进行清晰分离。我在 Web 项目中创建了一个`Media`文件夹，并将所有嵌入内容放在那里。\n\
  \n**注意**：如果你使用的是源代码下载包，实际的音频文件已被移除，以避免任何版权侵权。要尝试本章其余部分的示例，你至少需要一个音频剪辑。你可以通过翻录音频\
  \ CD 来获取音频剪辑。下载中包含的视频文件根据知识共享署名许可授权，允许免费重用和分发。\n\n添加音频就像添加一个`audio`元素并设置`src`属性指向音频剪辑的位置一样简单。例如：\n\
  \n```html\n<audio src=\"Media/Linus and Lucy.mp3\">\n  <p>您的浏览器不支持 HTML5 音频</p>\n\
  </audio>\n```\n\n开始和结束标签之间的内容仅在`audio`元素不受支持或文件无法加载/播放时使用。有几个布尔属性可以与`audio`元素一起使用：\n\
  \n- `preload` - 如果存在，页面渲染时会预加载音频内容\n- `autoplay` - 如果存在，音频剪辑会在内容加载完成后立即开始播放\n- `muted`\
  \ - 设置后，音频静音，不产生声音\n- `loop` - 如果设置，音频剪辑会在播放完毕后自动回到开头重新播放\n- `controls` - 如果存在，会向用户提供原生控件来与音频剪辑交互\n\
  \n如果添加了`autoplay`属性，音乐将在页面加载时立即开始播放。但是，没有控件可以停止它。截至撰写本文时，Chrome、Firefox 和 Opera\
  \ 会在浏览器标签页中显示一个图标，表示音频剪辑正在播放。Firefox 和 Opera 允许你单击此图标来静音或取消静音。例如，Firefox 的标签图标如图\
  \ 7-5 所示。\n\n***图 7-5.** 在标签页中显示音频图标*\n\n`audio`元素支持`volume`属性，你可以在其中预设播放音频剪辑时的音量级别。该值指定为\
  \ 0 到 1 之间的数字，默认值为 1。本质上，1 表示音量应为设备设定音量的 100%。\n\n---\n\n#### 使用原生控件\n\n在用户界面方面，基本上有三个选项：\n\
  \n- **无控件**：音频播放，但用户没有可用的控件。可以使用`autoplay`属性在页面加载时自动启动剪辑。你也可以使用 JavaScript 启动、暂停和停止音频剪辑。\n\
  - **原生控件**：浏览器提供原生控件，供用户播放、暂停、停止音频剪辑以及控制音量。\n- **自定义控件**：页面提供自定义控件，通过 JavaScript\
  \ 与`audio`元素交互。\n\n要启用原生控件，只需像这样添加`controls`属性：\n\n```html\n<audio src=\"Media/Linus\
  \ and Lucy.mp3\" autoplay controls>\n```\n\n在 Internet Explorer 中，原生控件看起来应该像图 7-6\
  \ 所示的图像。在 Edge 浏览器中，它们看起来类似但更小。\n\n***图 7-6.** 在 Internet Explorer 中显示原生音频控件*\n\n\
  在 Opera 和 Chrome 中，控件看起来像图 7-7。\n\n***图 7-7.** Opera 中的音频控件*\n\n在 Firefox 中，控件看起来像图\
  \ 7-8。\n\n***图 7-8.** Firefox 中的音频控件*\n\n在 Safari 中，音频控件看起来像图 7-9。\n\n***图 7-9.**\
  \ Safari 中的音频控件*\n\n**提示**：Windows 7 上的 Safari 需要安装 QuickTime 才能支持`audio`元素。你可以从以下网站下载：[`support.apple.com/kb/DL837?locale=en_US`](https://support.apple.com/kb/DL837?locale=en_US)\
  \ 。在安装 QuickTime 后，你可能需要重启 PC，Safari 才能正常工作。\n\n如你所见，每个浏览器中的控件样式都不同。使用原生控件，你对音频控件的显示方式几乎没有控制权。你可以通过设置`style`属性来更改宽度，这会拉伸进度条。将高度扩展到正常高度以上只会在控件顶部添加空白区域。但是，在\
  \ IE 中减小高度会缩小控件；在 Chrome 中，则会裁剪它。\n\n---\n\n#### 文件格式\n\n在 HTML5 中，你可以为音频剪辑指定多个源。这允许你提供不同文件格式的音频剪辑，让浏览器选择它支持的格式。虽然所有主流浏览器都支持`audio`元素，但它们并不都支持相同的音频格式。不过，目前大多数浏览器都支持\
  \ MP3 以及用于视频的 MP4。\n\n**提示**：我提供这些信息是为了解释 HTML5 中提供的功能。然而，你很少需要使用它。在 HTML5 早期，这是一个重要的特性，因为浏览器并不都支持相同的文件类型。幸运的是，所有主流浏览器现在都支持\
  \ MP3 音频和 MP4 视频。\n\n\n\n"
- "# 音频元素\n\n`audio`元素允许你指定多个资源来源，浏览器会逐个尝试这些资源，直到找到它支持的格式。你可以在`audio`元素内提供一个或多个`source`元素，而不是直接使用`src`属性，示例如下：\n\
  \n```\n<audio autoplay controls>\n  <source src=\"Media/Linus and Lucy.ogg\" />\n\
  \  <source src=\"Media/Linus and Lucy.mp3\" />\n  <p>HTML5 音频在你的浏览器上不被支持</p>\n</audio>\n\
  ```\n\n浏览器会使用它支持的第一个资源，因此如果你有偏好，应将首选文件列在前面。例如，Chrome 同时支持 MP3 和 Vorbis 格式。如果你希望使用\
  \ MP3 文件，则应将其列在`.ogg`文件之前。\n\n虽然仅像这样列出资源也能工作，但浏览器需要下载并打开文件以判断其能否播放。下载一个相当大的文件后发现无法使用，效率很低。你还应包含`type`属性，该属性指定资源的类型。浏览器可以通过查看标记来判断文件是否受支持。`type`属性指定\
  \ MIME 格式，如下所示：\n\n```\n<source src=\"Media/Linus and Lucy.ogg\" type=\"audio/ogg\"\
  \ />\n<source src=\"Media/Linus and Lucy.mp3\" type=\"audio/mp3\" />\n```\n\n你也可以在`type`属性中指定编解码器，如下所示：\n\
  \n```\n<source src=\"Media/Linus and Lucy.ogg\" type='audio/ogg; codecs=\"vorbis\"\
  '/>\n```\n\n![](img/index-148_1.jpg)\n\n这将帮助浏览器更高效地选择兼容的媒体文件。请注意，编解码器值包含在双引号内，因此你需要对`type`属性值使用单引号。\n\
  \n**提示：** 这里有一个实用页面，用于测试浏览器对`audio`和`video`元素的支持：[`hpr.dogphilosophy.net/test/`](http://hpr.dogphilosophy.net/test/)。它还提供了各种浏览器支持情况的概览。\n\
  \n"
- "# 视频元素\n\n在本节中，我将使用随下载源代码提供的演示视频。这是来自*Big Buck Bunny*电影的预告片。该视频由创用共享许可提供，可自由再分发（版权\
  \ 2008，Blender Foundation / [www.bigbuckbunny.org](http://www.bigbuckbunny.org/)）。当然，你也可以使用自己的视频，但建议使用\
  \ MP4 格式以确保兼容所有主流浏览器。\n\n`video`元素与`audio`元素几乎相同。你可以在元素内提供后备内容，该内容仅在`video`元素或文件类型不被支持时显示。只需将`src`属性设置为视频文件的\
  \ URL，如下所示：\n\n```\n<video src=\"Media/BigBuckBunny.mp4\" autoplay>\n  <p>HTML5\
  \ 视频在你的浏览器上不被支持</p>\n</video>\n```\n\n`autoplay`属性会在页面加载时开始播放视频，但由于没有原生控件，你将无法暂停或重新播放片段。不过，如果你在视频上右键单击，会弹出一个选项菜单，可与此视频交互，包括显示原生控件。具体选项可能因浏览器而异。Chrome\
  \ 中的菜单如图 7-10 所示。Firefox 还允许你调整播放速度，以及暂停、静音和切换到全屏模式。\n\n***图 7-10.** Chrome 中的视频菜单*\n\
  \n添加`controls`属性将提供与音频片段相似的控件，如图 7-11 所示。这些控件通常隐藏，除非鼠标悬停在`video`元素上。\n\n![](img/index-149_1.jpg)\n\
  \n***图 7-11.** 显示带原生控件的视频*\n\n`video`元素还允许你通过`source`元素指定多个资源来源，与`audio`元素类似。如果你提供的是\
  \ MP4 格式的视频，通常不需要使用此功能。\n\n`poster`属性受`video`元素支持（但`audio`元素不支持）。在视频播放之前，你可以使用`poster`属性指定显示的图像。如果未指定，浏览器通常会打开视频并显示第一帧。要添加海报，只需将图像包含在你的项目中，并在`poster`属性中引用它。使用海报时，通常不应设置`autoplay`属性，否则海报将不会被看到。\n\
  \n不过有一件事需要小心。如果你定义了海报，`video`元素的初始大小将是海报图像的大小。如果这不同于视频的大小，则视频开始播放时会改变大小。你应确保图像与视频大小一致，或明确设置`video`元素的大小，这将拉伸（或缩小）海报图像以适应。\n\
  \n以下是使用海报图像的示例。这在 Firefox 中的渲染效果见图 7-12。请注意，海报变暗，播放按钮显示在视频中央。\n\n```\n<video src=\"\
  Media/BigBuckBunny.mp4\" controls\n       poster=\"Media/BBB_Poster.png\" width=\"\
  852\" height=\"480\">\n  <p>HTML5 视频在你的浏览器上不被支持</p>\n</video>\n```\n\n![](img/index-150_1.jpg)\n\
  \n***图 7-12.** 在 Firefox 中显示视频海报*\n\n"
- "# 轨道元素\n\n`audio`和`video`元素都支持`track`元素，它用于提供与媒体片段时间同步的基于文本的内容。例如，你可以在音频播放时显示歌词。对于视频，你可能希望包含隐藏式字幕或字幕。\n\
  \n`track`元素是一个空元素；它使用自闭合标签，完全通过其属性进行配置。`track`元素只能用在`audio`或`video`元素内部。如果你使用`source`元素提供多种文件类型，则`track`元素应放在`source`元素之后。\n\
  \n`kind`属性指定轨道内容的用途。允许的值包括：\n\n- **captions** - 用于隐藏式字幕，轨道提供对话的转录以及相关音效，例如“笑声”或“电话铃声”等。这用于听力障碍用户或音频静音时。\n\
  - **chapters** - 用于较长的片段，当用户浏览媒体文件时提供章节标题。\n- **descriptions** - 对音频或视频文件内容的文本描述。用于视障用户或视频不可用时。\n\
  - **metadata** - 提供供脚本使用的数据；通常不显示给用户。\n- **subtitles** - 如果未指定`kind`属性，这是默认值。字幕提供不同语言对话的翻译。它还可以提供附加信息，例如所描绘事件的日期和地点。\n\
  \n`src`属性是必需的，它指定包含轨道内容的文件 URL。这通常是 WebVTT 文件，但其他格式也可能受支持。该文件包含一系列提示点，每个提示点都有开始和结束时间（相对于文件开始）以及在此间隔内应显示的文本。时间元素以小时、分钟、秒和毫秒指定，例如“00:02:15:420”，表示片段中的\
  \ 2 分 15 秒 420 毫秒处。示例 WebVTT 文件如清单 7-1 所示。\n\n***清单 7-1.*** `bbb.vtt`，一个示例轨道文件\n\
  \n```\nWEBVTT - For Big Buck Bunny trailer.\n\nNOTE This is for demonstrational\
  \ purposes\n\n00:00:09.231 --> 00:00:11.121\n- [Bunny looks around]\n\n00:00:15.712\
  \ --> 00:00:16.892\n- [Rodents snickering]\n\n00:00:25.528 --> 00:00:27.631\n- [Squirrel\
  \ takes aim]\n```\n\nMozilla 提供了一些有用的 WebVTT 文件示例，可在[`developer.mozilla.org/en-US/docs/Web/API/Web_Video_Text_Tracks_Format`](https://developer.mozilla.org/en-US/docs/Web/API/Web_Video_Text_Tracks_Format)找到。\n\
  \n\n\n[网页视频文本轨道格式](https://developer.mozilla.org/zh-CN/docs/Web/API/Web_Video_Text_Tracks_Format)也支持其他格式的轨道文件。下文提供了更多关于可选格式的详细信息：[`www.miracletutorials.com/`](http://www.miracletutorials.com/how-to-create-captionssubtitles-for-video-and-audio-in-webtvv-srt-dfxp-format/)\n\
  \n[如何为 WebVTT、SRT、DFXP 格式的视频和音频创建字幕/说明。](http://www.miracletutorials.com/how-to-create-captionssubtitles-for-video-and-audio-in-webtvv-srt-dfxp-format/)\n\
  \n> **注意：** 轨道文件必须通过 Apache 或 IIS 等网络服务器提供。你不能像访问 HTML 文档那样，直接从本地文件夹访问 WebVTT 文件。你可能还需要定义\
  \ MIME 类型为 `text/vtt`。\n\n`srclang` 属性指定了文本内容的语言。如果 `kind` 属性设置为 `subtitles`，则此属性是必需的。`label`\
  \ 属性定义了用户选择相应轨道时显示的文本。要为 Big Buck Bunny 视频添加轨道，请像这样添加 `track` 元素：\n\n```html\n<video\
  \ src=\"Media/BigBuckBunny.mp4\" controls\n       poster=\"Media/BBB_Poster.png\"\
  \ width=\"852\" height=\"480\">\n    <track kind=\"captions\" src=\"bbb.vtt\" srclang=\"\
  en\" label=\"英语\" />\n    <p>您的浏览器不支持 HTML5 视频</p>\n</video>\n```\n\n由于 `video`\
  \ 元素包含一个含有字幕的 `track` 元素，原生控件将包含一个额外的按钮，使用户能够控制字幕显示。`label` 属性会显示在隐藏式字幕菜单中，如图 7-13\
  \ 所示。如果包含了多个 `track` 元素，用户便可以从可用的轨道中进行选择。\n\n![图 7-13](img/index-152_1.jpg)\n\n\
  ![图 7-13](img/index-152_2.jpg)\n\n**图 7-13.** Edge 浏览器中的隐藏式字幕菜单\n\n> **提示：** 有一个由\
  \ Google 开发的关于使用轨道实现字幕的简单演示。你可以在 [`html5-demos.appspot.com/static/video/track/index.html`](http://html5-demos.appspot.com/static/video/track/index.html)\
  \ 试试看。这使用了 WebM 视频格式，并非所有浏览器（尤其是 IE 或 Edge）都支持。请在 Chrome 中打开以查看演示。\n\n### HTML5\
  \ 插件\n\n到目前为止，我已经解释了如何使用适当的元素将图像、音频和视频嵌入到 HTML 文档中。这类内容非常普遍，因此提供了特定的元素来访问浏览器的内置功能。在本节最后，我将介绍如何使用\
  \ `object` 元素嵌入几乎任何内容。\n\n`object` 元素是任何外部内容的通用容器。对象的实际类型由 `type` 属性定义，并以 MIME 类型的形式提供。例如，如果你要嵌入\
  \ Flash 视频，请使用 `application/x-shockwave-flash`；如果你要嵌入 PDF 文件，请使用 `application/pdf`。当然，浏览器可能需要合适的插件才能呈现内容，但使用\
  \ `object` 元素提供了一种处理自定义嵌入内容的标准方法。\n\n`object` 元素有两个必需的属性：我已经提到的 `type` 属性，以及指定嵌入内容\
  \ URL 的 `data` 属性。`data` 属性定义外部资源，`type` 属性指定应使用哪个应用程序（或插件）来呈现内容。\n\n你还可以指定 `height`\
  \ 和 `width` 属性来为此内容分配所需的空间。\n\n例如，要将 PDF 文件嵌入 HTML 文档，请添加以下内容，它将如图 7-14 所示呈现。\n\n\
  ```html\n<object data=\"MainPage.pdf\" type=\"application/pdf\" width=\"850\" height=\"\
  200\">\n    <a href=\"MainPage.pdf\">主页</a>\n</object>\n```\n\n**图 7-14.** 嵌入 PDF\
  \ 文档\n\n请注意 `object` 元素内部的备用内容。这是一个指向同一 PDF 文件的超链接。如果不支持 `object` 元素或特定类型，用户将看到指向该文件的链接，而不是嵌入的文件。如果你使用的是自定义插件，你可能希望在此处放置如何安装该插件的说明。如果未安装插件，他们将看到这些说明，而不是嵌入的内容。\n\
  \n`object` 元素还允许你使用 `param` 元素向插件传递参数。`param` 元素有两个属性：`name` 和 `value`。你使用 `param`\
  \ 元素来提供一组名称/值对。`param` 元素使用自闭合标签，只能在 `object` 元素内部使用，并且应该放在任何回退内容之前。例如：\n\n```html\n\
  <object data=\"some file\" type=\"application/some plug in\">\n    <param name=\"\
  paramName\" value=\"paramValue\" />\n    <p>回退内容</p>\n</object>\n```\n\n> **提示：**\
  \ 并非所有插件都支持使用 `param` 元素传递参数。例如，向 PDF 查看器传递选项需要包含在 URL 中。例如，使用 `data=\"MainPage.pdf#zoom=50\"\
  ` 会将初始缩放比例设置为 50%。你需要检查你正在使用的插件支持哪些功能。\n\nHTML5 也支持 `embed` 元素，它类似于 `object` 元素。`embed`\
  \ 元素在 HTML4 中就受支持，而 `object` 元素相对较新。许多文章建议 `embed` 元素已被弃用，但在撰写本文时，它仍包含在 HTML5 规范中。然而，普遍的共识是\
  \ `object` 元素比 `embed` 更受青睐。\n\n`embed` 元素是一个空元素，这意味着它使用自闭合标签。这也意味着它不支持回退内容或 `param`\
  \ 元素。除此之外，它的工作方式与 `object` 元素非常相似，只是资源的 URL 在 `src` 属性中提供。你可以像这样使用 `embed` 元素嵌入\
  \ PDF 文档：\n\n```html\n<embed src=\"MainPage.pdf\" type=\"application/pdf\" width=\"\
  850\" height=\"150\"/>\n```\n\n#### 总结\n\n在本章中，我解释了如何将外部内容嵌入到 HTML5 文档中。嵌入内容的主要类型是图像、音频和视频，HTML5\
  \ 为这些类型中的每一种都提供了特定的元素。你可以提供多个图像文件，让浏览器根据设备特征选择最合适的文件来下载和呈现。你还可以在图像上定义可点击的区域，这些区域可以用作链接。\n\
  \n主流浏览器都已将 MP3 标准化为音频格式，MP4 标准化为视频格式，这使得在 HTML 文档中包含它们变得非常容易。对于音频和视频，你还可以包含时间同步的文本，这些文本将作为字幕、说明或其他详细信息出现。\n\
  \n对于其他类型的嵌入内容，`object` 元素提供了一种标准化的包含方式。这可能需要自定义浏览器插件，但 `object` 元素是引用它们的一致方式。当插件不受支持时，你还可以提供回退内容。\n\
  \n在下一章中，我将演示支持用户输入的 HTML 元素。无论你是创建一个完整的输入表单，还是只是一个简单的搜索字段，这些元素都提供了用户与你的网页进行交互的能力。\n\
  \n![第 8 章页眉](img/index-154_1.jpg)\n\n## 第 8 章\n\n## HTML 表单元素\n\n在传统的 Web 应用程序中，表单是一个网页或其中的一部分，其中包含供用户输入信息的位置。一旦数据输入完毕，表单便会连同输入数据一起提交给服务器。服务器处理这些数据，并返回新页面，然后由客户端渲染该页面。\n\
  \n在本章中，我将解释如何在 HTML5 中创建表单。我还将演示通常与表单相关的 HTML 元素，例如 `label`、`input` 和 `button` 元素。其中许多元素也可以在不实际位于表单上的情况下在\
  \ HTML5 文档中使用。\n\n### 概述\n\n\n\n"
- "# 在浏览器中导航到网页时\n\n当您在浏览器中导航到网页时，页面的 URL 会通过 HTTP 请求（如果使用安全传输则为 HTTPS）发送到相应的 Web\
  \ 服务器。Web 服务器会返回一个由浏览器渲染的 HTML 文档。如图 8-1 所示。\n\n***图 8-1.** 客户端/服务器架构*\n\n如果网页包含表单，则在提交表单时，会向服务器发送另一个\
  \ HTTP 请求。该请求包含的 URL 与第一个请求相同，但也包含了来自输入字段的数据。这些数据可以包含在请求正文中，也可以作为查询字符串参数包含在 URL\
  \ 本身中。我会在本章后面解释这一点。响应要么是一个新的网页，要么是对现有网页的更新。\n\n© Mark J. Collins 2017  \nM. J. Collins，*精通\
  \ HTML5、CSS、JavaScript 与多媒体*，DOI 10.1007/978-1-4842-2463-2_8\n\n---\n\n### 表单元素\n\
  \n通过服务器请求提交输入数据是网站和 HTML 的基本功能。`form` 元素用于将一个或多个输入元素分组，以便将这些信息发送到 Web 服务器。您还可以在\
  \ `form` 元素中配置数据提交的位置（以及方式）。\n\n一个 `form` 元素将包含一个或多个输入元素，这些是用户输入数据的字段。表单通常还会包含 `label`\
  \ 元素，它们是描述输入元素的简单文本块。一个简单的表单定义如下：\n\n```html\n<form action=\"\" method=\"get\">\n\
  \  <label for=\"iFirstName\">名字:</label>\n  <input id=\"iFirstName\" type=\"text\"\
  \ />\n  <label for=\"iLastName\">姓氏:</label>\n  <input id=\"iLastName\" type=\"\
  text\" />\n  <input type=\"submit\" value=\"提交\" />\n</form>\n```\n\n此表单包含两个输入字段（名字和姓氏），以及每个字段对应的一个\
  \ `label` 元素。最后一个输入元素的 `type=\"submit\"`，默认情况下会将其渲染为一个按钮。更重要的是，当单击此按钮时，表单将提交到服务器。此表单的渲染效果如图\
  \ 8-2 所示。\n\n***图 8-2.** 一个简单的表单渲染*\n\n> **提示：** 如我在示例表单中所示，通过将输入元素放置在 `form` 元素内部，可以将它们与表单关联。但是，您也可以通过使用\
  \ `form` 属性来引用某个 `form` 元素，从而将输入元素包含在该表单中。这允许您将输入元素放置在文档的任何位置，并将其 `form` 属性设置为某个\
  \ `form` 元素的 `id` 属性。当提交该表单时，该输入值也会被提交。\n\n## 表单操作\n\n如果您在这些字段中输入数据并点击提交按钮，将会发送类似以下的\
  \ HTML 请求：`http://localhost:5266/?FirstName=Mark&LastName=Collins`\n\n您可能还会注意到页面刷新时出现闪烁。Web\
  \ 服务器会用一个新 HTML 文档来响应此请求。`action` 属性指定了请求的 URL。由于此处留空，因此使用了当前页面的地址。在我的例子中，它是 `http://localhost:5266`。所以浏览器会返回并重新渲染同一页面。\n\
  \n在许多情况下，`action` 属性会指定一个不同的页面。例如，假设初始页面提供了一个表单用于输入搜索条件。提交这些数据后，您会希望根据用户输入返回一个结果页面。此情况下的\
  \ `action` 属性就是结果页面的地址。\n\n当提交初始表单时，您实际上是在请求渲染结果页面，并将搜索详情作为请求的一部分提供。\n\n在其他场景中，您希望渲染现有页面。更准确地说，您希望根据刚刚输入的信息来*重新渲染*它。这被称为*回发*。这是指网页提交一个请求，让服务器刷新页面自身，通常会将数据传递给服务器。例如，如果您在一个页面上呈现一系列问题，但某个问题的答案可能会使其他一些问题不再适用。一旦该问题得到回答，一个简单的回发就可以仅用适用的问题重新渲染页面。\n\
  \n> **注意：** 在当前的网页设计中，回发通常不被看好，因为往返服务器和重新渲染整个页面可能会很慢。在这个例子中，最好在客户端用 JavaScript 来处理。\n\
  \n#### 表单方法\n\n到目前为止，您可能已经正确地推断出，`form` 元素完全是关于定义提交表单时的 HTTP 请求。我已经解释了 `action`\
  \ 属性，它指定了请求发送到的 URL。`method` 属性指示应该使用哪个 HTTP 动词。目前仅支持两个：`GET` 和 `POST`。\n\n`GET`\
  \ 动词不支持消息正文，因此所有表单数据必须像我之前演示的那样在 URL 中传递。如果您将 `method` 属性设置为 `post`，则表单数据将位于请求正文中。\n\
  \n为了演示这一点，我使用 Fiddler 拦截了请求，原始请求如下所示：\n\n```http\nPOST http://localhost:5266/ HTTP/1.1\n\
  Host: localhost:5266\nConnection: keep-alive\nContent-Length: 31\nCache-Control:\
  \ max-age=0\nOrigin: http://localhost:5266\nUpgrade-Insecure-Requests: 1\nUser-Agent:\
  \ Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko)\n\
  Chrome/51.0.2704.103 Safari/537.36\nContent-Type: application/x-www-form-urlencoded\n\
  Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8\n\
  Referer: http://localhost:5266/\nAccept-Encoding: gzip, deflate\nAccept-Language:\
  \ en-US,en;q=0.8\n\nFirstName=Mark&LastName=Collins\n```\n\n第一行指示被请求的 URL，随后的行列出了\
  \ HTTP 请求中包含的所有标头。其中一些标头可以使用其他属性进行调整，我稍后会解释。最后一行是消息正文，包含表单数据。\n\n> **提示：** 表述性状态转移（REST）是一种用于与网站和\
  \ Web 服务通信的架构风格。在 RESTful 应用中，HTTP 动词是请求的重要组成部分。您可以对完全相同的 URL 使用不同的动词，并获得截然不同的结果。在我看来，HTML5\
  \ 不支持其他动词如 `PUT` 和 `DELETE` 非常遗憾。虽然有一些增加这些动词的动向，但似乎缺乏动力。如果您感兴趣，可以查看这篇文章：  \n> [`programmers.stackexchange.com/questions/114156/why-are-there-are-no-put-and-delete-methods-on-html-forms`](http://programmers.stackexchange.com/questions/114156/why-are-there-are-no-put-and-delete-methods-on-html-forms)\n\
  \n## 其他属性\n\n`enctype` 属性可用于控制数据的格式化方式；但是，这里的选项并不多。默认值是 `application/x-www-form-urlencoded`，这基本上意味着输入数据经过\
  \ URL 编码。本质上，空格和特殊字符会被编码以满足 URL 格式规则。如果 `method` 属性是 `get`，这是您可以使用的唯一选项。实际上，`enctype`\
  \ 属性仅在 `method` 属性设置为 `post` 时才允许使用。\n\n\n\n"
- '# HTML 中的表单处理


  如果使用的是 `post` 方法，URL 编码仍然可用，并且是默认选项。请注意，上一个示例中的消息体格式与通过 URL 传递时完全相同。此外，还有另外两个选项可供选择。使用
  `text/plain` 时，空格会被转换为“+”，但其他特殊字符不会被编码。另一个选项是 `multipart/form-data`。同样，这个名称并不直观，但在请求中上传一个或多个文件时必须使用此值。


  你可以使用 `accept-charset` 来指定服务器支持的字符集。如果未指定，则使用文档的字符集（详见第 [1 章）。由于这是用户输入的数据，你可能需要根据预期的受众支持额外的字符集。你可以通过用空格分隔来包含多个字符集。例如，`accept-charset="UTF-8
  ISO-8859-1"` 包含了两种最常见的字符集。浏览器会根据自身支持的字符集选择其一。


  当表单提交时，浏览器会对输入字段进行客户端验证。我稍后会解释这种验证。不过，你可以在 `form` 元素中添加 `novalidate` 属性来禁用验证。这是一个布尔属性。


  ### 输入元素


  表单中最有趣的部分是输入元素，用户通过它们与表单交互以输入信息。HTML5 定义了一系列令人印象深刻的输入类型供选择。它们都使用相同的 `input` 元素，但通过分配的
  `type` 属性来区分。可用的类型在附录 C 的参考数据中列出。


  ### 文本形式数据


  输入的表单数据大部分是文本形式的；然而，有几种元素和元素类型是处理特殊类型文本的。它们有一些共同的功能，因此我将把它们作为一组来描述。


  ### 文本值


  有几种输入类型本质上是文本框，它们根据指定的 `type` 属性提供数据验证。这些类型包括：


  - **`text`** - 如果未指定 `type` 属性，这是默认值。如果文本字段中输入了换行符，它们在表单提交前会被移除。如果需要多行，请使用 `textarea`
  元素。单行限制也适用于其余文本值类型。

  - **`email`** - 它的工作方式类似于普通文本字段，但内置了验证功能，用于检查文本格式是否符合标准电子邮件地址。请记住，这仅验证格式；它不确保这是一个实际有效的电子邮件地址，甚至不验证域名是否存在。你还可以包含
  `multiple` 属性以允许输入多个电子邮件地址。

  - **`password`** - 它会将输入的字符显示为星号或其他遮挡输入的方式。这只是一个 UI 功能；数据在表单中仍以明文形式存在，并在表单提交时以这种形式发送。

  - **`search`** - 此类型在功能上与普通文本类型没有区别，但搜索字段可能应用了不同的样式。你可以添加 `autosave` 属性，以便输入的数据可在其他页面的自动完成列表中使用。

  - **`tel`** - 用于输入电话号码；但仅用于语义目的。由于国际上使用的格式多种多样，它没有提供内置验证。你可以使用 `pattern` 属性提供自己的验证规则。

  - **`url`** - 与 `email` 类型类似，它会验证输入的文本是否为格式正确的 URL。它不验证资源是否实际存在。格式正确的 URL 包括协议，因此
  `apress.com` 甚至 `www.apress.com` 不是有效的 URL，但 `http://www.apress.com` 是有效的。


  ### Textarea


  `textarea` 元素是一个独立的 HTML 元素，而不是 `input` 元素的一种类型。然而，它的功能与 `type="text"` 的 `input`
  元素非常相似，只是它允许 CR/LF 字符。它支持几个特定的属性，包括：


  - **`cols`** - 指定单行应显示的字符数，类似于稍后描述的 `size` 属性。

  - **`rows`** - 指定应可见的行数。实际数据可以包含更多行，但用户需要滚动才能看到它们。

  - **`wrap`** - 指定文本应如何换行；允许的值为 `hard` 和 `soft`。默认值是 `soft`，这意味着只有当数据包含 CR/LF 字符时文本才会换行。用户可能需要水平滚动才能看到所有数据。值为
  `hard` 表示文本始终换行以适合元素的宽度。


  ### 基于文本的输入元素的公共属性


  每个基于文本的输入元素以及 `textarea` 元素都支持几个公共属性。这些属性包括：


  - **`inputmode`** - 适用于 `email`、`password`、`text` 或 `url` - 可以作为提示提供给浏览器，提示应显示哪种键盘。这对于需要显示键盘供用户输入的触控设备非常重要。支持的值包括
  `verbatim`、`latin`、`latin-name`、`latin-prose`、`full-width-latin`、`kana`、`katakana`。其他支持的类型（`email`、`numeric`、`tel`
  或 `url`）应使用相应的 `type` 属性设置，而不是使用 `inputmode`，不过这里也支持这些类型。

  - **`maxlength`** - 指定可输入到字段中的最大字符数。

  - **`minlength`** - 指定此字段所需的最小字符数。

  - **`pattern`** - 指定用于验证输入数据的正则表达式。某些文本值类型具有内置的验证逻辑。使用 `pattern` 属性将提供额外的验证。`textarea`
  元素不支持此属性。

  - **`placeholder`** - 放置在元素内的文本，用于说明字段中应输入什么数据。这是关于数据格式的提示，通常是预期输入的示例。例如，如果字段期望输入电话号码，则占位符可能包含一个按表单预期格式格式化的电话号码。占位符文本仅在字段为空时显示，并在字段被选中或输入第一个字符时隐藏。

  - **`size`** - 指定输入元素的物理大小，以字符数表示。如果未指定 `size`，默认值为 20。这意味着元素应足够大以显示至少 20 个字符。这是一个指导原则，而不是绝对要求，因为字符可能具有不同的宽度。如果你输入二十个大写
  W，它们可能无法全部显示。例如，我在 Chrome 中测试了这一点，在一个默认大小的输入元素中，我可以输入 64 个小写 i，但只能输入 13 个大写 W。请注意，这与
  `maxlength` 属性不同，后者限制数据中的字符数。你可以将 `size` 属性设置为 10，大约 10 个字符可见。`maxlength` 属性可以设置为更高的值，但并非所有字符都可见。`textarea`
  元素不支持此属性；请改用 `cols` 和 `rows` 属性。

  - **`spellcheck`** - 一个布尔属性，指示是否应对输入数据进行拼写和语法检查。


  ### 自动填充


  自动填充是一个非常方便的功能，浏览器可以根据之前的输入记录自动填充输入字段。当你输入时，列表会被筛选，仅显示与已输入字符匹配的条目。通常，在只输入一两个字符后，就可以选择而无需进一步输入。`autocomplete`
  属性决定是否使用此功能，并控制可用的选项。




  '
- '# 自动填充功能


  自动填充功能可以在表单或字段级别开启或关闭。如果在`form`元素上将`autocomplete`属性设置为`off`，则除非在一个或多个`input`元素中显式开启，否则所有字段的自动填充功能都将关闭。类似地，如果在`form`元素中将其设置为`on`，则除非在`input`元素中将其设置为`off`，否则所有字段的自动填充功能都将开启。


  ![](img/index-160_1.jpg)


  '
- "# 第 8 章 ■ HTML 表单元素\n\n然而，仅仅开启自动填充功能还不够。例如，如果我正在输入电子邮件地址，我不希望在自动填充列表中看到姓名、地址或电话号码。你不应将`autocomplete`属性设置为`on`，而应将其设置为特定的自动填充详情令牌，在本例中为`email`。这样，自动填充列表将只包含在其他具有相同自动填充详情令牌的字段中输入的值。\n\
  \n目前已经定义了一个相当长的自动填充详情令牌列表，包括电话号码、地址或支付信息的各个部分，以及许多其他类型的信息。与其在这里重复所有信息，最好直接查阅规范，你可以在[`html.spec.whatwg.org/multipage/forms.html#autofill`](https://html.spec.whatwg.org/multipage/forms.html#autofill)找到它。这也是获取最新信息的最佳途径。\n\
  \n你还可以使用`datalist`元素提供自定义的自动填充列表。`datalist`元素包含一组`option`元素。然后，你可以使用`list`属性将`datalist`分配给`input`元素。\n\
  \n你在`datalist`中包含的任何值现在都会出现在自动填充建议中。以下是一个简单的示例：\n\n```\n<datalist id=\"sports\"\
  >\n  <option value=\"Baseball\" />\n  <option value=\"Basketball\" />\n  <option\
  \ value=\"Hockey\" />\n  <option value=\"Football\" />\n</datalist>\n\n<label for=\"\
  iSport\">最喜欢的运动:</label>\n<input type=\"text\" id=\"iSport\" name=\"Sport\" list=\"\
  sports\" />\n```\n\n`datalist`元素包含四个值，它们是四种热门运动的名称。`datalist`通过其`id`属性被引用，我将其`id`指定为`sports`。然后，在`input`元素中，我添加了`list`属性：`list=\"\
  sports\"`。\n\n带有预填充`datalist`的文本框与你使用`select`元素创建的下拉列表不同，这一点我稍后会解释。用户不仅限于这些选项；他们可以输入任何想要的内容。这只是在需要一些常见值时让输入稍微方便一些。建议列表会随着你的输入自动过滤。例如，输入字母“b”后，只有\
  \ Baseball 和 Basketball 会保留下来供选择。此外，如果自动完成功能已启用，基于之前的输入，建议列表还会添加额外的条目。例如，我之前输入过`tennis`，现在文本框看起来就像图\
  \ 8-3 所示。\n\n**图 8-3.** 使用预填充的`datalist`\n\n"
- '# 第 8 章 ■ HTML 表单元素


  #### 属性


  在继续介绍其余输入类型之前，我想先涵盖`input`元素支持的其他属性，这些属性大多适用于所有类型（有几个属性有一些限制）。


  这将让你对文本元素有一个完整的了解。


  - **`name`** - 提交表单时，输入字段会作为一组名称/值对发送到服务器，要么在消息正文中，要么在 URL 中，正如我之前演示的那样。名称部分来自`name`属性，值来自`value`属性（我稍后会解释）。如果未提供`name`属性，数据将不会发送到服务器。


  - **`value`** - 正如我所说，`value`属性提供了传递给服务器的数据。当你向`input`元素（如文本框）中输入数据时，这些数据会存储在该元素的`value`属性中。这个`value`属性会显示在输入字段中，并在表单提交时被提交。你也可以在




