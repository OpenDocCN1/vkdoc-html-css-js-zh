  \  \n\n## 第 23 章 ■ Canvas  \n\n**图 23-3.** 显示棋子的棋盘  \n\n> **注** 当您创建一个`Image`对象并设置其`src`属性时，指定的图像文件会异步下载。有可能在调用`drawImage()`函数之前文件尚未加载完成。如果发生这种情况，图像将不会显示。1\
