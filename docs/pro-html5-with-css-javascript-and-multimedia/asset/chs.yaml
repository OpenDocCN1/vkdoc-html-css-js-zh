  \     73 - p.height + (75 * p.y),\n      p.width,\n      p.height);\n}\n\n// Draw\
  \ all of the chess pieces\nfunction drawAllPieces() {\n  for (var i = 0; i < 32;\
  \ i++) {\n    if (pieces[i] != null) {\n      drawPiece(pieces[i]);\n    }\n  }\n\
