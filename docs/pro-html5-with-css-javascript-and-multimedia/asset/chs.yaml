  ### 定义尺寸\n\n有许多方法可以定义元素的大小，每种方法都有其后果。\n\n#### 绝对尺寸\n\n在前面的示例中，我设置了 `width` 属性，给它一个\
  \ 150 像素的绝对宽度。您也可以设置 `height` 属性。这将强制分配那么多空间，无论是否需要，也无论是否可用——后者问题更大。\n\n![](img/index-198_1.png)\n\
  \n### 第十章 定位内容\n\n如果空间不可用，元素将溢出其容器。如果外部容器是浏览器窗口，并且元素大小超过了窗口大小，则会出现滚动条，以便您滚动查看丢失的内容。虽然应避免水平滚动，但这并不太糟糕，因为内容仍然可见。\n\
  \n然而，考虑一下容器只是文档的一部分并且周围还有其他内容的情况。为了演示会发生什么，在前面的示例中，我们也可以设置 `height` 属性，如下所示：\n\n\
  ```css\n.container {\n    width: 150px;\n    height: 100px;\n}\n```\n\n这将高度固定为 100px。容器中有一点额外的空间。但是，如果您在此容器内再添加几个\
