  \ 12 张图像加载完毕。  \n\n## 添加简单动画  \n\n为了演示如何使用 canvas 实现简单动画，您将让棋子移动。绘制每个棋子的函数会根据棋子所在格子计算其位置。要移动一个棋子，您只需更新其`x`或`y`属性，然后重新绘制它。\
