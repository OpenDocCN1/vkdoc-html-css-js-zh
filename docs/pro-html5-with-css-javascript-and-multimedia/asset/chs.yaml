  ## 方法列表\n\n| 方法 | 示例 | 描述 |\n|------|------|------|\n| `concat` | `var newArray\
  \ = items.concat(array1, array2, ...);` | 返回一个新数组，该数组包含原始数组和作为参数传入的数组的内容。 |\n| `copyWithin`\
  \ | `items.copyWithin(2, 4, 2);` | 将数组中的元素复制到数组中的其他位置。第一个参数指定要复制到的索引，第二个参数指定要复制的起始索引，第三个参数指定结束索引。因此，第二和第三参数之间的元素被复制到第一个参数指定的索引。复制会覆盖现有元素。（*续*）\
  \ |\n| `every` | `var bool = items.every(compareFunc);` | 如果指定的比较函数对数组中的每个元素都返回`true`，则返回`true`。\
  \ |\n| `fill` | `items.fill(\"x\", 3, 2);` | 用第一个参数的值替换指定元素的值。第二和第三参数表示起始和结束索引。\
  \ |\n| `filter` | `var subset = items.filter(compareFunc);` | 对数组中的每个元素执行比较函数，并返回比较函数返回`true`的元素集合。\
  \ |\n| `find` | `var item = items.find(compareFunc);` | 返回数组中第一个满足指定比较函数返回`true`的元素。\
  \ |\n| `findIndex` | `var i = items.findIndex(compareFunc);` | 返回数组中第一个满足指定比较函数返回`true`的元素的索引。\
  \ |\n| `forEach` | `items.forEach(function);` | 为数组中的每个元素调用指定的函数。 |\n| `indexOf`\
  \ | `var i = items.findIndex(compareFunc, 2);` | 返回数组中第一个满足指定比较函数返回`true`的元素的索引。第二个参数表示从数组中的哪个位置开始搜索（默认为\
  \ 0）。 |\n| `join` | `items.join(\"; \");` | 将元素输出为一个字符串，每个元素由指定的字符串分隔。 |\n| `lastIndex`\
  \ | `var i = items.findIndex(compareFunc);` | 返回数组中第一个满足指定比较函数返回`true`的元素的索引。 |\n\
  | `map` | `var newArray = items.map(function);` | 创建一个与现有数组大小相同的新数组。每个元素都是通过对原始数组中对应的元素调用指定函数创建的。\
  \ |\n| `pop` | `var item = items.pop();` | 从数组中移除最后一个元素并返回它。 |\n| `push` | `var\
  \ l = items.push(\"xyz\");` | 将指定元素添加到数组末尾并返回新的长度。 |\n| `reduce` | `var v = items.reduce(aggrFunc,\
  \ initial);` | 通过将指定函数应用于每个元素（从第一个元素开始），将数组缩减为单个值。 |\n| `reduceRight` | `var v =\
  \ items.reduceRight(aggrFunc, initial);` | 通过将指定函数应用于每个元素（从最后一个元素开始并反向进行），将数组缩减为单个值。\
  \ |\n| `reverse` | `items.reverse();` | 按字母顺序反向排序元素。 |\n| `shift` | `var item =\
  \ items.shift();` | 移除数组的第一个元素并返回它。剩余元素的索引下移一位，因此第二个元素（现在是第一个）的索引为 0。（*续*） |\n|\
  \ `slice` | `var subArray = items.slice(2, 3);` | 从数组中移除元素并以新数组的形式返回它们。第一个参数指定从哪里开始，第二个参数指定应移除多少个元素。\
  \ |\n| `some` | `var bool = items.every(compareFunc);` | 如果指定的比较函数对数组中的至少一个元素返回`true`，则返回`true`。\
  \ |\n| `sort` | `items.sort();` | 按字母顺序对列表中的项目进行排序。 |\n| `splice` | `items.splice(2,\
  \ 1, \"x\", 'y', \"z\");` | 首先根据前两个参数（起始元素和要移除的元素数量）从数组中移除元素，然后插入后续参数指定的元素。 |\n\n\
  \n\n#### 数组方法\n\n## `toString`\n\n`items.toString();`\n\n将每个元素输出为一个以逗号分隔的字符串。\n\n\
  ## `unshift`\n\n`var l = items.unshift(\"abc\");`\n\n将指定元素添加到数组的开头（索引为 0），并将其余索引向后移动一位。返回数组的新长度。\n\
  \n## `valueOf`\n\n`var v = items.valueOf();`\n\n这是默认函数。返回一个包含以逗号分隔的元素列表的字符串。\n\n\
  ---\n\n# 窗口成员\n\n#### 属性\n\n| 属性 | 描述 |\n|---|---|\n| `applicationCache` | 提供已缓存以供离线支持的资源列表。\
  \ |\n| `console` | 用于编写调试消息和运行临时 JavaScript 命令的地方。 |\n| `crypto` | 返回一个用于哈希、加密或随机数生成的\
  \ `Crypto` 对象。该规范仍处于早期阶段。更多详情请参见 [`w3c.github.io/webcrypto/Overview.html`](https://w3c.github.io/webcrypto/Overview.html)\
  \ 上的规范。 |\n| `devicePixelRatio` | 指示设备像素与设备独立像素之间的比率。 |\n| `dialogArguments` | 对于对话框窗口，提供打开窗口时传入的参数。\
  \ |\n| `document` | 在此窗口中加载的 HTML 文档。 |\n| `frameElement` | 如果窗口代表一个框架，则指示该框架所嵌入的元素。\
  \ |\n| `frames` | 返回当前窗口内子框架的集合。 |\n| `fullScreen` | 指示窗口是否处于全屏模式。 |\n| `history`\
  \ | 返回用于导航回上一页的历史对象。 |\n| `innerHeight` | 窗口内容可显示的可用区域的高度。如果存在水平滚动条，则包含其所占用的空间。\
  \ |\n| `innerWidth` | 窗口内容可显示的可用区域的宽度。如果存在垂直滚动条，则包含其所占用的空间。 |\n| `isSecureContext`\
  \ | 如果窗口使用安全上下文，则返回 `true`。 |\n| `length` | 返回窗口中子框架的数量。 |\n| `localStorage` | 提供一个在会话结束后仍可用的数据存储位置。\
  \ |\n| `location` | 返回提供当前文档网址详细信息的 location 对象。 |\n| `locationbar` | 返回网址 UI 控件的\
  \ `BarProp` 接口。 |\n| `menubar` | 返回菜单 UI 控件的 `BarProp` 接口。 |\n| `messageManager`\
  \ | 返回用于管理进程间通信的 `MessageManager` 对象。使用需要提升的权限。 |\n| `name` | 窗口的名称。 |\n| `navigator`\
  \ | 返回提供浏览器和设备详细信息的 navigator 对象。 |\n| `opener` | 打开当前窗口的窗口。 |\n| `outerHeight`\
  \ | 窗口的高度，包括工具栏和菜单等浏览器元素。 |\n| `outerWidth` | 窗口的总宽度，包括所有 UI 元素。 |\n| `parent` |\
  \ 返回当前窗口的父窗口，如果当前窗口是最顶层窗口，则返回当前窗口本身。 |\n| `performance` | 返回提供客户端性能监控实用工具的 `Performance`\
  \ 对象。 |\n| `personalbar` | 返回个性化 UI 控件的 `BarProp` 接口。 |\n| `returnValue` | 用于对话框窗口；包含要返回给调用函数的值。\
  \ |\n| `screen` | 返回提供设备显示详细信息的 screen 对象。 |\n| `screenX` | 从设备显示屏左边缘到浏览器窗口左边缘的距离。\
  \ |\n| `screenY` | 从设备显示屏上边缘到浏览器窗口上边缘的距离。 |\n| `scrollbars` | 返回滚动条 UI 控件的 `BarProp`\
  \ 接口。 |\n| `scrollX` | 文档当前水平滚动的距离。 |\n| `scrollY` | 文档当前垂直滚动的距离。 |\n| `self` |\
  \ 返回对当前窗口的引用。 |\n| `sessionStorage` | 用于存储会话结束时过期的应用程序数据。 |\n| `speechSynthesis`\
  \ | 返回用于访问 Web Speech API 的 `SpeechSynthesis` 对象。 |\n| `status` | （未提供描述。） |\n\n\
  \n\n# Window 成员\n\n#### 属性\n\n`statusbar`\n返回状态栏 UI 控件的 `BarProp` 接口。\n\n`toolbar`\n\
  返回工具栏 UI 控件的 `BarProp` 接口。\n\n`top`\n返回最顶层窗口。\n\n`window`\n返回当前窗口。\n\n## 方法\n\n\
  `alert()`\n显示一个包含指定消息的模态对话框。\n\n`atob()`\n将 base-64 编码的字符串转换为二进制数据。\n\n`blur()`\n\
  从窗口中移除焦点。\n\n`btoa()`\n将二进制数据转换为 base-64 编码的字符串。\n\n`clearInterval()`\n取消一个使用 `setInterval()`\
  \ 方法调度的重复计时器。\n\n`clearTimeout()`\n取消一个使用 `setTimeout()` 方法创建的计时器。\n\n`close()`\n\
  关闭窗口。\n\n`confirm()`\n显示一个模态确认对话框。\n\n`dispatchEvent()`\n触发指定事件。\n\n`dump()`\n将消息写入控制台。\n\
  \n`find()`\n在文档中搜索指定的字符串。\n\n`focus()`\n将焦点切换到此窗口。\n\n`getComputedStyle()`\n计算应应用于窗口的所有\
  \ CSS 声明。\n\n`getSelection()`\n返回一个表示选中项的 selection 对象。\n\n`matchMedia()`\n执行指定的媒体查询并返回布尔结果。\n\
  \n`moveBy()`\n按指定量移动窗口。\n\n`moveTo()`\n将窗口移动到指定位置。\n\n`open()`\n打开一个新窗口/标签页。\n\n\
  `openDialog()`\n以对话框的形式打开新窗口。\n\n`postMessage()`\n向另一个窗口发送消息。\n\n`print()`\n打开打印对话框，允许用户打印文档。\n\
  \n`prompt()`\n打开一个对话框并返回用户的输入。\n\n`resizeBy()`\n按指定量调整窗口大小。\n\n`resizeTo()`\n将窗口大小更改为指定尺寸。\n\
  \n`scroll()`\n将文档滚动到指定位置。\n\n`scrollBy()`\n按指定量滚动窗口。\n\n`scrollByLines()`\n按指定的行数滚动文档。\n\
  \n`scrollByPages()`\n按指定的页数滚动文档。\n\n`scrollTo()`\n将文档滚动到指定的坐标集。\n\n`setCursor()`\n\
  设置光标图标。\n\n`setInterval()`\n调度一个函数，使其在每次执行之间以指定间隔重复执行。\n\n`setResizeable()`\n切换窗口是否可以调整大小。\n\
  \n`setTimeout()`\n调度一个函数，在指定间隔后执行。\n\n`showModalDialog()`\n显示一个模态对话框。\n\n`sizeToContent()`\n\
  更改窗口大小以适应当前内容。\n\n`stop()`\n停止窗口加载。\n\n`updateCommands()`\n更新浏览器 UI 中命令的状态。\n\n\
  # Navigator 成员\n\n#### 属性\n\n`appCodeName`\n指示浏览器的代码名称。\n\n`appName`\n指示浏览器的名称。\n\
  \n`appVersion`\n指示浏览器的版本详细信息。\n\n`battery`\n提供有关设备电池的详细信息；包含以下属性：`charging`（如果设备已插入并正在充电则为\
  \ `true`），`chargingTime`（完全充满电所需的剩余秒数），`dischargingTime`（电池完全放电所需的剩余秒数），以及 `level`（一个从\
  \ 0 到 1 的值，指示当前电量水平）。你也可以监听这些值发生变化时触发的事件。\n\n`cookieEnabled`\n指示当前是否启用了 cookie。\n\
  \n`geolocation`\n从设备获取定位数据。这在第 26 章中进行了演示。\n\n`hardwareConcurrency`\n返回设备使用的逻辑 CPU\
  \ 数量。\n\n`language`\n指示用户的偏好语言或浏览器 UI 中设置的当前语言。\n\n`mediaDevices`\n返回可用媒体设备的数组。\n\
  \n`mimeTypes`\n返回已注册的 MIME 类型的数组。\n\n`online`\n一个布尔值，指示设备是否连接到网络。\n\n`oscpu`\n指定设备使用的操作系统。\n\
  \n`platform`\n返回浏览器编译时所在的平台。\n\n`plugins`\n返回当前已启用的插件数组。\n\n`product`\n指示浏览器使用的引擎名称。\n\
  \n`serviceWorker`\n\n\n\n已为您排版处理完毕。以下是根据 Markdown 规范优化后的文档内容，保留了核心信息，并严格按照要求为代码、变量、函数、方法等添加了反引号。\n\
  \n---\n\n返回用于管理与当前文档关联的 `ServiceWorker` 对象的 `ServiceWorkerContainer` 对象。\n\n## `userAgent`\n\
  \n描述用户代理（浏览器）的字符串。\n\n## 方法\n\n| 方法 | 描述 |\n|--------|-------------|\n| `javaEnabled()`\
  \ | 如果浏览器支持 JavaScript，则返回 `true` |\n| `registerContentHandler()` | 注册为特定 MIME 类型的可用处理程序\
  \ |\n| `registerProtocolHandler()` | 注册为特定协议的可用处理程序 |\n| `vibrate()` | 如果设备支持振动，则使设备振动\
  \ |\n\n---\n\n## 控制台方法\n\n| 方法 | 描述 |\n|--------|-------------|\n| `assert()` |\
  \ 仅当第一个参数为 `false` 时，才向控制台日志写入条目。用于仅在特定条件下（例如函数返回错误时）记录日志。日志条目还包含堆栈信息。 |\n| `clear()`\
  \ | 从控制台日志中移除所有条目。 |\n| `count()` | 记录这行代码已执行的次数。如果向 `count()` 方法传递一个标签，该标签将包含在日志条目中。\
  \ |\n| `dir()` | 将对象输出到控制台，以便其成员可以在日志中被展开或折叠。 |\n| `dirxml()` | 以 XML 或 JSON 格式输出对象的成员。\
  \ |\n| `error()` | 向控制台日志写入一个表示错误的条目。此方法支持字符串替换。 |\n| `group()` | 向控制台日志写入一个开始新组的条目。后续的日志条目将被缩进。使用\
  \ `groupEnd()` 方法结束当前组。组可以嵌套。 |\n| `groupCollapsed()` | 工作方式与 `group()` 方法类似，只是该组是折叠的，用户需要展开它才能看到后续条目。\
  \ |\n| `groupEnd()` | 关闭当前组。 |\n| `info()` | 向控制台日志写入一条信息性消息。此方法支持字符串替换。 |\n| `log()`\
  \ | 此方法用于一般日志记录目的。其他方法如 `error()`、`info()` 和 `warn()` 暗示了严重级别，而 `log()` 则不区分。此方法支持字符串替换。\
  \ |\n| `profile()` | 启动浏览器的内置分析工具。具体功能因浏览器而异。 |\n| `profileEnd()` | 停止当前的分析器。 |\n\
  | `table()` | 在控制台中以表格形式显示数据。数据必须是对象或数组。如果数据是对象，则属性名称和值将以表格形式显示。如果数据是数组，则数组中的每个条目都会显示一行。如果数组元素是对象，则每个对象属性将使用单独的列。您还可以指定应包含在表格中的属性。\
  \ |\n| `time()` | 启动一个秒表。使用 `timeEnd()` 方法停止秒表并记录经过的时间。 |\n| `timeEnd()` | 停止指定的秒表。\
  \ |\n| `timestamp()` | 在浏览器的时间轴或分析工具中添加一个标记。 |\n| `trace()` | 将堆栈跟踪记录到控制台。 |\n|\
  \ `warn()` | 向控制台日志写入一条警告条目。此方法支持字符串替换。 |\n\n---\n\n## 元素继承关系\n\n| 名称 | 继承自 |\n\
