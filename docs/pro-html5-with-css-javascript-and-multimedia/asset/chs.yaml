  \ e`都位于容器元素之外，并叠加在更多内容区域的上方。希望到现在你已看到设置绝对大小的谬误，尤其是设置高度时。这确实会让你陷入困境（双关语），并使页面容易受到多种可能破坏布局的场景的影响。例如，考虑页面被翻译且翻译后的文本比原文占用更多字符的情况。此外，如果用户指定的\
  \ CSS 增加了字体大小，你的布局可能会被破坏。\n\n第 10 章 ■ 定位内容\n\n## 相对大小\n\n我在[第 2 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_2)中简要提到，距离单位也可以表示为百分比。与其将宽度指定为固定大小（例如`300px`），你可以将其指定为百分比。这将相对于元素的直接父元素来计算：\n\
  \n```\n.container {\n  width: 70%;\n}\n```\n\n在创建响应式网页时，使用相对大小非常有用，因为尺寸会根据可用空间自动调整。\n\
  \n#### 设置最大值\n\n如果你主要处理文本，定义容器的宽度有助于约束容纳文本的区域。文本会根据需要自动换行以适配指定区域。然而，如果可用空间小于此值，内容会像我之前演示的那样溢出该区域。\n\
  \n一个简单的改进是使用`max-width`属性代替`width`。将 CSS 规则中的两个声明都替换为`max-width`：\n\n```\n.container\
  \ {\n  max-width: 300px;\n}\n```\n\n通过移除`height`属性，垂直溢出问题得到解决。通过将`width`替换为`max-width`，如果窗口尺寸缩小，容器将根据需要缩小以适应当前窗口。为了更好地演示这些，我们在这些`div`元素中添加一些额外文本。将容器`div`及其所有子元素替换为以下内容。每个元素将根据需要自动换行，以适配一个`300px`的`div`，如图\
  \ 10-5 所示。\n\n```\n<div class=\"container\">container\n  <div>Fourscore and 20 years\
  \ ago,</div>\n  <div>our fathers brought forth to this continent</div>\n  <div>a\
