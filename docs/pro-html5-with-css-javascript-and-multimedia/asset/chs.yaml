- "# 构建出色 Web 应用的平台\n\n这些内容可分为三个领域：\n\n- **1) HTML** – 网络内容，包括标记指令。\n- **2) CSS**\
  \ – 定义内容呈现方式的样式规则。\n- **3) JavaScript** – 提供客户端脚本和高级功能。\n\n第一部分为每个领域都设有一章，介绍理解本书其余内容所需的基本概念。对于\
  \ Web 开发相对新手而言，这一部分不可或缺。\n\n每章还对该技术进行了广泛覆盖，因此即使你经验丰富，也很可能会发现一些未曾了解或可能遗忘的知识点。我建议每位读者至少通读这些章节。在研读更高级的章节时，你可能需要回来复习这些内容。\n\
  \n### 第 1 章：超文本标记语言\n\n本章我将探讨 HTML5 三要素中的第一环，即将在网页中呈现的实际内容。在接下来的两章中，我将解释如何用 CSS\
  \ 样式化这些内容，并介绍 JavaScript 语言。不过我们将从内容开始。\n\n> **注意** 我差点将之称为*原始*内容，但这描述不准确。一个格式规范的\
  \ HTML 文档具有完整的结构和组织。\n\n回想你早年的校园时光，老师批改作业时会用红笔做标记。拼写错误、语法错误或其他问题都会被圈出或高亮。你可能称之为*标记过的*文档，通常标记越多，分数越低。\n\
  \n同样，标记语言用于标注文档的特定部分，并提供指令或背景信息。不同之处在于受众。你可能擅长阅读 HTML，读完本书后你肯定更擅长，但你并非其预期接收者。标记是为浏览器提供的指令，指示应如何呈现内容。因此，标记本身必须句法精确。\n\
  \n> **提示** HTML5 是一个相对成熟的标准，更准确地说，是由万维网联盟（W3C）管理的一套标准。例如，整体 HTML 句法在[`www.w3.org/TR/html5/syntax.html`](https://www.w3.org/TR/html5/syntax.html)中定义。本书中的许多内容都可以从这些规范中获取，我鼓励你查阅其中的部分内容，并了解它们的存在。这些标准会随时间修改或扩展，而这些规范是最终权威依据。\n\
  \n#### HTML 文档\n\nHTML 通常以文档形式生成和消费。我们可能会谈论 HTML 片段，但大多数情况下，网站会用完整的 HTML 文档响应请求，然后由客户端解析并在设备上呈现。\n\
  \n作为 HTML 句法的简要介绍，我们来看一个非常简单的 HTML 文档。清单 1-1 包含一个\"Hello World\"版本的 HTML 文档。\n\n\
  © Mark J. Collins 2017\nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and Multimedia*,\
  \ DOI 10.1007/978-1-4842-2463-2_1\n\n**清单 1-1.** 简单的 HTML5 文档\n\n```\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>HTML5\
  \ Sample Document</title>\n</head>\n<body>\n  Hello World!\n</body>\n</html>\n```\n\
  \n#### 元素\n\n让我们稍作分解，看看本文档使用的结构。这些基本概念将用于你后续编写的所有内容。文档由多个 HTML 元素组成，这些元素以层级方式嵌套。\n\
  \n与其他标记语言一样，*标签*用于为内容附加有用信息。HTML *元素*通常遵循以下结构：\n\n`<tag attribute=\"value\" ...\
  \ > content </tag>`\n\n例如，文档标题\"My First HTML5 Document\"由开始标签`<title>`和结束标签`</title>`标识。大多数情况下，每个元素都有开始和结束标签，两者相同，只是结束标签前多一个\"\
  /\"字符。有时元素和标签可互换使用；但准确来说，元素由开始标签、结束标签及其间的内容组成。\n\n元素通常包含其他元素。注意在示例文档中，`html`元素包含`head`和`body`元素。`head`元素还包含`meta`和`title`元素。为提高可读性，这种嵌套层次通过缩进子元素来体现。\n\
  \n#### DOCTYPE\n\nDOCTYPE 元素是一个特例，不遵循任何标准元素格式。它背后也有一段历史。在 Web 开发的早期（如 IE4 和 Netscape\
  \ 时代），网页是根据当时浏览器的实现方式来开发的。随着 HTML 规范的演进和成熟，基于更新规范开发的新浏览器无法兼容旧网页。因此引入了 DOCTYPE 元素，让每个页面指定其遵循的规范版本。浏览器需要解读此信息并提供必要的向后兼容性。\n\
  \n我不打算深入所有繁琐细节，但你可以想象，这对浏览器厂商和 Web 开发者来说都是一团乱麻。幸运的是，在 HTML5 中，DOCTYPE 基本可以忽略。只需将其设置为`html`：\n\
  \n```\n<!DOCTYPE html>\n```\n\n#### 属性\n\n开始标签可以包含一个或多个*属性*，示例文档中就有两个例子。本章稍后我将解释可用的不同属性。属性用于提供元素的详细信息。例如，`html`元素包含`lang=\"\
  en\"`，告知浏览器内容是用英文编写的。如果浏览器当前语言不是英文，它可能会利用此信息提示翻译内容。\n\n有一组称为*全局属性*的属性可用于任何 HTML\
  \ 元素。附录 C 提供了这些属性的完整列表及其他参考资料。你最常用的两个是`id`和`class`。`id`属性定义元素的唯一键；它必须在整个 HTML 文档中唯一。这常用于在\
  \ JavaScript 中访问元素。`class`属性有时被称为 CSS 类，因为它常用于为元素应用样式。与`id`不同，`class`属性是非唯一键；单个值应用于需要相同格式的元素。\n\
  \n除全局属性外，每种元素类型可能支持其他属性。注意`meta`元素包含`charset`属性：\n\n```\n<meta charset=\"utf-8\"\
  \ />\n```\n\n`charset`属性指定此页面使用的字符集编码类型。你应始终定义字符集；尤其是当页面需要显示非标准字符时，这一点尤为重要。\n\n\
  有些布尔属性不需要值；它们的存在表示真值，缺失表示假值。例如，复选框选中时包含`checked`属性，未选中时则移除该属性。你可能会看到`checked=\"\
  checked\"`这样的写法，尤其是在服务器端代码生成的动态 HTML 中。但浏览器会忽略该值，你只需包含属性即可；无需提供值。\n\n#### 杂项结构规则\n\
  \n\n\n"
- '# 排版后的内容


  请注意，`meta` 元素没有结束标签。有些元素无需使用结束标签，它们被称为*自闭合*标签。这或许显而易见，但这些元素不能包含任何内容，因为内容应放置在开始和结束标签之间。标签末尾的“/”字符在技术上并非必需，但普遍共识是应当包含它，并且某些
  HTML 验证器会在缺少该字符时发出警告。


  请记住，浏览器会忽略制表符、回车符和多余空格等空白字符。你可以将所有文本左对齐，渲染后的 HTML 结果将完全相同。甚至可以故意将整个文档写在一行内。但常规惯例和最佳实践是按照此处所示的方式格式化
  HTML。


  在继续之前，我想再补充一点：所有这些结构都是可选的。事实上，如果你将以下内容作为整个 HTML 文档输入，浏览器会渲染出完全相同的内容。


  ```

  Hello World!

  ```


  > **注意** 浏览器通常非常擅长在文档中省略细节时使用默认配置。然而，我假设你阅读本书是因为你想创建专业质量的 Web 应用。这些额外的元素提供了重要信息，你应当养成编写结构良好的文档的习惯，以尽可能提高页面的实用性。


  ## 第 1 章 ■ 超文本标记语言


  HTML 标签不区分大小写。普遍惯例是使用小写标签，本书也将全程遵循此惯例。但你可以使用 `<HEAD>` 或 `<Head>`，它们同样有效。


  ## HTML 元素


  如你所见，`html` 元素是根节点：即文档的起始点。关于它没什么可多说的。`html` 元素可以包含一个 `head` 元素和一个 `body` 元素。除了全局属性外，它还支持
  `manifest` 属性。


  ```html

  <html manifest="www.mywebsite.com/cache.appcache">

  ```


  `manifest` 属性用于定义应用程序缓存。该属性的值是缓存清单的 URL 或地址，缓存清单是一个列出应缓存资源的文本文件。这可以是绝对或相对 URL。当这些资源缓存在客户端后，即使断开网络连接，你的页面也能正常加载。缓存这些资源还可以让页面加载更快，并减轻
  Web 服务器的负载。


  > **提示** 清单文件的标准扩展名是 `.appcache`。Web 服务器必须以正确的 MIME 类型（即 `text/cache-manifest`）提供此文件。根据你使用的
  Web 服务器类型，配置方式会有所不同。更多信息请参阅此文章：[`www.html5rocks.com/en/tutorials/appcache/beginner/`](http://www.html5rocks.com/en/tutorials/appcache/beginner/)。


  ### Head 元素


  `head` 元素中没有实际内容；那是 `body` 元素的职责。在第 4 章到第 8 章中，我将解释所有用于定义主体内容的各种元素。但本章的剩余部分，我们将探讨
  `head` 元素。


  现在，让我们看看可以包含在 `head` 元素内的元素。你已经见过 `title` 和 `meta` 元素，稍后我会更详细地介绍它们。还有一些其他有用的元素也属于这里。


  #### Title 元素


  `title` 元素指定了此页面的标题。它会在几个地方显示：


  - 在浏览器标题栏或选项卡中（见图 1-1）

  - 搜索引擎通常会在搜索结果中包含此标题

  - 将页面添加到收藏夹或书签时，此标题会用作名称（见图 1-2）


  ![](img/index-34_1.jpg)


  ![](img/index-34_2.jpg)




  '
