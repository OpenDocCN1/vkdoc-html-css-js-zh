- "# 第 13 章 表格样式\n\n## 类型\n\n`list-style-type` 属性定义了所使用的标记。以下是支持的标准值：\n\n- `none`\
  \ - 无标记\n- `disc` - 实心圆（无序列表的默认值）\n- `circle` - 空心圆\n- `square` - 实心方块\n- `decimal`\
  \ - 顺序整数（1, 2, 3…，有序列表的默认值）\n- `decimal-leading-zero` - 与 `decimal` 相同，但会添加前导零\n\
  - `lower-alpha` - 顺序小写字母（a, b, c…）\n- `upper-alpha` - 顺序大写字母（A, B, C…）\n- `lower-roman`\
  \ - 小写罗马数字（i, ii, iii…）\n- `upper-roman` - 大写罗马数字（I, II, III…）\n\n前四个选项（`none`、`disc`、`circle`\
  \ 和 `square`）用于无序列表（`ul`）。其余选项仅用于有序列表（`ol`）。需要明确的是，如果你对有序列表使用了前四个选项中的任何一个（例如 `disc`），每个列表项都将显示相同的标记。有序列表的目的是让浏览器能够依次为它们编号；因此，你实际上已经将其变成了一个无序列表。反之，如果你对无序列表使用了类似\
  \ `decimal` 的值，项目将被依次编号，此时你便拥有了一个有序列表。`ul` 和 `ol` 元素之间唯一的真正区别是 `list-style-type`\
  \ 属性的默认值不同，分别是 `disc` 和 `decimal`。\n\n对于有序列表，你还可以通过在 HTML 标记中分配 `type` 属性来控制所使用的标记，这在[第\
  \ 4 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_4)中已解释过。它支持 `1`、`a`、`A`、`I` 和\
  \ `I` 这些值，分别对应于 CSS 中 `list-style-type` 属性的 `decimal`、`lower-alpha`、`upper-alpha`、`lower-roman`\
  \ 和 `upper-roman` 值。但请注意，CSS 中应用的样式会覆盖标记设置。\n\n**注意**：还有其他一些通常被支持的标记，例如 `lower-latin`\
  \ 和 `lower-greek`。此外，还有许多其他语言定义的标记，但浏览器支持度有限。\n\n### 图像\n\n如果这些样式都不合适，你可以通过设置 `list-style-image`\
  \ 属性来定义自己的标记。没有选项可以定义渲染图像的大小，因此请确保使用的图像具有适合你内容的固有尺寸。以下 CSS 规则将使用 `pawn.png` 图像作为标记。渲染效果如图\
  \ 13-17 所示。\n\n```\nul {\n    list-style-image: url(\"pawn.png\");\n}\n```\n\n![图\
  \ 13-17](img/index-289_1.jpg)\n\n**图 13-17.** 为列表项使用自定义图像\n\n**提示**：在使用自定义图像时，你还应该指定\
  \ `list-style-type` 属性。该属性应放在 `list-style-image` 声明之前。如果因某些原因无法加载图像，此属性将用作后备方案。\n\
  \n#### 位置\n\n使用 `list-style-position` 属性，你可以决定标记是否应位于包含块内部。如果指定了值 `inside`，则标记与块对齐，且项目缩进以为标记腾出空间。如果指定了\
  \ `outside`，则列表项与块对齐，而标记将位于块的外部。\n\n## 简写属性\n\n与许多其他 CSS 属性一样，存在一个简写属性，允许你在单个声明中指定所有列表项属性。这三个值\
  \ —— `type`、`image` 和 `position` 可以按任意顺序提供，并用空格分隔。例如：\n\n```\nlist-style: url(\"\
  pawn.png\") outside square;\n```\n\n#### 总结\n\n在本章中，我演示了如何使用 CSS 为表格设置样式。仅需几条简单的规则，你就可以轻松地将一个不太美观的表格变成视觉上吸引人的呈现。除此之外，你还可以通过更改\
  \ `display` 属性，将表格布局技术应用于其他非表格数据。\n\n这种技术的一个常见用途是，在保留原始语义元素的同时，将网页布局为表格元素。由于此布局是在\
  \ CSS 中执行的，你可以使用媒体查询根据设备特性应用替代格式。\n\n我还演示了如何使用支持的 CSS 属性为列表项设置样式。此外，使用表格来布局列表项是一种流行的做法。\n\
  \n"
- "# 第 14 章 Flexbox\n\n在本章中，我将解释 `display` 属性的另一个值：`flex`。这是一种非常灵活（双关语）的布局元素方式。从概念上讲，这非常简单，尽管因其灵活性，术语可能会令人困惑。使用\
  \ `flex` 时，你需要一个容器元素，其内部包含子项。在容器和项目上需要配置单独的属性。\n\n它受 IE11 及以上版本以及所有主流浏览器支持，但在 Safari\
  \ 中存在一些问题。如果你必须支持这些浏览器，你需要提供一个后备解决方案。然而，我相信这将成为首选方法，尤其是在支持响应式网页时。\n\n其术语与方向无关；你不会看到任何诸如\
  \ `height`、`width`、`horizontal` 或 `vertical` 之类的值。即使是 `flex-direction` 属性也使用 `row`\
  \ 和 `column` 这两个值。使用 `flex` 的挑战之一是你需要翻译这些术语。例如，如果我提到一个元素的 `height`（高度）和 `width`（宽度），你会立刻明白我指的是什么。如果我提到它的\
  \ `main size`（主轴尺寸），你就需要根据 `flex-direction` 来进行转换。\n\n#### 容器配置\n\n我将首先解释可以在容器上指定的属性。第一个属性当然是\
  \ `display` 属性，应将其设置为 `flex`。\n\n```\n.container {\n    display: -webkit-flex;\n\
  \    display: flex;\n}\n```\n\n**警告**：为了支持 Safari，你需要使用 `-webkit` 前缀。\n\n#### 弹性方向\n\
  \n最重要的属性是 `flex-direction`，它为其余属性建立了框架。它应用于容器元素，并支持以下值：\n\n- `row` - (默认值) 项目水平排列。实际方向由\
  \ `direction` 属性决定，即 `ltr` 或 `rtl`。如果使用 `ltr` 模式，项目将从左到右排列。\n- `row-reverse` - 项目按与\
  \ `direction` 属性相反的方向水平排列。\n- `column` - 项目垂直排列，从上到下。\n- `column-reverse` - 项目从下到上垂直排列。\n\
  \n© Mark J. Collins 2017  \nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and\
  \ Multimedia*, DOI 10.1007/978-1-4842-2463-2_14\n\n![图 14-1](img/index-291_1.png)\n\
  \n图 14-1 说明了当使用 `flex-direction: row;` 且假设为 `ltr` 模式时的术语含义。\n\n**图 14-1.** 说明弹性盒模型术语\n\
  \n许多后续术语都是基于从 `flex-direction` 派生出来的值进行配置的。例如，*主轴* 是弹性方向所在的轴，在此例中为水平轴，而*交叉轴* 则为垂直轴。*主轴起点*\
  \ 和*主轴终点* 定义了容器元素的开始和结束边缘。在此例中，这是左右边缘。类似地，*交叉轴起点* 和*交叉轴终点* 定义了容器沿另一维度的边缘——在此例中为顶部和底部。容器中项目的大小不由\
  \ `width`（宽度）和 `height`（高度）标识，而是由*主轴尺寸* 和*交叉尺寸* 值指定。\n\n\n\n"
- "# Flexbox 布局详解\n\n对于特定的 `flex-direction` 值，所有这些术语都会转换为熟悉的含义，例如垂直、左对齐、底部和宽度。当你初次学习使用\
  \ Flex 布局时，用这些更熟悉的术语来思考可能会更容易。但请注意，当 `flex-direction` 改变时，这些术语的含义也会随之改变。这一点在图 14-2\
  \ 中得到了说明，该图展示了当使用 `flex-direction: column;` 时这些值的情况。\n\n![图 14-2 示意图](img/index-292_1.png)\n\
  \n**第 14 章 ■ Flexbox**\n\n***图 14-2.** 当弹性方向为 column 时使用的术语*\n\n## Flex Wrap（弹性换行）\n\
  \n当 `flex-direction` 为 `row`（或 `row-reverse`）时，容器中的项目水平排列，效果类似于使用 `display: inline;`。当容器宽度被填满后，后续项目会换行到下一行。`flex-wrap`\
  \ 属性控制是否以及如何进行换行。有以下三种可选值：\n\n- `nowrap` - （默认值）项目不换行，而是在单行（或单列）中显示。\n- `wrap` -\
  \ 项目会按照初始方向换行到下一行或下一列。\n- `wrap-reverse` - 项目会换行到下一行或下一列，但顺序相反。\n\n`wrap` 和 `wrap-reverse`\
  \ 选项在图 14-3 中进行了展示。\n\n![图 14-3 示意图](img/index-293_1.png)\n\n**第 14 章 ■ Flexbox**\n\
  \n***图 14-3.** 换行选项演示*\n\n当使用 `flex-direction: row-reverse;` 时，换行的工作原理相同，只是方向相反。当使用\
  \ `flex-direction: column;` 时，项目将从上到下排列。如果指定了 `wrap-reverse`，则在换行到下一列后，项目将从下到上排列。第三行或第三列将使用初始方向。\n\
  \n你可以使用 `flex-flow` 属性同时指定 `flex-direction` 和 `flex-wrap` 属性。该属性需要两个值：分别对应这两个属性，值之间用空格分隔。默认值为\
  \ `row nowrap`。\n\n## Justification（主轴对齐）\n\n`justify-content` 属性决定了项目在主轴方向上，在单行（或单列）内的排列方式（稍后我也会解释交叉轴上的对齐方式）。有五个可用选项，如图\
  \ 14-4 所示。\n\n![图 14-4 示意图](img/index-294_1.png)\n\n**第 14 章 ■ Flexbox**\n\n***图\
  \ 14-4.** 主轴方向上的对齐*\n\n`flex-start` 值表示项目对齐到主轴的起始边缘。同样，`flex-end` 值表示项目对齐到主轴的结束边缘。当使用\
  \ `flex-direction: row;` 时，这些值分别转换为左对齐和右对齐，如图 14-4 所示。然而，当使用 `row-reverse` 时，主轴起始边缘和主轴结束边缘会互换。同样，如果\
  \ `flex-direction` 使用 `column`，这些边缘则变为顶部和底部边缘。\n\n`space-between` 选项将第一个项目对齐到主轴起始边缘，最后一个项目对齐到主轴结束边缘。然后调整项目之间的间距，使它们均匀分布。`space-around`\
  \ 选项与之类似，不同之处在于第一个项目之前和最后一个项目之后也会插入相等的间距。\n\n生成的各行（或各列）内容也可以使用 `align-content` 属性沿交叉轴进行对齐。可用选项与\
  \ `justify-content` 类似，只是多了一个 `stretch` 选项。这些选项在图 14-5 中进行了展示。\n\n![图 14-5 示意图](img/index-295_1.png)\n\
  \n**第 14 章 ■ Flexbox**\n\n***图 14-5.** 交叉轴方向上的对齐*\n\n`flex-start` 和 `flex-end` 选项将内容对齐到交叉轴的起始边缘或结束边缘。如果\
  \ `flex-direction` 是 `row` 或 `row-reverse`，这些边缘分别对应于顶部和底部边缘，如图 14-5 所示。对于 `column`\
  \ 或 `column-reverse`，这些边缘则变为左侧和右侧边缘。`stretch` 选项的工作原理类似于 `space-between`，但项目会沿交叉轴拉伸以填充行（或列）之间的间隙。\n\
  \n> **提示** 你需要记住：`justify-content` 属性沿主轴对齐项目，而 `align-content` 属性沿交叉轴对齐行（或列）。这两个名称本身并没有太大帮助，所以请在心里记下：`justify-content`：主轴，`align-content`：交叉轴。\n\
  \n## Aligning Items（项目对齐）\n\n在我目前为止的所有图示中，所有项目都具有相同的交叉轴尺寸。当使用 `flex-direction: row;`\
  \ 时，这对应于项目的高度。如果项目尺寸不同，那么你需要决定如何对齐它们。`align-items` 属性提供了五个选项，如图 14-6 所示。我刚才解释了 `align-content`\
  \ 属性，它用于对齐容器内的行（或列）。相比之下，`align-items` 属性定义了项目在单行（或单列）中的排列方式。两者都沿交叉轴调整对齐。\n\n![图\
  \ 14-6 示意图](img/index-296_1.png)\n\n**第 14 章 ■ Flexbox**\n\n***图 14-6.** 行内项目对齐*\n\
  \n再次强调，`flex-start` 和 `flex-end` 选项分别将项目对齐到交叉轴的起始边缘和结束边缘。`center` 选项将项目沿交叉轴居中。`baseline`\
  \ 选项将项目对齐，使得它们的基线在行内处于相同位置。\n\n> **提示** “基线”（*baseline*）一词源自印刷领域，字符沿着一条基线对齐。这不一定就是文本的底部，而是大多数字符所坐落的不可见线条。基线为字符放置提供了视觉参考，使文本行看起来笔直。在\
  \ CSS 中，这个概念更加复杂，因为我们处理的不只是文本。如果你想深入研究这个主题，这里有一篇不错的文章：[`www.smashingmagazine.com/2012/12/17/css-baseline-the-good-the-bad-and-the-ugly`](http://www.smashingmagazine.com/2012/12/17/css-baseline-the-good-the-bad-and-the-ugly)\n\
  \n## Item Configuration（项目配置）\n\n到目前为止，我已经解释了如何配置容器（即父元素），它提供了项目排列的整体结构。你也可以配置项目本身，以实现对其对齐方式的精细控制。\n\
  \n**第 14 章 ■ Flexbox**\n\n### Grow and Shrink（增长与收缩）\n\n弹性容器中的项目可以增长或收缩以适应容器的大小。这一点非常重要，尤其是在响应式设计中。要配置此工作机制，你需要了解以下三个要素：\n\
  \n- *Basis*（基础尺寸） - 项目的最佳尺寸；默认情况下，是其固有尺寸。\n- *Grow*（增长因子） - 当有多余空间时，该项目应如何增长。\n\
  - *Shrink*（收缩因子） - 当空间不足时，该项目应如何收缩。\n\n> **注意** 术语 *basis*、*grow* 和 *shrink* 仅适用于主轴方向。\n\
  \n元素的增长和收缩量通过 `flex-grow` 和 `flex-shrink` 属性设置。这些是数值，不带任何单位。浏览器根据项目的增长因子与总增长因子的比例来计算要增加的空间量。例如，如果你有三个项目，其\
  \ `flex-grow` 属性分别设置为 `1`、`2` 和 `3`，那么总增长因子为 `6`。在这种情况下，第一个项目将获得 `1/6` 的额外空间，第二个获得\
  \ `2/6`，第三个获得 `3/6`。`flex-shrink` 属性的工作方式相同，区别在于它在必要时用于移除空间。\n\n`flex-grow` 和 `flex-shrink`\
  \ 属性永远不会同时使用。`flex-grow` 仅在有多余空间时使用，而 `flex-shrink` 仅在空间不足时使用。显然，这两种情况不可能同时成立。此外，这两个属性都不允许使用负值。值为\
  \ `0` 表示该项目不应增长（或收缩）。\n\n`flex-basis` 属性定义了项目的基础尺寸。这是一个距离单位，可以指定为绝对值或相对单位之一。默认值\
  \ `auto` 使用项目的固有尺寸作为基础尺寸。\n\n\n\n为了方便，您可以使用`flex`简写属性同时设置三个值：`grow`、`shrink`和`basis`。请确保按照`grow`、`shrink`、`basis`的顺序设置这三个值。还有一些特殊值可以用来同时设置这三个属性：\n\
  \n- `flex: auto;` - 将`grow`和`shrink`设为`1`，`basis`设为`auto`。\n- `flex: none;` - 将`grow`和`shrink`设为`0`，`basis`设为`auto`。元素将使用其固有尺寸，并且不会增长或收缩。\n\
  \n#### 演示\n\n`basis`的概念经常被误解。考虑之前的示例，其中三个元素的`flex-grow`分别设置为`1`、`2`和`3`。有些人可能会认为第二个元素总是第一个的两倍大，而第三个元素是第一个的三倍。然而，在大多数情况下，事实并非如此；只有超出其基础尺寸的剩余空间才遵循这个比例。这里的示例将有助于阐明这一点。\n\
  \n以下标记创建了一个`<section>`元素，其中包含四个子元素：两个`<p>`元素、一个`<div>`元素和一个`<img>`元素。每个子元素都有一个`class`属性，以便我们可以更轻松地通过\
  \ CSS 配置它们。\n\n```\n<div class=\"std1\"></div>\n\n<section>\n\n  <p class=\"i1\"\
  >Fourscore and seven years ago, our fathers brought forth to this continent, a new\
  \ nation</p>\n\n  <img class=\"i2\" src=\"king.jpg\" alt=\"King\" />\n\n  <div class=\"\
  i3\">\n\n    <div class=\"std2\"></div>\n\n  </div>\n\n  <p class=\"i4\">This is\
  \ some text</p>\n\n</section>\n```\n\n这里还创建了几个额外的`<div>`元素，我将它们设置为固定大小，以提供参考框架，帮助可视化增长（和收缩）行为。完整的\
  \ CSS 代码如清单 14-1 所示。\n\n***清单 14-1.*** flex 演示的 CSS\n\n```\n/* 在尺寸值中包含边框 */\n* {\n\
  \  box-sizing: border-box;\n}\n\n.std1 {\n  height: 30px;\n  width: 350px;\n  border:\
  \ 1px solid black;\n  background-color: lightblue;\n}\n\n.std2 {\n  height: 30px;\n\
  \  width: 50px;\n  border: none;\n  background-color: lightblue;\n}\n\nsection {\n\
  \  display: flex;\n  flex-wrap: nowrap;\n  justify-content: flex-start;\n  align-content:\
  \ flex-start;\n  align-items: stretch;\n}\n\n/* 为子元素添加边框 */\nsection > * {\n  border:\
  \ 1px solid black;\n  margin: 0;\n}\n\n.i1 {\n  flex: 1 3 350px;\n}\n\n/* 不是必需的，这是图像的默认值\
  \ */\n.i2 {\n  flex: none;\n}\n\n.i3 {\n  height: 75px;\n  background-color: lightyellow;\n\
  \  flex: 2 0 50px;\n}\n\n.i4 {\n  flex: 3 1 auto;\n}\n```\n\n大部分 CSS 规则用于帮助设置演示；我高亮显示了与\
  \ flex 相关的声明。容器设置了`display: flex;`属性，其余属性设置为默认值，可以省略。第一个元素的基础尺寸为`350px`。我还将带有`std1`类的空`<div>`元素设置为相同尺寸。类似地，在第三个元素中，我嵌入了带有`std2`类的空`<div>`元素。其固定尺寸为`50px`，与第三个元素的基础尺寸相同。最后一个`<p>`元素没有显式的`basis`，因此它将使用固有尺寸，即宽度刚好能容纳所有文本而不换行。\n\
  \n对于图像，我将`flex`属性设置为`none`，这是图像的默认值。图像默认不会增长或收缩。对于`<div>`元素，我将`grow`设为`2`，`shrink`设为`0`；该元素将增长但不会收缩。对于两个`<p>`元素，我设置了不同的`grow`和`shrink`值，以演示它们的工作方式。\n\
  \n如果在浏览器中渲染此页面，并将窗口宽度调整为刚好能容纳每个子元素的基础尺寸，效果将如图 14-7 所示。\n\n***图 14-7.*** 具有精确基础尺寸的\
  \ flex 元素\n\n提供参考尺寸的两个固定`<div>`元素以蓝色显示。如您所见，子元素恰好是其`basis`的尺寸。另外，最后一个子元素的文本刚好可以容纳而不会换行。\n\
  \n\n\n如果此时将窗口放大，图像会按预期保持不变，但其他三个子元素会按照 `flex-grow` 属性成比例增长，如图 14-8 所示。\n\n***图 14-8.**\
  \ 演示增长行为*\n\n![](img/index-300_1.png)\n\n**第 14 章 ■ Flexbox**\n\n当容器尺寸大于各个条目基准尺寸之和时，会采用增长计算。这种情况下，每个条目实际分配到的尺寸可用以下公式表示：\n\
  \n```\n基准尺寸 + 剩余空间 * (增长值 / 所有增长值之和)\n```\n\n#### 计算收缩\n\n如果将窗口缩小到小于基准尺寸，图像和空 `div`\
  \ 元素不会收缩，但两个段落元素会收缩。窗口缩小时，页面呈现如图 14-9 所示。\n\n***图 14-9.** 演示收缩行为*\n\n我将第一个段落的 `flex-shrink`\
  \ 属性设置为 `3`，最后一个段落设置为 `1`；然而，如图 14-9 所示，第一个段落的收缩量远不止最后一个段落的三倍。由于某些原因，收缩计算与增长计算的方式不同。它考虑了条目的基准值。当容器尺寸小于总基准尺寸时，每个条目会采用收缩计算，具体可用以下公式表示：\n\
  \n```\n基准尺寸 - 溢出尺寸 * (收缩值 * 基准尺寸 / 所有(收缩值 * 基准尺寸)之和)\n```\n\n现在我们来具体计算一下，先计算最终总和。有两个条目的收缩值不为零。\n\
  \n最后一个段落的固有尺寸约为 110 像素。两者之和为 `3 * 350 + 1 * 110 = 1160`。\n\n现在计算比例：第一个条目将是 `3 *\
  \ 350 / 1160 ≈ 90%`，最后一个段落是 `1 * 110 / 1160 ≈ 10%`。\n\n因此，只有 10% 的溢出尺寸会从最后一个段落中减去。了解这一点后，你可以调整收缩值来应对这种情况。例如，如果你希望它们以相同的速率收缩，在这种情况下，可以将第一个段落的收缩值设置为大约\
  \ `0.35` 来实现。\n\n#### 统一增长\n\n我以更复杂的情况开始，是为了了解基准值如何影响条目的增长和收缩。\n\n但对于更简单的应用，你可以将所有条目的基准值设为零。如果基准值为零，收缩值也不再适用；条目只能增长。为此，`flex`\
  \ 属性允许使用单个数值，该数值会作为 `flex-grow` 属性。这个简写形式还会将 `flex-shrink` 和 `flex-basis` 属性设为零。\n\
  \n![](img/index-301_1.jpg)\n\n**第 14 章 ■ Flexbox**\n\n为了演示这一点，我将修改之前的 CSS 来使用这个简写：\n\
  \n```css\n.i1 {\n  /*flex: 1 3 350px;\n  flex: 1 .35 350px;*/\n  flex: 3;\n}\n\n\
  .i3 {\n  height: 75px;\n  background-color: lightyellow;\n  /*flex: 2 0 50px;*/\n\
  \  flex: 1;\n}\n\n.i4 {\n  /*flex: 3 1 auto;*/\n  flex: 2;\n}\n```\n\n在这个示例中，`div`\
  \ 元素的增长值为 `1`，两个段落分别设置为 `3` 和 `2`。\n\n第一个段落的大小将是 `div` 元素的三倍，最后一个段落是两倍。但有一个例外，因为\
  \ `div` 元素有一个固定宽度的子元素，它不会收缩到比该子元素更小。如图 14-10 所示。\n\n***图 14-10.** 收缩至超过固有尺寸*\n\n\
  对于增长计算而言，`div` 元素的基准尺寸仍然为零。注意，最后一个段落的宽度是第一个段落的 2/3，因为增长值分别设置为 `2` 和 `3`。无论容器尺寸如何，这两个元素都将始终保持这一比例。\n\
  \n#### 顺序\n\n默认情况下，条目按照它们在文档中出现的顺序渲染。对于 flex 条目，你可以设置它们的 `order` 属性来明确定义其顺序。如果未指定，则顺序值为零，所有具有相同顺序的条目将按照它们在文档中的顺序显示。允许使用负值。\n\
  \n![](img/index-302_1.png)\n\n**第 14 章 ■ Flexbox**\n\n\n\n"
- "# 使用 Flexbox 实现响应式布局\n\n这是一个非常实用的功能，尤其是在响应式网页设计中。通过 `CSS` 控制排列顺序，意味着可以根据媒体查询进行调整。例如，当使用小型设备时，可以设置\
  \ `order` 属性将某些特定内容移至页面底部。\n\n> **提示：** 你无需为所有项目设置 `order` 属性。例如，若想让某个特定项目显示在最前面，只需将其\
  \ `order` 设置为 `-1`，其余项目保持初始值即可。所有其他项目的 `order` 值默认为 `0`，因此该元素会排在首位。\n\n### 覆盖对齐方式\n\
  \n我之前解释过，容器上的 `align-items` 属性如何控制行（或列）中项目在交叉轴上的对齐方式。该属性适用于容器中的所有弹性项目。不过，你可以通过为单个项目设置\
  \ `align-self` 属性来覆盖此设置。它支持与 `align-items` 属性相同的六个值。举个简单的例子，以下 CSS 为第一个段落和 `div`\
  \ 元素设置了此属性，结果如图 14-11 所示。\n\n```css\n.i1 {\n    /*flex: 1 3 350px;\n    flex: 1\
  \ .35 350px;*/\n    flex: 3;\n    align-self: flex-end;\n}\n\n.i3 {\n    height:\
  \ 75px;\n    background-color: lightyellow;\n    /*flex: 2 0 50px;*/\n    flex:\
  \ 1;\n    align-self: center;\n}\n```\n\n***图 14-11.*** *使用 `align-self` 属性*\n\n\
  ## 第 14 章 ■ Flexbox\n\n### 垂直示例\n\n以一个使用垂直主轴方向的简单示例为例，我将搭建一个包含固定尺寸页眉和页脚的典型页面布局。主体部分将允许根据现有内容自动扩展。标记如下：\n\
  \n```html\n<section class=\"vertical\">\n    <header>Header</header>\n    <footer>Footer</footer>\n\
  \    <main>\n        <p>Lorem ipsum dolor...</p>\n    </main>\n</section>\n```\n\
  \n此 `section` 元素包含 `header`、`footer` 和 `main` 元素。我将 `footer` 元素放在 `main` 元素之前，以演示\
  \ `order` 属性。为了格式化此布局，使用了以下 CSS：\n\n```css\n.vertical {\n    display: flex;\n  \
  \  flex-direction: column;\n}\n\nheader, footer {\n    text-align: center;\n   \
  \ background-color: lightgreen;\n    flex: 0 0 35px;\n}\n\nmain {\n    flex: auto;\n\
  }\n\nfooter {\n    order: 3;\n}\n```\n\n这里将 `flex-direction` 设置为 `column`，因此主轴方向变为垂直。项目将沿垂直方向伸缩。`header`\
  \ 和 `footer` 不允许伸缩，且基准尺寸设置为 `35` 像素。相比之下，`main` 元素设置了 `flex: auto;` 以允许伸缩，其基准尺寸由内容的固有尺寸决定。`footer`\
  \ 的 `order` 属性设置为 `3`，因此页脚将排列在最后。渲染结果如图 14-12 所示。\n\n![](img/index-304_1.jpg)\n\n\
  ***图 14-12.*** *垂直布局示例*\n\n#### 总结\n\n在本章中，我解释了如何使用 flexbox 在灵活布局中排列项目。基本思路是定义预测性规则来排列\
  \ HTML 元素，然后让浏览器根据当前窗口尺寸应用这些规则。你可以在容器以及容器内的项目上配置属性。\n\n在容器上，你可以定义项目渲染时的流动方向。其属性和术语与方向无关，例如使用\
  \ `start` 和 `end` 而非 `top` 或 `bottom`，因此在构思解决方案时可能需要做一些转换。容器的属性还允许你指定项目行或列的对齐方式。\n\
  \n在项目上，你可以指定项目应如何根据可用空间沿主轴进行伸缩。你可以覆盖沿交叉轴的对齐方式。你还可以设置项目的显示顺序 `order`，从而通过 CSS 调整其排列顺序。这使你能够根据设备特性，利用媒体查询重新定位元素。\n\
  \n在下一章中，我将演示如何使用动画和变换来为你的网页增添趣味与活力。\n\n---\n\n## 第 15 章\n\n### 动画与变换\n\n#### 动画\n\
  \n\n\n"
- "# 动画与变换\n\n动画看起来非常令人印象深刻，但实际上实现起来却相当简单。动画本质上就是随时间改变一个或多个属性。过去这需要编写 JavaScript 来设置计时器，并在每次计时事件中操作属性。而现在，你只需使用\
  \ CSS 就能完成。\n\n#### 关键帧\n\n在 CSS 中，创建动画的第一步是定义*关键帧*。每个关键帧指定了在特定时间点上的一组 CSS 属性。这大致类似于一部动画电影，它由一组称为帧的图片组成，这些图片被快速连续播放，从而产生画面在运动的错觉。\n\
  \n幸运的是，我们不需要像大多数视频那样每秒提供 30 或 60 帧。\n\n使用关键帧类似于定义渐变，这在第 [12](http://dx.doi.org/10.1007/978-1-4842-2463-2_12)\
  \ 章中已经解释过。你至少需要定义起始帧和结束帧，浏览器会在它们之间提供平滑的过渡。\n\n不过，你也可以定义额外的帧来控制动画的进程。动画有一个指定的持续时间，每个关键帧被分配到这个持续时间内的一个特定时间点，该时间点以百分比表示。初始帧位于\
  \ `0%`，最终帧位于 `100%`。\n\n关键帧有时被称为 `@` 规则（at-rules）。它们类似于普通的 CSS 规则，只是使用百分比作为选择器。在每个帧内部，你可以指定任意数量的\
  \ CSS 属性。一个简单的关键帧可能看起来像这样：\n\n```css\n@keyframes colors {\n  0% {\n    background-color:\
  \ yellow;\n  }\n  100% {\n    background-color: blue;\n  }\n}\n```\n\n在动画开始时，背景颜色是黄色，到动画结束时，颜色逐渐变为蓝色。你还可以添加更多的帧。假设你想要颜色从红色变为黄色，再变为蓝色，然后又变回红色。关键帧可以这样定义：\n\
  \n```css\n@keyframes colors {\n  0%, 100% {\n    background-color: red;\n  }\n \
  \ 33% {\n    background-color: yellow;\n  }\n  66% {\n    background-color: blue;\n\
  \  }\n}\n```\n\n注意，初始帧和最终帧具有相同的值，因此它们可以在同一个帧中指定，百分比之间用逗号分隔，这在 CSS 选择器语法中是逻辑“或”运算符。\n\
  \n另外，`0%` 和 `100%` 可以分别用别名 `from` 和 `to` 来表示。所以，第一组关键帧也可以这样写：\n\n```css\n@keyframes\
  \ colors {\n  from {\n    background-color: yellow;\n  }\n  to {\n    background-color:\
  \ blue;\n  }\n}\n```\n\n#### 配置动画\n\n动画被应用于一个或多个元素。例如，前面的关键帧修改了 `background-color`\
  \ 属性。这需要应用到某个元素上，然后该元素的背景颜色就会随动画变化。为了提供一个简单的演示，我将使用一个空的 `div` 元素：\n\n```html\n<div\
  \ class=\"circle\"></div>\n```\n\n为了增加一点趣味性，我将通过以下 CSS 规则把它变成一个红色的圆：\n\n```css\n\
  .circle {\n  width: 300px;\n  height: 300px;\n  margin: 10px 0 0 0;\n  border-radius:\
  \ 50%;\n  background-color: red;\n}\n```\n\n这将创建一个高度等于宽度的 `div` 元素。将半径设置为 `50%`\
  \ 会将这个正方形变成一个圆形。最后，为了给背景颜色添加动画效果，使用以下规则：\n\n```css\n.circle {\n  animation: colors\
  \ 5s;\n}\n```\n\n这里使用了 `animation` 简写属性来指定两个必需的属性。第一个指示要使用的关键帧的名称，也就是之前创建的那个。第二个指定动画的持续时间，这里是\
  \ 5 秒。当页面加载时，圆形会从红色开始，然后逐渐变为黄色，再变为蓝色，最后变回红色。\n\n## 动画属性\n\n有八个属性可用于配置动画。我之前提到了前两个；以下是完整的集合及其可用选项：\n\
  \n- `animation-name` - 定义要设置的属性及其相对时间点的关键帧名称。\n\n\n### CSS 动画属性说明\n\n- `-duration`\
  \ - (默认 `0s`) 单次执行动画所需的总时间。\n\n- `-timing-function` - (默认 `ease`) 指示帧之间的过渡方式。这里有多种选项，Mozilla\
  \ 有一篇详细描述每种选项的文章，参见 [`developer.mozilla.org/en-US/docs/Web/CSS/timing-function`](https://developer.mozilla.org/en-US/docs/Web/CSS/timing-function)。支持以下常见值：\n\
  \n  - `linear` - 帧之间均匀过渡\n  - `ease-in` - 过渡在开始时较慢\n  - `ease-out` - 过渡在结束时变慢\n\
  \  - `ease-in-out` - 过渡在开始和结束时都较慢\n  - `ease` - 类似于 `ease-in-out`，但开始时的减速程度小于结束时\n\
  \n- `-delay` - (默认 `0s`) 页面加载后到动画开始前的暂停时长。\n\n- `-iteration-count` - (默认 `1`) 动画应执行的次数；若动画持续运行，可设为\
  \ `infinite`。\n\n- `-direction` - (默认 `normal`) 指示动画在关键帧之间是正向还是反向运行。支持以下值：\n\n \
  \ - `normal` - 动画按顺序从 `0%` 到 `100%` 遍历关键帧；如果重复执行，则从头开始。\n  - `alternate` - 首次执行从\
  \ `0%` 到 `100%`，但后续执行将反向进行。奇数次执行为正向，偶数次执行为反向。\n  - `reverse` - 动画从 `100%` 到 `0%`\
  \ 反向执行；后续执行也是反向的。\n  - `alternate-reverse` - 首次执行为反向（从 `100%` 到 `0%`），但下一次执行为正向。所有奇数次执行为反向，偶数次执行为正向。\n\
  \n- `-fill-mode` - (默认 `none`) 指定动画前后如何应用关键帧属性。注意，实际初始帧由 `animation-direction` 属性控制；结束帧也取决于使用\
  \ `alternate` 方向时执行的迭代次数。支持以下值：\n\n  - `none` - 动画前后不影响元素的值。\n  - `forwards` - 动画完成后，目标元素将保留最后一个关键帧的值。\n\
  \  - `backwards` - 如果动画启动有延迟，目标元素将使用初始关键帧的值。\n  - `both` - 同时应用 `forwards` 和 `backwards`\
  \ 的行为。\n\n- `-play-state` - (默认 `running`) 指示动画当前是运行还是暂停。\n\n> **提示**：时间单位可以用秒或毫秒指定。必须使用\
  \ `s` 或 `ms` 后缀，否则该值将被视为数值。值与其单位之间不允许有空格。\n\n### 动画简写\n\n如前所述，所有八个属性都可以使用 `animation`\
  \ 简写设置。从技术上讲，它们都是可选的，若省略则使用默认值。但是，如果不指定 `animation-name` 和 `animation-duration`，则无法进行任何动画。\n\
  \n简写中的属性由空格分隔，可以按任意顺序指定，但需注意几个细节。有两个时间值：`animation-duration` 和 `animation-delay`。第一个时间值将赋给\
  \ `animation-duration`，第二个（如果提供）将用于 `animation-delay`。\n\n有四个属性具有预设的支持值列表，它们不会重叠：`animation-timing-function`、`animation-direction`、`animation-fill-mode`\
  \ 和 `animation-play-state`。这些属性可以按任意顺序提供，因为浏览器可以通过值来确定将其分配给哪个属性。任何无法识别的值将被赋给 `animation-name`\
  \ 属性。\n\n\n\n"
- "# 关键帧命名与多动画配置\n\n如果你希望为关键帧取一个与属性值同名的名称（例如 `reverse`），则需要小心处理。你必须先指定对应的属性（在本例中为\
  \ `animation-direction`），然后再指定 `animation-name`。如果你希望动画方向为 `reverse`，则需要将值 `reverse`\
  \ 包含两次：第一个用于 `animation-direction`，第二个用于 `animation-name` 属性。你不能让浏览器设置默认值。如果你希望使用默认值\
  \ `normal`，则需要在 `reverse` 之前显式包含 `normal`。\n\n## 多动画\n\n你可以在同一个目标元素上定义多个动画。例如，一个动画可以移动元素，另一个动画可以改变其颜色。这些动画是独立应用的。如果你使用\
  \ `animation` 简写属性，则需要为第一个动画指定所有所需属性，然后依次为第二个动画指定，以此类推。每个动画的属性之间用逗号分隔。例如，以下代码将为所有带有\
  \ `circle` 类的元素应用两个动画：\n\n```css\n.circle {\n  animation: colors 5s 3, otherKey\
  \ 2s 4s alternate;\n}\n```\n\n第 15 章 ■ 动画与变换\n\n如果你正在设置各个属性，则需要为每个动画提供一个属性值，这些值之间用逗号分隔。请为每个属性按相同顺序指定值。`animation-name`\
  \ 的第一个值将与 `animation-direction` 的第一个值对应，以此类推。为了演示，上述动画可以按如下方式指定：\n\n```css\n.circle\
  \ {\n  animation-name: colors, otherKey;\n  animation-duration: 5s, 2s;\n  animation-iteration-count:\
  \ 3;\n  animation-delay: 0s, 4s;\n  animation-direction: normal, alternate;\n}\n\
  ```\n\n请注意，对于 `animation-iteration-count`，只指定了一个值，该值将应用于第一个动画。对于 `animation-delay`\
  \ 和 `animation-direction`，需要提供默认值，以便第二个值可以应用于第二个动画。\n\n> **注意**：并非所有 CSS 属性都可以进行动画。这里有一篇文章列出了所有可动画的属性：[`developer.mozilla.org/en-US/docs/Web/CSS/CSS_animated_properties`](https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_animated_properties)。不可动画的属性通常是那些无法随时间逐渐改变的属性，例如\
  \ `font-family`。\n\n#### 三次贝塞尔曲线\n\n正如我之前所说，动画本质上是随时间调整一个或多个属性。在最简单的情况下，你定义起始值和结束值，浏览器将插值计算中间值。`animation-timing-function`\
  \ 属性决定了用于执行插值的函数。有几种常见的值，例如 `ease-in` 和 `linear`，我已经提到过。\n\n其中最简单的是线性函数。假设你有一个持续时间为\
  \ 5 秒的动画，它修改 `margin-left` 属性。起始值为 `0`，结束值为 `250px`。使用线性函数，每秒将改变 `margin` 值 `50px`。因此，1\
  \ 秒后为 `50px`，2 秒后为 `100px`，以此类推。使用 `ease-in` 函数时，动画开始较慢并逐渐加速。例如，1 秒后，左边距可能只到 `30px`。\n\
  \n这些值（如 `ease-in`）仅仅是预定义的贝塞尔曲线。贝塞尔曲线使用数学公式计算一个轴作为另一个轴函数的值。具体来说，计时函数使用三次贝塞尔曲线，该曲线需要四个点来定义公式。在本例中，特定的属性值\
  \ `margin-left` 是在 5 秒持续时间内每一点计算的。图 15-1 展示了一条说明这一点的三次贝塞尔曲线。\n\n点 `P0` 是起点，代表初始（0%）属性值和持续时间的开始。点\
  \ `P3` 是终点，代表 100% 属性值。图形总是按比例缩放，使这些点分别位于 `(0, 0)` 和 `(1, 1)`。点 `P1` 和 `P2` 定义了连接\
  \ `P0` 和 `P3` 的曲线的形状。\n\n\n\n图 15-1 中的三次贝塞尔曲线由 P1 和 P2 的值定义，分别为 0.8、0.25 和 0.75、1.3。\n\
  \n在 CSS 中指定如下：\n\n`animation-timing-function: cubic-bezier(0.80, 0.25, 0.75, 1.30);`\n\
  \n![](img/index-310_1.png)\n\n第十五章 ■ 动画与变换\n\n**图 15-1.** 三次贝塞尔曲线\n\n在这种情况下，动画开始时速度缓慢，类似于`ease-in`，但在结束时，它实际上会超出目标值，然后必须回退才能完成动画。\n\
  \n■ **提示** 如果你想尝试使用三次贝塞尔曲线，请访问网站 [`cubic-bezier.com`](http://cubic-bezier.com/)。该网站允许你以图形方式调整曲线，并显示`p1`和`p2`的值，以便你将其输入到你的\
  \ CSS 中。\n\n另一个有用的网站是 [`easings.net`](http://easings.net/)。\n\n第十五章 ■ 动画与变换\n\n\
  为了演示这一点，我将创建另一个空的`div`元素：\n\n```\n<div class=\"bounce\"></div>\n```\n\n对于简单的样式，我使用了以下\
  \ CSS 规则：\n\n```\n.bounce {\n  width: 100px;\n  height: 35px;\n  margin-left: 300px;\n\
  \  border-radius: 10px;\n  background-color: lightblue;\n}\n```\n\n这将创建一个带有圆角的小矩形。然后使用以下规则配置动画：\n\
  \n```\n@keyframes bounce {\n  from {\n    margin-left: 0;\n  }\n  to {\n    margin-left:\
  \ 300px;\n  }\n}\n\n.bounce {\n  animation: 3s cubic-bezier(0.80, 0.25, 0.75, 1.30)\
  \ bounce;\n}\n```\n\n这将使`div`元素在页面上移动，起初缓慢，然后经过其最终位置后，必须反转并稍微回退一点。\n\n#### 过渡\n\n\
  当 CSS 属性在运行时（即页面加载后）被更改时，你可以使用过渡来使变化更平滑，而不是突兀的变化。例如，你可以使用`:hover`伪类在鼠标悬停时更改元素的背景颜色。通常，一旦鼠标悬停在元素上，该变化会立即发生。但是，你可以定义一个过渡，以使这种变化更渐进。\n\
  \n过渡与动画非常相似，并使用一些相同的技术。主要区别在于，你不需要在过渡中定义关键帧；过渡仅处理目标元素的开始和结束状态。这就像一个只定义了 0% 和 100%\
  \ 值的关键帧。\n\n另一个主要区别是，与动画不同，过渡不定义开始和结束状态；这些状态在过渡之外定义。开始和结束状态通常在 CSS 中定义。例如，`background-color`是通过\
  \ CSS 规则应用于元素的 CSS 属性。第二个规则使用`:hover`伪类，应用不同的`background-color`。这两个规则定义了开始和结束状态。然后可以添加过渡来操控从一个规则到另一个规则的变化，使其成为一个平滑的过渡，而不是立即的变化。\n\
  \n第十五章 ■ 动画与变换\n\n一个示例有助于演示这一点。以下标记创建了一个空的`div`元素。然后，一个 CSS 规则定义其高度和宽度以及边框和背景颜色。下一个规则在鼠标悬停在元素上时修改高度和宽度。\n\
  \n```\n<div class=\"tran\"></div>\n```\n\n```\n.tran {\n  width: 200px;\n  height:\
  \ 100px;\n  background-color: lightyellow;\n  border: 1px solid black;\n}\n\n.tran:hover\
  \ {\n  width: 420px;\n  height: 150px;\n}\n```\n\n如果你尝试这个，你会看到当鼠标移到元素上时，大小会立即跳转到更大的尺寸。现在你可以定义如何发生这个过渡。有四个\
  \ CSS 属性可以应用：\n\n- `transition-property` - （默认值 `all`）指定应应用过渡的属性。\n- `transition-duration`\
  \ - （默认值 `0s`）完成过渡所需的时间长度。\n- `transition-delay` - （默认值 `0s`）过渡开始之前的等待时间。\n- `transition-timing-function`\
  \ - （默认值 `ease`）指定过渡如何随时间进行的函数。其工作原理与`animation-timing-function`属性相同，并支持相同的值。\n\n\
  \n好的，作为高级文档工程师，我将根据您提供的规则和示例，将给定的英文文本翻译成中文。\n\n\n好的，作为高级文档工程师，我将根据您提供的属性，通过添加以下\
  \ CSS 规则来使过渡变得平滑。我使用了与上一个动画相同的三次贝塞尔曲线。\n\n```\n.tran {\n  transition-property: width;\n\
  \  transition-duration: 3s;\n  transition-delay: 0s;\n  transition-timing-function:\
  \ cubic-bezier(0.80, 0.25, 0.75, 1.30);\n}\n```\n\n现在，当您将鼠标悬停在该元素上时，宽度将逐渐变化。注意，当宽度超出最终状态并需要稍微回调时，会产生轻微的反弹效果。然而，高度会立即改变，因为过渡仅应用于\
  \ `width` 属性。您可以为 `transition-property` 属性使用 `all` 关键字，以便过渡应用于所有变化的属性。\n\n您也可以为每个目标属性定义不同的过渡属性。例如，如果您希望高度过渡更快，可以单独定义其\
  \ `transition`。为此，需要为每个属性提供多个以逗号分隔的值：\n\n```\ntransition-property: width, height;\n\
  transition-duration: 3s, 1s;\n```\n\n这将使宽度过渡耗时 3 秒，而高度过渡仅耗时 1 秒。\n\n`transition-property`\
  \ 属性定义了过渡的数量。在这种情况下，由于提供了两个值，因此将有两个过渡。其余属性可以具有相同数量的值，这些值按顺序应用，因此 `3s` 持续时间应用于 `width`\
  \ 属性，`1s` 持续时间应用于 `height` 属性。如果提供的值较少，则提供的值将根据需要重复，以便为 `transition-property` 属性提供的每个值都有一个值。由于\
  \ `transition-delay` 属性只有一个值，它将被重复，因此 `0s` 延迟将同时用于 `width` 和 `height` 属性。如果提供的值多于\
  \ `transition-property` 属性的值，则多余的值将被忽略。\n\n我将过渡应用于 `.tran` 类选择器，因此它将同时影响过渡到悬停状态以及过渡回初始状态的过程。请注意，如果您将鼠标从元素上移开，它会逐渐过渡回初始状态。如果我将更改应用于\
  \ `.tran:hover` 选择器，则过渡到悬停状态将是渐进的，但移开鼠标时，过渡会立即发生。您可以利用此行为来提供不同的过渡。例如，您可以更快地过渡回初始状态。\n\
  \n为此，我将在 `.tran` 选择器中定义一个较慢的过渡，并在 `.tran:hover` 选择器中覆盖持续时间，使其更长。\n\n```\n.tran {\n\
  \  width: 200px;\n  height: 100px;\n  background-color: lightyellow;\n  border:\
  \ 1px solid black;\n  transition-property: width, height;\n  transition-duration:\
  \ 1s;\n  transition-delay: 0s;\n  transition-timing-function: cubic-bezier(0.80,\
  \ 0.25, 0.75, 1.30);\n}\n\n.tran:hover {\n  width: 420px;\n  height: 150px;\n  transition-duration:\
  \ 3s, 1s;\n}\n```\n\n> **提示：** 为了演示过渡，我使用 `:hover` 伪类强制更改属性。但是，过渡适用于任何属性更改，无论其如何触发。在下一节中，我将解释如何通过\
  \ JavaScript 操作 HTML 和 CSS。如果您通过客户端脚本修改属性，CSS 中应用于它的任何过渡都将被触发。\n\n您还可以使用 `transition`\
  \ 简写在一个声明中提供所有四个值。您可以按任意顺序提供这些值；但是，与 `animation` 属性一样，第一个时间值将用作持续时间，第二个用作延迟。如果省略任何值，将使用我之前指出的默认值。例如，此过渡将应用于所有属性，持续时间为\
  \ 3 秒，并使用 `ease-in` 定时函数。由于未指定延迟，因此将为 `0s`。\n\n```\ntransition: all 3s ease-in;\n\
  ```\n\n如果您想定义不同的过渡，可以使用 `transition` 简写，并用逗号分隔每个过渡。\n\n```\ntransition: width 3s\
  \ 0s ease-in, height 1s;\n```\n\n与其他简写属性一样，未提供的任何值将使用默认值。在此示例中，对于 `height` 属性，由于未指定，将使用默认的\
  \ `ease` 定时函数。\n\n在定义多个过渡时，使用单独的属性可能更容易一些，因为如前所述，单个值将应用于所有过渡。\n\n#### 变换\n\n您可以使用\
  \ `transform` 属性通过调整元素的坐标系来修改其渲染方式。使用 `transform` 属性时，您必须指定一个变换函数，这些函数可以分为以下几类：\n\
  \n- **平移** - 元素沿水平方向、垂直方向或同时向两个方向移动。元素保留其原始大小和形状，但被移动到不同的位置。\n- **旋转** - 元素绕一个或多个轴旋转。与平移一样，它保持其原始大小和形状。\n\
  - **缩放** - 元素沿一个或多个轴拉伸或收缩。这将改变元素的大小，并可能改变其宽高比。\n- **倾斜** - 元素被扭曲或变形。例如，矩形可以变成平行四边形。\n\
  \n对元素应用 `transform` 会改变其在页面上的渲染方式和位置。但是，这不会影响其相邻元素的布局。这可能导致元素相互重叠的溢出情况。\n\n####\
  \ 平移\n\n平移可能是最简单的变换。支持三个函数：\n\n- `translateX()` - 按指定距离水平移动元素\n- `translateY()`\
  \ - 垂直移动元素\n- `translate()` - 接受两个值，一个用于 X，一个用于 Y，并水平且垂直地移动元素。\n\n如果调用 `translate()`\
  \ 函数时只指定一个值，则它将被用于水平平移元素。正值将元素向右（或向下）移动；负值向左（或向上）移动。以下声明将元素向右上方移动：\n\n```\ntransform:\
  \ translate(30px, -10px);\n```\n\n#### 旋转\n\n旋转元素时，首先需要决定它应该绕哪个轴旋转。X 轴是一条水平线。绕 X\
  \ 轴旋转元素意味着元素的顶部会离您更近或更远，而底部则相反。想象一下通过向上拉动纸张底部来翻页，露出下一页，就像翻日历一样。这有时被称为**军用翻转**。Y\
  \ 轴是一条垂直线，绕 Y 轴旋转类似于翻书页。Z 轴垂直于页面。\n\n有四个与旋转相关的函数可用：\n\n- `rotateX()`\n- `rotateY()`\n\
  - `rotateZ()`\n- `rotate()`\n\n前三个函数不言自明，它们使元素沿相应轴旋转指定的角度，该角度作为参数传入。`rotate()` 函数与\
  \ `rotateZ()` 功能相同。提供此函数是因为绝大多数时候您会使用 Z 轴，这算是一种快捷符号。\n\n> **警告：** 除非您使用 3D 变换（我将在后面解释），否则绕\
  \ X 轴或 Y 轴旋转并不是很有用。在二维系统中，绕 X 轴旋转只会使形状变矮，绕 Y 轴旋转会使元素变窄。但是，旋转 180 度（或半圈）会使元素翻转。大多数情况下，您将绕\
  \ Z 轴旋转。\n\n旋转元素时，您还需要决定其旋转的基点。默认情况下，这将是元素的中心。但是，您可以使用 `transform-origin` 属性来更改此设置。\n\
  \n\n\n"
- "# 此函数接受三个值，用于指定 X、Y 和 Z 偏移量。默认值为`50% 50% 0`，即元素的水平和垂直中心。您可以为每个偏移量提供绝对值或相对值，且需按此顺序（X、Y、Z）输入。如果只提供两个值，则它们将用作\
  \ X 和 Y 值。\n\n还可以使用一些关键字，包括`left`、`right`、`top`、`bottom`和`center`。例如，指定`top right`将使元素围绕其右上角定义的点进行旋转。关键字可以任意顺序输入，因为浏览器可以判断其适用于哪个值。`center`关键字同时指定了\
  \ X 和 Y 值，等同于默认值（`50% 50% 0`）。\n\n#### 缩放\n\n缩放函数相当直观。有`scaleX()`和`scaleY()`函数，它们会分别沿\
  \ X 轴或 Y 轴放大或缩小元素。如果希望在两个方向上缩放，`scale()`函数接受两个值来定义水平和垂直缩放比例。值为`1`表示不缩放；大于`1`的值会使元素变大。小于`1`的值会使元素变小。\n\
  \n例如，指定`0.5`将使元素在指定维度上缩小到原始大小的一半。\n\n`transform-origin`属性会影响缩放的方式，或者更准确地说，会影响结果形状相对于原始元素的定位方式。如果保持默认值`center`，元素将向两个方向扩展，使新形状的中心恰好位于原始元素中心的位置。例如，如果将其设置为`top\
  \ left`，左上角将保持固定，元素将向右下方向扩展。\n\n![](img/index-316_1.png)\n\n## 第 15 章 ■ 动画与变换\n\n\
  负值将沿相反轴翻转元素。例如，使用`scaleY(-1)`将垂直翻转元素（沿水平轴）。因此，以下函数将实现相同的效果：`transform: rotateX(.5turn);`和`transform:\
  \ scaleY(-1);`。值为`-1`仅会翻转元素；值为`-2`则会翻转并使其大小加倍。\n\n#### 倾斜\n\n倾斜元素，尤其是在二维空间中倾斜，可能有点难以理解。让我们从一个维度开始。想象一个矩形，它的一侧固定，另一侧被向下拉动，导致整个元素扭曲。这被视为*倾斜*，可以通过`skewY()`函数实现，如图\
  \ 15-2 所示。`skewY()`函数将在垂直维度上移动或倾斜非固定边。倾斜量以角度指定。`skewX()`函数将水平移动非固定边。\n\n***图 15-2.**\
  \ 说明倾斜效果*\n\n■ **注意** 在这些示例中，我假设左侧或顶边是固定的。但是，这由`transform-origin`属性控制，就像旋转和缩放函数一样。更改此属性不会影响最终形状，但会改变元素的定位方式。\n\
  \n`skew()`函数允许同时指定 X 和 Y 值。在两个方向上的倾斜如图 15-3 所示。这结合了两种倾斜类型的效果。\n\n![](img/index-317_1.png)\n\
  \n## 第 15 章 ■ 动画与变换\n\n***图 15-3.** 二维空间中的倾斜*\n\n#### 演示\n\n以下内容将演示所有这些变换。标记创建了四个空的`div`元素，并带有`class`属性，以便轻松选择它们。\n\
  \n```\n<div class=\"transform translate\">translate</div>\n<div class=\"transform\
  \ rotate\">rotate</div>\n<div class=\"transform scale\">scale</div>\n<div class=\"\
  transform skew\">skew</div>\n```\n\nCSS 首先为所有这些`div`元素应用一些基本样式，然后为每个元素应用不同的变换。结果如图\
  \ 15-4 所示。\n\n```\n.transform {\n  margin: 25px;\n  height: 50px;\n  width: 100px;\n\
  \  border: 1px solid black;\n  background-color: lightblue;\n}\n.translate {\n```\n\
  \n\n\n```css\ntransform: translate(30px, -10px);\n}\n\n.rotate {\n    transform:\
  \ rotate(15deg);\n    transform-origin: bottom left;\n}\n\n.scale {\n    transform:\
  \ scale(1.5, .9);\n    transform-origin: bottom left;\n}\n\n.skew {\n    transform:\
  \ skew(20deg, 15deg);\n    transform-origin: top left;\n}\n```\n\n![](img/index-318_1.jpg)\n\
  \n第 15 章 ■ 动画与变换\n\n***图 15-4.** 每种变换的效果*\n\n请注意，所有这些效果不仅作用于元素的形状，也作用于其内容。例如，文本也会被缩放或倾斜。\n\
  \n#### 3D 变换\n\n三维变换试图在二维页面上模拟三维物体。为此，你需要配置一些额外信息，以便浏览器知道如何执行变换。这些额外属性是 `perspective`\
  \ 和 `perspective-origin`。为了理解它们的用法，我先解释一些基本的绘图技巧。\n\n如果你有一个三维物体（例如一个盒子）并想在二维纸上画出它，最简单的方法是使用一个消逝点。这需要先画出盒子的一面，然后在矩形之外的某个位置定义一个消逝点。接着，从每个角向该点画一条假想线。这些线中的一部分将构成盒子的边缘。最后，通过创建一个与这些消逝线相交的平行矩形来确定盒子的背面。如图\
  \ 15-5 所示。\n\n![](img/index-319_1.png)\n\n***图 15-5.** 演示消逝点*\n\n你大概能想象到，移动消逝点并随之拖动线条，会从不同视角观察同一个盒子。这正是这些额外属性允许你做的。`perspective`\
  \ 属性定义了从原始图像到消逝点的距离。距离越大，3D 效果越微妙。\n\n`perspective-origin` 属性定义了消逝点在图像的哪一侧。在图 15-5\
  \ 中，消逝点位于右上角。这产生了从上方和右侧俯视盒子的效果。`perspective-origin` 接受 X 和 Y 值，以百分比表示，从 0% 到 100%。也有一些预定义值。例如，`0%\
  \ 0%` 也可以输入为 `left bottom`，而 `100% 100%` 是 `right top`。单独的值 `center` 等同于 `50% 50%`，表示消逝点直接在图像后方。\n\
  \n这些透视细节需要在容器元素上定义，而不是在正在变换的元素上。此外，如果你希望浏览器执行 3D 变换，需要设置 `transform-style` 属性。该属性的默认值是\
  \ `flat`，它将执行简单的 2D 变换。你需要将其设置为 `preserve-3d`。\n\n为了演示这一点，我将创建一个 `div` 元素作为容器，并在其中放置一张图片。`div`\
  \ 元素使用 `rotate3D` 类以便于选择。\n\n```html\n<div class=\"rotate3D\">\n  <img src=\"phonebooth.jpg\"\
  \ alt=\"电话亭\" />\n</div>\n```\n\n![](img/index-320_1.jpg)\n\n为了辅助演示，我将使用一个过渡效果，使旋转缓慢进行，从而更容易看到\
  \ 3D 效果。以下 CSS 规则可以实现这一点。\n\n```css\n.rotate3D {\n    margin: 100px;\n    transform-style:\
  \ preserve-3d;\n    perspective: 360px;\n    perspective-origin: left;\n}\n\nimg\
  \ {\n    transition: all 5s linear;\n}\n\nimg:hover {\n    transform: rotateY(180deg);\n\
  }\n```\n\n在容器上，我设置了三个变换属性：`transform-style`、`perspective` 和 `perspective-origin`。这些属性总是在容器元素上定义。在图像元素上，我使用\
  \ `linear` 时间函数对所有修改过的属性定义了一个 5 秒的过渡。最后，在 `:hover` 伪类上，我使用了前面描述过的 `transform` 属性，配合\
  \ `rotateY()` 函数。\n\n当你将鼠标悬停在图像上时，它会以 3D 效果缓慢旋转，如图 15-6 所示。\n\n***图 15-6.** 演示 3D\
  \ 变换*\n\n在旋转元素时，你可能不希望看到它们的背面（这并非双关语）。在这个例子中，看到电话亭的背面没有问题。实际上，我们看到的不是背面，而是正面转向了另一面。你可以通过将\
  \ `backface-visibility` 属性设置为 `hidden` 来使元素在转过去时不可见。其默认值是 `visible`。例如，如果盒子的背面有不同的图片，那么当盒子转过去时，你就不希望显示正面的图像。\n\
  \n#### 总结\n\n在本章中，我演示了创建动画的技术。动画本质上是在动画持续时间内修改一个或多个 CSS 属性。浏览器会执行插值，所以你不需要定义每一帧。对于简单的动画，你只需定义起始帧和结束帧。\n\
  \n随时间逐渐变化的过程由时间函数控制，该函数由一条三次贝塞尔曲线定义。这由两个点的 X 和 Y 坐标定义。这为控制实际过渡提供了很大的灵活性。不过，也有一些预定义的曲线，例如\
  \ `linear` 和 `ease-in`。\n\n过渡与动画类似，但它在 CSS 属性被改变时触发。过渡不会改变属性本身，而是在值发生变化时定义渐变过程。当属性通过客户端脚本更改时，CSS\
  \ 过渡也会被触发。\n\n变换是用于调整元素大小、形状或位置的函数。这些函数分为四类（平移、旋转、缩放和倾斜）。这些变换可以应用于 X、Y 或 Z 轴。也可以进行\
  \ 3D 变换，但需要设置更多属性，例如 `perspective` 和 `transform-style`。\n\n下一章将开始关于 JavaScript 的新章节。这将从研究浏览器环境以及页面脚本可用的设施开始。\n\
  \n## 第四部分\n\n**JavaScript**\n\n在你的 Web 应用程序中使用 JavaScript 开启了看似无限的可能性，使网页更加动态和交互。我在第[3](http://dx.doi.org/10.1007/978-1-4842-2463-2_3)章中对\
  \ JavaScript 语言进行了相当全面的概述。在本节中，我将演示如何在 Web 环境中使用 JavaScript。我将涵盖的主题如下：\n\n- **16)\
  \ 浏览器环境** – 本章探讨浏览器对象模型提供的资源，包括 `Screen`、`Location`、`History`、`Navigator`、`Console`\
  \ 等资源、使用计时器以及各种缓存选项，例如会话存储和 Cookies。\n- **17) Window 对象** – 本章演示如何创建和操作窗口，包括各种对话框和框架。\n\
  - **18) DOM 操作** – 本章解释如何通过 JavaScript 查找、创建、修改和移动你在第二部分中学习的 HTML 元素。\n- **19) 动态样式**\
  \ – 在本章中，你将使用多种技术通过 JavaScript 动态更改网页的样式规则。\n- **20) 事件** – 这些是交互式应用程序的生命线。在本章中，你将学习如何注册事件，然后使用事件对象做出适当的响应。\n\
  \n## 第 16 章\n\n**浏览器环境**\n\n\n\n### 第 16 章：浏览器环境\n\n在[第 3 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_3)中，我解释了\
  \ JavaScript 语言的机制。在本书的后续章节中，我将演示如何将 JavaScript 嵌入到 HTML 文档中。你将会大量使用 JavaScript，因此如果你对这方面的内容还不太熟悉，可能需要回顾一下第\
  \ 3 章。在接下来的两章中，我将解释网页所运行的操作环境。浏览器提供了大量可通过 JavaScript 操作的功能。\n\n#### 浏览器对象模型\n\n\
  浏览器提供的功能（从`window`对象开始）被非正式地称为**浏览器对象模型**（Browser Object Model，BOM）。然而，对此并没有官方的标准。幸运的是，主要浏览器厂商都提供了基本相同的属性和方法。\n\
  \n> **注意：** 我将描述那些在大多数现代浏览器中普遍可用且使用起来相对安全的功能。但是，你不应假设我提到的所有内容在每个浏览器中都可用。\n> \n>\
  \ 请在大量浏览器上测试你的代码，并确保为关键功能提供备选方案。\n\n位于全局命名空间中的`window`对象是访问浏览器功能的起点。它代表一个单独的窗口或标签页。如果你打开了多个标签页，每个标签页以及整个窗口都会有一个独立的`window`对象实例。同样，如果你打开了一个对话框，也会为该对话框使用一个单独的`window`实例。我将在[第\
  \ 17 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_17)中解释如何处理多个窗口和框架。现在，我将从一个简单的案例开始，即单窗口/标签页的情况。\n\
  \n除了`window`对象上可用的众多属性和函数外，还有几个提供特定功能的子对象。主要的子对象如图 16-1 所示，我将逐一进行描述。`document`对象代表窗口中正在渲染的\
  \ HTML 文档。第 18 章和第 19 章将专门讨论如何通过 JavaScript 操作它，因此我在此不多赘述。\n\n© Mark J. Collins\
  \ 2017\n\nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and Multimedia*, DOI 10.1007/978-1-4842-2463-2_16\n\
  \n![图 16-1 主要的浏览器对象](img/index-324_1.png)\n\n![图 16-1 主要的浏览器对象](img/index-324_2.jpg)\n\
  \n**图 16-1.** 主要的浏览器对象\n\n> **提示：** 虽然这些对象都是`window`的子对象，但它们在全局命名空间中也是可用的。\n> \n\
  > 例如，如果你从全局命名空间访问`screen`或`document`属性，它将返回与当前窗口或标签页关联的对象。\n\n在描述`window`对象本身之前，我将首先演示这些主要的子对象。\n\
  \n## Screen\n\n`screen`对象提供了关于浏览器运行设备的详细信息。查看其内容最简单的方法是尝试一下。如果你在浏览器的控制台中输入`window.screen`，你会看到类似于图\
  \ 16-2 的内容。\n\n**图 16-2.** 显示`screen`对象\n\n如你所见，我使用的是一台分辨率为 1920 x 1200、颜色深度为 24\
  \ 位的显示器。这些属性都是只读的，因为你无法更改设备特性。这些信息可供你的网页使用。例如，如果你要启动一个新窗口或弹出对话框，设备特性可能会影响新窗口的大小和位置。\n\
  \n但是，如果你在多个浏览器中查看`screen`对象，你会发现它们提供的属性集合略有不同。以下是你可以基本信赖的基础属性集：\n\n- `height` -\
  \ 设备的总高度（以像素为单位）\n- `width` - 设备的总宽度（以像素为单位）\n\n\n\n`availHeight` - 操作系统未占用的垂直空间量（例如任务栏占用的空间）\n\
  \n`availWidth` - 可用的水平空间量\n\n`colorDepth` - 用于指定颜色的位数\n\n`pixelDepth` - 与 `colorDepth`\
  \ 相同\n\n设备方向尚未标准化；对于 Firefox 和 Edge，可以分别使用带前缀的属性 `mozOrientation` 和 `msOrientation`。对于\
  \ Chrome，方向以对象形式提供，你可以访问其 `type` 属性（`screen.orientation.type`）。不过，由于你可以获取高度和宽度，因此很容易确定方向。\n\
  \n## Location\n\n`location` 对象提供了窗口中加载文档的网址。它也与 `document` 对象相关联，因此可以通过 `window.location`\
  \ 或 `document.location` 访问，或者正如我之前解释过的，直接使用 `location`。它包含 URL 各个部分的独立属性：\n\n- `protocol`\n\
  - `hostname`\n- `port`\n- `pathname`\n- `search` - 一个或多个以问号（`?`）开头的查询字符串参数\n- `hash`\
  \ - 井号（`#`）后跟片段标识符\n\n为了方便，还提供了一些额外的属性：\n\n- `href` - 提供完整的 URL\n- `host` - 包含主机名和端口\n\
  - `origin` - 包含协议、主机名和端口\n\n`ToString()` 方法会返回 `href` 属性，因此你可以直接引用 `location` 对象来获取完整的\
  \ URL。例如，以下代码将弹出如图 16-3 所示的弹窗：`alert(location);`\n\n![图 16-3](img/index-326_1.jpg)\n\
  \n**图 16-3.** 显示 URL\n\n与 `screen` 对象一样，`location` 对象通常是只读的。一个很大的例外是，你可以使用 `location`\
  \ 对象的 `assign()` 方法导航到另一个页面。你也可以直接将 URL 值赋给 `location` 对象，因此以下两种方式都可以达到相同效果：`location.assign(\"\
  http://www.google.com\");` 或 `location = \"http://www.google.com\";`\n\n你也可以修改 URL\
  \ 的某个组成部分，而不是整个 URL。一个有用的例子是修改 `search` 属性中的查询字符串参数。如果用户更改了搜索条件，你可以简单地更新 `search`\
  \ 属性，然后新的请求将被发送到服务器。\n\n除了使用 `assign()` 方法，你还可以使用 `replace()` 方法，该方法的工作方式相同，只是当前页面不会被保存到历史记录中，我稍后将对此进行解释。`location`\
  \ 对象还支持 `reload()` 方法，该方法将刷新当前窗口。`reload()` 方法接受一个布尔参数，如果传入 `true`，则页面从服务器重新加载。如果传入\
  \ `false` 或不提供参数，浏览器可能会使用本地缓存刷新页面。\n\n## History\n\n`history` 对象跟踪在单个窗口中加载的页面。这不是包含昨天或上周访问网站的完整浏览历史记录，它也不知道在其他窗口或标签页中加载的页面。它用于支持后退按钮，允许你返回到上一个页面。\n\
  \n`history` 对象有一个 `length` 属性，表示历史记录中的条目数。这将包括当前页面，因此至少会有一个条目。你可以通过调用 `back()` 方法导航到上一个页面。同样，你可以使用\
  \ `forward()` 方法移动到下一个页面。这与用户单击浏览器上的后退或前进按钮的工作方式相同。`history` 对象还支持一个通用的 `go()` 函数，其中方向和页面数由整数值指定。\n\
  \n使用 `go(-1)` 等同于 `back()`，`go(1)` 等同于 `forward()`。但是，你可以使用 `go()` 方法跳过多个页面，例如 `go(-2)`，这将回退两个页面。\n\
  \n**注意** 如果发生超出范围的情况，例如在最新页面上调用 `forward()`，该调用将被忽略且无效。\n\n`history` 对象还支持 `pushState()`\
  \ 和 `replaceState()` 方法，你可以使用它们来操作历史堆栈。调用 `pushState()` 将添加另一个历史元素，就像你实际导航到了一个新页面（例如使用\
  \ `location.assign()` 方法）一样。`replaceState()` 方法使用提供的数据更新现有的历史元素。但是，这两种方法都不会实际导航到新页面。\n\
  \n两种方法都支持三个参数：\n\n- `state` - 一个 JSON 字符串，包含你想要存储在这里的任何可序列化数据。\n- `title` - 此参数目前已被忽略；你可以输入一个空字符串或一个描述页面的简短标题。\n\
  - `url` - 将存储在历史记录中并用于后退或前进的地址。\n\n顾名思义，使用 `pushState()` 和 `replaceState()` 成员，可以让你将状态信息与历史记录关联起来。如果有人离开了你的页面，然后使用后退按钮返回，你的页面可以利用此状态数据。例如，假设你的页面执行了客户查询并检索了用户的详细信息。此数据可以存储在历史状态中，这样当他们导航回你的页面时，无需再次执行查询即可获取数据。\n\
  \n有两种方法可以获取状态数据。首先，你可以监听 `popstate` 事件，该事件在通过历史记录导航时触发。只有当当前 URL 和新 URL 指向同一个文档时，才会触发\
  \ `popstate` 事件。因此，如果用户导航到一个完全不同的网站，然后又导航回你的页面，则不会触发任何事件。此外，Chrome 仅在向后导航时触发该事件；向前导航时不会触发。\n\
  \n幸运的是，你还可以通过使用 `state` 属性直接从 `history` 对象获取当前状态数据。清单 16-1 中的代码演示了这些状态方法和属性。\n\n\
  **清单 16-1.** 演示历史状态\n\n```\nwindow.onpopstate = function (e) {\n    console.log(\"\
  popstate - url: \" + location + \", state: \" + JSON.stringify(e.state));\n}\n\n\
  console.log(\"0-length: \" + history.length + \", state: \" + JSON.stringify(history.state));\n\
  history.replaceState({id: 1}, \"\", location);\nhistory.pushState({id: 2}, \"\"\
  , location);\nhistory.pushState({id: 3}, \"\", location);\nconsole.log(\"1-length:\
  \ \" + history.length + \", state: \" + JSON.stringify(history.state));\nhistory.go(-1);\n\
  history.go(-1);\nhistory.go(1);\nhistory.go(1);\nconsole.log(\"2-length: \" + history.length\
  \ + \", state: \" + JSON.stringify(history.state));\n```\n\n这段代码首先通过简单地将详细信息写入控制台来实现\
  \ `popstate` 事件。然后，代码使用 `replaceState()` 方法在当前历史元素上设置状态。接着使用 `pushState()` 方法添加两个历史条目。请注意，`location`\
  \ 对象作为第三个参数传入。这将指定 URL 的当前值，因此不会进行任何更改；只有状态被更新。这段代码还在进行任何更改之前、添加新历史条目之后以及导航完成之后，记录了历史记录长度和当前状态。控制台窗口的结果如图\
  \ 16-4 所示。\n\n![图 16-4](img/index-328_1.jpg)\n\n**图 16-4.** Firefox 中的控制台\n\n历史记录长度最初为\
  \ 2，因为当我启动浏览器时，它加载了默认主页，然后我输入了测试网站的 URL。正如预期的那样，初始状态为 `null`。调用 `pushState()` 两次后，长度为\
  \ 4。每次调用 `go()` 方法时，都会触发 `popstate` 事件，并且状态会更新以反映新的当前条目。\n\n## Navigator\n\n\n\n\
  与`screen`对象类似，`navigator`对象提供了浏览器所运行设备的信息。`screen`对象仅限于设备显示器（如尺寸和色彩深度）的详细信息。相比之下，`navigator`对象支持相当多的属性和方法。我无意在此解释所有内容；不过它们在附录\
  \ C 的参考资料中都有列出并附有简短说明。\n\n`navigator`对象一个越来越有用的属性是`geolocation`。该属性利用设备硬件，根据设备的支持能力，通过全球定位系统（GPS）、蜂窝三角测量、Wi-Fi\
  \ 信息或 IP 查询来确定设备的当前位置。我将在第 26 章中详细介绍这一点。\n\n## 用户代理\n\n`navigator`对象包含多个指示操作系统和浏览器详细信息的属性，包括：\n\
  \n-   `appCodeName`\n-   `appName`\n-   `appVersion`\n-   `platform`\n-   `product`\n\
  -   `userAgent`\n\n这些信息中的大部分都不准确，也难以有效利用。例如，我在 Windows 10 上运行 Chrome、Firefox 和 Edge\
  \ 浏览器，这三者的`appCodeName`、`appName`和`product`值都是相同的（分别是 Mozilla、Netscape 和 Gecko）。`userAgent`属性是一个字符串，包含了来自其他属性的大部分信息。不过，这有点晦涩难懂。例如，以下是我刚才提到的三种浏览器的`userAgent`字符串：\n\
  \n-   `Mozilla/5.0 (Windows NT 10.0; WOW64) AppleWebKit/537.36 (KHTML, like Gecko)\
  \ Chrome/54.0.2840.71 Safari/537.36`\n-   `Mozilla/5.0 (Windows NT 10.0; WOW64;\
  \ rv:49.0) Gecko/20100101 Firefox/49.0`\n-   `Mozilla/5.0 (Windows NT 10.0; Win64;\
  \ x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/51.0.2704.79 Safari/537.36\
  \ Edge/14.14393`\n\n造成这种混乱的原因之一是，Web 开发者过去（并且现在仍然）在代码中基于浏览器而不是使用特性检测来编写逻辑；如果是 Chrome\
  \ 则执行这个，如果是 Firefox 则执行那个。因此，新浏览器会将`userAgent`属性设置得看起来像其他浏览器，以便应用程序能够利用这些浏览器的特性。\n\
  \n> **提示** 如果你想从`userAgent`中收集一些有用信息，我建议使用他人编写的解析器。有不少可供选择。只需谷歌搜索“parse user agent”即可。\n\
  \n## 电池\n\n`battery`属性返回一个`BatteryManager`对象，该对象提供以下属性：\n\n-   `charging`（如果设备正在充电则为\
  \ true）。\n-   `chargingTime`（充满电所需的剩余秒数）。\n-   `dischargingTime`（电池完全放电所需的秒数）。\n\
  -   `level`（一个 0 到 1 之间的值，表示当前充电水平）。\n\n你还可以监听当这些值发生变化时触发的事件。这些事件分别称为`chargingchange`、`chargingtimechange`、`dischargingtimechange`和`levelchange`。\n\
  \n#### Window 对象\n\n现在让我们来看看`window`对象，并探索它所暴露的功能。它提供了大量的属性和方法，我已将标准的那些列在附录 C 的参考资料中。此外，还有大量你可以订阅的事件，这些也一并列出。\n\
  \n不过，我将在第 20 章中解释事件。\n\n#### 控制台\n\n浏览器控制台通常是开发者工具的一部分，是一个方便的资源，允许你检查属性值并运行临时的 JavaScript\
  \ 命令。控制台还包含一个日志，你可以在其中写入来自应用程序的调试信息，这一点我已经演示过。`window`对象也提供了一个`console`对象，你可以用它以编程方式与控制台交互。与`window`对象提供的许多其他对象一样，`console`也处于全局命名空间中，因此你可以通过`window.console`或仅用`console`来访问它。\n\
  \n`console`对象支持的方法在附录 C 的参考资料中列出并描述。我不会在这里全部介绍，但我会解释一些更有用的功能。\n\n### 字符串替换\n\n许多控制台方法，包括`log()`、`error()`、`info()`和`warn()`都支持字符串替换。\n\
  \n你可以将一个或多个百分号（`%`）作为占位符嵌入到文本中，然后为每个占位符提供一个额外的参数。在`%`符号旁边，你还需要指定以下格式字符之一：\n\n- \
  \  `s` - 字符串\n-   `d` 或 `i` - 数值\n-   `f` - 浮点数\n-   `o` - 对象\n\n> **注意** Firefox\
  \ 还支持限定数字和浮点数格式以指定位数。在撰写本文时，大多数其他浏览器不支持此功能，并可能导致某些浏览器（包括 Edge）中出现不正确的格式。\n\n快速演示一下，以下代码将按指定格式输出四个值：\n\
  \n```js\nconsole.info(\"Formatting: %i, %f, %s, %o\", 22.651, Math.PI, \"text\"\
  , screen);\n```\n\n这将在 Edge 浏览器中的显示结果如图 16-5 所示，在 Chrome 中的显示结果如图 16-6 所示。注意那个带有“i”的蓝色圆圈，表示这是一个信息条目。\n\
  \n### 性能分析\n\n大多数浏览器提供的开发者工具都包含评估性能的实用程序。这些工具可能非常强大，可以帮助你了解可以在哪些方面调整应用程序以提高响应能力。这超出了本书的范围，但我想给你提供几个链接来帮助你入门。这里有一篇关于\
  \ Chrome Timeline 工具的好文章：[`developers.google.com/web/tools/chrome-devtools/evaluate-performance/timeline-tool`](https://developers.google.com/web/tools/chrome-devtools/evaluate-performance/timeline-tool)。此外，Firefox\
  \ 有一个 Performance 工具，从这篇文章开始的一系列文章中有介绍：[`developer.mozilla.org/en-US/docs/Tools/Performance`](https://developer.mozilla.org/en-US/docs/Tools/Performance)。\n\
  \n`console`对象提供了与这些性能工具集成的方法。例如，`profile()`方法将启动一个新的性能分析。你可以将此调用放在要评估的代码之前。然后调用`profileEnd()`方法停止分析并输出结果。谷歌提供了一篇很好的文章，描述了这些各种控制台功能，并提供了使用技巧：[`developers.google.com/web/tools/chrome-devtools/console/console-reference`](https://developers.google.com/web/tools/chrome-devtools/console/console-reference)。\n\
  \n`time()`和`timeEnd()`方法可用于收集一些简单的度量数据。这些方法就像一个秒表。如果你想知道一个函数完成需要多长时间，只需在函数前后加上这些方法即可。\n\
  \n例如，以下代码循环迭代 1000 次并记录完成所用的总时间。\n\n```js\nconsole.time(\"Stopwatch\");\n\nvar j\
  \ = 1;\n```\n\n```javascript\nfor (var i = 0; i < 1000; i++) {\n  j += j + i;\n\
  }\n\nconsole.info(\"j = %i\", j);\nconsole.timeEnd(\"Stopwatch\");\n```\n\n## 性能\n\
  \n从某种程度上说，`window` 对象包含一个 `performance` 属性，用于访问 Web 性能 API。该 API 有两个属性：`navigation`\
  \ 和 `timing`，分别提供页面加载方式的详细信息和各种计时指标。在浏览器控制台中输入 `window.performance.timing`，即可看到如图\
  \ 16-7 所示的一组计时详情。这些值的计算方式是从某个特定时间点开始的毫秒数。\n\n![图 16-7](img/index-332_1.jpg)\n\n\
  **图 16-7.** *性能计时详情*\n\n该 API 还提供了一个 `now()` 方法，该方法使用相同的参考点返回毫秒数。此外，API 还提供了一个 `mark()`\
  \ 方法，可用于添加自定义性能条目。\n\n## 分组日志条目\n\n你还可以使用 `group()` 方法对日志条目进行分组。添加日志条目后，调用 `groupEnd()`\
  \ 方法关闭分组。作为简单演示，以下代码在一个分组内记录了三条条目。在 Firefox 控制台中的显示效果如图 16-8 所示。\n\n```javascript\n\
  console.group(\"正在记录一组记录...\");\nconsole.log(\"日志条目 #1\");\nconsole.log(\"日志条目 #2\"\
  );\nconsole.log(\"日志条目 #3\");\nconsole.groupEnd();\n```\n\n![图 16-8](img/index-333_1.jpg)\n\
  \n**图 16-8.** *在 Firefox 中显示日志分组*\n\n除了使用 `group()` 方法，你还可以使用 `groupCollapsed()`\
  \ 方法。该方法的工作方式与 `group()` 方法完全相同，只是分组在控制台中默认折叠，用户需要展开才能看到三条日志条目。\n\n#### 缓存\n\n在客户端存储数据具有多种重要用途，包括提升性能和改善用户体验。长期以来，这一功能主要通过\
  \ Cookie 实现，但 HTML 引入了 `localStorage` 和 `sessionStorage` 来解决 Cookie 的一些缺陷。\n\n##\
  \ Cookie\n\nCookie 允许你在客户端存储少量数据。它们实际上是 `document` 对象的一部分，但我会在此处与其他存储机制一起说明。文档的所有\
  \ Cookie 都以单个字符串形式提供，可通过 `document.cookie` 属性获取。Cookie 之间以分号分隔，每个 Cookie 的格式为 `<名称>=<值>`。例如，如果有三个名为\
  \ `Test1`、`Test2` 和 `Test3` 的 Cookie，Cookie 字符串可能如下所示：\n\n```\nTest1=测试 Cookie #1;\
  \ Test2=测试 Cookie #2; Test3=测试 Cookie #3\n```\n\n> **提示：**Cookie 的一个重要特点是它们会随每个服务器请求一起发送。这使得服务器可以访问这些客户端数据。服务器也可以设置\
  \ Cookie 的值。\n\n要添加 Cookie，你可以使用同样的 `document.cookie` 属性为其赋值。不过，你一次只能设置一个 Cookie\
  \ 值。例如：\n\n```javascript\ndocument.cookie = \"Test1=测试值\";\n```\n\n这将创建一个名为 `Test1`\
  \ 的新 Cookie，如果已存在同名 Cookie，则会更新其值。这不会影响任何其他已定义的 Cookie。然而，获取 `document.cookie` 属性时，会像之前所述返回所有\
  \ Cookie。要获取特定 Cookie，你需要解析 Cookie 字符串，查找所需 Cookie。要删除 Cookie，则需要将其值更新为空字符串。\n\n\
  创建 Cookie 时，你还可以在 Cookie 值后面包含一些其他属性。以下是支持的属性：\n\n- `domain=` - 指定可以访问该 Cookie 的域名；如果未指定，默认使用文档的域名。\n\
  - `expires=` - 指示 Cookie 的过期时间；如果未指定，Cookie 将在会话关闭时过期。该值必须格式化为 UTC 字符串；可以使用 `toUTCString()`\
  \ 方法辅助格式化。\n\n\n*   `max-age=` - 指定 cookie 过期的另一种方式；指定 cookie 过期前的秒数。\n*   `path=`\
  \ - 指定 cookie 应存储的位置。\n*   `secure` - 指示 cookie 仅应在使用 `https` 时发送。\n\n例如，要设置过期日期，可以像这样创建一个新的\
  \ cookie：\n\n`document.cookie = \"Test=Test cookie; expires=Sun, 30 Oct 2016 12:00:00\
  \ UTC\";`\n\n使用 cookie 有些繁琐，我建议你创建（或借用）一些辅助函数来简化对它们的访问。清单 16-2 中的代码创建了三个函数，用于创建、删除和获取\
  \ cookie。其余代码则使用这些函数，并将结果写入控制台。\n\n**清单 16-2.** 使用 Cookie\n\n```javascript\nfunction\
  \ storeCookie(key, value, duration) {\n\n  var expDate = new Date();\n\n  expDate.setTime(expDate.getTime()\
  \ + duration * 86400000);\n\n  document.cookie = key + \"=\" + value + \";expires=\"\
  \ + expDate.toUTCString();\n\n}\n\nfunction removeCookie(key) {\n\n  storeCookie(key,\
  \ \"\", 0);\n\n}\n\nfunction getCookie(key) {\n\n  var cookies = document.cookie.split(';');\n\
  \n  for(var i=0; i<cookies.length; i++) {\n\n    if (cookies[i].trim().indexOf(key\
  \ + \"=\") == 0) {\n\n      return cookies[i].trim().substring(key.length + 1);\n\
  \n    }\n\n  }\n\n  return null;\n\n}\n\nstoreCookie(\"Test1\", \"Test cookie #1\"\
  , 5);\n\nstoreCookie(\"Test2\", \"Test cookie #2\", 5);\n\nstoreCookie(\"Test3\"\
  , \"Test cookie #3\", 5);\n\nconsole.log(document.cookie);\n\nconsole.log(\"Test2:\"\
  , getCookie(\"Test2\"));\n\nremoveCookie(\"Test2\");\n\nconsole.log(\"Test2:\",\
  \ getCookie(\"Test2\"));\n\nconsole.log(document.cookie);\n```\n\n![](img/index-335_1.jpg)\n\
  \n**第 16 章 ■ 浏览器环境**\n\n控制台日志中的结果如图 16-9 所示。添加三个 cookie 后，它们都会在 `cookies` 属性中返回。`getCookie()`\
  \ 函数返回了指定的 cookie，但在此 cookie 被删除后，该函数返回了 `null`。另外，在删除一个 cookie 后，`cookie` 属性只返回两个\
  \ cookie。\n\n**图 16-9.** 显示 cookie 结果\n\n### 存储\n\nHTML5 定义了两个新的客户端缓存存储机制：`localStorage`\
  \ 和 `sessionStorage`。\n\n两者都是 `window` 对象的属性，并返回一个 `Storage` 对象。两者之间的唯一区别是数据的可用持续时间。`sessionStorage`\
  \ 在浏览器关闭时被清除，而 `localStorage` 则被无限期保留。\n\n`Storage` 对象包含一组键值对，两者都必须是字符串。你可以在 `Storage`\
  \ 对象中存储任何可序列化的数据。通过调用 `setItem()` 方法并传入一个键和一个字符串值来添加项目。如果指定的键已存在，其值将被更新；否则，会将新项目添加到存储中。你可以通过调用\
  \ `getItem()` 并传入所需项目的键来检索项目。如果找不到指定的键，`getItem()` 将返回 `null`。\n\n- **注意** 在调用 `setItem()`\
  \ 时始终检查异常，因为可能会发生异常。如果缓存已满，`setItem()` 将抛出异常。此外，在某些浏览器的隐私模式下，它也会抛出异常。\n\n如果你想从存储中移除一个项目，可以调用\
  \ `removeItem()` 方法并传入该项目的键。你也可以通过调用 `clear()` 方法移除所有项目。`Storage` 的方法在以下代码中演示：\n\
  \n```javascript\nvar cache = window.sessionStorage;\n\ncache.clear();\n\ncache.setItem(\"\
  key1\", \"This is my saved data\");\n\nconsole.log(\"Saved data: \" + cache.getItem(\"\
  key1\"));\n\ncache.removeItem(\"key1\");\n\nconsole.log(\"Saved data: \" + cache.getItem(\"\
  key1\"));\n```\n\n本地存储和会话存储都有大小限制，具体因浏览器和操作系统而异。这里有一个页面可以测试你的特定浏览器并验证存储限制：[`dev-test.nemikor.com/web-storage/support-test/`](http://dev-test.nemikor.com/web-storage/support-test/)。但通常，你应该有大约\
  \ 5MB 的存储空间。\n\n**第 16 章 ■ 浏览器环境**\n\n#### 浏览器界面元素\n\n\n\n\n浏览器提供了多个 UI 组件，如菜单、工具栏和状态栏，用户可借此与浏览器交互并控制其行为。每个组件都支持\
  \ `BarProp` 接口，该接口只暴露一个属性 `visible`。JavaScript 可以访问这些组件，以判断特定元素是否对用户可见。支持以下窗口属性：\n\
  \n- `locationbar` - 显示当前文档的 URL。\n- `menubar` - 浏览器提供的任何类型的菜单。\n- `personalbar`\
  \ - 提供用户偏好设置、书签、收藏夹等。\n- `scrollbar` - 垂直或水平滚动条。\n- `statusbar` - 提供当前页面或页面上选中元素的状态。这可能包括资源的下载状态或链接指向的\
  \ URL。\n- `toolbar` - 包含基于 UI 的命令（如后退按钮或刷新按钮）的组件。\n\n你无法隐藏或显示这些 UI 组件，但可以判断它们当前是否可见。例如，要查看菜单是否可见，可以调用以下代码：\n\
  \n```\nif (window.menubar.visible) {\n  console.log(\"菜单可见\");\n}\n```\n\n## 计时器\n\
  \n`window` 对象提供了两种类型的计时器：\n\n- `setTimeout()` - 在指定的时间后调用指定的函数。\n- `setInterval()`\
  \ - 在指定的时间后调用指定的函数，并按照相同的时间间隔持续调用该函数。\n\n这两个方法都会返回一个句柄，你可以用其取消计时器。这对于 `setInterval()`\
  \ 尤为重要，因为它会持续调用该函数，直到被取消为止。要取消计时器，请使用相应的方法 `clearTimeout()` 或 `clearInterval()`，并将设置方法的返回值传入。\n\
  \n下面是一个简单的演示，让你了解其实际运作方式：\n\n```\nfunction logMessage() {\n  console.log(\"计时器触发了！\"\
  );\n}\n\nvar timer = setTimeout(logMessage, 2000);\n\n// 不要调用这一行，否则计时器将永远不会触发\n\
  //clearTimeout(timer);\n```\n\n我特意注释掉了 `clearTimeout()` 的调用，这样计时器最终就会到期。页面加载大约 2\
  \ 秒后，你应该会在控制台日志中看到一条新记录。\n\n## 第 16 章 - 浏览器环境\n\n### 本章小结\n\n在本章中，我涵盖了与浏览器环境及可用功能相关的广泛主题。你可以利用大量可用信息来影响应用程序的行为。`window`\
  \ 对象是起点，并提供了访问这些功能的途径。主要的子对象包括：\n\n- `screen` - 提供显示设备的详细信息。\n- `location` - 提供当前网址的详细信息，并可用于导航到其他页面。\n\
  - `history` - 用于支持后退按钮，并且可以通过操作来改变后退按钮的行为。你还可以包含状态信息，以便在导航回上一页面时使用。\n- `navigator`\
  \ - 提供有关设备的详细信息，包括硬件、操作系统和浏览器信息。它还提供了 `geolocation` 对象。\n\n`window` 对象提供了一些有用的功能，例如控制台日志记录，以及性能分析和性能指标。你还可以通过\
  \ Cookie、本地存储和会话存储来存储客户端数据。\n\n计时器也可以通过 `window` 对象使用。虽然我没有详细讲解，但参考材料中提供了大量相关功能。\n\
  \n在下一章中，我将进一步解释 `window` 本身，包括对话框、框架和多标签应用程序。\n\n## 第 17 章 - Window 对象\n\n在本章中，我将解释如何使用\
  \ JavaScript 创建和操作窗口。我将首先打开一个弹出窗口，并演示如何控制其大小、位置以及其他属性。\n\n我将展示如何使用 `window` 对象上的方法来移动和调整窗口大小。我还会提供一个使用\
  \ HTML、CSS 和 JavaScript 模拟模态对话框的示例。最后，我将简要解释如何使用内联框架嵌入来自其他来源的内容。\n\n#### 创建窗口\n\n\
  \n\n\n我首先打开一个通过 JavaScript 创建的现有窗口。接着，我会演示如何通过 JavaScript 来操控这个新窗口。通过调用`window.open()`方法可以轻松创建新窗口。该方法有两个必需的参数：窗口的名称以及其文档的网页地址。\n\
  \n■ **注意** `window`对象提供了修改其属性（如大小和位置）的方法。然而，出于安全考虑，只能调整通过 JavaScript 创建的窗口。因此，你无法更改由浏览器创建的初始窗口。但是，你可以使用`open()`方法创建新窗口，然后通过\
  \ JavaScript 操控它，这正是我接下来要演示的。\n\n在我的 Web 项目中，有一个非常简单的 HTML 文档，名为`MainPage.html`，其标记如下：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"\
  \ />\n<title>Chapter 17 - Windows</title>\n<script src=\"SampleScript.js\"></script>\n\
  </head>\n<body>\n<p>Hello World!</p>\n</body>\n</html>\n```\n\n© Mark J. Collins\
  \ 2017\n\nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and Multimedia*, DOI 10.1007/978-1-4842-2463-2_17\n\
  \n![index-339_1.jpg](img/index-339_1.jpg)\n\n## 第 17 章 ■ 窗口对象\n\n对于新窗口，我还有`PopUp.html`和`PopUp2.html`文件，它们与初始文档基本相同，只是在标题和段落元素上略有变化，以便区分。弹出文档也引用了一个不同的脚本文件`PopUp.js`，该文件初始为空。`SampleScript.js`文件初始包含以下\
  \ JavaScript 代码：\n\n```javascript\n\"use strict\";\nwindow.name = \"Chapter17\"\
  ;\nvar popup = window.open(\"PopUp.html\", \"popup\");\n```\n\n通过`open()`方法创建的窗口，其`name`属性由第二个参数设置。然而，通过浏览器创建的窗口没有此属性，因此这段脚本设置了`name`属性。然后它使用`PopUp.html`文档创建了一个新窗口。\n\
  \n### 弹出窗口拦截器\n\n当你尝试此操作时，除非你已禁用弹出窗口拦截器，否则你很可能会收到类似于图 17-1（来自 Chrome 浏览器）所示的警告。弹出窗口通常非常烦人且可能构成安全威胁，因此所有现代浏览器都能拦截弹出窗口。在大多数情况下，这是默认设置。\n\
  \n***图 17-1.** Chrome 中的弹出窗口警告*\n\n我建议你点击“管理弹出窗口拦截”或等效链接，有选择地允许某些弹出窗口。如果你完全禁用拦截，浏览器将容易受到攻击。但是，如果不启用弹出窗口，本章中的大多数演示将无法工作。在弹出窗口例外对话框中，你可以输入`localhost`，如图\
  \ 17-2 所示。\n\n![index-340_1.jpg](img/index-340_1.jpg)\n![index-340_2.jpg](img/index-340_2.jpg)\n\
  ![index-340_3.jpg](img/index-340_3.jpg)\n\n## 第 17 章 ■ 窗口对象\n\n***图 17-2.** 在 Chrome\
  \ 中配置弹出窗口例外*\n\n每个浏览器用于报告被拦截的弹出窗口以及管理允许哪些弹出窗口的界面都不同。例如，Firefox 中的警告如图 17-3 所示，Opera\
  \ 中的警告如图 17-4 所示。\n\n***图 17-3.** Firefox 中的弹出窗口拦截器*\n\n***图 17-4.** Opera 中的弹出窗口拦截器*\n\
  \n![index-341_1.jpg](img/index-341_1.jpg)\n\n## 第 17 章 ■ 窗口对象\n\n一旦你禁用了弹出窗口拦截器，你需要刷新页面以便重新运行脚本。你应该会看到另一个标签页，如图\
  \ 17-5 所示。\n\n***图 17-5.** 打开第二个标签页*\n\n### 重用窗口\n\n当通过 JavaScript 创建窗口时，你必须给它一个名称，即传递给`open()`方法的第二个参数。如果你尝试使用相同的名称打开另一个窗口，它将使用现有窗口，但会用新的\
  \ URL 替换其内容。要测试这一点，请转到初始标签页并打开控制台窗口。然后输入以下命令：\n\n```javascript\nwindow.open(\"PopUp2.html\"\
  , \"popup\");\n```\n\n因为名称相同（“popup”），所以将使用同一个窗口，但它会加载指定的文档`PopUp2.html`。\n\n`open()`方法还会返回一个`window`对象，在我的示例中，它被存储在`popup`变量中。你可以使用它来操控窗口，我将在本章后面演示这一点。\n\
  \n### 配置参数\n\n`open()`方法还接受第三个参数，该参数包含一个配置字符串，有时被称为窗口特性字符串。如果你不提供此参数，或者该参数为空字符串，则新窗口将在现有浏览器窗口中作为一个新标签页创建，正如我之前演示的那样。但是，提供任何值（即使是单个空格）都会导致创建单独的窗口。\n\
  \n■ **提示** 窗口特性字符串仅在窗口首次创建时使用。如果你使用`open()`方法替换其内容，此参数将被忽略，并保留现有的窗口特性。\n\n这个窗口特性字符串包含一组由逗号分隔的名称/值对，每个对定义了新窗口的一个特性。可以在此字符串中指定的特性有很多。我将它们组织成逻辑组。\n\
  \n■ **注意** 规范指出，每个名称/值对之间不应有空格，只能有逗号。但根据我的经验，每个值之间的空格会被忽略。\n\n## 第 17 章 ■ 窗口对象\n\
  \n#### 位置和大小\n\n支持以下与新窗口位置或大小相关的值，它们相当不言而喻：\n\n- `left`\n- `top`\n- `height`\n-\
  \ `width`\n- `outerHeight`\n- `outerWidth`\n\n`left`和`top`值指示新窗口的位置，并指定距离显示器左边缘和上边缘的像素数。`height`和`width`值指定文档实际内容可用的区域。`outerHeight`和`outerWidth`值包括内容的区域以及标题区域、菜单、工具栏等。如果同时指定了内外值，则外部值优先。\n\
  \n为了演示这一点，关闭第二个标签页，转到初始页面的控制台窗口。然后输入以下命令：\n\n```javascript\nwindow.open(\"PopUp.html\"\
  , \"popup\", \"height=300,width=400,top=400,left=150\");\n```\n\n■ **警告** 浏览器对这些特性的支持并不一致。Chrome、IE\
  \ 和 Edge 不支持`outerHeight`和`outerWidth`特性。Opera 支持，但如果使用它们，`top`和`left`特性将被忽略，并且窗口将与初始窗口的左上角对齐。Chrome\
  \ 需要`height`和`width`特性；如果未提供，整个字符串将被忽略。Edge 不支持`top`和`left`特性；新窗口总是位于初始窗口下方和右侧约\
  \ 20 像素的位置。\n\n#### Chrome 特性\n\n下一组特性与浏览器的 UI 组件相关，通常被称为 chrome（不要与 Chrome 浏览器混淆）。如果未设置这些特性，大多数浏览器的默认行为是仅包括标题栏和地址区域；但\
  \ IE 默认不包括地址栏。\n\n规范定义了以下值。然而，在撰写本文时，只有 Firefox 和 Edge 支持它们。\n\n- `location`\n-\
  \ `menubar`\n- `personalbar`\n- `status`\n- `titlebar`\n- `toolbar`\n\n## 第 17 章\
  \ ■ 窗口对象\n\n这些是布尔值，不需要指定值；它们的存在表示请求该特性，它们的缺席表示相反。将它们的值设置为`no`，例如`menubar=no`也会禁用该特性。要测试这一点，请从\
  \ Firefox 或 IE 中关闭弹出窗口，并在初始窗口的控制台中输入以下命令：\n\n```javascript\nwindow.open(\"PopUp.html\"\
  , \"popup\", \"height=300,width=400,top=400,left=150,location,menubar,status,toolbar\"\
  );\n```\n\n\n\n"
