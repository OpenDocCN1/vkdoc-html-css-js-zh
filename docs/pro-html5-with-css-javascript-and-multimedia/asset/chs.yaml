  \n        async defer>\n    </script>\n    ```\n\n    **第 26 章 ■ 地理定位与地图绘制**\n\n\
  \    这将异步加载地图脚本，并在加载完成后调用`DisplayMap()`函数。\n\n5.  使用以下代码将`DisplayMap()`函数添加到`Geolocation.js`脚本中。你需要插入之前在练习\
  \ 26-3 中获得的 API 密钥。\n\n    ```javascript\n    function DisplayMap() {\n        var\
  \ map = new Microsoft.Maps.Map(document.getElementById('map'),\n        {\n    \
  \        credentials: '<use your key here>',\n            center: new Microsoft.Maps.Location(latitude,\
  \ longitude),\n            mapTypeId: Microsoft.Maps.MapTypeId.aerial,\n       \
  \     zoom: 20\n        });\n    ```\n\n    对`Map()`函数的调用接受两个参数：第一个是用于显示地图的 HTML\
