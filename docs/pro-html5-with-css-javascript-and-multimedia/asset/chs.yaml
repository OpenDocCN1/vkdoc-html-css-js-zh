- "# 操作窗口\n\n创建新窗口后，可以使用窗口的属性和方法来查看和调整其大小、位置和滚动属性。\n\n#### 属性\n\n窗口的当前位置和大小可以通过 `window`\
  \ 对象获取。`open()` 方法返回代表新窗口的 `window` 对象。初始窗口可以利用该对象来查找窗口的位置。你还可以确定窗口的当前滚动位置。以下是可用的属性：\n\
  \n- `innerHeight` - 可用于内容的高度。\n- `innerWidth` - 可用于内容的宽度。\n- `outerHeight` - 窗口的总高度，包括浏览器\
  \ UI 元素。\n- `outerWidth` - 窗口的总宽度，包括浏览器 UI 元素。\n- `screenX` - 设备左边缘到窗口左边缘的距离。\n\
  - `screenY` - 设备顶部边缘到窗口顶部边缘的距离。\n- `scrollX` - 文档水平滚动的像素数。\n- `scrollY` - 文档垂直滚动的像素数。\n\
  \n## 方法\n\n这些属性都是只读的；但可以通过 `window` 对象提供的一组方法进行操作。以下是可用的方法：\n\n- `moveBy()` - 按指定的像素数移动窗口；需同时指定水平和垂直偏移量。如果某个方向不需移动，则设置为\
  \ 0。负值将使窗口向上或向左移动。\n- `moveTo()` - 移动窗口，使其左上角位于指定位置。\n- `resizeBy()` - 按指定量增加窗口大小；需同时指定水平和垂直增量。如果某个维度需要缩小，则设置为负值。窗口的顶部和左边缘保持不变。\n\
  - `resizeTo()` - 指定新窗口的大小。窗口的顶部和左边缘保持不变。\n- `scrollBy()` - 按指定的像素数滚动；可同时指定水平和垂直值。\n\
  - `scrollByLines()` - 按指定的行数垂直滚动文档。\n- `scrollByPages()` - 按指定的页数垂直滚动文档。\n- `scrollTo()`\
  \ - 滚动到指定的水平和垂直位置。\n- `sizeToContent()` - 更改窗口大小以适应现有内容。\n\n#### 演示\n\n为了演示这些功能，我首先在\
  \ `PopUp2.html` 文件中添加了一幅大图像（以粗体显示的代码行）。这使你能够看到滚动行为以及 `sizeToContent()` 方法的效果。\n\n\
  ```html\n<body>\n  <p>Hello PopUp 2!</p>\n  <img src=\"G_Wash_Wide.jpg\" alt=\"\
  George Washington\" />\n</body>\n```\n\n然后，我将 `SampleScript.js` 替换为清单 17-1 中所示的代码。\n\
  \n\n\n### 清单 17-1：重写`SampleScript.js`以测试窗口操作\n\n```javascript\n\"use strict\";\n\
  \nwindow.name = \"Chapter17\";\n\nvar popup = window.open(\"PopUp2.html\", \"popup\"\
  , \"height=300,width=400,left=400,top=150,location,toolbar,menubar,scrollbars\"\
  );\n\nvar i = 1;\n\nvar timer = window.setInterval(adjustWindow, 2000);\n\nfunction\
  \ adjustWindow() {\n\n    if (i > 9) {\n        clearInterval(timer);\n    }\n \
  \   else {\n        console.log(\"outerH: %i, outerW: %i, innerH: %i, innerW: %i,\
  \ screenX: %i, screenY: %i, scrollX: %i, scrollY: %i\",\n            popup.outerHeight,\
  \ popup.outerWidth, popup.innerHeight, popup.innerWidth,\n            popup.screenX,\
  \ popup.screenY, popup.scrollX, popup.scrollY);\n    }\n\n    switch (i) {\n   \
  \     case 1:\n            popup.scrollBy(50, 30);\n            break;\n       \
  \ case 2:\n            popup.moveBy(50, 50);\n            break;\n        case 3:\n\
  \            popup.moveTo(200, 100);\n            break;\n        case 4:\n    \
  \        popup.resizeBy(50, 50);\n            break;\n        case 5:\n        \
  \    popup.resizeTo(700, 500);\n            break;\n        case 6:\n          \
  \  popup.scrollByLines(5);\n            break;\n        case 7:\n            popup.scrollByPages(1);\n\
  \            break;\n        case 8:\n            popup.sizeToContent();\n     \
  \       break;\n        case 9:\n            popup.close();\n            break;\n\
  \    }\n    i++;\n}\n```\n\n通过使用上一章中介绍的`setInterval()`方法，`adjustWindow()`函数每 2 秒被重复调用一次。每次调用时，它都使用不同的方法来调整弹出窗口的大小、位置或滚动。在每次迭代中，当前窗口属性都会被写入控制台日志。在最后一次调用时，通过调用`close()`方法关闭弹出窗口。完成时，控制台日志将类似于图\
  \ 17-6 所示。\n\n**图 17-6.** 控制台日志中的结果\n\n### 焦点\n\n你可以通过编程方式更改哪个窗口获得焦点。当打开一个新窗口时，它通常会获得焦点。如果要打开一个新窗口来显示某些信息，但用户仍在与初始窗口交互，则应在打开新窗口后对初始窗口调用`focus()`方法。这将使主窗口保持焦点。\n\
  \n窗口还支持`blur()`方法。这个名称起初可能看起来有些奇怪，但获得焦点的反义词便是模糊化。调用`blur()`方法会从窗口移除焦点，焦点将转移到 Z 轴顺序中的下一个窗口。\n\
  \n### 模态对话框\n\n到目前为止，我创建的窗口都是*非模态*的，这意味着用户也可以与其他窗口进行交互。相比之下，*模态*窗口会获得焦点，并禁用应用程序的其余部分，直到该窗口被关闭。现在，我将向你展示如何创建模态对话框。\n\
  \n#### 标准弹出对话框\n\n在解释更通用的模态对话框之前，我想先指出，通过 JavaScript 有三种标准的模态对话框可用。它们使用起来快速简便，但外观不美观且无法自定义样式。第一个是警告框，我在第\
  \ 3 章中向你展示过。它仅显示一条文本信息，并带有一个**确定**按钮，用于关闭对话框。第二个是确认框，它显示一条文本信息，但包含**确定**和**取消**两个按钮。如果点击**确定**则返回`true`，点击**取消**则返回`false`。最后一个是提示框，它显示一条文本信息和一个用于输入值的文本字段。输入的值将被返回。以下代码演示了所有三种对话框：\n\
  \n```javascript\nwindow.alert(\"这是一个警告框。\\n 这是第二行\");\n\nif (window.confirm(\"是否继续？\"\
  )) {\n    var answer = window.prompt(\"你有多少只宠物？\", 0);\n    console.log(\"输入了 %i\
  \ 只宠物。\", answer);\n}\nelse {\n    console.log(\"确认失败\");\n}\n```\n\n`alert()`方法展示了如何使用`\\\
  n`转义序列来包含换行符。其他两个弹出对话框也支持此功能。`confirm()`方法嵌套在`if`语句中。如果用户点击**取消**按钮，则跳过后续代码并向控制台写入一条消息。`prompt()`方法接受两个参数。第一个参数是对话框中显示的文本，第二个参数是可选的默认值。在\
  \ Firefox 中显示的对话框如图 17-7、17-8 和 17-9 所示。每个浏览器对这些对话框的格式化方式各不相同。\n\n**图 17-7.** Firefox\
  \ 中的警告框\n\n**图 17-8.** Firefox 中的确认框\n\n**图 17-9.** Firefox 中的提示框\n\n#### 自定义模态对话框\n\
  \n在 HTML/JavaScript 中创建一个真正的模态对话框颇具挑战性。一段时间以来，存在几种方法，如 `openDialog()` 和 `showModalDialog()`。然而，由于安全漏洞和各种实现问题，这些方法已被弃用。事实上，此功能已在多个浏览器中完全移除。对于任何新应用程序，你绝对不应再使用这些方法。\n\
  \nHTML5 规范定义了一个新的 `<dialog>` 元素，有望简化模态对话框。然而，在撰写本文时，几乎还没有浏览器支持它。存在一些 jQuery 解决方案以及其他\
  \ polyfill 可供使用，但这超出了本书的范围。\n\n我将演示一种相当简单的方法来模拟模态对话框，仅使用原生 HTML、CSS 和 JavaScript，这种方法有时被称为*玻璃窗格*方法。其基本思想是用一个透明或半透明的元素覆盖整个窗口，称为**玻璃**。这就像在画作上盖一块玻璃板；虽然你能看到玻璃板下的画作，但却无法实际触摸到画作。实际的对话框及其元素则放置在玻璃之上。你可以与对话框交互，但不能与页面的其余部分交互。从用户的角度来看，它的行为就像一个模态对话框。\n\
  \n> **提示** 为了完成这个任务，我需要让你提前了解一下接下来的两章内容。你将需要通过 JavaScript 操作 DOM 元素及其样式。\n\n玻璃覆盖层和对话框元素的\
  \ HTML 代码包含在主 HTML 文档中，但在你希望打开对话框之前，它们保持隐藏状态。以下是所需的标记代码。\n\n```html\n<body>\n  \
  \  <p>你好，世界！</p>\n    <button onclick=\"showDialog()\">显示对话框</button>\n    <div\
  \ id=\"glass\" class=\"glass\">\n        <div class=\"dialog\">\n            <h3>提示</h3>\n\
  \            <p>你有多少只宠物？</p>\n            <input type=\"number\" value=\"0\" id=\"\
  numPets\" />\n            <button id=\"dialogOK\" type=\"Submit\" onclick=\"OK()\"\
  >确定</button>\n        </div>\n    </div>\n</body>\n```\n\n我添加了一个用于显示对话框的按钮；其点击事件将调用需要实现的\
  \ `showDialog()` 函数。其余标记代码创建了玻璃，它是一个简单的 `<div>` 元素。在该 `<div>` 元素内部，是另一个包含实际对话框内容的\
  \ `<div>` 元素。这包括一个用于标题的标题元素 `<h3>`，一个包含提示的段落元素 `<p>`，一个接受用户输入的 `<input>` 元素，以及一个用于提交条目的按钮。点击该按钮将调用\
  \ `OK()` 函数。\n\n玻璃和对话框通过以下两条 CSS 规则进行样式设置：\n\n```css\n.glass {\n    position: fixed;\n\
  \    left: 0;\n    top: 0;\n    background-color: rgba(225,225,225,.7);\n    height:\
  \ 100vh;\n    width: 100vw;\n    z-index: 100;\n}\n\n.dialog {\n    height: 125px;\n\
  \    width: 220px;\n    margin: 0 auto;\n    padding: 15px;\n    border: 1px solid\
  \ black;\n    background-color: white;\n}\n```\n\n\n\n该玻璃层使用了 `position: fixed`，正如我在[第\
  \ 10 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_10)中解释的那样，这会使元素相对于窗口保持固定。通过将\
  \ `left` 和 `top` 设置为 `0`，并将 `height` 和 `width` 分别设为 `100vh` 和 `100vw`，该元素将占据整个窗口区域。`z-index`\
  \ 被设为 `100`，以确保该元素位于所有其他元素之上。\n\n你可以根据自己的偏好调整背景；我将其设置为透明度为 30%的灰色背景。这能清楚地表明对话框周围的其他控件不可用。你也可以使用完全透明的背景，这样其他元素会正常显示，但用户仍然无法与之交互。或者使用完全不透明的背景来隐藏其他元素。这些选择纯粹是视觉上的，不会影响页面的功能。\n\
  \n对话框的格式非常直接，使用固定尺寸并通过 `margin: 0 auto;` 声明实现水平居中。我没有添加其他美化格式，但你可以根据需要添加更多声明。\n\n\
