  \ 文件中调用它即可。\n\n## 基本的 DOM 操作\n\n这个简单的示例演示了操作 DOM 时使用的四种基本操作：\n\n- 查找一个或多个元素\n- 创建新元素\n\
  - 定位元素\n- 修改元素\n\n#### 查找元素\n\n通常，操作 DOM 的第一步是找到需要访问的元素。在前面的示例中，我必须获取 body 元素，以便修改其内容。根据用于搜索的数据，这里有几种可用的方法。\n\
  \n最简单的方法是依据元素的 `id` 属性来检索它。由于 `id` 属性在文档中必须是唯一的，因此该方法将返回零个或一个元素。如果未找到匹配的元素，则返回 `null`。\n\
  \n```\nvar element = document.getElementById(id);\n```\n\n接下来的两种方法会返回一个元素数组，这些元素匹配元素类型或\
  \ class 属性。第一种方法已在最初的演示中使用过：\n\n```\nvar elementArray = document.getElementsByTagName(name);\n\
  ```\n\n```\nvar elementArray = document.getElementsByClassName(names);\n```\n\n\
  后一种方法允许你提供一个以空格分隔的 class 名称列表。如果提供了多个名称，则只会返回包含所有指定 class 名称的元素。如果未找到匹配的元素，这两种方法都将返回一个空数组。\n\
  \n在第 9 章中，我解释了 CSS 选择器的功能。你可以使用 `querySelector()` 和 `querySelectorAll()` 方法在 JavaScript\
  \ 中利用此功能。使用这两种方法时，传入的选择器与 CSS 中使用选择器的方式完全相同。`querySelectorAll()` 方法返回所有匹配的元素，而 `querySelector()`\
  \ 方法仅返回第一个匹配的元素。你可以使用复杂选择器，例如：\n\n```\nvar elementArray = document.querySelectorAll(\"\
  header+p, .book, p:first-child\");\n```\n\n> **提示：** 在这些示例中，我在 `document` 对象上调用搜索方法。这将对整个文档执行搜索。所有元素也都支持这些方法，因此你可以从某个子节点调用它们。这将从调用该方法的元素开始执行搜索。它会忽略其父元素和兄弟元素。\n\
  \n#### 创建元素\n\n正如我已经演示过的，你可以使用 `createElement()` 方法并传入元素类型（例如 `div`、`p` 或 `span`）来创建新元素。新元素在返回值中提供。返回的实际对象类型会根据指定的元素类型而有所不同。\n\
  \n除元素节点外，文档还具有*文本节点*。文本节点包含元素开始标签和结束标签之间的内容。例如，要创建一个段落元素并设置其内容：\n\n```\nvar p =\
  \ document.createElement(\"p\");\nvar text = document.createTextNode(\"This is a\
  \ test\");\np.appendChild(text);\n```\n\n如果在执行 JavaScript 后检查文档，你将看到元素定义如下：\n\n\
  ```html\n<p>This is a test</p>\n```\n\n你可以通过设置 `textContent` 属性来实现相同的目的。例如：\n\n\
  ```\np.textContent = \"This is a test\";\n```\n\n你也可以像在第一个示例中那样设置 `innerHTML` 属性。当使用\
  \ `innerHTML` 属性时，元素的内容可以包含子元素。在第一个示例中，部分文本包含在 `strong` 元素内。设置 `innerHTML` 属性时，其内容会被指定的文档片段替换。相比之下，`createTextNode()`\
  \ 方法仅用文本更新元素的内容。如果你尝试在传递给它的字符串中嵌入元素，它们将被视为字面文本。\n\n> **警告：** 设置 `innerHTML` 属性存在安全隐患。为了避免跨站脚本攻击，`script`\
  \ 元素如果包含在 `innerHTML` 属性中将被忽略。设置 `innerHTML` 属性时仍应小心谨慎。不要使用 `innerHTML` 属性将用户输入插入到\
  \ DOM 中。请改用 `textContent` 属性。\n\n#### 移动元素\n\n创建元素或文本节点只是创建了节点；它并没有将其放置在任何位置。要使其包含在文档中，你需要将其添加进去，可以将其作为文档的根节点，也可以作为现有节点的子元素。一个文档只能有一个根节点，除非你完全用\
  \ JavaScript 构建整个文档，否则你很可能要将新元素添加到现有节点中。\n\n为此，在最初的示例中使用了 `appendChild()` 方法。你首先需要找到想要添加新元素的元素。然后，`appendChild()`\
  \ 方法将使新元素成为该元素的子节点。该方法在父元素上调用，子元素作为参数传入。`appendChild()` 方法也会返回子节点，即正在添加的节点。\n\n\
  ```\nvar child = parentNode.appendChild(childNode);\n```\n\n如果父节点已有子元素，则新元素将位于现有子元素之后。如果这不是你想要的位置，你可以改用\
  \ `insertBefore()` 方法。它的工作方式与 `appendChild()` 类似，只是多了一个参数来指定新元素应放在哪个兄弟元素之前。\n\n\
  ```\nvar child = parentNode.insertBefore(childNode, sibling);\n```\n\n你在父节点上调用 `insertBefore()`\
  \ 方法，第一个参数是要添加的元素。如果为兄弟元素参数传入 `null`，则该元素将被添加为最后一个子元素；这等效于调用 `appendChild()` 方法。\n\
  \n> **提示：** 既然有 `insertBefore()` 方法，你可能会认为也存在 `insertAfter()` 方法。但并没有。不过，这可以通过使用\
  \ `nextSibling` 属性轻松实现：`parentNode.insertBefore(childNode, sibling.nextSibling)`。所有\
  \ HTML 元素都继承自 `Node` 对象，该对象提供了一个 `nextSibling` 属性。在某个元素之后插入等同于在该元素的下一个兄弟元素之前插入。如果该元素恰好是最后一个子元素，那么它的\
  \ `nextSibling` 属性将为 `null`，而 `insertBefore()` 方法会将新元素添加为最后一个子元素。\n\n你还可以使用 `removeChild()`\
  \ 方法移除元素。与 `appendChild()` 和 `insertBefore()` 方法一样，`removeChild()` 方法在父节点上调用，要移除的元素作为参数传入。该元素仍然存在，但它不再是文档的一部分。与其他方法一样，被移除的元素会通过方法调用返回。\n\
  \n```\nvar removedElement = parentNode.removeChild(childNode);\n```\n\n如果你想移动一个元素，你可以使用\
  \ `removeChild()` 方法将其从原始位置删除，然后使用 `appendChild()` 或 `insertBefore()` 将其移动到新位置。\n\
  \n> **注意：** 需要父元素来移除节点可能看起来有点奇怪，但它的工作原理就是这样。你可以通过元素的 `parentNode` 属性轻松获取父元素。因此，如果你有想要移除的元素，可以调用\
  \ `element.parentNode.removeChild(element)`。\n\n最后，你可以使用 `replaceChild()` 方法用一个元素替换另一个现有元素。\n\
  \n\n\n```markdown\n它的工作方式与其他方法类似；它在父元素上被调用。它接受两个参数：第一个是要添加的元素，第二个是要移除的元素。新元素被添加到被移除元素的相同位置。被移除的元素会通过方法调用返回。\n\
  \n```javascript\nvar removedElement = parentNode.replaceChild(newElement, existingElement);\n\
  ```\n\n#### 修改元素\n\n大多数 HTML 元素由它们的内容（开始和结束标签之间的文本）以及在开始标签中指定的属性组成。一些元素，如图像，没有任何内容，完全由其属性定义。正如我已经解释过的，元素的内容可以通过以下方式设置：\n\
  \n*   创建文本节点并将其附加到元素\n*   设置 `textContent` 属性\n*   设置 `innerHTML` 属性\n\n![](img/index-360_1.jpg)\n\
  ![](img/index-360_2.jpg)\n\n为了操作属性，每个元素都有一个 `attributes` 属性，其中包含在该元素上定义的所有属性。这是一个名称/值对的集合。你可以通过调用\
  \ `hasAttribute()` 方法并传入属性名称来检查是否已指定特定属性。\n\n你还可以向此集合添加属性或修改现有属性。以下代码演示了如何访问 `attributes`\
  \ 属性。它会将第一个 `link` 元素的属性写入控制台。输出如图 18-3 所示。\n\n```javascript\nvar link = document.getElementsByTagName(\"\
  link\")[0];\nvar attr = link.attributes;\n\nfor (var i=0; i < attr.length; i++)\
  \ {\n    console.log(attr[i].name + \"='\" + attr[i].value + \"'\");\n}\n```\n\n\
  ***图 18-3.** 显示元素属性*\n\n但是，这些属性也可以作为单个属性使用。你可以直接获取或给这些属性赋值。`HTMLElement` 对象支持所有全局属性，例如\
  \ `id` 和 `class`。为了说明这一点，我将修改前面的示例，设置 `id`、`class` 和 `lang` 属性。这些属性将包含在 `attributes`\
  \ 属性中，如图 18-4 所示。\n\n```javascript\nvar link = document.getElementsByTagName(\"\
  link\")[0];\nlink.id = \"myID\";\nlink.className = \"myClass\";\nlink.lang = \"\
  en\";\n\nvar attr = link.attributes;\n\nfor (var i=0; i < attr.length; i++) {\n\
  \    console.log(attr[i].name + \"='\" + attr[i].value + \"'\");\n}\n```\n\n***图\
  \ 18-4.** 显示附加属性*\n\n> **注意** 属性名称可能与属性名不同。在这种情况下，`class` 是 JavaScript 中的保留字，因此该属性被称为\
  \ `className`。\n\n其他专门的对象，如 `HTMLImageElement`，从 `HTMLElement` 继承全局属性，并提供特定于该元素的附加属性。例如，`HTMLImageElement`\
  \ 暴露了 `alt`、`src` 和 `srcset` 属性。\n\n#### 相关元素\n\n正如我所提到的，每个元素都是文档中的一个节点，可以有一个父节点（除了根节点之外的所有节点都有一个父节点）。一个节点也可以有零个或多个子节点。在从文档中获取元素后，有几个属性可以用来导航到相关元素。\n\
  \n以下是可用的属性：\n\n*   `parentNode` - 节点的直接父节点；仅对根节点为 `null`\n*   `children` - 一个 `HTMLCollection`\
  \ 对象，包含节点的所有直接子节点\n*   `firstChild` - `children` 集合中的第一个元素\n*   `lastChild` - `children`\
  \ 集合中的最后一个元素\n*   `previousSibling` - 与当前节点具有相同直接父节点，并且在父节点的 `children` 集合中位于当前节点之前的元素。如果当前元素是父节点的第一个子节点，则为\
  \ `null`。\n*   `nextSibling` - 与当前节点具有相同父节点，并且位于当前节点之后的元素。如果当前元素是其父节点的最后一个子节点，则为\
  \ `null`。\n\n> **提示** 代表 HTML 元素的对象上有数百个属性、方法和事件。我已经解释了更常用的功能，但这并非详尽无遗的集合。\n>\n\
  > Mozilla 有一个非常好的 API 参考，如果你需要更多细节，我推荐它。可以从这里开始：\n> `https://developer.mozilla.org/en-US/docs/Web/API/HTMLElement`。本文描述了\
  \ `HTMLElement` 对象的成员，并提供了指向其他对象的链接。\n\n#### 使用 jQuery\n\n> **注意** 在本书中，我专注于原生 HTML、CSS\
  \ 和 JavaScript 的功能。但是，有许多库和框架扩展了这些功能。当然，它们各有优缺点。如果你正在进行任何严肃的 Web 开发，你会想要考虑其中一个或多个库，但我在本书中特意避免了它们。然而，在\
  \ DOM 操作方面，jQuery 已成为事实上的标准。\n\n在[第 3 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_3)中，我解释了如何定义一个命名空间来将变量保持在全局命名空间之外。如果你在名为\
  \ `MyNamespace` 的命名空间中定义了一个函数（例如 `log()`），你可以通过指定命名空间和函数名称来执行它。这避免了与其他可能也定义了 `log()`\
  \ 函数的脚本发生任何潜在冲突。\n\n```javascript\nMyNamespace.log(\"Hello World\");\n```\n\n在 jQuery\
  \ 中，所有成员都定义在一个命名空间中，这个命名空间恰好被命名为“`$`”。每当你看到 `$.` 或 `$()` 时，就知道正在使用一个 jQuery 成员。\n\
  \n## 基础知识\n\n使用 jQuery 非常简单，但你需要了解一些基础知识。\n\n#### 选择元素\n\n所有 jQuery 操作的基本模式是选择一些东西，然后对它执行操作。语法如下所示：\n\
  \n```javascript\n$(selector).action();\n```\n\n选择器将返回零个或多个元素。然后对集合中的每个元素执行指定的操作。选择器可以是任何有效的\
  \ CSS 选择器，这些选择器在[第 9 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_9)中进行了描述。\n\n\
  jQuery 还支持额外的功能。这是一篇列出所有选择器及其示例和文档的文章：`http://codylindley.com/jqueryselectors/`。\n\
  \n你可以将选择和操作拆分为两个单独的调用。例如：\n\n```javascript\nvar $elements = $(selector);\n$elements.action();\n\
  ```\n\n如果你要对元素集执行多个操作，这尤其有用，因为它避免了再次执行选择。但请记住，选择器的结果是静态的；如果文档发生更改，它们不会更新。要反映最新状态，你需要重新执行选择器。\n\
  \n你也可以将对象传递给选择器，而不是选择器字符串。最常见的例子是使用 `document` 对象。例如，这将分配匿名函数在文档准备好时执行：\n\n```javascript\n\
  $(document).ready(function(){... add code here ...});\n```\n\njQuery 提供了许多基于索引的选择器，这些选择器根据元素在其父对象中的相对顺序来选择元素。索引是从零开始的，因此\
  \ `:eq(0)` 等同于使用 `first()` 方法。你还可以使用 `:lt()`、`:gt()`、`:even()` 和 `:odd()`。如果你为 `:eq()`、`:lt()`\
  \ 或 `:gt()` 指定负值，则索引从末尾开始计数，而不是从开头。因此，`:eq(-1)` 等同于 `last()`。\n\n### jQuery 对象\n\
  \n务必记住，从 jQuery 选择器返回的对象是 jQuery 对象，而不是像 `HTMLElement` 这样的原生 DOM 对象。原生对象被 jQuery\
  \ 对象包装，并支持我稍后将演示的方法。如果你需要原生对象，请在 jQuery 对象上调用 `get()` 方法。\n```\n\n\n\n"
- '# jQuery DOM 操作方法


  jQuery 对象提供的方法在功能上与本机对象类似，但名称有所不同。你需要留意当前处理的对象类型，因为它们拥有不同的属性和方法集。一种常见做法是，在所有 jQuery
  变量前加上一个“$”字符。不过，这不应与 `$` 命名空间混淆。


  此外，jQuery 选择器返回的是一个对象，而非对象数组。它类似于数组，例如，它具有 `length` 属性和 `first()` 方法，但也具备更多的功能。有关完整列表，请参阅
  [`api.jquery.com/`](http://api.jquery.com/) 上的文章。


  所有 jQuery 方法都返回一个支持元素集合的 jQuery 对象。即使是 `first()` 方法也会返回一个只包含一个元素的 jQuery 对象。`get()`
  方法会从 jQuery 对象中返回原生 DOM 对象；但是，你必须提供索引。例如，要获取一个表示 body 元素的 `HTMLElement` 对象，可以使用以下代码：


  ```

  var body = $("body").get(0);

  ```


  ## 操作 DOM 元素


  jQuery 没有与 `createElement()` 完全等效的函数，不过你可以在调用其他 jQuery 方法时内联创建元素，我稍后会演示这一点。你可以使用
  `createElement()` 创建一个原生对象，然后使用 jQuery 将其添加到文档中。


  要将元素添加到文档中，请使用 `append()` 方法。选择器将决定新元素被添加到哪个（些）元素中。这大致相当于 `appendChild()` 函数。但是，如果选择器返回了多个元素，新元素的一个副本将被添加到每个匹配的元素中。与
  `appendChild()` 方法类似，`append()` 会将新元素作为选定元素的子元素添加，并作为最后一个子元素，置于任何已有元素之后。如果你想将元素插入到现有子元素之前，可以使用
  `prepend()` 方法。


  `append()` 和 `prepend()` 方法都接受多种输入类型。你可以传入一个原生 DOM 对象（例如 `HTMLElement`）或一个包含一个或多个元素的
  jQuery 对象。如果要添加多个元素，你还可以提供多个逗号分隔的参数，或者一个数组参数。也可以指定一个 HTML 字符串。例如，传入 `"<p></p>"`
  会创建一个新的段落元素。HTML 字符串可以包含更复杂的、带有内嵌子元素的 HTML。这类似于设置 `innerHTML` 属性。但是，由 HTML 字符串定义的元素会被追加（或前置）到现有子元素之后，而不是替换它们。


  在使用 `append()` 和 `prepend()` 方法时，选择器决定了目标元素（即元素将要被插入到的位置），而参数指定了要添加的元素。jQuery 还提供了
  `appendTo()` 和 `prependTo()` 方法，它们使用不同的语法实现相同的结果。使用这些方法时，选择器决定了要添加的元素，而参数指定了目标元素。


  `html()` 方法会用传入的 HTML 脚本来替换 `innerHTML` 属性。如果选择器匹配了多个元素，它们都会被更新。如果没有传入参数，它不会更新元素，而是返回现有的
  HTML 字符串，包括所有子元素。如果选择器匹配了多个元素，则只返回第一个元素的 `innerHTML`。


  所有这些方法都将新内容作为子元素添加到指定的父元素中。jQuery 还提供了 `before()` 和 `after()` 方法，它们将内容作为指定目标的兄弟元素添加。`before()`
  方法与 `insertBefore()` 方法类似，区别在于你无需指定父元素。新元素会被插入到目标元素之前，作为其兄弟元素。类似地，`after()` 方法将元素插入到目标元素之后。


  在使用 `before()` 和 `after()` 方法时，选择器决定了新元素应被添加到哪个目标元素旁，而参数指定了要添加的元素。该参数可以是 `append()`
  方法中描述的任何值。jQuery 还提供了 `insertBefore()` 和 `insertAfter()` 方法。它们实现了与 `before()` 和
  `after()` 相同的结果，但语法顺序相反，就像 `appendTo()` 方法一样。选择器决定了要添加的元素，而参数指定了目标元素。


  `wrap()` 方法用于将一个元素作为父对象插入到选择器指定的目标外部。例如，如果你的文档中有一些图片元素，你可以将它们每个都嵌套在一个新的 `div` 元素内。选择器会找到这些图片元素，而参数则指定了被放置到内部的新元素：


  ```

  $("img").wrap("<div class=''image''></div>");

  ```


  相反，`unwrap()` 方法会移除由选择器返回的元素的直接父元素。这将撤销调用 `wrap()` 方法的效果。


  使用 `wrap()` 方法时，每个选中的元素都会被一个新的父元素包裹。`wrapAll()` 方法会将所有选中的元素包裹在单个父元素中。如果匹配元素之间存在不匹配的元素，它们将不会被包含在这个新的父元素内，而是紧跟在它之后。


  `wrapInner()` 方法的工作方式类似于 `wrap()` 方法，不同之处在于它只包裹元素的内容，而不是整个元素。例如，你可以在段落标签的内容周围添加一个
  `strong` 元素。如果原始 HTML 是：


  ```

  <p class="myClass">Hello World</p>

  ```


  你可以像这样调用 `wrapInner()` 方法：


  ```

  $("p").wrapInner("<strong></strong>");

  ```


  生成的 HTML 将是：


  ```

  <p class="myClass"><strong>Hello World</strong></p>

  ```


  可以通过 `remove()` 或 `detach()` 方法从文档中移除元素。使用这两种方法，由选择器返回的元素都会被移除。但是，`detach()` 方法会返回被移除的元素集合，以便稍后可以重新添加它们。当你希望将元素移动到不同位置时，请使用
  `detach()` 方法。`empty()` 方法会移除由选择器返回的元素中的所有子元素。


  你也可以使用 `replaceWith()` 方法替换元素。选择器指定了应被移除的元素。对于每个被移除的元素，传递给该方法的元素会被插入到它的位置。与 `detach()`
  方法一样，它会返回被移除的元素集合。`replaceAll()` 方法的语法顺序是相反的；选择器指定了要添加的元素，而参数标识了要被替换的元素。


  #### 总结


  在本章中，我解释了使用 JavaScript 操作 DOM 元素的方法。有几种方法可用于查找一个或多个元素，具体取决于你执行搜索的方式。最灵活的方法是 `querySelectorAll()`
  方法，它允许你使用任何支持的 CSS 选择器。创建元素后，你需要调用几种方法之一将其插入到文档中。向文档添加元素时，你需要指定父元素。


  你也可以移除元素。有一些方法可用于提取和设置元素的属性。然而，在大多数情况下，你可以简单地将属性作为元素的属性来访问。


  我简要介绍了如何使用 jQuery 操作文档。jQuery 库提供了一种更简单、功能更丰富的 DOM 操作方法。如果你需要访问和修改文档元素，应该考虑使用 jQuery。


  在下一章中，我将向你展示如何使用类似的技术来操作文档元素的样式。


  '
- '# 第十九章：动态样式


  在上一章中，我解释了如何使用 JavaScript 动态更改 HTML 内容。




  '
- "# 使用 JavaScript 实现动态样式\n\n存在一些方法可以创建新的 DOM 元素，以及重新排列或修改现有元素。对于修改这些元素的样式，也存在类似的能力。在本章中，我将介绍四种可以使用\
  \ JavaScript 动态更改样式规则的技术：\n\n- 替换样式表\n- 更改样式规则\n- 修改 CSS 类\n- 调整内联样式\n\n这些场景提供了对文档所应用样式越来越精细的控制，从替换整个样式表开始，到更新单个元素的样式结束。\n\
  \n## 更改样式表\n\n我要介绍的第一种方法是替换整个样式表。例如，如果你想支持多个主题，这种技术会很有用。每个样式表都包含一组规则，为网页呈现特定的外观。然后根据用户偏好、用户输入或其他规则应用特定的样式表。你应该将通用规则放入一个始终使用的独立样式表中。主题元素则放入可以动态应用的独立样式表中。\n\
  \n**提示：** 你可以像上一章所介绍的那样，通过创建一个 `link` 元素来向文档添加新的外部样式表。你也可以创建一个新的 `style` 元素来创建内部样式表。\n\
  \n#### 启用样式表\n\n可用的样式表可以通过 `document.styleSheets` 属性访问。这会返回一个已加载样式表的集合。使用 `link`\
  \ 元素将样式表添加到 HTML 文档后，可以在控制台中查看它，如图 19-1 所示。\n\n```html\n<link rel=\"stylesheet\"\
  \ href=\"Sample.css\" title=\"Shared\" />\n```\n\n© Mark J. Collins 2017  \nM. J.\
  \ Collins, *精通 HTML5、CSS3、JavaScript 与多媒体*, DOI 10.1007/978-1-4842-2463-2_19\n\n\
  ![图 19-1](img/index-367_1.jpg)\n\n**图 19-1.** 查看样式表属性\n\n`stylesheets` 集合的长度为 1，因为只加载了一个样式表。`link`\
  \ 元素包含 `title` 属性，该属性在 `CSSStyleSheet` 对象上是可用的。\n\n该对象上的大多数属性是只读的；但是，你可以更改 `disabled`\
  \ 属性。为了演示这一点，我将在页面上添加一个按钮来切换 `disabled` 属性。以下是完整的 HTML 文档。\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n<title>第 19 章 -\
  \ 动态样式</title>\n<link rel=\"stylesheet\" href=\"Sample.css\" title=\"Shared\" />\n\
  <script src=\"SampleScript.js\" defer></script>\n</head>\n<body>\n<p><strong>你好</strong>\
  \ 世界！</p>\n<button onclick=\"toggleSS()\">切换</button>\n</body>\n</html>\n```\n\n\
  `Sample.css` 文件包含一个使用更大字体的单一样式规则：\n\n```css\np {\n  font-size: xx-large;\n}\n```\n\
  \n`toggleSS()` 函数在 `SampleScript.js` 文件中实现：\n\n```javascript\n\"use strict\";\n\
  function toggleSS() {\n  for (var i = 0; i < document.styleSheets.length; i++ )\
  \ {\n    if (document.styleSheets[i].title == \"Shared\") {\n      document.styleSheets[i].disabled\
  \ = !document.styleSheets[i].disabled;\n      break;\n    }\n  }\n}\n```\n\n这个函数遍历所有样式表，如果\
  \ `title` 是 `\"Shared\"`，则切换 `disabled` 属性。\n\n#### 选择样式表\n\n我们可以应用这种方法来动态选择样式表。文档将加载多个样式表，然后根据用户输入启用其中一个并禁用其他。对于这个示例，我将再使用三个样式表，每个设置不同的颜色。页面将有按钮用于选择颜色，这些按钮会调用一个\
  \ JavaScript 函数来启用/禁用相应的样式表。\n\n新的样式表每个都有一条设置 `color` 属性的规则，像这样：\n\n```css\np {\n\
  \  color: red;\n}\n```\n\n我将通过 `head` 元素内的以下 `link` 元素添加新的样式表。我没有使用 `title` 属性，我将在本章后面解释原因。\n\
  \n```html\n<link rel=\"stylesheet\" href=\"Red.css\" />\n<link rel=\"stylesheet\"\
  \ href=\"Green.css\" />\n<link rel=\"stylesheet\" href=\"Blue.css\" />\n```\n\n\
  我还将添加四个按钮，用于选择相应的样式表。\n\n```html\n<button onclick=\"disableAll()\">黑色</button>\n\
  <button onclick=\"enable('Red')\" style=\"color: red\">红色</button>\n<button onclick=\"\
  enable('Green')\" style=\"color: green\">绿色</button>\n<button onclick=\"enable('Blue')\"\
  \ style=\"color: blue\">蓝色</button>\n```\n\n第一个按钮调用 `disableAll()` 函数，该函数将禁用所有三个样式表。在这种情况下，内容将使用默认的黑色字体。其他按钮调用\
  \ `enable()` 函数，该函数将启用指定的样式表并禁用其他样式表。我们需要将这两个方法添加到 `SampleScript.js` 文件中：\n\n```javascript\n\
  function disableAll() {\n  for (var i = 0; i < document.styleSheets.length; i++\
  \ ) {\n    if (document.styleSheets[i].title != \"Shared\") {\n      document.styleSheets[i].disabled\
  \ = true;\n    }\n  }\n}\n\nfunction enable(color) {\n  for (var i = 0; i < document.styleSheets.length;\
  \ i++ ) {\n    if (document.styleSheets[i].href.includes(color)) {\n      document.styleSheets[i].disabled\
  \ = false;\n    }\n    else if (document.styleSheets[i].title != \"Shared\") {\n\
  \      document.styleSheets[i].disabled = true;\n    }\n  }\n}\n```\n\n为了找到相应的样式表，`enable()`\
  \ 函数使用 `href` 属性并检查指定的颜色是否是 URL 的一部分。这两个函数都会忽略共享样式表。样式表默认都是启用的，因此最后加载的 `Blue.css`\
  \ 会被应用。如果你希望最初使用黑色字体，可以在页面加载时调用 `disableAll()` 函数。\n\n**提示：** IE 不支持 `includes()`\
  \ 方法。有几种简单的 polyfill 可以替代使用。详情请参阅这篇文章：[`stackoverflow.com/questions/31221341/ie-does-not-support-includes-method`](http://stackoverflow.com/questions/31221341/ie-does-not-support-includes-method)。\n\
  \n### 替代样式表\n\n正如我所演示的，你可以使用 JavaScript 启用或禁用样式表。然而，某些浏览器通过使用 *替代样式表* 为这种方法提供了原生支持。这是通过\
  \ `link` 元素的 `rel` 和 `title` 属性来控制的。没有 `title` 属性的元素始终应用于文档。这些被称为*永久*样式表。但是，正如我所展示的，它们可以通过\
  \ JavaScript 禁用。\n\n具有 `title` 属性的样式表链接是动态的，并且可以通过用户操作启用或禁用。如果 `rel` 属性不包含 `alternate`\
  \ 关键字，则该样式被称为*首选*样式；它默认是启用的。你只能有一个首选样式；如果有多个，则只会应用其中一个。首选样式默认启用，但如果选择了替代样式，它们就会被禁用。如果\
  \ `rel` 属性包含 `alternate` 关键字，则该样式被称为*替代*样式。替代样式默认是禁用的。这些规则总结在表 19-1 中。\n\n**表 19-1.**\
  \ 样式表类型\n\n| 类型     | 有标题 | 替代 | 注释                                         |\n\
  |----------|--------|------|------------------------------------------------|\n\
  | 永久     | 否     | 否   | 这些样式表始终应用。                        |\n| 首选     | 是     |\
  \ 否   | 默认应用；如果选择了替代样式则禁用。          |\n| 替代     | 是     | 是   | 默认禁用。          \
  \                          |\n\n![表 19-1 示意图](img/index-370_1.jpg)\n\n根据这些规则，为前面的示例添加样式表的正确方法如下。`Sample.css`\
  \ 始终应用且没有 `title` 属性。`Red.css`、`Green.css` 和 `Blue.css` 是替代样式表；它们有 `title` 属性和 `alternate`\
  \ 关键字。\n\n```html\n<link rel=\"stylesheet\" href=\"Sample.css\" />\n<link rel=\"\
  alternate stylesheet\" href=\"Red.css\" title=\"Red\" />\n<link rel=\"alternate\
  \ stylesheet\" href=\"Green.css\" title=\"Green\" />\n```\n\n\n```html\n<link rel=\"\
  \ **备用** stylesheet\" href=\"Blue.css\" **title=\"Blue\"** /> 在没有 JavaScript 的情况下，这些样式可以通过浏览器选择性启用。例如，在\
  \ Firefox 中，可以从“查看”菜单中选择备用样式，如图 19-2. 所示。\n\n**图 19-2.** 在 Firefox 中选择备用样式表\n\n\
  例如，如果你希望绿色样式默认启用，则移除 `alternate` 关键字，即 `rel=\"stylesheet\"`。当页面加载时，该样式将被启用，但在选择红色或蓝色样式时会被禁用。\n\
  \n■ **注意** Chrome 和 Opera 不支持备用样式表。没有用户界面可以选择备用样式之一。此外，如果有多个 `link` 元素包含 `title`\
  \ 属性，则只有第一个会被启用。其他样式无法被启用，即使使用 JavaScript 也不行。在 JavaScript 示例中，样式表在添加时没有使用 `title`\
  \ 属性，以便在 Chrome 中正常工作。\n\n## 使用 style 元素\n\n在前面的示例中，我使用了通过 `link` 元素引入的外部样式表。你也可以使用嵌入在\
  \ `style` 元素中的内部样式表；这些样式表同样可以通过 `document.styleSheets` 属性访问。当然，它们不会有 `href` 属性，因此你需要通过\
  \ `title` 属性来识别它们。\n\n第 19 章 ■ 动态样式\n\n你可以将包含 `Red.css`、`Green.css` 和 `Blue.css`\
  \ 的 `link` 元素替换为以下 `style` 元素。\n\n```html\n<style title=\"Red\">\np { color: red;}\n\
  </style>\n\n<style title=\"Green\">\np { color: green;}\n</style>\n\n<style title=\"\
  Blue\">\np { color: blue;}\n</style>\n```\n\n在 Firefox 中，用于选择备用样式的相同用户界面同样适用于内部样式表。“查看”菜单会根据\
  \ `style` 元素中的 `title` 属性显示相同的“红色”、“绿色”和“蓝色”选项。\n\n然而，JavaScript 函数将需要查看 `title`\
  \ 属性而不是 `href` 属性。列表 19-1 展示了这些函数的一个实现，该实现根据存在的属性支持两种方式。\n\n**列表 19-1.** 用于备用样式的最终\
  \ JavaScript 代码\n\n```javascript\n\"use strict\";\n\nfunction toggleSS() {\n   \
  \ for (var i = 0; i < document.styleSheets.length; i++ ) {\n        if ((document.styleSheets[i].href\
  \ &&\n            document.styleSheets[i].href.includes(\"Sample\")) ||\n      \
  \      document.styleSheets[i].title == \"Shared\") {\n            document.styleSheets[i].disabled\
  \ = !document.styleSheets[i].disabled;\n            break;\n        }\n    }\n}\n\
  \nfunction disableAll() {\n    for (var i = 0; i < document.styleSheets.length;\
  \ i++ ) {\n        if (!(document.styleSheets[i].href &&\n            document.styleSheets[i].href.includes(\"\
  Sample\")) &&\n            document.styleSheets[i].title != \"Shared\") {\n    \
  \        document.styleSheets[i].disabled = true;\n        }\n    }\n}\n\nfunction\
  \ enable(color) {\n    for (var i = 0; i < document.styleSheets.length; i++ ) {\n\
  \        if ((document.styleSheets[i].href &&\n            document.styleSheets[i].href.includes(color))\
  \ ||\n            document.styleSheets[i].title == color) {\n            document.styleSheets[i].disabled\
  \ = false;\n        }\n        else if (!(document.styleSheets[i].href &&\n    \
  \        document.styleSheets[i].href.includes(\"Sample\")) &&\n            document.styleSheets[i].title\
  \ != \"Shared\") {\n            document.styleSheets[i].disabled = true;\n     \
  \   }\n    }\n}\n\ndisableAll();\n```\n\n■ **注意** 我之前提到的 Chrome 限制同样适用于 `style`\
  \ 元素。由于没有 `href` 属性可以替代 `title`，这在 Chrome 或 Opera 中无法工作。要解决这个问题，你需要使用 `style` 元素的\
  \ `id` 属性，并通过我在上一章中描述的 `getElementById()` 方法来选择它们。\n\n### 修改规则\n\n在上一节中，我演示了如何动态应用整个样式表，即一组预配置的样式规则。你也可以修改现有样式表的规则。如果只需要进行小调整，请使用此选项。\n\
  \n要查看现有规则，请回到 `document.styleSheets` 属性。每个样式表都有一个 `cssRules` 属性，该属性枚举了样式表中包含的规则。这是一个\
  \ `CSSStyleRule` 对象的集合，如图 19-3 所示。\n\n**图 19-3.** 查看样式规则\n\n每个 `CSSStyleRule` 对象都被分配了一个顺序索引。正如我在第\
  \ [2 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_2)中解释的，规则的包含顺序会影响冲突的解决方式。该索引也很重要，因为你需要它来删除规则。\n\
  \n第 19 章 ■ 动态样式\n\n为了进行简单演示，我将添加以下 JavaScript 代码。`newRuleIndex` 变量将存储新添加规则的索引，该规则添加一个细的黑色边框。`toggleRule()`\
  \ 函数要么在 `newRuleIndex` 未设置时添加一条新规则，要么使用该变量来移除规则。\n\n```javascript\nvar newRuleIndex\
  \ = -1;\n\nfunction toggleRule() {\n    if (newRuleIndex == -1) {\n        newRuleIndex\
  \ = document.styleSheets[0].insertRule(\"p {border: 1px solid black;}\", 1)\n  \
  \  }\n    else {\n        document.styleSheets[0].deleteRule(newRuleIndex);\n  \
  \      newRuleIndex = -1;\n    }\n}\n```\n\n这里我采取了一些捷径，只是将规则添加到第一个样式表中。你可能需要先选择要修改的样式表。最后，我们需要在页面上放置一个按钮来调用此函数。\n\
  \n当点击按钮时，边框会被添加，如图 19-4 所示。\n\n```html\n<button onclick=\"toggleRule()\">Border</button>\n\
  ```\n\n**图 19-4.** 添加边框\n\n■ **注意** 这会将一条新规则添加到第一个样式表，即 `Sample.css`。这个样式表也包含更大的字体规则。如果你点击切换按钮，整个样式表将被禁用，这将同时移除更大的字体和边框。即使样式表被禁用，点击“边框”按钮也会修改样式表；只是它不会影响页面，直到样式表被启用。\n\
  \n通过 `insertRule()` 或 `deleteRule()` 方法修改样式表不会影响原始源文档。对于内部样式，这些更改不会影响 HTML 文档，外部样式表的\
  \ CSS 文件也不会受到影响。如果页面被刷新，样式将恢复到其原始状态，直到 JavaScript 重新运行以修改它们。\n\n### 修改类\n\n最后一种场景修改了样式表中的规则，根据更改的不同，可能会影响文档中的多个元素。然而，在许多情况下，你只需要让现有规则在某些情况下应用于特定元素。伪类就是一个很好的例子。像\
  \ `:enabled`、`:selected` 或 `:hover` 这样的伪类允许你在特定动态条件下应用样式规则。然而，这些条件是有限的。\n\n如果没有合适的伪类可用，你可以创建一个使用类选择器的样式规则。然后你可以根据需要，通过\
  \ JavaScript 动态应用相应的类。为了尝试这个，我将首先在 `Sample.css` 文件中添加一个带有类选择器的规则。这将把不透明度设置为 50%。\n\
  \n```css\n.special {\n    opacity: .5;\n}\n```\n\n每个元素都有一个 `classList` 属性，该属性包含已分配给该元素的类列表。它支持四个方法，你可以使用这些方法来操作这个列表：\n\
  \n* `contains()` - 返回一个布尔值，指示类是否存在。\n* `add()` - 添加一个新类。\n* `remove()` - 移除指定的类。\n\
  * `toggle()` - 如果类不存在则添加，如果存在则移除。\n\n以下 JavaScript 函数演示了所有这些方法。它将检查类是否存在，然后添加或移除它。\n\
  \n```javascript\nfunction toggleClass() {\n    var paragraph = document.querySelector(\"\
  p\");\n    if (paragraph) {\n        if (paragraph.classList.contains(\"special\"\
  )) {\n            paragraph.classList.remove(\"special\");\n        }\n        else\
  \ {\n            paragraph.classList.add(\"special\");\n        }\n        // 这也可以通过以下方式完成\n\
  \        //paragraph.classList.toggle(\"special\");\n    }\n}\n```\n\n\n■ **提示**：这完全可以通过简单地调用\
  \ `toggle()` 方法来实现，但我这样实现是为了演示其他方法。\n\n最后，我会添加一个按钮来调用此函数：\n\n```html\n<button onclick=\"\
  toggleClass()\">Opacity</button>\n```\n\n## 第 19 章 ■ 动态样式\n\n每个元素也支持 `className`\
  \ 属性。这是一个字符串，包含以空格分隔的类列表，就像你在标记语言的 class 属性中看到的那样。如果你愿意，可以直接操作这个字符串，但 `classList`\
  \ 属性使用起来更方便。\n\n不过，有一个例外情况是当你想移除所有类时。此时无需枚举 `classList` 属性，只需将 `className` 属性设为空字符串即可：\n\
  \n```javascript\nparagraph.className = \"\";\n```\n\n### 修改内联样式\n\n前面的场景仅影响单个元素。然而，添加或移除一个类可以应用或移除多个样式规则，以及每条规则中的多个声明。在最后一个场景中，我将向你展示如何将内联样式应用于单个元素。通常，应用内联样式是一个坏主意，因为你会失去通过\
  \ CSS 变更调整样式的能力。但有时你确实需要这样做，并且不希望做出可能破坏其他元素的 CSS 修改。\n\n#### 使用 CSSStyleDeclaration\n\
  \n所有 HTML 元素都有 `style` 属性，可以通过 JavaScript 的 `style` 属性访问它。在 JavaScript 中，它由 `CSSStyleDeclaration`\
  \ 对象表示，该对象是名称/值对的集合。可以通过以下方法修改此对象上的样式声明。\n\n- `setProperty()` —— 添加一条声明；接受两个必需参数\
  \ `property` 和 `value`，以及一个可选的 `priority` 参数，可以是空值或 `\"important\"` 关键字。\n- `getPropertyValue()`\
  \ —— 将属性名作为参数传入，并返回对应的值。\n- `getPropertyPriority()` —— 如果指定属性包含 `important` 关键字，则返回\
  \ `\"important\"`。\n- `cssText` —— 返回此样式上的所有声明，格式与 CSS 文档中的相同。\n- `removeProperty()`\
  \ —— 移除指定的属性。\n\n为快速演示，以下解决方案将更新背景颜色。首先，我会添加一个按钮，在单击时调用 `toggleBackground()` 函数：\n\
  \n```html\n<button onclick=\"toggleBackground()\">Background</button>\n```\n\n`toggleBackground()`\
  \ 函数使用 `querySelector()` 方法获取第一个段落元素。\n\n它检查 `style` 属性的 `length` 属性，该属性指示已在此对象上设置了多少条声明。如果为零，则添加\
  \ `background-color` 属性；否则将其移除。\n\n```javascript\nfunction toggleBackground() {\n\
  \  var p = document.querySelector(\"p\");\n  console.log(\"Initial style = \" +\
  \ p.style.cssText);\n  if (p.style.length == 0) {\n    p.style.setProperty(\"background-color\"\
  , \"yellow\", \"important\");\n    console.log(\"Value: \" + p.style.getPropertyValue(\"\
  background-color\"));\n    console.log(\"Priority: \" + p.style.getPropertyPriority(\"\
  background-color\"));\n  } else {\n    p.style.removeProperty(\"background-color\"\
  );\n  }\n  console.log(\"Updated style = \" + p.style.cssText);\n}\n```\n\n这段代码还会向控制台写入一些条目。点击\
  \ Background 按钮后，控制台日志应如图 19-5 所示。\n\n***图 19-5.** 控制台输出*\n\n#### 设置样式属性\n\n`CSSStyleDeclaration`\
  \ 对象为每个 CSS 属性都提供了一个属性，你可以直接获取或设置这些属性。例如：\n\n```javascript\nvar p = document.querySelector(\"\
  p\");\np.style.fontStyle = \"italic\";\np.style.fontSize = \"xx-small\";\nconsole.log(\"\
  Current color is \" + p.style.color);\n```\n\nJavaScript 中属性的名称与 CSS 属性相同，只是所有连字符都被移除，并且下一个单词的首字母改为大写。因此，`font-size`\
  \ 在 JavaScript 中变成了 `fontSize`。\n\n\n\n# JavaScript 样式与事件\n\n## 保留字与属性名称\n\n您还需要注意\
  \ JavaScript 中的保留字，例如 `float`。这类属性名称需要添加 `\"css.\"` 前缀。例如，要设置 `float` 值，请使用 `cssFloat`。\n\
  \n> **提示：** 如我之前所述，`CSSStyleRule` 对象代表一条样式规则。我演示了如何通过指定 CSS 条目来添加新规则。`CSSStyleRule`\
  \ 对象也有一个 `style` 属性，可以通过这些方法进行操作，就像其他样式属性一样。\n\n## 使用 `setAttribute`\n\n设置样式属性的第三种方法是通过\
  \ `setAttribute()` 方法。您可以通过此方法设置任何 HTML 属性的值。它接受两个参数：属性名称和您希望设置的值。例如，可以这样设置 `style`\
  \ 属性：\n\n```javascript\nvar p = document.querySelector(\"p\");\np.setAttribute(\"\
  style\", \"font-style:italic; font-size:xx-small;\");\n```\n\n> **警告：** 当设置特定的样式属性（如\
  \ `style.color`）时，只会影响该属性。但是，使用 `setAttribute()` 方法会用您在第二个参数中提供的内容替换整个现有的内联样式规则。`style`\
  \ 属性的任何现有值都会被覆盖。\n\n### 计算样式\n\n正如我之前解释的，应用于元素的样式来自多种来源，例如外部和内部样式表以及内联样式属性。每个样式规则基于选择器影响元素，并且可能有多个规则适用于特定元素。其中一些规则是动态应用的，例如使用伪类。\n\
  \n然而，在任何给定的时间点，都会有一组固定的样式属性值为元素计算出来。您可以通过调用 `window.getComputedStyle()` 方法并将目标元素传递给它，在\
  \ JavaScript 中获取此信息。例如，如果您在控制台中运行以下代码，您将看到图 19-6 所示的属性及其值：\n\n```javascript\nvar\
  \ p = document.querySelector(\"p\");\nwindow.getComputedStyle(p);\n```\n\n**图 19-6.**\
  \ 显示计算后的样式\n\n> **提示：** 元素的 `style` 属性只会返回内联样式。如果您想查看所有样式表和内联样式的最终效果，请使用 `getComputedStyle()`\
  \ 方法。\n\n#### 总结\n\n在本章中，我解释了在 JavaScript 中调整样式的四种基本方法。这些技术范围从替换整个样式表到修改元素上的单个属性。我还给出了一些这些方法适用的场景示例。您拥有动态配置样式规则的强大能力。然而，第一步是决定您想要实现什么目标，然后选择最适合的方法。\n\
  \n在下一章中，我将演示如何在 JavaScript 中使用事件来实现功能逻辑，以响应用户和系统发起的事件。\n\n---\n\n## 第 20 章：事件\n\n\
  事件是大多数网页不可或缺的一部分：它们允许您在事件发生时采取行动。“事情发生”被称为**事件**，Web 标准中定义了数十种事件。“采取行动”被称为**事件处理程序**，它只是一个简单的\
  \ JavaScript 函数。\n\n### 初始示例\n\n我将从一个简单的示例开始，然后描述各个部分。清单 20-1 显示了一个基本的 HTML 文档。\n\
  \n**清单 20-1.** 初始 HTML 文档\n\n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \  <meta charset=\"utf-8\" />\n  <title>第 20 章 - 事件</title>\n  <link rel=\"stylesheet\"\
  \ href=\"Sample.css\" />\n  <script src=\"SampleScript.js\" defer></script>\n</head>\n\
  <body>\n  <section>\n    <div id=\"div1\">\n      <div id=\"div2\">\n        <p>一些文本</p>\n\
  \        <p>更多文本</p>\n      </div>\n    </div>\n  </section>\n</body>\n</html>\n\
  ```\n\n© Mark J. Collins 2017  \nM. J. Collins, *Pro HTML5 with CSS, JavaScript,\
  \ and Multimedia*, DOI 10.1007/978-1-4842-2463-2_20\n\n该文档在一对嵌套的 `div` 元素中包含两个段落元素。为了帮助可视化这些元素使用的区域，我将为\
  \ `div` 元素添加边框，并为段落元素使用背景色。我还会使用内边距和外边距在它们之间添加一些空间。\n\n```css\ndiv {\n  border:\
  \ 1px solid black;\n  padding: 10px;\n}\n\np {\n  margin: 5px;\n  background-color:\
  \ yellow;\n}\n```\n\n为了设置事件逻辑，事件处理程序是一个名为 `someAction()` 的函数，它只弹出一个警告框。要配置此处理程序，脚本获取内部的\
  \ `div` 元素，然后调用 `addEventListener()` 方法，将处理程序分配给 `click` 事件。`addEventListener()`\
  \ 方法在所有 HTML 元素上都可用，并有两个必需参数：事件的名称和事件发生时将调用的函数的引用。`EventTarget` 对象实现了 `addEventListener()`\
  \ 方法，正如我在第 18 章中解释的，它是所有元素派生的基对象。\n\n```javascript\n\"use strict\";\n\nfunction\
  \ someAction() {\n  alert(\"正在执行某些操作...\");\n}\n\nvar div = document.getElementById(\"\
  div2\");\ndiv.addEventListener(\"click\", someAction);\n```\n\n如果您单击内部 `div` 元素，您将看到如图\
  \ 20-1 所示的警告框。\n\n**图 20-1.** 响应事件\n\n#### 事件注册\n\n事件注册是将三件事联系在一起的過程：将事件链接到特定 DOM\
  \ 元素的事件处理程序。也就是说，1）这个**元素**通过执行 3）这个**处理程序**来响应 2）这个**事件**。`addEventListener()`\
  \ 方法是实现此目的的首选方式。但是，还有其他方法可以做到这一点。\n\n### 内联注册\n\n一种称为*内联*注册的方法是在标记中包含注册信息。例如：\n\n\
  ```html\n<div id=\"div2\" onclick=\"someAction()\">\n```\n\n虽然这种技术已经存在了几十年，并且仍然相当频繁地使用，但应避免使用它。这会将\
  \ JavaScript 代码包含在您的 HTML 文档中，这明显违反了关注点分离原则。\n\n### 传统注册\n\n另一种方法是将事件处理程序分配给 DOM\
  \ 元素的事件属性。每个 DOM 元素对于其支持的每个事件都有一个属性。这些事件属性保存了对相应事件的事件处理程序的引用。例如，`onclick` 属性可以存储一个对事件处理程序的引用，该处理程序将在\
  \ `click` 事件发生时被调用。我们可以像这样重写初始演示：\n\n```javascript\n// div.addEventListener(\"click\"\
  , someAction);\ndiv.onclick = someAction;\n```\n\n这种方法有时被称为*传统*方法，是最安全且最普遍支持的事件注册方法。它自\
  \ Netscape 时代就已存在，并得到 IE4 及更高版本以及所有现代浏览器的支持。\n\n> **警告：** 事件属性（例如 `onclick`）期望一个函数引用。不要在函数名称后添加括号，因为这将导致函数被执行，并且返回值将被注册为事件处理程序。\n\
  \n内联和传统方法的一个问题是，每个元素的每个事件只能有一个事件处理程序。如果您尝试注册第二个事件处理程序，它将替换第一个。例如，如果您有两个 JavaScript\
  \ 库出于各自目的使用不同的事件处理程序，那么使用传统方法时它们无法共存。\n\n### Internet Explorer 的 `attachEvent()`\
  \ 方法\n\n第三种方法仅由 Internet Explorer 支持，使用与 `addEventListener()` 类似的 `attachEvent()`\
  \ 方法。IE 直到版本 9 才支持 `addEventListener()` 方法，因此如果您需要支持 IE8 及更早版本，则需要使用 `attachEvent()`（或传统方法）作为\
  \ polyfill。\n\n\n\n# 提示\n\n**提示：**`addEventListener()` 方法（以及 IE 中的 `attachEvent()`\
  \ 方法）允许你为同一事件分配多个事件处理程序。\n\n### 事件传播\n\n注册事件监听器时，会为特定元素的特定事件分配一个处理函数。前面的示例监听了内部\
  \ `div` 元素上的 `click` 事件。但是，你可以点击 `div` 元素中的任意位置，包括两个段落元素中的任何一个，都会显示警告。之所以有效，是因为事件的传播方式。\n\
  \n段落元素是内部 `div` 内容的一部分，因此点击它们被视为点击了 `div` 是合理的。同样，内部 `div` 是外部 `div` 的一部分，外部 `div`\
  \ 是 `section` 的一部分，以此类推。如果在 `document` 或 `window` 对象上注册事件，会发生什么？正如你所料，点击其任何子元素都会执行事件处理程序。\n\
  \n![](img/index-382_1.png)\n\n## 事件\n\n当事件发生时，例如鼠标点击，它首先被发送到 `window` 对象。然后通过文档层次结构向下传播，直到到达实际被点击的元素，该元素被称为*目标*。最后，它通过相同的对象反向传播回来，直到到达\
  \ `window` 对象。图 20-2 对此进行了说明。\n\n***图 20-2.*** 事件传播\n\n在我们的初始示例中，总共触发了 16 个事件：8\
  \ 个在向下传播途中，8 个在向上返回途中。但是，我们只注册了一个事件处理程序，因此忽略了其中的 15 个。\n\n事件向下传播被称为**捕获阶段**，而沿链向上返回被称为**冒泡阶段**。这个术语可能不是很有帮助，因为气泡倾向于上升到顶部；你可以记住冒泡阶段是向上进行的。\n\
  \n`addEventListener()` 方法支持第三个参数，你可以使用它来指定是监听捕获事件还是冒泡事件。传递 `true` 值以监听捕获事件。省略第三个参数或传递\
  \ `false` 以监听冒泡事件。\n\n为了演示这种行为，我将用代码清单 20-2 中显示的代码替换之前的 JavaScript。\n\n这定义了一对变量来记录捕获或冒泡事件被处理的次数。然后定义了两个事件处理程序，它们简单地递增这些计数器。事件首先在\
  \ `window` 对象上触发，也在 `window` 对象上结束。我将为 `window` 对象使用两个特殊的事件处理程序。`clearCount()` 函数将在捕获事件时被调用，并清除计数器。`reportCounts()`\
  \ 函数将在冒泡事件时被调用，并弹出一个显示计数器值的警告。\n\n![](img/index-383_1.png)\n\n***代码清单 20-2.*** 记录事件计数\n\
  \n```\nvar captureCount = 0;\nvar bubbleCount = 0;\n\nfunction incrementCapture()\
  \ {\n    captureCount++;\n}\n\nfunction incrementBubble() {\n    bubbleCount++;\n\
  }\n\nfunction clearCounts() { // 在 window 捕获时调用\n    captureCount = 1; // 将此事件计入计数\n\
  \    bubbleCount = 0;\n}\n\nfunction reportCounts() { // 在 window 冒泡时调用\n    bubbleCount++;\
  \ // 将此事件计入计数\n    alert(\"捕获: \" + captureCount + \", 冒泡: \" + bubbleCount);\n\
  }\n\nvar elements = document.querySelectorAll(\"*\");\n\nfor (var i = 0; i < elements.length;\
  \ i++ ) {\n    elements[i].addEventListener(\"click\", incrementCapture, true);\n\
  \    elements[i].addEventListener(\"click\", incrementBubble, false);\n}\n\ndocument.addEventListener(\"\
  click\", incrementCapture, true);\ndocument.addEventListener(\"click\", incrementBubble,\
  \ false);\nwindow.addEventListener(\"click\", clearCounts, true);\nwindow.addEventListener(\"\
  click\", reportCounts, false);\n```\n\n为了设置事件处理程序，我使用了在第[18 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_18)中描述的\
  \ `querySelectorAll()` 方法。\n\n这使用了全选选择器（`*`），将返回所有 HTML 元素。这包括 `html` 元素及其所有子元素。它不返回\
  \ `window` 或 `document` 对象，因此我单独添加了这些事件处理程序。\n\n连接好这些事件处理程序后，如果你点击其中一个段落元素，你将看到一个如图\
  \ 20-3 所示的警告。正如我在图 20-2 中所述，当事件在元素层次结构中向下和向上传播时，将处理八个捕获事件和八个冒泡事件。\n\n***图 20-3.***\
  \ 报告事件计数\n\n如果你点击内部 `div`（但不是点击段落元素），则只会处理七个事件。同样，如果你点击外部 `div`，则只会处理六个事件。`section`\
  \ 和 `body` 元素本身不占据任何空间，因此你不能点击它们。如果你点击页面上的任何位置，但不在外部 `div` 元素内，则会处理三个事件。分配给 `window`、`document`\
  \ 和 `html` 对象的事件处理程序将被调用。\n\n**注意：** `addEventListener()` 方法是注册捕获事件的唯一方法。我之前提到的其他技术只能注册冒泡事件。\n\
  \n例如，如果你只需要知道何时点击了一个按钮，那么监听捕获事件还是冒泡事件实际上并不重要。但是，如果你有多个处理程序分配给不同的元素，那么拥有这两个选项会很有用。例如，如果你在父元素和子元素上都有不同的处理程序，那么在使用捕获事件时，父元素的处理程序将首先执行。在监听冒泡事件时，此顺序是相反的。\n\
  \n事件处理程序是串行执行的；当前事件处理程序必须完成，下一个才会被调用。如果你在同一个元素上有多个事件处理程序，它们也会按照注册的顺序串行执行。\n\n##\
  \ 取消注册事件\n\n你可以移除事件处理程序，但根据事件处理程序最初注册的方式，过程会有所不同。如果你使用了 `addEventListener()`（或 `attachEvent()`），则可以为单个元素分配多个事件处理程序。为了移除正确的那个，你需要指定与注册事件处理程序时使用的所有相同信息。\n\
  \n例如，以下代码将移除在前一个示例中设置的处理程序。请注意，参数与注册事件处理程序时使用的完全相同：\n\n```\nfunction removeHandlers()\
  \ {\n    var div = document.getElementById(\"div2\");\n    div.removeEventListener(\"\
  click\", someAction, false);\n}\n```\n\n为了使其正常工作，所有四条信息必须与原始注册详细信息匹配：\n\n-   事件注册所在的元素。\n\
  -   事件类型。\n-   已注册的处理函数。\n-   指示这是在捕获阶段还是冒泡阶段注册的标记。\n\n如果你使用 `attachEvent()` 方法注册了事件处理程序，请使用\
  \ `detachEvent()` 方法将其移除。它的工作方式与 `removeEventListener()` 类似，只是没有捕获/冒泡标记。\n\n其他注册方法不允许有多个事件处理程序，因此移除它们是一个更简单的过程。只需将相应的事件属性设置为\
  \ `null`。例如：\n\n```\ndiv.onclick = null;\n```\n\n![](img/index-385_1.jpg)\n\n###\
  \ 事件接口\n\n当事件发生并且已注册相应的监听器时，将调用分配的事件处理程序。我已经对此进行了一些详细的解释。关于事件处理的另一个非常重要的方面是事件本身。当事件发生时，会创建一个包含事件详细信息的事件对象，并将其传递给事件处理程序。例如，如果点击了鼠标按钮，你可能想知道点击了哪个元素或使用了哪个按钮。\n\
  \n### 常见事件属性\n\n\n\n您的事件处理程序可以通过声明一个函数参数来访问该事件对象。您可以随意命名该参数，但公认的惯例是使用 `e`。例如：\n\n\
  ```javascript\nfunction someAction(e) {\n    ...\n}\n```\n\n存在一个基础的 `Event` 对象，它提供了一些公共属性和方法。然而，还有数十个派生对象，它们根据事件类型提供专门的信息。主要的共享属性如下：\n\
  \n- `type` —— 事件类型；如果您要对多个事件使用单个事件处理程序，这会很有帮助。例如，您可能有一个处理程序来同时响应 `mouseup` 和 `mousedown`\
  \ 事件。\n- `target` —— 触发事件的元素。\n- `currentTarget` —— 注册了事件处理程序的元素。\n\n我将回到最初只有一个事件处理程序的例子。不再创建提示框，而是改为记录事件的某些详细信息。控制台将显示如\
  \ 图 20-4 所示。\n\n```javascript\nfunction someAction(e) {\n    console.log(e.type);\n\
  \    console.log(e.target);\n    console.log(e.currentTarget);\n    // alert(\"\
  Taking some action...\");\n}\n```\n\n**图 20-4.** 在控制台中显示事件详细信息\n\n事件类型为 `click`，符合预期。我点击了第一个段落元素，事件目标确认了这一点。`currentTarget`\
  \ 属性是注册了事件处理程序的内部 `div` 元素。\n\n#### 取消事件\n\n所有事件都有几种通用的方法。这些方法用于修改事件的处理方式。这些方法在事件对象上调用。\n\
  \n- `stopPropagation()`\n- `stopImmediatePropagation()`\n- `preventDefault()`\n\n\
  之前我描述了事件如何从 `window` 对象向下传播到目标，再向上回到 `window` 对象。然而，如果您在事件对象上调用 `stopPropagation()`\
  \ 方法，则不会发生进一步传播。如果您在捕获阶段处理事件并停止传播，则剩余的捕获阶段以及所有冒泡阶段事件都将被抑制。\n\n`stopImmediatePropagation()`\
  \ 方法也会像我刚才描述的那样停止传播，但还会执行一个额外的步骤：它会阻止当前元素上的其他任何处理程序被执行。为了说明这种行为，假设您在内部 `div` 元素（来自前面的示例）上注册了三个事件处理程序，都用于冒泡阶段的\
  \ `click` 事件。当事件最终传播到该 `div` 元素时，这三个事件处理程序将按照它们注册的顺序依次执行。如果第一个事件处理程序调用了 `stopImmediatePropagation()`\
  \ 方法，则其他两个处理程序将不会被调用。但是，如果改为调用 `stopPropagation()` 方法，则其他两个事件处理程序仍会执行。然而，在这两种情况下，事件都不会进一步传播到其他元素。\n\
  \n浏览器会对某些事件执行默认操作。例如，如果您点击一个链接，浏览器会导航到该 URL；或者如果您右键点击某些元素，会出现一个上下文菜单。然而，您的自定义事件会在浏览器执行默认操作之前执行。如果您想禁用默认操作，事件处理程序可以调用事件对象上的\
  \ `preventDefault()` 方法。例如，如果您想在特定情况下阻止链接跳转，可以设置一个自定义处理程序来响应 `click` 事件。然后，如果不应该使用该链接，自定义处理程序就可以调用\
  \ `preventDefault()`。\n\n### 探索事件\n\n现在您已经了解了事件处理的基础知识，可以使用任何受支持的事件了。它们的工作方式都相同。每个事件之间的区别归结为两点：\n\
  \n- **事件何时被触发？** 我在本章的所有示例中都使用了 `click` 事件。它是在鼠标按钮被点击时触发的。所有其他事件都是在特定条件下触发的，例如按下按键、调整窗口大小、网络访问丢失等。\n\
  \n\n\n• **提供了哪些事件详情？** 所有事件处理程序都会收到一个事件对象，我已经解释了一些常见的属性和方法。大多数事件会在事件对象中提供额外的细节；这些细节会根据事件的不同而变化。例如，`keypress`\
  \ 事件的事件对象应指明按下了哪个键。\n\n我不打算在此列出所有可用事件；有数百个之多。不过，Mozilla 的这篇文章提供了一个相当不错的概述，将事件分类整理，并附有更多详细信息的链接：[`developer.mozilla.org/en-US/docs/Web/Events`](https://developer.mozilla.org/en-US/docs/Web/Events)\n\
  \n第 20 章 ■ 事件\n\n每个事件都会提供一个特定的事件对象，尽管相关事件通常会使用相同的接口。例如，大多数鼠标事件（如 `click`、`dblclick`\
  \ 和 `mousedown`）都提供了 `MouseEvent` 接口。事件接口存在一个层次结构。`MouseEvent` 派生自 `UIEvent`，而 `UIEvent`\
  \ 又派生自 `Event`。\n\n■ **提示** 你也可以创建自己的自定义事件。这超出了本书的范围，但如果你感兴趣，可以查看这篇文章：[`developer.mozilla.org/en-US/docs/Web/Guide/Events/Creating_and_triggering_events`](https://developer.mozilla.org/en-US/docs/Web/Guide/Events/Creating_and_triggering_events)\n\
  \n### 摘要\n\n在本章中，我演示了如何使用事件处理程序来响应用户输入或系统触发的事件。你需要注册一个事件处理程序，它将三个要素联系在一起：\n- 事件\n\
  - 事件处理程序\n- DOM 元素\n\n当指定元素触发了指定事件时，已注册的处理程序就会被执行。\n\n推荐的事件处理程序注册方法是使用 `addEventListener()`\
  \ 方法。虽然也支持其他旧式方法，但它们并不包含 `addEventListener()` 的全部功能。\n\n当事件发生在某个元素（称为目标）上时，该事件会在\
  \ DOM 层次结构中的所有对象上被触发。事件从 `window` 对象开始，在捕获阶段向下冒泡至目标元素。然后，它再沿该链向上冒泡，直到再次到达 `window`\
  \ 对象。\n\n在本书的下一部分中，我将提供一些示例解决方案，演示 HTML5 的一些高级功能。我们将从自定义音频和视频元素的嵌入开始。\n\n# 第 V 部分\n\
  \n# 高级应用\n\n本部分与本书其他部分不同，实践性更强一些。每章都通过一系列练习，一步步引导你完成一个解决方案。其中一些练习需要你从 [www.apress.com](http://www.apress.com/)\
  \ 提供的源代码下载中获取一些文件。有些图片和媒体文件无法包含在正文中。此外，还有一些大型代码块，手动输入既繁琐又耗时，我提供这些代码是为了节省你的时间。\n\n\
  对于每个项目，你可以边阅读文本边自己编写代码，也可以直接从下载中打开最终的解决方案，并在书中同步跟进。如果选择后者，请花几分钟时间确保你理解代码的功能。\n\n\
  你将创建的解决方案如下：\n- 21) 创建自定义音频和视频控件。\n- 22) 使用可缩放矢量图形 (SVG) 构建一个美国交互式地图。\n- 23) 使用\
  \ `canvas` 模拟国际象棋游戏。你还会使用 `canvas` 创建一个简单的太阳系模型，并演示合成。\n- 24) 使用拖放 (DnD) API 实现西洋跳棋游戏。\n\
  - 25) 使用 `IndexedDB` 重写国际象棋模拟程序，将每一步棋和每个棋子的状态存储在客户端数据库中。\n- 26) 使用 `Geolocation`\
  \ 查找当前位置，并结合使用必应地图 API 和标注点在地图上进行标记，以识别相关位置。\n\n# 第 21 章\n\n# 音频与视频\n\n在第 7 章中，我介绍了\
  \ `audio` 和 `video` 元素，并演示了如何使用浏览器提供的原生控件将它们嵌入到你的 HTML 文档中。在本章中，你将使用自己的控件，这些控件通过\
  \ JavaScript 连接到 `audio` 和 `video` 元素。所有 DOM 元素和事件在 JavaScript 中都是可用的，因此创建与 `audio`\
  \ 或 `video` 元素配合使用的自定义控件是一个相当直接的过程。然而，你需要控制多个方面，所以这并非一项简单的任务。\n\n### 概述\n\n你需要处理三个方面：\n\
  - 播放/暂停\n- 显示进度及快进/快退\n- 调节音量/静音\n\n我将从为音频创建自定义控件开始，但你会看到，视频的处理过程本质上是相同的。你需要同时响应来自\
  \ UI 控件和 `audio` 元素的事件。你将从在页面中添加所有必要的控件开始。然后，我将向你展示如何实现每个方面所需的事件处理程序。你将用于控制 `audio`\
  \ 元素的输入元素如下：\n- 播放/暂停按钮：其标签将根据 `audio` 元素的状态在“播放”和“暂停”之间切换。\n- 进度条：这是一个范围控件（在第 8\
  \ 章中介绍），它既可以显示进度，也允许用户跳转到特定位置。\n- 时长：这是一个 `span` 元素，用于显示音频文件的当前位置和总时长。\n- 静音按钮：其标签将在“静音”和“取消静音”之间切换。\n\
  - 音量：这是另一个范围控件，用于指定音量级别。\n\n你将为之提供处理程序的音频事件包括：\n- `play`：音频开始时触发\n- `pause`：音频暂停时触发\n\
  - `ended`：音频播放完成时触发\n- `timeupdate`：随着音频剪辑的播放定期触发\n- `durationchange`：时长发生变化时触发，这发生在文件加载时\n\
  - `volumechange`：音量级别改变或 `mute` 属性发生变化时触发\n\n### 自定义音频控件\n\n你将从创建一个包含 `audio` 元素的\
  \ HTML 文档开始。然后，你将添加用于控制音频的输入元素。\n\n**练习 21-1. 创建标记**\n\n1.  创建一个包含单个 `audio` 元素的\
  \ HTML 文档。你需要提供自己的音频文件，因此 `src` 属性将与这里显示的不同。此元素还包含 `controls` 属性，因此将使用原生控件，但稍后你会移除它。该页面在\
  \ Chrome 中的效果将如图 21-1 所示。\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
  \    <meta charset=\"utf-8\" />\n    <title>第 21 章 - 音频与视频</title>\n    <link rel=\"\
  stylesheet\" href=\"Sample.css\" />\n    <script src=\"SampleScript.js\" defer></script>\n\
  </head>\n<body>\n    <audio id=\"audio\" src=\"Media/Linus and Lucy.mp3\" controls\
  \ >\n        <p>您的浏览器不支持 HTML5 音频</p>\n    </audio>\n</body>\n</html>\n```\n\n***图\
  \ 21-1.** 初始的音频元素*\n\n2.  现在，你将移除 `audio` 元素中的 `controls` 属性，并按如下所示添加你自己的控件。新的控件是标准的输入元素，并位于一个单独的\
  \ `div` 元素中。\n\n```\n<div id=\"audioControls\">\n    <input type=\"button\" value=\"\
  播放\" id=\"play\" />\n    <input type=\"range\" id=\"audioSeek\" />\n    <span id=\"\
  duration\"></span>\n    <input type=\"button\" id=\"mute\" value=\"静音\" />\n   \
  \ <input type=\"range\" id=\"volume\" min=\"0\" max=\"1\" step=\"any\" />\n</div>\n\
  ```\n\n\n\n# 音频与视频控制\n\n有两个范围控件：第一个控件会在播放音频片段时显示进度。用户也可以使用它来快退或快进到文件中的新位置。`min`\
  \ 和 `max` 属性将根据音频文件的长度在 JavaScript 中设置。第二个范围控件用于调节音量。其 `min` 和 `max` 属性分别设置为 0 和\
  \ 1。音量为 1 表示 100%，实际值应介于 0 到 1 之间。\n\n还有两个按钮：第一个按钮同时充当播放和暂停按钮。其标签会根据音频元素的当前状态而变化。第二个按钮用于切换静音标志。同样，其标签会根据音频当前是否静音而改变。在这些控件中间有一个\
  \ `span` 元素，初始时不包含任何内容。它将显示文件长度和当前播放位置。\n\n#### 支持播放与暂停\n\n页面上的所有元素就绪后，就可以开始编写一些\
  \ JavaScript 了。第一个练习将连接播放按钮并执行范围控件的初始配置。\n\n**练习 21-2：支持播放与暂停**\n\n1. 创建一个名为 `SampleScript.js`\
  \ 的新 JavaScript 文件。由于音频元素会在多处被引用，因此需要声明一个变量来存储它。这样每次使用时就不必在 DOM 中搜索了。\n\n    ```\n\
  \    \"use strict\";\n    var audio = document.getElementById(\"audio\");\n    ```\n\
  \n2. 你需要一个事件处理程序来设置初始时长值。`setupSeek()` 方法会响应音频元素上的 `durationchange` 事件。当页面首次加载时，在文件打开并加载元数据之前，系统并不知道音频片段的时长。一旦元数据加载完成，即可确定时长，并触发该事件。`duration`\
  \ 属性以秒为单位。`setupSeek()` 函数使用 `duration` 属性设置 `audioSeek` 范围控件的 `max` 属性，还用于设置 `span`\
  \ 元素的初始值。注意这里调用了 `Math.round()` 函数，将值四舍五入到最接近的整数（秒）。\n\n    ```\n    function setupSeek()\
  \ {\n        var seek = document.getElementById(\"audioSeek\");\n        seek.min\
  \ = 0;\n        seek.max = Math.round(audio.duration);\n        seek.value = 0;\n\
  \        var duration = document.getElementById(\"duration\");\n        duration.innerHTML\
  \ = \"0/\" + Math.round(audio.duration);\n    }\n    ```\n\n3. 当用户点击播放按钮时，会调用 `togglePlay()`\
  \ 方法。如果音频元素的当前状态为 `paused` 或 `ended`，则调用 `play()` 函数。否则，调用 `pause()` 方法。\n\n   \
  \ ```\n    function togglePlay() {\n        if (audio.paused || audio.ended) {\n\
  \            audio.play();\n        }\n        else {\n            audio.pause();\n\
  \        }\n    }\n    ```\n\n4. `updatePlayPause()` 方法在音频元素上注册了 `play` 和 `pause`\
  \ 事件。它通过设置播放按钮的标签来反映音频元素的状态。如果音频当前正在播放，则文本更改为“暂停”，因为点击按钮将产生暂停效果。否则，文本设置为“播放”。\n\n\
  \    ```\n    function updatePlayPause() {\n        var play = document.getElementById(\"\
  play\");\n        if (audio.paused || audio.ended) {\n            play.value = \"\
  Play\";\n        }\n        else {\n            play.value = \"Pause\";\n      \
  \  }\n    }\n    ```\n\n> **提示**：`togglePlay()` 函数响应播放按钮的点击，而 `updatePlayPause()`\
  \ 函数响应音频元素的启动或暂停。当按钮被点击时，`togglePlay()` 方法会改变音频元素的状态。这种状态变化会触发 `play` 或 `pause`\
  \ 事件，这些事件均由 `updatePlayPause()` 函数处理。之所以这样设计，是因为音频可能通过点击播放按钮之外的其他方式被播放或暂停。例如，如果你保留了\
  \ `controls` 属性，那么原生控件和自定义控件会同时存在。响应 `play` 和 `pause` 事件可确保无论音频元素如何操作，按钮标签始终正确。\n\
  \n\n\n5. 最后，`endAudio()`函数被注册到`audio`元素，以响应`ended`事件——当音频播放完毕时会触发该事件。这会执行一些同步操作，包括设置按钮标签以及初始化范围控件和跨度控件。\n\
  \n```javascript\nfunction endAudio() {\n    document.getElementById(\"play\").value\
  \ = \"Play\";\n    document.getElementById(\"audioSeek\").value = 0;\n    document.getElementById(\"\
  duration\").innerHTML = \"0/\" + Math.round(audio.duration);\n}\n```\n\n6. 现在，你需要使用以下代码注册事件处理程序：\n\
  \n```javascript\n// 连接事件处理程序\naudio.addEventListener(\"durationchange\", setupSeek,\
  \ false);\ndocument.getElementById(\"play\").addEventListener(\"click\", togglePlay,\
  \ false);\naudio.addEventListener(\"play\", updatePlayPause, false);\naudio.addEventListener(\"\
  pause\", updatePlayPause, false);\naudio.addEventListener(\"ended\", endAudio, false);\n\
  ```\n\n## 支持进度与搜索\n\n我们希望能够使用滑块跳转到音频文件中的不同位置。接下来的练习将配置此功能，使其既能报告当前位置，也能更改位置。\n\n\
  ### 练习 21-3：进度与搜索\n\n1. 与播放按钮类似，有一个事件处理函数`seekAudio()`，它响应对应`input`元素；以及另一个单独的事件处理函数`updateSeek()`，它响应对应`audio`元素。`seekAudio()`函数在用户移动范围控件上的滑块时被调用。它只是使用范围控件选定的值来设置`currentTime`属性。\n\
  \n```javascript\nfunction seekAudio() {\n    var seek = document.getElementById(\"\
  audioSeek\");\n    audio.currentTime = seek.value;\n}\n```\n\n2. `updateSeek()`函数在`audio`元素触发`ontimeupdate`事件时被调用。它会更新范围控件，以反映文件内的当前位置。它还会更新跨度控件，以显示实际位置（以秒为单位）。同样，这里将`currentTime`属性四舍五入为最接近的整数。\n\
  \n```javascript\nfunction updateSeek() {\n    var seek = document.getElementById(\"\
  audioSeek\");\n    seek.value = Math.round(audio.currentTime);\n    var duration\
  \ = document.getElementById(\"duration\");\n    duration.innerHTML = Math.round(audio.currentTime)\
  \ + \"/\" + Math.round(audio.duration);\n}\n```\n\n3. 现在，你需要使用以下代码注册事件处理程序：\n\n\
  ```javascript\ndocument.getElementById(\"audioSeek\").addEventListener(\"change\"\
  , seekAudio, false);\naudio.addEventListener(\"timeupdate\", updateSeek, false);\n\
  ```\n\n#### 控制音量\n\n本练习将设置用于调整音量的控件，包括静音按钮。\n\n### 练习 21-4：控制音量\n\n1. 顾名思义，`toggleMute()`函数用于切换`audio`元素的`muted`属性。当该属性改变时，`audio`元素会触发`volumechange`事件。\n\
  \n```javascript\nfunction toggleMute() {\n    audio.muted = !audio.muted;\n}\n```\n\
  \n2. `updateMute()`函数响应`volumechange`事件，并根据`muted`属性的当前值设置按钮标签。再次强调，以这种方式操作可以确保按钮标签正确无误。\n\
  \n```javascript\nfunction updateMute() {\n    var mute = document.getElementById(\"\
  mute\");\n    if (audio.muted) {\n        mute.value = \"Unmute\";\n    } else {\n\
  \        mute.value = \"Mute\";\n    }\n}\n```\n\n3. 最后，当用户移动第二个范围控件上的滑块时，会调用`setVolume()`函数。它会将`audio`元素的`volume`属性设置为范围控件上选定的值。\n\
  \n```javascript\nfunction setVolume() {\n    var volume = document.getElementById(\"\
  volume\");\n    audio.volume = volume.value;\n}\n```\n\n![图片](img/index-395_1.jpg)\n\
  \n4. 按如下方式注册事件处理程序：\n\n```javascript\ndocument.getElementById(\"mute\").addEventListener(\"\
  click\", toggleMute, false);\naudio.addEventListener(\"volumechange\", updateMute,\
  \ false);\ndocument.getElementById(\"volume\").addEventListener(\"change\", setVolume,\
  \ false);\n```\n\n> **注意**：`volume`属性的值介于 0 和 1 之间。你可以将其视为 0% 到 100%。\n\n\n\n`percent`。当定义范围控件时，`min`\
  \ 属性被设置为 `0`，`max` 被设置为 `1`，因此比例是正确的。您只需使用范围值即可设置 `volume` 属性。如果要显示 `volume` 属性的实际值，只需将其转换为百分比即可。\n\
  \n#### 调整样式\n\n现在，您可以尝试使用自定义控件了。保存更改并浏览到您的页面。页面应类似于图 21-2。\n\n***图 21-2.*** 自定义音频控件*\n\
  \n此处的样式非常单调；一点点 CSS 就有帮助。添加以下 CSS 规则来更改按钮和范围控件的大小。结果如图 21-3 所示。\n\n```\ninput[type=\"\
  button\"] {\n  width: 75px;\n  background-color: lightblue;\n  border-radius: 5px;\n\
  }\n\n#audioSeek {\n  width: 300px;\n}\n\n#volume {\n  width: 50px;\n}\n```\n\n![](img/index-396_1.jpg)\n\
  \n***图 21-3.*** 样式控件*\n\n> **提示：** 更改范围控件的样式是可能的，但需要使用供应商前缀，并且每个浏览器都不同。如果您感兴趣，这里有一篇包含详细信息的文章：[`brennaobrien.com/blog/2014/05/style-input-type-range-in-every-browser.html`](http://brennaobrien.com/blog/2014/05/style-input-type-range-in-every-browser.html)\n\
  \n### 更改音频源\n\n在此示例中，音频源是在标记中定义的。但是，您可以使用 JavaScript 轻松控制它。如果您像最初那样使用单个 `src` 属性，则只需更改此属性以引用不同的文件。但是，如果您使用多个\
  \ `source` 元素，则需要更新所有这些元素，然后调用 `load()` 方法。\n\n**练习 21-5. 更改音频源**\n\n1.  要尝试此操作，请添加一个按钮，将源更改为第二个音频剪辑并播放该剪辑。以下是将新按钮添加到页面的标记：\n\
  \n```\n<div>\n  <input type=\"button\" value=\"Track2\" id=\"track2\" />\n</div>\n\
  ```\n\n2.  添加以下事件处理程序，该处理程序将在单击按钮时执行。\n\n```\nfunction nextFile() {\n  audio.src\
  \ = \"Media/Sample.mp3\";\n  //audio.load(); needed if there are multiple sources\n\
  \  audio.play();\n}\n```\n\n3.  向“下一个”按钮注册事件处理程序。\n\n```\ndocument.getElementById(\"\
  track2\").addEventListener(\"click\",\n  nextFile, false);\n```\n\n> **注意：** 我在[第\
  \ 7 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_7)中解释了如何设置多个源。这在过去需要两个或更多音频文件来支持多个浏览器时非常重要。现在所有主流浏览器都支持单个\
  \ MP3 文件。如果有多个源，则需要更新所有源，然后调用 `load()` 方法。如果您使用单个源，则无需调用 `load()`。\n\n### 自定义视频控件\n\
  \n创建自定义视频控件与音频控件相同。您需要提供播放和暂停视频、调节音量以及跳转到文件中特定位置的功能。我将添加[第 7 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_7)中的相同视频元素。\n\
  \n```\n<video src=\"Media/BigBuckBunny.mp4\" id=\"video\"\n  poster=\"Media/BBB_Poster.png\"\
  \ width=\"852\" height=\"480\">\n  <p> HTML5 video is not supported on your browser</p>\n\
  </video>\n```\n\n由于实现与音频控件几乎相同，因此 JavaScript 完整地显示在清单 21-1 中。这些函数与其对应的音频函数等效。\n\n\
  ***清单 21-1.*** 实现自定义视频控件*\n\n```\nvar video = document.getElementById(\"video\"\
  );\n\nfunction setupSeekVideo() {\n  var seek = document.getElementById(\"videoSeek\"\
  );\n  seek.min = 0;\n  seek.max = Math.round(video.duration);\n  seek.value = 0;\n\
  \  var duration = document.getElementById(\"durationVideo\");\n  duration.innerHTML\
  \ = \"0/\" + Math.round(video.duration);\n}\n\nfunction togglePlayVideo() {\n  if\
  \ (video.paused || video.ended) {\n    video.play();\n  }\n  else {\n    video.pause();\n\
  \  }\n}\n\nfunction updatePlayPauseVideo() {\n  var play = document.getElementById(\"\
  playVideo\");\n  if (video.paused || video.ended) {\n    play.value = \"Play\";\n\
  \  }\n  else {\n    play.value = \"Pause\";\n  }\n}\n\nfunction endVideo() {\n \
  \ document.getElementById(\"playVideo\").value = \"Play\";\n  document.getElementById(\"\
  videoSeek\").value = 0;\n  document.getElementById(\"durationVideo\").innerHTML\
  \ = \"0/\" + Math.round(video.duration);\n}\n\n// Wire-up the event handlers\nvideo.addEventListener(\"\
  durationchange\", setupSeekVideo, false);\ndocument.getElementById(\"playVideo\"\
  ).addEventListener(\"click\", togglePlayVideo, false);\nvideo.addEventListener(\"\
  play\", updatePlayPauseVideo, false);\nvideo.addEventListener(\"pause\", updatePlayPauseVideo,\
  \ false);\nvideo.addEventListener(\"ended\", endVideo, false);\n\n// Support progress\
  \ and seek\nfunction seekVideo() {\n  var seek = document.getElementById(\"videoSeek\"\
  );\n  video.currentTime = seek.value;\n}\n\nfunction updateSeekVideo() {\n  var\
  \ seek = document.getElementById(\"videoSeek\");\n  seek.value = Math.round(video.currentTime);\n\
  \  var duration = document.getElementById(\"durationVideo\");\n  duration.innerHTML\
  \ = Math.round(video.currentTime) + \"/\" + Math.round(video.duration);\n}\n\ndocument.getElementById(\"\
  videoSeek\").addEventListener(\"change\", seekVideo, false);\nvideo.addEventListener(\"\
  timeupdate\", updateSeekVideo, false);\n\n// Support volume and mute\nfunction toggleMuteVideo()\
  \ {\n  video.muted = !video.muted;\n}\n\nfunction updateMuteVideo() {\n  var mute\
  \ = document.getElementById(\"muteVideo\");\n  if (video.muted) {\n    mute.value\
  \ = \"Unmute\";\n  }\n  else {\n    mute.value = \"Mute\";\n  }\n}\n\nfunction setVolumeVideo()\
  \ {\n  var volume = document.getElementById(\"volumeVideo\");\n  video.volume =\
  \ volume.value;\n}\n\ndocument.getElementById(\"muteVideo\").addEventListener(\"\
  click\", toggleMuteVideo, false);\nvideo.addEventListener(\"volumechange\", updateMuteVideo,\
  \ false);\ndocument.getElementById(\"volumeVideo\").addEventListener(\"change\"\
  , setVolumeVideo, false);\n```\n\n> **注意：** `audio` 和 `video` 元素在 JavaScript 中分别由\
  \ `HTMLAudioElement` 和 `HTMLVideoElement` 对象表示。这两者都派生自 `HTMLMediaElement`。\n\n####\
  \ 总结\n\n在上一章中，我解释了如何在 JavaScript 中使用事件。从本章的示例中，您可以看到事件的重要性。无论是响应用户操作还是系统通知，所有逻辑都是在事件处理程序中实现的。在本章中，事件处理程序主要用于将\
  \ UI 元素与它们正在控制的音频或视频元素同步。\n\n音频或视频的当前状态可通过 `duration`、`currentTime` 和 `volume` 等属性获取。其中一些属性（包括\
  \ `currentTime` 和 `volume`）也可以设置，允许您根据用户输入进行调整。要创建自己的自定义控件，您只需连接必要的事件处理程序，以便音频或视频状态的变化反映在\
  \ UI 元素中，反之亦然。\n\n在下一章中，您将使用可缩放矢量图形 (SVG) 来创建一些令人印象深刻的图形应用程序。SVG 是一种在不损失图像质量的情况下按比例缩放图形的技术。SVG\
  \ 的一个非常有用的特性是绘图元素可以使用 CSS 设置样式。\n\n## 第 22 章\n# 可缩放矢量图形\n\n在本章中，我将向您展示如何在 HTML5\
  \ Web 应用程序中使用可缩放矢量图形 (SVG)。\n\n使用 SVG 可以实现许多非常酷的功能。我挑选了一个有趣的演示，可以轻松应用于许多业务应用程序。但首先，让我向您介绍一下什么是\
  \ SVG。\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您提供的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n# 矢量图形与 SVG\
  \ 基础\n\n大多数人认为图形元素是某种形式的位图，具有像素的行和列阵列，每个像素被分配特定的颜色。然而，相比之下，矢量图形将图像表达为公式的集合。例如，绘制一个圆心在点`x,y`且半径为`r`的圆。更复杂的图像被定义为图形元素的集合，包括圆、线和路径。虽然渲染引擎最终会确定需要设置的特定像素，但图像定义是基于公式的。这一根本性差异为使用矢量图形提供了两个显著优势。\n\
  \n首先，顾名思义，矢量图形是可缩放的。如果你想扩大图像的尺寸，渲染引擎只需根据新尺寸重新计算公式，并且不会损失清晰度。如果你放大位图图像，你会很快开始看到颗粒感，图像变得模糊。\n\
  \n其次，图像中的每个元素都可以独立操作。例如，如果图像中有多个圆，你可以通过简单地改变那个圆的颜色来突出显示它。由于矢量图形基于公式，你可以轻松调整公式以修改图像。特别有用的是，这些元素可以使用`CSS`进行样式化，利用我前几章向你展示的强大选择器和格式化能力。\n\
  \n## 介绍 SVG\n\n你将首先创建一个使用简单几何形状绘制图片的页面。然后，你将使用`CSS`为这些形状应用样式。我将向你展示如何将这些标记元素保存到`.svg`图像文件中。这个图像文件可以像其他图像文件（如`.jpg`和`.png`文件）一样使用。\n\
  \n### 添加一些简单形状\n\n为了演示`svg`元素如何工作，你将添加一些简单形状，如圆形、矩形和线条。大多数图像可以表示为几何形状的集合，我将在此演示这一点。\n\
  \n© Mark J. Collins 2017\n\nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and\
  \ Multimedia*, DOI 10.1007/978-1-4842-2463-2_22\n\n第 22 章 ■ 可缩放矢量图形\n\n**练习 22-1\
  \ 搭建一个雪人**\n\n1. 在`HTML`文档的`body`中插入以下`svg`元素：\n\n```\n<svg version=\"1.1\"\n  width=\"\
  100px\" height=\"230px\"\n>\n</svg>\n```\n\n> **注意** `width`和`height`属性定义了元素的固有尺寸。在大多数浏览器中，如果未指定`width`和`height`，图像将被裁剪为某个默认大小。\n\
  \n2. 在`svg`元素内部，添加以下元素。这些只是简单的形状，主要是`circle`元素，以及一个`rect`、`line`和`polygon`。\n\n\
  ```\n<circle class=\"body\" cx=\"50\" cy=\"171\" r=\"40\" />\n<circle class=\"body\"\
  \ cx=\"50\" cy=\"103\" r=\"30\" />\n<circle class=\"body\" cx=\"50\" cy=\"50\" r=\"\
  25\" />\n<line class=\"hat\" x1=\"30\" y1=\"25\" x2=\"70\" y2=\"25\" />\n<rect class=\"\
  hat\" x=\"40\" y=\"10\" width=\"20\" height=\"15\" />\n<circle class=\"button\"\
  \ cx=\"50\" cy=\"82\" r=\"4\" />\n<circle class=\"button\" cx=\"50\" cy=\"100\"\
  \ r=\"4\" />\n<circle class=\"button\" cx=\"50\" cy=\"118\" r=\"4\" />\n<circle\
  \ class=\"eye\" cx=\"42\" cy=\"42\" r=\"4\" />\n<circle class=\"eye\" cx=\"58\"\
  \ cy=\"42\" r=\"4\" />\n<polygon class=\"nose\" points=\"45,60 45,50 60,55\" />\n\
  ```\n\n一个`circle`表示为圆心点`cx`和`cy`以及半径`r`。一条`line`指定为起点`x1`和`y1`以及终点`x2`和`y2`。一个`rect`元素由左上角位置`x`和`y`、`width`以及`height`描述。一个`polygon`由一组点定义，形式为`x1,y1\
  \ x2,y2 x3,y3`，你可以指定任意数量的点。它通过绘制每条线段来渲染，并绘制从最后一个点回到第一个点的线段。\n\n3. 保存更改并在浏览器中查看网页。页面应如图\
  \ 22-1 所示。\n\n![](img/index-402_1.jpg)\n\n第 22 章 ■ 可缩放矢量图形\n\n***图 22-1.** 未设置样式的初始\
  \ SVG 图像*\n\n### 添加样式\n\n这些元素的默认样式是纯黑色填充，因为其中一些形状彼此重叠，所以有几个当前不可见。请注意，你为每个元素分配了一个`class`属性。现在，你将使用类选择器为这些元素应用样式。\n\
  \n1. 将以下规则添加到`CSS`文件中。保存这些更改并刷新浏览器以查看更新的网页，其外观应如图 22-2 所示。\n\n```\n.body {\n  fill:\
  \ white;\n  stroke: gray;\n  stroke-width: 1px;\n}\n.hat {\n  fill: black;\n  stroke:\
  \ black;\n  stroke-width: 3px;\n}\n.button {\n  fill: black;\n}\n.eye {\n  fill:\
  \ black;\n}\n.nose {\n  fill: orange;\n}\n```\n\n![](img/index-403_1.jpg)\n\n第 22\
  \ 章 ■ 可缩放矢量图形\n\n***图 22-2.** 应用样式后的 SVG 图像*\n\n### 使用 SVG 图像文件\n\n除了嵌入`svg`元素，你还可以将其保存为具有`.svg`扩展名的独立图像文件。此文件可以像其他图形图像一样使用。我将向你展示如何创建独立的`SVG`图像，然后在页面上使用它。\n\
  \n#### 创建 SVG 图像\n\n我将首先向你展示如何创建一个独立的`.svg`文件；稍后你将把它用作背景图像。这也将演示`SVG`图像的可缩放性。\n\n\
  **练习 22-2 创建 SVG 图像**\n\n1. 在 Web 应用程序中创建一个名为`snowman.svg`的新文件。\n\n2. 输入以下标记指令：\n\
  \n```\n<?xml version=\"1.0\" standalone=\"no\"?>\n<!DOCTYPE svg PUBLIC \"-//W3C//DTD\
  \ SVG 1.1//EN\"\n  \"http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd\">\n```\n\n\
  3. 复制并粘贴之前`HTML`文档中的整个`svg`元素。\n\n4. 你需要与`svg`元素在同一个文件中包含样式规则。为此，请在`svg`元素内部添加一个`style`元素。将`CSS`文件中的样式规则复制到`style`元素中。`snowman.svg`文件应包含指示这是一个`SVG`文件的`DOCTYPE`条目和一个`svg`元素。`CSS`规则将在`style`元素内部，而`style`元素则在`svg`元素内部。\n\
  \n5. 要测试你的图像，从桌面打开`snowman.svg`文件。这将启动浏览器并显示雪人图像。\n\n![](img/index-404_1.jpg)\n\n\
  第 22 章 ■ 可缩放矢量图形\n\n#### 使用 SVG 背景\n\n现在你有了一个可以像其他图像一样使用的图像文件。为了演示这一点，你将使用`snowman.svg`文件作为初始网页的背景图像。\n\
  \n1. 在初始`CSS`文件中，添加以下样式规则：\n\n```\nbody {\n  background-image: url(snowman.svg);\n\
  \  background-size: cover;\n}\n```\n\n2. 这使用了新的`snowman.svg`图像，并将其配置为扩展以适合窗口。刷新浏览器后，除了小图像外，你还应该看到图像的较大版本，如图\
  \ 22-3 所示。请注意，在扩大图像尺寸时，图像质量没有损失。\n\n***图 22-3.** 带有雪人背景的页面*\n\n### 创建交互式地图\n\n绘制雪人图片可能很有趣，但让我们继续学习一些更实用的`SVG`用法。你将创建一个美国地图，每个州由一个单独的`SVG`\
  \ `path`元素表示，稍后我会解释`path`元素。路径定义将存储在一个单独的`JavaScript`文件中。显示地图后，我将向你展示一些使用静态和动态样式来设置地图样式的`CSS`技巧。最后，你将添加一些动画，为你的网页增添一点魅力。\n\
  \n第 22 章 ■ 可缩放矢量图形\n\n### 使用 Path 元素\n\n`path`元素是所有`SVG`元素中用途最广泛的。它是“移动到”、“连线到”和各种“曲线到”命令的集合。形状通过遵循路径命令来绘制。每个命令从当前位置开始，要么移动到新位置，要么绘制一条线到下一个位置。这里有一个例子：\n\
  \n- 移动到 25, 50。\n- 绘制一条线到 50, 50。\n- 绘制一条线到 50, 25。\n- 绘制一条弧线到 25, 50。\n\n这表示为：\n\
  \n```\n<path d=\"M25,50 L50,50 L50,25 A25,25 0 0,0 25,50 z\" />\n```\n\n\n\n“移动到”和“连线到”命令非常直观。“弧线到”命令，以及所有其他曲线命令，则更为复杂，因为需要提供额外的控制点来描述曲线的绘制方式。每个命令使用单个字母表示，如表\
  \ 22-1 所示。\n\n***表 22-1.** 可用的路径命令*\n\n**命令**|**缩写**|**描述**\n---|---|---\n移动到|`M`|移动到指定位置\n\
  连线到|`L`|绘制一条线到指定位置\n水平连线到|`H`|绘制一条水平线到指定的 x 坐标\n垂直连线到|`V`|绘制一条垂直线到指定的 y 坐标\n弧线到|`A`|绘制一条弧线到指定位置\n\
  曲线到|`C`|绘制一条三次贝塞尔曲线\n简写曲线到|`S`|绘制一条简化的三次贝塞尔曲线\n二次曲线到|`Q`|绘制一条二次贝塞尔曲线\n简写二次曲线到|`T`|绘制一条简化的二次贝塞尔曲线\n\
  闭合路径|`Z`|通过绘制一条线回到起始位置来闭合图形\n\n对于这些命令中的每一个，当使用绝对坐标时，使用大写字母。你也可以指定相对坐标，并使用小写字母来表示相对于当前位置的值。有关构建路径元素的更多信息，请参阅文章\
  \ [`www.w3.org/TR/SVG/paths.html#PathData`](http://www.w3.org/TR/SVG/paths.html#PathData)。\n\
  \n正如你可能想象的那样，绘制像阿拉斯加州这样复杂的形状需要很多命令。你不想手动编辑这些内容。幸运的是，有些工具可以帮助构建路径定义。例如，[`code.google.com/p/svg-edit`](http://code.google.com/p/svg-edit)\
  \ 上有一个免费的基于网页的工具。只是为了好玩，清单 22-1 展示了阿拉斯加的路径元素。\n\n**清单 22-1.** 阿拉斯加的路径元素定义\n\n```\n\
