  \n**提示** 本数据以及其他所有州的数据均下载自 [`en.wikipedia.org/wiki/File:Blank_US_Map.svg`](http://en.wikipedia.org/wiki/File:Blank_US_Map.svg)。你可以通过访问\
  \ [`commons.wikimedia.org/`](http://commons.wikimedia.org/) 并在搜索条件中输入 **svg 地图**\
  \ 来找到大量类似素材。\n\n#### 实现初始地图\n\n首先，你将为地图应用基本样式来创建初始地图。路径定义在 `States.js` 文件中，该文件可从\
  \ [www.apress.com](http://www.apress.com/) 下载。你将创建一个新的 HTML 文档来显示地图，而实际的路径 DOM 元素将通过\
  \ JavaScript 创建。\n\n### 练习 22-3：创建初始地图\n\n1.  使用以下标记创建一个新的 HTML 文档。这与上一页类似；但请注意，高度和宽度不同，因为此地图具有不同的固有尺寸。\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <title>第 22 章 - 美国地图</title>\n  <link rel=\"stylesheet\" href=\"Map.css\"\
  \ />\n  <script src=\"States.js\" defer></script>\n  <script src=\"Map.js\" defer></script>\n\
  </head>\n<body>\n  <svg version=\"1.1\"\n       width=\"959px\" height=\"593px\"\
  \n       id=\"map\">\n  </svg>\n</body>\n</html>\n```\n\n2.  从 [www.apress.com](http://www.apress.com/)\
  \ 下载 `States.js` 文件。该文件定义了一个名为 `States` 的变量，它是一个对象数组。每个对象都具有 `StateCode`、`StateName`\
  \ 和 `Path` 属性。\n\n![](img/index-409_1.jpg)\n\n3.  创建一个 `Map.js` 文件，并使用以下代码进行实现。此代码将获取\n\
  \n\n\n\n`svg`元素并将`path`元素作为子元素添加。`StateCode`用于\n\n`id`，`StateName`用于`class`属性。\n\
  \n```\nvar map = document.getElementById(\"map\");\n\nfor (var i=0; i < States.length;\
  \ i++) {\n  var path = document.createElementNS(\"http://www.w3.org/2000/svg\",\
  \ \"path\");\n  path.id = States[i].StateCode;\n  path.setAttribute(\"class\", States[i].StateName);\n\
  \  path.setAttribute(\"d\", States[i].Path);\n  map.appendChild(path);\n}\n```\n\
  \n**注意**：因为`path`元素不是标准 HTML 命名空间的一部分，所以必须使用`createElementNS()`方法并指定 SVG 命名空间。\n\
  \n4. 创建`Map.css`文件并输入以下规则。这将改变填充颜色，以便州轮廓可见。\n\n```\npath {\n  stroke: black;\n \
  \ fill: khaki;\n}\n```\n\n5. 保存更改并在浏览器中显示`Map.html`文件。地图应如图 22-4 所示。\n\n**图 22-4.\
  \ 初始地图**\n\n# 可伸缩矢量图形（第 22 章）\n\n## 样式化州元素\n\n现在所有机械性工作已完成，你可以通过样式化`path`元素来获得一些乐趣。正如我之前用雪人图像演示的那样，每个元素都可以使用\
  \ CSS 进行样式化。您也可以使用 JavaScript 动态地对其进行样式化。我将向您展示如何使用纯色填充、渐变和背景图像来格式化每个元素。\n\n####\
  \ 使用基本填充颜色\n\n**注意**：在本章中，您将使用颜色来区分各州的样式。在本书的印刷版中，其中一些颜色在转换为灰度时可能显示不佳。您需要完成练习或下载项目才能看到应用样式的结果。\n\
  \n首先将添加一些简单的填充规则。使用简单的元素选择器，您已经将描边颜色设置为黑色，填充颜色设置为`khaki`。现在，为了增加多样性并演示如何使用属性选择器，您将根据州代码更改填充颜色。\n\
  \n**练习 22-4. 添加基本填充颜色**\n\n`id`属性包含两个字母的州代码，`class`属性包含州名。\n\n使用`id`属性的首字母，您将按如下方式设置填充颜色：\n\
  \n*   `A`：红色\n*   `N`：黄色\n*   `M`：绿色\n*   `C`：蓝色\n*   `O`：紫色\n*   `I`：橙色\n\n1. 将以下样式规则输入到`Map.css`文件中。\n\
  \n```\npath[id^=\"A\"] {\n  fill: red;\n}\npath[id^=\"N\"] {\n  fill: yellow;\n\
  }\npath[id^=\"M\"] {\n  fill: green;\n}\npath[id^=\"C\"] {\n  fill: blue;\n}\npath[id^=\"\
  O\"] {\n  fill: purple;\n}\npath[id^=\"I\"] {\n  fill: orange;\n}\n```\n\n2. 刷新浏览器，地图现在应如图\
  \ 22-5 所示。\n\n**图 22-5. 经过基本样式化的地图**\n\n3. 当您在地图上移动鼠标时，突出显示鼠标当前指向的州会很好。将以下规则添加到`Map.css`文件中：\n\
  \n```\npath:hover {\n  opacity: .5;\n}\n```\n\n#### 使用渐变填充\n\n您可以对 SVG 元素使用渐变填充，但其实现方式与典型的\
  \ HTML 元素不同。您首先必须在 HTML 标记中定义渐变，然后使用 URL 引用它。\n\n**练习 22-5. 添加渐变填充**\n\n1. 将以下`defs`元素添加到\
  \ HTML 文档的`svg`元素内部：\n\n```\n<defs>\n  <linearGradient id=\"blueGradient\"\n   \
  \               x1=\"0%\" y1=\"0%\"\n                  x2=\"100%\" y2=\"100%\"\n\
  \                  spreadMethod=\"pad\">\n    <stop offset=\"0%\" stop-color=\"\
  #ffffff\" stop-opacity=\"1\"/>\n    <stop offset=\"50%\" stop-color=\"#6699cc\"\
  \ stop-opacity=\"1\"/>\n    <stop offset=\"100%\" stop-color=\"#4466aa\" stop-opacity=\"\
  1\"/>\n  </linearGradient>\n</defs>\n```\n\n`defs`元素用于定义可以在文档后续部分引用的内容。它实际上在被引用之前不会执行任何操作。这里我们定义了一个`linearGradient`元素，并赋予其`id`为`blueGradient`。您将使用`id`属性引用它。\n\
  \n这些属性与您在第 12 章中使用的渐变不同，但实现的基本功能相同。\n\n\n\n\n相同的事情。`x1`、`y1`、`x2`和`y2`属性定义了一个向量，用于指定渐变的方向。\n\
  \n在这种情况下，渐变将从左上角开始，到右下角结束。这里指定了三个颜色值，分别定义了渐变在起点、中点和终点的颜色。\n\n2. 现在将以下规则添加到`Map.css`文件的末尾。这将为怀俄明州使用新的渐变。\n\
  \n```css\npath[id=\"WY\"] {\n  fill: url(#blueGradient);\n}\n```\n\n3. 刷新浏览器，你应该会看到怀俄明州使用了渐变填充，如图\
  \ 22-6 所示。\n\n**Figure 22-6.** 使用渐变填充\n\n![Figure 22-6](img/index-413_1.jpg)\n\n\
  第 22 章 ■ 可缩放矢量图形\n\n#### 使用背景图像\n\n你也可以使用图像文件作为形状的背景。首先需要在`defs`元素中将其定义为一个图案，然后像使用渐变一样引用它。在本练习中，你将使用一张德克萨斯州州旗的图像，并将其作为该州的背景。\n\
  \n**练习 22-6. 使用背景图像**\n\n1. 在第 22 章的源代码下载中有一个`TX_Flag.jpg`文件；请下载此文件。\n\n2. 将以下代码添加到你之前创建的\
  \ HTML 文档的`defs`元素中。这将定义背景图像，并指定图案应使用`TX_Flag.jpg`图像文件，并将其拉伸为 377 x 226 像素。这将使其足够大以覆盖`path`元素，而无需重复。\n\
  \n```html\n<pattern id=\"TXflag\" patternUnits=\"objectBoundingBox\" width=\"1\"\
  \nheight=\"1\">\n  <image xlink:href=\"TX_Flag.jpg\" x=\"0\" y=\"0\"\n    width=\"\
  377\" height=\"226\" />\n</pattern>\n```\n\n3. 将以下规则添加到`Map.css`文件中，该规则将为德克萨斯州使用新的图案。\n\
  \n```css\npath[id=\"TX\"] {\n  fill: url(#TXflag);\n}\n```\n\n4. 保存更改并刷新浏览器。你应该会看到背景图像，如图\
  \ 22-7 所示。\n\n**Figure 22-7.** 使用背景图像\n\n![Figure 22-7](img/index-413_1.jpg)\n\n\
  第 22 章 ■ 可缩放矢量图形\n\n由于这是一章关于 SVG 的内容，我觉得使用位图图像有点不妥。当图像被拉伸时，你可以看到图像质量下降。德克萨斯州的州旗是最容易用\
  \ SVG 绘制的图案之一，但我想演示的是位图图像也可以在 SVG 定义中使用。不过，为了记录，清单 22-2 展示了用 SVG 表示的旗帜（这是从我之前提到的同一个\
  \ Wikimedia Commons 网站下载的，并稍作重新格式化）。\n\n**清单 22-2.** 用 SVG 表示的德克萨斯州州旗\n\n```svg\n\
  <rect width=\"1080\" height=\"720\" fill=\"#fff\"/>\n<rect y=\"360\" width=\"1080\"\
  \ height=\"360\" fill=\"#bf0a30\"/>\n<rect width=\"360\" height=\"720\" fill=\"\
  #002868\"/>\n<g transform=\"translate(180,360)\" fill=\"#fff\">\n  <g id=\"c\">\n\
  \    <path id=\"t\" d=\"M 0,-135 v 135 h 67.5\"\n      transform=\"rotate(18 0,-135)\"\
  />\n    <use xlink:href=\"#t\" transform=\"scale(-1,1)\"/>\n  </g>\n  <use xlink:href=\"\
  #c\" transform=\"rotate(72)\"/>\n  <use xlink:href=\"#c\" transform=\"rotate(144)\"\
  />\n  <use xlink:href=\"#c\" transform=\"rotate(216)\"/>\n  <use xlink:href=\"#c\"\
  \ transform=\"rotate(288)\"/>\n</g>\n```\n\n请注意，组元素`g`用于定义单个路径。该路径通过五个不同的角度进行旋转，从而形成一个五角星。\n\
  \n## 使用 JavaScript 更改样式\n\n这类应用的主要用途之一是，根据某些外部数据动态地设置每个元素的样式。例如，你可能希望突出显示有销售网点的州。或者，你可能希望根据人口统计等某些数据类型来设置颜色。到目前为止，你只使用了静态样式，但你也可以使用\
  \ JavaScript 来轻松地设置样式。\n\n在此示例中，你将首先使用 JavaScript 将所有`path`元素的`fill`属性设置为`khaki`（卡其色）。这将替换设置默认颜色的\
  \ CSS 属性。然后，这段代码将设置弗吉尼亚州`path`元素的填充颜色。在实际应用中，你通常会根据外部数据来定义样式。\n\n\n\n# 本练习还将演示如何使用\
  \ JavaScript 响应`mouseover`和`mouseout`事件。\n\n你将替换`path:hover`规则，并使用这些事件处理程序来实现此功能。\n\
  \n## 练习 22-7. 使用 JavaScript 调整样式\n\n1. 在`Map.js`脚本中添加以下函数：\n\n```javascript\nfunction\
  \ adjustStates() {\n  var paths = document.getElementsByTagName(\"path\");\n  for\
  \ (var i = 0; i < paths.length; i++) {\n    paths[i].setAttribute(\"fill\", \"khaki\"\
  );\n  }\n  var path = document.getElementById(\"VA\");\n  path.setAttribute(\"fill\"\
  , \"teal\");\n}\n```\n\n2. 在`Map.js`脚本中调用`adjustStates()`方法。\n\n```javascript\n\
  adjustStates();\n```\n\n3. 在`Map.css`文件中，像这样移除默认的 khaki 填充色：\n\n```css\npath {\n\
  \  stroke: black;\n  /*fill: khaki; */\n}\n```\n\n4. 刷新浏览器，弗吉尼亚州应不再使用默认颜色，如图 22-8\
  \ 所示。\n\n***图 22-8.** 使用 JavaScript 设置样式的弗吉尼亚州*\n\n5. 现在你还将使用 JavaScript 来实现悬停样式。你可以使用`event.target`属性获取触发事件的`path`元素。然后，通过访问其`id`属性来确定州代码。在`Map.js`脚本中添加以下方法：\n\
  \n```javascript\nfunction hoverState(e) {\n  var event = e || window.event;\n  var\
  \ state = event.target.getAttribute(\"id\");\n  var path = document.getElementById(state);\n\
  \  path.setAttribute(\"fill-opacity\", \"0.5\");\n}\n\nfunction unhoverState(e)\
  \ {\n  var event = e || window.event;\n  var state = event.target.getAttribute(\"\
  id\");\n  var path = document.getElementById(state);\n  path.setAttribute(\"fill-opacity\"\
  , \"1.0\");\n}\n```\n\n6. 然后，通过向`adjustStates()`函数添加以粗体显示的代码来绑定`mouseover`和`mouseout`事件处理程序。这将使用`addEventListener()`方法将`hoverState()`和`unhoverState()`事件处理程序绑定到每个`path`元素。\n\
  \n```javascript\nfunction adjustStates() {\n  var paths = document.getElementsByTagName(\"\
  path\");\n  for (var i = 0; i < paths.length; i++) {\n    paths[i].setAttributeNS(null,\
  \ \"fill\", \"khaki\");\n    paths[i].addEventListener(\"mouseover\", hoverState,\
  \ true);\n    paths[i].addEventListener(\"mouseout\", unhoverState, true);\n  }\n\
  \  var path = document.getElementById(\"VA\");\n  path.setAttributeNS(null, \"fill\"\
  , \"teal\");\n}\n```\n\n> **注意：** 在 Internet Explorer 中，`event`对象不会传递给事件处理程序。相反，它通过全局`window.event`属性提供。事件处理程序的编码可以兼容两种模型，只需像这样设置`event`变量：`var\
  \ event = e || window.event`。如果传递了对象，则使用该对象；如果未传递，则使用全局`window.event`对象。但要使此方法生效，你必须使用`addEventListener()`方法注册事件处理程序。不能简单地设置`mouseover`属性。\n\
  \n7. 像这样移除`path:hover`样式规则：\n\n```css\n/*path:hover {\n  opacity: .5;\n}*/\n```\n\
  \n8. 保存更改并刷新浏览器。当您移动鼠标时，各州的区域应像使用`path:hover`样式时一样高亮显示。\n\n---\n\n### 添加动画\n\n此类地图的典型应用是允许用户选择一个区域，并因此触发某些操作。页面将根据所选项目显示一些信息。为了演示这一点，你将在用户点击某个州时添加一些动画效果。\n\
  \n我在[第 15 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_15)中介绍的 CSS 动画无法在 SVG 元素上生效。相反，你将使用\
  \ JavaScript 来实现动画效果。当选中一个州时，你首先会复制所选元素。然后，使用计时器逐渐改变其旋转角度。你需要进行复制，这样当图像旋转时，地图上不会留下一个空洞。此外，新元素将位于所有其他元素之上，因此你不必担心它被其他元素遮挡。\n\
  \n一旦元素副本完成动画，你将其从文档中移除。然后，你将显示一个警告框，其中包含所选路径的州代码和州名称。\n\n## 练习 22-8. 添加动画\n\n1.\
  \ 由于这使用了 3D 变换，你需要在`path`元素上设置一些变换属性。将以下规则添加到`Map.css`文件中：\n\n```css\npath {\n \
  \ transform-style: preserve-3d;\n  perspective: 200px;\n}\n```\n\n2. 然后，将清单 22-3\
  \ 中显示的代码添加到`Map.js`脚本中。\n\n***清单 22-3.** 添加支持动画的函数*\n\n```javascript\n// 设置一些全局变量\n\
  var timer;\nvar stateCode;\nvar stateName;\nvar animate;\nvar angle;\n\nfunction\
  \ selectState(e) {\n  var event = e || window.event;\n  // 获取州代码和州名称\n  stateCode\
  \ = event.target.getAttribute(\"id\");\n  stateName = event.target.getAttribute(\"\
  class\");\n  // 获取选中的路径元素，然后复制它\n  var path = document.getElementById(stateCode);\n\
  \  animate = path.cloneNode(false);\n  // 设置一些显示属性，并将副本添加到文档中\n  animate.setAttribute(\"\
  fill-opacity\", \"1.0\");\n  animate.setAttribute(\"stroke-width\", \"3\");\n  document.getElementById(\"\
  map\").appendChild(animate);\n  angle = 0;\n  // 设置一个每 10 毫秒运行一次的计时器\n  timer =\
  \ setInterval(function () { animateState(); }, 10);\n}\n\nfunction animateState()\
  \ {\n  angle += 1;\n  // 如果旋转了 360 度，停止计时器，销毁元素副本\n  // 并显示一个警告框\n  if (angle >\
  \ 360) {\n    clearInterval(timer);\n    animate.setAttribute(\"visibility\", \"\
  hidden\");\n    var old = document.getElementById(\"map\").removeChild(animate);\n\
  \    alert(stateCode + \" - \" + stateName);\n    return;\n  }\n  // 改变图像旋转\n  animate.style.transform\
  \ = \"rotateY(\" + Math.round(angle) + \"deg)\";\n}\n```\n\n`selectState()`函数从选中的`path`元素中获取州代码和州名称。然后，它获取`path`元素，并使用其`cloneNode()`方法复制它。由于鼠标当前悬停在选中的路径上，其不透明度将被设置为\
  \ 50%。因此，此代码将副本的不透明度改为 100%。它还设置了描边宽度，使该元素具有更宽的边框。然后将副本添加到文档中，并启动一个计时器来触发动画。\n\n\
  每 10 毫秒，`animateState()`函数被调用，它增加角度并重绘图像。如果旋转达到 360 度，此方法取消计时器并移除`path`元素的副本。同时，它会弹出一个警告框，显示州代码和州名称。\n\
  \n3. 通过向`adjustStates()`函数添加以粗体显示的代码来添加另一个事件处理程序。当用户点击一个`path`元素时，这将调用`selectState()`方法。\n\
  \n```javascript\nfunction adjustStates() {\n  var paths = document.getElementsByTagName(\"\
  path\");\n  for (var i = 0; i < paths.length; i++) {\n    paths[i].setAttribute(\"\
  fill\", \"khaki\");\n    paths[i].addEventListener(\"mouseover\", hoverState, true);\n\
  \    paths[i].addEventListener(\"mouseout\", unhoverState, true);\n    paths[i].addEventListener(\"\
  click\", selectState, true);\n  }\n  var path = document.getElementById(\"VA\");\n\
  \  path.setAttribute(\"fill\", \"teal\");\n}\n```\n\n4. 刷新浏览器并点击一个州，您应该会看到它飞离页面，如图\
  \ 22-9 所示。\n\n5. 然后图像将飞回原位，并出现一个警告框，如图 22-10 所示。\n\n***图 22-9.** 对选中的州进行动画处理*\n\n\
  ***图 22-10.** 显示选中州名称的警告框*\n\n---\n\n#### 总结\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您提供的格式和注意事项，将给定的英文文本翻译成中文。\n\
  \n\n# 第 23 章：Canvas\n\n在本章中，我将向你展示如何使用 HTML5 的 `canvas` 元素来创建一些有趣的图形。你会看到，它与你上一章探索的\
  \ SVG 截然不同。稍后我将更详细地讨论这些差异，但你会注意到的重点是，canvas 完全是通过 JavaScript 实现的。\n\n标记中唯一的部分是一个简单的元素定义，如下所示：\n\
  \n```html\n<canvas id=\"myCanvas\" width=\"400\" height=\"400\">\nCanvas is not\
  \ supported on this browser\n</canvas>\n```\n\n相反，你将通过调用 JavaScript 中的各种绘图方法来定义内容。就像\
  \ `audio` 和 `video` 元素一样，当浏览器不支持 canvas 时，会使用 `canvas` 元素内的标记。你可以利用这一点来提供适当的回退内容。\n\
  \n通过本章的练习，你将创建三个不同的 canvas 实现，它们将共同展示 canvas 的能力。你将创建以下内容：\n\n-   一个带有移动棋子的棋盘\n\
  -   一个简单的太阳系模型\n-   一个展示形状各种合成方式的页面\n\n当然，你可以发挥想象力，将这些原理应用到任何有趣且引人入胜的图形应用中。\n\n\
  ## 创建一个棋盘\n\n在第一个应用中，你将绘制一个棋盘，它只是一系列颜色交替的方块。\n\n我将向你展示如何使用渐变来使棋盘更有趣一些。你将使用图像文件在合适的方格中绘制棋子。最后，你将应用一点动画效果来在棋盘上移动棋子。这将让你在进入更高级的主题之前，很好地了解基本绘图技术是如何使用的。\n\
  \n`canvas` 元素的命名恰如其分，因为它提供了一个可供你绘制的区域。\n\n当你创建一个 `canvas` 元素时，你使用 `height` 和 `width`\
  \ 属性来定义其大小。你可以通过标记或 CSS 指定其他属性，如 `margin`、`padding` 和 `border`。这些属性会影响元素在页面中的位置。但是，你不能修改元素内的任何内容。`canvas`\
  \ 元素本身只是定义了一个空白区域，你可以在上面创建你的杰作。\n\n当你在 HTML 中创建一个 `canvas` 元素时，通常会分配一个 `id` 属性，以便你可以在\
  \ JavaScript 中使用 `getElementById()` 方法访问它。你不必这样做；你可以使用 `getElementsByTagName()`\
  \ 方法访问它，或者使用我在 [第 18 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_18) 中描述的新查询选择器。\n\
  \n© Mark J. Collins 2017  \nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and\
  \ Multimedia*, DOI 10.1007/978-1-4842-2463-2_23\n\n一旦你有了 `canvas` 元素，你将通过调用 `getContext()`\
  \ 来获取其绘图上下文。你必须指定要使用哪个上下文。上下文指定了一组 API 函数和绘图能力。唯一普遍可用的是 `2d`，我们将在本章中专门使用它。\n\n>\
  \ **注意：** 另一个可能的上下文并非你期望的 `3d`；它是 `WebGL`，或者在某些浏览器中是 `experimental-webgl`。这还没有完全准备好用于主流环境，并且它与\
  \ `2d` 上下文截然不同。\n\n#### 绘制矩形\n\n与 SVG 不同，你可以直接绘制的唯一形状是矩形。你可以使用路径绘制更复杂的形状，我将在后面解释。有三个方法可用于绘制矩形。\n\
  \n-   `clearRect()`：清除指定的矩形区域。\n-   `strokeRect()`：绘制指定矩形的边框，不填充。\n-   `fillRect()`：绘制一个填充的矩形。\n\
  \n这些方法每个都需要四个参数。前两个定义了矩形左上角的 `x` 和 `y` 坐标。最后两个参数分别指定了宽度和高度。绘图上下文具有 `strokeStyle`\
  \ 和 `fillStyle` 属性，用于控制边框或填充的绘制方式。你在绘制矩形之前设置这些属性。一旦设置，后续所有形状都会使用这些属性进行绘制，直到你更改它们。\n\
  \n> **提示：** 与 SVG 一样，在 canvas 中，canvas 元素的左上角坐标为 `x` 和 `y`，其值为 `0, 0`。\n\n为了演示绘制矩形，你将首先绘制棋盘，它包含八行八列方块。\n\
  \n#### 练习 23-1：绘制一个简单的棋盘\n\n1.  创建一个名为 `Chess.html` 的新网页，使用基本标记：\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\" />\n    <title>Chapter\
  \ 23 - Chess</title>\n    <script src=\"Chess.js\" defer></script>\n</head>\n<body>\n\
  </body>\n</html>\n```\n\n2.  通过在 `body` 元素中插入以下标记来添加一个 `canvas` 元素：\n\n```html\n\
  <canvas id=\"board\" width=\"600\" height=\"600\">\n    Not supported\n</canvas>\n\
  ```\n\n3.  然后使用以下代码创建一个 `Chess.js` 脚本文件：\n\n```javascript\n\"use strict\";\n\n//\
  \ Get the canvas context\nvar chessCanvas = document.getElementById(\"board\");\n\
  var chessContext = chessCanvas.getContext(\"2d\");\n```\n\n4.  向 `Chess.js` 文件添加一个绘制棋盘的函数，然后使用以下代码调用此函数：\n\
  \n```javascript\n// Draw the chess board\nfunction drawBoard() {\n    chessContext.clearRect(0,\
  \ 0, 600, 600);\n    chessContext.fillStyle = \"red\";\n    chessContext.strokeStyle\
  \ = \"red\";\n\n    // Draw the alternating squares\n    for (var x = 0; x < 8;\
  \ x++) {\n        for (var y = 0; y < 8; y++) {\n            if ((x + y) % 2) {\n\
  \                chessContext.fillRect(75 * x, 75 * y, 75, 75);\n            }\n\
  \        }\n    }\n\n    // Add a border around the entire board\n    chessContext.strokeRect(0,\
  \ 0, 600, 600);\n}\n\ndrawBoard();\n```\n\n`drawBoard()` 函数首先清空它将要绘制的区域。然后它使用嵌套的\
  \ `for` 循环来绘制方块。`fillStyle` 和 `strokeStyle` 属性都被设置为红色；默认情况下它们都是黑色。注意，它只绘制了红色的方块。由于整个区域先前已被清空，任何没有绘制到的区域都将是白色。此代码使用嵌套的\
  \ `for` 循环来遍历八行八列。红色方块是行数与列数之和为奇数的那些方块。对于偶数行（0、2、4 和 6），奇数列（1、3、5 和 7）将为红色。对于奇数行，偶数列将为红色。为了修整边缘方块，在整个棋盘周围绘制了一个红色边框。\n\
  \n![棋盘](img/index-423_1.png)\n\n5.  保存你的更改，并在浏览器中显示 `Chess.html` 页面。该页面看起来应该类似于图\
  \ 23-1。\n\n***图 23-1.** 初始棋盘*\n\n#### 使用渐变\n\n\n\n\n你可以使用渐变而非纯色来填充形状。为此，你必须首先使用绘图上下文的`createLinearGradient()`方法创建一个渐变对象。该方法接受四个参数，分别是渐变起点和终点的\
  \ x 和 y 坐标。这让你能够指定渐变的方向：从上到下、从左到右，或是对角线方向。渐变是在整个画布上计算的。你无法为单个元素定义渐变。\n\n接着，你必须定义颜色节点。每个颜色节点定义了渐变上的一个位置及其对应的颜色。\n\
  \n至少需要定义位置为 0 和 1 的颜色节点，它们分别指定渐变的起始颜色和结束颜色。如果你希望控制颜色过渡，还可以在它们之间添加颜色节点。例如，如果你想定义中点处的颜色，则使用\
  \ 0.5。\n\n最后，你将使用这个渐变来设置`fillStyle`属性。要尝试此功能，请添加以下粗体显示的代码：\n\n```\nfunction drawBoard()\
  \ {\n\nchessContext.clearRect(0, 0, 600, 600);\n\nvar gradient = chessContext.createLinearGradient(0,\
  \ 600, 600, 0);\n\ngradient.addColorStop(0.0, \"#D50005\");\n\ngradient.addColorStop(0.5,\
  \ \"#E27883\");\n\ngradient.addColorStop(1.0, \"#FFDDDD\");\n\nchessContext.fillStyle\
  \ = gradient;\n\nchessContext.strokeStyle = \"red\";\n```\n\n![](img/index-424_1.jpg)\n\
  \n**第 23 章 ■ Canvas**\n\n保存你的更改并刷新浏览器。页面现在应看起来像图 23-2。请注意，颜色过渡是跨越整个画布的，而非每个方格内部。\n\
  \n***图 23-2.** 使用渐变填充的棋盘*\n\n#### 使用图像\n\n现在你可以准备添加棋子了，棋子将使用图像文件绘制。向画布添加图像非常简单。你创建一个`Image`对象，将其`src`属性设置为图像文件的位置，然后像这样调用绘图上下文的`drawImage()`方法：\n\
  \n```\nvar myImage = new Image();\n\nmyImage.src = \"images/sample.jpg\";\n\ncontext.drawImage(myImage,\
  \ 0,0, 50, 100);\n```\n\n`drawImage()`方法的第一个参数指定要绘制的图像。它可以是我上面演示的`Image`对象。或者，你也可以指定页面上已有的`img`、`video`或`canvas`元素。接下来的两个参数指定图像左上角的\
  \ x 和 y 位置。\n\n第四个和第五个参数是可选的，分别指定要将图像缩放到的宽度和高度。如果你不指定这些参数，图像将使用其原始尺寸绘制。\n\n`drawImage()`方法还允许你提供额外的四个参数。这些参数用于指定应显示在画布上的图像部分。这些额外参数包括指定左上角的\
  \ x 坐标和 y 坐标，以及定义指定部分的宽度和高度。如果你只想绘制图像的一部分，请使用最后四个参数。如果省略它们，将显示整个图像。\n\n在此应用中，你将使用\
  \ 12 个不同的图像绘制 32 个棋子。此外，在本章后面，你将添加代码来移动棋子。为此，你将为应用添加一些结构。你将定义一个类，用于存储棋子属性，例如要使用的图像及其在棋盘上的位置。然后，你将实现一个通用的绘图函数，该函数使用这些属性中的详细信息。\n\
  \n**第 23 章 ■ Canvas**\n\n**练习 23-2. 绘制棋子**\n\n1. 在你的 web 应用中创建一个名为`Images`的新文件夹，用于存储图像文件。\n\
