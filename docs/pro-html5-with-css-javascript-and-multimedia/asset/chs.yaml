  \n\n"
- "# 实现自动化\n\n要实现自动化，你将创建一个 `makeNextMove()` 函数。该函数将调整棋子的 `x` 和 `y` 位置，然后重新绘制棋盘和所有棋子。你将使用\
  \ `setInterval()` 函数重复调用此函数，使棋子依次移动。\n\n## 第 23 章 ■ 画布\n\n### **练习 23-3. 动画化国际象棋棋子**\n\
  \n1. 在 `Chess.js` 文件开头附近添加以下以粗体显示的变量：\n\n```javascript\n// 定义一个数组来存储 32 个棋子\nvar\
  \ pieces = new Array(32);\nvar moveNumber = -1;\nvar timer;\n```\n\n2. 使用以下代码在 `Chess.js`\
  \ 文件中实现 `makeNextMove()` 函数。这段代码通过调整棋子的 `x` 和 `y` 属性来“移动”棋子。它跟踪移动编号，并使用该编号调整相应的棋子。第七步会捕获一个棋子并设置其\
  \ `killed` 属性。由于这结束了动画，第七步还会使用 `clearTimer()` 函数，以便不再发生计时器事件。每次移动后，棋盘和所有棋子都会被重绘。在第七步之后，该函数还会使用\
  \ `fillText()` 方法，该方法用于向画布写入文本。\n\n```javascript\nfunction makeNextMove() {\n  \
  \  function inner() {\n        if (moveNumber === 1) {\n            pieces[20].y--;\n\
  \        }\n        if (moveNumber === 2) {\n            pieces[4].y += 2;\n   \
  \     }\n        if (moveNumber === 3) {\n            pieces[29].y = 4;\n      \
  \      pieces[29].x = 2;\n        }\n        if (moveNumber === 4) {\n         \
  \   pieces[6].y++;\n        }\n        if (moveNumber === 5) {\n            pieces[30].x\
  \ = 5;\n            pieces[30].y = 5;\n        }\n        if (moveNumber === 6)\
  \ {\n            pieces[7].y++;\n        }\n        if (moveNumber === 7) {\n  \
  \          pieces[30].x = 5;\n            pieces[30].y = 1;\n            pieces[5].killed\
  \ = true;\n            clearInterval(timer);\n        }\n        moveNumber++;\n\
  \        drawBoard();\n        drawAllPieces();\n        if (moveNumber > 7) {\n\
  \            chessContext.font = \"30pt Arial\";\n            chessContext.fillStyle\
  \ = \"black\";\n            chessContext.fillText(\"Checkmate!\", 200, 220);\n \
  \       }\n    }\n    return inner;\n}\n```\n\n3. 将以下代码添加到 `Chess.js` 文件中。这将每 2\
  \ 秒调用一次 `makeNextMove()` 函数。\n\n```javascript\ntimer = setInterval(makeNextMove(),\
  \ 2000);\n```\n\n4. 保存更改并刷新浏览器。经过一系列移动后，页面应如图 23-4 所示。\n\n**图 23-4.** 完成的国际象棋棋盘\n\
  \n> **注意：** `makeNextMove()` 函数使用了 JavaScript 中一个经常被误解的特性——闭包，该特性在第 3 章中已经介绍过。此函数定义了另一个名为\
  \ `inner()` 的函数，它执行实际工作。然后返回 `inner()` 函数。当计时器到期时，`window` 对象将调用 `makeNextMove()`\
  \ 函数。然而，它使用的所有变量（例如棋子数组）都将超出作用域。`inner()` 函数将能够访问这些变量，因此这解决了作用域问题。\n\n## 模拟太阳系\n\
  \n对于下一个画布，你将绘制一个移动的太阳系模型。为节省时间，你只需显示地球、太阳和月亮。此实现将利用画布的两个重要特性：\n\n- **路径**\n- **变换**\n\
  \n#### 使用路径\n\n如前所述，画布支持的唯一简单图形是矩形，你在前面的示例中已经使用过。对于所有其他图形，你必须定义路径。在画布中定义路径的基本方法与\
  \ SVG 类似。你使用移动命令设置起点，然后使用线条和曲线命令的组合来绘制图形。\n\n在画布中，你总是从 `beginPath()` 命令开始。调用所需的绘制命令后，通过调用\
  \ `stroke()`（绘制图形轮廓）或 `fill()`（填充图形）来完成路径。只有在调用 `stroke()` 或 `fill()` 之后，图形才会实际绘制到画布上。如果在完成当前图形（通过调用\
  \ `stroke()` 或 `fill()`）之前再次调用 `beginPath()`，画布将忽略之前的未完成命令。与矩形一起使用的 `strokeStyle`\
  \ 和 `fillStyle` 属性同样定义了路径的颜色。\n\n实际的绘制命令如下：\n\n- `moveTo()`\n- `lineTo()`\n- `arcTo()`\n\
  - `bezierCurveTo()`\n\n\n\n- `quadraticCurveTo()`\n\n此外，还可以使用以下函数进行绘图：\n\n- `closePath()`：执行从当前位置到起始位置的\
  \ `lineTo()` 命令，以闭合形状。如果使用 `fill()` 命令且当前不在起始位置，则会自动调用 `closePath()`。\n- `arc()`：在指定位置绘制圆弧；无需先移动到该位置。但仍需按路径处理：需先调用\
  \ `beginPath()`，且圆弧直到调用 `stroke()` 或 `fill()` 时才真正绘制。\n\n#### 绘制圆弧\n\n`arc()` 命令是常用且重要的命令。它接受以下参数：\n\
  \n`arc(x, y, radius, startAngle, endAngle, counterclockwise)`\n\n前两个参数指定圆心的 x 和\
  \ y 坐标。第三个参数指定半径。第四和第五个参数确定圆弧的起始和结束角度。\n\n这些角度基于 x 轴测量：0° 对应圆的最右侧，90° 对应圆的最底部。角度以弧度为单位指定，而非度数。\n\
  \n除非绘制完整圆形，否则圆弧的方向很重要。例如，若从 0° 绘制到 90°，则得到从右侧到底部的四分之一圆弧。但若使用相同端点以逆时针方向绘制，则会得到四分之三圆弧。最后一个参数若为\
  \ `true`，则表示以逆时针方向绘制圆弧；该参数可选，省略时默认顺时针方向绘制。\n\n#### 使用变换\n\n初次接触 Canvas 变换时可能觉得有些费解，但理解后会发现它们非常有用。首先，变换对已绘制的图形没有影响；相反，它修改后续绘制所使用的网格系统。本章将演示三种变换：\n\
  \n- 平移\n- 旋转\n- 缩放\n\n如前所述，Canvas 元素使用原点位于左上角的网格系统。因此，点 (100, 50) 表示距离左上角向右 100\
  \ 像素、向下 50 像素的位置。\n\n变换仅调整网格系统。例如，以下命令将原点向右平移 100 像素、向下平移 50 像素：\n\n`context.translate(100,\
  \ 50);`\n\n如图 23-5 所示。\n\n![图 23-5：平移上下文原点](img/index-436_1.jpg)\n\n**图 23-5.**\
  \ 平移上下文原点\n\n此时移动至 (10, 20)，因相对于新原点，实际位置（相对于 Canvas）为 (110, 70)。你可能疑惑为何需要这样做。假设要绘制美国国旗（上有\
  \ 50 颗星），五角星是较复杂的图形，需要多条绘图命令。绘制完第一颗星后，还需用不同坐标重复 49 次。\n\n通过简单向右平移上下文，可用相同坐标值重复相同命令，但星形位于不同位置。当然，也可创建接受\
  \ x、y 参数的 `drawStar()` 函数，然后调用 50 次并传入不同值。但习惯变换后，尤其结合旋转等其他类型，会觉得更方便。\n\n旋转变换不移动原点，而是将\
  \ x 轴和 y 轴旋转指定角度。正值为顺时针旋转，负值为逆时针旋转。图 23-6 演示了旋转变换的工作原理。\n\n![图 23-6：旋转绘图上下文网格](img/index-437_1.jpg)\n\
  \n**图 23-6.** 旋转绘图上下文的网格\n\n> **注意**：此处为了便于理解，角度以度数表示。但 `rotate()` 命令期望弧度值。若几何知识生疏，可记住完整圆为\
  \ 360° 或 2π 弧度。JavaScript 中可使用 `Math.PI` 属性获取 π 值。例如，30° 是完整圆的 1/12，可表示为 `Math.PI\
  \ * 2 / 12`。通常弧度计算方法为：`度数 * (Math.PI / 180)`。\n\n可组合使用多个变换。例如，先平移原点再旋转坐标轴；也可再次旋转并平移。每次变换均相对于当前的位置和方向。\n\
  \n#### 保存上下文状态\n\n绘图上下文的状态包括已使用的 `fillStyle`、`strokeStyle` 等属性，以及所有已应用的变换累积结果。若使用多个变换，恢复原始状态可能较困难。幸运的是，绘图上下文提供了保存和恢复状态的功能。\n\
  \n通过调用 `save()` 保存当前状态，该操作将当前状态压入栈中。调用 `restore()` 则弹出最近保存的状态并使其成为当前状态。如图 23-7 所示。\n\
  \n![图 23-7：保存和恢复绘图上下文状态](img/index-438_1.jpg)\n\n**图 23-7.** 保存和恢复绘图上下文状态\n\n通常应在执行任何变换（尤其是复杂变换）前保存状态。完成需要变换的绘图元素后，可恢复状态。注意，通过设置\
  \ `fillStyle` 或执行变换来改变状态，不会影响已绘制的图形。\n\n### 绘制太阳系\n\n掌握这些特性后，让我们绘制一个简单的太阳系模型。\n\n\
  **练习 23-4：太阳系建模**\n\n1. 创建新网页 `Solar.html`，使用基本标记：\n\n```html\n<!DOCTYPE html>\n\
  <html lang=\"en\">\n<head>\n    <meta charset=\"utf-8\" />\n    <title>Chapter 23\
  \ - Solar System</title>\n    <script src=\"Solar.js\" defer></script>\n</head>\n\
  <body>\n</body>\n</html>\n```\n\n2. 在 body 元素内添加 canvas 元素：\n\n```html\n<canvas\
  \ id=\"solarSystem\" width=\"450\" height=\"400\">\n    Not supported\n</canvas>\n\
  ```\n\n3. 添加新的 `Solar.js` 脚本，使用以下代码。该代码获取 canvas 元素并获取 2D 绘图上下文，与前面的示例相同：\n\n```javascript\n\
  \"use strict\";\n\n// Get the canvas context\nvar solarCanvas = document.getElementById(\"\
  solarSystem\");\nvar solarContext = solarCanvas.getContext(\"2d\");\n```\n\n4. 在\
  \ `Solar.js` 文件中添加 `animateSS()` 函数，使用以下代码：\n\n```javascript\nfunction animateSS()\
  \ {\n    var ss = document.getElementById('solarSystem')\n    var ssContext = ss.getContext('2d');\n\
  \n    // Clear the canvas and draw the background\n    ssContext.clearRect(0, 0,\
  \ 450, 400);\n    ssContext.fillStyle = \"#2F1D92\";\n    ssContext.fillRect(0,\
  \ 0, 450, 400);\n    ssContext.save();\n\n    // Draw the sun\n    ssContext.translate(220,\
  \ 200);\n    ssContext.fillStyle = \"yellow\";\n    ssContext.beginPath();\n   \
  \ ssContext.arc(0, 0, 15, 0, Math.PI * 2, true);\n    ssContext.fill();\n\n    //\
  \ Draw the earth orbit\n    ssContext.strokeStyle = \"black\";\n    ssContext.beginPath();\n\
  \    ssContext.arc(0, 0, 150, 0, Math.PI * 2);\n    ssContext.stroke();\n\n    ssContext.restore()\n\
  }\n```\n\n`animateSS()` 函数执行实际工作：清除整个区域并用深蓝色填充。其余代码依赖变换，因此先保存绘图上下文，完成后恢复。\n\n该 `animateSS()`\
  \ 函数使用 `translate()` 将原点移动到近似位置。\n\n\n\n画布的中央。太阳和地球轨道是使用`arc()`函数绘制的。请注意，两者的中心点都是`0,\
  \ 0`，因为上下文的原点现在位于画布中央。此外，起始角度为`0`，终止角度为`Math.PI * 2`。以弧度表示，这是一个完整的圆周，即 360°。\n\n\
  太阳的弧线是填充的，而轨道不是。\n\n![](img/index-440_1.jpg)\n\n第 23 章 ■ Canvas\n\n5. 调用`setInterval()`函数，每\
  \ 100 毫秒调用一次`animateSS()`函数。\n\n```\nsetInterval(animateSS, 100);\n```\n\n6. 在浏览器中显示页面。到目前为止，这个绘图还不太有趣；它只是一个带有环绕轨道的太阳，如图\
  \ 23-8 所示。\n\n***图 23-8.** 初始的太阳系绘图*\n\n现在你将绘制地球并让它沿轨道动画运行。通常，地球每 365.24 天绕太阳公转一周，但我们会加快速度，在\
  \ 60 秒内完成一周。要确定每次重绘画布时地球的位置，你必须计算经过的秒数。每秒的旋转量计算为`Math.PI * 2 / 60`。将此值乘以秒数，即可确定地球应该所处的角度。\n\
  \n7. 添加以下以粗体显示的代码。这段代码使用`rotate()`函数将绘图上下文旋转到适当的角度。由于地球轨道的弧线半径为`150px`，这段代码随后使用`translate()`函数将上下文向右移动\
  \ 150 像素，以便在调整后的`0,0`坐标处绘制地球。请注意，这是结合了两个独立的变换：一个根据地球在轨道上的位置进行旋转，另一个从太阳平移适当的距离。然后，使用以`0,0`（上下文的新原点）为中心的填充弧线来绘制地球。\n\
  \n```\n// Draw the earth orbit\nssContext.strokeStyle = \"black\";\nssContext.beginPath();\n\
  ssContext.arc(0, 0, 150, 0, Math.PI * 2);\nssContext.stroke();\n\n// Compute the\
  \ current time in seconds (use the milliseconds\n// to allow for fractional parts).\n\
  var now = new Date();\nvar seconds = ((now.getSeconds() * 1000) + now.getMilliseconds())\
  \ / 1000;\n```\n\n![](img/index-441_1.jpg)\n\n第 23 章 ■ Canvas\n\n```\n//---------------------------------------------\n\
  // Earth\n//---------------------------------------------\n// Rotate the context\
  \ once every 60 seconds\nvar anglePerSecond = ((Math.PI * 2) / 60);\nssContext.rotate(anglePerSecond\
  \ * seconds);\nssContext.translate(150, 0);\n\n// Draw the earth\nssContext.fillStyle\
  \ = \"green\";\nssContext.beginPath();\nssContext.arc(0, 0, 10, 0, Math.PI * 2,\
  \ true);\nssContext.fill();\n\nssContext.restore()\n```\n\n8. 保存更改并刷新浏览器。现在你应该能看到地球绕太阳运行，如图\
  \ 23-9 所示。\n\n***图 23-9.** 将地球添加到绘图中*\n\n现在你将展示月球绕地球运行，这将展示使用变换的真正威力。月球的具体位置基于两个移动的物体。虽然可以使用一些复杂公式（科学家们已经这样做了几个世纪）来计算，但使用变换则无需如此。绘图上下文已根据当前时间（秒数）旋转到适当的角度，然后按轨道半径进行了平移，因此地球现在位于上下文的原点。地球在哪里并不重要；你只需相对于当前原点绘制月球即可。\n\
  \n第 23 章 ■ Canvas\n\n9. 你现在将像绘制地球一样绘制月球。不同的是，原点位于地球上，你将让月球绕地球旋转，而不是原点在太阳上并让地球绕太阳旋转。月球大约每个月绕地球旋转一次；换句话说，地球每绕太阳公转一周，月球会完成大约\
  \ 12 次公转。因此，你需要将旋转速度提高 12 倍。`anglePerSecond`现在计算为`12 * ((Math.PI * 2) / 60)`。添加\n\
  \n\n```javascript\n// Draw the earth\nssContext.fillStyle = \"green\";\nssContext.beginPath();\n\
  ssContext.arc(0, -0, 10, 0, Math.PI * 2, true);\nssContext.fill();\n\n//---------------------------------------------\n\
  // Moon\n//---------------------------------------------\n// Rotate the context\
  \ 12 times for every earth revolution\nanglePerSecond = 12 * ((Math.PI * 2) / 60);\n\
  ssContext.rotate(anglePerSecond * seconds);\nssContext.translate(0, 35);\n\n// draw\
  \ the moon\nssContext.fillStyle = \"white\";\nssContext.beginPath();\nssContext.arc(0,\
  \ 0, 5, 0, Math.PI * 2, true);\nssContext.fill();\nssContext.restore()\n```\n\n\
  > **注意** 每个太阳年大约有 12.368 个太阴月。你可以在上述代码中使用这个数值代替 12，使模型更加精确。\n\n10. 保存更改并刷新浏览器。此时你应该可以看到月亮围绕地球旋转，如图\
  \ 23-10 所示。\n\n![图 23-10](img/index-443_1.jpg)\n\n**图 23-10.** 包含月亮\n\n#### 应用缩放\n\
  \n在完成这个模型之前，还需要做一个小的修正。地球的轨道实际上并非完美的圆形，这个属性被称为离心率。（如果你对轨道离心率感到好奇，可以查阅 [`en.wikipedia.org/wiki/Orbital_eccentricity`](http://en.wikipedia.org/wiki/Orbital_eccentricity)\
  \ 上的文章。）为了在绘图中模拟这一点，你需要将轨道拉伸，使其宽度略大于高度。为此，你将使用缩放功能。\n\n`scale()` 函数执行第三种变换。此函数接受两个参数，用于指定沿\
  \ x 轴和 y 轴的缩放比例。缩放因子为 1 表示正常比例；小于 1 的因子会压缩图形；大于 1 的因子则会拉伸图形。尽管地球轨道的这种不完美特性极其微小，但这里我们会进行夸张处理，对\
  \ x 轴使用 1.1 的缩放因子。\n\n在绘制地球轨道之前，添加以下以粗体显示的代码：\n\n```javascript\n// Draw the earth\
  \ orbit\nssContext.scale(1.1, 1);\nssContext.strokeStyle = \"black\";\n```\n\n刷新浏览器；页面应如图\
  \ 23-11 所示。\n\n![图 23-11](img/index-444_1.jpg)\n\n**图 23-11.** 添加缩放效果\n\n现在你得到了一个略微变形的轨道。通过简单地更改缩放因子，各种绘图元素都按比例进行了调整。此外，在恢复上下文后，缩放比例也恢复正常，因此后续元素能正确绘制。\n\
  \n> **注意** 图 23-11 中的对齐展示了一次日食，即月球运行到地球和太阳之间，在地球上投下阴影。\n\n#### 裁剪画布\n\n我想再介绍一个与路径相关的特性。之前我说过，在调用\
  \ `beginPath()` 以及所需的绘图函数后，可以调用 `stroke()` 或 `fill()`。其实还有一个可以调用的函数：`clip()`。`clip()`\
  \ 函数会使用你刚刚定义的路径，并禁止在该路径之外绘制任何内容。这不会影响已经绘制的内容，但后续所有形状都将被限制在此路径定义的裁剪区域内。\n\n为了演示这一点，我们将回到国际象棋棋盘的示例中，并使用一个圆弧来定义裁剪路径。\n\
  \n转到 `chess.js` 脚本，并在 `drawBoard()` 函数中添加以粗体显示的代码。\n\n```javascript\nvar gradient\
  \ = chessContext.createLinearGradient(0, 600, 600, 0);\ngradient.addColorStop(0,\
  \ \"#D50005\");\ngradient.addColorStop(0.5, \"#E27883\");\ngradient.addColorStop(1,\
  \ \"#FFDDDD\");\n\n// 裁剪路径\nchessContext.beginPath();\nchessContext.arc(300, 300,\
  \ 300, 0, (Math.PI * 2), true);\nchessContext.clip();\n\nchessContext.fillStyle\
  \ = gradient;\nchessContext.strokeStyle = \"red\";\n\n// 绘制交替的方格\n```\n\n![第 23\
  \ 章 Canvas](img/index-445_1.jpg)\n\n\n\n这会在画板上定义一个圆形区域，任何超出该圆形范围的内容都将不可见。在浏览器中打开\
  \ `Chess.html` 文件，效果应如图 23-12 所示。\n\n***图 23-12.** 应用了裁剪路径的国际象棋棋盘*\n\n**注意：** 如果在绘制棋盘之后再定义裁剪路径，整个棋盘都会被绘制，但棋子会被裁切，因此任何超出裁剪区域的部分都会被隐藏。\n\
  \n#### 理解合成\n\n到目前为止，你绘制的所有图形中，后绘制的图形都会覆盖或隐藏先绘制的图形。这种行为被称为合成。默认行为是 `source-over`，即像你之前看到的那样，将当前图形绘制在画布上已有的图形之上。合成术语中，*source*\
  \ 指代正在绘制的图形，*destination* 指代已绘制的结果。除了 `source-over` 之外，你还可以使用 `globalCompositeOperation`\
  \ 属性配置其他 10 种行为。通过观察每种行为的示例，可以更好地理解它们。\n\n在本练习中，你将用一个红色方块与一个蓝色圆形进行重叠。这个操作将重复 11\
  \ 次，每次为 `globalCompositeOperation` 属性设置不同的值。为了实现这个效果，你需要创建 11 个 canvas 元素，并在每个元素上绘制相同的图形。\n\
  \n### 练习 23-5. 探索合成效果\n\n1.  使用基本标记创建一个新的网页 `Compositing.html`：\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n<title>第 23 章 -\
  \ 合成</title>\n<script src=\"Compositing.js\" defer></script>\n<link rel=\"stylesheet\"\
  \ href=\"Compositing.css\" />\n</head>\n<body>\n</body>\n</html>\n```\n\n2.  在 `body`\
  \ 元素中，使用以下标记创建 11 个新的 canvas 元素：\n\n```html\n<div>\n<canvas id=\"composting1\" width=\"\
  120\" height=\"120\"></canvas>\n<br />source-over\n</div>\n<div>\n<canvas id=\"\
  composting2\" width=\"120\" height=\"120\"></canvas>\n<br />destination-over\n</div>\n\
  <div>\n<canvas id=\"composting3\" width=\"120\" height=\"120\"></canvas>\n<br />source-in\n\
  </div>\n<div>\n<canvas id=\"composting4\" width=\"120\" height=\"120\"></canvas>\n\
  <br />destination-in\n</div>\n<div>\n<canvas id=\"composting5\" width=\"120\" height=\"\
  120\"></canvas>\n<br />source-out\n</div>\n<div>\n<canvas id=\"composting6\" width=\"\
  120\" height=\"120\"></canvas>\n<br />destination-out\n</div>\n<div>\n<canvas id=\"\
  composting7\" width=\"120\" height=\"120\"></canvas>\n<br />source-atop\n</div>\n\
  <div>\n<canvas id=\"composting8\" width=\"120\" height=\"120\"></canvas>\n<br />destination-atop\n\
  </div>\n<div>\n<canvas id=\"composting9\" width=\"120\" height=\"120\"></canvas>\n\
  <br />xor\n</div>\n<div>\n<canvas id=\"composting10\" width=\"120\" height=\"120\"\
  ></canvas>\n<br />copy\n</div>\n<div>\n<canvas id=\"composting11\" width=\"120\"\
  \ height=\"120\"></canvas>\n<br />lighter\n</div>\n```\n\n3.  创建一个 `Compositing.css`\
  \ 文件，并包含以下样式规则。这将把 canvas 元素格式化为三列，以便你在一个屏幕上看到全部 11 个示例。\n\n```css\nbody div {\n\
  -webkit-column-count: 3;\n-moz-column-count: 3;\ncolumn-count: 3;\n}\n```\n\n4.\
  \  添加包含以下代码的 `Compositing.js` 文件。\n\n```javascript\n\"use strict\";\nfor (var i\
  \ = 1; i <= 11; i++) {\nvar c = document.getElementById(\"composting\" + i);\nvar\
  \ cContext = c.getContext(\"2d\");\ncContext.fillStyle = \"red\";\ncContext.fillRect(10,\
  \ 20, 80, 80);\nswitch (i) {\ncase 1: cContext.globalCompositeOperation = \"source-over\"\
  ; break;\ncase 2: cContext.globalCompositeOperation = \"destination-over\"; break;\n\
  case 3: cContext.globalCompositeOperation = \"source-in\"; break;\ncase 4: cContext.globalCompositeOperation\
  \ = \"destination-in\"; break;\ncase 5: cContext.globalCompositeOperation = \"source-out\"\
  ; break;\ncase 6: cContext.globalCompositeOperation = \"destination-out\"; break;\n\
  case 7: cContext.globalCompositeOperation = \"source-atop\"; break;\ncase 8: cContext.globalCompositeOperation\
  \ = \"destination-atop\"; break;\ncase 9: cContext.globalCompositeOperation = \"\
  xor\"; break;\ncase 10: cContext.globalCompositeOperation = \"copy\"; break;\ncase\
  \ 11: cContext.globalCompositeOperation = \"lighter\"; break;\n}\ncContext.fillStyle\
  \ = \"blue\";\n```\n\n\n\n`cContext.beginPath();`\n\n`cContext.arc(65, 75, 40, 0,\
  \ (Math.PI * 2), true);`\n\n`cContext.fill();`\n\n![](img/index-448_1.jpg)\n\n##\
  \ 第 23 章 ■ Canvas\n\n此代码使用了一个`for`循环来处理所有 11 个 canvas 元素。它先获取对应的元素，再获得其绘图上下文，添加一个红色正方形，然后设置`globalCompositeOperation`属性，最后添加一个蓝色圆形，其位置与正方形略微错开。\n\
  \n5.  保存更改，并在浏览器中打开`Compositing.html`文件。网页应如图 23-13 所示。\n\n***图 23-13.** 演示合成选项*\n\
  \n合成选项如下：\n\n- `source-over`：这是默认操作。源元素（正在添加的元素）绘制在目标（该位置已有的内容）之上。\n- `destination-over`：这是`source-over`的反向操作，源元素添加在已有元素之下。\n\
  - `source-in`：仅显示源对象中与目标元素重叠的部分。请注意，目标元素完全不显示，它仅作为裁剪形状使用。\n- `destination-in`：仅显示目标对象中与源元素重叠的部分。\n\
  - `source-out`：仅显示源元素中不与目标元素重叠的部分。\n- `destination-out`：仅显示目标元素中不与源元素重叠的部分。\n- `source-atop`：源元素显示在目标元素之上，但整个形状被目标元素裁剪。\n\
  - `destination-atop`：源元素显示在目标元素之下，但整个形状被源元素裁剪。\n- `xor`：仅显示源元素和目标元素中不重叠的部分。\n- `copy`：这个名称可能具有误导性。它会绘制源元素并清除其他所有内容。\n\
  - `lighter`：绘制源元素和目标元素，重叠区域以更浅的颜色显示。实际颜色由源元素和目标元素的颜色值相加决定。\n\n> **提示** 这些合成选项的名称可能不太直观。建议你保留此图，以便日后在忘记`copy`等选项的作用时查阅。\n\
  \n### 本章小结\n\n在本章中，你使用`canvas`元素创建了一些图形化网页。你使用矩形和路径在画布上绘制形状，还在画布上添加了图像。画布一个非常强大的功能是应用变换。恰当地使用变换可以显著简化某些复杂的绘图应用程序。\n\
  \nCanvas 与 SVG 有着本质区别。在 SVG 中，每个形状都是一个独立的 DOM 节点。这提供了两个 Canvas 无法实现的重要特性：\n\n- \
  \  为单个形状附加事件处理程序。\n-   单个形状可以被操作。一个很好的例子是定义`:hover`伪规则，当鼠标悬停在形状上时，可以更改该形状的属性。\n\n\
  与 SVG 相反，Canvas 基于像素，这意味着它依赖于分辨率。注意，所有绘图命令都使用了像素位置或大小。当你在`canvas`元素上绘制形状时，该画布的像素会被相应调整，最终只保留像素内容的结果。\n\
  \nCanvas 由于其原始像素操作，效率通常会更高。而另一方面，SVG 必须执行大量的渲染（和重新渲染）。然而，对于内容密度较低的大型图像（如地图），SVG\
  \ 通常性能更好。\n\n在下一章中，你将使用拖放功能来实现一个跳棋游戏。\n\n## 第 24 章 ■ 拖放\n\n选择元素并将其拖动到其他位置的能力，是自然用户体验的一个绝佳范例。我至今还记得早期的苹果电脑，你可以通过将文件拖到垃圾桶图标上来删除它。这个操作，以及成百上千类似的操作，是桌面应用程序用户体验的关键组成部分。然而，Web\
  \ 应用程序在这一领域远远落后。借助 HTML5 中的拖放（DnD）API，你会发现 Web 应用程序正在快速追赶。\n\n在本章中，你将构建一个实现跳棋游戏的\
  \ Web 应用程序，使用 DnD API 在棋盘上移动棋子。我将首先解释概念以及 DnD 应用程序的结构。然后深入代码，演示各个方面。最后，我将介绍一些高级功能，包括在浏览器窗口之间拖放。\n\
  \n### 理解拖放\n\n在开始构建应用程序之前，我想先解释一下 DnD API 的基本概念。这将帮助你在开始编写代码时更好地理解上下文。我首先会解释被触发的事件；了解每个事件在何时、在哪个对象上触发非常重要。然后你将了解`dataTransfer`对象，你可以用它来将信息从被拖动的对象传递给每个事件，并最终传递给放置操作。你还可以使用它来配置拖动操作的各个方面。最后，我将向你展示如何使对象可拖动。\n\
  \n### 处理事件\n\n与桌面端的拖放一样，DnD 是一个基于事件的 API。当用户选择、移动并放下一个项目时，会触发事件，允许应用程序控制和响应这些操作。要有效使用此\
  \ API，你需要知道这些事件何时触发以及在哪个元素上触发。起初这可能看起来令人困惑，但一旦你理解了它，就会觉得很直接。\n\n> **提示** 我在第 [20](http://dx.doi.org/10.1007/978-1-4842-2463-2_20)\
  \ 章中解释了使用事件的基础知识。\n\n在 DnD 操作中，涉及两个元素：\n\n-   正在被拖动的元素，有时称为*源*。\n-   被放下的元素，通常称为*目标*。\n\
  \n© Mark J. Collins 2017  \nM. J. Collins, *Pro HTML5 with CSS, JavaScript, and\
  \ Multimedia*, DOI 10.1007/978-1-4842-2463-2_24\n\n![](img/index-451_1.jpg)\n\n\
  ## 第 24 章 ■ 拖放\n\n你可以将此理解为源是一个正在被放置在目标上的箭头，如图 24-1 所示。\n\n***图 24-1.** 源元素和目标元素*\n\
  \n在 DnD 操作期间，两个元素上都会触发事件，我指出了每个元素上触发的事件。在源元素上，`dragstart`、`drag`和`dragend`事件分别对应于\
  \ Windows 应用程序中的`mousedown`、`mousemove`和`mouseup`事件。当你单击一个元素并开始移动鼠标时，会触发`dragstart`事件，紧接着是`drag`事件，并且每次鼠标移动都会重复触发`drag`事件。最后，当释放鼠标按钮时，会触发`dragend`事件。\n\
  \n目标元素上的事件则更有趣一些。当鼠标在页面上移动时，一旦进入某个元素定义的区域，就会在该元素上触发`dragenter`事件。随着鼠标继续移动，会在目标元素上触发`dragover`事件。如果鼠标移出该元素，则会触发`dragleave`事件。此时，鼠标可能位于另一个元素上，那么该元素上就会触发`dragenter`事件。然而，如果在目标元素上释放鼠标按钮，则不会触发`dragleave`事件，而是触发`drop`事件。\n\
  \n现在让我们演练一个典型场景，看看这些事件的顺序。如表 24-1 所示。\n\n***表 24-1.** 事件序列*\n\n| 元素 | 事件 | 说明 |\n\
  | --- | --- | --- |\n| 源 | `dragstart` | 当鼠标被单击并开始移动时触发 |\n| 源 | `drag` | |\n\n\n\
  \n"
- "# 拖放事件\n\n## 事件汇总\n\n| 事件 | 描述 | 目标 |\n|-------|-------------|--------|\n| `drag`\
  \ | 鼠标移动时持续触发 | 源 |\n| `dragend` | 拖放操作结束时触发 | 源 |\n| `dragenter` | 鼠标进入目标元素区域时触发\
  \ | 目标 |\n| `dragenter` | 鼠标移动到新的目标元素时触发 | 目标 |\n| `dragleave` | 鼠标离开当前目标元素时触发 |\
  \ 目标 |\n| `dragover` | 鼠标指针悬停在目标元素上且移动时触发 | 目标 |\n| `dragstart` | 拖拽开始时触发 | 源 |\n\
  | `drop` | 鼠标按钮释放时触发 | 目标 |\n\n现在您已经了解了所使用的事件，可以通过为每个事件提供相应的处理程序来实现拖放操作。\n\n###\
  \ 使用数据转移对象\n\n还有一个拖放概念需要理解。仅仅在页面上拖拽元素并不实用；真正重要的是与元素关联的数据。在我之前给出的将文件拖到垃圾桶的例子中，看着图标被垃圾桶吞没可能很有趣，但最终目标是删除文件。在这种情况下，您正在将文件说明传递给回收站，以便它可以在文件系统中执行请求的操作。\n\
  \n#### 存储数据\n\n在拖放 API 中，`dataTransfer`对象用于存储与操作关联的数据。`dataTransfer`对象通常在`dragstart`事件处理程序中初始化。回想一下，此事件在源元素上触发。事件处理程序可以从源元素访问数据，并将其存储在`dataTransfer`对象中。然后，该数据会提供给所有其他事件处理程序，以便它们可以在特定处理中使用。最终，`drop`事件处理程序会使用此数据对该数据执行相应的操作。\n\
  \n`dataTransfer`对象作为事件对象的属性提供，该事件对象会传递给每个事件处理程序。您可以使用`setData()`方法将数据存储在`dataTransfer`对象中。为了指示数据类型，还需要提供相应的\
  \ MIME 类型。例如，要添加一些简单文本，可以像这样调用该方法：\n\n```javascript\ne.dataTransfer.setData(\"text\"\
  , \"Hello, World!\");\n```\n\n要在后续事件（例如`drop`事件）中访问此数据，请使用`getData()`方法，如下所示：`var\
  \ msg = e.dataTransfer.getData(\"text\");`\n\n检索数据时，您需要使用与存储数据时相同的 MIME 类型。\n\n\
  > **警告：** 并非所有浏览器都识别所有 MIME 类型。在此示例中，您可能期望使用`text/plain`。这在 Firefox 和 Opera 中运行良好，但在\
  \ Chrome 或 IE 中不受支持。但是，如果仅使用`text`，则所有浏览器都将支持。\n\n#### 使用放置效果\n\n`dataTransfer`对象的另一个目的是向用户提供关于项目放置时将执行的操作的反馈。这称为放置效果，有四个可能的值：\n\
  \n- `copy`：选中的元素将在目标位置被复制。\n- `move`：选中的元素将移动到目标位置。\n- `link`：将在目标位置创建指向选中项目的链接。\n\
  - `none`：不允许放置操作。\n\n当您开始拖拽项目时，光标将改变以指示项目放置在当前目标上时将发生的放置效果。这是标准的用户界面，您可以在大多数应用程序中尝试。例如，使用任何文本编辑器，选择一些文本，然后开始拖拽它。您应该会看到光标根据尝试移动的位置变为移动光标或“不允许”光标。如果在移动之前按住\
  \ Ctrl 键，您应该会看到复制光标而不是移动光标。\n\n在`dragstart`事件处理程序中，您可以根据选中的源元素指定允许的放置效果。您可以通过简单连接它们来指定多个允许的效果（例如`copyMove`），或者像这样指定所有效果：\n\
  \n```javascript\ne.dataTransfer.effectAllowed = \"all\"; // \"copy\", \"link\",\
  \ \"move\", \"copyLink\", \"linkMove\", \"copyMove\"\n```\n\n然后，在`dragover`事件中，您将指定如果将源元素放置在那里将发生的放置效果。如果该放置效果是允许的效果之一，光标将改变以指示该放置效果。但是，如果不允许该效果，光标将使用“不允许”图标。如果这不是一个接受放置的有效位置，请将放置效果设置为`none`，如下所示：\n\
  \n```javascript\nif (validLocation) {\n  e.dataTransfer.dropEffect = \"move\";\n\
  } else {\n  e.dataTransfer.dropEffect = \"none\";\n}\n```\n\n### 启用可拖拽元素\n\n现在您已经知道，可以通过在`dragover`事件中将放置效果设置为`none`来禁用元素上的`drop`事件。但是，如何控制哪些元素可以开始被拖拽呢？答案很简单：只需在元素的标记中设置`draggable`属性即可。例如，要创建一个可以拖拽的`div`，请输入如下标记：\n\
  \n```html\n<div id=\"myDiv\" draggable=\"true\">\n  <p>This div is draggable</p>\n\
  </div>\n```\n\n默认情况下，图像和链接是可拖拽的。访问 google.com 并尝试拖拽 Google 标志。当您移动光标时，您应该会看到该图像的一个略显暗淡的副本正在被拖拽。\n\
  \n如果您将此图像拖拽到 Firefox 浏览器窗口，Firefox 将导航到此图像。您刚刚见证了拖放的实际应用。因为使用拖放是一种非常自然的工作方式，浏览器尝试尽可能好地开箱即用。例如，如果您从看起来像\
  \ URL 的文本编辑器中拖拽一些文本到浏览器上，它将尝试导航到该地址。如果您将图像文件拖拽到浏览器上，它将导航到该文件或下载该文件。\n\n有时默认操作可能会导致您的自定义代码出现问题。我将在练习\
  \ 24-3 中向您展示如何禁用此功能。\n\n> **注意：** 有关拖放 API 的更多信息，请查看 W3C 规范：[`dev.w3.org/html5/spec/single-page.html#dnd`](http://dev.w3.org/html5/spec/single-page.html#dnd)。\n\
  \n### 创建跳棋应用程序\n\n为了演示拖放 API，您将创建一个 web 应用程序，显示一个典型的红白相间方格的跳棋棋盘。您将使用图像文件来表示棋子，并将其显示在初始起始位置。然后，您将创建事件处理程序，允许您将棋子移动到不同的方格。最后，您将添加逻辑来禁用非法移动。\n\
  \n> **提示：** 在本章中，当您向应用程序添加功能时，您将在此项目中添加和修改代码。如果对每个更改应在何处进行有任何疑问，最终代码列在附录 B 中，并且也可以通过源代码下载获得。\n\
  \n#### 创建项目\n\n对于本章，您将创建一个名为 `Checkers` 的单个网页。\n\n**练习 24-1. 创建 Web 项目**\n\n1. 创建一个名为\
  \ `Checkers.html` 的 HTML 文件，并以标准标记开头。\n\n```html\n<!DOCTYPE html>\n<html lang=\"\
  en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>Chapter 24 - Checkers</title>\n\
  \  <link rel=\"stylesheet\" href=\"Checkers.css\" />\n  <script src=\"Checkers.js\"\
  \ defer></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n2. 创建一个新的 `Checkers.js`\
  \ 脚本文件；您将在完成练习时向其中添加代码。\n\n3. 创建一个新的 `Checkers.css` 文件来存放样式规则。\n\n4. 本章的源代码下载包含一个包含五个图像的\
  \ `Images` 文件夹。在您的 Web 项目中创建一个 `Images` 文件夹，并将所有五个图像复制到该文件夹中。\n\n#### 绘制跳棋棋盘\n\n\
  为了绘制棋盘，您将为每个方格使用一个单独的 `div` 元素。您需要 8 行，每行 8 个 `div` 元素。您可以手动在 HTML 文档中创建 64 个 `div`\
  \ 元素。但是，为了提高效率，您将使用 JavaScript 创建它们。\n\n\n\n## 注意\n在前一章中，你使用了`canvas`元素绘制棋盘。然而，这在此应用中并不适用，因为你需要为每个方格使用独立的`DOM`元素。你可能想尝试使用`SVG`来创建棋盘，因为每个`rect`元素都是独立的`DOM`元素；但是，`SVG`元素不支持`DnD\
  \ API`。\n\n## 练习 24-2：绘制棋盘\n\n1. 在`body`元素中插入一个`div`元素；这将包含棋盘。\n\n```html\n<body>\n\
  \  <div id=\"board\">\n  </div>\n</body>\n```\n\n2. 将以下实现添加到`Checkers.js`文件中。\n\n\
  ```javascript\n\"use strict\";\n\nfunction createBoard() {\n  var board = document.getElementById(\"\
  board\");\n  for (var y=0; y < 8; y++) {\n    var row = document.createElement(\"\
  div\");\n    row.className = \"row\";\n    board.appendChild(row);\n    for (var\
  \ x=0; x < 8; x++) {\n      var square = document.createElement(\"div\");\n    \
  \  square.id = x.toFixed() + y.toString();\n      if ((x + y) % 2) {\n        square.className\
  \ = \"bblack\";\n      }\n      else {\n        square.className = \"bwhite\";\n\
  \      }\n      square.setAttribute(\"draggable\", \"false\");\n      row.appendChild(square);\n\
  \    }\n  }\n}\n\ncreateBoard();\n```\n\n此代码使用两个嵌套的`for`循环来创建`div`元素。第一个循环创建表示行的`div`。在第二个`for`循环内部，通过拼接`x`和`y`变量来计算`id`变量。类名在`bwhite`和`bblack`之间交替。对于偶数行，偶数列为黑色，奇数列为白色；奇数行则相反。`draggable`属性设置为`false`，因为我们不希望拖动方格，只希望拖动棋子。\n\
  \n3. 现在你需要添加一些样式规则来设置每个方格的大小和颜色。\n\n行使用`display: table-row`，方格使用`display: table-cell`（详见第[13](http://dx.doi.org/10.1007/978-1-4842-2463-2_13)章）。将以下样式规则添加到`Checkers.css`文件中。\n\
  \n```css\n.row {\n  display: table-row;\n  margin: 0;\n  padding: 0;\n}\n\n.bblack,\
  \ .bwhite {\n  display: table-cell;\n  border-color: #b93030;\n  border-width: 1px;\n\
  \  border-style: solid;\n  width: 48px;\n  height: 48px;\n  margin: 0;\n  padding:\
  \ 0;\n}\n\n.bblack {\n  background-color: #b93030;\n}\n\n.bwhite {\n  background-color:\
  \ #f7f7f7;\n}\n```\n\n4. 保存更改并在浏览器中显示`Checkers.html`文件。页面应如图 24-2 所示。\n\n![图 24-2：初始棋盘](img/index-457_1.jpg)\n\
  \n**图 24-2.** 初始棋盘\n\n5. 现在，通过在相应的`div`元素中包含一个`img`元素来添加跳棋棋子。将以下代码以粗体显示添加到`createBoard()`函数中。\n\
  \n```javascript\nelse {\n  square.className = \"bwhite\";\n}\n\n// 如果方格应该放置棋子...\n\
  if ((x + y) % 2 != 0 && y != 3 && y != 4) {\n  var img = document.createElement(\"\
  img\");\n  if (y < 3) {\n    img.id = \"w\" + square.id;\n    img.src = \"Images/WhitePiece.png\"\
  ;\n  }\n  else {\n    img.id = \"b\" + square.id;\n    img.src = \"Images/BlackPiece.png\"\
  ;\n  }\n  img.className = \"piece\";\n  img.setAttribute(\"draggable\", \"true\"\
  );\n  square.appendChild(img);\n}\n\nsquare.setAttribute(\"draggable\", \"false\"\
  );\nrow.appendChild(square);\n```\n\n要确定合适的方格，第一条规则是跳棋棋子只位于黑色（在此例中为红色）方格上。因此，代码使用了与计算`class`属性相同的`(x\
  \ + y) % 2 != 0`逻辑。然后，棋子仅放置在最上面三行和最下面三行，所以代码排除了第 3 行和第 4 行。如果行数小于 3，将添加白色棋子，否则添加黑色棋子。代码通过在方格的`id`前加上`w`或`b`来计算`img`元素的`id`。请注意，`draggable`属性设置为`true`。\n\
  \n![图 24-3：包含棋子的棋盘](img/index-458_1.jpg)\n\n6. `img`元素的`class`属性设置为`piece`。现在将以下规则添加到现有的`Checkers.css`文件中，这将添加内边距，使棋子居中于方格内。\n\
  \n```css\n.piece {\n  margin-left: 4px;\n  margin-top: 4px;\n}\n```\n\n7. 刷新浏览器，你现在应该可以看到棋子，如图\
  \ 24-3 所示。\n\n\n\n### *图 24-3.* 初始棋盘与棋子\n\n#### 添加拖放支持\n\n`img`元素已添加了`draggable`属性，因此你应该能够选中并拖拽棋子。但你会发现所有格子都无法接收拖放操作，光标会显示“禁止”图标。如果你想试试浏览器的默认功能，可以尝试将图片拖拽到地址栏，浏览器会跳转到该图片的\
  \ URL。现在我们将添加代码以启用拖放功能，让你可以移动棋子。之后还会优化代码，确保只允许合法移动。\n\n### 允许拖放操作\n\n现在你已拥有可拖拽元素，完成拖放操作只需一个能接收拖放的目标元素。为此需要为`dragover`事件添加事件处理器来设置拖放效果。默认情况下`effectAllowed`属性值为`all`，因此将拖放效果设置为`move`、`copy`或`link`都是有效设置。\n\
  \n#### **练习 24-3：实现拖放功能**\n\n1. 使用以下代码在`Checkers.js`脚本中添加`allowDrop()`函数。该代码使用了第\
  \ 16 章介绍的`querySelectorAll()`函数来获取所有黑色格子，然后遍历返回的集合，为每个元素注册`dragover`事件的事件处理器。\n\
  ```javascript\nfunction allowDrop() {\n    // 为所有黑色格子绑定目标事件\n    var squares = document.querySelectorAll('.bblack');\n\
  \    var i = 0;\n    while (i < squares.length) {\n        var s = squares[i++];\n\
  \        // 添加事件侦听器\n        s.addEventListener('dragover', dragOver, false);\n\
  \    }\n}\n```\n\n2. 使用以下代码实现`dragover`事件处理器。`dragover()`函数调用`preventDefault()`来取消浏览器的默认操作，然后获取`dataTransfer`对象并将`dropEffect`属性设置为`move`。\n\
  ```javascript\n// 处理 dragover 事件\nfunction dragOver(e) {\n    e.preventDefault();\n\
  \    e.dataTransfer.dropEffect = \"move\";\n}\n```\n\n3. 在`Checkers.js`文件中添加对`allowDrop()`函数的调用。\n\
  ```javascript\nallowDrop();\n```\n\n4. 刷新浏览器并尝试拖拽棋子。现在所有黑色格子上应该都会显示移动光标，而白色格子上仍显示“禁止”光标。尝试将棋子拖放到空的黑色格子上。由于尚未实现拖放事件处理器，浏览器会执行默认的拖放操作（具体行为因浏览器而异，可能会跳转到图片文件）。\n\
  \n### 执行自定义拖放操作\n\n默认操作并不符合我们的需求，因此需要实现拖放事件处理器并提供自定义逻辑。拖放事件处理器是完成所有实际工作的地方——就像垃圾桶图标被拖放时会删除文件。在这个应用中，拖放操作会在目标位置创建新的`img`元素并移除原有图片。\n\
  \n要实现拖放功能，还需要提供`dragstart`事件处理器。在`dragstart`事件处理器中，需要将被拖拽`img`元素的`id`存储到`dataTransfer`对象中，供拖放事件处理器使用，以便知道要移除哪个元素。\n\
  \n1. 在`Checkers.js`脚本中添加以下函数作为`dragstart`事件处理器。该代码获取源元素（记住`dragstart`事件在源元素上触发）的`id`（即被选中的棋子图片的`id`），并将其存储到`dataTransfer`对象中。由于需要移动图片，该函数还将允许的效果设置为`move`。\n\
  ```javascript\n// 处理 dragstart 事件\nfunction dragStart(e) {\n    e.dataTransfer.effectAllowed\
  \ = \"move\";\n    e.dataTransfer.setData(\"text\", e.target.id);\n}\n```\n\n2.\
  \ 在`Checkers.js`脚本中添加以下代码实现拖放事件处理器。\n```javascript\n// 处理 drop 事件\nfunction drop(e)\
  \ {\n    e.stopPropagation();\n    e.preventDefault();\n    // 获取正在被拖拽的 img 元素\n\
  \    var droppedID = e.dataTransfer.getData(\"text\");\n}\n```\n\n\n\n```js\nvar\
  \ droppedPiece = document.getElementById(droppedID);\n\n// 在目标位置创建一个新的图片元素\nvar\
  \ newPiece = document.createElement(\"img\");\n\nnewPiece.src = droppedPiece.src;\n\
  \nnewPiece.id = droppedPiece.id.substr(0, 1) + e.target.id;\n\nnewPiece.draggable\
  \ = true;\n\nnewPiece.classList.add(\"piece\");\n\nnewPiece.addEventListener(\"\
  dragstart\", dragStart, false);\n\ne.target.appendChild(newPiece);\n\n// 移除之前的图片\n\
  droppedPiece.parentNode.removeChild(droppedPiece);\n```\n\n这段代码首先调用 `stopPropagation()`\
  \ 函数，阻止该事件冒泡到父元素。同时调用 `preventDefault()` 来取消浏览器的默认行为。然后从 `dataTransfer` 对象中获取 `id`，并利用它访问\
  \ `img` 元素。接下来，函数创建一个新的 `img` 元素，并设置所有必要的属性，同时添加所需的事件处理函数。正如之前解释的，drop 事件会在目标元素（即被拖放到的元素）上触发。新\
  \ `img` 元素的 `id` 通过新位置的 `id` 计算而来，该 `id` 从事件对象的 `target` 属性获得。ID 前缀（`b` 或 `w`）则从现有的\
  \ `img` 元素中复制。最后，代码移除现有的 `img` 元素。\n\n接下来需要绑定事件处理函数。为此，请在 `allowDrop()` 函数中添加以下加粗显示的代码。\n\
  \n```js\nvar squares = document.querySelectorAll('.bblack');\nvar i = 0;\nwhile\
  \ (i < squares.length) {\n  var s = squares[i++];\n  // 添加事件监听器\n  s.addEventListener('dragover',\
  \ dragOver, false);\n  s.addEventListener('drop', drop, false);\n}\n\n// 为所有图片绑定源事件\n\
  i = 0;\nvar pieces = document.querySelectorAll('img');\nwhile (i < pieces.length)\
  \ {\n  var p = pieces[i++];\n  p.addEventListener('dragstart', dragStart, false);\n\
  }\n```\n\n由于棋盘格是目标元素，因此为它们添加了 `drop` 事件处理函数。而 `dragstart` 事件需要添加到 `img` 元素上。这段代码通过\
  \ `querySelectorAll()` 函数获取所有 `img` 元素。\n\n重新启动浏览器，现在你应该能将棋子拖放到任意未占用的红色格子上。\n\n\
  #### 提供视觉反馈\n\n拖放元素时，最好提供一些视觉反馈来指示选中的对象。通过在 `dragover` 事件处理函数中设置 `dropEffect` 属性，光标可以显示拖放操作是否被允许。但这还不够，源元素和目标元素都应在视觉上突出显示，以便用户能轻松看出释放鼠标后棋子将从哪里移动到哪里。\n\
  \n为此，你需要动态地为源元素和目标元素添加 `class` 属性，然后通过常规的 CSS 样式规则来设置它们的样式。对于源元素，可以使用 `dragstart`\
  \ 和 `dragend` 事件来分别添加和移除 `class` 属性。同理，对于目标元素，则使用 `dragenter` 和 `dragleave` 事件。\n\
  \n### 练习 24-4：添加视觉反馈\n\n1. 你已经有一个 `dragstart` 事件处理函数，请在 `dragStart()` 函数中添加以下加粗显示的代码。这将为元素添加\
  \ `selected` 类。\n\n```js\nfunction dragStart(e) {\n  e.dataTransfer.effectAllowed\
  \ = \"all\";\n  e.dataTransfer.setData(\"text/plain\", e.target.id);\n  e.target.classList.add(\"\
  selected\");\n}\n```\n\n2. 使用以下代码添加 `dragEnd()` 函数，该函数会在拖放操作完成后简单移除 `selected` 类。\n\
  \n```js\n// 处理 dragend 事件\nfunction dragEnd(e) {\n  e.target.classList.remove(\"\
  selected\");\n}\n```\n\n3. 使用以下代码添加 `dragEnter()` 和 `dragLeave()` 函数。它们分别为元素添加和移除\
  \ `drop` 类。\n\n```js\n// 处理 dragenter 事件\nfunction dragEnter(e) {\n  e.target.classList.add('drop');\n\
  }\n\n// 处理 dragleave 事件\nfunction dragLeave(e) {\n  e.target.classList.remove(\"\
  drop\");\n}\n```\n\n4. 由于新增了三个事件处理函数，你需要添加代码来注册事件监听器。请在 `allowDrop()` 函数中添加加粗显示的代码。\n\
  \n\n```javascript\nvar squares = document.querySelectorAll('.bblack');\n\nvar i\
  \ = 0;\n\nwhile (i < squares.length){\n\nvar s = squares[i++];\n\n// 添加事件监听器\ns.addEventListener('dragover',\
  \ dragOver, false);\n\ns.addEventListener('drop', drop, false);\n\ns.addEventListener('dragenter',\
  \ dragEnter, false);\n\ns.addEventListener('dragleave', dragLeave, false);\n\n}\n\
  ```\n\n```javascript\ni = 0;\n\nvar pieces = document.querySelectorAll('img');\n\
  \nwhile (i < pieces.length){\n\nvar p = pieces[i++];\n\np.addEventListener('dragstart',\
  \ dragStart, false);\n\np.addEventListener('dragend', dragEnd, false);\n\n}\n```\n\
  \n5. 现在需要对 `drop` 事件处理程序做几处修改。你在 `dragenter` 事件中为目标元素添加了 `drop` 类，然后在 `dragleave`\
  \ 事件中将其移除。然而，如果用户拖放了图片，`dragleave` 事件不会被触发。因此，你也需要在 `drop` 事件中移除 `drop` 类。此外，在创建新的\
  \ `img` 元素时，还需要绑定 `dragend` 事件处理程序。\n\n6. 添加以粗体显示的代码。\n\n```javascript\n// 在目标位置创建新的图片\n\
  var newPiece = document.createElement(\"img\");\nnewPiece.src = droppedPiece.src;\n\
  newPiece.id = droppedPiece.id.substr(0, 1) + e.target.id;\nnewPiece.draggable =\
  \ true;\nnewPiece.classList.add(\"piece\");\nnewPiece.addEventListener(\"dragstart\"\
  , dragStart, false);\nnewPiece.addEventListener(\"dragend\", dragEnd, false);\n\
  e.target.appendChild(newPiece);\n\n// 移除之前的图片\ndroppedPiece.parentNode.removeChild(droppedPiece);\n\
  \n// 移除目标元素的拖放效果\ne.target.classList.remove('drop');\n```\n\n7. 最后，需要为 `drop` 和\
  \ `selected` 值定义 CSS 规则。这里选择设置 `opacity` 属性，但你也可以轻松添加边框、更改背景颜色，或实现任意数量的效果来达到预期目的。将以下规则添加到\
  \ `Checkers.css` 文件中：\n\n```css\n.bblack.drop {\n  opacity: 0.5;\n}\n\n.piece.selected\
  \ {\n  opacity: 0.5;\n}\n```\n\n8. 刷新浏览器并尝试将图片拖放到红色方块；你应该能看到预期的视觉反馈，如图 24-4 所示。\n\
  \n![](img/index-464_1.png)\n\n**图 24-4.** 显示拖放操作的视觉反馈\n\n#### 强制执行游戏规则\n\n你可能已经注意到，你可以将棋子移动到任意红色方块。当前的实现并未强制执行任何规则来确保走法合法。现在需要添加该逻辑。以下事件将需要此逻辑：\n\
  \n* `dragover`：对非法走法将 `dropEffect` 设置为 `none`\n* `dragenter`：仅对有效的放置位置更改样式\n* `drop`：仅在走法合法时执行移动\n\
  \n你将实现一个 `isValidMove()` 函数，该函数将评估尝试的走法，如果非法则返回 `false`。然后在这三个事件处理程序中分别调用此函数。\n\n\
  ### 验证走法\n\n幸运的是，跳棋的规则相当简单。由于 `dragover` 事件处理程序没有添加到白色方块上，因此已禁止将棋子放到那里，这进一步简化了所需的工作。以下是需要强制执行的规则：\n\
  \n* 不能移动到已有棋子的格子。\n* 棋子只能向前移动。\n* 棋子只能沿对角线移动一格，或者如果跳过被占用的格子，则沿对角线移动两格。\n* 只能跳过不同颜色的棋子。\n\
  * 被跳过的棋子必须从棋盘上移除。\n\n> **注意** 稍后将添加逻辑来处理棋子升变为王。\n\n**练习 24-5. 强制执行规则**\n\n1. 通过在\
  \ `Checkers.js` 脚本中添加以下代码来实现 `isValidMove()` 函数。\n\n```javascript\nfunction isValidMove(source,\
  \ target, drop) {\n\n  // 获取棋子的前缀和位置\n  var startPos = source.id.substr(1, 2);\n\
  \  var prefix = source.id.substr(0, 1);\n\n  // 获取放置位置，去掉前缀（如果有）\n  var endPos =\
  \ target.id;\n  if (endPos.length > 2) {\n    endPos = endPos.substr(1, 2);\n  }\n\
