  selected\");\n        // 使用自定义拖放图像\n        var dragIcon = document.createElement(\"\
  img\");\n        dragIcon.src = \"Images/smiley.jpg\";\n        e.dataTransfer.setDragImage(dragIcon,\
  \ 0, 0);\n    }\n}\n```\n\n尝试这个应用，当你移动棋子时，你应该会看到如图 24-6 所示的笑脸。\n\n![图 24-6](img/index-476_1.jpg)\n\
  \n**图 24-6.** 更改拖放图像\n\n#### 在窗口之间拖放\n\n正如我在本章开头提到的，源元素和目标元素上会触发不同的事件。这些元素可能位于不同的浏览器窗口，甚至不同的应用中。然而，这个过程的工作方式是相同的。\n\
  \n为了演示这一点，打开浏览器的第二个实例，并导航到跳棋应用。\n\n你应该会看到两个浏览器窗口都显示棋盘。在一个窗口中选择一个棋子，并将其拖到第二个窗口中的某个方格。你会注意到，你只能将棋子放到相对于第一个窗口中原始位置的方格上。当你放下棋子时，棋子被移动到放下位置，但从第二个窗口（而非你最初选择的图像）中被移除。\n\
  \n跨窗口拖放的关键是`dataTransfer`对象。该对象在目标对象的`dragenter`、`dragover`和`dragleave`事件中提供。拖放从哪里开始并不重要；这些信息被放置在`dataTransfer`对象中，并提供给任何支持这些事件的窗口。\n\
  \n当`drop`事件接收到这些信息时，它会移除`dataTransfer`对象中指定位置的`img`元素。因为`drop`事件在第二个窗口中被处理，所以`img`元素从第二个窗口中被移除。\n\
  \n`drag`和`dragend`事件在源元素上触发。在这些事件处理程序中编写的任何逻辑都在第一个窗口中执行。请注意，被选中的`img`元素在拖放期间被静音，但在放下执行后恢复正常。这是因为在源元素上触发的`dragend`事件清除了`selected`类。\n\
  \n当你像这里一样控制操作的两端时，你可以决定需要传输哪些数据并实现两组事件处理程序。在许多情况下，你只能控制过程的一端。例如，用户可以将文件从 Windows\
  \ 资源管理器拖到你的网页上。`dragstart`、`drag`和`dragend`事件（或它们的等效事件）在 Windows 资源管理器应用中触发，你无法控制。然而，`dragenter`、`dragover`、`dragleave`和`drop`事件都在你的网页上触发。你可以根据被放下的元素以及`dataTransfer`对象的内容来决定是否接受放下。你还控制放下完成时发生的过程。\n\
  \n#### 总结\n\n在本章中，我解释了作为 DnD API 一部分触发的所有事件，以及它们分别在哪些元素上触发。源元素接收以下事件：\n\n- `dragstart`：当元素被选中且鼠标移动时\n\
  - `drag`：鼠标移动时持续调用\n- `dragend`：当鼠标按钮释放时\n\n以下事件在目标元素上触发：\n\n- `dragenter`：当鼠标首次进入目标空间时\n\
  - `dragover`：当鼠标在目标上移动时持续触发\n- `dragleave`：当鼠标离开目标空间时\n- `drop`：当鼠标按钮释放时\n\n`dataTransfer`对象用于传递关于源元素的信息。它在所有事件处理程序中提供，尤其被`drop`事件处理程序用于执行必要的处理。这也使得跨越应用的拖放成为可能。\n\
  \n`dragover`事件处理程序设置`dropEffect`，该属性控制所使用的光标。将其设置为`none`将导致使用“不允许”光标，表示源元素不能放在那里。\n\
  \n为了提供一些视觉反馈，`dragstart`和`dragend`事件处理程序应修改源元素，以指示其被选中并正在拖放。同样地，`dragenter`和`dragleave`事件处理程序应高亮目标元素。这将为用户提供一种简单的方式来查看所选元素将放在何处。\n\
  \n你创建的示例应用实现了一些复杂的规则，用于确定哪些元素可以被拖放以及它们可以被放在何处。\n\n在下一章中，我将解释如何使用 Indexed DB 技术，该技术提供了客户端的数据库类似功能。\n\
  \n"
- '# 第 25 章 ■ Indexed DB


  随着浏览器功能的发展，在客户端设备上提供越来越多的功能，本地存储和操作数据的需求也随之增加。为了满足这一需求，Indexed DB 技术应运而生。这是一个使用键和索引来存储和检索对象的
  API。


  本章将演示如何使用 Indexed DB 在客户端存储和使用数据。如果你习惯于使用 SQL 数据库，我要提醒你，这不是一个 SQL 数据库。一旦你掌握了它，它会非常强大和有用，但在学习本章时，你需要调整你的视角，暂时搁置你的
  SQL 经验。


  为了探索 Indexed DB 的能力，你将重写在[第 23 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_23)中使用
  canvas 创建的棋盘应用。在我解释每个练习时，我不会深入 canvas 的细节；不过，如果你需要更多信息，请参考[第 23 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_23)。你的新版本应用将创建对象存储以定义每个棋子的位置，然后在移动棋子时操作这些数据。


  ### 介绍 Indexed DB


  在我开始详细演示之前，有一些关键点我认为将有助于你更好地理解 Indexed DB 的工作方式。像其他数据库一样，数据被放置在一个持久的数据存储中。


  在这种情况下，数据位于本地硬盘上。数据是永久性的。




  '
- "# IndexedDB 实体介绍\n\n我将详细解释这些实体，但首先介绍它们及其关系。\n\n一个数据库由多个*对象存储*（object stores）组成。每个对象存储是一个对象的集合，每个对象通过唯一键（key）标识。一个对象存储可以有一个或多个索引。每个*索引*提供了另一种识别对象存储键的方法。如图\
  \ 25-1 所示。\n\n© Mark J. Collins 2017\n\nM. J. Collins, *Pro HTML5 with CSS, JavaScript,\
  \ and Multimedia*, DOI 10.1007/978-1-4842-2463-2_25\n\n![Figure 25-1](img/index-479_1.jpg)\n\
  \n**图 25-1.** 数据库实体\n\n对象存储通过*事务*（transaction）对象访问。创建事务时，必须定义其作用域（scope）。这指明了它将引用哪些对象存储，以及是读取还是写入数据库。\n\
  \n### 使用对象存储\n\n主要的存储单元称为对象存储（object store）。这个名称很贴切，因为它们只是通过键引用的对象集合。可以将其视为一组键值对，其中值为具有一组属性的对象。可以使用内联键（inline\
  \ key），即对象的某个属性作为键。例如，如果对象具有唯一值的`id`属性，可以将其用作内联键。如果使用外联键（out-of-line keys），则在向存储添加对象时需要指定键。或者，可以使用键生成器（key\
  \ generator），对象存储会自动分配递增的键值。以下代码演示了这些选项：\n\n```javascript\n// 使用内联键\nvar typeStore\
  \ = db.createObjectStore(\"pieceType\", { keyPath: \"id\" });\ntypeStore.add(pieceType);\n\
  \n// 使用外联键\nvar sampleStore = db.createObjectStore(\"sample\", { });\nsampleStore.add(sample,\
  \ 5);\n\n// 使用键生成器\nvar pieceStore = db.createObjectStore(\"piece\", { autoIncrement:\
  \ true });\npieceStore.add(piece);\n```\n\n顾名思义，还可以在对象存储上创建索引；实际上，可以创建任意数量的索引。索引可以快速找到特定对象或对象集合。索引是一组键值对，其中值是对应对象存储的键。例如，如果有客户对象存储，并希望按姓氏搜索，可以在对象的`lastName`属性上创建索引。数据库会自动为存储中的每个对象在索引中创建一个条目。该条目包含姓氏和对应对象的键。以下代码演示了如何使用索引：\n\
  \n```javascript\n// 在 lastName 属性上创建索引\ncustomerStore.createIndex(\"lastName\",\
  \ \"id\", { unique: true });\n\n// 获取索引\nvar index = customerStore.index(\"lastName\"\
  );\nindex.get(lastName).onsuccess = function(); // 获取对象\nindex.getKey(lastName).onsuccess\
  \ = function(); // 获取键\n```\n\n`createIndex()`函数的第二个参数（本例中为`id`）指定了键路径（key path）。这告诉数据库引擎如何从对象中提取键。对于内联键，这是用于定义唯一键的属性名。\n\
  \nIndexedDB 不支持对象存储之间的关系。例如，无法强制实施外键关系。当然可以使用外键，即一个对象存储中的属性是另一个对象存储中的键，我将在后面演示。但数据库不会强制实施此约束。此外，也无法在对象存储之间执行连接（join）操作。\n\
  \n### 定义数据库\n\n打开数据库时，需要实现三个事件处理器：\n\n* `onsuccess`：数据库已打开；进行相关操作。\n* `onerror`：发生了错误，通常是访问问题。\n\
  * `onupgradeneeded`：需要创建或升级数据库。\n\n打开数据库时，如果数据库不存在，会自动创建；但会触发`onupgradeneeded`事件。必须为此事件实现事件处理器，该处理器将创建对象存储并用默认数据填充它们。这是唯一允许更改数据库结构的地方。需要记住的重要一点是：`onupgradeneeded`事件在`onsuccess`事件之前触发。\n\
  \n`open()`调用还指定了版本号。如果不是当前版本，在这种情况下也会触发`onupgradeneeded`事件。事件处理器需要处理结构更改，以匹配调用者请求的版本。可以像这样查询数据库的当前版本：\n\
  \n```javascript\nvar request = dbEng.open(\"Sample\", 2); // 获取版本 2\nrequest.onupgradeneeded\
  \ = function (event) {\n    alert(\"Configuring database - current version is \"\
  \ + e.oldVersion +\n          \", requested version is \" + e.newVersion);\n}\n\
  ```\n\n根据当前版本，代码可能需要执行不同的操作。\n\n### 异步处理\n\nIndexedDB 的一个关键方面可能需要适应，即其异步处理；几乎所有数据库操作都是异步执行的。一般模式是调用一个方法执行数据库操作，如打开数据库或检索一组记录（对象）。这会返回一个请求对象。然后必须为该请求对象实现`onsuccess`和`onerror`事件处理器。如果请求成功，则调用`onsuccess`处理器，并通过事件对象传递方法调用的结果。\n\
  \n对于需要多次数据库调用的复杂处理，需要小心地嵌套事件处理器，并考虑它们的执行时机。例如，如果需要发起三个数据库请求，代码可能如下所示：\n\n```javascript\n\
  var request = dbCall1()\nrequest.onsuccess = function (e1) {\n    f1(e1.target.result);\n\
  \    dbCall2().onsuccess = function (e2) {\n        f3(e2.target.result, e1.target.result);\n\
  \        dbCall3().onsuccess = function (e3) {\n            f5(e3.target.result,\
  \ e2.target.result, e1.target.result);\n        }\n        f4(e2.target.result);\n\
  \    }\n    f2(e1.target.result);\n}\nrequest.onerror = function(e) {\n    alert(\"\
  The call failed\");\n}\n```\n\n这段代码依次调用`dbCall1()`、`dbCall2()`和`dbCall3()`，它们将按顺序处理。换句话说，`dbCall2()`不会启动，直到`dbCall1()`完成且成功。每个调用都提供了`onsuccess`事件处理器，该处理器发起下一次调用。如果第一次调用失败，则会弹出警报。可能出乎意料的是非数据库调用的执行顺序。数据库调用立即返回，事件处理器稍后在操作完成时调用。一旦调用`dbCall2()`，函数就返回，然后执行`f2()`。稍后`dbCall2()`完成，其事件处理器被调用，并执行`f3()`。\n\
  \n> **提示：** `onerror`事件会冒泡到层级结构。例如，发生在请求对象上的错误，如果未被处理，将冒泡到事务对象。如果仍未处理，将冒泡到数据库对象。在许多情况下，可以仅在数据库级别使用一个事件处理器来处理所有错误。\n\
  \n由于嵌套方式，事件处理器可以访问先前调用的事件对象。因此，应该为事件参数使用唯一的名称。这样可以避免歧义。另外，注意使用闭包来访问这些事件对象。如前所述，`f2()`在`f3()`之前调用，因此`dbCall1()`的事件处理器（定义了`e1`参数）在`dbCall2()`的事件处理器执行时已完成且不再作用域内。JavaScript\
  \ 的闭包特性允许后续的事件处理器访问该对象。这一点很重要，因为如果需要访问所有三个对象存储来完成操作，必须等待所有三个都完成，然后访问所有三个结果。\n\n\n\
  \n"
- "# 排版后的内容\n\n为避免闭包问题，**提示**：你可以从前两次数据库调用中提取所需属性，并将其存储在局部变量中（在 `dbCall1()` 调用之前声明）。然后在\
  \ `f5()` 调用中，使用这些变量代替 `e1` 和 `e2` 事件对象。这仅仅是个人偏好问题，因为两种方法都能正常工作。\n\n### 使用事务\n\n\
  所有数据访问（包括读取和写入）都在事务内完成，因此你必须首先创建一个事务对象。创建事务时，需要指定其作用域（由其将要访问的对象存储定义），同时指定模式（只读或读写）。然后，你可以从事务中获取对象存储，并像这样从存储中获取或放入数据：\n\
  \n```\nvar xact = db.transaction([\"piece\", \"pieceType\"], \"readwrite\");\nvar\
  \ pieceStore = xact.objectStore(\"piece\");\n```\n\n对于读写事务，数据更改在事务完成前不会提交。\n\n一个值得思考的问题是：“事务何时完成？”当没有未完成的请求时，事务即告完成。请记住，一切都是基于请求的。你发出一个请求，然后实现一个事件处理程序，在请求完成时执行操作。如果该事件处理程序对该事务发出另一个请求，则事务保持活跃状态。这是嵌套事件处理程序的另一个重要原因。如果你在未发出其他请求的情况下结束事件处理程序，事务将完成，所有更改都将提交。如果之后尝试使用该事务，你将收到\
  \ `TRANSACTION_INACTIVE_ERR` 错误。\n\n另一点需要记住的是，读写事务的作用域不能重叠。如果你创建了一个读写事务，只要第二个事务不包含与第一个事务相同的对象存储，就可以创建第二个事务。如果它们的作用域重叠，则必须等待第一个事务完成，再创建第二个。而只读事务的作用域可以重叠。\n\
  \n### 创建应用程序\n\n首先，你将使用 Canvas 创建一个棋盘，并为棋子配置图像，就像在[第 23 章](http://dx.doi.org/10.1007/978-1-4842-2463-2_23)中那样。\n\
