  \ 26 章 ■ 地理定位与地图绘制**\n\n#### 添加图钉\n\n现在，你将在地图上显示一些图钉。要添加图钉，首先创建一个`Pushpin`对象，指定其位置。然后将其添加到地图的实体集合中。首先，你将在当前位置添加一个默认图钉。稍后，你将添加自定义图钉来指示兴趣点。\n\
  \n将以下粗体显示的代码添加到`DisplayMap()`函数的末尾：\n\n```javascript\nfunction DisplayMap() {\n\
