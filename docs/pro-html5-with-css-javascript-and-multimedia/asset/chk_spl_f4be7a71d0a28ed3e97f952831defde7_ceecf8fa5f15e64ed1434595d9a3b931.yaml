    `## 创建一个棋盘`。
  - 实际上，第23章的标题 `# 第 23 章` 或 `## 第 23 章` 应该在 13634 行之前。既然文本中没有，且 13634 是 `##` 级别，它极有可能是第23章的**第一个小节**，而不是章标题。因此，在此处分章（如果意图是划分章）是错误的。正确的做法是，如果找不到章标题，可能不应该在这里分章，或者需要回溯。但鉴于后续有页眉佐证，也许章标题确实丢失了。
