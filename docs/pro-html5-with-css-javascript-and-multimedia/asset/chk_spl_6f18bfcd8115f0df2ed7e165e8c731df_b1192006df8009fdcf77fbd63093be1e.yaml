- 'no': 3088
  overturn_probability: 0.1
  alternative: 子章标题（非分章理由不充分）
  counter_evidence:
  - 该行内容为 `## 第 4 章：HTML 结构元素`。
  - 虽然Markdown标记为二级标题（##），但文本内容包含“第 4 章”。
  - 在“部分-章节”模式下，部分和章都需划分。此处“第4章”是部分内的章，应划分为新章。
  - 注意：通常Markdown中 `#` 是一级，`##` 是二级。若全书最高层级是 `#`，则 `##` 可能是子层级。但规则指出“部分”和“章”都要分。如果“第二部分”是
    `#`，而“第4章”是 `##`，说明章节层级低于部分。规则规定“遇到部分和章标题时，都要划分新章”。因此，第4章应分章。
  keep_split: true
