- 'no': 18124
  overturn_probability: 0.15
  alternative: 子章节标题（Section Heading）
  counter_evidence:
  - 格式特征：该行使用了 Markdown 标题 `##`（H2），而非文档中最高的 H1 或 H0 级别。在技术文档或书籍的 Markdown 转换中，H2
    通常代表章节内的次级标题（即“部分”或“节”），而真正的顶级章标题往往对应 H1。
  - 上下文特征：在该行之前的 `no 18121` 到 `18123` 处，结束的是一个关于 CSS 属性列表的表格，随后出现 `---` 分隔线。`## 第
    4 部分` 位于一系列参考性质的附录内容中（如 `## 自闭合标签`, `## 输入类型`, `## 颜色单位` 等）。这些 H2 标题并列存在，说明它们是该附录章节下的子板块，而非全书最高层级的独立章。
  - 编号特征：虽然写有“第 4 部分”，但在 Markdown 结构中，如果全书采用 H1 为章，H2 为部分，那么 H2 的“部分”不应划分为独立的“新章”（除非全书结构定义为部分-章节模式且部分等同于章，但此处周围并列的是
    H2 级别的参考条目，更像是一个大附录下的子节）。根据规则“只划分全书最高层级的大章”，H2 往往不是最高层级。
