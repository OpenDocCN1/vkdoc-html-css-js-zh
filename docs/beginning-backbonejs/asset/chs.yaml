- "# 11. Backbone 最佳实践\n\n## 摘要\n\n在前面的章节中，我们了解了如何使用 Backbone 以及一些有用的扩展来创建高质量的 Web\
  \ 应用程序。然而，随着你的应用规模扩大并开始吸引真正的用户，你需要自信地使用底层技术。虽然像 Marionette 和 Thorax 这样的框架在视图管理方面减少了出错的可能性，但理解那些能确保你充分利用\
  \ Backbone 的技巧仍然很有价值。本章汇总了开发者在 Backbone 实践中采用的最佳实践。你将学习如何有效管理模板、避免内存泄漏，并确保你的应用通过以下章节列出的提示获得最佳性能。\n\
  \n## 通用最佳实践\n\n在深入细节实践之前，有一些简单的事情在构建 Backbone 应用时你需要牢记。\n\n### 保持清晰的关注点分离\n\n人们常强调\
  \ Backbone 的非限制性本质，即你可以自由地使用这个库。如果没有适当的约束，代码很容易失控。值得牢记“关注点分离”原则。最需要坚持这一原则的主要例子是在模型内部引用视图。尽管在某些情况下这很诱人，但你应该尽可能抵制这种做法。\n\
  \n虽然视图为了填充数据会引用模型或集合，但模型永远不需要知道它在哪个视图中被渲染。强制实施这种分离有许多好处：\n\n*   可以在不需要渲染视图的情况下测试模型/集合。\n\
  *   与视图相关的逻辑将被排除在模型之外，保留在视图中（因为模型对视图一无所知）。\n*   如果为移动和桌面浏览器分别构建了视图，模型也不会增加额外的复杂性。无论何种情况，模型都保持相同。\n\
  \n因此，你所有的数据类将更加模块化和可复用。\n\n### 为你的应用添加错误处理模式\n\n对于任何涉及数据输入的应用，你都需要建立一个一致的错误处理和通知系统。在构建应用时，这应该是你首先着手处理的事项之一。它能确保你团队中的所有其他开发者遵循相同的模式，并减少重复代码的数量。同时，由于错误能以一致且有用的方式显示，也能确保更好的用户体验。\n\
  \n#### 处理验证错误\n\n一种常见的模式是从 `validate` 函数返回一个错误对象。当视图通过 `invalid` 事件收到模型验证失败的通知时，它可以检查这个错误对象，并相应地更新视图。\n\
  \n下面的 `validate` 方法返回一个错误数组，其中包含验证过程中遇到的各个错误。注意，如果没有错误，函数将不返回任何内容，表示模型有效。\n\n```\n\
  validate: function(attrs) {\n\n   var errors = [];\n\n   if(attrs.email.indexOf('@')\
  \ == -1) {\n\n       errors.push({\n\n           'message': 'Invalid email address',\n\
  \n           'attribute': 'email'\n\n       });\n\n   }\n\n   if(attrs.name.length\
  \ < 1) {\n\n       errors.push({\n\n           'message': 'Name must be specified',\n\
  \n           'attribute': 'name'\n\n       });\n\n   }\n\n   //if there are no errors\
  \ and no return, then there is no invalid event.\n\n   if(errors.length) {\n\n \
  \      return errors;\n\n   }\n\n}\n```\n\n视图监听模型触发的 `invalid` 事件，检查第二个参数（`validate`\
  \ 函数的返回值）中的错误，并相应地更新视图。\n\n```\nthis.model.on('invalid', function(model, errors)\
  \ {\n\n       for(var i =0 ; i < errors.length; i++){\n\n           if(errors[i].attribute\
  \ === 'email'){\n\n               //highlight the email field with errors[i].message\n\
  \n           }\n\n           if(errors[i].attribute === 'name'){\n\n           \
  \    //highlight the name field with errors[i].message\n\n           }\n\n     \
  \  }\n\n});\n```\n\nPhilip Whisenhunt 和 Derick Bailey 建议对这种模式进行更高级的变体，即为 `validate`\
  \ 函数中可能发生的每个错误触发单独的事件。其优点是视图可以单独处理每个错误，而不是因为触发了 `invalid` 事件而编写一个大型函数。`validate`\
  \ 函数非常相似，只是触发事件而不是添加错误。\n\n```\nvalidate: function(attrs) {\n\n   var errors = [];\n\
  \n   if(attrs.email.indexOf('@') == -1) {\n\n      this.trigger('invalid:email',\
  \ 'Invalid email address', this);\n\n   }\n\n   if(attrs.name.length < 1) {\n\n\
  \        this.trigger('invalid:name', 'Name must be specified', this);\n\n   }\n\
  \n}\n```\n\n在视图中，每个错误事件都被监听。\n\n```\nthis.model.on('invalid:email', function(error)\
  \ {\n\n       //highlight the email field with the error\n\n});\n\nthis.model.on('invalid:name',\
  \ function(error) {\n\n       //highlight the name field with the error\n\n});\n\
  ```\n\n如你所见，这提供了一种更优雅、解耦的错误处理方法。\n\n#### 添加通用错误提示\n\n对于自定义用户界面，值得添加一个可以在所有视图中使用的通用提示对话框。这可以通过扩展\
  \ `Backbone.View` 创建你自己的超类来实现，或者使用本章后面“在视图间共享公共代码”部分详述的 mixin 方法。\n\n\n\n## 避免内存泄漏\n\
  \n无论使用何种编程语言或框架，内存泄漏是所有应用程序中最常见的错误之一。当本不应再被使用的对象或视图在系统中仍然“存活”时，就会发生内存泄漏。这通常是对象未被正确释放的结果。在\
  \ Backbone 中，这是一个常见问题，但一旦你了解原因，就很容易解决。\n\n### 关闭视图时解绑事件\n\nBackbone 中出现内存泄漏最常见的原因之一是，当前未使用的视图（因导航到新视图导致）仍然绑定着事件。我们在本书中之前将这些视图称为僵尸视图。\n\
  \n正如我们已经看到的，事件是 Backbone 应用程序基础设施的重要组成部分，它实现了视图、模型和集合之间真正的解耦。事件绑定处理不当的一个症状是，单个事件被意外地多次触发。\n\
  \n让我们首先回顾一下在视图中处理事件的不同方式。视图通过 `on` 函数将自身绑定到模型的 `change` 事件。\n\n```javascript\nMyView\
  \ = Backbone.View.extend({\n\n  initialize: function(){\n    this.model.on('change',\
  \ this.render, this);\n  },\n\n});\n```\n\n使用上述代码，模型中的任何更改都会导致视图中的 `render` 函数被调用。请注意，在\
  \ Backbone 的早期版本中，此函数名为 `bind` 而非 `on`；旧名称仍然支持，但最好使用 `on`。\n\n视图也使用 `events` 哈希将\
  \ DOM 事件绑定到处理函数。\n\n```javascript\nMyView = Backbone.View.extend({\n\n  events:\
  \ {\n    'click #search': 'runSearch'\n  },\n\n  runSearch: function(){\n      //\
  \ 搜索代码\n  },\n\n});\n```\n\n当应用程序使用完视图并渲染新视图时，这些事件仍然绑定着，因此该视图会一直保留在内存中。Backbone\
  \ 新手可能会认为 `remove` 函数（它将视图从 DOM 中移除）会处理所有事件，但事实并非如此。\n\n你可以在应用程序代码中采取几种不同的方法来处理此问题。\n\
  \n### 使用 `listenTo` 处理事件\n\n使用 `listenTo` 处理事件的一个优势是，当调用视图的 `remove` 函数时，`stopListening`\
  \ 函数会依次被调用，从而解绑所有通过 `listenTo` 绑定的事件。以下示例展示了如何使用此函数绑定模型的所有 `change` 事件：\n\n```javascript\n\
  MyView = Backbone.View.extend({\n\n  initialize: function(){\n    this.listenTo(model,\
  \ 'change', this.render);\n  },\n\n});\n```\n\n在处理事件时，使用 `listenTo` 替代 `bind` 或\
  \ `on` 函数可以作为一个不错的原则。\n\n### 使用模式正确关闭视图\n\n另一种选择是为视图编写一些额外的代码，以确保它们被正确释放。在路由器中切换视图时，你可以确保在显示新视图的同时，关闭之前的任何视图。Derick\
  \ Bailey 在他的博客 `http://lostechies.com/derickbailey/2011/09/15/zombies-run-managing-page-transitions-in-backbone-apps/`\
  \ 上为此提出了一种有用的模式，该模式被用于他的 Marionette 库，并且也适用于他的 EventBinder 插件。\n\n此模式始于为 `Backbone.View`\
  \ 添加一个 `close` 函数。这可以通过多种方式实现，但最有效的是扩展 `Backbone.Views` 的原型，添加一个 `close` 函数。`close`\
  \ 函数将封装从 DOM 中移除视图和解绑所有事件的功能。\n\n```javascript\nBackbone.View.prototype.close =\
  \ function(){\n        this.remove();\n        this.unbind();\n        if (this.onClose){\n\
  \                this.onClose();\n        }\n}\n```\n\n请注意，该函数的最后几行引用了 `onClose()`。这是另一个可以添加到每个独立视图中的额外函数，用于解绑视图在其整个生命周期中添加的所有事件。\n\
  \n```javascript\nvar MyView = Backbone.View.extend({\n\n   initialize: function()\
  \ {\n     this.model.on('change', this.render, this);\n  },\n\n   render: function()\
  \ {\n       // 渲染模板\n   },\n\n   onClose: function(){\n        // 解绑在视图生命周期内绑定的事件\n\
  \        this.model.off('change');\n   }\n\n});\n```\n\n正如你在前面的代码示例中所看到的，视图在初始化时注册监听模型上的\
  \ `change` 事件，并在调用 `onClose` 函数时注销此监听器。\n\n为了调用关闭视图的操作，需要一个能够跟踪当前焦点视图的对象。为此，Derek\
  \ Bailey 建议添加一个单一的 `AppView` 控制器，以便在切换视图时供路由器使用。\n\n```javascript\nfunction AppView(){\n\
  \  this.showView(view) {\n   if (this.currentView){\n     this.currentView.close();\n\
  \   }\n   this.currentView = view;\n   this.currentView.render();\n   $(\"#mainContent\"\
  ).html(this.currentView.el);\n }\n}\n```\n\n`AppView` 对象暴露了一个函数 `showView`。此函数在渲染新视图并将其添加到页面之前，会先关闭\
  \ `currentView`（如果存在）。\n\n现在，当需要根据触发的不同路由显示视图时，`Router` 可以使用这个 `AppView` 对象。首先创建视图，然后使用\
  \ `showView` 函数显示视图并确保之前的视图被正确释放。\n\n```javascript\nMyRouter = Backbone.Router.extend({\n\
  \n  routes: {\n    \"\": \"home\",\n    \"search/:query\": \"showResults\"\n  },\n\
  \n  initialize: function(options){\n    this.appView = options.appView;\n  },\n\n\
  \  home: function(){\n    var homeView = new HomeView();\n    this.appView.showView(homeView);\n\
  \  },\n\n  showPost: function(query){\n    // 获取搜索结果的代码...\n    var searchResultsView\
  \ = new SearchResultsView({model: results});\n    this.appView.showView(searchResultsView);\n\
  \  }\n\n});\n```\n\n再次重申，值得注意利用像 Marionette 这样的框架可以帮助你实现与上述类似的效果，但更深入地理解视图被移除时的实际运作机制总是有益的。\n\
  \n## 渲染视图\n\n在处理视图时，你可以使用多种实践方法。这些方法涵盖从提高 `render` 函数的粒度到改进模板的使用方式等各个方面。\n\n\n\n\
  ### 仅渲染所需部分\n\n本书迄今为止的所有示例中，每个视图都只使用了单一的渲染函数。尽管这很合理，但用不了多久，你就会为更复杂的视图编写出复杂的渲染函数。更重要的是，在某些情况下，你需要确保视图保持最新。以\
  \ Twitter 应用为例：当获取新数据时，会执行一个单一的渲染函数来渲染时间线中的所有推文。这些推文会显示类似“一分钟前”的时间戳。理想情况下，这些时间应该能自动更新以避免变得过时，但每次都重新渲染整个集合，甚至只是单条推文的部分，都显得大费周章。如果能够将渲染拆分开来，让时间戳可以独立更新，那将会更加实用。\n\
  \n一种处理方式是将 `render` 函数拆分为不同的区域。通过拆分模板，可以让主 `render` 函数调用多个负责特定功能的小函数。\n\n以单条推文为例，`render`\
  \ 函数可以拆分为两部分：一部分负责主内容，另一部分负责时间戳。\n\n```\nrender: function(){\n  this.renderContent().\n\
  \  renderTimestamp();\n  return this;\n},\n```\n\n这种方法的好处在于，后续你可以只更新视图的某一部分，而无需重新运行整个\
  \ `render` 函数。下面的代码片段展示了如何构建这样的视图：\n\n```\nvar com = com || {};\ncom.apress = com.apress\
  \ || {};\ncom.apress.view = com.apress.view || {};\n\ncom.apress.view.TweetView\
  \ = Backbone.View.extend({\n  el: '#tweet',\n  $timestamp: null,\n  $content : null,\n\
  \  tweetTemplate: Handlebars.compile($(\"#tweet-template\").html()),\n  timestampTemplate:\
  \ Handlebars.compile($(\"#timestamp-template\").html()),\n  tweet : null,\n  initialize:\
  \ function(options){\n    this.tweet = options.tweet;\n    this.render();\n  },\n\
  \  render: function(){\n    this.renderContent().\n    renderTimestamp();\n    return\
  \ this;\n  },\n  renderContent: function(){\n    //如果内容已经渲染，则移除\n    if(this.$content){\n\
  \      this.$content.remove();\n    }\n    //处理主内容模板\n    $content = this.tweetTemplate({\n\
  \      tweet: this.tweet.toJSON()\n    });\n    this.$el.append($content);\n   \
  \ return this;\n  },\n  renderTimestamp: function(){\n    //如果时间戳已经渲染，则移除\n    if(this.$timestamp){\n\
  \      this.$timestamp.remove();\n    }\n    //处理时间戳模板\n    $timestamp = this.timestampTemplate({\n\
  \      time: this.tweet.getTimestamp()\n    });\n    this.$('#timestamp').append($timestamp);\n\
  \    return this;\n  }\n});\n```\n\n注意这里使用了两个独立的模板，并且当每个低层级的 `render` 函数被调用时，它们会首先清除之前已渲染过的元素。每个函数还返回一个指向\
  \ `this` 的指针，使得 `render` 方法能够以更简洁的方式链式调用。\n\n视图所使用的模板如下。主内容模板包含一个用于放置时间戳的占位符。\n\n\
  ```\n<script type=\"text/x-handlebars-template\" id=\"tweet-template\">\n  <p>{{tweet.text}}</p>\n\
  \  <div id=\"timestamp\"></div>\n</script>\n\n<script type=\"text/x-handlebars-template\"\
  \ id=\"timestamp-template\">\n  <p><i>{{time}}</i></p>\n</script>\n```\n\n为完整起见，以下是填充并显示该视图的代码。`Tweet`\
  \ 模型是一个简单的 `Backbone.Model`，仅包含一个简单的 `text` 属性，以及一种通过 `moment.js` 以可读方式呈现时间戳的方式。\n\
  \n```\nTweet = Backbone.Model.extend({\n  timestamp: null,\n  initialize: function(){\n\
  \    timestamp = new Date();\n  },\n  getTimestamp: function(){\n    var friendly\
  \ = moment(timestamp).fromNow();\n    return friendly;\n  }\n});\n\nvar tweet =\
  \ new Tweet({text: 'James'});\nvar tweetView = new com.apress.view.TweetView({tweet:\
  \ tweet});\n```\n\n即使你不需要在特定时间间隔更新视图的某些部分，拆分 `render` 函数也能让你的代码更易于他人阅读，并降低视图代码变得难以维护的风险。\n\
  \n### 使用部分模板减少模板臃肿\n\n随着应用的增长，在定义模板时难免会出现一些重复，因为某些模板的部分内容会被复制到新模板中。这可能导致维护问题，并违背了软件开发中备受推崇的“不要重复自己（DRY）”原则。本节将探讨\
  \ Handlebars 和 Underscore 中可用的解决方案。\n\n#### Handlebars 中的部分模板\n\nHandlebars 通过 `registerPartial`\
  \ 函数为部分模板提供了开箱即用的支持。当一个模板在其定义中包含另一个部分模板时，会使用 `{{> partialname}}` 辅助函数将其放置在正确的位置。下面的时间线模板示例展示了如何实现这一点：\n\
  \n```\n<script id='timeline-template' type='text/x-handlebars-template'>\n  {{#each\
  \ tweetlist}}\n    {{> tweet}}\n  {{/each}}\n</script>\n```\n\n该模板期望注册另一个名为 `tweet`\
  \ 的部分模板。如前所述，这是通过 `Handlebars.registerPartial` 函数完成的。\n\n```\nHandlebars.registerPartial('tweet',\
  \ $('#tweet-partial').html());\n```\n\n部分模板本身的定义方式与任何 Handlebars 模板相同。为了便于快速识别，一个有用的约定是在模板\
  \ ID 的末尾添加 `-partial`。\n\n```\n<script id='tweet-partial' type='text/x-handlebars-template'>\n\
  \  <div class='tweet'>\n    <h2>{{username}}</h2>\n    <div class='text'>{{text}}</div>\n\
  \  </div>\n</script>\n```\n\n一旦部分模板被及时注册，你的 Backbone 视图就可以像平常一样编译主模板。\n\n#### Underscore\
  \ 中的部分模板\n\n在 Underscore 模板中也可以使用部分模板。尽管不像 Handlebars 那样有辅助函数，但由于 Underscore 的 JavaScript\
  \ 语法特性，实现起来仍然相当简单。\n\n首先，定义部分模板用于显示单个项目，这里以一本书为例。\n\n```\n<script type='text/template'\
  \ id='book-template'>\n  <li>\n    <b><%=name %></b> by <%=author %>\n  </li>\n\
  </script>\n```\n\n要使用这个部分模板，主模板可以像调用 JavaScript 函数一样引用它，并将项目作为参数传递。\n\n```\n<script\
  \ type='text/template' id='library-template'>\n  <ul>\n    <% for (var i = 0; i\
  \ < library.length; i++) { %>\n      <% itemTemplate(library[i]);  %>\n    <% }\
  \ %>\n  </ul>\n</script>\n```\n\n在 Backbone 视图中，`render` 函数需要能够访问这两个模板。\n\n```\n\
  LibraryView = Backbone.View.extend({\n  template: _.template($('#library-template').html()),\n\
  \  itemTemplate: _.template($('#book-template').html()),\n  render: function() {\n\
  \    var html = this.template({\n      library: library /* a collection */,\n  \
  \    itemTemplate: this.bookTemplate\n    });\n    $(this.el).append(html);\n  }\n\
  });\n```\n\n这种方法可以在你的应用中所有可复用的 Underscore 模板中使用。\n\n\n\n### Handlebars 中的模板预编译\n\
  \n模板预编译是指在构建时准备模板，以减少渲染视图时所需的编译时间。它还可以帮助减小模板库的大小，因为生产环境中运行的应用程序不再需要编译引擎。如第 4 章所述，Handlebars\
  \ 已经提供了完整版和运行时版之间的分离。\n\n使用预编译模板带来的性能提升不容小觑，尤其是在移动设备上。\n\n在第 4 章中，我们创建了一个简单的 Handlebars\
  \ 示例，为图书馆藏集合提供了一个模板。为了预编译此模板以便在 Backbone 应用程序中使用，您首先需要安装 Handlebars 的 Node 包。\n\n\
  ```\nnpm install handlebars -g\n```\n\n接下来，您需要将模板从 HTML 页面中取出，并将其放入一个单独的文件中。通常，每个模板会被移动到一个\
  \ `.handlebars` 文件中。对于这个图书馆藏模板，将其移到 `library.handlebars` 文件中是合理的。\n\n```\n<script\
  \ type=\"text/x-handlebars-template\" id=\"library-template\">\n<ul>\n  {{#each\
  \ library}}\n    <li>\n    {{#log name 4}}{{/log}}\n      <em>{{name}}</em> by {{author}}\n\
  \    </li>\n  {{/each}}\n</ul>\n</script>\n```\n\n要预编译此模板，`handlebars` 命令采用以下形式：\n\
  \n```\nhandlebars <input> -f <output>\n```\n\n对于 `library.handlebars` 文件，命令如下：\n\
  \n```\nhandlebars library.handlebars -f templates.js\n```\n\n这将生成一个 `templates.js`\
  \ 文件，可用于 HTML 中。在这种情况下，模板将被标识为 `library`，因为编译器使用输入文件的名称作为模板名称。您可以通过打开 `templates.js`\
  \ 来验证这一点，您会在文件开头看到 `templates` 数组包含一个 `library` 条目。\n\n```\n(function() {\n  var\
  \ template = Handlebars.template, templates = Handlebars.templates = Handlebars.templates\
  \ || {};\ntemplates['library'] = template(function (Handlebars,depth0,helpers,partials,data)\
  \ {\n```\n\n> **注意**  \n> 稍后您将使用此数组 (`Handlebars.templates[]`) 来访问预编译模板。\n\n`templates.js`\
  \ 文件需要包含在 HTML 页面中，并且只要您的 JavaScript 代码中没有调用编译模板的操作，就可以改用 Handlebars 运行时版。\n\n```\n\
  <script src=\"js/external/handlebars-runtime.js\"></script>\n<script src=\"js/templates/templates.js\"\
  ></script>\n```\n\n最后，在 `Backbone.View` 中，您不再需要使用 `Handlebars.compile` 来处理模板，而是可以通过\
  \ `Handlebars.templates` 数组来访问模板。\n\n```\ntemplate: Handlebars.templates['library'],\n\
  ```\n\n重构后的 `LibraryView` 其余部分保持不变。\n\n```\nLibraryView = Backbone.View.extend({\n\
  \    initialize: function(){\n        console.log('View created');\n    },\n   \
  \ events: {\n        'click ' : 'alertBook'\n    },\n    template: Handlebars.templates['library'],\n\
  \    render: function(){\n        var self = this;\n        var output = self.template({'library':\
  \ self.collection.toJSON()});\n        self.$el.append(output);\n        return\
  \ self;\n    },\n    alertBook: function(e){\n        alert('Book clicked');\n \
  \   }\n});\n```\n\n## 视图管理\n\n当你的应用程序变得更大时，视图周围可能会有很多复杂的问题。以下部分将讨论 Backbone 开发者在这个领域遇到的一些常见问题，包括如何在视图之间共享公共代码以及如何在子视图及其父视图之间进行通信。\n\
  \n### 在视图间共享公共代码\n\n在应用程序中编写视图时，你很可能会发现有些代码需要在它们之间共享。有几种方法可以处理这个问题；一种是使用继承。但我发现的最有用的共享代码技术是提供混入（mixins），将公共代码放在一个单独的\
  \ JavaScript 文件中，可以根据需要引入。\n\n例如，假设您想要在选定的几个视图中共享通用的警告功能。所有与警告相关的、可以共享的函数都将放在一个文件中。\n\
  \n```\nvar Mixins = Mixins || {};\nMixins.Alerts = {\n    showSuccessMessage: function(message){\n\
  \        console.log('Show success message');\n    },\n    showFailureMessage: function(message){\n\
  \        console.log('Show failure message');\n    }\n};\n```\n\n然后，在定义视图时，可以使用\
  \ `_.extend` 函数将混入合并进来。\n\n```\nvar com = com || {};\ncom.apress = com.apress ||\
  \ {};\ncom.apress.view = com.apress.view || {};\ncom.apress.view.TweetView = Backbone.View.extend(\n\
  _.extend({}, Mixins.Alerts, {\n    //standard Backbone view code\n}));\n```\n\n\
  因此，混入中定义的所有函数现在都可以在 `TweetView` 对象中使用。\n\n### 从子视图更新父视图\n\n在你作为 Backbone 开发者的职业生涯中，某个时刻你会遇到这样一种情况：由于子视图中的更改，需要更新父视图。有两种方法可以解决这个问题：一种是将对父视图的引用传递给子视图，另一种依赖于事件机制。\n\
  \n传递引用是最容易阅读和理解的方法，但会导致父视图和子视图之间的耦合。以下代码展示了如何实现这一点：\n\n```\nvar MainView = Backbone.View.extend({\n\
  \  initialize: function() {\n    var self = this;\n    this._views = [];\n    //\
  \ create a sub view for each model\n    this.collection.each(function(model) {\n\
  \      self._views.push(new SubView({\n        model: model,\n        parentView:\
  \ self\n      }));\n    });\n  }\n});\n```\n\n现在，每个 `SubView` 都有一个对父视图的引用，可以通过以下方式从子视图调用以重新渲染父视图：\n\
  \n```\nthis.parentView.render();\n```\n\n更简洁的基于事件的解决方案无需传递引用。相反，父视图只需监听来自子视图的事件即可。\n\
  \n```\nvar MainView = Backbone.View.extend({\ninitialize: function() {\n   var self\
  \ = this;\n   this._views = [];\n   // create a sub view for each model\n   this.collection.each(function(model)\
  \ {\n       var subview = new SubView({\n       model: model,\n       parentView:\
  \ self\n     });\n     self._views.push(subview);\n     self.listenTo(subview, 'event',\
  \ self.render);\n   });\n}\n});\n```\n\n子视图只需触发事件，即可让父视图进入其 `render` 函数。\n\n```\n\
  this.trigger('event');\n```\n\n## 网络性能\n\n一旦你证明了应用程序的功能性，该应用程序的性能将受到审查。有大量工具可以帮助你诊断哪些地方可以进行潜在改进，并且许多文章也给出了很好的建议。本书前面已经介绍过其中一些技巧。\n\
  \n例如，惯例是所有 CSS 样式应位于 HTML 页面的头部，而脚本应全部加载在底部。这确保了页面最初能正确渲染，因为等待 CSS 脚本加载会阻塞渲染。同时，下载\
  \ JavaScript 资源会阻塞页面上的其他下载，因此这些操作应该放在最后。\n\n然而，在构建 Backbone 应用程序时，还有一些其他技巧你应该牢记在心。\n\
  \n\n\n### 最小化页面加载时的请求数量\n\n关于网络性能的首要秘诀之一就是减少请求次数。页面需要的每一项资源都会增加一次额外的 HTTP 请求。与其在应用中急切地填充每一个\
  \ `Backbone.Model` 和 `Backbone.Collection` 对象，不如花点时间考虑一下：当应用展示给用户时，哪些数据是立即需要的。\n\
  \n一种选择是使用延迟加载，即在用户实际需要数据时才从服务器加载对象。这种方法虽然有助于缩短页面加载时间，但当用户真正请求信息时，可能会导致延迟。\n\n如果你的应用使用服务器端技术（如\
  \ Grails、JSP 或 .NET）构建，那么有可能用 JSON 数据填充部分初始模型和集合。这项技术已经变得越来越流行，尤其是 Airbnb 将其 Rendr\
  \ 库作为 GitHub 上的开源项目（`https://github.com/airbnb/rendr`）提供给所有人使用。该项目允许 Backbone 代码在客户端和服务器端都能渲染。更重要的是，它使得在浏览器渲染页面时，能够轻松地将\
  \ Backbone 模型的内容传递给页面，从而让服务器执行大部分网络操作。\n\n最后，根据对应用性能分析的结果，你可能会决定重构那些从客户端发往服务器端的\
  \ API 调用。构建能够减少 API 间数据重复的端点（end points）是一项很有用的实践。随着项目的推进，重新审视并重构 API 总是值得的。\n\n\
  ## 感知性能\n\n你可以运用一些技巧，让应用的响应速度看起来快得多。总的来说，你应该始终对自己应用的响应速度持批判态度。那些日复一日使用相同代码的开发者，往往会习惯应用的响应时间，而用户可能就没那么宽容了。\n\
  \n### 乐观的网络调用\n\n在某些情况下，可以安全地假设对后端的调用会成功完成，尤其是当所有验证都在应用客户端执行时。如果你有一个视图，需要将一些模型属性保存到服务器，通常你会等待成功处理程序被调用后，才显示这些更改或向用户显示成功消息。\n\
  \n```\nvar MyView = Backbone.View.extend({\n\n  events: {\n\n    'click .save':\
  \ 'save'\n\n  },\n\n  save: function(e) {\n\n    // 保存模型\n\n    this.model.save(model.attributes,\
  \ {\n\n      success: function(model, response, options) {\n\n        // 渲染更改\n\n\
  \      },\n\n      error: function(model, xhr, options) {\n\n        // 渲染错误\n\n\
  \      }\n\n    });\n\n  }\n\n});\n```\n\n如果你确信调用会成功，并且所有必要的验证已在客户端完成，那么你无需等待即可显示成功交易的结果。如果真的出了差错，错误处理器可以捕获变更并运行一些代码来撤销更改，并告知用户操作失败。\n\
  \n在某些情况下，这种优化可能风险太大，因此需要权衡这种更改带来的风险与收益。\n\n### 使用文档片段渲染集合\n\n当一个单独的视图对应整个集合时，集合发生变化后更新视图看起来可以相当流畅地进行，因为只调用了一个渲染函数，并且只对视图的\
  \ `el` 进行一次追加操作。但是，当你为集合中的每个模型对象都设置了一个单独的视图时，每次集合发生变化，重新渲染每个子视图都会影响性能，并导致用户界面看起来不稳定。\n\
  \n考虑以下代码，它采用了这种针对集合的方法：\n\n```\nvar MainView = Backbone.View.extend({\n\n      initialize:\
  \ function() {\n\n    var self = this;\n\n    this._views = [];\n\n    // 为每个模型创建一个子视图\n\
  \n    this.collection.each(function(model) {\n\n      self._views.push(new SubView({\n\
  \n        model: model\n\n      }));\n\n    });\n\n  },\n\n  render: function()\
  \ {\n\n    var self = this;\n\n    this.$el.empty();\n\n    // 渲染每个子视图，然后追加\n\n\
  \      for(var i=0; i < this.views.length; i++){\n\n      self.$el.append(views[i].render().el);\n\
  \n    });\n\n}\n\n});\n```\n\n每次发生追加操作时，DOM 都需要重新计算 DOM 树中所有元素的位置和大小，当集合中包含大量模型时，这是一项开销巨大的操作。更简洁的做法是，先构建好元素内容，然后只进行一次\
  \ DOM 追加操作。这正是 DOM 的 `createDocumentFragment` 函数可以帮助你实现的。所有主流浏览器都支持该函数，它在后台创建一个\
  \ `Node` 对象，让你在追加到真实文档之前准备好内容。\n\n这使得前面代码示例中的 `render` 函数变为以下形式：\n\n```\n  render:\
  \ function() {\n\n    var self = this;\n\n    self.$el.empty();\n\n    var fragment\
  \ = document.createDocumentFragment();\n\n     // 渲染每个子视图，然后追加\n\n      for(var\
  \ i=0; i < this.views.length; i++)\n\n       fragment.$el.append(views[i].render().el);\n\
  \n     });\n\n     this.$el.append(fragment);\n\n}\n```\n\n注意，首先创建了一个片段，然后将每个子视图添加到其中。当循环完成且片段已包含所有视图后，整个片段就可以追加到视图的根元素\
  \ `el` 上。\n\n### 使用模型存储额外数据\n\n大多数 Backbone 模型的默认实现是仅表示持久化到服务器的数据。虽然这在原则上听起来不错，但在某些情况下会引起更多麻烦。考虑一个例子：我们想要跟踪视图中的某个项何时被选中。在视图类中，只需添加一个点击事件监听器来跟踪哪个项被选中。\n\
  \n```\ncom.apress.view.TweetView = Backbone.View.extend({\n\n     // 其他代码\n\n  \
  \   tweet : null,\n\n     events: {\n\n         'click': 'markSelected'\n\n    \
  \ },\n\n     markSelected: function(options){\n\n         console.log('marking..');\n\
  \n         var self = this,\n\n             $target = $(options.currentTarget);\n\
  \n         $target.addClass('selected');\n\n     },\n\n     // 其他代码\n\n});\n```\n\
  \n如果你想检查当前选中的模型对象是哪一个，就需要遍历 DOM 并找到哪个元素拥有 `selected` 类。\n\n在诸如此类的情况下，在模型对象中跟踪状态是很有意义的。这样，你就可以遍历集合，找出\
  \ `selected` 属性等于 `true` 的模型对象。这会将 `markSelected` 函数改为以下形式：\n\n```\nmarkSelected:\
  \ function(options){\n\n         console.log('marking..');\n\n         var self\
  \ = this,\n\n             $target = $(options.currentTarget);\n\n         self.tweet.set('selected',\
  \ true);\n\n         $target.addClass('selected');\n\n},\n```\n\n注意，这确实增加了一些管理变量和决定哪些变量应该持久化到服务器的开销。然而，在应用中发现项的状态，其开销远小于发现哪些类被应用于相应的\
  \ DOM 元素。同时，由于选定状态有效地与视图解耦，这也有助于提高模型对象的可测试性。\n\n\n\n### 尽可能缓存对象\n\n与其反复获取应用中反复使用的视图或模型的新实例，更佳的做法是缓存这些对象。用户对象就是一个很好的例子，该对象在应用的许多视图中共享。如果每次跳转到新页面时都创建用户对象的新实例，这将造成浪费，尤其是当该对象不频繁变化时。\n\
  \n路由器是这种模式最有用的典型场景之一。初始化时，用户模型被设置为 `undefined`。\n\n```\ninitialize: function() {\n\
  \   this.cached = {\n      userModel: undefined\n   }\n},\n```\n\n如果路由器内的某个路由被触发，若模型为\
  \ `undefined` 则进行获取，否则可以返回缓存的版本。\n\n```\nmainView: function(parameter) {\n   this.cached.model\
  \ = this.cached.model || new UserModel({});\n   new View({\n       userModel: this.cached.userModel\n\
  \   });\n},\n```\n\n如果另一个视图（如个人资料视图）使用该模型，则无需从服务器重新获取。\n\n```\nprofileView: function(parameter)\
  \ {\n   this.cached.model = this.cached.model || new UserModel({});\n   new ProfileView({\n\
  \       userModel: this.cached.userModel\n   });\n},\n```\n\n在某些情况下，你可能需要强制重新获取模型。此时，可以在模型自身添加一个变更监听器来触发一次数据获取。以下示例在密码被更改时强制进行数据获取：\n\
  \n```\ninitialize: function() {\n   this.on(\"change:password\", this.fetch, this);\n\
  }\n```\n\n缓存对象非常有用，能够提升应用性能，代价是略微增加内存开销，因为对象会持续存活。你还需要注意，由于缓存的存在，模型对象可能无法按预期进行更新。最好的建议是谨慎使用此模式。\n\
  \n"
- '# 总结


  本章列出了在构建专业 Backbone 应用时需要牢记的一些最重要的实践。内存管理是大多数应用开发者关注的核心问题之一，而性能、响应速度以及常规代码管理同样占据重要地位。由于
  Backbone 的非固执己见特性，开发者在构建应用时拥有很大的自由度。牢记本章中的实践，你将能够引导你的团队避开一些 Backbone 开发者常见的陷阱。


  考虑到以上所有因素，利用第 7 章中列出的插件，或采用第 10 章中讨论的 Marionette 或 Thorax 库，是非常明智的选择，这主要是因为 Backbone
  应用中的大多数错误都源于对视图的不当管理。


  感谢 Phillip Whisenhunt、Addy Osmani、Derick Bailey、Ian Storm Taylor、Rico Sta Cruz 和
  Oz Katz 提供的富有洞察力的文章，它们突显了本章中使用的许多最佳实践、技巧和模式。


  '
- "# 12. 创建可管理的 JavaScript 代码库\n\n摘要\n\n现在你已经知道如何构建 Backbone 应用、引入构建系统以及使用测试框架确保代码质量。最后一块拼图是保持代码的可维护状态。JavaScript\
  \ 应用经常因随着时间的推移变得像一团意大利面条式的代码而受到批评，如果不加控制，你的 Backbone 应用也可能如此。本章为你带来一些技巧，帮助确保你的代码在其生命周期内保持可理解、模块化和可测试。在本章中，我们将介绍\
  \ RequireJS 作为一种确保你的应用真正模块化的方式，并讨论一些有助于在你的 Backbone 应用中强制执行结构和清晰度的有用设计模式。\n\n##\
  \ 使用 RequireJS 创建模块化应用\n\n在本书中，我们一直使用命名空间来确保当视图和模型具有相同名称时不会发生冲突。然而，这仅解决了模块化的一个方面。你仍然需要确保基于依赖关系，脚本以正确的顺序加载。一旦应用规模扩大，不同对象之间的交互会变得难以管理。RequireJS\
  \ 是处理此问题的最佳方式之一。\n\n应用的另一个重要考量是可重用性。有些代码部分可能适合嵌入到其他视图中。一个典型的例子是 Google Talk：你可以通过独立视图与他人通信，同时也可以在\
  \ Gmail 网页侧边栏嵌入一个视图，或作为 Google Docs 中对话的一部分。与其多次编写相同代码，或者更糟的是复制代码，采用模块化方法意味着代码部分可以在多个地方使用。\n\
  \n传统语言，如 Java、C++ 和 C#，都有各自的方式使用 `import`/`include` 语法声明对其他类的依赖。在 JavaScript 中，这是不可能的。相反，开发者必须确保加载顺序正确，以便特定\
  \ JavaScript 代码所依赖的任何文件都首先被正确加载。虽然这在较小的应用中可行，但很快会变得规模失控并成为维护噩梦。\n\n当涉及在 JavaScript\
  \ 中创建模块时，RequireJS 被认为是领先的选择，并为前面列出的所有问题提供了出色的解决方案。\n\n### 什么是 RequireJS？\n\nRequireJS（[`www.requirejs.org`](http://www.requirejs.org/)，图\
  \ 12-1）是异步模块定义（AMD）API 的一种实现。该 API 指定了一种定义模块的方式，使得模块及其任何依赖项都可以异步加载。这解决了依赖关系问题，同时也提升了\
  \ Web 应用的性能，因为脚本不再以同步方式加载。\n\n![A978-1-4302-6335-7_12_Fig1_HTML.jpg](img/A978-1-4302-6335-7_12_Fig1_HTML.jpg)\n\
  \n图 12-1. [`Requirejs.org`](http://yeoman.io/)\n\n将 RequireJS 集成到 JavaScript 应用中需要在整个应用范围内进行一些更改，包括模块定义以及主\
  \ HTML 页面中使用的初始脚本标签集。下一节将详细讨论 RequireJS 的使用。\n\n\n\n### 使用 RequireJS\n\n在探讨如何将 RequireJS\
  \ 集成到 Backbone 应用程序之前，通过单独观察其使用方式（不依赖任何其他 JavaScript 库）来理解 RequireJS 的工作原理会更容易。\n\
  \n你需要从官方网站 [`www.requirejs.org/docs/download.html`](http://www.requirejs.org/docs/download.html)\
  \ 下载 RequireJS。与前例一样，可以将其保存在 `js/external` 目录下。但是，当从 HTML 页面加载时，RequireJS 在其 `script`\
  \ 标签中应使用额外的属性。`data-main` 属性用于指示 RequireJS 在自身加载完毕后，加载它所指向的脚本。这是整个应用程序的单一入口点，因此你的\
  \ HTML 页面中无需再包含其他脚本。\n\n以下 HTML 代码说明了这一点：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
  <title>RequireJS 示例</title>\n<!-- data-main 属性告诉 require.js 在加载完毕后\n加载 scripts/main.js\
  \ -->\n<script data-main=\"js/main\" src=\"js/external/require.js\"></script>\n\
  </head>\n<body>\n<h1>我的应用程序</h1>\n</body>\n</html>\n```\n\n在此例中，`data-main` 指向 `js/main`，这意味着位于\
  \ `js` 目录中的 `main.js` 将成为第一个被加载的脚本。RequireJS 总是假设任何脚本依赖项都是 JavaScript 文件，因此文件名末尾无需指定\
  \ `.js`。图 12-2 展示了这个简单应用程序所需的文件夹结构。\n\n![A978-1-4302-6335-7_12_Fig2_HTML.jpg](img/A978-1-4302-6335-7_12_Fig2_HTML.jpg)\n\
  \n图 12-2. RequireJS 应用程序的简单结构\n\n从现在起，RequireJS 加载的所有代码都将来自 `js` 目录，因为主脚本加载所在的文件夹会被视为\
  \ RequireJS 中 `baseUrl` 配置的值。不过，你也可以手动设置这个值。其他针对 RequireJS 的额外配置（例如本例）通常会在主脚本中进行。\n\
  \n表 12-1 描述了设置 RequireJS 时一些最有用的配置选项。\n\n表 12-1. 有用的 RequireJS 配置选项\n\n| 选项 | 描述\
  \ |\n| --- | --- |\n| `baseUrl` | 这是用于加载 RequireJS 中所有模块的根目录。如果配置中未设置此项，且没有 `data-main`\
  \ 可供计算，那么默认值将是加载 `require.js` 的 HTML 页面所在的位置。可以将 `baseUrl` 设置为不同域名，因为 RequireJS\
  \ 支持跨域脚本加载。以下示例说明了如何将 `baseUrl` 设置为指向 `app` 目录：`require.config({ baseUrl: \"/js/app\"\
  , });` |\n| `paths` | `paths` 哈希可用于为那些无法直接在指定 `baseUrl` 下找到的模块设置映射。这在需要缩短详细说明模块依赖关系时所使用的路径时非常有用。以下示例展示了如何将\
  \ `lib` 路径映射到 `js/external/lib`：`require.config({ paths: { 'lib': 'js/external/lib'\
  \ } });` |\n| `shim` | 这允许为那些未使用 `define()` 的旧脚本配置依赖关系、导出项和自定义初始化。在应用程序中添加 jQuery、Underscore\
  \ 和 Backbone 的依赖项时，将需要此配置。shim 列表中的每一项都被赋予一个模块 ID 导出，并且可以选择性地包含一个依赖项列表。关于此配置的示例将在“在\
  \ Backbone 应用程序中包含 RequireJS”一节中提供。 |\n| `map` | 这允许针对给定的模块前缀，将一个模块 ID 映射到另一个模块\
  \ ID。当你拥有两个不同版本的模块，但其他模块依赖于不同版本时，这会很有用。以下示例展示了两个不同的模块（`modone` 和 `modtwo`）如何都能将\
  \ `api` 模块引用为 `api`，但使用不同的版本：`requirejs.config({ map: { 'modone': { 'api': 'api1.0'\
  \ }, 'modtwo': { 'api': 'api1.1' } } });` |\n| `config` | `config` 选项允许将一个通用的配置对象传递给\
  \ RequireJS。它可以包含任何你希望模块可用的选项。在你的模块中通过使用 `require.config()` 即可访问此配置。 |\n| `waitSeconds`\
  \ | 此选项设置在放弃加载脚本之前等待的秒数。默认值为 `7`，将此值设置为 `0` 将禁用此超时，从而使 RequireJS 永远不会放弃加载脚本。 |\n\
  | `deps` | 此选项指定一个依赖项数组，这些依赖项在 RequireJS 配置处理完毕后会立即加载。 |\n\n注意\n\nRequireJS 将使用模块\
  \ ID 来加载所有模块。但是，如果你需要包含非模块文件，可以确保依赖项字符串以 `.js` 结尾，或者以 `http://` 或 `https://` 等协议开头。\n\
  \n对于这个简单的示例，无需额外配置，因此 `main.js` 保持为空。不过，一旦定义了一些模块，它就会负责启动应用程序。\n\n### 定义和使用模块\n\n\
  创建模块可以让你创建一个具有定义域的对象，并且该对象依赖于应用程序中存在的其他模块列表。`define` 函数用于创建这些模块，根据你所定义模块的类型及其设置方式，该函数的参数会有所不同。\n\
  \n#### 具有名称-值对的模块\n\n如果你创建的模块没有函数，只是一组名称-值对，可以通过将一个包含名称-值对的对象传递给 `define` 函数来定义它。例如，以下包含在\
  \ `Book.js` 中的代码将创建一个名为 `Book` 且包含特定数据集的模块。\n\n```\ndefine({\n   title: \"Beginning\
  \ Backbone.js\",\n   author: \"James Sugrue\"\n});\n```\n\n要在 `main.js` 中包含此模块，需使用\
  \ `require` 函数。`require` 函数有两个参数：一个所需模块名称的数组，以及一个将这些模块都作为参数的回调函数。\n\n在此示例中，你可以简单地引用\
  \ `Book` 并将其作为回调函数中的一个参数使用。请注意，你可以随意命名这个参数。参数到模块的映射取决于模块在数组中列出的顺序及其在参数列表中的位置。\n\n\
  ```\nrequire(['Book'], function(book){\n   console.log('标题: ' + book.title);\n});\n\
  ```\n\n执行上述代码的结果应为在控制台输出“标题: Beginning Backbone.js”。\n\n#### 具有设置逻辑的模块\n\n更复杂的模块可能需要在返回模块定义之前执行一些逻辑。在这种情况下，`define`\
  \ 函数可以接受一个函数作为其参数。该函数应在返回模块之前执行适当的步骤。\n\n以下示例将把书籍标题转换为大写，作为初始设置步骤：\n\n```\ndefine(function(){\n\
  \   var title = 'Beginning Backbone.js';\n   var author = 'James Sugrue';\n   title\
  \ = title.toUpperCase();\n   return {\n          title: title,\n          author:\
  \ author\n   };\n});\n```\n\n假设将前面的模块保存在 `SetupBook.js` 中，当它在 `main.js` 中被使用时，它将输出大写的书籍标题。\n\
  \n```\n//设置函数示例\nrequire(['SetupBook'], function(book){\n   console.log('标题: ' +\
  \ book.title);\n});\n```\n\n\n\n### 具有依赖关系的模块\n\n当模块存在依赖关系时，可以在其 `define()` 函数中加载这些依赖，这与\
  \ `require()` 函数的使用方式类似。在这种情况下，`define()` 函数接受两个参数。第一个参数是一个模块 ID 数组，表示该模块所依赖的模块。第二个参数是一个回调函数，该函数将每个被依赖的模块作为参数接收。此函数返回一个定义\
  \ `Library` 模块的对象。\n\n在以下示例中，`Library.js` 依赖 `Book.js` 来为图书馆定义一些内容。该模块返回一个包含函数的对象，而不仅仅是像之前那样简单的键值对。\n\
  \n```\ndefine([\"./Book\"], function(book) {\n    return {\n        name: \"My Library\"\
  ,\n        getContents: function() {\n            var books = [];\n            books.push(book);\n\
  \            return books;\n        }\n    }\n});\n```\n\n此函数只有在依赖模块 `Book` 被加载之后才会执行。`Main.js`\
  \ 将不再需要 `Book` 模块，而是会加载 `Library` 模块。\n\n```\nrequire(['Library'], function(library){\n\
  \    console.log('Library Name: ' + library.name);\n    for(var i = 0; i < library.getContents().length;\
  \ i++){\n        console.log('Book: ' + library.getContents()[i].title);\n    }\n\
  });\n```\n\n运行此代码将在控制台输出图书馆的名称以及图书馆内容的列表（当前内容列表仅包含之前定义的简单 `Book` 模块）。\n\n请注意，模块并非必须返回对象，也可以添加一个提供返回值的函数。\n\
  \n### 在 Backbone 应用程序中包含 RequireJS\n\n如果你正在重构一个 Backbone 应用程序以利用 RequireJS 所倡导的模块化结构，则需要做一些准备工作来让代码就绪。如果你正在构建一个新的\
  \ Backbone 应用程序，可以直接跳到关于 Yeoman 的部分，其中描述了创建基于 RequireJS 的 Backbone 应用程序的简单快速启动方法。\n\
  \n为了说明如何将 RequireJS 整合到现有应用程序中，让我们再次审视一下 第 6 章 中的 Twitter 示例应用程序。\n\n#### 初始 RequireJS\
  \ 包含\n\n首先，创建 第 6 章 代码的完整副本，并将 `require.js` 添加到 `js/external` 目录中。为了遵循标准的 RequireJS\
  \ 约定，创建一个负责初始配置的 `main.js` 文件。该文件应放置在 `js` 目录中。原始 `index.html` 文件中的所有脚本包含都可以缩减为标准的\
  \ RequireJS 包含。\n\n```\n<script data-main=\"js/main\" src=\"js/external/require.js\"\
  ></script>\n```\n\n这个初始步骤不提供任何功能，但它涵盖了开始迁移到 RequireJS 的三个主要步骤：\n\n- 下载 RequireJS。\n\
  - 移除主 HTML 页面中现有的脚本标签。\n- 包含 RequireJS 并附带一个负责初始设置的 `main.js` 文件。\n\n#### 为 RequireJS\
  \ 配置 Backbone\n\n有了 `main.js` 之后，你现在可以执行一些 RequireJS 的初始配置，以使像 Backbone 这样未以模块形式编写的库能够被\
  \ RequireJS 系统使用。这在 “使用 RequireJS” 部分的 shim 配置选项中已有简要提及。\n\n首先，我们需要在 `main.js` 中为\
  \ RequireJS 创建一个初始配置对象。\n\n```\nrequire.config({\n\n});\n```\n\n各个库的路径应添加到配置的 `paths`\
  \ 部分。这告诉 RequireJS 可以在哪里找到像 Backbone、jQuery 和 Underscore 这样的库。每个库都会被赋予一个 ID。\n\n\
  ```\nrequire.config({\n    paths: {\n        jquery: './external/jquery-1.10.2',\n\
  \        backbone: './external/backbone',\n        underscore: './external/underscore',\n\
  \    }\n});\n```\n\n请注意，无需在库的路径末尾附加 `.js`；RequireJS 会自动添加。\n\n这种配置的好处之一是，即使我们将 jQuery\
  \ 引用为 `jquery`，它也可以指向一个特定的版本。这是整个代码中唯一需要考虑版本的地方。随着你的应用程序中使用新的 jQuery 版本，只需在此位置更新路径即可。需注意，在\
  \ RequireJS 中，jQuery 必须始终被称为 `jquery`。它已经兼容 AMD，但它是一个具名模块，该名称不得偏离 `jquery`。\n\n\
  需要处理的下一部分配置是 shim。对于所有未使用 RequireJS `define()` 语法创建的库，需要在此处使其可用。由于 jQuery 已经将自身定义为一个模块，因此不需要将其包含在\
  \ `shim` 部分中。\n\n每个库都使用在 `paths` 部分中给出的相同名称进行标识。每个库可能有一些依赖项，这些依赖项在 `deps` 属性中以字符串数组的形式列出。在以下示例中，Backbone\
  \ 同时依赖于 Underscore 和 jQuery。由于 Underscore 本身没有依赖关系，因此不需要为其定义任何 `deps`。\n\nshim 中列出的每个库都需要定义一个\
  \ `exports` 属性，该属性提供对用于访问该库的全局变量的访问权限。对于 Underscore，这是 `_`，就像你在没有 RequireJS 的情况下使用该库一样；Backbone\
  \ 显然使用 `Backbone` 作为其导出值。\n\n```\nshim: {\n    underscore: {\n        exports: '_'\n\
  \    },\n    backbone: {\n        deps: [\n            'underscore',\n         \
  \   'jquery'\n        ],\n        exports: 'Backbone'\n    },\n},\n```\n\n为确保一切正常，在\
  \ `main.js` 的 RequireJS 配置之后添加以下代码行。它简单使用 RequireJS 加载 Backbone 并调用启动历史记录。如果这里出现问题，你将在浏览器控制台中看到错误信息。\n\
  \n```\nrequire([\n    'backbone'\n], function (Backbone) {\n    Backbone.history.start();\n\
  \    console.log('All ok');\n});\n```\n\n我们的示例应用程序还依赖于其他一些库，包括 Handlebars 和 Moment.js。这些也需要包含在配置的\
  \ `path` 和 `shim` 部分中。以下代码展示了 Twitter 示例应用程序的完整 RequireJS 配置：\n\n```\nrequire.config({\n\
  \    shim: {\n        underscore: {\n            exports: '_'\n        },\n    \
  \    backbone: {\n            deps: [\n                'underscore',\n         \
  \       'jquery'\n            ],\n            exports: 'Backbone'\n        },\n\
  \        handlebars: {\n            exports: 'Handlebars'\n        },\n        moment:\
  \ {\n            exports: 'moment'\n        },\n        dialog: {\n            exports:\
  \ 'Dialog'\n        },\n    },\n    paths: {\n        jquery: './external/jquery-1.10.2',\n\
  \        backbone: './external/backbone',\n        underscore: './external/underscore',\n\
  \        handlebars: './external/handlebars',\n        moment: './external/moment'\n\
  \    }\n});\n```\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格遵循您的注意事项和示例格式，将给定的英文文本翻译成中文。\n\n\n\
  #### 使用 RequireJS 重构你的应用\n\n在为所有外部库配置好 RequireJS 之后，接下来的任务是重构你为应用程序创建的所有 JavaScript\
  \ 代码，使其适应这种模块化方法。\n\n总的来说，你应该能够将以下模式应用于你的所有代码，以确保其符合规范。首先，将以下内容附加到文件的开头。这是你定义文件依赖项的地方，每个依赖项都将作为参数传递给回调函数。\n\
  \n`define([ ], function() {`\n\n文件中已存在的代码可以保持不变，文件可以用下面的代码来结尾：\n\n```\n// 导出的内容：\n\
  return object;\n```\n\n`});`\n\n现在，每当另一个 JavaScript 文件对已定义的模块调用 `require` 时，它都会收到正确的对象。为了更好地理解如何迁移应用程序代码，让我们首先考虑\
  \ `Timeline` 视图，它是应用的核心。`TimelineView` 对象本身有许多依赖项：\n\n- 集合：`Timeline.js`\n- 模型：`Tweet.js`\n\
  - Handlebars 助手：`Helpers.js`\n\n要使视图成为一个模块，所有下游依赖项也需要转换为模块。最好的起点是堆栈的底层，即 `Tweet`\
  \ 模型对象。它有一个简单的依赖项列表：Backbone 和 Moment.js，这两个库都已经在 RequireJS 配置中定义好了。首先，需要将这些定义放在文件的开头。\n\
  \n```\ndefine(['backbone', 'moment'], function(Backbone, moment) {\n    var com\
  \ = com || {};\n    com.apress = com.apress || {};\n    com.apress.model = com.apress.model\
  \ || {};\n    com.apress.model.Tweet = Backbone.Model.extend({\n        parse: function(model){\n\
  \            var created = model.created_at;\n            var friendly = moment(model.created_at,\
  \ \"ddd MMM DD HH:mm:ss ZZ YYYY\").fromNow();\n            model.friendlyDate =\
  \ friendly;\n            return model;\n        }\n    });\n    return com.apress.model.Tweet\n\
  });\n```\n\n该文件的末尾追加了一条 return 语句，该语句引用了 `com.apress.model.Tweet` 变量，然后关闭了 `define`\
  \ 函数。这是最简单的重构，因为它不依赖于任何其他自定义创建的对象。\n\n接下来，需要重构集合 `Timeline.js`。这会有点不同，因为它是第一个依赖于其他自定义对象的对象。该集合对象依赖于\
  \ Backbone 和刚刚被转换为模块的 `Tweet` 模型。\n\n```\ndefine([ 'backbone', 'app/model/Tweet'],\
  \ function(Backbone, Tweet) {\n    var com = com || {};\n    com.apress = com.apress\
  \ || {};\n    com.apress.collection = com.apress.collection || {};\n    com.apress.collection.Timeline\
  \ = Backbone.Collection.extend({\n        //该集合使用的模型\n        model: Tweet,\n  \
  \      //为集合连接的服务器端 URL\n        url: 'http://localhost:8080/timeline',\n      \
  \  initialize: function(options){\n            //此处定义在构造时需要初始化的内容\n        },\n\
  \    });\n    return com.apress.collection.Timeline;\n});\n```\n\n尽管转换模式与之前所述相同，但对\
  \ `Tweet` 模型的任何引用都已从 `com.apress.model.Tweet` 更改为 `Tweet`。这是因为该模块已以此名称公开，而不是使用命名空间版本。实际上，在使用\
  \ RequireJS 时，你可以考虑从代码中删除命名空间概念。\n\n`TimelineView` 遵循相同的方法，尽管它有更长的依赖项列表，包括 Handlebars\
  \ 和 jQuery，以及 `Timeline` 对象。\n\n```\ndefine(['jquery', 'handlebars', 'backbone',\
  \ 'app/collection/Timeline'], function($, Handlebars, Backbone, Timeline) {\n  \
  \  var com = com || {};\n    com.apress = com.apress || {};\n    com.apress.view\
  \ = com.apress.view || {};\n    com.apress.view.TimelineView = Backbone.View.extend({\n\
  \        el: '#timeline',\n        template: Handlebars.compile($(\"#timeline-template\"\
  ).html()),\n        timeline: null,\n        events: {\n            'click .profile':\
  \ 'showDialog'\n        },\n        initialize: function(options){\n           \
  \ var self = this;\n            //为该视图创建一个要渲染的集合\n            self.timeline = new\
  \ Timeline();\n            //初始渲染\n            self.render();\n            //强制\
  \ fetch 触发 reset 事件\n            self.timeline.fetch({reset:true});\n          \
  \  self.listenTo(self.timeline, 'reset', self.render);\n        },\n        render:\
  \ function(){\n            var self = this;\n            if(self.timeline.models.length\
  \ > 0){\n                var output = self.template({tweet: self.timeline.toJSON()});\n\
  \                self.$el.append(output);\n            }\n            return self;\n\
  \        },\n        showDialog: function(options){\n            var self = this,\n\
  \                $target = $(options.currentTarget),\n                username =\
  \ $target.data('user');\n            /**\n            * 重用 profile 视图\n        \
  \    **/\n            var profileView = new com.apress.view.ProfilePopupView({user:\
  \ username});\n        }\n    });\n    // 导出内容：\n    return com.apress.view.TimelineView;\n\
  });\n```\n\n请注意，此处对 `Timeline` 集合的引用也已更改。不再是下面这样：\n\n`self.timeline = new com.apress.collection.Timeline();`\n\
  \n它使用了 RequireJS 模块引用：\n\n`self.timeline = new Timeline();`\n\n最后，需要使 Handlebars\
  \ 助手可以从 RequireJS 访问。该模块不需要导出任何东西；它只需要执行代码以将助手添加到 `Handlebars` 模块。\n\n```\ndefine(['handlebars'],\
  \ function (Handlebars) {\n    Handlebars.registerHelper('format', function (str)\
  \ {\n        if(str){\n            //高亮 @ 部分\n            //http://www.simonwhatley.co.uk/parsing-twitter-usernames-hashtags-and-urls-with-javascript\n\
  \            str = str.replace(/[@]+[A-Za-z0-9-_]+/g, function(u) {\n          \
  \      var username = u.replace('@','')\n                return '<a href=\"#\" data-user=\"\
  ' + username +'\" class=\"profile\">@'+username+'</a>';\n            });\n     \
  \       return new Handlebars.SafeString(str);\n        } else {\n            return\
  \ str;\n        }\n    });\n});\n```\n\n为了执行这些模块并查看 `TimelineView` 的效果，需要向 `main.js`\
  \ 添加一些额外的代码。现在，应用程序需要 Backbone 和 `TimelineView`，它们中的每一个都会加载自己依赖的模块。`Helpers` 模块也作为需求包含在此处，以便将其助手添加到\
  \ `Handlebars`。\n\n```\nrequire([\n    'backbone', 'app/view/TimelineView', 'app/util/Helpers'\n\
  ], function (Backbone, TimelineView) {\n    var timelineView = new TimelineView();\n\
  });\n```\n\n该视图是通过引用作为依赖项传递的 `TimelineView` 模块来创建的。只要每个对象都已转换为模块，`main.js` 末尾的这一部分将完成整个应用程序的配置，正如之前在\
  \ `app.js` 中介绍的那样。密切关注每个文件拥有的依赖关系非常重要。视图通常需要导入 jQuery (`$`) 和 Handlebars，以及 Backbone\
  \ 和你自己的自定义模块。如果你一直遵循命名空间约定，则可以轻松识别它们，因为它们都以 `com.apress` 开头。\n\n一旦所有代码成功迁移，下面的代码应该能够在与第\
  \ 6 章相同的条件下运行该应用：\n\n```\nrequire([\n    'backbone', 'app/view/TimelineView', 'app/view/ProfileView',\
  \ 'app/model/Search',\n    'app/view/SearchView', 'app/router/AppRouter', 'app/util/Helpers'\n\
  ], function (Backbone, TimelineView, ProfileView, Search, SearchView, AppRouter)\
  \ {\n    var timelineView = new TimelineView(),\n        profileView = new ProfileView({user:\
  \ 'sugrue'}),\n        searchModel = new Search(),\n        searchView = new SearchView({model:\
  \ searchModel}),\n        appRouter = new AppRouter({searchModel: searchModel});\n\
  \    Backbone.history.start();\n});\n```\n\n\n\n## 使用 Yeoman 快速上手\n\n在第 10 章中，我们讨论了\
  \ `Grunt` 如何通过生成器帮助你快速构建完整的应用结构。Yeoman ([`http://yeoman.io`](http://yeoman.io/)，图\
  \ 12-3) 让这一过程更加便捷，它提供了适用于 Backbone 应用的生成器，并利用了 `RequireJS`。\n\n![A978-1-4302-6335-7_12_Fig3_HTML.jpg](img/A978-1-4302-6335-7_12_Fig3_HTML.jpg)\n\
  \n图 12-3. Yeoman 网站 [`http://yeoman.io`](http://yeoman.io/)\n\nYeoman 由 Google Chrome\
  \ 开发者关系团队创建，是一个工具栈，整合了三种工具以提升你在创建 Web 应用时的生产力。它包含我们在第 9 章中深入讨论过的 `Grunt`，以及另外两个工具：`Bower`\
  \ 和 `Yo`。\n\n`Bower` 是一个用于 Web 应用中库和框架的包管理器。与 `NPM` 类似，`Bower` 允许你通过命令行下载所需的库，并自动附带所有依赖库。这大大改进了下载库并查找其依赖项的过程。\n\
  \n`Yo` 是 Yeoman 的核心，提供了一种脚手架工具，用于从命令行从头构建 Web 应用。目前已有许多生成器可用，包括 Backbone 生成器，我们将在后续章节中重点介绍。\n\
  \n### 安装 Yeoman\n\n与许多 JavaScript 工具一样，Yeoman 通过 Node.js 的 `npm` 命令安装。你只需使用以下命令：\n\
  \n```\nnpm install -g yo\n```\n\n如果你使用的是 Node 1.2.10 或更新版本，此时 `grunt-cli` 和 `bower`\
  \ 也会自动安装。如果没有，你可以使用以下命令手动安装这些依赖项：\n\n```\nnpm install -g grunt-cli bower\n```\n\n\
  通过在命令行输入 `yo` 来测试安装是否成功。你应该会看到类似图 12-4 的输出。\n\n![A978-1-4302-6335-7_12_Fig4_HTML.jpg](img/A978-1-4302-6335-7_12_Fig4_HTML.jpg)\n\
  \n图 12-4. 运行 `yo` 命令的输出\n\n默认安装将包含两个生成器：一个 mocha 生成器和一个 web 应用生成器。下一节将介绍如何安装和使用\
  \ Backbone 生成器。\n\n### 使用 Backbone 生成器\n\n生成器的安装是在 `yo` 命令行中进行的。输入 `yo` 后，你会看到“安装一个生成器”的选项。选中后，你可以搜索生成器并选择所需的那一个。在此情况下，选择\
  \ `generator-bb`，如图 12-5 所示。\n\n![A978-1-4302-6335-7_12_Fig5_HTML.jpg](img/A978-1-4302-6335-7_12_Fig5_HTML.jpg)\n\
  \n图 12-5. Yeoman 安装 Backbone 生成器时的输出\n\n要运行 Backbone 生成器，只需在命令行输入 `yo backbone`。系统会为你提供一系列\
  \ Backbone 应用的选项。在撰写本文时，这些选项包括：\n\n*   是否使用 Twitter Bootstrap 搭配 SASS 或 CoffeeScript\n\
  *   是否包含 RequireJS\n\n默认情况下，生成的应用将包含 jQuery、Backbone.js、Modernizr 和 HTML5 Boilerplate。HTML5\
  \ Boilerplate 项目是一个前端模板，而 Modernizr 则为你的应用提供特性检测功能，让你了解当前浏览器支持哪些特性。\n\n该生成器还会创建一个\
  \ `Grunt` 脚本，并预配置好任何 JavaScript 应用所需的标准任务集。这些任务包括压缩、静态分析和测试，如第 9 章所述。默认情况下，还包含了实时重载任务。当服务器任务运行时，若对任何源文件做出更改，你的\
  \ Web 浏览器实例将自动刷新。\n\n要启动示例应用，只需在命令行运行以下命令：\n\n```\ngrunt server\n```\n\n这将在你的 Web\
  \ 浏览器中打开页面，效果应如图 12-6 所示。\n\n![A978-1-4302-6335-7_12_Fig6_HTML.jpg](img/A978-1-4302-6335-7_12_Fig6_HTML.jpg)\n\
  \n图 12-6. 由 Yeoman Backbone 生成器生成的 Backbone 应用\n\n生成器提供了有用的快捷方式来创建额外的视图，而无需手动添加模型、集合、视图和路由器。例如，要创建一个简单的视图，只需使用如下命令：\n\
  \n```\nyo backbone:view Timeline\n```\n\n这将生成两个文件。首先是一个 `ejs` 模板，如果你希望改用本书讨论的其他模板系统，可以将其替换。同时还会创建一个与传入名称匹配的视图，在本例中为\
  \ `Timeline.js`。如果你选择在应用中使用 `RequireJS`，生成的代码将如下所示：\n\n```\n/*global define*/\n\n\
  define([\n   'jquery',\n   'underscore',\n   'backbone',\n   'templates'\n], function\
  \ ($, _, Backbone, JST) {\n   'use strict';\n   var TimelineView = Backbone.View.extend({\n\
  \       template: JST['app/scripts/templates/Timeline.ejs']\n   });\n   return TimelineView;\n\
  });\n```\n\n我认为这是开始一个新应用并使用 `RequireJS` 的最简单方式，无需处理所有样板代码。\n\n## Backbone 应用的设计模式\n\
  \n在设计应用时，应用一些设计模式是值得的，例如著名的“四人帮”书籍《设计模式：可复用面向对象软件的基础》中讨论的那些模式。这些模式涵盖了一些被广泛理解的方法，用于解决软件设计中常见的共性问题。虽然有很多模式可以应用到你的应用中，但本节重点介绍对\
  \ Backbone 应用最实用的两种模式：外观模式和中介者模式。\n\n\n\n### 利用外观模式\n\n外观模式背后的理念是隐藏复杂的实现细节，使模块只向调用代码暴露最必要的内容。这种模式被称为结构型模式，因为它定义了一种实现实体间关系的简单方法。《设计模式》一书中的经典定义指出，外观模式应实现以下目标：“为子系统中的一组接口提供一个统一的接口。外观定义了一个更高层级的接口，使子系统更易于使用。”\n\
  \n在 Backbone 应用中创建的外观，可能会将多个模块的工作封装到调用方使用的单个模块中，但更常见的做法是，你只需创建那些仅导出核心功能的模块。使用外观模式的主要目的是，确保使用你模块的其他开发者永远无需担心底层细节。\n\
  \n外观模式的一个实用场景是`Model`对象。使用默认的 Backbone 模型对象时，你可以通过名称获取任意属性。虽然这简单方便，但如果数据结构发生变化，使用该模型的代码可能会面临风险。添加\
  \ getter 和 setter 函数可以将你与这些变化隔离开来，这样一来，唯一需要处理数据结构变化的代码就只存在于模型内部。\n\n请参考以下来自第 6 章的示例，我们通过第三方\
  \ API（如 Twitter）获取数据，并用 Backbone 模型表示它：\n\n```\nvar com = com || {};\ncom.apress\
  \ = com.apress || {};\ncom.apress.model = com.apress.model || {};\ncom.apress.model.Tweet\
  \ = Backbone.Model.extend({\n   parse: function(model){\n      var created = model.created_at;\n\
  \      var friendly = moment(model.created_at, \"ddd MMM DD HH:mm:ss ZZ YYYY\").fromNow();\n\
  \      model.friendlyDate = friendly;\n      return model;\n   }\n});\n```\n\n如果推文的数据结构发生变化，且`Tweet`对象在多个地方被使用，那么这些变化将对我们的代码造成干扰。更好的做法是提供\
  \ getter 函数来获取所需属性。\n\n```\nvar com = com || {};\ncom.apress = com.apress || {};\n\
  com.apress.model = com.apress.model || {};\ncom.apress.model.Tweet = Backbone.Model.extend({\n\
  \   parse: function(model){\n      var created = model.created_at;\n      var friendly\
  \ = moment(model.created_at, \"ddd MMM DD HH:mm:ss ZZ YYYY\").fromNow();\n     \
  \ model.friendlyDate = friendly;\n      return model;\n   },\n   getText: function(){\n\
  \      return this.get('text');\n   },\n   getProfileImage: function(){\n      return\
  \ this.get('user').profile_image_url;\n   },\n   getUserName: function(){\n    \
  \  return this.get('user').name;\n   }\n});\n```\n\n外观模式可用于应用中创建的任意模块。例如，你可以不返回基础模型对象，而是直接导出一个模块使用者所需的函数。在下面的代码示例中，表示复杂操作的两个函数对模块保持私有，而一个简单的`convert`函数则对调用方开放。\n\
  \n```\n/*global define*/\ndefine([\n   'underscore',\n   'backbone'\n], function\
  \ (_, Backbone) {\n   'use strict';\n   var ConversionModel = Backbone.Model.extend({\n\
  \       defaults: {\n       },\n       complexOperation: function(value){\n   //此处执行复杂工作\n\
  \       },\n        secondOperation: function(value){\n   //第二个操作\n}\n});\n   return\
  \ {\nconvert: function(value){\n      return ConversionModel.complexOperation(value)\
  \ + ConversionModel.secondOperation(value);\n   }\n}\n});\n```\n\n使用外观模式后，底层的实现细节可以任意变化，而无需担心任何使用你模块的其他代码。\n\
  \n### 利用中介者模式\n\nJavaScript 应用中另一个流行的模式是中介者模式，它有助于在模块之间实现更高程度的解耦。中介者模式被称为行为型模式，因为它处理的是对象之间的关系和职责。《设计模式》一书中的定义指出，该模式实现以下目标：“通过封装不同对象集之间交互和通信的方式，实现松耦合。允许每个对象集的行为独立于其他对象集而变化。”\n\
  \n这种模式最好的类比是机场控制塔：控制塔（中介者）负责管理谁可以起飞和降落，所有进出飞机的通信都通过控制塔进行，而不是让各架飞机之间相互通信。\n\n大型应用可以通过引入一个单一的中介者来获益，该中介者提供事件传递的单一节点，由这个中央模块决定哪些模块应收到通知。\n\
  \n以下代码片段展示了一个中介者的实现示例。该模块暴露了两个函数。首先是`subscribe`函数，模块可以使用它来注册对特定事件类型的兴趣。此外还有一个`notify`函数，允许任何模块向中介者通知新事件。\n\
  \n```\ndefine( function(){\n      //一个频道列表，每个频道本身又含有一个订阅者列表\n      var channels\
  \ = [];\n      var publish  = function(eventType, params){\n         //查找订阅者\n \
  \        if(channels[eventType]){\n            for(var i= 0; i < channels[eventType].length;\
  \ i++){\n               var channel = channels[eventType][i];\n               channel.callback.call(channel.context,\
  \ params);\n            }\n         }\n      };\n       return {\n           subscribe:\
  \ function(eventType, callback){\n              if(!channels[eventType]){\n    \
  \             channels[eventType] = [];\n              }\n              channels[eventType].push({context:\
  \ this, callback: callback});\n           },\n           notify: function(eventType,\
  \ params){\n              publish(eventType, params);\n           }\n       }\n\
  \   }\n);\n```\n\n每个模块注册时，它会被添加到一个频道列表中。请注意，这是一个简单的实现，没有提供取消注册的函数。\n\n这个模块的使用方法非常简单。任何模块都可以通过回调函数注册对特定事件的处理兴趣。\n\
  \n```\nrequire(['Mediator'], function(mediator){\n   var callback = function(args){\n\
  \      console.log('处理名称更改。值为 ' + args.name);\n   };\n   mediator.subscribe('name.change',\
  \ callback);\n});\n```\n\n在以上代码中，有一个回调函数订阅了`name.change`通知的处理。要触发该通知，需要调用`notify`函数。\n\
  \n```\nmediator.notify('name.change', {name: 'Beginning Backbone.js'});\n```\n\n\
  这会导致与该事件相关的回调函数被触发。这是一个小规模的示例，用于说明该模式的使用方式。你会在常见的代码仓库（如 GitHub）中找到大量此类发布-订阅模式的实现。\n\
  \n为应用中的所有事件提供一个中央控制模块，会使你的应用更易于管理。除了能够跨所有模块分发通知外，中介者还可以扩展，以便在应用处于特定状态时抑制通知。\n\n\n\
  \n\n"
- '# 总结


  本章探讨了确保应用程序保持模块化和可测试性的一些最佳实践。我们了解了如何利用 `RequireJS` 将代码拆分为带有真实依赖管理的简单模块。`RequireJS`
  不仅能让代码更易于维护和测试，还能创建一种结构，使新加入团队的开发者能够更轻松地理解和浏览代码。除了演示如何将 `RequireJS` 集成到现有的 `Backbone`
  应用中，本章还介绍了 `Yeoman`，它作为一种工具，可以从零开始创建新的 `Backbone` 项目，无需编写大量样板代码，同时依然能享受到 `RequireJS`
  带来的好处。


  最后，我们探讨了如何利用两种经典的设计模式——**外观模式**和**中介者模式**——来让代码更易于管理。需要牢记的关键点是：尽管 JavaScript 是一种动态语言，几乎允许你为所欲为，但始终有机会为代码应用真正的结构，使其经得起未来考验，并随时准备应对项目生命周期后期新增的任何应用程序需求。





