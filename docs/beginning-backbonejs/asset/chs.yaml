- "# 8. 测试你的 Backbone.js 应用\n\n## 摘要\n\n测试是大型 JavaScript 应用开发中最重要的活动之一。在庞大的 JavaScript\
  \ 生态系统中，有众多测试应用的工具可选，这意味着我们再没有理由不去测试 JavaScript 代码。本章将介绍一些主流的测试框架，并探讨如何编写可测试代码，这不仅会提升应用的稳定性，还能带来更清晰的架构。此外，本章还将分析将测试驱动开发应用于\
  \ JavaScript 代码的几个关键原因。\n\n## 测试驱动开发的优势\n\n测试驱动开发（TDD）源自极限编程的若干理念，它描述了一个要求开发者在编写应用代码的同时编写测试的过程。理想情况下，测试应首先编写，并预期其会失败。随后再编写代码，使下一次运行测试时能够通过。之后，如果有更多测试失败，则对代码进行重构。整个过程是迭代式的，如图\
  \ 8-1 所示。\n\n![A978-1-4302-6335-7_8_Fig1_HTML.jpg](img/A978-1-4302-6335-7_8_Fig1_HTML.jpg)\n\
  \n**图 8-1.** 测试驱动开发的迭代本质\n\n当以最严格的方式遵循测试驱动开发时，你需要按以下顺序执行步骤：\n\n- **编写测试：** 在编写任何新代码之前，你需要先编写一个会失败的测试。当然，测试不可能通过，因为待实现的功能尚不存在。这样做的好处是，它能迫使你在开始编码之前，仔细思考新代码在特定条件下应有的行为。在开始这一过程之前，你需要对需求有良好的理解。\n\
  - **运行测试并预期失败：** 下一步是执行你刚刚编写的测试用例，预期结果将是失败。这是一个关键步骤，因为它能验证测试确实被纳入了你的测试套件（即应用中所有测试用例的集合）。同时，它也确保在功能代码未就绪时，测试不会通过。有了会失败的测试，你就可以相当确信自己在测试正确的行为。\n\
  - **编写生产代码：** 在有了会失败的测试用例后，你就可以开始开发工作了。此时编码的重点从“为完成功能而编码”转变为“专门让失败的测试用例通过”。这使得编码过程更加审慎和科学。你可能会忍不住添加一些覆盖需求但与当前测试用例无关的代码。这应当避免，而应利用这个机会再次迭代此过程，从针对该功能编写一个会失败的测试开始。\n\
  - **运行测试套件：** 现在你可以重新运行测试套件，预期此时它应该全部通过。如果测试失败，你可能需要调整部分生产代码。一旦测试通过，就可以进入重构步骤。\n\
  - **重构代码：** 重构是指优化代码，使其更整洁、质量更高的过程。你刚刚为了使测试通过而编写的代码很可能并不理想。重构的一个常见主题是将重复代码提取到共享函数或工具类中。\n\
  - **重复：** 当你进入下一个需求时，你会不断重复这个过程。如果你是测试驱动开发的新手，可能会觉得有些别扭和缓慢。但如果你能投入时间遵循这一过程，回报将是巨大的，而且这个过程会逐渐变得自然。\n\
  \n### 为测试驱动开发提供论据\n\n可以想象，推行如此严格的开发流程可能会引发争议，尤其是在那些测试很少或根本没有的团队中。显而易见，拥有一套随时间增长的测试套件会提升项目质量，但对开发者而言，这似乎是一条漫长的道路，因为他们往往只想尽快实现功能。项目经理可能会发现，采用这种流程后，初始交付速度会变慢。考虑到这一点，以下要点列出了采用这一流程的主要理由：\n\
  \n\n\n## 测试驱动开发的优势\n\n从长远来看，你将节省时间：回想一下你参与过的任何没有单元测试的项目。你是否需要修复大量缺陷？你是否花了很多时间调试？你是否在将代码交付给\
  \ QA 团队后，却因为代码被记录了一个又一个缺陷而感到沮丧？你是否希望在交付前编写更多测试，并更好地理解开发目标？如果这些问题中的部分或全部都适用于你，别担心——你并不孤单。事实上，现有的大量测试框架就证明了这一点。如果不是每个开发者都经历过这些问题，那么构建这些库的工作就没必要了。提前编写测试是有成本的。你需要先搭建基础设施，比如选择一个测试框架。你还需要设置某种持续集成系统，我们将在后续章节中讨论。但相比于未测试代码所需付出的代价，这个成本只是很小的一部分。将单元测试与生产代码一起编写，可以降低从\
  \ QA 返回的缺陷数量。即使你的构建中确实存在缺陷，你也会开始遵循一个流程：首先编写一个测试来复现该缺陷，然后按照 TDD 流程清除它。这将减少功能回归的可能性，因为你的自动化测试套件会持续检查相关问题的存在。采用测试驱动开发方法，会在项目交付给客户时带来更平稳的收尾阶段。它能避免软件开发项目中常见的那些深夜修复缺陷的马拉松，从长远来看让你感觉更好。与其浪费时间处理本不该出现的缺陷，不如腾出时间持续开发新功能。哪个开发者不想这样呢？\n\
  \n执行测试用例将会很快：可能存在一种误解，认为如果代码库庞大，单元测试数量众多，那么测试套件的执行就会花费很长时间。也许过去确实如此，但在当今时代，有许多测试框架可以实现闪电般的测试执行速度，即使是测试浏览器中的\
  \ UI 也是如此。本章后面你会看到 PhantomJS 如何彻底改变了 Web 应用 UI 测试的速度。一些遗留系统可能在后端数据的规模和容量方面存在问题。与这些数据的交互可能需要时间，特别是当\
  \ REST 调用返回大量数据时。不过，你可以为单元测试创建一个\"模拟服务器\"，它能以可预测且可重复的方式更快地返回数据。通过用这些模拟版本替换执行缓慢的真实系统，你可以几乎毫不费力地加快单元测试的速度。\n\
  \n代码将更容易理解：在加入一个新项目时，理解代码可能需要一段时间，尤其是在文档很少或根本没有的情况下。测试用例可以作为现有代码的宝贵文档。测试展示了如何调用对象、代码预期做什么，以及它如何与服务器和其他类交互。编写测试实际上可以减少新开发者熟悉你的项目所需的时间。此外，遵循\
  \ TDD 方法可以确保在将构建交给 QA 团队之前，需求已被充分理解并经过测试。虽然你在测试驱动开发的最初几次迭代中可能并不完全理解需求，但你无疑会越来越擅长它。当你交付质量更高、缺陷更少的代码时，你作为成熟开发者的声誉会在\
  \ QA 部门和管理团队中得到提升。\n\n最终的代码结构将更加良好：无需在测试工具中隔离运行代码，你可以自由地决定如何组织代码结构。代码可以紧密耦合到你想要的程度，比如将模型代码放在视图类中，以及其他反模式。你会发现，你必须遵循\
  \ MV*范式，将模型、视图和逻辑清晰地分离，以便于更容易地进行测试。\n\n框架已经存在，你应该使用它们：一个反对测试 JavaScript 代码的常见理由是它太难了。诚然，JavaScript\
  \ 仍然感觉像是一门\"新\"语言，并且没有 Java 和 C#等语言中存在的类型安全，这可能会显得有些混乱。在本书中，我们看到了 Backbone 如何在你代码结构中强制推行一种新的纪律：有控制的、面向对象的\
  \ JavaScript 是可行的。随着为构建繁荣的 JavaScript 生态系统所付出的所有努力，许多测试框架已经涌现出来，以确保质量达到你的预期。作为 Backbone\
  \ 用户，如果某些功能不能按预期工作，你会感到非常失望。正如 Backbone 开发团队包含了大量测试（如果不信，可以查看`https://github.com/jashkenas/backbone/tree/master/test`！），你在自己的代码交付中也应抱有同样的自豪感。在本章中，你将看到将这些测试框架集成到你的项目中是多么容易。当如此简单的事情能为你赢得如此多的尊重时，你就很难抗拒了。\n\
  \n### 处理遗留代码库\n\n在还没有生产代码的全新项目中，测试驱动开发总是一个好主意。然而，在现实中，你将处理现有的、可能根本没有测试的代码。在项目生命周期的这个阶段引入\
  \ JavaScript 代码的单元测试纪律可能会充满挑战。\n\n处理这种情况的广泛接受的经验法则是增量地添加测试，而不是一头扎进数月艰苦的单元测试中，却几乎看不到投资回报。相反，值得确定一些关键领域，在这些领域添加测试可以带来益处。\n\
  \n-   任何正在添加到项目中的新功能都可以受益。\n-   如果代码的某些部分正在进行重构，值得先编写测试，以确保重构前后的代码行为一致。\n-   每个应用程序都有一些容易产生大多数缺陷的问题区域。值得以可管理的数量（例如三个）为一组来确定这些区域，并为每个区域添加全面的测试。\n\
  -   应用童子军规则，正如 Robert C. Martin 的《代码整洁之道》中所列，即代码应\"比你发现它时更整洁\"。如果你要向一个 JavaScript\
  \ 文件添加一些代码，请花时间添加一个额外的测试以增加测试覆盖率。\n\n## 测试自动化\n\n在介绍 JavaScript 世界中可用的各种测试框架之前，值得指出的是，在理想情况下，每当代码库发生变更时，你的所有测试用例都应该以自动化方式运行。这确保了测试失败能被尽早发现，并免除了开发者必须始终运行测试的责任。下一章将介绍这种形式的持续集成，以及使用\
  \ Grunt 任务运行器的其他 JavaScript 构建流程。虽然本章的主要焦点是使用`QUnit`编写测试，但我们也会看看`Jasmine`和`Selenium`。\n\
  \n\n\n### 使用 QUnit 进行测试\n\nQUnit（[`www.qunitjs.com`](http://www.qunitjs.com/)）可以被视为\
  \ JavaScript 开发者的默认测试框架。它最初由 Jörn Zaefferer 作为 jQuery 的一部分开发，用于测试该框架本身，并于 2009 年成为一个独立项目，现在被广泛用于最流行的\
  \ JavaScript 库中，其中就包括 Backbone。本节将介绍如何开始使用 QUnit，重点关注对第 6 章中所编写代码的测试。\n\n#### QUnit\
  \ 入门\n\n将 QUnit 集成到你的项目中异常简单。首先，从 [`http://qunitjs.com`](http://qunitjs.com/) 引入\
  \ JS 和 CSS 文件，如图 8-2 所示。\n\n![A978-1-4302-6335-7_8_Fig2_HTML.jpg](img/A978-1-4302-6335-7_8_Fig2_HTML.jpg)\n\
  \n图 8-2.\n\n[`QUnitjs.com`](http://qunitjs.com/)\n\n代码库的结构至关重要：你不会希望生产代码和测试代码混杂在一起，因此明智的做法是创建一个单独的测试文件夹。由于本章的目标是测试第\
  \ 6 章中编写的代码，我们可以简单地复制该文件夹，并在 `app` 目录旁边创建一个名为 `test` 的文件夹。由于我们还将使用其他测试库，QUnit 的\
  \ JavaScript 和 CSS 文件应放置在 `qunit` 目录中。最后，我们将包含一个充当测试驱动器的 `index.html` 文件和一个包含测试套件的\
  \ `tests.js` 文件。目录结构现在应如图 8-3 所示。\n\n![A978-1-4302-6335-7_8_Fig3_HTML.jpg](img/A978-1-4302-6335-7_8_Fig3_HTML.jpg)\n\
  \n图 8-3.\n\nQUnit 测试的目录结构 注意\n\n你也可以从 jQuery 内容分发网络（CDN）[`http://code.jquery.com/`](http://code.jquery.com/)\
  \ 引入这些文件。\n\n有了这个结构，我们现在就可以编写一个简单的测试用例了。首先，你需要在 `index.html` 中添加一些代码，以链接 QUnit 的\
  \ CSS 和 JavaScript 文件，以及你自己的测试套件 `tests.js`。由于此文件还将展示测试执行的结果，你应包含一个 ID 为 `qunit`\
  \ 的 `div`，结果将被追加到该元素中。\n\n```\n<html>\n<head>\n<title>第 8 章：QUnit</title>\n<link\
  \ rel=\"stylesheet\" href=\"qunit/qunit-1.12.0.css\">\n</head>\n<body>\n<div id=\"\
  qunit\"></div>\n<div id=\"qunit-fixture\"></div>\n<script src=\"qunit/qunit-1.12.0.js\"\
  ></script>\n<script src=\"tests.js\"></script>\n</body>\n</html>\n```\n\n请注意第二个与\
  \ QUnit 相关的 `div`，名为 `qunit-fixture`。此元素将包含来自每个测试的 DOM 元素。随着每个测试的执行，该部分的内容会被重置，因此你无需担心一个测试的执行会影响另一个测试。\n\
  \n现在我们可以继续定义简单的 QUnit 测试用例了。任何测试的结构都遵循以下格式：\n\n```\ntest( \"测试名称\", function() {\n\
  //断言\n});\n```\n\n传入的第一个参数是测试的名称，应尽可能描述清晰。第二个参数是执行测试实际代码的函数。它将包含一个或多个断言来检查特定行为。\n\
  \n以下测试用例包含两个断言，其中一个会失败。`ok()` 断言检查第一个参数是否为真，如果是，则测试通过。两个断言都通过检查两个相等运算符来测试类似的功能。然而，由于第二个断言检查值和类型是否相同，该测试将失败。\n\
  \n```\ntest( \"简单相等性测试\", function() {\nok( 1 == \"1\", '通过简单相等检查');\nok( 1=== \"\
  1\", '通过严格相等检查')\n});\n```\n\n执行此测试用例的方法是打开在 `test` 目录中创建的 `index.html` 文件。由于其中一个测试失败，结果将报告一个测试通过，一个测试失败，如图\
  \ 8-4 所示。\n\n![A978-1-4302-6335-7_8_Fig4_HTML.jpg](img/A978-1-4302-6335-7_8_Fig4_HTML.jpg)\n\
  \n图 8-4.\n\nQUnit 测试结果\n\n要使测试通过，只需更改第二条语句使其返回真值即可。\n\n```\nok( 1 !== \"1\", '通过严格相等检查');\n\
  ```\n\n表 8-1 列出了 QUnit 中所有可用的断言。\n\n表 8-1.\n\nQUnit 断言\n\n| 断言 | 用途 |\n| --- | ---\
  \ |\n| `deepEqual(actual, expected, message)` | 执行深度递归比较断言，适用于所有基本类型、数组、对象、正则表达式、日期和函数\
  \ |\n| `equal(actual, expected, message)` | 执行非严格比较 |\n| `notDeepEqual(actual, expected,\
  \ message)` | `deepEqual()` 的逆运算，执行深度递归比较，如果对象不相等则返回成功 |\n| `notEqual(actual, expected,\
  \ message)` | `equal()` 的逆运算，执行非严格比较，如果对象不相等则返回成功 |\n| `notStrictEqual(actual, expected,\
  \ message)` | `strictEqual` 的逆运算，使用 `!==` 条件进行值和类型比较 |\n| `ok(condition, message)`\
  \ | 执行布尔断言，如果第一个参数为真则返回 true |\n| `strictEqual(actual, expected, message)` | 执行严格的值和类型断言，类似于普通\
  \ JavaScript 条件中的 `===` |\n| `throws()` | 断言回调函数在执行时抛出异常 |\n| `expect(number)` |\
  \ 定义在此文本执行期间期望的断言数量 |\n\n#### 将测试组织成模块\n\n将你的测试套件组织成测试模块会很有用。QUnit 通过 `module()`\
  \ 函数支持这一点，该函数接受一个 `String` 参数来指定模块名称。这应该放在属于该模块的每组测试声明之前，如下面的代码片段所示：\n\n```\nmodule('相等性测试');\n\
  test( \"简单相等性测试\", function() {\n ok( 1 == '1', '通过简单相等检查');\n ok( 1 !== '1', '通过严格相等检查')\n\
  \ notEqual(1, '2', '不相等');\n});\ntest('更多简单测试', function(){\n expect(2);\n equal(true,\
  \ true, '简单的 true == true 测试');\n strictEqual(true, true, '简单的 true === true 测试');\n\
  });\nmodule('另一个测试模块');\ntest('名称测试', function(){\n var name = 'James';\n equal(name,\
  \ 'James', '名称检查测试完成');\n});\n```\n\n当运行上述测试套件时，输出应与图 8-5 中的一致。请注意每组测试如何以其所属的模块名称作为前缀。右上角还有一个有用的下拉框，用于仅选择从其中一个模块获取的结果。\n\
  \n![A978-1-4302-6335-7_8_Fig5_HTML.jpg](img/A978-1-4302-6335-7_8_Fig5_HTML.jpg)\n\
  \n图 8-5.\n\n带模块的 QUnit 测试结果\n\n#### 测试异步函数\n\n你无疑会遇到代码库中需要测试的异步函数。QUnit 提供了一种非常有用的方法，通过\
  \ `asyncTest()` 函数来表示测试运行中包含此类需要测试的函数。\n\n```\nmodule('异步测试');\nasyncTest('asyncTest',\
  \ function() {\n expect(1);\n var actual = true;\n setTimeout(function() {\n   ok(actual,\
  \ '证明异步的简单测试');\n   start();\n }, 1000);\n});\n```\n\n在此测试用例中调用 `start()` 至关重要，因为它会重新启动测试运行器，该运行器本会等待一秒钟的超时过去后才能执行测试。没有这个调用，测试就会看似停滞。请注意，包含异步测试会增加你的测试套件的执行时间。\n\
  \n\n\n#### QUnit 回调函数\n\nQUnit 提供了多个回调函数，使你能够在测试套件开始、模块运行前或测试用例完成后执行代码。如果你需要在测试套件的特定节点进行数据设置或清理，或者只是想要使用自定义的监控和报告工具来捕获测试结果，这些回调函数会非常有用。\n\
  \n表格 8-2 列出了 QUnit 测试套件可用的回调函数，并为每个函数提供了示例代码片段。\n\n**表 8-2.** QUnit 回调函数列表\n\n|\
  \ 回调用途 | 代码片段 |\n| --- | --- |\n| 在 QUnit 测试套件运行开始时执行 | `QUnit.begin = function(){};`\
  \ |\n| 在 QUnit 测试套件结束时执行，提供断言的通过总数和失败总数作为参数 | `QUnit.done = function(failures, total){};`\
  \ |\n| 在每个断言执行后运行，提供测试用例的结果（`log` 或 `error`）以及消息 | `QUnit.log = function(results,\
  \ message){};` |\n| 在每个测试执行前运行，测试名称作为参数传入 | `QUnit.testStart = function(name){};`\
  \ |\n| 在每个测试执行后运行，测试名称、断言数和失败数作为参数传入 | `QUnit.testDone = function(name, failures,\
  \ total){};` |\n| 在每个模块执行前运行，模块名称作为参数传入 | `QUnit.moduleStart = function(name){};`\
  \ |\n| 在每个模块执行后运行，模块名称、失败断言数和断言总数作为参数传入 | `QUnit.moduleDone = function(name, failures,\
  \ total){};` |\n\n#### 测试执行期间的设置与清理\n\n单元测试用例中的一个常见需求是在测试之间包含两个阶段：一个设置阶段，可以添加某些数据或设置变量；一个清理阶段，在测试执行后进行清理，确保所有测试相互独立，且没有数据干扰其他测试运行。\n\
  \n设置和清理函数不是为每个测试单独定义的，而是作为模块的一部分定义，并将应用于该模块中执行的每个测试。例如，以下代码将在模块中的两个测试执行前运行`setup`方法，并在每个测试完成时运行`teardown`逻辑：\n\
  \n```\nmodule('Equality Tests', {\n  setup: function(){\n    console.log('setting\
  \ things up');\n  },\n  teardown: function(){\n    console.log('clearing things\
  \ down');\n  }\n});\n\ntest( \"Simple Equality Tests\", function() {\n  ok( 1 ==\
  \ '1', 'Passed simple equals check');\n  ok( 1 !== '1', 'Passed really equals check')\n\
  \  notEqual(1, '2', 'Not Equal');\n});\n\ntest('More simple tests', function(){\n\
  \  expect(2);\n  equal(true, true, 'Simple true == true test');\n  strictEqual(true,\
  \ true, 'Simple true === true test');\n});\n```\n\n#### 使用 Fixtures 测试 DOM 交互\n\n\
  除了测试 JavaScript 逻辑，你可能还需要编写测试来确保任何 DOM 操作都能按预期工作。为此准备的第一步是确保在你的 QUnit 测试所在的 HTML\
  \ 页面中，有一个`id`为`qunit-fixture`的`div`元素。\n\n```\n<div id=\"qunit-fixture\"></div>\n\
  ```\n\n每当测试执行时，QUnit 会自动重置此`qunit-fixture`内的 HTML，让你无需为此担心。同时，请确保你的 HTML 页面中包含了\
  \ jQuery，因为你很可能需要使用它来搜索和操作 DOM。\n\n```\n<script src=\"../external/jquery-1.10.2.js\"\
  ></script>\n```\n\n现在，让我们通过创建一个简单的测试来看看 fixtures 如何工作，这个测试会向 fixture 中添加元素，并验证它们是否已成功附加到\
  \ DOM。\n\n首先，确保在测试套件开始时 fixture 中包含正确的内容。我们不是静态地将内容添加到 HTML 中，而是使用 begin 回调将其添加到页面。\n\
  \n```\nvar fixtureEl = null;\n\nQUnit.begin = function() {\n  fixtureEl = $('#qunit-fixture');\n\
  \  fixtureEl.append('<p id=\\'myparagraph\\'>New Paragraph</p>');\n};\n```\n\n请注意，通过使用回调，HTML\
  \ 可以在任何时间点进行设置，例如在某个模块之前或每个测试之前。我们现在提供一个包含一个测试的模块，用于检查该段落是否存在。\n\n```\n//tests for\
  \ DOM manipulation\nmodule('Fixture Test');\n\ntest('Check for paragraph', function(){\n\
  \  var results = fixtureEl.find('#myparagraph').length;\n  console.log(fixtureEl);\n\
  \  console.log(results);\n  ok(results === 1, 'Found the correct paragraph');\n\
  });\n```\n\n正如你所见，编写用于验证 DOM 完整性的 JavaScript 测试相当简单。\n\n#### 记录 QUnit 测试结果\n\n如果你在持续集成服务器上运行测试（我们将在下一章中探讨），你将需要能够记录测试结果，而无需刷新运行测试的\
  \ HTML 页面。\n\n虽然你可以基于 QUnit 回调函数自己实现解决方案，但也有现成的插件提供了以持续集成系统中最常见的格式（JUnit 风格）存储结果的能力。作为\
  \ Java 世界领先的单元测试框架，JUnit 的报告风格成为了事实上的标准。要将此报告功能集成到你自己的测试套件中，你只需在你的测试套件中再添加一个引用文件即可。\n\
  \n首先，从 [`github.com/jquery/qunit-reporter-junit`](https://github.com/jquery/qunit-reporter-junit)\
  \ 下载`qunit-reporter-junit.js`，并将其包含在存放其他 QUnit 脚本的`index.html`文件中。你应该在主 QUnit 脚本之后包含此文件。\n\
  \n```\n<script src=\"../external/jquery-1.10.2.js\"></script>\n<script src=\"qunit/qunit-1.12.0.js\"\
  ></script>\n<script src=\"../external/qunit-reporter-junit.js\"></script>\n<script\
  \ src=\"tests.js\"></script>\n```\n\n现在，剩下要做的就是在`test.js`文件中为`jUnitReports`添加一个新的处理程序。报告对象包含\
  \ JUnit 格式的测试运行结果。然后，你可以将它们写入文件或上传到服务器。\n\n```\nQUnit.jUnitReport = function(report)\
  \ {\n   console.log(report.xml);\n};\n```\n\n需要注意的重要一点是，你之前定义的`QUnit.Begin`会覆盖`qunit-report`插件中存在的同一个回调。为了避免这种情况，我调整了一些代码，将我的\
  \ fixture 定义移到了 DOM 测试模块的`setup`函数中。\n\n```\nQUnit.jUnitReport = function(report)\
  \ {\n   console.log(report.xml);\n};\n\n//tests for DOM manipulation\n'Fixture Test',\
  \ {\n  setup: function(){\n    fixtureEl = $('#qunit-fixture');\n    fixtureEl.append('<p\
  \ id=\\'myparagraph\\'>New Paragraph</p>');\n  }\n});\n\ntest('Check for paragraph',\
  \ function(){\n  var results = fixtureEl.find('#myparagraph').length;\n  console.log(fixtureEl);\n\
  \  console.log(results);\n  ok(results === 1, 'Found the correct paragraph');\n\
  });\n```\n\n在下一章探讨构建系统时，我们将发现一些报告测试结果的其他方法。\n\n\n\n##### 无浏览器运行 QUnit\n\n如果你在后台运行测试，无论是在夜间构建机器上还是在持续集成系统中，你都需要具备无需打开浏览器就能执行测试套件的能力，尤其是在没有显示器的情况下。\n\
  \n`PhantomJS` ( [`phantomjs.org`](http://phantomjs.org/) ) 被认为是此类任务的最佳解决方案。该库为你提供了一个无头\
  \ WebKit 浏览器和一个完整的 JavaScript API。除了能让你在无头模式下运行测试（即不渲染用户界面元素）之外，`PhantomJS` 甚至能够在任何特定时刻对浏览器进行截图。\n\
  \n![A978-1-4302-6335-7_8_Fig6_HTML.jpg](img/A978-1-4302-6335-7_8_Fig6_HTML.jpg)\n\
  \n图 8-6. 位于 [`phantomjs.org`](http://phantomjs.org/) 的 PhantomJS 网站\n\n`PhantomJS`\
  \ 的安装说明可在项目网站 [`phantomjs.org/download.html`](http://phantomjs.org/download.html)\
  \ 上找到，如图 8-6 所示，你将被指示下载适用于你操作系统的安装程序。但是，如果你已经在使用 Node.js，你可以使用 Node 包管理器通过以下命令安装\
  \ `PhantomJS`：\n\n```\nnpm install phantomjs\n```\n\n现在你已经安装了 `PhantomJS`，你需要从 [`github.com/jquery/qunit/tree/master/addons/phantomjs`](https://github.com/jquery/qunit/tree/master/addons/phantomjs)\
  \ 获取 QUnit 的 PhantomJS Runner 插件，即 `runner.js`。与本书中下载的其他脚本不同，`runner.js` 将从命令行执行。因此，你可以将此文件放置在\
  \ `index.html` 的同一层级。\n\n`PhantomJS` 在命令行中使用，以测试套件的 URL 作为关键参数：\n\n```\nphantomjs\
  \ runner.js [你的 qunit 测试套件 URL] [超时时间（秒）]\n```\n\n要运行测试套件，请在保存 `runner.js` 的目录下执行以下命令，暂时忽略\
  \ `timeout` 参数。\n\n```\nphantomjs runner.js http://localhost/backbone/chapter8/js/test/index.html\n\
  ```\n\n当测试正在执行时，你之前放置在 `console.log` 中的所有内容都会打印到控制台上。此外，最终一行会打印到屏幕上，显示测试套件的汇总结果。\n\
  \n```\n耗时 1034ms 运行了 8 个测试。8 个通过，0 个失败。\n```\n\n结合 `PhantomJS` 和上一节提到的自定义测试记录，你可以轻松创建自己的持续测试系统。别忘了我们将在第\
  \ 9 章深入探讨这个主题。\n\n### 一个简单的 Backbone 模型测试\n\n既然我们已经对 QUnit 的工作原理有了扎实的理解，现在让我们创建一个简单的测试来运行第\
  \ 6 章中创建的某个 Backbone 模型。\n\n因为这是独立的测试，我们将创建一个不同的 HTML 页面来承载测试套件，命名为 `app.html`。我们正在测试\
  \ Backbone 对象，所以我们需要包含此类应用程序常用的脚本（Backbone，Underscore）以及包含我们要测试对象的任何文件。\n\n```\n\
  <html>\n<head>\n <title>第 8 章：QUnit 应用程序测试</title>\n <link rel=\"stylesheet\" href=\"\
  qunit/qunit-1.12.0.css\">\n</head>\n<body>\n <div id=\"qunit\"></div>\n <div id=\"\
  qunit-fixture\"></div>\n<!-- 通用包含 -->\n<script src=\"../external/underscore.js\"\
  ></script>\n<script src=\"../external/backbone.js\"></script>\n<script src=\"../external/moment.js\"\
  ></script>\n<!-- 模型 -->\n<script src=\"../app/model/Tweet.js\"></script>\n<script\
  \ src=\"../app/model/Profile.js\"></script>\n<script src=\"../external/jquery-1.10.2.js\"\
  ></script>\n<script src=\"qunit/qunit-1.12.0.js\"></script>\n<script src=\"apptests.js\"\
  ></script>\n</body>\n</html>\n```\n\n测试套件将存放在名为 `apptests.js` 的文件中，其中只有一个测试模块，用于检查创建模型新实例时设置的变量是否正确。\n\
  \n```\n//DOM 操作测试\nmodule('模型测试: Tweet');\n\ntest('检查初始化参数', function(){\n expect(2);\n\
   //创建一个 Tweet 模型的新实例\n var user = {name: 'James'};\n var tweet = new com.apress.model.Tweet({user:\
  \ user, text: 'Hello World'});\n equal(tweet.get(\"text\"), \"Hello World\", \"\
  Tweet 文本设置正确\");\n equal(tweet.get(\"user\").name, \"James\", \"用户名称对象设置正确\");\n\
  });\n```\n\n当测试套件完成后，你应该会看到 100% 的通过率。然而，这些测试并不复杂，也没有测试系统的全部功能。理想的单元测试套件应该以此为基础，构建成一套更完整的测试。\n\
  \n\n\n#### 一个简单的 Backbone 视图测试\n\n除了测试 Backbone 模型外，你还需要编写一些测试来确保你创建的任何视图都能正常工作。这同样可以通过\
  \ QUnit 轻松实现，尽管其设置过程有些复杂。\n\n首先，你需要确保为 Handlebars 和 jQuery 包含的完整脚本集也包含在测试 HTML 页面中，并且还应该包含相应的\
  \ CSS 文件。在实践中，如果你使用 QUnit 测试视图，HTML 的结构将与实际应用程序类似，只是额外加入了 QUnit。\n\n每个包含视图的 `div`\
  \ 都应该位于 QUnit 的 fixture 元素内，如下例所示：\n\n```html\n<html>\n<head>\n<title>第 8 章：QUnit\
  \ 应用程序测试</title>\n<link rel=\"stylesheet\" href=\"qunit/qunit-1.12.0.css\">\n<link\
  \ rel='stylesheet' href='../../css/modern.css'>\n<link rel=\"stylesheet\" href=\"\
  ../../css/style.css\">\n</head>\n<body>\n<div id=\"qunit\"></div>\n<div id=\"qunit-fixture\"\
  >\n<div id=\"app\" class=\"grid\">\n<div class=\"row\">\n<div class=\"span8\">\n\
  <div id='timeline' class='timeline-view'>\n<h2>我的推文</h2>\n</div>\n</div>\n<div class=\"\
  span4\">\n<div id=\"profile\" class=\"profile-view\">\n<!-- 此处应为模板 -->\n</div>\n\
  <div id=\"search\" class=\"search-view\">\n<form>\n<div class=\"input-control text\"\
  >\n<input type=\"text\" id=\"searchbox\" autofocus=\"\" placeholder=\"我在找..\">\n\
  </div>\n<button class=\"bg-color-blue\" id=\"searchbutton\">搜索</button>\n</form>\n\
  </div>\n</div>\n</div>\n</div>\n</div>\n<!-- 个人资料模板 -->\n<script type=\"text/x-handlebars-template\"\
  \ id=\"profile-template\">\n<div class='tiles clearfix'>\n<div class=\"tile double\
  \ bg-color-orangeDark\">\n<div class=\"tile-content\">\n<img src=\"{{user.profile_image_url}}\"\
  \ class=\"place-left\">\n<h3 style=\"margin-bottom: 5px;\">{{user.name}}</h3>\n\
  <p>{{user.description}}</p>\n<div class=\"brand\">\n<div class=\"badge\">{{user.followers_count}}\
  \ 关注者</div>\n</div>\n</div>\n</div>\n</div>\n</script>\n<!-- 通用包含文件 -->\n<script\
  \ src=\"../external/jquery-1.10.2.js\"></script>\n<script src=\"../external/underscore.js\"\
  ></script>\n<script src=\"../external/backbone.js\"></script>\n<script src=\"../external/moment.js\"\
  ></script>\n<!-- 通用包含文件 -->\n<script src=\"../external/handlebars.js\"></script>\n\
  <script src=\"../external/moment.js\"></script>\n<script src=\"../external/dialog.js\"\
  ></script>\n<!-- 模型 -->\n<script src=\"../app/model/Tweet.js\"></script>\n<script\
  \ src=\"../app/model/Profile.js\"></script>\n<!-- 视图 -->\n<script src=\"../app/view/ProfileView.js\"\
  ></script>\n<script src=\"qunit/qunit-1.12.0.js\"></script>\n<script src=\"apptests.js\"\
  ></script>\n</body>\n</html>\n```\n\n由于应用程序中使用的所有视图都是由我们在第 6 章中创建的服务器提供的内容填充的，因此你需要确保服务器正在运行以进行这些测试。更重要的是，由于每个视图在渲染之前都需要等待响应，因此测试需要编写为异步测试。以下代码片段测试了个人资料视图在\
  \ `h3` 标签内是否包含了正确的名称文本：\n\n```javascript\nmodule('视图测试：个人资料');\n\nasyncTest( \"\
  异步视图测试\", function() {\n  expect( 1 );\n  var profileView = new com.apress.view.ProfileView({user:\
  \ 'sugrue'});\n  profileView.render();\n  setTimeout(function() {\n    equal(profileView.$('h3').text(),\
  \ \"James Sugrue\", \"个人资料视图渲染了正确的名称\");\n    start();\n  }, 1000);\n});\n```\n\n\
  ## Sinon.JS\n\n在运行单元测试时，在后台运行一个完整的服务器来响应 API 请求并不总是方便。虽然这确实提供了最完整的测试集，因为它使用了真实世界系统，但很难测试代码在错误条件下是如何反应的。\n\
  \nSinon.JS ( [`http://sinonjs.org/`](http://sinonjs.org/) ) 是一个与任何 JavaScript 测试框架兼容的库，它允许你创建模拟对象。当你想要模拟一段代码可能具有的依赖关系而无需创建真实对象（包括服务器请求）的开销时，就会使用模拟对象。这可以针对系统中可能发生的各种情况实现更高的测试覆盖率。\n\
  \n要将 Sinon.JS 与 QUnit 集成，你需要从 [`http://sinonjs.org`](http://sinonjs.org/) 包含基础的\
  \ Sinon 库。为了使集成更顺畅，你还可以使用来自 [`http://sinonjs.org/qunit/`](http://sinonjs.org/qunit/)\
  \ 的 Sinon-QUnit 插件。以下代码片段显示了你的测试 HTML 中需要添加的内容：\n\n```html\n<script src=\"sinon.js\"\
  ></script>\n<script src=\"sinon-qunit-1.0.0.js\"></script>\n```\n\nSinon 有许多有用的补充功能，可以使测试更容易，例如测试间谍（test\
  \ spies）、存根（stubs）、模拟对象（mocks）和伪造服务器（fake servers）。我们将逐一介绍这些功能，并了解它们如何帮助我们提高 Backbone\
  \ 测试的质量。\n\n**注意**  \n在撰写本文时，包含 Sinon-QUnit 插件会破坏所有异步测试，因为该插件包含了伪造的计时器。要解决这个问题，可以在任何异步测试的开头添加一个声明来恢复时钟，即\
  \ `this.clock.restore();`。\n\n### 测试间谍\n\n测试间谍用于测试代码中的回调和函数。你可以使用间谍来跟踪某个特定函数被执行了多少次。\n\
  \n以下人为示例跟踪了个人资料视图的 render 调用是否实际运行过。然而，使用间谍的理想场景是检查调用栈中“更深层”的函数是否已被执行，例如 render\
  \ 函数可能需要的实用方法。\n\n通过 `spy` 函数创建间谍，该函数接受两个参数：被测试的对象和被跟踪的函数。\n\n```javascript\nmodule('视图测试：个人资料');\n\
  \nasyncTest( \"异步视图测试\", function() {\n  this.clock.restore();\n  expect( 2 );\n\
  \  var profileView = new com.apress.view.ProfileView({user: 'sugrue'});\n  this.spy(profileView,\
  \ 'render');\n  profileView.render();\n  ok(profileView.render.calledOnce, '个人资料视图渲染函数执行了一次');\n\
  \  setTimeout(function() {\n      equal(profileView.$('h3').text(), \"James Sugrue\"\
  ,                  \"个人资料视图渲染了正确的名称\");\n      start();\n  }, 1000);\n});\n```\n\
  \n除了提供简单的 `calledOnce` 断言（返回布尔值）之外，Spy 接口还提供了许多其他函数。这些函数包括通过 `calledWith` 断言来检查调用的参数。在我们的例子中，其用处有限，因为\
  \ `render` 函数不接受任何参数。\n\n```javascript\nok(profileView.render.calledWith(), '个人资料视图渲染调用没有参数');\n\
  ```\n\n通常，期望与函数一起使用的参数会包含在 `calledWith` 函数的参数列表中。其他检查函数包括检查函数调用顺序的功能（使用 `calledBefore`/`calledAfter`）和\
  \ `callCount`，它返回特定函数被调用的次数。\n\n除了使用 Chrome 开发者工具进行标准调试技术外，这些检查技术可以作为另一种有用的方式，确保对象在你的应用程序中被正确使用。通常，当特定函数被执行时触发了事件处理程序，你会使用间谍。\n\
  \n\n### 测试桩与模拟对象\n\n测试桩用于替换函数的行为，或轻松模拟错误情况。事实上，如果你严格遵循测试驱动开发方法，应该从构建测试桩开始。\n\n以下简单示例展示了如何通过\
  \ `Sinon` 为 `Tweet` 模型对象创建一个新的 `save` 函数桩。首先，在模块设置中创建测试桩，随后在测试中为 `Tweet` 对象提供 `save`\
  \ 函数。\n\n```\nmodule('Sinon 测试桩', {\n\n setup:function() {\n\n    this.tweetModel\
  \ = new com.apress.model.Tweet({user: {name: 'James'}, text: 'Hello World'});\n\n\
  \     sinon.stub(this.tweetModel, 'save',\n\n     function(cb){ //此处存根\n\n     });\n\
  \n }\n\n});\n\ntest('使用存根后的 save 函数', function(){\n\n expect(0);\n\n console.log(this.tweetModel.save());\n\
  \n});\n```\n\n不过，你可能会发现 `Sinon` 中的模拟功能对你的应用更加实用。模拟对象与测试桩的区别在于：创建模拟对象时，你需要对该对象中的一个或多个函数设定预期行为。测试必须满足所有这些预期才能通过。\n\
  \n下面的测试简单模拟了正在使用的集合。由于我们在集合中创建的所有函数都会在初始化时被调用，因此首先在 `Timeline.js` 中添加一个额外函数。尽管这个函数没有实际作用，但足以用来提供模拟示例。\n\
  \n```\ncom.apress.collection.Timeline = Backbone.Collection.extend({\n\n   //之前的\
  \ Timeline 集合代码\n\n   organizeCollection: function(){\n\n      console.log('organizing');\n\
  \n   }\n\n});\n```\n\n创建模拟对象非常简单，只需使用 `Sinon` 内置的 `mock` 函数，将你要模拟的对象作为参数传入。然后，你可以为模拟对象中的函数设定一组预期。在本例中，我们预期\
  \ `organiseCollection` 函数在此测试套件中至少被执行一次。\n\n```\nmodule('Sinon 模拟对象', {\n\n});\n\
  \ntest('使用模拟集合', function(){\n\n expect(1);\n\n var collection = new com.apress.collection.Timeline();\n\
  \n //模拟该集合\n\n var mock = sinon.mock(collection);\n\n mock.expects('organizeCollection').atLeast(1);\n\
  \n collection.organizeCollection();\n\n mock.verify();\n\n});\n```\n\n在这个示例中，由于我们在测试中直接调用了\
  \ `organiseCollection` 函数，测试将通过。通常，这些模拟对象会通过测试脚本中的其他对象来调用，而不是直接调用。\n\n### 使用假服务器\n\
  \n`Sinon` 最实用的功能之一，是能够使用假服务器来响应 XHR（`XMLHttpRequest`）实例。这在需要检查代码是否能处理来自服务器的错误请求（例如\
  \ 404 响应），以及确保正常路径能被验证时非常有用。\n\n首先，你需要使用 `this.sandbox.useFakeServer()` 创建一个假服务器。一旦调用此方法，所有请求都会被\
  \ `Sinon` 拦截。然后，你需要预置服务器以返回特定内容。向服务器发出请求后，你还需要在测试完成前强制触发一次响应。\n\n以下代码片段演示了这一切，其中模拟了对时间线内容的请求：\n\
  \n```\nmodule('假服务器');\n\ntest('使用假服务器', function(){\n\n    expect(2);\n\n    //设置假服务器\n\
  \n    var server = this.sandbox.useFakeServer();\n\n    var timeline = new com.apress.collection.Timeline();\n\
  \n    //准备响应文本\n\n    var timelineResponse = '[{\"created_at\": \"Tue Sep 24 06:23:09\
  \ +0000 2013\", \"text\" :\n\n    \"模拟推文\"},{\"created_at\": \"Tue Sep 24 04:23:09\
  \ +0000 2013\", \"text\" :\n\n    \"另一条模拟推文\"}]';\n\n    //预置服务器，使其在特定 URL 上返回特定文本\n\
  \n    server.respondWith(\"GET\", \"/test\", [200, {\"Content-Type\":\n\n    \"\
  application/json\"},timelineResponse]);\n\n    //更改集合的 URL\n\n    timeline.url =\
  \ '/test';\n\n    //获取集合内容\n\n    timeline.fetch({reset: true});\n\n    //强制服务器响应\n\
  \n    server.respond();\n\n    console.log('时间线包含 ' + timeline.length);\n\n    ok(timeline.length\
  \ === 2, '集合大小正确');\n\n    ok(timeline.at(0).get('text') === '模拟推文', '推文中文本正确');\n\
  \n});\n```\n\n注意，集合的 URL 已从默认值（`http://localhost:8080/timeline`）更改为 `/test`，以匹配在假服务器上设置的值。严格来说，只有当你在一次测试运行中需要处理两个不同的请求时，才需要这样做。不过，这确实让测试更明确且更易读。\n\
  \n如果你只选择 `Sinon` 的一个功能用于 `Backbone` 应用的单元测试，那么假服务器功能很可能是你的首选。\n\n## 使用 Jasmine 进行测试\n\
  \n虽然 `QUnit` 提供了更传统的单元测试风格（在软件行业中通常称为 xUnit），但 Pivotal Labs 的 Jasmine 库（`http://pivotal.github.io/jasmine/`）遵循的是行为驱动开发（BDD）方法。\n\
  \nBDD 建立在测试驱动开发的技术之上，并让更广泛的群体能够编写和理解测试。这意味着业务分析师、需求工程师和 QA 人员也可以参与测试工作，而不仅仅是那些精通\
  \ JavaScript 的开发人员。\n\n在本节中，我们将简要介绍 Jasmine 的语法，以及如何使用它来测试你的 `Backbone` 应用。\n\n\
  ![A978-1-4302-6335-7_8_Fig7_HTML.jpg](img/A978-1-4302-6335-7_8_Fig7_HTML.jpg)\n\n\
  图 8-7.\n\nJasmine 网站 [`http://pivotal.github.io/jasmine/`](http://pivotal.github.io/jasmine/)\n\
  \n\n\n### Jasmine 入门指南\n\n与 QUnit 类似，在项目中引入 Jasmine 非常简单。你需要从 [`https://github.com/pivotal/jasmine/downloads`](https://github.com/pivotal/jasmine/downloads)\
  \ 下载 Jasmine，如图 8-7 所示。下载的文件是一个 ZIP 压缩包，包含了你入门所需的所有文件。你应该将其复制到 `test` 目录下，也就是上一节我们放置\
  \ QUnit 测试文件的地方。该分发包已经包含了主运行文件 `SpecRunner.html`。为了确认一切就绪，请导航到 `http://localhost/backbone/chapter8/js/test/jasmine/SpecRunner.html`\
  \ 查看示例测试运行器的结果。一旦你的目录结构如图 8-8 所示，该 URL 应该就能正常工作了。\n\n![A978-1-4302-6335-7_8_Fig8_HTML.jpg](img/A978-1-4302-6335-7_8_Fig8_HTML.jpg)\n\
  \n图 8-8. 引入 Jasmine 后的 HTML 应用结构\n\n你的 Jasmine 测试将由测试套件（suites）和测试用例（specs）组成。一个测试套件是对一组测试的归类，这些测试应专注于特定场景。测试套件使用\
  \ `describe` 函数定义，该函数接受一个测试名称和一个包含测试用例的函数。一个专注于用户资料的测试套件可以定义如下：\n\n```\ndescribe('Profile',\
  \ function() {\n\n});\n```\n\n一个测试用例使用 `it` 函数定义，该函数接受一个用例名称和一个包含构成测试的断言（assertions）的函数。传入的用例名称应易于阅读，并能标识该用例中测试的目的。例如，如果测试是为了检查每个用户资料是否都有用户名，你可以这样定义：\n\
  \n```\ndescribe('Profile', function() {\n   it('should have a user name', function(){\n\
  \   });\n});\n```\n\n如果你将上面的代码片段保存到 `AppSpec.js` 文件中，并将该用例包含在 Jasmine 分发包中的 `SpecRunner.html`\
  \ 文件里，那么你就拥有了第一个真正的 Jasmine 测试用例。该 HTML 文件中已经有一处注释，指明了你应该在哪里放置你的引入声明。\n\n```\n<!--\
  \ include spec files here... -->\n <script type=\"text/javascript\" src=\"spec/ProfileSpec.js\"\
  ></script>\n```\n\n尽管我们的测试用例还没有包含任何断言，但是运行该 HTML 文件应该会显示用户资料测试用例已经运行，如图 8-9 所示。\n\
  \n![A978-1-4302-6335-7_8_Fig9_HTML.jpg](img/A978-1-4302-6335-7_8_Fig9_HTML.jpg)\n\
  \n图 8-9. 简单 Jasmine 测试运行的输出\n\n### 期望（Expectations）\n\n为了构建一个完整的测试，每个测试用例都应包含多个期望（expectations），类似于\
  \ QUnit 中的断言。期望通过 `expect` 函数构建，该函数接收实际结果，后跟一个接收期望值的匹配器（matcher）。以下测试确保了用户资料对象正确设置了\
  \ `id` 属性：\n\n```\ndescribe('Profile', function() {\n   it('should have an id',\
  \ function(){\n      var profile = new com.apress.model.Profile({id: 'sugrue'});\n\
  \      expect(profile.get('id')).toBe('sugrue');\n      expect(profile.get('id')).not.toBe('james')\n\
  \   });\n});\n```\n\n请注意，任何匹配器都可以在前面加上 `not` 来进行否定检查，如第二个检查所示。\n\n现在，由于我们引入了自己的对象以及\
  \ Backbone 的依赖，测试运行器将需要一个更完整的引入列表。\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
  \ 4.01 Transitional//EN\"\n \"http://www.w3.org/TR/html4/loose.dtd\">\n<html>\n\
  <head>\n <title>Jasmine Spec Runner</title>\n <link rel=\"shortcut icon\" type=\"\
  image/png\" href=\"lib/jasmine-1.3.1/jasmine_favicon.png\">\n <link rel=\"stylesheet\"\
  \ type=\"text/css\" href=\"lib/jasmine-1.3.1/jasmine.css\">\n <script type=\"text/javascript\"\
  \ src=\"lib/jasmine-1.3.1/jasmine.js\"></script>\n <script type=\"text/javascript\"\
  \ src=\"lib/jasmine-1.3.1/jasmine-html.js\"></script>\n <!-- include source files\
  \ here... -->\n <!-- General Includes -->\n<script src=\"../../external/jquery-1.10.2.js\"\
  ></script>\n<script src=\"../../external/underscore.js\"></script>\n<script src=\"\
  ../../external/backbone.js\"></script>\n<script src=\"../../external/moment.js\"\
  ></script>\n<!-- General Includes -->\n<script src=\"../../external/handlebars.js\"\
  ></script>\n<script src=\"../../external/moment.js\"></script>\n<script src=\"../../external/dialog.js\"\
  ></script>\n <script src=\"../../app/model/Profile.js\"></script>\n <!-- include\
  \ spec files here... -->\n <script type=\"text/javascript\" src=\"spec/ProfileSpec.js\"\
  ></script>\n <script type=\"text/javascript\">\n   (function() {\n     var jasmineEnv\
  \ = jasmine.getEnv();\n     jasmineEnv.updateInterval = 1000;\n     var htmlReporter\
  \ = new jasmine.HtmlReporter();\n     jasmineEnv.addReporter(htmlReporter);\n  \
  \   jasmineEnv.specFilter = function(spec) {\n       return htmlReporter.specFilter(spec);\n\
  \     };\n     var currentWindowOnload = window.onload;\n     window.onload = function()\
  \ {\n       if (currentWindowOnload) {\n         currentWindowOnload();\n      \
  \ }\n       execJasmine();\n     };\n     function execJasmine() {\n       jasmineEnv.execute();\n\
  \     }\n   })();\n </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n如你所想，Jasmine\
  \ 提供了许多内置匹配器，并且还支持创建自定义匹配器。表 8-3 列出了内置的匹配器集合。\n\n表 8-3. Jasmine 可用的匹配器\n\n| 匹配器\
  \ | 用途 |\n| --- | --- |\n| `toBe(value)` | 使用 `===` 函数进行比较（严格相等） |\n| `toEqual(value)`\
  \ | 对简单字面量和变量进行相等性检查 |\n| `toMatch(regularExpression)` | 正则表达式匹配器 |\n| `toBeDefined()`\
  \ | 检查变量是否不为 `undefined` |\n| `toBeUndefined()` | 检查变量是否为 `undefined` |\n| `toBeNull()`\
  \ | 检查变量是否为 null |\n| `toBeTruthy()` | 检查布尔值是否计算为 true |\n| `toBeFalsy()` | 检查布尔值是否计算为\
  \ false |\n| `toContain(value)` | 在数组中查找某个元素 |\n| `toBeLessThan(value)` | 检查结果是否小于\
  \ value 参数 |\n| `toBeGreaterThan(value)` | 检查结果是否大于 value 参数 |\n| `toBeCloseTo(e,\
  \ value)` | 浮点数的精确数学比较 |\n| `toThrow()` | 检查函数是否抛出异常 |\n\n#### 设置与清理\n\n除了包含一个或多个测试用例外，一个测试套件还可以包含一个\
  \ `beforeEach` 函数（在每个测试用例执行前运行），以及一个 `afterEach` 函数（在测试用例完成后执行清理工作）。请注意，在这些函数中设置的对象可以通过\
  \ `this` 引用前缀来访问。\n\n```\ndescribe(\"Profile\", function() {\n   beforeEach(function(){\n\
  \        console.log('Any code required for setup');\n        this.profile = new\
  \ com.apress.model.Profile({id: 'sugrue'});\n   });\n   it('should have an id',\
  \ function(){\n      expect(this.profile.get('id')).toBe('sugrue');\n      expect(this.profile.get('id')).not.toBe('james');\n\
  \   });\n   afterEach(function(){\n      console.log('Cleanup code...');\n   });\n\
  });\n```\n\n\n\n### 测试视图\n\nJasmine 有一个实用的插件，允许你使用 jQuery 语法执行匹配器。可以从 [`https://github.com/velesin/jasmine-jquery`](https://github.com/velesin/jasmine-jquery)\
  \ 下载 Jasmine-jQuery 插件。要使用该插件，请从 `lib` 目录下载 `jasmine-jquery.js` 文件，并将其包含在测试运行器中，紧跟在其他\
  \ Jasmine 相关引用之后。不过，请确保首先包含 jQuery，因为该插件依赖于它。\n\n```\n<script src=\"../../external/jquery-1.10.2.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"lib/jasmine-1.3.1/jasmine.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"lib/jasmine-1.3.1/jasmine-html.js\"\
  ></script>\n<script type=\"text/javascript\" src=\"lib/jasmine-jquery.js\"></script>\n\
  ```\n\n你无需将测试固件 HTML 直接包含在 `specRunner.html` 页面中，实际上可以使用 `loadFixture` 函数单独引入所需的\
  \ HTML，该函数接受 HTML 文件的路径作为参数。即使没有传递路径，HTML 文件也应位于 `spec/javascripts/fixtures` 目录下。如果你的测试固件\
  \ HTML 托管在服务器上，也可以使用 URL。\n\nHTML 文件的内容将只是实际应用中使用的内部 HTML，不包含模板。任何 Handlebars 模板都应包含在\
  \ `specRunner.html` 文件中，并在加载依赖它们的视图之前引入。\n\n以下测试确保 `ProfileView` 能够在页面上渲染：\n\n```\n\
  it('should have a view', function(){\n    loadFixtures('./app-fixture.html');\n\
  \    var profileView = new com.apress.view.ProfileView({user: 'sugrue'});\n    expect(profileView.render().$el).toExist();\n\
  });\n```\n\n表 8-4 列出了该插件提供的匹配器。\n\n**表 8-4.** Jasmine-jQuery 匹配器\n\n| 匹配器 | 用途 |\n\
  | --- | --- |\n| `toBe( jQuerySelector )` | 检查页面上的元素是否正确渲染 |\n| `toBeChecked()`\
  \ | 用于具有 `checked` 属性的标签，例如复选框 |\n| `toBeEmpty()` | 检查是否没有 DOM 元素或文本 |\n| `toBeHidden()`\
  \ | 检查元素是否隐藏 |\n| `toHaveCss( css )` | 检查应用到元素的 CSS 样式 |\n| `toBeSelected()` | 用于具有\
  \ `selected` 属性的标签，例如 `option` |\n| `toBeVisible()` | 检查元素是否可见（即在文档中占据空间） |\n| `toContain(\
  \ jQuerySelector )` | 检查元素内部是否包含其他元素 |\n| `toBeMatchedBy( jQuerySelector )` | 检查是否可以通过给定的选择器找到该元素\
  \ |\n| `toExist()` | 检查元素是否存在 |\n| `toHaveAttr( name, value )` | 检查元素是否具有特定名称和值的属性\
  \ |\n| `toHaveProp( name, value )` | 检查元素是否具有给定值的属性 |\n| `toHaveBeenTriggeredOn(\
  \ selector )` | 检查事件是否已在给定选择器的元素上触发 |\n| `toHaveBeenTriggered()` | 检查事件是否在元素上触发\
  \ |\n| `toHaveBeenTriggeredOnAndWith( selector, params )` | 检查事件是否在与选择器匹配的元素上触发，并带有参数哈希中的参数\
  \ |\n| `toHaveClass( className )` | 检查元素是否使用了给定的 CSS 类 |\n| `toHaveData( key, value\
  \ )` | 检查元素是否包含数据属性 |\n| `toHaveHtml( string )` | 检查元素是否具有特定的 HTML |\n| `toContainHTML(\
  \ string )` | 检查元素是否包含某些 HTML 字符串 |\n| `toContainText( string )` | 检查元素是否包含提供的字符串数据\
  \ |\n| `toHaveId( id )` | 检查元素是否具有特定的 ID |\n| `toHaveText( string )` | 检查元素是否包含给定的字符串，也可以是正则表达式\
  \ |\n| `toHaveValue( value )` | 用于具有 value 属性的标签，例如 `input` |\n| `toHaveLength(\
  \ value )` | 检查返回的元素数量，例如输入框或列表项的数量 |\n| `toBeDisabled()` | 检查表单元素是否被禁用 |\n| `toBeFocused()`\
  \ | 检查元素是否获得焦点 |\n| `toHandle( event )` | 检查元素是否具有特定事件类型的处理程序 |\n| `toHandleWith(\
  \ event, handler )` | 检查元素是否使用特定的处理程序处理事件 |\n\n如你所见，这个插件提供了大量的匹配器，使测试视图更加直接。如果你的应用程序视图密集，Jasmine\
  \ 以及这个插件可能是更好的选择。\n\n### 模拟服务器\n\n与 QUnit 一样，通过在测试中包含 Sinon.js 来创建模拟服务器。你只需在 SpecRunner\
  \ 中包含 `sinon.js` 文件，然后就可以开始使用了。\n\n以下代码片段展示了一个独立的测试套件，专注于测试 Timeline 集合，并将使用 Sinon\
  \ 的模拟服务器来实现这一点。如果你已经阅读过关于 Sinon.js 的部分，应该对此很熟悉。\n\n```\ndescribe(\"Timeline\", function(){\n\
  \    beforeEach(function(){\n        this.server = sinon.fakeServer.create();\n\
  \    });\n    afterEach(function(){\n        this.server.restore();\n    });\n \
  \   it ('Should return some tweets', function(){\n        var timeline = new com.apress.collection.Timeline();\n\
  \        //准备响应文本\n        var timelineResponse = '[{\"created_at\": \"Tue Sep 24\
  \ 06:23:09 +0000 2013\",\n        \"text\" : \"a simulated tweet\"},{\"created_at\"\
  : \"Tue Sep 24 04:23:09 +0000 2013\",\n        \"text\" : \"another simulated tweet\"\
  }]';\n        //预置服务器以在特定 URL 上响应特定文本\n        this.server.respondWith(\"GET\",\
  \ \"/test\", [200, {\"Content-Type\":\n        \"application/json\"},timelineResponse]);\n\
  \        //更改集合的 url\n        timeline.url = '/test';\n        //获取集合内容\n      \
  \  timeline.fetch({reset: true});\n        //强制服务器响应\n        this.server.respond();\n\
  \        console.log('Timeline has ' + timeline.length);\n        expect(timeline.length).toBe(2);\n\
  \    });\n});\n```\n\n该套件利用 `beforeEach` 和 `afterEach` 函数来设置服务器并在每个测试完成后清理。\n\n\
  ### 从命令行运行\n\n为了完成 Jasmine 的概述，让我们看看如何使用 PhantomJS 从控制台运行测试，就像我们对 QUnit 所做的那样。假设你已经按照\
  \ QUnit 部分的详细步骤安装了 PhantomJS，你只需要获取 Jasmine 运行器脚本，该脚本位于 PhantomJS 的 GitHub 仓库的 `examples`\
  \ 目录中，地址为 [`https://raw.github.com/ariya/phantomjs/master/examples/run-jasmine.js`](https://raw.github.com/ariya/phantomjs/master/examples/run-jasmine.js)。\n\
  \n要运行测试，只需在存储 `run-jasmine.js` 脚本的目录下，从命令行执行以下命令：\n\n```\nphantomjs run-jasmine.js\
  \ http://localhost/backbone/chapter8/js/test/jasmine/SpecRunner.html\n```\n\n\n\n"
- '# 总结


  本章我们探讨了所有软件开发项目中最重要的规范之一：单元测试。`QUnit` 是所有单元测试库中最易上手的，它拥有大量插件，能够减轻处理测试结果的痛苦。我们还了解了`PhantomJS`如何减少在测试过程中使用标准浏览器的需求，使得测试能够在后台无缝运行。


  结合`Sinon.JS`，我们看到了`QUnit`测试如何包含模拟对象和间谍（spies）。更重要的是，我们讨论了如何利用`Sinon`提供的虚假服务器功能来模拟
  API 调用。


  我们简要了解了`Jasmine`，这是一个行为驱动的测试框架，它使描述测试用例的语法更易理解。我们还将`Sinon`的虚假服务器集成到了`Jasmine`测试中，并使用`PhantomJS`从命令行运行测试。


  `QUnit`和`Jasmine`都非常强大，选择哪个库取决于你偏好的语法。更传统的开发者可能会选择`QUnit`方式，而好奇的开发者可能想尝试`Jasmine`的
  BDD 方法。


  '
- "# 9. 使用 Grunt 进行构建流程\n\n## 摘要\n\n任何语言成功的关键因素之一，是其可用的自动化重复任务的工具数量。C 语言有`makefiles`，Java\
  \ 有`Ant`和`Maven`，Ruby 有`rakefiles`。JavaScript 迎来合适的工具只是时间问题，而这个工具似乎就是`Grunt`。在本章中，我们将向你介绍`Grunt`，并解释如何使用它来提高质量、生成生产就绪的代码等等。承接上一章，你还将看到如何利用`Grunt`自动化执行单元测试。\n\
  \n## Grunt 简介\n\n持续集成的目的是通过确保代码变更时执行测试，来提高软件质量并缩短交付生产就绪应用程序的时间。当然，持续过程中还会涉及许多其他任务，但运行单元测试被认为是最重要的。\n\
  \n由 Ben Alman 于 2012 年创建的`Grunt`（[`http://gruntjs.com`](http://gruntjs.com/) ，见图\
  \ 9-1），已成为 JavaScript Web 应用程序的默认持续集成工具。`Grunt`脚本是用 JavaScript 编写的，无需编写自定义构建脚本从\
  \ shell 执行，也无需采用其他语言的构建工具。它是一个基于任务的系统，只需从命令行执行。它唯一的依赖是`Node.js`。\n\n现在已有庞大的插件生态系统，你可以从`Grunt`中运行几乎任何所需的任务。如果你发现它缺少某些功能，甚至可以编写自己的自定义任务。\n\
  \n![A978-1-4302-6335-7_9_Fig1_HTML.jpg](img/A978-1-4302-6335-7_9_Fig1_HTML.jpg)\n\
  \n图 9-1. Grunt 网站，位于 [`http://gruntjs.com`](http://gruntjs.com/)\n\n### 选择 Grunt\
  \ 的一些理由\n\n使用`Grunt`有很多充分的理由，除了你可以用 JavaScript 定义构建脚本之外。\n\n`Grunt`遵循配置优于脚本的理念，意味着你可以用声明式的方式创建任务，而无需使用任何底层\
  \ JavaScript。不过，如果你更喜欢，编写自己的任务也允许你采用脚本方法。这是每个开发者都乐于拥有的自由度。\n\n其插件生态系统非常庞大，正如你将在本章后面看到的，Web\
  \ 项目中你想做的任何事情几乎都有对应的插件。`Node.js`生态系统中有这么多可用的包来帮助处理与 Web 相关的任务，`Grunt`使得封装这些包并将功能作为`Grunt`任务使用变得非常容易。\n\
  \n即使不下载额外的插件，内置任务也足以满足 JavaScript 项目的基本持续集成需求。\n\n通过本章，你将看到`Grunt`如何革新你编写和交付 Web\
  \ 应用程序的方式。\n\n### 安装 Grunt\n\n如果你想使用`Grunt`，首先需要安装`Node.js`。如果你一直跟随着本书的示例操作，应该已经安装了`Node.js`。如果没有，请前往[`http://nodejs.org`](http://nodejs.org/)并按照你操作系统的安装步骤进行安装。\n\
  \n`Grunt`命令行界面（CLI）通过 Node 包管理器（npm）安装，在命令行上执行以下命令，使用`-g`标志确保全局安装。请注意，你需要以管理员权限执行此操作；在\
  \ Mac OS X 上，这意味着在命令前加上`sudo`。\n\n`npm install -g grunt-cli`\n\n要检查是否安装成功，请在命令行运行`grunt\
  \ --help`。\n\n### 将 Grunt 添加到现有项目中\n\n在终端中运行`grunt`命令时，会收到一条错误消息，提示找不到`Gruntfile`。这个文件`Gruntfile.js`是项目的主构建脚本。它用\
  \ JavaScript（或 CoffeeScript）编写，包含构建所需的任务。\n\n让我们看一个为 Twitter 应用程序使用`Grunt`的示例。由于我们已经从上一章的源代码中获得了可用的单元测试，只需复制该目录即可。\n\
  \n接下来，在该目录的根目录下创建一个名为`Gruntfile.js`的文件，与应用程序的`index.html`文件放在一起。该文件的结构应如下所示：\n\n\
  ```\nmodule.exports = function(grunt) {\n\n    //所有 grunt 任务写在这里..\n\n};\n```\n\n\
  这被称为包装函数，你创建的每个`Gruntfile`都需要使用这种格式。我们将在本章中逐步向其中添加一些任务。\n\n#### 指定依赖项\n\n每个项目都应该有一个`package.json`文件，其中列出了脚本的依赖项。至少应包含项目名称、版本以及对`Grunt`包的依赖。在撰写本文时，`Grunt`的当前版本是\
  \ 0.4.1，因此在下面的`package.json`代码中使用该版本：\n\n```\n{\n  \"name\": \"Beginning_Backbone\"\
  ,\n  \"version\": \"0.1.0\",\n  \"devDependencies\": {\n    \"grunt\": \"∼0.4.1\"\
  \n  }\n}\n```\n\n如果你在与`package.json`相同的目录下从命令行运行以下命令，`Node.js`会负责安装项目的所有依赖项：\n\n\
  `npm install`\n\n该脚本读取`package.json`的内容，并在本地安装`devDependencies`中列出的所有包。随着新任务添加到`Gruntfile`中，你应该在该文件的`devDependencies`部分添加相应的条目。\n\
  \n请注意，你也可以在`install`命令中使用`--saveDev`标志，将插件下载到本地，同时将其名称和版本与`package.json`中的其他依赖项一起保存。以下命令将最新版`Grunt`的相应条目添加到`.json`文件中：\n\
  \n`npm install grunt --save-dev`\n\n这是一种有用的方法，可以用一个简单的命令在本地安装插件的同时，为团队中的其他开发者更新依赖配置。如果使用版本控制系统，你通常希望排除`node_modules`文件夹，让检出你代码的其他开发者在本地重新安装模块。\n\
  \n\n\n#### 项目配置\n\n除了提供依赖项的详细信息外，任何其他与项目相关的属性都可以存储在 `package.json` 中。通常，这个文件在 Grunt\
  \ 脚本初始化期间会作为 JSON 对象被读取。\n\n所有这些初始配置都在 `grunt.initConfig` 函数中完成，该函数也用于任务配置，我们稍后会看到。存储在此文件中的属性，特别是版本号，可能对你的构建脚本也很有用。Grunt\
  \ 提供了一个文件 API，允许你轻松地将 JSON 读取到脚本中。\n\n```\nmodule.exports = function(grunt) {\n\n\
  grunt.initConfig({\n\n    pkg: grunt.file.readJSON('package.json'),\n\n });\n\n\
  };\n```\n\n此时，Gruntfile 仍然无法正确执行。如果你现在在命令行运行 `grunt`，你将会被告知缺少一个默认任务。\n\n```\nWarning:\
  \ Task \"default\" not found. Use --force to continue.\n```\n\n## 添加任务\n\n现在来看看如何为我们的构建脚本添加一个默认任务来执行。我们将使用与\
  \ [`http://gruntjs.org`](http://gruntjs.org/) 相同的示例，该示例使用了 JavaScript uglify 插件。uglify\
  \ 插件提供了将你所有的 JavaScript 源代码压缩到一个文件中的能力。你从第三方下载的任何脚本通常都会有这样一个版本，其名称末尾带有 `.min.js`，作为生产版本。\n\
  \n`uglify` 任务可以从 GitHub 上获取，地址是 [`https://github.com/gruntjs/grunt-contrib-uglify`](https://github.com/gruntjs/grunt-contrib-uglify)\
  \ 。它提供了入门所需的说明，但让我们一步一步地来操作。\n\n首先，你需要使用 Node 包管理器，并带上 `--save-dev` 标志来安装 `uglify`\
  \ 任务。\n\n```\nnpm install grunt-contrib-uglify --save-dev\n```\n\n这将导致 `package.json`\
  \ 更新如下，在依赖项中添加了 `uglify`：\n\n```\n{\n\"name\": \"Beginning_Backbone\",\n\"version\"\
  : \"0.1.0\",\n\"devDependencies\": {\n\"grunt\": \"∼0.4.1\",\n\"grunt-contrib-uglify\"\
  : \"∼0.2.4\"\n}\n}\n```\n\n现在任务已可用，需要在 Gruntfile 中加载它。任何包含在 node 模块中的任务都可以使用 `grunt.loadNpmTasks`\
  \ 函数来加载，如下代码片段所示：\n\n```\n// Load the plugin that provides the \"uglify\" task.\n\
  grunt.loadNpmTasks('grunt-contrib-uglify');\n```\n\n下一步是设置 `uglify` 任务的配置。这和任何任务的配置一样，都在\
  \ `initConfig` 块中进行。`uglify` 任务有许多不同的配置选项，但我们只使用最简单的。\n\n首先，需要将 uglify 插件的配置对象包含在\
  \ `initConfig` 中，并带有一个 `options` 属性，该属性定义了在压缩文件中使用的横幅（注释）。所有任务都允许包含一个 `options`\
  \ 属性，以覆盖任何内置的默认值。\n\n请注意 `<%= %>` 标签如何允许在任务中包含配置属性。在本例中，`pkg.name` 是从 `package.json`\
  \ 中读取的。同时，Grunt 提供了其他配置变量，例如 `grunt.template.today`，用于打印格式化日期。\n\n`build` 对象包含使用\
  \ `src` 属性定义的源文件的详细信息，在本例中，是存储在 `js/app` 内的所有 JavaScript 文件。它还包含一个 `dest` 属性，用于定义输出文件的位置。\n\
  \n```\ngrunt.initConfig({\npkg: grunt.file.readJSON('package.json'),\nuglify: {\n\
  options: {\nbanner: '/*! <%= pkg.name %> <%= grunt.template.today(\"yyyy-mm-dd\"\
  ) %> */\\n'\n},\nbuild: {\nsrc: 'js/app/**/*.js',\ndest: 'build/<%= pkg.name %>.min.js'\n\
  }\n}\n});\n```\n\n你遇到的每个任务都会有不同的配置对象。如果你定义了一个不必要的属性，它会被脚本忽略。如果你发现简单的属性不够用，你甚至可以向配置中添加完整的\
  \ JavaScript 代码。\n\n任何 Gruntfile 的最低要求是必须存在一个默认任务。这可以使用 `grunt.registerTask` 函数来添加，该函数接受任务名称和一个子任务数组，这些子任务将作为该任务的一部分执行。在本例中，只需要包含一个任务：`uglify`。\n\
  \n```\ngrunt.registerTask('default', ['uglify']);\n```\n\nGruntfile 的完整清单现在如下所示：\n\
  \n```\nmodule.exports = function(grunt) {\ngrunt.initConfig({\npkg: grunt.file.readJSON('package.json'),\n\
  uglify: {\noptions: {\nbanner: '/*! <%= pkg.name %> <%= grunt.template.today(\"\
  yyyy-mm-dd\") %> */\\n'\n},\nbuild: {\nsrc: 'js/app/**/*.js',\ndest: 'build/<%=\
  \ pkg.name %>.min.js'\n}\n}\n});\n\n// Load the plugin that provides the \"uglify\"\
  \ task.\ngrunt.loadNpmTasks('grunt-contrib-uglify');\n\n// Default task(s).\ngrunt.registerTask('default',\
  \ ['uglify']);\n};\n```\n\n现在在命令行执行 `grunt` 将会执行 `uglify` 任务，在 `build` 目录中生成一个名为\
  \ `Beginning_Backbone.min.js` 的文件。在本章中，我们将继续扩展这个 Gruntfile，以创建一个用于持续集成的完整构建脚本。\n\
  \n### 任务配置\n\n我们已经介绍了任务配置的基础知识，包括 `options` 对象的定义。你可能会发现需要在每个任务中有不同的目标。这可以通过在配置对象中将额外的子任务定义为属性来实现。为了说明这一点，让我们向\
  \ `uglify` 目标添加一个子任务。\n\n例如，假设我们只想压缩一个单独的 JavaScript 文件 `app.js`。我们可以在 `uglify`\
  \ 任务中为此定义一个属性。\n\n```\ngrunt.initConfig({\n   pkg: grunt.file.readJSON('package.json'),\n\
     uglify: {\n     options: {\n       banner: '/*! <%= pkg.name %> <%= grunt.template.today(\"\
  yyyy-mm-dd\") %> */\\n'\n     },\n     build: {\n       src: 'js/app/**/*.js',\n\
         dest: 'build/<%= pkg.name %>.min.js'\n     },\n     singleFile: {\n       src:\
  \ 'js/app/app.js',\n       dest: 'build/appmin.js'\n     }\n   }\n });\n```\n\n\
  如果我们只想调用 `uglify` 的子任务，我们可以按如下方式注册任务：\n\n```\ngrunt.registerTask('default', ['uglify:singleFile']);\n\
  ```\n\n这将只运行子任务，但如果我们在注册任务时使用了旧的 `uglify` 目标，那么 `build` 和 `singleFile` 这两个目标都会被执行。\n\
  \n## 处理文件\n\n鉴于持续集成的性质，你在 Grunt 中使用的大多数任务都会与文件系统进行一些交互。最常见的模式是使用源文件和目标文件的映射，这可以通过多种方式来表示。源文件出现在\
  \ `src` 属性之后，目标文件出现在 `dest` 属性之后。\n\n### 紧凑格式\n\n紧凑格式是指 `src` 和 `dest` 属性都以文件数组的形式表示。以下是使用\
  \ `uglify` 任务压缩两个特定文件的示例：\n\n```\nmodels: {\n       src: ['js/model/Profile.js','js/model/Tweet.js'],\n\
         dest: ['build/models.min.js']\n}\n```\n\n\n\n### 文件对象格式\n\n当某个目标需要多个`src-dest`映射时，可使用此格式。文件列表被放入`files`属性中，该属性包含一个数组，用于在目标文件与源文件数组之间建立映射。\n\
  \n例如，当你希望在`uglify`任务中为应用程序的模型、视图和集合分别显式创建不同文件时，可以使用此格式。\n\n```\nuglify: {\n    \
  \ options: {\n       banner: '/*! <%= pkg.name %> <%= grunt.template.today(\"yyyy-mm-dd\"\
  ) %> */\\n'\n     },\n     individuals: {\n       files : {\n         'build/models.min.js'\
  \       : ['js/app/model/Profile.js', 'js/app/model/Tweet.js', 'js/app/Search.js'],\n\
  \         'build/collections.min.js'  : ['js/app/collection/Timeline.js'],\n   \
  \      'build/views.min.js'          : ['js/app/view/ProfilePopupView.js', 'js/app/view/ProfileView.js',\n\
  \ 'js/app/view/ResultsView.js', 'js/app/view/SearchView.js', 'js/app/view/TimeView.js'],\n\
  \         'build/routers.min.js'js/app/router/AppRouter.js'], /app/router/AppRouter.js'],\n\
  \         'build/util.min.js'         : ['js/app/util/Helpers.js']\n       }\n \
  \    }\n```\n\n会创建多个目标文件，每个文件都包含一个源文件列表。请注意，使用此格式时，你无法添加其他属性（我们稍后将介绍这些属性）。\n\n###\
  \ 文件数组格式\n\n此格式与前一种对象格式非常相似，区别在于每个映射不再是一个字符串，而是一个包含`src`文件列表和`dest`文件列表的对象。每个条目都是一个对象而非字符串，并且显式标记了`src`和`dest`属性。\n\
  \n```\nuglify: {\n     options: {\n       banner: '/*! <%= pkg.name %> <%= grunt.template.today(\"\
  yyyy-mm-dd\") %> */\\n'\n     },\n     individuals: {\n       files : {\n{dest:'build/models.min.js',\
  \ src:['js/app/model/Profile.js', 'js/app/model/Tweet.js', 'js/app/Search.js']},\n\
  {dest: 'build/collections.min.js', src: ['js/app/collection/Timeline.js']}\n   \
  \    }\n     }\n```\n\n### 附加属性\n\n你可以在简洁格式和文件数组格式的文件列表中添加多个属性，这些属性有助于精确筛选要使用的文件。具体属性列于表\
  \ 9-1 中。\n\n**表 9-1.** Grunt 中的附加文件属性\n\n| 属性 | 描述 |\n| --- | --- |\n| `filter`\
  \ | 接受一个函数，该函数接收`src`文件路径并返回`true`或`false`。通常使用`fs.Stats`方法名，可包含以下方法：`isFile` `isDirectory`\
  \ |\n| `nonull` | 当未找到匹配项时，返回一个包含模式本身的列表。这在脚本使用`--verbose`标志执行时，有助于调试文件路径问题。 |\n\
  | `dot` | 允许模式匹配以点号开头的文件名。 |\n| `expand` | 设为`true`时，允许你动态构建文件对象，具体描述见表 9-2。 |\n\
  \n使用`expand`属性可以设置多个其他可选参数，从而对文件对象进行更精细的控制，这些参数列于表 9-2 中。\n\n**表 9-2.** 当`expand\
  \ = true`时可使用的属性\n\n| 属性 | 描述 |\n| --- | --- |\n| `cwd` | 所有`src`文件需相对于此路径。 |\n\
  | `src` | 要匹配的模式，相对于`cwd`设置。 |\n| `dest` | 目标路径。 |\n| `ext` | 目标文件中使用的扩展名。使用此属性时，它会替换`dest`文件已定义的任何扩展名。\
  \ |\n| `flatten` | 从`dest`路径中移除所有路径部分。 |\n| `rename` | 用于重命名文件的函数。该函数会在`ext`和`flatten`处理完成后执行。\
  \ |\n\n### 通配符\n\nGrunt 允许使用通配符来查找文件集合，而无需手动列出所有需要处理的文件。这也称为文件通配（globbing）。我们最初指定的构建目标在`src`属性中使用了其中一种模式。\n\
  \n```\nbuild: {\n     src: 'js/app/**/*.js',\n     dest: 'build/<%= pkg.name %>.min.js'\n\
  },\n```\n\n表 9-3 列出了最常用的可用模式。\n\n**表 9-3.** Grunt 中的文件通配模式\n\n| 模式 | 描述 |\n| ---\
  \ | --- |\n| * | 匹配任意数量字符（但不匹配`/`）。例如，`js/app/model/*.js` 会接收`model`包中的所有 JS 文件。\
  \ |\n| ? | 匹配单个字符（但不匹配`/`）。 |\n| ** | 匹配任意数量字符（包括`/`）。例如，`js/app/**/*.js` 会接收`app`目录及其子目录中的所有\
  \ JS 文件。 |\n| {} | 允许使用逗号分隔的模式集合。 |\n| ! | 取反匹配。 |\n\n## 为项目使用 Grunt\n\n既然我们已经了解了\
  \ Grunt 的基本概念，接下来可以为项目构建一个更全面的构建脚本。至少，你需要在 Backbone 项目中持续执行以下步骤：\n\n- 使用 lint 插件对代码进行静态分析。\n\
  - 压缩 JavaScript 和 CSS 源代码。\n- 对生成的源代码自动执行单元测试。\n\n### 添加静态分析工具\n\nJSHint（[`www.jshint.com`](http://www.jshint.com/)）是一个静态分析工具，有助于检测\
  \ JavaScript 代码中的潜在错误。该工具源自 Douglas Crockford 的 JSLint，由社区维护。JSHint 项目的核心理念是关注那些可能实际破坏代码的错误，而非像\
  \ JSLint 那样严格地强制执行规范。\n\n对源代码运行 JSHint 可以避免打字错误和语法错误。此类质量检查非常值得，尤其是在编写生产代码时。你可以在[`https://github.com/gruntjs/grunt-contrib-jshint`](https://github.com/gruntjs/grunt-contrib-jshint)找到\
  \ JSHint 的 Grunt 插件。\n\n#### 静态分析的重要性\n\n随着 JavaScript 多年来的成熟，大多数浏览器已增加了更宽松的容错机制，能够接受“不合格”代码。由于\
  \ JavaScript 是一门动态语言，很容易产生不合规的代码，这些代码可能导致代码审查人员和经验不足的开发人员难以察觉的问题。大多数成熟语言都具备静态分析工具，而鉴于\
  \ JavaScript 代码可能出现的随意性问题，静态分析显得更为重要。通过添加自动化检查，可以确保你的代码获得最佳表现机会。尽管静态分析揭示的错误有时乍看之下令人不适，但使用\
  \ lint 工具最终会让你拥有一个更加整洁的代码库。\n\n\n\n#### 安装与配置\n\n要安装 JSHint 并将依赖添加到项目中，请在命令行中运行以下命令：\n\
  \n```\nnpm install grunt-contrib-jshint --save-dev\n```\n\n现在，在 `Gruntfile` 中，我们需要加载\
  \ JSHint 的 Node 模块。\n\n```\ngrunt.loadNpmTasks('grunt-contrib-jshint');\n```\n\n\
  `jshint` 任务的配置主要发生在 `options` 配置对象中，该对象接受许多不同的 lint 检查项。您想要执行的任何检查都应设置为 `true`。表\
  \ 9-4 列出了一些最常用的 JSHint 检查项。完整的检查项列表可在 [`www.jshint.com/docs/options/`](http://www.jshint.com/docs/options/)\
  \ 找到。\n\n**表 9-4.** 常用的 JSHint 检查项\n\n| 选项 | 用途 |\n| --- | --- |\n| `curly` | 要求在循环和条件语句中的代码块周围使用花括号\
  \ |\n| `eqeqeq` | 要求所有相等操作都必须使用精确相等运算符（`===` 或 `!==`） |\n| `eqnull` | 当设置为 `true`\
  \ 时，抑制对 `== null` 比较的警告 |\n| `browser` | 定义现代浏览器暴露的全局变量，例如 `window`、`document` 和\
  \ `navigator` |\n| `globals` | 一组 `<库名>:<暴露方式>` 对，用于定义那些具有全局变量的库，包括 jQuery、MooTools、Phantom\
  \ 等 |\n| `latedef` | 禁止在变量定义之前使用该变量 |\n| `plusplus` | 禁止使用 `++` 或 `--` |\n| `undef`\
  \ | 禁止使用未声明的变量；对于发现拼写错误非常有用 |\n| `unused` | 禁止使用已定义但在源代码中从未使用的变量 |\n| `maxdepth`\
  \ | 接受一个数字，表示允许的嵌套层数；有助于管理复杂代码 |\n\n该任务的选项还包含一个 `ignores` 属性，您可以在其中指定要忽略的文件列表。通常，您会忽略项目中包含的任何外部库。\n\
  \n`initConfig` 部分现在应该包含一个类似于下面定义的 JSHint 任务。请注意，并非前面列出的所有检查项都已启用。\n\n```\ngrunt.initConfig({\n\
  \npkg: grunt.file.readJSON('package.json'),\n\njshint: {\n\noptions: {\n\ncurly:\
  \ true,\n\neqeqeq: true,\n\neqnull: true,\n\nbrowser: false,\n\nglobals: {\n\njQuery:\
  \ true\n\n},\n\nignores: ['js/external/**/.*.js']\n\n},\n\nfiles: {\n\nsrc: ['js/app/**/*.js']\n\
  \n},\n\n},\n\n});\n```\n\n最后，需要将该任务添加到默认任务中。`registerTask` 函数接受两个参数：任务的别名和将在该别名下执行的任务数组。\n\
  \n```\ngrunt.registerTask('default', ['jshint']);\n```\n\n您的源代码中可能会出现一些格式错误，例如混用空格和制表符。您可以选择使用\
  \ JavaScript 源码格式化工具（如 Sublime Text 中的 JSFormat）来修复它们。或者，您也可以选择直接从 JSHint 配置中移除该项检查。\n\
  \n格式化源代码后，可能仍然存在一些错误，这些错误会输出到控制台，如图 9-2 所示。JSHint 抛出的错误大多比较容易理解，但如果您遇到任何困难，可以在 [`http://jslinterrors.com/`](http://jslinterrors.com/)\
  \ 上找到相关解释。\n\n![A978-1-4302-6335-7_9_Fig2_HTML.jpg](img/A978-1-4302-6335-7_9_Fig2_HTML.jpg)\n\
  \n**图 9-2.** JSHint 的输出\n\n如果您是在本地机器上运行，将输出打印到控制台是可以的。但是，在持续集成服务器上运行时，更希望将输出写入文件。为此，该任务自然提供了一个配置选项，即使用\
  \ `reporterOutput` 属性，该属性接受一个文件路径作为参数。\n\n```\njshint: {\n\noptions: {\n\ncurly:\
  \ true,\n\neqeqeq: true,\n\neqnull: true,\n\nbrowser: false,\n\nglobals: {\n\njQuery:\
  \ true\n\n},\n\nignores: ['js/external/**/.*.js'],\n\nreporterOutput : 'reports/jshint.txt'\n\
  \n},\n\nfiles: {\n\nsrc: ['js/app/**/*.js']\n},\n```\n\n上面的代码片段展示了 JSHint 运行的报告现在将如何被写入\
  \ `reports` 目录下的 `jshint.txt` 文件中。\n\n### 压缩 JavaScript 源码\n\n有许多插件可以帮助您压缩 JavaScript\
  \ 源码。正如本章前面提到的，压缩是将所有 JavaScript 合并到一个文件中，以减少加载脚本时的开销。由于我们之前使用了 Uglify，这里我们将继续使用它。作为其压缩流程的一部分，UglifyJS\
  \ ([`http://lisperator.net/uglifyjs/`](http://lisperator.net/uglifyjs/)) 会移除空白字符并缩短变量名。\n\
  \nUglify 的 Grunt 插件地址是 [`https://github.com/gruntjs/grunt-contrib-uglify`](https://github.com/gruntjs/grunt-contrib-uglify)。\n\
  \n#### 代码压缩的重要性\n\n在开发机器上运行 JavaScript 代码时，您的重点是让一切都能正常工作。这本身没有错，但当您的代码投入生产环境时，就需要考虑性能问题。运行诸如\
  \ YSlow ([`http://developer.yahoo.com/yslow/`](http://developer.yahoo.com/yslow/))\
  \ 之类的工具可以分析您的 Web 应用是否存在性能问题，并给出如何修复这些问题的建议。\n\n最常见的问题之一是包含了过多的外部 JavaScript 脚本。加载这些脚本所需的每个\
  \ HTTP 请求都要花费时间。除了网络开销之外，未压缩的 JavaScript 还意味着需要传输更多的数据。通过压缩 JavaScript，您可以确保避免 Web\
  \ 应用中最常见的性能问题之一。\n\n\n\n#### 安装与配置\n\n要安装 uglify 并将依赖项添加到项目中，请在命令行中运行以下命令：\n\n`npm\
  \ install grunt-contrib-uglify --save-dev`\n\n现在，在 `Gruntfile` 中，我们需要加载 uglify 的\
  \ node 模块：\n\n`grunt.loadNpmTasks('grunt-contrib-uglify');`\n\n表 9-5 列出了配置 `uglify`\
  \ 任务时可用的一些选项。\n\n**表 9-5.** UglifyJS 任务配置选项\n\n| 选项 | 用途 |\n| --- | --- |\n| `banner`\
  \ | 将被添加到压缩文件顶部的字符串。 |\n| `mangle` | 开启或关闭变量名缩短（混淆）功能。 |\n| `report` | 报告 uglify\
  \ 处理的结果。可选值包括 `false`（默认）、`min`（压缩结果）和 `gzip`（gzip 压缩结果）。 |\n| `preserveComments`\
  \ | 指定是否应丢弃注释。可选值包括 `false`（默认；删除所有注释）、`all`（保留所有注释）和 `some`（保留以 `!` 开头的注释）。 |\n\
  | `wrap` | 将所有代码包裹在一个闭包中，以确保没有变量泄漏。 |\n| `footer` | 将被追加到压缩输出末尾的字符串。 |\n\n为了确保压缩成功，你首先需要考虑未压缩脚本的加载顺序。在我们的应用示例中，所有外部脚本都按照特定顺序首先被加载，然后才加载我们自己的\
  \ Backbone 代码。\n\n虽然你可以选择使用外部库的压缩版本，但我们还是将它们包含在一个单独的压缩文件中。这样，脚本加载数量将从以下代码片段中的 18\
  \ 个减少到 2 个。\n\n```\n<!-- 通用引用 -->\n<script src=\"js/external/jquery-1.10.2.js\"\
  ></script>\n<script src=\"js/external/underscore.js\"></script>\n<script src=\"\
  js/external/backbone.js\"></script>\n<script src=\"js/external/handlebars.js\"></script>\n\
  <script src=\"js/external/moment.js\"></script>\n<script src=\"js/external/dialog.js\"\
  ></script>\n\n<!-- 模型 -->\n<script src=\"js/app/model/Tweet.js\"></script>\n<script\
  \ src=\"js/app/model/Profile.js\"></script>\n<script src=\"js/app/model/Search.js\"\
  ></script>\n\n<!-- 集合 -->\n<script src=\"js/app/collection/Timeline.js\"></script>\n\
  \n<!-- 视图 -->\n<script src=\"js/app/view/TimelineView.js\"></script>\n<script src=\"\
  js/app/view/ProfileView.js\"></script>\n<script src=\"js/app/view/ProfilePopupView.js\"\
  ></script>\n<script src=\"js/app/view/SearchView.js\"></script>\n<script src=\"\
  js/app/view/ResultsView.js\"></script>\n\n<!-- 路由 -->\n<script src=\"js/app/router/AppRouter.js\"\
  ></script>\n\n<!-- 工具 -->\n<script src=\"js/app/util/Helpers.js\"></script>\n\n\
  <!-- 应用主入口 -->\n<script src=\"js/app/app.js\"></script>\n```\n\n由于我们可以在任何任务中创建子任务，因此我们将\
  \ `uglify` 拆分为两个：一个用于外部脚本，另一个用于我们自己的 JavaScript 源码。\n\n```\nuglify: {\n   options:\
  \ {\n      banner: '/*! <%= pkg.name %> <%= grunt.template.today(\"yyyy-mm-dd\"\
  ) %> */\\n'\n   },\n   externalLibraries: {\n      // 处理外部库\n   },\n   individuals:\
  \ {\n      // 处理我们的源码\n   }\n}\n```\n\n用于 `externalLibraries` 分段的文件列表应明确指定，以确保源文件按加载顺序进行压缩。所有这些文件将被压缩到构建目录中的\
  \ `external.min.js` 文件里。\n\n```\nexternalLibraries: {\n   files:{\n      'build/external.min.js'\
  \ : ['js/external/jquery-1.10.2.js',\n                                  'js/external/underscore.js',\n\
  \                                  'js/external/backbone.js',\n                \
  \                  'js/external/handlebars.js',\n                              \
  \    'js/external/moment.js',\n                                  'js/external/dialog.js']\n\
  \   }\n},\n```\n\n对我们自己源代码的压缩任务可以稍有不同。同一个子目录中的文件之间不存在相互依赖关系。例如，没有模型对象依赖于另一个模型。因此，我们可以使用\
  \ `**` 模式来一次性包含一个子目录中的所有文件。\n\n```\napp: {\n   files : {\n      'build/app.min.js'\
  \       : ['js/app/model/*.js', 'js/app/collection/*.js',\n                    \
  \               'js/app/view/*.js', 'js/app/router/*.js',\n                    \
  \               'js/app/util/.*.js', 'js/app/*.js' ],\n   }\n}\n```\n\n现在，需要将 `uglify`\
  \ 任务添加到默认任务列表中。\n\n`grunt.registerTask('default', ['jshint','uglify' ]);`\n\n运行之后，你可以修改应用的\
  \ `index.html` 文件，改用压缩后的文件。以下应该是该应用所需的唯一脚本引用：\n\n```\n<script src=\"build/external.min.js\"\
  ></script>\n<script src=\"build/app.min.js\"></script>\n```\n\n当你使用压缩脚本测试应用时，可能会发现加载过程中出现一些\
  \ JavaScript 错误。如果发生这种情况，请确保你已按正确顺序包含了所有必需的文件。\n\n作为参考，`uglify` 任务的完整代码清单应如下所示：\n\
  \n```\nuglify: {\n   options: {\n      banner: '/*! <%= pkg.name %> <%= grunt.template.today(\"\
  yyyy-mm-dd\") %> */\\n',\n      report: 'min'\n   },\n   externalLibraries: {\n\
  \      files:{\n         'build/external.min.js' : ['js/external/jquery-1.10.2.js',\n\
  \                                     'js/external/underscore.js',\n           \
  \                          'js/external/backbone.js',\n                        \
  \             'js/external/handlebars.js',\n                                   \
  \  'js/external/moment.js',\n                                     'js/external/dialog.js']\n\
  \      }\n   },\n   app: {\n      files : {\n         'build/app.min.js'       :\
  \ ['js/app/model/*.js', 'js/app/collection/*.js',\n                            \
  \          'js/app/view/*.js', 'js/app/router/*.js',\n                         \
  \             'js/app/util/.*.js', 'js/app/*.js' ],\n      }\n   }\n}\n```\n\n请注意在任务选项中添加了\
  \ `report` 属性。这会导致在任务执行完成后，将压缩节省的空间信息打印到控制台。图 9-3 展示了对我们源码运行 `uglify` 所节省的空间。\n\n\
  ![A978-1-4302-6335-7_9_Fig3_HTML.jpg](img/A978-1-4302-6335-7_9_Fig3_HTML.jpg)\n\n\
  **图 9-3.** uglify Grunt 任务的输出\n\n### 压缩 CSS\n\n压缩 JavaScript 代码很重要，出于同样的原因，压缩应用程序中的\
  \ CSS 也值得一做。同样，有多个插件可以实现这一点。CSSMin ( [`https://github.com/gruntjs/grunt-contrib-cssmin`](https://github.com/gruntjs/grunt-contrib-cssmin)\
  \ ) 就是这样一个插件。\n\n\n\n#### 安装与配置\n\n要安装 CSSMin 并将依赖项添加到项目中，请在命令行中执行以下命令：\n\n`npm\
  \ install grunt-contrib-cssmin --save-dev`\n\n现在，我们需要在 `Gruntfile` 中加载这个 node 模块。\n\
  \n`grunt.loadNpmTasks('grunt-contrib-cssmin');`\n\nCSSMin 是一个简单的工具，因此该任务的配置选项并不多。表\
  \ 9-6 列出了配置 CSSMin 任务时可用的部分选项。\n\n**表 9-6.** CSSMin 任务配置选项\n\n| 选项 | 用途 |\n| ---\
  \ | --- |\n| `banner` | 为压缩后的源码添加特定的头部信息。 |\n| `report` | 报告压缩过程的结果。可选值包括 `false`（默认）、`min`（压缩结果）和\
  \ `gzip`（gzip 结果）。 |\n| `keepSpecialComments` | 保留或移除特殊注释。默认情况下会保留特殊注释。值设为 `1` 将保留第一个，设为\
  \ `0` 则将移除所有特殊注释。 |\n\n我们创建的应用程序包含的 CSS 数量有限，但为了减小文件体积并降低加载开销，仍然值得进行压缩。当前 `index.html`\
  \ 引用了两个样式表。\n\n`<link rel='stylesheet' href='css/modern.css'>`\n\n`<link rel=\"\
  stylesheet\" href=\"css/style.css\">`\n\nGrunt 任务配置相当简单，包含一个 `combine` 对象，其中列出了生成\
  \ `app.min.css` 文件所需包含的文件列表。\n\n`cssmin:{ combine:{ files: { 'build/app.min.css'\
  \ : ['css/**.css'] } } }`\n\n现在，需要将 `CSSMin` 任务添加到默认任务列表中。\n\n`grunt.registerTask('default',\
  \ ['jshint','uglify','cssmin' ])`\n\n完成压缩后，这两个 CSS 文件可以被这一个压缩后的 CSS 文件替代：\n\n`<link\
  \ rel='stylesheet' href='css/app.min.css'>`\n\n## 自动化你的测试套件\n\n在上一章中，我们介绍了两个测试库：QUnit\
  \ 和 Jasmine。以下部分将展示如何为它们分别添加任务。\n\n### QUnit 任务\n\nQUnit Grunt 插件（ [`github.com/gruntjs/grunt-contrib-qunit`](https://github.com/gruntjs/grunt-contrib-qunit)\
  \ ）允许你自动化执行上一章创建的 QUnit 测试套件。当你下载该插件时，它会自动将 PhantomJS 作为依赖项下载。这意味着该任务可以在后台运行，无需标准浏览器。\n\
  \n#### 安装与配置\n\n要安装 QUnit 并将依赖项添加到项目中，请在命令行中执行以下命令：\n\n`npm install grunt-contrib-qunit\
  \ --save-dev`\n\n现在，我们需要在 `Gruntfile` 中加载 QUnit 的 node 模块。\n\n`grunt.loadNpmTasks('grunt-contrib-qunit');`\n\
  \n**表 9-7.** QUnit 任务配置选项\n\n| 选项 | 用途 |\n| --- | --- |\n| `timeout` | 在超时失败前，Grunt\
  \ 等待 QUnit `start()` 的时间（毫秒）。默认值为 5,000 毫秒。 |\n| `urls` | 要传递给 PhantomJS 的测试套件 URL。\
  \ |\n| `force` | 当设置为 `true` 时，允许任务忽略失败并继续运行。默认值为 `false`。 |\n\n我们的 QUnit 任务配置相当简单。真正需要做的只是将\
  \ QUnit 测试套件的 URL 传递给 `urls` 属性。\n\n`qunit:{ all: { options: { urls: ['http://localhost/backbone/chapter9/js/test/app.html']\
  \ } } }`\n\n表 9-7 列出了 QUnit 任务的其他配置选项。最后，需要将 QUnit 任务作为默认任务的一部分。\n\n`grunt.registerTask('default',\
  \ ['jshint', 'uglify', 'cssmin', 'qunit']);`\n\n运行脚本时，最终会执行 QUnit 测试，并将测试结果写入控制台。图\
  \ 9-4 显示了更新后的 Grunt 脚本执行结果。\n\n![A978-1-4302-6335-7_9_Fig4_HTML.jpg](img/A978-1-4302-6335-7_9_Fig4_HTML.jpg)\n\
  \n**图 9-4.** 添加 QUnit 测试后 Grunt 脚本的输出\n\n请注意，修改测试脚本以加载测试的压缩版本（而非开发版本）会很有用。\n\n####\
  \ 生成 QUnit 报告\n\n诸如 Hudson 和 Jenkins 等持续集成服务器允许你安排构建任务在夜间运行，或在代码提交到版本控制后经过特定时间后运行。这些系统还允许你查看单元测试结果，只要报告以特定格式生成即可。正如我们在上一章关于测试的内容中提到的，JUnit\
  \ 报告格式被认为是标准格式。\n\n尽管 QUnit 任务本身不包含报告配置，但有一个名为 QUnit-JUnit（ [`github.com/sbrandwoo/grunt-qunit-junit`](https://github.com/sbrandwoo/grunt-qunit-junit)\
  \ ）的独立任务可用于创建这些报告。\n\n要安装该插件，只需运行常规命令。\n\n`npm install grunt-qunit-junit --save-dev`\n\
  \n在你的 `Gruntfile` 中，加载 `npm` 任务。\n\n`grunt.loadNpmTasks('grunt-qunit-junit');`\n\
  \n现在，你可以在 `initConfig` 块中为报告任务创建配置。主要参数是保存报告的目标路径。\n\n`//qunit reports`\n`qunit_junit:\
  \ {`\n`   options: {`\n`      //生成报告的位置`\n`      dest: 'reports/'`\n`   }`\n`}`\n\
  \n该任务需要在 QUnit 测试任务本身之前执行。这样报告模块才能监听所有的测试。\n\n`grunt.registerTask('default', ['jshint',\
  \ 'uglify', 'cssmin', 'qunit_junit', 'qunit']);`\n\n当你运行脚本时，所有测试结果应位于 `reports`\
  \ 目录下的 `TEST-app.xml` 文件中。该报告文件应能被任何持续集成系统轻松处理。\n\n\n\n### Jasmine 任务\n\n在前一章中，我们还探讨了使用\
  \ Jasmine 作为 QUnit 的替代方案来编写测试。存在一个用于执行 Jasmine 测试的 `grunt` 任务（参见 [`https://github.com/gruntjs/grunt-contrib-jasmine`](https://github.com/gruntjs/grunt-contrib-jasmine)）。与\
  \ QUnit 任务类似，Jasmine 依赖于 PhantomJS，并在需要时会自动安装它。\n\n#### 安装与配置\n\n要安装 Jasmine 插件并将依赖项添加到项目中，请从命令行运行以下命令：\n\
  \n```\nnpm install grunt-contrib-jasmine --save-dev\n```\n\n现在，在 `Gruntfile` 中，我们需要加载\
  \ Jasmine 的 Node 模块。\n\n```\ngrunt.loadNpmTasks('grunt-contrib-jasmine');\n```\n\
  \n**表 9-8. Jasmine 任务配置选项**\n\n| 选项 | 用途 |\n| --- | --- |\n| `src` | 一个字符串或文件数组，表示正在被测试的文件。\
  \ |\n| `specs` | 一个字符串或文件数组，指向正在使用的测试规范文件。这应该是 `.js` 规范文件，而不是 `SpecRunner.html`\
  \ 文件。 |\n| `vendor` | 一个字符串或第三方库文件数组，应在测试执行前加载。 |\n| `junit.path` | 输出 JUnit XML\
  \ 文件的路径。 |\n| `junit.consolidate` | 是否将所有 JUnit XML 合并到一个文件中。 |\n| `host` | 运行测试的主机。\
  \ |\n| `template` | 用于生成你的 SpecRunner 的自定义模板，以 Underscore.js 模板形式解析。 |\n\n在你的 `Gruntfile`\
  \ 中，加载 `jasmine` 任务。\n\n```\ngrunt.loadNpmTasks('grunt-contrib-jasmine');\n```\n\
  \n现在你可以配置你的 Jasmine 测试运行。因为我们没有使用前一章创建的 `SpecRunner`，你需要在此配置上多花一些功夫。\n\n我们只会传入正在测试的源文件，并使用\
  \ `vendor` 属性来加载额外的外部库，例如 `Sinon`、压缩后的外部依赖项以及 `jasmine-jquery`。完整的配置选项列表见表 9-8。\n\
  \n你会注意到我们省略了 `ProfileView.js`。原因是视图通过 Jasmine 插件进行测试稍微复杂一些，所以专注于数据测试会更简单。\n\n```\n\
  //jasmine 测试\njasmine: {\n   main: {\n      src: ['js/app/model/Profile.js', 'js/app/model/Tweet.js',\
  \ 'js/app/collection/Timeline.js'],\n      options: {\n         specs: 'js/test/jasmine/spec/ProfileSpec.js',\n\
  \         vendor : ['js/test/sinon.js', 'build/external.min.js', 'js/test/jasmine/lib/jasmine-jquery.js'],\n\
  \         junit :{\n            path: 'reports/'\n         }\n      }\n   }\n}\n\
  ```\n\n我们还添加了导出 JUnit 报告的路径。这些报告都将根据测试套件命名，因此在这种情况下，我们将有两个套件。\n\n最后，我们只需要将任务添加到默认任务列表中。\n\
  \n```\ngrunt.registerTask('default', ['jshint', 'uglify', 'cssmin', 'qunit_junit',\
  \ 'qunit', 'jasmine']);\n```\n\n### 创建不同的任务集\n\n我们创建的附加任务并非总是适用于所有机器。开发者工作空间需要运行与持续集成服务器不同的任务集。这可以通过\
  \ Grunt 中的 `registerTask` 函数很简单地进行控制。\n\n例如，假设开发者在命令行运行 `grunt dev`，而持续集成服务器运行 `grunt\
  \ build`。我们将为这两者创建不同的任务集。\n\n```\ngrunt.registerTask('dev', ['jshint',  'qunit_junit',\
  \ 'qunit', 'jasmine']);\n\ngrunt.registerTask('build', ['jshint',  'uglify', 'cssmin',\
  \ 'qunit_junit', 'qunit', 'jasmine']);\n\ngrunt.registerTask('default', ['jshint',\
  \ 'uglify', 'cssmin', 'qunit_junit', 'qunit', 'jasmine']);\n```\n\n在开发者机器上，会运行静态分析和测试任务，而构建机器还会运行压缩任务。这种运行任务的方式极其有用，因为构建文件的不同用户会有不同的目标。\n\
  \n## 项目脚手架\n\nGrunt 对其 `grunt-init` 模块提供了出色的支持，用于启动新项目。无需编写大量样板代码，你可以直接利用此功能。\n\n\
  首先，你需要通过 Node 包管理器安装 `grunt-init` 插件。建议使用 `-g` 标志进行全局安装。\n\n```\nnpm install -g\
  \ grunt-init\n```\n\n运行 `grunt-init` 时，你需要提供一个用于项目的模板。有许多可用的模板，包括位于 [`https://github.com/gruntjs/grunt-init-jquery`](https://github.com/gruntjs/grunt-init-jquery)\
  \ 的标准 jQuery 插件模板。你可以下载源码，或者使用以下命令克隆 Git 仓库：\n\n```\ngit clone https://github.com/gruntjs/grunt-init-jquery.git\
  \ ~/.grunt-init/jquery\n```\n\n现在，模板已可用，可以通过使用以下命令来调用 `grunt-init` 任务使用它：\n\n```\n\
  grunt-init   ~/.grunt-init/jquery\n```\n\n在回答一系列问题后，你将获得一个完整的 jQuery 插件启动模板。图 9-5\
  \ 显示了运行上述代码后的输出。\n\n![A978-1-4302-6335-7_9_Fig5_HTML.jpg](img/A978-1-4302-6335-7_9_Fig5_HTML.jpg)\n\
  \n**图 9-5.** `grunt-init` 任务后的输出\n\n当然，还有许多模板可以帮助启动 Backbone 项目，包括 [`https://bitbucket.org/nicopigelet/grunt-init-backbone`](https://bitbucket.org/nicopigelet/grunt-init-backbone)\
  \ 。要下载模板，请运行以下命令克隆 Git 仓库：\n\n```\ngit clone https://bitbucket.org/nicopigelet/grunt-init-backbone.git\
  \ ~/.grunt-init/backbone\n```\n\n然后，你只需要运行以下命令来创建构建 Backbone 项目所需的基础文件即可。\n\n```\n\
  grunt-init backbone\n```\n\n## 一些有用的 Grunt 插件\n\n本章只是浅尝辄止地介绍了大量可用插件中的一小部分。表 9-9\
  \ 描述了一些你可能发现有用的其他插件。\n\n**表 9-9. 有用的 Grunt 插件**\n\n| 插件 | 描述 |\n| --- | --- |\n\
  | Grunt 监视任务 ( [`https://github.com/gruntjs/grunt-contrib-watch`](https://github.com/gruntjs/grunt-contrib-watch)\
  \ ) | 监视你机器上的一组文件变化，并在检测到变化时运行 Grunt 任务。这还可以强制在浏览器中进行实时重载，以便更改立即可见。 |\n| SAAS 预处理器\
  \ ( [`https://github.com/gruntjs/grunt-contrib-sass`](https://github.com/gruntjs/grunt-contrib-sass)\
  \ ) | CSS 预处理器任务，用于将 SASS 文件转换为 CSS。SASS 允许你以比纯 CSS 更简洁的方式为应用程序定义样式。 |\n| Handlebars\
  \ ( [`https://github.com/gruntjs/grunt-contrib-handlebars`](https://github.com/gruntjs/grunt-contrib-handlebars)\
  \ ) | 用于预编译 Handlebars 模板的 Grunt 任务。模板预编译，配合使用 Handlebars 引擎库（而非完整版本），可以极大地提高应用程序性能。\
  \ |\n| Backbone 样板 ( [`https://github.com/backbone-boilerplate/grunt-bbb`](https://github.com/backbone-boilerplate/grunt-bbb)\
  \ ) | 与 `grunt-init` 协同工作，帮助生成 Backbone 项目所需的所有样板代码和结构。 |\n\n"
- '# 总结


  本章介绍了 Grunt 任务运行器系统，并解释了它如何通过启用持续集成来帮助为你的项目增加高质量水平。涵盖了任何 JavaScript 项目的典型任务，包括 JavaScript
  和 CSS 源码的压缩与精简、单元测试以及静态分析。Grunt 生态系统非常庞大，对于任何特定问题，总会有可用的任务。我强烈建议你在应用程序中采用 Grunt，即使你已经在使用其他构建系统。由于任务和配置都是用纯
  JavaScript 编写的，这降低了学习曲线。




