- "# Backbone.js 简介\n\n## 摘要\n\n`Backbone.js` 有助于为原本难以驾驭的 JavaScript 代码库提供结构，并且可能是你项目的完美选择。本章将带你进入\
  \ `Backbone.js` 的世界，从宏观层面了解该框架的核心理念，并理解其存在的意义。\n\n我们将深入探讨模型-视图-控制器模式，并讨论它为何对 Web\
  \ 应用如此有用。在介绍模型-视图-* 框架（Backbone 只是其中一种选择）的优势时，我们还会将 Backbone 与当前 JavaScript 领域其他主流的模型-视图-*\
  \ 框架进行比较。\n\n你将看到一些知名公司目前正在使用 Backbone 的实例，我们也会坦诚地告诉你，哪些情况下 Backbone 可能是你项目的答案，以及哪些情况下它并不适用。\n\
  \n在我们深入编码之前，还会告诉你下载和配置 Backbone 以用于项目所需的所有信息。\n\n## 什么是 Backbone.js？\n\n自 2010 年底发布以来，Backbone\
  \ 一直被认为是实现单页 Web 应用的主流库之一。Backbone 因轻量级而备受赞誉，并被大量商业上成功的 Web 应用广泛采用。在本章后面，我们将探讨 Backbone\
  \ 与其他竞品方案的区别。\n\nBackbone 由 Jeremy Ashkenas 创建，他也是 CoffeeScript 的创造者。该库最初是 DocumentCloud\
  \ 代码库的一部分，这是一个开源项目，让记者能够协作上传和注释文档。作为一个重度依赖 JavaScript 的应用，我们现在所知的 Backbone 负责将应用结构化为一个连贯的代码库。`Underscore.js`\
  \ 作为 `Backbone` 唯一的依赖，也是 DocumentCloud 应用的一部分。\n\n### 使命宣言\n\n简单来说，Backbone 帮助开发者在客户端\
  \ Web 应用中管理数据模型，其严谨性和结构性堪比传统服务端应用逻辑。\n\n要理解这对 JavaScript 开发者有多重要，我们需要回顾网站和应用的开发历史，以及\
  \ Backbone 是如何融入这一演进的。\n\n#### 服务端逻辑\n\n直到 2005 年，网站还相当静态，所有真正的业务逻辑都在服务端使用 PHP、Java\
  \ 和 .NET 等语言实现。虽然这些网站远非我们今天习以为常的动态体验，但这种方法让前端开发者拥有非常干净的代码库：HTML 负责结构，CSS 负责表现，或许再加上一点\
  \ JavaScript 用于表单验证和弹出窗口之类的事情。虽然不够激动人心，但这是一个非常可控的环境。\n\n#### Ajax\n\n在 2005 年，Ajax（异步\
  \ JavaScript 和 XML）开始流行，并永远地改变了网站的使用方式。随着无需重新加载整个页面即可调用服务端逻辑的能力出现，一种新型的动态网站成为可能。虽然这在当时是重大突破，但如今看来相对保守。通常，Ajax\
  \ 用于更新页面的一小部分。\n\n例如，在填写注册表单时，你可以在 JavaScript 中实现一个 Ajax 调用来检查特定用户名是否已存在，并在页面的错误区域高亮显示该信息。\n\
  \n为了创建这些更具吸引力的用户界面，前端开发者不得不使用更多的 JavaScript，这导致了更复杂的代码。正是在这一点上，这门语言开始被更认真地对待，因为\
  \ Ajax 实现了客户端与服务器之间更自然的通信方式。\n\n表述性状态转移（REST）提供了一种通过 HTTP 进行客户端-服务器通信的架构。所有 Ajax\
  \ 请求都使用 RESTful 服务进行，在创建 Backbone 应用时，你将必然在数据模型中消费此类服务。在本书后续章节中，当我们处理模型时，将进一步了解\
  \ REST 对你的 JavaScript 应用的重要性。\n\n#### jQuery\n\nJavaScript 成熟的另一个关键里程碑是 2006 年 John\
  \ Resig 发布的 jQuery，这个框架承认了在编写 Web 应用 JavaScript 时需要一种更可控的方法。该框架提供了搜索和操作文档对象模型（DOM）、处理事件、创建动画以及使用简洁语法创建\
  \ Ajax 应用的能力。jQuery 还抽象了许多困扰前端工程师的跨浏览器不兼容问题。\n\n凭借其模块化架构，开发者可以编写自己的插件并运行在 jQuery\
  \ 之上。突然间，JavaScript 开发者得到了重视，更优雅的用户界面成为可能。\n\n#### 单页 Web 应用\n\n单页 Web 应用是一种只需加载一次页面，所有必要元素都可以动态加载到页面上而无需离开的应用。这种更具沉浸感的用户体验正是桌面应用一直以来的优势。既然\
  \ Ajax 已经证明了自己，而 JavaScript 生态系统也提供了更强大的库和框架，单页应用就更容易实现了。\n\n这些应用并非没有挑战。为了让一个页面处理应用生命周期中的不同阶段，页面状态是必需的。此外，还需要让用户能够在特定阶段为应用添加书签——这正是\
  \ Backbone 真正有助于减轻实现此类方案复杂性的地方。\n\n各式各样的智能手机和平板电脑，各有其平台和特性，导致绝大多数开发者都在构建基于 HTML5\
  \ 的 Web 应用，其行为类似于原生应用。单页应用使得这类应用可以直接从网站构建并提供，而无需用户通过设备上的应用商店获取。\n\n\n#### 持续存在的结构化需求\n\
  \n随着基于浏览器的应用持续占据主导地位，单页应用背后的架构变得愈发重要。由于大量逻辑现在驻留在客户端，显而易见，那些曾适用于传统桌面应用程序的实践和模式，如今在\
  \ JavaScript 中同样适用。\n\n其核心部分是在应用程序中心建立一个数据模型。随着产品复杂度的提升，能够追踪众多不同组件的状态变得至关重要。\n\n\
  Gmail 就是一个典型的例子（参见图 1-1）。你需要追踪邮件是否已读，以及日期、主题、发件人和邮件内容。未读邮件的数量也会在左侧菜单中高亮显示。你越是深入观察\
  \ Gmail 这个 Web 应用程序，就越能体会到其背后数据模型的复杂性。\n\n![A978-1-4302-6335-7_1_Fig1_HTML.jpg](img/A978-1-4302-6335-7_1_Fig1_HTML.jpg)\n\
  \n图 1-1. Gmail，一个经典的 Web 应用程序示例（图片来自 [`http://cdn.theatlantic.com/static/mt/assets/science/threadlist-large.png`](http://cdn.theatlantic.com/static/mt/assets/science/threadlist-large.png)）\n\
  \n尝试在没有一些支持性框架的情况下实现这样一个数据模型会相当混乱。除非你是一个单人开发团队（即便这样也值得商榷），否则就需要一定程度的统一性，以确保每个人都理解数据模型是如何定义和呈现的。\n\
  \n这正是 Backbone.js 的用武之地，它让开发者能够更轻松地处理数据模型、构建模块化视图，并在整个应用中发送事件。\n\n## Web 应用程序的设计模式\n\
  \n设计模式被认为为软件开发带来了成熟度。自从开创性的“四人组”著作《设计模式：可复用面向对象软件的基础》介绍了构建应用程序的一系列可复用解决方案和方法以来，程序员们一直在使用模式来驾驭他们的代码库。遵循设计模式能够提高任何架构师或开发者阅读源代码的可读性，并允许你在应用程序创建过程中遵循经过验证的技术和结构。\n\
  \n这种亟需的规程被引入 JavaScript 世界只是时间问题，而其中应用最广泛、最适用的模式之一也是最古老的：模型-视图-控制器。真正的面向对象 JavaScript\
  \ 的出现，使得许多框架能够采用这种模式的变体。\n\n### 模型-视图-控制器\n\n模型-视图-控制器（MVC）是一种模式，它将任何涉及用户界面的代码库的三个主要领域分离开来。这种模式的起源可以追溯到\
  \ SmallTalk 时代，这是一种备受推崇的语言，早在 20 世纪 70 年代就超前地处理了面向对象软件。自那时起，它已成为任何优秀软件系统的基础。\n\n\
  该模式使用了三个关键术语。\n\n*   **模型（Model）**：模型包含了你希望在应用程序中表示的所有数据。你可以将其视为那些通过用户界面显示或操作的数据的纯粹数据表示。当发生变化时，模型会使用通知机制来提醒观察者，观察者随后可以决定是否采取行动。\n\
  \    *   模型对象的典型例子是 `User` 或 `Todo` 项：现实世界项目的纯数据表示，不包含任何用户界面细节。\n*   **视图（View）**：视图是模型的视觉表示，可以看作是表示层。尽管视图了解模型，但它不会直接修改模型，而是通过控制器层来处理模型编辑操作。视图通常会观察模型，以便随着任何变化而更新。\n\
  \    *   在我们的 Web 应用程序中，视图是呈现给用户的 HTML/DOM 元素。\n*   **控制器（Controller）**：控制器处理来自用户的输入并更新模型的状态，本质上充当了整个结构的粘合剂。当用户需要更改模型中的数据时，他们会将控制器作为中间人来完成此操作。\n\
  \n当你按照图 1-2 所示来思考时，这种结构的好处便显而易见。\n\n![A978-1-4302-6335-7_1_Fig2_HTML.jpg](img/A978-1-4302-6335-7_1_Fig2_HTML.jpg)\n\
  \n图 1-2. 基于 MVC 的应用程序交互概览\n\n简单来说，模型是你的数据，视图是你在浏览器中看到的，而控制器则处理这两个层之间的交互。\n\n为了进一步理解，让我们举例说明\
  \ MVC 模式如何应用于一个包含注册表单的典型 Web 应用程序。\n\n此例中的视图是 HTML 表单，它允许用户输入或编辑关于自己的数据。控制器是当用户点击“保存”时被调用的代码。控制器还会对表单中提供的数据进行一些验证。最后，模型是用户的数据表示。图\
  \ 1-3 以序列图的形式展示了这一点。\n\n![A978-1-4302-6335-7_1_Fig3_HTML.jpg](img/A978-1-4302-6335-7_1_Fig3_HTML.jpg)\n\
  \n图 1-3. 注册表单的 MVC 交互序列\n\n这种设计模式提供了两个关键优势：关注点分离和代码复用。\n\n模型始终与视图隔离，并且只包含领域对象数据。因此，你以这种方式为桌面浏览器开发的应用程序，可以在移动版本中使用相同的模型，而无需更改任何代码。\n\
  \n在本书的后续部分，你将看到像这样分离代码会带来更易于测试和更易于维护的代码，同时关注点分离也为开发团队提供了更自然的工作平衡。\n\n### 模型-视图-*\n\
  \n随着 UI 框架的发展，MVC 模式的各种变体应运而生，它们都遵循原始模式的精神，但略有不同。这些变体被统称为模型-视图-* 框架，因为专用控制器的概念通常被放弃了。\n\
  \n在构成 MV* 家族的 MVC 模式中，有两个主要的变体。虽然这些差异可能看起来近乎学术化（确实如此），但在深入研究实现这些模式的 JavaScript 框架之前，对它们有一定程度的了解是重要的。\n\
  \n#### 模型-视图-展示器\n\n顾名思义，模型-视图-展示器（MVP）模式仅在于用展示器替换了控制器。展示器负责视图和模型之间的交互，并包含视图的所有业务逻辑。\n\
  \n重要的区别在于引入了更高程度的解耦，即展示器通过接口与视图通信。这个接口的添加意味着可以更容易地独立于真实视图来测试业务逻辑，并且你的应用程序逻辑甚至可以在任何\
  \ UI 代码编写完成之前编写。\n\n此外，视图和模型之间通常没有直接链接，展示器负责传递数据，并充当两者之间真正的中间人。\n\n#### 模型-视图-视图模型\n\
  \n在模型-视图-视图模型（MVVM）中，模型和视图部分与之前定义完全相同。ViewModel 是一个单一的实体，它负责视图所需的数据，例如对“底层”模型进行过滤或组合，以及\
  \ UI 操作或查看模型所需的所有操作。使用 ViewModel 有时会感觉像是重复，除非底层应用程序模型很复杂。\n\n\n\n### Backbone 如何支持\
  \ MV*\n\n正如你将在本书后面看到的，Backbone 有四个核心概念：`Backbone.Model`、`Backbone.View`、`Backbone.Router`\
  \ 和 `Backbone.Collection`。目前你可以将 `Backbone.Model` 和 `Backbone.Collection` 视为都处理与模型相关的事情。集合实际上是一组模型，而模型则是单个对象或一行数据的表示。\n\
  \n`Backbone.View` 代表数据的呈现，但也可以被看作承担了控制器的一些职责。视图的实际渲染将在 HTML 中完成，而 Backbone 中的视图实际上只是提供了将模型信息传递到\
  \ HTML 的能力。\n\n通常，`Backbone.Router` 会将 URL 简单地映射到函数，但在某种程度上，它也能参与控制器的职责。\n\n因此，虽然在\
  \ Backbone.js 中明确定义了模型和视图，但并没有对控制器的定义；相反，控制器本应承担的某些任务在视图和路由器之间共享。\n\n让我们对我们原始的 MVC\
  \ 图进行一些变体，并将其应用于 Backbone，来看看交互会是怎样的（见图 1-4）。\n\n![A978-1-4302-6335-7_1_Fig4_HTML.jpg](img/A978-1-4302-6335-7_1_Fig4_HTML.jpg)\n\
  图 1-4. Backbone MV* 实现结构的图示\n\n所有需要在 HTML 视图中表示的数据都存储在 JavaScript 对象中，而不是 DOM 中。模型是\
  \ Backbone 的一大优势，因为它提供了使用 RESTful 服务从服务器保存和检索数据的功能。\n\n### 其他 JavaScript MV* 框架\n\
  \nJavaScript 开发领域中有大量的 MV* 框架可供选择。由于教程数量众多以及团队提供的文档质量很高，Backbone 往往是讨论最多的。\n\n现在我们已经对\
  \ Backbone 应用的结构有了大致的了解，让我们看看其他一些框架与之相比如何。\n\n#### Knockout.js\n\nKnockout.js 首次发布于\
  \ 2010 年 7 月，它遵循 MVVM 模式。与 Backbone 不同，Knockout 在用户界面的各个部分与底层数据模型之间提供了绑定，导致模型变化时\
  \ UI 会动态更新。而在 Backbone 中，这种更新需要由开发者编写代码实现。可以从 [`Knockoutjs.com`](http://knockoutjs.com/)\
  \ 下载，如图 1-5 所示。\n\n![A978-1-4302-6335-7_1_Fig5_HTML.jpg](img/A978-1-4302-6335-7_1_Fig5_HTML.jpg)\n\
  图 1-5. Knockout.js 网站\n\n在 Knockout 中，数据绑定是包含在 HTML 中的。在这个例子中，`firstName` 是我们想要显示的模型中的属性。\n\
  \n```html\n<p>First name: <input data-bind=\"value: firstName\" /></p>\n```\n\n\
  ViewModel 是模型绑定到 UI 的地方。当使用 `ko.observable()` 函数定义属性时，视图将自动更新。\n\n```javascript\n\
  var myViewModel = {\n  firstName : ko.observable('James');\n};\n```\n\n定义模型后，使用\
  \ `applyBindings` 函数将其绑定到 UI。\n\n```javascript\nko.applyBindings(myViewModel);\n\
  ```\n\n正如你所见，使用 Knockout 入门非常容易，并且与在 Backbone.js 中创建的同类应用相比，它需要的 JavaScript 代码更少。但它并非没有缺点——更复杂的\
  \ UI 交互可能难以正确处理。\n\n尽管这两个框架都为你的 JavaScript 应用提供了结构，但 Backbone 主要关注提供 MVC 解决方案，并尽量避免介入用户界面。与此同时，Knockout\
  \ 利用 MVVM 模式实现自动化的用户界面更新。Backbone 的强项在于它如何处理模型，即使用 RESTful 服务检索和持久化数据。而在 Knockout\
  \ 中实现这一点需要大量的额外代码。一个具有简单用户界面和基础数据模型的项目可能受益于使用 Knockout，但对于更复杂的工作，Backbone 是一个可靠的选择。\n\
  \n#### AngularJS\n\nAngularJS 由 Google 于 2009 年发布。它采用了与 Knockout 类似的方法，即数据绑定直接添加到\
  \ HTML 页面中。该框架的主要设计目标之一是从应用逻辑中移除 DOM 操作。这导致控制器和模型是用纯 JavaScript 编写的，而不是扩展框架定义的版本。可以从\
  \ [`http://angularjs.org`](http://angularjs.org/) 下载 AngularJS，如图 1-6 所示。\n\n![A978-1-4302-6335-7_1_Fig6_HTML.jpg](img/A978-1-4302-6335-7_1_Fig6_HTML.jpg)\n\
  图 1-6. AngularJS 网站\n\nAngular 提供了许多 `ng-*` 属性来在你的 HTML 中使用，以实现 UI 和模型之间的数据绑定。当\
  \ Backbone 使用 Underscore 或其他替代模板库时，Angular 允许模型数据直接注入到 HTML 源码中。\n\n以下 HTML 片段展示了如何为一个\
  \ HTML 页面使用控制器，以及如何遍历并显示该控制器中的人员列表：\n\n```html\n<body ng-controller=\"AddressBookController\"\
  >\n  <ul>\n    <li ng-repeat=\"person in people\">\n      {{person.name}}\n    </li>\n\
  \  </ul>\n```\n\n控制器写成一个简单的 JavaScript 对象，只需要允许视图检索数据即可。\n\n```javascript\nfunction\
  \ AddressBookController($scope) {\n  $scope.people = [\n    {\"name\": \"James\"\
  },\n    {\"name\": \"Sarah\"},\n  ];\n}\n```\n\n一些开发者可能会觉得 Angular 太过于固执己见，强迫你以特定的方式编写应用。\n\
  \n#### Ember\n\nEmber.js 于 2011 年发布，是 SproutCore 2.0 的品牌重塑。SproutCore 是一个稍早的框架，包含了它自己的小部件集。为了在不需要使用这些小部件的情况下，暴露\
  \ SproutCore 底层运行的 MVC 框架，Ember.js 应运而生。可以从 [`http://emberjs.com/`](http://emberjs.com/)\
  \ 下载 Ember，如图 1-7 所示。\n\n![A978-1-4302-6335-7_1_Fig7_HTML.jpg](img/A978-1-4302-6335-7_1_Fig7_HTML.jpg)\n\
  图 1-7. EmberJS 网站\n\nEmber 是另一个使用数据绑定方法的框架，允许视图在模型变化时自动更新。这种数据绑定也在模型之间起作用，因此如果相关对象中的数据发生变化，两者会保持同步。\n\
  \n与 Backbone 一样，Ember 使用模板库（在 Ember 的情况下是 Handlebars）将模型数据注入到 HTML 中。Ember 还引入了一个专门的控制器来完成完整的\
  \ MVC 栈，但模型层是由简单的 JavaScript 对象表示的。\n\n以下是 Handlebars 模板的一个示例：\n\n```html\n<script\
  \ type=\"text/x-handlebars\" id=\"index\">\n  <h1>Address Book</h1>\n  <ul>\n  \
  \  {{#each person}}\n      <li>Hello, <b>{{name}}</b>!</li>\n    {{/each}}\n  </ul>\n\
  </script>\n```\n\n同时，模型和应用是在 JavaScript 中创建的。\n\n```javascript\nApp = Ember.Application.create();\n\
  \nApp.Person = Ember.Object.extend({\n  name: null,\n});\n\nApp.IndexRoute = Ember.Route.extend({\n\
  \  model: function() {\n    var people = [\n      App.Person.create({\n        name:\
  \ \"James\"\n      }),\n      App.Person.create({\n        firstName: \"Sarah\"\n\
  \      })\n    ];\n    return people;\n  }\n});\n```\n\nEmber 所需的 JavaScript 代码量与\
  \ Backbone 类似。但再次强调，Backbone 的优势在于其专用的模型对象。\n\n\n## 摘要\n\n你可能已经注意到，大多数其他框架都提供了一些内置功能，用于在模型发生变化时更新视图。`Backbone`\
  \ 常被视为一个更低层次的框架，因为所有这些工作都需要程序员通过额外代码来完成。有人可能认为这是缺点，但这能让你更透明地了解应用在幕后是如何运作的。由于你自己编写\
  \ UI 更新代码，当出现问题时更容易调试。这种控制级别是开发者广泛提及的使用 `Backbone` 的原因之一。\n\n此外，作为现有更成熟的框架之一，`Backbone`\
  \ 在互联网上拥有更丰富的文档、教程和示例。\n\n### Backbone 在实际应用中的采用\n\n在权衡 `Backbone` 是否适合你的项目时，了解其他行业领导者如何在日常实际应用中使用该技术会很有帮助。本书本节列出了一些知名案例，并给出了五个使用\
  \ `Backbone` 的充分理由，同时另列一份清单描述了它可能不适合的场景。\n\n### 使用 Backbone 的公司\n\n全球一些最杰出的公司使用\
  \ `Backbone` 驱动其最新应用。让我们来看看其中三家公司，并了解他们为何选择 `Backbone`。你可以在 `Backbone` 官方网站上找到更多案例研究。\n\
  \n#### Airbnb\n\nAirbnb 是 Y Combinator 最成功的案例之一，提供协作共享服务，让用户能在 192 个国家出租居住空间。Airbnb\
  \ 在多个产品中使用了 `Backbone`，从移动网页应用到网站功能（包括心愿单和匹配），以及其内部应用。`Backbone` 在移动网站中的使用示例如图 1-8\
  \ 所示。\n\n![A978-1-4302-6335-7_1_Fig8_HTML.jpg](img/A978-1-4302-6335-7_1_Fig8_HTML.jpg)\n\
  \n图 1-8. Backbone 在 Airbnb 技术栈中广泛应用\n\n尽管 Airbnb 最初在后台使用 Rails，并在客户端使用 `Backbone`，但现已将移动应用演进为在服务器端使用\
  \ `Node.js`，其中也包含了 `Backbone`。这使得应用程序逻辑能够在两端共享，而无需用不同语言重写。\n\n你可以在其开发者博客 [`http://nerds.airbnb.com/weve-launched-our-first-nodejs-app-to-product/`](http://nerds.airbnb.com/weve-launched-our-first-nodejs-app-to-product/)\
  \ 上了解更多关于 Airbnb 使用 `Backbone` 的信息。\n\n#### SoundCloud\n\nSoundCloud 是一家总部位于德国的音乐分发平台，支持上传或收听用户创作的内容。其团队最初使用\
  \ `Backbone` 作为移动网页应用的基础，但后来也将其用于桌面网站的前端，示例如图 1-9 所示。\n\n![A978-1-4302-6335-7_1_Fig9_HTML.jpg](img/A978-1-4302-6335-7_1_Fig9_HTML.jpg)\n\
  \n图 1-9. 带有播放器控件的 SoundCloud 桌面网站\n\n工程团队选择 `Backbone` 的原因之一是“它没有过多规定应该如何使用”。与 Airbnb\
  \ 类似，SoundCloud 决定使用 `Handlebars` 作为模板引擎，因为可以添加自定义辅助函数并预编译模板。\n\n要了解更多关于 SoundCloud\
  \ 架构的信息，请查看其博客 [`http://backstage.soundcloud.com/2012/08/evolution-of-soundclouds-architecture/`](http://backstage.soundcloud.com/2012/08/evolution-of-soundclouds-architecture/)。\n\
  \n#### Foursquare\n\nFoursquare 是一款基于位置的社交网络应用，允许用户在世界各地签到并分享状态给朋友。Foursquare 使用\
  \ `Backbone` 为其问题领域中的所有真实世界对象（用户、地点和签到）创建模型类。使用 `Backbone` 是因为它提供“一种简单轻量的机制来捕获对象数据和状态，并具备经典继承的语义”。不过，团队提供了自己的服务\
  \ URI 来替代 `Backbone.sync`，以抽象化对 API 的 Ajax 调用。使用 `Backbone` 的网站示例如图 1-10 所示。\n\n\
  ![A978-1-4302-6335-7_1_Fig10_HTML.jpg](img/A978-1-4302-6335-7_1_Fig10_HTML.jpg)\n\
  \n图 1-10. Foursquare 桌面网站\n\n更多信息请参见 Foursquare 工程博客，地址为 [`http://engineering.foursquare.com/2011/12/08/web-sites-are-clients-too/`](http://engineering.foursquare.com/2011/12/08/web-sites-are-clients-too/)。\n\
  \n### 在项目中使用 Backbone 的五个理由\n\n如果你仍不确定 `Backbone` 是否是项目的正确选择，以下是考虑使用它的五大理由。\n\n\n\
  *   `Backbone`是一个库，而非框架：库与框架之间存在微妙的差别。框架对项目中的使用方式有非常严格的规定，通常会强制采用某种可能并不适合的编码风格。正如你在比较不同\
  \ MV* 选项的章节中所看到的，`Backbone`是能留给你最大自由度的选项，并且它可以重构到任何现有的`JavaScript`应用程序中，而无需为了使用该库而彻底改造应用。如果你需要额外功能，还可以对`Backbone`进行扩展。你可以将任何模板库与`Backbone`一起使用，所以如果`Underscore`无法满足你的需求，或者你熟悉`Handlebars`之类的库，你可以改用它们。由于`Backbone`默认没有双向数据绑定，你不会遇到任何意外的性能问题。该库的简洁性使你免于此类问题的困扰。\n\
  *   应用程序需要结构：如果你想创建商业级的`JavaScript`应用程序，就需要施加某种结构。`Backbone`的`MV*`方法几乎适用于所有类型的应用，有助于分离处理数据模型和视图的代码。大多数客户端应用程序都会使用`RESTful\
  \ API`，而这是`Backbone`擅长的领域之一，它提供了模型中的同步函数，能够为那个数据对象实现所有创建、更新和删除的`REST`调用。使用像`Backbone`这样的框架，为`JavaScript`开发带来了一种通用的、定义明确的方法，整个项目团队都能轻松遵循。`Backbone`鼓励的最佳实践易于维护。\n\
  *   丰富的文档和庞大的用户社区：使用任何新技术都可能令人望而生畏，但一套成熟的文档和庞大的用户群基础可以帮助缓解这种压力。使用`Backbone`，你会获得丰富的资源。在[`http://backbonejs.org`](http://backbonejs.org/)上提供的文档易于理解，并带有注释的源代码和示例，帮助你理解库的每一个方面。再结合你在互联网上找到的大量博客和教程，你就知道自己并不孤单。还有大量由用户社区创建的`Backbone`插件和扩展可用。如果你遇到问题，很可能已经有人找到了解决方法。我们将在本书后面更详细地介绍`Backbone`插件和扩展。\n\
  *   扩展性好，并且有信誉良好的公司在使用它：在上一节中，我们只看到了几家使用`Backbone`的大公司。但如果你访问[`http://backbonejs.org`](http://backbonejs.org/)，你会看到有大量的公司已经采用了`Backbone`。这个库不仅仅用于实验性项目；以`Airbnb`为例，`Backbone`被证明是一个非常优秀的解决方案，现在甚至在服务器端使用它。这证明了它是一个扩展性良好且能与任何其他`JavaScript`库（甚至`Node.js`）良好集成的库。该库的成熟度非常关键，并且因为`Backbone`已经存在了近三年并达到了\
  \ 1.0.0 版本，它在许多其他`MV*`解决方案中具有优势。\n*   你的代码库是一团乱麻：`Backbone`不仅仅适用于新项目。你可能有一些遗留应用程序需要清理。你可能一直在大量使用`jQuery`，手动操作`DOM`并进行`$.ajax`调用。如果是这种情况，`Backbone`可以是一个完美的替代品，通过`Backbone.Model`对象，你可以使用更简单的代码来实现相同的结果。别忘了，你不需要绝对使用`Backbone`提供的所有功能。你可以根据当时的应用需求进行选择。\n\
  \n### 三个可能不适合使用`Backbone`的原因\n\n在某些情况下，为你的应用程序使用`Backbone`可能没有意义。为任何项目使用错误的库都可能产生毁灭性的后果。以下列表说明了`Backbone`不太适用的情况：\n\
  \n*   **概念验证型应用**：有时你只是想快速做一个实验，验证特定用户界面的外观。如果你要创建的东西非常简单，那么`Backbone`可能过于庞大，而使用像`AngularJS`这样的东西可能会让你更快地完成一些工作。如果你还不太熟悉`Backbone`的工作原理，其他一些解决方案能让你在更短的时间内从零开始构建应用。不过，如果这个概念验证最终变成了一个真正的应用，那么值得考虑在实际实现中使用`Backbone`。\n\
  *   **你不习惯处理较低级别的`JavaScript`**：作为限制较少的`MV*`解决方案之一，`Backbone`为开发者留下了很多工作要做。模型和视图之间的双向数据绑定就是其中一项任务。虽然许多开发者社区成员乐于为此绑定编写代码，但有些人可能会觉得它令人生畏。那些对整体应用实现细节提供更多指导的、更具约束性的框架可能会更有用，但要注意潜在的性能问题。\n\
  *   **你正在创建一个简单的网页**：`Backbone`适用于正在创建网络应用的开发者，而不仅仅是创建简单的网页。毫无疑问，对于如此简单的场景，使用`Backbone`将是小题大做。\n\
  \n对某些人来说，这条界线可能难以界定，所以我认为，除非满足以下任一条件，否则使用`Backbone`都是小题大做：\n\n*   你需要进行`Ajax`调用来从服务器保存和检索数据\n\
  *   你的页面上有许多复杂的视图区域\n*   你已经使用大量`jQuery`来操作`DOM`\n\n很难找到理由不去使用像`Backbone`这样强大的库。如果你熟悉`JavaScript`，使用`Backbone`不会是一个巨大的跨越，并且随着你遵循库的代码库内所鼓励的最佳实践和模式，它将提升你的编码技能。\n\
  \n## 开始设置`Backbone`\n\n既然你已经确定`Backbone`适合你，那么是时候设置你的开发环境了。\n\n\n\n### 下载 Backbone\n\
  \nBackbone.js 的官方网站位于 [`http://backbonejs.org`](http://backbonejs.org/)。在撰写本文时，该库的版本已达到\
  \ 1.0.0。\n\n如图 1-11 所示，您有三个下载选项：开发版、生产版和尝鲜版。通常，在本地机器上工作时，您会希望使用开发版。开发版包含未压缩格式的代码，因此易于调试和阅读，并且包含了所有注释。\n\
  \n![A978-1-4302-6335-7_1_Fig11_HTML.jpg](img/A978-1-4302-6335-7_1_Fig11_HTML.jpg)\n\
  \n图 1-11.\n\n[Backbonejs.​org](http://Backbonejs.org)\n\n当您将应用部署到生产服务器时，应使用生产版。从图\
  \ 1-11 可以看出，这是一个小得多的文件，因此它可以更快地下载到 Web 浏览器，从而提高网站性能。\n\n尝鲜版是提交者目前正在开发的代码。除非您想探索团队正在开发的新功能，否则大多数情况下都应避免使用此版本。\n\
  \n现在，请下载开发版，并将 `backbone.js` 文件保存到您的开发目录中。\n\nBackbone 始终依赖于 Underscore.js，您可以在\
  \ Backbone 网站上找到它的链接。该库可以从 [`http://underscorejs.org`](http://underscorejs.org/)\
  \ 下载，如图 1-12 所示。同样，您应该下载该库的开发版。\n\n![A978-1-4302-6335-7_1_Fig12_HTML.jpg](img/A978-1-4302-6335-7_1_Fig12_HTML.jpg)\n\
  \n图 1-12.\n\n[Underscorejs.​org](http://Underscorejs.org)\n\n如果您打算使用 `Backbone.View`（我们将会用到），您需要依赖一个\
  \ DOM 操作库，可以选择 jQuery 或 Zepto。鉴于 jQuery 被视为行业标准，并且拥有丰富的信息资源和插件，我们也将依赖它。\n\n您可以从\
  \ [`www.jquery.com`](http://www.jquery.com/) 下载 jQuery，如图 1-13 所示。在撰写本文时，可以选择 v1.10.12\
  \ 或 v2.0.3。如果您有幸只需支持较新版本的浏览器，那么可以选择 v2.x 分支。但如果您需要支持 Internet Explorer 6、7 或 8（我们大多数人仍需如此），那么您应该从\
  \ v1.x 分支下载。\n\n![A978-1-4302-6335-7_1_Fig13_HTML.jpg](img/A978-1-4302-6335-7_1_Fig13_HTML.jpg)\n\
  \n图 1-13.\n\n[`jQuery.com`](http://jquery.com/)\n\n#### 下载与否\n\n一些开发者倾向于指向其 JavaScript\
  \ 库的托管版本，这些版本来自内容分发网络（CDN）或直接从项目的开发网站获取。当您的项目部署到真实环境时，这种做法是合理的。但为了熟悉流程，我们将直接下载每个依赖库。在本书的后续部分，我们将讨论\
  \ CDN 如何帮助改善应用的性能。\n\n### 测试你的环境：Backbone 项目结构\n\n现在您已下载完所有库，我们可以测试一个非常简单的、加载 Backbone\
  \ 库的项目，以确保一切设置正确。\n\n所有这些库都应下载到 `js/external` 文件夹中。这只是一个惯例，用于将您自己编写的 JavaScript\
  \ 与所依赖的库分隔开。\n\n您需要创建一个 `index.html` 文件，以便应用可以在浏览器中运行。该文件应添加到根目录，最终形成如图 1-14 所示的文件夹结构。\n\
  \n![A978-1-4302-6335-7_1_Fig14_HTML.jpg](img/A978-1-4302-6335-7_1_Fig14_HTML.jpg)\n\
  \n图 1-14.\n\n简单 Backbone 应用的文件夹结构\n\n在 `index.html` 中，我们将创建一个简单的 HTML 页面，并在页面底部包含依赖库。依赖库应按照依赖顺序加载；由于\
  \ Backbone 依赖于 Underscore 和 jQuery，因此应首先加载这两个库。\n\n```html\n<!DOCTYPE HTML>\n<html>\n\
  <head>\n    <meta charset=\"UTF-8\">\n    <title>我的应用</title>\n</head>\n<body>\n\
  <script src=\"js/external/jquery-1.10.2.js\"></script>\n<script src=\"js/external/underscore.js\"\
  ></script>\n<script src=\"js/external/backbone.js\"></script>\n<script>\n  // 你的\
  \ Backbone 代码写在这里\n</script>\n</body>\n</html>\n```\n\n目前，这个应用中还没有自定义的 Backbone\
  \ 代码；这将在本书后续深入探讨 Backbone 时添加。现在，该文件只包含一个占位注释，用于指示您应该在哪里添加代码。请注意，所有脚本都加载在页面末尾，而不是头部。这是\
  \ JavaScript 开发者的一种标准做法，目的是让页面渲染更早进行，而不会被脚本阻塞。\n\n现在，只需在浏览器中打开 `index.html`——如果加载库时没有出现错误，那么您就可以开始学习接下来的几章，构建一些真正的\
  \ Backbone 应用了。\n\n### 开发环境的一些技巧\n\n为 JavaScript 开发设置机器是比较个人化的事情；不同的人喜欢不同的工具。以下是我个人进行\
  \ JavaScript 开发时使用的一些工具。\n\n#### Apache\n\n您肯定需要某个版本的 Apache 来在本地托管您的 Web 应用。尽管对于本书中将要创建的应用类型，并不需要\
  \ PHP 和 MySQL，但在 Mac 或 Windows 平台上的安装便捷性方面，XAMPP（[`www.apachefriends.org/en/xampp.html`](http://www.apachefriends.org/en/xampp.html)）很难被超越。\n\
  \n#### Google Chrome\n\n在开发 JavaScript 时，Chrome 是我首选的浏览器，完全是因为其内置开发者工具的强大功能。Chrome\
  \ 开发者工具（图 1-15）是目前可用的最佳 Web 调试工具之一。从“Sources”标签中，您可以打开任何 JavaScript 文件并添加断点，从而检查变量的值，并逐步执行程序。图\
  \ 1-15 展示了在前面代码加载脚本时，在 `backbone.js` 中设置断点的情景。\n\n![A978-1-4302-6335-7_1_Fig15_HTML.jpg](img/A978-1-4302-6335-7_1_Fig15_HTML.jpg)\n\
  \n图 1-15.\n\nChrome 开发者工具\n\n“Console”标签是 JavaScript 开发者的另一个不可或缺的工具。您可以直接在控制台中输入代码并让它执行。当调试器暂停时，您可以访问当前作用域内的所有变量。同样，您可以直接在“Sources”视图中修改您的\
  \ JavaScript。\n\n稍后我们还将看到 Chrome 开发者工具提供的其他一些实用功能。值得一提的是，如果您偏好使用 Firebug，它也包含类似的工具。\n\
  \n#### Sublime Text 2\n\n最后，您需要一个好的文本编辑器来编写 JavaScript。值得庆幸的是，在编写客户端 Web 应用时，无需任何重量级的\
  \ IDE。如今 Java 社区中首选的编辑器似乎是 Sublime Text 2（参见 [`www.sublimetext.com`](http://www.sublimetext.com/)）。除了明显的语法高亮功能外，该编辑器还有大量可用的插件，帮助您在源代码中运行\
  \ jslint 等。甚至还有插件允许您连接到 Chrome 开发者工具，并从 Sublime 内部调试您的 JavaScript。\n\n\n\n"
- '# 总结


  在本章中，我们介绍了 Backbone，以及许多其他尝试使用模型-视图-控制器模式的变体为 Web 应用程序引入结构的 JavaScript 库和框架。我希望你现在能清楚这些领先项目之间的区别，并能看到
  Backbone 在赋予开发者控制权方面的不同之处。


  我们还探讨了为什么 Backbone 可能是你项目的一个好选择，并看了一些简要的案例研究，了解大公司如何将 Backbone 用于他们自己的项目。最后，本章列出了你需要开始使用的一切，从需要下载的
  JavaScript 库，到使 JavaScript 开发体验顺畅无阻的开发者工具箱。


  '
- "# 2. 走向面向对象\n\n## 摘要\n\n在详细讨论 Backbone.js 之前，我们将讨论一些 JavaScript 基础知识，重点是如何在 JavaScript\
  \ 中支持面向对象的概念。如果你已经熟悉 JavaScript，可以跳过本章。然而，如果你是创建 JavaScript 应用程序的新手，那么这将是充分利用本书的重要一步。如果你来自其他编程语言，你会对\
  \ JavaScript 所具备的能力感到惊讶。JavaScript 不再只是一种用于简单 Web 表单处理或爱好者使用的语言，它已成为软件开发生态系统中最流行的语言之一。\n\
  \n## JavaScript 的崛起\n\nJavaScript 最初于 1995 年以 `LiveScript` 的名义出现，它一直是当今我们所知的 Web\
  \ 发展的重要组成部分。通过允许客户端脚本，JavaScript 实现了更动态的网站和应用程序。\n\nJavaScript 是一种解释型语言，这意味着它不需要像\
  \ Java 和 C# 那样在执行前经过编译过程。相反，JavaScript 代码由浏览器逐条语句执行。由于 JavaScript 是一种解释型语言，大多数人认为在\
  \ JavaScript 中创建真正的对象几乎没有什么结构可言。尽管它最初专注于在浏览器上为网站创建客户端脚本，但它现在更常用于创建大规模应用程序。这催生了大量框架，这些框架有助于创建“单页\
  \ Web 应用程序”——即可以与后端服务异步通信的应用程序，而无需为每个操作重新加载整个页面。\n\nBackbone 是这类框架中的佼佼者之一。在我们了解\
  \ Backbone 应用程序如何工作之前，让我们先看看幕后，探究该语言的根基。\n\n### JavaScript 版本\n\n为了努力在浏览器间标准化 JavaScript，ECMAScript\
  \ 于 1997 年发布。自那时起，它经历了一系列版本发布，最近的一次是 2011 年 6 月发布的 ECMAScript 5.1。不同浏览器对最新规范版本中功能的支持差异很大；要了解你的目标浏览器支持哪些功能，可以查看网上众多兼容性表格之一，例如\
  \ Juriy Zaytsev 在 [`http://kangax.github.io/es5-compat-table/`](http://kangax.github.io/es5-compat-table/)\
  \ 上的概览。\n\n此版本中引入的特性包括改进的对象创建、对象属性定义、原生 JSON 支持以及有用的数组查询方法。这些改进在该语言持续主导 Web 的过程中发挥了巨大作用。\n\
  \n未来的 ECMAScript 版本，称为 ES.next，将包含模块定义、用于检测对象状态变化的可观察对象，以及真正的 `Map` 和 `Set` 实现。\n\
  \n纵观该语言的路线图，毫无疑问 JavaScript 将长期存在。ECMAScript 的每一次迭代都在不断加强该语言，添加那些被证明有用但又不会使语言变得过于复杂的功能。\n\
  \n### 执行 JavaScript 片段\n\n在本章中，你会遇到许多你可能想亲自尝试的代码片段。执行这些小段代码的最简单方法是使用 Chrome 开发者工具，它包含在你的标准\
  \ Chrome 发行版中。它提供的控制台允许你输入 JavaScript 并看到它立即执行。我们将在下一章更详细地介绍 Chrome 开发者工具。现在，你可以通过\
  \ Chrome 的 `工具/开发者工具` 菜单选项来访问这些工具。\n\n要向控制台输出内容，只需使用 `console.log` 语句，它可以接受任何类型的输出。Chrome\
  \ 控制台甚至会为你提供 JavaScript 的代码补全功能。如果你更喜欢使用 Firefox，Firebug 扩展程序可以提供类似的功能。\n\n你还可以在网上找到许多允许你执行\
  \ JavaScript 并分享你创建的片段的在线服务，例如 `jsfiddle.net` 和 `codepen.io`。\n\n## 对象到底是什么？\n\n\
  对象是你问题领域中某个事物的表示，它包含许多属性。对象的经典例子是“人”。在你的代码中，你会想引用人的不同属性，例如他们的姓名、年龄和性别。\n\n除了这些属性，一个对象还包含方法，这样你就可以更改任何属性的状态。继续以我们的人为例，你可能有一个\
  \ `setAge` 方法，允许你更改人的年龄。\n\n综合起来，对象是状态（属性）和行为（方法）的结合。在你的代码中使用对象的好处包括：\n\n- **模块化**：每个对象独立于其他任何对象，因此你可以对你的对象进行修改而不会影响其他对象。\n\
  - **封装**：每个对象中存储的属性可以对其他对象隐藏，因此你只暴露基本信息，并隐藏内部状态。\n- **复用**：如果已经存在一个对象来表示你的数据或完成特定任务，你可以简单地复用它，或者更好的是，扩展它的功能。\n\
  \n我们将在本章后面看到这里列出的每个实践如何应用到你的 JavaScript 代码中。但首先，我们将回到基础，简要介绍 JavaScript 的构建块。\n\n\
  ## JavaScript 基础\n\nJavaScript 并不是一种臃肿的语言，它为你提供了刚好够用的功能。但不要因此就误以为它是一种缺乏能力和特性的语言。让我们花些时间来了解\
  \ JavaScript 提供的各种数据类型和对象，并复习一下基本语法。\n\n### 原始数据类型\n\nJavaScript 包含五种原始数据类型：字符串（String）、数字（Number）、布尔值（Boolean）、未定义（Undefined）和空值（Null）。对于前三种类型，它们实际上是封装了真正原始类型的对象，因此它们提供了额外的方法来处理它们所代表的数据。\n\
  \n由于 JavaScript 是一种动态语言，一个变量在其生命周期内可以改变类型。等号左侧不需要像在静态类型语言中那样指定变量的类型，而是采用以下形式：\n\n\
  ```\nvar <变量名> = <值>\n```\n\n现在让我们逐一看看这些数据类型。\n\n\n\n#### 字符串\n\n`String`是一个简单的字符序列。你可以使用单引号或双引号来创建你的`String`，前提是你以开始时使用的相同引号结束。以下是两个有效的`String`声明：\n\
  \n```\nvar doubleQuoteString = \"A String in double quotes\";\n```\n\n如果你想在`String`中包含引号，可以使用`\\\
  `进行转义，如下所示：\n\n```\nvar escapedQuote = 'He said \\'hello\\'';\n```\n\n如前所述，`String`是简单类型的对象包装器，因此有许多可用于`String`操作的属性和方法（参见表\
  \ 2-1）。\n\n表 2-1. `String`函数列表\n\n| 方法/属性 | 用途 |\n| --- | --- |\n| `.length` | 返回`String`中的字符数。\
  \ |\n| `charAt(index)` | 返回指定索引处的字符。 |\n| `charCodeAt(index)` | 返回指定索引处字符的 Unicode。\
  \ |\n| `concat(String1, ..., StringN)` | 连接`String`并返回结果的副本。 |\n| `fromCharCode()`\
  \ | 将 Unicode 转换为字符。 |\n| `indexOf(value)` | 返回`String`中首次出现`value`的位置。如果不存在则返回-1。\
  \ |\n| `lastIndexOf(value)` | 返回`String`中最后一次出现`value`的位置。如果不存在则返回-1。 |\n| `match(regExp)`\
  \ | 在`String`内查找正则表达式的匹配项，将匹配项作为数组返回。 |\n| `replace(regExp, value)` | 在`String`内查找正则表达式的匹配项，并将生成的子字符串替换为新值。\
  \ |\n| `search(regExp)` | 在`String`内查找正则表达式的匹配项，并返回匹配项的位置。 |\n| `slice(startPos,\
  \ endPos)` | 提取指定开始和结束位置之间的`String`部分。 |\n| `split(token)` | 使用指定的`token`作为分隔符，将`String`拆分为子字符串数组。\
  \ |\n| `substr(startPos, numChars)` | 从`String`中提取子字符串，从开始位置开始，包含指定数量的字符。 |\n| `subString(startPos,\
  \ endPos)` | 从`String`中提取指定开始位置和结束位置之间的子字符串。 |\n| `toLowerCase()` | 返回所有小写字符的`String`。\
  \ |\n| `toUpperCase()` | 返回所有大写字符的`String`。 |\n| `trim()` | 返回删除两端空白字符后的`String`。\
  \ |\n| `valueOf()` | 返回`String`的原始值。 |\n\n`String`对象是不可变的，这意味着所有这些方法都不会改变原始`String`，而是返回一个新的`String`。\n\
  \n#### 数值\n\n与大多数其他编程语言不同，JavaScript 对数字使用浮点表示，仅此而已！根据你想如何表示数字，你可以创建整数、双精度数，并为更大的数字添加科学记数法。\n\
  \n```\nvar count      = 10;    //没有小数位的数字\nvar cost       = 2.99;  //有两位小数的数字\n\
  var pi         = 123e5; //12300000\n```\n\n当未定义小数位时，`Number`的范围是从-2⁵³ 到 2⁵³。对于浮点数，范围从-2e31\
  \ 到 2e31。\n\n数字有两个特殊值：当发生数学溢出异常时为`Infinity`，以及当数字小于支持的最小值时`-Infinity`。\n\n#### 布尔值\n\
  \n`Boolean`是用于条件语句测试的简单值，可以是两个值之一：`true`或`false`。值得注意的是，`true`被视为`String`而不是`Boolean`。\n\
  \n```\nvar lightsOn = true;\n```\n\n#### undefined 和 null\n\n很多人对`undefined`和`null`之间的区别感到困惑，主要是因为他们在其他编程语言中的经验。实际上，理解其工作原理相当简单。`Undefined`是分配给任何变量的默认值。因此，如果我如下创建一个变量并打印其值，它将是`undefined`。\n\
  \n```\nvar initialVariable;\nconsole.log(initialVariable);\n```\n\n`Null`必须由程序员赋值以清空变量，它不是默认值。\n\
  \n```\nvar initialVariable = 'hello';\ninitialVariable = null;\n```\n\n这两种类型在 JavaScript\
  \ 世界中被视为原始数据类型。\n\n## JavaScript 中的核心对象\n\nJavaScript 语言还为你提供了一些更有用的对象，以帮助处理日期、简单的数学运算、正则表达式和数组。\n\
  \n### 日期\n\n虽然存在许多库可以帮助你处理日期和时间，但 JavaScript 的`Date`对象本身相当强大。`Date`对象可以使用四个构造函数中的任何一个来构造，最有用的是不带参数的形式，它返回当前日期和时间。你也可以通过提供毫秒值来构建特定时间的`Date`对象。\n\
  \n```\nvar now = new Date();\n```\n\n你可以使用完整的`getX()`方法列表提取日期的各个部分，例如`getMinute()`、`getDay()`和`getMonth()`。\n\
  \n当然，还有更优雅的方法来获取日期表示，例如使用实用方法返回可读的日期：\n\n```\nvar calendarString  = now.toDateString();\n\
  var time            = now.toTimeString();\n```\n\n### 数学\n\nJavaScript 有一个内置的`Math`对象，允许你执行简单的数学运算。该对象包含许多有用的常量，例如`Math.PI`、`Math.E`和`Math.LOG2E`。\n\
  \n尽管它是一个对象，但你永远不需要创建`Math`的新实例来使用它。可以将其视为一个包含许多便捷方法的工具对象。\n\n例如，要将数字向上舍入到最接近的整数，请使用以下代码：\n\
  \n```\nvar doubleValue = 2.1;\nvar intValue = Math.ceil(doubleValue); //intValue\
  \ 现在为 3\n```\n\n表 2-2 列举了一些你可能觉得有用的可用方法。\n\n表 2-2. `Math`函数列表\n\n| 方法 | 用途 |\n|\
  \ --- | --- |\n| `abs(x)` | 返回`x`的绝对值。 |\n| `ceil(x)` | 返回`x`向上舍入到最接近的整数后的值。`ceil(2.1)`的结果为\
  \ 3。 |\n| `floor(x)` | 返回`x`向下舍入到最接近的整数后的值。`floor(2.1)`的结果为 2。 |\n| `log(x)` | 返回`x`的自然对数。\
  \ |\n| `pow(x,y)` | 返回`x`的`y`次幂的结果。 |\n| `random()` | 返回一个介于 0 和 1 之间的随机数。 |\n|\
  \ `round(x)` | 将`x`四舍五入到最接近的整数。`round(2.1)`的结果为 2。 |\n| `sqrt(x)` | 返回`x`的平方根。 |\n\
  \n请注意，上表并非完整列表。`Math`对象还允许你对数字执行正弦、余弦和正切计算。\n\n\n\n### RegExp\n\n正则表达式在需要对字符串执行模式匹配操作时非常有用。创建新表达式时，你将模式和若干标志作为参数传入。`RegExp`的创建有两种形式。\n\
  \n```\nvar pattern = new RegExp('javascript','i');\n```\n\n或者\n\n```\nvar pattern\
  \ = /javascript/i;\n```\n\n这两种形式都会搜索单词\"javascript\"，并因`i`修饰符而忽略大小写。你会记得`String`对象有一个`match`方法，它接受一个正则表达式作为参数，所以让我们在一个简短的代码示例中把两者结合起来。\n\
  \n```\nvar myString = 'I love Javascript';\nvar pattern = new RegExp('javascript',\
  \ 'i');\nvar match = myString.match(pattern);\n```\n\n在前一个例子中，`match`的结果是一个包含一个字符串的数组：`'Javascript'`。\n\
  \n注意\n\n正则表达式的内容远不止于此；你可以在 Mozilla 开发者网络上找到关于此对象的完整解释：[`https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp)。\n\
  \n## 基本语法\n\n你需要了解每种语言的一些基础知识。JavaScript 相当简单，规则很少，所以这部分不会花很长时间。\n\n### 声明变量\n\n\
  正如你已经看到的，变量可以简单地使用`var`关键字声明。\n\n```\nvar greeting = 'Hello';\n```\n\n如果你使用的是对象而非原始类型，你可能需要使用`new`关键字来构造对象。\n\
  \n```\nvar now = new Date();\n```\n\n变量的作用域（或可用性）取决于它在何处声明。在任何函数外部声明的变量是全局的，而在函数块内部声明的变量仅在该块内可见。\n\
  \n### 循环与条件语句\n\n编写 JavaScript 程序时，不可避免地需要在某个阶段使用条件语句。在本节中，我们将介绍`if`/`else`条件语句，以及`for`和`while`循环。\n\
  \nJavaScript 中的`if`条件采用以下形式：\n\n```\nif (<condition>){\n   <action>\n}\nelse{\n\
  \  <alternate action>\n}\n```\n\n在讨论条件时，注意`==`和`===`之间的区别很重要。双等号只检查值是否相等，而`===`提供了更高的精度，确保值和类型都相等。在大多数情况下，你都会希望使用这种精确相等操作。\n\
  \n```\nif (userInput === 'run'){\n   console.log('running application');\n}\n```\n\
  \n你会在一些程序中看到上述示例的简短形式，条件及两种结果都在一行内表达。\n\n```\nvar outputString = (price < 10 ) ?\
  \ 'Reasonable ' : 'Too Expensive';\n```\n\n你可能还需要使用`for`或`while`循环来遍历数组或执行重复操作。同样，语法很简单。`for`循环类似于\
  \ Java。\n\n```\nfor(var i = 99; i >= 0; i--){\n   console.log(i + 'bottles of beer\
  \ on the wall.' + i + ' bottles of beer');\n}\n```\n\n`while`循环仅包含一个条件测试，将变量初始化和变量状态的改变放在循环结构之外。\n\
  \n```\nwhile(<condition>){\n   <actions>\n}\n```\n\n还有一种`while`循环的变体可用，即在测试条件之前先执行一段代码。\n\
  \n```\ndo{\n<actions>\n}\nwhile(<condition>)\n```\n\n### 数组\n\n数组是任何编程语言的基础部分，提供了创建列表和集合的能力。JavaScript\
  \ 提供了有效处理数组所需的一切。\n\n创建新数组有两种方式；第二种更受欢迎，如下所示：\n\n```\nvar myArray = [];\nvar myArray\
  \ = new Array();\n```\n\n然后可以将项目添加到数组的特定索引中。数组从零开始索引，这意味着位置 0 是数组中的第一个元素。\n\n```\n\
  myArray[0] = 'first item';\n```\n\n项目也可以推入数组，占据下一个可用位置。\n\n```\nmyArray.push('first\
  \ item');\n```\n\n如果你已经知道数组中需要哪些项目，可以使用更简洁的语法来创建。\n\n```\nvar myArray = new Array('first\
  \ item', 'second item', 'third item');\n```\n\n表 2-3 列举了数组中所有可能的操作。\n\n**表 2-3.\
  \ JavaScript 数组函数列表**\n\n| 方法/属性 | 用途 |\n| --- | --- |\n| `.length` | 返回数组中的项目数，也可用于设置数组的大小。\
  \ |\n| `indexOf()` | 在数组中查找元素并返回其位置。如果找不到元素则返回-1。 |\n| `join()` | 连接数组的所有元素以创建一个字符串。\
  \ |\n| `lastIndexOf()` | 查找数组中元素的最后出现位置并返回其位置，如果找不到元素则返回-1。 |\n| `pop()` | 移除数组中的最后一个元素并返回该元素。\
  \ |\n| `push()` | 将元素添加到数组末尾并返回数组的新长度。 |\n| `reverse()` | 反转数组中元素的顺序。 |\n| `shift()`\
  \ | 移除数组中的第一个元素并返回该元素。 |\n| `slice()` | 选取数组的一部分并将其作为一个新数组返回。 |\n| `sort()` | 对数组元素进行排序。可以提供一个排序函数作为参数以强制执行特定的排序策略。\
  \ |\n| `splice()` | 从数组中添加或移除元素。该方法接受两个元素列表：要移除的元素和要添加的元素。 |\n| `toString()` | 返回数组的字符串表示形式。\
  \ |\n| `unshift()` | 将元素添加到数组的开头并返回新长度。 |\n| `valueOf()` | 返回数组的原始值。 |\n\n注意\n\n\
  一个数组可以包含混合的对象类型。你也可以通过将数组放入数组中来创建 n 维数组。\n\n### 闭包\n\n对于某些人来说，闭包可能是一个稍微令人困惑的话题，但很可能你会在编写\
  \ JavaScript 代码的过程中不知不觉地使用它们。jQuery 大量使用了闭包。\n\n闭包是一个内部函数，它可以访问外部函数的变量。正如我们本章前面提到的，变量具有全局作用域或函数作用域。闭包位于函数内部，因此既可以访问这两个作用域，也可以访问其自身的内部作用域。此外，闭包还可以访问外部函数的参数。\n\
  \n让我们通过一个简单的代码示例来研究这一点，其中两个闭包提供了计算圆形或矩形面积的功能。\n\n```\nfunction calculateArea(height,\
  \ width, shape){\n   var pi  = Math.PI;\n   //第一个闭包\n   function getCircleArea(){\n\
  \      var circleArea = pi * (height*height);\n      return circleArea;\n   }\n\
  \   //第二个闭包\n   function getRectangleArea(){\n      var area = width * height;\n\
  \      return area;\n   }\n   if(shape === 'Circle'){\n      return getCircleArea();\n\
  \   }\n   else{\n      return getRectangleArea();\n   }\n}\n```\n\n因此，只要你在一个函数内部定义另一个函数，就是在创建一个闭包。这可以被认为是一个只包含一个方法的对象，并且该方法是私有的，因为它无法从该函数外部执行。\n\
  \n## 让 JavaScript 面向对象\n\n如果你使用过传统的面向对象编程语言，你会熟悉诸如构造函数、属性和方法等术语，以及封装、继承和多态等附加概念。以下部分将介绍这些概念如何在\
  \ JavaScript 中应用。\n\n\n\n### 在 JavaScript 中创建简单对象\n\n在 JavaScript 中创建对象非常简单。只需创建一个新的\
  \ `Object` 实例，然后根据需要添加属性即可。\n\n```\nvar myObject = new Object();\nmyObject.id =\
  \ 100;\n```\n\n另一种常见的创建对象方式是采用对象字面量模式，即在创建时将所有属性作为参数列在构造器内。\n\n```\nvar myObject\
  \ = {id: 100};\n```\n\n前面的两个例子都会生成相同的对象，你可以通过以下方式访问 `id` 属性：\n\n```\nvar objectId\
  \ = myObject.id;\n```\n\n### 定义构造器\n\n上一节只是浅尝辄止地介绍了如何创建对象。通常情况下，你会希望使用构造器来创建对象。构造器允许你传入一些初始变量并设置对象的初始状态。\n\
  \n在其他语言中，这是通过类来实现的，但 JavaScript 没有类；它只有函数。这正是该语言施展其能力的地方。\n\n假设你想创建一个表示消息的对象。你需要定义主题、收件人和消息内容。使用前面任何一种方法都会显得冗长且容易出错。为了创建我们的表示，我们为\
  \ `Message` 创建一个新函数，并列出参数，如下所示：\n\n```\nfunction Message(subject, recipient, content){\n\
  \    this.subject = subject;\n    this.recipient = recipient;\n    this.content\
  \ = content;\n}\n```\n\n现在，如果我们想创建这个 `Message` 对象的新实例，我们可以调用构造器函数，同时使用 `new` 关键字。在调用旨在充当构造器的函数时，使用\
  \ `new` 是必不可少的。\n\n```\nvar myEmail = new Message('Javascript is cool', 'you@gmail.com',\
  \ 'Creating objects is simple');\n```\n\n这让我们更进一步：我们能够像以前一样访问属性，但我们现在有了对象及其属性的定义。\n\
  \n### 创建方法\n\n我们可以对前面的例子进行扩展，为对象添加方法。方法允许我们访问对象内部的变量、改变对象的状态，或对对象执行操作。通过在“构造器”函数内部创建一个函数来添加方法。\n\
  \n```\nfunction Message(subject, recipient, content){\n    this.subject = subject;\n\
  \    this.recipient = recipient;\n    this.content = content;\n\n    //暴露方法\n  \
  \  this.showMessage = showMessage;\n\n    function showMessage(){\n        console.log('To:\
  \ ' + recipient + ' Subject: ' + subject + ' Message: ' + content);\n    }\n}\n\
  ```\n\n现在我们可以轻松调用这个方法，它会将消息结构打印到控制台。\n\n```\nvar myEmail = new Message('Javascript\
  \ is cool', 'you@gmail.com', 'Creating objects is simple');\nmyEmail.showMessage();\n\
  ```\n\n请注意，在添加函数之前，我们有一行代码将 `showMessage` 方法暴露为这个对象的一部分。没有这行代码，执行上述代码将导致以下错误：\n\n\
  ```\nTypeError: Object #<Message> has no method 'showMessage'\n```\n\n不过，你可能希望这样做来保持方法的私有性，使其仅在对象内部使用，而不对对象的调用者开放。\n\
  \n### JavaScript 原型\n\n你经常会听到 JavaScript 是基于原型的，而不是基于类的。这仅仅意味着，虽然不存在类，但你仍然可以通过克隆作为原型的对象来实现代码复用和继承。\n\
  \n每一个 JavaScript 函数都有一个 `prototype` 属性，默认情况下它没有被赋予任何内容。当属性和方法被附加到这个属性上时，它们将对该函数的所有实例可用。让我们看看如何利用这一点，通过\
  \ `prototype` 属性为我们之前创建的 `Message` 对象添加 `show` 方法。\n\n```\nfunction Message(subject,\
  \ recipient, content){\n    this.subject = subject;\n    this.recipient = recipient;\n\
  \    this.content = content;\n}\n\nMessage.prototype.show = function(){\n    console.log('To:\
  \ ' + this.recipient + ' Subject: ' + this.subject + ' Message: ' + this.content);\n\
  };\n\nvar myEmail = new Message('Javascript is cool', 'you@gmail.com', 'Prototype\
  \ is useful');\nmyEmail.show();\n```\n\n可以使用 `prototype` 属性添加任意数量的函数和属性。如果你检查 `Message.prototype`\
  \ 的内容，你会看到 `Message` 有一个构造器、一个 `show` 方法，以及 `__proto__` 属性（目前可以忽略它）。\n\n```\n> Message.prototype\n\
  Message {show: function}\n    constructor: function Message(subject, recipient,\
  \ content){\n    show: function (){\n    __proto__: Object\n```\n\n值得注意的是我们刚刚讨论过的\
  \ `prototype` 属性与 `prototype` 属性之间的区别。后者适用于已创建的对象实例，其值会指定对象的父类或类型。\n\n在我们之前的例子中，`myEmail`\
  \ 的 `prototype` 属性的值是 `Message.prototype`。任何由构造器函数创建的对象都将继承该构造器。但是，当使用对象字面量模式创建对象时，你会注意到其原型将是\
  \ `Object.prototype`。\n\n### 封装\n\n当你构建一个对象模型时，会有一些通用功能需要暴露给所创建的特定对象的每个实例。例如，你期望能够发送和展示任何消息。所以，让我们基于最初的\
  \ `Message` 示例进行构建，来说明如何通过组合使用构造器/原型模式来实现这一点。\n\n为方便起见，以下是 `Message` 对象的构造器：\n\n\
  ```\nfunction Message(subject, recipient, content){\n    this.subject = subject;\n\
  \    this.recipient = recipient;\n    this.content = content;\n}\n```\n\n现在，我们不必单独定义原型的每个部分，而是可以使用以下简写方式将构造器和多个方法赋给\
  \ `Message` 对象：\n\n```\nMessage.prototype = {\n    constructor: Message,\n    sendMessage:\
  \ function(){\n        console.log('Sending message to ' + this.recipient);\n  \
  \  },\n    show: function(){\n        console.log('To: ' + this.recipient + ' Subject:\
  \ ' + this.subject + ' Message: ' + this.content);\n    }\n};\n```\n\n`Message`\
  \ 对象的完整定义现在集中在一个地方，并且相同的方法对我们创建的所有 `Message` 实例都是可用的。每个创建的消息都可以拥有自己的实例属性，这些属性通过构造器传入。\n\
  \n```\nvar workMessage = new Message('Work complete', 'boss@mycorp.com', 'My work\
  \ is done here');\nvar socialMessage = new Message('Time to go out', 'friend@gmail.com',\
  \ 'Finished work now.');\nworkMessage.send();\nsocialMessage.send();\n```\n\n\n\n\
  ### 使用原型实现继承\n\n继承是面向对象代码库的重要优势之一，它允许你在一个对象中提供基础行为，供其他对象使用和扩展。JavaScript 通过 `prototype`\
  \ 属性提供了继承机制。\n\n为了简单说明这种继承机制的工作原理，我们先看看如何创建一个 `Animal` 的基础定义，并为其添加 `talk` 方法：\n\n\
  ```\nfunction Animal(name){\n    this.name = name;\n}\n\nAnimal.prototype.talk =\
  \ function(){\n    console.log(this.phrase);\n}\n```\n\n现在，我们创建一个 `Dog` 对象，该对象带有\
  \ `phrase` 属性。\n\n```\nfunction Dog(phrase){\n    this.phrase = phrase;\n}\n```\n\
  \n接下来，我们将 `Dog` 的原型设置为 `Animal`。这样它就能继承 `Animal` 对象提供的所有属性和方法。\n\n```\nDog.prototype\
  \ = new Animal();\n```\n\n创建一个 `Dog` 对象的新实例，并调用由 `Animal` 对象提供的 `talk` 方法，控制台将输出\
  \ `bark`。\n\n```\nvar myDog = new Dog('bark');\nmyDog.talk();\n```\n\n我们也可以通过添加下面这条语句，确保\
  \ `Dog` 的实例使用正确的构造函数，达到与之前相同的效果：\n\n```\nDog.prototype.constructor = Dog;\n```\n\
  \n使用继承时，你通常还需要能够调用父类构造函数。这可以通过始终指向父类的 `constructor` 属性来实现。这样就能确保 `name` 属性被正确设置。\n\
  \n```\nfunction Dog(phrase){\n    this.phrase = phrase;\n    this.constructor('Dog');\n\
  }\n```\n\n### 重写方法\n\n当子类需要重写父类方法时，也需要应用类似的模式。这通常发生在你需要在继承的基础上提供额外功能时。借助任意 `Function`\
  \ 对象自带的 `.call` 方法，在 JavaScript 中实现这一点非常直接。下面我们通过扩展 `talk` 方法的功能来演示。\n\n```\nDog.prototype.talk\
  \ = function(){\n    console.log('The dog says');\n    Animal.prototype.talk.call(this);\n\
  }\n```\n\n调用父类方法时，你可以传入另一个对象作为其上下文（context），这里我们将 `Dog` 对象作为上下文。你还可以在 `this` 声明之后，传递该方法所需的任何参数。\n\
  \n在上面的父类方法调用中，我们需要知道父类是 `Animal.prototype`。通过记录父类对象，我们可以让代码更优雅。\n\n```\nDog.prototype\
  \ = new Animal();\nDog.prototype.constructor = Dog;\n\n//定义父类属性\nDog.prototype.parent\
  \ = Animal.prototype;\n\nDog.prototype.talk = function(){\n    console.log('The\
  \ dog says');\n    //使用父类属性调用方法\n    this.parent.talk.call(this);\n}\n```\n\n###\
  \ 原型链\n\n当像这样的“子类”调用任何方法或属性时，JavaScript 会沿着原型链向上查找，直到找到对应的值。如果当前对象没有定义该方法，则会检查其父对象，以此类推，直到到达所有对象的根：`Object`。\n\
  \n运行以下代码将执行 `Object.toString()` 方法，因为原型链中没有其他定义，但 `Object` 中存在该定义。\n\n```\nmyDog.toString();\n\
  ```\n\n### 寄生组合式继承模式\n\n到目前为止，我们采用的继承方式相当直接。不过，我们可以在 JavaScript 代码库中创建一个 `inheritPrototype`\
  \ 函数，以提供更优雅的继承方式。在讨论这个函数之前，我们首先需要了解 JavaScript 已有的 `Object.create()` 方法。\n\n####\
  \ Object.create\n\n`Object.create` 最初由 Douglas Crockford 编写，后来成为了 JavaScript 语言的一部分。该方法允许你根据作为参数传入的原型创建一个新对象，同时还可以传入可选的属性描述符。\n\
  \n创建一个简单的 `Object` 来继承 `Animal` 对象的所有定义，非常简单：\n\n```\nvar dog = Object.create(Animal.prototype);\n\
  ```\n\n之后可以给 `dog` 对象添加额外的属性。或者，你也可以使用属性描述符参数。属性描述符包含属性的名称、其值的定义，以及该属性是否可以被修改。\n\
  \n```\nvar dog = Object.create(Animal.prototype, {\n    'legs': {value: 4, writable:\
  \ true},\n    'barks': {value: true, writeable: false}\n});\n```\n\n总之，使用 `Object.create`\
  \ 实质上是传入你想要继承的对象。请注意，`Object.create` 是在 ECMAScript 5.0/JavaScript 1.8.5 中引入的。\n\n\
  #### inheritPrototype\n\n`inheritPrototype` 函数的核心思想是，传入父对象和子对象，该函数将让子对象继承父对象的所有内容。\n\
  \n```\nfunction inheritPrototype(childObject, parentObject){\n    var parentCopy\
  \ = Object.create(parentObject.prototype);\n    parentCopy.constructor = childObject;\n\
  \    childObject.prototype = parentCopy;\n}\n```\n\n上面的代码看起来可能有些复杂，但逐行阅读还是很容易理解的。\n\
  \n首先，创建父对象的一个副本，该副本包含了 `parentObject` 的所有内容。这个副本在我们复制过程中用作临时对象；最终，这个 `parentCopy`\
  \ 实际上会作为子对象的原型使用。\n\n第二行明确表示，这个临时对象的构造函数将是子对象的构造函数。最后，将 `childObject` 的原型设置为 `parentCopy`。至此，`childObject`\
  \ 就继承了 `parentObject` 的所有内容。\n\n现在，我们可以创建一个 `Dog` 对象，首先定义其构造函数，然后使用我们的 `inheritPrototype`\
  \ 函数。\n\n```\n//定义 Dog 构造函数\nfunction Dog(phrase){\n    this.phrase = phrase;\n\
  }\n\n//设置 Dog 对象继承自 Animal\ninheritPrototype(Dog, Animal);\n```\n\n在此之后，可以给 `Dog`\
  \ 对象添加新的属性和方法。如果在使用 `inheritPrototype` 函数之前定义了这些内容，由于复制过程的存在，这些额外的定义将会被覆盖。\n\n###\
  \ 控制方法和属性的访问权限\n\n使用原型时，所有添加的属性和方法对任何调用者来说都是可访问的。但是，有时你可能希望隐藏某些属性，只在对象内部使用特定的方法，而不是对外暴露。\n\
  \n私有成员可以通过不将其包含在原型上或不使用 `this` 暴露它们来创建。\n\n以 `Message` 对象为例。假设我们希望发送安全消息，并且拥有一个用于发送消息的私钥。\n\
  \n```\nfunction Message(subject, recipient, content){\n    //私有属性\n    var privateKey\
  \ = '11111';\n    \n    //私有方法\n    function encryptMessage(content){\n        return\
  \ content || privateKey;\n    }\n    \n    this.subject = subject;\n    this.recipient\
  \ = recipient;\n    this.content = content;\n    \n    //暴露方法\n    this.showMessage\
  \ = showMessage;\n    function showMessage(){\n        console.log('To:' + recipient\
  \ + 'Subject: ' + subject + 'Message:' + content);\n    }\n    \n    this.sendMessage\
  \ = sendMessage;\n    //使用私有方法的公有方法\n    function sendMessage(){\n        console.log(encryptMessage(this.content));\n\
  \    }\n}\n```\n\n虽然这个例子说明了要点，但请记住 JavaScript 是一种解释型语言，任何人都可以通过查看源代码看到这个密匙。在实际应用中，编译后的服务器端代码才会处理这类机密数据。\n\
  \n\n\n### 提供命名空间\n\n在创建任何稍具规模的代码库时，命名空间对于避免对象名称冲突以及使代码导航更加便捷都至关重要。\n\n`Message`\
  \ 对象就是一个很容易发生对象冲突的例子。`Message` 并未明确地与电子邮件、短信或推特相关联。因此，加入一个文档欠佳项目的开发人员可能会为了不同目的创建自己的\
  \ `Message` 定义。\n\n为了实际演示这一点，让我们为 `Message` 创建一个命名空间，其形式为 `com.apress.chapterone`。命名空间的每个部分都必须按顺序定义。\n\
  \n```\nvar com = com || {};\n```\n\n```\ncom.apress = com.apress || {};\n```\n\n\
  ```\ncom.apress.chapterone = com.apress.chapterone || {};\n```\n\n`Message` 的定义会随之改变，以利用命名空间的各个部分。\n\
  \n```\ncom.apress.chapterone.Message = function Message(\n```\n\n现在，使用 `Message`\
  \ 对象时需要遵循如下命名空间：\n\n```\nvar myMessage = new com.apress.chapterone.Message(\n```\n\
  \n这可能是 JavaScript 现有的最简单的命名空间管理方法，但它也是最有效且最容易理解的方法。\n\n## JavaScript 面向对象框架\n\n\
  虽然前面的内容让你领略了 JavaScript 面向对象编程的复杂性，但包括 Backbone 在内的许多库都提供了实用工具和模式，使程序员能更轻松地在 JavaScript\
  \ 中实现面向对象概念。在此，我们探讨一下主要的几个框架，不过，在大多数情况下，Backbone 应该就够用了。\n\n### PrototypeJS\n\n\
  Prototype.js ([`http://prototypejs.org/`](http://prototypejs.org/)) 目前版本为 1.7.1，它提供了更自然的方式来定义类和处理继承。不要将此与原型语言特性混淆，该库还提供了许多其他有用的功能，比如编程快捷方式和\
  \ Ajax 抽象，以确保跨浏览器兼容性。\n\n要在代码中使用 PrototypeJS，只需下载该库，并在你自己的源代码之前用 script 标签将其引入即可。\n\
  \n创建类非常简单，通过 `Class.create` 方法传入属性即可。\n\n```\nvar Animal = Class.create({\n    talk:\
  \ function(phrase){\n        console.log(phrase);\n    },\n    move : function(){\n\
  \        console.log('Animal moving');\n    }\n});\n```\n\nPrototypeJS 的真正强大之处在于其实现子类化的方式。`create`\
  \ 方法允许你将想要继承的类作为第一个参数指定。此外，每个函数都可以通过使用 `$super` 参数进行细化，该参数指向父类中该函数的实现。\n\n```\n\
  var Dog = Class.create(Animal,{\n    talk: function($super, message){\n        console.log('Dog\
  \ says');\n        $super();\n    }\n});\n```\n\n仅这些小小的补充就为 JavaScript 中的继承提供了一种更简洁的方法。\n\
  \n### MooTools\n\nMooTools ([`www.mootools.net`](http://www.mootools.net/)) 是另一个紧凑型\
  \ JavaScript 框架，它提供了一些面向对象机制以及类似 Prototype.js 的 DOM 和 Ajax 相关功能。一些开发者可能会觉得 MooTools\
  \ 更熟悉，因为它引入了类似于 Java 编程语言的 `Extends` 和 `Implements` 概念。\n\n创建类的方式也更接近 Java，因为 MooTools\
  \ 使用 `new` 关键字来创建。\n\n```\nvar Animal = new Class({\n    initialize: function(name){\n\
  \        this.name = name;\n    },\n    talk : function(phrase){\n        console.log(phrase);\n\
  \    }\n});\n```\n\n`initialize` 是一个特殊函数，充当类的构造函数，因此创建新的 `Animal` 可以使用以下方式实现：\n\n\
  ```\nvar animal = new Animal('Cow');\n```\n\n扩展基类并调用父类构造函数也非常简单。\n\n```\nvar Dog\
  \ = new Class({\n    //定义继承关系\n    Extends: Animal,\n    initialize: function(name,\
  \ phrase){\n        //调用父类构造函数\n        this.parent(name);\n    }\n});\n```\n\n\
  定义 implements 关系遵循类似的模式，其中 `initialize` 函数可以省略。\n\n### Backbone.js\n\n幸运的是，Backbone.js\
  \ 提供了足够的面向对象概念，使你无需再使用 Prototype.js 或 MooTools 等任何额外库。\n\n在本书后续章节中，我们将看到如何轻松地扩展任何对象，以及如何在创建新的对象实例时利用\
  \ `initialize` 函数充当构造函数。\n\n"
- '# 总结


  本章概述了 JavaScript 基础知识，重点介绍了如何应用面向对象编程概念。现在，你应该对原型语言特性有了清晰的理解，并对支持继承等特性的复杂性有了一定的认识。至少，你会懂得
  Backbone 在消除与面向对象编程相关的所有样板代码方面有多大帮助。


  掌握了这些知识，理解 Backbone 的工作原理就会容易得多。在接下来的章节中，你将看到 Backbone 在支持面向对象概念以及创建易于管理的代码库方面提供了多大的帮助。


  '
- "# 3. Backbone 模型与集合\n\n## 摘要\n\n任何 Backbone.js 应用的模型层都有两个主要部分：数据的表示（`Backbone.Model`）和将数据分组为集合（`Backbone.Collections`）。理解这两个部分各自的工作原理以及它们之间的交互方式，将使你能够为你的\
  \ Backbone 应用创建一个结构良好的数据层。\n\n任何 Backbone.js 应用的模型层都有两个主要部分：数据的表示（`Backbone.Model`）和将数据分组为集合（`Backbone.Collections`）。理解这两个部分各自的工作原理以及它们之间的交互方式，将使你能够为你的\
  \ Backbone 应用创建一个结构良好的数据层。\n\n> 注意：在浏览本章节时，当你使用代码示例时，可以简单地加载第 1 章的 `index.html`\
  \ 文件，并使用 Chrome 开发者控制台来尝试这些代码片段。由于你已经加载了 Backbone、Underscore 和 jQuery，所有这些代码片段都能正确执行。\n\
  \n## 系统设置\n\n在进一步深入之前，你需要做一些事情来确保你的系统能正常工作。首先，所有代码都应通过 Apache Web 服务器来执行，而不能仅仅从文件系统运行。在我的示例中，在\
  \ XAMPP 安装目录的 `htdocs` 下有一个名为 `backbone` 的文件夹。当从此服务器提供 `index.html` 服务时，访问的 URL\
  \ 是 [`http://localhost/backbone/index.html`](http://localhost/backbone/index.html)。\n\
  \n`index.html` 的结构应遵循前一章的样式。确保你已经包含了 Backbone、Underscore 和 jQuery 库，并将本章中展示的任何 JavaScript\
  \ 代码放在文件末尾的 script 元素内。\n\n你还会注意到，对于任何后端 API 调用，我都使用了 Node.js。Node.js 可以从 [`http://nodejs.org`](http://nodejs.org/)\
  \ 下载，在设置我们将在“与服务器交换数据”部分创建的 `server.js` 文件之前，你应确保本地安装正常工作。\n\n最后，当遇到问题时，别忘了使用 Chrome\
  \ 开发者工具；它总是能提供缩小 JavaScript 代码中错误范围的最佳机会。\n\n\n\n## Backbone 模型\n\n每个应用程序都始于对模型的定义。模型是需要在应用中操作和呈现的数据。如前面章节所述，模型是数据驻留的层级，通常包含多个对象。通常，你应该将问题领域分解为单个元素，并将每个元素描述为一个模型对象。\n\
  \n要在 Backbone 中创建一个模型对象，你需要使用 `Backbone.Model`。正如你将看到的，对于你创建的所有 Backbone 对象，你将使用\
  \ `.extend` 方法来创建你自己的类版本，如以下代码所示：\n\n```\nMyModel = Backbone.Model.extend({\n\n\
         //对象属性将放在这里\n\n});\n```\n\n该库中的所有对象都有这个 `Backbone` 命名空间，因此在使用 Backbone 对象时，这一点总是非常清晰。\n\
  \n在实际应用中，你很可能永远不会以这种方式创建模型，而是会传递属性来正确构造你的对象。在前面的代码片段中，空括号（`{}`）表示一个对象字面量。这是你希望在模型中可用的所有属性和函数所在的位置。\n\
  \n> **注意**：对象字面量包含一系列以逗号分隔的定义，形式为 `key : value`，其中 `value` 可以是一个函数或另一个对象。\n\n###\
  \ 构造函数\n\n在创建新的模型对象时，你可能希望在构造时执行某些行为，例如设置不同的处理程序或在模型中设置一些初始状态。要在 Backbone 中实现这一点，只需在创建模型对象时定义一个\
  \ `initialize` 函数。\n\n为了演示这个 `initialize` 函数的作用，让我们创建一个简单的 `Book` 对象，在对象创建时向控制台输出一行信息。\n\
  \n```\nBook = Backbone.Model.extend({\n\n     initialize: function(){\n\n           console.log('创建了一本新书');\n\
  \n     }\n\n});\n```\n\n一旦我们创建了 `Model` 对象的新实例，就会调用这个 `initialize` 函数。在这个例子中，当创建新的\
  \ `Book` 对象时，我们将在控制台中看到一行输出：“创建了一本新书”。\n\n```\nvar myBook = new Book();\n```\n\n\
  模型的另一个常见需求是拥有一些可用的默认属性。你可能希望这样做，以便未在对象创建时传递的可选参数具有一些定义。在 Backbone 中，这是通过使用 `defaults`\
  \ 对象字面量来完成的。\n\n```\nBook = Backbone.Model.extend({\n\n    initialize: function(){\n\
  \n          console.log('创建了一本新书');\n\n    },\n\ndefaults: {\n\n               name:\
  \ '书名',\n\n               author: '佚名'\n\n}\n\n});\n```\n\n现在，当创建对象时，每个实例都会获得这些默认值。\n\
  \n### 模型属性\n\n由于数据是拥有模型的主要原因，我们首先关注属性。本节介绍使用 `Backbone.Model` 时所有可用的与属性相关的操作。\n\n\
  #### 获取属性值\n\n任何模型对象中的属性都可以通过使用 `.get` 函数并传入你想要访问的属性名称来轻松获取。因为我们使用的是简单的默认值，所以在你初始化\
  \ `Book` 对象后，下面这行代码将输出“书名”。\n\n```\nconsole.log(myBook.get('name'));\n```\n\n在对象创建期间，可以传入模型中属性的值，以便每个实例都可以是唯一的。\n\
  \n```\nvar thisBook = new Book({name : '开始使用 Backbone',\n\n                                author:\
  \ '詹姆斯·苏格鲁'});\n```\n\n现在，当你检索任一属性的值时，传入的值将替代默认值被使用。\n\n```\nconsole.log(thisBook.get('name')\
  \ + ' 作者 ' +        thisBook.get('author'));\n```\n\n你还可以使用 `.attributes` 属性来获取表示所有模型数据的\
  \ JSON 对象。\n\n```\nconsole.log(thisBook.attributes); // 所有属性的 JSON 表示\n```\n\n####\
  \ 更改属性值\n\n在构造函数之外更改属性值的方式类似，使用 `set('<变量名>', <值>)` 的函数调用结构。例如，要更改书名，请使用以下代码：\n\n\
  ```\nthisBook.set('name', '开始使用 Backbone.js');\n```\n\n你可以像前面演示的那样，以相同的方式为你的对象添加新属性。\n\
  \n```\nthisBook.set('year', 2013);//创建一个名为 year 的新属性\n```\n\n#### 删除属性\n\n你可能会发现需要从模型中删除你不再使用的属性。在以下示例中，添加了一个新属性，随后将其删除。第二个\
  \ `console.log` 语句返回 `undefined` 作为属性值。\n\n```\nthisBook.set('year', 2013);\n\n\
  console.log('书籍年份 ' + thisBook.get('year'));\n\nthisBook.unset('year');\n\nconsole.log('书籍年份\
  \ ' + thisBook.get('year'));\n```\n\nBackbone 提供了一种更简洁的方式来检查模型中是否存在某个属性，即使用 `.has`\
  \ 函数，该函数返回一个布尔值。\n\n```\n//检查属性是否存在\n\nvar hasYear = thisBook.has('year'); //结果为\
  \ false\n\nvar hasName = thisBook.has('name'); //结果为 true\n\nconsole.log('是否存在名为\
  \ year 的属性  : ' + hasYear);\n\nconsole.log('是否存在名为 name 的属性  : ' + hasName);\n```\n\
  \n你还可以使用 `clear` 函数删除模型中的所有属性。\n\n```\n//创建一个新对象\n\nvar newBook = new Book({name:\
  \ '另一本书', author: '你'});\n\nnewBook.clear();//移除所有属性\n\nconsole.log('是否存在名为 name\
  \ 的属性  : ' + newBook.has('name'));//结果为 false\n```\n\n`unset` 和 `clear` 函数都接受一个额外的\
  \ `options` 对象，你可以在其中添加一个布尔值，指示操作完成后不应从模型触发更改事件。本章后面的“模型事件”部分将解释这些事件如何运作。\n\n```\n\
  thisBook.unset('year', {silent: true});\n```\n\n#### 克隆模型\n\n你可能想要创建 Backbone 模型的完整副本，并保留所有相同的属性。无需担心如何创建深层副本的细节，你可以简单地使用\
  \ `.clone()` 方法来创建一个克隆的模型实例。\n\n```\nvar clonedBook = thisBook.clone();\n```\n\n\
  #### 属性函数参考\n\n表 3-1 描述了可以在 Backbone 模型上执行的最有用的与属性相关的操作。\n\n**表 3-1.** Backbone\
  \ 模型的属性函数\n\n| 操作 | 描述 |\n| --- | --- |\n| `.get(<属性名>)` | 返回具有给定名称的属性值。如果不存在此属性，则返回\
  \ undefined。 |\n| `.set(<属性名>, 属性值)` | 将给定属性的值设置为第二个参数提供的值。如果该属性尚不存在，则使用此值创建一个新属性。\
  \ |\n| `.has(<属性名>)` | 检查模型对象中是否存在给定的属性。 |\n| `unset(<属性名>)` | 如果存在，则从模型中移除一个属性。\
  \ |\n| `clear()` | 移除模型对象中的所有属性。 |\n| `.attributes` | 返回模型中所有属性的 JSON 表示。 |\n| `.clone()`\
  \ | 创建模型的一个新实例，包含所有相同的属性。 |\n\n\n\n#### 为模型添加函数\n\n到目前为止，我们的模型只涉及属性，但你也可以添加自己的函数来处理重复性任务。下面的例子说明了如何包含一个`printDetails`函数来替代目前使用的所有`console.log`语句：\n\
  \n```\nBook = Backbone.Model.extend({\n\n     initialize: function(){\n        \
  \   console.log('一本新书');\n     },\n\n     defaults: {\n           name: '书名',\n\
  \           author: '佚名'\n     },\n\n     printDetails: function(){\n          \
  \ console.log(this.get('name') + ' 作者：' + this.get('author'));\n     }\n\n});\n\
  ```\n\n现在，`Book`对象的所有实例都可以使用这个函数。\n\n```\n//使用 printDetails 函数\nthisBook.printDetails();\n\
  ```\n\n#### 模型事件\n\n虽然我们将在本书后面讨论事件，但有一种对模型至关重要的特定事件类型是**change**事件，当某个属性或一组属性的值被修改时，就会触发此事件。\n\
  \n##### 监听变化\n\n使用 Backbone 的 change 处理器，最简单的方式是监听整个模型的变化。事件处理器通过`.on()`函数添加到 Backbone\
  \ 对象上，该函数接受一个表示处理器类型的字符串，并接受一个函数引用，该函数在变化发生时被执行。\n\n创建这个监听器的最佳时机是在模型的`initialize`函数中。通过修改你现有的代码，你会发现每当调用\
  \ set 时，这个函数都会被触发。\n\n```\nBook = Backbone.Model.extend({\n\n     initialize: function(){\n\
  \                 this.on(\"change\", function(){\n                         console.log('模型已改变');\n\
  \                 });\n     },\n\n     defaults: {\n        name: '书名',\n      \
  \  author: '佚名'\n     },\n\nprintDetails: function(){\n        console.log(this.get('name')\
  \ + ' 作者：' + this.get('author'));\n     }\n\n});\n```\n\n你可以通过使用`change:<属性名>`格式而不是`change`来监听特定属性的变化。以下新增内容创建了另一个仅处理`name`属性变化的处理器：\n\
  \n```\ninitialize: function(){\n          this.on(\"change\", function(){\n    \
  \      console.log('模型已改变');\n          });\n\nthis.on(\"change:name\", function(){\n\
  \          console.log('name 属性已改变');\n          });\n\n},\n```\n\n我们之前提到，`.set`函数允许一个可选参数用于静默更新。如果使用了这个参数，那么\
  \ change 处理器将不会被调用。\n\n```\n//设置变量（期望调用 change 处理器）\nthisBook.set('name', '不同的书');\
  \ // change 处理器被调用\nthisBook.set('name', '不同的书', {silent:true});// change 处理器未被调用\n\
  ```\n\n##### 查明哪些内容发生了变化\n\nBackbone 包含许多属性，用于跟踪模型中的变化。如果你使用全局的 change 处理器，这将是查看当前状态的一个非常有用的方法。\n\
  \n你可以使用`hasChanged('<属性名>')`来检查某个单独的属性是否被修改。\n\n```\nthis.on(\"change\", function(){\n\
  \   console.log('检测到模型变化：');\n    if(this.hasChanged('name')){\n             console.log('name\
  \ 已改变');\n    }\n\n    if(this.hasChanged('year')){\n            console.log('year\
  \ 已改变')\n    }\n\n});\n```\n\n你可以使用`.changed`属性获取所有已更改属性的集合。\n\n```\nBook = Backbone.Model.extend({\n\
  \n     initialize: function(){\n          this.on(\"change\", function(){\n    \
  \    console.log('已更改的属性：' + JSON.stringify(this.changed));\n        });\n\n},\n\
  ```\n\n你还可以使用`.previousAttributes()`函数获取所有属性的先前状态集合。下面这行代码也可以添加到 change 处理器中：\n\n\
  ```\nconsole.log('先前的属性：' + JSON.stringify(this.previousAttributes()));\n```\n\n\
  最后，你可以使用`.previous('<属性名>')`来检索特定属性的先前值。\n\n```\nif(this.hasChanged('name')){\n\
  \      console.log('name 已从 ' + this.previous('name') + ' 变为 ' + this.get('name'));\n\
  }\n```\n\n##### 属性变更参考\n\n表 3-2 描述了与模型中属性变更相关的最常用操作。\n\n**表 3-2.** Backbone 模型中与属性变更相关的函数\n\
  \n| 操作 | 描述 |\n| --- | --- |\n| `.on('change', <函数>)` | 提供一个全局的 change 处理器，响应模型中任何属性的变化\
  \ |\n| `.on('change:<属性名>', <函数>)` | 监听特定属性的变化 |\n| `.hasChanged(<属性名>)` | 如果自上次\
  \ change 事件以来该属性已更改，则返回`true` |\n| `.previous(<属性名>)` | 返回特定属性的先前值 |\n| `.changed`\
  \ | 返回模型中所有已更改属性的完整集合 |\n\n### 模型验证\n\nBackbone 为模型数据提供了一种验证机制，这意味着你可以将所有判断模型状态是否正确的逻辑都放在模型内部，而不是放在外部的\
  \ JavaScript 或表单处理代码中。\n\n如果你提供了一个验证方法，那么每次调用`.save`函数时，以及在每次 set/unset 操作中（当提供了`{validate:true}`作为可选参数时），该方法都会运行。\n\
  \n假设我们的`Book`模型要求必须存在 name，并且 year 必须在 2000 年之后。针对这些规则的验证方法如下所示：\n\n```\nBook =\
  \ Backbone.Model.extend({\n\n           initialize: function(){\n          },\n\n\
  defaults: {\n    },\n\n    printDetails: function(){\n   },\n\n    validate: function(attrs){\n\
  \          if(attrs.year < 2000){\n                  return '年份必须在 2000 年之后';\n\
  \          }\n\n          if(!attrs.name){\n                  return '必须提供书名';\n\
  \          }\n\n   }\n\n});\n```\n\n如果在操作模型时违反了这些规则，操作将无法更改属性值。\n\n```\n//尝试将 year\
  \ 设置为 2000 年之前\nthisBook.set('year', 1999, {validate: true});\nconsole.log('检查 year\
  \ 是否更改：' + thisBook.get('year'));\n\n//尝试从模型中移除 name\nthisBook.unset('name', {validate:\
  \ true});\nconsole.log('检查 name 是否被移除：' + thisBook.get('name'));\n```\n\n当检测到验证错误时，会触发一个事件。通过添加一个\"\
  invalid\"事件处理器，你可以针对验证错误提供反馈。与所有事件处理器一样，这应该添加到你的`initialize`函数中。\n\n```\nBook =\
  \ Backbone.Model.extend({\n\ninitialize: function(){\n          this.on(\"invalid\"\
  , function(model, error){\n                  console.log(\"**验证错误：** \" + error\
  \ + \"**\");\n          });\n```\n\n如果没有验证标志，验证函数将不会在 set 时执行。但是，你可以随时使用`isValid()`函数检查模型是否处于有效状态。\n\
  \n```\n//检查模型是否有效\nconsole.log('模型是否有效：' + thisBook.isValid());\n\n//不使用 validate\
  \ 标志来违反验证规则\nthisBook.set('year', 1998);\n\n//检查模型是否有效\nconsole.log('模型是否有效：' +\
  \ thisBook.isValid());\n```\n\n### 与服务器交换数据\n\nBackbone 模型可用的最后一项功能涉及如何从提供 REST\
  \ API 的服务器存储数据以及向其发送数据。在我们讨论 Backbone 相关的机制之前，首先设置一个简单的后端来为我们的 API 调用提供响应。\n\n**注意**\n\
  \n请记住，`Backbone.Collection`负责处理大部分 RESTful 操作，而不需要对每个模型对象都进行调用。为了说明底层机制，我们将首先查看模型操作。\n\
  \n\n\n### Node.js 服务端\n\n既然我们都在使用 JavaScript，我将简要介绍一个使用 Node.js 的简单服务器，但你也可以自由选择其他\
  \ REST 服务器实现。本书的重点在于客户端，因此不会过多使用这个服务器。不过，它在演示 Backbone 应用的请求响应时会很有用。\n\n首先，你需要从\
  \ [`http://nodejs.org`](http://nodejs.org/) 安装 Node.js。安装完成后，使用 NPM 包管理器安装 `express`\
  \ 包，这是一个极简的 Node.js Web 应用框架，可以轻松搭建带有 REST API 的简单服务器。\n\n```\nnpm install express\n\
  ```\n\n最后，将以下代码复制到 `server.js` 文件中。从代码中可以看出，它提供了托管在 [`http://localhost:8080/books`](http://nodejs.org/)\
  \ 的一些简单端点。\n\n```\n/**\n * 托管在 localhost:8080/books 的简单 API\n */\nvar express =\
  \ require('express');\nvar app = express();\nvar bookId = 100;\n\nfunction findBook(id){\n\
  \  for(var i =0; i < books.length; i++){\n    if(books[i].id === id){\n      return\
  \ books[i];\n    }\n  }\n  return null;\n}\n\nfunction removeBook(id){\n  var bookIndex\
  \ = 0;\n  for(var i=0; i < books.length; i++){\n    if(books[i].id === id){\n  \
  \    bookIndex = i;\n    }\n  }\n  books.splice(bookIndex, 1);\n}\n\napp.configure(function\
  \ () {\n  // 解析请求体中给出的 JSON 对象\n  app.use(express.bodyParser());\n});\n\nvar books\
  \ = [\n  {id: 98, author: 'Stephen King', title: 'The Shining', year: 1977},\n \
  \ {id: 99, author: 'George Orwell', title: 1949}\n];\n\n/**\n * HTTP GET /books\n\
  \ * 应返回图书列表\n */\napp.get('/books', function (request, response) {\n  response.header('Access-Control-Allow-Origin',\
  \ '*');\n  console.log('In GET function ');\n  response.json(books);\n});\n\n/**\n\
  \ * HTTP GET /books/:id\n * id 是你要获取的图书的唯一标识符\n * 应返回指定 id 的任务，否则返回 404\n */\napp.get('/books/:id',\
  \ function (request, response) {\n  response.header('Access-Control-Allow-Origin',\
  \ '*');\n  console.log('Getting a  book with id ' + request.params.id);\n  var book\
  \ = findBook(parseInt(request.params.id,10));\n  if(book === null){\n    response.send(404);\n\
  \  }\n  else{\n    response.json(book);\n  }\n});\n\n/**\n * HTTP POST /books/\n\
  \ * 此请求的请求体包含你要创建的图书。\n * 成功时返回 200\n */\napp.post('/books/', function (request,\
  \ response) {\n  response.header('Access-Control-Allow-Origin', '*');\n  var book\
  \ = request.body;\n  console.log('Saving book with the following structure ' + JSON.stringify(book));\n\
  \  book.id = bookId++;\n  books.push(book);\n  response.send(book);\n});\n\n/**\n\
  \ * HTTP PUT /books/\n * id 是你要更新的图书的唯一标识符。\n * 如果该 id 的图书不存在，则返回 404。\n */\napp.put('/books/:id',\
  \ function (request, response) {\n  response.header('Access-Control-Allow-Origin',\
  \ '*');\n  var book = request.body;\n  console.log('Updating  Book ' + JSON.stringify(book));\n\
  \  var currentBook = findBook(parseInt(request.params.id,10));\n  if(currentBook\
  \ === null){\n    response.send(404);\n  }\n  else{\n    //在本地保存图书\n    currentBook.title\
  \ = book.title;\n    currentBook.year = book.year;\n    currentBook.author = book.author;\n\
  \    response.send(book);\n  }\n});\n\n/**\n * HTTP DELETE /books/\n * id 是你要删除的图书的唯一标识符。\n\
  \ * 如果该 id 的图书不存在，则返回 404。\n */\napp.delete('/books/:id', function (request, response)\
  \ {\n  console.log('calling delete');\n  response.header('Access-Control-Allow-Origin',\
  \ '*');\n  var book = findBook(parseInt(request.params.id,10));\n  if(book === null){\n\
  \    console.log('Could not find book');\n    response.send(404);\n  }\n  else\n\
  \  {\n    console.log('Deleting ' + request.params.id);\n    removeBook(parseInt(request.params.id,\
  \ 10));\n    response.send(200);\n  }\n  response.send(200);\n});\n\n// 额外的设置以允许\
  \ CORS 请求\nvar allowCrossDomain = function(req, response, next) {\n  response.header('Access-Control-Allow-Origin',\
  \ \"http://localhost\");\n  response.header('Access-Control-Allow-Methods', 'OPTIONS,\
  \ GET,PUT,POST,DELETE');\n  response.header('Access-Control-Allow-Headers', 'Content-Type');\n\
  \  if ('OPTIONS' == req.method) {\n    response.send(200);\n  }\n  else {\n    next();\n\
  \  }\n};\n\napp.configure(function() {\n  app.use(allowCrossDomain);\n});\n\n//\
  \ 在 8080 端口启动应用\napp.listen(8080);\n```\n\n要启动服务器，在命令行中使用 `node server.js`。这个服务器虽然非常简单，但足以让\
  \ Backbone 的持久化调用正确执行。\n\n### 标识符\n\nBackbone 模型有三个属性用于在与服务器进行数据交换时唯一标识它们：`id`、`cid`\
  \ 和 `idAttribute`。\n\n`id` 属性是一个唯一的字符串或整数值，类似于关系数据库中的主键。在从集合中检索模型时，`id` 属性非常有用，它也用于构建模型\
  \ URL 的一部分。\n\n`cid` 属性是 Backbone 在模型首次创建时自动生成的；当模型尚未保存到服务器且没有其真实 ID 时，它可以作为唯一标识符使用。\n\
  \n有时，你从后端检索的模型会使用不同的唯一键。例如，服务器可能使用 ISBN 作为图书的唯一标识符，或者用户 ID 字段可能是保存用户模型时使用的标识符。`idAttribute`\
  \ 属性允许你在该键与模型中的 ID 之间建立映射，这意味着服务器将使用该属性来填充 ID。\n\n\n好的，作为一名高级文档工程师和翻译员，我将遵循您的说明，将给定的英文文本翻译成中文，并保留所有\
  \ Markdown 格式。\n\n\n#### 保存模型\n\n`save` 函数调用操作将模型保存到服务器，并调用 `Backbone.sync` 函数。我们稍后会看到如何替换\
  \ `sync` 函数以提供保存模型的其他方式，但现在我们先遵循 Backbone 内置的默认行为。\n\n现在我们已经有了一个可以连接的后端服务，可以设置 `Model`\
  \ 对象的 `urlRoot` 属性。\n\n```\nBook = Backbone.Model.extend({\n    urlRoot: 'http://localhost:8080/books/',\n\
  ```\n\n这个 URL 告诉 Backbone 在执行任何需要后端服务响应的操作时要指向哪里。由于我们的 node.js 服务器运行在 8080 端口，并且我们设置了从\
  \ `/books/` 响应请求的端点，因此我们的 URL 构造方式如上代码清单所示。\n\n当 `id` 属性尚未设置并且调用了 `save` 时，模型将在后端\
  \ REST 服务上触发一个创建操作（HTTP POST），而当指定了 ID 时，将使用更新（HTTP PUT）操作。这是一种简单的方法，确保无论您的模型是新创建的还是自上次从服务器检索后经过编辑的，都可以使用同一个\
  \ `save` 函数。\n\n`save` 函数可以在不传参的情况下调用，也可以接受您想要持久化到服务器的一组属性，以及一个包含成功和错误情况处理程序的 `options`\
  \ 哈希表。\n\n```\nthisBook.save(thisBook.attributes,\n    {\n        success: function(model,\
  \ response, options){\n            console.log('Model saved');\n            console.log('Id:\
  \ '  + thisBook.get('id'));\n        },\n        error: function(model, xhr, options){\n\
  \            console.log('Failed to save model');\n        }\n    });\n```\n\n在调用远程\
  \ API 端点时，成功和错误处理程序非常重要，因为您无法确定保存模型的调用总会成功。一旦调用完成并返回，将调用相应的回调函数，无论是成功还是错误。不要忘记，调用是异步进行的，因此\
  \ `save` 方法之后的任何代码行都不会等待保存先完成。\n\n`save` 方法将调用由 `Node.js` 服务器提供的以下代码片段：\n\n```\n\
  app.post('/books/', function (request, response) {\n    response.header('Access-Control-Allow-Origin',\
  \ '*');\n    var book = request.body;\n    console.log('Saving book with the following\
  \ structure ' + JSON.stringify(book));\n    book.id = bookId++;\n    response.send(book);\n\
  });\n```\n\n此函数最重要的部分在于它为图书提供了新的 ID，并以 JSON 格式返回了图书对象的新结构。由于此图书对象现在有了一个分配的 ID，任何后续的\
  \ `save` 方法都将在后端触发更新操作。\n\n请记住，如果指定了验证函数，它将在 `save()` 执行期间被调用。如果验证失败，模型将不会发送到服务器。\n\
  \n#### 检索模型\n\n如果您想将模型对象的状态重置为与服务器端相同，可以调用 `fetch()` 函数。同样，此函数接受一个包含成功和错误回调的 `options`\
  \ 哈希表。\n\n```\nthisBook.fetch({\n    success: function(model, response, options){\n\
  \        console.log('Fetch success');\n    },\n    error: function(model, response,\
  \ options){\n        console.log('Fetch error');\n    }\n});\n```\n\n如果 `fetch`\
  \ 函数的执行检测到服务端和客户端的模型存在差异，则会触发一个 change 事件。当您想确保应用程序与后端服务同步，或者需要在应用启动时填充模型对象时，这非常有用。\n\
  \n#### 删除模型\n\n您可能希望执行的最后一个服务器操作是从后端删除模型的删除操作。\n\n```\nthisBook.destroy({\n    success:\
  \ function(model, response, options){\n        console.log('Destroy success');\n\
  \    },\n    error: function(model, response, options){\n        console.log('Destroy\
  \ error');\n    },\n    wait: true\n});\n```\n\n如果模型是新建的并且尚不存在于服务器上，`destroy` 操作将失败。添加\
  \ `wait: true` 选项可确保在模型从客户端上任何包含它的 `Backbone.Collection` 中移除之前，已成功将其从服务器上删除。\n\n\
  #### 解析服务器响应\n\n在调用 `save()` 或 `fetch()` 函数时，您可能希望通过添加额外的属性或移除不必要的属性来解析模型以丰富您的数据模型。您可以通过将\
  \ `parse()` 函数添加到模型定义中来做到这一点。以下示例展示了如何在保存或获取操作后向您的数据模型添加新属性：\n\n```\nBook = Backbone.Model.extend({\n\
  \    parse: function(response, xhr) {\n        response.bookType = 'ebook';\n  \
  \      return response;\n    }\n});\n```\n\n请注意，除了添加新属性，您还可以进行其他更改，以使 API 返回的数据适用于您的前端应用程序，例如更改属性的货币单位。\n\
  \n### 扩展您自己的模型\n\n与任何面向对象语言一样，有时您会希望在模型层内创建层次结构。Backbone 模型的优点之一是其扩展机制，您可以使用它来扩展自己的模型。\n\
  \n您可能还记得，在创建新模型时，需要在创建过程中使用 `Backbone.Model.extend`。\n\n```\nBook = Backbone.Model.extend({\n\
  ```\n\n您可以使用相同的格式进一步扩展它。在下面的例子中，让我们创建一个 `EBook` 模型，通过一个额外的方法来扩展原始的 `Book` 模型：\n\n\
  ```\nEBook = Book.extend({\n    getWebLink: function(){\n        return 'http://www.apress.com/'\
  \ + this.get('name');\n    }\n});\n\nvar ebook = new EBook({name: \"Beginning Backbone\"\
  , author: \"James Sugrue\"});\nconsole.log(ebook.getWebLink());\n```\n\n要调用父类中的函数，您需要使用原型显式地调用它并传入\
  \ `this`，以便当前模型被用作上下文。\n\n```\nEBook = Book.extend({\n    printDetails: function(){\n\
  \        console.log('An ebook');\n        Book.prototype.printDetails.call(this);\n\
  \    }\n});\n```\n\n上一段代码导致在显示 `EBook` 模型中定义的额外打印语句之后，执行来自 `Book` 模型的 `printDetails`\
  \ 函数。如果此函数涉及任何参数，它们将在 `this` 引用之后传递。\n\n稍后我们将看到一些可用的 Backbone 插件，它们会使这种调用变得更简单。\n\
  \n\n\n## Backbone 集合\n\n在上一节中，我们重点讨论了单个模型，但通常 Backbone 应用程序会使用 `Backbone.Collection`\
  \ 来提供有序的模型集合。这样做有一些有用的副作用，例如能够从后端服务器获取整个集合，并监听集合中任意模型的事件。\n\n定义集合时，你总是需要传入包含的模型。延续\
  \ `Backbone.Model` 部分中使用的书籍示例，我们将把书籍集合定义为一个图书馆。\n\n```\n//Define a collection based\
  \ on book\nvar Library = Backbone.Collection.extend({model: Book});\n```\n\n与 `Model`\
  \ 一样，可以在集合的定义中提供一个 `initialize` 方法，该方法会在创建集合的新实例时被调用。这对于设置集合的事件监听器非常有用。\n\n```\n\
  var Library = Backbone.Collection.extend({model: Book,\n        initialize: function(){\n\
  \                console.log('Creating a new library collection');\n        }\n\
  });\n```\n\n当创建一个新的 `Library` 对象时，你会看到 `initialize` 函数中的 `console.log` 语句输出到控制台。\n\
  \n```\nvar myLibrary = new Library();\n```\n\n### 构造函数\n\n创建集合实例时，你可以传入一个模型对象数组来用一些初始内容填充它。\n\
  \n```\nvar bookOne = new Book({name: 'Beginning Backbone', author: 'James Sugrue'});\n\
  var bookTwo = new Book({name: 'Pro Javascript Design Patterns', author:'Dustin Diaz,\
  \ Ross Harmes'});\nvar myLibrary = new Library([bookOne, bookTwo]);\nconsole.log('Library\
  \ contains ' + myLibrary.length + ' books');\n```\n\n`.length` 属性允许你获取集合中当前包含的模型数量。注意，`.size()`\
  \ 函数返回相同的数字。\n\n### 操作集合\n\n由于集合在应用程序的整个生命周期中都会使用，其内容必然会发生变化，因此你需要在构造之后操作集合。虽然可以使用\
  \ `.models` 属性来获取包含的原始模型数组，但还有更实用的工具方法来操作集合。\n\n#### 添加模型\n\n可以使用 `.add` 方法轻松地将新模型添加到集合中。\n\
  \n```\nvar bookThree = new Book({name: 'Pro Node.js for Developers', author: 'Colin\
  \ J. Ihrig'});\nmyLibrary.add(bookThree);\nconsole.log('Library contains ' + myLibrary.length\
  \ + ' books');\n```\n\n`.add` 方法也接受一个书籍数组。\n\n```\nvar bookFour = new Book({name:\
  \ 'Pro jQuery', author: 'Adam Freeman'});\nvar bookFive = new Book({name : 'Pro\
  \ Javascript Performance', author: 'Tom       Barker'});\nmyLibrary.add([bookFour,\
  \ bookFive]);\nconsole.log('Library has ' + myLibrary.length + ' books');\n```\n\
  \n如果传入 `.add` 的模型已经存在于集合中，它将被忽略。但是，如果在调用中包含 `{merge: true}`，则属性将合并到重复的模型中。\n\n```\n\
  myLibrary.add(bookOne, {merge:true});\nconsole.log('Library has ' + myLibrary.length\
  \ + ' books');\n```\n\n注意，当模型被添加到集合时，会触发一个 `add` 事件。\n\n你也可以使用 `.push()` 函数将模型添加到集合的末尾，可以传入一个数组或单个模型，就像\
  \ `.add` 函数一样。\n\n```\nmyLibrary.push(bookFive);\nconsole.log('Library has ' + myLibrary.length\
  \ + ' books');\n```\n\n要执行与 `.push()` 相反的操作，并将模型添加到集合的开头，请使用 `.unshift` 函数。\n\n\
  ```\nmyLibrary.unshift(bookFive);\nconsole.log('Library has ' + myLibrary.length\
  \ + ' books');\n```\n\n#### 移除模型\n\n如你所料，有一个 `.remove` 函数可用于移除单个模型或模型数组。\n\n```\n\
  myLibrary.remove(bookFive);\nconsole.log('Library contains ' + myLibrary.length\
  \ + ' books');\n\nmyLibrary.remove([bookThree, bookFour]);\nconsole.log('Library\
  \ contains ' + myLibrary.length + ' books');\n```\n\n当模型被移除时，会触发一个 `remove` 事件。在监听器中使用的\
  \ `options` 对象可以访问被移除元素的索引。\n\n```\nvar Library = Backbone.Collection.extend({model:\
  \ Book,\n        initialize: function(){\n                this.on(\"remove\", function(removedModel,\
  \ models, options){\n                        console.log('element removed  at '\
  \ + options.index);\n                });\n        }\n});\n```\n\n`.pop()` 函数移除并返回集合中的最后一个模型。\n\
  \n```\nvar lastModel = myLibrary.pop();\n```\n\n要移除集合中的第一个模型，请使用 `.shift()` 函数而不是\
  \ `.pop()`。这也会返回你正在移除的模型。\n\n```\nvar firstModel = myLibrary.shift();\n```\n\n####\
  \ 重置集合\n\n`reset` 函数用于在一次调用中替换集合中的模型集。\n\n```\nmyLibrary.reset([bookOne]);\nconsole.log('Library\
  \ contains ' + myLibrary.length + ' books');\n```\n\n你可以通过调用不带参数的 `reset` 方法来一次性清空集合。\n\
  \n```\nmyLibrary.reset();\nconsole.log('Library contains ' + myLibrary.length +\
  \ ' books');\n```\n\n使用 `reset` 会触发一个单一的 `reset` 事件，而不是一系列的 `remove` 和 `add` 事件。这对性能有好处，因为你的应用程序只需要对重置操作做出一次响应。\n\
  \n#### 智能更新集合\n\n根据 Backbone 官方文档的描述，`set` 函数用于对集合执行智能更新。通过传入一个模型数组，`set` 遵循以下规则：\n\
  \n- 如果模型中尚不存在于集合中，它将被添加。如果提供了 `{add: false}`，则忽略此规则。\n- 如果模型已存在于集合中，则属性将被合并。如果提供了\
  \ `{merge: false}`，则忽略此规则。\n- 如果集合中存在一个不在数组中的模型，它将被移除。如果提供了 `{remove: false}`，则忽略此规则。\n\
  \n以下代码片段展示了如何忽略移除规则：\n\n```\nmyLibrary = new Library([bookOne, bookTwo]);\nconsole.log('Library\
  \ contains ' + myLibrary.length + ' books');\n\nmyLibrary.set([bookTwo], {remove:\
  \ false});\nconsole.log('Library contains ' + myLibrary.length + ' books');\n```\n\
  \n如果没有 `{remove:false}`，第二次计算 `myLibrary.length` 的结果将是 1。\n\n##### 遍历集合\n\n有许多函数可用于对集合进行操作，以便检索单个模型和遍历整个集合。以下部分将详细介绍这些函数。\n\
  \n#### 检索模型\n\n只要你知道了模型的 `id`，就可以使用 `.get` 函数从集合中检索模型。回想一下，在模型与后端服务同步之前，使用的是 `cid`\
  \ 属性。\n\n```\nvar aBook = myLibrary.get('c5');\nconsole.log('Retrieved book named\
  \ ' + aBook.get('name'));\n```\n\n如果没有模型与用作参数的 `id` 或 `cid` 匹配，此函数返回 `undefined`。\n\
  \n如果你不想使用 ID，也可以使用 `.at` 函数，它接受模型在集合中的索引。如果集合未排序，`index` 参数将引用插入顺序。\n\n```\nvar\
  \ anotherBook = myLibrary.at(1);\nconsole.log('Retrieved book named ' + anotherBook.get('name'));\n\
  ```\n\n\n\n##### 遍历集合\n\n尽管你可以使用简单的 `for` 循环来遍历集合，如下所示：\n\n```\n// 一个简单的循环\nfor(var\
  \ i = 0; i < myLibrary.length; i++){\n    var model = myLibrary.at(i);\n    console.log('书\
  \ ' + i + ' 的名字是 ' + model.get('name'));\n}\n```\n\n但 Underscore 提供了一个更优雅的工具函数来帮助遍历集合，即\
  \ `forEach` 函数。\n\n```\n// 使用 forEach\nmyLibrary.forEach(function(model){\n    console.log('书的名字是\
  \ ' + model.get('name'));\n});\n```\n\n### 其他实用方法\n\n充分利用 Backbone 对 Underscore\
  \ 的依赖，`Backbone.Collection` 提供了许多实用方法。其中一些已经在前面章节列出。让我们来探索剩下的函数。\n\n#### 排序集合\n\n\
  使用 `sortBy` 函数，你可以选择一个属性作为依据来对集合进行排序。\n\n```\n// 排序集合\nvar sortedByName = myLibrary.sortBy(function\
  \ (book) {\n   return book.get(\"name\");\n});\nconsole.log(\"排序后的版本：\");\nsortedByName.forEach(function(model){\n\
  \    console.log('书的名字是 ' + model.get('name'));\n});\n```\n\n请注意 `sortBy` 返回的是集合中模型的有序数组表示，它并不会实际改变集合内模型的顺序。\n\
  \n通过使用比较器（comparators），你可以强制一个排序顺序，该顺序将始终用于你的集合。最常用的方法是在集合定义时定义比较器函数。以下示例演示了如何创建一个按书名排序的比较器：\n\
  \n```\nvar Library = Backbone.Collection.extend({model: Book,\n    initialize: function(){\n\
  \        // 初始化函数内容...\n    },\n    comparator:  function(a, b) {\n        return\
  \ a.get('name') < b.get('name') ? -1 : 1;\n    }\n});\n```\n\n现在集合将始终按书名排序。但是，如果你改变了一个模型中某个属性的值，集合不会自动重新排列顺序。相反，可以通过调用集合的\
  \ `sort` 函数来应用顺序。\n\n```\nmyLibrary.at(0).set('name', 'Z');\nmyLibrary.forEach(function(model){\n\
  \    console.log('书的名字是 ' + model.get('name'));\n});\n// 强制排序\nmyLibrary.sort();\n\
  myLibrary.forEach(function(model){\n    console.log('书的名字是 ' + model.get('name'));\n\
  });\n```\n\n请注意，当向集合添加新模型时，排序顺序会重新应用，除非在添加时传入了 `{sort: false}` 选项。\n\n#### 打乱顺序（Shuffle）\n\
  \n如果你需要获取集合中模型的随机化版本，`shuffle()` 函数将返回一个经过打乱算法处理后的模型数组。\n\n```\nvar shuffled = myLibrary.shuffle();\n\
  ```\n\n现在遍历集合将会以不同的顺序展示书籍。\n\n```\nmyLibrary.forEach(function(model){\n    console.log('书的名字是\
  \ ' + model.get('name'));\n});\n```\n\n#### 获取属性列表\n\n有时你可能想要获取集合中某个特定属性的所有实例列表。使用\
  \ `.pluck()` 函数可以轻松实现。\n\n```\nconsole.log('集合中作者列表：');\nvar authors = myLibrary.pluck('author');\n\
  authors.forEach(function(authorName){\n    console.log(authorName)\n});\n```\n\n\
  #### 搜索\n\n基于向搜索函数传递一组键值对，可以使用多种有用的搜索机制。\n\n例如，要获取匹配特定条件的模型对象数组，可以使用 `.where` 函数。\n\
  \n```\nvar results = myLibrary.where({author:'James Sugrue'});\nconsole.log('找到：'\
  \ + results.length + ' 个匹配');\n```\n\n`findWhere` 函数可用于查找第一个匹配查询的模型，而不是返回匹配项的数组。\n\
  \n```\nvar result = myLibrary.findWhere({author:'James Sugrue'});\nconsole.log('结果：'\
  \ + result.get('author'));\n```\n\n你还可以按公共属性值对模型对象进行分组。例如，如果每本书都有一个表示是否已出版的布尔值，我们可以如下进行分组：\n\
  \n```\nvar byPublished = myLibrary.groupBy('published');\nmyLibrary.forEach(function(model){\n\
  \    console.log('书的名字是 ' + model.get('name'));\n});\n```\n\n`Collections` 还有更多可用的实用方法，你可以阅读\
  \ [`http://backbonejs.org`](http://backbonejs.org/) 来了解。不过，这里列出的方法应该足以让你入门了。\n\n\
  ### 与服务器交换数据\n\n为了结束我们对 `Collections` 的概述，我们将看看集合如何与服务器交互。在本书的第一部分，当我们讨论 `Backbone.Model`\
  \ 时，我们看到了如何使用另一台服务器上运行的 REST API 来检索、保存、更新和获取单个模型。\n\n集合可以通过管理所有模型并提供工具来更高效地组织这一切，使保存模型到服务器变得稍微容易一些。\n\
  \n#### 设置\n\n你需要做的第一件事是使用 `url` 属性告诉集合数据持久化的服务器地址。我们将指向运行在 8080 端口上，带有 `/books/`\
  \ API 端点的 Node.js 服务器。\n\n```\nvar Library = Backbone.Collection.extend({model:\
  \ Book,\n    url: 'http://localhost:8080/books/',\n    initialize: function(){\n\
  \        ....\n```\n\n#### 从服务器检索数据\n\n与 `Backbone.Model` 一样，集合有一个 `.fetch` 方法，用于从服务器检索集合数据。\n\
  \n```\nvar myOnlineLibrary = new Library();\nmyOnlineLibrary.fetch({\n    success:\
  \ function(e){\n        console.log('获取到数据');\n    },\n    error: function(e){\n\
  \        console.log('出现错误');\n    }\n});\n```\n\n与所有处理在线操作的函数一样，你可以提供成功和失败的回调来检测操作是否正确完成。\n\
  \n与 `Backbone.Model` 类似，可以在集合级别定义一个 `parse` 方法，允许你自定义从服务器返回的数据。`response` 参数包含执行\
  \ `.fetch` 后检索到的所有模型对象的数组。\n\n```\nvar Library = Backbone.Collection.extend({model:\
  \ Book,\n    // ......\n    parse: function(response, xhr) {\n        // 在此处进行自定义\n\
  \        return response;\n    },\n});\n```\n\n#### 保存数据到服务器\n\n虽然检索数据是批量进行的，但保存模型到服务器仍然是逐个进行的，如同本章\
  \ `Backbone.Model` 部分所述。\n\n```\n// 向集合添加模型并保存到服务器\nmyOnlineLibrary.add(bookOne);\n\
  bookOne.save({\n    success: function(e){\n        console.log('书已保存到服务器');\n  \
  \  },\n    error: function(e){\n        console.log('保存书时出错');\n    }\n});\n```\n\
  \n然而，如果你使用 `Backbone.Collection.create` 函数而不是 `.add`，模型将同时被添加到集合并持久化到服务器。\n\n```\n\
  // 添加到集合同步保存到服务器\nmyOnlineLibrary.create(bookTwo);\n```\n\n#### 从服务器删除数据\n\n从服务器删除模型是在单个模型级别上使用\
  \ `.destroy` 方法完成的，如上一节所述。\n\n```\nbookOne.destroy({\n    success: function(e){\n\
  \        console.log('书已删除')\n    },\n    error: function(e){\n        console.log('删除书时出错');\n\
  \    }\n});\n```\n\n### 集合快速参考\n\n本节提供了与 `Backbone.Collection` 相关的函数、属性和事件的概述。\n\
  \n\n\n### 集合方法参考\n\n如您所见，Backbone 提供了许多实用的函数用于处理集合。表 3-3 列出了这些方法，方便快速查阅。\n\n**表\
  \ 3-3.** 集合可用方法\n\n| 函数/属性 | 描述 |\n| --- | --- |\n| `.length()` / `.size()` | 返回集合中包含的模型对象数量\
  \ |\n| `.models` | 返回包含所有模型对象的原始数组 |\n| `.add([models])` | 向集合中添加单个模型或模型数组 |\n|\
  \ `.push([models])` | 向集合末尾添加单个模型或模型数组 |\n| `.unshift([models])` | 向集合开头添加单个模型或模型数组\
  \ |\n| `.remove([models])` | 从集合中移除单个模型或模型数组 |\n| `.pop()` | 移除并返回集合末尾的模型 |\n| `.shift()`\
  \ | 移除并返回集合开头的模型 |\n| `.reset()` | 替换集合中的模型，或无参数调用时清空集合 |\n| `.get(id)` | 使用 `id`\
  \ 或 `cid` 作为参数从集合中检索模型 |\n| `.at(index)` | 从集合中检索指定索引位置的模型 |\n| `.forEach(function)`\
  \ | 遍历集合中的每个模型 |\n| `.sortBy()` | 根据特定属性对集合中的模型进行排序，并返回模型数组 |\n| `.sort()` | 重新应用集合的排序顺序\
  \ |\n| `.where({key:value})` | 查找集合中所有具有指定键值对的模型 |\n| `.findWhere({key:value})`\
  \ | 查找第一个具有指定键值对的模型实例 |\n| `.url` | 指向 REST API 端点的位置 |\n| `.fetch()` | 从服务器检索整个集合\
  \ |\n| `.create(<model>)` | 向集合中添加新模型并保存到服务器 |\n\n### 集合事件参考\n\n与模型类似，集合在内容发生变化时会触发多个事件。表\
  \ 3-4 列出了这些事件，方便快速查阅。\n\n**表 3-4.** 与 Backbone 集合相关的事件\n\n| 函数/属性 | 描述 |\n| ---\
  \ | --- |\n| `add` | 检测到模型已被添加到集合中 |\n| `remove` | 检测到模型已从集合中移除 |\n| `reset` | 检测到集合已被重置\
  \ |\n| `sort` | 检测到集合正在排序 |\n| `change` | 检测到集合中的模型正在发生变化 |\n| `change:<attribute\
  \ name>` | 检测到集合中的 `<attribute name>` 模型属性正在发生变化 |\n\n## 本章小结\n\n本章重点介绍了 Backbone\
  \ 应用的数据层，前半部分描述了 `Model` 对象提供的功能，后半部分则讨论了集合。我们了解了集合如何优雅地封装 `Model` 对象；最重要的是，我们学习了运行在\
  \ Node.js 服务器上且暴露 REST API 的服务端与 Backbone 客户端应用之间的交互方式。\n\n"
- "# 4. Backbone 视图与模板库\n\n**摘要**\n\n前一章重点介绍了 Backbone 为支持 Web 应用模型层所提供的类和功能。现在，焦点转向视图层，`Backbone.View`\
  \ 是其背后的核心类。我们还将探讨模板库如何工作，以简化 HTML 页面的更新过程。除了了解 Underscore，我们还将花时间介绍 Handlebars 和\
  \ Mustache，这是两种用于 JavaScript 应用的主流模板库。\n\n## 代码设置\n\n为了执行示例中的代码，我们将继续使用上一章的 `index.html`。由于我们将使用之前定义的模型和集合，任何视图相关的\
  \ JavaScript 代码片段都应放置在其定义和实例化之后，如下所示：\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
  \    <meta charset=\"UTF-8\">\n    <title>我的应用</title>\n</head>\n<body>\n<script\
  \ src=\"js/external/jquery-1.10.2.js\"></script>\n<script src=\"js/external/underscore.js\"\
  ></script>\n<script src=\"js/external/backbone.js\"></script>\n<script>\n      \
  \  Book = Backbone.Model.extend({\n          // 第 3 章中所有 Book 模型定义代码。\n        });\n\
  \        /**\n         * 基于 book 定义一个集合\n         **/\n         var Library = Backbone.Collection.extend({model:\
  \ Book,\n           // 第 3 章中所有 Library 集合定义代码。\n         });\n        //实例化书籍\n\
  \        var bookOne = new Book({name: 'Beginning Backbone', author: 'James Sugrue',\
  \ year: 2013});\n         var bookTwo = new Book({name: 'Pro Javascript Design Patterns',\
  \ author:'Dustin Diaz, Ross Harmes', year: 2012});\n         //创建图书馆\n         var\
  \ myLibrary = new Library([bookOne, bookTwo]);\n        //此处将放置所有 Backbone 视图代码\n\
  </script>\n</body>\n</html>\n```\n\n## Backbone 视图\n\n当提及 `Backbone.View` 时，我们指的是在\
  \ Backbone 应用中创建的、用于将代码组织成逻辑视图的 JavaScript 对象。这意味着，尽管视图可以更新页面中存在的 HTML（通常通过模板库实现），但视图会监听模型的变化，并在\
  \ HTML 页面的指定区域渲染这些变化。\n\n### 创建 Backbone 视图\n\n通过 `Backbone.View.extend()` 函数来创建自定义的视图定义。与\
  \ `Backbone.Model` 和 `Backbone.Collection` 类似，您可以传入一个 `initialize` 函数，该函数会在创建新实例时被调用。\n\
  \n```javascript\n//定义图书馆视图\nLibraryView = Backbone.View.extend({\n        initialize:\
  \ function(){\n                console.log('视图已创建');\n        },\n});\n```\n\n要创建视图的新实例，只需使用\
  \ `new` 运算符。\n\n```javascript\n//创建视图的一个实例\nvar myView = new LibraryView();\n```\n\
  \n您可以在创建视图时传入额外的选项，例如视图所关联的模型以及视图所应附加到的元素。在以下代码片段中，一个 `Book` 模型的实例被传递给了 `LibraryView`，该模型可以在视图的\
  \ `initialize` 函数中访问：\n\n```javascript\nvar thisBook = new Book({name : 'Beginning\
  \ Backbone',\n                         author: 'James Sugrue'});\n//创建视图的一个实例\n\
  var myView = new LibraryView({model: thisBook});\n```\n\n我们将在本章后续部分了解如何在创建视图时传入其他属性，例如\
  \ `collection`、`el`、`id`、`className`、`tagName` 和 `attributes`。\n\n\n好的，作为高级文档工程师和翻译员，我将根据您提供的注意事项和示例，将以下英文文本翻译成中文。\n\
  \n\n### 绑定到物理视图\n\n要将你的`View`类绑定到 HTML 页面，你需要使用`el`属性，它是任何视图的核心。`el`是对 HTML 页面上与该视图关联的\
  \ DOM 元素的引用。\n无论视图是否已被渲染，该 DOM 元素始终可用。因此，整个视图可以在渲染之前创建好，然后一次性将元素插入到 DOM 中，从而尽可能减少重绘的次数。\n\
  \n使用`el`有两种方式：引用一个已有的 DOM 元素，或者创建一个新的 DOM 元素。\n\n通过向构造函数传递一个`el`属性，你就是在告知视图它应该附加到哪个\
  \ DOM 元素上。例如，如果 HTML 页面有一个用于包含库视图内容的`div`，你应该在构造视图时传递对该元素的引用。\n\n```html\n<body>\n\
  <div id=\"myLibraryViewSection\"></div>\n```\n\n这个引用是使用标准的 CSS 选择器来完成的，这些选择器使用`#<element_id>`或`.<element_class>`。\n\
  \n```javascript\n// 创建一个带有模型和元素的视图实例\nvar myView = new LibraryView({\n  model: thisBook,\n\
  \  el: '#myLibraryViewSection'\n});\n```\n\n你也可以通过在构造视图时传递一些属性，来动态创建视图的`el`。\n\n\
  -   `tagName`：用于视图的 HTML 元素的名称。如果未指定，`tagName`的值默认为`div`。\n-   `className`：用于渲染此元素的\
  \ CSS 类。此属性是可选的。你可以为元素指定多个类，通过空格分隔的值传递它们。\n-   `id`：分配给元素的 ID。此属性是可选的。\n-   `attributes`：分配给元素的其他属性，例如以键值对形式存在的`data-`属性。\n\
  \n```javascript\n// 创建一个将构建其自身 DOM 元素的视图\nvar myNewView = new LibraryView({model:\
  \ thisBook,\n  tagName: 'ul',\n  className: 'libraryview',\n  id: 'library',\n \
  \ attributes: {'data-date': new Date()}\n});\n\nconsole.log(myNewView.el);\n```\n\
  \n`myNewView.el`的结果现在将如下所示：\n\n```html\n<ul id='library' class='libraryview' data-date='Mon\
  \ Aug 05 2013 13:54:20 GMT+0100 (IST)'/>\n```\n\n如果这些属性都没有传递，那么`el`将被创建为一个空的`div`元素。\n\
  无论`el`是新创建的还是作为引用传递的，所有这些属性都可以通过视图的对象访问。\n\n> **注意**\n> 当为视图构造`el`时，它不会自动附加到 DOM\
  \ 中。\n\n### 渲染内容\n\n要将你的视图内容放到页面上，你需要重写`render`函数。如果不实现它，视图的内容将永远不会被渲染。\n要让视图在构造时自动渲染，你可以从视图的`initialize`函数中调用`render`函数。\n\
  \n```javascript\n// 定义库视图\nLibraryView = Backbone.View.extend({\n  initialize: function(){\n\
  \    this.render();\n  },\n  render: function(){\n    this.$el.html('Hello Library');\n\
  \    return this;\n  }\n});\n```\n\n当然，一个更有用的`render`函数会利用视图中存在的模型或集合。\n\n```javascript\n\
  render: function(){\n  this.$el.html('Book Name: ' + this.model.get('name'));\n\
  \  return this;\n}\n```\n\n注意`render`函数末尾有一个`return this`语句。这是 Backbone 提倡的一种约定，用于允许链式调用。通过让函数返回对视图的引用，你可以执行需要该引用的进一步操作。这在处理嵌套视图时特别有用，因为它提供了对子视图`el`属性的访问。以下代码展示了由于可以轻松访问`el`属性，如何将所有子视图附加到父视图上：\n\
  \n```javascript\nrender: function(){\n  for (var i = 0; i < this.subviews.length;\
  \ i++){\n    this.$el.append(this.subviews[i].render().el);\n  }\n  return this;\n\
  }\n```\n\n从前面的代码片段可以看出，由于你可以访问`$el`属性，HTML 可以直接设置在元素上。然而，这种方法容易出错，并导致 JavaScript\
  \ 源码中出现大量杂乱的 HTML 代码。最好使用众多模板库之一来提供更清晰、更高效的渲染实现。我们将在本章稍后部分讨论可用的模板选项。\n\n注意，与其在我们的渲染中使用单个模型，我们也可以在创建新实例时向视图传递一个集合。\n\
  \n```javascript\nvar myLibraryView = new LibraryView({\n  collection: myLibrary,\n\
  \  el: '#myLibraryViewSection'\n});\n```\n\n现在，`render`方法可以处理整个模型集合了。\n\n```javascript\n\
  render: function(){\n  for(var i =0; i < this.collection.size(); i++){\n    this.$el.append('<li>Book\
  \ Name: ' + this.collection.at(i).get('name') + '</li>');\n  }\n  return this;\n\
  }\n```\n\n给你渲染的每个元素分配一个唯一的 ID 是个好主意，这样在后续阶段如果需要操作或隐藏它，可以很容易地找到它。在这种情况下，我们可以将书名视为唯一标识符，并按如下方式标记每个`<li>`：\n\
  \n```javascript\nrender: function(){\n  for(var i =0; i < this.collection.size();\
  \ i++){\n    var bookname = this.collection.at(i).get('name');\n    this.$el.append('<li\
  \ id=\\'' + bookname + '\\'>Book Name: ' + bookname) + '</li>');\n  }\n  return\
  \ this;\n}\n```\n\n是否需要使用模型或集合，取决于你的视图需求。\n\n最后，可以完全从 DOM 中移除视图。这也会导致所有事件监听器被释放。\n\
  \n```javascript\nmyLibraryView.remove();\n```\n\n#### 在视图中查找元素\n\n经常需要在视图中查找嵌套的元素，并在视图的范围内运行其他\
  \ jQuery 函数。Backbone 提供了一个额外的`$el`属性，作为`$(view.el)`的简写。\n例如，要在视图中查找一个子元素，你可以使用以下代码。如果视图内存在\
  \ ID 为`Beginning Backbone`的元素，这段代码将找到它。回想一下，在前面的章节中，我们为视图中的每个`<li>`标签分配了唯一的标识符。\n\
  \n```javascript\n$el.find('#Beginning Backbone');\n```\n\n类似地，Backbone 提供了一个`$(<selector>)`函数，作为`$(view.el).find(<selector>)`的简写，这使得任何处理子元素的代码都更加优雅和易读。\n\
  \n```javascript\n$('#Beginning Backbone');\n```\n\n前面两段代码都达到了相同的结果：在当前视图的范围内找到一个\
  \ ID 为`myelement`的元素。\n\n#### 更改 DOM 元素\n\n在某些情况下，你可能希望在整个应用生命周期内切换视图所应用的 DOM 元素。这可以通过`.setElement()`函数实现，该函数接受一个对新元素的引用。以下代码假设你的\
  \ HTML 中创建了一个 ID 为`anotherViewSection`的`div`：\n\n```javascript\nmyView.setElement('#anotherViewSection');\n\
  ```\n\n此函数还会创建`$el`引用的新版本，并确保所有在旧元素上注册的事件都会被转移到新元素上。\n\n\n\n### 视图事件\n\n既然视图已经渲染完成，你可能想要添加一些事件来使其具有交互性。在\
  \ Backbone 中，通过在视图定义中指定一个事件哈希表，同样可以轻松实现这一点。\n\n事件哈希表中列出的事件将使用 jQuery 的`on`函数来为视图的\
  \ DOM 事件提供回调函数。使用`{'事件 选择器': '回调函数'}`的格式来定义将要处理的事件。以下示例演示了如何为 ID 为`book`的元素添加点击监听器：\n\
  \n```\n//定义图书馆视图\nLibraryView = Backbone.View.extend({\n\n        events: {\n  \
  \          'click #book' : 'alertBook'\n        },\n\n        render: function(){\n\
  \             for(var i =0; i < this.collection.size(); i++){\n                this.$el.append('<li\
  \ id=\"book\">图书名称: ' + this.collection.at(i).get('name') + '</li>');\n        \
  \                         }\n                             return this;\n       \
  \         },\n                alertBook: function(e){\n                        \
  \  alert('图书被点击');\n               }\n\n});\n```\n\n如果未定义选择器，事件将绑定到`this.el`，即视图的根元素。\n\
  \n例如，要为整个视图添加点击处理程序，你可以简单地使用以下代码：\n\n```\nevents: {\n     'click ' : 'alertBook'\n\
  },\n```\n\n如果你需要为视图的每个实例单独定义事件，或者视图拥有不同的操作模式，你可以使用`delegateEvents()`。此函数会自动从`View`构造函数中调用，因此当你的`events`哈希表已定义时，你无需再调用它。调用`delegateEvents`会移除所有现有的回调函数，并使用提供的事件哈希表创建一组新的事件处理程序。\n\
  \n以下代码会将警示监听器从点击事件更改为鼠标悬停事件：\n\n```\nmyLibraryView.delegateEvents( {\n      'mouseover\
  \ #book ' : 'alertBook'\n});\n```\n\n你可以通过向`delegateEvents`传入空的事件哈希表，或者调用`undelegateEvents`函数来移除所有事件。通过在视图中添加如下一行代码，你可以移除`myLibaryView`中处理的所有事件。在\
  \ Chrome 开发者工具控制台中输入以下代码行，你将注意到视图不再响应你所创建处理程序的任何事件。\n\n```\nmyLibraryView.undelegateEvents();\n\
  ```\n\n### 处理 self 与 this\n\n在 Backbone 应用中，你将会看到大量代码中的函数会将原始`this`对象的引用保存为`self`。\n\
  \n```\nvar self = this;\n```\n\n这样做是为了在上下文发生变化时，仍能保持对原始`this`的引用。你会经常在代码的闭包中看到这种情况，尤其是在你创建的任何事件处理程序中。\n\
  \n使用这种方法，`render`函数将改用`self`引用来替代`this`。\n\n```\nrender: function(){\n        var\
  \ self = this;\n        for(var i =0; i < this.collection.size(); i++){\n      \
  \       self.$el.append('<li id=\"book\">图书名称: ' + self.collection.at(i).get('name')\
  \ + '</li>');\n         }\n                        return self;\n},\n```\n\n###\
  \ Backbone 视图快速参考\n\n表 4-1 描述了`Backbone.View`中可用的属性和函数。\n\n表 4-1.\n`Backbone.View`中最重要的属性和函数\n\
  \n| 函数/属性 | 描述 |\n| --- | --- |\n| `el` | 指定用于包含此视图的 DOM 元素的引用。 |\n| `$el` | 指定视图元素的缓存\
  \ jQuery 对象。 |\n| `$(<选择器>)` | 当包含 jQuery 时，`$`函数将在视图元素范围内执行查询。 |\n| `model` | 指定此视图应渲染的模型。\
  \ |\n| `collection` | 指定视图应渲染的集合。 |\n| `id` | 指定分配给视图根元素的 ID。 |\n| `className` |\
  \ 指定视图根元素的 CSS 类。 |\n| `tagName` | 指定此视图根元素的 HTML 标签。 |\n| `attributes` | 指定要用于该元素的额外属性。此属性也可用于访问可用的属性。\
  \ |\n| `setElement(<选择器>)` | 更改此视图的根元素。 |\n| `remove()` | 从 DOM 中完全移除该视图。 |\n| `render()`\
  \ | 负责处理视图所有渲染的函数。 |\n| `events` | 一个事件哈希表及其处理函数，用于此视图。 |\n| `delegateEvents(<事件>)`\
  \ | 为视图设置一组新的事件和处理程序，移除之前的事件。 |\n| `undelegateEvents(<事件>)` | 移除视图的所有事件。 |\n\n##\
  \ Backbone 中的模板化\n\n模板库使得逻辑与表现的分离更加明显。通过在 JavaScript 源码之外定义模板，你可以避免在视图的`render`方法中混杂大量的\
  \ HTML 字符串。\n\n模板库的思想是从你的 JavaScript 应用中获取 JSON 对象，并将它们插入到 HTML 模板中，该模板包含条件判断和其他逻辑表达式，以及对象值的占位符。\n\
  \nBackbone 并不强制你使用任何特定的模板库，如前一节所示，你甚至可以直接使用纯 HTML。本章我们将探讨三种模板库。首先处理 Underscore，你的\
  \ Backbone 应用已经依赖于它。然后我们将讨论 Handlebars 和 Mustache，这是两个最流行的模板库。\n\n\n\n### 使用 Underscore\
  \ 进行模板化\n\n除了为你的 Backbone 应用提供大量实用函数外，Underscore 还包含用于处理模板的功能。\n\n模板作为 `script`\
  \ 标签放置在 HTML 页面中，其类型设置为 `text/template`，这样浏览器在渲染 HTML 页面时会忽略我们创建的模板。模板还应带有一个 ID，以便你的\
  \ JavaScript 能够找到它。\n\n```\n<script type=\"text/template\" id=\"library-template\"\
  >\n</script>\n```\n\nUnderscore 允许你在模板中使用 JavaScript 表达式来循环遍历数据并执行其他条件操作。首先，回顾一下上一节中\
  \ `render` 方法内的数据结构。我们有一个包含多本书的图书馆。由于需要渲染的是一个集合而非单个模型，因此在模板中需要使用循环。\n\n```\n<script\
  \ type=\"text/template\" id=\"library-template\">\n  <ul>\n    <% for (var i = 0;\
  \ i < library.length; i++) { %>\n      <% var book = library[i]; %>\n      <li>\n\
  \        <b><%= book.name %></b> 由 <%= book.author %> 编著\n      </li>\n    <% }\
  \ %>\n  </ul>\n</script>\n```\n\n此模板要求传入渲染的 JSON 结构被命名为 `library`，并且它是一个包含一个或多个项目的集合，这些项目具有前面列出的属性（`name`\
  \ 和 `author`）。\n\n请注意，任何 JavaScript 代码都可以放在 `<% ... %>` 标记内，例如 `for` 循环，而所有 HTML\
  \ 代码都出现在这些标记之外。然后可以使用 `<%= variable %>` 标记来显示数据。\n\n在 HTML 中定义好模板后，视图需要在 `render`\
  \ 方法中感知到它的存在。关键在于 Underscore 提供的 `template()` 函数。\n\n该函数将 JavaScript 模板编译成一个可评估并用于渲染的函数。模板的参数包括代表模板的字符串、要渲染的数据，以及一个可选的模板设置参数。\n\
  \n通过查找页面中具有相应 ID 的元素并获取其 HTML 内容，来填充模板字符串的值。\n\n`$(\"#library-template\").html()`\n\
  \n由于模板期望数据采用特定结构且名称为 `library`，因此将集合的 JSON 表示形式作为第二个参数传入，并附带预期的标识符。\n\n`{'library':\
  \ self.collection.toJSON()}`\n\n最后，可以通过将输出追加到视图的 `$el` 属性来渲染模板。\n\n`self.$el.append(output);`\n\
  \n我们启用了 Underscore 的模板函数的完整代码如下：\n\n```\nrender: function(){\n  var self = this;\n\
  \  var output = _.template($(\"#library-template\").html(), {'library': self.collection.toJSON()});\n\
  \  self.$el.append(output);\n  return self;\n}\n```\n\n请注意，在整个代码中，Underscore 库通过\
  \ `_` 命名空间来引用。上面定义的 `render` 函数很直观，但它有一个缺陷：每次调用 `render` 时，模板都会被重新编译。更简洁的做法是将编译后的模板存储为视图的一个属性。\n\
  \n```\nLibraryView = Backbone.View.extend({\n  // 其他视图相关代码\n  template: _.template($(\"\
  #library-template\").html()),\n  //....\n});\n```\n\n现在，当视图被创建时，模板就被编译并随时可用。这使得\
  \ `render` 函数更加简洁。\n\n```\nrender: function(){\n  var self = this;\n  var output\
  \ = self.template({'library': self.collection.toJSON()});\n  self.$el.append(output);\n\
  \  return self;\n},\n```\n\n`templateSettings` 参数可用于更改定界符样式，方法是在 `interpolate` 参数中使用不同的正则表达式。例如，要使用\
  \ `{{ }}` 而不是 `<% %>`，你可以使用以下设置：\n\n```\nvar templateSettings = {\n  interpolate\
  \ : /\\{\\{(.+?)\\}\\}/g\n};\n```\n\n通过在 `_.` 级别定义这些设置，可以使其对所有 Underscore 模板全局生效。\n\
  \n```\n_.templateSettings = {\n  interpolate : /\\{\\{(.+?)\\}\\}/g\n};\n```\n\n\
  这一行代码将应用于整个应用程序，因此需要在你的 JavaScript 源代码中创建任何视图之前声明它。\n\n如你所见，使用 Underscore 进行模板化相当简单。通过在模板内部使用纯\
  \ JavaScript 来处理逻辑和条件，代码非常易于理解。但还有更出色的选择，我们将在接下来的章节中介绍。\n\n### 使用 Handlebars 进行模板化\n\
  \nHandlebars（[`www.handlebarsjs.org`](http://www.handlebarsjs.org/)）是 JavaScript\
  \ 社区中最流行的模板库之一。该库遵循 Mustache.js 风格，其理念提倡无逻辑模板。请注意，这与 Underscore 是不同的方法。因此，Handlebars\
  \ 模板不接受模板内的任意 JavaScript，迫使你使用内置构造。不过，它具有添加自定义辅助函数的能力，我们稍后会介绍。\n\n与所有模板库一样，Handlebars\
  \ 接受模板结构并将其编译成一个 JavaScript 函数，该函数接受 JSON 数据进行呈现。Handlebars 的优势之一在于，它遵循与 Mustache\
  \ 模板相同的风格，因此这些库是可互换的，同时你可以保留相同的模板。此外，凭借其模板预编译选项，Handlebars 被认为是目前最先进的库之一。\n\n\n\n\
  #### 在 Backbone 中使用 Handlebars\n\n在 Backbone 项目中集成 Handlebars 出奇地简单。首先，你需要从 [`www.handlebarsjs.org`](http://www.handlebarsjs.org/)\
  \ 下载该库的最新版本。为了与本书迄今为止使用的代码结构保持一致，你可以将其下载到 `js/external` 文件夹，并按如下方式在 `index.html`\
  \ 中引入：\n\n`<script src=\"js/external/handlebars.js\"></script>`\n\n现在，让我们将之前为 Underscore\
  \ 创建的模板替换为 Handlebars 兼容的版本。与之前一样，模板包含在一个带有 ID 的 `<script>` 标签中，但模板的类型现在是 `text/x-handlebars-template`。\n\
  \n`<script type=\"text/x-handlebars-template\" id=\"library-template\">`\n\n在循环的处理方式上，最能清晰地看出\
  \ Handlebars 与 Underscore 的区别。Handlebars 使用 `{{#<表达式名称>}}` 这种形式来整合表达式。\n\n`<script\
  \ type=\"text/x-handlebars-template\" id=\"library-template\">`\n\n```\n<ul>\n    {{#each\
  \ library}}\n    <li>\n        <em>{{name}}</em> by {{author}}\n    </li>\n    {{/each}}\n\
  </ul>\n```\n\n从前面的代码可以看出，Handlebars 模板看起来比 Underscore 的对应版本优雅得多。它没有使用 `for` 语句，而是使用\
  \ `#each` 表达式来遍历集合，该集合通过标识符 `library` 传递。\n\n与 `{{#each}}` 用于启动循环相对应，循环体使用 `{{/each}}`\
  \ 结束。Handlebars 中的所有块都遵循此模式。变量只需将其名称放在花括号内即可呈现。\n\n如果 `library` 对象内部还包含另一个对象，则可以使用点表示法访问其原始值。例如，假设每本书都有以下结构，其中包含一个表示出版日期的对象：\n\
  \n```\nvar bookOne = new Book({\n    name: 'Beginning Backbone',\n    author: 'James\
  \ Sugrue',\n    publishDate: {\n        year: 2013,\n        month: 'December'\n\
  \    }\n});\n```\n\n那么，就可以在循环中使用 `{{publishDate.year}}` 访问出版年份。\n\n```\n<script\
  \ type=\"text/x-handlebars-template\" id=\"library-template\">\n<ul>\n    {{#each\
  \ library}}\n    <li>\n        <em>{{name}}</em> by {{author}} published in {{publishDate.year}}\n\
      </li>\n    {{/each}}\n</ul>\n</script>\n```\n\n引入 Handlebars 模板只需将视图的 `template`\
  \ 属性改为使用 Handlebars 而不是 Underscore 进行编译即可。\n\n```\nLibraryView = Backbone.View.extend({\n\
      //....\n    template: Handlebars.compile($(\"#library-template\").html()),\n\
      ...\n});\n```\n\n请注意，唯一的变化就是将 `_.template` 替换为 `Handlebars.compile`。\n\n实际上，`render`\
  \ 方法与之前相同，因为唯一与模板库相关的代码就是 `template` 变量的声明。\n\n```\nrender: function(){\n    var\
  \ self = this;\n    var output = self.template({'library':self.collection.toJSON()});\n\
      self.$el.append(output);\n    return self;\n},\n```\n\n如你所见，Handlebars 提供了一种简洁的创建模板的方式。其表达式语言直观明了，但功能强大。下一节将让你更深入地了解\
  \ Handlebars 的各种可能性。\n\n#### Handlebars 快速指南\n\n由于 Handlebars 模板的语法不仅仅是纯 JavaScript，本节将介绍一些基本表达式，以帮助你入门。\n\
  \n##### 显示变量\n\n可以使用 `{{name}}` 这种形式将变量值输出到模板。这会打印出当前上下文中的值 `name`，该上下文可以通过遍历集合的块表达式来改变。\n\
  \n```\n<h1>{{name}}</h1>\n```\n\n如果你正在处理嵌套变量，可以使用点分隔的路径来确定值。例如，如果模板处理的是一个 `person`\
  \ 对象，你可以像下面这样显示详细信息：\n\n```\n<h1>{{person.name}}</h1>\n<p>Birthday: {{person.birthday}}</p>\n\
  ```\n\n##### 注释\n\n可以使用 `{{! comment }}` 或 `{{!-- comment --}}` 将注释插入到模板中。\n\n```\n\
  {{! Name of the person }}\n<h1>{{person.name}}</h1>\n```\n\n当你需要注释掉 Handlebars 表达式时，应使用\
  \ `{{!-- }}` 风格。\n\n```\n{{!-- unused expression for now {{name}} --}}\n```\n\n\
  ##### 块表达式\n\nHandlebars 中的块使用 `{{#expression}}` 语句开始，并以 `{{/expression}}` 语句结束。\n\
  \n###### each\n\n正如我们在 library 示例中已经看到的，`each` 助手允许遍历一个列表。\n\n```\n{{#each library}}\n\
      <li>\n        <em>{{name}}</em> by {{author}} published in {{publishDate.year}}\n\
      </li>\n{{/each}}\n```\n\n请注意，你可以在块内使用 `{{this}}` 来引用当前正在遍历的元素。\n\n你也可以使用路径来访问当前上下文之外的对象和属性。例如，可以使用\
  \ `{{../<属性名称>}}` 来访问与你当前正在遍历的列表位于同一层的属性。\n\n##### 条件判断\n\n模板定义中可以使用多个条件语句。以下部分列出了一些。\n\
  \n###### if else\n\n当模板中有需要根据条件渲染的部分时，Handlebars 包含一个 `if else` 结构。参数会被传递给 `{{#if\
  \ }}` 表达式进行评估。\n\n```\n{{#if book.published}}\n    <p>Book now available</p>\n{{else}}\n\
      <p>Book coming soon : {{book.pubishDate}}</p>\n{{/if}}\n```\n\n###### unless\n\
  \n`unless` 助手的作用与前面介绍的 `if` 语句相反。它接收一个参数，并确保在该参数评估为 `false` 时才会进入模板部分。\n\n```\n\
  {{unless book.published}}\n<p>This book is not yet published</p>\n{{/unless}}\n\
  ```\n\n##### 内置助手\n\nHandlebars 自带了一些内置助手，以便于使用。\n\n###### with\n\n`with` 助手允许在模板内更改上下文，从而使用特定的对象。这个助手允许你指定在块内处理某个特定对象，形式如下，而不是使用\
  \ `{{object.property}}`：\n\n```\n{{#with object}}\n    {{property}}\n{{/with}}\n\
  ```\n\n为了直观地理解这一点，让我们考虑以下 `Person` 对象：\n\n```\n{{#with person}}\n    <h1>{{name}}</h1>\n\
      <p>Birthday: {{birthday}}</p>\n{{/with}}\n```\n\n###### log\n\n`log` 助手允许在模板内进行简单的日志记录，这对于调试非常有用。\n\
  \n该助手委托给 `Handlebars.logger.log`，如果需要自定义日志记录，可以覆盖该方法。\n\n```\n{{#with person}}\n\
      <h1>{{log name}}</h1>\n{{/with}}\n```\n\n#### 提供自定义助手\n\nHandlebars 的真正强大之处在于，当内置表达式和助手不够用时，你可以编写自己的助手。你可以在\
  \ JavaScript 代码中创建自己的助手，这些助手随后会在任何模板的编译过程中被使用。\n\n让我们创建一个简单的加法助手。你需要使用 Handlebars\
  \ 的 `registerHelper` 函数，并提供助手名称，后跟要执行的操作。\n\n```\nHandlebars.registerHelper('add',\
  \ function(param1, param2){\n    return param1 + param2\n});\n```\n\n现在，你可以像这样在模板中使用它：\n\
  \n```\n<p>In 20 years time {{name}} will be {{add person.age 20}} years old </p>\n\
  ```\n\n别忘了，Handlebars 有一个庞大的用户社区，他们会分享自己的助手。\n\n\n\n### 预编译模板\n\nHandlebars 提供了强大的预编译能力，可以节省客户端执行时间，并允许你使用不包含运行时编译功能的\
  \ Handlebars 运行时库 `handlebars.runtime.js`。在撰写本文时，未压缩的运行时库大小为 11KB，而完整的 Handlebars\
  \ 库则为 73KB。当针对移动设备时，这种节省效果会非常显著。\n\n你需要在开发或构建机器上安装 Node.js 才能运行预编译。在第 3 章中，我们创建了一个\
  \ Node.js 服务器作为应用程序的后端。如果尚未安装 Node.js，可以从 [`http://nodejs.org`](http://nodejs.org/)\
  \ 下载。安装 Node.js 后，即可使用 Node 包管理器 (NPM) 下载 `handlebars` 包。\n\n```\nnpm install handlebars\
  \ -g\n```\n\n所有模板都需要存储在一个外部文件中，该文件会通过命令行传递给预编译器。\n\n```\nhandlebars <inputfile>\
  \ -f <outputfile>\n```\n\n这将生成一个包含已编译模板的 JavaScript 文件，随后可将该文件包含在你的应用程序中。\n\n###\
  \ 使用 Mustache 进行模板化\n\n`Mustache.js` 是另一个无逻辑的模板库，可从 [`http://mustache.github.io`](http://mustache.github.io/)\
  \ 获取。Mustache 在多种语言中广受欢迎，包括 Ruby、Java、Objective-C 等。\n\n其模板格式与 Handlebars 使用的格式非常相似，只是没有帮助函数。\n\
  \n#### 在 Backbone 中使用 Mustache\n\n首先，你需要从 [`http://mustache.github.io`](http://mustache.github.io/)\
  \ 下载最新版本的 `Mustache.js`。同样，为符合本书中使用的惯例，应将其保存在 `js/external` 文件夹中，并按如下方式包含在 `index.html`\
  \ 中：\n\n```\n<script src=\"js/external/mustache.js\"></script>\n```\n\n该模板看起来与 Handlebars\
  \ 版本相似。\n\n```\n<script type=\"text/x-mustache-template\" id=\"library-template\"\
  >\n<ul>\n    {{#library}}\n   <li>\n    <em>{{name}}</em> by {{author}}\n </li>\n\
  \    {{/library}}\n</ul>\n</script>\n```\n\n请注意，遍历列表使用的是 `{{#<listname>}}` 语法，而不是\
  \ Handlebars 中的 `{{#each}}` 块辅助函数。循环结束使用 `{{/<listname>}}`。除此之外，模板中的其他内容基本相同。\n\n\
  同样，从 Backbone 视图更改模板库只需更改模板属性即可。\n\n```\ntemplate: Mustache.compile($(\"#library-template\"\
  ).html()),\n```\n\n`render` 方法保持不变。\n\n```\nrender: function(){\n        var self\
  \ = this;\n        var output = self.template({'library': self.collection.toJSON()});\n\
  \        self.$el.append(output);\n        return self;\n},\n```\n\n从上述示例可以清楚地看出，在\
  \ Handlebars 和 Mustache 之间切换是一个相对直接的过程。\n\n#### Mustache 快速指南\n\n本节简要概述如何在 Mustache\
  \ 模板中完成一些常用任务。\n\n##### 显示变量\n\n变量使用双花括号语法显示，与 Handlebars 相同。\n\n```\n{{name}}\n\
  ```\n\n可以使用点号表示法来访问对象的属性。\n\n```\n{{person.name}}\n```\n\n##### 遍历列表\n\n可以通过使用 `{{#list}}`\
  \ 语法初始化一个块，并使用 `{{/list}}` 结束该块来创建遍历列表的块。\n\n```\n{{#library}}\n   <li>\n    <em>{{name}}</em>\
  \ by {{author}}\n</li>\n{{/library}}\n```\n\n可以使用单个点号来访问当前在迭代列表中聚焦的对象。\n\n```\n\
  {{#library}}\n      <p>This object {{.}}</p>\n{{/library}}\n```\n\n##### 注释\n\n\
  Mustache 模板可以包含使用 `{{! comment }}` 格式的注释部分。\n\n```\n{{! 显示人物名称 }}\n{{person.name}}\n\
  ```\n\n## 使用哪个模板库？\n\n现在你已经了解了三个主要选项，决定使用哪个模板库可能有些困难。这实际上取决于你项目的需求。如果你使用有限或非常简单的模板，请使用\
  \ Underscore。因为你已经存在依赖关系，使用 Underscore 应该是你的最低要求。利用任何模板库都将带来更清晰的代码库，使 HTML 与视图中的所有\
  \ JavaScript 代码完美分离。\n\n但是，如果你的应用程序可能包含许多不同的视图，则值得考虑使用 Handlebars。模板的语法更自然，而且你始终可以添加更多辅助函数来满足项目需求。Handlebars\
  \ 提供的预编译功能使其成为关注性能（尤其是针对移动设备的项目）的项目的理想选择。\n\n"
- '# 总结


  本章概述了构建 Backbone 应用程序表示层所需的一切。我们首先介绍了 `Backbone.View`，它为 Backbone 模型和集合提供了逻辑和渲染功能。在查看了使用纯
  HTML 的最简单渲染类型后，我们讨论了三个主要的模板库，以了解如何实现 HTML 和 JavaScript 的更清晰分离。从内置 Underscore 库的简洁性到
  Handlebars 的强大功能，模板化的优势现在应该已经显而易见。


  '
- "# 路由器和事件\n\n到目前为止，我们构建的所有内容都非常简单，由单个页面组成，页面中包含一个在视图中呈现的模型或集合。如果你考虑使用 Backbone，不太可能将应用程序范围局限于如此基础的结构。相反，你的应用程序将由多个视图组成，这些视图需要使用事件相互通信。同样常见的是，你可能希望通过某种\
  \ URL 方案来管理导航。\n\n本章将探讨路由器和事件，它们将为任何大型 Backbone 应用程序提供粘合剂。\n\n## Backbone 路由器\n\n\
  路由是 Web 应用程序中一个可添加书签的部分，通常由末尾的哈希标识符或片段表示。与此同时，路由器是管理应用程序中定义的路由的代码。遵循此路由应能将你带到整体文档的特定部分。另一个有用的类比是将路由器视为书籍的目录。通过查阅目录，你就知道在哪里可以找到特定的信息。\n\
  \n路由器通过两种不同的方案观察应用程序 URL 的变化来检测路由变化。第一种方案使用哈希标签，例如 `http://apress.com/#myapp`，这适用于所有浏览器。对于支持\
  \ HTML5 标准的浏览器，第二种方案是利用 History API 并使用更“标准”的 URL，例如 `http://apress.com/myapp`。无论采用哪种方式，你都无需担心目标浏览器，因为\
  \ Backbone 会为你透明地回退到哈希/片段解决方案。\n\n\n\n### 创建路由\n\n在 Backbone 中创建路由遵循与库中所有对象相同的模式，即使用\
  \ `.extend` 方法来定义自定义路由。\n\n```\nMyRouter = Backbone.Router.extend({\n\n});\n```\n\
  \n接下来，你需要将特定的 URL 模式与当导航到该 URL 片段时会被调用的函数相匹配。这通过向 `extend` 函数传递一个 `routes` 哈希对象来实现。\n\
  \n```\nMyRouter = Backbone.Router.extend({\n\n        routes: {'hello' : 'sayHello'},\n\
  \n});\n```\n\n上述代码设置了一个路由，因此如果 URL 以 `#hello` 结尾，将调用名为 `sayHello` 的函数。该函数应像这样与路由一同定义：\n\
  \n```\nMyRouter = Backbone.Router.extend({\n\n        routes: {'hello' : 'sayHello'},\n\
  \n        sayHello: function(){\n\n                console.log('Saying hello');\n\
  \n        }\n\n});\n```\n\n为了让路由开始监听路由变化，需要创建一个新的路由实例。\n\n```\nvar router = new\
  \ MyRouter();\n```\n\n最后，为了监控哈希片段的变化并调用相应的事件，你需要初始化 `Backbone.history`。\n\n```\n\
  Backbone.history.start();\n```\n\n现在，当访问 `http://localhost/index.html#hello` 时，你将在控制台中看到\
  \ “Saying hello” 字样。\n\n由于大多数 Backbone 应用被设计为单页 Web 应用，你通常只需要创建一个路由。如果你想出于代码分离或结构考虑而创建独立的路由，主要需注意避免路由冲突。\n\
  \n现在我们已经了解了如何创建一个简单的路由，接下来让我们更仔细地研究其组成部分以及如何构建更复杂的路由。\n\n### Backbone.History\n\n\
  `Backbone.history` 是库提供的一个抽象，用于处理 `hashchange` 事件或 HTML5 的 `pushState`。当监测到 URL\
  \ 变化时，相应的路由会与你自定义路由中定义的回调函数进行匹配。\n\n正如你在本节开头的示例中所见，需要调用 `Backbone.history.start()`\
  \ 来开始监听变化事件。如果没有这一步，你的路由将无法成功运行。值得注意 `start()` 函数返回的布尔值；如果没有路由匹配当前 URL，它将返回 `false`。\n\
  \n### 使用 pushState\n\n如果你决定在应用中使用 HTML5 的 `pushState` 来提供不带哈希片段的 URL，可以在启动历史记录时进行指定。\n\
  \n```\nBackbone.history.start({pushState:true});\n```\n\n不过，你可能会注意到，直接粘贴示例路由 `http://localhost/hello`\
  \ 会导致 404 错误。这是因为你需要配置服务器，将所有 URL 重定向到 `index.html` 页面，以允许 Backbone 处理路由。\n\n你可以通过修改\
  \ Apache 服务器的 `httpd.conf` 文件来使用 `mode_rewrite.c` 模块来实现这一点。配置如下所示：\n\n```\nRewriteEngine\
  \ On\n\nRewriteBase /\n\nRewriteCond %{REQUEST_FILENAME} !-f  RewriteCond %{REQUEST_FILENAME}\
  \ !-d\n\nRewriteRule . index.html [L]\n```\n\n或者，你可以使用 Node.js 托管页面，并让它提供一些智能逻辑来处理此类路由。以下是一个简单的\
  \ Node.js 服务器示例，用于服务你的 Backbone 应用：\n\n```\nvar express = require('express');\n\n\
  var app = express();\n\napp.use(express.static(__dirname));\n\napp.use('/chapter5/hello',\
  \ express.static(__dirname + \"/chapter5\"));\n\napp.listen(3010);\n```\n\n假设你已经安装了优秀的\
  \ `express` 模块，上述代码可以使用 `node server.js` 命令运行。将你所有的客户端源代码放在与 `server.js` 同级的 `chapter5`\
  \ 目录中，第二个 `app.use` 规则便会生效。该规则规定，如果导航到 `/chapter5/hello`，则由 `chapter5` 目录提供服务；这将强制应用跳转到\
  \ `index.html`。\n\n由于应用并非从域的根目录 `/` 提供服务，请使用 `root` 参数来指定 Backbone 应用的提供位置。就前面的示例而言，我们使用\
  \ `chapter5` 作为 Backbone 应用的根目录：\n\n```\nBackbone.history.start({pushState:true,\
  \ root:\"/chapter5/\"});\n```\n\n通过访问 `http://localhost:3010/chapter5/hello`，你现在会看到\
  \ `sayHello` 路由被调用。对于如此简单的操作来说，这似乎需要大量工作，但它确实能为你的应用带来更简洁的 URL 方案。\n\n请记住，你需要在创建完所有应用路由以处理初始\
  \ URL 后，调用 `Backbone.history.start()` 或 `Backbone.history.start({pushState: true})`。\n\
  \n### 所有应用通用的路由\n\n有两个路由值得添加到所有路由中。一个是初始路由，即空字符串。\n\n```\nMyRouter = Backbone.Router.extend({\n\
  \n        routes: {'' : 'start'},\n\n        ....\n\n        start: function(){\n\
  \n                console.log('Initial route invoked');\n\n        },\n\n      \
  \  ....\n\n});\n```\n\n你还应提供一个默认路由；当使用了路由未配置处理的 URL 时，会调用此路由。该路由使用 `*default` 模式创建。\n\
  \n```\nMyRouter = Backbone.Router.extend({\n\n        routes: { '' : 'start',\n\n\
  \                             '*default': 'defaultRoute' },\n\n                //其他路由定义代码\n\
  \n        start: function(){\n\n                        console.log('Initial route\
  \ invoked');\n\n                },\n\n        defaultRoute: function(){\n\n    \
  \            console.log('Router does not handle this route');\n\n             \
  \   },\n\n                //其他路由定义代码\n\n});\n```\n\n\n\n### 为路由添加参数\n\n定义路由时传入的\
  \ `routes` 哈希表可将应用内的 URL 与函数关联起来。你还可以为这些映射的函数添加参数，从而在 Backbone 应用中提供更有用的书签。\n\n\
  你可以使用 `:param` 片段来设置路由，使其能够处理特定模式的参数。该参数将匹配两个斜杠之间的单个 URL 组成部分。例如，要使用之前创建的 `hello`\
  \ 路由，在类似 `http://localhost:3010/chapter5/#hello/james` 的 URL 中接收一个 `name` 参数，你需要按如下方式指定路由。请确保你定义的路由始终列在默认路由之前。\n\
  \n`routes : {'hello/:name': 'sayHello'},`\n\n现在函数定义改为接受 `name` 参数。\n\n```\nsayHello:\
  \ function(name){\n        console.log('Saying hello to ' + name);\n}\n```\n\n可以在路由中指定任意数量的此类参数。你可以通过添加第二个参数来处理诸如\
  \ `#hello/james/backbone` 这样的 URL。\n\n`routes : {'hello/:name/:skill': 'sayHello'},`\n\
  \n现在可以更新函数，使其处理额外的参数。\n\n```\nsayHello: function(name, skill){\n        console.log('Saying\
  \ hello to ' + name + ' ' + skill + ' author');\n}\n```\n\n然而，前一个路由的定义要求必须指定两个参数才能进入该路由。你也可以通过将参数放入方括号中来指定可选参数。\n\
  \n`routes : {'hello/:name(/:skill)': 'sayHello'},`\n\n前一个路由要求使用 `#hello/james` 或\
  \ `#hello/james/backbone` URL 格式。路由映射到的函数应当检查是否有参数为 `null`。\n\n```\nsayHello: function(name,\
  \ skill){\n        if(skill !== null){\n                console.log('Saying hello\
  \ to ' + name + ' ' + skill + ' author');\n        }\n        else{\n          \
  \      console.log('Saying hello to ' + name );\n        }\n}\n```\n\n请注意，你可以在任何路由参数前加上纯文本。例如，要在参数前加上\
  \ `chapter`，以形成类似 `#hello/james/chapter5` 的模式，你可以像这样使用路由：\n\n`routes : {'hello/:name/chapter:chapterNumber':\
  \ 'sayHello'},`\n\n这将产生两个变量：`name`（其值将设为 `james`）和 `chapterNumber`（其值将设为 `5`）。\n\
  \n最后，你可以使用 `*` 传递一个通配符（splat），它将匹配任意数量的 URL 组成部分。如果你有一个想要处理的路径，这会非常有用。例如，此处定义的路由允许使用类似\
  \ `#hello/james/chapter5/section1` 的 URL：\n\n`routes : {'hello/:name/*path': 'sayHello'},`\n\
  \n在上述代码的情况下，path 变量的值将是 `chapter5/section1`。\n\n### 路由事件\n\n每当导航到已定义路由的 URL，或在浏览器中使用后退按钮时，都会触发一个事件，其名称为映射的路由器函数名加上前缀\
  \ `route:`。在本例中，事件名将是 `router:sayHello`。\n\n```\nrouter.on(\"route:sayHello\", function(page)\
  \ {\n});\n```\n\n如果其他对象需要监听应用内导航的变化，这会非常有用。\n\n### 手动创建路由\n\n除了在创建路由器时以哈希表形式传递路由外，你还可以手动创建路由。通常，这会在你创建的\
  \ `initialize` 函数中完成，该函数在创建路由器的新实例时会被调用。\n\n`route` 函数接受三个参数：路由、名称，以及路由创建时将被调用的函数。要实现与之前路由示例相同的结果，你可以像这样调用简单的\
  \ `hello` 路由：\n\n```\ninitialize: function(options){\n        this.route('hello',\
  \ sayHello);\n},\n```\n\n不过，你可以用这个函数做更多事情。`route` 参数可以像之前的例子那样是一个路由字符串，但你也可以使用正则表达式通过\
  \ `this.route()` 来定义路由。\n\n第二个参数是路由的名称。通常这将是你想要调用的函数名称。但是，你可以为路由添加第三个回调参数。这意味着为路由事件触发的\
  \ `router:name` 将匹配第二个 `name` 参数，而不是函数名。实际执行的函数将是回调函数，而不是匹配路由名的函数。\n\n```\nthis.route('hello',\
  \ 'sayHello',\n        function(){ console.log('callback invoked');\n});\n```\n\n\
  在这个例子中，当路由匹配时，控制台将输出“callback invoked”，而不是执行 `sayHello` 函数。\n\n### 编程式导航\n\n在应用中，可能存在你想要保存为\
  \ URL 的节点，以便用户可以书签该节点以便稍后导航。为此，你可以使用 `navigate` 函数，前提是你已经调用了 `Backbone.history.start()`。\n\
  \n以下示例展示了当调用 `showBook` 函数时，`navigate` 如何在浏览器地址栏中创建一个新的 URL：\n\n```\nfunction showBook(name){\n\
  \        console.log('Show book ' + name);\n        router.navigate('book/'+name);\n\
  }\n\nshowBook('Backbone');\n```\n\n现在 URL 将显示模式 `#book/Backbone`。即使已经创建了一个处理此模式的路由，它也不会被上述代码调用。如果你确实希望触发路由器函数运行，你只需要在导航时传递一个额外的\
  \ `trigger` 参数即可。\n\n```\nMyRouter = Backbone.Router.extend({\n        routes: {'book(/:name)'\
  \ : 'displayBook' },\n        ....\n        displayBook: function(name){\n     \
  \           console.log('Displaying ' + name);\n        },\n        .....\n});\n\
  ```\n\n在设置了上述路由的情况下，以下代码将触发 `displayBook` 路由器函数：\n\n`router.navigate('book/'+name,\
  \ {trigger: true});`\n\n最后，如果你想要更改浏览器地址栏的 URL，但阻止程序在浏览器历史记录中添加一条记录，请确保将 `replace`\
  \ 选项设置为 `true`。\n\n`router.navigate('book/'+name, {trigger: true, replace:true});`\n\
  \n\n\n### 作为控制器的路由器\n\n在探讨模型-视图-*模式如何应用于 Backbone 时，我们提到路由器可以承担部分控制器的职责。毫无疑问，路由器很好地完成了其主要任务：处理应用中\
  \ URL 的变化，并将 URL 映射到应用中的函数。\n\n通过将路由器绑定到应用模型，它可以被用作应用级别的控制器。由于 URL 的变化隐含了应用状态的改变，模型可以随每个应用处理程序一同更新。假设我们有一个简单的模型用于追踪应用状态，本例中是当前书籍。\n\
  \n```\nAppModel = Backbone.Model.extend({\n\n    defaults: {\n        currentBook:\
  \ 'Beginning Backbone',\n    }\n\n});\n```\n\n可以添加变更监听器，以便任何被修改的属性都能调用其他操作或重新渲染视图。\n\
  \n```\ninitialize: function(){\n    this.on(\"change\", function(){\n        if(this.hasChanged('currentBook')){\n\
  \            alert('当前图书已更改');\n        }\n    });\n},\n```\n\n现在，这个模型可以在创建时作为参数提供给路由器。\n\
  \n```\nvar appModel = new AppModel();\nvar router = new MyRouter({model: appModel});\n\
  ```\n\n路由器的 `initialize` 函数会接收这个模型参数。这样，由于路由是在路由器中被调用的，模型就能获知这种应用状态的变化。\n\n```\n\
  MyRouter = Backbone.Router.extend({\n    model : null,\n    routes: {'book(/:name)'\
  \ : 'displayBook',\n        '' : 'start',\n        '*default': 'defaultRoute' },\n\
  \    initialize: function(options){\n        this.model = options.model;\n    },\n\
  \    ....\n    displayBook: function(name){\n        console.log('正在显示 ' + name);\n\
  \        this.model.set('currentBook', name);\n    },\n    ...\n});\n```\n\n这为我们的应用提供了一种模型-视图-控制器架构。一个共享的应用模型被同时传递给路由器和应用视图。路由器无需了解应用视图的任何信息，反之亦然。\n\
  \n当然，你可以应用多种变体。正如本章下一节所见，将应用路由与事件相结合会催生多种架构可能性。\n\n## Backbone 事件\n\n在介绍模型、集合、视图和路由器时，我们遇到了许多不同的事件，因为\
  \ Backbone 允许将事件添加到任何对象上。Backbone 事件模块使我们能够绑定和触发内置或自定义事件。\n\n所有 Backbone 对象（`View`、`Router`、`Collection`、`Model`）都包含了\
  \ Backbone 事件模块，但你也可以像下面这样，将 Backbone 事件功能扩展到任何基础对象上：\n\n```\nvar object = {};\n\
  _.extend(object, Backbone.Events);\n```\n\n下一节将在列举库内置事件之前，深入探讨事件在 Backbone 中的工作原理。\n\
  \n### 绑定事件\n\n绑定是指设置一个对象来监听特定事件的发生。这是通过 `.on` 函数完成的。该函数接受三个参数：事件名称、事件触发时要调用的函数，以及一个可选的执行上下文。\n\
  \n例如，在我们的模型对象中，如果希望某个属性发生变化时收到通知，需要监听的事件就是 `change`。\n\n```\nvar model = new Book();\n\
  model.on(\"change\", function(){\n    console.log('某个属性已被更改');\n});\n```\n\n回想一下，变更监听器包含一种形式，可以根据特定属性的变化来触发事件。例如，如果只想监听\
  \ `author` 属性的变化，事件名称应为 `change:author`。\n\n```\nmodel.on(\"change:author\", function(){\n\
  \    console.log('作者属性已被更改');\n});\n```\n\n你可以用空格分隔不同的事件名称，让 `.on` 事件处理程序处理多个不同事件。例如，要监听\
  \ `Book` 对象的作者或标题的变化，可以这样写：\n\n```\nmodel.on(\"change:author change:title\", function(){....});\n\
  ```\n\n你可以使用 `all` 事件名称添加一个特殊的监听器，它会监控所有事件。这允许你提供一个对象，将事件委托给适当的处理对象。\n\n```\nmonitor.on('all',\
  \ function(eventName){\n    delegateObject.trigger(eventName);\n});\n```\n\n最后，还可以像路由器中定义路由那样，通过提供\
  \ `事件名称: 处理程序` 的哈希表来设置事件处理。你甚至可以将事件委托给其他对象。例如，如果我们创建了一个简单的视图来渲染书籍模型，那么可以添加一个函数，允许外部对象（如路由器）更新该视图：\n\
  \n```\nBookView = Backbone.View.extend({\n    updateTitleView: function(){\n   \
  \     console.log('正在更新标题视图');\n    }\n});\n\nvar bookView = new BookView();\n```\n\
  \n现在，当创建 `Book` 对象的实例时，我们可以向 `.on` 函数传递一个事件哈希表，指示当 `name` 属性发生变化时调用 `updateTitleView`\
  \ 函数。\n\n```\nvar thisBook = new Book({name : 'Beginning Backbone',\n    author:\
  \ 'James Sugrue'});\nthisBook.on({ 'change:name': bookView.updateTitleView});\n\
  ```\n\n更改书的 `name` 属性将触发事件，进而调用 `bookView` 对象中的 `updateTitleView`。\n\n```\nthisBook.set('name',\
  \ \"Beginning Backbone.js\")\n```\n\n这种事件哈希表可以作为一种更简洁的方式，将所有对象的事件定义在一个地方，而无需将回调函数与事件定义内联在一起。\n\
  \n### 解除事件绑定\n\n当应用状态发生变化时，你可能不再需要监听某些事件。这种关闭监听器的行为称为解除绑定，通过 `.off` 函数实现。\n\n可以解除对特定事件的所有处理程序。例如，如果不再希望监听任何对象中书名的变化，以下代码将解除所有监听器：\n\
  \n```\nthisBook.off('change:name');\n```\n\n你也可以解除特定的处理程序。例如，如果之前使用的 `bookView`\
  \ 不再可见，可以仅解除它对名称变化事件的处理程序，而保持其他处理程序仍然有效。\n\n```\nthisBook.off('change:name', bookView.updateTitleView);\n\
  ```\n\n如果一个处理程序被用于多个事件且不再需要，可以使用 `null` 作为事件名称，将其与所有事件解除关联。\n\n```\nthisBook.off(null,\
  \ bookView.updateTitleView);\n```\n\n你还可以通过不带任何参数调用 `.off` 来移除特定对象上的所有监听器。\n\n```\n\
  thisBook.off();\n```\n\n这将移除此对象上的所有事件处理，包括 Backbone 内部事件。\n\n### 只监听一次事件\n\n有时，只需监听并响应一次事件，之后便不再关心，无需在事件处理完毕后费心解除绑定。\n\
  \nBackbone 提供了 `.once` 函数来实现此功能。它接受与 `.on` 处理程序相同的参数。\n\n```\nthisBook.once({ 'change:name':\
  \ bookView.updateTitleView});\n```\n\n在控制台中，如果你每次都使用不同的名称执行以下操作，你会看到它仍然只会被处理一次：\n\
  \n```\nthisBook.set('name', 'Beginning Backbone.js')\n```\n\n你会发现这在初始化期间检查事件或等待事件“下一次”触发时非常有用。\n\
  \n\n\n### 监听其他对象的事件\n\n我们已了解模型对象中的事件处理器如何调用独立视图对象中的函数。使用 `listenTo` 函数，一个对象（视图）也可以监听另一个对象（模型）上的所有事件。\n\
  \n理论上，以下两行代码是等效的：\n\n`thisBook.on({ 'change:name': bookView.updateTitleView });`\n\
  \n`bookView.listenTo(thisBook, 'change:name', bookView.updateTitleView);`\n\n然而，使用\
  \ `listenTo` 来追踪另一个对象上的事件更具优势，因为 `stopListening` 函数允许对象通过一次简单的函数调用完全断开所有事件连接。\n\n\
  `bookView.stopListening(model);`\n\n如果该对象正在监听多个不同对象的事件，只需在 `stopListening` 函数中不传入任何参数，即可一次性注销所有监听。\n\
  \n`bookView.stopListening()`\n\n为了保持一致性，Backbone 提供了与 `.once` 函数使用方式相同的 `listenTo`\
  \ 方法，即使用 `listenToOnce` 来处理事件：事件只处理一次，然后自动断开连接。\n\n`bookView.listenToOnce(thisBook,\
  \ 'change:name', bookView.updateTitleView);`\n\n### 触发事件\n\n到目前为止，我们研究的所有事件都是由 Backbone\
  \ 内部触发的。我们也可以在不执行本应触发事件的动作的情况下，直接触发事件。\n\n`.trigger` 函数允许将一个事件名称及任意数量的参数传递给事件处理器。你可以通过以下代码模拟一个\
  \ `change:name` 事件：\n\n`thisBook.trigger('change:name', {});`\n\n当然，你也可以触发自定义事件，而不是模仿内置事件。我们将在后面的“创建自定义事件”部分深入探讨。\n\
  \n### 内置事件\n\n如前所述，`Backbone.Event` 被包含在每个对象中。这些对象包括：\n\n-   `Backbone`\n-   `Backbone.Model`\n\
  -   `Backbone.Collection`\n-   `Backbone.View`\n-   `Backbone.Router`\n-   `Backbone.History`\n\
  \nBackbone 提供了许多内置事件，如下一节所述。当事件被触发时，回调函数中可以获取多个参数，这些参数在以下表格中列出。\n\n#### 集合事件\n\n\
  表 5-1 描述了用于处理集合的 Backbone 事件。\n\n**表 5-1.** `Backbone.Collection` 的事件\n\n| 事件 |\
  \ 回调参数 | 触发时机... |\n| --- | --- | --- |\n| `add` | `model`, `collection`, `options`\
  \ | 模型被添加到集合中时 |\n| `remove` | `model`, `collection`, `options` | 模型从集合中移除时 |\n\
  | `reset` | `collection`, `options` | 集合的全部内容被替换时 |\n| `sort` | `collection`, `options`\
  \ | 集合被重新排序时 |\n\n#### 模型事件\n\n表 5-2 描述了处理 `Backbone.Model` 时可使用的事件。\n\n**表 5-2.**\
  \ `Backbone.Model` 的事件\n\n| 事件 | 回调参数 | 触发时机... |\n| --- | --- | --- |\n| `change`\
  \ | `model`, `options` | 模型中的任何属性发生改变时 |\n| `change:[attribute]` | `model`, `value`,\
  \ `options` | 模型中的特定属性发生改变时 |\n| `destroy` | `model`, `collection`, `options` |\
  \ 模型被销毁时 |\n| `request` | `model`, `xhr`, `options` | 模型开始向服务器发送请求时 |\n| `sync`\
  \ | `model`, `xhr`, `options` | 模型与服务器成功同步时 |\n| `error` | `model`, `xhr`, `options`\
  \ | 模型的保存请求在服务器端失败时 |\n| `invalid` | `model`, `error`, `options` | 客户端的模型验证失败时。当定义了\
  \ `validate` 函数且调用模型的 `save` 函数时，通常会捕获此事件。 |\n\n#### 路由器和历史事件\n\n表 5-3 描述了与 `Backbone.Router`\
  \ 类相关的事件。\n\n**表 5-3.** `Backbone.Router` 的事件\n\n| 事件 | 回调参数 | 触发时机... |\n| ---\
  \ | --- | --- |\n| `route:[name]` | `params` | 特定的路由被匹配到时 |\n| `route` | `router`,\
  \ `route`, `params` | 任何路由被匹配到时（由 history 或 router 触发） |\n\n#### 全局事件\n\n表 5-4 描述了在\
  \ Backbone 应用中全局使用的事件。\n\n**表 5-4.** Backbone 应用中的全局事件\n\n| 事件 | 回调参数 | 触发时机...\
  \ |\n| --- | --- | --- |\n| `all` | `eventName` | 整个应用中任何事件被触发时 |\n\n### 创建自定义事件\n\
  \n除了使用 Backbone 提供的任何事件外，你还可以创建自己的事件，以便在应用中的任何对象之间实现解耦通信。例如，当一个模型更新时，你可能希望另一个模型或视图对此事件作出响应。\n\
  \n想象一个简单的例子：如果 `Book` 模型的 `name` 和 `author` 属性都为 `null`，你想要触发一个特定事件。事件命名的惯例是使用冒号分隔的标识符，例如\
  \ `model:useless`。\n\n由于事件在全局 `Backbone` 对象上可用，这意味着你可以在代码中的任何位置设置全局监听器。\n\n```js\n\
  Backbone.on('model:useless', function(){\n    console.log('模型无用的全局监听器被调用');\n  \
  \  // 在此处进行更具体的处理\n});\n```\n\n触发这个全局事件可以在模型的变更监听器中处理，该监听器用于处理这两个属性中的任何一个发生改变的情况。\n\
  \n```js\nthisBook.on('change:name change:author', function(model, value, options){\n\
  \    if(model.get('name') === null && model.get('author') === null){\n        console.log('现在触发事件');\n\
  \        Backbone.trigger('model:useless', {});\n    }\n});\n```\n\n现在，如果你在控制台中执行以下两条命令，该事件就会被触发：\n\
  \n`thisBook.set('name', null);`\n\n`thisBook.set('author', null);`\n\n请注意，你也可以通过应用的事件总线传递参数。例如，可以传递触发该事件的模型。\n\
  \n`Backbone.trigger('model:useless', {model:model});`\n\n然后，处理回调函数就可以处理任何可用的参数。\n\
  \n```js\nBackbone.on('model:useless', function(data){\n    console.log(data.model.get('name'));\n\
  \    console.log('模型无用的全局监听器');\n});\n```\n\n### 监听 DOM 事件\n\n正如我们在第 4 章中所述，我们可以监听\
  \ DOM 上的事件，并将这些事件绑定到回调函数。这些事件键总是以 jQuery 选择器的形式定义，例如 `<event> #<elementid>` 或 `<event>\
  \ .<elementclass>`，其中 `event` 可以是任何交互，如 `click`、`mouseover`、`blur` 或 `keypress`。\n\
  \n如果你在 Backbone 中使用 jQuery，可以查阅 jQuery 事件列表来了解视图可以响应的所有事件：[`api.jquery.com/category/events/`](http://api.jquery.com/category/events/)。\n\
  \n通常，这些事件绑定在定义视图时的 `events` 哈希中提供。\n\n```js\nLibraryView = Backbone.View.extend({\n\
  \    // ...\n    events: {\n        'click' : 'alertBook'\n    },\n    // ...\n\
  \    alertBook: function(e){\n        alert('书本被点击');\n    },\n    // ...\n});\n\
  ```\n\n\n\n## 摘要\n\n本章我们探讨了路由器和事件。通过使用 `Backbone.Router` 配合 `Backbone.History`，我们学习了如何在应用中提供可添加书签的\
  \ URL，以便稍后重新访问应用的特定部分。\n\n我们还了解了 `Backbone.Events` 如何跨所有对象工作，在一个位置处理事件，并在其他位置触发它们。尽管\
  \ Backbone 已经提供了丰富的内置事件集，你仍可添加自己的事件类型，以实现应用内部的解耦通信。我们在回顾 `Backbone.View` 如何与 DOM\
  \ 触发的事件无缝交互后，完成了事件部分的学习。\n\n在下一章中，我们将开始构建一个真实的 Backbone 应用，应用前三章涵盖的所有概念。\n\n"
- "# 6. 从始到终：一个完整的应用示例\n\n## 摘要\n\n既然我们已经掌握了 Backbone 的核心概念，是时候将所有内容整合起来，创建一个功能完备的应用了。本章将带你经历构建由\
  \ Backbone 支持的应用所需的各个阶段，从设计阶段开始，最终打造出一个高质量的 Twitter 应用。我们还将介绍一种更具结构化的方法来编写应用代码，而不是像前几章那样仅仅将其插入\
  \ `<script>` 标签之间。\n\n## 设计你的应用\n\n在深入代码之前，重要的是退一步，明确应用的核心功能。这能让我们以更结构化的方式进行 JavaScript\
  \ 开发。理解所表示的数据将有助于你决定如何定义模型。例如，了解屏幕的哪些部分需要动态更新，能告诉你需要哪些视图。\n\n我们的示例是一个基于 Twitter\
  \ 的应用，它将展示认证用户账户的概览，包括以下内容：\n\n- 用户时间线中的最新推文\n- 关注者数和正在关注的人数\n- 搜索 Twitter 的功能\n\
  \n图 6-1 中的线框图标识了将出现的主要视图。\n\n![A978-1-4302-6335-7_6_Fig1_HTML.jpg](img/A978-1-4302-6335-7_6_Fig1_HTML.jpg)\n\
  \n图 6-1. 展示主要视图的简单线框图\n\n从图 6-1 中可以看出，应用有一个主视图以及若干子视图。很明显，主页面上至少有三个独立的视图部分。\n\n\
  - 时间线\n- 用户个人资料数据\n- 搜索视图\n\n尽管搜索框是静态的，但其背后的功能需要为搜索结果构建一个视图，并可能使用路由器使搜索可添加书签。\n\n\
  ### CSS 样式\n\n为了避免需要处理 CSS 来设计应用样式，我使用了 MetroUI CSS 库（[`metroui.org.ua/`](http://metroui.org.ua/)），它给应用带来了一种锐利的\
  \ Windows 8 外观。当然，你也可以使用自己的自定义样式或其他 UI 库，如 Bootstrap（[`github.com/twbs/bootstrap`](https://github.com/twbs/bootstrap)）。\n\
  \n### 应用领域\n\n我选择 Twitter 作为此应用的示例领域，这样我们可以避免过多担心后端服务，并轻松接入现有 API。本章所阐述的原则适用于任何应用，因此不要让对\
  \ Twitter 的关注分散你的注意力。主要任务是理解视图、集合、模型和路由器之间的交互。\n\n## 应用代码结构\n\n对于任何非琐碎的 Backbone\
  \ 项目，在开始时定义清晰的代码结构都是至关重要的。虽然将 HTML、JavaScript 和 CSS 放在不同的目录中显然是好的做法，但也值得对 Backbone\
  \ 对象类型进行分组。这意味着你应该为应用 JavaScript 设置以下类型的目录结构，位于 `js/app` 目录下。\n\n`app.js`\n\n`view/`\n\
  \n`model/`\n\n`collection/`\n\n`router/`\n\n`util/`\n\n`app.js` 文件充当应用的主入口点，而文件夹则充当项目其余部分的包结构。如果你曾使用过\
  \ Java 或 C# 等其他语言进行开发，那么这种组织代码的方法会令你感到熟悉。\n\n这些文件夹内的每个对象还应进行命名空间处理，以使代码更具可读性并避免命名冲突。例如，我们稍后将在本章中创建的\
  \ `TimelineView` 定义了以下命名空间：\n\n```\nvar com = com || {};\ncom.apress = com.apress\
  \ || {};\ncom.apress.view = com.apress.view || {};\ncom.apress.view.TimelineView\
  \ = Backbone.View.extend({\n```\n\n这意味着当我们创建 `TimelineView` 的新实例时，可以使用以下代码：\n\n\
  ```\nvar timelineView = new com.apress.view.TimelineView();\n```\n\n作为应用的主入口点，`app.js`\
  \ 负责创建应用的初始状态。这通常涉及创建若干视图、创建一个路由器以及启动 Backbone 历史记录。\n\n在 `app.js` 中的代码执行之前，页面中的所有内容都需要加载完成，因此你通常会将代码放在一个块中，例如\
  \ jQuery 的 `$(function(){ });`。以下代码片段说明了这一点：\n\n```\n$(function() {\n    var timelineView\
  \ = new com.apress.view.TimelineView(),\n        router = new com.apress.router.AppRouter();\n\
  \    Backbone.history.start();\n});\n```\n\n### 外部依赖\n\n此项目将有一些外部依赖项。正如我们已经看到的，要使用\
  \ Backbone，我们需要引入 `Backbone.js`、`Underscore.js` 和 `jQuery`。如果你愿意，也可以选择模板库。我通常为我的应用选择\
  \ Handlebars，因为我认为它的表达性和可扩展性最为实用。所有这些外部库都放在应用的 `js/external` 目录中。\n\n在样式方面，该应用还将使用\
  \ MetroUI 项目中的 `modern.css`。该文件将包含在 `css` 目录中。\n\n图 6-2 展示了应用的文件夹结构。\n\n![A978-1-4302-6335-7_6_Fig2_HTML.jpg](img/A978-1-4302-6335-7_6_Fig2_HTML.jpg)\n\
  \n图 6-2. 典型 Backbone 应用的结构\n\n\n\n### 整合所有组件\n\n您的主 HTML 页面将负责整合所有组件，包括样式表、模板以及外部\
  \ JavaScript 库。\n\n以下代码展示了您的主页（index page）代码可能呈现的样子。您会注意到每个 JavaScript 工件都是单独引入的。稍后我们会探讨如何将这些文件合并成一个脚本文件。然而，您会发现通过引入未压缩形式的文件来调试代码会容易得多。\n\
  \n```\n<html>\n<head>\n    <title>入门 Backbone Twitter 示例</title>\n    <link rel='stylesheet'\
  \ href='css/modern.css'>\n    <link rel=\"stylesheet\" href=\"css/style.css\">\n\
  \    <!-- 其他 CSS 文件在此处 -->\n</head>\n<body class='metrouicss'>\n<!-- HTML 内容与 div\
  \ 占位符 -->\n<div id='timeline' class='timeline-view'>\n     <h2>我的推文</h2>\n</div>\n\
  <!-- Handlebars 模板 -->\n<script type=\"text/x-handlebars-template\" id=\"timeline-template\"\
  >\n<ul class='listview'>\n        {{#each tweet}}\n        <li>\n          <div\
  \ class='icon'>\n                  <img src='{{user.profile_image_url}}'></img>\n\
  \          </div>\n            <div class='data'>\n                <h4>{{user.name}}</h4>\n\
  \                <p>{{text}}</p>\n            </div>\n        </li>\n        {{/each}}\n\
  </ul>\n</script>\n<!-- 外部库引入 -->\n<script src=\"js/external/jquery-1.10.2.js\"></script>\n\
  <script src=\"js/external/underscore.js\"></script>\n<script src=\"js/external/backbone.js\"\
  ></script>\n<script src=\"js/external/handlebars.js\"></script>\n<!-- 模型 -->\n<script\
  \ src=\"js/app/model/Tweet.js\"></script>\n...\n<!-- 集合 -->\n<script src=\"js/app/collection/Timeline.js\"\
  ></script>\n.....\n<!-- 视图 -->\n<script src=\"js/app/view/TimelineView.js\"></script>\n\
  .....\n<!-- 路由器 -->\n<script src=\"js/app/router/AppRouter.js\"></script>\n.....\n\
  <!-- 此应用的主入口 -->\n<script src=\"js/app/app.js\"></script>\n</body>\n</html>\n```\n\
  \n## 第一步：处理认证\n\n在使用任何 API 时，您很可能需要处理一些安全要求，例如连接时的授权。本节将帮助您开始为使用 Twitter API 的客户端设置认证。\n\
  \n### 在 Twitter 上设置应用\n\n在让我们的应用使用 Twitter API 之前，我们需要在 `https://dev.twitter.com/apps`\
  \ 上做一些准备工作，并为我们的客户端设置授权。\n\n注意：为简单起见，我们的应用将使用应用级认证，这意味着在接下来的步骤中，您所使用的开发者账号在使用 Twitter\
  \ API 时将被视为当前用户。这样我们就不需要在客户端应用中处理登录流程了。\n\n假设您已经拥有一个 Twitter 账号，只需登录并点击“创建新应用”按钮，即可开始定义您应用的详细信息。在第一个页面上，您只需要填写一些关于应用的简单信息。请确保将应用设置为具有“读取、写入和发送直接消息”权限。\n\
  \n接下来的页面（如图 6-3 所示）是您需要提供应用最重要信息的地方：消费者密钥（consumer key）和消费者密钥密文（consumer secret）。\n\
  \n![A978-1-4302-6335-7_6_Fig3_HTML.jpg](img/A978-1-4302-6335-7_6_Fig3_HTML.jpg)\n\
  \n图 6-3. 来自 Twitter 应用的 OAuth 设置\n\n图 6-3 中的消费者密钥密文已被遮挡，因为此信息必须保密。正如我在图中小心隐藏密钥密文一样，您也应在\
  \ JavaScript 代码中将其保密。任何人都能查看网页的源代码，因此您绝不应将密钥包含在 JavaScript 中。通过选择“OAuth 工具”选项卡，您将获得客户端应用连接所需的所有四个密钥。\n\
  \n### 在服务器端保存密钥\n\n对于此应用，我们将运行一个中间 node 服务器，该服务器将接收来自客户端应用的所有调用，并将这些请求转发给 Twitter。这确保了密钥密文存储在服务器端。图\
  \ 6-4 展示了这一管道流程。\n\n![A978-1-4302-6335-7_6_Fig4_HTML.jpg](img/A978-1-4302-6335-7_6_Fig4_HTML.jpg)\n\
  \n图 6-4. node.js 服务器角色示意图\n\nnode.js 服务器的源代码与我们之前章节创建的类似。不过，为了使处理 Twitter API 更简便，我使用了\
  \ Tolga Tezel 开发的 Twitter node 包（`https://github.com/ttezel/twit`）。您只需使用 `npm install\
  \ twit` 即可安装该包。\n\n您需要在项目中使用 `require()` 函数引入这个库，然后按照下面 `connectToTwitter()` 函数中列出的步骤进行认证。\n\
  \n```\nvar Twit = require('twit')\nvar client = null;\n\nfunction connectToTwitter(){\n\
  \   client = new Twit({\n        consumer_key:         '<您的消费者密钥>',\n        consumer_secret:\
  \      '<您的消费者密钥密文>',\n        access_token:         '<您的访问令牌>',\n        access_token_secret:\
  \  '<您的访问令牌密文>'\n  });\n}\n\n//让应用连接到 Twitter。\nconnectToTwitter();\n```\n\n一旦此代码执行完毕，`twitterClient`\
  \ 对象将被设置好，能够与完整的 Twitter API 进行交互。为了完整性，以下是 `server.js` 到目前为止的完整源代码，尚未添加任何处理客户端\
  \ GET 和 POST 方法的功能：\n\n```\n/**\n * 一个在 localhost:8080/books 下提供的简单 API\n */\nvar\
  \ express = require('express');\nvar app = express();\nvar Twit = require('twit')\n\
  var client = null;\n\nfunction connectToTwitter(){\n   client = new Twit({\n   \
  \     consumer_key:         '<您的消费者密钥>',\n        consumer_secret:      '<您的消费者密钥密文>',\n\
  \        access_token:         '<您的访问令牌>',\n        access_token_secret:  '<您的访问令牌密文>'\n\
  \  });\n}\n\n//让应用连接到 Twitter。\nconnectToTwitter();\n\n//额外设置以允许 CORS 请求\nvar allowCrossDomain\
  \ = function(req, response, next) {\n    response.header('Access-Control-Allow-Origin',\
  \ \"http://localhost\");\n    response.header('Access-Control-Allow-Methods', 'OPTIONS,\
  \ GET,PUT,POST,DELETE');\n    response.header('Access-Control-Allow-Headers', 'Content-Type');\n\
  \    if ('OPTIONS' == req.method) {\n      response.send(200);\n    }\n    else\
  \ {\n      next();\n    }\n};\n\napp.configure(function() {\n    app.use(allowCrossDomain);\n\
  \  //解析请求体中的 JSON 对象\n    app.use(express.bodyParser());\n});\n\n//在端口 8080 上启动应用\n\
  app.listen(8080);\n```\n\n现在，我们可以开始为服务器构建额外功能，以便客户端应用可以接入。\n\n### 展示 Twitter 时间线\n\
  \n我们要做的第一件事是创建一个简单的模型和视图，以便能够看到当前用户的 Twitter 时间线。\n\n首先，我们需要在 node.js 服务器上设置一个端点，用来响应时间线的请求。这将利用\
  \ Twitter 库来检索多个“推文对象”。以下代码应放入 node 服务器的 `server.js` 文件中：\n\n```\n/**\n * 返回当前用户的\
  \ Twitter 时间线\n**/\napp.get('/timeline', function (request, response) {\n    response.header('Access-Control-Allow-Origin',\
  \ '*');\n     client.get('statuses/home_timeline', { },  function (err, reply) {\n\
  \      if(err){\n        response.send(404);\n      }\n      if(reply){\n      \
  \  response.json(reply);\n      }\n    });\n});\n```\n\n\n\n### 数据层\n\n让我们重点关注用于从服务器访问时间线信息的模型和集合。模型无需设置任何默认属性，因为它们都将来自\
  \ Twitter API 的响应。这样，我们就得到了目前最简单的模型类，尽管随着进展，可能会添加更多细节。以下代码应放在`model`目录下的`Tweet.js`文件中：\n\
  \n```\nvar com = com || {};\ncom.apress = com.apress || {};\ncom.apress.model =\
  \ com.apress.model || {};\ncom.apress.model.Tweet = Backbone.Model.extend({\n\n\
  });\n```\n\n集合将负责与服务器的连接，检索推文列表，每条推文将由一个`Tweet`对象表示。以下代码应放在`collection`目录下的`Timeline.js`文件中：\n\
  \n```\nvar com = com || {};\ncom.apress = com.apress || {};\ncom.apress.collection\
  \ = com.apress.collection || {};\ncom.apress.collection.Timeline = Backbone.Collection.extend({\n\
  \    //该集合使用的模型\n    model: com.apress.model.Tweet,\n    //集合连接的服务端 URL\n    url:\
  \ 'http://localhost:8080/timeline',\n    initialize: function(options){\n      \
  \  //在此定义构造时需要初始化的内容\n    },\n});\n```\n\n集合的关键部分是`model`属性和`url`属性，前者指定了该集合使用哪个\
  \ Backbone 模型对象，后者定义了提供时间线信息的 REST 服务。\n\n在进一步操作之前，您可以通过创建集合的新实例并调用`fetch`函数来测试它。现在，以下代码可以放在`app.js`中：\n\
  \n```\nvar timeline = new com.apress.collection.Timeline();\ntimeline.fetch();\n\
  ```\n\n如果您查看 Chrome 开发者工具中的 Network 标签，并观察 XHR 请求，您会看到时间线集合调用了正确的服务，并且该服务返回了数据。\n\
  \n![A978-1-4302-6335-7_6_Fig5_HTML.jpg](img/A978-1-4302-6335-7_6_Fig5_HTML.jpg)\n\
  \n图 6-5. 从时间线集合调用的 XHR 请求示例\n\n值得注意的是 Preview 窗格中响应的结构。您将收到一个条目数组，其中每一个都会被解析到`Tweet`模型中。在图\
  \ 6-6 中，您可以看到所有返回属性的列表。\n\n![A978-1-4302-6335-7_6_Fig6_HTML.jpg](img/A978-1-4302-6335-7_6_Fig6_HTML.jpg)\n\
  \n图 6-6. 时间线响应的结构\n\n#### 为时间线构建视图\n\n数据层已经就绪，现在是时候为这些数据构建一个视图了。我们首先准备一些 HTML 代码，以便列出时间线中的所有推文。通常，您会为每个视图创建一个`div`，这个`div`的\
  \ ID 将作为 Backbone 视图中的`el`变量。以下所有 HTML 代码应放在`index.html`中：\n\n```\n<div id='timeline'\
  \ class='timeline-view'>\n    <h2>我的推文</h2>\n</div>\n```\n\n我们还将为集合创建一个 Handlebars\
  \ 模板。我们无需在 JavaScript 代码中使用`for`循环来逐一渲染每条推文，而是可以利用 Handlebars 内置的辅助函数来遍历集合。\n\n\
  ```\n<script type=\"text/x-handlebars-template\" id=\"timeline-template\">\n   \
  \ <ul class='listview'>\n        {{#each tweet}}\n            <li>\n           \
  \     <div class='icon'>\n                    <img src='{{user.profile_image_url}}'></img>\n\
  \                </div>\n                <div class='data'>\n                  \
  \  <h4>{{user.name}}</h4>\n                    <p>{{text}}</p>\n               \
  \ </div>\n            </li>\n        {{/each}}\n    </ul>\n</script>\n```\n\n现在我们可以创建一个处理时间线的视图。首先，我们将视图与\
  \ HTML 中定义的元素挂钩：视图的`div`元素和用于渲染集合数据的模板。以下代码应放在`view`目录下的`TimelineView.js`文件中。\n\n\
  ```\nvar com = com || {};\ncom.apress = com.apress || {};\ncom.apress.view = com.apress.view\
  \ || {};\ncom.apress.view.TimelineView = Backbone.View.extend({\n    el: '#timeline',\n\
  \    template: Handlebars.compile($(\"#timeline-template\").html()),\n    initialize:\
  \  function(options){\n    },\n    render: function(){\n    },\n});\n```\n\n正如我们之前所述，Backbone\
  \ 不是一个固执己见的框架，这意味着在使用集合与视图时，您有几种选择。\n\n- 您可以在视图内部初始化集合。\n- 您可以在外部的 `app.js` 中，甚至在路由器中初始化集合，并将其作为参数传递给视图。\n\
  \n对于本示例，我们将在视图的`initialize`函数中创建集合。该集合（此处为`timeline`）作为类变量添加到视图中，以便不同函数可以共享它。\n\n\
  ```\ninitialize:  function(options){\n    var self = this;\n    //为此视图创建一个集合进行渲染\n\
  \    self.timeline = new com.apress.collection.Timeline();\n    //初始渲染\n    self.render();\n\
  \    //强制 fetch 触发 reset 事件\n    self.timeline.fetch({reset:true});\n    self.listenTo(self.timeline,\
  \ 'reset', self.render);\n},\n```\n\n最后两行在这个`initialize`函数中至关重要。我们强制对集合执行`fetch`操作，并传入一个布尔标志，指示`fetch`应触发\
  \ reset 事件。\n\n视图监听时间线的任何变化，当它发生变化时，`render`函数将被执行。\n\n`render`函数非常简单；只要`timeline`集合中存在模型，它们就会被传递给模板。\n\
  \n```\nrender: function(){\n    var self = this;\n    if(self.timeline.models.length\
  \ > 0){\n        var output = self.template({tweet: self.timeline.toJSON()});\n\
  \        self.$el.append(output);\n    }\n    return self;\n},\n```\n\nHandlebars\
  \ 会遍历每条推文（`{{#each tweet}}`），因此传递给模板的 JSON 必须命名为`tweet`。该视图的完整代码清单如下：\n\n```\nvar\
  \ com = com || {};\ncom.apress = com.apress || {};\ncom.apress.view = com.apress.view\
  \ || {};\ncom.apress.view.TimelineView = Backbone.View.extend({\n    el: '#timeline',\n\
  \    template: Handlebars.compile($(\"#timeline-template\").html()),\n    timeline:\
  \ null,\n    initialize:  function(options){\n        var self = this;\n       \
  \ //为此视图创建一个集合进行渲染\n        self.timeline = new com.apress.collection.Timeline();\n\
  \        //初始渲染\n        self.render();\n        //强制 fetch 触发 reset 事件\n      \
  \  self.timeline.fetch({reset:true});\n        self.listenTo(self.timeline, 'reset',\
  \ self.render);\n    },\n    render: function(){\n        var self = this;\n   \
  \     if(self.timeline.models.length > 0){\n            var output = self.template({tweet:\
  \ self.timeline.toJSON()});\n            self.$el.append(output);\n        }\n \
  \       return self;\n    },\n});\n```\n\n接下来，我们将设置`app.js`，使其只创建这个视图。因为视图负责创建集合，所以无需在视图中定义它。此外，我们还没有设置任何应用路由，因此暂时不必担心\
  \ history 或任何路由器。\n\n```\nvar timelineView = new com.apress.view.TimelineView();\n\
  ```\n\n只要您包含了迄今为止创建的所有 JavaScript，导航到您的`index.html`页面将运行整个应用程序，并显示类似图 6-7 的输出。\n\
  \n![A978-1-4302-6335-7_6_Fig7_HTML.jpg](img/A978-1-4302-6335-7_6_Fig7_HTML.jpg)\n\
  \n图 6-7. 使用`TimelineView`渲染 Twitter 时间线集合的结果\n\n\n\n### 视图优化：显示时间戳\n\n我们来看看如何优化应用中每条推文的显示效果。其中值得添加的一项内容是每条推文的时间戳。但如果你查看模型，会发现`created_at`属性下的时间戳又长又繁琐。更好的做法是效仿[`Twitter.com`](http://twitter.com/)网站的处理方式，显示推文发布的相对时间（如“多久以前”）。\n\
  \n为此，我们可以使用[Moment.js](http://momentjs.com/)库，它提供了用户友好的方式来解析、处理和格式化日期。首先，你需要下载该库并在`index.html`中引用它。在本示例中，我下载的是完整的\
  \ Moment.js 库，因此引用文件名为`moment.js`，而默认的包实际上是压缩版本。\n\n```\n<script src=\"js/external/moment.js\"\
  ></script>\n```\n\n与其在负责渲染的 JavaScript 中添加格式化数据的代码，不如在 Backbone 从服务器返回数据并解析模型时，为模型新增一个属性。\n\
  \n为此，我们将在`Tweet.js`中扩展`Tweet`模型，添加一个`parse`函数。\n\n```\nparse: function(model){\n\
  \n    //model.created_at \"Wed Aug 28 06:32:07 +0000 2013\"\n\n    var friendly\
  \ = moment(model.created_at, \"ddd MMM DD HH:mm:ss ZZ YYYY\").fromNow();\n\n   \
  \ model.friendlyDate = friendly;\n\n    return model;\n\n}\n```\n\n如果检查模型，你会发现`created_at`数据的格式类似于`Wed\
  \ Aug 28 06:32:07 +0000 2013`。要解读这个日期，你需要告诉 Moment.js 其格式，即`ddd MMM DD HH:mm:ss\
  \ ZZ YYYY`。一旦创建了有效日期，Moment.js 就会通过其`fromNow`函数生成一个友好的字符串，并在`parse`函数返回之前将其添加到模型中。\n\
  \n需要记住一点：如果你在模型中添加了`parse`方法的实现，请确保始终在末尾返回该模型。\n\n### 视图优化：高亮显示用户名\n\n另一个优化是从推文中提取所有`@用户名`部分，并将其转换为查看用户资料的链接。由于这是对推文显示方式的增强，而非数据本身的修改，因此将相关代码放在渲染端是完全可以接受的。\n\
  \n我们可以通过为 Handlebars 添加一个辅助函数来实现这一点。这样，我们就可以在模板中以表达式的形式实现高亮功能。\n\n首先，创建一个新的 JavaScript\
  \ 文件来存放辅助函数，并将其保存在`util`目录下。然后，使用`Handlebars.registerHelper`函数在此处创建一个新的辅助程序，传入将在模板中使用的辅助函数名称及其将处理的参数。别忘了将你为辅助程序创建的文件包含在主\
  \ HTML 页面中。在本例中，我将该文件命名为`helpers.js`，并放在`utils`目录下。\n\n我在 Simon Whatley 的博客（[www.simonwhatley.co.uk/parsing-twitter-usernames-hashtags-and-urls-with-javascript](http://www.simonwhatley.co.uk/parsing-twitter-usernames-hashtags-and-urls-with-javascript)）上找到了一段有用的\
  \ JavaScript 代码，它提供了一个正则表达式，用于将`@用户名`部分替换为链接。\n\n请注意，字符串被解析后，需要作为`SafeString`返回。每当你添加一个创建自己\
  \ HTML 代码的辅助函数时，很可能需要使用此类型，因为它会对 HTML 代码进行转义，使其按预期显示。\n\n```\n$(function() {\n\n\
  \    Handlebars.registerHelper('format', function (str) {\n\n        if(str){\n\n\
  \            //高亮 @ 部分\n\n            str = str.replace(/[@]+[A-Za-z0-9-_]+/g,\n\
  \n                function(u) {\n\n                    var username = u.replace(\"\
  @\",\"\");\n\n                    return u.link(\"http://twitter.com/\"+username);\n\
  \n                });\n\n            return new Handlebars.SafeString(str);\n\n\
  \        }else{\n\n            return str;\n\n        }\n\n    });\n\n});\n```\n\
  \n现在，HTML 页面中的模板可以通过将`{{text}}`替换为`{{format text}}`来轻松处理此功能。\n\n```\n<script type=\"\
  text/x-handlebars-template\" id=\"timeline-template\">\n\n    <ul class='listview'>\n\
  \n        {{#each tweet}}\n\n        <li>\n\n            <div class='icon'>\n\n\
  \                <img src='{{user.profile_image_url}}'></img>\n\n            </div>\n\
  \n            <div class='data'>\n\n                <h4>{{user.name}}</h4>\n\n \
  \               <p>{{format text}}</p>\n\n                <p class=\"timestamp\"\
  ><i>{{friendlyDate}}</i></p>\n\n            </div>\n\n        </li>\n\n        {{/each}}\n\
  \n    </ul>\n\n</script>\n```\n\n## 添加个人资料视图\n\n时间线只是我们整体应用程序中的一个视图。此示例的目的是展示如何将多个视图组合在一起并相互作用，以提供更好的用户体验。本节将展示如何向应用程序添加更多视图，以及如何处理单个模型而非集合。\n\
  \n### 个人资料数据层\n\n个人资料视图将非常简单。我们所要做的就是从 Twitter API 显示你自己的个人资料详情——全名、简介和关注者数量。由于我们只会获取一条记录，因此在这种情况下不需要集合；一个模型就足够了。\n\
  \n与`Tweet`模型一样，以下内容应放置在`model`目录中，并带有命名空间前缀`com.apress.model`：\n\n```\nvar com =\
  \ com || {};\n\ncom.apress = com.apress || {};\n\ncom.apress.model = com.apress.model\
  \ || {};\n\ncom.apress.model.Profile = Backbone.Model.extend({\n\n    urlRoot: 'http://localhost:8080/profile',\n\
  \n    parse: function(model){\n\n        return model;\n\n    }\n\n});\n```\n\n\
  该模型无需额外操作，因为它只会返回从端点获取的数据。\n\n在你的 node.js 服务器的`server.js`文件中，你需要包含一个响应`/profile`请求的函数。\n\
  \n```\n/**\n\n * 获取所提供 ID 用户的账户设置。\n\n **/\n\napp.get('/profile', function(request,\
  \ response){\n\n    response.header('Access-Control-Allow-Origin', '*');\n\n   \
  \ client.get('users/show', {screen_name: 'sugrue'},  function (err, reply) {\n\n\
  \        if(err){\n\n            console.log('Error: ' + err);\n\n            response.send(404);\n\
  \n        }\n\n        if(reply){\n\n            /// console.log('Reply: ' + reply);\n\
  \n            response.json(reply);\n\n        }\n\n    });\n\n});\n```\n\n要从 Twitter\
  \ API 获取个人资料详情，你需要使用`users/show` API 端点并传递一个 screen name。由于我们只想获取你自己的个人资料详情，因此在此处传递你自己的\
  \ Twitter 用户名即可。\n\n\n\n### 个人资料视图\n\n需要修改主页面，为右侧的个人资料视图腾出空间。我们将使用 MetroUI 提供的部分\
  \ CSS 网格规则，以更合理的方式布局页面。\n\n```\n<div id=\"app\" class=\"grid\">\n    <div class=\"\
  row\">\n        <div class=\"span8\">\n            <div id='timeline' class='timeline-view'>\n\
  \                <h2>我的推文</h2>\n            </div>\n        </div>\n        <div\
  \ class=\"span4\">\n            <div id=\"profile\" class=\"profile-view\">\n  \
  \              <!-- 个人资料视图写在此处 -->\n            </div>\n        </div>\n    </div>\n\
  </div>\n```\n\n由于时间线是页面最重要的部分，因此分配了八列宽度，而包含个人资料视图的侧边栏仅需四列。我们还将对时间线详情使用的模板进行微调，为\
  \ `<ul>` 列表添加 `fluid` 类，以便充分利用网格中的额外空间。\n\n```\n<script type=\"text/x-handlebars-template\"\
  \ id=\"timeline-template\">\n    <ul class='listview fluid'>\n        .....\n</script>\n\
  ```\n\n在离开 `index.html` 之前，我们将添加一个模板来存放个人资料详情。此容器的轮廓如图 6-8 所示。\n\n![A978-1-4302-6335-7_6_Fig8_HTML.jpg](img/A978-1-4302-6335-7_6_Fig8_HTML.jpg)\n\
  \n**图 6-8.** 个人资料视图轮廓\n\nMetroUI 有一个非常符合此需求的 `tile` 类，因此模板将使用部分这些 CSS 样式来实现此外观。\n\
  \n```\n<!-- 个人资料模板 -->\n<script type=\"text/x-handlebars-template\" id=\"profile-template\"\
  >\n    <div class='tiles clearfix'>\n        <div class=\"tile double bg-color-orangeDark\"\
  >\n            <div class=\"tile-content\">\n                <img src=\"{{user.profile_image_url}}\"\
  \ class=\"place-left\">\n                <h3 style=\"margin-bottom: 5px;\">{{user.name}}</h3>\n\
  \                <p>{{user.description}}</p>\n                <div class=\"brand\"\
  >\n                    <div class=\"badge\">{{user.followers_count}} 关注者</div>\n\
  \                </div>\n            </div>\n        </div>\n    </div>\n</script>\n\
  ```\n\n`badge` 样式确实需要一点改动：对于我们想要显示关注者数量的文本长度来说，它太窄了。与任何 HTML 应用程序一样，我们只需在 `style.css`\
  \ 中扩展 CSS 定义即可。\n\n```\n.badge{\n    width: 200px!important;\n    height: 24px;\n\
  }\n```\n\n这就引出了应用程序中个人资料定义的最后部分：用于表示详情的 Backbone 视图。此视图的代码与 `TimelineView` 非常相似。尽管\
  \ `ProfileView` 将处理模型而非集合，但视图级别的差异很小。\n\n`initialize` 函数将创建一个新的 `Profile` 模型实例，然后通过调用\
  \ `fetch` 函数从服务器请求内容。以下代码应放置在 `view` 目录下的 `ProfileView.js` 中：\n\n```\nvar com =\
  \ com || {};\ncom.apress = com.apress || {};\ncom.apress.view = com.apress.view\
  \ || {};\n\ncom.apress.view.ProfileView = Backbone.View.extend({\n    el: '#profile',\n\
  \    template: Handlebars.compile($(\"#profile-template\").html()),\n    model:\
  \ null,\n    initialize:  function(options){\n        var self = this;\n       \
  \ //为此视图创建一个集合以进行渲染\n        self.model = new com.apress.model.Profile();\n    \
  \    //强制 fetch 触发 reset 事件\n        self.model.fetch({});\n        self.listenTo(self.model,\
  \ 'change', self.render);\n    },\n    render: function(){\n        var self = this;\n\
  \            var output = self.template({user: self.model.toJSON()});\n        \
  \    self.$el.html(output);\n        return self;\n    },\n});\n```\n\n`render`\
  \ 函数会重置包含个人资料模板内容的 `div` 元素的整个 HTML（该元素以个人资料 ID 标记）。\n\n### 整合所有内容\n\n只需再执行几个步骤，即可将个人资料视图正确地集成到应用程序中。首先，需要扩展\
  \ `index.html` 以包含新的 JavaScript 源文件。\n\n```\n<script src=\"js/app/model/Profile.js\"\
  ></script>\n<script src=\"js/app/view/ProfileView.js\"></script>\n```\n\n并且，当页面加载时，`app.js`\
  \ 需要创建一个新的 `ProfileView` 实例。\n\n```\nvar timelineView = new com.apress.view.TimelineView(),\n\
  \    profileView = new com.apress.view.ProfileView();\n```\n\n重新加载应用程序，现在应呈现一个类似于图\
  \ 6-9 的页面。\n\n![A978-1-4302-6335-7_6_Fig9_HTML.jpg](img/A978-1-4302-6335-7_6_Fig9_HTML.jpg)\n\
  \n**图 6-9.** 包含时间线视图和个人资料视图的 Twitter 应用程序\n\n## 重用个人资料视图\n\n既然我们已经有了一个用于查看用户个人资料详情的简洁视图，我们可以改进时间线视图中为每个\
  \ `@username` 提及提供的链接。本节除了展示如何重用视图外，还将说明如何向其中一个视图添加事件。\n\n### 使个人资料模型可重用\n\n首先，我们需要将个人资料详情的请求参数化，而不是硬编码到特定用户。这需要更改服务器端的处理函数：向\
  \ `server.js` 添加代码以处理名为 `id` 的请求参数。\n\n```\n/**\n * 获取所提供 id 用户的账户设置。\n **/\napp.get('/profile/:id',\
  \ function(request, response){\n     response.header('Access-Control-Allow-Origin',\
  \ '*');\n     client.get('users/show', {screen_name: request.params.id},  function\
  \ (err, reply) {\n      if(err){\n        console.log('Error: ' + err);\n      \
  \  response.send(404);\n      }\n      if(reply){\n       /// console.log('Reply:\
  \ ' + reply);\n        response.json(reply);\n      }\n  });\n});\n```\n\n在 Backbone\
  \ 中，当模型拥有 `id` 属性时，它会被附加到用于从服务器检索信息的 `urlRoot` 末尾。这意味着我们只需在创建个人资料模型时设置其 `id` 参数即可。该参数可以从\
  \ `app.js` 一直传递到 `ProfileView` 的构造函数，然后构造函数再创建 `Profile` 模型的实例。\n\n您还记得，任何 Backbone\
  \ 对象都可以接受传递给构造函数的参数，这些参数随后会在 `initialize` 函数中使用。在 `app.js` 中，创建 `ProfileView` 时，按如下方式传递用户名：\n\
  \n```\nprofileView = new com.apress.view.ProfileView({user: 'sugrue'}),\n```\n\n\
  现在，`ProfileView` 类中的 `initialize` 函数可以使用这个新参数了。\n\n```\ninitialize:  function(options){\n\
  \        var self = this;\n        //为此视图创建一个集合以进行渲染\n        self.model = new com.apress.model.Profile({id:\
  \ options.user});\n        ......\n```\n\n应用程序的行为将与之前相同，但现在我们能够重用该模型来渲染任何用户的个人资料详情。\n\
  \n\n\n### 更改时间线行为\n\n之前，在解析推文中的用户名时，我们创建了一个指向用户个人资料页面的简单链接。现在，我们需要检测到个人资料链接被点击时，显示一个对话框。\n\
  \n提供此格式化的 Handlebars 助手（`helper.js`）需要更新。该链接无需跳转到任何位置，但通过为链接应用一个类（此处为 `profile`），就可以区分个人资料链接与其它类型的\
  \ `href`。\n\n```\nHandlebars.registerHelper('format', function (str) {\n    if(str){\n\
  \        str = str.replace(/[@]+[A-Za-z0-9-_]+/g, function(u) {\n            var\
  \ username = u.replace('@','')\n            return '<a href=\"#\" data-user=\"'\
  \ + username +'\" class=\"profile\">@'+username+'</a>';\n        });\n    }\n});\n\
  ```\n\n当我们点击一个个人资料链接时，需要获取用户名以用于展示个人资料。为了实现这一点，我们可以使用自定义数据属性。这些属性以 `data-` 为前缀，允许\
  \ HTML 作者添加元数据来进一步描述 HTML 元素。更重要的是，之后可以在视图的 JavaScript 代码中解析这些属性。\n\n### 为时间线视图添加事件\n\
  \n现在，时间线中每个渲染了 `@username` 链接的推文都将通过 `profile` 类来标识。我们可以通过向视图添加一个 `events` 哈希表来添加事件处理。\n\
  \n```\nevents: {\n    'click .profile': 'showDialog'\n},\n```\n\n现在，当点击个人资料时，`showDialog`\
  \ 函数将被调用。Backbone 中的任何视图事件都会包含一个 `options` 对象，其中包含一个对事件源 HTML 元素的引用。利用这个引用，我们可以通过\
  \ `.data()` 函数获取用户名。\n\n```\nshowDialog: function(options){\n    var self =this,\n\
  \        $target = $(options.currentTarget),\n        username = $target.data('user');\n\
  \    var profileView = new com.apress.view.ProfilePopupView({user: username});\n\
  }\n```\n\n你会注意到，这创建了一个新视图对象 `ProfilePopupView` 的实例。我们接下来将创建这个对象。\n\n### 为个人资料创建弹出对话框\n\
  \n该对话框的源代码与 `ProfileView` 中的几乎相同。实际上，`initialize` 函数是直接复制过来的，它甚至重用了同一个 Handlebars\
  \ 模板。唯一的区别在于 `render` 函数，它将创建一个新的对话框并显示在屏幕上，而不是将详情追加到主页面。以下代码应放在 `view` 目录下的 `ProfilePopupView.js`\
  \ 文件中：\n\n```\nvar com = com || {};\ncom.apress = com.apress || {};\ncom.apress.view\
  \ = com.apress.view || {};\ncom.apress.view.ProfilePopupView = Backbone.View.extend({\n\
  \    template: Handlebars.compile($(\"#profile-template\").html()),\n    model:\
  \ null,\n    initialize:  function(options){\n        var self = this;\n       \
  \ //为此视图创建要渲染的集合\n        self.model = new com.apress.model.Profile({id: options.user});\n\
  \        //强制 fetch 触发 reset 事件\n        self.model.fetch({});\n        self.listenTo(self.model,\
  \ 'change', self.render);\n    },\n    render: function(){\n        var self = this;\n\
  \        if(self.model.get('screen_name')){\n            var output = self.template({user:\
  \ self.model.toJSON()});\n            $.Dialog({\n                'title'      \
  \ : '@'+self.model.get('screen_name') + ' 的个人资料',\n                'content'   \
  \  : output,\n                'draggable'   : true,\n                'overlay' \
  \    : true,\n                'closeButton' : true,\n                'buttonsAlign':\
  \ 'center',\n                'keepOpened'  : true,\n                'position' \
  \   : {\n                    'zone'    : 'left'\n                },\n          \
  \      'buttons'     : {\n                     '确定'     : {\n                  \
  \    'action': function(){}\n                }\n                }\n            });\n\
  \        }\n        return self;\n    },\n});\n```\n\nMetroUI 提供了一些用于创建对话框的 JavaScript，你也需要引入它们才能使其正常工作。这些代码托管在\
  \ GitHub 上，地址为 [`https://raw.github.com/olton/Metro-UI-CSS/master/javascript/dialog.js`](https://raw.github.com/olton/Metro-UI-CSS/master/javascript/dialog.js)。为了解决页面上的其他错误，你还应该引入\
  \ `fonts` 目录。\n\n同样，你需要更新 `index.html` 中的引入：\n\n```\n<script src=\"js/external/dialog.js\"\
  ></script>\n<script src=\"js/app/view/ProfilePopupView.js\"></script>\n```\n\n现在，当你点击一个\
  \ `@username` 链接时，应该会看到类似于图 6-10 所示的效果。\n\n![A978-1-4302-6335-7_6_Fig10_HTML.jpg](img/A978-1-4302-6335-7_6_Fig10_HTML.jpg)\n\
  \n**图 6-10.** 在弹出窗口中复用个人资料视图\n\n现在你应该能够看到将模型、视图以及 HTML 中使用的模板进行分离所带来的好处了。我们以最小的努力为应用添加了额外的功能。之前在侧边栏中为个人资料所做的同一个模板和样式，现在可以用于应用中处理相同模型的其他部分。这带来了更一致的用户界面，以及易于维护的代码。\n\
  \n## 添加搜索功能\n\n我们应用屏幕的最后一部分是添加一个搜索框，允许我们对 Twitter 搜索 API 执行查询并渲染结果。在本节中，我们将向应用引入一个路由器，使得搜索可以添加书签。\n\
  \n### 数据层\n\n再次，我们需要在 `server.js` 文件中为 node.js 服务器创建一个端点来提供搜索请求。访问 Twitter API 进行搜索的路径是\
  \ `search/tweets`，它接受一个搜索词参数 (`q`) 以及一个返回结果的最大数量参数。\n\n```\n/**\n * 根据查询执行搜索\n **/\n\
  app.get('/search/:query', function (request, response) {\n    response.header('Access-Control-Allow-Origin',\
  \ '*');\n    //搜索词是\n    var searchTerm = request.params.query;\n    client.get('search/tweets',\
  \ { q: searchTerm, count: 100 }, function(err, reply) {\n      if(err){\n      \
  \  console.log('Error: ' + err);\n        response.send(404);\n      }\n      if(reply){\n\
  \       // console.log('Reply: ' + reply);\n        response.json(reply);\n    \
  \  }\n  });\n});\n```\n\n这次，我们将对搜索模型采取不同的处理方式。因为搜索词作为参数包含在搜索 URL 中，所以每次请求结果时都需要重新构建模型的端点。为了处理这个问题，我们可以覆盖\
  \ `sync` 方法，允许在执行默认的 Backbone 同步函数之前执行一些自定义代码。\n\n```\nvar com = com || {};\ncom.apress\
  \ = com.apress || {};\ncom.apress.model = com.apress.model || {};\ncom.apress.model.Search\
  \ = Backbone.Model.extend({\n    url : 'http://localhost:8080/search',\n    sync:\
  \ function(method, model, options){\n        if(this.get('query')){\n          \
  \  this.url = this.url + '/' + this.get('query');\n        }\n        Backbone.sync.call(this,\
  \ method, model, options);\n    },\n});\n```\n\n`sync` 函数会检查模型中是否存在 `query` 属性，如果存在则将其追加到\
  \ URL 末尾。\n\n\n\n### 添加搜索视图\n\n搜索功能的 HTML 将以一个简单的表单呈现。这种情况下，使用模板反而多余，因为它本质上是静态内容。\n\
  \n我们将在 `index.html` 的个人信息框下方，直接添加搜索视图的 HTML 代码。\n\n```\n<div class=\"span4\">\n\
      <div id=\"profile\" class=\"profile-view\">\n    </div>\n    <div id=\"search\"\
  \ class=\"search-view\">\n        <form>\n            <div class=\"input-control\
  \ text\">\n                <input type=\"text\" id=\"searchbox\" autofocus=\"\"\
  \ placeholder=\"我正在查找…\">\n            </div>\n            <button class=\"bg-color-blue\"\
  \ id=\"searchbutton\">搜索</button>\n        </form>\n    </div>\n</div>\n```\n\n\
  现在我们可以创建一个 Backbone 视图来处理搜索功能。创建它的唯一目的是为搜索按钮添加监听器。这虽然可以在更高级别的视图中完成，但鉴于我们目前的所有视图都有清晰的职责划分，保持现有模式是合理的。\n\
  \n正如你在 `events` 哈希声明中看到的，这里处理的唯一事件是点击 ID 为 `searchbutton` 的元素。请注意，我们也可以为文本字段添加键盘监听器，用来执行\
  \ `runSearch` 方法。\n\n另一个重要事项是：`Search` 模型对象是以参数形式传递给该视图的，而不是像之前示例那样让视图自行创建模型。这么做是因为该模型需要在多个对象之间共享。这一点将在接下来的段落中解释。以下代码应放置在\
  \ `view` 目录下的 `SearchView.js` 文件中。别忘了在你的主 HTML 页面中包含此文件。\n\n```\nvar com = com ||\
  \ {};\ncom.apress = com.apress || {};\ncom.apress.view = com.apress.view || {};\n\
  com.apress.view.SearchView = Backbone.View.extend({\n    el: '#search',\n    model:\
  \ null,\n    events: {\n        'click #searchbutton': 'runSearch'\n    },\n   \
  \ initialize:  function(options){\n        var self = this;\n        self.model\
  \ = options.model;\n    },\n    runSearch: function(e){\n        var self = this;\n\
  \        query = $('#searchbox').val();\n        e.preventDefault();\n        console.log('对\
  \ ' +  query + ' 执行搜索');\n        // 一个强制重置属性的小技巧\n        self.model.set('query',\
  \ '', {silent: true});\n        self.model.set('query', query);\n    }\n});\n```\n\
  \n关于 `runSearch` 函数，有几点需要注意。首先，函数中调用了 `e.preventDefault()`，这是一个 jQuery 事件，会阻止默认函数的执行。这可以防止整个页面刷新。\n\
  \n另一点是，该视图所做的只是设置模型的值。搜索的执行将依赖于模型对象的 change 事件。因此，我们在设置属性之前，先静默清除模型中的值。这纯粹是为了确保在点击按钮后能触发\
  \ change 事件。如果查询值与之前相同，change 事件就不会被触发。\n\n### 在 Backbone 对象间共享模型\n\n我们已经设置了 `SearchView`\
  \ 来接收搜索模型作为参数。之所以这样做，是为了能有一个路由器来处理搜索 URL，使其可添加书签。这个路由器也会接受模型作为参数。这个共享模型的改变将触发导航功能。\n\
  \n`initialize` 函数为搜索模型的 query 属性变化设置了适当的监听器。这就是路由器如何与上一节创建的 `SearchView` 关联起来的。以下代码应放置在\
  \ `router` 目录下的 `AppRouter.js` 文件中：\n\n```\nvar com = com || {};\ncom.apress = com.apress\
  \ || {};\ncom.apress.router = com.apress.router || {};\ncom.apress.router.AppRouter\
  \ = Backbone.Router.extend({\n   searchModel : null,\n   initialize:  function(options){\n\
  \       var self = this;\n       self.searchModel = options.searchModel;\n     \
  \  self.listenTo(self.searchModel, 'change:query', self.navigateToSearch)\n   },\n\
  \   navigateToSearch: function(model, options){\n       // 手动导航到搜索 URL\n       this.navigate(\"\
  search/\" + model.get('query'), {trigger: true});\n   },\n});\n```\n\n`navigateToSearch`\
  \ 函数简单地创建一个可在任何阶段重复使用的 URL。这提供了两种搜索方式：一种是通过搜索按钮，另一种是通过浏览器地址栏的 URL。调用 navigate 时，使用\
  \ `{trigger:true}` 会触发为此 URL 设置的路由。\n\n接下来，我们需要为搜索创建路由和处理函数。`routes` 哈希需要包含 `query`\
  \ 参数，并将调用一个名为 `search` 的函数。\n\n```\nroutes: {'search/:query' : 'search'},\n```\n\
  \n当执行 `search` 函数时，它会检查模型是否已经为 `query` 属性设置了值。当从 UI 运行搜索时（即点击按钮后），这个值总是会被设置。但是，如果你使用\
  \ URL 栏，路由会被触发，但不会在搜索模型中设置任何属性。这允许该函数处理这两种情况。\n\n```\nsearch: function(query){\n\
  \    var self = this;\n    console.log('搜索 ' + query);\n    if(self.searchModel.get('query')\
  \ !== query){\n        self.searchModel.set('query', query, {silent:true});\n  \
  \  }\n    //现在转到那个视图\n    self.searchModel.fetch(\n        {\n            success:\
  \ function(model){\n                //创建结果视图\n                var resultsView =\
  \ new com.apress.view.ResultsView({model:model});\n            },\n            error:\
  \ function(e){\n                alert('没有可用结果');\n            }\n        });\n}\n\
  ```\n\n只要对搜索端点的调用成功，路由器就会创建一个 `ResultsView` 对象来呈现结果。\n\n`ResultsView` 类的构建实际上与 `ProfilePopupView`\
  \ 类似。它只是另一个对话框，将重用 Handlebars 模板（此处为 `TimelineView` 的模板）来呈现搜索结果。\n\n在从服务器获取结果之前，搜索模型会被传递给这个视图。一旦检测到模型发生变化，就会调用\
  \ `render` 函数，该函数在填充模板后构建对话框。结果实际上存储在一个名为 `statuses` 的数组中。为了重用模板，这个数组需要用 `tweet`\
  \ 这个名称进行标记。以下代码应放置在 `view` 目录下的 `ResultsView.js` 文件中，并且该文件应通过主 HTML 页面的 script 标签包含进来：\n\
  \n```\nvar com = com || {};\ncom.apress = com.apress || {};\ncom.apress.view = com.apress.view\
  \ || {};\ncom.apress.view.ResultsView = Backbone.View.extend({\n    el: '#results',\n\
  \    model: null,\n    template: Handlebars.compile($(\"#timeline-template\").html()),\n\
  \    initialize:  function(options){\n        var self = this;\n        self.model\
  \ = options.model;\n        self.model.fetch();\n        self.listenTo(self.model,'change',\
  \ self.render);\n        self.render();\n    },\n    render: function(){\n     \
  \   var self = this,\n            output = self.template({tweet: self.model.get('statuses')});\n\
  \        $.Dialog({\n            'title'       : '搜索结果',\n            'content'\
  \     : output,\n            'draggable'   : true,\n            'overlay'     :\
  \ true,\n            'closeButton' : true,\n        });\n    }\n});\n```\n\n\n\n\
  ```javascript\n'buttonsAlign': 'center',\n'keepOpened'  : true,\n'position'    :\
  \ {\n    'zone'    : 'left'\n},\n'buttons'     : {\n    'OK'     : {\n        'action':\
  \ function(){}\n    }\n}\n});\n});\n```\n\n需要对`app.js`进行一些更新，以便在程序启动时就创建搜索模型，并在路由器和搜索视图之间共享该模型。我们创建的所有脚本都应通过\
  \ `script` 标签包含在主 HTML 页面中。\n\n```javascript\n$(function() {\n    var timelineView\
  \ = new com.apress.view.TimelineView(),\n        profileView = new com.apress.view.ProfileView({user:\
  \ 'sugrue'}),\n        searchModel = new com.apress.model.Search(),\n        searchView\
  \ = new com.apress.view.SearchView({model: searchModel}),\n        appRouter = new\
  \ com.apress.router.AppRouter({searchModel: searchModel});\n    Backbone.history.start();\n\
  });\n```\n\n现在，当你发起搜索时，系统会弹出一个对话框，如图 6-11 所示。\n\n![A978-1-4302-6335-7_6_Fig11_HTML.jpg](img/A978-1-4302-6335-7_6_Fig11_HTML.jpg)\n\
  \n**图 6-11.** 搜索结果显示对话框的一部分\n\n## 错误处理\n\n到目前为止，我们所有的代码都假设对服务器的调用都会成功并返回结果。但是，在从服务器获取数据的任何调用中添加错误处理代码是非常重要的。\n\
  \n你可以通过增强对 `fetch` 的调用来实现这一点，使其同时包含成功和错误回调。当发生错误时，触发一个可以由全局监听器处理的事件会很有用。\n\n这个监听器可以添加到应用的任何部分。由于我们没有单一的视图来管理整个应用，`AppRouter`\
  \ 类可能是最合适的选择。但是，`AppRouter` 需要有一个在视图之间共享的对象来监听事件。\n\n搜索示例允许我们这样做，因为它是一个共享对象。在 `initialize`\
  \ 方法中，`AppRouter` 会监听错误事件。\n\n```javascript\nself.searchModel.on('app:error', function(error){\n\
  \    alert(error.message);\n});\n```\n\n在搜索中，当调用 `fetch` 时，错误处理程序会触发该事件，并附带供监听器使用的附加参数（即\
  \ `message`）。\n\n```javascript\nself.model.fetch({\n    error: function(e){\n  \
  \      self.model.trigger(\"app:error\", {message: '检索时间轴信息时出错'});\n    },\n});\n\
  ```\n\n你会发现，拥有一个在应用程序中共享的单一应用模型，将有助于更轻松地追踪应用状态中的错误。\n\n"
- '# 总结


  这个示例应用将我们在前三章中学习的所有概念结合在了一起。你学会了如何创建基于集合和模型的视图，这些视图与后端服务进行交互。你还学会了如何在应用中重用模型和模板，从而减少必要的代码量。外部库与
  Handlebars 模板一起使用，并且为这些模板添加了扩展的辅助函数。


  更细致的内容，如对 `parse` 和 `sync` 方法的定制，也通过具体的例子变得更加清晰，展示了在自有应用中扩展此功能的实用之处。我们还构建了一个路由器，并在整个应用中使用了事件。


  最重要的是，你学会了如何构建你的 Backbone 应用，使用命名空间和目录进行关注点分离。这种结构应该为你自己的应用提供了一个框架。仅本章所涵盖的内容就足以向你展示如何创建由
  Backbone 驱动的专业质量页面。


  '
- "# 7. Backbone 生态系统\n\n**摘要**\n\n现在你已经看到使用 Backbone 开箱即用的功能可以构建什么，是时候深入探讨更高级的技术，这些技术可以使你的应用开发更容易，并保持代码更整洁。\n\
  \n仅仅几年时间，Backbone 已经拥有一个令人印象深刻的在线社区，以及许多开源项目，这些项目致力于解决一些人认为的该库的不足之处。\n\n本章将介绍这些第三方组件，并探究它们如何在你的\
  \ Backbone 应用开发过程中提供帮助。这些组件按不同的用途进行分类，以便于在日益增多的选项中进行浏览。\n\n在本章末尾，你将看到一个汇总了所有讨论过的第三方组件的表格。\n\
  \n## 代码示例\n\n本章列出的每个项目都有一些代码示例。你可以从共享的 GitHub 仓库访问它们：[`https://github.com/jamessugrue/beginning-backbone`](https://github.com/jamessugrue/beginning-backbone)。\n\
  \n## 用户界面组件\n\n以下插件将帮助你处理 Backbone 应用的用户界面。\n\n### LayoutManager\n\n托管在 [`http://layoutmanager.org/`](http://layoutmanager.org/)\
  \ 上，Tim Branyen 的 LayoutManager 帮助你组装 Backbone 应用中的布局和子视图。除了帮助构建布局之外，该项目还帮助你管理嵌套视图，并确保为应用生命周期内创建的视图进行正确的内存管理。除此之外，LayoutManager\
  \ 还提供了 `beforeRender()` 和 `afterRender()` 回调，以便你能够可靠地知道视图何时完成渲染。\n\n让我们看看如何将这个项目集成到一个简单的应用中，并了解它如何影响你处理视图的工作。\n\
  \n#### 为什么使用 LayoutManager\n\n如果你的应用有以下任何需求，那么 LayoutManager 可能会很有用：\n\n- 应用中有多个子视图。\n\
  - 应用布局频繁变化，视图被添加和删除，你需要确保没有内存泄漏。\n- 你想要知道每个视图何时即将渲染或已完成其渲染周期。\n- 你想要在视图及其子视图之间共享事件。\n\
  - 在应用中管理嵌套视图变得难以处理。\n\n### 配置\n\n你首先需要下载一个版本的库以供应用使用。可以在项目的 GitHub 列表中找到，文件名为 `backbone.layoutmanager.js`。与之前所有的外部库一样，这个文件应该放在\
  \ `js/external` 目录下，并且应该在 `index.html` 中位于 jQuery、Backbone 和 Underscore 之后引入，因为它依赖于这些库。\n\
  \n```html\n<script src=\"js/external/jquery-1.10.2.js\"></script>\n<script src=\"\
  js/external/underscore.js\"></script>\n<script src=\"js/external/backbone.js\"></script>\n\
  <script src=\"js/external/handlebars.js\"></script>\n<script src=\"js/external/backbone.layoutmanager.js\"\
  ></script>\n```\n\n\n\n#### 使用 `LayoutManager`\n\n在第 7 章的示例中，我们在单个页面上展示了许多视图。当时我们并未探讨如何管理子视图，而是将每个视图视为独立个体。`LayoutManager`\
  \ 将整体布局的概念引入应用程序，子视图便附着在此布局之上。\n\n我们首先来看创建最简单布局的过程，这本质上与 Backbone 视图相同。为说明概念，本节将使用简单的\
  \ HTML，但请记住，你可以使用任意类型的模板和视图，甚至是上一章创建的。\n\nHTML 页面需要添加两部分内容：一个作为布局主容器的 `div`，以及一个用于渲染布局内容的模板。\n\
  \n```\n<div class=\"container\">\n\n</div>\n\n<script type=\"template\" id=\"layout\"\
  >\n <p>一个简单的布局</p>\n</script>\n```\n\n与我们在大型应用示例中的做法相同，我们将主要的 JavaScript 源码放在独立的\
  \ `app.js` 文件中。\n\n```\n<script src=\"js/app/app.js\"></script>\n```\n\n创建布局需要设置两个属性：布局所在的主元素（具有\
  \ container 类的 `div`）以及用于渲染内容的模板（ID 为 `layout` 的脚本）。\n\n```\n$(function() {\n  \
  \      var layout = new Backbone.Layout({\n    el : '.container',\n    template:\
  \ '#layout'\n});\nlayout.render();\n});\n```\n\n最后调用布局的 `render` 函数即可完成 HTML 页面的构建并在浏览器中显示。\n\
  \n##### 添加子视图\n\n`LayoutManager` 的真正强大之处在于可以在布局内添加子视图。首先，在布局模板的 HTML 中添加一个预期放置子视图的元素，如下所示：\n\
  \n```\n<script type=\"template\" id=\"layout\">\n         <p>一个简单的布局</p>\n     \
  \    <div id=\"subview\"></div>\n</script>\n```\n\n同时还需要为子视图本身提供一个模板。\n\n```\n<!--\
  \ 视图模板 -->\n<script type=\"template\" id=\"view\">\n  <i>这是子视图内容…</i>\n</script>\n\
  ```\n\n回到 `app.js`，在使用布局之前需要先定义视图。\n\n```\nvar SimpleSubview = Backbone.Layout.extend({\n\
  \     template: \"#view\"\n});\n```\n\n为了将视图附加到布局，可以使用 `views` 哈希表，其用法与前面章节中的 `events`\
  \ 和 `routes` 定义类似。该哈希表左侧标识应包含视图的元素，右侧引用 Backbone `View` 对象，从而将嵌套视图绑定到布局。\n\n```\n\
  var layout = new Backbone.Layout({\n    el : '.container',\n    template: '#layout',\n\
  \    views: {\n        '#subview' : new SimpleSubview()\n    }\n});\nlayout.render();\n\
  ```\n\n此代码的执行结果与之前一样，会渲染布局以及子视图的内容。\n\n##### `LayoutManager` 的优势\n\n这种构建视图的方式为你的应用程序带来了诸多优势。\n\
  \n事件监听器可以在布局层级声明，方式与普通视图相同。不过，由于你拥有对所有子视图的引用，这些事件可以被视为全局视图事件。\n\n通过向 `Layout` 对象添加\
  \ `beforeRender` 和 `afterRender` 回调，可以正确跟踪布局的生命周期：\n\n```\nvar layout = new Backbone.Layout({\n\
  \    //其他布局定义\n    beforeRender: function(){\n        console.log('即将渲染');\n   \
  \ },\n    afterRender: function(){\n        console.log('渲染完成');\n    }\n});\n```\n\
  \n最后，通过在应用级别作用域（通常在 `app.js` 的开头）声明下面这行代码，你创建的所有视图都可以被增强为充当布局本身：\n\n```\nBackbone.Layout.configure({\
  \ manage: true });\n```\n\n这是一种很好的方式，可以改造现有的 Backbone 应用，以使用由 `LayoutManager` 提供的改进视图机制。\n\
  \n### `Backgrid`\n\n`Backgrid.js` ( [`backgridjs.com/`](http://backgridjs.com/)\
  \ ) 提供了一套专门用于以表格形式展示数据集的用户界面元素。该项目还提供了对来自 Backbone 集合和模型的数据进行排序和编辑的功能。\n\n#### 为何使用\
  \ `Backgrid`\n\n如果你的应用程序数据量大，并且需要以表格形式显示、编辑和排序这些数据，`Backgrid` 是一个绝佳选择。它减少了在表格中提供编辑功能所需的自定义代码量，这无疑是件好事。\n\
  \n### 配置\n\n与大多数 Backbone 扩展一样，你需要在包含 `backgrid.js` 之前，确保页面上已加载 `Backbone`、`Underscore`\
  \ 和 `jQuery` 这三件套。源码可以从 [`github.com/wyuenho/backgrid`](https://github.com/wyuenho/backgrid)\
  \ 的 `lib` 目录下下载。\n\n```\n<script src=\"js/external/backgrid.js\"></script>\n```\n\
  \n由于该库为表示层提供了许多功能，你还需要在页面中包含 `backgrid.css`。\n\n```\n<link rel=\"stylesheet\" href=\"\
  css/backgrid.css\">\n```\n\n#### 使用 `Backgrid`\n\n在你看到 `Backgrid` 的实际效果之前，需要先定义一个模型和集合，用于构建网格。这里我们将创建一个简单的集合，但在实际应用中，你可以使用任何已有的集合。\n\
  \n```\n// 模型和集合定义\nvar Book = Backbone.Model.extend({});\nvar Library = Backbone.Collection.extend({});\n\
  \n// 定义内容\nvar backboneBook = new Book({name: 'Beginning Backbone', author: 'James\
  \ Sugrue', year: '2013-12-24'});\nvar nodeBook = new Book({name: 'Pro Node.js for\
  \ Developers', author: 'Colin J. Ihrig', year: '2013-11-01'});\nvar proJavascriptBook\
  \ = new Book({name: 'Pro JavaScript Techniques', author: 'John Resig', year: '2006-02-01'});\n\
  \n// 创建集合\nvar myLibrary = new Library();\nmyLibrary.set([backboneBook, nodeBook,\
  \ proJavascriptBook]);\n```\n\n集合准备就绪后，你就可以定义要显示的列了。每个列对象都有一个 `name` 属性，它将列映射到模型中的特定属性，此外还有显示标签和单元格类型。\n\
  \n```\nvar columns = [ {\n name: \"name\",\n label: \"名称\",\n cell: \"string\"\n\
  }, {\n name: \"author\",\n label: \"作者\",\n cell: \"string\"\n}, {\n name: \"year\"\
  ,\n label: \"年份\",\n editable: false,\n cell: \"date\",\n}];\n```\n\n创建网格只需接受两个参数：集合和列。\n\
  \n```\n// 初始化一个新的 Grid 实例\nvar grid = new Backgrid.Grid({\n columns: columns,\n\
  \ collection: myLibrary\n});\n```\n\n接下来，最后一步是将网格渲染到 HTML 页面上。以下示例假设你有一个带有 container\
  \ 类的元素可用：\n\n```\n<div class=\"container\"></div>\n```\n\n然后，只需将网格追加到这个元素上即可。\n\n\
  ```\n$(\".container\").append(grid.render().$el);\n```\n\n运行上述示例将提供一个所有数据的表格视图；也就是说，可以通过点击表头进行排序。每个标记为可编辑的元素都可以在表格内直接编辑。只需极少的编码，你的应用程序中就拥有了一个完整的数据网格。\n\
  \n通过使用其他第三方组件可以实现分页功能。除了十个内置的单元格类型外，对于更复杂的网格，还有许多额外的扩展可用。\n\n### `Backbone UI`\n\
  \n`BackboneUI`，托管在 [`perka.github.io/backbone-ui/`](http://perka.github.io/backbone-ui/)，它增加了其他\
  \ MV* 库提供的数据绑定功能。这意味着模型和集合可以表示为 UI 组件，并且这些数据会以不同的方式传递到 HTML 页面的各个部分。\n\n\n\n####\
  \ 为何使用 Backbone UI\n\n如果应用中使用的模型和集合对象可以紧密绑定到简单的 UI 元素（如菜单、按钮和表格），那么考虑使用 `Backbone.UI`\
  \ 来减少所需的模板和自定义 HTML 数量是值得的。\n\n### 配置\n\n除了 Backbone 相关项目的常规依赖外，你还需要添加 `Laconic`\
  \ 库，该库共享于 [`https://github.com/joestelmach/laconic`](https://github.com/joestelmach/laconic)。\n\
  \n```\n<script src=\"js/external/laconic.js\"></script>\n```\n\n`Backbone.UI` 的源码分发包含两个文件，你需要将它们包含到\
  \ HTML 页面中：`backbone-ui.js` 和 `backbone-ui.css`。\n\n```\n<link rel=\"stylesheet\"\
  \ href=\"css/backbone-ui.css\">\n```\n\n`......`\n\n```\n<script src=\"js/external/backbone-ui.js\"\
  ></script>\n```\n\n完成这个简单的配置后，你就可以在自己的应用中使用 `Backbone.UI` 了。\n\n#### 使用 Backbone\
  \ UI\n\n一旦你准备好了模型和集合，使用 `Backbone.UI` 就再简单不过了。与 `Backgrid` 类似，UI 组件是用 JavaScript\
  \ 构建的，并附加到 HTML 页面 DOM 的特定元素上。\n\n例如，要创建一个显示书籍对象名称作为其文本的按钮，可以创建一个 `Button` 对象，该对象使用正在使用的模型实例，并通过\
  \ `content` 属性将模型属性映射到用户界面。\n\n```\nvar button = new Backbone.UI.Button({\n  model:\
  \ backboneBook,\n  content: 'name'\n}).render();\n```\n\n一旦在 HTML 页面中找到具有 `container`\
  \ 类的元素，以下代码将渲染一个显示文本“Beginning Backbone”的按钮：\n\n```\n$(\".container\").append(button.el);\n\
  ```\n\n前面的示例假设使用了与 Backgrid 代码示例中相同的模型和集合。\n\n`Backbone.UI` 包含许多其他可以绑定到模型的 UI 小部件，包括以下内容：\n\
  \n- Calendar（需要 Moment.js）\n- Checkbox\n- Date Picker（需要 Moment.js）\n- Link\n- Text\
  \ Area\n- Text Field\n- Time Picker\n\n还有一些可以绑定到模型并附带 alternatives（用于表示其他值的集合）的组件。这些小部件是多值小部件，例如菜单和下拉列表。\n\
  \n例如，你可能希望创建一个菜单小部件，以便从库中选择一本书。在这种情况下，`model` 属性继续指向特定的书籍实例，而 `alternatives` 属性则映射到\
  \ `myLibrary` 集合。\n\n```\nvar menu = new Backbone.UI.Menu({\n  model: backboneBook,\n\
  \  content: 'name',\n  alternatives: myLibrary,\n  altLabelContent: 'name'\n}).render();\n\
  \n$(\".container\").append(menu.el);\n```\n\n`Backbone.UI` 中提供的其他多选输入元素如下：\n\n-\
  \ `Menu`\n- `Pulldown`\n- `RadioGroup`\n- `ListView`\n- `TableView`\n\n该库还提供了一些不绑定到模型的小部件：`Scroller`\
  \ 和 `TabSet`。为了让你完全控制应用程序的外观，`Backbone.UI` 提供了使用自定义皮肤（一组 CSS 和图像文件）的选项。\n\n### Backbone.stickit\n\
  \n人们对 Backbone 的主要抱怨之一是需要处理模型和视图之间的大量样板代码，以便在模型更改时相应地更新视图。虽然我们在前几章中看到的事件处理系统很有用，但\
  \ `Backbone.stickit`（[`http://nytimes.github.io/backbone.stickit/`](http://nytimes.github.io/backbone.stickit/)）提供了完整的绑定。\n\
  \n该库无需在 HTML 中添加任何额外标记即可工作，甚至承诺能让你的模板更简洁，因为在视图渲染时，对变量进行插值的需求更少。\n\n#### 为何使用 Backbone.stickit\n\
  \n如果你觉得将模型属性更改与视图数据刷新关联起来过于繁琐，那么 `Backbone.stickit` 是最好的替代方案之一。它通过一些简单的代码，无缝地融入了\
  \ Backbone 视图的生命周期。使用过 `Knockout` 或 `Ember` 的 JavaScript 开发人员可能会对 `Backbone.stickit`\
  \ 提供的绑定支持感到更舒适。\n\n### 配置\n\n将 `Backbone.stickit` 集成到你的应用中是一个轻松的过程。只需从 [`http://nytimes.github.io/backbone.stickit/`](http://nytimes.github.io/backbone.stickit/)\
  \ 下载源码，并将其包含到 HTML 页面中即可。\n\n```\n<script src=\"js/external/backbone.stickit.js\"\
  ></script>\n```\n\n#### 使用 Backbone.stickit\n\n首先，你需要准备一个模型，以便在 Backbone 视图中进行可视化。我们再次使用前几章中的简单\
  \ `Book` 模型。\n\n```\nvar Book = Backbone.Model.extend({});\n\n//define contents\n\
  var backboneBook = new Book({name: 'Beginning Backbone', author: 'James Sugrue',\
  \ year: '2013-12-24'});\n```\n\n在我们创建视图之前，这个示例中还需要在 HTML 页面上有一个带有特定类（此处为 `container`）的\
  \ `div`。\n\n```\n<div class=\"container\">\n</div>\n```\n\n在创建使用 `Backbone.stickit`\
  \ 绑定的视图时，你需要在模型中定义一个 `bindings` 哈希表。每个绑定都接受一对字符串：第一个是模板中将存储变量的部分的 CSS 选择器，第二个是被绑定的模型属性。在以下示例中，模型中的\
  \ `name` 属性绑定到视图 HTML 中 ID 为 `title` 的元素。\n\n```\n//Define the Library View\nMyView\
  \ = Backbone.View.extend({\n    el : '.container',\n    bindings: {\n        \"\
  #title\" : 'name',\n        '#author' : 'author'\n    },\n    model : null,\n  \
  \  content: null,\n    initialize: function(options){\n        this.model = options.model;\n\
  \    },\n    render: function(){\n        var self = this;\n        self.$el.html('<div\
  \ id=\"title\"/> <input id=\"author\" type=\"text\">');\n        self.stickit();\n\
  \        return self;\n   },\n});\n```\n\n第二个重要的部分是，`render()` 调用了 `self.stickit()`\
  \ 函数，该函数强制执行绑定。\n\n当视图被创建，并传入模型作为参数时，它会按预期显示值。\n\n```\nvar view1 = new MyView({model:\
  \ backboneBook});\nview1.render();\nbackboneBook.set('name', 'Beginning Backbone.js');\n\
  ```\n\n然而，`Backbone.stickit()` 的真正强大之处在于，只要绑定的模型属性有任何变化，视图就会自动更新。以下代码每六秒更新一次模型。插入此代码后，注意观察\
  \ HTML 如何自动更新。\n\n```\nvar count = 1;\nsetInterval(function(e){\n        count++;\n\
  \        backboneBook.set('name', 'New Name ' + count);\n}, 6000);\n```\n\n当视图被销毁时，你可以通过调用\
  \ `view.unstickit()` 来移除所有绑定。在定义绑定时，还可以添加许多回调函数，这些函数允许更精细地控制视图是否更新，以及在视图更新完成时可以调用的函数。\n\
  \n### Backbone.Notifications\n\n`Backbone.Notifications`（[`https://github.com/fatiherikli/backbone-notifications`](https://github.com/fatiherikli/backbone-notifications)）是一个针对\
  \ Backbone 应用的全局通知系统。该库提供了用于处理弹出通知（flash）、加载和进度条的 CSS 和 JavaScript。\n\n\n\n####\
  \ 为什么使用 `Backbone.Notifications`\n\n当你从零开始构建一个应用时，为错误和成功状态添加通知可能会有些繁琐，并且经常被开发者忽略。然而，有了这样一个既能处理通知逻辑又能呈现通知给用户的简单库，就很难抗拒添加\
  \ `Backbone.Notifications` 的诱惑。\n\n你可以在项目网站上看到完整的示例通知列表，网址是 [`http://fatiherikli.github.io/backbone-notifications/`](http://fatiherikli.github.io/backbone-notifications/)。\n\
  \n### 配置\n\n从 [`https://github.com/fatiherikli/backbone-notifications`](https://github.com/fatiherikli/backbone-notifications)\
  \ 下载源码后，只需包含 `src` 目录中的 CSS 和 JavaScript 文件即可。\n\n```html\n<link rel=\"stylesheet\"\
  \ href=\"css/backbone-ui.css\">\n...\n<script src=\"js/external/backbone-ui.js\"\
  ></script>\n```\n\n这里包含 CSS 文件很重要，因为它负责通知在屏幕上的呈现样式。当然，你可以轻松更改这些样式以适配你的应用。\n\n####\
  \ 使用 `Backbone.Notifications`\n\n`Backbone.Notifications` 可以与任何 Backbone 对象一起使用，因为它们已经包含了事件功能。但是，如果你想在非\
  \ Backbone 对象上使用这个库，你可以用 `Backbone.Events` 来扩展该对象，如下面的代码片段所示：\n\n```javascript\n\
  var notifications = {};\n_.extend(notifications, Backbone.Events);\n```\n\n为了清晰起见，我们这里实现的示例将使用我们已经创建的一个模型对象。\n\
  \n```javascript\nvar Book = Backbone.Model.extend({});\nvar backboneBook = new Book({name:\
  \ 'Beginning Backbone', author: 'James Sugrue', year: '2013-12-24'});\n```\n\n在触发任何通知之前，你需要创建一个新的\
  \ `Notifier` 对象，并将其追加到 HTML 页面中的一个元素（通常是 body）上。创建 `Notifier` 时，你需要指定哪个对象将触发通知，在本例中是\
  \ `backboneBook`。\n\n```javascript\nnew Notifier({\n    model: backboneBook\n}).render().$el.appendTo(\"\
  body\");\n```\n\n任何时候你想触发一个事件，比如保存完成或出错，你只需在该对象上调用 `trigger` 函数，即可显示通知。\n\n```javascript\n\
  backboneBook.trigger(\"success\", \"Book saved\");\n```\n\n该函数的第一个参数是要使用的通知类型，例如\
  \ `start:loader`、`end:loader`、`start:progress`、`end:progress`、`update:progress`、`error`、`success`\
  \ 或 `flash`。\n\n至少，这个库为在 Backbone 应用中构建通知提供了一种一致且简单的方法。\n\n## 模型与集合扩展\n\n到目前为止，我们已经考虑了一些专门用于显示和输入的扩展，但同时也有许多选项可用于扩展模型和集合的功能。\n\
  \n### Backbone.trackit\n\n`Backbone.trackit` ([`https://github.com/NYTimes/backbone.trackit`](https://github.com/NYTimes/backbone.trackit))\
  \ 是纽约时报的另一个项目，用于管理 Backbone 模型中的变更，提供撤销先前更改以及在存在未保存更改时触发事件的能力。\n\n#### 为什么使用 `Backbone.trackit`\n\
  \n正如你在第 3 章中看到的，Backbone 只记录属性当前和上一组的值。虽然这很有用，但对于具有更复杂用户交互的应用来说，这种功能还不够，因为你可能希望记录多次更改。这就是\
  \ `Backbone.trackit` 的用武之地。\n\n值得注意的是，这并没有提供一个完整的撤销/重做堆栈。如需此类扩展，可以查看 `Backbone.memento`。\n\
  \n### 配置\n\n要将 `Backbone.trackit` 包含到你的应用中，只需从 [`https://github.com/NYTimes/backbone.trackit`](https://github.com/NYTimes/backbone.trackit)\
  \ 的 `dist` 文件夹下载 `backbone.trackit.js`，并在你的 HTML 页面中包含该脚本即可。\n\n```html\n<script\
  \ src=\"js/external/backbone.trackit.js\"></script>\n```\n\n#### 使用 `Backbone.trackit`\n\
  \n再次使用简单的 `Book` 模型来说明 `Backbone.trackit`。\n\n```javascript\nvar Book = Backbone.Model.extend({\n\
  \    urlRoot: 'http://localhost:8080/books/',\n});\n\n// 定义内容\nvar backboneBook\
  \ = new Book({name: 'Beginning Backbone', author: 'James Sugrue', year: '2013-12-24'});\n\
  ```\n\n`Backbone.trackit` 并非跨应用配置，而是可以应用于单个模型对象，使用 `startTracking` 函数即可。\n\n```javascript\n\
  backboneBook.startTracking();\n```\n\n一旦开始跟踪，`unsavedAttributes` 函数将返回模型中尚未保存的属性。以下代码中的日志语句将持续累积已更改的属性集合：\n\
  \n```javascript\nbackboneBook.set('name', 'Beginning Backbone.js');\nconsole.log(backboneBook.unsavedAttributes());\n\
  \nbackboneBook.set('author', 'J Sugrue');\nconsole.log(backboneBook.unsavedAttributes());\n\
  ```\n\n但是，一旦成功保存，对 `unsavedAttributes()` 的调用将返回 `false`。如果你想重置属性以避免保存更改，可以调用 `resetAttributes()`\
  \ 函数。\n\n```javascript\nconsole.log('Author is ' + backboneBook.get('author'));\n\
  backboneBook.resetAttributes();\nconsole.log('Author is ' + backboneBook.get('author'));\n\
  ```\n\n上述代码会完全重置自开始跟踪或上次成功保存以来所做的属性更改。\n\n### Backbone.memento\n\nDerick Bailey\
  \ 的 `Backbone.memento` 扩展 ([`https://github.com/derickbailey/backbone.memento`](https://github.com/derickbailey/backbone.memento))\
  \ 提供了一个堆栈，用于对 Backbone 模型和集合进行 push 和 pop 操作以管理更改。这为你的 Backbone 应用提供了一个更完整的撤销/重做堆栈。\n\
  \n#### 为什么使用 `Backbone.memento`\n\n虽然 `Backbone.trackit` 对跟踪模型更改很有用，但更复杂的 Web 应用（如文档编辑系统）可能需要执行多次撤销或重做操作。这正是\
  \ `Backbone.memento` 所能提供的功能。\n\n### 配置\n\n只需从 GitHub 项目页面 [`https://github.com/derickbailey/backbone.memento`](https://github.com/derickbailey/backbone.memento)\
  \ 下载 `backbone.memento.js`，并在你自己的 HTML 页面中包含该脚本即可。\n\n```html\n<script src=\"js/external/backbone.memento.js\"\
  ></script>\n```\n\n\n#### 使用 Backbone.memento\n\n对于每个你想要添加撤销/重做支持的模型或集合，你需要在 `initialize`\
  \ 方法中添加两行额外的代码，将 `Backbone.memento` 添加到该对象中。\n\n```\nvar Book = Backbone.Model.extend({\n\
  \n    urlRoot: 'http://localhost:8080/books/',\n\n    initialize: function(){\n\
  \        var memento = new Backbone.memento(this);\n        _.extend(this, memento);\n\
  \    }\n\n});\n```\n\n虽然上述代码处理的是模型，但同样的语法也可以应用于集合。你还可以让 `Backbone.memento` 插件忽略对特定属性所做的更改，并使用\
  \ `ignore` 数组将它们排除在堆栈之外。\n\n每当你想将模型的状态保存到堆栈时，可以对模型调用 `store` 函数；而要重置到之前的状态，则可以使用\
  \ `restore` 函数。以下代码示例演示了这一流程：\n\n```\n//define contents\nvar backboneBook = new\
  \ Book({name: 'Beginning Backbone', author: 'James Sugrue', year: '2013-12-24'});\n\
  console.log('Before set: ' + backboneBook.get('name'));\nbackboneBook.set('name',\
  \ 'Beginning Backbone.js');\nbackboneBook.store();\nconsole.log('After store: '\
  \ + backboneBook.get('name'));\nbackboneBook.set('name', 'Beginning Backbone')\n\
  console.log('After set: ' + backboneBook.get('name'));\nbackboneBook.restore();\n\
  console.log('After restore: ' + backboneBook.get('name'));\n```\n\n执行结果如下：\n\n```\n\
  Before set: Beginning Backbone\nAfter store: Beginning Backbone.js\nAfter set: Beginning\
  \ Backbone\nAfter restore: Beginning Backbone.js\n```\n\n如你所见，即使在第一次调用 `store` 后更改了书名，`restore`\
  \ 调用也会将更改还原。\n\n### Backbone.localStorage\n\n到目前为止我们讨论的所有内容都假设模型/集合的数据通过 REST 接口存储在服务器上。`Backbone.localStorage`\
  \ (https://github.com/jeromegn/Backbone.localStorage) 重写了 `Backbone.Sync`，允许你将 HTML5\
  \ 本地存储作为数据存储。\n\n#### 为什么要使用 Backbone.localStorage\n\n并非每个应用程序都需要将所有数据保存到服务器。你可能希望某些集合保存到客户端机器的本地数据库中，以存储偏好设置等项目。使用\
  \ `Backbone.localStorage`，你可以指定特定的集合使用这种本地存储，同时允许其他集合使用标准的 HTTP 同步方法。\n\n### 配置\n\
  \n将 `Backbone.localStorage` 包含到你的应用程序中，只需从 GitHub 仓库 https://github.com/jeromegn/Backbone.localStorage\
  \ 下载最新版本的 `backbone.localStorage.js`，然后将该 JavaScript 文件包含到你的 HTML 页面中即可。\n\n```\n\
  <script src=\"js/external/backbone.localStoage.js\"></script>\n```\n\n#### 使用 Backbone.localStorage\n\
  \n`Backbone.localStorage` 是一个非侵入式插件，它只需要你创建针对 HTML5 本地存储（而非远程服务器存储）的集合。为此，你的集合定义需要一个新的\
  \ `localStorage` 参数。\n\n```\nlocalStorage : new Backbone.LocalStorage(\"libraryapp:MyLibrary\"\
  ),\n```\n\n创建新的 `LocalStorage` 实例时使用的字符串参数是你应用程序内容的唯一标识符。\n\n```\nvar Book = Backbone.Model.extend({});\n\
  \nvar Library = Backbone.Collection.extend({\n    model: Book,\n    localStorage\
  \ : new Backbone.LocalStorage(\"MyLibrary\"),\n});\n\n//define contents\nvar backboneBook\
  \ = new Book({name: 'Beginning Backbone', author: 'James Sugrue', year: '2013-12-24'});\n\
  var nodeBook = new Book({name: 'Pro Node.js for Developers', author: 'Colin J. Ihrig',\
  \ year: '2013-11-01'});\nvar proJavascriptBook = new Book({name: 'Pro JavaScript\
  \ Techniques', author: 'John Resig', year: '2006-02-01'});\n\n//create collection\n\
  var myLibrary = new Library();\n```\n\n请注意，在撰写本文时，为使你的模型项目正确存储在本地存储中，你需要使用集合的 `create`\
  \ 函数，而不是 `set` 函数。\n\n```\nmyLibrary.create(backboneBook);\nmyLibrary.create(nodeBook);\n\
  ```\n\n现在，当你通过 Chrome 开发者工具在“资源”选项卡中检查应用程序的本地存储时，你应该会找到已添加到集合中的两本书的详细信息，如图 7-1 所示。\n\
  \n![A978-1-4302-6335-7_7_Fig1_HTML.jpg](img/A978-1-4302-6335-7_7_Fig1_HTML.jpg)\n\
  \n图 7-1. 执行上述示例后应用程序的本地存储\n\n### Backbone.dualStorage\n\n`Backbone.dualStorage`\
  \ (https://github.com/nilbus/Backbone.dualStorage) 比 `Backbone.localStorage` 更进一步，它为你的数据提供了一种本地缓存机制，这样如果你的应用程序离线，数据仍能继续存储，并在连接恢复时与服务器同步。\n\
  \n#### 为什么要使用 Backbone.dualStorage\n\n这个插件对于基于 Backbone 构建的移动应用特别有用，因为连接可能是一个问题。如果你发现由于连接中断或服务器停机而导致数据丢失，这可能是处理该问题的一种相对简单的方法。此外，这允许用户始终拥有完整的应用程序体验。对于在各国之间漫游的用户来说，这可能是一个必不可少的移动功能。\n\
  \n### 配置\n\n要将 `Backbone.dualStorage` 包含到你的应用程序中，只需从 https://github.com/nilbus/Backbone.dualStorage\
  \ 下载该库，并将其包含到你的 HTML 页面中。\n\n```\n<script src=\"js/external/backbone.dualstorage.js\"\
  ></script>\n```\n\n#### 使用 Backbone.dualStorage\n\n`Backbone.dualStorage` 是所有 Backbone\
  \ 插件中最容易在你的项目中使用的插件之一，因为其默认行为无需更改代码。\n\n```\n//Model and Collection definitions\n\
  var Book = Backbone.Model.extend({});\n\nvar Library = Backbone.Collection.extend({\n\
  \    model: Book,\n    url: 'http://localhost:8080/books/',\n});\n\n//define contents\n\
  var backboneBook = new Book({name: 'Beginning Backbone', author: 'James Sugrue',\
  \ year: '2013-12-24'});\nvar nodeBook = new Book({name: 'Pro Node.js for Developers',\
  \ author: 'Colin J. Ihrig', year: '2013-11-01'});\nvar proJavascriptBook = new Book({name:\
  \ 'Pro JavaScript Techniques', author: 'John Resig', year: '2006-02-01'});\n\n//create\
  \ collection\nvar myLibrary = new Library();\n\nmyLibrary.create(backboneBook);\n\
  myLibrary.create(nodeBook);\n```\n\n运行上述代码后，你的应用程序的本地存储中会出现一个缓存副本。再次检查 Chrome 开发者工具以确认这一点，如图\
  \ 7-2 所示。\n\n![A978-1-4302-6335-7_7_Fig2_HTML.jpg](img/A978-1-4302-6335-7_7_Fig2_HTML.jpg)\n\
  \n图 7-2. Chrome 开发者工具显示本地缓存的项目\n\n如果你检测到客户端和服务器不同步，你可以对集合调用一个特殊的同步函数，将所有本地更改发送到服务器。\n\
  \n```\nmyLibrary.syncDirtyAndDestroyed();\n```\n\n请注意，你需要编写自己的代码来检测连接的丢失和重新建立。\n\
  \n如果你希望某些集合有不同的行为，你可以在创建时使用 `remote: true` 参数将它们设置为从不缓存。你还可以使用 `local: true` 参数将集合设置为仅本地保存更改。\n\
  \n### Backbone.ViewModel\n\n`Backbone.ViewModel` 可从 http://github.com/tommyh/backbone-view-model\
  \ 获取，它允许你创建一个能够处理更复杂视图的模型。如果你为了视图而更改了模型的属性，这些属性可能会同步到服务器。因此，将你的视图模型与持久化模型分离是合理的。\n\
  \n\n#### 为什么要使用 `Backbone.ViewModel`\n\n当应用中的视图在显示前需要对持久化模型中存储的数据进行大量转换时，就需要进行适当的关注点分离。\n\
  \n### 配置\n\n`Backbone.ViewModel` 只是一个单独的 JavaScript 文件，其中包含一种不同类型的模型定义。你可以从 [`https://github.com/tommyh/backbone-view-model`](https://github.com/tommyh/backbone-view-model)\
  \ 下载它，并将其包含在你的 HTML 页面中。\n\n```\n<script src=\"js/external/view-model.js\"></script>\n\
  ```\n\n#### 使用 `Backbone.ViewModel`\n\n`Backbone.ViewModel` 会扩展你已创建的普通模型，允许你指定一组用于视图的计算属性。首先，让我们创建一个作为视图基础的简单模型。\n\
  \n```\nvar Book = Backbone.Model.extend({});\n```\n\n```\nvar backboneBook = new\
  \ Book({name: 'Beginning Backbone', author: 'James Sugrue', year: '2013-12-24'});\n\
  ```\n\n`ViewModel` 将基于此模型，该模型会作为 `source_model` 属性存储在 `ViewModel` 对象中。创建 `ViewModel`\
  \ 对象时，`computed_attributes` 哈希表允许你创建函数，用于转换 `source_model` 属性中属性的表示形式。\n\n```\n\
  var BookViewModel = Backbone.ViewModel.extend({\n\n     'truncated_book_title' :\
  \ function(){\n\n       return this.get('source_model').get('name').substring(0,\
  \ 10) + '...';\n\n     },\n\n     'author' : function(){\n\n           return this.get('source_model').get('author');}\n\
  \n     }\n\n});\n```\n\n虽然这对于截断书名很有用，但您还需要暴露原始模型中需要在视图中显示的变量。\n\n请注意，在视图的 `render`\
  \ 函数中，你现在处理的是 `ViewModel` 中出现的属性。\n\n```\n//定义图书馆视图\n\nMyView = Backbone.View.extend({\n\
  \n el : '.container',\n\n model : null,\n\n content: null,\n\n initialize: function(options){\n\
  \n   this.model = options.model;\n\n },\n\n render: function(){\n\n   var self =\
  \ this;\n\n   self.$el.html('作者是 ' + this.model.get('author') + ' 标题是 ' + this.model.get('truncated_book_title'));\n\
  \n   return self;\n\n   },\n\n});\n```\n\n创建视图实例时，`ViewModel` 作为 `model` 传入，而不是\
  \ `backboneBook`，而 `backboneBook` 本身是 `ViewModel` 的一个参数。\n\n```\nvar backboneBookViewModel\
  \ = new BookViewModel({source_model: backboneBook});\n\nvar view1 = new MyView({model:\
  \ backboneBookViewModel});\n\nview1.render();\n```\n\n虽然这会使你的代码稍微复杂一些，但某些应用可能希望以这种方式强制分离持久化模型和视图模型。我更喜欢使用\
  \ Handlebars 辅助函数在渲染时修改属性。\n\n### `Backbone-Validator`\n\n有许多扩展可以帮助你在内置的 Backbone\
  \ `validate()` 函数之外对模型进行验证。其中之一是 `Backbone-Validator`（[`https://github.com/fantactuka/backbone-validator`](https://github.com/fantactuka/backbone-validator)），它提供模型验证功能，并允许将事件绑定到视图，以便在需要时显示验证错误。\n\
  \n#### 为什么要使用 `Backbone-Validator`\n\n当应用需要大量验证，并且视图需要显示任何验证错误时，此插件消除了使用标准 Backbone\
  \ JavaScript 代码时需要编写的大量自定义代码。基于表单的应用是该插件最明显的受益者。\n\n### 配置\n\n`Backbone-Validator`\
  \ 只需从 [`https://github.com/fantactuka/backbone-validator`](https://github.com/fantactuka/backbone-validator)\
  \ 下载并包含在你的 HTML 页面中。\n\n```\n<script src=\"js/external/backbon-validator.js\"></script>\n\
  ```\n\n#### 使用 `Backbone-Validator`\n\n任何模型都可以通过传递一个 `validation` 哈希表来扩展以使用 `Backbone-Validator`，该哈希表包含要验证的属性名称以及许多验证设置，例如是否可以为空、应使用何种格式以及验证失败时要显示的消息。\n\
  \n以下示例将此验证添加到 `Book` 模型中：\n\n```\n//模型和集合定义\n\nvar Book = Backbone.Model.extend({\n\
  \n validation:\n\n {\n\n   name: {\n\n     blank: false,\n\n     message: '每本书都需要一个名字'\n\
  \n   },\n\n }\n\n});\n```\n\n可以通过创建一个未设置 `name` 属性的 `Book` 对象来轻松测试这一点。\n\n```\n\
  var backboneBook = new Book();\n\nconsole.log('这是有效的吗？ ' + backboneBook.isValid());\n\
  ```\n\n上一个日志语句的结果将返回 `false`。此外，如果你强制 `set` 函数使用验证，你将强制填充对象的 `validationError` 数组。\n\
  \n```\nbackboneBook.set({name: ''}, {validate: true});\n\nconsole.log(backboneBook.validationError);\n\
  ```\n\n最重要的是，你可以通过在视图的 `initialize` 函数中添加对 `bindValidation` 的调用，轻松地让视图绑定处理无效字段的\
  \ `callbacks`。\n\n```\n//定义图书馆视图\n\nMyView = Backbone.View.extend({\n\n el : '.container',\n\
  \n model : null,\n\n content: null,\n\n initialize: function(options){\n\n   this.model\
  \ = options.model;\n\n   this.bindValidation();\n\n },\n\n onInvalidField: function(attrName,\
  \ attrValue, errors, model){\n\n   alert(attrName + ' 有一个无效的值');\n\n },\n\n render:\
  \ function(){\n\n   var self = this;\n\n   self.$el.html('作者是 ' + this.model.get('author')\
  \ + ' 书名是 ' + this.model.get('name'));\n\n   return self;\n\n   },\n\n});\n\nvar\
  \ view1 = new MyView({model: backboneBook});\n\nview1.render();\n```\n\n当传递给视图的模型中使用了无效字段时，前面的代码将显示一个警告对话框。该扩展包含了许多验证器，涵盖格式、长度以及是否需要值。\n\
  \n## Query Engine\n\n虽然在小集合中查找变量很容易，但对于更复杂的实际应用，你可能需要更强大的搜索和过滤功能来处理更大的集合。Query Engine（[`https://github.com/bevry/query-engine`](https://github.com/bevry/query-engine)）开箱即用地提供了这些功能，甚至支持\
  \ NoSQL 查询，并且可以在 node.js 服务器以及你的浏览器上运行。\n\n### 为什么要使用 Query Engine\n\n如果你正在处理大型集合，并且需要为应用提供大量搜索、过滤和查询功能，Query\
  \ Engine 将使你的代码更易于理解，并且可能比自定义解决方案性能更好。如果你正在构建一个提供数据库搜索功能且不想将所有过滤都推迟到服务器端的应用，那么使用这个库是合理的。\n\
  \n### 配置\n\n要将 `QueryEngine` 包含到你的项目中，你只需从 [`https://github.com/bevry/query-engine/blob/master/out/lib/query-engine.js`](https://github.com/bevry/query-engine/blob/master/out/lib/query-engine.js)\
  \ 下载 `query-engine.js` 文件，并将其包含在你的 HTML 页面中。\n\n```\n<script src=\"js/external/query-engine.js\"\
  ></script>\n```\n\n\n\n### 使用 QueryEngine\n\n`QueryEngine` 为自定义的 `QueryCollection`\
  \ 类提供两种状态：标准状态（standard）和实时状态（live）。实时集合会监听集合事件，以便集合中的任何更改都会导致相关查询被重新执行。\n\n您无需创建标准的\
  \ `Backbone.Collection`，而是需要使用 `queryEngine.QueryCollection.extend` 来创建一个 `QueryCollection`，如下代码所示：\n\
  \n```\n// 模型和集合定义\nvar Book = Backbone.Model.extend({\n\n});\n\nvar Library = queryEngine.QueryCollection.extend({\n\
  \    model: Book,\n});\n```\n\n通过这样的设置，现在可以使用 `QueryCollection` 的任何函数。例如，以下代码将一个包含四本书的集合初始化：\n\
  \n```\n// 定义内容\nvar backboneBook = new Book({name: 'Beginning Backbone', author:\
  \ 'James Sugrue', year: '2013-12-24'});\nvar nodeBook = new Book({name: 'Pro Node.js\
  \ for Developers', author: 'Colin J. Ihrig', year: '2013-11-01'});\nvar proJavascriptBook\
  \ = new Book({name: 'Pro JavaScript Techniques', author: 'John Resig', year: '2006-02-01'});\n\
  var backboneBook2 = new Book({name: 'Backbone: The Sequel', author: 'James Sugrue',\
  \ year: '2014-12-01'});\n\n// 创建集合\nvar myLibrary = new Library();\nmyLibrary.set([backboneBook,\
  \ nodeBook, proJavascriptBook, backboneBook2]);\n```\n\n现在，要查找特定作者的所有书籍，可以使用 `findAll`\
  \ 函数，并传入相应的过滤属性：\n\n```\nvar results =  myLibrary.findAll({author: 'James Sugrue'});\n\
  console.log('Returned ' + results.length + ' results');\n```\n\n在 `results` 变量中，将包含两个模型，它们对应作者为\
  \ `James Sugrue` 的书籍。\n\n## ModelAttrs\n\n`ModelAttrs` ([`github.com/rhysbrettbowen/Backbone.ModelAttrs`](https://github.com/rhysbrettbowen/Backbone.ModelAttrs))\
  \ 是一个简单的 Backbone 插件，它允许您使用更简洁、类似于 jQuery 的格式来检索和设置属性。\n\n### 为什么要使用 ModelAttrs\n\
  \n如果您觉得 `model.set('attribute name', 'attribute value')` 这种语法过于冗长，而更倾向于使用更简洁的格式，那么\
  \ `ModelAttrs` 可以成为您项目代码中的一个简单改动。\n\n### 配置\n\n`ModelAttrs` 是一个非常小的 JavaScript 文件，可以从\
  \ [`github.com/rhysbrettbowen/Backbone.ModelAttrs`](https://github.com/rhysbrettbowen/Backbone.ModelAttrs)\
  \ 下载并包含在您的 HTML 页面中。\n\n```\n<script src=\"js/external/attrs.js\"></script>\n```\n\
  \n### 使用 ModelAttrs\n\n要使用 `ModelAttrs`，您需要使用该库提供的 `toAttrs` 函数将您的 `model` 对象转换为\
  \ `ModelAttrs` 对象。\n\n```\ntoAttrs(<model>)\n```\n\n以下代码展示了如何使用该库从现有的 Backbone 模型中获取变量：\n\
  \n```\n// 模型定义\nvar Book = Backbone.Model.extend({\n\n});\n\n// 定义内容\nvar backboneBook\
  \ = new Book({name: 'Beginning Backbone', author: 'James Sugrue', year: '2013-12-24'});\n\
  var backboneAttrs = toAttrs(backboneBook);\nconsole.log(backboneAttrs.name());\n\
  ```\n\n现在，您可以通过调用 `.name()` 函数来获取书名，而无需使用 `backboneBook.get('name')`。\n\n设置变量也同样简单，最重要的是，对变量的设置会反映到原始的模型对象中，如下代码所示：\n\
  \n```\nbackboneAttrs.name('Beginning Backbone.js');\nconsole.log(backboneAttrs.name());\n\
  console.log(backboneBook.get('name'));\n```\n\n## 开发者工具和实用工具\n\nBackbone 生态系统并不仅限于库的扩展。借助\
  \ Chrome 和 Firefox 中强大的开发者工具，您可能会认为不需要其他任何东西了。然而，Firefox 有一个名为 Backbone Eye ([`dhruvaray.github.io/spa-eye/`](http://dhruvaray.github.io/spa-eye/))\
  \ 的附加组件，它可以帮助开发者理解 Backbone 应用程序的行为，而无需调试 JavaScript。\n\n该附加组件扩展了 Firebug，因此，一旦您安装了\
  \ Firebug 和 Backbone Eye 附加组件，您就会在 Firebug 浏览器中看到一个新选项卡，如图 7-3 所示。\n\n![A978-1-4302-6335-7_7_Fig3_HTML.jpg](img/A978-1-4302-6335-7_7_Fig3_HTML.jpg)\n\
  \n图 7-3.\n\nBackbone Eye 附加组件在运行中\n\n图 7-3 是使用 Backbone Eye 检查 LayoutManager 插件示例的结果。模型、集合和视图都在该工具中列出。然而，最重要的视图是\
  \ **僵尸（Zombies）** 方面，它列出了即使通过 Backbone 的 `remove` 或 `destroy` 调用从应用程序中移除后仍在使用中的对象。\n\
  \n**交互工具（Interaction Tools）** 视图绘制序列图，说明项目中的视图、模型和应用程序之间的交互流程。\n\n当新开发者加入项目并需要了解代码基础时，`Backbone\
  \ Eye` 可以成为一个非常有用的工具。它也是定位内存泄漏的好方法。\n\n## 快速参考\n\n表 7-1 描述了本章中列出的所有项目。所有项目均采用 MIT\
  \ 许可。\n\n表 7-1.\n\n本章提及项目的快速参考\n\n| 项目 | 描述 |\n| --- | --- |\n| LayoutManager |\
  \ 提供 Backbone 应用中视图和子视图的管理。 |\n| Backgrid | 提供数据网格用户界面元素，例如表格。 |\n| BackboneUI |\
  \ 提供许多小部件，这些小部件在小部件和模型之间提供完整的数据绑定。 |\n| Backbone.stickit | 当模型发生变化时，无需任何额外代码即可动态更新\
  \ Backbone 视图。 |\n| Backbone.Notifications | 用最少的代码在用户界面上提供全局通知。 |\n| Backbone.trackit\
  \ | 允许跟踪模型属性中的多个更改。 |\n| Backbone.memento | 提供完整的撤销/重做栈，用于在应用程序生命周期内跟踪模型的变化。 |\n\
  | Backbone.localStorage | 提供将集合数据存储在本地 HTML5 存储中而非服务器上的选项。 |\n| Backbone.dualStorage\
  \ | 提供一个适配器，将更改缓存在本地存储中，允许 Backbone 应用离线使用。 |\n| Backbone.ViewModel | 在持久化模型和用于视图的模型之间创建分离。\
  \ |\n| Backbone.Validator | 增强了模型的验证功能，包括对任何验证错误的视图绑定。 |\n| QueryEngine | 为 Backbone\
  \ 集合提供强大的搜索和过滤功能。 |\n| ModelAttrs | 更简洁地设置和获取 Backbone 模型的属性值。 |\n\n"
- '# 总结


  在本章中，我们介绍了一些有助于增强 Backbone 应用程序的项目。视图层和模型层都存在一些优秀的扩展，使 Backbone 能够获得一些人在基础 Backbone
  产品中认为缺失的额外功能。


  本章只是触及了 Backbone 社区中所提供内容的皮毛。通常会有多个项目可以帮助解决类似的问题，因此，如果这里描述的库不完全符合您的要求，您应该看看一些替代方案。有关社区项目的全面列表，请查看
  Jeremy Ashkenas 在 [`github.com/jashkenas/backbone/wiki/Extensions,-Plugins,-Resources`](https://github.com/jashkenas/backbone/wiki/Extensions,-Plugins,-Resources)
  上的列表。




