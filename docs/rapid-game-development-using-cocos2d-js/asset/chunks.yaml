    be one of the following values: `{cc.TEXT_ALIGNMENT_LEFT|cc.TEXT_ALIGNMENT_CENTER|cc.TEXT_ALIGNMENT_RIGHT}`

    *   `[cc.point] imageOffset` – represents the x,y offset point where the image
    center needs to be aligned


