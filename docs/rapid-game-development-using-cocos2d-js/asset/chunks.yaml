    9           this.Label.attr({

    10               x: size.width / 2,

    11               y: size.height / 2

    12           });

    14           this.addChild(this.Label);

    16           this.timer=0;

    17           this.schedule(this.onUpdate,1);

    19           return true;

    20       },

    21       onUpdate:function(){

    22           this.Label.setString((this.timer++)+'' 秒'');

    23       }

    24   });

    ```


    您将看到如图 8-4 所示的输出。


