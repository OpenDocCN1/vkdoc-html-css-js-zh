  raw: '### 7.9.5 Damped Spring


    In damped spring, `bodyA` and `bodyB` will be connected to the two ends of the
    spring, and we have to provide other parameters that define the behavior of the
    spring.


    First, initialize the Chipmunk space. Like in the previous example, we are going
    to add a circle and establish a slide joint to the static body for better visualization.
    See here:


    ```

