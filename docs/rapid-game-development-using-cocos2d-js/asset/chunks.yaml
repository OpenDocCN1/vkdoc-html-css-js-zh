    ```

    1   var size = cc.winSize;

    3   this.Label = new cc.LabelTTF('''','''', 32);

    4   this.Label.attr({

    5      x: size.width / 2,

    6      y: size.height / 2

    7   });

    9   this.addChild(this.Label);

    ```


    然后，在 `layer` 对象中有一个回调函数，并用文本更新 `Label`：


    ```

    1   onUpdate:function(){

    2     this.Label.setString((this.timer++)+'' 秒'');

