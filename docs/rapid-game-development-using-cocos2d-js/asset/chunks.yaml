- fmt: '### 3.9.1 SpriteBatchNode


    `cc.SpriteBatchNode` is the sprite class used to combine multiple sprites into
    a single draw call. Let’s have a look at an example.


    First, let’s create four individual sprites with the same sprite sheets and different
    `SpriteFrame` rects:


    ```

    1   this.sprite1 = new cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,67,94));

    2   this.sprite1.attr({

    3       x: size.width / 2,

    4       y: size.height / 1.5

    5   });


    7   this.sprite2 = new cc.Sprite(res.Sprite_Sheet,cc.rect(73,0,72,97));

    8   this.sprite2.attr({

    9       x: size.width / 2,

    10      y: size.height / 2

    11  });


    13  this.sprite3 = new cc.Sprite(res.Sprite_Sheet,cc.rect(219,0,72,97));

    14  this.sprite3.attr({

    15      x: size.width / 2,

    16      y: size.height / 3

    17  });


    19  this.sprite4 = new cc.Sprite(res.Sprite_Sheet,cc.rect(365,0,72,97));

    20  this.sprite4.attr({

    21      x: size.width / 2,

    22      y: size.height / 5

    23  });

    ```


    Now, let’s create an instance of `SpriteBatchNode` with the same sprite sheet:


    ```

    1   this.spritebatch=new cc.SpriteBatchNode(res.Sprite_Sheet);

    ```


    Let’s add sprites to the `SpriteBatchNode`:


    ```

    1   this.spritebatch.addChild(this.sprite1, 0);

    2   this.spritebatch.addChild(this.sprite2, 0);

    3   this.spritebatch.addChild(this.sprite3, 0);

    4   this.spritebatch.addChild(this.sprite4, 0);

    ```


    Finally, let’s add `spritebatch` to the layer:


    ```

    1   this.addChild(this.spritebatch);

    ```


    Now, the full code is supposed to look like this:


    ```

    1   var SpriteBatchLayer = BaseSampleLayer.extend({

    2       sprite:null,

    3       ctor:function () {


    5           this._super();


    7           var size = cc.winSize;


    9           this.sprite1 = new cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,67,94));

    10          this.sprite1.attr({

    11              x: size.width / 2,

    12              y: size.height / 1.5

    13          });


    15          this.sprite2 = new cc.Sprite(res.Sprite_Sheet,cc.rect(73,0,72,97));

    16          this.sprite2.attr({

    17              x: size.width / 2,

    18              y: size.height / 2

    19          });


    21          this.sprite3 = new cc.Sprite(res.Sprite_Sheet,cc.rect(219,0,72,97));

    22          this.sprite3.attr({

    23              x: size.width / 2,

    24              y: size.height / 3

    25          });


    27          this.sprite4 = new cc.Sprite(res.Sprite_Sheet,cc.rect(365,0,72,97));

    28          this.sprite4.attr({

    29              x: size.width / 2,

    30              y: size.height / 5

    31          });

    32          this.spritebatch=new cc.SpriteBatchNode(res.Sprite_Sheet);


    34          this.spritebatch.addChild(this.sprite1, 0);

    35          this.spritebatch.addChild(this.sprite2, 0);

    36          this.spritebatch.addChild(this.sprite3, 0);

    37          this.spritebatch.addChild(this.sprite4, 0);


    39          this.addChild(this.spritebatch);


    41          return true;

    42      }

    43  });

    ```


    Note that all the sprites that belong to a single `SpriteBatchNode` must use the
    same instance of `texture`; also, `SpriteBatchNode` must contain a reference to
    the same texture. Otherwise, Cocos2d-js will not render the `SpriteBatchNode`.


    The final output will look like that shown in Figure [3-12](#A435521_1_En_3_Chapter.html#Fig12).


    ![A435521_1_En_3_Fig12_HTML.jpg](A435521_1_En_3_Fig12_HTML.jpg)


    Figure 3-12. SpriteBatchNode rendering


    However, the native renderer supports auto batching, which means if you are going
    for native deployment, sprite batching is supported automatically without the
    `SpriteBatchNode`.


    ## 3.10 Resolution Policies


    Resolution policies are about adapting your game to different screen resolutions
    and profiles. Cocos2d-js offers sets of resolution policies with which to adapt
    your games. Without these, you have to manually scale up or down the content of
    your game based on the screen resolution.


    There are two types of resolution policies: pre-defined policies and custom policies.
    Pre-defined policies are offered by Cocos2d-js and are composed of various combinations
    of container and content strategies; they are supported in native deployments
    as well. With custom policies, you can define your own resolution policies with
    the combination of available containers and content strategies, but custom policies
    are supported only in Web deployments. Let’s have a look.


    ### 3.10.1 Terminology


    You need to be aware of certain terms in order to fully understand resolution
    policies. You may already know that your game is hosted in a canvas in your web-based
    Cocos2d-js game. See Figure [3-13](#A435521_1_En_3_Chapter.html#Fig13).


    ![A435521_1_En_3_Fig13_HTML.jpg](A435521_1_En_3_Fig13_HTML.jpg)


    Figure 3-13. Terminology used in resolution policies


    #### 3.10.1.1 Frame


    This represents the container outer to the canvas, usually a body element if you
    use the default `index.html` generated by the Cocos console.


    #### 3.10.1.2 Container


    Cocos2d-js wraps your canvas in a `div` element, and that wrapped content is then
    again added to the original container element of `canvas`.


    #### 3.10.1.3 Content


    Everything inside the `canvas` which is not part of `dom`.


    #### 3.10.1.4 Viewport


    `Viewport` represents the world `rect` of canvas; it is canvas coordinates in
    pixels.


    #### 3.10.1.5 Letter Boxing


    When the width of the container matches the frame but the height does not, you
    get letter boxing (Figure [3-14](#A435521_1_En_3_Chapter.html#Fig14)). It will
    occur if the w/h ratio does not match with the frame, and is also based on the
    resolution policy you use.


    ![A435521_1_En_3_Fig14_HTML.jpg](A435521_1_En_3_Fig14_HTML.jpg)


    Figure 3-14. Letter boxing


    #### 3.10.1.6 Pillar Boxing


    When the height of the container matches the height of the frame but the width
    does not, you get pillar boxing (see Figure [3-15](#A435521_1_En_3_Chapter.html#Fig15)).
    The reason for this occurrence is the same as for letter boxing.


    ![A435521_1_En_3_Fig15_HTML.jpg](A435521_1_En_3_Fig15_HTML.jpg)


    Figure 3-15. Pillar Boxing


    ### 3.10.2 Pre-defined Resolution Policies


    There are five predefined policies offered by Cocos2d-js, which we will now discuss.


    #### 3.10.2.1 SHOW_ALL


    This will scale up the container to the maximum size within the container bounds;
    all the contents in the current scene will be visible.


    #### 3.10.2.2 NO_BORDER


    This will scale up the container to fill the frame so that there won’t be any
    visible area in the frame while maintaining the proportion of provided width and
    height.


    #### 3.10.2.3 EXACT_FIT


    This will scale the container to fit into the frame. Note that the provided width
    and height ratio won’t be maintained.


    #### 3.10.2.4 FIXED_WIDTH


    This will scale the width of the container to match the width of the frame and
    scale the height to match the w/h ratio. You may see letter boxing, if the w/h
    ratio won’t match.


    #### 3.10.2.5 FIXED_HEIGHT


    This will scale the height of the container to match the frame’s height and scale
    the width to match the w/h ratio. You may see pillar boxing, if the w/h ratio
    won’t match.


    ### 3.10.3 How to Use


    In the file `main.js`, there is a `cc.game.onStart` callback. You have to use
    the following line of code to set the resolution profile:


    ```

    1   cc.view.setDesignResolutionSize(320, 480, cc.RESOLUTION_POLICY.SHOW_ALL);

    ```


    The first two parameters are width and height, which is the aspect ratio of your
    game, and the third is the resolution policy.'
