  raw: '## 8.7 Accessing Current Language


    Cocos2d-Js also provides a way to access the current locale in your runtime. There
    is a property in `cc.sys` where you can access the current language string:


    ```

    1   cc.sys.language

    ```


    Let’s see a quick example. As in previous examples, add a label to an empty layer:


    ```

    1   this.Label = new cc.LabelTTF('''','''', 32);

    2   this.Label.attr({

    3       x: size.width / 2,

    4       y: size.height / 2

    5   });


    7   this.addChild(this.Label);

    ```


    Then, access the language:


    ```

    1   var language=cc.sys.language;

    ```


    Then, set it to the label you added:


    ```

    1   //set the language string

    2   this.Label.setString(''Current Locale: ''+language);

    ```


    Here is the full code:


    var LanguageLayer = BaseSampleLayer.extend({ sprite:null, ctor:function () { this._super();


    ```

    1   var size = cc.winSize;


    3   this.Label = new cc.LabelTTF('''','''', 32);

    4   this.Label.attr({

    5       x: size.width / 2,

    6       y: size.height / 2

    7   });


    9   this.addChild(this.Label);


    11   var language=cc.sys.language;


    13     //set the language string

    14     this.Label.setString(''Current Locale: ''+language);

    15     return true;

    16    }

    17   });

    ```


    You will get the output shown in Figure [8-5](#A435521_1_En_8_Chapter.html#Fig5).


    ![A435521_1_En_8_Fig5_HTML.jpg](A435521_1_En_8_Fig5_HTML.jpg)


    Figure 8-5.


    Accessing locale


    ## 8.8 Accessing System Capabilities


    As you already know, your Cocos2d-js games can be deployed to different native
    platforms, which may have different capabilities. Cocos2d-js provides a way to
    detect the capabilities of the current environment through `cc.sys`:


    ```

    1   cc.sys.capabilities

    ```


    If you console this object in your browser, you will get an object structure like
    the following:


    ```

    1   {

    2      accelerometer: true,

    3      canvas: true,

    4      keyboard: true,

    5      mouse: true,

    6      opengl: true,

    7   }

    ```


    For example, if you want to detect if the system supports touch, you can simply
    query this object for the touch property. Similarly, other native capabilities
    can be queried.


    ## 8.9 Optimization


    Optimization is a very crucial part of any kind of game. This is not the last
    process in your game development, however, as you have to plan ahead even before
    your coding process. There are certain tips and tricks that have been found to
    be best practices.


    ### 8.9.1 Memory Optimization


    *   Most of the memory in your game will be consumed by textures, so you have
    to pay closer attention to the size of the textures you are loading. Have a best
    practice of loading textures only when needed.

    *   Try to combine all the textures in your game into a sprite sheet or a texture
    atlas, as this will save you lot of memory.

    *   Also, it is good practice to always use NPOT textures instead of POT.


    ### 8.9.2 Performance Optimization


    *   When it comes to performance or the draw call’s frame rate, delta time plays
    an important role.

    *   Make sure you avoid using a lot of draw calls. Use a single texture for all
    the sprites in your game, as this will enable sprite batching.

    *   Also, make sure you use `SpriteBatchNode` to combine all the needed sprites
    to be rendered in a single draw call if your platform doesn’t support auto batching.

    *   If you write custom shaders, make sure your vertex and fragment shaders don’t
    have any intensive operations.

    *   Having a complex computation in a shader will throttle the performance of
    the GPU, especially in fragment functions, since a fragment function will be executed
    for every pixel in your screen.

    *   Try to use 16-bit textures with RBGA4444 color depth.


    ### 8.9.3 JavaScript Level


    *   Make sure you have memory leak`–`free code.

    *   When you reference inner nodes maintained in outer nodes, make sure you clear
    the values when they are not needed.

    *   Use only documented APIs, as the usage and tweaking of internal variables
    and functions will lead to inconsistent behavior, as undocumented APIs are subject
    to changes in the upcoming versions.


    ## 8.10 Conclusion


    So far, we have seen the features of Cocos2d-js from scratch. I hope this will
    give you a head start on your game development,. Cocos2d-x is big world, and a
    single book is not enough to explain all of its features in detail. We covered
    almost all of the features and advanced techniques as much as possible. It’s time
    for you to create your own awesome game.


