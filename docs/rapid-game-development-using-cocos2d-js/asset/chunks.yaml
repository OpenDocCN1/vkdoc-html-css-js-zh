- fmt: '# 7.9 Joints


    Joints are nothing but joining two physics bodies with anchor points or relating
    them with some physical behaviors. In the real world, things we encounter—from
    your phone to your car—are a collection of different pieces of objects joined
    together with joints and nails. The same is true for chipmunk bodies. There are
    different types of joints available in Chipmunk, as follows:


    - Pin Joint

    - Slide Joint

    - Pivot Joint

    - Groove Joint

    - Damped Spring

    - Damped Rotary Spring

    - Rotary Limit Joint

    - Simple Motor

    - Gear Joint

    - Ratchet Joint


    We are going to look into all the preceding joints with examples, but before we
    do there are some common functions that we are going to use in all of these examples.
    Let’s have a look:


    ```

    1   addBottomWall: function() {

    2     var bottomWall = new cp.SegmentShape(this.space.staticBody, new cp.v(0,
    0),

    3     new cp.v(cc.winSize.width, 0), 5);

    4     bottomWall.setElasticity(1);

    5     bottomWall.setFriction(1);

    6     this.space.addStaticShape(bottomWall);

    7   }

    ```


    This function adds the bottom wall to the Chipmunk space so that the physics body
    won’t fall below the screen. This wall is made up of `SegmentShape` and is added
    to the static body in the Chipmunk space.


    ```

