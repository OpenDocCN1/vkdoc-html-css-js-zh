    29          {

    30               var spriteFrame = new cc.SpriteFrame(texture, frameDatas[index]);

    31               var animFrame = new cc.AnimationFrame();

    32               animFrame.initWithSpriteFrame(spriteFrame, 1, null);

    33               animFrames.push(animFrame);

    34          }


    36          //Create an empty sprite

    37          this.sprite = new cc.Sprite();

    38          this.sprite.attr({

    39               x: size.width / 2,

    40               y: size.height / 2

    41          });


    43          this.addChild(this.sprite, 0);


    45          var animation = cc.Animation.create(animFrames, 0.08);

    46          var animate = cc.Animate.create(animation);


    48          //Animate the sprite frame on the empty sprite

    49          this.sprite.runAction(animate.repeatForever());


    51          return true;

    52       }

    53   });

    ```


    The idea behind the frame animation is that we are going to run through each frame
    in a specific time interval so that it will look like an animation sequence. In
    the preceding code, `walk01` to `walk11` represent frames with `rects` in the
    sprite sheet. If we put these frames together and run through it, it will look
    like a walking animation.


    A `SpriteFrame` instance is created with this frame `rect` array (see Figure [3-6](#A435521_1_En_3_Chapter.html#Fig6)):


    ![A435521_1_En_3_Fig6_HTML.jpg](A435521_1_En_3_Fig6_HTML.jpg)


    Figure 3-6.


    SpriteFrame


    ```

    1   var texture = cc.textureCache.addImage(res.Sprite_Sheet);

    2   var animFrames=[];

    3   for(var index in frameDatas)

    4   {

    5       var spriteFrame = new cc.SpriteFrame(texture, frameDatas[index]);

    6       var animFrame = new cc.AnimationFrame();

    7       animFrame.initWithSpriteFrame(spriteFrame, 1, null);

    8       animFrames.push(animFrame);

    9   }

    ```


    In this example, we are manually creating the `cc.SpriteFrame` instance, so it
    is going to need a `texture` instance of the sprite sheet. Thus, we added the
    sprite sheet to the texture cache, which returns the `texture` instance, which
    can be used to create all of the sprite frames.


    Finally, the `cc.Animation` instance, which is used to perform the animation,
    is created using the list of images from `cc.AnimationFrame` with a time interval
    of 0.08 seconds.


    The output will be a nice walk animation.


    In the preceding case, frame data has been formed manually for a complete understanding
    of frame animation, but in reality the sprite sheet will be created from an individual
    image with the help of tools like TexturePack, and associated data files will
    be created. In the case of Cocos2d, it is a PList file that has all of the frame
    data related to the sprite sheet. In the next example, will see how to create
    the frame animation using PList.'
  trans: '

    ### 3.4 使用精灵表的精灵


    为减少内存占用，应将所有资源打包到一张精灵表中，并在整个游戏过程中使用该精灵表。对于单个精灵而言，`cc.SpriteFrame` 实例将定义需要显示在 `cc.Sprite`
    实例显示帧中的精灵表部分。我将使用图 3-4 中所示的精灵表进行下一个示例。


    ![A435521_1_En_3_Fig4_HTML.jpg](img/A435521_1_En_3_Fig4_HTML.jpg)


    图 3-4. `sprite_sheet.png`


    在 `src` 目录下，创建一个名为 `spritesheet.js` 的文件，并将以下代码复制进去：


    ```

    1   var SpriteSheetLayer = cc.Layer.extend({

    2       sprite:null,

    3       ctor:function () {

    5           this._super();

    7           var size = cc.winSize;

    9           this.sprite = new cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,67,94));

    10          this.sprite.attr({

    11              x: size.width / 2,

    12              y: size.height / 2

    13          });

    14          this.addChild(this.sprite, 0);

    16          return true;

    17      }

    18  });

    ```


    按照上一个示例的步骤，将 `SpriteSheetLayer` 包含到 `HelloWorldScene` 中。在 `resource.js` 文件中，创建一个
    `Sprite_Sheet` 变量并指定精灵表的文件名。


    如您所见，精灵使用精灵表作为纹理进行初始化，并通过 `rect` 设置需要显示的当前帧。参见图 3-5。


    ![A435521_1_En_3_Fig5_HTML.jpg](img/A435521_1_En_3_Fig5_HTML.jpg)


    图 3-5. 使用精灵表的精灵


    `rect` 坐标对应精灵表中第一行的最后一张图像。


    ### 3.5 精灵帧动画


    如前所述，`cc.SpriteFrame` 负责在 `cc.Sprite` 中显示当前图像。这个精灵帧可以在任意时刻更改，这使我们能够创建基于帧的动画。让我们看一个示例。我将在此示例中使用同一张精灵表。


    在 `src` 目录下，创建一个名为 `spriteanimation.js` 的文件，并将以下代码复制进去：


    ```

    1   var SpriteAnimationLayer = cc.Layer.extend({

    2       sprite:null,

    3       ctor:function () {

    4           //////////////////////////////

    5          // 1\. super init first

    6          this._super();

    8          var size = cc.winSize;

    9          //FrameData

    10          var walk01 = cc.rect(0,0,72,97);

    11          var walk02 = cc.rect(73,0,72,97);

    12          var walk03 = cc.rect(146,0,72,97);

    13          var walk04 = cc.rect(0,98,72,97);

    14          var walk05 = cc.rect(73,98,72,97);

    15          var walk06 = cc.rect(146,98,72,97);

    16          var walk07 = cc.rect(219,0,72,97);

    17          var walk08 = cc.rect(292,0,72,97);

    18          var walk09 = cc.rect(219,98,72,97);

    19          var walk10 = cc.rect(365,0,72,97);

    20          var walk11 = cc.rect(292,98,72,97);

    22          var frameDatas=[walk01,walk02,walk03,walk04,walk05,

    23          walk06,walk07,walk08,walk09,walk10,walk11];

    24          var texture = cc.textureCache.addImage(res.Sprite_Sheet);

    26          //Create SpriteFrame and AnimationFrame with Frame Data

    27          var animFrames=[];

    28          for(var index in frameDatas)

    29          {

    30               var spriteFrame = new cc.SpriteFrame(texture, frameDatas[index]);

    31               var animFrame = new cc.AnimationFrame();

    32               animFrame.initWithSpriteFrame(spriteFrame, 1, null);

    33               animFrames.push(animFrame);

    34          }

    36          //Create an empty sprite

    37          this.sprite = new cc.Sprite();

    38          this.sprite.attr({

    39               x: size.width / 2,

    40               y: size.height / 2

    41          });

    43          this.addChild(this.sprite, 0);

    45          var animation = cc.Animation.create(animFrames, 0.08);

    46          var animate = cc.Animate.create(animation);

    48          //Animate the sprite frame on the empty sprite

    49          this.sprite.runAction(animate.repeatForever());

    51          return true;

    52       }

    53   });

    ```


    帧动画背后的思路是，我们将在特定的时间间隔内逐帧播放，使其看起来像一个动画序列。在上述代码中，`walk01` 到 `walk11` 表示精灵表中的各帧，使用
    `rects` 定义。如果我们将这些帧组合并依次播放，就会看起来像一个行走动画。


    `SpriteFrame` 实例使用该帧 `rect` 数组创建（参见图 3-6）：


    ![A435521_1_En_3_Fig6_HTML.jpg](img/A435521_1_En_3_Fig6_HTML.jpg)


    图 3-6. `SpriteFrame`


    ```

    1   var texture = cc.textureCache.addImage(res.Sprite_Sheet);

    2   var animFrames=[];

    3   for(var index in frameDatas)

    4   {

    5       var spriteFrame = new cc.SpriteFrame(texture, frameDatas[index]);

    6       var animFrame = new cc.AnimationFrame();

    7       animFrame.initWithSpriteFrame(spriteFrame, 1, null);

    8       animFrames.push(animFrame);

    9   }

    ```


    在这个示例中，我们手动创建 `cc.SpriteFrame` 实例，因此需要一个精灵表的 `texture` 实例。于是我们将精灵表添加到纹理缓存中，该操作会返回
    `texture` 实例，可用于创建所有精灵帧。


    最后，用于执行动画的 `cc.Animation` 实例通过 `cc.AnimationFrame` 的图像列表创建，时间间隔设置为 0.08 秒。


    输出结果将是一个流畅的行走动画。


    在上述案例中，为了完整理解帧动画，我们手动创建了帧数据，但在实际开发中，精灵表往往是通过像 TexturePack 这样的工具从单个图像生成，同时还会创建关联的数据文件。在
    Cocos2d 中，这是一个包含与精灵表相关的所有帧数据的 PList 文件。在下一个示例中，我们将看到如何使用 PList 创建帧动画。

    '
- fmt: '### 3.6 Sprite Frame Animation with PList Data


    We have created the same sprite sheet from an individual image using `TexturePack`,
    and we generated the `PList` file. See Figure [3-7](#A435521_1_En_3_Chapter.html#Fig7).


    ![A435521_1_En_3_Fig7_HTML.jpg](A435521_1_En_3_Fig7_HTML.jpg)


    Figure 3-7. `TexturePack`-generated sprite sheet


    While generating `PList`, make sure that you have selected the data format as
    `Cocos2d`. Figure [3-8](#A435521_1_En_3_Chapter.html#Fig8) shows the generated
    texture.


    ![A435521_1_En_3_Fig8_HTML.jpg](A435521_1_En_3_Fig8_HTML.jpg)


    Figure 3-8. Sprite sheet from `TexturePack`


    You can examine the `PList` data file in the `res` folder of the sample project
    available at [`https://github.com/nutcrackify/Rapid_-Game_Development_Using_Cocos2d-js`](https://github.com/nutcrackify/Rapid_-Game_Development_Using_Cocos2d-js).


    In `src`, create a file called `plistanimation.js` and copy the following code
    to it:


    ```

    1   var PListAnimationLayer = cc.Layer.extend({

    2       sprite:null,

    3       ctor:function () {


    5           this._super();


    7           var size = cc.winSize;


    9           cc.spriteFrameCache.addSpriteFrames(res.Sprite_Sheet1_P, res.Sprite_Shee\

    10           t1);

    11           //Create SpriteFrame and AnimationFrame with Frame Data

    12           var animFrames=[];

    13           for(var i=1;i<12;i++)

    14           {

    15                var str = "p1_walk" + (i < 10 ? ("0" + i) : i) + ".png";

    16                var spriteFrame=cc.spriteFrameCache.getSpriteFrame(str);

    17                animFrames.push(spriteFrame);

    18           }


    20           //Create an empty sprite

    21           this.sprite = new cc.Sprite();

    22           this.sprite.attr({

    23                x: size.width / 2,

    24                y: size.height / 2

    25           });


    27           this.addChild(this.sprite, 0);


    29           var animation = new cc.Animation(animFrames, 0.08);

    30           this.sprite.runAction(cc.animate(animation).repeatForever());


    32           return true;

    33       }

    34   });

    ```


    In `resource.js`, include the `PList` and sprite sheet file with variables `Sprite_Sheet1_P`
    and `Sprite_Sheet1`; both have been added to the frame cache, as follows:


    ```

    1   cc.spriteFrameCache.addSpriteFrames(res.Sprite_Sheet1_P, res.Sprite_Sheet1);

    ```


    Based on the `PList` data and sprite sheet, a sprite frame can be created using
    the `getSpriteFrame` function, as follows:


    ```

    1   var animFrames=[];

    2   for(var i=1;i<12;i++)

    3   {

    4       var str = "p1_walk" + (i < 10 ? ("0" + i) : i) + ".png";

    5       var spriteFrame=cc.spriteFrameCache.getSpriteFrame(str);

    6       animFrames.push(spriteFrame);

    7   }

    ```


    Now we have list of sprite frames that can be animated using the `cc.Animation`
    class:


    ```

    1   var animation = new cc.Animation(animFrames, 0.08);

    2   this.sprite.runAction(cc.animate(animation).repeatForever());

    ```


    This is the same walk animation that we did using the raw frame data without `PList`.


    ### 3.7 TextureCache with Sprites


    Texture caches are an essential part of the sprite construct and are used to cache
    texture data in memory so that when the same texture is referred to again, it
    will be loaded from the cache. This improves the overall performance and in-memory
    optimization for your game. See Figure [3-9](#A435521_1_En_3_Chapter.html#Fig9).


    ![A435521_1_En_3_Fig9_HTML.jpg](A435521_1_En_3_Fig9_HTML.jpg)


    Figure 3-9. Texture cache sprite


    Whenever you create a sprite with an image file, internally the image file gets
    loaded to `TextureCache`, and a `Texture2D` instance will be created with the
    data from `TextureCache`. In the previous code examples, you saw how we loaded
    the sprite sheets into the texture cache and used that to create a `SpriteFrame`
    instance. See Figure [3-10](#A435521_1_En_3_Chapter.html#Fig10).


    ![A435521_1_En_3_Fig10_HTML.jpg](A435521_1_En_3_Fig10_HTML.jpg)


    Figure 3-10. Sprite with `PNG`


    The preceding figure represents the sprite with a single `png` file. Once the
    texture is returned from the resource loader it is cached into the texture cache,
    and the `Texture2D` instance is created from the cache data and used by `cc.Sprite`.
    This is the internal implementation of `cc.Sprite`.


    ### 3.8 SpriteFrameCache with Sprites


    Similar to `TextureCache`, `SpriteFrameCache` is used to cache the `SpriteFrame`
    that is used by `cc.Sprite`. If you have a sprite sheet, individual `SpriteFrames`
    can be cached in `SpriteFrameCache` and used later whenever needed. This has been
    illustrated in the previous code samples and Figure [3-11](#A435521_1_En_3_Chapter.html#Fig11).


    ![A435521_1_En_3_Fig11_HTML.jpg](A435521_1_En_3_Fig11_HTML.jpg)


    Figure 3-11. `SpriteFrameCache` sharing `SpriteFrame`


    ### 3.9 Sprite Batching


    Sprite batching is a technique that combines multiple sprite renderings using
    a single draw call, provided that the sprites involved use the same texture or
    texture sheet.'
