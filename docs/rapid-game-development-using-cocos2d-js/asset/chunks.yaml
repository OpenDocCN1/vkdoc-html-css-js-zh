    \    if (cc.rectContainsPoint(rect, locationInNode)) {\n                    cc.log('触摸开始：在精灵内部');\n\
    \                    //返回 true 以启动 OnTouchMove\n                    return true;\n\
    \                }\n                cc.log('触摸开始：在精灵外部');\n                return\
