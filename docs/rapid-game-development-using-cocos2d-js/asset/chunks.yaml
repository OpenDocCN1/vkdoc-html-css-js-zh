    ```

    1   var gearJoint = new cp.GearJoint(bodyB, bodyC, 0, 2);

    2   this.space.addConstraint(gearJoint);

    ```


    最后两个参数是：


    *   `offset` - 两个物体的初始角度偏移量

    *   `ratio` - 需要维持的速度比率；在此例中，`bodyC` 的角速度是 `bodyB` 的一半。


