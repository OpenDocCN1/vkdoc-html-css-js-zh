    \ Cocos2d-js 中，用户输入（例如通过触摸、鼠标或键盘）以事件的形式提供。事件机制涉及三个主要部分（见图 4-1）。\n\n![A435521_1_En_4_Fig1_HTML.jpg](img/A435521_1_En_4_Fig1_HTML.jpg)\n\
    \n图 4-1. Cocos2d-JS 中的事件机制\n\n### 4.1.1 事件触发器\n\n事件触发器是任何事件的源头。当发生触摸或任何其他输入时，Cocos2d-js\
    \ 系统将触发一个事件作为响应。\n\n### 4.1.2 事件管理器\n\n当任何事件被触发时，事件管理器会收到通知。`EventManager` 是一个单例实例，是\
