    # 4. Handling Inputs and Events


    ## 4.1 Introduction


    Handling user input is an essential part of any game. In Cocos2d-js, user input,
    such as by touch, mouse, or keyboard, is available in the form of events. There
    are three major parts involved in the event mechanism (see Figure [4-1](#A435521_1_En_4_Chapter.html#Fig1)):.


    ![A435521_1_En_4_Fig1_HTML.jpg](A435521_1_En_4_Fig1_HTML.jpg)


    Figure 4-1.


    Event mechanism in Cocos2d-JS


    ### 4.1.1 Event Trigger


    An event trigger is the source of any event. When a touch or any other input happens,
    the Cocos2d-js system will trigger an event in response.


    ### 4.1.2 Event Manager


    When any event is triggered, event manager will get notified, `EventManager` is
    a singleton instance that is part of the Cocos2d-js system; it manages all the
    events.


    ### 4.1.3 Event Listeners


    This is where the actual event-handling logic goes. Event manager will dispatch
    the events to all the event listeners and they will be handled by event listener
    instances.


    ## 4.2 Touch Events


    There are two kind of touch events available: single touch (`cc.EventListener.TOUCH_-ONE_BY_ONE`)
    and multi-touch (`cc.EventListener.TOUCH_ALL_AT_ONCE`)


    ### 4.2.1 Single Touch


    In the `src` folder, create a file called `touchevents.js` and copy the following
    code there:


    ```

    1   var TouchEventsLayer = cc.Layer.extend({

    2       sprite:null,

    3       ctor:function () {

    4           this._super();


    6           var size = cc.winSize;


    8           this.sprite = new cc.Sprite(res.Sprite_Image);

    9           this.sprite.attr({

    10               x:size.width / 2,

    11               y:size.height / 2

    12           });

    13           this.addChild(this.sprite, 0);

    14           this.sprite.tag=''TouchTarget'';


    16           //Creating Event Listener Object

    17           var listener = cc.EventListener.create({

    18               event: cc.EventListener.TOUCH_ONE_BY_ONE,

    19             swallowTouches: true,


    21               onTouchBegan: function (touch, event) {

    22                   var target = event.getCurrentTarget();

    23                   var locationInNode = target.convertToNodeSpace(touch.getLocation\

    24   ());

    25                   var s = target.getContentSize();

    26                   var rect = cc.rect(0, 0, s.width, s.height);


    28                         //Check the click area

    29                   if (cc.rectContainsPoint(rect, locationInNode)) {

    30                       cc.log(''Touch began: Inside the sprite'');

    31                       //True has been returned to initiate the OnTouchMove

    32                       return true;

    33                   }

    34                   cc.log(''Touch began: Outside the sprite'');

    35                   return false;

    36               },

    37               onTouchMoved: function (touch, event) {

    38                   var target = event.getCurrentTarget();

    39                   target.setPosition(touch.getLocation());

    40               },

    41               onTouchEnded: function (touch, event) {

    42                  cc.log(''Touch end'');

    43               }

    44           });


    46           //Added Event Listener To Sprite

    47           cc.eventManager.addListener(listener, this.sprite);

    48           return true;

    49       }

    50   });

    ```


    In this example, the sprite can be dragged using single touch. The event listener
    is created using the event name `cc.EventListener.TOUCH_ONE_BY_ONE`, with `swallowTouches`
    set to `true`. When multiple event listeners are attached to the same target for
    the same event name, the first listener with `swallowTouches: true` will swallow
    the event, and it will not be passed on to the next listener.


    ```

    1   cc.eventManager.addListener(listener, this.sprite);

    ```


    In this case, even though a sprite is the target, a touch event will happen for
    every tap on the screen. To confirm that a touch has happened inside the sprite,
    the following code has been written:


    ```

    1   var target = event.getCurrentTarget();

    2   var locationInNode = target.convertToNodeSpace(touch.getLocation());

    3   var s = target.getContentSize();

    4   var rect = cc.rect(0, 0, s.width, s.height);


    6   //Check the click area

    7   if (cc.rectContainsPoint(rect, locationInNode)) {

    8     cc.log(''Touch began: Inside the sprite'');

    9     //True has been returned to initiate the OnTouchMove

    10    return true;

    11   }

    ```


    In `onTouchBegan`, a condition has been checked as to whether a touch has happened
    within the sprite or not. If the touch is within the sprite, then `true` will
    be returned so that the touch move’s gestures will be directed to the `onTouchMoved`
    function; the target position is changed as per the touch move.'
