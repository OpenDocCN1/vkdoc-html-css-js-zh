    # 6. Fun with Animation


    ## 6.1 Introduction


    Animation is essential to any good game, as it makes your game cool and visually
    appealing, and helps you to acquire more users. A visually appealing game markets
    itself. Take a moment to look at the top-grossing games in Google Play and App
    Store. Top games use crisp and detail-rich animations to improve the user experience
    and to engage users. Take a deep breath, as we are going to look at the details
    of the animation system in Cocos2d-js. Let’s begin.


    ## 6.2 Actions


    Actions are the construct that is used in Cocos2d-js to animate a sprite. Actions
    change the properties of the sprite over time, and that makes the sprite animate
    in the way we want. There are several types of actions available with which to
    apply animations on sprites for all the realtime scenarios. Let’s have a look
    at a simple example:


    ```

    1   var action = cc.moveBy(2, cc.p(size.width - 40, size.height - 40));

    2   this.sprite.runAction(action);

    ```


    In this example, the `action` object is created using the `cc.moveBy` function.
    Any action can be run on sprites using the `runAction` method. This method actually
    belongs to `cc.Node`, so beyond sprites, we can animate any objects that have
    `cc.Node` as a parent or topmost parent (i.e., layers, scenes, etc.) Basically,
    there are two variations in creating actions.


    ### 6.2.1 By and To actions


    The preceding code is an example of the `By` variation. Let’s have a look at the
    same example with the `To` variation:


    ```

    1   var action = cc.moveTo(2, cc.p(size.width - 40, size.height - 40));

    2   this.sprite.runAction(action);

    ```


    The only difference between `By` and `To` actions is that `To` will animate the
    target property value to the absolute value, and `By` will animate the target
    property value to the relative value (Example: If you have a sprite at location
    (10,10) and you use the `moveBy` action to animate with value (5,5), after animation
    the final position of the sprite would be (15,15); in case of a `moveTo` action
    the final position would be (5,5)).


    ## 6.3 Available Actions List


    The following is the list of available actions that you can apply on any nodes.
    The listed combinations include `By` and `To` variations, which you can try with
    simple sprite images.


    ### 6.3.1 Move


    This action is used to animate the x,y position of any node instance:


    ```

    1   var action = cc.moveBy(2, cc.p(size.width - 40, size.height - 40));

    2   var action = cc.moveTo(2, cc.p(size.width - 40, size.height - 40));

    ```


    The first parameter is the duration and the second is the target point value.


    ### 6.3.2 Jump


    This action is used to animate the node’s x,y position in a parabolic way such
    that it looks like it is jumping:


    ```

    1   var action = new cc.JumpBy(2, cc.p(300, 0), 50, 4);

    2   var action = new cc.JumpBy(2, 300, 0, 50, 4);

    ```


    The first parameter is the duration, as it is for all actions. The second parameter
    is a point or number that represents the target value (either x or (x,y)). If
    it is a point, then the third parameter is considered as height; if it is a number,
    then the third parameter is considered as a y value. The next two parameters represent
    height and number of jumps. So in this case (x,y) and height represent the width
    and height of the parabola.'
