    ### 7.9.7 Rotary Limit Joint


    A rotary limit joint constrains the relative rotation of two bodies, provided
    min and max angular limits. If `bodyA` and `bodyB` are linked with a rotary limit
    joint with min and max angles, the relative rotation of the two bodies will be
    such that the rotation angle won’t go below the min angle and won’t exceed the
    max angle for both bodies.


    Like in previous examples, initialize the Chipmunk space and add a circle, then
    link it with the static body through a slide joint. Now, apply a rotary link between
    `bodyA` and `bodyB`:


    ```

    1   var rotaryLimitJoint = new cp.RotaryLimitJoint(bodyA, bodyB, -Math.PI/2, Mat\

    2   h.PI/2);

    3   this.space.addConstraint(rotaryLimitJoint);

