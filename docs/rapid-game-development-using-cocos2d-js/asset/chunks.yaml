- fmt: "### 7.9.5 Damped Spring\n\nIn damped spring, `bodyA` and `bodyB` will be connected\
    \ to the two ends of the spring, and we have to provide other parameters that\
    \ define the behavior of the spring.\n\nFirst, initialize the Chipmunk space.\
    \ Like in the previous example, we are going to add a circle and establish a slide\
    \ joint to the static body for better visualization. See here:\n\n```\n1   var\
    \ bodyA = this.addPhysicsCircle(cc.p(cc.winSize.width * 0.25, cc.winSize.height\
    \ * 0.3));\n2   var bodyB = this.addPhysicsBox(cc.p(cc.winSize.width * 0.75, cc.winSize.height\
    \ * 0.3));\n3   var bodyC = this.space.staticBody;\n4   \n5   var slideJoint =\
