- fmt: "# Getting Started\n\nElectronic supplementary material The online version\
    \ of this chapter (doi:[10.​1007/​978-1-4842-2553-0_​1](http://dx.doi.org/10.1007/978-1-4842-2553-0_1))\
    \ contains supplementary material, which is available to authorized users.\n\n\
    ## Introduction\n\nIn the early days, games were hard to make, but in recent years\
    \ lots of 2D and 3D frameworks and tools have evolved that simplify game development\
    \ and enable developers to produce high-quality games quickly. `Cocos` is a game\
    \ engine that is widely used for making 2D games. Over the years, `Cocos` has\
    \ established a solid foundation among developers. Many popular games in the market\
    \ are made using `Cocos`. In 2010, `Cocos2d-x`, which is the C++ port of `Cocos2D`,\
    \ was introduced. This enabled developers to make cross-platform 2D games. After\
    \ that, `Cocos2d-js`, which is the JavaScript port of `Cocos2d`, was introduced,\
    \ enabling developers to produce browser-based games as well as cross-platform\
    \ native games that use `JSB`.\n\n`Cocos2D` is the proven standard for making\
    \ 2D games because of its simplicity and rich sets of features. In the coming\
    \ sections, we are going to take a deep look at the `Cocos2d-js` framework and\
    \ its features. By the end of this book, you will have a solid understanding of\
    \ the `Cocos2D-js` framework, best practices, and the rich set of features that\
    \ will enable you to develop your awesome game quickly.\n\nLet’s begin!\n\n##\
    \ Environment Setup\n\n### Python Installation\n\nMost of the time, you will be\
    \ dealing with the `Cocos` console to create, run, compile, and deploy your project.\
    \ The console uses Python. So, the first thing you need to do is to install Python.\
    \ You can download it from the official Python site at [`https://www.python.org/downloads/`](https://www.python.org/downloads/).\n\
    \nIf you are developing on MacOS X, it comes with Python installed by default.\n\
    \n### Cocos Console Setup\n\nFor `Cocos2d-js`, the development environment is\
    \ actually a part of the `Cocos` console, so you have to download the `Cocos2d-x`\
    \ bundle, or you may also go for the HTML5 Lite version if you wish to develop\
    \ only for the Web.\n\n#### Steps\n\n*   Download the `cocos2d-x` bundle from\
    \ [`https://cocos2d-x.org/download`](https://cocos2d-x.org/download).\n*   Extract\
    \ the zip file to your local drive.\n*   Open the terminal on Mac or the command\
    \ prompt on Windows and navigate to the extracted folder.\n*   Run the following\
    \ command:\n\n```\npython setup.py\n```\n\nThis will set up the `Cocos` console,\
    \ which uses both Android and iOS environment settings, and update the environment\
    \ variables.\n\n## Creating Your First App\n\nCreate a separate folder of your\
    \ choice in your favorite location. It is good practice to keep all of your `Cocos2d-js`\
    \ projects within one root folder.\n\nOpen the terminal and navigate to the created\
    \ folder path, then execute the following commands:\n\n*   `Cocos2d-js` project:\n\
    \n```\ncocos new sampleproject -l js\n```\n\n*   `Cocos2d-js` project with web\
    \ engine only:\n\n```\ncocos new sampleproject -l js --no-native\n```\n\n*   `Cocos2d-js`\
    \ project in specific directory:\n\n```\ncocos new sampleproject -l js -d ./Projects\n\
    ```\n\n`sampleproject` is the name of your project and `-l js` specifies the JavaScript\
    \ language. This creates the “Hello World” sample, which you can use as the base\
    \ for your game. For our purposes, we will modify this app to make our own “Hello\
    \ World” screen. Before that, however, you should understand the folder structure\
    \ that `Cocos2d-js` follows.\n\n### Folder Structure\n\nWhen you create a new\
    \ project, the `Cocos` console will create a folder structure like the one seen\
    \ in Figure 1-1.\n\n*   `src` - folder where you have all the JavaScript files\
    \ for your game\n*   `res` - folder where you have all the images and other resources\
    \ that are referenced in your game\n*   `frameworks` - folder where you have the\
    \ actual `Cocos2d-js` engine, support files for native deployment, `JSB`, and\
    \ so on. Apart from this, there are the configuration files `project.json`, which\
    \ serves as the main meta configuration for the runtime for your game, and `manifest.webapp`,\
    \ which has configuration information related to the Web.\n\n![A435521_1_En_1_Fig1_HTML.jpg](A435521_1_En_1_Fig1_HTML.jpg)\n\
    \nFigure 1-1. Project folder structure\n\n### Structure of `project.json`\n\n\
    This file has meta information about your `Cocos2d-js` project. Let’s have a look\
    \ into the json structure.\n\n*   `version` - your application version\n*   `name`\
    \ - name of your application\n*   `description` - the description of your application\n\
    *   `launch_path` - the startup HTML file for `Cocos2d-js`; used by the `Cocos`\
    \ console when deploying/debugging your application as a Web app\n*   `icons`\
    \ - application icons of various sizes; used by the `Cocos` console during native\
