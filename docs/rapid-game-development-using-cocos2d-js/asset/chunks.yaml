    \ 0);\n        this.sprite.tag='TouchTarget';\n\n        //创建事件监听器对象\n       \
    \ var listener = cc.EventListener.create({\n            event: cc.EventListener.TOUCH_ONE_BY_ONE,\n\
    \            swallowTouches: true,\n\n            onTouchBegan: function (touch,\
    \ event) {\n                var target = event.getCurrentTarget();\n         \
