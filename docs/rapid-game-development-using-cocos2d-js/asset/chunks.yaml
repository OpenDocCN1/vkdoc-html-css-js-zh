- fmt: '### 6.3.3 Rotation


    This action is used to animate the rotation of the node by modifying the rotation
    attribute over time:


    ```

    1   var action = new cc.RotateBy(2, 360);

    2   var action = new cc.RotateTo(2, 360);

    ```


    The first parameter is duration and the second parameter is `angleX`, which rotates
    around the x axis. The third parameter, `angleY`, is optional and is used for
    y rotation in rare cases.


    ### 6.3.4 Scale


    This action is used to scale animate the node. It uses the `scale` function of
    the node to scale the node over the specified duration:


    ```

    1   var action = new cc.ScaleTo(2, 0.5, 2);

    2   var action = new cc.ScaleBy(2, 0.5, 2);

    ```


    The first parameter is duration and the second and third are sx, sy, which are
    `scaleX` and `scaleY` values.


    ### 6.3.5 Skew


    This action is similar to scale, but it uses `skewX` and `skewY` values to animate
    the skew:


    ```

    1   var action = new cc.SkewTo(2, 37.2, -37.2);

    2   var action = new cc.SkewBy(2, 37.2, -37.2);

    ```


    Parameters are the same as for scale.


    ### 6.3.6 Tint


    This action is used to animate the RGB channel of the node; only the `By` version
    is available for this action:


    ```

    1   var action = new cc.TintBy(2, -127, -255, -127);

    ```


    The first parameter is duration, and the next three parameters are `deltaR`, `deltaB`,
    and `deltaG` values.


    ### 6.3.7 Bezier


    This action is used to move the target through a Bezier curve:


    ```

    1   var bezier = [cc.p(0, windowSize.height / 2), cc.p(300, -windowSize.height
    / 2),\

    2   cc.p(300, 100)];

    3   var bezierForward = new cc.BezierBy(3, bezier);

    4   var bezierTo = new cc.BezierTo(3, bezier);

    ```


    The first parameter is duration and the second is an array that has a list of
    points that defines the Bezier curve.


    ### 6.3.8 Cardinal Spline


    This is similar to Bezier. The target will move through a cardinal spline curve.
    Usually, this action is used when you want to simulate the movement of a sprite
    over path data, which is a collection of consecutive points. See here:


    ```

    1   var action = cc.cardinalSplineTo(3, array, 0);

    2   var action = cc.cardinalSplineTo(3, array, 0);

    ```


    Parameters are the same as for Bezier; however, it has a third parameter that
    represents tension, or the weight between two points, and calculates the duration
    of movement from one point to another.


    ## 6.4 Easing


    By default, all actions that animate the properties of the node over time linearly
    are called linear interpolation. Such an animation looks straightforward. When
    you want to add organic effects to your animation, your animation needs an easing
    function. See Figure [6-1](#A435521_1_En_6_Chapter.html#Fig1).


    ![A435521_1_En_6_Fig1_HTML.jpg](A435521_1_En_6_Fig1_HTML.jpg)


    Figure 6-1. Linear and easing


    As you can see, the first image is linear, which all actions will use by default.
    The other three are different easing functions. In Cocos2d-js, there are over
    26 types of easing. For all easing functions, the usage is the same. Let’s see
    an example:


    ```

    1   var easing=cc.easeBackIn();

    2   //or

    3   var easing=new cc.EaseBackIn();

    4   action.easing(easing);

    ```


    So simple! In this example, I have used the `EaseBackIn` class to create the easing
    object, or you can use a singleton `cc.easeBackIn` object to run on your action.
    I prefer the first way. Let’s see the list of easing functions available in Cocos2d-js.
    Remember: usage is the same for all easing functions.


    *   `cc.EaseBackIn`

    *   `cc.EaseBackInOut`

    *   `cc.EaseBackOut`

    *   `cc.EaseBezierAction`

    *   `cc.EaseBounce`

    *   `cc.EaseBounceIn`

    *   `cc.EaseBounceInOut`

    *   `cc.EaseBounceOut`

    *   `cc.EaseCircleActionIn`

    *   `cc.EaseCircleActionInOut`

    *   `cc.EaseCircleActionOut`

    *   `cc.EaseCubicActionIn`

    *   `cc.EaseCubicActionInOut`

    *   `cc.EaseCubicActionOut`

    *   `cc.EaseElastic`

    *   `cc.EaseElasticIn`

    *   `cc.EaseElasticInOut`

    *   `cc.EaseElasticOut`

    *   `cc.EaseExponentialIn`

    *   `cc.EaseExponentialInOut`

    *   `cc.EaseExponentialOut`

    *   `cc.EaseQuadraticActionIn`

    *   `cc.EaseQuadraticActionInOut`

    *   `cc.EaseQuadraticActionOut`

    *   `cc.EaseQuarticActionIn`

    *   `cc.EaseQuarticActionInOut`

    *   `cc.EaseQuarticActionOut`

    *   `cc.EaseQuinticActionIn`

    *   `cc.EaseQuinticActionInOut`

    *   `cc.EaseQuinticActionOut`

    *   `cc.EaseRateAction`

    *   `cc.EaseIn`

    *   `cc.EaseInOut`

    *   `cc.EaseOut`

    *   `cc.EaseSineIn`

    *   `cc.EaseSineInOut`

    *   `cc.EaseSineOut`


    This list will satisfy all your easing needs. All the easing is derived from `cc.ActionEase`,
    which is the base class.


    ## 6.5 Sequence


    Say, for example, I have two or more actions that need to be performed on a node
    one after the other. `Sequence` will help us to do that. Let’s see an example:


    ```

    1   var seq = new cc.Sequence([action1,action2]);

    2   this.sprite.runAction(seq);

    ```


    `cc.Sequence` accepts two parameter types: one is an array of actions, and the
    other one will be discussed later in this section. It can be run using the `runAction`
    function of the node, just like any other action.


    ### 6.5.1 Reversing Sequence


    Once a `sequence` object is created, it can be reversed and run on any node, as
    follows:


    ```

    1   this.sprite.runAction(seq.reverse());

    ```


    The `reverse` function will reverse the actions in `sequence` and will return
    a new instance of `sequence`.


    ### 6.5.2 Repeating Sequence


    Once a `sequence` object is created, we can repeat the action a finite number
    of times, or we can repeat it infinitely. See here:


    ```

    1   //Repeat sequence 5 times

    2   this.sprite.runAction(seq.repeat(5));


    4   //Repeat sequence forever

    5   this.sprite.runAction(seq.repeatForever());

    ```


    The `repeat` and `repeatForever` functions of `sequence` are used for this purpose.


    ### 6.5.3 Action End Callback


    It is possible in a `sequence` object to attach an `end callback` function for
    each action. Let’s see an example:


    ```

    1   var seq=new cc.Sequence(action1,cc.callFunc(function(){/*action1 end callback*/}\

    2   ,this),

    3   action2,cc.callFunc(function(){/*action2 end callback*/}\

    4   ,this));

    ```


    As discussed earlier, `Sequence` accepts two parameter types. One is an array
    of actions, and the other is a series of actions and their action end callback,
    like just seen.


    ## 6.6 Spawn


    There are certain scenarios where you want to execute two or more actions simultaneously
    on a node. `cc.Spawn` is used for this purpose:


    ```

    1   var spaw=new cc.Spawn([action1,action2]);

    2   this.sprite.runAction(spaw);

    ```


    As you can see, the syntax is similar to `Sequence`. It accepts an array of actions
    to be executed simultaneously. Be cautious when you execute multiple actions at
    the same time, as it may produce a weird effect if not used properly.


    ## 6.7 Stopping an Action


    Every action can be stopped while it is running. The `stopAction` function of
    the node object is used for this purpose:


    ```

    1   sprite.stopAction(action);

    ```


    This stops the action immediately regardless of its state. You can use this for
    user actions or any dynamic triggers that require actions to be stopped immediately.


    ## 6.8 Sprite Frame Animation


    In Chapter [3](#A435521_1_En_3_Chapter.html), we saw how sprite frame animation
    can be done using sprite sheets. That chapter was more focused on sprites, while
    this section will provide a detailed explanation of it from the animation side.
    Each and every image part in a sprite can be classified using `SpriteFrame` with
    `rect` coordinates. The `cc.Animation` class can be used to perform a sprite frame
    animation sequence on a sprite. Let’s see an example:


    ```

    1   var animation = new cc.Animation(spriteFrames, 0.08);

    2   this.sprite.runAction(cc.animate(animation).repeatForever()); //or new cc.Animat\

    3   ion(..) patten can be used.

    ```


    The first parameter is an array of `cc.SpriteFrame` instances, and the second
    is the delay. Like the `Action` class, this also has `repeat` and `repeatForever`
    functions.'
