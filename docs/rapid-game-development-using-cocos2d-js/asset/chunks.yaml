    # 6. 动画乐趣


    ## 6.1 简介


    动画对于任何优秀的游戏都至关重要，它能让你的游戏看起来很酷且具有视觉吸引力，并有助于你获取更多用户。一款具有视觉吸引力的游戏本身就是一种营销。花点时间看看
    Google Play 和 App Store 中收入最高的游戏。顶级游戏使用清晰且细节丰富的动画来改善用户体验并吸引用户。深呼吸，我们将要探讨 Cocos2d-js
    中动画系统的细节。让我们开始吧。


    ## 6.2 动作


    动作是 Cocos2d-js 中用于动画化精灵的构造。动作随时间改变精灵的属性，从而使精灵按照我们想要的方式运动。有几种可用的动作类型，用于在精灵上为所有实时场景应用动画。让我们看一个简单的例子：


    ```

    1   var action = cc.moveBy(2, cc.p(size.width - 40, size.height - 40));

    2   this.sprite.runAction(action);

    ```


    在这个例子中，`action` 对象是使用 `cc.moveBy` 函数创建的。任何动作都可以使用 `runAction` 方法在精灵上运行。这个方法实际上属于
    `cc.Node`，因此除了精灵之外，我们还可以动画化任何以 `cc.Node` 为父节点或最终父节点（即层、场景等）的对象。基本上，创建动作有两种变体。


    ### 6.2.1 By 和 To 动作


    前面的代码是 `By` 变体的一个例子。让我们看一下同一个例子的 `To` 变体：


    ```

    1   var action = cc.moveTo(2, cc.p(size.width - 40, size.height - 40));

    2   this.sprite.runAction(action);

    ```


    `By` 和 `To` 动作之间的唯一区别是：`To` 会将目标属性值动画化为绝对值，而 `By` 会将目标属性值动画化为相对值（例如：如果你有一个精灵位于
    (10,10) 位置，并且你使用 `moveBy` 动作以 (5,5) 的值对其进行动画化，动画结束后精灵的最终位置将是 (15,15)；如果是 `moveTo`
    动作，最终位置将是 (5,5)）。


    ## 6.3 可用动作列表


    以下是你可以应用于任何节点的可用动作列表。列出的组合包括 `By` 和 `To` 变体，你可以使用简单的精灵图片进行尝试。


    ### 6.3.1 移动


    此动作用于动画化任何节点实例的 x,y 位置：


    ```

    1   var action = cc.moveBy(2, cc.p(size.width - 40, size.height - 40));

    2   var action = cc.moveTo(2, cc.p(size.width - 40, size.height - 40));

    ```


    第一个参数是持续时间，第二个参数是目标点坐标。


    ### 6.3.2 跳跃


    此动作用于以抛物线的方式动画化节点的 x,y 位置，使其看起来像是在跳跃：


    ```

    1   var action = new cc.JumpBy(2, cc.p(300, 0), 50, 4);

    2   var action = new cc.JumpBy(2, 300, 0, 50, 4);

    ```


    与所有动作一样，第一个参数是持续时间。第二个参数是一个点或数字，表示目标值（可以是 x 或 (x,y)）。如果它是一个点，那么第三个参数被视为高度；如果它是一个数字，那么第三个参数被视为
    y 值。接下来的两个参数分别表示高度和跳跃次数。因此在这种情况下，(x,y) 和高度分别代表抛物线的宽度和高度。

