    ### 7.9.10 Ratchet Joint


    The ratchet joint works like a socket wrench, where you have the body rotating
    in angular steps provided the initial angular offset, and phase is an angular
    step, which is the distance between the current and the next rotation steps.


    Let’s have look at the syntax:


    ```

    1   var ratchet = new cp.RatchetJoint(body1, body2, offset, phase);

    ```


    The parameters are as follows:


    *   `offset` - refers to the initial angular rotation of bodies

    *   `phase` - refers to the distance between steps


    # 8. Miscellaneous Features


    ## 8.1 Drawing Primitive Shapes


    To draw primitive shapes, `cc.drawNode` is used. This node type has functions
    like `drawCircle`, `drawPoly`, `drawRect`, `drawSegment`, etc. Let’s look at an
    example:


    ```

    1   this.draw=new cc.DrawNode();

    2   this.addChild(this.draw);


    4   //drawCircle

    5   this.draw.drawCircle(cc.p(cc.winSize.width / 2, cc.winSize.height / 2), 100,
    0, 10, false, 6, cc.color(0, 255, 0, 255));

    6   this.draw.drawCircle(cc.p(cc.winSize.width / 2, cc.winSize.height / 2), 50,
    cc.degreesToRadians(90), 50, true, 2, cc.color(0, 255, 255, 255));

    ```


    Here, two circles are drawn on the same `DrawNode`. You can draw any number of
    shapes on the same draw node. If you want to clear the shapes, you have use the
    `clear` function:


    ```

    1   this.draw.clear();

    ```


    Drawing a path is also possible using the `drawCardinalSpline` method:


    ```

    1   this.draw.drawCardinalSpline(poinsArray,1,1,10,cc.color(255,255,255));

    ```


    The first parameter is an array of points that define the path data. The second,
    third, and fourth parameters are `tension`, segment and line width, and line color,
    respectively.


    Here is the full code:


    ```

    1   var DrawNodeDemoLayer = BaseSampleLayer.extend({

    2      sprite:null,

    3      ctor:function () {


    5          this._super();


    7          var size = cc.winSize;


    9          this.draw=new cc.DrawNode();

    10          this.addChild(this.draw);


    12          //drawCircle

    13          this.draw.drawCircle(cc.p(size.width / 2, size.height / 2), 100, 0,
    10, false, 6, cc.color(0, 255, 0, 255));

    14          this.draw.drawCircle(cc.p(size.width / 2, size.height / 2), 50, cc.degreesToRadians(90),
    50, true, 2, cc.color(0, 255, 255, 255));


    16         return true;

    17       }

    18   });

    ```


    The output will look like Figure [8-1](#A435521_1_En_8_Chapter.html#Fig1).


