    # 8.6 Schedule an Interval Callback


    In Chapter [6](#A435521_1_En_6_Chapter.html), "Fun with Animation," we read about
    scheduler and updates, where every `cc.Node` can subscribe to the update notification,
    which is the run loop. Similarly, we can create a function to be called at a given
    interval of time. There is a function called `schedule` in `cc.Node` that does
    the job for us:


    ```

    1   this.schedule(,);

    ```


    Let’s have a look at an example. First, create an empty layer and add a label
    to it:


    ```

    1   var size = cc.winSize;

    3   this.Label = new cc.LabelTTF('''','''', 32);

    4   this.Label.attr({

    5      x: size.width / 2,

    6      y: size.height / 2

    7   });

    9   this.addChild(this.Label);

    ```


    Then, have a callback in the `layer` object and update the `Label` with text:


    ```

    1   onUpdate:function(){

    2     this.Label.setString((this.timer++)+'' sec'');

    3   }

    ```


    Then, have a variable `timer` initialized in ctor and use the `schedule` function
    to begin the callback with an interval of 1 second:


    ```

    1   this.timer=0;

    2   this.schedule(this.onUpdate,1);

    ```


    Now the whole code should look like the following:


    ```

    1   var SchedulerLayer = BaseSampleLayer.extend({

    2       sprite:null,

    3       ctor:function () {

    4           this._super();

    6           var size = cc.winSize;

    8           this.Label = new cc.LabelTTF('''','''', 32);

    9           this.Label.attr({

    10               x: size.width / 2,

    11               y: size.height / 2

    12           });

    14           this.addChild(this.Label);

    16           this.timer=0;

    17           this.schedule(this.onUpdate,1);

    19           return true;

    20       },

