    Through the constraint, we establish physical relations between two bodies in
    the space. We will be using this for all the listed constraints. We assume you
    will create a separate layer for each joint example; however, we included the
    full source with the layer at the end of every joint example. Let’s have a look
    at joints.


    ### 7.9.1 Pin Joint


    A pin joint is nothing but connecting two physics bodies with their respective
    anchor points. For instance, consider two physical bodies, `bodyA`, `bodyB`, and
    `anchorA`, `anchorB` are the corresponding anchor points for those bodies; they
    are given in body space coordinates. The distance between these anchor points
    is determined when the joint is created and will remain the same throughout the
    space simulation. For a realworld example, consider a wheel driven by a piston;
    wheel and piston are connected by a rod, which drives the wheel. The length of
    the rod remains same.


    Let’s have a look at an example. First, do the initial setup:


    ```

    1   this.initPhysics();

    2   this.setupDebugNode();

    3   this.addBottomWall();

    ```


