    # 7. Adding Physics to Your Game


    ## 7.1 Introduction


    In physics-based games, simulating the physics of the real world is very important.
    There are a variety of physics engines available today. The most popular one for
    Cocos2d-js is Chipmunk physics. This was originally written in C and later was
    ported to various platforms. Even though you can use other game engines with Cocos2d-js,
    the Chipmunk engine is highly recommended. It is the native physics engine for
    Cocos2d-x.


    ## 7.2 Chipmunk Overview


    Physics is all about altering sprites’ x,y position and rotation in the right
    manner such that it will look like a physics simulation. There is a clear separation
    between your game world and the physics space. See Figure [7-1](#A435521_1_En_7_Chapter.html#Fig1).


    ![A435521_1_En_7_Fig1_HTML.jpg](A435521_1_En_7_Fig1_HTML.jpg)


    Figure 7-1.


    Cocos2d-js and Chipmunk relation


    All the physics bodies and their behavior are defined in the Chipmunk space, and
    sprites from Cocos2d-js layers are mapped to those bodies. The physics simulation
    will happen within the Chipmunk space, based on relation mapping with the appropriate
    sprites. Chipmunk will update the x,y and rotation of those sprites based on the
    body in the physics space. Let’s see the basics in Figure [7-2](#A435521_1_En_7_Chapter.html#Fig2).


    ![A435521_1_En_7_Fig2_HTML.jpg](A435521_1_En_7_Fig2_HTML.jpg)


    Figure 7-2.


    Chipmunk overview


    Physics simulation happens inside the Chipmunk space, where the physics body gets
    physical properties set; those bodies will have shapes defined, which can be a
    box or circle or polygon. Every Chipmunk space will have a default `staticBody`
    as its child, and shapes added to it will not be affected by physical properties
    and will be static objects like walls or obstacles, etc. All the bodies will be
    associated with `PhysicsSprite`, which has your sprite image, and this sprite’s
    location and rotation will be determined by the physics body associated with it.
    In the upcoming example, we are going to create a Chipmunk space, add walls to
    the four boundaries, and add two bodies, a box and a circle, to the space. Then,
    we are going to watch the simulation.


    ## 7.3 Chipmunk Space


    The first thing you have to do is include the Chipmunk module in your `project.json`
    file:


    ```

    1   "modules" : ["cocos2d",....,"chipmunk"]

    ```


    Let’s see how this space can be created:


    ```

    1   initPhysics:function() {

    2         //initiate space

    3         this.space = new cp.Space();


    5         //setup the Gravity

    6         this.space.gravity = cp.v(0, -800); //Earth gravity

    7         this.space.iterations = 30;

    8         this.space.sleepTimeThreshold = Infinity;

    9         this.space.collisionSlop = Infinity;

    10   }

    ```


    This `initPhysics` function will be placed inside the `layer` object; that is,
    `initPhysics` will be one of the properties of `layer` object. The `cp.Space`
    class is used to create the space, and `gravity`, `iterations`, `sleepTimeThreshold`,
    and `collisionSlop` are set to the appropriate values.


    ```

    1   update:function (dt) {

    2          this.space.step(dt);

    3   },

    ```


    Physics simulation is driven by the `step` method, which is constantly triggered
    in the `update` cycle of `layer`.


    ## 7.4 Chipmunk Body


    A physical object is defined by a body; the body has a shape and the sprite’s
    data associated with it. Let’s add a circle and box to the created Chipmunk space:


    ```

    1   addPhysicsCircle: function() {

    2       var width=50,height=50,mass=1;


    4       this.phBodyCircle = this.space.addBody(new cp.Body(mass, cp.momentForCircle(\

    5   mass,0,width*0.5,cc.p(0,0))));

    6       this.phBodyCircle.setPos(cc.p(cc.winSize.width * 0.5, cc.winSize.height
    * 0.\

    7       3));


    9       //#4

    10       var phShape = this.space.addShape(new cp.CircleShape(this.phBodyCircle,
    widt\

    11   h, cc.p(0, 0)));

    12       phShape.setFriction(0);

    13       phShape.setElasticity(1);

    14       phShape.setCollisionType(0);

    15   },


    17   addPhysicsBox: function() {

    18       var width=50,height=50,mass=1;

    19       this.phBodyBox = this.space.addBody(new cp.Body(mass, cp.momentForBox(mass,
    \

    20       width,height)));

    21       this.phBodyBox.setPos(cc.p(cc.winSize.width * 0.5, cc.winSize.height
    * 0.1));


    23       //#4

    24       var phShape = this.space.addShape(new cp.BoxShape(this.phBodyBox, width,
    hei\

    25       ght));

    26       phShape.setFriction(0);

    27       phShape.setElasticity(1);

    28       phShape.setCollisionType(1);

    29   }

    ```


    As you can see, the circle and box bodies are created using `cp.Body` with `mass`
