    Figure 1-3.


    Hello World


    *   Delete all the files and folders in the current folder except the `frameworks/`
    folder (see Figure [1-3](#A435521_1_En_1_Chapter.html#Fig3)).


    ```

    1   git init

    ```


    *   Pull the repository:


    ```

    1   (if you use ssh)

    2   git remote add origin git@github.com:nutcrackify/Rapid_Game_Development_Using_Co\

    3   cos2d-js.git


    5   (if you use https)

    6   git remote add origin https://github.com/nutcrackify/Rapid_Game_Development_Usin\

    7   g_Cocos2d-js.git

    ```


    *   Run the example:


