    \            },\n            onTouchEnded: function (touch, event) {\n       \
    \         cc.log('触摸结束');\n            }\n        });\n\n        //将事件监听器添加到精灵\n\
    \        cc.eventManager.addListener(listener, this.sprite);\n        return true;\n\
    \    }\n});\n```\n\n在此示例中，精灵可以通过单点触摸进行拖动。事件监听器使用事件名称 `cc.EventListener.TOUCH_ONE_BY_ONE`\
    \ 创建，并将 `swallowTouches` 设置为 `true`。当多个事件监听器为同一事件名称附加到同一目标时，第一个 `swallowTouches:\
