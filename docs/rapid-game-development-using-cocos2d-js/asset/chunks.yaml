    ## 8.2 Adding Music and Sound Effects


    In Cocos2d-js, music and sound effects can be added to the game by using the singleton
    object `cc.audioEngine`. Music represents the long-running background sound in
    your game, and sound effects represent quick sounds like the player jumping, collecting
    coins, etc. You have to be careful with which sound format file you use, as certain
    browsers won’t support certain formats. The first thing you have to do during
    game startup is to pre-load your sound files during the `onStart` method of your
    `app.js`:


    ```

    1   cc.audioEngine.preloadMusic(s_music_background);

    2   cc.audioEngine.preloadEffect(s_music_jump);

    ```


    Then, you can play your music and sound effects as follows:


    ```

    1   cc.audioEngine.playMusic(s_music_background, true);

    2   cc.audioEngine.playEffect(s_music_jump, true);

    ```


    The second parameter represents whether to loop the sound or not.


    You can pause, resume, and stop your music and effects as follows:


    ```

    1   //Pause Sound

    2   cc.audioEngine.pauseMusic();

    3   cc.audioEngine.pauseEffect();


    5   //Resume Sound

    6   cc.audioEngine.resumeMusic();

    7   cc.audioEngine.resumeEffect();


    9   //Rewind Music

    10  cc.audioEngine.rewindMusic();


    12  //Stop Sound

    13  cc.audioEngine.stopMusic();

    14  cc.audioEngine.stopEffect();

    ```


    For effects, there is no option to rewind, as the constructs for playing music
    and effects are separate so as to make the system efficient.


    ## 8.3 Using Custom Shaders


    Shaders are responsible for rendering your whole game. Everything we do to run
    the game finally passes through these shaders and is processed for rendering.
    Shaders are classified into vertex and fragment shaders. Vertex shaders process
    the vertex data of your node and pass the output to fragment shaders, which process
    the pixel color for the interpolated vertex data. Cocos2d-x uses GL shaders to
    do the rendering. GL shaders are a much bigger concept, and discussing them in
    detail is out of scope of this book. Custom shaders are used to create cool effects
    in your game. We will see how to use custom vertex and fragment shaders on your
    sprite.


    In Cocos2d-js, the `cc.GLProgram` class represents the shader entity for a particular
    node. Every node has `setShaderProgram` and `getShaderProgram` functions to get/set
    this object.


    Let’s consider sample vertex and fragment shaders:


    ```

    1   //gray.vsh

    2   attribute vec4 a_position;

    3   attribute vec2 a_texCoord;

    4   attribute vec4 a_color;


    7   varying vec4 v_fragmentColor;

    8   varying vec2 v_texCoord;


    10   void main()

    11   {

    12       gl_Position = CC_MVPMatrix * a_position;

    13       v_fragmentColor = a_color;

    14       v_texCoord = a_texCoord;

    15   }


    17   //gray.fsh

    18   varying vec4 v_fragmentColor;

    19   varying vec2 v_texCoord;

    20   uniform sampler2D CC_Texture0;


    22   void main()

    23   {

    24          vec4 v_orColor = v_fragmentColor * texture2D(CC_Texture0, v_texCoord);

    25          float gray = dot(v_orColor.rgb, vec3(0.299, 0.587, 0.114));

    26          gl_FragColor = vec4(gray, gray, gray, v_orColor.a);

    27   }

    ```


    To use these shaders on your sprite, you would have to create a `GLProgram` instance
    and initiate it with these two shaders’ paths, and you would have to initiate
    the attributes for the vertex shader. See the following:


    ```

    1   var shader = new cc.GLProgram();

    2   shader.retain();

    3   shader.initWithFilenames("res/gray.vsh", "res/gray.fsh");

    4   shader.addAttribute(cc.ATTRIBUTE_NAME_POSITION, cc.VERTEX_ATTRIB_POSITION);

    5   shader.addAttribute(cc.ATTRIBUTE_NAME_COLOR, cc.VERTEX_ATTRIB_COLOR);

    6   shader.addAttribute(cc.ATTRIBUTE_NAME_TEX_COORD, cc.VERTEX_ATTRIB_TEX_COORDS);


    8   shader.link();

    9   shader.updateUniforms();

    10  this.sprite.setShaderProgram(shader);

