    As usual, do the steps to run this layer. Let’s see how the label has been used.
    At first, `cc.LayerColor` has been included as a child so as to set the background
    color:


    ```

    1   var colorLayer = new cc.LayerColor(cc.color(142,29,42));

    2   this.addChild(colorLayer);

    ```


    The first label is created using text `''Default font name''`, and `fontname`
    is specified as an empty string so that the label falls back to the default font
    in the system.


    The second label is created with a loaded font name; in this case, I have used
    `Abduction.ttf`, which is specified in `resource.js` as follows:


    ```

    1   var res = {

    2       .....

    3       Custom_TTF:"res/Abduction.ttf",

    4   .....

    5   };

