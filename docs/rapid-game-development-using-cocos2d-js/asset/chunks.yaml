- fmt: "### 6.9 Schedulers and Update\n\nIn Cocos2d-js, there is an update loop, which\
    \ is a main run loop; every `cc.Node` is capable of receiving update notifications,\
    \ but the node has to subscribe to it. This subscribe mechanism is implemented\
    \ with performance considerations in mind.\n\nIn the `cc.Node`, in the ctor, the\
    \ following method needs to be called:\n\n```\nthis.scheduleUpdate();\n```\n\n\
    Once this is done, you can define a method called `update`:\n\n```\nupdate:function(dt)\
    \ {\n\n}\n```\n\nLet’s perform an animation using `update`. First, create a layer\
    \ and demo scenes as mentioned in earlier examples, then add a sprite to the scene:\n\
    \n```\nthis.sprite = new cc.Sprite(res.Sprite_Image);\nthis.sprite.attr({\n  \
    \  x: size.width / 2,\n    y: size.height / 2\n});\nthis.addChild(this.sprite,\
    \ 0);\n```\n\nWe are going to animate the sprite from left to right in a ping-pong\
    \ fashion. For that we need to have a `seed` value:\n\n```\nthis.seed=10;\n```\n\
    \nLet’s define our `update` method and animate the sprite:\n\n```\nupdate:function(dt)\
    \ {\n  if(this.sprite.getPositionX()>cc.winSize.width){\n    this.seed=-10;\n\
    \  } else if(this.sprite.getPositionX()<0) {\n    this.seed=10;\n  }\n  this.sprite.setPositionX(this.sprite.getPositionX()+this.seed);\n\
    }\n```\n\nBy now the whole code should look like the following:\n\n```\nvar SchedulersLayer\
    \ = BaseSampleLayer.extend({\n    sprite:null,\n    ctor:function () {\n     \
    \   this._super();\n        var size = cc.winSize;\n        this.sprite = new\
    \ cc.Sprite(res.Sprite_Image);\n        this.sprite.attr({\n            x: size.width\
    \ / 2,\n            y: size.height / 2\n        });\n        this.seed=10;\n \
    \       this.addChild(this.sprite, 0);\n        this.scheduleUpdate();\n    },\n\
    \    update:function(dt) {\n      if(this.sprite.getPositionX()>cc.winSize.width){\n\
    \        this.seed=-10;\n      } else if(this.sprite.getPositionX()<0) {\n   \
    \     this.seed=10;\n      }\n      this.sprite.setPositionX(this.sprite.getPositionX()+this.seed);\n\
    \    }\n});\n```\n\nThe output should look like a sprite moving left to right\
    \ and vice versa in a repeated way. See Figure [6-2](#A435521_1_En_6_Chapter.html#Fig2).\n\
    \n![A435521_1_En_6_Fig2_HTML.jpg](A435521_1_En_6_Fig2_HTML.jpg)\n\nFigure 6-2.\
    \ Schedulers and update\n\n# 7. Adding Physics to Your Game\n\n## 7.1 Introduction\n\
    \nIn physics-based games, simulating the physics of the real world is very important.\
    \ There are a variety of physics engines available today. The most popular one\
    \ for Cocos2d-js is Chipmunk physics. This was originally written in C and later\
    \ was ported to various platforms. Even though you can use other game engines\
    \ with Cocos2d-js, the Chipmunk engine is highly recommended. It is the native\
    \ physics engine for Cocos2d-x.\n\n## 7.2 Chipmunk Overview\n\nPhysics is all\
    \ about altering sprites’ x,y position and rotation in the right manner such that\
    \ it will look like a physics simulation. There is a clear separation between\
    \ your game world and the physics space. See Figure [7-1](#A435521_1_En_7_Chapter.html#Fig1).\n\
    \n![A435521_1_En_7_Fig1_HTML.jpg](A435521_1_En_7_Fig1_HTML.jpg)\n\nFigure 7-1.\
    \ Cocos2d-js and Chipmunk relation\n\nAll the physics bodies and their behavior\
    \ are defined in the Chipmunk space, and sprites from Cocos2d-js layers are mapped\
    \ to those bodies. The physics simulation will happen within the Chipmunk space,\
    \ based on relation mapping with the appropriate sprites. Chipmunk will update\
    \ the x,y and rotation of those sprites based on the body in the physics space.\
    \ Let’s see the basics in Figure [7-2](#A435521_1_En_7_Chapter.html#Fig2).\n\n\
    ![A435521_1_En_7_Fig2_HTML.jpg](A435521_1_En_7_Fig2_HTML.jpg)\n\nFigure 7-2. Chipmunk\
    \ overview\n\nPhysics simulation happens inside the Chipmunk space, where the\
    \ physics body gets physical properties set; those bodies will have shapes defined,\
    \ which can be a box or circle or polygon. Every Chipmunk space will have a default\
    \ `staticBody` as its child, and shapes added to it will not be affected by physical\
    \ properties and will be static objects like walls or obstacles, etc. All the\
    \ bodies will be associated with `PhysicsSprite`, which has your sprite image,\
    \ and this sprite’s location and rotation will be determined by the physics body\
    \ associated with it. In the upcoming example, we are going to create a Chipmunk\
    \ space, add walls to the four boundaries, and add two bodies, a box and a circle,\
    \ to the space. Then, we are going to watch the simulation.\n\n## 7.3 Chipmunk\
    \ Space\n\nThe first thing you have to do is include the Chipmunk module in your\
    \ `project.json` file:\n\n```\n\"modules\" : [\"cocos2d\",....,\"chipmunk\"]\n\
    ```\n\nLet’s see how this space can be created:\n\n```\ninitPhysics:function()\
    \ {\n    //initiate space\n    this.space = new cp.Space();\n\n    //setup the\
    \ Gravity\n    this.space.gravity = cp.v(0, -800); //Earth gravity\n    this.space.iterations\
    \ = 30;\n    this.space.sleepTimeThreshold = Infinity;\n    this.space.collisionSlop\
    \ = Infinity;\n}\n```\n\nThis `initPhysics` function will be placed inside the\
    \ `layer` object; that is, `initPhysics` will be one of the properties of `layer`\
    \ object. The `cp.Space` class is used to create the space, and `gravity`, `iterations`,\
    \ `sleepTimeThreshold`, and `collisionSlop` are set to the appropriate values.\n\
    \n```\nupdate:function (dt) {\n    this.space.step(dt);\n},\n```\n\nPhysics simulation\
    \ is driven by the `step` method, which is constantly triggered in the `update`\
    \ cycle of `layer`.\n\n## 7.4 Chipmunk Body\n\nA physical object is defined by\
    \ a body; the body has a shape and the sprite’s data associated with it. Let’s\
    \ add a circle and box to the created Chipmunk space:\n\n```\naddPhysicsCircle:\
    \ function() {\n    var width=50,height=50,mass=1;\n\n    this.phBodyCircle =\
    \ this.space.addBody(new cp.Body(mass, cp.momentForCircle(mass,0,width*0.5,cc.p(0,0))));\n\
    \    this.phBodyCircle.setPos(cc.p(cc.winSize.width * 0.5, cc.winSize.height *\
    \ 0.3));\n\n    //#4\n    var phShape = this.space.addShape(new cp.CircleShape(this.phBodyCircle,\
    \ width, cc.p(0, 0)));\n    phShape.setFriction(0);\n    phShape.setElasticity(1);\n\
    \    phShape.setCollisionType(0);\n},\n\naddPhysicsBox: function() {\n    var\
    \ width=50,height=50,mass=1;\n    this.phBodyBox = this.space.addBody(new cp.Body(mass,\
    \ cp.momentForBox(mass, width,height)));\n    this.phBodyBox.setPos(cc.p(cc.winSize.width\
    \ * 0.5, cc.winSize.height * 0.1));\n\n    //#4\n    var phShape = this.space.addShape(new\
    \ cp.BoxShape(this.phBodyBox, width, height));\n    phShape.setFriction(0);\n\
    \    phShape.setElasticity(1);\n    phShape.setCollisionType(1);\n}\n```\n\nAs\
    \ you can see, the circle and box bodies are created using `cp.Body` with `mass`\
    \ and `momentum` objects, and the shape is defined for each using `cp.CircleShape`\
    \ and `cp.BoxShape`. This actually serves an important part in physics simulations,\
    \ and collision-based physical movement is based on these shape objects."
