- fmt: "### 3.10.4 Custom Resolution Policies\n\nAs we seen before, pre-defined policies\
    \ are a combination of container and content strategy. For example, the `SHOW_ALL`\
    \ policy is a combination of `PROPORTION_TO_FRAME` and `SHOW_ALL`, as follows:\n\
    \n```\ncc.RESOLUTION_POLICY.SHOW_ALL = new cc.ResolutionPolicy(cc.ContainerStrategy.PROPORTION_TO_FRAME,\
    \ cc.ContentStrategy.SHOW_ALL);\n```\n\nThis is the internal implementation of\
    \ `SHOW_ALL`. You can define your own policies with a combination of pre-defined\
    \ container and content strategy.\n\n### 3.10.5 Pre-defined Container Strategies\n\
    \n- `cc.ContainerStrategy.EQUAL_TO_FRAME`\n- `cc.ContainerStrategy.PROPORTION_TO_FRAME`\n\
    - `cc.ContainerStrategy.ORIGINAL_CONTAINER`\n\n### 3.10.6 Pre-defined Content\
    \ Strategies\n\n- `cc.ContentStrategy.SHOW_ALL`\n- `cc.ContentStrategy.NO_BORDER`\n\
    - `cc.ContentStrategy.EXACT_FIT`\n- `cc.ContentStrategy.FIXED_WIDTH`\n- `cc.ContentStrategy.FIXED_HEIGHT`\n\
    \nIt is possible to create containers and content strategies of your own; all\
    \ you have to do is use sub-classes `cc.ContainerStrategy` and `cc.ContentStrategy`\
    \ and override the methods shown next.\n\n### 3.10.7 For a Custom Container Strategy\n\
    \n```\nvar CustomContainerStrategy = cc.ContainerStrategy.extend({\n    preApply:\
    \ function (view) {\n        // This function is called before the process of\
    \ adaptation,\n        // you can remove this function if you don't need\n   \
    \ },\n\n    apply: function (view, designedResolution) {\n        // Apply process\n\
    \    },\n\n    postApply: function (view) {\n        // This function is called\
    \ after the process of adaptation,\n        // you can remove this function if\
    \ you don't need\n    }\n});\n```\n\n### 3.10.8 For Custom Content Strategy\n\n\
    ```\nvar CustomContentStrategy = cc.ContentStrategy.extend({\n    preApply: function\
    \ (view) {\n        // This function is called before the process of adaptation,\n\
    \        // you can remove this function if you don't need\n    },\n\n    apply:\
    \ function (view, designedResolution) {\n        var containerW = cc.canvas.width,\
    \ containerH = cc.canvas.height;\n\n        // The process to calculate the content\
    \ size, the x axe scale and the y axe scale\n\n        return this._buildResult(containerW,\
    \ containerH, contentW, contentH, scaleX, scaleY);\n    },\n\n    postApply: function\
    \ (view) {\n        // This function is called after the process of adaptation,\n\
    \        // you can remove this function if you don't need\n    }\n});\n```\n\n\
    You have to implement the `apply` function on both. You have access to frame,\
    \ container, and content width and height.\n\n# 4. Handling Inputs and Events\n\
    \n## 4.1 Introduction\n\nHandling user input is an essential part of any game.\
    \ In Cocos2d-js, user input, such as by touch, mouse, or keyboard, is available\
    \ in the form of events. There are three major parts involved in the event mechanism\
    \ (see Figure 4-1).\n\n![A435521_1_En_4_Fig1_HTML.jpg](A435521_1_En_4_Fig1_HTML.jpg)\n\
    \nFigure 4-1. Event mechanism in Cocos2d-JS\n\n### 4.1.1 Event Trigger\n\nAn event\
    \ trigger is the source of any event. When a touch or any other input happens,\
    \ the Cocos2d-js system will trigger an event in response.\n\n### 4.1.2 Event\
    \ Manager\n\nWhen any event is triggered, event manager will get notified, `EventManager`\
    \ is a singleton instance that is part of the Cocos2d-js system; it manages all\
    \ the events.\n\n### 4.1.3 Event Listeners\n\nThis is where the actual event-handling\
    \ logic goes. Event manager will dispatch the events to all the event listeners\
    \ and they will be handled by event listener instances.\n\n## 4.2 Touch Events\n\
    \nThere are two kind of touch events available: single touch (`cc.EventListener.TOUCH_ONE_BY_ONE`)\
    \ and multi-touch (`cc.EventListener.TOUCH_ALL_AT_ONCE`)\n\n### 4.2.1 Single Touch\n\
    \nIn the `src` folder, create a file called `touchevents.js` and copy the following\
    \ code there:\n\n```\nvar TouchEventsLayer = cc.Layer.extend({\n    sprite:null,\n\
    \    ctor:function () {\n        this._super();\n\n        var size = cc.winSize;\n\
    \n        this.sprite = new cc.Sprite(res.Sprite_Image);\n        this.sprite.attr({\n\
    \            x:size.width / 2,\n            y:size.height / 2\n        });\n \
    \       this.addChild(this.sprite, 0);\n        this.sprite.tag='TouchTarget';\n\
    \n        //Creating Event Listener Object\n        var listener = cc.EventListener.create({\n\
    \            event: cc.EventListener.TOUCH_ONE_BY_ONE,\n            swallowTouches:\
    \ true,\n\n            onTouchBegan: function (touch, event) {\n             \
    \   var target = event.getCurrentTarget();\n                var locationInNode\
    \ = target.convertToNodeSpace(touch.getLocation());\n                var s = target.getContentSize();\n\
    \                var rect = cc.rect(0, 0, s.width, s.height);\n\n            \
    \    //Check the click area\n                if (cc.rectContainsPoint(rect, locationInNode))\
    \ {\n                    cc.log('Touch began: Inside the sprite');\n         \
    \           //True has been returned to initiate the OnTouchMove\n           \
    \         return true;\n                }\n                cc.log('Touch began:\
    \ Outside the sprite');\n                return false;\n            },\n     \
    \       onTouchMoved: function (touch, event) {\n                var target =\
    \ event.getCurrentTarget();\n                target.setPosition(touch.getLocation());\n\
    \            },\n            onTouchEnded: function (touch, event) {\n       \
    \         cc.log('Touch end');\n            }\n        });\n\n        //Added\
    \ Event Listener To Sprite\n        cc.eventManager.addListener(listener, this.sprite);\n\
    \        return true;\n    }\n});\n```\n\nIn this example, the sprite can be dragged\
    \ using single touch. The event listener is created using the event name `cc.EventListener.TOUCH_ONE_BY_ONE`,\
    \ with `swallowTouches` set to `true`. When multiple event listeners are attached\
    \ to the same target for the same event name, the first listener with `swallowTouches:\
    \ true` will swallow the event, and it will not be passed on to the next listener.\n\
    \n```\ncc.eventManager.addListener(listener, this.sprite);\n```\n\nIn this case,\
    \ even though a sprite is the target, a touch event will happen for every tap\
    \ on the screen. To confirm that a touch has happened inside the sprite, the following\
    \ code has been written:\n\n```\nvar target = event.getCurrentTarget();\nvar locationInNode\
    \ = target.convertToNodeSpace(touch.getLocation());\nvar s = target.getContentSize();\n\
    var rect = cc.rect(0, 0, s.width, s.height);\n\n//Check the click area\nif (cc.rectContainsPoint(rect,\
    \ locationInNode)) {\n    cc.log('Touch began: Inside the sprite');\n    //True\
    \ has been returned to initiate the OnTouchMove\n    return true;\n}\n```\n\n\
    In `onTouchBegan`, a condition has been checked as to whether a touch has happened\
    \ within the sprite or not. If the touch is within the sprite, then `true` will\
    \ be returned so that the touch move’s gestures will be directed to the `onTouchMoved`\
    \ function; the target position is changed as per the touch move."
