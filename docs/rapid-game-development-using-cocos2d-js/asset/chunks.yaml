    any functions internal to Cocos2d-js that are not documented, the app will work
    fine out of the box in the browser, but when you deploy it as a native app you
    may not see the same result. It is always recommended that you follow the documented
    APIs if you are planning to compile your game to any mobile platform.


    ## 2.3 Object Hierarchy


    Cocos2d-js is based on object-oriented principles, so all the entities involved
    are considered classes and objects. Consider Figure [2-2](#A435521_1_En_2_Chapter.html#Fig2).


    ![A435521_1_En_2_Fig2_HTML.jpg](A435521_1_En_2_Fig2_HTML.jpg)


    Figure 2-2.


    Object hierarchy


    Every class in Cocos2d-js, except for a few utilities, is inherited from `cc.Node`,
    from `Scene` and `Layer` to `Sprites`, all of which are instances of the `Node`
    object. Whenever you deal with any visible elements in Cocos2d-js, the topmost
    root object is `cc.Node`. So, most of the time you are dealing with a `Node` object.
    The derived objects will have their own behaviors and overrides based on their
    definitions and needs.


    ## 2.4 Deploy Options


    As you are working with a pure JavaScript library, there are many more options
    for deploying your app than just relying on the Cocos console.


    ### 2.4.1 Deploy as Hybrid App


    This option is subjected to your game’s performance. If your game uses a heavy
    draw cycle, then this option is not recommended.


    ### 2.4.2 Deploy using Titanium


    This option will enable you to deploy your app as a native app, but its feasibility
    may vary based on what you do in your games.


    ### 2.4.3 Cocos Console


    This is the our recommended way to deploy your app to various platforms, but you
    can use other Cocos2d-x services such as SDKBOX, pluginX, and so on.


    # 3. A Deeper Look at Sprites


    ## 3.1 Introduction


    Sprites are the most essential part of any 2D game. You will be dealing with this
    entity often while developing 2D games. In Cocos2d-js, this entity is defined
    by a class called `cc.Sprite`. In this section, we are going to explore this class
    in detail, including how it is organized, its usage, how to do frame animations,
    etc. So, let’s begin.


    ## 3.2 Sprite Class


    In Cocos2d-js, the `cc.Sprite` class is used to define the sprites of your game.
    This class can be initialized using the image file name, the initial rotation
    transformation, and so on. After that, you can update the x,y position dynamically
    based on your game logic. Let’s see how this class is organized in Figure [3-1](#A435521_1_En_3_Chapter.html#Fig1).


    ![A435521_1_En_3_Fig1_HTML.jpg](A435521_1_En_3_Fig1_HTML.jpg)


    Figure 3-1.


    Sprite class


    When you look into a sprite, it has two major parts. One is the texture, which
    represents the image, and the other is the sprite frame, which represents the
    `rect` in the texture image that is the current display of the sprite. Texture
    is represented by `cc.Texture` and the sprite frame is represented by `cc.SpriteFrame`.
    Let’s have a look at a few examples.


    ## 3.3 Sprite with Single Image


    In the `src` folder, create a file called `spriteimage.js` and copy and paste
    the following code:


    ```

    1   var SpriteImageLayer = cc.Layer.extend({

    2       sprite:null,

    3       ctor:function () {

    4            this._super();


    6            var size = cc.winSize;


    8            this.sprite = new cc.Sprite(res.Sprite_Image);

    9            this.sprite.attr({

    10                 x: size.width / 2,

    11                 y: size.height / 2

    12            });

    13            this.addChild(this.sprite, 0);

    14            return true;

    15       }

    16   });

    ```


    In `project.json`, include this new file, and in `app.js`, replace the existing
    `layer` instance in the scene with `SpriteImageLayer`.


    ```

    1   var HelloWorldScene = cc.Scene.extend({

    2       onEnter:function () {

    3           this._super();

    4           //Replace the layer with SpriteImageLayer.

    5           var layer = new SpriteImageLayer();

    6           this.addChild(layer);

    7       }

    8   });

    ```


    In `resources.js`, the `Sprite_Image` property needs to be included; you can use
    the image of your choice.


    ```

    1   var res = {

    2       .......


    4       Sprite_Image:"res/sprite_image.png"

    5   };

    ```


    I’ll be using the image seen in Figure [3-2](#A435521_1_En_3_Chapter.html#Fig2).


    ![A435521_1_En_3_Fig2_HTML.jpg](A435521_1_En_3_Fig2_HTML.jpg)


    Figure 3-2.


    sprite_image.png


    Remember these steps of running individual layers, since we will be creating separate
    layers for each example, and these steps will not be repeated in upcoming examples.


    As you can see, the sprite has been initialized with a single image:


    ```

    1   this.sprite = new cc.Sprite(res.Sprite_Image);

    ```


    This constructor will create a `cc.Texture` instance with `res.Sprite_Image`,
    and `cc.SpriteFrame` will be initialized with `rect(0,0,spriteWidth,spriteHeight)`
    by default so as to show the full image. So, the output will be as in Figure [3-3](#A435521_1_En_3_Chapter.html#Fig3).


    ![A435521_1_En_3_Fig3_HTML.jpg](A435521_1_En_3_Fig3_HTML.jpg)


    Figure 3-3.


    Sprite with single image


    ### 3.3.1 FPS Display


    The display at the bottom-left corner is called the FPS display, and it has three
    values:


    *   Draw calls

    *   Delta time

    *   Frame rate


    You can control the visibility of the FPS display using the `showFPS` flag in
    `project.json`.


    #### 3.3.1.1 Draw Call


    Renderings happen in draw calls, and for every single node in the scene there
    is an associated draw call. As draw calls increase, delta time and frame rate
    decrease, and this is directly proportional to the performance of the game.


    #### 3.3.1.2 Delta time


    The time taken by the previous frame to complete its render.


    #### 3.3.1.3 Frame rate


    Represents the number of frames rendered in a second.'
  trans: '

    # 2.1 引擎架构


    了解`Cocos2d-js`的架构将为您理解整个框架打下坚实的基础。本节不会涉及超出本书范围的详细架构，但我们将涵盖您需要了解的、以便继续学习的必要细节。`Cocos2d-js`是一个纯基于**JavaScript**的游戏框架，运行在浏览器栈上。您可以将其编译为**Web**应用并在任何浏览器上运行；然而，其**API**和对象的层级结构与`Cocos2d-x`相同。因此，借助`JSB`和`SpiderMonkey`，您的**JavaScript**游戏代码可以部署为实际利用`OpenGL/DirectX`核心渲染管线的原生应用。让我们看一下图
    2-1 中的架构。


    ![A435521_1_En_2_Fig1_HTML.jpg](img/A435521_1_En_2_Fig1_HTML.jpg)


    图 2-1. `Cocos2d-js` 栈


    如您所见，如果您的应用是基于浏览器的，您的**JavaScript**游戏代码将利用`Cocos2d-js`的库，并可以像其他任何**Web**应用一样运行。当您使用`Cocos`控制台将其部署为原生应用时，您的**JavaScript**代码将映射到实际指向原生`Cocos2d-x`的**JavaScript**绑定。您的**JavaScript**代码将由`SpiderMonkey`转换为**C**代码。因此，实际上是`Cocos2d-x`在驱动您的**JavaScript**游戏。


    ## 2.2 JSB


    如上所述，`JSB`包含`Cocos2d-x`的**JavaScript**和**C++ API**之间的映射，因此当您选择将游戏部署为原生应用时，您所有的**API**使用都会在`SpiderMonkey`的帮助下映射到实际的**C++
    API**调用。请注意，只有有文档记录的`Cocos2d-js API`才能映射到原生**API**调用。如果您尝试调用任何`Cocos2d-js`内部未文档化的函数，应用在浏览器中会正常运行，但当您将其部署为原生应用时，您可能看不到相同的结果。如果您计划将游戏编译到任何移动平台，强烈建议您始终遵循有文档记录的**API**。


    ## 2.3 对象层级结构


    `Cocos2d-js`基于面向对象的原则，因此所有涉及的实体都被视为类和对象。请参考图 2-2。


    ![A435521_1_En_2_Fig2_HTML.jpg](img/A435521_1_En_2_Fig2_HTML.jpg)


    图 2-2. 对象层级结构


    `Cocos2d-js`中的每个类，除了一些工具类外，都继承自`cc.Node`，从`Scene`和`Layer`到`Sprites`，所有这些类都是`Node`对象的实例。当您在`Cocos2d-js`中处理任何可见元素时，最顶层的根对象是`cc.Node`。因此，大多数情况下您都在处理一个`Node`对象。派生对象将根据其定义和需求具有自己的行为和重写方法。


    ## 2.4 部署选项


    由于您使用的是纯**JavaScript**库，因此部署应用的方式比仅仅依赖`Cocos`控制台要多得多。


    ### 2.4.1 部署为混合应用


    此选项取决于您游戏的性能。如果您的游戏使用了繁重的绘制循环，则不建议使用此选项。


    ### 2.4.2 使用 Titanium 部署


    此选项将使您能够将应用部署为原生应用，但其可行性可能因您在游戏中的操作而异。


    ### 2.4.3 Cocos 控制台


    这是我们将应用部署到各种平台的首选方式，但您也可以使用其他`Cocos2d-x`服务，例如`SDKBOX`、`pluginX`等。


    # 3. 深入了解精灵


    ## 3.1 简介


    精灵是任何**2D**游戏中最核心的部分。在开发**2D**游戏时，您会经常处理这个实体。在`Cocos2d-js`中，这个实体由一个名为`cc.Sprite`的类定义。在本节中，我们将详细探讨这个类，包括它的组织方式、使用方法、如何实现帧动画等。那么，让我们开始吧。


    ## 3.2 Sprite 类


    在`Cocos2d-js`中，`cc.Sprite`类用于定义游戏中的精灵。该类可以使用图像文件名、初始旋转变换等进行初始化。之后，您可以根据游戏逻辑动态更新其
    **x,y** 位置。让我们看一下图 3-1 中这个类的组织方式。


    ![A435521_1_En_3_Fig1_HTML.jpg](img/A435521_1_En_3_Fig1_HTML.jpg)


    图 3-1. Sprite 类


    当您观察一个精灵时，它有两个主要部分。一个是纹理，代表图像；另一个是精灵帧，代表纹理图像中当前显示精灵的`rect`（矩形区域）。纹理由 `cc.Texture`
    表示，精灵帧由 `cc.SpriteFrame` 表示。让我们看几个示例。


    ## 3.3 单一图像精灵


    在 `src` 文件夹中，创建一个名为 `spriteimage.js` 的文件，并复制粘贴以下代码：


    ```

    1   var SpriteImageLayer = cc.Layer.extend({

    2       sprite:null,

    3       ctor:function () {

    4            this._super();


    6            var size = cc.winSize;


    8            this.sprite = new cc.Sprite(res.Sprite_Image);

    9            this.sprite.attr({

    10                 x: size.width / 2,

    11                 y: size.height / 2

    12            });

    13            this.addChild(this.sprite, 0);

    14            return true;

    15       }

    16   });

    ```


    在 `project.json` 中包含这个新文件，并在 `app.js` 中，将场景中现有的 `layer` 实例替换为 `SpriteImageLayer`。


    ```

    1   var HelloWorldScene = cc.Scene.extend({

    2       onEnter:function () {

    3           this._super();

    4           //将当前层替换为 SpriteImageLayer。

    5           var layer = new SpriteImageLayer();

    6           this.addChild(layer);

    7       }

    8   });

    ```


    在 `resources.js` 中，需要包含 `Sprite_Image` 属性；您可以使用自己选择的图像。


    ```

    1   var res = {

    2       .......


    4       Sprite_Image:"res/sprite_image.png"

    5   };

    ```


    我将使用图 3-2 中看到的图像。


    ![A435521_1_En_3_Fig2_HTML.jpg](img/A435521_1_En_3_Fig2_HTML.jpg)


    图 3-2. `sprite_image.png`


    请记住这些运行单独层的步骤，因为我们将为每个示例创建单独的层，并且在后续示例中这些步骤将不再重复。


    如您所见，精灵已经用一个单一图像初始化：


    ```

    1   this.sprite = new cc.Sprite(res.Sprite_Image);

    ```


    此构造函数将使用 `res.Sprite_Image` 创建一个 `cc.Texture` 实例，并且 `cc.SpriteFrame` 将默认初始化为 `rect(0,0,spriteWidth,spriteHeight)`
    以显示完整的图像。因此，输出将如图 3-3 所示。


    ![A435521_1_En_3_Fig3_HTML.jpg](img/A435521_1_En_3_Fig3_HTML.jpg)


    图 3-3. 带单一图像的精灵


    ### 3.3.1 FPS 显示


    左下角的显示称为 **FPS** 显示，它有三个值：


    *   绘制调用数

    *   增量时间

    *   帧率


    您可以使用 `project.json` 中的 `showFPS` 标记来控制 **FPS** 显示的可见性。


    #### 3.3.1.1 绘制调用


    渲染发生在绘制调用中，场景中的每个节点都有一个关联的绘制调用。随着绘制调用数的增加，增量时间和帧率会下降，这与游戏的性能直接相关。


    #### 3.3.1.2 增量时间


    前一帧完成渲染所花费的时间。


    #### 3.3.1.3 帧率


    表示每秒渲染的帧数。

