    If you open `main.js`, you will see the following code.


    ```

    1   cc.game.onStart = function(){

    2       //If referenced loading.js, please remove it

    3       if(!cc.sys.isNative && document.getElementById("cocosLoading")) 4


    5            document.body.removeChild(document.getElementById("cocosLoading"));


    7       // Pass true to enable retina display, disabled by default to improve
    perfor\

    8       mance

    9       cc.view.enableRetina(false);

    10       // Adjust viewport meta

    11       cc.view.adjustViewPort(true);

    12       // Set up the resolution policy and design resolution size

    13       cc.view.setDesignResolutionSize(800, 450, cc.ResolutionPolicy.SHOW_ALL);

    14       // The game will be resized when browser size changes

    15       cc.view.resizeWithBrowserSize(true);

    16       //load resources

    17       cc.LoaderScene.preload(g_resources, function () {

    18           cc.director.runScene(new HelloWorldScene());

    19       }, this);

    20   };

    21   cc.game.run();

    ```


    The Cocos2d-js engine will begin by executing the `onStart` function, which has
    code to kickstart your game. There are a few configuration-related things going
    on in the preceding code that will be explained in later chapters. For now, we
    will focus on the `cc.LoaderScene` part.


    ```

    1   cc.LoaderScene.preload(g_resources, function () {

    2        cc.director.runScene(new HelloWorldScene());

    3   }, this);

    ```


    The preceding code loads the “Hello World” scene. `cc.director` is the single
    controller instance for your game. The purpose of this director is to guide your
    game through execution, loading and unloading the scene and getting information
    about the game-execution environment, such as screen size and so on. In this code,
    the director uses the `runScene` function to load the `HelloWorldScene`, which
    is loaded inside `preload`. `preload` loads the resources specified in `g_resources`
    into the Cocos cache, and once the resources have been loaded, a callback function
    is executed that has the code to load the `HelloWorldScene`.


    Let’s have look at `HelloWorldScene` and `HelloWorldLayer`. Open `app.js` inside
    `src`. At the bottom of `app.js` you will see code like this:


    ```

    1   var HelloWorldScene = cc.Scene.extend({

    2       onEnter:function () {

    3           this._super();

    4           var layer = new HelloWorldLayer();

    5           this.addChild(layer);

    6       }

    7   });

    ```


    A scene is told to run by invoking the `onEnter` function, and `HelloWorldLayer`
    is injected as a child of the scene.


    We are going to modify `HelloWorldLayer` to make things simple.


    ```

    1   var HelloWorldLayer = cc.Layer.extend({

    2       sprite:null,

    3       ctor:function () {

    4           this._super();

    5           var size = cc.winSize;

    6           var helloLabel = new cc.LabelTTF("Hello World", "Arial", 38);

    7           // position the label on the center of the screen

    8           helloLabel.x = size.width / 2;

    9           helloLabel.y = size.height / 2 + 200;

    10           // add the label as a child to this layer

    11           this.addChild(helloLabel, 5);


    13           // add "HelloWorld" splash screen

    14           this.sprite = new cc.Sprite(res.HelloWorld_png);

    15           this.sprite.attr({

    16                x: size.width / 2,

    17                y: size.height / 2

    18           });

    19           this.addChild(this.sprite, 0);

    20           return true;

    21       }

    22   });

    ```


    This layer has two children; one is `cc.LabelTTF`, which has “Hello World” as
    text, and the other is a `HelloWorld_png` sprite. Throughout this book, we are
    going to use portrait screen resolution. So, in `main.js`, you should change the
    following line:


    ```

    1   //This is landscape

    2   cc.view.setDesignResolutionSize(800, 450, cc.ResolutionPolicy.SHOW_ALL);

    ```


    to


    ```

    1   //Swap the width and height so that it can be portrait

    2   cc.view.setDesignResolutionSize(450, 800, cc.ResolutionPolicy.SHOW_ALL);

    ```


    Width and height have been swapped.


    ## 1.4 Running “Hello World”


    To make things simple, throughout this book we are going to run all the code in
    a Web browser. However, deploying it on a device as a native app is your choice.
    To run this sample type, navigate to the project path in the terminal and type
    the following command:


    ```

    1   cocos run -p web

    ```


    This will launch the app in the browser; however, you can launch the app in Android,
    iOS, or Windows phone by altering `-p param` as `''android''` or `''ios''`. You
    will see something like what is shown in Figure [1-2](#A435521_1_En_1_Chapter.html#Fig2).


    ![A435521_1_En_1_Fig2_HTML.jpg](A435521_1_En_1_Fig2_HTML.jpg)


