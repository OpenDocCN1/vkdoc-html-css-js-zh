- fmt: "# 8.7 Accessing Current Language\n\nCocos2d-Js also provides a way to access\
    \ the current locale in your runtime. There is a property in `cc.sys` where you\
    \ can access the current language string:\n\n```\ncc.sys.language\n```\n\nLet’s\
    \ see a quick example. As in previous examples, add a label to an empty layer:\n\
    \n```\nthis.Label = new cc.LabelTTF('','', 32);\nthis.Label.attr({\n    x: size.width\
    \ / 2,\n    y: size.height / 2\n});\n\nthis.addChild(this.Label);\n```\n\nThen,\
    \ access the language:\n\n```\nvar language=cc.sys.language;\n```\n\nThen, set\
    \ it to the label you added:\n\n```\n//set the language string\nthis.Label.setString('Current\
    \ Locale: '+language);\n```\n\nHere is the full code:\n\n```\nvar LanguageLayer\
    \ = BaseSampleLayer.extend({\n    sprite:null,\n    ctor:function () {\n     \
    \   this._super();\n\n        var size = cc.winSize;\n\n        this.Label = new\
    \ cc.LabelTTF('','', 32);\n        this.Label.attr({\n            x: size.width\
    \ / 2,\n            y: size.height / 2\n        });\n\n        this.addChild(this.Label);\n\
    \n        var language=cc.sys.language;\n\n        //set the language string\n\
    \        this.Label.setString('Current Locale: '+language);\n        return true;\n\
    \    }\n});\n```\n\nYou will get the output shown in Figure [8-5](#A435521_1_En_8_Chapter.html#Fig5).\n\
    \n![A435521_1_En_8_Fig5_HTML.jpg](A435521_1_En_8_Fig5_HTML.jpg)\n\nFigure 8-5.\
    \ Accessing locale\n\n# 8.8 Accessing System Capabilities\n\nAs you already know,\
    \ your Cocos2d-js games can be deployed to different native platforms, which may\
    \ have different capabilities. Cocos2d-js provides a way to detect the capabilities\
    \ of the current environment through `cc.sys`:\n\n```\ncc.sys.capabilities\n```\n\
    \nIf you console this object in your browser, you will get an object structure\
    \ like the following:\n\n```\n{\n   accelerometer: true,\n   canvas: true,\n \
    \  keyboard: true,\n   mouse: true,\n   opengl: true,\n}\n```\n\nFor example,\
    \ if you want to detect if the system supports touch, you can simply query this\
    \ object for the touch property. Similarly, other native capabilities can be queried.\n\
    \n# 8.9 Optimization\n\nOptimization is a very crucial part of any kind of game.\
    \ This is not the last process in your game development, however, as you have\
    \ to plan ahead even before your coding process. There are certain tips and tricks\
    \ that have been found to be best practices.\n\n## 8.9.1 Memory Optimization\n\
    \n* Most of the memory in your game will be consumed by textures, so you have\
    \ to pay closer attention to the size of the textures you are loading. Have a\
    \ best practice of loading textures only when needed.\n* Try to combine all the\
    \ textures in your game into a sprite sheet or a texture atlas, as this will save\
    \ you lot of memory.\n* Also, it is good practice to always use NPOT textures\
    \ instead of POT.\n\n## 8.9.2 Performance Optimization\n\n* When it comes to performance\
    \ or the draw call’s frame rate, delta time plays an important role.\n* Make sure\
    \ you avoid using a lot of draw calls. Use a single texture for all the sprites\
    \ in your game, as this will enable sprite batching.\n* Also, make sure you use\
    \ `SpriteBatchNode` to combine all the needed sprites to be rendered in a single\
    \ draw call if your platform doesn’t support auto batching.\n* If you write custom\
    \ shaders, make sure your vertex and fragment shaders don’t have any intensive\
    \ operations.\n* Having a complex computation in a shader will throttle the performance\
    \ of the GPU, especially in fragment functions, since a fragment function will\
    \ be executed for every pixel in your screen.\n* Try to use 16-bit textures with\
    \ RBGA4444 color depth.\n\n## 8.9.3 JavaScript Level\n\n* Make sure you have memory\
    \ leak`–`free code.\n* When you reference inner nodes maintained in outer nodes,\
    \ make sure you clear the values when they are not needed.\n* Use only documented\
    \ APIs, as the usage and tweaking of internal variables and functions will lead\
    \ to inconsistent behavior, as undocumented APIs are subject to changes in the\
    \ upcoming versions.\n\n# 8.10 Conclusion\n\nSo far, we have seen the features\
    \ of Cocos2d-js from scratch. I hope this will give you a head start on your game\
    \ development. Cocos2d-x is big world, and a single book is not enough to explain\
