    \ {\n        // 此函数在适配过程之后被调用，\n        // 如果不需要，可以移除该函数\n    }\n});\n```\n\n\
    ### 3.10.8 自定义内容策略\n\n```\nvar CustomContentStrategy = cc.ContentStrategy.extend({\n\
