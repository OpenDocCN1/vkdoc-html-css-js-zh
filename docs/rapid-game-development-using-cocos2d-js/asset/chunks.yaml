    \n## 4.2 触摸事件\n\n有两种可用的触摸事件：单点触摸（`cc.EventListener.TOUCH_ONE_BY_ONE`）和多点触摸（`cc.EventListener.TOUCH_ALL_AT_ONCE`）\n\
    \n### 4.2.1 单点触摸\n\n在 `src` 文件夹中，创建一个名为 `touchevents.js` 的文件，并将以下代码复制进去：\n\n```\n\
