    # 8.5 Accessing Local Storage


    Local storage is nothing but the persistent storage facility offered by the platform
    (Web/Android/iOS) and is where you can store the key/value pair and retrieve it
    from later. Cocos2d-js offers an API to access the platform’s local storage. You
    can use this API to store stuff like game state, user’s high score, etc.


    ```

    1   cc.sys.localStorage

    ```


    The preceding object provides access to the local storage. There are two methods
    to get/set the values:


    ```

    1   //set value to the localstorage

    2   localstorage.setItem(,);

    4   //get value from the localstorage

    5   var value = localstorage.getItem();

    ```


    The `setItem` method provides a way to set the value to the local storage using
    a key as reference. The key is a string, and the value could be a primitive value
    or a JavaScript object.


    Let’s have a look at a simple example. Create a new layer and, as in previous
    examples, add a label to the layer:


    ```

    1   var size = cc.winSize;

    3   this.Label = new cc.LabelTTF('''','''', 32);

    4   this.Label.attr({

    5      x: size.width / 2,

    6      y: size.height / 2

    7   });

    8   this.addChild(this.Label);

