    \    //返回 true 以启动 OnTouchMove\n    return true;\n}\n```\n\n在 `onTouchBegan` 中，检查了触摸是否发生在精灵内部的条件。如果触摸在精灵内部，则返回\
    \ `true`，以便触摸移动的手势将被定向到 `onTouchMoved` 函数；目标位置会根据触摸移动进行更改。\n"
- fmt: '### 4.2.2 Multi-Touch


    Multi-touch event listeners can be created using event name `cc.EventListener.TOUCH_ALL_AT_ONCE`.
    Refer to the code snippet that follows:


    ```

    1   var listener = cc.EventListener.create({

    2       event: cc.EventListener.TOUCH_ALL_AT_ONCE,

    3       swallowTouch: true,

    4       onTouchesBegan: function (touches, event) {

    5           .......

    6       },

    7       onTouchesMoved: function (touches, event) {

    8           .......

    9   },

    10       onTouchesEnded: function (touches, event) {

    11           .......

    12       }

    13   });

    ```


    So, the callback for multi-touch is different from that for single touch. It has
    `onTouchesBegan`, `onTouchesMoved`, and `onTouchesEnded` functions. The `touches`
    object will have details about each touch, with touch ID. Mostly, multi-touch
    can be used in scenarios like map zoom, multi-touch for play control, and so on.


    ### 4.3 Mouse Events


    As with touch events, mouse events are referred to by event name `cc.EventListener.MOUSE`.
    In the `src` folder, create a file called `mouseevents.js` and copy the following
    code into it:


    ```

    1   var MouseEventsLayer = cc.Layer.extend({

    2       sprite:null,

    3       ctor:function () {

    4           this._super();

    6           var size = cc.winSize;

    8           this.sprite = new cc.Sprite(res.Sprite_Image);

    9           this.sprite.attr({

    10               x: size.width / 2,

    11               y: size.height / 2

    12           });

    13           this.addChild(this.sprite, 0);

    14           this.sprite.tag=''TouchTarget'';

    16           //Creating Event Listener Object

    17           var listener = cc.EventListener.create({

    18               event: cc.EventListener.MOUSE,

    19                   swallowTouches: true,

    20                   ismousedown:false,

    21               onMouseDown: function (event) {

    22                   var target = event.getCurrentTarget();

    23                   var locationInNode = target.convertToNodeSpace(event.getLocation());

    24                   var s = target.getContentSize();

    25                   var rect = cc.rect(0, 0, s.width, s.height);

    28                               //Check the click area

    29                   if (cc.rectContainsPoint(rect, locationInNode)) {

    30                       cc.log(''Mouse Down: Inside the sprite'');

    31                       this.ismousedown=true;

    32                   }

    33                   cc.log(''Mouse Down: Outside the sprite'');

    34                   return false;

    35               },

    36               onMouseMove: function (event) {

    37                   if(this.ismousedown)

    38                   {

    39                       var target = event.getCurrentTarget();

    40                       target.setPosition(event.getLocation());

    41                   }

    42               },

    43               onMouseUp: function (event) {

    44                  cc.log(''Mouse Up'');

    45                  this.ismousedown=false;

    46               }

    47           });

    49           //Added Event Listener To Sprite

    50           cc.eventManager.addListener(listener, this.sprite);

    51           return true;

    52       }

    53   });

    ```


    In this example also, the sprite can be dragged with a mouse click, though there
    is one major difference between touch and mouse event handling. In touch, the
    `onTouchBegan` function has to return `true` in order to process `onTouchMove`.
    In mouse events, `onMouseMove` doesn’t depend on the return value of `onMouseDown`.
    Both events can be processed simultaneously. To keep track of when a click has
    been made within the sprite, we have introduced the `ismousedown` flag. When a
    mouse down event happens within the sprite, the position will be changed via `onMouseMove`.


    ### 4.4 Keyboard Events


    In the `src` folder, create a file called `keyboardevent.js` and copy the following
    code into it:


    ```

    1   var KeyboardEventsLayer = cc.Layer.extend({

    2       sprite:null,

    3       ctor:function () {

    4           this._super();

    6           var size = cc.winSize;

    7           var KeyCode={

    8               LEFT:37,

    9               UP:38,

    10               RIGHT:39,

    11               DOWN:40

    12           };

    13           var MoveOffSet=20;

    14           this.sprite = new cc.Sprite(res.Sprite_Image);

    15           this.sprite.attr({

    16               x: size.width / 2,

    17               y: size.height / 2

    18           });

    19           this.addChild(this.sprite, 0);

    20           this.sprite.tag=''TouchTarget'';

    22           //Creating Event Listener Object

    23           var listener = cc.EventListener.create({

    24             event: cc.EventListener.KEYBOARD,

    25                 swallowTouches: true,

    26             onKeyPressed: function (keyCode,event) {

    27                var target = event.getCurrentTarget();

    28                var position=target.getPosition();

    29                switch(keyCode)

    30                {

    31                   case KeyCode.LEFT:

    32                   position.x-=MoveOffSet;

    33                   break;

    35                   case KeyCode.RIGHT:

    36                   position.x+=MoveOffSet;

    37                   break;

    39                   case KeyCode.UP:

    40                   position.y+=MoveOffSet;

    41                   break;

    43                   case KeyCode.DOWN:

    44                   position.y-=MoveOffSet;

    45                   break;

    46                }

    47                target.setPosition(position);

    48           },

    49           onKeyReleased: function (event) {

    50              cc.log(''Key released'');

    51           }

    52        });

    54        //Added Event Listener To Sprite

    55        cc.eventManager.addListener(listener, this.sprite);

    56        return true;

    57       }

    58   });

    ```


    In the preceding code, the same sprite drag is performed using UP, DOWN, LEFT,
    RIGHT key combinations. The `onKeyPress` function keycode is checked, and if the
    keycode is any of the arrow keys, the x,y position of the sprite is moved accordingly.


    ### 4.5 Accelerometer Events


    Accelerometer events are referred to by the event name `cc.EventListener.ACCELERATION`.
    Accelerometer input needs to be enabled via input manager, as follows:


    ```

    1   cc.inputManager.setAccelerometerEnabled(true);

    ```


    After that, you can create a listener and attach it to the sprite using `eventManager`:


    ```

    1   cc.eventManager.addListener({

    2        event: cc.EventListener.ACCELERATION,

    3        callback: function(acc, event){

    4            // Processing logic here

    5        }

    6   }, sprite);

    ```


    ### 4.6 Custom Events


    Apart from system-defined events, we can create our own events. See the following
    code snippet:


    ```

    1   var listener = cc.EventListener.create({

    2         event: cc.EventListener.CUSTOM,

    3         eventName: "my_custom_event",

    4         callback: function(event){

    5             cc.log("Custom event 1 received, " + event.getUserData() + "times");

    6         }

    7   });

    8   cc.eventManager.addListener(listener, 1);

    ```


    This custom event has only one callback function, which will be invoked after
    the event is triggered:


    ```

    1   var event = new cc.EventCustom("my_custom_event");

    2   event.setUserData(counter.toString());

    3   cc.eventManager.dispatchEvent(event);

    ```


    The `dispatchEvent` function of the event manager is used to trigger the custom
    event. This method is also used internally to trigger the user-input events by
    the Cocos2d engine.


    # 5. Adding a GUI


    ## 5.1 Introduction


    A GUI is another essential part of any game. It shows the HUD display, score,
    any required text, and buttons such as play and pause. Cocos2d-js has pre-defined
    node types to represent such GUI elements. Let’s look at them one by one.


    ## 5.2 Labels


    If you want to display any text in your game, then `Label` objects can be used.
    There are two types of label offered by Cocos2d-js.'
