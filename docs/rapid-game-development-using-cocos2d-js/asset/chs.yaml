  \ 用于维持两个物体按设定的角速度进行相对旋转；也就是说，当涉及 `bodyA` 和 `bodyB` 时，`SimpleMotor` 会以设定的角速度维持这两个物体的相对旋转。\n\
  \n首先，设置 Chipmunk 空间并向其中添加两个盒子：\n\n```\n1   var bodyA = this.addPhysicsBox(cc.p(cc.winSize.width\
  \ * 0.25,\n2              cc.winSize.height * 0.5));\n\n4   var bodyB = this.addPhysicsBox(cc.p(cc.winSize.width\
  \ * 0.75,\n5               cc.winSize.height * 0.5));\n```\n\n然后，通过枢轴关节将这两个物体固定在默认的静态物体上：\n\
  \n```\n1   var staticBody=this.space.staticBody;\n\n3   this.space.addConstraint(new\
  \ cp.PivotJoint(bodyA, staticBody,\n4      cc.p(cc.winSize.width * 0.25, cc.winSize.height\
  \ * 0.5)));\n\n6   this.space.addConstraint(new cp.PivotJoint(bodyB, staticBody,\n\
  7      cc.p(cc.winSize.width * 0.75, cc.winSize.height * 0.5)));\n```\n\n接着，对 `bodyA`\
  \ 和 `bodyB` 应用 `SimpleMotor`：\n\n```\n1   var simpleMotor = new cp.SimpleMotor(bodyA,\
  \ bodyB, Math.PI);\n2   this.space.addConstraint(simpleMotor);\n```\n\n这里，两个物体的相对角速度被设置为\
  \ `Math.PI`。以下是该层的完整源代码：\n\n```\n1   var SimpleMotorLayer = BaseSampleLayer.extend({\n\
