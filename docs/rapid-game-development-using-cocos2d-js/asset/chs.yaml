- "# 6. 动画乐趣\n\n## 6.1 简介\n\n动画对于任何优秀的游戏都至关重要，它能让你的游戏看起来很酷且具有视觉吸引力，并有助于你获取更多用户。一款具有视觉吸引力的游戏本身就是一种营销。花点时间看看\
  \ Google Play 和 App Store 中收入最高的游戏。顶级游戏使用清晰且细节丰富的动画来改善用户体验并吸引用户。深呼吸，我们将要探讨 Cocos2d-js\
  \ 中动画系统的细节。让我们开始吧。\n\n## 6.2 动作\n\n动作是 Cocos2d-js 中用于动画化精灵的构造。动作随时间改变精灵的属性，从而使精灵按照我们想要的方式运动。有几种可用的动作类型，用于在精灵上为所有实时场景应用动画。让我们看一个简单的例子：\n\
  \n```\n1   var action = cc.moveBy(2, cc.p(size.width - 40, size.height - 40));\n\
  2   this.sprite.runAction(action);\n```\n\n在这个例子中，`action` 对象是使用 `cc.moveBy` 函数创建的。任何动作都可以使用\
  \ `runAction` 方法在精灵上运行。这个方法实际上属于 `cc.Node`，因此除了精灵之外，我们还可以动画化任何以 `cc.Node` 为父节点或最终父节点（即层、场景等）的对象。基本上，创建动作有两种变体。\n\
  \n### 6.2.1 By 和 To 动作\n\n前面的代码是 `By` 变体的一个例子。让我们看一下同一个例子的 `To` 变体：\n\n```\n1  \
  \ var action = cc.moveTo(2, cc.p(size.width - 40, size.height - 40));\n2   this.sprite.runAction(action);\n\
  ```\n\n`By` 和 `To` 动作之间的唯一区别是：`To` 会将目标属性值动画化为绝对值，而 `By` 会将目标属性值动画化为相对值（例如：如果你有一个精灵位于\
  \ (10,10) 位置，并且你使用 `moveBy` 动作以 (5,5) 的值对其进行动画化，动画结束后精灵的最终位置将是 (15,15)；如果是 `moveTo`\
  \ 动作，最终位置将是 (5,5)）。\n\n## 6.3 可用动作列表\n\n以下是你可以应用于任何节点的可用动作列表。列出的组合包括 `By` 和 `To`\
  \ 变体，你可以使用简单的精灵图片进行尝试。\n\n### 6.3.1 移动\n\n此动作用于动画化任何节点实例的 x,y 位置：\n\n```\n1   var\
  \ action = cc.moveBy(2, cc.p(size.width - 40, size.height - 40));\n2   var action\
  \ = cc.moveTo(2, cc.p(size.width - 40, size.height - 40));\n```\n\n第一个参数是持续时间，第二个参数是目标点坐标。\n\
  \n### 6.3.2 跳跃\n\n此动作用于以抛物线的方式动画化节点的 x,y 位置，使其看起来像是在跳跃：\n\n```\n1   var action =\
  \ new cc.JumpBy(2, cc.p(300, 0), 50, 4);\n2   var action = new cc.JumpBy(2, 300,\
  \ 0, 50, 4);\n```\n\n与所有动作一样，第一个参数是持续时间。第二个参数是一个点或数字，表示目标值（可以是 x 或 (x,y)）。如果它是一个点，那么第三个参数被视为高度；如果它是一个数字，那么第三个参数被视为\
  \ y 值。接下来的两个参数分别表示高度和跳跃次数。因此在这种情况下，(x,y) 和高度分别代表抛物线的宽度和高度。\n\n\n\n### 6.3.3 旋转\n\
  \n该动作用于通过随时间**旋转**属性来制作节点的旋转动画：\n\n```\n1   var action = new cc.RotateBy(2, 360);\n\
  2   var action = new cc.RotateTo(2, 360);\n```\n\n第一个参数是持续时间，第二个参数是 `angleX`，表示绕\
  \ X 轴旋转。第三个参数 `angleY` 是可选的，用于在少数情况下进行 Y 轴旋转。\n\n### 6.3.4 缩放\n\n该动作用于制作节点的缩放动画。它使用节点的\
  \ `scale` 函数在指定的持续时间内缩放节点：\n\n```\n1   var action = new cc.ScaleTo(2, 0.5, 2);\n\
  2   var action = new cc.ScaleBy(2, 0.5, 2);\n```\n\n第一个参数是持续时间，第二和第三个参数分别是 sx、sy，即\
  \ `scaleX` 和 `scaleY` 的值。\n\n### 6.3.5 倾斜\n\n该动作类似于缩放，但它使用 `skewX` 和 `skewY` 的值来制作倾斜动画：\n\
  \n```\n1   var action = new cc.SkewTo(2, 37.2, -37.2);\n2   var action = new cc.SkewBy(2,\
  \ 37.2, -37.2);\n```\n\n参数与缩放动作相同。\n\n### 6.3.6 色调\n\n该动作用于制作节点 RGB 通道的动画。此动作仅有\
  \ `By` 版本：\n\n```\n1   var action = new cc.TintBy(2, -127, -255, -127);\n```\n\n\
  第一个参数是持续时间，接下来的三个参数分别是 `deltaR`、`deltaB` 和 `deltaG` 的值。\n\n### 6.3.7 贝塞尔曲线\n\n该动作用于让目标对象沿着贝塞尔曲线移动：\n\
  \n```\n1   var bezier = [cc.p(0, windowSize.height / 2), cc.p(300, -windowSize.height\
  \ / 2),\\\n2   cc.p(300, 100)];\n3   var bezierForward = new cc.BezierBy(3, bezier);\n\
  4   var bezierTo = new cc.BezierTo(3, bezier);\n```\n\n第一个参数是持续时间，第二个参数是一个数组，其中包含定义贝塞尔曲线的一系列点。\n\
  \n### 6.3.8 基数样条\n\n这与贝塞尔曲线类似。目标对象将沿着基数样条曲线移动。通常，当你想模拟精灵在路径数据（即一系列连续点）上移动时，会使用此动作。示例如下：\n\
  \n```\n1   var action = cc.cardinalSplineTo(3, array, 0);\n2   var action = cc.cardinalSplineTo(3,\
  \ array, 0);\n```\n\n参数与贝塞尔曲线相同；不过，它还有第三个参数，表示张力或两点之间的权重，并计算从一个点移动到另一个点的持续时间。\n\n\
  ## 6.4 缓动\n\n默认情况下，所有随时间线性改变节点属性的动作都称为线性插值。这样的动画看起来比较生硬。当你想要为动画添加更生动的效果时，就需要使用缓动函数。参见图\
  \ 6-1。\n\n![A435521_1_En_6_Fig1_HTML.jpg](img/A435521_1_En_6_Fig1_HTML.jpg)\n\n\
  图 6-1. 线性与缓动\n\n如图所示，第一张图是线性的，这是所有动作默认使用的模式。另外三张图则展示了不同的缓动函数。在 Cocos2d-js 中，共有超过\
  \ 26 种缓动类型。对于所有缓动函数，使用方法都是一样的。让我们看一个例子：\n\n```\n1   var easing=cc.easeBackIn();\n\
  2   //或者\n3   var easing=new cc.EaseBackIn();\n4   action.easing(easing);\n```\n\
  \n非常简单！在这个例子中，我使用了 `EaseBackIn` 类来创建缓动对象，或者你也可以使用单例 `cc.easeBackIn` 对象来作用于你的动作。我更喜欢前一种方式。让我们看看\
  \ Cocos2d-js 中可用的缓动函数列表。记住：所有缓动函数的使用方式相同。\n\n*   `cc.EaseBackIn`\n*   `cc.EaseBackInOut`\n\
  *   `cc.EaseBackOut`\n*   `cc.EaseBezierAction`\n*   `cc.EaseBounce`\n*   `cc.EaseBounceIn`\n\
  *   `cc.EaseBounceInOut`\n*   `cc.EaseBounceOut`\n*   `cc.EaseCircleActionIn`\n\
  *   `cc.EaseCircleActionInOut`\n*   `cc.EaseCircleActionOut`\n*   `cc.EaseCubicActionIn`\n\
  *   `cc.EaseCubicActionInOut`\n*   `cc.EaseCubicActionOut`\n*   `cc.EaseElastic`\n\
  *   `cc.EaseElasticIn`\n*   `cc.EaseElasticInOut`\n*   `cc.EaseElasticOut`\n*  \
  \ `cc.EaseExponentialIn`\n*   `cc.EaseExponentialInOut`\n*   `cc.EaseExponentialOut`\n\
  *   `cc.EaseQuadraticActionIn`\n*   `cc.EaseQuadraticActionInOut`\n*   `cc.EaseQuadraticActionOut`\n\
  *   `cc.EaseQuarticActionIn`\n*   `cc.EaseQuarticActionInOut`\n*   `cc.EaseQuarticActionOut`\n\
  *   `cc.EaseQuinticActionIn`\n*   `cc.EaseQuinticActionInOut`\n*   `cc.EaseQuinticActionOut`\n\
  *   `cc.EaseRateAction`\n*   `cc.EaseIn`\n*   `cc.EaseInOut`\n*   `cc.EaseOut`\n\
  *   `cc.EaseSineIn`\n*   `cc.EaseSineInOut`\n*   `cc.EaseSineOut`\n\n这个列表能满足你所有的缓动需求。所有这些缓动都派生自基类\
  \ `cc.ActionEase`。\n\n## 6.5 序列\n\n假设我有两个或更多的动作需要在一个节点上一个接一个地执行。`Sequence` 可以帮助我们实现这一点。让我们看一个例子：\n\
  \n```\n1   var seq = new cc.Sequence([action1,action2]);\n2   this.sprite.runAction(seq);\n\
  ```\n\n`cc.Sequence` 接受两种参数类型：一种是动作数组，另一种将在本节稍后讨论。它可以像其他任何动作一样，使用节点的 `runAction`\
  \ 函数来运行。\n\n### 6.5.1 反转序列\n\n一旦创建了 `sequence` 对象，它就可以被反转并在任何节点上运行，如下所示：\n\n```\n\
  1   this.sprite.runAction(seq.reverse());\n```\n\n`reverse` 函数会将 `sequence` 中的动作顺序反转，并返回一个新的\
  \ `sequence` 实例。\n\n### 6.5.2 重复序列\n\n一旦创建了 `sequence` 对象，我们可以将动作重复有限次数，也可以无限重复。示例如下：\n\
  \n```\n1   //重复序列 5 次\n2   this.sprite.runAction(seq.repeat(5));\n\n4   //永远重复序列\n\
  5   this.sprite.runAction(seq.repeatForever());\n```\n\n`sequence` 的 `repeat` 和\
  \ `repeatForever` 函数正是用于此目的。\n\n### 6.5.3 动作结束回调\n\n可以在 `sequence` 对象中为每个动作附加一个\
  \ `结束回调` 函数。让我们看一个例子：\n\n```\n1   var seq=new cc.Sequence(action1,cc.callFunc(function(){/*action1\
  \ 结束回调*/}\\\n2   ,this),\n3   action2,cc.callFunc(function(){/*action2 结束回调*/}\\\
  \n4   ,this));\n```\n\n如前所述，`Sequence` 接受两种参数类型。一种是动作数组，另一种是一系列的动作及其动作结束回调，就像刚刚看到的那样。\n\
  \n## 6.6 同步执行\n\n在某些情况下，你需要在一个节点上同时执行两个或更多的动作。`cc.Spawn` 就是为此目的而设计的：\n\n```\n1 \
  \  var spaw=new cc.Spawn([action1,action2]);\n2   this.sprite.runAction(spaw);\n\
  ```\n\n如你所见，其语法与 `Sequence` 类似。它接受一个动作数组，这些动作将被同时执行。请谨慎同时执行多个动作，如果使用不当，可能会产生奇怪的效果。\n\
  \n## 6.7 停止一个动作\n\n任何正在运行的动作都可以被停止。节点的 `stopAction` 函数正是用于此目的：\n\n```\n1   sprite.stopAction(action);\n\
  ```\n\n这会立即停止该动作，无论其状态如何。你可以将其用于用户交互或任何需要立即停止动作的动态触发器。\n\n## 6.8 精灵帧动画\n\n在第 3 章中，我们了解了如何使用精灵表进行精灵帧动画。那一章更侧重于精灵本身，而本节将从动画角度对此进行详细解释。精灵中的每一个图像部分都可以使用带有\
  \ `rect` 坐标的 `SpriteFrame` 进行分类。`cc.Animation` 类可用于在精灵上执行精灵帧动画序列。让我们看一个例子：\n\n```\n\
  1   var animation = new cc.Animation(spriteFrames, 0.08);\n2   this.sprite.runAction(cc.animate(animation).repeatForever());\
  \ //或者也可以使用 new cc.Animat\\\n3   ion(..) 模式。\n```\n\n第一个参数是 `cc.SpriteFrame` 实例的数组，第二个参数是延迟时间。与\
  \ `Action` 类一样，它也有 `repeat` 和 `repeatForever` 函数。\n\n\n\n### 6.9 调度器与更新\n\n在 Cocos2d-js\
  \ 中，存在一个更新循环，即主运行循环；每个 `cc.Node` 都能够接收更新通知，但节点必须订阅该通知。这种订阅机制在实现时考虑了性能因素。\n\n在 `cc.Node`\
  \ 的构造函数中，需要调用以下方法：\n\n```\nthis.scheduleUpdate();\n```\n\n完成此操作后，便可以在其中定义一个名为 `update`\
  \ 的方法：\n\n```\nupdate:function(dt) {\n\n}\n```\n\n现在，我们使用 `update` 来制作一个动画。首先，按照前面示例所述创建一个图层和演示场景，然后在场景中添加一个精灵：\n\
  \n```\nthis.sprite = new cc.Sprite(res.Sprite_Image);\nthis.sprite.attr({\n    x:\
  \ size.width / 2,\n    y: size.height / 2\n});\nthis.addChild(this.sprite, 0);\n\
  ```\n\n我们打算让这个精灵以乒乓运动的方式从左向右移动。为此，我们需要一个 `seed` 值：\n\n```\nthis.seed=10;\n```\n\n\
  接着，定义我们的 `update` 方法并让精灵动起来：\n\n```\nupdate:function(dt) {\n  if(this.sprite.getPositionX()>cc.winSize.width){\n\
  \    this.seed=-10;\n  } else if(this.sprite.getPositionX()<0) {\n    this.seed=10;\n\
  \  }\n  this.sprite.setPositionX(this.sprite.getPositionX()+this.seed);\n}\n```\n\
  \n至此，完整的代码应如下所示：\n\n```\nvar SchedulersLayer = BaseSampleLayer.extend({\n    sprite:null,\n\
  \    ctor:function () {\n        this._super();\n        var size = cc.winSize;\n\
  \        this.sprite = new cc.Sprite(res.Sprite_Image);\n        this.sprite.attr({\n\
  \            x: size.width / 2,\n            y: size.height / 2\n        });\n \
  \       this.seed=10;\n        this.addChild(this.sprite, 0);\n        this.scheduleUpdate();\n\
  \    },\n    update:function(dt) {\n      if(this.sprite.getPositionX()>cc.winSize.width){\n\
  \        this.seed=-10;\n      } else if(this.sprite.getPositionX()<0) {\n     \
  \   this.seed=10;\n      }\n      this.sprite.setPositionX(this.sprite.getPositionX()+this.seed);\n\
  \    }\n});\n```\n\n输出效果应为一个精灵左右来回重复移动。详见图 6-2。\n\n![A435521_1_En_6_Fig2_HTML.jpg](img/A435521_1_En_6_Fig2_HTML.jpg)\n\
  \n图 6-2. 调度器与更新\n\n"
- "# 7. 为你的游戏添加物理效果\n\n## 7.1 简介\n\n在基于物理的游戏中，模拟真实世界的物理效果非常重要。如今市面上有多种物理引擎。对于 Cocos2d-js\
  \ 来说，最流行的当属 Chipmunk 物理引擎。该引擎最初用 C 语言编写，后来被移植到各种平台。尽管你可以将其他游戏引擎与 Cocos2d-js 配合使用，但我们强烈推荐\
  \ Chipmunk 引擎。它是 Cocos2d-x 的原生物理引擎。\n\n## 7.2 Chipmunk 概述\n\n物理学的核心在于以正确的方式改变精灵的\
  \ x、y 坐标和旋转角度，使其看起来像物理模拟。你的游戏世界与物理空间之间有着明确的分离。详见图 7-1。\n\n![A435521_1_En_7_Fig1_HTML.jpg](img/A435521_1_En_7_Fig1_HTML.jpg)\n\
  \n图 7-1. Cocos2d-js 与 Chipmunk 的关系\n\n所有物理主体及其行为都在 Chipmunk 空间中定义，而来自 Cocos2d-js\
  \ 图层的精灵则映射到这些主体。物理模拟将在 Chipmunk 空间内基于与对应精灵的关系映射进行。Chipmunk 会根据物理空间中的主体来更新这些精灵的 x、y\
  \ 坐标和旋转角度。让我们在图 7-2 中了解基础知识。\n\n![A435521_1_En_7_Fig2_HTML.jpg](img/A435521_1_En_7_Fig2_HTML.jpg)\n\
  \n图 7-2. Chipmunk 概述\n\n物理模拟在 Chipmunk 空间内部进行，物理主体在此被赋予物理属性；这些主体将拥有定义的形状，可以是盒子、圆形或多边形。每个\
  \ Chipmunk 空间都会有一个默认的 `staticBody` 作为其子对象，添加到该默认主体上的形状不会受物理属性影响，是静态物体，例如墙壁或障碍物等。所有主体都将与\
  \ `PhysicsSprite` 关联，`PhysicsSprite` 包含你的精灵图像，该精灵的位置和旋转将由与之关联的物理主体决定。在接下来的示例中，我们将创建一个\
  \ Chipmunk 空间，为四个边界添加墙壁，并向空间中添加两个主体（一个盒子和一个圆形）。然后，我们将观察模拟效果。\n\n## 7.3 Chipmunk\
  \ 空间\n\n首先，你需要在你的 `project.json` 文件中包含 Chipmunk 模块：\n\n```\n\"modules\" : [\"cocos2d\"\
  ,....,\"chipmunk\"]\n```\n\n让我们看看如何创建这个空间：\n\n```\ninitPhysics:function() {\n  \
  \  //初始化空间\n    this.space = new cp.Space();\n\n    //设置重力\n    this.space.gravity\
  \ = cp.v(0, -800); //地球重力\n    this.space.iterations = 30;\n    this.space.sleepTimeThreshold\
  \ = Infinity;\n    this.space.collisionSlop = Infinity;\n}\n```\n\n这个 `initPhysics`\
  \ 函数将被放置在 `layer` 对象内部；也就是说，`initPhysics` 将是 `layer` 对象的属性之一。`cp.Space` 类用于创建空间，同时设置\
  \ `gravity`、`iterations`、`sleepTimeThreshold` 和 `collisionSlop` 为合适的值。\n\n```\n\
  update:function (dt) {\n    this.space.step(dt);\n},\n```\n\n物理模拟由 `step` 方法驱动，该方法在\
  \ `layer` 的 `update` 循环中持续被触发。\n\n## 7.4 Chipmunk 主体\n\n物理对象由主体定义；主体具有形状，并与精灵数据相关联。现在，让我们向已创建的\
  \ Chipmunk 空间添加一个圆形和一个盒子：\n\n```\naddPhysicsCircle: function() {\n    var width=50,height=50,mass=1;\n\
  \n    this.phBodyCircle = this.space.addBody(new cp.Body(mass, cp.momentForCircle(mass,0,width*0.5,cc.p(0,0))));\n\
  \    this.phBodyCircle.setPos(cc.p(cc.winSize.width * 0.5, cc.winSize.height * 0.3));\n\
  \n    //#4\n    var phShape = this.space.addShape(new cp.CircleShape(this.phBodyCircle,\
  \ width, cc.p(0, 0)));\n    phShape.setFriction(0);\n    phShape.setElasticity(1);\n\
  \    phShape.setCollisionType(0);\n},\n\naddPhysicsBox: function() {\n    var width=50,height=50,mass=1;\n\
  \    this.phBodyBox = this.space.addBody(new cp.Body(mass, cp.momentForBox(mass,\
  \ width,height)));\n    this.phBodyBox.setPos(cc.p(cc.winSize.width * 0.5, cc.winSize.height\
  \ * 0.1));\n\n    //#4\n    var phShape = this.space.addShape(new cp.BoxShape(this.phBodyBox,\
  \ width, height));\n    phShape.setFriction(0);\n    phShape.setElasticity(1);\n\
  \    phShape.setCollisionType(1);\n}\n```\n\n如你所见，圆形和盒子主体是通过 `cp.Body` 并传入 `mass`\
  \ 和 `momentum` 对象创建的，并且使用 `cp.CircleShape` 和 `cp.BoxShape` 为每个主体定义了形状。这实际上在物理模拟中扮演着重要角色，基于碰撞的物理运动正是依赖于这些形状对象。\n\
  \n\n\n### 7.5 Chipmunk 静态刚体\n\nChipmunk 空间会包含一个单独的静态刚体。通常，这个 `staticBody` 用于定义物理边界和静态形状，例如墙壁。\n\
  \n```\n1   addWallsAndGround: function() {\n2          var leftWall = new cp.SegmentShape(this.space.staticBody,\
  \ new cp.v(0, 0),\\\n3    new cp.v(0, 1000000), WALLS_WIDTH);\n4          leftWall.setElasticity(WALLS_ELASTICITY);\n\
  5          leftWall.setFriction(WALLS_FRICTION);\n6          this.space.addStaticShape(leftWall);\n\
  \n8          var rightWall = new cp.SegmentShape(this.space.staticBody, new cp.v(cc.wi\\\
  \n9   nSize.width, 1000000), new cp.v(cc.winSize.width, 0), WALLS_WIDTH);\n10  \
  \        rightWall.setElasticity(WALLS_ELASTICITY);\n11          rightWall.setFriction(WALLS_FRICTION);\n\
  12          this.space.addStaticShape(rightWall);\n\n14          var bottomWall\
  \ = new cp.SegmentShape(this.space.staticBody, new cp.v(0, 0\\\n15  ), new cp.v(cc.winSize.width,\
  \ 0), WALLS_WIDTH);\n16          bottomWall.setElasticity(WALLS_ELASTICITY);\n17\
  \          bottomWall.setFriction(WALLS_FRICTION);\n18          this.space.addStaticShape(bottomWall);\n\
  \n20          var upperWall = new cp.SegmentShape(this.space.staticBody, new cp.v(0,\
  \ cc\\\n21  .winSize.height), new cp.v(cc.winSize.width, cc.winSize.height), WALLS_WIDTH);\n\
  22          upperWall.setElasticity(WALLS_ELASTICITY);\n23          upperWall.setFriction(WALLS_FRICTION);\n\
  24          this.space.addStaticShape(upperWall);\n25   }\n```\n\n为了创建边界，Chipmunk\
  \ 提供了 `cp.SegmentShape`，用于创建顶部、底部、左侧和右侧的墙壁，这些墙壁会被添加到空间的默认静态刚体上，这样重力和其它力就不会影响这个形状。\n\
  \n### 7.6 物理调试节点\n\n一个物理刚体由包含多边形数据的形状组成。你必须将一个 `PhysicsSprite` 附加到刚体上，才能看到物理刚体的运动；如果没有这样做，你可以通过一个名为\
  \ `PhysicsDebugNode` 的对象，将其添加到层中，以便在没有精灵的情况下看到多边形。在前面的方形和圆形例子中，`PhysicsSprite` 没有被添加，因此我们将依赖\
  \ `PhysicsDebugNode`：\n\n```\n1   setupDebugNode : function()\n2   {\n3        \
  \   this._debugNode = new cc.PhysicsDebugNode(this.space);\n4           this.addChild(\
  \ this._debugNode );\n5   }\n```\n\n现在，无需添加 `PhysicsSprite`，圆形和方形的多边形数据就会在屏幕上可见。\n\
  \n### 7.7 碰撞检测\n\nChipmunk 能够检测物理刚体之间的碰撞。每个物理刚体都必须用 `setCollisionType` 进行标记，这样它才能在碰撞检测中被识别：\n\
  \n```\n1   addCollisionCallBack:function(){\n2           // 0 和 1 是方形和圆形的标记\n3 \
  \          this.space.addCollisionHandler(0, 1, function(){\n4               cc.log('方形和圆形发生碰撞！');\n\
  5               return true;\n6           }, null, null, null);\n7   }\n```\n\n\
  如你所见，`addCollisionHandler` 函数使用了方形和圆形的标记 0 和 1，用于检测这两个物体之间的任何碰撞。\n\n### 7.8 整合所有内容\n\
