- "# 3. 深入了解精灵\n\n## 3.1 简介\n\n精灵是任何**2D**游戏中最核心的部分。在开发**2D**游戏时，您会经常处理这个实体。在`Cocos2d-js`中，这个实体由一个名为`cc.Sprite`的类定义。在本节中，我们将详细探讨这个类，包括它的组织方式、使用方法、如何实现帧动画等。那么，让我们开始吧。\n\
  \n## 3.2 Sprite 类\n\n在`Cocos2d-js`中，`cc.Sprite`类用于定义游戏中的精灵。该类可以使用图像文件名、初始旋转变换等进行初始化。之后，您可以根据游戏逻辑动态更新其\
  \ **x,y** 位置。让我们看一下图 3-1 中这个类的组织方式。\n\n![A435521_1_En_3_Fig1_HTML.jpg](img/A435521_1_En_3_Fig1_HTML.jpg)\n\
  \n图 3-1. Sprite 类\n\n当您观察一个精灵时，它有两个主要部分。一个是纹理，代表图像；另一个是精灵帧，代表纹理图像中当前显示精灵的`rect`（矩形区域）。纹理由\
  \ `cc.Texture` 表示，精灵帧由 `cc.SpriteFrame` 表示。让我们看几个示例。\n\n## 3.3 单一图像精灵\n\n在 `src`\
  \ 文件夹中，创建一个名为 `spriteimage.js` 的文件，并复制粘贴以下代码：\n\n```\n1   var SpriteImageLayer =\
  \ cc.Layer.extend({\n2       sprite:null,\n3       ctor:function () {\n4       \
  \     this._super();\n\n6            var size = cc.winSize;\n\n8            this.sprite\
  \ = new cc.Sprite(res.Sprite_Image);\n9            this.sprite.attr({\n10      \
  \           x: size.width / 2,\n11                 y: size.height / 2\n12      \
  \      });\n13            this.addChild(this.sprite, 0);\n14            return true;\n\
  15       }\n16   });\n```\n\n在 `project.json` 中包含这个新文件，并在 `app.js` 中，将场景中现有的 `layer`\
  \ 实例替换为 `SpriteImageLayer`。\n\n```\n1   var HelloWorldScene = cc.Scene.extend({\n\
  2       onEnter:function () {\n3           this._super();\n4           //将当前层替换为\
  \ SpriteImageLayer。\n5           var layer = new SpriteImageLayer();\n6        \
  \   this.addChild(layer);\n7       }\n8   });\n```\n\n在 `resources.js` 中，需要包含 `Sprite_Image`\
  \ 属性；您可以使用自己选择的图像。\n\n```\n1   var res = {\n2       .......\n\n4       Sprite_Image:\"\
  res/sprite_image.png\"\n5   };\n```\n\n我将使用图 3-2 中看到的图像。\n\n![A435521_1_En_3_Fig2_HTML.jpg](img/A435521_1_En_3_Fig2_HTML.jpg)\n\
  \n图 3-2. `sprite_image.png`\n\n请记住这些运行单独层的步骤，因为我们将为每个示例创建单独的层，并且在后续示例中这些步骤将不再重复。\n\
  \n如您所见，精灵已经用一个单一图像初始化：\n\n```\n1   this.sprite = new cc.Sprite(res.Sprite_Image);\n\
  ```\n\n此构造函数将使用 `res.Sprite_Image` 创建一个 `cc.Texture` 实例，并且 `cc.SpriteFrame` 将默认初始化为\
  \ `rect(0,0,spriteWidth,spriteHeight)` 以显示完整的图像。因此，输出将如图 3-3 所示。\n\n![A435521_1_En_3_Fig3_HTML.jpg](img/A435521_1_En_3_Fig3_HTML.jpg)\n\
  \n图 3-3. 带单一图像的精灵\n\n### 3.3.1 FPS 显示\n\n左下角的显示称为 **FPS** 显示，它有三个值：\n\n*   绘制调用数\n\
  *   增量时间\n*   帧率\n\n您可以使用 `project.json` 中的 `showFPS` 标记来控制 **FPS** 显示的可见性。\n\n\
  #### 3.3.1.1 绘制调用\n\n渲染发生在绘制调用中，场景中的每个节点都有一个关联的绘制调用。随着绘制调用数的增加，增量时间和帧率会下降，这与游戏的性能直接相关。\n\
  \n#### 3.3.1.2 增量时间\n\n前一帧完成渲染所花费的时间。\n\n#### 3.3.1.3 帧率\n\n表示每秒渲染的帧数。\n\n\n\n###\
  \ 3.4 使用精灵表的精灵\n\n为减少内存占用，应将所有资源打包到一张精灵表中，并在整个游戏过程中使用该精灵表。对于单个精灵而言，`cc.SpriteFrame`\
  \ 实例将定义需要显示在 `cc.Sprite` 实例显示帧中的精灵表部分。我将使用图 3-4 中所示的精灵表进行下一个示例。\n\n![A435521_1_En_3_Fig4_HTML.jpg](img/A435521_1_En_3_Fig4_HTML.jpg)\n\
  \n图 3-4. `sprite_sheet.png`\n\n在 `src` 目录下，创建一个名为 `spritesheet.js` 的文件，并将以下代码复制进去：\n\
  \n```\n1   var SpriteSheetLayer = cc.Layer.extend({\n2       sprite:null,\n3   \
  \    ctor:function () {\n5           this._super();\n7           var size = cc.winSize;\n\
  9           this.sprite = new cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,67,94));\n\
  10          this.sprite.attr({\n11              x: size.width / 2,\n12         \
  \     y: size.height / 2\n13          });\n14          this.addChild(this.sprite,\
  \ 0);\n16          return true;\n17      }\n18  });\n```\n\n按照上一个示例的步骤，将 `SpriteSheetLayer`\
  \ 包含到 `HelloWorldScene` 中。在 `resource.js` 文件中，创建一个 `Sprite_Sheet` 变量并指定精灵表的文件名。\n\
  \n如您所见，精灵使用精灵表作为纹理进行初始化，并通过 `rect` 设置需要显示的当前帧。参见图 3-5。\n\n![A435521_1_En_3_Fig5_HTML.jpg](img/A435521_1_En_3_Fig5_HTML.jpg)\n\
  \n图 3-5. 使用精灵表的精灵\n\n`rect` 坐标对应精灵表中第一行的最后一张图像。\n\n### 3.5 精灵帧动画\n\n如前所述，`cc.SpriteFrame`\
  \ 负责在 `cc.Sprite` 中显示当前图像。这个精灵帧可以在任意时刻更改，这使我们能够创建基于帧的动画。让我们看一个示例。我将在此示例中使用同一张精灵表。\n\
  \n在 `src` 目录下，创建一个名为 `spriteanimation.js` 的文件，并将以下代码复制进去：\n\n```\n1   var SpriteAnimationLayer\
  \ = cc.Layer.extend({\n2       sprite:null,\n3       ctor:function () {\n4     \
  \      //////////////////////////////\n5          // 1\\. super init first\n6  \
  \        this._super();\n8          var size = cc.winSize;\n9          //FrameData\n\
  10          var walk01 = cc.rect(0,0,72,97);\n11          var walk02 = cc.rect(73,0,72,97);\n\
  12          var walk03 = cc.rect(146,0,72,97);\n13          var walk04 = cc.rect(0,98,72,97);\n\
  14          var walk05 = cc.rect(73,98,72,97);\n15          var walk06 = cc.rect(146,98,72,97);\n\
  16          var walk07 = cc.rect(219,0,72,97);\n17          var walk08 = cc.rect(292,0,72,97);\n\
  18          var walk09 = cc.rect(219,98,72,97);\n19          var walk10 = cc.rect(365,0,72,97);\n\
  20          var walk11 = cc.rect(292,98,72,97);\n22          var frameDatas=[walk01,walk02,walk03,walk04,walk05,\n\
  23          walk06,walk07,walk08,walk09,walk10,walk11];\n24          var texture\
  \ = cc.textureCache.addImage(res.Sprite_Sheet);\n26          //Create SpriteFrame\
  \ and AnimationFrame with Frame Data\n27          var animFrames=[];\n28       \
  \   for(var index in frameDatas)\n29          {\n30               var spriteFrame\
  \ = new cc.SpriteFrame(texture, frameDatas[index]);\n31               var animFrame\
  \ = new cc.AnimationFrame();\n32               animFrame.initWithSpriteFrame(spriteFrame,\
  \ 1, null);\n33               animFrames.push(animFrame);\n34          }\n36   \
  \       //Create an empty sprite\n37          this.sprite = new cc.Sprite();\n38\
  \          this.sprite.attr({\n39               x: size.width / 2,\n40         \
  \      y: size.height / 2\n41          });\n43          this.addChild(this.sprite,\
  \ 0);\n45          var animation = cc.Animation.create(animFrames, 0.08);\n46  \
  \        var animate = cc.Animate.create(animation);\n48          //Animate the\
  \ sprite frame on the empty sprite\n49          this.sprite.runAction(animate.repeatForever());\n\
  51          return true;\n52       }\n53   });\n```\n\n帧动画背后的思路是，我们将在特定的时间间隔内逐帧播放，使其看起来像一个动画序列。在上述代码中，`walk01`\
  \ 到 `walk11` 表示精灵表中的各帧，使用 `rects` 定义。如果我们将这些帧组合并依次播放，就会看起来像一个行走动画。\n\n`SpriteFrame`\
  \ 实例使用该帧 `rect` 数组创建（参见图 3-6）：\n\n![A435521_1_En_3_Fig6_HTML.jpg](img/A435521_1_En_3_Fig6_HTML.jpg)\n\
  \n图 3-6. `SpriteFrame`\n\n```\n1   var texture = cc.textureCache.addImage(res.Sprite_Sheet);\n\
  2   var animFrames=[];\n3   for(var index in frameDatas)\n4   {\n5       var spriteFrame\
  \ = new cc.SpriteFrame(texture, frameDatas[index]);\n6       var animFrame = new\
  \ cc.AnimationFrame();\n7       animFrame.initWithSpriteFrame(spriteFrame, 1, null);\n\
  8       animFrames.push(animFrame);\n9   }\n```\n\n在这个示例中，我们手动创建 `cc.SpriteFrame`\
  \ 实例，因此需要一个精灵表的 `texture` 实例。于是我们将精灵表添加到纹理缓存中，该操作会返回 `texture` 实例，可用于创建所有精灵帧。\n\n\
  最后，用于执行动画的 `cc.Animation` 实例通过 `cc.AnimationFrame` 的图像列表创建，时间间隔设置为 0.08 秒。\n\n输出结果将是一个流畅的行走动画。\n\
  \n在上述案例中，为了完整理解帧动画，我们手动创建了帧数据，但在实际开发中，精灵表往往是通过像 TexturePack 这样的工具从单个图像生成，同时还会创建关联的数据文件。在\
  \ Cocos2d 中，这是一个包含与精灵表相关的所有帧数据的 PList 文件。在下一个示例中，我们将看到如何使用 PList 创建帧动画。\n\n\n\n\
  ### 3.6 使用 PList 数据的精灵帧动画\n\n我们使用`TexturePack`从一个单独的图像创建了相同的精灵表，并生成了`PList`文件。参见图\
  \ 3-7。\n\n![A435521_1_En_3_Fig7_HTML.jpg](img/A435521_1_En_3_Fig7_HTML.jpg)\n\n\
  图 3-7. `TexturePack` 生成的精灵表\n\n在生成`PList`时，请确保选择了`Cocos2d`作为数据格式。图 3-8 显示了生成的纹理。\n\
  \n![A435521_1_En_3_Fig8_HTML.jpg](img/A435521_1_En_3_Fig8_HTML.jpg)\n\n图 3-8. 来自`TexturePack`的精灵表\n\
  \n你可以在示例项目`res`文件夹中查看`PList`数据文件，该示例项目位于 [`https://github.com/nutcrackify/Rapid_-Game_Development_Using_Cocos2d-js`](https://github.com/nutcrackify/Rapid_-Game_Development_Using_Cocos2d-js)。\n\
  \n在`src`中，创建一个名为`plistanimation.js`的文件，并将以下代码复制到其中：\n\n```\n1   var PListAnimationLayer\
  \ = cc.Layer.extend({\n2       sprite:null,\n3       ctor:function () {\n\n5   \
  \        this._super();\n\n7           var size = cc.winSize;\n\n9           cc.spriteFrameCache.addSpriteFrames(res.Sprite_Sheet1_P,\
  \ res.Sprite_Shee\\\n10           t1);\n11           //使用帧数据创建 SpriteFrame 和 AnimationFrame\n\
  12           var animFrames=[];\n13           for(var i=1;i<12;i++)\n14        \
  \   {\n15                var str = \"p1_walk\" + (i < 10 ? (\"0\" + i) : i) + \"\
  .png\";\n16                var spriteFrame=cc.spriteFrameCache.getSpriteFrame(str);\n\
  17                animFrames.push(spriteFrame);\n18           }\n\n20          \
  \ //创建一个空的精灵\n21           this.sprite = new cc.Sprite();\n22           this.sprite.attr({\n\
  23                x: size.width / 2,\n24                y: size.height / 2\n25 \
  \          });\n\n27           this.addChild(this.sprite, 0);\n\n29           var\
  \ animation = new cc.Animation(animFrames, 0.08);\n30           this.sprite.runAction(cc.animate(animation).repeatForever());\n\
  \n32           return true;\n33       }\n34   });\n```\n\n在`resource.js`中，使用变量`Sprite_Sheet1_P`和`Sprite_Sheet1`包含`PList`和精灵表文件；两者都已添加到帧缓存中，如下所示：\n\
  \n```\n1   cc.spriteFrameCache.addSpriteFrames(res.Sprite_Sheet1_P, res.Sprite_Sheet1);\n\
  ```\n\n基于`PList`数据和精灵表，可以使用`getSpriteFrame`函数创建精灵帧，如下所示：\n\n```\n1   var animFrames=[];\n\
  2   for(var i=1;i<12;i++)\n3   {\n4       var str = \"p1_walk\" + (i < 10 ? (\"\
  0\" + i) : i) + \".png\";\n5       var spriteFrame=cc.spriteFrameCache.getSpriteFrame(str);\n\
  6       animFrames.push(spriteFrame);\n7   }\n```\n\n现在我们有了精灵帧列表，可以使用`cc.Animation`类来制作动画：\n\
  \n```\n1   var animation = new cc.Animation(animFrames, 0.08);\n2   this.sprite.runAction(cc.animate(animation).repeatForever());\n\
  ```\n\n这与我们之前使用原始帧数据（不带`PList`）所做的行走动画是相同的。\n\n### 3.7 带有精灵的 TextureCache\n\n纹理缓存是精灵构建的重要组成部分，用于在内存中缓存纹理数据，以便再次引用相同纹理时，可以从缓存中加载。这可以提高游戏的整体性能和内存优化。参见图\
  \ 3-9。\n\n![A435521_1_En_3_Fig9_HTML.jpg](img/A435521_1_En_3_Fig9_HTML.jpg)\n\n\
  图 3-9. 纹理缓存精灵\n\n每当你使用图像文件创建一个精灵时，该图像文件会在内部被加载到`TextureCache`中，并且会使用`TextureCache`中的数据创建一个`Texture2D`实例。在前面的代码示例中，你看到了我们如何将精灵表加载到纹理缓存中，并使用它来创建`SpriteFrame`实例。参见图\
  \ 3-10。\n\n![A435521_1_En_3_Fig10_HTML.jpg](img/A435521_1_En_3_Fig10_HTML.jpg)\n\
  \n图 3-10. 使用`PNG`的精灵\n\n上图表示使用单个`png`文件的精灵。一旦纹理从资源加载器返回，它就会被缓存到纹理缓存中，然后从缓存数据创建`Texture2D`实例，并被`cc.Sprite`使用。这是`cc.Sprite`的内部实现。\n\
  \n### 3.8 带有精灵的 SpriteFrameCache\n\n与`TextureCache`类似，`SpriteFrameCache`用于缓存被`cc.Sprite`使用的`SpriteFrame`。如果你有一个精灵表，单个的`SpriteFrames`可以被缓存在`SpriteFrameCache`中，并在以后需要时使用。前面的代码示例和图\
  \ 3-11 已经说明了这一点。\n\n![A435521_1_En_3_Fig11_HTML.jpg](img/A435521_1_En_3_Fig11_HTML.jpg)\n\
  \n图 3-11. `SpriteFrameCache`共享`SpriteFrame`\n\n### 3.9 精灵批处理\n\n精灵批处理是一种技术，它通过单次绘制调用来合并多个精灵的渲染，前提是所涉及的精灵使用相同的纹理或纹理表。\n\
  \n\n\n### 3.9.1 SpriteBatchNode\n\n`cc.SpriteBatchNode` 是一种精灵类，用于将多个精灵合并到一次绘制调用中。让我们看一个例子。\n\
  \n首先，我们使用相同的精灵表（sprite sheet）和不同的 `SpriteFrame` 矩形创建四个独立的精灵：\n\n```\n1   this.sprite1\
  \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,67,94));\n2   this.sprite1.attr({\n\
  3       x: size.width / 2,\n4       y: size.height / 1.5\n5   });\n\n7   this.sprite2\
  \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(73,0,72,97));\n8   this.sprite2.attr({\n\
  9       x: size.width / 2,\n10      y: size.height / 2\n11  });\n\n13  this.sprite3\
  \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(219,0,72,97));\n14  this.sprite3.attr({\n\
  15      x: size.width / 2,\n16      y: size.height / 3\n17  });\n\n19  this.sprite4\
  \ = new cc.Sprite(res.Sprite_Sheet,cc.rect(365,0,72,97));\n20  this.sprite4.attr({\n\
  21      x: size.width / 2,\n22      y: size.height / 5\n23  });\n```\n\n现在，我们使用相同的精灵表创建一个\
  \ `SpriteBatchNode` 实例：\n\n```\n1   this.spritebatch=new cc.SpriteBatchNode(res.Sprite_Sheet);\n\
  ```\n\n让我们将精灵添加到 `SpriteBatchNode` 中：\n\n```\n1   this.spritebatch.addChild(this.sprite1,\
  \ 0);\n2   this.spritebatch.addChild(this.sprite2, 0);\n3   this.spritebatch.addChild(this.sprite3,\
  \ 0);\n4   this.spritebatch.addChild(this.sprite4, 0);\n```\n\n最后，将 `spritebatch`\
  \ 添加到层（layer）中：\n\n```\n1   this.addChild(this.spritebatch);\n```\n\n现在，完整的代码应该如下所示：\n\
  \n```\n1   var SpriteBatchLayer = BaseSampleLayer.extend({\n2       sprite:null,\n\
  3       ctor:function () {\n\n5           this._super();\n\n7           var size\
  \ = cc.winSize;\n\n9           this.sprite1 = new cc.Sprite(res.Sprite_Sheet,cc.rect(438,93,67,94));\n\
  10          this.sprite1.attr({\n11              x: size.width / 2,\n12        \
  \      y: size.height / 1.5\n13          });\n\n15          this.sprite2 = new cc.Sprite(res.Sprite_Sheet,cc.rect(73,0,72,97));\n\
  16          this.sprite2.attr({\n17              x: size.width / 2,\n18        \
  \      y: size.height / 2\n19          });\n\n21          this.sprite3 = new cc.Sprite(res.Sprite_Sheet,cc.rect(219,0,72,97));\n\
  22          this.sprite3.attr({\n23              x: size.width / 2,\n24        \
  \      y: size.height / 3\n25          });\n\n27          this.sprite4 = new cc.Sprite(res.Sprite_Sheet,cc.rect(365,0,72,97));\n\
  28          this.sprite4.attr({\n29              x: size.width / 2,\n30        \
  \      y: size.height / 5\n31          });\n32          this.spritebatch=new cc.SpriteBatchNode(res.Sprite_Sheet);\n\
  \n34          this.spritebatch.addChild(this.sprite1, 0);\n35          this.spritebatch.addChild(this.sprite2,\
  \ 0);\n36          this.spritebatch.addChild(this.sprite3, 0);\n37          this.spritebatch.addChild(this.sprite4,\
  \ 0);\n\n39          this.addChild(this.spritebatch);\n\n41          return true;\n\
  42      }\n43  });\n```\n\n请注意，归属于同一个 `SpriteBatchNode` 的所有精灵必须使用相同的 `texture` 实例；同时，`SpriteBatchNode`\
  \ 必须包含对该相同纹理的引用。否则，Cocos2d-js 将无法渲染该 `SpriteBatchNode`。\n\n最终输出效果将如图 3-12 所示。\n\n\
  ![A435521_1_En_3_Fig12_HTML.jpg](img/A435521_1_En_3_Fig12_HTML.jpg)\n\n图 3-12. SpriteBatchNode\
  \ 渲染效果\n\n然而，原生渲染器支持自动合批（auto batching），这意味着如果你要部署到原生平台，精灵合批功能会自动实现，无需使用 `SpriteBatchNode`。\n\
  \n## 3.10 分辨率策略\n\n分辨率策略用于让你的游戏适应不同的屏幕分辨率和配置。Cocos2d-js 提供了一系列分辨率策略来实现游戏的适配。如果没有这些策略，你必须根据屏幕分辨率手动缩放游戏内容。\n\
  \n分辨率策略分为两种：预定义策略和自定义策略。预定义策略由 Cocos2d-js 提供，由容器策略和内容策略的不同组合构成；这些策略同样支持在原生部署中使用。使用自定义策略，你可以通过组合可用的容器和内容策略来定义自己的分辨率策略，但自定义策略仅在\
  \ Web 部署中支持。让我们来看一下。\n\n### 3.10.1 术语\n\n为了完全理解分辨率策略，你需要了解一些术语。你可能已经知道，你的游戏是托管在基于\
  \ Web 的 Cocos2d-js 游戏中的一个 Canvas（画布）中。见图 3-13。\n\n![A435521_1_En_3_Fig13_HTML.jpg](img/A435521_1_En_3_Fig13_HTML.jpg)\n\
  \n图 3-13. 分辨率策略中使用的术语\n\n#### 3.10.1.1 框架 (Frame)\n\n这表示 Canvas 外部的容器，如果你使用 Cocos\
  \ 控制台生成的默认 `index.html`，它通常是一个 `body` 元素。\n\n#### 3.10.1.2 容器 (Container)\n\nCocos2d-js\
  \ 将你的 Canvas 包装在一个 `div` 元素中，然后这个包装后的内容又被添加到 `canvas` 的原始容器元素中。\n\n#### 3.10.1.3\
  \ 内容 (Content)\n\n`canvas` 内部不属于 `dom` 的所有内容。\n\n#### 3.10.1.4 视口 (Viewport)\n\n\
  `Viewport` 表示 canvas 的世界坐标系矩形；它是 canvas 的像素坐标。\n\n#### 3.10.1.5 信箱模式 (Letter Boxing)\n\
  \n当容器的宽度与框架匹配但高度不匹配时，就会出现信箱模式（图 3-14）。如果宽高比与框架不匹配，就会发生这种情况，这也取决于你使用的分辨率策略。\n\n![A435521_1_En_3_Fig14_HTML.jpg](img/A435521_1_En_3_Fig14_HTML.jpg)\n\
  \n图 3-14. 信箱模式\n\n#### 3.10.1.6 柱箱模式 (Pillar Boxing)\n\n当容器的高度与框架的高度匹配但宽度不匹配时，就会出现柱箱模式（见图\
  \ 3-15）。出现这种情况的原因与信箱模式相同。\n\n![A435521_1_En_3_Fig15_HTML.jpg](img/A435521_1_En_3_Fig15_HTML.jpg)\n\
  \n图 3-15. 柱箱模式\n\n### 3.10.2 预定义分辨率策略\n\nCocos2d-js 提供了五种预定义策略，我们现在来讨论它们。\n\n####\
  \ 3.10.2.1 SHOW_ALL (全部显示)\n\n此策略会将容器缩放到容器边界内的最大尺寸；当前场景中的所有内容都将可见。\n\n#### 3.10.2.2\
  \ NO_BORDER (无边框)\n\n此策略会将容器缩放以填满框架，这样框架内将没有可见区域，同时保持所提供的宽度和高度比例。\n\n#### 3.10.2.3\
  \ EXACT_FIT (精确适配)\n\n此策略会将容器缩放以适配框架。请注意，所提供的宽度和高度比例将无法保持。\n\n#### 3.10.2.4 FIXED_WIDTH\
  \ (固定宽度)\n\n此策略会将容器的宽度缩放到与框架宽度匹配，并将高度缩放到与宽高比匹配。如果宽高比不匹配，你可能会看到信箱模式。\n\n#### 3.10.2.5\
  \ FIXED_HEIGHT (固定高度)\n\n此策略会将容器的高度缩放到与框架高度匹配，并将宽度缩放到与宽高比匹配。如果宽高比不匹配，你可能会看到柱箱模式。\n\
  \n### 3.10.3 如何使用\n\n在 `main.js` 文件中，有一个 `cc.game.onStart` 回调函数。你需要使用以下代码行来设置分辨率配置文件：\n\
  \n```\n1   cc.view.setDesignResolutionSize(320, 480, cc.RESOLUTION_POLICY.SHOW_ALL);\n\
  ```\n\n前两个参数是宽度和高度，即你游戏的宽高比，第三个参数是分辨率策略。\n\n\n\n### 3.10.4 自定义分辨率策略\n\n如我们之前所见，预定义的策略是容器策略与内容策略的组合。例如，`SHOW_ALL`\
  \ 策略就是`PROPORTION_TO_FRAME` 和 `SHOW_ALL`的组合，具体如下：\n\n```\ncc.RESOLUTION_POLICY.SHOW_ALL\
  \ = new cc.ResolutionPolicy(cc.ContainerStrategy.PROPORTION_TO_FRAME, cc.ContentStrategy.SHOW_ALL);\n\
  ```\n\n这就是 `SHOW_ALL` 的内部实现。你可以通过组合预定义的容器策略和内容策略来定义自己的策略。\n\n### 3.10.5 预定义容器策略\n\
  \n- `cc.ContainerStrategy.EQUAL_TO_FRAME`\n- `cc.ContainerStrategy.PROPORTION_TO_FRAME`\n\
  - `cc.ContainerStrategy.ORIGINAL_CONTAINER`\n\n### 3.10.6 预定义内容策略\n\n- `cc.ContentStrategy.SHOW_ALL`\n\
  - `cc.ContentStrategy.NO_BORDER`\n- `cc.ContentStrategy.EXACT_FIT`\n- `cc.ContentStrategy.FIXED_WIDTH`\n\
  - `cc.ContentStrategy.FIXED_HEIGHT`\n\n你可以创建自己的容器和内容策略；只需使用子类 `cc.ContainerStrategy`\
  \ 和 `cc.ContentStrategy` 并重写如下所示的方法即可。\n\n### 3.10.7 自定义容器策略\n\n```\nvar CustomContainerStrategy\
  \ = cc.ContainerStrategy.extend({\n    preApply: function (view) {\n        // 此函数在适配过程之前被调用，\n\
  \        // 如果不需要，可以移除该函数\n    },\n\n    apply: function (view, designedResolution)\
  \ {\n        // 应用过程\n    },\n\n    postApply: function (view) {\n        // 此函数在适配过程之后被调用，\n\
  \        // 如果不需要，可以移除该函数\n    }\n});\n```\n\n### 3.10.8 自定义内容策略\n\n```\nvar CustomContentStrategy\
  \ = cc.ContentStrategy.extend({\n    preApply: function (view) {\n        // 此函数在适配过程之前被调用，\n\
  \        // 如果不需要，可以移除该函数\n    },\n\n    apply: function (view, designedResolution)\
  \ {\n        var containerW = cc.canvas.width, containerH = cc.canvas.height;\n\n\
  \        // 计算内容大小、X 轴缩放和 Y 轴缩放的过程\n\n        return this._buildResult(containerW,\
  \ containerH, contentW, contentH, scaleX, scaleY);\n    },\n\n    postApply: function\
  \ (view) {\n        // 此函数在适配过程之后被调用，\n        // 如果不需要，可以移除该函数\n    }\n});\n```\n\
  \n必须在这两者中实现 `apply` 函数。你可以访问 frame、容器以及内容的宽度和高度。\n\n"
- "# 4. 处理输入和事件\n\n## 4.1 引言\n\n处理用户输入是任何游戏的重要组成部分。在 Cocos2d-js 中，用户输入（例如通过触摸、鼠标或键盘）以事件的形式提供。事件机制涉及三个主要部分（见图\
  \ 4-1）。\n\n![A435521_1_En_4_Fig1_HTML.jpg](img/A435521_1_En_4_Fig1_HTML.jpg)\n\n\
  图 4-1. Cocos2d-JS 中的事件机制\n\n### 4.1.1 事件触发器\n\n事件触发器是任何事件的源头。当发生触摸或任何其他输入时，Cocos2d-js\
  \ 系统将触发一个事件作为响应。\n\n### 4.1.2 事件管理器\n\n当任何事件被触发时，事件管理器会收到通知。`EventManager` 是一个单例实例，是\
  \ Cocos2d-js 系统的一部分；它管理所有事件。\n\n### 4.1.3 事件监听器\n\n这是实际事件处理逻辑所在之处。事件管理器会将事件分派给所有事件监听器，并由事件监听器实例进行处理。\n\
  \n## 4.2 触摸事件\n\n有两种可用的触摸事件：单点触摸（`cc.EventListener.TOUCH_ONE_BY_ONE`）和多点触摸（`cc.EventListener.TOUCH_ALL_AT_ONCE`）\n\
  \n### 4.2.1 单点触摸\n\n在 `src` 文件夹中，创建一个名为 `touchevents.js` 的文件，并将以下代码复制进去：\n\n```\n\
  var TouchEventsLayer = cc.Layer.extend({\n    sprite:null,\n    ctor:function ()\
  \ {\n        this._super();\n\n        var size = cc.winSize;\n\n        this.sprite\
  \ = new cc.Sprite(res.Sprite_Image);\n        this.sprite.attr({\n            x:size.width\
  \ / 2,\n            y:size.height / 2\n        });\n        this.addChild(this.sprite,\
  \ 0);\n        this.sprite.tag='TouchTarget';\n\n        //创建事件监听器对象\n        var\
  \ listener = cc.EventListener.create({\n            event: cc.EventListener.TOUCH_ONE_BY_ONE,\n\
  \            swallowTouches: true,\n\n            onTouchBegan: function (touch,\
  \ event) {\n                var target = event.getCurrentTarget();\n           \
  \     var locationInNode = target.convertToNodeSpace(touch.getLocation());\n   \
  \             var s = target.getContentSize();\n                var rect = cc.rect(0,\
  \ 0, s.width, s.height);\n\n                //检查点击区域\n                if (cc.rectContainsPoint(rect,\
  \ locationInNode)) {\n                    cc.log('触摸开始：在精灵内部');\n              \
  \      //返回 true 以启动 OnTouchMove\n                    return true;\n           \
  \     }\n                cc.log('触摸开始：在精灵外部');\n                return false;\n\
  \            },\n            onTouchMoved: function (touch, event) {\n         \
  \       var target = event.getCurrentTarget();\n                target.setPosition(touch.getLocation());\n\
  \            },\n            onTouchEnded: function (touch, event) {\n         \
  \       cc.log('触摸结束');\n            }\n        });\n\n        //将事件监听器添加到精灵\n \
  \       cc.eventManager.addListener(listener, this.sprite);\n        return true;\n\
  \    }\n});\n```\n\n在此示例中，精灵可以通过单点触摸进行拖动。事件监听器使用事件名称 `cc.EventListener.TOUCH_ONE_BY_ONE`\
  \ 创建，并将 `swallowTouches` 设置为 `true`。当多个事件监听器为同一事件名称附加到同一目标时，第一个 `swallowTouches:\
  \ true` 的监听器将吞噬该事件，并且该事件将不会传递给下一个监听器。\n\n```\ncc.eventManager.addListener(listener,\
  \ this.sprite);\n```\n\n在这种情况下，即使精灵是目标，屏幕上的每一次点击都会触发触摸事件。为了确认触摸是否发生在精灵内部，编写了以下代码：\n\
  \n```\nvar target = event.getCurrentTarget();\nvar locationInNode = target.convertToNodeSpace(touch.getLocation());\n\
  var s = target.getContentSize();\nvar rect = cc.rect(0, 0, s.width, s.height);\n\
  \n//检查点击区域\nif (cc.rectContainsPoint(rect, locationInNode)) {\n    cc.log('触摸开始：在精灵内部');\n\
  \    //返回 true 以启动 OnTouchMove\n    return true;\n}\n```\n\n在 `onTouchBegan` 中，检查了触摸是否发生在精灵内部的条件。如果触摸在精灵内部，则返回\
  \ `true`，以便触摸移动的手势将被定向到 `onTouchMoved` 函数；目标位置会根据触摸移动进行更改。\n\n\n\n### 4.2.2 多点触控\n\
  \n多点触控事件监听器可以通过事件名称 `cc.EventListener.TOUCH_ALL_AT_ONCE` 创建。请参考以下代码片段：\n\n```\n\
  1   var listener = cc.EventListener.create({\n2       event: cc.EventListener.TOUCH_ALL_AT_ONCE,\n\
  3       swallowTouch: true,\n4       onTouchesBegan: function (touches, event) {\n\
  5           .......\n6       },\n7       onTouchesMoved: function (touches, event)\
  \ {\n8           .......\n9   },\n10       onTouchesEnded: function (touches, event)\
  \ {\n11           .......\n12       }\n13   });\n```\n\n因此，多点触控的回调与单点触控不同。它包含 `onTouchesBegan`、`onTouchesMoved`\
  \ 和 `onTouchesEnded` 函数。`touches` 对象将包含每次触摸的详细信息，并带有触摸 ID。通常情况下，多点触控可用于地图缩放、多指操作控制等场景。\n\
  \n### 4.3 鼠标事件\n\n与触控事件类似，鼠标事件通过事件名称 `cc.EventListener.MOUSE` 来引用。在 `src` 文件夹中，创建一个名为\
  \ `mouseevents.js` 的文件，并将以下代码复制进去：\n\n```\n1   var MouseEventsLayer = cc.Layer.extend({\n\
  2       sprite:null,\n3       ctor:function () {\n4           this._super();\n6\
  \           var size = cc.winSize;\n8           this.sprite = new cc.Sprite(res.Sprite_Image);\n\
  9           this.sprite.attr({\n10               x: size.width / 2,\n11        \
  \       y: size.height / 2\n12           });\n13           this.addChild(this.sprite,\
  \ 0);\n14           this.sprite.tag='TouchTarget';\n16           //Creating Event\
  \ Listener Object\n17           var listener = cc.EventListener.create({\n18   \
  \            event: cc.EventListener.MOUSE,\n19                   swallowTouches:\
  \ true,\n20                   ismousedown:false,\n21               onMouseDown:\
  \ function (event) {\n22                   var target = event.getCurrentTarget();\n\
  23                   var locationInNode = target.convertToNodeSpace(event.getLocation());\n\
  24                   var s = target.getContentSize();\n25                   var\
  \ rect = cc.rect(0, 0, s.width, s.height);\n28                               //Check\
  \ the click area\n29                   if (cc.rectContainsPoint(rect, locationInNode))\
  \ {\n30                       cc.log('Mouse Down: Inside the sprite');\n31     \
  \                  this.ismousedown=true;\n32                   }\n33          \
  \         cc.log('Mouse Down: Outside the sprite');\n34                   return\
  \ false;\n35               },\n36               onMouseMove: function (event) {\n\
  37                   if(this.ismousedown)\n38                   {\n39          \
