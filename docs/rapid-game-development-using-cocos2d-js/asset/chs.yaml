- "# 开始使用\n\n电子补充材料 本章的在线版本 (doi:[10.​1007/​978-1-4842-2553-0_​1](http://dx.doi.org/10.1007/978-1-4842-2553-0_1))\
  \ 包含补充材料，仅供授权用户获取。\n\n## 引言\n\n早期，制作游戏十分困难，但近年来，大量 2D 和 3D 框架与工具不断发展，简化了游戏开发流程，使开发者能够快速制作出高质量的游戏。`Cocos`\
  \ 是一款广泛应用于 2D 游戏开发的游戏引擎。多年来，`Cocos` 在开发者中奠定了坚实的基础。市场上许多热门游戏都是使用 `Cocos` 制作的。2010\
  \ 年，基于 `Cocos2D` 的 C++ 移植版 `Cocos2d-x` 问世，使开发者能够制作跨平台的 2D 游戏。随后，基于 `Cocos2D` 的 JavaScript\
  \ 移植版 `Cocos2d-js` 推出，使开发者能够制作基于浏览器的游戏，以及使用 `JSB` 的跨平台原生游戏。\n\n`Cocos2D` 凭借其简洁性和丰富的功能，已成为\
  \ 2D 游戏开发的公认标准。在接下来的章节中，我们将深入探讨 `Cocos2d-js` 框架及其功能。读完本书后，你将扎实掌握 `Cocos2D-js` 框架、最佳实践以及丰富的功能集，从而能够快速开发出精彩纷呈的游戏。\n\
  \n让我们开始吧！\n\n## 环境搭建\n\n### Python 安装\n\n大多数情况下，你需要使用 `Cocos` 控制台来创建、运行、编译和部署项目。控制台依赖于\
  \ Python。因此，你首先需要安装 Python。你可以从 Python 官方网站下载：[`https://www.python.org/downloads/`](https://www.python.org/downloads/)。\n\
  \n如果你在 MacOS X 上开发，系统默认已预装 Python。\n\n### Cocos 控制台设置\n\n对于 `Cocos2d-js`，开发环境实际上是\
  \ `Cocos` 控制台的一部分。因此，你必须下载 `Cocos2d-x` 完整包；如果你只想针对 Web 进行开发，也可以选择 HTML5 Lite 版本。\n\
  \n#### 步骤\n\n*   从 [`https://cocos2d-x.org/download`](https://cocos2d-x.org/download)\
  \ 下载 `cocos2d-x` 完整包。\n*   将 zip 文件解压到本地磁盘。\n*   在 Mac 上打开终端，或在 Windows 上打开命令提示符，并导航到解压后的文件夹。\n\
  *   运行以下命令：\n\n```\npython setup.py\n```\n\n此命令将设置 `Cocos` 控制台，它会同时使用 Android 和\
  \ iOS 的环境设置，并更新环境变量。\n\n## 创建你的第一个应用\n\n在你喜欢的位置创建一个单独的文件夹。将你所有的 `Cocos2d-js` 项目都放在一个根文件夹中，这是一个良好的实践。\n\
  \n打开终端，导航到已创建的文件夹路径，然后执行以下命令：\n\n*   `Cocos2d-js` 项目：\n\n```\ncocos new sampleproject\
  \ -l js\n```\n\n*   仅包含 Web 引擎的 `Cocos2d-js` 项目：\n\n```\ncocos new sampleproject\
  \ -l js --no-native\n```\n\n*   在指定目录中创建 `Cocos2d-js` 项目：\n\n```\ncocos new sampleproject\
  \ -l js -d ./Projects\n```\n\n`sampleproject` 是你的项目名称，`-l js` 指定使用 JavaScript 语言。这将创建一个“Hello\
  \ World”示例，你可以将其用作游戏的基础。但在此之前，你需要了解 `Cocos2d-js` 遵循的文件夹结构。\n\n### 文件夹结构\n\n当你创建新项目时，`Cocos`\
  \ 控制台会创建如图 1-1 所示的文件夹结构。\n\n*   `src` - 存放游戏所有 JavaScript 文件的文件夹\n*   `res` - 存放游戏中引用的所有图片和其他资源的文件夹\n\
  *   `frameworks` - 存放实际 `Cocos2d-js` 引擎、用于原生部署的支持文件、`JSB` 等的文件夹。此外，还有配置文件 `project.json`（作为游戏运行时的主要元配置）和\
  \ `manifest.webapp`（包含与 Web 相关的配置信息）。\n\n![A435521_1_En_1_Fig1_HTML.jpg](img/A435521_1_En_1_Fig1_HTML.jpg)\n\
  \n图 1-1. 项目文件夹结构\n\n### `project.json` 的结构\n\n此文件包含你的 `Cocos2d-js` 项目的元信息。让我们看看\
  \ JSON 结构。\n\n*   `version` - 你的应用版本\n*   `name` - 你的应用名称\n*   `description` - 你的应用描述\n\
  *   `launch_path` - `Cocos2d-js` 的启动 HTML 文件；当将应用作为 Web 应用部署/调试时，`Cocos` 控制台会使用该文件\n\
  *   `icons` - 不同尺寸的应用图标；在原生部署时，`Cocos` 控制台会使用该字段\n*   `developer` - 应用开发者的信息\n*\
  \   `default_locale` - 应用的默认本地化设置；表示默认使用的语言\n*   `orientation` - 支持的屏幕方向\n*   `fullscreen`\
  \ - 部署到原生平台时使用\n\n```\n{\n  \"version\": \"1.0\",\n  \"name\": \"sampleproject1\"\
  ,\n  \"description\": \"sampleproject1\",\n  \"launch_path\": \"/index.html\",\n\
  \  \"icons\": {\n    \"128\": \"/res/icon.png\"\n  },\n  \"developer\": {\n    \"\
  name\": \"Cocos2d-html5\",\n    \"url\": \"http://cocos2d-x.org/\"\n  },\n  \"default_locale\"\
  : \"en\",\n  \"installs_allowed_from\": [\n    \"*\"\n  ],\n  \"orientation\": \"\
  portrait-primary\",\n  \"fullscreen\": \"true\"\n}\n```\n\n\n好的，作为一名高级文档工程师和翻译员，我将严格按照您的要求，完成以下英文文本的翻译工作。\n\
  \n\n### 1.3.3 代码\n\n如果你打开 `main.js`，你会看到以下代码。\n\n```\n1   cc.game.onStart = function(){\n\
  2       //如果引用了 loading.js，请将其移除\n3       if(!cc.sys.isNative && document.getElementById(\"\
  cocosLoading\")) 4\n\n5            document.body.removeChild(document.getElementById(\"\
  cocosLoading\"));\n\n7       // 传入 true 以启用视网膜显示，默认禁用以提高性能\n8       cc.view.enableRetina(false);\n\
  9       // 调整视口元数据\n10       cc.view.adjustViewPort(true);\n11       // 设置分辨率策略和设计分辨率尺寸\n\
  12       cc.view.setDesignResolutionSize(800, 450, cc.ResolutionPolicy.SHOW_ALL);\n\
  13       // 当浏览器尺寸改变时，游戏将被调整大小\n14       cc.view.resizeWithBrowserSize(true);\n\
  15       //加载资源\n16       cc.LoaderScene.preload(g_resources, function () {\n17\
  \           cc.director.runScene(new HelloWorldScene());\n18       }, this);\n19\
  \   };\n20   cc.game.run();\n```\n\nCocos2d-js 引擎将首先执行 `onStart` 函数，该函数包含了启动游戏的代码。上述代码中涉及一些配置相关的内容，这些将在后续章节中进行解释。现在，我们将重点关注\
  \ `cc.LoaderScene` 部分。\n\n```\n1   cc.LoaderScene.preload(g_resources, function\
  \ () {\n2        cc.director.runScene(new HelloWorldScene());\n3   }, this);\n```\n\
  \n上述代码加载了“Hello World”场景。`cc.director` 是游戏唯一的控制器实例。这个导演的目的是指导游戏的执行，加载和卸载场景，并获取关于游戏执行环境的信息，例如屏幕尺寸等。在这段代码中，导演使用\
  \ `runScene` 函数来加载 `HelloWorldScene`，该场景在 `preload` 内部被加载。`preload` 将 `g_resources`\
  \ 中指定的资源加载到 Cocos 缓存中，一旦资源加载完成，就会执行一个回调函数，该函数包含加载 `HelloWorldScene` 的代码。\n\n让我们看看\
  \ `HelloWorldScene` 和 `HelloWorldLayer`。打开 `src` 文件夹中的 `app.js`。在 `app.js` 的底部，你会看到类似这样的代码：\n\
  \n```\n1   var HelloWorldScene = cc.Scene.extend({\n2       onEnter:function ()\
  \ {\n3           this._super();\n4           var layer = new HelloWorldLayer();\n\
  5           this.addChild(layer);\n6       }\n7   });\n```\n\n通过调用 `onEnter` 函数来告知场景运行，并且\
  \ `HelloWorldLayer` 作为子节点被注入到场景中。\n\n为了简化问题，我们将修改 `HelloWorldLayer`。\n\n```\n1 \
  \  var HelloWorldLayer = cc.Layer.extend({\n2       sprite:null,\n3       ctor:function\
  \ () {\n4           this._super();\n5           var size = cc.winSize;\n6      \
  \     var helloLabel = new cc.LabelTTF(\"Hello World\", \"Arial\", 38);\n7     \
  \      // 将标签定位在屏幕中央\n8           helloLabel.x = size.width / 2;\n9           helloLabel.y\
  \ = size.height / 2 + 200;\n10           // 将标签作为子节点添加到此层\n11           this.addChild(helloLabel,\
  \ 5);\n\n13           // 添加“HelloWorld”启动画面\n14           this.sprite = new cc.Sprite(res.HelloWorld_png);\n\
  15           this.sprite.attr({\n16                x: size.width / 2,\n17      \
  \          y: size.height / 2\n18           });\n19           this.addChild(this.sprite,\
  \ 0);\n20           return true;\n21       }\n22   });\n```\n\n这一层有两个子节点：一个是 `cc.LabelTTF`，其文本内容为“Hello\
  \ World”；另一个是 `HelloWorld_png` 精灵。在本书中，我们将使用竖屏分辨率。因此，在 `main.js` 中，你应该将以下这行代码：\n\
  \n```\n1   //这是横屏\n2   cc.view.setDesignResolutionSize(800, 450, cc.ResolutionPolicy.SHOW_ALL);\n\
  ```\n\n修改为：\n\n```\n1   //交换宽度和高度，使其变为竖屏\n2   cc.view.setDesignResolutionSize(450,\
  \ 800, cc.ResolutionPolicy.SHOW_ALL);\n```\n\n宽度和高度已被交换。\n\n## 1.4 运行“Hello World”\n\
  \n为简单起见，在本书中，我们将在 Web 浏览器中运行所有代码。但是，你也可以选择将其作为原生应用部署到设备上。要运行此示例，请在终端中导航到项目路径，然后输入以下命令：\n\
  \n```\n1   cocos run -p web\n```\n\n这将在浏览器中启动应用程序；然而，你也可以通过将 `-p param` 改为 `'android'`\
