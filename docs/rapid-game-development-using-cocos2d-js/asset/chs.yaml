  \n图 7-4. 销关节\n\n\n\n#### 7.9.2 滑动关节\n\n与销关节类似，两个物理体可以通过锚点以滑动关节连接。唯一的区别在于，根据物理模拟的结果，锚点之间的距离会在指定的最大和最小长度之间变化。也就是说，两个锚点之间的距离可以随时间变化，但不能低于所提及的最小长度，也不能超过所提及的最大长度。\n\
