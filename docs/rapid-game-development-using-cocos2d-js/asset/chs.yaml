  第一个标签使用文本 `''Default font name''` 创建，并将 `fontname` 指定为空字符串，以便标签回退到系统中的默认字体。


  第二个标签使用加载的字体名称创建；在此示例中，我使用了 `Abduction.ttf`，它在 `resource.js` 中定义如下：


