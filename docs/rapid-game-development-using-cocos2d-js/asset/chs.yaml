  2       ....

  3       BM_Font:"res/bitmapFontTest.fnt",

  4       BM_Font_Png:"res/bitmapFontTest.png",

  5       ....

  6   };

  ```


  如您所见，对于位图字体，相关的 `.png` 文件需要与 `.fnt` 文件一起加载。请参见图 5-1 中的标签示例。


