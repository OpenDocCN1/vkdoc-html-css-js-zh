  overturn_probability: 0.9
  alternative: 文档起始部分，包含封面、ISBN及版权信息，属于前置内容章节。
  counter_evidence:
  - 根据规则，前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章。
  - 第0行是封面图片，第2行是“## ISBN 信息”，第8行是“## 版权声明”，第14行是“## 出版信息”，第20行是献词，第22行才是“# 引言”。
  - 如果在第0行分章，那么从第0行到第21行（引言之前）将被单独划分为一章。虽然这符合“前置内容一章”的规则，但通常这类分章逻辑是将所有前置内容（包括引言）视为一个整体，或者将引言作为独立章节。
  - 原审查员将第0行标记为分章起点，这意味着第0-21行为一章，第22行（引言）开始新章。这在逻辑上是可行的（前置元数据 vs 引言）。
  - 但是，仔细看规则：“前言、序言、致谢、关于作者等正文之前的内容，统一划分为一章”。这里的“一章”通常指整个前置部分作为一个章节单元，或者按照文档的自然结构划分。
  - 然而，注意第22行“# 引言”是一级标题。如果第0行不单独分章，那么第0行到第21行将归入第一章节。如果第22行分章，那么第一章节包含0-21行。
  - 原判断认为第0行是章节起点。这本身没有错，因为它是文档开始。但关键在于它是否是一个“章节”的开始。是的，它是前置信息章节的开始。
  - 让我们看下一个争议点。
  keep_split: true
- 'no': 22
  overturn_probability: 0.0
  alternative: 正文小标题/一级标题
  counter_evidence:
  - 第22行是“# 引言”，是一个一级标题。
  - 根据规则，“前言、序言...统一划分为一章”。
  - 第0行已经作为前置元数据章节的起点。第22行“引言”紧随其后。
  - 如果第0行分章，第22行是否分章？通常“引言”被视为独立的一章或前置部分的重要组成。
  - 原判断在第22行分章。这意味着0-21行为一章（前置元数据），22-115行为一章（引言及环境搭建前的部分？不，环境搭建在116）。
  - 实际上，第116行是“# 环境搭建”。如果22行分章，那么22-115是“引言”章。
  - 但是，很多书籍将“引言”和“环境搭建”合并在前置部分，或者“环境搭建”本身就是第0章/第1章之前的准备。
  - 这里的关键是：第0行分章，第22行分章，第116行分章。这导致前置部分被切成了三块：[0-21], [22-115], [116-202]。
  - 规则说“统一划分为一章”。这通常意味着所有前置内容（包括引言、目录、关于作者等）应该在一个大的章节单元里，或者按照一级标题自然分割。
  - 如果按照一级标题分割，第22行“# 引言”确实是一级标题，应当分章。第116行“# 环境搭建”也是一级标题，应当分章。
  - 所以，维持分章是合理的。
